      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ các lần gọi một hàm theo thời gian. Lần đầu là khởi động lạnh, ô đỏ dài, vì phải dựng môi trường và nạp mã,
      các lần ngay sau dùng lại môi trường nên ngắn, ô xanh. Lâu không có sự kiện thì môi trường bị thu hồi, lần sau lại lạnh,
      và ta chỉ trả tiền cho phần có màu. Gọi xe ôm công nghệ mỗi lúc cần đi ít chuyến cực kỳ tiết kiệm nhưng phải chờ tài
      xế chạy tới đón lúc đầu.
- id: example
  kind: example
  title: Một triệu lần, 200 mi li giây, nửa GB
  checks:
  - alg.faas_gb_seconds(1e6, 0.2, 0.5) == 100000 and round(100000 * 0.0000166667, 2) == 1.67 and round(alg.faas_cost(1e6,
    0.2, 0.5, 0.0000166667, 0.20), 2) == 1.87
  - round(36.5 / alg.faas_cost(1, 0.2, 0.5, 0.0000166667, 0.20) / 1e6, 1) == 19.6 and round(0.05 * 730, 1) == 36.5
  steps:
  - show: '<p><b>Bước 1 — GB-giây</b> (số minh hoạ): $10^6 \cdot 0{,}2 \cdot 0{,}5 = \hl{100\,000}$ GB-giây (lần nhân giây
      nhân GB).</p>

      '
    say: Bước một, với số minh hoạ, tính GB giây bằng 10 mũ 6 lần nhân 0 phẩy 2 giây nhân 0 phẩy 5 GB, bằng 100 nghìn GB giây.
  - show: '<table class="t"><tr><th>khoản tiền</th><th>phép tính</th><th>đô la</th></tr>

      <tr><td>GB-giây</td><td>$100\,000 \cdot 0{,}0000166667$</td><td>≈ 1,67</td></tr>

      <tr><td>số lần gọi</td><td>$1 \cdot 0{,}20$ (1 triệu lần, 0,20 đô la mỗi triệu)</td><td>0,20</td></tr>

      <tr><td>tổng</td><td></td><td>≈ 1,87</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bước hai, cộng hai khoản tiền. Tiền GB giây là 100 nghìn nhân đơn giá, khoảng 1 phẩy 67 đô la. Tiền số lần gọi là
      1 triệu lần nhân 0 phẩy 20 đô la mỗi triệu, bằng 0 phẩy 20 đô la. Tổng khoảng 1 phẩy 87 đô la cho một triệu lần.
  - clear: true
    show: '<p><b>Bước 3 — so với máy ảo</b> 36,5 đô la mỗi tháng: mỗi lần gọi tốn $\frac{1{,}867}{10^6} \approx 0{,}000001867$
      đô la (giữ thêm một chữ số để phép chia không lệch) → hòa vốn $\frac{36{,}5}{0{,}000001867} \approx \hl{19{,}6}$ triệu
      lần mỗi tháng.</p>

      '
    say: Bước ba, so với máy ảo 36 phẩy 5 đô la mỗi tháng. Mỗi lần gọi tốn khoảng 1 phẩy 867 phần triệu đô la, ta giữ thêm
      một chữ số cho phép chia khỏi lệch. Vậy hòa vốn ở 36 phẩy 5 chia số đó, khoảng 19 phẩy 6 triệu lần mỗi tháng.
  - show: '<p><b>Bước 4 — quyết định:</b> dưới khoảng 19,6 triệu lần mỗi tháng, hàm rẻ hơn; nhiều hơn, máy chạy liên tục rẻ
      hơn (nếu một máy gánh nổi) — giống điểm hòa vốn ở bài 5.</p>

      '
    say: Bước bốn, quyết định, dưới khoảng 19 phẩy 6 triệu lần mỗi tháng thì hàm rẻ hơn, nhiều hơn thì máy chạy liên tục rẻ
      hơn, nếu một máy gánh nổi. Đây đúng là bài toán điểm hòa vốn ở bài 5.
- id: check
  kind: check
  title: 'Tự kiểm: tính lại tại điểm hoà vốn'
  checks:
  - round(alg.faas_cost(19.6e6, 0.2, 0.5, 0.0000166667, 0.20), 1) == 36.6 and round(36.5 / alg.faas_cost(1, 0.2, 0.5, 0.0000166667,
    0.20) / 1e6, 1) == 19.6
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>

      <tr><td>tính thẳng tiền hàm với 19,6 triệu lần</td><td>$19{,}6 \cdot 1{,}867$ đô la</td><td>≈ 36,6 đô la ≈ giá máy 36,5
      ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    say: Kiểm bằng đường khác, vì tại điểm hòa vốn hai cách phải tốn bằng nhau, ta tính thẳng tiền hàm với 19 phẩy 6 triệu
      lần. Kết quả khoảng 36 phẩy 6 đô la, gần đúng bằng giá máy 36 phẩy 5 đô la, chênh chỉ do làm tròn. Hàm theo sự kiện
      cắt bỏ toàn bộ chi phí giờ nhàn rỗi nhờ tự động tắt hẳn khi không có lưu lượng đến.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Bỏ qua khởi động lạnh cho đường cần nhanh <b class="red">(lần đầu chậm cả giây)</b>

      <br><span class="note">Gọi ấm 20 ms, khởi động lạnh 800 ms (số minh hoạ): người dùng đầu tiên sau lúc vắng chờ lâu.
      Giảm kích thước gói mã, khởi tạo ngoài hàm xử lý, giữ sẵn vài bản ấm cho đường quan trọng.</span></div>

      '
    say: Lỗi thứ nhất, bỏ qua khởi động lạnh cho đường cần nhanh, nên lần đầu chậm cả giây. Gọi ấm mất 20 mi li giây, còn
      khởi động lạnh mất 800 mi li giây, theo số minh hoạ, nên người dùng đầu tiên sau lúc vắng phải chờ lâu. Hãy giảm
      kích thước gói mã, khởi tạo ở ngoài hàm xử lý, và giữ sẵn vài bản ấm cho đường quan trọng. Gói quá nhiều thư viện
      khổng lồ vào một hàm làm kích thước nén phình to kéo khởi động lạnh lên vài giây.
  - show: ''
    say: Tách gọn mã thực thi và chỉ nạp đúng gói phụ thuộc cần thiết rút thời gian khởi động xuống dưới trăm mi-li giây. Gọn
      nhẹ hoá gói phụ thuộc đưa thời gian khởi động lạnh về dưới ngưỡng cảm nhận của người dùng cuối. Nhét bộ thư viện
      trăm mê-ga-bai vào gói hàm sự kiện kéo thời gian khởi động lạnh lên tới vài giây khó chịu. Bỏ qua giới hạn thời gian
      chạy tối đa khiến tác vụ nén video dài bị ngắt đột ngột giữa chừng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Co giãn vô hạn đè sập cơ sở dữ liệu <b class="red">(mỗi bản một kết nối)</b>

      <br><span class="note">Tải tăng vọt, nhà cung cấp chạy 1000 bản hàm cùng lúc, mỗi bản mở một kết nối: cơ sở dữ liệu
      chỉ nhận 200 (số minh hoạ). Đặt giới hạn đồng thời cho hàm; dùng <b>bộ gộp kết nối</b> (giữ sẵn ít kết nối, cho nhiều
      bản hàm dùng chung) hoặc <b>hàng đợi</b> ở giữa (việc xếp hàng chờ, xử lý dần).</span></div>

      '
    say: Lỗi thứ hai, co giãn vô hạn đè sập cơ sở dữ liệu, vì mỗi bản mở một kết nối. Tải tăng vọt, nhà cung cấp chạy 1000
      bản hàm cùng lúc, mỗi bản mở một kết nối, trong khi cơ sở dữ liệu chỉ nhận 200, theo số minh hoạ. Hãy đặt giới hạn
      đồng thời cho hàm, và dùng bộ gộp kết nối, tức giữ sẵn ít kết nối cho nhiều bản hàm dùng chung. Cách khác là đặt một
      hàng đợi ở giữa, để việc xếp hàng chờ và được xử lý dần.
  - show: ''
    say: Chạy hàm mở kết nối trực tiếp tới cơ sở dữ liệu quan hệ khi có nghìn lượt gọi cùng lúc làm sập sạch số kết nối tối
      đa. Đặt lớp điều phối chung hoặc kho đệm trung gian bảo vệ kho dữ liệu khỏi bão mở kết nối đồng thời. Dùng bộ ghép
      nối dùng chung ngăn hàng nghìn hàm kích hoạt đồng thời làm quá tải cơ sở dữ liệu phía sau. Mở kết nối trực tiếp tới
      cơ sở dữ liệu từ hàng nghìn hàm đồng thời làm cạn sạch hồ chứa kết nối.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Hàm gọi hàm và chờ <b class="red">(trả tiền hai lần cho thời gian chờ)</b>

      <br><span class="note">Hàm A gọi đồng bộ hàm B rồi ngồi chờ: cả hai đều tính GB-giây. Nối bằng hàng đợi hay sự kiện;
      việc dài thì dùng bộ điều phối luồng công việc.</span></div>

      '
    say: Lỗi thứ ba, để hàm gọi hàm rồi chờ, nên trả tiền hai lần cho thời gian chờ. Hàm A gọi đồng bộ hàm B rồi ngồi chờ thì
      cả hai đều tính GB giây. Hãy nối bằng hàng đợi hay sự kiện, còn việc dài thì dùng một bộ điều phối luồng công việc.
  - show: ''
    say: Tiếp tục giữ mô hình hàm cho dịch vụ nhận tải đều liên tục hai tư giờ dễ đắt gấp rưỡi thuê máy ảo cố định. Chuyển
      các luồng xử lý ổn định tải liên tục sang cụm chạy thường trực tránh đắt đỏ khi chạm điểm hoà vốn. Chạy lưu lượng
      đều đặn liên tục hàng triệu lượt mỗi giờ trên hàm sự kiện tốn kém hơn thuê máy ảo chạy thường trực.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.faas_gb_seconds(5e7, 0.1, 1) == 5e6 and round(5e6 * 0.0000166667, 2) == 83.33 and round(alg.faas_cost(5e7, 0.1, 1,
    0.0000166667, 0.20), 2) == 93.33
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>50 triệu lần mỗi tháng, mỗi lần 100 ms, 1 GB, cùng đơn giá. GB-giây và tổng tiền?</td></tr>

      <tr><td>2</td><td>So với máy ảo 36,5 đô la mỗi tháng (giả sử một máy gánh được tải): nên chọn gì?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, 50 triệu lần mỗi tháng, mỗi lần 100 mi li giây, 1 GB, cùng đơn giá. GB giây
      và tổng tiền là bao nhiêu? Câu hai, so với máy ảo 36 phẩy 5 đô la mỗi tháng, giả sử một máy gánh được tải, nên chọn
      gì? Dừng video và làm ra giấy.
    pause: 15
  - show: '<table class="t"><tr><th>khoản</th><th>phép tính</th><th>đô la</th></tr>

      <tr><td>GB-giây</td><td>$5 \cdot 10^7 \cdot 0{,}1 \cdot 1 = 5 \cdot 10^6$ → nhân đơn giá</td><td>≈ 83,33</td></tr>

      <tr><td>số lần gọi</td><td>$50 \cdot 0{,}20$</td><td>10</td></tr>

      <tr><td>tổng</td><td></td><td>$\hl{93{,}33}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Đáp án câu một, tính từng khoản. GB giây bằng 5 nhân 10 mũ 7 nhân 0 phẩy 1 nhân 1, bằng 5 triệu, nhân đơn giá được
      khoảng 83 phẩy 33 đô la. Tiền số lần gọi là 50 triệu nhân 0 phẩy 20 mỗi triệu, bằng 10 đô la. Tổng là 93 phẩy 33 đô
      la. So sánh chi phí hàm nhân triệu lượt gọi với chi phí máy ảo cố định để chỉ ra điểm cắt kinh tế rõ nét.
  - show: '<p>② 50 triệu lần vượt xa điểm hòa vốn → <b>máy ảo</b> chạy liên tục rẻ hơn: $\frac{93{,}33}{36{,}5} \approx 2{,}6$
      lần — tải đều và cao là vùng của máy, không phải của hàm.</p>

      '
    say: Câu hai, 50 triệu lần vượt xa điểm hòa vốn, nên chọn máy ảo chạy liên tục. Hàm đắt hơn khoảng 93 phẩy 33 chia 36
      phẩy 5, gần 2 phẩy 6 lần, vì tải đều và cao là vùng của máy, không phải của hàm.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/CLC/L06
  steps:
  - show: <table class='t'><tr><th>Thực hành CLC:L06</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính chi phí theo số lần gọi và GB-giây</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>calls=2500000 mem1=0.5 ms1=160 mem2=1.0
      ms2=80</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh CLC L06 duong_dan/bai_cua_ban.py</code>
      (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 6 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Từ số lần gọi, dung lượng bộ nhớ và thời gian chạy mỗi
      lần tính theo mi li giây cho hai cấu hình khác nhau, tính tổng tài nguyên theo bộ nhớ nhân giây. Sau đó kiểm tra xem
      hai tổng tài nguyên có bằng nhau hay không.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai CLC:L06</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (quy giây từng lượt)</b></td><td>Chia thời gian mi-li-giây cho một nghìn trước khi nhân bộ nhớ</td></tr><tr><td><b>Bước
      2 (nhân tổng lượt gọi)</b></td><td>Nhân GB-giây mỗi lượt với tổng số lượt gọi cho cả hai cấu hình</td></tr><tr><td><b>Bước
      3 (so sánh tổng phí)</b></td><td>Kiểm xem tăng RAM gấp đôi giảm thời gian một nửa có giữ nguyên phí không</td></tr></table>
    say: Gợi ý cài đặt bài số 6 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 3 dòng khớp định dạng. In đủ ba dòng số nguyên gồm tổng
      tài nguyên cấu hình thứ nhất, tổng tài nguyên cấu hình thứ hai và cờ bằng một nếu hai mức bằng nhau.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>gb_sec_512mb=200000</div><div>gb_sec_1gb=200000</div><div>same_gb_sec=1</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tiền = GB-giây + số lần gọi</span><span class="a">→</span>

      <span class="n">tải thưa, thất thường: hàm rẻ</span><span class="a">→</span>

      <span class="n">tải đều, cao: máy chạy liên tục rẻ</span><span class="a">→</span>

      <span class="n">khởi động lạnh, giới hạn đồng thời, không gọi chờ nhau</span></div>

      '
    say: Tổng kết lại, tiền của hàm gồm GB giây cộng số lần gọi. Tải thưa và thất thường thì hàm rẻ, tải đều và cao thì máy
      chạy liên tục rẻ hơn. Nhớ khởi động lạnh, giới hạn đồng thời, và đừng để hàm gọi chờ nhau. Thuê bao hàm chạy theo sự
      kiện tính tiền theo bộ nhớ trong gán sẵn thay vì chạy máy chủ cố định.
  - show: ''
    say: Hiểu rõ hàm bậc thang chi phí giữa xử lý theo sự kiện và thuê máy cố định tránh hoá đơn tăng vọt bất ngờ khi lưu
      lượng tăng nhanh. Hàm sự kiện mang lại hiệu quả vô đối cho lưu lượng bùng phát ngắt quãng và tự động hoá gắn sự
      kiện. Mô hình tính tiền theo từng mi-li giây toả sáng rực rỡ với lưu lượng gián đoạn bùng phát khó lường.
  - show: '<div class="box key"><b>Tư duy:</b> “không máy chủ” không có nghĩa “không chi phí” — nó đổi chi phí <b>cố định</b>
      thành chi phí <b>theo từng lần</b>, và điều đó chỉ có lợi tới một ngưỡng.</div>

      <p class="note"><b>So sánh hai quy mô:</b> tải thưa 1 triệu lần gọi/tháng tốn $100\,000$ GB-giây (rẻ hơn thuê máy chạy
      suốt); lên ngưỡng cao ~19,6–50 triệu lần gọi đều đặn thì máy chạy liên tục lại rẻ hơn hẳn hàm theo sự kiện.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Điều cần mang theo, không máy chủ không có nghĩa là không chi phí, nó đổi chi phí cố định thành chi phí theo từng
      lần, và điều đó chỉ có lợi tới một ngưỡng. Xét hai mức quy mô, 1 triệu lượt gọi mỗi tháng dùng hàm sự kiện rất rẻ. Vượt
      ngưỡng 20 tới 50 triệu lượt chạy đều, thuê máy chạy suốt lại kinh tế hơn hẳn. Luôn theo dõi điểm hoà vốn để kịp thời
      chuyển các đường ống ổn định tải cao về máy chạy liên tục. Theo dõi định kỳ chi phí tổng để luôn tối ưu giữa hàm sự
      kiện và máy chủ chạy liên tục.
  - clear: true
    show: '<p class="note">Bài sau (bài 7): <b>cơ sở dữ liệu được quản lý</b> — bản sao, khôi phục theo thời điểm, điểm và
      thời gian khôi phục mục tiêu.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 7, ta học cơ sở dữ liệu được quản lý, với bản sao, khôi phục theo thời điểm, và điểm cùng thời gian
      khôi phục mục tiêu. Hẹn gặp bạn ở bài tiếp theo. Bài tiếp theo bàn về cách vận hành cơ sở dữ liệu được quản lý kèm mục
      tiêu khôi phục thời gian thực.
