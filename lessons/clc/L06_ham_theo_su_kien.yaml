scenes:
- id: hook
  kind: hook
  title: Hoá đơn 2 đô la hay 90 đô la
  checks:
  - round(alg.faas_cost(1e6, 0.2, 0.5, 0.0000166667, 0.20), 2) == 1.87 and round(alg.faas_cost(5e7, 0.1, 1, 0.0000166667,
    0.20), 2) == 93.33
  steps:
  - show: '<p>Dịch vụ tạo ảnh thu nhỏ chạy bằng hàm theo sự kiện: mỗi tháng một triệu ảnh, hoá đơn chưa tới <b>2 đô la</b>
      — không có máy chủ nào phải trông. Một dịch vụ khác cũng chạy bằng hàm, 50 triệu lần mỗi tháng, hoá đơn hơn <b>90 đô
      la</b>, trong khi một máy ảo nhỏ chạy cả tháng chỉ khoảng 36,5 đô la (mọi giá trong bài là số minh hoạ).</p>

      <div class="box key">Hôm nay: <b>hàm theo sự kiện</b> — trả theo từng lần chạy, khởi động lạnh, và điểm mà máy chạy
      liên tục trở nên rẻ hơn.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, dịch vụ tạo ảnh thu nhỏ chạy bằng hàm theo sự kiện, mỗi tháng một triệu ảnh, hoá đơn chưa tới 2 đô la,
      và không có máy chủ nào phải trông. Một dịch vụ khác cũng chạy bằng hàm, 50 triệu lần mỗi tháng, hoá đơn hơn 90 đô la,
      trong khi một máy ảo nhỏ chạy cả tháng chỉ khoảng 36 phẩy 5 đô la. Mọi giá nêu trong bài này đều là số minh hoạ. Hôm
      nay ta học hàm theo sự kiện, trả theo từng lần chạy, khởi động lạnh, và điểm mà máy chạy liên tục trở nên rẻ hơn. Khởi
      chạy hàm chỉ lúc có sự kiện thực sự xoá bỏ hoàn toàn tiền máy chạy không tải nhưng lại sinh ra độ trễ khởi động lạnh.
      Hiểu điểm hoà vốn về mức sử dụng so với máy chủ thường và cách giữ ấm gọn nhẹ giúp quyết định chính xác mô hình.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: đổi đơn vị trước khi nhân'
  checks:
  - 200 / 1000 == 0.2 and 512 / 1024 == 0.5 and 10 ** 6 == 1000000 and 0.05 * 730 == 36.5
  steps:
  - show: '<table class="t"><tr><th>đổi</th><th>phép tính</th><th>kết quả</th></tr>

      <tr><td>200 mi li giây ra giây</td><td>$\frac{200}{1000}$</td><td>0,2 giây</td></tr>

      <tr><td>512 MB ra GB (1 GB = 1024 MB)</td><td>$\frac{512}{1024}$</td><td>0,5 GB</td></tr>

      <tr><td>một triệu</td><td>$10^6$</td><td>1 000 000</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Trước hết, đổi đơn vị trước khi nhân, vì đơn giá tính theo giây và GB. 200 mi li giây chia 1000 bằng 0 phẩy 2 giây.
      512 MB chia 1024 bằng 0 phẩy 5 GB, vì bộ nhớ hàm tính 1 GB là 1024 MB. Một triệu viết là 10 mũ 6. Khởi động lạnh xuất
      hiện khi hệ thống cấp mới môi trường chứa và nạp gói thư viện từ đầu trước lúc chạy hàm.
  - show: '<p>Ở bài 5: máy ảo trả <b>theo giờ chạy</b>, dù máy đang rảnh. Một tháng tính 730 giờ: máy 0,05 đô la mỗi giờ (số
      minh hoạ) hết $0{,}05 \cdot 730 = 36{,}5$ đô la.</p>

      '
    say: Ở bài 5, máy ảo trả theo giờ chạy, dù máy đang rảnh. Một tháng tính 730 giờ, nên máy 0 phẩy 05 đô la mỗi giờ, một
      số minh hoạ, hết 0 phẩy 05 nhân 730, bằng 36 phẩy 5 đô la. Thời gian chạy hàm bị giới hạn chặt vài phút kèm trần bộ
      nhớ nên không thể chạy trực tiếp lô nặng nhiều giờ.
- id: sym
  kind: symbol
  title: 'Giải mã: GB-giây, khởi động lạnh, giới hạn'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>hàm theo sự kiện</b></td><td>một đoạn mã chạy khi có sự kiện (ảnh mới, yêu cầu HTTP, tin nhắn), nhà cung
      cấp lo máy và co giãn</td></tr>

      <tr><td><b>GB-giây</b></td><td>số lần gọi nhân thời gian mỗi lần (giây) nhân bộ nhớ cấp (GB) — đơn vị tính tiền chính</td></tr>

      <tr><td><b>khởi động lạnh</b></td><td>lần gọi phải dựng môi trường mới: nạp mã, khởi tạo thư viện — chậm hơn nhiều so
      với gọi “ấm”</td></tr>

      <tr><td><b>giới hạn</b></td><td>thời gian chạy tối đa mỗi lần, bộ nhớ tối đa, số bản chạy đồng thời</td></tr></table>

      <p class="note"><b>Mô hình không cần quản máy chủ (serverless):</b> cách chạy hàm theo sự kiện trả tiền từng lượt không
      tự vận hành máy chủ gọi chung là <b>serverless</b>.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    say: Bảng có bốn khái niệm. Hàm theo sự kiện là một đoạn mã chạy khi có sự kiện, như ảnh mới, yêu cầu HTTP, hay tin nhắn,
      và nhà cung cấp lo máy cùng việc co giãn. GB giây bằng số lần gọi nhân thời gian mỗi lần tính bằng giây, nhân bộ nhớ
      cấp tính bằng GB, là đơn vị tính tiền chính. Khởi động lạnh là lần gọi phải dựng môi trường mới, nạp mã và khởi tạo
      thư viện, nên chậm hơn nhiều so với gọi ấm. Giới hạn gồm thời gian chạy tối đa mỗi lần, bộ nhớ tối đa, và số bản chạy
      đồng thời. Cách vận hành hàm không phải tự quản lý máy chủ nền tảng thường được gọi theo thuật ngữ là hàm không tự quản
      máy chủ. Đơn vị tính tiền kết hợp lượng bộ nhớ cấp phát nhân thời gian thực thi chính xác tới từng mi-li giây.
