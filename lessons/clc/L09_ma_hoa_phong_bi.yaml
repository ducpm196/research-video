  - {sentence: "Dữ liệu không đổi một byte nào.", reason: "ASR chép “Giữ liệu không đổi một bay nào.” (0.857): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "10 mũ 8 byte dữ liệu chia 32 byte khoá được 3 triệu 125 nghìn.", reason: "ASR chép “10 mũ tám bay giữ liệu chia 32 bay khóa được 3 triệu 125.000.” (0.905): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, xoay khoá chính chỉ mã hoá lại các khoá dữ liệu, 50 nghìn nhân 32, bằng 1 triệu 600 nghìn byte, khoảng 1 phẩy 6 MB.", reason: "ASR chép “Đáp án câu một, xoay khóa chính chỉ mã hóa lại các khóa dữ liệu 50.000 nhân 32 bằng 1.600.000 byte, khoảng 1.6 megabyte.” (0.955): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Xoay khoá chính phải mã hoá lại bao nhiêu byte?", reason: "ASR chép “Xoay khóa chính phải mã hóa lại bao nhiêu bay?” (0.9): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với cách làm đúng, mỗi lần đổi chỉ chạm 320 nghìn byte.", reason: "ASR chép “Với cách làm đúng, mỗi lần đổi chỉ chạm 320.000 bai.” (0.933): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Điều cần mang theo, thêm một tầng gián tiếp biến việc khó, như mã hoá lại 1000 GB, thành việc dễ, như mã hoá lại vài trăm nghìn byte.", reason: "ASR chép “Điều cần mang theo, thêm một tầng gián tiếp biến việc khó, như mã hóa lại 1000GB, thành việc dễ, như mã hóa lại vài trăm nghìn byte.” (1.0): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Xoay khoá cho 1 TB dữ liệu"
    checks:
      - "alg.envelope_rewrap_bytes(10000) == 320000"
    steps:
      - show: |
          <p>Chính sách an toàn yêu cầu đổi khoá mã hoá mỗi năm. Nếu một khoá mã hoá trực tiếp 1 TB dữ liệu, mỗi lần đổi là phải đọc, giải mã và mã hoá lại cả 1 TB. Với cách làm đúng, mỗi lần đổi chỉ chạm <b>320 000 byte</b>.</p>
          <div class="box key">Hôm nay: <b>mã hoá phong bì</b> — khoá dữ liệu bọc dữ liệu, khoá chính bọc khoá dữ liệu — và điều mã hoá khi lưu không bảo vệ.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, chính sách an toàn yêu cầu đổi khoá mã hoá mỗi năm. Nếu một khoá mã hoá trực tiếp 1000 GB dữ liệu, mỗi lần đổi là phải đọc, giải mã và mã hoá lại toàn bộ. Với cách làm đúng, mỗi lần đổi chỉ chạm 320 nghìn byte. Hôm nay ta học mã hoá phong bì, khoá dữ liệu bọc dữ liệu, khoá chính bọc khoá dữ liệu, và điều mà mã hoá khi lưu không bảo vệ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: một khoá vừa khoá vừa mở"
    checks:
      - "32 * 8 == 256 and 10 ** 12 // 10 ** 4 == 10 ** 8"
      - "[(d + 3) % 10 for d in (2, 0, 8, 6)] == [5, 3, 1, 9] and [(d - 3) % 10 for d in (5, 3, 1, 9)] == [2, 0, 8, 6] and (1 - 3) % 10 == 8"
    steps:
      - show: |
          <p><b>Mã hoá</b> biến dữ liệu rõ thành <b>bản mã</b> khó đọc; <b>giải mã</b> làm ngược lại. <b>Mã hoá đối xứng</b>: cùng một <b>khoá</b> (một con số bí mật) dùng cho cả hai chiều, như chìa của một cái két.</p>
          <table class="t"><tr><th>ví dụ đồ chơi, khoá = 3</th><th>cách làm</th><th>kết quả</th></tr>
          <tr><td>mã hoá 2 0 8 6</td><td>mỗi chữ số cộng 3, lấy số dư khi chia 10</td><td>5 3 1 9</td></tr>
          <tr><td>giải mã 5 3 1 9</td><td>mỗi chữ số trừ 3, lấy số dư khi chia 10 (1 − 3 = −2 → 8)</td><td>2 0 8 6</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Trước hết, ta cần hiểu mã hoá là gì, mã hoá biến dữ liệu rõ thành bản mã khó đọc, còn giải mã làm ngược lại. Mã hoá đối xứng dùng cùng một khoá, tức một con số bí mật, cho cả hai chiều, như chìa của một cái két. Ví dụ đồ chơi với khoá bằng 3, mã hoá dãy 2 0 8 6 bằng cách cộng 3 vào mỗi chữ số rồi lấy số dư khi chia 10, được 5 3 1 9. Giải mã thì trừ 3 rồi lấy số dư khi chia 10, ví dụ 1 trừ 3 bằng âm 2 thành 8, nên lấy lại đúng 2 0 8 6."
      - clear: true
        show: |
          <p>Mã thật dùng phép toán phức tạp hơn nhiều, gọi là <b>mã khối</b> (xử lý dữ liệu theo từng khối), với khoá rất dài để không ai đoán được. 1 byte = 8 bit, nên khoá 256 bit dài $\frac{256}{8} = 32$ byte. Không có khoá thì bản mã chỉ là dãy byte vô nghĩa.</p>
        say: "Mã thật dùng phép toán phức tạp hơn nhiều, gọi là mã khối, vì nó xử lý dữ liệu theo từng khối, với khoá rất dài để không ai đoán được. Một byte bằng 8 bit, nên khoá 256 bit dài 256 chia 8, bằng 32 byte. Không có khoá thì bản mã chỉ là dãy byte vô nghĩa."
      - show: |
          <p>Muốn đổi chìa két thì phải mở két bằng chìa cũ rồi khoá lại bằng chìa mới — với dữ liệu nghĩa là <b>giải mã rồi mã hoá lại toàn bộ</b>. Dữ liệu càng lớn, việc đổi khoá càng tốn.</p>
        say: "Muốn đổi chìa két thì phải mở két bằng chìa cũ rồi khoá lại bằng chìa mới. Với dữ liệu, điều đó nghĩa là giải mã rồi mã hoá lại toàn bộ, nên dữ liệu càng lớn thì việc đổi khoá càng tốn."

  - id: sym
    kind: symbol
    title: "Giải mã: hai tầng khoá"
    steps:
      - show: |
          <table class="t"><tr><th>thứ</th><th>nằm ở đâu</th><th>làm gì</th></tr>
          <tr><td><b>khoá chính</b> (KEK)</td><td>trong dịch vụ quản lý khoá, không bao giờ rời ra</td><td>mã hoá và giải mã <b>khoá dữ liệu</b></td></tr>
          <tr><td><b>khoá dữ liệu</b> (DEK, 32 byte)</td><td>bản đã mã hoá lưu <b>cạnh</b> dữ liệu; bản rõ chỉ ở bộ nhớ khi dùng</td><td>mã hoá dữ liệu</td></tr>
          <tr><td>dữ liệu</td><td>lưu trữ đối tượng, ổ khối, cơ sở dữ liệu</td><td>—</td></tr></table>
          <p><b>Đọc</b>: gửi khoá dữ liệu đã mã hoá tới dịch vụ quản lý khoá (có kiểm quyền, có ghi nhật ký) → nhận bản rõ → giải mã dữ liệu. Ai không có quyền dùng khoá chính thì không mở được gì.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng có ba thứ. Khoá chính nằm trong dịch vụ quản lý khoá, không bao giờ rời ra ngoài, và chỉ dùng để mã hoá và giải mã khoá dữ liệu. Khoá dữ liệu dài 32 byte, bản đã mã hoá của nó lưu ngay cạnh dữ liệu, còn bản rõ chỉ nằm trong bộ nhớ khi dùng, và nó mã hoá dữ liệu. Dữ liệu nằm ở lưu trữ đối tượng, ổ khối, hay cơ sở dữ liệu. Khi đọc, ta gửi khoá dữ liệu đã mã hoá tới dịch vụ quản lý khoá, nơi kiểm quyền và ghi nhật ký, nhận về bản rõ, rồi giải mã dữ liệu. Ai không có quyền dùng khoá chính thì không mở được gì."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Két lớn khoá bằng chìa nhỏ, chìa nhỏ cất trong két ngân hàng"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g fill="#1f2937" font-size="22"><rect x="40" y="60" width="520" height="220" rx="14" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="300" y="45" text-anchor="middle" font-weight="bold">dữ liệu lớn (đã mã hoá)</text><text x="300" y="175" text-anchor="middle" font-size="26">100 MB mỗi đối tượng</text><rect x="620" y="120" width="250" height="100" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="745" y="165" text-anchor="middle">phong bì</text><text x="745" y="195" text-anchor="middle" font-size="19">khoá dữ liệu 32 byte</text><line x1="560" y1="170" x2="620" y2="170" stroke="#eb6834" stroke-width="4" stroke-dasharray="8 6"/><rect x="980" y="60" width="460" height="220" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1210" y="45" text-anchor="middle" font-weight="bold">dịch vụ quản lý khoá</text><text x="1210" y="160" text-anchor="middle" font-size="26">khoá chính</text><text x="1210" y="195" text-anchor="middle" font-size="19">không bao giờ rời ra ngoài</text><line x1="870" y1="170" x2="980" y2="170" stroke="#059669" stroke-width="4"/><text x="745" y="300" text-anchor="middle" fill="#eb6834">xoay khoá chính: chỉ làm lại phong bì nhỏ</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ hai tầng khoá. Dữ liệu lớn màu xanh được khoá bằng một khoá dữ liệu nhỏ 32 byte, và khoá nhỏ này được bọc trong một phong bì màu cam. Phong bì chỉ mở được bằng khoá chính nằm trong dịch vụ quản lý khoá, nên đổi khoá chính chỉ cần làm lại phong bì nhỏ, không đụng vào dữ liệu lớn."

  - id: example
    kind: example
    title: "Xoay khoá chính chạm bao nhiêu byte?"
    checks:
      - "alg.envelope_rewrap_bytes(10000, 32) == 320000 and round(1e12 / 320000 / 1e6, 1) == 3.1"
    steps:
      - show: |
          <p><b>Bước 1 — một khoá mã hoá trực tiếp 1 TB</b> (ở bài này 1 TB = $10^{12}$ byte = 1000 GB): xoay khoá phải giải mã rồi mã hoá lại $10^{12}$ byte dữ liệu.</p>
        say: "Bước một, nếu một khoá mã hoá trực tiếp 1000 GB dữ liệu, thì xoay khoá phải giải mã rồi mã hoá lại cả 10 mũ 12 byte."
      - show: |
          <p><b>Bước 2 — phong bì:</b> chia 1 TB thành 10 000 đối tượng, mỗi đối tượng một khoá dữ liệu 32 byte riêng:</p>
          $$\frac{10^{12}}{10^4} = 10^8 \text{ byte} = 100 \text{ MB mỗi đối tượng}$$
        focus: [1, 2]
        say: "Bước hai, với mã hoá phong bì, chia 1000 GB thành 10 nghìn đối tượng. Mỗi đối tượng có 10 mũ 12 chia 10 mũ 4, bằng 10 mũ 8 byte, tức 100 MB, cùng một khoá dữ liệu 32 byte riêng."
      - clear: true
        show: |
          <p><b>Bước 3 — xoay khoá chính:</b> chỉ mã hoá lại các khoá dữ liệu: $10\,000 \cdot 32 = \hl{320\,000}$ byte. Dữ liệu không đổi một byte nào.</p>
        say: "Bước ba, xoay khoá chính chỉ cần mã hoá lại các khoá dữ liệu, 10 nghìn nhân 32, bằng 320 nghìn byte. Dữ liệu không đổi một byte nào."
      - show: |
          <p><b>Bước 4 — so sánh:</b></p>
          $$\frac{10^{12}}{320\,000} \approx 3{,}1 \text{ triệu lần ít việc hơn}$$
        say: "Bước bốn, so sánh, 10 mũ 12 chia 320 nghìn, được khoảng 3 phẩy 1 triệu, tức ít việc hơn khoảng 3 phẩy 1 triệu lần."
      - clear: true
        show: |
          <p class="note"><b>Lưu ý về dịch vụ thật:</b> ở một nhà cung cấp lớn, xoay khoá chính tự động <b>giữ lại</b> phiên bản khoá cũ để mở các phong bì cũ, nên không làm lại phong bì nào và không chạm dữ liệu (thông tin tại thời điểm 11/2026). Làm lại phong bì như bước 3 là khi muốn <b>bỏ hẳn</b> khoá chính cũ. Cả hai cách đều không chạm 1 TB dữ liệu.</p>
        say: "Lưu ý về dịch vụ thật, ở một nhà cung cấp lớn, việc xoay khoá chính tự động giữ lại phiên bản khoá cũ để mở các phong bì cũ. Vì vậy không phải làm lại phong bì nào, và cũng không chạm dữ liệu. Cách làm lại phong bì như bước ba dùng khi ta muốn bỏ hẳn khoá chính cũ. Cả hai cách đều không chạm vào 1000 GB dữ liệu."

  - id: check
    kind: check
    title: "Tự kiểm: so trên một đối tượng"
    checks:
      - "10 ** 8 // 32 == 3125000 and 10 ** 12 // 320000 == 3125000"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>một đối tượng: dữ liệu so với khoá</td><td>$\frac{10^8}{32}$</td><td>3 125 000</td></tr>
          <tr><td>cả kho</td><td>$\frac{10^{12}}{320\,000}$</td><td>3 125 000 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, so trên một đối tượng, vì tỉ lệ của mỗi đối tượng cũng là tỉ lệ của cả kho. 10 mũ 8 byte dữ liệu chia 32 byte khoá được 3 triệu 125 nghìn. Tính cho cả kho cũng ra đúng 3 triệu 125 nghìn, tức khoảng 3 phẩy 1 triệu."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tưởng mã hoá khi lưu chống được mọi thứ <b class="red">(ai có quyền đọc vẫn đọc được)</b>
          <br><span class="note">Mã hoá khi lưu chống mất ổ đĩa vật lý, chống đọc trộm tầng lưu trữ. Một vai trò có quyền đọc kho <b>và</b> quyền dùng khoá thì đọc bình thường. Quyền truy cập vẫn là lớp chính (bài 3).</span></div>
        say: "Lỗi thứ nhất, tưởng mã hoá khi lưu chống được mọi thứ, trong khi ai có quyền đọc vẫn đọc được. Mã hoá khi lưu chống mất ổ đĩa vật lý, và chống đọc trộm ở tầng lưu trữ. Một vai trò có quyền đọc kho và quyền dùng khoá thì vẫn đọc bình thường, nên quyền truy cập vẫn là lớp chính, như ở bài 3."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Xoá khoá chính để “dọn dẹp” <b class="red">(dữ liệu mất vĩnh viễn)</b>
          <br><span class="note">Mất khoá chính là mọi khoá dữ liệu bọc bằng nó không mở được nữa. Dịch vụ quản lý khoá thường bắt chờ nhiều ngày trước khi xoá thật — đừng tắt thời gian chờ đó.</span></div>
        say: "Lỗi thứ hai, xoá khoá chính để dọn dẹp, nên dữ liệu mất vĩnh viễn. Mất khoá chính là mọi khoá dữ liệu bọc bằng nó không mở được nữa. Dịch vụ quản lý khoá thường bắt chờ nhiều ngày trước khi xoá thật, đừng tắt thời gian chờ đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Một khoá chính, ai cũng dùng <b class="red">(không tách được quyền)</b>
          <br><span class="note">Mỗi loại dữ liệu nhạy cảm một khoá chính riêng, quyền dùng khoá cấp riêng: nhóm phân tích đọc được kho báo cáo nhưng không giải mã được kho lương.</span></div>
        say: "Lỗi thứ ba, chỉ có một khoá chính và ai cũng dùng, nên không tách được quyền. Hãy cho mỗi loại dữ liệu nhạy cảm một khoá chính riêng, và cấp quyền dùng khoá riêng, để nhóm phân tích đọc được kho báo cáo nhưng không giải mã được kho lương."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.envelope_rewrap_bytes(50000) == 1600000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>50 000 đối tượng, mỗi đối tượng một khoá dữ liệu 32 byte. Xoay khoá chính phải mã hoá lại bao nhiêu byte?</td></tr>
          <tr><td>2</td><td>Một vai trò có quyền đọc kho nhưng <b>không</b> có quyền dùng khoá chính. Nó tải đối tượng về thì đọc được nội dung không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có 50 nghìn đối tượng, mỗi đối tượng một khoá dữ liệu 32 byte. Xoay khoá chính phải mã hoá lại bao nhiêu byte? Câu hai, một vai trò có quyền đọc kho nhưng không có quyền dùng khoá chính. Nó tải đối tượng về thì có đọc được nội dung không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Chỉ mã hoá lại các khoá dữ liệu: $50\,000 \cdot 32 = \hl{1\,600\,000}$ byte ≈ 1,6 MB.</p>
        say: "Đáp án câu một, xoay khoá chính chỉ mã hoá lại các khoá dữ liệu, 50 nghìn nhân 32, bằng 1 triệu 600 nghìn byte, khoảng 1 phẩy 6 MB."
      - show: |
          <p>② <b>Không</b> đọc được (khi kho mã hoá bằng khoá chính do bạn quản lý). Nếu kho tự mã hoá khi lưu, yêu cầu tải bị <b>từ chối</b>, vì tải đối tượng cần quyền giải mã bằng khoá chính (cách làm của một nhà cung cấp lớn, 11/2026). Nếu ứng dụng tự mã hoá trước khi gửi lên, tải về chỉ được bản mã và phong bì. Đây là lớp quyền <b>thứ hai</b>, tách khỏi quyền đọc kho.</p>
        say: "Câu hai, vai trò đó không đọc được, khi kho mã hoá bằng khoá chính do bạn quản lý. Nếu kho tự mã hoá khi lưu, yêu cầu tải bị từ chối, vì tải đối tượng cần quyền giải mã bằng khoá chính. Nếu ứng dụng tự mã hoá trước khi gửi lên, vai trò đó tải về chỉ được bản mã và phong bì. Đây là lớp quyền thứ hai, tách khỏi quyền đọc kho."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khoá dữ liệu bọc dữ liệu</span><span class="a">→</span>
          <span class="n">khoá chính bọc khoá dữ liệu, không rời dịch vụ</span><span class="a">→</span>
          <span class="n">xoay khoá: chỉ làm lại phong bì</span><span class="a">→</span>
          <span class="n">quyền truy cập vẫn là lớp chính; không xoá vội khoá chính</span></div>
        say: "Tổng kết lại, khoá dữ liệu bọc dữ liệu, còn khoá chính bọc khoá dữ liệu và không rời dịch vụ quản lý khoá. Xoay khoá chỉ làm lại phong bì, quyền truy cập vẫn là lớp chính, và đừng xoá vội khoá chính."
      - show: |
          <div class="box key"><b>Tư duy:</b> thêm một <b>tầng gián tiếp</b> biến việc khó (mã hoá lại 1 TB) thành việc dễ (mã hoá lại vài trăm KB).</div>
        say: "Điều cần mang theo, thêm một tầng gián tiếp biến việc khó, như mã hoá lại 1000 GB, thành việc dễ, như mã hoá lại vài trăm nghìn byte."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>khôi phục thảm hoạ nhiều vùng</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học khôi phục thảm hoạ nhiều vùng. Hẹn gặp bạn ở bài tiếp theo."
