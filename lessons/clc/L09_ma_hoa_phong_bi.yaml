id: L09
course: CLC
series: "CLC · Điện toán đám mây"
title: "Bài 9 — Bảo vệ dữ liệu trên đám mây: mã hoá khi lưu, quản lý khoá, mã hoá phong bì"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/clc.yaml L09; audit/clc/verify_clc.py L09; NIST SP 800-57 Part 1 Rev. 5 (2020) — quản lý khoá, khoá mã hoá khoá; tài liệu dịch vụ quản lý khoá của các nhà cung cấp lớn — envelope encryption (bản hiện hành, tên chỉ trên màn hình); AWS KMS Developer Guide, “Rotate AWS KMS keys” (truy cập 2026-11-09, no revision given) — xoay tự động giữ key material cũ, “does not rotate the data keys … or re-encrypt any data”; Amazon S3 User Guide, “Using server-side encryption with AWS KMS keys (SSE-KMS)” (truy cập 2026-11-09, no revision given) — “To download an object encrypted with an AWS KMS key, you need kms:Decrypt permissions for the key”; bài 3, 4"
assumes: [arith, frac, cdot, power, approx]
# Quy ước: khoá dữ liệu (DEK, 32 byte cho mã khối 256 bit) mã hoá dữ liệu; khoá chính (KEK) nằm trong dịch vụ quản lý khoá, KHÔNG rời khỏi đó, chỉ dùng
#   để mã hoá / giải mã các khoá dữ liệu. Xoay khoá chính rồi BỎ khoá cũ = mã hoá lại các khoá dữ liệu (alg.envelope_rewrap_bytes); xoay tự động
#   của AWS KMS giữ key material cũ nên không làm lại phong bì (bước 5 của ví dụ nói rõ). 1 TB = 10^12 byte ở bài này.
#   Phòng thủ: không hướng dẫn tấn công. Tên KMS, DEK, KEK chỉ trên màn hình.
objectives:
  - "Giải thích mã hoá phong bì"
  - "Giải thích vì sao xoay khoá chính không cần mã hoá lại dữ liệu"
  - "Biết giới hạn của mã hoá khi lưu"
