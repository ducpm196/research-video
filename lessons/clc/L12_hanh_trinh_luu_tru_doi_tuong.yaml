          </svg></div>
          <p><b>Điểm nghẽn:</b> các bài toán phân tích dữ liệu lớn cần đọc ngay sau khi ghi; khách phải tự viết mã vá, hoặc thuê thêm một cơ sở dữ liệu để theo dõi đối tượng.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng bốn, trước năm 2020, kho chưa bảo đảm nhất quán mạnh cho mọi thao tác, và Amazon gọi đó là nhất quán cuối cùng. Ghi xong thì dữ liệu đã được nhận và lưu bền, nhưng có một khoảng ngắn chưa phải lần đọc nào cũng thấy. Hình trên cho thấy, đọc ngay sau khi ghi bản 2 có thể vẫn nhận bản 1. Hình dưới là từ ngày 1 tháng 12 năm 2020, đọc ngay sau ghi chắc chắn thấy bản 2. Điểm nghẽn là bài toán phân tích dữ liệu lớn cần đọc ngay sau ghi, nên khách phải tự viết mã vá, hoặc thuê thêm một cơ sở dữ liệu để theo dõi."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. số năm chưa có nhất quán mạnh cho mọi thao tác</td><td>2020 trừ 2006</td><td>$\hlb{14}$ năm</td></tr>
          <tr><td>Bước 2. ghi 1000 tệp rồi liệt kê ngay; 1% chưa hiện (số minh hoạ)</td><td>1000 nhân 0,01</td><td>thiếu $\hl{10}$ tệp, chỉ thấy 990</td></tr>
          <tr><td>Bước 3. sau 1/12/2020</td><td>liệt kê nhất quán mạnh</td><td>thấy đủ $\hlg{1000}$ tệp, thiếu 0</td></tr></table>
          <p class="note">Thực hành: đưa bảo đảm vào <b>nền tảng</b> — mọi khách được hưởng, không đổi giao diện, không thêm tiền, không giảm hiệu năng; lớp vá riêng của khách không còn cần nữa. Điều kiện: bảo đảm này nói về thao tác của chính kho; hệ khác nối vào vẫn phải tự kiểm.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử bằng số. Bước một, từ 2006 tới 2020 là 14 năm kho chưa có nhất quán mạnh cho mọi thao tác. Bước hai, một công việc ghi 1000 tệp rồi liệt kê ngay, nếu 1 phần trăm chưa hiện, một số minh hoạ, thì thiếu 10 tệp, chỉ thấy 990. Bước ba, sau năm 2020 việc liệt kê nhất quán mạnh, nên thấy đủ 1000 tệp. Thực hành rút ra là đưa bảo đảm vào nền tảng, mọi khách cùng hưởng mà không đổi giao diện, không thêm tiền, không giảm hiệu năng. Điều kiện là bảo đảm này chỉ nói về thao tác của chính kho, còn hệ khác nối vào vẫn phải tự kiểm."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2021 tới 2022 — tiếp tục phát triển: mã năm 2006 vẫn chạy"
    stage: {year: "2021 → 2022", scale: "3/2021 hơn 100 nghìn tỉ đối tượng, đỉnh hàng chục triệu yêu cầu mỗi giây; 3/2022 hơn 200 nghìn tỉ đối tượng, trung bình hơn 100 triệu yêu cầu mỗi giây", source: "[B21] [PI22]", practice: "giữ giao diện cũ chạy được, sửa bên dưới không đổi giao diện, không ngừng để nâng cấp; giảm giá nhiều lần, thêm lớp lưu trữ; đo cả phần rất nhỏ như 0,01% lần ghi"}
    checks:
      - "2 * 10**14 // (8 * 10**8) == 250000"
      - "round(2 * 10**14 / (365 * 24 * 3600) / 10**6, 3) == 6.342"
      - "1000000 * 0.0001 == 100"
    steps:
      - show: |
          <table class="t"><tr><th>mốc</th><th>quy mô</th></tr>
          <tr><td>14/3/2021, sinh nhật 15 tuổi</td><td>hơn <b>100 nghìn tỉ</b> đối tượng; đỉnh hàng chục triệu yêu cầu mỗi giây</td></tr>
          <tr><td>14/3/2022</td><td>hơn <b>200 nghìn tỉ</b> đối tượng; trung bình hơn <b>100 triệu</b> yêu cầu mỗi giây</td></tr></table>
          <p>Năm 2021 Amazon viết: mã viết <b>ngày ra mắt</b> vẫn chạy tốt; kho tốt lên “dưới chân bạn”, <b>không đổi giao diện</b>, <b>không ngừng để nâng cấp</b>.</p>
          <p>Ví dụ: họ giảm mạnh độ trễ cho <b>0,01%</b> số lần ghi, nhờ vậy yêu cầu của khách không bị hết giờ chờ rồi phải thử lại.</p>
        focus: [1, "1.2", "1.3", 2, 3]
        say: "Ở chặng năm, bảng bên dưới ghi hai mốc gần đây nhất của kho lưu trữ. Ngày 14 tháng 3 năm 2021, sinh nhật 15 tuổi, kho có hơn 100 nghìn tỉ đối tượng, lúc đỉnh hàng chục triệu yêu cầu mỗi giây. Một năm sau, kho có hơn 200 nghìn tỉ đối tượng, trung bình hơn 100 triệu yêu cầu mỗi giây. Amazon viết rằng mã viết ngày ra mắt vẫn chạy tốt, kho tốt lên mà không đổi giao diện, không ngừng để nâng cấp. Ví dụ, họ giảm mạnh độ trễ cho 0 phẩy 01 phần trăm số lần ghi, để yêu cầu của khách không bị hết giờ chờ rồi phải thử lại."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tăng bao nhiêu lần từ 2006</td><td>200 nghìn tỉ chia 800 triệu</td><td>$\hlb{250\,000}$ lần</td></tr>
          <tr><td>Bước 2. đếm mỗi giây một đối tượng</td><td>200 nghìn tỉ giây chia 31&nbsp;536&nbsp;000 giây mỗi năm</td><td>≈ $\hlb{6{,}342}$ triệu năm</td></tr>
          <tr><td>Bước 3. ứng dụng ghi 1&nbsp;000&nbsp;000 lần mỗi ngày (số minh hoạ)</td><td>1&nbsp;000&nbsp;000 nhân 0,01%</td><td>$\hlg{100}$ lần ghi mỗi ngày bớt bị thử lại</td></tr></table>
          <p class="note">Thực hành: <b>giữ giao diện cũ</b>, sửa bên dưới; giảm giá nhiều lần và thêm lớp lưu trữ rẻ hơn cho dữ liệu ít đọc. Điều kiện: giao diện ban đầu đủ nhỏ để giữ được — chính quyết định của chặng một.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử bằng số. Bước một, 200 nghìn tỉ chia 800 triệu được 250 nghìn lần, khớp con số Amazon công bố. Bước hai, đếm mỗi giây một đối tượng, 200 nghìn tỉ giây chia 31 triệu 536 nghìn giây mỗi năm được khoảng 6 phẩy 342 triệu năm, cũng khớp. Bước ba, một ứng dụng ghi 1 triệu lần mỗi ngày, một số minh hoạ, thì 0 phẩy 01 phần trăm là 100 lần ghi mỗi ngày bớt bị thử lại. Thực hành là giữ giao diện cũ và sửa bên dưới, giảm giá nhiều lần, thêm lớp lưu trữ rẻ hơn. Điều kiện là giao diện ban đầu đủ nhỏ để giữ được, chính là quyết định của chặng một."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "4 * 60 + 17 == 257 and (60 - 37) + 3 * 60 + 54 == 257"
      - "52.56 * 4.9 > 257 * 0.99 and 52.56 * 4.9 < 257 * 1.01"
      - "250000 * 800000000 == 2 * 10**14"
      - "1100 * 1000 == 1100000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>257 phút</td><td>đếm theo đoạn: từ 9:37 tới 10:00 là 23 phút, rồi 3 giờ tới 13:00, thêm 54 phút: 23 + 180 + 54 = 257 ✓</td></tr>
          <tr><td>4,9 năm ngân sách</td><td>nhân ngược: 52,56 nhân 4,9 ≈ 257,5, lệch dưới 1% ✓</td></tr>
          <tr><td>250&nbsp;000 lần</td><td>nhân ngược: 250&nbsp;000 nhân 800 triệu = 200 nghìn tỉ ✓</td></tr>
          <tr><td>1100 máy</td><td>nhân ngược: 1100 máy nhân 1000 yêu cầu = 1,1 triệu yêu cầu mỗi giây ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Đếm theo đoạn, từ 9 giờ 37 tới 10 giờ là 23 phút, thêm 3 giờ tới 13 giờ, rồi thêm 54 phút, cộng lại đúng 257 phút. Nhân ngược, 52 phẩy 56 nhân 4 phẩy 9 được khoảng 257 phẩy 5, lệch dưới 1 phần trăm. Nhân ngược, 250 nghìn nhân 800 triệu đúng bằng 200 nghìn tỉ. Nhân ngược, 1100 máy nhân 1000 yêu cầu đúng bằng 1 phẩy 1 triệu yêu cầu mỗi giây."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lỗi do người gõ sai, chỉ cần người cẩn thận hơn”</td><td>người chạy lệnh được phép, làm theo quy trình có sẵn; Amazon sửa <b>công cụ</b>, không đổ lỗi</td><td>công cụ chặn mức tối thiểu, gỡ chậm; rà mọi công cụ khác</td></tr>
          <tr><td><b class="red">2.</b> “Hệ chịu được mất máy, nên khởi động lại cũng nhanh”</td><td>gỡ máy là việc hằng ngày, nhưng khởi động lại toàn bộ đã nhiều năm chưa làm, mà hệ thì lớn hơn nhiều</td><td>chia ô đủ nhỏ để thử khôi phục ở đúng quy mô hiện tại</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ lỗi do người gõ sai, chỉ cần người cẩn thận hơn. Người chạy lệnh được phép và làm theo quy trình có sẵn, nên Amazon sửa công cụ chứ không đổ lỗi. Hãy cho công cụ chặn mức tối thiểu, gỡ chậm, và rà cả các công cụ khác. Bài học sai thứ hai là nghĩ hệ chịu được mất máy thì khởi động lại cũng nhanh. Gỡ máy là việc hằng ngày, nhưng khởi động lại toàn bộ đã nhiều năm chưa làm, trong khi hệ đã lớn hơn nhiều. Hãy chia ô đủ nhỏ để thử khôi phục ở đúng quy mô hiện tại."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Bảng trạng thái đặt đâu cũng được”</td><td>năm 2017 bảng trạng thái dựa vào chính kho đang hỏng, nên 2 giờ đầu không cập nhật được</td><td>đặt thứ dùng để báo tin ở chỗ hỏng độc lập với thứ nó theo dõi</td></tr>
          <tr><td><b class="red">4.</b> “Phải chép kiến trúc ô của người khổng lồ ngay từ đầu”</td><td>năm 2006 kho bắt đầu bằng giao diện nhỏ; việc chia ô làm dần khi kho đã lớn, theo bài tổng kết 2017</td><td>bắt đầu đơn giản, đo, rồi chia nhỏ khi một lần hỏng đã chạm quá nhiều người dùng</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ bảng trạng thái đặt đâu cũng được. Năm 2017, bảng trạng thái dựa vào chính kho đang hỏng, nên trong 2 giờ đầu không cập nhật được. Hãy đặt thứ dùng để báo tin ở chỗ hỏng độc lập với thứ nó theo dõi. Bài học sai thứ tư là nghĩ phải chép kiến trúc ô của người khổng lồ ngay từ đầu. Năm 2006, kho bắt đầu bằng giao diện nhỏ, còn việc chia ô được làm dần khi kho đã lớn, theo bài tổng kết năm 2017. Hãy bắt đầu đơn giản, đo, rồi chia nhỏ khi một lần hỏng đã chạm quá nhiều người dùng."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "2000000 * 0.01 == 20000 and 200000 // 20000 == 10"
      - "5 * 12 == 60"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: ứng dụng ảnh, 2&nbsp;000&nbsp;000 đối tượng trong một thùng, một vùng, đội 5 người (số minh hoạ)</th></tr>
          <tr><td>1</td><td>bạn viết kịch bản dọn ảnh cũ, xoá theo tiền tố của khoá (phần đầu chung của khoá, ví dụ <code>anh/2019/</code>). Chạy thẳng một lệnh, hay thêm giới hạn mỗi lượt?</td></tr>
          <tr><td>2</td><td>trang trạng thái cho khách: đặt cùng vùng với ứng dụng, hay ở vùng khác với giá thêm 5 đô la mỗi tháng?</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với một ứng dụng ảnh có 2 triệu đối tượng trong một thùng, một vùng, và đội 5 người, đều là số minh hoạ. Câu một, bạn viết kịch bản dọn ảnh cũ, xoá theo tiền tố của khoá, tức phần đầu chung của khoá như tên thư mục năm 2019. Vậy nên chạy thẳng một lệnh, hay thêm giới hạn mỗi lượt? Câu hai, trang trạng thái cho khách nên đặt cùng vùng với ứng dụng, hay ở vùng khác với giá thêm 5 đô la mỗi tháng? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>giới hạn 1% mỗi lượt và dừng khi số còn lại lệch dự kiến</td><td>gõ sai tiền tố khớp cả thùng thì lượt đầu chỉ xoá 2&nbsp;000&nbsp;000 nhân 1% = 20&nbsp;000 rồi dừng</td><td>chậm hơn: xoá đúng 200&nbsp;000 ảnh cũ cần 200&nbsp;000 chia 20&nbsp;000 = 10 lượt</td></tr>
          <tr><td>chạy thẳng một lệnh</td><td>nhanh, ít mã</td><td>gõ sai là mất cả 2&nbsp;000&nbsp;000 trong một lần</td></tr></table>
          <p class="note">Chọn giới hạn mỗi lượt, như bài học năm 2017, và bật phiên bản hoá như bài 4 (kho giữ lại bản cũ khi đối tượng bị ghi đè hay xoá, nên xoá nhầm vẫn lấy lại được). Điều kiện đổi: thùng chỉ chứa dữ liệu tạm dựng lại được — khi đó chạy thẳng cũng chấp nhận được.</p>
        focus: [1, "1.2", "1.2", "1.3", 2, 2]
        say: "Đáp án câu một có hai lựa chọn. Với giới hạn 1 phần trăm mỗi lượt, gõ sai tiền tố khớp cả thùng thì lượt đầu chỉ xoá 2 triệu nhân 1 phần trăm, bằng 20 nghìn đối tượng rồi dừng. Cái giá là chậm hơn, xoá đúng 200 nghìn ảnh cũ cần 200 nghìn chia 20 nghìn, bằng 10 lượt. Chạy thẳng thì nhanh và ít mã, nhưng gõ sai là mất cả 2 triệu đối tượng trong một lần. Nên chọn giới hạn mỗi lượt và bật phiên bản hoá như bài 4, tức kho giữ lại bản cũ khi đối tượng bị ghi đè hay xoá, nên xoá nhầm vẫn lấy lại được. Chỉ khi thùng chứa dữ liệu tạm dựng lại được, chạy thẳng mới chấp nhận được."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>trang trạng thái ở vùng khác</td><td>vùng chính hỏng vẫn báo được tin cho khách</td><td>5 nhân 12 = 60 đô la mỗi năm; thêm một chỗ phải theo dõi</td></tr>
          <tr><td>cùng vùng với ứng dụng</td><td>rẻ, đơn giản</td><td>đúng lúc cần báo tin nhất thì trang cũng hỏng, như năm 2017</td></tr></table>
          <p class="note">Điều kiện đổi: khách chỉ là người trong công ty và đã có kênh báo tin khác, ví dụ nhóm trò chuyện — khi đó đặt cùng vùng là đủ, đừng chép quy mô người khổng lồ.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Đặt trang trạng thái ở vùng khác thì vùng chính hỏng vẫn báo được tin, đổi lại tốn 5 nhân 12, bằng 60 đô la mỗi năm và thêm một chỗ phải theo dõi. Đặt cùng vùng thì rẻ và đơn giản, nhưng đúng lúc cần báo tin nhất thì trang cũng hỏng, như năm 2017. Chỉ khi khách là người trong công ty và đã có kênh báo tin khác, như một nhóm trò chuyện, thì đặt cùng vùng là đủ."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">giao diện nhỏ, hỏng là chuyện thường</span><span class="a">→</span>
          <span class="n">thêm nút là thêm sức</span><span class="a">→</span>
          <span class="n">chặn mức tối thiểu, chia ô</span><span class="a">→</span>
          <span class="n">nhất quán mạnh trong nền tảng</span><span class="a">→</span>
          <span class="n">giữ giao diện, sửa bên dưới</span></div>
        say: "Tổng kết lại hành trình. Năm 2006, kho bắt đầu bằng giao diện nhỏ và coi hỏng là chuyện thường. Khi tăng trưởng, thêm nút là thêm sức. Năm 2017, một lệnh gõ sai dẫn tới chặn mức tối thiểu và chia ô. Năm 2020, nhất quán mạnh được đưa vào nền tảng, và tới 2022 giao diện cũ vẫn giữ trong khi bên dưới liên tục được sửa."
      - show: |
          <div class="box key"><b>Tư duy:</b> ở quy mô lớn, thứ hay hỏng nhất không phải máy mà là <b>việc hiếm khi làm</b> — khởi động lại toàn bộ, lệnh gỡ hàng loạt. Hãy cho công cụ <b>tự chặn</b>, và thử khôi phục ở đúng quy mô hiện tại.</div>
        say: "Điều cần mang theo, ở quy mô lớn, thứ hay hỏng nhất không phải máy mà là việc hiếm khi làm, như khởi động lại toàn bộ hay lệnh gỡ hàng loạt. Hãy cho công cụ tự chặn, và thử khôi phục ở đúng quy mô hiện tại."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá <b>Điện toán đám mây</b>. Từ định nghĩa và trách nhiệm, vùng sẵn sàng, mạng ảo, quyền truy cập, lưu trữ, chi phí, khôi phục thảm hoạ và di chuyển, bạn đã đi tới cách một dịch vụ lớn lên tới hàng trăm nghìn tỉ đối tượng mà vẫn ổn định.</p>
        say: "Đây là bài cuối của khoá điện toán đám mây. Bạn đã đi từ định nghĩa và trách nhiệm, vùng sẵn sàng, mạng ảo, quyền truy cập, lưu trữ, chi phí, khôi phục thảm hoạ và di chuyển. Cuối cùng là cách một dịch vụ lớn lên tới hàng trăm nghìn tỉ đối tượng mà vẫn ổn định. Cảm ơn bạn đã theo học."
