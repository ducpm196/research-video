        focus: [1, 1, 1, 1]
        say: "Hình này dựng theo bài tổng kết sự cố năm 2017 của Amazon. Mọi yêu cầu đọc, ghi, liệt kê, xoá đều phải qua hệ con chỉ mục, nơi đổi khoá thành vị trí của dữ liệu. Khi ghi một đối tượng mới, hệ con cấp chỗ tìm chỗ lưu, và nó cần hệ con chỉ mục chạy đúng. Vì vậy nếu hệ con chỉ mục dừng, cả kho trong vùng dừng theo, đây là điểm then chốt của chặng ba."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2006 — khai sinh: ít tính năng, hỏng là chuyện thường"
    stage: {year: "2006", scale: "ra mắt 14/3/2006; đối tượng 1 byte tới 5 GB, số đối tượng không giới hạn; thiết kế 99,99% sẵn sàng; 0,15 đô la mỗi GB mỗi tháng", source: "[PR06] [B21]", practice: "cố ý ít tính năng, mô hình thùng và khoá đơn giản; phần cứng rẻ nên coi hỏng là bình thường; không điểm hỏng đơn lẻ; trả theo mức dùng"}
    checks:
      - "100 * 0.15 == 15 and 100 * 0.20 == 20 and 15 + 20 == 35"
      - "-(-12 // 5) == 3 and 3 * 5 >= 12 and 2 * 5 < 12"
    steps:
      - show: |
          <p><b>Bài toán lúc đó:</b> mỗi nhà phát triển phải tự lo chỗ lưu dữ liệu cho ứng dụng web. Thông cáo ngày 14/3/2006 gọi S3 là “<b>lưu trữ cho Internet</b>”.</p>
          <table class="t"><tr><th>quyết định năm 2006</th><th>câu trong thông cáo</th></tr>
          <tr><td><b>cố ý ít tính năng</b></td><td>chỉ ghi, đọc, xoá đối tượng từ 1 byte tới <b>5 GB</b>; số đối tượng không giới hạn; mỗi đối tượng một khoá</td></tr>
          <tr><td><b>hỏng là chuyện thường</b></td><td>xây từ phần cứng rẻ, nên máy hỏng thường xuyên mà hệ vẫn chạy; không có điểm hỏng đơn lẻ</td></tr>
          <tr><td><b>thêm máy là thêm sức</b></td><td>thêm nút làm tăng, không làm giảm, độ sẵn sàng và tốc độ; thiết kế 99,99% sẵn sàng</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, mỗi nhà phát triển phải tự lo chỗ lưu dữ liệu cho ứng dụng web. Thông cáo ngày 14 tháng 3 năm 2006 gọi kho mới là lưu trữ cho Internet. Quyết định đầu tiên là cố ý ít tính năng, chỉ ghi, đọc, xoá đối tượng từ 1 byte tới 5 GB, mỗi đối tượng một khoá. Quyết định thứ hai là xây từ phần cứng rẻ, nên coi máy hỏng là chuyện thường, và không có điểm hỏng đơn lẻ. Quyết định thứ ba là thêm máy thì độ sẵn sàng và tốc độ tăng chứ không giảm, với thiết kế 99 phẩy 99 phần trăm sẵn sàng."
      - clear: true
        show: |
          <p>Giá năm 2006: <b>0,15 đô la</b> mỗi GB mỗi tháng để lưu, <b>0,20 đô la</b> mỗi GB truyền đi, không phí tối thiểu.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. lưu 100 GB (số minh hoạ)</td><td>100 nhân 0,15</td><td>$\hlb{15}$ đô la mỗi tháng</td></tr>
          <tr><td>Bước 2. truyền đi 100 GB</td><td>100 nhân 0,20</td><td>$\hlb{20}$ đô la</td></tr>
          <tr><td>Bước 3. tổng một tháng</td><td>15 cộng 20</td><td>$\hlg{35}$ đô la</td></tr>
          <tr><td>Bước 4. tệp 12 GB (số minh hoạ), tối đa 5 GB mỗi đối tượng</td><td>2 đối tượng chỉ chứa 10 GB, 3 đối tượng chứa 15 GB</td><td>cần $\hlg{3}$ đối tượng</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Giá năm 2006 là 0 phẩy 15 đô la mỗi GB mỗi tháng để lưu, và 0 phẩy 20 đô la mỗi GB truyền đi. Bước một, lưu 100 GB, một số minh hoạ, tốn 100 nhân 0 phẩy 15, bằng 15 đô la mỗi tháng. Bước hai, truyền đi 100 GB tốn 20 đô la. Bước ba, cộng lại được 35 đô la cho một tháng. Bước bốn, một tệp 12 GB không vừa một đối tượng 5 GB, hai đối tượng chỉ chứa 10 GB, nên cần 3 đối tượng."
      - show: |
          <div class="box key">Thực hành: bắt đầu bằng <b>giao diện nhỏ</b> — năm 2021 Amazon viết rằng sự đơn giản đó giúp tránh mọi “<b>cánh cửa một chiều</b>”, quyết định không quay lại được. Điều kiện: bài toán của người dùng vừa với kiểu đọc, ghi cả đối tượng theo khoá, như ở bài 4.</div>
        say: "Thực hành rút ra là bắt đầu bằng một giao diện nhỏ. Năm 2021, Amazon viết rằng sự đơn giản đó giúp họ tránh mọi cánh cửa một chiều, tức quyết định không quay lại được. Điều kiện là bài toán của người dùng vừa với kiểu đọc ghi cả đối tượng theo khoá, như ta đã học ở bài 4."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2013 — tăng trưởng: số đối tượng nhân đôi trong chưa tới một năm"
    stage: {year: "2013", scale: "800 triệu đối tượng ngay sau ra mắt; 1 nghìn tỉ sau sáu năm; hơn 2 nghìn tỉ và đỉnh hơn 1,1 triệu yêu cầu mỗi giây vào 4/2013", source: "[B13] [PI22] [PR06] [S17]", practice: "nút giống hệt nhau, phi tập trung, nên tăng sức bằng cách thêm nút; khi đã lớn, tách dịch vụ thành các ô nhỏ để giới hạn bán kính ảnh hưởng"}
    checks:
      - "10**12 // (8 * 10**8) == 1250"
      - "1100000 // 1000 == 1100 and 2 * 1100 == 2200"
    steps:
      - show: |
          <table class="t"><tr><th>mốc</th><th>số đối tượng</th><th>nguồn</th></tr>
          <tr><td>ngay sau ra mắt 2006</td><td>800 triệu</td><td>blog của Amazon, 2022</td></tr>
          <tr><td>tháng 6/2012, sau sáu năm</td><td>1 nghìn tỉ</td><td>blog của Amazon, 2013</td></tr>
          <tr><td>tháng 4/2013, chưa tới một năm sau</td><td>hơn <b>2 nghìn tỉ</b>; đỉnh hơn <b>1,1 triệu</b> yêu cầu mỗi giây</td><td>blog của Amazon, 2013</td></tr></table>
          <p><b>Điểm nghẽn:</b> nhu cầu tăng nhanh hơn mọi kế hoạch; không thể thiết kế lại mỗi lần số đối tượng nhân đôi.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Ở chặng hai, bảng bên dưới ghi ba mốc tăng trưởng của kho lưu trữ. Ngay sau khi ra mắt năm 2006, kho có 800 triệu đối tượng. Phải mất sáu năm, tới tháng 6 năm 2012, kho mới có 1 nghìn tỉ đối tượng. Chưa tới một năm sau, tháng 4 năm 2013, con số đã hơn 2 nghìn tỉ, và lúc đỉnh có hơn 1 phẩy 1 triệu yêu cầu mỗi giây. Điểm nghẽn là nhu cầu tăng nhanh hơn mọi kế hoạch, không thể thiết kế lại mỗi lần số đối tượng nhân đôi."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tăng bao nhiêu lần trong sáu năm</td><td>1&nbsp;000&nbsp;000&nbsp;000&nbsp;000 chia 800&nbsp;000&nbsp;000</td><td>$\hlb{1250}$ lần</td></tr>
          <tr><td>Bước 2. máy cần lúc đỉnh, mỗi máy 1000 yêu cầu mỗi giây (số minh hoạ)</td><td>1&nbsp;100&nbsp;000 chia 1000</td><td>$\hlg{1100}$ máy</td></tr>
          <tr><td>Bước 3. đỉnh tăng gấp đôi</td><td>giữ thiết kế, thêm máy: 2 nhân 1100</td><td>$\hlg{2200}$ máy, không viết lại hệ</td></tr></table>
          <p class="note">Thực hành (thông cáo 2006): mọi nút <b>giống hệt nhau</b>, phi tập trung, nên điểm nghẽn hiệu năng sửa bằng cách thêm nút. Điều kiện: không còn một máy trung tâm mà mọi yêu cầu phải đi qua.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử bằng số. Bước một, 1 nghìn tỉ chia 800 triệu được 1250, tức số đối tượng tăng 1250 lần trong sáu năm. Bước hai, giả sử mỗi máy phục vụ 1000 yêu cầu mỗi giây, một số minh hoạ, thì lúc đỉnh 1 phẩy 1 triệu yêu cầu cần 1100 máy. Bước ba, khi đỉnh tăng gấp đôi, giữ nguyên thiết kế và thêm máy, ta cần 2200 máy mà không phải viết lại hệ. Thông cáo năm 2006 đã ghi điều kiện để làm được vậy, mọi nút giống hệt nhau và phi tập trung. Nói cách khác, không còn một máy trung tâm mà mọi yêu cầu phải đi qua."
      - show: |
          <div class="box warn">Nhưng lớn lên cũng có giá: bài tổng kết năm 2017 ghi rằng kho đã <b>tăng trưởng rất mạnh</b> nhiều năm, và trong lúc đó đội đã tách nhiều phần thành các <b>ô nhỏ</b> để thu hẹp bán kính ảnh hưởng.</div>
        say: "Nhưng lớn lên cũng có giá. Bài tổng kết năm 2017 ghi rằng kho đã tăng trưởng rất mạnh trong nhiều năm, và trong lúc đó đội đã tách nhiều phần thành các ô nhỏ để thu hẹp bán kính ảnh hưởng. Nhưng chưa phải tất cả, như chặng ba sẽ cho thấy."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2017 — quy mô rất lớn: một lệnh gõ sai"
    stage: {year: "2017", scale: "28/2/2017, một vùng lớn; hệ con chỉ mục giữ vị trí mọi đối tượng trong vùng, nhiều năm chưa khởi động lại toàn bộ", source: "[S17]", practice: "công cụ gỡ máy gỡ chậm và không cho xuống dưới mức tối thiểu; rà mọi công cụ vận hành; chia hệ con thành ô để thử được việc khôi phục; bảng trạng thái chạy ở nhiều vùng"}
    checks:
      - "(12 * 60 + 26) - (9 * 60 + 37) == 169 and divmod(169, 60) == (2, 49)"
      - "(13 * 60 + 54) - (9 * 60 + 37) == 257 and divmod(257, 60) == (4, 17)"
      - "(11 * 60 + 37) - (9 * 60 + 37) == 120"
      - "round(365 * 24 * 60 * (1 - 0.9999), 2) == 52.56 and round(257 / 52.56, 1) == 4.9"
      - "100 - 5 == 95 and 95 >= 80 and 100 - 50 == 50 and 50 < 80 and 1 / 10 == 0.1"
    steps:
      - show: |
          <p><b>Chuyện gì xảy ra</b> (bài tổng kết của Amazon): đội đang gỡ rối hệ thống tính tiền chạy chậm. Lúc <b>9:37</b>, một thành viên được phép, làm theo quy trình có sẵn, chạy lệnh gỡ <b>vài máy</b>.</p>
          <p>Một tham số bị gõ sai, nên lệnh gỡ <b>nhiều máy hơn hẳn</b>, gồm máy của <b>hệ con chỉ mục</b> và <b>hệ con cấp chỗ</b>.</p>
          <p>Mất quá nhiều dung lượng, hai hệ con phải <b>khởi động lại toàn bộ</b>. Ở các vùng lớn, việc đó đã <b>nhiều năm</b> chưa làm; kho lại lớn hơn nhiều, nên khởi động và kiểm toàn vẹn siêu dữ liệu lâu hơn dự kiến.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Ở chặng ba, bài tổng kết của Amazon kể rằng đội đang gỡ rối hệ thống tính tiền chạy chậm. Lúc 9 giờ 37 sáng, một thành viên được phép, làm theo quy trình có sẵn, chạy lệnh gỡ vài máy. Một tham số bị gõ sai, nên lệnh gỡ nhiều máy hơn hẳn, gồm máy của hệ con chỉ mục và hệ con cấp chỗ. Mất quá nhiều dung lượng, hai hệ con phải khởi động lại toàn bộ, việc đã nhiều năm chưa làm ở các vùng lớn. Kho lại lớn hơn nhiều, nên khởi động và kiểm toàn vẹn siêu dữ liệu lâu hơn dự kiến."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>mốc (giờ miền Tây nước Mỹ)</th><th>tính từ 9:37</th></tr>
          <tr><td>Bước 1. đọc, liệt kê, xoá chạy lại</td><td>12:26</td><td>$\hlb{169}$ phút = 2 giờ 49 phút</td></tr>
          <tr><td>Bước 2. hệ con cấp chỗ xong, ghi chạy lại</td><td>13:54</td><td>$\hl{257}$ phút = 4 giờ 17 phút</td></tr>
          <tr><td>Bước 3. bảng trạng thái không cập nhật được</td><td>tới 11:37</td><td>$\hl{120}$ phút, vì bảng trạng thái cũng dựa vào kho này</td></tr>
          <tr><td>Bước 4. so với ngân sách ngừng một năm ở 99,99%</td><td>525&nbsp;600 phút nhân 0,0001 = 52,56 phút</td><td>257 chia 52,56 ≈ $\hlg{4{,}9}$ năm ngân sách</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Tính lại các mốc, đều theo giờ miền Tây nước Mỹ. Bước một, đọc, liệt kê và xoá chạy lại lúc 12 giờ 26, tức 169 phút, 2 giờ 49 phút sau. Bước hai, hệ con cấp chỗ xong lúc 13 giờ 54, việc ghi mới chạy lại, tổng cộng 257 phút, tức 4 giờ 17 phút. Bước ba, tới 11 giờ 37, bảng trạng thái không cập nhật được, 120 phút, vì chính nó cũng dựa vào kho này. Bước bốn, ngân sách ngừng một năm ở 99 phẩy 99 phần trăm là 52 phẩy 56 phút, nên 257 phút bằng gần 4 phẩy 9 năm ngân sách."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý (bài tổng kết 2017)</th><th>làm thử (số minh hoạ)</th></tr>
          <tr><td>công cụ <b>gỡ chậm hơn</b>, và <b>chặn</b> mọi lệnh làm một hệ con xuống dưới mức tối thiểu</td><td>hệ con 100 máy, tối thiểu 80: gỡ 5 → còn 95, cho phép; gõ sai thành 50 → còn 50, nhỏ hơn 80, <b>bị chặn</b></td></tr>
          <tr><td><b>rà mọi công cụ vận hành khác</b> để có cùng kiểu kiểm an toàn</td><td>không chỉ sửa đúng công cụ vừa gây sự cố</td></tr>
          <tr><td><b>chia tiếp hệ con chỉ mục thành ô</b>, bắt đầu ngay thay vì cuối năm</td><td>10 ô: khởi động lại một ô chỉ chạm 1 phần 10 số đối tượng</td></tr>
          <tr><td><b>bảng trạng thái chạy ở nhiều vùng</b></td><td>vùng hỏng vẫn báo được tin</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Amazon sửa bốn chỗ. Công cụ gỡ máy chạy chậm hơn, và chặn mọi lệnh làm một hệ con xuống dưới mức tối thiểu. Ví dụ hệ con 100 máy, tối thiểu 80, gỡ 5 còn 95 thì cho phép, gõ sai thành 50 thì bị chặn. Họ rà mọi công cụ vận hành khác để có cùng kiểu kiểm an toàn. Họ bắt đầu ngay việc chia tiếp hệ con chỉ mục thành ô, để mỗi lần khởi động lại chỉ chạm một phần nhỏ, ví dụ 1 phần 10 khi có 10 ô. Cuối cùng, bảng trạng thái được chuyển sang chạy ở nhiều vùng."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2020 — ổn định: nhất quán mạnh mà không thêm tiền"
    stage: {year: "2020", scale: "1/12/2020: mọi thao tác đọc, ghi, liệt kê nhất quán mạnh, mọi vùng, mọi đối tượng cũ và mới; hơn 10 000 hồ dữ liệu", source: "[W20] [B20]", practice: "đưa bảo đảm nhất quán vào nền tảng thay vì để mỗi khách tự viết mã vá; không đổi giao diện, không thêm tiền, không giảm hiệu năng"}
