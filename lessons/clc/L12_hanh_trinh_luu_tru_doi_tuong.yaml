scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ 800 triệu tới 200 nghìn tỉ đối tượng"
    checks:
      - "2 * 10**14 // (8 * 10**8) == 250000"
      - "(13 * 60 + 54) - (9 * 60 + 37) == 257"
    steps:
      - show: |
          <p>Năm 2006, Amazon ra mắt kho lưu trữ đối tượng <b>S3</b>. Ngay sau đó, kho giữ <b>800 triệu</b> đối tượng.</p>
          <p>Năm 2022, kho giữ hơn <b>200 nghìn tỉ</b> đối tượng — gấp <b>250&nbsp;000</b> lần.</p>
          <p>Giữa hai mốc đó, ngày 28/2/2017, một lệnh gõ sai làm kho ở một <b>vùng</b> ngừng phục vụ; <b>4 giờ 17 phút</b> sau mới chạy lại bình thường. <span class="note">(Vùng: một khu vực địa lý gồm nhiều trung tâm dữ liệu; kho ở mỗi vùng chạy riêng.)</span></p>
          <div class="box key">Hôm nay: năm chặng từ 2006 tới 2022 — một dịch vụ lớn lên thế nào mà vẫn ổn định, và đã sửa ra sao khi vấp.</div>
        focus: [1, 1, 2, 3, 3, 4]
        say: "Chào bạn, năm 2006 Amazon ra mắt một kho lưu trữ đối tượng trên đám mây. Ngay sau khi ra mắt, kho giữ 800 triệu đối tượng. Tới năm 2022, kho giữ hơn 200 nghìn tỉ đối tượng, gấp 250 nghìn lần. Giữa hai mốc đó, ngày 28 tháng 2 năm 2017, một lệnh gõ sai làm kho ở một vùng ngừng phục vụ, 4 giờ 17 phút sau mới chạy lại bình thường. Vùng ở đây là một khu vực địa lý gồm nhiều trung tâm dữ liệu, và kho ở mỗi vùng chạy riêng. Hôm nay ta đi qua năm chặng, để thấy một dịch vụ lớn lên mà vẫn ổn định, và đã sửa ra sao khi vấp."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "round(30 * 24 * 60 * (1 - 0.9999), 2) == 4.32"
      - "10**7 * 10**4 == 10**11"
      - "2 * 100 == 200"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 1</td><td><b>độ sẵn sàng</b>: phần thời gian dịch vụ trả lời được</td><td>99,99% trong 30 ngày = 43&nbsp;200 phút → được ngừng 4,32 phút</td></tr>
          <tr><td>bài 4</td><td><b>lưu trữ đối tượng</b>: đọc, ghi cả đối tượng theo <b>khoá</b>; độ bền thiết kế mười một số 9</td><td>10 triệu đối tượng → trung bình mất 1 đối tượng mỗi 10&nbsp;000 năm</td></tr>
          <tr><td>bài 7</td><td><b>thời gian khôi phục</b>: từ lúc hỏng tới lúc chạy lại</td><td>hỏng lúc 9 giờ, chạy lại lúc 10 giờ → 1 giờ</td></tr>
          <tr><td>bài 10</td><td><b>khôi phục thảm hoạ</b>: chạy ở 2 vùng, mỗi vùng gánh đủ 100% tải</td><td>dung lượng thường trực gấp đôi: 200%</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 1, độ sẵn sàng là phần thời gian dịch vụ trả lời được, nên 99 phẩy 99 phần trăm của 43 nghìn 200 phút cho phép ngừng 4 phẩy 32 phút. Ở bài 4, lưu trữ đối tượng đọc ghi cả đối tượng theo khoá, và 10 triệu đối tượng thì trung bình mất 1 đối tượng mỗi 10 nghìn năm. Ở bài 7, thời gian khôi phục tính từ lúc hỏng tới lúc chạy lại, ví dụ từ 9 giờ tới 10 giờ là 1 giờ. Ở bài 10, chạy ở hai vùng mà mỗi vùng gánh đủ tải thì dung lượng thường trực gấp đôi."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>thùng</b> và <b>khoá</b></td><td>thùng chứa bao nhiêu đối tượng cũng được; mỗi đối tượng có một khoá là một chuỗi</td></tr>
          <tr><td><b>hệ con chỉ mục</b></td><td>giữ siêu dữ liệu (dữ liệu mô tả đối tượng: tên, kích thước, quyền) và <b>vị trí</b> của mọi đối tượng trong vùng</td></tr>
          <tr><td><b>hệ con cấp chỗ</b></td><td>cấp chỗ lưu cho đối tượng mới; cần hệ con chỉ mục chạy đúng</td></tr>
          <tr><td><b>ô</b> (cell)</td><td>một phần nhỏ, độc lập của dịch vụ; hỏng một ô chỉ ảnh hưởng phần của ô đó</td></tr>
          <tr><td><b>nhất quán cuối cùng</b></td><td>ghi xong rồi, nhưng một lúc ngắn sau mới đọc, liệt kê thấy</td></tr>
          <tr><td><b>nhất quán mạnh đọc sau ghi</b></td><td>ghi xong là mọi lần đọc, liệt kê sau đó thấy ngay bản mới</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Thùng chứa bao nhiêu đối tượng cũng được, và mỗi đối tượng có một khoá là một chuỗi ký tự. Hệ con chỉ mục giữ siêu dữ liệu, tức dữ liệu mô tả đối tượng như tên, kích thước và quyền, cùng vị trí của mọi đối tượng trong vùng. Hệ con cấp chỗ cấp chỗ lưu cho đối tượng mới, và nó cần hệ con chỉ mục chạy đúng. Ô là một phần nhỏ, độc lập của dịch vụ, hỏng một ô chỉ ảnh hưởng phần của ô đó. Nhất quán cuối cùng nghĩa là ghi xong rồi, nhưng một lúc ngắn sau mới đọc thấy. Nhất quán mạnh đọc sau ghi nghĩa là ghi xong thì mọi lần đọc sau đó thấy ngay bản mới."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2006</text><text x="160" y="200">ít tính năng</text><text x="160" y="232">hỏng là chuyện thường</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2013</text><text x="500" y="200">2 nghìn tỉ đối tượng</text><text x="500" y="232">thêm máy là thêm sức</text>
          <circle cx="850" cy="150" r="15" fill="#e11d48"/><text x="850" y="108" font-weight="bold">2017</text><text x="850" y="200">lệnh gõ sai</text><text x="850" y="232">chặn tối thiểu, chia ô</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2020</text><text x="1200" y="200">nhất quán mạnh</text><text x="1200" y="232">không thêm tiền</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2021 → 2022</text><text x="1540" y="200">mã năm 2006 vẫn chạy</text><text x="1540" y="232">sửa bên dưới giao diện</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2006, kho ra đời với rất ít tính năng, và coi máy hỏng là chuyện thường. Năm 2013, kho có 2 nghìn tỉ đối tượng, nhờ thiết kế thêm máy là thêm sức, rồi năm 2017 một lệnh gõ sai dẫn tới chặn mức tối thiểu và chia ô. Năm 2020 kho có nhất quán mạnh mà không thêm tiền, và tới 2022, mã viết năm 2006 vẫn chạy trong khi bên dưới liên tục được sửa."

  # ───────────────────────── 5. CƠ CHẾ ─────────────────────────
  - id: mechanism
    kind: concept
    title: "Bên trong một yêu cầu: chỉ mục, cấp chỗ, lưu trữ"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
