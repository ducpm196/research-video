# Quy ước: “kho lưu trữ đối tượng” = S3 (tên chỉ trên màn hình); “hệ con chỉ mục” = index subsystem (giữ siêu dữ liệu và vị trí mọi đối tượng);
#   “hệ con cấp chỗ” = placement subsystem; “ô” = cell; “bán kính ảnh hưởng” = blast radius; “nhất quán cuối cùng” = eventual consistency;
#   “nhất quán mạnh đọc sau ghi” = strong read-after-write consistency; “bảng trạng thái” = Service Health Dashboard.
#   Mọi sự kiện và con số có nguồn ghi trong audit/clc/sources_L12.md. Con số khác là phép tính lại (checks) hoặc “(số minh hoạ)”:
#   100 GB, tệp 12 GB, 1000 yêu cầu mỗi giây mỗi máy, 100 máy / tối thiểu 80, 10 ô, 1000 tệp và 1% đọc thấy bản cũ, 1 000 000 lần ghi mỗi ngày,
#   ứng dụng ảnh 2 000 000 đối tượng, 5 đô la mỗi tháng đều là SỐ MINH HOẠ.
#   Lời đọc không nói “S3”, “AWS”, “GET/PUT/LIST”, “cell”, “Hadoop”: nói “kho lưu trữ đối tượng của Amazon”, “đọc, ghi, liệt kê”, “ô”.
#   Phát âm “Amazon”: lexicon_vi.CLC.yaml (probe audit/clc/probes/p1_hanh_trinh.md).
objectives:
  - "Kể lại hành trình của kho lưu trữ đối tượng qua năm chặng từ 2006 tới 2022, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại thời gian ngừng của sự cố 2017, ngân sách ngừng của độ sẵn sàng 99,99% và hệ số tăng trưởng số đối tượng"
  - "Chọn cách bảo vệ một kịch bản vận hành và chỗ đặt trang trạng thái hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"
