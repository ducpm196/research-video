id: L01
course: CLC
series: "CLC · Điện toán đám mây"
title: "Bài 1 — Vùng, vùng sẵn sàng và thiết kế chịu lỗi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/clc.yaml L01; audit/clc/verify_clc.py L01; tài liệu “Regions and Availability Zones” của các nhà cung cấp lớn (bản hiện hành, tên chỉ trên màn hình); M. Nygard, Release It! (bản 2, 2018), chương 4; bài 0"
assumes: [arith, frac, power, cdot, approx, sub]
# Quy ước: độ sẵn sàng = tỉ lệ thời gian dùng được. Song song n bản hỏng ĐỘC LẬP: 1 − (1 − a)^n (alg.parallel_availability); nối tiếp: nhân.
#   Một năm = 8760 giờ. Con số 99,5% mỗi vùng sẵn sàng và 99,95% của bộ điều khiển chung là SỐ MINH HOẠ.
objectives:
  - "Giải thích miền lỗi: vùng và vùng sẵn sàng"
  - "Tính độ sẵn sàng khi dự phòng qua nhiều vùng sẵn sàng"
  - "Nhận ra phụ thuộc chung làm dự phòng vô hiệu"
asr_reviewed:
  - {sentence: "Hôm nay ta học vùng và vùng sẵn sàng, các miền lỗi của đám mây, và cách tính lợi ích của dự phòng.", reason: "ASR chép “Hôm nay ta học vùng và vùng sẵn sàng các miền lỗi của đám may và cách tính lợi íp của dự phong.” (0.87): lệch âm/thanh thuần Việt: mây/may, ích/íp, phòng/phong — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một trung tâm dữ liệu mất điện"
    checks:
      - "round(0.005 * 8760, 1) == 43.8 and round((1 - alg.parallel_availability(0.995, 2)) * 8760 * 60, 1) == 13.1"
    steps:
      - show: |
          <p>Một trung tâm dữ liệu mất điện vì sét đánh trạm biến áp. Ứng dụng chạy trong đúng trung tâm đó ngừng hẳn. Ứng dụng khác chạy song song ở <b>hai</b> trung tâm cách nhau vài chục km vẫn phục vụ bình thường. Với 99,5% mỗi nơi, một nơi là khoảng <b>43,8 giờ</b> gián đoạn mỗi năm; hai nơi độc lập chỉ còn khoảng <b>13 phút</b>.</p>
          <div class="box key">Hôm nay: <b>vùng và vùng sẵn sàng</b> — các miền lỗi của đám mây, và cách tính lợi ích của dự phòng.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một trung tâm dữ liệu mất điện vì sét đánh trạm biến áp. Ứng dụng chạy trong đúng trung tâm đó ngừng hẳn. Một ứng dụng khác chạy song song ở hai trung tâm cách nhau vài chục ki-lô-mét vẫn phục vụ bình thường. Với 99 phẩy 5 phần trăm mỗi nơi, một nơi là khoảng 43 phẩy 8 giờ gián đoạn mỗi năm, còn hai nơi độc lập chỉ còn khoảng 13 phút. Hôm nay ta học vùng và vùng sẵn sàng, các miền lỗi của đám mây, và cách tính lợi ích của dự phòng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm thành giờ, và xác suất hai việc độc lập"
    checks:
      - "round(0.01 * 8760, 1) == 87.6 and 365 * 24 == 8760 and round(0.1 * 0.1, 2) == 0.01"
      - "round(1000 * 0.1) == 100 and round(100 * 0.1) == 10 and 10 / 1000 == 0.01 == round(0.1 * 0.1, 2) and round(1 - 0.01, 2) == 0.99"
    steps:
      - show: |
          <p>Một năm có $365 \cdot 24 = 8760$ giờ. Độ sẵn sàng 99% nghĩa là <b>1%</b> thời gian không dùng được: $0{,}01 \cdot 8760 = 87{,}6$ giờ mỗi năm.</p>
        say: "Trước hết, một năm có 365 nhân 24, bằng 8760 giờ. Độ sẵn sàng 99 phần trăm nghĩa là 1 phần trăm thời gian không dùng được, tức 0 phẩy 01 nhân 8760, bằng 87 phẩy 6 giờ mỗi năm."
      - show: |
          <p><b>Hai việc độc lập</b>: việc này xảy ra hay không <b>không làm đổi</b> khả năng xảy ra của việc kia. Khi đó, xác suất cả hai <b>cùng</b> xảy ra bằng <b>tích</b> hai xác suất.</p>
        say: "Nhắc lại từ đầu, hai việc gọi là độc lập khi việc này xảy ra hay không cũng không làm đổi khả năng xảy ra của việc kia. Khi đó, xác suất cả hai cùng xảy ra bằng tích hai xác suất."
      - clear: true
        show: |
          <p>Vì sao là tích? Theo dõi hai bóng đèn trong 1000 ngày, mỗi bóng hỏng với xác suất 0,1, hỏng độc lập:</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>số ngày</th></tr>
          <tr><td>bóng A hỏng</td><td>$1000 \cdot 0{,}1$</td><td>100</td></tr>
          <tr><td>trong 100 ngày đó, bóng B cũng hỏng</td><td>$100 \cdot 0{,}1$</td><td>10</td></tr>
          <tr><td>tỉ lệ ngày cả hai cùng hỏng</td><td>$\frac{10}{1000}$</td><td>$0{,}01 = 0{,}1 \cdot 0{,}1$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Để thấy vì sao lại là tích, ta theo dõi hai bóng đèn trong 1000 ngày, mỗi bóng hỏng với xác suất 0 phẩy 1 và hỏng độc lập. Bóng A hỏng khoảng 1000 nhân 0 phẩy 1, bằng 100 ngày. Vì bóng B không bị bóng A ảnh hưởng, trong 100 ngày đó nó cũng hỏng một phần mười, tức 10 ngày. Vậy cả hai cùng hỏng 10 trên 1000 ngày, bằng 0 phẩy 01, đúng bằng 0 phẩy 1 nhân 0 phẩy 1."
      - show: |
          <p><b>Phần bù</b>: “hệ còn chạy” và “mọi bản cùng hỏng” là hai khả năng bù nhau, cộng lại bằng 1. Hai bóng mắc song song, phòng chỉ tối khi cả hai cùng hỏng: phòng còn sáng với xác suất $1 - 0{,}01 = 0{,}99$.</p>
        say: "Thêm một ý nữa, hệ còn chạy và mọi bản cùng hỏng là hai khả năng bù nhau, nên cộng lại bằng 1. Nếu hai bóng mắc song song, phòng chỉ tối khi cả hai cùng hỏng, nên phòng còn sáng với xác suất 1 trừ 0 phẩy 01, bằng 0 phẩy 99."

  - id: sym
    kind: symbol
    title: "Giải mã: vùng, vùng sẵn sàng, song song và nối tiếp"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>vùng</b></td><td>một khu vực địa lý (một thành phố, một nước), độc lập với vùng khác</td></tr>
          <tr><td><b>vùng sẵn sàng</b></td><td>một hay vài trung tâm dữ liệu trong vùng, điện và mạng riêng, cách nhau đủ xa để không cùng hỏng, đủ gần để độ trễ chỉ vài mi li giây</td></tr>
          <tr><td>song song (hỏng độc lập)</td><td>$1 - (1 - a)^n$: chỉ ngừng khi <b>mọi</b> bản cùng hỏng</td></tr>
          <tr><td>nối tiếp</td><td>$a_1 \cdot a_2 \cdots$: ngừng khi <b>một</b> khâu bất kỳ hỏng</td></tr></table>
        introduces: [dots]
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn khái niệm. Vùng là một khu vực địa lý như một thành phố hay một nước, độc lập với vùng khác. Vùng sẵn sàng là một hay vài trung tâm dữ liệu trong vùng, có điện và mạng riêng, cách nhau đủ xa để không cùng hỏng, nhưng đủ gần để độ trễ chỉ vài mi li giây. Ghép song song với các bản hỏng độc lập cho độ sẵn sàng bằng 1 trừ 1 trừ a mũ n, vì hệ chỉ ngừng khi mọi bản cùng hỏng. Ghép nối tiếp cho tích các độ sẵn sàng, vì hệ ngừng khi một khâu bất kỳ hỏng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Song song phía sau, nối tiếp phía trước"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="arC1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="260" y1="165" x2="380" y2="165" marker-end="url(#arC1)"/><path d="M640,165 C700,165 700,85 790,85" marker-end="url(#arC1)"/><path d="M640,165 C700,165 700,245 790,245" marker-end="url(#arC1)"/></g><g font-size="24" text-anchor="middle" fill="#1f2937"><rect x="40" y="120" width="220" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="150" y="172">người dùng</text><rect x="385" y="110" width="255" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="512" y="158">bộ cân bằng tải</text><text x="512" y="192" font-size="20">nối tiếp</text><rect x="795" y="40" width="330" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="960" y="80">vùng sẵn sàng 1</text><text x="960" y="112" font-size="20">điện, mạng riêng</text><rect x="795" y="200" width="330" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="960" y="240">vùng sẵn sàng 2</text><text x="960" y="272" font-size="20">điện, mạng riêng</text><text x="1310" y="150" font-size="22">song song:</text><text x="1310" y="182" font-size="22">ngừng khi cả hai hỏng</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ đường đi của một yêu cầu. Bộ cân bằng tải đứng nối tiếp, nó hỏng thì cả hệ ngừng. Phía sau là hai vùng sẵn sàng đứng song song, có điện và mạng riêng, nên hệ chỉ ngừng khi cả hai cùng hỏng một lúc."

  - id: example
    kind: example
    title: "Hai vùng sẵn sàng 99,5%"
    checks:
      - "round(alg.parallel_availability(0.995, 2) * 100, 4) == 99.9975 and round((1 - alg.parallel_availability(0.995, 2)) * 8760 * 60, 1) == 13.1"
    steps:
      - show: |
          <p><b>Bước 1</b> — một vùng sẵn sàng 99,5%: không dùng được $0{,}005 \cdot 8760 \approx 43{,}8$ giờ mỗi năm.</p>
        say: "Bước một, một vùng sẵn sàng có độ sẵn sàng 99 phẩy 5 phần trăm, nên không dùng được 0 phẩy 005 nhân 8760, khoảng 43 phẩy 8 giờ mỗi năm."
      - show: |
          <p><b>Bước 2</b> — hai vùng hỏng <b>độc lập</b>: cả hai cùng hỏng với xác suất $0{,}005 \cdot 0{,}005 = 0{,}000\,025$.</p>
          $$1 - 0{,}005^2 = \hl{99{,}9975\%}$$
        focus: [1, 2]
        say: "Bước hai, hai vùng hỏng độc lập, nên cả hai cùng hỏng với xác suất 0 phẩy 005 nhân 0 phẩy 005, bằng 0 phẩy 000025. Độ sẵn sàng là 1 trừ số đó, bằng 99 phẩy 9975 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>cách chạy (mỗi vùng sẵn sàng 99,5%)</th><th>độ sẵn sàng</th><th>gián đoạn mỗi năm</th></tr>
          <tr><td>1 vùng sẵn sàng</td><td>99,5%</td><td>≈ 43,8 giờ</td></tr>
          <tr><td>2 vùng, hỏng độc lập</td><td>99,9975%</td><td>$0{,}000\,025 \cdot 8760 \cdot 60 \approx 13{,}1$ phút</td></tr></table>
          <p><b>Bước 3</b> — thêm một vùng sẵn sàng chia thời gian gián đoạn cho 200.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước ba, đổi ra thời gian. Một vùng sẵn sàng gián đoạn khoảng 43 phẩy 8 giờ mỗi năm. Hai vùng chỉ còn 0 phẩy 000025 nhân 8760 nhân 60, khoảng 13 phẩy 1 phút. Vậy thêm một vùng sẵn sàng chia thời gian gián đoạn cho 200."
      - show: |
          <p><b>Bước 4</b> — nếu cả hai vùng cùng dựa vào một bộ điều khiển chung 99,95% (số minh hoạ, nối tiếp): $0{,}999975 \cdot 0{,}9995 \approx 99{,}9475\%$ → gián đoạn ≈ <b>4,6 giờ</b> mỗi năm, gấp 21 lần 13,1 phút. Dự phòng chỉ giúp khi hai nơi <b>thật sự</b> độc lập.</p>
        say: "Bước bốn, nếu cả hai vùng cùng dựa vào một bộ điều khiển chung có độ sẵn sàng 99 phẩy 95 phần trăm, một số minh hoạ, thì khâu chung này đứng nối tiếp. Tích là khoảng 99 phẩy 9475 phần trăm, tức gián đoạn khoảng 4 phẩy 6 giờ mỗi năm, gấp 21 lần 13 phẩy 1 phút. Dự phòng chỉ giúp khi hai nơi thật sự độc lập."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê bốn khả năng"
    checks:
      - "round(0.995 * 0.995 + 2 * 0.995 * 0.005 + 0.005 ** 2, 12) == 1 and round(1 - 0.005 ** 2, 6) == 0.999975"
      - "round((1 - 0.999975 * 0.9995) * 8760, 1) == 4.6 and round(4.6 * 60 / 13.1) == 21"
    steps:
      - show: |
          <table class="t"><tr><th>vùng 1</th><th>vùng 2</th><th>xác suất</th><th>hệ chạy?</th></tr>
          <tr><td>chạy</td><td>chạy</td><td>$0{,}995^2 \approx 0{,}990\,025$</td><td>có</td></tr>
          <tr><td>chạy</td><td>hỏng</td><td>$0{,}995 \cdot 0{,}005 = 0{,}004\,975$</td><td>có</td></tr>
          <tr><td>hỏng</td><td>chạy</td><td>$0{,}004\,975$</td><td>có</td></tr>
          <tr><td>hỏng</td><td>hỏng</td><td>$0{,}000\,025$</td><td class="red">không</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Kiểm bằng đường khác, vì hai vùng độc lập, ta liệt kê cả bốn khả năng. Cả hai chạy có xác suất khoảng 0 phẩy 990025. Vùng 1 chạy, vùng 2 hỏng có xác suất 0 phẩy 004975. Ngược lại cũng 0 phẩy 004975. Chỉ ô cả hai hỏng, xác suất 0 phẩy 000025, làm hệ ngừng, và bốn số cộng lại đúng bằng 1."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "round(alg.parallel_availability(0.995, 2) * 0.9995 * 100, 4) == 99.9475"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên phụ thuộc chung <b class="red">(dự phòng không cứu được)</b>
          <br><span class="note">Hai vùng sẵn sàng cùng dựa vào một dịch vụ điều khiển của vùng (99,95%): $0{,}999975 \cdot 0{,}9995 \approx \hl{99{,}9475\%}$ — kém hơn chính dịch vụ chung đó. Một lần đẩy cấu hình sai lên cả hai nơi cũng vậy.</span></div>
        say: "Lỗi thứ nhất, quên phụ thuộc chung, nên dự phòng không cứu được. Hai vùng sẵn sàng cùng dựa vào một dịch vụ điều khiển của vùng có 99 phẩy 95 phần trăm. Toàn hệ chỉ còn 0 phẩy 999975 nhân 0 phẩy 9995, khoảng 99 phẩy 9475 phần trăm, kém hơn chính dịch vụ chung đó. Một lần đẩy cấu hình sai lên cả hai nơi cũng vậy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mỗi vùng sẵn sàng không đủ sức gánh <b class="red">(hỏng dây chuyền)</b>
          <br><span class="note">Hai nơi mỗi nơi chạy 70% công suất: một nơi hỏng, nơi kia nhận 140% và sập theo. Mỗi nơi phải gánh được toàn bộ tải còn lại.</span></div>
        say: "Lỗi thứ hai, mỗi vùng sẵn sàng không đủ sức gánh, nên hỏng dây chuyền. Hai nơi mỗi nơi chạy 70 phần trăm công suất, một nơi hỏng thì nơi kia nhận 140 phần trăm và sập theo. Mỗi nơi phải gánh được toàn bộ tải còn lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dữ liệu chỉ nằm ở một vùng sẵn sàng <b class="red">(máy dự phòng không có gì để chạy)</b>
          <br><span class="note">Máy chủ ứng dụng ở hai nơi nhưng cơ sở dữ liệu ở một nơi: vẫn là một điểm hỏng. Bật bản sao cơ sở dữ liệu ở vùng sẵn sàng thứ hai.</span></div>
        say: "Lỗi thứ ba, dữ liệu chỉ nằm ở một vùng sẵn sàng, nên máy dự phòng không có gì để chạy. Máy chủ ứng dụng ở hai nơi mà cơ sở dữ liệu ở một nơi thì vẫn là một điểm hỏng. Hãy bật bản sao cơ sở dữ liệu ở vùng sẵn sàng thứ hai."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.parallel_availability(0.99, 3) * 100, 4) == 99.9999 and round(alg.parallel_availability(0.99, 3) * 0.9999 * 100, 4) == 99.9899"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ba vùng sẵn sàng, mỗi nơi 99%, hỏng độc lập. Độ sẵn sàng chạy song song?</td></tr>
          <tr><td>2</td><td>Phía trước có một bộ cân bằng tải 99,99% (nối tiếp). Độ sẵn sàng cả hệ?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ba vùng sẵn sàng, mỗi nơi 99 phần trăm, hỏng độc lập. Độ sẵn sàng khi chạy song song là bao nhiêu? Câu hai, phía trước có một bộ cân bằng tải 99 phẩy 99 phần trăm, ghép nối tiếp. Độ sẵn sàng cả hệ là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Cả ba cùng hỏng: $0{,}01 \cdot 0{,}01 \cdot 0{,}01 = 0{,}000\,001$ → $1 - 0{,}01^3 = \hl{99{,}9999\%}$.</p>
        say: "Đáp án câu một, cả ba cùng hỏng với xác suất 0 phẩy 01 nhân ba lần, bằng một phần triệu. Vậy độ sẵn sàng là 1 trừ 0 phẩy 01 mũ 3, bằng 99 phẩy 9999 phần trăm."
      - show: |
          <p>② Nối tiếp thì nhân: $0{,}999999 \cdot 0{,}9999 \approx \hl{99{,}9899\%}$ — khâu nối tiếp yếu nhất quyết định; ba vùng sẵn sàng gần như không còn giúp gì thêm.</p>
        say: "Câu hai, nối tiếp thì nhân, 0 phẩy 999999 nhân 0 phẩy 9999, khoảng 99 phẩy 9899 phần trăm. Khâu nối tiếp yếu nhất quyết định, nên ba vùng sẵn sàng gần như không còn giúp gì thêm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vùng chứa nhiều vùng sẵn sàng: các miền lỗi</span><span class="a">→</span>
          <span class="n">song song độc lập: $1 - (1 - a)^n$</span><span class="a">→</span>
          <span class="n">nối tiếp: nhân — khâu yếu nhất quyết định</span><span class="a">→</span>
          <span class="n">tránh phụ thuộc chung; mỗi nơi gánh đủ tải; dữ liệu có bản sao</span></div>
        say: "Tổng kết lại, vùng chứa các vùng sẵn sàng, là các miền lỗi. Song song độc lập cho 1 trừ 1 trừ a mũ n, còn nối tiếp thì nhân, và khâu yếu nhất quyết định. Hãy tránh phụ thuộc chung, cho mỗi nơi gánh đủ tải, và có bản sao dữ liệu."
      - show: |
