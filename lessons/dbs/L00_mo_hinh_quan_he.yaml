id: L00
course: DBS
series: "DBS · Cơ sở dữ liệu"
title: "Bài 0 — Mô hình quan hệ: bảng, khoá chính, khoá ngoại, ràng buộc toàn vẹn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dbs.yaml L00; audit/dbs/verify_dbs.py L00 (sqlite3); E. F. Codd (1970); A. Silberschatz, H. F. Korth, S. Sudarshan, Database System Concepts (2019), chương 2"
assumes: [arith, set, in, notin, geq, dots]
# Quy ước: CSDL mẫu dùng cho cả khoá — Lop(ma_lop, ten_lop), SinhVien(mssv, ten, lop, diem) với 4 sinh viên An, Bình, Chi, Dũng
#   (alg.DB_DEMO). Mọi kết quả “được nhận / bị từ chối” do alg.sql_error chạy thật trên sqlite3 (bật kiểm khoá ngoại).
#   Lời đọc nói “giá trị rỗng” cho NULL (chữ NULL chỉ trên màn hình) cho tới khi probe audit/dbs/probes/p1_sql chọn cách đọc.
objectives:
  - "Đọc lược đồ quan hệ: bảng, cột, dòng, miền giá trị"
  - "Giải thích khoá chính, khoá ngoại và ràng buộc toàn vẹn tham chiếu"
  - "Biết quan hệ là tập các dòng: không thứ tự, không trùng"
asr_reviewed:
  - {sentence: "Có An, mã 1.", reason: "ASR chép “Có an, mã mục” (0.75): lệch âm/thanh thuần Việt: một/mục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Và Bình, mã 2.", reason: "ASR chép “và bình mả 2.” (0.75): lệch âm/thanh thuần Việt: mã/mả — NOT_VERIFIED bằng tai người"}
  - {sentence: "Có ba loại ràng buộc toàn vẹn.", reason: "ASR chép “Có 3 loại tràn buộc toàn vén”: ràng/tràn (r → tr, đã biết ở TOC “Rai” → “trai”), vẹn/vén (thanh nặng/sắc); “ràng buộc toàn vẹn” chép đúng ở các câu dài của L00 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu ba, xoá sinh viên mã 4.", reason: "ASR chép “Câu 3. Xóa sinh viên mả búng”: mã/mả (thanh ngã/hỏi), “bốn” → “búng” ở cuối câu ngắn; số 4 hiện trên màn hình, các câu khác của L00 có “mã” chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng có bốn dòng.", reason: "ASR chép “Bạn có bốn dòng”: bảng/bạn (nhầm âm cuối ng/n và thanh), “bốn dòng” đúng; cặp bảng/bản lặp ở nhiều bài DBS — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bảng tính lộn xộn"
    steps:
      - show: |
          <p>Một bảng tính ghi điểm: có dòng ghi lớp “K1”, có dòng “k1”, có dòng ghi lớp “K9” — lớp không tồn tại. Hai sinh viên trùng mã số.</p>
          <p>Không ai ngăn những lỗi đó lọt vào, và mọi báo cáo sau này đều sai theo.</p>
          <div class="box key">Hôm nay: <b>mô hình quan hệ</b> — bảng, khoá chính, khoá ngoại — và cách hệ quản trị <b>từ chối</b> dữ liệu sai ngay khi ghi.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một bảng tính ghi điểm sinh viên có dòng ghi lớp K1 viết hoa, có dòng viết thường, có dòng ghi lớp K9, một lớp không hề tồn tại. Hai sinh viên lại trùng mã số. Không ai ngăn những lỗi đó lọt vào, và mọi báo cáo sau này đều sai theo. Hôm nay ta học mô hình quan hệ, gồm bảng, khoá chính và khoá ngoại, và cách hệ quản trị cơ sở dữ liệu từ chối dữ liệu sai ngay lúc ghi."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tập hợp và tích Đề-các"
    checks:
      - "len({'An', 'Bình', 'An'}) == 2 and {2, 1} == {1, 2}"
      - "len(list(__import__('itertools').product(['K1', 'K2'], [8, 9]))) == 2 * 2 == 4"
      - "{('K1', 8), ('K2', 9)} <= set(__import__('itertools').product(['K1', 'K2'], [8, 9]))"
    steps:
      - show: |
          <table class="t"><tr><th>viết</th><th>là tập</th><th>số phần tử</th></tr>
          <tr><td>$\{\text{An}, \text{Bình}, \text{An}\}$</td><td>$\{\text{An}, \text{Bình}\}$</td><td>2</td></tr>
          <tr><td>$\{2, 1\}$</td><td>$\{1, 2\}$</td><td>2</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn lại tập hợp ở khoá Toán rời rạc, vì bảng trong cơ sở dữ liệu được xây trên nó. Một tập không đếm phần tử lặp, nên tập gồm An, Bình, An chỉ có 2 phần tử. Một tập cũng không có thứ tự, tập gồm 2 và 1 chính là tập gồm 1 và 2."
      - show: |
          <p>$A = \{\text{K1}, \text{K2}\}$, $B = \{8, 9\}$. Tích Đề-các $A \times B$: mọi cặp (một phần tử của $A$, một phần tử của $B$) — $2 \times 2 = 4$ cặp.</p>
          <table class="t"><tr><th></th><th>8</th><th>9</th></tr>
          <tr><td>K1</td><td>$\hl{(\text{K1}, 8)}$</td><td>(K1, 9)</td></tr>
          <tr><td>K2</td><td>(K2, 8)</td><td>$\hl{(\text{K2}, 9)}$</td></tr></table>
          <p class="note">Một <b>quan hệ</b> là một tập con của tích: ở đây chỉ giữ 2 cặp được tô.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Thứ hai, cũng ở khoá Toán rời rạc, tích Đề-các của hai tập là tập mọi cặp lấy một phần tử từ mỗi tập. Với A gồm K1, K2 và B gồm 8, 9, tích có 2 nhân 2 bằng 4 cặp, xếp thành bảng bốn ô. Một quan hệ là một tập con của tích đó, ví dụ chỉ giữ hai cặp được tô, K1 với 8 và K2 với 9. Bảng trong cơ sở dữ liệu chính là một quan hệ như vậy. Mỗi dòng là một bộ giá trị, lấy mỗi cột một giá trị trong miền của cột ấy."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: lược đồ, dòng, cột"
    checks:
      - "alg.sql('SELECT COUNT(*) FROM SinhVien') == [(4,)] and alg.sql('SELECT COUNT(*) FROM Lop') == [(2,)]"
    steps:
      - show: |
          <p><b>Lược đồ</b> (khuôn của bảng): $\text{SinhVien}(\text{mssv}, \text{ten}, \text{lop}, \text{diem})$.</p>
          <table class="t"><tr><th>mssv</th><th>ten</th><th>lop</th><th>diem</th></tr>
          <tr><td>1</td><td>An</td><td>K1</td><td>8</td></tr><tr><td>2</td><td>Bình</td><td>K1</td><td>6</td></tr>
          <tr><td>3</td><td>Chi</td><td>K2</td><td>9</td></tr><tr><td>4</td><td>Dũng</td><td>NULL</td><td>7</td></tr></table>
          <p>Mỗi <b>cột</b> là một thuộc tính, có một miền giá trị (số, chuỗi…). Mỗi <b>dòng</b> là một bộ giá trị — một sinh viên.</p>
          <p class="note">NULL: ô chưa có giá trị (Dũng chưa xếp lớp).</p>
        focus: [1, 2, "2.2", 3, 3, 4]
        say: "Lược đồ là khuôn của bảng, gồm tên bảng và danh sách cột, ở đây bảng sinh viên có bốn cột, mã số, tên, lớp và điểm. Bảng có bốn dòng. Ví dụ dòng đầu là sinh viên An, mã số 1, lớp K1, điểm 8. Mỗi cột là một thuộc tính, có một miền giá trị như số hay chuỗi chữ. Mỗi dòng là một bộ giá trị, ứng với một sinh viên. Ô lớp của Dũng ghi giá trị rỗng, nghĩa là chưa có giá trị, vì Dũng chưa được xếp lớp."
      - clear: true
        show: |
          <div class="box key">Một <b>quan hệ</b> là một <b>tập</b> các dòng (bài tập hợp của DMS): không có thứ tự, không có hai dòng trùng hệt nhau.</div>
          <p class="note">Muốn kết quả theo thứ tự nào, phải yêu cầu rõ trong câu truy vấn (<code>ORDER BY</code>).</p>
          <p class="note">Bảng thật trong hệ quản trị nới luật “không trùng”: bảng không khai khoá vẫn nhận được hai dòng trùng hệt — vì thế mỗi bảng nên có khoá chính.</p>
        focus: [1, 2, 3]
        say: "Điều quan trọng nhất, một quan hệ là một tập các dòng, như tập hợp ở khoá Toán rời rạc, nên không có thứ tự và không có hai dòng trùng hệt nhau. Muốn kết quả theo một thứ tự nào đó, ta phải yêu cầu rõ ràng trong câu truy vấn. Lưu ý, bảng thật trong hệ quản trị nới luật không trùng, bảng không khai khoá vẫn nhận được hai dòng trùng hệt, vì thế mỗi bảng nên có khoá chính."

  # ───────────────────────── 3. KHOÁ ─────────────────────────
  - id: keys
    kind: concept
    title: "Khoá chính và khoá ngoại"
    checks:
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (2, 'Giang', 'K1', 7)\") == 'UNIQUE constraint failed: SinhVien.mssv'"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (5, 'Em', 'K9', 5)\") == 'FOREIGN KEY constraint failed'"
      - "alg.sql('SELECT COUNT(DISTINCT ten) FROM SinhVien') == [(4,)]"
    steps:
      - show: |
          <p><b>Khoá chính</b>: cột (hay nhóm cột) xác định duy nhất mỗi dòng — không trùng, không rỗng. $\text{SinhVien}$: $\text{mssv}$; $\text{Lop}$: $\text{ma\_lop}$.</p>
          <p><b>Khoá ngoại</b>: $\text{SinhVien.lop}$ tham chiếu $\text{Lop.ma\_lop}$ — giá trị phải <b>có trong</b> bảng Lop, hoặc rỗng.</p>
          <div class="code"><div><span class="kw">CREATE TABLE</span> SinhVien (</div><div>  mssv <span class="kw">INTEGER PRIMARY KEY</span>,</div><div>  ten  <span class="kw">TEXT NOT NULL</span>,</div><div>  lop  <span class="kw">TEXT REFERENCES</span> Lop(ma_lop),</div><div>  diem <span class="kw">REAL</span>);</div></div>
        focus: [1, 1, 2, 2, "3.2", "3.4"]
        say: "Khoá chính là cột, hay nhóm cột, xác định duy nhất mỗi dòng, nên không được trùng và không được rỗng. Bảng sinh viên có khoá chính là mã số, bảng lớp có khoá chính là mã lớp. Khoá ngoại là cột lớp của bảng sinh viên, tham chiếu tới mã lớp của bảng lớp. Giá trị của nó phải có trong bảng lớp, hoặc để rỗng. Trong câu lệnh tạo bảng, khoá chính được khai ở dòng mã số. Khoá ngoại được khai ở dòng lớp, chỉ rõ nó tham chiếu tới cột nào của bảng nào."
      - show: |
          <p>Vì sao không lấy <b>tên</b> làm khoá? Tên có thể trùng (hai bạn cùng tên An), có thể đổi. Khoá chính nên là thứ không đổi và chắc chắn duy nhất.</p>
          <p class="note">4 tên hiện tại khác nhau là <b>tình cờ</b>, không phải luật của dữ liệu.</p>
        focus: [1, 1, 1, 2]
        say: "Vì sao không lấy tên làm khoá? Vì tên có thể trùng, hai bạn cùng tên An, và tên có thể đổi. Khoá chính nên là thứ không đổi và chắc chắn duy nhất. Bốn tên hiện tại khác nhau chỉ là tình cờ, không phải luật của dữ liệu."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Khoá ngoại là mũi tên phải trúng một dòng có thật"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><defs><marker id="arD0g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><defs><marker id="arD0r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><g font-size="26" fill="#1f2937"><text x="80" y="45" font-weight="bold">SinhVien (mssv, ten, lop)</text><text x="1000" y="45" font-weight="bold">Lop (ma_lop, ten_lop)</text></g><g fill="#eff6ff" stroke="#2a78d6" stroke-width="2"><rect x="80" y="70" width="520" height="56"/><rect x="80" y="130" width="520" height="56"/><rect x="80" y="190" width="520" height="56"/><rect x="80" y="250" width="520" height="56"/><rect x="1000" y="100" width="420" height="60"/><rect x="1000" y="200" width="420" height="60"/></g><rect x="80" y="350" width="520" height="56" fill="#fee2e2" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/><g font-size="26" fill="#1f2937"><text x="110" y="107">1</text><text x="200" y="107">An</text><text x="480" y="107" font-weight="bold">K1</text><text x="110" y="167">2</text><text x="200" y="167">Bình</text><text x="480" y="167" font-weight="bold">K1</text><text x="110" y="227">3</text><text x="200" y="227">Chi</text><text x="480" y="227" font-weight="bold">K2</text><text x="110" y="287">4</text><text x="200" y="287">Dũng</text><text x="460" y="287" fill="#6b7280">rỗng</text><text x="110" y="387">5</text><text x="200" y="387">Em</text><text x="480" y="387" font-weight="bold" fill="#b91c1c">K9</text><text x="1030" y="140" font-weight="bold">K1</text><text x="1100" y="140" font-size="22">Khoa học máy tính</text><text x="1030" y="240" font-weight="bold">K2</text><text x="1100" y="240" font-size="22">Kỹ thuật phần mềm</text></g><g stroke="#059669" stroke-width="3" fill="none"><line x1="600" y1="98" x2="992" y2="125" marker-end="url(#arD0g)"/><line x1="600" y1="158" x2="992" y2="135" marker-end="url(#arD0g)"/><line x1="600" y1="218" x2="992" y2="230" marker-end="url(#arD0g)"/></g><line x1="600" y1="378" x2="990" y2="378" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arD0r)"/><g font-size="22"><text x="640" y="290" fill="#6b7280">rỗng: không trỏ đi đâu, vẫn hợp lệ</text><text x="1000" y="370" fill="#b91c1c" font-weight="bold">tra Lop: không có K9</text><text x="1000" y="400" fill="#b91c1c" font-weight="bold">→ TỪ CHỐI ngay lúc ghi</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy cơ chế của khoá ngoại. Mỗi ô lớp bên bảng sinh viên là một mũi tên trỏ sang đúng một dòng của bảng lớp, An và Bình trỏ tới K1, Chi trỏ tới K2. Ô của Dũng để rỗng nên không trỏ đi đâu, và như thế vẫn hợp lệ. Khi có dòng mới ghi lớp K9, hệ quản trị tra bảng lớp, không thấy K9, nên từ chối ngay lúc ghi."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Hệ quản trị từ chối dữ liệu sai"
    checks:
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (5, 'Em', 'K9', 5)\") == 'FOREIGN KEY constraint failed'"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (2, 'Giang', 'K1', 7)\") == 'UNIQUE constraint failed: SinhVien.mssv'"
      - "alg.sql_error(\"DELETE FROM Lop WHERE ma_lop = 'K1'\") == 'FOREIGN KEY constraint failed'"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (5, 'Em', 'K2', 8)\") is None"
    steps:
      - show: |
          <p><b>Bước 1</b> — thêm (5, Em, <b>K9</b>, 5).</p>
          <table class="t"><tr><th>kiểm</th><th>tra</th><th>kết quả</th></tr>
          <tr><td>khoá chính 5</td><td>$5 \notin \{1, 2, 3, 4\}$</td><td>qua</td></tr>
          <tr><td>khoá ngoại K9</td><td>$\text{K9} \notin \{\text{K1}, \text{K2}\}$</td><td><b class="red">từ chối</b></td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước một, thử thêm sinh viên Em, mã 5, lớp K9, điểm 5. Khoá chính 5 chưa có trong các mã từ 1 tới 4, nên qua. Nhưng K9 không thuộc tập mã lớp gồm K1 và K2, nên hệ quản trị từ chối vì vi phạm khoá ngoại."
      - show: |
          <p><b>Bước 2</b> — thêm (<b>2</b>, Giang, K1, 7).</p>
          <table class="t"><tr><th>kiểm</th><th>tra</th><th>kết quả</th></tr>
          <tr><td>khoá chính 2</td><td>$2 \in \{1, 2, 3, 4\}$ — đã là của Bình</td><td><b class="red">từ chối</b></td></tr></table>
        introduces: [in]
        focus: [1, "2.2", 2]
        say: "Bước hai, thử thêm sinh viên Giang, mã 2, lớp K1. Mã 2 đã có trong bảng, đó là mã của Bình, nên trùng khoá chính. Hệ quản trị từ chối ngay, dù lớp K1 hoàn toàn hợp lệ."
      - clear: true
        show: |
          <p><b>Bước 3</b> — xoá lớp K1. Ai đang trỏ tới K1?</p>
          <table class="t"><tr><th>mssv</th><th>ten</th><th>lop</th></tr>
          <tr><td>1</td><td>An</td><td>$\hl{\text{K1}}$</td></tr><tr><td>2</td><td>Bình</td><td>$\hl{\text{K1}}$</td></tr></table>
          <p>2 dòng còn tham chiếu → xoá K1 sẽ để lại 2 mũi tên trỏ vào khoảng không → <b class="red">từ chối</b>.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước ba, thử xoá lớp K1, trước hết phải hỏi ai đang trỏ tới K1. Có An, mã 1. Và Bình, mã 2. Xoá K1 sẽ để lại hai mũi tên trỏ vào khoảng không, nên hệ quản trị từ chối."
      - show: |
          <p><b>Bước 4</b> — thêm (5, Em, <b>K2</b>, 8).</p>
          <table class="t"><tr><th>kiểm</th><th>tra</th><th>kết quả</th></tr>
          <tr><td>khoá chính 5</td><td>$5 \notin \{1, 2, 3, 4\}$</td><td>qua</td></tr>
          <tr><td>khoá ngoại K2</td><td>$\text{K2} \in \{\text{K1}, \text{K2}\}$</td><td>qua</td></tr>
          <tr><td>tên không rỗng</td><td>có “Em”</td><td>qua → <b>nhận</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, thử thêm Em, mã 5, nhưng lần này vào lớp K2. Khoá chính số 5 chưa có trong bảng, nên qua. Lớp K2 có trong bảng lớp, qua. Tên không rỗng, cũng qua, nên câu lệnh được nhận."
      - clear: true
        show: |
          <table class="t"><tr><th>câu lệnh</th><th>kết quả</th></tr>
          <tr><td><code>INSERT</code> (5, Em, <b>K9</b>, 5)</td><td>từ chối: khoá ngoại — K9 không có trong Lop</td></tr>
          <tr><td><code>INSERT</code> (<b>2</b>, Giang, K1, 7)</td><td>từ chối: trùng khoá chính 2</td></tr>
          <tr><td><code>DELETE</code> lớp K1</td><td>từ chối: An, Bình còn tham chiếu K1</td></tr>
          <tr><td><code>INSERT</code> (5, Em, K2, 8)</td><td>nhận</td></tr></table>
          <p class="note">Chạy thật trên SQLite (bật kiểm khoá ngoại).</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Gom lại bốn câu lệnh đã thử trên cơ sở dữ liệu mẫu. Thêm sinh viên Em thuộc lớp K9 bị từ chối, vì khoá ngoại đòi K9 phải có trong bảng lớp. Thêm sinh viên Giang với mã số 2 bị từ chối, vì trùng khoá chính. Xoá lớp K1 cũng bị từ chối, vì An và Bình còn tham chiếu tới K1. Chỉ câu cuối, thêm Em vào lớp K2, được nhận. Các kết quả này đều chạy thật trên một hệ quản trị cơ sở dữ liệu."

  - id: check
    kind: check
    title: "Tự kiểm: hỏi thẳng dữ liệu thay vì thử ghi"
    checks:
      - "alg.sql('SELECT COUNT(*) FROM SinhVien WHERE lop IS NOT NULL AND lop NOT IN (SELECT ma_lop FROM Lop)') == [(0,)]"
      - "alg.sql('SELECT COUNT(DISTINCT mssv), COUNT(*) FROM SinhVien') == [(4, 4)]"
      - "alg.sql(\"SELECT COUNT(*) FROM SinhVien WHERE lop = 'K1'\") == [(2,)]"
      - "[v for v in ['K1', 'K2', 'K9', 'NULL'] if alg.sql_error(\"INSERT INTO SinhVien VALUES (5, 'Em', \" + (v if v == 'NULL' else repr(v)) + ', 5)') is None] == ['K1', 'K2', 'NULL']"
      - "alg.sql(\"SELECT COUNT(*), SUM(lop = 'K2') FROM SinhVien\", alg.DB_DEMO + \"INSERT INTO SinhVien VALUES (5, 'Em', 'K2', 8);\") == [(5, 2)]"
    steps:
      - show: |
          <table class="t"><tr><th>hỏi thẳng dữ liệu</th><th>đếm được</th><th>khớp với</th></tr>
          <tr><td>dòng có lớp không nằm trong Lop</td><td>0</td><td>khoá ngoại đang được giữ</td></tr>
          <tr><td>số mã khác nhau / số dòng</td><td>4 / 4</td><td>khoá chính không trùng</td></tr>
          <tr><td>số dòng có lớp K1</td><td>2</td><td>lý do xoá K1 bị từ chối</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không thử ghi nữa mà đếm thẳng trên dữ liệu. Số dòng có lớp không nằm trong bảng lớp là 0, đúng là khoá ngoại đang được giữ. Có 4 mã khác nhau trên 4 dòng, nên khoá chính không trùng. Có đúng 2 dòng thuộc lớp K1, khớp lý do lệnh xoá K1 bị từ chối."
      - show: |
          <table class="t"><tr><th>thử mọi giá trị lớp cho Em</th><th>K1</th><th>K2</th><th>K9</th><th>rỗng</th></tr>
          <tr><td>kết quả</td><td>nhận</td><td>nhận</td><td><b class="red">từ chối</b></td><td>nhận</td></tr></table>
          <p>Sau khi nhận Em vào K2: bảng có $4 + 1 = 5$ dòng, lớp K2 có 2 sinh viên (Chi, Em).</p>
        focus: [1, "1.2", 2]
        say: "Thử thêm bằng máy với mọi giá trị lớp cho Em, gồm K1, K2, K9 và rỗng. Ba giá trị được nhận, chỉ K9 bị từ chối, vì chỉ K9 không có trong bảng lớp. Sau khi nhận Em vào lớp K2, bảng có 4 cộng 1 bằng 5 dòng, và lớp K2 có 2 sinh viên là Chi và Em."

  # ───────────────────────── 5. RÀNG BUỘC ─────────────────────────
  - id: integrity
    kind: concept
    title: "Ba loại ràng buộc toàn vẹn"
    checks:
      - "alg.sql_error(\"INSERT INTO Lop VALUES ('K3', NULL)\") == 'NOT NULL constraint failed: Lop.ten_lop'"
    steps:
      - show: |
          <ol><li><b>Miền</b>: giá trị đúng kiểu, và cột khai <code>NOT NULL</code> thì không được rỗng — thêm lớp K3 không có tên bị từ chối.</li>
          <li><b>Thực thể</b>: khoá chính duy nhất, không rỗng.</li>
          <li><b>Tham chiếu</b>: khoá ngoại trỏ tới dòng có thật, hoặc rỗng.</li></ol>
          <div class="box key">Ràng buộc đặt ở hệ quản trị thì <b>mọi</b> chương trình ghi vào đều phải tuân theo — không trông vào việc từng ứng dụng tự kiểm.</div>
        focus: ["1.1", "1.1", "1.2", "1.3", 2]
        say: "Có ba loại ràng buộc toàn vẹn. Một, ràng buộc miền, giá trị phải đúng kiểu, và cột đã khai không được rỗng thì phải có giá trị, ví dụ thêm lớp K3 mà không có tên bị từ chối. Hai, ràng buộc thực thể, khoá chính phải duy nhất và không rỗng. Ba, ràng buộc tham chiếu, khoá ngoại phải trỏ tới một dòng có thật, hoặc để rỗng. Ràng buộc đặt ở hệ quản trị thì mọi chương trình ghi vào đều phải tuân theo, không phải trông vào việc từng ứng dụng tự kiểm."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.sql('SELECT COUNT(*) FROM (SELECT ten FROM SinhVien UNION SELECT ten FROM SinhVien)') == [(4,)]"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (6, 'Hà', NULL, 5)\") is None"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (5, 'Em', 'K9', 5)\", alg.DB_DEMO.replace(' REFERENCES Lop(ma_lop)', '')) is None"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (5, 'Em', 'K9', 5)\") == 'FOREIGN KEY constraint failed'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin vào thứ tự dòng <b class="red">(sai)</b>
          <br><span class="note">Quan hệ không có thứ tự. Kết quả “ra theo thứ tự thêm vào” hôm nay có thể đổi ngày mai.</span></div>
        say: "Lỗi thứ nhất, tin vào thứ tự các dòng. Quan hệ không có thứ tự, kết quả hôm nay ra theo thứ tự thêm vào thì ngày mai có thể đổi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng tên hay số điện thoại làm khoá chính <b class="red">(sai)</b>
          <br><span class="note">Chúng có thể trùng hoặc đổi. Dùng một mã riêng, không đổi.</span></div>
        say: "Lỗi thứ hai, dùng tên hay số điện thoại làm khoá chính. Chúng có thể trùng hoặc thay đổi, nên hãy dùng một mã riêng, không đổi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Không khai khoá ngoại, “để ứng dụng tự kiểm” <b class="red">(sai)</b>
          <br><span class="note">Chỉ cần một đoạn mã quên kiểm là có sinh viên thuộc lớp không tồn tại.</span></div>
          <table class="t"><tr><th>luật đặt ở đâu</th><th>trang nhập liệu (có kiểm)</th><th>kịch bản nhập lô (quên kiểm)</th></tr>
          <tr><td>chỉ trong mã ứng dụng</td><td>chặn K9</td><td><b class="red">nhận K9</b> — dòng mồ côi</td></tr>
          <tr><td>khoá ngoại trong lược đồ</td><td>chặn K9</td><td>chặn K9</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ ba, không khai khoá ngoại mà để ứng dụng tự kiểm. Chỉ cần một đoạn mã quên kiểm là có sinh viên thuộc một lớp không tồn tại. Người đã đi làm hay gặp đúng cảnh này, trang nhập liệu có kiểm, nhưng một kịch bản nhập lô viết vội thì không. Nếu luật chỉ nằm trong mã ứng dụng, kịch bản ấy ghi được lớp K9 thành một dòng mồ côi. Nếu khoá ngoại khai trong lược đồ, mọi đường ghi đều bị chặn như nhau."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ khoá ngoại cấm giá trị rỗng <b class="red">(sai)</b>
          <br><span class="note">Khoá ngoại cho phép rỗng (chưa xếp lớp), trừ khi cột khai thêm <code>NOT NULL</code>.</span></div>
        say: "Lỗi thứ tư, nghĩ khoá ngoại cấm giá trị rỗng. Khoá ngoại cho phép rỗng, nghĩa là chưa xếp lớp, trừ khi cột đó khai thêm ràng buộc không được rỗng."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (6, 'Hà', NULL, 5)\") is None"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (3, 'Khoa', 'K2', 6)\") == 'UNIQUE constraint failed: SinhVien.mssv'"
      - "alg.sql_error(\"DELETE FROM SinhVien WHERE mssv = 4\") is None"
      - "alg.sql('SELECT COUNT(*) FROM SinhVien', alg.DB_DEMO + 'DELETE FROM SinhVien WHERE mssv = 4;') == [(3,)]"
    steps:
      - show: |
          <p>Trên CSDL mẫu, câu nào được nhận, câu nào bị từ chối, vì sao?</p>
          <table class="t"><tr><th>câu</th><th>lệnh</th></tr>
          <tr><td>1</td><td><code>INSERT</code> (6, Hà, NULL, 5)</td></tr>
          <tr><td>2</td><td><code>INSERT</code> (3, Khoa, K2, 6)</td></tr>
          <tr><td>3</td><td><code>DELETE</code> sinh viên mã 4</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 1, 0]
        say: "Bây giờ đến lượt bạn tự làm, trên cơ sở dữ liệu mẫu. Câu một, thêm sinh viên Hà mã 6, lớp để rỗng, điểm 5. Câu hai, thêm sinh viên Khoa mã 3, lớp K2. Câu ba, xoá sinh viên mã 4. Câu nào được nhận, câu nào bị từ chối, và vì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① thêm (6, Hà, NULL, 5):</p>
          <table class="t"><tr><th>kiểm</th><th>tra</th><th>kết quả</th></tr>
          <tr><td>khoá chính 6</td><td>$6 \notin \{1, 2, 3, 4\}$</td><td>qua</td></tr>
          <tr><td>tên</td><td>có “Hà”</td><td>qua</td></tr>
          <tr><td>khoá ngoại</td><td>rỗng — được phép</td><td>qua → <b>nhận</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án câu một, kiểm lần lượt từng luật. Khoá chính 6 chưa có trong các mã từ 1 tới 4, qua. Tên Hà không rỗng, qua. Lớp để rỗng, mà khoá ngoại được phép để rỗng, nên câu lệnh được nhận."
      - clear: true
        show: |
          <p>② thêm (3, Khoa, K2, 6): $3 \in \{1, 2, 3, 4\}$, mã 3 đã là của Chi → <b class="red">từ chối</b>, trùng khoá chính (dù K2 hợp lệ).</p>
        say: "Câu hai, mã 3 đã có trong bảng, đó là mã của Chi. Vậy câu lệnh bị từ chối vì trùng khoá chính, dù lớp K2 hoàn toàn hợp lệ."
      - clear: true
        show: |
          <p>③ xoá sinh viên mã 4: bảng Lop không có cột nào trỏ tới SinhVien → không ai bị bỏ rơi → <b>nhận</b>; bảng còn $4 - 1 = 3$ dòng.</p>
        say: "Câu ba, ta hỏi có bảng nào trỏ tới sinh viên không. Bảng lớp không có cột nào tham chiếu sinh viên, nên xoá Dũng không để lại mũi tên treo nào. Câu lệnh được nhận, và bảng còn 4 trừ 1 bằng 3 dòng."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quan hệ = tập các dòng</span><span class="a">→</span>
          <span class="n">khoá chính: mỗi dòng một danh tính</span><span class="a">→</span>
          <span class="n">khoá ngoại: tham chiếu phải có thật</span><span class="a">→</span>
          <span class="n">hệ quản trị chặn dữ liệu sai</span></div>
        say: "Tổng kết lại, một quan hệ là một tập các dòng. Khoá chính cho mỗi dòng một danh tính duy nhất, khoá ngoại bảo đảm mọi tham chiếu trỏ tới thứ có thật. Và hệ quản trị chặn dữ liệu sai ngay lúc ghi."
      - show: |
          <div class="box key"><b>Tư duy:</b> luật của dữ liệu nên được viết ra và để máy giữ, không để trong đầu người hay rải trong mã ứng dụng.</div>
        say: "Điều cần mang theo, luật của dữ liệu nên được viết ra và để máy giữ, không để trong đầu người hay rải rác trong mã ứng dụng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>đại số quan hệ</b> — chọn, chiếu, tích và nối các bảng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học đại số quan hệ, các phép chọn, chiếu, tích và nối để lấy dữ liệu từ nhiều bảng. Hẹn gặp bạn ở bài tiếp theo."
