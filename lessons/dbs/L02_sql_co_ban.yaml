id: L02
course: DBS
series: "DBS · Cơ sở dữ liệu"
title: "Bài 2 — SQL: SELECT, WHERE, JOIN, ORDER BY"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dbs.yaml L02; audit/dbs/verify_dbs.py L02 (sqlite3); D. D. Chamberlin, R. F. Boyce (1974); A. Silberschatz, H. F. Korth, S. Sudarshan, Database System Concepts (2019), chương 3"
assumes: [arith, set, sub, in, geq, ltgt, select, proj, join]
# Quy ước: CSDL mẫu Lop/SinhVien (alg.DB_DEMO). Câu SQL trong <div class="code">, từ khoá viết HOA, tô .kw.
#   Mọi kết quả do alg.sql chạy thật trên sqlite3. Không nói về bí danh cột trong WHERE (SQLite cho phép, chuẩn SQL không).
objectives:
  - "Dịch câu hỏi sang SQL: SELECT, FROM, WHERE, ORDER BY"
  - "Phân biệt nối trong và nối ngoài"
  - "Hiểu SQL là ngôn ngữ khai báo"
asr_reviewed:
  - {sentence: "Câu hai, dò từng điểm so với 9.", reason: "ASR chép “Câu 2 do từng điểm so với chính.” (0.75): lệch âm/thanh thuần Việt: dò/do, chín/chính — NOT_VERIFIED bằng tai người"}
  - {sentence: "Dòng chữ cam nhắc rằng ta viết mệnh đề lấy cột trước, nhưng hệ quản trị chạy mệnh đề lấy bảng trước.", reason: "ASR chép “Dòng chữ cam nhắc rằng ta viết mệnh để lấy cực trước, nhưng hãy quản trị chạy mệnh để lấy bản trước.” (0.773): lệch âm/thanh thuần Việt: đề/để, cột/cực, hệ/hãy, đề/để, bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "K1 xuất hiện hai lần nên còn một, cộng với K2 và giá trị rỗng, được 3 dòng.", reason: "ASR chép “Cà màu xuất hiện hai lần nên còn một, cộng với cà hai và giá trị rỏng, được ba dòng.” (0.8): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: một (trong “k một” → “cà màu”), rỗng/rỏng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Từ khoá ở cuối nghĩa là giảm dần.", reason: "ASR chép “Tư khóa ở cuối nghĩa là giảm dân”: từ/tư, dần/dân (thanh huyền/ngang); nghĩa giữ nguyên — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nói cái cần lấy, không nói cách lấy"
    steps:
      - show: |
          <p>Bài 1 viết truy vấn bằng ký hiệu $\sigma$, $\pi$, $\bowtie$. Hệ quản trị thật nhận một ngôn ngữ chữ: <b>SQL</b>.</p>
          <p>Bạn chỉ viết <b>cái</b> cần lấy. Hệ quản trị tự chọn <b>cách</b> lấy: đọc bảng nào trước, dùng chỉ mục nào.</p>
          <div class="box key">Hôm nay: bốn mệnh đề cơ bản <code>SELECT</code>, <code>FROM</code>, <code>WHERE</code>, <code>ORDER BY</code>, và hai kiểu nối.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, ở bài 1 ta viết truy vấn bằng các ký hiệu chọn, chiếu và nối. Hệ quản trị thật nhận một ngôn ngữ bằng chữ gọi là SQL. Trong SQL, bạn chỉ viết cái cần lấy. Hệ quản trị tự chọn cách lấy, như đọc bảng nào trước, dùng chỉ mục nào. Hôm nay ta học bốn mệnh đề cơ bản và hai kiểu nối bảng."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ba phép của bài 1 và hai chiều sắp xếp"
    checks:
      - "alg.sql('SELECT ten FROM SinhVien WHERE diem >= 7') == [('An',), ('Chi',), ('Dũng',)]"
      - "len(alg.sql('SELECT ten, diem FROM SinhVien')) == 4"
      - "len(alg.sql('SELECT * FROM SinhVien JOIN Lop ON lop = ma_lop')) == 3"
      - "sorted([8, 6, 9, 7]) == [6, 7, 8, 9] and sorted([8, 6, 9, 7], reverse=True) == [9, 8, 7, 6]"
      - "sorted(['Chi', 'An', 'Dũng', 'Bình']) == ['An', 'Bình', 'Chi', 'Dũng'] and sorted(['Chi', 'An', 'Dũng', 'Bình'], reverse=True) == ['Dũng', 'Chi', 'Bình', 'An']"
    steps:
      - show: |
          <table class="t"><tr><th>phép (bài 1)</th><th>làm gì</th><th>trên bảng SinhVien</th></tr>
          <tr><td>chọn $\sigma$</td><td>giữ dòng thoả điều kiện</td><td>$\text{diem} \ge 7$: An, Chi, Dũng — 3 dòng</td></tr>
          <tr><td>chiếu $\pi$</td><td>giữ cột được nêu</td><td>tên, điểm: 4 dòng, 2 cột</td></tr>
          <tr><td>nối $\bowtie$</td><td>ghép cặp khớp</td><td>với Lop theo lớp: 3 dòng, Dũng (lớp rỗng) rơi</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Trước hết, nhắc lại ba phép của bài 1 trên bảng sinh viên gồm An 8 điểm, Bình 6, Chi 9 và Dũng 7. Phép chọn giữ dòng thoả điều kiện, chọn điểm từ 7 được 3 dòng là An, Chi, Dũng. Phép chiếu giữ cột được nêu, chiếu lên tên và điểm được 4 dòng, 2 cột. Phép nối ghép các cặp khớp, nối với bảng lớp được 3 dòng, vì Dũng có lớp rỗng nên rơi mất."
      - show: |
          <table class="t"><tr><th>sắp</th><th>điểm 8, 6, 9, 7</th><th>tên Chi, An, Dũng, Bình</th></tr>
          <tr><td>tăng dần</td><td>6, 7, 8, 9</td><td>An, Bình, Chi, Dũng</td></tr>
          <tr><td>giảm dần</td><td>9, 8, 7, 6</td><td>Dũng, Chi, Bình, An</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thứ hai, sắp xếp có hai chiều. Tăng dần đưa số nhỏ lên trước, điểm 8, 6, 9, 7 thành 6, 7, 8, 9, còn tên thì theo bảng chữ cái, An, Bình, Chi, Dũng. Giảm dần thì ngược lại, điểm thành 9, 8, 7, 6."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bốn mệnh đề"
    checks:
      - "alg.sql('SELECT ten FROM SinhVien WHERE diem >= 7') == [('An',), ('Chi',), ('Dũng',)]"
    steps:
      - show: |
          <div class="code"><div><span class="kw">SELECT</span> ten           <span class="cm">-- cột cần lấy (giống phép chiếu)</span></div><div><span class="kw">FROM</span>   SinhVien      <span class="cm">-- bảng nguồn</span></div><div><span class="kw">WHERE</span>  diem &gt;= 7     <span class="cm">-- điều kiện dòng (giống phép chọn)</span></div><div><span class="kw">ORDER BY</span> ten;        <span class="cm">-- thứ tự kết quả</span></div></div>
          <p>Kết quả: An, Chi, Dũng.</p>
          <div class="box key">Thứ tự <b>thực hiện</b> khác thứ tự <b>viết</b>: lấy bảng (<code>FROM</code>), lọc dòng (<code>WHERE</code>), lấy cột (<code>SELECT</code>), rồi sắp (<code>ORDER BY</code>).</div>
        focus: ["1.1", "1.2", "1.3", "1.4", 2, 3]
        say: "Một câu SQL cơ bản có bốn mệnh đề. Mệnh đề đầu nêu các cột cần lấy, giống phép chiếu. Mệnh đề thứ hai nêu bảng nguồn. Mệnh đề thứ ba nêu điều kiện cho từng dòng, giống phép chọn, ở đây là điểm từ 7 trở lên. Mệnh đề cuối nêu thứ tự của kết quả, ở đây theo tên, và ta được An, Chi, Dũng. Lưu ý, thứ tự thực hiện khác thứ tự viết, hệ quản trị lấy bảng, lọc dòng, lấy cột, rồi mới sắp xếp."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một câu SQL là một dây chuyền bốn trạm"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arD2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="90" width="320" height="150" rx="14" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="200" y="140" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">FROM SinhVien</text><text x="200" y="190" font-size="24" text-anchor="middle" fill="#2a78d6">lấy bảng</text><text x="200" y="300" font-size="26" text-anchor="middle" fill="#059669" font-weight="bold">4 dòng, 4 cột</text><text x="200" y="60" font-size="22" text-anchor="middle" fill="#6b7280">chạy thứ 1</text><line x1="362" y1="165" x2="406" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arD2)"/><rect x="410" y="90" width="320" height="150" rx="14" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="570" y="140" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">WHERE diem ≥ 7</text><text x="570" y="190" font-size="24" text-anchor="middle" fill="#2a78d6">lọc dòng</text><text x="570" y="300" font-size="26" text-anchor="middle" fill="#059669" font-weight="bold">3 dòng</text><text x="570" y="60" font-size="22" text-anchor="middle" fill="#6b7280">chạy thứ 2</text><line x1="732" y1="165" x2="776" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arD2)"/><rect x="780" y="90" width="320" height="150" rx="14" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="940" y="140" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">SELECT ten</text><text x="940" y="190" font-size="24" text-anchor="middle" fill="#2a78d6">lấy cột</text><text x="940" y="300" font-size="26" text-anchor="middle" fill="#059669" font-weight="bold">3 dòng, 1 cột</text><text x="940" y="60" font-size="22" text-anchor="middle" fill="#6b7280">chạy thứ 3</text><line x1="1102" y1="165" x2="1146" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arD2)"/><rect x="1150" y="90" width="320" height="150" rx="14" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="1310" y="140" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">ORDER BY ten</text><text x="1310" y="190" font-size="24" text-anchor="middle" fill="#2a78d6">sắp</text><text x="1310" y="300" font-size="26" text-anchor="middle" fill="#059669" font-weight="bold">An, Chi, Dũng</text><text x="1310" y="60" font-size="22" text-anchor="middle" fill="#6b7280">chạy thứ 4</text><text x="750" y="370" font-size="24" text-anchor="middle" fill="#eb6834">viết: SELECT trước — chạy: FROM trước</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ câu truy vấn ở trên như một dây chuyền bốn trạm, dữ liệu đi từ trái sang phải. Trạm đầu lấy cả bảng sinh viên, 4 dòng. Trạm hai lọc còn 3 dòng có điểm từ 7, trạm ba chỉ giữ cột tên, và trạm cuối mới sắp theo tên. Dòng chữ cam nhắc rằng ta viết mệnh đề lấy cột trước, nhưng hệ quản trị chạy mệnh đề lấy bảng trước."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Sắp xếp và bỏ trùng"
    checks:
      - "alg.sql('SELECT ten, diem FROM SinhVien ORDER BY diem DESC') == [('Chi', 9.0), ('An', 8.0), ('Dũng', 7.0), ('Bình', 6.0)]"
      - "len(alg.sql('SELECT lop FROM SinhVien')) == 4 and len(alg.sql('SELECT DISTINCT lop FROM SinhVien')) == 3"
    steps:
      - show: |
          <div class="code"><div><span class="kw">SELECT</span> ten, diem <span class="kw">FROM</span> SinhVien <span class="kw">ORDER BY</span> diem <span class="kw">DESC</span>;</div></div>
          <p><b>Bước 1</b> — lấy bảng, giữ hai cột (thứ tự trong bảng là bất kỳ):</p>
          <table class="t"><tr><th>ten</th><th>An</th><th>Bình</th><th>Chi</th><th>Dũng</th></tr><tr><td>diem</td><td>8</td><td>6</td><td>9</td><td>7</td></tr></table>
        focus: [1, 2, 3]
        say: "Ví dụ một, lấy tên và điểm, sắp theo điểm giảm dần. Bước một, hệ quản trị lấy bảng và giữ hai cột, lúc này thứ tự là bất kỳ. Ta có An 8, Bình 6, Chi 9, Dũng 7."
      - show: |
          <p><b>Bước 2</b> — sắp giảm dần (<code>DESC</code>): tìm lớn nhất trong phần còn lại, lặp lại.</p>
          <table class="t"><tr><th>vị trí</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>kết quả</td><td>Chi 9</td><td>An 8</td><td>Dũng 7</td><td>Bình 6</td></tr></table>
        focus: [1, 1, 2, 2]
        say: "Bước hai, sắp giảm dần. Từ khoá ở cuối nghĩa là giảm dần. Lớn nhất là Chi 9, rồi trong phần còn lại lớn nhất là An 8. Tiếp theo là Dũng 7, và cuối cùng Bình 6."
      - clear: true
        show: |
          <div class="code"><div><span class="kw">SELECT</span> lop <span class="kw">FROM</span> SinhVien;            <span class="cm">-- 4 dòng: K1, K1, K2, NULL</span></div><div><span class="kw">SELECT DISTINCT</span> lop <span class="kw">FROM</span> SinhVien;   <span class="cm">-- 3 dòng</span></div></div>
          <p><b>Bước 3</b> — câu thứ nhất: mỗi sinh viên một dòng.</p>
          <table class="t"><tr><th>An</th><th>Bình</th><th>Chi</th><th>Dũng</th></tr><tr><td>K1</td><td>K1</td><td>K2</td><td>NULL</td></tr></table>
        focus: ["1.1", 2, 3]
        say: "Ví dụ hai, lấy cột lớp của mọi sinh viên. Bước ba, câu thứ nhất cho mỗi sinh viên một dòng. Được 4 dòng, K1 xuất hiện hai lần, của An và của Bình."
      - show: |
          <p><b>Bước 4</b> — câu thứ hai, <code>DISTINCT</code>: giữ mỗi giá trị một lần.</p>
          <table class="t"><tr><th>giá trị</th><th>K1</th><th>K2</th><th>NULL</th></tr><tr><td>lần xuất hiện</td><td>2 → giữ 1</td><td>1</td><td>1</td></tr></table>
          <div class="box warn">Khác phép chiếu của bài 1: SQL <b>không</b> tự bỏ dòng trùng. Muốn bỏ, viết <code>DISTINCT</code>.</div>
        focus: [1, "2.2", 3]
        say: "Bước bốn, thêm từ khoá bỏ trùng thì mỗi giá trị chỉ giữ một lần. K1 xuất hiện hai lần nên còn một, cộng với K2 và giá trị rỗng, được 3 dòng. Khác với phép chiếu ở bài 1, SQL không tự bỏ dòng trùng, ta phải yêu cầu rõ."

  - id: check
    kind: check
    title: "Tự kiểm: tính lại bằng tay, không nhờ SQL"
    checks:
      - "[r[0] for r in sorted(alg.sql('SELECT ten, diem FROM SinhVien'), key=lambda r: -r[1])] == [r[0] for r in alg.sql('SELECT ten, diem FROM SinhVien ORDER BY diem DESC')] == ['Chi', 'An', 'Dũng', 'Bình']"
      - "len({r[0] for r in alg.sql('SELECT lop FROM SinhVien')}) == 3 == len(alg.sql('SELECT DISTINCT lop FROM SinhVien'))"
      - "len(alg.sql('SELECT * FROM SinhVien WHERE lop IS NULL OR lop NOT IN (SELECT ma_lop FROM Lop)')) == 1 and 3 + 1 == len(alg.sql('SELECT * FROM SinhVien LEFT JOIN Lop ON lop = ma_lop'))"
    steps:
      - show: |
          <table class="t"><tr><th>kết quả SQL</th><th>tính lại bằng đường khác</th><th>khớp?</th></tr>
          <tr><td>Chi, An, Dũng, Bình</td><td>so từng cặp: $9 \gt 8 \gt 7 \gt 6$</td><td>có</td></tr>
          <tr><td><code>DISTINCT lop</code>: 3 dòng</td><td>tập $\{\text{K1}, \text{K1}, \text{K2}, \text{rỗng}\}$ có 3 phần tử</td><td>có</td></tr>
          <tr><td>nối ngoài trái: 4 dòng</td><td>3 cặp khớp + 1 dòng trái không khớp (Dũng) $= 4$</td><td>có</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta tính lại từng kết quả mà không nhờ SQL. Thứ tự Chi, An, Dũng, Bình đúng, vì 9 lớn hơn 8, 8 lớn hơn 7, và 7 lớn hơn 6. Bỏ trùng được 3 dòng, vì tập các giá trị lớp chỉ có 3 phần tử khác nhau. Nối ngoài trái có 4 dòng, bằng 3 cặp khớp cộng 1 dòng bên trái không khớp, là Dũng."

  # ───────────────────────── 4. NỐI ─────────────────────────
  - id: joins
    kind: concept
    title: "Nối trong và nối ngoài"
    checks:
      - "alg.sql('SELECT ten, ten_lop FROM SinhVien JOIN Lop ON lop = ma_lop') == [('An', 'Khoa học máy tính'), ('Bình', 'Khoa học máy tính'), ('Chi', 'Kỹ thuật phần mềm')]"
      - "alg.sql('SELECT ten, ten_lop FROM SinhVien LEFT JOIN Lop ON lop = ma_lop ORDER BY ten') == [('An', 'Khoa học máy tính'), ('Bình', 'Khoa học máy tính'), ('Chi', 'Kỹ thuật phần mềm'), ('Dũng', None)]"
    steps:
      - show: |
          <div class="code"><div><span class="kw">SELECT</span> ten, ten_lop</div><div><span class="kw">FROM</span> SinhVien <span class="kw">JOIN</span> Lop <span class="kw">ON</span> lop = ma_lop;</div></div>
          <p><b>Nối trong</b> (<code>JOIN</code>): chỉ cặp khớp — 3 dòng, không có Dũng. Đúng phép $\bowtie$ của bài 1.</p>
          <div class="code"><div><span class="kw">FROM</span> SinhVien <span class="kw">LEFT JOIN</span> Lop <span class="kw">ON</span> lop = ma_lop;</div></div>
          <p><b>Nối ngoài trái</b> (<code>LEFT JOIN</code>): giữ <b>mọi</b> dòng bảng trái — 4 dòng; Dũng có tên lớp rỗng (NULL).</p>
        focus: [1, 2, 2, 3, 4, 4]
        say: "Câu này nối hai bảng theo khoá ngoại. Nối trong chỉ giữ các cặp khớp, được 3 dòng, không có Dũng. Đó đúng là phép nối của bài 1, tích rồi chỉ giữ cặp khớp. Đổi sang nối ngoài trái thì sao? Nối ngoài trái giữ mọi dòng của bảng bên trái, được 4 dòng. Dòng của Dũng vẫn có, với tên lớp để rỗng."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp"
    checks:
      - "len(alg.sql(\"SELECT ten FROM SinhVien LEFT JOIN Lop ON lop = ma_lop AND ten_lop = 'Khoa học máy tính'\")) == 4"
      - "alg.sql(\"SELECT ten FROM SinhVien LEFT JOIN Lop ON lop = ma_lop WHERE ten_lop = 'Khoa học máy tính'\") == [('An',), ('Bình',)]"
      - "len(alg.sql('SELECT * FROM SinhVien, Lop')) == 8 == 4 * 2 and len(alg.sql('SELECT * FROM SinhVien, Lop WHERE lop = ma_lop')) == 3"
      - "(lambda m: [m[x] for x in ['An', 'Bình', 'Chi']] == sorted(m[x] for x in ['Bình', 'An', 'Chi']))(dict(alg.sql('SELECT ten, ten_lop FROM SinhVien JOIN Lop ON lop = ma_lop')))"
      - "(lambda o1, o2: o1[0] == o2[1] == 'An' and 'Bình' not in (o1[0], o2[1]))(['An', 'Bình', 'Chi'], ['Bình', 'An', 'Chi'])"
      - "[r[0] for r in alg.sql('SELECT ten FROM SinhVien JOIN Lop ON lop = ma_lop ORDER BY ten_lop, mssv')] == ['An', 'Bình', 'Chi']"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Mong kết quả có thứ tự mà không viết <code>ORDER BY</code> <b class="red">(sai)</b>
          <br><span class="note">Không có <code>ORDER BY</code>, thứ tự là bất kỳ và có thể đổi khi dữ liệu hay chỉ mục đổi.</span></div>
        say: "Lỗi thứ nhất, mong kết quả có thứ tự mà không viết mệnh đề sắp xếp. Khi đó thứ tự là bất kỳ, và có thể đổi khi dữ liệu hay chỉ mục thay đổi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Liệt kê hai bảng mà quên điều kiện nối <b class="red">(sai)</b>
          <br><span class="note"><code>FROM SinhVien, Lop</code> không có điều kiện là phép tích: 8 dòng.</span></div>
          <table class="t"><tr><th>có điều kiện nối</th><th>quên điều kiện</th></tr><tr><td>3 dòng</td><td>$4 \times 2 = \hl{8}$ dòng</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, liệt kê hai bảng mà quên điều kiện nối. Khi đó câu truy vấn thành phép tích, 8 dòng thay vì 3."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nối ngoài rồi lọc bảng phải trong <code>WHERE</code> <b class="red">(sai)</b>
          <br><span class="note">“Mọi sinh viên, kèm tên lớp nếu là KHMT”: đặt điều kiện trong <code>ON</code> → 4 dòng. Đặt trong <code>WHERE</code> → chỉ 2 dòng: các dòng nối ngoài vừa giữ lại có tên lớp rỗng, bị lọc mất.</span></div>
        say: "Lỗi thứ ba, nối ngoài rồi lại lọc theo cột của bảng phải ở mệnh đề điều kiện. Muốn lấy mọi sinh viên, kèm tên lớp nếu là lớp Khoa học máy tính, đặt điều kiện trong phần nối thì được 4 dòng. Đặt nó ở mệnh đề lọc thì chỉ còn 2 dòng, vì các dòng nối ngoài vừa giữ lại có tên lớp rỗng và bị lọc mất."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Viết SQL như viết thuật toán <b class="red">(hiểu sai)</b>
          <br><span class="note">Thứ tự bảng sau <code>FROM</code> không quyết định cách chạy. Hệ quản trị tự chọn kế hoạch thực thi.</span></div>
        say: "Lỗi thứ tư, viết SQL như viết thuật toán từng bước. Thứ tự các bảng không quyết định cách chạy, chính hệ quản trị chọn kế hoạch thực thi dựa trên dữ liệu thật."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5.</b> Chia trang theo cột có giá trị trùng <b class="red">(người đã đi làm)</b>
          <br><span class="note">Sắp theo <code>ten_lop</code>, mỗi trang 1 dòng. An và Bình cùng lớp nên thứ tự giữa hai bạn là bất kỳ — mỗi lần chạy có thể khác.</span></div>
          <table class="t"><tr><th>lần chạy</th><th>thứ tự trả về</th><th>trang đọc</th><th>thấy</th></tr>
          <tr><td>lần 1</td><td>An, Bình, Chi</td><td>trang 1</td><td>An</td></tr>
          <tr><td>lần 2</td><td>Bình, An, Chi</td><td>trang 2</td><td><b class="red">An lần nữa</b></td></tr></table>
          <p class="note">Sửa: thêm khoá chính làm tiêu chí phụ, <code>ORDER BY ten_lop, mssv</code> → luôn An, Bình, Chi.</p>
        focus: [1, 1, 2, "2.2", "2.3", 3]
        say: "Lỗi thứ năm, của người đã đi làm, chia kết quả thành từng trang theo một cột có giá trị trùng. Sắp theo tên lớp, mỗi trang một dòng, thì An và Bình cùng lớp nên thứ tự giữa hai bạn là bất kỳ. Bảng cho thấy hai lần chạy đều đúng luật sắp xếp nhưng khác nhau. Lần đầu trả An trước, người dùng đọc trang 1 thấy An. Lần sau trả Bình trước, người dùng đọc trang 2 lại thấy An, còn Bình thì không bao giờ hiện ra. Cách sửa là thêm khoá chính làm tiêu chí sắp phụ, khi đó thứ tự luôn là An, Bình, Chi."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.sql('SELECT ten, ten_lop FROM SinhVien LEFT JOIN Lop ON lop = ma_lop ORDER BY ten')[3] == ('Dũng', None)"
      - "alg.sql('SELECT lop FROM SinhVien WHERE diem < 9') == [('K1',), ('K1',), (None,)]"
      - "[r[1] for r in alg.sql('SELECT ten, ten_lop FROM SinhVien LEFT JOIN Lop ON lop = ma_lop ORDER BY ten')] == ['Khoa học máy tính', 'Khoa học máy tính', 'Kỹ thuật phần mềm', None] and len(alg.sql('SELECT * FROM SinhVien JOIN Lop ON lop = ma_lop')) == 3"
      - "[t for t, d in alg.sql('SELECT ten, diem FROM SinhVien') if d < 9] == ['An', 'Bình', 'Dũng']"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Viết câu SQL liệt kê <b>mọi</b> sinh viên kèm tên lớp, sắp theo tên.</td></tr>
          <tr><td>2</td><td><code>SELECT lop FROM SinhVien WHERE diem &lt; 9;</code> cho mấy dòng?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, viết câu SQL liệt kê mọi sinh viên kèm tên lớp, sắp theo tên. Câu hai, câu truy vấn lấy cột lớp của sinh viên có điểm dưới 9 cho mấy dòng? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <div class="code"><div><span class="kw">SELECT</span> ten, ten_lop <span class="kw">FROM</span> SinhVien <span class="kw">LEFT JOIN</span> Lop <span class="kw">ON</span> lop = ma_lop <span class="kw">ORDER BY</span> ten;</div></div>
          <table class="t"><tr><th>ten</th><th>An</th><th>Bình</th><th>Chi</th><th>Dũng</th></tr><tr><td>ten_lop</td><td>KHMT</td><td>KHMT</td><td>KTPM</td><td>NULL</td></tr></table>
          <p>① “<b>mọi</b> sinh viên” → phải là <b>nối ngoài trái</b>; nối trong làm mất Dũng.</p>
        focus: [1, 3, 2, 2]
        say: "Đáp án câu một là câu này. Đề nói mọi sinh viên, nên phải dùng nối ngoài trái, vì nối trong sẽ làm mất Dũng. Kết quả có 4 dòng, sắp theo tên là An, Bình, Chi, Dũng. Dòng của Dũng có tên lớp rỗng."
      - clear: true
        show: |
          <p>② dò từng điểm so với 9:</p>
          <table class="t"><tr><th></th><th>An 8</th><th>Bình 6</th><th>Chi 9</th><th>Dũng 7</th></tr><tr><td>$\lt 9$?</td><td>có → K1</td><td>có → K1</td><td>không</td><td>có → NULL</td></tr></table>
          <p>→ $\hl{3}$ dòng: K1, K1, NULL (không bỏ trùng).</p>
        focus: [1, "2.2", 3]
        say: "Câu hai, dò từng điểm so với 9. An 8, Bình 6 và Dũng 7 đều nhỏ hơn 9, còn Chi đúng bằng 9 nên không lấy. Vậy được 3 dòng, K1, K1 và rỗng, vì SQL không tự bỏ dòng trùng."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n"><code>FROM</code>: bảng</span><span class="a">→</span>
          <span class="n"><code>WHERE</code>: lọc dòng</span><span class="a">→</span>
          <span class="n"><code>SELECT</code>: cột (không bỏ trùng)</span><span class="a">→</span>
          <span class="n"><code>ORDER BY</code>: thứ tự</span></div>
        say: "Tổng kết lại, hệ quản trị lấy bảng, lọc dòng, lấy cột mà không tự bỏ trùng, rồi mới sắp xếp. Nối trong chỉ giữ cặp khớp, nối ngoài trái giữ mọi dòng bên trái."
      - show: |
          <div class="box key"><b>Tư duy:</b> SQL là ngôn ngữ khai báo — mô tả kết quả, không mô tả thuật toán. Đọc một câu SQL bằng cách hỏi “kết quả gồm những dòng nào”.</div>
        say: "Điều cần mang theo, SQL là ngôn ngữ khai báo, mô tả kết quả chứ không mô tả thuật toán. Hãy đọc một câu SQL bằng cách hỏi kết quả gồm những dòng nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>gom nhóm</b>, hàm tổng hợp, và giá trị NULL với lôgic ba trị.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học gom nhóm, các hàm tổng hợp, và giá trị rỗng, khi một phép so sánh có tới ba kết quả. Hẹn gặp bạn ở bài tiếp theo."
