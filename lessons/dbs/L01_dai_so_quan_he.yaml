id: L01
course: DBS
series: "DBS · Cơ sở dữ liệu"
title: "Bài 1 — Đại số quan hệ: chọn, chiếu, tích, nối"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dbs.yaml L01; audit/dbs/verify_dbs.py L01 (sqlite3); E. F. Codd (1970); A. Silberschatz, H. F. Korth, S. Sudarshan, Database System Concepts (2019), mục 2.6"
assumes: [arith, cdot, set, sub, in, geq, ltgt, cap]
# Quy ước: CSDL mẫu Lop/SinhVien của bài 0 (alg.DB_DEMO). Phép chọn σ_{điều kiện}, phép chiếu π_{cột}, tích ×, nối ⋈_{điều kiện}.
#   Điều kiện ghép hai vế viết bằng chữ “và”. Ví dụ chiếu tránh cột có giá trị rỗng (NULL là chủ đề của bài 3).
#   Mọi số dòng do alg.sql chạy thật trên sqlite3 (câu SQL tương đương ghi ở checks).
objectives:
  - "Viết truy vấn bằng phép chọn, chiếu, nối"
  - "Đếm số dòng của tích và của phép nối"
  - "Biết nối = tích rồi chọn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Câu hỏi cần dữ liệu từ hai bảng"
    steps:
      - show: |
          <p>“Những sinh viên lớp <b>Khoa học máy tính</b> có điểm từ 7 trở lên là ai?”</p>
          <p>Tên lớp nằm ở bảng Lop, điểm nằm ở bảng SinhVien. Phải ghép hai bảng, rồi lọc, rồi lấy cột tên.</p>
          <div class="box key">Hôm nay: <b>đại số quan hệ</b> — bốn phép toán trên bảng: chọn, chiếu, tích, nối. Mỗi phép nhận bảng và trả về bảng.</div>
        focus: [1, 2, 2, 3, 3]
        say: "Chào bạn, câu hỏi là những sinh viên lớp Khoa học máy tính có điểm từ 7 trở lên là ai? Tên lớp nằm ở bảng lớp, còn điểm nằm ở bảng sinh viên. Ta phải ghép hai bảng, rồi lọc, rồi lấy cột tên. Hôm nay ta học đại số quan hệ, bốn phép toán trên bảng là chọn, chiếu, tích và nối. Mỗi phép nhận vào bảng và trả về một bảng."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hai bảng mẫu, tích hai tập, chữ “và”"
    checks:
      - "alg.sql('SELECT mssv, ten, lop, diem FROM SinhVien') == [(1, 'An', 'K1', 8.0), (2, 'Bình', 'K1', 6.0), (3, 'Chi', 'K2', 9.0), (4, 'Dũng', None, 7.0)]"
      - "alg.sql('SELECT * FROM Lop') == [('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm')]"
      - "len(list(__import__('itertools').product([1, 2], ['a', 'b', 'c']))) == 2 * 3 == 6"
      - "[(t, d, t and d >= 7) for t, d in [(True, 8), (True, 6)]] == [(True, 8, True), (True, 6, False)]"
    steps:
      - show: |
          <table class="t"><tr><th>mssv</th><th>ten</th><th>lop</th><th>diem</th></tr>
          <tr><td>1</td><td>An</td><td>K1</td><td>8</td></tr><tr><td>2</td><td>Bình</td><td>K1</td><td>6</td></tr>
          <tr><td>3</td><td>Chi</td><td>K2</td><td>9</td></tr><tr><td>4</td><td>Dũng</td><td>NULL</td><td>7</td></tr></table>
          <table class="t"><tr><th>ma_lop</th><th>ten_lop</th></tr><tr><td>K1</td><td>Khoa học máy tính</td></tr><tr><td>K2</td><td>Kỹ thuật phần mềm</td></tr></table>
        focus: [1, "1.2", "1.5", 2, 2]
        say: "Trước hết, nhắc lại hai bảng mẫu của bài 0. Bảng sinh viên có 4 dòng, mỗi dòng gồm mã số, tên, lớp và điểm, ví dụ An mã 1, lớp K1, điểm 8. Dũng mã 4 có ô lớp rỗng, vì chưa được xếp lớp. Bảng lớp có 2 dòng, K1 là Khoa học máy tính, K2 là Kỹ thuật phần mềm. Cột lớp của sinh viên là khoá ngoại, trỏ tới mã lớp."
      - clear: true
        show: |
          <p>Ở khoá Toán rời rạc: tích $A \times B$ là mọi cặp (một phần tử của $A$, một phần tử của $B$).</p>
          <table class="t"><tr><th>$A$</th><th>$B$</th><th>số cặp</th></tr>
          <tr><td>$\{1, 2\}$</td><td>$\{a, b, c\}$</td><td>$2 \cdot 3 = \hl{6}$</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Thứ hai, ở khoá Toán rời rạc, tích của hai tập là tập mọi cặp lấy một phần tử từ mỗi tập. Với A gồm 1 và 2, B gồm a, b, c, mỗi phần tử của A ghép được với 3 phần tử của B. Vậy có 2 nhân 3 bằng 6 cặp."
      - clear: true
        show: |
          <table class="t"><tr><th>sinh viên</th><th>lớp là K1?</th><th>điểm từ 7?</th><th>cả hai (“và”)</th></tr>
          <tr><td>An</td><td>đúng</td><td>đúng (8)</td><td><b>đúng</b></td></tr>
          <tr><td>Bình</td><td>đúng</td><td>sai (6)</td><td>sai</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thứ ba, điều kiện ghép bằng chữ và chỉ đúng khi cả hai vế cùng đúng. An học lớp K1 và có điểm 8, cả hai vế đều đúng, nên điều kiện đúng. Bình học lớp K1 nhưng chỉ có điểm 6, một vế sai, nên cả điều kiện sai."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: σ, π"
    checks:
      - "alg.sql('SELECT ten FROM SinhVien WHERE diem >= 7') == [('An',), ('Chi',), ('Dũng',)]"
      - "alg.sql('SELECT ten, diem FROM SinhVien') == [('An', 8.0), ('Bình', 6.0), ('Chi', 9.0), ('Dũng', 7.0)]"
    steps:
      - show: |
          <p><b>Chọn</b> $\sigma_{\text{điều kiện}}(R)$: giữ các <b>dòng</b> thoả điều kiện. $\sigma_{\text{diem} \ge 7}(\text{SinhVien})$ → An, Chi, Dũng.</p>
          <p><b>Chiếu</b> $\pi_{\text{các cột}}(R)$: giữ các <b>cột</b> được nêu, bỏ dòng trùng (kết quả vẫn là một tập). $\pi_{\text{ten}, \text{diem}}(\text{SinhVien})$ → 4 dòng, 2 cột.</p>
          <div class="box key">Chọn cắt theo chiều ngang (bớt dòng), chiếu cắt theo chiều dọc (bớt cột).</div>
        introduces: [select, proj]
        focus: [1, 1, 2, 2, 3]
        say: "Phép chọn, viết chữ sigma với điều kiện ở dưới, giữ các dòng thoả điều kiện. Ví dụ chọn sinh viên có điểm từ 7 trở lên, ta được An, Chi và Dũng. Phép chiếu, viết chữ pi với danh sách cột ở dưới, chỉ giữ các cột được nêu và bỏ dòng trùng, vì kết quả vẫn là một tập. Ví dụ chiếu lên tên và điểm, ta được 4 dòng, 2 cột. Dễ nhớ, phép chọn cắt theo chiều ngang, bớt dòng, còn phép chiếu cắt theo chiều dọc, bớt cột."

  # ───────────────────────── 3. TÍCH VÀ NỐI ─────────────────────────
  - id: join
    kind: concept
    title: "Tích × và nối ⋈"
    checks:
      - "alg.sql('SELECT COUNT(*) FROM SinhVien, Lop') == [(8,)] and 4 * 2 == len(alg.sql('SELECT * FROM SinhVien, Lop'))"
      - "alg.sql('SELECT COUNT(*) FROM SinhVien, Lop WHERE lop = ma_lop') == alg.sql('SELECT COUNT(*) FROM SinhVien JOIN Lop ON lop = ma_lop') == [(3,)]"
      - "alg.sql('SELECT ten FROM SinhVien JOIN Lop ON lop = ma_lop') == [('An',), ('Bình',), ('Chi',)]"
    steps:
      - show: |
          <p><b>Tích</b> $R \times S$: ghép <b>mọi</b> dòng của $R$ với <b>mọi</b> dòng của $S$. $\lvert \text{SinhVien} \times \text{Lop} \rvert = 4 \cdot 2 = \hl{8}$ dòng — phần lớn là ghép sai lớp.</p>
          <p><b>Nối</b> $R \bowtie_{\text{điều kiện}} S = \sigma_{\text{điều kiện}}(R \times S)$: chỉ giữ cặp khớp. Nối theo khoá ngoại, $\text{lop} = \text{ma\_lop}$: còn $\hl{3}$ dòng.</p>
          <p class="note">Dũng biến mất: ô lớp rỗng không khớp lớp nào.</p>
        introduces: [join, card]
        focus: [1, 1, 2, 2, 3]
        say: "Phép tích ghép mọi dòng của bảng thứ nhất với mọi dòng của bảng thứ hai. Bảng sinh viên 4 dòng nhân bảng lớp 2 dòng cho 8 dòng, phần lớn là ghép sai lớp. Phép nối chính là tích rồi chọn, chỉ giữ những cặp khớp điều kiện. Nối theo khoá ngoại, cột lớp bằng mã lớp, ta còn 3 dòng. Dũng biến mất khỏi kết quả, vì ô lớp của Dũng rỗng nên không khớp lớp nào."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nối là tích rồi chọn: một lưới 8 ô"
    checks:
      - "len(alg.sql('SELECT * FROM SinhVien, Lop')) == 8 and len(alg.sql('SELECT * FROM SinhVien, Lop WHERE lop = ma_lop')) == 3"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g font-size="26" font-weight="bold" fill="#2a78d6" text-anchor="middle"><text x="560" y="70">Lop K1</text><text x="860" y="70">Lop K2</text></g><text x="90" y="136" font-size="26" fill="#1f2937">An (lớp K1)</text><rect x="420" y="90" width="280" height="64" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="560" y="132" font-size="24" text-anchor="middle" fill="#059669">khớp: giữ</text><rect x="720" y="90" width="280" height="64" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="860" y="132" font-size="24" text-anchor="middle" fill="#6b7280">bỏ</text><text x="90" y="212" font-size="26" fill="#1f2937">Bình (lớp K1)</text><rect x="420" y="166" width="280" height="64" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="560" y="208" font-size="24" text-anchor="middle" fill="#059669">khớp: giữ</text><rect x="720" y="166" width="280" height="64" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="860" y="208" font-size="24" text-anchor="middle" fill="#6b7280">bỏ</text><text x="90" y="288" font-size="26" fill="#1f2937">Chi (lớp K2)</text><rect x="420" y="242" width="280" height="64" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="560" y="284" font-size="24" text-anchor="middle" fill="#6b7280">bỏ</text><rect x="720" y="242" width="280" height="64" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="860" y="284" font-size="24" text-anchor="middle" fill="#059669">khớp: giữ</text><text x="90" y="364" font-size="26" fill="#1f2937">Dũng (lớp rỗng)</text><rect x="420" y="318" width="280" height="64" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="560" y="360" font-size="24" text-anchor="middle" fill="#6b7280">bỏ</text><rect x="720" y="318" width="280" height="64" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="860" y="360" font-size="24" text-anchor="middle" fill="#6b7280">bỏ</text><g font-size="26" fill="#1f2937"><text x="1080" y="160">tích: 4 × 2 = 8 ô</text><text x="1080" y="220" fill="#059669" font-weight="bold">nối: giữ 3 ô khớp</text><text x="1080" y="280" fill="#6b7280">Dũng: cả hàng bị bỏ</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình xếp phép tích thành một lưới, mỗi hàng là một sinh viên, mỗi cột là một lớp, nên có 4 nhân 2 bằng 8 ô. Phép nối đi qua từng ô và chỉ giữ ô có lớp của sinh viên trùng mã lớp, đó là 3 ô tô xanh. An và Bình khớp K1, Chi khớp K2. Hàng của Dũng có lớp rỗng, không khớp ô nào, nên cả hàng bị bỏ."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Trả lời câu hỏi mở đầu"
    checks:
      - "alg.sql(\"SELECT ten FROM SinhVien JOIN Lop ON lop = ma_lop WHERE ten_lop = 'Khoa học máy tính' AND diem >= 7\") == [('An',)]"
      - "alg.sql(\"SELECT ten FROM SinhVien JOIN Lop ON lop = ma_lop WHERE ten_lop = 'Khoa học máy tính'\") == [('An',), ('Bình',)]"
    steps:
      - show: |
          <p>$\pi_{\text{ten}}\big(\sigma_{\text{ten\_lop} = \text{KHMT và diem} \ge 7}(\text{SinhVien} \bowtie_{\text{lop} = \text{ma\_lop}} \text{Lop})\big)$</p>
          <p class="note">Đọc từ trong ra ngoài: nối → chọn → chiếu. Mỗi bước dưới đây làm một phép và đếm số dòng.</p>
        focus: [1, 2]
        say: "Ghép lại, câu hỏi mở đầu thành biểu thức này. Ta đọc nó từ trong ra ngoài, nối trước, rồi chọn, rồi chiếu, và đếm số dòng sau mỗi bước."
      - show: |
          <p><b>Bước 1</b> — nối theo $\text{lop} = \text{ma\_lop}$: còn 3 dòng.</p>
          <table class="t"><tr><th>ten</th><th>lop</th><th>diem</th><th>ten_lop</th></tr>
          <tr><td>An</td><td>K1</td><td>8</td><td>Khoa học máy tính</td></tr>
          <tr><td>Bình</td><td>K1</td><td>6</td><td>Khoa học máy tính</td></tr>
          <tr><td>Chi</td><td>K2</td><td>9</td><td>Kỹ thuật phần mềm</td></tr></table>
        focus: [1, "2.2", "2.4"]
        say: "Bước một, nối hai bảng theo khoá ngoại, mỗi sinh viên được ghép với tên lớp của mình, còn 3 dòng. An và Bình mang tên lớp Khoa học máy tính. Chi mang tên lớp Kỹ thuật phần mềm, còn Dũng đã rơi vì lớp rỗng."
      - clear: true
        show: |
          <p><b>Bước 2</b> — chọn vế thứ nhất, $\text{ten\_lop} = \text{KHMT}$:</p>
          <table class="t"><tr><th>ten</th><th>ten_lop</th><th>giữ?</th></tr>
          <tr><td>An</td><td>Khoa học máy tính</td><td>giữ</td></tr><tr><td>Bình</td><td>Khoa học máy tính</td><td>giữ</td></tr>
          <tr><td>Chi</td><td>Kỹ thuật phần mềm</td><td>bỏ</td></tr></table>
        focus: [1, "2.2", "2.4"]
        say: "Bước hai, xét vế thứ nhất của điều kiện, tên lớp phải là Khoa học máy tính. Hai bạn An và Bình học đúng lớp đó nên được giữ lại. Chi bị bỏ, vì Chi học Kỹ thuật phần mềm, nên còn 2 dòng."
      - clear: true
        show: |
          <p><b>Bước 3</b> — vế thứ hai, $\text{diem} \ge 7$:</p>
          <table class="t"><tr><th>ten</th><th>diem</th><th>$\ge 7$?</th></tr>
          <tr><td>An</td><td>8</td><td>đúng → giữ</td></tr><tr><td>Bình</td><td>6</td><td>sai → bỏ</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, xét vế thứ hai, điểm phải từ 7 trở lên. An có điểm 8, đúng, nên giữ. Bình có điểm 6, sai, nên bỏ, chỉ còn 1 dòng."
      - show: |
          <p><b>Bước 4</b> — chiếu lên cột tên: $\hl{\{\text{An}\}}$. Số dòng qua từng bước: 3, 2, 1, 1.</p>
        say: "Bước bốn, chiếu lên cột tên, kết quả là tập chỉ gồm An. Đếm lại số dòng qua từng bước, ta có 3, rồi 2, rồi 1, và cuối cùng vẫn là 1."
      - clear: true
        show: |
          <p>Câu SQL tương ứng:</p>
          <div class="code"><div><span class="kw">SELECT</span> ten</div><div><span class="kw">FROM</span> SinhVien <span class="kw">JOIN</span> Lop <span class="kw">ON</span> lop = ma_lop</div><div><span class="kw">WHERE</span> ten_lop = 'Khoa học máy tính' <span class="kw">AND</span> diem &gt;= 7;</div></div>
          <p class="note">Chạy thật trên SQLite: kết quả đúng một dòng, An.</p>
        focus: [1, "2.1", "2.2", "2.3", 3]
        say: "Biểu thức này có một câu SQL tương ứng. Dòng đầu ứng với phép chiếu lên tên. Dòng hai ứng với phép nối. Dòng ba ứng với phép chọn. Chạy thật trên một hệ quản trị, kết quả đúng một dòng là An."

  - id: check
    kind: check
    title: "Tự kiểm: dò cả 8 cặp, và đổi thứ tự phép"
    checks:
      - "[(s[1], l[1]) for s in alg.sql('SELECT * FROM SinhVien') for l in alg.sql('SELECT * FROM Lop') if s[2] == l[0] and l[1] == 'Khoa học máy tính' and s[3] >= 7] == [('An', 'Khoa học máy tính')]"
      - "len([1 for s in alg.sql('SELECT * FROM SinhVien') for l in alg.sql('SELECT * FROM Lop')]) == 8"
      - "alg.sql('SELECT ten FROM SinhVien WHERE diem >= 7') == [('An',), ('Chi',), ('Dũng',)]"
      - "alg.sql('SELECT ten FROM (SELECT * FROM SinhVien WHERE diem >= 7) JOIN Lop ON lop = ma_lop') == [('An',), ('Chi',)]"
      - "alg.sql(\"SELECT ten FROM (SELECT * FROM SinhVien WHERE diem >= 7) JOIN Lop ON lop = ma_lop WHERE ten_lop = 'Khoa học máy tính'\") == [('An',)]"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>dò thẳng cả $4 \cdot 2 = 8$ cặp, giữ cặp thoả cả ba điều kiện</td><td>1 cặp: An với Khoa học máy tính</td></tr></table>
        focus: [1, "1.2"]
        say: "Kiểm bằng đường thứ nhất, bỏ hết phép toán, dò thẳng cả 4 nhân 2 bằng 8 cặp của tích. Chỉ một cặp thoả cả ba điều kiện cùng lúc, là An với lớp Khoa học máy tính, khớp kết quả, vì dò thẳng không phụ thuộc thứ tự phép nào."
      - show: |
          <table class="t"><tr><th>đổi thứ tự: chọn điểm trước</th><th>số dòng</th><th>dòng còn lại</th></tr>
          <tr><td>chọn $\text{diem} \ge 7$</td><td>3</td><td>An, Chi, Dũng</td></tr>
          <tr><td>nối với Lop</td><td>2</td><td>An, Chi</td></tr>
          <tr><td>chọn lớp KHMT, chiếu tên</td><td>1</td><td>$\hl{\text{An}}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đường thứ hai, đổi thứ tự, chọn điểm từ 7 trở lên trước tiên. Được 3 dòng là An, Chi và Dũng. Nối với bảng lớp còn An và Chi, vì Dũng có lớp rỗng. Chọn lớp Khoa học máy tính rồi chiếu tên, vẫn ra đúng An, nên thứ tự phép không làm đổi kết quả."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp"
    checks:
      - "alg.sql('SELECT COUNT(*) FROM SinhVien, Lop') == [(8,)]"
      - "alg.sql('SELECT COUNT(*) FROM SinhVien JOIN Lop ON lop = ma_lop') == [(3,)] and alg.sql('SELECT COUNT(*) FROM SinhVien') == [(4,)]"
      - "len(alg.sql('SELECT ten_lop FROM SinhVien JOIN Lop ON lop = ma_lop')) == 3 and len(alg.sql('SELECT DISTINCT ten_lop FROM SinhVien JOIN Lop ON lop = ma_lop')) == 2"
      - "10000 * 1000 == 10 ** 7 and alg.sql('SELECT COUNT(*) FROM Lop') == [(2,)]"
      - "len(alg.sql('SELECT * FROM SinhVien WHERE diem >= 7')) * 2 == 3 * 2 == 6 and 4 * 2 == 8"
      - "alg.sql(\"SELECT ten FROM (SELECT * FROM SinhVien WHERE diem >= 7) JOIN Lop ON lop = ma_lop WHERE ten_lop = 'Khoa học máy tính'\") == alg.sql(\"SELECT ten FROM SinhVien JOIN Lop ON lop = ma_lop WHERE ten_lop = 'Khoa học máy tính' AND diem >= 7\") == [('An',)]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nối mà quên điều kiện <b class="red">(sai)</b>
          <br><span class="note">Thành tích: 8 dòng thay vì 3. Với bảng 10 000 × 1000 dòng là mười triệu dòng rác.</span></div>
          <table class="t"><tr><th></th><th>có điều kiện</th><th>quên điều kiện</th></tr>
          <tr><td>SinhVien, Lop</td><td>3</td><td><b class="red">8</b></td></tr>
          <tr><td>10 000 và 1000 dòng</td><td>tối đa 10 000</td><td><b class="red">10 000 000</b></td></tr></table>
        focus: [1, 1, "2.3"]
        say: "Lỗi thứ nhất, nối mà quên điều kiện. Khi đó phép nối thành phép tích, 8 dòng thay vì 3. Với hai bảng mười nghìn và một nghìn dòng, mỗi dòng bên trái chỉ khớp tối đa một lớp nên có điều kiện thì tối đa mười nghìn, còn quên điều kiện là mười triệu dòng rác."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ nối giữ mọi dòng của bảng trái <b class="red">(sai)</b>
          <br><span class="note">Dòng không khớp (Dũng, lớp rỗng) bị bỏ. Muốn giữ phải dùng <b>nối ngoài</b>.</span></div>
        say: "Lỗi thứ hai, nghĩ phép nối giữ mọi dòng của bảng bên trái. Dòng không khớp, như Dũng có lớp rỗng, bị bỏ đi. Muốn giữ lại phải dùng một kiểu nối khác, gọi là nối ngoài."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn chọn với chiếu <b class="red">(sai)</b>
          <br><span class="note">Chọn bớt <b>dòng</b>, chiếu bớt <b>cột</b>.</span></div>
        say: "Lỗi thứ ba, lẫn phép chọn với phép chiếu. Phép chọn bớt dòng, phép chiếu bớt cột."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên rằng phép chiếu bỏ dòng trùng <b class="red">(thiếu)</b>
          <br><span class="note">$\pi_{\text{ten\_lop}}$ của 3 dòng nối chỉ còn 2 tên lớp. SQL thì <b>không</b> tự bỏ trùng — phải xin rõ bằng <code>DISTINCT</code>.</span></div>
        say: "Lỗi thứ tư, quên rằng phép chiếu bỏ dòng trùng. Chiếu 3 dòng nối lên tên lớp chỉ còn 2 tên. Ngược lại, SQL không tự bỏ dòng trùng, ta phải yêu cầu rõ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5.</b> Thấy kết quả 1 dòng, tưởng truy vấn nhẹ <b class="red">(người đã đi làm)</b>
          <br><span class="note">Cái tốn là số cặp phải xét ở giữa, không phải số dòng cuối. Lọc sớm thì bớt cặp, kết quả không đổi.</span></div>
          <table class="t"><tr><th>cách làm</th><th>cặp phải xét</th><th>kết quả</th></tr>
          <tr><td>nối 4 dòng với 2 lớp rồi mới lọc</td><td>$4 \cdot 2 = 8$</td><td>An</td></tr>
          <tr><td>chọn $\text{diem} \ge 7$ trước (còn 3 dòng) rồi nối</td><td>$3 \cdot 2 = 6$</td><td>An</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ năm, của người đã đi làm, thấy kết quả chỉ một dòng nên tưởng truy vấn nhẹ. Cái tốn là số cặp phải xét ở giữa, không phải số dòng cuối cùng. Bảng so hai cách làm cùng một câu hỏi. Nối 4 dòng với 2 lớp rồi mới lọc thì phải xét 4 nhân 2 bằng 8 cặp. Chọn điểm từ 7 trước, còn 3 dòng, rồi mới nối thì chỉ xét 3 nhân 2 bằng 6 cặp, và kết quả vẫn là An."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.sql('SELECT COUNT(*) FROM SinhVien WHERE diem < 7') == [(1,)]"
      - "alg.sql('SELECT DISTINCT ten_lop FROM SinhVien JOIN Lop ON lop = ma_lop WHERE diem >= 7') == [('Khoa học máy tính',), ('Kỹ thuật phần mềm',)]"
      - "len(alg.sql('SELECT * FROM Lop, Lop AS L2')) == 4"
      - "alg.sql('SELECT ten FROM SinhVien WHERE diem < 7') == [('Bình',)] and alg.sql('SELECT ten, lop FROM SinhVien JOIN Lop ON lop = ma_lop WHERE diem >= 7') == [('An', 'K1'), ('Chi', 'K2')]"
      - "alg.sql('SELECT L1.ma_lop, L2.ma_lop FROM Lop AS L1, Lop AS L2 ORDER BY 1, 2') == [('K1', 'K1'), ('K1', 'K2'), ('K2', 'K1'), ('K2', 'K2')]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\lvert \sigma_{\text{diem} \lt 7}(\text{SinhVien}) \rvert$ bằng mấy?</td></tr>
          <tr><td>2</td><td>$\pi_{\text{ten\_lop}}\big(\sigma_{\text{diem} \ge 7}(\text{SinhVien} \bowtie_{\text{lop} = \text{ma\_lop}} \text{Lop})\big)$ cho những gì?</td></tr>
          <tr><td>3</td><td>$\lvert \text{Lop} \times \text{Lop} \rvert$ bằng mấy?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chọn sinh viên có điểm dưới 7, được mấy dòng? Câu hai, nối hai bảng, chọn điểm từ 7 trở lên, rồi chiếu lên tên lớp, được những gì? Câu ba, tích của bảng lớp với chính nó có mấy dòng? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① dò từng điểm so với 7:</p>
          <table class="t"><tr><th>An</th><th>Bình</th><th>Chi</th><th>Dũng</th></tr>
          <tr><td>8: không</td><td>6: <b>có</b></td><td>9: không</td><td>7: không</td></tr></table>
          <p>→ $\hl{1}$ dòng: Bình. (Điểm 7 không nhỏ hơn 7.)</p>
        focus: [1, "2.2", 3]
        say: "Đáp án câu một, dò từng điểm xem có nhỏ hơn 7 không. Chỉ Bình, điểm 6, thoả, còn Dũng có điểm 7 không nhỏ hơn 7. Vậy kết quả có đúng 1 dòng là Bình."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: bước</th><th>còn lại</th></tr>
          <tr><td>nối theo khoá ngoại</td><td>An, Bình, Chi</td></tr>
          <tr><td>chọn $\text{diem} \ge 7$</td><td>An (K1), Chi (K2)</td></tr>
          <tr><td>chiếu lên tên lớp</td><td>$\hl{\{\text{Khoa học máy tính}, \text{Kỹ thuật phần mềm}\}}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, làm từ trong ra ngoài. Nối theo khoá ngoại còn An, Bình và Chi, Dũng tuy có điểm 7 nhưng đã rơi ở bước này. Chọn điểm từ 7 trở lên còn An lớp K1 và Chi lớp K2. Chiếu lên tên lớp được hai lớp, Khoa học máy tính và Kỹ thuật phần mềm."
      - clear: true
        show: |
          <p>③ mỗi lớp ghép với cả 2 lớp: $2 \cdot 2 = \hl{4}$ dòng — (K1, K1), (K1, K2), (K2, K1), (K2, K2).</p>
        say: "Câu ba, mỗi lớp được ghép với cả 2 lớp, kể cả chính nó, nên có 2 nhân 2 bằng 4 dòng. Đó là K1 với K1, K1 với K2, K2 với K1, và K2 với K2."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$\sigma$: bớt dòng</span><span class="a">→</span>
          <span class="n">$\pi$: bớt cột, bỏ trùng</span><span class="a">→</span>
          <span class="n">$\times$: mọi cặp</span><span class="a">→</span>
          <span class="n">$\bowtie$ = $\sigma$ sau $\times$: cặp khớp</span></div>
        say: "Tổng kết lại, phép chọn bớt dòng, phép chiếu bớt cột và bỏ dòng trùng, phép tích ghép mọi cặp, và phép nối là tích rồi chọn, chỉ giữ cặp khớp."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi phép nhận bảng, trả bảng, nên ghép được thành chuỗi. Đọc một truy vấn phức tạp từ trong ra ngoài, đếm số dòng sau mỗi bước.</div>
        say: "Điều cần mang theo, mỗi phép nhận bảng và trả về bảng, nên ghép được thành chuỗi. Hãy đọc một truy vấn phức tạp từ trong ra ngoài, và đếm số dòng sau mỗi bước."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>SQL</b> — viết các phép này thành <code>SELECT</code>, <code>WHERE</code>, <code>JOIN</code>, <code>ORDER BY</code>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học SQL, ngôn ngữ viết các phép này thành câu truy vấn mà mọi hệ quản trị đều hiểu. Hẹn gặp bạn ở bài tiếp theo."
