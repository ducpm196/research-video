id: L04
course: DBS
series: "DBS · Cơ sở dữ liệu"
title: "Bài 4 — Phụ thuộc hàm, bao đóng thuộc tính và khoá"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dbs.yaml L04; audit/dbs/verify_dbs.py L04; W. W. Armstrong (1974); A. Silberschatz, H. F. Korth, S. Sudarshan, Database System Concepts (2019), mục 7.4"
assumes: [arith, set, subseteq, in, implies]
# Quy ước: thuộc tính là chữ hoa đơn A, B, C…; tập thuộc tính viết liền (AD = {A, D}); phụ thuộc hàm X → Y (fd); bao đóng X⁺.
#   Ví dụ cụ thể: DangKy(mssv, ten, ma_mon, ten_mon, diem). Mọi bao đóng và khoá do alg.attr_closure / alg.candidate_keys tính
#   (duyệt mọi tập con), đối chiếu độc lập trong audit/dbs/verify_dbs.py.
objectives:
  - "Đọc phụ thuộc hàm X → Y từ ngữ nghĩa dữ liệu"
  - "Tính bao đóng thuộc tính X⁺"
  - "Tìm khoá từ tập phụ thuộc hàm"
asr_reviewed:
  - {sentence: "Bước một, tính bao đóng của A, lượt đầu bắt đầu từ chính A.", reason: "ASR chép “Bước 1, tính bao đóng của A, lượt đầu bắt đầu từ chính nha.” (0.929): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Luật B C xác định D cần cả B lẫn C, mà C chưa có, nên chưa áp được.", reason: "ASR chép “Luật B xe xác định dây cần cả B lẫn xe mà xe chưa có nên chưa áp được.” (0.947): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Do đó A D là khoá duy nhất.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bỏ A hay bỏ D đều không đủ, nên A D là khoá.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Mẹo nhanh, D không nằm ở vế phải của luật nào, nên mọi khoá đều phải chứa D, và A cũng vậy.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "A B D cũng xác định cả R nên là siêu khoá, nhưng không tối tiểu, vì bỏ B vẫn đủ.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bây giờ đến lượt bạn tự làm, với lược đồ R gồm năm thuộc tính A đến E, và ba luật, A xác định B, B C xác định D, D xác định E.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Biết mã số thì biết tên"
    steps:
      - show: |
          <p>Bảng đăng ký học: $\text{DangKy}(\text{mssv}, \text{ten}, \text{ma\_mon}, \text{ten\_mon}, \text{diem})$.</p>
          <p>Biết mã số sinh viên thì biết tên. Biết mã môn thì biết tên môn. Biết <b>cả</b> mã số lẫn mã môn mới biết điểm.</p>
          <div class="box key">Hôm nay: viết những luật “biết cái này thì biết cái kia” thành <b>phụ thuộc hàm</b>, rồi dùng chúng để tìm <b>khoá</b> một cách chắc chắn.</div>
        focus: [1, 2, 2, 2, 3]
        say: "Chào bạn, xét bảng đăng ký học gồm mã số sinh viên, tên, mã môn, tên môn và điểm. Biết mã số sinh viên thì biết tên. Biết mã môn thì biết tên môn. Còn điểm thì phải biết cả mã số lẫn mã môn. Hôm nay ta viết những luật biết cái này thì biết cái kia thành phụ thuộc hàm, rồi dùng chúng để tìm khoá một cách chắc chắn."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tập con, hợp, hàm, khoá chính"
    checks:
      - "{'A'} <= {'A', 'B', 'C'} and {'A', 'B'} | {'C'} == {'A', 'B', 'C'} and not {'D'} <= {'A', 'B', 'C'}"
      - "len({m: t for m, t in [(1, 'An'), (2, 'Bình'), (1, 'An')]}) == 2 and len({(m, t) for m, t in [(1, 'An'), (2, 'Bình'), (1, 'Ân')]}) == 3"
      - "alg.sql_error(\"INSERT INTO SinhVien VALUES (1, 'Giang', 'K1', 7)\") == 'UNIQUE constraint failed: SinhVien.mssv'"
    steps:
      - show: |
          <table class="t"><tr><th>phép trên tập hợp</th><th>ví dụ</th><th>kết quả</th></tr>
          <tr><td>tập con $\subseteq$</td><td>$\{A\} \subseteq \{A, B, C\}$? $\{D\} \subseteq \{A, B, C\}$?</td><td>có; không</td></tr>
          <tr><td>hợp $\cup$</td><td>$\{A, B\} \cup \{C\}$</td><td>$\{A, B, C\}$</td></tr></table>
        introduces: [cup]
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ta cần hai phép trên tập hợp, tức một nhóm phần tử không lặp và không xếp thứ tự. Tập con nghĩa là mọi phần tử của tập này đều nằm trong tập kia, nên tập gồm A là tập con của A, B, C, còn tập gồm D thì không. Phép hợp gộp hai tập lại, A, B hợp với C được A, B, C."
      - show: |
          <table class="t"><tr><th>mssv</th><th>ten</th><th></th></tr>
          <tr><td>1</td><td>An</td><td rowspan="2">mỗi mã một tên → là hàm</td></tr><tr><td>2</td><td>Bình</td></tr>
          <tr><td>1</td><td><b class="red">Ân</b></td><td>mã 1 có hai tên → <b class="red">không</b> còn là hàm</td></tr></table>
        focus: [1, "1.2", "1.4"]
        say: "Thứ hai, một hàm gán cho mỗi đầu vào đúng một đầu ra. Mã 1 cho tên An, mã 2 cho tên Bình, mỗi mã một tên, nên phép gán từ mã sang tên là một hàm. Nếu có thêm dòng mã 1 mà tên là Ân, thì mã 1 có hai tên, và phép gán ấy không còn là hàm nữa."
      - show: |
          <p>Khoá chính (bài 0): xác định duy nhất mỗi dòng. Thêm sinh viên mã 1 lần nữa → <b class="red">từ chối</b>: <code>UNIQUE constraint failed: SinhVien.mssv</code>.</p>
          <p class="note">Hôm nay: tìm khoá bằng suy luận, không phải bằng đoán.</p>
        focus: [1, 2]
        say: "Thứ ba, nhắc lại bài 0, khoá chính xác định duy nhất mỗi dòng, nên thêm sinh viên mã 1 lần nữa bị hệ quản trị từ chối. Hôm nay ta học cách tìm khoá bằng suy luận chắc chắn, thay vì đoán."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: X → Y và X⁺"
    checks:
      - "alg.attr_closure('M', [('M', 'T'), ('H', 'N'), ('MH', 'D')])[0] == {'M', 'T'}"
    steps:
      - show: |
          <p><b>Phụ thuộc hàm</b> $X \to Y$: hai dòng nào trùng giá trị ở $X$ thì phải trùng giá trị ở $Y$. Ví dụ $\text{mssv} \to \text{ten}$.</p>
          <p>Bảng đăng ký: $\text{mssv} \to \text{ten}$, $\quad \text{ma\_mon} \to \text{ten\_mon}$, $\quad \{\text{mssv}, \text{ma\_mon}\} \to \text{diem}$.</p>
          <p><b>Bao đóng</b> $X^+$: tập mọi thuộc tính suy ra được từ $X$ bằng các phụ thuộc hàm. $\{\text{mssv}\}^+ = \{\text{mssv}, \text{ten}\}$.</p>
          <div class="box key"><b>Khoá</b>: tập $K$ <b>tối tiểu</b> (bỏ bất kỳ thuộc tính nào là không còn đủ) có $K^+$ chứa mọi thuộc tính của bảng — biết $K$ là biết cả dòng.</div>
        introduces: [fd, closure]
        focus: [1, 1, 2, 3, 3, 4]
        say: "Phụ thuộc hàm X xác định Y nghĩa là, hai dòng nào trùng giá trị ở X thì cũng phải trùng giá trị ở Y. Ví dụ mã số xác định tên. Bảng đăng ký có ba phụ thuộc hàm, mã số xác định tên, mã môn xác định tên môn, và cặp mã số với mã môn xác định điểm. Bao đóng của X, viết X với dấu cộng phía trên, là tập mọi thuộc tính suy ra được từ X. Ví dụ bao đóng của mã số chỉ gồm mã số và tên. Khoá là tập tối tiểu mà bao đóng chứa mọi thuộc tính của bảng, tối tiểu nghĩa là bỏ bất kỳ thuộc tính nào là không còn đủ, và biết khoá là biết cả dòng."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Thuật toán tính bao đóng"
    checks:
      - "alg.attr_closure('A', [('A', 'B'), ('B', 'C')])[1] == [('A', 'B', 'AB'), ('B', 'C', 'ABC')]"
    steps:
      - show: |
          <ol><li>Bắt đầu: $X^+ \leftarrow X$.</li>
          <li>Lặp: với mỗi $U \to V$ mà $U \subseteq X^+$, thêm $V$ vào $X^+$.</li>
          <li>Dừng khi một lượt không thêm được gì.</li></ol>
          <p class="note">Vì sao đúng? Mỗi lần thêm đều theo một phụ thuộc hàm đã biết (bắc cầu); và thuật toán chỉ dừng khi không luật nào còn áp được, nên không bỏ sót.</p>
        introduces: [assign]
        focus: [1, "1.1", "1.2", "1.3", 2, 2]
        say: "Thuật toán tính bao đóng rất đơn giản. Bắt đầu, bao đóng chỉ gồm chính X, mũi tên trái nghĩa là gán giá trị. Rồi lặp lại, với mỗi phụ thuộc hàm U xác định V mà U đã nằm trong bao đóng, ta thêm V vào. Dừng khi một lượt không thêm được gì nữa. Vì sao đúng? Mỗi lần thêm đều theo một luật đã biết, nối tiếp nhau như bắc cầu, và thuật toán chỉ dừng khi không luật nào còn áp dụng được, nên không bỏ sót."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bao đóng là vết loang theo mũi tên"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arD4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g stroke="#1f2937" stroke-width="3"><circle cx="200" cy="110" r="55" fill="#bbf7d0"/><circle cx="550" cy="110" r="55" fill="#dbeafe"/><circle cx="900" cy="110" r="55" fill="#dbeafe"/><circle cx="1250" cy="110" r="55" fill="#f3f4f6" stroke-dasharray="8 6"/></g><g font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="200" y="121">A</text><text x="550" y="121">B</text><text x="900" y="121">C</text><text x="1250" y="121">D</text></g><g stroke="#1f2937" stroke-width="3"><line x1="257" y1="110" x2="488" y2="110" marker-end="url(#arD4)"/><line x1="607" y1="110" x2="838" y2="110" marker-end="url(#arD4)"/></g><g font-size="24" text-anchor="middle" fill="#2a78d6"><text x="375" y="90">A → B</text><text x="725" y="90">B → C</text></g><g font-size="26" fill="#1f2937"><text x="120" y="240">lượt 0: bắt đầu từ A</text><text x="760" y="240" font-weight="bold">{A}</text><text x="120" y="290">áp A → B (A đã có)</text><text x="760" y="290" font-weight="bold">{A, B}</text><text x="120" y="340">áp B → C (B đã có)</text><text x="760" y="340" font-weight="bold">{A, B, C}</text><text x="120" y="390" fill="#b91c1c">không mũi tên nào tới D → không lan tới D</text></g><text x="1250" y="210" font-size="22" text-anchor="middle" fill="#6b7280">phải có sẵn trong khoá</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi thuộc tính là một vòng tròn, mỗi phụ thuộc hàm là một mũi tên. Tính bao đóng giống như đổ mực vào vòng xuất phát rồi để mực loang theo mũi tên, từ A sang B, rồi từ B sang C. Không có mũi tên nào đi tới D, nên mực không bao giờ loang tới D. Vì vậy D phải có sẵn trong mọi khoá, và đó chính là mẹo ta sẽ dùng ở ví dụ."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "R(A, B, C, D), F = {A → B, B → C}"
    checks:
      - "alg.attr_closure('A', [('A', 'B'), ('B', 'C')])[0] == {'A', 'B', 'C'}"
      - "alg.attr_closure('AD', [('A', 'B'), ('B', 'C')])[0] == set('ABCD')"
      - "alg.candidate_keys('ABCD', [('A', 'B'), ('B', 'C')]) == ['AD']"
      - "alg.candidate_keys('MTHND', [('M', 'T'), ('H', 'N'), ('MH', 'D')]) == ['HM']"
    steps:
      - show: |
          <p><b>Bước 1</b> — $A^+$ với $F = \{A \to B,\ B \to C\}$:</p>
          <table class="t"><tr><th>lượt</th><th>luật áp được</th><th>$A^+$</th></tr>
          <tr><td>0</td><td>—</td><td>$\{A\}$</td></tr><tr><td>1</td><td>$A \to B$</td><td>$\{A, B\}$</td></tr>
          <tr><td>2</td><td>$B \to C$</td><td>$\hl{\{A, B, C\}}$</td></tr><tr><td>3</td><td>không còn luật mới</td><td>dừng</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Xét lược đồ R gồm A, B, C, D, với hai phụ thuộc hàm A xác định B và B xác định C. Bước một, tính bao đóng của A, lượt đầu bắt đầu từ chính A. Luật thứ nhất áp được vì A đã có, thêm B. Luật thứ hai áp được vì B vừa có, thêm C. Không còn luật nào thêm được gì, nên dừng."
      - show: |
          <p><b>Bước 2</b> — $A^+ = \{A, B, C\}$ thiếu $D$ → $A$ <b>không</b> phải khoá.</p>
        say: "Bước hai, so với lược đồ, bao đóng của A gồm A, B, C mà thiếu D. Biết A chưa đủ để biết cả dòng, nên A không phải khoá."
      - clear: true
        show: |
          <p><b>Bước 3</b> — $(AD)^+$:</p>
          <table class="t"><tr><th>lượt</th><th>luật áp được</th><th>$(AD)^+$</th></tr>
          <tr><td>0</td><td>—</td><td>$\{A, D\}$</td></tr><tr><td>1</td><td>$A \to B$</td><td>$\{A, B, D\}$</td></tr>
          <tr><td>2</td><td>$B \to C$</td><td>$\hl{\{A, B, C, D\}}$ = cả $R$</td></tr></table>
          <p class="note">Tập có bao đóng là cả $R$ gọi là <b>siêu khoá</b>; khoá là siêu khoá tối tiểu.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước ba, thêm D vào, tính bao đóng của A D. Bắt đầu từ A và D. Luật thứ nhất thêm B. Luật thứ hai thêm C, được cả R. Tập nào có bao đóng là cả R gọi là siêu khoá, nên A D là siêu khoá, và còn phải kiểm xem nó có tối tiểu không."
      - show: |
          <p><b>Bước 4</b> — tối tiểu? Thử bỏ từng thuộc tính:</p>
          <table class="t"><tr><th>bỏ</th><th>còn</th><th>bao đóng</th><th>đủ $R$?</th></tr>
          <tr><td>$D$</td><td>$A$</td><td>$\{A, B, C\}$</td><td>không</td></tr><tr><td>$A$</td><td>$D$</td><td>$\{D\}$</td><td>không</td></tr></table>
        focus: [1, "2.2", "2.3", 2]
        say: "Bước bốn, kiểm xem A D có tối tiểu không bằng cách thử bỏ từng thuộc tính. Bỏ D thì còn A, bao đóng thiếu D. Bỏ A thì còn D, bao đóng chỉ là D. Bỏ A hay bỏ D đều không đủ, nên A D là khoá."
      - clear: true
        show: |
          <div class="box key"><b>Bước 5</b> — mẹo: $D$ không nằm ở vế phải luật nào, nên <b>mọi</b> khoá phải chứa $D$. Tương tự $A$. Mọi khoá chứa $AD$, mà $AD$ đã là khoá, nên tập lớn hơn không tối tiểu. Vậy $AD$ là khoá duy nhất.</div>
        say: "Bước năm, còn khoá nào khác không? Mẹo nhanh, D không nằm ở vế phải của luật nào, nên mọi khoá đều phải chứa D, và A cũng vậy. Mọi khoá đều chứa A D, mà A D đã là khoá, nên tập nào lớn hơn cũng bỏ bớt được, không tối tiểu. Do đó A D là khoá duy nhất."
      - clear: true
        show: |
          <p>Bảng đăng ký: $\text{mssv}$ và $\text{ma\_mon}$ đều không ở vế phải luật nào, nên khoá phải chứa cả hai.</p>
          <p>$\{\text{mssv}, \text{ma\_mon}\}^+$ = mssv, ma_mon, rồi ten, ten_mon, diem = cả bảng → khoá là $\hl{\{\text{mssv}, \text{ma\_mon}\}}$.</p>
        focus: [1, 2, 2]
        say: "Áp dụng cho bảng đăng ký, mã số và mã môn đều không nằm ở vế phải của luật nào, nên khoá phải chứa cả hai. Bao đóng của cặp đó gồm mã số, mã môn, thêm tên, tên môn, rồi điểm, tức là cả bảng. Vậy khoá của bảng đăng ký là cặp mã số và mã môn."

  - id: check
    kind: check
    title: "Tự kiểm: thử cả 16 tập con"
    checks:
      - "(lambda subs: len(subs) == 16 and sorted(''.join(sorted(s)) for s in subs if alg.attr_closure(s, [('A', 'B'), ('B', 'C')])[0] == set('ABCD')) == ['ABCD', 'ABD', 'ACD', 'AD'])([c for k in range(5) for c in __import__('itertools').combinations('ABCD', k)])"
      - "2 ** 4 == 16 and 2 ** 2 == 4"
      - "alg.attr_closure('D', [('A', 'B'), ('B', 'C')])[0] == {'D'} and alg.attr_closure('AD', [('A', 'B'), ('B', 'C')])[1] == [('A', 'B', 'ABD'), ('B', 'C', 'ABCD')]"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: tính bao đóng của mọi tập con</th><th>kết quả</th></tr>
          <tr><td>số tập con của $\{A, B, C, D\}$</td><td>$2^4 = 16$</td></tr>
          <tr><td>tập có bao đóng là cả $R$ (siêu khoá)</td><td>$AD$, $ABD$, $ACD$, $ABCD$ — 4 tập</td></tr>
          <tr><td>trong đó tối tiểu</td><td>chỉ $\hl{AD}$</td></tr></table>
        introduces: [power]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta bỏ mẹo đi và cho máy tính bao đóng của mọi tập con. Lược đồ có 4 thuộc tính nên có 2 mũ 4 bằng 16 tập con. Đúng 4 tập có bao đóng là cả R, là A D, A B D, A C D và A B C D. Trong 4 tập đó chỉ A D là tối tiểu, khớp kết luận khoá duy nhất."
      - show: |
          <p>Đếm cách thứ hai: siêu khoá = $AD$ cộng thêm một phần bất kỳ của $\{B, C\}$ → $2^2 = \hl{4}$ tập — khớp 4 tập máy tìm ra.</p>
        say: "Đếm cách thứ hai, vì mỗi siêu khoá phải chứa A D, nó là A D cộng thêm một phần bất kỳ của B và C, mỗi chữ có hoặc không. Vậy có 2 mũ 2 bằng 4 siêu khoá, đúng bằng số tập máy tìm ra."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp"
    checks:
      - "alg.sql('SELECT COUNT(DISTINCT ten) = COUNT(*) FROM SinhVien') == [(1,)]"
      - "len(alg.candidate_keys('ABCD', [('A', 'B'), ('B', 'C')])) == 1 and alg.attr_closure('ABD', [('A', 'B'), ('B', 'C')])[0] == set('ABCD')"
      - "alg.sql_error(\"INSERT INTO DK (mssv, ma_mon, diem) VALUES (1, 'M1', 5);\", \"CREATE TABLE DK (id INTEGER PRIMARY KEY, mssv INTEGER, ma_mon TEXT, diem REAL); INSERT INTO DK (mssv, ma_mon, diem) VALUES (1, 'M1', 8);\") is None"
      - "alg.sql(\"SELECT COUNT(*), COUNT(DISTINCT diem) FROM DK WHERE mssv = 1 AND ma_mon = 'M1'\", \"CREATE TABLE DK (id INTEGER PRIMARY KEY, mssv INTEGER, ma_mon TEXT, diem REAL); INSERT INTO DK (mssv, ma_mon, diem) VALUES (1, 'M1', 8), (1, 'M1', 5);\") == [(2, 2)]"
      - "alg.sql_error(\"INSERT INTO DK (mssv, ma_mon, diem) VALUES (1, 'M1', 5);\", \"CREATE TABLE DK (id INTEGER PRIMARY KEY, mssv INTEGER, ma_mon TEXT, diem REAL, UNIQUE (mssv, ma_mon)); INSERT INTO DK (mssv, ma_mon, diem) VALUES (1, 'M1', 8);\") == 'UNIQUE constraint failed: DK.mssv, DK.ma_mon'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Suy phụ thuộc hàm từ vài dòng mẫu <b class="red">(sai)</b>
          <br><span class="note">Bảng mẫu 4 sinh viên có tên khác nhau, nhưng $\text{ten} \to \text{mssv}$ <b>không</b> phải luật: mai có thể thêm một An nữa. Phụ thuộc hàm đến từ ngữ nghĩa dữ liệu.</span></div>
        say: "Lỗi thứ nhất, suy phụ thuộc hàm từ vài dòng mẫu. Bảng mẫu có 4 sinh viên tên khác nhau, nhưng tên xác định mã số không phải là luật, vì mai có thể thêm một bạn An nữa. Phụ thuộc hàm đến từ ngữ nghĩa của dữ liệu, không đến từ vài dòng đang có."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gọi mọi siêu khoá là khoá <b class="red">(sai)</b>
          <br><span class="note">$ABD$ cũng xác định cả $R$ (siêu khoá) nhưng không tối tiểu: bỏ $B$ vẫn đủ. Khoá phải tối tiểu.</span></div>
          <table class="t"><tr><th>tập</th><th>bao đóng = $R$?</th><th>bỏ bớt được?</th><th>là</th></tr>
          <tr><td>$AD$</td><td>có</td><td>không</td><td>khoá</td></tr><tr><td>$ABD$</td><td>có</td><td>bỏ $B$</td><td>siêu khoá, không phải khoá</td></tr></table>
        focus: [1, "2.3", 2]
        say: "Lỗi thứ hai, gọi mọi siêu khoá là khoá. A B D cũng xác định cả R nên là siêu khoá, nhưng không tối tiểu, vì bỏ B vẫn đủ. Khoá phải là tập tối tiểu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dừng thuật toán sau một lượt <b class="red">(thiếu)</b>
          <br><span class="note">Luật thêm $C$ có thể chỉ áp được sau khi luật khác đã thêm $B$. Lặp tới khi không đổi.</span></div>
        say: "Lỗi thứ ba, dừng thuật toán sau một lượt. Luật thêm C có thể chỉ áp dụng được sau khi một luật khác đã thêm B, nên phải lặp tới khi không còn gì thay đổi."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ mỗi bảng chỉ có một khoá <b class="red">(sai)</b>
          <br><span class="note">Có thể có nhiều khoá ứng viên; khoá chính là một khoá được chọn ra.</span></div>
        say: "Lỗi thứ tư, nghĩ mỗi bảng chỉ có một khoá. Một bảng có thể có nhiều khoá ứng viên, và khoá chính chỉ là một khoá được chọn ra trong số đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5.</b> Thêm cột mã tự tăng làm khoá chính, rồi bỏ quên khoá thật <b class="red">(người đã đi làm)</b>
          <br><span class="note">Bảng DK(id, mssv, ma_mon, diem), khoá chính là id. Khoá suy ra từ phụ thuộc hàm vẫn là (mssv, ma_mon) — nhưng không ai khai.</span></div>
          <table class="t"><tr><th>lược đồ</th><th>đã có (1, M1, 8); thêm (1, M1, 5)</th><th>hậu quả</th></tr>
          <tr><td>chỉ khoá chính id</td><td>nhận</td><td><b class="red">2 dòng, 2 điểm khác nhau</b> cho cùng một lượt đăng ký</td></tr>
          <tr><td>thêm <code>UNIQUE (mssv, ma_mon)</code></td><td>từ chối</td><td>giữ được luật (mssv, ma_mon) → diem</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ năm, của người đã đi làm, thêm một cột mã tự tăng làm khoá chính rồi bỏ quên khoá thật. Bảng đăng ký có khoá chính là cột mã tự tăng, còn khoá suy ra từ phụ thuộc hàm vẫn là cặp mã số và mã môn, nhưng không ai khai nó. Bảng so hai lược đồ khi đã có dòng sinh viên 1, môn M1, điểm 8, rồi thêm lần nữa với điểm 5. Nếu chỉ có khoá chính tự tăng, dòng mới được nhận, và cùng một lượt đăng ký có hai điểm khác nhau. Nếu khai thêm ràng buộc duy nhất cho cặp mã số và mã môn, dòng thứ hai bị từ chối, giữ được luật đã suy ra."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.attr_closure('AC', [('A', 'B'), ('BC', 'D'), ('D', 'E')])[0] == set('ABCDE')"
      - "alg.candidate_keys('ABCDE', [('A', 'B'), ('BC', 'D'), ('D', 'E')]) == ['AC']"
      - "alg.attr_closure('A', [('A', 'B'), ('BC', 'D'), ('D', 'E')])[0] == {'A', 'B'}"
      - "alg.attr_closure('AC', [('A', 'B'), ('BC', 'D'), ('D', 'E')])[1] == [('A', 'B', 'ABC'), ('BC', 'D', 'ABCD'), ('D', 'E', 'ABCDE')]"
      - "alg.attr_closure('C', [('A', 'B'), ('BC', 'D'), ('D', 'E')])[0] == {'C'}"
    steps:
      - show: |
          <p>$R(A, B, C, D, E)$, $F = \{A \to B,\ BC \to D,\ D \to E\}$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Tính $A^+$ và $(AC)^+$.</td></tr><tr><td>2</td><td>Tìm mọi khoá của $R$.</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với lược đồ R gồm năm thuộc tính A đến E, và ba luật, A xác định B, B C xác định D, D xác định E. Câu một, tính bao đóng của A và của A C. Câu hai, tìm mọi khoá của R. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $A^+$: $\{A\}$ → áp $A \to B$ → $\{A, B\}$; luật $BC \to D$ cần cả $C$ → chưa áp được → $A^+ = \hl{\{A, B\}}$.</p>
        say: "Đáp án câu một, phần đầu, bao đóng của A bắt đầu từ A, luật A xác định B thêm B. Luật B C xác định D cần cả B lẫn C, mà C chưa có, nên chưa áp được. Vậy bao đóng của A chỉ gồm A và B."
      - show: |
          <table class="t"><tr><th>lượt</th><th>luật áp được</th><th>$(AC)^+$</th></tr>
          <tr><td>0</td><td>—</td><td>$\{A, C\}$</td></tr><tr><td>1</td><td>$A \to B$</td><td>$\{A, B, C\}$</td></tr>
          <tr><td>2</td><td>$BC \to D$</td><td>$\{A, B, C, D\}$</td></tr><tr><td>3</td><td>$D \to E$</td><td>$\hl{\{A, B, C, D, E\}}$</td></tr></table>
        focus: [1, "1.3", "1.4", "1.5"]
        say: "Phần sau, bao đóng của A C, bắt đầu từ A và C. Luật A xác định B thêm B. Giờ đã có cả B và C, nên luật thứ hai thêm D. Luật D xác định E thêm E, được cả R."
      - clear: true
        show: |
          <p>② $A$ và $C$ không ở vế phải luật nào nên mọi khoá chứa cả hai; $(AC)^+ = R$ và $A^+ = \{A, B\}$, $C^+ = \{C\}$ đều thiếu → khoá duy nhất $\hl{AC}$.</p>
        say: "Câu hai, A và C không nằm ở vế phải luật nào, nên mọi khoá phải chứa cả hai, mà A C đã đủ. Bỏ C thì bao đóng chỉ là A, B, bỏ A thì chỉ còn C, nên A C tối tiểu. Vậy A C là khoá duy nhất."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ngữ nghĩa → phụ thuộc hàm</span><span class="a">→</span>
          <span class="n">bao đóng $X^+$ bằng lặp</span><span class="a">→</span>
          <span class="n">$X^+$ = cả bảng: siêu khoá</span><span class="a">→</span>
          <span class="n">tối tiểu: khoá</span></div>
        say: "Tổng kết lại, từ ngữ nghĩa dữ liệu ta viết ra phụ thuộc hàm. Bao đóng được tính bằng cách lặp áp các luật. Tập nào có bao đóng là cả bảng thì là siêu khoá, và siêu khoá tối tiểu là khoá."
      - show: |
          <div class="box key"><b>Tư duy:</b> luật của dữ liệu đến từ nghiệp vụ, không đến từ dữ liệu mẫu. Hỏi người hiểu nghiệp vụ trước khi viết lược đồ.</div>
        say: "Điều cần mang theo, luật của dữ liệu đến từ nghiệp vụ, không đến từ dữ liệu mẫu. Hãy hỏi người hiểu nghiệp vụ trước khi viết lược đồ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>chuẩn hoá</b> — dùng phụ thuộc hàm để tách bảng, tránh dị thường cập nhật.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học chuẩn hoá, dùng phụ thuộc hàm để tách bảng sao cho tránh được dị thường cập nhật. Hẹn gặp bạn ở bài tiếp theo."
