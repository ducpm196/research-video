# Quy ước: trang 8 KB = 8192 byte; mỗi dòng 80 byte; một phần trang dành cho đầu trang nên lấy tròn 100 dòng mỗi trang (nói rõ).
#   Giả định thời gian (ghi rõ là giả định, cùng con số OSY bài 11): đọc ngẫu nhiên một trang trên đĩa quay ≈ 8 ms; đọc tuần tự
#   ≈ 0,05 ms mỗi trang (8 KB ở khoảng 160 MB/s). SSD: đọc ngẫu nhiên ≈ 0,1 ms. Mọi phép tính kiểm bằng math trong checks.
objectives:
  - "Ước lượng số trang của một bảng"
  - "Giải thích vì sao đơn vị chi phí là số lần đọc trang"
  - "So sánh đọc tuần tự và đọc ngẫu nhiên"
