="8" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="34" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">1</text><text x="86" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">5</text><line x1="60" y1="288" x2="60" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="140" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="166" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">10</text><text x="218" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">15</text><line x1="192" y1="288" x2="192" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="273" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="299" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">20</text><text x="351" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">25</text><line x1="325" y1="288" x2="325" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="406" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="432" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">30</text><text x="484" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">35</text><line x1="458" y1="288" x2="458" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="538" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="564" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">40</text><text x="616" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">45</text><line x1="590" y1="288" x2="590" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="670" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="696" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">50</text><text x="748" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">55</text><line x1="722" y1="288" x2="722" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="803" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="829" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">60</text><text x="881" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">65</text><line x1="855" y1="288" x2="855" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="936" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="962" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">70</text><text x="1014" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">75</text><line x1="988" y1="288" x2="988" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="1068" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1094" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">80</text><text x="1146" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">85</text><line x1="1120" y1="288" x2="1120" y2="322" stroke="#6b7280" stroke-width="1.5"/><text x="1170" y="365" font-size="18" fill="#6b7280" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">lá nối với nhau (mũi tên xanh) — đi ngang để quét khoảng</text><text x="20" y="63" font-size="20" fill="#6b7280" text-anchor="start" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">gốc</text><text x="20" y="183" font-size="20" fill="#6b7280" text-anchor="start" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">nút trong</text></svg></div>
          <p>Mỗi nút là một <b>trang</b>. <b>Nút trong</b> giữ khoá phân cách, chỉ đường xuống con. <b>Lá</b> giữ các khoá theo thứ tự, kèm con trỏ tới dòng trong bảng (riêng <b>chỉ mục cụm</b>, như InnoDB của MySQL, lá chứa luôn cả dòng).</p>
          <p class="note">Mọi lá ở cùng độ sâu (cây cân bằng). Các lá nối với nhau, nên quét một khoảng chỉ cần đi ngang.</p>
        focus: [1, 2, 2, 2, 2, 3, 3]
        say: "Đây là một cây B cộng nhỏ, mỗi nút giữ tối đa hai khoá. Mỗi nút là một trang trên đĩa. Nút trong giữ các khoá phân cách, chỉ đường đi xuống con nào. Lá giữ các khoá theo thứ tự, kèm con trỏ tới dòng tương ứng trong bảng. Riêng chỉ mục cụm thì lá chứa luôn cả dòng, như hệ quản trị ghi trên màn hình. Mọi lá nằm ở cùng một độ sâu, tức cây cân bằng. Các lá còn được nối với nhau bằng mũi tên xanh, nên quét một khoảng chỉ cần đi ngang."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi tầng nhân 100: cái quạt rất rộng và rất thấp"
    checks:
      - "1 * 100 == 100 and 100 * 100 == 10000 and 10000 * 100 == 10 ** 6 and alg.bplus_height(10 ** 6, 100) == 3"
    steps:
