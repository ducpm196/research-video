="104" height="50" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="564" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">40</text><text x="616" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">45</text><line x1="590" y1="288" x2="590" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="670" y="280" width="104" height="50" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="696" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">50</text><text x="748" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">55</text><line x1="722" y1="288" x2="722" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="803" y="280" width="104" height="50" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="829" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">60</text><text x="881" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">65</text><line x1="855" y1="288" x2="855" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="936" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="962" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">70</text><text x="1014" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">75</text><line x1="988" y1="288" x2="988" y2="322" stroke="#6b7280" stroke-width="1.5"/><rect x="1068" y="280" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1094" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">80</text><text x="1146" y="313" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">85</text><line x1="1120" y1="288" x2="1120" y2="322" stroke="#6b7280" stroke-width="1.5"/><text x="1170" y="365" font-size="18" fill="#6b7280" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">lá nối với nhau (mũi tên xanh) — đi ngang để quét khoảng</text><text x="20" y="63" font-size="20" fill="#6b7280" text-anchor="start" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">gốc</text><text x="20" y="183" font-size="20" fill="#6b7280" text-anchor="start" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">nút trong</text></svg></div>
          <p><b>Bước 4</b> — khoảng 35 đến 65: tra 35 như trên, đọc gốc và nút [40 | 50]… → <b>2</b> trang tới lá [30, 35].</p>
        focus: [1, 2, 2]
        say: "Bước bốn, tra khoảng từ 35 đến 65. Trước hết làm như tra một khoá, tìm lá chứa 35. Ta đọc gốc và một nút trong, tức 2 trang, rồi tới lá chứa 30 và 35."
      - show: |
          <table class="t"><tr><th>đi ngang theo liên kết</th><th>[30, 35]</th><th>[40, 45]</th><th>[50, 55]</th><th>[60, 65]</th></tr>
          <tr><td>lá thứ</td><td>1</td><td>2</td><td>3</td><td>4</td></tr></table>
          <p><b>Bước 5</b> — tổng $2 + 4 = \hl{6}$ trang chỉ mục.</p>
        focus: [1, "1.2", 2]
        say: "Bước năm, từ lá đó đi ngang theo liên kết lá, qua bốn lá, từ lá chứa 30, 35 tới lá chứa 60, 65. Lá thứ tư đã chứa 65, là đầu mút của khoảng, nên dừng. Tổng cộng 2 cộng 4, bằng 6 trang chỉ mục."

  - id: check
    kind: check
    title: "Tự kiểm: tra mọi khoá, đếm khoá trong khoảng"
    checks:
      - "(lambda ks: len(ks) == 18 and all(k in alg.BPT_LEAVES[alg.bpt_search(k)[1]] and alg.bpt_search(k)[2] == 3 for k in ks))([x for l in alg.BPT_LEAVES for x in l])"
      - "(lambda ks: ks == [35, 40, 45, 50, 55, 60, 65] and len({i for i, l in enumerate(alg.BPT_LEAVES) for x in l if x in ks}) == 4)([x for l in alg.BPT_LEAVES for x in l if 35 <= x <= 65])"
      - "10000 / 3 > 3000"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>cho máy tra cả 18 khoá của cây mẫu</td><td>18 trên 18 khoá tới đúng lá chứa nó, mỗi lần 3 trang</td></tr>
          <tr><td>liệt kê thẳng các khoá từ 35 tới 65</td><td>35, 40, 45, 50, 55, 60, 65: 7 khoá nằm ở 4 lá</td></tr>
          <tr><td>so với quét bài 7</td><td>$10\,000 / 3 \gt 3000$ lần ít hơn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta cho máy tra lần lượt cả 18 khoá của cây mẫu, vì một khoá 45 chưa đủ để tin cả cây. Cả 18 khoá đều tới đúng lá chứa nó, và lần nào cũng đọc đúng 3 trang. Liệt kê thẳng các khoá từ 35 tới 65 được 7 khoá, nằm gọn trong 4 lá, khớp với 4 lá đi ngang ở bước năm. Còn so với quét mười nghìn trang ở bài 7, 3 trang ít hơn hơn ba nghìn lần."

  # ───────────────────────── 4. ĐỘ CAO ─────────────────────────
  - id: height
    kind: concept
    title: "Vì sao cây B+ thấp"
    checks:
      - "alg.bplus_height(10 ** 6, 100) == 3 and 100 ** 2 < 10 ** 6 <= 100 ** 3"
      - "alg.bplus_height(10 ** 6, 2) == 20"
      - "8192 // 16 == 512"
    steps:
      - show: |
          <p>Một trang 8 KB chứa hàng trăm cặp (khoá, con trỏ): mỗi cặp khoảng 16 byte → tới 512. Lấy tròn <b>bậc rẽ nhánh 100</b> (nút không luôn đầy).</p>
          <table class="t"><tr><th>tầng</th><th>1 (gốc)</th><th>2</th><th>3 (lá)</th></tr>
          <tr><td>số khoá với tới</td><td>100</td><td>10 000</td><td>1 000 000</td></tr></table>
          <div class="box key">$10^6$ khoá chỉ cần $\hl{3}$ tầng: số tầng $h$ nhỏ nhất có $100^h \ge 10^6$, tức $h = \log_{100} 10^6 = 3$. So với quét 10 000 trang: ít hơn hơn ba nghìn lần.</div>
          <p class="note">Cây nhị phân (bậc 2) cần 20 tầng cho cùng số khoá — đó là lý do cơ sở dữ liệu không dùng cây nhị phân trên đĩa.</p>
        focus: [1, 1, 2, "2.2", 3, 3, 4]
        say: "Vì sao cây B cộng thấp? Một trang 8 ki-lô-byte chứa được hàng trăm cặp khoá và con trỏ, mỗi cặp khoảng 16 byte nên tới 512 cặp. Lấy tròn bậc rẽ nhánh là 100, vì nút không phải lúc nào cũng đầy. Gốc trỏ tới 100 nút, tầng hai trỏ tới mười nghìn, và tầng ba, tầng lá, đã chứa được một triệu khoá. Vậy một triệu khoá chỉ cần 3 tầng, tức lô-ga-rít cơ số 100 của một triệu, bằng 3. So với quét mười nghìn trang, số lần đọc ít hơn hơn ba nghìn lần. Một cây nhị phân cần tới 20 tầng cho cùng số khoá, nên cơ sở dữ liệu không dùng cây nhị phân trên đĩa."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.bplus_height(10 ** 6, 100) + 1 == 4"
      - "1 + 1 * alg.bplus_height(10 ** 6, 100) == 4 and 1 + 5 * alg.bplus_height(10 ** 6, 100) == 16 and 5 * 3 == 15"
      - "round(0.3 * 10 ** 6) == 300000 and round(300000 * 8e-3) == 2400 and round(10000 * 0.05e-3, 2) == 0.5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đánh chỉ mục mọi cột <b class="red">(sai)</b>
          <br><span class="note">Mỗi lần thêm, sửa, xoá dòng, mọi chỉ mục đều phải cập nhật, có khi phải tách nút. Chỉ mục tăng tốc đọc nhưng làm chậm ghi và tốn chỗ.</span></div>
          <table class="t"><tr><th>ước lượng: thêm 1 dòng</th><th>trang bảng</th><th>mỗi chỉ mục (3 tầng)</th><th>tổng trang chạm tới</th></tr>
          <tr><td>không chỉ mục</td><td>1</td><td>0</td><td>1</td></tr>
          <tr><td>1 chỉ mục</td><td>1</td><td>3</td><td>$1 + 3 = 4$</td></tr>
          <tr><td>5 chỉ mục</td><td>1</td><td>$5 \cdot 3$</td><td>$1 + 15 = \hl{16}$</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, 1, 2, "2.4"]
        say: "Lỗi thứ nhất, đánh chỉ mục cho mọi cột. Mỗi lần thêm, sửa hay xoá một dòng, mọi chỉ mục đều phải cập nhật, có khi phải tách nút. Chỉ mục tăng tốc đọc nhưng làm chậm ghi và tốn chỗ. Người đã đi làm hay thêm chỉ mục cho từng truy vấn chậm mà quên phía ghi, như bảng ước lượng chỉ ra. Không có chỉ mục, thêm một dòng chạm 1 trang, có 5 chỉ mục ba tầng thì chạm tới 1 cộng 15 bằng 16 trang."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên chi phí lấy dòng <b class="red">(thiếu)</b>
          <br><span class="note">Chỉ mục cho vị trí; mỗi dòng khớp còn 1 lần đọc ngẫu nhiên vào bảng. Khoảng trả về 30% bảng thì quét tuần tự cả bảng có thể nhanh hơn (bài 7).</span></div>
          <table class="t"><tr><th>lấy 30% của $10^6$ dòng</th><th>số lần đọc</th><th>thời gian (giả định bài 7)</th></tr>
          <tr><td>qua chỉ mục, mỗi dòng một lần đọc ngẫu nhiên</td><td>300 000</td><td>$300\,000 \cdot 8$ ms = 2400 giây</td></tr>
          <tr><td>quét tuần tự cả bảng</td><td>10 000</td><td>$10\,000 \cdot 0{,}05$ ms = 0,5 giây</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ hai, quên chi phí lấy dòng. Chỉ mục chỉ cho vị trí, mỗi dòng khớp còn tốn một lần đọc ngẫu nhiên vào bảng. Khi một khoảng trả về khoảng 30 phần trăm bảng, quét tuần tự cả bảng như bài 7 có thể còn nhanh hơn. Lấy 30 phần trăm của một triệu dòng qua chỉ mục là ba trăm nghìn lần đọc ngẫu nhiên, theo giả định 8 mi li giây mỗi lần thì mất 2400 giây. Quét tuần tự mười nghìn trang chỉ mất nửa giây."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ cây B+ là cây nhị phân <b class="red">(sai)</b>
          <br><span class="note">Mỗi nút có hàng trăm con, nên cây chỉ cao 3–4 tầng.</span></div>
        say: "Lỗi thứ ba, nghĩ cây B cộng là cây nhị phân. Mỗi nút có hàng trăm con, nên cây chỉ cao 3 hay 4 tầng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đánh chỉ mục cột ít giá trị khác nhau <b class="red">(ít lợi)</b>
          <br><span class="note">Cột giới tính chỉ 2 giá trị: mỗi giá trị khớp nửa bảng, chỉ mục gần như vô dụng.</span></div>
        say: "Lỗi thứ tư, đánh chỉ mục cho cột có ít giá trị khác nhau. Cột giới tính chỉ có hai giá trị, mỗi giá trị khớp khoảng nửa bảng, nên chỉ mục gần như vô dụng."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.bplus_height(10 ** 6, 200) == 3 and alg.bplus_height(10 ** 8, 100) == 4"
      - "alg.bpt_range(15, 42) == ([1, 2, 3, 4], 6)"
      - "200 ** 2 == 40000 < 10 ** 6 <= 200 ** 3 == 8 * 10 ** 6 and 100 ** 3 < 10 ** 8 <= 100 ** 4 and alg.bpt_search(15)[:2] == (0, 1) and alg.BPT_LEAVES[5][0] == 50"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bậc rẽ nhánh 200, $10^6$ khoá: cây cao mấy tầng? Còn bậc 100 với $10^8$ khoá?</td></tr>
          <tr><td>2</td><td>Trên cây mẫu, tra khoảng 15 đến 42 đọc bao nhiêu trang chỉ mục?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bậc rẽ nhánh 200 với một triệu khoá thì cây cao mấy tầng? Còn bậc 100 với một trăm triệu khoá thì sao? Câu hai, trên cây mẫu, tra khoảng từ 15 đến 42 đọc bao nhiêu trang chỉ mục? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>$h$</th><th>$200^h$</th><th>đủ $10^6$?</th><th>$100^h$</th><th>đủ $10^8$?</th></tr>
          <tr><td>2</td><td>40 000</td><td>chưa</td><td>$10^4$</td><td>chưa</td></tr>
          <tr><td>3</td><td>8 000 000</td><td>đủ → $\hl{3}$ tầng</td><td>$10^6$</td><td>chưa</td></tr>
          <tr><td>4</td><td></td><td></td><td>$10^8$</td><td>vừa đủ → $\hl{4}$ tầng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, lập bảng lũy thừa rồi tìm số tầng nhỏ nhất đủ chứa. 200 bình phương là bốn mươi nghìn, chưa tới một triệu. 200 lập phương là tám triệu, đã vượt, nên cây cao 3 tầng. Với bậc 100 và một trăm triệu khoá, 100 mũ 3 mới một triệu, còn 100 mũ 4 vừa đủ, nên cây cao 4 tầng."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>trang đọc</th></tr>
          <tr><td>gốc: $15 \lt 30$ → con trái; nút [10 | 20]: $10 \le 15 \lt 20$ → lá [10, 15]</td><td>2</td></tr>
          <tr><td>đi ngang [10, 15], [20, 25], [30, 35], [40, 45]; lá sau bắt đầu bằng 50, quá 42</td><td>4</td></tr>
          <tr><td>tổng</td><td>$2 + 4 = \hl{6}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, trước hết tìm lá chứa 15. Ở gốc, 15 nhỏ hơn 30 nên đi con trái, ở nút 10 và 20, 15 nằm giữa nên xuống lá chứa 10 và 15, mất 2 trang. Rồi đi ngang qua 4 lá tới lá chứa 40 và 45, vì lá kế tiếp bắt đầu bằng 50, đã quá 42. Tổng cộng 2 cộng 4 bằng 6 trang."

