id: L08
course: DBS
series: "DBS · Cơ sở dữ liệu"
title: "Bài 8 — Chỉ mục cây B+"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dbs.yaml L08; audit/dbs/verify_dbs.py L08; R. Bayer, E. McCreight (1972), D. Comer (1979); R. Ramakrishnan, J. Gehrke, Database Management Systems (2003), chương 10"
assumes: [arith, cdot, sub, frac, approx, power, ltgt, geq, log]
# Quy ước: mỗi nút của cây là một trang. Nút trong giữ khoá phân cách và con trỏ con; lá giữ khoá và con trỏ tới dòng, các lá nối
#   thành chuỗi từ trái sang phải. Cây mẫu bậc 3 (alg.BPT_*): đi xuống con thứ (số khoá phân cách ≤ k). Độ cao (số tầng) với bậc
#   rẽ nhánh f và n khoá: số h nhỏ nhất có f^h ≥ n (alg.bplus_height). Số lần đọc trang do alg.bpt_search / alg.bpt_range tính.
objectives:
  - "Giải thích vì sao cây B+ thấp"
  - "Ước lượng số lần đọc trang khi tra một khoá và khi tra một khoảng"
  - "Biết cái giá của chỉ mục khi ghi"
asr_reviewed:
  - {sentence: "Một trang 8 ki-lô-byte chứa được hàng trăm cặp khoá và con trỏ, mỗi cặp khoảng 16 byte nên tới 512 cặp.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ 10 000 lần đọc xuống 3"
    steps:
      - show: |
          <p>Bài 7: tìm một sinh viên trong bảng 1 triệu dòng phải quét tới 10 000 trang.</p>
          <p>Từ điển giấy không bắt bạn đọc từng trang: nhìn chữ cái ở mép, mở thẳng tới gần đúng chỗ.</p>
          <div class="box key">Hôm nay: <b>chỉ mục cây B+</b> — tìm một dòng trong một triệu chỉ với khoảng 3 lần đọc trang.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, ở bài 7, tìm một sinh viên trong bảng một triệu dòng phải quét tới mười nghìn trang. Nhưng từ điển giấy đâu bắt bạn đọc từng trang, bạn nhìn chữ cái ở mép rồi mở thẳng tới gần đúng chỗ. Hôm nay ta học chỉ mục cây B cộng, tìm một dòng trong một triệu dòng chỉ với khoảng 3 lần đọc trang."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cây tìm kiếm, lũy thừa và lô-ga-rít"
    checks:
      - "(lambda path: path == [40, 60, 50])((lambda f: f(f, (40, (20, (10,), (30,)), (60, (50,), (70,))), 50, []))(lambda f, n, k, p: p + [n[0]] if n[0] == k else f(f, n[1] if k < n[0] else n[2], k, p + [n[0]])))"
      - "100 ** 1 == 100 and 100 ** 2 == 10 ** 4 and 100 ** 3 == 10 ** 6 and round(math.log(10 ** 6, 100)) == 3"
      - "2 ** 19 == 524288 and 2 ** 19 < 10 ** 6 <= 2 ** 20 == 1048576"
      - "math.ceil(10 ** 6 / 100) == 10000"
    steps:
      - show: |
          <p>Ở khoá Phân tích và thiết kế thuật toán: <b>cây tìm kiếm nhị phân</b> — nhỏ hơn đi trái, lớn hơn đi phải. Tìm 50 trong cây 10, 20, …, 70:</p>
          <table class="t"><tr><th>tầng</th><th>đang ở</th><th>so 50</th><th>đi</th></tr>
          <tr><td>1</td><td>40</td><td>$50 \gt 40$</td><td>phải</td></tr>
          <tr><td>2</td><td>60</td><td>$50 \lt 60$</td><td>trái</td></tr>
          <tr><td>3</td><td>50</td><td>bằng</td><td>gặp</td></tr></table>
        introduces: [dots]
        focus: [1, "2.2", "2.3", "2.4", 2]
        say: "Trước hết, ôn lại cây tìm kiếm nhị phân ở khoá Phân tích và thiết kế thuật toán, khoá nhỏ hơn thì đi trái, lớn hơn thì đi phải. Tìm 50 trong cây bảy khoá từ 10 tới 70, ở gốc 40, vì 50 lớn hơn 40 nên đi phải. Tới 60, vì 50 nhỏ hơn 60 nên đi trái. Tới 50, bằng nhau, gặp. Mỗi tầng tốn một lần so sánh, nên số tầng quyết định chi phí."
      - clear: true
        show: |
          <table class="t"><tr><th>$h$</th><th>$100^h$</th><th>$2^h$</th></tr>
          <tr><td>1</td><td>100</td><td>2</td></tr>
          <tr><td>2</td><td>$10^4$</td><td>4</td></tr>
          <tr><td>3</td><td>$\hl{10^6}$</td><td>8</td></tr>
          <tr><td>19, 20</td><td></td><td>$524\,288 \lt 10^6 \le \hl{1\,048\,576}$</td></tr></table>
          <p>$\log_{100} 10^6 = 3$: số lần nhân 100 để đạt một triệu.</p>
        focus: [1, "1.4", "1.5", 2]
        say: "Thứ hai, ta ôn lại phép lũy thừa và phép lô-ga-rít. Nhân 100 ba lần, 100 mũ 3, đã được một triệu. Còn nhân 2 thì tới 2 mũ 20, khoảng một triệu không trăm bốn mươi tám nghìn, mới vượt một triệu. Lô-ga-rít cơ số 100 của một triệu bằng 3, nghĩa là số lần nhân 100 để đạt một triệu."
      - clear: true
        show: |
          <table class="t"><tr><th>bài 7 nhắc lại</th><th>số</th></tr>
          <tr><td>$10^6$ dòng, 100 dòng mỗi trang</td><td>10 000 trang</td></tr>
          <tr><td>tìm khi chưa có chỉ mục</td><td>tới 10 000 lần đọc trang</td></tr>
          <tr><td>chi phí tính bằng</td><td>số lần đọc trang</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Thứ ba, nhắc lại bài 7, chi phí truy vấn được đo bằng số lần đọc trang. Một triệu dòng, 100 dòng mỗi trang, là mười nghìn trang. Khi chưa có chỉ mục, tìm một dòng có thể phải đọc tới mười nghìn trang. Hôm nay ta muốn đưa con số đó xuống chỉ còn vài trang."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: nút trong, lá, liên kết lá"
    checks:
      - "all(len(k) == 2 for k in [alg.BPT_ROOT] + alg.BPT_INNER + alg.BPT_LEAVES) and len(alg.BPT_LEAVES) == 9"
      - "sorted(x for l in alg.BPT_LEAVES for x in l) == [x for l in alg.BPT_LEAVES for x in l]"
