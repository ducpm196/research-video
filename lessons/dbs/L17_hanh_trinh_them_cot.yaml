scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thêm một cột khi bảng đã có 5 triệu dòng"
    checks:
      - "10**8 / (365 * 24 * 3600) > 3"
    steps:
      - show: |
          <p>Bảng người dùng đã có <b>5 000 000 dòng</b> (số minh hoạ). Bạn cần <b>thêm một cột</b>.</p>
          <p>Năm 2016, đội cơ sở dữ liệu của GitHub viết: với cách làm mặc định của MySQL, thêm hay bỏ cột là thao tác <b>chặn</b> — mà họ đổi lược đồ <b>nhiều lần mỗi ngày</b>.</p>
          <p>Năm 2017, Stripe chuyển <b>hàng trăm triệu</b> đối tượng: nếu mỗi đối tượng mất 1 giây và làm tuần tự, 100 triệu đối tượng mất <b>hơn 3 năm</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 2009 tới 2022 — thêm cột sao cho nhanh, không dừng dịch vụ, không hỏng dữ liệu cũ.</div>
        focus: [1, 2, 2, 3, 4]
        say: "Chào bạn, giả sử bảng người dùng của bạn đã có 5 triệu dòng, một số minh hoạ, và bạn cần thêm một cột. Năm 2016, đội cơ sở dữ liệu của một nền tảng lưu trữ mã nguồn lớn viết rằng với cách làm mặc định của MySQL, thêm hay bỏ cột là thao tác chặn. Trong khi đó, họ phải đổi lược đồ nhiều lần mỗi ngày. Năm 2017, Stripe cần chuyển hàng trăm triệu đối tượng, và nếu mỗi đối tượng mất 1 giây, làm tuần tự 100 triệu cái sẽ mất hơn 3 năm. Hôm nay ta đi qua năm chặng từ 2009 tới 2022, để biết cách thêm cột nhanh, không dừng dịch vụ, và không hỏng dữ liệu cũ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "1000000 // 100 == 10000 and 5000000 // 100 == 50000"
      - "100 + 10 - 5 == 105"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 7</td><td>bảng nằm trên các <b>trang</b> đĩa; chi phí đo bằng số trang đọc, ghi</td><td>1 000 000 dòng, 100 dòng mỗi trang → 10 000 trang; 5 000 000 dòng → 50 000 trang</td></tr>
          <tr><td>bài 11</td><td><b>giao dịch</b>: hoặc mọi thao tác cùng thành công, hoặc không có gì xảy ra</td><td>cộng B xong mà trừ A thất bại → huỷ cả hai</td></tr>
          <tr><td>bài 13</td><td><b>khoá</b>: giao dịch giữ khoá một dòng thì giao dịch khác muốn ghi dòng đó phải chờ</td><td>T1 giữ khoá dòng An, T2 chờ tới khi T1 xong</td></tr>
          <tr><td>bài 14</td><td><b>nhật ký</b>: mọi thay đổi được ghi thành một dãy bản ghi theo thứ tự; làm lại theo dãy đó thì dựng lại được dữ liệu</td><td>100, rồi “cộng 10”, “trừ 5” → 105</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 7, bảng nằm trên các trang đĩa, nên một triệu dòng với 100 dòng mỗi trang chiếm 10 nghìn trang. Theo cùng cách tính, 5 triệu dòng chiếm 50 nghìn trang. Ở bài 11, giao dịch là hoặc mọi thao tác cùng thành công, hoặc không có gì xảy ra, nên cộng B xong mà trừ A thất bại thì huỷ cả hai. Ở bài 13, giao dịch giữ khoá một dòng thì giao dịch khác muốn ghi dòng đó phải chờ. Ở bài 14, mọi thay đổi được ghi thành một dãy bản ghi theo thứ tự, ví dụ 100 rồi cộng 10, trừ 5, làm lại theo dãy ta được 105."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>đổi lược đồ</b></td><td>thêm, bỏ, sửa cột hay chỉ mục của một bảng đang có dữ liệu</td></tr>
          <tr><td><b>bảng bóng</b></td><td>bản sao rỗng của bảng, đã mang lược đồ mới</td></tr>
          <tr><td><b>chép bù</b></td><td>chép các dòng cũ sang bảng mới, từng lô một</td></tr>
          <tr><td><b>bộ kích hoạt</b> (trigger)</td><td>đoạn lệnh hệ quản trị tự chạy mỗi khi một dòng được thêm, sửa, xoá</td></tr>
          <tr><td><b>đổi bảng</b></td><td>bước cuối: bảng bóng thay chỗ bảng cũ</td></tr>
          <tr><td><b>điều tiết</b></td><td>chậm lại hoặc dừng hẳn khi máy chủ đang tải cao</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Đổi lược đồ là thêm, bỏ, sửa cột hay chỉ mục của một bảng đang có dữ liệu. Bảng bóng là bản sao rỗng của bảng, đã mang lược đồ mới. Chép bù là chép các dòng cũ sang bảng mới, từng lô một. Bộ kích hoạt là đoạn lệnh hệ quản trị tự chạy mỗi khi một dòng được thêm, sửa hay xoá. Đổi bảng là bước cuối, khi bảng bóng thay chỗ bảng cũ. Điều tiết là chậm lại hoặc dừng hẳn khi máy chủ đang tải cao."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2009 → 2011</text><text x="160" y="200">bảng bóng</text><text x="160" y="232">+ bộ kích hoạt</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2016</text><text x="500" y="200">đọc nhật ký nhị phân</text><text x="500" y="232">dừng được bất cứ lúc nào</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2017</text><text x="850" y="200">ghi kép bốn bước</text><text x="850" y="232">hàng trăm triệu đối tượng</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2018</text><text x="1200" y="200">thêm cột tức thì</text><text x="1200" y="232">chỉ sửa siêu dữ liệu</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2022</text><text x="1540" y="200">thêm ở mọi vị trí</text><text x="1540" y="232">tối đa 64 phiên bản dòng</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Từ 2009 tới 2011, công cụ chép sang bảng bóng nhờ bộ kích hoạt. Năm 2016 có cách đọc nhật ký nhị phân, dừng được bất cứ lúc nào, rồi năm 2017 là ghi kép bốn bước cho hàng trăm triệu đối tượng. Năm 2018, hệ quản trị tự thêm cột tức thì, và năm 2022 thêm được ở mọi vị trí, với giới hạn 64 phiên bản dòng."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: ghost
    kind: concept
    title: "Cơ chế chung: bảng bóng, chép bù, rồi đổi bảng"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="110" width="250" height="90" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="165" y="150">ứng dụng</text><text x="165" y="182">thêm, sửa, xoá</text>
          <rect x="520" y="110" width="300" height="90" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="670" y="150">bảng cũ</text><text x="670" y="182">5 000 000 dòng</text>
          <rect x="1110" y="110" width="330" height="90" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1275" y="150">bảng bóng</text><text x="1275" y="182">đã có cột mới</text>
          </g>
          <line x1="290" y1="155" x2="515" y2="155" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="820" y1="130" x2="1105" y2="130" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="820" y1="180" x2="1105" y2="180" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
          <g font-size="22" text-anchor="middle">
          <text x="965" y="108" fill="#2a78d6">① chép bù từng lô</text>
          <text x="965" y="222" fill="#eb6834">② thay đổi mới chép theo</text>
          <text x="1275" y="262" fill="#059669">③ đồng bộ rồi: đổi bảng</text>
          <text x="400" y="135" fill="#1f2937">ghi bình thường</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế chung của mọi chặng đầu. Ứng dụng vẫn ghi bình thường vào bảng cũ, trong khi ta chép bù các dòng cũ sang bảng bóng từng lô một. Mọi thay đổi mới trên bảng cũ cũng phải được chép theo, nếu không bảng bóng sẽ thiếu dữ liệu. Khi hai bảng đã đồng bộ, bảng bóng thay chỗ bảng cũ, và cột mới có mặt mà dịch vụ không phải dừng."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, 2009 tới 2011 — khai sinh: bảng bóng và bộ kích hoạt"
    stage: {year: "2009 → 2011", scale: "câu lệnh đổi bảng mặc định chặn ghi; công cụ trực tuyến có từ 2009, bộ công cụ mã nguồn mở từ 6/2011", source: "[GH16] [PT11] [MY18]", practice: "chép sang bản sao theo lô nhỏ có thời gian cố định, bộ kích hoạt chép thay đổi mới, đổi tên nguyên tử, tạm dừng khi bản sao trễ hay tải cao"}
    checks:
      - "5000000 // 1000 == 5000 and 5000 * 0.5 == 2500 and divmod(2500, 60) == (41, 40)"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> câu lệnh đổi bảng mặc định của MySQL là thao tác <b>chặn</b>; trước bản 5.6, cách duy nhất là <b>chép từng dòng</b> sang bảng mới.</p>
          <p><b>Cách xử lý</b> (công cụ từ 2009; năm 2011 nằm trong bộ công cụ của Percona): tạo bản sao rỗng, đổi lược đồ trên bản sao, chép dòng sang theo <b>lô nhỏ</b>. <b>Bộ kích hoạt</b> trên bảng cũ chép mọi thay đổi mới sang bản sao.</p>
          <p>Chép xong, hai bảng được <b>đổi tên cùng lúc</b> trong một thao tác nguyên tử.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng một, câu lệnh đổi bảng mặc định của MySQL là thao tác chặn. Trước bản 5 chấm 6, cách duy nhất là chép từng dòng sang bảng mới. Từ năm 2009 đã có công cụ làm khác, và năm 2011 một công cụ như vậy nằm trong một bộ công cụ mã nguồn mở. Nó tạo bản sao rỗng, đổi lược đồ trên bản sao, rồi chép dòng sang theo lô nhỏ, còn bộ kích hoạt chép mọi thay đổi mới. Chép xong, hai bảng được đổi tên cùng lúc trong một thao tác nguyên tử."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>mặc định của công cụ</td><td>lô đầu 1000 dòng; chỉnh cỡ lô sao cho mỗi lô chạy 0,5 giây</td><td>giả sử tốc độ không đổi: 1000 dòng mỗi 0,5 giây</td></tr>
          <tr><td>Bước 1. số lô</td><td>5 000 000 chia 1000</td><td>$\hlb{5000}$ lô</td></tr>
          <tr><td>Bước 2. thời gian chép</td><td>5000 lô nhân 0,5 giây</td><td>$\hlg{2500}$ giây = 41 phút 40 giây</td></tr></table>
          <p class="note">Thực hành: lô nhỏ, mỗi lô một khoảng thời gian cố định; tạm dừng chép khi bản sao trễ hoặc máy chủ tải cao. Điều kiện: bảng có khoá chính hoặc chỉ mục duy nhất, chưa có bộ kích hoạt nào.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử với bảng 5 triệu dòng. Công cụ mặc định bắt đầu với lô 1000 dòng, rồi chỉnh cỡ lô sao cho mỗi lô chạy nửa giây, và ta giả sử tốc độ không đổi. Bước một, 5 triệu chia 1000 được 5 nghìn lô. Bước hai, 5 nghìn lô nhân nửa giây được 2500 giây, tức 41 phút 40 giây. Thực hành rút ra là lô nhỏ có thời gian cố định, và tạm dừng chép khi bản sao trễ hay máy chủ tải cao. Điều kiện là bảng có khoá chính hoặc chỉ mục duy nhất, và chưa có bộ kích hoạt nào."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2016 — tăng trưởng: bỏ bộ kích hoạt, đọc nhật ký"
    stage: {year: "2016", scale: "đổi lược đồ nhiều lần mỗi ngày; bảng từ rỗng tới nhiều trăm GB", source: "[GH16]", practice: "không dùng bộ kích hoạt, đọc nhật ký nhị phân, một kết nối ghi tuần tự, dừng hẳn khi điều tiết, hoãn bước đổi bảng, thử trên bản sao và so tổng kiểm"}
    checks:
      - "len(range(8, 18)) == 10 and 24 - 10 == 14 and 28 / 14 == 2"
    steps:
