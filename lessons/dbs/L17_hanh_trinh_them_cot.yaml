# Quy ước: “bảng bóng” = bản sao rỗng của bảng, đã mang lược đồ mới (ghost table); “chép bù” = chép các dòng cũ sang (backfill);
#   “bộ kích hoạt” = trigger; “đổi bảng” = bước thay bảng cũ bằng bảng bóng (cut-over); “thao tác tức thì” = ALGORITHM=INSTANT.
#   Mọi sự kiện và con số có nguồn ghi trong audit/dbs/sources_L17.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   bảng 5 triệu dòng, 1000 dòng trong 0,5 giây mỗi lô (giá trị mặc định của [PT11], dùng như giả định tốc độ cố định), 28 giờ chép,
#   1000 tiến trình, 200 GB, 2 thay đổi mỗi tháng đều là SỐ MINH HOẠ.
#   Lời đọc không nói “trigger”, “binlog”, “ALTER”, “INSTANT”, “Percona”, “Hadoop”: nói “bộ kích hoạt”, “nhật ký nhị phân”, “câu lệnh đổi
#   bảng”, “thao tác tức thì”, “bộ công cụ mã nguồn mở năm 2011”, “bản chụp, xử lý ngoại tuyến”. Tên sản phẩm: lexicon_vi.DBS.yaml (probe p2).
objectives:
  - "Kể lại hành trình đổi lược đồ ở quy mô lớn qua năm chặng từ 2009 tới 2022, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại thời gian chép bù theo lô, số lô, thời gian khi bị điều tiết và số lần thêm cột tức thì còn lại"
  - "Chọn cách thêm cột hợp với quy mô của chính mình, kèm điều kiện đổi lựa chọn"
