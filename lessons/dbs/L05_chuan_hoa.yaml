id: L05
course: DBS
series: "DBS · Cơ sở dữ liệu"
title: "Bài 5 — Chuẩn hoá: dị thường cập nhật, 3NF, BCNF và tách không mất thông tin"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dbs.yaml L05; audit/dbs/verify_dbs.py L05; E. F. Codd (1972), R. F. Boyce, E. F. Codd (1974); A. Silberschatz, H. F. Korth, S. Sudarshan, Database System Concepts (2019), mục 7.3–7.5"
assumes: [arith, set, sub, cap, subseteq, in, fd, closure, join, proj, implies, iff]
# Quy ước: thuộc tính chữ hoa đơn; tập thuộc tính viết liền. Ví dụ cụ thể: SV_Lop(mssv, ten, ma_lop, ten_lop) với
#   mssv → ten, ma_lop và ma_lop → ten_lop. Tách hai phần R1, R2: không mất thông tin ⟺ (R1 ∩ R2)⁺ chứa R1 hoặc R2.
#   Mọi bảng nối do alg.project / alg.natural_join tính trên đúng các dòng hiện trên màn hình; khoá, vi phạm BCNF do
#   alg.candidate_keys / alg.bcnf_violations / alg.lossless_binary.
objectives:
  - "Nhận ra dị thường chèn, sửa, xoá"
  - "Kiểm BCNF và tách theo phụ thuộc vi phạm"
  - "Kiểm một phép tách có mất thông tin không"
asr_reviewed:
  - {sentence: "Bên trái, bảng to chép tên lớp Khoa học máy tính ở 2 dòng, ô tô cam, nên đổi tên lớp phải sửa 2 chỗ.", reason: "ASR chép “Bên trái, bảng to chép tên lớp khoa học máy tính ở hai vòng, auto cam, nên đổi tên lớp phải sửa hai chỗ.” (0.898): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: dòng tô (trong “dòng ô tô” → “vòng auto”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khoá là mã số.", reason: "ASR chép “Khoá là mả số?”: mã/mả (thanh ngã/hỏi, ASR lẫn thường xuyên); câu 4 từ khớp 0,75 > 0,7 nên không viết lại — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ta được bảng sinh viên gồm mã số, tên, mã lớp, và bảng lớp gồm mã lớp, tên lớp, đúng hai bảng của bài 0.", reason: "ASR chép “bán sinh viên gồm mả số … đúng 2 bản của bài không”: bảng/bán/bản, mã/mả là cặp thanh và âm cuối ng/n ASR lẫn trong mọi bài DBS; “bài 0” → “bài không” đúng âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ nhất, tách bảng theo cột tuỳ ý.", reason: "ASR chép “tách bản theo cục tùy ý”: bảng/bản (ng/n), cột/cục (vần ôt/uc); “tách … theo … tuỳ ý” đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách sửa là tách theo phụ thuộc vi phạm, một bảng giữ mã lớp với tên lớp, bảng kia giữ phần còn lại.", reason: "ASR chép “Các sửa … một bản giữ mà lớp … bản kỳ giữ phần còn lại”: cách/các (âm cuối ch/c), bảng/bản, mã/mà, kia/kỳ — nhầm thanh và âm cuối của ASR; câu đủ nghĩa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mọi bảng đạt BCNF đều đạt dạng chuẩn ba.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Cả hai đều đạt BCNF.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một bảng to, ba rắc rối"
    steps:
      - show: |
          <table class="t"><tr><th>mssv</th><th>ten</th><th>ma_lop</th><th>ten_lop</th></tr>
          <tr><td>1</td><td>An</td><td>K1</td><td>Khoa học máy tính</td></tr><tr><td>2</td><td>Bình</td><td>K1</td><td>Khoa học máy tính</td></tr>
          <tr><td>3</td><td>Chi</td><td>K2</td><td>Kỹ thuật phần mềm</td></tr></table>
          <ul><li><b>Sửa</b>: đổi tên lớp K1 phải sửa nhiều dòng; sót một dòng là dữ liệu tự mâu thuẫn.</li>
          <li><b>Chèn</b>: mở lớp K3 chưa có sinh viên thì không có dòng nào để ghi tên lớp.</li>
          <li><b>Xoá</b>: xoá Chi, sinh viên cuối của K2, là mất luôn tên lớp K2.</li></ul>
          <div class="box key">Hôm nay: <b>chuẩn hoá</b> — tách bảng để loại các rắc rối này mà không mất thông tin.</div>
        focus: [1, "2.1", "2.2", "2.3", 3]
        say: "Chào bạn, gộp sinh viên và lớp vào một bảng to trông tiện, nhưng có ba rắc rối. Một, dị thường sửa, đổi tên lớp K1 phải sửa nhiều dòng, sót một dòng là dữ liệu tự mâu thuẫn. Hai, dị thường chèn, mở lớp K3 chưa có sinh viên thì không có dòng nào để ghi tên lớp. Ba, dị thường xoá, xoá Chi, sinh viên cuối cùng của K2, là mất luôn tên lớp K2. Hôm nay ta học chuẩn hoá, cách tách bảng để loại bỏ những rắc rối này mà không mất thông tin."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bao đóng, phép chiếu, phép nối"
    checks:
      - "alg.attr_closure('A', [('A', 'B'), ('B', 'C')])[0] == {'A', 'B', 'C'} and alg.attr_closure('AD', [('A', 'B'), ('B', 'C')])[0] == set('ABCD')"
      - "alg.project([(1, 'K1', 'M1'), (1, 'K1', 'M2'), (2, 'K2', 'M1')], ['mssv', 'lop'], ['mssv', 'lop', 'mon']) == [(1, 'K1'), (2, 'K2')]"
      - "alg.natural_join([(1, 'K1'), (2, 'K2')], ['mssv', 'lop'], [('K1', 'Khoa học máy tính')], ['lop', 'ten_lop']) == ([(1, 'K1', 'Khoa học máy tính')], ['mssv', 'lop', 'ten_lop'])"
    steps:
      - show: |
          <p>$R(A, B, C, D)$, $F = \{A \to B, B \to C\}$. Tính $A^+$:</p>
          <table class="t"><tr><th>đang có</th><th>dùng luật</th><th>thêm</th></tr>
          <tr><td>$\{A\}$</td><td>$A \to B$</td><td>$B$</td></tr>
          <tr><td>$\{A, B\}$</td><td>$B \to C$</td><td>$C$</td></tr>
          <tr><td>$\{A, B, C\}$</td><td>hết luật dùng được</td><td>dừng</td></tr></table>
          <p>$A^+$ thiếu $D$ → $A$ không phải siêu khoá (siêu khoá: tập có bao đóng là cả $R$); $(AD)^+ = \{A, B, C, D\}$ → $AD$ là siêu khoá.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3, 3]
        say: "Trước hết, ôn lại bao đóng thuộc tính của bài 4, vì bài này dùng nó để kiểm mọi phép tách. Với lược đồ R gồm A, B, C, D và hai luật, A xác định B, B xác định C, ta tính bao đóng của A bằng cách thêm dần. Bắt đầu từ A, luật A xác định B cho thêm B. Có B rồi thì luật B xác định C cho thêm C. Không còn luật nào thêm được gì nữa, nên dừng. Bao đóng của A thiếu D, nên A không phải siêu khoá, tức biết A chưa đủ để biết cả dòng. Còn bao đóng của A D chứa đủ bốn thuộc tính, nên A D là siêu khoá."
      - clear: true
        show: |
          <p><b>Phép chiếu</b> (bài 1): giữ một số cột, bỏ dòng trùng. Chiếu 3 dòng lên $(\text{mssv}, \text{lop})$:</p>
          <table class="t"><tr><th>mssv</th><th>lop</th><th>mon</th><th>sau khi chiếu</th></tr>
          <tr><td>1</td><td>K1</td><td>M1</td><td>(1, K1)</td></tr>
          <tr><td>1</td><td>K1</td><td>M2</td><td>(1, K1) — trùng, bỏ</td></tr>
          <tr><td>2</td><td>K2</td><td>M1</td><td>(2, K2)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Thứ hai, cũng ở bài 1, phép chiếu giữ lại một số cột và bỏ các dòng trùng, vì bảng là một tập. Dòng đầu chiếu ra cặp 1, K1. Dòng thứ hai cũng ra 1, K1, trùng nên bị bỏ. Dòng thứ ba ra 2, K2, nên kết quả chỉ còn 2 dòng."
      - clear: true
        show: |
          <p><b>Phép nối tự nhiên</b> (nối theo mọi cột trùng tên): ghép hai dòng khi chúng <b>bằng nhau ở cột chung</b>.</p>
          <table class="t"><tr><th>(mssv, lop)</th><th>(lop, ten_lop)</th><th>khớp lop?</th><th>kết quả</th></tr>
          <tr><td>(1, K1)</td><td>(K1, Khoa học máy tính)</td><td>có</td><td>(1, K1, Khoa học máy tính)</td></tr>
          <tr><td>(2, K2)</td><td>(K1, Khoa học máy tính)</td><td>không</td><td>bỏ</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Thứ ba, phép nối tự nhiên ghép hai dòng khi chúng bằng nhau ở cột chung, ở đây là cột lớp. Cặp 1, K1 khớp với dòng K1 của bảng lớp, nên ghép thành một dòng ba cột. Cặp 2, K2 không khớp K1, nên không sinh ra dòng nào."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: BCNF và 3NF"
    checks:
      - "alg.candidate_keys('MTLN', [('M', 'TL'), ('L', 'N')]) == ['M']"
      - "alg.bcnf_violations('MTLN', [('M', 'TL'), ('L', 'N')]) == [('L', 'N')]"
    steps:
      - show: |
          <p>Phụ thuộc hàm: $\text{mssv} \to \text{ten}, \text{ma\_lop}$; $\quad \text{ma\_lop} \to \text{ten\_lop}$. Khoá: $\{\text{mssv}\}$.</p>
          <div class="box key"><b>BCNF</b>: mọi phụ thuộc hàm không tầm thường $X \to Y$ (tức $Y$ không nằm sẵn trong $X$) đều có $X$ là siêu khoá.</div>
          <p>Vi phạm: $\text{ma\_lop} \to \text{ten\_lop}$, mà $\text{ma\_lop}$ không phải siêu khoá. Chính phụ thuộc này lặp tên lớp trên nhiều dòng.</p>
          <p class="note"><b>3NF</b> nới hơn một chút: cho phép thêm trường hợp $Y$ chỉ gồm thuộc tính nằm trong một khoá nào đó. Mọi bảng BCNF đều là 3NF.</p>
        focus: [1, 1, 2, 3, 3, 4, 4]
        say: "Bảng to có hai phụ thuộc hàm, mã số xác định tên và mã lớp, còn mã lớp xác định tên lớp. Khoá là mã số. Dạng chuẩn BCNF đòi hỏi, mọi phụ thuộc hàm không tầm thường, nghĩa là vế phải không nằm sẵn trong vế trái, thì vế trái phải là siêu khoá. Ở đây mã lớp xác định tên lớp vi phạm, vì mã lớp không phải siêu khoá. Chính phụ thuộc này làm tên lớp bị lặp trên nhiều dòng. Dạng chuẩn ba nới hơn một chút, nó cho phép thêm trường hợp vế phải chỉ gồm thuộc tính nằm trong một khoá nào đó. Mọi bảng đạt BCNF đều đạt dạng chuẩn ba."

  # ───────────────────────── 3. TÁCH ─────────────────────────
  - id: decompose
    kind: concept
    title: "Tách theo phụ thuộc vi phạm"
    checks:
      - "alg.lossless_binary('MTL', 'LN', [('M', 'TL'), ('L', 'N')])"
      - "alg.bcnf_violations('MTL', [('M', 'TL')]) == [] and alg.bcnf_violations('LN', [('L', 'N')]) == []"
    steps:
      - show: |
          <p>Tách theo $\text{ma\_lop} \to \text{ten\_lop}$: một bảng giữ phụ thuộc đó, bảng kia giữ phần còn lại.</p>
          <p>$\text{SinhVien}(\text{mssv}, \text{ten}, \text{ma\_lop})$ và $\text{Lop}(\text{ma\_lop}, \text{ten\_lop})$ — đúng hai bảng của bài 0.</p>
          <p>Cả hai đều BCNF. Tên lớp chỉ lưu một lần: sửa một chỗ, mở lớp chưa có sinh viên được, xoá sinh viên không mất lớp.</p>
        focus: [1, 2, 3, 3]
        say: "Cách sửa là tách theo phụ thuộc vi phạm, một bảng giữ mã lớp với tên lớp, bảng kia giữ phần còn lại. Ta được bảng sinh viên gồm mã số, tên, mã lớp, và bảng lớp gồm mã lớp, tên lớp, đúng hai bảng của bài 0. Cả hai đều đạt BCNF. Tên lớp giờ chỉ lưu một lần, sửa một chỗ là xong, mở lớp chưa có sinh viên được, và xoá sinh viên không làm mất lớp."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Tách bảng: tên lớp từ nhiều bản sao còn một"
    checks:
      - "alg.sql(\"SELECT COUNT(*) FROM T WHERE ma_lop = 'K1'\", \"CREATE TABLE T (mssv, ten, ma_lop, ten_lop); INSERT INTO T VALUES (1, 'An', 'K1', 'Khoa học máy tính'), (2, 'Bình', 'K1', 'Khoa học máy tính'), (3, 'Chi', 'K2', 'Kỹ thuật phần mềm');\") == [(2,)]"
      - "alg.sql(\"SELECT COUNT(*) FROM Lop WHERE ma_lop = 'K1'\") == [(1,)]"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><defs><marker id="arD5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="26" font-weight="bold" fill="#1f2937"><text x="40" y="50">SV_Lop (một bảng to)</text><text x="900" y="50">SinhVien (mssv, ten, ma_lop)</text><text x="900" y="290">Lop (ma_lop, ten_lop)</text></g><g stroke="#2a78d6" stroke-width="2" fill="#eff6ff"><rect x="40" y="70" width="600" height="56"/><rect x="40" y="130" width="600" height="56"/><rect x="40" y="190" width="600" height="56"/><rect x="900" y="70" width="400" height="56"/><rect x="900" y="130" width="400" height="56"/><rect x="900" y="190" width="400" height="56"/><rect x="900" y="370" width="520" height="56"/></g><g stroke="#eb6834" stroke-width="3" fill="#ffedd5"><rect x="330" y="70" width="310" height="56"/><rect x="330" y="130" width="310" height="56"/></g><rect x="900" y="310" width="520" height="56" stroke="#059669" stroke-width="3" fill="#d1fae5"/><g font-size="24"><text x="60" y="107" fill="#1f2937">1</text><text x="110" y="107" fill="#1f2937">An</text><text x="250" y="107" fill="#1f2937">K1</text><text x="345" y="107" fill="#1f2937">Khoa học máy tính</text><text x="60" y="167" fill="#1f2937">2</text><text x="110" y="167" fill="#1f2937">Bình</text><text x="250" y="167" fill="#1f2937">K1</text><text x="345" y="167" fill="#1f2937">Khoa học máy tính</text><text x="60" y="227" fill="#1f2937">3</text><text x="110" y="227" fill="#1f2937">Chi</text><text x="250" y="227" fill="#1f2937">K2</text><text x="345" y="227" fill="#1f2937">Kỹ thuật phần mềm</text><text x="930" y="107" fill="#1f2937">1</text><text x="1010" y="107" fill="#1f2937">An</text><text x="1180" y="107" fill="#1f2937">K1</text><text x="930" y="167" fill="#1f2937">2</text><text x="1010" y="167" fill="#1f2937">Bình</text><text x="1180" y="167" fill="#1f2937">K1</text><text x="930" y="227" fill="#1f2937">3</text><text x="1010" y="227" fill="#1f2937">Chi</text><text x="1180" y="227" fill="#1f2937">K2</text><text x="930" y="347" fill="#1f2937">K1</text><text x="1030" y="347" fill="#1f2937">Khoa học máy tính</text><text x="930" y="407" fill="#1f2937">K2</text><text x="1030" y="407" fill="#1f2937">Kỹ thuật phần mềm</text></g><line x1="660" y1="230" x2="880" y2="230" stroke="#1f2937" stroke-width="4" marker-end="url(#arD5)"/><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="770" y="180">tách theo</text><text x="770" y="208">ma_lop → ten_lop</text></g><g font-size="24" font-weight="bold"><text x="40" y="300" fill="#eb6834">tên lớp K1 lưu 2 lần</text><text x="40" y="335" fill="#eb6834">đổi tên: phải sửa 2 chỗ</text><text x="900" y="460" fill="#059669">tên lớp K1 lưu 1 lần: sửa 1 chỗ</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy chuyện gì xảy ra khi tách. Bên trái, bảng to chép tên lớp Khoa học máy tính ở 2 dòng, ô tô cam, nên đổi tên lớp phải sửa 2 chỗ. Tách theo luật mã lớp xác định tên lớp, bảng sinh viên chỉ giữ mã lớp như một mũi tên. Tên lớp giờ nằm đúng một dòng ở bảng lớp, ô tô xanh, nên sửa một chỗ là xong."

  # ───────────────────────── 4. KHÔNG MẤT THÔNG TIN ─────────────────────────
  - id: lossless
    kind: example
    title: "Tách đúng và tách sai"
    checks:
      - "(lambda r: alg.natural_join(alg.project(r, ['mssv', 'lop'], ['mssv', 'lop', 'mon']), ['mssv', 'lop'], alg.project(r, ['mssv', 'mon'], ['mssv', 'lop', 'mon']), ['mssv', 'mon'])[0] == sorted(r))([(1, 'K1', 'M1'), (1, 'K1', 'M2'), (2, 'K2', 'M1')])"
      - "(lambda r: len(alg.natural_join(alg.project(r, ['lop', 'mssv'], ['mssv', 'lop', 'mon']), ['lop', 'mssv'], alg.project(r, ['lop', 'mon'], ['mssv', 'lop', 'mon']), ['lop', 'mon'])[0]))([(1, 'K1', 'M1'), (2, 'K1', 'M2')]) == 4"
      - "alg.lossless_binary('AB', 'AC', [('A', 'B')]) and not alg.lossless_binary('BA', 'BC', [('A', 'B')])"
    steps:
      - show: |
          <p><b>Bước 1</b> — bảng $\text{DK}(\text{mssv}, \text{lop}, \text{mon})$, luật $\text{mssv} \to \text{lop}$:</p>
          <table class="t"><tr><th>mssv</th><th>lop</th><th>mon</th></tr>
          <tr><td>1</td><td>K1</td><td>M1</td></tr><tr><td>1</td><td>K1</td><td>M2</td></tr><tr><td>2</td><td>K2</td><td>M1</td></tr></table>
        focus: [1, 2, "2.4"]
        say: "Bước một, tách bảng cũng có thể sai, nên ta thử trên bảng đăng ký gồm mã số, lớp, môn, với luật mã số xác định lớp. Sinh viên 1 thuộc lớp K1 và học hai môn M1, M2. Sinh viên 2 thuộc lớp K2 và học môn M1."
      - show: |
          <p><b>Bước 2</b> — tách <b>đúng</b> theo mssv, chiếu ra hai bảng:</p>
          <table class="t"><tr><th>(mssv, lop)</th><th>(mssv, mon)</th></tr>
          <tr><td>(1, K1)</td><td>(1, M1)</td></tr><tr><td>(2, K2)</td><td>(1, M2)</td></tr><tr><td></td><td>(2, M1)</td></tr></table>
        focus: [1, "2.1", "2.2"]
        say: "Bước hai, tách đúng theo mã số, chiếu ra hai bảng. Bảng mã số với lớp chỉ còn 2 dòng, vì cặp 1, K1 trùng nên bị bỏ. Bảng mã số với môn giữ đủ 3 dòng."
      - clear: true
        show: |
          <p><b>Bước 3</b> — nối lại theo mssv:</p>
          <table class="t"><tr><th>mssv</th><th>lop của nó</th><th>môn của nó</th><th>số dòng</th></tr>
          <tr><td>1</td><td>K1</td><td>M1, M2</td><td>$1 \times 2 = 2$</td></tr>
          <tr><td>2</td><td>K2</td><td>M1</td><td>$1 \times 1 = 1$</td></tr></table>
          <p>Tổng $2 + 1 = \hl{3}$ dòng — đúng bảng ban đầu.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước ba, nối lại theo mã số. Mã số 1 chỉ có một lớp là K1, ghép với hai môn, được 1 nhân 2 bằng 2 dòng. Mã số 2 có lớp K2 và một môn, được 1 dòng. Tổng cộng 2 cộng 1 bằng 3 dòng, đúng bảng ban đầu, không thừa không thiếu."
      - clear: true
        show: |
          <p><b>Bước 4</b> — tách <b>sai</b> theo lop, trên hai dòng (1, K1, M1), (2, K1, M2):</p>
          <table class="t"><tr><th>(lop, mssv)</th><th>(lop, mon)</th><th>nối theo lop K1</th></tr>
          <tr><td>(K1, 1), (K1, 2)</td><td>(K1, M1), (K1, M2)</td><td>$2 \times 2 = \hl{4}$ dòng</td></tr></table>
          <p>Thừa (1, K1, M2) và (2, K1, M1): hai dòng <b>giả</b>.</p>
        focus: [1, "2.2", "2.2", 3]
        say: "Bước bốn, tách sai theo lớp, trên hai dòng khác, sinh viên 1 học M1 và sinh viên 2 học M2, cả hai cùng lớp K1. Bảng lớp với mã số có 2 dòng, bảng lớp với môn cũng có 2 dòng. Nối theo lớp K1, mỗi sinh viên ghép với mọi môn, được 2 nhân 2 bằng 4 dòng. Thừa ra hai dòng giả, như sinh viên 1 học môn M2 dù không hề đăng ký."
      - show: |
          <div class="box key"><b>Bước 5</b> — phép thử: tách $R$ thành $R_1, R_2$ không mất thông tin $\iff (R_1 \cap R_2)^+$ chứa $R_1$ hoặc chứa $R_2$. Phần chung $\text{mssv}$ xác định lop: đúng. Phần chung $\text{lop}$ không xác định gì: sai.</div>
        focus: [1, 1, 1]
        say: "Bước năm, phép thử chung, tách thành hai phần không mất thông tin khi bao đóng của phần chung chứa trọn một trong hai phần. Phần chung là mã số thì xác định được lớp, nên đúng. Còn phần chung là lớp thì không xác định gì, nên sai."

  - id: check
    kind: check
    title: "Tự kiểm: thử hết mọi bảng nhỏ"
    checks:
      - "(lambda dom: (lambda rels: len(rels) == 48 and all(alg.natural_join(alg.project(r, ['mssv', 'lop'], ['mssv', 'lop', 'mon']), ['mssv', 'lop'], alg.project(r, ['mssv', 'mon'], ['mssv', 'lop', 'mon']), ['mssv', 'mon'])[0] == r for r in rels) and sum(len(alg.natural_join(alg.project(r, ['lop', 'mssv'], ['mssv', 'lop', 'mon']), ['lop', 'mssv'], alg.project(r, ['lop', 'mon'], ['mssv', 'lop', 'mon']), ['lop', 'mon'])[0]) > len(r) for r in rels) == 12)([sorted(c) for k in range(1, 9) for c in __import__('itertools').combinations(dom, k) if not any(a[0] == b[0] and a[1] != b[1] for a in c for b in c)]))(list(__import__('itertools').product([1, 2], ['K1', 'K2'], ['M1', 'M2'])))"
      - "2 * 2 * 2 == 8"
    steps:
      - show: |
          <table class="t"><tr><th>thử bằng máy</th><th>kết quả</th></tr>
          <tr><td>mssv ∈ {1, 2}, lop ∈ {K1, K2}, mon ∈ {M1, M2}: $2 \times 2 \times 2 = 8$ dòng có thể</td><td>mọi tập con thoả mssv → lop: 48 bảng</td></tr>
          <tr><td>tách theo mssv rồi nối lại</td><td>48 trên 48 bảng ra đúng bảng cũ</td></tr>
          <tr><td>tách theo lop rồi nối lại</td><td><b class="red">12</b> bảng sinh dòng giả</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không dùng bao đóng mà cho máy thử hết mọi bảng nhỏ. Với hai mã số, hai lớp, hai môn, có 2 nhân 2 nhân 2 bằng 8 dòng có thể, và có 48 bảng khác rỗng thoả luật mã số xác định lớp. Tách theo mã số rồi nối lại, cả 48 bảng đều ra đúng bảng cũ. Tách theo lớp thì 12 bảng sinh dòng giả, khớp kết luận của phép thử bao đóng."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "not alg.lossless_binary('BA', 'BC', [('A', 'B')])"
      - "alg.bcnf_violations('MTLN', [('M', 'TL'), ('L', 'N')]) == [('L', 'N')]"
      - "alg.sql(\"SELECT COUNT(*) FROM T WHERE ma_lop = 'K1'\", \"CREATE TABLE T (mssv, ten, ma_lop, ten_lop); INSERT INTO T VALUES (1, 'An', 'K1', 'Khoa học máy tính'), (2, 'Bình', 'K1', 'Khoa học máy tính'), (3, 'Chi', 'K2', 'Kỹ thuật phần mềm');\") == [(2,)] and alg.sql(\"SELECT COUNT(*) FROM Lop WHERE ma_lop = 'K1'\") == [(1,)]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tách theo cột tuỳ ý <b class="red">(sai)</b>
          <br><span class="note">Phần chung không xác định được một bên thì nối lại sinh dòng giả. Luôn kiểm bằng bao đóng.</span></div>
        say: "Lỗi thứ nhất, tách bảng theo cột tuỳ ý. Nếu phần chung không xác định được một bên, nối lại sẽ sinh dòng giả. Luôn kiểm bằng bao đóng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ chuẩn hoá luôn tốt hơn <b class="red">(sai)</b>
          <br><span class="note">Nhiều bảng hơn thì truy vấn phải nối nhiều hơn. Kho dữ liệu phân tích thường <b>cố ý</b> phi chuẩn hoá để đọc nhanh.</span></div>
          <table class="t"><tr><th>thiết kế</th><th>đọc danh sách kèm tên lớp</th><th>đổi tên lớp K1</th></tr>
          <tr><td>chuẩn hoá (2 bảng)</td><td>nối 2 bảng</td><td>sửa 1 dòng</td></tr>
          <tr><td>phi chuẩn hoá (1 bảng to)</td><td>đọc 1 bảng, không nối</td><td>sửa 2 dòng, sót là lệch</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ hai, nghĩ chuẩn hoá lúc nào cũng tốt hơn. Nhiều bảng hơn thì truy vấn phải nối nhiều hơn, nên các kho dữ liệu dùng để phân tích thường cố ý phi chuẩn hoá để đọc nhanh. Người đã đi làm cân hai bên như bảng chỉ ra, chuẩn hoá phải nối hai bảng khi đọc nhưng đổi tên lớp chỉ sửa 1 dòng. Bảng to thì đọc không cần nối, nhưng đổi tên lớp K1 phải sửa 2 dòng, sót một dòng là lệch. Vì thế họ chỉ phi chuẩn hoá bản sao chỉ đọc, sinh lại định kỳ từ bảng đã chuẩn hoá."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tìm vi phạm bằng mắt trên dữ liệu mẫu <b class="red">(sai)</b>
          <br><span class="note">Vi phạm BCNF đọc từ phụ thuộc hàm (ngữ nghĩa), như bài 4, không từ vài dòng.</span></div>
        say: "Lỗi thứ ba, tìm vi phạm bằng mắt trên dữ liệu mẫu. Vi phạm BCNF phải đọc từ phụ thuộc hàm, tức ngữ nghĩa dữ liệu như bài 4, không từ vài dòng đang có."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tách tới mức mỗi bảng một cột <b class="red">(sai)</b>
          <br><span class="note">Mất luôn liên kết giữa các cột. Chỉ tách theo phụ thuộc vi phạm, và mỗi lần tách đều phải không mất thông tin.</span></div>
        say: "Lỗi thứ tư, tách tới mức mỗi bảng chỉ một cột. Khi đó mất luôn liên kết giữa các cột. Chỉ tách theo phụ thuộc vi phạm, và mỗi lần tách đều phải không mất thông tin."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.candidate_keys('ABC', [('B', 'C')]) == ['AB'] and alg.bcnf_violations('ABC', [('B', 'C')]) == [('B', 'C')]"
      - "alg.lossless_binary('AB', 'BC', [('B', 'C')]) and not alg.lossless_binary('AC', 'BC', [('B', 'C')])"
      - "alg.attr_closure('A', [('B', 'C')])[0] == {'A'} and alg.attr_closure('B', [('B', 'C')])[0] == {'B', 'C'} and alg.attr_closure('AB', [('B', 'C')])[0] == set('ABC') and alg.attr_closure('C', [('B', 'C')])[0] == {'C'}"
    steps:
      - show: |
          <p>$R(A, B, C)$, $F = \{B \to C\}$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Khoá của $R$ là gì? $R$ có BCNF không?</td></tr>
          <tr><td>2</td><td>Tách thành $(A, B)$ và $(B, C)$ có mất thông tin không? Còn $(A, C)$ và $(B, C)$?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với lược đồ R gồm A, B, C và một luật, B xác định C. Câu một, khoá của R là gì, và R có đạt BCNF không? Câu hai, tách thành A B và B C có mất thông tin không? Còn tách thành A C và B C thì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Tìm khoá:</p>
          <table class="t"><tr><th>thử</th><th>bao đóng</th><th>đủ $A, B, C$?</th></tr>
          <tr><td>$A^+$</td><td>$\{A\}$</td><td>không</td></tr>
          <tr><td>$B^+$</td><td>$\{B, C\}$</td><td>không</td></tr>
          <tr><td>$(AB)^+$</td><td>$\{A, B, C\}$</td><td>có → khoá $\hl{AB}$</td></tr></table>
          <p>$B \to C$ mà $B$ không phải siêu khoá → $R$ <b>không</b> BCNF.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Đáp án câu một, ta thử bao đóng từng tập. Bao đóng của A chỉ có A, vì không luật nào bắt đầu từ A. Bao đóng của B gồm B và C, vẫn thiếu A. Bao đóng của A B gồm đủ A, B, C, nên khoá là A B. Luật B xác định C có vế trái B không phải siêu khoá, nên R không đạt BCNF."
      - clear: true
        show: |
          <table class="t"><tr><th>phép tách</th><th>phần chung</th><th>bao đóng</th><th>chứa trọn một bên?</th></tr>
          <tr><td>$(A, B)$, $(B, C)$</td><td>$B$</td><td>$\{B, C\}$</td><td>chứa $(B, C)$ → <b>không mất</b></td></tr>
          <tr><td>$(A, C)$, $(B, C)$</td><td>$C$</td><td>$\{C\}$</td><td>không → <b class="red">mất</b> thông tin</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, áp phép thử bao đóng cho từng cách tách. Phần chung của A B và B C là B, bao đóng của B gồm B và C, chứa trọn bảng thứ hai, nên không mất thông tin. Phần chung của A C và B C là C, bao đóng của C chỉ có C, không chứa bên nào, nên tách này mất thông tin."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">phụ thuộc mà vế trái không phải siêu khoá</span><span class="a">→</span>
          <span class="n">lặp dữ liệu, dị thường</span><span class="a">→</span>
          <span class="n">tách theo phụ thuộc đó</span><span class="a">→</span>
          <span class="n">kiểm phần chung bằng bao đóng</span></div>
        say: "Tổng kết lại, một phụ thuộc hàm có vế trái không phải siêu khoá gây lặp dữ liệu và ba loại dị thường. Ta tách bảng theo đúng phụ thuộc đó, và kiểm phần chung bằng bao đóng để chắc không mất thông tin."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi sự kiện chỉ nên được ghi ở một chỗ. Khi một sự kiện nằm ở nhiều dòng, sớm muộn các bản sao sẽ lệch nhau.</div>
        say: "Điều cần mang theo, mỗi sự kiện chỉ nên được ghi ở một chỗ. Khi một sự kiện nằm ở nhiều dòng, sớm muộn các bản sao sẽ lệch nhau."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>thiết kế thực thể–liên kết</b> — vẽ mô hình trước, rồi chuyển thành bảng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học thiết kế thực thể liên kết, cách vẽ mô hình dữ liệu trước rồi chuyển thành bảng. Hẹn gặp bạn ở bài tiếp theo."
