        forward_ref: true
        say: "Ở bài sau, bài 15, ta đi lại hành trình kiểm soát tắc nghẽn từ lần mạng sụp đổ năm 1986 tới bộ chuẩn giao vận mới năm 2021. Ta sẽ thấy mỗi quy tắc gửi gói ra đời từ điểm nghẽn nào. Hẹn gặp bạn ở bài tiếp theo."
