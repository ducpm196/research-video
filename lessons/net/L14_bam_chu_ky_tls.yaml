          <span class="n">kiểm bằng khoá công khai</span><span class="a">→</span>
          <span class="n">chứng chỉ dẫn về gốc tin sẵn</span></div>
        say: "Tổng kết lại, hàm băm tạo dấu vân tay, chữ ký được tạo bằng khoá bí mật và kiểm bằng khoá công khai. Chứng chỉ nối khoá công khai với tên miền, và chuỗi chứng chỉ dẫn về một gốc đã tin sẵn."
      - show: |
          <div class="box key"><b>Tư duy của cả khoá:</b> mỗi tầng giải một bài toán và tin vào tầng dưới vừa đủ — truyền bit, đi đúng đường, đủ dữ liệu, đúng người. Khi lỗi, hãy hỏi tầng nào đang phá lời hứa của nó.</div>
        say: "Điều cần mang theo của cả khoá, mỗi tầng giải một bài toán và tin vào tầng dưới vừa đủ, truyền bit, đi đúng đường, đủ dữ liệu, đúng người. Khi có lỗi, hãy hỏi tầng nào đang phá lời hứa của nó."
      - clear: true
        show: |
