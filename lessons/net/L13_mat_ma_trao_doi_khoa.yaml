      '
    say: Tổng kết lại, mã đối xứng nhanh nhưng khó trao khoá, và trao đổi khoá giải quyết việc đó trên một đường công khai. Nó an toàn nhờ một bài toán khó, nhưng vẫn cần chữ ký để chống người đứng giữa. Bảo mật hiện đại không giấu thuật toán mà công khai toàn bộ phép toán và neo toàn bộ an toàn vào bài toán một chiều rất khó đảo ngược. Kết hợp trao đổi khoá bất đối xứng cùng mã hoá đối xứng nhanh tạo thành kênh truyền an toàn hiệu quả.
