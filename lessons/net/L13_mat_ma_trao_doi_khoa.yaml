      '
    say: Trước khi tính, hãy nhìn cái gì đi trên đường và cái gì được giữ riêng. Ô đỏ hai bên là số bí mật, a bằng 6 của An và b bằng 15 của Bình, không bao giờ rời khỏi máy. Vùng xám ở giữa là đường ai cũng nghe, trên đó chỉ có p bằng 23, g bằng 5, và hai số được gửi đi, 8 và 19.
