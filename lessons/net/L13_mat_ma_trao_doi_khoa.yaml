scenes:
- id: hook
  kind: hook
  title: Thống nhất bí mật giữa chốn đông người
  checks:
  - alg.dh(23, 5, 6, 15) == (8, 19, 2, 2)
  steps:
  - show: '<p>Hai người chưa từng gặp, chỉ nói chuyện qua một đường mà <b>ai cũng nghe được</b>. Làm sao để cuối cùng cả hai có chung một con số bí mật mà người nghe lén không biết?</p>

      <p>Năm 1976, Diffie và Hellman chỉ ra cách làm — chỉ bằng lũy thừa và phép chia lấy dư.</p>

      <div class="box key">Hôm nay: mã đối xứng, mã khoá công khai, và trao đổi khoá Diffie–Hellman trên số nhỏ.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    say: Chào bạn, hai người chưa từng gặp, chỉ nói chuyện qua một đường mà ai cũng nghe được. Làm sao để cuối cùng cả hai có chung một con số bí mật, mà người nghe lén không biết? Năm 1976, Diffie–Hellman chỉ ra cách làm, chỉ bằng lũy thừa và phép chia lấy dư. Hôm nay ta học mã đối xứng, mã khoá công khai, và trao đổi khoá Diffie–Hellman trên số nhỏ. Thống nhất được một khoá bí mật chung ngay trên kênh công khai bị nghe lén là nền tảng toán học đưa mọi kết nối mạng đi vào trạng thái mã hoá.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: lũy thừa và phép chia lấy dư'
  checks:
  - 5 ** 2 == 25 and 5 ** 3 == 125 and 5 ** 4 == 625
  - 14 % 12 == 2 and divmod(25, 23) == (1, 2) and divmod(125, 23) == (5, 10) and divmod(625, 23) == (27, 4)
  - 25 * 5 == 125 and (25 * 5) % 23 == (2 * 5) % 23 == 10 and 25 - 2 == 23
  steps:
  - show: '<p><b>Lũy thừa</b> là nhân lặp: $5^3 = 5 \times 5 \times 5 = 125$.</p>

      <p><b>Chia lấy dư</b> giống mặt đồng hồ 12 giờ: 14 giờ, kim chỉ số 2, vì 14 chia 12 dư 2.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Trước hết, ôn hai phép tính bài này dùng suốt. Lũy thừa là nhân lặp, 5 mũ 3 là 5 nhân 5 nhân 5, bằng 125. Phép chia lấy dư giống mặt đồng hồ, đi hết một vòng thì quay lại từ đầu. Ví dụ 14 giờ thì kim chỉ số 2, vì 14 chia 12 được 1, còn dư 2. Nhắc lại phép tính mô-đun chia lấy dư như mặt đồng hồ giữ các kết quả lũy thừa khổng lồ nằm gọn trong vòng số định sẵn.
  - show: '<table class="t"><tr><th>số</th><th>chia cho 23</th><th>thương</th><th>số dư</th></tr>

      <tr><td>$5^2 = 25$</td><td>25 = 1 × 23 + 2</td><td>1</td><td><b>2</b></td></tr>

      <tr><td>$5^3 = 125$</td><td>125 = 5 × 23 + 10</td><td>5</td><td><b>10</b></td></tr>

      <tr><td>$5^4 = 625$</td><td>625 = 27 × 23 + 4</td><td>27</td><td><b>4</b></td></tr></table>

      <p class="note"><b>Mẹo nhân nhỏ:</b> thay một số bằng số dư của nó rồi mới nhân, số dư cuối không đổi. $5^3 = 25 \times 5 = 125$, chia 23 dư 10; thay 25 bằng số dư 2: $2 \times 5 = 10$, cũng dư 10. Lý do: phần bỏ đi là một bội của 23, nhân lên vẫn là bội của 23.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    - 2
    - 2
    - 2
    say: Bài này chia mọi thứ cho 23, giống một đồng hồ có 23 vạch. Năm bình phương bằng 25, bằng 1 lần 23 cộng 2, nên dư 2. Năm mũ 3 bằng 125, bằng 5 lần 23 cộng 10, nên dư 10. Năm mũ 4 bằng 625, bằng 27 lần 23 cộng 4, nên dư 4. Số dư luôn nhỏ hơn 23, dù lũy thừa lớn đến đâu. Có một mẹo giữ số nhỏ, là thay một số bằng số dư của nó rồi mới nhân, số dư cuối không đổi. Ví dụ 125 bằng 25 nhân 5, chia 23 dư 10, còn thay 25 bằng số dư 2 thì 2 nhân 5 bằng 10, cũng dư 10. Lý do là phần bỏ đi là một bội của 23, nhân lên vẫn là bội của 23.
- id: sym
  kind: symbol
  title: 'Giải mã: hai loại mật mã và phép mod'
  steps:
  - show: '<table class="t"><tr><th></th><th>mã <b>đối xứng</b></th><th>mã <b>khoá công khai</b></th></tr>

      <tr><td>khoá</td><td>một khoá chung, cả hai bên giữ bí mật</td><td>mỗi người một cặp: khoá công khai cho mọi người, khoá bí mật giữ riêng</td></tr>

      <tr><td>tốc độ</td><td>rất nhanh — mã hoá dữ liệu lớn</td><td>chậm hơn nhiều — dùng cho việc nhỏ: trao khoá, ký</td></tr>

      <tr><td>khó khăn</td><td>làm sao trao khoá chung lúc đầu?</td><td>làm sao biết khoá công khai đúng là của người đó?</td></tr></table>

      <p>$a \bmod p$: số dư khi chia $a$ cho $p$. Ví dụ $5^2 = 25$, $25 \bmod 23 = 2$.</p>

      '
    introduces:
    - mod
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Có hai loại mật mã. Mã đối xứng dùng một khoá chung mà cả hai bên giữ bí mật, còn mã khoá công khai cho mỗi người một cặp khoá, khoá công khai đưa cho mọi người, khoá bí mật giữ riêng. Mã đối xứng rất nhanh, dùng để mã hoá dữ liệu lớn, còn mã khoá công khai chậm hơn nhiều, chỉ dùng cho việc nhỏ như trao khoá hay ký. Khó khăn của mã đối xứng là trao khoá chung lúc đầu, còn của khoá công khai là biết khoá đó có đúng là của người kia không. Ký hiệu trên màn hình là số dư khi chia, ví dụ 25 chia 23 dư 2. Phân tách rạch ròi tốc độ siêu nhanh của khoá đối xứng chung với khả năng trao đổi không cần gặp mặt của cặp khoá công khai bí mật.
