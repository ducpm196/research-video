      '
    say: Người nghe lén có đủ bốn số 23, 5, 8 và 19, nhưng thiếu a và b, nên không làm được bước cuối.
- id: example
  kind: example
  title: Diffie–Hellman với p = 23, g = 5
  checks:
  - pow(5, 6, 23) == 8 and 5 ** 6 == 15625 and 15625 - 679 * 23 == 8
  - pow(5, 15, 23) == 19
  - pow(19, 6, 23) == 2 == pow(8, 15, 23)
  - 15 * 6 == 6 * 15 == 90 and pow(5, 90, 23) == 2 and pow(5, 15, 23) == 19 and pow(5, 6, 23) == 8
  steps:
  - show: '<p><b>Bước 1 — An</b> (bí mật $a = 6$) tính số gửi đi, với $5^6 = 15625 = 679 \times 23 + 8$:</p>

      $$A = 5^6 \bmod 23 = \hl{8}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Chạy thử với số nhỏ, hai bên đã thống nhất công khai p bằng 23 và g bằng 5. Bước một, An chọn bí mật a bằng 6, rồi tính 5 mũ 6, bằng 15625, bằng 679 lần 23 cộng 8. Vậy A bằng 8, và An gửi số 8 đi.
  - show: '<p><b>Bước 2 — Bình</b> (bí mật $b = 15$) tính số gửi đi, nhân dần rồi lấy dư sau mỗi lần nhân:</p>

      $$B = 5^{15} \bmod 23 = \hl{19}$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, Bình chọn bí mật b bằng 15. Năm mũ 15 là một số rất lớn, nên Bình nhân dần từng thừa số 5 và lấy dư sau mỗi lần nhân, kết quả là B bằng 19, và Bình gửi số 19 đi.
  - show: '<p><b>Bước 3 — An</b> lấy số nhận được 19, mũ số bí mật của mình:</p>

      $$19^6 \bmod 23 = \hl{2}$$

      '
    focus:
    - 1
    - 2
    say: Bước ba, An lấy số vừa nhận được là 19, rồi mũ 6, đúng số bí mật của mình. Chia lấy dư cho 23, An được 2.
  - show: '<p><b>Bước 4 — Bình</b> lấy số nhận được 8, mũ số bí mật của mình:</p>

      $$8^{15} \bmod 23 = \hl{2}$$

      '
    focus:
    - 1
    - 2
    say: Bước bốn, Bình lấy số vừa nhận được là 8, rồi mũ 15, đúng số bí mật của mình. Chia lấy dư cho 23, Bình cũng được 2, đó là khoá chung.
  - clear: true
    show: '<table class="t"><tr><th>bước</th><th>An (bí mật $a = 6$)</th><th>công khai trên đường</th><th>Bình (bí mật $b = 15$)</th></tr>

      <tr><td>1</td><td colspan="3" style="text-align:center">thống nhất công khai $p = 23$, $g = 5$</td></tr>

      <tr><td>2</td><td>$A = 5^6 \bmod 23 = 8$</td><td>An gửi 8 cho Bình</td><td></td></tr>

      <tr><td>3</td><td></td><td>Bình gửi 19 cho An</td><td>$B = 5^{15} \bmod 23 = 19$</td></tr>

      <tr><td>4</td><td>$19^6 \bmod 23 = \hl{2}$</td><td></td><td>$8^{15} \bmod 23 = \hl{2}$</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.5'
    - '1.5'
    say: Gom cả bốn bước vào một bảng. Dòng đầu là hai số công khai, 23 và 5. Hai dòng giữa là hai số đi trên đường, 8 và 19. Dòng cuối là hai phép tính riêng của An và Bình, cả hai đều ra 2. Bảng tổng kết bốn bước cho thấy cả hai bên đều tính chạm chính xác con số khoá hai dù chưa từng truyền số bí mật của mình qua mạng.
  - show: '<div class="box key">Vì sao trùng? 19 là số dư của $5^{15}$, nên theo mẹo nhân nhỏ, $19^6$ cùng số dư với $(5^{15})^6 = 5^{90}$. Tương tự 8 là số dư của $5^6$, nên $8^{15}$ cùng số dư với $(5^6)^{15} = 5^{90}$. Hai bên cùng ra số dư của $5^{90}$ khi chia 23.</div>

      <p>Người nghe lén thấy 23, 5, 8, 19. Muốn ra 2 phải tìm $a$ từ $5^a \bmod 23 = 8$ — với $p$ dài 2048 bit, trên máy tính hiện nay chưa ai biết cách làm nhanh.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Vì sao hai số trùng nhau? 19 là số dư của 5 mũ 15, nên theo mẹo nhân nhỏ, 19 mũ 6 có cùng số dư với 5 mũ 15 rồi mũ 6, tức 5 mũ 90. Tương tự, 8 là số dư của 5 mũ 6, nên 8 mũ 15 có cùng số dư với 5 mũ 90, và hai bên ra cùng một số. Người nghe lén thấy 23, 5, 8 và 19. Muốn ra khoá, họ phải tìm a sao cho 5 mũ a chia 23 dư 8, mà với p dài 2048 bit thì trên máy tính hiện nay chưa ai biết cách làm nhanh. Tính giao hoán của phép nâng lũy thừa đồng dư bảo đảm mũ a trước mũ b sau cho cùng phần dư hệt mũ b trước mũ a sau.
  - clear: true
    show: '<p><b>Minh hoạ Python trao đổi khoá Diffie–Hellman bằng pow ba tham số</b></p><div class="code"><div>p, g, a, b = 23, 5, 6, 15</div><div>A, B = pow(g, a, p), pow(g, b, p)</div><div>print(A, B, pow(B, a, p), pow(A, b, p))</div><div style="color:#059669"># Kết quả: 8 19 2 2</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã dùng hàm luỹ thừa đồng dư trao đổi khoá trên modulo hai mươi ba. Cả An và Bình đều thu về cùng một khoá bí mật chung bằng hai.
- id: verify
  kind: check
  title: Tự kiểm
  checks:
  - 5 ** 2 % 23 == 2 and 2 * 2 * 2 % 23 == 8 and pow(5, 6, 23) == 8
  - '[pow(5, k, 23) for k in range(1, 7)] == [5, 2, 10, 4, 20, 8] and 2 * 5 == 10 and 50 % 23 == 4 and 4 * 5 == 20 and 100 % 23 == 8'
  steps:
  - show: '<ol><li><b>Tính bằng tay theo từng bước:</b> $5^2 = 25 \equiv 2$, nên $5^6 = (5^2)^3 \equiv 2^3 = 8$ — khớp.</li>

      <li><b>Hai bên phải ra cùng số</b>; khác nhau là đã tính sai một bước.</li>

      <li><b>Thứ đi trên đường</b> chỉ là $p$, $g$, $A$, $B$ — không bao giờ là $a$, $b$ hay khoá.</li></ol>

      '
    introduces:
    - equiv_mod
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    say: Tự kiểm bằng ba cách. Một, tính bằng tay theo từng bước, 5 bình phương bằng 25, chia 23 dư 2, nên 5 mũ 6 bằng 2 mũ 3, tức 8, khớp với kết quả. Ký hiệu ba gạch nghĩa là cùng số dư khi chia cho 23. Hai, hai bên phải ra cùng một số, khác nhau là đã tính sai một bước. Ba, thứ đi trên đường chỉ là p, g, A và B, không bao giờ là a, b hay khoá. Rút gọn bằng quy tắc lấy dư ngay sau mỗi phép nhân giữ mọi số trung gian nhỏ bé đủ tính tay không bao giờ tràn số.
  - clear: true
    show: '<p>Đường thứ hai: nhân thêm một thừa số 5 mỗi bước, rồi lấy dư ngay.</p>

      <table class="t"><tr><th>mũ</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>

      <tr><td>phép tính</td><td>5</td><td>25</td><td>2 × 5 = 10</td><td>10 × 5 = 50</td><td>4 × 5 = 20</td><td>20 × 5 = 100</td></tr>

      <tr><td>số dư khi chia 23</td><td>5</td><td>2</td><td>10</td><td>4</td><td>20</td><td><b>8</b> ✓</td></tr></table>

      '
    focus:
    - 1
    - '2.3'
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.3'
    say: Giờ kiểm lại số 8 bằng một đường khác, không đi qua 15625, mà nhân thêm một thừa số 5 mỗi bước rồi lấy dư ngay. Năm bình phương bằng 25, dư 2. Lấy 2 nhân 5 được 10, rồi 10 nhân 5 được 50, dư 4. Tiếp theo 4 nhân 5 được 20, rồi 20 nhân 5 được 100, chia 23 dư 8. Ra đúng 8, và mọi phép tính đều chỉ là số nhỏ. Từng bước nhân năm lấy dư cho hai mươi ba xác nhận khớp tuyệt đối kết quả tám ở bước cuối mà không cần tính qua mười lăm nghìn.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  checks:
  - f'{2 ** 128:.1e}' == '3.4e+38'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ Diffie–Hellman chống được mọi kẻ gian <b class="red">(sai)</b>

      <br><span class="note">Người <b>đứng giữa</b> chặn cả hai chiều, trao khoá riêng với An và riêng với Bình. Phải kèm <b>chữ ký</b> để biết 8 thật sự do An gửi.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ Diffie–Hellman chống được mọi kẻ gian. Một người đứng giữa chặn cả hai chiều, trao khoá riêng với An và riêng với Bình, nên phải kèm chữ ký để biết số 8 thật sự do An gửi. Trao đổi khoá đơn thuần tự nó không chứng minh danh tính bên kia đường dây nên vẫn cần kết hợp chữ ký chống kẻ đứng giữa mạo danh. Trao đổi khoá thuần tuý thiếu chữ ký chứng thực dễ mở cửa cho kẻ đứng giữa mạo danh đánh tráo toàn bộ khoá.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng mã khoá công khai để mã hoá cả tệp lớn <b class="red">(chậm)</b>

      <br><span class="note">Thực tế: dùng khoá công khai hoặc trao đổi khoá để có <b>khoá đối xứng</b>, rồi mã hoá dữ liệu bằng mã đối xứng.</span></div>

      '
    say: Lỗi thứ hai, dùng mã khoá công khai để mã hoá cả tệp lớn, rất chậm. Thực tế, ta dùng khoá công khai hoặc trao đổi khoá để có một khoá đối xứng, rồi mã hoá dữ liệu bằng mã đối xứng. Hệ thống bảo mật thực tế luôn dùng trao đổi khoá bất đối xứng để thỏa thuận khoá phiên đối xứng ngắn gọn rồi mã hoá toàn bộ dữ liệu lớn bằng khoá đó.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Tưởng số nhỏ trong bài là an toàn <b class="red">(sai)</b>

      <br><span class="note">Với $p = 23$, thử 22 giá trị của $a$ là ra. Hệ thật hiện nay dùng $p$ cỡ 2048 bit trở lên; khoá đối xứng 128 bit có $2^{128} \approx 3{,}4 \times 10^{38}$ khả năng.</span></div>

      <table class="t"><tr><th>khoá</th><th>số khả năng phải thử</th></tr>

      <tr><td>$p = 23$ (bài này)</td><td>22</td></tr>

      <tr><td>khoá đối xứng 128 bit</td><td>$2^{128} \approx 3{,}4 \times 10^{38}$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Lỗi thứ ba, tưởng số nhỏ trong bài là an toàn. Với p bằng 23, thử 22 giá trị của a là ra. Hệ thật hiện nay dùng p cỡ 2048 bit trở lên, còn khoá đối xứng 128 bit có khoảng 3 phẩy 4 nhân 10 mũ 38 khả năng. Với số nguyên tố nhỏ như hai mươi ba kẻ gian thử vét cạn tích tắc là ra bí mật; thực tế đòi hỏi số nguyên dài hàng nghìn bít.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Tự chế thuật toán mã hoá <b class="red">(nguy hiểm)</b>

      <br><span class="note">Mật mã an toàn là thứ đã bị nhiều người tấn công công khai nhiều năm. Hãy dùng thư viện chuẩn, đừng tự viết.</span></div>

      '
    say: Lỗi thứ tư, tự chế thuật toán mã hoá, rất nguy hiểm. Mật mã an toàn là thứ đã bị nhiều người tấn công công khai trong nhiều năm, nên hãy dùng thư viện chuẩn, đừng tự viết. Không bao giờ tự sáng chế hàm mã hoá đóng kín; chỉ dùng chuẩn mật mã đã vượt qua hàng chục năm tấn công phân tích công khai.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.dh(23, 5, 4, 3) == (4, 10, 18, 18)
  - 5 ** 4 == 625 and 625 % 23 == 4 and 125 % 23 == 10 and 10 ** 4 % 23 == 18 and 4 ** 3 % 23 == 18
  - 27 * 23 + 4 == 625 and 5 * 23 + 10 == 125 and 10 ** 4 == 10000 and 434 * 23 + 18 == 10000 and 2 * 23 + 18 == 64
  steps:
  - show: '<p>Vẫn $p = 23$, $g = 5$. An chọn $a = 4$, Bình chọn $b = 3$.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Mỗi người gửi số nào?</td></tr>

      <tr><td>2</td><td>Khoá chung là bao nhiêu? Kiểm cả hai phía.</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm, vẫn với p bằng 23 và g bằng 5. An chọn a bằng 4, Bình chọn b bằng 3. Câu một, mỗi người gửi số nào? Câu hai, khoá chung là bao nhiêu? Hãy kiểm cả hai phía. Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① An: $5^4 = 625$, $625 \bmod 23 = \hl{4}$. Bình: $5^3 = 125$, $125 \bmod 23 = \hl{10}$.</p>

      $$625 = 27 \times 23 + 4, \quad 125 = 5 \times 23 + 10$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một, An tính 5 mũ 4 bằng 625, chia 23 dư 4, nên gửi 4. Bình tính 5 mũ 3 bằng 125, chia 23 dư 10, nên gửi 10. Kiểm phép chia, 625 bằng 27 lần 23 cộng 4, và 125 bằng 5 lần 23 cộng 10.
  - show: '<p>② An: $10^4 = 10000$, $10000 \bmod 23 = \hl{18}$. Bình: $4^3 = 64$, $64 \bmod 23 = \hl{18}$. Trùng.</p>

      $$10000 = 434 \times 23 + 18, \quad 64 = 2 \times 23 + 18$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Câu hai, An lấy số 10 nhận được, mũ 4, bằng 10000, chia 23 dư 18. Còn Bình lấy số 4 nhận được, mũ 3, bằng 64, chia 23 cũng dư 18, hai bên trùng nhau. Kiểm phép chia, 10000 bằng 434 lần 23 cộng 18, và 64 bằng 2 lần 23 cộng 18.
