id: L13
course: NET
series: "NET · Mạng máy tính"
title: "Bài 13 — Mật mã cơ bản: đối xứng, khoá công khai, trao đổi khoá"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/net.yaml L13; audit/net/verify_net.py L13; W. Diffie, M. Hellman (1976), “New Directions in Cryptography”; DMS bài 13–15 (đồng dư, lũy thừa theo mô-đun)"
assumes: [arith, power, approx, dots]
# Quy ước: “Diffie–Hellman” đọc theo lexicon_vi.NET.yaml (probe p1); mã khối đối xứng chỉ nói chung, không nêu tên chuẩn. Số nhỏ p = 23
#   chỉ để minh hoạ (thực tế p dài 2048 bit trở lên). Mọi lũy thừa theo mô-đun do alg.dh (pow của Python) tính và đối chiếu tay.
objectives:
  - "Phân biệt mã đối xứng và mã khoá công khai"
  - "Chạy Diffie–Hellman trên số nhỏ"
  - "Hiểu vì sao Diffie–Hellman một mình không chống được người đứng giữa"
asr_reviewed:
  - {sentence: "Lỗi thứ nhất, nghĩ Diffie–Hellman chống được mọi kẻ gian.", reason: "Diffie–Hellman đọc “Đi-phi Hen-man” (lexicon_vi.NET.yaml p1 8/8; ASR không tách m/n nên NOT_VERIFIED); ASR chép “đi phi henman” — đủ bốn âm tiết, chỉ viết liền"}
  - {sentence: "Hôm nay ta học mã đối xứng, mã khoá công khai, và trao đổi khoá Diffie–Hellman trên số nhỏ.", reason: "Diffie–Hellman đọc “Đi-phi Hen-man” (lexicon NET p1 8/8); ASR chép “DeFi Handman” — đúng bốn âm tiết theo cách viết tiếng Anh, độ khớp 0,9 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Năm 1976, Diffie–Hellman chỉ ra cách làm, chỉ bằng lũy thừa và phép chia lấy dư.", reason: "Diffie–Hellman đọc “Đi-phi Hen-man” (lexicon NET p1 8/8); ASR chép “đi phi Henman” — đủ âm tiết, viết liền; độ khớp 0,939"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thống nhất bí mật giữa chốn đông người"
    checks:
      - "alg.dh(23, 5, 6, 15) == (8, 19, 2, 2)"
    steps:
      - show: |
          <p>Hai người chưa từng gặp, chỉ nói chuyện qua một đường mà <b>ai cũng nghe được</b>. Làm sao để cuối cùng cả hai có chung một con số bí mật mà người nghe lén không biết?</p>
          <p>Năm 1976, Diffie và Hellman chỉ ra cách làm — chỉ bằng lũy thừa và phép chia lấy dư.</p>
          <div class="box key">Hôm nay: mã đối xứng, mã khoá công khai, và trao đổi khoá Diffie–Hellman trên số nhỏ.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, hai người chưa từng gặp, chỉ nói chuyện qua một đường mà ai cũng nghe được. Làm sao để cuối cùng cả hai có chung một con số bí mật, mà người nghe lén không biết? Năm 1976, Diffie–Hellman chỉ ra cách làm, chỉ bằng lũy thừa và phép chia lấy dư. Hôm nay ta học mã đối xứng, mã khoá công khai, và trao đổi khoá Diffie–Hellman trên số nhỏ."

  # ───────────────────────── 1b. CHUẨN BỊ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa và phép chia lấy dư"
    checks:
      - "5 ** 2 == 25 and 5 ** 3 == 125 and 5 ** 4 == 625"
      - "14 % 12 == 2 and divmod(25, 23) == (1, 2) and divmod(125, 23) == (5, 10) and divmod(625, 23) == (27, 4)"
    steps:
      - show: |
          <p><b>Lũy thừa</b> là nhân lặp: $5^3 = 5 \times 5 \times 5 = 125$.</p>
          <p><b>Chia lấy dư</b> giống mặt đồng hồ 12 giờ: 14 giờ, kim chỉ số 2, vì 14 chia 12 dư 2.</p>
        focus: [1, 1, 2, 2]
        say: "Trước hết, ôn hai phép tính bài này dùng suốt. Lũy thừa là nhân lặp, 5 mũ 3 là 5 nhân 5 nhân 5, bằng 125. Phép chia lấy dư giống mặt đồng hồ, đi hết một vòng thì quay lại từ đầu. Ví dụ 14 giờ thì kim chỉ số 2, vì 14 chia 12 được 1, còn dư 2."
      - show: |
          <table class="t"><tr><th>số</th><th>chia cho 23</th><th>thương</th><th>số dư</th></tr>
          <tr><td>$5^2 = 25$</td><td>25 = 1 × 23 + 2</td><td>1</td><td><b>2</b></td></tr>
          <tr><td>$5^3 = 125$</td><td>125 = 5 × 23 + 10</td><td>5</td><td><b>10</b></td></tr>
          <tr><td>$5^4 = 625$</td><td>625 = 27 × 23 + 4</td><td>27</td><td><b>4</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bài này chia mọi thứ cho 23, giống một đồng hồ có 23 vạch. Năm bình phương bằng 25, bằng 1 lần 23 cộng 2, nên dư 2. Năm mũ 3 bằng 125, bằng 5 lần 23 cộng 10, nên dư 10. Năm mũ 4 bằng 625, bằng 27 lần 23 cộng 4, nên dư 4. Số dư luôn nhỏ hơn 23, dù lũy thừa lớn đến đâu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hai loại mật mã và phép mod"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>mã <b>đối xứng</b></th><th>mã <b>khoá công khai</b></th></tr>
          <tr><td>khoá</td><td>một khoá chung, cả hai bên giữ bí mật</td><td>mỗi người một cặp: khoá công khai cho mọi người, khoá bí mật giữ riêng</td></tr>
          <tr><td>tốc độ</td><td>rất nhanh — mã hoá dữ liệu lớn</td><td>chậm hơn nhiều — dùng cho việc nhỏ: trao khoá, ký</td></tr>
          <tr><td>khó khăn</td><td>làm sao trao khoá chung lúc đầu?</td><td>làm sao biết khoá công khai đúng là của người đó?</td></tr></table>
          <p>$a \bmod p$: số dư khi chia $a$ cho $p$. Ví dụ $5^2 = 25$, $25 \bmod 23 = 2$.</p>
        introduces: [mod]
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Có hai loại mật mã. Mã đối xứng dùng một khoá chung mà cả hai bên giữ bí mật, còn mã khoá công khai cho mỗi người một cặp khoá, khoá công khai đưa cho mọi người, khoá bí mật giữ riêng. Mã đối xứng rất nhanh, dùng để mã hoá dữ liệu lớn, còn mã khoá công khai chậm hơn nhiều, chỉ dùng cho việc nhỏ như trao khoá hay ký. Khó khăn của mã đối xứng là trao khoá chung lúc đầu, còn của khoá công khai là biết khoá đó có đúng là của người kia không. Ký hiệu trên màn hình là số dư khi chia, ví dụ 25 chia 23 dư 2."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cái gì đi trên đường, cái gì giữ riêng"
    checks:
      - "alg.dh(23, 5, 6, 15) == (8, 19, 2, 2)"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="dh" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#374151"/></marker></defs><g fill="#1f2937"><text x="210" y="34" text-anchor="middle" font-size="28" font-weight="700">An</text><text x="750" y="34" text-anchor="middle" font-size="28" font-weight="700">đường ai cũng nghe</text><text x="1290" y="34" text-anchor="middle" font-size="28" font-weight="700">Bình</text><rect x="470" y="50" width="560" height="370" rx="12" fill="#f3f4f6"/><rect x="40" y="60" width="340" height="60" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="4"/><text x="210" y="96" text-anchor="middle" font-size="24">bí mật a = 6</text><rect x="1120" y="60" width="340" height="60" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="4"/><text x="1290" y="96" text-anchor="middle" font-size="24">bí mật b = 15</text><text x="750" y="98" text-anchor="middle" font-size="24">p = 23, g = 5</text><line x1="380" y1="180" x2="1112" y2="180" stroke="#374151" stroke-width="3" marker-end="url(#dh)"/><text x="750" y="166" text-anchor="middle" font-size="24">An gửi A = 8</text><line x1="1120" y1="250" x2="388" y2="250" stroke="#374151" stroke-width="3" marker-end="url(#dh)"/><text x="750" y="236" text-anchor="middle" font-size="24">Bình gửi B = 19</text><rect x="490" y="300" width="520" height="100" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="4"/><text x="750" y="336" text-anchor="middle" font-size="24">người nghe lén thấy:</text><text x="750" y="368" text-anchor="middle" font-size="24">23, 5, 8, 19</text><rect x="40" y="300" width="340" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="4"/><text x="210" y="336" text-anchor="middle" font-size="24">khoá: 19 mũ 6</text><text x="210" y="368" text-anchor="middle" font-size="24">chia 23 dư 2</text><rect x="1120" y="300" width="340" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="4"/><text x="1290" y="336" text-anchor="middle" font-size="24">khoá: 8 mũ 15</text><text x="1290" y="368" text-anchor="middle" font-size="24">chia 23 dư 2</text></g></svg></div>
        say: "Trước khi tính, hãy nhìn cái gì đi trên đường và cái gì được giữ riêng. Ô đỏ hai bên là số bí mật, a bằng 6 của An và b bằng 15 của Bình, không bao giờ rời khỏi máy. Vùng xám ở giữa là đường ai cũng nghe, trên đó chỉ có p bằng 23, g bằng 5, và hai số được gửi đi, 8 và 19. Ô xanh lá ở dưới là khoá chung, mỗi bên tự tính ra 2 từ số bí mật của mình và số nhận được của bên kia. Người nghe lén có đủ bốn số 23, 5, 8 và 19, nhưng thiếu a và b, nên không làm được bước cuối."

  # ───────────────────────── 3. DIFFIE–HELLMAN ─────────────────────────
  - id: example
    kind: example
    title: "Diffie–Hellman với p = 23, g = 5"
    checks:
      - "pow(5, 6, 23) == 8 and 5 ** 6 == 15625 and 15625 - 679 * 23 == 8"
      - "pow(5, 15, 23) == 19"
      - "pow(19, 6, 23) == 2 == pow(8, 15, 23)"
    steps:
      - show: |
          <p><b>Bước 1 — An</b> (bí mật $a = 6$) tính số gửi đi, với $5^6 = 15625 = 679 \times 23 + 8$:</p>
          $$A = 5^6 \bmod 23 = \hl{8}$$
        focus: [1, 2, 2]
        say: "Chạy thử với số nhỏ, hai bên đã thống nhất công khai p bằng 23 và g bằng 5. Bước một, An chọn bí mật a bằng 6, rồi tính 5 mũ 6, bằng 15625, bằng 679 lần 23 cộng 8. Vậy A bằng 8, và An gửi số 8 đi."
      - show: |
          <p><b>Bước 2 — Bình</b> (bí mật $b = 15$) tính số gửi đi, nhân dần rồi lấy dư sau mỗi lần nhân:</p>
          $$B = 5^{15} \bmod 23 = \hl{19}$$
        focus: [1, 2]
        say: "Bước hai, Bình chọn bí mật b bằng 15. Năm mũ 15 là một số rất lớn, nên Bình nhân dần từng thừa số 5 và lấy dư sau mỗi lần nhân, kết quả là B bằng 19, và Bình gửi số 19 đi."
      - show: |
          <p><b>Bước 3 — An</b> lấy số nhận được 19, mũ số bí mật của mình:</p>
          $$19^6 \bmod 23 = \hl{2}$$
        focus: [1, 2]
        say: "Bước ba, An lấy số vừa nhận được là 19, rồi mũ 6, đúng số bí mật của mình. Chia lấy dư cho 23, An được 2."
      - show: |
          <p><b>Bước 4 — Bình</b> lấy số nhận được 8, mũ số bí mật của mình:</p>
          $$8^{15} \bmod 23 = \hl{2}$$
        focus: [1, 2]
        say: "Bước bốn, Bình lấy số vừa nhận được là 8, rồi mũ 15, đúng số bí mật của mình. Chia lấy dư cho 23, Bình cũng được 2, đó là khoá chung."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>An (bí mật $a = 6$)</th><th>công khai trên đường</th><th>Bình (bí mật $b = 15$)</th></tr>
          <tr><td>1</td><td colspan="3" style="text-align:center">thống nhất công khai $p = 23$, $g = 5$</td></tr>
          <tr><td>2</td><td>$A = 5^6 \bmod 23 = 8$</td><td>An gửi 8 cho Bình</td><td></td></tr>
          <tr><td>3</td><td></td><td>Bình gửi 19 cho An</td><td>$B = 5^{15} \bmod 23 = 19$</td></tr>
          <tr><td>4</td><td>$19^6 \bmod 23 = \hl{2}$</td><td></td><td>$8^{15} \bmod 23 = \hl{2}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.5"]
        say: "Gom cả bốn bước vào một bảng. Dòng đầu là hai số công khai, 23 và 5. Hai dòng giữa là hai số đi trên đường, 8 và 19. Dòng cuối là hai phép tính riêng của An và Bình, cả hai đều ra 2."
      - show: |
          <div class="box key">Vì sao trùng? $19^6 = (5^{15})^6 = 5^{90}$ và $8^{15} = (5^6)^{15} = 5^{90}$ — cùng một số, theo mod 23.</div>
          <p>Người nghe lén thấy 23, 5, 8, 19. Muốn ra 2 phải tìm $a$ từ $5^a \bmod 23 = 8$ — với $p$ dài 2048 bit, chưa ai biết cách làm nhanh.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Vì sao hai số trùng nhau? 19 mũ 6 bằng 5 mũ 15 rồi mũ 6, tức 5 mũ 90. Còn 8 mũ 15 bằng 5 mũ 6 rồi mũ 15, cũng là 5 mũ 90, nên cùng một số dư khi chia cho 23. Người nghe lén thấy 23, 5, 8 và 19. Muốn ra khoá, họ phải tìm a sao cho 5 mũ a chia 23 dư 8, mà với p dài 2048 bit thì chưa ai biết cách làm nhanh."

  # ───────────────────────── 4. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "5 ** 2 % 23 == 2 and 2 * 2 * 2 % 23 == 8 and pow(5, 6, 23) == 8"
      - "[pow(5, k, 23) for k in range(1, 7)] == [5, 2, 10, 4, 20, 8] and 2 * 5 == 10 and 50 % 23 == 4 and 4 * 5 == 20 and 100 % 23 == 8"
    steps:
      - show: |
          <ol><li><b>Tính bằng tay theo từng bước:</b> $5^2 = 25 \equiv 2$, nên $5^6 = (5^2)^3 \equiv 2^3 = 8$ — khớp.</li>
          <li><b>Hai bên phải ra cùng số</b>; khác nhau là đã tính sai một bước.</li>
          <li><b>Thứ đi trên đường</b> chỉ là $p$, $g$, $A$, $B$ — không bao giờ là $a$, $b$ hay khoá.</li></ol>
        introduces: [equiv_mod]
        focus: [0, "1.1", "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, tính bằng tay theo từng bước, 5 bình phương bằng 25, chia 23 dư 2, nên 5 mũ 6 bằng 2 mũ 3, tức 8, khớp với kết quả. Ký hiệu ba gạch nghĩa là cùng số dư khi chia cho 23. Hai, hai bên phải ra cùng một số, khác nhau là đã tính sai một bước. Ba, thứ đi trên đường chỉ là p, g, A và B, không bao giờ là a, b hay khoá."
      - clear: true
        show: |
          <p>Đường thứ hai: nhân thêm một thừa số 5 mỗi bước, rồi lấy dư ngay.</p>
          <table class="t"><tr><th>mũ</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
          <tr><td>phép tính</td><td>5</td><td>25</td><td>2 × 5 = 10</td><td>10 × 5 = 50</td><td>4 × 5 = 20</td><td>20 × 5 = 100</td></tr>
          <tr><td>số dư khi chia 23</td><td>5</td><td>2</td><td>10</td><td>4</td><td>20</td><td><b>8</b> ✓</td></tr></table>
        focus: [1, "2.3", "2.2", "2.2", "2.3"]
        say: "Giờ kiểm lại số 8 bằng một đường khác, không đi qua 15625, mà nhân thêm một thừa số 5 mỗi bước rồi lấy dư ngay. Năm bình phương bằng 25, dư 2. Lấy 2 nhân 5 được 10, rồi 10 nhân 5 được 50, dư 4. Tiếp theo 4 nhân 5 được 20, rồi 20 nhân 5 được 100, chia 23 dư 8. Ra đúng 8, và mọi phép tính đều chỉ là số nhỏ."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "f'{2 ** 128:.1e}' == '3.4e+38'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ Diffie–Hellman chống được mọi kẻ gian <b class="red">(sai)</b>
          <br><span class="note">Người <b>đứng giữa</b> chặn cả hai chiều, trao khoá riêng với An và riêng với Bình. Phải kèm <b>chữ ký</b> để biết 8 thật sự do An gửi.</span></div>
        say: "Lỗi thứ nhất, nghĩ Diffie–Hellman chống được mọi kẻ gian. Một người đứng giữa chặn cả hai chiều, trao khoá riêng với An và riêng với Bình, nên phải kèm chữ ký để biết số 8 thật sự do An gửi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng mã khoá công khai để mã hoá cả tệp lớn <b class="red">(chậm)</b>
          <br><span class="note">Thực tế: dùng khoá công khai hoặc trao đổi khoá để có <b>khoá đối xứng</b>, rồi mã hoá dữ liệu bằng mã đối xứng.</span></div>
        say: "Lỗi thứ hai, dùng mã khoá công khai để mã hoá cả tệp lớn, rất chậm. Thực tế, ta dùng khoá công khai hoặc trao đổi khoá để có một khoá đối xứng, rồi mã hoá dữ liệu bằng mã đối xứng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tưởng số nhỏ trong bài là an toàn <b class="red">(sai)</b>
          <br><span class="note">Với $p = 23$, thử 22 giá trị của $a$ là ra. An toàn cần $p$ cỡ 2048 bit; khoá đối xứng 128 bit có $2^{128} \approx 3{,}4 \times 10^{38}$ khả năng.</span></div>
          <table class="t"><tr><th>khoá</th><th>số khả năng phải thử</th></tr>
          <tr><td>$p = 23$ (bài này)</td><td>22</td></tr>
          <tr><td>khoá đối xứng 128 bit</td><td>$2^{128} \approx 3{,}4 \times 10^{38}$</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ ba, tưởng số nhỏ trong bài là an toàn. Với p bằng 23, thử 22 giá trị của a là ra, an toàn cần p cỡ 2048 bit, còn khoá đối xứng 128 bit có khoảng 3 phẩy 4 nhân 10 mũ 38 khả năng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tự chế thuật toán mã hoá <b class="red">(nguy hiểm)</b>
          <br><span class="note">Mật mã an toàn là thứ đã bị nhiều người tấn công công khai nhiều năm. Hãy dùng thư viện chuẩn, đừng tự viết.</span></div>
        say: "Lỗi thứ tư, tự chế thuật toán mã hoá, rất nguy hiểm. Mật mã an toàn là thứ đã bị nhiều người tấn công công khai trong nhiều năm, nên hãy dùng thư viện chuẩn, đừng tự viết."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.dh(23, 5, 4, 3) == (4, 10, 18, 18)"
      - "5 ** 4 == 625 and 625 % 23 == 4 and 125 % 23 == 10 and 10 ** 4 % 23 == 18 and 4 ** 3 % 23 == 18"
      - "27 * 23 + 4 == 625 and 5 * 23 + 10 == 125 and 10 ** 4 == 10000 and 434 * 23 + 18 == 10000 and 2 * 23 + 18 == 64"
    steps:
      - show: |
          <p>Vẫn $p = 23$, $g = 5$. An chọn $a = 4$, Bình chọn $b = 3$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mỗi người gửi số nào?</td></tr>
          <tr><td>2</td><td>Khoá chung là bao nhiêu? Kiểm cả hai phía.</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, vẫn với p bằng 23 và g bằng 5. An chọn a bằng 4, Bình chọn b bằng 3. Câu một, mỗi người gửi số nào? Câu hai, khoá chung là bao nhiêu? Hãy kiểm cả hai phía. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① An: $5^4 = 625$, $625 \bmod 23 = \hl{4}$. Bình: $5^3 = 125$, $125 \bmod 23 = \hl{10}$.</p>
          $$625 = 27 \times 23 + 4, \quad 125 = 5 \times 23 + 10$$
        focus: [1, 1, 2]
        say: "Đáp án câu một, An tính 5 mũ 4 bằng 625, chia 23 dư 4, nên gửi 4. Bình tính 5 mũ 3 bằng 125, chia 23 dư 10, nên gửi 10. Kiểm phép chia, 625 bằng 27 lần 23 cộng 4, và 125 bằng 5 lần 23 cộng 10."
      - show: |
          <p>② An: $10^4 = 10000$, $10000 \bmod 23 = \hl{18}$. Bình: $4^3 = 64$, $64 \bmod 23 = \hl{18}$. Trùng.</p>
          $$10000 = 434 \times 23 + 18, \quad 64 = 2 \times 23 + 18$$
        focus: [1, 1, 2]
        say: "Câu hai, An lấy số 10 nhận được, mũ 4, bằng 10000, chia 23 dư 18. Còn Bình lấy số 4 nhận được, mũ 3, bằng 64, chia 23 cũng dư 18, hai bên trùng nhau. Kiểm phép chia, 10000 bằng 434 lần 23 cộng 18, và 64 bằng 2 lần 23 cộng 18."

