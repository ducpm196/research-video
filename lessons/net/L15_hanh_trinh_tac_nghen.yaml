# Quy ước: “cửa sổ” = cửa sổ tắc nghẽn (số gói, hoặc số byte, bên gửi cho phép đang bay), như bài 11. “Vòng” = một thời gian khứ hồi.
#   Mọi sự kiện và con số có nguồn ghi trong audit/net/sources_L15.md; con số khác là phép tính lại (checks) hoặc ghi “số minh hoạ”.
#   Bài ACM Queue 2016 về BBR không tải được (403) → dùng [G17] và [B26] của cùng nhóm tác giả; không dạy số nào chỉ có ở bài Queue.
#   Lời đọc không nói tên người, không nói CUBIC, NewReno, RFC, IETF, IMP, Kbps: nói “thuật toán dựa trên mất gói phổ biến nhất”,
#   “bộ chuẩn của Internet”, “nghìn bit mỗi giây”. Probe p3 (audit/net/probes/p3_hanh_trinh.md): QUIC mọi cách ≤ 3/8, BBR thô 6/8 →
#   KHÔNG đọc, chỉ ghi trên màn hình; lời đọc nói “giao thức giao vận mới”, “thuật toán mới của Google”. Google thô 8/8; YouTube → “Diu-túp” 7/8.
#   Gói 1500 byte trong phép tính bộ đệm 1000 gói là GIẢ ĐỊNH (số minh hoạ).
objectives:
  - "Kể lại hành trình kiểm soát tắc nghẽn qua bốn chặng 1986, 1988, 2017, 2021–2026, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng: mức sụt thông lượng, số vòng khởi động chậm, tích băng thông–trễ, trễ do bộ đệm đầy, cửa sổ đầu"
  - "Chọn thực hành phù hợp với đường truyền của chính mình, kèm điều kiện để lựa chọn đó còn đúng"
