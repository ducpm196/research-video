scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tháng 10/1986: từ 32 nghìn bit mỗi giây còn 40"
    checks:
      - "32000 / 40 == 800"
      - "2021 - 1986 == 35"
    steps:
      - show: |
          <p>Tháng 10/1986, đường nối hai phòng thí nghiệm chỉ cách nhau vài trăm mét tụt thông lượng từ <b>32 000</b> xuống <b>40</b> bit mỗi giây — giảm $32\,000 / 40 = \hl{800}$ lần.</p>
          <p>35 năm sau, bộ chuẩn QUIC (2021) vẫn chọn hệ số <b>0,5</b> khi mất gói — đúng con số chọn năm 1988.</p>
          <div class="box key">Hôm nay: đi lại hành trình ấy qua bốn chặng. Ở mỗi chặng, quy mô làm lộ ra một điểm nghẽn — và chuyên gia đã xử lý ra sao.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, tháng 10 năm 1986, đường nối hai phòng thí nghiệm chỉ cách nhau vài trăm mét bỗng tụt thông lượng từ 32 nghìn xuống 40 bit mỗi giây. Lấy 32 nghìn chia 40, đó là giảm 800 lần. Ba mươi lăm năm sau, bộ chuẩn giao vận mới năm 2021 vẫn chọn hệ số 0 phẩy 5 khi mất gói, đúng con số được chọn năm 1988. Hôm nay ta đi lại hành trình ấy qua bốn chặng, xem mỗi chặng quy mô làm lộ ra điểm nghẽn nào, và chuyên gia đã xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "100e6 * 0.05 / 8 == 625000"
      - "[2 ** k for k in range(5)] == [1, 2, 4, 8, 16] and 20 // 2 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 2</td><td><b>tích băng thông–trễ</b>: lượng dữ liệu “đang bay” để lấp đầy đường</td><td>100 triệu bit/s nhân 50 ms = 625 000 byte</td></tr>
          <tr><td>bài 9</td><td>TCP: tin cậy, đúng thứ tự, có bắt tay; UDP: gửi rời từng gói, không bảo đảm</td><td>TCP mất 1 gói thì chờ gửi lại</td></tr>
          <tr><td>bài 11</td><td>khởi động chậm nhân đôi cửa sổ mỗi vòng; mất gói thì cửa sổ còn một nửa</td><td>1, 2, 4, 8, 16; mất ở 20 → 10</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 2, tích băng thông nhân trễ là lượng dữ liệu đang bay cần để lấp đầy đường, ví dụ 100 triệu bit mỗi giây nhân 50 mi li giây được 625 nghìn byte. Ở bài 9, TCP tin cậy và đúng thứ tự, còn UDP gửi rời từng gói, không bảo đảm gì. Ở bài 11, khởi động chậm nhân đôi cửa sổ mỗi vòng, 1, 2, 4, 8, 16, và khi mất gói ở 20 thì cửa sổ còn một nửa là 10."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>sụp đổ tắc nghẽn</b></td><td>mạng bận gửi lại gói cũ tới mức dữ liệu mới gần như không đi được</td></tr>
          <tr><td><b>bảo toàn gói</b></td><td>khi đã đầy, chỉ thả gói mới vào mạng khi một gói cũ đã ra</td></tr>
          <tr><td><b>dựa trên mất gói</b></td><td>coi việc mất gói là tín hiệu duy nhất để giảm tốc</td></tr>
          <tr><td><b>phình bộ đệm</b></td><td>bộ đệm quá sâu luôn bị lấp đầy, gói xếp hàng hàng giây</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Sụp đổ tắc nghẽn là khi mạng bận gửi lại gói cũ tới mức dữ liệu mới gần như không đi được. Bảo toàn gói nghĩa là khi đường đã đầy, chỉ thả gói mới vào mạng khi một gói cũ đã ra. Dựa trên mất gói là coi việc mất gói là tín hiệu duy nhất để giảm tốc. Phình bộ đệm là khi bộ đệm quá sâu luôn bị lấp đầy, và gói phải xếp hàng hàng giây."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
