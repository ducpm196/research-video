          <circle cx="210" cy="150" r="15" fill="#dc2626"/><text x="210" y="108" font-weight="bold">1986</text><text x="210" y="200">sụp đổ tắc nghẽn</text><text x="210" y="232">32 000 → 40 bit/s</text>
          <circle cx="630" cy="150" r="15" fill="#2a78d6"/><text x="630" y="108" font-weight="bold">1988</text><text x="630" y="200">khởi động chậm</text><text x="630" y="232">tăng cộng, giảm một nửa</text>
          <circle cx="1050" cy="150" r="15" fill="#7c3aed"/><text x="1050" y="108" font-weight="bold">2017</text><text x="1050" y="200">BBR: đo băng thông và trễ</text><text x="1050" y="232">không chờ mất gói</text>
          <circle cx="1470" cy="150" r="15" fill="#059669"/><text x="1470" y="108" font-weight="bold">2021 → 2026</text><text x="1470" y="200">QUIC trên UDP</text><text x="1470" y="232">thuật toán thay được</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → khủng hoảng → quy mô lớn, đường nhanh → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với bốn chặng. Năm 1986 là sụp đổ tắc nghẽn, năm 1988 có khởi động chậm cùng quy tắc tăng cộng giảm một nửa. Năm 2017, một thuật toán mới của Google đo băng thông và trễ thay vì chờ mất gói. Từ 2021 tới 2026, một giao thức giao vận mới chạy trên UDP và cho phép thay thuật toán."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 1986 — khủng hoảng: thông lượng giảm 800 lần"
    stage: {year: "1986", scale: "bộ định tuyến thường bỏ 10% gói đến vì tràn bộ đệm; đường 32 nghìn bit/s còn 40 bit/s", source: "[J88] mở đầu, hình 8", practice: "tìm nguyên nhân ở cách cài đặt giao thức; giữ bảo toàn gói: gói mới chỉ vào khi gói cũ ra"}
    checks:
      - "32000 / 40 == 800 and 40 * 800 == 32000"
      - "25 / 4 == 6.25 and 8 + 5 + 5 + 0.5 == 18.5 and 25 - 18.5 == 6.5"
      - "11000 - 4000 == 7000 and round(4000 / 7000, 2) == 0.57"
    steps:
      - show: |
          <p><b>Quy mô:</b> năm 1988, nhóm nghiên cứu ghi rằng bộ định tuyến thường bỏ <b>10%</b> số gói đến vì tràn bộ đệm.</p>
          <p><b>Điểm nghẽn:</b> nhóm thấy phần lớn nguyên nhân nằm ở <b>cách cài đặt</b> giao thức giao vận, không phải ở chính giao thức: bên gửi thả gói vào mạng trong khi gói cũ chưa ra.</p>
          <p><b>Cách xử lý:</b> nguyên tắc <b>bảo toàn gói</b> — khi đường đã đầy, gói mới chỉ vào khi một gói cũ đã ra; xác nhận trở về đóng vai một chiếc đồng hồ.</p>
        focus: [1, 2, 2, 3]
        say: "Ở chặng một, nhóm nghiên cứu ghi rằng bộ định tuyến thời đó thường bỏ 10 phần trăm số gói đến vì tràn bộ đệm. Điểm nghẽn, theo họ, phần lớn nằm ở cách cài đặt giao thức giao vận, không phải ở chính giao thức. Bên gửi thả gói mới vào mạng trong khi gói cũ còn chưa ra. Cách xử lý là nguyên tắc bảo toàn gói, khi đường đã đầy thì gói mới chỉ vào khi một gói cũ đã ra, và xác nhận trở về đóng vai một chiếc đồng hồ."
      - clear: true
        show: |
          <p><b>Đo lại cái sai, làm thử:</b> bốn kết nối TCP cũ, chưa tránh tắc nghẽn, chia một đường 25 nghìn byte mỗi giây (bài báo năm 1988, hình 8).</p>
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>mỗi kết nối lẽ ra được</td><td>$25 / 4$</td><td>$6{,}25$ ≈ 6 nghìn byte/s</td></tr>
          <tr><td>bốn kết nối thật sự nhận</td><td>$8 + 5 + 5 + 0{,}5$</td><td>$18{,}5$ nghìn byte/s</td></tr>
          <tr><td>phần biến mất</td><td>$25 - 18{,}5$</td><td>$\hl{6{,}5}$, nguồn ghi tròn là 6</td></tr>
          <tr><td>gói gửi lại trên gói mới</td><td>$4000 / (11\,000 - 4000)$</td><td>$\approx 0{,}57$: khoảng một nửa</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Đo lại cái sai bằng số. Bài báo năm 1988 cho bốn kết nối TCP cũ chia một đường 25 nghìn byte mỗi giây. Chia đều thì mỗi kết nối được 25 chia 4, khoảng 6 nghìn byte mỗi giây. Thật ra bốn kết nối nhận 8, 5, 5 và 0 phẩy 5, cộng lại chỉ 18 phẩy 5. Phần biến mất là 6 phẩy 5 nghìn byte mỗi giây, nguồn ghi tròn là 6. Trong 11 nghìn gói đã gửi có 4 nghìn gói gửi lại, chia cho 7 nghìn gói mới được khoảng 0 phẩy 57, tức khoảng một nửa."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 1988 — khai sinh quy tắc: khởi động chậm và tăng cộng, giảm nhân"
    stage: {year: "1988", scale: "TCP của hệ điều hành BSD thêm bảy thuật toán; đường 25 nghìn byte/s dùng chung", source: "[J88] §1, §3, phụ lục B", practice: "bắt đầu từ 1 gói rồi nhân đôi mỗi vòng; khi mất gói giảm còn một nửa, khi êm cộng 1 gói mỗi vòng; không tăng theo cấp số nhân khi đã ổn định"}
    checks:
      - "2 ** 4 == 16 and 4 * 100 == 400"
      - "16 // 2 == 8"
      - "round(16 / 7, 1) == 2.3"
    steps:
      - show: |
          <p><b>Cách xử lý của năm 1988:</b> thêm vào TCP một biến <b>cửa sổ tắc nghẽn</b> và ba quy tắc.</p>
          <table class="t"><tr><th>lúc</th><th>quy tắc</th><th>vì sao</th></tr>
          <tr><td>bắt đầu hoặc sau khi mất gói lúc hết giờ</td><td>cửa sổ = <b>1 gói</b>, mỗi xác nhận cộng 1 → nhân đôi mỗi vòng</td><td>khởi động chiếc đồng hồ xác nhận</td></tr>
          <tr><td>có tắc nghẽn (mất gói)</td><td>nhân cửa sổ với <b>0,5</b></td><td>hàng đợi tăng theo cấp số nhân, phải lùi ít nhất nhanh như vậy</td></tr>
          <tr><td>không tắc nghẽn</td><td>cộng <b>1 gói</b> mỗi vòng</td><td>tăng nhân đôi cho đều thì “dao động dữ dội”</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Cách xử lý của năm 1988 là thêm vào TCP một biến cửa sổ tắc nghẽn và ba quy tắc. Lúc bắt đầu, hoặc sau khi hết giờ chờ, cửa sổ là 1 gói, và mỗi xác nhận cộng 1, nên cửa sổ nhân đôi mỗi vòng. Khi có tắc nghẽn, cửa sổ nhân với 0 phẩy 5, vì hàng đợi tăng theo cấp số nhân nên phải lùi ít nhất nhanh như vậy. Khi không tắc nghẽn thì chỉ cộng 1 gói mỗi vòng, vì nhóm viết rằng tăng theo cấp số nhân sẽ làm mạng dao động dữ dội."
      - clear: true
        show: |
          <p><b>“Khởi động chậm” thật ra không chậm, làm thử</b> (vòng 100 ms là số minh hoạ):</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. số vòng để cửa sổ từ 1 lên 16 gói</td><td>nhân đôi 4 lần vì $2^4 = 16$</td><td>4 vòng</td></tr>
          <tr><td>2. thời gian nếu mỗi vòng 100 ms</td><td>$4 \times 100$</td><td>$\hlg{400}$ ms</td></tr>
          <tr><td>3. bộ đệm cần ở chỗ hẹp khi mở cửa sổ 16</td><td>một nửa cửa sổ: $16 / 2$</td><td>8 gói</td></tr>
          <tr><td>4. đo trên đường thật năm 1988</td><td>16 nghìn byte/s so với 7 khi không khởi động chậm</td><td>$16 / 7 \approx 2{,}3$ lần</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Làm thử để thấy khởi động chậm thật ra không chậm, với một số minh hoạ là mỗi vòng 100 mi li giây. Bước một, cửa sổ từ 1 lên 16 gói cần nhân đôi 4 lần, vì 2 mũ 4 bằng 16. Bước hai, 4 vòng nhân 100 là 400 mi li giây. Bước ba, nhóm ghi rằng mở cửa sổ 16 gói cần bộ đệm bằng một nửa, tức 8 gói, ở chỗ hẹp. Bước bốn, trên đường thật năm 1988 thông lượng đạt 16 nghìn byte mỗi giây, so với 7 khi không có khởi động chậm, gấp khoảng 2 phẩy 3 lần."

  # ───────────────────────── 7. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2017 — quy mô lớn: đường nhanh, bộ đệm nông và bộ đệm sâu"
    stage: {year: "2017", scale: "đường 10 tỉ bit/s, vòng 100 ms, mất 1% gói; đường vào nhà 10 triệu bit/s, vòng 40 ms, bộ đệm 1000 gói", source: "[G17] [B26] §1, §3", practice: "đo băng thông lớn nhất và thời gian khứ hồi nhỏ nhất; giữ lượng đang bay gần tích băng thông–trễ thay vì chờ mất gói"}
    checks:
      - "10e9 * 0.1 / 8 == 125e6"
      - "round(9100 / 3.3) == 2758 and round(100 * 3.3 / 10000, 3) == 0.033"
      - "10e6 * 0.04 / 8 == 50000 and round(50000 / 1500, 1) == 33.3"
      - "1000 * 1500 * 8 / 10e6 == 1.2 and 40 + 1200 == 1240 and round(1090 / 43, 1) == 25.3"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> theo nhóm làm BBR (năm 2017), cách dựa trên mất gói hợp với bộ đệm <b>nhỏ</b> của thập niên 1980, nhưng hỏng ở hai kiểu đường mới:</p>
          <table class="t"><tr><th>kiểu đường</th><th>chuyện xảy ra</th></tr>
          <tr><td><b>bộ đệm nông</b>, đường xa tốc độ cao</td><td>mất gói <b>trước</b> khi tắc thật, do cụm gói thoáng qua → giảm một nửa oan, thông lượng rất thấp</td></tr>
          <tr><td><b>bộ đệm sâu</b>, đường vào nhà</td><td>tắc <b>trước</b> khi mất gói → bộ đệm luôn đầy, xếp hàng hàng giây</td></tr></table>
          <p><b>Cách xử lý:</b> BBR đo <b>băng thông lớn nhất</b> và <b>thời gian khứ hồi nhỏ nhất</b> gần đây, rồi giữ lượng đang bay gần tích của hai số đó.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Ở chặng ba, nhóm làm thuật toán mới ở Google viết năm 2017 rằng cách dựa trên mất gói hợp với bộ đệm nhỏ của thập niên 1980, nhưng hỏng ở hai kiểu đường mới. Với bộ đệm nông trên đường xa tốc độ cao, gói mất trước khi tắc thật, nên bên gửi giảm một nửa oan. Với bộ đệm sâu ở đường vào nhà, mạng tắc trước khi mất gói, nên bộ đệm luôn đầy và gói xếp hàng hàng giây. Thuật toán mới đo băng thông lớn nhất và thời gian khứ hồi nhỏ nhất gần đây, rồi giữ lượng đang bay gần tích của hai số đó."
      - clear: true
        show: |
          <p><b>Bộ đệm nông, làm thử:</b> đường 10 tỉ bit/s, vòng 100 ms, mất 1% gói (thử nghiệm của nhóm).</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. tích băng thông–trễ</td><td>$10^{10} \times 0{,}1 / 8$</td><td>125 000 000 byte = 125 MB đang bay</td></tr>
          <tr><td>2. thuật toán dựa trên mất gói phổ biến nhất (CUBIC)</td><td>3,3 triệu bit/s trên 10 000 triệu</td><td>chỉ dùng $0{,}033\%$ đường</td></tr>
          <tr><td>3. BBR đạt hơn 9100 triệu bit/s</td><td>$9100 / 3{,}3$</td><td>$\approx \hlg{2758}$, nguồn ghi tròn “2700 lần”</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Làm thử với bộ đệm nông, thử nghiệm của nhóm là đường 10 tỉ bit mỗi giây, vòng 100 mi li giây, mất 1 phần trăm gói. Bước một, tích băng thông nhân trễ là 10 mũ 10 nhân 0 phẩy 1 chia 8, bằng 125 triệu byte phải đang bay. Bước hai, thuật toán dựa trên mất gói phổ biến nhất chỉ đạt 3 phẩy 3 triệu bit mỗi giây, tức 0 phẩy 033 phần trăm đường. Bước ba, thuật toán mới đạt hơn 9100 triệu, chia cho 3 phẩy 3 được khoảng 2758 lần, nguồn ghi tròn là 2700 lần."
      - clear: true
        show: |
          <div><svg width="1500" height="250" viewBox="0 0 1500 250">
          <g font-size="24" fill="#1f2937">
          <rect x="60" y="60" width="60" height="70" fill="#2a78d6"/><text x="90" y="170" text-anchor="middle">33 gói</text><text x="90" y="205" text-anchor="middle">lấp đầy đường</text>
          <rect x="300" y="60" width="1140" height="70" fill="#fca5a5"/><text x="870" y="105" text-anchor="middle">1000 gói xếp hàng trong bộ đệm ≈ thêm 1,2 giây</text>
          <text x="870" y="170" text-anchor="middle">bộ đệm sâu: thuật toán dựa trên mất gói lấp đầy hết rồi mới giảm</text>
          </g></svg></div>
          <table class="t"><tr><th>bước (gói 1500 byte là số minh hoạ)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>4. tích băng thông–trễ đường vào nhà</td><td>$10^7 \times 0{,}04 / 8$</td><td>50 000 byte ≈ 33 gói</td></tr>
          <tr><td>5. thời gian xả bộ đệm 1000 gói đầy</td><td>$1000 \times 1500 \times 8 / 10^7$</td><td>1,2 s → vòng có thể tới $40 + 1200 = 1240$ ms</td></tr>
          <tr><td>6. nhóm đo trung vị: 1090 ms so với 43 ms</td><td>$1090 / 43$</td><td>$\approx \hlg{25}$ lần thấp hơn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Hình cho thấy bộ đệm sâu, chỉ cần khoảng 33 gói để lấp đầy đường, nhưng bộ đệm chứa tới 1000 gói. Bước bốn, đường vào nhà 10 triệu bit mỗi giây, vòng 40 mi li giây, có tích là 50 nghìn byte, khoảng 33 gói nếu mỗi gói 1500 byte, một số minh hoạ. Bước năm, xả 1000 gói đầy mất 1 phẩy 2 giây, nên một vòng có thể dài tới 1240 mi li giây. Bước sáu, nhóm đo trung vị 1090 mi li giây so với 43 mi li giây của thuật toán mới, thấp hơn khoảng 25 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>trên người dùng thật (dịch vụ video YouTube, so với thuật toán cũ)</th><th>kết quả</th></tr>
          <tr><td>thông lượng</td><td>cao hơn <b>4%</b> trung bình toàn cầu</td></tr>
          <tr><td>thời gian khứ hồi</td><td>giảm <b>33%</b></td></tr></table>
          <p class="note">Nhóm tự ghi: các thử nghiệm tổng hợp cho thấy <b>bản chất</b> của lợi ích, “không nhất thiết là độ lớn điển hình”.</p>
        focus: [1, 1, 2]
        say: "Trên người dùng thật của dịch vụ video YouTube, con số khiêm tốn hơn nhiều. Thông lượng cao hơn 4 phần trăm trung bình toàn cầu, và thời gian khứ hồi giảm 33 phần trăm. Chính nhóm ghi rằng thử nghiệm tổng hợp chỉ cho thấy bản chất của lợi ích, không nhất thiết là độ lớn điển hình."

  # ───────────────────────── 8. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2021 tới 2026 — ổn định và tiếp tục phát triển: QUIC"
    stage: {year: "2021 → 2026", scale: "bộ chuẩn QUIC 5/2021 chạy trên UDP; bản đặc tả BBR 7/2026 vẫn ở mức thử nghiệm", source: "[Q21] RFC 9000 §1, RFC 9002 §4.2, §7, §7.2, B.1; [B26]", practice: "giữ bộ điều khiển mẫu đã kiểm chứng (giảm 0,5, cộng 1 gói mỗi cửa sổ); cho thay thuật toán nhưng bắt theo hướng dẫn chung; số gói không bao giờ dùng lại; thuật toán mới đi qua giai đoạn thử nghiệm"}
    checks:
      - "20 * 0.5 == 10"
      - "10 * 1200 == 12000 and min(10 * 1200, max(14720, 2 * 1200)) == 12000 and 10 * 1472 == 14720"
      - "350 - 0 == 350 and 350 - 300 == 50"
    steps:
      - show: |
          <table class="t"><tr><th>QUIC (2021)</th><th>bài học cho quy mô Internet</th></tr>
          <tr><td>chạy trên <b>UDP</b> “để dễ triển khai trên hệ thống và mạng sẵn có”</td><td>thay đổi được mà không phải đợi mọi thiết bị giữa đường</td></tr>
          <tr><td>bộ điều khiển mẫu: tăng cộng, giảm nhân, hệ số giảm <b>0,5</b></td><td>giữ lại con số đã đúng từ 1988: mất ở 20 → 10</td></tr>
          <tr><td>bên gửi <b>được chọn thuật toán khác</b>, nhưng phải theo hướng dẫn chung</td><td>đổi mới không được phá công bằng của mạng chung</td></tr>
          <tr><td>BBR năm 2026 vẫn là bản đặc tả <b>thử nghiệm</b></td><td>thuật toán mới phải qua thử nghiệm trước khi thành chuẩn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Chặng bốn là ổn định và tiếp tục phát triển. Giao thức giao vận mới năm 2021 chạy trên UDP để dễ triển khai trên hệ thống và mạng sẵn có, nên thay đổi được mà không phải đợi mọi thiết bị giữa đường. Bộ điều khiển mẫu vẫn là tăng cộng giảm nhân với hệ số 0 phẩy 5, mất ở 20 thì còn 10. Bên gửi được chọn thuật toán khác, nhưng phải theo hướng dẫn chung của mạng. Còn thuật toán mới của Google, tới năm 2026 vẫn là một bản đặc tả ở mức thử nghiệm."
      - clear: true
        show: |
          <p><b>Cửa sổ đầu của QUIC, làm thử:</b> 10 lần kích thước gói lớn nhất, nhưng không quá số lớn hơn trong hai số: 14 720 byte và 2 lần kích thước gói.</p>
          <table class="t"><tr><th>kích thước gói</th><th>10 lần</th><th>giới hạn</th><th>cửa sổ đầu</th></tr>
          <tr><td>1200 byte</td><td>$10 \times 1200 = 12\,000$</td><td>số lớn hơn của 14 720 và 2400 là 14 720</td><td>$\hlg{12\,000}$ byte</td></tr>
          <tr><td>1472 byte</td><td>$10 \times 1472 = 14\,720$</td><td>14 720</td><td>14 720 byte</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Làm thử cửa sổ đầu của giao thức mới. Bộ chuẩn khuyên dùng 10 lần kích thước gói lớn nhất, nhưng không vượt số lớn hơn trong hai số, 14 nghìn 720 byte và 2 lần kích thước gói. Với gói 1200 byte, 10 lần là 12 nghìn, còn giới hạn là 14 nghìn 720, nên cửa sổ đầu là 12 nghìn byte. Với gói 1472 byte, 10 lần vừa đúng 14 nghìn 720."
      - clear: true
        show: |
          <p><b>Vì sao số gói không dùng lại</b> (số minh hoạ): gửi lúc 0 ms, hết giờ, gửi lại lúc 300 ms, xác nhận về lúc 350 ms.</p>
          <table class="t"><tr><th></th><th>TCP: gửi lại cùng số thứ tự</th><th>QUIC: gửi lại bằng gói số mới</th></tr>
          <tr><td>xác nhận này cho lần gửi nào?</td><td>không biết: 350 ms hay 50 ms?</td><td>biết: xác nhận gói mới</td></tr>
          <tr><td>thời gian khứ hồi đo được</td><td>có thể sai gấp 7 lần</td><td>$350 - 300 = \hlg{50}$ ms</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Vì sao giao thức mới không bao giờ dùng lại số gói? Lấy số minh hoạ, gửi lúc 0, hết giờ chờ, gửi lại lúc 300 mi li giây, và xác nhận về lúc 350. TCP gửi lại cùng số thứ tự, nên không biết xác nhận này cho lần gửi nào, thời gian khứ hồi là 350 hay 50. Giao thức mới gửi lại bằng một gói mang số mới, nên biết ngay thời gian khứ hồi là 350 trừ 300, bằng 50 mi li giây."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm ba con số của hành trình bằng đường khác"
    checks:
      - "40 * 800 == 32000"
      - "10e9 / 8 == 1.25e9 and 1.25e9 * 0.1 == 125e6"
      - "1500 * 8 / 10e6 == 0.0012 and round(1000 * 0.0012, 6) == 1.2"
      - "350 / 50 == 7"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>giảm 800 lần</td><td>nhân ngược: $40 \times 800 = 32\,000$ ✓</td></tr>
          <tr><td>125 MB đang bay</td><td>đổi trước ra byte: 10 tỉ bit/s = 1,25 tỉ byte/s; nhân 0,1 s = 125 triệu byte ✓</td></tr>
          <tr><td>1,2 s xếp hàng</td><td>một gói 1500 byte qua đường 10 triệu bit/s mất 1,2 ms; 1000 gói mất 1,2 s ✓</td></tr>
          <tr><td>sai gấp 7 lần</td><td>$350 / 50 = 7$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Nhân ngược, 40 nhân 800 bằng 32 nghìn, khớp. Với 125 triệu byte, đổi trước tốc độ ra byte, 10 tỉ bit mỗi giây là 1 phẩy 25 tỉ byte, nhân 0 phẩy 1 giây được 125 triệu byte. Với bộ đệm, một gói 1500 byte qua đường 10 triệu bit mỗi giây mất 1 phẩy 2 mi li giây, nên 1000 gói mất 1 phẩy 2 giây. Cuối cùng, 350 chia 50 bằng 7, nên TCP có thể đo sai gấp 7 lần."

  # ───────────────────────── 10. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "1000 * 1500 > 33 * 1500 and round(9100 / 3.3) > 100 * 4"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Mạng chậm là do giao thức tồi, đổ cho người viết nó”</td><td>năm 1988 nhóm tìm ra phần lớn nguyên nhân ở <b>cách cài đặt</b>, và sửa bằng quy tắc, không đổ lỗi</td><td>đo trước, tìm chỗ phá bảo toàn gói</td></tr>
          <tr><td><b class="red">2.</b> “Thêm bộ đệm thật to cho chắc không mất gói”</td><td>bộ đệm 1000 gói khi đường chỉ cần 33 gói thêm tới 1,2 giây trễ</td><td>bộ đệm cỡ tích băng thông–trễ; đo trễ khi đường đầy tải</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ mạng chậm do giao thức tồi, rồi đổ cho người viết nó. Năm 1988, nhóm nghiên cứu tìm ra phần lớn nguyên nhân ở cách cài đặt, và sửa bằng quy tắc, không đổ lỗi. Bài học sai thứ hai là thêm bộ đệm thật to cho chắc không mất gói. Bộ đệm 1000 gói khi đường chỉ cần 33 gói đã thêm tới 1 phẩy 2 giây trễ."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Đổi thuật toán là nhanh gấp 2700 lần”</td><td>đó là thử nghiệm tổng hợp, mất 1% gói; trên người dùng thật chỉ cao hơn 4%</td><td>thử trên chính người dùng của mình, so trước và sau</td></tr>
          <tr><td><b class="red">4.</b> Tự viết thuật toán gửi thật mạnh cho ứng dụng của mình</td><td>năm 1988, một kết nối chỉ còn 0,5 nghìn byte/s trong khi kết nối khác được 8; QUIC bắt mọi thuật toán theo hướng dẫn chung</td><td>dùng bộ điều khiển đã kiểm chứng; đổi thì qua thử nghiệm</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ đổi thuật toán thì nhanh gấp 2700 lần. Đó là thử nghiệm tổng hợp với 1 phần trăm gói mất, còn trên người dùng thật chỉ cao hơn 4 phần trăm. Bài học sai thứ tư là tự viết một thuật toán gửi thật mạnh cho riêng ứng dụng của mình. Năm 1988, khi không có quy tắc chung, một kết nối chỉ còn 0 phẩy 5 nghìn byte mỗi giây trong khi kết nối khác được 8. Vì thế giao thức mới bắt mọi thuật toán phải theo hướng dẫn chung."

  # ───────────────────────── 11. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "10 * 1200 == 12000 and 12000 + 24000 >= 20000 and 12000 < 20000"
      - "20000 - 12000 == 8000 and 2 * 80 - 80 == 80"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Ứng dụng di động gửi phản hồi đầu tiên <b>20 000 byte</b> qua QUIC, gói 1200 byte, mỗi vòng 80 ms. Có nên cắt phản hồi đầu xuống 12 000 byte?</td></tr>
          <tr><td>2</td><td>Máy chủ video nhỏ của bạn: người xem than giật, đo thấy trễ vọt lên hàng giây khi tải nặng. Đổi sang thuật toán dựa trên mô hình, hay giữ nguyên?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với các số minh hoạ. Câu một, ứng dụng di động gửi phản hồi đầu tiên 20 nghìn byte qua giao thức mới, gói 1200 byte, mỗi vòng 80 mi li giây. Có nên cắt phản hồi đầu xuống 12 nghìn byte không? Câu hai, máy chủ video nhỏ của bạn bị người xem than giật, và trễ vọt lên hàng giây khi tải nặng. Bạn đổi sang thuật toán dựa trên mô hình, hay giữ nguyên? Dừng video và viết ra giấy."
        pause: 20
      - show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>giữ 20 000 byte</td><td>đủ dữ liệu ngay</td><td>cửa sổ đầu 12 000 byte, còn $20\,000 - 12\,000 = 8000$ byte chờ thêm <b>1 vòng = 80 ms</b></td></tr>
          <tr><td>cắt xuống 12 000 byte</td><td>xong trong 1 vòng</td><td>phải tách phản hồi, gửi phần sau khi cần</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: nếu phần lớn người dùng ở gần, vòng chỉ vài mi li giây, thì 1 vòng thêm không đáng công tách.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một. Giữ 20 nghìn byte thì đủ dữ liệu ngay, nhưng cửa sổ đầu chỉ 12 nghìn byte, còn 8 nghìn byte phải chờ thêm 1 vòng, tức 80 mi li giây. Cắt xuống 12 nghìn byte thì xong trong 1 vòng, đổi lại phải tách phản hồi và gửi phần sau khi cần. Nếu phần lớn người dùng ở gần, mỗi vòng chỉ vài mi li giây, thì 1 vòng thêm không đáng công tách."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>đổi sang thuật toán dựa trên mô hình</td><td>nếu đúng là phình bộ đệm, trễ có thể giảm mạnh như ví dụ 1090 → 43 ms</td><td>phải đo lại; trên người dùng thật lợi ích thường nhỏ hơn thử nghiệm</td></tr>
          <tr><td>giữ nguyên</td><td>không rủi ro mới</td><td>trễ hàng giây vẫn còn</td></tr></table>
          <p class="note">Bước đầu tiên: đo trễ khi đường rảnh và khi đầy tải. Chỉ đổi khi trễ tăng vọt lúc đầy tải, dấu hiệu của bộ đệm sâu; nếu mất gói nhiều mà trễ không tăng, vấn đề nằm chỗ khác.</p>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Đổi sang thuật toán dựa trên mô hình có thể giảm trễ mạnh nếu đúng là phình bộ đệm, như ví dụ 1090 xuống 43 mi li giây. Đổi lại bạn phải đo lại, vì trên người dùng thật lợi ích thường nhỏ hơn thử nghiệm. Giữ nguyên thì không có rủi ro mới, nhưng trễ hàng giây vẫn còn. Bước đầu tiên là đo trễ khi đường rảnh và khi đầy tải, rồi chỉ đổi khi trễ tăng vọt lúc đầy tải."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">1986: giảm 800 lần, phá bảo toàn gói</span><span class="a">→</span>
          <span class="n">1988: khởi động chậm, giảm một nửa, cộng 1</span><span class="a">→</span>
          <span class="n">2017: đo băng thông và trễ, giữ gần tích của chúng</span><span class="a">→</span>
          <span class="n">2021–2026: QUIC giữ 0,5, cho thay thuật toán theo luật chung</span></div>
        say: "Tổng kết lại hành trình. Năm 1986, thông lượng giảm 800 lần vì bên gửi phá nguyên tắc bảo toàn gói. Năm 1988, khởi động chậm, giảm một nửa và cộng 1 gói mỗi vòng đưa mạng trở lại ổn định. Năm 2017, khi đường nhanh hơn và bộ đệm khác đi, thuật toán mới của Google đo băng thông và trễ rồi giữ lượng đang bay gần tích của chúng. Từ 2021, giao thức giao vận mới giữ hệ số 0 phẩy 5 nhưng cho thay thuật toán theo luật chung."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi quy tắc đúng với <b>một kiểu đường</b> và <b>một cỡ bộ đệm</b>. Trước khi chép, hãy đo: tích băng thông–trễ của đường mình là bao nhiêu, và trễ tăng bao nhiêu khi đầy tải?</div>
        say: "Điều cần mang theo, mỗi quy tắc đúng với một kiểu đường và một cỡ bộ đệm. Trước khi chép, hãy đo tích băng thông nhân trễ của đường mình là bao nhiêu, và trễ tăng bao nhiêu khi đường đầy tải."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá NET. Bạn đã đi từ một bit trên dây tới cách rất nhiều kết nối cùng chia một mạng mà không làm nó sụp đổ.</p>
        say: "Đây là bài cuối của khoá mạng máy tính. Bạn đã đi từ một bit trên dây tới cách rất nhiều kết nối cùng chia một mạng mà không làm nó sụp đổ. Cảm ơn bạn đã theo học."
