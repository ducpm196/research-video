rcle cx="80" cy="358" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="134" cy="345" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="188" cy="320" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="242" cy="270" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="295" cy="170" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="349" cy="158" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="403" cy="145" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="457" cy="132" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="511" cy="120" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="565" cy="358" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="618" cy="345" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="672" cy="320" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="726" cy="270" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><circle cx="780" cy="245" r="5" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/><text x="792" y="252" font-size="22" font-weight="700" fill="#1f2937">Tahoe</text><text x="511" y="104" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="700" stroke="#fffbeb" stroke-width="6" paint-order="stroke">mất gói</text><line x1="80" y1="22" x2="120" y2="22" stroke="#2a78d6" stroke-width="3"/><text x="130" y="29" font-size="20" fill="#1f2937">Reno</text><line x1="280" y1="22" x2="320" y2="22" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 7"/><text x="330" y="29" font-size="20" fill="#1f2937">Tahoe</text></svg></div>
          <ul><li>Vòng 8, cửa sổ 20: thấy ba xác nhận trùng → ngưỡng mới $= 20 / 2 = 10$.</li>
          <li>Đường liền: cửa sổ về đúng 10 rồi tăng cộng 11, 12, … — <b>giảm nhân, tăng cộng</b>.</li>
          <li>Đường đứt: cửa sổ về 1, khởi động chậm lại 1, 2, 4, 8, 10, rồi mới tăng cộng.</li></ul>
        focus: [1, "2.1", "2.2", "2.3"]
        say: "Biểu đồ có hai đường. Ở vòng 8, cửa sổ đang là 20 thì bên gửi thấy ba xác nhận trùng, nên đặt ngưỡng mới bằng 20 chia 2, là 10. Ở đường liền, cửa sổ về đúng 10 rồi tăng cộng 11, 12, đó là giảm nhân và tăng cộng. Ở đường đứt, cửa sổ về hẳn 1, khởi động chậm lại 1, 2, 4, 8, rồi 10, sau đó mới tăng cộng."
      - clear: true
        show: |
          <p><b>Bước 1 — vì sao mất ở vòng 8:</b> đếm lại từng giai đoạn.</p>
          <table class="t"><tr><th>giai đoạn</th><th>vòng</th><th>cửa sổ</th><th>phép</th></tr>
          <tr><td>khởi động chậm</td><td>0 tới 4</td><td>1, 2, 4, 8, 16</td><td>4 lần nhân đôi: $2^4 = 16$</td></tr>
          <tr><td>tăng cộng</td><td>5 tới 8</td><td>17, 18, 19, 20</td><td>4 lần cộng 1: $16 + 4 = 20$</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ ta đi lại ví dụ từng bước một. Bước một, khởi động chậm chạy từ vòng 0 tới vòng 4, nhân đôi 4 lần từ 1 lên 16, đúng bằng ngưỡng. Từ vòng 5 tới vòng 8, cửa sổ cộng 1 mỗi vòng, 4 lần, từ 16 lên 20. Vậy cửa sổ đạt 20 đúng ở vòng 8, chỗ mạng báo mất gói."
      - show: |
          <p><b>Bước 2 — đường liền mất bao lâu để lấy lại 20:</b> vòng 9 có cửa sổ 10, mỗi vòng cộng 1.</p>
          $$9 + (20 - 10) = \hl{19}$$
        focus: [1, 1, 2]
        say: "Bước hai, hỏi đường liền mất bao lâu để lấy lại mức 20. Ở vòng 9 cửa sổ là 10, và từ đây mỗi vòng chỉ cộng 1. Cần thêm 20 trừ 10, bằng 10 vòng, nên phải tới vòng 19 cửa sổ mới lại bằng 20."
      - clear: true
        show: |
          <p><b>Bước 3 — năm vòng ngay sau khi mất gói</b> (vòng 9 tới 13):</p>
          <table class="t"><tr><th>vòng</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>tổng số gói</th></tr>
          <tr><td>đường liền</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>$\hl{60}$</td></tr>
          <tr><td>đường đứt</td><td>1</td><td>2</td><td>4</td><td>8</td><td>10</td><td>$\hl{25}$</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bước ba, so hai đường trong năm vòng ngay sau khi mất gói, từ vòng 9 tới vòng 13. Đường liền đi 10, 11, 12, 13, 14, cộng lại được 60 gói. Đường đứt đi 1, 2, 4, 8, rồi chỉ lên 10 thay vì 16 vì chạm ngưỡng mới, cộng lại chỉ 25 gói. Mỗi số trong bảng là cửa sổ của một vòng, tức số gói được gửi trong một lượt đi về."
      - show: |
          <p><b>Bước 4 — chênh lệch:</b></p>
          $$60 - 25 = \hl{35} \text{ gói}$$
          <p>Đường đứt gửi ít hơn quá nửa trong năm vòng đó — vì thế bản đường liền giữ cửa sổ ở nửa thay vì về 1.</p>
          <p>Riêng khi <b>hết giờ chờ</b>, cả hai bản đều đưa cửa sổ về 1 rồi khởi động chậm lại; chỉ ba xác nhận trùng mới giảm một nửa.</p>
        focus: [2, 3, 3, 4]
        say: "Bước bốn, lấy 60 trừ 25, đường đứt gửi ít hơn 35 gói chỉ trong năm vòng. Con số 35 lớn hơn một nửa của 60, nghĩa là đường đứt mất quá nửa lượng dữ liệu của giai đoạn này. Đó là lý do bản đường liền chỉ giảm cửa sổ xuống một nửa khi thấy ba xác nhận trùng, thay vì về hẳn 1. Riêng khi hết giờ chờ, cả hai đường đều đưa cửa sổ về 1 rồi khởi động chậm lại, chỉ ba xác nhận trùng mới giảm một nửa."
      - clear: true
        show: |
          <div class="box key">Lâu dài, cửa sổ tạo thành hình <b>răng cưa</b>: leo dần lên tới khi mạng báo nghẽn, rồi tụt một nửa.</div>
        say: "Về lâu dài, cửa sổ tạo thành hình răng cưa, leo dần lên cho tới khi mạng báo nghẽn, rồi tụt xuống một nửa."

  # ───────────────────────── 5. VÌ SAO AIMD ─────────────────────────
  - id: why
    kind: concept
    title: "Vì sao tăng cộng, giảm nhân"
    steps:
      - show: |
          <ul><li><b>Giảm mạnh</b> khi nghẽn: nghẽn thì gói rơi hàng loạt, phải rút nhanh để hàng đợi kịp thoát.</li>
          <li><b>Tăng chậm</b> khi êm: dò dần phần dư, không gây nghẽn đột ngột.</li>
          <li>Hai luồng chia chung một đường, <b>cùng thời gian đi về</b>, cùng làm như vậy, sẽ dần tiến tới <b>chia đều</b> băng thông: mỗi lần nghẽn, luồng lớn mất nhiều hơn luồng nhỏ.</li>
          <li>Luồng có thời gian đi về ngắn hơn tăng nhanh hơn, nên thường chiếm phần lớn hơn.</li></ul>
        focus: ["1.1", "1.2", "1.3", "1.3", "1.4"]
        say: "Vì sao lại tăng cộng, giảm nhân? Khi nghẽn, gói rơi hàng loạt, nên phải rút mạnh để hàng đợi kịp thoát. Khi êm, tăng chậm để dò dần phần dư, không gây nghẽn đột ngột. Hai luồng dùng chung một đường, có cùng thời gian đi về, mà cùng làm như vậy sẽ dần chia đều băng thông, vì mỗi lần nghẽn, luồng lớn mất nhiều hơn luồng nhỏ. Luồng có thời gian đi về ngắn hơn thì tăng nhanh hơn, nên thường chiếm phần lớn hơn."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "5 * (10 + 14) / 2 == 60 and (16 - 1) + 10 == 25"
    steps:
      - show: |
          <ol><li><b>Dưới ngưỡng</b> mỗi bước gấp đôi; <b>từ ngưỡng</b> mỗi bước cộng 1 — kiểm từng cặp số liên tiếp.</li>
          <li><b>Khi mất gói:</b> ngưỡng mới bằng nửa cửa sổ <b>lúc mất</b>, không phải nửa ngưỡng cũ.</li>
          <li><b>Hai đường</b> trùng nhau cho tới vòng mất gói, rồi mới tách ra.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, dưới ngưỡng mỗi bước gấp đôi, từ ngưỡng trở lên mỗi bước cộng 1, hãy kiểm từng cặp số liên tiếp. Hai, khi mất gói, ngưỡng mới bằng nửa cửa sổ lúc mất, không phải nửa ngưỡng cũ. Ba, hai đường trùng nhau cho tới vòng mất gói, rồi mới tách ra."
      - clear: true
        show: |
          <table class="t"><tr><th>tổng ở bước 3</th><th>cộng thẳng</th><th>cách nhanh (đường khác)</th></tr>
          <tr><td>đường liền</td><td>60</td><td>$5 \times (10 + 14) / 2 = 60$ ✓</td></tr>
          <tr><td>đường đứt</td><td>25</td><td>$(16 - 1) + 10 = 25$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Kiểm hai tổng ở bước ba bằng một đường khác, dùng hai cách cộng nhanh vừa ôn. Đường liền là dãy tăng đều 5 số từ 10 tới 14, nên tổng bằng 5 nhân 24 chia 2, đúng 60. Đường đứt là dãy nhân đôi 1, 2, 4, 8, có tổng 16 trừ 1 bằng 15, cộng thêm vòng cuối 10, được 25, khớp với phép cộng thẳng."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "20 // 2 == 10 and 16 // 2 == 8"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ “khởi động chậm” là tăng chậm <b class="red">(sai)</b>
          <br><span class="note">Nó nhân đôi mỗi vòng — tăng theo hàm mũ. “Chậm” là so với gửi cả cửa sổ ngay.</span></div>
        say: "Lỗi thứ nhất, nghĩ khởi động chậm là tăng chậm. Nó nhân đôi mỗi vòng, tức tăng theo hàm mũ, chữ chậm chỉ là so với việc gửi cả cửa sổ ngay lập tức."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lẫn cửa sổ tắc nghẽn với cửa sổ của bên nhận <b class="red">(sai)</b>
          <br><span class="note">Bên nhận báo nó còn chứa được bao nhiêu; mạng giới hạn qua cửa sổ tắc nghẽn. Bên gửi dùng số <b>nhỏ hơn</b> trong hai số.</span></div>
        say: "Lỗi thứ hai, lẫn cửa sổ tắc nghẽn với cửa sổ của bên nhận. Bên nhận báo nó còn chứa được bao nhiêu, còn mạng giới hạn qua cửa sổ tắc nghẽn, và bên gửi dùng số nhỏ hơn trong hai số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi mọi gói mất đều do nghẽn <b class="red">(không luôn đúng)</b>
          <br><span class="note">Trên sóng không dây, gói có thể mất vì nhiễu. TCP vẫn giảm cửa sổ, nên chạy chậm hơn mức đường truyền cho phép.</span></div>
        say: "Lỗi thứ ba, coi mọi gói mất đều do nghẽn. Trên sóng không dây, gói có thể mất vì nhiễu, mà TCP vẫn giảm cửa sổ, nên chạy chậm hơn mức đường truyền cho phép."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tính ngưỡng mới bằng nửa ngưỡng cũ <b class="red">(sai)</b>
          <br><span class="note">Ngưỡng mới = nửa <b>cửa sổ lúc mất gói</b>: mất ở 20 thì ngưỡng mới là 10, không phải 8.</span></div>
          <table class="t"><tr><th>cửa sổ lúc mất</th><th>ngưỡng cũ</th><th>đúng: 20 / 2</th><th>sai: 16 / 2</th></tr>
          <tr><td>20</td><td>16</td><td><b>10</b></td><td class="red">8</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ tư, tính ngưỡng mới bằng nửa ngưỡng cũ. Ngưỡng mới bằng nửa cửa sổ lúc mất gói, mất ở 20 thì ngưỡng mới là 10, không phải 8."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.cwnd_trace(10, 8, loss_at=(7,)) == [1, 2, 4, 8, 9, 10, 11, 12, 6, 7]"
      - "2 ** 3 == 8 and 8 + 4 == 12 and 12 // 2 == 6 and len(alg.cwnd_trace(10, 8, loss_at=(7,))) == 10"
    steps:
      - show: |
          <p>Ngưỡng ban đầu là 8. Ở vòng 7 (cửa sổ đang 12), thấy ba xác nhận trùng; dùng cách “đường liền”.</p>
          <p>Viết cửa sổ của các vòng 0 tới 9.</p>
        focus: [0, 1, 1, 2, 0]
        say: "Bây giờ đến lượt bạn tự làm. Ngưỡng ban đầu là 8. Ở vòng 7, khi cửa sổ đang là 12, bên gửi thấy ba xác nhận trùng, và dùng cách của đường liền. Hãy viết cửa sổ của các vòng từ 0 tới 9. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>vòng</th><th>0 tới 3</th><th>4 tới 7</th></tr>
          <tr><td>cửa sổ</td><td>1, 2, 4, 8 (chạm ngưỡng 8)</td><td>9, 10, 11, 12 (mất ở vòng 7)</td></tr></table>
        focus: [1, 1]
        say: "Đáp án, khởi động chậm cho 1, 2, 4, 8, chạm ngưỡng, rồi tăng cộng 9, 10, 11, 12. Kiểm lại vị trí, ba lần nhân đôi đưa cửa sổ lên 8 ở vòng 3, rồi bốn lần cộng 1 đưa lên 12 đúng ở vòng 7."
      - show: |
          $$\text{ngưỡng mới} = 12 / 2 = 6$$
          <p>Vòng 8: 6; vòng 9: 7. Cả dãy: $\hl{1, 2, 4, 8, 9, 10, 11, 12, 6, 7}$.</p>
        focus: [1, 2]
        say: "Mất gói ở 12 nên ngưỡng mới là 6, cửa sổ về 6 rồi lên 7. Ghép lại, mười vòng từ 0 tới 9 là 1, 2, 4, 8, 9, 10, 11, 12, 6 và 7."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khởi động chậm: nhân đôi</span><span class="a">→</span>
          <span class="n">từ ngưỡng: +1 mỗi vòng</span><span class="a">→</span>
          <span class="n">mất gói: ngưỡng = cửa sổ / 2</span><span class="a">→</span>
          <span class="n">răng cưa, chia đều</span></div>
        say: "Tổng kết lại, khởi động chậm nhân đôi cửa sổ, từ ngưỡng thì cộng 1 mỗi vòng. Mất gói thì ngưỡng mới bằng nửa cửa sổ, và cửa sổ tạo hình răng cưa, giúp các luồng dần chia đều đường truyền."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi không nhìn thấy tài nguyên chung, hãy dò từ từ và lùi nhanh — một quy tắc đơn giản cho mọi bên cũng tạo ra công bằng.</div>
        say: "Điều cần mang theo, khi không nhìn thấy tài nguyên chung, hãy dò từ từ và lùi thật nhanh, một quy tắc đơn giản cho mọi bên cũng tạo ra sự công bằng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): lên tầng ứng dụng — <b>DNS</b> tìm địa chỉ từ tên miền, và <b>HTTP</b> tải trang web.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta lên tầng ứng dụng, xem DNS tìm địa chỉ từ tên miền, và HTTP tải một trang web. Hẹn gặp bạn ở bài tiếp theo."
