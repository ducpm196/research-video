id: L11
course: NET
series: "NET · Mạng máy tính"
title: "Bài 11 — Điều khiển tắc nghẽn TCP: khởi động chậm và AIMD"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/net.yaml L11; audit/net/verify_net.py L11; V. Jacobson (1988), “Congestion Avoidance and Control”; RFC 5681"
assumes: [arith, power, dots]
# Quy ước: cửa sổ tính bằng số gói, theo từng lượt đi về (vòng). Khởi động chậm: nhân đôi nhưng không vượt ngưỡng; sau ngưỡng +1
#   mỗi vòng. Mất gói phát hiện bằng ba xác nhận trùng: ngưỡng mới = cửa sổ / 2; bản Reno đặt cửa sổ = ngưỡng mới, bản Tahoe đặt về 1.
#   Tên Reno, Tahoe, AIMD chỉ trên màn hình; lời đọc nói “đường liền / đường đứt”, “tăng cộng, giảm nhân”. Số liệu từ alg.cwnd_trace;
#   biểu đồ audit/net/cwnd_svg.py (đã chạy validate_palette.js của skill dataviz).
objectives:
  - "Vẽ cửa sổ tắc nghẽn theo vòng: khởi động chậm rồi tăng cộng"
  - "Giải thích tăng cộng – giảm nhân khi mất gói"
  - "Phân biệt hai cách phản ứng với mất gói"
asr_reviewed:
  - {sentence: "Khi nghẽn, gói rơi hàng loạt, nên phải rút mạnh để hàng đợi kịp thoát.", reason: "ASR chép “Khi nhén, gói trơi … trúc mạnh để hàng đời kịp thoát”: nghẽn/nhén, rơi/trơi, rút/trúc (đổi r → tr như TOC “Rai” → “trai”), đợi/đời — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khi êm, tăng chậm để dò dần phần dư, không gây nghẽn đột ngột.", reason: "ASR chép “khi em tăng chậm … không gây ngãng đột ngục”: êm/em, nghẽn/ngãng, ngột/ngục — nhầm vần của ASR; “nghẽn” ở các câu khác của L11 chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ hai, lẫn cửa sổ tắc nghẽn với cửa sổ của bên nhận.", reason: "ASR chép “Lội thứ 2, lẫn cửa sổ tắt ngạn với cửa sổ của bên nhận”: lỗi/lội, tắc nghẽn/tắt ngạn — nhầm âm cuối và vần; “cửa sổ tắc nghẽn” chép đúng ở các câu khác của L11 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Không ai biết mạng đang đông cỡ nào"
    steps:
      - show: |
          <p>Bài trước: cửa sổ phải đủ lớn để lấp đường. Nhưng đường đi qua hàng chục bộ định tuyến dùng chung với hàng triệu người — bên gửi không biết chỗ nào đang nghẽn.</p>
          <p>Gửi quá nhiều thì hàng đợi tràn, gói rơi, ai cũng phải gửi lại — mạng có thể <b>sụp</b>, như đã xảy ra năm 1986.</p>
          <div class="box key">Hôm nay: TCP tự dò: khởi động chậm, tăng cộng – giảm nhân, và phản ứng khi mất gói.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ở bài trước, cửa sổ phải đủ lớn để lấp đầy đường truyền. Nhưng đường đi qua hàng chục bộ định tuyến dùng chung với hàng triệu người, và bên gửi không biết chỗ nào đang nghẽn. Gửi quá nhiều thì hàng đợi tràn, gói rơi, ai cũng phải gửi lại, và mạng có thể sụp, như đã xảy ra năm 1986. Hôm nay ta học cách TCP tự dò, gồm khởi động chậm, tăng cộng, giảm nhân, và phản ứng khi mất gói."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: nhân đôi, cộng dần và cộng một dãy"
    checks:
      - "[2 ** k for k in range(5)] == [1, 2, 4, 8, 16] and 20 - 16 == 4"
      - "10 + 11 + 12 + 13 + 14 == 60 and 5 * (10 + 14) / 2 == 60"
      - "1 + 2 + 4 + 8 == 15 and 16 - 1 == 15"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>dãy số</th><th>đếm bước</th></tr>
          <tr><td>nhân đôi từ 1</td><td>1, 2, 4, 8, 16</td><td>4 lần nhân đôi: $2^4 = 16$</td></tr>
          <tr><td>cộng 1 mỗi bước</td><td>16, 17, 18, 19, 20</td><td>$20 - 16 = 4$ bước</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn hai cách một con số lớn dần. Cách thứ nhất là nhân đôi, bắt đầu từ 1 ta được 1, 2, 4, 8, 16. Sau 4 lần nhân đôi ta có 2 mũ 4, bằng 16, nên số lần nhân đôi chính là số mũ. Cách thứ hai là cộng 1 mỗi bước, từ 16 lên 20 mất 20 trừ 16, bằng 4 bước."
      - show: |
          <table class="t"><tr><th>cộng một dãy</th><th>cộng thẳng</th><th>cách nhanh</th></tr>
          <tr><td>tăng đều 1</td><td>$10 + 11 + 12 + 13 + 14 = 60$</td><td>$5 \times (10 + 14) / 2 = 60$</td></tr>
          <tr><td>nhân đôi</td><td>$1 + 2 + 4 + 8 = 15$</td><td>$16 - 1 = 15$</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Ta cũng sẽ cần cộng một dãy số để đếm tổng số gói đã gửi. Với dãy tăng đều 10, 11, 12, 13, 14, cộng thẳng được 60. Cách nhanh là lấy số số hạng nhân với trung bình của số đầu và số cuối, 5 nhân 24 chia 2, cũng bằng 60. Với dãy nhân đôi 1, 2, 4, 8, cộng thẳng được 15. Cách nhanh là lấy số kế tiếp của dãy trừ 1, tức 16 trừ 1, bằng 15."

  - id: sym
    kind: symbol
    title: "Giải mã: cửa sổ tắc nghẽn và ngưỡng"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>cửa sổ tắc nghẽn</b></td><td>số gói bên gửi cho phép “đang bay” — TCP tự đặt theo dấu hiệu nghẽn</td></tr>
          <tr><td><b>ngưỡng</b></td><td>dưới ngưỡng: khởi động chậm; từ ngưỡng trở lên: tăng cộng</td></tr>
          <tr><td><b>dấu hiệu mất gói</b></td><td>ba xác nhận trùng nhau (gói sau đến mà gói trước thiếu), hoặc hết giờ chờ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ba thuật ngữ cần nắm. Cửa sổ tắc nghẽn là số gói bên gửi cho phép đang bay, TCP tự đặt con số này theo dấu hiệu nghẽn. Ngưỡng là ranh giới, dưới ngưỡng thì khởi động chậm, từ ngưỡng trở lên thì tăng cộng. Dấu hiệu mất gói là ba xác nhận trùng nhau, nghĩa là gói sau đến mà gói trước thiếu, hoặc hết giờ chờ."

  # ───────────────────────── 3. KHỞI ĐỘNG CHẬM ─────────────────────────
  - id: slowstart
    kind: concept
    title: "Khởi động chậm rồi tăng cộng"
    checks:
      - "alg.cwnd_trace(8, 16) == [1, 2, 4, 8, 16, 17, 18, 19]"
    steps:
      - show: |
          <div><svg width="900" height="400" viewBox="0 0 900 400"><line x1="80" y1="340" x2="780" y2="340" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="347" font-size="20" fill="#6b7280" text-anchor="end">0</text><line x1="80" y1="295" x2="780" y2="295" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="302" font-size="20" fill="#6b7280" text-anchor="end">4</text><line x1="80" y1="250" x2="780" y2="250" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="257" font-size="20" fill="#6b7280" text-anchor="end">8</text><line x1="80" y1="205" x2="780" y2="205" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="212" font-size="20" fill="#6b7280" text-anchor="end">12</text><line x1="80" y1="160" x2="780" y2="160" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="167" font-size="20" fill="#6b7280" text-anchor="end">16</text><line x1="80" y1="115" x2="780" y2="115" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="122" font-size="20" fill="#6b7280" text-anchor="end">20</text><line x1="80" y1="70" x2="780" y2="70" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="77" font-size="20" fill="#6b7280" text-anchor="end">24</text><text x="80" y="370" font-size="20" fill="#6b7280" text-anchor="middle">0</text><text x="280" y="370" font-size="20" fill="#6b7280" text-anchor="middle">2</text><text x="480" y="370" font-size="20" fill="#6b7280" text-anchor="middle">4</text><text x="680" y="370" font-size="20" fill="#6b7280" text-anchor="middle">6</text><text x="430" y="396" font-size="20" fill="#6b7280" text-anchor="middle">vòng gửi (mỗi vòng một RTT)</text><text x="18" y="56" font-size="20" fill="#6b7280">cửa sổ (gói)</text><line x1="80" y1="160" x2="780" y2="160" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 6"/><text x="90" y="152" font-size="20" fill="#6b7280" stroke="#fffbeb" stroke-width="6" paint-order="stroke">ngưỡng 16</text><polyline points="80,329 180,318 280,295 380,250 480,160 580,149 680,138 780,126" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round"/><circle cx="80" cy="329" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="180" cy="318" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="280" cy="295" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="380" cy="250" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="480" cy="160" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="580" cy="149" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="680" cy="138" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="780" cy="126" r="5" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><text x="366" y="234" font-size="20" fill="#1f2937" text-anchor="end" font-weight="700" stroke="#fffbeb" stroke-width="6" paint-order="stroke">nhân đôi</text><text x="566" y="133" font-size="20" fill="#1f2937" text-anchor="end" font-weight="700" stroke="#fffbeb" stroke-width="6" paint-order="stroke">+1 mỗi vòng</text></svg></div>
          <p>Bắt đầu 1 gói; mỗi vòng <b>nhân đôi</b>: 1, 2, 4, 8, 16. Chạm ngưỡng 16 thì chuyển sang <b>+1 mỗi vòng</b>: 17, 18, 19.</p>
          <p>Sách giáo khoa bắt đầu từ 1 gói cho dễ đếm; máy thật ngày nay thường bắt đầu với 10 gói (RFC 6928).</p>
        focus: [1, 2, 2, 3]
        say: "Cửa sổ bắt đầu từ 1 gói, và mỗi vòng nhân đôi, 1, 2, 4, 8, rồi 16. Chạm ngưỡng 16 thì TCP chuyển sang tăng thêm 1 gói mỗi vòng, 17, 18, 19. Tên gọi khởi động chậm là so với việc gửi cả cửa sổ ngay từ đầu, chứ thật ra nó tăng theo hàm mũ. Sách giáo khoa bắt đầu từ 1 gói cho dễ đếm, còn máy thật ngày nay thường bắt đầu với 10 gói."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Mất gói ở cửa sổ 20"
    checks:
      - "alg.cwnd_trace(14, 16, loss_at=(8,)) == [1, 2, 4, 8, 16, 17, 18, 19, 20, 10, 11, 12, 13, 14]"
      - "alg.cwnd_trace(14, 16, loss_at=(8,), variant='tahoe')[8:] == [20, 1, 2, 4, 8, 10]"
      - "20 // 2 == 10"
      - "alg.cwnd_trace(9, 16) == [1, 2, 4, 8, 16, 17, 18, 19, 20] and 2 ** 4 == 16 and 16 + 4 == 20"
      - "alg.cwnd_trace(20, 16, loss_at=(8,))[9] == 10 and alg.cwnd_trace(20, 16, loss_at=(8,))[19] == 20 and 9 + (20 - 10) == 19 and 20 not in alg.cwnd_trace(20, 16, loss_at=(8,))[9:19]"
      - "alg.cwnd_trace(14, 16, loss_at=(8,))[9:14] == [10, 11, 12, 13, 14] and sum(alg.cwnd_trace(14, 16, loss_at=(8,))[9:14]) == 60"
      - "alg.cwnd_trace(14, 16, loss_at=(8,), variant='tahoe')[9:14] == [1, 2, 4, 8, 10] and sum(alg.cwnd_trace(14, 16, loss_at=(8,), variant='tahoe')[9:14]) == 25"
      - "60 - 25 == 35 and 35 > 60 / 2"
    steps:
      - show: |
          <div><svg width="900" height="430" viewBox="0 0 900 430"><line x1="80" y1="370" x2="780" y2="370" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="377" font-size="20" fill="#6b7280" text-anchor="end">0</text><line x1="80" y1="320" x2="780" y2="320" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="327" font-size="20" fill="#6b7280" text-anchor="end">4</text><line x1="80" y1="270" x2="780" y2="270" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="277" font-size="20" fill="#6b7280" text-anchor="end">8</text><line x1="80" y1="220" x2="780" y2="220" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="227" font-size="20" fill="#6b7280" text-anchor="end">12</text><line x1="80" y1="170" x2="780" y2="170" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="177" font-size="20" fill="#6b7280" text-anchor="end">16</text><line x1="80" y1="120" x2="780" y2="120" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="127" font-size="20" fill="#6b7280" text-anchor="end">20</text><line x1="80" y1="70" x2="780" y2="70" stroke="#e5e7eb" stroke-width="1.5"/><text x="68" y="77" font-size="20" fill="#6b7280" text-anchor="end">24</text><text x="80" y="400" font-size="20" fill="#6b7280" text-anchor="middle">0</text><text x="188" y="400" font-size="20" fill="#6b7280" text-anchor="middle">2</text><text x="295" y="400" font-size="20" fill="#6b7280" text-anchor="middle">4</text><text x="403" y="400" font-size="20" fill="#6b7280" text-anchor="middle">6</text><text x="511" y="400" font-size="20" fill="#6b7280" text-anchor="middle">8</text><text x="618" y="400" font-size="20" fill="#6b7280" text-anchor="middle">10</text><text x="726" y="400" font-size="20" fill="#6b7280" text-anchor="middle">12</text><text x="430" y="426" font-size="20" fill="#6b7280" text-anchor="middle">vòng gửi (mỗi vòng một RTT)</text><text x="18" y="56" font-size="20" fill="#6b7280">cửa sổ (gói)</text><line x1="80" y1="170" x2="780" y2="170" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 6"/><tex