scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một địa chỉ, nhiều chương trình"
    steps:
      - show: |
          <p>Máy bạn có <b>một</b> địa chỉ IP, nhưng trình duyệt, ứng dụng nhắn tin, trò chơi cùng nhận dữ liệu một lúc. Gói tin đến thì giao cho chương trình nào?</p>
          <p>Và có chương trình cần <b>đủ, đúng thứ tự</b> (tải tệp), có chương trình cần <b>nhanh</b> hơn cần đủ (gọi video).</p>
          <div class="box key">Hôm nay: số cổng, UDP, TCP, và bắt tay ba bước mở một kết nối TCP.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, máy bạn chỉ có một địa chỉ IP, nhưng trình duyệt, ứng dụng nhắn tin và trò chơi cùng nhận dữ liệu một lúc. Vậy gói tin đến thì giao cho chương trình nào? Hơn nữa, có chương trình cần dữ liệu đủ và đúng thứ tự, như tải tệp, có chương trình cần nhanh hơn cần đủ, như gọi video. Hôm nay ta học số cổng, hai giao thức UDP và TCP, và bắt tay ba bước để mở một kết nối TCP."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đếm số ô từ ô đầu tới ô cuối"
    checks:
      - "600 - 101 + 1 == 500 and 10 - 1 + 1 == 10"
      - "101 + 500 - 1 == 600 and 101 + 500 == 601"
      - "2 ** 16 == 65536 and 65535 - 0 + 1 == 65536"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>cách tính</th><th>ví dụ</th></tr>
          <tr><td>từ ô $a$ tới ô $b$ có mấy ô?</td><td>$b - a + 1$</td><td>từ 1 tới 10: $10 - 1 + 1 = 10$ ô; từ 101 tới 600: $600 - 101 + 1 = 500$ ô</td></tr>
          <tr><td>bắt đầu ở ô $s$, lấy $n$ ô, ô cuối là?</td><td>$s + n - 1$</td><td>$101 + 500 - 1 = 600$</td></tr>
          <tr><td>ô <b>kế tiếp</b> sau đó là?</td><td>$s + n$</td><td>$101 + 500 = 601$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn một phép đếm rất hay bị lệch 1. Muốn biết từ ô a tới ô b có mấy ô, ta lấy b trừ a rồi cộng thêm 1, ví dụ từ 1 tới 10 có 10 ô, từ 101 tới 600 có đúng 500 ô. Nếu bắt đầu ở ô s và lấy n ô, thì ô cuối là s cộng n trừ 1, ở đây 101 cộng 500 trừ 1 bằng 600. Còn ô kế tiếp ngay sau đó là s cộng n, tức 601, con số này sẽ quay lại nhiều lần trong bài."
      - show: |
          <p>Một số dài 16 bit có $2^{16} = 65\,536$ giá trị, đánh số từ 0 tới 65 535 — đếm lại bằng phép đếm trên: $65\,535 - 0 + 1 = 65\,536$.</p>
        say: "Phép đếm này cũng giải thích giới hạn của số cổng. Mỗi bit có hai giá trị, nên một số dài 16 bit có 2 mũ 16, bằng 65 nghìn 536 giá trị. Đánh số từ 0 thì số lớn nhất là 65 nghìn 535, và đếm lại bằng phép trừ rồi cộng 1 cũng ra đúng 65 nghìn 536."

  - id: sym
    kind: symbol
    title: "Giải mã: cổng và số thứ tự"
    checks:
      - "2 ** 16 == 65536"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>cổng</b></td><td>số 16 bit (0 … 65 535) chỉ một tiến trình trên máy; máy chủ web nghe cổng 443, máy chủ tên miền cổng 53</td></tr>
          <tr><td><b>số thứ tự</b> (seq)</td><td>vị trí của byte đầu tiên trong đoạn, tính trong dòng dữ liệu của chiều đó</td></tr>
          <tr><td><b>số xác nhận</b> (ack)</td><td>số thứ tự của byte <b>tiếp theo</b> mà bên nhận đang chờ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ba khái niệm cần nắm. Cổng là một số 16 bit, từ 0 tới 65 nghìn 535, chỉ một tiến trình trên máy, ví dụ máy chủ web nghe ở cổng 443. Số thứ tự là vị trí của byte đầu tiên trong đoạn, tính trong dòng dữ liệu của chiều đó. Số xác nhận là số thứ tự của byte tiếp theo mà bên nhận đang chờ."

  # ───────────────────────── 3. UDP vs TCP ─────────────────────────
  - id: compare
    kind: concept
    title: "UDP và TCP"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>UDP</th><th>TCP</th></tr>
          <tr><td>mở kết nối trước</td><td>không</td><td>có, bắt tay ba bước</td></tr>
          <tr><td>bảo đảm đủ, đúng thứ tự</td><td>không</td><td>có: đánh số, xác nhận, gửi lại</td></tr>
          <tr><td>tự giảm tốc khi mạng nghẽn</td><td>không</td><td>có</td></tr>
          <tr><td>phần đầu</td><td>8 byte</td><td>tối thiểu 20 byte</td></tr>
          <tr><td>hợp với</td><td>tra tên miền, gọi video, trò chơi</td><td>trang web, tệp, thư điện tử</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "So sánh hai giao thức. UDP không mở kết nối trước, còn TCP mở bằng bắt tay ba bước. UDP không bảo đảm dữ liệu đủ và đúng thứ tự, TCP thì có, nhờ đánh số, xác nhận và gửi lại. TCP còn tự giảm tốc khi mạng nghẽn, UDP thì không. Phần đầu UDP chỉ 8 byte, TCP tối thiểu 20 byte. Vì vậy UDP hợp với tra tên miền, gọi video, trò chơi, còn TCP hợp với trang web, tệp và thư điện tử."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Dòng byte đánh số như số nhà trên một con phố"
    checks:
      - "101 + 500 == 601 and 601 + 300 == 901 and 900 - 601 + 1 == 300"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="24" fill="#1f2937"><text x="150" y="40" font-weight="700">dòng byte của chiều khách tới máy chủ</text><rect x="150" y="110" width="750" height="80" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><rect x="900" y="110" width="450" height="80" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="525" y="145" text-anchor="middle">đoạn 1: byte 101 tới 600</text><text x="525" y="177" text-anchor="middle" font-size="22">500 byte</text><text x="1125" y="145" text-anchor="middle">đoạn 2: byte 601 tới 900</text><text x="1125" y="177" text-anchor="middle" font-size="22">300 byte</text><text x="150" y="96" fill="#2a78d6">seq = 101</text><text x="908" y="96" fill="#eb6834">seq = 601</text><line x1="900" y1="190" x2="900" y2="240" stroke="#15803d" stroke-width="3"/><line x1="1350" y1="190" x2="1350" y2="240" stroke="#15803d" stroke-width="3"/><text x="900" y="272" text-anchor="middle" fill="#15803d">ack = 601 sau đoạn 1</text><text x="1350" y="272" text-anchor="end" fill="#15803d">ack = 901 sau đoạn 2</text><text x="900" y="306" text-anchor="middle" font-size="20">(chờ byte 601)</text><text x="1350" y="306" text-anchor="end" font-size="20">(chờ byte 901)</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hãy hình dung dữ liệu của một chiều như một con phố dài, mỗi byte là một ngôi nhà có số riêng. Đoạn thứ nhất chở các byte từ 101 tới 600, nên số thứ tự của nó là 101, số của ngôi nhà đầu tiên. Nhận xong đoạn này, máy chủ báo số xác nhận 601, nghĩa là đang chờ ngôi nhà 601. Đoạn thứ hai bắt đầu đúng ở 601, chở 300 byte tới 900, nên số xác nhận tiếp theo là 901."

  - id: example
    kind: example
    title: "Bắt tay ba bước"
    checks:
      - "(100 + 1, 300 + 1) == (101, 301)"
      - "101 + 500 == 601"
      - "601 + 300 == 901 and 301 + 200 == 501"
    steps:
      - show: |
          <div><svg width="900" height="440" viewBox="0 0 900 440"><defs><marker id="h" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#374151"/></marker></defs><text x="230" y="48" font-size="28" font-weight="700" text-anchor="middle">khách</text><line x1="230" y1="70" x2="230" y2="420" stroke="#9ca3af" stroke-width="4"/><text x="670" y="48" font-size="28" font-weight="700" text-anchor="middle">máy chủ</text><line x1="670" y1="70" x2="670" y2="420" stroke="#9ca3af" stroke-width="4"/><line x1="230" y1="90" x2="670" y2="160" stroke="#374151" stroke-width="3.5" marker-end="url(#h)"/><text x="450" y="78" font-size="24" font-weight="700" fill="#374151" text-anchor="middle" stroke="#fffbeb" stroke-width="7" paint-order="stroke" stroke-linejoin="round">SYN, seq = 100</text><line x1="670" y1="200" x2="230" y2="270" stroke="#374151" stroke-width="3.5" marker-end="url(#h)"/><text x="450" y="188" font-size="24" font-weight="700" fill="#374151" text-anchor="middle" stroke="#fffbeb" stroke-width="7" paint-order="stroke" stroke-linejoin="round">SYN-ACK, seq = 300, ack = 101</text><line x1="230" y1="310" x2="670" y2="380" stroke="#374151" stroke-width="3.5" marker-end="url(#h)"/><text x="450" y="298" font-size="24" font-weight="700" fill="#374151" text-anchor="middle" stroke="#fffbeb" stroke-width="7" paint-order="stroke" stroke-linejoin="round">ACK, ack = 301</text><text x="246" y="428" font-size="22" fill="#059669" text-anchor="start" font-weight="700">khách bắt đầu gửi dữ liệu</text></svg></div>
          <ol><li>Khách gửi gói mở kết nối, số thứ tự đầu 100.</li>
          <li>Máy chủ đáp: số thứ tự đầu của nó là 300, và “tôi chờ byte 101” — gói mở kết nối <b>tốn một số thứ tự</b>.</li>
          <li>Khách xác nhận: “tôi chờ byte 301”. Kết nối mở; tốn đúng <b>một lượt đi về</b> trước khi có dữ liệu.</li></ol>
        focus: [1, "2.1", "2.2", "2.2", "2.3", "2.3"]
        say: "Bắt tay ba bước diễn ra như hình. Bước một, khách gửi gói mở kết nối, với số thứ tự đầu là 100. Bước hai, máy chủ đáp lại, số thứ tự đầu của nó là 300, và số xác nhận 101, nghĩa là tôi chờ byte 101. Gói mở kết nối tốn đúng một số thứ tự, nên số xác nhận là 100 cộng 1. Bước ba, khách xác nhận lại, tôi chờ byte 301. Kết nối mở xong, tốn đúng một lượt đi về trước khi có dữ liệu."
      - clear: true
        show: |
          <p><b>Bước 1.</b> Khách gửi 500 byte, số thứ tự 101. Máy chủ xác nhận:</p>
          $$\text{ack} = 101 + 500 = \hl{601}$$
          <p>Đã có đủ byte 101 … 600, chờ byte 601.</p>
        focus: [1, 2]
        say: "Sau đó khách gửi 500 byte, bắt đầu từ số thứ tự 101. Máy chủ xác nhận 101 cộng 500 bằng 601, nghĩa là đã có đủ từ byte 101 tới byte 600, và đang chờ byte 601."
      - show: |
          <p><b>Bước 2.</b> Đoạn kế tiếp của khách bắt đầu đúng ở byte đang được chờ: seq = 601, mang 300 byte.</p>
          $$\text{ack} = 601 + 300 = \hl{901}$$
        focus: [1, 1, 2]
        say: "Bước hai, khách gửi tiếp một đoạn 300 byte. Đoạn này bắt đầu đúng ở byte mà máy chủ đang chờ, nên số thứ tự của nó là 601. Máy chủ cộng 601 với 300, xác nhận 901."
      - show: |
          <p><b>Bước 3.</b> Chiều ngược lại đánh số riêng: máy chủ trả lời 200 byte, bắt đầu từ byte 301 của chiều máy chủ tới khách.</p>
          $$\text{ack} = 301 + 200 = \hl{501}$$
        focus: [1, 1, 2]
        say: "Bước ba, máy chủ trả lời 200 byte. Chiều này có dòng số riêng, bắt đầu từ 301 như đã hẹn lúc bắt tay. Khách cộng 301 với 200, và gửi số xác nhận 501."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "900 - 101 + 1 == 800 and 101 + 800 == 901 and 101 + 500 + 300 == 901"
      - "500 - 301 + 1 == 200 and 301 + 200 == 501"
    steps:
      - show: |
          <ol><li><b>Số xác nhận</b> = số thứ tự nhận được + số byte nhận được (+ 1 nếu là gói mở hoặc đóng kết nối).</li>
          <li><b>Hai chiều độc lập:</b> 100, 101 thuộc chiều khách → máy chủ; 300, 301 thuộc chiều ngược lại.</li>
          <li><b>Đếm lượt:</b> bắt tay tốn 1 lượt đi về trước byte dữ liệu đầu tiên.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba quy tắc. Một, số xác nhận bằng số thứ tự nhận được cộng số byte nhận được, cộng thêm 1 nếu đó là gói mở hoặc đóng kết nối. Hai, hai chiều đánh số độc lập, 100 và 101 thuộc chiều từ khách tới máy chủ, còn 300 và 301 thuộc chiều ngược lại. Ba, đếm lượt, bắt tay tốn một lượt đi về trước byte dữ liệu đầu tiên."
      - clear: true
        show: |
          <table class="t"><tr><th>chiều</th><th>các byte đã nhận</th><th>đếm thẳng</th><th>ack = byte đầu + số byte</th></tr>
          <tr><td>khách → máy chủ</td><td>101 … 900</td><td>$900 - 101 + 1 = 800$</td><td>$101 + 800 = 901$ ✓</td></tr>
          <tr><td>máy chủ → khách</td><td>301 … 500</td><td>$500 - 301 + 1 = 200$</td><td>$301 + 200 = 501$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bây giờ kiểm các số xác nhận bằng một đường khác, không cộng từng đoạn nữa mà đếm thẳng cả dòng byte. Chiều từ khách tới máy chủ đã nhận các byte từ 101 tới 900, tức 900 trừ 101 cộng 1, bằng 800 byte, cộng vào byte đầu 101 được 901, khớp với bước hai. Chiều ngược lại đã nhận các byte từ 301 tới 500, đúng 200 byte, nên số xác nhận là 501, khớp với bước ba."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "10 * 50 == 500 and 1 * 50 == 50"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ UDP luôn làm mất gói <b class="red">(sai)</b>
          <br><span class="note">Đa số gói UDP vẫn tới nơi. UDP chỉ <b>không bảo đảm</b>: mất thì không tự gửi lại, đến lộn thứ tự thì không tự sắp.</span></div>
        say: "Lỗi thứ nhất, nghĩ UDP luôn làm mất gói. Đa số gói UDP vẫn tới nơi, UDP chỉ không bảo đảm, mất thì không tự gửi lại, đến lộn thứ tự thì không tự sắp."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ số xác nhận là byte <b>cuối cùng</b> đã nhận <b class="red">(lệch 1)</b>
          <br><span class="note">Nó là byte <b>tiếp theo đang chờ</b>: nhận tới 600 thì xác nhận 601.</span></div>
          <table class="t"><tr><th>đã nhận đủ tới byte</th><th>xác nhận đúng</th><th>hay viết nhầm</th></tr>
          <tr><td>600</td><td><b>601</b></td><td class="red">600</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, nghĩ số xác nhận là byte cuối cùng đã nhận, sai lệch 1. Nó là byte tiếp theo đang chờ, nhận tới byte 600 thì xác nhận 601."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ số thứ tự luôn bắt đầu từ 0 <b class="red">(sai)</b>
          <br><span class="note">Số đầu được chọn ngẫu nhiên, để gói cũ của kết nối trước không bị nhận nhầm và kẻ gian khó đoán.</span></div>
        say: "Lỗi thứ ba, nghĩ số thứ tự luôn bắt đầu từ 0. Số đầu được chọn ngẫu nhiên, để gói cũ của kết nối trước không bị nhận nhầm, và kẻ gian khó đoán."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên chi phí bắt tay <b class="red">(thiếu)</b>
          <br><span class="note">Mỗi kết nối TCP mới tốn thêm 1 lượt đi về. Với trang web có nhiều đối tượng, điều này cộng dồn rất nhanh.</span></div>
        say: "Lỗi thứ tư, quên chi phí của bắt tay. Mỗi kết nối TCP mới tốn thêm một lượt đi về, với trang web có nhiều đối tượng thì chi phí này cộng dồn rất nhanh."
      - clear: true
        show: |
          <p>Lỗi 4 bằng số (số minh hoạ): tải lần lượt 10 đối tượng, mỗi lượt đi về 50 ms.</p>
          <table class="t"><tr><th>cách làm</th><th>số lần bắt tay</th><th>thời gian chỉ để bắt tay</th></tr>
          <tr><td>mỗi đối tượng mở một kết nối mới</td><td>10</td><td>$10 \times 50 = 500$ ms</td></tr>
          <tr><td>giữ một kết nối, dùng lại</td><td>1</td><td>$1 \times 50 = 50$ ms</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Đây là lỗi hay gặp ở người đã đi làm, khi viết chương trình gọi máy chủ khác nhiều lần. Lấy số minh hoạ, tải lần lượt 10 đối tượng, mỗi lượt đi về 50 mi li giây. Nếu mỗi lần lại mở một kết nối mới, thì riêng bắt tay đã tốn 10 nhân 50, bằng 500 mi li giây. Giữ một kết nối và dùng lại cho cả 10 lần thì chỉ bắt tay một lần, mất 50 mi li giây. Người có kinh nghiệm luôn đếm số lần bắt tay trước khi đổ lỗi cho đường truyền chậm."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(2000 + 1, 7000 + 1, 2001 + 100) == (2001, 7001, 2101)"
      - "2001 + 100 - 1 == 2100 and 2100 - 2001 + 1 == 100"
    steps:
      - show: |
          <p>Khách chọn số thứ tự đầu 2000, máy chủ chọn 7000.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ghi số thứ tự và số xác nhận trên ba gói bắt tay.</td></tr>
          <tr><td>2</td><td>Khách gửi tiếp 100 byte. Máy chủ xác nhận số mấy?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Khách chọn số thứ tự đầu là 2000, máy chủ chọn 7000. Câu một, ghi số thứ tự và số xác nhận trên ba gói bắt tay. Câu hai, khách gửi tiếp 100 byte, máy chủ xác nhận số mấy? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>gói</th><th>seq</th><th>ack</th><th>lý do</th></tr>
          <tr><td>SYN (khách)</td><td>2000</td><td>—</td><td>số đầu khách chọn</td></tr>
          <tr><td>SYN-ACK (máy chủ)</td><td>7000</td><td>$\hl{2001}$</td><td>$2000 + 1$: gói mở tốn một số</td></tr>
          <tr><td>ACK (khách)</td><td>2001</td><td>$\hl{7001}$</td><td>$7000 + 1$</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Đáp án câu một, gói mở kết nối của khách mang số thứ tự 2000. Máy chủ đáp với số thứ tự 7000 và số xác nhận 2001, vì gói mở kết nối tốn đúng một số thứ tự, nên 2000 cộng 1 bằng 2001. Rồi khách xác nhận 7001, theo cùng lý do, 7000 cộng 1, và gói này mang số thứ tự 2001 của khách."
      - show: |
          <p>② Byte dữ liệu đầu tiên của khách mang số 2001. 100 byte chiếm các số 2001 … 2100:</p>
          $$\text{ack} = 2001 + 100 = \hl{2101}$$
        focus: [1, 2, 2]
        say: "Câu hai, 100 byte bắt đầu từ 2001, nên máy chủ xác nhận 2001 cộng 100 bằng 2101. Byte đầu mang số 2001 vì gói mở kết nối đã dùng số 2000, và 100 byte chiếm các số từ 2001 tới 2100. Kiểm lại bằng phép đếm, từ 2001 tới 2100 có 2100 trừ 2001 cộng 1, đúng 100 byte."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cổng → đúng tiến trình</span><span class="a">→</span>
          <span class="n">UDP: nhẹ, không bảo đảm</span><span class="a">→</span>
          <span class="n">TCP: đánh số, xác nhận</span><span class="a">→</span>
          <span class="n">bắt tay: 1 lượt đi về</span></div>
        say: "Tổng kết lại, số cổng đưa dữ liệu tới đúng tiến trình. UDP nhẹ nhưng không bảo đảm, TCP đánh số và xác nhận từng byte, và bắt tay tốn một lượt đi về."
      - show: |
          <div class="box key"><b>Tư duy:</b> chọn giao thức theo điều ứng dụng <b>không chịu được</b>: mất dữ liệu, hay chậm trễ.</div>
        say: "Điều cần mang theo, hãy chọn giao thức theo điều ứng dụng không chịu được, mất dữ liệu, hay chậm trễ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): TCP bảo đảm đủ dữ liệu bằng cách nào mà vẫn nhanh? <b>Truyền tin cậy</b>: dừng–chờ và cửa sổ trượt.</p>
        forward_ref: true
