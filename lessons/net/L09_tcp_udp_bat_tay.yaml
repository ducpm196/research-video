# Quy ước: tên cờ SYN, ACK và trường seq, ack chỉ ghi trên màn hình; lời đọc nói “gói mở kết nối”, “gói xác nhận”, “số thứ tự”,
#   “số xác nhận”. Số thứ tự đầu chọn 100 và 300 cho dễ theo dõi (thực tế là số ngẫu nhiên 32 bit). Hình sinh bằng audit/net/seq_svg.py.
objectives:
  - "Hiểu cổng phân biệt các tiến trình trên cùng một máy"
  - "Phân biệt UDP và TCP"
  - "Theo dõi số thứ tự và số xác nhận trong bắt tay ba bước"
