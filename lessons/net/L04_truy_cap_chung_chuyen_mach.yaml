# Quy ước: G = số khung trung bình mà mọi máy cùng định gửi trong khoảng thời gian của một khung. Hiệu suất = phần thời gian có
#   khung thành công. Bảng của bộ chuyển mạch do alg.learn_switch chạy. “MAC” trong bài là địa chỉ phần cứng 48 bit (không phải
#   mã xác thực ở bài 3). Lùi ngẫu nhiên: sau va chạm thứ n, chọn k đều trong 0 … 2ⁿ − 1 (giới hạn n ≤ 10).
objectives:
  - "Giải thích va chạm và lùi ngẫu nhiên"
  - "So hiệu suất tối đa của ALOHA thuần và ALOHA chia khe"
  - "Chạy bộ chuyển mạch tự học; phân biệt với bộ định tuyến"
