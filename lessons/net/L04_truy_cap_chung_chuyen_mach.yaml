scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mười người, một cái loa"
    checks:
      - "round(1 / (2 * math.e), 3) == 0.184"
    steps:
      - show: |
          <p>Mười máy nối chung một sợi cáp. Hai máy cùng phát một lúc thì tín hiệu chồng lên nhau — <b>va chạm</b> — và cả hai khung đều hỏng.</p>
          <p>Cách đơn giản nhất, “có gì gửi nấy, hỏng thì gửi lại”, chỉ tận dụng tối đa khoảng <b>18,4%</b> thời gian của đường truyền.</p>
          <div class="box key">Hôm nay: chia sẻ một đường truyền chung, Ethernet, và bộ chuyển mạch — vì sao mạng ngày nay gần như không còn va chạm.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, mười máy nối chung một sợi cáp. Hai máy cùng phát một lúc thì tín hiệu chồng lên nhau, gọi là va chạm, và cả hai khung đều hỏng. Cách đơn giản nhất là có gì gửi nấy, hỏng thì gửi lại, nhưng chỉ tận dụng tối đa khoảng 18 phẩy 4 phần trăm thời gian của đường truyền. Hôm nay ta học cách chia sẻ một đường truyền chung, Ethernet, và bộ chuyển mạch, lý do mạng ngày nay gần như không còn va chạm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa của 2 và chữ số hệ 16"
    checks:
      - "2 ** 1 == 2 and 2 ** 2 == 4 and 2 ** 3 == 8 and 2 ** 10 == 1024"
      - "format(0x3C, '08b') == '00111100' and 0x3C == 60 and 12 * 4 == 48"
    steps:
      - show: |
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>3</th><th>10</th></tr>
          <tr><td>$2^n$</td><td>2</td><td>4</td><td>8</td><td>1024</td></tr>
          <tr><td>các số từ 0 tới $2^n - 1$</td><td>0, 1</td><td>0 … 3</td><td>0 … 7</td><td>0 … 1023</td></tr></table>
        focus: [0, "1.2", "1.3", "1.2"]
        say: "Trước hết, ta ôn lại hai kiến thức nền sẽ dùng trong bài này. Hai mũ n là nhân 2 với chính nó n lần, nên 2 mũ 1 bằng 2, 2 mũ 2 bằng 4, 2 mũ 3 bằng 8. Từ 0 tới 2 mũ n trừ 1 có đúng 2 mũ n số, ví dụ từ 0 tới 7 có 8 số. Cứ tăng n thêm một thì số lựa chọn gấp đôi, tới n bằng 10 đã là 1024."
      - show: |
          <table class="t"><tr><th>chữ số hệ 16</th><th>giá trị</th><th>4 bit</th></tr>
          <tr><td><code>3</code></td><td>3</td><td><code>0011</code></td></tr>
          <tr><td><code>C</code></td><td>12</td><td><code>1100</code></td></tr></table>
          <p>Một chữ số hệ 16 là đúng 4 bit, nên 12 chữ số hệ 16 là $12 \cdot 4 = 48$ bit.</p>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", 2]
        say: "Kiến thức thứ hai là hệ 16, dùng các chữ số từ 0 tới 9 rồi A tới F, trong đó F là 15. Chữ số 3 viết bằng bốn bit là 0 0 1 1. Chữ số C là 12, viết bằng bốn bit là 1 1 0 0. Mỗi chữ số hệ 16 là đúng 4 bit, nên 12 chữ số hệ 16 là 12 nhân 4, bằng 48 bit."

  - id: sym
    kind: symbol
    title: "Giải mã: địa chỉ MAC, va chạm, lùi ngẫu nhiên"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>địa chỉ MAC</b></td><td>48 bit ghi sẵn trong card mạng, viết hệ 16, ví dụ <code>3C:22:FB:7A:10:5E</code>; dùng trong <b>một</b> đoạn mạng</td></tr>
          <tr><td><b>nghe trước khi nói</b></td><td>thấy đường đang bận thì chờ, rảnh mới phát</td></tr>
          <tr><td><b>phát hiện va chạm</b></td><td>vừa phát vừa nghe; thấy tín hiệu lạ thì dừng ngay</td></tr>
          <tr><td><b>lùi ngẫu nhiên</b></td><td>sau va chạm thứ $n$, chọn ngẫu nhiên $k$ trong $0, 1, \dots, 2^n - 1$ rồi chờ $k$ khe thời gian</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bốn thuật ngữ cần nắm. Địa chỉ MAC là 48 bit ghi sẵn trong bộ phận mạng của máy, viết ở hệ 16, và chỉ dùng trong một đoạn mạng. Nghe trước khi nói nghĩa là thấy đường đang bận thì chờ, rảnh mới phát. Phát hiện va chạm nghĩa là vừa phát vừa nghe, thấy tín hiệu lạ thì dừng ngay. Lùi ngẫu nhiên nghĩa là sau va chạm thứ n, chọn ngẫu nhiên một số k từ 0 tới 2 mũ n trừ 1, rồi chờ k khe thời gian."

  # ───────────────────────── 3. ALOHA ─────────────────────────
  - id: aloha
    kind: concept
    title: "ALOHA: gửi bất cứ lúc nào, hay chờ đầu khe"
    checks:
      - "abs(max(G / 1000 * math.exp(-2 * G / 1000) for G in range(1, 3000)) - 1 / (2 * math.e)) < 1e-6"
      - "abs(max(G / 1000 * math.exp(-G / 1000) for G in range(1, 3000)) - 1 / math.e) < 1e-6"
      - "round(1 / math.e, 3) == 0.368"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>ALOHA thuần</th><th>ALOHA chia khe</th></tr>
          <tr><td>khi nào được phát</td><td>bất cứ lúc nào</td><td>chỉ ở đầu mỗi khe</td></tr>
          <tr><td>khoảng dễ va chạm</td><td>2 độ dài khung</td><td>1 độ dài khung</td></tr>
          <tr><td>hiệu suất</td><td>$G e^{-2G}$, tối đa $\frac{1}{2e} \approx \hl{18{,}4\%}$ tại $G = 0{,}5$</td><td>$G e^{-G}$, tối đa $\frac{1}{e} \approx \hl{36{,}8\%}$ tại $G = 1$</td></tr></table>
          <p class="note">$e \approx 2{,}718$; $G$ = số khung mọi máy cùng muốn gửi trong thời gian của một khung.</p>
        introduces: [exp]
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "So hai cách. ALOHA thuần cho phát bất cứ lúc nào, còn ALOHA chia khe chỉ cho phát ở đầu mỗi khe thời gian. Với ALOHA thuần, một khung bị đe doạ bởi mọi khung bắt đầu trong khoảng dài gấp đôi nó, còn chia khe thì chỉ trong một khe. Nhờ vậy hiệu suất tối đa tăng gấp đôi, từ 18 phẩy 4 lên 36 phẩy 8 phần trăm. Trong công thức, e xấp xỉ 2 phẩy 7 1 8, và G là số khung mọi máy cùng muốn gửi trong thời gian của một khung."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Va chạm và lùi ngẫu nhiên trên trục thời gian"
    steps:
      - show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><g font-size="22" fill="#1f2937"><line x1="200" y1="50" x2="200" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><line x1="500" y1="50" x2="500" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><line x1="800" y1="50" x2="800" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><line x1="1100" y1="50" x2="1100" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><line x1="1400" y1="50" x2="1400" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><text x="350" y="40" text-anchor="middle" fill="#6b7280">khe 0</text><text x="650" y="40" text-anchor="middle" fill="#6b7280">khe 1</text><text x="950" y="40" text-anchor="middle" fill="#6b7280">khe 2</text><text x="1250" y="40" text-anchor="middle" fill="#6b7280">khe 3</text><text x="20" y="98" font-weight="bold">máy A</text><text x="20" y="178" font-weight="bold">máy B</text><text x="20" y="278" font-weight="bold">trên dây</text><rect x="210" y="70" width="280" height="44" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="350" y="100" text-anchor="middle" fill="#1f2937">khung A</text><rect x="210" y="150" width="280" height="44" rx="8" fill="#fed7aa" stroke="#1f2937" stroke-width="2"/><text x="350" y="180" text-anchor="middle" fill="#1f2937">khung B</text><rect x="210" y="250" width="280" height="44" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="350" y="280" text-anchor="middle" fill="#b91c1c">va chạm: hỏng cả hai</text><rect x="510" y="70" width="280" height="44" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="650" y="100" text-anchor="middle" fill="#1f2937">chọn k = 0: gửi lại</text><text x="650" y="180" text-anchor="middle" fill="#6b7280">chọn k = 1: chờ 1 khe</text><rect x="810" y="150" width="280" height="44" rx="8" fill="#fed7aa" stroke="#1f2937" stroke-width="2"/><text x="950" y="180" text-anchor="middle" fill="#1f2937">gửi lại khung B</text><rect x="510" y="250" width="280" height="44" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="650" y="280" text-anchor="middle" fill="#1f2937">A thành công</text><rect x="810" y="250" width="280" height="44" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="950" y="280" text-anchor="middle" fill="#1f2937">B thành công</text><text x="1250" y="278" text-anchor="middle" fill="#6b7280">dây rảnh</text><text x="200" y="360">sau va chạm thứ nhất, mỗi máy tự chọn k = 0 hoặc k = 1; chọn khác nhau thì cả hai thoát</text></g></svg></div>
        say: "Hình này chia thời gian thành các khe, mỗi khe vừa đủ cho một khung. Ở khe 0, máy A và máy B cùng phát, tín hiệu chồng lên nhau trên dây, nên cả hai khung đều hỏng. Đây là va chạm thứ nhất, nên mỗi máy tự chọn ngẫu nhiên k bằng 0 hoặc 1. Máy A chọn 0 nên gửi lại ngay ở khe 1, còn máy B chọn 1 nên chờ một khe. Nhờ hai lựa chọn khác nhau, khe 1 dành cho A, khe 2 dành cho B, và cả hai đều thành công. Nếu chẳng may cả hai chọn cùng một số, chúng lại va chạm, và lần sau khoảng chọn sẽ rộng gấp đôi."

  - id: aloha_ex
    kind: example
    title: "Mười máy, mỗi máy muốn gửi ở 5% số khe"
    checks:
      - "abs(10 * 0.05 - 0.5) < 1e-12"
      - "round(0.5 * math.exp(-2 * 0.5), 3) == 0.184 and round(0.5 * math.exp(-0.5), 3) == 0.303"
      - "round(10 * 0.5 * math.exp(-1), 2) == 1.84 and round(10 * 0.5 * math.exp(-0.5), 2) == 3.03 and round(3.03 / 1.84, 1) == 1.6"
    steps:
      - show: |
          <p><b>Bước 1 — tính $G$:</b> 10 máy, mỗi máy muốn gửi ở 5% số khe: $G = 10 \cdot 0{,}05 = \hl{0{,}5}$ khung mỗi khe.</p>
        say: "Bước 1, tính G cho mười máy trong ví dụ mở đầu, với số minh hoạ. Mỗi máy muốn gửi ở 5 phần trăm số khe, nên G bằng 10 nhân 0 phẩy 05, bằng 0 phẩy 5 khung trong thời gian của mỗi khung."
      - show: |
          <p><b>Bước 2 — ALOHA thuần:</b> $G e^{-2G} = 0{,}5 \cdot e^{-2 \cdot 0{,}5} \approx \hl{0{,}184}$, tức 18,4% thời gian có khung thành công.</p>
        say: "Bước 2, thay G bằng 0 phẩy 5 vào công thức của ALOHA thuần. Hai nhân 0 phẩy 5 bằng 1, nên ta có 0 phẩy 5 nhân e mũ trừ 1, xấp xỉ 0 phẩy 184. Vậy chỉ 18 phẩy 4 phần trăm thời gian có khung thành công, đúng con số ở đầu bài."
      - show: |
          <p><b>Bước 3 — ALOHA chia khe:</b> $G e^{-G} = 0{,}5 \cdot e^{-0{,}5} \approx \hl{0{,}303}$, tức 30,3%.</p>
        say: "Bước 3, cũng với G bằng 0 phẩy 5, thay vào công thức của ALOHA chia khe. Ta có 0 phẩy 5 nhân e mũ trừ 0 phẩy 5, xấp xỉ 0 phẩy 303, tức 30 phẩy 3 phần trăm, vì khoảng dễ va chạm chỉ còn một khe."
      - show: |
          <table class="t"><tr><th>đường dây 10 triệu bit mỗi giây</th><th>phần thành công</th><th>dữ liệu có ích</th></tr>
          <tr><td>ALOHA thuần</td><td>0,184</td><td>$10 \cdot 0{,}184 = 1{,}84$ triệu bit mỗi giây</td></tr>
          <tr><td>ALOHA chia khe</td><td>0,303</td><td>$10 \cdot 0{,}303 = 3{,}03$ triệu bit mỗi giây</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước 4, đổi ra tốc độ có ích trên một đường dây 10 triệu bit mỗi giây, cũng là số minh hoạ. Với ALOHA thuần, 10 nhân 0 phẩy 184 chỉ còn 1 phẩy 84 triệu bit mỗi giây. Với ALOHA chia khe, 10 nhân 0 phẩy 303 được 3 phẩy 03 triệu bit mỗi giây, gấp khoảng 1 phẩy 6 lần chỉ nhờ phát đúng đầu khe."

  - id: example
    kind: example
    title: "Bộ chuyển mạch tự học"
    checks:
      - "[a for a, _ in alg.learn_switch([('A', 'B', 1), ('B', 'A', 2), ('A', 'B', 1), ('C', 'A', 1)])] == ['tràn', 'gửi cổng 1', 'gửi cổng 2', 'lọc']"
      - "alg.learn_switch([('A', 'B', 1), ('B', 'A', 2), ('A', 'B', 1), ('C', 'A', 1)])[-1][1] == {'A': 1, 'B': 2, 'C': 1}"
    steps:
      - show: |
          <p>Mỗi khung tới, bộ chuyển mạch <b>ghi</b> “máy nguồn ở cổng vào”, rồi tra máy đích:</p>
          <table class="t"><tr><th>khung</th><th>cổng vào</th><th>bảng sau khi học</th><th>hành động</th></tr>
          <tr><td>A → B</td><td>1</td><td>A:1</td><td>chưa biết B → <b>tràn</b> ra mọi cổng khác</td></tr>
          <tr><td>B → A</td><td>2</td><td>A:1, B:2</td><td>gửi cổng 1</td></tr>
          <tr><td>A → B</td><td>1</td><td>A:1, B:2</td><td>gửi cổng 2 — không còn tràn</td></tr>
          <tr><td>C → A</td><td>1</td><td>A:1, B:2, C:1</td><td>A ở chính cổng 1 → <b>lọc</b> (không gửi)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Mỗi khung tới, bộ chuyển mạch ghi lại máy nguồn nằm ở cổng vào, rồi tra máy đích. Khung đầu tiên từ A tới B, chưa biết B ở đâu, nên tràn ra mọi cổng khác. Khung B gửi A đi vào cổng 2, giờ đã biết A ở cổng 1, nên gửi đúng cổng 1. Khung A gửi B tiếp theo đi thẳng cổng 2, không còn tràn. Khung C gửi A đi vào cổng 1, mà A cũng ở cổng 1, nên bộ chuyển mạch lọc bỏ, không gửi đi đâu."
      - show: |
          <div class="box key">Mỗi cổng của bộ chuyển mạch là một đường riêng, hai chiều cùng lúc — không còn chia sẻ dây, nên <b>không còn va chạm</b>.</div>
        say: "Mỗi cổng của bộ chuyển mạch là một đường riêng, truyền hai chiều cùng lúc, không còn chia sẻ dây, nên cũng không còn va chạm."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "len(range(2 ** 3)) == 8"
      - "all(sum(1 for a in range(2 ** n) for b in range(2 ** n) if a == b) == 2 ** n and (2 ** n) ** 2 == [4, 16, 64][n - 1] for n in (1, 2, 3))"
      - "[round(g * math.exp(-g), 4) for g in (0.9, 1, 1.1)] == [0.3659, 0.3679, 0.3662]"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>trả lời</th></tr>
          <tr><td><b>vì sao chia khe gấp đôi?</b></td><td>khoảng dễ va chạm ngắn đi một nửa, từ 2 độ dài khung còn 1</td></tr>
          <tr><td><b>lùi ngẫu nhiên</b></td><td>sau va chạm thứ 3, có $2^3 = 8$ lựa chọn $k = 0, \dots, 7$; càng va chạm, khoảng chọn càng rộng, nên càng ít khả năng lại trùng</td></tr>
          <tr><td><b>bảng chuyển mạch</b></td><td>mỗi dòng phải đến từ một khung đã đi <b>vào</b> cổng đó</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Tự kiểm bằng ba câu hỏi. Một, vì sao chia khe gấp đôi hiệu suất? Vì khoảng dễ va chạm ngắn đi một nửa, từ 2 độ dài khung còn 1. Hai, sau va chạm thứ 3 có 8 lựa chọn, k từ 0 tới 7, và càng va chạm nhiều thì khoảng chọn càng rộng, nên càng ít khả năng lại trùng nhau. Ba, mỗi dòng trong bảng chuyển mạch phải đến từ một khung đã đi vào cổng đó."
      - clear: true
        show: |
          <table class="t"><tr><th>va chạm thứ $n$</th><th>số lựa chọn $2^n$</th><th>số cặp (A, B)</th><th>cặp trùng nhau</th><th>khả năng lại va chạm</th></tr>
          <tr><td>1</td><td>2</td><td>$2 \cdot 2 = 4$</td><td>2</td><td>$\frac{2}{4} = \frac{1}{2}$</td></tr>
          <tr><td>2</td><td>4</td><td>$4 \cdot 4 = 16$</td><td>4</td><td>$\frac{4}{16} = \frac{1}{4}$</td></tr>
          <tr><td>3</td><td>8</td><td>$8 \cdot 8 = 64$</td><td>8</td><td>$\frac{8}{64} = \frac{1}{8}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Kiểm câu thứ hai bằng đường khác, ta đếm thẳng mọi cặp lựa chọn của hai máy A và B. Sau va chạm thứ nhất, mỗi máy có 2 lựa chọn, nên có 4 cặp, trong đó 2 cặp trùng nhau, khả năng lại va chạm là một nửa. Sau va chạm thứ hai, có 16 cặp, chỉ 4 cặp trùng, còn một phần tư. Sau va chạm thứ ba, có 64 cặp, 8 cặp trùng, còn một phần tám. Đếm thẳng cho thấy đúng như lời giải thích, mỗi lần va chạm thì khả năng trùng lại giảm một nửa."
      - show: |
          <table class="t"><tr><th>$G$</th><th>0,9</th><th>1</th><th>1,1</th></tr>
          <tr><td>ALOHA chia khe $G e^{-G}$</td><td>0,3659</td><td><b>0,3679</b></td><td>0,3662</td></tr></table>
        focus: [1, "1.2", 1]
        say: "Kiểm mức tối đa 36 phẩy 8 phần trăm của ALOHA chia khe bằng cách thử các giá trị G nằm hai bên số 1. Tại G bằng 0 phẩy 9 được 0 phẩy 3659, tại G bằng 1 được 0 phẩy 3679, tại G bằng 1 phẩy 1 được 0 phẩy 3662. Cả hai bên đều thấp hơn, nên đỉnh nằm ở G bằng 1, khớp với bảng so sánh lúc trước."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay mắc"
    checks:
      - "3 * 1 == 3 and 3 - 1 == 2 and round(1 / 3, 3) == 0.333"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lẫn bộ chuyển mạch với bộ định tuyến <b class="red">(sai)</b>
          <br><span class="note">Bộ chuyển mạch học và chuyển theo <b>địa chỉ MAC</b>, trong một mạng. Bộ định tuyến chuyển theo <b>địa chỉ IP</b>, nối các mạng với nhau.</span></div>
        say: "Lỗi thứ nhất, lẫn bộ chuyển mạch với bộ định tuyến. Bộ chuyển mạch học và chuyển theo địa chỉ MAC, trong một mạng, còn bộ định tuyến chuyển theo địa chỉ IP, nối các mạng với nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ lùi ngẫu nhiên là chờ một khoảng cố định <b class="red">(sai)</b>
          <br><span class="note">Nếu hai máy cùng chờ đúng một khoảng, chúng lại va chạm mãi. Ngẫu nhiên là để <b>tách</b> chúng ra.</span></div>
        say: "Lỗi thứ hai, nghĩ lùi ngẫu nhiên là chờ một khoảng cố định. Nếu hai máy cùng chờ đúng một khoảng thì chúng lại va chạm mãi, chọn ngẫu nhiên là để tách chúng ra."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ Ethernet ngày nay vẫn va chạm thường xuyên <b class="red">(lỗi thời)</b>
          <br><span class="note">Cơ chế va chạm chỉ còn trong lịch sử và trong sóng không dây.</span></div>
          <table class="t"><tr><th>cách nối</th><th>va chạm?</th></tr>
          <tr><td>dây chung, Ethernet đời đầu</td><td>có</td></tr>
          <tr><td>bộ chuyển mạch, hai chiều cùng lúc</td><td>không</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ ba, nghĩ Ethernet ngày nay vẫn va chạm thường xuyên. Dây chung là Ethernet đời đầu, còn nối qua bộ chuyển mạch, hai chiều cùng lúc, thì không còn va chạm nữa."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tưởng địa chỉ MAC dùng được để tìm đường trên Internet <b class="red">(sai)</b>
          <br><span class="note">MAC chỉ có nghĩa trong một đoạn mạng; qua mỗi bộ định tuyến, phần đầu Ethernet được thay mới, còn địa chỉ IP giữ nguyên.</span></div>
        say: "Lỗi thứ tư, tưởng địa chỉ MAC dùng được để tìm đường trên Internet. Địa chỉ MAC chỉ có nghĩa trong một đoạn mạng, qua mỗi bộ định tuyến phần đầu Ethernet được thay mới, còn địa chỉ IP thì giữ nguyên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5 (người đã đi làm).</b> Nghĩ hết va chạm là hết nghẽn <b class="red">(sai)</b></div>
          <table class="t"><tr><th>đại lượng</th><th>số minh hoạ</th></tr>
          <tr><td>3 máy cùng gửi tới một máy chủ, mỗi máy 1 tỉ bit mỗi giây</td><td>vào: $3 \cdot 1 = 3$ tỉ bit mỗi giây</td></tr>
          <tr><td>cổng ra máy chủ</td><td>chỉ 1 tỉ bit mỗi giây</td></tr>
          <tr><td>phần dư phải chờ trong bộ đệm</td><td>$3 - 1 = 2$ tỉ bit mỗi giây</td></tr></table>
          <p class="note">Bộ đệm đầy thì khung bị bỏ. Người làm nghề đo hàng đợi ở <b>cổng ra</b>, không chỉ đếm va chạm.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ năm hay gặp ở người đã đi làm, nghĩ rằng hết va chạm là hết nghẽn. Lấy số minh hoạ, ba máy cùng gửi tới một máy chủ, mỗi máy 1 tỉ bit mỗi giây, tổng cộng 3 tỉ bit mỗi giây đổ vào. Nhưng cổng ra nối tới máy chủ chỉ chở được 1 tỉ bit mỗi giây. Phần dư, 3 trừ 1 bằng 2 tỉ bit mỗi giây, phải xếp hàng trong bộ đệm của bộ chuyển mạch, giống trễ hàng đợi ở bài 1, khi gói tới nhanh hơn đường ra. Bộ đệm đầy thì khung bị bỏ, nên người làm nghề đo hàng đợi ở cổng ra, chứ không chỉ đếm va chạm."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[a for a, _ in alg.learn_switch([('A', 'B', 1), ('B', 'A', 2), ('A', 'B', 1), ('C', 'A', 1), ('B', 'C', 2), ('D', 'B', 3)])][4:] == ['gửi cổng 1', 'gửi cổng 2']"
      - "alg.learn_switch([('A', 'B', 1), ('B', 'A', 2), ('A', 'B', 1), ('C', 'A', 1), ('B', 'C', 2), ('D', 'B', 3)])[-1][1] == {'A': 1, 'B': 2, 'C': 1, 'D': 3}"
    steps:
      - show: |
          <p>Tiếp bảng trên (A:1, B:2, C:1). Hai khung tới:</p>
          <table class="t"><tr><th>câu</th><th>khung</th><th>cổng vào</th><th>hỏi</th></tr>
          <tr><td>1</td><td>B → C</td><td>2</td><td>bộ chuyển mạch làm gì?</td></tr>
          <tr><td>2</td><td>D → B</td><td>3</td><td>bảng thành gì, khung đi đâu?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, tiếp tục từ bảng vừa rồi. Câu một, khung từ B tới C đi vào cổng 2, bộ chuyển mạch làm gì? Câu hai, khung từ D tới B đi vào cổng 3, bảng thành gì, và khung đi đâu? Dừng video và làm ra giấy."
        pause: 12
      - show: |
          <table class="t"><tr><th>câu 1: B → C, vào cổng 2</th><th>kết quả</th></tr>
          <tr><td>học nguồn: B ở cổng 2</td><td>đã có, giữ nguyên A:1, B:2, C:1</td></tr>
          <tr><td>tra đích: C ở cổng 1, khác cổng vào 2</td><td><b>gửi cổng 1</b></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, ta làm đúng hai việc như trong ví dụ. Trước hết học nguồn, B ở cổng 2 thì bảng đã có rồi, nên bảng giữ nguyên. Sau đó tra đích, C nằm ở cổng 1, khác cổng vào là 2, nên gửi ra cổng 1."
      - show: |
          <table class="t"><tr><th>câu 2: D → B, vào cổng 3</th><th>kết quả</th></tr>
          <tr><td>học nguồn: D ở cổng 3</td><td>bảng thành A:1, B:2, C:1, D:3</td></tr>
          <tr><td>tra đích: B ở cổng 2, khác cổng vào 3</td><td><b>gửi cổng 2</b></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, bộ chuyển mạch học D ở cổng 3, bảng có đủ bốn máy. Tiếp theo tra đích, so với cổng vào là cổng 3. B nằm ở cổng 2, nên khung được gửi ra cổng 2."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">dây chung → va chạm</span><span class="a">→</span>
          <span class="n">nghe, phát hiện, lùi ngẫu nhiên</span><span class="a">→</span>
          <span class="n">chia khe: hiệu suất gấp đôi</span><span class="a">→</span>
          <span class="n">bộ chuyển mạch: mỗi cổng một đường</span></div>
        say: "Tổng kết lại, dây chung gây va chạm, nên máy phải nghe trước, phát hiện va chạm, và lùi ngẫu nhiên. Chia khe làm hiệu suất tối đa gấp đôi, còn bộ chuyển mạch cho mỗi cổng một đường riêng nên hết va chạm."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi nhiều bên tranh một tài nguyên mà không có trọng tài, sự ngẫu nhiên là cách rẻ nhất để phá thế bế tắc.</div>
        say: "Điều cần mang theo, khi nhiều bên tranh một tài nguyên mà không có trọng tài, chọn ngẫu nhiên là cách rẻ nhất để phá thế bế tắc."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): địa chỉ để đi qua nhiều mạng — <b>địa chỉ IPv4</b> và <b>chia mạng con</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học loại địa chỉ dùng để đi qua nhiều mạng, là địa chỉ IPv4, và cách chia mạng con. Hẹn gặp bạn ở bài tiếp theo."
