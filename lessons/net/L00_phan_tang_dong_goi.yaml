scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một lá thư, nhiều lớp phong bì"
    checks:
      - "round(100 * 1460 / 1518, 1) == 96.2"
    steps:
      - show: |
          <p>Bạn bấm mở một trang web. Dữ liệu của trang được bỏ vào phong bì của TCP, rồi phong bì của IP, rồi phong bì của Ethernet — mỗi lớp ghi địa chỉ riêng của nó.</p>
          <p>Trong một khung Ethernet đầy, cứ 1518 byte thì 58 byte là “phong bì”, còn lại 1460 byte là dữ liệu.</p>
          <div class="box key">Hôm nay: năm tầng của Internet, cách đóng gói, và cái giá của các phần đầu.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, khi bạn bấm mở một trang web, dữ liệu của trang được bỏ vào phong bì của TCP, rồi phong bì của IP, rồi phong bì của Ethernet. Mỗi lớp phong bì ghi địa chỉ riêng của tầng đó. Trong một khung Ethernet đầy, cứ 1518 byte thì 58 byte là phong bì, còn 1460 byte là dữ liệu. Hôm nay ta học năm tầng của Internet, cách đóng gói, và cái giá của các phần đầu."

  # ───────────────────────── 2. CHUẨN BỊ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: byte, bit và tỉ lệ phần trăm"
    checks:
      - "20 * 8 == 160 and 1460 * 8 == 11680"
      - "45 / 50 * 100 == 90 and 100 - 90 == 10"
    steps:
      - show: |
          <p>Một <b>byte</b> gồm 8 <b>bit</b>. Phần đầu IP tối thiểu 20 byte là $20 \times 8 = 160$ bit.</p>
          <p>Bài này đo kích thước bằng byte, viết tắt B: 20 B nghĩa là 20 byte.</p>
        focus: [1, 1, 2]
        say: "Trước khi vào bài, ta ôn hai điều sẽ dùng. Thứ nhất, một byte gồm 8 bit, nên phần đầu IP tối thiểu 20 byte là 20 nhân 8, bằng 160 bit. Trên màn hình, chữ B viết tắt cho byte, ví dụ 20 B nghĩa là 20 byte."
      - show: |
          <p>Tỉ lệ có ích $=$ phần có ích chia toàn bộ, nhân 100. Ví dụ một thùng 50 lít đựng 45 lít nước:</p>
          $$\frac{45}{50} \times 100 = 90\%$$
          <p>Phần còn lại $100 - 90 = 10\%$ là phần bị chiếm chỗ.</p>
        focus: [1, 2, 3, 0]
        say: "Thứ hai là tỉ lệ phần trăm, bằng phần có ích chia cho toàn bộ, rồi nhân 100. Ví dụ một thùng 50 lít đựng 45 lít nước, thì 45 chia 50 nhân 100 bằng 90 phần trăm. Phần còn lại, 100 trừ 90 bằng 10 phần trăm, là phần bị chiếm chỗ. Lát nữa ta tính đúng như vậy cho một khung dữ liệu."

  # ───────────────────────── 2b. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: năm tầng"
    steps:
      - show: |
          <table class="t"><tr><th>tầng</th><th>việc</th><th>ví dụ</th><th>đơn vị dữ liệu</th></tr>
          <tr><td>5. ứng dụng</td><td>nghĩa của dữ liệu: trang web, tên miền</td><td>HTTP, DNS</td><td>thông điệp</td></tr>
          <tr><td>4. vận chuyển</td><td>nối <b>tiến trình</b> với tiến trình, qua số cổng</td><td>TCP, UDP</td><td>đoạn</td></tr>
          <tr><td>3. mạng</td><td>đưa gói từ <b>máy</b> này tới máy kia qua nhiều chặng</td><td>IP</td><td>gói</td></tr>
          <tr><td>2. liên kết</td><td>chuyển khung qua <b>một</b> chặng</td><td>Ethernet, Wi-Fi</td><td>khung</td></tr>
          <tr><td>1. vật lý</td><td>đẩy từng bit qua dây, sóng, cáp quang</td><td>—</td><td>bit</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Để dễ quản lý, Internet chia toàn bộ công việc thành năm tầng chồng lên nhau. Tầng ứng dụng lo nghĩa của dữ liệu, như trang web hay tên miền. Tầng vận chuyển nối một tiến trình với một tiến trình ở máy kia, qua số cổng. Tầng mạng đưa gói từ máy này tới máy kia qua nhiều chặng. Tầng liên kết chuyển khung qua đúng một chặng. Tầng vật lý đẩy từng bit qua dây đồng, sóng vô tuyến hay cáp quang."
      - show: |
          <p><b>Giao thức</b> = bộ quy tắc hai máy thống nhất trước: gửi gì, theo thứ tự nào, trả lời ra sao. TCP, IP, Ethernet là tên các giao thức.</p>
          <p><b>Tiến trình</b> = một chương trình đang chạy, ví dụ trình duyệt. <b>Số cổng</b> = con số ghi trong phần đầu để máy nhận biết phải giao dữ liệu cho tiến trình nào.</p>
        focus: [1, 1, 2, 2]
        say: "Bảng dùng vài từ cần giải thích. Giao thức là bộ quy tắc mà hai máy thống nhất trước, gửi gì, theo thứ tự nào, và trả lời ra sao, còn TCP, IP và Ethernet là tên của các giao thức. Tiến trình là một chương trình đang chạy, ví dụ trình duyệt của bạn. Số cổng là con số ghi trong phần đầu, để máy nhận biết phải giao dữ liệu cho tiến trình nào."

  # ───────────────────────── 3. ĐÓNG GÓI ─────────────────────────
  - id: encap
    kind: concept
    title: "Đóng gói: mỗi tầng thêm phần đầu của mình"
    steps:
      - show: |
          <table class="t"><tr><th>Ethernet đầu<br>14 B</th><th>IP<br>20 B</th><th>TCP<br>20 B</th><th style="min-width:360px">dữ liệu ứng dụng<br>1460 B</th><th>Ethernet đuôi<br>4 B</th></tr></table>
          <ul><li>Đi <b>xuống</b> ở máy gửi: mỗi tầng bọc phần của tầng trên và thêm phần đầu của mình.</li>
          <li>Đi <b>lên</b> ở máy nhận: mỗi tầng đọc đúng phần đầu của mình, bóc ra, đưa phần còn lại lên trên.</li>
          <li>Bộ chuyển mạch (nối các máy trong <b>một</b> mạng) chỉ đọc tới phần đầu Ethernet; bộ định tuyến (chuyển gói <b>giữa</b> các mạng) đọc tới phần đầu IP.</li></ul>
        focus: [1, "2.1", "2.2", "2.3", "2.3"]
        say: "Đây là một khung Ethernet đầy, nhìn từ trái sang phải. Ở máy gửi, dữ liệu đi xuống, mỗi tầng bọc phần của tầng trên và thêm phần đầu của mình. Ở máy nhận, dữ liệu đi lên, mỗi tầng đọc đúng phần đầu của mình, bóc ra, rồi đưa phần còn lại lên trên. Bộ chuyển mạch là thiết bị nối các máy trong cùng một mạng, nó chỉ đọc tới phần đầu Ethernet. Còn bộ định tuyến là thiết bị chuyển gói giữa các mạng, nó đọc tới phần đầu IP."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nhìn gói dữ liệu được bọc từng lớp"
    checks:
      - "1460 + 20 == 1480 and 1480 + 20 == 1500 and 1500 + 14 + 4 == 1518"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g font-size="24" fill="#1f2937"><line x1="40" y1="40" x2="40" y2="330" stroke="#374151" stroke-width="4"/><path d="M28,322 L40,346 L52,322 z" fill="#374151"/><text x="70" y="68">5. ứng dụng</text><rect x="860" y="30" width="380" height="56" fill="#d1fae5" stroke="#065f46" stroke-width="2"/><text x="1050" y="67" text-anchor="middle">dữ liệu 1460</text><text x="1360" y="68" font-weight="700">1460 B</text><text x="70" y="148">4. vận chuyển</text><rect x="860" y="110" width="380" height="56" fill="#d1fae5" stroke="#065f46" stroke-width="2"/><text x="1050" y="147" text-anchor="middle">dữ liệu 1460</text><rect x="740" y="110" width="120" height="56" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="800" y="147" text-anchor="middle" fill="#2a78d6">TCP 20</text><text x="1360" y="148" font-weight="700">1480 B</text><text x="70" y="228">3. mạng</text><rect x="860" y="190" width="380" height="56" fill="#d1fae5" stroke="#065f46" stroke-width="2"/><text x="1050" y="227" text-anchor="middle">dữ liệu 1460</text><rect x="740" y="190" width="120" height="56" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="800" y="227" text-anchor="middle" fill="#2a78d6">TCP 20</text><rect x="620" y="190" width="120" height="56" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><text x="680" y="227" text-anchor="middle" fill="#eb6834">IP 20</text><text x="1360" y="228" font-weight="700">1500 B</text><text x="70" y="308">2. liên kết</text><rect x="860" y="270" width="380" height="56" fill="#d1fae5" stroke="#065f46" stroke-width="2"/><text x="1050" y="307" text-anchor="middle">dữ liệu 1460</text><rect x="740" y="270" width="120" height="56" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="800" y="307" text-anchor="middle" fill="#2a78d6">TCP 20</text><rect x="620" y="270" width="120" height="56" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><text x="680" y="307" text-anchor="middle" fill="#eb6834">IP 20</text><rect x="500" y="270" width="120" height="56" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="560" y="307" text-anchor="middle" fill="#7c3aed">Eth 14</text><rect x="1240" y="270" width="100" height="56" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="1290" y="307" text-anchor="middle" fill="#7c3aed">đuôi 4</text><text x="1360" y="308" font-weight="700">1518 B</text><text x="70" y="384" font-size="22" fill="#374151">máy gửi: đi xuống, mỗi tầng bọc thêm phần đầu của mình</text></g></svg></div>
          <p>Ở máy nhận, đi ngược từ dưới lên: mỗi tầng bóc đúng lớp của mình.</p>
        focus: [1, 1, 1, 1, 2]
        say: "Hình này vẽ đường đi xuống ở máy gửi, mỗi hàng là một tầng. Tầng ứng dụng có 1460 byte dữ liệu. Tầng vận chuyển bọc thêm 20 byte TCP, thành 1480 byte. Tầng mạng bọc thêm 20 byte IP, thành 1500 byte, rồi tầng liên kết thêm 14 byte đầu và 4 byte đuôi Ethernet, thành 1518 byte. Ở máy nhận, mọi thứ đi ngược từ dưới lên, mỗi tầng bóc đúng lớp của mình rồi đưa phần bên trong lên trên."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Phần đầu chiếm bao nhiêu?"
    checks:
      - "1460 + 20 + 20 + 18 == 1518 and 20 + 20 + 18 == 58"
      - "round(100 * 1460 / 1518, 1) == 96.2"
      - "round(100 * 100 / (100 + 58), 1) == 63.3"
      - "58 / 158 > 1 / 3 and round(100 * 58 / 158, 1) == 36.7"
    steps:
      - show: |
          <p><b>Bước 1 — cộng các phần đầu:</b> TCP 20, IP 20, Ethernet $14 + 4 = 18$: $20 + 20 + 18 = 58$ byte.</p>
        say: "Bước một, cộng các phần đầu với kích thước tối thiểu. TCP 20 byte, IP 20 byte, Ethernet gồm 14 byte đầu và 4 byte đuôi, tức 18 byte, cộng lại là 58 byte phong bì."
      - show: |
          <p><b>Bước 2 — độ dài khung đầy</b> (byte):</p>
          $$1460 + 58 = 1518$$
        focus: [1, 2]
        say: "Bước hai, cộng phần dữ liệu vào để được cả khung. Khung đầy gồm 1460 byte dữ liệu, cộng 20 byte TCP, 20 byte IP, và 18 byte Ethernet, tổng 1518 byte."
      - show: |
          <p><b>Bước 3 — hiệu suất khung đầy:</b> $\frac{1460}{1518} \approx \hl{96{,}2\%}$.</p>
        say: "Bước ba, hiệu suất là phần dữ liệu chia cho cả khung. Hiệu suất là 1460 chia 1518, xấp xỉ 96 phẩy 2 phần trăm, tức gần như toàn bộ khung là dữ liệu."
      - clear: true
        show: |
          <p><b>Bước 4 — gói nhỏ</b> 100 byte dữ liệu (ví dụ một tin nhắn ngắn), phong bì vẫn 58 byte:</p>
          $$100 + 58 = 158$$
        focus: [1, 2]
        say: "Bước bốn, đổi sang một gói nhỏ chỉ 100 byte dữ liệu, ví dụ một tin nhắn ngắn. Phong bì vẫn là 58 byte, nên khung dài 100 cộng 58, bằng 158 byte."
      - show: |
          <p><b>Bước 5:</b> $\frac{100}{100 + 58} \approx \hl{63{,}3\%}$ — <b>hơn một phần ba</b> khung là phong bì.</p>
          <div class="box key">Phần đầu có kích thước gần như cố định, nên dữ liệu càng nhỏ thì tỉ lệ lãng phí càng lớn.</div>
        focus: [1, 1, 1, 2]
        say: "Bước năm, tính hiệu suất của gói nhỏ này. Với gói nhỏ chỉ 100 byte dữ liệu, như một tin nhắn ngắn, hiệu suất là 100 chia 158, xấp xỉ 63 phẩy 3 phần trăm. Như vậy hơn một phần ba khung là phong bì. Vì phần đầu có kích thước gần như cố định, nên dữ liệu càng nhỏ thì tỉ lệ lãng phí càng lớn."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "all(d / (d + 58) < (d + 1) / (d + 59) for d in range(1, 1461))"
      - "round(100 * 58 / 1518, 1) == 3.8 and round(3.8 + 96.2, 1) == 100 and round(36.7 + 63.3, 1) == 100"
      - "1518 * 8 == 12144 and 1460 * 8 == 11680 and round(100 * 11680 / 12144, 1) == 96.2"
    steps:
      - show: |
          <p><b>Đường khác 1:</b> tính phần phong bì trước, rồi cộng với phần có ích — phải ra đúng 100%.</p>
          <table class="t"><tr><th>khung</th><th>phong bì</th><th>có ích</th><th>cộng</th></tr>
          <tr><td>1518 B</td><td>$\frac{58}{1518} \approx 3{,}8\%$</td><td>96,2%</td><td>100% ✓</td></tr>
          <tr><td>158 B</td><td>$\frac{58}{158} \approx 36{,}7\%$</td><td>63,3%</td><td>100% ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Tự kiểm bằng một đường khác, vì phong bì và dữ liệu chia nhau trọn khung, nên ta tính phần phong bì trước rồi cộng với phần có ích, kết quả phải ra đúng 100 phần trăm. Với khung đầy, 58 chia 1518 xấp xỉ 3 phẩy 8 phần trăm, cộng 96 phẩy 2 được 100. Với gói nhỏ, 58 chia 158 xấp xỉ 36 phẩy 7 phần trăm, cộng 63 phẩy 3 cũng được 100."
      - show: |
          <p><b>Đường khác 2 — đổi đơn vị sang bit:</b> khung $1518 \times 8 = 12\,144$ bit, dữ liệu $1460 \times 8 = 11\,680$ bit.</p>
          $$\frac{11\,680}{12\,144} \approx 96{,}2\%$$
        focus: [1, 1, 2]
        say: "Đường khác thứ hai là đổi đơn vị sang bit. Khung đầy là 1518 nhân 8, bằng 12 nghìn 144 bit, phần dữ liệu là 1460 nhân 8, bằng 11 nghìn 680 bit. Chia hai số này vẫn được 96 phẩy 2 phần trăm, vì nhân cả tử và mẫu với 8 thì tỉ lệ không đổi."
      - show: |
          <ol><li><b>Cộng lại:</b> tổng các phần phải bằng kích thước khung đã cho.</li>
          <li><b>Giới hạn:</b> dữ liệu càng lớn, hiệu suất càng gần 100% nhưng không bao giờ tới.</li>
          <li><b>Đọc đúng tầng:</b> hỏi “thiết bị này đọc tới phần đầu nào?” — bộ chuyển mạch: Ethernet; bộ định tuyến: IP.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, cộng các phần lại, tổng phải bằng kích thước khung đã cho. Hai, kiểm giới hạn, dữ liệu càng lớn thì hiệu suất càng gần 100 phần trăm, nhưng không bao giờ tới, vì phần đầu luôn còn đó. Ba, hỏi thiết bị này đọc tới phần đầu nào, bộ chuyển mạch đọc tới Ethernet, bộ định tuyến đọc tới IP."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp"
    checks:
      - "1518 - 18 - 20 - 32 == 1448 and round(100 * 1448 / 1518, 1) == 95.4"
      - "1000 * 100 == 100000 and 1000 * 158 == 158000 and 158000 / 100000 == 1.58"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ Internet chạy đúng mô hình 7 tầng OSI <b class="red">(sai)</b>
          <br><span class="note">Bảy tầng là mô hình <b>tham chiếu</b> để gọi tên. Internet dùng chồng giao thức năm tầng ở trên; hai tầng trình bày và phiên nằm trong ứng dụng.</span></div>
        say: "Lỗi thứ nhất, nghĩ Internet chạy đúng mô hình bảy tầng. Mô hình bảy tầng là mô hình tham chiếu để gọi tên. Internet dùng chồng giao thức năm tầng ở trên, còn hai tầng trình bày và phiên nằm luôn trong ứng dụng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Coi 20 byte là kích thước cố định của TCP và IP <b class="red">(chưa đủ)</b>
          <br><span class="note">20 byte là mức <b>tối thiểu</b>. Có tuỳ chọn thì phần đầu dài hơn, hiệu suất thấp hơn.</span></div>
          <p>Ví dụ TCP thêm 12 byte tuỳ chọn (phần đầu 32 byte), khung vẫn 1518 byte:</p>
          $$\frac{1518 - 18 - 20 - 32}{1518} = \frac{1448}{1518} \approx 95{,}4\%$$
        focus: [1, 1, 3]
        say: "Lỗi thứ hai, coi 20 byte là kích thước cố định của phần đầu TCP và IP. Đó là mức tối thiểu, có tuỳ chọn thì phần đầu dài hơn, và hiệu suất thấp hơn. Ví dụ khi TCP thêm 12 byte tuỳ chọn, phần đầu TCP dài 32 byte, khung vẫn dài 1518 byte, thì dữ liệu chỉ còn 1448 byte, hiệu suất khoảng 95 phẩy 4 phần trăm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ tầng dưới hiểu nội dung tầng trên <b class="red">(sai)</b>
          <br><span class="note">Với IP, cả đoạn TCP chỉ là dữ liệu cần chở. Mỗi tầng chỉ tin vào phần đầu của chính nó.</span></div>
        say: "Lỗi thứ ba, nghĩ tầng dưới hiểu nội dung của tầng trên. Với IP, cả đoạn TCP chỉ là dữ liệu cần chở, mỗi tầng chỉ đọc và tin vào phần đầu của chính nó."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ hai tầng cùng tên ở hai máy nói chuyện trực tiếp <b class="red">(chỉ là lôgic)</b>
          <br><span class="note">TCP ở máy bạn “nói” với TCP ở máy chủ, nhưng dữ liệu thật đi xuống tới tầng vật lý, qua dây, rồi đi lên.</span></div>
        say: "Lỗi thứ tư, nghĩ hai tầng cùng tên ở hai máy nói chuyện trực tiếp với nhau. TCP ở máy bạn nói với TCP ở máy chủ chỉ về mặt lô-gích, còn dữ liệu thật đi xuống tới tầng vật lý, qua dây, rồi mới đi lên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5 — người đã đi làm.</b> Ước băng thông (tốc độ đường truyền) cần thuê chỉ theo dữ liệu ứng dụng <b class="red">(thiếu 58%)</b></div>
          <table class="t"><tr><th>1000 tin mỗi giây, mỗi tin 100 byte</th><th>byte mỗi giây</th></tr>
          <tr><td>chỉ đếm dữ liệu: $1000 \times 100$</td><td>100 000</td></tr>
          <tr><td>đếm cả khung: $1000 \times 158$</td><td>158 000 — gấp 1,58 lần</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ năm hay gặp ở người đã đi làm, ước băng thông, tức tốc độ đường truyền cần thuê, chỉ theo dữ liệu của ứng dụng. Một dịch vụ gửi 1000 tin mỗi giây, mỗi tin 100 byte, chỉ đếm dữ liệu thì là 100 nghìn byte mỗi giây. Đếm cả khung, mỗi tin thành 158 byte, nên thật ra là 158 nghìn byte mỗi giây, gấp 1 phẩy 58 lần. Với tin nhỏ, luôn cộng phần đầu vào trước khi ước băng thông."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "500 + 58 == 558 and round(100 * 500 / 558, 1) == 89.6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Một đoạn TCP mang 500 byte dữ liệu, đi qua IP và Ethernet với phần đầu tối thiểu. Khung dài bao nhiêu byte, hiệu suất bao nhiêu?</td></tr>
          <tr><td>2</td><td>Bộ chuyển mạch làm việc ở tầng nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một đoạn TCP mang 500 byte dữ liệu, đi qua IP và Ethernet với phần đầu tối thiểu. Khung dài bao nhiêu byte, và hiệu suất là bao nhiêu? Câu hai, bộ chuyển mạch làm việc ở tầng nào? Dừng video và làm ra giấy."
        pause: 12
      - show: |
          <p>① Bước 1: phong bì tối thiểu vẫn là 58 byte, nên khung dài $500 + 58 = \hl{558}$ byte.</p>
        say: "Đáp án câu một, khung dài 500 cộng 58 bằng 558 byte. Ta cộng đúng 58 vì phong bì tối thiểu của TCP, IP và Ethernet không đổi, dù dữ liệu dài hay ngắn."
      - show: |
          <p>① Bước 2: hiệu suất $\frac{500}{558} \approx \hl{89{,}6\%}$ — nằm giữa gói nhỏ 63,3% và khung đầy 96,2%, đúng như dự đoán.</p>
        say: "Bước thứ hai, hiệu suất là 500 chia 558, xấp xỉ 89 phẩy 6 phần trăm. Con số này nằm giữa 63 phẩy 3 của gói nhỏ và 96 phẩy 2 của khung đầy, đúng như ta dự đoán, vì 500 byte nằm giữa 100 và 1460."
      - show: |
          <p>② Tầng <b>liên kết</b> — nó chỉ đọc phần đầu Ethernet.</p>
        say: "Câu hai, bộ chuyển mạch làm việc ở tầng liên kết, vì nó chỉ đọc phần đầu Ethernet để chọn cổng ra, không mở phần đầu IP bên trong."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">5 tầng, mỗi tầng một việc</span><span class="a">→</span>
          <span class="n">đi xuống: thêm phần đầu</span><span class="a">→</span>
          <span class="n">đi lên: bóc phần đầu</span><span class="a">→</span>
          <span class="n">phần đầu là chi phí cố định</span></div>
        say: "Tổng kết lại, Internet chia việc thành năm tầng, mỗi tầng một việc. Đi xuống thì mỗi tầng thêm phần đầu, đi lên thì mỗi tầng bóc phần đầu của mình. Phần đầu là một chi phí gần như cố định."
      - show: |
          <div class="box key"><b>Tư duy:</b> chia một hệ thống phức tạp thành các tầng chỉ nói chuyện với tầng kề bên — đổi một tầng (Wi-Fi thay cáp) mà không đụng tới các tầng khác.</div>
        say: "Điều cần mang theo, hãy chia một hệ thống phức tạp thành các tầng chỉ nói chuyện với tầng kề bên. Khi đó ta đổi được một tầng, như thay cáp bằng sóng không dây, mà không phải đụng tới các tầng khác."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): một gói đi mất bao lâu? Bốn <b>loại trễ</b>: truyền, lan truyền, xử lý, hàng đợi.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta hỏi một gói tin đi mất bao lâu, qua bốn loại trễ, gồm trễ truyền, trễ lan truyền, trễ xử lý và trễ hàng đợi. Hẹn gặp bạn ở bài tiếp theo."
