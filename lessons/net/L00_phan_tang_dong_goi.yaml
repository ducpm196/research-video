scenes:
- id: hook
  kind: hook
  title: Một lá thư, nhiều lớp phong bì
  checks:
  - round(100 * 1460 / 1518, 1) == 96.2
  steps:
  - show: '<p>Bạn bấm mở một trang web. Dữ liệu của trang được bỏ vào phong bì của TCP, rồi phong bì của IP, rồi phong bì của Ethernet — mỗi lớp ghi địa chỉ riêng của nó.</p>

      <p>Trong một khung Ethernet đầy, cứ 1518 byte thì 58 byte là “phong bì”, còn lại 1460 byte là dữ liệu.</p>

      <div class="box key">Hôm nay: năm tầng của Internet, cách đóng gói, và cái giá của các phần đầu.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    say: Chào bạn, khi bạn bấm mở một trang web, dữ liệu của trang được bỏ vào phong bì của TCP, rồi phong bì của IP, rồi phong bì của Ethernet. Mỗi lớp phong bì ghi địa chỉ riêng của tầng đó. Trong một khung Ethernet đầy, cứ 1518 byte thì 58 byte là phong bì, còn 1460 byte là dữ liệu. Hôm nay ta học năm tầng của Internet, cách đóng gói, và cái giá của các phần đầu. Hiểu trọn vẹn cơ chế bọc phong bì từng lớp giúp giải thích từ hiệu suất đường truyền thực tế tới lý do một tầng thay đổi mà hệ thống vẫn chạy trơn.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: byte, bit và tỉ lệ phần trăm'
  checks:
  - 20 * 8 == 160 and 1460 * 8 == 11680
  - 45 / 50 * 100 == 90 and 100 - 90 == 10
  steps:
  - show: '<p>Một <b>byte</b> gồm 8 <b>bit</b>. Phần đầu IP tối thiểu 20 byte là $20 \times 8 = 160$ bit.</p>

      <p>Bài này đo kích thước bằng byte, viết tắt B: 20 B nghĩa là 20 byte.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Trước khi vào bài, ta ôn hai điều sẽ dùng. Thứ nhất, một byte gồm 8 bit, nên phần đầu IP tối thiểu 20 byte là 20 nhân 8, bằng 160 bit. Trên màn hình, chữ B viết tắt cho byte, ví dụ 20 B nghĩa là 20 byte.
  - show: '<p>Tỉ lệ có ích $=$ phần có ích chia toàn bộ, nhân 100. Ví dụ một thùng 50 lít đựng 45 lít nước:</p>

      $$\frac{45}{50} \times 100 = 90\%$$

      <p>Phần còn lại $100 - 90 = 10\%$ là phần bị chiếm chỗ.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 0
    - 3
    say: Thứ hai là tỉ lệ phần trăm, bằng phần có ích chia cho toàn bộ, rồi nhân 100. Ví dụ một thùng 50 lít đựng 45 lít nước, thì 45 chia 50 nhân 100 bằng 90 phần trăm. Phần còn lại, 100 trừ 90 bằng 10 phần trăm, là phần bị chiếm chỗ. Lát nữa ta tính đúng như vậy cho một khung dữ liệu. Tách bạch phần tải hữu ích thực sự khỏi kích thước trọn gói làm nổi bật gánh nặng điều khiển cố định trên mọi gói tin nhỏ.
- id: sym
  kind: symbol
  title: 'Giải mã: năm tầng'
  steps:
  - show: '<table class="t"><tr><th>tầng</th><th>việc</th><th>ví dụ</th><th>đơn vị dữ liệu</th></tr>

      <tr><td>5. ứng dụng</td><td>nghĩa của dữ liệu: trang web, tên miền</td><td>HTTP, DNS</td><td>thông điệp</td></tr>

      <tr><td>4. vận chuyển</td><td>nối <b>tiến trình</b> với tiến trình, qua số cổng</td><td>TCP, UDP</td><td>đoạn</td></tr>

      <tr><td>3. mạng</td><td>đưa gói từ <b>máy</b> này tới máy kia qua nhiều chặng</td><td>IP</td><td>gói</td></tr>

      <tr><td>2. liên kết</td><td>chuyển khung qua <b>một</b> chặng</td><td>Ethernet, Wi-Fi</td><td>khung</td></tr>

      <tr><td>1. vật lý</td><td>đẩy từng bit qua dây, sóng, cáp quang</td><td>—</td><td>bit</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.6'
    say: Để dễ quản lý, Internet chia toàn bộ công việc thành năm tầng chồng lên nhau. Tầng ứng dụng lo nghĩa của dữ liệu, như trang web hay tên miền. Tầng vận chuyển nối một tiến trình với một tiến trình ở máy kia, qua số cổng. Tầng mạng đưa gói từ máy này tới máy kia qua nhiều chặng. Tầng liên kết chuyển khung qua đúng một chặng. Tầng vật lý đẩy từng bit qua dây đồng, sóng vô tuyến hay cáp quang. Kiến trúc phân năm tầng gán cho mỗi lớp một trách nhiệm độc lập cùng đơn vị dữ liệu chuẩn riêng như thông điệp, phân đoạn, gói, khung và bít.
  - show: '<p><b>Giao thức</b> = bộ quy tắc hai máy thống nhất trước: gửi gì, theo thứ tự nào, trả lời ra sao. TCP, IP, Ethernet là tên các giao thức.</p>

      <p><b>Tiến trình</b> = một chương trình đang chạy, ví dụ trình duyệt. <b>Số cổng</b> = con số ghi trong phần đầu để máy nhận biết phải giao dữ liệu cho tiến trình nào.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bảng dùng vài từ cần giải thích. Giao thức là bộ quy tắc mà hai máy thống nhất trước, gửi gì, theo thứ tự nào, và trả lời ra sao, còn TCP, IP và Ethernet là tên của các giao thức. Tiến trình là một chương trình đang chạy, ví dụ trình duyệt của bạn. Số cổng là con số ghi trong phần đầu, để máy nhận biết phải giao dữ liệu cho tiến trình nào.
- id: encap
  kind: concept
  title: 'Đóng gói: mỗi tầng thêm phần đầu của mình'
  steps:
  - show: '<table class="t"><tr><th>Ethernet đầu<br>14 B</th><th>IP<br>20 B</th><th>TCP<br>20 B</th><th style="min-width:360px">dữ liệu ứng dụng<br>1460 B</th><th>Ethernet đuôi<br>4 B</th></tr></table>

      <ul><li>Đi <b>xuống</b> ở máy gửi: mỗi tầng bọc phần của tầng trên và thêm phần đầu của mình.</li>

      <li>Đi <b>lên</b> ở máy nhận: mỗi tầng đọc đúng phần đầu của mình, bóc ra, đưa phần còn lại lên trên.</li>

      <li>Bộ chuyển mạch (nối các máy trong <b>một</b> mạng) chỉ đọc tới phần đầu Ethernet; bộ định tuyến (chuyển gói <b>giữa</b> các mạng) đọc tới phần đầu IP.</li></ul>

      '
    focus:
    - 1
    - '2.1'
    - '2.2'
    - '2.3'
    - '2.3'
    - '2.3'
    say: Đây là một khung Ethernet đầy, nhìn từ trái sang phải. Ở máy gửi, dữ liệu đi xuống, mỗi tầng bọc phần của tầng trên và thêm phần đầu của mình. Ở máy nhận, dữ liệu đi lên, mỗi tầng đọc đúng phần đầu của mình, bóc ra, rồi đưa phần còn lại lên trên. Bộ chuyển mạch là thiết bị nối các máy trong cùng một mạng, nó chỉ đọc tới phần đầu Ethernet. Còn bộ định tuyến là thiết bị chuyển gói giữa các mạng, nó đọc tới phần đầu IP. Quá trình đóng gói đi xuống bổ sung phần đầu ở từng lớp tạo nên khung hoàn chỉnh chuẩn bị phát ra đường cáp vật lý.
