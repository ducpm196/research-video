    - 2
    say: Hình này vẽ đường đi xuống ở máy gửi, mỗi hàng là một tầng. Tầng ứng dụng có 1460 byte dữ liệu. Tầng vận chuyển bọc thêm 20 byte TCP, thành 1480 byte. Tầng mạng bọc thêm 20 byte IP, thành 1500 byte, rồi tầng liên kết thêm 14 byte đầu và 4 byte đuôi Ethernet, thành 1518 byte. Ở máy nhận, mọi thứ đi ngược từ dưới lên, mỗi tầng bóc đúng lớp của mình rồi đưa phần bên trong lên trên. Chồng kích thước đi xuống từ một nghìn bốn trăm sáu mươi lên một nghìn năm trăm mười tám bai cho thấy kích cỡ phần đầu cộng dồn qua bốn lớp.
- id: example
  kind: example
  title: Phần đầu chiếm bao nhiêu?
  checks:
  - 1460 + 20 + 20 + 18 == 1518 and 20 + 20 + 18 == 58
  - round(100 * 1460 / 1518, 1) == 96.2
  - round(100 * 100 / (100 + 58), 1) == 63.3
  - 58 / 158 > 1 / 3 and round(100 * 58 / 158, 1) == 36.7
  steps:
  - show: '<p><b>Bước 1 — cộng các phần đầu:</b> TCP 20, IP 20, Ethernet $14 + 4 = 18$: $20 + 20 + 18 = 58$ byte.</p>

      '
    say: Bước một, cộng các phần đầu với kích thước tối thiểu. TCP 20 byte, IP 20 byte, Ethernet gồm 14 byte đầu và 4 byte đuôi, tức 18 byte, cộng lại là 58 byte phong bì.
  - show: '<p><b>Bước 2 — độ dài khung đầy</b> (byte):</p>

      $$1460 + 58 = 1518$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, cộng phần dữ liệu vào để được cả khung. Khung đầy gồm 1460 byte dữ liệu, cộng 20 byte TCP, 20 byte IP, và 18 byte Ethernet, tổng 1518 byte.
  - show: '<p><b>Bước 3 — hiệu suất khung đầy:</b> $\frac{1460}{1518} \approx \hl{96{,}2\%}$.</p>

      '
    say: Bước ba, hiệu suất là phần dữ liệu chia cho cả khung. Hiệu suất là 1460 chia 1518, xấp xỉ 96 phẩy 2 phần trăm, tức gần như toàn bộ khung là dữ liệu.
  - clear: true
    show: '<p><b>Bước 4 — gói nhỏ</b> 100 byte dữ liệu (ví dụ một tin nhắn ngắn), phong bì vẫn 58 byte:</p>

      $$100 + 58 = 158$$

      '
    focus:
    - 1
    - 2
    say: Bước bốn, đổi sang một gói nhỏ chỉ 100 byte dữ liệu, ví dụ một tin nhắn ngắn. Phong bì vẫn là 58 byte, nên khung dài 100 cộng 58, bằng 158 byte.
  - show: '<p><b>Bước 5:</b> $\frac{100}{100 + 58} \approx \hl{63{,}3\%}$ — <b>hơn một phần ba</b> khung là phong bì.</p>

      <div class="box key">Phần đầu có kích thước gần như cố định, nên dữ liệu càng nhỏ thì tỉ lệ lãng phí càng lớn.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước năm, tính hiệu suất của gói nhỏ này. Với gói nhỏ chỉ 100 byte dữ liệu, như một tin nhắn ngắn, hiệu suất là 100 chia 158, xấp xỉ 63 phẩy 3 phần trăm. Như vậy hơn một phần ba khung là phong bì. Vì phần đầu có kích thước gần như cố định, nên dữ liệu càng nhỏ thì tỉ lệ lãng phí càng lớn. Chuyển sang gói tin ngắn một trăm bai đẩy chi phí phong bì vọt lên hơn một phần ba dung lượng đường truyền thực tế.
  - clear: true
    show: '<p><b>Minh hoạ Python tính tổng khung Ethernet và hiệu suất dữ liệu</b></p><div class="code"><div>payload, tcp, ip, eth = 1460, 20, 20, 18</div><div>frame = payload + tcp + ip + eth</div><div>print(f"frame={frame} eff={100*payload/frame:.1f}%")</div><div style="color:#059669"># Kết quả: frame=1518 eff=96.2%</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã Python cộng ba lớp phần đầu rồi tính hiệu suất phần dữ liệu có ích trong khung. Khung đầy đạt chín mươi sáu phẩy hai phần trăm hiệu suất truyền tải.
- id: verify
  kind: check
  title: Tự kiểm
  checks:
  - all(d / (d + 58) < (d + 1) / (d + 59) for d in range(1, 1461))
  - round(100 * 58 / 1518, 1) == 3.8 and round(3.8 + 96.2, 1) == 100 and round(36.7 + 63.3, 1) == 100
  - 1518 * 8 == 12144 and 1460 * 8 == 11680 and round(100 * 11680 / 12144, 1) == 96.2
  steps:
  - show: '<p><b>Đường khác 1:</b> tính phần phong bì trước, rồi cộng với phần có ích — phải ra đúng 100%.</p>

      <table class="t"><tr><th>khung</th><th>phong bì</th><th>có ích</th><th>cộng</th></tr>

      <tr><td>1518 B</td><td>$\frac{58}{1518} \approx 3{,}8\%$</td><td>96,2%</td><td>100% ✓</td></tr>

      <tr><td>158 B</td><td>$\frac{58}{158} \approx 36{,}7\%$</td><td>63,3%</td><td>100% ✓</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Tự kiểm bằng một đường khác, vì phong bì và dữ liệu chia nhau trọn khung, nên ta tính phần phong bì trước rồi cộng với phần có ích, kết quả phải ra đúng 100 phần trăm. Với khung đầy, 58 chia 1518 xấp xỉ 3 phẩy 8 phần trăm, cộng 96 phẩy 2 được 100. Với gói nhỏ, 58 chia 158 xấp xỉ 36 phẩy 7 phần trăm, cộng 63 phẩy 3 cũng được 100. Cộng tỉ lệ phần phong bì và phần tải hữu ích luôn khớp trọn trăm phần trăm đóng vai trò phép kiểm chéo tức thì trên mọi cỡ khung.
  - show: '<p><b>Đường khác 2 — đổi đơn vị sang bit:</b> khung $1518 \times 8 = 12\,144$ bit, dữ liệu $1460 \times 8 = 11\,680$ bit.</p>

      $$\frac{11\,680}{12\,144} \approx 96{,}2\%$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đường khác thứ hai là đổi đơn vị sang bit. Khung đầy là 1518 nhân 8, bằng 12 nghìn 144 bit, phần dữ liệu là 1460 nhân 8, bằng 11 nghìn 680 bit. Chia hai số này vẫn được 96 phẩy 2 phần trăm, vì nhân cả tử và mẫu với 8 thì tỉ lệ không đổi.
  - show: '<ol><li><b>Cộng lại:</b> tổng các phần phải bằng kích thước khung đã cho.</li>

      <li><b>Giới hạn:</b> dữ liệu càng lớn, hiệu suất càng gần 100% nhưng không bao giờ tới.</li>

      <li><b>Đọc đúng tầng:</b> hỏi “thiết bị này đọc tới phần đầu nào?” — bộ chuyển mạch: Ethernet; bộ định tuyến: IP.</li></ol>

      '
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    say: Tự kiểm bằng ba cách. Một, cộng các phần lại, tổng phải bằng kích thước khung đã cho. Hai, kiểm giới hạn, dữ liệu càng lớn thì hiệu suất càng gần 100 phần trăm, nhưng không bao giờ tới, vì phần đầu luôn còn đó. Ba, hỏi thiết bị này đọc tới phần đầu nào, bộ chuyển mạch đọc tới Ethernet, bộ định tuyến đọc tới IP.
- id: pitfalls
  kind: pitfall
  title: 5 lỗi hay gặp
  checks:
  - 1518 - 18 - 20 - 32 == 1448 and round(100 * 1448 / 1518, 1) == 95.4
  - 1000 * 100 == 100000 and 1000 * 158 == 158000 and 158000 / 100000 == 1.58
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ Internet chạy đúng mô hình 7 tầng OSI <b class="red">(sai)</b>

      <br><span class="note">Bảy tầng là mô hình <b>tham chiếu</b> để gọi tên. Internet dùng chồng giao thức năm tầng ở trên; hai tầng trình bày và phiên nằm trong ứng dụng.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ Internet chạy đúng mô hình bảy tầng. Mô hình bảy tầng là mô hình tham chiếu để gọi tên. Internet dùng chồng giao thức năm tầng ở trên, còn hai tầng trình bày và phiên nằm luôn trong ứng dụng. Mô hình bảy tầng mang tính tham chiếu khái niệm, còn hạ tầng mạng toàn cầu thực tế vận hành mượt mà trên chồng giao thức năm tầng gọn nhẹ hơn. Hiểu ranh giới đóng gói từng tầng giúp thay thế hạ tầng truyền dẫn mà không phải sửa mã ứng dụng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Coi 20 byte là kích thước cố định của TCP và IP <b class="red">(chưa đủ)</b>

      <br><span class="note">20 byte là mức <b>tối thiểu</b>. Có tuỳ chọn thì phần đầu dài hơn, hiệu suất thấp hơn.</span></div>

      <p>Ví dụ TCP thêm 12 byte tuỳ chọn (phần đầu 32 byte), khung vẫn 1518 byte:</p>

      $$\frac{1518 - 18 - 20 - 32}{1518} = \frac{1448}{1518} \approx 95{,}4\%$$

      '
    focus:
    - 1
    - 1
    - 3
    - 3
    say: Lỗi thứ hai, coi 20 byte là kích thước cố định của phần đầu TCP và IP. Đó là mức tối thiểu, có tuỳ chọn thì phần đầu dài hơn, và hiệu suất thấp hơn. Ví dụ khi TCP thêm 12 byte tuỳ chọn, phần đầu TCP dài 32 byte, khung vẫn dài 1518 byte, thì dữ liệu chỉ còn 1448 byte, hiệu suất khoảng 95 phẩy 4 phần trăm. Năm mươi tám bai chỉ là tổng cộng của các phần đầu tối thiểu không chứa tuỳ chọn; thêm tuỳ chọn mở rộng có thể khiến hiệu suất giảm sâu hơn.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nghĩ tầng dưới hiểu nội dung tầng trên <b class="red">(sai)</b>

      <br><span class="note">Với IP, cả đoạn TCP chỉ là dữ liệu cần chở. Mỗi tầng chỉ tin vào phần đầu của chính nó.</span></div>

      '
    say: Lỗi thứ ba, nghĩ tầng dưới hiểu nội dung của tầng trên. Với IP, cả đoạn TCP chỉ là dữ liệu cần chở, mỗi tầng chỉ đọc và tin vào phần đầu của chính nó. Tính đóng kín giữa các tầng buộc bộ chuyển mạch tầng dưới chỉ đọc phần đầu địa chỉ vật lý mà hoàn toàn không mở ruột dữ liệu ứng dụng bên trong.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Nghĩ hai tầng cùng tên ở hai máy nói chuyện trực tiếp <b class="red">(chỉ là lôgic)</b>

      <br><span class="note">TCP ở máy bạn “nói” với TCP ở máy chủ, nhưng dữ liệu thật đi xuống tới tầng vật lý, qua dây, rồi đi lên.</span></div>

      '
    say: Lỗi thứ tư, nghĩ hai tầng cùng tên ở hai máy nói chuyện trực tiếp với nhau. TCP ở máy bạn nói với TCP ở máy chủ chỉ về mặt lô-gích, còn dữ liệu thật đi xuống tới tầng vật lý, qua dây, rồi mới đi lên.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 5 — người đã đi làm.</b> Ước băng thông (tốc độ đường truyền) cần thuê chỉ theo dữ liệu ứng dụng <b class="red">(thiếu 58%)</b></div>

      <table class="t"><tr><th>1000 tin mỗi giây, mỗi tin 100 byte</th><th>byte mỗi giây</th></tr>

      <tr><td>chỉ đếm dữ liệu: $1000 \times 100$</td><td>100 000</td></tr>

      <tr><td>đếm cả khung: $1000 \times 158$</td><td>158 000 — gấp 1,58 lần</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Lỗi thứ năm hay gặp ở người đã đi làm, ước băng thông, tức tốc độ đường truyền cần thuê, chỉ theo dữ liệu của ứng dụng. Một dịch vụ gửi 1000 tin mỗi giây, mỗi tin 100 byte, chỉ đếm dữ liệu thì là 100 nghìn byte mỗi giây. Đếm cả khung, mỗi tin thành 158 byte, nên thật ra là 158 nghìn byte mỗi giây, gấp 1 phẩy 58 lần. Với tin nhỏ, luôn cộng phần đầu vào trước khi ước băng thông.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 500 + 58 == 558 and round(100 * 500 / 558, 1) == 89.6
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Một đoạn TCP mang 500 byte dữ liệu, đi qua IP và Ethernet với phần đầu tối thiểu. Khung dài bao nhiêu byte, hiệu suất bao nhiêu?</td></tr>

      <tr><td>2</td><td>Bộ chuyển mạch làm việc ở tầng nào?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, một đoạn TCP mang 500 byte dữ liệu, đi qua IP và Ethernet với phần đầu tối thiểu. Khung dài bao nhiêu byte, và hiệu suất là bao nhiêu? Câu hai, bộ chuyển mạch làm việc ở tầng nào? Dừng video và làm ra giấy.
    pause: 12
  - show: '<p>① Bước 1: phong bì tối thiểu vẫn là 58 byte, nên khung dài $500 + 58 = \hl{558}$ byte.</p>

      '
    say: Đáp án câu một, khung dài 500 cộng 58 bằng 558 byte. Ta cộng đúng 58 vì phong bì tối thiểu của TCP, IP và Ethernet không đổi, dù dữ liệu dài hay ngắn.
  - show: '<p>① Bước 2: hiệu suất $\frac{500}{558} \approx \hl{89{,}6\%}$ — nằm giữa gói nhỏ 63,3% và khung đầy 96,2%, đúng như dự đoán.</p>

      '
    say: Bước thứ hai, hiệu suất là 500 chia 558, xấp xỉ 89 phẩy 6 phần trăm. Con số này nằm giữa 63 phẩy 3 của gói nhỏ và 96 phẩy 2 của khung đầy, đúng như ta dự đoán, vì 500 byte nằm giữa 100 và 1460.
  - show: '<p>② Tầng <b>liên kết</b> — nó chỉ đọc phần đầu Ethernet.</p>

      '
    say: Câu hai, bộ chuyển mạch làm việc ở tầng liên kết, vì nó chỉ đọc phần đầu Ethernet để chọn cổng ra, không mở phần đầu IP bên trong.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/NET/L00
  steps:
  - show: <table class='t'><tr><th>Thực hành NET:L00</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính phần đầu chiếm bao nhiêu trong một khung</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>payload=1460 tcp=20 ip=20 eth=18</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh NET L00 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 0 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Tính tổng chi phí phần đầu cố định, toàn khung truyền và tỉ lệ hiệu suất phần trăm theo kích thước tải nhận từ đầu vào chuẩn. Bảo đảm xuất chuẩn từng trường dữ liệu theo định dạng một chữ số thập phân.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai NET:L00</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (cộng phần đầu)</b></td><td>Cộng kích thước phần đầu tầng giao vận, mạng và liên kết</td></tr><tr><td><b>Bước 2 (khung đầy)</b></td><td>Cộng phần tải dữ liệu vào tổng phần đầu vừa tính</td></tr><tr><td><b>Bước 3 (hiệu suất)</b></td><td>Lấy tỉ lệ phần tải hữu ích trên tổng kích thước khung</td></tr></table>
    say: Gợi ý cài đặt bài số 0 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 3 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>headers_B=58</div><div>frame_B=1518</div><div>efficiency_pct=96.2%</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">5 tầng, mỗi tầng một việc</span><span class="a">→</span>

      <span class="n">đi xuống: thêm phần đầu</span><span class="a">→</span>

      <span class="n">đi lên: bóc phần đầu</span><span class="a">→</span>

      <span class="n">phần đầu là chi phí cố định</span></div>

      '
    say: Tổng kết lại, Internet chia việc thành năm tầng, mỗi tầng một việc. Đi xuống thì mỗi tầng thêm phần đầu, đi lên thì mỗi tầng bóc phần đầu của mình. Phần đầu là một chi phí gần như cố định. Nhờ giao tiếp chỉ thông qua ranh giới hai tầng kề nhau, thay thế cáp quang hay sóng không dây diễn ra êm đẹp mà phần mềm ứng dụng chẳng cần viết lại. Mỗi tầng thêm một phần đầu điều khiển tạo nên trật tự vững chắc nhưng đánh đổi chút chi phí phụ trội.
  - show: '<div class="box key"><b>Tư duy:</b> chia một hệ thống phức tạp thành các tầng chỉ nói chuyện với tầng kề bên — đổi một tầng (Wi-Fi thay cáp) mà không đụng tới các tầng khác.</div>

      '
    say: Điều cần mang theo, hãy chia một hệ thống phức tạp thành các tầng chỉ nói chuyện với tầng kề bên. Khi đó ta đổi được một tầng, như thay cáp bằng sóng không dây, mà không phải đụng tới các tầng khác.
  - clear: true
    show: '<p class="note">Bài sau (bài 1): một gói đi mất bao lâu? Bốn <b>loại trễ</b>: truyền, lan truyền, xử lý, hàng đợi.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 1, ta hỏi một gói tin đi mất bao lâu, qua bốn loại trễ, gồm trễ truyền, trễ lan truyền, trễ xử lý và trễ hàng đợi. Hẹn gặp bạn ở bài tiếp theo.
af2: true
