 20</text><rect x="500" y="270" width="120" height="56" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="560" y="307" text-anchor="middle" fill="#7c3aed">Eth 14</text><rect x="1240" y="270" width="100" height="56" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="1290" y="307" text-anchor="middle" fill="#7c3aed">đuôi 4</text><text x="1360" y="308" font-weight="700">1518 B</text><text x="70" y="384" font-size="22" fill="#374151">máy gửi: đi xuống, mỗi tầng bọc thêm phần đầu của mình</text></g></svg></div>

      <p>Ở máy nhận, đi ngược từ dưới lên: mỗi tầng bóc đúng lớp của mình.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
