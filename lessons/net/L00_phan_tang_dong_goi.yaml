# Quy ước: tên giao thức (TCP, IP, HTTP…) viết nguyên trên màn hình và trong lời đọc; lexicon_vi.NET.yaml quyết định cách đọc
#   (probe audit/net/probes/p1_viet_tat.md). Kích thước phần đầu là mức TỐI THIỂU (không có tuỳ chọn): TCP 20 B, IP 20 B,
#   Ethernet 14 B đầu + 4 B đuôi kiểm lỗi = 18 B. Mọi tỉ lệ trong bài do check tính.
objectives:
  - "Kể năm tầng và việc của mỗi tầng"
  - "Hiểu đóng gói: mỗi tầng thêm phần đầu của mình"
  - "Tính phần đầu chiếm bao nhiêu trong một khung"
