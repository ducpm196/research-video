  - {sentence: "Tầng mạng bọc thêm 20 byte IP, thành 1500 byte, rồi tầng liên kết thêm 14 byte đầu và 4 byte đuôi Ethernet, thành 1518 byte.", reason: "ASR chép “Tần mạng bọc thêm 20 vai IP, thành 1.500 vai, rồi tầng liên kết thêm 14 vai đầu và 4 vai đuôi Ethernet, thành 1.518 vai.” (0.833): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tầng/tần — NOT_VERIFIED bằng tai người"}
