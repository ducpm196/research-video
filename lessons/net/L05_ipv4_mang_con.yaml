 width="36" height="46" fill="#fed7aa" stroke="#1f2937" stroke-width="1.5"/><text x="1306" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="1326" y="70" width="36" height="46" fill="#fed7aa" stroke="#1f2937" stroke-width="1.5"/><text x="1344" y="101" text-anchor="middle" font-family="monospace" font-size="20">1</text><line x1="1135" y1="62" x2="1135" y2="126" stroke="#b91c1c" stroke-width="4"/><text x="617" y="152" text-anchor="middle" fill="#1d4ed8">26 bit đầu: phần mạng</text><text x="1249" y="152" text-anchor="middle" fill="#c2410c">6 bit: phần máy</text><rect x="100" y="210" width="320" height="56" fill="#e0f2fe" stroke="#1f2937" stroke-width="2"/><text x="260" y="245" text-anchor="middle">.0 … .63</text><rect x="420" y="210" width="320" height="56" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="580" y="245" text-anchor="middle">.64 … .127</text><rect x="740" y="210" width="320" height="56" fill="#e0f2fe" stroke="#1f2937" stroke-width="2"/><text x="900" y="245" text-anchor="middle">.128 … .191</text><rect x="1060" y="210" width="320" height="56" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="1220" y="245" text-anchor="middle">.192 … .255</text><text x="100" y="198">byte cuối, từ 0 tới 255, chia thành 4 khối, mỗi khối 64 địa chỉ:</text><path d="M485,272 l-12,22 l24,0 z" fill="#b91c1c"/><text x="485" y="322" text-anchor="middle" fill="#b91c1c" font-weight="bold">đuôi 77</text><text x="555" y="360" fill="#b91c1c">rơi vào khối .64 … .127: hai bit mạng của byte cuối là 01</text></g></svg></div>
        say: "Hình trên vẽ đủ 32 bit của địa chỉ 192 chấm 168 chấm 10 chấm 77, mỗi ô là một bit. Tiền tố 26 đặt một vạch đỏ sau bit thứ 26, bên trái là phần mạng, bên phải là 6 bit của phần máy. Vạch đỏ cắt ngang byte cuối, nên hai bit đầu của byte cuối thuộc về phần mạng. Hình dưới trải byte cuối thành một trục từ 0 tới 255, và hai bit mạng đó chia trục thành bốn khối, mỗi khối 64 địa chỉ. Đuôi 77 rơi vào khối thứ hai, từ 64 tới 127, đúng như phép tính bằng bit ở khung trước."

  - id: example
    kind: example
    title: "Chia /24 thành bốn /26"
    checks:
      - "alg.split_subnets('192.168.10.0/24', 26) == ['192.168.10.0/26', '192.168.10.64/26', '192.168.10.128/26', '192.168.10.192/26']"
      - "alg.subnet('192.168.10.0/26') == ('192.168.10.0', '192.168.10.63', 62, '192.168.10.1', '192.168.10.62')"
      - "2 ** (32 - 26) - 2 == 62 and 2 ** (26 - 24) == 4"
      - "24 + 2 == 26 and 32 - 26 == 6 and 2 ** 6 == 64 and 64 - 2 == 62 and 62 - 50 == 12"
    steps:
      - show: |
          <p><b>Bước 1 — số mạng con:</b> cần 4 phòng; mượn 2 bit của phần máy làm phần mạng: $2^2 = \hl{4}$ mạng con, tiền tố từ 24 thành $24 + 2 = 26$.</p>
        say: "Bước 1, công ty cần 4 mạng, mà 2 bit tạo ra đúng 2 mũ 2 bằng 4 giá trị. Vì vậy ta mượn 2 bit của phần máy làm phần mạng, và tiền tố tăng từ 24 lên 24 cộng 2, bằng 26."
      - show: |
          <p><b>Bước 2 — cỡ mỗi mạng con:</b> phần máy còn $32 - 26 = 6$ bit, nên mỗi mạng có $2^{6} = \hl{64}$ địa chỉ.</p>
        say: "Bước 2, phần máy còn lại 32 trừ 26, bằng 6 bit. Sáu bit tạo ra 2 mũ 6 bằng 64 giá trị, nên mỗi mạng con có 64 địa chỉ."
      - clear: true
        show: |
          <p><b>Bước 3 — liệt kê:</b> mỗi mạng con bắt đầu sau mạng trước đúng 64 địa chỉ.</p>
          <table class="t"><tr><th>mạng con</th><th>địa chỉ mạng</th><th>máy dùng được</th><th>quảng bá</th></tr>
          <tr><td>1</td><td><code>.0</code></td><td><code>.1</code> … <code>.62</code></td><td><code>.63</code></td></tr>
          <tr><td>2</td><td><code>.64</code></td><td><code>.65</code> … <code>.126</code></td><td><code>.127</code></td></tr>
          <tr><td>3</td><td><code>.128</code></td><td><code>.129</code> … <code>.190</code></td><td><code>.191</code></td></tr>
          <tr><td>4</td><td><code>.192</code></td><td><code>.193</code> … <code>.254</code></td><td><code>.255</code></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước 3, liệt kê bốn mạng con, mỗi mạng bắt đầu sau mạng trước đúng 64 địa chỉ. Mạng con thứ nhất bắt đầu ở 0, máy dùng được từ 1 tới 62, quảng bá ở 63. Mạng con thứ hai bắt đầu ở 64, quảng bá ở 127. Mạng thứ ba bắt đầu ở 128, quảng bá ở 191. Mạng thứ tư bắt đầu ở 192, quảng bá ở 255."
      - show: |
          <p><b>Bước 4 — số máy:</b> bỏ địa chỉ mạng và địa chỉ quảng bá: $2^6 - 2 = 64 - 2 = \hl{62}$ máy — đủ cho phòng 50 máy, còn dư $62 - 50 = 12$ chỗ.</p>
        say: "Bước 4, mỗi mạng phải bỏ đi địa chỉ mạng và địa chỉ quảng bá. Còn lại 64 trừ 2 bằng 62 máy, đủ cho phòng 50 máy. Mỗi phòng còn dư 62 trừ 50, bằng 12 chỗ cho máy mới."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "all(int(s.split('/')[0].split('.')[3]) % 64 == 0 for s in alg.split_subnets('192.168.10.0/24', 26))"
      - "77 // 64 == 1 and 77 % 64 == 13 and 1 * 64 + 13 == 77 and 64 + 64 - 1 == 127 and alg.subnet('192.168.10.64/26')[1] == '192.168.10.127'"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>kiểm gì</th></tr>
          <tr><td><b>bước nhảy</b></td><td>mỗi mạng con dài 64, nên địa chỉ mạng luôn là bội của 64: 0, 64, 128, 192</td></tr>
          <tr><td><b>quảng bá</b></td><td>bằng địa chỉ mạng kế tiếp trừ 1: $64 - 1 = 63$</td></tr>
          <tr><td><b>đếm</b></td><td>4 mạng × 64 địa chỉ = 256, đúng bằng cả dải <code>/24</code></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, mỗi mạng con dài 64, nên địa chỉ mạng luôn là bội của 64, gồm 0, 64, 128 và 192. Hai, địa chỉ quảng bá bằng địa chỉ mạng kế tiếp trừ 1, ví dụ 64 trừ 1 bằng 63. Ba, đếm lại, 4 mạng nhân 64 địa chỉ bằng 256, đúng bằng cả dải tiền tố 24."
      - show: |
          <table class="t"><tr><th>đuôi 77 thuộc mạng con nào?</th><th>cách bằng bit</th><th>cách bằng phép chia</th></tr>
          <tr><td>phép tính</td><td>hai bit mạng của <code>01001101</code> là <code>01</code></td><td>$77 = 1 \cdot 64 + 13$</td></tr>
          <tr><td>mạng con bắt đầu ở</td><td><code>01000000</code> = 64</td><td>$1 \cdot 64 = 64$</td></tr>
          <tr><td>quảng bá</td><td><code>01111111</code> = 127</td><td>$64 + 64 - 1 = 127$</td></tr></table>
        introduces: [cdot]
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Kiểm lại kết quả ở khung bit bằng một đường khác, phép chia có dư cho 64, trong đó chấm giữa là dấu nhân. Bảy mươi bảy chia 64 được 1, dư 13, nên đuôi 77 nằm trong khối thứ hai. Khối đó bắt đầu ở 1 nhân 64, bằng 64. Quảng bá ở 64 cộng 64 trừ 1, bằng 127. Hai cách cho cùng mạng con và cùng địa chỉ quảng bá, nên ta yên tâm."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay mắc"
    checks:
      - "str(__import__('ipaddress').ip_network('192.168.10.100/26', strict=False)) == '192.168.10.64/26'"
      - "2 ** (32 - 30) == 4 and 4 - 2 == 2 and 2 ** (32 - 31) == 2 and 2 ** (32 - 32) == 1"
      - "round(50 * 1.3) == 65 and 65 > 62 and 2 ** (32 - 25) - 2 == 126"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên trừ 2 <b class="red">(sai)</b>
          <br><span class="note">64 địa chỉ nhưng chỉ 62 máy: bỏ địa chỉ mạng và địa chỉ quảng bá.</span></div>
        say: "Lỗi thứ nhất, quên trừ 2. Mạng có 64 địa chỉ nhưng chỉ gán được cho 62 máy, vì bỏ địa chỉ mạng và địa chỉ quảng bá."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy một địa chỉ bất kỳ làm điểm bắt đầu <b class="red">(sai)</b>
          <br><span class="note"><code>192.168.10.100/26</code> không phải một mạng: 100 không là bội của 64. Địa chỉ đó thuộc mạng <code>.64/26</code>.</span></div>
        say: "Lỗi thứ hai, lấy một địa chỉ bất kỳ làm điểm bắt đầu của mạng con. Đuôi 100 với tiền tố 26 không phải là một mạng, vì 100 không là bội của 64, địa chỉ đó thuộc mạng con bắt đầu ở 64."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Áp “trừ 2” cho <code>/31</code> và <code>/32</code> <b class="red">(ngoại lệ)</b>
          </div>
          <table class="t"><tr><th>tiền tố</th><th>số địa chỉ</th><th>dùng được</th></tr>
          <tr><td><code>/30</code></td><td>4</td><td>4 − 2 = 2</td></tr>
          <tr><td><code>/31</code></td><td>2</td><td>cả 2 (liên kết giữa hai bộ định tuyến)</td></tr>
          <tr><td><code>/32</code></td><td>1</td><td>đúng một máy</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ ba, áp quy tắc trừ 2 cho tiền tố 31 và 32. Tiền tố 31 có 2 địa chỉ, dùng cả hai cho một liên kết giữa hai bộ định tuyến, còn tiền tố 32 là đúng một máy."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ mặt nạ và tiền tố là hai thứ khác nhau <b class="red">(chỉ khác cách viết)</b>
          <br><span class="note"><code>/26</code> và <code>255.255.255.192</code> là một: 26 bit 1 đứng đầu.</span></div>
        say: "Lỗi thứ tư, nghĩ mặt nạ và tiền tố là hai thứ khác nhau. Tiền tố 26 và mặt nạ kết thúc bằng 192 là một, cùng là 26 bit 1 đứng đầu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5 (người đã đi làm).</b> Chia mạng con vừa khít số máy hôm nay <b class="red">(thiếu chỗ lớn lên)</b></div>
          <table class="t"><tr><th>phòng 50 máy (số minh hoạ)</th><th>số máy</th><th><code>/26</code>: 62 chỗ</th></tr>
          <tr><td>hôm nay</td><td>50</td><td>đủ</td></tr>
          <tr><td>năm sau tăng 30%</td><td>$50 \cdot 1{,}3 = 65$</td><td class="red">thiếu, vì 65 &gt; 62</td></tr>
          <tr><td>nếu chọn <code>/25</code></td><td>$2^7 - 2 = 126$ chỗ</td><td>đủ</td></tr></table>
          <p class="note">Hết chỗ thì phải đánh số lại cả phòng. Người làm nghề chừa chỗ lớn lên khi chọn tiền tố.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ năm hay gặp ở người đã đi làm, chia mạng con vừa khít số máy của hôm nay. Phòng 50 máy dùng tiền tố 26 có 62 chỗ, hôm nay vẫn đủ. Lấy số minh hoạ, năm sau phòng tăng 30 phần trăm, thành 50 nhân 1 phẩy 3, bằng 65 máy, lớn hơn 62 nên thiếu chỗ. Nếu chọn tiền tố 25 thì có 2 mũ 7 trừ 2, bằng 126 chỗ, vẫn đủ. Hết chỗ thì phải đánh số lại cả phòng, nên người làm nghề luôn chừa chỗ lớn lên khi chọn tiền tố."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.subnet('10.0.0.0/22')[1:3] == ('10.0.3.255', 1022) and 2 ** 10 - 2 == 1022"
      - "2 ** 10 == 1024 and 8 + 8 == 16 and 22 - 16 == 6 and 0b11 == 3 == 2 + 1 and 0b11111111 == 255"
    steps:
      - show: |
          <p>Mạng <code>10.0.0.0/22</code>.</p>
          <ol><li>Phần máy có mấy bit? Dùng được bao nhiêu máy?</li><li>Địa chỉ quảng bá là gì?</li></ol>
        focus: [1, "2.1", "2.1", "2.2", 0]
        say: "Bây giờ đến lượt bạn tự làm, với mạng 10 chấm 0 chấm 0 chấm 0, tiền tố 22. Câu một, phần máy có mấy bit? Mạng dùng được bao nhiêu máy? Câu hai, địa chỉ quảng bá là gì? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $32 - 22 = 10$ bit máy: $2^{10} - 2 = 1024 - 2 = \hl{1022}$ máy.</p>
        say: "Đáp án câu một, phần máy có 32 trừ 22 bằng 10 bit. Mười bit tạo ra 1024 địa chỉ, bỏ địa chỉ mạng và quảng bá, nên dùng được 2 mũ 10 trừ 2, bằng 1022 máy."
      - show: |
          <table class="t"><tr><th>byte</th><th>bit mạng</th><th>bit máy</th><th>cho bit máy toàn 1</th></tr>
          <tr><td>thứ nhất, thứ hai</td><td>8 + 8 = 16</td><td>0</td><td>giữ <code>10.0</code></td></tr>
          <tr><td>thứ ba</td><td>22 − 16 = 6</td><td>2</td><td><code>000000</code><b>11</b> = 3</td></tr>
          <tr><td>thứ tư</td><td>0</td><td>8</td><td><code>11111111</code> = 255</td></tr></table>
          <p>Quảng bá: <code>10.0.3.255</code>.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Câu hai, cho 10 bit máy toàn 1, gồm 2 bit cuối của byte thứ ba và cả byte thứ tư, ta được 10 chấm 0 chấm 3 chấm 255. Để thấy rõ, hai byte đầu là 16 bit mạng, nên giữ nguyên 10 chấm 0. Byte thứ ba còn 22 trừ 16 bằng 6 bit mạng và 2 bit máy, bật hai bit máy được 2 cộng 1, bằng 3. Byte thứ tư toàn bit máy, bật hết được 255. Ghép lại, địa chỉ quảng bá là 10 chấm 0 chấm 3 chấm 255."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">32 bit = mạng + máy</span><span class="a">→</span>
          <span class="n">/n chọn ranh giới</span><span class="a">→</span>
          <span class="n">máy toàn 0 / toàn 1 bị dành</span><span class="a">→</span>
          <span class="n">mượn bit máy để chia mạng con</span></div>
        say: "Tổng kết lại, địa chỉ IPv4 gồm 32 bit chia thành phần mạng và phần máy, tiền tố n chọn ranh giới. Phần máy toàn 0 và toàn 1 được dành riêng, và mượn bit của phần máy là cách chia mạng con."
      - show: |
          <div class="box key"><b>Tư duy:</b> địa chỉ có cấu trúc thứ bậc — giống số nhà trong một con phố trong một quận — nên bộ định tuyến chỉ cần nhìn <b>phần đầu</b>.</div>
        say: "Điều cần mang theo, địa chỉ có cấu trúc thứ bậc, giống số nhà trong một con phố thuộc một quận, nên bộ định tuyến chỉ cần nhìn phần đầu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): bộ định tuyến chọn đường bằng phần đầu địa chỉ ra sao — <b>gom tuyến</b> và <b>khớp tiền tố dài nhất</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta xem bộ định tuyến dùng phần đầu địa chỉ để chọn đường ra sao, qua gom tuyến và khớp tiền tố dài nhất. Hẹn gặp bạn ở bài tiếp theo."
