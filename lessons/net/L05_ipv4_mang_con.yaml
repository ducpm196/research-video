id: L05
course: NET
series: "NET · Mạng máy tính"
title: "Bài 5 — Địa chỉ IPv4 và chia mạng con"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/net.yaml L05; audit/net/verify_net.py L05; RFC 791 (IPv4), RFC 4632 (tiền tố), RFC 3021 (/31 cho liên kết điểm–điểm)"
assumes: [arith, power, dots]
# Quy ước: địa chỉ viết trong <code>; lời đọc nói “chấm” giữa các số và “tiền tố 26” cho “/26”. Mọi địa chỉ mạng, quảng bá,
#   số máy do alg.subnet / alg.split_subnets (thư viện ipaddress của Python) tính. Chuỗi bit tách nhóm 4 trong lời đọc.
objectives:
  - "Đọc địa chỉ IPv4 và tiền tố /n"
  - "Tính địa chỉ mạng, địa chỉ quảng bá, số máy dùng được"
  - "Chia một mạng thành các mạng con bằng nhau"
asr_reviewed:
  - {sentence: "Vạch đỏ cắt ngang byte cuối, nên hai bit đầu của byte cuối thuộc về phần mạng.", reason: "ASR chép “Vặt đỏ cắt ngang bay cuối, nên hai biết đầu của bay cuối thuộc về phần mạng.” (0.765): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: vạch/vặt, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Byte thứ ba còn 22 trừ 16 bằng 6 bit mạng và 2 bit máy, bật hai bit máy được 2 cộng 1, bằng 3.", reason: "ASR chép “Bài thứ 3 còn 22,16 bằng 6 biết mạng và 2 biết máy. Bật 2 biết máy được 2 cộng 1 bằng 3.” (0.821): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: trừ/phẩy, bit/biết, bit/biết, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Để thấy rõ, hai byte đầu là 16 bit mạng, nên giữ nguyên 10 chấm 0.", reason: "ASR chép “Để thấy rõ, hai bay đầu là 16 bích mạng nên giữ nguyên 10.0.” (0.848): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bit/bích, chấm/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Byte thứ tư toàn bit máy, bật hết được 255.", reason: "ASR chép “Bài thứ tư toàn bích máy bật hết được 255.” (0.857): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bit/bích — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình dưới trải byte cuối thành một trục từ 0 tới 255, và hai bit mạng đó chia trục thành bốn khối, mỗi khối 64 địa chỉ.", reason: "ASR chép “hình dưới trải bay cuối thành một trục từ 0 tới 255 và hai biết mạng đó chia trục thành bốn khối, mỗi khối 64 địa chỉ.” (0.939): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, phần máy có mấy bit?", reason: "ASR chép “phần máy có máy biết”: mấy/máy khác thanh, bit/biết nhóm bit; câu 7 từ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Địa chỉ đuôi 77 viết nhị phân là 0 1 0 0, 1 1 0 1.", reason: "ASR chép “0100-1101”: tám chữ số đúng thứ tự (ASR gộp dãy chữ số, nhóm đã biết); 77 khớp"}
  - {sentence: "Câu hai, cho 10 bit máy toàn 1, gồm 2 bit cuối của byte thứ ba và cả byte thứ tư, ta được 10 chấm 0 chấm 3 chấm 255.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Mặt nạ cũng mang ý nghĩa đó, viết bằng số, gồm n bit 1 rồi toàn 0, nên tiền tố 26 có byte cuối là 1 1 0 0, 0 0 0 0, tức 192.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Với tiền tố 26, byte cuối có 2 bit mạng và 6 bit máy.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bốn phòng ban, một dải địa chỉ"
    steps:
      - show: |
          <p>Công ty được cấp dải <code>192.168.10.0/24</code> — 256 địa chỉ. Có bốn phòng, mỗi phòng khoảng 50 máy, muốn tách thành bốn mạng riêng.</p>
          <p>Chia thế nào để mỗi phòng có một mạng, và mỗi mạng dùng được bao nhiêu máy?</p>
          <div class="box key">Hôm nay: địa chỉ IPv4, tiền tố, địa chỉ mạng và quảng bá, và chia mạng con.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, công ty được cấp dải 192 chấm 168 chấm 10 chấm 0, tiền tố 24, gồm 256 địa chỉ. Công ty có bốn phòng, mỗi phòng khoảng 50 máy, và muốn tách thành bốn mạng riêng. Chia thế nào để mỗi phòng có một mạng, và mỗi mạng dùng được bao nhiêu máy? Hôm nay ta học địa chỉ IPv4, tiền tố, địa chỉ mạng, địa chỉ quảng bá, và cách chia mạng con."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: một byte là tám ô có giá trị"
    checks:
      - "[2 ** k for k in range(7, -1, -1)] == [128, 64, 32, 16, 8, 4, 2, 1]"
      - "64 + 8 + 4 + 1 == 77 and format(77, '08b') == '01001101' and 128 + 64 == 192"
      - "2 ** 2 == 4 and 2 ** 6 == 64 and 2 ** 8 == 256 and 2 ** 10 == 1024"
    steps:
      - show: |
          <table class="t"><tr><th>giá trị ô</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>77</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td></tr>
          <tr><td>192</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table>
          <p>$77 = 64 + 8 + 4 + 1$, $\quad 192 = 128 + 64$.</p>
        focus: [1, "1.1", "1.2", "1.3", 2]
        say: "Trước hết, ta ôn lại cách viết một số từ 0 tới 255 bằng tám bit. Tám ô có giá trị 128, 64, 32, 16, 8, 4, 2 và 1, mỗi ô gấp đôi ô bên phải. Số 77 bằng 64 cộng 8 cộng 4 cộng 1, nên các ô 64, 8, 4, 1 bật lên, viết là 0 1 0 0, 1 1 0 1. Số 192 bằng 128 cộng 64, nên chỉ hai ô đầu bật lên. Muốn đổi ngược lại, ta chỉ việc cộng giá trị của các ô đang bật."
      - show: |
          <table class="t"><tr><th>số bit $n$</th><th>2</th><th>6</th><th>8</th><th>10</th></tr>
          <tr><td>số giá trị khác nhau $2^n$</td><td>4</td><td>64</td><td>256</td><td>1024</td></tr></table>
        focus: [0, "1.2", 1]
        say: "Kiến thức thứ hai là đếm số giá trị mà n bit tạo ra được. Mỗi bit có hai cách, nên n bit tạo ra 2 mũ n giá trị: 2 bit cho 4, 6 bit cho 64, 8 bit cho 256, 10 bit cho 1024. Ta sẽ dùng bảng này để đếm số mạng con và số địa chỉ trong mỗi mạng con."

  - id: sym
    kind: symbol
    title: "Giải mã: địa chỉ và tiền tố /n"
    checks:
      - "format(192, '08b') == '11000000'"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>địa chỉ IPv4</td><td>32 bit, viết 4 số từ 0 tới 255 cách nhau dấu chấm</td><td><code>192.168.10.77</code></td></tr>
          <tr><td>tiền tố <code>/n</code></td><td>$n$ bit đầu là <b>phần mạng</b>, $32 - n$ bit còn lại là <b>phần máy</b></td><td><code>/26</code>: 26 bit mạng, 6 bit máy</td></tr>
          <tr><td>mặt nạ</td><td>cùng ý nghĩa, viết bằng số: $n$ bit 1 rồi toàn 0</td><td><code>/26</code> = <code>255.255.255.192</code></td></tr>
          <tr><td>địa chỉ mạng / quảng bá</td><td>phần máy toàn 0 / toàn 1</td><td>không gán cho máy nào</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bốn khái niệm cần nắm. Địa chỉ IPv4 dài 32 bit, viết thành 4 số từ 0 tới 255, cách nhau dấu chấm. Tiền tố n nghĩa là n bit đầu là phần mạng, còn 32 trừ n bit cuối là phần máy. Mặt nạ cũng mang ý nghĩa đó, viết bằng số, gồm n bit 1 rồi toàn 0, nên tiền tố 26 có byte cuối là 1 1 0 0, 0 0 0 0, tức 192. Địa chỉ có phần máy toàn 0 là địa chỉ mạng, toàn 1 là địa chỉ quảng bá, cả hai không gán cho máy nào."

  # ───────────────────────── 3. BIT ─────────────────────────
  - id: bits
    kind: concept
    title: "Nhìn byte cuối bằng bit"
    checks:
      - "format(77, '08b') == '01001101' and 0b01000000 == 64"
      - "alg.subnet('192.168.10.64/26')[:3] == ('192.168.10.64', '192.168.10.127', 62)"
    steps:
      - show: |
          <p>Với <code>/26</code>, byte cuối có 2 bit mạng và 6 bit máy. Địa chỉ <code>.77</code>:</p>
          <div class="code"><div>77 = <b>01</b> 001101</div><div>phần mạng 01 → mạng con bắt đầu ở 01 000000 = 64</div><div>phần máy toàn 1 → 01 111111 = 127 (quảng bá)</div></div>
          <p>Vậy <code>192.168.10.77</code> thuộc mạng <code>192.168.10.64/26</code>, quảng bá <code>.127</code>.</p>
        focus: [1, "2.1", "2.2", "2.3", 3]
        say: "Với tiền tố 26, byte cuối có 2 bit mạng và 6 bit máy. Địa chỉ đuôi 77 viết nhị phân là 0 1 0 0, 1 1 0 1. Hai bit đầu là 0 1, nên mạng con bắt đầu ở 0 1 rồi toàn 0, tức 64. Phần máy toàn 1 cho 0 1 rồi toàn 1, tức 127, là địa chỉ quảng bá. Vậy địa chỉ đuôi 77 thuộc mạng con bắt đầu ở 64, quảng bá ở 127."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một vạch đỏ chia phần mạng và phần máy"
    steps:
      - show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><g font-size="22" fill="#1f2937"><text x="252" y="52" text-anchor="middle" font-weight="bold">192</text><text x="572" y="52" text-anchor="middle" font-weight="bold">168</text><text x="892" y="52" text-anchor="middle" font-weight="bold">10</text><text x="1212" y="52" text-anchor="middle" font-weight="bold">77</text><rect x="100" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="118" y="101" text-anchor="middle" font-family="monospace" font-size="20">1</text><rect x="138" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="156" y="101" text-anchor="middle" font-family="monospace" font-size="20">1</text><rect x="176" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="194" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="214" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="232" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="252" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="270" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="290" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="308" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="328" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="346" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="366" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="384" y="101" text-anchor="middle" font-family="monospace" font-size="20">0</text><rect x="420" y="70" width="36" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="438" y="101" text-anch