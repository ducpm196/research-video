id: L02
course: NET
series: "NET · Mạng máy tính"
title: "Bài 2 — Thông lượng và tích băng thông–trễ"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/net.yaml L02; audit/net/verify_net.py L02; J. Kurose, K. Ross, Computer Networking (8th ed.), mục 1.4.4; RFC 7323 (cửa sổ lớn cho đường có tích băng thông–trễ lớn)"
assumes: [arith, frac, power, approx, dots]
# Quy ước: “băng thông” = tốc độ danh định của một liên kết; “thông lượng” = tốc độ dữ liệu thật sự tới đích. MB = 10⁶ byte, Mbps = 10⁶ bit/s.
#   Tích băng thông–trễ tính với trễ MỘT CHIỀU (lượng dữ liệu nằm trên đường); bài 10 dùng RTT cho cửa sổ gửi.
objectives:
  - "Thấy thông lượng đầu–cuối bằng liên kết chậm nhất"
  - "Tính lượng dữ liệu đang “bay” trên đường truyền"
  - "Không nhầm byte với bit, băng thông với thông lượng"
asr_reviewed:
  - {sentence: "Liên kết 100 triệu bit mỗi giây đẩy được 100 nghìn bit mỗi mi li giây, nhân 50 mi li giây được 5 triệu bit.", reason: "ASR chép “Liên kết 100 triệu bit mỗi dây đẩy được 100.000 bit mỗi mili dây, nhần 50 mili dây được 5 triệu bit.” (0.778): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: nhân (trong “mi li giây nhân” → “mili dây nhần”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Dung lượng tệp đo bằng MB, tức triệu byte, ví dụ 2 MB là 2 triệu byte.", reason: "ASR chép “Dung lượng tẹp đo bằng megabyte, tức triệu byte, ví dụ hai megabyte là hai triệu byte.” (0.824): MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte”; lệch âm/thanh thuần Việt: tệp/tẹp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chia cho 8 để ra byte, ta được 12 phẩy 5 triệu byte, tức 12 phẩy 5 MB đang nằm trên đường.", reason: "ASR chép “Chia cho 8 để ra bay, ta được 12,5 triệu bay, tức 12,5 megabyte đang nằm trên đường.” (0.875): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước năm, đổi ra byte bằng cách chia cho 8.", reason: "ASR chép “Bước 5, đổi ra bay bằng cách chia cho 8.” (0.9): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ năm hay gặp ở người đã đi làm, hẹn sao lưu một nghìn tỉ byte qua đường 100 triệu bit mỗi giây, trong khung đêm 8 giờ.", reason: "ASR chép “Lỗi thứ năm hay gặp ở người đã đi làm, hẹn sao lưu 1.000 tỷ bay qua đường 100 triệu bit mỗi giây, trong khung đêm 8 giờ.” (0.933): “tỉ” ASR viết chính tả “tỷ” (cùng âm); byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tệp 25 MB tải mất bao lâu?", reason: "ASR chép “tệp 25 MB tại mức bao lâu?”: MB (mê-ga-byte) khớp; tải mất/tại mức là nhầm thanh và âm cuối ở câu 7 từ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ ba, lẫn MB với mê-ga-bít, sai 8 lần.", reason: "đơn vị đọc theo lexicon_vi.OSY.yaml (KB/KiB → “ki-lô-byte”, MB/MiB → “mê-ga-byte”, GB → “ghi-ga-byte”, TiB → “tê-ra-byte”); ASR chép “kilobyte/megabyte/gigabyte/terabyte/kb” hoặc tách “kg bay”, “tê ra bay” — đúng đơn vị, chỉ khác cách viết; “byte” → “bay/bai” cùng âm (probe p1 CSA)"}
  - {sentence: "Liên kết 100 triệu bit mỗi giây, với trễ một chiều 50 mi li giây, chứa 100 triệu nhân 0 phẩy 0 5, bằng 5 triệu bit, tức 625 nghìn byte đang nằm trên đường.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Một, soát đơn vị, MB là triệu byte, còn mê-ga-bít mỗi giây là triệu bit, nhân hoặc chia 8 cho đúng chỗ.", reason: "đơn vị đọc theo lexicon_vi.OSY.yaml (KB/KiB → “ki-lô-byte”, MB/MiB → “mê-ga-byte”, GB → “ghi-ga-byte”, TiB → “tê-ra-byte”); ASR chép “kilobyte/megabyte/gigabyte/terabyte/kb” hoặc tách “kg bay”, “tê ra bay” — đúng đơn vị, chỉ khác cách viết; “byte” → “bay/bai” cùng âm (probe p1 CSA)"}
  - {sentence: "Hai, kiểm ngược, vì 625 nghìn byte nhân 8 bằng 5 triệu bit, nên đúng bằng 100 triệu bit mỗi giây trong 0 phẩy 0 5 giây.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Nhà mạng quảng cáo bằng bit mỗi giây, còn trình tải tệp hiện byte mỗi giây, nên 100 triệu bit mỗi giây chỉ là 12 phẩy 5 MB mỗi giây.", reason: "đơn vị đọc theo lexicon_vi.OSY.yaml (KB/KiB → “ki-lô-byte”, MB/MiB → “mê-ga-byte”, GB → “ghi-ga-byte”, TiB → “tê-ra-byte”); ASR chép “kilobyte/megabyte/gigabyte/terabyte/kb” hoặc tách “kg bay”, “tê ra bay” — đúng đơn vị, chỉ khác cách viết; “byte” → “bay/bai” cùng âm (probe p1 CSA); “byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Có bao nhiêu MB đang nằm trên đường?", reason: "đơn vị đọc theo lexicon_vi.OSY.yaml (KB/KiB → “ki-lô-byte”, MB/MiB → “mê-ga-byte”, GB → “ghi-ga-byte”, TiB → “tê-ra-byte”); ASR chép “kilobyte/megabyte/gigabyte/terabyte/kb” hoặc tách “kg bay”, “tê ra bay” — đúng đơn vị, chỉ khác cách viết; “byte” → “bay/bai” cùng âm (probe p1 CSA)"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mạng nhà 1 Gbps mà tải chậm"
    checks:
      - "min(1000, 100, 20) == 20 and 25e6 * 8 / 20e6 == 10"
    steps:
      - show: |
          <p>Mạng trong nhà 1000 Mbps, đường ra nhà cung cấp 100 Mbps, máy chủ chỉ phát 20 Mbps. Tệp 25 MB tải mất bao lâu?</p>
          <p>Không phải theo 1000, cũng không phải trung bình — mà theo <b>20</b>: mất 10 giây.</p>
          <div class="box key">Hôm nay: thông lượng, nút cổ chai, và tích băng thông–trễ — lượng dữ liệu nằm trên dây cùng một lúc.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, mạng trong nhà chạy 1000 triệu bit mỗi giây, đường ra nhà cung cấp 100 triệu, còn máy chủ chỉ phát 20 triệu bit mỗi giây. Tệp 25 MB tải mất bao lâu? Không tính theo 1000, cũng không theo trung bình. Mà tính theo 20, nên mất 10 giây. Hôm nay ta học thông lượng, nút cổ chai, và tích băng thông nhân trễ, tức lượng dữ liệu nằm trên dây cùng một lúc."

  # ───────────────────────── 2. CHUẨN BỊ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: byte và bit, lượng = tốc độ nhân thời gian"
    checks:
      - "2 * 10**6 * 8 == 16 * 10**6 and 16e6 / 8e6 == 2 and 8e6 * 3 == 24e6"
    steps:
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>MB</td><td>triệu <b>byte</b> (dung lượng tệp)</td><td>2 MB $= 2 \times 10^6$ byte</td></tr>
          <tr><td>Mbps</td><td>triệu <b>bit</b> mỗi giây (tốc độ)</td><td>2 MB $= 2 \times 10^6 \times 8 = 16$ triệu bit</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn hai điều sẽ dùng. Dung lượng tệp đo bằng MB, tức triệu byte, ví dụ 2 MB là 2 triệu byte. Tốc độ đường truyền đo bằng triệu bit mỗi giây, mà một byte có 8 bit, nên 2 MB bằng 2 triệu nhân 8, tức 16 triệu bit."
      - show: |
          <p>Thời gian $=$ lượng chia tốc độ; ngược lại, lượng $=$ tốc độ nhân thời gian. Với tốc độ 8 triệu bit mỗi giây:</p>
          $$\frac{16 \times 10^6}{8 \times 10^6} = 2 \text{ giây} \qquad 8 \times 10^6 \times 3 = 24 \times 10^6 \text{ bit}$$
        focus: [1, 2, 2]
        say: "Điều thứ hai, thời gian bằng lượng chia tốc độ, và ngược lại, lượng bằng tốc độ nhân thời gian. Với tốc độ 8 triệu bit mỗi giây, 16 triệu bit mất 16 triệu chia 8 triệu, bằng 2 giây. Còn trong 3 giây, đường đó chở được 8 triệu nhân 3, bằng 24 triệu bit, và phép nhân này chính là cách ta tính lượng dữ liệu nằm trên dây."

  # ───────────────────────── 2b. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: băng thông, thông lượng, nút cổ chai"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>băng thông</b> $R$</td><td>tốc độ danh định của <b>một</b> liên kết (bit mỗi giây)</td></tr>
          <tr><td><b>thông lượng</b></td><td>tốc độ dữ liệu <b>thật sự</b> tới đích</td></tr>
          <tr><td><b>nút cổ chai</b></td><td>liên kết chậm nhất trên đường — quyết định thông lượng đầu–cuối</td></tr>
          <tr><td><b>tích băng thông–trễ</b></td><td>$R \times$ trễ: số bit đang nằm trên đường cùng lúc</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bốn thuật ngữ cần phân biệt. Băng thông R là tốc độ danh định của một liên kết, tính bằng bit mỗi giây. Thông lượng là tốc độ dữ liệu thật sự tới đích. Nút cổ chai là liên kết chậm nhất trên đường, nó quyết định thông lượng đầu cuối. Tích băng thông nhân trễ là số bit đang nằm trên đường cùng một lúc."

  # ───────────────────────── 3. ỐNG NƯỚC ─────────────────────────
  - id: pipe
    kind: concept
    title: "Hình dung bằng ống nước"
    steps:
      - show: |
          <ul><li>Băng thông = <b>độ rộng</b> ống: mỗi giây chảy vào bao nhiêu nước.</li>
          <li>Trễ = <b>độ dài</b> ống: một giọt đi từ đầu tới cuối mất bao lâu.</li>
          <li>Tích băng thông–trễ = <b>thể tích</b> ống: lượng nước nằm trong ống khi ống đầy.</li>
          <li>Nối nhiều đoạn ống: lưu lượng ra bằng đoạn <b>hẹp nhất</b>.</li></ul>
        focus: [0, "1.1", "1.2", "1.3", "1.4"]
        say: "Hãy hình dung đường truyền là một ống nước. Băng thông là độ rộng của ống, mỗi giây chảy vào được bao nhiêu nước. Trễ là độ dài của ống, một giọt đi từ đầu tới cuối mất bao lâu. Tích băng thông nhân trễ là thể tích của ống, lượng nước nằm trong ống khi ống đầy. Nối nhiều đoạn ống thì lưu lượng chảy ra bằng đúng đoạn hẹp nhất."
      - show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300"><g font-size="24" fill="#1f2937"><rect x="150" y="120" width="400" height="60" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><rect x="550" y="140" width="400" height="20" fill="#dbeafe" stroke="#b91c1c" stroke-width="3"/><rect x="950" y="80" width="400" height="140" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><rect x="150" y="140" width="1200" height="20" fill="#1d4ed8"/><text x="350" y="108" text-anchor="middle">100 Mbps</text><text x="750" y="128" text-anchor="middle" fill="#b91c1c" font-weight="700">20 Mbps: hẹp nhất</text><text x="1150" y="68" text-anchor="middle">1000 Mbps</text><line x1="40" y1="150" x2="140" y2="150" stroke="#374151" stroke-width="4"/><path d="M128,138 L148,150 L128,162 z" fill="#374151"/><line x1="1360" y1="150" x2="1450" y2="150" stroke="#374151" stroke-width="4"/><path d="M1440,138 L1460,150 L1440,162 z" fill="#374151"/><text x="1405" y="128" text-anchor="middle" font-weight="700">ra 20</text><text x="750" y="268" text-anchor="middle" fill="#1d4ed8">dải xanh đậm: dòng chảy thật, cả ba đoạn đều chỉ được 20 Mbps</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình này nối ba đoạn ống, rộng 100, 20 và 1000 triệu bit mỗi giây, độ rộng vẽ không theo tỉ lệ. Dải xanh đậm là dòng dữ liệu thật, nó chỉ dày bằng đoạn hẹp nhất 20, vì đoạn giữa không cho qua hơn. Đoạn đầu và đoạn cuối rộng hơn nhưng còn trống, nên dữ liệu ra khỏi ống cũng chỉ 20 triệu bit mỗi giây."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính thông lượng và thể tích đường truyền"
    checks:
      - "min(100, 20, 1000) == 20 and 25e6 * 8 / 20e6 == 10"
      - "100e6 * 50e-3 == 5e6 and 5e6 / 8 == 625000"
      - "25 * 10**6 * 8 == 200 * 10**6 and 5e6 / 10 == 500000 and 50 / 10 == 5"
    steps:
      - show: |
          <p><b>Bước 1 — tìm nút cổ chai:</b> ba liên kết 100, 20, 1000 Mbps.</p>
          $$\min(100, 20, 1000) = 20 \text{ Mbps}$$
        introduces: [min_fn]
        focus: [1, 2]
        say: "Bước một, tìm nút cổ chai trên đường đi qua ba liên kết 100, 20 và 1000 triệu bit mỗi giây. Thông lượng bằng liên kết nhỏ nhất, chữ min đọc là số nhỏ nhất trong, tức 20 triệu bit mỗi giây."
      - show: |
          <p><b>Bước 2 — đổi tệp ra bit:</b></p>
          $$25 \text{ MB} = 25 \times 10^6 \times 8 = 200 \times 10^6 \text{ bit}$$
        focus: [1, 2]
        say: "Bước hai, đổi tệp ra bit, vì tốc độ đo bằng bit. Tệp 25 MB là 25 triệu byte nhân 8, bằng 200 triệu bit."
      - show: |
          <p><b>Bước 3 — chia cho thông lượng:</b></p>
          $$\frac{200 \times 10^6}{20 \times 10^6} = \hl{10} \text{ giây}$$
        focus: [1, 2]
        say: "Bước ba, thời gian bằng lượng chia tốc độ, nên ta chia cho thông lượng. Tệp 25 MB là 200 triệu bit, nên mất 200 triệu chia 20 triệu, bằng 10 giây."
      - clear: true
        show: |
          <p><b>Bước 4 — thể tích đường truyền:</b> liên kết 100 Mbps, trễ một chiều 50 ms: $100 \times 10^6 \times 0{,}05 = 5 \times 10^6$ bit.</p>
          <div><svg width="1500" height="300" viewBox="0 0 1500 300"><g font-size="24" fill="#1f2937"><text x="120" y="150" text-anchor="middle" font-weight="700">A</text><text x="1260" y="150" font-weight="700">B</text><line x1="200" y1="196" x2="1200" y2="196" stroke="#374151" stroke-width="2"/><line x1="200" y1="190" x2="200" y2="202" stroke="#374151" stroke-width="2"/><text x="200" y="230" text-anchor="middle" font-size="20">0</text><line x1="400" y1="190" x2="400" y2="202" stroke="#374151" stroke-width="2"/><text x="400" y="230" text-anchor="middle" font-size="20">10</text><line x1="600" y1="190" x2="600" y2="202" stroke="#374151" stroke-width="2"/><text x="600" y="230" text-anchor="middle" font-size="20">20</text><line x1="800" y1="190" x2="800" y2="202" stroke="#374151" stroke-width="2"/><text x="800" y="230" text-anchor="middle" font-size="20">30</text><line x1="1000" y1="190" x2="1000" y2="202" stroke="#374151" stroke-width="2"/><text x="1000" y="230" text-anchor="middle" font-size="20">40</text><line x1="1200" y1="190" x2="1200" y2="202" stroke="#374151" stroke-width="2"/><text x="1200" y="230" text-anchor="middle" font-size="20">50</text><rect x="200" y="110" width="96" height="60" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><rect x="300" y="110" width="96" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="400" y="110" width="96" height="60" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><rect x="500" y="110" width="96" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="600" y="110" width="96" height="60" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><rect x="700" y="110" width="96" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="800" y="110" width="96" height="60" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><rect x="900" y="110" width="96" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="1000" y="110" width="96" height="60" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><rect x="1100" y="110" width="96" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="1300" y="232" font-size="20">ms</text><text x="700" y="90" text-anchor="middle">mỗi ô = 5 ms đường dây = 500 000 bit; 10 ô nằm trên đường cùng lúc</text><text x="1190" y="270" text-anchor="end" fill="#b45309">bit đầu tiên vừa tới B thì A đã đẩy ra 5 000 000 bit</text></g></svg></div>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, tính thể tích của một đường truyền khác, liên kết 100 triệu bit mỗi giây, trễ một chiều 50 mi li giây. Theo phép nhân lượng bằng tốc độ nhân thời gian, ta có 100 triệu nhân 0 phẩy 0 5, bằng 5 triệu bit. Trên hình, mỗi ô là 5 mi li giây đường dây, chứa 500 nghìn bit, và 10 ô nằm trên đường cùng lúc. Khi bit đầu tiên vừa tới B, máy A đã đẩy ra đủ 5 triệu bit."
      - clear: true
        show: |
          <p><b>Bước 5 — đổi ra byte:</b> $\frac{5 \times 10^6}{8} = \hl{625\,000}$ byte đang nằm trên đường.</p>
          <div class="box key">Bên gửi phải có sẵn ngần ấy dữ liệu “đã gửi mà chưa tới” thì mới lấp đầy được đường truyền — ý này quay lại ở bài về cửa sổ trượt.</div>
        focus: [1, 1, 2, 2]
        say: "Bước năm, đổi ra byte bằng cách chia cho 8. Liên kết 100 triệu bit mỗi giây, với trễ một chiều 50 mi li giây, chứa 100 triệu nhân 0 phẩy 0 5, bằng 5 triệu bit, tức 625 nghìn byte đang nằm trên đường. Bên gửi phải có sẵn ngần ấy dữ liệu đã gửi mà chưa tới, thì mới lấp đầy được đường truyền. Ý này sẽ quay lại khi ta học cửa sổ trượt."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "625000 * 8 == 5e6"
      - "20e6 * 10 == 200e6 and 200e6 / 8 == 25e6"
      - "100e6 / 1000 == 100000 and 100000 * 50 == 5000000"
    steps:
      - show: |
          <p><b>Đường khác:</b> nhân thay vì chia, đếm theo từng đơn vị thời gian.</p>
          <table class="t"><tr><th>điều cần kiểm</th><th>đếm ngược lại</th><th>kết quả</th></tr>
          <tr><td>tệp 25 MB mất 10 giây</td><td>$20 \times 10^6 \times 10 = 200 \times 10^6$ bit; chia 8</td><td>25 MB ✓</td></tr>
          <tr><td>5 triệu bit trên đường</td><td>100 Mbps $= 100\,000$ bit mỗi ms; $100\,000 \times 50$</td><td>5 000 000 bit ✓</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Tự kiểm bằng một đường khác, nhân thay vì chia, và đếm theo từng đơn vị thời gian. Mỗi giây qua nút cổ chai được 20 triệu bit, sau 10 giây là 200 triệu bit, chia 8 được đúng 25 MB. Liên kết 100 triệu bit mỗi giây đẩy được 100 nghìn bit mỗi mi li giây, nhân 50 mi li giây được 5 triệu bit. Cả hai khớp với cách tính trước, nên ta yên tâm về đơn vị."
      - show: |
          <ol><li><b>Đơn vị:</b> MB là triệu <b>byte</b>, Mbps là triệu <b>bit</b> mỗi giây — nhân hoặc chia 8 đúng chỗ.</li>
          <li><b>Kiểm ngược:</b> 625 000 byte × 8 = 5 triệu bit = 100 Mbps trong 0,05 giây.</li>
          <li><b>Nút cổ chai:</b> thêm một liên kết nhanh hơn không đổi được kết quả; chỉ nâng liên kết chậm nhất mới đổi.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, soát đơn vị, MB là triệu byte, còn mê-ga-bít mỗi giây là triệu bit, nhân hoặc chia 8 cho đúng chỗ. Hai, kiểm ngược, vì 625 nghìn byte nhân 8 bằng 5 triệu bit, nên đúng bằng 100 triệu bit mỗi giây trong 0 phẩy 0 5 giây. Ba, thêm một liên kết nhanh hơn không đổi được kết quả, chỉ nâng liên kết chậm nhất mới đổi."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp"
    checks:
      - "round((100 + 20 + 1000) / 3, 1) == 373.3 and round(200e6 / 373.3e6, 2) == 0.54"
      - "1e12 * 8 / 100e6 == 80000 and round(80000 / 3600, 1) == 22.2 and round(8e12 / (8 * 3600) / 1e6, 1) == 277.8"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy trung bình các liên kết <b class="red">(sai)</b>
          <br><span class="note">Trung bình của 100, 20, 1000 là 373,3 Mbps — nhưng dữ liệu không thể chảy qua đoạn 20 Mbps nhanh hơn 20.</span></div>
          $$\frac{200 \times 10^6}{373{,}3 \times 10^6} \approx 0{,}54 \text{ giây — sai, thật ra là 10 giây}$$
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất, lấy trung bình tốc độ các liên kết. Trung bình của 100, 20 và 1000 là 373 phẩy 3, nhưng dữ liệu không thể chảy qua đoạn 20 nhanh hơn 20. Lấy trung bình thì tệp 25 MB tưởng chỉ mất khoảng 0 phẩy 54 giây, trong khi thật ra mất 10 giây."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Coi băng thông là thông lượng <b class="red">(sai)</b>
          <br><span class="note">Liên kết dùng chung với người khác, phần đầu gói, gói mất phải gửi lại — thông lượng không bao giờ vượt băng thông, và trên thực tế thấp hơn. Các phép tính trong bài bỏ qua những phần này để dễ thấy nút cổ chai.</span></div>
        say: "Lỗi thứ hai, coi băng thông là thông lượng. Liên kết dùng chung với người khác, phần đầu gói chiếm chỗ, gói mất phải gửi lại, nên thông lượng không bao giờ vượt băng thông, và trên thực tế thấp hơn. Các phép tính trong bài bỏ qua những phần này để dễ thấy nút cổ chai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn MB và Mb <b class="red">(sai 8 lần)</b>
          <br><span class="note">Nhà mạng quảng cáo bằng <b>bit</b> mỗi giây; trình tải tệp hiện <b>byte</b> mỗi giây. 100 Mbps chỉ là 12,5 MB mỗi giây.</span></div>
        say: "Lỗi thứ ba, lẫn MB với mê-ga-bít, sai 8 lần. Nhà mạng quảng cáo bằng bit mỗi giây, còn trình tải tệp hiện byte mỗi giây, nên 100 triệu bit mỗi giây chỉ là 12 phẩy 5 MB mỗi giây."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ đường nhanh thì gửi từng gói một cũng nhanh <b class="red">(sai)</b>
          <br><span class="note">Đường càng “dày” và càng dài thì thể tích càng lớn. Gửi ít một rồi chờ sẽ để ống gần như rỗng.</span></div>
        say: "Lỗi thứ tư, nghĩ đường nhanh thì gửi từng gói một rồi chờ cũng nhanh. Đường càng rộng và càng dài thì thể tích càng lớn, gửi ít một rồi chờ sẽ để ống gần như rỗng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5 — người đã đi làm.</b> Hẹn sao lưu 1 TB $= 10^{12}$ byte qua đường 100 Mbps trong khung đêm 8 giờ <b class="red">(không kịp)</b></div>
          <table class="t"><tr><th>tính</th><th>kết quả</th></tr>
          <tr><td>$\frac{10^{12} \times 8}{100 \times 10^6}$</td><td>80 000 giây $\approx 22{,}2$ giờ</td></tr>
          <tr><td>cần trong 8 giờ: $\frac{8 \times 10^{12}}{8 \times 3600}$</td><td>$\approx 277{,}8$ triệu bit mỗi giây</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ năm hay gặp ở người đã đi làm, hẹn sao lưu một nghìn tỉ byte qua đường 100 triệu bit mỗi giây, trong khung đêm 8 giờ. Đổi ra bit rồi chia cho tốc độ, ta được 80 nghìn giây, khoảng 22 phẩy 2 giờ, gần gấp ba khung đêm. Muốn xong trong 8 giờ thì nút cổ chai phải đạt khoảng 277 phẩy 8 triệu bit mỗi giây. Vì vậy hãy tính thời gian theo nút cổ chai trước khi hứa một lịch sao lưu."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "1e9 * 0.1 / 8 == 12.5e6"
      # 100 ms một chiều ở 2·10⁸ m/s (bài 1) = 20 000 km ≈ nửa chu vi Trái Đất (≈ 40 000 km)
      - "abs(2e8 * 0.1 - 20000e3) < 1e-6 and abs(20000 / 40000 - 0.5) < 1e-12"
      - "min(50, 10, 100) == 10 and 5e6 * 8 / 10e6 == 4"
      - "1e9 * 0.1 == 1e8 and 1e8 / 8 == 12.5e6 and 10e6 * 4 == 40e6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Liên kết 1 Gbps, trễ một chiều 100 ms (cáp quang dài cỡ nửa vòng Trái Đất). Bao nhiêu MB đang nằm trên đường?</td></tr>
          <tr><td>2</td><td>Ba liên kết 50, 10, 100 Mbps. Tải tệp 5 MB mất bao lâu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, liên kết 1 tỉ bit mỗi giây, trễ một chiều 100 mi li giây, như một đường cáp quang dài cỡ nửa vòng Trái Đất. Có bao nhiêu MB đang nằm trên đường? Câu hai, đường đi qua ba liên kết 50, 10 và 100 triệu bit mỗi giây. Tải tệp 5 MB mất bao lâu? Dừng video và làm ra giấy."
        pause: 12
      - show: |
          <p>① Bước 1: lượng $=$ tốc độ nhân thời gian: $10^9 \times 0{,}1 = 10^8$ bit.</p>
          <p>① Bước 2: chia 8 ra byte: $\frac{10^8}{8} = 12{,}5 \times 10^6$ byte $= \hl{12{,}5}$ MB.</p>
        focus: [1, 2]
        say: "Đáp án câu một, lượng bằng tốc độ nhân thời gian, 1 tỉ nhân 0 phẩy 1 bằng 100 triệu bit. Chia cho 8 để ra byte, ta được 12 phẩy 5 triệu byte, tức 12 phẩy 5 MB đang nằm trên đường."
      - show: |
          <p>② Bước 1: $\min(50, 10, 100) = 10$ Mbps.</p>
          <p>② Bước 2: $5 \times 10^6 \times 8 = 40$ triệu bit, nên $\frac{40 \times 10^6}{10 \times 10^6} = \hl{4}$ giây.</p>
        focus: [1, 2, 2]
        say: "Câu hai, nút cổ chai là liên kết 10 triệu bit mỗi giây. Tệp 5 MB là 40 triệu bit, nên mất 4 giây. Kiểm nhanh bằng phép nhân, 10 triệu bit mỗi giây trong 4 giây là 40 triệu bit, khớp với kích thước tệp."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">thông lượng = liên kết chậm nhất</span><span class="a">→</span>
          <span class="n">thể tích = băng thông × trễ</span><span class="a">→</span>
          <span class="n">muốn đầy ống phải gửi trước nhiều</span></div>
        say: "Tổng kết lại, thông lượng đầu cuối bằng liên kết chậm nhất. Thể tích của đường truyền bằng băng thông nhân trễ, và muốn đầy ống thì phải gửi trước nhiều dữ liệu."
      - show: |
          <div class="box key"><b>Tư duy:</b> tối ưu một hệ thống nhiều đoạn, hãy tìm và sửa nút cổ chai trước — sửa chỗ khác không thay đổi gì.</div>
        say: "Điều cần mang theo, khi tối ưu một hệ thống nhiều đoạn, hãy tìm và sửa nút cổ chai trước, vì sửa chỗ khác không thay đổi được gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): bit có thể bị lật trên đường — <b>phát hiện lỗi</b> bằng bit chẵn lẻ, checksum, CRC.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta xem các bit có thể bị lật trên đường, và cách phát hiện lỗi bằng bit chẵn lẻ, tổng kiểm tra và CRC. Hẹn gặp bạn ở bài tiếp theo."
