source: "curriculum/net.yaml L06; audit/net/verify_net.py L06; RFC 4632 (định tuyến liên miền không phân lớp); J. Kurose, K. Ross, mục 4.3.3"
assumes: [arith, power, dots]
# Quy ước: CIDR chỉ ghi trên màn hình; lời đọc nói “định tuyến không phân lớp”. Mọi kết quả tra bảng do alg.lpm tính; gom khối do
#   ipaddress.collapse_addresses kiểm (verify_net.py). Lời đọc nói “tiền tố 20” cho “/20”.
objectives:
  - "Gom nhiều khối địa chỉ liền nhau thành một mục bảng định tuyến"
  - "Tra bảng bằng khớp tiền tố dài nhất"
  - "Hiểu mục mặc định 0.0.0.0/0"
asr_reviewed:
  - {sentence: "Byte đầu là 8, viết nhị phân 0 0 0 0, 1 0 0 0, còn 200 là 1 1 0 0, 1 0 0 0, khác nhau ngay từ bit đầu tiên.", reason: "ASR chép “Bay đầu là 8, viết nhị phân 0000-1000, còn 200 là 1100-1000, khác nhau ngay từ biết đầu tiên.” (0.689): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: không không không/∅, không không không/nghìn, không không/trăm, không không không/nghìn, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cột giữa ghi những bit đầu của byte thứ ba mà mỗi mục đòi phải trùng, dấu gạch dưới là chỗ bit nào cũng được.", reason: "ASR chép “Cột giữ ghi những biết đầu của bay thứ ba mà mỗi một đòi phải trung, giấu gạch dưới là chỗ biết nào cũng được.” (0.76): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: giữa/giữ, bit/biết, mục/một, trùng/trung, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, gói thứ hai tới 200 chấm 23 chấm 18 chấm 1, byte thứ ba 18 viết nhị phân là 0 0 0 1, 0 0 1 0.", reason: "ASR chép “Bước 3, gói thứ 2 tới 200.23.18.1, bài thứ 3-18 viết nhị phân là 0001-0010.” (0.78): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: chấm/∅, chấm/∅, chấm/∅, không không không/∅, không không một không/mười — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước bốn, gói thứ ba tới 8 chấm 8 chấm 8 chấm 8.", reason: "ASR chép “Bước 4 gọi thứ 3 tới 8.8.8.8.” (0.783): lệch âm/thanh thuần Việt: gói/gọi, chấm/∅, chấm/∅, chấm/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình này đặt ba mục của bảng lên trục byte thứ ba của địa chỉ, với hai byte đầu là 200 chấm 23.", reason: "ASR chép “Hình này đặt ba mục của bảng lên trục bay thứ ba của địa chỉ, với hai bay đầu là 200.23.” (0.902): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: chấm/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trước hết, ôn lại cách đổi một byte ra nhị phân, như ở bài 5 khi ta tìm mạng con chứa một địa chỉ.", reason: "ASR chép “Trước hết, ông lại cách đổi một bay ra nhị phân, như ở bài năm khi ta tìm mạng con chứa một địa chỉ.” (0.917): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ôn/ông — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khối bắt đầu ở 16, nên byte thứ ba chạy từ 16 tới 16 cộng 16 trừ 1, bằng 31.", reason: "ASR chép “Khối bắt đầu ở 16, nên bài thứ 3 chạy từ 16 tới 16 cộng 16.1 bằng 31.” (0.941): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: trừ/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bắt đầu ở 24, byte thứ ba chạy từ 24 tới 31.", reason: "ASR chép “Bắt đầu ở 24, bài thứ 3 chạy từ 24 tới 31.” (0.944): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khi đã tính ra khoảng bằng lũy thừa của 2, ta chỉ cần xem byte thứ ba có nằm trong khoảng hay không.", reason: "ASR chép “Khi đã tính ra khoảng bằng lũy Thừa của 2, ta chỉ cần xem bay thứ 3 có nằm trong khoảng hay không?” (0.957): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khi tra bảng, tìm mọi mục khớp rồi chọn mục dài nhất.", reason: "ASR chép “Khi tra bản, tìm mỗi mục hấp rồi chọn mục dài nhất”: bảng/bản (âm cuối ng/n), mọi/mỗi, khớp/hấp — nhầm của ASR; câu đủ nghĩa trên màn hình — NOT_VERIFIED bằng tai người"}
  - {sentence: "Địa chỉ có byte thứ ba 18 khớp tiền tố 20 nhưng không khớp tiền tố 21, vì bit thứ năm là 0, nên ra cổng A.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Địa chỉ có byte thứ ba là 25, viết nhị phân là 0 0 0 1, 1 0 0 1, khớp cả ba mục.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Một, viết byte đang xét ra nhị phân rồi so từng bit với từng mục, đừng so bằng mắt trên số thập phân.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Ranh giới tiền tố thường nằm giữa một byte, chỉ khi viết nhị phân mới thấy bit nào thuộc phần mạng.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Câu một, địa chỉ có byte thứ ba là 31.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Câu hai, địa chỉ có byte thứ ba là 32.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Mục tiền tố 20 vẫn phục vụ phần không nằm trong tiền tố 21, ví dụ địa chỉ có byte thứ ba là 18.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
