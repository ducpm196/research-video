  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tiền tố độ dài tuỳ ý</span><span class="a">→</span>

      <span class="n">gom khối liền nhau, thẳng hàng</span><span class="a">→</span>

      <span class="n">mọi mục khớp</span><span class="a">→</span>

      <span class="n">chọn mục dài nhất</span></div>

      '
    say: Tổng kết lại, tiền tố có độ dài tuỳ ý nên các khối liền nhau và thẳng hàng gom được thành một mục. Khi tra bảng, tìm mọi mục khớp rồi chọn mục dài nhất theo nguyên tắc cụ thể nhất thắng. Luôn giữ lại mục mặc định toàn không ở cuối bảng để đẩy lưu lượng Internet ra cổng ngoài.
  - show: '<div class="box key"><b>Tư duy:</b> quy tắc “cụ thể nhất thắng” cho phép một mục chung và vài ngoại lệ cùng sống trong một bảng nhỏ.</div>

      '
    say: Điều cần mang theo, quy tắc cụ thể nhất thắng cho phép một mục chung và vài ngoại lệ cùng sống trong một bảng nhỏ.
  - clear: true
