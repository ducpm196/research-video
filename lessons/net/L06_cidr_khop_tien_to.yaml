objectives:
- Gom nhiều khối địa chỉ liền nhau thành một mục bảng định tuyến
- Tra bảng bằng khớp tiền tố dài nhất
- Hiểu mục mặc định 0.0.0.0/0
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Hai mục cùng khớp — chọn mục nào?
  checks:
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.25.7')[0] == 'B'
  steps:
  - show: '<p>Bảng định tuyến có <code>200.23.16.0/20</code> → cổng A và <code>200.23.24.0/21</code> → cổng B. Gói tới <code>200.23.25.7</code> khớp <b>cả hai</b>.</p>

      <p>Bộ định tuyến chọn B — mục cụ thể hơn. Một bộ định tuyến lớn có thể phải làm việc đó hàng trăm triệu lần mỗi giây (số minh hoạ).</p>

      <div class="box key">Hôm nay: CIDR (định tuyến không phân lớp) — tiền tố có độ dài tuỳ ý thay vì chỉ /8, /16, /24 — gom tuyến, và quy tắc khớp tiền tố dài nhất.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Chào bạn, bảng định tuyến có một mục tiền tố 20 gửi ra cổng A, và một mục tiền tố 21 gửi ra cổng B. Một gói tới địa chỉ 200 chấm 23 chấm 25 chấm 7 khớp cả hai mục. Bộ định tuyến chọn B, mục cụ thể hơn. Lấy số minh hoạ, một bộ định tuyến lớn có thể phải làm việc đó hàng trăm triệu lần mỗi giây. Hôm nay ta học định tuyến không phân lớp, tức tiền tố có độ dài tuỳ ý thay vì chỉ 8, 16 hay 24, cùng gom tuyến và quy tắc khớp tiền tố dài nhất. Khi một gói tin khớp đồng thời nhiều dòng định tuyến lồng nhau, quy tắc khớp tiền tố dài nhất bảo đảm gói luôn rẽ về cổng cụ thể và chính xác nhất.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: một byte ra nhị phân, một tiền tố ra số địa chỉ'
  checks:
  - 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 == 255 and 16 + 8 + 1 == 25 and format(25, '08b') == '00011001'
  - 2 ** (32 - 24) == 256 and 2 ** (32 - 20) == 4096 and 2 ** (32 - 21) == 2048
  steps:
  - show: '<table class="t"><tr><th>bit thứ</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>

      <tr><td>giá trị</td><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>

      <tr><td>số 25</td><td>0</td><td>0</td><td>0</td><td><b>1</b></td><td><b>1</b></td><td>0</td><td>0</td><td><b>1</b></td></tr></table>

      <p>$25 = 16 + 8 + 1$ → viết <code>00011001</code>.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Trước hết, ôn lại cách đổi một byte ra nhị phân, như ở bài 5 khi ta tìm mạng con chứa một địa chỉ. Một byte có tám bit, giá trị từ trái sang phải lần lượt là 128, 64, 32, 16, 8, 4, 2 và 1. Số 25 bằng 16 cộng 8 cộng 1, nên ba bit ứng với 16, 8 và 1 bằng 1, các bit còn lại bằng 0. Vậy 25 viết nhị phân là 0 0 0 1, 1 0 0 1. Đổi chuẩn bai thứ ba sang dãy tám bít xoá sạch nhầm lẫn khi so khớp các ranh giới tiền tố cắt ngang giữa một bai.
  - show: '<table class="t"><tr><th>tiền tố</th><th>bit phần máy</th><th>số địa chỉ trong khối</th></tr>

      <tr><td>/24</td><td>$32 - 24 = 8$</td><td>$2^{8} = 256$</td></tr>

      <tr><td>/21</td><td>$32 - 21 = 11$</td><td>$2^{11} = 2048$</td></tr>

      <tr><td>/20</td><td>$32 - 20 = 12$</td><td>$2^{12} = 4096$</td></tr></table>

      '
    focus:
    - 0
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Cũng ở bài 5, tiền tố n nghĩa là n bit đầu của địa chỉ là phần mạng, còn 32 trừ n bit cuối là phần máy. Mỗi bit phần máy nhận được hai giá trị, nên một khối tiền tố n chứa 2 mũ 32 trừ n địa chỉ. Tiền tố 24 còn 8 bit phần máy, chứa 2 mũ 8, bằng 256 địa chỉ. Tiền tố 21 còn 11 bit, chứa 2 mũ 11, bằng 2048 địa chỉ. Tiền tố 20 còn 12 bit, chứa 2 mũ 12, bằng 4096 địa chỉ.
- id: sym
  kind: symbol
  title: 'Giải mã: mục bảng định tuyến'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td>mục <code>khối/n → cổng</code></td><td>mọi địa chỉ có $n$ bit đầu trùng với khối thì gửi ra cổng đó</td></tr>

      <tr><td><b>khớp</b></td><td>$n$ bit đầu của địa chỉ đích bằng $n$ bit đầu của khối</td></tr>

      <tr><td><b>tiền tố dài nhất</b></td><td>trong các mục khớp, chọn mục có $n$ <b>lớn nhất</b> — cụ thể nhất</td></tr>

      <tr><td><code>0.0.0.0/0</code></td><td>tiền tố dài 0: khớp <b>mọi</b> địa chỉ — đường mặc định</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bốn khái niệm của bảng định tuyến. Một mục gồm một khối địa chỉ với tiền tố n và một cổng ra, mọi địa chỉ có n bit đầu trùng với khối thì gửi ra cổng đó. Địa chỉ khớp một mục khi n bit đầu của nó bằng n bit đầu của khối. Trong các mục khớp, ta chọn mục có n lớn nhất, tức cụ thể nhất. Còn mục toàn số 0 với tiền tố 0 khớp mọi địa chỉ, gọi là đường mặc định. Mục đường mặc định không bít khớp đóng vai trò lưới hứng an toàn cuối cùng cho mọi lưu lượng hướng ra mạng công cộng bên ngoài.
- id: aggregate
  kind: concept
  title: 'Gom tuyến: bốn khối thành một'
  checks:
  - list(__import__('ipaddress').collapse_addresses([__import__('ipaddress').ip_network(f'200.23.{i}.0/24') for i in range(16, 20)])) == [__import__('ipaddress').ip_network('200.23.16.0/22')]
  - '[format(i, ''08b'')[:6] for i in range(16, 20)] == [''000100''] * 4'
  steps:
  - show: '<p>Bốn khối <code>200.23.16.0/24</code> … <code>200.23.19.0/24</code>: byte thứ ba là 16, 17, 18, 19.</p>

      <div class="code"><div>16 = 000100 00</div><div>17 = 000100 01</div><div>18 = 000100 10</div><div>19 = 000100 11</div></div>

      <p>Sáu bit đầu của byte thứ ba giống nhau: $16 + 6 = 22$ bit chung → gom thành <b>một</b> mục <code>200.23.16.0/22</code>.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    - 3
    say: Xét bốn khối liền nhau, byte thứ ba lần lượt là 16, 17, 18 và 19. Viết nhị phân, cả bốn có cùng sáu bit đầu là 0 0 0 1, 0 0, chỉ khác hai bit cuối. Vậy chúng chung 16 cộng 6 bằng 22 bit đầu. Nhờ đó, ở xa, bốn khối gom lại thành một mục tiền tố 22, bảng định tuyến nhỏ đi bốn lần. Gom bốn khối hai mươi bốn liền kề thành một tiền tố hai mươi hai cắt gọn đáng kể bảng định tuyến nhờ chung trọn sáu bít đầu bai ba.
- id: intuition
  kind: intuition
  title: Ba khoảng lồng nhau
  checks:
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.18.1')[2] == ['200.23.16.0/20', '0.0.0.0/0']
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.32.1')[2] == ['0.0.0.0/0']
  steps:
  - show: '<div><svg width="1400" height="370" viewBox="0 0 1400 370"><g font-size="24" fill="#1f2937"><rect x="100" y="32" width="1200" height="36" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text x="115" y="58">0.0.0.0/0 → mặc định: khớp mọi địa chỉ</text><rect x="580" y="102" width="480" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="566" y="128" text-anchor="end" fill="#2563eb">200.23.16.0/20 → cổng A</text><rect x="820" y="172" width="240" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="806" y="198" text-anchor="end" fill="#ea580c">200.23.24.0/21 → cổng B</text><circle cx="655" cy="50" r="9" fill="#111827"/><circle cx="865" cy="50" r="9" fill="#111827"/><circle cx="1075" cy="50" r="9" fill="#111827"/><circle cx="655" cy="120" r="9" fill="#111827"/><circle cx="865" cy="120" r="9" fill="#111827"/><circle cx="865" cy="190" r="9" fill="#111827"/><line x1="100" y1="280" x2="1300" y2="280" stroke="#374151" stroke-width="3"/><line x1="100" y1="272" x2="100" y2="288" stroke="#374151" stroke-width="3"/><text x="100" y="316" text-anchor="middle">0</text><line x1="340" y1="272" x2="340" y2="288" stroke="#374151" stroke-width="3"/><text x="340" y="316" text-anchor="middle">8</text><line x1="580" y1="272" x2="580" y2="288" stroke="#374151" stroke-width="3"/><text x="580" y="316" text-anchor="middle">16</text><line x1="820" y1="272" x2="820" y2="288" stroke="#374151" stroke-width="3"/><text x="820" y="316" text-anchor="middle">24</text><line x1="1060" y1="272" x2="1060" y2="288" stroke="#374151" stroke-width="3"/><text x="1060" y="316" text-anchor="middle">32</text><line x1="1300" y1="272" x2="1300" y2="288" stroke="#374151" stroke-width="3"/><text x="1300" y="316" text-anchor="middle">40</text><line x1="655" y1="222" x2="655" y2="280" stroke="#111827" stroke-width="2" stroke-dasharray="6 5"/><text x="655" y="352" text-anchor="middle" font-weight="700">18 → A</text><line x1="865" y1="222" x2="865" y2="280" stroke="#111827" stroke-width="2" stroke-dasharray="6 5"/><text x="865" y="352" text-anchor="middle" font-weight="700">25 → B</text><line x1="1075" y1="222" x2="1075" y2="280" stroke="#111827" stroke-width="2" stroke-dasharray="6 5"/><text x="1075" y="352" text-anchor="middle" font-weight="700">32 → mặc định</text><text x="100" y="250" font-size="22">byte thứ ba của địa chỉ</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình này đặt ba mục của bảng lên trục byte thứ ba của địa chỉ, với hai byte đầu là 200 chấm 23. Mỗi mục là một khoảng địa chỉ, đường mặc định phủ cả trục, mục tiền tố 20 phủ từ 16 tới 31, mục tiền tố 21 phủ từ 24 tới 31. Khoảng tiền tố 21 nằm gọn trong khoảng tiền tố 20, nên một địa chỉ có thể rơi vào nhiều khoảng cùng lúc. Các chấm đen cho thấy 18 rơi vào hai khoảng, 25 rơi vào cả ba, còn 32 chỉ rơi vào đường mặc định. Khớp tiền tố dài nhất nghĩa là chọn khoảng hẹp nhất còn chứa địa chỉ. Sắp các khoảng tiền tố lồng nhau lên trục ngang làm hiện rõ vì sao địa chỉ hai mươi lăm nằm trong cả hai vùng phải rẽ sang cổng hẹp B.
- id: example
  kind: example
  title: Tra bảng ba mục
  checks:
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.25.7')[2] == ['200.23.16.0/20', '200.23.24.0/21', '0.0.0.0/0']
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.18.1')[0] == 'A'
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '8.8.8.8')[0] == 'mặc định'
  - format(25, '08b') == '00011001' and format(18, '08b') == '00010010' and format(24, '08b') == '00011000'
  - format(200, '08b') == '11001000' and format(8, '08b') == '00001000' and 21 > 20 > 0
  steps:
  - show: '<table class="t"><tr><th>mục</th><th>byte thứ ba (bit đầu)</th><th>cổng</th></tr>

      <tr><td><code>200.23.16.0/20</code></td><td><code>0001 ____</code></td><td>A</td></tr>

      <tr><td><code>200.23.24.0/21</code></td><td><code>00011 ___</code></td><td>B</td></tr>

      <tr><td><code>0.0.0.0/0</code></td><td>(không cần khớp bit nào)</td><td>mặc định</td></tr></table>

      '
    say: Bảng có ba mục, tiền tố 20 ra cổng A, tiền tố 21 ra cổng B, và đường mặc định. Cột giữa ghi những bit đầu của byte thứ ba mà mỗi mục đòi phải trùng, dấu gạch dưới là chỗ bit nào cũng được.
  - show: '<p><b>Bước 1 — đổi ra nhị phân:</b> <code>200.23.25.7</code>, byte thứ ba 25 = <code>00011001</code> → khớp /20, /21 và /0.</p>

      <div class="code"><div>byte thứ ba 25 = 0001 1001</div><div>mục /20 đòi  = 0001 ____  ✓</div><div>mục /21 đòi  = 0001 1___  ✓</div></div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước một, gói thứ nhất tới 200 chấm 23 chấm 25 chấm 7. Địa chỉ có byte thứ ba là 25, viết nhị phân là 0 0 0 1, 1 0 0 1, khớp cả ba mục. Biểu diễn nhị phân chuỗi không không không một một khẳng định địa chỉ hai mươi lăm thoả trọn vẹn năm bít đầu của mục hai mươi mốt.
  - show: '<p><b>Bước 2 — chọn mục dài nhất:</b> 21 &gt; 20 &gt; 0 → ra cổng <b>B</b>.</p>

      '
    say: Bước hai, trong ba mục cùng khớp, so độ dài tiền tố, 21 lớn hơn 20 và lớn hơn 0. Mục dài nhất là tiền tố 21, nên gói ra cổng B.
  - clear: true
    show: '<p><b>Bước 3:</b> <code>200.23.18.1</code>, 18 = <code>00010010</code> → khớp /20; bit thứ 5 là 0, mục /21 đòi 1 → không khớp → <b>A</b>.</p>

      <div class="code"><div>byte thứ ba 18 = 0001 0010</div><div>mục /20 đòi  = 0001 ____  ✓</div><div>mục /21 đòi  = 0001 1___  không khớp</div></div>

      '
    focus:
    - 1
    - 2
    say: Bước ba, gói thứ hai tới 200 chấm 23 chấm 18 chấm 1, byte thứ ba 18 viết nhị phân là 0 0 0 1, 0 0 1 0. Địa chỉ có byte thứ ba 18 khớp tiền tố 20 nhưng không khớp tiền tố 21, vì bit thứ năm là 0, nên ra cổng A.
  - show: '<p><b>Bước 4:</b> <code>8.8.8.8</code>, byte đầu 8 = <code>00001000</code>, còn 200 = <code>11001000</code> → khác ngay bit đầu → chỉ khớp /0 → <b>mặc định</b>.</p>

      '
    say: Bước bốn, gói thứ ba tới 8 chấm 8 chấm 8 chấm 8. Byte đầu là 8, viết nhị phân 0 0 0 0, 1 0 0 0, còn 200 là 1 1 0 0, 1 0 0 0, khác nhau ngay từ bit đầu tiên. Vì vậy địa chỉ này chỉ khớp đường mặc định.
- id: verify
  kind: check
  title: Tự kiểm
  checks:
  - '(lambda n: (str(n[0]), str(n[-1]), n.num_addresses))(__import__(''ipaddress'').ip_network(''200.23.16.0/20'')) == (''200.23.16.0'', ''200.23.31.255'', 4096) and 4096 // 256 == 16 and 16 + 16 - 1 == 31'
  - '(lambda n: (str(n[0]), str(n[-1]), n.num_addresses))(__import__(''ipaddress'').ip_network(''200.23.24.0/21'')) == (''200.23.24.0'', ''200.23.31.255'', 2048) and 2048 // 256 == 8 and 24 + 8 - 1 == 31'
  - 16 <= 25 <= 31 and 24 <= 25 <= 31 and 16 <= 18 <= 31 and not (24 <= 18 <= 31)
  steps:
  - show: '<table class="t"><tr><th>mục</th><th>số địa chỉ</th><th>bằng mấy khối /24</th><th>byte thứ ba chạy</th></tr>

      <tr><td>/20 từ 16</td><td>$2^{12} = 4096$</td><td>$\frac{4096}{256} = 16$</td><td>16 tới $16 + 16 - 1 = 31$</td></tr>

      <tr><td>/21 từ 24</td><td>$2^{11} = 2048$</td><td>$\frac{2048}{256} = 8$</td><td>24 tới $24 + 8 - 1 = 31$</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, lần này không so bit mà đếm khoảng địa chỉ. Mục tiền tố 20 có 2 mũ 12, bằng 4096 địa chỉ, chia cho 256 được 16 khối tiền tố 24. Khối bắt đầu ở 16, nên byte thứ ba chạy từ 16 tới 16 cộng 16 trừ 1, bằng 31. Mục tiền tố 21 có 2048 địa chỉ, tức 8 khối tiền tố 24. Bắt đầu ở 24, byte thứ ba chạy từ 24 tới 31. Quy đổi độ dài tiền tố thành độ rộng khoảng thập phân từ mười sáu tới ba mươi một và hai mươi bốn tới ba mươi một kiểm chứng chéo hoàn hảo kết quả so bít.
  - show: '<table class="t"><tr><th>gói</th><th>trong 16 tới 31?</th><th>trong 24 tới 31?</th><th>cổng</th><th>so với Bước 1–4</th></tr>

      <tr><td>byte thứ ba 25</td><td>có</td><td>có</td><td>B</td><td>khớp ✓</td></tr>

      <tr><td>byte thứ ba 18</td><td>có</td><td>không</td><td>A</td><td>khớp ✓</td></tr>

      <tr><td><code>8.8.8.8</code></td><td colspan="2">hai byte đầu không phải 200.23</td><td>mặc định</td><td>khớp ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Khi đã tính ra khoảng bằng lũy thừa của 2, ta chỉ cần xem byte thứ ba có nằm trong khoảng hay không. Số 25 nằm trong cả hai khoảng, khoảng hẹp hơn thắng, nên ra cổng B, đúng như bước hai. Số 18 nằm trong khoảng 16 tới 31 nhưng ngoài khoảng 24 tới 31, nên ra cổng A, đúng như bước ba. Địa chỉ 8 chấm 8 chấm 8 chấm 8 không bắt đầu bằng 200 chấm 23, nên chỉ còn đường mặc định, đúng như bước bốn. Mọi địa chỉ kiểm thử rơi vào ranh giới hai khoảng hẹp rộng đều được bảng khoảng xác nhận rẽ đúng cổng định sẵn ở ví dụ đầu.
  - clear: true
    show: '<table class="t"><tr><th>thói quen tự kiểm</th></tr>

      <tr><td>Viết byte đang xét ra <b>nhị phân</b> rồi so từng bit với từng mục — đừng so bằng mắt trên số thập phân.</td></tr>

      <tr><td>Liệt kê <b>mọi</b> mục khớp trước, rồi mới chọn mục dài nhất.</td></tr>

      <tr><td>Luôn còn đường mặc định: không có gói nào “không khớp gì”, trừ khi bảng thiếu nó.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Tự kiểm bằng ba thói quen. Một, viết byte đang xét ra nhị phân rồi so từng bit với từng mục, đừng so bằng mắt trên số thập phân. Hai, liệt kê mọi mục khớp trước, rồi mới chọn mục dài nhất. Ba, nhớ rằng luôn còn đường mặc định, nên không có gói nào không khớp gì, trừ khi bảng thiếu mục đó.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  checks:
  - format(17, '08b')[:6] == '000100' and format(20, '08b')[:6] == '000101'
  - len(list(__import__('ipaddress').collapse_addresses([__import__('ipaddress').ip_network(f'200.23.{i}.0/24') for i in range(17, 21)]))) > 1
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Chọn mục khớp đầu tiên trong bảng <b class="red">(sai)</b>

      <br><span class="note">Thứ tự dòng không quan trọng. Quy tắc là mục khớp <b>dài nhất</b>.</span></div>

      '
    say: Lỗi thứ nhất, chọn mục khớp đầu tiên trong bảng. Thứ tự các dòng không quan trọng, quy tắc là chọn mục khớp dài nhất. Thứ tự khai báo dòng trong bảng định tuyến hoàn toàn không có quyền quyết định; bộ định tuyến luôn quét hết để chọn mục có tiền tố dài nhất. Bộ định tuyến luôn ưu tiên tiền tố dài nhất trùng khớp để chuyển tiếp gói tin tới đúng đích cụ thể.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Gom các khối không liền nhau hoặc không thẳng hàng <b class="red">(sai)</b>

      <br><span class="note">Gom được thành <code>/22</code> chỉ khi 4 khối bắt đầu từ bội của 4 (16, 17, 18, 19). Bốn khối 17 … 20 thì không gom được thành một mục.</span></div>

      <div class="code"><div>17 = 000100 01</div><div>20 = 000101 00</div></div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Lỗi thứ hai, gom các khối không liền nhau hoặc không thẳng hàng. Bốn khối gom được thành một mục khi chúng bắt đầu từ một bội của 4, như 16 tới 19, còn bốn khối từ 17 tới 20 thì không gom được thành một mục. Nhìn nhị phân sẽ thấy lý do, sáu bit đầu của 17 là 0 0 0 1, 0 0, còn của 20 là 0 0 0 1, 0 1, đã khác nhau. Chỉ gom được các khối thành tiền tố chung khi toàn bộ dải địa chỉ liền mạch nhau và bắt đầu từ một điểm thẳng hàng theo lũy thừa của hai.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nghĩ có mục cụ thể hơn thì mục rộng thừa <b class="red">(sai)</b>

      <br><span class="note">Mục <code>/20</code> vẫn phục vụ phần không nằm trong <code>/21</code>, ví dụ <code>200.23.18.1</code>.</span></div>

      '
    say: Lỗi thứ ba, nghĩ có mục cụ thể hơn thì mục rộng là thừa. Mục tiền tố 20 vẫn phục vụ phần không nằm trong tiền tố 21, ví dụ địa chỉ có byte thứ ba là 18. Khối tổng quát tiền tố hai mươi vẫn gánh lưu lượng của toàn bộ phần không gian không bị phủ bởi ngoại lệ tiền tố hai mươi mốt bên trong.
  - show: '<div class="box warn"><b>Lỗi 4.</b> So bằng số thập phân <b class="red">(dễ sai)</b>

      <br><span class="note">Ranh giới tiền tố nằm <b>giữa</b> một byte; chỉ nhị phân mới cho thấy bit nào thuộc phần mạng.</span></div>

      '
    say: Lỗi thứ tư, so bằng số thập phân. Ranh giới tiền tố thường nằm giữa một byte, chỉ khi viết nhị phân mới thấy bit nào thuộc phần mạng.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.31.200')[0] == 'B'
  - alg.lpm([('200.23.16.0/20', 'A'), ('200.23.24.0/21', 'B'), ('0.0.0.0/0', 'mặc định')], '200.23.32.1')[0] == 'mặc định'
  - format(31, '08b') == '00011111' and format(32, '08b') == '00100000' and 16 + 8 + 4 + 2 + 1 == 31
  - 24 <= 31 < 32 and 32 > 16 + 16 - 1
  steps:
  - show: '<table class="t"><tr><th>mục</th><th>cổng</th></tr><tr><td><code>200.23.16.0/20</code></td><td>A</td></tr>

      <tr><td><code>200.23.24.0/21</code></td><td>B</td></tr><tr><td><code>0.0.0.0/0</code></td><td>mặc định</td></tr></table>

      <table class="t"><tr><th>câu</th><th>gói tới</th><th>ra cổng nào?</th></tr>

      <tr><td>1</td><td><code>200.23.31.200</code></td><td>?</td></tr><tr><td>2</td><td><code>200.23.32.1</code></td><td>?</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm với bảng ba mục nhắc lại ở đây, mỗi gói ra cổng nào? Câu một, địa chỉ có byte thứ ba là 31. Câu hai, địa chỉ có byte thứ ba là 32. Dừng video và làm ra giấy.
    pause: 12
  - clear: true
    show: '<p>① 31 = 16 + 8 + 4 + 2 + 1 = <code>00011111</code>: bốn bit đầu <code>0001</code> → khớp /20; năm bit đầu <code>00011</code> → khớp /21.</p>

      <p>Dài nhất là /21 → <b>B</b>. Thử bằng khoảng: 31 nằm trong 24 tới 31 ✓.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một, 31 bằng 16 cộng 8 cộng 4 cộng 2 cộng 1. Vậy 31 viết nhị phân là 0 0 0 1, 1 1 1 1, khớp cả tiền tố 20 và 21, nên ra cổng B. Thử lại bằng khoảng, 31 là số cuối của khoảng 24 tới 31, nên đúng là thuộc mục tiền tố 21.
  - show: '<p>② 32 = <code>00100000</code>: bốn bit đầu là <code>0010</code>, mục /20 đòi <code>0001</code> → không khớp /20, càng không khớp /21 → <b>mặc định</b>.</p>

      <p>Thử bằng khoảng: 32 vừa vượt quá 31, ra khỏi khối /20.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Câu hai, 32 viết nhị phân là 0 0 1 0, 0 0 0 0, bốn bit đầu đã khác, không khớp tiền tố 20, nên đi đường mặc định. Mục tiền tố 21 đòi nhiều bit trùng hơn nữa, nên cũng không khớp. Thử lại bằng khoảng, khối tiền tố 20 dừng ở 31, mà 32 vừa vượt qua, nên gói này ra khỏi khối.
