- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <div class='box key'><p><b>1. DFA kết thúc 'ab':</b> chuyển tiếp <code>q0 --a--&gt; q1 --b--&gt; q2(accept)</code>,
      nhận đúng chuỗi kết thúc 'ab'.</p><p><b>2. Luật Amdahl:</b> <code>S(N) = 1 / ((1 - p) + p/N)</code>; khi <code>p = 0,90,
      N = 8</code> cho <code>S = <b>4,71</b></code>.</p></div>
    say: Hai công thức này đặt ranh giới cứng về thời gian xử lý và mở rộng song song. Với ôtômat đơn định, mỗi ký tự đầu
      vào chỉ kích hoạt đúng một lần nhảy bảng trạng thái nên thời gian luôn tỉ lệ bậc nhất theo độ dài chuỗi. Với luật Amdahl,
      phần song song dù chia cho vô hạn nhân thì mẫu số vẫn còn nguyên phần tuần tự không phẩy một nên trần tăng tốc tối đa
      chỉ là mười. Tính chất quyết định của máy ôtômat hữu hạn đơn định nằm ở bảng chuyển trạng thái hoàn toàn xác định không
      có nhánh quay lui, giữ chi phí luôn tỉ lệ thuận độ dài chuỗi. Trong khi đó định luật Amdahl đặt ra cận trên tuyệt đối
      cho kiến trúc đa nhân dù đầu tư bao nhiêu phần cứng. Phần mã tuần tự không thể song song hoá chiếm mười phần trăm sẽ
      mãi chặn mức tăng tốc tối đa ở ngưỡng mười lần. Ở cấu hình tám nhân tính toán, hệ số tăng tốc thực tế chỉ đạt bốn phẩy
      bảy một lần. Hiểu đúng ranh giới toán học giúp đội ngũ tối ưu đúng chỗ nút cổ chai tuần tự thay vì ném tiền nâng cấp
      số lượng nhân vô ích.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>def dfa(s):</div><div>    st = 0</div><div>    for
      ch in s:</div><div>        if ch not in (''a'', ''b''): return 0</div><div>        st = 1 if ch == ''a'' else (2 if st == 1 else 0)</div><div>    return int(st == 2)</div><div>amd8
      = 1.0 / (0.10 + 0.90 / 8.0)</div><div>print(f''accept_aaab={dfa("aaab")} reject_aba={dfa("aba")} amdahl_8={amd8:.2f}'')</div></div>'
    say: Đoạn mã cài đặt trực tiếp ôtômat ba trạng thái chỉ dùng bốn dòng vòng lặp đơn giản. Khi gặp ký tự a máy chuyển sang
      trạng thái chờ một, và chỉ vào trạng thái chấp nhận hai nếu trước b đúng là trạng thái một. Tiếp theo chương trình tính
      trực tiếp hệ số tăng tốc ở tám nhân cho bài toán chín mươi phần trăm song song. Cấu trúc bốn dòng vòng lặp thẳng tắp
      không phụ thuộc ngăn xếp quay lui nên tiêu tốn bộ nhớ hằng số bất kể độ dài chuỗi.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>accept_aaab=1 reject_aba=0 amdahl_8=4.71</div></div>
    say: Kết quả chạy thật chứng minh chuỗi kết thúc a b trả về một, còn chuỗi a b a trả không vì không kết thúc bằng b sau
      a. Đồng thời hệ số Amdahl xuất đúng bốn phẩy bảy một. Con số bốn phẩy bảy một trên tám nhân phản ánh đúng sự kìm hãm
      của mười phần trăm mã tuần tự còn lại.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>def dfa(s):</div><div>    st = 0</div><div>    for
      ch in s:</div><div>        if ch not in (''a'', ''b''): return 0</div><div>        st = 1 if ch == ''a'' else (2 if
      st == 1 else 0)</div><div>    return int(st == 2)</div><div>cases = ['''', ''ab'', ''aab'', ''b'', ''ba'', ''abb'', ''xab'']</div><div>ok
      = all(dfa(w) == int(set(w) &lt;= {''a'',''b''} and w.endswith(''ab'')) for w in cases)</div><div>print(f''dfa_matches_spec={int(ok)} inf_limit={1.0/0.10:.1f}'')</div></div>'
    say: Ở nhánh kiểm chứng, ta quét sáu trường hợp biên gồm chuỗi rỗng, đuôi đúng, lặp hai chữ a và dư chữ b phía cuối. Ta
      gọi trực tiếp hàm DFA vừa cài rồi đối chiếu từng kết quả với đặc tả kết thúc bằng a b vì cần chắc chắn không lệch biên
      nào. Kiểm tra ký tự nằm ngoài bảng chữ cái cho phép giúp máy trạng thái loại nhanh dữ liệu rác mà không rơi vào trạng
      thái bất định.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>dfa_matches_spec=1 inf_limit=10.0</div></div>
    say: Đầu ra xác nhận DFA khớp toàn bộ ca thử, còn trần vô hạn nhân chốt tại mười lần vì phần tuần tự bằng không phẩy một.
      Phép kiểm chứng này khép lại phần kiểm đúng hình thức. Giới hạn mười lần khi số nhân tiến tới vô hạn là lời nhắc nhở
      quan trọng trước mọi đề xuất mở rộng phần cứng thiếu phân tích.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  - round((0.1 - 209715 / 2 ** 21) * 3600000, 3) == 0.343
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán / sai số</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Chuỗi
      10 ký tự</td><td>10 bước chuyển trạng thái</td><td>Tức thì</td></tr><tr><td>1 000 000 ký tự</td><td>Đúng 1 000 000 bước
      O(n)</td><td>Tránh quay lui ReDoS (treo CPU vì biểu thức)</td></tr><tr><td>Đám mây 1 000 nhân (s=10%)</td><td>Tăng tốc
      chỉ 9,91x</td><td>Lãng phí &gt;99% tiền mua nhân</td></tr><tr><td>Patriot 100 giờ (24 bit)</td><td>Cắt 0,1 thành 209715/2^21;
      3 600 000 tick lệch ≈ 0,343 s</td><td>Đếm int tick, không cộng float 0,1</td></tr></table>
    say: Bảng quy mô cho thấy rõ sức mạnh của máy trạng thái, giới hạn phần cứng song song và bẫy tích lũy nhị phân. Dù chuỗi
      dài một triệu ký tự, DFA chỉ duyệt một vòng thẳng trong vài chục mi-li-giây thay vì treo vì quay lui. Còn chạy một nghìn
      nhân khi phần tuần tự chiếm mười phần trăm sẽ lãng phí quá chín mươi chín phần trăm tài nguyên. Riêng bộ đếm 24 bit
      kiểu Patriot 1991 cắt cụt một phần mười giây nên mất gần một phần mười triệu giây mỗi nhịp. Sau một trăm giờ cộng dồn
      qua ba triệu sáu trăm nghìn nhịp sẽ lệch không phẩy ba bốn ba giây, buộc phải đếm bằng số nguyên. Nhìn bảng quy mô xử
      lý song song và thời gian thực dài hạn giúp kỹ sư tránh hai sai lầm đắt giá khi vận hành hệ thống lớn. Nếu chọn thuật
      toán khớp mẫu quay lui thay cho tuyến tính, máy chủ dễ kẹt hàng chục giây. Trên chuỗi một triệu ký tự, ôtômat tuyến
      tính xong chỉ trong vài chục mi-li-giây. Nếu kỳ vọng mua cụm một nghìn nhân khi cổ chai tuần tự còn mười phần trăm,
      chín mươi chín phần trăm tiền mua phần cứng sẽ lãng phí. Đồng hồ hai mươi bốn bít kiểu lịch sử nếu cộng dồn không phẩy
      một giây sẽ tích lũy sai số. Qua hàng triệu nhịp, độ lệch tới không phẩy ba bốn ba giây nên phải đếm số nguyên. Con
      số sai lệch không phẩy ba bốn ba giây của hệ thống phòng thủ trong lịch sử nhắc nhở rằng lỗi làm tròn tích lũy đủ gây
      hậu quả thật.
    focus:
    - 0
