- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (sai
      chuyển tiếp):</b> Tại trạng thái <code>q1</code> khi gặp tiếp <code>'a'</code> phải giữ nguyên <code>q1</code> chứ không
      lùi về <code>q0</code>.<br><b>Lỗi 2 (ảo tưởng đa nhân):</b> Bỏ qua nút cổ chai tuần tự khi dự toán mở rộng 100 nhân
      sẽ nhanh gấp 100 lần.<br><b>Lỗi 3 (trôi dấu phẩy động):</b> Cộng lặp số thực <code>0.1</code> thay cho đếm tick nguyên
      làm lệch đồng hồ hệ thống.</div></td></tr></table>
    say: Hãy kiểm điểm ba cái bẫy kinh điển trước khi bạn bắt tay vào lập trình dự án Chặng 10. Sai lầm đầu tiên là lập trình
      sai mũi tên tự quay tại trạng thái một khi gặp thêm chữ a mới, đẩy máy về trạng thái không và bỏ sót chuỗi có chữ a
      lặp. Sai lầm thứ hai là ước lượng sai khả năng mở rộng tuyến tính khi quên tỉ lệ phần tuần tự không thể chia nhỏ. Sai
      lầm thứ ba là cộng dồn trực tiếp hằng số thực không phẩy một thay cho dùng bộ đếm số nguyên. Luôn vẽ đầy đủ bảng chuyển
      trạng thái cho mọi ký tự hợp lệ tại tất cả trạng thái trước khi chuyển sang viết vòng lặp. Nhớ tách hàm kiểm chứng ôtômat
      dùng chữ ký chuẩn để bộ kiểm tự động gọi nhập trực tiếp kiểm thử biên.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự cài đặt
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <ol><li>Nếu DFA đang ở <code>q1</code> (vừa thấy 'a') mà gặp tiếp 'a', trạng thái mới nên là gì?</li><li>Với phần
      tuần tự 10%, tăng tốc tối đa khi có vô hạn nhân là bao nhiêu?</li></ol>
    say: Bạn kiểm tra lại kiến thức cốt lõi bằng hai câu hỏi ngắn sau. Câu một, nếu máy trạng thái ở q một gặp tiếp chữ a
      thì chuyển về trạng thái nào? Câu hai, phần tuần tự mười phần trăm thì trần tăng tốc tối đa là bao nhiêu lần? Bấm tạm
      dừng và trả lời. Hai câu hỏi chốt lại quy tắc tự quay tại trạng thái nhận chữ a và giới hạn trần tăng tốc song song.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Giữ nguyên ở <code><b>q1</b></code> vì chữ 'a' mới có
      thể là đầu của đuôi 'ab'.</p></td></tr></table>
    say: 'Đáp án câu một: giữ nguyên ở q một vì chữ a vừa gặp có thể ghép với chữ b ngay sau đó thành a b. Đặc tính giữ nguyên
      trạng thái một khi gặp thêm chữ a cho phép nhận dạng chính xác mọi chuỗi chứa nhiều chữ a liên tiếp trước chữ b.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Giới hạn trên bằng <code>1 / 0,10 = <b>10 lần</b></code>.</p></td></tr></table>
    say: 'Đáp án câu hai: mức tăng tốc tối đa bị chặn ở một chia không phẩy một tức mười lần. Muốn phá vỡ giới hạn mười lần
      đó, cách duy nhất là cải tiến thuật toán để giảm phần mã tuần tự xuống thấp hơn nữa.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm dự án và chấm tự động
  lab: labs/PRJ/L09
  steps:
  - show: <table class='t'><tr><th>Thực hành PRJ:L09</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Cài
      hàm dfa(s) 3 trạng thái kết thúc 'ab' và tính hệ số tăng tốc Amdahl ở N nhân</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>s1=baab
      s2=xab; p=0.80 cores=8</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh PRJ L09 duong_dan/bai_cua_ban.py</code>
      (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự tay hoàn thiện dự án Chặng 10 trên máy với sự kết hợp chặt chẽ giữa lý thuyết ôtômat và kỹ nghệ đo lường
      hiệu năng. Hãy đọc kỹ quy cách đầu vào động trong tệp đề bài dự án Chặng 10 để cài chuẩn hàm chuyển trạng thái và định luật
      Amdahl. Sau đó bạn chạy lệnh chấm để xác minh chính xác qua cả tập mẫu lẫn các ca kiểm ẩn. Chú ý kiểm thử chuỗi có chữ
      cái lạ chen giữa, chuỗi rỗng và chuỗi chỉ chứa toàn một ký tự lặp nhiều lần. Thực hiện đúng phép làm tròn hai chữ số
      thập phân cho các giá trị hệ số tăng tốc ở cả số nhân hữu hạn lẫn vô hạn.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: '<table class=''t''><tr><th>Gợi ý triển khai PRJ:L09</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước
      1 (hàm dfa)</b></td><td>Giữ chữ ký <code>def dfa(s: str) -&gt; int:</code> kiểm ký tự thuộc <code>{''a'', ''b''}</code>
      và giữ <code>st = 1</code> mỗi khi gặp <code>''a''</code></td></tr><tr><td><b>Bước 2 (Amdahl)</b></td><td>Đọc <code>s1,
      s2, p, cores</code> từ <code>stdin</code>; tính <code>1 / ((1 - p) + p / cores)</code> và <code>1 / (1 - p)</code></td></tr><tr><td><b>Bước
      3 (CLI guard)</b></td><td>Bọc đọc <code>stdin</code> trong <code>if __name__ == ''__main__'':</code> để bộ kiểm đơn
      vị có thể nạp gọi riêng <code>dfa()</code></td></tr></table>'
    say: Gợi ý cài đặt bài dự án Chặng 10 nhắc bạn ba chi tiết kỹ thuật quan trọng để vượt qua cả hai tầng kiểm thử tự động.
      Thứ nhất bạn định nghĩa hàm kiểm với tên chính xác DFA nhận chuỗi đầu vào và nhớ loại ngay ký tự nằm ngoài bảng chữ
      cái hai chữ. Thứ hai bạn bọc phần đọc tham số từ luồng chuẩn trong nhánh điều kiện chạy trực tiếp để bộ kiểm độc lập
      có thể gọi thử riêng hàm đó. Thứ ba bạn áp đúng công thức Amdahl cho số nhân động và trường hợp vô hạn nhân. Tránh chia cho 0 khi toàn bộ bài toán
      song song hoá hoàn toàn ở trường hợp vô hạn nhân.
    clear: true
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>dfa_aaab=1 dfa_aba=0</div><div>amdahl_8cores=3.33</div><div>amdahl_inf=5.00</div></div>
    say: Màn hình hiển thị các dòng đầu ra chuẩn tương ứng bộ dữ liệu mẫu. Chương trình của bạn cần đọc tham số từ luồng chuẩn
      để khớp đúng cả hai ca kiểm ẩn về ký tự lạ và tỉ lệ song song khác nhau.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Tổng kết bất biến dự án
  steps:
  - show: <div class="chain"><span class="n">DFA O(n) 0 quay lui</span><span class="a">→</span><span class="n">Amdahl 1/(s
      + p/N)</span><span class="a">→</span><span class="n">Đếm tick nguyên tránh trôi 0,1</span></div>
    say: Chuỗi tổng kết nối ba quy luật nền tảng giữ hệ thống tin cậy dưới mọi tải gồm kiểm chuỗi đơn định không quay lui,
      giới hạn Amdahl và đếm nhịp số nguyên. Sự kết hợp giữa chứng minh toán học hình thức và thực chứng định lượng tạo nên
      lớp phòng thủ vững chắc nhất cho hạ tầng quan trọng.
    clear: true
  - show: <div class='box ok'><b>Hoàn thành PRJ:L09:</b> sẵn sàng sang chặng tiếp theo.</div>
    say: Chúc mừng bạn vượt qua thử thách kỹ thuật sâu của dự án Chặng 10 và sẵn sàng bước vào dự án tổng hợp cuối cùng.
    clear: true
