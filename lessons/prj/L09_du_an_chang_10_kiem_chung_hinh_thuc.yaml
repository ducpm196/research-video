scenes:
- id: hook
  kind: hook
  title: Kiểm chứng DFA, Amdahl & sai số tích lũy
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <div class='box key'><p>DFA 3 trạng thái duyệt chuỗi độ dài <code>n</code> trong <b>O(n)</b> thời gian
      tuyến tính, định luật Amdahl chỉ ra với <b>10%</b> phần tuần tự thì chạy 8 nhân chỉ nhanh gấp <b>4,71</b>
      lần, và sai số cộng lặp 24 bit sau 100 giờ gây lệch <b>0,34 s</b>.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 10 tổng hợp kiến thức nền sâu và điều tra sự cố thật. Năm 2019 một biểu
      thức chính quy quay lui từng làm sập toàn mạng Cloudflare chỉ trong vài giây, còn năm 1991 sai số tích lũy
      một phần mười giây làm trượt tên lửa Patriot. Cùng lúc đó việc mua thêm hàng trăm nhân xử lý vẫn vô nghĩa
      nếu phần tuần tự còn mười phần trăm. Hôm nay ta cài trọn vẹn bộ máy DFA tuyến tính và mô hình kiểm trần Amdahl
      bằng Python.
    clear: true
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Ôtômat hữu hạn đơn
      định DFA</td><td>Chuyển trạng thái tất định mỗi ký tự O(1)</td></tr><tr><td>Cây cú pháp trừu tượng AST &amp; song
      song</td><td>Tính biên tăng tốc Amdahl khi phần tuần tự chặn trần</td></tr><tr><td>Công bằng, giao diện HCI
      &amp; hậu kiểm sự cố</td><td>Kiểm chứng tỉ lệ dương giữa hai nhóm và sai số dấu phẩy động</td></tr></table>
    say: Dự án Chặng 10 kết nối kiến thức chuyên gia từ lý thuyết tính toán, song song hoá và bài học hậu kiểm các
      sự cố lịch sử. Thứ nhất là dùng ôtômat đơn định để khớp chuỗi trong thời gian tuyến tính tránh treo biểu thức
      quay lui. Thứ hai là dùng định luật Amdahl tính trần tăng tốc thực tế khi thêm nhân bộ xử lý. Thứ ba là dùng
      bài học lỗi dấu phẩy động không phẩy một giây để thiết kế bộ đếm thời gian bằng số nguyên.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật dự án
  steps:
  - show: <table class='t'><tr><th>kỹ thuật / hàm cốt lõi</th><th>vai trò cài đặt</th></tr><tr><td><code>st = delta[st][ch]</code></td><td>Hàm
      chuyển trạng thái đơn định, không quay lui (0 quay lui ReDoS)</td></tr><tr><td><code>1 / ((1 - p) + p/N)</code></td><td>Hệ
      số tăng tốc Amdahl khi có N nhân với tỉ lệ song song p</td></tr><tr><td><code>int tick</code></td><td>Đếm
      tick nguyên tránh trôi số thực 0,1 lặp lại hàng triệu lần</td></tr></table>
    say: Bảng ký hiệu tổng hợp ba khái niệm kỹ thuật then chốt trong dự án Chặng 10. Hàm chuyển đơn định đọc một
      ký tự đi một bước không bao giờ quay đầu. Biểu thức Amdahl đo giới hạn tăng tốc song song thực tế. Còn bộ
      đếm số nguyên giữ đồng hồ hệ thống không bị sai số tích lũy như nhị phân dấu phẩy động.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
