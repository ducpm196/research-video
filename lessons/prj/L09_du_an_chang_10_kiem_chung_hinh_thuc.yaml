    say: Ba khối kiểm chứng dự án Chặng 10 phối hợp chặt với nhau. Khối một duyệt chuỗi từng ký tự trên máy ba trạng
      thái mà không bao giờ quay lui. Khối hai đánh giá hiệu suất thực tế theo tỉ lệ phần tuần tự. Khối ba đối chiếu
      sai số tích lũy nhị phân với phép đếm nguyên chính xác.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <div class='box key'><p><b>1. DFA kết thúc 'ab':</b> chuyển tiếp <code>q0 --a--&gt; q1 --b--&gt; q2(accept)</code>,
      nhận đúng chuỗi kết thúc 'ab'.</p><p><b>2. Luật Amdahl:</b> <code>S(N) = 1 / ((1 - p) + p/N)</code>; khi <code>p
      = 0,90, N = 8</code> cho <code>S = <b>4,71</b></code>.</p></div>
    say: Hai công thức này đặt ranh giới cứng về thời gian xử lý và mở rộng song song. Với ôtômat đơn định, mỗi
      ký tự đầu vào chỉ kích hoạt đúng một lần nhảy bảng trạng thái nên thời gian luôn tỉ lệ bậc nhất theo độ dài
      chuỗi. Với luật Amdahl, phần song song dù chia cho vô hạn nhân thì mẫu số vẫn còn nguyên phần tuần tự không
      phẩy một nên trần tăng tốc tối đa chỉ là mười.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>def dfa(s):</div><div>    st = 0</div><div>    for
      ch in s:</div><div>        st = 1 if ch == 'a' else (2 if st == 1 else 0)</div><div>    return int(st == 2)</div><div>amd8
      = 1.0 / (0.10 + 0.90 / 8.0)</div><div>print(f'accept_aaab={dfa("aaab")} reject_aba={dfa("aba")} amdahl_8={amd8:.2f}')</div></div>
    say: Đoạn mã cài đặt trực tiếp ôtômat ba trạng thái chỉ dùng bốn dòng vòng lặp đơn giản. Khi gặp ký tự a máy
      chuyển sang trạng thái chờ một, và chỉ vào trạng thái chấp nhận hai nếu trước b đúng là trạng thái một. Tiếp
      theo chương trình tính trực tiếp hệ số tăng tốc ở tám nhân cho bài toán chín mươi phần trăm song song.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>accept_aaab=1 reject_aba=0 amdahl_8=4.71</div></div>
    say: Kết quả chạy thật chứng minh chuỗi kết thúc a b trả về một, còn chuỗi a b a trả không vì không kết thúc
      bằng b sau a. Đồng thời hệ số Amdahl xuất đúng bốn phẩy bảy một.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>def dfa(s):</div><div>    st = 0</div><div>    for
      ch in s:</div><div>        if ch not in (''a'', ''b''): return 0</div><div>        st = 1 if ch == ''a'' else
      (2 if st == 1 else 0)</div><div>    return int(st == 2)</div><div>cases = ['''', ''ab'', ''aab'', ''b'', ''ba'',
      ''abb'']</div><div>ok = all(dfa(w) == int(w.endswith(''ab'')) for w in cases)</div><div>print(f''dfa_matches_spec={int(ok)}
      inf_limit={1.0/0.10:.1f}'')</div></div>'
    say: Ở nhánh kiểm chứng, ta quét sáu trường hợp biên gồm chuỗi rỗng, đuôi đúng, lặp hai chữ a và dư chữ b phía
      cuối. Ta gọi trực tiếp hàm DFA vừa cài rồi đối chiếu từng kết quả với đặc tả kết thúc bằng a b vì cần chắc
      chắn không lệch biên nào.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>dfa_matches_spec=1 inf_limit=10.0</div></div>
    say: Đầu ra xác nhận DFA khớp toàn bộ ca thử, còn trần vô hạn nhân chốt tại mười lần vì phần tuần tự bằng không
      phẩy một. Phép kiểm chứng này khép lại phần kiểm đúng hình thức.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  - round((0.1 - 209715 / 2 ** 21) * 3600000, 3) == 0.343
  steps:
  - show: '<table class=''t''><tr><th>quy mô</th><th>tải tính toán / sai số</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Chuỗi
      10 ký tự</td><td>10 bước chuyển trạng thái</td><td>Tức thì</td></tr><tr><td>1 000 000 ký tự</td><td>Đúng 1
      000 000 bước O(n)</td><td>Tránh quay lui ReDoS (treo CPU vì biểu thức)</td></tr><tr><td>Đám mây 1 000 nhân (s=10%)</td><td>Tăng tốc
      chỉ 9,91x</td><td>Lãng phí &gt;99% tiền mua nhân</td></tr><tr><td>Patriot 100 giờ (24 bit)</td><td>Cắt 0,1 thành 209715/2^21; 3 600 000 tick lệch ≈ 0,343 s</td><td>Đếm int tick, không cộng float 0,1</td></tr></table>'
    say: Bảng quy mô cho thấy rõ sức mạnh của máy trạng thái, giới hạn phần cứng song song và bẫy tích lũy nhị phân. Dù chuỗi dài một triệu
      ký tự, DFA chỉ duyệt một vòng thẳng trong vài chục mi-li-giây thay vì treo vì quay lui. Còn chạy một nghìn
      nhân khi phần tuần tự chiếm mười phần trăm sẽ lãng phí quá chín mươi chín phần trăm tài nguyên. Riêng bộ đếm 24 bit kiểu Patriot 1991 cắt cụt một phần mười giây nên mất gần một phần mười triệu giây mỗi nhịp. Sau một trăm giờ cộng dồn qua ba triệu sáu trăm nghìn nhịp sẽ lệch không phẩy ba bốn ba giây, buộc phải đếm bằng số nguyên.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 (-30đ):</b> Nhầm trạng thái từ <code>q1</code> gặp <code>'a'</code> phải giữ nguyên <code>q1</code> chứ
      không về <code>q0</code>.<br><b>Lỗi 2 (-20đ):</b> Quên phần tuần tự khi kỳ vọng mở rộng 100 nhân sẽ nhanh
      gấp 100 lần.<br><b>Lỗi 3 (-10đ):</b> Dùng số thực 0,1 cộng lặp làm bộ đếm thời gian thay vì đếm số nguyên
      tick.</div></td></tr></table>
    say: Bạn rà kỹ ba cái bẫy sau trước khi hoàn thiện bài dự án Chặng 10. Đầu tiên ở DFA, khi đang thấy chữ a tại
      q một mà gặp thêm chữ a mới, ta phải giữ nguyên ở q một vì chữ a mới vẫn mở đầu cho đuôi a b. Thứ hai là tính
      sai kỳ vọng tăng tốc song song do bỏ quên nút cổ chai tuần tự. Thứ ba là cộng dồn số thực không phẩy một gây
      trôi đồng hồ dài hạn.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự cài đặt
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <ol><li>Nếu DFA đang ở <code>q1</code> (vừa thấy 'a') mà gặp tiếp 'a', trạng thái mới nên là gì?</li><li>Với
      phần tuần tự 10%, tăng tốc tối đa khi có vô hạn nhân là bao nhiêu?</li></ol>
    say: Bạn kiểm tra lại kiến thức cốt lõi bằng hai câu hỏi ngắn sau. Câu một, nếu máy trạng thái ở q một gặp tiếp
      chữ a thì chuyển về trạng thái nào? Câu hai, phần tuần tự mười phần trăm thì trần tăng tốc tối đa là bao nhiêu
      lần? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Giữ nguyên ở <code><b>q1</b></code> vì chữ
      'a' mới có thể là đầu của đuôi 'ab'.</p></td></tr></table>
    say: 'Đáp án câu một: giữ nguyên ở q một vì chữ a vừa gặp có thể ghép với chữ b ngay sau đó thành a b.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Giới hạn trên bằng <code>1 / 0,10 = <b>10
      lần</b></code>.</p></td></tr></table>
    say: 'Đáp án câu hai: mức tăng tốc tối đa bị chặn ở một chia không phẩy một tức mười lần.'
    clear: true
