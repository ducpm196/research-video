    say: Dự án Chặng 10 kết nối kiến thức chuyên gia từ lý thuyết tính toán, song song hoá và bài học hậu kiểm các sự cố lịch
      sử. Thứ nhất là dùng ôtômat đơn định để khớp chuỗi trong thời gian tuyến tính tránh treo biểu thức quay lui. Thứ hai
      là dùng định luật Amdahl tính trần tăng tốc thực tế khi thêm nhân bộ xử lý. Thứ ba là dùng bài học lỗi dấu phẩy động
      không phẩy một giây để thiết kế bộ đếm thời gian bằng số nguyên. Một biểu thức chính quy viết thiếu cẩn trọng rất dễ
      rơi vào bẫy quay lui theo cấp số nhân. Chỉ một chuỗi dài vài chục ký tự đủ làm treo cứng dịch vụ. Ống kính lý thuyết
