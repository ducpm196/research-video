- id: hook
  kind: hook
  title: Kiểm chứng DFA, Amdahl & sai số tích lũy
  checks:
  - round(1 / (0.1 + 0.9 / 8), 2) == 4.71
  - 1 / 0.1 == 10.0
  steps:
  - show: <div class='box key'><p>DFA 3 trạng thái duyệt chuỗi độ dài <code>n</code> trong <b>O(n)</b> thời gian tuyến tính,
      định luật Amdahl chỉ ra với <b>10%</b> phần tuần tự thì chạy 8 nhân chỉ nhanh gấp <b>4,71</b> lần, và sai số cộng lặp
      24 bit sau 100 giờ gây lệch <b>0,34 s</b>.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 10 tổng hợp kiến thức nền sâu và điều tra sự cố thật. Năm 2019 một biểu thức chính
      quy quay lui từng làm sập toàn mạng Cloudflare chỉ trong vài giây, còn năm 1991 sai số tích lũy một phần mười giây làm
      trượt tên lửa Patriot. Cùng lúc đó việc mua thêm hàng trăm nhân xử lý vẫn vô nghĩa nếu phần tuần tự còn mười phần trăm.
    clear: true
  - show: ''
    say: Hôm nay ta cài trọn vẹn bộ máy DFA tuyến tính và mô hình kiểm trần Amdahl bằng Python. Kết hợp ôtômat hữu hạn đơn định,
      định luật Amdahl và đếm nhịp số nguyên giúp loại bỏ tận gốc ba sự cố kinh điển trong ngành phần mềm. Tư duy kiểm chứng
      hình thức đưa độ tin cậy hệ thống từ cảm tính lên chứng minh toán học chặt chẽ.
