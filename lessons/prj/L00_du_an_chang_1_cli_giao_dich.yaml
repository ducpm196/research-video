- id: pitfalls
  kind: pitfall
  title: Ba lỗi kỹ thuật thường gặp ở đồ án đầu tay
  steps:
  - show: <table class='t'><tr><th>lỗi kỹ thuật hay làm sai kết quả nghiệm thu</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 — Dùng khối bắt ngoại lệ rỗng làm mất dấu dòng hỏng.</b> Tổng dòng hợp lệ cộng lỗi không còn khớp tổng dòng đầu vào.<br><b>Lỗi
      2 — Quên dùng hàm COALESCE khi tính tổng bảng rỗng.</b> Khi mọi dòng đầu vào đều lỗi, truy vấn trả giá trị rỗng làm
      sai định dạng in hoặc chia cho không ở tỉ lệ.<br><b>Lỗi 3 — Viết cứng đáp án mẫu vào mã nguồn thay vì đọc từ luồng chuẩn
      stdin.</b> Chương trình chạy qua ca công khai nhưng rớt ngay lập tức khi qua ca ẩn.</div></td></tr></table>
    say: Ba lỗi kỹ thuật dưới đây là nguyên nhân phổ biến khiến bài nộp bị máy chấm từ chối. Lỗi một là nuốt ngoại lệ rồi
      bỏ qua dòng hỏng khiến mất dấu kiểm toán. Lỗi hai là quên bọc giá trị mặc định bằng không nên bảng rỗng trả về rỗng.
      Lỗi ba là viết cứng đáp án mẫu nên vừa đụng ca ẩn là sai ngay lập tức. Luôn thử chạy với trường hợp tệp trống hoàn toàn
      hoặc chỉ có toàn dòng sai định dạng để kiểm tra đầu ra trống. Tránh gán cứng bất kỳ con số kết quả nào vì ca kiểm ẩn
      sẽ đưa dữ liệu hoàn toàn khác với mẫu công khai.
