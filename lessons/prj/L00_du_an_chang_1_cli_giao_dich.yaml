      chức năng &amp; bất biến</td><td>Số dòng hợp lệ cộng số dòng lỗi bằng tổng dòng; tổng ròng Python khớp tuyệt đối SQLite
      từng tài khoản</td></tr><tr><td>Biên &amp; lỗi đầu vào</td><td>Dòng rỗng, thiếu cột, số tiền âm hoặc bằng 0, chữ lạ
      không gây lỗi chạy mà tăng bộ đếm lỗi</td></tr><tr><td>Quy mô &amp; tái lập tất định</td><td>Chạy sạch từ ca vài dòng
      tới 10 000 dòng trong một giao dịch lô, lặp lại không đổi</td></tr></table>
    say: Ba nhóm tiêu chí nghiệm thu trên bảng dùng chuẩn Đạt hay Chưa đạt thay cho mọi thang điểm. Trước hết, tổng dòng đọc
      vào phải bằng dòng hợp lệ cộng dòng lỗi. Số dư từng tài khoản giữa hai cách tính cũng phải khớp tuyệt đối. Ca ẩn còn
      thả dữ liệu rỗng, số không và tệp mười nghìn dòng để kiểm tốc độ lẫn tính tất định. Nếu chỉ một chữ số bị rớt vì dòng
      lỗi không được đếm đủ, báo cáo đối soát cuối ngày lập tức không khớp tổng vốn. Tính tất định bảo đảm chạy lại bao nhiêu
      lần trên cùng một dữ liệu đầu vào cũng phải xuất ra chính xác từng ký tự.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.4'
    - '1.2'
    - '1.4'
