- id: formula
  kind: formula
  title: Công thức bảo toàn tổng sổ và tỉ lệ hợp lệ
  checks:
  - alg.prj_csv_totals([('IN',1000),('OUT',300),('IN',500),('OUT',200)]) == (2, 2, 1000)
  steps:
  - show: '<div class=''box key''><p>Gọi $V$ là số dòng hợp lệ, $E$ là số dòng lỗi trong tổng $N = V + E$ dòng dữ liệu thô:</p><p>Tỉ
      lệ hợp lệ = <code>V / N × 100%</code> (bằng <code>0,0%</code> nếu $N = 0$) và số dư ròng = <code>tổng IN − tổng OUT</code>.</p><p>Với
      4 dòng hợp lệ (+1000, -300, +500, -200) và 1 dòng lỗi: số dư ròng = 1500 − 500 = <b>1 000</b>, hợp lệ = 4/5 = <b>80,0%</b>.</p></div>'
    say: Công thức kế toán rất gọn nhưng buộc mọi dòng dữ liệu đều phải có giải trình rõ ràng. Tổng số dòng đầu vào luôn bằng
      dòng hợp lệ cộng dòng lỗi nên không có bản ghi nào biến mất. Khi tệp rỗng hoàn toàn, ta trả về không phần trăm vì phép
      chia cho không sẽ làm sập tiến trình. Ở mẫu chuẩn, bốn trên năm dòng hợp lệ đạt tám mươi phần trăm và số dư ròng một
      nghìn. Đối chiếu thêm một phép kiểm khác, nếu chỉ tính tổng trên bốn dòng sạch mà quên mẫu số năm thì tỉ lệ sẽ bị đội
      giả lên một trăm phần trăm. Phép kiểm chứng chéo phần trăm hợp lệ tránh lỗi chia cho không khi tệp đầu vào rỗng hoặc
      toàn ký tự trắng. Mọi trường hợp biên như dòng trống giữa tệp đều phải tăng bộ đếm lỗi chứ không được bỏ qua âm thầm.
    focus:
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: chuẩn hoá CSV và lọc ranh giới lỗi'
  checks:
  - 4 / 5 == 0.8
  steps:
  - show: <table class='t'><tr><th>điều kiện kiểm tra dòng CSV</th><th>vai trò khi lọc biên dữ liệu</th></tr><tr><td><code>len(parts)
      == 3</code> và <code>acc != ""</code></td><td>Loại dòng trống hoặc thiếu/thừa dấu phẩy ngay từ vòng đầu</td></tr><tr><td><code>amt.isdigit()
      and int(amt) &gt; 0</code></td><td>Chặn đồng thời chữ lạ, số âm và số tiền bằng 0 trong một biểu thức an toàn</td></tr></table>
    say: Hai biểu thức điều kiện trên bảng giữ an toàn cho toàn bộ bộ phân tích. Ta tách dấu phẩy và kiểm đúng ba cột với
      tên tài khoản khác rỗng. Nhờ kiểm chuỗi chỉ gồm chữ số và lớn hơn không, ta chặn gọn chữ lạ lẫn số âm. Kiểm tra ký tự
      toàn số bằng hàm kiểm định chuỗi giúp chặn luôn dấu trừ âm trước khi ép kiểu số nguyên. Mỗi nhánh điều kiện đều được
      đặt rõ ràng theo trình tự từ cấu trúc cột tới giá trị dương hợp lệ.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
  - show: <p><b>Phân tích 5 dòng CSV thô (có 1 dòng lỗi BAD)</b></p><div class="code"><div>lines = ['u1,IN,1000', 'u1,OUT,300',
      'u1,IN,500',</div><div>         'u1,BAD,xyz', 'u1,OUT,200']</div><div>ok, bad, in_t, out_t = [], 0, 0, 0</div><div>for
      ln in lines:</div><div>    p = [x.strip() for x in ln.split(',')]</div><div>    if len(p)==3 and p[0] and p[1] in ('IN','OUT')
      and p[2].isdigit():</div><div>        v = int(p[2])</div><div>        if v &gt; 0:</div><div>            ok.append((p[0],
      p[1], v))</div><div>            in_t += v if p[1]=='IN' else 0; out_t += v if p[1]=='OUT' else 0</div><div>            continue</div><div>    bad
      += 1</div><div>print(f'valid={len(ok)} bad={bad} pct={100*len(ok)/len(lines):.1f}% in={in_t} out={out_t}')</div></div>
    say: Đoạn mã trên minh hoạ vòng lặp chuẩn hoá từng dòng từ danh sách năm dòng thô. Khi gặp dòng thứ tư chứa chữ sai định
      dạng, nhánh điều kiện lập tức chuyển sang tăng bộ đếm lỗi. Bốn dòng hợp lệ còn lại được tích lũy thành tổng nạp và tổng
      rút chính xác. Khoảng trắng dư thừa quanh dấu phẩy hay cuối dòng đều được cắt gọn sạch sẽ trước khi đánh giá giá trị.
      Nhờ rẽ nhánh sớm bằng từ khoá tiếp tục vòng lặp, các dòng hợp lệ tích lũy nhanh chóng vào hai biến tổng nạp và rút.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>valid=4 bad=1 pct=80.0% in=1500 out=500</div></div>
    say: Đầu ra chạy thật xác nhận tách được bốn dòng hợp lệ đạt tám mươi phần trăm và một dòng lỗi. Tổng tiền nạp một nghìn
      năm trăm và tổng rút năm trăm khớp hoàn toàn. Mỗi dòng hợp lệ và lỗi đều khớp đúng từng phần trăm với công thức kế toán
      tổng thể đã thiết lập.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chiếu tổng nạp, tổng rút, số dư ròng từng tài khoản bằng SQLite
  checks:
  - 50000 * 100 - 50000 * 50 == 2_500_000
  - 2400 - 600 == 1800
  steps:
  - show: '<p><b>Đối chiếu tổng nạp, tổng rút, số dư ròng từng tài khoản Python với SQLite</b></p><div class="code"><div>import
      sqlite3</div><div>ok = [(''u1'',''IN'',1000),(''u1'',''OUT'',300),(''u2'',''IN'',500),(''u2'',''OUT'',200)]</div><div>py_acc
      = {''u1'': 700, ''u2'': 300}</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE TABLE l(acc
      TEXT, tp TEXT, v INT)'')</div><div>with db: db.executemany(''INSERT INTO l VALUES(?,?,?)'', ok)</div><div>q_net = "SELECT
      COALESCE(SUM(CASE WHEN tp=''IN'' THEN v ELSE -v END),0) FROM l"</div><div>q_acc = "SELECT acc, SUM(CASE WHEN tp=''IN''
      THEN v ELSE -v END) FROM l GROUP BY acc ORDER BY acc"</div><div>sql_net = db.execute(q_net).fetchone()[0]</div><div>sql_acc = dict(db.execute(q_acc).fetchall())</div><div>print(f''match={py_acc==sql_acc}
      sql_net={sql_net} acc={sql_acc}'')</div></div>'
    say: Ở phép kiểm chứng đầu tiên, ta nạp bốn dòng sạch của hai tài khoản vào bảng cơ sở dữ liệu trong bộ nhớ. Câu truy
      vấn gộp nhóm theo tên tài khoản dùng để tính lại số dư ròng độc lập rồi so khớp với từ điển Python. Hàm COALESCE với giá
      trị mặc định bằng không bảo đảm kết quả vẫn là số nguyên ngay cả khi bảng trống. Nhớ rằng trong thực tế, bảng giao dịch có
      thể rỗng hoàn toàn khi mọi dòng đầu vào đều sai cú pháp. Vì vậy việc bọc kết quả hàm tổng bằng hàm giá trị mặc định
      không là chi tiết nhỏ nhưng quyết định tính ổn định.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>match=True sql_net=1000 acc={''u1'': 700, ''u2'':
      300}</div></div>'
    say: Kết quả chạy thật trả về khớp tuyệt đối vì tổng nạp trừ tổng rút của cả hai tài khoản u1 và u2 đều khớp nhau. Số
      dư ròng toàn sổ đạt đúng một nghìn nên quy trình đối chiếu hai nhánh hoàn toàn nhất quán. Tên từng tài khoản được sắp
      xếp tăng dần giúp chuỗi đầu ra không bị thay đổi ngẫu nhiên theo thứ tự nạp.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Đo quy mô chèn lô 100 000 dòng trong một giao dịch duy nhất</b></p><div class="code"><div>import sqlite3,
      time</div><div>rows = [(''u1'', ''IN'' if i%2==0 else ''OUT'', 100 if i%2==0 else 50)</div><div>        for i in range(100000)]</div><div>db
      = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE TABLE l(acc TEXT, tp TEXT, v INT)'')</div><div>t0 = time.perf_counter()</div><div>with
      db: db.executemany(''INSERT INTO l VALUES(?,?,?)'', rows)</div><div>q = "SELECT COALESCE(SUM(CASE WHEN tp=''IN'' THEN
      v ELSE -v END),0) FROM l"</div><div>net = db.execute(q).fetchone()[0]</div><div>dt = (time.perf_counter() - t0) * 1000</div><div>print(f''n={len(rows)}
      net={net} batch_ok={dt &lt; 1000}'')</div></div>'
    say: Phép kiểm chứng thứ hai đo tốc độ khi đưa một trăm nghìn dòng qua một lệnh chèn lô duy nhất. Ta gom trọn vào một
      giao dịch vì cần giảm số lần đồng bộ ổ đĩa từ hàng trăm nghìn xuống đúng một lần. Khi sử dụng một giao dịch duy nhất
      bọc toàn bộ lệnh chèn, cơ sở dữ liệu chỉ phải đồng bộ nhật ký xuống đĩa đúng một lần.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>n=100000 net=2500000 batch_ok=True</div></div>
    say: Đầu ra xác nhận một trăm nghìn dòng đạt tổng hai triệu năm trăm nghìn và hoàn tất nhanh dưới một giây vì thời gian
      xử lý tăng tuyến tính. Hiệu năng ổn định ngay ở mức một trăm nghìn bản ghi bảo đảm chương trình vượt gọn các ca ẩn kích
      thước lớn.
    clear: true
    focus:
    - 1
    - 2
- id: quymo
  kind: example
  title: Chi phí thời gian và bộ nhớ của quy trình đối chiếu qua 3 cỡ tệp
  checks:
  - 100_000 // 10_000 == 10
  steps:
  - show: <table class='t'><tr><th>cỡ tệp CSV đầu vào</th><th>độ phức tạp thuật toán</th><th>hành vi bộ nhớ và giao dịch SQLite</th></tr><tr><td>6
      dòng (ca công khai nhỏ)</td><td>O(n) đọc một lượt</td><td>Thực thi tức thì dưới vài mi-li-giây (số ước lượng)</td></tr><tr><td>200–1
      000 dòng (ca vừa)</td><td>O(n) một giao dịch chèn lô</td><td>Tạo cơ sở dữ liệu RAM sạch không rò rỉ tệp</td></tr><tr><td>10
      000–100 000 dòng (ca lớn)</td><td>O(n) gom 1 giao dịch</td><td>Chậm hàng chục đến trăm lần nếu tách COMMIT từng dòng</td></tr></table>
    say: Bảng ba mức quy mô giải thích vì sao cách đọc một lượt và chèn lô quyết định hiệu năng khi dữ liệu tăng mạnh. Ở cỡ
      vài dòng đầu, mọi cách viết đều cho cảm giác chạy tức thì như nhau. Ở cỡ vài trăm đến một nghìn dòng, nạp nhanh vào
      cơ sở dữ liệu trong bộ nhớ vẫn rất nhẹ. Nhưng khi ca ẩn đưa vào mười nghìn đến một trăm nghìn dòng, tách rời từng lần
      chốt giao dịch sẽ làm nghẽn đĩa ngay. Do đó đóng gói trọn lô vào một khối giao dịch duy nhất là yêu cầu bắt buộc. Với
      những lỗi tiềm ẩn chỉ lộ diện khi kích thước tệp tăng gấp nghìn lần, thử nghiệm quy mô lớn là bước bắt buộc. Kỹ thuật
      nạp theo lô kết hợp duyệt tuyến tính giữ bộ nhớ tiêu thụ thấp ngay cả trên máy cấu hình hạn chế.
