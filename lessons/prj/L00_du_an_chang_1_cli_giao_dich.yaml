- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - 2000 - 750 == 1250
  - 8 / 10 == 0.8
  steps:
  - show: <ol><li>Nhận tệp 10 dòng gồm 8 dòng hợp lệ (tổng nạp 2 000, tổng rút 750) và 2 dòng sai. Số dư ròng và tỉ lệ hợp
      lệ bằng bao nhiêu?</li><li>Nếu cả 5 dòng đầu vào đều sai định dạng, giá trị <code>sql_net</code>, <code>valid_pct</code>
      và <code>acc_nets</code> phải in ra như thế nào?</li></ol>
    say: Đến lượt bạn tự kiểm tra tiêu chí dự án trước khi viết mã thật. Câu một, nếu có tám dòng hợp lệ với tổng nạp hai
      nghìn và tổng rút bảy trăm năm mươi kèm hai dòng lỗi trong mười dòng, số dư ròng và tỉ lệ hợp lệ là bao nhiêu? Câu hai,
      khi cả năm dòng đầu vào đều sai định dạng không có dòng hợp lệ nào, ba trường tổng, tỉ lệ và số dư từng tài khoản phải
      in ra sao? Bấm tạm dừng và trả lời. Hai câu hỏi này kiểm tra trực tiếp cách tính tỉ lệ hợp lệ và hành vi an toàn khi
      dữ liệu hoàn toàn hỏng.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Số dư ròng = <code>2000 - 750 = <b>1 250</b></code>;
      tỉ lệ hợp lệ = <code>8 / 10 = <b>80,0%</b></code>.</p></td></tr></table>
    say: 'Đáp án câu một: số dư ròng lấy hai nghìn trừ bảy trăm năm mươi bằng một nghìn hai trăm năm mươi, tỉ lệ hợp lệ đạt
      tám mươi phần trăm. Luôn chia cho tổng số dòng gốc đọc được chứ không bao giờ chia riêng cho số dòng hợp lệ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Dùng <code>COALESCE(..., 0)</code> nên <code>sql_net=0</code>,
      <code>valid_pct=0.0%</code> và <code>acc_nets=none</code> (vẫn giữ <code>bad=5</code>).</p></td></tr></table>
    say: 'Đáp án câu hai: nhờ bọc giá trị mặc định, tổng cơ sở dữ liệu trả về không, tỉ lệ hợp lệ là không phần trăm và số
      dư từng tài khoản in chữ trống đúng quy ước. Quy ước trả chữ trống khi không có tài khoản hợp lệ nào giúp bộ phân tích
      kết quả không gặp lỗi thiếu dòng.'
    clear: true
