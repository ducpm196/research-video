      ngoại lệ Python</td><td>Tách trường dữ liệu từng dòng CSV, đếm dòng lỗi không để sập chương trình</td></tr><tr><td>Truy
      vấn gộp SUM/CASE và GROUP BY</td><td>Tính lại tổng ròng toàn hệ thống và số dư từng tài khoản bằng SQLite</td></tr><tr><td>Luồng
      chuẩn stdin/stdout và chấm tự động</td><td>Nhận tệp lớn nhỏ linh hoạt qua ống dẫn để vượt qua cả ca công khai lẫn ca
      ẩn</td></tr></table>
    say: Dự án Chặng 1 huy động ba công cụ nền bạn đã thực hành. Python chịu trách nhiệm đọc từng dòng tệp văn bản và bắt
      an toàn các dòng hỏng định dạng. Cơ sở dữ liệu nhẹ tính tổng từng tài khoản độc lập để đối chiếu với bộ nhớ. Luồng nhập
      chuẩn giúp bộ chấm thử được từ mẫu nhỏ tới tệp hàng chục nghìn dòng. Hai nhánh tính toán trong bộ nhớ và cơ sở dữ liệu
      kiểm chéo cho nhau nhằm loại bỏ sai sót cộng trừ âm thầm. Nhờ nhận dữ liệu qua luồng chuẩn thay vì mở cứng tên tệp,
      chương trình dễ dàng kết hợp với mọi kịch bản kiểm thử.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.4'
    clear: true
