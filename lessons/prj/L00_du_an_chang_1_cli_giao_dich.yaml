scenes:
- id: hook
  kind: hook
  title: Ghép Bash, Python và SQLite đối chiếu sổ giao dịch thực tế
  checks:
  - alg.prj_csv_totals([('IN',1000),('OUT',300),('IN',500),('OUT',200)]) == (2, 2, 1000)
  steps:
  - show: '<div class=''box key''><p>Ở Chặng 1, bạn đã học dòng lệnh, Python và SQLite rời rạc. Dự án này ghép ba công cụ
      thành quy trình xử lý tệp CSV đọc từ đầu vào chuẩn <code>stdin</code>.</p><p>Ví dụ minh hoạ: nhận 5 dòng gồm 4 giao
      dịch hợp lệ (<code>+1000, -300, +500, -200</code>) và 1 dòng sai định dạng → phải tách riêng dòng lỗi để tính đúng tổng
      ròng <b>1 000</b>.</p></div>'
    say: Chào bạn đến với dự án tổng hợp cuối Chặng 1. Khi xử lý dữ liệu tài chính thực tế, tệp đầu vào hiếm khi hoàn hảo
      mà luôn lẫn dòng rỗng hoặc số không hợp lệ. Nếu chương trình nuốt lỗi im lặng hay sập giữa chừng, sổ quỹ cuối ngày sẽ
      lệch ngay. Hôm nay ta ghép đọc luồng chuẩn, lọc bằng Python và đối chiếu SQLite thành một công cụ hoàn chỉnh. Kỹ năng
      ghép công cụ nhỏ thành đường ống dữ liệu giúp bạn xử lý hàng vạn giao dịch chỉ trong vài giây. Mọi quy tắc kiểm tra
      đều phải giữ nguyên khi mở rộng từ năm dòng mẫu lên hàng chục nghìn dòng thật.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
  - show: '<table class=''t''><tr><th>dự án</th><th>trọng tâm thực hành theo chặng</th></tr><tr><td>L00 (Chặng 1)</td><td>Sổ
      giao dịch đa công cụ: lọc CSV và đối chiếu SQLite</td></tr><tr><td>L01 (Chặng 2)</td><td>Lõi chuyển khoản bút toán kép
      và khoá tránh bế tắc</td></tr><tr><td>L02–L03 (Chặng 3–4)</td><td>Cổng lũy đẳng bảo mật, đối soát ba bên và bảo vệ kiến
      trúc</td></tr><tr><td>L04 (Chặng 5)</td><td>Tìm đường chi phí thấp nhất trên đồ thị và hồi quy tối ưu</td></tr></table>'
    say: Khoá dự án nối thẳng năm chặng kiến thức nền thành sản phẩm chạy thật. Bài 0 làm chủ chuẩn hoá dữ liệu CSV và đối
      chiếu cơ sở dữ liệu nhẹ. Bài 1 xây lõi chuyển khoản bút toán kép sạch lỗi đồng thời. Bài 2 và bài 3 giải bài toán cổng
      bảo mật và đối soát ba bên, rồi bài 4 chốt bằng đồ thị và hồi quy. Mỗi bài dự án đều được nghiệm thu hoàn toàn tự động
      qua ca kiểm thử công khai lẫn các ca kiểm ẩn. Việc đi qua trọn năm chặng giúp bạn rèn tư duy hệ thống liền mạch từ dòng
      lệnh tới kiến trúc mở rộng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.4'
    - '1.5'
    clear: true
    forward_ref: true
