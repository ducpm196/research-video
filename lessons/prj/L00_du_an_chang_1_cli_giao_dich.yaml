- id: intuition
  kind: intuition
  title: 'Đường ống hai nhánh đối chiếu chéo CSV: Python + SQLite'
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="35" y="50" width="210" height="95"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="140.0" y="92" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Tệp CSV đầu vào</text><text x="140.0" y="120" font-size="15" text-anchor="middle"
      fill="#475569">5 dòng (1 dòng lỗi)</text><line x1="245" y1="97" x2="315" y2="97" stroke="#475569" stroke-width="2"/><polygon
      points="315,97 307,92 307,102" fill="#475569"/><text x="280" y="89" font-size="14" font-weight="600" text-anchor="middle"
      fill="#1e293b">lọc &amp; tách</text><rect x="315" y="30" width="275" height="68" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="2"/><text x="452.5" y="60" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Nhánh
