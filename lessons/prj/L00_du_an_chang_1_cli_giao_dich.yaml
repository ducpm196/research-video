      1 500 - Rút 500 = 1 000</text><rect x="315" y="118" width="275" height="68" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="2"/><text x="452.5" y="148" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Nhánh
      SQLite: bảng ledger</text><text x="452.5" y="168" font-size="15" text-anchor="middle" fill="#475569">SUM(CASE
      ...) = 1 000</text><line x1="590" y1="97" x2="680" y2="97" stroke="#475569" stroke-width="2"/><polygon points="680,97
      672,92 672,102" fill="#475569"/><text x="635" y="89" font-size="14" font-weight="600" text-anchor="middle"
      fill="#1e293b">khớp 100%</text><rect x="680" y="50" width="240" height="95" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="2"/><text x="800.0" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Báo
      cáo chuẩn hoá</text><text x="800.0" y="120" font-size="15" text-anchor="middle" fill="#475569">net=1000 valid_pct=80.0%</text></svg></div>'
    say: Nhìn sơ đồ luồng xử lý hai nhánh song song trên màn hình. Tệp đầu vào đi qua bước chuẩn hoá đầu tiên để
      giữ bốn dòng hợp lệ và đếm riêng một dòng sai định dạng. Sau đó nhánh tính trong bộ nhớ và nhánh truy vấn
      cơ sở dữ liệu độc lập cùng tính tổng nạp rút rồi đối chiếu trước khi in báo cáo chuẩn.
    clear: true
- id: formula
  kind: formula
  title: Công thức bảo toàn tổng sổ và tỉ lệ hợp lệ
  checks:
  - alg.prj_csv_totals([('IN',1000),('OUT',300),('IN',500),('OUT',200)]) == (2, 2, 1000)
  steps:
  - show: '<div class=''box key''><p>Gọi $V$ là số dòng hợp lệ, $E$ là số dòng lỗi trong tổng $N = V + E$ dòng dữ
      liệu thô:</p><p>Tỉ lệ hợp lệ = <code>V / N × 100%</code> và số dư ròng = <code>tổng IN − tổng OUT</code>.</p><p>Với
      4 dòng hợp lệ (+1000, -300, +500, -200) và 1 dòng lỗi: số dư ròng = 1500 − 500 = <b>1 000</b>, hợp lệ = 4/5
      = <b>80,0%</b>.</p></div>'
    say: Công thức kế toán rất đơn giản nhưng cực kỳ chặt chẽ vì buộc mọi dòng dữ liệu đều phải giải trình. Tổng
      số dòng đọc vào bằng số dòng hợp lệ cộng số dòng lỗi nên không thể có dòng nào mất tích im lặng. Ở bộ mẫu
      chuẩn bốn trên năm dòng hợp lệ cho tỉ lệ đúng tám mươi phần trăm và số dư ròng bằng một nghìn.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: chuẩn hoá CSV lỗi và đối chiếu Python với SQLite'
  checks:
  - 4 / 5 == 0.8
  steps:
  - show: <table class='t'><tr><th>ký hiệu / kỹ thuật</th><th>vai trò trong dự án</th></tr><tr><td><code>int(amt)
      &lt;= 0 → bad += 1</code></td><td>Tách dòng số âm hoặc chữ hỏng vào biến đếm lỗi thay vì sập</td></tr><tr><td><code>sqlite3.connect(':memory:')</code></td><td>Tạo
      nhanh cơ sở dữ liệu trong RAM để kiểm chứng độc lập bằng truy vấn</td></tr></table>
    say: Giải thích hai kỹ thuật bảo vệ đầu vào và đối chiếu song song sẽ chạy ngay trong mã dự án mẫu.
    clear: true
  - show: '<p><b>Xử lý 5 dòng mẫu (có 1 dòng lỗi) và đối chiếu tổng giữa Python và SQLite</b></p><div class="code"><div>import
      sqlite3</div><div>lines = [''u1,IN,1000'',''u1,OUT,300'',''u1,IN,500'',''u1,BAD,xyz'',''u1,OUT,200'']</div><div>ok,
      bad, py_net = [], 0, 0</div><div>for ln in lines:</div><div>    _, tp, amt = ln.split('','')</div><div>    if
      tp in (''IN'',''OUT'') and amt.isdigit():</div><div>        v = int(amt); ok.append((tp, v)); py_net += v
      if tp==''IN'' else -v</div><div>    else: bad += 1</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE
      TABLE t(tp TEXT, v INT)''); db.executemany(''INSERT INTO t VALUES(?,?)'', ok)</div><div>sql_net = db.execute("SELECT
      SUM(CASE WHEN tp=''IN'' THEN v ELSE -v END) FROM t").fetchone()[0]</div><div>print(f''valid={len(ok)} bad={bad}
      pct={100*len(ok)/len(lines):.1f}% py={py_net} sql={sql_net}'')</div></div>'
    say: Đoạn mã đọc chuỗi năm dòng dữ liệu gồm một dòng cố tình ghi sai số tiền thành chữ. Vòng lặp kiểm tra hợp
      lệ cộng tổng trong bộ nhớ trước khi nạp bốn dòng sạch sang bảng cơ sở dữ liệu nhẹ để tính lại bằng câu lệnh
      tổng hợp.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>valid=4 bad=1 pct=80.0% py=1000 sql=1000</div></div>
    say: Đầu ra thật cho thấy một dòng hỏng bị tách riêng nên bộ đếm lỗi bằng một và tỉ lệ hợp lệ đạt tám mươi phần
      trăm. Số dư ròng một nghìn khớp tuyệt đối giữa cả hai cách tính.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đo quy mô O(n) trên 100 000 dòng giao dịch
  checks:
  - 50000 * 100 - 50000 * 50 == 2_500_000
  steps:
  - show: '<p><b>Kiểm chứng hiệu năng xử lý tuyến tính ở mốc 100 000 dòng dưới 1 giây</b></p><div class="code"><div>import
      time</div><div>n = 100000; s = 0</div><div>t0 = time.perf_counter()</div><div>for i in range(n): s += (100
      if i % 2 == 0 else -50)</div><div>dt = (time.perf_counter() - t0) * 1000</div><div>print(f''n={n} net={s}
      linear_ok={dt &lt; 1000}'')</div></div>'
    say: Ở đường kiểm chứng hiệu năng, ta chạy thử vòng lặp một trăm nghìn giao dịch vì cần kiểm tra tốc độ tuyến
      tính. Phép thử này xác nhận bộ lọc chạy sạch trên dữ liệu lớn.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>n=100000 net=2500000 linear_ok=True</div></div>
    say: Kết quả thật xác nhận một trăm nghìn dòng đạt tổng hai triệu năm trăm nghìn vì vòng lặp chạy một lượt duy
      nhất nên hoàn tất dưới một giây.
    clear: true
- id: quymo
  kind: example
  title: Chi phí thời gian và bộ nhớ của quy trình đối chiếu qua 3 cỡ tệp
  checks:
  - 100_000 * 1 == 100_000
  steps:
  - show: <table class='t'><tr><th>số dòng CSV</th><th>độ phức tạp xử lý</th><th>thời gian ước lượng (Python + SQLite)</th></tr><tr><td>100
      dòng (nhỏ)</td><td>O(n) đọc một lượt</td><td>Dưới 2 mi-li-giây</td></tr><tr><td>10 000 dòng (vừa)</td><td>O(n)
      với 1 giao dịch chèn lô</td><td>~25 mi-li-giây</td></tr><tr><td>100 000 dòng (lớn)</td><td>O(n) đọc tuần tự
      từng dòng</td><td>~180 mi-li-giây (không nạp hết RAM nếu phát luồng)</td></tr></table>
    say: Bảng quy mô giải thích vì sao cấu trúc đọc từng dòng lại quan trọng khi dung lượng tăng từ trăm dòng lên
      trăm nghìn dòng. Bằng cách gộp câu lệnh chèn lô vào cơ sở dữ liệu thay vì mở đóng liên tục từng dòng, thời
      gian xử lý giữ tuyến tính dưới hai trăm mi-li-giây mà không làm phình bộ nhớ.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm nặng ở đồ án thực tế
  steps:
  - show: '<table class=''t''><tr><th>lỗi mất điểm phổ biến khi nộp dự án</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1 (-20đ): Dùng <code>try/except: pass</code> nuốt mất dòng lỗi.</b> Tổng số dòng không khớp đầu vào và không
      báo được dòng nào bị hỏng.<br><b>Lỗi 2 (-20đ): Nạp cả tệp hàng GB bằng <code>f.readlines()</code> vào RAM.</b>
      Hãy lặp trực tiếp từng dòng <code>for line in f:</code>.<br><b>Lỗi 3 (-10đ): Gọi <code>COMMIT</code> sau mỗi
      dòng INSERT vào SQLite.</b> Tốc độ chậm hàng trăm lần; phải gói cả lô trong một giao dịch.</div></td></tr></table>'
    say: Có ba lỗi phổ biến dễ làm mất điểm nặng ở dự án đầu tiên. Thứ nhất là bắt ngoại lệ rồi im lặng cho qua
      khiến dòng hỏng biến mất khỏi báo cáo kiểm toán. Thứ hai là đọc trọn cả tệp khổng lồ vào danh sách bộ nhớ
      thay vì lặp luồng từng dòng. Thứ ba là quên gom nhiều lệnh chèn vào chung một giao dịch cơ sở dữ liệu.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - 2000 - 750 == 1250
  - 8 / 10 == 0.8
  steps:
  - show: <ol><li>Nhận tệp 10 dòng gồm 8 dòng hợp lệ (tổng nạp 2 000, tổng rút 750) và 2 dòng sai. Số dư ròng và
      tỉ lệ hợp lệ bằng bao nhiêu?</li><li>Khi chèn 100 000 dòng sạch vào SQLite, vì sao phải gom chung vào một
      giao dịch thay vì tự động lưu từng dòng?</li></ol>
    say: Đến lượt bạn tự kiểm tra tiêu chí dự án. Câu một, nếu có tám dòng hợp lệ với tổng nạp hai nghìn và tổng
      rút bảy trăm năm mươi kèm hai dòng lỗi trong mười dòng, số dư ròng và tỉ lệ hợp lệ là bao nhiêu? Câu hai,
      vì sao cần gom một trăm nghìn dòng chèn vào cùng một giao dịch cơ sở dữ liệu? Bấm tạm dừng và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Số dư ròng = <code>2000 - 750 = <b>1 250</b></code>;
      tỉ lệ hợp lệ = <code>8 / 10 = <b>80,0%</b></code>.</p></td></tr></table>
