scenes:
- id: hook
  kind: hook
  title: Đường ống phân loại & đo độ lệch ECE
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: '<div class=''box key''><p>Với ma trận <code>TP=4, FP=1, FN=2, TN=13</code>: đạt <code>Precision = <b>0,80</b></code>,
      <code>Recall = <b>0,67</b></code>, <code>F1 = <b>0,73</b></code> và đo <code>ECE = <b>0,15</b></code> khi
      mô hình lệch 15% tin cậy ở 2 giỏ.</p></div>'
    say: Chào bạn đến với dự án chốt Chặng 9 về trí tuệ nhân tạo và học máy. Độ chính xác tổng thể chín mươi chín
      phần trăm trên bài toán gian lận chỉ chiếm một phần trăm là con số đánh lừa, vì mô hình đoán toàn âm cũng
      đạt mức đó. Ngay cả khi F1 khá tốt, một mô hình dự báo xác suất chín mươi phần trăm nhưng thực tế chỉ đúng
      bảy mươi phần trăm sẽ làm sai mọi quyết định đặt ngưỡng rủi ro. Hôm nay ta cài trọn vẹn bộ đánh giá F1 và
      chỉ số hiệu chuẩn ECE bằng Python thuần.
    clear: true
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Tối ưu hàm mất mát
      & softmax (CS115/MLP)</td><td>Chuyển logit thành xác suất chuẩn hoá tổng bằng 1</td></tr><tr><td>Độ chuẩn
      xác, độ phủ & ranking (IRS/DAN)</td><td>Đo chất lượng phân loại trên tập lệch nhãn</td></tr><tr><td>Giám sát
      trôi lệch & đánh giá RAG/LLM (MLO/LLM)</td><td>Kiểm chứng hiệu chuẩn xác suất và rò rỉ tập kiểm tra</td></tr></table>
    say: Dự án Chặng 9 tổng hợp các mảnh ghép cốt lõi từ toán học máy, khoa học dữ liệu và vận hành mô hình. Thứ
      nhất là xử lý đầu ra xác suất từ các bộ phân loại tuyến tính hoặc mạng nơ-ron. Thứ hai là đo lường chuẩn xác,
      độ phủ và chỉ số F1 trên bài toán phân loại mất cân bằng. Thứ ba là kiểm định sai số hiệu chuẩn để biết xác
      suất mô hình báo có đáng tin cậy không.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật dự án
  steps:
  - show: '<table class=''t''><tr><th>kỹ thuật / hàm cốt lõi</th><th>vai trò cài đặt</th></tr><tr><td><code>P =
      TP / (TP + FP)</code></td><td>Trong số ca mô hình báo dương, bao nhiêu phần trăm thực sự dương</td></tr><tr><td><code>R
      = TP / (TP + FN)</code></td><td>Trong số ca dương thật, mô hình tóm được bao nhiêu phần trăm</td></tr><tr><td><code>ECE</code></td><td>Sai
      số hiệu chuẩn kỳ vọng: chênh lệch giữa xác suất dự báo và thực tế</td></tr></table>'
    say: Bảng ký hiệu tóm tắt ba thước đo đánh giá cốt lõi của Chặng 9. Độ chuẩn xác đo độ sạch của cảnh báo dương
      tính. Độ phủ đo khả năng không bỏ sót ca dương tính thật. Còn ECE đo mức độ trung thực của xác suất dự báo.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
