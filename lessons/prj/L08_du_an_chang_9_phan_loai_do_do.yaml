    say: Hình minh họa ba bước đánh giá bắt buộc cho mọi mô hình phân loại thực tế. Bước một gom đếm đúng sai từ
      ma trận nhầm lẫn. Bước hai cân đối độ chuẩn xác và độ phủ qua trung bình điều hòa F1. Bước ba chia giỏ xác
      suất để đo sai số hiệu chuẩn kỳ vọng ECE.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <div class='box key'><p><b>1. Precision &amp; Recall:</b> <code>P = TP/(TP+FP) = 4/5 = 0,80</code>; <code>R
      = TP/(TP+FN) = 4/6 = 0,67</code>.</p><p><b>2. F1 &amp; ECE:</b> <code>F1 = 2PR/(P+R) = <b>0,727</b></code>;
      <code>ECE = sum((n_b/N)|acc_b - conf_b|)</code>.</p></div>
    say: Hai công thức này bảo vệ hệ thống AI khỏi bẫy đánh giá bề mặt. Chỉ số F1 dùng trung bình điều hòa nên kéo
      kết quả về gần giá trị nhỏ hơn trong hai đại lượng chuẩn xác và độ phủ. Vì vậy mô hình không thể đánh đổi
      bỏ sót một nửa số ca bệnh để đạt độ chuẩn xác cao giả tạo. Còn ECE lấy trung bình có trọng số phần chênh tuyệt
      đối giữa độ chính xác thật và độ tự tin ở từng giỏ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>tp, fp, fn = 4, 1, 2</div><div>p = tp
      / (tp + fp); r = tp / (tp + fn)</div><div>f1 = 2 * p * r / (p + r)</div><div>ece = 0.5 * abs(0.80 - 0.90)
      + 0.5 * abs(0.40 - 0.60)</div><div>print(f'prec={p:.2f} rec={r:.2f} f1={f1:.2f} ece={ece:.2f}')</div></div>
    say: Đoạn mã tính trực tiếp cả ba chỉ số từ ma trận nhầm lẫn có bốn ca đúng dương, một báo giả và hai bỏ sót.
      Sau đó ta tính trung bình lệch giữa độ chính xác thực và mức tự tin trên hai giỏ có kích thước bằng nhau.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>prec=0.80 rec=0.67 f1=0.73 ece=0.15</div></div>
    say: Kết quả chạy thật trên Python ra chuẩn xác không phẩy tám, độ phủ không phẩy sáu bảy và F1 đạt không phẩy
      bảy ba. Đồng thời ECE bằng không phẩy một lăm cho thấy mô hình tự tin quá mức vì xác suất cao hơn tỉ lệ đúng
      thật.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>bins = [(10, 0.80, 0.90), (10, 0.40, 0.60)]</div><div>tot
      = sum(n for n, _, _ in bins)</div><div>ece = sum((n / tot) * abs(a - c) for n, a, c in bins)</div><div>print(f'ece_verified={ece:.2f}')</div></div>
    say: Ở phép kiểm chứng độc lập, ta tổng hợp lại từ số mẫu từng giỏ là mười và mười trên tổng hai mươi mẫu. Vì
      hai giỏ chia đều tỉ trọng nên trọng số mỗi giỏ bằng đúng một nửa.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>ece_verified=0.15</div></div>
    say: Đầu ra kiểm chứng ra đúng không phẩy một lăm trùng với tính tay vì hai giỏ chia đều trọng số một nửa. Nhờ
      kiểm định hiệu chuẩn này ta biết cần hiệu chỉnh nhiệt độ trước khi đưa vào sản xuất.
    focus:
    - 1
    - 2
    clear: true
