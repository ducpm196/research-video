  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Để tránh <b>rò rỉ dữ liệu (data leakage)</b> thông tin
      phân phối tập Test vào quá trình huấn luyện.</p></td></tr></table>
    say: 'Đáp án câu hai: nhằm ngăn rò rỉ thông tin thống kê từ tập kiểm thử làm sai lệch đánh giá mô hình. Giữ biệt lập hoàn
      toàn tập kiểm thử là nguyên tắc khoa học tối thiểu cho mọi thí nghiệm đánh giá mô hình học máy.'
