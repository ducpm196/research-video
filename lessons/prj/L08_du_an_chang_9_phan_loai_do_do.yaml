      và Recall bằng bao nhiêu? Câu hai, vì sao chỉ khớp bộ chuẩn hoá trên tập huấn luyện chứ không trên toàn dữ liệu? Bấm
      tạm dừng và trả lời. Hai câu hỏi này kiểm tra kỹ năng tính tay nhanh các chỉ số ma trận nhầm lẫn và quy tắc bảo vệ tính
      độc lập tập kiểm thử.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>Precision = 4 / 5 = <b>0,80</b></code>; <code>Recall
      = 4 / 6 ≈ <b>0,67</b></code>.</p></td></tr></table>
    say: 'Đáp án câu một: độ chuẩn xác bằng bốn chia năm là không phẩy tám mươi, còn độ phủ bằng bốn chia sáu xấp xỉ không
      phẩy sáu bảy. Việc tính rõ từng tỉ số giúp bạn nhận ra mô hình đang thiên về giảm báo giả hay tránh bỏ sót ca dương
      tính thật.'
