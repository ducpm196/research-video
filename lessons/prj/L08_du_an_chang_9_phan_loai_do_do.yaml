- id: practice
  kind: practice
  title: Tự làm dự án và chấm tự động
  lab: labs/PRJ/L08
  steps:
  - show: <table class='t'><tr><th>Thực hành PRJ:L08</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Tính
      Precision, Recall, F1 từ ma trận nhầm lẫn và sai số hiệu chuẩn ECE theo từng giỏ</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>tp=12
      fp=3 fn=5</code><br><code>bins=15,0.80,0.90;5,0.60,0.80</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh PRJ
      L08 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Bây giờ bạn hãy bắt đầu cài đặt bộ đánh giá toàn diện cho dự án Chặng 9 từ luồng dữ liệu chuẩn trên máy. Đọc kỹ định
      dạng dòng tham số các giỏ biến thiên ở tệp đề bài dự án tám rồi hoàn thiện mã Python gọn gàng. Cuối cùng bạn chạy lệnh
      chấm tự động để kiểm chứng độ khớp tuyệt đối trên cả ca gốc lẫn các tập nhiều giỏ ẩn. Chú ý kiểm tra chính xác trường
      hợp toàn bộ các giỏ có kích thước không đều nhau chứ không chỉ chia đôi bằng nhau. Tuân thủ chặt chẽ quy định làm tròn
      hai chữ số thập phân ở tất cả các dòng đầu ra theo yêu cầu của bộ kiểm tự động.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai PRJ:L08</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (đọc tham số)</b></td><td>Tách <code>tp, fp, fn</code> ở dòng một và phân tích chuỗi bộ ba <code>(n, acc, conf)</code>
      tách bằng dấu chấm phẩy</td></tr><tr><td><b>Bước 2 (F1)</b></td><td>Tính lần lượt <code>p = tp / (tp + fp)</code>, <code>r
      = tp / (tp + fn)</code> và <code>f1 = 2 * p * r / (p + r)</code></td></tr><tr><td><b>Bước 3 (ECE)</b></td><td>Tính tổng
      trọng số <code>tot = sum(n)</code> rồi cộng dồn <code>(n / tot) * abs(acc - conf)</code> cho mọi giỏ</td></tr></table>
    say: Gợi ý cài đặt bài tập phân loại và hiệu chuẩn dự án Chặng 9 chia làm ba bước ngắn gọn dễ kiểm chứng. Bước một bạn
      đọc ba giá trị đếm của ma trận nhầm lẫn cùng danh sách các giỏ hiệu chuẩn phân tách bởi dấu chấm phẩy từ luồng chuẩn.
      Bước hai bạn tính chuẩn xác, độ phủ và trung bình điều hoà ép một làm tròn hai chữ số thập phân. Bước ba bạn tính tổng
      số mẫu làm mẫu số trọng số để cộng dồn sai số lệch tin cậy qua từng giỏ. Cẩn thận xử lý trường hợp mẫu số tổng bằng
      không khi khởi tạo kiểm tra các giỏ rỗng trên tập dữ liệu đặc biệt.
    clear: true
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>precision=0.80 recall=0.71</div><div>f1=0.75</div><div>ece=0.12</div></div>
    say: Màn hình hiển thị các dòng đầu ra chuẩn tương ứng bộ dữ liệu mẫu. Chương trình của bạn cần đọc tham số từ luồng chuẩn
      để khớp đúng cả hai ca kiểm ẩn. Các ca ẩn kiểm thử nhiều kích thước giỏ khác nhau và tỉ lệ lệch mạnh giữa báo giả và
      bỏ sót.
    clear: true
    focus:
    - 1
    - 2
    - 2
