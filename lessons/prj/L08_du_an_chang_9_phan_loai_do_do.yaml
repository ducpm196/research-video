- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>tp, fp, fn = 4, 1, 2</div><div>p = tp / (tp + fp);
      r = tp / (tp + fn)</div><div>f1 = 2 * p * r / (p + r)</div><div>ece = 0.5 * abs(0.80 - 0.90) + 0.5 * abs(0.40 - 0.60)</div><div>print(f'prec={p:.2f}
      rec={r:.2f} f1={f1:.2f} ece={ece:.2f}')</div></div>
    say: Đoạn mã tính trực tiếp cả ba chỉ số từ ma trận nhầm lẫn có bốn ca đúng dương, một báo giả và hai bỏ sót. Sau đó ta
      tính trung bình lệch giữa độ chính xác thực và mức tự tin trên hai giỏ có kích thước bằng nhau. Phép tính cho thấy ngay
      hai giỏ có độ chênh lệch lần lượt là mười và hai mươi phần trăm gộp lại ra sai số chung mười lăm phần trăm.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>prec=0.80 rec=0.67 f1=0.73 ece=0.15</div></div>
    say: Kết quả chạy thật trên Python ra chuẩn xác không phẩy tám, độ phủ không phẩy sáu bảy và F1 đạt không phẩy bảy ba.
      Đồng thời ECE bằng không phẩy một lăm cho thấy mô hình tự tin quá mức vì xác suất cao hơn tỉ lệ đúng thật. Khi sai số
      hiệu chuẩn cao, hiệu chỉnh lại nhiệt độ đầu ra sẽ đưa xác suất về sát tỉ lệ thực tế mà không làm đổi thứ tự xếp hạng.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>bins = [(10, 0.80, 0.90), (10, 0.40, 0.60)]</div><div>tot
      = sum(n for n, _, _ in bins)</div><div>ece = sum((n / tot) * abs(a - c) for n, a, c in bins)</div><div>print(f'ece_verified={ece:.2f}')</div></div>
    say: Ở phép kiểm chứng độc lập, ta tổng hợp lại từ số mẫu từng giỏ là mười và mười trên tổng hai mươi mẫu. Vì hai giỏ
      chia đều tỉ trọng nên trọng số mỗi giỏ bằng đúng một nửa. Trọng số tỉ lệ theo số lượng mẫu trong từng giỏ bảo đảm những
      giỏ chứa nhiều dữ liệu nhất đóng góp tương xứng vào tổng sai số.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>ece_verified=0.15</div></div>
    say: Đầu ra kiểm chứng ra đúng không phẩy một lăm trùng với tính tay vì hai giỏ chia đều trọng số một nửa. Nhờ kiểm định
      hiệu chuẩn này ta biết cần hiệu chỉnh nhiệt độ trước khi đưa vào sản xuất. Khi độ lệch trung bình vượt ngưỡng an toàn,
      kỹ sư lập tức bổ sung bước hiệu chỉnh xác suất trước khi ra quyết định tín dụng.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>20 mẫu thử
      nhanh</td><td>2 giỏ tin cậy</td><td>Phát hiện nhanh sai lệch 15%</td></tr><tr><td>50 000 bản ghi prod</td><td>10 giỏ
      đều 0..1</td><td>Đo chính xác độ trôi ECE theo tuần</td></tr><tr><td>Dữ liệu mất cân bằng 1%</td><td>Accuracy ảo 99%</td><td>F1
      vạch trần mô hình đoán toàn âm</td></tr><tr><td><b>Quy tắc chống rò rỉ</b></td><td colspan="2">Chỉ <code>fit()</code>
      bộ chuẩn hoá trên tập <b>Train</b>, rồi dùng lại tham số đó để <code>transform()</code> trên tập <b>Test</b></td></tr></table>
    say: Bảng quy mô đối chiếu khi áp dụng thước đo sang dữ liệu thực tế lớn. Với tập sản xuất năm mươi nghìn mẫu, ta chia
      mười giỏ đều nhau để vẽ biểu đồ độ tin cậy hàng tuần. Nếu dữ liệu lệch mạnh một phần trăm, chỉ số F1 lập tức phơi bày
      mô hình lười đoán toàn âm. Khi chuyển từ mẫu thử nhỏ sang năm mươi nghìn bản ghi mỗi tuần, kỷ luật đo lường phải chặt
      hơn. Quy trình chia giỏ và ranh giới dữ liệu cần kiểm soát thật kỹ. Bộ chuẩn hoá thang đo chỉ được phép khớp trên tập
      huấn luyện gốc. Nếu dùng toàn bộ dữ liệu để chuẩn hoá trước khi chia tách, độ tin cậy sẽ sai lệch. Ta chia mười giỏ
      đều từ không tới một để theo dõi sai số hiệu chuẩn hàng tuần. Nhờ vậy đội vận hành chặn ngay mọi bộ dữ liệu mất cân
      bằng bị báo cáo bằng chỉ số tổng hợp ảo. Giám sát tự động bộ ba chỉ số trên mười giỏ mẫu mỗi tuần bảo vệ hệ thống trước
      sự xuống cấp âm thầm của mô hình ngoài sản xuất.
