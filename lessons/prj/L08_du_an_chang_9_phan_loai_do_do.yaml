  title: Đường ống phân loại & đo độ lệch ECE
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: '<div class=''box key''><p>Với ma trận <code>TP=4, FP=1, FN=2, TN=13</code>: đạt <code>Precision = <b>0,80</b></code>,
      <code>Recall = <b>0,67</b></code>, <code>F1 = <b>0,73</b></code> và đo <code>ECE = <b>0,15</b></code> khi mô hình lệch
      15% tin cậy ở 2 giỏ.</p></div>'
    say: Chào bạn đến với dự án chốt Chặng 9 về trí tuệ nhân tạo và học máy. Độ chính xác tổng thể chín mươi chín phần trăm
      trên bài toán gian lận chỉ chiếm một phần trăm là con số đánh lừa, vì mô hình đoán toàn âm cũng đạt mức đó. Ngay cả
      khi F1 khá tốt, một mô hình dự báo xác suất chín mươi phần trăm nhưng thực tế chỉ đúng bảy mươi phần trăm sẽ làm sai
      mọi quyết định đặt ngưỡng rủi ro.
    clear: true
  - show: ''
    say: Hôm nay ta cài trọn vẹn bộ đánh giá F1 và chỉ số hiệu chuẩn ECE bằng Python thuần.
      Đo lường mô hình bằng độ chuẩn xác, độ phủ, trung bình điều hoà và sai số hiệu chuẩn cung cấp góc nhìn toàn diện trước
      lúc phát hành. Tránh được bẫy chỉ số tổng thể giả tạo và rò rỉ dữ liệu giúp bạn xây dựng sản phẩm trí tuệ nhân tạo thật
      sự tin cậy.
