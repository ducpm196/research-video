      (IRS/DAN)</td><td>Đo chất lượng phân loại trên tập lệch nhãn</td></tr><tr><td>Giám sát trôi lệch & đánh giá RAG/LLM
      (MLO/LLM)</td><td>Kiểm chứng hiệu chuẩn xác suất và rò rỉ tập kiểm tra</td></tr></table>
    say: Dự án Chặng 9 tổng hợp các mảnh ghép cốt lõi từ toán học máy, khoa học dữ liệu và vận hành mô hình. Thứ nhất là xử
      lý đầu ra xác suất từ các bộ phân loại tuyến tính hoặc mạng nơ-ron. Thứ hai là đo lường chuẩn xác, độ phủ và chỉ số
      F1 trên bài toán phân loại mất cân bằng. Thứ ba là kiểm định sai số hiệu chuẩn để biết xác suất mô hình báo có đáng
      tin cậy không. Trên dữ liệu mất cân bằng như phát hiện gian lận, tỉ lệ đúng tổng thể rất dễ đánh lừa. Thực tế mô hình
      có thể đạt điểm cao giả tạo dù bỏ lọt hết ca dương. Chỉ khi tách bạch độ chuẩn xác và độ phủ qua ma trận nhầm lẫn, bạn
      mới thấy rõ đánh đổi giữa cảnh báo giả và ca bị bỏ lọt. Bên cạnh đó nếu toàn bộ dữ liệu gốc được chuẩn hoá trước bước
      chia tập kiểm tra, thông tin phân phối sẽ rò rỉ gián tiếp. Chỉ khi kiểm soát chặt ranh giới chuẩn hoá và theo dõi biểu
      đồ độ tin cậy định kỳ, mô hình mới vận hành ổn định trên dữ liệu thật.
