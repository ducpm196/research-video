- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 4 / (4 + 1) == 0.8
  - round(0.5 * 0.1 + 0.5 * 0.2, 2) == 0.15
  steps:
  - show: <div class='box key'><p><b>1. Precision &amp; Recall:</b> <code>P = TP/(TP+FP) = 4/5 = 0,80</code>; <code>R = TP/(TP+FN)
      = 4/6 = 0,67</code>.</p><p><b>2. F1 &amp; ECE:</b> <code>F1 = 2PR/(P+R) = <b>0,727</b></code>; <code>ECE = sum((n_b/N)|acc_b
      - conf_b|)</code>.</p></div>
    say: Hai công thức này bảo vệ hệ thống AI khỏi bẫy đánh giá bề mặt. Chỉ số F1 dùng trung bình điều hòa nên kéo kết quả
      về gần giá trị nhỏ hơn trong hai đại lượng chuẩn xác và độ phủ. Vì vậy mô hình không thể đánh đổi bỏ sót một nửa số
      ca bệnh để đạt độ chuẩn xác cao giả tạo. Còn ECE lấy trung bình có trọng số phần chênh tuyệt đối giữa độ chính xác thật
      và độ tự tin ở từng giỏ. Hai công thức định lượng kết hợp soi chiếu chất lượng mô hình dưới hai góc độ bổ trợ nhau mà
      không chỉ số đơn lẻ nào thay thế được. Trung bình điều hoà ép một cho thấy mức phạt rất nặng nếu một trong hai thành
      phần độ chuẩn xác hoặc độ phủ rơi về sát không, buộc kỹ sư tối ưu đồng đều. Trong khi đó sai số hiệu chuẩn kỳ vọng tính
      trung bình có trọng số phần chênh giữa độ chính xác thật và độ tự tin trên từng giỏ mẫu. Mỗi giỏ xác suất phản ánh sự
      khớp hay lệch giữa niềm tin mô hình nói ra và tỉ lệ đúng thực tế quan sát được.
