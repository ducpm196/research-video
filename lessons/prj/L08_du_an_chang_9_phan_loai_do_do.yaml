      lẫn. Bước hai cân đối độ chuẩn xác và độ phủ qua trung bình điều hòa F1. Bước ba chia giỏ xác suất để đo sai số hiệu
      chuẩn kỳ vọng ECE. Quy trình thẩm định ba bước biến hộp đen học máy thành công cụ hỗ trợ ra quyết định có thể đo lường
      và kiểm soát sai số. Không một mô hình phân loại mất cân bằng nào nên đưa ra sản xuất nếu thiếu bộ đôi thước đo F1 và
      hiệu chuẩn xác suất.
