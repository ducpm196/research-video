      rỉ dữ liệu):</b> Chuẩn hoá trung bình trên toàn tập gộp trước khi chia tập huấn luyện và kiểm tra.<br><b>Lỗi 2 (lệch
      nhãn):</b> Báo cáo độ đúng tổng thể trên bài toán gian lận chỉ chiếm dưới 1% ca dương tính thật.<br><b>Lỗi 3 (ảo tưởng
      xác suất):</b> Tin nguyên điểm xác suất thô là thật khi chưa kiểm tra sai số hiệu chuẩn ECE.</div></td></tr></table>
    say: Hãy kiểm tra kỹ ba sai lầm đánh giá rất hay gặp khiến mô hình học máy hoạt động tốt khi thử nhưng sụp đổ ngoài thực
      tế. Sai lầm lớn nhất là tính trung bình và độ lệch chuẩn trên toàn bộ tập dữ liệu trước khi chia tách huấn luyện và
      kiểm thử. Sai lầm thứ hai là lấy tỉ lệ đúng tổng thể để báo cáo trên tập lệch nhãn cực mạnh. Sai lầm thứ ba là dùng
      thẳng xác suất thô để ra quyết định ngưỡng rủi ro mà không kiểm tra độ lệch hiệu chuẩn. Luôn kiểm tra mẫu số của cả
      độ chuẩn xác, độ phủ và tổng độ chuẩn xác cộng độ phủ bằng không để tránh lỗi phép chia. Mỗi bộ chuẩn hoá thang đo dữ
      liệu chỉ được phép khớp tham số duy nhất trên phần dữ liệu huấn luyện gốc.
    focus:
