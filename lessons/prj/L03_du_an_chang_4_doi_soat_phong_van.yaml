scenes:
- id: hook
  kind: hook
  title: 'Cuối ngày 3 bên xuất ra 3 tệp khác nhau: làm sao tìm sạch lệch chỉ trong vài giây?'
  checks:
  - alg.prj_reconcile_3way(['t1','t2','t3','t4'],['t1','t2','t3','t5'],['t1','t2','t3']) == (3, 2)
  steps:
  - show: '<div class=''box key''><p>Cuối phiên thanh toán, Ngân hàng nội bộ, mạng liên ngân hàng <b>NAPAS</b> và <b>Đối tác</b>
      xuất ra 3 luồng bản ghi gồm mã, số tiền và trạng thái độc lập.</p><p>Ví dụ: trong 5 giao dịch duy nhất, có 3 ca khớp
      đủ 3 bên (<b>60,0%</b>) và <b>2 ca lệch</b> (thiếu ở đối tác hoặc dư ở NAPAS) phải đẩy vào hàng đợi tra soát mà <b>tuyệt
      đối không sửa đè sổ chính</b>.</p></div>'
    say: Chào bạn đến với tình huống tổng kết Chặng 4. Mỗi tối sau giờ chốt phiên, ngân hàng phải đối chiếu hàng triệu mã
      giao dịch giữa sổ lõi nội bộ, mạng liên ngân hàng NAPAS và đối tác thu hộ. Nếu hai bên lệch trạng thái hay số tiền mà
      lại vội sửa thẳng vào sổ cái thì mất sạch dấu vết kiểm toán. Hôm nay ta dựng bộ đối soát ba bên phân tách đủ lệch trạng
      thái lẫn thiếu chiều và luyện trả lời đánh đổi khi phỏng vấn. Bài toán đối soát ba bên đòi hỏi sự chính xác tuyệt đối
      từng đồng lẫn tư duy kiến trúc xử lý dữ liệu hàng chục gi-ga-bai. Biết cách chuyển đổi linh hoạt giữa bảng băm nhanh
      và sắp xếp trộn ngoài đĩa là điểm cộng lớn trong phỏng vấn kỹ sư.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: Ghép các mảnh kiến thức trong chặng
  steps:
  - show: <table class='t'><tr><th>kiến thức Chặng 4</th><th>ứng dụng trong đối soát &amp; phỏng vấn</th></tr><tr><td>Đối
      chiếu theo mã, số tiền và trạng thái</td><td>Phân biệt rõ ca khớp sạch, ca lệch trạng thái và ca thiếu một hoặc hai
      chiều</td></tr><tr><td>Bảng đánh đổi kiến trúc ba cột</td><td>Giải thích rõ khi nào dùng bảng băm trong RAM và khi nào
      dùng sắp xếp trộn ngoài đĩa</td></tr></table>
    say: Dự án Chặng 4 nối liền bài toán nghiệp vụ liên ngân hàng với kỹ năng trả lời thiết kế hệ thống lúc phỏng vấn. Ngoài
      việc kiểm tra mã tham chiếu có mặt hay không, ta phải so khớp cả số tiền lẫn trạng thái giữa ba nguồn. Nhờ vậy hệ thống
      bắt kịp giao dịch thành công ở một nơi nhưng lại lỗi hoặc treo ở nơi khác. Chỉ khi đối chiếu đủ cả ba chiều mã định
      danh, số tiền và trạng thái, bộ đối soát mới không bỏ lọt sai lệch giao dịch. Sự minh bạch của hàng đợi tra soát giúp
      kế toán giải quyết các ca kẹt mạng mà không phá vỡ lịch sử sổ chính.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật và bất biến cần bảo đảm
  steps:
  - show: <table class='t'><tr><th>nhóm phân loại đối soát</th><th>quy tắc phân loại và xử lý</th></tr><tr><td>Khớp 3 bên</td><td>Có
      mặt ở đủ Ngân hàng, NAPAS, Đối tác, cùng số tiền và cả 3 đều OK</td></tr><tr><td>Lệch trạng thái hoặc số tiền</td><td>Đủ
      3 nguồn nhưng khác số tiền hoặc có nguồn khác OK → đẩy nhãn lệch trạng thái vào hàng đợi</td></tr><tr><td>Thiếu một
      hoặc hai chiều</td><td>Thiếu ít nhất một nguồn → gán nhãn chi tiết bên thiếu hoặc bên dư và không sửa sổ chính</td></tr></table>
    say: Bảng này tóm tắt ba nhóm phân loại chuẩn kiểm toán sau khi gộp dữ liệu ba nguồn độc lập. Nhóm khớp cả ba đòi hỏi
      cả ba nơi cùng ghi đúng một số tiền và cùng mang trạng thái thành công. Nếu đủ mặt cả ba bên nhưng vênh số tiền hay
      có một bên báo lỗi hoặc đang chờ xử lý, hệ thống đánh nhãn lệch trạng thái. Còn nếu khuyết một hoặc hai nguồn thì gắn
      nhãn chi tiết bên thiếu hay bên thừa để vận hành xử lý bù trừ. Trong mọi tình huống, sổ cái gốc tuyệt đối giữ nguyên
      vẹn không được phép sửa đè. Năm nhãn thiếu chiều chi tiết chỉ ra chính xác nguồn nào đang giữ giao dịch còn nguồn nào
      bị thiếu để đẩy đúng quy trình xử lý. Khi phát hiện bất kỳ chênh lệch nào giữa hai bên, nguyên tắc giữ nguyên sổ chính
      và ghi nhận bù trừ luôn được đặt lên hàng đầu.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.2'
    - '1.4'
    clear: true
