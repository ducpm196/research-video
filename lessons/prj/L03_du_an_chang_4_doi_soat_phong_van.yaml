- id: formula
  kind: formula
  title: Độ phức tạp tập băm O(n) vs sắp xếp trộn O(n log n)
  checks:
  - alg.prj_reconcile_3way(['t1','t2','t3','t4'],['t1','t2','t3','t5'],['t1','t2','t3']) == (3, 2)
  steps:
  - show: '<div class=''box key''><p>Tỉ lệ khớp = <code>số mã khớp 3 bên / tổng số mã duy nhất × 100%</code>.</p><p>Trong
      bộ mẫu 5 mã duy nhất: 3 khớp, 2 lệch → 3 / 5 = <b>60,0%</b> khớp.</p><p><b>Đánh đổi phỏng vấn:</b> RAM đủ lớn dùng bảng
      băm <code>O(n)</code>; vượt RAM dùng sắp xếp trộn ngoài đĩa <code>O(n log n)</code> với bộ nhớ cố định.</p></div>'
    say: Vì ba trên năm giao dịch khớp đủ ba tập nên tỉ lệ đạt sáu mươi phần trăm. Khi toàn bộ tệp đối soát nằm gọn trong
      RAM, bảng băm gom theo mã tham chiếu chạy tuyến tính chỉ tốn một lượt quét. Ngược lại khi quy mô vượt quá dung lượng
      RAM máy chủ, nạp thẳng tất cả sẽ làm tràn bộ nhớ ngay lập tức. Khi đó ta chia nhỏ tệp, sắp xếp từng đoạn rồi trộn tuần
      tự với chi phí n lốc n để giữ RAM cố định. Đây cũng là câu trả lời kiến trúc trọng tâm khi gặp hội đồng phỏng vấn. Khi
      giải thích đánh đổi giữa bộ nhớ và thời gian trên bảng, câu trả lời rõ ràng kèm kích thước tệp cụ thể luôn thuyết phục
      hơn lý thuyết. Phân vùng dữ liệu theo ngày còn cho phép chạy song song nhiều tiến trình đối soát độc lập để kịp giờ
      khoá sổ buổi sáng.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: phân loại khớp, lệch trạng thái và thiếu một chiều trên 3 nguồn'
  checks:
  - 2 / 5 == 0.4
  steps:
  - show: <table class='t'><tr><th>ký hiệu / điều kiện</th><th>ý nghĩa trong bộ đối soát</th></tr><tr><td><code>b.get(k)==n.get(k)==p.get(k)
      and b[k][1]=='OK'</code></td><td>Đủ 3 nguồn Ngân hàng, NAPAS, Đối tác cùng số tiền và đều thành công</td></tr><tr><td><code>k
      in b and k in n and k in p</code> nhưng khác tiền/trạng thái</td><td>Phát hiện ca lệch trạng thái hoặc lệch số tiền dù mã có mặt đủ ba nơi</td></tr></table>
    say: Hai biểu thức trên bảng giúp tách rạch ròi ca khớp sạch khỏi ca lệch trạng thái hoặc lệch số tiền. Ta không được
      thấy trùng mã là kết luận khớp vì một bên có thể ghi thành công còn bên kia báo thất bại. Đặt cặp giá trị tiền và trạng
      thái cạnh nhau giúp câu điều kiện so khớp ba nguồn trong Python cực kỳ ngắn gọn và rõ nghĩa. Tập hợp khoá duy nhất hợp
      thành từ cả ba nguồn bảo đảm mọi mã xuất hiện dù chỉ ở một bên cũng đều được xét qua.
    focus:
    - '1.2'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
  - show: '<p><b>Bước 1: nạp dữ liệu 3 nguồn có kèm số tiền và trạng thái</b></p><div class="code"><div>b = {''t1'':(100,''OK''),
      ''t2'':(200,''OK''), ''t3'':(300,''OK''), ''t4'':(400,''OK'')}</div><div>n = {''t1'':(100,''OK''), ''t2'':(200,''OK''),
      ''t3'':(300,''OK''), ''t4'':(400,''OK''), ''t5'':(500,''OK'')}</div><div>p = {''t1'':(100,''OK''), ''t2'':(200,''OK''),
      ''t3'':(300,''FAIL'')}</div><div>u = sorted(set(b) | set(n) | set(p))</div></div>'
    say: Trước hết ta nạp năm mã giao dịch từ ba nguồn độc lập kèm giá trị tiền và trạng thái. Mã t3 có mặt ở đủ ba bên nhưng
      phía đối tác mang trạng thái lỗi, còn t4 thiếu ở đối tác và t5 thừa từ mạng. Mẫu dữ liệu năm mã bao trùm đầy đủ cả ba
      nhóm khớp sạch, lệch trạng thái và thiếu một chiều trên cùng một ví dụ nhỏ gọn.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Bước 2: phân loại tách bạch khớp cả ba, lệch trạng thái và thiếu chiều</b></p><div class="code"><div>ok =
      [k for k in u if b.get(k)==n.get(k)==p.get(k) and b[k][1]==''OK'']</div><div>st = [k for k in u if k in b and k in n
      and k in p and k not in ok]</div><div>os = [k for k in u if k not in ok and k not in st]</div><div>pct = 100.0 * len(ok)
      / len(u)</div><div>print(f''matched={len(ok)}/{len(u)} pct={pct:.1f}% state={st} one_side={os}'')</div></div>'
    say: Ba danh sách rẽ nhánh xử lý từng nhóm đối soát trong một lượt duyệt tập mã đã sắp xếp. Nhóm khớp đòi hỏi đủ ba bên
      có cặp tiền và trạng thái bằng nhau, hai nhóm còn lại tự động gom phần lệch trạng thái và thiếu một chiều. Sắp xếp danh
      sách mã tham chiếu tăng dần bảo đảm đầu ra hàng đợi lệch luôn có trật tự tất định qua mọi lượt chạy.
