      't5']</div></div>
    say: Đầu ra chạy thật chứng minh chỉ có hai trên năm mã khớp sạch đạt bốn mươi phần trăm. Mã t3 rơi đúng vào nhóm lệch
      trạng thái còn t4 và t5 vào nhóm thiếu một chiều. Lưu ý tỉ lệ khớp sáu mươi hay bốn mươi phần trăm phải bám chặt tổng
