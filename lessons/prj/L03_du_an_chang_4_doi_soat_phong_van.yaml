- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi cài đối soát và trả lời phỏng vấn
  steps:
  - show: <table class='t'><tr><th>lỗi kỹ thuật &amp; trả lời phỏng vấn thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 — Sửa thẳng sổ chính khi phát hiện lệch đối soát.</b> Phải giữ nguyên sổ gốc và đẩy ngoại lệ sang hàng đợi chờ bù
      trừ có dấu vết.<br><b>Lỗi 2 — Chỉ kiểm trùng mã tham chiếu mà bỏ qua số tiền và trạng thái.</b> Một bên báo OK còn bên
      kia FAIL mà vẫn tính khớp sẽ làm thất thoát tiền.<br><b>Lỗi 3 — Viết vòng lặp lồng nhau O(n²) hoặc chọn sai phương án
      khi tệp vượt RAM.</b> Với 1 triệu dòng, vòng lặp lồng nhau mất hàng giờ chạy.</div></td></tr></table>
    say: Ba sai lầm dưới đây hay làm rớt cả bài kiểm thử lẫn buổi phỏng vấn kiến trúc. Lỗi đầu là sửa đè trực tiếp vào dữ
      liệu sổ chính làm mất sạch dấu vết kiểm toán. Lỗi hai là chỉ so xem mã có mặt mà bỏ qua kiểm tra số tiền và trạng thái
      từng bên. Lỗi ba là viết vòng lặp bình phương tốn hàng giờ chạy hoặc đòi tải trọn năm mươi gi-ga-bai vào RAM nhỏ. Khi
      trình bày phương án, hãy nêu rõ ngưỡng chuyển sang sắp xếp trộn ngoài đĩa để giữ bộ nhớ cố định. Tránh tuyệt đối vòng
      lặp tìm kiếm lồng nhau bình phương vì chỉ cần vài trăm nghìn dòng là chương trình sẽ treo quá thời gian. Hãy nhớ trình
      bày kèm lý do bảo toàn dấu vết kiểm toán khi giải thích vì sao không được sửa thẳng bảng chính.
