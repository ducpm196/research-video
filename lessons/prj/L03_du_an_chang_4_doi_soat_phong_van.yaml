- {reason: 'ASR chép “…giờ chút phiên… NAPAC…” (0.935): đồng âm “chốt/chút” và tên riêng “NAPAS”.', sentence: 'Mỗi tối sau giờ chốt phiên, ngân hàng phải đối chiếu hàng triệu mã giao dịch giữa sổ lõi nội bộ, mạng liên ngân hàng NAPAS và đối tác thu hộ.'}
- {reason: 'ASR chép “…bộ nhớ trăm cố định…” (0.958): Whisper nghe nhầm từ viết tắt tiếng Anh “RAM” thành “trăm”.', sentence: 'Đáp án câu hai: chọn sắp xếp trộn ngoài đĩa để giữ bộ nhớ RAM cố định và tránh sập vì hết bộ nhớ.'}
