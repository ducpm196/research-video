- id: check
  kind: check
  title: Kiểm chứng trộn ngoài đĩa phân loại khớp, lệch trạng thái, thiếu chiều
  checks:
  - len(['t1', 't3', 't4']) == 3
  - 2 / 4 == 0.5
  steps:
  - show: '<p><b>Bước 1: trộn tuần tự bản ghi đã sắp từ 3 luồng</b></p><div class="code"><div>import heapq</div><div>sB =
      [(''t1'', ''B'', 100, ''OK''), (''t2'', ''B'', 200, ''OK''), (''t4'', ''B'', 400, ''OK'')]</div><div>sN = [(''t1'',
      ''N'', 100, ''OK''), (''t2'', ''N'', 200, ''FAIL''), (''t4'', ''N'', 400, ''OK'')]</div><div>sP = [(''t1'', ''P'', 100,
      ''OK''), (''t2'', ''P'', 200, ''OK'')]</div><div>by_id = {}</div><div>for tid, src, amt, st in heapq.merge(sB, sN, sP):</div><div>    by_id.setdefault(tid,
      {})[src] = (amt, st)</div></div>'
    say: Ở nhánh kiểm chứng thứ hai, ta dùng từ điển gom theo mã để mô phỏng bước trộn ba luồng đã sắp sẵn theo mã tham chiếu.
      Trong chạy thật ngoài đĩa, luồng trộn hợp nhất từng mã kề nhau và giải phóng ngay sau khi phân loại để giữ bộ nhớ ổn định.
      Thuật toán trộn ưu tiên hợp nhất nhiều tệp đã sắp xếp trước mà chỉ giữ đúng một phần tử đại diện mỗi luồng trong bộ nhớ.
    focus:
    - 1
    - 2
    - 1
    clear: true
  - show: '<p><b>Bước 2: phân loại từng mã thành khớp cả ba, lệch trạng thái hoặc thiếu chiều</b></p><div class="code"><div>res
      = {}</div><div>for k, v in sorted(by_id.items()):</div><div>    if len(v) == 3 and len(set(v.values())) == 1 and next(iter(v.values()))[1]
      == ''OK'':</div><div>        res[k] = ''match''</div><div>    elif len(v) == 3:</div><div>        res[k] = ''state''</div><div>    else:</div><div>        res[k]
      = ''one_side''</div><div>print(''merge_classify='' + str(res))</div></div>'
    say: Sau khi gom xong nhóm của một mã giao dịch, thông tin ba nguồn đã hội tụ đầy đủ. Vì vậy bộ phân loại tách ngay thành
      khớp cả ba, lệch trạng thái hoặc thiếu một chiều. Trong bước phân loại từng nhóm đã gom, kiểm tra đủ ba nguồn khác nhau
      cùng tập giá trị cặp tiền trạng thái duy nhất giúp rút gọn logic.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>merge_classify={''t1'': ''match'', ''t2'': ''state'',
      ''t4'': ''one_side''}</div></div>'
    say: Đầu ra xác nhận ba mã rơi đúng ba phân loại là khớp cả ba cho t1, lệch trạng thái cho t2 và thiếu một chiều cho t4.
      Nhờ vậy độ chính xác giữa hai phương pháp băm và sắp xếp trộn khớp nhau hoàn toàn vì cùng kiểm đủ cả số tiền lẫn trạng
      thái. Kết quả đối chứng giữa bảng băm trên bộ nhớ và sắp xếp trộn ngoài đĩa khẳng định cả hai phương pháp luôn cho cùng
      đáp án chính xác.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Bảng phương án phỏng vấn qua 3 quy mô dữ liệu đối soát
  checks:
  - 500_000_000 // 100_000 == 5000
  steps:
  - show: <table class='t'><tr><th>số giao dịch mỗi ngày (số minh hoạ)</th><th>giải pháp chọn khi phỏng vấn</th><th>lý do
      kỹ thuật (thời gian &amp; bộ nhớ)</th></tr><tr><td>100 000 dòng (~10 MB)</td><td>Bảng băm trong RAM — O(n)</td><td>Xong
      trong vài mi-li-giây, tốn chưa tới 50 MB RAM</td></tr><tr><td>10 000 000 dòng (~1 GB)</td><td>Chia cụm theo ngày hoặc
      phân vùng băm</td><td>Vừa khung RAM máy chủ chuẩn trong vài giây</td></tr><tr><td>500 000 000 dòng (~50 GB)</td><td>Sắp
      xếp trộn ngoài đĩa — O(n log n)</td><td>Bộ nhớ RAM cố định, đọc tuần tự từng đoạn đĩa</td></tr></table>
    say: Bảng đánh đổi ba mức này chính là khung trả lời chuẩn khi hội đồng phỏng vấn hỏi về mở rộng hệ thống đối soát. Ở
      cỡ một trăm nghìn dòng mỗi ngày, bảng băm trong bộ nhớ chạy hết chỉ trong chớp mắt và tốn chưa đầy năm mươi mê-ga-bai.
      Lên mức mười triệu dòng, ta chia vùng theo ngày hoặc băm phân vùng để mỗi mảnh vẫn lọt khung RAM máy chủ. Tới nửa tỉ
      dòng nặng năm mươi gi-ga-bai vượt xa RAM, sắp xếp trộn ngoài đĩa giữ bộ nhớ cố định mà không bao giờ sập. Việc chỉ ra
      rõ từng mốc kích thước tệp mười mê-ga-bai, một gi-ga-bai và năm mươi gi-ga-bai thể hiện kinh nghiệm vận hành thực tế.
      Nắm chắc phân tích độ phức tạp giúp bạn tự tin bảo vệ thiết kế của mình trước mọi câu hỏi vặn ngược của người phỏng
      vấn.
