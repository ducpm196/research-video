- {reason: 'ASR chép “…T5 thừa ở NaPak… tra xoát.” (0.974): Whisper viết “NAPAS” thành “NaPak” và “soát” thành “xoát”.', sentence: 'Đầu ra chạy thật cho thấy ba giao dịch khớp đạt sáu mươi phần trăm, còn t4 thiếu ở đối tác và t5 thừa ở NAPAS được đưa an toàn vào danh sách cần tra soát.'}
scenes:
- id: hook
  kind: hook
  title: 'Cuối ngày 3 bên xuất ra 3 tệp khác nhau: làm sao tìm sạch lệch chỉ trong vài giây?'
  checks:
  - alg.prj_reconcile_3way(['t1','t2','t3','t4'],['t1','t2','t3','t5'],['t1','t2','t3','t4']) == (3, 2)
  steps:
  - show: '<div class=''box key''><p>Cuối phiên thanh toán, Ngân hàng nội bộ, mạng liên ngân hàng <b>NAPAS</b> và
      <b>Đối tác</b> có 3 bảng dữ liệu độc lập.</p><p>Ví dụ: trong 5 giao dịch duy nhất, có 3 ca khớp cả 3 bên (<b>60,0%</b>)
      và <b>2 ca lệch</b> (thiếu ở đối tác hoặc dư ở NAPAS) phải tách vào hàng đợi tra soát mà <b>tuyệt đối không
      sửa đè sổ chính</b>.</p></div>'
    say: Chào bạn đến với tình huống tổng kết Chặng 4. Mỗi tối sau giờ chốt phiên, ngân hàng phải đối chiếu hàng
      triệu mã giao dịch giữa sổ lõi nội bộ, mạng liên ngân hàng NAPAS và đối tác thu hộ. Sai sót nghiêm trọng nhất
      của người mới là tiện tay sửa đè thẳng vào sổ cái ngay khi phát hiện chênh lệch thay vì đưa vào bảng tra soát
      riêng. Hôm nay ta cài đặt thuật toán đối soát ba bên chính xác và thực hành cách trình bày đánh đổi kiến trúc
      trước hội đồng phỏng vấn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ghép các mảnh kiến thức trong chặng
  steps:
  - show: <table class='t'><tr><th>kiến thức Chặng 4 (INT, ACB)</th><th>ứng dụng trong đối soát & phỏng vấn</th></tr><tr><td>Đối
      chiếu theo mã tham chiếu và tập hợp băm (INT)</td><td>Tìm giao kết ba bên bằng phép giao và hiệu tập hợp</td></tr><tr><td>Bảng
      đánh đổi kiến trúc ba cột (ACB)</td><td>Giải thích rõ đánh đổi thời gian, bộ nhớ và tính nhất quán</td></tr></table>
    say: Dự án Chặng 4 nối liền bài toán nghiệp vụ liên ngân hàng với kỹ năng trả lời hệ thống lúc phỏng vấn. Ta
      dùng phép giao tập hợp trên mã tham chiếu để khoanh vùng nhanh các ca khớp toàn bộ và tách riêng từng ca lệch
      để xử lý bù trừ sau.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật và bất biến cần bảo đảm
  steps:
  - show: '<table class=''t''><tr><th>tập phân loại đối soát</th><th>cách xử lý đúng chuẩn kiểm toán</th></tr><tr><td>Khớp
      3 bên: <code>B &amp; N &amp; P</code></td><td>Đóng dấu đã đối soát xong (Matched) — giữ nguyên sổ</td></tr><tr><td>Thiếu
      hoặc dư một chiều: <code>(B | N | P) - khớp</code></td><td>Đẩy sang <b>hàng đợi tra soát</b> (Exception Queue)
      chờ hoàn/bù</td></tr><tr><td>Quy tắc bất biến sổ chính</td><td><b>Không bao giờ DELETE/UPDATE</b> sổ chính
      lúc đối soát; chỉ thêm bút toán điều chỉnh sau xác nhận</td></tr></table>'
    say: Trên bảng là ba quy tắc bắt buộc của quy trình đối soát ba bên. Nhóm đầu tiên nằm trong phần giao cả ba
      tập hợp thì được xác nhận hoàn tất. Toàn bộ phần còn lại thuộc hợp trừ đi giao được đưa ngay sang bảng ngoại
      lệ chờ tra soát mà tuyệt đối không tự ý sửa sổ cái.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Biểu đồ giao ba nguồn Ngân hàng – NAPAS – Đối tác
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="40" y="25" width="230" height="50"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="155.0" y="47" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Ngân hàng (B): t1,t2,t3,t4</text><text x="155.0" y="62" font-size="15"
      text-anchor="middle" fill="#475569">4 mã giao dịch</text><rect x="40" y="82" width="230" height="50" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="155.0" y="104" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">NAPAS (N): t1,t2,t3,t5</text><text x="155.0" y="119" font-size="15" text-anchor="middle"
      fill="#475569">t5 dư từ mạng</text><rect x="40" y="140" width="230" height="50" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="2"/><text x="155.0" y="162" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Đối
      tác (P): t1,t2,t3</text><text x="155.0" y="177" font-size="15" text-anchor="middle" fill="#475569">thiếu t4
      ở đối tác</text><line x1="270" y1="105" x2="375" y2="105" stroke="#475569" stroke-width="2"/><polygon points="375,105
      367,100 367,110" fill="#475569"/><text x="322" y="97" font-size="14" font-weight="600" text-anchor="middle"
      fill="#1e293b">so khớp</text><rect x="375" y="35" width="240" height="62" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="2"/><text x="495.0" y="62" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Khớp
      cả 3 (60,0%)</text><text x="495.0" y="81" font-size="15" text-anchor="middle" fill="#475569">t1, t2, t3 →
      Đóng đối soát</text><rect x="375" y="118" width="240" height="62" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="2"/><text x="495.0" y="145" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Lệch
      / Thiếu (40,0%)</text><text x="495.0" y="164" font-size="15" text-anchor="middle" fill="#475569">t4 (thiếu
      P), t5 (dư N)</text><line x1="615" y1="148" x2="690" y2="148" stroke="#475569" stroke-width="2"/><polygon
      points="690,148 682,143 682,153" fill="#475569"/><rect x="690" y="110" width="235" height="78" rx="10" fill="#fef3c7"
      stroke="#d97706" stroke-width="2"/><text x="807.5" y="144" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Hàng đợi tra soát</text><text x="807.5" y="168" font-size="15" text-anchor="middle" fill="#475569">Chờ
      quy trình bù trừ, không đè sổ</text></svg></div>'
    say: Nhìn sơ đồ đối chiếu ba luồng dữ liệu độc lập về cùng một điểm kiểm định. Ở ví dụ năm mã giao dịch duy
      nhất, ba mã t1, t2, t3 xuất hiện đồng bộ trên cả ba nguồn nên khớp sạch đạt sáu mươi phần trăm. Hai mã lệch
      t4 và t5 tự động được phân loại rõ nguyên nhân rồi chuyển sang hàng đợi tra soát riêng.
    clear: true
- id: formula
  kind: formula
  title: Độ phức tạp tập băm O(n) vs sắp xếp trộn O(n log n)
  checks:
  - alg.prj_reconcile_3way(['t1','t2','t3','t4'],['t1','t2','t3','t5'],['t1','t2','t3']) == (3, 2)
  steps:
  - show: '<div class=''box key''><p>Tỉ lệ khớp = <code>số mã khớp 3 bên / tổng số mã duy nhất × 100%</code>.</p><p>Trong
      bộ mẫu 5 mã duy nhất: 3 khớp, 2 lệch → 3 / 5 = <b>60,0%</b> khớp.</p><p><b>Đánh đổi phỏng vấn:</b> RAM đủ
      lớn dùng bảng băm <code>O(n)</code>; vượt RAM dùng sắp xếp trộn ngoài đĩa <code>O(n log n)</code> với <code>O(1)</code>
      bộ nhớ cố định.</p></div>'
    say: Vì ba trên năm giao dịch khớp đủ ba tập nên tỉ lệ đạt sáu mươi phần trăm. Khi dữ liệu nằm gọn trong bộ
      nhớ, phép giao tập băm chạy tuyến tính cực nhanh. Khi quy mô vượt quá RAM máy chủ, ta chuyển sang sắp xếp
      trộn ngoài đĩa để giữ bộ nhớ ổn định với chi phí thời gian n lốc n.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: phân loại 5 giao dịch qua 3 tập B – NAPAS – Đối tác'
  checks:
  - 3 / 5 == 0.6
  steps:
  - show: <table class='t'><tr><th>ký hiệu / kỹ thuật</th><th>vai trò trong dự án</th></tr><tr><td><code>matched
      = b &amp; n &amp; p</code></td><td>Tập mã xuất hiện đầy đủ ở cả Ngân hàng, NAPAS và Đối tác</td></tr><tr><td><code>diff
      = (b | n | p) - matched</code></td><td>Mọi mã có mặt ít nhất một nơi nhưng không khớp đủ cả ba bên</td></tr></table>
    say: Giải mã hai phép toán tập hợp dùng để phân loại chính xác mọi trường hợp khớp và lệch.
    clear: true
  - show: <p><b>Đối soát 3 bên (Ngân hàng, NAPAS, Đối tác) và đẩy ca lệch vào hàng đợi riêng</b></p><div class="code"><div>b
      = {'t1','t2','t3','t4'}</div><div>n = {'t1','t2','t3','t5'}</div><div>p = {'t1','t2','t3'}</div><div>u = b
      | n | p</div><div>m = sorted(b &amp; n &amp; p)</div><div>diff = sorted(u - set(m))</div><div>miss_p = [k
      for k in diff if k in b and k not in p]</div><div>extra_n = [k for k in diff if k in n and k not in b]</div><div>pct
      = 100.0 * len(m) / len(u)</div><div>print(f'matched={len(m)} ({pct:.1f}%) diff={len(diff)} miss_p={miss_p}
      extra_n={extra_n}')</div></div>
    say: Đoạn mã nạp danh sách mã giao dịch từ ba nguồn độc lập gồm bốn mã ở ngân hàng, bốn mã ở NAPAS và ba mã
      ở đối tác. Phép giao và hiệu tập hợp lập tức tách phần khớp chuẩn khỏi hai ca lệch rồi phân loại rõ bên thiếu
      hay bên thừa.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>matched=3 (60.0%) diff=2 miss_p=['t4']
      extra_n=['t5']</div></div>
    say: Đầu ra chạy thật cho thấy ba giao dịch khớp đạt sáu mươi phần trăm, còn t4 thiếu ở đối tác và t5 thừa ở
      NAPAS được đưa an toàn vào danh sách cần tra soát.
    clear: true
- id: check
  kind: check
  title: Đối chứng hướng sắp xếp trộn ngoài đĩa và bảo vệ thiết kế
  checks:
  - len(['t1', 't3', 't4']) == 3
  steps:
  - show: <p><b>Kiểm chứng sắp xếp trộn theo khoá chuẩn bị cho tệp lớn hơn RAM</b></p><div class="code"><div>rows
      = sorted([('t4',100),('t1',200),('t3',300)])</div><div>print('sorted_merge_check=' + str([k for k, _ in rows]))</div></div>
    say: Ở đường kiểm chứng thứ hai, ta kiểm thử thao tác sắp xếp theo mã tham chiếu chuẩn bị cho trộn ngoài đĩa.
      Cách này giúp đối chiếu trăm triệu bản ghi mà không tràn bộ nhớ.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>sorted_merge_check=['t1', 't3', 't4']</div></div>
    say: Đầu ra xác nhận các mã xếp đúng trật tự tăng dần vì chỉ cần so từng cặp đầu danh sách nên bộ nhớ giữ cố
      định.
    clear: true
- id: quymo
  kind: example
  title: Bảng phương án phỏng vấn qua 3 quy mô dữ liệu đối soát
  checks:
  - 500_000_000 // 100_000 == 5000
  steps:
  - show: <table class='t'><tr><th>số giao dịch mỗi ngày</th><th>giải pháp chọn khi phỏng vấn</th><th>lý do kỹ thuật
      (thời gian & bộ nhớ)</th></tr><tr><td>100 000 dòng (~10 MB)</td><td>Bảng băm trong RAM — O(n)</td><td>Vài
      mili-giây, tốn chưa tới 50 MB RAM</td></tr><tr><td>10 000 000 dòng (~1 GB)</td><td>Chia cụm theo ngày / phân
      vùng băm</td><td>Vừa khung RAM máy chủ chuẩn trong vài giây</td></tr><tr><td>500 000 000 dòng (~50 GB)</td><td>Sắp
      xếp trộn ngoài đĩa — O(n log n)</td><td>Bộ nhớ RAM cố định O(1), đọc tuần tự ổ đĩa</td></tr></table>
    say: Bảng đánh đổi ba mức này chính là khung trả lời chuẩn khi hội đồng phỏng vấn hỏi về khả năng mở rộng hệ
      thống đối soát. Từ một trăm nghìn lên mười triệu dòng, bảng băm trong bộ nhớ xử lý rất nhanh. Tới nửa tỉ dòng
      vượt giới hạn RAM, sắp xếp trộn ngoài đĩa là lựa chọn tối ưu nhất.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm nặng ở đồ án thực tế
  steps:
  - show: '<table class=''t''><tr><th>lỗi mất điểm phổ biến khi nộp dự án</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1 (-30đ): Sửa thẳng sổ chính khi phát hiện lệch đối soát.</b> Phải giữ nguyên sổ gốc và sinh bản ghi ngoại
      lệ chờ quy trình bù trừ chính thức.<br><b>Lỗi 2 (-20đ): Chỉ so sánh số lượng dòng <code>len(B) == len(N)</code>.</b>
      Hai bên cùng 4 dòng nhưng lệch 1 mã thì đếm số lượng vẫn báo bằng giả.<br><b>Lỗi 3 (-10đ): Phỏng vấn chọn
      sai O(n²) vòng lặp lồng nhau.</b> Với 1 triệu dòng, 10¹² phép so sánh chạy mất nhiều giờ.</div></td></tr></table>'
    say: Ba sai lầm hay làm rớt điểm nặng cả ở bài tập lẫn lúc phỏng vấn thực chiến. Lỗi đầu là sửa đè dữ liệu gốc
      làm mất vết kiểm toán. Lỗi hai là chỉ đếm tổng số dòng mà không đối chiếu từng mã định danh. Lỗi ba là viết
      vòng lặp lồng nhau độ phức tạp bình phương khiến hệ thống đơ cứng trên tập dữ liệu vừa.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - 3 / 5 == 0.6
  steps:
  - show: '<ol><li>Tổng 5 giao dịch: 3 khớp cả 3 bên, 1 thiếu ở đối tác, 1 thừa ở NAPAS. Tỉ lệ khớp bằng bao nhiêu
      phần trăm?</li><li>Khi tệp đối soát nặng 50 GB lớn hơn nhiều so với 16 GB RAM, chọn bảng băm tải hết vào RAM
      hay sắp xếp trộn ngoài đĩa?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, có ba trên năm giao dịch khớp đủ ba bên thì tỉ lệ khớp là bao nhiêu
      phần trăm? Câu hai, khi tệp đối soát năm mươi gi-ga-bai lớn hơn bộ nhớ RAM mười sáu gi-ga-bai, ta dùng chiến
      lược nào? Bấm tạm dừng và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>3 / 5 = <b>60,0%</b></code> khớp và
      <b>2 ca lệch</b> đẩy sang hàng đợi tra soát.</p></td></tr></table>
    say: 'Đáp án câu một: ba trên năm giao dịch khớp bằng đúng sáu mươi phần trăm, hai ca còn lại đẩy vào hàng đợi
      tra soát.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Chọn <b>sắp xếp trộn ngoài đĩa O(n log n)</b>
      vì chỉ dùng lượng RAM cố định không bị tràn bộ nhớ.</p></td></tr></table>
    say: 'Đáp án câu hai: chọn sắp xếp trộn ngoài đĩa để giữ bộ nhớ RAM cố định và tránh sập vì hết bộ nhớ.'
    clear: true
