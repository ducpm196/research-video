- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <div class='box key'><p><b>1. Ký toàn vẹn:</b> <code>mac = hmac.new(key, msg, sha256).hexdigest()</code>, đối chiếu
      bằng <code>compare_digest</code>.</p><p><b>2. Truy vấn an toàn &amp; nhanh:</b> chỉ mục B-Tree tìm trong <code>log2(N)</code>
      bước, tham số <code>?</code> tách mã khỏi dữ liệu.</p></div>
    say: Cơ chế bảo vệ dựa trên hai công thức và quy chuẩn cốt lõi. Nhờ dùng hàm băm có khoá theo chuẩn RFC, kẻ xấu không
      biết khoá bí mật thì không thể tính lại thẻ chữ ký khớp sau khi sửa dữ liệu. Khi so sánh hai chuỗi băm, hàm đối chiếu
      hằng thời gian giúp tránh rò rỉ thông tin theo thời gian chạy. Ở tầng lưu trữ, chỉ mục cây giữ số bước tìm kiếm ở mức
      lô-ga-rít cơ số hai của số dòng. Chữ ký HMAC chuẩn RFC hai nghìn một trăm lẻ bốn hoạt động theo cơ chế băm lồng hai
      lớp kèm khoá bí mật chia sẻ. Nhờ vậy dù kẻ xấu đọc được toàn bộ nội dung bảng ghi thì vẫn không thể tạo chữ ký hợp lệ
      mới nếu thiếu khoá gốc. Khi so sánh hai chuỗi băm bằng hàm hằng thời gian, kẻ tấn công đo tốc độ mạng không thể dò từng
      ký tự đầu của thẻ xác thực. Đồng thời chỉ mục B-Tree giữ độ phức tạp tìm kiếm tăng chậm theo lô-ga-rít cơ số hai dù
      kích thước bảng tăng hàng vạn lần. Sự phối hợp giữa cấu trúc cây chỉ mục và mật mã khoá chung bảo đảm cả tốc độ lẫn
      độ tin cậy tuyệt đối cho lịch sử kiểm toán.
    focus:
    - 0
    - '1.1'
