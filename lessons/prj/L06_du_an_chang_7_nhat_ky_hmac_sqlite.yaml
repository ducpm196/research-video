- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <div class='box key'><p><b>1. Ký toàn vẹn:</b> <code>mac = hmac.new(key, msg, sha256).hexdigest()</code>,
      đối chiếu bằng <code>compare_digest</code>.</p><p><b>2. Truy vấn an toàn &amp; nhanh:</b> chỉ mục B-Tree tìm
      trong <code>log2(N)</code> bước, tham số <code>?</code> tách mã khỏi dữ liệu.</p></div>
    say: Cơ chế bảo vệ dựa trên hai công thức và quy chuẩn cốt lõi. Nhờ dùng hàm băm có khoá theo chuẩn RFC, kẻ
      xấu không biết khoá bí mật thì không thể tính lại thẻ chữ ký khớp sau khi sửa dữ liệu. Khi so sánh hai chuỗi
      băm, hàm đối chiếu hằng thời gian giúp tránh rò rỉ thông tin theo thời gian chạy. Ở tầng lưu trữ, chỉ mục
      cây giữ số bước tìm kiếm ở mức lô-ga-rít cơ số hai của số dòng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import hashlib, hmac, sqlite3</div><div>c
      = sqlite3.connect(':memory:')</div><div>c.execute('CREATE TABLE log(id INT PRIMARY KEY, msg TEXT, mac TEXT)')</div><div>c.execute('CREATE
      INDEX idx_msg ON log(msg)')</div><div>k = b'k7'; tag = hmac.new(k, b'login:an', hashlib.sha256).hexdigest()</div><div>c.execute('INSERT
      INTO log VALUES(?,?,?)', (1, 'login:an', tag))</div><div>sqli = c.execute('SELECT * FROM log WHERE msg=?',
      ("' OR '1'='1",)).fetchall()</div><div>row = c.execute('SELECT msg, mac FROM log WHERE id=1').fetchone()</div><div>ok
      = hmac.compare_digest(row[1], hmac.new(k, row[0].encode(), hashlib.sha256).hexdigest())</div><div>print(f'mac_hex_len={len(tag)}
      sqli_rows={len(sqli)} hmac_ok={int(ok)}')</div></div>
    say: Chương trình mẫu khởi tạo bảng nhật ký trong bộ nhớ và gắn ngay chỉ mục lên cột thông điệp. Sau khi chèn
      một bản ghi đã ký HMAC hợp lệ, ta thử tiêm chuỗi tấn công chèn SQL quen thuộc qua dấu hỏi. Cuối cùng ta truy
      xuất bản ghi từ SQLite và tính lại HMAC để khẳng định chữ ký trùng khớp.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>mac_hex_len=64 sqli_rows=0 hmac_ok=1</div></div>
    say: Đầu ra chạy thật cho thấy độ dài thẻ đúng bằng sáu mươi bốn ký tự hexa. Payload tấn công trả về đúng không
      dòng và kiểm tra chữ ký trả về một tức hoàn toàn hợp lệ.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import hashlib, hmac</div><div>t1 = hmac.new(b'k7',
      b'login:an', hashlib.sha256).hexdigest()</div><div>t2 = hmac.new(b'k7', b'login:xx', hashlib.sha256).hexdigest()</div><div>print(f'tamper_detected={int(not
      hmac.compare_digest(t1, t2))}')</div></div>
    say: Ở phép kiểm chứng thứ hai, ta cố tình thay đổi hai ký tự cuối của thông điệp nhật ký rồi băm lại bằng cùng
      khoá bí mật. Vì đặc tính hiệu ứng tuyết lở của hàm băm, hai chữ ký phải khác hẳn nhau.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>tamper_detected=1</div></div>
