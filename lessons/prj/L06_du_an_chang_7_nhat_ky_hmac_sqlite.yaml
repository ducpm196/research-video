  - show: <table class='t'><tr><th>Gợi ý triển khai PRJ:L06</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (bảng &amp; index)</b></td><td>Đọc <code>key</code>, <code>msg</code>, <code>probe</code> từ <code>stdin</code>; tạo
      bảng <code>log</code> kèm <code>CREATE INDEX idx_m ON log(m)</code></td></tr><tr><td><b>Bước 2 (ký &amp; chèn)</b></td><td>Tính
      <code>hmac.new(key, msg, hashlib.sha256).hexdigest()</code> rồi dùng dấu <code>?</code> chèn bản ghi</td></tr><tr><td><b>Bước
      3 (lọc &amp; đối chiếu)</b></td><td>Chạy <code>SELECT * FROM log WHERE m=?</code> với <code>probe</code> và xác thực
      bằng <code>hmac.compare_digest</code></td></tr></table>
    say: Gợi ý triển khai bài dự án gồm ba bước rõ ràng giúp bạn lắp ghép chính xác từ đầu. Trước hết bạn đọc ba tham số đầu
      vào từ luồng chuẩn rồi tạo bảng nhật ký kèm chỉ mục cây trên cột thông điệp trong SQLite. Sau đó bạn ký thông điệp bằng
      HMAC chuẩn SHA hai trăm năm mươi sáu dưới dạng chuỗi hexa và chèn bằng tham số chấm hỏi. Cuối cùng bạn truyền thử chuỗi
      tấn công qua tham số chấm hỏi để khẳng định không trả nhầm dòng nào và xác thực lại chữ ký. Kiểm kỹ bảng kết quả trả
      về cho trường hợp chuỗi thăm dò trùng hệt thông điệp gốc so với chuỗi có cú pháp chèn lệnh.
    clear: true
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>mac_len=64</div><div>sqli_blocked=1</div><div>hmac_verified=1</div></div>
    say: Màn hình hiển thị các dòng đầu ra chuẩn tương ứng bộ dữ liệu mẫu. Chương trình của bạn cần đọc tham số từ luồng chuẩn
      để khớp đúng cả ba ca kiểm ẩn gồm thăm dò UNION, thăm dò dấu nháy và ca chuỗi thăm dò trùng hệt thông điệp gốc.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Tổng kết bất biến dự án
  steps:
  - show: <div class="chain"><span class="n">HMAC-SHA256 + compare_digest</span><span class="a">→</span><span class="n">SQLite
      ? chặn SQLi</span><span class="a">→</span><span class="n">B-Tree Index</span></div>
    say: Chuỗi bất biến khép lại ba phòng tuyến căn bản của dịch vụ lưu trữ nhật ký gồm ký xác thực HMAC hằng thời gian, tham
      số hoá truy vấn và đánh chỉ mục B-Tree. Ba chốt bảo vệ liên kết chặt giữ cho mọi bản ghi nhật ký vừa tìm kiếm nhanh
      vừa chống hoàn toàn sửa trộm dữ liệu.
    clear: true
