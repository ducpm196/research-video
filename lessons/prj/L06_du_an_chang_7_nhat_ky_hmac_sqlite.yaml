- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import hashlib, hmac, sqlite3</div><div>c = sqlite3.connect(':memory:')</div><div>c.execute('CREATE
      TABLE log(id INT PRIMARY KEY, msg TEXT, mac TEXT)')</div><div>c.execute('CREATE INDEX idx_msg ON log(msg)')</div><div>k
      = b'k7'; tag = hmac.new(k, b'login:an', hashlib.sha256).hexdigest()</div><div>c.execute('INSERT INTO log VALUES(?,?,?)',
      (1, 'login:an', tag))</div><div>sqli = c.execute('SELECT * FROM log WHERE msg=?', ("' OR '1'='1",)).fetchall()</div><div>row
      = c.execute('SELECT msg, mac FROM log WHERE id=1').fetchone()</div><div>ok = hmac.compare_digest(row[1], hmac.new(k,
      row[0].encode(), hashlib.sha256).hexdigest())</div><div>print(f'mac_hex_len={len(tag)} sqli_rows={len(sqli)} hmac_ok={int(ok)}')</div></div>
    say: Chương trình mẫu khởi tạo bảng nhật ký trong bộ nhớ và gắn ngay chỉ mục lên cột thông điệp. Sau khi chèn một bản
      ghi đã ký HMAC hợp lệ, ta thử tiêm chuỗi tấn công chèn SQL quen thuộc qua dấu hỏi. Cuối cùng ta truy xuất bản ghi từ
      SQLite và tính lại HMAC để khẳng định chữ ký trùng khớp. Thử chèn chuỗi tấn công phổ biến qua dấu chấm hỏi chứng minh
      trình điều khiển giữ nguyên chuỗi đó như văn bản thuần.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>mac_hex_len=64 sqli_rows=0 hmac_ok=1</div></div>
    say: Đầu ra chạy thật cho thấy độ dài thẻ đúng bằng sáu mươi bốn ký tự hexa. Payload tấn công trả về đúng không dòng và
      kiểm tra chữ ký trả về một tức hoàn toàn hợp lệ. Không dòng nào bị rò rỉ ra kết quả tìm kiếm khẳng định cấu trúc tham
      số hoá đã phát huy tác dụng chặn tuyệt đối.
    focus:
