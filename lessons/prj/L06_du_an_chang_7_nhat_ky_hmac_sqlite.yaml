      bí mật thành chữ ký sáu mươi bốn ký tự hexa. Tiếp đó bản ghi đi qua lệnh chèn tham số dấu hỏi vào bảng SQLite
      đã đánh chỉ mục sẵn. Khi đọc lại, hệ thống vừa chống được chèn mã SQL vừa kiểm chữ ký tức thì.
