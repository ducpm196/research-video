scenes:
- id: hook
  kind: hook
  title: Nhật ký HMAC có chỉ mục SQLite & bảo vệ tốc độ
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <div class='box key'><p>Ghi bản ghi vào SQLite có <code>CREATE INDEX</code>, chặn 100% payload chèn SQL
      bằng <code>?</code> và kiểm chứng <b>HMAC-SHA256</b> dài 64 hex phát hiện ngay bất kỳ bản ghi nào bị sửa 1
      ký tự.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 7 tổng hợp kỹ nghệ phần mềm, cơ sở dữ liệu và bảo mật. Nếu chỉ lưu nhật
      ký bằng văn bản trơn trong cơ sở dữ liệu, kẻ xâm nhập có thể âm thầm sửa xoá dấu vết. Đồng thời nếu nối chuỗi
      trực tiếp khi lọc tên người dùng, ứng dụng sẽ lộ toàn bộ dữ liệu trước câu lệnh SQL độc hại. Hôm nay ta dựng
      một sổ nhật ký SQLite thật có chỉ mục tìm nhanh, tham số hoá và chữ ký HMAC xác thực từng bản ghi.
    clear: true
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Chỉ mục B-Tree &
      SQL tham số hoá (DBS/SWF)</td><td>Tìm log trong O(log N) và chặn hoàn toàn tấn công chèn SQL</td></tr><tr><td>Mẫu
      thiết kế sạch (SDP)</td><td>Tách lớp ký HMAC khỏi lớp lưu trữ SQLite</td></tr><tr><td>HMAC-SHA256 RFC 2104
      (SEC/WEB)</td><td>Xác thực bản ghi không bị sửa trộm sau khi ghi</td></tr></table>
    say: Dự án Chặng 7 nối ba mảnh kiến thức lớn của chặng kỹ nghệ phần mềm, cơ sở dữ liệu và an toàn thông tin.
      Thứ nhất là dùng chỉ mục cây cân bằng trên SQLite kết hợp tham số hoá để truy xuất nhanh và an toàn. Thứ hai
      là tổ chức hàm ký tách biệt giúp dễ kiểm thử độc lập như đã học ở mẫu thiết kế. Thứ ba là gắn thẻ xác thực
      thông điệp có khoá để phát hiện mọi thao tác sửa trộm dữ liệu sau khi ghi.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật dự án
  steps:
  - show: <table class='t'><tr><th>kỹ thuật / hàm cốt lõi</th><th>vai trò cài đặt</th></tr><tr><td><code>hmac.new(k,
      m, sha256)</code></td><td>Tạo mã xác thực 256 bit (64 ký tự hexa) gắn với khoá bí mật</td></tr><tr><td><code>hmac.compare_digest</code></td><td>So
      sánh chữ ký trong thời gian hằng số chống kênh kề</td></tr><tr><td><code>WHERE msg = ?</code></td><td>Truy
      vấn tham số hoá trên SQLite chặn hoàn toàn chèn SQL</td></tr></table>
    say: Ba hàm trên màn hình là trụ cột triển khai dự án Chặng 7. Hàm tạo thẻ HMAC sinh chuỗi sáu mươi bốn ký tự
      thập lục phân đại diện cho nội dung và khoá. Hàm đối chiếu digest kiểm chữ ký an toàn mà không dừng sớm ở
      ký tự sai đầu tiên. Cuối cùng dấu chấm hỏi giữ cho dữ liệu người dùng luôn chỉ là chuỗi thuần trong SQLite.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
