- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>10
      000 dòng</td><td>Quét bảng ~1 ms</td><td>Chỉ mục ~0,05 ms</td></tr><tr><td>1 000 000 dòng</td><td>Quét toàn
      bảng ~120 ms</td><td>Chỉ mục B-Tree 3 tầng ~0,1 ms</td></tr><tr><td>100 000 000 dòng</td><td>Quét toàn bảng
      treo vài giây</td><td>Chỉ mục 4 tầng giữ độ trễ < 1 ms</td></tr></table>
    say: Bảng quy mô giải thích vì sao dịch vụ nhật ký bắt buộc phải đánh chỉ mục ngay từ thiết kế ban đầu. Từ một
      triệu lên một trăm triệu dòng, chi phí quét tuần tự tăng tuyến tính gây nghẽn toàn bộ hệ thống. Trong khi
      đó cây cân bằng chỉ tăng thêm đúng một tầng đọc đĩa nên thời gian phản hồi giữ dưới một mi-li-giây.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 (-30đ):</b> Nối chuỗi <code>f"WHERE msg='{u}'"</code> thay vì dùng <code>?</code> làm hở lỗ hổng SQLi.<br><b>Lỗi
      2 (-20đ):</b> So sánh chữ ký bằng <code>==</code> dễ lộ thông tin thời gian; phải dùng <code>compare_digest</code>.<br><b>Lỗi
      3 (-10đ):</b> Lưu khoá HMAC cứng trong lịch sử mã nguồn công khai.</div></td></tr></table>
    say: Khi triển khai dịch vụ nhật ký bảo mật, bạn tuyệt đối tránh ba lỗi mất điểm sau đây. Thứ nhất là ghép trực
      tiếp biến đầu vào vào chuỗi câu lệnh SQL thay vì dùng tham số dấu hỏi. Thứ hai là so sánh chuỗi băm bằng toán
      tử hai dấu bằng thông thường thay cho hàm hằng thời gian. Thứ ba là đưa khoá bí mật lên kho lưu trữ chung
      khiến ai có quyền đọc mã đều giả được chữ ký.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự cài đặt
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <ol><li>Thẻ HMAC-SHA256 dạng thập lục phân gồm bao nhiêu ký tự?</li><li>Tham số hoá <code>?</code> chặn
      tấn công gì khi lọc nhật ký?</li></ol>
    say: Hãy dừng lại để tự trả lời hai câu hỏi ôn tập cho dự án Chặng 7. Câu một, mã HMAC chuẩn SHA hai trăm năm
      mươi sáu dưới dạng chuỗi hexa có bao nhiêu ký tự? Câu hai, dấu chấm hỏi tham số trong câu truy vấn giúp chặn
      kiểu tấn công nào? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Hàm băm SHA-256 xuất 256 bit = 32 byte = <code><b>64</b>
      ký tự hexa</code>.</p></td></tr></table>
    say: 'Đáp án câu một: hàm băm hai trăm năm mươi sáu bít tương ứng ba mươi hai byte, viết ra chuỗi thập lục phân
      đúng sáu mươi bốn ký tự.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Tham số hoá tách dữ liệu khỏi cú pháp lệnh
      nên chặn hoàn toàn <b>chèn SQL (SQL injection)</b>.</p></td></tr></table>
    say: 'Đáp án câu hai: nhờ tách phần dữ liệu ra khỏi cú pháp lệnh nên truy vấn tham số chặn triệt để tấn công
      chèn SQL.'
    clear: true
