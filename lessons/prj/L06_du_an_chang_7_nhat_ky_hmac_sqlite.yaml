  - 256 // 8 == 32
  steps:
  - show: <div class='box key'><p>Ghi bản ghi vào SQLite có <code>CREATE INDEX</code>, chặn 100% payload chèn SQL bằng <code>?</code>
      và kiểm chứng <b>HMAC-SHA256</b> dài 64 hex phát hiện ngay bất kỳ bản ghi nào bị sửa 1 ký tự.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 7 tổng hợp kỹ nghệ phần mềm, cơ sở dữ liệu và bảo mật. Nếu chỉ lưu nhật ký bằng
      văn bản trơn trong cơ sở dữ liệu, kẻ xâm nhập có thể âm thầm sửa xoá dấu vết. Đồng thời nếu nối chuỗi trực tiếp khi
      lọc tên người dùng, ứng dụng sẽ lộ toàn bộ dữ liệu trước câu lệnh SQL độc hại.
    clear: true
  - show: ''
    say: Hôm nay ta dựng một sổ nhật ký SQLite
      thật có chỉ mục tìm nhanh, tham số hoá và chữ ký HMAC xác thực từng bản ghi. Kết hợp chỉ mục tra cứu nhanh, tham số
      hoá truy vấn và thẻ xác thực băm khoá tạo thành sổ nhật ký đáng tin cậy trước cả lỗi lẫn tấn công. Thiết kế khép kín
      này là chuẩn mực cho mọi bảng lưu vết kiểm toán giao dịch trong các hệ thống tài chính.
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Chỉ mục B-Tree & SQL tham
      số hoá (DBS/SWF)</td><td>Tìm log trong O(log N) và chặn hoàn toàn tấn công chèn SQL</td></tr><tr><td>Mẫu thiết kế sạch
      (SDP)</td><td>Tách lớp ký HMAC khỏi lớp lưu trữ SQLite</td></tr><tr><td>HMAC-SHA256 RFC 2104 (SEC/WEB)</td><td>Xác thực
      bản ghi không bị sửa trộm sau khi ghi</td></tr></table>
    say: Dự án Chặng 7 nối ba mảnh kiến thức lớn của chặng kỹ nghệ phần mềm, cơ sở dữ liệu và an toàn thông tin. Thứ nhất
      là dùng chỉ mục cây cân bằng trên SQLite kết hợp tham số hoá để truy xuất nhanh và an toàn. Thứ hai là tổ chức hàm ký
      tách biệt giúp dễ kiểm thử độc lập như đã học ở mẫu thiết kế. Thứ ba là gắn thẻ xác thực thông điệp có khoá để phát
      hiện mọi thao tác sửa trộm dữ liệu sau khi ghi. Trong các dịch vụ tài chính và nhật ký kiểm toán sản xuất, hiệu năng
      tìm kiếm và tính toàn vẹn dữ liệu luôn phải đi song hành với nhau từ ngày đầu thiết kế. Nếu bảng nhật ký không gắn chỉ
      mục B-Tree trên cột khoá lọc, mỗi truy vấn phải quét tuần tự toàn bộ hàng triệu dòng trên đĩa. Nếu tối ưu câu lệnh SQL
      bằng cách ghép trực tiếp chuỗi đầu vào người dùng, lỗ hổng chèn SQL lập tức phơi bày toàn bộ bản ghi lịch sử nhạy cảm.
      Sự kết hợp cả ba tầng bảo vệ giúp hệ thống vừa đạt tốc độ truy vấn dưới mi-li-giây vừa chống mọi hành vi giả mạo dữ
      liệu. Đây là nguyên tắc cốt lõi bảo vệ tính toàn vẹn của mọi nhật ký lịch sử dài hạn.
