  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>tamper_detected=1</div></div>
    say: Kết quả chạy độc lập in ra bằng một vì đối chiếu chữ ký đã lập tức phát hiện hành vi sửa nội dung bản ghi. Như vậy
      bất kỳ thay đổi trái phép nào trong bảng đều không thể qua mặt bước kiểm tra. Cơ chế đối chiếu từng byte an toàn phát
      hiện ngay sai lệch chữ ký mà không mở kẽ hở đo thời gian phản hồi.
