- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (hở
      SQLi):</b> Nối chuỗi <code>f"WHERE m='{u}'"</code> thay vì dùng tham số <code>?</code> làm lộ toàn bộ bảng.<br><b>Lỗi
      2 (lộ timing):</b> So sánh chữ ký bằng <code>==</code> dễ rò rỉ thông tin thời gian; phải dùng <code>compare_digest</code>.<br><b>Lỗi
      3 (lộ khoá):</b> Lưu khoá bí mật HMAC cứng trong lịch sử mã nguồn công khai.</div></td></tr></table>
    say: Khi triển khai sổ nhật ký bảo mật trên thực tế, bạn tuyệt đối phải rà chặn ba sai lầm kỹ thuật điển hình sau đây.
      Sai lầm thứ nhất là ghép trực tiếp biến đầu vào từ người dùng vào chuỗi truy vấn SQL thay vì truyền qua dấu chấm hỏi
      tham số hoá. Sai lầm thứ hai là kiểm tra chữ ký bằng toán tử hai dấu bằng thông thường thay cho hàm đối chiếu hằng thời
      gian chuẩn mật mã. Sai lầm thứ ba là ghi cứng khoá bí mật xác thực trực tiếp trong kho mã nguồn công khai. Ngoài kiểm
      tham số hoá, luôn đảm bảo khoá bí mật dùng để ký được nạp từ biến môi trường an toàn bên ngoài mã nguồn. Đừng quên kiểm
      thử riêng tình huống tải thử chính xác thông điệp trùng khớp khi rà lại bộ lọc tìm kiếm.
