- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import hashlib, hmac</div><div>t1 = hmac.new(b'k7',
      b'login:an', hashlib.sha256).hexdigest()</div><div>t2 = hmac.new(b'k7', b'login:xx', hashlib.sha256).hexdigest()</div><div>print(f'tamper_detected={int(not
      hmac.compare_digest(t1, t2))}')</div></div>
    say: Ở phép kiểm chứng thứ hai, ta cố tình thay đổi hai ký tự cuối của thông điệp nhật ký rồi băm lại bằng cùng khoá bí
      mật. Vì đặc tính hiệu ứng tuyết lở của hàm băm, hai chữ ký phải khác hẳn nhau. Ngay cả thay đổi nhỏ nhất ở hai ký tự
      cuối thông điệp cũng sinh ra một chữ ký hoàn toàn mới không thể đoán trước.
