      dưới dạng chuỗi hexa có bao nhiêu ký tự? Câu hai, dấu chấm hỏi tham số trong câu truy vấn giúp chặn kiểu tấn công nào?
      Bấm tạm dừng và trả lời. Hai câu hỏi chốt lại độ dài chữ ký xác thực chuẩn và vai trò bảo vệ tuyệt đối của truy vấn
