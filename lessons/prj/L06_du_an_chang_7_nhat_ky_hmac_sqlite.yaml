- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 32 * 2 == 64
  - 256 // 8 == 32
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán (đệm chỉ mục trên RAM)</th><th>khuyến nghị kiến trúc</th></tr><tr><td>10 000 dòng</td><td>Quét
      bảng ~1 ms</td><td>Chỉ mục ~0,05 ms</td></tr><tr><td>1 000 000 dòng</td><td>Quét toàn bảng ~120 ms</td><td>Chỉ mục B-Tree
      3 tầng ~0,1 ms</td></tr><tr><td>100 000 000 dòng</td><td>Quét toàn bảng treo vài giây</td><td>Chỉ mục 4 tầng giữ độ
      trễ &lt; 1 ms (đệm chỉ mục trên RAM)</td></tr></table>
    say: Bảng quy mô giải thích vì sao dịch vụ nhật ký bắt buộc phải đánh chỉ mục ngay từ thiết kế ban đầu. Từ một triệu lên
      một trăm triệu dòng, chi phí quét tuần tự tăng tuyến tính gây nghẽn toàn bộ hệ thống. Trong khi đó cây cân bằng chỉ
      tăng thêm đúng một tầng đọc đĩa nên thời gian phản hồi giữ dưới một mi-li-giây. Bảng quy mô minh hoạ rất rõ sự khác
      biệt một trời một vực khi sổ nhật ký phình to từ quy mô thử nghiệm lên dữ liệu vận hành lâu năm. Ở ngưỡng mười nghìn
      bản ghi, quét toàn bảng chỉ mất xấp xỉ một mi-li-giây nên nhiều nhóm dễ chủ quan bỏ qua bước đánh chỉ mục. Khi hệ thống
      tích lũy một trăm triệu dòng kiểm toán, quét tuần tự sẽ treo kết nối nhiều giây và làm cạn kết nối ứng dụng. Trong khi
      đó chỉ mục bốn tầng vẫn hoàn tất tra cứu dưới một mi-li-giây. Trên bảng hàng trăm triệu dòng, chỉ mục cây cân bằng giữ
      hiệu năng tìm kiếm ổn định giúp hệ thống kiểm toán chạy mượt quanh năm.
