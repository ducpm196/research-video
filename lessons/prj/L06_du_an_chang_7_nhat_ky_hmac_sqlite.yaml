      hoàn toàn <b>chèn SQL (SQL injection)</b>.</p></td></tr></table>
    say: 'Đáp án câu hai: nhờ tách phần dữ liệu ra khỏi cú pháp lệnh nên truy vấn tham số chặn triệt để tấn công chèn SQL.
      Dù người dùng nhập bất kỳ ký tự đặc biệt nào, trình biên dịch SQL luôn xem đó là giá trị dữ liệu thuần.'
