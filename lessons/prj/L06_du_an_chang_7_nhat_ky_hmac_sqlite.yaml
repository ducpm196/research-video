      mã xác thực 256 bit (64 ký tự hexa) gắn với khoá bí mật</td></tr><tr><td><code>hmac.compare_digest</code></td><td>So
      sánh chữ ký trong thời gian hằng số chống kênh kề</td></tr><tr><td><code>WHERE msg = ?</code></td><td>Truy vấn tham
      số hoá trên SQLite chặn hoàn toàn chèn SQL</td></tr></table>
    say: Ba hàm trên màn hình là trụ cột triển khai dự án Chặng 7. Hàm tạo thẻ HMAC sinh chuỗi sáu mươi bốn ký tự thập lục
      phân đại diện cho nội dung và khoá. Hàm đối chiếu digest kiểm chữ ký an toàn mà không dừng sớm ở ký tự sai đầu tiên.
      Cuối cùng dấu chấm hỏi giữ cho dữ liệu người dùng luôn chỉ là chuỗi thuần trong SQLite. Chuỗi sáu mươi bốn ký tự hexa
      tương ứng đúng hai trăm năm mươi sáu bít đầu ra chuẩn của hàm băm xác thực. Sử dụng phép so sánh hằng thời gian cùng
      tham số hoá giữ tính bảo mật đồng nhất ở cả lớp lưu trữ lẫn lớp xác minh.
