  title: Chuyển khoản xong làm sao chứng minh hệ thống không tự sinh ra dù chỉ 1 đồng?
  checks:
  - alg.prj_double_entry_sum([('A','B',300),('B','C',150),('B','FEE',5)]) == 0
  steps:
  - show: <div class='box key'><p>Nếu chỉ trừ trực tiếp cột <code>balance</code> rồi cộng sang người nhận, khi mất
      điện giữa chừng hoặc hai luồng khoá ngược chiều nhau sẽ gây lệch sổ hoặc treo cứng.</p><p>Chuẩn ngân hàng
      bắt buộc ghi cặp <b>bút toán kép (tổng đại số = 0)</b> trong giao dịch nguyên tử và khoá tài khoản theo thứ
      tự tăng dần.</p></div>
    say: Chào bạn đến với dự án tổng hợp Chặng 2. Khi hai khách hàng vừa chuyển tiền qua lại cho nhau cùng một mi-li-giây
      mà hệ thống khoá ngược thứ tự, hai tiến trình sẽ kẹt cứng chờ nhau mãi mãi. Tệ hơn, nếu cập nhật số dư trực
      tiếp không để lại nhật ký kép thì kế toán không bao giờ truy vết được đồng tiền biến mất ở đâu. Hôm nay ta
      cài đặt lõi chuyển khoản bút toán kép và chứng minh bất biến tổng bằng không ở mọi tình huống.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
