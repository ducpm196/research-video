- id: pitfalls
  kind: pitfall
  title: Ba lỗi kỹ thuật nghiêm trọng cần tránh ở lõi chuyển khoản
  steps:
  - show: <table class='t'><tr><th>lỗi dễ làm hỏng bất biến khi nộp dự án</th></tr><tr><td><div class='box warn'><b>Lỗi 1
      — Chỉ sửa cột số dư mà quên ghi bảng bút toán kép.</b> Khi đối soát hoặc khiếu nại, hệ thống không còn chứng từ gốc.<br><b>Lỗi
      2 — Khai báo biến sắp xếp tài khoản cho có rồi không giữ khoá thật hoặc khoá ngược chiều.</b> Hai luồng chuyển chéo
      song song sẽ treo bế tắc.<br><b>Lỗi 3 — Kiểm số dư cộng tiền chưa tính phí hoặc cho phép chuyển cho chính mình.</b>
      Phí có thể làm âm tài khoản hoặc tự nhân đôi tiền gửi.</div></td></tr></table>
    say: Ba lỗi kỹ thuật dưới đây dễ làm hỏng bất biến lõi chuyển khoản khi chạy thực tế. Lỗi một là sửa cột số dư mà bỏ bảng
      bút toán khiến kiểm toán mù dấu vết về sau. Lỗi hai là viết biến sắp xếp cho có hoặc khoá ngược nguồn đích gây bế tắc
      khi nhiều luồng chạy đồng thời. Lỗi ba là quên cộng kèm phí khi kiểm số dư hoặc bỏ lọt lệnh tự chuyển cho chính tài
      khoản nguồn. Do đó hãy kiểm kỹ từng dòng trên trước khi nộp bài. Kiểm tra thêm trường hợp số tiền bằng không hoặc số
      âm trước khi xin khoá giúp loại bỏ các yêu cầu rác ngay từ đầu. Nếu gán kết quả sắp xếp khoá vào biến nháp rồi không
      dùng thực sự khi xin khoá thì ca ẩn đồng thời vẫn sẽ bế tắc.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - -155 + 150 + 5 == 0
  steps:
  - show: <ol><li>Luồng 1 chuyển từ tài khoản <code>ACC_9</code> sang <code>ACC_2</code>; luồng 2 chuyển từ <code>ACC_2</code>
      sang <code>ACC_9</code>. Để không bao giờ bế tắc, cả hai đều phải khoá tài khoản nào trước?</li><li>Một giao dịch chuyển
      150 đồng kèm phí 5 đồng làm tổng đại số ba dòng bút toán (-155, +150, +5) bằng bao nhiêu?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu một luồng chuyển từ chín sang hai và luồng kia từ hai sang chín, cả hai phải
      khoá tài khoản nào trước để chống bế tắc? Câu hai, tổng đại số ba dòng bút toán trừ một trăm năm mươi lăm, cộng một
      trăm năm mươi và cộng năm bằng bao nhiêu? Bấm tạm dừng và trả lời. Hai câu hỏi này kiểm tra chắc phản xạ xếp thứ tự
      khoá và nguyên tắc kiểm toán tổng bằng không.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Cả hai luồng đều phải khoá <b><code>ACC_2</code></b>
      trước (vì <code>ACC_2 &lt; ACC_9</code>), rồi mới khoá <code>ACC_9</code>.</p></td></tr></table>
    say: 'Đáp án câu một: cả hai luồng cùng khoá tài khoản số hai trước vì đứng trước số chín theo thứ tự tăng dần. Dù nguồn
      và đích đảo vai trò cho nhau ở hai luồng khác nhau, điểm khoá đầu tiên vẫn thống nhất ở mã nhỏ hơn.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code>-155 + 150 + 5 = <b>0</b></code> (luôn bảo toàn
      bất biến tổng bằng 0).</p></td></tr></table>
    say: 'Đáp án câu hai: tổng đại số đúng bằng không, bảo toàn tuyệt đối nguyên lý bút toán kép. Mọi chi phí phát sinh đều
      phải cân bằng từng đồng giữa bên chịu phí và tài khoản thu nhận tương ứng.'
    clear: true
