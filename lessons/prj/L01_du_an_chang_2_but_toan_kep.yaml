- id: example
  kind: example
  title: 'Chạy thật trên SQLite: khoá thứ tự tăng dần và chuyển khoản nguyên tử'
  checks:
  - alg.prj_double_entry_sum([('A','B',300),('B','C',150),('B','FEE',5)]) == 0
  steps:
  - show: '<table class=''t''><tr><th>kỹ thuật khoá &amp; giao dịch</th><th>vai trò trong lõi thanh toán</th></tr><tr><td><code>for
      k in sorted(accs): locks[k].acquire()</code></td><td>Khoá thật theo đúng thứ tự mã tăng dần, giải phóng ở khối finally</td></tr><tr><td><code>with
      db: ... INSERT INTO ent</code></td><td>Gom cập nhật số dư và các dòng bút toán vào cùng giao dịch nguyên tử</td></tr></table>'
    say: Bảng trên chỉ rõ hai cơ chế không thể thay thế cho nhau trong lõi chuyển tiền. Khoá trong bộ nhớ xếp tăng dần dùng
      để điều phối nhiều luồng chạy đồng thời không rơi vào bế tắc. Giao dịch cơ sở dữ liệu bảo đảm cặp cập nhật số dư và
      các dòng bút toán kép cùng chốt một lượt. Việc tách biệt lớp điều phối khoá ở ngoài và lớp ghi cơ sở dữ liệu bên trong
      giúp logic nghiệp vụ dễ đọc và dễ kiểm chứng. Mọi thay đổi số dư và bản ghi bút toán đều cùng nằm trong khối giao dịch
      duy nhất để hoàn tác trọn vẹn nếu gặp lỗi.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
  - show: '<p><b>Bước 1: khởi tạo bảng SQLite và bộ khoá cho từng tài khoản</b></p><div class="code"><div>import sqlite3,
      threading</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE TABLE acc(id TEXT PRIMARY KEY,
      bal INT)'')</div><div>db.execute(''CREATE TABLE ent(tx INT, id TEXT, d INT)'')</div><div>init = [(''A'',500), (''B'',400),
      (''C'',150), (''FEE'',0)]</div><div>db.executemany(''INSERT INTO acc VALUES(?,?)'', init)</div><div>locks = {k: threading.Lock()
      for k, _ in init}</div></div>'
    say: Đầu tiên ta dựng hai bảng tài khoản và bút toán trong cơ sở dữ liệu RAM cùng bốn tài khoản có tổng vốn một nghìn
      không trăm năm mươi đồng. Mỗi mã tài khoản được gán kèm một đối tượng khoá luồng độc lập để điều phối truy cập. Lưu
      ý tài khoản thu phí khởi tạo bằng không đồng để tổng hợp minh bạch phần doanh thu phí phát sinh từ các giao dịch.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Bước 2a: hàm kiểm số dư và ghi bút toán kép trong giao dịch nguyên tử</b></p><div class="code"><div>def apply_tx(tx,
      s, d, amt, fee):</div><div>    with db:</div><div>        r = db.execute(''SELECT bal FROM acc WHERE id=?'', (s,)).fetchone()</div><div>        if
      not r or r[0] &lt; amt + fee: return False</div><div>        db.execute(''UPDATE acc SET bal=bal-? WHERE id=?'', (amt+fee,
      s))</div><div>        db.execute(''UPDATE acc SET bal=bal+? WHERE id=?'', (amt, d))</div><div>        rows = [(tx, s,
      -(amt+fee)), (tx, d, amt)]</div><div>        if fee:</div><div>            db.execute("UPDATE acc SET bal=bal+? WHERE
      id=''FEE''", (fee,))</div><div>            rows.append((tx, ''FEE'', fee))</div><div>        db.executemany(''INSERT
      INTO ent VALUES(?,?,?)'', rows)</div><div>        return True</div></div>'
    say: Tiếp theo ta tách hàm ghi bút toán trong giao dịch nguyên tử. Nó kiểm tra lại số dư khả dụng kèm phí trước khi trừ
      bên gửi và cộng bên nhận. Nhờ nằm trọn trong một giao dịch, nếu bước nào thất bại thì toàn bộ bảng đều giữ nguyên trạng
      thái sạch. Điều kiện kiểm tra số dư khả dụng bắt buộc cộng cả khoản phí đi kèm vì tổng chi phí trừ vào tài khoản gửi
      bao gồm cả hai. Nếu chỉ kiểm tiền chuyển mà quên cộng phí, tài khoản nguồn có thể bị trừ lố xuống số dư âm sau khi chốt
      giao dịch.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>Bước 2b: hàm chuyển khoản xin khoá tăng dần thật và trả khoá an toàn</b></p><div class="code"><div>def xfer(tx,
      s, d, amt, fee=0):</div><div>    if amt &lt;= 0 or fee &lt; 0 or s == d: return False</div><div>    order = sorted({s,
      d} | ({''FEE''} if fee else set()))</div><div>    for k in order: locks[k].acquire()</div><div>    try:</div><div>        return
      order if apply_tx(tx, s, d, amt, fee) else False</div><div>    finally:</div><div>        for k in reversed(order):
      locks[k].release()</div></div>'
    say: Hàm chuyển khoản nhận vào danh sách tài khoản cần khoá đã sắp theo thứ tự tăng dần. Nhờ lấy khoá trước rồi mới gọi
      hàm cập nhật, không luồng nào đọc nhầm số dư đang đổi dở. Dù giao dịch đạt hay bị từ chối, khối giải phóng luôn mở khoá
      theo chiều ngược lại để tránh rò rỉ. Khối bảo vệ hoàn tất cuối hàm bảo đảm không bao giờ giữ kẹt khoá tài khoản ngay
      cả khi bước ghi dữ liệu phát sinh ngoại lệ.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: '<p><b>Bước 3: chạy thật 3 giao dịch (gồm C→B bị từ chối) và kiểm dấu vết</b></p><div class="code"><div>r1 = xfer(1,
      ''A'', ''B'', 300)</div><div>r2 = xfer(2, ''C'', ''B'', 900)</div><div>r3 = xfer(3, ''B'', ''C'', 150, 5)</div><div>lsum
      = db.execute(''SELECT COALESCE(SUM(d),0) FROM ent'').fetchone()[0]</div><div>print(f''res={bool(r1)},{bool(r2)},{bool(r3)}
      order1={r1} lsum={lsum}'')</div></div>'
    say: Ta gọi hàm ba lần gồm chuyển từ A sang B, lệnh vượt hạn mức từ C sang B và lệnh có phí từ B sang C. Sau đó câu truy
      vấn kiểm lại tổng toàn bộ dòng đã ghi trong bảng bút toán. Thứ tự kết quả trả về phản ánh chính xác giao dịch nào được
      chấp nhận và giao dịch nào bị từ chối ở lớp kiểm biên.
    focus:
    - 1
    - 2
    - 2
