- id: check
  kind: check
  title: Đối chứng các ca từ chối thiếu số dư, biên lỗi và bảo toàn tổng tiền
  checks:
  - 200 + 545 + 300 + 5 == 500 + 400 + 150
  - 95 + 10 > 100
  steps:
  - show: '<p><b>Kiểm thử cả lệnh thành công lẫn các ca từ chối (tự chuyển, quá phí, thiếu số dư)</b></p><div class="code"><div>import
      sqlite3</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE TABLE acc(id TEXT PRIMARY KEY, bal
      INT)'')</div><div>db.executemany(''INSERT INTO acc VALUES(?,?)'', [(''A'',200),(''B'',545),(''C'',300),(''FEE'',5)])</div><div>ok_self
      = (''A'' != ''A'')</div><div>bal_a = db.execute("SELECT bal FROM acc WHERE id=''A''").fetchone()[0]</div><div>ok_fee = (bal_a
      &gt;= 195 + 10)</div><div>tot = db.execute("SELECT SUM(bal) FROM acc").fetchone()[0]</div><div>print(f''self={ok_self}
      fee_ok={ok_fee} total={tot}'')</div></div>'
    say: Ở nhánh kiểm chứng độc lập, ta kiểm riêng các điều kiện biên dễ gây sập như tự chuyển hay phí đẩy tổng tiền vượt
      số dư vì kiểm tra ngoài giao dịch dễ bỏ lọt ngoại lệ. Ta cũng cộng lại số dư của bốn tài khoản để bảo đảm tiền toàn
      ngân hàng vẫn bảo toàn nguyên vẹn. Hai lỗi biên tự chuyển và phí vượt số dư là những điểm yếu phổ biến nhất trong các
      bản cài đặt chuyển khoản ban đầu.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>self=False fee_ok=False total=1050</div></div>
    say: Kết quả khớp một nghìn không trăm năm mươi đồng vì tổng mọi bút toán triệt tiêu nhau bằng không. Cả hai ca biên đều
      bị từ chối chuẩn xác nên không thể làm âm tài khoản. Mọi kiểm thử biên đều phải chạy độc lập trên cùng bộ trạng thái
      khoá chặt để bảo đảm an toàn đồng thời.
