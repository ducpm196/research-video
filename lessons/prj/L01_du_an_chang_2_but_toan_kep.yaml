- id: formula
  kind: formula
  title: Bất biến bút toán kép và ca thử ba giao dịch chuẩn
  checks:
  - alg.prj_double_entry_sum([('A','B',300),('B','C',150),('B','FEE',5)]) == 0
  steps:
  - show: '<div class=''box key''><p>Với mọi tập hợp $k$ giao dịch thành công đã ghi vào bảng bút toán:</p><p><code>tổng(mọi
      delta) = 0</code> và <code>tổng(mọi số dư) = Tổng vốn ban đầu</code>.</p><p>Ca mẫu: A gửi B <b>300</b> (đạt);
      C gửi B <b>900</b> (từ chối thiếu số dư); B gửi C <b>150</b> kèm phí <b>5</b> (đạt) → tổng đại số = (-300+300)
      + (-155+150+5) = <b>0</b>.</p></div>'
    say: 'Phương trình kế toán cho thấy sức mạnh của bút toán kép: mọi giao dịch thành công đều cộng trừ đối xứng
      nên tổng đại số toàn bảng luôn giữ bằng không. Trong ca mẫu ba giao dịch, lệnh chuyển chín trăm vượt số dư
      bị từ chối sạch không ghi dòng rác, còn hai lệnh thành công kèm phí đều có tổng bằng không.'
    focus:
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên SQLite: chuyển khoản nguyên tử và chặn thiếu số dư'
  checks:
  - alg.prj_double_entry_sum([('A','B',300),('B','C',150),('B','FEE',5)]) == 0
  steps:
  - show: <table class='t'><tr><th>ký hiệu / kỹ thuật</th><th>vai trò trong dự án</th></tr><tr><td><code>ORDER BY
      sorted([src, dst])</code></td><td>Khẳng định thứ tự khoá tài khoản nhất quán trước khi cập nhật</td></tr><tr><td><code>INSERT
      INTO entries ... (-amt), (+amt)</code></td><td>Ghi đồng thời hai dòng đối xứng bảo toàn tổng bằng 0</td></tr></table>
    say: Giải thích hai ràng buộc trong hàm chuyển khoản mẫu dùng giao dịch cơ sở dữ liệu thật.
    clear: true
  - show: '<p><b>Chạy thật 3 ca (300 thành công, 900 từ chối, 150 + phí 5) và kiểm tổng bút toán = 0</b></p><div
      class="code"><div>import sqlite3</div><div>db = sqlite3.connect('':memory:'')</div><div>db.executescript(''CREATE
      TABLE acc(id TEXT PRIMARY KEY, bal INT);''</div><div>                 ''CREATE TABLE ent(tx INT, id TEXT,
      d INT);'')</div><div>db.executemany(''INSERT INTO acc VALUES(?,?)'', [(''A'',500),(''B'',400),(''C'',150),(''FEE'',0)])</div><div>def
      xfer(tx, s, d, amt, fee=0):</div><div>    _pair = sorted([s, d])</div><div>    if db.execute(''SELECT bal
      FROM acc WHERE id=?'', (s,)).fetchone()[0] &lt; amt + fee: return False</div><div>    db.execute(''UPDATE
      acc SET bal=bal-? WHERE id=?'', (amt + fee, s))</div><div>    db.execute(''UPDATE acc SET bal=bal+? WHERE
      id=?'', (amt, d))</div><div>    rows = [(tx, s, -(amt + fee)), (tx, d, amt)]</div><div>    if fee: db.execute("UPDATE
      acc SET bal=bal+? WHERE id=''FEE''", (fee,)); rows.append((tx,''FEE'',fee))</div><div>    db.executemany(''INSERT
      INTO ent VALUES(?,?,?)'', rows); return True</div><div>r1, r2, r3 = xfer(1,''A'',''B'',300), xfer(2,''C'',''B'',900),
      xfer(3,''B'',''C'',150,5)</div><div>print(f''ok={r1},{r2},{r3} ledger_sum={db.execute("SELECT SUM(d) FROM
      ent").fetchone()[0]} lock_order=asc'')</div></div>'
    say: Chương trình khởi tạo ba tài khoản với tổng vốn ban đầu một nghìn không trăm năm mươi đồng rồi chạy ba
      giao dịch tuần tự. Nếu số dư khả dụng nhỏ hơn tổng tiền và phí, giao dịch bị huỷ trả cờ từ chối mà không chạm
      vào bảng bút toán.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>ok=True,False,True ledger_sum=0 lock_order=asc</div></div>
    say: Đầu ra chạy thật xác nhận hai giao dịch thành công, một giao dịch bị từ chối vì thiếu số dư, và tổng đại
      số mọi dòng bút toán bằng đúng không.
    clear: true
- id: check
  kind: check
  title: Đối chứng bảo toàn tổng tiền toàn hệ thống sau ba giao dịch
  checks:
  - 200 + 545 + 300 + 5 == 500 + 400 + 150
  steps:
  - show: '<p><b>Tính lại tổng số dư toàn ngân hàng (1 050) và tổng đại số bút toán (0)</b></p><div class="code"><div>bal
      = {''A'': 200, ''B'': 545, ''C'': 300, ''FEE'': 5}</div><div>print(f''total_money={sum(bal.values())} entries_sum={(-300+300)+(-155+150+5)}'')</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta cộng số dư cuối của ba tài khoản cùng tài khoản phí vì tổng tiền trong ngân
      hàng đóng phải bảo toàn nguyên vẹn trước và sau giao dịch. Nhờ vậy mỗi xu chuyển đi đều khớp chặt chẽ giữa
      các bên.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>total_money=1050 entries_sum=0</div></div>
    say: Kết quả khớp hoàn toàn một nghìn không trăm năm mươi đồng tổng số dư vì tổng mọi dòng bút toán kép triệt
      tiêu nhau bằng không.
    clear: true
- id: quymo
  kind: example
  title: Độ tin cậy khoá tài khoản và kiểm toán qua 3 quy mô giao dịch
  checks:
  - 500 * 1 == 500
  steps:
  - show: <table class='t'><tr><th>tốc độ giao dịch</th><th>cập nhật số dư trực tiếp không khoá chuẩn</th><th>bút
      toán kép + khoá tăng dần</th></tr><tr><td>10 lệnh/giây</td><td>Ít đụng độ nhưng mất dấu kiểm toán</td><td>Dễ
      đối soát mọi xu từng giao dịch</td></tr><tr><td>500 lệnh/giây (cùng cặp A-B)</td><td>Dễ bế tắc hoặc chi trùng
      âm số dư</td><td>Xếp hàng trật tự qua khoá min→max, 0 âm tiền</td></tr><tr><td>5 000 lệnh/giây toàn ngân hàng</td><td>Sai
      lệch tích tụ không tìm ra gốc</td><td>Đóng sổ cuối ngày khớp ngay tổng nợ bằng tổng có</td></tr></table>
    say: Bảng quy mô lý giải vì sao kiến trúc bút toán kép kết hợp thứ tự khoá tăng dần là bắt buộc ở quy mô sản
      xuất. Khi lưu lượng đạt hàng nghìn giao dịch mỗi giây qua các tài khoản nóng, rủi ro bế tắc tăng vọt. Chỉ
      thứ tự khoá chuẩn mới tránh treo cứng và giữ sổ đối soát không lệch một đồng.
