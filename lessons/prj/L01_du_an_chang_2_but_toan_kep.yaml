  steps:
  - show: '<div class=''box key''><p>Với mọi tập hợp $k$ giao dịch thành công đã ghi vào bảng bút toán:</p><p><code>tổng(mọi
      delta) = 0</code> và <code>tổng(mọi số dư) = Tổng vốn ban đầu</code>.</p><p>Ca mẫu: A gửi B <b>300</b> (đạt); C gửi
      B <b>900</b> (từ chối thiếu số dư); B gửi C <b>150</b> kèm phí <b>5</b> (đạt) → tổng đại số = (-300+300) + (-155+150+5)
      = <b>0</b>.</p></div>'
    say: Phương trình kế toán chứng minh mọi giao dịch thành công đều cộng trừ đối xứng nên tổng đại số luôn bằng không. Trong
      ca mẫu, lệnh thứ nhất trừ ba trăm bên gửi và cộng đúng ba trăm bên nhận. Lệnh thứ hai đòi chuyển chín trăm vượt quá
      số dư một trăm năm mươi nên bị huỷ sạch không ghi dòng nào. Lệnh thứ ba tách khoản trừ một trăm năm mươi lăm thành một
      trăm năm mươi cho người nhận và năm đồng phí. Tổng vốn toàn ngân hàng nhờ đó luôn bảo toàn ở mọi thời điểm. Bất biến
