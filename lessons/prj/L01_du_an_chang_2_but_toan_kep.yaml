  steps:
  - show: <div class='box key'><p>Nếu chỉ trừ trực tiếp cột <code>balance</code> rồi cộng sang người nhận, khi mất điện giữa
      chừng hoặc hai luồng khoá ngược chiều nhau sẽ gây lệch sổ hoặc treo cứng.</p><p>Chuẩn ngân hàng bắt buộc ghi cặp <b>bút
      toán kép (tổng đại số = 0)</b> trong giao dịch nguyên tử và khoá tài khoản theo thứ tự tăng dần.</p></div>
    say: Chào bạn đến với dự án tổng hợp Chặng 2. Khi hai khách hàng chuyển tiền qua lại cùng một mi-li-giây mà khoá ngược
      thứ tự, hai tiến trình sẽ treo cứng mãi mãi. Nếu cập nhật số dư tay bo không để lại nhật ký kép, kế toán không thể truy
      vết tiền đi đâu. Hôm nay ta dựng lõi chuyển khoản bút toán kép đọc lệnh từ luồng chuẩn, dùng khoá tăng dần thật sự và
      giữ tổng bằng không. Mọi quy tắc an toàn tiền tệ đều phải được thi hành ở mức lõi giao dịch thay vì trông chờ vào ứng
      dụng gọi ngoài. Bắt đầu từ bài này, từng đồng tiền thay đổi đều có cặp bút toán đối ứng giải trình đầy đủ.
