- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm nặng ở đồ án thực tế
  steps:
  - show: '<table class=''t''><tr><th>lỗi mất điểm phổ biến khi nộp dự án</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1 (-30đ): Chỉ sửa cột số dư mà quên ghi bảng bút toán kép.</b> Khi đối soát hoặc khiếu nại, hệ thống không
      còn vết chứng từ gốc.<br><b>Lỗi 2 (-20đ): Khoá tài khoản nguồn trước tài khoản đích mà không sắp thứ tự.</b>
      Giao dịch A→B gặp B→A chạy song song sẽ treo bế tắc.<br><b>Lỗi 3 (-20đ): Kiểm tra số dư ở ứng dụng trước rồi
      mới bắt đầu giao dịch DB.</b> Hai luồng cùng đọc thấy đủ tiền rồi cùng trừ làm âm tài khoản.</div></td></tr></table>'
    say: Hãy nhớ ba lỗi chí tử khiến lõi chuyển khoản mất điểm nặng nhất. Lỗi một là sửa số dư tay bo không sinh
      cặp bút toán khiến kiểm toán mù tịt. Lỗi hai là khoá tài khoản gửi trước người nhận gây bế tắc khi chuyển
      chéo đồng thời. Lỗi ba là kiểm tra số dư ở ngoài giao dịch làm lộ khe hở rút tiền hai lần cùng lúc.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - -155 + 150 + 5 == 0
  steps:
  - show: <ol><li>Luồng 1 chuyển từ tài khoản <code>ACC_9</code> sang <code>ACC_2</code>; luồng 2 chuyển từ <code>ACC_2</code>
      sang <code>ACC_9</code>. Để không bao giờ bế tắc, cả hai đều phải khoá tài khoản nào trước?</li><li>Một giao
      dịch chuyển 150 đồng kèm phí 5 đồng làm tổng đại số ba dòng bút toán (-155, +150, +5) bằng bao nhiêu?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu một luồng chuyển từ chín sang hai và luồng kia từ hai sang chín,
      cả hai phải khoá tài khoản nào trước để chống bế tắc? Câu hai, tổng đại số ba dòng bút toán trừ một trăm năm
      mươi lăm, cộng một trăm năm mươi và cộng năm bằng bao nhiêu? Bấm tạm dừng và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Cả hai luồng đều phải khoá <b><code>ACC_2</code></b>
      trước (vì <code>ACC_2 &lt; ACC_9</code>), rồi mới khoá <code>ACC_9</code>.</p></td></tr></table>
    say: 'Đáp án câu một: cả hai luồng cùng khoá tài khoản số hai trước vì đứng trước số chín theo thứ tự tăng dần.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code>-155 + 150 + 5 = <b>0</b></code> (luôn
      bảo toàn bất biến tổng bằng 0).</p></td></tr></table>
    say: 'Đáp án câu hai: tổng đại số đúng bằng không, bảo toàn tuyệt đối nguyên lý bút toán kép.'
    clear: true
- id: practice
  kind: practice
  title: Tự cài đặt dự án và chấm tự động 100 điểm
  lab: labs/PRJ/L01
