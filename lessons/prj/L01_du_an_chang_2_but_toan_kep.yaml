      + khoá tăng dần</th></tr><tr><td>3–10 lệnh (mẫu nhỏ)</td><td>Ít đụng độ nhưng không còn nhật ký kiểm toán</td><td>Mọi
      giao dịch thành công và từ chối đều có dấu vết</td></tr><tr><td>500 lệnh (ca ẩn vừa)</td><td>Dễ bế tắc nếu chuyển chéo
      cùng cặp tài khoản</td><td>Xếp hàng trật tự qua khoá nhỏ tới lớn, không âm tiền</td></tr><tr><td>5 000+ lệnh (quy mô
      lớn)</td><td>Sai lệch tích tụ khó lần ra nguyên nhân</td><td>Đóng sổ cuối ngày khớp ngay tổng nợ bằng tổng có</td></tr></table>
    say: Bảng quy mô lý giải vì sao kiến trúc bút toán kép kết hợp thứ tự khoá tăng dần là bắt buộc ngoài thực tế. Ở cỡ vài
      lệnh đầu tiên, mọi giao dịch gần như không đụng độ nên sai sót thiết kế vẫn ẩn kỹ. Tới mức năm trăm lệnh trong ca ẩn,
      chỉ vài luồng chuyển chéo đan xen đã đủ gây bế tắc nếu thứ tự khoá bị đảo. Lên tới năm nghìn lệnh mỗi ngày, chỉ hệ thống
      giữ bút toán kép mới đóng sổ khớp từng đồng được. Sự khác biệt giữa chạy thử vài lệnh và chạy năm nghìn lệnh đan xen
      nằm trọn ở kỷ luật giữ khoá theo thứ tự tăng dần. Giữ vững nguyên lý bút toán kép tạo sổ cái tin cậy tuyệt đối dù khối
      lượng giao dịch tăng mạnh hằng ngày.
