      chữ ký mật mã và còn hạn dùng. Khoá khử trùng được bảo vệ bằng ràng buộc duy nhất dưới cơ sở dữ liệu chứ không
      chỉ giữ trên bộ nhớ tạm. Cuối cùng truy vấn phân trang dùng con trỏ định vị thẳng vào chỉ mục thay vì đếm
      bỏ từ đầu.
