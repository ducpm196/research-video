  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Chỉ thực hiện 3 khoá duy nhất <code>k1, k2,
      k3</code> → tổng tiền = <code>400 + 500 + 300 = <b>1 200</b></code>.</p></td></tr></table>
    say: 'Đáp án câu một: chỉ thực thi ba khoá duy nhất một lần mỗi khoá, cho tổng tiền đúng một nghìn hai trăm
      đồng.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Vì câu truy vấn đi thẳng theo cây chỉ mục
      tới đúng <code>last_id</code> và đọc 20 dòng thay vì đọc bỏ 100 000 dòng đứng trước.</p></td></tr></table>
    say: 'Đáp án câu hai: truy vấn con trỏ đi thẳng tới mã cuối trên cây chỉ mục rồi lấy hai mươi dòng mà không
      đếm bỏ các dòng đầu.'
