  steps:
  - show: '<ol><li>Hệ thống nhận 5 yêu cầu: <code>k1(400), k2(500), k1(400), k3(300), k2(500)</code>. Tổng tiền
      thực sự được thực hiện khi có khử trùng bằng bao nhiêu?</li><li>Khi đọc trang tiếp theo ở bảng 100 000 dòng,
