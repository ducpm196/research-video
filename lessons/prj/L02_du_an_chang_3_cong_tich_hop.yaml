- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật và bất biến cần bảo đảm
  steps:
  - show: <table class='t'><tr><th>thành phần cổng tích hợp</th><th>bất biến bảo mật & hiệu năng</th></tr><tr><td><code>JWT
      + HMAC-SHA256</code></td><td>Kiểm chữ ký an toàn theo thời gian hằng và từ chối nếu quá hạn <code>exp</code></td></tr><tr><td><code>UNIQUE(idem_key)</code></td><td>Khoá
      khử trùng lưu bền vững trong DB; trùng khoá trả kết quả cũ không chạy lại</td></tr><tr><td><code>WHERE id
      &gt; last_id LIMIT 20</code></td><td>Phân trang con trỏ dùng chỉ mục B-Tree, tránh quét bỏ hàng chục nghìn
