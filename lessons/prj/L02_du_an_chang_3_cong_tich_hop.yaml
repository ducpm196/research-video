- id: formula
  kind: formula
  title: Bất biến khử trùng và chi phí bỏ dòng khi phân trang
  checks:
  - alg.prj_idem_dedup([('k1',400),('k2',500),('k1',400),('k3',300),('k1',400)]) == (3, 1200)
  steps:
  - show: '<div class=''box key''><p>Nhận 5 yêu cầu hợp lệ: <code>(k1: 400), (k2: 500), (k1: 400), (k3: 300), (k1: 400)</code>.</p><p>Với
      <code>PRIMARY KEY(idem_key)</code>: chỉ thực hiện 3 khoá duy nhất <code>k1, k2, k3</code> → tổng tiền = 400 + 500 +
      300 = <b>1 200</b> (nếu không khử trùng sẽ trừ lố thành 2 000).</p><p>Phân trang 100 000 dòng ở cuối: <code>OFFSET 99
      980</code> quét bỏ <b>99 980</b> dòng thừa, còn <code>id &gt; 99 980</code> chỉ đọc đúng <b>20</b> dòng.</p></div>'
    say: Công thức khử trùng rất trực quan nhưng ngăn được sai lệch hàng trăm triệu đồng trong giao dịch thật. Năm yêu cầu
      gửi tới chỉ mang ba khoá phân biệt nên tổng tiền thực hiện dừng ở một nghìn hai trăm đồng thay vì hai nghìn. Điều quan
      trọng là phải tính toán bộ đếm thẻ lỗi trước khi chạm bảng khử trùng để không kẻ xấu nào làm phình bộ nhớ bằng chữ ký
      giả. Ở phần tra cứu, bỏ qua chín mươi chín nghìn chín trăm tám mươi dòng gây tốn đĩa gấp nhiều nghìn lần so với đi thẳng
      qua chỉ mục. Điều kiện thực thi chốt một trước chốt hai là bí quyết giữ sạch bảng khoá khử trùng khỏi hàng loạt yêu
      cầu tấn công rác. Chênh lệch hàng nghìn lần hiệu năng ở cuối bảng là lý do các cổng giao dịch lớn đều cấm phân trang
      vị trí đếm bỏ qua ở bảng sâu.
