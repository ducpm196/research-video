- id: quymo
  kind: example
  title: Đo chi phí phân trang OFFSET so với Keyset qua 3 cỡ bảng
  checks:
  - 100_000 // 20 == 5000
  steps:
  - show: '<p><b>Đo trực tiếp trên SQLite :memory: với <code>time.perf_counter()</code></b></p><div class="code"><div>import
      sqlite3, time</div><div>for n in (1000, 10000, 100000):</div><div>    db = sqlite3.connect('':memory:'')</div><div>    db.execute(''CREATE
      TABLE tx(id INTEGER PRIMARY KEY, amt INT)'')</div><div>    db.executemany(''INSERT INTO tx VALUES(?,100)'', ((i,) for
      i in range(1, n + 1)))</div><div>    q1 = f''SELECT id FROM tx ORDER BY id LIMIT 20 OFFSET {n-20}''</div><div>    t0
      = time.perf_counter(); db.execute(q1).fetchall()</div><div>    t1 = (time.perf_counter() - t0) * 1000</div><div>    q2
      = f''SELECT id FROM tx WHERE id &gt; {n-20} ORDER BY id LIMIT 20''</div><div>    t0 = time.perf_counter(); db.execute(q2).fetchall()</div><div>    t2
      = (time.perf_counter() - t0) * 1000</div><div>    print(f''n={n}: offset={t1:.3f}ms keyset={t2:.3f}ms'')</div></div><p
      class="note">Kết quả thực nghiệm trên <code>:memory:</code>:
      n=1 000 (0,036 ms vs 0,022 ms); n=10 000 (0,144 ms vs 0,021 ms); n=100 000 (1,062 ms vs 0,026 ms). Trên đĩa hoặc bảng
      lớn triệu dòng độ trễ OFFSET còn đội gấp nhiều chục lần hơn.</p>'
    say: Bảng quy mô cùng phép đo thật trên SQLite cho thấy độ chênh lệch thời gian giữa hai chiến lược
      phân trang khi dữ liệu phình to dần. Ở cỡ một nghìn dòng, hai cách gần tương đương nhau vì số dòng bỏ qua ít. Khi lên
      tới trăm nghìn dòng trong RAM, OFFSET đọc bỏ gần hết bảng nên chậm gấp vài chục lần, còn con trỏ giữ ở hai phần trăm
      mi-li-giây. Trên cơ sở dữ liệu lưu đĩa thật có hàng triệu dòng, khoảng cách này còn lớn gấp nhiều chục lần hơn.
    focus:
    - 1
    - 2
    - 2
    - 3
    clear: true
