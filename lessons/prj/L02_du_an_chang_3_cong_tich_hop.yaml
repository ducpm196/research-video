- id: example
  kind: example
  title: 'Chạy thật: xác thực HMAC, kiểm hạn và khử trùng 5 yêu cầu'
  checks:
  - 400 + 500 + 300 == 1200
  steps:
  - show: <table class='t'><tr><th>bước kiểm tra thẻ</th><th>vai trò khi lọc biên</th></tr><tr><td><code>len(parts) == 3 and
      exp.isdigit()</code></td><td>Loại ngay chuỗi thẻ sai định dạng hoặc thời hạn không phải số</td></tr><tr><td><code>int(exp)
      &gt;= now and hmac.compare_digest(...)</code></td><td>Chặn thẻ quá hạn dùng và ngăn tấn công đo thời gian chữ ký</td></tr></table>
    say: Hai bước trên bảng kiểm soát toàn bộ cửa vào cho thẻ truy cập rút gọn. Trước hết ta tách ba phần ngăn cách bằng dấu
      chấm và bảo đảm phần thời hạn là chuỗi chữ số hợp lệ. Sau đó hệ thống kiểm hạn dùng lớn hơn hoặc bằng mốc hiện tại rồi
      mới đối chiếu chữ ký mật mã theo thời gian hằng. Kiểm định dạng chuỗi số ở trường thời hạn tránh lỗi ngoại lệ ép kiểu
      khi gặp chuỗi thẻ cố tình chèn ký tự lạ. Trình tự kiểm hạn dùng rồi mới so khớp mật mã bảo đảm từng bước xác thực đều
      chặt chẽ và rõ ràng.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.2'
    - '1.3'
    clear: true
  - show: <p><b>1. Hàm xác thực chữ ký HMAC-SHA256 kèm kiểm hạn dùng</b></p><div class="code"><div>import hmac, hashlib, sqlite3</div><div>sec,
      now = b'k_demo', 1000</div><div>def ok(tok):</div><div>    p = tok.split('.')</div><div>    if len(p) != 3 or not p[1].isdigit()
      or int(p[1]) &lt; now:</div><div>        return False</div><div>    want = hmac.new(sec, f'{p[0]}.{p[1]}'.encode(),
      hashlib.sha256).hexdigest()</div><div>    return hmac.compare_digest(p[2], want)</div><div>def sign(u, e):</div><div>    s
      = hmac.new(sec, f'{u}.{e}'.encode(), hashlib.sha256).hexdigest()</div><div>    return f'{u}.{e}.{s}'</div></div>
    say: Trước tiên ta viết hai hàm trợ giúp tạo và xác thực thẻ truy cập bằng hàm băm mật mã. Hàm kiểm tra tách đúng ba phần,
      loại ngay thẻ có thời hạn nhỏ hơn mốc hiện tại rồi đối chiếu chữ ký an toàn theo thời gian hằng. Chữ ký được tính bằng
      thuật toán băm đối xứng gắn bí mật máy chủ trên phần mã người dùng và dấu thời gian ghép nối.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>2. Thử 6 yêu cầu gồm 2 khoá trùng và 1 thẻ hết hạn qua SQLite</b></p><div class="code"><div>t1, t_exp = sign(''u1'',
      1200), sign(''u2'', 900)</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE TABLE idem(k TEXT
      PRIMARY KEY, a INT)'')</div><div>reqs = [(''k1'',400,t1),(''k2'',500,t1),(''k1'',400,t1),(''k3'',300,t1),(''k1'',400,t1),(''k4'',900,t_exp)]</div><div>v_ok
      = v_bad = 0</div><div>for k, a, t in reqs:</div><div>    if ok(t): v_ok += 1; db.execute(''INSERT OR IGNORE INTO idem
      VALUES(?,?)'', (k, a))</div><div>    else: v_bad += 1</div><div>cnt, tot = db.execute(''SELECT COUNT(*), COALESCE(SUM(a),0)
      FROM idem'').fetchone()</div><div>print(f''valid={v_ok} bad={v_bad} executed={cnt} total={tot}'')</div></div>'
    say: Tiếp theo hệ thống đưa sáu yêu cầu qua bảng khử trùng trong cơ sở dữ liệu. Khi gặp thẻ quá hạn ở lượt thứ sáu, cổng
      lập tức tăng bộ đếm lỗi và bỏ qua không chèn vào bảng khoá chính. Sử dụng bảng khử trùng lưu bền trên đĩa bảo đảm ngay
      cả khi khởi động lại tiến trình vẫn không trừ lặp tiền.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>valid=5 bad=1 executed=3 total=1200</div></div>
    say: Kết quả chạy thật xác nhận năm yêu cầu hợp lệ qua cửa và một yêu cầu hết hạn bị chặn ở bộ đếm lỗi. Bảng khử trùng
      chỉ ghi nhận đúng ba giao dịch với tổng tiền một nghìn hai trăm đồng. Con số tổng một nghìn hai trăm đồng xác nhận hai
      lượt gửi lặp không thể tạo ra hai dòng giao dịch trùng lặp.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kết quả phân trang con trỏ với OFFSET truyền thống
  checks:
  - 991 + 992 + 993 == 2976
  steps:
  - show: '<p><b>So sánh truy vấn OFFSET 990 với con trỏ id &gt; 990 trên bảng 1 000 dòng</b></p><div class="code"><div>import
      sqlite3</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE TABLE tx(id INTEGER PRIMARY KEY)'')</div><div>with
      db: db.executemany(''INSERT INTO tx(id) VALUES(?)'', [(i,) for i in range(1, 1001)])</div><div>p_off = [r[0] for r in
      db.execute(''SELECT id FROM tx ORDER BY id LIMIT 3 OFFSET 990'')]</div><div>p_cur = [r[0] for r in db.execute(''SELECT
      id FROM tx WHERE id &gt; 990 ORDER BY id LIMIT 3'')]</div><div>empty = [r[0] for r in db.execute(''SELECT id FROM tx
      WHERE id &gt; 1500 ORDER BY id LIMIT 3'')]</div><div>print(f''same={p_off == p_cur} ids={p_cur} empty={empty}'')</div></div>'
    say: Ở bước kiểm chứng độc lập, ta tạo bảng một nghìn giao dịch đánh số liên tiếp từ một tới một nghìn trong một giao
      dịch lô duy nhất. Ta đối chiếu kết quả giữa cách bỏ qua chín trăm chín mươi dòng đầu và câu truy vấn con trỏ lấy mã
      lớn hơn chín trăm chín mươi. Đồng thời kiểm tra thêm biên vượt cuối bảng để bảo đảm truy vấn trả danh sách rỗng thay
      vì báo lỗi. Lưu ý rằng danh sách kết quả của phép phân trang con trỏ trả về khớp từng mã định danh với phép đọc vị trí
      truyền thống.
    focus:
    - 1
    - 2
    - 2
