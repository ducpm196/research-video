      + <code>exp &gt;= now</code></td><td>So chữ ký theo thời gian hằng và từ chối ngay thẻ hết hạn dùng</td></tr><tr><td><code>UNIQUE(idem_key)</code></td><td>Khoá
      khử trùng lưu bền vững trong DB; trùng khoá không bao giờ ghi thêm dòng tiền</td></tr><tr><td><code>WHERE id &gt; last_id
      LIMIT k</code></td><td>Phân trang con trỏ dùng chỉ mục B-Tree, tránh quét bỏ hàng chục nghìn dòng</td></tr></table>
    say: Ba hàng trên bảng tóm tắt ba bất biến kỹ thuật bắt buộc của dự án. Hàm so sánh chữ ký theo thời gian hằng ngăn chặn
      tấn công dò từng ký tự dựa vào độ trễ phản hồi. Ràng buộc duy nhất trên khoá khử trùng bảo đảm dù mạng gửi lại bao nhiêu
      lần vẫn chỉ một giao dịch được ghi xuống sổ. Điều kiện lớn hơn khoá cuối kết hợp giới hạn trang giúp mọi lượt truy vấn
      sau đọc đúng số dòng cần thiết. So sánh chữ ký theo thời gian hằng bảo vệ bí mật hệ thống trước kỹ thuật tấn công đo
      thời gian tinh vi qua mạng. Điều kiện lọc chặt theo khoá cuối cùng giúp tránh lỗi hiển thị lặp lại giao dịch cũ khi
      người dùng cuộn sang trang kế tiếp.
