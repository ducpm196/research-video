scenes:
- id: hook
  kind: hook
  title: 'Nghẽn mạng gửi lại 5 lần: làm sao chỉ trừ tiền đúng 1 lần?'
  checks:
  - alg.prj_idem_dedup([('k1',400),('k2',500),('k1',400),('k3',300),('k2',500)]) == (3, 1200)
  steps:
  - show: '<div class=''box key''><p>Trên mạng di động không ổn định, ứng dụng khách tự động thử lại cùng một yêu
      cầu chuyển tiền nhiều lần khi chưa kịp nhận phản hồi.</p><p>Ví dụ chuẩn: nhận 5 yêu cầu trong đó 2 yêu cầu
      trùng khoá khử trùng → hệ thống chỉ thực hiện đúng <b>3 giao dịch thật</b> (tổng <b>1 200</b>, không phải
      2 000).</p></div>'
    say: Chào bạn đến với dự án tổng hợp Chặng 3. Khi mạng di động chập chờn khiến ứng dụng gửi lại một lệnh chuyển
      tiền nhiều lần liên tiếp, rủi ro trừ tiền lặp xảy ra ngay. Nếu thiếu khoá khử trùng, cổng thanh toán sẽ trừ
      tiền oan nhiều lần của khách hàng. Đồng thời nếu trang lịch sử giao dịch dùng cách bỏ qua dòng tuần tự khi
      tra cứu bảng trăm nghìn bản ghi, máy chủ cơ sở dữ liệu sẽ chậm rõ rệt. Hôm nay ta ghép xác thực thẻ truy cập,
      bảng khử trùng bền vững và phân trang con trỏ vào cùng một cổng bảo mật.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
