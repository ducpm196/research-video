- id: practice
  kind: practice
  title: Tự cài đặt dự án và chấm tự động 100 điểm
  lab: labs/PRJ/L02
  steps:
  - show: <div class='box key'><p><b>Dự án L02 (thang 100 điểm theo <code>labs/PRJ/SPEC.md</code>):</b> mở đề tại
      <code>labs/PRJ/L02/de.md</code>, cài đặt đầy đủ bất biến, xử lý biên và chấm tự động bằng lệnh:</p><p><code>bash
      labs/cham.sh PRJ L02 duong_dan/bai_cua_ban.py</code></p></div>
    say: Bây giờ đến phần bạn tự hoàn thiện mã dự án để chấm điểm tự động theo thang một trăm điểm chuẩn. Bạn mở
      tệp đề bài, đọc kỹ dữ liệu mẫu và chạy trình chấm để đối chiếu từng dòng kết quả. Hãy bấm tạm dừng và tự triển
      khai trước.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp 100% (3 dòng)</b></p><div class="code"><div>jwt_valid=1</div><div>executed=3
      total_amount=1200</div><div>cursor_page=991,992,993</div></div>
    say: Màn hình hiện đầy đủ các dòng kết quả đầu ra mà dự án của bạn phải xuất ra khớp từng ký tự.
    clear: true
- id: recap
  kind: recap
  title: Tổng kết kiến trúc và bất biến dự án
  steps:
  - show: <div class='chain'><span class='n'>JWT HMAC + exp</span><span class='a'>→</span><span class='n'>UNIQUE(idem_key)
      DB</span><span class='a'>→</span><span class='n'>Phân trang con trỏ O(log N)</span></div>
    say: Tổng kết kiến trúc cổng tích hợp an toàn của Chặng 3. Chặn giả mạo bằng chữ ký chuẩn ở cửa vào, khử trùng
      bền vững ngay trong cơ sở dữ liệu, và bảo vệ hiệu năng bằng phân trang con trỏ.
    focus:
    - '1.1'
    - '1.2'
    clear: true
  - show: <div class='box ok'><b>Bài sau (bài 3):</b> Tình huống Chặng 4 — Đối soát ba bên và bảo vệ thiết kế phỏng
      vấn</div>
    say: Dự án tiếp theo ở bài 3 tổng hợp trọn vẹn chặng học kế tiếp. Hẹn gặp bạn ở bài sau.
    clear: true
    forward_ref: true
