objectives:
- Kiểm tra cấu trúc thẻ truy cập JWT (hạn dùng, chữ ký HMAC) trước khi nhận yêu cầu
- Cài đặt bảng khử trùng theo Idempotency-Key bảo đảm gửi lại 10 lần chỉ trừ tiền 1 lần
- Đo chi phí phân trang theo con trỏ (keyset) so với OFFSET ở mốc 100 000 dòng
scenes:
- id: hook
  kind: hook
  title: 'Nghẽn mạng gửi lại 5 lần: làm sao chỉ trừ tiền đúng 1 lần?'
  checks:
  - alg.prj_idem_dedup([('k1',400),('k2',500),('k1',400),('k3',300),('k1',400)]) == (3, 1200)
  steps:
  - show: '<div class=''box key''><p>Trên mạng di động chập chờn, ứng dụng khách tự động gửi lại một lệnh chuyển tiền nhiều
      lần khi chưa kịp nhận phản hồi.</p><p>Ví dụ chuẩn: nhận 5 yêu cầu trong đó có 2 yêu cầu trùng khoá khử trùng → hệ thống
      chỉ thực hiện đúng <b>3 giao dịch thật</b> (tổng tiền <b>1 200</b>, không phải 2 000).</p></div>'
    say: Chào bạn đến với dự án tổng hợp Chặng 3. Khi mạng di động chập chờn khiến ứng dụng gửi lại một lệnh chuyển tiền nhiều
      lần liên tiếp, rủi ro trừ tiền lặp xảy ra ngay lập tức. Nếu thiếu khoá khử trùng lưu bền vững, cổng thanh toán sẽ trừ
      tiền oan nhiều lần của khách hàng. Nếu mở cửa cho thẻ hết hạn hoặc sai chữ ký đi vào lõi xử lý, dữ liệu sổ cái có nguy
      cơ bị giả mạo. Hôm nay ta kết hợp xác thực chữ ký HMAC, bảng khử trùng bền vững và phân trang theo con trỏ vào một cổng
      tích hợp hoàn chỉnh. Một cổng tích hợp thực thụ phải bảo vệ lõi chuyển khoản bên trong trước cả thẻ giả mạo lẫn mạng
      chập chờn gửi lặp. Ba cơ chế xác thực, khử trùng và phân trang con trỏ phối hợp chặt chẽ tạo nên một cổng API ổn định
      dài lâu.
