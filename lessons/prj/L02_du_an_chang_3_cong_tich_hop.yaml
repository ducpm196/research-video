- id: formula
  kind: formula
  title: Bất biến khử trùng lũy đẳng và chi phí phân trang
  checks:
  - alg.prj_idem_dedup([('k1',400),('k2',500),('k1',400),('k3',300),('k2',500)]) == (3, 1200)
  steps:
  - show: '<div class=''box key''><p>Nhận $5$ yêu cầu: <code>(k1: 400), (k2: 500), (k1: 400), (k3: 300), (k2: 500)</code>.</p><p>Khi
      khử trùng theo <code>UNIQUE(idem_key)</code>: chỉ thực hiện 3 khoá duy nhất <code>k1, k2, k3</code> → tổng
      tiền = 400 + 500 + 300 = <b>1 200</b> (không phải 2 000).</p><p>Phân trang: <code>OFFSET 99 980</code> phải
      đọc bỏ <b>99 980</b> dòng thừa, còn con trỏ đọc đúng <b>20</b> dòng.</p></div>'
    say: Vì khoá khử trùng chặn lặp ngay tại tầng lưu trữ nên số giao dịch thật rút gọn từ năm xuống ba. Nếu thiếu
      bảng khoá duy nhất, tổng tiền trừ lố từ một nghìn hai trăm lên tới hai nghìn khi hai yêu cầu lặp lại đi qua
      cổng. Đồng thời truy vấn phân trang ở cuối bảng một trăm nghìn dòng tiết kiệm hàng chục nghìn phép đọc thừa
      nhờ dịch chuyển bằng con trỏ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: kiểm JWT HMAC, khử trùng 5 yêu cầu còn 3, và phân trang con trỏ'
  checks:
  - 400 + 500 + 300 == 1200
  steps:
  - show: <table class='t'><tr><th>ký hiệu / kỹ thuật</th><th>vai trò trong dự án</th></tr><tr><td><code>hmac.compare_digest(sig,
      exp)</code></td><td>So sánh chữ ký theo thời gian hằng để chống dò tim theo độ trễ</td></tr><tr><td><code>INSERT
      OR IGNORE INTO idem</code></td><td>Chỉ cho phép chèn lần đầu của khoá; mọi lần thử lại nhận kết quả cũ</td></tr></table>
    say: Giải mã hai hàm chuẩn bảo mật và cơ chế khử trùng lưu bền vững dùng trong đoạn mã.
    clear: true
  - show: '<p><b>Xác thực chữ ký JWT HMAC-SHA256 và khử trùng 5 yêu cầu thành 3 giao dịch (1 200)</b></p><div class="code"><div>import
      hmac, hashlib, sqlite3</div><div>sec, msg = b''k_demo'', b''h.p''</div><div>sig = hmac.new(sec, msg, hashlib.sha256).hexdigest()</div><div>jwt_ok
      = hmac.compare_digest(sig, hmac.new(sec, msg, hashlib.sha256).hexdigest())</div><div>db = sqlite3.connect('':memory:'')</div><div>db.execute(''CREATE
      TABLE idem(k TEXT PRIMARY KEY, amt INT)'')</div><div>reqs = [(''k1'',400),(''k2'',500),(''k1'',400),(''k3'',300),(''k2'',500)]</div><div>for
      k, a in reqs: db.execute(''INSERT OR IGNORE INTO idem VALUES(?,?)'', (k, a))</div><div>cnt, tot = db.execute(''SELECT
      COUNT(*), SUM(amt) FROM idem'').fetchone()</div><div>print(f''jwt_ok={jwt_ok} executed={cnt} total={tot}'')</div></div>'
    say: Đoạn mã cài đặt hàm kiểm chữ ký chuẩn bảo mật cho thẻ truy cập ở cửa vào. Sau đó hệ thống đưa năm yêu cầu
      gồm hai khoá trùng qua bảng khử trùng trong cơ sở dữ liệu. Nhờ ràng buộc khoá chính duy nhất, hai lượt thử
      lại không bao giờ ghi thêm dòng tiền thứ hai.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>jwt_ok=True executed=3 total=1200</div></div>
    say: Đầu ra chạy thật xác nhận thẻ hợp lệ qua cửa, năm yêu cầu chỉ sinh đúng ba giao dịch thật và tổng tiền
      giữ chính xác một nghìn hai trăm đồng.
    clear: true
- id: check
  kind: check
  title: Đối chứng kết quả phân trang theo con trỏ với OFFSET truyền thống
  checks:
  - 991 + 992 + 993 == 2976
  steps:
  - show: <p><b>Xác nhận phân trang keyset id > 990 trả đúng trang như OFFSET 990</b></p><div class="code"><div>import
      sqlite3</div><div>db = sqlite3.connect(':memory:')</div><div>db.execute('CREATE TABLE log(id INTEGER PRIMARY
      KEY, v INT)')</div><div>db.executemany('INSERT INTO log(v) VALUES(?)', [(i,) for i in range(1, 1001)])</div><div>p_off
      = [r[0] for r in db.execute('SELECT id FROM log ORDER BY id LIMIT 3 OFFSET 990')]</div><div>p_cur = [r[0]
      for r in db.execute('SELECT id FROM log WHERE id &gt; 990 ORDER BY id LIMIT 3')]</div><div>print(f'same_page={p_off
      == p_cur} ids={p_cur}')</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tạo bảng một nghìn dòng để so hai cách phân trang ở vị trí chín trăm chín
      mươi mốt. Hai truy vấn trả về cùng kết quả vì chỉ khác nhau về chi phí tìm kiếm.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>same_page=True ids=[991, 992, 993]</div></div>
    say: Đầu ra xác nhận hai phương pháp khớp nhau tuyệt đối vì truy vấn con trỏ đi thẳng theo chỉ mục mà không
      cần đếm bỏ chín trăm chín mươi dòng đầu.
    clear: true
- id: quymo
  kind: example
  title: Đo chi phí phân trang OFFSET vs Keyset qua 3 cỡ bảng
  checks:
  - 100_000 // 20 == 5000
  steps:
  - show: <table class='t'><tr><th>vị trí trang cần đọc (lấy 20 dòng)</th><th>OFFSET (đếm bỏ từ đầu)</th><th>Keyset
      (WHERE id > last_id LIMIT 20)</th></tr><tr><td>Trang 1 (vị trí 0)</td><td>Quét 20 dòng</td><td>Quét 20 dòng
      (~0,1 ms)</td></tr><tr><td>Trang 500 (vị trí 10 000)</td><td>Đọc bỏ 10 000 + lấy 20 dòng</td><td>Tìm thẳng
      chỉ mục + 20 dòng (~0,1 ms)</td></tr><tr><td>Trang 5 000 (vị trí 100 000)</td><td>Đọc bỏ 100 000 dòng thừa
      (~50 ms+)</td><td>Vẫn chỉ đọc đúng 20 dòng (~0,2 ms)</td></tr></table>
    say: Bảng quy mô giải thích vì sao hệ thống lớn bỏ hẳn cách phân trang đếm bỏ từ đầu bảng. Ở vị trí một trăm
      nghìn dòng, cách cũ buộc cơ sở dữ liệu đọc qua rồi vứt bỏ sạch một trăm nghìn bản ghi trước khi trả hai mươi
      dòng cần thiết. Ngược lại truy vấn theo con trỏ nhảy thẳng trên cây chỉ mục nên thời gian gần như không đổi
      bất kể trang sâu đến đâu.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm nặng ở đồ án thực tế
  steps:
  - show: '<table class=''t''><tr><th>lỗi mất điểm phổ biến khi nộp dự án</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1 (-30đ): Lưu tập khoá <code>Idempotency-Key</code> trong từ điển RAM Python.</b> Khi tiến trình khởi động
      lại, toàn bộ khoá biến mất làm yêu cầu thử lại trừ tiền lần nữa.<br><b>Lỗi 2 (-20đ): Tin nội dung phần payload
      JWT khi chưa kiểm chữ ký hay hạn <code>exp</code>.</b> Bất kỳ ai cũng tự sửa số tài khoản nhận tiền được.<br><b>Lỗi
      3 (-10đ): Phân trang dùng <code>OFFSET</code> sâu hàng trăm nghìn dòng.</b> Khi người dùng hoặc bot quét trang
      cuối sẽ làm nghẽn CPU cơ sở dữ liệu.</div></td></tr></table>'
    say: Ba sai lầm làm mất điểm lớn nhất ở dự án Chặng 3 cần tuyệt đối tránh. Thứ nhất là cất khoá khử trùng trong
      bộ nhớ tạm để đến lúc máy khởi động lại thì mất sạch dấu vết. Thứ hai là đọc thẳng phần thân thẻ truy cập
      mà bỏ qua bước xác minh chữ ký và thời hạn. Thứ ba là giữ phân trang đếm bỏ ở các trang cuối gây treo truy
      vấn khi bảng phình to.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
