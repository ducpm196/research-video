      trang con trỏ theo khoá cuối</td><td>Duyệt lịch sử 100 000 dòng ở độ phức tạp ổn định O(log N)</td></tr></table>
    say: Dự án Chặng 3 nối thẳng ba cơ chế cốt lõi của một cổng tích hợp ngân hàng vào một đường ống chạy thật. Mảnh ghép
      thứ nhất kiểm tra chữ ký hàm băm và thời hạn của thẻ truy cập ở ngay cửa vào. Mảnh ghép thứ hai dùng bảng khoá duy nhất
      dưới cơ sở dữ liệu để biến năm lần thử lại thành ba giao dịch thật. Mảnh ghép thứ ba thay cách bỏ qua dòng tuần tự bằng
      phân trang con trỏ nhảy thẳng trên chỉ mục. Sự kết hợp ba chốt ngăn chặn từ ngoài vào trong giúp lõi giao dịch chỉ phải
      xử lý những yêu cầu hợp lệ và duy nhất. Phân trang theo con trỏ giúp trải nghiệm tra cứu lịch sử tài khoản mượt mà dù
      bảng dữ liệu đã tăng lên hàng triệu dòng.
