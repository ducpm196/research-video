scenes:
- id: hook
  kind: hook
  title: Điều khiển PID & cây Merkle toàn vẹn
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: <div class='box key'><p>Với hai tác vụ tuần hoàn (chu kỳ T, thời lượng C) là <code>P1=(10,3), P2=(20,5)</code>,
      tổng sử dụng CPU là <code>0,30 + 0,25 = <b>0,55</b></code> an toàn dưới biên Liu–Layland <code>0,828</code>;
      đồng thời băm <b>4 lá</b> thành gốc Merkle SHA-256 bảo vệ sổ cái.</p></div>
    say: Chào bạn đến với dự án cuối cùng khép lại trọn vẹn mười một chặng học của chương trình. Trong xe tự hành
      hoặc hệ nhúng điều khiển công nghiệp, hai yêu cầu sống còn là tác vụ phải đáp ứng kịp hạn thời gian thực và
      vòng phản hồi không được vọt lố. Ở tầng sổ cái phân tán, hàng nghìn giao dịch phải được rút gọn thành một
      gốc băm bất biến duy nhất. Hôm nay ta cài trọn bộ kiểm lập lịch thời gian thực, vòng điều khiển bám đích và
      cây băm Merkle SHA hai trăm năm mươi sáu.
    clear: true
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Toán chuyển động
      & điều khiển PID (RBM/ROB)</td><td>Tỉ lệ Kp nhân sai số e = target - x kéo hệ bám đích (rút gọn từ PID)</td></tr><tr><td>Lập
      lịch thời gian thực RMS (ESY)</td><td>Kiểm tra hệ số sử dụng CPU nhỏ hơn biên Liu-Layland</td></tr><tr><td>Cấu
      trúc băm chuỗi khối & cây Merkle (BCH)</td><td>Gộp cặp băm theo cây nhị phân để chứng minh toàn vẹn O(log
      N)</td></tr></table>
    say: Dự án chốt Chặng 11 hợp nhất ba lĩnh vực chuyên ngành từ robot tự hành, hệ nhúng tới công nghệ chuỗi khối.
      Thứ nhất là vòng điều khiển phản hồi dùng sai số để điều chỉnh cơ cấu chấp hành bám dần về mục tiêu. Thứ hai
      là kiểm biên lập lịch đơn điệu theo tần suất bảo đảm tác vụ thời gian thực luôn kịp hạn chót. Thứ ba là xây
      dựng gốc cây băm Merkle kiểm chứng mọi sửa đổi dữ liệu trong lô.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật dự án
  steps:
  - show: <table class='t'><tr><th>kỹ thuật / hàm cốt lõi</th><th>vai trò cài đặt</th></tr><tr><td><code>U = sum(C_i
      / T_i)</code></td><td>Hệ số sử dụng CPU của tập tác vụ tuần hoàn thời gian thực</td></tr><tr><td><code>Kp
      * (target - x)</code></td><td>Khâu khuếch đại tỉ lệ thu hẹp dần khoảng cách tới đích</td></tr><tr><td><code>root
      = H(n0 + n1)</code></td><td>Nút gốc Merkle kết tinh toàn vẹn của cả cây giao dịch</td></tr></table>
    say: Bảng ký hiệu giải thích ba công thức cốt lõi trước khi lập trình thật. Chữ U là tổng tỉ trọng thời gian
      chạy trên chu kỳ của các tác vụ nhúng. Hệ số Kp nhân sai số hiện tại tạo tín hiệu kéo hệ thống về điểm đặt.
      Và nút gốc Merkle lưu dấu vân tay mật mã của toàn bộ các lá phía dưới.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Luồng xử lý tổng thể
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Vòng kín PID</text><text x="165.0" y="102" font-size="15" text-anchor="middle"
      fill="#475569">Giảm sai số về 0</text><line x1="290" y1="80" x2="350" y2="80" stroke="#475569" stroke-width="2"/><polygon
      points="350,80 342.0,85.0 342.0,75.0" fill="#475569"/><text x="320" y="72" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">bước 1</text><rect x="350" y="35" width="250" height="90" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="475.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Lập lịch RMS</text><text x="475.0" y="102" font-size="15" text-anchor="middle" fill="#475569">U
      &lt;= N*(2^(1/N)-1)</text><line x1="600" y1="80" x2="660" y2="80" stroke="#475569" stroke-width="2"/><polygon
      points="660,80 652.0,85.0 652.0,75.0" fill="#475569"/><text x="630" y="72" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">bước 2</text><rect x="660" y="35" width="260" height="90" rx="10" fill="#fef3c7"
      stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Cây Merkle 4 lá</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Đổi
      1 lá → đổi gốc</text></svg></div>
    say: Sơ đồ dự án tổng hợp ba mô-đun chạy nối tiếp bảo đảm cả điều khiển lẫn toàn vẹn dữ liệu. Bộ điều khiển
      vòng kín thu hẹp sai số từng bước tiến về giá trị đặt. Khối lập lịch kiểm hệ số sử dụng dưới ngưỡng tám mươi
      hai phẩy tám phần trăm. Còn cây băm Merkle băm từng cặp giao dịch lên nút gốc duy nhất.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: <div class='box key'><p><b>1. Biên Liu–Layland 2 tác vụ:</b> <code>U = C1/T1 + C2/T2 &lt;= 2*(2^(1/2)
      - 1) ≈ <b>0,828</b></code>.</p><p><b>2. Gốc Merkle:</b> <code>H(H(h0 + h1) + H(h2 + h3))</code> đổi toàn bộ
      gốc khi sửa 1 bit lá.</p></div>
    say: Hai công thức nền tảng quyết định tính an toàn cho toàn dự án cuối này. Với hai tác vụ thời gian thực ưu
      tiên cố định, tổng tỉ lệ chiếm dụng bộ xử lý nhỏ hơn không phẩy tám hai tám bảo đảm mọi lần chạy đều kịp hạn
      chót. Còn gốc cây Merkle ghép băm nhị phân từ lá lên đỉnh giúp một thay đổi một bit ở bất kỳ giao dịch nào
      cũng làm gốc biến đổi hoàn toàn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import hashlib</div><div>h = lambda b:
      hashlib.sha256(b).hexdigest()</div><div>leaves = [h(x.encode()) for x in (''tx0'',''tx1'',''tx2'',''tx3'')]</div><div>n0,
      n1 = h((leaves[0]+leaves[1]).encode()), h((leaves[2]+leaves[3]).encode())</div><div>root = h((n0 + n1).encode())</div><div>u
      = 3/10 + 5/20; bound = 2 * (2**0.5 - 1)</div><div>print(f''u={u:.2f} bound={bound:.3f} schedulable={int(u
      &lt;= bound)}'')</div><div>print(f''merkle_hex_len={len(root)}'')</div></div>'
    say: Đoạn mã đầu tiên băm bốn giao dịch thành bốn nút lá rồi ghép cặp tính hai nút giữa và một nút gốc duy nhất.
      Đồng thời chương trình tính tổng sử dụng CPU là không phẩy năm lăm để đối chiếu ngay với biên an toàn cho
      hai tác vụ chia sẻ một bộ xử lý.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>u=0.55 bound=0.828 schedulable=1</div><div>merkle_hex_len=64</div></div>
    say: Đầu ra chạy thật chứng nhận tập tác vụ lập lịch được hoàn toàn vì năm mươi lăm phần trăm nằm sâu dưới ngưỡng
      tám mươi hai phẩy tám phần trăm. Gốc băm đạt chuẩn sáu mươi bốn ký tự thập lục phân.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>x, tgt = 0.0, 10.0</div><div>for _ in range(5):
      x += 0.5 * (tgt - x)</div><div>print(f''after_5steps={x:.3f} err={tgt - x:.3f}'')</div></div>'
    say: Ở phép kiểm chứng thứ hai, ta mô phỏng năm bước điều khiển vòng kín với hệ số khuếch đại một nửa bắt đầu
      từ không hướng tới mười. Sau mỗi nhịp, sai số giảm còn một nửa của bước trước đó nên tiệm cận nhanh về mục
      tiêu.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>after_5steps=9.688 err=0.312</div></div>
    say: Kết quả đạt chín phẩy sáu tám tám với sai số không phẩy ba một hai. Đây là giá trị làm tròn ba chữ số từ
      chín phẩy sáu tám bảy năm và không phẩy ba một hai năm theo quy tắc số chẵn. Đường bám mượt mà này xác nhận
      vòng điều khiển ổn định không bị vọt lố.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>4
      giao dịch</td><td>2 bước băm chiều cao</td><td>Chứng minh dài 2 băm</td></tr><tr><td>1 024 giao dịch</td><td>10
      bước băm chiều cao</td><td>Chứng minh dài 10 băm</td></tr><tr><td>1 048 576 giao dịch</td><td>20 bước băm
      chiều cao</td><td>Kiểm chứng tức thì < 0,1 ms</td></tr></table>
    say: Bảng quy mô giải thích sức mạnh nén bằng chứng của cây Merkle trên sổ cái lớn. Ngay cả khi một khối chứa
      hơn một triệu giao dịch, chiều cao cây chỉ đạt đúng hai mươi tầng nên đường kiểm chứng chỉ gồm hai mươi giá
      trị băm. Nhờ vậy thiết bị nhúng tài nguyên nhỏ cũng xác minh được giao dịch trong tích tắc.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 (-30đ):</b> Hệ số khuếch đại P quá lớn làm hệ robot dao động vọt lố mất ổn định.<br><b>Lỗi 2 (-20đ):</b>
      Xếp tác vụ tuần hoàn vượt biên Liu–Layland mà không mô phỏng thử điểm tới hạn.<br><b>Lỗi 3 (-10đ):</b> Nối
      sai thứ tự cặp con <code>h1 + h0</code> làm sai gốc Merkle.</div></td></tr></table>
    say: Ba lỗi kỹ thuật sau dễ làm dự án chuyên ngành Chặng 11 mất điểm nặng. Đầu tiên là chỉnh hệ số khuếch đại
      quá lớn khiến bộ điều khiển bật vượt mục tiêu và dao động mãi không tắt. Thứ hai là xếp thêm tác vụ nhúng
      vượt ngưỡng biên thời gian thực làm hệ thống lỡ hạn chót. Thứ ba là ghép ngược thứ tự cặp con trái phải khi
      tính băm cha làm gốc cây sai lệch hoàn toàn.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
