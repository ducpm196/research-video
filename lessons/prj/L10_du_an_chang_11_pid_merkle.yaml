  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (dao
      động vọt lố):</b> Chọn hệ số khuếch đại <code>Kp</code> quá lớn làm vòng điều khiển vượt mục tiêu và mất ổn định.<br><b>Lỗi
      2 (trễ hạn thực):</b> Xếp tải tác vụ tuần hoàn vượt ngưỡng Liu–Layland mà không kiểm tra điểm tới hạn.<br><b>Lỗi 3 (ngược
      nhánh băm):</b> Nối sai thứ tự cặp con <code>h1 + h0</code> làm gốc cây Merkle mất tính xác định chuẩn.</div></td></tr></table>
    say: Hãy kiểm tra kỹ ba sai lầm chí mạng cuối cùng trước khi hoàn thiện dự án chốt hạ toàn chương trình. Lỗi thứ nhất
      là chọn hệ số khuếch đại tỉ lệ quá lớn làm tín hiệu điều khiển bật vượt xa điểm đặt và dao động mất kiểm soát. Lỗi thứ
      hai là đưa thêm tác vụ định kỳ vào bộ xử lý nhúng khi tổng hệ số chiếm dụng đã vượt qua biên an toàn gây trễ hạn xử
      lý. Lỗi thứ ba là đảo ngược thứ tự trái phải khi nối cặp nút con để tính băm cha trong cây Merkle. Đặc biệt chú ý công
      thức biên Liu-Layland thay đổi theo đúng số lượng tác vụ hiện có trong hệ thống chứ không dùng mãi hằng số hai tác vụ.
      Luôn ghép cặp băm theo đúng thứ tự trái trước phải ở từng tầng để nút gốc khớp tuyệt đối với chuẩn kiểm toán.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự cài đặt
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: <ol><li>Biên Liu–Layland của 2 tác vụ bằng khoảng bao nhiêu phần trăm?</li><li>Cây Merkle 1 024 giao dịch có bao
      nhiêu tầng băm từ lá lên gốc?</li></ol>
    say: Bạn dừng lại trả lời hai câu hỏi chốt hạ chương trình ngay dưới đây. Câu một, ngưỡng sử dụng tối đa Liu Layland cho
      hai tác vụ bằng khoảng mấy phần trăm? Câu hai, cây Merkle gồm một nghìn không trăm hai tư giao dịch có mấy tầng băm
      từ lá lên gốc? Bấm tạm dừng và trả lời. Hai câu hỏi cuối cùng tổng kết hai con số đặc trưng về biên lập lịch hai tác
      vụ và chiều cao cây băm nhị phân.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code>2*(sqrt(2) - 1) ≈ <b>82,8%</b></code>.</p></td></tr></table>
    say: 'Đáp án câu một: bằng hai nhân căn bậc hai của hai trừ một, xấp xỉ tám mươi hai phẩy tám phần trăm. Khoảng mười bảy
      phần trăm dung lượng còn lại là phần đệm bắt buộc để thuật toán ưu tiên cố định không bao giờ lỡ nhịp.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Vì <code>2^10 = 1 024</code> nên cây có đúng <code><b>10</b>
      tầng</code> từ lá lên gốc.</p></td></tr></table>
    say: 'Đáp án câu hai: do hai mũ mười bằng một nghìn không trăm hai mươi bốn nên chiều cao cây đúng mười tầng băm. Mỗi
      tầng gộp đôi làm giảm một nửa số nút nên độ cao chỉ tăng rất chậm theo hàm lô-ga-rít cơ số hai.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm dự án và chấm tự động
  lab: labs/PRJ/L10
  steps:
  - show: <table class='t'><tr><th>Thực hành PRJ:L10</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Kiểm
      tra điều kiện lập lịch RMS, chạy vòng lặp PID và băm cây Merkle 4 lá phát hiện sửa</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>tasks=2,10;6,20</code><br><code>kp=0.4
      target=15.0 steps=5</code><br><code>leaves=m0,m1,m2,m3 tamper_idx=1</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh PRJ L10 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Hãy bắt tay thực hiện dự án tổng hợp cuối cùng của lộ trình để kiểm chứng toàn diện kiến thức nhúng, điều khiển và
      mật mã. Mở tệp đề bài dự án mười xem quy cách dòng tham số động của lập lịch, vòng bám mục tiêu và chỉ số lá kiểm sửa.
      Sau đó bạn tự viết trọn vẹn chương trình Python vượt qua bộ chấm chuẩn cùng hai ca ẩn. Hãy chú ý áp dụng đúng công thức
      biên tổng quát theo số lượng tác vụ thực tế đọc từ luồng chuẩn của từng ca ẩn. Định dạng đủ ba chữ số thập phân ở giá
      trị vòng điều khiển sau bước cuối cùng và hai chữ số thập phân ở hệ số sử dụng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai PRJ:L10</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (lập lịch RMS)</b></td><td>Đọc <code>tasks</code> dạng <code>C,T;...</code>, tính <code>u = sum(c/t)</code> và so với
      biên tổng quát <code>n * (2**(1/n) - 1)</code></td></tr><tr><td><b>Bước 2 (vòng PID)</b></td><td>Lặp đúng <code>steps</code>
      lần phép cập nhật <code>x += kp * (target - x)</code> khởi đầu từ <code>x = 0.0</code></td></tr><tr><td><b>Bước 3 (Merkle)</b></td><td>Băm
      4 lá theo cặp <code>h(hs[0]+hs[1])</code> và <code>h(hs[2]+hs[3])</code>, thử đổi lá tại <code>tamper_idx</code> rồi
      đối chiếu gốc</td></tr></table>
    say: Gợi ý cài đặt dự án Chặng 11 hướng dẫn bạn tổng hợp ba khối tính toán vào cùng một kịch bản đọc dữ liệu từ luồng
      chuẩn. Ở khối lập lịch, số lượng tác vụ trong các ca ẩn có thể là ba tác vụ thay vì hai. Bạn phải tính biên an toàn
      theo đúng số tác vụ thực tế đọc vào. Ở khối điều khiển, bạn lặp đúng số bước được cấp để thu hẹp sai số tiến về mục
      tiêu. Cuối cùng bạn dựng gốc Merkle bốn lá cho danh sách ban đầu và danh sách bị gắn dấu sao tại vị trí chỉ định. Khi
      mô phỏng sửa một lá bất kỳ trong cây Merkle, gắn trực tiếp dấu sao theo đúng quy ước bài toán rồi tính lại toàn bộ cây
      lên nút gốc.
    clear: true
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>rms_u=0.50 schedulable=1</div><div>pid_step5=13.834</div><div>merkle_tamper_detected=1</div></div>
    say: Màn hình hiển thị các dòng đầu ra chuẩn tương ứng bộ dữ liệu mẫu. Chương trình của bạn cần đọc tham số từ luồng chuẩn
      để khớp đúng cả hai ca kiểm ẩn. Các ca ẩn kiểm thử tập hợp ba tác vụ vượt biên lập lịch cùng các hệ số khuếch đại và
      chỉ số lá sửa khác nhau.
    clear: true
    focus:
    - 1
    - 2
    - 2
