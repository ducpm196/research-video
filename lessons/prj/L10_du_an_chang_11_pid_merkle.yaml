      thời gian thực RMS (ESY)</td><td>Kiểm tra hệ số sử dụng CPU nhỏ hơn biên Liu-Layland</td></tr><tr><td>Cấu trúc băm chuỗi
      khối & cây Merkle (BCH)</td><td>Gộp cặp băm theo cây nhị phân để chứng minh toàn vẹn O(log N)</td></tr></table>
    say: Dự án chốt Chặng 11 hợp nhất ba lĩnh vực chuyên ngành từ robot tự hành, hệ nhúng tới công nghệ chuỗi khối. Thứ nhất
      là vòng điều khiển phản hồi dùng sai số để điều chỉnh cơ cấu chấp hành bám dần về mục tiêu. Thứ hai là kiểm biên lập
      lịch đơn điệu theo tần suất bảo đảm tác vụ thời gian thực luôn kịp hạn chót. Thứ ba là xây dựng gốc cây băm Merkle kiểm
      chứng mọi sửa đổi dữ liệu trong lô. Dự án chốt hạ Chặng 11 đòi hỏi ba hệ thống con từ robot tự hành, lập lịch thời gian
      thực và sổ cái mật mã phải đồng bộ chặt chẽ. Nếu vòng điều khiển phản hồi đặt hệ số khuếch đại quá lớn, cơ cấu chấp
      hành sẽ dao động vọt lố quanh điểm đặt. Nếu đặt tải tác vụ vượt quá biên Liu-Layland, nhân điều khiển có thể lỡ hạn
      chót đúng nhịp xử lý khẩn cấp. Ở tầng ghi nhận kiểm toán, cây băm Merkle rút gọn hàng triệu giao dịch về một mã băm
      gốc sáu mươi bốn ký tự nhưng phát hiện sai lệch dù chỉ một bít. Mỗi hệ thống con đều dựa trên những bất biến toán học
      chính xác không cho phép sai sót dù chỉ một nhịp hay một bít dữ liệu.
