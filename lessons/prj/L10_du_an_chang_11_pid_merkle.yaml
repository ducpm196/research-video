  title: Điều khiển PID & cây Merkle toàn vẹn
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: <div class='box key'><p>Với hai tác vụ tuần hoàn (thời lượng C, chu kỳ T) là <code>P1=(3,10), P2=(5,20)</code>,
      tổng sử dụng CPU là <code>0,30 + 0,25 = <b>0,55</b></code> an toàn dưới biên Liu–Layland <code>0,828</code>; đồng thời
      băm <b>4 lá</b> thành gốc Merkle SHA-256 bảo vệ sổ cái.</p></div>
    say: Chào bạn đến với dự án cuối cùng khép lại trọn vẹn mười một chặng học của chương trình. Trong xe tự hành hoặc hệ
      nhúng điều khiển công nghiệp, hai yêu cầu sống còn là tác vụ phải đáp ứng kịp hạn thời gian thực và vòng phản hồi không
      được vọt lố. Ở tầng sổ cái phân tán, hàng nghìn giao dịch phải được rút gọn thành một gốc băm bất biến duy nhất.
    clear: true
  - show: ''
    say: Hôm nay ta cài trọn bộ kiểm lập lịch thời gian thực, vòng điều khiển bám đích và cây băm Merkle SHA hai trăm năm mươi sáu.
      Kết hợp điều khiển vòng kín ổn định, lập lịch thời gian thực và cây băm toàn vẹn dữ liệu khép lại hành trình mười một
      chặng học. Bộ ba công cụ này đại diện cho những yêu cầu khắt khe nhất của hệ thống tự hành và sổ cái phân tán hiện đại.
