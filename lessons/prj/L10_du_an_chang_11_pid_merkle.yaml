- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: <div class='box key'><p><b>1. Biên Liu–Layland tổng quát:</b> <code>U &lt;= n*(2^(1/n) - 1)</code> (với 2 tác vụ là <b>0,828</b>; khi n lớn tiến về 0,693).</p><p><b>2.
      Điều khiển tỉ lệ PID &amp; gốc Merkle:</b> <code>x += Kp*(target - x)</code> thu hẹp sai số mỗi nhịp; <code>H(H(h0 + h1) + H(h2 + h3))</code> đổi gốc khi sửa 1 bit lá.</p></div>
    say: Hai công thức nền tảng quyết định tính an toàn cho toàn dự án cuối này. Với n tác vụ tuần hoàn, tổng chiếm dụng nhỏ hơn hoặc bằng biên n nhân hai mũ một phần n trừ một giúp luôn kịp hạn chót. Vòng điều khiển tỉ lệ cập nhật x cộng Kp nhân sai số giúp bám dần về đích. Gốc cây Merkle ghép băm nhị phân giúp sửa một bít lá cũng đổi toàn bộ gốc. Hai bất biến định lượng này quyết định sự an toàn của kiến trúc đa tầng cuối chương trình. Khi tổng tỉ trọng nhỏ hơn ngưỡng Liu-Layland tổng quát, không tác vụ ưu tiên thấp nào bị trễ hạn. Với hai tác vụ, ngưỡng giới hạn bằng không phẩy tám hai tám, và ở tầng mật mã ghép hai nhánh tuân theo thứ tự trái trước phải. Hiểu thấu đáo bất đẳng thức biên tổng quát cho số tác vụ tuỳ ý giúp bạn tránh quá tải vi điều khiển khi bổ sung cảm biến mới.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 3 / 10 + 5 / 20 == 0.55
  - round(2 * (2 ** 0.5 - 1), 3) == 0.828
  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import hashlib</div><div>def merkle(xs):</div><div>    hs
      = [hashlib.sha256(x.encode()).hexdigest() for x in xs]</div><div>    h = lambda s: hashlib.sha256(s.encode()).hexdigest()</div><div>    return
      h(h(hs[0] + hs[1]) + h(hs[2] + hs[3]))</div><div>xs = [''tx0'',''tx1'',''tx2'',''tx3'']</div><div>r1 = merkle(xs); r2
      = merkle([xs[0], xs[1], xs[2]+''*'', xs[3]])</div><div>u = 3/10 + 5/20; bound = 2 * (2**0.5 - 1)</div><div>print(f''u={u:.2f}
      bound={bound:.3f} schedulable={int(u &lt;= bound)}'')</div><div>print(f''merkle_hex_len={len(r1)} tamper={int(r1 != r2)}'')</div></div>'
    say: Đoạn mã đầu tiên băm bốn giao dịch thành bốn nút lá rồi ghép cặp thành nút gốc duy nhất và thử sửa một giao dịch để
      xác nhận gốc băm thay đổi tức thì. Đồng thời chương trình tính tổng sử dụng CPU là không phẩy năm lăm để đối chiếu ngay
      với biên an toàn cho hai tác vụ chia sẻ một bộ xử lý. Cây băm bốn lá phát hiện sửa một lá ngay lập tức với gốc sáu mươi bốn ký tự.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>u=0.55 bound=0.828 schedulable=1</div><div>merkle_hex_len=64
      tamper=1</div></div>
    say: Đầu ra chạy thật chứng nhận tập tác vụ lập lịch được hoàn toàn vì năm mươi lăm phần trăm nằm sâu dưới ngưỡng tám
      mươi hai phẩy tám phần trăm. Gốc băm đạt chuẩn sáu mươi bốn ký tự thập lục phân. Mức sử dụng năm mươi lăm phần trăm
      còn dư biên độ an toàn khá rộng trước giới hạn tám mươi hai phẩy tám phần trăm.
    focus:
    - 1
    - 2
    - 2
    clear: true
