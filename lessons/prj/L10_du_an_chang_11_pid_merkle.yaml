- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 2**10 == 1024
  - 2**20 == 1048576
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán &amp; đánh đổi</th><th>khuyến nghị kiến trúc</th></tr><tr><td>4 giao dịch</td><td>2
      bước băm (chiều cao 2)</td><td>Dựng cây O(N) vẫn nhẹ, chứng minh 2 băm</td></tr><tr><td>1 024 giao dịch</td><td>10 bước băm
      (chiều cao 10)</td><td>Biên RMS nhiều tác vụ tiến về 69,3% khi N lớn</td></tr><tr><td>1 048 576 giao dịch</td><td>20 bước
      băm (chiều cao 20)</td><td>Kiểm chứng O(log N) tức thì &lt; 0,1 ms nhưng dựng đủ cây cần O(N)</td></tr></table>
    say: Bảng quy mô giải thích sức mạnh nén bằng chứng của cây Merkle trên sổ cái lớn. Ngay cả khi một khối chứa hơn một
      triệu giao dịch, chiều cao cây chỉ đạt đúng hai mươi tầng nên đường kiểm chứng chỉ gồm hai mươi giá trị băm. Nhờ vậy
      thiết bị nhúng tài nguyên nhỏ cũng xác minh được giao dịch trong tích tắc. Bảng đối chiếu quy mô vận hành giải thích
      vì sao ba cơ chế này được dùng đồng thời trong xe tự hành và hệ thống tài chính lớn. Với cây Merkle hơn một triệu giao
      dịch, chiều cao cây chỉ tăng lên đúng hai mươi tầng. Nhờ đó đường kiểm chứng gọn nhẹ chỉ cần hai mươi giá trị băm. Trong
      khi đó kiểm tra tập tác vụ tuần hoàn dưới biên Liu-Layland bảo đảm lập lịch thời gian thực an toàn trước khi nạp xuống
      vi điều khiển nhúng. Cây băm với độ phức tạp lô-ga-rít cho phép xác minh nhanh một giao dịch bất kỳ giữa hàng triệu
      giao dịch chỉ bằng hai mươi nút dẫn chứng.
