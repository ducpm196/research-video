- id: formula
  kind: formula
  title: Công thức tối ưu chi phí đường đi và nghiệm đóng hồi quy
  checks:
  - alg.prj_dijkstra_cost([('A','D',15),('A','B',2),('B','C',3),('C','D',4)],'A','D') == 9
  steps:
  - show: <div class='box key'><p><b>1. Nới lỏng cạnh không âm:</b> nếu <code>d[u] + w(u,v) &lt; d[v]</code> thì cập nhật
      <code>d[v] = d[u] + w(u,v)</code> → <code>d[D] = min(15, 2+3+4) = <b>9</b></code>.</p><p><b>2. Hồi quy 1 biến y = wx
      + b:</b> với dữ liệu (1,2), (2,4), (3,6) → <code>w = 2, b = 0</code>, sai số <code>MSE = <b>0,0</b></code>.</p></div>
    say: Vì đồ thị không chứa cạnh âm nên bước nới lỏng luôn giữ đường đi tối ưu bằng chín tại đích D. Ở mỗi lần mở rộng nút
      trên hàng đợi ưu tiên, khoảng cách tới các nút lân cận chỉ có thể giảm dần nếu tìm thấy nhánh rẻ hơn. Nhờ tính chất
      đơn điệu đó, nút đã lấy ra với chi phí nhỏ nhất không bao giờ bị qua mặt sau này. Còn trên chuỗi điểm mẫu tỉ lệ thuận
      hoàn hảo, công thức đóng giải ra hệ số góc bằng hai với sai số bình phương trung bình bằng không. Điều kiện dừng nới
      lỏng khi trọng số luôn không âm là nền tảng toán học cho độ phức tạp V cộng E nhân lô-ga-rít V của giải thuật. Biểu thức giải nghiệm
      hồi quy trực tiếp trên cặp biến x và y tính xong trong đúng một lượt duyệt dữ liệu.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
