- id: quymo
  kind: example
  title: So sánh phức tạp tìm đường qua 3 cỡ mạng thanh toán
  checks:
  - 20 + 60 == 80
  steps:
  - show: <table class='t'><tr><th>cỡ mạng (số nút V, cạnh E)</th><th>thử mọi đường đi O(V!)</th><th>Dijkstra với heapq —
      O((V+E) log V)</th></tr><tr><td>4 nút, 4 cạnh</td><td>~24 phép (rất nhỏ)</td><td>~16 phép (tức thì)</td></tr><tr><td>20
      nút, 60 cạnh</td><td>> 2,4 × 10¹⁸ phép (treo vĩnh viễn)</td><td>~350 phép (< 0,1 mi-li-giây)</td></tr><tr><td>10 000
      nút, 40 000 cạnh</td><td>Không thể tính nổi</td><td>~660 000 phép (< 20 mi-li-giây)</td></tr></table>
    say: Bảng quy mô phơi bày lý do không ai dùng vét cạn đường đi trên mạng lưới thật. Chỉ cần mạng tăng lên hai mươi ngân
      hàng, số hoán vị đường đi đã vượt hai tỉ tỉ khiến mọi siêu máy tính bó tay. Ngược lại giải thuật hàng đợi ưu tiên giải
      quyết trọn mạng mười nghìn nút trong chưa đầy hai mươi mi-li-giây. Tại ngưỡng năm nghìn nút của các ca kiểm ẩn, độ phức
      tạp tuyến tính nhân lô-ga-rít hoàn tất bài toán trong vài chục mi-li-giây. Trong khi đó, thử vét cạn mọi đường đi ngay
      cả trên hai mươi nút đã vượt xa khả năng tính toán của mọi cụm máy chủ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm nặng ở đồ án thực tế
  steps:
  - show: '<table class=''t''><tr><th>lỗi kỹ thuật dễ sai ở đồ án thực tế</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1 — Chạy Dijkstra khi đồ thị có cạnh chiết khấu âm:</b> Nút đã chốt đường ngắn nhất vẫn có thể bị cạnh âm phía sau phá
      vỡ bất biến; phải kiểm và báo lỗi ngay.<br><b>Lỗi 2 — Quên kiểm dòng <code>if d &gt; dist[u]: continue</code> khi rút
      từ hàng đợi ưu tiên:</b> Nút lỗi thời bị duyệt lại nhiều lần làm chậm thuật toán.<br><b>Lỗi 3 — Chia cho tổng phương
      sai <code>sum((x - mx)**2) == 0</code> khi mọi điểm có cùng hoành độ x:</b> Phải bắt biên chia cho 0 rõ ràng.</div></td></tr></table>'
    say: Có ba cái bẫy toán học dễ làm sập hoặc sai kết quả của dự án chốt Chặng 5. Đầu tiên là thả lỏng trọng số âm đi qua
      giải thuật hàng đợi ưu tiên làm sai hoàn toàn đường ngắn nhất. Thứ hai là quên bỏ qua bản sao cũ trong hàng đợi ưu tiên
      gây lặp dư thừa ở các đồ thị dày. Thứ ba là quên kiểm mẫu số bằng không trong công thức hồi quy khi toàn bộ điểm dữ
      liệu cùng nằm trên một đường thẳng đứng. Ngoài kiểm tra cạnh âm và mẫu số hồi quy bằng không, hãy bảo đảm các đỉnh không
      nối tới được trả chi phí vô cực an toàn. Mỗi nhánh ngoại lệ phải xử lý rõ ràng theo đúng nhãn đầu ra chuẩn mà bộ chấm
      tự động mong đợi.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - (15 - 9) / 15 == 0.4
  steps:
  - show: '<ol><li>Từ A tới D: tuyến thẳng tốn 15, tuyến qua <code>A → B(2) → C(3) → D(4)</code> tốn bao nhiêu và giảm được
      bao nhiêu phần trăm phí?</li><li>Khi phát hiện một cạnh có trọng số bằng <code>-5</code>, thuật toán tìm đường nào bị
      vi phạm giả thiết và không được phép chạy?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, tuyến đường đi qua ba chặng hai, ba và bốn tốn tổng phí bao nhiêu và tiết kiệm
      được bao nhiêu phần trăm so với đường thẳng mười lăm? Câu hai, nếu đồ thị xuất hiện cạnh mang trọng số âm năm thì giải
      thuật nào mất tính đúng đắn? Bấm tạm dừng và trả lời. Hai câu hỏi kiểm tra trực giác tính tiết kiệm chi phí tuyến vòng
      và điều kiện biên trọng số âm.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Tốn <code>2 + 3 + 4 = <b>9</b></code>, giảm <code>(15
      - 9) / 15 = <b>40,0%</b></code> chi phí.</p></td></tr></table>
    say: 'Đáp án câu một: tổng phí đi vòng bằng chín nên giảm sáu trên mười lăm, tức tiết kiệm đúng bốn mươi phần trăm. Lợi
      ích bốn mươi phần trăm chứng tỏ bài toán tối ưu đường đi mang lại hiệu quả tài chính rõ rệt.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <b>Thuật toán Dijkstra</b> bị vi phạm giả thiết trọng
      số không âm nên không được phép dùng trực tiếp.</p></td></tr></table>
    say: 'Đáp án câu hai: giải thuật tìm đường ưu tiên có giả thiết trọng số không âm sẽ cho kết quả sai khi gặp cạnh âm.
      Nếu bài toán thực sự chứa cạnh âm, ta phải chuyển sang thuật toán khác hỗ trợ cạnh âm bằng duyệt nới lỏng nhiều vòng
      thay cho hàng đợi ưu tiên.'
    clear: true
