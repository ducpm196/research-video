- id: example
  kind: example
  title: 'Chạy thật: bộ giải Dijkstra với heapq và kiểm chặn cạnh âm + OLS'
  checks:
  - 2 + 3 + 4 == 9
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu / kỹ thuật</th><th>vai trò trong dự án</th></tr><tr><td><code>if any(w &lt;
      0 ...): raise</code></td><td>Từ chối sớm nếu đồ thị chứa trọng số âm làm sai kết quả thuật toán</td></tr><tr><td><code>heapq.heappop(pq)</code></td><td>Luôn
      rút nút có chi phí tích lũy nhỏ nhất ra khỏi hàng đợi ưu tiên</td></tr></table>'
    say: Giải thích hai chi tiết cài đặt quan trọng trong bộ giải đồ thị và ước lượng hồi quy. Dòng kiểm tra đầu hàm từ chối
      ngay đồ thị có cạnh âm thay vì trả về đường đi sai lệch, còn hàng đợi ưu tiên luôn giữ đúng thứ tự mở rộng nút rẻ nhất.
      Dòng bảo vệ trọng số âm không chỉ ngăn kết quả sai mà còn báo hiệu kịp thời lỗi dữ liệu đầu vào bất thường. Đồ thị bốn
      nút minh hoạ cấu trúc cơ bản trước khi mở rộng sang mạng lưới hàng nghìn điểm trung chuyển.
    clear: true
  - show: '<p><b>Tìm đường phí thấp nhất bằng heapq (chặn trọng số âm) trên đồ thị 4 ngân hàng</b></p><div class="code"><div>import
      heapq</div><div>def dijkstra(edges, src, dst):</div><div>    if any(w &lt; 0 for _, _, w in edges): raise ValueError(''negative
      weight'')</div><div>    g = {}</div><div>    for u, v, w in edges: g.setdefault(u, []).append((v, w))</div><div>    dist,
      pq = {src: 0}, [(0, src)]</div><div>    while pq:</div><div>        d, u = heapq.heappop(pq)</div><div>        if u
      == dst: return d</div><div>        if d &gt; dist.get(u, 10**18): continue</div><div>        for v, w in g.get(u, []):</div><div>            if
      d + w &lt; dist.get(v, 10**18): dist[v] = d + w; heapq.heappush(pq, (d + w, v))</div><div>try: dijkstra([(''A'',''B'',-1)], ''A'', ''B''); assert False</div><div>except ValueError: pass</div><div>edges = [(''A'',''D'',15),(''A'',''B'',2),(''B'',''C'',3),(''C'',''D'',4)]</div><div>print(f''min_cost={dijkstra(edges,
      "A", "D")} direct=15'')</div></div>'
    say: Đoạn mã cài đặt hàm tìm đường đi ngắn nhất có kiểm tra ngay trọng số âm ở dòng đầu tiên trước khi chạy hàng đợi ưu
      tiên. Dòng bỏ qua bản sao cũ bảo đảm mỗi nút chỉ bung cạnh đi ra tối đa một lần khi nhận được khoảng cách tốt nhất.
      Thử nghiệm trên đồ thị bốn ngân hàng trung gian rút ra chi phí nhỏ nhất từ A sang D bằng chín thay vì mười lăm. Mỗi
      đỉnh lấy ra từ hàng đợi ưu tiên đã nắm giữ đường đi ngắn nhất cuối cùng nên không cần cập nhật lại lần nữa. Cơ chế bỏ
      qua cặp khoảng cách cũ giúp giữ cấu trúc hàng đợi gọn nhẹ ngay cả khi thêm nhiều cạnh thay thế rẻ hơn.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>min_cost=9 direct=15</div></div>
    say: Đầu ra chạy thật xác nhận chi phí thấp nhất tìm được bằng đúng chín, đồng thời phép kiểm định cạnh âm hoạt động chuẩn
      xác khi đưa đồ thị lỗi vào. Kết quả này chứng tỏ bộ giải xử lý đúng cả tuyến vòng lẫn chốt chặn an toàn. Kiểm thử đồng
      thời đường đi đạt chuẩn và trường hợp từ chối cạnh âm bảo vệ trọn vẹn cả nhánh thuận và nhánh lỗi.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: check
  kind: check
  title: Đối chứng hồi quy tuyến tính công thức đóng trên mẫu 4 điểm
  checks:
  - 2 * 4 + 1 == 9
  steps:
  - show: <p><b>Tính nghiệm tối ưu bình phương tối thiểu (w, b) và kiểm tra sai số MSE</b></p><div class="code"><div>pts =
      [(1, 3), (2, 5), (3, 7), (4, 9)]</div><div>mx = sum(x for x, _ in pts) / len(pts); my = sum(y for _, y in pts) / len(pts)</div><div>w
      = sum((x - mx) * (y - my) for x, y in pts) / sum((x - mx) ** 2 for x, _ in pts)</div><div>b = my - w * mx</div><div>mse
      = sum((w * x + b - y) ** 2 for x, y in pts) / len(pts)</div><div>print(f'w={w:.1f} b={b:.1f} mse={mse:.2f}')</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính hai tham số đường xu hướng trên bốn điểm mẫu vì công thức hiệp phương sai giải
      thẳng nghiệm toàn cục mà không cần lặp. Phương pháp này cho kết quả chính xác chỉ sau đúng một lượt quét dữ liệu để
      tính trung bình hoành độ và tung độ. Phép chia hiệp phương sai cho phương sai trục hoành cho ra chính xác độ dốc mà
      không cần thử dần từng bước học. Đừng quên kiểm tra phương sai trục hoành khác không trước khi chia để tránh ngoại lệ
      trên dữ liệu thẳng đứng.
    clear: true
    focus:
    - 1
    - 2
    - 1
    - 2
