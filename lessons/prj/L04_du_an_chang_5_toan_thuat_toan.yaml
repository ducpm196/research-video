scenes:
- id: hook
  kind: hook
  title: Tuyến thẳng tốn 15 nghìn, đi vòng 2 trạm chỉ tốn 9 nghìn?
  checks:
  - alg.prj_dijkstra_cost([('A','D',15),('A','B',2),('B','C',3),('C','D',4)],'A','D') == 9
  steps:
  - show: <div class='box key'><p>Trên mạng lưới thanh toán 4 nút trung gian, tuyến trực tiếp <code>A → D</code> mất phí <b>15</b>,
      trong khi đi đường vòng <code>A → B → C → D</code> chỉ tốn <b>2 + 3 + 4 = 9</b> (rẻ hơn <b>40%</b>).</p><p>Đồng thời,
      từ dữ liệu chi phí giao dịch theo tải, ta khớp đường thẳng xu hướng tuyến tính bằng công thức đóng để dự báo chi phí
      ở tải lớn hơn.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 5 tổng hợp toàn bộ toán học và giải thuật. Khi chuyển dòng tiền qua nhiều ngân
      hàng trung gian, đường đi trực tiếp không phải lúc nào cũng là đường đi có chi phí thấp nhất. Đồng thời để dự báo tổng
      chi phí khi lưu lượng tăng gấp bội, ta cần mô hình hồi quy tuyến tính kiểm soát chặt sai số. Hôm nay ta cài đặt đồng
      thời thuật toán tìm đường ngắn nhất với trọng số không âm và bộ ước lượng hồi quy theo công thức toán đóng. Tối ưu định
      tuyến thanh toán kết hợp dự báo tải bằng hồi quy giúp ngân hàng tiết kiệm chi phí vận hành hằng ngày. Mọi giả thiết
      thuật toán đều phải kiểm chứng bằng ca thử biên thực tế trên luồng dữ liệu chuẩn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.1'
    - '1.2'
