- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import hashlib</div><div>h = lambda s: int(hashlib.sha256(s.encode()).hexdigest()[:8],
      16)</div><div>def own(n, k):</div><div>    r = sorted((h(f''n{i}#0''), i) for i in range(n))</div><div>    idx = sum(x[0]
      &lt;= h(f''k{k}'') for x in r) % n; return r[idx][1]</div><div>mv = sum(own(4, k) != own(5, k) for k in range(200))</div><div>print(f''moved_of_200={mv}
      lt60={int(mv &lt; 60)}'')</div></div>'
    say: Phép kiểm chứng thứ hai chạy thử hai trăm khoá qua hàm băm SHA hai trăm năm mươi sáu khi tăng từ bốn lên năm nút.
      Vì các nút nằm cố định trên vòng băm theo giá trị băm của chúng nên đa số khoá cũ vẫn trỏ về đúng nút ban đầu. Đặt các
      nút ảo phân bố đều trên vòng băm còn giúp giảm phương sai lệch tải giữa các máy chủ vật lý khi thêm máy mới.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>moved_of_200=47 lt60=1</div></div>
    say: Đầu ra kiểm chứng cho thấy số khoá bị dời nằm gọn dưới sáu mươi trên tổng số hai trăm khoá. Tỉ lệ này rất thấp do
      các khoá chỉ chuyển khi rơi vào cung mới của nút thứ năm. Tỉ lệ dịch chuyển khoảng hơn hai mươi phần trăm nhỏ hơn rất
      nhiều so với con số tám mươi phần trăm của phép chia lấy dư truyền thống.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: '<table class=''t''><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>4 nút phân
      tán</td><td>Băm mod: ~80% dời khi thêm nút 5</td><td>Băm nhất quán: ~20% dời</td></tr><tr><td>1 000 đơn/s + Outbox</td><td>Tối
      đa ~1 000 giao dịch SQL/s</td><td>Quét OUTBOX theo lô mỗi 50 ms</td></tr><tr><td>Dịch vụ đích chậm 5 s</td><td>Không
      có CB: hết sạch luồng</td><td>CB OPEN < 0,1 ms trả fallback ngay</td></tr></table>'
    say: Bảng quy mô tóm tắt giá trị kiến trúc của từng thành phần khi hệ thống mở rộng nhanh. Thay vì tái cân bằng gần như
      toàn bộ bộ nhớ đệm mỗi lần thêm máy, vòng băm giữ được tám mươi phần trăm khoá trúng ngay. Và cầu dao mở giúp giảm thời
      gian phản hồi lỗi từ năm giây xuống chưa tới một phần mười mi-li-giây. Quan sát bảng thông số quy mô vận hành cho thấy
      tác động cộng hưởng khi cả cụm máy tăng tải hoặc mở rộng khẩn cấp. Khi thêm nút thứ năm vào cụm bốn nút, vòng băm giữ
      được gần tám mươi phần trăm lượng khoá tại chỗ. Điều đó tránh cơn bão đọc tràn xuống cơ sở dữ liệu gốc. Quét bảng Outbox
      theo lô mỗi năm mươi mi-li-giây chịu tải ổn định hàng nghìn đơn mỗi giây. Khi dịch vụ đích chậm năm giây, cầu dao ở
      trạng thái mở cắt nhanh cuộc gọi lỗi dưới một phần mười mi-li-giây. Điều phối thông minh cả vòng băm lẫn cầu dao là
      chìa khoá vận hành các cụm dữ liệu lớn phục vụ hàng nghìn đơn hàng mỗi giây.
