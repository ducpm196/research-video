- id: hook
  kind: hook
  title: Đường ống Outbox, Băm nhất quán & Circuit Breaker
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: <div class='box key'><p>Ghi kép <code>orders + outbox</code> trong <b>1 giao dịch SQLite</b> không mất sự kiện,
      điều phối <b>1 000 khoá</b> với tỉ lệ dời dưới 25% khi thêm nút thứ 5, và chuyển trạng thái <code>CLOSED → OPEN</code>
      ngay sau <b>3 lỗi</b> liên tiếp.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 8 tổng hợp hệ phân tán, dữ liệu lớn và kiến trúc đám mây. Trong hệ thống nhiều
      dịch vụ, nếu lưu cơ sở dữ liệu xong rồi mới gọi gửi sự kiện qua mạng, sập nguồn ở giữa sẽ làm mất vĩnh viễn sự kiện.
      Đồng thời khi cụm bốn máy tăng thêm máy thứ năm, băm modulo ngây thơ đẩy tới tám mươi phần trăm khoá sang chỗ mới.
    clear: true
  - show: ''
    say: Hôm nay ta cài trọn vẹn Outbox nguyên tử trên SQLite, băm nhất quán và cầu dao ngắt mạch. Ba cơ chế Outbox nguyên tử,
      băm nhất quán và cầu dao tự ngắt là nền tảng để hệ thống phân tán chịu lỗi vững vàng. Khi ghép chúng vào cùng một luồng
      chạy thật trên Python, bạn chứng kiến rõ từng cơ chế cứu hệ thống khỏi mất tin và bão tải.
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Băm nhất quán & Quorum (DSY/SAR)</td><td>Chỉ
      di chuyển ~1/N khoá khi thêm nút phân vùng</td></tr><tr><td>Outbox & người tiêu thụ lũy đẳng (DEN/EVT)</td><td>Chặn
      mất sự kiện khi tiến trình sập giữa hai thao tác</td></tr><tr><td>Chịu lỗi Circuit Breaker (CLD)</td><td>Ngắt mạch khi
      dịch vụ đích lỗi liên tiếp để tránh sập dây chuyền</td></tr></table>
    say: Dự án Chặng 8 ghép ba cơ chế cốt lõi của kiến trúc sư hệ thống phân tán và dữ liệu lớn. Thứ nhất là mẫu Outbox ghi
      đơn hàng và sự kiện trong cùng giao dịch để bảo toàn dữ liệu khi sập tiến trình. Thứ hai là vòng băm nhất quán giữ cho
      phần lớn khoá ổn định chỗ khi mở rộng số nút phân vùng. Thứ ba là cầu dao tự ngắt để chặn đứng bão gọi lỗi vào dịch
      vụ hạ lưu đang quá tải. Trong kiến trúc dịch vụ phân tán nhiều nút và giao tiếp bất đồng bộ, bài toán khó nhất luôn
      xoay quanh trạng thái nửa vời khi lỗi xảy ra giữa chừng. Nếu máy chủ ghi đơn hàng vào cơ sở dữ liệu thành công rồi mới
      gọi mạng sang hàng đợi mà tiến trình bỗng sập nguồn, hệ thống mất sự kiện. Kết hợp mẫu Outbox cùng giao dịch SQLite,
      vòng băm nhất quán và cầu dao tự ngắt giải quyết đồng thời cả ba lớp rủi ro. Sự gắn kết đồng bộ giữa ba lớp phòng thủ
      này giải quyết đồng thời bài toán nhất quán dữ liệu, mở rộng cụm máy và bảo vệ hạ lưu.
