  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import sqlite3</div><div>c = sqlite3.connect('':memory:'')</div><div>c.execute(''CREATE
      TABLE ord(id INT)''); c.execute(''CREATE TABLE outb(id INT)'')</div><div>with c: c.execute(''INSERT INTO ord VALUES(1)'');
      c.execute(''INSERT INTO outb VALUES(1)'')</div><div>c.execute(''BEGIN''); c.execute(''INSERT INTO ord VALUES(2)'');
      c.execute(''INSERT INTO outb VALUES(2)''); c.rollback()</div><div>no = c.execute(''SELECT COUNT(*) FROM ord'').fetchone()[0]</div><div>nx
      = c.execute(''SELECT COUNT(*) FROM outb'').fetchone()[0]</div><div>fail_streak, state = 3, ''CLOSED''</div><div>if fail_streak
      &gt;= 3: state = ''OPEN''</div><div>print(f''outbox_match={int(no == nx)} cb_state={state}'')</div></div>'
    say: Đoạn mã cài đặt trực tiếp hai bảng đơn hàng và hộp thư đi trong cùng một cơ sở dữ liệu SQLite. Khi đơn một thành
      công, cả hai bảng cùng tăng lên một bản ghi nên luôn khớp nhau. Ở nhánh dưới, khi bộ đếm lỗi liên tiếp chạm ngưỡng ba
      lần, cầu dao lập tức chuyển sang trạng thái mở. Khi giao dịch sau bị hoàn tác chủ động, cả bảng đơn hàng lẫn bảng hộp
      thư đi đều quay lui sạch sẽ giữ nguyên số dòng bằng nhau.
