- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: <div class='box key'><p><b>1. Nguyên tử Outbox:</b> <code>COUNT(orders) == COUNT(outbox)</code> kể cả
      khi một giao dịch khác <code>ROLLBACK</code>.</p><p><b>2. Băm nhất quán:</b> thêm nút thứ 5 chỉ dời lý thuyết
      <code>1/5 = <b>20%</b></code> khoá thay vì <code>80%</code> của modulo.</p></div>
    say: Hai bất biến định lượng dẫn đường cho toàn bộ dự án Chặng 8 này. Bất biến đầu tiên bảo đảm mọi đơn hàng
      đã xác nhận đều có đúng một bản ghi tương ứng ở hàng đợi Outbox vì cùng chung một giao dịch. Bất biến thứ
      hai là khi thêm nút thứ năm vào vòng băm, tỉ lệ khoá bị chuyển vị trí tiến sát mức một phần năm tức hai mươi
      phần trăm.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import bisect, hashlib, sqlite3</div><div>c
      = sqlite3.connect('':memory:'')</div><div>c.execute(''CREATE TABLE ord(id INT)''); c.execute(''CREATE TABLE
      outb(id INT)'')</div><div>with c: c.execute(''INSERT INTO ord VALUES(1)''); c.execute(''INSERT INTO outb VALUES(1)'')</div><div>no
      = c.execute(''SELECT COUNT(*) FROM ord'').fetchone()[0]</div><div>nx = c.execute(''SELECT COUNT(*) FROM outb'').fetchone()[0]</div><div>fail_streak,
      state = 3, ''CLOSED''</div><div>if fail_streak &gt;= 3: state = ''OPEN''</div><div>print(f''outbox_match={int(no
      == nx)} cb_state={state}'')</div></div>'
    say: Đoạn mã cài đặt trực tiếp hai bảng đơn hàng và hộp thư đi trong cùng một cơ sở dữ liệu SQLite. Khi đơn
      một thành công, cả hai bảng cùng tăng lên một bản ghi nên luôn khớp nhau. Ở nhánh dưới, khi bộ đếm lỗi liên
      tiếp chạm ngưỡng ba lần, cầu dao lập tức chuyển sang trạng thái mở.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>outbox_match=1 cb_state=OPEN</div></div>
    say: Kết quả chạy thật chứng nhận cặp bảng khớp một trăm phần trăm và cầu dao đã tự mở đúng lúc. Nhờ vậy hệ
      thống không bao giờ làm rớt sự kiện hay đổ thêm tải vào dịch vụ đang hỏng.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import hashlib</div><div>h = lambda s: int(hashlib.sha256(s.encode()).hexdigest()[:8],
      16)</div><div>def own(n, k):</div><div>    r = sorted((h(f''n{i}#0''), i) for i in range(n))</div><div>    idx
      = sum(x[0] &lt;= h(f''k{k}'') for x in r) % n; return r[idx][1]</div><div>mv = sum(own(4, k) != own(5, k)
      for k in range(200))</div><div>print(f''moved_of_200={mv} lt60={int(mv &lt; 60)}'')</div></div>'
    say: Phép kiểm chứng thứ hai chạy thử hai trăm khoá qua hàm băm SHA hai trăm năm mươi sáu khi tăng từ bốn lên
      năm nút. Vì các nút nằm cố định trên vòng băm theo giá trị băm của chúng nên đa số khoá cũ vẫn trỏ về đúng
      nút ban đầu.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>moved_of_200=47 lt60=1</div></div>
    say: Đầu ra kiểm chứng cho thấy số khoá bị dời nằm gọn dưới sáu mươi trên tổng số hai trăm khoá. Tỉ lệ này rất
      thấp do các khoá chỉ chuyển khi rơi vào cung mới của nút thứ năm.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: '<table class=''t''><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>4
      nút phân tán</td><td>Băm mod: ~80% dời khi thêm nút 5</td><td>Băm nhất quán: ~20% dời</td></tr><tr><td>1 000
      đơn/s + Outbox</td><td>Tối đa ~1 000 giao dịch SQL/s</td><td>Quét OUTBOX theo lô mỗi 50 ms</td></tr><tr><td>Dịch
      vụ đích chậm 5 s</td><td>Không có CB: hết sạch luồng</td><td>CB OPEN < 0,1 ms trả fallback ngay</td></tr></table>'
    say: Bảng quy mô tóm tắt giá trị kiến trúc của từng thành phần khi hệ thống mở rộng nhanh. Thay vì tái cân bằng
      gần như toàn bộ bộ nhớ đệm mỗi lần thêm máy, vòng băm giữ được tám mươi phần trăm khoá trúng ngay. Và cầu
      dao mở giúp giảm thời gian phản hồi lỗi từ năm giây xuống chưa tới một phần mười mi-li-giây.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
