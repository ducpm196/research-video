- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (mất
      sự kiện):</b> Gửi sự kiện ở ngoài phạm vi giao dịch SQL gây lệch giữa bảng đơn hàng và hộp thư đi.<br><b>Lỗi 2 (lệch
      băm):</b> Dùng <code>hash(key)</code> dựng sẵn của Python có giá trị ngẫu nhiên theo phiên chạy làm sai định tuyến.<br><b>Lỗi
      3 (quên đặt lại fails):</b> Không gán <code>fails = 0</code> khi gặp tín hiệu thành công (<code>1</code>) làm các lỗi
      rời rạc cộng dồn thành mở nhầm <code>OPEN</code> (còn khi phục hồi ngoài thực tế dùng thêm <code>HALF_OPEN</code>).</div></td></tr></table>
    say: Hãy rà soát cẩn thận ba sai lầm kiến trúc dễ làm hệ thống phân tán sụp đổ trong thực tế sản xuất. Thứ nhất là tách
      việc phát sự kiện sang hàng đợi ra ngoài giao dịch cơ sở dữ liệu dẫn tới sai lệch trạng thái khi ứng dụng khởi động
      lại. Thứ hai là dùng hàm băm dựng sẵn của Python vốn sinh giá trị ngẫu nhiên theo phiên chạy thay cho SHA hai trăm năm
      mươi sáu tất định. Thứ ba là quên đặt lại bộ đếm lỗi về không khi cầu dao gặp tín hiệu thành công xen kẽ. Chú ý dùng
      biến trạng thái tường minh cho cầu dao và đếm đủ ngưỡng thất bại liên tiếp trước khi chuyển trạng thái mở. Cố định giá
      trị băm bằng thuật toán chuẩn thay vì hàm băm tích hợp ngẫu nhiên của tiến trình.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
