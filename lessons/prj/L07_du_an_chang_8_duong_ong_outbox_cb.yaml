      kiện ra hàng đợi bên ngoài giao dịch cơ sở dữ liệu dễ gây mất đồng bộ. Thứ hai là gọi hàm băm dựng sẵn của
      Python vốn sinh ngẫu nhiên mỗi lần khởi động tiến trình. Thứ ba là mở lại hoàn toàn lưu lượng về trạng thái
