- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: <div class='box key'><p><b>1. Nguyên tử Outbox:</b> <code>COUNT(orders) == COUNT(outbox)</code> kể cả khi một giao
      dịch khác <code>ROLLBACK</code>.</p><p><b>2. Băm nhất quán:</b> thêm nút thứ 5 chỉ dời lý thuyết <code>1/5 = <b>20%</b></code>
      khoá thay vì <code>80%</code> của modulo.</p></div>
    say: Hai bất biến định lượng dẫn đường cho toàn bộ dự án Chặng 8 này. Bất biến đầu tiên bảo đảm mọi đơn hàng đã xác nhận
      đều có đúng một bản ghi tương ứng ở hàng đợi Outbox vì cùng chung một giao dịch. Bất biến thứ hai là khi thêm nút thứ
      năm vào vòng băm, tỉ lệ khoá bị chuyển vị trí tiến sát mức một phần năm tức hai mươi phần trăm. Bất biến nguyên tử khẳng
      định mọi thao tác thành công hay hoàn tác đều phải áp dụng đồng bộ trên cả bảng đơn hàng lẫn bảng hộp thư đi. Nhờ vậy
      số bản ghi ở hai bảng luôn bằng nhau tuyệt đối trước và sau mọi sự cố hoàn tác. Ở tầng định tuyến phân vùng, vòng băm
      nhất quán giữ số khoá bị dời chỗ khi thêm một nút tiệm cận tỉ lệ nghịch tổng số nút mới. Ngoài ra bộ đếm lỗi của cầu
      dao sẽ tự thiết lập lại về không mỗi khi gặp tín hiệu thành công. Kết hợp ba quy tắc định lượng giúp kiến trúc sư tính
      toán trước tỉ lệ dời khoá và ngưỡng chịu lỗi của toàn hệ thống.
