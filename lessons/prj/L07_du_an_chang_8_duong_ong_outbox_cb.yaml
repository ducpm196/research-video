scenes:
- id: hook
  kind: hook
  title: Đường ống Outbox, Băm nhất quán & Circuit Breaker
  checks:
  - 100 // 5 == 20
  - 4 + 1 == 5
  steps:
  - show: <div class='box key'><p>Ghi kép <code>orders + outbox</code> trong <b>1 giao dịch SQLite</b> không mất
      sự kiện, điều phối <b>1 000 khoá</b> với tỉ lệ dời dưới 25% khi thêm nút thứ 5, và chuyển trạng thái <code>CLOSED
      → OPEN</code> ngay sau <b>3 lỗi</b> liên tiếp.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 8 tổng hợp hệ phân tán, dữ liệu lớn và kiến trúc đám mây. Trong hệ thống
      nhiều dịch vụ, nếu lưu cơ sở dữ liệu xong rồi mới gọi gửi sự kiện qua mạng, sập nguồn ở giữa sẽ làm mất vĩnh
      viễn sự kiện. Đồng thời khi cụm bốn máy tăng thêm máy thứ năm, băm modulo ngây thơ đẩy tới tám mươi phần trăm
      khoá sang chỗ mới. Hôm nay ta cài trọn vẹn Outbox nguyên tử trên SQLite, băm nhất quán và cầu dao ba trạng
      thái.
    clear: true
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Băm nhất quán &
      Quorum (DSY/SAR)</td><td>Chỉ di chuyển ~1/N khoá khi thêm nút phân vùng</td></tr><tr><td>Outbox & người tiêu
      thụ lũy đẳng (DEN/EVT)</td><td>Chặn mất sự kiện khi tiến trình sập giữa hai thao tác</td></tr><tr><td>Chịu
      lỗi Circuit Breaker (CLD)</td><td>Ngắt mạch khi dịch vụ đích lỗi liên tiếp để tránh sập dây chuyền</td></tr></table>
    say: Dự án Chặng 8 ghép ba cơ chế cốt lõi của kiến trúc sư hệ thống phân tán và dữ liệu lớn. Thứ nhất là mẫu
      Outbox ghi đơn hàng và sự kiện trong cùng giao dịch để bảo toàn dữ liệu khi sập tiến trình. Thứ hai là vòng
      băm nhất quán giữ cho phần lớn khoá ổn định chỗ khi mở rộng số nút phân vùng. Thứ ba là cầu dao tự ngắt để
      chặn đứng bão gọi lỗi vào dịch vụ hạ lưu đang quá tải.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật dự án
  steps:
  - show: '<table class=''t''><tr><th>kỹ thuật / hàm cốt lõi</th><th>vai trò cài đặt</th></tr><tr><td><code>with
      con: ...</code></td><td>Khối giao dịch nguyên tử SQLite: lỗi hoặc rollback hoàn tác toàn bộ</td></tr><tr><td><code>bisect.bisect(ring,
      h)</code></td><td>Tìm nút liền kề theo chiều kim đồng hồ trên vòng băm O(log N)</td></tr><tr><td><code>CLOSED
      → OPEN</code></td><td>Mở cầu dao tức thì sau ngưỡng lỗi liên tiếp để trả về lỗi nhanh</td></tr></table>'
    say: Bảng ký hiệu nêu ba mảnh ghép kỹ thuật chính của dự án. Câu lệnh with kết hợp đối tượng kết nối SQLite
      tự động chốt hoặc hoàn tác toàn bộ giao dịch. Tìm kiếm nhị phân trên vòng băm ánh xạ khoá về nút đích nhanh
      chóng. Còn máy trạng thái cầu dao chuyển từ đóng sang mở khi đếm đủ số lỗi liên tiếp.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
