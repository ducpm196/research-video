      ghi Outbox chung một giao dịch? Câu hai, thêm nút thứ năm vào bốn nút theo băm nhất quán thì lý thuyết chỉ dời khoảng
      mấy phần trăm khoá? Bấm tạm dừng và trả lời. Hai câu hỏi giúp củng cố tính nguyên tử của bảng hộp thư đi và ưu điểm
