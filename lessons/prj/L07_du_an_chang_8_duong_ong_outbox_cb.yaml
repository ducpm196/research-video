- id: practice
  kind: practice
  title: Tự làm dự án và chấm tự động
  lab: labs/PRJ/L07
  steps:
  - show: <table class='t'><tr><th>Thực hành PRJ:L07</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Ghi
      kép ord/outb 1 TX, định tuyến vòng băm SHA-256 và chuyển trạng thái Circuit Breaker</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>commit_ids=1;
      rollback_ids=2; old_nodes=4 new_nodes=5 keys=500; events=0,0,0 threshold=3</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh PRJ L07 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đã tới lúc bạn tự cài đặt hoàn chỉnh dự án Chặng 8 và kiểm nghiệm trên dữ liệu thực thi động qua bộ chấm tự động.
      Hãy mở đề bài dự án bảy đọc đúng định dạng chuỗi sự kiện, tham số số nút và cấu hình giao dịch từ luồng chuẩn. Sau đó
      bạn hoàn thiện mã Python sao cho vượt qua cả kịch bản mặc định lẫn các ca kiểm chứng cầu dao ẩn. Chú ý đọc chính xác
      danh sách mã đơn chốt thành công, mã đơn hoàn tác, số nút và chuỗi sự kiện của cầu dao từ luồng chuẩn. Kiểm chứng biến
      trạng thái cầu dao chuyển động thật sự theo từng sự kiện thất bại hay thành công xen kẽ trong chuỗi.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: '<table class=''t''><tr><th>Gợi ý triển khai PRJ:L07</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước
      1 (Outbox TX)</b></td><td>Dùng <code>with con:</code> chèn <code>commit_ids</code> vào <code>ord</code> &amp; <code>outb</code>,
      rồi chạy <code>BEGIN ... rollback()</code> cho <code>rollback_ids</code></td></tr><tr><td><b>Bước 2 (Vòng băm)</b></td><td>Sắp
      danh sách <code>(h32(f''n{i}#0''), i)</code> rồi tra bằng <code>bisect.bisect</code>; đếm số khoá đổi nút &lt; 30%</td></tr><tr><td><b>Bước
      3 (Cầu dao)</b></td><td>Duyệt <code>events</code>: gặp <code>1</code> gán <code>fails=0</code>, gặp <code>0</code> tăng
      <code>fails</code> và chuyển <code>OPEN</code> nếu <code>&gt;= threshold</code></td></tr></table>'
    say: Bảng gợi ý chia dự án Chặng 8 thành ba mô-đun nhỏ gọn bạn có thể cài đặt và kiểm thử từng phần một. Ở phần Outbox,
      bạn thực hành khối giao dịch tự động chốt cho danh sách hợp lệ và gọi hoàn tác rõ ràng cho nhóm thử nghiệm lỗi. Ở phần
      băm nhất quán, bạn quy chiếu tám ký tự đầu của SHA hai trăm năm mươi sáu sang số nguyên rồi dùng tìm kiếm nhị phân trên
      vòng tròn. Ở phần cầu dao, bạn duyệt tuần tự dãy sự kiện đọc từ luồng chuẩn và đặt lại bộ đếm khi gặp một. Mỗi khi gặp
      sự kiện thành công trước khi cầu dao kịp mở, bộ đếm thất bại liên tiếp phải quay về không ngay lập tức.
    clear: true
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>outbox_atomic_match=1</div><div>ch_moved_lt_150=1</div><div>cb_after_3fails=OPEN</div></div>
    say: Màn hình hiển thị các dòng đầu ra chuẩn tương ứng bộ dữ liệu mẫu. Chương trình của bạn cần đọc tham số từ luồng chuẩn
