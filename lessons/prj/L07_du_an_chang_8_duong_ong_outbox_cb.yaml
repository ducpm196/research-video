      Dùng <code>hash(key)</code> có salt ngẫu nhiên mỗi lần chạy Python làm định tuyến đổi.<br><b>Lỗi 3 (-10đ):</b>
      Chuyển thẳng <code>OPEN → CLOSED</code> mà không thử tải nhẹ qua <code>HALF_OPEN</code>.</div></td></tr></table>
