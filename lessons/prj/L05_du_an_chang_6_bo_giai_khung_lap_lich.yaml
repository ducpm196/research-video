  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Biểu diễn byte, struct căn
      lề (CPR/CSA)</td><td>Đọc chuẩn nhị phân <code>uint16_t</code> little-endian không lệch byte</td></tr><tr><td>Lập lịch
      CPU Round Robin q = 4 (OSY)</td><td>Chia lát thời gian đều cho các luồng tránh tác vụ lớn chiếm CPU</td></tr><tr><td>Đóng
      khung gói & trễ truyền (NET/LNX)</td><td>Kiểm tra kích thước header + payload chuẩn Ethernet/TCP</td></tr></table>
    say: Dự án Chặng 6 ghép ba nền tảng hệ thống cốt lõi mà bạn đã học xuyên suốt chặng này. Thứ nhất là cách giải mã cấu
      trúc nhị phân cấp byte bằng thư viện chuẩn mà không đọc sai thứ tự byte. Thứ hai là thuật toán lập lịch CPU xoay vòng
      giúp chia lát công bằng giữa nhiều gói tin đến đồng thời. Thứ ba là quy tắc kiểm đủ độ dài tải khi đóng khung truyền
      tin trên mạng và bộ chứa ảo hoá. Trong thực tế vận hành đường ống sự kiện nhị phân, ranh giới giữa hai gói tin không
      nằm ở ký tự xuống dòng mà nằm ở trường độ dài trong phần đầu cố định bốn byte. Vì vậy nếu không thống nhất chuẩn nhỏ
      trước khi đóng gói và mở gói, bộ thu khác kiến trúc sẽ giải mã sai kích thước và cắt nhầm dữ liệu. Đồng thời trên máy
      chủ đa nhân xử lý nhiều luồng kết nối song song, hàng đợi xoay vòng kết hợp lượng tử bốn đơn vị bảo đảm tác vụ ngắn
      phản hồi kịp thời. Tác vụ điều khiển ngắn không phải đứng đợi sau một tác vụ sao chép dữ liệu kéo dài hai mươi bốn nhịp.
      Khi thống nhất quy ước đóng gói từ đầu, dịch vụ thu thập trên các kiến trúc phần cứng khác nhau đều đọc chung một luồng
      ổn định.
