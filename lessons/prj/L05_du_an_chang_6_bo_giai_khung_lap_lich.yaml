scenes:
- id: hook
  kind: hook
  title: Giải mã khung nhị phân & lập lịch đa nhân
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: <div class='box key'><p>Đọc đúng <b>header 4 byte</b> (2 trường 16 bit không dấu) từ luồng nhị phân thô,
      rồi lập lịch Round Robin <code>q = 4</code> cho ba tác vụ <code>[24, 3, 3]</code> giữ thời gian chờ trung
      bình <b>5,67</b> thay vì <b>17,00</b> của FCFS.</p></div>
    say: Chào bạn đến với dự án chốt Chặng 6 tổng hợp hệ thống máy tính, hệ điều hành và mạng máy tính. Một bộ định
      tuyến hay trình thu thập nhật ký hiệu năng cao luôn gặp hai bài toán đi liền nhau. Đầu tiên là phải đọc đúng
      từng byte nhị phân từ luồng thô mà không lệch căn lề hay sai đầu cuối. Tiếp theo là lập lịch xử lý sao cho
      một yêu cầu nặng hai mươi bốn mi-li-giây không chặn các gói nhẹ phía sau. Hôm nay ta cài trọn vẹn bộ giải
      mã nhị phân chuẩn cấu trúc và hàng đợi xoay vòng kiểm chứng bằng Python thật.
    clear: true
- id: prereq
  kind: prereq
  title: Ghép kiến thức cốt lõi của chặng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép chặng</th><th>vai trò trong dự án</th></tr><tr><td>Biểu diễn byte,
      struct căn lề (CPR/CSA)</td><td>Đọc chuẩn nhị phân <code>uint16_t</code> little-endian không lệch byte</td></tr><tr><td>Lập
      lịch CPU Round Robin q = 4 (OSY)</td><td>Chia lát thời gian đều cho các luồng tránh tác vụ lớn chiếm CPU</td></tr><tr><td>Đóng
      khung gói & trễ truyền (NET/LNX)</td><td>Kiểm tra kích thước header + payload chuẩn Ethernet/TCP</td></tr></table>
    say: Dự án Chặng 6 ghép ba nền tảng hệ thống cốt lõi mà bạn đã học xuyên suốt chặng này. Thứ nhất là cách giải
      mã cấu trúc nhị phân cấp byte bằng thư viện chuẩn mà không đọc sai thứ tự byte. Thứ hai là thuật toán lập
      lịch CPU xoay vòng giúp chia lát công bằng giữa nhiều gói tin đến đồng thời. Thứ ba là quy tắc kiểm đủ độ
      dài tải khi đóng khung truyền tin trên mạng và bộ chứa ảo hoá.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Quy chuẩn kỹ thuật dự án
  steps:
  - show: <table class='t'><tr><th>kỹ thuật / hàm cốt lõi</th><th>vai trò cài đặt</th></tr><tr><td><code>struct.unpack('&lt;HH',
      b)</code></td><td>Giải mã 2 số 16 bit little-endian chiếm đúng 4 byte đầu tiên</td></tr><tr><td><code>collections.deque</code></td><td>Hàng
      đợi hai đầu lấy đầu O(1) và trả phần còn dư về cuối</td></tr><tr><td><code>q = 4</code></td><td>Lượng tử thời
      gian tối đa mỗi lượt chạy trước khi nhường CPU</td></tr></table>
    say: Bảng ký hiệu giải thích ba công cụ Python phục vụ trực tiếp cho dự án Chặng 6. Thứ nhất là hàm giải gói
      cấu trúc nhỏ trước để tách mã định danh và chiều dài tải. Thứ hai là hàng đợi hai đầu giúp rút và trả tác
      vụ cuối lượt trong thời gian hằng số. Thứ ba là lượng tử bằng bốn giúp cân bằng giữa độ nhạy và chi phí chuyển
      ngữ cảnh.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Luồng xử lý tổng thể
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700"
