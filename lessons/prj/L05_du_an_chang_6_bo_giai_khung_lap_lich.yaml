      đọc tải, các gói tin bị cắt cụt trên đường truyền bị loại bỏ an toàn.
- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: <div class='box key'><p><b>1. Giải mã cấu trúc 4 B:</b> <code>struct.unpack('&lt;HH', buf[:4])</code> tách ra <code>(pkt_id,
      payload_len)</code>.</p><p><b>2. Lập lịch Round Robin q=4:</b> tổng chờ <code>(6 + 4 + 7) / 3 = <b>5,67</b></code> so
      với FCFS <code>17,00</code>.</p></div>
    say: Ta rà lại hai công thức quyết định tính đúng của dự án trước khi viết mã thật. Ở phép giải mã, ký hiệu nhỏ trước
      nghĩa là đọc hai số nguyên không dấu mười sáu bít từ bốn byte đầu. Tổng kích thước khung hợp lệ phải bằng đúng bốn cộng
      thêm độ dài tải công bố trong phần đầu. Ở bộ lập lịch, cắt lát bốn đơn vị giúp hai tác vụ ngắn ba đơn vị hoàn tất sớm
      ngay trong vòng xoay đầu tiên. Nhờ vậy thời gian chờ trung bình tụt từ mười bảy xuống năm phẩy sáu bảy đơn vị. Khi đọc trường
      độ dài không dấu mười sáu bít từ luồng byte liên tục, điều kiện toàn vẹn tối thiểu là chiều dài bộ đệm thực nhận phải
      khớp đúng bốn cộng độ dài tải. Nếu bộ đệm ngắn hơn tổng đó thì gói tin đang bị cắt cụt trên đường truyền và ứng dụng
      phải từ chối giải mã ngay. Ở vế lập lịch, cắt lát lượng tử nhỏ giúp hai tác vụ ngắn thoát sớm ở vòng đầu, giảm mạnh thời gian chờ của chúng dù tác vụ dài đứng trước. Vì tác vụ ba đơn vị kết thúc ngay lượt đầu, thời gian chờ trung bình của toàn hệ thống
      giảm ba lần so với phục vụ tuần tự. Khai báo kích thước cố định bốn byte đầu tạo neo vững chắc để phân tách hàng
      triệu gói nối đuôi trên cùng dòng chảy.
    focus:
    - 0
    - '1.1'
