  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>fcfs_avg=17.00 saved=11.33</div></div>
    say: Kết quả đối chứng cho thấy trung bình của đến trước phục vụ trước lên tới mười bảy nên lập lịch xoay vòng tiết kiệm
      hơn mười một đơn vị. Số liệu khớp chặt với công thức lý thuyết nhờ chia đúng lát thời gian. Tiết kiệm hơn mười một đơn
      vị thời gian trung bình trên chỉ ba tác vụ chứng minh lợi thế vượt trội của lập lịch xoay vòng.
