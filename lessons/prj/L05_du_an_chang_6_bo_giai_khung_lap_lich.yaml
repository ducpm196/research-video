- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>1 000 khung/s</td><td>0,5%
      tải 1 nhân</td><td>Độ trễ ổn định < 1 ms</td></tr><tr><td>100 000 khung/s</td><td>50% tải 1 nhân</td><td>Cần gom lô
      giảm gọi hệ thống</td></tr><tr><td>1 000 000 khung/s</td><td>Quá tải 1 nhân</td><td>Tách 4–8 worker pin vào từng nhân</td></tr></table>
    say: Bảng quy mô đối chiếu khả năng đáp ứng khi lưu lượng gói tăng từ một nghìn lên một triệu khung mỗi giây. Ở mức một
      trăm nghìn khung, gom lô nhiều khung mỗi lần đọc giúp giảm hẳn số lần chuyển ngữ cảnh vào nhân. Lên tới một triệu khung
      thì một luồng đơn sẽ nghẽn, buộc ta phải chia luồng theo nhân bộ xử lý. Bài học vận hành thực tế ở quy mô một trăm nghìn
      và một triệu khung mỗi giây chỉ ra hai điểm nghẽn hoàn toàn khác nhau. Ở ngưỡng một trăm nghìn khung trên giây, bản
      thân hàm giải gói Python rất nhẹ nhưng việc gọi hàm hệ thống đọc từng gói rời gây tốn chi phí chuyển ngữ cảnh. Gom nhiều
      khung vào một vùng đệm lớn rồi bóc tách theo con trỏ dịch chuyển giúp giữ tải dưới một nửa năng lực một nhân. Khi tải
      chạm mốc một triệu khung, ta buộc phải tách thành bốn đến tám tiến trình lắng nghe riêng theo từng nhân bộ xử lý. Mỗi
      mốc tải một nghìn, một trăm nghìn và một triệu khung đòi hỏi chiến lược đọc đệm và phân luồng tương ứng.
