- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import struct</div><div>from collections import
      deque</div><div>buf = struct.pack(''&lt;HH'', 101, 64) + b''A'' * 64</div><div>pid, plen = struct.unpack(''&lt;HH'',
      buf[:4])</div><div>rem, t, fin, q = [24, 3, 3], 0, [0]*3, deque([0,1,2])</div><div>while q:</div><div>    i = q.popleft();
      d = min(4, rem[i]); t += d; rem[i] -= d</div><div>    if rem[i] &gt; 0: q.append(i)</div><div>    else: fin[i] = t</div><div>w
      = [fin[i] - [24,3,3][i] for i in range(3)]</div><div>print(f''pkt={pid} len={plen} frame={4+plen}'')</div><div>print(f''rr_waits={w[0]},{w[1]},{w[2]}
      avg={sum(w)/3:.2f}'')</div></div>'
    say: Đoạn mã này đóng gói thử một khung sáu mươi tám byte gồm bốn byte đầu và sáu mươi bốn byte dữ liệu. Sau khi giải
      mã lấy đúng mã một trăm lẻ một và độ dài sáu tư, chương trình chạy hàng đợi xoay vòng cho ba tác vụ. Mỗi tác vụ chạy
      tối đa bốn đơn vị rồi nhường chỗ nên hai gói ngắn thoát ngay ở lượt đầu tiên. Khi mô phỏng bằng hàng đợi hai đầu, thao
      tác lấy đầu và đẩy lại cuối thực hiện chỉ trong thời gian hằng số. Biến đếm tích lũy thời gian thực ghi nhận chính xác
      thời điểm hoàn tất của từng tác vụ để quy ra thời gian chờ.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>pkt=101 len=64 frame=68</div><div>rr_waits=6,4,7 avg=5.67</div></div>
    say: Đầu ra chạy thật trên Python xác nhận tổng kích thước khung đúng bằng sáu mươi tám byte. Thời gian chờ lần lượt của
      ba tác vụ là sáu, bốn và bảy nên giá trị trung bình đạt năm phẩy sáu bảy. Bảng kết quả rõ ràng giúp đối chiếu ngay mức
      giảm độ trễ so với lập lịch tuần tự đến trước phục vụ trước.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
