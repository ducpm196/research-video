      fill="#1e293b">Hàng đợi RR q=4</text><text x="475.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Xoay
      vòng công bằng</text><line x1="600" y1="80" x2="660" y2="80" stroke="#475569" stroke-width="2"/><polygon points="660,80
      652.0,85.0 652.0,75.0" fill="#475569"/><text x="630" y="72" font-size="14" font-weight="600" text-anchor="middle"
      fill="#1e293b">bước 2</text><rect x="660" y="35" width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706"
