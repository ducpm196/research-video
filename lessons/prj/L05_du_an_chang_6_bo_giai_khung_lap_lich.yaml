  - show: <table class='t'><tr><th>Gợi ý triển khai PRJ:L05</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (stdin)</b></td><td>Đọc từng dòng từ <code>sys.stdin</code>, tách <code>pid</code>, <code>plen</code>, <code>fill</code>,
      <code>q</code> và danh sách số nguyên <code>bursts</code></td></tr><tr><td><b>Bước 2 (khung)</b></td><td>Đóng gói <code>struct.pack('&lt;HH',
      pid, plen) + fill * plen</code>, giải nén 4 byte đầu và kiểm <code>len(buf) == 4 + dec_len</code></td></tr><tr><td><b>Bước
      3 (RR)</b></td><td>Dùng <code>collections.deque</code> quay vòng chỉ số <code>0..n-1</code>, cộng tích lũy đồng hồ <code>t</code>
      rồi suy ra <code>fin[i] - bursts[i]</code></td></tr></table>
    say: Gợi ý cấu trúc cài đặt bài thực hành nằm ngay trên màn hình gồm ba bước rành mạch. Đầu tiên bạn phân tích tham số
      từ luồng chuẩn để lấy mã gói, độ dài tải, ký tự đệm, lượng tử thời gian và mảng thời lượng. Kế tiếp bạn gọi đúng cấu
      trúc đóng gói nhỏ trước hai số không dấu mười sáu bít rồi mở lại bốn byte đầu để kiểm chứng tính hợp lệ. Cuối cùng bạn
      xoay vòng hàng đợi hai đầu trên mảng phần dư và tính thời gian chờ bằng hiệu giữa lúc hoàn tất và thời lượng gốc. Nếu
      hàng đợi xoay vòng có nhiều tác vụ hoàn tất cùng một lượt, bảo đảm giữ đúng thứ tự đến ban đầu khi luân chuyển.
