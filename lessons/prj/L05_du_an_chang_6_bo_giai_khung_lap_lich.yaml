  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>b = [24, 3, 3]; t = 0; fw = []</div><div>for x in b:
      fw.append(t); t += x</div><div>print(f''fcfs_avg={sum(fw)/3:.2f} saved={sum(fw)/3 - 17/3:.2f}'')</div></div>'
    say: Ở phép kiểm chứng độc lập, ta tính ngược lại thời gian chờ của hàng đợi đến trước phục vụ trước để so sánh. Do gói
      đầu chiếm trọn hai mươi bốn đơn vị nên hai gói sau phải chờ tích lũy tới hai tư và hai bảy. Phép so sánh đối xứng khẳng
      định mức cải thiện thời gian chờ đạt được hoàn toàn nhờ tách nhỏ lát xử lý của gói nặng.
    focus:
