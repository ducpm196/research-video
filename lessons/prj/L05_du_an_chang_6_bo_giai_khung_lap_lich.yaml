      quả đo</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Chờ TB &amp; kiểm
      tổng</text></svg></div>
    say: Sơ đồ minh họa ba bước nối tiếp của bộ phân tích khung và lập lịch đa nhân. Ở chặng đầu, hệ thống bóc phần
      đầu bốn byte để lấy mã gói và độ dài tải. Ở chặng hai, tác vụ được xếp vào hàng đợi xoay vòng có lượng tử
      bốn để không gói lớn nào chặn gói nhỏ. Cuối cùng bộ đo tổng hợp thời gian chờ trung bình và kiểm tra toàn
      vẹn độ dài.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến toán học
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: <div class='box key'><p><b>1. Giải mã cấu trúc 4 B:</b> <code>struct.unpack('&lt;HH', buf[:4])</code>
      tách ra <code>(pkt_id, payload_len)</code>.</p><p><b>2. Lập lịch Round Robin q=4:</b> tổng chờ <code>(6 +
      4 + 7) / 3 = <b>5,67</b></code> so với FCFS <code>17,00</code>.</p></div>
    say: Ta rà lại hai công thức quyết định tính đúng của dự án trước khi viết mã thật. Ở phép giải mã, ký hiệu
      nhỏ trước nghĩa là đọc hai số nguyên không dấu mười sáu bít từ bốn byte đầu. Tổng kích thước khung hợp lệ
      phải bằng đúng bốn cộng thêm độ dài tải công bố trong phần đầu. Ở bộ lập lịch, cắt lát bốn đơn vị giúp hai
      tác vụ ngắn ba đơn vị hoàn tất sớm chỉ sau hai vòng đợi. Nhờ vậy thời gian chờ trung bình tụt từ mười bảy
      xuống năm phẩy sáu bảy đơn vị.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi của dự án
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: '<p><b>Chạy thử nghiệm bằng Python</b></p><div class="code"><div>import struct</div><div>from collections
      import deque</div><div>buf = struct.pack(''&lt;HH'', 101, 64) + b''A'' * 64</div><div>pid, plen = struct.unpack(''&lt;HH'',
      buf[:4])</div><div>rem, t, fin, q = [24, 3, 3], 0, [0]*3, deque([0,1,2])</div><div>while q:</div><div>    i
      = q.popleft(); d = min(4, rem[i]); t += d; rem[i] -= d</div><div>    if rem[i] &gt; 0: q.append(i)</div><div>    else:
      fin[i] = t</div><div>w = [fin[i] - [24,3,3][i] for i in range(3)]</div><div>print(f''pkt={pid} len={plen}
      frame={4+plen}'')</div><div>print(f''rr_waits={w[0]},{w[1]},{w[2]} avg={sum(w)/3:.2f}'')</div></div>'
    say: Đoạn mã này đóng gói thử một khung sáu mươi tám byte gồm bốn byte đầu và sáu mươi bốn byte dữ liệu. Sau
      khi giải mã lấy đúng mã một trăm lẻ một và độ dài sáu tư, chương trình chạy hàng đợi xoay vòng cho ba tác
      vụ. Mỗi tác vụ chạy tối đa bốn đơn vị rồi nhường chỗ nên hai gói ngắn thoát ngay ở lượt đầu tiên.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>pkt=101 len=64 frame=68</div><div>rr_waits=6,4,7
      avg=5.67</div></div>
    say: Đầu ra chạy thật trên Python xác nhận tổng kích thước khung đúng bằng sáu mươi tám byte. Thời gian chờ
      lần lượt của ba tác vụ là sáu, bốn và bảy nên giá trị trung bình đạt năm phẩy sáu bảy.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>b = [24, 3, 3]; t = 0; fw = []</div><div>for
      x in b: fw.append(t); t += x</div><div>print(f''fcfs_avg={sum(fw)/3:.2f} saved={sum(fw)/3 - 17/3:.2f}'')</div></div>'
    say: Ở phép kiểm chứng độc lập, ta tính ngược lại thời gian chờ của hàng đợi đến trước phục vụ trước để so sánh.
      Do gói đầu chiếm trọn hai mươi bốn đơn vị nên hai gói sau phải chờ tích lũy tới hai tư và hai bảy.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>fcfs_avg=17.00 saved=11.33</div></div>
    say: Kết quả đối chứng cho thấy trung bình của đến trước phục vụ trước lên tới mười bảy nên lập lịch xoay vòng
      tiết kiệm hơn mười một đơn vị. Số liệu khớp chặt với công thức lý thuyết nhờ chia đúng lát thời gian.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn mở rộng
  checks:
  - 4 + 64 == 68
  - (6 + 4 + 7) / 3 > 5
  steps:
  - show: <table class='t'><tr><th>quy mô</th><th>tải tính toán</th><th>khuyến nghị kiến trúc</th></tr><tr><td>1
      000 khung/s</td><td>0,5% tải 1 nhân</td><td>Độ trễ ổn định < 1 ms</td></tr><tr><td>100 000 khung/s</td><td>50%
      tải 1 nhân</td><td>Cần gom lô giảm gọi hệ thống</td></tr><tr><td>1 000 000 khung/s</td><td>Quá tải 1 nhân</td><td>Tách
      4–8 worker pin vào từng nhân</td></tr></table>
    say: Bảng quy mô đối chiếu khả năng đáp ứng khi lưu lượng gói tăng từ một nghìn lên một triệu khung mỗi giây.
      Ở mức một trăm nghìn khung, gom lô nhiều khung mỗi lần đọc giúp giảm hẳn số lần chuyển ngữ cảnh vào nhân.
      Lên tới một triệu khung thì một luồng đơn sẽ nghẽn, buộc ta phải chia luồng theo nhân bộ xử lý.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 (-30đ):</b> Dùng sai endianness <code>&gt;HH</code> cho luồng <code>&lt;HH</code> làm sai độ dài gói.<br><b>Lỗi
      2 (-20đ):</b> Không đưa phần tử chưa xong về cuối hàng đợi làm mất tính xoay vòng.<br><b>Lỗi 3 (-10đ):</b>
      Quên kiểm tra độ dài thực tế <code>len(payload) == plen</code> dễ đọc vượt biên.</div></td></tr></table>
