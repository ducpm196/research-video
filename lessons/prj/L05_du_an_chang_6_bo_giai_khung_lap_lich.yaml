  kind: pitfall
  title: Ba lỗi làm mất điểm khi nghiệm thu
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp khi làm dự án</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (lệch
      giao thức):</b> Dùng sai endianness <code>&gt;HH</code> cho luồng <code>&lt;HH</code> làm sai độ dài gói và cắt hỏng
      luồng.<br><b>Lỗi 2 (mất công bằng):</b> Không đưa phần tử chưa xong về cuối hàng đợi làm mất tính xoay vòng.<br><b>Lỗi
      3 (tràn biên đọc):</b> Quên kiểm tra độ dài thực tế <code>len(buf) == 4 + plen</code> dễ đọc vượt biên khi khung cụt.</div></td></tr></table>
    say: Hãy chú ý ba lỗi nghiêm trọng thường gặp khi triển khai dự án giải mã khung nhị phân và lập lịch đa nhân. Thứ nhất
      là giải mã nhầm thứ tự byte lớn trước khiến con số độ dài tải nhảy vọt vô lý và làm hỏng toàn bộ phần sau luồng dữ liệu.
      Thứ hai là quên đẩy lại tác vụ chưa chạy xong vào cuối hàng đợi khiến bộ lập lịch thoái hoá thành chạy tuần tự. Thứ
      ba là quên đối chiếu chiều dài bộ đệm thực nhận với trường độ dài khai báo trong phần đầu bốn byte. Hãy thử nghiệm riêng
      với trường hợp gói tin chứa tải độ dài bằng không và trường hợp độ dài vượt quá bộ đệm nhận được. Kiểm kỹ thứ tự trừ
      thời lượng chạy gốc khi tính thời gian chờ để không tính nhầm tổng thời gian hoàn thành.
