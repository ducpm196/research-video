      và tập kiểm tra ngay từ đầu. Bước hai chỉ học trung bình và độ lệch chuẩn trên phần huấn luyện, rồi mới biến đổi tập
      kiểm tra. Nhánh kiểm tra chỉ đi qua phép biến đổi đã khoá tham số trung bình và độ lệch chuẩn học được từ phần huấn
