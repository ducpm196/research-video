    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - round(120 * 0.75) == 90
  - (0.0 + 2.0 + 10.0) / 3 == 4.0
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>120 mẫu thử nghiệm</td><td>Chạy
      CPU < 20 ms</td><td>Kiểm chứng nhanh quy trình tách sạch</td></tr><tr><td>100 000 dòng sản xuất</td><td>Lưu mean/std
      JSON < 1 KB</td><td>Không cần nạp lại toàn tập Train khi suy luận</td></tr><tr><td>10 triệu dòng dữ liệu lớn</td><td>Rò
      rỉ ẩn nâng khống điểm Val</td><td>Bọc toàn bộ tiền xử lý trong Pipeline ngay từ đầu</td></tr></table>
    say: Khi mở rộng quy mô từ trăm dòng thử nghiệm lên trăm nghìn dòng ngoài thực tế, cấu trúc Pipeline phát huy giá trị
      kép. Mọi thống kê khớp chỉ gói gọn thành vài tham số nhẹ nên suy luận một dòng mới diễn ra tức thì mà không cần đọc
      lại dữ liệu cũ. Nhờ đóng gói gọn nhẹ trung bình và độ lệch chuẩn, dịch vụ suy luận chạy ổn định ở quy mô lớn. Hệ thống
      không cần tính lại thống kê tập huấn luyện. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận
      hành tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ
      cho dịch vụ không tụt hiệu năng hay sập bộ nhớ. Trên hệ thống lớn hàng trăm nghìn dòng, đóng gói đường ống vào một đối
      tượng duy nhất giúp tái sử dụng nhất quán. Tệp cấu hình lưu chuẩn hoá gọn nhẹ bảo đảm môi trường đánh giá chạy nhanh
      mà không cần lưu cả bảng dữ liệu gốc.
