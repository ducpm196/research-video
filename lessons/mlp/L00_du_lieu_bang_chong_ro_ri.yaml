- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Gọi <code>StandardScaler().fit_transform(X)</code>
      trước <code>train_test_split</code>.<br><b>Lỗi 2:</b> Quên <code>stratify=y</code> làm một tập thiếu lớp khi mẫu ít
      hoặc lệch.<br><b>Lỗi 3:</b> Gọi lại <code>fit_transform(X_test)</code> thay vì <code>transform(X_test)</code> khi đánh
      giá.</div></td></tr></table>
    say: Hãy lưu ý ba sai lầm khiến điểm mô hình ngoài thực tế tụt sâu so với lúc thử nghiệm. Lỗi nặng nhất là gọi chuẩn hóa
      trước khi chia tập. Thứ hai là quên giữ nguyên tỉ lệ nhãn, và thứ ba là gọi nhầm lệnh khớp lại trên tập kiểm tra thay
      vì chỉ biến đổi. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công
      gỡ lỗi về sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ
      liệu mới. Ngoài bước chuẩn hoá thang đo, mọi bước chọn lọc đặc trưng hay điền giá trị thiếu đều phải nằm bên trong chuỗi.
      Việc quên đặt hạt giống cố định làm mỗi lần chạy lại ra kết quả dao động khiến khó phát hiện lỗi ngầm.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - round(120 * 0.75) == 90
  - (0.0 + 2.0) / 2 == 1.0
  steps:
  - show: <ol><li>Khi tập Train là <code>[0, 2]</code> và Test là <code>[10]</code>, <code>mean_</code> hợp lệ bằng mấy?</li><li>Vì
      sao gọi <code>fit_transform</code> lên tập Test lại sai?</li></ol>
    say: Bạn kiểm tra lại kiến thức bằng hai câu hỏi nhanh sau đây. Câu một, nếu tập huấn luyện là không và hai, tập kiểm
      tra là mười thì trung bình hợp lệ bằng mấy? Câu hai, vì sao gọi lệnh khớp lên tập kiểm tra lại sai? Bấm tạm dừng và
      trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code><b>1.0</b></code> (trung bình của <code>[0,
      2]</code>); tuyệt đối không tính phần tử <code>10</code> của Test.</p></td></tr></table>
    say: 'Đáp án câu một: trung bình hợp lệ đúng bằng một, vì chỉ được tính trên hai giá trị không và hai của phần huấn luyện.
      Trung bình hợp lệ không bao giờ được phép thay đổi khi có thêm bất kỳ mẫu mới nào xuất hiện trong tập kiểm tra.'
    clear: true
    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Vì <code>fit_transform</code> học mean và std mới ngay
      trên tập Test, phá hỏng quy chuẩn so sánh và rò rỉ dữ liệu.</p></td></tr></table>
    say: 'Đáp án câu hai: vì nó tính lại trung bình và độ lệch chuẩn mới trên chính tập kiểm tra, làm hỏng thước đo đồng nhất
      và gây rò rỉ dữ liệu. Chỉ dùng hàm biến đổi thuần túy để áp dụng lại tham số cũ chính là nguyên tắc vàng khi chấm điểm
      dữ liệu mới.'
    clear: true
    focus: null
- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L00
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L00</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Cài
      Pipeline StandardScaler + LogisticRegression bảo đảm khớp chỉ trên Train</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=120
      n_features=4 test_size=0.25 seed=42; train_vals=0.0,2.0 test_vals=10.0</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash
      labs/cham.sh MLP L00 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 0 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Chú ý đọc chính xác số lượng mẫu, tỉ lệ tách và hai mảng số kiểm tra ở từng dòng trong luồng chuẩn.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L00</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tách tập)</b></td><td>Đọc <code>stdin</code>, chia phân tầng <code>stratify=y</code> bằng <code>random_state=seed</code></td></tr><tr><td><b>Bước
      2 (đo rò rỉ)</b></td><td>Tính <code>mean_[0]</code> trên <code>train_vals</code> riêng và trên <code>vstack([train_vals,
      test_vals])</code></td></tr><tr><td><b>Bước 3 (Pipeline)</b></td><td>Chạy <code>Pipeline([('sc', StandardScaler()),
      ('clf', LogisticRegression(...))])</code> và in độ chính xác Test</td></tr></table>
    say: Đọc tham số từ luồng chuẩn gồm kích thước mẫu, số chiều, tỉ lệ tách và hai mảng kiểm chứng rò rỉ. Sau đó bạn tách
      dữ liệu phân tầng ngay từ đầu, huấn luyện chuỗi xử lý chỉ trên tập huấn luyện rồi đối chứng giá trị trung bình khi gộp
      thêm dữ liệu kiểm tra. Bạn có thể viết một hàm riêng để so sánh trực tiếp trung bình sạch và trung bình bị rò rỉ trước
      khi in ra.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>clean_mean=1.00</div><div>leak_mean=4.00</div><div>pipe_test_acc=0.867</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Tách Train/Test trước</span><span class="a">→</span><span class="n">Pipeline
      fit chỉ Train</span><span class="a">→</span><span class="n">0 rò rỉ dữ liệu</span></div>
    say: Ba nguyên tắc cốt lõi bảo vệ mô hình học máy là tách tập trước khi chuẩn hoá. Chỉ khớp bộ biến đổi trên dữ liệu huấn
      luyện và giữ nguyên quy chuẩn cho tập kiểm tra. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực
      giác toán học đằng sau từng dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi
      kết quả thực nghiệm tái lập chính xác trên nhiều máy. Đặt toàn bộ bước tiền xử lý vào trong chuỗi khép kín giúp ngăn
      chặn triệt để mọi lỗi nhìn trộm dữ liệu kiểm tra. Kỷ luật tách tập ngay dòng mã đầu tiên luôn là tiêu chuẩn bắt buộc
      cho bất kỳ dự án học máy nào.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L00:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 0 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Hãy
      giữ vững thói quen kiểm chứng tính sạch của tập dữ liệu trước khi nâng cấp bất kỳ thuật toán phức tạp nào.
    clear: true
    focus: null
