- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 90 + 30 == 120
  - round(120 * 0.25) == 30
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.preprocessing import StandardScaler</div><div>from
      sklearn.linear_model import LogisticRegression</div><div>from sklearn.pipeline import Pipeline</div><div>X, y = make_classification(n_samples=120,
      n_features=4, random_state=42)</div><div>X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y,
      random_state=42)</div><div>pipe = Pipeline([('sc', StandardScaler()), ('clf', LogisticRegression(random_state=42))])</div><div>pipe.fit(X_tr,
      y_tr)</div><div>print(f'tr_n={len(X_tr)} te_n={len(X_te)} acc={pipe.score(X_te, y_te):.3f}')</div></div>
    say: Đoạn mã tạo một trăm hai mươi mẫu chuẩn bằng hạt giống bốn hai, rồi tách chín mươi mẫu huấn luyện và ba mươi mẫu
      kiểm tra. Nhờ bọc bộ chuẩn hóa và hồi quy vào cùng một chuỗi khép kín, lời gọi khớp chỉ tiếp xúc đúng phần chín mươi
      mẫu đầu. Từng dòng mã chạy xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử.
      Nhờ giữ nguyên cấu trúc chuỗi khép kín, mã chạy chỉ cần gọi đúng một lệnh khớp trên tập huấn luyện đầu vào.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>tr_n=90 te_n=30 acc=0.867</div></div>
    say: Đầu ra chạy thật trên CPU xác nhận kích thước hai tập đúng chuẩn chín mươi và ba mươi. Độ chính xác kiểm tra phản
      ánh trung thực năng lực mô hình vì tập kiểm tra chưa từng tham gia bước tính thang đo. Giá trị đầu ra thu được khớp
      chặt với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết. Khi chấm điểm trên ba mươi mẫu kiểm tra hoàn
      toàn tách biệt, bộ phân loại bảo toàn tính khách quan từ đầu tới cuối.
