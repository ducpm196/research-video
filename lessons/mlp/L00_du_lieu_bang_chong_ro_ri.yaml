- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - (0.0 + 2.0) / 2 == 1.0
  - (0.0 + 2.0 + 10.0) / 3 == 4.0
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.preprocessing
      import StandardScaler</div><div>X_tr = np.array([[0.0], [2.0]]); X_te = np.array([[10.0]])</div><div>sc_ok = StandardScaler().fit(X_tr)</div><div>sc_leak
      = StandardScaler().fit(np.vstack([X_tr, X_te]))</div><div>print(f'ok_mean={sc_ok.mean_[0]:.2f} leak_mean={sc_leak.mean_[0]:.2f}')</div></div>
    say: Để kiểm chứng tận mắt độ sai lệch khi làm ẩu, ta thử trên tập huấn luyện chỉ gồm hai số không và hai, còn tập kiểm
      tra chứa giá trị mười. Ta so sánh trung bình của bộ chuẩn hóa khớp sạch chỉ trên phần huấn luyện với bộ chuẩn hóa gộp
      chung cả hai tập. Việc đối chứng hai cách xử lý song song rất cần thiết vì bằng chứng thực nghiệm giúp loại bỏ hoàn
      toàn phỏng đoán cảm tính. Hai giá trị cực đoan gồm phần huấn luyện nhỏ và phần kiểm tra lớn gấp năm lần làm bật rõ sai
      lệch thống kê.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>ok_mean=1.00 leak_mean=4.00</div></div>
    say: Kết quả đối chiếu tách bạch rất rõ giữa hai cách làm. Bộ sạch cho trung bình bằng một, còn bộ rò rỉ bị kéo vọt lên
      bốn phẩy không do giá trị mười từ tập kiểm tra đã lọt sang lúc khớp. Kết quả kiểm chứng khẳng định quy luật toán học
      không đổi khi kiểm thử độc lập. Chênh lệch giữa một phẩy không và bốn phẩy không là bằng chứng số học rõ ràng nhất tố
      cáo lỗi làm ẩu.
    focus:
    - 1
