- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Mảng số học hai chiều (PYT:L09)</td><td>Ma
      trận X có n hàng mẫu và d cột đặc trưng</td></tr><tr><td>Mạng đa tầng và lan truyền (CS115:L23)</td><td>Thang đo đặc
      trưng lớn làm lệch bước tối ưu</td></tr><tr><td>Bẫy thống kê gộp (MLP)</td><td>Tính trung bình trên toàn bộ dữ liệu
      gây lộ thông tin tập kiểm tra</td></tr></table>
    say: Chào bạn đến với khoá học máy thực hành trên dữ liệu bảng và chạy hoàn toàn trên CPU. Trước hết ta nối kiến thức
      ma trận hai chiều từ bài trước để tổ chức bảng đặc trưng X và nhãn y. Thứ hai, ta xử lý bẫy phổ biến nhất khi mới làm
      thực tế là rò rỉ dữ liệu qua bước chuẩn hóa sớm. Việc giữ cố định một quy trình chuẩn ngay từ bước nạp bảng đặc trưng
      giúp loại bỏ hoàn toàn sự khác biệt giữa môi trường thử nghiệm và dịch vụ vận hành. Quy trình này liên kết chặt chẽ
      từ khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán và giới
      hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Ma trận hai chiều lưu các dòng là từng
      quan sát độc lập và các cột là từng đặc trưng đã thu thập. Mọi bước xử lý cột số phía sau đều phải tôn trọng ranh giới
      tách dòng giữa hai tập ngay từ ban đầu.
