    say: Bảng trên giải thích từng thành phần viết trong mã nguồn để bạn nhìn vào là đọc hiểu ngay. Hàm chia tách nhận thêm
      tham số giữ cân bằng tỉ lệ nhãn và hạt giống bốn hai để kết quả lặp lại y hệt nhau. Bộ chuẩn hóa đưa cột về cùng thang
      đo, còn đối tượng Pipeline xâu chuỗi gọn gàng hai bước ấy. Tham số chia phân tầng giữ cho tỉ lệ nhãn dương và âm trong
      hai phần sau tách giống hệt bảng gốc ban đầu. Hạt giống ngẫu nhiên cố định giúp mỗi lần chạy lại kịch bản kiểm thử đều
      tái tạo đúng tập mẫu y hệt nhau.
