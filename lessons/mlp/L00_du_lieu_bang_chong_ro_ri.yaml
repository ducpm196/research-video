- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round((0.0 + 2.0) / 2, 1) == 1.0
  - round((0.0 + 2.0 + 10.0) / 3, 1) == 4.0
  steps:
  - show: <div class='box key'><p><b>1. Chuẩn hóa đúng (chỉ từ Train):</b> <code>z = (x - mean_train) / std_train</code>.</p><p><b>2.
      Pipeline:</b> gói chuỗi biến đổi <code>fit_transform(X_train)</code> rồi <code>transform(X_test)</code> tự động trong
      một đối tượng.</p></div>
    say: Trên màn hình là công thức chuẩn hóa đúng nguyên tắc tách biệt hoàn toàn giữa huấn luyện và kiểm tra. Ta định nghĩa
      rò rỉ dữ liệu là việc tính trung bình và độ lệch chuẩn bằng dữ liệu gộp chung cả hai tập. Còn Pipeline là chuỗi xử lý
      đóng gói hai bước khớp và biến đổi, giúp mọi thước đo chỉ học duy nhất trên phần huấn luyện. Việc tách định nghĩa tham
      số trên tập huấn luyện rất quan trọng vì nó quyết định độ trung thực của thước đo tổng quát. Mọi công thức chuyển đổi
      trước khi đóng gói ra sản phẩm đều phải giữ đúng giả định toán học ban đầu để không gây sai số tích lũy. Nếu cho tập
      kiểm tra tham gia tính trung bình chuẩn hoá, ranh giới phân tách dữ liệu vô hình trung đã nhìn trộm tương lai. Chuỗi
      khép kín gom bộ chuẩn hoá và mô hình thành một khối thống nhất tránh mọi sai sót gọi nhầm thứ tự.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
