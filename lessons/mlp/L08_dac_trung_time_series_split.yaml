      sklearn.model_selection import train_test_split</div><div>from sklearn.preprocessing import PolynomialFeatures
      as PF, StandardScaler as SS</div><div>from sklearn.linear_model import LogisticRegression as LR</div><div>from
      sklearn.pipeline import Pipeline</div><div>X, y = make_circles(n_samples=300, factor=0.4, noise=0.05, random_state=42)</div><div>X_tr,
      X_te, y_tr, y_te = train_test_split(</div><div>    X, y, test_size=0.3, stratify=y, random_state=42)</div><div>lin
      = Pipeline([('s', SS()), ('c', LR(random_state=42))]).fit(X_tr, y_tr)</div><div>poly = Pipeline([('pf', PF(2,
      include_bias=False)), ('s', SS()),</div><div>                 ('c', LR(random_state=42))]).fit(X_tr, y_tr)</div><div>print(f'linear_acc={lin.score(X_te,
      y_te):.3f} poly2_acc={poly.score(X_te, y_te):.3f}')</div></div>
