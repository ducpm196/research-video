- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - round(300 * 0.3) == 90
  - 2 + 2 * 3 // 2 == 5
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_circles</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.preprocessing import PolynomialFeatures as PF,
      StandardScaler as SS</div><div>from sklearn.linear_model import LogisticRegression as LR</div><div>from sklearn.pipeline
      import Pipeline</div><div>X, y = make_circles(n_samples=300, factor=0.4, noise=0.05, random_state=42)</div><div>X_tr,
      X_te, y_tr, y_te = train_test_split(</div><div>    X, y, test_size=0.3, stratify=y, random_state=42)</div><div>lin =
      Pipeline([('s', SS()), ('c', LR(random_state=42))]).fit(X_tr, y_tr)</div><div>poly = Pipeline([('pf', PF(2, include_bias=False)),
      ('s', SS()),</div><div>                 ('c', LR(random_state=42))]).fit(X_tr, y_tr)</div><div>print(f'linear_acc={lin.score(X_te,
      y_te):.3f} poly2_acc={poly.score(X_te, y_te):.3f}')</div></div>
    say: Đoạn mã đối đầu trực tiếp mô hình tuyến tính thuần và mô hình gắn thêm đa thức bậc hai trên dữ liệu hai vòng tròn
      đồng tâm. Mọi bước chuẩn hóa và mở rộng đặc trưng đều nằm gọn trong chuỗi xử lý khép kín. Từng dòng mã chạy xác định
      hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Ghép bộ sinh đa thức bậc hai và chuẩn
      hoá trước bộ phân loại tuyến tính giữ cho đường ống giải bài toán vòng tròn hoàn hảo.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>linear_acc=0.456 poly2_acc=1.000</div></div>
    say: Kết quả chạy thật chứng minh đường thẳng thường chỉ đoán ngang mức tung đồng xu quanh năm mươi phần trăm. Ngược lại
