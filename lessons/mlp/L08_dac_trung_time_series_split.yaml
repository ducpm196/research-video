- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - 100 * 101 // 2 + 100 == 5150
  - 100 + 100 * 101 // 2 == 5150
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>2 cột -> bậc 2</td><td>5
      đặc trưng mới</td><td>Chi phí tăng không đáng kể</td></tr><tr><td>100 cột -> bậc 2</td><td>5 150 đặc trưng!</td><td>Bùng
      nổ tổ hợp C(d+2, 2) - 1 -> dễ tràn RAM và quá khớp</td></tr><tr><td>Chuỗi giao dịch nhiều năm</td><td>KFold xáo trộn
      sai nghiêm trọng</td><td>Luôn dùng TimeSeriesSplit hoặc cắt theo ngày cứng</td></tr></table>
    say: Bảng quy mô nhắc nhở hai lưu ý khi mở rộng bài toán. Thứ nhất, đừng chạy đa thức bậc cao trên bảng trăm cột vì số
      chiều sẽ tăng theo hàm bậc hai lên tới hàng nghìn cột nhiễu. Thứ hai, với bài toán dự báo theo ngày, chỉ số thời gian
      luôn phải kiểm bằng chia tịnh tiến. Trong dự báo chuỗi thời gian quy mô lớn, luôn phải kiểm tra nghiêm ngặt điều kiện
      tập huấn luyện kết thúc hoàn toàn trước điểm bắt đầu tập kiểm tra. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp
      đường ống học máy vận hành tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng
      buộc kiến trúc này giữ cho dịch vụ không tụt hiệu năng hay sập bộ nhớ. Nếu nâng lên đa thức bậc ba hay bậc bốn trên
      trăm cột, bộ nhớ sẽ nhanh chóng nổ tung thành hàng trăm nghìn đặc trưng thừa. Mỗi nếp kiểm chứng chuỗi thời gian mở
      rộng dần tập quá khứ mô phỏng sát cách hệ thống cập nhật mô hình hằng tuần.
