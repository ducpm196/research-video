  - round(300 * 0.3) == 90
  steps:
  - show: <ol><li>Từ 2 cột <code>(x1, x2)</code>, <code>PolynomialFeatures(degree=2, include_bias=False)</code> tạo ra bao
      nhiêu cột?</li><li>Vì sao không được dùng <code>StratifiedKFold(shuffle=True)</code> trên dữ liệu dự báo doanh số ngày?</li></ol>
    say: Hãy kiểm tra lại hai câu hỏi chốt bài ngay dưới đây. Câu một, từ hai cột đầu vào, bộ đa thức bậc hai bỏ hằng số tạo
      ra tổng cộng mấy cột? Câu hai, vì sao không được xáo trộn ngẫu nhiên các ngày khi đánh giá dự báo chuỗi thời gian? Bấm
      tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① Tạo ra <code><b>5</b></code> cột: <code>x1, x2, x1^2,
      x1*x2, x2^2</code>.</p></td></tr></table>'
    say: 'Đáp án câu một: tổng cộng năm cột gồm hai biến gốc, hai bình phương và một tích chéo. Khi bỏ hằng số một, đa thức
      bậc hai giữ đúng năm biến phi tuyến cơ bản cho hai trục toạ độ đầu vào.'
