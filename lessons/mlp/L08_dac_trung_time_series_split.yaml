- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 100 // 4 == 25
  - 100 // 5 == 20
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.model_selection
      import KFold, TimeSeriesSplit</div><div>idx = np.arange(100)</div><div>kf_leak = any(tr.max() &gt; te.min() for tr,
      te in KFold(4, shuffle=True, random_state=42).split(idx))</div><div>ok = all(tr.max() &lt; te.min() for tr, te in TimeSeriesSplit(4).split(idx))</div><div>print(f'kfold_leak={int(kf_leak)}
      causal_time_order={int(ok)}')</div></div>
    say: Phép kiểm đối chiếu hai cách chia trên chuỗi một trăm ngày liên tiếp. Bộ chia xáo trộn ngẫu nhiên khiến tập huấn
      luyện lọt tương lai vượt tập kiểm tra. Trong khi đó bộ chia chuỗi thời gian giữ chỉ số huấn luyện luôn nhỏ hơn tập kiểm
      ở mọi nếp.
