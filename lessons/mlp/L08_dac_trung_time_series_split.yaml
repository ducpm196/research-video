- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L08
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L08</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Dùng
      TimeSeriesSplit bảo đảm mọi nếp kiểm tra luôn nằm sau tập huấn luyện về thời gian</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=300
      factor=0.4 noise=0.05 test_size=0.30 seed=42 degree=2 ts_splits=4 ts_len=100</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash
      labs/cham.sh MLP L08 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 8 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Cấu hình bộ chia chuỗi thời gian và bộ mở rộng đa thức bậc hai từ tham số luồng chuẩn trên môi trường CPU.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L08</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (phi tuyến)</b></td><td>So khớp đường cơ sở tuyến tính và <code>Pipeline</code> có <code>PolynomialFeatures(degree=...,
      include_bias=False)</code></td></tr><tr><td><b>Bước 2 (nhân quả)</b></td><td>Khởi tạo <code>TimeSeriesSplit(n_splits=ts_splits)</code>
      trên mảng <code>np.arange(ts_len)</code></td></tr><tr><td><b>Bước 3 (kiểm biên)</b></td><td>Xác nhận điều kiện <code>all(tr.max()
      &lt; te.min() ...)</code> giữ nguyên thứ tự quá khứ trước tương lai</td></tr></table>
    say: Bạn đọc cấu hình tập dữ liệu hình tròn đồng tâm và chuỗi thời gian từ luồng chuẩn. Hãy so sánh bộ phân loại tuyến
      tính thuần với mô hình thêm đặc trưng đa thức bậc chỉ định. Đồng thời kiểm tra bất biến thời gian trên toàn bộ các nếp
      phân chia. So sánh song song điểm số phân loại trước và sau mở rộng đa thức đồng thời kiểm tra chặt điều kiện nhân quả
      bốn nếp.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>linear_acc=0.456</div><div>poly2_acc=1.000</div><div>strict_causal_splits=1</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
