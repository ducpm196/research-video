- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 100 + 100 * 101 // 2 == 5150
  - 2 + 2 * 3 // 2 == 5
  steps:
  - show: <div class='box key'><p><b>1. Đường tròn đơn giản:</b> <code>x1^2 + x2^2 &lt; r^2</code> là tuyến tính hoàn toàn
      theo đặc trưng mới <code>z1=x1^2, z2=x2^2</code>.</p><p><b>2. Cửa sổ mở rộng:</b> nếp thứ <code>k</code> dùng quá khứ
      <code>[0..t_k]</code> để dự đoán tương lai <code>(t_k..t_{k+1}]</code>.</p></div>
    say: Hai nguyên lý đơn giản giải thích vì sao biến đổi đặc trưng và chia theo thời gian lại có sức mạnh lớn đến vậy. Bất
      đẳng thức hình tròn vốn cong trong mặt phẳng gốc bỗng biến thành mặt phẳng thẳng tắp khi ta cung cấp bình phương hai
      tọa độ. Còn cửa sổ thời gian luôn cuộn tiến về phía trước không bao giờ nhìn ngược. Việc tách định nghĩa tham số trên
      tập huấn luyện rất quan trọng vì nó quyết định độ trung thực của thước đo tổng quát. Mọi công thức chuyển đổi trước
      khi đóng gói ra sản phẩm đều phải giữ đúng giả định toán học ban đầu để không gây sai số tích lũy. Tính nhân quả bắt
      buộc mọi chỉ số thời gian của phần huấn luyện phải đứng trước hoàn toàn thời điểm của phần kiểm tra. Số lượng đặc trưng
      đa thức bậc hai tăng theo bình phương số cột gốc nên cần cân nhắc kỹ trên bảng nhiều chiều.
