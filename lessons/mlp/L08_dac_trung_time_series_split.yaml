- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Đa thức tách biên cong</span><span class="a">→</span><span class="n">Tránh nổ
      chiều bậc cao</span><span class="a">→</span><span class="n">TimeSeriesSplit giữ nhân quả</span></div>
    say: Tạo đặc trưng đa thức giải bài toán cong phi tuyến còn bộ chia chuỗi thời gian ngăn chặn tuyệt đối lỗi lấy dữ liệu
      tương lai dự đoán quá khứ. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng
      sau từng dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm
      tái lập chính xác trên nhiều máy. Khép kín bước tạo đặc trưng phi tuyến trong chuỗi xử lý và tôn trọng dòng thời gian
      là hai nguyên tắc cốt lõi dữ liệu chuỗi. Thử nghiệm kiểm chứng bảo đảm tính nhân quả thời gian không bao giờ bị vi phạm
      qua bất kỳ bước tiền xử lý nào.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L08:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 8 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Nắm
      chắc bộ kỹ năng học có giám sát theo thời gian là tiền đề để ta bước sang mảng học không có nhãn đúng sẵn. Kiểm thử
      chặt tính nhân quả bảo đảm mô hình dự báo tương lai đứng vững ngay khi triển khai thực tế.
    clear: true
    focus: null
