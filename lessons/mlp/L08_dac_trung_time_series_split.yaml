    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Vì xáo trộn đưa dữ liệu tương lai vào tập Train để đoán
      ngược quá khứ, gây rò rỉ nhân quả.</p></td></tr></table>
    say: 'Đáp án câu hai: vì nó cho phép mô hình nhìn thấy các ngày tương lai để đoán ngược lại quá khứ, làm sai lệch hoàn
      toàn độ chính xác thật. Kiểm chứng trên dữ liệu thời gian luôn bắt buộc tuân theo luồng chảy một chiều từ quá khứ sang
      tương lai.'
