- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Dùng <code>KFold(shuffle=True)</code>
      trên dữ liệu theo thời gian gây nhìn trộm tương lai.<br><b>Lỗi 2:</b> Đặt đa thức bậc 3–4 trên hàng trăm cột làm số
      chiều nổ hàng triệu cột.<br><b>Lỗi 3:</b> Tạo đặc trưng trượt trên toàn bảng trước khi chia tập Train/Test.</div></td></tr></table>
    say: Ba sai lầm chí tử khi xử lý đặc trưng và thời gian cần nhớ kỹ gồm những điểm sau. Một là xáo trộn ngẫu nhiên bảng
      giao dịch theo ngày, hai là lạm dụng đa thức bậc quá cao gây bùng nổ chiều. Và ba là tính trung bình trượt băng qua
      ranh giới tập kiểm tra. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều
      công gỡ lỗi về sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang
      bộ dữ liệu mới. Đưa tính năng đa thức vào ngoài chuỗi xử lý hoặc chọn bậc cao quá mức làm mô hình nặng nề và học vẹt
      nhiễu nhanh. Không bao giờ tính giá trị trung bình hay đặc trưng trễ trên toàn chuỗi trước khi chia ranh giới thời gian.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
