    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>predict_proba(X)[:, 1]</code></td><td>Lấy
      cột xác suất rơi vào lớp 1 từ bộ phân loại</td></tr><tr><td><code>confusion_matrix(y, pred)</code></td><td>Trả ma trận
      2x2 [[TN, FP], [FN, TP]] theo thứ tự nhãn</td></tr><tr><td><code>precision_score / recall_score / f1_score</code></td><td>Tính
      ba độ đo chất lượng từ nhãn thật và nhãn cắt theo ngưỡng</td></tr></table>
    say: Bảng ký hiệu tóm tắt cách lấy xác suất và tính bộ ba độ đo từ thư viện chuẩn. Cột chỉ số một, tức cột thứ hai của
      mảng xác suất, tương ứng với lớp một tức lớp dương tính ta đang quan tâm. Còn hàm ma trận nhầm lẫn sắp xếp cố định bốn
      ô đúng âm, giả dương, giả âm và đúng dương. Việc tách xác suất thô khỏi quyết định cuối cho phép cùng một mô hình phục
      vụ linh hoạt nhiều chính sách rủi ro khác nhau.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
