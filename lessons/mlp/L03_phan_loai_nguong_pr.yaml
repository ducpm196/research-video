      stroke-width="2"/><text x="790.0" y="75" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Đo
      P, R, F1</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Đánh đổi báo nhầm
      &amp; bỏ sót</text></svg></div>
    say: Quy trình tách hai khâu rõ ràng giữa dự báo xác suất và ra quyết định nhị phân. Khâu một đọc xác suất dự
      báo của lớp dương từ mô hình đã huấn luyện. Khâu hai thử cắt ở các ngưỡng khác nhau để cân bằng giữa độ chuẩn
      xác và độ phủ.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 4 / 5 == 0.8
  - 2 * 0.8 * 0.6 / (0.8 + 0.6) > 0.68
  steps:
  - show: <div class='box key'><p><b>1. Precision =</b> <code>TP / (TP + FP)</code> (trong số báo dương, bao nhiêu
      thật); <b>Recall =</b> <code>TP / (TP + FN)</code> (trong số dương thật, bắt được bao nhiêu).</p><p><b>2.
      F1 =</b> <code>2 * P * R / (P + R)</code> — trung bình điều hòa kéo về thước đo thấp hơn.</p></div>
    say: Hai công thức độ chuẩn xác và độ phủ đặt cạnh nhau để kiểm soát cả hai loại sai sót. Độ chuẩn xác chia
      số bắt trúng cho tổng số máy báo động nên phản ánh độ sạch của cảnh báo. Còn độ phủ chia số bắt trúng cho
      tổng số ca dương thật nên đo khả năng không bỏ lọt lưới.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 4 / 5 == 0.8
  - 2 * 0.8 * 0.6 / (0.8 + 0.6) > 0.68
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.pipeline import Pipeline</div><div>from
      sklearn.preprocessing import StandardScaler</div><div>from sklearn.linear_model import LogisticRegression</div><div>from
      sklearn.metrics import precision_score as P, recall_score as R, f1_score as F1</div><div>X, y = make_classification(n_samples=240,
      n_features=6, class_sep=0.6, random_state=42)</div><div>X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25,
      stratify=y, random_state=42)</div><div>pipe = Pipeline([('s', StandardScaler()), ('c', LogisticRegression(random_state=42))]).fit(X_tr,
      y_tr)</div><div>p = pipe.predict_proba(X_te)[:, 1]</div><div>for t in (0.50, 0.30):</div><div>    pr = (p
      &gt;= t).astype(int)</div><div>    print(f't={t:.2f} P={P(y_te,pr):.3f} R={R(y_te,pr):.3f} F1={F1(y_te,pr):.3f}')</div></div>
    say: Đoạn mã huấn luyện chuỗi chuẩn hóa cộng hồi quy logistic trên một trăm tám mươi mẫu và chấm thử sáu mươi
      mẫu kiểm tra. Sau đó chỉ từ cùng một mảng xác suất đầu ra, ta so sánh bộ ba chỉ số tại hai ngưỡng không phẩy
      năm và không phẩy ba. Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>t=0.50 P=0.875 R=0.700
      F1=0.778</div><div>t=0.30 P=0.862 R=0.833 F1=0.847</div></div>
    say: Đầu ra chạy thật cho thấy khi giảm ngưỡng xuống không phẩy ba, độ phủ tăng vọt vì ít ca dương bị bỏ sót
      hơn. Ngược lại độ chuẩn xác giảm nhẹ do có thêm một số trường hợp ngưỡng ranh giới bị gán nhãn dương.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 4 / 5 == 0.8
  - 2 * 0.8 * 0.6 / (0.8 + 0.6) > 0.68
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>from sklearn.metrics import confusion_matrix</div><div>y_true
      = [0, 0, 1, 1, 1]; p = [0.20, 0.40, 0.35, 0.60, 0.80]</div><div>tn5, fp5, fn5, tp5 = confusion_matrix(y_true,
      [int(x &gt;= 0.5) for x in p]).ravel()</div><div>tn3, fp3, fn3, tp3 = confusion_matrix(y_true, [int(x &gt;=
      0.3) for x in p]).ravel()</div><div>print(f'at50_tp={tp5}_fn={fn5}_fp={fp5} at30_tp={tp3}_fn={fn3}_fp={fp3}')</div></div>
    say: Để kiểm tay từng ô của ma trận nhầm lẫn, ta xét năm mẫu nhỏ có sẵn xác suất dự báo. Ở ngưỡng không phẩy
      năm, điểm không phẩy ba lăm bị xếp vào âm tính giả. Còn hạ xuống ngưỡng không phẩy ba thì bắt trúng thêm điểm
      đó nhưng đồng thời dính thêm một ca báo nhầm tại mức không phẩy bốn. Phép kiểm chứng này rất quan trọng vì
      đối chiếu độc lập giúp phát hiện ngay sai lệch.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>at50_tp=2_fn=1_fp=0 at30_tp=3_fn=0_fp=1</div></div>
    say: Kết quả chạy kiểm chứng khớp tuyệt đối với phép đếm tay từng ô. Vì vậy mỗi khi điều chỉnh ngưỡng, số ca
      đúng dương luôn biến thiên cùng chiều hoặc giữ nguyên, kéo theo đánh đổi rõ giữa bỏ sót và báo nhầm.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
