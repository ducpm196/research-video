    say: Quy trình tách hai khâu rõ ràng giữa dự báo xác suất và ra quyết định nhị phân. Khâu một đọc xác suất dự báo của
      lớp dương từ mô hình đã huấn luyện. Khâu hai thử cắt ở các ngưỡng khác nhau để cân bằng giữa độ chuẩn xác và độ phủ.
      Thanh trượt ngưỡng đóng vai trò van điều chỉnh cân bằng giữa số ca bắt sót và số lượt báo động giả trên hệ thống.
