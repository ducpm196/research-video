scenes:
- id: hook
  kind: hook
  title: Ngưỡng quyết định & cân bằng Precision–Recall
  checks:
  - round(2 * 0.875 * 0.7 / (0.875 + 0.7), 3) == 0.778
  - round(2 * 0.862 * 0.833 / (0.862 + 0.833), 3) == 0.847
  steps:
  - show: <div class='box key'><p>Đọc xác suất <code>p = predict_proba(X)[:, 1]</code> rồi áp ngưỡng tự chọn <code>(p >= t)</code>.
      Hạ <code>t</code> từ <b>0.50</b> xuống <b>0.30</b> luôn kéo độ phủ <code>Recall</code> tăng hoặc bằng, đổi lại có thể
      tăng báo nhầm.</p></div>
    say: Một mô hình sàng lọc rủi ro có xác suất dự báo khá tốt. Nhưng vẫn làm mất nhiều tiền chỉ vì lập trình viên giữ nguyên
      hàm dự đoán mặc định cắt ở ngưỡng năm mươi phần trăm. Khi hạ ngưỡng xuống ba mươi phần trăm, số ca thật bị bỏ sót giảm
      rõ rệt mà không tốn thêm một giây huấn luyện nào. Hôm nay ta kiểm soát trực tiếp ngưỡng quyết định và ma trận nhầm lẫn.
      Ngưỡng năm mươi phần trăm ngầm giả định chi phí bỏ sót một ca gian lận bằng đúng chi phí kiểm tra nhầm một khách tốt.
    clear: true
    focus: null
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Chuỗi phân loại tuyến tính (MLP:L00)</td><td>Hồi
      quy logistic trả về xác suất p từ 0 đến 1</td></tr><tr><td>Chi phí sai số bất đối xứng</td><td>Bỏ sót ca bệnh hoặc gian
      lận đắt hơn gấp nhiều lần báo động nhầm</td></tr><tr><td>Tách biệt mô hình và ngưỡng</td><td>Thay đổi ngưỡng quyết định
      không cần huấn luyện lại trọng số</td></tr></table>
    say: Bài ba chuyển sang bài toán phân loại nhị phân và trả lời câu hỏi quan trọng khi ra quyết định. Hồi quy logistic
      thực chất xuất ra một xác suất từ không tới một, còn hàm dự đoán mặc định chỉ là phép cắt ngang tại mức không phẩy năm.
      Khi chi phí bỏ sót đắt hơn báo động giả, ta phải dịch ngưỡng cắt cho đúng bài toán. Thay đổi ngưỡng quyết định trên
      xác suất đầu ra là cách điều chỉnh nhanh nhất theo bài toán nghiệp vụ mà không cần huấn luyện lại toàn bộ mô hình. Quy
      trình này liên kết chặt chẽ từ khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa
      giả thiết thuật toán và giới hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Mỗi bài
      toán kinh doanh thực tế có tỉ lệ đánh đổi rủi ro hoàn toàn riêng biệt chứ không bao giờ mặc định đối xứng.
    focus:
