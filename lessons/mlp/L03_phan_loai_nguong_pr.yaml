  steps:
  - show: '<table class=''t''><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Ngưỡng
      cứng 0.50 mặc định</td><td>Tối ưu độ chính xác 0-1 đối xứng</td><td>Không phù hợp khi bỏ sót đắt hơn báo nhầm</td></tr><tr><td>Điều
      chỉnh ngưỡng t trên tập Val</td><td>Chỉnh 1 con số không cần train lại</td><td>Cẩn thận: tuyệt đối không tìm
      t trên tập Test cuối</td></tr><tr><td>Chi phí FN = 10 x FP</td><td>Ưa ngưỡng thấp hơn (0.20 - 0.35)</td><td>Giảm
      tổng thiệt hại tài chính trên thực tế</td></tr></table>'
    say: Bảng quy mô nhấn mạnh một nguyên tắc ranh giới chống rò rỉ dữ liệu khi chọn ngưỡng. Nếu tìm ngưỡng đẹp
      nhất trực tiếp trên tập kiểm tra cuối cùng thì vẫn là gian lận ngầm; ngưỡng phải chốt xong trên tập thẩm định
      trước.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Quét tìm ngưỡng tốt nhất trên tập Test cuối cùng gây rò rỉ gián tiếp.<br><b>Lỗi 2 (-20đ):</b> Gọi <code>predict()</code>
      thay vì <code>predict_proba()</code> làm mất xác suất để dịch ngưỡng.<br><b>Lỗi 3 (-10đ):</b> Đọc nhầm vị
      trí cột xác suất <code>[:, 0]</code> thay vì lớp dương <code>[:, 1]</code>.</div></td></tr></table>
    say: Bạn tránh ba lỗi thường gặp khi làm việc với ngưỡng phân loại sau đây. Một là tinh chỉnh ngưỡng ngay trên
      tập kiểm tra cuối, hai là chỉ gọi hàm dự đoán nhãn cứng nên mất xác suất. Và ba là lấy nhầm cột xác suất của
      lớp không thay vì lớp một. Bạn hãy rà soát từng lỗi trên trước khi chuyển sang phần tự làm bài tập thực hành
      trên máy.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
