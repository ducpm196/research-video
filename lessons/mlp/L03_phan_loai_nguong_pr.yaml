scenes:
- id: hook
  kind: hook
  title: Phân loại nhị phân, ngưỡng quyết định & cân bằng Precision
  checks:
  - 4 / 5 == 0.8
  - 2 * 0.8 * 0.6 / (0.8 + 0.6) > 0.68
  steps:
  - show: <div class='box key'><p>Đọc xác suất <code>p = predict_proba(X)[:, 1]</code> rồi áp ngưỡng tự chọn <code>(p
      >= t)</code>. Hạ <code>t</code> từ <b>0.50</b> xuống <b>0.30</b> luôn kéo độ phủ <code>Recall</code> tăng
      hoặc bằng, đổi lại có thể tăng báo nhầm.</p></div>
    say: Một mô hình sàng lọc rủi ro có xác suất dự báo khá tốt. Nhưng vẫn làm mất nhiều tiền chỉ vì lập trình viên
      giữ nguyên hàm dự đoán mặc định cắt ở ngưỡng năm mươi phần trăm. Khi hạ ngưỡng xuống ba mươi phần trăm, số
      ca thật bị bỏ sót giảm rõ rệt mà không tốn thêm một giây huấn luyện nào. Hôm nay ta kiểm soát trực tiếp ngưỡng
      quyết định và ma trận nhầm lẫn.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Chuỗi phân loại tuyến
      tính (MLP:L00)</td><td>Hồi quy logistic trả về xác suất p từ 0 đến 1</td></tr><tr><td>Chi phí sai số bất đối
      xứng</td><td>Bỏ sót ca bệnh hoặc gian lận đắt hơn gấp nhiều lần báo động nhầm</td></tr><tr><td>Tách biệt mô
      hình và ngưỡng</td><td>Thay đổi ngưỡng quyết định không cần huấn luyện lại trọng số</td></tr></table>
    say: Bài ba chuyển sang bài toán phân loại nhị phân và trả lời câu hỏi quan trọng khi ra quyết định. Hồi quy
      logistic thực chất xuất ra một xác suất từ không tới một, còn hàm dự đoán mặc định chỉ là phép cắt ngang tại
      mức không phẩy năm. Khi chi phí bỏ sót đắt hơn báo động giả, ta phải dịch ngưỡng cắt cho đúng bài toán. Đây
      là nền tảng trực tiếp để thiết kế đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>predict_proba(X)[:,
      1]</code></td><td>Lấy cột xác suất rơi vào lớp 1 từ bộ phân loại</td></tr><tr><td><code>confusion_matrix(y,
      pred)</code></td><td>Trả ma trận 2x2 [[TN, FP], [FN, TP]] theo thứ tự nhãn</td></tr><tr><td><code>precision_score
      / recall_score / f1_score</code></td><td>Tính ba độ đo chất lượng từ nhãn thật và nhãn cắt theo ngưỡng</td></tr></table>
    say: Bảng ký hiệu tóm tắt cách lấy xác suất và tính bộ ba độ đo từ thư viện chuẩn. Cột thứ nhất của mảng xác
      suất tương ứng với lớp một tức lớp dương tính ta đang quan tâm. Còn hàm ma trận nhầm lẫn sắp xếp cố định bốn
      ô đúng âm, giả dương, giả âm và đúng dương.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Cơ chế vận hành trực quan
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700"
