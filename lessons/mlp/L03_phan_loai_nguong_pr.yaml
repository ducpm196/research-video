- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Quét tìm ngưỡng
      tốt nhất trên tập Test cuối cùng gây rò rỉ gián tiếp.<br><b>Lỗi 2:</b> Gọi <code>predict()</code> thay vì <code>predict_proba()</code>
      làm mất xác suất để dịch ngưỡng.<br><b>Lỗi 3:</b> Đọc nhầm vị trí cột xác suất <code>[:, 0]</code> thay vì lớp dương
      <code>[:, 1]</code>.</div></td></tr></table>
    say: Bạn tránh ba lỗi thường gặp khi làm việc với ngưỡng phân loại sau đây. Một là tinh chỉnh ngưỡng ngay trên tập kiểm
      tra cuối, hai là chỉ gọi hàm dự đoán nhãn cứng nên mất xác suất. Và ba là lấy nhầm cột xác suất của lớp không thay vì
      lớp một. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ lỗi về
      sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu mới.
      Tối ưu ngưỡng trực tiếp trên tập kiểm tra cuối cùng gây rò rỉ thông tin ngưỡng vào đánh giá hiệu năng độc lập. Quên
      chia tách tập thẩm định riêng để chọn ngưỡng làm con số báo cáo đẹp ảo so với dữ liệu khách hàng thật. Chỉ nhìn độ chính
      xác tổng thể khi ngưỡng cứng không phẩy năm thường bỏ lọt phần lớn ca thiểu số quan trọng.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - round(2 * 0.875 * 0.7 / (0.875 + 0.7), 3) == 0.778
  - 3 / (3 + 1) == 0.75
  steps:
  - show: <ol><li>Hạ ngưỡng quyết định từ <code>0.50</code> xuống <code>0.30</code> tác động thế nào tới số ca <code>Recall</code>
      và <code>FP</code>?</li><li>Có được tìm ngưỡng tối ưu trực tiếp trên tập Test cuối cùng không?</li></ol>
    say: Mời bạn dừng hình trả lời hai câu hỏi ôn tập sau. Câu một, khi hạ ngưỡng cắt từ không phẩy năm xuống không phẩy ba
      thì độ phủ và số ca báo nhầm đổi theo chiều nào? Câu hai, có được chọn ngưỡng tối ưu trực tiếp trên tập kiểm tra cuối
      không? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <b>Recall</b> tăng (hoặc giữ nguyên vì ít <code>FN</code>
      hơn), đổi lại số ca báo nhầm <code><b>FP</b></code> có xu hướng tăng.</p></td></tr></table>
    say: 'Đáp án câu một: độ phủ tăng lên vì bắt thêm ca dương, nhưng số báo động nhầm cũng có thể tăng lên. Các ứng dụng
      y tế hay phát hiện lỗi nguy hiểm chấp nhận giảm chuẩn xác một chút để bảo đảm độ phủ gần như tuyệt đối.'
    clear: true
    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <b>Không</b> — phải chọn ngưỡng trên tập Validation
      hoặc từ CV, rồi mới đo một lần cuối trên Test.</p></td></tr></table>
    say: 'Đáp án câu hai: tuyệt đối không, ngưỡng phải được chọn trên tập thẩm định để giữ tập kiểm tra hoàn toàn sạch. Bảo
      vệ tập kiểm tra nguyên vẹn tới tận bước chốt điểm cuối giúp báo cáo phản ánh trung thực năng lực mô hình.'
    clear: true
    focus: null
- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L03
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L03</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Thay
      đổi ngưỡng phân loại p >= threshold thay vì mặc định 0.50 để đo độ phủ Recall</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=240
      n_features=6 test_size=0.25 seed=42 th_hi=0.50 th_lo=0.30</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash
      labs/cham.sh MLP L03 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 3 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Đọc hai giá trị ngưỡng từ luồng chuẩn rồi áp lên cùng véc-tơ xác suất dự báo để tính cặp độ phủ tương ứng.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L03</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (xác suất)</b></td><td>Khớp <code>Pipeline</code> và lấy cột xác suất dương <code>predict_proba(X_te)[:, 1]</code></td></tr><tr><td><b>Bước
      2 (hai ngưỡng)</b></td><td>Ép kiểu nhị phân tại <code>p &gt;= th_hi</code> và <code>p &gt;= th_lo</code> bằng hàm <code>recall_score</code></td></tr><tr><td><b>Bước
      3 (đơn điệu)</b></td><td>Kiểm bất biến hàm không giảm <code>r_lo &gt;= r_hi</code> khi hạ ngưỡng quyết định</td></tr></table>
    say: Đầu tiên bạn chia tập phân tầng và huấn luyện chuỗi phân loại để lấy mảng xác suất dương tính dự báo qua hàm dự báo
      xác suất. Kế tiếp bạn chuyển đổi thành dự đoán nhị phân tại hai ngưỡng cao và thấp từ luồng chuẩn để đo độ phủ. Kiểm
      tra bất biến đơn điệu của độ phủ tại hai mốc ngưỡng trước khi xuất kết quả cuối cùng ra màn hình.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>r_at_50=0.933</div><div>r_at_30=0.933</div><div>recall_monotone_non_decreasing=1</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Đọc xác suất lớp 1</span><span class="a">→</span><span class="n">Đặt ngưỡng theo
      chi phí</span><span class="a">→</span><span class="n">Giữ Test sạch khỏi chọn ngưỡng</span></div>
    say: Ba chốt chặn đánh giá phân loại kết nối từ ma trận nhầm lẫn tới điều chỉnh ngưỡng xác suất và cân bằng điểm F1 theo
      chi phí nghiệp vụ. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng sau từng
      dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm tái lập
      chính xác trên nhiều máy. Luôn đọc xác suất dự báo thay vì nhãn cứng, đồng thời chọn ngưỡng trên tập thẩm định theo
      bài toán chi phí nghiệp vụ. Hiểu rõ ma trận nhầm lẫn tại từng mốc ngưỡng giúp đội kỹ thuật trao đổi trực tiếp bằng con
      số với đội vận hành.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L03:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 3 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Nắm
      chắc nghệ thuật chỉnh ngưỡng biến mô hình phân loại tuyến tính thành công cụ ra quyết định kinh tế sắc bén. Kiểm soát
      tốt đường cong chuẩn xác phủ giúp mô hình thích ứng nhanh khi chi phí nghiệp vụ thay đổi theo mùa.
    clear: true
    focus: null
