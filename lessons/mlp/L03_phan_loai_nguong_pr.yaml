- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round(2 * 0.875 * 0.7 / (0.875 + 0.7), 3) == 0.778
  - round(2 * 0.862 * 0.833 / (0.862 + 0.833), 3) == 0.847
  steps:
  - show: <div class='box key'><p><b>1. Precision =</b> <code>TP / (TP + FP)</code> (trong số báo dương, bao nhiêu thật);
      <b>Recall =</b> <code>TP / (TP + FN)</code> (trong số dương thật, bắt được bao nhiêu).</p><p><b>2. F1 =</b> <code>2
      * P * R / (P + R)</code> — trung bình điều hòa kéo về thước đo thấp hơn.</p></div>
    say: Hai công thức độ chuẩn xác và độ phủ đặt cạnh nhau để kiểm soát cả hai loại sai sót. Độ chuẩn xác chia số bắt trúng
      cho tổng số máy báo động nên phản ánh độ sạch của cảnh báo. Còn độ phủ chia số bắt trúng cho tổng số ca dương thật nên
      đo khả năng không bỏ lọt lưới. Độ chuẩn xác và độ phủ luôn giằng co nhau theo chiều ngược lại mỗi khi ta dịch chuyển
      ranh giới phân loại nhị phân. Điểm hài hòa ghép hai thước đo lại thành một con số duy nhất nhằm phát hiện trường hợp
      một vế sụp đổ về không.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - round(240 * 0.25) == 60
  - round(2 * 0.862 * 0.833 / (0.862 + 0.833), 3) == 0.847
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.pipeline import Pipeline</div><div>from sklearn.preprocessing
      import StandardScaler</div><div>from sklearn.linear_model import LogisticRegression</div><div>from sklearn.metrics import
      precision_score as P, recall_score as R, f1_score as F1</div><div>X, y = make_classification(n_samples=240, n_features=6,
      class_sep=0.6, random_state=42)</div><div>X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y,
      random_state=42)</div><div>pipe = Pipeline([('s', StandardScaler()), ('c', LogisticRegression(random_state=42))]).fit(X_tr,
      y_tr)</div><div>p = pipe.predict_proba(X_te)[:, 1]</div><div>for t in (0.50, 0.30):</div><div>    pr = (p &gt;= t).astype(int)</div><div>    print(f't={t:.2f}
      P={P(y_te,pr):.3f} R={R(y_te,pr):.3f} F1={F1(y_te,pr):.3f}')</div></div>
    say: Đoạn mã huấn luyện chuỗi chuẩn hóa cộng hồi quy logistic trên một trăm tám mươi mẫu và chấm thử sáu mươi mẫu kiểm
      tra. Sau đó chỉ từ cùng một mảng xác suất đầu ra, ta so sánh bộ ba chỉ số tại hai ngưỡng không phẩy năm và không phẩy
      ba. Từng dòng mã chạy xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. So sánh
      tại ngưỡng không phẩy năm và không phẩy ba trên đúng cùng mảng xác suất không cần huấn luyện lại mô hình.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>t=0.50 P=0.875 R=0.700 F1=0.778</div><div>t=0.30
      P=0.862 R=0.833 F1=0.847</div></div>
    say: Đầu ra chạy thật cho thấy khi giảm ngưỡng xuống không phẩy ba, độ phủ tăng vọt vì ít ca dương bị bỏ sót hơn. Ngược
      lại độ chuẩn xác giảm nhẹ do có thêm một số trường hợp ngưỡng ranh giới bị gán nhãn dương. Giá trị đầu ra thu được khớp
      chặt với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết. Động tác hạ ngưỡng mở rộng lưới quét để bắt
      thêm nhiều trường hợp dương tính ẩn nấp gần đường biên nghi ngờ.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 2 / (2 + 1) < 3 / (3 + 0)
  - 3 / (3 + 1) == 0.75
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>from sklearn.metrics import confusion_matrix</div><div>y_true
      = [0, 0, 1, 1, 1]; p = [0.20, 0.40, 0.35, 0.60, 0.80]</div><div>tn5, fp5, fn5, tp5 = confusion_matrix(y_true, [int(x
      &gt;= 0.5) for x in p]).ravel()</div><div>tn3, fp3, fn3, tp3 = confusion_matrix(y_true, [int(x &gt;= 0.3) for x in p]).ravel()</div><div>print(f'at50_tp={tp5}_fn={fn5}_fp={fp5}
      at30_tp={tp3}_fn={fn3}_fp={fp3}')</div></div>
    say: Để kiểm tay từng ô của ma trận nhầm lẫn, ta xét năm mẫu nhỏ có sẵn xác suất dự báo. Ở ngưỡng không phẩy năm, điểm
      không phẩy ba lăm bị xếp vào âm tính giả. Còn hạ xuống ngưỡng không phẩy ba thì bắt trúng thêm điểm đó nhưng đồng thời
      dính thêm một ca báo nhầm tại mức không phẩy bốn. Việc đối chứng hai cách xử lý song song rất cần thiết vì bằng chứng
      thực nghiệm giúp loại bỏ hoàn toàn phỏng đoán cảm tính. Năm mẫu nhỏ minh hoạ trực tiếp cách dịch chuyển từng trường
      hợp từ cột âm tính giả sang cột dương tính thật.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>at50_tp=2_fn=1_fp=0 at30_tp=3_fn=0_fp=1</div></div>
    say: Kết quả chạy kiểm chứng khớp tuyệt đối với phép đếm tay từng ô. Vì vậy mỗi khi điều chỉnh ngưỡng, số ca đúng dương
      luôn biến thiên cùng chiều hoặc giữ nguyên, kéo theo đánh đổi rõ giữa bỏ sót và báo nhầm. Kết quả kiểm chứng khẳng định
      quy luật toán học không đổi khi kiểm thử độc lập. Số lượng dương tính thật luôn là hàm không giảm khi bạn hạ dần ngưỡng
      cắt xác suất xuống mức thấp hơn.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - round(240 * 0.25) == 60
  - 3 / (3 + 1) == 0.75
  steps:
  - show: '<table class=''t''><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Ngưỡng cứng
      0.50 mặc định</td><td>Tối ưu độ chính xác 0-1 đối xứng</td><td>Không phù hợp khi bỏ sót đắt hơn báo nhầm</td></tr><tr><td>Điều
      chỉnh ngưỡng t trên tập Val</td><td>Chỉnh 1 con số không cần train lại</td><td>Cẩn thận: tuyệt đối không tìm t trên
      tập Test cuối</td></tr><tr><td>Chi phí FN = 10 x FP</td><td>Ưa ngưỡng thấp hơn (0.20 - 0.35)</td><td>Giảm tổng thiệt
      hại tài chính trên thực tế</td></tr></table>'
    say: Bảng quy mô nhấn mạnh một nguyên tắc ranh giới chống rò rỉ dữ liệu khi chọn ngưỡng. Nếu tìm ngưỡng đẹp nhất trực
      tiếp trên tập kiểm tra cuối cùng thì vẫn là gian lận ngầm; ngưỡng phải chốt xong trên tập thẩm định trước. Trong các
      hệ thống chấm điểm rủi ro lớn, bảng đánh đổi độ chuẩn xác theo từng mốc ngưỡng giúp đội vận hành chọn điểm cắt phù hợp
      năng lực rà soát thủ công. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin cậy ở cấp
      độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch vụ không
      tụt hiệu năng hay sập bộ nhớ. Trên hàng triệu giao dịch, thay đổi ngưỡng thêm vài phần trăm tác động ngay tới tải xử
      lý của đội ngũ thẩm định viên. Ngưỡng chọn trên tập thẩm định cần được khoá cứng trước khi đo bất kỳ điểm số nào trên
      tập kiểm tra cuối cùng.
    focus:
