- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Tăng cả <code>learning_rate=0.5</code>
      lẫn <code>max_iter=500</code> khiến mô hình quá khớp dữ dội.<br><b>Lỗi 2:</b> Tưởng nhầm rừng ngẫu nhiên và tăng cường
      độ dốc giống nhau nên không chỉnh tỉ lệ giữa tốc độ học và số cây.<br><b>Lỗi 3:</b> Bỏ quên hạt giống ngẫu nhiên khi
      so sánh các bộ siêu tham số.</div></td></tr></table>
    say: Hãy tránh ba sai lầm sau khi điều chỉnh bộ tăng cường độ dốc. Đầu tiên là đẩy cả bước học lẫn số cây lên quá cao
      làm mô hình học cả nhiễu. Thứ hai là nhầm lẫn giữa trồng song song của rừng ngẫu nhiên và cộng nối tiếp trên phần dư.
      Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ lỗi về sau. Hãy
      kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu mới. Quên dành
      riêng tập dừng sớm làm tăng cường độ dốc dễ tiếp tục học nhiễu khi số vòng lặp kéo quá dài. Khác với hồi quy tuyến tính,
      bộ tăng cường dựa trên cây gom giỏ còn xử lý tự nhiên các giá trị khuyết thiếu có sẵn.
    focus:
    - 0
