scenes:
- id: hook
  kind: hook
  title: Tăng cường độ dốc HistGradientBoosting học từ phần dư
  checks:
  - 0.0 + 0.1 * 10.0 == 1.0
  - 256 == 2 ** 8
  steps:
  - show: <div class='box key'><p>Cập nhật tuần tự <code>F_m(x) = F_{m-1}(x) + lr * h_m(x)</code>. Giảm <code>lr</code>
      từ <code>1.0</code> xuống <b>0.10</b> buộc mô hình học chậm và mượt qua từng cây nông thay vì nhớ nhiễu.</p></div>
    say: Trên các bảng dữ liệu tài chính hay thương mại điện tử có vài trăm nghìn dòng. Bộ phân loại tăng cường
      độ dốc theo giỏ dữ liệu thường vượt trội cả hồi quy lẫn rừng ngẫu nhiên. Bí mật nằm ở tốc độ gom cột thành
      hai trăm năm mươi sáu giỏ và học nối tiếp trên phần dư. Hôm nay ta chạy trực tiếp bộ phân loại này trên CPU
      trong chưa tới một giây.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Rừng ngẫu nhiên trồng
      song song (MLP:L06)</td><td>Nhiều cây độc lập bỏ phiếu cùng lúc giảm phương sai</td></tr><tr><td>Chiến lược
      sửa sai nối tiếp (Boosting)</td><td>Mỗi cây nông kế tiếp học trực tiếp trên phần dư sai số còn sót</td></tr><tr><td>Tốc
      độ học learning_rate</td><td>Bước nhỏ 0.05-0.10 giúp tổng tích lũy không vọt lố theo nhiễu</td></tr></table>
    say: Nếu rừng ngẫu nhiên trồng hàng chục cây song song rồi lấy trung bình, thì tăng cường độ dốc trồng từng
      cây nối đuôi nhau. Cây sau chỉ tập trung sửa chính phần sai số mà tổng các cây trước còn để sót lại. Nhờ vậy
      mô hình cây nông vẫn đạt độ chính xác rất cao trên dữ liệu bảng thực tế. Đây là nền tảng trực tiếp để thiết
      kế đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>HistGradientBoostingClassifier</code></td><td>Bộ
      tăng cường độ dốc nhanh dựa trên histogram trên CPU</td></tr><tr><td><code>learning_rate=0.1</code></td><td>Hệ
      số co nhỏ bước cộng của mỗi cây mới</td></tr><tr><td><code>max_iter=40</code></td><td>Số lượng cây tuần tự
      tối đa được cộng thêm</td></tr></table>
    say: Bảng ký hiệu liệt kê tên lớp và hai siêu tham số cặp đôi luôn đi cùng nhau trong tăng cường độ dốc. Tốc
      độ học nhỏ cần nhiều vòng lặp hơn một chút nhưng giảm rủi ro nhảy vọt quá đà, còn số vòng lặp tối đa chặn
      tổng số cây nối đuôi.
    focus:
