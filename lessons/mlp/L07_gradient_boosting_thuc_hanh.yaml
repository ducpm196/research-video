  - show: <div class='box ok'><b>Hoàn thành MLP:L07:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 7 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Dù
      thuật toán mạnh tới đâu, chất lượng đầu vào và cách chia theo trục thời gian vẫn luôn giữ vai trò quyết định thành bại.
