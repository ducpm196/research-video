  - round(10.0 - 7.29, 3) == 2.71
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>target, f, lr = 10.0, 0.0, 0.1</div><div>for step in
      range(3):</div><div>    res = target - f</div><div>    f += lr * res</div><div>print(f'after_3_steps={f:.3f} remaining_res={target
      - f:.3f}')</div></div>
    say: Phép kiểm chứng thứ hai mô phỏng trực tiếp ba bước cộng dồn phần dư với mục tiêu bằng mười và bước học không phẩy
      một. Sau mỗi vòng, phần dư còn lại giảm dần theo cấp số nhân chín phần mười. Phép kiểm chứng minh hoạ cách điều chỉnh
      tốc độ học phối hợp số vòng lặp để quá trình cộng dồn phần dư hội tụ mượt mà không quá khớp. Khi tốc độ học vừa phải,
      đường sai số đi xuống đều đặn qua từng nhịp thay vì bật vọt lố mục tiêu. Việc đối chứng hai cách xử lý song song rất
      cần thiết vì bằng chứng thực nghiệm giúp loại bỏ hoàn toàn phỏng đoán cảm tính. Ba bước mô phỏng số học đơn giản tái
      hiện chính xác quy luật suy giảm theo cấp số nhân của phần dư qua từng vòng.
