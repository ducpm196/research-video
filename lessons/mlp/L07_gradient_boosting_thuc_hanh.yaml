      từ <code>0.2</code> xuống <code>0.05</code>, thường cần tăng hay giảm <code>max_iter</code>?</li></ol>
    say: Mời bạn tự kiểm tra nhanh hai câu hỏi cho bài bảy. Câu một, mỗi cây mới trong tăng cường độ dốc học để khớp vào đại
      lượng nào của các cây trước? Câu hai, khi giảm tốc độ học đi bốn lần thì thường phải tăng hay giảm số cây? Bấm tạm dừng
      và trả lời.
