      còn lại rồi nhân thêm tốc độ học nhỏ trước khi cộng vào mô hình tổng. Kết hợp cơ chế dừng sớm khi điểm thẩm định ngừng
      cải thiện, mô hình tự dừng đúng lúc. Hình ảnh cộng dồn các bước chỉnh nhỏ liên tục cho thấy toàn bộ sai số còn sót lại
      co hẹp dần sau mỗi thế hệ cây.
