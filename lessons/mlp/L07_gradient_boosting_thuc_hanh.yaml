      2 (-20đ):</b> Tưởng nhầm rừng ngẫu nhiên và tăng cường độ dốc giống nhau nên không chỉnh tỉ lệ giữa tốc độ
      học và số cây.<br><b>Lỗi 3 (-10đ):</b> Bỏ quên hạt giống ngẫu nhiên khi so sánh các bộ siêu tham số.</div></td></tr></table>
    say: Hãy tránh ba sai lầm sau khi điều chỉnh bộ tăng cường độ dốc. Đầu tiên là đẩy cả bước học lẫn số cây lên
      quá cao làm mô hình học cả nhiễu. Thứ hai là nhầm lẫn giữa trồng song song của rừng ngẫu nhiên và cộng nối
