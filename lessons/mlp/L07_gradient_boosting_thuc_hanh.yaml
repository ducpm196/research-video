- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 0.0 + 0.1 * 10.0 == 1.0
  - 256 == 2 ** 8
  steps:
  - show: <div class='box key'><p><b>1. Cộng dồn tăng cường:</b> <code>F_M(x) = F_0 + lr * sum_{m=1..M} h_m(x)</code>.</p><p><b>2.
      Giỏ histogram:</b> rời rạc hóa biến liên tục thành tối đa <code>255</code> giỏ số nguyên nên tìm ngưỡng cắt
      nhanh gấp nhiều lần.</p></div>
    say: Công thức thứ nhất cho thấy đầu ra cuối là tổng có trọng số của chuỗi cây nối tiếp nhau, trong đó mỗi cây
      nhân với hệ số bước học nhỏ. Nhờ gom giá trị số liên tục vào tối đa hai trăm năm mươi lăm giỏ cố định. Máy
      chỉ cần duyệt vài trăm ngưỡng thay vì sắp xếp lại hàng triệu điểm.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 0.0 + 0.1 * 10.0 == 1.0
  - 256 == 2 ** 8
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.ensemble import HistGradientBoostingClassifier</div><div>X,
      y = make_classification(n_samples=600, n_features=12, n_informative=6, random_state=42)</div><div>X_tr, X_te,
      y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)</div><div>hgb = HistGradientBoostingClassifier(max_iter=50,
      learning_rate=0.1, random_state=42).fit(X_tr, y_tr)</div><div>print(f'n_iter={hgb.n_iter_} tr={hgb.score(X_tr,y_tr):.3f}
      te={hgb.score(X_te,y_te):.3f}')</div></div>
    say: Đoạn mã huấn luyện năm mươi vòng tăng cường độ dốc với tốc độ học không phẩy một trên sáu trăm mẫu dữ liệu.
      Bộ chia vẫn giữ nguyên cấu trúc phân tầng và hạt giống bốn hai để đối chứng công bằng. Ta chạy thực nghiệm
      này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>n_iter=50 tr=1.000 te=0.900</div></div>
    say: Kết quả chạy thật trên CPU hoàn thành trong tích tắc và đạt độ chính xác cao trên tập kiểm tra. Do tốc
      độ học nhỏ kết hợp cây giới hạn độ sâu mặc định nên mô hình không bị rơi vào vũng lầy học thuộc nhiễu.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
