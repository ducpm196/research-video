      cần nhiều vòng lặp hơn một chút nhưng giảm rủi ro nhảy vọt quá đà, còn số vòng lặp tối đa chặn tổng số cây nối đuôi.
      Cặp đôi bước học nhỏ và số vòng lặp vừa đủ giữ tiến trình hạ sai số ổn định, không nhảy vọt quá mức tối ưu.
