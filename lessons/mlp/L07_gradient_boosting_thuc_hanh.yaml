- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - 255 + 1 == 256
  - round(600 * 0.25) == 150
  steps:
  - show: '<table class=''t''><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>100 000 dòng
      dữ liệu bảng</td><td>So sánh với RandomForest: chậm hơn trên dữ liệu lớn</td><td>Chạy HistGradientBoostingClassifier
      trên dữ liệu bảng nhanh hơn nhờ 255 giỏ</td></tr><tr><td>Tăng lr=0.5 + max_iter=500</td><td>Đạt Train 100% rất sớm</td><td>Bật
      early_stopping=True + giảm lr về 0.05..0.10</td></tr><tr><td>Bảng có ô NaN rải rác</td><td>Mô hình tuyến tính gãy lỗi</td><td>HistGradientBoosting
      tự học nhánh rẽ cho giá trị thiếu</td></tr></table>'
    say: Bảng quy mô nêu ba lợi thế thực chiến nổi bật của thuật toán gom giỏ trên hệ thống lớn. Thậm chí ngay cả khi bảng
      dữ liệu có sẵn các ô trống chưa điền, thuật toán vẫn tự chọn hướng nhánh trái hay phải tốt nhất cho ô trống đó. Cơ chế
      tự tìm nhánh rẽ tối ưu cho ô bị khuyết giúp giảm bớt khâu tiền xử lý phức tạp đối với bảng dữ liệu có nhiều vùng trống
      rải rác. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin cậy ở cấp độ sản phẩm. Khi
      dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch vụ không tụt hiệu năng hay
      sập bộ nhớ. Khi chạy thuật toán tăng cường độ dốc trên dữ liệu bảng, ta thường so sánh hiệu năng với rừng ngẫu nhiên.
      Cơ chế gom giỏ tự tìm nhánh rẽ tối ưu cho ô bị khuyết giúp giảm bớt khâu tiền xử lý trên bảng thưa.
    focus:
