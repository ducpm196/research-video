- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L07
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L07</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Chạy
      HistGradientBoostingClassifier trên dữ liệu bảng và so sánh với RandomForest</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=600
      n_features=12 n_informative=6 test_size=0.25 seed=42 max_iter=50 lr=0.1 res_steps=3 target=10.0</code></td></tr><tr><td><b>Chấm
      bài (.venv-ml)</b></td><td><code>bash labs/cham.sh MLP L07 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 7 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Đọc số lượng vòng lặp và hệ số bước học từ luồng chuẩn để huấn luyện bộ tăng cường giỏ dữ liệu trên tập phân
      loại.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L07</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (HGBC)</b></td><td>Truyền <code>max_iter</code>, <code>learning_rate</code>, <code>random_state=seed</code> vào <code>HistGradientBoostingClassifier</code></td></tr><tr><td><b>Bước
      2 (cộng phần dư)</b></td><td>Khởi tạo <code>f = 0.0</code>, lặp <code>res_steps</code> lần phép cộng <code>f += lr *
      (target - f)</code></td></tr><tr><td><b>Bước 3 (đầu ra)</b></td><td>In số cây thực chạy <code>hgb.n_iter_</code>, độ
      chính xác kiểm tra và phần dư <code>target - f</code></td></tr></table>
    say: Bạn tách tham số từ luồng chuẩn rồi khớp bộ phân loại tăng cường độ dốc giỏ dữ liệu theo đúng số vòng lặp và tốc
