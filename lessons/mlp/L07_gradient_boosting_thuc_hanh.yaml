      chênh lệch còn lại rồi nhân thêm tốc độ học nhỏ trước khi cộng vào mô hình tổng. Kết hợp cơ chế dừng sớm khi
      điểm thẩm định ngừng cải thiện, mô hình tự dừng đúng lúc.
