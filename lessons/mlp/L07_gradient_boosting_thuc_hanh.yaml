- id: hook
  kind: hook
  title: Tăng cường độ dốc HistGradientBoosting học từ phần dư
  checks:
  - round(10.0 * (1 - 0.1)**3, 3) == 7.29
  - 255 + 1 == 256
  steps:
  - show: <div class='box key'><p>Cập nhật tuần tự <code>F_m(x) = F_{m-1}(x) + lr * h_m(x)</code>. Giảm <code>lr</code> từ
      <code>1.0</code> xuống <b>0.10</b> buộc mô hình học chậm và mượt qua từng cây nông thay vì nhớ nhiễu.</p></div>
    say: Trên bảng dữ liệu lớn vài trăm nghìn dòng, bộ tăng cường độ dốc theo giỏ thường vượt trội cả hồi quy lẫn rừng ngẫu
      nhiên. Bí mật nằm ở cách gom cột thành hai trăm năm mươi lăm giỏ giá trị cộng một giỏ thiếu thành hai trăm năm mươi
      sáu mức. Mỗi cây nông kế tiếp sửa thẳng phần dư sai số còn sót của chuỗi cây đi trước. Hôm nay ta chạy trực tiếp bộ
      phân loại này trên CPU trong chưa tới một giây.
    clear: true
    focus: null
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Rừng ngẫu nhiên trồng song song
      (MLP:L06)</td><td>Nhiều cây độc lập bỏ phiếu cùng lúc giảm phương sai</td></tr><tr><td>Chiến lược sửa sai nối tiếp (Boosting)</td><td>Mỗi
      cây nông kế tiếp học trực tiếp trên phần dư sai số còn sót</td></tr><tr><td>Tốc độ học learning_rate</td><td>Bước nhỏ
      0.05-0.10 giúp tổng tích lũy không vọt lố theo nhiễu</td></tr></table>
    say: Nếu rừng ngẫu nhiên trồng hàng chục cây song song rồi lấy trung bình, thì tăng cường độ dốc trồng từng cây nối đuôi
      nhau. Cây sau chỉ tập trung sửa chính phần sai số mà tổng các cây trước còn để sót lại. Nhờ vậy mô hình cây nông vẫn
      đạt độ chính xác rất cao trên dữ liệu bảng thực tế. Nhờ dùng cấu trúc giỏ rời rạc cho từng cột số liên tục, bộ tăng
      cường độ dốc chạy mượt trên bộ xử lý trung tâm mà không cần phần cứng tăng tốc chuyên dụng. Quy trình này liên kết chặt
      chẽ từ khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán
      và giới hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Ý tưởng học nối tiếp khắc phục
      điểm yếu của rừng ngẫu nhiên khi tập trung trực tiếp giảm dần sai số hệ thống.
