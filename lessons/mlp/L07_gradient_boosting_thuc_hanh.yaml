- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round(10.0 * (1 - 0.1)**3, 3) == 7.29
  - 255 + 1 == 256
  steps:
  - show: <div class='box key'><p><b>1. Cộng dồn tăng cường:</b> <code>F_M(x) = F_0 + lr * sum_{m=1..M} h_m(x)</code>.</p><p><b>2.
      Giỏ histogram:</b> rời rạc hóa biến liên tục thành tối đa <code>255</code> giỏ số nguyên nên tìm ngưỡng cắt nhanh gấp
      nhiều lần.</p></div>
    say: Công thức thứ nhất cho thấy đầu ra cuối là tổng có trọng số của chuỗi cây nối tiếp nhau, trong đó mỗi cây nhân với
      hệ số bước học nhỏ. Nhờ gom giá trị số liên tục vào tối đa hai trăm năm mươi lăm giỏ cố định. Máy chỉ cần duyệt vài
      trăm ngưỡng thay vì sắp xếp lại hàng triệu điểm. Việc tách định nghĩa tham số trên tập huấn luyện rất quan trọng vì
      nó quyết định độ trung thực của thước đo tổng quát. Mọi công thức chuyển đổi trước khi đóng gói ra sản phẩm đều phải
      giữ đúng giả định toán học ban đầu để không gây sai số tích lũy. Nhờ nén mỗi cột số thành hai trăm năm mươi lăm giỏ
      rời rạc, tốc độ tìm ngưỡng cắt tăng vọt hàng chục lần trên CPU. Mỗi lần cộng thêm dự báo cây mới được nhân hệ số bước
      học nhỏ nhằm giảm nguy cơ học thuộc lòng nhiễu.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
