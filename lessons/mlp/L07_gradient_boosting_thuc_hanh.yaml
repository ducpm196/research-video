- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - round(600 * 0.25) == 150
  - 0.900 > 0.880
  steps:
  - show: '<p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.ensemble import HistGradientBoostingClassifier,
      RandomForestClassifier</div><div>X, y = make_classification(n_samples=600, n_features=12, n_informative=6, random_state=42)</div><div>X_tr,
      X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)</div><div>hgb = HistGradientBoostingClassifier(max_iter=50,
      learning_rate=0.1, random_state=42).fit(X_tr, y_tr)</div><div>rf = RandomForestClassifier(n_estimators=50, random_state=42).fit(X_tr,
      y_tr)

      print(f''n_iter={hgb.n_iter_} hgb_te={hgb.score(X_te,y_te):.3f} rf_te={rf.score(X_te,y_te):.3f}'')</div></div>'
    say: Đoạn mã huấn luyện năm mươi vòng tăng cường độ dốc với tốc độ học không phẩy một trên sáu trăm mẫu dữ liệu. Bộ chia
      vẫn giữ nguyên cấu trúc phân tầng và hạt giống bốn hai để đối chứng công bằng. Từng dòng mã chạy xác định hoàn toàn
      nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Năm mươi vòng tăng cường độ dốc dựa trên thuật
      toán giỏ rời rạc chạy gọn nhẹ trong nháy mắt trên bộ xử lý phổ thông. Đồng thời ta chạy song song một rừng ngẫu nhiên
      năm mươi cây trên đúng phần chia đó để đối chiếu kết quả.
