  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>target, f, lr = 10.0, 0.0, 0.1</div><div>for
      step in range(3):</div><div>    res = target - f</div><div>    f += lr * res</div><div>print(f'after_3_steps={f:.3f}
      remaining_res={target - f:.3f}')</div></div>
