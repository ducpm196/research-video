    say: Cơ chế tăng cường độ dốc cộng dồn phần dư qua hai trăm năm mươi lăm giỏ rời rạc kết hợp tốc độ học nhỏ giúp hội tụ
      mượt mà trên CPU. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng sau từng
      dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm tái lập
      chính xác trên nhiều máy. Sự kết hợp giữa thuật toán gom giỏ siêu tốc và cập nhật bước nhỏ theo phần dư đưa tăng cường
      độ dốc lên hàng đầu dữ liệu bảng.
