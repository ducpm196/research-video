      dương lọt vào mỗi nếp. Tổng hai mươi ca dương chia đều năm nếp thì bắt buộc mỗi nếp phải nhận đúng bốn ca
      dương. Phép kiểm chứng này rất quan trọng vì đối chiếu độc lập giúp phát hiện ngay sai lệch.
