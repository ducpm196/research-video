- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - round(300 * 0.8) == 240
  - round(300 * 0.2) == 60
  steps:
  - show: '<p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split, StratifiedKFold, GridSearchCV</div><div>from sklearn.pipeline import
      Pipeline</div><div>from sklearn.preprocessing import StandardScaler</div><div>from sklearn.linear_model import LogisticRegression</div><div>X,
      y = make_classification(n_samples=300, n_features=8, random_state=42)</div><div>X_tr, X_te, y_tr, y_te = train_test_split(X,
      y, test_size=0.2, stratify=y, random_state=42)</div><div>pipe = Pipeline([(''sc'', StandardScaler()), (''clf'', LogisticRegression(random_state=42))])</div><div>cv
      = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)</div><div>gs = GridSearchCV(pipe, {''clf__C'': [0.01, 0.1,
      1.0, 10.0]}, cv=cv, scoring=''f1'')</div><div>gs.fit(X_tr, y_tr)</div><div>bi = gs.best_index_; m = gs.cv_results_[''mean_test_score''][bi];
      sd = gs.cv_results_[''std_test_score''][bi]</div><div>c = gs.best_params_[''clf__C'']</div><div>print(f''best_C={c}
      mean={m:.3f} std={sd:.3f} te_f1={gs.score(X_te, y_te):.3f}'')</div></div>'
    say: Đoạn mã chạy lưới tìm kiếm bốn mức phạt C qua năm nếp phân tầng trên hai trăm bốn mươi mẫu huấn luyện. Sau hai mươi
      lần khớp nội bộ, nó tự chọn giá trị C tốt nhất. Huấn luyện lại một mô hình sạch rồi chấm đúng một lần trên sáu mươi
      mẫu kiểm tra. Từng dòng mã chạy xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần
      thử. Hai mươi lần khớp nội bộ tự động thử qua bốn mức hình phạt mà không đòi hỏi lập trình viên viết vòng lặp thủ công.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>best_C=0.01 mean=0.921 std=0.018
      te_f1=0.900</div></div>
    say: Đầu ra xác nhận điểm trung bình kiểm chứng chéo đạt không phẩy chín hai một kèm độ lệch chuẩn chỉ không phẩy không
      một tám và điểm kiểm tra là không phẩy chín. Độ lệch chuẩn thấp chứng minh cấu hình tối ưu ổn định đều qua cả năm nếp
      chứ không ăn may trên một lần chia. Ngoài ra điểm trên tập kiểm tra độc lập bằng không phẩy chín khá sát mức trung bình
      năm nếp nên không có dấu hiệu quá khớp khi tìm kiếm. Nếu chỉ thử một lần chia duy nhất mà gặp nếp may mắn đạt điểm cao,
      mô hình thường tụt mạnh ngay khi áp dụng sang tập kiểm tra mới.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - round(100 * 0.2) // 5 == 4
  - 4 * 5 == 20
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import StratifiedKFold</div><div>X, y = make_classification(n_samples=100, weights=[0.8, 0.2],
      random_state=42)</div><div>cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)</div><div>cnts = [int(y[te].sum())
      for _, te in cv.split(X, y)]</div><div>print(f'pos_per_fold={cnts} same={int(len(set(cnts)) == 1)}')</div></div>
    say: Để kiểm chứng bộ chia phân tầng trên tập mất cân bằng hai mươi phần trăm nhãn dương, ta đếm số lượng mẫu dương lọt
      vào mỗi nếp. Tổng hai mươi ca dương chia đều năm nếp thì bắt buộc mỗi nếp phải nhận đúng bốn ca dương. Ngay cả khi tổng
      số mẫu dương không chia hết cho số nếp, sai lệch giữa các nếp không vượt quá một mẫu duy nhất. Bốn ca dương trên mỗi
      nếp ngăn ngừa tình trạng một nếp ngẫu nhiên không có ca dương nào gây lệch đánh giá.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>pos_per_fold=[4, 4, 4, 4, 4] same=1</div></div>
    say: Kết quả chạy thật trả về danh sách năm số bốn đều tăm tắp vì cơ chế phân tầng bảo toàn tỉ lệ chính xác qua từng nếp.
      Nhờ vậy không có nếp nào bị khuyết lớp thiểu số khi tính điểm. Kết quả kiểm chứng khẳng định quy luật toán học không
      đổi khi kiểm thử độc lập. Sự đồng đều tuyệt đối trên năm nếp bảo chứng rằng bộ chia phân tầng hoạt động chính xác như
      thiết kế lý thuyết.
    focus:
    - 1
    - 2
