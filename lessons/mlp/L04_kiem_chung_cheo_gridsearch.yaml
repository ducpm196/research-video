      rồi tới tên tham số. Khi đọc bảng kết quả, luôn nhìn cả điểm trung bình lẫn độ lệch chuẩn qua các nếp. Vì
      vậy công thức định lượng giúp kiểm soát sai số và biến đổi mô hình minh bạch hơn.
