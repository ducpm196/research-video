      sklearn.model_selection import StratifiedKFold</div><div>X, y = make_classification(n_samples=100, weights=[0.8,
      0.2], random_state=42)</div><div>cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)</div><div>cnts
