scenes:
- id: hook
  kind: hook
  title: StratifiedKFold & tìm siêu tham số GridSearchCV
  checks:
  - 5 * 4 == 20
  - 5 * 4 + 1 == 21
  steps:
  - show: <div class='box key'><p>Với <code>K = 5</code> nếp và lưới <b>4</b> ứng viên <code>C = [0.01, 0.1, 1.0, 10.0]</code>,
      <code>GridSearchCV</code> chạy đúng <code>5 × 4 = <b>20</b></code> lần khớp độc lập cộng <b>1</b> lần refit cuối.</p></div>
    say: Nhiều bạn hỏi vì sao phải đặt bộ chuẩn hóa bên trong Pipeline trước khi đưa vào hàm tìm kiếm lưới. Bởi nếu bạn chuẩn
      hóa toàn bộ tập huấn luyện trước, thì khi chia năm nếp. Thông số trung bình của nếp kiểm chứng đã ngầm lọt vào bốn nếp
      huấn luyện còn lại. Hôm nay ta cài đặt lưới tìm kiếm lồng chuẩn xác và chạy toàn bộ trên CPU chỉ vài trăm mi-li-giây.
      Đưa bước chuẩn hoá ra ngoài vòng lặp tìm kiếm lưới làm thông số tập xác thực thấm ngược vào mọi mô hình ứng viên.
    clear: true
    focus: null
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Rủi ro một lần chia cố định</td><td>Một
      lần tách ngẫu nhiên nhỏ dễ đánh lừa điểm cao hay thấp do may mắn</td></tr><tr><td>Chuỗi xử lý khép kín (MLP:L00)</td><td>Đưa
      toàn bộ biến đổi vào Pipeline trước khi chạy vòng chéo</td></tr><tr><td>Tìm kiếm lưới siêu tham số</td><td>Thử đều các
      mức phạt C trên từng nếp và lấy trung bình</td></tr></table>
    say: Khi tập dữ liệu chỉ có vài trăm tới vài nghìn dòng, một lần chia ngẫu nhiên duy nhất rất dễ cho kết quả may rủi.
      Bài bốn hướng dẫn cách kiểm chứng chéo năm nếp phân tầng kết hợp tìm kiếm lưới bọc bên ngoài chuỗi xử lý. Giúp chọn
      siêu tham số chắc chắn mà không bao giờ gây rò rỉ dữ liệu giữa các nếp. Nếu thực hiện chọn siêu tham số dựa trên chỉ
      một lần chia ngẫu nhiên, kết quả đo có thể ăn may theo phân bố tập kiểm chứng nhỏ. Quy trình này liên kết chặt chẽ từ
      khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán và giới
      hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Trung bình năm lần đánh giá trên các
      nếp khác nhau cho thước đo ổn định hơn hẳn so với một phép chia ngẫu nhiên duy nhất.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
