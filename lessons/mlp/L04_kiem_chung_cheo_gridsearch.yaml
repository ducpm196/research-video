  - 5 * 4 + 1 == 21
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>4 ứng viên x 5
      nếp</td><td>20 lần khớp (< 100 ms)</td><td>Gọn nhẹ cho Logistic / Ridge</td></tr><tr><td>1 000 tổ hợp siêu tham số</td><td>5
      000 lần khớp (với 5 nếp) quá chậm</td><td>Chuyển sang RandomizedSearchCV thử 30 điểm ngẫu nhiên</td></tr><tr><td>Dữ
      liệu theo ngày tháng</td><td>StratifiedKFold sẽ rò rỉ tương lai</td><td>Phải thay bằng TimeSeriesSplit theo thứ tự thời
      gian</td></tr></table>
    say: Bảng quy mô giúp bạn biết giới hạn thực tế của phương pháp vét lưới. Khi số lượng tham số nhân lên vài nghìn tổ hợp,
      hãy chuyển sang lấy mẫu ngẫu nhiên để giữ thời gian tìm kiếm trong ngưỡng chấp nhận được. Khi kết hợp kiểm chứng chéo
      với đường ống xử lý khép kín, mỗi nếp gấp tự tính riêng thông số chuẩn hoá bên trong từng vòng huấn luyện nên hoàn toàn
      triệt tiêu rò rỉ. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin cậy ở cấp độ sản
      phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch vụ không tụt hiệu
      năng hay sập bộ nhớ. Đọc cả điểm trung bình và độ lệch chuẩn qua các nếp giúp tránh chọn cấu hình ăn may sau một lần
      chia. Khi bọc kiểm chứng chéo quanh đường ống xử lý, mỗi nếp tự tính riêng tham số chuẩn hoá nên hoàn toàn triệt tiêu
      rò rỉ.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Chuẩn hóa
      <code>X_tr</code> bằng tay trước khi truyền vào <code>GridSearchCV</code> làm 5 nếp rò rỉ chéo nhau.<br><b>Lỗi 2:</b>
      Dùng khoá một gạch dưới <code>'clf_C'</code> thay vì hai gạch dưới <code>'clf__C'</code> gây ValueError.<br><b>Lỗi 3:</b>
      Đưa cả tập Test vào <code>GridSearchCV.fit(X, y)</code>.</div></td></tr></table>
    say: Ba lỗi kỹ thuật rất dễ mắc khi dùng tìm kiếm lưới trên thực tế gồm những điểm sau. Một là chuẩn hóa trước bên ngoài
      khiến các nếp nhìn trộm nhau. Hai là gõ thiếu một dấu gạch dưới ở tên tham số, và ba là quên tách tập kiểm tra trước
      khi gọi hàm tìm lưới. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều
      công gỡ lỗi về sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang
      bộ dữ liệu mới. Quên dấu gạch dưới kép là lỗi cú pháp phổ biến nhất khiến bộ tìm kiếm lưới báo sai tên tham số ngay
      lập tức.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - round(300 * 0.8) == 240
  - 1000 * 5 == 5000
  steps:
  - show: <ol><li>Với 5 nếp và 4 giá trị <code>C</code>, <code>GridSearchCV</code> chạy bao nhiêu lần khớp (cộng refit)?</li><li>Tên
      tham số <code>C</code> của bước <code>clf</code> trong Pipeline viết trong lưới là gì?</li></ol>
    say: Bạn kiểm tra lại kiến thức vừa học với hai câu hỏi ngắn. Câu một, với năm nếp và bốn mức C thì bộ tìm kiếm chạy bao
      nhiêu lần khớp tất cả? Câu hai, khoá từ điển để chỉnh tham số C của bước clf viết như thế nào? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>5 × 4 = <b>20</b></code> lần khớp đánh giá + <b>1</b>
      lần <code>refit</code> trên toàn tập Train = <b>21</b> lần.</p></td></tr></table>
    say: 'Đáp án câu một: năm nhân bốn bằng hai mươi lần đánh giá cộng thêm một lần huấn luyện lại cuối là hai mốt lần. Lần
      huấn luyện cuối cùng gộp cả năm phần huấn luyện lại giúp mô hình cuối tận dụng tối đa một trăm phần trăm dữ liệu.'
    clear: true
    focus: null
  - show: '<table class=''t''><tr><th>đáp án câu 2</th></tr><tr><td><p>② Viết bằng hai dấu gạch dưới: <code><b>''clf__C''</b></code>.</p></td></tr></table>'
    say: 'Đáp án câu hai: ghép tên bước và tên tham số bằng hai dấu gạch dưới thành clf hai gạch dưới C. Quy ước hai dấu gạch
      dưới tách rõ tên bước đặt trong chuỗi khép kín với tên tham số gốc của từng bộ biến đổi.'
    clear: true
    focus: null
- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L04
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L04</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Đọc
      điểm trung bình và độ lệch chuẩn để không chọn cấu hình ăn may một lần chia</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=300
      n_features=8 test_size=0.20 seed=42 n_splits=5 c_grid=0.01,0.1,1.0,10.0</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash
      labs/cham.sh MLP L04 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 4 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Đọc danh sách giá trị hình phạt C và số nếp phân tầng từ luồng chuẩn để chạy tìm kiếm tối ưu tự động.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: '<table class=''t''><tr><th>Gợi ý triển khai MLP:L04</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước
      1 (StratifiedKFold)</b></td><td>Khởi tạo bộ chia <code>n_splits</code> nếp có <code>shuffle=True, random_state=seed</code></td></tr><tr><td><b>Bước
      2 (GridSearchCV)</b></td><td>Truyền <code>{''clf__C'': c_grid}</code> và <code>scoring=''f1''</code> vào đối tượng bọc
      <code>Pipeline</code></td></tr><tr><td><b>Bước 3 (kiểm nếp)</b></td><td>Đếm <code>y_tr[te].sum()</code> qua từng nếp
      chia để xác định có đều tuyệt đối hay chênh 1 mẫu</td></tr></table>'
    say: Bạn tách mảng siêu tham số từ luồng chuẩn rồi bọc chuỗi chuẩn hoá và hồi quy vào bên trong bộ tìm kiếm lưới dùng
      kiểm chứng phân tầng. Cuối cùng bạn duyệt lại từng nếp chia trên tập huấn luyện để kiểm tra xem số ca dương có bằng
      nhau tuyệt đối không. Kiểm tra phân bố số lượng mẫu dương qua từng nếp để bảo đảm điều kiện bằng nhau trước khi tính
      điểm cuối.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>best_c=0.01</div><div>cv_f1=0.921</div><div>equal_folds_positive=0</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn. Cần kiểm tra chính xác xem số mẫu dương ở tất cả các nếp
      có hoàn toàn bằng nhau hay không trước khi in giá trị cờ nhị phân cuối.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Pipeline lồng trong CV</span><span class="a">→</span><span class="n">StratifiedKFold
      đều lớp</span><span class="a">→</span><span class="n">Ký hiệu __ chuẩn</span></div>
    say: Quy chuẩn tìm kiếm siêu tham số đặt kiểm chứng phân tầng và đường ống chuẩn hoá đi chung thành một khối khép kín
      chống rò rỉ. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng sau từng dòng
      lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm tái lập chính
      xác trên nhiều máy. Gói chặt chuỗi xử lý vào trong bộ kiểm chứng chéo phân tầng giúp chọn siêu tham số vừa công bằng
      vừa sạch bóng rò rỉ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L04:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 4 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Quy
      trình kiểm chứng chéo khép kín là nền móng vững chắc trước khi tiến vào các dữ liệu mất cân bằng phức tạp hơn. Luôn
      giữ tách biệt dữ liệu kiểm định khỏi bước chuẩn hoá trong mọi mô hình sau này.
    clear: true
    focus: null
