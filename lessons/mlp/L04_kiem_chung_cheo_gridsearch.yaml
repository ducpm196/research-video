    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>StratifiedKFold(n_splits=5,
      shuffle=True)</code></td><td>Chia 5 nếp phân tầng bảo toàn tỉ lệ lớp với random_state=42</td></tr><tr><td><code>GridSearchCV(pipe,
      {''clf__C'': [...]})</code></td><td>Tìm lưới các ứng viên siêu tham số qua kiểm chứng chéo</td></tr><tr><td><code>best_score_
      / best_params_</code></td><td>Điểm CV trung bình cao nhất và bộ siêu tham số tương ứng</td></tr></table>'
    say: Bảng ký hiệu trình bày ba đối tượng điều phối quá trình tìm siêu tham số chuẩn xác. Bộ chia phân tầng gắn cờ xáo
      trộn với hạt giống bốn hai bảo đảm thứ tự mẫu không gây thiên vị nếp đầu nếp cuối. Còn đối tượng lưới tự động tìm cấu
      hình tốt nhất rồi huấn luyện lại trên toàn bộ phần huấn luyện. Cơ chế phân tầng giữ tỉ lệ lớp hiếm ổn định trong từng
      nếp con giúp đánh giá giữa các siêu tham số luôn công bằng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
