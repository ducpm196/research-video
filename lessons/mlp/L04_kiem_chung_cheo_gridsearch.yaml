- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 5 * 4 == 20
  - 20 + 1 == 21
  steps:
  - show: '<p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split, StratifiedKFold, GridSearchCV</div><div>from sklearn.pipeline
      import Pipeline</div><div>from sklearn.preprocessing import StandardScaler</div><div>from sklearn.linear_model
      import LogisticRegression</div><div>X, y = make_classification(n_samples=300, n_features=8, random_state=42)</div><div>X_tr,
      X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)</div><div>pipe = Pipeline([(''sc'',
      StandardScaler()), (''clf'', LogisticRegression(random_state=42))])</div><div>cv = StratifiedKFold(n_splits=5,
      shuffle=True, random_state=42)</div><div>gs = GridSearchCV(pipe, {''clf__C'': [0.01, 0.1, 1.0, 10.0]}, cv=cv,
      scoring=''f1'')</div><div>gs.fit(X_tr, y_tr)</div><div>c = gs.best_params_[''clf__C'']</div><div>print(f''best_C={c}
      cv_f1={gs.best_score_:.3f} te_f1={gs.score(X_te, y_te):.3f}'')</div></div>'
    say: Đoạn mã chạy lưới tìm kiếm bốn mức phạt C qua năm nếp phân tầng trên hai trăm bốn mươi mẫu huấn luyện.
      Sau hai mươi lần khớp nội bộ, nó tự chọn giá trị C tốt nhất. Huấn luyện lại một mô hình sạch rồi chấm đúng
      một lần trên sáu mươi mẫu kiểm tra. Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>best_C=0.01 cv_f1=0.921
      te_f1=0.900</div></div>
    say: Đầu ra xác nhận hệ thống chọn đúng siêu tham số tối ưu nhờ đánh giá chéo đầy đủ năm nếp thay vì đoán mò.
      Điểm trên tập kiểm tra độc lập nằm rất sát điểm trung bình kiểm chứng chéo nên không có dấu hiệu học vẹt.
