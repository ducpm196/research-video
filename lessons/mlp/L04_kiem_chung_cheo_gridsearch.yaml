  steps:
  - show: <div class='box key'><p><b>1. Tên tham số lưới Pipeline:</b> <code>'step_name__param'</code> (hai dấu
      gạch dưới <code>__</code>), ví dụ <code>'clf__C'</code>.</p><p><b>2. Thống kê tổng hợp:</b> đọc <code>mean_test_score</code>
      kèm <code>std_test_score</code> qua K nếp.</p></div>
