- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 5 * 4 == 20
  - 5 * 4 + 1 == 21
  steps:
  - show: <div class='box key'><p><b>1. Tên tham số lưới Pipeline:</b> <code>'step_name__param'</code> (hai dấu gạch dưới
      <code>__</code>), ví dụ <code>'clf__C'</code>.</p><p><b>2. Thống kê tổng hợp:</b> đọc <code>mean_test_score</code> kèm
      <code>std_test_score</code> qua K nếp.</p></div>
    say: Quy ước cú pháp quan trọng nhất của lưới tìm kiếm bọc chuỗi khép kín là hai dấu gạch dưới. Nếu bước mô hình đặt tên
      tắt là clf, thì khoá tham số trong từ điển tìm kiếm phải viết đúng tên bước, hai dấu gạch dưới, rồi tới tên tham số.
      Khi đọc bảng kết quả, luôn nhìn cả điểm trung bình lẫn độ lệch chuẩn qua các nếp. Cú pháp hai dấu gạch dưới định vị
      chính xác tên thành phần và tên tham số nằm sâu bên trong chuỗi lồng ghép. Sau khi tìm xong siêu tham số tốt nhất, hệ
      thống tự động huấn luyện lại một mô hình cuối cùng trên trọn tập huấn luyện.
