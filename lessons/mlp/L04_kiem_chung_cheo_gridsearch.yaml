      tỉ lệ nhãn. Tầng hai đặt bộ chuẩn hóa vào trong chuỗi khép kín để lưới tìm kiếm tự khớp lại trên bốn nếp trước khi đo
      trên nếp thứ năm. Nhờ vậy nếp kiểm chứng thứ năm tuyệt đối không bao giờ chạm tới trung bình hay độ lệch chuẩn của chính
      nó trong lúc biến đổi. Cuối cùng tầng ba lấy bộ siêu tham số đứng đầu để huấn luyện lại sạch sẽ và kiểm định duy nhất
      một lần trên tập kiểm tra giữ riêng.
