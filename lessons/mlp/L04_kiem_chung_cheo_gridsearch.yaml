scenes:
- id: hook
  kind: hook
  title: Kiểm chứng chéo StratifiedKFold & tìm siêu tham số GridSea
  checks:
  - 5 * 4 == 20
  - 20 + 1 == 21
  steps:
  - show: <div class='box key'><p>Với <code>K = 5</code> nếp và lưới <b>4</b> ứng viên <code>C = [0.01, 0.1, 1.0,
      10.0]</code>, <code>GridSearchCV</code> chạy đúng <code>5 × 4 = <b>20</b></code> lần khớp độc lập cộng <b>1</b>
      lần refit cuối.</p></div>
    say: Nhiều bạn hỏi vì sao phải đặt bộ chuẩn hóa bên trong Pipeline trước khi đưa vào hàm tìm kiếm lưới. Bởi
      nếu bạn chuẩn hóa toàn bộ tập huấn luyện trước, thì khi chia năm nếp. Thông số trung bình của nếp kiểm chứng
      đã ngầm lọt vào bốn nếp huấn luyện còn lại. Hôm nay ta cài đặt lưới tìm kiếm lồng chuẩn xác và chạy toàn bộ
      trên CPU chỉ vài trăm mi-li-giây.
