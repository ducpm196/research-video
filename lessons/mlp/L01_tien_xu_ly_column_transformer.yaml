  steps:
  - show: <div class='box key'><p><b>1. Trung vị (median):</b> ít bị kéo lệch bởi giá trị ngoại lai hơn trung bình
      cộng.</p><p><b>2. Mã hóa an toàn:</b> từ điển có <code>K</code> nhãn Train → véc tơ độ dài <code>K</code>;
      nhãn lạ biến thành toàn số <code>0</code>.</p></div>
    say: Hai quy tắc toán học trên giúp đường ống tiền xử lý bền vững trước nhiễu và dữ liệu mới. Trung vị đứng
      yên khi có một vài giao dịch bất thường cực lớn, không bị kéo lệch như trung bình cộng. Còn mã hóa mã hóa
      nhị phân cấu hình bỏ qua nhãn lạ sẽ biến giá trị chưa thấy thành hàng số không thay vì ném ngoại lệ dừng chương
