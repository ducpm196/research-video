- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Gọi <code>fillna(df.median())</code> trên toàn bảng trước khi chia tập Train/Test.<br><b>Lỗi 2 (-20đ):</b>
      Để mặc định <code>handle_unknown='error'</code> khiến API vỡ ngoại lệ khi thấy danh mục mới.<br><b>Lỗi 3 (-10đ):</b>
      Dùng mã hóa nhãn số 1, 2, 3 cho biến danh mục không có thứ tự gây hiểu nhầm 3 > 1.</div></td></tr></table>
    say: Bạn tránh kỹ ba sai lầm rất hay gặp khi tiền xử lý bảng hỗn hợp. Lỗi một là điền giá trị thiếu trước lúc
