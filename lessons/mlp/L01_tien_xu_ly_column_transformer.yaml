- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - sorted([10, 20, 30])[1] == 20
  - 1 + 2 == 3
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.impute
      import SimpleImputer</div><div>from sklearn.preprocessing import OneHotEncoder, StandardScaler</div><div>from sklearn.compose
      import ColumnTransformer</div><div>from sklearn.linear_model import LogisticRegression</div><div>from sklearn.pipeline
      import Pipeline</div><div>X_tr = np.array([[10.0,'hn'],[20.0,'sg'],[30.0,'hn'],[np.nan,'sg']], object)</div><div>X_te
      = np.array([[np.nan,'dn']], object)</div><div>num_p = Pipeline([('imp', SimpleImputer(strategy='median')), ('sc', StandardScaler())])</div><div>ct
      = ColumnTransformer([('num', num_p, [0]), ('cat', OneHotEncoder(handle_unknown='ignore'), [1])])</div><div>pipe = Pipeline([('prep',
      ct), ('clf', LogisticRegression(random_state=42))]).fit(X_tr, [0,1,0,1])</div><div>out = pipe['prep'].transform(X_te)</div><div>m
      = pipe['prep'].named_transformers_['num']['imp'].statistics_[0]</div><div>print(f'med={m:.1f} shape={out.shape} cat={out[0,1:].tolist()}
      pred={int(pipe.predict(X_te)[0])}')</div></div>
    say: Đoạn mã ghép chuỗi tiền xử lý cột số và cột thành phố rồi nối thẳng vào bộ phân loại trên bốn mẫu huấn luyện. Ở tập
      kiểm tra ta đưa vào cả ô số bị trống lẫn mã Đà Nẵng chưa từng xuất hiện lúc huấn luyện. Nhờ đóng gói trọn vẹn trong
      một đường ống duy nhất, mọi tham số điền khuyết và mã hoá chỉ học trên tập huấn luyện và dự báo sạch trên tập kiểm tra.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>med=20.0 shape=(1, 3) cat=[0.0,
      0.0] pred=0</div></div>
    say: Kết quả chạy thật chứng minh cả ba chốt chặn đều hoạt động chuẩn xác. Trung vị điền bằng hai mươi, mã Đà Nẵng ra
      hai số không và bộ phân loại dự đoán nhãn không. Ba cột đầu ra bảo toàn nguyên vẹn kích thước từ điển dù đầu vào xuất
      hiện thêm thành phố chưa từng học.
    focus:
    - 1
    - 2
    - 2
    clear: true
