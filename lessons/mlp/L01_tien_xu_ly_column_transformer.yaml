- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - sorted([10, 20, 30])[1] == 20
  - round((10 + 20 + 1000) / 3, 1) == 343.3
  steps:
  - show: <div class='box key'><p><b>1. Trung vị (median):</b> ít bị kéo lệch bởi giá trị ngoại lai hơn trung bình cộng.</p><p><b>2.
      Mã hóa an toàn:</b> từ điển có <code>K</code> nhãn Train → véc tơ độ dài <code>K</code>; nhãn lạ biến thành toàn số
      <code>0</code>.</p></div>
    say: Hai quy tắc toán học trên giúp đường ống tiền xử lý bền vững trước nhiễu và dữ liệu mới. Trung vị đứng yên khi có
      một vài giao dịch bất thường cực lớn, không bị kéo lệch như trung bình cộng. Còn mã hóa nhị phân cấu hình bỏ qua nhãn
      lạ sẽ biến giá trị chưa thấy thành hàng số không thay vì ném ngoại lệ dừng chương trình. Khi gặp danh mục chưa từng
      thấy ở tập huấn luyện, mã hoá toàn số không giữ cho kích thước cột luôn ổn định. Trung vị chỉ quan tâm tới thứ tự đứng
      giữa nên đứng vững trước nhiễu cực trị hai đầu.
