  - show: <ol><li>Với tập Train là <code>[10, 20, 1000]</code>, nên dùng <code>median</code> hay <code>mean</code> để ít lệch
      ngoại lai?</li><li><code>OneHotEncoder(handle_unknown='ignore')</code> trả về gì khi gặp nhãn chưa thấy lúc Train?</li></ol>
    say: Mời bạn tự kiểm tra hiểu bài qua hai câu hỏi nhanh sau. Câu một, với tập huấn luyện mười, hai mươi và một nghìn,
      nên chọn trung vị hay trung bình để tránh nhiễu ngoại lai? Câu hai, bộ mã hóa rời rạc đặt cờ bỏ qua sẽ xuất gì khi gặp
      nhãn mới? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Nên dùng <code><b>median</b></code> (= 20.0) thay vì
      <code>mean</code> (= 343.3) vì ngoại lai kéo lệch trung bình cộng.</p></td></tr></table>
    say: 'Đáp án câu một: chọn trung vị bằng hai mươi để không bị giá trị một nghìn kéo lệch gấp mười mấy lần. Số liệu thực
      tế trên bảng lương hay giá nhà luôn có đuôi lệch phải nên trung vị luôn là lựa chọn an toàn đầu tiên.'
    clear: true
    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Trả về véc tơ toàn số <code><b>0</b></code> đúng bằng
      chiều từ điển lúc Train, không gây sập chương trình.</p></td></tr></table>
    say: 'Đáp án câu hai: nó xuất ra một hàng toàn số không có cùng số chiều đã học và tiếp tục chạy bình thường. Nhờ biến
      đổi thành hàng toàn số không, mô hình vẫn tính được điểm số dựa trên các cột thông tin hợp lệ còn lại.'
    clear: true
    focus: null
- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L01
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L01</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Ghép
      ColumnTransformer sạch nối tiếp với bộ phân loại trong một Pipeline duy nhất</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>train=10.0,hn;20.0,sg;30.0,hn;nan,sg;
      test=nan,dn</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash labs/cham.sh MLP L01 duong_dan/bai_cua_ban.py</code>
      (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 1 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Chú ý xử lý chính xác chuỗi ký tự khuyết thiếu trong luồng vào để bộ điền khuyết nhận diện đúng giá trị rỗng.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L01</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tách bảng)</b></td><td>Phân tích dòng <code>train=</code> và <code>test=</code>, đổi chuỗi <code>'nan'</code> thành
      <code>np.nan</code></td></tr><tr><td><b>Bước 2 (ColumnTransformer)</b></td><td>Áp <code>SimpleImputer(strategy='median')</code>
      cho cột <code>[0]</code> và <code>OneHotEncoder(handle_unknown='ignore')</code> cho cột <code>[1]</code></td></tr><tr><td><b>Bước
      3 (truy xuất)</b></td><td>Đọc trung vị từ <code>named_transformers_['num'].statistics_[0]</code> (khi nhánh <code>'num'</code>
      là <code>SimpleImputer</code> trực tiếp; nếu bọc qua <code>Pipeline</code> thì truy cập <code>['num']['imp'].statistics_[0]</code>)</code>
      và tổng phần mã hoá nhãn lạ</td></tr></table>
    say: Bạn tách chuỗi cấu hình nhiều dòng từ luồng chuẩn thành mảng đối tượng chứa giá trị số khuyết và chuỗi danh mục.
      Sau đó bạn gắn bộ điền trung vị cho cột số, bộ mã hoá bỏ qua nhãn lạ cho cột phân loại rồi rút trung vị đã học từ bộ
      huấn luyện. Kiểm tra độ dài véc-tơ kết quả sau bộ mã hoá rời rạc để khẳng định số lượng cột khớp hoàn toàn từ điển đã
      học.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>train_median=20.0</div><div>test_imputed_val=20.0</div><div>unknown_ohe_sum=0</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">SimpleImputer trung vị</span><span class="a">→</span><span class="n">OneHotEncoder
      an toàn</span><span class="a">→</span><span class="n">ColumnTransformer chuẩn</span></div>
    say: Ba nguyên tắc cốt lõi vừa thực chứng gồm xử lý khuyết thiếu theo tập huấn luyện. Tách cột số với cột danh mục bằng
      bộ biến đổi cột và bỏ qua an toàn mọi nhãn lạ. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực
      giác toán học đằng sau từng dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi
      kết quả thực nghiệm tái lập chính xác trên nhiều máy. Bộ biến đổi theo cột bọc bên trong chuỗi xử lý giúp đường ống
      dữ liệu hỗn hợp vận hành trơn tru không rò rỉ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L01:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 1 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Những
      kỹ thuật phòng thủ dữ liệu thô này chính là lớp giáp bền vững nhất bảo vệ mô hình trong môi trường sản xuất.
    clear: true
    focus: null
