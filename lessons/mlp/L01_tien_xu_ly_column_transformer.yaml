- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Gọi <code>fillna(df.median())</code>
      trên toàn bảng trước khi chia tập Train/Test.<br><b>Lỗi 2:</b> Để mặc định <code>handle_unknown='error'</code> khiến
      API vỡ ngoại lệ khi thấy danh mục mới.<br><b>Lỗi 3:</b> Dùng mã hóa nhãn số 1, 2, 3 cho biến danh mục không có thứ tự
      gây hiểu nhầm 3 > 1.</div></td></tr></table>
    say: Bạn tránh kỹ ba sai lầm rất hay gặp khi tiền xử lý bảng hỗn hợp. Lỗi một là điền giá trị thiếu trước lúc chia tập
      gây rò rỉ dữ liệu. Lỗi hai là quên đặt cờ bỏ qua nhãn lạ và lỗi ba là gán số thứ tự tuỳ tiện cho các nhãn không so sánh
      lớn bé. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ lỗi về
      sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu mới.
      Không bao giờ tự tính giá trị điền khuyết trên toàn bộ khung dữ liệu trước lúc chia hai tập huấn luyện và kiểm tra.
      Hãy bật chế độ bỏ qua nhãn lạ ngay trong tham số khởi tạo bộ mã hoá rời rạc thay vì đợi lỗi lúc chạy thật.
