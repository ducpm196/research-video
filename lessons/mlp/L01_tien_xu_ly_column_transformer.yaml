- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - (10 + 20 + 30) / 3 == 20.0
  - 2 + 1 == 3
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.impute
      import SimpleImputer</div><div>from sklearn.preprocessing import OneHotEncoder, StandardScaler</div><div>from
      sklearn.compose import ColumnTransformer</div><div>from sklearn.pipeline import Pipeline</div><div>X_tr =
      np.array([[10.0,'hn'],[20.0,'sg'],[30.0,'hn'],[np.nan,'sg']], object)</div><div>X_te = np.array([[np.nan,'dn']],
      object)</div><div>num_p = Pipeline([('imp', SimpleImputer(strategy='median')), ('sc', StandardScaler())])</div><div>ct
      = ColumnTransformer([('num', num_p, [0]), ('cat', OneHotEncoder(handle_unknown='ignore'), [1])])</div><div>ct.fit(X_tr);
      out = ct.transform(X_te)</div><div>m = ct.named_transformers_['num']['imp'].statistics_[0]</div><div>print(f'med={m:.1f}
      shape={out.shape} cat={out[0,1:].tolist()}')</div></div>
    say: 'Đoạn mã minh họa bảng gồm hai cột: cột số có một ô trống và cột thành phố gồm Hà Nội với Sài Gòn. Ở tập
      kiểm tra ta đưa vào cả ô số bị trống lẫn mã Đà Nẵng chưa từng xuất hiện lúc huấn luyện. Ta chạy thực nghiệm
      này vì cần đo trực tiếp hành vi trên dữ liệu thật.'
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>med=20.0 shape=(1, 3)
      cat=[0.0, 0.0]</div></div>
    say: Kết quả chạy thật chứng minh hai cơ chế phòng thủ cùng hoạt động chính xác. Vì trung vị ba số mười, hai
      mươi, ba mươi là hai mươi nên ô trống được điền đúng hai mươi, còn mã Đà Nẵng cho ra hai số không an toàn.
    focus:
    - 1
    - 2
    clear: true
