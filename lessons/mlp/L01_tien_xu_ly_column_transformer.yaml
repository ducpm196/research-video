- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - sorted([10, 20, 1000])[1] == 20
  - round((10 + 20 + 1000) / 3, 1) == 343.3
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Bảng nhỏ 20 cột</td><td>ColumnTransformer
      < 5 ms</td><td>Dễ bảo trì từng cột số / chữ</td></tr><tr><td>Bảng 100 cột + API thật</td><td>Nhãn tỉnh/thiết bị mới
      xuất hiện mỗi tuần</td><td>handle_unknown='ignore' giữ API uptime 100%</td></tr><tr><td>Lô suy luận 50 000 dòng</td><td>Khớp
      1 lần lúc train, xuất sparse matrix</td><td>Giảm bộ nhớ gấp nhiều lần cho cột chữ nhiều hạng mục</td></tr></table>
    say: Bảng quy mô giải thích tầm quan trọng của hai tham số an toàn trên hệ thống sản xuất dài hạn. Mỗi tuần có mã chi
      nhánh hoặc thiết bị mới xuất hiện là chuyện bình thường nên bộ mã hóa bắt buộc phải bật chế độ bỏ qua nhãn lạ. Trong
      sản xuất thực tế, các danh mục mới xuất hiện theo từng chiến dịch sẽ không làm sập máy chủ vì mã hoá bỏ qua nhãn lạ
      đã gán toàn bộ véc-tơ bằng không. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin
      cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch
      vụ không tụt hiệu năng hay sập bộ nhớ. Trong sản xuất thực tế, ghép bộ biến đổi cột sạch nối tiếp với bộ phân loại giúp
      xử lý thống nhất trên một đường ống. Danh mục mới xuất hiện theo chiến dịch sẽ không làm sập máy chủ vì mã hoá bỏ qua
      nhãn lạ gán toàn bộ véc-tơ bằng không.
