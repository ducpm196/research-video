  steps:
  - show: <div class='box key'><p>Mạng <b>2 → 16 → 2</b> xen giữa <code>ReLU()</code> học tách chính xác ranh giới phi tuyến
      trên CPU. Lớp cuối giữ nguyên <b>logits thô</b> vì <code>CrossEntropyLoss</code> tự áp <code>LogSoftmax</code> bên trong.</p></div>
    say: Hai tầng tuyến tính xếp chồng lên nhau mà thiếu kích hoạt phi tuyến sẽ chỉ học được đúng một đường thẳng chia cắt
      dữ liệu hai lớp. Nên hoàn toàn bất lực trước bài toán XOR kinh điển. Chỉ cần chèn một lớp ReLU ở giữa và giữ đầu ra
      logit thô, mạng nhỏ trên CPU dễ dàng giải trọn bài toán phi tuyến. Hàm kích hoạt phi tuyến uốn cong mặt phẳng đặc trưng,
      trao cho mạng đa tầng khả năng học bất kỳ đường biên phức tạp nào.
    clear: true
    focus: null
