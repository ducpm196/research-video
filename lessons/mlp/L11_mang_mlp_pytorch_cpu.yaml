  - 2 * 16 + 16 * 2 == 64
  steps:
  - show: <div class='box key'><p><b>1. Nếu thiếu ReLU:</b> <code>W2 (W1 x + b1) + b2 = (W2 W1) x + (W2 b1 + b2)</code> —
      vẫn chỉ là một hàm bậc nhất!</p><p><b>2. Số tham số mạng 2→16→2:</b> <code>(2*16 + 16) + (16*2 + 2) = 48 + 34 = <b>82</b></code>
      trọng số.</p></div>
    say: Hai công thức chứng minh rõ vai trò sống còn của hàm kích hoạt và cách đếm tham số mạng. Nhân hai phép biến đổi tuyến
      tính luôn cho ra một phép biến đổi tuyến tính mới nếu không có hàm phi tuyến chặn giữa. Mạng nhỏ tám mươi hai trọng
      số này đủ nhẹ để chạy tức thì trên mọi CPU. Việc tách định nghĩa tham số trên tập huấn luyện rất quan trọng vì nó quyết
      định độ trung thực của thước đo tổng quát. Mọi công thức chuyển đổi trước khi đóng gói ra sản phẩm đều phải giữ đúng
      giả định toán học ban đầu để không gây sai số tích lũy. Nhân hai ma trận trọng số liên tiếp không có hàm kích hoạt luôn
      rút gọn thành một ma trận duy nhất mất sạch tính phi tuyến. Số lượng tham số một mạng đa tầng bằng tổng số tích kích
      thước vào ra cộng thêm số nơ-ron độ chệch ở mỗi lớp.
