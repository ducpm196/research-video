      và <code>with torch.no_grad():</code> lúc suy luận gây rò RAM.</div></td></tr></table>
    say: Ba lỗi kỹ thuật rất phổ biến cần tránh khi viết mạng nơ-ron trong PyTorch là như sau. Thứ nhất là lồng Softmax kép
      vào hàm mất mát chéo, thứ hai là thiếu hàm kích hoạt phi tuyến giữa các lớp. Và thứ ba là quên tắt theo dõi đạo hàm
      khi suy luận. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ
      lỗi về sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu
      mới. Quên chuyển sang chế độ đánh giá làm các lớp ngẫu nhiên hay chuẩn hoá lô vẫn hoạt động sai lệch lúc chạy thật.
      Chèn hàm chuẩn hoá xác suất trước hàm mất mát đa lớp làm sập độ dốc và kéo sai hoàn toàn kết quả huấn luyện. Thử nghiệm
      mạng kích thước hai mười sáu hai trước trên tập nhỏ giúp phát hiện ngay lỗi nối tầng hay thiếu kích hoạt.
