      Không bao giờ chèn thêm Softmax trước hàm mất mát chéo. Luôn ghi nhớ chuyển sang chế độ đánh giá và khoá tính toán đạo
      hàm khi suy luận giúp tiết kiệm đáng kể bộ nhớ và tránh thay đổi các lớp chuẩn hoá lô. Tuân thủ đúng giới hạn bộ nhớ
