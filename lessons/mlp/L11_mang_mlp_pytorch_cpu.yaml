  steps:
  - show: '<p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import torch, torch.nn as nn</div><div>torch.manual_seed(42)</div><div>X
      = torch.tensor([[0.,0.],[0.,1.],[1.,0.],[1.,1.]] * 25)</div><div>y = torch.tensor([0, 1, 1, 0] * 25)</div><div>net =
      nn.Sequential(nn.Linear(2, 16), nn.ReLU(), nn.Linear(16, 2))</div><div>opt = torch.optim.Adam(net.parameters(), lr=0.05);
      crit = nn.CrossEntropyLoss()</div><div>for _ in range(150):</div><div>    opt.zero_grad(); loss = crit(net(X), y); loss.backward();
      opt.step()</div><div>net.eval()</div><div>with torch.no_grad(): acc = (net(X[:4]).argmax(1) == y[:4]).float().mean().item()</div><div>n_par
      = sum(p.numel() for p in net.parameters())</div><div>print(f''n_params={n_par} xor_acc={acc:.2f} loss={loss.item():.4f}'')</div></div>'
