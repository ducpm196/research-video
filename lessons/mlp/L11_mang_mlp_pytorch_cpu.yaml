- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>nn.Sequential(nn.Linear(2,
      16), nn.ReLU(), nn.Linear(16, 2))</code></td><td>Chuỗi 2 tầng có kích hoạt ReLU bẻ cong biên</td></tr><tr><td><code>nn.CrossEntropyLoss()</code></td><td>Hàm
      mất mát phân loại nhận trực tiếp logits thô (chưa qua Softmax)</td></tr><tr><td><code>with torch.no_grad():</code></td><td>Tắt
      autograd khi kiểm thử để tiết kiệm RAM và tăng tốc</td></tr><tr><td><code>Adam(...)</code> / <code>model.eval()</code>
      / <code>argmax(1)</code> / <code>numel()</code></td><td>Bộ tối ưu, bật chế độ đánh giá, lấy nhãn lớn nhất và đếm số
      trọng số</td></tr></table>
    say: Bảng ký hiệu giải thích ba công cụ dựng mạng và suy luận sạch trong PyTorch. Khối xếp tuần tự nối các tầng gọn thành
      một đối tượng duy nhất. Còn khối ngữ cảnh tắt đạo hàm loại bỏ hoàn toàn chi phí ghi đồ thị tính toán khi đánh giá. Ngữ
      cảnh tắt theo dõi đạo hàm khi suy luận vừa tiết kiệm bộ nhớ RAM vừa tăng tốc độ phục vụ trên bộ xử lý. Khi kiểm thử
      nhớ chuyển sang chế độ đánh giá, chọn nhãn có logit lớn nhất và đếm tổng trọng số từng tầng.
