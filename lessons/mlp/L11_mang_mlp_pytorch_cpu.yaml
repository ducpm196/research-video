- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Thêm <code>nn.Softmax(dim=1)</code> vào cuối mạng rồi truyền vào <code>nn.CrossEntropyLoss()</code>.<br><b>Lỗi
      2 (-20đ):</b> Quên <code>nn.ReLU()</code> giữa các tầng <code>Linear</code> làm mạng sụp thành hàm tuyến tính
      bậc nhất.<br><b>Lỗi 3 (-10đ):</b> Quên <code>model.eval()</code> và <code>with torch.no_grad():</code> lúc
      suy luận gây rò RAM.</div></td></tr></table>
    say: Ba lỗi kỹ thuật rất phổ biến cần tránh khi viết mạng nơ-ron trong PyTorch là như sau. Thứ nhất là lồng
      Softmax kép vào hàm mất mát chéo, thứ hai là thiếu hàm kích hoạt phi tuyến giữa các lớp. Và thứ ba là quên
      tắt theo dõi đạo hàm khi suy luận. Bạn hãy rà soát từng lỗi trên trước khi chuyển sang phần tự làm bài tập
      thực hành trên máy.
