      từng dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm
      tái lập chính xác trên nhiều máy. Chèn hàm phi tuyến giữa các lớp và truyền điểm số thô trực tiếp vào hàm mất mát là
