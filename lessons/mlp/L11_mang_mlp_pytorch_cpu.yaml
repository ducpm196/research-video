  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import torch, torch.nn as nn</div><div>torch.manual_seed(42)</div><div>X
      = torch.tensor([[0.,0.],[0.,1.],[1.,0.],[1.,1.]]); y = torch.tensor([0, 1, 1, 0])</div><div>lin = nn.Sequential(nn.Linear(2,
      16), nn.Linear(16, 2))</div><div>opt = torch.optim.SGD(lin.parameters(), lr=0.1); crit = nn.CrossEntropyLoss()</div><div>for
      _ in range(200): opt.zero_grad(); crit(lin(X), y).backward(); opt.step()</div><div>lin.eval()</div><div>with torch.no_grad():
      acc = (lin(X).argmax(1) == y).float().mean().item()</div><div>z1 = torch.tensor([[2.0, -2.0]], requires_grad=True);
      z2 = z1.clone().detach().requires_grad_(True)</div><div>t = torch.tensor([1]); crit(z1, t).backward(); crit(torch.softmax(z2,
      1), t).backward()</div><div>gr, gs = z1.grad.abs().sum(), z2.grad.abs().sum()</div><div>print(f''no_relu={acc:.2f}
      grad_raw={gr:.4f} grad_soft2={gs:.4f}'')</div></div>'
    say: Ở nhánh đối chứng, ta chứng minh mạng thuần tuyến tính thiếu ReLU chỉ đạt hai mươi lăm phần trăm trên XOR. Ta cũng
      đo lỗi đặt nhầm Softmax hai lần trước hàm mất mát chéo làm đạo hàm suy giảm mạnh. Do không có lớp kích hoạt phi tuyến
