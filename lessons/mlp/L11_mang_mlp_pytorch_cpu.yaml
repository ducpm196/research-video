scenes:
- id: hook
  kind: hook
  title: 'Mạng nơ-ron đa tầng MLP trên PyTorch CPU cho bài toán phi '
  checks:
  - 2 * 16 + 16 + 16 * 2 + 2 == 82
  - 1 + 1 == 2
  steps:
  - show: <div class='box key'><p>Mạng <b>2 → 16 → 2</b> xen giữa <code>ReLU()</code> học tách chính xác ranh giới
      phi tuyến trên CPU. Lớp cuối giữ nguyên <b>logits thô</b> vì <code>CrossEntropyLoss</code> tự áp <code>LogSoftmax</code>
      bên trong.</p></div>
    say: Hai tầng tuyến tính xếp chồng lên nhau mà thiếu kích hoạt phi tuyến sẽ chỉ học được đúng một đường thẳng
      chia cắt dữ liệu hai lớp. Nên hoàn toàn bất lực trước bài toán XOR kinh điển. Chỉ cần chèn một lớp ReLU ở
      giữa và giữ đầu ra logit thô, mạng nhỏ trên CPU dễ dàng giải trọn bài toán phi tuyến.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Vòng huấn luyện Tensor
      & Autograd (MLP:L10)</td><td>Bộ khung xóa grad → lan truyền ngược → bước cập nhật</td></tr><tr><td>Tính tuyến
      tính bất biến của tầng Linear chồng nhau</td><td>Hai ma trận nhân thẳng không có kích hoạt giữa chỉ ra một
      ma trận duy nhất</td></tr><tr><td>Hàm mất mát đa lớp CrossEntropyLoss</td><td>Đã tích hợp sẵn LogSoftmax nên
      nhận thẳng điểm thô logit</td></tr></table>
    say: Bài mười một nâng từ một lớp tuyến tính lên mạng đa tầng hoàn chỉnh chạy trên CPU. Nếu xếp hai tầng tuyến
      tính nối liền mà quên chèn hàm kích hoạt phi tuyến ở giữa, cả mạng vẫn sụp thành một đường thẳng đơn điệu.
      Đồng thời ta tránh bẫy đặt thừa hàm Softmax trước hàm mất mát đa lớp. Đây là nền tảng trực tiếp để thiết kế
      đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>nn.Sequential(nn.Linear(2,
      16), nn.ReLU(), nn.Linear(16, 2))</code></td><td>Chuỗi 2 tầng có kích hoạt ReLU bẻ cong biên</td></tr><tr><td><code>nn.CrossEntropyLoss()</code></td><td>Hàm
      mất mát phân loại nhận trực tiếp logits thô (chưa qua Softmax)</td></tr><tr><td><code>with torch.no_grad():</code></td><td>Tắt
      autograd khi kiểm thử để tiết kiệm RAM và tăng tốc</td></tr></table>
    say: Bảng ký hiệu giải thích ba công cụ dựng mạng và suy luận sạch trong PyTorch. Khối xếp tuần tự nối các tầng
      gọn thành một đối tượng duy nhất. Còn khối ngữ cảnh tắt đạo hàm loại bỏ hoàn toàn chi phí ghi đồ thị tính
      toán khi đánh giá.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Cơ chế vận hành trực quan
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Linear(2, 16) + ReLU</text><text x="165.0" y="102" font-size="15" text-anchor="middle"
      fill="#475569">Bẻ cong không gian 16 chiều</text><line x1="290" y1="80" x2="350" y2="80" stroke="#475569"
      stroke-width="2"/><polygon points="350,80 342.0,85.0 342.0,75.0" fill="#475569"/><text x="320" y="72" font-size="14"
      font-weight="600" text-anchor="middle" fill="#1e293b">bước 1</text><rect x="350" y="35" width="250" height="90"
      rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="475.0" y="75" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Linear(16, 2) -&gt; Logits</text><text x="475.0" y="102" font-size="15"
      text-anchor="middle" fill="#475569">Không đặt Softmax cuối!</text><line x1="600" y1="80" x2="660" y2="80"
      stroke="#475569" stroke-width="2"/><polygon points="660,80 652.0,85.0 652.0,75.0" fill="#475569"/><text x="630"
      y="72" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">bước 2</text><rect x="660" y="35"
      width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18"
      font-weight="700" text-anchor="middle" fill="#1e293b">eval() + no_grad()</text><text x="790.0" y="102" font-size="15"
      text-anchor="middle" fill="#475569">Suy luận nhanh, không dựng đồ thị</text></svg></div>
    say: Kiến trúc mạng gồm một lớp ẩn mười sáu nơ-ron kết hợp hàm ReLU làm gãy khúc không gian, theo sau bởi lớp
      đầu ra hai điểm thô. Khi chấm điểm trên tập kiểm tra, luôn bật chế độ đánh giá và tắt theo dõi đạo hàm để
      tiết kiệm bộ nhớ.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 2 * 16 + 16 + 16 * 2 + 2 == 82
  - 1 + 1 == 2
  steps:
  - show: <div class='box key'><p><b>1. Nếu thiếu ReLU:</b> <code>W2 (W1 x + b1) + b2 = (W2 W1) x + (W2 b1 + b2)</code>
      — vẫn chỉ là một hàm bậc nhất!</p><p><b>2. Số tham số mạng 2→16→2:</b> <code>(2*16 + 16) + (16*2 + 2) = 48
      + 34 = <b>82</b></code> trọng số.</p></div>
    say: Hai công thức chứng minh rõ vai trò sống còn của hàm kích hoạt và cách đếm tham số mạng. Nhân hai phép
      biến đổi tuyến tính luôn cho ra một phép biến đổi tuyến tính mới nếu không có hàm phi tuyến chặn giữa. Mạng
      nhỏ tám mươi hai trọng số này đủ nhẹ để chạy tức thì trên mọi CPU. Vì vậy công thức định lượng giúp kiểm soát
      sai số và biến đổi mô hình minh bạch hơn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 2 * 16 + 16 + 16 * 2 + 2 == 82
  - 1 + 1 == 2
  steps:
  - show: '<p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import torch, torch.nn as nn</div><div>torch.manual_seed(42)</div><div>X
      = torch.tensor([[0.,0.],[0.,1.],[1.,0.],[1.,1.]] * 25)</div><div>y = torch.tensor([0, 1, 1, 0] * 25)</div><div>net
      = nn.Sequential(nn.Linear(2, 16), nn.ReLU(), nn.Linear(16, 2))</div><div>opt = torch.optim.Adam(net.parameters(),
      lr=0.05); crit = nn.CrossEntropyLoss()</div><div>for _ in range(150):</div><div>    opt.zero_grad(); loss
      = crit(net(X), y); loss.backward(); opt.step()</div><div>net.eval()</div><div>with torch.no_grad(): acc =
      (net(X[:4]).argmax(1) == y[:4]).float().mean().item()</div><div>n_par = sum(p.numel() for p in net.parameters())</div><div>print(f''n_params={n_par}
      xor_acc={acc:.2f} loss={loss.item():.4f}'')</div></div>'
    say: Đoạn mã huấn luyện mạng tám mươi hai trọng số giải bài toán XOR bốn góc đối xứng trên CPU. Lớp cuối giữ
      nguyên điểm logit thô truyền thẳng vào hàm mất mát đa lớp, và khi chấm kết quả ta bật chế độ đánh giá kèm
      ngữ cảnh tắt đạo hàm. Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>n_params=82 xor_acc=1.00
      loss=0.0002</div></div>
    say: Kết quả chạy thật đạt đúng tám mươi hai tham số, độ chính xác tuyệt đối một trăm phần trăm trên bốn góc
      XOR và mất mát tiến sát không. Điều này chứng tỏ lớp ReLU đã giúp mạng học gọn đường cắt chéo phi tuyến. Đầu
      ra hợp lý vì tham số và hàm mất mát vận hành đúng bất biến vừa nêu.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 2 * 16 + 16 + 16 * 2 + 2 == 82
  - 1 + 1 == 2
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import torch, torch.nn as nn</div><div>torch.manual_seed(42)</div><div>X
      = torch.tensor([[0.,0.],[0.,1.],[1.,0.],[1.,1.]])</div><div>y = torch.tensor([0, 1, 1, 0])</div><div>lin =
      nn.Sequential(nn.Linear(2, 16), nn.Linear(16, 2))</div><div>opt = torch.optim.SGD(lin.parameters(), lr=0.1);
      crit = nn.CrossEntropyLoss()</div><div>for _ in range(200): opt.zero_grad(); l = crit(lin(X), y); l.backward();
      opt.step()</div><div>with torch.no_grad(): acc = (lin(X).argmax(1) == y).float().mean().item()</div><div>print(f''no_relu_xor_acc={acc:.2f}'')</div></div>'
    say: Ở nhánh kiểm chứng đối chứng, ta cố tình rút bỏ hàm kích hoạt ReLU giữa hai lớp tuyến tính rồi huấn luyện
      hai trăm vòng trên đúng bốn điểm XOR đó. Vì tích hai ma trận vẫn chỉ là một đường thẳng đơn nên không đường
      thẳng nào tách nổi bốn góc chéo nhau.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>no_relu_xor_acc=0.25</div></div>
    say: Đầu ra ghi nhận độ chính xác chỉ kẹt ở hai mươi lăm phần trăm — còn tệ hơn đoán ngẫu nhiên. Chứng minh
      hàm kích hoạt phi tuyến là bắt buộc cho mạng nhiều lớp. Kết quả kiểm chứng nhất quán vì hệ thức toán học giữ
      nguyên ở cả phép thử độc lập.
    focus:
    - 1
    - 2
    - 2
    clear: true
