      logit thô truyền thẳng vào hàm mất mát đa lớp, và khi chấm kết quả ta bật chế độ đánh giá kèm ngữ cảnh tắt đạo hàm.
      Từng dòng mã chạy xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Chỉ tám mươi
      hai tham số số thực chạy trên CPU đủ học trọn vẹn bài toán đối xứng chéo bốn điểm chỉ sau ít vòng.
