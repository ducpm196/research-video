  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Vòng huấn luyện Tensor & Autograd
      (MLP:L10)</td><td>Bộ khung xóa grad → lan truyền ngược → bước cập nhật</td></tr><tr><td>Tính tuyến tính bất biến của
      tầng Linear chồng nhau</td><td>Hai ma trận nhân thẳng không có kích hoạt giữa chỉ ra một ma trận duy nhất</td></tr><tr><td>Hàm
      mất mát đa lớp CrossEntropyLoss</td><td>Đã tích hợp sẵn LogSoftmax nên nhận thẳng điểm thô logit</td></tr></table>
    say: Bài mười một nâng từ một lớp tuyến tính lên mạng đa tầng hoàn chỉnh chạy trên CPU. Nếu xếp hai tầng tuyến tính nối
      liền mà quên chèn hàm kích hoạt phi tuyến ở giữa, cả mạng vẫn sụp thành một đường thẳng đơn điệu. Đồng thời ta tránh
      bẫy đặt thừa hàm Softmax trước hàm mất mát đa lớp. Hiểu rõ vai trò tạo đường ranh giới gấp khúc của hàm kích hoạt phi
      tuyến là chìa khoá giải thích năng lực biểu diễn tổng quát của mạng nhiều tầng. Quy trình này liên kết chặt chẽ từ khâu
      chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán và giới hạn
      phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Thiếu hàm bẻ cong giữa các tầng tuyến tính,
      mạng mười lớp vẫn sụp gọn về đúng một phép nhân ma trận tuyến tính duy nhất.
