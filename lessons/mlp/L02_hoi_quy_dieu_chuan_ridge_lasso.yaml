      import StandardScaler</div><div>from sklearn.pipeline import Pipeline</div><div>from sklearn.linear_model import Ridge</div><div>from
      sklearn.metrics import mean_squared_error as mse</div><div>X, y = make_regression(n_samples=120, n_features=12, n_informative=4,
      noise=25.0, random_state=42)</div><div>Xa, Xb, ya, yb = train_test_split(X, y, test_size=0.25, random_state=42)</div><div>for
      a in (0.1, 100.0):</div><div>    p = Pipeline([('sc', StandardScaler()), ('m', Ridge(alpha=a, random_state=42))]).fit(Xa,
      ya)</div><div>    print(f'a={a} norm={np.linalg.norm(p["m"].coef_):.2f} tr={mse(ya,p.predict(Xa)):.1f} te={mse(yb,p.predict(Xb)):.1f}')</div></div>
    say: Ta tách hai tập rồi bọc chuẩn hóa cùng hồi quy phạt bình phương ở hai mức không phẩy một và một trăm. Phép thử này
