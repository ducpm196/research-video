- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 12 - 4 == 8
  - round(50.12, 2) < 106.82
  steps:
  - show: <div class='box key'><p><b>1. Ridge (L2):</b> tối thiểu <code>||y - Xw||^2 + alpha * sum(w_j^2)</code>.</p><p><b>2.
      Lasso (L1):</b> tối thiểu <code>||y - Xw||^2 + alpha * sum(|w_j|)</code> → tạo nghiệm thưa.</p></div>
    say: Cả hai hàm mục tiêu đều cộng thêm phần phạt độ lớn trọng số nhân với siêu tham số điều chỉnh. Ở công thức thứ nhất,
      hình phạt bình phương kéo mạnh các trọng số quá lớn xuống nhanh. Ở công thức thứ hai, góc nhọn của hàm trị tuyệt đối
      khiến nhiều trọng số dừng ngay tại gốc tọa độ bằng không. Hình phạt bình phương chia đều áp lực co giảm lên tất cả các
      cột tương quan thay vì chọn đại một cột bỏ cột kia. Hình phạt trị tuyệt đối tạo ra góc nhọn trên biên ràng buộc khiến
      nghiệm tối ưu thường rơi trúng các trục toạ độ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
