  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 12 - 4 == 8
  - 983.9 < 2743.4
  steps:
  - show: <ol><li>Mô hình nào (<code>Ridge</code> hay <code>Lasso</code>) đưa hẳn trọng số nhiễu về đúng <code>0</code>?</li><li>Nếu
      quên chuẩn hóa cột đo bằng mét vs mi-li-mét, điều chuẩn bị lệch ra sao?</li></ol>
    say: Hãy tự kiểm tra qua hai câu hỏi chốt bài ngay sau đây. Câu một, mô hình nào tự động đẩy hẳn trọng số cột nhiễu về
      đúng không? Câu hai, nếu quên chuẩn hóa hai cột lệch đơn vị mét và mi-li-mét thì hình phạt bị sai ở đâu? Bấm tạm dừng
      và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <b>Lasso</b> (phạt L1 trị tuyệt đối) đẩy hệ số các đặc
      trưng yếu về đúng <code>0</code>.</p></td></tr></table>
    say: 'Đáp án câu một: mô hình phạt trị tuyệt đối là Lasso mới đưa hẳn hệ số cột dư thừa về đúng không. Nhờ khả năng ép
      thẳng về không, phép phạt trị tuyệt đối giúp mô hình gọn nhẹ và dễ giải thích hơn với người dùng.'
    clear: true
    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Cột có độ lớn số nhỏ (hoặc lớn khác nhau) chịu mức phạt
      không đồng đều vì hình phạt tính trực tiếp theo bình phương hoặc trị tuyệt đối của w.</p></td></tr></table>
    say: 'Đáp án câu hai: hình phạt tính thẳng trên giá trị trọng số nên hai cột khác đơn vị sẽ bị phạt nặng nhẹ hoàn toàn
      mất cân xứng. Việc nhân một cột với mười làm trọng số lý tưởng giảm mười lần khiến hình phạt bình phương tác động khác
      hoàn toàn.'
    clear: true
    focus: null
- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Chọn
      mức điều chuẩn giữ sai số kiểm thử thấp và mô hình ổn định</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=150
      n_features=12 n_informative=4 noise=2.0 seed=42 r_low=10.0 r_high=100.0 lasso_alpha=2.0</code></td></tr><tr><td><b>Chấm
      bài (.venv-ml)</b></td><td><code>bash labs/cham.sh MLP L02 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 2 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Bài tập yêu cầu bạn so sánh định lượng số lượng trọng số bằng không giữa hai phương pháp trên cùng tập nhiễu.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (sinh dữ liệu)</b></td><td>Gọi <code>make_regression</code> từ tham số đọc qua <code>stdin</code> cùng <code>random_state=seed</code></td></tr><tr><td><b>Bước
      2 (hai mức Ridge)</b></td><td>Khớp <code>Ridge(r_low)</code> và <code>Ridge(r_high)</code> trong <code>Pipeline</code>
      rồi so chuẩn <code>np.linalg.norm</code></td></tr><tr><td><b>Bước 3 (Lasso)</b></td><td>Khớp <code>Lasso(lasso_alpha)</code>
      trong <code>Pipeline</code> và đếm số trọng số thoả <code>abs(w) &lt; 1e-6</code></td></tr></table>
    say: Bạn sinh dữ liệu hồi quy theo đúng hạt giống từ luồng chuẩn rồi bọc chuẩn hoá với từng mô hình điều chuẩn. Hãy nhớ
      so sánh chuẩn L2 của véc-tơ trọng số giữa hai mức phạt an-pha thấp và cao. Kiểm tra chuẩn độ dài hai của véc-tơ trọng
      số ở hai mức phạt thấp cao để xác nhận đúng bất biến co rút.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>ridge_zero_coefs=0</div><div>lasso_zero_coefs=8</div><div>higher_alpha_shrinks=1</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Chuẩn hóa trước khi phạt</span><span class="a">→</span><span class="n">Ridge
      L2 co mượt</span><span class="a">→</span><span class="n">Lasso L1 chọn cột</span></div>
    say: Chuỗi quy tắc điều chuẩn nhấn mạnh vai trò co nhỏ trọng số của Ridge khi cộng tuyến và lọc bỏ biến nhiễu về không
      của Lasso sau chuẩn hoá. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng
      sau từng dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm
      tái lập chính xác trên nhiều máy. Chuẩn hoá thang đo trước khi điều chuẩn giúp hai phương pháp co trọng số phát huy
      tối đa sức mạnh kiểm soát nhiễu. Khi cần chọn lọc đặc trưng ít cột thì ưu tiên phạt bậc một, còn khi giữ toàn bộ cột
      tương quan thì chọn bậc hai.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L02:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 2 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Biết
      cách chọn giữa hai dạng phạt giúp bạn làm chủ ranh giới giữa độ khớp dữ liệu và nguy cơ học thuộc lòng nhiễu.
    clear: true
    focus: null
