      cột thu nhập (triệu)</td><td>Cột thu nhập bị phạt nhẹ, cột tuổi phạt nặng</td><td>Bắt buộc đặt StandardScaler trước
      Ridge/Lasso</td></tr></table>
    say: Bảng quy mô cho thấy tiêu chí chọn loại hình phạt theo hình dạng bảng dữ liệu lớn. Khi có hàng vạn cột rời rạc tương
      quan, phạt bình phương chạy ổn định hơn. Còn khi muốn lọc ra ít đặc trưng giải thích cho nghiệp vụ thì ưu tiên phạt
      trị tuyệt đối. Tuỳ bài toán giữ lại toàn bộ tín hiệu yếu hay tự động loại bỏ biến nhiễu mà bạn lựa chọn giữa hồi quy
      phạt bình phương hoặc phạt trị tuyệt đối. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành
      tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho
      dịch vụ không tụt hiệu năng hay sập bộ nhớ. Đối với bảng vài vạn đặc trưng rời rạc, phạt bình phương giữ đầy đủ tín
      hiệu ổn định mà không làm vỡ nhóm.
