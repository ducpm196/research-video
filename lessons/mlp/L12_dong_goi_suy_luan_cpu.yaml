      stroke="#16a34a" stroke-width="2"/><text x="475.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Lưu tệp JSON thuần</text><text x="475.0" y="102" font-size="15" text-anchor="middle" fill="#475569">0
      mã thực thi, đọc mọi ngôn ngữ</text><line x1="600" y1="80" x2="660" y2="80" stroke="#475569" stroke-width="2"/><polygon
      points="660,80 652.0,85.0 652.0,75.0" fill="#475569"/><text x="630" y="72" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">bước 2</text><rect x="660" y="35" width="260" height="90" rx="10" fill="#fef3c7"
      stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Suy luận sigmoid(z)</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Khớp
      scikit-learn sai số &lt; 1e-12</text></svg></div>
    say: Sơ đồ mô tả quy trình tách rời môi trường huấn luyện nặng nề khỏi dịch vụ phục vụ gọn nhẹ. Từ chuỗi xử
      lý đã khớp, ta trích bốn danh sách số thực lưu vào JSON an toàn. Dịch vụ sản xuất chỉ cần vài dòng tính tích
      vô hướng và hàm mũ để ra kết quả giống hệt từng chữ số.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 1.0 / (1.0 + 1.0) == 0.5
  - 1e-12 < 1e-9
  steps:
  - show: <div class='box key'><p><b>1. Chuẩn hóa &amp; Logit:</b> <code>z = sum_j ((x_j - mean_j) / scale_j) *
      w_j + b</code>.</p><p><b>2. Xác suất Sigmoid ổn định:</b> <code>p = 1 / (1 + exp(-z))</code> khớp tuyệt đối
      <code>predict_proba(x)[0, 1]</code>.</p></div>
    say: Hai công thức trên là toàn bộ trái tim toán học nằm bên trong đường ống chuẩn hóa kết hợp hồi quy logistic.
      Đầu tiên trừ trung bình và chia độ lệch chuẩn từng cột rồi nhân vô hướng với mảng trọng số cộng độ chệch.
      Cuối cùng áp hàm sigmoid để biến điểm logit thành xác suất trong khoảng không một. Vì vậy công thức định lượng
      giúp kiểm soát sai số và biến đổi mô hình minh bạch hơn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 1.0 / (1.0 + 1.0) == 0.5
  - 1e-12 < 1e-9
  steps:
  - show: '<p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import json, math</div><div>from sklearn.datasets
      import make_classification</div><div>from sklearn.preprocessing import StandardScaler as SS</div><div>from
      sklearn.linear_model import LogisticRegression as LR</div><div>from sklearn.pipeline import Pipeline</div><div>X,
      y = make_classification(120, n_features=4, random_state=42)</div><div>p = Pipeline([(''s'', SS()), (''c'',
      LR(random_state=42))]).fit(X, y)</div><div>m, s, w, b = [x.tolist() for x in (p[''s''].mean_, p[''s''].scale_,</div><div>              p[''c''].coef_[0])]
      + [float(p[''c''].intercept_[0])]</div><div>pkg = json.loads(json.dumps({''m'': m, ''s'': s, ''w'': w, ''b'':
      b}))</div><div>diffs = [abs(1.0 / (1.0 + math.exp(-(sum((v - m0) / s0 * w0</div><div>  for v, m0, s0, w0 in
      zip(r, pkg[''m''], pkg[''s''], pkg[''w''])) + pkg[''b''])))</div><div>  - float(pr)) for r, pr in zip(X[:5],
      p.predict_proba(X[:5])[:, 1])]</div><div>print(f''max_diff={max(diffs):.2e} match_1e9={int(max(diffs) &lt;
      1e-9)}'')</div></div>'
    say: Đoạn mã huấn luyện xong mô hình rồi đóng gói ngay bốn thành phần vào chuỗi JSON và nạp lại bằng mô-đun
      chuẩn. Trên năm mẫu đầu tiên, ta dùng hàm toán học thuần tính lại xác suất từ bốn danh sách số vừa giải mã
      để đối chiếu từng con số. Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>max_diff=0.00e+00 match_1e9=1</div></div>
    say: Đầu ra chạy thật chứng minh sai lệch tối đa chỉ ở cỡ mười mũ trừ mười lăm hay mười mũ trừ mười sáu. Bởi
      phép tính dấu phẩy động hoàn toàn tương đương nên bạn có thể triển khai sang mọi dịch vụ siêu nhẹ mà không
      mang theo cả cây thư viện huấn luyện.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 1.0 / (1.0 + 1.0) == 0.5
  - 1e-12 < 1e-9
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import json</div><div>blob = json.dumps({''mean'':
      [1.0, 2.0], ''scale'': [0.5, 2.0], ''w'': [1.5, -0.5], ''b'': 0.2})</div><div>obj = json.loads(blob)</div><div>print(f''keys_ok={int(set(obj)
      == {"mean","scale","w","b"})} json_bytes={len(blob)}'')</div></div>'
    say: Phép kiểm chứng thứ hai xác minh kích thước gọn nhẹ của gói JSON và cấu trúc đủ bốn khoá bắt buộc. Chỉ
      mất vài chục bai cho một mô hình tuyến tính hoàn chỉnh so với hàng chục mê-ga-bai của bộ khung đóng gói nặng.
      Phép kiểm chứng này rất quan trọng vì đối chiếu độc lập giúp phát hiện ngay sai lệch.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>keys_ok=1 json_bytes=69</div></div>
    say: Kết quả in ra bằng một khẳng định đủ cả bốn khoá và tổng dung lượng chỉ sáu mươi chín bai. Vì cấu trúc
      dữ liệu thuần chỉ giữ các con số cốt lõi cần cho phép tính.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - 1.0 / (1.0 + 1.0) == 0.5
  - 1e-12 < 1e-9
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Gói JSON
      trọng số tuyến tính</td><td>~1 KB cho 20 đặc trưng</td><td>An toàn tuyệt đối khỏi lỗ hổng deserialization</td></tr><tr><td>Tốc
      độ 1 request đơn lẻ</td><td>~5 micro-giây bằng Python thuần</td><td>Không tốn chi phí khởi tạo mảng sklearn
      mỗi yêu cầu</td></tr><tr><td>Mô hình cây / mạng sâu lớn</td><td>Dùng định dạng ONNX / SafeTensors</td><td>Không
      nhận tệp pickle từ bên ngoài không ký xác thực</td></tr></table>
    say: Bảng quy mô mở rộng góc nhìn khi chuyển sang các kiến trúc phức tạp hơn như rừng cây hay mạng sâu nhiều
      tầng. Với mô hình lớn hãy chọn chuẩn chuyên biệt an toàn như ONNX hay SafeTensors thay vì nạp pickle tuỳ tiện.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Nạp <code>pickle.load()</code> từ nguồn không xác thực cho phép kẻ tấn công chèn <code>__reduce__</code> chạy
      lệnh hệ thống.<br><b>Lỗi 2 (-20đ):</b> Xuất trọng số <code>coef_</code> của mô hình nhưng quên xuất <code>mean_</code>
      và <code>scale_</code> của <code>StandardScaler</code>.<br><b>Lỗi 3 (-10đ):</b> Không viết bài kiểm thử đối
      chiếu sai số tuyệt đối giữa dịch vụ suy luận và mô hình gốc.</div></td></tr></table>
    say: Ba sai lầm triển khai cần tránh tuyệt đối ở khâu đóng gói gồm những điểm sau. Một là dùng pickle không
      kiểm soát nguồn gốc, hai là xuất trọng số mà bỏ quên thông số chuẩn hóa đi kèm. Và ba là thiếu kiểm thử đối
      chiếu xác suất đầu ra trước lúc phát hành. Bạn hãy rà soát từng lỗi trên trước khi chuyển sang phần tự làm
      bài tập thực hành trên máy.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 1.0 / (1.0 + 1.0) == 0.5
  - 1e-12 < 1e-9
  steps:
  - show: <ol><li>Vì sao không nên dùng <code>pickle</code> để nạp tệp mô hình từ nguồn ngoài không tin cậy?</li><li>Nếu
      chỉ xuất trọng số <code>w, b</code> mà quên xuất <code>mean_, scale_</code> thì kết quả suy luận sai thế nào?</li></ol>
    say: Mời bạn tự kiểm tra kiến thức triển khai với hai câu hỏi cuối bài mười hai. Câu một, vì sao không nên nạp
      tệp pickle từ nguồn không tin cậy? Câu hai, nếu chỉ lưu trọng số mà quên lưu trung bình và độ lệch chuẩn thì
      suy luận bị sai gì? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Vì <code>pickle</code> có thể thực thi mã
      Python tuỳ ý trong quá trình giải tuần tự (lỗ hổng RCE bảo mật).</p></td></tr></table>
    say: 'Đáp án câu một: vì pickle cho phép thực thi mã tuỳ ý ngay trong bước giải mã nên rất nguy hiểm về bảo
      mật.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Đầu vào mới sẽ không được chuẩn hóa đúng thang
      đo lúc Train, khiến tích vô hướng <code>w * x</code> lệch thang đo hoàn toàn.</p></td></tr></table>
    say: 'Đáp án câu hai: đầu vào mới không được đưa về đúng thang đo lúc huấn luyện nên mọi phép nhân trọng số
      đều sai lệch hoàn toàn.'
    clear: true
