  steps:
  - show: '<div class=''box key''><p>Đóng gói an toàn <b>4 khoá JSON</b>: <code>mean</code>, <code>scale</code>, <code>w</code>,
      <code>b</code>. Phép suy luận thuần <code>1 / (1 + exp(-(sum((x - mean)/scale * w) + b)))</code> khớp gốc với độ lệch
      tối đa <code>&lt; <b>1e-12</b></code>.</p></div>'
    say: Khi cập nhật phiên bản thư viện máy chủ, rất nhiều tệp pickle cũ lập tức báo lỗi không nạp được. Chưa kể rủi ro chèn
      mã thực thi tuỳ ý qua hàm tạo đối tượng. Nếu xuất mô hình tuyến tính ra đúng bốn trường số JSON, bất kỳ ngôn ngữ nào
      từ Python tới Go đều suy luận chuẩn xác dưới một phần mười mi-li-giây. Đóng gói trọng số thành dữ liệu số thuần túy
      xóa bỏ hoàn toàn sự lệ thuộc vào phiên bản thư viện lúc huấn luyện.
    clear: true
    focus: null
