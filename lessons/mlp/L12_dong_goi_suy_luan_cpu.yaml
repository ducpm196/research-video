scenes:
- id: hook
  kind: hook
  title: 'Đóng gói trọng số an toàn JSON, bất biến suy luận & đo độ '
  checks:
  - 1.0 / (1.0 + 1.0) == 0.5
  - 1e-12 < 1e-9
  steps:
  - show: '<div class=''box key''><p>Đóng gói an toàn <b>4 khoá JSON</b>: <code>mean</code>, <code>scale</code>,
      <code>coef</code>, <code>intercept</code>. Phép suy luận thuần <code>1 / (1 + exp(-(sum((x - mean)/scale *
      w) + b)))</code> khớp gốc với độ lệch tối đa <code>&lt; <b>1e-12</b></code>.</p></div>'
    say: Khi cập nhật phiên bản thư viện máy chủ, rất nhiều tệp pickle cũ lập tức báo lỗi không nạp được. Chưa kể
      rủi ro chèn mã thực thi tuỳ ý qua hàm tạo đối tượng. Nếu xuất mô hình tuyến tính ra đúng bốn trường số JSON,
      bất kỳ ngôn ngữ nào từ Python tới Go đều suy luận chuẩn xác dưới một phần mười mi-li-giây.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: '<table class=''t''><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Rủi ro bảo mật định
      dạng Pickle</td><td>Nạp tệp pickle cho phép chạy mã Python tuỳ ý lúc giải tuần tự</td></tr><tr><td>Chuỗi xử
      lý khép kín (MLP:L00)</td><td>Toàn bộ mô hình tuyến tính chỉ gồm 4 mảng số: mean, scale, coef, intercept</td></tr><tr><td>Kiểm
      chứng tương đương toán học</td><td>Dịch vụ Python thuần không cài scikit-learn vẫn tính khớp sai số < 1e-12</td></tr></table>'
    say: Huấn luyện xong một mô hình tốt mới chỉ là nửa chặng đường, nửa sau là triển khai an toàn và nhẹ nhàng
      vào dịch vụ. Định dạng pickle quen thuộc tiềm ẩn nguy cơ thực thi mã độc và phụ thuộc cứng phiên bản thư viện
      lúc huấn luyện. Bài mười hai hướng dẫn xuất toàn bộ trọng số sang JSON thuần và đối chứng độ chính xác tuyệt
      đối. Đây là nền tảng trực tiếp để thiết kế đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>json.dumps({''mean'':
      ..., ''scale'': ..., ''coef'': ..., ''b'': ...})</code></td><td>Đóng gói tham số thuần dữ liệu, không thực
      thi mã</td></tr><tr><td><code>math.exp(-z)</code></td><td>Hàm mũ chuẩn thư viện gốc để tính sigmoid không
      cần thư viện ngoài</td></tr><tr><td><code>max_abs_diff &lt; 1e-9</code></td><td>Bất biến đối chiếu đầu ra
      suy luận thuần so với scikit-learn</td></tr></table>'
    say: Bảng ký hiệu nêu cấu trúc gói JSON thuần dữ liệu và ngưỡng sai số đối chiếu. Khác với tệp nhị phân pickle,
      tệp JSON chỉ chứa các số dấu phẩy động đọc hiểu bằng mắt thường. Hàm đối chứng yêu cầu sai lệch giữa hàm tự
      viết và thư viện gốc nhỏ hơn một phần tỉ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Cơ chế vận hành trực quan
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Huấn luyện Pipeline</text><text x="165.0" y="102" font-size="15" text-anchor="middle"
      fill="#475569">Trích mean, scale, w, b</text><line x1="290" y1="80" x2="350" y2="80" stroke="#475569" stroke-width="2"/><polygon
