    say: Bây giờ đến phần bạn tự thực hành và chấm điểm trực tiếp trên máy bằng môi trường CPU chuẩn của kho. Bạn
      mở tệp đề bài, tự viết lời giải hoàn chỉnh vào tệp Python riêng rồi chạy lệnh chấm tự động để đối chiếu từng
