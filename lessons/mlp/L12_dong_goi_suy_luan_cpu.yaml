- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round(1.0 / (1.0 + 2.718281828459045 ** (-1.0)), 6) == 0.731059
  - round(1e-9 / 1e-12, 1) == 1000.0
  steps:
  - show: <div class='box key'><p><b>1. Chuẩn hóa &amp; Logit:</b> <code>z = sum_j ((x_j - mean_j) / scale_j) * w_j + b</code>.</p><p><b>2.
      Xác suất Sigmoid ổn định:</b> <code>p = 1 / (1 + exp(-z))</code> khớp tuyệt đối <code>predict_proba(x)[0, 1]</code>.</p></div>
    say: Hai công thức trên là toàn bộ trái tim toán học nằm bên trong đường ống chuẩn hóa kết hợp hồi quy logistic. Đầu tiên
      trừ trung bình và chia độ lệch chuẩn từng cột rồi nhân vô hướng với mảng trọng số cộng độ chệch. Cuối cùng áp hàm sigmoid
      để biến điểm logit thành xác suất trong khoảng không một. Việc tách định nghĩa tham số trên tập huấn luyện rất quan
      trọng vì nó quyết định độ trung thực của thước đo tổng quát. Mọi công thức chuyển đổi trước khi đóng gói ra sản phẩm
      đều phải giữ đúng giả định toán học ban đầu để không gây sai số tích lũy. Bước trừ trung bình chia độ lệch chuẩn phải
      chạy đúng thứ tự cho từng chiều đặc trưng trước khi nhân với véc-tơ trọng số. Hàm lô-gít biến tổng điểm tuyến tính về
      dải xác suất trơn mượt nằm trong khoảng không tới một dễ đặt ngưỡng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
