      import make_classification</div><div>from sklearn.preprocessing import StandardScaler as SS</div><div>from sklearn.linear_model
      import LogisticRegression as LR</div><div>from sklearn.pipeline import Pipeline</div><div>X, y = make_classification(120,
      n_features=4, random_state=42)</div><div>p = Pipeline([(''s'', SS()), (''c'', LR(random_state=42))]).fit(X, y)</div><div>m,
      s, w, b = [x.tolist() for x in (p[''s''].mean_, p[''s''].scale_,</div><div>              p[''c''].coef_[0])] + [float(p[''c''].intercept_[0])]</div><div>pkg
      = json.loads(json.dumps({''mean'': m, ''scale'': s, ''w'': w, ''b'': b}))</div><div>diffs = [abs(1.0 / (1.0 + math.exp(-(sum((v
      - m0) / s0 * w0</div><div>  for v, m0, s0, w0 in zip(r, pkg[''mean''], pkg[''scale''], pkg[''w''])) + pkg[''b''])))</div><div>  -
      float(pr)) for r, pr in zip(X[:5], p.predict_proba(X[:5])[:, 1])]</div><div>print(f''max_diff={max(diffs):.2e} match_1e9={int(max(diffs)
      &lt; 1e-9)}'')</div></div>'
    say: Đoạn mã huấn luyện xong mô hình rồi đóng gói ngay bốn thành phần vào chuỗi JSON và nạp lại bằng mô-đun chuẩn. Trên
      năm mẫu đầu tiên, ta dùng hàm toán học thuần tính lại xác suất từ bốn danh sách số vừa giải mã để đối chiếu từng con
      số. Từng dòng mã chạy xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Hàm suy
      luận thuần không dùng bất kỳ thư viện học máy nào vẫn tái tạo trùng khớp từng con số từ gói bốn khoá.
    focus:
    - 1
    - 2
    - 2
    - 2
