  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>max_diff=0.00e+00 match_1e9=1</div></div>
    say: Đầu ra chạy thật chứng minh sai lệch tối đa chỉ ở cỡ mười mũ trừ mười lăm hay mười mũ trừ mười sáu. Bởi phép tính
      dấu phẩy động hoàn toàn tương đương nên bạn có thể triển khai sang mọi dịch vụ siêu nhẹ mà không mang theo cả cây thư
      viện huấn luyện. Giá trị đầu ra thu được khớp chặt với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết.
      Sai lệch cỡ mười mũ trừ mười lăm chỉ đơn thuần là giới hạn làm tròn chuẩn của số thực sáu mươi bốn bít trong máy tính.
