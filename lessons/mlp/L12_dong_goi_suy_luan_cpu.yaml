  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Nạp <code>pickle.load()</code>
