      chuẩn (MLP:L05)</td><td>Đo PR-AUC và Brier thay cho Accuracy ảo</td></tr><tr><td>So sánh hai họ mô hình (MLP:L00/L07)</td><td>Tuyến
      tính có Pipeline chuẩn hóa vs Cây tăng cường độ dốc</td></tr></table>
    say: 'Bài mười ba khép lại khoá học máy thực hành bằng một tình huống chuyên gia hoàn chỉnh từ dữ liệu thô tới kiểm thử
      phát hành. Bài toán đặt ra là phát hiện giao dịch gian lận chỉ chiếm bốn phần trăm theo dòng thời gian. Ta ghép mọi
      hàng rào kỹ thuật đã học: chia tập theo thứ tự thời gian. Cân bằng lớp, so sánh hai mô hình và kiểm thử suy luận dưới
      mức ba mươi giây. Xử lý bài toán gian lận thực tế đòi hỏi kết nối đồng thời kỹ thuật tách ranh giới thời gian, xử lý
      mất cân bằng và đo lường độ phủ xác thực. Quy trình này liên kết chặt chẽ từ khâu chuẩn bị dữ liệu tới bước đánh giá
      kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán và giới hạn phần cứng CPU giúp kỹ sư tránh tối
      ưu lệch trọng tâm khi xử lý dữ liệu thật. Bài cuối khoá quy tụ mọi kỹ thuật tinh hoa từ tách tập, xử lý bảng, đánh giá
      độ chuẩn xác phủ cho tới tăng cường độ dốc.'
