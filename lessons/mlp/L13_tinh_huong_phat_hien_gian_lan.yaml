- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Dùng <code>train_test_split(shuffle=True)</code>
      cắt ngẫu nhiên giao dịch theo thời gian làm lộ tương lai.<br><b>Lỗi 2:</b> Báo cáo độ chính xác 96% làm tiêu chuẩn nghiệm
      thu trên tập chỉ có 4% gian lận.<br><b>Lỗi 3:</b> Không cố định hạt giống ngẫu nhiên khiến kết quả chấm tự động lệch
      qua từng lần chạy.</div></td></tr></table>
    say: Trước khi bắt tay hoàn thành bài thực hành cuối khoá, bạn rà kỹ ba sai lầm chí tử sau đây. Một là xáo trộn ngẫu nhiên
      làm rò rỉ thời gian. Hai là lấy độ chính xác tổng thể chín mươi sáu phần trăm làm tiêu chí, và ba là quên đặt hạt giống
      cố định. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ lỗi về
      sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu mới.
      Chỉ cần để sót một cột có dấu vết thời gian tương lai lọt vào bảng, cả quy trình đánh giá công phu sẽ sụp đổ hoàn toàn.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - round(12 / 250, 3) == 0.048
  - 0.322 > 0.211
  steps:
  - show: <ol><li>Khi bảng dữ liệu theo ngày có 1 000 dòng, vì sao dùng lát cắt <code>[:750] / [750:]</code> thay vì <code>train_test_split</code>
      mặc định?</li><li>Trên tập 4% gian lận, dự đoán toàn 0 đạt Accuracy và PR-AUC cỡ bao nhiêu?</li></ol>
    say: Mời bạn tự kiểm tra kiến thức tổng kết bằng hai câu hỏi cuối khoá. Câu một, vì sao dùng lát cắt theo thời gian thay
      cho hàm chia mặc định xáo trộn ngẫu nhiên? Câu hai, đoán toàn không trên tập bốn phần trăm gian lận cho độ chính xác
      và PR-AUC cỡ bao nhiêu? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Vì <code>train_test_split</code> mặc định có <code>shuffle=True</code>
      sẽ trộn giao dịch tương lai vào Train; cắt tuyến tính giữ nguyên thứ tự thời gian.</p></td></tr></table>
    say: 'Đáp án câu một: vì hàm chia mặc định xáo trộn ngẫu nhiên khiến dữ liệu tương lai lọt vào quá khứ. Còn cắt tuần tự
      bảo toàn tuyệt đối thứ tự thời gian. Cắt tuần tự theo thứ tự phát sinh là quy tắc bất di bất dịch trong phát hiện gian
      lận, dự báo nhu cầu và mọi bài toán có trục thời gian.'
    focus:
    - 0
    - '1.2'
    - 0
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code>Accuracy ≈ <b>96%</b></code> nhưng <code>PR-AUC
      ≈ <b>0.04</b></code> (bằng tỉ lệ dương tự nhiên, vô dụng để phát hiện gian lận).</p></td></tr></table>
    say: 'Đáp án câu hai: độ chính xác tới chín mươi sáu phần trăm nhưng diện tích chuẩn xác phủ chỉ vỏn vẹn quanh không phẩy
      không bốn. Đặt chuẩn so sánh tối thiểu ngay từ đường nền giúp kiểm chứng mọi đồng thời gian tính toán bỏ ra đều đem
      lại giá trị thật.'
