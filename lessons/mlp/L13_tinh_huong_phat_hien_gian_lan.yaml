- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Cắt thời gian 75/25</span><span class="a">→</span><span class="n">HistGB + PR-AUC
      + Brier</span><span class="a">→</span><span class="n">Tất định CPU <= 5 s</span></div>
    say: Dự án phát hiện gian lận chốt lại bằng lát cắt thời gian nghiêm ngặt, mô hình tăng cường độ dốc và đối chứng vượt
      đường nền xác định. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng sau từng
      dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm tái lập
      chính xác trên nhiều máy. Khép lại hành trình học máy bảng trên CPU bằng kỷ luật cắt thời gian nghiêm ngặt, đo chuẩn
      lớp hiếm và kiểm chứng đường nền. Mỗi quyết định triển khai đều được bảo vệ bằng chứng cứ thực nghiệm sạch bóng rò rỉ
      dữ liệu từ bước đầu tới bước cuối.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L13:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 13 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Chúc
      mừng bạn đã hoàn thành trọn vẹn mười bốn bài thực chiến vững chắc để tự tin xây dựng hệ thống học máy tin cậy.
    clear: true
    focus: null
