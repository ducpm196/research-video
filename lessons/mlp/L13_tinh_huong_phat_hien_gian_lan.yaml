- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 750 + 250 == 1000
  - 1000 * 0.04 == 40.0
  steps:
  - show: <div class='box key'><p><b>1. Đường cơ sở vô dụng:</b> dự đoán toàn 0 trên 4% gian lận cho <code>Accuracy
      = <b>96%</b></code> nhưng <code>PR-AUC ≈ <b>0,04</b></code>.</p><p><b>2. Bất biến triển khai:</b> thời gian
      chạy toàn bộ trên CPU <code>&lt;&lt; 30 s</code> và kết quả lặp lại <b>100%</b> với <code>random_state=42</code>.</p></div>
    say: Hai bất biến định lượng chốt chặn cho cả hệ thống thực chiến được nêu rõ trên bảng. Thước đo chuẩn xác
      phủ ban đầu chỉ bằng không phẩy không bốn cho dự đoán mù. Nên mọi mô hình tốt hơn sẽ vọt cao lên rõ rệt so
      với đường nền đó. Còn hạt giống cố định bảo đảm đồng nghiệp chạy lại trên máy khác cũng nhận ra đúng từng
      chữ số.
