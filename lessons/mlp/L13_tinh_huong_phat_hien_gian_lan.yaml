- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - 750 + 250 == 1000
  - round(12 / 250, 3) == 0.048
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>1 000 giao dịch
      CPU</td><td>Huấn luyện và đánh giá vài giây (&lt;= 5 s)</td><td>Lặp lại 100% cùng random_state=42</td></tr><tr><td>1
      000 000 giao dịch thật</td><td>Tốn vài phút CPU và RAM tăng gấp ~1 000 lần</td><td>Cắt theo ngày, lấy mẫu phân tầng
      thời gian, giữ cổng tích hợp liên tục (CI)</td></tr><tr><td>Sau khi lên sản xuất (deploy)</td><td>Theo dõi trôi dữ liệu
      &amp; sai số hiệu chuẩn (ECE/Brier)</td><td>Kích hoạt huấn luyện lại khi sai số lệch quá ngưỡng</td></tr></table>
    say: Bảng quy mô khép lại toàn bộ vòng đời thực chiến từ tập mẫu nghìn dòng chạy vài giây tới vận hành triệu giao dịch
      tốn vài phút và gấp nghìn lần bộ nhớ. Nhờ giữ nguyên hai độ đo chuẩn, giải thích sai số hiệu chuẩn cùng cổng tích hợp
      liên tục trước khi triển khai, chất lượng mô hình luôn được bảo vệ lâu dài. Khi hệ thống đi vào vận hành chính thức,
      báo cáo so sánh giữa mô hình chính và đường nền tầm thường là bằng chứng thuyết phục nhất trước lúc phát hành. Tuân
      thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực
      tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch vụ không tụt hiệu năng hay sập bộ nhớ.
      Từ một nghìn mẫu thử nghiệm lên hệ thống triệu giao dịch hằng ngày, ba nguyên tắc đánh giá trên vẫn giữ nguyên giá trị
      cốt lõi.
