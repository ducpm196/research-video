    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L13</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (cắt thời gian)</b></td><td>Dùng lát cắt <code>[:train_n]</code> Train và <code>[train_n:]</code> Test, không gọi xáo
      trộn ngẫu nhiên</td></tr><tr><td><b>Bước 2 (huấn luyện)</b></td><td>Khớp <code>HistGradientBoostingClassifier(max_iter=...,
      learning_rate=..., random_state=seed)</code></td></tr><tr><td><b>Bước 3 (đối chứng)</b></td><td>Đo <code>average_precision_score(y_te,
      p)</code> và kiểm tra lớn hơn đường nền toàn không</td></tr></table>
    say: Bạn đọc số lượng mẫu, tỉ trọng lớp hiếm, điểm cắt thời gian và siêu tham số bộ tăng cường độ dốc từ luồng chuẩn.
      Cắt mảng tuần tự theo chỉ số thời gian tuyệt đối thay vì xáo trộn ngẫu nhiên rồi đối chiếu điểm PR-AUC với đường nền
      dự đoán toàn không. Đối chiếu điểm diện tích chuẩn xác phủ của mô hình tăng cường vượt rõ rệt đường cơ sở trước khi
