- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L13
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L13</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Kiểm
      thử đường nền đối chứng và tính tất định trên CPU sẵn sàng triển khai</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=1000
      w_neg=0.96 w_pos=0.04 n_informative=6 seed=42 train_n=750 max_iter=50 lr=0.1</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash
      labs/cham.sh MLP L13 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 13 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Hoàn thiện bài thực hành tổng hợp đọc đầy đủ thông số từ luồng chuẩn để kiểm tra cả bộ tăng cường độ dốc và
      đường nền.
