- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 0.322 > 0.211
  - 750 + 250 == 1000
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.pipeline import Pipeline</div><div>from sklearn.preprocessing import StandardScaler as SS</div><div>from sklearn.linear_model
      import LogisticRegression as LR</div><div>from sklearn.ensemble import HistGradientBoostingClassifier as HGB</div><div>from
      sklearn.metrics import average_precision_score as ap, brier_score_loss as br</div><div>X, y = make_classification(1000,
      weights=[0.96, 0.04], n_informative=6, random_state=42)</div><div>X_tr, X_te, y_tr, y_te = X[:750], X[750:], y[:750],
      y[750:]</div><div>lr = Pipeline([('s', SS()), ('c', LR(class_weight='balanced', random_state=42))]).fit(X_tr, y_tr)</div><div>gb
      = HGB(max_iter=50, learning_rate=0.1, random_state=42).fit(X_tr, y_tr)</div><div>p_lr, p_gb = lr.predict_proba(X_te)[:,
      1], gb.predict_proba(X_te)[:, 1]</div><div>print(f'lr_pr={ap(y_te,p_lr):.3f} gb_pr={ap(y_te,p_gb):.3f}')</div><div>print(f'gb_brier={br(y_te,p_gb):.3f}
      gb_beats_lr={int(ap(y_te,p_gb) &gt; ap(y_te,p_lr))}')</div></div>
    say: Đoạn mã chạy trọn vẹn tình huống một nghìn giao dịch lệch bốn phần trăm gian lận theo đúng thứ tự thời gian. Ta đối
      chiếu trực tiếp chuỗi hồi quy cân bằng lớp với bộ tăng cường độ dốc năm mươi vòng trên cùng tập kiểm tra theo thời gian.
      Từng dòng mã chạy xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Đối đầu trực
      tiếp trên một nghìn giao dịch bốn phần trăm gian lận phơi bày ưu thế mô hình cây trước đường thẳng đơn giản.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>lr_pr=0.211 gb_pr=0.322</div><div>gb_brier=0.042
      gb_beats_lr=1</div></div>
    say: Đầu ra chạy thật chứng minh bộ tăng cường độ dốc đạt diện tích đường cong chuẩn xác phủ vượt trội so với hồi quy
      tuyến tính lẫn đường nền ngẫu nhiên. Và giữ điểm số Brier cực thấp ngay trên CPU. Giá trị đầu ra thu được khớp chặt
      với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết. Không những tách lớp tốt hơn ở diện tích chuẩn xác
      phủ, mô hình tăng cường còn giữ xác suất dự báo sát sự thật hơn hẳn.
    focus:
