- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Dùng <code>train_test_split(shuffle=True)</code> cắt ngẫu nhiên giao dịch theo thời gian làm lộ tương lai.<br><b>Lỗi
      2 (-20đ):</b> Báo cáo độ chính xác 96% làm tiêu chuẩn nghiệm thu trên tập chỉ có 4% gian lận.<br><b>Lỗi 3
      (-10đ):</b> Không cố định hạt giống ngẫu nhiên khiến kết quả chấm tự động lệch qua từng lần chạy.</div></td></tr></table>
    say: Trước khi bắt tay hoàn thành bài thực hành cuối khoá, bạn rà kỹ ba sai lầm chí tử sau đây. Một là xáo trộn
      ngẫu nhiên làm rò rỉ thời gian. Hai là lấy độ chính xác tổng thể chín mươi sáu phần trăm làm tiêu chí, và
      ba là quên đặt hạt giống cố định. Bạn hãy rà soát từng lỗi trên trước khi chuyển sang phần tự làm bài tập
      thực hành trên máy.
