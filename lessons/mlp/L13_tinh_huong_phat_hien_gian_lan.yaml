    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>test_pos=12 zero_baseline_pr=0.048</div></div>
    say: Kết quả khẳng định đường nền chỉ loanh quanh tỉ lệ dương tự nhiên khoảng bốn phần trăm. Vì không có thông tin phân
      biệt nào để xếp hạng gian lận lên đầu. Kết quả kiểm chứng khẳng định quy luật toán học không đổi khi kiểm thử độc lập.
      Chỉ số không phẩy không bốn tám nhắc ta rằng không có bất kỳ hệ thống gian lận nào có thể biện minh bằng độ đúng tổng
      thể.
