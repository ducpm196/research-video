- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - round(12 / 250, 3) == 0.048
  - 0.322 > 0.048
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.metrics import average_precision_score</div><div>_, y = make_classification(n_samples=1000, weights=[0.96, 0.04],
      n_informative=6, random_state=42)</div><div>y_te = y[750:]</div><div>base_pr = average_precision_score(y_te, [0.0] *
      len(y_te))</div><div>print(f'test_pos={int(y_te.sum())} zero_baseline_pr={base_pr:.3f}')</div></div>
    say: Ở phép kiểm chứng đối chứng cuối cùng, ta tính điểm đường nền khi một mô hình ngây thơ trả về toàn số không trên
      đúng hai trăm năm mươi giao dịch kiểm tra cuối. Xây dựng đường cơ sở dự đoán toàn không tạo cột mốc tối thiểu giúp chứng
      minh mô hình tăng cường độ dốc thực sự tạo ra giá trị dự báo vượt xa phỏng đoán ngẫu nhiên.
    focus:
    - 1
