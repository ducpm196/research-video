- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 2 * 3.0 == 6.0
  - 2 * 3.0 + 2 * 3.0 == 12.0
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import torch</div><div>x = torch.tensor(3.0, requires_grad=True)</div><div>(x
      ** 2).backward(); g1 = x.grad.item()</div><div>(x ** 2).backward(); g2_acc = x.grad.item()</div><div>x.grad.zero_();
      (x ** 2).backward(); g_reset = x.grad.item()</div><div>print(f'g1={g1:.1f} g2_accumulated={g2_acc:.1f} g_after_zero={g_reset:.1f}')</div></div>
    say: Phép kiểm chứng thứ hai chạy trực tiếp hàm ích bình phương tại ích bằng ba để đo tận mắt hành vi cộng dồn đạo hàm.
      Lần đầu gọi truyền ngược, sau đó gọi tiếp lần hai không xóa, rồi mới xóa và gọi lại lần ba. Việc đối chứng hai cách
      xử lý song song rất cần thiết vì bằng chứng thực nghiệm giúp loại bỏ hoàn toàn phỏng đoán cảm tính. Chạy thử hàm bình
      phương tại điểm ba một lần nữa sau khi đặt lại bộ đệm xác nhận giá trị đạo hàm trở lại đúng sáu.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>g1=6.0 g2_accumulated=12.0 g_after_zero=6.0</div></div>
    say: Đầu ra ghi nhận đúng ba con số sáu, mười hai rồi quay lại sáu. Vì thiếu bước xóa thì autograd cộng dồn đạo hàm mới
      vào bộ nhớ đệm đang giữ sẵn. Kết quả kiểm chứng khẳng định quy luật toán học không đổi khi kiểm thử độc lập. Chuỗi số
      sáu, mười hai rồi quay về sáu khẳng định rõ ràng quy luật tích lũy và đặt lại bộ nhớ đệm của bộ vi phân.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
