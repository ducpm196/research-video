  - 2 * 3.0 + 2 * 3.0 == 12.0
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Mô hình 1 lớp tuyến
      tính CPU</td><td>120 vòng hết ~15 ms</td><td>Khớp tức thì không cần GPU</td></tr><tr><td>Huấn luyện batch lớn 4 096
      mẫu</td><td>Cộng dồn grad 4 micro-batch rồi mới step()</td><td>Đây chính là lý do PyTorch thiết kế cộng dồn grad mặc
      định!</td></tr><tr><td>Quên zero_grad()</td><td>Đạo hàm cộng dồn làm bước cập nhật phình lớn dễ thành NaN</td><td>Mất
      mát nhanh chóng thành NaN</td></tr></table>
    say: 'Bảng quy mô giải thích nghịch lý thiết kế rất hay của thư viện: cơ chế mặc định cộng dồn không phải lỗi. Mà giúp
      gom nhiều lô nhỏ khi thiếu bộ nhớ trước khi bước cập nhật. Khi mọi thao tác cập nhật trọng số đều theo đúng chu trình
      xoá, lan truyền xuôi, tính mất mát, lan truyền ngược và bước tối ưu, mã chạy đồng nhất trên mọi thiết bị. Tuân thủ đúng
      giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt
      gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch vụ không tụt hiệu năng hay sập bộ nhớ. Khi mô
      hình lớn tràn bộ nhớ, kỹ sư cố ý chia lô nhỏ thành bốn bước truyền ngược liên tiếp rồi mới gọi lệnh cập nhật một lần.
      Hiểu tường tận đồ thị tính toán giúp bạn tự gỡ mọi lỗi kích thước hay lỗi tràn đạo hàm trong quá trình huấn luyện.'
