scenes:
- id: hook
  kind: hook
  title: 'Vòng huấn luyện PyTorch CPU: Tensor, Autograd & tối ưu SGD'
  checks:
  - 3.0 * 2.0 + 2.0 == 8.0
  - 2.0 + 2.0 == 4.0
  steps:
  - show: '<div class=''box key''><p>Định nghĩa <b>autograd</b>: cơ chế tự động ghi đồ thị phép tính trên <code>Tensor</code>
      để tính đạo hàm ngược khi gọi <code>loss.backward()</code>. Luôn gọi <code>opt.zero_grad()</code> đầu vòng
      lặp vì PyTorch mặc định <b>cộng dồn</b> gradient.</p></div>'
    say: Một lỗi kinh điển làm rất nhiều người mới học PyTorch thấy tham số bùng nổ tới vô cực chỉ sau mười vòng
      lặp là quên một dòng xóa đạo hàm. Vì thư viện cố ý cộng dồn đạo hàm qua các lần gọi truyền ngược để phục vụ
      ghép lô lớn. Hôm nay ta tự tay kiểm chứng hai lần truyền ngược liên tiếp và huấn luyện khớp đường thẳng ba
      ích cộng hai.
    clear: true
    introduces:
    - mlp_autograd
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Lan truyền ngược trên
      đồ thị (CS115:L22)</td><td>Quy tắc chuỗi tính đạo hàm từ hàm mất mát ngược về tham số</td></tr><tr><td>Chuyển
      sang PyTorch CPU</td><td>Thay vì viết tay từng đạo hàm, đồ thị động tự ghi lại mọi phép toán</td></tr><tr><td>Chu
      kỳ 5 lệnh của vòng huấn luyện</td><td>Xóa gradient → suy luận → tính loss → lan truyền ngược → bước cập nhật</td></tr></table>
    say: Hai bài mười và mười một đưa bạn từ thư viện bảng sang mạng nơ-ron bằng PyTorch chạy thuần CPU. Thay vì
      giải tay đạo hàm phức tạp như trước, bộ vi phân tự động autograd tự dựng đồ thị phép tính và tính ngược mọi
      đạo hàm giúp bạn. Mọi mô hình học sâu đều vận hành theo đúng một vòng lặp năm dòng chuẩn này. Đây là nền tảng
      trực tiếp để thiết kế đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>torch.tensor(...,
      requires_grad=True)</code></td><td>Tạo Tensor theo dõi mọi phép tính để tính đạo hàm</td></tr><tr><td><code>opt
      = torch.optim.SGD(..., lr=0.1)</code></td><td>Bộ tối ưu hạ độ dốc ngẫu nhiên với tốc độ học 0.1</td></tr><tr><td><code>opt.zero_grad()
      / loss.backward() / opt.step()</code></td><td>Bộ ba xóa cũ → lan truyền ngược → bước cập nhật tham số</td></tr></table>
    say: Bảng ký hiệu liệt kê đúng ba phần cốt lõi trong mã nguồn PyTorch CPU. Cờ theo dõi đạo hàm bật cho các tham
      số cần học, còn bộ tối ưu giữ nhiệm vụ trừ đạo hàm nhân bước học khỏi trọng số. Bộ ba lệnh xóa cũ, truyền
      ngược và cập nhật luôn đứng đúng thứ tự đó.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Cơ chế vận hành trực quan
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">1. zero_grad()</text><text x="165.0" y="102" font-size="15" text-anchor="middle"
      fill="#475569">Xóa đạo hàm vòng cũ</text><line x1="290" y1="80" x2="350" y2="80" stroke="#475569" stroke-width="2"/><polygon
      points="350,80 342.0,85.0 342.0,75.0" fill="#475569"/><text x="320" y="72" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">bước 1</text><rect x="350" y="35" width="250" height="90" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="475.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">2. loss = MSE(pred, y)</text><text x="475.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Tính
      xuôi &amp; mất mát</text><line x1="600" y1="80" x2="660" y2="80" stroke="#475569" stroke-width="2"/><polygon
      points="660,80 652.0,85.0 652.0,75.0" fill="#475569"/><text x="630" y="72" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">bước 2</text><rect x="660" y="35" width="260" height="90" rx="10" fill="#fef3c7"
      stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">3. backward() + step()</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Tính
      ngược &amp; cập nhật w, b</text></svg></div>
    say: Hình trên vẽ chu kỳ ba chặng bất biến của bất kỳ vòng huấn luyện PyTorch nào. Chặng một bắt buộc xóa sạch
      đạo hàm cũ về không. Chặng hai tính xuôi dự đoán và mất mát, rồi chặng ba truyền ngược để bộ tối ưu dịch chuyển
      trọng số.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 3.0 * 2.0 + 2.0 == 8.0
  - 2.0 + 2.0 == 4.0
  steps:
  - show: <div class='box key'><p><b>1. Nếu quên <code>zero_grad()</code>:</b> sau 2 lần gọi <code>backward()</code>
      trên <code>y = x^2</code> tại <code>x=3</code>, <code>x.grad</code> thành <code>6 + 6 = <b>12</b></code> thay
      vì <code>6</code>.</p><p><b>2. Cập nhật SGD:</b> <code>w_new = w - lr * dL/dw</code>.</p></div>
    say: Ví dụ toán học cực gọn chứng minh bản chất cộng dồn của đạo hàm trong bộ nhớ tensor. Đạo hàm của bình phương
      tại x bằng ba đúng ra chỉ là sáu. Nếu gọi truyền ngược hai lần liên tiếp mà không xóa giữa chừng, giá trị
      trong thuộc tính đạo hàm bị cộng thành mười hai. Vì vậy công thức định lượng giúp kiểm soát sai số và biến
      đổi mô hình minh bạch hơn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 3.0 * 2.0 + 2.0 == 8.0
  - 2.0 + 2.0 == 4.0
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import torch</div><div>torch.manual_seed(42)</div><div>x
      = torch.linspace(-1, 1, 20).unsqueeze(1)</div><div>y = 3.0 * x + 2.0</div><div>layer = torch.nn.Linear(1,
      1)</div><div>opt = torch.optim.SGD(layer.parameters(), lr=0.2)</div><div>for _ in range(120):</div><div>    opt.zero_grad()</div><div>    loss
      = ((layer(x) - y) ** 2).mean()</div><div>    loss.backward()</div><div>    opt.step()</div><div>print(f'w={layer.weight.item():.3f}
      b={layer.bias.item():.3f} loss={loss.item():.6f}')</div></div>
    say: Đoạn mã huấn luyện lớp tuyến tính một đầu vào một đầu ra trên hai mươi điểm thuộc đường thẳng ba ích cộng
      hai. Chỉ với một trăm hai mươi vòng hạ độ dốc trên CPU và hạt giống bốn hai, mọi trọng số hội tụ hoàn toàn.
      Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>w=3.000 b=2.000 loss=0.000000</div></div>
    say: Kết quả chạy thật chứng minh trọng số tiến sát ba phẩy không không, độ chệch tiến sát hai phẩy không không
      và sai số mất mát tiến về không. Toàn bộ quá trình diễn ra nhanh tức thì trên CPU thuần. Đầu ra hợp lý vì
      tham số và hàm mất mát vận hành đúng bất biến vừa nêu.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 3.0 * 2.0 + 2.0 == 8.0
  - 2.0 + 2.0 == 4.0
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import torch</div><div>x = torch.tensor(3.0,
      requires_grad=True)</div><div>(x ** 2).backward(); g1 = x.grad.item()</div><div>(x ** 2).backward(); g2_acc
      = x.grad.item()</div><div>x.grad.zero_(); (x ** 2).backward(); g_reset = x.grad.item()</div><div>print(f'g1={g1:.1f}
      g2_accumulated={g2_acc:.1f} g_after_zero={g_reset:.1f}')</div></div>
    say: Phép kiểm chứng thứ hai chạy trực tiếp hàm ích bình phương tại ích bằng ba để đo tận mắt hành vi cộng dồn
      đạo hàm. Lần đầu gọi truyền ngược, sau đó gọi tiếp lần hai không xóa, rồi mới xóa và gọi lại lần ba. Phép
      kiểm chứng này rất quan trọng vì đối chiếu độc lập giúp phát hiện ngay sai lệch.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>g1=6.0 g2_accumulated=12.0 g_after_zero=6.0</div></div>
    say: Đầu ra ghi nhận đúng ba con số sáu, mười hai rồi quay lại sáu. Vì thiếu bước xóa thì autograd cộng dồn
      đạo hàm mới vào bộ nhớ đệm đang giữ sẵn.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - 3.0 * 2.0 + 2.0 == 8.0
  - 2.0 + 2.0 == 4.0
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Mô hình
      1 lớp tuyến tính CPU</td><td>120 vòng hết ~15 ms</td><td>Khớp tức thì không cần GPU</td></tr><tr><td>Huấn
      luyện batch lớn 4 096 mẫu</td><td>Cộng dồn grad 4 micro-batch rồi mới step()</td><td>Đây chính là lý do PyTorch
      thiết kế cộng dồn grad mặc định!</td></tr><tr><td>Quên zero_grad()</td><td>Bước cập nhật phình theo cấp số
      cộng</td><td>Mất mát nhanh chóng thành NaN</td></tr></table>
    say: 'Bảng quy mô giải thích nghịch lý thiết kế rất hay của thư viện: cơ chế mặc định cộng dồn không phải lỗi.
      Mà giúp gom nhiều lô nhỏ khi thiếu bộ nhớ trước khi bước cập nhật.'
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Quên <code>optimizer.zero_grad()</code> trong vòng huấn luyện làm gradient cộng dồn và bùng nổ.<br><b>Lỗi
      2 (-20đ):</b> Dùng số nguyên <code>torch.tensor([1, 2])</code> thay vì số thực <code>float32</code> làm autograd
      từ chối theo dõi.<br><b>Lỗi 3 (-10đ):</b> Quên <code>unsqueeze(1)</code> khiến đầu vào 1D <code>(20,)</code>
      sai chiều cho tầng <code>Linear(1, 1)</code>.</div></td></tr></table>
    say: Bạn tránh kỹ ba lỗi lập trình PyTorch đầu tay sau đây. Một là quên xóa đạo hàm đầu vòng, hai là truyền
      nhầm tensor số nguyên vào lớp tính đạo hàm chỉ nhận số thực. Và ba là thiếu một chiều cột khi truyền vào tầng
      tuyến tính. Bạn hãy rà soát từng lỗi trên trước khi chuyển sang phần tự làm bài tập thực hành trên máy.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
