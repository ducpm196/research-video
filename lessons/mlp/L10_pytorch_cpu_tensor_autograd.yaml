- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 2 * 3.0 == 6.0
  - 3.0 * 1.0 + 2.0 == 5.0
  steps:
  - show: <ol><li>Tại <code>x = 3</code>, nếu gọi <code>(x**2).backward()</code> hai lần liên tiếp KHÔNG xóa, <code>x.grad</code>
      bằng mấy?</li><li>Trong 3 lệnh <code>zero_grad / backward / step</code>, lệnh nào bắt buộc đứng đầu hoặc xóa trước vòng
      mới?</li></ol>
    say: Hãy tự kiểm tra qua hai câu hỏi chốt bài mười ngay dưới đây. Câu một, tại ích bằng ba nếu truyền ngược ích bình phương
      hai lần liên tiếp không xóa thì đạo hàm bằng mấy? Câu hai, trong ba lệnh xóa, truyền ngược và cập nhật, lệnh nào xóa
      bộ nhớ đệm đạo hàm cũ? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code>6 + 6 = <b>12.0</b></code> do PyTorch cộng
      dồn gradient.</p></td></tr></table>
    say: 'Đáp án câu một: bằng mười hai vì đạo hàm đúng sáu bị cộng dồn hai lần liên tiếp. Luôn đặt lệnh xoá sạch bộ đệm ngay
      trước bước truyền ngược hoặc đầu vòng lặp huấn luyện ở cấu trúc một lô tiêu chuẩn.'
    clear: true
    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code><b>zero_grad()</b></code> xóa sạch đạo hàm cũ
      về 0 trước khi gọi <code>backward()</code> tính đạo hàm vòng mới.</p></td></tr></table>
    say: 'Đáp án câu hai: lệnh xóa đạo hàm về không sẽ xóa sạch bộ đệm cũ trước khi tính vòng mới. Hành vi dọn sạch đạo hàm
      cũ giữ cho mỗi bước cập nhật chỉ phản ánh đúng độ dốc của lô dữ liệu hiện tại.'
    clear: true
    focus: null
- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L10
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L10</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Cài
      vòng huấn luyện hồi quy tuyến tính y = 3x + 2 bằng PyTorch CPU khớp tham số</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>x0=3.0
      seed=42 w_true=3.0 b_true=2.0 lr=0.2 steps=120</code></td></tr><tr><td><b>Chấm bài (.venv-ml)</b></td><td><code>bash
      labs/cham.sh MLP L10 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 10 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Thực nghiệm tính chất cộng dồn đạo hàm rồi chạy vòng lặp huấn luyện lớp tuyến tính theo đúng hệ số từ luồng
      chuẩn.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: '<table class=''t''><tr><th>Gợi ý triển khai MLP:L10</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước
      1 (Autograd)</b></td><td>Gọi <code>(x0 ** 2).backward()</code> hai lần lấy <code>grad_accum</code> rồi <code>x0.grad.zero_()</code>
      và tính lại</td></tr><tr><td><b>Bước 2 (Linear + SGD)</b></td><td>Tạo <code>x = torch.linspace(-1, 1, 20).unsqueeze(1)</code>
      và <code>y = w_true * x + b_true</code></td></tr><tr><td><b>Bước 3 (tối ưu)</b></td><td>Chạy vòng lặp <code>steps</code>
      bước chuẩn: <code>zero_grad -&gt; loss -&gt; backward -&gt; step</code> rồi in trọng số</td></tr></table>'
    say: Từ tham số luồng chuẩn, bạn thử gọi lan truyền ngược hai lần trước và sau khi xoá đạo hàm tích lũy trên một biến
      đơn vô hướng. Sau đó bạn đặt lại hạt giống thủ công rồi chạy vòng lặp huấn luyện bộ suy diễn tuyến tính đúng số bước
      truyền vào. Kiểm chứng trực tiếp ba con số đạo hàm tích lũy, sau xoá và sai số hội tụ của mô hình tuyến tính trên môi
      trường CPU.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>grad_accum=12.0</div><div>grad_reset=6.0</div><div>fitted_wb=3.00_2.00</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Tensor float32 + requires_grad</span><span class="a">→</span><span class="n">zero_grad
      tránh cộng dồn</span><span class="a">→</span><span class="n">backward + step hội tụ</span></div>
    say: Mọi vòng lặp tối ưu trong PyTorch đều dựa trên chu trình xoá đạo hàm tích lũy, tính mất mát, lan truyền ngược và
      cập nhật tham số. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng sau từng
      dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm tái lập
      chính xác trên nhiều máy. Nắm chắc vòng lặp bốn bước gồm xoá đệm, tính xuôi, truyền ngược và cập nhật giúp bạn làm chủ
      mọi kiến trúc mạng nơ-ron. Khi đã hiểu cơ chế vi phân tự động từng tham số, việc xếp nhiều tầng tuyến tính thành mạng
      sâu trở nên vô cùng sáng rõ. Một vòng lặp tối ưu chuẩn mực mở đường cho việc xây dựng bất kỳ kiến trúc mạng sâu nào
      bằng thư viện linh hoạt.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L10:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 10 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Ở
      phần thực hành kế tiếp ta lắp ghép nhiều tầng tuyến tính kèm hàm kích hoạt phi tuyến để giải quyết bài toán phi tuyến
      thực thụ.
    clear: true
    focus: null
