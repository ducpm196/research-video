- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>torch.tensor(..., requires_grad=True)</code></td><td>Tạo
      Tensor theo dõi mọi phép tính để tính đạo hàm</td></tr><tr><td><code>opt = torch.optim.SGD(..., lr=0.1)</code></td><td>Bộ
      tối ưu hạ độ dốc ngẫu nhiên với tốc độ học 0.1</td></tr><tr><td><code>opt.zero_grad() / loss.backward() / opt.step()</code></td><td>Bộ
      ba xóa cũ → lan truyền ngược → bước cập nhật tham số</td></tr><tr><td><code>nn.Linear(1, 1)</code> &amp; <code>.unsqueeze(1)</code></td><td>Tầng
      tuyến tính 1 chiều và thêm chiều cột thành ma trận N x 1</td></tr></table>
    say: Bảng ký hiệu liệt kê đúng ba phần cốt lõi trong mã nguồn PyTorch CPU. Cờ theo dõi đạo hàm bật cho các tham số cần
      học, còn bộ tối ưu giữ nhiệm vụ trừ đạo hàm nhân bước học khỏi trọng số. Bộ ba lệnh xóa cũ, truyền ngược và cập nhật
      luôn đứng đúng thứ tự đó. Bộ tối ưu cập nhật tham số bằng cách trừ đi đạo hàm nhân tốc độ học sau khi toàn bộ đồ thị
      đã hoàn tất truyền ngược. Ngoài ra tầng tuyến tính nhận đầu vào dạng cột hai chiều nên ta thêm một trục cột trước khi
      đưa vào.
