scenes:
- id: hook
  kind: hook
  title: 'Vòng huấn luyện PyTorch CPU: Tensor, Autograd & tối ưu SGD'
  checks:
  - 2 * 3.0 == 6.0
  - 2 * 3.0 + 2 * 3.0 == 12.0
  steps:
  - show: '<div class=''box key''><p>Định nghĩa <b>autograd</b>: cơ chế tự động ghi đồ thị phép tính trên <code>Tensor</code>
      để tính đạo hàm ngược khi gọi <code>loss.backward()</code>. Luôn gọi <code>opt.zero_grad()</code> đầu vòng lặp vì PyTorch
      mặc định <b>cộng dồn</b> gradient.</p></div>'
    say: Một lỗi kinh điển làm rất nhiều người mới học PyTorch thấy tham số bùng nổ tới vô cực chỉ sau mười vòng lặp là quên
      một dòng xóa đạo hàm. Vì thư viện cố ý cộng dồn đạo hàm qua các lần gọi truyền ngược để phục vụ ghép lô lớn. Hôm nay
      ta tự tay kiểm chứng hai lần truyền ngược liên tiếp và huấn luyện khớp đường thẳng ba ích cộng hai. Một dòng xoá đạo
      hàm đặt đúng đầu vòng lặp cứu mô hình khỏi tình trạng bước nhảy phình to không kiểm soát.
    clear: true
    introduces:
    - mlp_autograd
    focus: null
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Lan truyền ngược trên đồ thị (CS115:L22)</td><td>Quy
      tắc chuỗi tính đạo hàm từ hàm mất mát ngược về tham số</td></tr><tr><td>Chuyển sang PyTorch CPU</td><td>Thay vì viết
      tay từng đạo hàm, đồ thị động tự ghi lại mọi phép toán</td></tr><tr><td>Chu kỳ 5 lệnh của vòng huấn luyện</td><td>Xóa
      gradient → suy luận → tính loss → lan truyền ngược → bước cập nhật</td></tr></table>
    say: Bài học này mở đầu phần mạng nơ-ron bằng PyTorch chạy thuần CPU. Thay vì giải tay đạo hàm phức tạp như trước, bộ
      vi phân tự động autograd tự dựng đồ thị phép tính và tính ngược mọi đạo hàm giúp bạn. Mọi mô hình học sâu đều vận hành
      theo đúng một vòng lặp năm dòng chuẩn này. Hiểu thấu cơ chế tích lũy đạo hàm tự động trong bộ khung mạng nơ-ron giúp
      bạn tránh lỗi phân kỳ trọng số thầm lặng khi tự viết vòng lặp tối ưu. Quy trình này liên kết chặt chẽ từ khâu chuẩn
      bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán và giới hạn phần cứng
      CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Bộ vi phân tự động theo dõi từng phép toán cộng nhân
      mũ trên dữ liệu để truyền ngược độ dốc chính xác tuyệt đối.
