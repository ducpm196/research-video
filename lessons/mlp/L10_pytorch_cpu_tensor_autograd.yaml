- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Quên <code>optimizer.zero_grad()</code>
      trong vòng huấn luyện làm gradient cộng dồn và bùng nổ.<br><b>Lỗi 2:</b> Dùng số nguyên <code>torch.tensor([1, 2])</code>
      thay vì số thực <code>float32</code> làm autograd từ chối theo dõi.<br><b>Lỗi 3:</b> Quên <code>unsqueeze(1)</code>
      khiến đầu vào 1D <code>(20,)</code> sai chiều cho tầng <code>Linear(1, 1)</code>.</div></td></tr></table>
    say: Bạn tránh kỹ ba lỗi lập trình PyTorch đầu tay sau đây. Một là quên xóa đạo hàm đầu vòng, hai là truyền nhầm tensor
      số nguyên vào lớp tính đạo hàm chỉ nhận số thực. Và ba là thiếu một chiều cột khi truyền vào tầng tuyến tính. Phát hiện
      sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ lỗi về sau. Hãy kiểm lại
      định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu mới. Dùng sai kiểu dữ
      liệu số nguyên cho biến theo dõi đạo hàm làm thư viện ngắt lỗi ngay vì đạo hàm đòi hỏi số thực dấu phẩy động. Quên bọc
      ngữ cảnh tắt theo dõi đồ thị khi kiểm thử gây tốn bộ nhớ đệm không cần thiết cho ứng dụng suy luận CPU. Chú ý đưa trọng
      số và dữ liệu cùng về kiểu số thực ba mươi hai bít thống nhất trước khi đưa vào tính toán.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
