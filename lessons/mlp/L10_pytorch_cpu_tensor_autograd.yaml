  - 2.0 + 2.0 == 4.0
  steps:
  - show: <ol><li>Tại <code>x = 3</code>, nếu gọi <code>(x**2).backward()</code> hai lần liên tiếp KHÔNG xóa, <code>x.grad</code>
      bằng mấy?</li><li>Trong 3 lệnh <code>zero_grad / backward / step</code>, lệnh nào bắt buộc đứng đầu hoặc xóa
      trước vòng mới?</li></ol>
    say: Hãy tự kiểm tra qua hai câu hỏi chốt bài mười ngay dưới đây. Câu một, tại ích bằng ba nếu truyền ngược
      ích bình phương hai lần liên tiếp không xóa thì đạo hàm bằng mấy? Câu hai, trong ba lệnh xóa, truyền ngược
      và cập nhật, lệnh nào xóa bộ nhớ đệm đạo hàm cũ? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code>6 + 6 = <b>12.0</b></code> do PyTorch
      cộng dồn gradient.</p></td></tr></table>
    say: 'Đáp án câu một: bằng mười hai vì đạo hàm đúng sáu bị cộng dồn hai lần liên tiếp.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code><b>zero_grad()</b></code> xóa sạch đạo
      hàm cũ về 0 trước khi gọi <code>backward()</code> tính đạo hàm vòng mới.</p></td></tr></table>
    say: 'Đáp án câu hai: lệnh xóa đạo hàm về không sẽ xóa sạch bộ đệm cũ trước khi tính vòng mới.'
    clear: true
