- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 2 * 3.0 == 6.0
  - 2 * 3.0 + 2 * 3.0 == 12.0
  steps:
  - show: <div class='box key'><p><b>1. Nếu quên <code>zero_grad()</code>:</b> sau 2 lần gọi <code>backward()</code> trên
      <code>y = x^2</code> tại <code>x=3</code>, <code>x.grad</code> thành <code>6 + 6 = <b>12</b></code> thay vì <code>6</code>.</p><p><b>2.
      Cập nhật SGD:</b> <code>w_new = w - lr * dL/dw</code>.</p></div>
    say: Ví dụ toán học cực gọn chứng minh bản chất cộng dồn của đạo hàm trong bộ nhớ tensor. Đạo hàm của bình phương tại
      x bằng ba đúng ra chỉ là sáu. Nếu gọi truyền ngược hai lần liên tiếp mà không xóa giữa chừng, giá trị trong thuộc tính
      đạo hàm bị cộng thành mười hai. Việc tách định nghĩa tham số trên tập huấn luyện rất quan trọng vì nó quyết định độ
      trung thực của thước đo tổng quát. Mọi công thức chuyển đổi trước khi đóng gói ra sản phẩm đều phải giữ đúng giả định
      toán học ban đầu để không gây sai số tích lũy. Nếu bỏ qua lệnh đưa bộ đệm về không, giá trị đạo hàm mới tự động cộng
      dồn lên tổng tích lũy của các lần gọi trước. Cơ chế mặc định cộng dồn được thiết kế có chủ đích nhằm phục vụ kỹ thuật
      tích lũy lô nhỏ trên phần cứng ít bộ nhớ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 3.0 * (-1.0) + 2.0 == -1.0
  - 3.0 * 1.0 + 2.0 == 5.0
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>import torch</div><div>torch.manual_seed(42)</div><div>x
      = torch.linspace(-1, 1, 20).unsqueeze(1)</div><div>y = 3.0 * x + 2.0</div><div>layer = torch.nn.Linear(1, 1)</div><div>opt
      = torch.optim.SGD(layer.parameters(), lr=0.2)</div><div>for _ in range(120):</div><div>    opt.zero_grad()</div><div>    loss
      = ((layer(x) - y) ** 2).mean()</div><div>    loss.backward()</div><div>    opt.step()</div><div>print(f'w={layer.weight.item():.3f}
      b={layer.bias.item():.3f} loss={loss.item():.6f}')</div></div>
    say: Đoạn mã huấn luyện lớp tuyến tính một đầu vào một đầu ra trên hai mươi điểm thuộc đường thẳng ba ích cộng hai. Chỉ
      với một trăm hai mươi vòng hạ độ dốc trên CPU và hạt giống bốn hai, mọi trọng số hội tụ hoàn toàn. Từng dòng mã chạy
      xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Chỉ một lớp tuyến tính đơn
      giản chạy vòng lặp tối ưu chuẩn mực đã tự khớp chính xác hàm ba x cộng hai trên CPU.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>w=3.000 b=2.000 loss=0.000000</div></div>
    say: Kết quả chạy thật chứng minh trọng số tiến sát ba phẩy không không, độ chệch tiến sát hai phẩy không không và sai
      số mất mát tiến về không. Toàn bộ quá trình diễn ra nhanh tức thì trên CPU thuần. Giá trị đầu ra thu được khớp chặt
      với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết. Độ chệch hội tụ đúng hai phẩy không và hệ số góc
      tiến sát ba phẩy không chứng minh chu trình truyền ngược hoạt động hoàn hảo.
