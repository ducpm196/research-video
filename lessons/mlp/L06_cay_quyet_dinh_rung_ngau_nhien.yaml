    say: Từ mô hình tuyến tính, bài sáu mở sang họ mô hình cây quyết định vốn là xương sống cho dữ liệu bảng. Khác với hồi
      quy, một cây quyết định đơn lẻ học thuộc lòng dữ liệu rất nhanh nếu không bị chặn độ sâu. Giải pháp chuẩn là giới hạn
      độ sâu kết hợp trồng cả khu rừng ngẫu nhiên nhiều cây lấy phiếu chung. Kết hợp nhiều cây quyết định độc lập theo cơ
      chế bỏ phiếu đa số giúp giữ tính phi tuyến mạnh mẽ của cây mà giảm hẳn độ nhạy với nhiễu ngẫu nhiên. Quy trình này liên
      kết chặt chẽ từ khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật
      toán và giới hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Khả năng cắt không gian
      theo từng ngưỡng chữ nhật giúp họ cây nắm bắt ranh giới phi tuyến mà không cần chuẩn hoá cột số.
