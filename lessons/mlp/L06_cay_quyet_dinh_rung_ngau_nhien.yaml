- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - round(400 * 0.3) == 120
  - 0.862 > 0.807
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Bảng vừa < 100
      000 dòng</td><td>RandomForest 50-100 cây CPU < 1 s</td><td>Ổn định, không cần chuẩn hóa thang đo</td></tr><tr><td>Cột
      có 10 000 mã ID duy nhất</td><td>Gini ưu tiên chọn nhầm cột ID chia vụn</td><td>Bắt buộc loại bỏ cột ID trước khi trồng
      rừng</td></tr><tr><td>Phân biệt rõ ranh giới mượt</td><td>Cây chia bậc thang vuông góc kém mượt</td><td>Kết hợp thử
      thêm Boosting hoặc hồi quy</td></tr></table>
    say: Bảng quy mô cảnh báo bẫy đặc trưng mã định danh khi dùng cây quyết định. Chỉ số giảm bất thuần khiết rất thích các
      cột có nhiều giá trị rời rạc khác nhau như mã đơn hàng hay số điện thoại. Nên phải lọc bỏ mọi cột định danh trước khi
      huấn luyện. Kiểm tra tầm quan trọng đặc trưng sau khi huấn luyện là thói quen cần thiết để phát hiện sớm cột dữ liệu
      rò rỉ ngầm chiếm trọng số áp đảo. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy vận hành tin
      cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này giữ cho dịch
      vụ không tụt hiệu năng hay sập bộ nhớ. Với bảng trăm nghìn dòng, cần loại bỏ cột mã định danh duy nhất trước để cây
      không tạo ra vô số nhánh chẻ vô dụng. Thử nghiệm giới hạn độ sâu tối đa từ bốn tới mười giúp tìm điểm cân bằng tối ưu
      giữa độ chính xác và kích thước rừng cây.
