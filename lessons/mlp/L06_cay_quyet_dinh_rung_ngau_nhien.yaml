      as DT</div><div>from sklearn.ensemble import RandomForestClassifier as RF</div><div>X, y = make_classification(n_samples=400,
      n_features=12,</div><div>                           n_informative=4, random_state=42)</div><div>X_tr, X_te,
      y_tr, y_te = train_test_split(</div><div>    X, y, test_size=0.3, stratify=y, random_state=42)</div><div>dt
