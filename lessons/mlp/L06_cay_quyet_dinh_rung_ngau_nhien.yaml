    say: Mỗi nút trong cây tìm cách cắt làm sao cho tổng chỉ số bất thuần khiết của hai nhánh con giảm nhiều nhất
      có thể. Một nút toàn nhãn giống nhau có độ bất thuần khiết bằng không, còn trộn đều năm mươi năm mươi đạt
      cực đại không phẩy năm. Rừng ngẫu nhiên chỉ việc lấy trung bình xác suất của toàn bộ cây con để triệt tiêu
      dao động. Vì vậy công thức định lượng giúp kiểm soát sai số và biến đổi mô hình minh bạch hơn.
