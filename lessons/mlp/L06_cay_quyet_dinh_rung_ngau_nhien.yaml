  - 1 - 1.0**2 - 0.0**2 == 0.0
  steps:
  - show: '<div class=''box key''><p><b>1. Chỉ số Gini:</b> <code>G = 1 - sum(p_k^2)</code> (nút thuần nhất: <code>G
      = 0</code>; 2 lớp bằng nhau: <code>G = 0,5</code>).</p><p><b>2. Rừng ngẫu nhiên:</b> trung bình dự đoán của
