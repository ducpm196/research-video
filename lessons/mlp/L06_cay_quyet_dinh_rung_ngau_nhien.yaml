- id: hook
  kind: hook
  title: Cây quyết định & RandomForest kiểm soát độ sâu
  checks:
  - round(1 - 0.5**2 - 0.5**2, 1) == 0.5
  - round(1 - 1.0**2 - 0.0**2, 1) == 0.0
  steps:
  - show: <div class='box key'><p>Chỉ số bất thuần khiết <b>Gini</b> đạt <code>0.0</code> khi nút chứa 100% cùng 1 lớp và
      đạt cực đại <code>0.5</code> khi chia 50/50. Đặt <code>max_depth=4</code> và gộp <b>50 cây</b> giữ ranh giới tổng quát
      hóa tốt hơn.</p></div>
    say: Một cây quyết định không đặt ngưỡng độ sâu đạt điểm tuyệt đối một trăm phần trăm trên tập huấn luyện chỉ trong nháy
      mắt. Nhưng vừa đưa sang dữ liệu mới liền tụt điểm thê thảm. Hôm nay ta thực nghiệm trực tiếp hiện tượng học vẹt đó và
      kiểm chứng hiệu quả hạ nhiệt của rừng ngẫu nhiên trên CPU. Hiện tượng học vẹt hoàn hảo trên tập huấn luyện chính là
      nhược điểm cố hữu của một cây quyết định thả sâu tự do.
