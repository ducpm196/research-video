- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Để <code>max_depth=None</code>
      trên một cây đơn lẻ làm nhớ vẹt toàn bộ nhiễu Train.<br><b>Lỗi 2:</b> Đưa cột mã giao dịch ID vào huấn luyện vì độ quan
      trọng Gini thiên vị cột nhiều giá trị.<br><b>Lỗi 3:</b> Quên đặt <code>random_state=42</code> làm thứ tự rút mẫu ngẫu
      nhiên đổi kết quả mỗi lần chạy.</div></td></tr></table>
    say: Bạn tránh kỹ ba sai lầm phổ biến sau với mô hình cây và rừng ngẫu nhiên. Một là thả cây sâu tự do gây học vẹt tuyệt
      đối, hai là quên lọc cột mã định danh gây ảo giác quan trọng. Và ba là bỏ trống hạt giống ngẫu nhiên khiến kết quả không
      tái lập được. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ
      lỗi về sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu
      mới. Đừng vội tin tuyệt đối độ quan trọng đặc trưng dựa trên mức giảm bất thuần khiết khi bảng có nhiều cột rời rạc
      cỡ lớn. Kiểm tra độ chênh giữa điểm huấn luyện và điểm kiểm tra là cách nhanh nhất để phát hiện cây đã mọc quá sâu.
      Một cây đơn mọc tự do có phương sai quá lớn chỉ cần đổi vài mẫu huấn luyện đã cho ra cấu trúc rẽ nhánh khác hẳn.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - round(1 - 0.5**2 - 0.5**2, 1) == 0.5
  - 0.862 > 0.807
  steps:
  - show: <ol><li>Khi nút cây chứa 100% lớp 1 và 0% lớp 0, chỉ số Gini bằng mấy?</li><li>Vì sao Rừng ngẫu nhiên giảm được
      quá khớp so với một Cây đơn lẻ quá sâu?</li></ol>
    say: Mời bạn tự kiểm tra hai câu hỏi ngắn của bài sáu. Câu một, một nút thuần nhất chỉ chứa toàn nhãn một có chỉ số bất
      thuần khiết bằng mấy? Câu hai, vì sao rừng ngẫu nhiên giảm quá khớp so với một cây đơn lẻ? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code><b>0.0</b></code> (<code>1 - 1^2 - 0^2 =
      0</code>).</p></td></tr></table>
    say: 'Đáp án câu một: bằng không vì toàn bộ mẫu trong nút đều thuộc cùng một lớp. Nút hoàn toàn thuần nhất dừng chia nhánh
      ngay lập tức vì không còn cách chia nào làm giảm thêm bất thuần khiết.'
    clear: true
    focus: null
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Do lấy trung bình phiếu từ nhiều cây huấn luyện trên
      các tập con bootstrap và nhóm cột ngẫu nhiên, triệt tiêu nhiễu riêng của từng cây.</p></td></tr></table>
    say: 'Đáp án câu hai: nhờ lấy trung bình nhiều cây học trên các phần dữ liệu rút khác nhau nên sai số ngẫu nhiên tự triệt
      tiêu lẫn nhau. Sự đa dạng giữa các cây thành viên từ bước rút mẫu lặp lại là điều kiện tiên quyết giúp rừng cây đánh
      bại cây đơn.'
