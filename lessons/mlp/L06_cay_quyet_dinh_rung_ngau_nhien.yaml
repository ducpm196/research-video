- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round(1 - 0.5**2 - 0.5**2, 1) == 0.5
  - round(1 - 1.0**2 - 0.0**2, 1) == 0.0
  steps:
  - show: '<div class=''box key''><p><b>1. Chỉ số Gini:</b> <code>G = 1 - sum(p_k^2)</code> (nút thuần nhất: <code>G = 0</code>;
      2 lớp bằng nhau: <code>G = 0,5</code>).</p><p><b>2. Rừng ngẫu nhiên:</b> trung bình dự đoán của <code>B</code> cây huấn
      luyện trên mẫu bootstrap và tập con đặc trưng.</p></div>'
    say: Mỗi nút trong cây tìm cách cắt làm sao cho tổng chỉ số bất thuần khiết của hai nhánh con giảm nhiều nhất có thể.
      Một nút toàn nhãn giống nhau có độ bất thuần khiết bằng không, còn trộn đều năm mươi năm mươi đạt cực đại không phẩy
      năm. Rừng ngẫu nhiên lấy trung bình xác suất của toàn bộ cây con để triệt tiêu dao động giữa các lần chia. Mỗi bước
      rẽ nhánh tìm ngưỡng chia giúp mức giảm tổng chỉ số bất thuần khiết của hai tập con đạt cực đại có thể. Lấy trung bình
      xác suất qua nhiều cây độc lập thu hẹp mạnh phương sai dự báo mà giữ nguyên độ lệch thấp.
