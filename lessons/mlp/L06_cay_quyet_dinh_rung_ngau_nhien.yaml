- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - round(400 * 0.7) == 280
  - round(400 * 0.3) == 120
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.tree import DecisionTreeClassifier as DT</div><div>from
      sklearn.ensemble import RandomForestClassifier as RF</div><div>X, y = make_classification(n_samples=400, n_features=12,</div><div>                           n_informative=4,
      random_state=42)</div><div>X_tr, X_te, y_tr, y_te = train_test_split(</div><div>    X, y, test_size=0.3, stratify=y,
      random_state=42)</div><div>dt = DT(random_state=42).fit(X_tr, y_tr)</div><div>rf = RF(n_estimators=50, max_depth=6,
      random_state=42).fit(X_tr, y_tr)</div><div>print(f'dt_tr={dt.score(X_tr,y_tr):.3f} dt_te={dt.score(X_te,y_te):.3f}')</div><div>imp
      = rf.feature_importances_; top3 = [round(float(x),3) for x in sorted(imp, reverse=True)[:3]]</div><div>print(f'rf_tr={rf.score(X_tr,y_tr):.3f}
      rf_te={rf.score(X_te,y_te):.3f} sum={imp.sum():.2f} top3={top3}')</div></div>
    say: Đoạn mã huấn luyện song song một cây thả tự do không giới hạn độ sâu và một rừng năm mươi cây giới hạn sáu tầng.
      Cả hai chạy trên bộ bốn trăm mẫu có tám cột nhiễu để lộ rõ hiện tượng quá khớp. Từng dòng mã chạy xác định hoàn toàn
      nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Bốn trăm mẫu có tám cột nhiễu đủ làm một cây không
      đáy học thuộc luôn cả những điểm sai lệch ngẫu nhiên.
