- id: practice
  kind: practice
  title: Tự làm bài tập CPU và chấm tự động
  lab: labs/MLP/L06
  steps:
  - show: <table class='t'><tr><th>Thực hành MLP:L06</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Rút
      trích feature_importances_ để kiểm tra cây có bám đặc trưng giả mạo không</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_samples=400
      n_features=12 n_informative=4 test_size=0.30 seed=42 n_estimators=50 max_depth=6</code></td></tr><tr><td><b>Chấm bài
      (.venv-ml)</b></td><td><code>bash labs/cham.sh MLP L06 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Đến phần bạn tự cài đặt bài thực hành số 6 của bài toán học máy trên môi trường chuẩn CPU. Hãy đọc kỹ cấu trúc tham
      số đầu vào đọc từ luồng chuẩn trong tệp đề bài, viết trọn vẹn lời giải Python vào tệp riêng rồi kiểm định qua bộ chấm
      tự động. Cài đặt phép so sánh trực tiếp giữa cây tự do và rừng ngẫu nhiên theo số cây cùng giới hạn độ sâu đọc từ luồng
      chuẩn.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai MLP:L06</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (cây đơn)</b></td><td>Khớp <code>DecisionTreeClassifier(random_state=seed)</code> để quan sát hiện tượng nhớ 100% tập
      Train</td></tr><tr><td><b>Bước 2 (rừng cây)</b></td><td>Khớp <code>RandomForestClassifier(n_estimators=..., max_depth=...,
      random_state=seed)</code></td></tr><tr><td><b>Bước 3 (trọng số cột)</b></td><td>Lấy <code>rf.feature_importances_.sum()</code>
      bảo đảm chuẩn hoá tổng bằng đúng một</td></tr></table>
    say: Từ tham số đọc qua luồng chuẩn, bạn khởi tạo song song một cây đơn lẻ không hạn chế chiều sâu và một rừng ngẫu nhiên
      có số cây cùng độ sâu tối đa định trước. Kiểm tra độ chính xác trên tập huấn luyện của cây đơn, độ chính xác kiểm tra
      của rừng và tổng mức quan trọng đặc trưng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>dt_train_acc=1.000</div><div>rf_test_acc=0.858</div><div>importances_sum=1.00</div></div>
    say: Màn hình hiển thị các dòng kết quả chuẩn ứng với bộ tham số mẫu ban đầu. Chương trình của bạn cần đọc động toàn bộ
      tham số từ luồng chuẩn để vượt qua đồng thời cả hai ca kiểm ẩn.
    focus:
    - 1
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Cây sâu tự do dễ học vẹt</span><span class="a">→</span><span class="n">RandomForest
      hạ phương sai</span><span class="a">→</span><span class="n">Gini [0..0.5] & lọc cột ID</span></div>
    say: So sánh cây đơn và rừng ngẫu nhiên cho thấy gộp nhiều cây độc lập làm giảm hẳn phương sai và kiểm soát được tầm quan
      trọng đặc trưng. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học đằng sau từng
      dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực nghiệm tái lập
      chính xác trên nhiều máy. Hạn chế độ sâu kết hợp tập hợp nhiều cây đa dạng là chìa khoá chinh phục dữ liệu bảng giàu
      tương tác phi tuyến. Rừng ngẫu nhiên giảm phương sai bằng cách chạy song song độc lập từng cây dựa trên lấy mẫu có hoàn
      lại.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành MLP:L06:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 6 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Từ
      nền tảng tập hợp song song này, bước phát triển tự nhiên tiếp theo là nối tiếp từng cây nhỏ để sửa dần sai số.
    clear: true
    focus: null
