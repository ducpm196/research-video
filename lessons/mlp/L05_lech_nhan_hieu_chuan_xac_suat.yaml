      lớp hiếm gấp <b>19 lần</b>.</p></div>'
    say: Một hệ thống chống gian lận báo cáo độ chính xác chín mươi tám phần trăm khiến cả nhóm mừng thầm. Nhưng thực tế có
      tới chín mươi tám phần trăm giao dịch là bình thường. Trên bộ dữ liệu chín mươi lăm phần trăm âm và năm phần trăm dương
      hôm nay, đoán toàn không vẫn đúng chín mươi lăm phần trăm. Nhưng cách đó bỏ sót sạch lớp hiếm. Ta sửa thẳng hàm mất
      mát bằng trọng số lớp và kiểm định độ trung thực xác suất để không bị độ chính xác tổng thể đánh lừa.
