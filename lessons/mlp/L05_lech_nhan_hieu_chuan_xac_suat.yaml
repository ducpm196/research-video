      Dùng thẳng xác suất của mô hình <code>class_weight='balanced'</code> làm xác suất thật mà không hiệu chuẩn.<br><b>Lỗi
      3 (-10đ):</b> Chỉ nhìn ROC-AUC trên dữ liệu cực lệch vì ROC bị che mờ bởi lượng TN khổng lồ.</div></td></tr></table>
    say: Hãy tránh ba sai lầm kinh điển trong bài toán dữ liệu lệch nhãn sau đây. Một là khoe độ chính xác tổng
