  - show: <ol><li>Với tập 95% âm và 5% dương, nếu mô hình chỉ đoán toàn 0 thì Accuracy và Recall bằng bao nhiêu?</li><li>Brier
      score gần 0 hay gần 1 thì xác suất dự báo đáng tin cậy hơn?</li></ol>
    say: Bạn dừng hình trả lời hai câu hỏi nhanh trước khi vào bài thực hành. Câu một, trên tập chín mươi lăm phần
      trăm âm và năm phần trăm dương, đoán toàn không cho độ chính xác và độ phủ bằng mấy? Câu hai, điểm Brier càng
      gần không hay gần một thì càng tốt? Bấm tạm dừng và trả lời.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>Accuracy = <b>95%</b></code> nhưng <code>Recall
      = <b>0.00</b></code> — hoàn toàn bỏ lọt toàn bộ lớp dương.</p></td></tr></table>
    say: 'Đáp án câu một: độ chính xác tổng thể tới chín mươi lăm phần trăm nhưng độ phủ đúng bằng không.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Càng gần <code><b>0</b></code> càng tốt (0.000
      là dự báo khớp tuyệt đối từng xác suất).</p></td></tr></table>
    say: 'Đáp án câu hai: càng gần không càng chuẩn xác vì nó đo bình phương sai lệch giữa xác suất và nhãn thật.'
    clear: true
