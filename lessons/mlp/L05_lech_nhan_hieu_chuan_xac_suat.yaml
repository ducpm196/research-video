      Recall lớp hiếm thay vì tổng tỉ lệ đúng chung</td></tr><tr><td>Bài toán thực tế lệch lớp</td><td>Gian lận thẻ hay lỗi
      máy hiếm khi quá vài phần trăm dữ liệu</td></tr><tr><td>Hiệu chuẩn xác suất dự báo</td><td>Xác suất máy báo 0.8 phải
      tương ứng khoảng 80% ca thật</td></tr></table>
    say: Trên thực tế sản xuất, hai lớp rất ít khi chia đôi năm mươi năm mươi như sách giáo khoa. Nếu giao dịch gian lận chỉ
      chiếm hai đến năm phần trăm, một mô hình lười biếng đoán toàn âm tính vẫn đạt độ chính xác chín mươi lăm phần trăm.
      Bài năm trang bị cách cân bằng trọng số và đo độ trung thực của xác suất. Khi lớp hiếm chỉ chiếm tỉ lệ rất nhỏ vài phần
      trăm, mô hình ưu tiên sai số toàn cục sẽ bỏ mặc lớp thiểu số nếu không hiệu chỉnh trọng số. Quy trình này liên kết chặt
      chẽ từ khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ giữa giả thiết thuật toán
      và giới hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Khi tỉ trọng nhãn dương tụt
      xuống vài phần trăm, mọi nhận định dựa trên tỉ lệ đoán đúng đều mất hết giá trị phân biệt.
