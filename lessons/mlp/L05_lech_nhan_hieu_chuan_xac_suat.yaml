scenes:
- id: hook
  kind: hook
  title: Dữ liệu lệch nhãn 2% & hiệu chuẩn xác suất Brier Score
  checks:
  - 95 / 100 == 0.95
  - 95 / 5 == 19.0
  steps:
  - show: '<div class=''box key''><p>Trên 100 mẫu có <b>5 lớp dương</b> và <b>95 lớp âm</b>: mô hình đoán toàn 0
      đạt <code>Accuracy = <b>95%</b></code> nhưng <code>Recall = <b>0.00</b></code>. Đặt <code>class_weight=''balanced''</code>
      tăng trọng số lớp hiếm gấp <b>19 lần</b>.</p></div>'
    say: Một hệ thống phát hiện gian lận báo cáo độ chính xác chín mươi tám phần trăm khiến nhóm sản phẩm mừng thầm.
      Cho tới khi kiểm tra lại thấy nó không bắt được ca gian lận nào cả. Bởi vì đơn giản chín mươi tám phần trăm
      giao dịch vốn là bình thường. Hôm nay ta sửa thẳng hàm mất mát bằng trọng số lớp và kiểm định độ trung thực
      xác suất.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Ma trận nhầm lẫn và
      độ phủ (MLP:L03)</td><td>Nhìn Recall lớp hiếm thay vì tổng tỉ lệ đúng chung</td></tr><tr><td>Bài toán thực
      tế lệch lớp</td><td>Gian lận thẻ hay lỗi máy hiếm khi quá vài phần trăm dữ liệu</td></tr><tr><td>Hiệu chuẩn
      xác suất dự báo</td><td>Xác suất máy báo 0.8 phải tương ứng khoảng 80% ca thật</td></tr></table>
    say: Trên thực tế sản xuất, hai lớp rất ít khi chia đôi năm mươi năm mươi như sách giáo khoa. Nếu giao dịch
      gian lận chỉ chiếm hai đến năm phần trăm, một mô hình lười biếng đoán toàn âm tính vẫn đạt độ chính xác chín
      mươi lăm phần trăm. Bài năm trang bị cách cân bằng trọng số và đo độ trung thực của xác suất. Đây là nền tảng
      trực tiếp để thiết kế đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>class_weight='balanced'</code></td><td>Tự
      động tăng hệ số phạt cho lớp ít mẫu trong hàm mất mát</td></tr><tr><td><code>average_precision_score(y, p)</code></td><td>Tính
      diện tích dưới đường cong chuẩn xác – độ phủ PR-AUC</td></tr><tr><td><code>brier_score_loss(y, p)</code></td><td>Đo
      độ tin cậy xác suất từ 0 (hoàn hảo) tới 1 (sai tuyệt đối)</td></tr></table>
    say: Bảng trên tóm lược ba công cụ thiết yếu cho bài toán lớp hiếm trong thư viện học máy. Tham số cân bằng
      trọng số đặt ngay trong bộ phân loại, hàm tính trung bình độ chuẩn xác đo diện tích dưới đường cong chuẩn
      xác phủ. Và hàm mất mát Brier đánh giá sai lệch xác suất đầu ra.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
