- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 95 / 100 == 0.95
  - 95 / 5 == 19.0
  steps:
  - show: <div class='box key'><p><b>1. Trọng số cân bằng:</b> <code>w_c = N / (2 * N_c)</code> → lớp 5% được nhân
      phạt cao gấp 19 lần lớp 95%.</p><p><b>2. Brier score:</b> <code>mean((p_i - y_i)^2)</code> — đo sai số bình
      phương giữa xác suất dự báo <code>p</code> và nhãn thật <code>y</code>.</p></div>
    say: Hai công thức ngắn trên giải quyết trọn vẹn phần thuật toán và phần đánh giá hiệu chuẩn. Công thức một
      tính trọng số lớp tỉ lệ nghịch với tần suất xuất hiện, nên mỗi lỗi bỏ sót ca hiếm bị phạt nặng gấp mười chín
      lần. Công thức hai đo trung bình bình phương hiệu giữa xác suất dự báo và nhãn thực tế không một.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 95 / 100 == 0.95
  - 95 / 5 == 19.0
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification
      as mk</div><div>from sklearn.model_selection import train_test_split as sp</div><div>from sklearn.pipeline
      import Pipeline as P</div><div>from sklearn.preprocessing import StandardScaler as SS</div><div>from sklearn.linear_model
      import LogisticRegression as LR</div><div>from sklearn.metrics import recall_score as rc</div><div>from sklearn.metrics
      import average_precision_score as ap</div><div>from sklearn.metrics import brier_score_loss as br</div><div>X,
      y = mk(600, n_informative=4, weights=[0.95,0.05], random_state=42)</div><div>Xa, Xb, ya, yb = sp(X, y, test_size=0.25,
      stratify=y, random_state=42)</div><div>c0 = LR(random_state=42); cb = LR(class_weight='balanced', random_state=42)</div><div>p0
      = P([('s', SS()), ('c', c0)]).fit(Xa, ya)</div><div>pb = P([('s', SS()), ('c', cb)]).fit(Xa, ya); pr = pb.predict_proba(Xb)[:,
      1]</div><div>print(f'raw_rec={rc(yb, p0.predict(Xb)):.3f} bal_rec={rc(yb, pb.predict(Xb)):.3f}')</div><div>print(f'pr_auc={ap(yb,
      pr):.3f} brier={br(yb, pr):.3f}')</div></div>
    say: Đoạn mã tạo sáu trăm mẫu trong đó lớp dương chỉ chiếm năm phần trăm rồi so sánh trực tiếp hai phiên bản
      mô hình. Một bản giữ mặc định, còn bản thứ hai bật trọng số cân bằng để ép mô hình chú ý tới nhóm ít mẫu.
      Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>raw_rec=0.000 bal_rec=0.500</div><div>pr_auc=0.287
      brier=0.196</div></div>
    say: Đầu ra thực tế cho thấy độ phủ lớp hiếm tăng nhảy vọt ngay khi bật chế độ cân bằng trọng số. Đồng thời
      ta ghi nhận điểm diện tích đường cong chuẩn xác phủ và điểm số hiệu chuẩn Brier để theo dõi song song.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 95 / 100 == 0.95
  - 95 / 5 == 19.0
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>from sklearn.metrics import brier_score_loss</div><div>y
      = [0, 0, 1, 1]</div><div>b_good = brier_score_loss(y, [0.1, 0.1, 0.9, 0.9])</div><div>b_bad = brier_score_loss(y,
      [0.4, 0.4, 0.4, 0.4])</div><div>print(f'brier_good={b_good:.4f} brier_bad={b_bad:.4f} better={int(b_good &lt;
      b_bad)}')</div></div>
    say: Để kiểm chứng ý nghĩa trực quan của điểm số Brier. Ta so sánh dự báo tự tin đúng hướng với dự báo lấp lửng
      bằng không phẩy bốn trên bốn nhãn thật. Vì điểm Brier là bình phương sai lệch nên mô hình bám sát sự thật
      phải có con số nhỏ hơn rõ rệt.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>brier_good=0.0100 brier_bad=0.2600 better=1</div></div>
    say: Kết quả tính ra không phẩy không một so với không phẩy hai sáu, chứng minh thước đo này phạt rất nặng các
      xác suất thiếu tự tin hoặc lệch hướng. Kết quả kiểm chứng nhất quán vì hệ thức toán học giữ nguyên ở cả phép
      thử độc lập.
    focus:
    - 1
    - 2
    clear: true
