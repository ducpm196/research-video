  title: Công thức và bất biến định lượng
  checks:
  - 95 / 100 == 0.95
  - 95 / 5 == 19.0
  steps:
  - show: <div class='box key'><p><b>1. Trọng số cân bằng:</b> <code>w_c = N / (2 * N_c)</code> → lớp 5% được nhân phạt cao
      gấp 19 lần lớp 95%.</p><p><b>2. Brier score:</b> <code>mean((p_i - y_i)^2)</code> — đo sai số bình phương giữa xác suất
      dự báo <code>p</code> và nhãn thật <code>y</code>.</p></div>
