      = LR(random_state=42), LR(class_weight='balanced', random_state=42)</div><div>p0 = P([('s', SS()), ('c', c0)]).fit(Xa,
      ya)</div><div>pb = P([('s', SS()), ('c', cb)]).fit(Xa, ya); pr = pb.predict_proba(Xb)[:, 1]</div><div>y0, y1 = p0.predict(Xb),
      pb.predict(Xb)</div><div>print(f'raw_acc={acc(yb, y0):.3f} raw_rec={rc(yb, y0):.3f} bal_rec={rc(yb, y1):.3f}')</div><div>print(f'pr_auc={ap(yb,
      pr):.3f} brier={br(yb, pr):.3f}')</div></div>
    say: Đoạn mã tạo sáu trăm mẫu trong đó lớp dương chỉ chiếm năm phần trăm rồi so sánh trực tiếp hai phiên bản mô hình.
      Một bản giữ mặc định, còn bản thứ hai bật trọng số cân bằng để ép mô hình chú ý tới nhóm ít mẫu. Thực nghiệm vạch trần
      vì sao thước đo độ đúng tổng thể đánh lừa trên dữ liệu lệch nhãn nhiều mẫu âm và rất ít mẫu dương. Khi gắn trọng số
      cân bằng hai lớp theo nghịch đảo tần suất, mô hình buộc phải chú ý vào nhóm dương tính thiểu số. Từng dòng mã chạy xác
      định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Cấu hình tỉ lệ lớp dương năm phần
      trăm tái hiện rõ hiện tượng mô hình mặc định bỏ sót sạch hoàn toàn lớp hiếm.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>raw_acc=0.947 raw_rec=0.000 bal_rec=0.500</div><div>pr_auc=0.287
      brier=0.196</div></div>
    say: Đầu ra thực tế cho thấy độ phủ lớp hiếm tăng nhảy vọt ngay khi bật chế độ cân bằng trọng số. Đồng thời ta ghi nhận
      điểm diện tích đường cong chuẩn xác phủ và điểm số hiệu chuẩn Brier để theo dõi song song. Giá trị đầu ra thu được khớp
      chặt với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết. Độ phủ tăng từ không lên năm mươi phần trăm
      cho thấy trọng số cân bằng đánh thức tức thì khả năng phát hiện lớp hiếm.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - round(((0.1 - 0)**2 * 2 + (0.9 - 1)**2 * 2) / 4, 4) == 0.01
  - round(((0.4 - 0)**2 * 2 + (0.4 - 1)**2 * 2) / 4, 4) == 0.26
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>from sklearn.metrics import brier_score_loss</div><div>y
      = [0, 0, 1, 1]</div><div>b_good = brier_score_loss(y, [0.1, 0.1, 0.9, 0.9])</div><div>b_bad = brier_score_loss(y, [0.4,
      0.4, 0.4, 0.4])</div><div>print(f'brier_good={b_good:.4f} brier_bad={b_bad:.4f} better={int(b_good &lt; b_bad)}')</div></div>
    say: Để kiểm chứng ý nghĩa trực quan của điểm số Brier. Ta so sánh dự báo tự tin đúng hướng với dự báo lấp lửng bằng không
      phẩy bốn trên bốn nhãn thật. Vì điểm Brier là bình phương sai lệch nên mô hình bám sát sự thật phải có con số nhỏ hơn
      rõ rệt. Việc đối chứng hai cách xử lý song song rất cần thiết vì bằng chứng thực nghiệm giúp loại bỏ hoàn toàn phỏng
      đoán cảm tính. So sánh xác suất dự báo sát sự thật với xác suất lơ lửng không phẩy bốn minh hoạ tính nhạy của chỉ số
      Brier.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>brier_good=0.0100 brier_bad=0.2600 better=1</div></div>
    say: Kết quả tính ra không phẩy không một so với không phẩy hai sáu, chứng minh thước đo này phạt rất nặng các xác suất
      thiếu tự tin hoặc lệch hướng. Kết quả kiểm chứng nhất quán vì hệ thức toán học giữ nguyên ở cả phép thử độc lập. Kết
      quả kiểm chứng khẳng định quy luật toán học không đổi khi kiểm thử độc lập. Độ lệch bình phương tăng gấp hai mươi sáu
      lần vạch trần tức thì các mô hình đoán mò thiếu độ hiệu chuẩn xác suất.
