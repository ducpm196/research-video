- id: quymo
  kind: example
  title: Mở rộng quy mô và giới hạn thực tế
  checks:
  - 95 / 5 == 19.0
  - round(0.26 / 0.01) == 26
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>cách xử lý chuẩn</th></tr><tr><td>Gian lận 2% trên
      1 triệu đơn</td><td>Accuracy 98% hoàn toàn vô nghĩa</td><td>Ưu tiên PR-AUC và Recall tại K cảnh báo</td></tr><tr><td>Dùng
      class_weight='balanced'</td><td>Xác suất thô bị đẩy cao quanh 0.5</td><td>Cần hiệu chuẩn lại (Platt / Isotonic) trước
      khi chốt</td></tr><tr><td>Lệch cực đoan 0.1%</td><td>Thiếu mẫu dương từng fold</td><td>Giữ n_splits <= 5 khi chia phân
      tầng</td></tr></table>
    say: Bảng quy mô cảnh báo một tác dụng phụ ít người để ý khi dùng trọng số cân bằng lớp. Việc nhân trọng số lên mười chín
      lần làm xác suất đầu ra thô bị đẩy lệch cao hơn tần suất tự nhiên thật. Nên cần hiệu chuẩn lại nếu dùng con số xác suất
      làm đầu vào tính tiền rủi ro. Trên dữ liệu giao dịch lệch nhãn thực tế, việc chọn giữa tối đa độ phủ hay tối ưu xác
      suất hiệu chuẩn phụ thuộc vào chi phí cảnh báo nhầm hay bỏ lọt rủi ro. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý
      giúp đường ống học máy vận hành tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các
      ràng buộc kiến trúc này giữ cho dịch vụ không tụt hiệu năng hay sập bộ nhớ. Trên triệu giao dịch ngân hàng, cần hiệu
      chuẩn lại xác suất sau khi áp trọng số để tính đúng giá trị kỳ vọng thiệt hại.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Chỉ báo cáo
      <code>Accuracy = 98%</code> trên tập lệch 2% mà không nhìn Precision hay Recall.<br><b>Lỗi 2:</b> Dùng thẳng xác suất
      của mô hình <code>class_weight='balanced'</code> làm xác suất thật mà không hiệu chuẩn.<br><b>Lỗi 3:</b> Chỉ nhìn ROC-AUC
      trên dữ liệu cực lệch vì ROC bị che mờ bởi lượng TN khổng lồ.</div></td></tr></table>
    say: Hãy tránh ba sai lầm kinh điển trong bài toán dữ liệu lệch nhãn sau đây. Một là khoe độ chính xác tổng thể chín mươi
      tám phần trăm che mất độ phủ bằng không. Hai là lấy thẳng xác suất sau cân bằng làm tỉ lệ thật, và ba là chỉ tin một
      mình chỉ số ROC AUC. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công
      gỡ lỗi về sau. Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ
      liệu mới. Dùng diện tích dưới đường cong chuẩn xác phủ thay cho đường cong tỉ lệ dương giả giúp nhìn rõ độ nhiễu trong
      lớp hiếm. Coi xác suất sinh ra từ mô hình gắn trọng số cân bằng như xác suất thực tế ngoài đời dễ dẫn tới định giá rủi
      ro sai.
    focus:
