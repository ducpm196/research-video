      sai một để không cột nào áp đảo phần còn lại. Chặng hai nén chiều qua PCA, rồi chặng ba gom cụm và đo khoảng cách từ
      điểm mới tới tâm gần nhất. Phép chiếu trực giao tìm ra các trục giữ lại nhiều độ biến thiên nhất của đám mây điểm sáu
      chiều ban đầu.
