- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 0.5 + 0.3 + 0.1 == 0.9
  - 3 < 8
  steps:
  - show: <div class='box key'><p><b>1. Tổng phương sai giữ lại:</b> <code>R_k = sum_{i=1..k} lambda_i / sum_{j=1..d}
      lambda_j</code> (thường giữ <code>&gt;= 0,85</code>).</p><p><b>2. Độ lệch bất thường cụm:</b> <code>dist(x)
      = min_c ||x - mu_c||_2</code> — điểm càng xa mọi tâm cụm càng bất thường.</p></div>
    say: Hai công thức trên giúp bạn chọn số chiều nén và phát hiện điểm ngoại lai một cách định lượng. Tỉ số tổng
      phương sai giữ lại cho biết sau khi vứt bỏ các trục phụ thì còn giữ được bao nhiêu phần trăm thông tin biến
      thiên gốc. Còn khoảng cách tối thiểu tới tâm cụm gần nhất càng lớn chứng tỏ điểm đó lạc đàn so với các cụm
      quen thuộc. Vì vậy công thức định lượng giúp kiểm soát sai số và biến đổi mô hình minh bạch hơn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 0.5 + 0.3 + 0.1 == 0.9
  - 3 < 8
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_blobs</div><div>from
      sklearn.preprocessing import StandardScaler</div><div>from sklearn.decomposition import PCA</div><div>from
      sklearn.cluster import KMeans</div><div>from sklearn.pipeline import Pipeline</div><div>X, _ = make_blobs(n_samples=300,
      centers=3, n_features=6, cluster_std=1.0, random_state=42)</div><div>sc = StandardScaler().fit_transform(X)</div><div>pca
      = PCA(n_components=2, random_state=42).fit(sc)</div><div>km = Pipeline([('sc', StandardScaler()),</div><div>               ('km',
      KMeans(n_clusters=3, n_init=10, random_state=42))]).fit(X)</div><div>print(f'var_2d={pca.explained_variance_ratio_.sum():.3f}
      inertia={km["km"].inertia_:.1f}')</div></div>
    say: Đoạn mã sinh ba trăm điểm gom thành ba cụm trong không gian sáu chiều, sau đó chuẩn hóa toàn bộ cột rồi
      chiếu xuống hai chiều chính. Đồng thời ta khớp bộ phân cụm ba tâm để đo tổng bình phương khoảng cách tới tâm
      cụm. Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>var_2d=0.967 inertia=84.6</div></div>
    say: Kết quả chạy thật chứng minh chỉ giữ hai trục chính đã thu gọn được phần lớn phương sai dữ liệu sáu chiều.
      Bởi ba cụm tách biệt rõ rệt nên chỉ cần rất ít thành phần chính vẫn giữ nguyên hình khối cụm.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 0.5 + 0.3 + 0.1 == 0.9
  - 3 < 8
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.cluster
      import KMeans</div><div>X = np.array([[0.0, 0.0], [0.1, -0.1], [10.0, 10.0], [10.1, 9.9]])</div><div>km =
      KMeans(n_clusters=2, n_init=10, random_state=42).fit(X)</div><div>d_norm = km.transform([[0.05, 0.0]]).min()</div><div>d_anom
      = km.transform([[50.0, 50.0]]).min()</div><div>print(f'd_norm={d_norm:.3f} d_anom={d_anom:.3f} far={int(d_anom
      &gt; 10 * d_norm)}')</div></div>
    say: Phép kiểm chứng thứ hai thử đo khoảng cách tới tâm gần nhất cho một điểm nằm giữa cụm quen thuộc. Và một
      điểm nhảy vọt ra tọa độ năm mươi năm mươi. Hàm biến đổi của KMeans trả ngay khoảng cách tới tất cả các tâm
      nên lấy nhỏ nhất ra điểm lệch chuẩn.
    focus:
    - 1
