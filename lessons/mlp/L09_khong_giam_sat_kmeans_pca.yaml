- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>PCA(n_components=2, random_state=42)</code></td><td>Nén
      ma trận xuống 2 thành phần chính trực giao</td></tr><tr><td><code>explained_variance_ratio_</code></td><td>Tỉ lệ phần
      trăm phương sai mà mỗi trục mới giải thích</td></tr><tr><td><code>KMeans(n_clusters=3, n_init=10, random_state=42)</code></td><td>Chạy
      phân cụm 3 tâm với 10 lần khởi tạo chọn nghiệm tốt nhất</td></tr></table>
    say: Bảng ký hiệu liệt kê hai lớp không giám sát và thuộc tính đọc phương sai giữ lại. Trong KMeans, việc đặt số lần khởi
      tạo bằng mười kèm hạt giống bốn hai giúp tránh rơi vào tâm cụm xấu ngay lần chạy đầu. Còn thuộc tính tỉ lệ phương sai
      trả về mảng từng phần trăm ứng với mỗi trục chính. Đặt số lần chạy khởi tạo lặp lại kết hợp hạt giống cố định ngăn kết
      quả phân cụm thay đổi thất thường mỗi lần gọi.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
