- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1:</b> Chạy <code>PCA</code>
      hoặc <code>KMeans</code> trực tiếp trên dữ liệu lệch đơn vị chưa qua <code>StandardScaler</code>.<br><b>Lỗi 2:</b> Quên
      gán <code>random_state=42</code> khi phân cụm dẫn tới thứ tự nhãn cụm nhảy lung tung mỗi lần chạy.<br><b>Lỗi 3:</b>
      Tưởng nhãn 0, 1, 2 của <code>KMeans</code> có thứ tự lớn bé hoặc khớp sẵn với tên lớp nghiệp vụ.</div></td></tr></table>
    say: Bạn tránh kỹ ba sai lầm thường gặp trong học không giám sát dưới đây. Một là bỏ qua chuẩn hóa thang đo trước khi
      đo khoảng cách, hai là quên khoá hạt giống ngẫu nhiên. Và ba là hiểu nhầm nhãn cụm số không và số hai có thứ tự hơn
      kém. Phát hiện sớm các dấu hiệu sai lệch ngay từ bước thử nghiệm trên máy giúp tiết kiệm rất nhiều công gỡ lỗi về sau.
      Hãy kiểm lại định kỳ cả nhật ký chia tập lẫn hạt giống ngẫu nhiên mỗi khi mở rộng bài toán sang bộ dữ liệu mới. Không
