scenes:
- id: hook
  kind: hook
  title: 'Học không giám sát thực hành: Phân cụm KMeans & giảm chiều'
  checks:
  - 0.5 + 0.3 + 0.1 == 0.9
  - 3 < 8
  steps:
  - show: <div class='box key'><p>Đặt <code>StandardScaler()</code> trước <code>PCA</code> và <code>KMeans</code>
      bảo đảm mọi đặc trưng đóng góp bình đẳng vào khoảng cách. Kiểm định tổng tỉ lệ phương sai giữ lại <code>sum(explained_variance_ratio_)</code>.</p></div>
    say: 'Hãy tưởng tượng bạn chạy phân cụm trên hai cột: số năm công tác từ một tới mười và tiền lương từ hai mươi
      triệu tới một trăm triệu. Nếu quên chuẩn hóa, khoảng cách giữa hai người chỉ hoàn toàn phụ thuộc tiền lương
      mà bỏ rơi cột năm công tác. Hôm nay ta chuẩn hóa chuẩn xác, giữ gọn chiều dữ liệu và đo khoảng cách bất thường.'
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Khoảng cách hình học
      Ơ-clít (MLP:L00)</td><td>Một cột đơn vị lớn gấp 1 000 lần sẽ thống trị toàn bộ khoảng cách</td></tr><tr><td>Phân
      cụm không nhãn (KMeans)</td><td>Gom điểm vào K tâm cụm gần nhất theo khoảng cách bình phương</td></tr><tr><td>Giảm
      chiều tuyến tính (PCA)</td><td>Chiếu xuống các trục chứa nhiều phương sai nhất của dữ liệu</td></tr></table>
    say: Nhiều bài toán thực tế như phân khúc khách hàng hay phát hiện hành vi lạ ban đầu không có sẵn nhãn đúng
      sai. Bài chín sử dụng phân cụm KMeans và giảm chiều PCA để rút gọn cấu trúc ẩn của bảng nhiều cột. Điều kiện
      tiên quyết không thể thiếu là luôn chuẩn hóa thang đo trước khi đo khoảng cách hay chiếu trục. Đây là nền
      tảng trực tiếp để thiết kế đường ống thực hành sạch và ổn định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>PCA(n_components=2,
      random_state=42)</code></td><td>Nén ma trận xuống 2 thành phần chính trực giao</td></tr><tr><td><code>explained_variance_ratio_</code></td><td>Tỉ
      lệ phần trăm phương sai mà mỗi trục mới giải thích</td></tr><tr><td><code>KMeans(n_clusters=3, n_init=10,
      random_state=42)</code></td><td>Chạy phân cụm 3 tâm với 10 lần khởi tạo chọn nghiệm tốt nhất</td></tr></table>
    say: Bảng ký hiệu liệt kê hai lớp không giám sát và thuộc tính đọc phương sai giữ lại. Trong KMeans, việc đặt
      số lần khởi tạo bằng mười kèm hạt giống bốn hai giúp tránh rơi vào tâm cụm xấu ngay lần chạy đầu. Còn thuộc
      tính tỉ lệ phương sai trả về mảng từng phần trăm ứng với mỗi trục chính.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
