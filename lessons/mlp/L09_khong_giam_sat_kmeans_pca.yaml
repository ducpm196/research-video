    say: Trước khi giảm chiều PCA hay phân cụm KMeans theo khoảng cách chuẩn hai, luôn phải chuẩn hoá thang đo và theo dõi
      khoảng cách tới tâm gần nhất. Mỗi bước kiểm thử nhỏ trên dữ liệu tổng hợp giúp củng cố vững chắc trực giác toán học
      đằng sau từng dòng lệnh. Duy trì đồng nhất cấu trúc dữ liệu lẫn hạt giống ngẫu nhiên là chìa khoá để mọi kết quả thực
      nghiệm tái lập chính xác trên nhiều máy. Chuẩn hoá trước khi đo khoảng cách là kỷ luật không thể thiếu giúp cả giảm
      chiều lẫn phân cụm hoạt động công bằng. Kết hợp trực quan hoá hai chiều và giám sát khoảng cách tâm mở rộng phạm vi
      bài toán học máy sang dữ liệu chưa gán nhãn.
