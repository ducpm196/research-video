- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round(((50 - 10.05)**2 + (50 - 9.95)**2)**0.5, 3) == 56.569
  - 0.967 > 0.85
  steps:
  - show: <div class='box key'><p><b>1. Tổng phương sai giữ lại:</b> <code>R_k = sum_{i=1..k} lambda_i / sum_{j=1..d} lambda_j</code>
      (thường giữ <code>&gt;= 0,85</code>).</p><p><b>2. Độ lệch bất thường cụm:</b> <code>dist(x) = min_c ||x - mu_c||_2</code>
      — điểm càng xa mọi tâm cụm càng bất thường.</p></div>
    say: Hai công thức trên giúp bạn chọn số chiều nén và phát hiện điểm ngoại lai một cách định lượng. Tỉ số tổng phương
      sai giữ lại cho biết sau khi vứt bỏ các trục phụ thì còn giữ được bao nhiêu phần trăm thông tin biến thiên gốc. Còn
      khoảng cách tối thiểu tới tâm cụm gần nhất càng lớn chứng tỏ điểm đó lạc đàn so với các cụm quen thuộc. Việc tách định
      nghĩa tham số trên tập huấn luyện rất quan trọng vì nó quyết định độ trung thực của thước đo tổng quát. Mọi công thức
      chuyển đổi trước khi đóng gói ra sản phẩm đều phải giữ đúng giả định toán học ban đầu để không gây sai số tích lũy.
      Tỉ lệ phương sai tích lũy giúp kỹ sư chọn số trục giữ lại đạt ngưỡng tám mươi lăm đến chín mươi lăm phần trăm. Khoảng
      cách tới tâm cụm gần nhất càng lớn báo hiệu điểm dữ liệu mới càng khác biệt với các mẫu bình thường đã học.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
