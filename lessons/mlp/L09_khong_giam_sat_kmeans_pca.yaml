    say: Bạn đã hoàn thành đầy đủ bài học và bài tập thực hành số 9 với kiểm thử tự động cả dữ liệu mẫu lẫn hai ca kiểm ẩn.
      Những bất biến vừa đối chiếu bằng số liệu thật sẽ làm nền trực tiếp cho các đường ống triển khai tin cậy sau này. Sau
      khi thành thạo toàn bộ các thuật toán học máy bảng cổ điển, bốn bài còn lại sẽ mở ra mạng nơ-ron trên CPU, đóng gói
