  steps:
  - show: <div class='box key'><p>Đặt <code>StandardScaler()</code> trước <code>PCA</code> và <code>KMeans</code> bảo đảm
      mọi đặc trưng đóng góp bình đẳng vào khoảng cách. Kiểm định tổng tỉ lệ phương sai giữ lại <code>sum(explained_variance_ratio_)</code>.</p></div>
    say: 'Hãy tưởng tượng bạn chạy phân cụm trên hai cột: số năm công tác từ một tới mười và tiền lương từ hai mươi triệu
      tới một trăm triệu. Nếu quên chuẩn hóa, khoảng cách giữa hai người chỉ hoàn toàn phụ thuộc tiền lương mà bỏ rơi cột
      năm công tác. Hôm nay ta chuẩn hóa chuẩn xác, giữ gọn chiều dữ liệu và đo khoảng cách bất thường. Những cột có đơn vị
      đo hàng triệu luôn nuốt trọn khoảng cách hình học nếu ta không đưa về cùng thang đo tiêu chuẩn.'
    clear: true
    focus: null
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối bài trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Khoảng cách hình học Ơ-clít (MLP:L00)</td><td>Một
      cột đơn vị lớn gấp 1 000 lần sẽ thống trị toàn bộ khoảng cách</td></tr><tr><td>Phân cụm không nhãn (KMeans)</td><td>Gom
      điểm vào K tâm cụm gần nhất theo khoảng cách bình phương</td></tr><tr><td>Giảm chiều tuyến tính (PCA)</td><td>Chiếu
      xuống các trục chứa nhiều phương sai nhất của dữ liệu</td></tr></table>
    say: Nhiều bài toán thực tế như phân khúc khách hàng hay phát hiện hành vi lạ ban đầu không có sẵn nhãn đúng sai. Bài
      chín sử dụng phân cụm KMeans và giảm chiều PCA để rút gọn cấu trúc ẩn của bảng nhiều cột. Điều kiện tiên quyết không
      thể thiếu là luôn chuẩn hóa thang đo trước khi đo khoảng cách hay chiếu trục. Các thuật toán không giám sát dựa trực
      tiếp vào khoảng cách hình học sẽ bị bóp méo hoàn toàn nếu tồn tại một cột có thang đo lớn gấp nghìn lần các cột khác.
      Quy trình này liên kết chặt chẽ từ khâu chuẩn bị dữ liệu tới bước đánh giá kiểm chứng cuối cùng. Nắm vững mối liên hệ
      giữa giả thiết thuật toán và giới hạn phần cứng CPU giúp kỹ sư tránh tối ưu lệch trọng tâm khi xử lý dữ liệu thật. Khi
      không có cột nhãn mục tiêu, thuật toán chỉ dựa vào cấu trúc hình học tự nhiên của đám mây điểm dữ liệu.
