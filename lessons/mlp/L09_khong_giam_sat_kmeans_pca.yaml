- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 300 // 3 == 100
  - 0.967 > 0.85
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_blobs</div><div>from
      sklearn.preprocessing import StandardScaler</div><div>from sklearn.decomposition import PCA</div><div>from sklearn.cluster
      import KMeans</div><div>from sklearn.pipeline import Pipeline</div><div>X, _ = make_blobs(n_samples=300, centers=3,
      n_features=6, cluster_std=1.0, random_state=42)</div><div>sc = StandardScaler().fit_transform(X)</div><div>pca = PCA(n_components=2,
      random_state=42).fit(sc)</div><div>km = Pipeline([('sc', StandardScaler()),</div><div>               ('km', KMeans(n_clusters=3,
      n_init=10, random_state=42))]).fit(X)</div><div>print(f'var_2d={pca.explained_variance_ratio_.sum():.3f} inertia={km["km"].inertia_:.1f}')</div></div>
    say: Đoạn mã sinh ba trăm điểm gom thành ba cụm trong không gian sáu chiều, sau đó chuẩn hóa toàn bộ cột rồi chiếu xuống
      hai chiều chính. Đồng thời ta khớp bộ phân cụm ba tâm để đo tổng bình phương khoảng cách tới tâm cụm. Từng dòng mã chạy
      xác định hoàn toàn nhờ cố định hạt giống, nên kết quả lặp lại đồng nhất qua mọi lần thử. Ba trăm điểm gom thành ba cụm
      tách biệt trong sáu chiều được chuẩn hoá trước khi giảm xuống hai trục chính và phân cụm.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>var_2d=0.967 inertia=84.6</div></div>
    say: Kết quả chạy thật chứng minh chỉ giữ hai trục chính đã thu gọn được phần lớn phương sai dữ liệu sáu chiều. Bởi ba
      cụm tách biệt rõ rệt nên chỉ cần rất ít thành phần chính vẫn giữ nguyên hình khối cụm. Giá trị đầu ra thu được khớp
      chặt với công thức định lượng vì phép tính giữ đúng bất biến lý thuyết. Chín mươi sáu phẩy bảy phần trăm thông tin phương
      sai được bảo toàn trọn vẹn chỉ trên mặt phẳng hai chiều gọn nhẹ.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - round(((50 - 10.05)**2 + (50 - 9.95)**2)**0.5, 3) == 56.569
  - round(56.569 / 0.05, 1) == 1131.4
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.cluster import
      KMeans</div><div>X = np.array([[0.0, 0.0], [0.1, -0.1], [10.0, 10.0], [10.1, 9.9]])</div><div>km = KMeans(n_clusters=2,
      n_init=10, random_state=42).fit(X)</div><div>d_norm = km.transform([[0.05, 0.0]]).min()</div><div>d_anom = km.transform([[50.0,
      50.0]]).min()</div><div>print(f'd_norm={d_norm:.3f} d_anom={d_anom:.3f} far={int(d_anom &gt; 10 * d_norm)}')</div></div>
    say: Phép kiểm chứng thứ hai thử đo khoảng cách tới tâm gần nhất cho một điểm nằm giữa cụm quen thuộc và một điểm nhảy
      vọt ra tọa độ năm mươi năm mươi. Hàm biến đổi của KMeans trả ngay khoảng cách tới tất cả các tâm nên lấy nhỏ nhất ra
      độ lệch bất thường. Đưa thêm điểm nhảy vọt tại toạ độ năm mươi năm mươi kiểm nghiệm độ nhạy của thước đo khoảng cách
      phát hiện bất thường.
