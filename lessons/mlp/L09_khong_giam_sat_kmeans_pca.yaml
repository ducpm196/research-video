      quan hóa nhanh và lọc nhiễu</td><td>Giữ biểu đồ rõ mà ít mất thông tin chính</td></tr><tr><td>1 000 000 dòng</td><td>KMeans
      thường khá chậm</td><td>Chuyển sang MiniBatchKMeans xử lý theo lô</td></tr><tr><td>Cột doanh thu vs số đơn</td><td>Sai
      lệch 10^6 lần nếu quên Scaler</td><td>Luôn bọc StandardScaler trước PCA và KMeans</td></tr></table>
    say: 'Bảng quy mô gợi ý lựa chọn khi bảng phình lên một triệu dòng: hãy dùng phiên bản chạy theo lô nhỏ. Để tiết kiệm
      bộ nhớ mà vẫn tìm tâm cụm rất nhanh. Kết hợp giảm chiều và phân cụm không giám sát là bước khám phá nền tảng để phát
      hiện nhóm hành vi lạ mà chưa cần gán nhãn trước. Tuân thủ đúng giới hạn bộ nhớ và tốc độ xử lý giúp đường ống học máy
      vận hành tin cậy ở cấp độ sản phẩm. Khi dữ liệu thực tế vượt gấp trăm lần mẫu thử ban đầu, các ràng buộc kiến trúc này
      giữ cho dịch vụ không tụt hiệu năng hay sập bộ nhớ. Chạy phân cụm theo lô nhỏ trên tập dữ liệu triệu điểm giữ bộ nhớ
      tiêu thụ ổn định mà vẫn bảo toàn chất lượng tâm cụm. Khi triển khai ngoài thực tế, lưu lại bộ chuẩn hoá cùng tâm cụm
      bảo đảm mọi điểm mới được gán đúng nhóm.'
