        focus: [1, 1, 1, 1]
        say: "Hình cho thấy cơ chế, bên trái là bảng điểm người nhân sản phẩm, gần như trống, chỉ có vài chấm xanh là ô đã có điểm. Ta thay nó bằng hai bảng mỏng, bảng P có mỗi hàng là vector p của một người, bảng Q có mỗi cột là vector q của một sản phẩm. Muốn đoán ô cam, ta lấy đúng hàng cam của P chấm với cột cam của Q. Ta chỉ học hai bảng mỏng từ những chấm xanh, rồi mọi ô trống đều đoán được."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra bước cập nhật từ bình phương sai số của một lượt chấm"
    checks:
      - "alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[2] == 0.5 and (3 - 2.5) ** 2 == 0.25"
      - "[round(x, 3) for x in alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[0]] == [1.025, 2.05]"
      - "[round(x, 3) for x in alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1, 0.1)[0]] == [1.015, 2.03] and 1 ** 2 + 2 ** 2 == 5"
    steps:
      - show: |
          <p><b>Bước 1 — sai số của một lượt chấm.</b> Người này chấm thật $r$, ta đoán $\mathbf{p} \cdot \mathbf{q}$, nên theo phần ôn ta phạt bình phương:</p>
          $$\text{phạt} = (r - \mathbf{p} \cdot \mathbf{q})^2 \qquad (3 - 2{,}5)^2 = 0{,}25$$
        focus: [1, 2]
        say: "Bước một là sai số của một lượt chấm, người này chấm thật r còn ta đoán p chấm q, nên theo phần ôn ta phạt bằng bình phương sai số. Làm thử, 3 trừ 2 phẩy 5 bình phương bằng 0 phẩy 25."
      - show: |
          <p><b>Bước 2 — hướng sửa p.</b> Muốn $\hat{r}$ tăng khi đoán thiếu ($e \gt 0$), ta nhích $\mathbf{p}$ <b>theo hướng q</b>, vì tích vô hướng tăng nhanh nhất khi đi cùng hướng q. Đi xuống dốc với tốc độ học $\eta$ cho:</p>
          $$\mathbf{p} \leftarrow \mathbf{p} + \eta \cdot e \cdot \mathbf{q} \qquad \mathbf{q} \leftarrow \mathbf{q} + \eta \cdot e \cdot \mathbf{p}$$
        introduces: [ltgt, assign]
        focus: [1, 1, 2]
        say: "Bước hai là hướng sửa vector p, khi đoán thiếu thì e dương và ta muốn điểm dự đoán tăng lên. Tích vô hướng tăng nhanh nhất khi p nhích cùng hướng q, nên theo cách đi xuống dốc, p được cộng thêm eta nhân e nhân q. Mũi tên quay trái đọc là thay bằng giá trị mới, và q cũng được sửa y hệt theo hướng p."
      - clear: true
        show: |
          <p><b>Bước 3 — làm thử ngay</b> với $\mathbf{p} = (1, 2)$, $\mathbf{q} = (0{,}5;\ 1)$, $r = 3$, $\eta = 0{,}1$, $e = 0{,}5$:</p>
          $$\mathbf{p} \leftarrow (1, 2) + 0{,}1 \cdot 0{,}5 \cdot (0{,}5;\ 1) = (1 + 0{,}025;\ 2 + 0{,}05) = (1{,}025;\ 2{,}05)$$
        focus: [1, 2, 2]
        say: "Bước ba là làm thử ngay với p bằng 1, 2, q bằng 0 phẩy 5, 1, điểm thật 3, eta 0 phẩy 1 và e bằng 0 phẩy 5. Thay số vào công thức, 0 phẩy 1 nhân 0 phẩy 5 bằng 0 phẩy 05, nhân tiếp với q được 0 phẩy 025 và 0 phẩy 05. Cộng vào p, ta được 1 phẩy 025 và 2 phẩy 05."
      - show: |
          <p><b>Bước 4 — thêm mức phạt độ dài.</b> Bình phương độ dài của một vector là tổng bình phương các số của nó: $\|(1, 2)\|^2 = 1 + 4 = 5$. Koren, Bell, Volinsky (2009) cộng thêm $\lambda(\|\mathbf{p}\|^2 + \|\mathbf{q}\|^2)$ vào phạt để vector không phình to, nên mỗi bước có thêm phần kéo về 0:</p>
          $$\mathbf{p} \leftarrow \mathbf{p} + \eta\,(e \cdot \mathbf{q} - \hl{\lambda \cdot \mathbf{p}}) \qquad \lambda = 0{,}1: \ (1 + 0{,}1(0{,}25 - 0{,}1);\ 2 + 0{,}1(0{,}5 - 0{,}2)) = (1{,}015;\ 2{,}03)$$
        introduces: [norm]
        focus: [1, 1, 1, 2, 2]
        say: "Bước bốn là thêm mức phạt độ dài của vector. Bình phương độ dài của một vector là tổng bình phương các số của nó, như vector 1, 2 có bình phương độ dài là 1 cộng 4, bằng 5. Bài báo năm 2009 cộng thêm lambda nhân tổng bình phương độ dài của p và q vào phạt, để vector không phình to. Vì vậy mỗi bước có thêm phần lambda nhân p kéo vector về phía 0. Làm thử với lambda bằng 0 phẩy 1, p mới là 1 phẩy 015 và 2 phẩy 03, nhích ít hơn so với khi không phạt."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một lượt chấm, một bước cập nhật, từng phép tính"
    checks:
      - "1 * 0.5 + 2 * 1 == 2.5 and alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[2] == 0.5"
      - "[round(x, 3) for x in alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[0]] == [1.025, 2.05]"
      - "[round(x, 3) for x in alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[1]] == [0.55, 1.1]"
      - "round(1.025 * 0.55, 3) == 0.564 and round(2.05 * 1.1, 3) == 2.255"
      - "round(sum(a * b for a, b in zip(*alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[:2])), 3) == 2.819 and round(3 - sum(a * b for a, b in zip(*alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[:2])), 3) == 0.181"
    steps:
      - show: |
          <p><b>Bước 1.</b> Dự đoán và sai số, với điểm thật $r = 3$:</p>
          $$\hat{r} = 1 \cdot 0{,}5 + 2 \cdot 1 = 2{,}5 \qquad e = 3 - 2{,}5 = \hl{0{,}5}$$
        focus: [1, 2]
        say: "Bước một, ta dự đoán bằng tích vô hướng, 1 nhân 0 phẩy 5 cộng 2 nhân 1, được 2 phẩy 5. Điểm thật là 3, nên sai số e bằng 3 trừ 2 phẩy 5, bằng 0 phẩy 5, tức ta đoán thiếu nửa điểm."
      - show: |
          <p><b>Bước 2.</b> Sửa vector người dùng, dùng $\mathbf{q}$ <b>cũ</b>:</p>
          $$\mathbf{p}_{\text{mới}} = (1, 2) + 0{,}05 \cdot (0{,}5;\ 1) = \hlg{(1{,}025;\ 2{,}05)}$$
        focus: [1, 2]
        say: "Bước hai, ta sửa vector người dùng bằng q cũ, eta nhân e là 0 phẩy 05. Cộng 0 phẩy 05 nhân q vào p, ta được p mới bằng 1 phẩy 025 và 2 phẩy 05."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Sửa vector sản phẩm, dùng $\mathbf{p}$ <b>cũ</b> (1, 2), không dùng p vừa sửa:</p>
          $$\mathbf{q}_{\text{mới}} = (0{,}5;\ 1) + 0{,}05 \cdot (1, 2) = \hlg{(0{,}55;\ 1{,}1)}$$
        focus: [1, 2]
        say: "Bước ba, ta sửa vector sản phẩm bằng p cũ là 1, 2, không dùng p vừa sửa xong, vì cả hai đều được tính từ cùng một sai số. Cộng 0 phẩy 05 nhân 1, 2 vào q, ta được q mới bằng 0 phẩy 55 và 1 phẩy 1."
      - show: |
          <p><b>Bước 4.</b> Dự đoán lại với hai vector mới:</p>
          $$\hat{r}_{\text{mới}} = 1{,}025 \cdot 0{,}55 + 2{,}05 \cdot 1{,}1 \approx 0{,}564 + 2{,}255 \approx 2{,}819 \qquad e_{\text{mới}} \approx 0{,}181$$
          <p class="note">Một bước đã đưa sai số từ 0,5 xuống khoảng 0,181. Lặp lại trên hàng trăm triệu lượt chấm là cả quá trình học.</p>
        focus: [1, 2, 3, 3]
        say: "Bước bốn, ta dự đoán lại với hai vector mới. Tích vô hướng là 1 phẩy 025 nhân 0 phẩy 55 cộng 2 phẩy 05 nhân 1 phẩy 1, khoảng 2 phẩy 819, nên sai số còn khoảng 0 phẩy 181. Chỉ một bước đã đưa sai số từ 0 phẩy 5 xuống khoảng 0 phẩy 181. Lặp lại như thế qua hàng trăm triệu lượt chấm chính là cả quá trình học."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: độ dốc đo bằng số, và hệ số 2 đi đâu"
    checks:
      - "round(((3 - (1.001 * 0.5 + 2)) ** 2 - (3 - (0.999 * 0.5 + 2)) ** 2) / 0.002, 6) == -0.5"
      - "round(((3 - (0.5 + 2.001)) ** 2 - (3 - (0.5 + 1.999)) ** 2) / 0.002, 6) == -1.0"
      - "[round(1 - 0.05 * -0.5, 3), round(2 - 0.05 * -1.0, 3)] == [round(x, 3) for x in alg.irs_mf_step([1, 2], [0.5, 1], 3, 0.1)[0]]"
    steps:
      - show: |
          <p>Đường khác: đo độ dốc của phạt $(3 - \mathbf{p} \cdot \mathbf{q})^2$ bằng cách nhích từng số của $\mathbf{p}$ đi 0,001:</p>
          <table class="t"><tr><th>nhích</th><th>phạt đổi bao nhiêu chia 0,002</th><th>độ dốc</th></tr>
          <tr><td>số đầu: 0,999 → 1,001</td><td>đo bằng máy</td><td>−0,5</td></tr>
          <tr><td>số sau: 1,999 → 2,001</td><td>đo bằng máy</td><td>−1,0</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm tra thứ nhất đi đường khác, ta đo độ dốc bằng cách nhích từng số của p một chút, từ 0 phẩy 999 lên 1 phẩy 001, rồi xem phạt đổi bao nhiêu. Với số đầu, độ dốc đo được là âm 0 phẩy 5, nghĩa là tăng số này thì phạt giảm. Với số sau, nhích từ 1 phẩy 999 lên 2 phẩy 001, độ dốc là âm 1."
      - show: |
          <p>Theo cách đi xuống dốc, bước đi là trừ $\frac{\eta}{2} \cdot$ độ dốc (hệ số 2 của bình phương đã gộp vào $\eta$):</p>
          $$1 - 0{,}05 \cdot (-0{,}5) = 1{,}025 \qquad 2 - 0{,}05 \cdot (-1) = 2{,}05 \;\checkmark$$
        focus: [1, 2]
        say: "Theo cách đi xuống dốc, ta trừ một nửa eta nhân độ dốc, vì đạo hàm của bình phương có hệ số 2 và công thức của bài báo đã gộp số 2 đó vào eta. Một trừ 0 phẩy 05 nhân âm 0 phẩy 5 bằng 1 phẩy 025, còn 2 trừ 0 phẩy 05 nhân âm 1 bằng 2 phẩy 05, khớp đúng bước hai."

  - id: bias
    kind: concept
    title: "Thêm độ lệch: người khó tính, phim được ưa"
    checks:
      - "round(3.7 + 0.5 - 0.3, 1) == 3.9"
      - "round(0.9514 * 0.9, 4) == 0.8563"
    steps:
      - show: |
          <p>Koren, Bell, Volinsky (2009): phần lớn khác biệt giữa các điểm là do <b>độ lệch</b> riêng của người hay của phim, không do tương tác giữa hai bên.</p>
          <table class="t"><tr><th>thành phần</th><th>ví dụ của bài báo</th><th>sao</th></tr>
          <tr><td>trung bình mọi lượt chấm</td><td>mọi phim</td><td>3,7</td></tr>
          <tr><td>độ lệch của phim</td><td>phim Titanic hay hơn trung bình</td><td>+0,5</td></tr>
          <tr><td>độ lệch của người</td><td>người khó tính</td><td>−0,3</td></tr>
          <tr><td>ước lượng ban đầu</td><td>$3{,}7 + 0{,}5 - 0{,}3$</td><td>$\hlg{3{,}9}$</td></tr></table>
          <p class="note">Vector $\mathbf{p} \cdot \mathbf{q}$ chỉ còn phải giải thích phần dư. Hệ gợi ý sẵn có của hãng tổ chức cuộc thi đạt <b>sai số căn quân phương</b> (căn bậc hai của trung bình các bình phương sai số) 0,9514; giải lớn đòi 0,8563, tức giảm 10%: $0{,}9514 \cdot 0{,}9 \approx 0{,}8563$.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.5", 3, 3]
        say: "Bài báo năm 2009 nhấn mạnh rằng phần lớn khác biệt giữa các điểm là do độ lệch riêng của người hay của phim, không phải do tương tác giữa hai bên. Ví dụ của bài báo bắt đầu từ trung bình mọi lượt chấm là 3 phẩy 7 sao. Một phim hay hơn trung bình được cộng 0 phẩy 5. Một người khó tính bị trừ 0 phẩy 3. Ước lượng ban đầu là 3 phẩy 9 sao, và hai vector chỉ còn phải giải thích phần dư. Để đo cả hệ, người ta dùng sai số căn quân phương, tức căn bậc hai của trung bình các bình phương sai số trên mọi lượt chấm. Hệ gợi ý sẵn có của hãng tổ chức cuộc thi đạt 0 phẩy 9514, giải lớn đòi 0 phẩy 8563, tức giảm 10 phần trăm."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "alg.irs_mf_step([1, 2], [0.5, 1], 3, 1.0)[:2] == ([1.25, 2.5], [1.0, 2.0]) and sum(a * b for a, b in zip(*alg.irs_mf_step([1, 2], [0.5, 1], 3, 1.0)[:2])) == 6.25"
      - "[round(x, 6) for x in alg.irs_fit_user([[0.5, 0.5]], [5], 0.1, 0.0, 5000, [0.1, 0.1])] == [5.0, 5.0] and round(2 * alg.irs_fit_user([[0.5, 0.5]], [5], 0.1, 0.0, 5000)[0], 6) == 10.0"
      - "round(alg.irs_fit_user([[0.5, 0.5]], [5], 0.1, 0.5, 5000)[0], 6) == 2.5 and round(2 * alg.irs_fit_user([[0.5, 0.5]], [5], 0.1, 0.5, 5000)[0], 6) == 5.0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tốc độ học quá lớn, $\eta = 1$ <b class="red">(đoán 6,25 cho điểm thật 3: vọt quá xa hơn lúc đầu)</b>
          <br><span class="note">$\mathbf{p} \to (1{,}25;\ 2{,}5)$, $\mathbf{q} \to (1, 2)$, $\hat{r} = 1{,}25 + 5 = 6{,}25$. Phép thử: theo dõi sai số sau mỗi vòng; tăng lên là giảm $\eta$.</span></div>
        say: "Lỗi thứ nhất là chọn tốc độ học quá lớn, eta bằng 1. Khi đó p thành 1 phẩy 25 và 2 phẩy 5, q thành 1 và 2, dự đoán vọt lên 6 phẩy 25 cho điểm thật 3, sai còn xa hơn lúc đầu. Phép thử là theo dõi sai số sau mỗi vòng, thấy tăng lên thì giảm eta."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không chính quy hoá ($\lambda = 0$) cho người chỉ chấm <b>một</b> phim <b class="red">(dự đoán 10 sao trên thang 5)</b>
          <br><span class="note">Người mới chấm phim A, $\mathbf{q}_A = (0{,}5;\ 0{,}5)$, 5 sao. Vector phim giữ nguyên (đã học từ nhiều người khác), chỉ học $\mathbf{p}$, bắt đầu từ $(0{,}1;\ 0{,}1)$, tới khi khớp: $\mathbf{p} = (5, 5)$. Phim B có $\mathbf{q}_B = (2, 0)$: $\hat{r} = 10$. Phép thử: xem phân bố dự đoán của người ít lượt chấm.</span></div>
        introduces: [sub]
        say: "Lỗi thứ hai là không chính quy hoá, lambda bằng 0, cho người mới chỉ chấm đúng một phim. Người này chấm phim A, có vector q với chữ A nhỏ dưới chân bằng 0 phẩy 5, 0 phẩy 5, và cho phim đó 5 sao. Vector của phim đã học từ nhiều người khác nên giữ nguyên, ta chỉ học p, bắt đầu từ 0 phẩy 1, 0 phẩy 1, và học tới khi khớp hoàn toàn thì p thành 5, 5. Với phim B có vector 2, 0, dự đoán là 10 sao trên thang 5, rất cực đoan. Phép thử là xem phân bố dự đoán của nhóm người có ít lượt chấm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Chọn $\lambda$ bằng sai số trên <b>chính dữ liệu huấn luyện</b> <b class="red">(luôn thắng là λ = 0)</b></div>
          <table class="t"><tr><th>$\lambda$</th><th>$\mathbf{p}$ học được</th><th>đoán lại phim A (thật 5)</th><th>đoán phim B</th></tr>
          <tr><td>0</td><td>(5, 5)</td><td>5,0 — khớp tuyệt đối</td><td class="red">10,0</td></tr>
          <tr><td>0,5</td><td>(2,5; 2,5)</td><td>2,5 — khớp kém</td><td class="green">5,0</td></tr></table>
          <p class="note">Trên dữ liệu đã học, $\lambda = 0$ luôn đẹp nhất. Bài báo năm 2009 ghi rằng $\lambda$ thường được chọn bằng kiểm định chéo: giữ riêng một phần lượt chấm không cho học, rồi đo sai số trên phần đó.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là chọn lambda bằng sai số trên chính dữ liệu huấn luyện, tức những lượt chấm mô hình đã học. Với lambda bằng 0, vector đoán lại phim A đúng 5, khớp tuyệt đối, nhưng đoán phim B tới 10. Với lambda bằng 0 phẩy 5, vector co về 2 phẩy 5, 2 phẩy 5, đoán lại phim A chỉ 2 phẩy 5, nhưng phim B là 5, hợp lý hơn nhiều. Trên dữ liệu đã học thì lambda bằng 0 luôn đẹp nhất. Vì vậy bài báo năm 2009 ghi rằng lambda thường được chọn bằng kiểm định chéo, tức giữ riêng một phần lượt chấm không cho học, rồi đo sai số trên phần đó."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Bỏ độ lệch, bắt vector tự học “người khó tính” <b class="red">(tốn chiều cho một hằng số)</b>
          <br><span class="note">Bài báo năm 2009: người hay chấm cao, phim hay được chấm cao là xu hướng lớn và có hệ thống. Thêm trung bình, độ lệch người, độ lệch phim trước, như 3,7 + 0,5 − 0,3 = 3,9.</span></div>
        say: "Lỗi thứ tư cũng của người đã đi làm, là bỏ độ lệch rồi bắt vector tự học chuyện người này khó tính, tốn chiều cho một hằng số. Bài báo năm 2009 ghi rằng người hay chấm cao và phim hay được chấm cao là những xu hướng lớn, có hệ thống. Hãy thêm trung bình, độ lệch của người và độ lệch của phim trước, như 3 phẩy 7 cộng 0 phẩy 5 trừ 0 phẩy 3 bằng 3 phẩy 9."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: một bước cập nhật, và chọn lam-đa cho người mới"
    checks:
      - "2 * 1 + 1 * 1 == 3 and alg.irs_mf_step([2, 1], [1, 1], 4, 0.1)[2] == 1"
      - "[round(x, 3) for x in alg.irs_mf_step([2, 1], [1, 1], 4, 0.1)[0]] == [2.1, 1.1] and [round(x, 3) for x in alg.irs_mf_step([2, 1], [1, 1], 4, 0.1)[1]] == [1.2, 1.1]"
      - "round(sum(a * b for a, b in zip(*alg.irs_mf_step([2, 1], [1, 1], 4, 0.1)[:2])), 3) == 3.73"
      - "[round(x, 3) for x in alg.irs_mf_step([2, 1], [1, 1], 4, 0.1, 0.1)[0]] == [2.08, 1.09]"
      - "round(alg.irs_fit_user([[0.5, 0.5]], [5], 0.1, 0.1, 5000)[0], 3) == 4.167 and round(2 * alg.irs_fit_user([[0.5, 0.5]], [5], 0.1, 0.1, 5000)[0], 2) == 8.33"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\mathbf{p} = (2, 1)$, $\mathbf{q} = (1, 1)$, điểm thật 4, $\eta = 0{,}1$. Tính $\hat{r}$, $e$, $\mathbf{p}$ mới, $\mathbf{q}$ mới, rồi đoán lại.</td></tr>
          <tr><td>2</td><td>Cùng câu 1 nhưng $\lambda = 0{,}1$: $\mathbf{p}$ mới là bao nhiêu?</td></tr>
          <tr><td>3</td><td>Người mới ở lỗi 2 với $\lambda = 0{,}1$ thì $\mathbf{p}$ thành (4,167; 4,167). Bạn chọn $\lambda$ = 0,1 hay 0,5 cho nhóm người mới?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn với ba câu trong bảng. Câu một, p bằng 2, 1, q bằng 1, 1, điểm thật 4 và eta 0 phẩy 1, hãy tính dự đoán, sai số, hai vector mới rồi đoán lại. Câu hai, cùng như câu một nhưng lambda bằng 0 phẩy 1, vector p mới là bao nhiêu. Câu ba, người mới ở lỗi thứ hai, với lambda bằng 0 phẩy 1 thì p thành 4 phẩy 167 cho cả hai số, bạn chọn lambda 0 phẩy 1 hay 0 phẩy 5 cho nhóm người mới. Dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước</th><th>đáp số</th></tr>
          <tr><td>1</td><td>$\hat{r} = 2 + 1 = 3$, $e = 4 - 3 = 1$, $\eta e = 0{,}1$</td><td></td></tr>
          <tr><td>1</td><td>$\mathbf{p} = (2, 1) + 0{,}1 \cdot (1, 1)$; $\mathbf{q} = (1, 1) + 0{,}1 \cdot (2, 1)$</td><td>$(2{,}1;\ 1{,}1)$; $(1{,}2;\ 1{,}1)$</td></tr>
          <tr><td>1</td><td>đoán lại: $2{,}1 \cdot 1{,}2 + 1{,}1 \cdot 1{,}1 = 2{,}52 + 1{,}21$</td><td>$\hlg{3{,}73}$</td></tr>
          <tr><td>2</td><td>$(2 + 0{,}1(1 - 0{,}2);\ 1 + 0{,}1(1 - 0{,}1))$</td><td>$(2{,}08;\ 1{,}09)$</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, dự đoán là 2 cộng 1 bằng 3, sai số là 4 trừ 3 bằng 1, nên eta nhân e bằng 0 phẩy 1. Vector p mới là 2 phẩy 1 và 1 phẩy 1, vector q mới dùng p cũ là 1 phẩy 2 và 1 phẩy 1. Đoán lại được 2 phẩy 52 cộng 1 phẩy 21, bằng 3 phẩy 73, gần 4 hơn hẳn. Câu hai, có phạt lambda 0 phẩy 1, p mới là 2 phẩy 08 và 1 phẩy 09, nhích ít hơn một chút."
      - show: |
          <table class="t"><tr><th>câu 3: người mới</th><th>đoán lại phim A (thật 5)</th><th>đoán phim B</th><th>được / mất</th></tr>
          <tr><td>$\lambda = 0{,}1$</td><td>4,167</td><td>8,33</td><td class="red">vẫn vượt thang 5</td></tr>
          <tr><td>$\lambda = 0{,}5$</td><td>2,5</td><td>5,0</td><td class="green">trong thang, nhưng khớp kém phim đã chấm</td></tr></table>
          <p class="note">Chọn mức phạt mạnh hơn cho nhóm người mới, rồi kiểm lại bằng sai số trên lượt chấm giữ riêng. Khi người đó đã chấm nhiều phim khác nhau, đo lại trên lượt chấm giữ riêng để chọn lại $\lambda$ cho nhóm đó.</p>
        focus: [0, "1.2", "1.3", 2, 2]
        say: "Câu ba, ta so hai lựa chọn trong bảng. Với lambda bằng 0 phẩy 1, người mới đoán lại phim A được 4 phẩy 167 nhưng đoán phim B tới 8 phẩy 33, vẫn vượt thang 5. Với lambda bằng 0 phẩy 5, phim B về đúng 5 trong thang, đổi lại phim đã chấm chỉ đoán được 2 phẩy 5. Vì vậy ta chọn mức phạt mạnh hơn cho nhóm người mới, rồi kiểm lại bằng sai số trên những lượt chấm giữ riêng. Khi người đó đã chấm nhiều phim khác nhau, ta đo lại trên lượt chấm giữ riêng để chọn lại lambda cho nhóm đó."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bảng gần như trống</span><span class="a">→</span>
          <span class="n">mỗi người một p, mỗi món một q</span><span class="a">→</span>
          <span class="n">đoán = p chấm q</span><span class="a">→</span>
          <span class="n">mỗi lượt chấm: p, q nhích theo e</span><span class="a">→</span>
          <span class="n">phạt lam-đa, thêm độ lệch</span></div>
        say: "Tổng kết lại, bảng điểm gần như trống, nên ta gán mỗi người một vector p và mỗi món một vector q, rồi đoán bằng tích vô hướng. Mỗi lượt chấm cho một sai số e, và p, q nhích theo hướng của nhau với tốc độ học eta. Mức phạt lambda giữ vector không phình to, còn độ lệch của người và phim gánh phần chung."
      - show: |
          <div class="box key"><b>Tư duy:</b> mô hình khớp hoàn hảo dữ liệu đã thấy chưa phải mô hình tốt — đo trên <b>lượt chấm giữ riêng</b>, nhất là với người có ít dữ liệu.</div>
        say: "Điều cần mang theo, mô hình khớp hoàn hảo dữ liệu đã thấy chưa phải là mô hình tốt, hãy đo trên những lượt chấm giữ riêng, nhất là với người có ít dữ liệu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): phản hồi ngầm — khi không ai chấm sao, chỉ có lượt bấm và lượt xem; “không bấm” chưa chắc là “không thích”, và mẫu âm phải chọn khéo.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học phản hồi ngầm, khi không ai chấm sao mà chỉ có lượt bấm và lượt xem. Không bấm chưa chắc là không thích, và mẫu âm phải được chọn khéo. Hẹn gặp bạn ở bài tiếp theo."
