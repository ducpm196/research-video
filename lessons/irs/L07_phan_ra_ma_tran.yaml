scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "8,5 tỉ ô, chỉ hơn 1% có điểm"
    checks:
      - "480189 * 17770 == 8532958530 and round(100480507 / (480189 * 17770) * 100, 2) == 1.18"
      - "(480189 + 17770) * 50 == 24897950 and round(480189 * 17770 / ((480189 + 17770) * 50)) == 343"
    steps:
      - show: |
          <p>Cuộc thi gợi ý phim 2006–2009 (Netflix Prize): <b>480&nbsp;189</b> người, <b>17&nbsp;770</b> phim, <b>100&nbsp;480&nbsp;507</b> lượt chấm (Koren 2009; Töscher và cộng sự 2009).</p>
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>số ô của bảng người × phim</td><td>$480\,189 \cdot 17\,770$</td><td>8&nbsp;532&nbsp;958&nbsp;530</td></tr>
          <tr><td>phần ô có điểm</td><td>$\frac{100\,480\,507}{8\,532\,958\,530}$</td><td class="red">≈ 1,18%</td></tr></table>
        introduces: [cdot, frac, approx]
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, cuộc thi gợi ý phim từ năm 2006 tới 2009 có 480 nghìn 189 người, 17 nghìn 770 phim và khoảng 100 triệu 480 nghìn lượt chấm, theo báo cáo của đội thắng giải. Dấu chấm giữa là phép nhân, bảng người nhân phim có hơn 8 tỉ 532 triệu ô. Chia ra, chỉ khoảng 1 phẩy 18 phần trăm ô là có điểm, khớp với câu khoảng 99 phần trăm ô bị trống trong báo cáo."
      - show: |
          <p>Nếu cho mỗi người và mỗi phim một vector <b>50 số</b> (số minh hoạ, trong khoảng 20–100 chiều mà Koren, Bell, Volinsky 2009 nêu):</p>
          $$(480\,189 + 17\,770) \cdot 50 = 24\,897\,950 \text{ số} \;\approx\; \frac{1}{343} \text{ số ô}$$
          <div class="box key">Hôm nay ta trả lời: hai vector ngắn dự đoán một ô thế nào? Học hai vector đó bằng từng lượt chấm ra sao? Và vì sao phải phạt vector quá dài?</div>
        focus: [1, 2, 2, 3]
        say: "Giả sử mỗi người và mỗi phim có một vector 50 số, một số minh hoạ nằm trong khoảng 20 tới 100 chiều mà bài báo năm 2009 nêu. Khi đó ta chỉ cần gần 25 triệu số, bằng khoảng 1 phần 343 số ô. Hai vector ngắn thay cho cả một hàng và một cột của bảng. Hôm nay ta trả lời ba câu hỏi, hai vector ngắn dự đoán một ô thế nào, học chúng từ từng lượt chấm ra sao, và vì sao phải phạt vector quá dài."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: ma trận, tích vô hướng, độ dốc, bình phương sai số"
    checks:
      - "3 * 4 == 12 and sum(x is not None for x in [5, None, 3, None, None, 4, None, None, 2, None, None, 5]) == 5"
      - "1 * 0.5 + 2 * 1 == 2.5"
      - "(1 - 3) ** 2 == 4 and round((1.1 - 3) ** 2, 4) == 3.61 and round(((1.1 - 3) ** 2 - 4) / 0.1, 4) == -3.9"
      - "round((1.01 - 3) ** 2, 4) == 3.9601 and round(((1.01 - 3) ** 2 - 4) / 0.01, 4) == -3.99 and 2 * (1 - 3) == -4"
      - "1 - 0.1 * (2 * (1 - 3)) == 1.4 and round((1.4 - 3) ** 2, 4) == 2.56 and round(2 * (1.4 - 3), 4) == -3.2"
      - "round(1.4 - 0.1 * (2 * (1.4 - 3)), 4) == 1.72 and round((1.72 - 3) ** 2, 4) == 1.6384"
      - "(3 - 2.5) ** 2 == 0.25 and (3 - 3.5) ** 2 == 0.25 and (3 - 4) ** 2 == 1"
    steps:
      - show: |
          <p>Trước hết, ta cần hiểu <b>ma trận</b>: một bảng số xếp thành hàng và cột. Ở đây mỗi <b>hàng</b> là một người, mỗi <b>cột</b> là một phim, mỗi <b>ô</b> là số sao người đó chấm phim đó.</p>
          <table class="t"><tr><th></th><th>phim 1</th><th>phim 2</th><th>phim 3</th><th>phim 4</th></tr>
          <tr><td>người 1</td><td>5</td><td>–</td><td>3</td><td>–</td></tr>
          <tr><td>người 2</td><td>–</td><td>4</td><td>–</td><td>–</td></tr>
          <tr><td>người 3</td><td>2</td><td>–</td><td>–</td><td>5</td></tr></table>
          <p class="note">3 hàng × 4 cột = 12 ô, chỉ 5 ô có điểm. Dấu “–” là <b>ô trống</b>: người đó chưa chấm, không phải 0 điểm. <b>Phân rã ma trận</b> là viết cả bảng thành hai bảng mỏng nhân với nhau, để đoán các ô trống.</p>
        focus: [1, 1, 2, 3, 3, 3]
        say: "Trước hết, ta cần hiểu ma trận là gì, đó là một bảng số xếp thành hàng và cột. Trong bài này, mỗi hàng là một người, mỗi cột là một phim, và mỗi ô là số sao người đó chấm cho phim đó. Bảng nhỏ trên màn hình có ba người và bốn phim, có ô ghi số sao, có ô chỉ là dấu gạch. Ba hàng nhân bốn cột là 12 ô, nhưng chỉ 5 ô có điểm. Dấu gạch là ô trống, nghĩa là người đó chưa chấm phim đó, chứ không phải chấm 0 điểm. Phân rã ma trận nghĩa là viết cả bảng thành hai bảng mỏng nhân với nhau, và nhờ đó đoán được các ô trống."
      - clear: true
        show: |
          <p><b>Vector</b> là một dãy số viết trong ngoặc, như $(1, 2)$. <b>Tích vô hướng</b> của hai vector cùng số phần tử: nhân từng cặp số ở cùng vị trí rồi cộng lại.</p>
          $$(1, 2) \cdot (0{,}5;\ 1) = 1 \cdot 0{,}5 + 2 \cdot 1 = 0{,}5 + 2 = 2{,}5$$
          <p class="note">Hai vector có số lớn ở cùng vị trí thì tích lớn. Bài 6 cũng dùng tích vô hướng để tính cosin giữa hai người.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Điều thứ hai là tích vô hướng, và trước hết vector là một dãy số viết trong ngoặc, ví dụ vector 1, 2. Tích vô hướng của hai vector có cùng số phần tử là nhân từng cặp số ở cùng vị trí rồi cộng lại. Với vector 1, 2 và vector 0 phẩy 5, 1, ta được 1 nhân 0 phẩy 5 cộng 2 nhân 1, tức 0 phẩy 5 cộng 2, bằng 2 phẩy 5. Hai vector có số lớn ở cùng vị trí thì cho tích vô hướng lớn. Bài 6 cũng đã dùng tích vô hướng để tính cosin, tức độ giống nhau giữa hai người."
      - clear: true
        show: |
          <p><b>Độ dốc</b> (còn gọi là đạo hàm) của một hàm tại một điểm: nhích $w$ thêm một chút thì giá trị hàm đổi bao nhiêu, tính cho mỗi một đơn vị nhích. Ví dụ $f(w) = (w - 3)^2$, thấp nhất (bằng 0) tại $w = 3$:</p>
          <table class="t"><tr><th>nhích từ $w = 1$, $f = 4$</th><th>$f$ mới</th><th>đổi chia độ nhích</th></tr>
          <tr><td>lên 1,1</td><td>$1{,}9^2 = 3{,}61$</td><td>$-0{,}39 : 0{,}1 = -3{,}9$</td></tr>
          <tr><td>lên 1,01</td><td>$1{,}99^2 = 3{,}9601$</td><td>$-0{,}0399 : 0{,}01 = -3{,}99$</td></tr></table>
          <p>Nhích càng nhỏ, con số càng gần $-4$. Công thức chính xác: độ dốc của $(w - 3)^2$ là $2(w - 3)$, tại $w = 1$ bằng $2 \cdot (-2) = -4$.</p>
        introduces: [power]
        focus: [1, 1, 1, "2.2", "2.3", 3, 3]
        say: "Điều thứ ba là độ dốc, còn gọi là đạo hàm. Độ dốc của một hàm tại một điểm cho biết khi nhích w thêm một chút, giá trị hàm thay đổi bao nhiêu cho mỗi một đơn vị nhích. Lấy ví dụ hàm f của w bằng w trừ 3 bình phương, thấp nhất bằng 0 tại w bằng 3, còn tại w bằng 1 thì hàm bằng 4. Nhích w lên 1 phẩy 1, hàm còn 3 phẩy 61, giảm 0 phẩy 39 cho một bước nhích 0 phẩy 1, tức âm 3 phẩy 9 cho mỗi đơn vị. Nhích nhỏ hơn, lên 1 phẩy 01, ta được âm 3 phẩy 99. Nhích càng nhỏ thì con số càng gần âm 4. Công thức chính xác cho độ dốc của hàm này là 2 nhân w trừ 3, tại w bằng 1 đúng bằng âm 4."
      - clear: true
        show: |
          <p><b>Đi xuống dốc.</b> Độ dốc âm: tăng $w$ thì hàm giảm. Độ dốc dương: tăng $w$ thì hàm tăng. Vậy muốn hàm nhỏ đi, ta bước <b>ngược dấu</b> độ dốc: mới = cũ − $\eta \cdot$ độ dốc, với $\eta$ (tốc độ học) quyết định bước dài hay ngắn.</p>
          <table class="t"><tr><th>lần</th><th>$w$</th><th>độ dốc $2(w - 3)$</th><th>$w$ mới, $\eta = 0{,}1$</th><th>$f$ mới</th></tr>
          <tr><td>1</td><td>1</td><td>−4</td><td>1 + 0,4 = 1,4</td><td>2,56</td></tr>
          <tr><td>2</td><td>1,4</td><td>−3,2</td><td>1,4 + 0,32 = 1,72</td><td>1,6384</td></tr></table>
        introduces: [eta]
        focus: [1, 1, 1, "2.2", "2.2", "2.3", 0]
        say: "Bây giờ là cách đi xuống dốc, độ dốc âm nghĩa là tăng w thì hàm giảm, còn độ dốc dương nghĩa là tăng w thì hàm tăng. Vì vậy muốn hàm nhỏ đi, ta luôn bước ngược dấu với độ dốc, giá trị mới bằng giá trị cũ trừ eta nhân độ dốc. Chữ Hy Lạp eta là tốc độ học, nó quyết định mỗi bước dài hay ngắn. Lần một, tại w bằng 1, độ dốc là âm 4 và eta bằng 0 phẩy 1, nên w mới bằng 1 cộng 0 phẩy 4, bằng 1 phẩy 4. Giá trị của hàm giảm từ 4 xuống còn 2 phẩy 56. Lần hai, độ dốc tại 1 phẩy 4 là âm 3 phẩy 2, nên w mới là 1 phẩy 72 và hàm chỉ còn 1 phẩy 6384. Mỗi bước, w lại tiến gần đáy 3 hơn và hàm nhỏ đi."
      - clear: true
        show: |
          <p><b>Bình phương sai số</b>: lấy điểm thật trừ điểm đoán, rồi nhân với chính nó. Bình phương không bao giờ âm, nên đoán thừa hay đoán thiếu đều bị phạt, và sai càng xa phạt càng nặng.</p>
          $$(3 - 2{,}5)^2 = 0{,}25 \qquad (3 - 3{,}5)^2 = 0{,}25 \qquad (3 - 4)^2 = 1$$
        focus: [1, 1, 2]
        say: "Điều cuối là bình phương sai số, ta lấy điểm thật trừ điểm đoán, rồi nhân với chính nó. Bình phương không bao giờ âm, nên đoán thừa hay đoán thiếu đều bị phạt, và sai càng xa thì phạt càng nặng. Ví dụ điểm thật là 3, đoán 2 phẩy 5 hay đoán 3 phẩy 5 đều bị phạt 0 phẩy 25, còn đoán 4 thì bị phạt tới 1."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: vector người dùng p, vector sản phẩm q, sai số e, lam-đa"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc là</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>$\mathbf{p}$</td><td>vector p</td><td>sở thích của một người, $f$ số</td><td>$(1, 2)$</td></tr>
          <tr><td>$\mathbf{q}$</td><td>vector q</td><td>đặc điểm của một sản phẩm, cùng $f$ số</td><td>$(0{,}5;\ 1)$</td></tr>
          <tr><td>$\hat{r} = \mathbf{p} \cdot \mathbf{q}$</td><td>r mũ</td><td>điểm dự đoán</td><td>2,5</td></tr>
          <tr><td>$e = r - \hat{r}$</td><td>e</td><td>sai số: điểm thật trừ điểm dự đoán</td><td>$3 - 2{,}5 = 0{,}5$</td></tr>
          <tr><td>$\lambda$</td><td>lam-đa</td><td>mức phạt vector quá dài</td><td>0,1</td></tr></table>
        introduces: [vec, hat, lambda]
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng giải mã ký hiệu, chữ p in đậm là vector sở thích của một người, gồm f số, ví dụ 1 và 2. Chữ q in đậm là vector đặc điểm của một sản phẩm, cùng f số, ví dụ 0 phẩy 5 và 1. Chữ r có dấu mũ là điểm dự đoán, bằng tích vô hướng p chấm q, ở đây 2 phẩy 5. Chữ e là sai số, điểm thật trừ điểm dự đoán, nếu người này chấm thật 3 điểm thì e bằng 0 phẩy 5. Chữ Hy Lạp lambda là mức phạt vector quá dài, ví dụ 0 phẩy 1."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một bảng khổng lồ, gần như trống, bằng hai bảng mỏng nhân nhau"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430">
          <g font-size="23" text-anchor="middle" fill="#1f2937">
          <rect x="60" y="60" width="420" height="300" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
