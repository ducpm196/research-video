source: "curriculum/irs.yaml L07; audit/irs/verify_irs.py (verify_parts/L07.py); audit/irs/sources_L07.md (câu trích nguyên văn, đọc 2026-11-03); Y. Koren, R. Bell, C. Volinsky, Matrix Factorization Techniques for Recommender Systems, IEEE Computer 42(8), 2009 [KO09]; Y. Koren, The BellKor Solution to the Netflix Grand Prize, 2009 — câu trích mượn từ audit/dsc/sources_L15.md [KO09b]; A. Töscher, M. Jahrer, R. Bell, The BigChaos Solution, 2009 [TJ09]; CS115 bài 9 (đi xuống dốc), bài 16 (SVD); DSC bài 15 (cuộc thi gợi ý phim); IRS bài 6 (lọc cộng tác)"
assumes: [arith]
# Quy ước (theo khoá IRS và [KO09]):
#   - \mathbf{p} = vector người dùng, \mathbf{q} = vector sản phẩm, cùng f chiều; dự đoán \hat{r} = \mathbf{p} \cdot \mathbf{q}; e = r − \hat{r} (sai số).
#   - η = tốc độ học (như CS115 bài 9, đọc “ê-ta”); λ = hệ số lam-đa, mức phạt độ lớn vector (sổ IRS, replaces lambda).
#   - Cập nhật theo một lượt chấm, như [KO09]: \mathbf{p} ← \mathbf{p} + η(e\mathbf{q} − λ\mathbf{p}); \mathbf{q} ← \mathbf{q} + η(e\mathbf{p} − λ\mathbf{q}),
#     cả hai dùng giá trị CŨ. Hệ số 2 của đạo hàm bình phương đã gộp vào η (giải thích ở step kiểm).
#   - Số của cuộc thi gợi ý phim (480 189 người, 17 770 phim, 100 480 507 lượt chấm) là CITED; ví dụ p, q, η, λ là số minh hoạ.
#   - SGD, Netflix, Cinematch, ALS chỉ trên màn hình; lời đọc nói “bước cập nhật theo từng lượt chấm”, “cuộc thi gợi ý phim 2006–2009”.
objectives:
  - "Dự đoán điểm bằng tích vô hướng vector người dùng và sản phẩm"
  - "Thực hiện một bước cập nhật theo một lượt chấm, có và không có chính quy hoá"
  - "Chọn mức phạt lam-đa khi người dùng có ít lượt chấm"
