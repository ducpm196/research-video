scenes:
  - id: hook
    kind: hook
    title: "Từ 45 triệu video năm 2008 tới 1,9 tỉ người dùng mỗi tháng năm 2019"
    checks:
      - "7 * 60 * 24 == 10080"
    steps:
      - show: |
          <table class="t"><tr><th>năm</th><th>quy mô (theo bài báo của chính đội kỹ sư)</th></tr>
          <tr><td>2008</td><td>hơn <b>45 triệu</b> video; mỗi phút có thêm <b>7 giờ</b> video tải lên [BA08]</td></tr>
          <tr><td>2016</td><td>giúp <b>hơn 1 tỉ</b> người dùng tìm video; kho <b>hàng triệu</b> video [CO16]</td></tr>
          <tr><td>2019</td><td><b>1,9 tỉ</b> người dùng mỗi tháng; <b>hàng trăm tỉ</b> dòng nhật ký mỗi ngày [ZH19]</td></tr></table>
          <div class="box key">Hôm nay: đi lại hành trình của hệ gợi ý video YouTube qua năm bài báo của chính các nhóm kỹ sư — mỗi quy mô làm lộ ra điểm nghẽn nào, họ xử lý ra sao, và ta rút ra thực hành tốt gì cho quy mô của mình.</div>
        focus: ["1.2", "1.3", "1.4", 2, 2]
        say: "Chào bạn, năm 2008, kho video YouTube có hơn 45 triệu video, và mỗi phút lại có thêm 7 giờ video được tải lên. Năm 2016, hệ gợi ý giúp hơn 1 tỉ người dùng tìm video trong một kho hàng triệu video. Năm 2019, nền tảng có 1 phẩy 9 tỉ người dùng mỗi tháng và tạo ra hàng trăm tỉ dòng nhật ký mỗi ngày. Hôm nay ta đi lại hành trình đó qua năm bài báo do chính các nhóm kỹ sư viết. Ở mỗi chặng, ta xem quy mô làm lộ ra điểm nghẽn nào, họ xử lý ra sao, và rút ra thực hành tốt cho quy mô của mình."

  - id: prereq
    kind: prereq
    title: "Ôn lại: sáu điều của khoá sẽ dùng"
    checks:
      - "alg.irs_prec_at_k([1, 0, 1, 0, 0], 5) == 0.4 and alg.irs_ivf_cost(10 ** 6, 1000, 10) == 11000"
      - "round(100 ** 0.75, 1) == 31.6 and 10 / 0.2 == 50 and min(10 / 0.2, 30) == 30"
      - "10 + 1000 * 0.05 + 20 == 80 and round(51 / (51 + 951), 4) == 0.0509"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>0</td><td>độ chuẩn xác ở k kết quả đầu</td><td>2 đúng trong 5 dòng: $\frac{2}{5} = 0{,}4$</td></tr>
          <tr><td>3</td><td>tìm láng giềng gần đúng theo cụm</td><td>1 triệu vector, 1000 cụm, xét 10 cụm: 11&nbsp;000 phép so</td></tr>
          <tr><td>8</td><td>lấy mẫu âm theo tần suất mũ 0,75</td><td>tỉ lệ 100 : 1 thành khoảng 31,6 : 1</td></tr></table>
        introduces: [frac]
        focus: ["1.2", "1.3", "1.4"]
        say: "Ở bài 0, độ chuẩn xác ở k kết quả đầu là số kết quả đúng chia k, như 2 đúng trong 5 dòng cho 0 phẩy 4. Ở bài 3, tìm láng giềng gần đúng theo cụm chỉ so với các tâm và vài cụm gần nhất, 1 triệu vector chia 1000 cụm, xét 10 cụm thì tốn 11 nghìn phép so. Ở bài 8, lấy mẫu âm theo tần suất mũ 0 phẩy 75 làm tỉ lệ 100 trên 1 giữa sản phẩm phổ biến và sản phẩm hiếm còn khoảng 31 phẩy 6 trên 1."
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>9</td><td>khởi động lạnh và khám phá</td><td>50 lượt bấm trên 1000 lần hiện: trung bình $\frac{51}{1002} \approx 0{,}0509$</td></tr>
          <tr><td>10</td><td>trọng số nghịch đảo xác suất được nhìn, và cắt trọng số</td><td>10 lượt bấm ở vị trí nhìn thấy với xác suất 0,2: $\frac{10}{0{,}2} = 50$</td></tr>
          <tr><td>12</td><td>hệ hai tầng trong ngân sách độ trễ</td><td>$10 + 1000 \cdot 0{,}05 + 20 = 80$ mi li giây</td></tr></table>
        introduces: [cdot, approx]
        focus: ["1.2", "1.3", "1.4"]
        say: "Ở bài 9, 50 lượt bấm trên 1000 lần hiện cho trung bình 51 chia 1002, khoảng 0 phẩy 0509, và ta học vì sao phải dành chỗ cho khám phá. Ở bài 10, 10 lượt bấm ở vị trí có xác suất được nhìn 0 phẩy 2 tương đương 50 lượt, và trọng số quá lớn thì phải cắt. Ở bài 12, hệ hai tầng tốn 10 cộng 1000 nhân 0 phẩy 05 cộng 20, bằng 80 mi li giây, vừa ngân sách."

