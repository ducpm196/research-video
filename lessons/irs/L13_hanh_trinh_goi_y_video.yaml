  - id: stage1
    kind: example
    title: "Chặng 1, năm 2008 — khai sinh: đồ thị cùng xem và thử trên nhật ký cũ"
    stage: {year: "2008", scale: "hơn 45 triệu video, 7 giờ video tải lên mỗi phút; thí nghiệm trên 92 ngày nhật ký: 5,4 triệu người, còn 1,1 triệu người, 1,3 triệu video, 12,5 triệu lượt xem sau khi lọc", source: "[BA08]", practice: "bắt đầu từ thống kê cùng xem và luôn so với đường cơ sở “phổ biến nhất”; đánh giá ngoại tuyến bằng cách học trên quá khứ, thử trên tương lai, nhớ rằng “không xem” chưa chắc là “không thích”"}
    checks:
      - "7 * 60 * 24 == 10080"
      - "round(12.5 / 1.1, 1) == 11.4 and round(29 / 5.4, 1) == 5.4"
      - "round(0.084 * 1.1e6) == 92400 and 46 < 92 - 46 + 1"
    steps:
      - show: |
          <p><b>Quy mô.</b> Hơn 45 triệu video, mỗi phút thêm 7 giờ video [BA08]. Tính lại: $7 \cdot 60 \cdot 24 = \hlb{10\,080}$ giờ video mới <b>mỗi ngày</b>.</p>
          <p><b>Cách làm.</b> Đếm <b>cùng xem</b>: với mỗi cặp video, bao nhiêu người đã xem cả hai. Bạn xem J và K; người xem J hay xem L, M, N; người xem K hay xem N, O, P, Q → gợi ý hợp các tập, và N được nhắc hai lần.</p>
        focus: [1, 1, 2, 2]
        say: "Chặng một, năm 2008, kho có hơn 45 triệu video và mỗi phút có thêm 7 giờ video. Tính lại, 7 nhân 60 nhân 24 bằng 10 nghìn 080 giờ video mới mỗi ngày, không ai xem kịp để gắn nhãn. Cách làm của bài báo năm 2008 là đếm cùng xem, với mỗi cặp video thì bao nhiêu người đã xem cả hai. Bạn xem J và K, người xem J hay xem L, M, N, người xem K hay xem N, O, P, Q, nên gợi ý hợp các tập đó, và N được nhắc tới hai lần."
      - show: |
          <p><b>Điểm nghẽn: đo thế nào?</b> Thử mọi biến thể trên người dùng thật là không thực tế, nên đội dùng nhật ký 92 ngày: học trên <b>46 ngày đầu</b>, thử trên phần còn lại. Mẫu 5,4 triệu người, lọc còn <b>1,1 triệu người</b>, 1,3 triệu video, <b>12,5 triệu</b> lượt xem.</p>
          $$\frac{12{,}5 \text{ triệu}}{1{,}1 \text{ triệu}} \approx \hlb{11{,}4} \text{ lượt mỗi người, so với } \frac{29}{5{,}4} \approx 5{,}4 \text{ trước khi lọc}$$
        focus: [1, 1, 1, 2]
        say: "Điểm nghẽn đầu tiên là đo thế nào, vì thử mọi biến thể trên người dùng thật là không thực tế. Đội dùng nhật ký 92 ngày, học trên 46 ngày đầu và thử trên phần còn lại. Mẫu 5 phẩy 4 triệu người, lọc còn 1 phẩy 1 triệu người, 1 phẩy 3 triệu video và 12 phẩy 5 triệu lượt xem. Mỗi người còn khoảng 11 phẩy 4 lượt xem, gấp đôi mức 5 phẩy 4 trước khi lọc, vì chỉ giữ người có mặt ở cả hai giai đoạn."
      - clear: true
        show: |
          <table class="t"><tr><th>điều bài báo ghi</th><th>nối với khoá</th></tr>
          <tr><td>gợi ý <b>phổ biến nhất</b>, 1 video: độ chuẩn xác khoảng <b>8,4%</b>, độ phủ 3,2%; 100 video: độ phủ 10,6%, độ chuẩn xác 0,6%</td><td>bài 0: độ chuẩn xác ở 1 kết quả; với 1,1 triệu người ≈ $\hlg{92\,400}$ người có gợi ý đầu đúng</td></tr>
          <tr><td>“nhìn lại không thấy hết”: gợi ý mà người dùng không xem chưa chắc là sai — có thể họ chưa thấy</td><td>bài 8 và 10: không bấm khác không thích</td></tr>
          <tr><td>với người chỉ xem rất ít, gợi ý phổ biến nhất là cách hữu ích</td><td>bài 9: khởi động lạnh</td></tr></table>
          <p class="note"><b>Thực hành tốt:</b> luôn có đường cơ sở “phổ biến nhất”; đánh giá theo thời gian (học quá khứ, thử tương lai). <b>Điều kiện:</b> con số ngoại tuyến chỉ để so các cách với nhau, vì nó đánh giá thấp mọi hệ.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Gợi ý một video phổ biến nhất cho độ chuẩn xác khoảng 8 phẩy 4 phần trăm, tức khoảng 92 nghìn 400 trong 1 phẩy 1 triệu người có gợi ý đầu đúng. Bài báo ghi rằng gợi ý không được xem chưa chắc là sai, có thể người dùng chưa thấy nó, đúng điều bài 8 và bài 10 cảnh báo. Với người xem rất ít, gợi ý phổ biến nhất lại hữu ích, chính là bài toán khởi động lạnh ở bài 9. Thực hành tốt là luôn có đường cơ sở phổ biến nhất và đánh giá theo thời gian, nhưng con số ngoại tuyến chỉ để so các cách với nhau."

  - id: stage2
    kind: example
    title: "Chặng 2, năm 2016 — tăng trưởng: hai mạng nơ-ron, sinh ứng viên rồi xếp hạng"
    stage: {year: "2016", scale: "hơn 1 tỉ người dùng; kho hàng triệu video; mô hình khoảng 1 tỉ tham số, học trên hàng trăm tỉ ví dụ; độ trễ phục vụ hàng chục mi li giây", source: "[CO16]", practice: "tách hai tầng: sinh vài trăm ứng viên bằng tích vô hướng và tìm láng giềng gần đúng, xếp hạng kỹ vài trăm ứng viên; dùng phản hồi ngầm có trọng số thời gian xem thay vì tỉ lệ bấm; chỉ số ngoại tuyến để lặp nhanh, thử nghiệm hai nhóm trực tuyến để quyết định"}
    checks:
      - "10 ** 6 * 256 * 4 == 1024000000"
      - "round(10 ** 6 / 5000) == 200 and 200 > 100"
      - "round(34.6 * 1.041, 1) == 36.0"
    steps:
      - show: |
          <p><b>Quy mô và điểm nghẽn.</b> Hơn 1 tỉ người dùng, kho hàng triệu video [CO16]. Chấm hàng triệu video trong <b>hàng chục mi li giây</b> là không thể, nên hệ thành <b>cái phễu</b>: hàng triệu → <b>hàng trăm</b> ứng viên → <b>hàng chục</b> video hiện ra.</p>
          <p><b>Tầng sinh ứng viên</b> học vector nhúng cho người dùng và cho video, rồi tìm video có tích vô hướng lớn nhất bằng tìm láng giềng gần đúng như bài 3. Bảng vector của thí nghiệm có 1 triệu video, mỗi video 256 số thực:</p>
          $$10^6 \cdot 256 \cdot 4 \text{ byte} = \hlb{1\,024\,000\,000} \text{ byte} \approx 1 \text{ tỉ byte}$$
        focus: [1, 1, 2, 3]
        say: "Chặng hai, năm 2016, hệ giúp hơn 1 tỉ người dùng tìm video trong kho hàng triệu video. Chấm hàng triệu video trong hàng chục mi li giây là không thể, nên hệ thành cái phễu, hàng triệu video, hàng trăm ứng viên, rồi hàng chục video hiện ra. Tầng sinh ứng viên tìm video có tích vô hướng lớn nhất với vector người dùng bằng tìm láng giềng gần đúng như bài 3. Bảng vector của thí nghiệm có 1 triệu video, mỗi video 256 số thực 4 byte, tức khoảng 1 tỉ byte."
      - clear: true
        show: |
          <p><b>Học từ phản hồi ngầm.</b> Xem hết một video là một nhãn dương. Mỗi ví dụ chỉ so với <b>vài nghìn</b> mẫu âm lấy ngẫu nhiên thay vì cả triệu lớp, nhanh hơn <b>trên 100 lần</b> [CO16]. Tính lại với 5000 mẫu âm (minh hoạ): $\frac{10^6}{5000} = 200$ lần ít số hạng hơn.</p>
          <p><b>Tầng xếp hạng</b> chấm kỹ vài trăm ứng viên bằng hàng trăm đặc trưng. Xếp theo tỉ lệ bấm thì đẩy lên video “câu bấm” mà người xem không xem hết, nên đội học <b>thời gian xem kỳ vọng</b>: lượt bấm được nhân trọng số bằng thời gian xem. Bỏ trọng số đó, mất mát tăng <b>4,1%</b>: từ 34,6% lên khoảng $34{,}6 \cdot 1{,}041 \approx 36{,}0\%$.</p>
        introduces: [power]
        focus: [1, 1, 2, 2]
        say: "Tầng sinh ứng viên học từ phản hồi ngầm, xem hết một video là một nhãn dương. Mỗi ví dụ chỉ so với vài nghìn mẫu âm thay vì cả triệu lớp, nhanh hơn trên 100 lần, và với 5000 mẫu âm minh hoạ thì ít hơn 200 lần số hạng. Tầng xếp hạng chấm kỹ vài trăm ứng viên, và vì xếp theo tỉ lệ bấm đẩy lên video câu bấm, đội học thời gian xem kỳ vọng. Bỏ trọng số thời gian xem thì mất mát tăng 4 phẩy 1 phần trăm, từ 34 phẩy 6 lên khoảng 36 phần trăm."
      - clear: true
        show: |
          <div class="box key"><b>Thực hành tốt:</b> (1) hai tầng — sinh ứng viên rẻ trên hàng triệu, xếp hạng đắt trên vài trăm; (2) tầng sinh ứng viên <b>trộn thêm</b> ứng viên từ các nguồn khác, không vứt hệ cũ; (3) học từ <b>mọi</b> lượt xem, kể cả lượt không đến từ gợi ý, để video mới có cơ hội; (4) <b>số ví dụ như nhau cho mỗi người dùng</b>, để vài người dùng rất tích cực không chiếm hết hàm mất mát.</div>
          <p class="note"><b>Điều kiện:</b> bài báo ghi chỉ số ngoại tuyến dùng để lặp nhanh, nhưng quyết định cuối cùng là thử nghiệm hai nhóm trực tuyến, vì hai loại kết quả “không phải lúc nào cũng tương quan”.</p>
        focus: [1, 1, 1, 1, 2]
        say: "Thực hành tốt thứ nhất là hai tầng, sinh ứng viên rẻ trên hàng triệu video, xếp hạng đắt trên vài trăm ứng viên. Thứ hai, trộn thêm ứng viên từ các nguồn khác, không vứt bỏ hệ cũ. Thứ ba, học từ mọi lượt xem, kể cả lượt không đến từ gợi ý, để video mới có cơ hội. Thứ tư, số ví dụ như nhau cho mỗi người, để vài người rất tích cực không chiếm hết hàm mất mát. Điều kiện là chỉ số ngoại tuyến để lặp nhanh, còn thử nghiệm hai nhóm trực tuyến mới quyết định, vì hai loại kết quả có lúc lệch nhau."

  - id: stage3
    kind: example
    title: "Chặng 3, năm 2019 — quy mô lớn: xếp hạng nhiều mục tiêu và thiên lệch vị trí"
    stage: {year: "2019", scale: "1,9 tỉ người dùng mỗi tháng; hàng trăm tỉ dòng nhật ký mỗi ngày; tầng xếp hạng nhận vài trăm ứng viên từ nhiều nguồn đề cử", source: "[ZH19]", practice: "tách thiên lệch vị trí khỏi sở thích bằng một tháp nông nhận vị trí, bỏ vị trí khi phục vụ; tách mục tiêu tương tác và mục tiêu hài lòng; so mọi kiến trúc ở cùng chi phí tính toán"}
    checks:
      - "round(0.24 - (-0.07), 2) == 0.31"
      - "round(6.1 / 3.7, 2) == 1.65"
      - "1000 * 10 // 100 == 100"
    steps:
      - show: |
          <p><b>Điểm nghẽn: vòng phản hồi.</b> Người dùng hay bấm video ở <b>gần đầu danh sách</b> “dù tiện ích thật của nó thế nào” [ZH19]. Học thẳng từ nhật ký thì mô hình học lại chính thứ tự cũ — bài 10 gọi đây là thiên lệch vị trí.</p>
          <table class="t"><tr><th>cách xử lý vị trí (thử trực tuyến)</th><th>chỉ số tương tác</th></tr>
          <tr><td>đưa vị trí vào làm một đặc trưng thường</td><td>−0,07%</td></tr>
          <tr><td>học đối kháng, cấm mô hình đoán vị trí</td><td>+0,01%</td></tr>
          <tr><td><b>tháp nông</b> nhận vị trí, cộng vào điểm cuối; bỏ khi phục vụ</td><td>$\hlg{+0{,}24\%}$</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4"]
        say: "Chặng ba, năm 2019, nền tảng có 1 phẩy 9 tỉ người dùng mỗi tháng, và tầng xếp hạng nhận vài trăm ứng viên từ nhiều nguồn. Điểm nghẽn là vòng phản hồi, người dùng hay bấm video gần đầu danh sách dù tiện ích thật của nó thế nào. Học thẳng từ nhật ký thì mô hình học lại chính thứ tự cũ, đúng thiên lệch vị trí ở bài 10. Đưa vị trí vào làm một đặc trưng thường thì chỉ số tương tác giảm 0 phẩy 07 phần trăm khi thử trực tuyến. Học đối kháng để cấm mô hình đoán vị trí chỉ tăng 0 phẩy 01 phần trăm. Một tháp nông nhận vị trí, cộng vào điểm cuối rồi bỏ đi khi phục vụ, tăng 0 phẩy 24 phần trăm."
      - clear: true
        show: |
          <p><b>Tính lại.</b> Khoảng cách giữa cách tốt nhất và cách “thêm đặc trưng”: $0{,}24 - (-0{,}07) = \hlb{0{,}31}$ điểm phần trăm. Khi học, vị trí bị ẩn ngẫu nhiên <b>10%</b> số lần, để mô hình không dựa hết vào nó: cứ 1000 ví dụ thì khoảng $1000 \cdot \frac{10}{100} = 100$ ví dụ không có vị trí.</p>
          <p><b>Nhiều mục tiêu, cùng chi phí.</b> Mô hình dự đoán cả tương tác (bấm, thời gian xem) lẫn hài lòng (thích, đánh giá). Với cùng 6,1 triệu phép nhân — gấp $\frac{6{,}1}{3{,}7} \approx 1{,}65$ lần gốc — cách chia sẻ “8 chuyên gia” tăng tương tác +0,45%, hài lòng +3,07%, còn chỉ làm mạng to hơn thì +0,1% và +1,89%.</p>
        introduces: [frac]
        focus: [1, 1, 2, 2, 2]
        say: "Tính lại, khoảng cách giữa cách tốt nhất và cách thêm đặc trưng là 0 phẩy 24 trừ âm 0 phẩy 07, bằng 0 phẩy 31 điểm phần trăm. Khi học, vị trí bị ẩn ngẫu nhiên 10 phần trăm số lần, tức cứ 1000 ví dụ thì khoảng 100 ví dụ không có vị trí. Mô hình còn dự đoán cùng lúc mục tiêu tương tác và mục tiêu hài lòng, như thích và đánh giá. Ở cùng 6 phẩy 1 triệu phép nhân, gấp 1 phẩy 65 lần gốc, cách chia sẻ tám chuyên gia tăng tương tác 0 phẩy 45 phần trăm và hài lòng 3 phẩy 07. Chỉ làm mạng to hơn thì được 0 phẩy 1 và 1 phẩy 89 phần trăm."
      - clear: true
        show: |
          <div class="box key"><b>Thực hành tốt:</b> đo và <b>tách</b> thiên lệch do chính hệ tạo ra, đừng để mô hình học lại thứ tự cũ; tách mục tiêu “bấm” khỏi mục tiêu “hài lòng”; so hai kiến trúc ở <b>cùng chi phí tính toán</b>.</div>
          <p class="note"><b>Điều kiện:</b> bài báo ghi họ “thường thích kiến trúc đơn giản hơn”, vì mô hình quá phức tạp làm tăng độ trễ và thường lệch giữa chỉ số ngoại tuyến và trực tuyến.</p>
        focus: [1, 1, 2]
        say: "Thực hành tốt ở chặng này là đo và tách thiên lệch do chính hệ tạo ra, đừng để mô hình học lại thứ tự cũ. Đồng thời tách mục tiêu bấm khỏi mục tiêu hài lòng, và luôn so hai kiến trúc ở cùng chi phí tính toán. Điều kiện là bài báo ghi họ thường thích kiến trúc đơn giản hơn, vì mô hình quá phức tạp làm tăng độ trễ và hay lệch giữa chỉ số ngoại tuyến và trực tuyến."

  - id: stage4
    kind: example
    title: "Chặng 4, năm 2019 — quy mô lớn: khám phá có kiểm soát và cắt trọng số"
    stage: {year: "2019", scale: "hàng triệu video để chọn, hàng tỉ người dùng; dữ liệu học chỉ có phản hồi cho video mà các phiên bản hệ cũ đã chọn", source: "[CH19]", practice: "dành một nhóm nhỏ người dùng (5%) cho chính sách có ngẫu nhiên lấy mẫu theo xác suất của mô hình thay vì chọn bừa; sửa thiên lệch dữ liệu cũ bằng trọng số nghịch đảo có cắt, đo tác động của mức cắt bằng thử nghiệm trực tuyến"}
    checks:
      - "90 + 5 == 95 and 90 + 5 + 5 == 100"
      - "min(0.05 / 0.01, 3) == 3 and min(0.05 / 0.01, 5) == 5"
      - "round(0.85 - 0.16, 2) == 0.69"
    steps:
      - show: |
          <p><b>Điểm nghẽn.</b> Hệ chỉ thấy phản hồi cho video mà <b>các phiên bản cũ</b> của nó đã chọn [CH19]. Chọn bừa kiểu ε-tham lam ở bài 9 “không khả thi” ở đây: gợi ý lạc chủ đề làm hỏng trải nghiệm.</p>
          <table class="t"><tr><th>nhóm người dùng</th><th>tỉ lệ</th><th>được phục vụ bằng</th></tr>
          <tr><td>1</td><td>90%</td><td>chính sách cố định (luôn lấy mục có xác suất cao nhất)</td></tr>
          <tr><td>2</td><td>5%</td><td>chính sách cố định</td></tr>
          <tr><td>3</td><td>5%</td><td>chính sách có ngẫu nhiên: <b>lấy mẫu</b> theo xác suất của mô hình</td></tr></table>
          <p class="note">Mô hình cố định học nhóm 1 + 2, mô hình khám phá học nhóm 1 + 3: cùng $90\% + 5\% = 95\%$ dữ liệu, chỉ khác ở chỗ có dữ liệu khám phá. Kết quả: thời gian xem tăng <b>0,07%</b> — từ chỉ 5% người dùng.</p>
        focus: [1, 1, "2.2", "2.4", 3, 3]
        say: "Chặng bốn, cũng năm 2019, điểm nghẽn là hệ chỉ thấy phản hồi cho những video mà các phiên bản cũ của nó đã chọn. Bài báo ghi cách chọn bừa một phần nhỏ thời gian như bài 9 là không khả thi ở đây, vì gợi ý lạc chủ đề làm hỏng trải nghiệm. Đội chia người dùng thành ba nhóm 90, 5 và 5 phần trăm, hai nhóm đầu dùng chính sách cố định. Nhóm thứ ba dùng chính sách có ngẫu nhiên, lấy mẫu theo xác suất của chính mô hình. Mô hình cố định học nhóm 1 và 2, mô hình khám phá học nhóm 1 và 3, nên cả hai cùng có 95 phần trăm dữ liệu. Kết quả là thời gian xem tăng 0 phẩy 07 phần trăm, chỉ từ 5 phần trăm người dùng."
      - clear: true
        show: |
          <p><b>Cắt trọng số, đúng như bài 10.</b> Sửa thiên lệch dữ liệu cũ bằng trọng số = xác suất của chính sách mới chia xác suất của chính sách cũ, rồi <b>cắt</b> ở mức $c$. Minh hoạ: chính sách cũ chọn một video với xác suất 0,01, chính sách mới 0,05:</p>
          $$\min\left(\frac{0{,}05}{0{,}01},\ c\right) = \min(5,\ c) \qquad c = 3 \Rightarrow \hlg{3}, \qquad c = 5 \Rightarrow 5$$
          <p class="note">Bài báo đo: hệ đang chạy dùng $c = 3$; nới lên $c = 5$ làm thời gian xem <b>giảm 0,52%</b> — trọng số lớn khiến mô hình học quá mức vài lượt may mắn. Học cả trang 16 gợi ý cùng lúc (thay vì chỉ gợi ý đầu) tăng 0,85%.</p>
        introduces: [min_fn, implies]
        focus: [1, 1, 2, 3, 3, 3]
        say: "Cách sửa thiên lệch dữ liệu cũ là trọng số nghịch đảo như bài 10, bằng xác suất của chính sách mới chia xác suất của chính sách cũ, rồi cắt ở mức c. Minh hoạ, chính sách cũ chọn một video với xác suất 0 phẩy 01, chính sách mới với 0 phẩy 05, nên tỉ số bằng 5. Lấy số nhỏ hơn giữa 5 và c, với c bằng 3 thì trọng số còn 3, với c bằng 5 thì giữ nguyên 5. Bài báo đo rằng hệ đang chạy dùng c bằng 3, còn nới lên 5 làm thời gian xem giảm 0 phẩy 52 phần trăm. Lý do là trọng số lớn khiến mô hình học quá mức vài lượt may mắn. Học cả trang 16 gợi ý cùng lúc thì thời gian xem tăng 0 phẩy 85 phần trăm."
      - show: |
          <div class="box key"><b>Thực hành tốt:</b> khám phá trên một <b>nhóm nhỏ, có đo</b>, bằng lấy mẫu theo chính mô hình chứ không chọn bừa; trọng số sửa thiên lệch <b>luôn có cắt</b>, và mức cắt cũng được thử trực tuyến. <b>Điều kiện:</b> phần tăng nhỏ (0,07%) chỉ có ý nghĩa khi có đủ người dùng để phát hiện nó.</div>
        say: "Thực hành tốt ở chặng này là khám phá trên một nhóm nhỏ và có đo, bằng cách lấy mẫu theo chính mô hình chứ không chọn bừa. Trọng số sửa thiên lệch luôn có cắt, và chính mức cắt cũng được thử trực tuyến. Điều kiện là phần tăng nhỏ như 0 phẩy 07 phần trăm chỉ có ý nghĩa khi có đủ người dùng để phát hiện được nó."

  - id: stage5
    kind: example
    title: "Chặng 5, năm 2019 — ổn định và phát triển: thêm nguồn đề cử"
    stage: {year: "2019", scale: "kho hàng chục triệu video; hàng tỉ lượt bấm mỗi ngày; chỉ mục khoảng 10 triệu video làm lại mỗi vài giờ, phủ hơn 90% ví dụ học", source: "[YI19]", practice: "mở rộng bằng cách THÊM một nguồn đề cử chạy cạnh các nguồn cũ và thử nghiệm hai nhóm cho nó; học tuần tự theo ngày, làm lại chỉ mục mỗi vài giờ; sửa thiên lệch phổ biến của mẫu âm trong lô bằng cách trừ lôgarit tần suất"}
    checks:
      - "round(-math.log(0.02), 3) == 3.912 and round(math.log(50), 3) == 3.912 and 1 / 50 == 0.02"
      - "round(2 - math.log(0.02), 3) == 5.912 and round(2 - math.log(0.5), 3) == 2.693"
      - "round(0.37 / 0.20, 2) == 1.85"
    steps:
      - show: |
          <p><b>Ổn định: mở rộng bằng cách thêm, không thay.</b> Tầng đề cử có <b>nhiều nguồn</b>, mỗi nguồn sinh hàng trăm video; nhóm kỹ sư năm 2019 xây <b>thêm một nguồn</b> bằng mạng hai tháp và thử nghiệm hai nhóm cho riêng nó [YI19].</p>
          <table class="t"><tr><th>nhịp vận hành (bài báo ghi)</th><th>con số</th></tr>
          <tr><td>dữ liệu học mới</td><td>mỗi ngày; học tuần tự từ cũ tới mới, rồi chờ ngày kế tiếp</td></tr>
          <tr><td>chỉ mục cho tìm gần đúng</td><td>khoảng 10 triệu video, làm lại mỗi vài giờ, phủ hơn 90% ví dụ học</td></tr>
          <tr><td>thử trực tuyến (nguồn mới thêm vào đề cử)</td><td>chỉ số tương tác +0,37% (có sửa), +0,20% (không sửa)</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Chặng năm là ổn định và tiếp tục phát triển, tầng đề cử đã có nhiều nguồn, mỗi nguồn sinh hàng trăm video. Năm 2019, nhóm kỹ sư xây thêm một nguồn bằng mạng hai tháp và thử nghiệm hai nhóm cho riêng nó, thay vì thay cả hệ. Dữ liệu học mới đến mỗi ngày, mô hình học tuần tự từ cũ tới mới rồi chờ ngày kế tiếp. Chỉ mục khoảng 10 triệu video được làm lại mỗi vài giờ và phủ hơn 90 phần trăm ví dụ học. Thêm nguồn mới có sửa thiên lệch tăng chỉ số tương tác 0 phẩy 37 phần trăm, không sửa chỉ được 0 phẩy 20."
      - clear: true
        show: |
          <p><b>Sửa gì?</b> Mạng hai tháp học bằng cách dùng các video khác <b>trong cùng lô</b> làm mẫu âm — video phổ biến hay có mặt trong lô nên bị phạt quá tay, đúng thiên lệch phổ biến ở bài 8. Cách sửa: trừ lôgarit của xác suất $p$ mà video có mặt trong lô:</p>
          $$s^{\text{sửa}} = s - \ln p \qquad \text{cứ 50 bước gặp một lần: } p = \frac{1}{50} = 0{,}02,\ -\ln 0{,}02 \approx \hlb{3{,}912}$$
          <p class="note">Hai video cùng điểm thô $s = 2$ (minh hoạ): video hiếm $p = 0{,}02$ thành $2 + 3{,}912 = 5{,}912$; video phổ biến $p = 0{,}5$ chỉ thành $2 + 0{,}693 = 2{,}693$.</p>
        introduces: [log]
        focus: [1, 1, 2, 3]
        say: "Vậy sửa gì, mạng hai tháp dùng các video khác trong cùng lô làm mẫu âm. Video phổ biến hay có mặt trong lô nên bị phạt quá tay, đúng thiên lệch phổ biến ở bài 8, và cách sửa là trừ lôgarit của xác suất p mà video có mặt trong lô. Bài báo lấy ví dụ cứ 50 bước gặp một lần thì p bằng 0 phẩy 02, và trừ lôgarit của 0 phẩy 02 nghĩa là cộng thêm khoảng 3 phẩy 912. Với hai video cùng điểm thô bằng 2, một số minh hoạ, video hiếm thành 5 phẩy 912, còn video phổ biến với p bằng 0 phẩy 5 chỉ thành 2 phẩy 693."
      - show: |
          <div class="box key"><b>Thực hành tốt khi đã rất lớn:</b> thay đổi theo từng <b>mô-đun</b> (một nguồn đề cử mới), mỗi mô-đun có thử nghiệm hai nhóm riêng; dữ liệu và chỉ mục có <b>nhịp cập nhật</b> cố định (ngày, vài giờ); sửa thiên lệch ngay trong hàm mất mát. <b>Điều kiện:</b> chỉ đáng làm khi kho đổi nhanh — kho ít đổi thì học lại hằng tuần có thể là đủ.</div>
        say: "Thực hành tốt khi hệ đã rất lớn là thay đổi theo từng mô đun, như một nguồn đề cử mới, và mỗi mô đun có thử nghiệm hai nhóm riêng. Dữ liệu và chỉ mục có nhịp cập nhật cố định theo ngày và theo vài giờ, còn thiên lệch được sửa ngay trong hàm mất mát. Điều kiện là việc này chỉ đáng làm khi kho đổi nhanh, kho ít đổi thì học lại hằng tuần có thể là đủ."

  - id: check
    kind: check
    title: "Tự kiểm các con số của hành trình theo đường khác"
    checks:
      - "7 * 1440 == 10080 and 1440 == 60 * 24"
      - "abs(-math.log(1 / 50) - math.log(50)) < 1e-12 and round(math.log(2) + 2 * math.log(5), 3) == 3.912"
      - "10 ** 6 * 1024 == 1024000000 and 256 * 4 == 1024"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường thứ nhất</th><th>đường khác</th></tr>
          <tr><td>giờ video mỗi ngày (2008)</td><td>$7 \cdot 60 \cdot 24$</td><td>$7 \cdot 1440 = 10\,080$ (một ngày có 1440 phút) ✓</td></tr>
          <tr><td>bảng vector (2016)</td><td>$10^6 \cdot 256 \cdot 4$</td><td>mỗi video $256 \cdot 4 = 1024$ byte, nhân 1 triệu video ✓</td></tr>
          <tr><td>điểm cộng thêm (2019)</td><td>$-\ln 0{,}02$</td><td>$\ln 50 = \ln 2 + 2 \ln 5 \approx 0{,}693 + 3{,}219 = 3{,}912$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại ba con số bằng đường khác. Giờ video mỗi ngày năm 2008 tính bằng 7 nhân 1440, vì một ngày có 1440 phút, cũng ra 10 nghìn 080, khớp. Bảng vector năm 2016 tính từng video trước, 256 số nhân 4 byte là 1024 byte, nhân 1 triệu video ra 1 tỉ 024 triệu byte, khớp. Điểm cộng thêm năm 2019 là lôgarit của 50, bằng lôgarit của 2 cộng hai lần lôgarit của 5, khoảng 0 phẩy 693 cộng 3 phẩy 219, ra 3 phẩy 912, khớp."

  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc lịch sử"
    checks:
      - "20000 * 64 == 1280000 and 1280000 / 1e9 * 1000 == 1.28"
      - "0.24 > 0.01 > -0.07"
    steps:
      - show: |
          <div class="box warn"><b>Bài học sai 1.</b> “Muốn gợi ý tốt thì dựng ngay hai tầng mạng nơ-ron như YouTube” <b class="red">(chép quy mô của người khổng lồ)</b>
          <br><span class="note">Chặng 1 của chính hành trình này bắt đầu bằng đếm cùng xem và đường cơ sở “phổ biến nhất”.</span></div>
          $$\text{cửa hàng } 20\,000 \text{ sản phẩm, vector 64 chiều: } 20\,000 \cdot 64 = 1\,280\,000 \text{ phép nhân} \approx 1{,}28 \text{ ms (minh hoạ)}$$
        focus: [1, 2, 1]
        say: "Bài học sai thứ nhất là muốn gợi ý tốt thì dựng ngay hai tầng mạng nơ ron như YouTube, tức chép quy mô của người khổng lồ. Cửa hàng 20 nghìn sản phẩm với vector 64 chiều chỉ cần 1 phẩy 28 triệu phép nhân để chấm hết, khoảng 1 phẩy 28 mi li giây, một số minh hoạ. Chính hành trình này cũng bắt đầu bằng đếm cùng xem và đường cơ sở phổ biến nhất."
      - show: |
          <div class="box warn"><b>Bài học sai 2.</b> “Mỗi thế hệ mới thay hẳn thế hệ cũ” <b class="red">(năm 2016 vẫn trộn ứng viên từ nguồn khác; năm 2019 vẫn nhiều nguồn đề cử)</b>
          <br><span class="note">Hệ lớn tiến hoá bằng cách <b>thêm</b> một nguồn rồi đo, không đập đi xây lại.</span></div>
        say: "Bài học sai thứ hai là nghĩ mỗi thế hệ mới thay hẳn thế hệ cũ. Bài báo năm 2016 vẫn trộn ứng viên từ các nguồn khác, và năm 2019 tầng đề cử vẫn có nhiều nguồn chạy song song. Hệ lớn tiến hoá bằng cách thêm một nguồn rồi đo, không đập đi xây lại."
      - clear: true
        show: |
          <div class="box warn"><b>Bài học sai 3.</b> “Chỉ số ngoại tuyến tăng là xong” <b class="red">(cả bài báo 2016 lẫn 2019 đều ghi ngoại tuyến và trực tuyến có lúc lệch nhau)</b>
          <br><span class="note">Ví dụ ở chặng 3: thêm vị trí làm đặc trưng nghe hợp lý, nhưng trực tuyến cho −0,07%; chỉ tháp nông mới +0,24%. Quyết định bằng thử nghiệm hai nhóm.</span></div>
        say: "Bài học sai thứ ba là chỉ số ngoại tuyến tăng là xong, trong khi cả bài báo năm 2016 lẫn năm 2019 đều ghi hai loại chỉ số có lúc lệch nhau. Ở chặng ba, thêm vị trí làm đặc trưng nghe hợp lý, nhưng trực tuyến lại cho âm 0 phẩy 07 phần trăm, chỉ tháp nông mới tăng 0 phẩy 24. Vì vậy quyết định cuối cùng luôn là thử nghiệm hai nhóm."
      - show: |
          <div class="box warn"><b>Bài học sai 4.</b> “Khám phá là cứ thỉnh thoảng gợi ý ngẫu nhiên” <b class="red">(bài báo 2019 ghi cách chọn bừa không khả thi ở hệ thật)</b>
          <br><span class="note">Họ lấy mẫu theo xác suất của chính mô hình, chỉ trên 5% người dùng, có đo — và cắt trọng số khi học từ dữ liệu đó.</span></div>
        say: "Bài học sai thứ tư là nghĩ khám phá chỉ là thỉnh thoảng gợi ý ngẫu nhiên, trong khi bài báo năm 2019 ghi cách chọn bừa không khả thi ở hệ thật. Họ lấy mẫu theo xác suất của chính mô hình, chỉ trên 5 phần trăm người dùng, có đo, và cắt trọng số khi học từ dữ liệu đó."

  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "20000 * 64 / 1e9 * 1000 == 1.28 and 2 * 10 ** 6 * 64 / 1e9 * 1000 == 128"
      - "alg.irs_ivf_cost(2 * 10 ** 6, 1414, 10) < 2 * 10 ** 6 / 50"
    steps:
      - show: |
          <p>Bạn phụ trách gợi ý cho một cửa hàng: <b>20&nbsp;000</b> sản phẩm, <b>50&nbsp;000</b> lượt khách mỗi ngày, <b>1</b> kỹ sư, ngân sách 50 mi li giây (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Chọn: (a) cùng xem + phổ biến nhất, chấm hết bằng vector; hay (b) hai tầng có tìm láng giềng gần đúng, như năm 2016?</td></tr>
          <tr><td>2</td><td>Khi nào bạn đổi lựa chọn? Tính cho kho 2 triệu sản phẩm.</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định cho một cửa hàng 20 nghìn sản phẩm, 50 nghìn lượt khách mỗi ngày, một kỹ sư, ngân sách 50 mi li giây, đều là số minh hoạ. Câu một, chọn cách a, cùng xem cộng phổ biến nhất và chấm hết bằng vector, hay cách b, hai tầng có tìm láng giềng gần đúng như năm 2016. Câu hai, khi nào bạn đổi lựa chọn, hãy tính cho kho 2 triệu sản phẩm. Dừng video lại và viết ra giấy nhé."
        pause: 25
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>được</th><th>mất</th></tr>
          <tr><td>(a) cùng xem + phổ biến, chấm hết</td><td>chấm hết $20\,000 \cdot 64$ phép nhân ≈ 1,28 ms, $\hlg{\text{độ phủ đúng bằng 1}}$; một người làm và hiểu được; có sẵn đường cơ sở</td><td>khó gợi ý sản phẩm mới chưa ai xem; ít cá nhân hoá</td></tr>
          <tr><td>(b) hai tầng, tìm gần đúng</td><td>cá nhân hoá sâu, chịu được kho rất lớn</td><td>phải vận hành chỉ mục, học lại, đo độ phủ; với 20&nbsp;000 sản phẩm thì tìm gần đúng chỉ thêm rủi ro sót</td></tr></table>
          <p class="note">Chọn (a), thêm một nhóm nhỏ khám phá cho sản phẩm mới (bài 9), và đo bằng độ chuẩn xác ở k kết quả đầu trên nhật ký “học quá khứ, thử tương lai” như năm 2008.</p>
        focus: [0, "1.2", "1.3", 2, 2]
        say: "Đáp án câu một, so được và mất của hai cách. Cách a chấm hết chỉ khoảng 1 phẩy 28 mi li giây với độ phủ đúng bằng 1, một người làm được, nhưng khó gợi ý sản phẩm mới chưa ai xem. Cách b cá nhân hoá sâu và chịu được kho rất lớn, nhưng phải vận hành chỉ mục, học lại và đo độ phủ. Với 20 nghìn sản phẩm, tìm gần đúng chỉ thêm rủi ro sót, nên ta chọn cách a, kèm một nhóm nhỏ khám phá cho sản phẩm mới như bài 9. Hãy đo bằng độ chuẩn xác ở k kết quả đầu trên nhật ký, học quá khứ và thử tương lai như năm 2008."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: kho 2 triệu sản phẩm</th><th>phép tính</th><th>so với ngân sách 50 ms</th></tr>
          <tr><td>chấm hết</td><td>$2 \cdot 10^6 \cdot 64 = 128$ triệu phép nhân ≈ $\hl{128}$ ms</td><td>vượt</td></tr>
          <tr><td>chia cụm như bài 3 (1414 cụm, xét 10)</td><td>$1414 + 10 \cdot \frac{2 \cdot 10^6}{1414} \approx 15\,558$ phép so</td><td>vừa, nhưng phải đo độ phủ</td></tr></table>
          <p class="note">Đổi sang hai tầng khi <b>chấm hết vượt ngân sách</b> hoặc khi sản phẩm mới đến nhanh hơn khả năng học lại; khi đổi, giữ nguồn cũ làm một nguồn đề cử và thử nghiệm hai nhóm cho nguồn mới.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Câu hai, với kho 2 triệu sản phẩm, chấm hết tốn 128 triệu phép nhân, khoảng 128 mi li giây, vượt ngân sách 50 mi li giây. Chia cụm như bài 3 với 1414 cụm và xét 10 cụm chỉ tốn khoảng 15 nghìn 558 phép so, vừa ngân sách nhưng phải đo độ phủ. Vậy điều kiện để đổi sang hai tầng là chấm hết vượt ngân sách, hoặc sản phẩm mới đến nhanh hơn khả năng học lại. Khi đổi, giữ cách cũ làm một nguồn đề cử và thử nghiệm hai nhóm cho nguồn mới, đúng như hành trình đã làm."

  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2008: cùng xem, thử trên nhật ký cũ</span><span class="a">→</span>
          <span class="n">2016: hai tầng, phản hồi ngầm có trọng số</span><span class="a">→</span>
          <span class="n">2019: tách thiên lệch vị trí</span><span class="a">→</span>
          <span class="n">2019: khám phá nhỏ, cắt trọng số</span><span class="a">→</span>
          <span class="n">2019: thêm nguồn, học lại mỗi ngày</span></div>
        say: "Tổng kết lại, năm 2008 hệ bắt đầu bằng đếm cùng xem và thử trên nhật ký cũ. Năm 2016 là hai tầng với phản hồi ngầm có trọng số thời gian xem. Năm 2019 hệ tách thiên lệch vị trí, khám phá trên một nhóm nhỏ với trọng số có cắt, rồi tiếp tục lớn bằng cách thêm nguồn đề cử và học lại mỗi ngày."
      - show: |
