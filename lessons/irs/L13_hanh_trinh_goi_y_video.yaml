    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa trong bài</th></tr>
          <tr><td><b>quy mô</b></td><td>số video, số người dùng, lượng nhật ký lúc đó — chỉ lấy con số bài báo ghi</td></tr>
          <tr><td><b>điểm nghẽn</b></td><td>chỗ hỏng hoặc chậm đầu tiên khi quy mô tăng</td></tr>
          <tr><td><b>nguồn đề cử</b></td><td>một bộ sinh ứng viên; hệ lớn có nhiều nguồn chạy song song</td></tr>
          <tr><td><b>thử nghiệm hai nhóm trực tuyến</b></td><td>chia người dùng thật thành nhóm đối chứng và nhóm thử, so chỉ số (khoá Khoa học dữ liệu)</td></tr>
          <tr><td><b>thực hành tốt</b></td><td>cách xử lý đã kiểm chứng, kèm <b>điều kiện</b> áp dụng</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng có năm thuật ngữ của hành trình, quy mô là số video, số người dùng và lượng nhật ký lúc đó, và ta chỉ lấy con số bài báo ghi. Điểm nghẽn là chỗ hỏng hoặc chậm đầu tiên khi quy mô tăng. Nguồn đề cử là một bộ sinh ứng viên, và hệ lớn có nhiều nguồn chạy song song. Thử nghiệm hai nhóm trực tuyến chia người dùng thật thành nhóm đối chứng và nhóm thử rồi so chỉ số, như ở khoá Khoa học dữ liệu. Thực hành tốt là cách xử lý đã được kiểm chứng, luôn kèm điều kiện áp dụng."

