# Quy ước: mọi sự kiện và con số quy mô CHỈ lấy từ câu trích ở audit/irs/sources_L13.md (nhãn [BA08] … [YI19]); con số tự đặt ghi
#   “minh hoạ”. Không nêu tên cá nhân trong lời đọc: nói “nhóm kỹ sư của công ty”, “bài báo năm …”. YouTube đọc theo luật “Diu-túp”
#   (dò 7/8, như NET). Thuật ngữ: “nguồn đề cử” = một bộ sinh ứng viên; “thử nghiệm hai nhóm trực tuyến” = A/B (DSC bài 8);
#   “tháp nông” = nhánh mạng nhỏ chỉ nhận đặc trưng gây thiên lệch. Bài này là bài cuối: không hẹn “bài sau”.
#   Chặng 2010 (Davidson và cộng sự, RecSys 2010) KHÔNG dạy: không đọc được nguyên văn (NOT_VERIFIED, ghi ở sources_L13.md).
objectives:
  - "Kể lại năm chặng 2008 → 2016 → 2019 của hệ gợi ý video: đồ thị cùng xem, hai mạng sinh ứng viên và xếp hạng, khử thiên lệch vị trí, khám phá có kiểm soát, thêm nguồn đề cử cập nhật hằng ngày"
  - "Tính lại con số then chốt của từng chặng bằng kiến thức của khoá"
  - "Chọn kiến trúc gợi ý cho quy mô của mình, kèm điều kiện đổi lựa chọn"
