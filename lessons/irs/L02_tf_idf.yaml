  kind: symbol
  title: 'Giải mã: tần suất tf, số văn bản chứa từ df, độ hiếm idf'
  checks:
  - '[''máy'', ''ổ'', ''máy''].count(''máy'') == 2 and sum(''máy'' in d for d in [[''máy'', ''ổ'', ''máy''], [''máy'',
    ''pin''], [''máy'', ''pin'', ''màn'']]) == 3'
  steps:
