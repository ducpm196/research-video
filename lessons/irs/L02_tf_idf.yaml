      <p>Hệ đếm từ chung, so bằng cosin của các vector đếm: d1 được <b>0,632</b> — chỉ vì có chữ “máy” hai lần,
      dù d1 nói về ổ cứng.</p>

      <div class="box key">Hôm nay ta trả lời: biến văn bản thành vector thế nào? Từ nào đáng tin hơn từ nào?
      Và xếp hạng bằng góc giữa hai vector ra sao?</div>

      '
    focus:
