  - id: formula
    kind: formula
    title: "Suy ra trọng số và điểm trong bốn bước"
    checks:
      - "math.log(3 / 3) == 0 and round(math.log(3 / 1), 3) == 1.099"
      - "round(2 * math.log(3 / 3), 3) == 0 and round(1 * math.log(3 / 1), 3) == 1.099"
      - "[round(x, 3) for x in alg.irs_tfidf([['máy', 'ổ', 'máy'], ['máy', 'pin'], ['máy', 'pin', 'màn']], ['máy', 'ổ', 'pin', 'màn'])[1][0]] == [0, 1.099, 0, 0]"
    steps:
      - show: |
          <p><b>Bước 1 — độ hiếm.</b> Một từ có ở mọi văn bản không giúp phân biệt văn bản nào, nên ta cần một số bằng 0 khi $\text{df}_t = N$ và lớn dần khi từ hiếm đi. Lôgarit của tỉ số làm đúng việc đó:</p>
          $$\text{idf}_t = \ln \frac{N}{\text{df}_t} \qquad \text{idf}_{\text{máy}} = \ln \frac{3}{3} = \ln 1 = \hl{0}, \quad \text{idf}_{\text{ổ}} = \ln \frac{3}{1} \approx \hlg{1{,}099}$$
        focus: [1, 1, 2]
        say: "Bước một là độ hiếm, một từ có ở mọi văn bản thì không giúp phân biệt văn bản nào. Vì vậy ta cần một số bằng 0 khi d f bằng N và lớn dần khi từ hiếm đi, và lôgarit của tỉ số N chia d f làm đúng việc đó. Làm thử, từ máy có ở cả 3 văn bản nên độ hiếm bằng lôgarit của 1, bằng 0, còn từ ổ chỉ có ở 1 văn bản nên được lôgarit của 3, khoảng 1 phẩy 099."
      - show: |
          <p><b>Bước 2 — trọng số.</b> Từ lặp nhiều trong văn bản thì văn bản nói nhiều về nó, nên nhân tần suất với độ hiếm:</p>
          $$w_{t,d} = \text{tf}_{t,d} \cdot \text{idf}_t \qquad \text{d1: } w_{\text{máy}} = 2 \cdot 0 = 0, \quad w_{\text{ổ}} = 1 \cdot 1{,}099 = 1{,}099$$
        focus: [1, 2]
        say: "Bước hai là trọng số, từ lặp nhiều trong văn bản thì văn bản nói nhiều về nó, nên ta nhân tần suất với độ hiếm, gọi là trọng số w. Làm thử với d1, từ máy có 2 lần nhưng độ hiếm 0 nên trọng số bằng 0, còn từ ổ có 1 lần nhân 1 phẩy 099, được 1 phẩy 099."
      - clear: true
        show: |
          <p><b>Bước 3 — vector.</b> Xếp trọng số theo thứ tự bộ từ (máy, ổ, pin, màn), mỗi văn bản thành một vector 4 thành phần:</p>
          $$\text{d1} = (0;\ 1{,}099;\ 0;\ 0)$$
          <p class="note">Câu hỏi cũng là một văn bản ngắn, nên được biến thành vector theo cùng cách.</p>
        focus: [1, 2, 3]
        say: "Bước ba, ta xếp các trọng số theo đúng thứ tự bộ từ máy, ổ, pin, màn, nên mỗi văn bản thành một vector bốn thành phần. Văn bản d1 thành vector 0, 1 phẩy 099, 0, 0. Câu hỏi cũng chỉ là một văn bản ngắn, nên được biến thành vector theo cùng cách đó."
      - show: |
          <p><b>Bước 4 — điểm.</b> Văn bản hợp câu hỏi khi hai mũi tên cùng hướng, nên điểm là cosin của góc giữa chúng:</p>
          $$\text{điểm}(q, d) = \cos(q, d) = \frac{q \cdot d}{\lVert q \rVert \, \lVert d \rVert}$$
          <p class="note">Xếp các văn bản theo điểm giảm dần. Vì mọi trọng số đều không âm, điểm luôn từ 0 đến 1 (nếu vector câu hỏi toàn 0, như chỉ gõ “máy”, thì phải quy ước điểm 0).</p>
        focus: [1, 2, 3]
        say: "Bước bốn là điểm, văn bản hợp câu hỏi khi hai mũi tên cùng hướng, nên điểm là cosin của góc giữa vector câu hỏi q và vector văn bản d. Theo công thức đã ôn, đó là tích vô hướng chia tích hai độ dài. Ta xếp các văn bản theo điểm giảm dần, và vì mọi trọng số đều không âm, điểm luôn nằm từ 0 đến 1, trừ khi vector câu hỏi toàn số 0 thì phải quy ước điểm 0."

  - id: example
