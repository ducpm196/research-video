      <br><span class="note">Cách 1: bỏ từ đó khỏi vector câu hỏi — không văn bản nào chứa nó, nên nó không góp
      vào tích vô hướng nào. Cách 2: dùng cho mọi từ một công thức làm trơn, cộng 1 vào cả tử và mẫu, $\ln \frac{N
      + 1}{\text{df} + 1}$: “sạc” được $\ln \frac{4}{1} \approx 1{,}386$, “máy” vẫn được $\ln \frac{4}{4} = 0$.</span></div>

      '
    say: Lỗi thứ hai là câu hỏi có một từ kho chưa từng gặp, như chữ sạc. Khi đó d f bằng 0, lôgarit của 3 chia
      0 không xác định, và chương trình chia cho 0. Cách thứ nhất là bỏ từ đó khỏi vector câu hỏi, vì không văn
      bản nào chứa nó nên nó không góp vào tích vô hướng nào. Cách thứ hai là dùng cho mọi từ một công thức làm
      trơn, cộng thêm 1 vào cả tử và mẫu. Khi đó chữ sạc được lôgarit của 4 chia 1, khoảng 1 phẩy 386, còn chữ
      máy vẫn được lôgarit của 4 chia 4, bằng 0.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tính độ hiếm một lần rồi giữ mãi <b class="red">(thêm
      7 văn bản “bàn phím”: “máy” từ 0 thành 1,204)</b></div>

      <table class="t"><tr><th>từ</th><th>kho 3 văn bản</th><th>kho 10 văn bản</th></tr>

      <tr><td>máy</td><td>$\ln \frac{3}{3} = 0$</td><td>$\ln \frac{10}{3} \approx 1{,}204$</td></tr>

      <tr><td>pin</td><td>$\ln \frac{3}{2} \approx 0{,}405$</td><td>$\ln \frac{10}{2} \approx 1{,}609$</td></tr></table>

      <p class="note">“Từ có ở mọi nơi” chỉ đúng trong một kho cụ thể. Kho đổi thì phải tính lại độ hiếm và mọi
      vector đã lưu.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 3
    say: Lỗi thứ ba hay gặp ở người đã đi làm, là tính độ hiếm một lần rồi giữ mãi. Thêm 7 văn bản bàn phím vào
      kho, chữ máy từ độ hiếm 0 thành lôgarit của 10 chia 3, khoảng 1 phẩy 204. Chữ pin cũng đổi từ 0 phẩy 405
      thành lôgarit của 5, khoảng 1 phẩy 609. Một từ có ở mọi nơi chỉ đúng trong một kho cụ thể, nên kho đổi thì
      phải tính lại độ hiếm và mọi vector đã lưu.
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tin rằng cosin chống được nhồi từ khoá <b class="red">(“pin
      pin pin pin pin” được 1, hơn hẳn d3 thật: 0,346)</b>

      <br><span class="note">Cosin chỉ chống văn bản dài lặp lại chính nó. Văn bản chỉ gồm từ khoá thì trùng hướng
      câu hỏi.</span></div>

      '
    say: Lỗi thứ tư cũng của người đã đi làm, là tin rằng cosin chống được nhồi từ khoá. Văn bản pin pin pin pin
      pin được cosin bằng 1 với câu hỏi pin, hơn hẳn văn bản d3 thật chỉ được 0 phẩy 346. Cosin chỉ chống văn
      bản dài lặp lại chính nó, còn văn bản chỉ gồm từ khoá thì trùng hướng câu hỏi.
  - clear: true
    show: '<p><b>Bão hòa tần suất</b> làm cái lợi của việc lặp từ tăng chậm dần: thay số lần lặp tf bằng $\frac{\text{tf}}{\text{tf}
      + 1}$ (dạng đơn giản, hằng số 1 là số minh hoạ).</p>

      <table class="t"><tr><th>tf</th><th>1</th><th>2</th><th>5</th><th>100</th></tr>

      <tr><td>$\frac{\text{tf}}{\text{tf} + 1}$</td><td>0,5</td><td>≈ 0,667</td><td>≈ 0,833</td><td>≈ 0,990</td></tr></table>

      <p class="note">Lặp 5 lần chỉ được gấp ≈ 1,67 lần một lần (0,833 chia 0,5), không gấp 5: lợi ích bị giới
      hạn, không bao giờ vượt 1. Nhưng lặp thêm vẫn được cộng một chút, nên nhồi từ khoá chưa bị chặn hẳn; hệ
      thật cần thêm tín hiệu khác.</p>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - 3
    - 3
    say: Công thức xếp hạng có bão hòa làm cái lợi của việc lặp từ tăng chậm dần. Nó thay số lần lặp t f bằng
      t f chia cho t f cộng 1, với hằng số 1 chọn để minh hoạ. Lặp 1 lần được 0 phẩy 5, lặp 2 lần được khoảng
      0 phẩy 667, lặp 5 lần khoảng 0 phẩy 833, và lặp 100 lần cũng chỉ khoảng 0 phẩy 990, không bao giờ vượt 1.
      Vậy lặp 5 lần chỉ được gấp khoảng 1 phẩy 67 lần so với một lần, chứ không gấp 5, nên lợi ích của việc lặp
      từ bị giới hạn. Nhưng mỗi lần lặp thêm vẫn được cộng một chút, nên nhồi từ khoá chưa bị chặn hẳn, và hệ
