    - 3
    say: Chào bạn, kho có ba văn bản đồ chơi, d1 là máy ổ máy, d2 là máy pin, d3 là máy pin màn, và người dùng
      gõ máy pin. Một hệ đơn giản chỉ đếm từ rồi so bằng cosin, và d1 được tới 0 phẩy 632, chỉ vì có chữ máy hai
      lần dù d1 nói về ổ cứng. Hôm nay ta trả lời ba câu hỏi, biến văn bản thành vector thế nào, từ nào đáng tin
      hơn từ nào, và xếp hạng bằng góc giữa hai vector ra sao.
- id: prereq
  kind: prereq
  title: 'Trước hết: lôgarit tự nhiên, tích vô hướng, độ dài và cosin'
  checks:
  - math.log(1) == 0 and round(math.log(3), 3) == 1.099 and round(math.log(1.5), 3) == 0.405
  - math.exp(0) == 1 and math.log(math.e) == 1 and round(math.e, 3) == 2.718 and round(math.exp(1.099), 3) ==
    3.001
  - 1 * 2 + 2 * 3 + 0 * 1 == 8 and 1 ** 2 + 2 ** 2 + 0 ** 2 == 5 and 2 ** 2 + 3 ** 2 + 1 ** 2 == 14
  - round(math.sqrt(5), 3) == 2.236 and round(math.sqrt(14), 3) == 3.742 and math.sqrt(3 ** 2 + 4 ** 2) == 5
  - round(8 / (2.236 * 3.742), 3) == 0.956 and round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956
  - 1 * 2 + 2 * 4 + 0 * 0 == 10 and round(math.sqrt(5) * math.sqrt(20), 9) == 10 and abs(alg.cosine([1, 2, 0],
    [2, 4, 0]) - 1) < 1e-12 and alg.cosine([1, 0], [0, 1]) == 0
  steps:
  - show: '<p><b>① Lôgarit tự nhiên.</b> $\ln x$ trả lời câu hỏi: phải nâng số $e \approx 2{,}718$ (một hằng số
      cố định của toán học) lên mũ mấy để được $x$?</p>

      <table class="t"><tr><th>$x$</th><th>1</th><th>1,5</th><th>$e \approx 2{,}718$</th><th>3</th></tr>

      <tr><td>$\ln x$</td><td>0 (vì $e^0 = 1$)</td><td>≈ 0,405</td><td>1</td><td>≈ 1,099</td></tr></table>

      <p class="note">Thử lại: $e^{1{,}099} \approx 3{,}001$, gần đúng 3. Số trong ngoặc bằng 1 thì lôgarit bằng
      0; khi số lớn hơn thì lôgarit tăng theo nhưng tăng chậm.</p>

      '
    introduces:
    - log
    - approx
    - exp
    - power
    focus:
    - 1
    - 1
    - '2.2'
    - 3
    - 3
    say: Điều thứ nhất là lôgarit tự nhiên, viết hai chữ l n, và nhắc lại từ đầu, lôgarit tự nhiên của x trả lời
      câu hỏi phải nâng số e lên mũ mấy để được x. Số e là một hằng số cố định của toán học, khoảng 2 phẩy 718.
      Bảng cho lôgarit của 1 bằng 0, vì e mũ 0 bằng 1, lôgarit của 1 phẩy 5 khoảng 0 phẩy 405, lôgarit của e bằng
      đúng 1, và lôgarit của 3 khoảng 1 phẩy 099. Thử lại, e mũ 1 phẩy 099 xấp xỉ 3 phẩy 001, gần đúng bằng 3.
      Số trong ngoặc bằng 1 thì lôgarit bằng 0, khi số lớn dần thì lôgarit tăng theo nhưng với tốc độ chậm lại.
  - clear: true
    show: '<p><b>② Vector, tích vô hướng và độ dài.</b> Một vector ở đây chỉ là một dãy số viết theo thứ tự, như
      $u = (1, 2, 0)$ và $v = (2, 3, 1)$.</p>

      <table class="t"><tr><th>phép</th><th>cách làm</th><th>với $u$, $v$</th></tr>

      <tr><td>tích vô hướng $u \cdot v$</td><td>nhân từng cặp cùng vị trí rồi cộng</td><td>$1 \cdot 2 + 2 \cdot
      3 + 0 \cdot 1 = 8$</td></tr>

      <tr><td>độ dài $\lVert u \rVert$</td><td>căn của tổng bình phương</td><td>$\sqrt{1^2 + 2^2 + 0^2} = \sqrt{5}
      \approx 2{,}236$</td></tr>

      <tr><td>độ dài $\lVert v \rVert$</td><td>như trên</td><td>$\sqrt{4 + 9 + 1} = \sqrt{14} \approx 3{,}742$</td></tr></table>

      <p class="note">Độ dài chính là cạnh huyền của tam giác vuông: mũi tên $(3, 4)$ dài $\sqrt{9 + 16} = 5$.</p>

      '
    introduces:
    - cdot
    - norm
    - sqrt
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    - - '2.3'
      - '2.4'
    - 3
    say: Điều thứ hai, một vector ở đây chỉ là một dãy số viết theo thứ tự, ví dụ u là 1, 2, 0 và v là 2, 3, 1.
      Tích vô hướng của u và v, viết bằng một dấu chấm giữa, là nhân từng cặp số cùng vị trí rồi cộng lại. Ở đây
      là 1 nhân 2, cộng 2 nhân 3, cộng 0 nhân 1, bằng 8. Độ dài của một vector, viết giữa hai cặp vạch đứng, là
      căn của tổng bình phương các thành phần. Vector u dài căn 5, khoảng 2 phẩy 236, còn vector v dài căn của
      4 cộng 9 cộng 1, tức căn 14, khoảng 3 phẩy 742. Đây chính là cạnh huyền của tam giác vuông, chẳng hạn mũi
      tên 3, 4 dài căn của 9 cộng 16, bằng 5.
  - clear: true
    show: '<p><b>③ Cosin của hai vector</b> đo hai mũi tên <b>cùng hướng tới đâu</b>, không quan tâm mũi tên dài
      hay ngắn:</p>

      $$\cos(u, v) = \frac{u \cdot v}{\lVert u \rVert \, \lVert v \rVert} = \frac{8}{2{,}236 \cdot 3{,}742} \approx
      0{,}956$$

      <table class="t"><tr><th>hai mũi tên</th><th>góc</th><th>cosin</th></tr>

      <tr><td>cùng hướng: $(1, 2, 0)$ và $(2, 4, 0)$</td><td>0°</td><td>$\frac{10}{\sqrt{5} \cdot \sqrt{20}} =
      \frac{10}{10} = 1$</td></tr>

      <tr><td>vuông góc: $(1, 0)$ và $(0, 1)$</td><td>90°</td><td>$\frac{0}{1 \cdot 1} = 0$</td></tr></table>

      '
    introduces:
    - cos
    - frac
    focus:
    - 1
    - 2
    - '3.2'
    - '3.2'
    - '3.3'
    - 0
    say: Điều thứ ba là cosin của hai vector, con số đo hai mũi tên cùng hướng tới đâu, không quan tâm mũi tên
      dài hay ngắn. Cosin bằng tích vô hướng chia tích hai độ dài, với u và v ở trên là 8 chia 2 phẩy 236 nhân
      3 phẩy 742, khoảng 0 phẩy 956. Hai mũi tên cùng hướng, như 1, 2, 0 và 2, 4, 0, có góc 0 độ và cosin bằng
      1. Lý do là tích vô hướng bằng 10, còn căn 5 nhân căn 20 bằng căn 100, tức cũng bằng 10. Hai mũi tên vuông
      góc, như 1, 0 và 0, 1, có góc 90 độ và cosin bằng 0, vì tích vô hướng bằng 0. Khi giá trị cosin tiến sát
      về 1 thì hai vector gần như cùng hướng, nên ta dùng nó đo độ khớp giữa văn bản và câu hỏi.
