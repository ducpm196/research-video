# Quy ước: kho 3 văn bản đồ chơi (số minh hoạ), mỗi “từ” là một âm tiết để dễ đếm: d1 = “máy ổ máy”, d2 = “máy pin”, d3 = “máy pin màn”.
#   Bộ từ theo thứ tự (máy, ổ, pin, màn). tf = số lần từ t có trong văn bản d; df = số văn bản chứa t; N = số văn bản của kho;
#   idf = ln(N / df) (lôgarit tự nhiên, chỉ dùng \ln); trọng số = tf · idf. Vector viết chữ thường không in đậm, như LLM bài 3:
#   cos(q, d) = q · d / (‖q‖ ‖d‖). TF-IDF chỉ trên màn hình; lời đọc nói “trọng số tần suất nhân độ hiếm”.
objectives:
  - "Tính trọng số tần suất nhân độ hiếm của một từ trong một văn bản"
  - "Biểu diễn văn bản và câu hỏi thành vector rồi xếp hạng bằng cosin"
  - "Giải thích vì sao cosin không đổi khi văn bản dài gấp đôi, và vì sao nó vẫn thua nhồi từ khoá"
