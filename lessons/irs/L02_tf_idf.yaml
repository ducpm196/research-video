- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">đếm từ: tf</span><span class="a">→</span>

      <span class="n">độ hiếm $\ln \frac{N}{\text{df}}$</span><span class="a">→</span>

      <span class="n">trọng số $\text{tf} \cdot \text{idf}$</span><span class="a">→</span>

      <span class="n">vector văn bản, vector câu hỏi</span><span class="a">→</span>

      <span class="n">xếp theo cosin</span></div>

      '
    say: Tổng kết lại, ta đếm từ rồi nhân với độ hiếm để từ có ở mọi nơi bị bỏ qua. Sau đó xếp trọng số thành
      vector cho cả văn bản và câu hỏi, rồi xếp hạng bằng cosin của góc giữa hai vector.
  - show: '<div class="box key"><b>Tư duy:</b> trọng số tốt đo <b>bằng chứng phân biệt</b>, không đo số lần xuất
      hiện thô. Và mỗi con số độ hiếm chỉ đúng với <b>một kho</b> cụ thể.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ kho 3 câu ngắn tới kho 10 triệu văn bản: tần suất từ hiếm
      idf thay đổi khi kho thêm mới, buộc phải chuẩn hoá vector sẵn và cập nhật định kỳ thay vì tính lại từng
      truy vấn.</p>

      '
    say: Điều cần mang theo, trọng số tốt đo bằng chứng giúp phân biệt văn bản, không đo số lần xuất hiện thô.
      Và mỗi con số độ hiếm chỉ đúng với một kho cụ thể, kho đổi thì nó đổi. Từ kho 3 câu tới kho 10 triệu văn
      bản, độ hiếm của từ luôn đổi khi kho tăng. Ta phải chuẩn hoá trước ma trận và cập nhật theo chu kỳ thay
      vì tính lại từng truy vấn.
    focus:
    - 1
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 3): truy hồi dày — vector nhúng hàng trăm chiều không còn số 0, và tìm
      láng giềng gần đúng để không phải so với cả triệu vector.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 3, ta học truy hồi dày, khi mỗi văn bản là một vector nhúng hàng trăm chiều. Vì không
      thể so với cả triệu vector, ta học cách tìm láng giềng gần đúng bằng cách chia cụm. Hẹn gặp bạn ở bài tiếp
      theo.
