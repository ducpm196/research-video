      '
    say: Lỗi thứ nhất là xếp hạng bằng tích vô hướng thô, nên bản ghép đôi của d1 được gấp đôi điểm, 2 phẩy 414
      so với 1 phẩy 207. Văn bản dài lặp lại chính nó thì thắng mà không thêm thông tin gì. Phép thử là nhân đôi
