id: L02
course: IRS
series: "IRS · Truy hồi thông tin và hệ gợi ý"
title: "Bài 2 — Mô hình không gian vector: TF-IDF và độ tương tự cosin"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/irs.yaml L02; audit/irs/verify_irs.py (verify_parts/L02.py); audit/irs/sources_L02.md; C. Manning, P. Raghavan, H. Schütze, Introduction to Information Retrieval (2008), chương 6 (sách tham khảo; trang không tải được ngày 2026-11-03 — chỉ dạy định nghĩa toán, máy tự kiểm); DEN bài 7 (chỉ mục ngược, công thức xếp hạng có bão hoà); LLM bài 3 (cosin); CS115 bài 12 (lôgarit tự nhiên)"
assumes: [arith, frac, approx, sqrt, sub, norm, cdot, cos, log]
# Quy ước: kho 3 văn bản đồ chơi (số minh hoạ), mỗi “từ” là một âm tiết để dễ đếm: d1 = “máy ổ máy”, d2 = “máy pin”, d3 = “máy pin màn”.
#   Bộ từ theo thứ tự (máy, ổ, pin, màn). tf = số lần từ t có trong văn bản d; df = số văn bản chứa t; N = số văn bản của kho;
#   idf = ln(N / df) (lôgarit tự nhiên, chỉ dùng \ln); trọng số = tf · idf. Vector viết chữ thường không in đậm, như LLM bài 3:
#   cos(q, d) = q · d / (‖q‖ ‖d‖). TF-IDF chỉ trên màn hình; lời đọc nói “trọng số tần suất nhân độ hiếm”.
objectives:
  - "Tính trọng số tần suất nhân độ hiếm của một từ trong một văn bản"
  - "Biểu diễn văn bản và câu hỏi thành vector rồi xếp hạng bằng cosin"
  - "Giải thích vì sao cosin không đổi khi văn bản dài gấp đôi, và vì sao nó vẫn thua nhồi từ khoá"
scenes:
  - id: hook
    kind: hook
    title: "Tìm “máy pin”, hệ lại trả về trang bán ổ cứng"
    checks:
      - "round(alg.cosine([1, 0, 1, 0], [2, 1, 0, 0]), 3) == 0.632"
    steps:
      - show: |
          <p>Kho có ba văn bản (số minh hoạ): <b>d1</b> “máy ổ máy”, <b>d2</b> “máy pin”, <b>d3</b> “máy pin màn”. Người dùng gõ <b>“máy pin”</b>.</p>
          <p>Hệ đếm từ chung, so bằng cosin của các vector đếm: d1 được <b>0,632</b> — chỉ vì có chữ “máy” hai lần, dù d1 nói về ổ cứng.</p>
          <div class="box key">Hôm nay ta trả lời: biến văn bản thành vector thế nào? Từ nào đáng tin hơn từ nào? Và xếp hạng bằng góc giữa hai vector ra sao?</div>
        focus: [1, 2, 3]
        say: "Chào bạn, kho có ba văn bản đồ chơi, d1 là máy ổ máy, d2 là máy pin, d3 là máy pin màn, và người dùng gõ máy pin. Một hệ đơn giản chỉ đếm từ rồi so bằng cosin, và d1 được tới 0 phẩy 632, chỉ vì có chữ máy hai lần dù d1 nói về ổ cứng. Hôm nay ta trả lời ba câu hỏi, biến văn bản thành vector thế nào, từ nào đáng tin hơn từ nào, và xếp hạng bằng góc giữa hai vector ra sao."

  - id: prereq
    kind: prereq
    title: "Ôn lại: lôgarit tự nhiên, độ dài vector và cosin"
    checks:
      - "math.log(1) == 0 and round(math.log(3), 3) == 1.099 and round(math.log(1.5), 3) == 0.405"
      - "math.sqrt(3 ** 2 + 4 ** 2) == 5 and 1 * 2 + 2 * 3 + 0 * 1 == 8 and round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956"
    steps:
      - show: |
          <p><b>① Lôgarit tự nhiên</b> (ở khoá Toán cho khoa học máy tính): $\ln x$ là số mũ của $e \approx 2{,}718$ để được $x$.</p>
          <table class="t"><tr><th>$x$</th><th>1</th><th>1,5</th><th>3</th></tr>
          <tr><td>$\ln x$</td><td>0</td><td>≈ 0,405</td><td>≈ 1,099</td></tr></table>
          <p class="note">Số trong ngoặc bằng 1 thì lôgarit bằng 0; số càng lớn thì lôgarit càng lớn, nhưng tăng chậm.</p>
        introduces: [log, approx]
        focus: [1, "2.2", 3]
        say: "Điều thứ nhất là lôgarit tự nhiên, ở khoá Toán cho khoa học máy tính, lôgarit tự nhiên của x, viết hai chữ l n, là số mũ của e, khoảng 2 phẩy 718, để được x. Bảng cho lôgarit của 1 bằng 0, lôgarit của 1 phẩy 5 khoảng 0 phẩy 405, và lôgarit của 3 khoảng 1 phẩy 099. Số trong ngoặc bằng 1 thì lôgarit bằng 0, số càng lớn thì lôgarit càng lớn nhưng tăng chậm."
      - show: |
          <p><b>② Độ dài và cosin</b> (ở khoá Mô hình ngôn ngữ lớn): độ dài $\lVert u \rVert$ là căn của tổng bình phương, $\lVert (3, 4) \rVert = \sqrt{9 + 16} = 5$. Dấu chấm giữa hai vector là tích vô hướng, nhân từng cặp rồi cộng.</p>
          $$\cos(u, v) = \frac{u \cdot v}{\lVert u \rVert \, \lVert v \rVert} \qquad u = (1, 2, 0),\ v = (2, 3, 1)\!: \ \frac{8}{\sqrt{5} \cdot \sqrt{14}} \approx 0{,}956$$
        introduces: [norm, sqrt, cdot, cos, frac]
        focus: [1, 1, 1, 2, 2]
        say: "Điều thứ hai, ở khoá Mô hình ngôn ngữ lớn, độ dài của một vector, viết giữa hai cặp vạch đứng, là căn của tổng bình phương. Ví dụ vector 3, 4 có độ dài căn của 9 cộng 16, bằng 5. Dấu chấm giữa hai vector là tích vô hướng, nhân từng cặp thành phần rồi cộng. Cosin của hai vector bằng tích vô hướng chia tích hai độ dài, chỉ phụ thuộc hướng. Với vector 1, 2, 0 và 2, 3, 1, ta được 8 chia căn 5 nhân căn 14, khoảng 0 phẩy 956."

  - id: sym
    kind: symbol
    title: "Giải mã: tần suất tf, số văn bản chứa từ df, độ hiếm idf"
    checks:
      - "['máy', 'ổ', 'máy'].count('máy') == 2 and sum('máy' in d for d in [['máy', 'ổ', 'máy'], ['máy', 'pin'], ['máy', 'pin', 'màn']]) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>tên</th><th>nghĩa</th><th>ví dụ trong kho</th></tr>
          <tr><td>$N$</td><td>số văn bản</td><td>kho có bao nhiêu văn bản</td><td>3</td></tr>
          <tr><td>$\text{tf}_{t,d}$</td><td>tần suất</td><td>từ $t$ xuất hiện mấy lần trong văn bản $d$</td><td>“máy” trong d1: 2</td></tr>
          <tr><td>$\text{df}_t$</td><td>số văn bản chứa từ</td><td>bao nhiêu văn bản có từ $t$</td><td>“máy”: 3; “ổ”: 1</td></tr>
          <tr><td>$\text{idf}_t = \ln \frac{N}{\text{df}_t}$</td><td>độ hiếm</td><td>từ càng ít văn bản có thì càng lớn</td><td>tính ở phần ví dụ</td></tr></table>
        introduces: [sub]
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã từng ký hiệu, chữ N là số văn bản của kho, ở đây bằng 3. Hai chữ t f với t và d nhỏ dưới chân là tần suất, từ t xuất hiện mấy lần trong văn bản d, ví dụ từ máy có 2 lần trong d1. Hai chữ d f với t nhỏ dưới chân là số văn bản chứa từ t, từ máy có ở cả 3 văn bản, còn từ ổ chỉ có ở 1. Ba chữ i d f là độ hiếm, bằng lôgarit của N chia d f, từ càng ít văn bản có thì độ hiếm càng lớn."

