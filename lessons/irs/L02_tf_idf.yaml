      <tr><td>$N$</td><td>số văn bản</td><td>kho có bao nhiêu văn bản</td><td>3</td></tr>

      <tr><td>$\text{tf}_{t,d}$</td><td>tần suất</td><td>từ $t$ xuất hiện mấy lần trong văn bản $d$</td><td>“máy”
      trong d1: 2</td></tr>

      <tr><td>$\text{df}_t$</td><td>số văn bản chứa từ</td><td>bao nhiêu văn bản có từ $t$</td><td>“máy”: 3; “ổ”:
      1</td></tr>

      <tr><td>$\text{idf}_t = \ln \frac{N}{\text{df}_t}$</td><td>độ hiếm</td><td>từ xuất hiện ở ít văn bản hơn
      thì độ hiếm cao hơn</td><td>tính ở phần ví dụ</td></tr>

      <tr><td>$\text{TF-IDF} = \text{tf} \cdot \text{idf}$</td><td>trọng số TF-IDF</td><td>tần suất từ nhân độ
      hiếm nghịch đảo số văn bản</td><td>tính ở phần ví dụ</td></tr></table>

      '
    introduces:
    - sub
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Bảng giải mã từng ký hiệu, chữ N là số văn bản của kho, ở đây bằng 3. Hai chữ t f với t và d nhỏ dưới
      chân là tần suất, từ t xuất hiện mấy lần trong văn bản d, ví dụ từ máy có 2 lần trong d1. Hai chữ d f với
      t nhỏ dưới chân là số văn bản chứa từ t, từ máy có ở cả 3 văn bản, còn từ ổ chỉ có ở 1. Ba chữ i d f là
      độ hiếm, bằng lôgarit của N chia d f, nên một từ xuất hiện ở ít văn bản hơn sẽ có độ hiếm cao hơn. Cuối
      cùng trọng số kết hợp tần suất từ nhân độ hiếm nghịch đảo số văn bản sẽ được tính ở ví dụ tiếp theo.
