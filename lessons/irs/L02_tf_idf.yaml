    pause: 20
  - clear: true
    show: '<p><b>Câu 1.</b> Mỗi từ một lần, nhân độ hiếm: $q = (0;\ 0;\ 0{,}405;\ 1{,}099)$ — trùng hướng với
      d3.</p>

      <table class="t"><tr><th>câu 2</th><th>phép tính</th><th>cosin</th></tr>

      <tr><td>d3</td><td>cùng vector với $q$</td><td>$\hlg{1}$</td></tr>

      <tr><td>d2</td><td>$\frac{0{,}164}{1{,}171 \cdot 0{,}405}$</td><td>≈ 0,346</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Đáp án câu một, mỗi từ có một lần, nhân với độ hiếm, nên q là 0, 0, 0 phẩy 405, 1 phẩy 099, trùng hướng
      với d3. Câu hai, vì d3 cùng vector với q nên cosin bằng 1 và d3 đứng đầu. Văn bản d2 được 0 phẩy 164 chia
      1 phẩy 171 nhân 0 phẩy 405, khoảng 0 phẩy 346, xếp thứ hai, còn d1 vẫn được 0.
  - show: '<p><b>Câu 3.</b> Chia trước mỗi vector cho độ dài của nó, để mọi vector dài đúng 1:</p>

      $$\text{d3} \to \left(0;\ 0;\ \frac{0{,}4055}{1{,}1710};\ \frac{1{,}0986}{1{,}1710}\right) \approx (0;\
      0;\ 0{,}346;\ 0{,}938), \quad 0{,}346^2 + 0{,}938^2 \approx 1$$

      <p class="note">Khi đó cosin chính là tích vô hướng, rẻ hơn. Đổi lại: kho đổi thì độ hiếm đổi, phải tính
      lại và chuẩn hoá lại mọi vector đã lưu.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Câu ba, ta chia trước mỗi vector cho độ dài của nó, để mọi vector đã lưu dài đúng 1. Ví dụ d3 thành khoảng
      0, 0, 0 phẩy 346, 0 phẩy 938, và tổng bình phương xấp xỉ 1. Khi đó cosin chính là tích vô hướng, chỉ cần
      nhân từng cặp rồi cộng, rẻ hơn hẳn. Đổi lại, khi kho đổi thì độ hiếm đổi, nên phải tính lại và chuẩn hoá
      lại mọi vector đã lưu.
