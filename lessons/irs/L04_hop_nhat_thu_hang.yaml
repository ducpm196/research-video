# Quy ước: r = hạng (vị trí) của văn bản trong MỘT danh sách, đếm từ 1; k = hằng số làm dịu, [CO09] cố định k = 60. Điểm hợp nhất
#   = tổng 1/(k + r) trên các danh sách có văn bản đó; văn bản vắng mặt ở một danh sách thì danh sách đó góp 0. Chữ k ở bài này KHÔNG
#   phải “k kết quả đầu” của bài 0 (nói rõ ở step ký hiệu). Điểm từ khoá (thang 0 tới vài chục) và cosin (0 tới 1) ở ví dụ là SỐ MINH HOẠ.
#   RRF, BM25 chỉ trên màn hình; lời đọc nói “hợp nhất thứ hạng nghịch đảo”, “công thức xếp hạng theo từ khoá”.
objectives:
  - "Ghép danh sách từ khoá và danh sách vector bằng điểm 1 chia (k cộng hạng)"
  - "Giải thích vì sao không cộng thẳng điểm thô của hai hệ"
  - "Đo bản ghép bằng độ đo xếp hạng thay vì tin rằng ghép luôn tốt hơn"
