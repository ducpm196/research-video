scenes:
  - id: hook
    kind: hook
    title: "Hai hệ tìm kiếm, hai thang điểm, một trang kết quả"
    checks:
      - "round(12.4 + 0.79, 2) == 13.19 and round(11.9 + 0.83, 2) == 12.73"
    steps:
      - show: |
          <p>Cửa hàng chạy song song hai hệ cho cùng câu hỏi (số minh hoạ):</p>
          <table class="t"><tr><th>hạng</th><th>theo từ khoá (điểm 0 tới vài chục)</th><th>theo vector (cosin, không quá 1)</th></tr>
          <tr><td>1</td><td>A — 12,4</td><td>B — 0,83</td></tr>
          <tr><td>2</td><td>B — 11,9</td><td>E — 0,81</td></tr>
          <tr><td>3</td><td>C — 6,0</td><td>A — 0,79</td></tr>
          <tr><td>4</td><td>D — 5,5</td><td>C — 0,70</td></tr></table>
          <div class="box key">Hôm nay ta trả lời: ghép hai danh sách thế nào khi hai thang điểm khác hẳn nhau? Vì sao cộng thẳng điểm lại hỏng? Và làm sao biết bản ghép tốt hơn?</div>
        focus: [1, "2.2", "2.3", 0, 3]
        say: "Chào bạn, cửa hàng chạy song song hai hệ tìm kiếm cho cùng một câu hỏi, đây là số minh hoạ. Hệ theo từ khoá xếp A đầu với điểm 12 phẩy 4, rồi B, C, D, thang điểm từ 0 tới vài chục. Hệ theo vector xếp B đầu với cosin 0 phẩy 83, rồi E, A, C, thang điểm không bao giờ vượt quá 1. Trang kết quả chỉ có một danh sách, nên phải ghép hai danh sách này lại. Hôm nay ta trả lời ba câu hỏi, ghép thế nào khi hai thang điểm khác hẳn nhau, vì sao cộng thẳng điểm lại hỏng, và làm sao biết bản ghép tốt hơn."

  - id: prereq
    kind: prereq
    title: "Trước hết: hai loại điểm, hạng nghịch đảo, phân số nhỏ"
    checks:
      - "round(alg.bm25_idf(3, 2), 3) == 0.47 and round(math.log(1.6), 3) == 0.47 and round(1 + (3 - 2 + 0.5) / (2 + 0.5), 1) == 1.6"
      - "round(1.2 * (1 - 0.75 + 0.75 * 3 / 3), 2) == 1.2 and round(1.2 * (1 - 0.75 + 0.75 * 4 / 3), 2) == 1.5 and (3 + 2 + 4) / 3 == 3"
      - "round(2 * 2.2 / (2 + 1.2), 3) == 1.375 and round(1 * 2.2 / (1 + 1.5), 2) == 0.88 and round(0.47 * 1.375, 3) == 0.646 and round(0.47 * 0.88, 3) == 0.414"
      - "[round(x, 3) for x in alg.bm25(['mèo'], [['mèo', 'đen', 'mèo'], ['chó', 'đen'], ['mèo', 'trắng', 'chó', 'con']])] == [0.646, 0.0, 0.414]"
      - "[round(f * 2.2 / (f + 1.2), 3) for f in (1, 2, 10)] == [1.0, 1.375, 1.964] and all(f * 2.2 / (f + 1.2) < 2.2 for f in range(1, 10 ** 4))"
      - "1 * 2 + 2 * 3 + 0 * 1 == 8 and round(math.sqrt(5), 3) == 2.236 and round(math.sqrt(14), 3) == 3.742 and round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956"
      - "alg.cosine([1, 0], [-1, 0]) == -1 and alg.cosine([1, 2], [2, 4]) == 1"
      - "alg.irs_rr([0, 0, 1]) == 1 / 3 and round(1 / 61, 6) == 0.016393 and round(1 / 61 + 1 / 63, 5) == 0.03227"
    steps:
      - show: |
          <p><b>① Điểm theo từ khoá có bão hoà</b> (BM25, Robertson &amp; Zaragoza 2009): với mỗi từ của câu hỏi có trong văn bản, nhân <b>độ hiếm</b> với <b>phần tần suất đã bão hoà</b>, rồi cộng theo các từ.</p>
          <table class="t"><tr><th>phần</th><th>công thức</th><th>nghĩa</th></tr>
          <tr><td>độ hiếm</td><td>$\ln\left(1 + \frac{N - n + 0{,}5}{n + 0{,}5}\right)$</td><td>$N$ văn bản, $n$ văn bản chứa từ: càng ít văn bản có, từ càng đáng giá</td></tr>
          <tr><td>phần tần suất</td><td>$\frac{f \cdot (k_1 + 1)}{f + K}$</td><td>$f$ = số lần từ xuất hiện; tăng theo $f$ nhưng không vượt $k_1 + 1$: <b>bão hoà</b></td></tr>
          <tr><td>chuẩn hoá độ dài</td><td>$K = k_1 \cdot \left(1 - b + b \cdot \frac{\text{độ dài}}{\text{độ dài trung bình}}\right)$</td><td>văn bản dài hơn trung bình có $K$ lớn hơn; thường $k_1 = 1{,}2$, $b = 0{,}75$</td></tr></table>
        introduces: [frac, sub]
        focus: [1, 1, 1, "2.2", "2.3", "2.3", "2.4", "2.4"]
        say: "Trước hết, ta cần hiểu hai loại điểm mà hai hệ tìm kiếm cho ra. Hệ theo từ khoá thường dùng công thức xếp hạng có bão hoà. Với mỗi từ của câu hỏi có trong văn bản, ta nhân độ hiếm với phần tần suất đã bão hoà, rồi cộng theo các từ. Độ hiếm là lôgarit tự nhiên của 1 cộng một phân số, với N là số văn bản và n là số văn bản chứa từ, nên từ càng ít văn bản có thì càng đáng giá. Phần tần suất là f nhân k 1 cộng 1, chia f cộng K hoa, với f là số lần từ xuất hiện trong văn bản. Phần này tăng khi f tăng nhưng không bao giờ vượt k 1 cộng 1, nên lặp một từ nhiều lần chỉ được thêm ít dần, đó là bão hoà. K hoa chuẩn hoá theo độ dài, văn bản dài hơn trung bình có K lớn hơn, nên mỗi lần lặp từ được ít điểm hơn. Hai hằng số thường được chọn là k 1 bằng 1 phẩy 2 và b bằng 0 phẩy 75."
      - clear: true
        show: |
          <p><b>② Làm thử</b> với câu hỏi “mèo” và ba văn bản: ① “mèo đen mèo” (3 từ), ② “chó đen” (2 từ), ③ “mèo trắng chó con” (4 từ). $N = 3$, “mèo” có trong $n = 2$ văn bản, độ dài trung bình $\frac{3 + 2 + 4}{3} = 3$.</p>
          <table class="t"><tr><th>bước</th><th>văn bản ① (mèo 2 lần)</th><th>văn bản ③ (mèo 1 lần)</th></tr>
          <tr><td>độ hiếm</td><td colspan="2">$\ln\left(1 + \frac{1{,}5}{2{,}5}\right) = \ln 1{,}6 \approx 0{,}470$</td></tr>
          <tr><td>$K$</td><td>$1{,}2 \cdot \left(0{,}25 + 0{,}75 \cdot \frac{3}{3}\right) = 1{,}2$</td><td>$1{,}2 \cdot \left(0{,}25 + 0{,}75 \cdot \frac{4}{3}\right) = 1{,}5$</td></tr>
          <tr><td>phần tần suất</td><td>$\frac{2 \cdot 2{,}2}{2 + 1{,}2} = 1{,}375$</td><td>$\frac{1 \cdot 2{,}2}{1 + 1{,}5} = 0{,}88$</td></tr>
          <tr><td>điểm</td><td>$0{,}470 \cdot 1{,}375 \approx \hlg{0{,}646}$</td><td>$0{,}470 \cdot 0{,}88 \approx 0{,}414$</td></tr></table>
          <p class="note">Văn bản ② không có “mèo”: điểm 0. Bão hoà: ở văn bản dài đúng trung bình, $f$ = 1, 2, 10 cho phần tần suất 1; 1,375; 1,964 — không bao giờ tới 2,2.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.4", "2.5", 3, 3]
        say: "Điều thứ hai là làm thử với câu hỏi mèo và ba văn bản, mèo đen mèo, chó đen, và mèo trắng chó con, độ dài trung bình là 3 từ. Có 3 văn bản và mèo có trong 2 văn bản, nên độ hiếm là lôgarit của 1 cộng 1 phẩy 5 chia 2 phẩy 5, tức lôgarit của 1 phẩy 6, khoảng 0 phẩy 470. Văn bản một dài đúng trung bình nên K hoa bằng 1 phẩy 2, còn văn bản ba dài 4 từ nên K hoa lên 1 phẩy 5. Văn bản một có mèo 2 lần, phần tần suất là 4 phẩy 4 chia 3 phẩy 2, bằng 1 phẩy 375. Văn bản ba có mèo 1 lần, được 2 phẩy 2 chia 2 phẩy 5, bằng 0 phẩy 88. Nhân với độ hiếm, văn bản một được khoảng 0 phẩy 646, văn bản ba được khoảng 0 phẩy 414. Văn bản hai không có chữ mèo nên được 0 điểm. Còn ở văn bản dài đúng trung bình, mèo 1 lần, 2 lần, 10 lần cho phần tần suất 1, 1 phẩy 375 và 1 phẩy 964, không bao giờ tới 2 phẩy 2, đó là bão hoà."
      - clear: true
        show: |
          <p><b>③ Cosin</b> đo hai vector có cùng hướng không: <b>tích vô hướng</b> (nhân từng cặp thành phần rồi cộng) chia tích hai <b>độ dài</b> (căn của tổng bình phương). Với (1, 2, 0) và (2, 3, 1):</p>
          $$\frac{1 \cdot 2 + 2 \cdot 3 + 0 \cdot 1}{\sqrt{1 + 4 + 0} \cdot \sqrt{4 + 9 + 1}} = \frac{8}{\sqrt{5} \cdot \sqrt{14}} \approx \frac{8}{2{,}236 \cdot 3{,}742} \approx 0{,}956$$
          <p class="note">Cosin không bao giờ vượt 1 (cùng hướng hẳn, như (1, 2) và (2, 4)) và không dưới −1 (ngược hướng). Vector trọng số của bài 2 không có số âm nên cosin từ 0 tới 1; vector nhúng của bài 3 có thể cho cosin âm. Còn điểm từ khoá ở ① không có trần chung: câu hỏi càng nhiều từ hiếm, điểm càng lớn — hai thang khác hẳn nhau.</p>
        introduces: [sqrt]
        focus: [1, 1, 2, 2, 3, 3, 3]
        say: "Điều thứ ba là cosin, hệ theo vector dùng nó để đo hai vector có cùng hướng hay không. Cosin là tích vô hướng, tức nhân từng cặp thành phần rồi cộng, chia cho tích hai độ dài, mỗi độ dài là căn của tổng bình phương. Với hai vector 1, 2, 0 và 2, 3, 1, tích vô hướng là 2 cộng 6 cộng 0, bằng 8. Hai độ dài là căn 5, khoảng 2 phẩy 236, và căn 14, khoảng 3 phẩy 742, nên cosin xấp xỉ 0 phẩy 956. Cosin không bao giờ vượt 1, đạt 1 khi hai vector cùng hướng hẳn, và không dưới âm 1, khi hai vector ngược hướng. Vector trọng số của bài 2 không có số âm nên cosin nằm từ 0 tới 1, còn vector nhúng của bài 3 có thể cho cosin âm. Điểm từ khoá thì không có trần chung, câu hỏi càng nhiều từ hiếm thì điểm càng lớn, nên hai thang khác hẳn nhau."
      - clear: true
        show: |
          <p><b>④ Hạng nghịch đảo</b> (bài 0): 1 chia vị trí của kết quả đúng đầu tiên; kết quả đúng ở vị trí 3 cho $\frac{1}{3}$.</p>
          <p><b>⑤ Phân số nhỏ.</b> $\frac{1}{61} \approx 0{,}016393$. Cộng hai phân số nhỏ: đổi từng cái ra số thập phân rồi cộng, giữ đủ chữ số:</p>
          $$\frac{1}{61} + \frac{1}{63} \approx 0{,}016393 + 0{,}015873 = 0{,}032266 \approx 0{,}03227$$
        introduces: [approx]
        focus: [1, 2, 3]
        say: "Điều thứ tư, như ở bài 0, hạng nghịch đảo là 1 chia vị trí của kết quả đúng đầu tiên, kết quả đúng ở vị trí 3 thì được 1 phần 3. Điều thứ năm là phân số nhỏ, 1 chia 61 xấp xỉ 0 phẩy 016393. Muốn cộng 1 chia 61 với 1 chia 63, ta đổi từng phân số ra số thập phân rồi cộng, giữ đủ chữ số, được khoảng 0 phẩy 032266, làm tròn là 0 phẩy 03227."

  - id: sym
    kind: symbol
    title: "Giải mã: hạng r, hằng số k, điểm hợp nhất"
    steps:
