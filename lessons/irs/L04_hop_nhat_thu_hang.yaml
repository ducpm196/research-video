  - id: formula
    kind: formula
    title: "Suy ra điểm 1 chia (k cộng hạng)"
    checks:
      - "[round(1 / r, 3) for r in (1, 2, 3, 4)] == [1, 0.5, 0.333, 0.25] and [round(1 / (60 + r), 4) for r in (1, 2, 3, 4)] == [0.0164, 0.0161, 0.0159, 0.0156]"
      - "round((1 / 1) / (1 / 2), 3) == 2 and round((1 / 61) / (1 / 62), 4) == 1.0164"
    steps:
      - show: |
          <p><b>Bước 1 — chỉ dùng hạng.</b> Điểm thô của hai hệ khác thang, nên ta bỏ điểm, giữ <b>hạng</b> — thứ mà hệ nào cũng có, và có cùng nghĩa: hạng 1 là tốt nhất.</p>
          <p><b>Bước 2 — hạng càng sau, phiếu càng nhỏ.</b> Như hạng nghịch đảo ở bài 0, lấy $\frac{1}{r}$: hạng 1, 2, 3, 4 cho 1; 0,5; 0,333; 0,25.</p>
        focus: [1, 1, 2, 2]
        say: "Bước một là chỉ dùng hạng, vì điểm thô của hai hệ khác thang nên ta bỏ điểm. Hạng thì hệ nào cũng có, và có cùng một nghĩa, hạng 1 là tốt nhất. Bước hai, hạng càng sau thì lá phiếu càng nhỏ, nên giống hạng nghịch đảo ở bài 0, ta lấy 1 chia r. Hạng 1, 2, 3, 4 cho 1, 0 phẩy 5, 0 phẩy 333 và 0 phẩy 25."
      - show: |
          <p><b>Bước 3 — làm dịu bằng $k$.</b> Với $\frac{1}{r}$, hạng 1 nặng gấp đôi hạng 2: một hệ “lạc đề” xếp bừa một văn bản lên đầu là đủ kéo nó lên. Cộng thêm hằng số $k$ vào mẫu số:</p>
          $$\text{điểm}(d) = \sum_{j} \frac{1}{k + r_j(d)} \qquad k = 60\!: \ \frac{1/61}{1/62} = \frac{62}{61} \approx 1{,}0164$$
          <p class="note">Nhóm tác giả năm 2009 cố định $k = 60$ sau thử nghiệm ban đầu và ghi rằng lựa chọn này “không quá quan trọng”.</p>
        introduces: [sum]
        focus: [1, 1, 2, 3]
        say: "Bước ba là làm dịu bằng k, vì với 1 chia r, hạng 1 nặng gấp đôi hạng 2, nên một hệ lạc đề xếp bừa một văn bản lên đầu là đủ kéo nó lên. Ta cộng thêm hằng số k vào mẫu số, và điểm của văn bản d là tổng theo mọi danh sách j của 1 chia k cộng r j của d. Với k bằng 60, hạng 1 chỉ nặng hơn hạng 2 khoảng 1 phẩy 6 phần trăm, nên phải được nhiều danh sách cùng xếp cao mới thắng. Nhóm tác giả năm 2009 cố định k bằng 60 sau thử nghiệm ban đầu và ghi rằng lựa chọn này không quá quan trọng."

  - id: example
    kind: example
    title: "Ghép hai danh sách với k = 60, từng phép tính"
    checks:
      - "round(1 / 61 + 1 / 63, 5) == 0.03227 and round(alg.irs_rrf([list('ABCD'), list('BEAC')])['A'], 5) == 0.03227"
      - "round(1 / 62 + 1 / 61, 5) == 0.03252 and round(alg.irs_rrf([list('ABCD'), list('BEAC')])['B'], 5) == 0.03252"
      - "round(1 / 63 + 1 / 64, 5) == 0.0315 and round(1 / 62, 5) == 0.01613 and 1 / 64 == 0.015625"
      - "[d for d, _ in sorted(alg.irs_rrf([list('ABCD'), list('BEAC')]).items(), key=lambda x: -x[1])] == ['B', 'A', 'C', 'E', 'D']"
    steps:
      - show: |
          <p><b>Bước 1.</b> Văn bản A: hạng 1 ở từ khoá, hạng 3 ở vector.</p>
          $$\frac{1}{60 + 1} + \frac{1}{60 + 3} \approx 0{,}016393 + 0{,}015873 \approx \hlb{0{,}03227}$$
        focus: [1, 2]
        say: "Bước một, văn bản A đứng hạng 1 ở danh sách từ khoá và hạng 3 ở danh sách vector. Điểm của nó là 1 chia 61 cộng 1 chia 63, khoảng 0 phẩy 016393 cộng 0 phẩy 015873, bằng chừng 0 phẩy 03227."
      - show: |
          <p><b>Bước 2.</b> Văn bản B: hạng 2 ở từ khoá, hạng 1 ở vector.</p>
          $$\frac{1}{60 + 2} + \frac{1}{60 + 1} \approx 0{,}016129 + 0{,}016393 \approx \hlg{0{,}03252}$$
        focus: [1, 2]
        say: "Bước hai, văn bản B đứng hạng 2 ở danh sách từ khoá và hạng 1 ở danh sách vector. Điểm của nó là 1 chia 62 cộng 1 chia 61, khoảng 0 phẩy 016129 cộng 0 phẩy 016393, bằng chừng 0 phẩy 03252, lớn hơn A."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Ba văn bản còn lại:</p>
          <table class="t"><tr><th>văn bản</th><th>hạng (từ khoá; vector)</th><th>điểm</th></tr>
          <tr><td>C</td><td>3; 4</td><td>$\frac{1}{63} + \frac{1}{64} \approx 0{,}03150$</td></tr>
          <tr><td>E</td><td>vắng; 2</td><td>$0 + \frac{1}{62} \approx 0{,}01613$</td></tr>
          <tr><td>D</td><td>4; vắng</td><td>$\frac{1}{64} + 0 = 0{,}015625$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, ta tính ba văn bản còn lại. Văn bản C đứng hạng 3 và hạng 4, được 1 chia 63 cộng 1 chia 64, khoảng 0 phẩy 0315. Văn bản E vắng ở danh sách từ khoá, chỉ được 1 chia 62, khoảng 0 phẩy 01613. Văn bản D vắng ở danh sách vector, chỉ được 1 chia 64, đúng 0 phẩy 015625."
      - show: |
          <p><b>Bước 4.</b> Xếp theo điểm giảm dần:</p>
          $$\hlg{\text{B}}\ (0{,}03252) \;\gt\; \text{A}\ (0{,}03227) \;\gt\; \text{C}\ (0{,}03150) \;\gt\; \text{E}\ (0{,}01613) \;\gt\; \text{D}\ (0{,}015625)$$
          <p class="note">Văn bản được cả hai hệ xếp cao lên đầu; văn bản chỉ một hệ thấy xuống cuối, dù hệ đó xếp nó hạng 2.</p>
        introduces: [ltgt]
        focus: [1, 2, 3]
        say: "Bước bốn, xếp theo điểm giảm dần, dấu nhọn quay sang phải nghĩa là lớn hơn, nên thứ tự là B, A, C, E, rồi D. Văn bản được cả hai hệ xếp cao lên đầu bản ghép. Văn bản chỉ một hệ thấy thì xuống cuối, dù hệ đó xếp nó tới hạng 2 như E."

  - id: check
    kind: check
    title: "Tự kiểm: so A với B không cần máy tính"
    checks:
      - "1 / 62 > 1 / 63 and round((1 / 62 + 1 / 61) - (1 / 61 + 1 / 63), 6) == round(1 / 62 - 1 / 63, 6) == 0.000256"
    steps:
      - show: |
          <p>Đường khác: A có hạng {1; 3}, B có hạng {2; 1}. Cả hai cùng có một phiếu $\frac{1}{61}$ của hạng 1, nên phần đó triệt tiêu khi so:</p>
          $$\text{B} - \text{A} = \left(\frac{1}{61} + \frac{1}{62}\right) - \left(\frac{1}{61} + \frac{1}{63}\right) = \frac{1}{62} - \frac{1}{63} \gt 0$$
          <p class="note">Vì 62 nhỏ hơn 63, $\frac{1}{62}$ lớn hơn $\frac{1}{63}$, nên B đứng trên A — không cần tính số thập phân. Hiệu đúng bằng $0{,}03252 - 0{,}03227 \approx 0{,}00026$, khớp.</p>
        introduces: [set]
        focus: [1, 2, 3, 3]
        say: "Kiểm tra đi đường khác, A có hai hạng 1 và 3, B có hai hạng 2 và 1, viết trong ngoặc móc nhọn. Cả hai cùng có một lá phiếu 1 chia 61 của hạng 1, nên khi lấy B trừ A thì phần đó triệt tiêu, còn lại 1 chia 62 trừ 1 chia 63. Vì 62 nhỏ hơn 63 nên 1 chia 62 lớn hơn, và B đứng trên A mà không cần tính số thập phân. Hiệu đó khoảng 0 phẩy 00026, đúng bằng 0 phẩy 03252 trừ 0 phẩy 03227, khớp."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "sorted({'A': 12.4 + 0.79, 'B': 11.9 + 0.83, 'C': 6.0 + 0.70, 'D': 5.5, 'E': 0.81}.items(), key=lambda x: -x[1])[0][0] == 'A' and round(12.4 + 0.79, 2) == 13.19 and round(11.9 + 0.83, 2) == 12.73"
      - "alg.irs_rrf([['X', 'Y'], ['Z', 'Y']], k=0) == {'X': 1.0, 'Y': 1.0, 'Z': 1.0} and round(alg.irs_rrf([['X', 'Y'], ['Z', 'Y']], k=60)['Y'], 4) == 0.0323 and round(1 / 61, 4) == 0.0164"
      - "round(alg.irs_ndcg([2, 3, 1, 0], k=4, judged=[2, 3, 1, 0, 2]), 3) == 0.772 and alg.irs_ndcg([3, 2, 2, 1], k=4, judged=[2, 3, 1, 0, 2]) == 1 and round(alg.irs_ndcg([3, 2, 1, 2], k=4, judged=[2, 3, 1, 0, 2]), 3) == 0.988"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cộng thẳng điểm thô <b class="red">(A: 12,4 + 0,79 = 13,19 đứng đầu; E: 0,81 xuống cuối)</b>
          <br><span class="note">Thang từ khoá lớn gấp hàng chục lần thang cosin, nên tổng gần như chỉ là điểm từ khoá: danh sách vector bị bỏ qua. Phép thử: xếp theo tổng có trùng hẳn một hệ không?</span></div>
        say: "Lỗi thứ nhất là cộng thẳng điểm thô, A được 12 phẩy 4 cộng 0 phẩy 79 bằng 13 phẩy 19 và đứng đầu, còn E chỉ có 0 phẩy 81 nên xuống cuối. Thang từ khoá lớn gấp hàng chục lần thang cosin, nên tổng gần như chỉ là điểm từ khoá, và danh sách vector bị bỏ qua. Phép thử là xem thứ tự theo tổng có trùng hẳn với một hệ hay không."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ hằng số làm dịu, dùng $\frac{1}{r}$ <b class="red">(k = 0: hai văn bản chỉ một hệ xếp đầu hoà với văn bản cả hai hệ xếp thứ 2)</b>
          <br><span class="note">Danh sách X, Y và Z, Y: với k = 0, X, Y, Z cùng 1 điểm; với k = 60, Y được 2 chia 62 ≈ 0,0323, gần gấp đôi X và Z (≈ 0,0164).</span></div>
        say: "Lỗi thứ hai là bỏ hằng số làm dịu, dùng 1 chia r. Với hai danh sách X, Y và Z, Y, khi k bằng 0 thì X, Y, Z cùng được 1 điểm. Vậy văn bản chỉ một hệ xếp đầu lại hoà với văn bản được cả hai hệ xếp thứ 2. Với k bằng 60, Y được 2 chia 62, khoảng 0 phẩy 0323, gần gấp đôi X và Z, đúng tinh thần hằng số k làm dịu hạng cao của một hệ lạc đề."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tin rằng bản ghép <b>luôn</b> hơn mọi hệ thành phần <b class="red">(câu hỏi này: hệ vector đã hoàn hảo)</b></div>
          <table class="t"><tr><th>mức đã chấm: B 3, A 2, E 2, C 1, D 0</th><th>4 dòng đầu</th><th>nDCG@4</th></tr>
          <tr><td>từ khoá</td><td>A, B, C, D</td><td>0,772</td></tr>
          <tr><td>vector</td><td>B, E, A, C</td><td>$\hlg{1}$</td></tr>
          <tr><td>bản ghép</td><td>B, A, C, E</td><td>0,988</td></tr></table>
          <p class="note">nDCG@4 (bài 1): cộng mức liên quan ở mỗi vị trí chia lôgarit cơ số 2 của (vị trí + 1), rồi chia cho tổng của thứ tự lý tưởng — 1 là hoàn hảo. Nhóm tác giả năm 2009 báo bản ghép hơn hệ tốt nhất 4 đến 5% <b>trung bình</b> trên nhiều thí nghiệm — trung bình, không phải mọi câu hỏi. Đo trên tập câu hỏi đã chấm trước khi đổi.</p>
        focus: [1, 3, 3, "2.2", "2.3", "2.4", 3, 3]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là tin rằng bản ghép luôn hơn mọi hệ thành phần. Nhắc lại bài 1, độ lợi tích lũy có chiết khấu cộng mức liên quan ở mỗi vị trí, chia cho lôgarit cơ số 2 của vị trí cộng 1. Bản chuẩn hoá ở 4 dòng chia tổng đó cho tổng của thứ tự lý tưởng, nên 1 là hoàn hảo. Với các mức đã chấm trong bảng, danh sách từ khoá được 0 phẩy 772. Danh sách vector đạt đúng 1, tức đã hoàn hảo cho câu hỏi này. Bản ghép được 0 phẩy 988, tốt hơn từ khoá nhưng kém vector. Nhóm tác giả năm 2009 báo bản ghép hơn hệ tốt nhất 4 đến 5 phần trăm trung bình trên nhiều thí nghiệm, trung bình chứ không phải mọi câu hỏi. Vì vậy hãy đo trên tập câu hỏi đã chấm trước khi đổi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cắt mỗi danh sách quá ngắn trước khi ghép <b class="red">(văn bản tốt ở hạng 5 của cả hai hệ biến mất)</b>
          <br><span class="note">Hạng 5 ở cả hai danh sách cho $\frac{2}{65} \approx 0{,}0308$, lẽ ra hơn E (0,0161) và D (0,0156). Lấy mỗi danh sách đủ dài (ví dụ 100 dòng) rồi mới ghép và cắt.</span></div>
        say: "Lỗi thứ tư cũng của người đã đi làm, là cắt mỗi danh sách quá ngắn trước khi ghép, như chỉ lấy 4 dòng đầu. Một văn bản đứng hạng 5 ở cả hai hệ lẽ ra được 2 chia 65, khoảng 0 phẩy 0308, hơn hẳn E và D, nhưng nó biến mất vì bị cắt. Hãy lấy mỗi danh sách đủ dài, ví dụ 100 dòng, rồi mới ghép và cắt bản ghép."

  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: ghép, và chọn cách ghép"
    checks:
      - "[d for d, _ in sorted(alg.irs_rrf([list('PQR'), list('RSQ')]).items(), key=lambda x: -x[1])] == ['R', 'Q', 'P', 'S']"
      - "round(alg.irs_rrf([list('PQR'), list('RSQ')])['R'], 5) == 0.03227 and round(alg.irs_rrf([list('PQR'), list('RSQ')])['Q'], 5) == 0.032 and round(1 / 61, 5) == 0.01639 and round(1 / 62, 5) == 0.01613"
      - "sorted({'P': 14, 'Q': 9 + 0.8, 'R': 8 + 0.9, 'S': 0.85}.items(), key=lambda x: -x[1])[0][0] == 'P' and round(9 + 0.8, 1) == 9.8 and round(8 + 0.9, 1) == 8.9"
    steps:
      - show: |
          <table class="t"><tr><th>hạng</th><th>từ khoá (điểm)</th><th>vector (cosin)</th></tr>
          <tr><td>1</td><td>P (14)</td><td>R (0,90)</td></tr>
          <tr><td>2</td><td>Q (9)</td><td>S (0,85)</td></tr>
          <tr><td>3</td><td>R (8)</td><td>Q (0,80)</td></tr></table>
          <p>Câu 1: tính điểm hợp nhất ($k = 60$) của P, Q, R, S và xếp hạng. Câu 2: cộng thẳng điểm thô thì ai đứng đầu? Chọn cách nào, vì sao?</p>
        focus: [0, "1.2", "1.3", "1.4", 2, 2]
        say: "Bây giờ đến lượt bạn, với hai danh sách mới. Hệ từ khoá xếp P, Q, R với điểm 14, 9, 8. Hệ vector xếp R, S, Q với cosin 0 phẩy 9, 0 phẩy 85 và 0 phẩy 8. Câu một, tính điểm hợp nhất với k bằng 60 của P, Q, R, S, và xếp hạng. Câu hai, nếu cộng thẳng điểm thô thì ai đứng đầu, và ta chọn cách nào, vì sao. Dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>hạng (từ khoá; vector)</th><th>điểm</th></tr>
          <tr><td>R</td><td>3; 1</td><td>$\frac{1}{63} + \frac{1}{61} \approx \hlg{0{,}03227}$</td></tr>
          <tr><td>Q</td><td>2; 3</td><td>$\frac{1}{62} + \frac{1}{63} \approx 0{,}03200$</td></tr>
          <tr><td>P</td><td>1; vắng</td><td>$\frac{1}{61} \approx 0{,}01639$</td></tr>
          <tr><td>S</td><td>vắng; 2</td><td>$\frac{1}{62} \approx 0{,}01613$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, đi lần lượt từng văn bản trong bảng. Văn bản R đứng hạng 3 và hạng 1, được 1 chia 63 cộng 1 chia 61, khoảng 0 phẩy 03227, đứng đầu. Văn bản Q đứng hạng 2 và hạng 3, được khoảng 0 phẩy 032, đứng thứ hai. Văn bản P chỉ có ở danh sách từ khoá, được 1 chia 61, khoảng 0 phẩy 01639. Văn bản S chỉ có ở danh sách vector, được 1 chia 62, xuống cuối."
      - show: |
          <table class="t"><tr><th>câu 2: cộng thẳng</th><th>P</th><th>Q</th><th>R</th><th>S</th></tr>
          <tr><td>tổng điểm thô</td><td>$\hl{14}$</td><td>9 + 0,8 = 9,8</td><td>8 + 0,9 = 8,9</td><td>0,85</td></tr></table>
          <p class="note">Cộng thẳng đưa P lên đầu dù hệ vector không hề thấy P — tức là chỉ nghe hệ từ khoá. Chọn hợp nhất thứ hạng. Điều kiện đổi: nếu đã có tập câu hỏi chấm sẵn và một trong hai hệ luôn tốt hơn rõ, có thể học trọng số cho từng hệ — nhưng phải đo bằng độ đo xếp hạng, như ở lỗi 3.</p>
        focus: [0, "1.2", 2, 2]
        say: "Câu hai, cộng thẳng điểm thô thì P được 14, Q được 9 phẩy 8, R được 8 phẩy 9 và S chỉ 0 phẩy 85. Bảng cho thấy P lên đầu dù hệ vector không hề thấy P, tức là ta chỉ nghe hệ từ khoá. Vì vậy ta chọn hợp nhất thứ hạng. Nếu đã có tập câu hỏi chấm sẵn và một hệ luôn tốt hơn rõ, ta có thể học trọng số cho từng hệ, nhưng phải đo bằng độ đo xếp hạng như ở lỗi thứ ba."

  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hai hệ, hai thang điểm</span><span class="a">→</span>
          <span class="n">bỏ điểm, giữ hạng</span><span class="a">→</span>
          <span class="n">mỗi danh sách cho $\frac{1}{k + r}$</span><span class="a">→</span>
          <span class="n">cộng các phiếu, xếp lại</span><span class="a">→</span>
          <span class="n">đo bản ghép bằng nDCG</span></div>
        say: "Tổng kết lại, hai hệ có hai thang điểm khác nhau, nên ta bỏ điểm và chỉ giữ hạng. Mỗi danh sách bỏ một lá phiếu 1 chia k cộng r, ta cộng các phiếu rồi xếp lại, và cuối cùng đo bản ghép bằng độ đo xếp hạng."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi cộng hai con số, hỏi “chúng có cùng đơn vị không?”. Hạng thì cùng đơn vị, điểm thô thì không.</div>
        say: "Điều cần mang theo, trước khi cộng hai con số, hãy hỏi chúng có cùng đơn vị không. Hạng thì cùng đơn vị ở mọi hệ, còn điểm thô thì không."
      - clear: true
        show: |
          <p class="note">Bài 5: học để xếp hạng — thay vì ghép bằng tay, cho máy học hàm xếp hạng từ các cặp “văn bản này tốt hơn văn bản kia”.</p>
        forward_ref: true
        say: "Ở bài 5, ta học để xếp hạng, thay vì ghép bằng tay, ta cho máy học hàm xếp hạng từ những cặp văn bản này tốt hơn văn bản kia. Hẹn gặp bạn ở bài tiếp theo."
