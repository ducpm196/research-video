  - id: formula
    kind: formula
    title: "Suy ra điểm 1 chia (k cộng hạng)"
    checks:
      - "[round(1 / r, 3) for r in (1, 2, 3, 4)] == [1, 0.5, 0.333, 0.25] and [round(1 / (60 + r), 4) for r in (1, 2, 3, 4)] == [0.0164, 0.0161, 0.0159, 0.0156]"
      - "round((1 / 1) / (1 / 2), 3) == 2 and round((1 / 61) / (1 / 62), 4) == 1.0164"
    steps:
      - show: |
          <p><b>Bước 1 — chỉ dùng hạng.</b> Điểm thô của hai hệ khác thang, nên ta bỏ điểm, giữ <b>hạng</b> — thứ mà hệ nào cũng có, và có cùng nghĩa: hạng 1 là tốt nhất.</p>
          <p><b>Bước 2 — hạng càng sau, phiếu càng nhỏ.</b> Như hạng nghịch đảo ở bài 0, lấy $\frac{1}{r}$: hạng 1, 2, 3, 4 cho 1; 0,5; 0,333; 0,25.</p>
        focus: [1, 1, 2, 2]
        say: "Bước một là chỉ dùng hạng, vì điểm thô của hai hệ khác thang nên ta bỏ điểm. Hạng thì hệ nào cũng có, và có cùng một nghĩa, hạng 1 là tốt nhất. Bước hai, hạng càng sau thì lá phiếu càng nhỏ, nên giống hạng nghịch đảo ở bài 0, ta lấy 1 chia r. Hạng 1, 2, 3, 4 cho 1, 0 phẩy 5, 0 phẩy 333 và 0 phẩy 25."
      - show: |
          <p><b>Bước 3 — làm dịu bằng $k$.</b> Với $\frac{1}{r}$, hạng 1 nặng gấp đôi hạng 2: một hệ “lạc đề” xếp bừa một văn bản lên đầu là đủ kéo nó lên. Cộng thêm hằng số $k$ vào mẫu số:</p>
          $$\text{điểm}(d) = \sum_{j} \frac{1}{k + r_j(d)} \qquad k = 60\!: \ \frac{1/61}{1/62} = \frac{62}{61} \approx 1{,}0164$$
          <p class="note">Nhóm tác giả năm 2009 cố định $k = 60$ sau thử nghiệm ban đầu và ghi rằng lựa chọn này “không quá quan trọng”.</p>
        introduces: [sum]
        focus: [1, 1, 2, 3]
        say: "Bước ba là làm dịu bằng k, vì với 1 chia r, hạng 1 nặng gấp đôi hạng 2, nên một hệ lạc đề xếp bừa một văn bản lên đầu là đủ kéo nó lên. Ta cộng thêm hằng số k vào mẫu số, và điểm của văn bản d là tổng theo mọi danh sách j của 1 chia k cộng r j của d. Với k bằng 60, hạng 1 chỉ nặng hơn hạng 2 khoảng 1 phẩy 6 phần trăm, nên phải được nhiều danh sách cùng xếp cao mới thắng. Nhóm tác giả năm 2009 cố định k bằng 60 sau thử nghiệm ban đầu và ghi rằng lựa chọn này không quá quan trọng."

