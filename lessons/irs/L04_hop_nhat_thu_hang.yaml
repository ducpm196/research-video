          <tr><td>tổng điểm thô</td><td>$\hl{14}$</td><td>9 + 0,8 = 9,8</td><td>8 + 0,9 = 8,9</td><td>0,85</td></tr></table>
          <p class="note">Cộng thẳng đưa P lên đầu dù hệ vector không hề thấy P — tức là chỉ nghe hệ từ khoá. Chọn hợp nhất thứ hạng. Điều kiện đổi: nếu đã có tập câu hỏi chấm sẵn và một trong hai hệ luôn tốt hơn rõ, có thể học trọng số cho từng hệ — nhưng phải đo bằng độ đo xếp hạng, như ở lỗi 3.</p>
