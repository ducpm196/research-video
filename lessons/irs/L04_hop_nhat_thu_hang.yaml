scenes:
  - id: hook
    kind: hook
    title: "Hai hệ tìm kiếm, hai thang điểm, một trang kết quả"
    checks:
      - "round(12.4 + 0.79, 2) == 13.19 and round(11.9 + 0.83, 2) == 12.73"
    steps:
      - show: |
          <p>Cửa hàng chạy song song hai hệ cho cùng câu hỏi (số minh hoạ):</p>
          <table class="t"><tr><th>hạng</th><th>theo từ khoá (điểm 0 tới vài chục)</th><th>theo vector (cosin 0 tới 1)</th></tr>
          <tr><td>1</td><td>A — 12,4</td><td>B — 0,83</td></tr>
          <tr><td>2</td><td>B — 11,9</td><td>E — 0,81</td></tr>
          <tr><td>3</td><td>C — 6,0</td><td>A — 0,79</td></tr>
          <tr><td>4</td><td>D — 5,5</td><td>C — 0,70</td></tr></table>
          <div class="box key">Hôm nay ta trả lời: ghép hai danh sách thế nào khi hai thang điểm khác hẳn nhau? Vì sao cộng thẳng điểm lại hỏng? Và làm sao biết bản ghép tốt hơn?</div>
        focus: [1, "2.2", "2.3", 0, 3]
        say: "Chào bạn, cửa hàng chạy song song hai hệ tìm kiếm cho cùng một câu hỏi, đây là số minh hoạ. Hệ theo từ khoá xếp A đầu với điểm 12 phẩy 4, rồi B, C, D, thang điểm từ 0 tới vài chục. Hệ theo vector xếp B đầu với cosin 0 phẩy 83, rồi E, A, C, thang điểm từ 0 tới 1. Trang kết quả chỉ có một danh sách, nên phải ghép hai danh sách này lại. Hôm nay ta trả lời ba câu hỏi, ghép thế nào khi hai thang điểm khác hẳn nhau, vì sao cộng thẳng điểm lại hỏng, và làm sao biết bản ghép tốt hơn."

  - id: prereq
    kind: prereq
    title: "Ôn lại: hai loại điểm, hạng nghịch đảo, phân số nhỏ"
    checks:
      - "round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956 and alg.irs_rr([0, 0, 1]) == 1 / 3"
      - "round(1 / 61, 6) == 0.016393 and round(1 / 61 + 1 / 63, 5) == 0.03227"
    steps:
      - show: |
          <table class="t"><tr><th>đã học</th><th>điểm là gì</th><th>thang</th></tr>
          <tr><td>khoá Kỹ thuật dữ liệu: công thức xếp hạng theo từ khoá</td><td>tổng theo từng từ: độ hiếm nhân phần tần suất đã bão hoà</td><td>từ 0, không có trần (ví dụ 0,646)</td></tr>
          <tr><td>bài 2–3: vector</td><td>cosin của góc giữa hai vector</td><td>0 tới 1 (ví dụ 0,956)</td></tr>
          <tr><td>bài 0: hạng nghịch đảo</td><td>1 chia vị trí của kết quả đúng đầu tiên</td><td>vị trí 3 cho $\frac{1}{3}$</td></tr></table>
        introduces: [frac]
        focus: ["1.2", "1.2", "1.3", "1.4"]
        say: "Điều thứ nhất, ở khoá Kỹ thuật dữ liệu, công thức xếp hạng theo từ khoá cộng theo từng từ, độ hiếm nhân phần tần suất đã bão hoà. Điểm đó đi từ 0 lên mà không có trần, ví dụ 0 phẩy 646. Ở bài 2 và bài 3, điểm theo vector là cosin của góc giữa hai vector, luôn từ 0 tới 1, ví dụ 0 phẩy 956. Ở bài 0, hạng nghịch đảo là 1 chia vị trí, kết quả đúng ở vị trí 3 thì được 1 phần 3."
      - show: |
          <p><b>Phân số nhỏ.</b> $\frac{1}{61} \approx 0{,}016393$. Cộng hai phân số nhỏ: đổi từng cái ra số thập phân rồi cộng, giữ đủ chữ số:</p>
          $$\frac{1}{61} + \frac{1}{63} \approx 0{,}016393 + 0{,}015873 = 0{,}032266 \approx 0{,}03227$$
        introduces: [approx]
        focus: [1, 2]
        say: "Điều thứ hai là phân số nhỏ, 1 chia 61 xấp xỉ 0 phẩy 016393. Muốn cộng 1 chia 61 với 1 chia 63, ta đổi từng phân số ra số thập phân rồi cộng, giữ đủ chữ số, được khoảng 0 phẩy 032266, làm tròn là 0 phẩy 03227."

  - id: sym
    kind: symbol
    title: "Giải mã: hạng r, hằng số k, điểm hợp nhất"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>$r_j(d)$</td><td>hạng của văn bản $d$ trong danh sách thứ $j$</td><td>A: hạng 1 ở từ khoá, hạng 3 ở vector</td></tr>
          <tr><td>$k$</td><td>hằng số làm dịu, ở bài này <b>không phải</b> “k dòng đầu” của bài 0</td><td>60</td></tr>
          <tr><td>$\frac{1}{k + r}$</td><td>điểm một danh sách cho văn bản ở hạng $r$</td><td>hạng 1: $\frac{1}{61}$</td></tr>
          <tr><td>điểm hợp nhất</td><td>cộng điểm của mọi danh sách có văn bản đó</td><td>vắng mặt thì góp 0</td></tr></table>
        introduces: [sub]
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã từng ký hiệu, r j của d là hạng của văn bản d trong danh sách thứ j, như A hạng 1 ở danh sách từ khoá và hạng 3 ở danh sách vector. Chữ k ở bài này là một hằng số làm dịu, bằng 60, không phải k dòng đầu của bài 0. Phân số 1 chia k cộng r là điểm mà một danh sách cho văn bản ở hạng r, hạng 1 được 1 chia 61. Điểm hợp nhất là tổng điểm của mọi danh sách có văn bản đó, còn danh sách không có nó thì góp 0."

