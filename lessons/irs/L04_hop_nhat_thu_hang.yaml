  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hai hệ, hai thang điểm</span><span class="a">→</span>
          <span class="n">bỏ điểm, giữ hạng</span><span class="a">→</span>
          <span class="n">mỗi danh sách cho $\frac{1}{k + r}$</span><span class="a">→</span>
          <span class="n">cộng các phiếu, xếp lại</span><span class="a">→</span>
          <span class="n">đo bản ghép bằng nDCG</span></div>
        say: "Tổng kết lại, hai hệ có hai thang điểm khác nhau, nên ta bỏ điểm và chỉ giữ hạng. Mỗi danh sách bỏ một lá phiếu 1 chia k cộng r, ta cộng các phiếu rồi xếp lại, và cuối cùng đo bản ghép bằng độ đo xếp hạng."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi cộng hai con số, hỏi “chúng có cùng đơn vị không?”. Hạng thì cùng đơn vị, điểm thô thì không.</div>
        say: "Điều cần mang theo, trước khi cộng hai con số, hãy hỏi chúng có cùng đơn vị không. Hạng thì cùng đơn vị ở mọi hệ, còn điểm thô thì không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): học để xếp hạng — thay vì ghép bằng tay, cho máy học hàm xếp hạng từ các cặp “văn bản này tốt hơn văn bản kia”.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học để xếp hạng, thay vì ghép bằng tay, ta cho máy học hàm xếp hạng từ những cặp văn bản này tốt hơn văn bản kia. Hẹn gặp bạn ở bài tiếp theo."
