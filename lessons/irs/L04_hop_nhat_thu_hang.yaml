        say: "Bảng giải mã từng ký hiệu, r j của d là hạng của văn bản d trong danh sách thứ j, như A hạng 1 ở danh sách từ khoá và hạng 3 ở danh sách vector. Chữ k ở bài này là một hằng số làm dịu, bằng 60, không phải k dòng đầu của bài 0. Phân số 1 chia k cộng r là điểm mà một danh sách cho văn bản ở hạng r, hạng 1 được 1 chia 61. Điểm hợp nhất là tổng điểm của mọi danh sách có văn bản đó, còn danh sách không có nó thì góp 0."

