  - id: formula
    kind: formula
    title: "Suy ra số phép so của tìm theo cụm"
    checks:
      - "alg.irs_ivf_cost(10 ** 6, 1000, 10) == 11000 and 10 ** 6 // 1000 == 1000"
      - "round(10 ** 6 / alg.irs_ivf_cost(10 ** 6, 1000, 10), 1) == 90.9 and round(10 ** 6 / alg.irs_ivf_cost(10 ** 6, 1000, 10)) == 91"
      - "[alg.irs_ivf_cost(10 ** 6, L, 10) for L in (100, 1000, 10000)] == [100100, 11000, 11000] and round(alg.irs_ivf_cost(10 ** 6, 3162, 10)) == 6325"
      - "alg.irs_ivf_cost(10 ** 6, 1000, 1) == 2000 and math.isqrt(10 ** 6) == 1000 and round(math.sqrt(10 * 10 ** 6)) == 3162"
    steps:
      - show: |
          <p><b>Bước 1 — so với các tâm.</b> Muốn biết cụm nào gần, phải so câu hỏi với <b>mọi tâm</b>: $L$ phép so.</p>
          <p><b>Bước 2 — duyệt các cụm đã chọn.</b> Giả sử các cụm đều nhau, mỗi cụm có $\frac{n}{L}$ vector. Xét $m$ cụm thì thêm $m \cdot \frac{n}{L}$ phép so:</p>
          $$\text{số phép so} = L + m \cdot \frac{n}{L}$$
        focus: [1, 2, 3]
        say: "Bước một, muốn biết cụm nào gần câu hỏi thì phải so câu hỏi với mọi tâm, tốn L phép so. Bước hai, giả sử các cụm đều nhau, mỗi cụm có n chia L vector, nên xét m cụm thì thêm m nhân n chia L phép so. Cộng lại, số phép so bằng L cộng m nhân n chia L."
      - show: |
          <p><b>Bước 3 — thay số.</b> $n = 10^6$, $L = 1000$, $m = 10$: mỗi cụm có 1000 vector, nên</p>
          $$1000 + 10 \cdot 1000 = \hlg{11\,000} \text{ phép so} \qquad \frac{1\,000\,000}{11\,000} \approx 90{,}9 \approx \hlb{91} \text{ lần ít hơn}$$
        focus: [1, 2]
        say: "Bước ba, thay số n bằng 10 mũ 6, L bằng 1000 và m bằng 10, thì mỗi cụm có 1000 vector, vì 1 triệu chia 1000 bằng 1000. Vì vậy số phép so là 1000 cộng 10 nhân 1000, bằng 11 nghìn, so với 1 triệu phép so khi so hết, ít hơn khoảng 90 phẩy 9, tức chừng 91 lần."
      - clear: true
        show: |
          <p><b>Bước 4 — chọn bao nhiêu cụm?</b> Ít cụm thì mỗi cụm to; nhiều cụm thì tốn so với tâm. Thử với $m = 10$:</p>
          <table class="t"><tr><th>$L$</th><th>100</th><th>1000</th><th>3162</th><th>10&nbsp;000</th></tr>
          <tr><td>$L + 10 \cdot \frac{10^6}{L}$</td><td>100&nbsp;100</td><td>11&nbsp;000</td><td>$\hlg{\approx 6325}$</td><td>11&nbsp;000</td></tr></table>
          <p class="note">Nhỏ nhất khi hai phần bằng nhau, $L \approx \sqrt{m \cdot n}$. Với $m = 1$ là $L = \sqrt{10^6} = 1000$, tổng 2000 — gần với khuyến nghị “số cụm xấp xỉ căn số vector” của nhóm tác giả thư viện tìm kiếm năm 2017.</p>
        focus: [1, "2.2", 3, 3]
        say: "Bước bốn, chọn bao nhiêu cụm, ít cụm thì mỗi cụm to, nhiều cụm thì tốn công so với tâm. Thử với m bằng 10, L bằng 100 tốn hơn 100 nghìn phép so, L bằng 1000 tốn 11 nghìn, L khoảng 3162 tốn chừng 6325, còn L bằng 10 nghìn lại tăng về 11 nghìn. Tổng nhỏ nhất khi hai phần bằng nhau, vì khi đó không phần nào thừa, tức L xấp xỉ căn của m nhân n. Với m bằng 1, đó là căn của 10 mũ 6, bằng 1000, khớp khuyến nghị số cụm xấp xỉ căn số vector trong bài báo năm 2017 về thư viện tìm kiếm."

  - id: example
    kind: example
    title: "Kho 12 điểm: tìm chính xác, rồi tìm theo cụm"
    checks:
      - "[alg.irs_sqdist((3, 1), c) for c in [(1, 1), (6, 1), (3, 5)]] == [4, 9, 16]"
      - "[alg.irs_sqdist((3, 1), p) for p in [(0, 1), (1, 0), (2, 1), (1, 2)]] == [9, 5, 1, 5]"
      - "min(alg.irs_sqdist((3, 1), p) for p in [(0, 1), (1, 0), (2, 1), (1, 2), (3.5, 1), (6, 0), (8.5, 1), (6, 2), (2, 5), (3, 4), (4, 5), (3, 6)]) == 0.25"
      - "[alg.irs_sqdist((3, 1), p) for p in [(3.5, 1), (6, 0), (8.5, 1), (6, 2)]] == [0.25, 10, 30.25, 10]"
      - "3 + 4 == 7 and 3 + 8 == 11 and round(7 / 12, 2) == 0.58"
    steps:
      - show: |
          <p><b>Bước 1.</b> So $q = (3, 1)$ với ba tâm (bình phương khoảng cách):</p>
          <table class="t"><tr><th>tâm</th><th>A (1, 1)</th><th>B (6, 1)</th><th>C (3, 5)</th></tr>
          <tr><td>phép tính</td><td>$2^2 + 0^2$</td><td>$3^2 + 0^2$</td><td>$0^2 + 4^2$</td></tr>
          <tr><td>kết quả</td><td>$\hlg{4}$</td><td>9</td><td>16</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước một, so câu hỏi q bằng 3, 1 với ba tâm bằng bình phương khoảng cách. Tới tâm A là 2 bình phương cộng 0, bằng 4, tới tâm B là 3 bình phương, bằng 9, tới tâm C là 4 bình phương, bằng 16. Tâm A gần nhất, rồi đến B, rồi đến C."
      - show: |
          <p><b>Bước 2.</b> Với $m = 1$, chỉ duyệt 4 điểm của cụm A:</p>
          <table class="t"><tr><th>điểm cụm A</th><th>(0, 1)</th><th>(1, 0)</th><th>(2, 1)</th><th>(1, 2)</th></tr>
          <tr><td>bình phương khoảng cách</td><td>9</td><td>5</td><td>$\hlb{1}$</td><td>5</td></tr></table>
          <p class="note">Trả về (2, 1), sau $3 + 4 = 7$ phép so.</p>
        focus: [1, "2.2", 3]
        say: "Bước hai, với m bằng 1 ta chỉ duyệt 4 điểm của cụm A, được các bình phương khoảng cách 9, 5, 1 và 5. Điểm gần nhất trong cụm A là 2, 1 với khoảng cách bình phương bằng 1. Vậy hệ trả về điểm 2, 1, sau 3 cộng 4 bằng 7 phép so."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Tìm chính xác, so cả 12 điểm: nhỏ nhất là $(3{,}5;\ 1)$ với $0{,}5^2 = \hl{0{,}25}$, ở <b>cụm B</b>. Với $m = 1$, độ phủ ở 1 láng giềng là $\frac{0}{1} = 0$.</p>
          <table class="t"><tr><th>điểm cụm B</th><th>(3,5; 1)</th><th>(6, 0)</th><th>(8,5; 1)</th><th>(6, 2)</th></tr>
          <tr><td>bình phương khoảng cách</td><td>$\hl{0{,}25}$</td><td>10</td><td>30,25</td><td>10</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Bước ba, tìm chính xác thì phải so cả 12 điểm, và điểm gần nhất là 3 phẩy 5, 1 với bình phương khoảng cách 0 phẩy 25, nằm ở cụm B. Vì vậy với m bằng 1, độ phủ ở 1 láng giềng là 0 chia 1, bằng 0, ta đã sót. Bảng cho bốn điểm của cụm B, điểm ở mép trái chỉ cách q 0 phẩy 25, gần hơn mọi điểm của cụm A."
      - show: |
          <p><b>Bước 4.</b> Với $m = 2$, mở cụm A và B: $3 + 8 = \hlg{11}$ phép so, tìm đúng $(3{,}5;\ 1)$, độ phủ 1. Với $m = 1$ chỉ tốn $\frac{7}{12} \approx 0{,}58$ công so hết, nhưng sót.</p>
          <p class="note">Láng giềng thật hay nằm sát ranh giới hai cụm: tâm gần nhất không bảo đảm điểm gần nhất ở trong cụm đó.</p>
        focus: [1, 1, 2]
        say: "Bước bốn, với m bằng 2 ta mở cụm A và cụm B, tốn 3 cộng 8 bằng 11 phép so, và tìm đúng điểm 3 phẩy 5, 1, độ phủ bằng 1. Với m bằng 1, ta chỉ tốn 7 phần 12, khoảng 0 phẩy 58 công so hết, nhưng lại sót. Láng giềng thật hay nằm sát ranh giới hai cụm, và tâm gần nhất không bảo đảm điểm gần nhất nằm trong cụm đó."

  - id: check
    kind: check
    title: "Tự kiểm: đo thật trên 5000 điểm ngẫu nhiên"
    checks:
      - "alg.irs_ivf_sim() == [(1, 0.804, 159), (2, 0.948, 231), (4, 1.0, 402), (8, 1.0, 776)]"
      - "round(math.sqrt(5000)) == 71 and alg.irs_ivf_cost(5000, 70, 1) < 159 < 5000"
    steps:
      - show: |
          <p>Đường khác: không tính bằng công thức mà <b>chạy thật</b>. Sinh 5000 điểm 8 chiều quanh 40 đám, học 70 tâm bằng K trung bình ($70 \approx \sqrt{5000}$), hỏi 50 câu, so với tìm chính xác ở 10 láng giềng:</p>
          <table class="t"><tr><th>số cụm xét $m$</th><th>1</th><th>2</th><th>4</th><th>8</th><th>so hết</th></tr>
          <tr><td>độ phủ ở 10</td><td>$\hl{0{,}804}$</td><td>0,948</td><td>$\hlg{1}$</td><td>1</td><td>1</td></tr>
          <tr><td>số phép so trung bình</td><td>159</td><td>231</td><td>402</td><td>776</td><td>5000</td></tr></table>
          <p class="note">Công thức đều cụm dự đoán $70 + \frac{5000}{70} \approx 141$ với $m = 1$; đo thật 159, vì cụm gần câu hỏi thường đông hơn trung bình.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Kiểm tra đi đường khác, ta không tính bằng công thức mà chạy thật. Sinh 5000 điểm 8 chiều quanh 40 đám, học 70 tâm bằng K trung bình, hỏi 50 câu, rồi so với tìm chính xác ở 10 láng giềng. Với m bằng 1, độ phủ chỉ 0 phẩy 804, tức cứ 10 láng giềng thật thì sót khoảng 2, và tăng lên 0 phẩy 948 rồi 1 khi xét 2 và 4 cụm. Số phép so trung bình là 159, 231, 402, vẫn nhỏ hơn rất nhiều so với 5000. Công thức đều cụm dự đoán khoảng 141 phép so, còn đo thật là 159, vì cụm gần câu hỏi thường đông hơn trung bình."

  - id: graph
    kind: concept
    title: "Cách khác: đồ thị nhiều tầng, và điều thư viện có thật cho thấy"
    checks:
      - "math.ceil(math.log2(10 ** 6)) == 20"
    steps:
      - show: |
          <table class="t"><tr><th>cách tìm gần đúng</th><th>ý chính</th><th>nguồn</th></tr>
          <tr><td>chia cụm (tệp ngược)</td><td>so với tâm, mở vài cụm; thường dùng số cụm ≈ căn số vector</td><td>Johnson, Douze, Jégou 2017</td></tr>
          <tr><td>đồ thị nhiều tầng (HNSW)</td><td>mỗi điểm nối với hàng xóm; tầng trên thưa để nhảy xa, tầng dưới dày để dò kỹ; số bước tăng theo lôgarit của $n$</td><td>Malkov, Yashunin 2016</td></tr></table>
          <p class="note">Với $n = 10^6$, $\log_2 n \approx 20$ (minh hoạ cho “tăng chậm”). Cả hai đều định nghĩa chất lượng bằng <b>độ phủ</b> so với tìm chính xác. Đội gợi ý video năm 2016 ghi: kết quả thử nghiệm hai nhóm không nhạy với việc chọn thuật toán láng giềng gần.</p>
        focus: [0, "1.2", "1.3", 2, 2]
        say: "Chia cụm không phải cách duy nhất, bảng so hai cách tìm gần đúng phổ biến. Cách chia cụm so với tâm rồi mở vài cụm, và nhóm tác giả năm 2017 thường dùng số cụm xấp xỉ căn số vector. Cách đồ thị nhiều tầng nối mỗi điểm với hàng xóm, tầng trên thưa để nhảy xa, tầng dưới dày để dò kỹ, và số bước tăng theo lôgarit của n. Cả hai đều đo chất lượng bằng độ phủ so với tìm chính xác. Bài báo năm 2016 của đội gợi ý video còn ghi rằng kết quả thử nghiệm hai nhóm không nhạy với việc chọn thuật toán láng giềng gần."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "alg.irs_ivf_sim()[0][1] == 0.804 and alg.irs_ivf_sim()[0][2] == 159"
      - "1000 + 9 * 1000 + 201000 == 211000 and round(211000 / 11000) == 19"
      - "alg.irs_ivf_sim(probes=(1,))[0][1] < alg.irs_ivf_sim(probes=(4,))[0][1]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Báo “nhanh gấp 31 lần” mà không báo độ phủ <b class="red">(m = 1: 159 so với 5000 phép so, nhưng độ phủ chỉ 0,804)</b>
          <br><span class="note">Nhanh mà sót kết quả đúng là vô ích. Phép thử: mọi con số tốc độ đi kèm độ phủ so với tìm chính xác trên cùng câu hỏi.</span></div>
        say: "Lỗi thứ nhất là báo nhanh gấp khoảng 31 lần, 159 so với 5000 phép so, mà không báo độ phủ chỉ 0 phẩy 804. Nhanh mà sót kết quả đúng thì vô ích. Phép thử là mọi con số tốc độ phải đi kèm độ phủ so với tìm chính xác, trên cùng các câu hỏi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tin công thức đều cụm cho mọi câu hỏi <b class="red">(đo thật 159 thay vì 141)</b>
          <br><span class="note">Câu hỏi hay rơi vào vùng đông, nên cụm được mở thường to hơn trung bình. Phép thử: đo số phép so trên câu hỏi thật, không chỉ chia trung bình.</span></div>
        say: "Lỗi thứ hai là tin công thức đều cụm cho mọi câu hỏi, đo thật ra 159 chứ không phải 141. Câu hỏi hay rơi vào vùng đông người, nên cụm được mở thường to hơn trung bình. Phép thử là đo số phép so trên chính các câu hỏi thật, không chỉ chia trung bình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Học tâm cụm một lần, rồi đổ 200&nbsp;000 sản phẩm mới vào chỉ mục cũ <b class="red">(chúng dồn vào một cụm)</b></div>
          <table class="t"><tr><th></th><th>số phép so khi câu hỏi mở cụm đó (m = 10)</th></tr>
          <tr><td>như thiết kế</td><td>$1000 + 10 \cdot 1000 = 11\,000$</td></tr>
          <tr><td>một cụm phình lên 201&nbsp;000</td><td>$1000 + 9 \cdot 1000 + 201\,000 = \hl{211\,000}$, chậm ≈ 19 lần</td></tr></table>
          <p class="note">Phép thử: theo dõi kích thước từng cụm; dữ liệu đổi nhiều thì học lại tâm.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là học tâm cụm một lần, rồi đổ 200 nghìn sản phẩm mới vào chỉ mục cũ, và chúng dồn vào một cụm. Như thiết kế, câu hỏi tốn 11 nghìn phép so. Nhưng khi mở trúng cụm đã phình lên 201 nghìn vector, câu hỏi tốn 211 nghìn phép so, chậm khoảng 19 lần. Phép thử là theo dõi kích thước từng cụm, và học lại tâm khi dữ liệu đổi nhiều."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chọn $m$ bằng một câu hỏi thử “trông ổn” <b class="red">(một câu đúng không nói gì về 50 câu)</b>
          <br><span class="note">Đo đường cong độ phủ theo $m$ trên tập câu hỏi thật, chọn $m$ nhỏ nhất đạt mức độ phủ đã cam kết (ví dụ 0,95), rồi đo lại độ trễ ở tải thật.</span></div>
        say: "Lỗi thứ tư cũng của người đã đi làm, là chọn m bằng một câu hỏi thử trông có vẻ ổn. Một câu đúng không nói gì về 50 câu. Hãy đo đường cong độ phủ theo m trên tập câu hỏi thật, chọn m nhỏ nhất đạt mức độ phủ đã cam kết, ví dụ 0 phẩy 95, rồi đo lại độ trễ ở tải thật."

  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chọn m cho cam kết độ phủ 0,95"
    checks:
      - "alg.irs_ivf_cost(4 * 10 ** 6, 2000, 1) == 4000 and alg.irs_ivf_cost(4 * 10 ** 6, 2000, 20) == 42000 and round(4 * 10 ** 6 / 42000) == 95"
      - "[r for m, r, c in alg.irs_ivf_sim()] == [0.804, 0.948, 1.0, 1.0] and min(m for m, r, c in alg.irs_ivf_sim() if r >= 0.95) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Kho 4 triệu vector, chia 2000 cụm. Số phép so với $m = 1$ và $m = 20$? Ít hơn so hết bao nhiêu lần với $m = 20$?</td></tr>
          <tr><td>2</td><td>Dùng bảng đo thật (m = 1, 2, 4, 8 cho độ phủ 0,804; 0,948; 1; 1): cam kết độ phủ ít nhất 0,95, chọn $m$ nào?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn. Câu một, kho 4 triệu vector chia 2000 cụm, tính số phép so với m bằng 1 và m bằng 20, và với m bằng 20 thì ít hơn so hết bao nhiêu lần. Câu hai, dùng bảng đo thật ở phần tự kiểm, cam kết độ phủ ít nhất 0 phẩy 95 thì chọn m nào. Dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> Mỗi cụm có $\frac{4\,000\,000}{2000} = 2000$ vector.</p>
          $$m = 1\!: 2000 + 2000 = 4000 \qquad m = 20\!: 2000 + 20 \cdot 2000 = \hlg{42\,000} \qquad \frac{4\,000\,000}{42\,000} \approx 95 \text{ lần}$$
        focus: [1, 2, 2]
        say: "Đáp án câu một, mỗi cụm có 4 triệu chia 2000, bằng 2000 vector. Với m bằng 1, số phép so là 2000 cộng 2000, bằng 4000, còn với m bằng 20 là 2000 cộng 20 nhân 2000, bằng 42 nghìn. So với 4 triệu phép so khi so hết, m bằng 20 ít hơn khoảng 95 lần."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>m = 1</th><th>m = 2</th><th>m = 4</th></tr>
          <tr><td>độ phủ</td><td>0,804 (chưa đạt)</td><td>0,948 (chưa đạt)</td><td>$\hlg{1}$ (đạt)</td></tr>
          <tr><td>số phép so</td><td>159</td><td>231</td><td>402</td></tr></table>
          <p class="note">Chọn $m = 4$: nhỏ nhất đạt cam kết. 0,948 sát 0,95 nhưng vẫn dưới — cam kết là cam kết. Điều kiện đổi: nếu độ trễ ở tải thật vượt ngân sách, thương lượng lại mức độ phủ hoặc chia lại cụm, đừng lặng lẽ hạ $m$.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Câu hai, đặt ba cột cạnh nhau. Với m bằng 1, độ phủ 0 phẩy 804, chưa đạt, với m bằng 2 là 0 phẩy 948, sát nhưng vẫn dưới 0 phẩy 95, còn m bằng 4 đạt 1 với 402 phép so. Vậy ta chọn m bằng 4, giá trị nhỏ nhất đạt cam kết. Nếu độ trễ ở tải thật vượt ngân sách, hãy thương lượng lại mức độ phủ hoặc chia lại cụm, đừng lặng lẽ hạ m."

  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vector nhúng dày đặc</span><span class="a">→</span>
          <span class="n">so hết: n phép so</span><span class="a">→</span>
          <span class="n">chia cụm: $L + m \cdot \frac{n}{L}$</span><span class="a">→</span>
          <span class="n">nhanh hơn, có thể sót</span><span class="a">→</span>
          <span class="n">chọn m theo độ phủ đo thật</span></div>
        say: "Tổng kết lại, truy hồi dày dùng vector nhúng dày đặc, so hết thì tốn n phép so. Chia cụm chỉ tốn L cộng m nhân n chia L, nhanh hơn nhiều nhưng có thể sót láng giềng nằm sát ranh giới. Vì vậy ta chọn m theo độ phủ đo thật trên câu hỏi thật."
      - show: |
          <div class="box key"><b>Tư duy:</b> tìm gần đúng là một <b>đánh đổi có giá</b> — mỗi con số tốc độ phải đi kèm độ phủ so với tìm chính xác, đo trên câu hỏi thật.</div>
        say: "Điều cần mang theo, tìm gần đúng là một đánh đổi có giá, và mỗi con số tốc độ phải đi kèm độ phủ so với tìm chính xác, đo trên câu hỏi thật."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): truy hồi lai — ghép danh sách tìm theo từ khoá với danh sách tìm theo vector bằng hợp nhất thứ hạng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học truy hồi lai, ghép danh sách tìm theo từ khoá với danh sách tìm theo vector bằng cách hợp nhất thứ hạng, thay vì cộng thẳng hai loại điểm. Hẹn gặp bạn ở bài tiếp theo."
