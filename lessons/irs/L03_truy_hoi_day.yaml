id: L03
course: IRS
series: "IRS · Truy hồi thông tin và hệ gợi ý"
title: "Bài 3 — Truy hồi dày và tìm láng giềng gần đúng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/irs.yaml L03; audit/irs/verify_irs.py (verify_parts/L03.py); audit/irs/sources_L03.md (câu trích nguyên văn, đọc 2026-11-03); J. Johnson, M. Douze, H. Jégou, Billion-scale similarity search with GPUs, arXiv 1702.08734 (2017) [JO17f]; Yu. Malkov, D. Yashunin, HNSW, arXiv 1603.09320 [MA16]; P. Covington và cộng sự, RecSys 2016 [CO16]; IRS bài 2; CS115 bài 29 (K trung bình); LLM bài 3 (vector nhúng)"
assumes: [arith, frac, approx, sqrt, sub, cdot, power, log]
# Quy ước: n = số vector trong kho; L = số cụm (danh sách) của chỉ mục chia cụm; m = số cụm gần nhất được xét cho mỗi câu hỏi
#   ([JO17f] gọi là tham số dò nhiều cụm τ; bài dùng m cho dễ đọc). Khoảng cách dùng BÌNH PHƯƠNG khoảng cách Euclid như K trung bình
#   ở CS115 bài 29. “Phép so” = một lần tính khoảng cách giữa câu hỏi và một vector (hoặc một tâm). Độ phủ của tìm gần đúng = số láng
#   giềng thật tìm được chia k ([MA16]). Máy “1 tỉ phép nhân mỗi giây”, vector 256 chiều, kho 1 triệu: SỐ MINH HOẠ. Số đo độ phủ ở bảng
#   cuối là đo thật trên dữ liệu sinh ngẫu nhiên có hạt giống cố định (alg.irs_ivf_sim), không phải số của một hệ thật.
#   FAISS, HNSW, IVF chỉ trên màn hình; lời đọc nói “chỉ mục chia cụm”, “đồ thị nhiều tầng”.
objectives:
  - "Ước lượng số phép so khi chia vector thành cụm và chỉ xét vài cụm gần nhất"
  - "Đọc đánh đổi giữa độ phủ và số phép so (độ trễ) của tìm gần đúng"
  - "Báo cáo tìm gần đúng kèm độ phủ so với tìm chính xác"
scenes:
  - id: hook
    kind: hook
    title: "Một triệu vector, 256 mi li giây cho mỗi câu hỏi"
    checks:
      - "10 ** 6 * 256 == 256000000 and 256000000 / 10 ** 9 * 1000 == 256"
    steps:
      - show: |
          <p>Kho có <b>1 triệu sản phẩm</b>, mỗi sản phẩm là một vector nhúng <b>256 chiều</b> (số minh hoạ). Muốn tìm sản phẩm gần câu hỏi nhất, cách thật thà là so với tất cả:</p>
          $$10^6 \text{ vector} \cdot 256 \text{ phép nhân} = 256 \text{ triệu phép nhân}$$
          <p>Máy làm 1 tỉ phép nhân mỗi giây (minh hoạ): <b>256 mi li giây</b> cho một câu hỏi, trong khi trang gợi ý chỉ được vài chục mi li giây.</p>
          <div class="box key">Hôm nay ta trả lời: làm sao chỉ so với một phần nhỏ của kho? Bớt được bao nhiêu phép so? Và phải trả giá gì?</div>
        introduces: [power, cdot]
        focus: [1, 2, 3, 4]
        say: "Chào bạn, kho có 1 triệu sản phẩm, mỗi sản phẩm là một vector nhúng 256 chiều, đây là số minh hoạ. Cách thật thà là so câu hỏi với tất cả, 10 mũ 6 vector nhân 256 phép nhân, dấu chấm là phép nhân, tức 256 triệu phép nhân. Máy làm 1 tỉ phép nhân mỗi giây thì mất 256 mi li giây cho một câu hỏi, trong khi trang gợi ý chỉ được vài chục mi li giây. Hôm nay ta trả lời ba câu hỏi, làm sao chỉ so với một phần nhỏ của kho, bớt được bao nhiêu phép so, và phải trả giá gì."

  - id: prereq
    kind: prereq
    title: "Ôn lại: vector nhúng, bình phương khoảng cách, K trung bình"
    checks:
      - "alg.irs_sqdist((3, 1), (2, 1)) == 1 and alg.irs_sqdist((3, 1), (1, 1)) == 4 and alg.irs_sqdist((3, 1), (3.5, 1)) == 0.25"
      - "[sum(c) / 4 for c in zip((0, 1), (1, 0), (2, 1), (1, 2))] == [1, 1]"
    steps:
      - show: |
          <p><b>① Ở bài 2</b>, văn bản là vector trọng số, phần lớn thành phần bằng 0. Ở khoá Mô hình ngôn ngữ lớn, <b>vector nhúng</b> là vector số thực dày đặc, hàng trăm chiều, văn bản gần nghĩa thì gần nhau. Tìm theo vector nhúng gọi là <b>truy hồi dày</b>.</p>
          <p><b>② Bình phương khoảng cách</b>: hiệu từng thành phần, bình phương, rồi cộng. Từ $q = (3, 1)$ tới $(2, 1)$: $(3 - 2)^2 + (1 - 1)^2 = 1$; tới $(1, 1)$: $2^2 + 0 = 4$; tới $(3{,}5;\ 1)$: $0{,}5^2 = 0{,}25$.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Điều thứ nhất, ở bài 2 văn bản là vector trọng số mà phần lớn thành phần bằng 0. Ở khoá Mô hình ngôn ngữ lớn, vector nhúng là vector số thực dày đặc, hàng trăm chiều, văn bản gần nghĩa thì nằm gần nhau. Tìm theo vector nhúng như vậy gọi là truy hồi dày. Điều thứ hai, bình phương khoảng cách là lấy hiệu từng thành phần, bình phương, rồi cộng lại. Từ điểm 3, 1 tới điểm 2, 1 được 1, tới điểm 1, 1 được 4, còn tới điểm 3 phẩy 5, 1 chỉ được 0 phẩy 25."
      - show: |
          <p><b>③ K trung bình</b> (ở khoá Toán cho khoa học máy tính): gán mỗi điểm vào <b>tâm gần nhất</b>, rồi dời mỗi tâm về <b>trung bình</b> các điểm của nó, lặp lại.</p>
          $$\text{cụm } \{(0, 1), (1, 0), (2, 1), (1, 2)\} \Rightarrow \text{tâm} = \left(\frac{0 + 1 + 2 + 1}{4},\ \frac{1 + 0 + 1 + 2}{4}\right) = (1, 1)$$
        introduces: [frac, set, implies]
        focus: [1, 2, 2]
        say: "Điều thứ ba là K trung bình, ở khoá Toán cho khoa học máy tính, ta gán mỗi điểm vào tâm gần nhất, rồi dời mỗi tâm về trung bình các điểm của nó, và lặp lại. Ví dụ cụm gồm bốn điểm trong ngoặc móc nhọn, mũi tên kép nghĩa là suy ra tâm của cụm. Trung bình hoành độ là 4 chia 4, trung bình tung độ cũng 4 chia 4, nên tâm là điểm 1, 1."

  - id: sym
    kind: symbol
    title: "Giải mã: n, L, m và độ phủ của tìm gần đúng"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ của bài</th></tr>
          <tr><td>$n$</td><td>số vector trong kho</td><td>1 triệu</td></tr>
          <tr><td>$L$</td><td>số cụm của chỉ mục chia cụm, mỗi cụm có một tâm và một danh sách vector</td><td>1000</td></tr>
          <tr><td>$m$</td><td>số cụm gần nhất được xét cho mỗi câu hỏi</td><td>10</td></tr>
          <tr><td>độ phủ ở $k$</td><td>số láng giềng thật tìm được chia $k$</td><td>9 trên 10 = 0,9</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã bốn ký hiệu, chữ n là số vector trong kho, ví dụ 1 triệu. Chữ L hoa là số cụm của chỉ mục chia cụm, mỗi cụm có một tâm và một danh sách vector, ví dụ 1000 cụm. Chữ m là số cụm gần nhất được xét cho mỗi câu hỏi, ví dụ 10. Độ phủ ở k láng giềng là số láng giềng thật tìm được chia k, như tìm được 9 trong 10 láng giềng thật thì độ phủ là 0 phẩy 9."

