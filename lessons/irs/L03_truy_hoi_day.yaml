      - "alg.irs_ivf_search([(0, 1), (1, 0), (2, 1), (1, 2), (3.5, 1), (6, 0), (8.5, 1), (6, 2), (2, 5), (3, 4), (4, 5), (3, 6)], [0] * 4 + [1] * 4 + [2] * 4, [(1, 1), (6, 1), (3, 5)], (3, 1), 2) == (4, 11)"
    steps:
