scenes:
- id: hook
  kind: hook
  title: Vì sao cộng 1 vào con trỏ không hề nhảy đúng 1 byte?
  checks:
  - alg.cpr_ptr_offset(3, 4) == 12
  steps:
  - show: <div class='box key'><p>Cho con trỏ <code>int *p</code> và thực hiện <code>p + 3</code>. Địa chỉ không
      tăng thêm <b>3 byte</b> mà nhảy vọt thêm <b>12 byte</b>.</p><p>Con trỏ luôn nhảy theo bội số kích thước phần
      tử <code>sizeof(*p)</code> để trỏ trúng đầu phần tử kế tiếp.</p></div>
    say: Chào bạn, ở bài trước bạn đã biết con trỏ giữ địa chỉ ô nhớ. Nếu lấy một con trỏ số nguyên bốn bai rồi
      cộng thêm ba, địa chỉ trong bộ nhớ không tăng ba bai mà nhảy hẳn mười hai bai. Cơ chế bước nhảy tự động nhân
      theo kích thước phần tử này giúp ngôn ngữ C duyệt qua các phần tử mảng cực kỳ chính xác và nhanh gọn. Tuy
      nhiên nhầm lẫn giữa phần tử và bai lại là nguồn cơn của rất nhiều lỗi vượt biên.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>kiến thức nền đã học</th><th>vai trò ở bài này</th></tr><tr><td>Mỗi phần tử int
      = 4 byte, double = 8 byte (L00)</td><td>Độ rộng một bước nhảy bằng kích thước kiểu mà con trỏ trỏ tới</td></tr><tr><td>Biến
      con trỏ & và * (L04)</td><td>Tên mảng khi truyền vào hàm tự chuyển thành địa chỉ phần tử đầu tiên</td></tr></table>
    say: Ta nối tiếp bài 0 và bài 4 để làm rõ bản chất liên kết giữa mảng và con trỏ. Độ dài mỗi bước dịch chuyển
      luôn phụ thuộc vào kích thước kiểu dữ liệu đích đang trỏ tới. Ngoài ra khi đưa tên mảng làm đối số gọi hàm,
      trình biên dịch chỉ truyền địa chỉ của phần tử đầu tiên.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>*(p + i)</code></td><td>Nhảy
      <code>i × sizeof(*p)</code> byte từ <code>p</code> rồi đọc phần tử thứ <code>i</code> (giống hệt <code>a[i]</code>)</td></tr><tr><td><code>const
      int *p</code></td><td>Con trỏ chỉ đọc dữ liệu đích: hàm được xem mảng nhưng bị cấm sửa phần tử</td></tr><tr><td><code>(const
      char *)p</code></td><td>Ép sang con trỏ 1 byte để tính khoảng cách địa chỉ theo đúng đơn vị byte</td></tr></table>'
    say: Có ba quy ước quan trọng trong số học con trỏ. Biểu thức cộng bước nhảy tương đương với dấu ngoặc vuông
      chỉ số mảng. Từ khoá bảo vệ chỉ đọc cấm hàm sửa mảng nguồn, còn ép sang con trỏ một bai giúp đo đúng khoảng
      cách bai.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Bước nhảy p + 0, p + 1, p + 2, p + 3 trên mảng int 4 byte
  steps:
  - show: <div><svg width="960" height="195" viewBox="0 0 960 195"><rect x="40" y="45" width="200" height="95" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="140.0" y="87" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">p + 0 (+0 B)</text><text x="140.0" y="115" font-size="15" text-anchor="middle"
      fill="#475569">a[0] = 10</text><rect x="265" y="45" width="200" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="2"/><text x="365.0" y="87" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">p
      + 1 (+4 B)</text><text x="365.0" y="115" font-size="15" text-anchor="middle" fill="#475569">a[1] = 20</text><rect
      x="490" y="45" width="200" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="590.0"
      y="87" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">p + 2 (+8 B)</text><text x="590.0"
      y="115" font-size="15" text-anchor="middle" fill="#475569">a[2] = 30</text><rect x="715" y="45" width="200"
      height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="815.0" y="87" font-size="18"
      font-weight="700" text-anchor="middle" fill="#1e293b">p + 3 (+12 B)</text><text x="815.0" y="115" font-size="15"
      text-anchor="middle" fill="#475569">a[3] = 40</text></svg></div>
    say: 'Nhìn bốn ô nhớ kề nhau: phần tử không nằm tại độ lệch không bai, phần tử một tại cộng bốn bai, phần tử
      hai tại cộng tám bai và phần tử ba tại cộng mười hai bai. Mỗi lần tăng con trỏ một đơn vị, địa chỉ thực sự
      dịch chuyển đúng bốn bai sang đầu phần tử kế tiếp. Phép cộng ba vào con trỏ số nguyên bốn bai tương đương
      đi thẳng mười hai bai tới đúng đầu phần tử thứ ba.'
    clear: true
- id: formula
  kind: formula
  title: Công thức số học con trỏ chuẩn C
  checks:
  - alg.cpr_ptr_offset(3, 4) == 12
  - alg.cpr_ptr_offset(3, 8) == 24
  steps:
  - show: '<div class=''box key''><p>Với con trỏ kiểu <code>T *p</code> và số nguyên $k$:</p><p>địa chỉ(p + k) =
      địa chỉ(p) + k × sizeof(T)</p><p>Ví dụ: với <code>int</code> 4 byte, k=3 cho +12 byte; với double 8 byte,
      k=3 cho +24 byte.</p></div>'
    say: 'Công thức chuẩn rất rõ ràng: dịch chuyển theo đơn vị phần tử nhân với kích thước của mỗi phần tử. Với
      số nguyên bốn bai, bước nhảy ba dịch chuyển mười hai bai vì ba nhân bốn bằng mười hai. Với số thực tám bai,
      bước nhảy ba dịch chuyển hai mươi bốn bai vì ba nhân tám bằng hai mươi bốn. Khi trừ hai con trỏ cùng mảng,
      trình biên dịch tự chia lại cho kích thước phần tử.'
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: đo khoảng cách byte và tổng hàm chỉ đọc const'
  checks:
  - alg.cpr_ptr_offset(3, 4) == 12
  - alg.cpr_ptr_offset(3, 8) == 24
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>const int *a,
      size_t n</code></td><td>Truyền mảng vào hàm: luôn kèm độ dài <code>n</code> và gắn <code>const</code> chống
      sửa nhầm</td></tr><tr><td><code>#include &lt;stddef.h&gt;</code> / <code>ptrdiff_t</code> / <code>%td</code></td><td>Kiểu
      có dấu giữ hiệu hai con trỏ cùng mảng và mã in trong <code>printf</code></td></tr><tr><td><code>(ptrdiff_t)((const
      char *)(p + 3) - (const char *)p)</code></td><td>Ép sang con trỏ 1 byte rồi trừ để ra đúng khoảng cách byte</td></tr></table>'
    say: Ta giải mã trước ba quy ước quan trọng dùng trong chương trình mẫu. Hàm tổng nhận con trỏ chỉ đọc ngăn
      sửa mảng gốc. Kiểu hiệu con trỏ có dấu từ thư viện chuẩn định nghĩa hiệu hai con trỏ và in ra bằng mã phần
      trăm t d, sau khi ép về con trỏ một bai để đo khoảng cách thật.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: <p><b>Đo độ lệch byte của p+3 với int và double, cùng sum_const</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>#include &lt;stddef.h&gt;</div><div>static int sum_const(const int *a, size_t n)
      {</div><div>    int s = 0;</div><div>    for (size_t i = 0; i &lt; n; i++) { s += *(a + i); }</div><div>    return
      s;</div><div>}</div><div>int main(void) {</div><div>    int ai[4] = {10, 20, 30, 40};</div><div>    double
      ad[4] = {1.0, 2.0, 3.0, 4.0};</div><div>    ptrdiff_t d_int = (const char *)(ai + 3) - (const char *)ai;</div><div>    ptrdiff_t
      d_dbl = (const char *)(ad + 3) - (const char *)ad;</div><div>    printf("d_int=%td d_dbl=%td sum=%d\n", d_int,
      d_dbl, sum_const(ai, 4));</div><div>    return 0;</div><div>}</div></div>
    say: Chương trình thực nghiệm đo trực tiếp hiệu số bai thật giữa con trỏ gốc và con trỏ đã cộng ba trên hai
      kiểu dữ liệu. Tiếp theo nó gọi hàm cộng tổng mảng chỉ đọc qua từng bước nhảy để đối chiếu lại kết quả.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>d_int=12 d_dbl=24 sum=100</div></div>
    say: Kết quả chạy thật xác nhận bước nhảy ba trên kiểu bốn bai đúng bằng mười hai bai. Trên kiểu tám bai mức
      dịch đúng hai mươi bốn bai, và tổng bốn phần tử trả về chính xác một trăm.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng kích thước mảng khi truyền qua hàm (array decay)
  checks:
  - 10 * 4 == 40
  steps:
  - show: <p><b>Ngoài hàm sizeof(arr)=40; bên trong hàm chỉ nhận con trỏ 8 byte</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>static size_t param_sizeof(const int *p) { return sizeof(p); }</div><div>int main(void)
      {</div><div>    int arr[10] = {0};</div><div>    printf("outer=%zu param=%zu\n", sizeof(arr), param_sizeof(arr));</div><div>    return
      0;</div><div>}</div></div>
    say: 'Ở bài 0 ta từng lưu ý về kích thước mảng bên ngoài và bên trong hàm. Giờ ta chạy thật để thấy rõ: bên
      ngoài đo đủ bốn mươi bai, còn bên trong hàm tham số đã thành con trỏ nên đo được đúng tám bai.'
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>outer=40 param=8</div></div>
    say: Đầu ra thật chứng minh lý do vì sao không bao giờ đo được độ dài mảng ở bên trong hàm bằng toán tử kích
      thước. Bên ngoài là mảng bốn mươi bai, bên trong là con trỏ tám bai nên bắt buộc phải truyền kèm số lượng
      phần tử.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: khoảng cách phần tử vs khoảng cách byte thật'
  checks:
  - alg.cpr_ptr_offset(10000, 4) == 40_000
  - alg.cpr_ptr_offset(10000, 8) == 80_000
  steps:
  - show: <table class='t'><tr><th>bước nhảy k</th><th>trên int * (4 byte)</th><th>trên double * (8 byte)</th><th>trên
      khối 64 byte</th></tr><tr><td><span style='white-space:nowrap'>k = 1 (×1)</span></td><td>+4 byte</td><td>+8
      byte</td><td>+64 byte</td></tr><tr><td><span style='white-space:nowrap'>k = 100 (×100)</span></td><td>+400
      byte</td><td>+800 byte</td><td>+6 400 byte</td></tr><tr><td><span style='white-space:nowrap'>k = 10 000 (×10
      000)</span></td><td>+40 000 byte</td><td>+80 000 byte</td><td>+640 000 byte</td></tr></table>
    say: Nhìn bảng quy mô, khoảng cách bộ nhớ luôn tỉ lệ thuận với cả bước nhảy lẫn kích thước mỗi phần tử. Với
      một bước nhảy trên kiểu tám bai chỉ dịch tám bai. Khi tăng lên một trăm bước nhảy là tám trăm bai, và ở mức
      mười nghìn bước nhảy ta đã đi suốt tám mươi nghìn bai liên tiếp trong bộ nhớ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Dùng <code>sizeof(arr) / sizeof(arr[0])</code> bên trong hàm.</b> Vì tham số mảng tự suy biến thành con
      trỏ 8 byte, công thức đó cho kết quả sai (8/4 = 2)!<br><b>Lỗi 2: Cộng bước nhảy vượt quá sau phần tử <code>n</code>.</b>
      C chỉ cho phép tạo địa chỉ kết thúc ngay sau phần tử cuối (<code>a + n</code>), tuyệt đối không được giải
      tham chiếu nó.<br><b>Lỗi 3: Trừ hai con trỏ thuộc hai mảng tách biệt.</b> Phép trừ chỉ hợp lệ khi cả hai cùng
      nằm trên một mảng.</div></td></tr></table>'
    say: Có ba lỗi thường gặp về số học con trỏ. Gọi toán tử đo kích thước trên tham số mảng trong hàm sẽ cho kết
      quả sai. Ngoài ra cần tránh đọc phần tử ngay sau mảng và không trừ hai địa chỉ khác mảng.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 1000 + alg.cpr_ptr_offset(5, 8) == 1040
  steps:
  - show: <ol><li>Con trỏ <code>double *p</code> đang ở địa chỉ 1000, vậy <code>p + 5</code> trỏ tới địa chỉ bao
      nhiêu (biết <code>sizeof(double) = 8</code>)?</li><li>Vì sao hàm đọc mảng nên khai báo tham số <code>const
      int *a</code> thay vì <code>int *a</code>?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, con trỏ số thực tám bai đang ở địa chỉ một nghìn thì vị trí cộng thêm
      năm nằm ở địa chỉ nào? Câu hai, vì sao hàm chỉ đọc mảng nên thêm từ khoá bảo vệ chỉ đọc vào tham số? Dừng
      vi-đê-ô và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 1000 + 5 × 8 = <b>1040</b>.</p></td></tr></table>
    say: 'Đáp án câu một: năm phần tử nhân tám bai bằng bốn mươi bai, cộng một nghìn thành một nghìn không trăm
      bốn mươi.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Thêm <code>const</code> để trình biên dịch
      chặn ngay ở bước biên dịch nếu hàm lỡ ghi đè mảng đầu vào.</p></td></tr></table>
    say: 'Đáp án câu hai: khai báo chỉ đọc giúp trình biên dịch ngăn mọi thao tác sửa nhầm dữ liệu đầu vào.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài thực hành C và chấm thật
  lab: labs/CPR/L05
  steps:
