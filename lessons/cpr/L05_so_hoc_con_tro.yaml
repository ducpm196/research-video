- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>*(p + i)</code></td><td>Nhảy <code>i × sizeof(*p)</code> byte từ <code>p</code> rồi đọc phần tử thứ <code>i</code> (giống hệt <code>a[i]</code>)</td></tr><tr><td><code>const int *p</code></td><td>Con trỏ chỉ đọc dữ liệu đích: hàm được xem mảng nhưng bị cấm sửa phần tử</td></tr><tr><td><code>(const char *)p</code></td><td>Ép sang con trỏ 1 byte để tính khoảng cách địa chỉ theo đúng đơn vị byte</td></tr></table>'
    say: Có ba quy ước quan trọng trong số học con trỏ. Biểu thức cộng bước nhảy tương đương với dấu ngoặc vuông chỉ số mảng. Từ khoá bảo vệ chỉ đọc cấm hàm sửa mảng nguồn, còn ép sang con trỏ một bai giúp đo đúng khoảng cách bai. Khai báo tham số mảng với từ khoá chỉ đọc khẳng định hợp đồng rõ ràng rằng hàm chỉ đọc mà tuyệt đối không sửa mảng nguồn. Gắn từ khoá chỉ đọc cho tham số địa chỉ mảng là thói quen lập trình phòng thủ bảo vệ mảng nguồn khỏi sửa nhầm.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Bước nhảy p + 0, p + 1, p + 2, p + 3 trên mảng int 4 byte
  steps:
  - show: <div><svg width="960" height="195" viewBox="0 0 960 195"><rect x="40" y="45" width="200" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="140.0" y="87" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">p + 0 (+0 B)</text><text x="140.0" y="115" font-size="15" text-anchor="middle" fill="#475569">a[0] = 10</text><rect x="265" y="45" width="200" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="365.0" y="87" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">p + 1 (+4 B)</text><text x="365.0" y="115" font-size="15" text-anchor="middle" fill="#475569">a[1] = 20</text><rect x="490" y="45" width="200" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="590.0" y="87" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">p + 2 (+8 B)</text><text x="590.0" y="115" font-size="15" text-anchor="middle" fill="#475569">a[2] = 30</text><rect x="715" y="45" width="200" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="815.0" y="87" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">p + 3 (+12 B)</text><text x="815.0" y="115" font-size="15" text-anchor="middle" fill="#475569">a[3] = 40</text></svg></div>
    say: 'Nhìn bốn ô nhớ kề nhau: phần tử không nằm tại độ lệch không bai, phần tử một tại cộng bốn bai, phần tử hai tại cộng tám bai và phần tử ba tại cộng mười hai bai. Mỗi lần tăng con trỏ một đơn vị, địa chỉ thực sự dịch chuyển đúng bốn bai sang đầu phần tử kế tiếp.'
    clear: true
  - show: ''
    say: Phép cộng ba vào con trỏ số nguyên bốn bai tương đương đi thẳng mười hai bai tới đúng đầu phần tử thứ ba. Bước nhảy bốn bai hay tám bai bảo đảm mũi tên con trỏ luôn hạ cánh chính xác vào điểm khởi đầu phần tử tiếp theo. Nếu không tự động nhân kích thước kiểu, con trỏ sẽ đọc nhầm vào phần ruột lẻ của hai phần tử ghép sát nhau.
- id: formula
  kind: formula
  title: Công thức số học con trỏ chuẩn C
  checks:
  - alg.cpr_ptr_offset(3, 4) == 12
  - alg.cpr_ptr_offset(3, 8) == 24
  steps:
  - show: '<div class=''box key''><p>Với con trỏ kiểu <code>T *p</code> và số nguyên $k$:</p><p>địa chỉ(p + k) = địa chỉ(p) + k × sizeof(T)</p><p>Ví dụ: với <code>int</code> 4 byte, k=3 cho +12 byte; với double 8 byte, k=3 cho +24 byte.</p></div>'
    say: 'Công thức chuẩn rất rõ ràng: dịch chuyển theo đơn vị phần tử nhân với kích thước của mỗi phần tử. Với số nguyên bốn bai, bước nhảy ba dịch chuyển mười hai bai vì ba nhân bốn bằng mười hai. Với số thực tám bai, bước nhảy ba dịch chuyển hai mươi bốn bai vì ba nhân tám bằng hai mươi bốn. Khi trừ hai con trỏ cùng mảng, trình biên dịch tự chia lại cho kích thước phần tử. Công thức tính địa chỉ phần tử thứ k giải thích hoàn toàn bản chất tương đương giữa ngoặc vuông mảng và phép cộng con trỏ. Quy luật tịnh tiến nhân kích thước kiểu giải thích vì sao bước nhảy trên mảng số thực luôn rộng gấp đôi số nguyên.'
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: đo khoảng cách byte và tổng hàm chỉ đọc const'
  checks:
  - alg.cpr_ptr_offset(3, 4) == 12
  - alg.cpr_ptr_offset(3, 8) == 24
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>const int *a, size_t n</code></td><td>Truyền mảng vào hàm: luôn kèm độ dài <code>n</code> và gắn <code>const</code> chống sửa nhầm</td></tr><tr><td><code>#include &lt;stddef.h&gt;</code> / <code>ptrdiff_t</code> / <code>%td</code></td><td>Kiểu có dấu giữ hiệu hai con trỏ cùng mảng và mã in trong <code>printf</code></td></tr><tr><td><code>(ptrdiff_t)((const char *)(p + 3) - (const char *)p)</code></td><td>Ép sang con trỏ 1 byte rồi trừ để ra đúng khoảng cách byte</td></tr></table>'
    say: Ta giải mã trước ba quy ước quan trọng dùng trong chương trình mẫu. Hàm tổng nhận con trỏ chỉ đọc ngăn sửa mảng gốc. Kiểu hiệu con trỏ có dấu từ thư viện chuẩn định nghĩa hiệu hai con trỏ và in ra bằng mã phần trăm t d, sau khi ép về con trỏ một bai để đo khoảng cách thật. Kiểu hiệu hai con trỏ có dấu hỗ trợ phép đo khoảng cách chính xác giữa hai vị trí đứng trong cùng một vùng mảng hợp lệ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Đo độ lệch byte của p+3 với int và double, cùng sum_const</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stddef.h&gt;</div><div>static int sum_const(const int *a, size_t n) {</div><div>    int s = 0;</div><div>    for (size_t i = 0; i &lt; n; i++) { s += *(a + i); }</div><div>    return s;</div><div>}</div><div>int main(void) {</div><div>    int ai[4] = {10, 20, 30, 40};</div><div>    double ad[4] = {1.0, 2.0, 3.0, 4.0};</div><div>    ptrdiff_t d_int = (const char *)(ai + 3) - (const char *)ai;</div><div>    ptrdiff_t d_dbl = (const char *)(ad + 3) - (const char *)ad;</div><div>    printf("d_int=%td d_dbl=%td sum=%d\n", d_int, d_dbl, sum_const(ai, 4));</div><div>    return 0;</div><div>}</div></div>
    say: Chương trình thực nghiệm đo trực tiếp hiệu số bai thật giữa con trỏ gốc và con trỏ đã cộng ba trên hai kiểu dữ liệu. Tiếp theo nó gọi hàm cộng tổng mảng chỉ đọc qua từng bước nhảy để đối chiếu lại kết quả. Ép sang con trỏ ký tự một bai khi đo giúp phơi bày chính xác số bai vật lý cách biệt giữa hai vị trí con trỏ.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>d_int=12 d_dbl=24 sum=100</div></div>
    say: Kết quả chạy thật xác nhận bước nhảy ba trên kiểu bốn bai đúng bằng mười hai bai. Trên kiểu tám bai mức dịch đúng hai mươi bốn bai, và tổng bốn phần tử trả về chính xác một trăm. Kết quả chênh lệch mười hai bai và hai mươi bốn bai khẳng định trình biên dịch đã nhân ẩn kích thước bốn bai và tám bai.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng kích thước mảng khi truyền qua hàm (array decay)
  checks:
  - 10 * 4 == 40
  steps:
  - show: <p><b>Kiểm chứng đồng nhất a[i] == *(p + i) và suy biến mảng truyền qua hàm</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>static size_t param_sizeof(const int *p) { return sizeof(p); }</div><div>int main(void) {</div><div>    int arr[10] = {10, 20, 30, 40}; const int *p = arr;</div><div>    printf("outer=%zu param=%zu eq=%d\n", sizeof(arr), param_sizeof(arr), arr[2] == *(p + 2));</div><div>    return 0; }</div></div>
    say: 'Ở bài 0 ta từng lưu ý về kích thước mảng bên ngoài và bên trong hàm. Giờ ta chạy thật để thấy rõ: bên ngoài đo đủ bốn mươi bai, còn bên trong hàm tham số đã thành con trỏ nên đo được đúng tám bai. Thí nghiệm đo kích thước mảng trong thân hàm vạch trần hiện tượng mảng tự suy biến thành một con trỏ tám bai đơn lẻ. Chương trình đồng thời đối chiếu truy cập chỉ số a hai với phép cộng con trỏ p cộng hai cho thấy hai cách viết hoàn toàn tương đương.'
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>outer=40 param=8 eq=1</div></div>
    say: Đầu ra thật chứng minh lý do vì sao không bao giờ đo được độ dài mảng ở bên trong hàm bằng toán tử kích thước. Bên ngoài là mảng bốn mươi bai, bên trong là con trỏ tám bai nên bắt buộc phải truyền kèm số lượng phần tử. Phép đo thực tế khoảng cách bai kết hợp tổng đọc qua con trỏ chỉ đọc xác nhận bước nhảy bộ nhớ luôn tỉ lệ thuận chính xác với kích thước kiểu phần tử. Chính vì mất thông tin tổng số phần tử lúc đi qua danh sách tham số mà mọi hàm nhận mảng C luôn phải nhận kèm biến độ dài. Giá trị bằng nhau trả về một khẳng định quy tắc truy cập chỉ số chính là bước nhảy con trỏ nhân kích thước kiểu.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: khoảng cách phần tử vs khoảng cách byte thật'
  checks:
  - alg.cpr_ptr_offset(10000, 4) == 40_000
  - alg.cpr_ptr_offset(10000, 8) == 80_000
  steps:
  - show: <table class='t'><tr><th>bước nhảy k</th><th>trên int * (4 byte)</th><th>trên double * (8 byte)</th><th>trên khối 64 byte</th></tr><tr><td><span style='white-space:nowrap'>k = 1 (×1)</span></td><td>+4 byte</td><td>+8 byte</td><td>+64 byte</td></tr><tr><td><span style='white-space:nowrap'>k = 100 (×100)</span></td><td>+400 byte</td><td>+800 byte</td><td>+6 400 byte</td></tr><tr><td><span style='white-space:nowrap'>k = 10 000 (×10 000)</span></td><td>+40 000 byte</td><td>+80 000 byte</td><td>+640 000 byte</td></tr></table>
    say: Nhìn bảng quy mô, khoảng cách bộ nhớ luôn tỉ lệ thuận với cả bước nhảy lẫn kích thước mỗi phần tử. Với một bước nhảy trên kiểu tám bai chỉ dịch tám bai. Khi tăng lên một trăm bước nhảy là tám trăm bai, và ở mức mười nghìn bước nhảy ta đã đi suốt tám mươi nghìn bai liên tiếp trong bộ nhớ. Ở kích thước bước nhảy hàng nghìn phần tử hay cấu trúc lớn sáu mươi bốn bai, sự chênh lệch vị trí tăng tuyến tính hoàn toàn. Nắm rõ bước nhảy địa chỉ giúp bạn tính trước độ lệch bộ nhớ khi làm việc với khối đệm nhiều chiều cỡ lớn.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Dùng <code>sizeof(arr) / sizeof(arr[0])</code> bên trong hàm.</b> Vì tham số mảng tự suy biến thành con trỏ 8 byte, công thức đó cho kết quả sai (8/4 = 2)!<br><b>Lỗi 2: Cộng bước nhảy vượt quá sau phần tử <code>n</code>.</b> C chỉ cho phép tạo địa chỉ kết thúc ngay sau phần tử cuối (<code>a + n</code>), tuyệt đối không được giải tham chiếu nó.<br><b>Lỗi 3: Trừ hai con trỏ thuộc hai mảng tách biệt.</b> Phép trừ chỉ hợp lệ khi cả hai cùng nằm trên một mảng.</div></td></tr></table>'
    say: Có ba lỗi thường gặp về số học con trỏ. Gọi toán tử đo kích thước trên tham số mảng trong hàm sẽ cho kết quả sai. Ngoài ra cần tránh đọc phần tử ngay sau mảng và không trừ hai địa chỉ khác mảng. Đọc kỹ hướng dẫn phạm vi mảng để không truy cập vượt ranh giới phần tử cuối cùng.
    clear: true
  - show: ''
    say: Trừ hai con trỏ trỏ tới hai mảng khác nhau là hành vi không xác định vì khoảng cách giữa hai vùng nhớ độc lập không có ý nghĩa. Cẩn thận giữ chỉ số hoặc con trỏ quét trong phạm vi từ đầu mảng tới tối đa vị trí ngay sau phần tử cuối cùng mà không giải tham chiếu vị trí đó.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 1000 + alg.cpr_ptr_offset(5, 8) == 1040
  steps:
  - show: <ol><li>Con trỏ <code>double *p</code> đang ở địa chỉ 1000, vậy <code>p + 5</code> trỏ tới địa chỉ bao nhiêu (biết <code>sizeof(double) = 8</code>)?</li><li>Vì sao hàm đọc mảng nên khai báo tham số <code>const int *a</code> thay vì <code>int *a</code>?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, con trỏ số thực tám bai đang ở địa chỉ một nghìn thì vị trí cộng thêm năm nằm ở địa chỉ nào? Câu hai, vì sao hàm chỉ đọc mảng nên thêm từ khoá bảo vệ chỉ đọc vào tham số? Dừng vi-đê-ô và trả lời. Hai câu ngắn giúp bạn đối chiếu nhanh bước nhảy con trỏ và quy tắc bảo vệ mảng chỉ đọc.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 1000 + 5 × 8 = <b>1040</b>.</p></td></tr></table>
    say: 'Đáp án câu một: năm phần tử nhân tám bai bằng bốn mươi bai, cộng một nghìn thành một nghìn không trăm bốn mươi. Trình biên dịch tự nhân bước nhảy với kích thước phần tử nên phép cộng con trỏ luôn nhảy chuẩn xác sang ô tiếp theo mà không cần tính tay. Biết kích thước từng kiểu giúp bạn nhẩm ngay địa chỉ đích khi gỡ lỗi bộ nhớ ở cấp độ thập lục phân.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Thêm <code>const</code> để trình biên dịch chặn ngay ở bước biên dịch nếu hàm lỡ ghi đè mảng đầu vào.</p></td></tr></table>
    say: 'Đáp án câu hai: khai báo chỉ đọc giúp trình biên dịch ngăn mọi thao tác sửa nhầm dữ liệu đầu vào. Gắn từ khoá chỉ đọc cho tham số con trỏ mảng cho trình biên dịch biết hàm chỉ xem dữ liệu chứ không được phép thay đổi ngoài ý muốn. Từ khoá chỉ đọc tạo bức tường bảo vệ ngay lúc biên dịch trước mọi thao tác ghi nhầm vô ý vào vùng dữ liệu tham chiếu.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L05
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L05:</b> đọc <code>idx n</code> và <code>n</code> số nguyên <code>v[i]</code> từ <code>stdin</code>, in 2 dòng <code>offset=..</code> (khoảng cách byte) và <code>sum=..</code> (tính qua hàm <code>sum_ro(const int *, size_t)</code>).</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>3 6 10 20 30 40 50 60</code> | Chấm: <code>bash labs/cham.sh CPR L05 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L05/de.md</code>)</p></div>'
    say: Hãy mở đề bài L05 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Đảm bảo đọc đủ độ dài n phần tử mảng từ luồng chuẩn rồi truyền chính xác độ dài kèm mảng vào hàm cộng tổng chỉ đọc.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L05/du_lieu.txt</code></b></p><div class="code"><div>offset=12</div><div>sum=210</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L05 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. So sánh phần khoảng cách bai của bước nhảy trên hai kiểu có kích thước khác nhau theo mẫu quy định.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L05:</b> (1) đọc đủ n phần tử vào mảng trước khi tính tổng; (2) ép sang const char * để lấy khoảng cách byte thật; (3) kiểm tra biên idx < n.</p></div>
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Kiểm tra cẩn thận trường hợp mảng chỉ có một phần tử hoặc bước nhảy bằng không để tránh đọc trệch ra ngoài mảng.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>p + k dịch k × sizeof(*p) byte</span><span class='a'>→</span><span class='n'>Tên mảng truyền hàm → con trỏ (kèm n)</span><span class='a'>→</span><span class='n'>Bảo vệ bằng const</span></div>
    say: Ghi nhớ chuỗi quy tắc quan trọng của bài 5. Mọi bước nhảy con trỏ đều nhân với kích thước phần tử đích. Truyền mảng vào hàm luôn phải truyền kèm biến độ dài và gắn từ khoá chỉ đọc cho đầu vào. Sự thống nhất giữa chỉ số mảng và bước nhảy con trỏ giúp viết vòng lặp tối ưu hơn nhiều. Số học con trỏ biến thao tác duyệt vùng nhớ liên tiếp thành những phép tịnh tiến chính xác từng phần tử theo kích thước kiểu. Kết hợp truyền kèm kích thước độ dài và chỉ đọc hoàn thiện bộ kỹ năng thao tác mảng tĩnh trên ngăn xếp.
    clear: true
  - show: <div class='box ok'><b>Bài sau (bài 6):</b> Bộ nhớ động trên vùng nhớ mở và bốn lỗi kinh điển</div>
    say: Bài tiếp theo là bài 6, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Hiểu đúng bản chất bước nhảy con trỏ giúp bạn làm chủ hoàn toàn cơ chế cấp phát động vùng nhớ dài hạn ở bài tiếp theo. Bước sang bài kế, bạn sẽ tự xin và trả lại các mảng kích thước tuỳ biến ngay trong lúc chương trình đang chạy.
    clear: true
    forward_ref: true
