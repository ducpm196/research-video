scenes:
- id: hook
  kind: hook
  title: Vì sao cộng 1 vào con trỏ không hề nhảy đúng 1 byte?
  checks:
  - alg.cpr_ptr_offset(3, 4) == 12
  steps:
  - show: <div class='box key'><p>Cho con trỏ <code>int *p</code> và thực hiện <code>p + 3</code>. Địa chỉ không tăng thêm <b>3 byte</b> mà nhảy vọt thêm <b>12 byte</b>.</p><p>Con trỏ luôn nhảy theo bội số kích thước phần tử <code>sizeof(*p)</code> để trỏ trúng đầu phần tử kế tiếp.</p></div>
    say: Chào bạn, ở bài trước bạn đã biết con trỏ giữ địa chỉ ô nhớ. Nếu lấy một con trỏ số nguyên bốn bai rồi cộng thêm ba, địa chỉ trong bộ nhớ không tăng ba bai mà nhảy hẳn mười hai bai. Cơ chế bước nhảy tự động nhân theo kích thước phần tử này giúp ngôn ngữ C duyệt qua các phần tử mảng cực kỳ chính xác và nhanh gọn. Tuy nhiên nhầm lẫn giữa phần tử và bai lại là nguồn cơn của rất nhiều lỗi vượt biên. Khác với phép cộng số học thông thường, cộng số nguyên vào con trỏ tự động nhân thêm độ rộng của kiểu dữ liệu nó trỏ tới. Nhờ quy tắc tỉ lệ tự động này, bạn duyệt qua các ô nhớ có độ lớn khác nhau bằng cùng một cú pháp cộng một đồng nhất.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>kiến thức nền đã học</th><th>vai trò ở bài này</th></tr><tr><td>Mỗi phần tử int = 4 byte, double = 8 byte (L00)</td><td>Độ rộng một bước nhảy bằng kích thước kiểu mà con trỏ trỏ tới</td></tr><tr><td>Biến con trỏ & và * (L04)</td><td>Tên mảng khi truyền vào hàm tự chuyển thành địa chỉ phần tử đầu tiên</td></tr></table>
    say: Ta nối tiếp bài 0 và bài 4 để làm rõ bản chất liên kết giữa mảng và con trỏ. Độ dài mỗi bước dịch chuyển luôn phụ thuộc vào kích thước kiểu dữ liệu đích đang trỏ tới. Ngoài ra khi đưa tên mảng làm đối số gọi hàm, trình biên dịch chỉ truyền địa chỉ của phần tử đầu tiên. Mọi phần tử trong một mảng C luôn xếp khít liên tiếp không kẽ hở theo thứ tự tăng dần của địa chỉ bộ nhớ. Chính sự liên tiếp tuyệt đối này cho phép máy tính xác định địa chỉ phần tử bất kỳ chỉ trong đúng một phép nhân cộng.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
