- id: hook
  kind: hook
  title: Làm sao lưu 100 000 bản ghi nhanh hơn tệp chữ và nhỏ gọn từng bit?
  checks:
  - 3 * 16 == 48
  steps:
  - show: <div class='box key'><p>Ghi văn bản <code>"1000000"</code> tốn <b>7 byte</b> và phải phân tích chuỗi mỗi lần đọc. Lưu nhị phân đúng dạng <b>16 byte cố định</b> ghi một phát hết bản ghi, không đổi chữ.</p><p>Hơn nữa một <code>uint16_t</code> (2 byte) vừa gói được <b>4 bit loại</b> vừa gói được <b>12 bit độ dài</b> bằng phép dịch bit và mặt nạ.</p></div>
    say: Chào bạn, lưu dữ liệu dạng chữ vừa tốn dung lượng vừa mất công phân tích ký tự mỗi lần đọc lại từ đĩa. Giải pháp hiệu năng cao là ghi thẳng các khối bai cố định xuống tệp nhị phân rồi đọc ngược nguyên khối lên bộ nhớ. Hôm nay ta học cách mở tệp đúng chế độ, kiểm tra số khối đọc ghi và dùng phép toán bít tách các trường đóng gói gọn trong hai bai. Lưu dữ liệu dạng văn bản buộc hệ thống chuyển đổi qua lại giữa chữ và số hàng triệu lần rất chậm chạp và tốn đĩa. Ghi nhị phân kết hợp nén bít giúp giữ nguyên từng khối bản ghi kích thước cố định gọn nhẹ cả trên RAM lẫn ổ cứng.
