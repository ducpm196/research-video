    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Mở tệp nhị phân chỉ ghi <code>"w"</code> thay vì <code>"wb"</code>.</b> Trên Windows, chế độ văn bản tự đổi byte <code>0x0A</code> thành <code>0x0D 0x0A</code> làm hỏng dữ liệu.<br><b>Lỗi 2: Không kiểm giá trị trả về của <code>fread</code>/<code>fwrite</code>.</b> Nếu tệp bị cắt ngắn giữa chừng hoặc đầy đĩa, phần tử cuối chứa dữ liệu cũ.<br><b>Lỗi 3: Dịch bit trên số nguyên có dấu âm.</b> Luôn dùng kiểu không dấu (<code>uint16_t</code>, <code>uint32_t</code>) cho mặt nạ và dịch bit.</div></td></tr></table>'
    say: Có ba lỗi rất dễ gặp với tệp nhị phân và phép bít. Quên cờ b sẽ làm hỏng dữ liệu xuống dòng trên hệ thống Windows. Ngoài ra nhiều người bỏ qua giá trị trả về của hàm đọc ghi hoặc dịch bít số âm. Đọc ghi từng khối cố định luôn cần kiểm soát chặt số phần tử trả về từ hệ điều hành.
    clear: true
  - show: ''
    say: Luôn gắn chữ b ở chế độ mở tệp để vô hiệu hoá việc tự động đổi ký tự xuống dòng gây lệch toàn bộ cấu trúc bai khi đọc trên Windows. Thực hiện mọi phép dịch bít và mặt nạ trên kiểu nguyên không dấu để tránh hành vi dịch bít dấu khó lường trên số âm.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (0x3080 >> 12) & 0xF == 3
  - 0x3080 & 0xFFF == 128
  - 250 * 16 == 4000
  steps:
  - show: '<ol><li>Số đóng gói <code>0x3080</code> (4 bit cao là loại, 12 bit thấp là độ dài): tách ra được loại và độ dài bằng bao nhiêu?</li><li>Ghi 250 bản ghi mỗi bản ghi 16 byte thành công ra tệp nhị phân thì tệp dài bao nhiêu byte?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, từ số hệ mười sáu là ba không tám không gồm bốn bít cao chỉ loại và mười hai bít thấp chỉ độ dài, ta tách được loại và độ dài là bao nhiêu? Câu hai, hai trăm năm mươi bản ghi mười sáu bai chiếm tệp dài bao nhiêu bai? Dừng vi-đê-ô và tính ra giấy. Hai tình huống này kiểm lại phép dịch bít tách trường và thói quen kiểm tra số khối đọc ghi.
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① Loại: <code>(0x3080 >> 12) & 0xF</code> $= \hl{3}$; độ dài: <code>0x080</code> $= 8 \times 16 = \hl{128}$.</p></td></tr></table>'
    say: 'Đáp án câu một: loại bằng ba và độ dài ở hệ mười sáu là không tám không, tức một trăm hai mươi tám. Lưu dữ liệu nhị phân cố định loại bỏ hoàn toàn bước chuyển đổi chuỗi văn bản chậm chạp và giữ đúng bố cục từng bít. Quy đổi giữa hệ mười sáu và thập phân giúp kiểm nhẩm nhanh kết quả đóng gói từng khoang bít ở bước gỡ lỗi.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② 250 × 16 = <b>4 000</b> byte.</p></td></tr></table>
    say: 'Đáp án câu hai: hai trăm năm mươi nhân mười sáu bằng bốn nghìn bai. Kiểm tra kỹ số lượng phần tử thật sự đọc ghi được sau mỗi lệnh đĩa giúp phát hiện ngay tình huống đầy ổ cứng hoặc tệp bị cắt cụt. Kiểm tra đối xứng kết quả hàm đọc ghi tệp bảo đảm phát hiện sớm sự cố đầy đĩa hay tệp bị cắt ngang nửa chừng.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L08
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L08:</b> đọc <code>type len count</code> và <code>count</code> số <code>amt</code> từ <code>stdin</code>, đóng gói <code>pk</code>, ghi/đọc <code>out.bin</code> qua <code>Rec</code> 16B để in <code>packed=.. type=.. len=..</code> và <code>bytes=.. count=.. sum_amt=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>5 320 4 150 250 350 450</code> | Chấm: <code>bash labs/cham.sh CPR L08 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L08/de.md</code>)</p></div>'
    say: Hãy mở đề bài L08 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Đọc cẩn thận quy ước kích thước mặt nạ bít và trình tự ghi đọc khối nhị phân cố định trong tệp hướng dẫn bài tám.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L08/du_lieu.txt</code></b></p><div class="code"><div>packed=20800 type=5 len=320</div><div>bytes=64 count=4 sum_amt=1200</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L08 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Đối chiếu sát cả giá trị đóng gói số nguyên lẫn tổng giá trị lọc được khi đọc ngược tệp nhị phân ra lại bộ nhớ.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L08:</b> (1) dùng mặt nạ 0xF và 0xFFF khi ghép hoặc tách bit; (2) kiểm tra số lượng đọc được từ fread thay vì giả sử luôn đủ; (3) dùng đúng struct 16 byte.</p></div>
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Nhớ luôn gọi lệnh đóng tệp ghi trước khi mở đọc lại để hệ điều hành xả hết dữ liệu từ vùng đệm xuống ổ đĩa.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>Mở "rb"/"wb"</span><span class='a'>→</span><span class='n'>Kiểm số khối fread/fwrite</span><span class='a'>→</span><span class='n'>Dịch bit + mặt nạ trên số không dấu</span></div>
    say: Tổng kết lại chuỗi tư duy hôm nay khi làm việc ở mức bai và bít. Luôn mở tệp kèm cờ nhị phân, kiểm tra số khối thực sự đọc ghi được, và dùng phép toán bít trên kiểu không dấu. Đóng gói đúng từng bít và kiểm đủ phần tử đọc về mang lại hiệu năng lưu trữ vượt trội.
    clear: true
  - show: ''
    say: Mở tệp cờ nhị phân chuẩn, dùng số nguyên không dấu thao tác bít và kiểm tra đủ số lượng khối đọc về bảo đảm tính tin cậy cao. Từ nền tảng từng bản ghi riêng lẻ, ta đã hội tụ đủ mảnh ghép để giải bài toán phân tích nhật ký quy mô lớn ở bài kế tiếp. Đóng gói chặt chẽ từng trường dữ liệu giúp tiết kiệm đồng thời dung lượng lưu trữ lẫn thời gian nạp tệp từ đĩa.
  - show: '<div class=''box ok''><b>Bài sau (bài 9):</b> Tình huống chuyên gia: Xây bộ phân tích tệp nhật ký nhị phân sạch bộ nhớ</div>'
    say: Bài tiếp theo là bài 9, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Ghép mọi kỹ năng cấu trúc, phép bít và đọc ghi nhị phân giúp bạn bước thẳng vào bài tình huống phân tích nhật ký hiệu năng cao. Chặng cuối cùng tích hợp tất cả kiến thức cấu trúc gọn, mảng động nhân đôi và xử lý tệp nhị phân vào một dịch vụ thực tế.
    clear: true
    forward_ref: true
