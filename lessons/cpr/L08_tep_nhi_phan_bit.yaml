scenes:
- id: hook
  kind: hook
  title: Làm sao lưu 100 000 bản ghi nhanh hơn tệp chữ và nhỏ gọn từng bit?
  checks:
  - 3 * 16 == 48
  steps:
  - show: <div class='box key'><p>Ghi văn bản <code>"1000000"</code> tốn <b>7 byte</b> và phải phân tích chuỗi mỗi
      lần đọc. Lưu nhị phân đúng dạng <b>16 byte cố định</b> ghi một phát hết bản ghi, không đổi chữ.</p><p>Hơn
      nữa một <code>uint16_t</code> (2 byte) vừa gói được <b>4 bit loại</b> vừa gói được <b>12 bit độ dài</b> bằng
      phép dịch bit và mặt nạ.</p></div>
    say: Chào bạn, lưu dữ liệu dạng chữ vừa tốn dung lượng vừa mất công phân tích ký tự mỗi lần đọc lại từ đĩa.
      Giải pháp hiệu năng cao là ghi thẳng các khối bai cố định xuống tệp nhị phân rồi đọc ngược nguyên khối lên
      bộ nhớ. Hôm nay ta học cách mở tệp đúng chế độ, kiểm tra số khối đọc ghi và dùng phép toán bít tách các trường
      đóng gói gọn trong hai bai.
    focus:
    - 0
    - '1.1'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>ứng dụng bài mới</th></tr><tr><td>Bố cục struct căn lề
      chẵn (L07)</td><td>Thiết kế bản ghi không dư padding khi ghi xuống tệp nhị phân</td></tr><tr><td>Số nguyên
      cố định bề rộng uint16_t/uint32_t (L01)</td><td>Giữ kích thước đồng nhất khi đọc/ghi từng byte</td></tr></table>
    say: Ta kết hợp bài 1 và bài 7 để tạo định dạng tệp nhị phân chuẩn mực. Nhờ kiểu nguyên cố định độ rộng từ bài
      1 và sắp trường gọn khít từ bài 7, mỗi bản ghi trên tệp luôn có đúng kích thước xác định từng bai trên mọi
      máy.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>fopen(path, "wb" / "rb")</code></td><td>Mở
      tệp ở chế độ nhị phân ghi (<code>wb</code>) hoặc đọc (<code>rb</code>) (bắt buộc chữ <code>b</code> trên Windows)</td></tr><tr><td><code>fwrite
      / fread(ptr, sz, n, f)</code></td><td>Ghi hoặc đọc <code>n</code> khối cỡ <code>sz</code>; trả về đúng số
      khối thực tế đã xử lý</td></tr><tr><td><code>(h &gt;&gt; 12) &amp; 0xF</code></td><td>Dịch phải 12 bit rồi
      giữ 4 bit thấp bằng mặt nạ <code>0xF</code> (giá trị 0..15)</td></tr></table>
    say: Có ba quy ước cốt lõi với tệp nhị phân và phép bít. Mở tệp nhị phân luôn gắn chữ b để hệ thống giữ nguyên
      mọi bai mà không tự đổi ký tự xuống dòng. Tiếp theo là kiểm tra số khối thực tế hàm trả về rồi dùng dịch bít
      cùng mặt nạ lấy lại từng trường nhỏ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: 'Đóng gói 16 bit đầu gói tin: 4 bit loại | 12 bit độ dài'
  steps:
  - show: <div><svg width="960" height="185" viewBox="0 0 960 185"><rect x="40" y="45" width="280" height="90" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="180.0" y="85" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Bit 15..12 (4 bit)</text><text x="180.0" y="112" font-size="15" text-anchor="middle"
      fill="#475569">Loại (0..15) | mặt nạ 0xF</text><rect x="340" y="45" width="580" height="90" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="630.0" y="85" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Bit 11..0 (12 bit)</text><text x="630.0" y="112" font-size="15" text-anchor="middle" fill="#475569">Độ
      dài (0..4095) | mặt nạ 0xFFF</text></svg></div>
    say: Một số nguyên không dấu mười sáu bít được chia làm hai khoang rõ ràng. Bốn bít cao bên trái lưu mã loại
      bản ghi từ không đến mười lăm. Mười hai bít thấp bên phải lưu độ dài từ không đến bốn nghìn không trăm chín
      mươi lăm. Nhờ đóng gói hai giá trị vào chung một số nguyên, ta tiết kiệm phân nửa không gian phần đầu.
    clear: true
- id: formula
  kind: formula
  title: Công thức đóng và mở trường bằng phép bit
  checks:
  - ((5 << 12) | 320) == 20800
  - (20800 >> 12) & 0xF == 5
  - 20800 & 0xFFF == 320
  steps:
  - show: '<div class=''box key''><p>Gói <code>type = 5</code> (4 bit) và <code>len = 320</code> (12 bit):</p><p>h
      = (5 &lt;&lt; 12) | 320 = 20 480 + 320 = <b>20 800</b> (<code>0x5140</code>).</p><p>Mở lại: <code>type = (h
      &gt;&gt; 12) &amp; 0xF = 5</code>, <code>len = h &amp; 0xFFF = 320</code>.</p></div>'
    say: Dịch số năm sang trái mười hai bít tương đương nhân bốn nghìn không trăm chín mươi sáu thành hai mươi nghìn
      bốn trăm tám mươi. Cộng thêm ba trăm hai mươi ta thu được giá trị đóng gói hai mươi nghìn tám trăm. Vì bốn
      bít cao dịch sang trái mười hai vị trí không bao giờ đè lên mười hai bít thấp. Khi mở ra, ta chỉ việc dịch
      phải mười hai bít kèm mặt nạ bốn bít để thu lại số năm và dùng mặt nạ mười hai bít giữ lại ba trăm hai mươi.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: ghi và đọc 3 bản ghi 16 byte trong tệp nhị phân'
  checks:
  - alg.cpr_pack_rec_bytes() == 16
  - 3 * 16 == 48
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>typedef struct {
      uint64_t ts; uint16_t hdr; uint16_t flag; uint32_t amt; } Rec;</code></td><td>8 + 2 + 2 + 4 = đúng 16 byte,
      0 byte đệm</td></tr><tr><td><code>FILE *f</code> / <code>fclose(f)</code></td><td>Con trỏ luồng tệp; <code>fclose(f)</code>
      đẩy sạch đệm xuống đĩa và giải phóng bộ mô tả</td></tr><tr><td><code>(type &lt;&lt; 12) | len</code></td><td>Dịch
      trái <code>&lt;&lt; 12</code> đẩy lên 4 bit cao rồi ghép bit bằng phép HOẶC <code>|</code></td></tr><tr><td><code>h
      &amp; 0xFFF</code></td><td>Mặt nạ 12 bit <code>1111_1111_1111</code> giữ nguyên giá trị <code>len</code> từ
      0 đến 4095</td></tr></table>
    say: Ta giải mã đủ bốn quy ước đọc ghi tệp và đóng gói bít trong C. Kiểu con trỏ tệp quản lý luồng mở để ghi
      đọc từng khối rồi phải gọi đóng tệp cho dữ liệu xuống đĩa. Khi gói và mở trường, dịch trái dịch phải đi kèm
      phép hoặc bít và mặt nạ mười hai bít.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: <p><b>Ghi 3 bản ghi 16 byte ra tệp nhị phân, đọc lại và giải mã bit</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>typedef struct { uint64_t ts; uint16_t hdr,
      flag; uint32_t amt; } Rec;</div><div>int main(void) {</div><div>    Rec w[3] = {{1001, (uint16_t)((5&lt;&lt;12)|320),
      1, 50000},</div><div>                {1002, (uint16_t)((2&lt;&lt;12)|128), 0, 12000},</div><div>                {1003,
      (uint16_t)((5&lt;&lt;12)|64),  1, 8000}};</div><div>    FILE *f = fopen("rec.bin", "wb"); if (!f) return 1;</div><div>    size_t
      nw = fwrite(w, sizeof(Rec), 3, f); fclose(f);</div><div>    Rec r[3]; f = fopen("rec.bin", "rb"); if (!f)
      return 1;</div><div>    size_t nr = fread(r, sizeof(Rec), 3, f); fclose(f);</div><div>    printf("sz=%zu nw=%zu
      nr=%zu\n", sizeof(Rec), nw, nr);</div><div>    printf("r0 type=%u len=%u amt=%u\n", (r[0].hdr&gt;&gt;12)&amp;0xF,
      r[0].hdr&amp;0xFFF, r[0].amt);</div><div>    return 0;</div><div>}</div></div>
    say: Chương trình đóng gói sẵn một mảng ba bản ghi mười sáu bai rồi ghi thẳng xuống tệp nhị phân tạm. Ngay sau
      đó chương trình mở tệp ở chế độ đọc nhị phân, đếm số khối đọc được và dùng mặt nạ bít tách loại cùng độ dài
      bản ghi đầu tiên.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>sz=16 nw=3 nr=3</div><div>r0 type=5 len=320
      amt=50000</div></div>
    say: Đầu ra chạy thật xác nhận mỗi bản ghi chiếm tròn mười sáu bai và số khối đọc về bằng đúng ba. Phép toán
      bít tách lại chính xác loại bằng năm và độ dài bằng ba trăm hai mươi khớp hoàn toàn dữ liệu ban đầu.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chéo bằng tính tổng độ dài tệp và số dư 0 byte đệm
  checks:
  - alg.cpr_pack_rec_bytes() * 3 == 48
  steps:
  - show: <div class='box ok'><p>Tổng byte tệp nhị phân = 3 × (8 + 2 + 2 + 4) = 3 × 16 = <b>48</b> byte.</p><p>Phép
      tách <code>(20800 &gt;&gt; 12) &amp; 0xF == 5</code> và <code>20800 &amp; 0xFFF == 320</code> khớp hoàn toàn
      với kết quả đọc từ tệp thật.</p></div>
    say: Ta kiểm chéo lại bằng tính tay vì cần xác nhận kích thước và giá trị bít không có sai số ngầm. Ba bản ghi
      mỗi bản ghi mười sáu bai cho tổng tệp đúng bốn mươi tám bai. Con số đóng gói dịch phải mười hai bít ra đúng
      năm và lấy mười hai bít thấp ra đúng ba trăm hai mươi.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: dung lượng tệp nhị phân 16 byte cố định'
  checks:
  - 10_000_000 * 16 == 160_000_000
  steps:
  - show: <table class='t'><tr><th>số bản ghi</th><th>tệp chữ CSV (~40 B/dòng)</th><th>nhị phân 16 B/bản ghi</th><th>tiết
      kiệm đĩa</th></tr><tr><td><span style='white-space:nowrap'>1 000 (×1)</span></td><td>40 KB</td><td>16 KB</td><td>60%
      nhỏ hơn</td></tr><tr><td><span style='white-space:nowrap'>100 000 (×100)</span></td><td>4,0 MB</td><td>1,6
      MB</td><td>60% nhỏ hơn</td></tr><tr><td><span style='white-space:nowrap'>10 000 000 (×10 000)</span></td><td>400
      MB</td><td>160 MB</td><td>Tiết kiệm 240 MB</td></tr></table>
    say: Với một nghìn bản ghi sự khác biệt dung lượng mới là bốn mươi ki-lô-bai so với mười sáu ki-lô-bai. Nhưng
      ở quy mô mười triệu bản ghi, lưu dạng văn bản tốn tới bốn trăm mê-ga-bai trong khi tệp nhị phân chỉ tốn một
      trăm sáu mươi mê-ga-bai và đọc nhanh gấp nhiều lần.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Mở tệp nhị phân chỉ ghi <code>"w"</code> thay vì <code>"wb"</code>.</b> Trên Windows, chế độ văn bản tự
      đổi byte <code>0x0A</code> thành <code>0x0D 0x0A</code> làm hỏng dữ liệu.<br><b>Lỗi 2: Không kiểm giá trị
      trả về của <code>fread</code>/<code>fwrite</code>.</b> Nếu tệp bị cắt ngắn giữa chừng hoặc đầy đĩa, phần tử
      cuối chứa dữ liệu cũ.<br><b>Lỗi 3: Dịch bit trên số nguyên có dấu âm.</b> Luôn dùng kiểu không dấu (<code>uint16_t</code>,
      <code>uint32_t</code>) cho mặt nạ và dịch bit.</div></td></tr></table>'
    say: Có ba lỗi rất dễ gặp với tệp nhị phân và phép bít. Quên cờ b sẽ làm hỏng dữ liệu xuống dòng trên hệ thống
      Windows. Ngoài ra nhiều người bỏ qua giá trị trả về của hàm đọc ghi hoặc dịch bít số âm.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (0x3080 >> 12) & 0xF == 3
  - 0x3080 & 0xFFF == 128
  - 250 * 16 == 4000
  steps:
  - show: '<ol><li>Số đóng gói <code>0x3080</code> (4 bit cao là loại, 12 bit thấp là độ dài): tách ra được loại
      và độ dài bằng bao nhiêu?</li><li>Ghi 250 bản ghi mỗi bản ghi 16 byte thành công ra tệp nhị phân thì tệp dài
      bao nhiêu byte?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, từ số hệ mười sáu là ba không tám không gồm bốn bít cao chỉ loại và
      mười hai bít thấp chỉ độ dài, ta tách được loại và độ dài là bao nhiêu? Câu hai, hai trăm năm mươi bản ghi
      mười sáu bai chiếm tệp dài bao nhiêu bai? Dừng vi-đê-ô và tính ra giấy.
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① Loại: <code>(0x3080 >> 12) & 0xF</code>
      $= \hl{3}$; độ dài: <code>0x080</code> $= 8 \times 16 = \hl{128}$.</p></td></tr></table>'
    say: 'Đáp án câu một: loại bằng ba và độ dài ở hệ mười sáu là không tám không, tức một trăm hai mươi tám.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② 250 × 16 = <b>4 000</b> byte.</p></td></tr></table>
    say: 'Đáp án câu hai: hai trăm năm mươi nhân mười sáu bằng bốn nghìn bai.'
    clear: true
