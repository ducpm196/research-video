- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>fopen(path, "wb" / "rb")</code></td><td>Mở tệp ở chế độ nhị phân ghi (<code>wb</code>) hoặc đọc (<code>rb</code>) (bắt buộc chữ <code>b</code> trên Windows)</td></tr><tr><td><code>fwrite / fread(ptr, sz, n, f)</code></td><td>Ghi hoặc đọc <code>n</code> khối cỡ <code>sz</code>; trả về đúng số khối thực tế đã xử lý</td></tr><tr><td><code>(h &gt;&gt; 12) &amp; 0xF</code></td><td>Dịch phải 12 bit rồi giữ 4 bit thấp bằng mặt nạ <code>0xF</code> (giá trị 0..15)</td></tr></table>
    say: Có ba quy ước cốt lõi với tệp nhị phân và phép bít. Mở tệp nhị phân luôn gắn chữ b để hệ thống giữ nguyên mọi bai mà không tự đổi ký tự xuống dòng. Tiếp theo là kiểm tra số khối thực tế hàm trả về rồi dùng dịch bít cùng mặt nạ lấy lại từng trường nhỏ. Hai phép dịch trái phải và mặt nạ bít cho phép đóng gói nhiều giá trị nhỏ chung vào một trường nguyên duy nhất rất gọn. Nhờ gom cờ trạng thái và độ dài vào một số mười sáu bít, kích thước phần đầu gói tin thu gọn xuống chỉ còn hai bai.
