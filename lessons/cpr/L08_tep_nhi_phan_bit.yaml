    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>ứng dụng bài mới</th></tr><tr><td>Bố cục struct căn lề chẵn (L07)</td><td>Thiết kế bản ghi không dư padding khi ghi xuống tệp nhị phân</td></tr><tr><td>Số nguyên cố định bề rộng uint16_t/uint32_t (L01)</td><td>Giữ kích thước đồng nhất khi đọc/ghi từng byte</td></tr></table>
    say: Ta kết hợp bài 1 và bài 7 để tạo định dạng tệp nhị phân chuẩn mực. Nhờ kiểu nguyên cố định độ rộng từ bài 1 và sắp trường gọn khít từ bài 7, mỗi bản ghi trên tệp luôn có đúng kích thước xác định từng bai trên mọi máy. Một bản ghi định dạng nhị phân chuẩn mực phải có kích thước xác định không chứa phần đệm trống rác giữa các trường. Dùng các kiểu nguyên không dấu cố định độ rộng bảo đảm định dạng tệp đọc được nhất quán qua nhiều kiến trúc máy khác nhau.
