- id: intuition
  kind: intuition
  title: 'Đóng gói 16 bit đầu gói tin: 4 bit loại | 12 bit độ dài'
  steps:
  - show: <div><svg width="960" height="185" viewBox="0 0 960 185"><rect x="40" y="45" width="280" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="180.0" y="85" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Bit 15..12 (4 bit)</text><text x="180.0" y="112" font-size="15" text-anchor="middle" fill="#475569">Loại (0..15) | mặt nạ 0xF</text><rect x="340" y="45" width="580" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="630.0" y="85" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Bit 11..0 (12 bit)</text><text x="630.0" y="112" font-size="15" text-anchor="middle" fill="#475569">Độ dài (0..4095) | mặt nạ 0xFFF</text></svg></div>
    say: Một số nguyên không dấu mười sáu bít được chia làm hai khoang rõ ràng. Bốn bít cao bên trái lưu mã loại bản ghi từ không đến mười lăm. Mười hai bít thấp bên phải lưu độ dài từ không đến bốn nghìn không trăm chín mươi lăm. Nhờ đóng gói hai giá trị vào chung một số nguyên, ta tiết kiệm phân nửa không gian phần đầu.
    clear: true
  - show: ''
    say: Bố cục nhị phân chặt chẽ biến tệp dữ liệu thành bảng ghi thẳng hàng đọc ngay không cần tách chuỗi. Từng dãy bít liền nhau đóng vai trò những ngăn tủ nhỏ khép kín nơi mỗi thuộc tính chiếm vừa đủ số bít cần biểu diễn. Phép dịch chuyển cộng mặt nạ trích xuất chính xác giá trị từng ngăn mà không làm ảnh hưởng tới phần bít lân cận.
- id: formula
  kind: formula
  title: Công thức đóng và mở trường bằng phép bit
  checks:
  - ((5 << 12) | 320) == 20800
  - (20800 >> 12) & 0xF == 5
  - 20800 & 0xFFF == 320
  steps:
  - show: '<div class=''box key''><p>Gói <code>type = 5</code> (4 bit) và <code>len = 320</code> (12 bit):</p><p>h = (5 &lt;&lt; 12) | 320 = 20 480 + 320 = <b>20 800</b> (<code>0x5140</code>).</p><p>Mở lại: <code>type = (h &gt;&gt; 12) &amp; 0xF = 5</code>, <code>len = h &amp; 0xFFF = 320</code>.</p></div>'
    say: 'Dịch số năm sang trái mười hai bít tương đương nhân bốn nghìn không trăm chín mươi sáu thành hai mươi nghìn bốn trăm tám mươi. Cộng thêm ba trăm hai mươi ta thu được giá trị đóng gói hai mươi nghìn tám trăm. Vì bốn bít cao dịch sang trái mười hai vị trí không bao giờ đè lên mười hai bít thấp. Khi mở ra, ta chỉ việc dịch phải mười hai bít kèm mặt nạ bốn bít để thu lại số năm và dùng mặt nạ mười hai bít giữ lại ba trăm hai mươi. Số lượng bít tối đa quyết định miền biểu diễn: bốn bít chứa tối đa mười lăm còn mười hai bít chứa tối đa bốn nghìn không trăm chín mươi lăm.'
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: ghi và đọc 3 bản ghi 16 byte trong tệp nhị phân'
  checks:
  - alg.cpr_pack_rec_bytes() == 16
  - 3 * 16 == 48
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>typedef struct { uint64_t ts; uint16_t hdr; uint16_t flag; uint32_t amt; } Rec;</code></td><td>8 + 2 + 2 + 4 = đúng 16 byte, 0 byte đệm</td></tr><tr><td><code>FILE *f</code> / <code>fclose(f)</code></td><td>Con trỏ luồng tệp; <code>fclose(f)</code> đẩy sạch đệm xuống đĩa và giải phóng bộ mô tả</td></tr><tr><td><code>(type &lt;&lt; 12) | len</code></td><td>Dịch trái <code>&lt;&lt; 12</code> đẩy lên 4 bit cao rồi ghép bit bằng phép HOẶC <code>|</code></td></tr><tr><td><code>h &amp; 0xFFF</code></td><td>Mặt nạ 12 bit <code>1111_1111_1111</code> giữ nguyên giá trị <code>len</code> từ 0 đến 4095</td></tr></table>
    say: Ta giải mã đủ bốn quy ước đọc ghi tệp và đóng gói bít trong C. Kiểu con trỏ tệp quản lý luồng mở để ghi đọc từng khối rồi phải gọi đóng tệp cho dữ liệu xuống đĩa. Khi gói và mở trường, dịch trái dịch phải đi kèm phép hoặc bít và mặt nạ mười hai bít. Hãy luôn kiểm tra số phần tử thực sự đọc ghi được thay vì giả định luôn đủ. Ghi từng mảng bản ghi nhị phân giúp giảm số lần gọi hệ điều hành xuống đĩa, tăng tốc độ lưu trữ lên nhiều lần.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Ghi 3 bản ghi 16 byte ra tệp nhị phân, đọc lại và giải mã bit</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>typedef struct { uint64_t ts; uint16_t hdr, flag; uint32_t amt; } Rec;</div><div>int main(void) {</div><div>    Rec w[3] = {{1001, (uint16_t)((5&lt;&lt;12)|320), 1, 50000},</div><div>                {1002, (uint16_t)((2&lt;&lt;12)|128), 0, 12000},</div><div>                {1003, (uint16_t)((5&lt;&lt;12)|64),  1, 8000}};</div><div>    FILE *f = fopen("rec.bin", "wb"); if (!f) return 1;</div><div>    size_t nw = fwrite(w, sizeof(Rec), 3, f); fclose(f);</div><div>    Rec r[3]; f = fopen("rec.bin", "rb"); if (!f) return 1;</div><div>    size_t nr = fread(r, sizeof(Rec), 3, f); fclose(f);</div><div>    printf("sz=%zu nw=%zu nr=%zu\n", sizeof(Rec), nw, nr);</div><div>    printf("r0 type=%u len=%u amt=%u\n", (r[0].hdr&gt;&gt;12)&amp;0xF, r[0].hdr&amp;0xFFF, r[0].amt);</div><div>    return 0;</div><div>}</div></div>
    say: Chương trình đóng gói sẵn một mảng ba bản ghi mười sáu bai rồi ghi thẳng xuống tệp nhị phân tạm. Ngay sau đó chương trình mở tệp ở chế độ đọc nhị phân, đếm số khối đọc được và dùng mặt nạ bít tách loại cùng độ dài bản ghi đầu tiên. Chu trình ghi trọn ba bản ghi xuống đĩa rồi đọc ngược lại kiểm chứng tính toàn vẹn tuyệt đối của định dạng nhị phân.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>sz=16 nw=3 nr=3</div><div>r0 type=5 len=320 amt=50000</div></div>
    say: Đầu ra chạy thật xác nhận mỗi bản ghi chiếm tròn mười sáu bai và số khối đọc về bằng đúng ba. Phép toán bít tách lại chính xác loại bằng năm và độ dài bằng ba trăm hai mươi khớp hoàn toàn dữ liệu ban đầu. Giá trị tách ra khớp hoàn toàn loại năm, độ dài ba trăm hai mươi và số tiền năm mươi nghìn như ban đầu.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chéo bằng tính tổng độ dài tệp và số dư 0 byte đệm
  checks:
  - alg.cpr_pack_rec_bytes() * 3 == 48
  steps:
  - show: <div class='box ok'><p>Tổng byte tệp nhị phân = 3 × (8 + 2 + 2 + 4) = 3 × 16 = <b>48</b> byte.</p><p>Phép tách <code>(20800 &gt;&gt; 12) &amp; 0xF == 5</code> và <code>20800 &amp; 0xFFF == 320</code> khớp hoàn toàn với kết quả đọc từ tệp thật.</p></div>
    say: Ta kiểm chéo lại bằng tính tay vì cần xác nhận kích thước và giá trị bít không có sai số ngầm. Ba bản ghi mỗi bản ghi mười sáu bai cho tổng tệp đúng bốn mươi tám bai. Con số đóng gói dịch phải mười hai bít ra đúng năm và lấy mười hai bít thấp ra đúng ba trăm hai mươi. Khi xác nhận đủ cả dung lượng tệp nhị phân lẫn kết quả tách lại từng bít cờ, bạn bảo đảm lớp lưu trữ tốc độ cao vận hành đồng nhất khi ghi và đọc lại. Tính tổng bốn mươi tám bai bằng ba lần mười sáu khẳng định cấu trúc không sinh thêm bất kỳ phần đệm ẩn nào. Áp mặt nạ không ích ép và không ích ép ép ép đối xứng với phép ghép bít xác nhận hai chiều đóng mở không sai sót.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: dung lượng tệp nhị phân 16 byte cố định'
  checks:
  - 10_000_000 * 16 == 160_000_000
  steps:
  - show: <table class='t'><tr><th>số bản ghi</th><th>tệp chữ CSV (~40 B/dòng)</th><th>nhị phân 16 B/bản ghi</th><th>tiết kiệm đĩa</th></tr><tr><td><span style='white-space:nowrap'>1 000 (×1)</span></td><td>40 KB</td><td>16 KB</td><td>60% nhỏ hơn</td></tr><tr><td><span style='white-space:nowrap'>100 000 (×100)</span></td><td>4,0 MB</td><td>1,6 MB</td><td>60% nhỏ hơn</td></tr><tr><td><span style='white-space:nowrap'>10 000 000 (×10 000)</span></td><td>400 MB</td><td>160 MB</td><td>Tiết kiệm 240 MB</td></tr></table>
    say: Với một nghìn bản ghi sự khác biệt dung lượng mới là bốn mươi ki-lô-bai so với mười sáu ki-lô-bai. Nhưng ở quy mô mười triệu bản ghi, lưu dạng văn bản tốn tới bốn trăm mê-ga-bai trong khi tệp nhị phân chỉ tốn một trăm sáu mươi mê-ga-bai và đọc nhanh gấp nhiều lần. Khi lưu trữ hàng chục triệu bản ghi giao dịch tài chính, thu hẹp bản ghi còn mười sáu bai cắt giảm sáu mươi phần trăm dung lượng đĩa.
