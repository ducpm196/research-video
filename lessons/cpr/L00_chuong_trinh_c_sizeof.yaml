scenes:
- id: hook
  kind: hook
  title: Vì sao một dòng code C sai kích thước có thể làm hết bộ nhớ?
  checks:
  - 1_000_000 * 4 == 4_000_000
  - 1_000_000 * 8 == 8_000_000
  steps:
  - show: <div class='box key'><p>Một chương trình xử lý <b>1 000 000</b> mã giao dịch cần cấp bộ nhớ trước khi chạy. Nếu mỗi phần tử chiếm <b>4 byte</b>, ta chỉ tốn <b>4 MB</b>. Nếu dùng kiểu <b>8 byte</b>, chi phí tăng gấp đôi lên <b>8 MB</b>.</p><p>Khác với ngôn ngữ thông dịch, C biên dịch thẳng ra mã máy và yêu cầu bạn làm chủ từng byte dữ liệu ngay từ dòng đầu tiên.</p></div>
    say: Chào bạn đến với khoá lập trình C và quản lý bộ nhớ. Một chương trình xử lý một triệu mã giao dịch cần biết chính xác mỗi phần tử tốn bao nhiêu bai để cấp đúng bộ nhớ. Nếu chọn nhầm kiểu dữ liệu từ bốn bai sang tám bai, tổng dung lượng sẽ tăng gấp đôi ngay lập tức. Hôm nay chúng ta học cách biên dịch mã C chặt chẽ và đo chính xác kích thước từng kiểu trong bộ nhớ. Ước lượng chính xác kích thước từng phần tử giúp hệ thống tính đúng nhu cầu bộ nhớ trước khi đọc hàng triệu bản ghi. Sai lệch nhỏ chỉ một hai bai trên từng cấu trúc sẽ nhân thành hàng chục mê-ga-bai lãng phí khi tải dữ liệu lớn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
  - show: <table class='t'><tr><th>phần</th><th>nội dung mười bài từ bài 0 tới bài 9</th></tr><tr><td>Bài 0–2</td><td>Chương trình C, đo kích thước <code>sizeof</code>, tràn số nguyên và khung ngăn xếp</td></tr><tr><td>Bài 3–5</td><td>Chuỗi ký tự kết thúc bằng byte không, địa chỉ bộ nhớ và số học dịch chuyển địa chỉ</td></tr><tr><td>Bài 6–7</td><td>Cấp phát động trên vùng nhớ mở, kiểu cấu trúc, sắp trường tối ưu và danh sách liên kết</td></tr><tr><td>Bài 8–9</td><td>Đọc ghi tệp nhị phân, phép toán bit và bài tình huống phân tích nhật ký 16 byte</td></tr></table>
    say: Khoá này gồm mười bài liên tục từ bài 0 đến bài 9. Bài 0 đến bài 2 mở đầu bằng trình biên dịch, kích thước dữ liệu, tràn số và ngăn xếp. Bài 3 đến bài 5 học chuỗi ký tự, địa chỉ bộ nhớ và số học dịch chuyển địa chỉ. Bài 6 đến bài 7 học vùng nhớ mở, kiểu cấu trúc và danh sách liên kết. Bài 8 và bài 9 đóng gói tệp nhị phân rồi giải bài toán phân tích nhật ký. Mỗi bài đều gắn chặt công thức bộ nhớ với thử nghiệm biên dịch thật để kiểm chứng kết quả bằng số đo cụ thể.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    clear: true
    forward_ref: true
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>kiến thức nền đã có</th><th>vai trò trong bài này</th></tr><tr><td>Mở cửa sổ dòng lệnh và chạy tệp kịch bản</td><td>Chạy lệnh biên dịch và thực thi tệp nhị phân tạo ra</td></tr><tr><td>Đơn vị bit và byte (1 byte = 8 bit)</td><td>Đọc kết quả đo kích thước bộ nhớ trả về theo đơn vị byte</td></tr></table>
    say: Trước khi viết dòng C đầu tiên, ta nhớ lại hai nền tảng từ khoá thực hành dòng lệnh. Thứ nhất, bạn biết cách chạy lệnh và kiểm tra mã thoát trong cửa sổ dòng lệnh. Thứ hai, một bai gồm tám bít, là đơn vị đo kích thước nhỏ nhất mà ngôn ngữ C làm việc trực tiếp. Việc kiểm tra mã thoát sau mỗi lệnh chạy bảo đảm mọi lỗi biên dịch hay lỗi thực thi đều lộ rõ ngay lập tức.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu trên màn hình</th><th>ý nghĩa</th></tr><tr><td><code>gcc -std=c11 -Wall -Wextra -Werror</code></td><td>Trình biên dịch chuẩn C11, bật mọi cảnh báo và coi cảnh báo là lỗi</td></tr><tr><td><code>sizeof(T)</code></td><td>Toán tử tính số byte mà kiểu <code>T</code> hoặc biến chiếm tại lúc biên dịch</td></tr><tr><td><code>%zu</code></td><td>Mã định dạng dùng trong <code>printf</code> để in giá trị kiểu kích thước <code>size_t</code></td></tr></table>
    say: Ta giải mã ba ký hiệu quan trọng nhất trên màn hình. Đầu tiên là bộ bốn cờ biên dịch nghiêm ngặt giúp phát hiện sớm lỗi tiềm ẩn trước khi chạy. Thứ hai là toán tử đo kích thước trả về chính xác số bai mà một kiểu dữ liệu chiếm dụng. Cuối cùng là ký hiệu định dạng dùng để in giá trị kích thước không dấu ra màn hình. Các cờ cảnh báo nghiêm ngặt biến trình biên dịch thành người rà soát mã nguồn tự động trước khi chương trình kịp chạy. Toán tử đo kích thước chạy ngay lúc biên dịch nên hoàn toàn không tốn thêm chu kỳ bộ xử lý lúc thực thi thật.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Đường đi từ mã nguồn C tới tệp nhị phân chạy thật
  steps:
  - show: <div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="25" y="55" width="220" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="135.0" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">1. Mã nguồn .c</text><text x="135.0" y="125" font-size="15" text-anchor="middle" fill="#475569">Chữ người đọc, dùng sizeof</text><line x1="245" y1="102" x2="355" y2="102" stroke="#475569" stroke-width="2"/><polygon points="355,102 347.0,107.0 347.0,97.0" fill="#475569"/><text x="300" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">GCC dịch</text><rect x="355" y="55" width="250" height="95" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="480.0" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">2. Tệp thực thi</text><text x="480.0" y="125" font-size="15" text-anchor="middle" fill="#475569">Mã máy 64-bit, -Werror</text><line x1="605" y1="102" x2="715" y2="102" stroke="#475569" stroke-width="2"/><polygon points="715,102 707.0,107.0 707.0,97.0" fill="#475569"/><text x="660" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">Nạp RAM</text><rect x="715" y="55" width="220" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="825.0" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">3. Tiến trình chạy</text><text x="825.0" y="125" font-size="15" text-anchor="middle" fill="#475569">Cấp ô nhớ đúng từng byte</text></svg></div>
    say: Sơ đồ mô tả ba chặng biến văn bản C thành chương trình chạy trên máy. Tệp mã nguồn chứa văn bản con người viết cùng các khai báo kiểu rõ ràng. Trình biên dịch kiểm tra chặt toàn bộ quy tắc kiểu, biến dịch sang tệp mã máy thực thi.
    clear: true
  - show: ''
    say: Khi chạy, hệ điều hành nạp mã máy vào bộ nhớ và cấp từng ô đúng kích thước đã xác định. Mã nguồn văn bản đi qua bộ dịch trở thành lệnh máy gắn chặt bố cục ô nhớ sáu mươi bốn bít cố định. Hệ điều hành nạp tệp thực thi vào bộ nhớ và cấp phát không gian theo đúng thông số kiểu dữ liệu đã khai báo.
- id: formula
  kind: formula
  title: Quy tắc kích thước kiểu cơ bản trên kiến trúc 64-bit
  checks:
  - 'alg.cpr_sizeof_64() == {''char'': 1, ''short'': 2, ''int'': 4, ''long_long'': 8, ''ptr'': 8}'
  steps:
  - show: <table class='t'><tr><th>kiểu dữ liệu C</th><th>kích thước chuẩn đo trên máy 64-bit</th><th>ứng dụng điển hình</th></tr><tr><td><code>char</code></td><td>1 byte</td><td>Lưu 1 ký tự hoặc 1 byte dữ liệu thô</td></tr><tr><td><code>short</code></td><td>2 byte</td><td>Số nguyên nhỏ, mã trạng thái ngắn</td></tr><tr><td><code>int</code></td><td>4 byte</td><td>Biến đếm vòng lặp, số nguyên thông dụng</td></tr><tr><td><code>long long</code> / <code>void *</code></td><td>8 byte</td><td>Số tiền lớn 64-bit và địa chỉ bộ nhớ 64-bit</td></tr></table>
    say: Bảng tổng hợp kích thước bốn nhóm kiểu hay dùng nhất trên hệ thống sáu mươi bốn bít. Kiểu ký tự luôn rộng đúng một bai theo chuẩn ngôn ngữ C. Kiểu số nguyên ngắn chiếm hai bai, số nguyên chuẩn chiếm bốn bai, còn số nguyên dài và địa chỉ bộ nhớ chiếm tám bai. Tuy nhiên trên thiết bị nhúng mười sáu bít hoặc ba mươi hai bít, độ rộng này có thể khác nên luôn đo bằng toán tử đo kích thước. Chuẩn ngôn ngữ chỉ cam kết độ rộng tối thiểu chứ không khoá cứng số bai của kiểu số nguyên trên mọi kiến trúc chip. Do kích thước biến giữ vị trí phụ thuộc vào độ rộng thanh ghi địa chỉ nên mọi biến giữ vị trí ô nhớ đều bằng tám bai trên máy sáu mươi bốn bít.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.5'
    clear: true
- id: example
  kind: example
  title: Biên dịch và chạy chương trình đo kích thước thật
  checks:
  - 4 * 100 == 400
  - 400 // 4 == 100
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;stdio.h&gt;</code></td><td>Nạp khai báo hàm in <code>printf</code> từ thư viện chuẩn</td></tr><tr><td><code>int main(void) { ... return 0; }</code></td><td>Điểm bắt đầu chạy chương trình; trả về 0 nghĩa là thành công</td></tr><tr><td><code>printf("... %zu\n", sizeof(int));</code></td><td>In kích thước không dấu kiểu <code>size_t</code> (ép kiểu <code>(size_t)n</code> khi nhân quy mô lớn)</td></tr><tr><td><code>sizeof(void *)</code> và <code>arr[0]</code></td><td>Kích thước địa chỉ bộ nhớ; cặp ngoặc vuông <code>arr[i]</code> truy cập phần tử mảng từ chỉ số 0</td></tr></table>
    say: Trước khi đọc mã C đầy đủ, ta giải mã đủ bốn thành phần trên bảng để nhìn là hiểu ngay. Dòng đầu nạp thư viện vào ra chuẩn, dòng hai là hàm chính bắt đầu chạy. Hàm in xuất kích thước kiểu size t, nhớ ép kiểu size t khi nhân số phần tử quy mô lớn để không tràn int. Mục cuối đo kích thước một địa chỉ bộ nhớ, đồng thời ngoặc vuông lấy phần tử mảng bắt đầu từ chỉ số không. Kiểu kích thước không dấu chuyên dùng chứa số đếm phần tử và số bai nhằm tránh hoàn toàn giá trị âm vô nghĩa.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Chương trình C đo kích thước các kiểu dữ liệu thật trên máy</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>int main(void) {</div><div>    printf("char=%zu\n", sizeof(char));</div><div>    printf("short=%zu\n", sizeof(short));</div><div>    printf("int=%zu\n", sizeof(int));</div><div>    printf("long_long=%zu\n", sizeof(long long));</div><div>    printf("ptr=%zu\n", sizeof(void *));</div><div>    return 0;</div><div>}</div></div>
    say: Đoạn mã hoàn chỉnh chỉ gồm mười dòng nhưng dùng toán tử đo kích thước cho cả năm kiểu cơ bản rồi in thẳng ra màn hình. Đặc tả định dạng phần trăm rét u đi đôi với kết quả của toán tử kích thước để bảo đảm khả năng biên dịch đa nền tảng.
    clear: true
    focus:
    - 1
    - 2
  - show: <p><b>Biên dịch chuẩn C11 và chạy thật (<code>gcc -std=c11 -Wall -Wextra -Werror size_demo.c -o size_demo &amp;&amp; ./size_demo</code>):</b></p><div class="code"><div>char=1</div><div>short=2</div><div>int=4</div><div>long_long=8</div><div>ptr=8</div></div>
    say: Khi biên dịch bằng cờ chuẩn C11 bật đủ cảnh báo thành lỗi rồi chạy trên máy sáu mươi bốn bít, kết quả lần lượt là một, hai, bốn, tám và tám bai. Dãy số kết quả một hai bốn tám tám khẳng định chính xác mức chênh lệch bộ nhớ giữa các kiểu số nguyên chuẩn.
    clear: true
    focus:
    - 1
    - 2
- id: check
  kind: check
  title: Kiểm chéo bằng kích thước cả mảng và độ dài suy ngược
  checks:
  - 400 // 4 == 100
  steps:
  - show: <p><b>Đo trực tiếp tổng số byte của mảng 100 phần tử int</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>int main(void) {</div><div>    int arr[100];</div><div>    printf("arr_bytes=%zu elem=%zu\n", sizeof(arr), sizeof(arr[0]));</div><div>    printf("len=%zu\n", sizeof(arr) / sizeof(arr[0]));</div><div>    return 0;</div><div>}</div></div>
    say: 'Ta kiểm tra bằng một đường khác vì cần đối chiếu kích thước cả mảng: khai báo mảng một trăm số nguyên rồi lấy tổng số bai của mảng chia cho kích thước phần tử đầu. Chia tổng dung lượng cả mảng cho kích thước phần tử đầu tiên là phép tính tổng quát không phụ thuộc vào con số bốn bai cứng.'
    clear: true
    focus:
    - 1
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>arr_bytes=400 elem=4</div><div>len=100</div></div>
    say: Đầu ra thật xác nhận tổng bộ nhớ bằng đúng bốn trăm bai và phép chia ngược trả lại đúng một trăm phần tử vì mỗi phần tử chiếm bốn bai. Số liệu đối chiếu này khẳng định trình biên dịch áp dụng đúng mô hình kích thước sáu mươi bốn bít chuẩn, bảo đảm các phép tính bộ đệm quy mô lớn về sau không sai lệch. Bất biến tổng chia đơn vị trả lại đúng một trăm phần tử xác nhận mảng nằm liên tiếp không có khoảng trống dư thừa.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: một mảng int và long long tốn bao nhiêu RAM?'
  checks:
  - 100 * 4 == 400
  - 10_000 * 4 == 40_000
  - 1_000_000 * 4 == 4_000_000
  - 1_000_000 * 8 == 8_000_000
  steps:
  - show: <table class='t'><tr><th>số phần tử n</th><th>mảng int (4 byte)</th><th>mảng long long (8 byte)</th></tr><tr><td><span style='white-space:nowrap'>100 (×1)</span></td><td>400 byte</td><td>800 byte</td></tr><tr><td><span style='white-space:nowrap'>10 000 (×100)</span></td><td>40 000 byte (~39 KB)</td><td>80 000 byte (~78 KB)</td></tr><tr><td><span style='white-space:nowrap'>1 000 000 (×10 000)</span></td><td>4 000 000 byte (~3,8 MB)</td><td>8 000 000 byte (~7,6 MB)</td></tr></table>
    say: 'Nhìn bảng quy mô ta thấy mối quan hệ tuyến tính rõ rệt: gấp trăm lần số phần tử tốn gấp trăm lần bộ nhớ, gấp vạn lần tốn gấp vạn lần. Một triệu phần tử kiểu bốn bai tốn bốn triệu bai, tức gần bốn mê-ga-bai. Chọn sai kiểu dữ liệu sang tám bai làm nhân đôi toàn bộ chi phí bộ nhớ đệm khi xử lý dữ liệu lớn. Khi mở rộng mảng lên hàng chục triệu dòng, việc chọn đúng kiểu ba mươi hai bít thay cho sáu mươi bốn bít tiết kiệm nửa bộ nhớ. Tính trước bảng quy mô còn giúp phát hiện sớm nguy cơ vượt quá dung lượng bộ nhớ vật lý sẵn có của máy chủ.'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Đoán cứng int luôn bằng 4 byte mà không dùng sizeof.</b> Khi chuyển sang hệ thống nhúng 16-bit, kích thước thật chỉ còn 2 byte.<br><b>Lỗi 2: Bỏ qua cảnh báo lúc biên dịch.</b> Thiếu cờ <code>-Wall -Wextra -Werror</code> khiến biến chưa khởi tạo hoặc sai mã in âm thầm vượt qua.<br><b>Lỗi 3: Nhầm <code>sizeof(mảng)</code> khi truyền vào hàm.</b> Bên ngoài mảng biết đủ 400 byte, còn bên trong hàm chỉ nhận kích thước địa chỉ 8 byte (sẽ học kỹ ở phần sau).</div></td></tr></table>'
    say: Ba lỗi phổ biến kể cả người đã đi làm hay vấp. Thứ nhất là đoán cứng độ rộng kiểu dữ liệu thay vì dùng toán tử đo kích thước. Thứ hai là tắt cảnh báo trình biên dịch khiến lỗi định dạng hoặc biến rác chạy ngầm ngoài thực tế. Thứ ba là nhầm tổng dung lượng mảng bên ngoài với tham số nhận vào trong hàm.
    clear: true
  - show: ''
    say: Nhiều lỗi ngầm trên máy ba mươi hai bít sang máy sáu mươi bốn bít phát sinh chỉ vì lập trình viên gán cứng số bốn hoặc tám. Bật đầy đủ cờ cảnh báo và giữ kỷ luật sửa sạch từng dòng nhắc nhở giúp bảo vệ phần mềm khỏi lỗi bộ nhớ về sau.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 250 * 8 == 2000
  steps:
  - show: <ol><li>Trên hệ 64-bit, một mảng 250 phần tử kiểu <code>long long</code> chiếm bao nhiêu byte?</li><li>Cờ biên dịch nào biến mọi cảnh báo thành lỗi bắt buộc sửa trước khi tạo tệp chạy?</li></ol>
    say: Đến lượt bạn tự kiểm tra nhanh. Câu một, trên máy sáu mươi bốn bít, mảng hai trăm năm mươi phần tử kiểu số nguyên tám bai chiếm bao nhiêu bai? Câu hai, cờ biên dịch nào biến mọi cảnh báo thành lỗi dừng biên dịch? Dừng vi-đê-ô và tính ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 250 × 8 = <b>2 000</b> byte.</p></td></tr></table>
    say: 'Đáp án câu một: mỗi phần tử tám bai nhân hai trăm năm mươi bằng đúng hai nghìn bai. Cách đo trực tiếp bằng toán tử kích thước cũng giúp mã chạy đồng nhất khi biên dịch chéo giữa nhiều kiến trúc vi xử lý khác nhau. Thay giá trị hai trăm năm mươi và số bai thực tế vào công thức tuyến tính luôn giúp ước lượng nhanh bộ nhớ cần xin.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Cờ <code>-Werror</code> kết hợp với <code>-Wall -Wextra</code> buộc mọi cảnh báo phải được sửa sạch.</p></td></tr></table>
    say: 'Đáp án câu hai: thêm cờ biến cảnh báo thành lỗi giúp chặn mọi sai sót cú pháp và kiểu ngay tại bước biên dịch. Bật cờ biến cảnh báo thành lỗi ngay từ ngày đầu sẽ rèn thói quen viết mã sạch kiểu dữ liệu và không để sót lỗi ngầm. Coi cảnh báo như lỗi bắt buộc rèn thói quen viết mã sạch rõ ràng ngay từ những bài nhập môn đầu tiên.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L00
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L00:</b> đọc <code>arr_len scale_n</code> từ <code>stdin</code>, đo kích thước bằng <code>sizeof</code> và tính tổng byte (ép kiểu <code>size_t</code>) để in 3 dòng <code>char=.. int=.. ll=.. ptr=..</code>, <code>arr_bytes=..</code>, <code>total_bytes=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>64 2000000</code> | Chấm: <code>bash labs/cham.sh CPR L00 duong_dan/bai_cua_ban.c</code> (chi tiết: <code>labs/CPR/L00/de.md</code>)</p></div>'
    say: Hãy mở đề bài L00 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Bảo đảm biên dịch chương trình với đầy đủ cờ chuẩn nghiêm ngặt trước khi đưa qua bộ dữ liệu kiểm thử tự động.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L00/du_lieu.txt</code></b></p><div class="code"><div>char=1 int=4 ll=8 ptr=8</div><div>arr_bytes=256</div><div>total_bytes=8000000</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L00 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Kiểm kỹ phép ép sang kiểu kích thước không dấu khi nhân số phần tử với cỡ phần tử nhằm tránh tràn số ba mươi hai bít.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: '<div class=''box ok''><p><b>Gợi ý nếu kẹt ở bài L00:</b> (1) đọc đủ 2 số từ stdin bằng scanf; (2) ép kiểu size_t khi nhân số phần tử quy mô lớn; (3) biên dịch lại với -Wall -Wextra -Werror.</p></div><p class="note"><b>Gợi ý đọc <code>stdin</code>:</b> <code>unsigned long long arr_len = 0, scale_n = 0; if (scanf("%llu %llu", &amp;arr_len, &amp;scale_n) != 2) return 1;</code> (<code>&amp;</code> lấy địa chỉ biến cho <code>scanf</code> ghi giá trị vào).</p>'
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Thử chạy kiểm lại với những số lượng phần tử thật lớn để xác nhận không mất mát phần cao của tích tổng bai.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>Chọn kiểu đúng</span><span class='a'>→</span><span class='n'>Đo bằng sizeof</span><span class='a'>→</span><span class='n'>Biên dịch -Wall -Wextra -Werror</span></div>
    say: Tổng kết lại, chuỗi làm việc chuẩn trong C là chọn đúng kiểu dữ liệu, đo lại bằng toán tử kích thước và luôn biên dịch nghiêm ngặt. Khi giữ thói quen này từ ngày đầu, bạn sẽ tránh được hàng loạt lỗi âm thầm về bộ nhớ ở các hệ thống lớn sau này.
    clear: true
  - show: ''
    say: Nguyên tắc kiểm soát kích thước kiểu dữ liệu này sẽ đồng hành suốt quá trình làm việc với bộ nhớ. Thói quen đo lại kích thước thật và tuân thủ cảnh báo trình biên dịch bảo đảm mọi dòng mã C đều minh bạch về bộ nhớ. Nắm chắc bề rộng từng kiểu nguyên là chìa khoá để hiểu các giới hạn biểu diễn số ở phần kế tiếp.
  - show: <div class='box ok'><b>Bài sau (bài 1):</b> Biến, vòng lặp và ranh giới tràn số nguyên trong C</div>
    say: Bài tiếp theo là bài 1, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Bước tiếp theo ta đi sâu vào ranh giới miền giá trị số nguyên và các bẫy tràn số âm thầm trong ngôn ngữ C. Chuẩn bị tư duy về giới hạn biểu diễn giúp bạn chủ động phòng tránh lỗi tràn số cực kỳ nguy hiểm ở bài kế.
    clear: true
    forward_ref: true
