  lab: labs/CPR/L00
  steps:
  - show: <div class='box key'><p><b>Bài thực hành L00:</b> mở đề tại <code>labs/CPR/L00/de.md</code>, viết mã C
      chuẩn C11 vào một tệp tạm rồi mở <b>Git Bash</b> (cài ở <code>Start → Git → Git Bash</code> hoặc chuột phải
      thư mục chọn <b>Open Git Bash here</b>) và chạy lệnh chấm thật bằng trình biên dịch G C C:</p><p><code>bash
      labs/cham.sh CPR L00 duong_dan/bai_cua_ban.c</code></p></div>
    say: Bây giờ đến phần bạn tự viết mã C và chấm thật trên máy. Bạn mở đề thực hành, viết lời giải vào tệp riêng,
      rồi mở cửa sổ dòng lệnh để chạy trình chấm biên dịch và đối chiếu kết quả. Hãy bấm tạm dừng và tự làm trước.
