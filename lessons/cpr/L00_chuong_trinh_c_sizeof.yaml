id: L00
course: CPR
series: 'CPR · Lập trình C và bộ nhớ: con trỏ, cấp phát động, tệp và gcc'
title: Bài 0 — Chương trình C đầu tiên, biên dịch với GCC và kích thước bộ nhớ
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
af2: true
covers:
- objective: 1
  scene: example
- objective: 2
  scene: formula
- objective: 3
  scene: quymo
source: curriculum/cpr.yaml L00; audit/cpr/verify_cpr.py L00 (biên dịch và chạy thật bằng GCC 16.2.0 với cờ -std=c11
  -Wall -Wextra -Werror); chuẩn ngôn ngữ ISO/IEC 9899:2011 (C11, CITED theo mã chuẩn)
assumes: []
objectives:
- Biên dịch và chạy chương trình C với cờ -std=c11 -Wall -Wextra -Werror
- Đo kích thước byte của char, short, int, long long và con trỏ trên máy 64-bit
- Tính dung lượng mảng số nguyên 64-bit ở ba quy mô 100, 10 000 và 1 000 000 phần tử
asr_reviewed:
- reason: 'ASR chép “Dừng video và tính ra giấy.” (0.714): phát âm “vi-đê-ô” rõ ràng, Whisper chép thành từ tiếng
    Anh “video”.'
  sentence: Dừng vi-đê-ô và tính ra giấy.
- reason: 'ASR chép “1 triệu phần tử kiểu bốn bay tốn 4 triệu bay, tức gần 4 megabay.” (0.750): phiên âm “bai”/“mê-ga-bai”
    đọc rõ, Whisper phiên sang “bay”/“megabay”.'
  sentence: Một triệu phần tử kiểu bốn bai tốn bốn triệu bai, tức gần bốn mê-ga-bai.
- reason: 'ASR chép “…64 bit, mạng 250 phần tự… 8 bay chiếm bao nhiêu bay?” (0.792): “bai”→“bay”, đồng âm “bít mảng/tử”
    khi đọc liền mạch.'
  sentence: Câu một, trên máy sáu mươi bốn bít, mảng hai trăm năm mươi phần tử kiểu số nguyên tám bai chiếm bao
    nhiêu bai?
- reason: 'ASR chép “Thứ 2, một bay gồm 8 bích… ngu ngữ sẽ làm việc trực tiếp.” (0.826): TTS đọc chuẩn tên chữ cái
    “C” (xê), Whisper nhiễu chữ đơn “C”.'
  sentence: Thứ hai, một bai gồm tám bít, là đơn vị đo kích thước nhỏ nhất mà ngôn ngữ C làm việc trực tiếp.
scenes:
- id: hook
  kind: hook
  title: Vì sao một dòng code C sai kích thước có thể làm hết bộ nhớ?
  checks:
  - 1_000_000 * 4 == 4_000_000
  - 1_000_000 * 8 == 8_000_000
  steps:
  - show: <div class='box key'><p>Một chương trình xử lý <b>1 000 000</b> mã giao dịch cần cấp bộ nhớ trước khi
      chạy. Nếu mỗi phần tử chiếm <b>4 byte</b>, ta chỉ tốn <b>4 MB</b>. Nếu dùng kiểu <b>8 byte</b>, chi phí tăng
      gấp đôi lên <b>8 MB</b>.</p><p>Khác với ngôn ngữ thông dịch, C biên dịch thẳng ra mã máy và yêu cầu bạn làm
      chủ từng byte dữ liệu ngay từ dòng đầu tiên.</p></div>
    say: Chào bạn đến với khoá lập trình C và quản lý bộ nhớ. Một chương trình xử lý một triệu mã giao dịch cần
      biết chính xác mỗi phần tử tốn bao nhiêu bai để cấp đúng bộ nhớ. Nếu chọn nhầm kiểu dữ liệu từ bốn bai sang
      tám bai, tổng dung lượng sẽ tăng gấp đôi ngay lập tức. Hôm nay chúng ta học cách biên dịch mã C chặt chẽ và
      đo chính xác kích thước từng kiểu trong bộ nhớ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
  - show: <table class='t'><tr><th>phần</th><th>nội dung mười bài từ bài 0 tới bài 9</th></tr><tr><td>Bài 0–2</td><td>Chương
      trình C, đo kích thước <code>sizeof</code>, tràn số nguyên và khung ngăn xếp</td></tr><tr><td>Bài 3–5</td><td>Chuỗi
      ký tự kết thúc bằng byte không, địa chỉ bộ nhớ và số học dịch chuyển địa chỉ</td></tr><tr><td>Bài 6–7</td><td>Cấp
      phát động trên vùng nhớ mở, kiểu cấu trúc, sắp trường tối ưu và danh sách liên kết</td></tr><tr><td>Bài 8–9</td><td>Đọc
      ghi tệp nhị phân, phép toán bit và bài tình huống phân tích nhật ký 16 byte</td></tr></table>
    say: Khoá này gồm mười bài liên tục từ bài 0 đến bài 9. Bài 0 đến bài 2 mở đầu bằng trình biên dịch, kích thước
      dữ liệu, tràn số và ngăn xếp. Bài 3 đến bài 5 học chuỗi ký tự, địa chỉ bộ nhớ và số học dịch chuyển địa chỉ.
      Bài 6 đến bài 7 học vùng nhớ mở, kiểu cấu trúc và danh sách liên kết. Bài 8 và bài 9 đóng gói tệp nhị phân
      rồi giải bài toán phân tích nhật ký.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    forward_ref: true
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>kiến thức nền đã có</th><th>vai trò trong bài này</th></tr><tr><td>Mở cửa sổ
      dòng lệnh và chạy tệp kịch bản</td><td>Chạy lệnh biên dịch và thực thi tệp nhị phân tạo ra</td></tr><tr><td>Đơn
      vị bit và byte (1 byte = 8 bit)</td><td>Đọc kết quả đo kích thước bộ nhớ trả về theo đơn vị byte</td></tr></table>
    say: Trước khi viết dòng C đầu tiên, ta nhớ lại hai nền tảng từ khoá thực hành dòng lệnh. Thứ nhất, bạn biết
      cách chạy lệnh và kiểm tra mã thoát trong cửa sổ dòng lệnh. Thứ hai, một bai gồm tám bít, là đơn vị đo kích
      thước nhỏ nhất mà ngôn ngữ C làm việc trực tiếp.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu trên màn hình</th><th>ý nghĩa</th></tr><tr><td><code>gcc -std=c11 -Wall
      -Wextra -Werror</code></td><td>Trình biên dịch chuẩn C11, bật mọi cảnh báo và coi cảnh báo là lỗi</td></tr><tr><td><code>sizeof(T)</code></td><td>Toán
      tử tính số byte mà kiểu <code>T</code> hoặc biến chiếm tại lúc biên dịch</td></tr><tr><td><code>%zu</code></td><td>Mã
      định dạng dùng trong <code>printf</code> để in giá trị kiểu kích thước <code>size_t</code></td></tr></table>
    say: Ta giải mã ba ký hiệu quan trọng nhất trên màn hình. Đầu tiên là bộ bốn cờ biên dịch nghiêm ngặt giúp phát
      hiện sớm lỗi tiềm ẩn trước khi chạy. Thứ hai là toán tử đo kích thước trả về chính xác số bai mà một kiểu
      dữ liệu chiếm dụng. Cuối cùng là ký hiệu định dạng dùng để in giá trị kích thước không dấu ra màn hình.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Đường đi từ mã nguồn C tới tệp nhị phân chạy thật
  steps:
  - show: <div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="25" y="55" width="220" height="95" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="135.0" y="97" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">1. Mã nguồn .c</text><text x="135.0" y="125" font-size="15" text-anchor="middle"
      fill="#475569">Chữ người đọc, dùng sizeof</text><line x1="245" y1="102" x2="355" y2="102" stroke="#475569"
      stroke-width="2"/><polygon points="355,102 347.0,107.0 347.0,97.0" fill="#475569"/><text x="300" y="94" font-size="14"
      font-weight="600" text-anchor="middle" fill="#1e293b">GCC dịch</text><rect x="355" y="55" width="250" height="95"
      rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="480.0" y="97" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">2. Tệp thực thi</text><text x="480.0" y="125" font-size="15" text-anchor="middle"
      fill="#475569">Mã máy 64-bit, -Werror</text><line x1="605" y1="102" x2="715" y2="102" stroke="#475569" stroke-width="2"/><polygon
      points="715,102 707.0,107.0 707.0,97.0" fill="#475569"/><text x="660" y="94" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">Nạp RAM</text><rect x="715" y="55" width="220" height="95" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="825.0" y="97" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">3. Tiến trình chạy</text><text x="825.0" y="125" font-size="15" text-anchor="middle" fill="#475569">Cấp
      ô nhớ đúng từng byte</text></svg></div>
    say: Sơ đồ mô tả ba chặng biến văn bản C thành chương trình chạy trên máy. Tệp mã nguồn chứa văn bản con người
      viết cùng các khai báo kiểu rõ ràng. Trình biên dịch kiểm tra chặt toàn bộ quy tắc kiểu, biến dịch sang tệp
      mã máy thực thi. Khi chạy, hệ điều hành nạp mã máy vào bộ nhớ và cấp từng ô đúng kích thước đã xác định.
    clear: true
- id: formula
  kind: formula
  title: Quy tắc kích thước kiểu cơ bản trên kiến trúc 64-bit
  checks:
  - 'alg.cpr_sizeof_64() == {''char'': 1, ''short'': 2, ''int'': 4, ''long_long'': 8, ''ptr'': 8}'
  steps:
  - show: <table class='t'><tr><th>kiểu dữ liệu C</th><th>kích thước chuẩn đo trên máy 64-bit</th><th>ứng dụng điển
      hình</th></tr><tr><td><code>char</code></td><td>1 byte</td><td>Lưu 1 ký tự hoặc 1 byte dữ liệu thô</td></tr><tr><td><code>short</code></td><td>2
      byte</td><td>Số nguyên nhỏ, mã trạng thái ngắn</td></tr><tr><td><code>int</code></td><td>4 byte</td><td>Biến
      đếm vòng lặp, số nguyên thông dụng</td></tr><tr><td><code>long long</code> / <code>void *</code></td><td>8
      byte</td><td>Số tiền lớn 64-bit và địa chỉ bộ nhớ 64-bit</td></tr></table>
    say: Bảng tổng hợp kích thước bốn nhóm kiểu hay dùng nhất trên hệ thống sáu mươi bốn bít. Kiểu ký tự luôn rộng
      đúng một bai theo chuẩn ngôn ngữ C. Kiểu số nguyên ngắn chiếm hai bai, số nguyên chuẩn chiếm bốn bai, còn
      số nguyên dài và địa chỉ bộ nhớ chiếm tám bai. Tuy nhiên trên thiết bị nhúng mười sáu bít hoặc ba mươi hai
      bít, độ rộng này có thể khác nên luôn đo bằng toán tử đo kích thước.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
- id: example
  kind: example
  title: Biên dịch và chạy chương trình đo kích thước thật
  checks:
  - 4 * 100 == 400
  - 400 // 4 == 100
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;stdio.h&gt;</code></td><td>Nạp
      khai báo hàm in <code>printf</code> từ thư viện chuẩn</td></tr><tr><td><code>int main(void) { ... return 0;
      }</code></td><td>Điểm bắt đầu chạy chương trình; trả về 0 nghĩa là thành công</td></tr><tr><td><code>printf("...
      %zu\n", sizeof(int));</code></td><td>In chữ kèm giá trị kích thước không dấu, <code>\n</code> để xuống dòng</td></tr><tr><td><code>sizeof(void
      *)</code></td><td>Kích thước của một biến giữ địa chỉ ô nhớ trên máy hiện tại</td></tr></table>
    say: Trước khi đọc mã C đầy đủ, ta giải mã đủ bốn thành phần trên bảng để nhìn là hiểu ngay. Dòng đầu nạp thư
      viện vào ra chuẩn, dòng hai là hàm chính bắt đầu chạy. Hàm in xuất kích thước không dấu, còn tham chiếu rỗng
      giúp đo kích thước một địa chỉ ô nhớ trên máy.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: <p><b>Chương trình C đo kích thước các kiểu dữ liệu thật trên máy</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>int main(void) {</div><div>    printf("char=%zu\n", sizeof(char));</div><div>    printf("short=%zu\n",
      sizeof(short));</div><div>    printf("int=%zu\n", sizeof(int));</div><div>    printf("long_long=%zu\n", sizeof(long
      long));</div><div>    printf("ptr=%zu\n", sizeof(void *));</div><div>    return 0;</div><div>}</div></div>
    say: Đoạn mã hoàn chỉnh chỉ gồm mười dòng nhưng dùng toán tử đo kích thước cho cả năm kiểu cơ bản rồi in thẳng
      ra màn hình.
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>char=1</div><div>short=2</div><div>int=4</div><div>long_long=8</div><div>ptr=8</div></div>
    say: Khi biên dịch và chạy thật bằng trình biên dịch C trên máy sáu mươi bốn bít, kết quả lần lượt là một, hai,
      bốn, tám và tám bai.
    clear: true
- id: check
  kind: check
  title: Kiểm chéo bằng kích thước cả mảng và độ dài suy ngược
  checks:
  - 400 // 4 == 100
  steps:
  - show: <p><b>Đo trực tiếp tổng số byte của mảng 100 phần tử int</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>int
      main(void) {</div><div>    int arr[100];</div><div>    printf("arr_bytes=%zu elem=%zu\n", sizeof(arr), sizeof(arr[0]));</div><div>    printf("len=%zu\n",
      sizeof(arr) / sizeof(arr[0]));</div><div>    return 0;</div><div>}</div></div>
    say: 'Ta kiểm tra bằng một đường khác vì cần đối chiếu kích thước cả mảng: khai báo mảng một trăm số nguyên
      rồi lấy tổng số bai của mảng chia cho kích thước phần tử đầu.'
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>arr_bytes=400 elem=4</div><div>len=100</div></div>
    say: Đầu ra thật xác nhận tổng bộ nhớ bằng đúng bốn trăm bai và phép chia ngược trả lại đúng một trăm phần tử
      vì mỗi phần tử chiếm bốn bai.
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: một mảng int và long long tốn bao nhiêu RAM?'
  checks:
  - 100 * 4 == 400
  - 10_000 * 4 == 40_000
  - 1_000_000 * 4 == 4_000_000
  steps:
  - show: <table class='t'><tr><th>số phần tử n</th><th>mảng int (4 byte)</th><th>mảng long long (8 byte)</th></tr><tr><td><span
      style='white-space:nowrap'>100 (×1)</span></td><td>400 byte</td><td>800 byte</td></tr><tr><td><span style='white-space:nowrap'>10
      000 (×100)</span></td><td>40 000 byte (~39 KB)</td><td>80 000 byte (~78 KB)</td></tr><tr><td><span style='white-space:nowrap'>1
      000 000 (×10 000)</span></td><td>4 000 000 byte (~3,8 MB)</td><td>8 000 000 byte (~7,6 MB)</td></tr></table>
    say: 'Nhìn bảng quy mô ta thấy mối quan hệ tuyến tính rõ rệt: gấp trăm lần số phần tử tốn gấp trăm lần bộ nhớ,
      gấp vạn lần tốn gấp vạn lần. Một triệu phần tử kiểu bốn bai tốn bốn triệu bai, tức gần bốn mê-ga-bai. Chọn
      sai kiểu dữ liệu sang tám bai làm nhân đôi toàn bộ chi phí bộ nhớ đệm khi xử lý dữ liệu lớn.'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Đoán cứng int luôn bằng 4 byte mà không dùng sizeof.</b> Khi chuyển sang hệ thống nhúng 16-bit, kích thước
      thật chỉ còn 2 byte.<br><b>Lỗi 2: Bỏ qua cảnh báo lúc biên dịch.</b> Thiếu cờ <code>-Wall -Wextra -Werror</code>
      khiến biến chưa khởi tạo hoặc sai mã in âm thầm vượt qua.<br><b>Lỗi 3: Nhầm <code>sizeof(mảng)</code> khi
      truyền vào hàm.</b> Bên ngoài mảng biết đủ 400 byte, còn bên trong hàm chỉ nhận kích thước địa chỉ 8 byte
      (sẽ học kỹ ở phần sau).</div></td></tr></table>'
    say: Ba lỗi phổ biến kể cả người đã đi làm hay vấp. Thứ nhất là đoán cứng độ rộng kiểu dữ liệu thay vì dùng
      toán tử đo kích thước. Thứ hai là tắt cảnh báo trình biên dịch khiến lỗi định dạng hoặc biến rác chạy ngầm
      ngoài thực tế. Thứ ba là nhầm tổng dung lượng mảng bên ngoài với tham số nhận vào trong hàm.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 250 * 8 == 2000
  steps:
  - show: <ol><li>Trên hệ 64-bit, một mảng 250 phần tử kiểu <code>long long</code> chiếm bao nhiêu byte?</li><li>Cờ
      biên dịch nào biến mọi cảnh báo thành lỗi bắt buộc sửa trước khi tạo tệp chạy?</li></ol>
    say: Đến lượt bạn tự kiểm tra nhanh. Câu một, trên máy sáu mươi bốn bít, mảng hai trăm năm mươi phần tử kiểu
      số nguyên tám bai chiếm bao nhiêu bai? Câu hai, cờ biên dịch nào biến mọi cảnh báo thành lỗi dừng biên dịch?
      Dừng vi-đê-ô và tính ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 250 × 8 = <b>2 000</b> byte.</p></td></tr></table>
    say: 'Đáp án câu một: mỗi phần tử tám bai nhân hai trăm năm mươi bằng đúng hai nghìn bai.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Cờ <code>-Werror</code> kết hợp với <code>-Wall
      -Wextra</code> buộc mọi cảnh báo phải được sửa sạch.</p></td></tr></table>
    say: 'Đáp án câu hai: thêm cờ biến cảnh báo thành lỗi giúp chặn mọi sai sót cú pháp và kiểu ngay tại bước biên
      dịch.'
    clear: true
- id: practice
