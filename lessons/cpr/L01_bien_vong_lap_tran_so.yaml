    thể chính tả “tỉ/tỷ”.'
  sentence: Ở hàng dưới, kiểu sáu mươi bốn bít chịu được hàng tỉ tỉ đồng.
scenes:
- id: hook
  kind: hook
  title: Vì sao cộng thêm 10 vào 250 đôi khi lại cho ra số 4?
  checks:
  - (250 + 10) % 256 == 4
  steps:
  - show: <div class='box key'><p>Một bộ đếm 8-bit không dấu chỉ chứa tối đa đến <b>255</b>. Khi đang ở <b>250</b>
      và cộng thêm <b>10</b>, kết quả quay vòng thành <b>4</b>.</p><p>Nhưng với số nguyên <b>có dấu</b> trong C,
      vượt quá cực đại không phải quay vòng an toàn mà làm trình tối ưu tạo ra <b>kết quả khó lường</b>.</p></div>
    say: Chào bạn trở lại khoá lập trình C. Nếu một biến đếm tám bít không dấu đang giữ giá trị hai trăm năm mươi
      rồi cộng thêm mười, kết quả quay vòng thành bốn chứ không phải hai trăm sáu mươi. Nguy hiểm hơn, nếu tràn
      xảy ra trên số nguyên có dấu, chương trình có thể cho ra kết quả sai lệch hoàn toàn ngoài dự đoán của lập
      trình viên. Nhiều lỗ hổng bảo mật cấp cao phát sinh đúng từ phép cộng vượt ngưỡng kiểu có dấu như vậy.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>áp dụng vào tràn số C</th></tr><tr><td>Kiểu 1 byte rộng
      8 bit (L00)</td><td>8 bit biểu diễn đúng 2 mũ 8 = 256 trạng thái khác nhau</td></tr><tr><td>Cờ -Wall -Wextra
      -Werror (L00)</td><td>Bắt sớm lỗi trộn số có dấu và không dấu khi so sánh</td></tr></table>
    say: Ta nhắc nhanh hai điểm cốt lõi từ bài 0 trước khi đi sâu vào tràn số. Một bai gồm tám bít tạo ra đúng hai
      trăm năm mươi sáu giá trị nguyên khác nhau. Đồng thời các cờ kiểm tra lúc biên dịch luôn giúp ta phát hiện
      sớm lỗi trộn kiểu dữ liệu.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>uint8_t</code> / <code>int32_t</code>
      / <code>int64_t</code></td><td>Kiểu số nguyên cố định bề rộng từ <code>&lt;stdint.h&gt;</code></td></tr><tr><td><code>INT32_MAX</code></td><td>Giá
      trị lớn nhất của số có dấu 32-bit bằng 2³¹ − 1 = 2 147 483 647</td></tr><tr><td>Hành vi không xác định</td><td>Chuẩn
      C không bảo đảm kết quả nếu tràn số có dấu; không được phép phụ thuộc</td></tr></table>
    say: Trên bảng là ba quy ước của bài hôm nay. Thư viện chuẩn cố định bề rộng cung cấp các kiểu số tám bít không
      dấu, ba mươi hai bít và sáu mươi bốn bít có dấu đồng nhất trên mọi máy. Điểm then chốt cần nhớ là tràn số
      nguyên có dấu tạo ra hành vi không xác định nên bắt buộc phải kiểm tra điều kiện trước khi cộng hoặc nhân.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    introduces:
    - cpr_ub
- id: intuition
  kind: intuition
  title: Đồng hồ quay vòng mô-đun 256 của số không dấu
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="35" y="55" width="250" height="95"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="160.0" y="97" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">uint8_t = 250</text><text x="160.0" y="125" font-size="15" text-anchor="middle"
      fill="#475569">8 bit: 11111010</text><line x1="285" y1="102" x2="365" y2="102" stroke="#475569" stroke-width="2"/><polygon
      points="365,102 357.0,107.0 357.0,97.0" fill="#475569"/><text x="325" y="94" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">+ 10 bước</text><rect x="365" y="55" width="250" height="95" rx="10" fill="#fef3c7"
      stroke="#d97706" stroke-width="2"/><text x="490.0" y="97" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Vượt 255</text><text x="490.0" y="125" font-size="15" text-anchor="middle" fill="#475569">Bit
      nhớ thứ 9 bị cắt bỏ</text><line x1="615" y1="102" x2="695" y2="102" stroke="#475569" stroke-width="2"/><polygon
      points="695,102 687.0,107.0 687.0,97.0" fill="#475569"/><text x="655" y="94" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">mod 256</text><rect x="695" y="55" width="230" height="95" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="810.0" y="97" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Kết quả = 4</text><text x="810.0" y="125" font-size="15" text-anchor="middle" fill="#475569">00000100
      (quay vòng)</text></svg></div>'
    say: Hình dung tám bít như mặt đồng hồ có hai trăm năm mươi sáu vạch từ không đến hai trăm năm mươi lăm. Khi
      từ hai trăm năm mươi tiến thêm mười bước, kim đi qua vạch không rồi dừng tại bốn vì bít thứ chín tràn ra ngoài
      thanh ghi tám bít. Bất kỳ phép cộng không dấu nào cũng tự động lấy phần dư theo đúng chu kỳ này.
    clear: true
- id: formula
  kind: formula
  title: Quy tắc an toàn trước phép cộng và nhân có dấu
  checks:
  - alg.cpr_u8_wrap(250, 10) == 4
  - 2**31 - 1 == 2_147_483_647
  steps:
  - show: '<div class=''box key''><p><b>Định lý chuẩn C11:</b></p><ul><li>Số <b>không dấu</b> $k$ bit cộng tràn
      luôn tính theo mod 2ᵏ.</li><li>Số <b>có dấu</b> tuyệt đối không được vượt <code>INT32_MAX</code>: muốn kiểm
      a + b (với b &gt; 0), kiểm <code>a &gt; INT32_MAX - b</code> <b>trước</b> khi cộng.</li></ul></div>'
    say: Để không rơi vào hành vi không xác định trên số có dấu, ta luôn chuyển vế phép so sánh sang phép trừ trước
      khi thực hiện phép cộng. Thay vì viết phép cộng dễ tràn rồi mới kiểm, ta kiểm xem số thứ nhất có vượt ngưỡng
      trừ đi số thứ hai hay chưa. Cách chuyển vế này hoàn toàn an toàn vì phép trừ số dương khỏi giá trị cực đại
      không bao giờ bị tràn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: số 8 bít không dấu và vòng lặp chặn tràn'
  checks:
  - sum(range(1, 11)) == 55
  - alg.cpr_u8_wrap(250, 10) == 4
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;stdint.h&gt;</code></td><td>Cung
      cấp <code>uint8_t</code>, <code>int32_t</code> và hằng <code>INT32_MAX</code>, <code>INT32_MIN</code></td></tr><tr><td><code>%u</code>
      / <code>%d</code></td><td>Định dạng in số nguyên <b>không dấu</b> (<code>%u</code>) và <b>có dấu</b> (<code>%d</code>)</td></tr><tr><td><code>static</code>
      / <code>&amp;&amp;</code></td><td>Giới hạn hàm nội bộ tệp; phép <b>VÀ</b> logic đúng khi cả hai vế đúng</td></tr><tr><td><code>(uint8_t)(u
      + 10)</code></td><td>Ép rõ về 8-bit không dấu (tránh cảnh báo chuyển kiểu của GCC)</td></tr></table>
    say: Trước khi xem mã hoàn chỉnh, ta giải thích đủ bốn quy ước xuất hiện trong chương trình. Thư viện cố định
      bề rộng cung cấp cả các hằng biên trên dưới cho số ba mươi hai bít. Mã định dạng phần trăm u và d in lần lượt
      số không dấu và có dấu, từ khoá giới hạn nội bộ giữ hàm trong tệp, còn dấu và kép nối hai điều kiện đúng đồng
      thời.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: <p><b>Thử thật phép cộng quay vòng uint8_t và tổng vòng lặp an toàn</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>int main(void) {</div><div>    uint8_t u = 250;</div><div>    uint8_t
      wrapped = (uint8_t)(u + 10);</div><div>    printf("u8=%u\n", wrapped);</div><div>    int32_t sum = 0;</div><div>    for
      (int i = 1; i &lt;= 10; i++) { sum += i; }</div><div>    printf("sum=%d\n", sum);</div><div>    return 0;</div><div>}</div></div>
    say: Chương trình thử cộng mười vào biến tám bít không dấu đang giữ giá trị hai trăm năm mươi. Sau đó vòng lặp
      cộng dồn mười số nguyên đầu tiên với điều kiện dừng rõ ràng.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>u8=4</div><div>sum=55</div></div>
    say: Kết quả chạy thật trên trình biên dịch C xác nhận giá trị quay vòng đúng bằng bốn vì hai trăm sáu mươi
      chia hai trăm năm mươi sáu dư bốn. Tổng vòng lặp mười bước trả về năm mươi lăm khớp công thức toán học.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng hàm cộng an toàn chặn tràn trước khi cộng
  checks:
  - 2_000_000_000 + 100_000_000 < 2**31
  - 2_000_000_000 + 200_000_000 >= 2**31
  steps:
  - show: '<p><b>Hàm safe_add_ok chặn trước trường hợp 2 tỉ + 200 triệu > INT32_MAX</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>static int safe_add_ok(int32_t a, int32_t b)
      {</div><div>    if (b &gt; 0 &amp;&amp; a &gt; INT32_MAX - b) return 0;</div><div>    if (b &lt; 0 &amp;&amp;
      a &lt; INT32_MIN - b) return 0;</div><div>    return 1;</div><div>}</div><div>int main(void) {</div><div>    int32_t
      a = 2000000000, b1 = 100000000, b2 = 200000000;</div><div>    int ok1 = safe_add_ok(a, b1), ok2 = safe_add_ok(a,
      b2);</div><div>    int32_t res = ok1 ? (a + b1) : 0;</div><div>    printf("ok1=%d res=%d ok2=%d\n", ok1, res,
      ok2);</div><div>    return 0;</div><div>}</div></div>'
    say: Ta dùng đường kiểm chứng thứ hai bằng cách viết hàm kiểm tra ranh giới trước khi thực hiện phép cộng. Phép
      thử hai tỉ cộng một trăm triệu cho tổng hai tỉ một trăm triệu vẫn nhỏ hơn ngưỡng tối đa nên được phép chạy.
      Ngược lại phép cộng hai trăm triệu vượt ngưỡng nên bị chặn ngay.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>ok1=1 res=2100000000 ok2=0</div></div>
    say: Đầu ra thật khớp hoàn toàn với phân tích trước đó vì hàm kiểm tra đã chặn đứng phép cộng vượt biên. Phép
      thứ nhất hợp lệ trả về cờ một và tổng đúng, còn phép thứ hai trả về cờ bằng không.
    focus:
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Miền an toàn theo độ rộng bit của số nguyên
  checks:
  - 2**8 - 1 == 255
  - 2**31 - 1 == 2_147_483_647
  steps:
  - show: <table class='t'><tr><th>độ rộng</th><th>kiểu không dấu max</th><th>kiểu có dấu max</th><th>ngưỡng giao
      dịch tiền</th></tr><tr><td><span style='white-space:nowrap'>8 bit (×1)</span></td><td>255</td><td>127</td><td>Không
      đủ đếm giao dịch</td></tr><tr><td><span style='white-space:nowrap'>32 bit (×4)</span></td><td>4 294 967 295</td><td>2
      147 483 647</td><td>Tràn ngay nếu vượt 2,14 tỉ đồng</td></tr><tr><td><span style='white-space:nowrap'>64 bit
      (×8)</span></td><td>18 446 744 073 709 551 615</td><td>9 223 372 036 854 775 807</td><td>An toàn cho tổng
      tiền ngân hàng</td></tr></table>
    say: Bảng đối chiếu ba độ rộng số nguyên cho thấy lý do hệ thống thanh toán cấm dùng kiểu ba mươi hai bít cho
      số tiền. Giới hạn hơn hai tỉ một trăm triệu sẽ bị vượt qua chỉ trong một giao dịch chuyển khoản doanh nghiệp
      lớn. Ở hàng dưới, kiểu sáu mươi bốn bít chịu được hàng tỉ tỉ đồng. Vì thế số tiền luôn phải đặt trong kiểu
      sáu mươi bốn bít có kiểm tra biên.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Viết <code>if (a + b &lt; a)</code> để bắt tràn có dấu.</b> Phép cộng đã tràn trước lúc so sánh, là hành
      vi không xác định nên trình biên dịch có quyền xoá hẳn câu lệnh <code>if</code>.<br><b>Lỗi 2: Dùng <code>uint8_t
      i</code> đếm lùi <code>i &gt;= 0</code>.</b> Khi <code>i = 0</code> rồi trừ 1, biến không dấu nhảy lên 255
      tạo vòng lặp vô hạn.<br><b>Lỗi 3: Nhầm tràn int 32-bit khi tính chỉ số mảng lớn.</b> Phép nhân <code>n * sizeof(T)</code>
      cần ép sang <code>size_t</code> trước.</div></td></tr></table>'
    say: Có ba bẫy tràn số thực tế rất hay gặp khi viết mã C. Kiểm tra sau khi cộng là hành vi không xác định nên
      trình biên dịch có thể xoá sạch câu lệnh kiểm tra. Đếm lùi biến không dấu tới không sẽ quay vòng thành hai
      trăm năm mươi lăm gây lặp vô tận. Cuối cùng là nhân kích thước mảng mà quên ép sang kiểu kích thước không
      dấu lớn.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (200 + 70) % 256 == 14
  steps:
  - show: <ol><li><code>uint8_t x = 200; uint8_t y = (uint8_t)(x + 70);</code> cho giá trị <code>y</code> bằng bao
      nhiêu?</li><li>Viết điều kiện kiểm tra tràn <b>trước</b> khi cộng hai số dương <code>a, b</code> kiểu <code>int32_t</code>.</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, biến tám bít không dấu giữ hai trăm cộng thêm bảy mươi cho kết quả bằng
      bao nhiêu? Câu hai, viết điều kiện kiểm tra tràn trước khi cộng hai số dương ba mươi hai bít. Dừng vi-đê-ô
      và làm ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① (200 + 70) mod 256 = 270 − 256 = <b>14</b>.</p></td></tr></table>
    say: 'Đáp án câu một: hai trăm cộng bảy mươi bằng hai trăm bảy mươi, trừ hai trăm năm mươi sáu còn mười bốn.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Kiểm tra <code>if (a &gt; INT32_MAX - b)</code>
      trước khi thực hiện <code>a + b</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: chuyển số hạng sang vế trừ để so sánh trước khi phép cộng kịp xảy ra.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài thực hành C và chấm thật
  lab: labs/CPR/L01
  steps:
  - show: <div class='box key'><p><b>Bài thực hành L01:</b> mở đề tại <code>labs/CPR/L01/de.md</code>, viết mã C
      chuẩn C11 vào một tệp tạm rồi mở <b>Git Bash</b> (cài ở <code>Start → Git → Git Bash</code> hoặc chuột phải
      thư mục chọn <b>Open Git Bash here</b>) và chạy lệnh chấm thật bằng trình biên dịch G C C:</p><p><code>bash
      labs/cham.sh CPR L01 duong_dan/bai_cua_ban.c</code></p></div>
