- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>uint8_t</code> / <code>int32_t</code> / <code>int64_t</code></td><td>Kiểu số nguyên cố định bề rộng từ <code>&lt;stdint.h&gt;</code></td></tr><tr><td><code>INT32_MAX</code></td><td>Giá trị lớn nhất của số có dấu 32-bit bằng 2³¹ − 1 = 2 147 483 647</td></tr><tr><td>Hành vi không xác định</td><td>Chuẩn C không bảo đảm kết quả nếu tràn số có dấu; không được phép phụ thuộc</td></tr></table>
    say: Trên bảng là ba quy ước của bài hôm nay. Thư viện chuẩn cố định bề rộng cung cấp các kiểu số tám bít không dấu, ba mươi hai bít và sáu mươi bốn bít có dấu đồng nhất trên mọi máy. Điểm then chốt cần nhớ là tràn số nguyên có dấu tạo ra hành vi không xác định nên bắt buộc phải kiểm tra điều kiện trước khi cộng hoặc nhân. Các kiểu cố định bề rộng xoá bỏ hoàn toàn sự mơ hồ giữa các hệ điều hành khác nhau về độ dài biến nguyên. Các hằng giá trị lớn nhất và nhỏ nhất chuẩn xác giúp bạn viết điều kiện chặn biên rõ ràng không cần gõ tay con số dài.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
    introduces:
    - cpr_ub
- id: intuition
  kind: intuition
  title: Đồng hồ quay vòng mô-đun 256 của số không dấu
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="35" y="55" width="250" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="160.0" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">uint8_t = 250</text><text x="160.0" y="125" font-size="15" text-anchor="middle" fill="#475569">8 bit: 11111010</text><line x1="285" y1="102" x2="365" y2="102" stroke="#475569" stroke-width="2"/><polygon points="365,102 357.0,107.0 357.0,97.0" fill="#475569"/><text x="325" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">+ 10 bước</text><rect x="365" y="55" width="250" height="95" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="490.0" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Vượt 255</text><text x="490.0" y="125" font-size="15" text-anchor="middle" fill="#475569">Bit nhớ thứ 9 bị cắt bỏ</text><line x1="615" y1="102" x2="695" y2="102" stroke="#475569" stroke-width="2"/><polygon points="695,102 687.0,107.0 687.0,97.0" fill="#475569"/><text x="655" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">mod 256</text><rect x="695" y="55" width="230" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="810.0" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Kết quả = 4</text><text x="810.0" y="125" font-size="15" text-anchor="middle" fill="#475569">00000100 (quay vòng)</text></svg></div>'
    say: Hình dung tám bít như mặt đồng hồ có hai trăm năm mươi sáu vạch từ không đến hai trăm năm mươi lăm. Khi từ hai trăm năm mươi tiến thêm mười bước, kim đi qua vạch không rồi dừng tại bốn vì bít thứ chín tràn ra ngoài thanh ghi tám bít. Bất kỳ phép cộng không dấu nào cũng tự động lấy phần dư theo đúng chu kỳ này.
    clear: true
  - show: ''
    say: Phần cứng chỉ thực hiện phép cộng nhị phân cố định độ rộng và tự động cắt bỏ phần nhớ vượt quá số bít của thanh ghi. Điểm khác biệt sống còn nằm ở chỗ chuẩn ngôn ngữ cho phép quay vòng với số không dấu nhưng nghiêm cấm tràn ở số có dấu.
- id: formula
  kind: formula
  title: Quy tắc an toàn trước phép cộng và nhân có dấu
  checks:
  - alg.cpr_u8_wrap(250, 10) == 4
  - 2**31 - 1 == 2_147_483_647
  steps:
  - show: <div class='box key'><p><b>Định lý chuẩn C11:</b></p><ul><li>Số <b>không dấu</b> $k$ bit cộng tràn luôn tính theo mod 2ᵏ.</li><li><b>Chặn tràn cộng có dấu:</b> với b &gt; 0, kiểm <code>a &gt; INT32_MAX - b</code> <b>trước</b> khi cộng.</li><li><b>Chặn tràn nhân có dấu:</b> với a &gt; 0, b &gt; 0, kiểm <code>a &gt; INT32_MAX / b</code> <b>trước</b> khi nhân.</li></ul></div>
    say: Để không rơi vào hành vi không xác định trên số có dấu, ta chuyển vế so sánh sang phép trừ trước khi cộng hoặc phép chia trước khi nhân. Thay vì cộng hay nhân dễ tràn rồi mới kiểm, ta đối chiếu số thứ nhất với ngưỡng cực đại trừ hoặc chia số thứ hai. Cách chuyển vế này hoàn toàn an toàn vì phép trừ và phép chia số dương khỏi giá trị cực đại không bao giờ bị tràn. Quy tắc biến đổi bất đẳng thức này hoạt động chính xác cho cả cận trên lẫn cận dưới của mọi kiểu số nguyên cố định.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: số 8 bít không dấu và vòng lặp chặn tràn'
  checks:
  - sum(range(1, 11)) == 55
  - alg.cpr_u8_wrap(250, 10) == 4
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;stdint.h&gt;</code></td><td>Cung cấp <code>uint8_t</code>, <code>int32_t</code> và hằng <code>INT32_MAX</code>, <code>INT32_MIN</code></td></tr><tr><td><code>%u</code> / <code>%d</code> / <code>%lld</code></td><td>Định dạng in số <b>không dấu</b> (<code>%u</code>), <b>có dấu 32-bit</b> (<code>%d</code>) và <b>64-bit</b> (<code>%lld</code>; hậu tố <code>LL</code> ở hằng lớn)</td></tr><tr><td><code>for (int i = 1; i &lt;= 10; i++)</code></td><td>Vòng lặp tăng biến đếm <code>i</code> từ 1 tới 10; viết gọn <code>sum += i</code> bằng <code>sum = sum + i</code></td></tr><tr><td><code>(uint8_t)(u + 10)</code></td><td>Ép rõ về 8-bit không dấu (tránh cảnh báo chuyển kiểu của GCC)</td></tr></table>
    say: Trước khi xem mã hoàn chỉnh, ta giải thích đủ bốn quy ước xuất hiện trong chương trình. Thư viện cố định bề rộng cung cấp kiểu tám bít, ba mươi hai bít, sáu mươi bốn bít cùng hai hằng biên cực đại cực tiểu. Mã định dạng phần trăm u in số không dấu, phần trăm d in số ba mươi hai bít, còn phần trăm l l d in số sáu mươi bốn bít kèm hậu tố l l cho hằng lớn. Vòng lặp for cộng dồn theo bước tăng một bằng toán tử cộng bằng, còn ép kiểu giữ kết quả gọn trong tám bít chuẩn xác.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Thử thật uint8_t, int32_t và int64_t trên GCC</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>int main(void) {</div><div>    uint8_t u = 250; uint8_t wrapped = (uint8_t)(u + 10);</div><div>    int32_t sum = 0; for (int i = 1; i &lt;= 10; i++) { sum += i; }</div><div>    int64_t big = 5000000000LL;</div><div>    printf("u8=%u\nsum=%d\nbig=%lld\n", wrapped, sum, (long long)big); return 0; }</div></div>
    say: Chương trình thử cộng mười vào biến tám bít không dấu đang giữ giá trị hai trăm năm mươi. Sau đó vòng lặp cộng dồn mười số nguyên đầu tiên với điều kiện dừng rõ ràng. Tách riêng bước thử quay vòng không dấu với vòng lặp cộng dồn giúp minh hoạ rõ hai quy tắc vận hành riêng biệt. Biến sáu mươi bốn bít lưu trọn vẹn giá trị năm tỉ vượt xa trần hai tỉ một của ba mươi hai bít.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>u8=4</div><div>sum=55</div><div>big=5000000000</div></div>
    say: Kết quả chạy thật trên trình biên dịch C xác nhận giá trị quay vòng đúng bằng bốn vì hai trăm sáu mươi chia hai trăm năm mươi sáu dư bốn. Tổng vòng lặp mười bước trả về năm mươi lăm khớp công thức toán học. Con số bốn và năm mươi lăm chứng minh phép toán học đồng dư vận hành nhất quán bên cạnh phép tính tổng tuần tự sạch. Giá trị năm tỉ in ra nguyên vẹn chứng minh vai trò kiểu sáu mươi bốn bít.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng hàm cộng an toàn chặn tràn trước khi cộng
  checks:
  - 2_000_000_000 + 100_000_000 < 2**31
  - 2_000_000_000 + 200_000_000 >= 2**31
  steps:
  - show: <p><b>Hàm safe_add_ok và safe_mul_ok chặn tràn trước khi cộng hoặc nhân</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>static int safe_add_ok(int32_t a, int32_t b) {</div><div>    if (b &gt; 0 &amp;&amp; a &gt; INT32_MAX - b) return 0;</div><div>    if (b &lt; 0 &amp;&amp; a &lt; INT32_MIN - b) return 0;</div><div>    return 1; }</div><div>static int safe_mul_ok(int32_t a, int32_t b) { return !(a &gt; 0 &amp;&amp; b &gt; 0 &amp;&amp; a &gt; INT32_MAX / b); }</div><div>int main(void) {</div><div>    int ok1 = safe_add_ok(2000000000, 100000000), ok2 = safe_add_ok(2000000000, 200000000);</div><div>    int ok_mul = safe_mul_ok(100000, 30000);</div><div>    printf("ok1=%d res=%d ok2=%d mul_ok=%d\n", ok1, 2100000000, ok2, ok_mul); return 0; }</div></div>
    say: Ta dùng đường kiểm chứng thứ hai bằng cách viết hàm kiểm tra ranh giới trước khi thực hiện phép cộng. Phép thử hai tỉ cộng một trăm triệu cho tổng hai tỉ một trăm triệu vẫn nhỏ hơn ngưỡng tối đa nên được phép chạy. Ngược lại phép cộng hai trăm triệu vượt ngưỡng nên bị chặn ngay. Hàm kiểm tra trước trả về giá trị đúng sai rõ ràng cho phép người gọi xử lý tình huống tràn số một cách có kiểm soát. Hàm kiểm nhân cũng chặn kịp tích ba tỉ của một trăm nghìn nhân ba mươi nghìn trước khi tràn.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>ok1=1 res=2100000000 ok2=0 mul_ok=0</div></div>
    say: Đầu ra thật khớp hoàn toàn với phân tích trước đó vì hàm kiểm tra đã chặn đứng phép cộng vượt biên. Phép thứ nhất hợp lệ trả về cờ một và tổng đúng, còn phép thứ hai trả về cờ bằng không. Cách kiểm tra trước khi thực hiện phép toán giúp phần mềm từ chối dứt khoát mọi đầu vào gây tràn số thay vì tiếp tục chạy với giá trị sai lệch âm thầm. Cả hai ca thử hợp lệ và vượt ngưỡng đều khớp trọn vẹn lý thuyết biên ba mươi hai bít có dấu ở đầu bài. Cờ kiểm nhân trả về không xác nhận kiểm tra phép chia trước khi nhân hoạt động chính xác.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Miền an toàn theo độ rộng bit của số nguyên
  checks:
  - 2**8 - 1 == 255
  - 2**31 - 1 == 2_147_483_647
  steps:
  - show: <table class='t'><tr><th>độ rộng</th><th>kiểu không dấu max</th><th>kiểu có dấu max</th><th>ngưỡng giao dịch tiền</th></tr><tr><td><span style='white-space:nowrap'>8 bit (×1)</span></td><td>255</td><td>127</td><td>Không đủ đếm giao dịch</td></tr><tr><td><span style='white-space:nowrap'>32 bit (×4)</span></td><td>4 294 967 295</td><td>2 147 483 647</td><td>Tràn ngay nếu vượt 2,14 tỉ đồng</td></tr><tr><td><span style='white-space:nowrap'>64 bit (×8)</span></td><td>18 446 744 073 709 551 615</td><td>9 223 372 036 854 775 807</td><td>An toàn cho tổng tiền ngân hàng</td></tr></table>
    say: Bảng đối chiếu ba độ rộng số nguyên cho thấy lý do hệ thống thanh toán cấm dùng kiểu ba mươi hai bít cho số tiền. Giới hạn hơn hai tỉ một trăm triệu sẽ bị vượt qua chỉ trong một giao dịch chuyển khoản doanh nghiệp lớn. Ở hàng dưới, kiểu sáu mươi bốn bít chịu được hàng tỉ tỉ đồng. Vì thế số tiền luôn phải đặt trong kiểu sáu mươi bốn bít có kiểm tra biên. Tại quy mô tài chính quốc gia, chuyển từ số nguyên ba mươi hai bít sang sáu mươi bốn bít mở rộng không gian gấp bốn tỉ lần. Sự khác biệt giữa số có dấu và không dấu ảnh hưởng trực tiếp tới mọi phép dịch chuyển hay so sánh ranh giới thanh ghi.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Viết <code>if (a + b &lt; a)</code> để bắt tràn có dấu.</b> Phép cộng đã tràn trước lúc so sánh, là hành vi không xác định nên trình biên dịch có quyền xoá hẳn câu lệnh <code>if</code>.<br><b>Lỗi 2: Dùng <code>uint8_t i</code> đếm lùi <code>i &gt;= 0</code>.</b> Khi <code>i = 0</code> rồi trừ 1, biến không dấu nhảy lên 255 tạo vòng lặp vô hạn.<br><b>Lỗi 3: Nhầm tràn int 32-bit khi tính chỉ số mảng lớn.</b> Phép nhân <code>n * sizeof(T)</code> cần ép sang <code>size_t</code> trước.</div></td></tr></table>'
    say: Có ba bẫy tràn số thực tế rất hay gặp khi viết mã C. Kiểm tra sau khi cộng là hành vi không xác định nên trình biên dịch có thể xoá sạch câu lệnh kiểm tra. Đếm lùi biến không dấu tới không sẽ quay vòng thành hai trăm năm mươi lăm gây lặp vô tận. Cuối cùng là nhân kích thước mảng mà quên ép sang kiểu kích thước không dấu lớn.
    clear: true
  - show: ''
    say: Trình biên dịch hiện đại tối ưu mạnh dựa trên giả định chương trình chuẩn không bao giờ gây tràn số có dấu. Nếu bạn đặt điều kiện kiểm tra sau phép cộng, bộ tối ưu hoàn toàn có quyền coi điều kiện đó luôn sai và loại bỏ. Luôn tách rõ hàm kiểm tra phép cộng an toàn ra thành hàm riêng để tái sử dụng nhất quán trong toàn dự án.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (200 + 70) % 256 == 14
  steps:
  - show: <ol><li><code>uint8_t x = 200; uint8_t y = (uint8_t)(x + 70);</code> cho giá trị <code>y</code> bằng bao nhiêu?</li><li>Viết điều kiện kiểm tra tràn <b>trước</b> khi cộng hai số dương <code>a, b</code> kiểu <code>int32_t</code>.</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, biến tám bít không dấu giữ hai trăm cộng thêm bảy mươi cho kết quả bằng bao nhiêu? Câu hai, viết điều kiện kiểm tra tràn trước khi cộng hai số dương ba mươi hai bít. Dừng vi-đê-ô và làm ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① (200 + 70) mod 256 = 270 − 256 = <b>14</b>.</p></td></tr></table>
    say: 'Đáp án câu một: hai trăm cộng bảy mươi bằng hai trăm bảy mươi, trừ hai trăm năm mươi sáu còn mười bốn. Cách kiểm tra trước bằng phép trừ giúp bộ xử lý không bao giờ rơi vào vùng hành vi không xác định vốn rất khó gỡ lỗi về sau. Mọi bài toán vòng đệm mạng hay bộ đếm gói tin đều tận dụng quy luật quay vòng theo lũy thừa hai của số không dấu.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Kiểm tra <code>if (a &gt; INT32_MAX - b)</code> trước khi thực hiện <code>a + b</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: chuyển số hạng sang vế trừ để so sánh trước khi phép cộng kịp xảy ra. Luôn kiểm tra cả ranh giới trên lẫn ranh giới dưới trước mọi phép toán số học trên dữ liệu tài chính đến từ bên ngoài. Kiểm tra hai chiều cả cộng số dương lẫn cộng số âm giúp hàm tiện ích dùng an toàn trong mọi kịch bản thực tế.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L01
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L01:</b> đọc <code>u_init u_add a1 b1 a2 b2</code> từ <code>stdin</code>, tính quay vòng <code>uint8_t</code> và cộng có kiểm tràn <code>int32_t</code> (2 chiều âm/dương) để in 3 dòng <code>wrap=..</code>, <code>add1=..</code>, <code>add2=..</code> (<code>OVERFLOW</code> nếu tràn).</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>240 20 2147483640 5 2147483640 12</code> | Chấm: <code>bash labs/cham.sh CPR L01 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L01/de.md</code>)</p></div>'
    say: Hãy mở đề bài L01 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Đọc thật kỹ các giá trị biên âm dương đầu vào để bảo đảm hàm kiểm tra an toàn bao phủ cả ngưỡng âm nhỏ nhất.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L01/du_lieu.txt</code></b></p><div class="code"><div>wrap=4</div><div>add1=2147483645</div><div>add2=OVERFLOW</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L01 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Đối chiếu sát trường hợp cộng vượt trần dương và cộng vượt đáy âm trong phần đầu ra chuẩn quy định.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: '<div class=''box ok''><p><b>Gợi ý nếu kẹt ở bài L01:</b> (1) dùng uint8_t cho phép cộng quay vòng; (2) tách riêng kiểm tra b > 0 và b < 0 trước khi cộng; (3) không cộng tràn int32_t rồi mới kiểm.</p></div><p class="note"><b>Gợi ý đọc <code>stdin</code>:</b> <code>unsigned ui = 0, ua = 0; int32_t a1, b1, a2, b2; if (scanf("%u %u %d %d %d %d", &amp;ui, &amp;ua, &amp;a1, &amp;b1, &amp;a2, &amp;b2) != 6) return 1;</code></p>'
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Đừng quên kiểm thử phép cộng với số không và giá trị giáp ranh đúng bằng hằng cực đại trừ một.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>Không dấu: mod 2^n</span><span class=''a''>|</span><span class=''n''>Có dấu tràn: không xác định</span><span class=''a''>→</span><span class=''n''>Luôn kiểm trước khi tính</span></div>'
    say: Ghi nhớ chuỗi quy tắc cốt lõi của bài hôm nay. Số không dấu quay vòng theo lũy thừa hai, còn tràn số có dấu là hành vi không xác định cực kỳ nguy hiểm. Mọi phép kiểm tra biên bắt buộc phải đặt trước khi phép tính diễn ra.
    clear: true
  - show: ''
    say: Kỷ luật chặn tràn ngay trước phép tính là lá chắn đầu tiên cho mọi bài toán số học trên C. Luôn kiểm tra biên bằng phép trừ hoặc phép chia nghịch đảo trước khi thực hiện phép tính có nguy cơ vượt trần. Chọn độ rộng biến đủ lớn ngay từ bước thiết kế cơ sở dữ liệu và giao thức sẽ ngăn nhiều sự cố sản xuất tốn kém.
  - show: <div class='box ok'><b>Bài sau (bài 2):</b> Hàm, truyền tham trị và khung ngăn xếp (stack frame)</div>
    say: Bài tiếp theo là bài 2, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Chuẩn bị kỹ tư duy chặn tràn số nguyên sẽ giúp bạn bảo vệ chính xác kích thước bộ đệm khi bước sang hàm và ngăn xếp. Sau khi kiểm soát ranh giới giá trị biến, ta tiến sang tìm hiểu cách hàm đóng gói và trao đổi các biến này trên ngăn xếp.
    clear: true
    forward_ref: true
