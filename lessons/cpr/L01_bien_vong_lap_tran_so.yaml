scenes:
- id: hook
  kind: hook
  title: Vì sao cộng thêm 10 vào 250 đôi khi lại cho ra số 4?
  checks:
  - (250 + 10) % 256 == 4
  steps:
  - show: <div class='box key'><p>Một bộ đếm 8-bit không dấu chỉ chứa tối đa đến <b>255</b>. Khi đang ở <b>250</b> và cộng thêm <b>10</b>, kết quả quay vòng thành <b>4</b>.</p><p>Nhưng với số nguyên <b>có dấu</b> trong C, vượt quá cực đại không phải quay vòng an toàn mà làm trình tối ưu tạo ra <b>kết quả khó lường</b>.</p></div>
    say: Chào bạn trở lại khoá lập trình C. Nếu một biến đếm tám bít không dấu đang giữ giá trị hai trăm năm mươi rồi cộng thêm mười, kết quả quay vòng thành bốn chứ không phải hai trăm sáu mươi. Nguy hiểm hơn, nếu tràn xảy ra trên số nguyên có dấu, chương trình có thể cho ra kết quả sai lệch hoàn toàn ngoài dự đoán của lập trình viên. Nhiều lỗ hổng bảo mật cấp cao phát sinh đúng từ phép cộng vượt ngưỡng kiểu có dấu như vậy. Số nguyên có giới hạn biểu diễn hữu hạn nên mọi phép cộng hay nhân chạm tới trần kiểu dữ liệu đều mang rủi ro lớn. Biết trước quy luật quay vòng hay tràn biến giúp bảo vệ hệ thống đếm giao dịch khỏi nhảy về giá trị âm vô lý.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>áp dụng vào tràn số C</th></tr><tr><td>Kiểu 1 byte rộng 8 bit (L00)</td><td>8 bit biểu diễn đúng 2 mũ 8 = 256 trạng thái khác nhau</td></tr><tr><td>Cờ -Wall -Wextra -Werror (L00)</td><td>Bắt sớm lỗi trộn số có dấu và không dấu khi so sánh</td></tr></table>
    say: Ta nhắc nhanh hai điểm cốt lõi từ bài 0 trước khi đi sâu vào tràn số. Một bai gồm tám bít tạo ra đúng hai trăm năm mươi sáu giá trị nguyên khác nhau. Đồng thời các cờ kiểm tra lúc biên dịch luôn giúp ta phát hiện sớm lỗi trộn kiểu dữ liệu. Với tám bít lưu trữ hai trăm năm mươi sáu tổ hợp, giá trị không dấu đạt tối đa hai trăm năm mươi lăm tính từ số không. Hiểu số lượng trạng thái bít giải thích trực tiếp vì sao cộng thêm quá hai trăm năm mươi lăm lại quay về đầu vòng.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
