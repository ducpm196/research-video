scenes:
- id: hook
  kind: hook
  title: Thiếu đúng 1 byte cho ký tự không mà hàng nghìn phần mềm bị tấn công?
  checks:
  - alg.cpr_str_bytes(5) == 6
  - alg.cpr_str_bytes(6) == 7
  steps:
  - show: <div class='box key'><p>Chuỗi <code>"NGUYEN"</code> có <b>6 ký tự</b>, nhưng nếu khai báo mảng <code>char buf[6]</code> thì bạn vừa tạo ra một lỗi tràn ranh giới nghiêm trọng.</p><p>Chuỗi trong C bắt buộc có thêm <b>1 byte bằng 0</b> (<code>'\0'</code>) ở cuối để các hàm biết điểm dừng.</p></div>
    say: Chào bạn, nếu chuỗi chữ có sáu ký tự mà bạn chỉ cấp vùng đệm đúng sáu bai, chương trình sẽ thiếu chỗ cho bai đánh dấu kết thúc bằng không. Khi thiếu dấu chặn cuối, hàm đọc chuỗi tiếp tục chạy tràn sang các biến lân cận trong bộ nhớ. Hàng loạt lỗ hổng bảo mật nổi tiếng xuất phát đúng từ lỗi tràn bộ đệm thiếu một bai kết thúc này. Thiếu đúng một bai đánh dấu cuối khiến các hàm đọc chuỗi chạy tràn qua hàng loạt ô nhớ kế cận rất nguy hiểm. Rất nhiều lỗ hổng an ninh phần mềm kinh điển xuất phát từ việc đếm thiếu đúng một bai kết thúc chuỗi trong C.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>áp dụng vào chuỗi C</th></tr><tr><td>Mỗi ký tự char chiếm đúng 1 byte (L00)</td><td>Độ dài byte bằng đúng số ký tự cộng một byte kết thúc</td></tr><tr><td>Biến cục bộ nằm kề trên ngăn xếp (L02)</td><td>Ghi tràn quá chỉ số cuối mảng có thể ghi đè biến nằm cạnh</td></tr></table>
    say: Nhờ bài 0 và bài 2, ta biết mỗi ký tự trong bảng mã chuẩn chỉ tốn một bai bộ nhớ. Trên ngăn xếp các mảng cục bộ nằm kề sát nhau nên chỉ cần ghi lố một bai là đủ làm hỏng dữ liệu của biến lân cận. Chỉ số mảng luôn bắt đầu tại vị trí không tạo ra khoảng cách một bước dễ nhầm giữa độ dài và chỉ số cuối. Trên ngăn xếp, biến đếm nằm kề bên mảng ký tự hoàn toàn có thể bị ghi đè nếu bạn chép tràn qua ranh giới mảng.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>'\0'</code></td><td>Byte có giá trị số bằng 0 đánh dấu hết chuỗi ký tự trong C</td></tr><tr><td><code>strlen(s)</code></td><td>Đếm số byte trước dấu <code>'\0'</code> (không tính byte 0 vào độ dài)</td></tr><tr><td><code>snprintf(dst, cap, ...)</code></td><td>Ghi an toàn tối đa <code>cap - 1</code> ký tự rồi luôn tự chèn <code>'\0'</code></td></tr></table>
    say: Có ba ký hiệu cần ghi nhớ khi xử lý chuỗi C. Mọi chuỗi chuẩn đều phải kết thúc bằng bai giá trị không. Hàm đếm độ dài chỉ tính phần chữ đứng trước bai không đó. Khi ghi chuỗi có giới hạn dung lượng, hàm chuẩn luôn tự chừa một bai cuối cho dấu kết thúc. Cần phân biệt rạch ròi hàm đo độ dài chữ hợp lệ với toán tử đo dung lượng vật lý của toàn bộ vùng đệm. Khi sử dụng các hàm xử lý văn bản, luôn truyền kèm kích thước tối đa vùng đệm đích nhằm ngăn chặn ghi đè ngoài biên.
    focus:
    - 0
