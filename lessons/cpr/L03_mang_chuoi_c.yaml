  - show: <p><b>Kết quả mong đợi cần khớp 100% (2 dòng)</b></p><div class="code"><div>src_len=12 buf_size=8</div><div>cut=BANKING
      last_byte=0</div></div>
    say: Màn hình hiện toàn bộ các dòng kết quả mong đợi mà chương trình của bạn phải in ra khớp từng ký tự.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>Mảng n phần tử: 0..n−1</span><span class=''a''>→</span><span class=''n''>Chuỗi
      L chữ: cần L + 1 byte</span><span class=''a''>→</span><span class=''n''>Ghi an toàn dùng snprintf</span></div>'
    say: Ghi nhớ chuỗi quy tắc cốt lõi khi thao tác với mảng và chuỗi C. Mảng n phần tử luôn kết thúc ở chỉ số n
      trừ một. Chuỗi dài L ký tự cần tối thiểu L cộng một bai, và luôn dùng hàm ghi có kiểm biên dung lượng.
    clear: true
  - show: '<div class=''box ok''><b>Bài sau (bài 4):</b> Con trỏ và địa chỉ bộ nhớ: toán tử &amp; và *</div>'
    say: Bài tiếp theo là bài 4, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau.
    clear: true
    forward_ref: true
