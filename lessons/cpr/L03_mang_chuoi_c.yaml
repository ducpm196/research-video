- id: intuition
  kind: intuition
  title: Sơ đồ từng ô nhớ của chuỗi 5 chữ cái trong mảng 6 byte
  steps:
  - show: <div><svg width="960" height="180" viewBox="0 0 960 180"><rect x="40" y="45" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="95.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[0] 'H'</text><text x="95.0" y="104" font-size="15" text-anchor="middle" fill="#475569">1 byte</text><rect x="165" y="45" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="220.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[1] 'E'</text><text x="220.0" y="104" font-size="15" text-anchor="middle" fill="#475569">1 byte</text><rect x="290" y="45" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="345.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[2] 'L'</text><text x="345.0" y="104" font-size="15" text-anchor="middle" fill="#475569">1 byte</text><rect x="415" y="45" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="470.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[3] 'L'</text><text x="470.0" y="104" font-size="15" text-anchor="middle" fill="#475569">1 byte</text><rect x="540" y="45" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="595.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[4] 'O'</text><text x="595.0" y="104" font-size="15" text-anchor="middle" fill="#475569">1 byte</text><rect x="675" y="45" width="240" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="795.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[5] '\0' (số 0)</text><text x="795.0" y="104" font-size="15" text-anchor="middle" fill="#475569">Bắt buộc để dừng đọc</text></svg></div>
    say: Chuỗi gồm năm chữ cái xếp liên tiếp từ chỉ số không đến chỉ số bốn. Ô thứ sáu mang chỉ số năm chứa bai giá trị không để báo cho mọi hàm biết nơi kết thúc chuỗi. Vì phải chừa một ô cuối cho ký tự không này nên tổng kích thước mảng tối thiểu luôn phải bằng năm cộng một là sáu bai.
    clear: true
  - show: ''
    say: Nhờ phần tử đánh dấu cuối này, các thao tác sao chép và đo độ dài biết chính xác điểm cần dừng lại. Nhân vật chính bảo đảm mọi thao tác đọc chuỗi dừng đúng chỗ chính là bai mang giá trị số bằng không đặt ở ô chốt cuối. Nếu vô tình xoá mất bai kết thúc này, mọi hàm in ấn sẽ tiếp tục in cả dữ liệu rác bên ngoài cho tới khi đụng số không.
- id: formula
  kind: formula
  title: Công thức tính bộ đệm tối thiểu và chỉ số hợp lệ
  checks:
  - alg.cpr_str_bytes(5) == 6
  steps:
  - show: <div class='box key'><p>Mảng <code>a[n]</code> chỉ có các chỉ số hợp lệ từ <b>0</b> tới <b>n − 1</b>.</p><p>Chuỗi dài L ký tự đòi kích thước mảng tối thiểu L + 1 byte (với 5 ký tự cần ít nhất 6 byte).</p></div>
    say: Công thức nền tảng rất gọn nhưng không bao giờ được quên khi khai báo mảng trong C. Vì chỉ số bắt đầu từ không nên mảng có n phần tử chỉ hợp lệ tới n trừ một. Tương tự, một bộ đệm giữ chuỗi dài tối đa L ký tự luôn cần ít nhất L cộng một bai. Công thức tính chỉ số tối đa trừ một và kích thước chuỗi cộng một cần trở thành phản xạ tự nhiên của người lập trình C. Việc cộng thêm một ô nhớ cho ký tự chốt cuối biến chuỗi năm chữ cái thành mảng sáu bai vật lý liên tiếp.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: đo strlen vs sizeof và cắt gọn bằng snprintf'
  checks:
  - alg.cpr_str_bytes(5) == 6
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;string.h&gt;</code></td><td>Chứa hàm đếm độ dài chuỗi <code>strlen</code></td></tr><tr><td><code>const char s[]</code></td><td>Tham số mảng chuỗi chỉ đọc: hàm xem ký tự nhưng bị cấm sửa đổi</td></tr><tr><td><code>snprintf(dst, cap, "%s", s)</code></td><td>Chép có giới hạn: tự cắt nếu nguồn dài quá <code>cap - 1</code> và luôn chừa <code>''\0''</code> (<code>(void)need;</code> bỏ qua cảnh báo biến thừa)</td></tr><tr><td><code>strcpy(dst, src)</code> (tránh dùng)</td><td>Hàm chép không kiểm kích thước đích — nguồn dài quá dễ gây tràn bộ đệm</td></tr></table>'
    say: Trước khi chạy mã C, ta giải mã đủ bốn ký hiệu chuẩn trên bảng. Thư viện chuỗi cung cấp hàm đếm độ dài, và từ khoá chỉ đọc ngăn hàm sửa mảng đầu vào. Hàm ghi giới hạn tự cắt chuỗi vừa dung lượng đích và chừa bai kết thúc, còn ép kiểu bỏ qua biến thừa giúp qua cờ biên dịch nghiêm ngặt. Ngược lại, hàm chép cũ không nhận giới hạn kích thước đích nên dễ gây tràn bộ đệm khi đầu vào quá dài. Đọc hiểu bản chất hằng chuỗi chỉ đọc giúp giữ nguyên dữ liệu mẫu an toàn qua các lớp hàm phụ trợ bên trong chương trình.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>So sánh trực tiếp strlen và sizeof trên chuỗi 5 ký tự</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;string.h&gt;</div><div>static int copy_cut(char dst[], size_t cap, const char s[]) {</div><div>    return snprintf(dst, cap, "%s", s);</div><div>}</div><div>int main(void) {</div><div>    char s[6] = "HELLO";</div><div>    char small[4];</div><div>    int need = copy_cut(small, sizeof(small), s); (void)need;</div><div>    printf("len=%zu bytes=%zu last=%d\n", strlen(s), sizeof(s), (int)s[5]);</div><div>    printf("safe=%s\n", small);</div><div>    return 0;</div><div>}</div></div>
    say: Đoạn mã khai báo một chuỗi chuẩn năm ký tự rồi kiểm tra đồng thời độ dài ký tự và kích thước thật trong bộ nhớ. Tiếp theo ta thử ép chuỗi năm ký tự đó vào bộ đệm chỉ rộng bốn bai qua hàm ghi có giới hạn dung lượng. Phép thử cắt cụt vào vùng đệm bốn bai kiểm chứng khả năng bảo toàn bai không kết thúc của hàm định dạng an toàn.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>len=5 bytes=6 last=0</div><div>safe=HEL</div></div>
    say: Chạy thật bằng trình biên dịch xác nhận độ dài chuỗi bằng năm trong khi tổng bộ nhớ là sáu bai vì chứa thêm bai không ở cuối. Khi đưa vào bộ đệm bốn bai, hàm an toàn tự động cắt gọn còn ba chữ cái đầu kèm bai kết thúc đúng chuẩn. Chiều dài đếm ra năm nhưng kích thước sáu bai cho thấy bai chốt cuối luôn âm thầm chiếm chỗ thực trên RAM.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng chỉ số mảng hợp lệ 0..n-1
  checks:
  - 10 + 20 + 30 + 40 == 100
  steps:
  - show: <p><b>Duyệt đúng biên i < 4 trên mảng 4 phần tử</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>int main(void) {</div><div>    int arr[4] = {10, 20, 30, 40};</div><div>    int sum = 0;</div><div>    for (int i = 0; i &lt; 4; i++) { sum += arr[i]; }</div><div>    printf("sum=%d first=%d last=%d\n", sum, arr[0], arr[3]);</div><div>    return 0;</div><div>}</div></div>
    say: Ở phần kiểm chứng, ta dùng phép duyệt tổng mảng bốn số nguyên theo chỉ số chặt chẽ. Vì vòng lặp dừng ngay khi biến chạy chạm bốn nên phần tử cuối truy cập đúng chỉ số ba mà không trượt ra ngoài biên mảng. Điều kiện lặp nhỏ hơn nghiêm ngặt bốn bảo đảm biến chạy dừng ngay trước ranh giới bốn ô nhớ đã cấp phát.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>sum=100 first=10 last=40</div></div>
    say: Đầu ra thật in tổng bằng đúng một trăm với phần tử đầu là mười và phần tử cuối là bốn mươi, vì bốn số hạng cộng dồn vừa khớp biên trên. Lần lượt kiểm tra từ phần tử đầu tại chỉ số không tới phần tử cuối tại chỉ số ba giúp bảo đảm không đọc vượt ra ngoài vùng nhớ mảng. Cả hai đầu mút không và ba đều nằm gọn trong phạm vi cho phép khẳng định vòng lặp không hề chạm ngoài mảng.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: chi phí bộ đệm chuỗi qua 3 cỡ danh sách tên'
  checks:
  - 1000 * alg.cpr_str_bytes(31) == 32_000
  - 100_000 * 32 == 3_200_000
  steps:
  - show: <table class='t'><tr><th>số lượng chuỗi (mỗi chuỗi tối đa 31 ký tự)</th><th>kích thước mỗi ô đệm</th><th>tổng RAM chiếm</th></tr><tr><td><span style='white-space:nowrap'>10 (×1)</span></td><td>32 byte (31 + '\0')</td><td>320 byte</td></tr><tr><td><span style='white-space:nowrap'>1 000 (×100)</span></td><td>32 byte (31 + '\0')</td><td>32 000 byte (~31 KB)</td></tr><tr><td><span style='white-space:nowrap'>100 000 (×10 000)</span></td><td>32 byte (31 + '\0')</td><td>3 200 000 byte (~3,1 MB)</td></tr></table>
    say: Với quy ước độ dài tối đa ba mươi mốt ký tự, mỗi ô nhớ cần tròn ba mươi hai bai gồm cả bai không kết thúc. Với danh sách nhỏ mười chuỗi, tổng dung lượng chỉ ba trăm hai mươi bai. Tăng lên một nghìn chuỗi thì bộ nhớ chiếm ba mươi hai nghìn bai, và đạt một trăm nghìn chuỗi sẽ tốn hơn ba phẩy hai triệu bai trong bộ nhớ. Khi cấp phát cho hàng triệu chuỗi bản ghi trên bộ nhớ, chỉ cần cộng thêm một bai cho mỗi chuỗi đã giữ sạch toàn hệ thống. Duy trì kỷ luật chừa đúng một bai chốt cuối giữ cho hàng triệu bản ghi chuỗi chạy ổn định không bị trộn lẫn dữ liệu.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Dùng vòng lặp <code>i &lt;= n</code> trên mảng <code>n</code> phần tử.</b> Lệch 1 ô (off-by-one) đọc hoặc ghi quá biên mảng là hành vi không xác định.<br><b>Lỗi 2: Dùng <code>strcpy(dst, src)</code> không kiểm kích thước nguồn.</b> Dữ liệu từ người dùng dài quá ô chứa sẽ phá huỷ ngăn xếp.<br><b>Lỗi 3: Tưởng <code>strncpy</code> luôn tự thêm <code>''\0''</code>.</b> Khi chuỗi nguồn đủ dài bằng <code>n</code>, <code>strncpy</code> để sót chuỗi không có byte 0 cuối; nên dùng <code>snprintf</code>.</div></td></tr></table>'
    say: Có ba lỗi rất hay gặp về mảng và chuỗi trong thực tế lập trình C. Lỗi đầu là lệch một bước do viết dấu nhỏ hơn hoặc bằng làm vòng lặp đọc vượt biên mảng. Lỗi thứ hai là dùng hàm chép không kiểm độ dài gây tràn ngăn xếp. Lỗi thứ ba là nhầm hàm chép độ dài n tự động thêm bai không khi chuỗi nguồn dài vừa khít.
    clear: true
  - show: ''
    say: Luôn kiểm tra kỹ độ dài chuỗi trước khi thao tác để không ghi đè sang vùng nhớ bên cạnh. Không bao giờ dùng các hàm sao chép chuỗi cũ không nhận tham số kích thước tối đa của vùng đệm đích. Luôn giữ thói quen kiểm tra giá trị trả về từ hàm cắt chuỗi để biết chuỗi nguồn có bị cắt ngắn ngoài ý muốn hay không.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.cpr_str_bytes(15) == 16
  - 12 - 1 == 11
  steps:
  - show: <ol><li>Để chứa an toàn chuỗi tối đa 15 ký tự, mảng <code>char</code> cần khai báo tối thiểu bao nhiêu byte?</li><li>Một mảng <code>int a[12]</code> thì chỉ số phần tử hợp lệ cuối cùng là số mấy?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, để chứa an toàn chuỗi dài tối đa mười lăm ký tự, mảng cần tối thiểu bao nhiêu bai? Câu hai, mảng mười hai phần tử thì chỉ số hợp lệ cuối cùng là bao nhiêu? Dừng vi-đê-ô và trả lời. Câu hỏi giúp bạn kiểm chứng hiểu biết về giới hạn bộ đệm chuỗi và ký tự kết thúc mảng trong chuẩn C.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 15 + 1 = <b>16</b> byte (15 ký tự và 1 byte <code>'\0'</code>).</p></td></tr></table>
    say: 'Đáp án câu một: mười lăm cộng thêm một bai kết thúc bằng mười sáu bai. Ký tự kết thúc không ở cuối đóng vai trò chốt chặn giúp các hàm chuẩn dừng đọc đúng ranh giới thay vì tràn sang vùng nhớ bên cạnh. Thiếu đúng một bai kết thúc biến một vùng đệm tưởng chừng vừa vặn thành nguồn gây lỗi treo hệ thống âm thầm.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Chỉ số hợp lệ cuối cùng là 12 − 1 = <b>11</b> (dải <code>0..11</code>).</p></td></tr></table>
    say: 'Đáp án câu hai: chỉ số chạy từ không tới mười một. Dùng hàm định dạng có giới hạn dung lượng đệm là chốt an toàn đơn giản nhất chống lỗi ghi đè bộ nhớ do chuỗi đầu vào quá dài. Luôn kiểm nhẩm bằng trường hợp mảng hai phần tử để khỏi nhầm dấu nhỏ hơn với nhỏ hơn hoặc bằng ở biên.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L03
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L03:</b> đọc <code>cap src</code> từ <code>stdin</code>, dùng <code>snprintf(buf, cap, "%s", src)</code> chép an toàn và in 2 dòng <code>src_len=.. buf_size=..</code>, <code>cut=.. last_byte=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>8 PAYMENT_2026</code> | Chấm: <code>bash labs/cham.sh CPR L03 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L03/de.md</code>)</p></div>'
    say: Hãy mở đề bài L03 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Đọc kỹ yêu cầu về kích thước vùng đệm đích và giá trị bai cuối cùng cần kiểm chứng sau khi cắt ghép chuỗi.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L03/du_lieu.txt</code></b></p><div class="code"><div>src_len=12 buf_size=8</div><div>cut=PAYMENT last_byte=0</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L03 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Dùng đúng hàm định dạng kèm dung lượng đệm để đầu ra bảo đảm luôn kết thúc bằng ký tự kết thúc bằng không.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: '<div class=''box ok''><p><b>Gợi ý nếu kẹt ở bài L03:</b> (1) kiểm tra 0 &lt; cap &lt;= 64 trước khi gọi snprintf; (2) in buf[strlen(buf)] để thấy byte kết thúc 0; (3) thử ca chuỗi ngắn hơn cap.</p></div><p class="note"><b>Gợi ý đọc <code>stdin</code>:</b> <code>size_t cap = 0; char src[128] = {0}; if (scanf("%zu %127s", &amp;cap, src) != 2) return 1;</code> (<code>%127s</code> giới hạn tối đa 127 ký tự chừa 1 byte cho <code>\0</code>).</p>'
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Kiểm tra kỹ trường hợp chuỗi nguồn ngắn hơn lẫn dài hơn vùng đệm nhằm vượt qua mọi ca kiểm thử ẩn.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>Mảng n phần tử: 0..n−1</span><span class=''a''>→</span><span class=''n''>Chuỗi L chữ: cần L + 1 byte</span><span class=''a''>→</span><span class=''n''>Ghi an toàn dùng snprintf</span></div>'
    say: Ghi nhớ chuỗi quy tắc cốt lõi khi thao tác với mảng và chuỗi C. Mảng n phần tử luôn kết thúc ở chỉ số n trừ một. Chuỗi dài L ký tự cần tối thiểu L cộng một bai, và luôn dùng hàm ghi có kiểm biên dung lượng. Thao tác chuỗi có kiểm soát kích thước đệm ngăn chặn hoàn toàn lớp lỗi tràn bộ đệm kinh điển.
    clear: true
  - show: ''
    say: Chỉ số hợp lệ bắt đầu từ không tới độ dài trừ một và mọi chuỗi C chuẩn bắt buộc có một bai kết thúc ở cuối. Cẩn trọng từng ranh giới mảng và chuỗi mở đường cho việc làm việc trực tiếp với địa chỉ ô nhớ qua biến lưu địa chỉ. Kiểm soát chặt chẽ chỉ số hợp lệ và bai kết thúc không là kỹ năng nền tảng không thể thiếu trước khi học truyền địa chỉ.
  - show: '<div class=''box ok''><b>Bài sau (bài 4):</b> Con trỏ và địa chỉ bộ nhớ: toán tử &amp; và *</div>'
    say: Bài tiếp theo là bài 4, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Làm chủ cách giới hạn bộ đệm chuỗi an toàn tạo nền tảng cho bài học sử dụng trực tiếp biến giữ địa chỉ ở bước sau. Rèn thói quen giới hạn dung lượng sao chép chuỗi ngay từ hôm nay sẽ bảo vệ ứng dụng của bạn trước mọi chuỗi đầu vào bất thường. Bài tiếp theo trao cho bạn công cụ truyền địa chỉ để thay đổi trực tiếp dữ liệu nằm ngoài khung ngăn xếp hiện tại.
    clear: true
    forward_ref: true
