    say: Chuỗi gồm năm chữ cái xếp liên tiếp từ chỉ số không đến chỉ số bốn. Ô thứ sáu mang chỉ số năm chứa bai
      giá trị không để báo cho mọi hàm biết nơi kết thúc chuỗi. Vì phải chừa một ô cuối cho ký tự không này nên
      tổng kích thước mảng tối thiểu luôn phải bằng năm cộng một là sáu bai.
    clear: true
- id: formula
  kind: formula
  title: Công thức tính bộ đệm tối thiểu và chỉ số hợp lệ
  checks:
  - alg.cpr_str_bytes(5) == 6
  steps:
  - show: <div class='box key'><p>Mảng <code>a[n]</code> chỉ có các chỉ số hợp lệ từ <b>0</b> tới <b>n − 1</b>.</p><p>Chuỗi
      dài L ký tự đòi kích thước mảng tối thiểu L + 1 byte (với 5 ký tự cần ít nhất 6 byte).</p></div>
    say: Công thức nền tảng rất gọn nhưng không bao giờ được quên khi khai báo mảng trong C. Vì chỉ số bắt đầu từ
      không nên mảng có n phần tử chỉ hợp lệ tới n trừ một. Tương tự, một bộ đệm giữ chuỗi dài tối đa L ký tự luôn
      cần ít nhất L cộng một bai.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: đo strlen vs sizeof và cắt gọn bằng snprintf'
  checks:
  - alg.cpr_str_bytes(5) == 6
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;string.h&gt;</code></td><td>Chứa
      hàm đếm độ dài chuỗi <code>strlen</code></td></tr><tr><td><code>const char s[]</code></td><td>Tham số mảng
      chuỗi chỉ đọc: hàm xem ký tự nhưng bị cấm sửa đổi</td></tr><tr><td><code>snprintf(dst, sizeof(dst), "%s",
      src)</code></td><td>Tự cắt nếu chuỗi nguồn dài quá <code>sizeof(dst) - 1</code>, không bao giờ tràn</td></tr><tr><td><code>(void)need;</code></td><td>Báo
      trình biên dịch bỏ qua giá trị trả về để khỏi lỗi biến không dùng (<code>-Werror</code>)</td></tr></table>'
    say: Trước khi chạy mã C, ta giải mã đủ bốn ký hiệu chuẩn trên bảng. Thư viện chuỗi cung cấp hàm đếm độ dài,
      và từ khoá chỉ đọc ngăn hàm sửa mảng đầu vào. Hàm ghi giới hạn tự cắt chuỗi vừa kích thước, còn ép kiểu bỏ
      qua biến thừa giúp qua cờ biên dịch nghiêm ngặt.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: <p><b>So sánh trực tiếp strlen và sizeof trên chuỗi 5 ký tự</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include
      &lt;string.h&gt;</div><div>static int copy_cut(char dst[], size_t cap, const char s[]) {</div><div>    return
      snprintf(dst, cap, "%s", s);</div><div>}</div><div>int main(void) {</div><div>    char s[6] = "HELLO";</div><div>    char
      small[4];</div><div>    int need = copy_cut(small, sizeof(small), s); (void)need;</div><div>    printf("len=%zu
      bytes=%zu last=%d\n", strlen(s), sizeof(s), (int)s[5]);</div><div>    printf("safe=%s\n", small);</div><div>    return
      0;</div><div>}</div></div>
    say: Đoạn mã khai báo một chuỗi chuẩn năm ký tự rồi kiểm tra đồng thời độ dài ký tự và kích thước thật trong
      bộ nhớ. Tiếp theo ta thử ép chuỗi năm ký tự đó vào bộ đệm chỉ rộng bốn bai qua hàm ghi có giới hạn dung lượng.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>len=5 bytes=6 last=0</div><div>safe=HEL</div></div>
    say: Chạy thật bằng trình biên dịch xác nhận độ dài chuỗi bằng năm trong khi tổng bộ nhớ là sáu bai vì chứa
      thêm bai không ở cuối. Khi đưa vào bộ đệm bốn bai, hàm an toàn tự động cắt gọn còn ba chữ cái đầu kèm bai
      kết thúc đúng chuẩn.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng chỉ số mảng hợp lệ 0..n-1
  checks:
  - 10 + 20 + 30 + 40 == 100
  steps:
  - show: <p><b>Duyệt đúng biên i < 4 trên mảng 4 phần tử</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>int
      main(void) {</div><div>    int arr[4] = {10, 20, 30, 40};</div><div>    int sum = 0;</div><div>    for (int
      i = 0; i &lt; 4; i++) { sum += arr[i]; }</div><div>    printf("sum=%d first=%d last=%d\n", sum, arr[0], arr[3]);</div><div>    return
      0;</div><div>}</div></div>
    say: Ở phần kiểm chứng, ta dùng phép duyệt tổng mảng bốn số nguyên theo chỉ số chặt chẽ. Vì vòng lặp dừng ngay
      khi biến chạy chạm bốn nên phần tử cuối truy cập đúng chỉ số ba mà không trượt ra ngoài biên mảng.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>sum=100 first=10 last=40</div></div>
    say: Đầu ra thật in tổng bằng đúng một trăm với phần tử đầu là mười và phần tử cuối là bốn mươi, vì bốn số hạng
      cộng dồn vừa khớp biên trên.
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: chi phí bộ đệm chuỗi qua 3 cỡ danh sách tên'
  checks:
  - 1000 * alg.cpr_str_bytes(31) == 32_000
  - 100_000 * 32 == 3_200_000
  steps:
  - show: <table class='t'><tr><th>số lượng chuỗi (mỗi chuỗi tối đa 31 ký tự)</th><th>kích thước mỗi ô đệm</th><th>tổng
      RAM chiếm</th></tr><tr><td><span style='white-space:nowrap'>10 (×1)</span></td><td>32 byte (31 + '\0')</td><td>320
      byte</td></tr><tr><td><span style='white-space:nowrap'>1 000 (×100)</span></td><td>32 byte (31 + '\0')</td><td>32
      000 byte (~31 KB)</td></tr><tr><td><span style='white-space:nowrap'>100 000 (×10 000)</span></td><td>32 byte
      (31 + '\0')</td><td>3 200 000 byte (~3,1 MB)</td></tr></table>
    say: Với quy ước độ dài tối đa ba mươi mốt ký tự, mỗi ô nhớ cần tròn ba mươi hai bai gồm cả bai không kết thúc.
      Với danh sách nhỏ mười chuỗi, tổng dung lượng chỉ ba trăm hai mươi bai. Tăng lên một nghìn chuỗi thì bộ nhớ
      chiếm ba mươi hai nghìn bai, và đạt một trăm nghìn chuỗi sẽ tốn hơn ba phẩy hai triệu bai trong bộ nhớ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Dùng vòng lặp <code>i &lt;= n</code> trên mảng <code>n</code> phần tử.</b> Lệch 1 ô (off-by-one) đọc hoặc
      ghi quá biên mảng là hành vi không xác định.<br><b>Lỗi 2: Dùng <code>strcpy(dst, src)</code> không kiểm kích
      thước nguồn.</b> Dữ liệu từ người dùng dài quá ô chứa sẽ phá huỷ ngăn xếp.<br><b>Lỗi 3: Tưởng <code>strncpy</code>
      luôn tự thêm <code>''\0''</code>.</b> Khi chuỗi nguồn đủ dài bằng <code>n</code>, <code>strncpy</code> để
      sót chuỗi không có byte 0 cuối; nên dùng <code>snprintf</code>.</div></td></tr></table>'
    say: Có ba lỗi rất hay gặp về mảng và chuỗi trong thực tế lập trình C. Lỗi đầu là lệch một bước do viết dấu
      nhỏ hơn hoặc bằng làm vòng lặp đọc vượt biên mảng. Lỗi thứ hai là dùng hàm chép không kiểm độ dài gây tràn
      ngăn xếp. Lỗi thứ ba là nhầm hàm chép độ dài n tự động thêm bai không khi chuỗi nguồn dài vừa khít.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.cpr_str_bytes(15) == 16
  - 12 - 1 == 11
  steps:
  - show: <ol><li>Để chứa an toàn chuỗi tối đa 15 ký tự, mảng <code>char</code> cần khai báo tối thiểu bao nhiêu
      byte?</li><li>Một mảng <code>int a[12]</code> thì chỉ số phần tử hợp lệ cuối cùng là số mấy?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, để chứa an toàn chuỗi dài tối đa mười lăm ký tự, mảng cần tối thiểu
      bao nhiêu bai? Câu hai, mảng mười hai phần tử thì chỉ số hợp lệ cuối cùng là bao nhiêu? Dừng vi-đê-ô và trả
      lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 15 + 1 = <b>16</b> byte (15 ký tự và 1 byte
      <code>'\0'</code>).</p></td></tr></table>
    say: 'Đáp án câu một: mười lăm cộng thêm một bai kết thúc bằng mười sáu bai.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Chỉ số hợp lệ cuối cùng là 12 − 1 = <b>11</b>
      (dải <code>0..11</code>).</p></td></tr></table>
    say: 'Đáp án câu hai: chỉ số chạy từ không tới mười một.'
    clear: true
