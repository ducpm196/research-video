      stroke-width="2"/><text x="470.0" y="80" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">[3]
      'L'</text><text x="470.0" y="104" font-size="15" text-anchor="middle" fill="#475569">1 byte</text><rect x="540"
