scenes:
- id: hook
  kind: hook
  title: Vì sao hàm hoán đổi viết bình thường lại không đổi được giá trị ngoài?
  checks:
  - 10 != 25
  steps:
  - show: <div class='box key'><p>Bạn gọi <code>swap(x, y)</code> với <b>x = 10, y = 25</b>, nhưng sau lệnh gọi,
      <b>x</b> vẫn là <b>10</b> và <b>y</b> vẫn là <b>25</b>.</p><p>Lý do nằm ở cơ chế <b>truyền tham trị</b> và
      cách mỗi lời gọi hàm mở rồi thu hồi một <b>khung ngăn xếp</b> riêng.</p></div>
    say: 'Chào bạn, nhiều người mới bất ngờ khi viết hàm hoán đổi hai biến trong C nhưng biến bên ngoài không hề
      thay đổi giá trị. Lý do nằm ở hai khái niệm cốt lõi: C luôn truyền bản sao giá trị vào hàm, và mỗi hàm đang
      chạy sở hữu một khung bộ nhớ cục bộ trên ngăn xếp. Khi hàm kết thúc, khung bộ nhớ đó bị thu hồi ngay lập tức.
      Hiểu cơ chế ngăn xếp này còn giúp bạn tránh luôn lỗi tràn bộ nhớ khi khai báo mảng lớn hoặc viết hàm đệ quy
      sâu.'
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>liên hệ bài mới</th></tr><tr><td>Biến có kích thước byte
      xác định (L00)</td><td>Khung ngăn xếp bằng tổng kích thước các biến cục bộ cộng phần quản lý</td></tr><tr><td>Hành
      vi không xác định (L01)</td><td>Đọc vùng ngăn xếp đã thu hồi sau khi hàm kết thúc là hành vi không xác định</td></tr></table>
    say: Ta nối tiếp bài 0 và bài 1 để giải thích cách hàm quản lý bộ nhớ tạm. Mỗi biến cục bộ chiếm một số bai
      xác định bên trong khung ngăn xếp của hàm đó. Khi hàm thoát ra, vùng nhớ cục bộ hết hạn ngay và mọi truy cập
      lại đều là hành vi không xác định.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>thuật ngữ</th><th>ý nghĩa</th></tr><tr><td>Truyền tham trị</td><td>Hàm nhận <b>bản
      sao</b> của giá trị đối số đặt vào khung ngăn xếp mới</td></tr><tr><td>Khung ngăn xếp</td><td>Vùng nhớ cấp
      tự động theo kiểu vào sau ra trước cho mỗi lần gọi hàm</td></tr><tr><td>Biến cục bộ</td><td>Biến khai báo
      bên trong thân hàm, tự động huỷ ngay khi gặp <code>return</code></td></tr></table>
    say: Ba khái niệm cần nhớ trong bài hôm nay là truyền tham trị, khung ngăn xếp và biến cục bộ. Hàm luôn làm
      việc trên bản sao riêng đặt trong khung ngăn xếp của nó và tự giải phóng ngay lúc trả kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: intuition
  kind: intuition
  title: Khung ngăn xếp xếp chồng khi gọi hàm và thu hồi khi trả về
  steps:
  - show: <div><svg width="960" height="220" viewBox="0 0 960 220"><rect x="25" y="35" width="220" height="150"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="135.0" y="101" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Khung hàm main</text><text x="135.0" y="146" font-size="15" text-anchor="middle"
      fill="#475569">x = 10, y = 25 (ngoài hàm)</text><line x1="245" y1="110" x2="365" y2="110" stroke="#475569"
      stroke-width="2"/><polygon points="365,110 357.0,115.0 357.0,105.0" fill="#475569"/><text x="305" y="102"
      font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">Chép 10, 25</text><rect x="365" y="35"
      width="240" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="485.0" y="101"
      font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Khung swap_thu</text><text x="485.0"
      y="146" font-size="15" text-anchor="middle" fill="#475569">a = 25, b = 10 (bản sao)</text><line x1="605" y1="110"
      x2="725" y2="110" stroke="#475569" stroke-width="2"/><polygon points="725,110 717.0,115.0 717.0,105.0" fill="#475569"/><text
      x="665" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">return → xoá</text><rect
      x="725" y="35" width="210" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="830.0"
      y="101" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Sau lời gọi</text><text x="830.0"
      y="146" font-size="15" text-anchor="middle" fill="#475569">x vẫn 10, y vẫn 25</text></svg></div>
    say: Nhìn sơ đồ khung ngăn xếp đang xếp cạnh nhau trên màn hình. Khung của hàm chính nắm giữ hai biến x bằng
      mười và y bằng hai mươi lăm. Khi gọi hàm hoán đổi thử, hệ thống mở một khung mới rồi chép hai giá trị sang
      hai ô nhớ tách biệt. Mọi phép đổi giá trị chỉ xảy ra trên hai ô nhớ bản sao cục bộ bên trong khung mới. Khi
      hàm hoán đổi vừa kết thúc, toàn bộ khung thứ hai bị thu hồi nên hai biến ban đầu ngoài hàm chính không hề
      thay đổi.
    clear: true
- id: formula
  kind: formula
  title: Cộng kích thước khung ngăn xếp và định luật vào sau ra trước
  checks:
  - alg.cpr_stack_bytes([32, 48, 64]) == 144
  steps:
  - show: <div class='box key'><p>Nếu chuỗi gọi hàm <code>main → f1 → f2</code> có kích thước khung lần lượt <b>32</b>,
      <b>48</b> và <b>64 byte</b>:</p><p>Tổng độ sâu ngăn xếp lúc <code>f2</code> đang chạy $= 32 + 48 + 64 = \hl{144}$
      byte. Khi <code>f2</code> kết thúc, 64 byte được thu hồi ngay.</p></div>
    say: Khi hàm chính gọi hàm một rồi hàm một gọi hàm hai, ba khung xếp chồng lên nhau. Tổng dung lượng ngăn xếp
      đạt ba mươi hai cộng bốn mươi tám cộng sáu mươi bốn bằng một trăm bốn mươi bốn bai. Ngăn xếp mặc định của
      hệ điều hành thường chỉ rộng từ một đến tám mê-ga-bai nên cấp mảng quá lớn trên đó sẽ tràn ngay. Vì thế mọi
      dữ liệu kích thước lớn phải chuyển ra khỏi biến cục bộ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: chứng minh bản sao giữ nguyên biến gốc'
  checks:
  - 10 != 25
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>static void ham(int
      a, int b)</code></td><td>Hàm phụ nội bộ nhận bản sao <code>a, b</code> và không trả về giá trị</td></tr><tr><td><code>printf("...
      %d\n", x)</code></td><td>In chuỗi kèm giá trị số nguyên có dấu <code>int</code></td></tr><tr><td><code>if
      (n &lt;= 0) return 0;</code></td><td>Điều kiện dừng đệ quy trước khi gọi lại chính hàm đó</td></tr></table>
    say: Trước khi chạy mã, ta giải mã ba quy ước hàm cơ bản trong C. Từ khoá hàm nội bộ không trả về giúp thực
      hiện tác vụ mà không xuất giá trị. Định dạng phần trăm d in số nguyên có dấu, còn câu lệnh kiểm tra nhỏ hơn hoặc bằng 0 làm điều kiện dừng đệ quy.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: '<p><b>Thử hoán đổi bằng tham trị: biến gốc ở main vẫn không đổi</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>static void swap_copy(int a, int b) {</div><div>    int tmp = a; a = b; b = tmp;</div><div>    printf("inside:
      a=%d b=%d\n", a, b);</div><div>}</div><div>int main(void) {</div><div>    int x = 10, y = 25;</div><div>    swap_copy(x,
      y);</div><div>    printf("outside: x=%d y=%d\n", x, y);</div><div>    return 0;</div><div>}</div></div>'
    say: Trong hàm hoán đổi thử, ta hoán đổi giá trị của a và b thông qua biến tạm rồi in kết quả ngay bên trong
      hàm. Sau khi hàm trả về, hàm chính in lại cặp biến x và y để chứng minh biến gốc ngoài hàm không hề bị tác
      động.
    focus:
    - 1
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>inside: a=25 b=10</div><div>outside: x=10
      y=25</div></div>'
    say: 'Đầu ra chạy thật khớp lý thuyết: bên trong hàm bản sao đã đảo thành hai mươi lăm và mười. Tuy nhiên khi
      thoát về hàm chính, hai biến x và y vẫn giữ nguyên mười và hai mươi lăm vì khung bộ nhớ kia đã biến mất.'
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Kiểm chứng độ sâu đệ quy: mỗi lần gọi mở một khung riêng'
  checks:
  - sum(range(1, 6)) == 15
  - sum(range(1, 11)) == 55
  steps:
  - show: '<p><b>Tổng đệ quy 1..n: mỗi tầng giữ biến n độc lập trên ngăn xếp</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>static int sum_rec(int n) {</div><div>    if (n &lt;= 0) return 0;</div><div>    return
      n + sum_rec(n - 1);</div><div>}</div><div>int main(void) {</div><div>    printf("sum5=%d sum10=%d\n", sum_rec(5),
      sum_rec(10));</div><div>    return 0;</div><div>}</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta tính tổng cộng dồn đệ quy từ một đến năm và một đến mười vì mỗi lần gọi
      tự tạo một khung riêng. Mỗi khung giữ một biến đếm n độc lập trên ngăn xếp nên không bao giờ đè lên giá trị
      của lần gọi trước.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>sum5=15 sum10=55</div></div>
    say: Đầu ra thật trả về đúng mười lăm và năm mươi lăm, khớp công thức toán học n nhân n cộng một chia đôi vì
      các khung xếp chồng cộng ngược từ điểm dừng đi lên.
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: khi nào ngăn xếp bị tràn (Stack Overflow)?'
  checks:
  - 1000 * 4 == 4000
  - 10_000_000 * 4 == 40_000_000
  steps:
  - show: <table class='t'><tr><th>dữ liệu đặt trên ngăn xếp</th><th>dung lượng chiếm (4 byte/int)</th><th>trạng
      thái trên ngăn xếp ~1–8 MB</th></tr><tr><td><span style='white-space:nowrap'>1 000 số (×1)</span></td><td>4
      000 byte (~4 KB)</td><td>An toàn hoàn toàn</td></tr><tr><td><span style='white-space:nowrap'>100 000 số (×100)</span></td><td>400
      000 byte (~390 KB)</td><td>Cẩn thận nếu lồng nhiều hàm</td></tr><tr><td><span style='white-space:nowrap'>10
      000 000 số (×10 000)</span></td><td>40 000 000 byte (~38 MB)</td><td>Tràn ngăn xếp — sập chương trình ngay</td></tr></table>
    say: Bảng quy mô giải thích vì sao ta không được đặt mảng lớn lên ngăn xếp. Một nghìn phần tử chỉ tốn bốn ki-lô-bai
      nên rất an toàn. Ở mức trung bình một trăm nghìn phần tử tốn bốn trăm ki-lô-bai vẫn nằm gọn trên một số máy
      nhưng rất chật. Ngược lại, mười triệu phần tử tốn gần bốn mươi mê-ga-bai, vượt xa giới hạn mặc định của hệ
      điều hành và làm sập ngay chương trình.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Nghĩ rằng thay đổi tham số hàm tự đổi biến ngoài.</b> Trong C muốn sửa biến ngoài phải truyền địa chỉ ô
      nhớ.<br><b>Lỗi 2: Đặt mảng kích thước hàng triệu phần tử làm biến cục bộ.</b> Ngăn xếp tràn trước khi dòng
      lệnh đầu tiên kịp chạy.<br><b>Lỗi 3: Đệ quy không có điều kiện dừng hoặc quá sâu.</b> Hàng trăm nghìn tầng
      gọi làm cạn toàn bộ ngăn xếp.</div></td></tr></table>'
    say: Có ba lỗi thường gặp khi dùng hàm và ngăn xếp trong C. Lỗi đầu là sửa bản sao tham số mà tưởng đã đổi được
      biến ngoài hàm. Hai lỗi sau là khai báo mảng quá lớn ngay trong hàm hoặc viết hàm đệ quy thiếu điểm dừng gây
      tràn ngăn xếp tức thì.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.cpr_stack_bytes([24, 40, 56, 80]) == 200
  steps:
  - show: <ol><li>Bốn khung ngăn xếp xếp chồng có cỡ 24, 40, 56 và 80 byte thì tổng dung lượng đang chiếm là bao
      nhiêu?</li><li>Nếu muốn giữ lại mảng 5 triệu số <code>int</code> (~20 MB), có nên đặt làm biến cục bộ trên
      ngăn xếp không?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, bốn khung ngăn xếp có kích thước lần lượt hai mươi tư, bốn mươi, năm
      mươi sáu và tám mươi bai thì tổng dung lượng bằng bao nhiêu? Câu hai, có nên khai báo mảng năm triệu số nguyên
      làm biến cục bộ trong hàm không? Dừng vi-đê-ô và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 24 + 40 + 56 + 80 = <b>200</b> byte.</p></td></tr></table>
    say: 'Đáp án câu một: cộng bốn khung lại cho tổng hai trăm bai.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <b>Không:</b> mảng ~20 MB vượt ngưỡng ngăn
      xếp mặc định trên Windows (1 MB) và Linux (8 MB), dễ gây tràn ngăn xếp.</p></td></tr></table>
    say: 'Đáp án câu hai: không được đặt mảng hai mươi mê-ga-bai trên ngăn xếp, mà phải cấp phát trên vùng nhớ mở.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài thực hành C và chấm thật
  lab: labs/CPR/L02
  steps:
  - show: <div class='box key'><p><b>Bài thực hành L02:</b> mở đề tại <code>labs/CPR/L02/de.md</code>, viết mã C
      chuẩn C11 vào một tệp tạm rồi mở <b>Git Bash</b> (cài ở <code>Start → Git → Git Bash</code> hoặc chuột phải
