scenes:
- id: hook
  kind: hook
  title: Vì sao hàm hoán đổi viết bình thường lại không đổi được giá trị ngoài?
  checks:
  - 10 != 25
  steps:
  - show: <div class='box key'><p>Bạn gọi <code>swap(x, y)</code> với <b>x = 10, y = 25</b>, nhưng sau lệnh gọi, <b>x</b> vẫn là <b>10</b> và <b>y</b> vẫn là <b>25</b>.</p><p>Lý do nằm ở cơ chế <b>truyền tham trị</b> và cách mỗi lời gọi hàm mở rồi thu hồi một <b>khung ngăn xếp</b> riêng.</p></div>
    say: 'Chào bạn, nhiều người mới bất ngờ khi viết hàm hoán đổi hai biến trong C nhưng biến bên ngoài không hề thay đổi giá trị. Lý do nằm ở hai khái niệm cốt lõi: C luôn truyền bản sao giá trị vào hàm, và mỗi hàm đang chạy sở hữu một khung bộ nhớ cục bộ trên ngăn xếp. Khi hàm kết thúc, khung bộ nhớ đó bị thu hồi ngay lập tức. Hiểu cơ chế ngăn xếp này còn giúp bạn tránh luôn lỗi tràn bộ nhớ khi khai báo mảng lớn hoặc viết hàm đệ quy sâu. Hiểu nhầm giữa bản sao giá trị và biến thực ngoài hàm khiến rất nhiều hàm xử lý biến số chạy hoàn toàn vô tác dụng. Mỗi lời gọi hàm sinh ra một vùng làm việc riêng rẽ trong bộ nhớ và biến mất ngay khi kết thúc thân hàm.'
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>liên hệ bài mới</th></tr><tr><td>Biến có kích thước byte xác định (L00)</td><td>Khung ngăn xếp bằng tổng kích thước các biến cục bộ cộng phần quản lý</td></tr><tr><td>Hành vi không xác định (L01)</td><td>Đọc vùng ngăn xếp đã thu hồi sau khi hàm kết thúc là hành vi không xác định</td></tr></table>
    say: Ta nối tiếp bài 0 và bài 1 để giải thích cách hàm quản lý bộ nhớ tạm. Mỗi biến cục bộ chiếm một số bai xác định bên trong khung ngăn xếp của hàm đó. Khi hàm thoát ra, vùng nhớ cục bộ hết hạn ngay và mọi truy cập lại đều là hành vi không xác định. Do từng biến cục bộ chiếm số bai xác định, độ sâu gọi hàm nối tiếp quyết định tổng dung lượng khung nhớ xếp chồng. Biết trước kích thước một khung giúp tính chính xác xem chuỗi đệ quy sâu có nguy cơ cạn vùng ngăn xếp hay không.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>thuật ngữ</th><th>ý nghĩa</th></tr><tr><td>Truyền tham trị</td><td>Hàm nhận <b>bản sao</b> của giá trị đối số đặt vào khung ngăn xếp mới</td></tr><tr><td>Khung ngăn xếp</td><td>Vùng nhớ cấp tự động theo kiểu vào sau ra trước cho mỗi lần gọi hàm</td></tr><tr><td>Biến cục bộ</td><td>Biến khai báo bên trong thân hàm, tự động huỷ ngay khi gặp <code>return</code></td></tr></table>
    say: Ba khái niệm cần nhớ trong bài hôm nay là truyền tham trị, khung ngăn xếp và biến cục bộ. Hàm luôn làm việc trên bản sao riêng đặt trong khung ngăn xếp của nó và tự giải phóng ngay lúc trả kết quả. Cô lập biến cục bộ bảo vệ các hàm khác không thể tự ý đọc hoặc ghi đè dữ liệu tạm khi chưa được cho phép. Nhờ cơ chế khung độc lập, hai lời gọi nối tiếp tới cùng một hàm vẫn giữ trọn tập biến cục bộ tách rời nhau.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: intuition
  kind: intuition
  title: Khung ngăn xếp xếp chồng khi gọi hàm và thu hồi khi trả về
  steps:
  - show: <div><svg width="960" height="220" viewBox="0 0 960 220"><rect x="25" y="35" width="220" height="150" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="135.0" y="101" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Khung hàm main</text><text x="135.0" y="146" font-size="15" text-anchor="middle" fill="#475569">x = 10, y = 25 (ngoài hàm)</text><line x1="245" y1="110" x2="365" y2="110" stroke="#475569" stroke-width="2"/><polygon points="365,110 357.0,115.0 357.0,105.0" fill="#475569"/><text x="305" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">Chép 10, 25</text><rect x="365" y="35" width="240" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="485.0" y="101" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Khung swap_thu</text><text x="485.0" y="146" font-size="15" text-anchor="middle" fill="#475569">a = 25, b = 10 (bản sao)</text><line x1="605" y1="110" x2="725" y2="110" stroke="#475569" stroke-width="2"/><polygon points="725,110 717.0,115.0 717.0,105.0" fill="#475569"/><text x="665" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">return → xoá</text><rect x="725" y="35" width="210" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="101" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Sau lời gọi</text><text x="830.0" y="146" font-size="15" text-anchor="middle" fill="#475569">x vẫn 10, y vẫn 25</text></svg></div>
    say: Nhìn sơ đồ khung ngăn xếp đang xếp cạnh nhau trên màn hình. Khung của hàm chính nắm giữ hai biến x bằng mười và y bằng hai mươi lăm. Khi gọi hàm hoán đổi thử, hệ thống mở một khung mới rồi chép hai giá trị sang hai ô nhớ tách biệt. Mọi phép đổi giá trị chỉ xảy ra trên hai ô nhớ bản sao cục bộ bên trong khung mới.
    clear: true
  - show: ''
    say: Khi hàm hoán đổi vừa kết thúc, toàn bộ khung thứ hai bị thu hồi nên hai biến ban đầu ngoài hàm chính không hề thay đổi. Việc dọn sạch khung ngăn xếp chỉ đơn thuần là dịch chuyển mốc đỉnh ngăn xếp lùi về vị trí của hàm gọi trước đó. Nhờ cơ chế cộng trừ thanh ghi đơn giản này, cấp phát và thu hồi bộ nhớ cục bộ diễn ra nhanh gấp hàng trăm lần vùng mở.
- id: formula
  kind: formula
  title: Cộng kích thước khung ngăn xếp và định luật vào sau ra trước
  checks:
  - alg.cpr_stack_bytes([32, 48, 64]) == 144
  steps:
  - show: <div class='box key'><p>Nếu chuỗi gọi hàm <code>main → f1 → f2</code> có kích thước khung lần lượt <b>32</b>, <b>48</b> và <b>64 byte</b>:</p><p>Tổng độ sâu ngăn xếp lúc <code>f2</code> đang chạy $= 32 + 48 + 64 = \hl{144}$ byte. Khi <code>f2</code> kết thúc, 64 byte được thu hồi ngay.</p></div>
    say: Khi hàm chính gọi hàm một rồi hàm một gọi hàm hai, ba khung xếp chồng lên nhau. Tổng dung lượng ngăn xếp đạt ba mươi hai cộng bốn mươi tám cộng sáu mươi bốn bằng một trăm bốn mươi bốn bai. Ngăn xếp mặc định của hệ điều hành thường chỉ rộng từ một đến tám mê-ga-bai nên cấp mảng quá lớn trên đó sẽ tràn ngay. Vì thế mọi dữ liệu kích thước lớn phải chuyển ra khỏi biến cục bộ. Khi hàm hai trả về kết quả, sáu mươi bốn bai của nó lập tức được trả lại trước khi thực hiện lệnh gọi kế tiếp. Biết tổng kích thước tối đa của chuỗi lời gọi giúp ước lượng trước độ sâu an toàn trước khi đưa lên thiết bị thật.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: chứng minh bản sao giữ nguyên biến gốc'
  checks:
  - 10 != 25
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>static void ham(int a, int b)</code></td><td>Hàm phụ nội bộ nhận bản sao <code>a, b</code> và không trả về giá trị</td></tr><tr><td><code>printf("... %d\n", x)</code></td><td>In chuỗi kèm giá trị số nguyên có dấu <code>int</code></td></tr><tr><td><code>if (n &lt;= 0) return 0;</code></td><td>Điều kiện dừng đệ quy trước khi gọi lại chính hàm đó</td></tr></table>
    say: Trước khi chạy mã, ta giải mã ba quy ước hàm cơ bản trong C. Từ khoá hàm nội bộ không trả về giúp thực hiện tác vụ mà không xuất giá trị. Định dạng phần trăm d in số nguyên có dấu, còn câu lệnh kiểm tra nhỏ hơn hoặc bằng 0 làm điều kiện dừng đệ quy. Từ khoá tĩnh nội bộ thu gọn tầm nhìn hàm trong phạm vi tệp hiện tại, giúp trình biên dịch kiểm soát chặt liên kết.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: '<p><b>Thử hoán đổi bằng tham trị: biến gốc ở main vẫn không đổi</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>static void swap_copy(int a, int b) {</div><div>    int tmp = a; a = b; b = tmp;</div><div>    printf("inside: a=%d b=%d\n", a, b);</div><div>}</div><div>int main(void) {</div><div>    int x = 10, y = 25;</div><div>    swap_copy(x, y);</div><div>    printf("outside: x=%d y=%d\n", x, y);</div><div>    return 0;</div><div>}</div></div>'
    say: Trong hàm hoán đổi thử, ta hoán đổi giá trị của a và b thông qua biến tạm rồi in kết quả ngay bên trong hàm. Sau khi hàm trả về, hàm chính in lại cặp biến x và y để chứng minh biến gốc ngoài hàm không hề bị tác động. Giá trị gốc của x và y nằm nguyên trên khung hàm chính bất chấp các phép gán bên trong khung hoán đổi tạm.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>inside: a=25 b=10</div><div>outside: x=10 y=25</div></div>'
    say: 'Đầu ra chạy thật khớp lý thuyết: bên trong hàm bản sao đã đảo thành hai mươi lăm và mười. Tuy nhiên khi thoát về hàm chính, hai biến x và y vẫn giữ nguyên mười và hai mươi lăm vì khung bộ nhớ kia đã biến mất. Sự cách biệt địa chỉ giữa bản chính và bản sao minh hoạ rõ nét nhất quy tắc truyền tham trị mặc định trong C.'
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: 'Kiểm chứng độ sâu đệ quy: mỗi lần gọi mở một khung riêng'
  checks:
  - sum(range(1, 6)) == 15
  - sum(range(1, 11)) == 55
  steps:
  - show: '<p><b>Tổng đệ quy 1..n: mỗi tầng giữ biến n độc lập trên ngăn xếp</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>static int sum_rec(int n) {</div><div>    if (n &lt;= 0) return 0;</div><div>    return n + sum_rec(n - 1);</div><div>}</div><div>int main(void) {</div><div>    printf("sum5=%d sum10=%d\n", sum_rec(5), sum_rec(10));</div><div>    return 0;</div><div>}</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta tính tổng cộng dồn đệ quy từ một đến năm và một đến mười vì mỗi lần gọi tự tạo một khung riêng. Mỗi khung giữ một biến đếm n độc lập trên ngăn xếp nên không bao giờ đè lên giá trị của lần gọi trước. Mỗi tầng đệ quy giữ riêng biến đếm của chính nó trên một khung độc lập nên không bao giờ giẫm chân lên tầng trên.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>sum5=15 sum10=55</div></div>
    say: Đầu ra thật trả về đúng mười lăm và năm mươi lăm, khớp công thức toán học n nhân n cộng một chia đôi vì các khung xếp chồng cộng ngược từ điểm dừng đi lên. Nhờ nắm rõ đường đi của từng khung ngăn xếp và giới hạn bản sao tham trị, bạn tránh được lỗi sửa nhầm dữ liệu ngoài ý muốn và ngăn chặn sớm tràn ngăn xếp. Việc gộp kết quả trả về ngược từ tầng đáy lên tới gốc diễn ra chính xác không nhầm lẫn nhờ tách biệt từng khung.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: khi nào ngăn xếp bị tràn (Stack Overflow)?'
  checks:
  - 1000 * 4 == 4000
  - 10_000_000 * 4 == 40_000_000
  steps:
  - show: <table class='t'><tr><th>dữ liệu đặt trên ngăn xếp</th><th>dung lượng chiếm (4 byte/int)</th><th>trạng thái trên ngăn xếp ~1–8 MB</th></tr><tr><td><span style='white-space:nowrap'>1 000 số (×1)</span></td><td>4 000 byte (~4 KB)</td><td>An toàn hoàn toàn</td></tr><tr><td><span style='white-space:nowrap'>100 000 số (×100)</span></td><td>400 000 byte (~390 KB)</td><td>Cẩn thận nếu lồng nhiều hàm</td></tr><tr><td><span style='white-space:nowrap'>10 000 000 số (×10 000)</span></td><td>40 000 000 byte (~38 MB)</td><td>Tràn ngăn xếp — sập chương trình ngay</td></tr></table>
    say: Bảng quy mô giải thích vì sao ta không được đặt mảng lớn lên ngăn xếp. Một nghìn phần tử chỉ tốn bốn ki-lô-bai nên rất an toàn. Ở mức trung bình một trăm nghìn phần tử tốn bốn trăm ki-lô-bai vẫn nằm gọn trên một số máy nhưng rất chật. Ngược lại, mười triệu phần tử tốn gần bốn mươi mê-ga-bai, vượt xa giới hạn mặc định của hệ điều hành và làm sập ngay chương trình. Dùng hết vài mê-ga-bai giới hạn ngăn xếp trên hệ điều hành sẽ kích hoạt lỗi sập bộ nhớ ngay lập tức không báo trước. Do đó kích thước mảng lớn hoặc cấu trúc phình to tuỳ theo đầu vào bắt buộc chuyển sang vùng nhớ mở linh hoạt. Nếu dữ liệu cần vượt quá vài trăm ki-lô-bai, hãy chuyển ngay sang xin cấp phát trên vùng nhớ mở thay cho mảng cục bộ.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Bốn lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Nghĩ rằng thay đổi tham số hàm tự đổi biến ngoài.</b> Trong C muốn sửa biến ngoài phải truyền địa chỉ ô nhớ.<br><b>Lỗi 2: Đặt mảng kích thước hàng triệu phần tử làm biến cục bộ.</b> Ngăn xếp tràn trước khi dòng lệnh đầu tiên kịp chạy.<br><b>Lỗi 3: Đệ quy không có điều kiện dừng hoặc quá sâu.</b> Hàng trăm nghìn tầng gọi làm cạn toàn bộ ngăn xếp.<br><b>Lỗi 4: Trả về địa chỉ biến cục bộ (dangling pointer).</b> Khi hàm trả về, khung ngăn xếp bị thu hồi nên việc giữ và đọc địa chỉ biến cục bộ sau khi thoát hàm là lỗi đọc vùng nhớ hết hạn.</div></td></tr></table>'
    say: Có bốn lỗi thường gặp khi dùng hàm và ngăn xếp trong C. Lỗi đầu là sửa bản sao tham số mà tưởng đã đổi được biến ngoài hàm. Hai lỗi sau là khai báo mảng quá lớn ngay trong hàm hoặc viết hàm đệ quy thiếu điểm dừng gây tràn ngăn xếp tức thì. Trả về địa chỉ một biến cục bộ nằm trên ngăn xếp còn tệ hơn truyền tham trị vì vùng nhớ đó đã hết hạn sử dụng. Mọi tham số truyền mảng hay địa chỉ ô nhớ sang hàm con cần được thiết kế rõ ràng về quyền sở hữu và tuổi thọ dữ liệu.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.cpr_stack_bytes([24, 40, 56, 80]) == 200
  steps:
  - show: <ol><li>Bốn khung ngăn xếp xếp chồng có cỡ 24, 40, 56 và 80 byte thì tổng dung lượng đang chiếm là bao nhiêu?</li><li>Nếu muốn giữ lại mảng 5 triệu số <code>int</code> (~20 MB), có nên đặt làm biến cục bộ trên ngăn xếp không?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, bốn khung ngăn xếp có kích thước lần lượt hai mươi tư, bốn mươi, năm mươi sáu và tám mươi bai thì tổng dung lượng bằng bao nhiêu? Câu hai, có nên khai báo mảng năm triệu số nguyên làm biến cục bộ trong hàm không? Dừng vi-đê-ô và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 24 + 40 + 56 + 80 = <b>200</b> byte.</p></td></tr></table>
    say: 'Đáp án câu một: cộng bốn khung lại cho tổng hai trăm bai. Nhờ đặc tính tách biệt bản sao này, giá trị ở hàm gọi luôn được bảo vệ an toàn trừ khi bạn chủ động truyền địa chỉ ô nhớ. Cộng dồn kích thước các khung đang hoạt động giúp nhìn ngay mức tiêu thụ đỉnh tại bước gọi hàm sâu nhất.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <b>Không:</b> mảng ~20 MB vượt ngưỡng ngăn xếp mặc định trên Windows (1 MB) và Linux (8 MB), dễ gây tràn ngăn xếp.</p></td></tr></table>
    say: 'Đáp án câu hai: không được đặt mảng hai mươi mê-ga-bai trên ngăn xếp, mà phải cấp phát trên vùng nhớ mở. Khi đệ quy quá sâu không có điều kiện dừng hợp lý, toàn bộ vùng ngăn xếp cố định sẽ tràn ngay lập tức làm dừng chương trình. Ghi nhớ giới hạn vài mê-ga-bai giúp bạn tránh tạo bộ đệm tạm khổng lồ ngay bên trong thân hàm thông thường.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L02
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L02:</b> đọc <code>v sum_n f1 f2 f3</code> từ <code>stdin</code>, cài hàm tham trị <code>double_val(x)</code> &amp; đệ quy <code>sum_to(n)</code> để in 2 dòng <code>after_call=..</code>, <code>sum=.. stack_frames=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>11 10 32 64 96</code> | Chấm: <code>bash labs/cham.sh CPR L02 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L02/de.md</code>)</p></div>'
    say: Hãy mở đề bài L02 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Quan sát cẩn thận giá trị biến giữ nguyên sau lời gọi nhân đôi theo tham trị cùng tổng chuỗi đệ quy và tổng kích thước ba khung hàm.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L02/du_lieu.txt</code></b></p><div class="code"><div>after_call=11</div><div>sum=55 stack_frames=192</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L02 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Cộng dồn kích thước ba khung ngăn xếp đầu vào cho thật khớp với tổng số bai yêu cầu.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: '<div class=''box ok''><p><b>Gợi ý nếu kẹt ở bài L02:</b> (1) dùng biến long long cho tổng n lớn; (2) giữ điều kiện dừng n &lt;= 0 trong hàm đệ quy; (3) đọc đủ 5 số nguyên từ stdin.</p></div><p class="note"><b>Gợi ý đọc <code>stdin</code>:</b> <code>int v, n, f1, f2, f3; if (scanf("%d %d %d %d %d", &amp;v, &amp;n, &amp;f1, &amp;f2, &amp;f3) != 5) return 1;</code> (dấu <code>&amp;</code> lấy địa chỉ ô nhớ để <code>scanf</code> nạp đủ 5 số từ <code>stdin</code>).</p>'
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Nhớ gắn điều kiện dừng chuẩn ở tầng cơ sở hàm đệ quy để ngăn vòng gọi vô tận làm tràn ngăn xếp.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>Truyền tham trị = bản sao</span><span class='a'>→</span><span class='n'>Khung ngăn xếp tự huỷ khi return</span><span class='a'>→</span><span class='n'>Dữ liệu lớn không đặt trên ngăn xếp</span></div>
    say: Tổng kết lại ba điểm cần mang theo từ bài 2. Truyền tham trị luôn tạo bản sao, biến cục bộ hết hạn ngay khi hàm trả kết quả, và tuyệt đối không nhồi mảng lớn lên ngăn xếp. Hiểu rõ ranh giới khung hàm giúp bạn kiểm soát cả dòng dữ liệu lẫn độ sâu ngăn xếp.
    clear: true
  - show: ''
    say: Ngăn xếp cung cấp không gian làm việc nhanh gọn cho từng lời gọi hàm với cơ chế tự dọn dẹp tức thời lúc thoát. Hiểu ranh giới tuổi thọ biến cục bộ giúp chuẩn bị bước sang xử lý mảng và chuỗi nhiều phần tử. Phân biệt rõ tham số giá trị sao chép và vòng đời ngắn hạn của biến trên ngăn xếp tránh hầu hết lỗi mất dữ liệu sau lời gọi.
  - show: <div class='box ok'><b>Bài sau (bài 3):</b> Mảng và chuỗi ký tự kết thúc bằng byte không</div>
    say: Bài tiếp theo là bài 3, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Nắm chắc vòng đời khung ngăn xếp là bước đệm quan trọng trước khi xử lý mảng ký tự và chuỗi kết thúc không ở bài kế tiếp. Bước tiếp theo ta sẽ đưa các vùng đệm nhiều bai vào hàm và kiểm soát chặt chẽ bai kết thúc chuỗi.
    clear: true
    forward_ref: true
