  - show: <p><b>Kết quả mong đợi cần khớp 100% (2 dòng)</b></p><div class="code"><div>after_call=7</div><div>sum8=36
      stack_frames=144</div></div>
    say: Màn hình hiện toàn bộ các dòng kết quả mong đợi mà chương trình của bạn phải in ra khớp từng ký tự.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
