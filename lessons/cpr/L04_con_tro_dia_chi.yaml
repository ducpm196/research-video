scenes:
- id: hook
  kind: hook
  title: Làm sao một hàm sửa trực tiếp biến gốc ở bên ngoài?
  checks:
  - 10 != 25
  steps:
  - show: <div class='box key'><p>Ở bài 2, hàm hoán đổi thất bại vì chỉ sửa bản sao. Thay vì gửi giá trị <b>10</b> và <b>25</b>, ta gửi <b>địa chỉ ô nhớ</b> nơi hai biến đang nằm.</p><p>Biến đặc biệt chứa con số địa chỉ ấy là chìa khoá để C làm việc trực tiếp với bộ nhớ bên ngoài hàm.</p></div>
    say: Chào bạn, ở bài 2 hàm hoán đổi thất bại vì chỉ cầm bản sao giá trị. Hôm nay ta giải quyết dứt điểm bài toán đó bằng cách gửi thẳng con số địa chỉ ô nhớ của biến gốc vào hàm. Nhờ nắm đúng địa chỉ nhà, hàm mới có quyền mở cửa bước vào sửa giá trị thực sự. Thay vì chỉ truyền bản sao khiến hàm hoán đổi vô nghĩa, địa chỉ cho phép hàm tiếp cận đúng ô nhớ của biến gọi. Con trỏ tạo nên cầu nối hiệu quả giữa các khung ngăn xếp tách biệt mà vẫn kiểm soát được vị trí thao tác.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>liên kết với địa chỉ ô nhớ</th></tr><tr><td>Mọi biến nằm tại ô nhớ RAM với địa chỉ 8 byte trên hệ 64-bit (L00)</td><td>Địa chỉ này là số nguyên xác định vị trí bắt đầu của biến</td></tr><tr><td>Hàm chỉ nhận bản sao đối số (L02)</td><td>Bản sao của địa chỉ vẫn trỏ tới đúng ô nhớ gốc</td></tr></table>
    say: Nhớ lại bài 0 và bài 2 trước khi viết ký hiệu mới. Trên hệ thống sáu mươi bốn bít, mọi biến đều có địa chỉ tám bai cố định trên bộ nhớ RAM. Dù hàm chỉ nhận bản sao của địa chỉ đó thì con số địa chỉ vẫn trỏ trúng ngay ô nhớ gốc. Trên kiến trúc sáu mươi bốn bít, mọi biến lưu vị trí ô nhớ đều đồng nhất tám bai bất kể dữ liệu tại đích lớn bốn bai hay một nghìn bai. Địa chỉ chỉ là một con số định vị trong không gian bộ nhớ ảo của tiến trình đang thực thi.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu mới</th><th>tên gọi và tác dụng</th></tr><tr><td><code>&amp;x</code></td><td>Lấy địa chỉ ô nhớ của biến <code>x</code></td></tr><tr><td><code>int *p</code></td><td>Khai báo biến con trỏ <code>p</code> chứa địa chỉ của một biến <code>int</code></td></tr><tr><td><code>*p</code></td><td>Giải tham chiếu: đọc hoặc ghi trực tiếp vào ô nhớ mà <code>p</code> đang trỏ tới</td></tr><tr><td><code>NULL</code></td><td>Địa chỉ rỗng đặc biệt báo hiệu con trỏ hiện không trỏ tới biến nào</td></tr></table>'
    say: Bảng này giải mã bốn ký hiệu trọng tâm của con trỏ trong C. Dấu và đứng trước biến lấy địa chỉ ô nhớ của biến đó. Dấu sao khi khai báo biến tạo thành con trỏ giữ địa chỉ, còn dấu sao đứng trong biểu thức nghĩa là đọc hoặc ghi tại ô nhớ đích. Cuối cùng là giá trị rỗng chuẩn báo hiệu con trỏ chưa trỏ tới đâu. Cặp toán tử lấy địa chỉ và giải tham chiếu đóng vai trò hai chiều thuận nghịch giữa biến thực và biến giữ vị trí. Biến giữ địa chỉ cho phép nhiều hàm cùng thao tác lên một ô nhớ gốc duy nhất mà không cần sao chép toàn khối dữ liệu.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.5'
    clear: true
    introduces:
    - cpr_con_tro
- id: intuition
  kind: intuition
  title: Gửi địa chỉ nhà thay vì gửi bản photo tờ giấy
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="40" y="50" width="230" height="105" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="155.0" y="96" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Biến gốc x</text><text x="155.0" y="128" font-size="15" text-anchor="middle" fill="#475569">Giá trị: 10 | tại 0x7000</text><line x1="270" y1="102" x2="370" y2="102" stroke="#475569" stroke-width="2"/><polygon points="370,102 362.0,107.0 362.0,97.0" fill="#475569"/><text x="320" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">&amp;x = 0x7000</text><rect x="370" y="50" width="240" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="490.0" y="96" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Con trỏ p</text><text x="490.0" y="128" font-size="15" text-anchor="middle" fill="#475569">Giữ địa chỉ 0x7000</text><line x1="610" y1="102" x2="700" y2="102" stroke="#475569" stroke-width="2"/><polygon points="700,102 692.0,107.0 692.0,97.0" fill="#475569"/><text x="655" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">*p = 99</text><rect x="700" y="50" width="220" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="810.0" y="96" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Ô nhớ 0x7000</text><text x="810.0" y="128" font-size="15" text-anchor="middle" fill="#475569">x đổi ngay thành 99</text></svg></div>'
    say: 'Nhìn sơ đồ: biến gốc x nằm tại ô nhớ đánh địa chỉ hệ thập lục phân bảy nghìn. Toán tử lấy địa chỉ đưa đúng con số vị trí ấy cất vào biến con trỏ p. Khi hàm thực hiện phép ghi qua dấu sao giải tham chiếu, giá trị tại đúng ô nhớ địa chỉ bảy nghìn đổi từ mười thành chín mươi chín. Hai khái niệm vị trí ô nhớ và giá trị bên trong ô nhớ luôn đi đôi nhưng hoàn toàn khác vai trò.'
    clear: true
  - show: ''
    say: Cách truyền địa chỉ này cũng tương đồng với việc gửi vị trí ngăn tủ thay vì sao chép cả tập hồ sơ dày. Bất kỳ thay đổi nào ghi qua dấu sao giải tham chiếu đều in thẳng xuống địa chỉ gốc nên còn nguyên hiệu lực sau lời gọi. Hình dung con trỏ như tờ giấy ghi số phòng giúp mọi người đều mở được đúng căn phòng dữ liệu duy nhất đó.
- id: formula
  kind: formula
  title: Luật đọc/ghi an toàn qua con trỏ
  checks:
  - 10 + 15 == 25
  steps:
  - show: '<div class=''box key''><p>Ba quy tắc bất di bất dịch:</p><ol><li>Khởi tạo ngay lúc tạo: <code>int *p = &amp;x;</code> hoặc <code>int *p = NULL;</code></li><li>Chỉ giải tham chiếu sau khi kiểm: <code>if (p != NULL) { *p = ...; }</code></li><li>Không trộn kiểu trỏ: địa chỉ của <code>int</code> đi với <code>int *</code>, của <code>double</code> đi với <code>double *</code>.</li></ol></div>'
    say: Ba quy tắc bảo vệ sau giúp tránh gần hết lỗi con trỏ kinh điển. Bạn hãy luôn gán giá trị ban đầu ngay khi khai báo biến trỏ. Sau đó luôn kiểm tra khác rỗng trước khi ghi và giữ đúng kiểu dữ liệu đích. Khởi tạo con trỏ bằng địa chỉ hợp lệ hoặc giá trị rỗng ngay lúc tạo lập loại bỏ hẳn trạng thái trỏ ngẫu nhiên nguy hiểm. Gán giá trị rỗng ngay sau khi ngừng sử dụng ngăn chặn hoàn toàn tình trạng trỏ nhầm vào vùng địa chỉ không còn hợp lệ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: hàm hoán đổi thật qua địa chỉ'
  checks:
  - '(lambda a, b: (b, a))(10, 25) == (25, 10)'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>static void swap_ptr(int *pa, int *pb)</code></td><td>Hàm nhận hai địa chỉ kiểu <code>int *</code> để sửa trực tiếp biến gốc</td></tr><tr><td><code>swap_ptr(&amp;a, &amp;b);</code></td><td>Truyền địa chỉ của hai biến gốc từ <code>main</code> vào hàm</td></tr><tr><td><code>pa == NULL || pb == NULL</code></td><td>Đúng nếu ít nhất một vế đúng: <code>pa == NULL || pb == NULL</code></td></tr><tr><td><code>if (q)</code> / <code>0x7000</code></td><td><code>if (q)</code> viết gọn của <code>q != NULL</code>; <code>0x...</code> là số địa chỉ hệ thập lục phân</td></tr></table>'
    say: Ta giải mã đủ bốn ký hiệu trước khi đọc mã nguồn. Tham số nhận hai địa chỉ kiểu số nguyên, câu lệnh phép hoặc loại trừ ngay khi một con trỏ rỗng. Cách viết rút gọn kiểm tra trực tiếp con trỏ khác rỗng ngay trước dấu sao giải tham chiếu. Phép kiểm tra rỗng bằng toán tử logic ngăn chặn hoàn toàn tai nạn đọc nhầm địa chỉ không khiến hệ điều hành ngắt tiến trình.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: '<p><b>Hoán đổi thật qua con trỏ và kiểm tra NULL an toàn</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>static void swap_ptr(int *pa, int *pb) {</div><div>    if (pa == NULL || pb == NULL) return;</div><div>    int tmp = *pa; *pa = *pb; *pb = tmp;</div><div>}</div><div>int main(void) {</div><div>    int a = 10, b = 25;</div><div>    swap_ptr(&amp;a, &amp;b);</div><div>    printf("after: a=%d b=%d\n", a, b);</div><div>    return 0;</div><div>}</div></div>'
    say: Hàm hoán đổi nhận vào hai con trỏ, chủ động kiểm tra cả hai đều khác rỗng trước khi giải tham chiếu. Nhờ trỏ trúng hai biến gốc, biến tạm bên trong hàm đổi được trực tiếp giá trị nằm ngoài hàm chính. Nhờ truyền hai con trỏ vào hàm, việc trao đổi hai giá trị gốc diễn ra chỉ qua ba phép gán gọn gàng.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>after: a=25 b=10</div></div>'
    say: Đầu ra chạy thật cho thấy biến a và biến b ở hàm chính đã thực sự hoán đổi thành hai mươi lăm và mười. Phép hoán đổi này thành công hoàn toàn khác hẳn kết quả thất bại ở bài trước. Số liệu đảo thành công ở hàm chính khẳng định tác động trực tiếp xuyên qua ranh giới khung ngăn xếp của hàm con.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: 'Đường khác: dùng con trỏ trả về nhiều kết quả cùng lúc'
  checks:
  - 29 // 6 == 4
  - 29 % 6 == 5
  steps:
  - show: <p><b>Hàm trả cả phần nguyên và phần dư thông qua hai con trỏ đầu ra</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>static void divmod_i(int x, int d, int *q, int *r) {</div><div>    if (q) *q = x / d;</div><div>    if (r) *r = x % d;</div><div>}</div><div>int main(void) {</div><div>    int thuong = 0, du = 0;</div><div>    divmod_i(29, 6, &amp;thuong, &amp;du);</div><div>    printf("q=%d r=%d\n", thuong, du);</div><div>    return 0;</div><div>}</div></div>
    say: Ở đường kiểm chứng thứ hai, ta giải bài toán trả về cả phần thương lẫn phần dư chỉ trong một lần gọi hàm. Vì ngôn ngữ C chỉ cho phép trả về một giá trị trực tiếp nên hàm kiểm tra khác rỗng rồi ghi song song hai kết quả qua hai con trỏ đầu ra. Hàm kiểm tra con trỏ rỗng trước khi ghi kết quả để tránh sập chương trình. Kỹ thuật dùng tham số đầu ra qua con trỏ là quy chuẩn phổ biến để hàm C trả về nhiều kết quả cùng lúc.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>q=4 r=5</div></div>
    say: Đầu ra thật xác nhận thương bằng bốn và số dư bằng năm, nghĩa là hai mươi chín bằng sáu nhân bốn cộng năm khớp tuyệt đối mà vẫn an toàn trước con trỏ rỗng. Cách truyền địa chỉ kết hợp kiểm tra khác rỗng giúp một hàm duy nhất có thể cập nhật an toàn nhiều giá trị trả về mà vẫn gọn gàng sáng sủa. Thương bốn dư năm tính một lượt qua hai con trỏ giúp tối giản vòng gọi hàm mà vẫn bảo toàn tính an toàn mẫu số.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: chi phí truyền struct lớn theo giá trị vs qua con trỏ'
  checks:
  - 1_000_000 * 8 == 8_000_000
  - 4096 // 8 == 512
  steps:
  - show: <table class='t'><tr><th>số lượt gọi hàm truyền cấu trúc 4 KB</th><th>chép nguyên khối (tham trị)</th><th>truyền địa chỉ con trỏ (8 byte)</th></tr><tr><td><span style='white-space:nowrap'>100 lượt (×1)</span></td><td>400 KB sao chép</td><td>800 byte địa chỉ</td></tr><tr><td><span style='white-space:nowrap'>10 000 lượt (×100)</span></td><td>40 MB sao chép</td><td>80 KB địa chỉ</td></tr><tr><td><span style='white-space:nowrap'>1 000 000 lượt (×10 000)</span></td><td>4 GB sao chép</td><td>8 MB địa chỉ (nhanh hơn ~500 lần)</td></tr></table>
    say: Ngoài việc sửa giá trị gốc, truyền địa chỉ còn tránh sao chép khối dữ liệu lớn. Ở mức một trăm lượt truyền cấu trúc bốn ki-lô-bai, truyền địa chỉ chỉ tốn tám trăm bai so với bốn trăm ki-lô-bai. Khi tăng lên một triệu lượt gọi hàm, truyền bản sao tốn bốn gi-ga-bai sao chép, còn truyền địa chỉ chỉ tốn tám mê-ga-bai, nhanh hơn gấp năm trăm lần. Thay vì chép bốn ki-lô-bai dữ liệu qua mỗi lời gọi, gửi con trỏ tám bai giúp băng thông bộ nhớ giảm hàng trăm lần. Trên các cấu trúc hồ sơ lớn hàng chục ki-lô-bai, truyền địa chỉ tám bai tăng tốc độ xử lý gấp hàng nghìn lần.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Khai báo <code>int *p;</code> không gán giá trị rồi ghi <code>*p = 5;</code>.</b> Con trỏ mang địa chỉ rác làm sập chương trình ngay.<br><b>Lỗi 2: Giải tham chiếu con trỏ <code>NULL</code> khi chưa kiểm tra.</b> Luôn kiểm <code>if (p != NULL)</code> ở ranh giới hàm.<br><b>Lỗi 3: Trả về địa chỉ biến cục bộ <code>int x = 5; return &amp;x;</code>.</b> Khung ngăn xếp của hàm vừa bị huỷ, địa chỉ trả về thành con trỏ treo.</div></td></tr></table>'
    say: Có ba lỗi nghiêm trọng rất hay gặp khi mới làm việc với con trỏ. Lỗi thứ nhất là khai báo con trỏ chưa khởi tạo chứa địa chỉ rác rồi ghi thẳng vào đó. Lỗi thứ hai là quên kiểm tra khác rỗng trước khi giải tham chiếu. Lỗi thứ ba là trả về địa chỉ của một biến cục bộ vừa hết hạn.
    clear: true
  - show: ''
    say: Thói quen khởi tạo biến giữ địa chỉ ngay từ đầu giúp chương trình không trỏ vào vùng rác. Tránh giải tham chiếu con trỏ chưa khởi tạo hoặc đã bị đặt về rỗng ở bất kỳ nhánh điều kiện nào. Với những con trỏ chỉ phục vụ đọc dữ liệu lớn mà không sửa, hãy gắn thêm từ khoá chỉ đọc để khoá khả năng ghi nhầm.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 12 + 8 == 20
  steps:
  - show: <ol><li>Cho <code>int a = 12; int *p = &amp;a; *p = *p + 8;</code> — sau ba lệnh, <code>a</code> bằng bao nhiêu?</li><li>Viết lệnh kiểm tra an toàn bắt buộc trước khi ghi vào <code>*out</code> trong hàm?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, biến a giữ mười hai, con trỏ p trỏ tới a, rồi tăng giá trị tại ô nhớ đích thêm tám đơn vị thì a bằng bao nhiêu? Câu hai, viết điều kiện kiểm tra bắt buộc trước khi ghi vào giá trị tại con trỏ đầu ra. Dừng vi-đê-ô và trả lời. Đây là hai câu hỏi cốt lõi kiểm tra khả năng phân biệt giá trị và địa chỉ vùng nhớ khi truyền vào hàm.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>*p</code> sửa trực tiếp ô nhớ của <code>a</code> nên $a = 12 + 8 = \hl{20}$.</p></td></tr></table>
    say: 'Đáp án câu một: ghi qua con trỏ làm biến a tăng từ mười hai lên hai mươi. Nhờ truyền thẳng địa chỉ vùng nhớ, hàm con có thể cập nhật đồng thời nhiều biến kết quả cho nơi gọi một cách tường minh. Mọi lệnh đọc và ghi qua dấu sao giải tham chiếu đều đọc trực tiếp từ ô nhớ mà con trỏ đang nắm giữ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Luôn kiểm <code>if (out != NULL)</code> trước khi gán <code>*out = ...</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: luôn kiểm tra con trỏ khác rỗng trước khi giải tham chiếu. Phép kiểm tra khác rỗng trước mọi lần giải tham chiếu giúp chương trình tránh được lỗi sập truy cập vùng nhớ trái phép ngay lúc chạy. Rèn thói quen viết câu điều kiện chặn rỗng ngay dòng đầu thân hàm biến mọi hàm nhận con trỏ trở nên an toàn tuyệt đối.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L04
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L04:</b> đọc <code>x y num den</code> từ <code>stdin</code>, cài <code>swap_ptr</code> (kiểm <code>NULL</code>) và <code>divmod_i</code> (in <code>ERR_ZERO</code> khi <code>den == 0</code>), in 2 dòng <code>swap: x=.. y=..</code> và <code>divmod: ..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>17 85 53 7</code> | Chấm: <code>bash labs/cham.sh CPR L04 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L04/de.md</code>)</p></div>'
    say: Hãy mở đề bài L04 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Chú ý xử lý đủ cả trường hợp chia cho không và giữ nguyên cấu trúc khoá kết quả trong luồng xuất mẫu.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: '<p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L04/du_lieu.txt</code></b></p><div class="code"><div>swap: x=85 y=17</div><div>divmod: q=7 r=4</div></div>'
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L04 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Kiểm chứng đầu ra đúng ở cả phần hoán đổi hai số lẫn phần tách thương và dư thông qua các tham số con trỏ.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: '<div class=''box ok''><p><b>Gợi ý nếu kẹt ở bài L04:</b> (1) luôn kiểm tra con trỏ khác NULL trong swap_ptr và divmod_i; (2) in divmod: ERR_ZERO khi mẫu số bằng 0; (3) không hardcode x, y tĩnh.</p></div><p class="note"><b>Gợi ý đọc <code>stdin</code>:</b> dùng toán tử lấy địa chỉ <code>&amp;</code> vừa học với <code>scanf("%d %d %d %d", &amp;x, &amp;y, &amp;num, &amp;den) != 4</code> để kiểm tra đọc đủ 4 số nguyên.</p>'
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Đảm bảo các nhánh báo lỗi trả mã riêng trước khi ghi vào bất kỳ con trỏ đầu ra nào truyền từ bên ngoài.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>&amp;x lấy địa chỉ</span><span class='a'>→</span><span class='n'>p giữ địa chỉ</span><span class='a'>→</span><span class='n'>kiểm p != NULL rồi mới dùng *p</span></div>
    say: Tổng kết chuỗi tư duy hôm nay để dùng suốt khoá học. Dùng toán tử lấy địa chỉ đưa vào con trỏ lưu vị trí, luôn kiểm tra khác rỗng trước khi ghi, và không bao giờ trả về địa chỉ biến cục bộ. Phép kiểm khác rỗng kết hợp địa chỉ biến là nền tảng cho mọi cấu trúc dữ liệu bằng con trỏ.
    clear: true
  - show: ''
    say: Con trỏ là công cụ mạnh mẽ nhất của C, nối liền khả năng chia sẻ bộ nhớ với kỷ luật kiểm tra rỗng nghiêm ngặt. Sẵn sàng địa chỉ biến giúp bạn khám phá quy luật dịch chuyển bước nhảy qua các phần tử mảng liên tiếp. Kết hợp toán tử lấy địa chỉ và phép kiểm tra rỗng tạo thành nền tảng an toàn cho mọi thao tác truyền tham biến trong C.
  - show: <div class='box ok'><b>Bài sau (bài 5):</b> Con trỏ, mảng và số học bước nhảy con trỏ</div>
    say: Bài tiếp theo là bài 5, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Khi đã hiểu chắc cách đọc ghi gián tiếp qua con trỏ đơn lẻ, bạn sẵn sàng thao tác trên vùng nhớ mảng liên tiếp bằng số học con trỏ. Ở bài tiếp theo ta kết hợp con trỏ với mảng để giải thích vì sao phép cộng một con trỏ lại nhảy đúng theo cỡ phần tử.
    clear: true
    forward_ref: true
