scenes:
- id: hook
  kind: hook
  title: Đảo thứ tự hai dòng khai báo trường mà giảm được 33% RAM?
  checks:
  - alg.cpr_struct_size([(1, 1), (4, 4), (1, 1)]) == (12, 6)
  - alg.cpr_struct_size([(4, 4), (1, 1), (1, 1)]) == (8, 2)
  steps:
  - show: <div class='box key'><p>Một cấu trúc chứa 1 <code>char</code> (1B), 1 <code>int</code> (4B), 1 <code>char</code> (1B) tưởng chỉ tốn <b>6 byte</b>, nhưng máy tính cấp tới <b>12 byte</b>.</p><p>Chỉ cần xếp lại thứ tự trường từ lớn tới nhỏ, kích thước tụt xuống <b>8 byte</b> — giảm ngay <b>33,3%</b> bộ nhớ cho hàng triệu bản ghi.</p></div>
    say: Chào bạn, nếu bạn gộp hai ký tự một bai với một số nguyên bốn bai vào cùng một cấu trúc, tổng kích thước thường không phải sáu bai mà nhảy lên mười hai bai. Hôm nay ta tìm hiểu vì sao phần cứng tự động chèn các ô đệm trống giữa các trường dữ liệu. Chỉ cần sắp lại thứ tự trường là giảm được ba mươi ba phần trăm bộ nhớ trước khi nối các nút thành danh sách liên kết sạch rò rỉ. Sắp xếp trường dữ liệu tuỳ tiện tưởng như vô hại lại âm thầm làm phình to kích thước từng bản ghi lên gấp rưỡi. Biết cách sắp xếp lại thứ tự khai báo trường giúp bạn thu gọn bản ghi và ghép nối các nút thành danh sách liên kết sạch sẽ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>vai trò ở bài này</th></tr><tr><td>Kích thước 1, 4, 8 byte (L00)</td><td>Ngưỡng chia hết tự nhiên bằng kích thước mỗi trường cơ bản</td></tr><tr><td>Cấp phát động và giải phóng sạch (L06)</td><td>Tạo từng nút danh sách trên vùng nhớ mở và thu hồi theo chuỗi</td></tr></table>
    say: Bài hôm nay kết hợp trực tiếp hai nền tảng từ bài 0 và bài 6. Từ bài 0 ta biết độ rộng chuẩn của từng trường ký tự và số nguyên. Từ bài 6 ta dùng vùng nhớ mở để tạo từng nút dữ liệu và giải phóng sạch khi không dùng nữa. Bộ xử lý đọc hiệu quả nhất khi biến bốn bai nằm ở địa chỉ chia hết cho bốn và biến tám bai nằm ở địa chỉ chia hết cho tám. Chính yêu cầu tốc độ phần cứng buộc trình biên dịch phải tự động chèn thêm các bai đệm trống xen giữa các trường lệch lề.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>ký hiệu mới</th><th>ý nghĩa</th></tr><tr><td><code>struct Node { ... };</code></td><td>Định nghĩa kiểu bản ghi gộp nhiều trường nằm liền kề theo thứ tự khai báo</td></tr><tr><td><code>p-&gt;next</code></td><td>Truy cập trường của cấu trúc thông qua con trỏ (viết gọn của <code>(*p).next</code>)</td></tr><tr><td>Căn lề / byte đệm (padding)</td><td>Byte trống do trình biên dịch chèn để địa chỉ mỗi trường chia hết cho kích thước nó</td></tr></table>
    say: Trên bảng là ba quy ước mới về cấu trúc dữ liệu. Từ khoá định nghĩa cấu trúc cho phép gộp nhiều trường và truy cập qua mũi tên con trỏ. Cuối cùng là khái niệm căn lề chèn bai đệm để bộ xử lý đọc nhanh. Toán tử mũi tên vừa giải tham chiếu con trỏ cấu trúc vừa truy xuất nhanh tên trường chỉ trong một biểu thức gọn gàng. Nút danh sách tự trỏ liên kết linh hoạt nhiều phần tử rời rạc mà không cần biết trước tổng số lượng phần tử.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
    introduces:
    - cpr_padding
- id: intuition
  kind: intuition
  title: So sánh bố cục bộ nhớ trước và sau khi sắp trường lớn đứng trước
  steps:
  - show: '<div><svg width="960" height="215" viewBox="0 0 960 215"><rect x="35" y="30" width="880" height="68" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="475.0" y="60" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Thứ tự XẤU (12 byte): [char a: 1B] [3B ĐỆM] [int b: 4B] [char c: 1B] [3B ĐỆM đuôi]</text><text x="475.0" y="80" font-size="15" text-anchor="middle" fill="#475569">Lãng phí tới 6 byte đệm (50%)</text><rect x="35" y="120" width="600" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="335.0" y="150" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Thứ tự TỐT (8 byte): [int b: 4B] [char a: 1B] [char c: 1B] [2B ĐỆM đuôi]</text><text x="335.0" y="170" font-size="15" text-anchor="middle" fill="#475569">Giảm 4 byte = tiết kiệm 33,3%</text></svg></div>'
    say: So sánh hai hàng trên sơ đồ bố cục bộ nhớ. Khi đặt trường nhỏ xen giữa trường lớn, trình biên dịch phải chèn sáu bai đệm làm tổng kích thước tăng lên mười hai bai. Ngược lại khi đặt trường bốn bai lên đầu tiên, hai ký tự đứng kề nhau ngay phía sau chỉ cần chèn thêm hai bai đệm ở đuôi nên tổng kích thước thu gọn chỉ còn tám bai.
    clear: true
  - show: ''
    say: Khi đặt liền các trường nhỏ cạnh nhau, bộ vi xử lý đọc trọn cấu trúc nhanh hơn và tiết kiệm bộ nhớ đáng kể. Đặt trường có kích thước lớn nhất lên đầu rồi giảm dần xuống cuối tự nhiên lấp kín khoảng hở, xóa sạch bai đệm thừa. Tiết kiệm bốn bai trên một nút gần như vô hình ở danh sách vài phần tử nhưng tạo khác biệt rất lớn khi lưu hàng triệu nút.
- id: formula
  kind: formula
  title: Hai quy tắc tính kích thước struct có padding
  checks:
  - alg.cpr_struct_size([(1, 1), (4, 4), (1, 1)]) == (12, 6)
  - alg.cpr_struct_size([(4, 4), (1, 1), (1, 1)]) == (8, 2)
  steps:
  - show: '<div class=''box key''><ol><li>Mỗi trường có mức căn lề A phải bắt đầu tại độ lệch chia hết cho A.</li><li>Tổng kích thước của toàn <code>struct</code> phải chia hết cho mức căn lề lớn nhất trong các trường.</li></ol><p>Mẹo thực hành: luôn khai báo trường theo thứ tự giảm dần căn lề (8 → 4 → 2 → 1 byte).</p></div>'
    say: Quy tắc tính kích thước cấu trúc gồm hai bước rất nhất quán theo phần cứng. Thứ nhất là vị trí bắt đầu mỗi trường luôn phải chia hết cho mức căn lề của trường đó. Thứ hai là tổng kích thước cuối cùng phải làm tròn theo bội số của trường có mức căn lề lớn nhất. Quy tắc bội số chung áp dụng cho cả độ lệch từng trường bên trong lẫn bội số kích thước tổng của cả cấu trúc khi xếp thành mảng. Cộng dồn kích thước từng trường cộng với khoảng trống căn lề cho ra đúng con số tổng của toán tử đo kích thước.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: đo sizeof hai kiểu struct và danh sách liên kết'
  checks:
  - 10 + 20 + 30 == 60
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>typedef struct Node { int val; struct Node *next; } Node;</code></td><td>Đặt tên gọn <code>Node</code> cho nút chứa con trỏ tự trỏ tới nút tiếp theo</td></tr><tr><td><code>while (h)</code></td><td>Viết gọn của <code>while (h != NULL)</code>: lặp tới khi hết danh sách</td></tr><tr><td><code>#include &lt;stddef.h&gt;</code> / <code>offsetof(S, field)</code></td><td>Macro chuẩn trả về độ lệch theo byte của trường bên trong <code>struct</code></td></tr><tr><td><code>struct Bad / struct Good</code></td><td>Hai cấu trúc cùng 3 trường nhưng khác thứ tự khai báo</td></tr></table>'
    say: Ta giải mã đủ bốn quy ước dùng trong cấu trúc và danh sách liên kết. Từ khoá định nghĩa nút cho phép tự trỏ sang nút kế tiếp, còn vòng lặp điều kiện dừng khi chạm rỗng. Chỉ thị đo độ lệch từ thư viện chuẩn tính chính xác vị trí bai của từng trường. Khai báo cấu trúc tự trỏ dùng tên chính cấu trúc đó cho con trỏ liên kết vì tên rút gọn mới có hiệu lực ở dấu chấm phẩy cuối.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Đo thật sizeof và chạy danh sách liên kết 3 nút giải phóng sạch</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdlib.h&gt;</div><div>struct Bad { char a; int b; char c; };</div><div>struct Good { int b; char a, c; };</div><div>typedef struct Node { int v; struct Node *next; } Node;</div><div>int main(void) {</div><div>    printf("bad=%zu good=%zu\n", sizeof(struct Bad), sizeof(struct Good));</div><div>    Node *h = NULL;</div><div>    for (int v = 10; v &lt;= 30; v += 10) {</div><div>        Node *n = malloc(sizeof(Node)); if (!n) return 1;</div><div>        n-&gt;v = v; n-&gt;next = h; h = n; }</div><div>    int s = 0, fr = 0;</div><div>    for (Node *c = h; c; c = c-&gt;next) s += c-&gt;v;</div><div>    while (h) { Node *nx = h-&gt;next; free(h); h = nx; fr++; }</div><div>    printf("sum=%d freed=%d\n", s, fr); return 0; }</div></div>
    say: Chương trình đo kích thước thật của cấu trúc đặt trường xấu và cấu trúc đã sắp xếp lại từ lớn đến nhỏ. Phần sau tạo ba nút trên vùng nhớ mở, nối thành danh sách liên kết, cộng tổng giá trị rồi giải phóng sạch từ đầu tới cuối. Thử nghiệm đối chiếu song song hai phiên bản cấu trúc chứng minh ngay hiệu quả giảm dung lượng nhờ đổi lại thứ tự dòng khai báo.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>bad=12 good=8</div><div>sum=60 freed=3</div></div>
    say: 'Đầu ra chạy thật khớp lý thuyết: cấu trúc xếp xấu tốn mười hai bai, cấu trúc xếp tốt chỉ còn tám bai. Ba nút mang giá trị mười, hai mươi, ba mươi cho tổng đúng sáu mươi và không để lại rò rỉ bộ nhớ. Ba nút danh sách được duyệt tính tổng rồi giải phóng trọn vẹn ba nút chứng tỏ không rò rỉ bất kỳ mảnh vùng nhớ nào.'
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng độ lệch thật của từng trường bằng offsetof
  checks:
  - (12 - 8) / 12 == 1 / 3
  steps:
  - show: <p><b>Đo vị trí từng trường trong struct Bad</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stddef.h&gt;</div><div>struct Bad { char a; int b; char c; };</div><div>int main(void) {</div><div>    printf("off_a=%zu off_b=%zu off_c=%zu\n",</div><div>           offsetof(struct Bad, a),</div><div>           offsetof(struct Bad, b),</div><div>           offsetof(struct Bad, c));</div><div>    return 0;</div><div>}</div></div>
    say: Ta dùng chỉ thị đo độ lệch trường trong chuẩn ngôn ngữ C để soi thẳng chỗ chèn bai đệm. Trường đầu đứng tại độ lệch không, trường số nguyên bị đẩy sang độ lệch bốn do phải chèn ba bai đệm trống. Cuối cùng trường ký tự nằm tại tám cộng một bằng chín, làm tròn theo bội số bốn thành tổng kích thước mười hai bai. Quan sát trực tiếp vị trí bai của từng trường giúp nhìn tận mắt khoảng đệm trống ba bai kẹp giữa ký tự và số nguyên.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>off_a=0 off_b=4 off_c=8</div></div>
    say: Kết quả chạy thật in ra đúng ba độ lệch không, bốn và tám bai vì có ba bai đệm trống nằm kẹp giữa trường đầu và trường thứ hai. Số liệu độ lệch từng trường từ trình biên dịch giải thích tường minh từng bai đệm bị chèn vào giữa giúp bạn tự tin tối ưu lại bố cục mọi cấu trúc dữ liệu lớn. Dãy vị trí không bốn tám khẳng định trường ký tự thứ hai vẫn kéo theo ba bai đệm đuôi làm tổng kích thước lên mười hai bai.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: tiết kiệm RAM khi sắp trường cho 1 000 000 bản ghi'
  checks:
  - 1_000_000 * 12 - 1_000_000 * 8 == 4_000_000
  steps:
  - show: <table class='t'><tr><th>số bản ghi</th><th>struct Xấu (12 byte)</th><th>struct Tốt (8 byte)</th><th>lượng RAM tiết kiệm</th></tr><tr><td><span style='white-space:nowrap'>1 000 (×1)</span></td><td>12 KB</td><td>8 KB</td><td>4 KB (33,3%)</td></tr><tr><td><span style='white-space:nowrap'>100 000 (×100)</span></td><td>1,2 MB</td><td>0,8 MB</td><td>0,4 MB (33,3%)</td></tr><tr><td><span style='white-space:nowrap'>1 000 000 (×1 000)</span></td><td>12 MB</td><td>8 MB</td><td>4 MB tiết kiệm miễn phí</td></tr></table>
    say: Với một trăm nghìn bản ghi đã tiết kiệm ngay không phẩy bốn mê-ga-bai RAM hoàn toàn miễn phí. Lên tới một triệu bản ghi trong bộ nhớ, chỉ cần đổi chỗ một dòng khai báo đã tiết kiệm ngay bốn mê-ga-bai RAM mà không mất một bít dữ liệu nào. Tối ưu bố cục cấu trúc còn tăng số lượng bản ghi lọt vào cùng một dòng bộ đệm vi xử lý, cải thiện rõ rệt tốc độ duyệt mảng.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1: Giải phóng nút hiện tại rồi mới đọc <code>head->next</code>.</b> Phải lưu <code>nx = head->next</code> trước khi gọi <code>free(head)</code>!<br><b>Lỗi 2: Dùng <code>memcmp</code> so sánh hai <code>struct</code> có padding.</b> Các byte đệm có thể chứa giá trị rác khác nhau dù mọi trường bằng nhau.<br><b>Lỗi 3: Cộng tay kích thước từng trường thay vì dùng <code>sizeof(struct S)</code>.</b> Dễ thiếu hẳn phần byte đệm.</div></td></tr></table>'
    say: Có ba lỗi kinh điển khi dùng cấu trúc và danh sách liên kết. Lỗi nặng nhất là đọc con trỏ kế tiếp sau khi đã giải phóng nút. Hai lỗi kia là so sánh từng bai chứa đệm rác và tự cộng kích thước trường. Việc tính sẵn mức căn lề từng trường giúp bạn phát hiện sớm phần bộ nhớ bị lãng phí.
    clear: true
  - show: ''
    say: Do bai đệm chứa giá trị rác ngẫu nhiên, tuyệt đối không dùng phép so sánh từng bai thô để kiểm tra hai cấu trúc có bằng nhau không. Khi xoá toàn bộ danh sách liên kết, lưu con trỏ kế trước khi giải phóng là quy tắc an toàn duy nhất tránh lỗi đọc nhớ đã trả.
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.cpr_struct_size([(1, 1), (8, 8)]) == (16, 7)
  steps:
  - show: <ol><li>Cấu trúc gồm <code>char a; long long b;</code> (1 byte và 8 byte) có kích thước <code>sizeof</code> bằng bao nhiêu byte?</li><li>Khi duyệt vòng lặp để giải phóng danh sách liên kết, ta phải làm thao tác gì TRƯỚC khi gọi <code>free(cur)</code>?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, cấu trúc gồm một ký tự một bai theo sau là một số tám bai chiếm tổng cộng bao nhiêu bai kể cả căn lề? Câu hai, phải lưu gì trước khi giải phóng nút hiện tại trong danh sách liên kết? Dừng vi-đê-ô và trả lời. Hãy nhẩm tính độ lệch từng trường theo mức căn lề phần cứng trước khi xem đáp án chi tiết bên dưới.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Trường <code>b</code> căn lề 8 nên bắt đầu tại offset 8 (chèn 7 byte đệm) → tổng $\hl{16}$ byte.</p></td></tr></table>
    say: 'Đáp án câu một: chèn bảy bai đệm sau ký tự đầu để số tám bai nằm tại vị trí tám, tổng là mười sáu bai. Chỉ cần sắp xếp các trường có mức căn lề lớn lên đầu là bạn tiết kiệm đáng kể bộ nhớ đệm cho hàng triệu đối tượng cùng lúc. Áp dụng quy tắc chia hết cho mức căn lề lớn nhất giải thích nhanh vì sao tổng kích thước phải tròn mười sáu thay vì chín bai.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Lưu con trỏ nút kế tiếp (<code>Node *nx = cur-&gt;next;</code>) trước khi gọi <code>free(cur)</code> để tránh đọc vào vùng nhớ vừa trả.</p></td></tr></table>
    say: 'Đáp án câu hai: luôn cất địa chỉ nút kế tiếp sang biến tạm trước khi giải phóng nút đang giữ. Khi duyệt giải phóng danh sách liên kết, luôn lưu lại địa chỉ nút kế tiếp vào biến tạm trước khi giải phóng nút hiện tại. Thứ tự hai câu lệnh lưu biến tạm trước và giải phóng sau giữ trọn mạch liên kết xuyên suốt tới phần tử rỗng cuối danh sách.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L07
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L07:</b> cài <code>S1 {char a; int b; char c;}</code> và <code>S2 {int b; char a; char c;}</code>, đọc <code>n</code> và <code>n</code> số dựng danh sách liên kết, cộng và giải phóng từng nút để in <code>s1=.. s2=..</code>, <code>list_sum=.. freed=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>5 10 20 30 40 50</code> | Chấm: <code>bash labs/cham.sh CPR L07 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L07/de.md</code>)</p></div>'
    say: Hãy mở đề bài L07 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Chú ý khai báo hai mẫu cấu trúc khớp đúng thứ tự các trường như yêu cầu để kết quả đo kích thước hoàn toàn trùng khớp.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L07/du_lieu.txt</code></b></p><div class="code"><div>s1=12 s2=8</div><div>list_sum=150 freed=5</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L07 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Bảo đảm vòng lặp cấp phát và thu hồi danh sách liên kết xử lý sạch sẽ ngay cả khi số phần tử đầu vào bằng không.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L07:</b> (1) đặt struct S1/S2 đúng thứ tự trường theo đề; (2) xử lý sạch trường hợp n = 0; (3) lưu next trước khi gọi free từng nút.</p></div>
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Rà lại lệnh gán con trỏ đuôi bằng rỗng ở nút cuối danh sách nhằm giúp điều kiện dừng vòng lặp hoạt động chính xác.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>Xếp trường lớn → nhỏ</span><span class='a'>→</span><span class='n'>Lưu next trước khi free</span><span class='a'>→</span><span class='n'>Không đọc padding</span></div>
    say: Ghi nhớ chuỗi quy tắc làm việc với cấu trúc dữ liệu. Luôn xếp trường từ lớn xuống nhỏ để giảm bai đệm, lưu con trỏ kế trước lúc giải phóng nút, và không so sánh từng bai chứa đệm rác. Sắp xếp gọn trường cấu trúc và giải phóng đủ từng nút là chìa khoá tối ưu RAM thực tế. Xếp trường lớn trước trường nhỏ tối ưu tự nhiên mật độ bộ nhớ, đồng thời kết hợp con trỏ kế tạm giữ sạch vòng đời danh sách động. Sắp xếp gọn cấu trúc không chỉ tiết kiệm bộ nhớ trong chương trình mà còn chuẩn bị cho bước lưu xuống tệp nhị phân chuẩn xác.
    clear: true
  - show: <div class='box ok'><b>Bài sau (bài 8):</b> Tệp nhị phân, phép toán bit và tách trường đóng gói</div>
    say: Bài tiếp theo là bài 8, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Tối ưu xong bố cục cấu trúc trên bộ nhớ, bước kế tiếp là đóng gói gọn từng bít để lưu trực tiếp xuống tệp nhị phân tốc độ cao. Thực hành nhiều lần cách tính căn lề và duyệt giải phóng nút sẽ giúp bạn tự tin thiết kế mọi cấu trúc bộ nhớ hiệu năng cao. Bài tiếp theo hướng dẫn ghi đọc thẳng từng khối cấu trúc nhị phân xuống đĩa và gói trường dữ liệu bằng phép toán bít.
    clear: true
    forward_ref: true
