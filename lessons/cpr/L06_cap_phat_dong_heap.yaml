scenes:
- id: hook
  kind: hook
  title: Quên trả lại 1 KB mỗi vòng lặp, bao lâu thì máy chủ hết RAM?
  checks:
  - 1000 * 1024 == 1_024_000
  - 1_000_000 * 1024 == 1_024_000_000
  steps:
  - show: <div class='box key'><p>Ở bài 2, ta thấy mảng 10 triệu số nguyên làm sập ngăn xếp. Giải pháp của C là xin vùng nhớ trên <b>vùng nhớ mở (Heap)</b> với dung lượng lớn và vòng đời tự kiểm soát.</p><p>Nhưng nếu mỗi yêu cầu xin <b>1 024 byte</b> rồi quên trả lại, sau <b>1 000 000</b> yêu cầu, dịch vụ âm thầm rò rỉ mất <b>~1 GB RAM</b>.</p></div>
    say: Chào bạn, ở bài 2 ta thấy ngăn xếp không chứa được mảng hàng chục mê-ga-bai. Hôm nay ta học cách xin bộ nhớ trên vùng nhớ mở với vòng đời do chính bạn quyết định. Tuy nhiên quyền tự do này cũng đi kèm trách nhiệm kỷ luật rất cao. Nếu quên trả lại dù chỉ một ki-lô-bai mỗi vòng lặp, dịch vụ chạy lâu dài sẽ rò rỉ hàng gi-ga-bai bộ nhớ và đột ngột ngừng hoạt động. Khi kích thước dữ liệu chỉ lộ diện lúc chương trình đọc tệp, mảng cố định trên ngăn xếp lập tức trở nên bất lực. Vùng nhớ mở trao quyền kiểm soát trọn vẹn thời gian sống và dung lượng khối nhớ cho người lập trình quản lý trực tiếp.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>áp dụng vào Heap</th></tr><tr><td>Biến cục bộ mất ngay khi hàm return (L02)</td><td>Vùng nhớ động vẫn sống qua mọi lời gọi hàm tới khi được trả lại</td></tr><tr><td>Kiểm tra NULL trước khi giải tham chiếu (L04)</td><td>Hàm xin bộ nhớ trả về NULL nếu hệ thống hết RAM</td></tr></table>
    say: Ta ghép kiến thức từ bài 2 và bài 4 để thiết kế vùng nhớ động an toàn. Khác với biến cục bộ mất ngay lúc hàm kết thúc, khối nhớ vùng mở tồn tại bền bỉ cho tới khi bạn gọi lệnh trả về. Tuy nhiên khi xin cấp phát luôn phải kiểm tra khác rỗng phòng khi hệ thống hết RAM. Khối cấp phát trên vùng nhớ mở vẫn nguyên vẹn sau khi hàm tạo kết thúc cho tới tận lúc bạn chủ động gọi giải phóng. Chính sự tự do tuổi thọ này đòi hỏi kỷ luật đối xứng một lần xin bắt buộc đi kèm đúng một lần giải phóng dọn sạch.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>hàm chuẩn &lt;stdlib.h&gt;</th><th>tác dụng</th></tr><tr><td><code>malloc(bytes)</code></td><td>Xin <code>bytes</code> byte vùng nhớ mở, nội dung ban đầu <b>rác chưa xoá</b></td></tr><tr><td><code>calloc(n, sz)</code></td><td>Xin <code>n × sz</code> byte và <b>gán toàn bộ bằng 0</b> (tự kiểm tràn nhân)</td></tr><tr><td><code>realloc(p, new_bytes)</code></td><td>Đổi kích thước vùng <code>p</code>; trả địa chỉ mới hoặc <code>NULL</code> nếu thất bại</td></tr><tr><td><code>free(p)</code></td><td>Trả vùng nhớ về hệ thống; đặt ngay <code>p = NULL</code> sau đó</td></tr></table>
    say: Thư viện chuẩn cung cấp bốn hàm quản lý vùng nhớ động. Hai hàm xin cấp phát gồm hàm giữ nguyên rác cũ và hàm xoá sạch về không. Hai hàm còn lại dùng để đổi kích thước vùng đang chạy và giải phóng trả lại hệ thống. Hàm cấp phát xoá trắng mọi bít về không mất thêm chút thời gian khởi tạo nhưng chặn đứng nguy cơ đọc nhầm giá trị cũ. Chức năng mở rộng vùng nhớ có thể tự dời toàn bộ dữ liệu sang khối mới rộng hơn nếu phía sau vùng cũ đã hết chỗ trống.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
    introduces:
    - cpr_cap_phat_dong
- id: intuition
  kind: intuition
  title: 'Vòng đời khối vùng nhớ động: Xin → Kiểm → Dùng → Trả'
  steps:
  - show: <div><svg width="960" height="200" viewBox="0 0 960 200"><rect x="25" y="50" width="200" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="125.0" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">1. calloc(n, sz)</text><text x="125.0" y="120" font-size="15" text-anchor="middle" fill="#475569">Xin khối trên vùng nhớ mở</text><line x1="225" y1="97" x2="290" y2="97" stroke="#475569" stroke-width="2"/><polygon points="290,97 282.0,102.0 282.0,92.0" fill="#475569"/><rect x="290" y="50" width="185" height="95" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="382.5" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">2. if (!p)</text><text x="382.5" y="120" font-size="15" text-anchor="middle" fill="#475569">Kiểm khác NULL</text><line x1="475" y1="97" x2="535" y2="97" stroke="#475569" stroke-width="2"/><polygon points="535,97 527.0,102.0 527.0,92.0" fill="#475569"/><rect x="535" y="50" width="180" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="625.0" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">3. Đọc / Ghi</text><text x="625.0" y="120" font-size="15" text-anchor="middle" fill="#475569">Đúng biên 0..n-1</text><line x1="715" y1="97" x2="770" y2="97" stroke="#475569" stroke-width="2"/><polygon points="770,97 762.0,102.0 762.0,92.0" fill="#475569"/><rect x="770" y="50" width="170" height="95" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="855.0" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">4. free(p); p=NULL</text><text x="855.0" y="120" font-size="15" text-anchor="middle" fill="#475569">Trả sạch, chống treo</text></svg></div>
    say: Mọi khối nhớ động tốt đều phải đi trọn vòng đời bốn bước khép kín như trên sơ đồ. Đầu tiên ta xin cấp phát một địa chỉ từ vùng nhớ mở và lập tức kiểm tra địa chỉ khác rỗng. Sau khi đọc ghi xong trong phạm vi được phép, ta giải phóng vùng nhớ rồi gán ngay con trỏ về rỗng.
    clear: true
  - show: ''
    say: Kiểm soát tốt địa chỉ trả về từ hệ điều hành giúp vùng nhớ động luôn an toàn qua nhiều lần mở rộng. Thực hiện đầy đủ bốn bước vòng đời tạo lá chắn vững chắc ngăn cả rò rỉ bộ nhớ lẫn lỗi đọc vùng nhớ đã giải phóng. Thói quen gán lại rỗng ngay sau khi trả về hệ điều hành biến mọi lỗi giải phóng kép sau đó thành thao tác vô hại.
- id: formula
  kind: formula
  title: Mẫu realloc an toàn không làm mất con trỏ gốc khi thiếu RAM
  checks:
  - 4 * 4 == 16
  - 4 * 8 == 32
  steps:
  - show: <div class='box key'><p>Không viết <code>p = realloc(p, new_sz);</code>! Nếu cấp mới thất bại trả về <code>NULL</code>, bạn mất luôn địa chỉ cũ để giải phóng.</p><p><b>Mẫu chuẩn:</b> <code>int *tmp = realloc(p, new_sz); if (tmp == NULL) { free(p); return 1; } p = tmp;</code></p></div>
    say: Quy tắc vàng khi mở rộng kích thước là luôn hứng kết quả qua một con trỏ tạm. Vì khi thay đổi kích thước thất bại hàm sẽ trả về con trỏ rỗng mà không hề động chạm vùng nhớ cũ. Nếu hứng thẳng vào biến con trỏ cũ bạn sẽ đánh mất địa chỉ gốc mãi mãi. Nhờ giữ qua con trỏ tạm, ta dọn sạch được khối cũ rồi mới thoát lỗi an toàn. Mẫu gán qua con trỏ tạm giữ nguyên địa chỉ khối cũ quý giá ngay cả trong tình huống hệ thống từ chối mở rộng thêm RAM. Nếu mở rộng thất bại và trả về rỗng, khối nhớ cũ giữ qua con trỏ ban đầu vẫn hoàn toàn nguyên vẹn để giải phóng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: cấp bằng calloc, mở rộng bằng realloc và đếm cân bằng'
  checks:
  - sum((i + 1) * 10 for i in range(6)) == 210
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;stdlib.h&gt;</code></td><td>Khai báo <code>malloc</code>, <code>calloc</code>, <code>realloc</code>, <code>free</code></td></tr><tr><td><code>if (!p)</code> / <code>if (!tmp)</code></td><td>Dấu <code>!</code> phủ định: viết gọn của <code>p == NULL</code> khi cấp phát thất bại</td></tr><tr><td><code>int *tmp = realloc(a, 6 * sizeof(int));</code></td><td>Mở rộng từ 4 lên 6 phần tử bằng biến tạm để giữ nguyên con trỏ cũ</td></tr><tr><td><code>free(a); a = NULL;</code></td><td>Giải phóng và xoá ngay địa chỉ khỏi con trỏ để tránh lỗi dùng sau giải phóng</td></tr></table>'
    say: Trước khi chạy mã, ta giải mã đủ bốn quy ước cấp phát động chuẩn. Thư viện chuẩn cung cấp hàm xin, xoá và mở rộng vùng nhớ. Cách viết rút gọn dấu chấm than kiểm tra ngay xem cấp phát có rỗng hay không. Giải phóng đi kèm gán rỗng khoá chặt lỗi dùng trỏ treo. Việc luôn kiểm tra rỗng sau mọi lệnh xin bộ nhớ giữ cho ứng dụng thất bại có kiểm soát thay vì sập đột ngột thiếu thông tin.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    clear: true
  - show: <p><b>Cấp phát 4 int, mở rộng lên 6 int, tính tổng và trả sạch</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdlib.h&gt;</div><div>int main(void) {</div><div>    int *a = calloc(4, sizeof(int));</div><div>    if (!a) return 1;</div><div>    for (int i = 0; i &lt; 4; i++) a[i] = (i + 1) * 10;</div><div>    int *tmp = realloc(a, 6 * sizeof(int));</div><div>    if (!tmp) { free(a); return 1; }</div><div>    a = tmp; a[4] = 50; a[5] = 60;</div><div>    int s = 0; for (int i = 0; i &lt; 6; i++) s += a[i];</div><div>    printf("n=6 sum=%d last=%d\n", s, a[5]);</div><div>    free(a); a = NULL;</div><div>    printf("is_null=%d\n", a == NULL);</div><div>    return 0;</div><div>}</div></div>
    say: Đoạn mã dùng hàm cấp phát đã xoá sạch về không cho bốn số nguyên rồi gán giá trị mười đến bốn mươi. Tiếp theo chương trình gọi mở rộng lên sáu ô thông qua con trỏ tạm an toàn, gán tiếp hai ô cuối rồi tính tổng và giải phóng sạch. Quá trình nâng kích thước từ bốn lên sáu số nguyên kiểm nghiệm bảo toàn giá trị các phần tử đầu khi khối nhớ dời chỗ.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>n=6 sum=210 last=60</div><div>is_null=1</div></div>
    say: Kết quả chạy thật chứng minh bốn giá trị đầu được bảo toàn nguyên vẹn sau khi mở rộng lên sáu phần tử. Tổng toàn mảng thu được bằng hai trăm mười và toàn bộ bộ nhớ đã được giải phóng an toàn. Cờ kiểm tra rỗng bằng một ở dòng cuối chứng tỏ con trỏ sau thu hồi đã được vô hiệu hoá hoàn toàn không thể dùng nhầm.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: 'Kiểm cân bằng: đếm số lần cấp phát phải bằng số lần giải phóng'
  checks:
  - alg.cpr_heap_leak(5, 5) == 0
  steps:
  - show: <p><b>Mỗi vòng lặp ghép cặp 1 lần cấp với 1 lần trả → cân bằng = 0</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdlib.h&gt;</div><div>int main(void) {</div><div>    int allocs = 0, frees = 0;</div><div>    for (int i = 0; i &lt; 5; i++) {</div><div>        int *buf = malloc(1024);</div><div>        if (!buf) return 1;</div><div>        allocs++;</div><div>        buf[0] = i;</div><div>        free(buf); frees++;</div><div>    }</div><div>    printf("allocs=%d frees=%d leak=%d\n", allocs, frees, allocs - frees);</div><div>    return 0;</div><div>}</div></div>
    say: Ở phần kiểm chứng, ta mô phỏng một vòng lặp năm lượt có cấp phát và giải phóng vùng nhớ để kiểm tra tính cân bằng. Vì mỗi lần cấp phát thành công đều đi kèm đúng một lần giải phóng nên tổng số khối còn giữ lại luôn bằng không. Đếm cân bằng số lượt cấp phát và số lượt giải phóng là phương pháp kiểm chứng nhẹ nhàng phát hiện tức thì chỗ rò rỉ.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>allocs=5 frees=5 leak=0</div></div>
    say: Đầu ra thật ghi nhận năm lần cấp phát, năm lần giải phóng và độ chênh bằng không vì mọi khối đã được thu hồi đúng lúc. Việc kiểm tra đồng thời kích thước mở rộng mới và đặt con trỏ về rỗng sau giải phóng tạo nên chu trình cấp phát động khép kín không rò rỉ bộ nhớ. Kết quả độ chênh bằng không sau năm vòng lặp bảo đảm bộ nhớ tiêu thụ duy trì nằm ngang suốt thời gian vận hành dài.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: tốc độ rò rỉ RAM nếu quên giải phóng 1 KB mỗi lượt'
  checks:
  - alg.cpr_heap_leak(1000, 0) * 1024 == 1_024_000
  - 1_000_000 * 1024 == 1_024_000_000
  steps:
  - show: <table class='t'><tr><th>số lượt rò rỉ (mỗi lần 1 024 byte)</th><th>tổng bộ nhớ bị giữ lại</th><th>hệ quả</th></tr><tr><td><span style='white-space:nowrap'>1 000 lượt (×1)</span></td><td>1 024 000 byte (~1 MB)</td><td>Khó thấy bằng mắt thường khi thử nhỏ</td></tr><tr><td><span style='white-space:nowrap'>100 000 lượt (×100)</span></td><td>102 400 000 byte (~98 MB)</td><td>RAM dịch vụ tăng đều theo thời gian</td></tr><tr><td><span style='white-space:nowrap'>1 000 000 lượt (×1 000)</span></td><td>1 024 000 000 byte (~977 MB)</td><td>Nhân hệ điều hành ngắt dịch vụ vì cạn RAM</td></tr></table>
    say: Lỗi rò rỉ bộ nhớ thường lọt qua bài kiểm nhỏ một nghìn lần vì mới mất một mê-ga-bai. Nếu chỉ kiểm tra năm hoặc một trăm vòng lặp, lượng rò rỉ mới vài chục ki-lô-bai nên rất khó thấy. Lên tới một nghìn vòng đã mất một mê-ga-bai, và chạy một triệu lượt sẽ ngốn gần một gi-ga-bai khiến dịch vụ bị chấm dứt đột ngột. Những dịch vụ mạng chạy nhiều tháng liên tục có thể hết sạch bộ nhớ hệ thống chỉ từ một lỗi rò vài chục bai mỗi yêu cầu. Gắn bộ kiểm tra rò rỉ bộ nhớ tự động vào quy trình kiểm thử giúp bắt sớm mọi nhánh thoát quên trả vùng nhớ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - 0
    clear: true
- id: pitfalls
  kind: pitfall
  title: Bốn lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: <table class='t'><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class='box warn'><b>1. Quên free (rò rỉ):</b> cấp phát rồi thoát hàm sớm ở nhánh lỗi trước khi xuống tới lệnh giải phóng.<br><b>2. Dùng sau giải phóng (use-after-free):</b> đọc/ghi qua con trỏ cũ sau khi vùng nhớ đã trả về hệ thống.<br><b>3. Giải phóng hai lần (double free):</b> gọi giải phóng cùng một địa chỉ hai lượt làm hỏng bộ cấp phát.<br><b>4. Không kiểm NULL:</b> ghi thẳng vào kết quả cấp phát khi máy cạn RAM.</div></td></tr></table>
    say: Khi dùng vùng nhớ động có bốn lỗi rất dễ mắc. Đó là quên giải phóng ở nhánh thoát sớm và bỏ qua bước kiểm tra rỗng. Lỗi nặng hơn là dùng lại vùng nhớ đã trả hoặc giải phóng cùng địa chỉ hai lần. Khi quản lý hàng nghìn khối cấp phát, giữ kỷ luật giải phóng đúng thứ tự tránh nghẽn bộ nhớ. Cẩn thận tất cả các nhánh báo lỗi thoát sớm giữa thân hàm vì đó là nơi thường xuyên bỏ quên câu lệnh giải phóng vùng nhớ. Không bao giờ đọc lại bất kỳ trường dữ liệu nào từ con trỏ sau khi đã trả khối nhớ tương ứng về trình quản lý.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 250_000 * 4 == 1_000_000
  steps:
  - show: '<ol><li>Hàm nào tự khởi tạo mọi byte cấp phát về 0: <code>malloc</code> hay <code>calloc</code>?</li><li>Một hàm cấp 4 KB nhưng nhánh báo lỗi <code>return -1</code> quên gọi <code>free</code>; sau 250 000 lượt lỗi đó thì rò rỉ bao nhiêu MB (~1024 KB)?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, giữa hai hàm xin vùng nhớ thì hàm nào tự động đặt toàn bộ các bai về không? Câu hai, nếu mỗi lượt nhánh lỗi rò bốn ki-lô-bai thì sau hai trăm năm mươi nghìn lượt sẽ mất khoảng bao nhiêu mê-ga-bai? Dừng vi-đê-ô và trả lời. Trả lời chắc chắn hai câu này giúp bạn tránh những lỗi rò rỉ hoặc sử dụng vùng nhớ đã giải phóng.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>calloc</code> đặt toàn bộ vùng nhớ về 0 (khác với <code>malloc</code> giữ rác cũ).</p></td></tr></table>
    say: 'Đáp án câu một: dùng hàm cấp phát tự xoá sạch về không khi cần vùng đệm sạch ngay lập tức để tránh đọc nhầm rác cũ. Dùng con trỏ tạm giữ kết quả cấp phát mới bảo vệ bạn khỏi mất dấu địa chỉ vùng nhớ cũ nếu hệ điều hành từ chối mở rộng. Khởi tạo sạch về không giúp các con trỏ cấu trúc bên trong mảng mới mặc định ở trạng thái rỗng an toàn ngay từ đầu.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② 250 000 × 4 KB = 1 000 000 KB ≈ <b>976,6 MB</b> (gần 1 GB).</p></td></tr></table>
    say: 'Đáp án câu hai: hai trăm năm mươi nghìn nhân bốn ki-lô-bai bằng một triệu ki-lô-bai, xấp xỉ gần một gi-ga-bai. Đặt con trỏ về rỗng ngay sau khi giải phóng loại bỏ hoàn toàn nguy cơ vô tình giải phóng hai lần ở những nhánh xử lý phía sau. Hàng trăm nghìn yêu cầu lặp lại khuếch đại một lỗ hổng nhỏ không đáng kể thành thảm hoạ cạn RAM máy chủ.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L06
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L06:</b> đọc <code>n1</code>, <code>n1</code> số (<code>calloc</code>), rồi <code>n2</code> và mở rộng mảng bằng <code>realloc</code> qua con trỏ tạm để đọc tiếp <code>n2</code> số, tính tổng, <code>free(p); p = NULL;</code> và in <code>len=.. sum=..</code>, <code>freed=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>3 5 15 25 2 35 45</code> | Chấm: <code>bash labs/cham.sh CPR L06 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L06/de.md</code>)</p></div>'
    say: Hãy mở đề bài L06 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Chú ý xử lý chuẩn bước mở rộng qua biến tạm và kiểm tra chặt điều kiện rỗng ở từng thao tác cấp phát.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L06/du_lieu.txt</code></b></p><div class="code"><div>len=5 sum=125</div><div>freed=1</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L06 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Kiểm chứng đồng thời tổng giá trị bảo toàn sau mở rộng và trạng thái giải phóng sạch hoàn toàn của khối nhớ.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L06:</b> (1) kiểm tra con trỏ NULL sau calloc; (2) gán kết quả realloc vào con trỏ tạm trước khi cập nhật p; (3) giải phóng p và gán NULL.</p></div>
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Thử nghiệm tình huống phần mở rộng n2 bằng không hay giữ đúng cỡ cũ để bảo đảm hàm xử lý không kẹt.
