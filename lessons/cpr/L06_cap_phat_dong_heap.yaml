scenes:
- id: hook
  kind: hook
  title: Quên trả lại 1 KB mỗi vòng lặp, bao lâu thì máy chủ hết RAM?
  checks:
  - 1000 * 1024 == 1_024_000
  - 1_000_000 * 1024 == 1_024_000_000
  steps:
  - show: <div class='box key'><p>Ở bài 2, ta thấy mảng 10 triệu số nguyên làm sập ngăn xếp. Giải pháp của C là
      xin vùng nhớ trên <b>vùng nhớ mở (Heap)</b> với dung lượng lớn và vòng đời tự kiểm soát.</p><p>Nhưng nếu mỗi
      yêu cầu xin <b>1 024 byte</b> rồi quên trả lại, sau <b>1 000 000</b> yêu cầu, dịch vụ âm thầm rò rỉ mất <b>~1
      GB RAM</b>.</p></div>
    say: Chào bạn, ở bài 2 ta thấy ngăn xếp không chứa được mảng hàng chục mê-ga-bai. Hôm nay ta học cách xin bộ
      nhớ trên vùng nhớ mở với vòng đời do chính bạn quyết định. Tuy nhiên quyền tự do này cũng đi kèm trách nhiệm
      kỷ luật rất cao. Nếu quên trả lại dù chỉ một ki-lô-bai mỗi vòng lặp, dịch vụ chạy lâu dài sẽ rò rỉ hàng gi-ga-bai
      bộ nhớ và đột ngột ngừng hoạt động.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>áp dụng vào Heap</th></tr><tr><td>Biến cục bộ mất ngay
      khi hàm return (L02)</td><td>Vùng nhớ động vẫn sống qua mọi lời gọi hàm tới khi được trả lại</td></tr><tr><td>Kiểm
      tra NULL trước khi giải tham chiếu (L04)</td><td>Hàm xin bộ nhớ trả về NULL nếu hệ thống hết RAM</td></tr></table>
    say: Ta ghép kiến thức từ bài 2 và bài 4 để thiết kế vùng nhớ động an toàn. Khác với biến cục bộ mất ngay lúc
      hàm kết thúc, khối nhớ vùng mở tồn tại bền bỉ cho tới khi bạn gọi lệnh trả về. Tuy nhiên khi xin cấp phát
      luôn phải kiểm tra khác rỗng phòng khi hệ thống hết RAM.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>hàm chuẩn &lt;stdlib.h&gt;</th><th>tác dụng</th></tr><tr><td><code>malloc(bytes)</code></td><td>Xin
      <code>bytes</code> byte vùng nhớ mở, nội dung ban đầu <b>rác chưa xoá</b></td></tr><tr><td><code>calloc(n,
      sz)</code></td><td>Xin <code>n × sz</code> byte và <b>gán toàn bộ bằng 0</b> (tự kiểm tràn nhân)</td></tr><tr><td><code>realloc(p,
      new_bytes)</code></td><td>Đổi kích thước vùng <code>p</code>; trả địa chỉ mới hoặc <code>NULL</code> nếu thất
      bại</td></tr><tr><td><code>free(p)</code></td><td>Trả vùng nhớ về hệ thống; đặt ngay <code>p = NULL</code>
      sau đó</td></tr></table>
    say: Thư viện chuẩn cung cấp bốn hàm quản lý vùng nhớ động. Hai hàm xin cấp phát gồm hàm giữ nguyên rác cũ và
      hàm xoá sạch về không. Hai hàm còn lại dùng để đổi kích thước vùng đang chạy và giải phóng trả lại hệ thống.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    introduces:
    - cpr_cap_phat_dong
- id: intuition
  kind: intuition
  title: 'Vòng đời khối vùng nhớ động: Xin → Kiểm → Dùng → Trả'
  steps:
  - show: <div><svg width="960" height="200" viewBox="0 0 960 200"><rect x="25" y="50" width="200" height="95" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="125.0" y="92" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">1. calloc(n, sz)</text><text x="125.0" y="120" font-size="15" text-anchor="middle"
      fill="#475569">Xin khối trên vùng nhớ mở</text><line x1="225" y1="97" x2="290" y2="97" stroke="#475569" stroke-width="2"/><polygon
      points="290,97 282.0,102.0 282.0,92.0" fill="#475569"/><rect x="290" y="50" width="185" height="95" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="382.5" y="92" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">2. if (!p)</text><text x="382.5" y="120" font-size="15" text-anchor="middle"
      fill="#475569">Kiểm khác NULL</text><line x1="475" y1="97" x2="535" y2="97" stroke="#475569" stroke-width="2"/><polygon
      points="535,97 527.0,102.0 527.0,92.0" fill="#475569"/><rect x="535" y="50" width="180" height="95" rx="10"
      fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="625.0" y="92" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">3. Đọc / Ghi</text><text x="625.0" y="120" font-size="15" text-anchor="middle"
      fill="#475569">Đúng biên 0..n-1</text><line x1="715" y1="97" x2="770" y2="97" stroke="#475569" stroke-width="2"/><polygon
      points="770,97 762.0,102.0 762.0,92.0" fill="#475569"/><rect x="770" y="50" width="170" height="95" rx="10"
      fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="855.0" y="92" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">4. free(p); p=NULL</text><text x="855.0" y="120" font-size="15" text-anchor="middle"
      fill="#475569">Trả sạch, chống treo</text></svg></div>
    say: Mọi khối nhớ động tốt đều phải đi trọn vòng đời bốn bước khép kín như trên sơ đồ. Đầu tiên ta xin cấp phát
      một địa chỉ từ vùng nhớ mở và lập tức kiểm tra địa chỉ khác rỗng. Sau khi đọc ghi xong trong phạm vi được
      phép, ta giải phóng vùng nhớ rồi gán ngay con trỏ về rỗng.
    clear: true
- id: formula
  kind: formula
  title: Mẫu realloc an toàn không làm mất con trỏ gốc khi thiếu RAM
  checks:
  - 4 * 4 == 16
  - 4 * 8 == 32
  steps:
  - show: <div class='box key'><p>Không viết <code>p = realloc(p, new_sz);</code>! Nếu cấp mới thất bại trả về <code>NULL</code>,
      bạn mất luôn địa chỉ cũ để giải phóng.</p><p><b>Mẫu chuẩn:</b> <code>int *tmp = realloc(p, new_sz); if (tmp
      == NULL) { free(p); return 1; } p = tmp;</code></p></div>
    say: Quy tắc vàng khi mở rộng kích thước là luôn hứng kết quả qua một con trỏ tạm. Vì khi thay đổi kích thước
      thất bại hàm sẽ trả về con trỏ rỗng mà không hề động chạm vùng nhớ cũ. Nếu hứng thẳng vào biến con trỏ cũ
      bạn sẽ đánh mất địa chỉ gốc mãi mãi. Nhờ giữ qua con trỏ tạm, ta dọn sạch được khối cũ rồi mới thoát lỗi an
      toàn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: cấp bằng calloc, mở rộng bằng realloc và đếm cân bằng'
  checks:
  - sum((i + 1) * 10 for i in range(6)) == 210
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>#include &lt;stdlib.h&gt;</code></td><td>Khai
      báo <code>malloc</code>, <code>calloc</code>, <code>realloc</code>, <code>free</code></td></tr><tr><td><code>if
      (!p)</code> / <code>if (!tmp)</code></td><td>Dấu <code>!</code> phủ định: viết gọn của <code>p == NULL</code>
      khi cấp phát thất bại</td></tr><tr><td><code>int *tmp = realloc(a, 6 * sizeof(int));</code></td><td>Mở rộng
      từ 4 lên 6 phần tử bằng biến tạm để giữ nguyên con trỏ cũ</td></tr><tr><td><code>free(a); a = NULL;</code></td><td>Giải
      phóng và xoá ngay địa chỉ khỏi con trỏ để tránh lỗi dùng sau giải phóng</td></tr></table>'
    say: Trước khi chạy mã, ta giải mã đủ bốn quy ước cấp phát động chuẩn. Thư viện chuẩn cung cấp hàm xin, xoá
      và mở rộng vùng nhớ. Cách viết rút gọn dấu chấm than kiểm tra ngay xem cấp phát có rỗng hay không. Giải phóng
      đi kèm gán rỗng khoá chặt lỗi dùng trỏ treo.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
  - show: <p><b>Cấp phát 4 int, mở rộng lên 6 int, tính tổng và trả sạch</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>#include &lt;stdlib.h&gt;</div><div>int main(void) {</div><div>    int *a = calloc(4,
      sizeof(int));</div><div>    if (!a) return 1;</div><div>    for (int i = 0; i &lt; 4; i++) a[i] = (i + 1)
      * 10;</div><div>    int *tmp = realloc(a, 6 * sizeof(int));</div><div>    if (!tmp) { free(a); return 1; }</div><div>    a
      = tmp; a[4] = 50; a[5] = 60;</div><div>    int s = 0; for (int i = 0; i &lt; 6; i++) s += a[i];</div><div>    printf("n=6
      sum=%d last=%d\n", s, a[5]);</div><div>    free(a); a = NULL;</div><div>    printf("is_null=%d\n", a == NULL);</div><div>    return
      0;</div><div>}</div></div>
    say: Đoạn mã dùng hàm cấp phát đã xoá sạch về không cho bốn số nguyên rồi gán giá trị mười đến bốn mươi. Tiếp
      theo chương trình gọi mở rộng lên sáu ô thông qua con trỏ tạm an toàn, gán tiếp hai ô cuối rồi tính tổng và
      giải phóng sạch.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>n=6 sum=210 last=60</div><div>is_null=1</div></div>
    say: Kết quả chạy thật chứng minh bốn giá trị đầu được bảo toàn nguyên vẹn sau khi mở rộng lên sáu phần tử.
      Tổng toàn mảng thu được bằng hai trăm mười và toàn bộ bộ nhớ đã được giải phóng an toàn.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Kiểm cân bằng: đếm số lần cấp phát phải bằng số lần giải phóng'
  checks:
  - alg.cpr_heap_leak(5, 5) == 0
  steps:
  - show: <p><b>Mỗi vòng lặp ghép cặp 1 lần cấp với 1 lần trả → cân bằng = 0</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>#include &lt;stdlib.h&gt;</div><div>int main(void) {</div><div>    int allocs =
      0, frees = 0;</div><div>    for (int i = 0; i &lt; 5; i++) {</div><div>        int *buf = malloc(1024);</div><div>        if
      (!buf) return 1;</div><div>        allocs++;</div><div>        buf[0] = i;</div><div>        free(buf); frees++;</div><div>    }</div><div>    printf("allocs=%d
      frees=%d leak=%d\n", allocs, frees, allocs - frees);</div><div>    return 0;</div><div>}</div></div>
    say: Ở phần kiểm chứng, ta mô phỏng một vòng lặp năm lượt có cấp phát và giải phóng vùng nhớ để kiểm tra tính
      cân bằng. Vì mỗi lần cấp phát thành công đều đi kèm đúng một lần giải phóng nên tổng số khối còn giữ lại luôn
      bằng không.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>allocs=5 frees=5 leak=0</div></div>
    say: Đầu ra thật ghi nhận năm lần cấp phát, năm lần giải phóng và độ chênh bằng không vì mọi khối đã được thu
      hồi đúng lúc.
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: tốc độ rò rỉ RAM nếu quên giải phóng 1 KB mỗi lượt'
  checks:
  - alg.cpr_heap_leak(1000, 0) * 1024 == 1_024_000
  - 1_000_000 * 1024 == 1_024_000_000
  steps:
  - show: <table class='t'><tr><th>số lượt rò rỉ (mỗi lần 1 024 byte)</th><th>tổng bộ nhớ bị giữ lại</th><th>hệ
      quả</th></tr><tr><td><span style='white-space:nowrap'>1 000 lượt (×1)</span></td><td>1 024 000 byte (~1 MB)</td><td>Khó
      thấy bằng mắt thường khi thử nhỏ</td></tr><tr><td><span style='white-space:nowrap'>100 000 lượt (×100)</span></td><td>102
      400 000 byte (~98 MB)</td><td>RAM dịch vụ tăng đều theo thời gian</td></tr><tr><td><span style='white-space:nowrap'>1
      000 000 lượt (×1 000)</span></td><td>1 024 000 000 byte (~977 MB)</td><td>Nhân hệ điều hành ngắt dịch vụ vì
      cạn RAM</td></tr></table>
    say: Lỗi rò rỉ bộ nhớ thường lọt qua bài kiểm nhỏ một nghìn lần vì mới mất một mê-ga-bai. Nếu chỉ kiểm tra năm
      hoặc một trăm vòng lặp, lượng rò rỉ mới vài chục ki-lô-bai nên rất khó thấy. Lên tới một nghìn vòng đã mất
      một mê-ga-bai, và chạy một triệu lượt sẽ ngốn gần một gi-ga-bai khiến dịch vụ bị chấm dứt đột ngột.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: <table class='t'><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class='box warn'><b>1.
      Quên free (rò rỉ):</b> cấp phát rồi thoát hàm sớm ở nhánh lỗi trước khi xuống tới lệnh giải phóng.<br><b>2.
      Dùng sau giải phóng (use-after-free):</b> đọc/ghi qua con trỏ cũ sau khi vùng nhớ đã trả về hệ thống.<br><b>3.
      Giải phóng hai lần (double free):</b> gọi giải phóng cùng một địa chỉ hai lượt làm hỏng bộ cấp phát.<br><b>4.
      Không kiểm NULL:</b> ghi thẳng vào kết quả cấp phát khi máy cạn RAM.</div></td></tr></table>
    say: Khi dùng vùng nhớ động có bốn lỗi rất dễ mắc. Đó là quên giải phóng ở nhánh thoát sớm và bỏ qua bước kiểm
      tra rỗng. Lỗi nặng hơn là dùng lại vùng nhớ đã trả hoặc giải phóng cùng địa chỉ hai lần.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 250_000 * 4 == 1_000_000
  steps:
  - show: '<ol><li>Hàm nào tự khởi tạo mọi byte cấp phát về 0: <code>malloc</code> hay <code>calloc</code>?</li><li>Một
      hàm cấp 4 KB nhưng nhánh báo lỗi <code>return -1</code> quên gọi <code>free</code>; sau 250 000 lượt lỗi đó
      thì rò rỉ bao nhiêu MB (~1024 KB)?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, giữa hai hàm xin vùng nhớ thì hàm nào tự động đặt toàn bộ các bai về
      không? Câu hai, nếu mỗi lượt nhánh lỗi rò bốn ki-lô-bai thì sau hai trăm năm mươi nghìn lượt sẽ mất khoảng
      bao nhiêu mê-ga-bai? Dừng vi-đê-ô và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>calloc</code> đặt toàn bộ vùng nhớ về
      0 (khác với <code>malloc</code> giữ rác cũ).</p></td></tr></table>
