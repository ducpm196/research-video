- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>calloc/malloc + kiểm NULL</span><span class='a'>→</span><span class='n'>realloc qua biến tạm</span><span class='a'>→</span><span class='n'>free ở mọi nhánh rồi gán NULL</span></div>
    say: Tổng kết chuỗi tư duy quản lý vùng nhớ mở để giữ sạch bộ nhớ. Luôn kiểm tra khác rỗng ngay sau khi cấp phát, mở rộng qua con trỏ tạm, và giải phóng trên mọi nhánh thoát rồi gán về rỗng. Nguyên tắc cấp phát có kiểm tra và giải phóng rỗng tạo nên thói quen viết mã sạch không rò rỉ. Quản lý tốt vòng đời cấp phát, kiểm rỗng, mở rộng qua biến tạm và giải phóng hết ở mọi nhánh giúp ứng dụng C chạy bền bỉ. Từ khối nhớ thô đơn lẻ, bước kế tiếp ta sẽ ghép nhiều kiểu trường khác nhau thành các bản ghi cấu trúc hoàn chỉnh.
    clear: true
  - show: <div class='box ok'><b>Bài sau (bài 7):</b> Kiểu ghép cấu trúc, bố cục bộ nhớ và danh sách liên kết</div>
    say: Bài tiếp theo là bài 7, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Khi quản lý gọn vòng đời bộ nhớ động, bạn sẵn sàng tổ chức cấu trúc dữ liệu phức hợp và danh sách liên kết cân đối. Nhờ nắm vững quy tắc cấp phát và hoàn trả bộ nhớ, bạn sẵn sàng làm chủ các cấu trúc dữ liệu linh hoạt ở bài tiếp theo. Bài tiếp theo khám phá cách trình biên dịch sắp xếp bố cục cấu trúc và cách nối các nút động thành danh sách liên kết.
    clear: true
    forward_ref: true
