scenes:
- id: hook
  kind: hook
  title: 'Tình huống thực chiến: dịch vụ C ăn RAM tăng vọt và sập lúc 3 giờ sáng'
  checks:
  - 100_000 * 16 == 1_600_000
  - 100_000 * 24 == 2_400_000
  steps:
  - show: <div class='box key'><p>Hệ thống đối soát mỗi đêm đọc lô <b>100 000 bản ghi</b> giao dịch nhị phân. Bản cũ định nghĩa sai thứ tự <code>struct</code> mất <b>24 byte</b> mỗi bản ghi, và quên kiểm <code>realloc</code> nên sập khi tăng tải.</p><p>Ta thiết kế lại bản ghi <b>16 byte</b> không đệm (<b>1,6 MB</b> thay vì <b>2,4 MB</b>), mảng động tăng gấp đôi an toàn và dọn sạch 0 rò rỉ.</p></div>
    say: Chào bạn đến với bài tình huống chuyên gia tổng kết khoá C. Một dịch vụ đọc một trăm nghìn bản ghi mỗi đêm bị đội bộ nhớ từ một phẩy sáu lên hai phẩy bốn mê-ga-bai do bai đệm sai thứ tự. Hệ thống còn có nguy cơ sập vì quên kiểm tràn lúc cấp phát động. Hôm nay ta kết hợp trọn bộ kỹ năng từ bài 0 đến bài 8 để viết lại bộ phân tích vừa chuẩn từng bai vừa sạch bộ nhớ hoàn toàn. Tích lũy các bất cẩn nhỏ về bố cục cấu trúc và cấp phát lặp làm nghẽn cả một dây chuyền đối soát ban đêm lớn. Thiết kế cấp hệ thống kết hợp gọn nhẹ từng bai bộ nhớ với chiến lược mở rộng mảng tối ưu giải quyết tận gốc nút thắt. Tích lũy các bất cẩn nhỏ về bố cục cấu trúc và cấp phát lặp làm nghẽn cả một dây chuyền đối soát ban đêm lớn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>kỹ năng tổng hợp từ khoá CPR</th><th>vai trò trong bài tình huống</th></tr><tr><td>Sắp trường giảm padding + đóng gói bit (L07–L08)</td><td>Giữ bản ghi đúng 16 byte thay vì 24 byte</td></tr><tr><td>Kiểm tràn phép nhân + realloc an toàn + free sạch (L01, L06)</td><td>Chống sập và rò rỉ bộ nhớ ở quy mô lớn</td></tr></table>
    say: Tình huống chuyên gia hôm nay huy động trọn bộ bốn mảnh ghép từ các bài trước. Đầu tiên là sắp xếp cấu trúc chuẩn mười sáu bai không dư bai đệm và tách trường đóng gói bít. Sau đó kiểm tra ngưỡng tràn trước khi nhân kích thước để mở rộng mảng động và thu hồi sạch hoàn toàn. Sự phối hợp đồng thời bốn kỹ thuật biến chương trình C thành công cụ xử lý hàng trăm nghìn bản ghi trong tích tắc. Kiểm định tĩnh ngay lúc dịch khoá chặt hợp đồng kích thước mười sáu bai trước khi một dòng mã nào kịp thực thi.
