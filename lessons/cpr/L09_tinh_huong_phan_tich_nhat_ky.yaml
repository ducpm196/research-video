- id: intuition
  kind: intuition
  title: Luồng xử lý an toàn từ luồng dữ liệu tới tổng kết toán 64-bit
  steps:
  - show: <div><svg width="960" height="200" viewBox="0 0 960 200"><rect x="20" y="50" width="205" height="95" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="122.5" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">1. Đọc khối 16 B</text><text x="122.5" y="120" font-size="15" text-anchor="middle" fill="#475569">Kiểm số khối == 1</text><line x1="225" y1="97" x2="265" y2="97" stroke="#475569" stroke-width="2"/><polygon points="265,97 257.0,102.0 257.0,92.0" fill="#475569"/><rect x="265" y="50" width="255" height="95" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="392.5" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">2. Đầy → Kiểm &amp; Nhân đôi</text><text x="392.5" y="120" font-size="15" text-anchor="middle" fill="#475569">realloc qua biến tạm</text><line x1="520" y1="97" x2="560" y2="97" stroke="#475569" stroke-width="2"/><polygon points="560,97 552.0,102.0 552.0,92.0" fill="#475569"/><rect x="560" y="50" width="205" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="662.5" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">3. Cộng uint64_t</text><text x="662.5" y="120" font-size="15" text-anchor="middle" fill="#475569">Chặn tràn trước cộng</text><line x1="765" y1="97" x2="800" y2="97" stroke="#475569" stroke-width="2"/><polygon points="800,97 792.0,102.0 792.0,92.0" fill="#475569"/><rect x="800" y="50" width="145" height="95" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="872.5" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">4. free &amp; Đóng</text><text x="872.5" y="120" font-size="15" text-anchor="middle" fill="#475569">0 byte rò rỉ</text></svg></div>
    say: Luồng dữ liệu chuẩn gồm bốn khâu liên hoàn. Ở hai khâu đầu, luồng đọc nhận từng khối mười sáu bai kèm kiểm tra số khối rồi nhân đôi sức chứa mảng động qua con trỏ tạm khi đầy. Ở hai khâu sau, hệ thống lọc bản ghi đúng loại để cộng dồn vào tổng sáu mươi bốn bít có chặn tràn rồi giải phóng sạch bộ nhớ. Toàn bộ đường ống từ đĩa vào RAM rồi tính tổng sáu mươi bốn bít không để lọt bất kỳ điểm mù tràn số hay rò rỉ nào. Mỗi chốt chặn đều trả lỗi dứt khoát và giải phóng sạch vùng nhớ đang nắm giữ trước khi thoát khỏi hàm điều phối.
    clear: true
- id: formula
  kind: formula
  title: Tính lại chi phí và số lần realloc khi nhân đôi sức chứa
  checks:
  - 4 * (2 ** 15) == 131_072
  steps:
  - show: '<div class=''box key''><p>Bắt đầu sức chứa <code>cap = 4</code>. Để nạp <b>100 000</b> phần tử, chỉ cần nhân đôi đến 4 × 2¹⁵ = 131 072 — tức đúng <b>15 lần</b> <code>realloc</code> (so với 25 000 lần nếu mỗi lần chỉ tăng 4 ô).</p><p>Kiểm tra tràn trước khi nhân: <code>if (new_cap &gt; SIZE_MAX / sizeof(Rec)) return 1;</code></p></div>'
    say: Với dung lượng khởi điểm bằng bốn và nhân đôi mỗi lần đầy, chỉ cần đúng mười lăm lần mở rộng đã đạt sức chứa hơn một trăm ba mươi mốt nghìn bản ghi. Vì chiến lược nhân đôi tăng theo lũy thừa hai nên số lần cấp phát lại rất nhỏ dù dữ liệu lên tới hàng trăm nghìn bản ghi. Trước mọi phép nhân kích thước mở rộng ta bắt buộc kiểm tra phép chia ngưỡng nhằm loại bỏ hoàn toàn nguy cơ tràn số. Sự bùng nổ theo cấp số nhân hai giúp chỉ mười lăm lần mở rộng đã bao phủ hơn một trăm ba mươi nghìn bản ghi.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
  - clear: true
    show: <div class='box key'><p><b>Thiết kế bản ghi nhị phân 16 byte không byte đệm (padding = 0):</b></p><table class='t'><tr><th>trường</th><th>kiểu &amp; vị trí byte</th><th>căn lề</th></tr><tr><td><code>uint64_t ts</code></td><td>8 byte (0..7)</td><td>chia hết 8 ✓</td></tr><tr><td><code>uint16_t hdr, f</code></td><td>2 + 2 = 4 byte (8..11)</td><td>chia hết 2 ✓</td></tr><tr><td><code>uint32_t amt</code></td><td>4 byte (12..15)</td><td>chia hết 4 ✓</td></tr></table><p>Tổng = 8 + 2 + 2 + 4 = <b>16 byte</b>, xếp giảm dần hợp chuẩn căn lề nên <code>_Static_assert(sizeof(Rec) == 16)</code> đạt.</p></div>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Bước hai thiết kế cấu trúc mười sáu bai sạch hoàn toàn không chừa ô đệm thừa. Trường dấu thời gian tám bai nằm đầu tại vị trí không đến bảy. Hai trường tiêu đề hai bai ghép thành bốn bai thẳng hàng chia hết cho bốn. Trường số tiền bốn bai nằm khít ở vị trí mười hai đến mười lăm. Tổng cộng đúng mười sáu bai được khoá cứng bằng kiểm định tĩnh lúc biên dịch.
- id: example
  kind: example
  title: 'Chạy thật trên GCC: mảng động tăng gấp đôi phân tích 6 bản ghi nhị phân'
  checks:
  - 2 * 2 * 2 == 8
  steps:
  - show: <table class='t'><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>typedef struct { Rec *d; size_t len, cap; int res; } Vec;</code></td><td>Mảng động giữ con trỏ, độ dài, sức chứa và số lần mở rộng</td></tr><tr><td><code>if (nc &gt; SIZE_MAX / sizeof(Rec)) return 0;</code></td><td>Chặn tràn phép nhân kích thước trước khi gọi <code>realloc</code></td></tr><tr><td><code>_Static_assert(sizeof(Rec) == 16, "...");</code></td><td>Kiểm định tĩnh chuẩn C11 ngay lúc biên dịch (bắt buộc đủ 2 tham số)</td></tr><tr><td><code>(Rec){...}</code> / <code>(unsigned long long)sum</code> + <code>%llu</code></td><td>Khởi tạo cấu trúc tạm ngay tại chỗ và định dạng in số nguyên 64-bit không dấu</td></tr></table>
    say: Ta giải mã đủ bốn thành phần cốt lõi trong đoạn mã tình huống trước khi chạy kiểm thử. Cấu trúc mảng động gói dữ liệu, độ dài và sức chứa; phép chia chặn tràn ngăn lỗi nhân kích thước. Kiểm định tĩnh chuẩn C11 khoá kích thước mười sáu bai lúc biên dịch. Hằng cấu trúc tạm và mã không dấu sáu mươi bốn bít hoàn tất phần hiển thị tổng. Gói gọn mảng động vào một cấu trúc kèm số lần cấp phát giúp đo lường và kiểm soát trực tiếp chi phí mở rộng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    clear: true
  - show: '<p><b>Mảng động tăng gấp đôi sức chứa có kiểm tràn nhân kích thước</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdlib.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>typedef struct { uint64_t ts; uint16_t hdr, f; uint32_t amt; } Rec;</div><div>typedef struct { Rec *d; size_t len, cap; int res; } Vec;</div><div>static int push(Vec *v, Rec r) {</div><div>    if (v-&gt;len == v-&gt;cap) { size_t nc = v-&gt;cap ? v-&gt;cap * 2 : 2;</div><div>        if (nc &gt; SIZE_MAX / sizeof(Rec)) return 0;</div><div>        Rec *t = realloc(v-&gt;d, nc * sizeof(Rec)); if (!t) return 0;</div><div>        v-&gt;d = t; v-&gt;cap = nc; v-&gt;res++; } v-&gt;d[v-&gt;len++] = r; return 1; }</div><div>int main(void) { Vec v = {NULL,0,0,0}; uint32_t i;</div><div>    for (i = 0; i &lt; 6; i++) if (!push(&amp;v, (Rec){i+1, 1&lt;&lt;12, 0, 100})) return 1;</div><div>    printf("len=%zu cap=%zu resizes=%d\n", v.len, v.cap, v.res);</div><div>    free(v.d); v.d = NULL; printf("clean=%d\n", v.d == NULL); return 0; }</div></div>'
    say: Chương trình tạo mảng động sức chứa ban đầu bằng không rồi thêm sáu phần tử theo cơ chế nhân đôi từ hai lên bốn rồi tám. Hàm thêm phần tử kiểm tra ngưỡng chia trước khi nhân kích thước để chặn tràn số và đưa con trỏ về rỗng sau khi giải phóng. Hàm thêm phần tử áp dụng trọn vẹn bộ đôi kiểm tràn nhân kích thước và giữ địa chỉ cũ qua con trỏ tạm an toàn.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>len=6 cap=8 resizes=3</div><div>clean=1</div></div>
    say: Đầu ra chạy thật xác nhận sức chứa tăng đúng từ không lên hai, bốn rồi tám sau ba lần cấp phát lại. Biến sạch bằng một chứng tỏ con trỏ dữ liệu đã được đưa an toàn về rỗng sau khi giải phóng. Ba lần mở rộng phục vụ sáu phần tử kết hợp thu hồi sạch sẽ xác minh thiết kế mảng động hoạt động trơn tru.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng lọc bản ghi 16 byte và tính tổng 64-bit
  checks:
  - 100_000 * 24 - 100_000 * 16 == 800_000
  steps:
  - show: '<p><b>Kiểm static_assert 16B, biên tệp cụt (fread &lt; 1) và chặn tràn tổng 64-bit</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>#include &lt;stdint.h&gt;</div><div>typedef struct { uint64_t ts; uint16_t hdr, f; uint32_t amt; } Rec;</div><div>_Static_assert(sizeof(Rec) == 16, "Rec must be 16B");</div><div>int main(void) { uint64_t sum = 0; size_t got = 6, matched = 0;</div><div>  uint32_t a[6] = {100000, 50000, 200000, 75000, 250000, 350000};</div><div>  if (got != 6) return 1; /* chặn tệp cụt */</div><div>  for (size_t i = 0; i &lt; got; i++) {</div><div>    Rec r = {i + 1, (uint16_t)((i % 2 ? 2 : 1) &lt;&lt; 12), 0, a[i]};</div><div>    if (((r.hdr &gt;&gt; 12) &amp; 0xF) != 1) continue;</div><div>    if (sum &gt; UINT64_MAX - r.amt) return 2;</div><div>    sum += r.amt; matched++; }</div><div>  printf("matched=%zu sum=%llu\n", matched, 0ULL + sum); return 0; }</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta khoá cứng kích thước cấu trúc mười sáu bai bằng kiểm định tĩnh lúc biên dịch rồi chạy lọc sáu bản ghi. Vì chỉ các bản ghi vị trí chẵn mang mã loại một nên đúng ba giao dịch một trăm nghìn, hai trăm nghìn và hai trăm năm mươi nghìn được cộng vào tổng. Thử nghiệm kiểm định tĩnh kết hợp mặt nạ bít lọc bản ghi bảo đảm cả tầng vật lý lẫn logic nghiệp vụ cùng chuẩn xác. Đoạn kiểm tra cũng đối chiếu số bản ghi đọc thực tế phòng tệp cụt và chặn tràn tổng sáu mươi bốn bít trước khi cộng.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>matched=3 sum=550000</div></div>
    say: Đầu ra thật khớp tuyệt đối vì ba giao dịch khớp điều kiện cho tổng sáu mươi bốn bít đúng bằng năm trăm năm mươi nghìn đồng. Đối chiếu kết quả cuối cùng từ hai đường tính độc lập giúp khẳng định mảng động đã tự tăng dung lượng chuẩn xác và toàn bộ bộ nhớ đệm được trả lại sạch sẽ. Tổng sáu mươi bốn bít năm trăm năm mươi nghìn khớp hoàn toàn phép cộng tay ba bản ghi hợp lệ đã lọc qua trường loại.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: 'Bảng quy mô: so sánh chiến lược cấp phát cộng thêm vs nhân đôi'
  checks:
  - 10_000_000 * 16 == 160_000_000
  - 2 ** 23 == 8_388_608
  steps:
  - show: <table class='t'><tr><th>số bản ghi nạp</th><th>tăng đều +10 phần tử</th><th>nhân đôi sức chứa (×2)</th><th>tổng RAM (16 B/bản ghi)</th></tr><tr><td><span style='white-space:nowrap'>1 000 (×1)</span></td><td>100 lần realloc</td><td>9 lần realloc (cap 1024)</td><td>16 KB</td></tr><tr><td><span style='white-space:nowrap'>100 000 (×100)</span></td><td>10 000 lần realloc</td><td>16 lần realloc (cap 131 072)</td><td>1,6 MB</td></tr><tr><td><span style='white-space:nowrap'>10 000 000 (×10 000)</span></td><td>1 000 000 lần realloc</td><td>23 lần realloc</td><td>160 MB</td></tr></table>
    say: Bảng quy mô cho thấy sự chênh lệch khổng lồ giữa hai chiến lược mở rộng mảng động. Nếu chỉ tăng tuyến tính thêm mười ô mỗi lần đầy, mười triệu bản ghi tốn tới một triệu lần sao chép lại bộ nhớ. Ngược lại chiến lược nhân đôi dung lượng chỉ cần hai mươi ba lần mở rộng cực kỳ nhanh gọn. Khi dữ liệu tăng lên mười triệu dòng, khoảng cách giữa vài chục lần và một triệu lần mở rộng định đoạt thành bại hệ thống.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi chuyên gia 1: Quên kiểm tràn khi tính <code>nc * sizeof(Rec)</code>.</b> Kẻ tấn công đưa tệp khai số bản ghi giả rất lớn khiến phép nhân tràn thành số nhỏ, cấp buffer tí hon rồi ghi tràn Heap.<br><b>Lỗi chuyên gia 2: Dùng trực tiếp cấu trúc không ép thứ tự trường để đọc luồng ngoài mà quên độ đệm.</b> Phải dùng <code>sizeof</code> và kiểm <code>_Static_assert(sizeof(Rec) == 16, "Rec 16B")</code>.<br><b>Lỗi chuyên gia 3: Rò rỉ trên nhánh thoát sớm khi tệp bị cắt ngắn.</b> Luôn dọn con trỏ mảng động trước mọi câu lệnh <code>return</code>.</div></td></tr></table>'
    say: Hãy mang theo ba bài học xương máu khi viết mã cấp hệ thống. Luôn kiểm tràn nhân kích thước trước khi mở rộng vùng nhớ động. Đồng thời khoá chặt kích thước cấu trúc bằng kiểm định tĩnh và dọn sạch bộ nhớ ở cả nhánh lỗi. Tách bạch từng bước kiểm tra biên sẽ giúp mảng động hoạt động bền bỉ trên lượng bản ghi lớn. Mọi chương trình đọc tệp ngoài không tin cậy đều phải chặn phép nhân kích thước có nguy cơ tràn gây cấp phát khối nhớ quá bé. Khoá kiểm định tĩnh giúp phát hiện ngay nếu đồng nghiệp vô tình thêm một trường mới phá vỡ định dạng mười sáu bai.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 2 * (2 ** 9) == 1024
  steps:
  - show: <ol><li>Bắt đầu với sức chứa 2, nạp đủ 1 000 phần tử theo luật nhân đôi thì qua mấy lần mở rộng (<code>cap</code> cuối bằng bao nhiêu)?</li><li>Viết điều kiện kiểm tra tràn <b>trước</b> khi nhân <code>nc * sizeof(Rec)</code>.</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, khởi đầu sức chứa bằng hai và nhân đôi mỗi khi đầy, nạp một nghìn phần tử cần tối thiểu mấy lần mở rộng và sức chứa cuối bằng bao nhiêu? Câu hai, viết điều kiện chặn tràn phép nhân kích thước trước khi gọi mở rộng. Dừng vi-đê-ô và trả lời. Kiểm tra nhanh lại cách nhân đôi dung lượng và điều kiện giải phóng sạch toàn bộ mảng động.
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① 2 → 4 → 8 → … → 1024 = 2 × 2⁹: qua <b>9</b> lần mở rộng, sức chứa cuối bằng <b>1 024</b>.</p></td></tr></table>'
    say: 'Đáp án câu một: hai nhân hai lũy thừa chín bằng một nghìn không trăm hai mươi bốn, tức chỉ cần qua đúng chín lần mở rộng. Nhân đôi dung lượng mỗi khi đầy giúp chi phí sao chép phân bổ đều về hằng số trung bình cho hàng triệu thao tác thêm phần tử. Tư duy cấp số nhân hai biến các kịch bản tăng trưởng dữ liệu khổng lồ thành số lần cấp phát rất nhỏ đếm được trên đầu ngón tay.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Kiểm tra <code>if (nc &gt; SIZE_MAX / sizeof(Rec))</code> trước khi thực hiện phép nhân.</p></td></tr></table>
    say: 'Đáp án câu hai: chia giá trị lớn nhất của kiểu kích thước cho cỡ phần tử để kiểm ngưỡng trước khi nhân. Luôn kiểm tra tràn số nguyên khi nhân dung lượng mới với kích thước phần tử trước khi gọi mở rộng vùng nhớ cho mảng lớn. Phép chia ngưỡng lớn nhất luôn trả về kết quả chính xác không bao giờ tự kích hoạt tràn số như phép nhân trực tiếp.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành C đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/CPR/L09
  steps:
  - show: '<div class=''box key''><p><b>Thực hành CPR L09:</b> đọc <code>init_cap n</code> và <code>n</code> cặp <code>(type, amt)</code>, cấp mảng <code>Rec *</code> nhân đôi bằng <code>realloc</code> qua con trỏ tạm, cộng <code>amt</code> loại 1 và giải phóng sạch để in <code>rec_size=16 cap=.. sum_t1=..</code>, <code>clean=..</code>.</p><p><b>Dữ liệu mẫu (<code>stdin</code>):</b> <code>2 6 1 120 2 300 1 480 2 150 1 700 2 50</code> | Chấm: <code>bash labs/cham.sh CPR L09 duong_dan/bai_cua_ban.c</code> (<code>labs/CPR/L09/de.md</code>)</p></div>'
    say: Hãy mở đề bài L09 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết quả tĩnh. Hãy bấm tạm dừng, biên dịch bằng trình biên dịch GCC và hoàn thành trước khi đối chiếu đầu ra mẫu. Hoàn thiện bài tình huống chuyên gia tổng hợp bằng cách xử lý động trọn luồng dữ liệu đầu vào theo định dạng chuẩn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/CPR/L09/du_lieu.txt</code></b></p><div class="code"><div>rec_size=16 cap=8 sum_t1=1300</div><div>clean=1</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L09 khi chạy đúng logic trên chuẩn vào. Ngoài kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình chấm tự động. Xác minh đủ mọi chỉ số kích thước bản ghi, sức chứa mảng cuối cùng, tổng lọc theo bít và cờ giải phóng sạch bằng một.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L09:</b> (1) kiểm tra tràn phép nhân trước khi gọi realloc gấp đôi; (2) khởi tạo dung lượng ban đầu đúng theo stdin; (3) tính tổng bằng uint64_t và free sạch.</p></div>
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Rà soát thật kỹ từng nhánh lỗi cấp phát hoặc đọc tệp rỗng để bảo đảm vượt qua sạch hai bộ ca ẩn kiểm thử.
    focus:
    - 0
    - 1
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>Struct gọn không đệm</span><span class='a'>→</span><span class='n'>Kiểm tràn + realloc nhân đôi</span><span class='a'>→</span><span class='n'>Đóng tệp &amp; free sạch</span></div>
    say: Tổng kết trọn bộ kỹ năng lập trình C cấp hệ thống sau mười bài học. Chọn cấu trúc không dư bai đệm, mở rộng mảng động bằng nhân đôi kèm kiểm tràn, và luôn giải phóng sạch bộ nhớ ở mọi đường thoát. Toàn bộ kỹ năng từ biến cơ bản tới mảng động nhị phân đã sẵn sàng cho dự án thực tế.
    clear: true
  - show: ''
    say: Từ đo kích thước một biến cho tới dựng bộ phân tích tệp nhị phân mười triệu bản ghi, kỷ luật an toàn bộ nhớ luôn nhất quán. Mỗi khâu trong dây chuyền xử lý C chuẩn mực đều kiểm soát chặt biên, chống tràn số và thu hồi đầy đủ mọi mảnh nhớ đã xin.
  - show: <div class='box ok'><b>Hoàn thành trọn bộ 10 bài CPR:</b> bạn đã nắm chắc bộ nhớ, con trỏ, Heap, cấu trúc và tệp nhị phân C.</div>
    say: Chúc mừng bạn đã hoàn thành trọn vẹn mười bài lập trình C và quản lý bộ nhớ. Kiến thức này là nền trực tiếp cho kiến trúc máy tính và hệ điều hành. Hãy rà lại toàn bộ mã nguồn và quy tắc quản lý bộ nhớ vừa rèn luyện vì tư duy làm chủ phần cứng này đi suốt các môn hệ thống về sau. Hãy mang tư duy tỉ mỉ từng bai bộ nhớ này tiếp tục chinh phục các bài toán hệ điều hành, mạng và hệ thống phân tán.
    clear: true
