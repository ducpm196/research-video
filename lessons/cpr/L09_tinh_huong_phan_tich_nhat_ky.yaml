  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: <table class='t'><tr><th>quy ước kỹ thuật của bài</th><th>ý nghĩa</th></tr><tr><td><code>cap *= 2</code></td><td>Chiến lược nhân đôi sức chứa mảng động giúp giảm số lần gọi <code>realloc</code> từ O(N) xuống O(log N)</td></tr><tr><td><code>SIZE_MAX / sizeof(Rec)</code></td><td>Ngưỡng tối đa phần tử trước khi nhân kích thước gây tràn số nguyên</td></tr></table>
    say: Hai kỹ thuật chuyên gia được áp dụng trong bài tình huống này. Kỹ thuật đầu là nhân đôi dung lượng mảng động để giữ số lần sao chép ở mức lô-ga-rít. Kỹ thuật sau là chia kiểm tra ngưỡng trước khi nhân để chặn tràn. Chiến lược nhân đôi giữ chi phí phân bổ lại trung bình ở mức hằng số cho từng phần tử thêm vào mảng động. Nhờ giữ nguyên cấu trúc cấp phát tăng theo cấp số nhân, thời gian nạp mảng triệu dòng chạy tuyến tính rất êm.
