    say: Ta ôn lại bốn điều. Tệp văn bản là dãy byte trên đĩa, mỗi dòng kết thúc bằng
      ký tự xuống dòng. Chữ Việt có dấu chiếm hai hoặc ba byte, nên chữ tiền là bốn
      ký tự nhưng sáu byte. Hai định dạng dữ liệu là bảng ngăn bằng dấu phẩy và định
      dạng lồng nhau có kiểu. Và ta đã biết cách tách chuỗi và dùng từ điển.
- id: sym
  kind: symbol
  title: Giải mã mở tệp, chế độ, khối with, và các lệnh CSV, JSON, đường dẫn
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>open(tên,
      chế_độ, encoding="utf-8")</code></td><td>mở tệp</td><td>chế độ <code>"r"</code>
      đọc (mặc định), <code>"w"</code> ghi (<b>xoá hết</b> nội dung cũ), <code>"a"</code>
      ghi nối thêm; <code>encoding</code> nói rõ bảng mã</td></tr><tr><td><code>with
