      cách khác nhau, một dùng bộ đọc bảng và một tách từng dòng, đều cho đúng con
      số này. Ba đường độc lập cùng ra một kết quả.
- id: scale
  kind: concept
  title: 'Khi tệp lớn dần: đọc cả tệp hết bộ nhớ, đọc từng dòng thì không'
  checks:
