  - show: '<table class=''t''><tr><th>số dòng</th><th>dung lượng</th><th>đọc cả tệp
      rồi tách: đỉnh bộ nhớ</th><th>đọc từng dòng: đỉnh bộ nhớ</th></tr><tr><td>10
      000</td><td>≈ 230 KB</td><td>≈ 1,1 MB</td><td>≈ 26 KB</td></tr><tr><td>1 000
      000</td><td>≈ 23 MB</td><td>≈ 110 MB</td><td>≈ 26 KB</td></tr><tr><td>100 000
      000 (ngoại suy)</td><td>≈ 2,3 GB</td><td>≈ 11 GB</td><td>≈ 26 KB (không đổi)</td></tr></table><p
      class=''note''>Đo bằng công cụ theo dõi bộ nhớ trên máy kiểm; số minh hoạ. Ngoại
      suy: bộ nhớ đọc cả tệp tỉ lệ với số dòng.</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bảng này là kết quả đo. Mười nghìn dòng chiếm khoảng hai trăm ba mươi nghìn
      byte, đọc cả tệp cần khoảng một phẩy một triệu byte. Một triệu dòng chiếm khoảng
      hai mươi ba triệu byte, đọc cả tệp cần khoảng một trăm mười triệu byte. Đọc
      từng dòng, bộ nhớ chỉ cỡ khoảng hai mươi sáu nghìn byte ở cả hai quy mô. Ngoại
      suy một trăm triệu dòng, đọc cả tệp cần khoảng mười một tỉ byte. Đây là số minh
      hoạ trên máy kiểm.
  - show: <table class='t'><tr><th>cách đọc, 1 000 000 dòng</th><th>thời gian (đo
      trên máy kiểm, số minh hoạ)</th></tr><tr><td>đọc cả tệp rồi tách</td><td>≈ 800
      ms</td></tr><tr><td>đọc từng dòng</td><td>≈ 800 ms</td></tr></table><div class='box
      key'><b>Đánh đổi:</b> thời gian của hai cách cùng cỡ, nhưng <b>bộ nhớ</b> khác
      hẳn. Đọc cả tệp tiện khi cần quay lại hay sắp xếp và tệp nhỏ; đọc từng dòng
      là lựa chọn mặc định cho tệp có thể lớn, và khi cần thì cộng dồn kết quả thay
      vì giữ dữ liệu.</div>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Còn thời gian thì hai cách cùng cỡ. Đọc cả tệp rồi tách mất khoảng tám trăm
      phần nghìn giây, đọc từng dòng mất khoảng tám trăm phần nghìn giây. Đánh đổi
      nằm ở bộ nhớ chứ không ở thời gian. Đọc cả tệp tiện khi cần quay lại hoặc sắp
      xếp và tệp còn nhỏ. Đọc từng dòng nên là lựa chọn mặc định cho tệp có thể lớn,
      và khi cần thì cộng dồn kết quả thay vì giữ dữ liệu.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 6 > 2 and 6 - 2 == 4
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Mở bằng chế độ ghi để “thêm”
      dữ liệu: chế độ <code>"w"</code> xoá tệp.</div><div class="code"><div><span
      class="kw">from</span> pathlib <span class="kw">import</span> Path</div><div>Path("a.txt").write_text("abcdef",
      encoding="utf-8")</div><div>print(Path("a.txt").stat().st_size)</div><div><span
      class="kw">with</span> open("a.txt", "w", encoding="utf-8") <span class="kw">as</span>
      f:</div><div>    f.write("xy")</div><div>print(Path("a.txt").stat().st_size)</div><div><span
      class="kw">with</span> open("a.txt", "a", encoding="utf-8") <span class="kw">as</span>
      f:</div><div>    f.write("z")</div><div>print(Path("a.txt").read_text(encoding="utf-8"))</div></div><div
      class="code"><div>6</div><div>2</div><div>xyz</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là mở bằng chế độ ghi để thêm dữ liệu. Hai số
      đầu là kích thước tệp tính bằng byte, hỏi từ hệ điều hành. Chế độ ghi xoá hết
      nội dung cũ, tệp sáu byte còn hai byte.
  - show: '<div class="box key">Muốn ghi tiếp, dùng chế độ <code>"a"</code>. Phép
      thử bắt được lỗi: in <b>kích thước tệp</b> trước và sau khi ghi (<code>.stat().st_size</code>
      hỏi hệ điều hành kích thước tệp theo <b>byte</b>).</div>'
    clear: true
    say: Muốn ghi tiếp phải dùng chế độ nối thêm. Phép thử bắt được lỗi này là in
      kích thước tệp trước và sau khi ghi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Không nói rõ bảng
      mã: chương trình chạy ở máy này, hỏng ở máy kia.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>PYTHONIOENCODING=cp1252 python -c "print(''tiền'')"
      2&gt; loi.txt; echo <span>&#36;</span>?</div><div>1</div></div><div class=''box
      key''><code>PYTHONIOENCODING=cp1252 python -c "…"</code>: tiền tố <code>TÊN=giá_trị</code>
      đặt biến chỉ cho riêng lệnh này (ở đây ép <b>luồng in</b>, chỗ in chữ ra màn
      hình, dùng bảng mã cũ <code>cp1252</code>); <code>2&gt; loi.txt</code> chuyển
      thông báo lỗi vào tệp <code>loi.txt</code>; <code>;</code> kết thúc lệnh này
      để chạy lệnh kế; <code>echo &#36;?</code> in mã thoát.</div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là không nói rõ bảng mã. Bảng mã mặc định
      phụ thuộc máy, nên chương trình chạy ở máy này mà hỏng ở máy khác. Ở đây ta
      đặt một biến ngay trước lệnh, tiền tố chỉ có tác dụng với lệnh đó, ép chỗ in
      chữ ra màn hình dùng một bảng mã cũ. Dấu lớn hơn kèm số hai chuyển thông báo
      lỗi vào một tệp. Dấu chấm phẩy kết thúc lệnh này để chạy lệnh kế, và lệnh kế
      in mã thoát, là một.
  - show: '<p><b>Đọc dòng lỗi trong tệp</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>tail -n 1 loi.txt | cut -d: -f1</div><div>UnicodeEncodeError</div></div><div
      class=''box key''><code>tail -n 1 loi.txt</code> giữ <b>dòng cuối</b> của tệp
      (thông báo lỗi nằm ở dòng cuối); <code>|</code> chuyển kết quả đó sang lệnh
      sau; <code>cut -d: -f1</code> lấy phần trước dấu hai chấm đầu tiên.</div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lệnh giữ dòng cuối, với số một, lấy dòng cuối của tệp, nơi có tên lỗi. Dấu
      gạch đứng chuyển kết quả đó sang lệnh sau. Lệnh cắt lấy phần trước dấu hai chấm,
      và ta nhận tên lỗi mã hoá.
  - show: <p><b>Đặt bảng mã cho luồng in thì hết lỗi</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>PYTHONIOENCODING=utf-8 python -c "print('tiền')"</div><div>tiền</div></div><div
      class="box key">Luôn ghi <code>encoding="utf-8"</code> khi mở tệp. Khi in chữ
      Việt bị hỏng, đặt <code>PYTHONIOENCODING=utf-8</code> (hoặc <code>PYTHONUTF8=1</code>).</div>
    focus:
    - 1
    - 2
    clear: true
    say: Đặt bảng mã cho luồng in là hết lỗi. Quy tắc là luôn ghi rõ bảng mã khi mở
      tệp, và khi in chữ Việt bị hỏng thì đặt bảng mã cho luồng in.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Ghi xong chưa đóng
      tệp rồi đọc lại.</div><div class="code"><div>f = open("kq.txt", "w", encoding="utf-8")</div><div>f.write("tong=2500000")</div><div>print(repr(open("kq.txt",
      encoding="utf-8").read()))</div><div>f.close()</div><div>print(repr(open("kq.txt",
      encoding="utf-8").read()))</div></div><div class="code"><div>''''</div><div>''tong=2500000''</div></div><p><code>repr(x)</code>
      in giá trị <b>kèm cặp nháy</b>: chuỗi rỗng hiện là <code>''''</code>, không
      lẫn với một dòng trống.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    introduces:
    - pyt_repr
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là ghi xong chưa đóng tệp rồi đọc lại. Lệnh
      in dạng có nháy cho ta thấy chuỗi rỗng là hai dấu nháy liền nhau, chứ không
      phải một dòng trống. Chữ còn nằm trong bộ đệm, chưa xuống đĩa, nên đọc ra rỗng.
      Sau khi đóng tệp, nội dung mới có.
  - show: '<div class="box key">Dùng khối <code>with</code>: ra khỏi khối là tệp tự
      đóng. Lỗi này <b>không báo gì</b> và có thể chập chờn, nên rất khó lần ra.</div>'
    clear: true
    say: Hãy dùng khối đảm bảo đóng. Lỗi này không báo gì và có thể chập chờn, nên
      rất khó lần ra.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - int('2000000') + 1 == 2000001
  steps:
  - show: '<p><b>Đề.</b> Dòng đọc từ tệp: <code>"A02,nap,2000000\n"</code>.</p>

      <ol><li>Bỏ dấu xuống dòng rồi tách: phần tử thứ ba là gì, kiểu gì?</li>

      <li>Cộng thêm $1$ vào phần tử đó thế nào?</li></ol>

      <p><b>Quyết định:</b> tệp nhật ký có thể $5$ GB, cần đếm số dòng chứa chữ <code>LOI</code>:
      đọc cả tệp hay từng dòng? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Một dòng đọc từ tệp có dấu xuống dòng ở cuối.
      Câu một, bỏ dấu xuống dòng rồi tách, phần tử thứ ba là gì và kiểu gì. Câu hai,
      cộng thêm một vào phần tử đó thế nào. Sau đó là một quyết định, tệp nhật ký
      có thể nặng năm tỉ byte, cần đếm số dòng chứa chữ lỗi, đọc cả tệp hay từng dòng,
      và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Câu 1 và câu 2</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>"A02,nap,2000000\n".rstrip("\n").split(",")[2]</div><div>''2000000''</div><div><span
      class="cm">&gt;&gt;&gt; </span>int("2000000") + 1</div><div>2000001</div></div><p><code>rstrip("\n")</code>
      cắt bỏ dấu xuống dòng ở <b>cuối</b> chuỗi. Tách được <code>[''A02'', ''nap'',
      ''2000000'']</code>; phần tử thứ ba là <b>chuỗi</b> <code>''2000000''</code>.
      Phải đổi kiểu trước khi cộng: $2\,000\,000 + 1 = 2\,000\,001$.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    introduces:
    - pyt_rstrip
    clear: true
    say: Đáp án như sau. Lệnh cắt cuối chuỗi bỏ dấu xuống dòng ở cuối dòng. Sau khi
      tách, phần tử thứ ba là chuỗi hai triệu. Muốn cộng phải đổi sang số nguyên trước,
      và kết quả là hai triệu không trăm linh một.
  - show: '<div class=''box key''><b>Quyết định:</b> <b>từng dòng</b>. Chỉ cần đếm,
      không cần quay lại: mỗi dòng xem xong là bỏ, bộ nhớ không đổi dù tệp nặng bao
      nhiêu. Đọc cả tệp $5$ GB sẽ cần cỡ $5$ GB bộ nhớ hoặc hơn, nhiều máy không đủ.</div>'
    clear: true
    say: Quyết định, đọc từng dòng. Ta chỉ cần đếm, không cần quay lại. Mỗi dòng xem
      xong là bỏ, nên bộ nhớ không đổi dù tệp nặng bao nhiêu. Đọc cả tệp năm tỉ byte
      cần cỡ năm tỉ byte bộ nhớ hoặc hơn, nhiều máy không đủ.
- id: practice
  kind: practice
  title: 'Tự làm: đọc CSV giao dịch, tổng theo loại, ghi JSON báo cáo'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>bao_cao.py</code>. Dòng đầu chương trình <b>ghi
      sẵn</b> tệp <code>gd.csv</code> (6 giao dịch; chép từ <code>de.md</code>: cột
      <code>ma, loai, tai_khoan, so_tien</code>). Rồi:</p>

      <ol><li>đọc bằng <code>csv.DictReader</code>, tính <b>tổng tiền theo loại</b>
      và <b>số giao dịch</b>;</li>

      <li>ghi <code>bao_cao.json</code> (<code>sort_keys=True</code>), đọc lại, in
      nội dung tệp và <code>so_giao_dich</code>, tổng loại <code>nap</code>.</li></ol><p
      class="note">Lưu tệp ở thư mục gốc của bộ khoá (nơi có thư mục <code>labs</code>),
      mở Git Bash tại đó để chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
