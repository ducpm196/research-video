      mục lấy tên của nó bỏ vào danh sách.
  - show: '<p><b>Đường dẫn: dựng thư mục, ghi, hỏi, liệt kê</b></p><div class="code"><div><span
      class="kw">from</span> pathlib <span class="kw">import</span> Path</div><div>thu_muc
      = Path("bao_cao") / "2026"</div><div>thu_muc.mkdir(parents=<span class="kw">True</span>,
      exist_ok=<span class="kw">True</span>)</div><div>tep = thu_muc / "thang3.txt"</div><div>tep.write_text("xin
      chao", encoding="utf-8")</div><div>print(tep.name, tep.suffix, tep.exists())</div><div>print(tep.read_text(encoding="utf-8"))</div><div>print([p.name
      <span class="kw">for</span> p <span class="kw">in</span> thu_muc.iterdir()])</div></div><div
      class="code"><div>thang3.txt .txt True</div><div>xin chao</div><div>[''thang3.txt'']</div></div><p><code>mkdir</code>
      tạo thư mục: <code>parents=True</code> tạo luôn thư mục cha còn thiếu (<code>bao_cao</code>);
      <code>exist_ok=True</code> không báo lỗi nếu thư mục đã có.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: 'Ví dụ ba, đường dẫn. Dấu gạch chéo ghép các phần của đường dẫn. Ta dựng
      thư mục lồng nhau, ghi một tệp, rồi hỏi tên, đuôi, và liệt kê nội dung thư mục.
      Lệnh dựng thư mục có hai đối số: đối số đầu dựng luôn thư mục cha còn thiếu,
      đối số sau không báo lỗi nếu thư mục đã có. Cách này chạy được cả trên các hệ
      điều hành khác nhau, không cần lo dấu gạch xuôi hay ngược.'
  - show: <p><b>Đọc từng dòng, cộng dồn, không giữ cả tệp</b></p><div class="code"><div>tong
      = 0</div><div>dem = 0</div><div><span class="kw">with</span> open("gd.csv",
      encoding="utf-8") <span class="kw">as</span> f:</div><div>    next(f)</div><div>    <span
      class="kw">for</span> dong <span class="kw">in</span> f:</div><div>        tong
      = tong + int(dong.split(",")[2])</div><div>        dem = dem + 1</div><div>print(dem,
