- id: formula
  kind: formula
  title: 'Suy ra từng bước: ghi rồi đọc, byte của tệp, CSV toàn chuỗi, JSON đổi kiểu'
  checks:
  - len('tiền mặt\n2.000.000 đồng\n'.encode('utf-8')) == 31 and len('tiền mặt\n2.000.000
    đồng\n') == 24
  - 500000 + 2000000 + 300000 == 2800000
  - '''tiền''.encode(''utf-8'').decode(''latin-1'') != ''tiền'''
  steps:
  - show: '<p><b>Bước 1. Ghi rồi đọc lại, cùng bảng mã</b></p><div class="code"><div><span
      class="kw">with</span> open("ghi_chu.txt", "w", encoding="utf-8") <span class="kw">as</span>
      f:</div><div>    f.write("tiền mặt\n")</div><div>    f.write("2.000.000 đồng\n")</div><div><span
      class="kw">with</span> open("ghi_chu.txt", encoding="utf-8") <span class="kw">as</span>
      f:</div><div>    noi_dung = f.read()</div><div>print(len(noi_dung.split("\n"))
      - 1, "dong")</div><div>print(len(noi_dung), "ky tu")</div><div>print(len(noi_dung.encode("utf-8")),
      "byte")</div></div><div class="code"><div>2 dong</div><div>24 ky tu</div><div>31
      byte</div></div><p>Vì ghi và đọc cùng <code>encoding="utf-8"</code>, chữ giữ
      nguyên: $2$ dòng. Nội dung đọc ra có $24$ ký tự nhưng $31$ byte (UTF-8) vì chữ
      có dấu chiếm nhiều byte.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước một, ghi rồi đọc lại cùng bảng mã. Ta ghi hai dòng chữ Việt, rồi đọc
      cả tệp. Vì ghi và đọc cùng một bảng mã, chữ giữ nguyên, có hai dòng. Nội dung
      có hai mươi bốn ký tự, nhưng ba mươi mốt byte, vì các chữ có dấu chiếm nhiều
      byte hơn một.
  - show: <div class='box key'>Số $31$ byte là của <b>nội dung</b> đọc ra. Trên Windows,
      tệp nằm trên đĩa là $33$ byte vì mỗi dấu xuống dòng lưu bằng $2$ byte; trên
      Linux và macOS vẫn $31$.</div>
    clear: true
    say: Trên một số hệ điều hành, mỗi dấu xuống dòng lưu bằng hai byte, nên tệp trên
      đĩa lớn hơn nội dung đọc ra một chút.
  - show: '<p><b>Bước 2. Đọc sai bảng mã cho chữ hỏng</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>"tiền".encode("utf-8")</div><div>b''ti\xe1\xbb\x81n''</div><div><span
      class="cm">&gt;&gt;&gt; </span>"tiền".encode("utf-8").decode("latin-1")</div><div>''tiá»\x81n''</div><div><span
      class="cm">&gt;&gt;&gt; </span>"tiền".encode("utf-8").decode("utf-8")</div><div>''tiền''</div></div><p>Vì
      <code>ề</code> được lưu bằng $3$ byte, đọc theo bảng mã cũ mỗi byte thành một
      ký tự lạ: <code>tiá»\x81n</code>. Đúng bảng mã thì trả lại <code>tiền</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước hai, đọc sai bảng mã. Chữ tiền được lưu bằng sáu byte. Nếu đọc bằng
      một bảng mã cũ coi mỗi byte là một ký tự, ta nhận các ký tự lạ thay cho chữ
      có dấu. Đọc đúng bảng mã thì trả lại đúng chữ. Vì thế luôn nói rõ bảng mã khi
      mở tệp.
  - show: '<p><b>Bước 3a. Tệp gd.csv (gõ bằng trình soạn thảo, lưu cùng thư mục với
      chương trình)</b></p><div class="code"><div>ma,loai,so_tien</div><div>A01,chuyen,500000</div><div>A02,nap,2000000</div><div>A03,rut,300000</div></div><p>Dòng
      đầu là <b>tên các cột</b>; mỗi dòng sau là một giao dịch; các cột cách nhau
      dấu phẩy. Tạo tệp như ở bài đầu: mở trình soạn thảo chữ thuần, gõ nội dung,
      lưu tên <code>gd.csv</code> (đuôi <code>.csv</code>, mã hoá UTF-8) vào thư mục
      đang đứng trong cửa sổ lệnh.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Trước khi đọc, ta cần có tệp bảng. Đây là nội dung của nó. Hãy tạo tệp như
      ở bài đầu, bằng một trình soạn thảo chữ thuần, lưu với tên hiện trên màn hình,
      đuôi chấm xê ét vê, cùng thư mục với chương trình. Dòng đầu là tên các cột,
      nên mỗi dòng sau là một giao dịch, các cột cách nhau dấu phẩy.
  - show: '<p><b>Bước 3b. CSV: mỗi dòng một từ điển, mọi giá trị là chuỗi</b></p><div
      class="code"><div><span class="kw">import</span> csv</div><div>tong = 0</div><div><span
      class="kw">with</span> open("gd.csv", encoding="utf-8", newline="") <span class="kw">as</span>
      f:</div><div>    <span class="kw">for</span> hang <span class="kw">in</span>
      csv.DictReader(f):</div><div>        print(hang["ma"], hang["loai"], type(hang["so_tien"]).__name__)</div><div>        tong
      = tong + int(hang["so_tien"])</div><div>print("Tong:", tong)</div></div><div
      class="code"><div>A01 chuyen str</div><div>A02 nap str</div><div>A03 rut str</div><div>Tong:
      2800000</div></div><p>Vì CSV chỉ là chữ, <code>hang["so_tien"]</code> là chuỗi
      <code>''500000''</code>; <code>type(x).__name__</code> cho tên kiểu viết bằng
      chữ (<code>str</code> = chuỗi); muốn cộng phải <code>int(...)</code>: $500\,000
      + 2\,000\,000 + 300\,000 = 2\,800\,000$.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, đọc tệp bảng, ở đây bộ đọc cho mỗi dòng một từ điển với khoá là
      tên cột. Vì tệp chỉ chứa chữ, mọi giá trị đều là chuỗi, kể cả cột số tiền. Dòng
      in thứ ba hỏi tên kiểu của cột số tiền bằng dấu chấm, và nhận về tên kiểu là
      chuỗi. Muốn cộng phải đổi sang số nguyên, và tổng ba giao dịch là hai triệu
      tám trăm nghìn.
  - show: '<p><b>Bước 4. JSON đổi kiểu qua lại</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">import</span> json</div><div><span
      class="cm">&gt;&gt;&gt; </span>json.dumps({"a": <span class="kw">True</span>,
      "b": <span class="kw">None</span>, "c": [1, 2.5]})</div><div>''{"a": true, "b":
      null, "c": [1, 2.5]}''</div><div><span class="cm">&gt;&gt;&gt; </span>json.loads(''{"so":
      5, "ten": "A01"}'')</div><div>{''so'': 5, ''ten'': ''A01''}</div></div><p>Vì
      JSON có kiểu riêng: <code>True</code> → <code>true</code>, <code>None</code>
      → <code>null</code>, dấu ngoặc nhọn → đối tượng, ngoặc vuông → mảng. Đọc lại
      thì trả về từ điển và danh sách. <code>json.dumps(x)</code> đổi <code>x</code>
      thành chữ JSON (<code>s</code> = chuỗi); <code>json.loads(chữ)</code> đổi chữ
      JSON ngược lại; bản không có <code>s</code> làm việc với tệp.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước bốn, JSON. Lệnh có chữ s ở cuối, nghĩa là chuỗi, đổi dữ liệu thành chữ
      JSON, và lệnh tải có chữ s đổi ngược lại; bản không có chữ s làm việc với tệp.
      Vì JSON có kiểu riêng, các kiểu được đổi qua lại. Giá trị đúng của ngôn ngữ
      này thành chữ viết thường trong JSON, giá trị rỗng thành một từ riêng, từ điển
      thành đối tượng, danh sách thành mảng. Đọc chữ JSON lại thì trả về từ điển và
      danh sách như ban đầu.
- id: example
  kind: example
  title: 'Ví dụ: ghi và đọc CSV, JSON, và tìm tệp bằng đường dẫn'
  checks:
  - 500000 + 2000000 + 300000 == 2800000
  steps:
  - show: '<p><b>Ghi CSV: tiêu đề rồi từng hàng</b></p><div class="code"><div><span
      class="kw">import</span> csv</div><div>hang = [["A04", "chuyen", 150000], ["A05",
      "nap", 900000]]</div><div><span class="kw">with</span> open("moi.csv", "w",
      encoding="utf-8", newline="") <span class="kw">as</span> f:</div><div>    w
      = csv.writer(f)</div><div>    w.writerow(["ma", "loai", "so_tien"])</div><div>    w.writerows(hang)</div><div>print(open("moi.csv",
      encoding="utf-8").read())</div></div><div class="code"><div>ma,loai,so_tien</div><div>A04,chuyen,150000</div><div>A05,nap,900000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ví dụ một, ghi tệp bảng. Ta ghi dòng tiêu đề, rồi hai hàng bằng một lệnh.
      Bộ ghi tự thêm dấu phẩy ngăn cột và dấu xuống dòng. Đọc lại cho thấy nội dung
      đúng như mong đợi.
  - show: '<p><b>Ghi và đọc JSON</b></p><div class="code"><div><span class="kw">import</span>
      json</div><div>bao_cao = {"ngay": "2026-03-05", "so_gd": 2, "tong": 2500000,
      "loai": ["chuyen", "nap"]}</div><div><span class="kw">with</span> open("bc.json",
      "w", encoding="utf-8") <span class="kw">as</span> f:</div><div>    json.dump(bao_cao,
      f, ensure_ascii=<span class="kw">False</span>)</div><div><span class="kw">with</span>
      open("bc.json", encoding="utf-8") <span class="kw">as</span> f:</div><div>    doc
      = json.load(f)</div><div>print(doc["tong"], doc["loai"][1])</div><div>print(doc
      == bao_cao)</div><div>print(open("bc.json", encoding="utf-8").read())</div></div><div
      class="code"><div>2500000 nap</div><div>True</div><div>{"ngay": "2026-03-05",
      "so_gd": 2, "tong": 2500000, "loai": ["chuyen", "nap"]}</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ví dụ hai, JSON. Ta ghi một báo cáo gồm ngày, số giao dịch, tổng và danh
      sách loại, rồi đọc lại. Đối tượng đọc lại bằng đúng đối tượng đã ghi, và chữ
      JSON trong tệp đọc được bằng mắt.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>thu_muc.iterdir()</code></td><td>liệt
      kê thư mục</td><td>đi qua từng mục (tệp, thư mục con) nằm trong <code>thu_muc</code></td></tr><tr><td><code>[p.name
      for p in dãy]</code></td><td>danh sách suy ra</td><td>dựng một danh sách <b>mới</b>:
