    say: Bảng đầu là mở tệp. Lệnh mở nhận tên tệp, chế độ và bảng mã, trong đó chế
      độ đọc là mặc định. Chế độ ghi xoá hết nội dung cũ. Chế độ nối thêm ghi vào
      cuối. Khối thứ hai đảm bảo tệp tự đóng khi ra khỏi khối, kể cả khi có lỗi. Đọc
      cả tệp lấy toàn bộ thành một chuỗi, còn vòng lặp lấy từng dòng một. Lệnh ghi
      ghi một chuỗi. Hai ký tự gạch ngược và n trong một chuỗi là một ký tự xuống
      dòng, và tách chuỗi tại nó cho ra các dòng.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>csv.DictReader(f)</code></td><td>đọc
      CSV theo cột</td><td>mỗi dòng là một <b>từ điển</b> (khoá = tên cột); mọi giá
      trị là <b>chuỗi</b>; mở tệp với <code>newline=""</code> để bộ đọc tự xử lý dấu
      xuống dòng nằm trong một ô</td></tr><tr><td><code>csv.writer(f).writerow([…])</code></td><td>ghi
      một dòng CSV</td><td>ghi các giá trị, thêm dấu phẩy và xuống dòng đúng cách</td></tr><tr><td><code>json.dump(đối_tượng,
      f)</code>, <code>json.load(f)</code></td><td>ghi JSON, đọc JSON</td><td>đổi
      qua lại giữa từ điển/danh sách và chữ JSON; <code>ensure_ascii=False</code>
      giữ nguyên chữ Việt</td></tr><tr><td><code>from pathlib import Path</code>,
      <code>Path("a") / "b"</code></td><td>nạp công cụ, rồi ghép đường dẫn</td><td><code>from
      X import Y</code>: lấy riêng công cụ <code>Y</code> từ thư viện <code>X</code>,
      viết một lần ở đầu tệp; rồi <code>.name</code>, <code>.suffix</code>, <code>.exists()</code>,
      <code>.read_text()</code>, <code>.mkdir()</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: 'Bảng thứ hai là bốn công cụ cho dữ liệu. Bộ đọc bảng cho mỗi dòng một từ
      điển, khoá là tên cột, và mọi giá trị đều là chuỗi. Bộ ghi bảng ghi một dòng
      với dấu ngăn đúng cách, và cả hai bộ cần mở tệp kèm tham số xuống dòng rỗng
      để tự xử lý dấu xuống dòng. Hai lệnh dữ liệu cấu trúc đổi qua lại giữa từ điển,
      danh sách và chữ, và một tham số giữ nguyên chữ Việt. Cuối cùng là công cụ đường
      dẫn: dòng nạp lấy riêng một công cụ từ thư viện của nó, rồi ghép đường dẫn bằng
      dấu gạch chéo, kèm các lệnh hỏi tên, đuôi, sự tồn tại.'
