    say: 'Chào bạn, một tệp giao dịch một triệu dòng nặng khoảng hai mươi ba triệu
      byte. Nếu đọc cả tệp vào bộ nhớ một lần rồi tách thành dòng, đỉnh bộ nhớ của
      chương trình, tức mức cao nhất trong lúc chạy, lên tới khoảng một trăm mười
      triệu byte. Nếu đọc từng dòng, bộ nhớ chỉ cỡ khoảng hai mươi sáu nghìn byte,
      dù tệp có lớn đến đâu. Ngoại suy, tức nhân theo tỉ lệ từ số đã đo, cho một trăm
      triệu dòng: đọc cả tệp cần khoảng mười một tỉ byte, nhiều hơn bộ nhớ của nhiều
      máy cá nhân. Số đo trên máy kiểm, số minh hoạ.'
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Mở, đọc, ghi, <b>đóng</b> một tệp văn bản đúng cách và đúng <b>bảng
      mã</b>?</li>

      <li>Đọc và ghi hai định dạng bảng và cấu trúc: <b>CSV</b> và <b>JSON</b>?</li>

      <li>Khi tệp lớn hơn bộ nhớ thì đọc <b>từng dòng</b> giúp thế nào?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, mở, đọc, ghi và đóng một tệp văn bản
      đúng cách và đúng bảng mã. Hai, đọc và ghi hai định dạng, một cho bảng và một
      cho dữ liệu có cấu trúc. Ba, khi tệp lớn hơn bộ nhớ thì đọc từng dòng giúp thế
      nào.
    clear: true
