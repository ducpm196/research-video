    say: Tổng kết chuỗi logic. Lớp là bản vẽ, đối tượng là một cái dựng từ bản vẽ.
      Tham số đầu tiên là chính đối tượng, và dữ liệu riêng đặt trong hàm tạo. Theo
      quy ước, mọi thay đổi đi qua phương thức có kiểm tra điều kiện. Phép so bằng
      hỏi nội dung nếu có viết, còn phép so sánh danh tính hỏi cùng một đối tượng.
      Kế thừa là câu là một, hợp thành là câu có một. Và mỗi đối tượng tốn bộ nhớ,
      nên đo trước khi nhân lên.
