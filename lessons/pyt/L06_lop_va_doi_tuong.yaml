    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Cách sửa là tạo danh sách trong hàm tạo, gắn vào đối tượng. Khi đó mỗi đối
      tượng có danh sách riêng, nạp vào A không một thì A không hai vẫn rỗng. Quy
      tắc nhớ: dữ liệu riêng của đối tượng đặt trong hàm tạo.'
  - show: '<div class="box warn"><b>Lỗi 3 (người mới).</b> Tưởng gán đối tượng là
      sao chép nó.</div><div class="code"><div><span class="cm">&gt;&gt;&gt; </span><span
      class="kw">class</span> TaiKhoan:</div><div><span class="cm">... </span>    <span
      class="kw">def</span> __init__(self, ma, so_du=0):</div><div><span class="cm">...
      </span>        self.ma = ma</div><div><span class="cm">... </span>        self.so_du
      = so_du</div><div><span class="cm">... </span>    <span class="kw">def</span>
      nap(self, tien):</div><div><span class="cm">... </span>        self.so_du =
      self.so_du + tien</div><div><span class="cm">... </span></div><div><span class="cm">&gt;&gt;&gt;
      </span>a = TaiKhoan("A01", 100)</div><div><span class="cm">&gt;&gt;&gt; </span>b
      = a</div><div><span class="cm">&gt;&gt;&gt; </span>b.nap(50)</div><div><span
      class="cm">&gt;&gt;&gt; </span>a.so_du</div><div>150</div></div><p>Như danh
      sách: <code>b = a</code> chỉ dán thêm nhãn. Nạp qua <code>b</code>, số dư của
