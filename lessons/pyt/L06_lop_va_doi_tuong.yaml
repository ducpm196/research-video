  - show: '<p><b>Dùng: nạp vào A01, hỏi lịch sử của A02</b></p><div class="code"><div>a
      = TaiKhoan("A01")</div><div>b = TaiKhoan("A02")</div><div>a.nap(100000)</div><div>print(b.lich_su)</div></div><div
      class="code"><div>[100000]</div></div><p>Phép thử: nạp vào <code>A01</code>
      mà <code>A02</code> cũng thấy lịch sử. Sửa: tạo danh sách <b>trong hàm tạo</b>
      bằng <code>self.lich_su = []</code>.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Nạp tiền vào tài khoản A không một mà tài khoản A không hai cũng thấy lịch
      sử. Lỗi này không báo gì.
  - show: '<p><b>Cách sửa: mỗi đối tượng một danh sách riêng</b></p><div class="code"><div><span
      class="kw">class</span> TaiKhoan:</div><div>    <span class="kw">def</span>
      __init__(self, ma):</div><div>        self.ma = ma</div><div>        self.lich_su
      = []</div><div> </div><div>    <span class="kw">def</span> nap(self, tien):</div><div>        self.lich_su.append(tien)</div><div>
      </div><div>a = TaiKhoan("A01")</div><div>b = TaiKhoan("A02")</div><div>a.nap(100000)</div><div>print(a.lich_su,
