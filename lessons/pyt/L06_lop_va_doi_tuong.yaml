      lại trừ và trả <code>True</code>;</li>

      <li><code>__repr__</code> trả <code>TaiKhoan(mã, số_dư)</code>; rồi chạy đoạn
      thử ở màn hình trước (5 dòng in).</li></ol>

      <p><b>Đo</b> hai danh sách $1000$ phần tử (số; chuỗi dài $100$ ký tự), in <code>getsizeof
      hai danh sach: bang nhau</code> và <code>tracemalloc hai danh sach: chuoi lon
      hon</code>.</p><p class="note">Lưu tệp ở thư mục gốc của bộ khoá (nơi có thư
      mục <code>labs</code>), mở Git Bash tại đó để chấm.</p>

      '
