    - 1
    - 2
    - 3
    clear: true
    say: Đáp án như sau. Vì a và b là hai nhãn của cùng một đối tượng, nạp qua b thì
      a thấy, một trăm cộng năm mươi bằng một trăm năm mươi. Muốn bản độc lập, ta
      dựng đối tượng mới, truyền mã và số dư của a vào.
  - show: <div class='box key'><b>Quyết định:</b> <b>hợp thành</b>. Một thẻ <b>có
