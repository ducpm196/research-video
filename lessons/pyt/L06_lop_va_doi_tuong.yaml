  - show: '<p><b>Câu 1</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span><span class="kw">class</span> TaiKhoan:</div><div><span class="cm">...
      </span>    <span class="kw">def</span> __init__(self, ma, so_du=0):</div><div><span
      class="cm">... </span>        self.ma = ma</div><div><span class="cm">... </span>        self.so_du
      = so_du</div><div><span class="cm">... </span>    <span class="kw">def</span>
      nap(self, tien):</div><div><span class="cm">... </span>        self.so_du =
      self.so_du + tien</div><div><span class="cm">... </span></div><div><span class="cm">&gt;&gt;&gt;
      </span>a = TaiKhoan("A01", 100)</div><div><span class="cm">&gt;&gt;&gt; </span>b
      = a</div><div><span class="cm">&gt;&gt;&gt; </span>b.nap(50)</div><div><span
      class="cm">&gt;&gt;&gt; </span>a.so_du</div><div>150</div></div><p>$a$ và $b$
      là <b>hai nhãn của cùng một đối tượng</b>, nên nạp qua $b$ thì $a$ thấy: $100
      + 50 = 150$. Muốn bản độc lập: dựng đối tượng mới, ví dụ <code>TaiKhoan(a.ma,
      a.so_du)</code>.</p>'
