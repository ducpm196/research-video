    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của người mới, là tưởng gán đối tượng là sao chép nó. Giống danh
      sách, gán chỉ dán thêm nhãn. Nạp qua nhãn b, số dư của đối tượng mà a trỏ tới
      cũng đổi, vì chỉ có một đối tượng.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
