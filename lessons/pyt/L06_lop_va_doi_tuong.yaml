      TaiKhoan:</div><div>    <span class="kw">def</span> nap(tien):</div><div>        <span
      class="kw">pass</span></div><div> </div><div>a = TaiKhoan()</div><div>a.nap(5)</div></div><div
      class="code"><div><span class="cm">TypeError: TaiKhoan.nap() takes 1 positional
      argument but 2 were given</span></div></div><p><code>pass</code> nghĩa là <b>không
      làm gì</b>: chỗ giữ để khối lệnh không bị rỗng.</p>'
