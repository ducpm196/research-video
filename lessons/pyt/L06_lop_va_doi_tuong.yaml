- id: formula
  kind: formula
  title: 'Suy ra từng bước: self, thuộc tính, hiển thị, so sánh'
  checks:
  - 100 + 50 + 50 == 200
  - 1500000 - 300000 == 1200000
  steps:
  - show: '<p><b>Bước 1. Gõ lớp, dựng đối tượng, gọi qua đối tượng</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">class</span> TaiKhoan:</div><div><span
      class="cm">... </span>    <span class="kw">def</span> __init__(self, ma, so_du=0):</div><div><span
      class="cm">... </span>        self.ma = ma</div><div><span class="cm">... </span>        self.so_du
      = so_du</div><div><span class="cm">... </span>    <span class="kw">def</span>
      nap(self, tien):</div><div><span class="cm">... </span>        self.so_du =
      self.so_du + tien</div><div><span class="cm">... </span></div><div><span class="cm">&gt;&gt;&gt;
      </span>a = TaiKhoan("A01", 100)</div><div><span class="cm">&gt;&gt;&gt; </span>a.nap(50)</div><div><span
      class="cm">&gt;&gt;&gt; </span>a.so_du</div><div>150</div></div><p>Vì <code>a.nap(50)</code>
      tự đưa <code>a</code> vào làm <code>self</code>: $100 + 50 = 150$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, tham số đầu tiên là gì. Ta gõ lớp có hàm tạo và phương thức nạp,
      dựng tài khoản có một trăm đồng, rồi gọi nạp năm mươi qua đối tượng. Vì nạp
      năm mươi vào một trăm, số dư thành một trăm năm mươi.
  - show: '<p><b>Bước 1 (tiếp phiên trên). Gọi qua lớp, đối tượng là tham số đầu</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>TaiKhoan.nap(a, 50)</div><div><span
      class="cm">&gt;&gt;&gt; </span>a.so_du</div><div>200</div></div><p>Vì <code>a.nap(50)</code>
      tự đưa <code>a</code> vào làm <code>self</code>, nó <b>cùng nghĩa</b> với <code>TaiKhoan.nap(a,
      50)</code>: nạp thêm $50$ lên $200$ ✓</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Gọi qua lớp, đưa đối tượng vào làm tham số đầu, cũng nạp năm mươi, số dư
      thành hai trăm. Vì gọi qua đối tượng tự đưa đối tượng vào làm tham số đầu tiên,
      hai cách gọi cùng nghĩa.
  - show: '<p><b>Bước 2. Về khái niệm, đối tượng là một từ điển thuộc tính</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>a.__dict__</div><div>{''ma'':
      ''A01'', ''so_du'': 200}</div><div><span class="cm">&gt;&gt;&gt; </span>isinstance(a,
      TaiKhoan)</div><div>True</div></div><p>Vì mỗi dòng <code>self.x = …</code> thêm
      một cặp vào từ điển của đối tượng, <code>a.__dict__</code> cho thấy đúng hai
      cặp <code>ma</code> và <code>so_du</code> (lớp khai báo trước chỗ chứa, ở phần
      quy mô, thì không có từ điển này; từ Python 3.11 máy dựng từ điển đó muộn, chỉ
      khi cần). <code>isinstance(a, TaiKhoan)</code> hỏi <code>a</code> có phải đối
      tượng của lớp <code>TaiKhoan</code> (hoặc lớp con của nó) không: đúng hoặc sai.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    introduces:
    - pyt_isinstance
    clear: true
    say: Bước hai, đối tượng bên trong là gì. Vì mỗi dòng gán qua đối tượng thêm một
      cặp vào từ điển riêng của nó, ta nhìn thẳng vào từ điển đó và thấy hai cặp,
      mã và số dư. Về mặt khái niệm, đối tượng thường là một từ điển thuộc tính kèm
      liên kết tới lớp, và từ phiên bản ba chấm mười một máy dựng từ điển đó muộn,
      chỉ khi cần. Câu hỏi cuối hỏi a có phải đối tượng của lớp tài khoản không, và
      máy trả lời đúng.
  - show: '<p><b>Bước 3. Phương thức rút kiểm tra điều kiện trước khi đổi số dư</b></p><div
      class="code"><div><span class="kw">def</span> rut(self, tien):</div><div>    <span
      class="kw">if</span> tien &gt; self.so_du:</div><div>        <span class="kw">return</span>
      <span class="kw">False</span></div><div>    self.so_du = self.so_du - tien</div><div>    <span
      class="kw">return</span> <span class="kw">True</span></div></div><p>Python <b>không
      cấm</b> gán thẳng: <code>a.so_du = -999</code> vẫn chạy. Giữ dữ liệu hợp lệ
      là <b>quy ước</b>: chỉ đổi qua phương thức.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, phương thức kiểm tra điều kiện. Phương thức rút trả về sai nếu số
      tiền lớn hơn số dư, và không đổi gì cả. Chỉ khi đủ tiền, nó trừ số dư rồi trả
      về đúng. Ngôn ngữ không ngăn ai gán thẳng một giá trị khác, nên giữ dữ liệu
      hợp lệ chỉ là quy ước.
  - show: <p><b>Bước 4. Hai đối tượng cùng nội dung chưa chắc “bằng nhau”</b></p><div
      class="code"><div><span class="kw">class</span> TaiKhoan:</div><div>    <span
      class="kw">def</span> __init__(self, ma):</div><div>        self.ma = ma</div><div>
      </div><div>a = TaiKhoan("A01")</div><div>b = TaiKhoan("A01")</div><div>print(a
      == b)</div><div>print(a <span class="kw">is</span> a, a <span class="kw">is</span>
      b)</div></div><div class="code"><div>False</div><div>True False</div></div><p>Vì
      mặc định <code>==</code> chỉ hỏi <b>cùng một đối tượng</b> hay không, hai tài
      khoản <code>A01</code> riêng biệt cho <code>False</code>. Muốn so nội dung phải
      viết thêm hàm so sánh, hoặc dùng lớp dữ liệu.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, so sánh. Vì mặc định phép so bằng chỉ hỏi có cùng một đối tượng
      không, hai tài khoản riêng biệt dù cùng mã vẫn cho sai. Muốn so nội dung, phải
      viết thêm hàm so sánh, hoặc dùng lớp dữ liệu.
- id: example
  kind: example
  title: 'Ví dụ: tài khoản nạp và rút, lớp dữ liệu, kế thừa và hợp thành'
  checks:
  - 1000000 + 500000 - 300000 == 1200000
  - 2000000 * 5 // 1000 == 10000 and 2000000 + 10000 == 2010000
  - 56 + 1000 * 8 == 8056
  steps:
  - show: '<p><b>Tệp tai_khoan.py: lớp đầy đủ (f"…{x}…" điền giá trị của x vào chuỗi)</b></p><div
      class="code"><div><span class="kw">class</span> TaiKhoan:</div><div>    <span
      class="kw">def</span> __init__(self, ma, so_du=0):</div><div>        self.ma
      = ma</div><div>        self.so_du = so_du</div><div>    <span class="kw">def</span>
      nap(self, tien):</div><div>        self.so_du = self.so_du + tien</div><div>    <span
      class="kw">def</span> rut(self, tien):</div><div>        <span class="kw">if</span>
      tien &gt; self.so_du:</div><div>            <span class="kw">return</span> <span
      class="kw">False</span></div><div>        self.so_du = self.so_du - tien</div><div>        <span
      class="kw">return</span> <span class="kw">True</span></div><div>    <span class="kw">def</span>
      __repr__(self):</div><div>        <span class="kw">return</span> f"TaiKhoan({self.ma},
      {self.so_du})"</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ví dụ một, lớp tài khoản đầy đủ. Ngoài hàm tạo và nạp, nó có phương thức
      rút kiểm tra điều kiện, và hàm hiển thị, dùng chuỗi có chỗ điền, quyết định
      dòng in đối tượng ra sao.
  - show: '<p><b>Dùng lớp: nạp, rút quá số dư, rút hợp lệ</b></p><div class="code"><div>a
      = TaiKhoan("A01", 1000000)</div><div>a.nap(500000)</div><div>print(a.rut(2000000),
      a)</div><div>print(a.rut(300000), a)</div></div><div class="code"><div>False
      TaiKhoan(A01, 1500000)</div><div>True TaiKhoan(A01, 1200000)</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Giờ ta dùng lớp. Dựng tài khoản A không một với một triệu. Nạp năm trăm nghìn
      được một triệu rưỡi. Rút hai triệu bị từ chối, trả về sai và số dư không đổi.
      Rút ba trăm nghìn thì được, trả về đúng, số dư còn một triệu hai trăm nghìn.
  - show: '<p><b>Lớp dữ liệu: chỉ cần dòng đánh dấu và ba trường</b></p><div class="code"><div><span
      class="kw">from</span> dataclasses <span class="kw">import</span> dataclass</div><div>
      </div><div>@dataclass</div><div><span class="kw">class</span> GiaoDich:</div><div>    ma:
      str</div><div>    loai: str</div><div>    tien: int</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ví dụ hai, lớp dữ liệu. Chỉ cần dòng đánh dấu và khai báo ba trường, máy
      viết giúp hàm tạo, cách hiển thị và so sánh.
  - show: '<p><b>Dùng thử: in đọc được, so sánh theo nội dung</b></p><div class="code"><div>g1
      = GiaoDich("G1", "nap", 500000)</div><div>g2 = GiaoDich("G1", "nap", 500000)</div><div>print(g1)</div><div>print(g1
      == g2, g1 <span class="kw">is</span> g2)</div></div><div class="code"><div>GiaoDich(ma=''G1'',
      loai=''nap'', tien=500000)</div><div>True False</div></div>'
    clear: true
    say: In ra đọc được ngay, và hai giao dịch cùng nội dung bằng nhau, nhưng vẫn
      là hai đối tượng khác nhau.
  - show: '<p><b>Kế thừa (1/2): lớp cha TaiKhoan</b></p><div class="code"><div><span
      class="kw">class</span> TaiKhoan:</div><div>    <span class="kw">def</span>
      __init__(self, ma, so_du=0):</div><div>        self.ma = ma</div><div>        self.so_du
      = so_du</div><div> </div><div>    <span class="kw">def</span> nap(self, tien):</div><div>        self.so_du
      = self.so_du + tien</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ví dụ ba, kế thừa. Ta bắt đầu từ lớp cha tài khoản.
  - show: '<p><b>Kế thừa (2/2): tiết kiệm là một tài khoản, thêm cộng lãi</b></p><div
      class="code"><div><span class="kw">class</span> TietKiem(TaiKhoan):</div><div>    <span
      class="kw">def</span> __init__(self, ma, so_du, lai_nghin):</div><div>        super().__init__(ma,
      so_du)</div><div>        self.lai_nghin = lai_nghin</div><div> </div><div>    <span
      class="kw">def</span> cong_lai(self):</div><div>        self.nap(self.so_du
      * self.lai_nghin // 1000)</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Lớp tiết kiệm đặt lớp tài khoản trong ngoặc, nên có sẵn mã, số dư và nạp.
      Nó gọi lớp cha để khởi tạo phần chung, rồi thêm lãi suất theo phần nghìn và
      hàm cộng lãi, tự nạp tiền lãi vào số dư.
  - show: '<p><b>Hợp thành: khách hàng CÓ một tài khoản</b></p><div class="code"><div><span
      class="kw">class</span> KhachHang:</div><div>    <span class="kw">def</span>
      __init__(self, ten, tai_khoan):</div><div>        self.ten = ten</div><div>        self.tai_khoan
      = tai_khoan</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ví dụ bốn, hợp thành. Khách hàng chứa một tài khoản làm thuộc tính, không
      kế thừa.
  - show: '<p><b>Dùng: tiết kiệm cộng lãi, rồi đưa cho khách hàng</b></p><div class="code"><div>tk
      = TietKiem("S01", 2000000, 5)</div><div>tk.cong_lai()</div><div>kh = KhachHang("Lan",
      tk)</div><div>print(kh.ten, kh.tai_khoan.so_du)</div><div>print(isinstance(tk,
      TaiKhoan))</div></div><div class="code"><div>Lan 2010000</div><div>True</div></div><p>$\frac{2\,000\,000
      \cdot 5}{1000} = 10\,000$ lãi, nên số dư $2\,010\,000$ ✓</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Ta dựng tài khoản tiết kiệm hai triệu với lãi năm phần nghìn, cộng lãi được
      mười nghìn, rồi đưa nó cho khách hàng. In ra tên khách hàng và số dư hai triệu
      không trăm mười nghìn.
    introduces:
    - cdot
  - show: '<p><b>Đo bộ nhớ, cách 1: hỏi kích thước một giá trị</b></p><div class="code"><div><span
      class="kw">import</span> sys</div><div> </div><div>print(sys.getsizeof(0))</div><div>print(sys.getsizeof([]))</div><div>print(sys.getsizeof(list(range(1000))))</div></div><div
      class="code"><div>28</div><div>56</div><div>8056</div></div><p><code>sys.getsizeof(x)</code>
      trả số <b>byte</b> của riêng <code>x</code>: danh sách $1000$ ô chiếm $56 +
      1000 \cdot 8 = 8056$ byte vì mỗi ô chỉ là một <b>con trỏ</b>: số $8$ byte ghi
      chỗ chứa giá trị thật; những gì các ô trỏ tới <b>không được tính</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    introduces:
    - pyt_getsizeof
    clear: true
    say: Cách đo thứ nhất là lệnh hỏi kích thước một giá trị. Số nguyên nhỏ chiếm
      hai mươi tám byte, danh sách rỗng năm mươi sáu byte. Danh sách một nghìn phần
      tử chiếm tám nghìn không trăm năm mươi sáu byte, bằng năm mươi sáu cộng một
      nghìn lần tám. Mỗi ô chỉ là một con trỏ, tức một số tám byte ghi chỗ chứa giá
      trị thật. Lệnh này không tính những gì các ô trỏ tới.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>str(i)</code></td><td>đổi
      sang chuỗi</td><td>đổi số <code>i</code> thành chữ, để ghép với chữ khác: <code>"A"
      + str(5)</code> ra <code>"A5"</code></td></tr><tr><td><code>[A(…) for i in range(n)]</code></td><td>danh
      sách suy ra</td><td>dựng một đối tượng cho mỗi <code>i</code> từ $0$ tới $n
      - 1$, rồi xếp tất cả vào một danh sách</td></tr><tr><td><code>dang_dung, dinh
      = tracemalloc.get_traced_memory()</code></td><td>gán hai tên cùng lúc</td><td>hàm
      trả <b>hai số</b>: số byte <b>đang dùng</b> và số byte <b>đỉnh</b>; gán theo
      thứ tự cho hai tên (ở đây chỉ dùng <code>dang_dung</code>)</td></tr></table>'
    introduces:
    - pyt_tracemalloc
    clear: true
    say: Ba điều trong khối đo. Lệnh đổi sang chuỗi biến số thành chữ. Danh sách suy
      ra dựng một đối tượng cho mỗi số. Lệnh theo dõi bộ nhớ trả hai số, byte đang
      dùng và byte đỉnh, gán cho hai tên.
  - show: '<p><b>Đo bộ nhớ, cách 2: theo dõi mọi byte chương trình đã xin thêm</b></p><div
      class="code"><div><span class="kw">import</span> tracemalloc</div><div> </div><div><span
      class="kw">class</span> A:</div><div>    <span class="kw">def</span> __init__(self,
      ma, so_du):</div><div>        self.ma = ma</div><div>        self.so_du = so_du</div><div>
      </div><div>tracemalloc.start()</div><div>xs = [A("A" + str(i), i) <span class="kw">for</span>
      i <span class="kw">in</span> range(100000)]</div><div>dang_dung, dinh = tracemalloc.get_traced_memory()</div><div>print(round(dang_dung
      / 10**6, 1), "MB")</div></div><div class="code"><div>18.5 MB</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Cách thứ hai tính cả những thứ mà đối tượng trỏ tới. Ta bật công cụ theo
      dõi bộ nhớ, dựng một trăm nghìn đối tượng, rồi hỏi số byte đang dùng và chia
      cho một triệu.
  - show: <div class='box key'><code>tracemalloc</code> đếm <b>mọi</b> byte chương
      trình đã xin thêm từ lúc bật, kể cả chuỗi và số bên trong đối tượng; chia cho
      $10^6$ ra MB (số minh hoạ, máy khác cho số khác).</div>
    clear: true
    say: Các bảng ở phần quy mô đo bằng cách này.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: bảo toàn số dư, rút bị từ chối không đổi gì'
  checks:
  - 1000000 + 500000 - 300000 == 1200000
  steps:
  - show: '<p><b>Cộng trừ tay, không qua lớp</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>1000000 + 500000 - 300000</div><div>1200000</div><div><span class="cm">&gt;&gt;&gt;
      </span>1500000 - 300000</div><div>1200000</div></div><p>Số dư cuối phải bằng
      số dư đầu cộng tổng nạp, trừ tổng rút <b>đã được chấp nhận</b>: $1\,000\,000
      + 500\,000 - 300\,000 = 1\,200\,000$. Lần rút $2\,000\,000$ bị từ chối nên không
      tính ✓</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Đường kiểm khác, cộng trừ tay. Vì số dư cuối phải bằng số dư đầu cộng tổng
      nạp, trừ tổng rút đã được chấp nhận, ta có một triệu cộng năm trăm nghìn trừ
      ba trăm nghìn bằng một triệu hai trăm nghìn.
- id: scale
  kind: concept
  title: 'Khi số đối tượng lớn dần: mỗi đối tượng tốn bộ nhớ, và có cách giảm'
  checks:
  - 100 * 10 ** 6 == 10 ** 8
  - 1000 * 10 ** 5 == 10 ** 8
  steps:
  - show: '<table class=''t''><tr><th>số đối tượng</th><th>lớp thường</th><th>lớp
      khai báo trước chỗ chứa (__slots__)</th><th>bộ ba giá trị</th></tr><tr><td>×1:
      100 000</td><td>≈ 19 MB</td><td>≈ 15 MB</td><td>≈ 16 MB</td></tr><tr><td>×10:
      1 000 000</td><td>≈ 190 MB</td><td>≈ 150 MB</td><td>≈ 160 MB</td></tr><tr><td>×1
      000 (ngoại suy): 100 000 000</td><td>≈ 19 GB</td><td>≈ 15 GB</td><td>—</td></tr></table><p
      class=''note''>Đo bằng công cụ theo dõi bộ nhớ trên máy kiểm (kể cả chuỗi và
      số bên trong); số minh hoạ; ngoại suy = nhân theo tỉ lệ từ số đã đo. Khai báo
      trước chỗ chứa: viết một dòng <code>__slots__ = ("ma", "so_du", "han_muc")</code>
      ngay dưới dòng <code>class</code>, lớp chỉ giữ đúng các thuộc tính đó.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Một trăm nghìn đối tượng lớp thường chiếm khoảng mười chín triệu byte, một
      triệu chiếm khoảng một trăm chín mươi triệu byte. Khai báo trước chỗ chứa là
      viết ngay dưới dòng khai báo lớp một dòng liệt kê đúng các thuộc tính, và nó
      giảm xuống còn khoảng một trăm năm mươi triệu byte cho một triệu. Bộ ba giá
      trị đơn giản chiếm khoảng một trăm sáu mươi triệu byte. Ngoại suy, một trăm
      triệu đối tượng lớp thường cần khoảng mười chín tỉ byte.
  - show: '<div class=''box key''><b>Đánh đổi:</b> lớp thường lưu thuộc tính theo
      kiểu từ điển linh hoạt (từ 3.11 máy dựng từ điển muộn, chỉ khi cần) nên vẫn
      tốn thêm, đổi lại linh hoạt (thêm thuộc tính lúc chạy). Khai báo trước chỗ chứa
      tiết kiệm bộ nhớ nhưng cứng hơn. Với hàng trăm triệu bản ghi, người làm nghề
      <b>không giữ hết trong bộ nhớ dạng đối tượng</b>: họ xử lý theo dòng, theo khối,
      hoặc để dữ liệu ở cơ sở dữ liệu.</div>'
    clear: true
    say: Đánh đổi là lớp thường lưu thuộc tính linh hoạt hơn, nên tốn thêm bộ nhớ.
      Khai báo trước chỗ chứa tiết kiệm bộ nhớ nhưng cứng hơn. Với hàng trăm triệu
      bản ghi, người làm nghề xử lý theo dòng, theo khối, hoặc để dữ liệu ở cơ sở
      dữ liệu.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 100 + 50 == 150
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên <code>self</code>
