    clear: true
    say: Máy tự đưa đối tượng vào làm tham số đầu, nên phương thức nhận hai giá trị
      mà chỉ khai một chỗ. Đọc dòng cuối là thấy ngay.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Đặt danh sách ở cấp
      lớp: mọi đối tượng dùng chung (<code>.append(x)</code> thêm <code>x</code> vào
      cuối).</div><div class="code"><div><span class="kw">class</span> TaiKhoan:</div><div>    lich_su
      = []</div><div> </div><div>    <span class="kw">def</span> __init__(self, ma):</div><div>        self.ma
      = ma</div><div> </div><div>    <span class="kw">def</span> nap(self, tien):</div><div>        self.lich_su.append(tien)</div></div>'
