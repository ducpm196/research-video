- id: practice
  kind: practice
  title: 'Tự làm: lớp TaiKhoan có nạp, rút và kiểm số dư'
  steps:
  - show: '<p><b>Đoạn thử cho sẵn: thêm ĐÚNG như vậy vào cuối tệp tai_khoan.py</b></p><div
      class="code"><div>a = TaiKhoan("B07", 2000000, thau_chi=500000)</div><div>print(a.rut(2400000),
      a)</div><div>print(a.rut(200000), a)</div><div>print(a.nap(600000), a)</div><div>print(a.nap(-5),
      a)</div><div>b = TaiKhoan("B08")</div><div>print(b)</div></div><p class=''note''>Cũng
      có trong <code>de.md</code>. Dựng tài khoản có <b>thấu chi</b> $500\,000$ (thấu
      chi = mức số dư được phép âm), thử rút, nạp, rồi in kết quả cùng tài khoản.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Xem đoạn thử cho sẵn và thêm đúng đoạn này vào cuối tệp. Nó dựng tài khoản
      có thấu chi, tức mức số dư được phép âm, năm trăm nghìn, thử rút và nạp, mỗi
      dòng in kết quả kèm tài khoản.
  - show: '<p><b>Đề</b>: tạo <code>tai_khoan.py</code> với lớp <code>TaiKhoan(ma,
      so_du=0, thau_chi=0)</code> (<b>thấu chi</b> = mức số dư được phép âm):</p>

      <ol><li><code>nap(tien)</code>: <code>tien &lt;= 0</code> thì trả <code>False</code>;
      ngược lại cộng và trả <code>True</code>;</li>

      <li><code>rut(tien)</code>: trả <code>False</code> (không đổi gì) nếu <code>tien
