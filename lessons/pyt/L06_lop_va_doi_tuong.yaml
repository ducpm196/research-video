      mình hợp lệ</b>: ta thoả thuận không ai sửa số dư từ bên ngoài mà bỏ qua kiểm
      tra (Python không ép, ta tự giữ kỷ luật). Khi phân vân kế thừa hay hợp thành,
      chọn <b>hợp thành</b>.</div>

