      rồi <code>b.nap(50)</code>.</p>

      <ol><li><code>a.so_du</code> bằng bao nhiêu? Vì sao?</li>

      <li>Muốn <code>b</code> là bản <b>độc lập</b> của <code>a</code>, làm thế nào?</li></ol>

      <p><b>Quyết định:</b> <code>TheNganHang</code> và <code>TaiKhoan</code>: dùng
      <b>kế thừa</b> hay <b>hợp thành</b>? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Dựng tài khoản a có một trăm đồng, gán b bằng
      a, rồi nạp năm mươi qua b. Câu một, số dư của a bằng bao nhiêu và vì sao. Câu
      hai, muốn b là bản độc lập của a thì làm thế nào. Rồi một quyết định, thẻ ngân
      hàng và tài khoản, dùng kế thừa hay hợp thành, và vì sao. Hãy dừng video và
