scenes:
- id: hook
  kind: hook
  title: 'Một triệu tài khoản trong bộ nhớ: mỗi cái tốn bao nhiêu?'
  steps:
  - show: <table class='t'><tr><th>số tài khoản nằm trong bộ nhớ</th><th>lớp thường</th><th>lớp
      có khai báo trước chỗ chứa</th><th>bộ ba giá trị</th></tr><tr><td>100 000</td><td>≈
      19 MB</td><td>≈ 15 MB</td><td>≈ 16 MB</td></tr><tr><td>1 000 000</td><td>≈ 190
      MB</td><td>≈ 150 MB</td><td>≈ 160 MB</td></tr><tr><td>100 000 000 (ngoại suy)</td><td>≈
      19 GB</td><td>≈ 15 GB</td><td>—</td></tr></table><p class='note'>“Lớp có khai
      báo trước chỗ chứa” là cách khai báo lớp tiết kiệm bộ nhớ (học ở phần quy mô);
      “bộ ba giá trị” là ba giá trị xếp thành một bộ, như ở bài 3. Mỗi số đã gồm cả
      chuỗi và số bên trong. <b>Ngoại suy</b> = nhân theo tỉ lệ từ số đã đo (ước lượng,
      chưa đo).</p>
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, một ngân hàng có một triệu tài khoản, mỗi tài khoản là một đối
      tượng có số hiệu, số dư, hạn mức. Trên máy kiểm, một triệu đối tượng như vậy
      chiếm khoảng một trăm chín mươi triệu byte, tức khoảng một trăm chín mươi byte
      mỗi đối tượng, đã tính cả chuỗi và số bên trong. Ngoại suy, tức nhân theo tỉ
      lệ từ số đã đo, một trăm triệu tài khoản cần khoảng mười chín tỉ byte.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li><b>Lớp</b> và <b>đối tượng</b> là gì, và <b>self</b> nghĩa là gì?</li>

      <li>Khi nào dùng <b>kế thừa</b>, khi nào dùng <b>hợp thành</b> (một đối tượng
      chứa đối tượng khác)?</li>

      <li>Hai đối tượng “bằng nhau” nghĩa là gì, và đối tượng tốn bao nhiêu bộ nhớ?</li></ol></div>

      '
    say: Hôm nay ta học ba điều. Lớp, đối tượng và tham số đầu tiên của phương thức.
      Kế thừa và hợp thành, tức một đối tượng chứa đối tượng khác. Hai đối tượng bằng
      nhau nghĩa là gì, và đối tượng tốn bao nhiêu bộ nhớ.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: hàm, từ điển và biến là nhãn dán'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      hàm</td><td><code>def tong_tien(gia, ty_le=10)</code>: tên + tham số + trả về;
      mỗi lần gọi có hộp biến riêng</td></tr><tr><td>② từ điển</td><td><code>{"ma":
      "A01", "so_du": 100}</code>: các cặp khoá → giá trị</td></tr><tr><td>③ biến
      là nhãn</td><td><code>b = a</code> chỉ dán thêm nhãn, không sao chép (như với
      danh sách)</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Hàm có tên, tham số và giá trị trả về, và mỗi lần gọi có hộp biến riêng.
      Từ điển là các cặp khoá và giá trị. Và biến chỉ là nhãn dán lên giá trị, nên
      gán biến này cho biến kia chỉ dán thêm nhãn, không sao chép.
- id: sym
  kind: symbol
  title: Giải mã khai báo lớp, hàm tạo, self, dấu chấm và hai dấu gạch dưới
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>class
      TaiKhoan:</code></td><td>khai báo lớp</td><td><b>bản vẽ</b>: mô tả mọi tài khoản
      có những gì và làm được gì</td></tr><tr><td><code>TaiKhoan("A01", 100)</code></td><td>tạo
      đối tượng</td><td>dựng <b>một tài khoản cụ thể</b> từ bản vẽ; mỗi lần gọi ra
      một đối tượng mới</td></tr><tr><td><code>def __init__(self, ma, so_du=0):</code></td><td>hàm
      tạo</td><td>chạy <b>ngay khi tạo</b> đối tượng; <code>self</code> là <b>chính
      đối tượng đang được dựng</b></td></tr></table>'
    say: Bảng đầu là ba thứ cơ bản. Khai báo lớp là một bản vẽ, mô tả mọi tài khoản
      có những gì và làm được những gì. Gọi tên lớp kèm các giá trị là dựng một tài
      khoản cụ thể từ bản vẽ, mỗi lần gọi ra một đối tượng mới. Hàm tạo chạy ngay
      khi dựng. Tham số đầu tiên trong nó là chính đối tượng đang được dựng.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>self.so_du
      = so_du</code></td><td>thuộc tính</td><td>gắn <b>một dữ kiện</b> vào đối tượng:
      nhãn <code>so_du</code> dán vào chính nó</td></tr><tr><td><code>a.nap(500000)</code></td><td>gọi
      phương thức</td><td>hàm nằm trong lớp; <code>a</code> tự được đưa vào làm <code>self</code></td></tr><tr><td><code>__repr__</code></td><td>cách
      hiển thị</td><td>hàm đặc biệt, tên có <b>hai dấu gạch dưới</b> hai đầu; quyết
      định đối tượng <b>in ra</b> thế nào</td></tr><tr><td><code>class B(A):</code></td><td>kế
      thừa</td><td><code>B</code> có sẵn mọi thứ của <code>A</code> và thêm của riêng
      nó; <code>super()</code> gọi lớp cha</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là bốn điều nữa. Thuộc tính là một dữ kiện gắn vào đối tượng.
      Phương thức là hàm nằm trong lớp, và khi gọi qua đối tượng thì đối tượng tự
      được đưa vào làm tham số đầu. Hàm có hai dấu gạch dưới hai đầu là hàm đặc biệt,
      hàm hiển thị quyết định đối tượng in ra thế nào. Cuối cùng, kế thừa là lớp con
      có sẵn mọi thứ của lớp cha và thêm phần riêng, và có cách gọi lớp cha.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>a
      == b</code>, <code>a is b</code></td><td>bằng nhau, cùng một đối tượng</td><td><code>==</code>
      hỏi “nội dung bằng nhau?”; <code>is</code> hỏi “cùng <b>một</b> đối tượng trong
      bộ nhớ?”</td></tr><tr><td><code>from dataclasses import dataclass</code>, <code>@dataclass</code></td><td>nạp
      công cụ, rồi lớp dữ liệu</td><td><code>from X import Y</code>: lấy riêng công
      cụ <code>Y</code> từ thư viện <code>X</code>, viết một lần ở đầu tệp; <code>@dataclass</code>
      đặt <b>ngay trước</b> lớp, nhờ máy viết giúp hàm tạo, cách hiển thị và so sánh;
      <code>ma: str</code> là ghi chú kiểu</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
    say: Bảng cuối là hai điều về so sánh và viết gọn. Dấu hai bằng hỏi nội dung có
      bằng nhau không, còn phép so sánh danh tính hỏi có cùng một đối tượng trong
      bộ nhớ không. Dòng nạp lấy riêng một công cụ từ thư viện của nó, viết một lần
      ở đầu tệp. Dòng đánh dấu lớp dữ liệu đặt ngay trước lớp, nhờ máy viết giúp hàm
      tạo, cách hiển thị và so sánh. Phần tên kèm kiểu là một ghi chú kiểu.
