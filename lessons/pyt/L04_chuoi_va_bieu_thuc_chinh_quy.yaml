      mẫu viết kém, mười bảy ký tự mất khoảng ba phần nghìn giây. Hai mươi mốt ký
      tự mất khoảng bốn mươi phần nghìn giây, hai mươi lăm ký tự mất khoảng tám trăm
      phần nghìn giây. Mẫu viết tốt cùng làm một việc chỉ mất khoảng bảy trăm phần
      tỉ giây. Ngoại suy, tức nhân theo quy luật gấp đôi mỗi ký tự đã đo, cho ba mươi
      mốt ký tự mất khoảng năm mươi mốt giây, bốn mươi mốt ký tự mất khoảng mười lăm
