      hàm mũ</b>: gấp đôi mỗi ký tự thêm vào.</div><div class=''box key''>Mẫu tương
      đương không lồng lặp, <code>a+b</code>, không bùng nổ gấp đôi mỗi ký tự: ở chuỗi
