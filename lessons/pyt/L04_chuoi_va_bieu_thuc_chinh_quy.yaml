      700 ns (với 25 ký tự)</td></tr><tr><td>31 ký tự (ngoại suy)</td><td>≈ 51 s (gấp
      đôi mỗi ký tự)</td><td>vẫn gần như tức thì</td></tr><tr><td>41 ký tự (ngoại
      suy)</td><td>≈ 15 giờ</td><td>vẫn gần như tức thì</td></tr></table><p class=''note''><b>Ngoại
      suy</b> = nhân theo quy luật đã đo để đoán quy mô lớn hơn (ước lượng, chưa đo).</p>'
    focus:
    - 1
