    clear: true
    say: Hình này giải thích vì sao số ký tự khác số byte, chuỗi tiền có bốn ký tự.
      Nhưng bộ nhớ lưu byte, và quy ước mã hoá phổ biến nhất dùng một byte cho chữ
      không dấu, còn chữ có dấu tiếng Việt cần hai hoặc ba byte. Chữ e có dấu mũ và
      dấu huyền ở đây cần ba byte. Mỗi byte là một số, viết ở hệ mười sáu bằng hai
      ký tự gồm chữ số và chữ cái a đến f. Cộng lại, bốn ký tự thành sáu byte. Vì
      thế khi đo độ dài trong bộ nhớ hay trên đường truyền, phải nói rõ đếm ký tự
      hay đếm byte.
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
