- id: formula
  kind: formula
  title: 'Suy ra từng bước: chuỗi không sửa được, tách và ghép, đếm byte, dựng mẫu'
  checks:
  - ''',''.join(''A01,chuyen,500000''.split('','')) == ''A01,chuyen,500000'''
  - len('tiền') == 4 and len('tiền'.encode('utf-8')) == 6 and 1 + 1 + 3 + 1 == 6
  - '''tiền''.encode(''utf-8'') == b''ti\xe1\xbb\x81n'''
  steps:
  - show: '<p><b>Bước 1. Chuỗi KHÔNG sửa tại chỗ: mọi lệnh cho chuỗi mới</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>s = "chuyen"</div><div><span
      class="cm">&gt;&gt;&gt; </span>s.upper()</div><div>''CHUYEN''</div><div><span
      class="cm">&gt;&gt;&gt; </span>s</div><div>''chuyen''</div><div><span class="cm">&gt;&gt;&gt;
      </span>s[0] = "C"</div><div>Traceback (most recent call last):</div><div>  File
      "&lt;stdin&gt;", line 1, in &lt;module&gt;</div><div>TypeError: ''str'' object
      does not support item assignment</div><div><span class="cm">&gt;&gt;&gt; </span>"C"
      + s[1:]</div><div>''Chuyen''</div></div><p>Vì chuỗi <b>bất biến</b>, <code>s.upper()</code>
      trả chuỗi mới và <code>s</code> vẫn nguyên; gán vào <code>s[0]</code> bị chặn.
      Muốn đổi, dựng chuỗi mới: <code>"C" + s[1:]</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, chuỗi không sửa tại chỗ. Vì chuỗi là bất biến, lệnh viết hoa trả
      về một chuỗi mới, còn chuỗi cũ vẫn nguyên. Gán thẳng vào một vị trí của chuỗi
      bị máy chặn bằng một lỗi kiểu. Muốn đổi, ta dựng chuỗi mới, ví dụ ghép chữ C
      hoa với phần còn lại từ chỉ số một.
  - show: '<div class=''box key''><b>Lưu ý về phiên bản.</b> Cách <b>hiển thị</b>
      lỗi khác nhau giữa Python 3.11 và 3.13, ở cả hai nơi chạy: cửa sổ <code>&gt;&gt;&gt;</code>
      của 3.13 in <code>&lt;python-input-N&gt;</code> kèm dòng mã và dấu <code>~^</code>;
      chạy tệp <code>.py</code> (cả 3.11 và 3.13) in đường dẫn tệp, dòng mã và dấu
      <code>~^</code> ở mỗi tầng. <b>Dòng cuối</b> (tên lỗi và nội dung) <b>giống
      nhau</b> ở mọi bản.</div>'
    clear: true
    say: Lưu ý về phiên bản. Cách hiển thị lỗi khác nhau giữa các bản, ở cả cửa sổ
      gõ lệnh lẫn khi chạy tệp, nên hình trên máy bạn có thể có thêm dòng mã và dấu
      mũ so với video. Dòng cuối, nói tên lỗi và nội dung, thì giống nhau ở mọi bản.
  - show: <p><b>Bước 2. Tách rồi ghép lại với cùng dấu thì được chuỗi cũ</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>dong = "A01,chuyen,500000"</div><div><span
      class="cm">&gt;&gt;&gt; </span>phan = dong.split(",")</div><div><span class="cm">&gt;&gt;&gt;
      </span>phan</div><div>['A01', 'chuyen', '500000']</div><div><span class="cm">&gt;&gt;&gt;
      </span>"|".join(phan)</div><div>'A01|chuyen|500000'</div><div><span class="cm">&gt;&gt;&gt;
      </span>",".join(phan) == dong</div><div>True</div></div><p>Vì tách cắt tại mỗi
      dấu <code>,</code> và ghép đặt lại đúng dấu <code>,</code> ở giữa, <code>",".join(dong.split(","))
      == dong</code> luôn đúng.</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước hai, tách và ghép. Tách chuỗi tại mỗi dấu phẩy được danh sách ba mảnh.
      Ghép lại bằng dấu gạch đứng cho chuỗi khác. Vì tách cắt tại dấu phẩy và ghép
      đặt đúng dấu phẩy đó vào giữa, ghép bằng dấu phẩy trả lại đúng chuỗi ban đầu.
      Đây là một phép thử hữu ích.
  - show: '<p><b>Bước 3. Số ký tự khác số byte</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>s = "tiền"</div><div><span class="cm">&gt;&gt;&gt;
      </span>len(s)</div><div>4</div><div><span class="cm">&gt;&gt;&gt; </span>s.encode("utf-8")</div><div>b''ti\xe1\xbb\x81n''</div><div><span
      class="cm">&gt;&gt;&gt; </span>len(s.encode("utf-8"))</div><div>6</div><div><span
      class="cm">&gt;&gt;&gt; </span>s.encode("utf-8").decode("utf-8") == s</div><div>True</div></div><p><code>.encode("utf-8")</code>
      đổi chuỗi thành <b>các byte</b> (<code>b''…''</code>; <code>\xe1</code> là một
      byte viết ở hệ $16$); <code>.decode("utf-8")</code> đổi ngược. Vì chữ <code>ề</code>
      chiếm $3$ byte: $1 + 1 + 3 + 1 = 6$ byte.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước ba, đếm byte. Lệnh mã hoá đổi chuỗi thành các byte, và lệnh giải mã
      đổi ngược lại. Chuỗi tiền có bốn ký tự, nhưng chữ có dấu chiếm ba byte, nên
      tổng là một cộng một cộng ba cộng một, bằng sáu byte. Mã hoá rồi giải mã cùng
      một quy ước thì trả lại chuỗi cũ. Nếu giải mã bằng quy ước khác, ta nhận các
      ký tự hỏng.
  - show: <p><b>Bước 4a. Dựng mẫu từ thô đến tinh</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">import</span> re</div><div><span
      class="cm">&gt;&gt;&gt; </span>dong = "10:15 GD#A0731 chuyen 1250000 VND"</div><div><span
      class="cm">&gt;&gt;&gt; </span>re.findall(r"\d+", dong)</div><div>['10', '15',
      '0731', '1250000']</div><div><span class="cm">&gt;&gt;&gt; </span>re.search(r"\d+
      VND", dong).group()</div><div>'1250000 VND'</div></div><p>Vì <code>\d+</code>
      nhặt <b>mọi</b> dãy số nên có rác; thêm <code> VND</code> ép dãy số phải đứng
      <b>ngay trước</b> chữ VND; <code>.group()</code> không đối số trả <b>cả phần
      khớp</b>.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, dựng mẫu từ thô đến tinh. Ta nạp bộ công cụ và gán một dòng nhật
      ký. Vì gạch ngược d cộng nhặt mọi dãy số nên lẫn giờ và phút. Thêm chữ đơn vị
      tiền phía sau ép dãy số phải đứng ngay trước chữ đó, và lấy phần khớp không
      đối số cho cả cụm số tiền.
  - show: '<p><b>Bước 4b. Nhóm: lấy riêng từng mảnh (tiếp phiên trên)</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>m = re.search(r"GD#(\w+)
      (\w+) (\d+)", dong)</div><div><span class="cm">&gt;&gt;&gt; </span>m.groups()</div><div>(''A0731'',
      ''chuyen'', ''1250000'')</div><div><span class="cm">&gt;&gt;&gt; </span>m.group(3)</div><div>''1250000''</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(re.search(r"xyz", dong))</div><div>None</div></div><p>Bọc
      <code>(\d+)</code> trong ngoặc để lấy riêng; thêm <code>GD#(\w+) (\w+) </code>
      ở đầu để lấy cả mã và loại: <code>m.groups()</code> là bộ ba nhóm, <code>m.group(3)</code>
      là nhóm thứ ba.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Rồi ta thêm mẫu cho mã và loại ở đầu, và bọc từng phần trong ngoặc tròn.
      Vì ngoặc tròn đánh dấu phần cần lấy, ta lấy được cả ba nhóm cùng lúc, mã A không
      bảy ba một, loại chuyển và số tiền, hoặc riêng nhóm thứ ba. Nếu dòng không khớp,
      kết quả là rỗng.
- id: example
  kind: example
  title: 'Ví dụ: đọc nhật ký, bóc mã và số tiền, bỏ dòng lỗi, cộng tổng'
  checks:
  - 500000 + 2000000 == 2500000
  - int('500.000'.replace('.', '')) == 500000
  steps:
  - show: <p><b>Tệp nhat_ky.py, phần dữ liệu</b></p><div class="code"><div><span class="kw">import</span>
      re</div><div>nhat_ky = [</div><div>    "09:01 GD#A0001 chuyen 500.000 VND",</div><div>    "09:02
      GD#A0002 rut 2.000.000 VND",</div><div>    "09:03 LOI GD#A0003 timeout",</div><div>]</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta ráp lại thành một chương trình. Nạp bộ công cụ biểu thức chính quy. Có
      ba dòng nhật ký, dòng cuối là dòng lỗi không có số tiền.
  - show: '<p><b>Phần xử lý</b></p><div class="code"><div>tong = 0</div><div><span
      class="kw">for</span> dong <span class="kw">in</span> nhat_ky:</div><div>    m
      = re.search(r"GD#(\w+) (\w+) ([\d.]+) VND", dong)</div><div>    <span class="kw">if</span>
      m <span class="kw">is</span> <span class="kw">None</span>:</div><div>        print("Bo
