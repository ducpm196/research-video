scenes:
- id: hook
  kind: hook
  title: 'Một dòng nhật ký, hai cách bóc số tiền: một cách ra rác'
  steps:
  - show: '<p><b>Dòng nhật ký: 09:01 GD#A0001 chuyen 500.000 VND</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">import</span> re</div><div><span
      class="cm">&gt;&gt;&gt; </span>dong = "09:01 GD#A0001 chuyen 500.000 VND"</div><div><span
      class="cm">&gt;&gt;&gt; </span>re.findall(r"\d+", dong)</div><div>[''09'', ''01'',
      ''0001'', ''500'', ''000'']</div><div><span class="cm">&gt;&gt;&gt; </span>re.search(r"GD#(\w+)
      \w+ ([\d.]+) VND", dong).groups()</div><div>(''A0001'', ''500.000'')</div></div><p>Cách
      thứ nhất nhặt <b>mọi dãy chữ số</b>: giờ, phút, mã, số tiền bị cắt đôi. Cách
      thứ hai mô tả <b>hình dạng</b> mong muốn.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, ngân hàng ghi hàng triệu dòng nhật ký, mỗi dòng là một câu chữ,
      có giờ, mã giao dịch, loại và số tiền. Muốn cộng tổng tiền, ta phải bóc số tiền
      ra khỏi chữ. Cách ngây thơ là nhặt mọi dãy chữ số, và ta nhận một đống rác,
      giờ phút lẫn vào, số tiền bị cắt đôi ở dấu chấm. Cách tốt hơn là mô tả hình
      dạng của thứ ta cần, và máy trả đúng mã và số tiền.
  - show: <table class='t'><tr><th>cùng một kiểu viết mẫu, cố ý viết kém</th><th>chuỗi
      dài</th><th>thời gian một lần thử (đo trên máy kiểm, số minh hoạ)</th></tr><tr><td>chữ
      a lặp 16 lần rồi chữ c</td><td>17 ký tự</td><td>≈ 3 ms</td></tr><tr><td>chữ
      a lặp 24 lần rồi chữ c</td><td>25 ký tự</td><td>≈ 800 ms</td></tr></table><p
      class='note'>ms = phần nghìn giây; µs = phần triệu giây; ns = phần tỉ giây (đơn
      vị dùng trong cả bài).</p>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Nhưng công cụ này có một cái bẫy. Một mẫu viết kém có thể khiến máy bị treo.
      Với chuỗi mười bảy ký tự, một lần thử mất khoảng ba phần nghìn giây. Chỉ thêm
      tám ký tự nữa, tức hai mươi lăm ký tự, mất khoảng tám trăm phần nghìn giây.
      Thời gian gấp đôi theo mỗi ký tự thêm vào. Hôm nay ta học cả cách bóc dữ liệu
      từ chữ, lẫn cách tránh cái bẫy này.
    clear: true
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Cắt, tìm, thay, tách, ghép <b>chuỗi</b> và <b>định dạng số</b> ra sao?</li>

      <li>Vì sao số ký tự khác số <b>byte</b>?</li>

      <li>Mô tả hình dạng chuỗi bằng <b>biểu thức chính quy</b> thế nào, và khi nào
      mẫu viết kém làm máy treo?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, cắt, tìm, thay, tách, ghép chuỗi và định
      dạng số ra sao. Hai, vì sao số ký tự khác số byte. Ba, mô tả hình dạng chuỗi
      bằng biểu thức chính quy thế nào, và khi nào mẫu viết kém làm máy treo.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: chuỗi là dãy ký tự, chỉ số và cắt lát giống danh sách'
  steps:
  - show: <p><b>Chuỗi dùng chỉ số và cắt lát như danh sách</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>ma = "GD#A0731"</div><div><span class="cm">&gt;&gt;&gt;
      </span>ma[3:]</div><div>'A0731'</div><div><span class="cm">&gt;&gt;&gt; </span>len(ma)</div><div>8</div><div><span
      class="cm">&gt;&gt;&gt; </span>ma[0] + ma[1]</div><div>'GD'</div></div><p>Chuỗi
      <code>"GD#A0731"</code> có $8$ ký tự; chỉ số bắt đầu từ $0$; lát <code>[3:]</code>
      lấy từ chỉ số $3$ tới hết.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta ôn lại hai điều. Chuỗi là một dãy ký tự, và dùng chỉ số, cắt lát giống
      danh sách. Mã giao dịch có tám ký tự, chỉ số bắt đầu từ không, và lát từ chỉ
      số ba đến hết cho phần mã tài khoản. Cộng hai chuỗi là nối chúng lại.
- id: sym
  kind: symbol
  title: Giải mã các lệnh trên chuỗi, định dạng trong chuỗi và các ký tự của mẫu
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>s.split(",")</code></td><td>tách</td><td>cắt
      <code>s</code> tại mỗi dấu <code>,</code> thành <b>danh sách</b> các mảnh</td></tr><tr><td><code>",".join(ds)</code></td><td>ghép</td><td>nối
      các chuỗi trong <code>ds</code>, đặt <code>,</code> ở giữa; ngược lại của tách</td></tr><tr><td><code>s.find(x)</code>,
      <code>s.replace(a, b)</code></td><td>tìm vị trí, thay</td><td>vị trí đầu của
      <code>x</code> (không có thì <code>-1</code>); chuỗi <b>mới</b> với <code>a</code>
      đổi thành <code>b</code></td></tr><tr><td><code>s.startswith(x)</code>, <code>s.strip()</code></td><td>bắt
      đầu bằng, cắt khoảng trắng</td><td>đúng/sai; chuỗi mới bỏ khoảng trắng hai đầu</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    say: Bảng đầu là các lệnh gắn vào chuỗi. Lệnh tách cắt chuỗi tại mỗi dấu cho trước
      thành một danh sách các mảnh. Lệnh ghép làm ngược lại, nối các chuỗi với một
      dấu ở giữa. Lệnh tìm cho vị trí đầu tiên, hoặc âm một nếu không có. Lệnh thay
      cho ra chuỗi mới. Hai lệnh nữa kiểm xem chuỗi có bắt đầu bằng gì không, và bỏ
      khoảng trắng hai đầu.
  - show: <table class='t'><tr><th>viết trong f"…{…}…"</th><th>đọc là</th><th>ví dụ
      với 1250000 và 0,0725</th></tr><tr><td><code>{x:,}</code></td><td>ngăn hàng
      nghìn</td><td><code>1,250,000</code></td></tr><tr><td><code>{x:,.2f}</code></td><td>hai
      chữ số thập phân</td><td><code>90,625.00</code> với <code>1250000 * 0.0725</code></td></tr><tr><td><code>{s:&gt;6}</code>,
      <code>{s:&lt;6}</code></td><td>canh phải, canh trái, rộng 6</td><td><code>[   A01]</code>,
      <code>[A01   ]</code></td></tr><tr><td><code>{r:.2%}</code></td><td>phần trăm</td><td><code>7.25%</code>
      với <code>0.0725</code></td></tr></table>
    focus:
    - 1
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là định dạng trong chuỗi có chỗ điền. Sau dấu hai chấm ta ghi
      cách hiển thị. Dấu phẩy ngăn hàng nghìn, giúp số tiền lớn dễ đọc hơn nhiều.
      Chữ f kèm số chữ số sau dấu thập phân cố định số chữ số lẻ. Dấu lớn hơn hay
      nhỏ hơn với một độ rộng canh phải hay canh trái. Và dấu phần trăm đổi tỉ lệ
      thành phần trăm.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>\d</code>,
      <code>\w</code>, <code>.</code></td><td>chữ số; chữ-hoặc-số-hoặc-gạch-dưới;
      ký tự bất kỳ (trừ xuống dòng)</td><td>mỗi cái khớp <b>đúng một</b> ký tự thuộc
      loại đó</td></tr><tr><td><code>+</code>, <code>*</code>, <code>?</code></td><td>một
      hoặc nhiều; không hoặc nhiều; không hoặc một</td><td>đặt sau một mục để cho
      phép <b>lặp lại</b>: <code>\d+</code> là một dãy chữ số</td></tr><tr><td><code>[\d.]</code>,
      <code>(…)</code></td><td>một ký tự trong tập; nhóm</td><td><code>[\d.]+</code>
      khớp chữ số hoặc dấu chấm; <b>nhóm</b> trong ngoặc tròn là phần ta muốn lấy
      ra</td></tr><tr><td><code>r"…"</code></td><td>chuỗi thô</td><td>dấu gạch ngược
      <code>\</code> được giữ nguyên, không bị hiểu là ký tự đặc biệt</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ ba là các ký tự của mẫu mô tả hình dạng. Gạch ngược d khớp đúng
      một chữ số, gạch ngược w khớp một chữ cái, chữ số hoặc dấu gạch dưới, và dấu
      chấm khớp một ký tự bất kỳ, trừ xuống dòng. Dấu cộng, dấu sao, dấu hỏi đặt sau
      một mục cho phép lặp lại, một hoặc nhiều, không hoặc nhiều, không hoặc một.
      Cặp ngoặc vuông là một tập ký tự, cặp ngoặc tròn là nhóm, phần ta muốn lấy ra.
      Và chuỗi thô giữ nguyên dấu gạch ngược.
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>import
      re</code></td><td>nạp bộ công cụ</td><td>mang bộ công cụ biểu thức chính quy
      có sẵn của ngôn ngữ vào chương trình</td></tr><tr><td><code>re.search(mẫu, s)</code></td><td>tìm
      lần khớp đầu</td><td>trả về đối tượng khớp, hoặc <code>None</code> nếu không
      khớp</td></tr><tr><td><code>re.findall(mẫu, s)</code></td><td>tìm mọi lần khớp</td><td>trả
      về danh sách các mảnh khớp</td></tr><tr><td><code>m.group()</code>, <code>m.group(1)</code>,
      <code>m.groups()</code></td><td>lấy phần khớp, lấy nhóm</td><td>cả phần khớp;
      nhóm thứ 1; bộ mọi nhóm</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng cuối là bốn lệnh của bộ công cụ biểu thức chính quy. Lệnh nạp mang bộ
      công cụ vào chương trình. Lệnh tìm lần khớp đầu trả về một đối tượng khớp, hoặc
      giá trị rỗng nếu không khớp. Lệnh tìm mọi lần khớp trả về danh sách. Và các
      lệnh lấy kết quả cho cả phần khớp, một nhóm, hoặc mọi nhóm.
- id: intuition
  kind: intuition
  title: 'Hình dung: một ký tự có thể là nhiều byte; mẫu trượt trên dòng chữ'
