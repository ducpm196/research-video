      height="70" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text
      x="1065.0" y="114" font-size="26" text-anchor="middle" fill="#1f2937">VND</text><text
      x="370" y="185" font-size="26" text-anchor="middle" fill="#2a78d6" font-weight="bold">nhóm
      1: \w+</text><text x="655" y="185" font-size="26" text-anchor="middle" fill="#16a34a"
      font-weight="bold">nhóm 2: \w+</text><text x="875" y="185" font-size="26" text-anchor="middle"
      fill="#d97706" font-weight="bold">nhóm 3: \d+</text><text x="750" y="270" font-size="34"
      text-anchor="middle" fill="#1f2937" font-weight="bold">mẫu:  GD#(\w+) (\w+)
      (\d+)</text><text x="750" y="330" font-size="26" text-anchor="middle" fill="#1f2937">chữ
      GD# và các dấu cách phải khớp NGUYÊN VĂN; ngoặc tròn đánh dấu phần ta lấy ra</text><text
      x="750" y="375" font-size="24" text-anchor="middle" fill="#6b7280">không khớp
      ở chỗ nào thì máy thử lại từ ký tự kế tiếp, cho tới hết dòng</text></svg></div>'
    clear: true
    say: Hình thứ hai là mẫu trượt trên dòng chữ. Mẫu gồm phần chữ phải khớp nguyên
      văn, như chữ G D và dấu thăng, cùng các nhóm đặt trong ngoặc tròn. Máy trượt
      mẫu từ trái sang phải. Chỗ nào khớp đủ thì dừng, và các nhóm là các mảnh ta
      lấy ra, ở đây mã, loại và số tiền. Không khớp ở chỗ nào thì máy thử lại từ ký
