- id: formula
  kind: formula
  title: 'Suy ra từng bước: tên mô-đun, gói, môi trường ảo, ghim phiên bản'
  checks:
  - 17 - 4 == 13
  - 500000 // 1000 == 500 and 500 < 1100
  - 5000000 // 1000 == 5000 and 2000000 // 1000 == 2000
  steps:
  - show: '<p><b>Bước 1. Tệp giao_dich.py: một hàm, và khối kiểm tên mô-đun</b></p><div
      class="code"><div><span class="kw">def</span> tong_tien(ds):</div><div>    tong
      = 0</div><div>    <span class="kw">for</span> x <span class="kw">in</span> ds:</div><div>        tong
      = tong + x</div><div>    <span class="kw">return</span> tong</div><div> </div><div>print("__name__
      =", __name__)</div><div><span class="kw">if</span> __name__ == "__main__":</div><div>    print("tu
      kiem:", tong_tien([100, 200]))</div></div><p>Dòng đầu tiên in tên mô-đun hiện
      tại <code>__name__</code>; khối <code>if</code> ở cuối chỉ chạy khi tệp này
      được chạy trực tiếp.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, tên mô-đun. Đây là tệp giao dịch, gồm một hàm cộng danh sách. Vì
      ta cần biết tệp đang được chạy trực tiếp hay bị nạp, dòng in đầu tiên cho thấy
      giá trị của biến tên mô-đun. Khối kiểm ở cuối chỉ chạy khi chính tệp này được
      chạy trực tiếp.
  - show: '<p><b>Tệp chay.py nạp giao_dich.py</b></p><div class="code"><div><span
      class="kw">import</span> giao_dich</div><div> </div><div>print(giao_dich.tong_tien([500000,
      250000]))</div></div><p><b>Cùng một tệp, hai cách chạy, hai giá trị __name__</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>python giao_dich.py</div><div>__name__
      = __main__</div><div>tu kiem: 300</div><div><span class="cm"><span>&#36;</span>
      </span>python chay.py</div><div>__name__ = giao_dich</div><div>750000</div></div><p>Vì
      khi chạy trực tiếp <code>__name__</code> là <code>"__main__"</code>, khối tự
      kiểm chạy; khi <b>bị nạp</b> nó là <code>"giao_dich"</code> nên khối đó <b>không</b>
      chạy, và <code>chay.py</code> chỉ nhận hàm.</p>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Cùng một tệp, chạy trực tiếp thì biến tên nhận chữ đặc biệt đó, nên khối
      tự kiểm chạy và in ba trăm. Khi tệp chay nạp nó, biến tên bằng tên mô-đun, nên
      khối tự kiểm không chạy, và tệp gọi chỉ nhận hàm để dùng, in bảy trăm năm mươi
      nghìn. Nhờ vậy một tệp vừa là chương trình vừa là thư viện.
  - show: '<p><b>Bước 2. Gói ngan_hang: tệp ngan_hang/phi.py</b></p><div class="code"><div><span
      class="kw">def</span> phi_chuyen(tien):</div><div>    phi = tien // 1000</div><div>    <span
      class="kw">if</span> phi &lt; 1100:</div><div>        <span class="kw">return</span>
      1100</div><div>    <span class="kw">return</span> phi</div></div><p><b>Tệp chay_goi.py
      nạp hàm từ gói</b></p><div class="code"><div><span class="kw">from</span> ngan_hang.phi
      <span class="kw">import</span> phi_chuyen</div><div><span class="kw">import</span>
      ngan_hang.phi <span class="kw">as</span> p</div><div> </div><div>print(phi_chuyen(500000),
      phi_chuyen(5000000))</div><div>print(p.phi_chuyen(2000000))</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước hai, ta gói các tệp liên quan vào một thư mục chung gọi là gói. Thư
      mục ngân hàng chứa một mô-đun tính phí chuyển. Phí bằng số tiền chia một nghìn,
      nhưng thấp nhất là một nghìn một trăm. Tệp chạy nạp hàm đó từ bên trong gói,
      theo hai cách, và in vài phí thử.
  - show: '<p><b>Thư mục có __init__.py (tệp rỗng) là gói; nạp bằng dấu chấm</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>ls ngan_hang</div><div>__init__.py  phi.py</div><div><span
      class="cm"><span>&#36;</span> </span>python chay_goi.py</div><div>1100 5000</div><div>2000</div></div><p>Tệp
      <code>__init__.py</code> (có thể rỗng) đánh dấu rõ thư mục là <b>gói</b>; từ
      Python $3.3$ thiếu nó vẫn nạp được, nhưng nên có. Dấu chấm đi vào bên trong:
      <code>ngan_hang.phi</code>. Phí chuyển $500\,000$ chia $1000$ chỉ được $500$,
      thấp hơn mức tối thiểu, nên lấy $1\,100$.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Tệp đánh dấu đặc biệt, có thể rỗng, cho biết rõ thư mục là gói. Từ phiên
      bản ba chấm ba, thiếu tệp này máy vẫn nạp được, nhưng nên có để ý định rõ ràng.
      Dấu chấm đi vào bên trong gói. Phí chuyển năm trăm nghìn chia một nghìn bằng
      năm trăm, thấp hơn mức tối thiểu, nên phí là một nghìn một trăm.
  - show: '<p><b>Bước 3. Môi trường ảo là một bản Python riêng, chưa có thư viện nào</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>python -m venv
      .venv</div><div><span class="cm"><span>&#36;</span> </span>python -c "import
      sys; print(sys.prefix != sys.base_prefix)"</div><div>False</div><div><span class="cm"><span>&#36;</span>
      </span>.venv/Scripts/python -c "import sys; print(sys.prefix != sys.base_prefix)"</div><div>True</div><div><span
      class="cm"><span>&#36;</span> </span>.venv/Scripts/python -c "import numpy"
      2&gt;&amp;1 | tail -n 1</div><div>ModuleNotFoundError: No module named ''numpy''</div></div><p>Vì
      <code>python -m venv .venv</code> dựng bản riêng, <code>sys.prefix</code> (thư
      mục của bản đang chạy) của nó <b>khác</b> <code>sys.base_prefix</code> (thư
      mục của Python hệ thống): <code>True</code>; Python hệ thống thì hai thư mục
      trùng nhau (<code>False</code>). <code>python -c "…"</code> chạy ngay một dòng
      mã đặt trong ngoặc kép, không cần tệp; trong đó dấu <code>;</code> ngăn hai
      câu lệnh trên một dòng, <code>!=</code> là “khác”. Bản mới <b>chưa có</b> <code>numpy</code>:
      phải cài vào.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    introduces:
    - pyt_sys_prefix
    clear: true
    say: Bước ba, môi trường ảo. Sau khi tạo, ta hỏi hai bản bằng cách chạy ngay một
      dòng mã đặt trong ngoặc kép, không cần tệp. Dấu chấm phẩy ngăn hai câu lệnh
      trên một dòng, và dòng đó so thư mục của bản đang chạy với thư mục của Python
      hệ thống. Bản hệ thống cho sai, vì hai thư mục trùng nhau, nên nó không phải
      môi trường ảo. Bản trong thư mục mới cho đúng. Và bản mới chưa có thư viện tính
      trên mảng nào, nên nạp nó báo lỗi không tìm thấy.
  - show: '<p><b>Bước 4. Ghim phiên bản: tệp danh sách là công thức tái tạo môi trường</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>grep pandas requirements.txt</div><div>pandas==3.1.1</div><div><span
      class="cm"><span>&#36;</span> </span>wc -l requirements.txt</div><div>17 requirements.txt</div></div><p>Vì
      mỗi dòng <code>tên==phiên_bản</code> chốt <b>đúng một phiên bản</b>, ai cài
      từ tệp này cũng được cùng bộ. Bốn thư viện ta cần kéo theo 13 thư viện khác:
      tệp có $17$ dòng. Lệnh <code>pip freeze</code> in đúng dạng này cho mọi thư
      viện đang cài, nên dùng nó để sinh tệp.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước bốn, ghim phiên bản. Mỗi dòng ghi tên và đúng một phiên bản, nên ai
      cài từ tệp này cũng được cùng một bộ. Ở đây hai thư viện chính có phiên bản
      cố định. Tệp có mười bảy dòng, nghĩa là bốn thư viện ta cần kéo theo mười ba
      thư viện khác. Lệnh liệt kê các thư viện đang cài in đúng dạng này, nên ta dùng
      nó để sinh tệp.
- id: example
  kind: example
  title: 'Ví dụ: chia dự án thành mô-đun, kích hoạt môi trường, cài từ danh sách'
  checks:
  - 1100 > 500
  steps:
  - show: '<p><b>Kích hoạt môi trường ảo trong Git Bash</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m venv .venv</div><div><span class="cm"><span>&#36;</span>
      </span>source .venv/Scripts/activate &amp;&amp; python -c "import sys; print(sys.prefix
      != sys.base_prefix)"</div><div>True</div></div><p>Sau <code>source .venv/Scripts/activate</code>,
      lệnh <code>python</code> trong cửa sổ này là bản của <code>.venv</code> (<code>True</code>).
      Dấu nhắc thường hiện thêm <code>(.venv)</code> ở đầu dòng. <code>A &amp;&amp;
      B</code>: chạy <code>A</code>, <b>chỉ khi A thành công</b> (mã thoát $0$) mới
      chạy <code>B</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Ví dụ một, kích hoạt. Tạo môi trường rồi dùng lệnh kích hoạt trong cửa sổ
      lệnh. Hai dấu và nối hai lệnh: lệnh sau chỉ chạy nếu lệnh trước thành công.
      Từ đó lệnh chạy trong cửa sổ này là bản của môi trường, và máy trả lời đúng.'
  - show: <div class="code"><div><span class="cm"><span>&#36;</span> </span>source
      .venv/Scripts/activate</div><div><span class="cm"><span>&#36;</span> </span>pip
      install -r requirements.txt</div><div><span class="cm"><span>&#36;</span> </span>python
      chay.py</div></div><p>Ba lệnh dựng lại môi trường từ tệp danh sách ở máy mới
      (bước cài cần mạng nên video không chạy; kết quả bạn sẽ kiểm bằng bài tự làm).</p>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ví dụ hai, dựng môi trường ở máy mới. Kích hoạt môi trường, cài theo tệp
      danh sách, rồi chạy chương trình. Bước cài cần mạng nên video không chạy, bạn
      sẽ kiểm nó trong bài tự làm.
  - show: '<p><b>Tệp khong_guard.py: hàm cộng, và một dòng in thử ở ngoài cùng</b></p><div
      class="code"><div><span class="kw">def</span> tong_tien(ds):</div><div>    tong
      = 0</div><div>    <span class="kw">for</span> x <span class="kw">in</span> ds:</div><div>        tong
      = tong + x</div><div>    <span class="kw">return</span> tong</div><div> </div><div>
      </div><div>print("chay thu:", tong_tien([1, 2, 3]))</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ví dụ ba, hậu quả khi quên khối kiểm tên mô-đun. Tệp này có hàm cộng và một
      dòng in thử ở ngoài cùng, không nằm trong khối kiểm.
  - show: '<p><b>Quên khối kiểm tên mô-đun: nạp là chạy luôn</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -c "import khong_guard"</div><div>chay
      thu: 6</div></div><p>Tệp không có <code>if __name__ == "__main__":</code> nên
      <b>mọi dòng chạy ngay khi bị nạp</b>, kể cả dòng in thử. Gói mã thử vào khối
      kiểm tên mô-đun.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Chỉ nạp tệp đó vào từ nơi khác mà dòng in thử cũng chạy. Hãy gói mã thử vào
      khối kiểm tên mô-đun.
  - show: '<p><b>Tệp csv.py: do ta tự viết, vô tình trùng tên</b></p><div class="code"><div><span
      class="cm"># tep tu viet, vo tinh trung ten voi bo csv co san</span></div></div><p><b>Tệp
      chay.py: nạp bộ csv có sẵn rồi in lớp đọc bảng</b></p><div class="code"><div><span
      class="kw">import</span> csv</div><div> </div><div>print(csv.DictReader)</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Ví dụ bốn, trùng tên. Trong thư mục có hai tệp. Tệp thứ nhất do ta tự viết,
      tình cờ mang đúng tên của bộ đọc bảng có sẵn. Tệp thứ hai nạp bộ đọc bảng rồi
      in tên lớp đọc.
  - show: '<p><b>Tệp tên csv.py che mất bộ csv có sẵn; đổi tên là hết</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>python chay.py
      2&gt;&amp;1 | tail -n 1 | cut -c1-58</div><div>AttributeError: module ''csv''
      has no attribute ''DictReader''</div><div><span class="cm"><span>&#36;</span>
      </span>mv csv.py csv_cua_toi.py</div><div><span class="cm"><span>&#36;</span>
      </span>python chay.py</div><div>&lt;class ''csv.DictReader''&gt;</div></div><p>Đọc
      dòng cuối: mô-đun <code>csv</code> không có <code>DictReader</code>, vì máy
      nạp <b>tệp của bạn</b>. Đổi tên tệp, bộ có sẵn trở lại. Lệnh đầu lấy dòng cuối
      của thông báo (<code>tail -n 1</code>) rồi chỉ giữ $58$ ký tự đầu (<code>cut
      -c1-58</code>): từ Python $3.13$ dòng đó còn dài thêm gợi ý đổi tên tệp.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta chạy chương trình. Máy nạp tệp của ta nên báo mô-đun không có lớp đọc
      bảng. Lệnh đầu giữ năm mươi tám ký tự đầu của dòng cuối, vì từ phiên bản ba
      chấm mười ba dòng này dài thêm gợi ý. Đổi tên tệp của mình, bộ có sẵn trở lại
      và lớp được tìm thấy.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: hai cách xác nhận đang ở môi trường ảo'
  checks:
  - True != False
  steps:
  - show: '<p><b>Cách 1: hỏi sys.prefix</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>python -c "import sys; print(sys.prefix != sys.base_prefix)"</div><div>False</div><div><span
      class="cm"><span>&#36;</span> </span>.venv/Scripts/python -c "import sys; print(sys.prefix
