      hàm</td><td>gói một việc, nhận tham số, trả về; ta đã dùng <code>import re</code>,
      <code>import json</code> để mang bộ công cụ có sẵn vào</td></tr><tr><td>② tệp
      và thư mục</td><td>tệp <code>chay.py</code> nằm trong một thư mục; đường dẫn
      ghép bằng <code>/</code></td></tr><tr><td>③ biến PATH</td><td>máy tìm chương
      trình <code>python</code> theo danh sách thư mục trong <code>PATH</code>; thứ
      tự quyết định cái nào thắng</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Ta ôn lại ba điều. Hàm gói một việc, và ta đã dùng lệnh nạp để mang các bộ
      công cụ có sẵn vào chương trình. Tệp nằm trong thư mục, và đường dẫn ghép bằng
      dấu gạch chéo. Và biến tìm đường cho biết máy tìm một chương trình ở những thư
      mục nào, thứ tự quyết định cái nào thắng.
- id: sym
  kind: symbol
  title: Giải mã mô-đun, gói, lệnh nạp, tên mô-đun, lệnh cửa sổ lệnh và môi trường
    ảo
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td>tệp
      <code>giao_dich.py</code></td><td>mô-đun</td><td><b>một tệp</b> mã; tên mô-đun
      là tên tệp bỏ đuôi <code>.py</code></td></tr><tr><td>thư mục có <code>__init__.py</code></td><td>gói</td><td><b>một
      thư mục</b> các mô-đun; tệp <code>__init__.py</code> (có thể rỗng) đánh dấu
      nó là gói</td></tr><tr><td><code>import x</code>, <code>from x import f</code>,
      <code>import x as y</code></td><td>ba cách nạp</td><td>mang cả <code>x</code>;
      chỉ lấy <code>f</code>; đặt tên ngắn <code>y</code> cho <code>x</code></td></tr><tr><td><code>if
      __name__ == "__main__":</code></td><td>chỉ khi chạy trực tiếp</td><td><code>__name__</code>
      là <code>"__main__"</code> khi chạy tệp bằng <code>python tệp.py</code>, còn
      là <b>tên mô-đun</b> khi tệp bị nạp</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng đầu là cách chia chương trình. Một tệp mã là một mô-đun, tên mô-đun
      là tên tệp bỏ đuôi. Một thư mục chứa các mô-đun và một tệp đánh dấu đặc biệt
      là một gói. Có ba cách nạp, nạp cả mô-đun, chỉ lấy một thứ, hoặc đặt tên ngắn.
      Biến tên mô-đun nhận một chữ đặc biệt khi tệp chạy trực tiếp, và nhận tên mô-đun
      khi tệp bị nạp. Nên dòng kiểm tra nó cho tệp vừa là chương trình vừa là thư
      viện.
  - show: '<table class=''t''><tr><th>viết (trong Git Bash)</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>ls
      ngan_hang</code></td><td>liệt kê</td><td>in tên các tệp trong thư mục <code>ngan_hang</code></td></tr><tr><td><code>grep
      pandas requirements.txt</code></td><td>lọc dòng</td><td>in các dòng của tệp
      có chứa chữ <code>pandas</code></td></tr><tr><td><code>wc -l requirements.txt</code></td><td>đếm
      dòng</td><td>in số dòng của tệp (<code>-l</code>: lines, dòng)</td></tr><tr><td><code>mv
      csv.py csv_cua_toi.py</code></td><td>đổi tên</td><td>đổi tên tệp (cũng dùng
      để chuyển tệp sang thư mục khác)</td></tr><tr><td><code>lệnh1 | lệnh2</code></td><td>nối
      ống</td><td>kết quả của lệnh trước thành đầu vào của lệnh sau; <code>tail -n
      1</code> giữ dòng cuối, <code>cut -c1-58</code> giữ 58 ký tự đầu</td></tr><tr><td><code>2&gt;&amp;1</code></td><td>gộp
      lỗi</td><td>đưa thông báo lỗi chung dòng với kết quả thường, để lọc được cả
      hai</td></tr><tr><td><code>python -m tên</code></td><td>chạy mô-đun</td><td><code>-m</code>
      chạy một mô-đun có sẵn theo tên: <code>python -m venv .venv</code> chạy mô-đun
      <code>venv</code></td></tr></table>'
    introduces:
    - pyt_cut
    clear: true
    say: Bảng thứ hai là các lệnh của cửa sổ lệnh. Lệnh liệt kê in tên các tệp trong
      một thư mục. Lệnh lọc in những dòng của tệp có chứa chữ cho trước. Lệnh đếm
      dòng in số dòng của tệp. Lệnh di chuyển ở đây dùng để đổi tên tệp. Dấu gạch
      đứng nối hai lệnh, kết quả của lệnh trước thành đầu vào của lệnh sau. Hai lớn
      hơn một gộp thông báo lỗi chung với kết quả thường, để lọc được cả hai. Cuối
      cùng, cờ chữ m bảo ngôn ngữ chạy một mô-đun có sẵn theo tên.
  - show: '<table class=''t''><tr><th>viết (trong Git Bash)</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>python
      -m venv .venv</code></td><td>tạo môi trường ảo</td><td>dựng thư mục <code>.venv</code>:
      <b>một bản Python riêng</b> cùng nơi chứa thư viện riêng</td></tr><tr><td><code>source
      .venv/Scripts/activate</code></td><td>kích hoạt</td><td>trong cửa sổ này, <code>python</code>
      và <code>pip</code> là của <code>.venv</code> (Windows; trên macOS và Linux:
      <code>.venv/bin/activate</code>)</td></tr><tr><td><code>pip install -r requirements.txt</code></td><td>cài
      theo danh sách</td><td><code>pip</code> là chương trình tải thư viện của người
      khác từ kho chung trên mạng (PyPI) về cài; lệnh này cài mọi thư viện ghi trong
      tệp; <code>numpy==2.4.6</code> là <b>ghim</b>: đúng phiên bản đó</td></tr><tr><td><code>pip
      freeze</code></td><td>liệt kê đã cài</td><td>in mọi thư viện đang cài, kèm phiên
      bản, đúng dạng của <code>requirements.txt</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    introduces:
    - pyt_pip
    clear: true
    say: Bảng thứ ba là môi trường ảo. Lệnh tạo dựng một thư mục chứa một bản ngôn
      ngữ riêng cùng nơi chứa thư viện riêng. Lệnh kích hoạt làm cho trong cửa sổ
      này, lệnh chạy và lệnh cài đều là của môi trường đó. Công cụ cài đặt là chương
      trình tải thư viện của người khác từ một kho chung trên mạng. Lệnh cài theo
      danh sách cài mọi thư viện trong tệp, và dấu hai bằng ghim đúng phiên bản. Lệnh
      liệt kê in những gì đang cài, đúng dạng của tệp danh sách.
