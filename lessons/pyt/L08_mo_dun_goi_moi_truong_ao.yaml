scenes:
- id: hook
  kind: hook
  title: 'Chạy được trên máy tôi, hỏng trên máy bạn: vì phiên bản thư viện'
  steps:
  - show: '<table class=''t''><tr><th>người</th><th>cài thư viện</th><th>kết quả</th></tr><tr><td>An
      (tháng 3)</td><td>pandas bản mới nhất lúc đó</td><td>chương trình chạy đúng</td></tr><tr><td>Bình
      (tháng 9)</td><td>pandas bản mới nhất lúc đó</td><td>cùng chương trình, in số
      khác hoặc báo lỗi</td></tr></table><p>Hai người cùng mã, khác <b>phiên bản thư
      viện</b>: một số hàm đổi hành vi giữa các phiên bản. Không ai sửa mã, nhưng
      kết quả đã đổi.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, hai đồng nghiệp cùng chạy một chương trình. An cài thư viện vào
      tháng ba, Bình cài vào tháng chín. Không ai sửa một dòng mã, nhưng chương trình
      của An chạy đúng còn của Bình in số khác hoặc báo lỗi. Hôm nay ta học cách chia
      chương trình thành nhiều tệp, và cách cố định môi trường để chạy ở đâu cũng
      giống nhau.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Chia chương trình thành <b>mô-đun</b> và <b>gói</b> thế nào, và dòng
      kiểm tra <b>tên mô-đun</b> để làm gì?</li>

      <li><b>Môi trường ảo</b> là gì, và vì sao mỗi dự án nên có một cái riêng?</li>

      <li><b>Ghim phiên bản</b> trong tệp danh sách thư viện để người khác cài giống
      hệt ra sao?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, chia chương trình thành mô-đun và gói
      thế nào, và dòng kiểm tra tên mô-đun để làm gì. Hai, môi trường ảo là gì, và
      vì sao mỗi dự án nên có một cái riêng. Ba, ghim phiên bản trong tệp danh sách
      thư viện để người khác cài giống hệt ra sao.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: hàm, tệp, và thư mục chứa chương trình'
  steps:
