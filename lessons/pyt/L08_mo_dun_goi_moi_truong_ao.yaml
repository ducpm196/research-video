    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là đặt tên tệp trùng bộ công cụ có sẵn. Thông
      báo nói không có thuộc tính dù bạn nạp đúng tên, vì máy nạp tệp của bạn. Phép
      thử là in đường dẫn tệp của mô-đun, cho thấy tệp nào đã được nạp.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Quên kích hoạt môi
      trường rồi cài thư viện: cài nhầm vào Python hệ thống.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -c "import sys; print(sys.prefix
      != sys.base_prefix)"</div><div>False</div><div><span class="cm"><span>&#36;</span>
      </span>.venv/Scripts/python -c "import sys; print(sys.prefix != sys.base_prefix)"</div><div>True</div></div><p>Phép
      thử: trước khi <code>pip install</code>, hỏi <code>sys.prefix != sys.base_prefix</code>;
      nếu <code>False</code> thì <b>chưa</b> ở trong môi trường ảo. Cài nhầm làm các
      dự án khác đổi phiên bản mà không ai hay.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là quên kích hoạt môi trường rồi cài thư
      viện, nên cài nhầm vào bản hệ thống. Cách phòng là hỏi trước khi cài. Nếu câu
      trả lời là sai thì chưa ở trong môi trường ảo. Cài nhầm làm các dự án khác đổi
      phiên bản mà không ai biết.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Không ghim phiên
      bản, hoặc ghim lỏng (<code>pandas&gt;=2</code>).</div><p>Mỗi lần cài có thể
      được bộ <b>khác</b>: kết quả hôm nay và tháng sau lệch nhau. Ghim <code>==</code>
      cho dự án chạy thật; sinh tệp bằng <code>pip freeze</code>; nâng phiên bản <b>có
