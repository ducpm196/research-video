scenes:
- id: hook
  kind: hook
  title: 'Đổi một dấu so sánh: giao dịch 50 000 đồng được miễn phí nhầm'
  steps:
  - show: '<p><b>Tệp phi.py (đúng): phí chuyển khoản theo số tiền</b></p><div class="code"><div><span
      class="kw">def</span> phi_chuyen(tien):</div><div>    <span class="kw">if</span>
      tien &lt; 50000:</div><div>        <span class="kw">return</span> 0</div><div>    phi
      = tien // 1000</div><div>    <span class="kw">if</span> phi &lt; 1100:</div><div>        <span
      class="kw">return</span> 1100</div><div>    <span class="kw">if</span> phi &gt;
      11000:</div><div>        <span class="kw">return</span> 11000</div><div>    <span
      class="kw">return</span> phi</div></div><p><b>Sửa một dòng vào thứ sáu</b></p><div
      class="code"><div>- if tien &lt; 50000:</div><div>+ if tien &lt;= 50000:</div></div><p>Bản
      sửa (<b>diff</b>): <code>-</code> bỏ dòng, <code>+</code> thay dòng vào.</p>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: 'Hôm thứ sáu có người sửa một dòng. Trong bản sửa, dòng có dấu trừ bị bỏ,
      dòng có dấu cộng thay vào: đổi dấu nhỏ hơn thành nhỏ hơn hoặc bằng. Giao dịch
      đúng năm mươi nghìn đồng phải mất phí tối thiểu một nghìn một trăm đồng, nay
      được miễn phí nhầm.'
  - show: '<p><b>Chạy bảy ca kiểm: sáu ca qua, một ca đỏ</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m pytest -q --tb=short</div><div>..F....                                                                  [100%]</div><div>==================================
      FAILURES ===================================</div><div>____________________________
      test_bien[50000-1100] ____________________________</div><div>test_phi.py:12:
      in test_bien</div><div>    assert phi_chuyen(tien) == phi</div><div>E   assert
      0 == 1100</div><div>E    +  where 0 = phi_chuyen(50000)</div><div>===========================
      short test summary info ===========================</div><div>FAILED test_phi.py::test_bien[50000-1100]
      - assert 0 == 1100</div><div>1 failed, 6 passed in 0.12s</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - pyt_assert
    clear: true
    say: 'Bảy ca kiểm chạy tự động, sáu ca qua, đúng một ca đỏ, chính là ca đặt ở
      đúng biên năm mươi nghìn. Dòng đầu có bảy ký tự, mỗi ca một ký tự, và chữ hoa
      F là ca đỏ. Máy chỉ ra ca nào hỏng và giá trị nào: máy nhận được không, mong
      đợi một nghìn một trăm. Dòng bắt đầu bằng chữ khẳng định là điều ta tin là đúng,
      và ở đây nó sai.'
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Viết một <b>ca kiểm</b> thế nào, và đọc kết quả <b>xanh – đỏ</b> ra
      sao?</li>

      <li>Chọn <b>ca biên</b> ở đâu, vì sao lỗi hay nằm đúng chỗ đổi nhánh?</li>

      <li>Khi mã lớn dần, <b>kiểm thử tự động</b> giúp gì so với kiểm tay, và những
      ca kiểm nào <b>không</b> giúp được gì?</li></ol></div>

      '
    say: Hôm nay ta học viết một ca kiểm và đọc kết quả xanh đỏ, chọn ca biên, và
      xem kiểm thử tự động giúp gì khi mã lớn dần, cùng những ca kiểm không giúp được
      gì.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: hàm, ngoại lệ, mô-đun và môi trường ảo'
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      hàm và giá trị trả về</td><td><code>phi_chuyen(tien)</code> nhận số tiền, <b>trả
      về</b> phí</td></tr><tr><td>② tệp là mô-đun</td><td><code>from phi import phi_chuyen</code>
      nạp hàm từ tệp <code>phi.py</code> cùng thư mục</td></tr><tr><td>③ môi trường
      ảo</td><td>công cụ kiểm thử cài trong môi trường ảo, từ tệp ghim của khoá</td></tr><tr><td>④
      lỗi (ngoại lệ)</td><td>một điều sai làm chương trình dừng với thông báo rõ;
      ca kiểm sẽ dùng chính cơ chế này</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Hàm nhận số tiền và trả về phí. Tệp là mô-đun, nạp hàm từ tệp cùng thư mục.
      Công cụ kiểm thử được cài trong môi trường ảo từ tệp ghim của khoá. Và một điều
      sai làm chương trình dừng với thông báo rõ, đó là ý của ngoại lệ, mà ca kiểm
      sẽ dùng.
- id: sym
  kind: symbol
  title: Giải mã tệp kiểm, khẳng định, dấu chấm và chữ F, tham số hoá và so số thực
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td>tệp
      <code>test_phi.py</code>, hàm <code>def test_…():</code></td><td>tệp kiểm, ca
      kiểm</td><td>tên tệp và tên hàm <b>bắt đầu bằng <code>test</code></b> thì công
      cụ tự tìm và chạy</td></tr><tr><td><code>assert phi_chuyen(49999) == 0</code></td><td>khẳng
      định</td><td>một điều ta tin là đúng; <b>đúng</b> thì ca qua, <b>sai</b> thì
      ca đỏ và báo giá trị thật</td></tr><tr><td><code>python -m pytest -q <span style="white-space:nowrap">--tb=short</span></code></td><td>chạy
      mọi ca kiểm</td><td><code>-m pytest</code> = chạy mô-đun <code>pytest</code>
      theo tên (như <code>python -m venv</code> ở bài 8); <code>-q</code> = gọn; <code><span
      style="white-space:nowrap">--tb=short</span></code> = phần chi tiết của ca đỏ
      in thật ngắn; in <code>.</code> mỗi ca qua, <code>F</code> mỗi ca đỏ, rồi dòng
      tổng kết</td></tr></table>
    say: 'Tệp và hàm có tên bắt đầu bằng tiền tố quy ước thì công cụ tự tìm và chạy.
      Khẳng định là một điều ta tin là đúng: đúng thì ca qua, sai thì ca đỏ và máy
      báo giá trị thật. Trong lệnh chạy, cờ chữ m chạy một mô-đun theo tên, một cờ
      cho in gọn, một cờ cho phần chi tiết của ca đỏ thật ngắn. Máy in một dấu chấm
      cho mỗi ca qua, chữ F cho mỗi ca đỏ, rồi dòng tổng kết.'
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>@pytest.mark.parametrize("tien,
      phi", [(50000, 1100), …])</code></td><td>tham số hoá</td><td>dòng bắt đầu bằng
      <code>@</code> đứng ngay trên hàm là <b>trang trí</b>: gắn thêm hành vi cho
      hàm bên dưới, ở đây là chạy hàm đó <b>nhiều lần</b>, mỗi lần với một cặp giá
      trị trong danh sách</td></tr><tr><td><code>pytest.approx(0.3)</code></td><td>xấp
      xỉ</td><td>so số thực với một sai lệch nhỏ cho phép, thay cho <code>==</code></td></tr><tr><td><b>ca
      biên</b></td><td>ca ở sát chỗ đổi nhánh</td><td>giá trị ngay <b>trước</b>, <b>đúng
      tại</b>, và ngay <b>sau</b> một ngưỡng</td></tr></table>'
    introduces:
    - pyt_decorator
    clear: true
    say: Tham số hoá cho một hàm kiểm chạy nhiều lần, mỗi lần với một cặp giá trị.
      Dòng bắt đầu bằng dấu a còng đứng trên hàm là dòng trang trí, gắn thêm hành
      vi cho hàm bên dưới. Hàm so xấp xỉ so số thực với một sai lệch nhỏ, thay cho
      dấu hai bằng. Ca biên là ca ở sát chỗ đổi nhánh, ngay trước, đúng tại, và ngay
      sau một ngưỡng.
