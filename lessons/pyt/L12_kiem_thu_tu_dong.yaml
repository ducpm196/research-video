      x1="1090" y1="245" x2="1090" y2="230" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="750" y="350" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">vòng
      này lặp hàng chục lần mỗi ngày: máy làm thay người, không mệt và không bỏ sót</text></svg></div>'
    clear: true
    say: Hình thứ hai là vòng làm việc. Sửa mã, chạy mọi ca kiểm trong vài giây. Xanh
      thì chốt thay đổi, đỏ thì xem ca nào đỏ rồi sửa tiếp. Vòng này lặp hàng chục
      lần mỗi ngày, máy làm thay người, không mệt và không bỏ sót.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: ca kiểm đầu tiên, tham số hoá, đọc ca đỏ, vì sao chọn
    ca biên'
  checks:
  - 500000 // 1000 == 500 and 500 < 1100
  - 2 + 5 == 7
  - '[x for x in (49999, 50000, 50001) if x < 50000] == [49999] and [x for x in (49999,
    50000, 50001) if x <= 50000] == [49999, 50000]'
  steps:
  - show: '<p><b>Bước 1. Hai ca kiểm đầu: một khẳng định mỗi ca (nửa trên của test_phi.py)</b></p><div
      class="code"><div><span class="kw">import</span> pytest</div><div><span class="kw">from</span>
      phi <span class="kw">import</span> phi_chuyen</div><div><span class="kw">def</span>
      test_nho_mien_phi():</div><div>    <span class="kw">assert</span> phi_chuyen(49999)
      == 0</div><div><span class="kw">def</span> test_toi_thieu():</div><div>    <span
      class="kw">assert</span> phi_chuyen(500000) == 1100</div></div><p>Theo <b>đặc
      tả</b> (bản mô tả bằng lời: đầu vào nào thì kết quả phải là gì; <b>không</b>
      theo mã): dưới $50\,000$ phí $0$; phí là tiền chia $1000$ <b>lấy phần nguyên</b>
      (làm tròn xuống), nhưng tối thiểu $1\,100$, tối đa $11\,000$. $500\,000$ chia
      $1000$ được $500$, thấp hơn mức tối thiểu nên phí $1\,100$.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước một, hai ca kiểm đầu, mỗi ca một khẳng định. Đặc tả là bản mô tả bằng
      lời đầu vào nào thì kết quả phải là gì, và giá trị mong đợi lấy từ đó, không
      lấy từ mã. Dưới năm mươi nghìn thì phí là không. Còn lại phí là tiền chia một
      nghìn, làm tròn xuống. Năm trăm nghìn chia một nghìn được năm trăm, thấp hơn
      mức tối thiểu, nên phí là một nghìn một trăm.
  - show: '<p><b>Bước 2. Tham số hoá: một hàm, năm ca biên (nửa dưới, nối ngay sau
      nửa trên)</b></p><div class="code"><div>@pytest.mark.parametrize("tien, phi",
      [</div><div>    (50000, 1100), (1100000, 1100), (1101000, 1101),</div><div>    (11000000,
      11000), (12000000, 11000),</div><div>])</div><div><span class="kw">def</span>
      test_bien(tien, phi):</div><div>    <span class="kw">assert</span> phi_chuyen(tien)
      == phi</div></div><p>Vì mỗi cặp <code>(tiền, phí)</code> là một ca riêng, năm
      cặp thành năm ca; khi một cặp đỏ, máy nêu <b>đúng cặp nào</b>. Tổng số ca: $2
      + 5 = 7$.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước hai, tham số hoá. Một hàm kiểm với danh sách năm cặp giá trị cho năm
      ca riêng. Vì mỗi cặp là một ca, khi một cặp đỏ, máy nêu đúng cặp nào. Cộng với
      hai ca ở bước một, ta có bảy ca. Hai nửa nối liền là tệp kiểm trọn vẹn; hãy
      lưu nó cạnh tệp chứa hàm tính phí rồi chạy công cụ kiểm thử.
  - show: '<p><b>Chạy với mã đúng: bảy dấu chấm</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m pytest -q --tb=short</div><div>.......                                                                  [100%]</div><div>7
      passed in 0.05s</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chạy với mã đúng, máy in bảy dấu chấm và dòng tổng kết. Vì mỗi ca qua in
      một dấu chấm, bảy dấu chấm nghĩa là bảy ca qua.
  - show: '<div class=''box key''>Mỗi <code>.</code> là một ca qua; dòng cuối: <code>7
      passed</code>. Thời gian ghi ở cuối là số minh hoạ.</div>'
    clear: true
    say: Thời gian ghi ở cuối là số minh hoạ, do mỗi máy chạy nhanh chậm khác nhau.
  - show: <p><b>Bước 3. Đọc một ca đỏ từ dưới lên</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m pytest -q --tb=short</div><div>E   assert
      0 == 1100</div><div>E    +  where 0 = phi_chuyen(50000)</div><div>===========================
      short test summary info ===========================</div><div>FAILED test_phi.py::test_bien[50000-1100]
      - assert 0 == 1100</div><div>1 failed, 6 passed in 0.12s</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, đọc một ca đỏ từ dưới lên. Màn hình này đã rút gọn, máy thật còn
      in thêm ở phía trên hai dòng bạn đã thấy ở đầu bài. Vì dòng cuối tóm tắt tất
      cả, nó cho biết một ca đỏ, sáu ca qua.
  - show: '<div class=''box key''>Dòng cuối: <code>1 failed, 6 passed</code>. Dòng
      <code>FAILED …[50000-1100]</code>: ca có <code>tien = 50000</code>. <code>assert
      0 == 1100</code>: mã trả $0$, đặc tả đòi $1\,100$. Số <code>:12</code> là dòng
      thứ mười hai của tệp bạn gõ (không có dòng trống); thêm dòng trống thì số này
      đổi, không sao. Màn hình đã <b>rút gọn</b>: máy thật còn in thêm, phía trên,
      dòng <code>..F....</code> và dòng tiêu đề <code>FAILURES</code>.</div>'
    clear: true
    say: Dòng báo ca hỏng nêu rõ ca có số tiền năm mươi nghìn. Dòng khẳng định cho
      thấy mã trả về không, trong khi đặc tả đòi một nghìn một trăm. Vì đủ ba mẩu
      thông tin đó, ta tìm ra dòng lỗi.
  - show: '<p><b>Hai bản mã chỉ khác dòng thứ hai của hàm</b></p><div class="code"><div><span
      class="kw">if</span> tien &lt; 50000:    <span class="cm"># mã đúng</span></div><div><span
      class="kw">if</span> tien &lt;= 50000:   <span class="cm"># mã sai</span></div></div><p>Vì
      mã sai chỉ khác ở dấu <code>&lt;=</code> so với <code>&lt;</code>, <b>chỉ</b>
      giá trị <code>50000</code> cho kết quả khác; các giá trị $49\,999$ và $500\,000$
      đều ra như nhau ở cả hai bản mã. Hai ca ở bước $1$ <b>qua cả mã sai</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Vì sao chỉ một ca bắt được? Vì mã sai chỉ khác ở dấu so sánh, nên chỉ đúng
      giá trị năm mươi nghìn cho kết quả khác. Giá trị bốn mươi chín nghìn chín trăm
      chín mươi chín và năm trăm nghìn ra như nhau ở cả hai bản mã. Hai ca ở bước
      một qua cả mã sai.
- id: example
  kind: example
  title: 'Ví dụ: so số thực bằng xấp xỉ, và các ca biên của ba ngưỡng'
  checks:
  - '(lambda f, g: [f(t) == g(t) for t in (49999, 500000, 50000, 1100000, 1101000,
    11000000, 12000000)])(lambda t: 0 if t < 50000 else min(max(t // 1000, 1100),
    11000), lambda t: 0 if t <= 50000 else min(max(t // 1000, 1100), 11000)) == [True,
    True, False, True, True, True, True]'
  - 1099999 // 1000 == 1099 and max(1099, 1100) == 1100
  - 1101000 // 1000 == 1101
  - 10999999 // 1000 == 10999
  - 12000000 // 1000 == 12000 and min(12000, 11000) == 11000
  steps:
  - show: '<p><b>Tệp test_float.py: một ca so bằng ==, một ca so xấp xỉ</b></p><div
      class="code"><div><span class="kw">import</span> pytest</div><div><span class="kw">def</span>
      test_cong():</div><div>    <span class="kw">assert</span> 0.1 + 0.2 == 0.3</div><div><span
      class="kw">def</span> test_cong_dung():</div><div>    <span class="kw">assert</span>
      0.1 + 0.2 == pytest.approx(0.3)</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Ví dụ một, số thực. Đây là tệp kiểm có hai ca, lưu thành một tệp riêng. Ca
      đầu khẳng định không phẩy một cộng không phẩy hai bằng không phẩy ba, bằng dấu
      hai bằng. Ca sau khẳng định điều đó bằng hàm so xấp xỉ.
  - show: '<p><b>Số thực: so bằng == đỏ, so bằng xấp xỉ thì qua</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m pytest -q --tb=short</div><div>__________________________________
      test_cong __________________________________</div><div>test_float.py:3: in test_cong</div><div>    assert
      0.1 + 0.2 == 0.3</div><div>E   assert (0.1 + 0.2) == 0.3</div><div>===========================
      short test summary info ===========================</div><div>FAILED test_float.py::test_cong
      - assert (0.1 + 0.2) == 0.3</div><div>1 failed, 1 passed in 0.15s</div></div><p>Vì
      $0{,}1 + 0{,}2$ lệch $0{,}3$ một chút nhỏ (bài đầu khoá), ca có <code>==</code>
      đỏ: <code>assert (0.1 + 0.2) == 0.3</code>. Ca dùng xấp xỉ qua.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Nhớ rằng không phẩy một cộng không phẩy hai lệch không phẩy ba một chút nhỏ,
      từ bài đầu khoá. Ca so bằng dấu hai bằng đỏ, và máy in ra biểu thức đã khẳng
      định. Ca dùng hàm so xấp xỉ qua. Khi kiểm số thực, luôn dùng so xấp xỉ.
  - show: <table class='t'><tr><th>ngưỡng</th><th>ca trước</th><th>ca đúng tại</th><th>ca
      sau</th></tr><tr><td>50 000 (miễn phí)</td><td>49 999 → 0</td><td>50 000 → 1 100</td><td>50 001
      → 1 100</td></tr><tr><td>1 100 000 (hết tối thiểu)</td><td>1 099 999 → 1 100</td><td>1 100 000
      → 1 100</td><td>1 101 000 → 1 101</td></tr><tr><td>11 000 000 (tối đa)</td><td>10 999 999
      → 10 999</td><td>11 000 000 → 11 000</td><td>11 001 000 → 11 000</td></tr></table><p
      class='note'>Ở hai ngưỡng sau, ca “ngay sau” cách ngưỡng $1\,000$ vì phí $=$
      tiền chia $1000$ (bước nhỏ nhất làm phí đổi); ở $50\,000$ các ca cách $1$ đồng.
      Giá trị ở cột phải <b>tính tay từ đặc tả</b> (chia nghìn, <b>làm tròn xuống</b>,
      kẹp trong khoảng $[1\,100, 11\,000]$), không chạy mã để lấy.</p>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Ví dụ hai, các ca biên của ba ngưỡng. Quanh năm mươi nghìn, quanh một triệu
      một trăm nghìn, nơi hết mức tối thiểu, và quanh mười một triệu, nơi chạm mức
      tối đa. Mỗi ngưỡng có ba ca, ngay trước, đúng tại và ngay sau. Ở hai ngưỡng
      sau, ca ngay sau cách ngưỡng một nghìn đồng. Giá trị mong đợi tính tay từ đặc
      tả, chia nghìn và làm tròn xuống, rồi kẹp vào khoảng cho phép, không chạy mã
      để lấy.
  - show: <table class='t'><tr><th>ca</th><th>mã đúng</th><th>mã sai (<=)</th><th>ca
      bắt được lỗi?</th></tr><tr><td>49 999 → 0</td><td>qua</td><td>qua</td><td>không</td></tr><tr><td>500 000
      → 1 100</td><td>qua</td><td>qua</td><td>không</td></tr><tr><td>50 000 → 1 100</td><td>qua</td><td><b>đỏ
      (0)</b></td><td><b>có</b></td></tr><tr><td>1 100 000 → 1 100</td><td>qua</td><td>qua</td><td>không</td></tr><tr><td>1 101 000
      → 1 101</td><td>qua</td><td>qua</td><td>không</td></tr><tr><td>11 000 000 →
      11 000</td><td>qua</td><td>qua</td><td>không</td></tr><tr><td>12 000 000 → 11 000</td><td>qua</td><td>qua</td><td>không</td></tr></table>
    clear: true
    say: Ví dụ ba, ca nào bắt được lỗi. Với mã đúng cả bảy ca qua. Với mã sai chỉ
      khác ở dấu so sánh, sáu ca vẫn qua, và đúng một ca đỏ, ca đặt đúng tại ngưỡng
      năm mươi nghìn. Vì thế ca biên không phải là thừa, nó là ca duy nhất có giá
      trị ở đây.
  - show: '<div class=''box key''><b>Thử đột biến bằng máy.</b> Sửa hàm mỗi lần một
      chỗ: ba dấu so sánh, mỗi dấu đổi hai cách (ví dụ <code>&lt;</code> thành <code>&lt;=</code>,
      hoặc <code>&lt;</code> thành <code>&gt;</code>), là $3 \times 2 = 6$; sáu chỗ
      có hằng số (<code>50000</code> một lần, <code>1100</code> hai lần, <code>11000</code>
      hai lần, <code>1000</code> một lần), mỗi chỗ dịch lên hoặc xuống $1$, là $6
      \times 2 = 12$. Cộng lại 18 cách. 4 cách <b>không đổi kết quả ở mọi giá trị
      đã thử</b>, nên không phải lỗi; 14 cách làm hàm sai. Bảy ca của bài bắt 12 trong
      14 cách đó.</div>'
    clear: true
    say: Sửa hàm mỗi lần một chỗ. Ba dấu so sánh, mỗi dấu đổi hai cách, như nhỏ hơn
      thành nhỏ hơn hoặc bằng, hoặc thành lớn hơn. Sáu chỗ có hằng số, mỗi chỗ dịch
      lên hoặc xuống một. Cộng lại được mười tám cách. Có bốn cách không đổi kết quả
      ở đâu cả, nên không phải lỗi, và mười bốn cách làm hàm sai. Bảy ca của bài bắt
      mười hai trong số đó.
  - show: '<p>Ở $50\,000$ hàm <b>nhảy</b> (phí từ $0$ lên $1\,100$), nên đổi <code>&lt;</code>
      thành <code>&lt;=</code> lộ ra ở đúng một giá trị. Ở $1\,100\,000$ và $11\,000\,000$
      hàm <b>liền mạch</b> ($1\,100$ gặp $1\,100$; $11\,000$ gặp $11\,000$), nên đổi
      dấu ở đó cho kết quả y hệt: không ca nào bắt được, và cũng không là lỗi; ca
      sát ngưỡng ở đó kiểm <b>giá trị chặn</b>. Thêm hai ca <code>1 099 999 → 1 100</code>
      và <code>11 001 000 → 11 000</code> thì bắt 14 trong 14.</p>'
    clear: true
    say: Ở năm mươi nghìn hàm nhảy nên đổi dấu lộ ra ở đúng một giá trị. Ở hai ngưỡng
      kia hàm liền mạch, đổi dấu cho kết quả y hệt, không ca nào bắt được và cũng
      không là lỗi, nên ca sát ngưỡng ở đó kiểm giá trị chặn. Thêm hai ca, ngay trước
      ngưỡng thứ hai và ngay sau ngưỡng thứ ba, thì bắt đủ mười bốn cách.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tính tay giá trị mong đợi, và đếm số ca'
  checks:
  - '[0, max(500, 1100), 1100, 1101, min(11000, 11000), min(12000, 11000)] == [0,
    1100, 1100, 1101, 11000, 11000]'
  steps:
  - show: '<p><b>Tính tay giá trị mong đợi từ đặc tả</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>[0, 500000 // 1000, 1100000 // 1000, 1101000
      // 1000, 11000000 // 1000, 12000000 // 1000]</div><div>[0, 500, 1100, 1101,
      11000, 12000]</div><div><span class="cm">&gt;&gt;&gt; </span>[0, max(500, 1100),
      1100, 1101, min(11000, 11000), min(12000, 11000)]</div><div>[0, 1100, 1100,
      1101, 11000, 11000]</div><div><span class="cm">&gt;&gt;&gt; </span>2 + 5</div><div>7</div></div><p>Hai
      bước tính tay (chia nghìn, rồi kẹp vào $[1\,100, 11\,000]$) cho đúng các giá
      trị trong bảng ca kiểm; $2 + 5 = 7$ ca khớp dòng tổng kết. <code>max(a, b)</code>
      lấy số lớn hơn, <code>min(a, b)</code> số nhỏ hơn: dùng để kẹp.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, tính tay giá trị mong đợi từ đặc tả. Bước một chia nghìn.
      Bước hai kẹp vào khoảng từ một nghìn một trăm đến mười một nghìn, bằng lệnh
      lấy số lớn hơn và lệnh lấy số nhỏ hơn. Vì hai bước đó độc lập với mã, kết quả
      trùng với các giá trị trong bảng ca kiểm là đáng tin. Đếm số ca, hai cộng năm
      bằng bảy, khớp dòng tổng kết của máy.
- id: scale
  kind: concept
  title: 'Khi mã lớn dần: kiểm tay không theo kịp, máy chạy tự động vẫn nhanh'
  checks:
  - 100 * 30 == 3000 and 1000 * 30 == 30000 and 10000 * 30 == 300000
  - 100000 // 10000 == 10
  steps:
  - show: '<table class=''t''><tr><th>số ca kiểm</th><th>máy chạy tự động (đo, số
      minh hoạ)</th><th>người chạy tay (giả định 30 giây mỗi ca, số minh hoạ)</th></tr><tr><td>×1:
      100</td><td>≈ 800 ms</td><td>≈ 50 phút</td></tr><tr><td>×10: 1 000</td><td>≈ 2 s</td><td>≈ 8,3 giờ</td></tr><tr><td>×100:
      10 000</td><td>≈ 10 s</td><td>≈ 3,5 ngày</td></tr><tr><td>×1 000 (ngoại suy):
      100 000</td><td>≈ 2 phút</td><td>≈ 35 ngày</td></tr></table><p class=''note''>Thời
      gian máy đo trên máy kiểm, gồm cả khởi động công cụ; số minh hoạ; <b>ngoại suy</b>
      = nhân theo tỉ lệ từ số đã đo (ước lượng, chưa đo).</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bảng này cho thấy quy mô. Một trăm ca máy chạy trong khoảng tám trăm phần
      nghìn giây, một nghìn ca mất khoảng hai giây, mười nghìn ca mất khoảng mười
      giây. Giả sử một người chạy tay mỗi ca ba mươi giây, số giả định để minh hoạ.
      Khi đó một trăm ca mất khoảng năm mươi phút, một nghìn ca mất khoảng tám phẩy
      ba giờ, mười nghìn ca mất khoảng ba phẩy năm ngày. Máy tăng chậm hơn rất nhiều.
  - show: '<div class=''box key''><b>Đánh đổi:</b> ca kiểm là <b>mã bạn phải viết
      và giữ</b>: tốn công lúc đầu, và khi đặc tả đổi thì phải sửa cả ca kiểm. Đổi
      lại, mỗi lần sửa mã, máy kiểm lại <b>toàn bộ</b> trong vài giây. Ca kiểm chậm
      (gọi mạng, đọc tệp lớn) làm người ta ngại chạy: tách ca nhanh khỏi ca chậm.
      <b>Hàm thuần</b> (kết quả chỉ phụ thuộc đầu vào, không đọc tệp hay gọi mạng)
      kiểm rất nhanh.</div>'
    introduces:
    - pyt_ham_thuan
    clear: true
    say: 'Đánh đổi: ca kiểm là mã bạn phải viết và giữ, tốn công lúc đầu, và phải
      sửa khi đặc tả đổi. Đổi lại, mỗi lần sửa mã, máy kiểm lại toàn bộ trong vài
      giây. Ca kiểm chậm, như gọi mạng hay đọc tệp lớn, làm người ta ngại chạy, nên
      hãy tách ca nhanh khỏi ca chậm. Ca nhanh kiểm hàm thuần, tức hàm có kết quả
      chỉ phụ thuộc đầu vào.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - abs((0.1 + 0.2) - 0.3) < 1e-9
  - 0.1 + 0.2 != 0.3
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Khẳng định số thực bằng
      <code>==</code>.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>python -m pytest -q --tb=short</div><div>__________________________________
      test_cong __________________________________</div><div>test_float.py:3: in test_cong</div><div>    assert
      0.1 + 0.2 == 0.3</div><div>E   assert (0.1 + 0.2) == 0.3</div></div><p>Ca đỏ
      dù mã đúng. Phép thử: <b>dùng xấp xỉ</b> cho mọi so sánh số thực.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là khẳng định số thực bằng dấu hai bằng. Ca
      đỏ dù mã đúng, vì số thực lệch một chút nhỏ. Phép thử là dùng so xấp xỉ cho
      mọi so sánh số thực.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Ca kiểm không có
      khẳng định: luôn qua.</div><p><b>Tệp test_rong.py: gọi hàm, không có dòng khẳng
      định</b></p><div class="code"><div><span class="kw">from</span> phi <span class="kw">import</span>
      phi_chuyen</div><div> </div><div> </div><div><span class="kw">def</span> test_phi():</div><div>    phi_chuyen(50000)</div></div>'
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là ca kiểm không có khẳng định, chỉ gọi
      hàm rồi thôi, như trong tệp này.
  - show: '<p><b>Chạy với phi.py vẫn mang dấu nhỏ hơn hoặc bằng</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m pytest -q --tb=short</div><div>.                                                                        [100%]</div><div>1
      passed in 0.04s</div></div><p>Hàm <code>phi.py</code> vẫn <b>sai</b> (<code>&lt;=</code>)
      nhưng ca <b>xanh</b>, vì không có gì để sai. Xanh giả tệ hơn không có ca. Phép
      thử: <b>cố ý làm hỏng mã</b> (đổi dấu) rồi xem ca có đỏ không.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Hàm vẫn sai, nhưng ca xanh, vì không có gì để sai. Xanh giả tệ hơn không
      có ca kiểm, vì nó cho cảm giác an toàn. Phép thử là cố ý làm hỏng mã, ví dụ
      đổi một dấu, rồi xem ca có đỏ không.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Giá trị mong đợi
      tính bằng cùng công thức của mã: mã sai thì ca sai theo.</div><p><b>Tệp test_chep.py:
      mong đợi tính bằng chính công thức của mã</b></p><div class="code"><div><span
      class="kw">from</span> phi <span class="kw">import</span> phi_chuyen</div><div>
      </div><div> </div><div><span class="kw">def</span> test_chep():</div><div>    tien
      = 50000</div><div>    mong_doi = 0 <span class="kw">if</span> tien &lt;= 50000
      <span class="kw">else</span> max(tien // 1000, 1100)</div><div>    <span class="kw">assert</span>
      phi_chuyen(tien) == mong_doi</div></div><p><code>A if điều_kiện else B</code>
      là <b>biểu thức điều kiện một dòng</b>: lấy <code>A</code> nếu điều kiện đúng,
      nếu không thì lấy <code>B</code>. Dòng <code>mong_doi = 0 if tien &lt;= 50000
      else max(…)</code> đọc là “mong đợi bằng $0$ nếu tiền không quá $50\,000$, còn
      lại bằng số lớn hơn trong hai số”.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Lỗi thứ ba, của người đã đi làm, là tính giá trị mong đợi bằng cùng công
      thức của mã, như dòng tính ở giữa tệp kiểm này. Dòng đó là biểu thức điều kiện
      một dòng: lấy giá trị đứng đầu nếu điều kiện đúng, nếu không thì lấy giá trị
      sau từ khoá còn lại. Lệnh lấy số lớn chọn số lớn hơn trong hai số.'
  - show: <p><b>Chạy với phi.py vẫn mang dấu nhỏ hơn hoặc bằng</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m pytest -q --tb=short</div><div>.                                                                        [100%]</div><div>1
      passed in 0.03s</div></div><p>Ca <b>lặp lại đúng cái lỗi</b> (<code>&lt;=</code>)
      nên luôn khớp mã. Giá trị mong đợi phải đến từ <b>đặc tả hoặc tính tay</b>,
      độc lập với mã.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Ca lặp lại đúng cái lỗi nên luôn khớp mã, và xanh. Giá trị mong đợi phải
      đến từ đặc tả hoặc tính tay, độc lập với mã.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 10999999 // 1000 == 10999
  - min(11000000 // 1000, 11000) == 11000 and min(11001000 // 1000, 11000) == 11000
    and 11001000 // 1000 == 11001
  steps:
  - show: '<p><b>Đề.</b> Hàm <code>phi_chuyen</code> ở trên.</p>

      <ol><li>Kể ba ca biên quanh ngưỡng $11\,000\,000$ và phí mong đợi của từng ca
      (tính tay).</li>

      <li>Sau khi sửa mã, ca <code>test_bien[50000-1100]</code> vẫn đỏ. Sửa <b>ca
      kiểm</b> hay sửa <b>mã</b>?</li></ol>

      <p><b>Quyết định:</b> bạn có $5$ phút. Viết $1$ ca ở giữa vùng hay $3$ ca sát
      ngưỡng? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Câu một, kể ba ca biên quanh ngưỡng mười một
      triệu và phí mong đợi của từng ca, tính tay. Câu hai, sau khi sửa mã, ca ở năm
      mươi nghìn vẫn đỏ, sửa ca kiểm hay sửa mã. Sau đó là một quyết định, bạn có
      năm phút, viết một ca ở giữa vùng hay ba ca sát ngưỡng, và vì sao. Hãy dừng
      video và làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th></tr><tr><td>1</td><td>$10\,999\,999
      \to 10\,999$; $11\,000\,000 \to 11\,000$; $11\,001\,000 \to 11\,000$ (ngay sau,
      đã chạm mức tối đa; cách $1\,000$ vì phí $=$ tiền chia $1000$, nên phải thêm
      $1\,000$ đồng phí mới đổi một đơn vị)</td></tr><tr><td>2</td><td>sửa <b>mã</b>,
      nếu ca khớp đặc tả. Chỉ sửa ca khi <b>đặc tả đổi có chủ ý</b></td></tr></table>
    say: Đáp án như sau. Câu một, ngay trước ngưỡng cho phí mười nghìn chín trăm chín
      mươi chín. Đúng tại ngưỡng cho mười một nghìn. Ngay sau ngưỡng, mười một triệu
      một nghìn đồng, phí vẫn mười một nghìn, đã chạm mức tối đa. Câu hai, sửa mã,
      nếu ca khớp đặc tả. Chỉ sửa ca khi đặc tả đổi có chủ ý.
    clear: true
  - show: <div class='box key'><b>Quyết định:</b> <b>ba ca sát ngưỡng</b>. Ca ở giữa
      vùng thường qua cả mã sai (như hai ca ở bước $1$); lỗi sống ở chỗ đổi nhánh.
      Ở chỗ hàm <b>nhảy</b> ($50\,000$), ba ca ngay trước, đúng tại, ngay sau bắt
      lỗi đổi dấu và lỗi lệch một; ở chỗ hàm <b>liền mạch</b> ($1\,100\,000$, $11\,000\,000$),
      đổi dấu không đổi kết quả và ca sát ngưỡng kiểm giá trị chặn.</div>
    clear: true
    say: Quyết định, ba ca sát ngưỡng. Ca ở giữa vùng thường qua cả mã sai, và lỗi
      sống ở chỗ đổi nhánh. Ở chỗ hàm nhảy, ba ca ngay trước, đúng tại và ngay sau
      bắt lỗi đổi dấu và lỗi lệch một. Ở chỗ hàm liền mạch, đổi dấu không đổi kết
      quả, và ca sát ngưỡng kiểm giá trị chặn.
- id: practice
  kind: practice
  title: 'Tự làm: viết ca kiểm bắt lỗi lệch một'
  steps:
  - show: '<p><b>Đề</b> (cần môi trường ảo đã cài thư viện): hàm trong <code>de.md</code>
      cộng <code>n</code> phần tử đầu của danh sách nhưng có lỗi <b>lệch một</b> (<code>range(1,
      n)</code>). Viết <code>kiem_thu.py</code>:</p>

      <ol><li>ghi hai bản mã (<code>LOI</code> và <code>DUNG</code>) và tệp kiểm <code>test_tong.py</code>
      với <code>DS = [10, 20, 30, 40, 50]</code>, tham số hoá <b>6 ca</b> <code>n
      = 0..5</code>, giá trị mong đợi <b>tự tính tay</b>;</li>

      <li>chạy công cụ kiểm thử trên từng bản bằng <code>subprocess</code> (chạy một
      chương trình khác từ chương trình của bạn, rồi lấy đầu ra), in dòng tổng kết
      (bỏ phần thời gian): <code>Ban loi: …</code> và <code>Ban sua: …</code>.</li></ol><p
      class="note">Lưu tệp ở thư mục gốc của bộ khoá (nơi có thư mục <code>labs</code>),
      mở Git Bash tại đó để chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 1200
    say: Bây giờ tới phần bạn tự làm, trong môi trường ảo đã cài thư viện. Đề bài
      cho một hàm cộng n phần tử đầu của danh sách nhưng có lỗi lệch một. Viết một
      chương trình ghi hai bản mã, bản lỗi và bản đúng, cùng một tệp kiểm với danh
      sách năm số và sáu ca, n từ không đến năm, giá trị mong đợi tự tính tay. Rồi
      chạy công cụ kiểm thử trên từng bản bằng cách chạy một chương trình khác từ
      chương trình của mình, và in dòng tổng kết, bỏ phần thời gian. Hãy dừng video
      và làm.
    introduces:
    - pyt_subprocess
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Ban loi: 5 failed,
      1 passed</div><div>Ban sua: 6 passed</div></div><p class="note">Chấm bằng Git
      Bash: <code>bash labs/cham.sh PYT L12 kiem_thu.py</code> — in <b>ĐÚNG</b> khi
      trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> giá trị mong đợi: tổng $n$ phần tử
      đầu của $[10, 20, 30, 40, 50]$ là $0, 10, 30, 60, 100, 150$. Chạy: <code>subprocess.run([sys.executable,
      "-m", "pytest", "-q", "--tb=no", "-p", "no:cacheprovider", "test_tong.py"],
      capture_output=True, text=True)</code>; <code>.stdout</code> là chữ chương trình
      con đã in, và dòng tổng kết là dòng cuối của nó.</div>

      <div class="box key"><code>sys.executable</code> là đường dẫn tới <b>chính bản
      Python đang chạy bạn</b>, để chương trình con dùng đúng môi trường ảo; <code>capture_output=True</code>
      <b>giữ</b> đầu ra lại để bạn lấy, thay vì in thẳng ra màn hình; <code>text=True</code>
      cho đầu ra là <b>chữ</b>, không phải byte; <code>--tb=no</code> bỏ phần chi
      tiết ca đỏ, nên dòng cuối là dòng tổng kết; <code>-p no:cacheprovider</code>
      tắt thư mục nhớ tạm của công cụ. Lời giải ở <code>labs/PYT/L12/loi_giai.py</code>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Nếu kẹt, giá trị mong đợi là tổng n phần tử đầu, lần lượt không, mười, ba
      mươi, sáu mươi, một trăm, một trăm năm mươi. Chạy công cụ kiểm thử bằng lệnh
      chạy tiến trình con, rồi lấy dòng cuối của đầu ra làm tổng kết. Hãy gọi đường
      dẫn của chính bản Python đang chạy, để chương trình con dùng đúng môi trường
      ảo. Tham số giữ đầu ra cho ta lấy chữ in ra, thay vì để nó trôi lên màn hình,
      và tham số kiểu chữ cho đầu ra là chữ chứ không phải byte. Cờ bỏ chi tiết làm
      dòng cuối thành dòng tổng kết. Lời giải nằm trong thư mục thực hành, chỉ mở
      sau khi đã thử.
    introduces:
    - pyt_sys_executable
    - pyt_capture_output
  lab: labs/PYT/L12
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>ca kiểm = một khẳng định có giá
      trị mong đợi từ ĐẶC TẢ</span><span class=''a''>→</span><span class=''n''>tham
      số hoá: một hàm, nhiều ca</span><span class=''a''>→</span><span class=''n''>ca
      biên: ngay trước, đúng tại, ngay sau mỗi ngưỡng</span><span class=''a''>→</span><span
      class=''n''>số thực: so xấp xỉ</span><span class=''a''>→</span><span class=''n''>xanh
      giả: ca không khẳng định gì; cố ý làm hỏng mã để thử ca</span><span class=''a''>→</span><span
      class=''n''>mã lớn dần: máy kiểm lại tất cả trong vài giây</span></div>'
    say: Ca kiểm là một khẳng định với giá trị mong đợi lấy từ đặc tả. Tham số hoá
      cho một hàm, nhiều ca. Ca biên đặt ngay trước, đúng tại và ngay sau mỗi ngưỡng.
      Số thực thì so xấp xỉ. Xanh giả là ca không khẳng định gì, nên cố ý làm hỏng
      mã để thử ca. Và khi mã lớn dần, máy kiểm lại tất cả trong vài giây.
  - show: '<div class=''box key''><b>Tư duy:</b> hỏi “nếu mã sai, ca này có đỏ không?”.
      Ca chưa từng đỏ là ca chưa được thử. Viết ca <b>từ đặc tả</b>, đặt <b>sát ngưỡng</b>,
      và chạy sau <b>mỗi</b> thay đổi.</div>

      <p>Bài sau, bài cuối của khoá: một dự án phân tích tệp giao dịch lớn dần từ
      một nghìn đến một trăm triệu dòng, ghép mọi thứ đã học.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    forward_ref: true
    say: Điều cần mang theo, hãy hỏi nếu mã sai thì ca này có đỏ không. Ca chưa từng
      đỏ là ca chưa được thử. Viết ca từ đặc tả, đặt sát ngưỡng, và chạy sau mỗi thay
      đổi. Bài sau, bài cuối của khoá, là một dự án phân tích tệp giao dịch lớn dần
      từ một nghìn đến một trăm triệu dòng, ghép mọi thứ đã học.
    clear: true
