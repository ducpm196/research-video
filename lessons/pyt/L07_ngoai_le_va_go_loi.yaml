  - show: '<p><b>Lỗi giá trị và lỗi chia cho không</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>int(''abc'')</div><div>Traceback (most recent
      call last):</div><div>  File "&lt;stdin&gt;", line 1, in &lt;module&gt;</div><div>ValueError:
      invalid literal for int() with base 10: ''abc''</div><div><span class="cm">&gt;&gt;&gt;
      </span>10 // 0</div><div>Traceback (most recent call last):</div><div>  File
      "&lt;stdin&gt;", line 1, in &lt;module&gt;</div><div>ZeroDivisionError: integer
      division or modulo by zero</div></div><p class=''note''>Từ phiên bản $3.13$,
