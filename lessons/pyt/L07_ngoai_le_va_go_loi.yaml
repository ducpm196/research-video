    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ba dòng ở các mức thông tin, cảnh báo và lỗi hiện ra. Dòng ở mức chi tiết
      không hiện vì thấp hơn mức đã cài. Nhờ vậy khi cần xem chi tiết, ta chỉ đổi
