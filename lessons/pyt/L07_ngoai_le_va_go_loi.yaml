  - show: <table class='t'><tr><th>công cụ</th><th>khi nào dùng</th><th>cách dùng</th></tr><tr><td>traceback</td><td>chương
      trình đã chết</td><td>đọc từ dòng cuối lên; tìm nguyên nhân GỐC, không chỉ nơi
