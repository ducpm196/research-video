- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 50000 // 1 == 50000
  steps:
  - show: '<p><b>Đề.</b> Hàm <code>def rut(so_du, tien)</code> ném <code>SoDuKhongDu</code>
      khi <code>tien &gt; so_du</code>.</p>

      <ol><li>Gọi <code>rut(100, 250)</code> ngoài khối <code>try</code>: chương trình
      làm gì?</li>

      <li>Trong <code>try … finally</code>, dòng <code>print("xong")</code> ở <code>finally</code>
      hiện khi nào?</li></ol>

      <p><b>Quyết định:</b> đọc $50$ nghìn dòng dữ liệu, $1$ dòng hỏng: <b>bỏ qua
      dòng hỏng rồi chạy tiếp</b> hay <b>dừng cả chương trình</b>? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Hàm rút ném lỗi số dư không đủ khi số tiền lớn
      hơn số dư. Câu một, gọi rút một trăm với hai trăm năm mươi ngoài khối thử, chương
      trình làm gì. Câu hai, dòng in trong khối luôn làm hiện khi nào. Sau đó là một
      quyết định, đọc năm mươi nghìn dòng dữ liệu, một dòng hỏng, bỏ qua dòng hỏng
      rồi chạy tiếp hay dừng cả chương trình, và vì sao. Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th></tr><tr><td>1</td><td>lỗi
      trồi lên khỏi mọi hàm, <b>chương trình dừng</b> và in thông báo nhiều dòng;
      dòng cuối là <code>SoDuKhongDu: …</code></td></tr><tr><td>2</td><td><b>mọi trường
      hợp</b>: không lỗi, có lỗi đã bắt, có lỗi không bắt, hay <code>return</code>
      giữa chừng</td></tr></table>'
    say: Đáp án như sau. Câu một, lỗi trồi lên khỏi mọi hàm, chương trình dừng và
      in thông báo nhiều dòng với loại lỗi ở dòng cuối. Câu hai, dòng trong khối luôn
      làm hiện trong mọi trường hợp, không lỗi, có lỗi đã bắt, có lỗi không bắt, hoặc
      hàm trả về giữa chừng.
    clear: true
  - show: '<div class=''box key''><b>Quyết định:</b> <b>tuỳ hậu quả</b>. Nếu dữ liệu
      hỏng chỉ ảnh hưởng một dòng độc lập (như nhật ký): bỏ qua, nhưng <b>ghi lại</b>
      dòng nào, và đếm số dòng bỏ. Nếu sai một dòng làm sai kết quả cả mẻ (như đối
      soát tiền): <b>dừng</b>, vì một con số sai lặng lẽ tệ hơn một chương trình dừng.
      Luôn báo số dòng bỏ qua để người dùng quyết định.</div>'
    clear: true
    say: Quyết định, tuỳ hậu quả. Nếu dòng hỏng chỉ ảnh hưởng một dòng độc lập, như
      nhật ký, thì bỏ qua nhưng phải ghi lại dòng nào và đếm số dòng bỏ. Nếu sai một
      dòng làm sai kết quả cả mẻ, như đối soát tiền, thì dừng, vì một con số sai lặng
      lẽ tệ hơn một chương trình dừng. Luôn báo số dòng bỏ qua.
