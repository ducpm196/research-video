- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>traceback: đọc từ dưới lên; nơi
      lỗi xảy ra ≠ nguyên nhân gốc</span><span class=''a''>→</span><span class=''n''>bắt
      đúng loại, loại hẹp đặt trước</span><span class=''a''>→</span><span class=''n''>raise:
      ném lỗi nghiệp vụ bằng loại riêng</span><span class=''a''>→</span><span class=''n''>finally:
      việc phải làm trong mọi trường hợp</span><span class=''a''>→</span><span class=''n''>ngoại
      lệ rẻ khi hiếm, đắt khi thường xuyên</span><span class=''a''>→</span><span class=''n''>gỡ
      lỗi: nhật ký theo mức, điểm dừng</span></div>'
    say: Tổng kết chuỗi logic. Đọc thông báo lỗi từ dưới lên, và nhớ nơi lỗi xảy ra
