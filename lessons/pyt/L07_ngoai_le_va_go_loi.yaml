- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: kiểm tra trước thay cho bắt lỗi, hai đường cùng
    kết quả'
  checks:
  - '''1250''.isdigit() and not ''abc''.isdigit() and not ''''.isdigit()'
  steps:
  - show: '<p><b>Kiểm tra trước: chuỗi toàn chữ số?</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>"1250".isdigit()</div><div>True</div><div><span
      class="cm">&gt;&gt;&gt; </span>"abc".isdigit()</div><div>False</div><div><span
      class="cm">&gt;&gt;&gt; </span>"".isdigit()</div><div>False</div><div><span
      class="cm">&gt;&gt;&gt; </span>"1.250.000".isdigit()</div><div>False</div></div><p>Cách
      khác với <code>try</code>: hỏi trước. Với chuỗi <b>chỉ gồm chữ số $0$–$9$ hoặc
      chữ cái</b>, hai cách phân loại <b>giống nhau</b>: <code>"1250"</code> hợp lệ,
      <code>"abc"</code> và <code>""</code> không. Tổng hai cách cho cùng kết quả
      ở phép đo bên dưới. Nhưng chuỗi có dấu chấm như <code>"1.250.000"</code> thì
      <code>isdigit()</code> nói <code>False</code>, dù hàm ở bước $1$ đọc được: hai
      cách chỉ khớp khi dữ liệu thuộc hai loại trên.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, kiểm tra trước thay cho bắt lỗi. Hỏi chuỗi có toàn chữ số
      không. Chuỗi một nghìn hai trăm năm mươi hợp lệ, một chuỗi chữ cái và chuỗi
      rỗng thì không. Với dữ liệu chỉ gồm chữ số hoặc chữ cái, hai cách phân loại
      giống nhau, và phép đo ở phần sau đã kiểm điều này, tổng hai cách bằng nhau.
      Nhưng chuỗi có dấu chấm ngăn cách, như một triệu hai trăm năm mươi nghìn viết
      kiểu cũ, thì cách hỏi trước nói không hợp lệ, dù hàm ở bước một đọc được.
- id: scale
  kind: concept
  title: 'Khi dữ liệu lớn dần: ngoại lệ rẻ khi hiếm, đắt khi thường xuyên'
  checks:
  - 1000000 // 100 == 10000
  steps:
  - show: <table class='t'><tr><th>một triệu chuỗi, tỉ lệ chuỗi hỏng</th><th>bắt lỗi
      (try)</th><th>kiểm tra trước (isdigit)</th></tr><tr><td>0%</td><td>≈ 700 ms</td><td>≈
      900 ms</td></tr><tr><td>50%</td><td>≈ 2 s</td><td>≈ 500 ms</td></tr></table><p
      class='note'>Đo trên máy kiểm, số minh hoạ; dữ liệu chỉ gồm chuỗi toàn số hoặc
      “abc”, nên hai cách cho cùng tổng. Ở tỉ lệ hỏng rất thấp (cỡ $1\%$) hai cách
      xấp xỉ nhau, thứ tự đổi theo máy và phiên bản. Ở một nửa hỏng, bắt lỗi chậm
      hơn kiểm tra trước cỡ vài lần (tỉ số đổi theo máy); mỗi ô lấy lần nhanh nhất
      trong năm lần.</p>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bảng này đo một triệu chuỗi ở hai tỉ lệ hỏng. Khi không có chuỗi hỏng, bắt
      lỗi mất khoảng bảy trăm phần nghìn giây, kiểm tra trước mất khoảng chín trăm
      phần nghìn giây. Khi một nửa hỏng, bắt lỗi tăng lên khoảng hai giây, còn kiểm
      tra trước chỉ khoảng năm trăm phần nghìn giây. Ở tỉ lệ hỏng rất thấp, cỡ một
      phần trăm, hai cách xấp xỉ nhau. Ở một nửa hỏng, bắt lỗi chậm hơn kiểm tra trước
      cỡ vài lần, tỉ số đổi theo máy.
  - show: '<div class=''box key''><b>Đánh đổi:</b> khối <code>try</code> gần như <b>miễn
      phí khi không có lỗi</b>; mỗi lần lỗi <b>thật sự xảy ra</b> tốn một khoản đáng
      kể. Lỗi hiếm (dữ liệu sạch): dùng <code>try</code>, mã gọn hơn. Lỗi thường xuyên
      (dữ liệu bẩn, ví dụ một nửa): hỏi trước rẻ hơn. Quan trọng hơn tốc độ: <b>đừng
      dùng lỗi thay cho việc rẽ nhánh thông thường</b> khi có cách rõ ràng hơn.</div>'
    clear: true
    say: Đánh đổi là khối thử gần như miễn phí khi không có lỗi, nhưng mỗi lần lỗi
      thật sự xảy ra thì tốn một khoản đáng kể. Lỗi hiếm thì dùng khối thử, mã gọn
      hơn. Lỗi thường xuyên thì hỏi trước rẻ hơn. Và quan trọng hơn tốc độ, đừng dùng
      lỗi thay cho việc rẽ nhánh thông thường khi có cách rõ ràng hơn.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - isinstance(ValueError('x'), Exception)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Bắt sai loại: khối <code>except</code>
      không đúng loại thì lỗi vẫn thoát ra.</div><div class="code"><div><span class="kw">try</span>:</div><div>    so
      = int("abc")</div><div><span class="kw">except</span> ZeroDivisionError:</div><div>    so
