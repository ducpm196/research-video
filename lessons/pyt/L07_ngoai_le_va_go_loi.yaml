- id: formula
  kind: formula
  title: 'Suy ra từng bước: bắt đúng loại, ném lỗi của mình, finally, thứ tự các khối
    bắt'
  checks:
  - 250000 - 100000 == 150000
  - issubclass(ValueError, Exception)
  - 100 // 5 == 20
  steps:
  - show: <p><b>Bước 1. Bắt ĐÚNG loại lỗi mình dự đoán trước</b></p><div class="code"><div><span
      class="kw">def</span> doc_tien(chuoi):</div><div>    <span class="kw">try</span>:</div><div>        <span
      class="kw">return</span> int(chuoi.replace(".", ""))</div><div>    <span class="kw">except</span>
      ValueError:</div><div>        <span class="kw">return</span> <span class="kw">None</span></div><div>
      </div><div><span class="kw">for</span> s <span class="kw">in</span> ["1.250.000",
      "500000", "abc", ""]:</div><div>    print(repr(s), doc_tien(s))</div></div><div
      class="code"><div>'1.250.000' 1250000</div><div>'500000' 500000</div><div>'abc'
      None</div><div>'' None</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, bắt đúng loại lỗi mình dự đoán trước. Vì dữ liệu từ ngoài có thể
      sai định dạng, việc đổi chữ sang số có thể ném lỗi giá trị. Ta chỉ bắt loại
      lỗi đó, và trả về giá trị rỗng để nơi gọi biết đây là dữ liệu hỏng.
  - show: <div class='box key'>Vì dữ liệu từ ngoài có thể sai định dạng, <code>int(...)</code>
      có thể ném <code>ValueError</code>; ta chỉ bắt loại đó và trả <code>None</code>
      để nơi gọi biết. Lỗi loại khác (lỗi của chính ta) vẫn trồi lên. <code>repr(s)</code>
      in <code>s</code> <b>kèm cặp nháy</b>, để chuỗi rỗng hiện là <code>''</code>
      chứ không lẫn với dòng trống.</div>
    clear: true
    say: Số một triệu hai trăm năm mươi nghìn đọc đúng, chuỗi chữ cái và chuỗi rỗng
      cho giá trị rỗng. Lệnh in dạng có nháy cho ta thấy cả chuỗi rỗng là hai dấu
      nháy liền nhau. Lỗi loại khác vẫn trồi lên, vì ta không bắt chúng.
  - show: '<p><b>Bước 2. Định nghĩa loại lỗi riêng và ném khi vi phạm quy tắc</b></p><div
      class="code"><div><span class="kw">class</span> SoDuKhongDu(Exception):</div><div>    <span
      class="kw">pass</span></div><div> </div><div><span class="kw">def</span> rut(so_du,
      tien):</div><div>    <span class="kw">if</span> tien &gt; so_du:</div><div>        <span
      class="kw">raise</span> SoDuKhongDu(f"thieu {tien - so_du}")</div><div>    <span
      class="kw">return</span> so_du - tien</div></div><p>Vì rút quá số dư là lỗi
      <b>nghiệp vụ</b> chứ không phải lỗi của ngôn ngữ, ta định nghĩa loại lỗi riêng
      <code>SoDuKhongDu</code> (kế thừa lớp lỗi chung) rồi ném nó. Dòng <code>pass</code>
      nghĩa là “không làm gì”: một khối không được để trống, nên ta đặt nó ở đó. <code>f"thieu
      {x}"</code> điền giá trị của <code>x</code> vào chuỗi.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    introduces:
    - pyt_pass
    clear: true
    say: Bước hai, ném lỗi của mình. Vì rút quá số dư là lỗi nghiệp vụ chứ không phải
      lỗi của ngôn ngữ, ta định nghĩa loại lỗi riêng. Loại này kế thừa lớp lỗi chung.
      Dòng chỉ có một từ khoá ngay dưới tên lớp nghĩa là không làm gì, vì một khối
      không được để trống. Hàm rút ném lỗi đó khi số tiền vượt số dư, kèm chuỗi có
      chỗ điền cho số tiền thiếu.
  - show: '<p><b>Dùng: bắt đúng loại lỗi của mình</b></p><div class="code"><div><span
      class="kw">try</span>:</div><div>    rut(100000, 250000)</div><div><span class="kw">except</span>
      SoDuKhongDu <span class="kw">as</span> loi:</div><div>    print("Khong rut duoc:",
      loi)</div><div>print(rut(500000, 200000))</div></div><div class="code"><div>Khong
      rut duoc: thieu 150000</div><div>300000</div></div><p>Rút $250\,000$ từ $100\,000$:
      thiếu $250\,000 - 100\,000 = 150\,000$. Lần rút hợp lệ trả về $500\,000 - 200\,000
      = 300\,000$.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Rút hai trăm năm mươi nghìn từ một trăm nghìn thì thiếu một trăm năm mươi
      nghìn, và lý do đi kèm lỗi. Nơi gọi bắt đúng loại lỗi đó và in thông báo, còn
      lần rút hợp lệ trả về ba trăm nghìn.
  - show: <p><b>Bước 3. finally chạy dù có lỗi, dù return</b></p><div class="code"><div><span
      class="kw">def</span> xu_ly(so):</div><div>    print("mo giao dich")</div><div>    <span
      class="kw">try</span>:</div><div>        <span class="kw">return</span> 100
      // so</div><div>    <span class="kw">except</span> ZeroDivisionError:</div><div>        <span
      class="kw">return</span> -1</div><div>    <span class="kw">finally</span>:</div><div>        print("dong
      giao dich")</div></div><p>Vì khối <code>finally</code> chạy <b>mọi trường hợp</b>,
      kể cả khi hàm đã <code>return</code> ở khối <code>try</code> hay <code>except</code>.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, việc luôn phải làm. Hàm mở một giao dịch, thử chia, và dù chia được
      hay không, khối luôn làm in dòng đóng giao dịch. Vì khối này chạy trong mọi
      trường hợp, kể cả khi hàm đã trả về giá trị.
  - show: '<p><b>Chạy hai lần: chia được và chia cho không</b></p><div class="code"><div>print(xu_ly(5))</div><div>print(xu_ly(0))</div></div><div
      class="code"><div>mo giao dich</div><div>dong giao dich</div><div>20</div><div>mo
      giao dich</div><div>dong giao dich</div><div>-1</div></div><p>Dòng “dong giao
      dich” hiện ở <b>cả hai</b> lần gọi. Đây là nơi đặt việc giải phóng tài nguyên:
      đóng tệp, đóng kết nối.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Vì khối luôn làm chạy trong mọi trường hợp, dòng đóng giao dịch hiện ở cả
      hai lần gọi. Đây là nơi đặt việc giải phóng tài nguyên, như đóng tệp hay đóng
      kết nối.
  - show: '<p><b>Bước 4. Máy xét các khối bắt từ trên xuống, khối đúng đầu tiên thắng</b></p><div
      class="code"><div><span class="kw">try</span>:</div><div>    int("abc")</div><div><span
      class="kw">except</span> Exception:</div><div>    print("loi chung")</div><div><span
      class="kw">except</span> ValueError:</div><div>    print("loi dinh dang")</div></div><div
      class="code"><div>loi chung</div></div><p>Vì <code>ValueError</code> <b>là một
      loại</b> của <code>Exception</code>, khối <code>except Exception</code> ở trên
      đã nhận; khối <code>except ValueError</code> không bao giờ chạy. Quy tắc: <b>loại
      hẹp đặt trước, loại rộng đặt sau</b>.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước bốn, thứ tự các khối bắt. Máy xét các khối từ trên xuống và dùng khối
      đúng đầu tiên. Vì lỗi giá trị là một loại của lớp lỗi chung, khối bắt lỗi chung
      ở trên đã nhận, và khối bắt lỗi giá trị bên dưới không bao giờ chạy. Quy tắc
      là loại hẹp đặt trước, loại rộng đặt sau.
- id: example
  kind: example
  title: 'Ví dụ: gom ba kỹ thuật vào một lần xử lý, ghi nhật ký'
  checks:
  - issubclass(ZeroDivisionError, ArithmeticError)
  steps:
  - show: '<p><b>Đọc thông báo: dòng cuối nói LỖI GÌ, các dòng trên nói ĐI ĐƯỜNG NÀO</b></p><div
      class="code"><div><span class="kw">def</span> chia(a, b):</div><div>    <span
      class="kw">return</span> a // b</div><div> </div><div><span class="kw">def</span>
      trung_binh(ds):</div><div>    <span class="kw">return</span> chia(sum(ds), len(ds))</div><div>
      </div><div>print(trung_binh([10, 20]))</div><div>print(trung_binh([]))</div></div><div
      class="code"><div>15</div><div><span class="cm">File "…", line 8, in &lt;module&gt;</span></div><div><span
      class="cm">File "…", line 5, in trung_binh</span></div><div><span class="cm">File
      "…", line 2, in chia</span></div><div><span class="cm">ZeroDivisionError: integer
