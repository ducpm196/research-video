  - show: '<p><b>Ghi nhật ký theo mức thay cho in rải rác</b></p><div class="code"><div><span
      class="kw">import</span> logging</div><div><span class="kw">import</span> sys</div><div>
      </div><div>logging.basicConfig(stream=sys.stdout, format="%(levelname)s %(message)s",
