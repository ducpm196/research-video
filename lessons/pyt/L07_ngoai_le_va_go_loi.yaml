  - show: '<p><b>Lỗi khoá và lỗi chỉ số</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>{''a'': 1}[''b'']</div><div>Traceback (most recent call last):</div><div>  File
