  - show: '<div class=''box key''>Đọc từ dưới lên: <code>chia</code> dòng $2$ là nơi
      lỗi xảy ra; nó được gọi từ <code>trung_binh</code> dòng $5$; được gọi từ chương
      trình chính dòng $8$. Dòng $8$ gọi với danh sách <b>rỗng</b>: đó là nguyên nhân
