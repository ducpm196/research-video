      <ol><li><code>a.sum(axis=0)</code> và <code>a.sum(axis=1)</code> là gì?</li>

      <li><code>a + np.array([10, 20, 30])</code> có chạy không? Kết quả?</li></ol>

      <p><b>Quyết định:</b> tính tổng $10^7$ số: <b>vòng lặp</b> hay <b>một lệnh trên
      mảng</b>? Còn $10^9$ số?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Cho mảng hai hàng ba cột. Câu một, tổng theo
      trục không và theo trục một là gì. Câu hai, cộng với một hàng ba số có chạy
      không, kết quả là gì. Sau đó là một quyết định, tính tổng mười triệu số, dùng
      vòng lặp hay một lệnh trên mảng, còn một tỉ số thì sao. Hãy dừng video và làm.
  - show: '<p><b>Câu 1 và câu 2</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span><span class="kw">import</span> numpy <span class="kw">as</span> np</div><div><span
      class="cm">&gt;&gt;&gt; </span>a = np.array([[1, 2, 3], [4, 5, 6]])</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(a.sum(axis=0))</div><div>[5 7 9]</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(a.sum(axis=1))</div><div>[ 6 15]</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(a + np.array([10, 20, 30]))</div><div>[[11
      22 33]</div><div> [14 25 36]]</div></div><p>Trục $0$ gộp hai hàng: $[1+4, 2+5,
      3+6] = [5, 7, 9]$. Trục $1$ gộp ba cột: $[6, 15]$. <code>(2, 3) + (3,)</code>
      khớp từ phải ($3 = 3$): hàng $(10, 20, 30)$ cộng vào cả hai hàng.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đáp án như sau. Trục không gộp hai hàng, cho năm, bảy, chín. Trục một gộp
      ba cột, cho sáu và mười lăm. Cộng với hàng ba số chạy được, vì so từ bên phải
      ba bằng ba, hàng mười, hai mươi, ba mươi được cộng vào cả hai hàng.
  - show: '<div class=''box key''><b>Quyết định:</b> mười triệu số: <b>mảng</b>, nhanh
      hơn hàng chục đến hàng trăm lần và nhẹ hơn nhiều lần. Một tỉ số nguyên tám byte
      là $8$ GB: nhiều máy không chứa vừa. Khi đó <b>không nạp hết</b>: đọc và tính
      <b>theo từng khối</b>, cộng dồn kết quả của mỗi khối (bài tình huống ở cuối
      khoá).</div>'
    clear: true
    forward_ref: true
    say: Còn quyết định cuối thì thế này. Mười triệu số thì dùng mảng, nhanh hơn hàng
      chục đến hàng trăm lần và nhẹ hơn nhiều lần. Một tỉ số nguyên tám byte là tám
      tỉ byte, nhiều máy không chứa vừa. Khi đó không nạp hết, mà đọc và tính theo
      từng khối, cộng dồn kết quả của mỗi khối. Ta sẽ làm điều này ở bài tình huống
      cuối khoá.
- id: practice
  kind: practice
  title: 'Tự làm: trung bình, độ lệch chuẩn và chuẩn hoá cột'
  steps:
  - show: '<p><b>Đề</b> (cần môi trường ảo đã cài thư viện): tạo <code>chuan_hoa.py</code>.
      Dữ liệu <code>so_lieu</code> (5 hàng × 2 cột, <code>dtype=float</code>; xem
      <code>de.md</code>: số giao dịch/ngày và doanh thu). In <b>năm khối</b>:</p>

      <ol><li>trung bình từng cột (làm tròn $2$ chữ số);</li>

      <li>độ lệch chuẩn từng cột (làm tròn $2$ chữ số);</li>

      <li>mảng đã chuẩn hoá (tròn $3$ chữ số);</li>

      <li>kiểm trung bình cột mới $\approx 0$ (<code>np.allclose(a, b)</code>: hai
      mảng gần bằng nhau, sai lệch cực nhỏ);</li>

      <li>độ lệch chuẩn cột mới (tròn $6$).</li></ol><p class="note">Lưu tệp ở thư
      mục gốc của bộ khoá (nơi có thư mục <code>labs</code>), mở Git Bash tại đó để
      chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 300
    say: Bây giờ tới phần bạn tự làm, trong môi trường ảo đã cài thư viện. Cho một
      mảng năm hàng hai cột là số giao dịch mỗi ngày và doanh thu. Tính trung bình
      và độ lệch chuẩn của từng cột, làm tròn hai chữ số. Chuẩn hoá từng cột rồi in
      mảng, làm tròn ba chữ số. Kiểm trung bình các cột mới xấp xỉ không và in độ
      lệch chuẩn của chúng. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Trung binh: [ 140.
      4600.]</div><div>Do lech chuan: [  36.33 1021.76]</div><div>[[-0.55  -0.587]</div><div>
      [ 0.275  0.587]</div><div> [-1.376 -1.468]</div><div> [ 1.651  1.468]</div><div>
      [ 0.     0.   ]]</div><div>Trung binh cot sau chuan hoa ~ 0: True</div><div>Do
      lech chuan cot sau chuan hoa: [1. 1.]</div></div><p class="note">Chấm bằng Git
      Bash: <code>bash labs/cham.sh PYT L09 chuan_hoa.py</code> — in <b>ĐÚNG</b> khi
      trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>tb = so_lieu.mean(axis=0)</code>,
      <code>do_lech = so_lieu.std(axis=0)</code>, <code>chuan = (so_lieu - tb) / do_lech</code>
      (lan truyền). Làm tròn khi in: <code>np.round(x, 2)</code>. Lời giải ở <code>labs/PYT/L09/loi_giai.py</code>.</div>'
    clear: true
    say: Nếu kẹt, tính trung bình và độ lệch chuẩn theo trục không, rồi chuẩn hoá
      bằng phép trừ và chia, nhờ lan truyền. Làm tròn khi in bằng lệnh làm tròn của
      thư viện. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã thử.
  lab: labs/PYT/L09
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>mảng: cùng một kiểu, nằm liền nhau;
      hình dạng (hàng, cột)</span><span class=''a''>→</span><span class=''n''>phép
      tính chạy theo từng phần tử, không cần vòng lặp</span><span class=''a''>→</span><span
      class=''n''>trục = hướng bị gộp; kết quả là chiều còn lại</span><span class=''a''>→</span><span
      class=''n''>lan truyền: so kích thước từ bên phải</span><span class=''a''>→</span><span
      class=''n''>mặt nạ đúng/sai làm chỉ số</span><span class=''a''>→</span><span
      class=''n''>nhanh hàng chục đến hàng trăm lần, nhưng phải nằm trọn trong bộ
      nhớ</span></div>'
    say: Tổng kết chuỗi logic. Mảng cùng một kiểu, nằm liền nhau, có hình dạng hàng
      cột. Phép tính chạy theo từng phần tử, không cần vòng lặp. Trục là hướng bị
      gộp, kết quả là chiều còn lại. Lan truyền so kích thước từ bên phải. Mặt nạ
      đúng sai làm chỉ số. Và mảng nhanh hàng chục đến hàng trăm lần, nhưng phải nằm
      trọn trong bộ nhớ.
  - show: '<div class=''box key''><b>Tư duy:</b> nghĩ <b>cả mảng</b> thay vì từng
      phần tử; trước mỗi phép tính, hỏi “hình dạng hai bên là gì?”; và hỏi “cả mảng
      có nằm vừa bộ nhớ không?”.</div>

      <p>Bài sau: thư viện bảng dữ liệu, mảng có nhãn cột và nhãn hàng, để đọc, lọc,
      nhóm và ghép bảng giao dịch.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, hãy nghĩ cả mảng thay vì từng phần tử. Trước mỗi phép
      tính hỏi hình dạng hai bên là gì, và hỏi cả mảng có nằm vừa bộ nhớ không. Bài
      sau, ta học thư viện bảng dữ liệu, mảng có nhãn cột và nhãn hàng, để đọc, lọc,
      nhóm và ghép bảng giao dịch.
    clear: true
