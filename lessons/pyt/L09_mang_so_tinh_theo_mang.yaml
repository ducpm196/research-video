scenes:
- id: hook
  kind: hook
  title: 'Một triệu số: mảng nhanh hơn vòng lặp hàng chục đến hàng trăm lần'
  steps:
  - show: <table class='t'><tr><th>một triệu số nguyên</th><th>thời gian (đo trên
      máy kiểm, số minh hoạ)</th><th>bộ nhớ</th></tr><tr><td>vòng lặp trên danh sách</td><td>≈
      80 ms</td><td>≈ 40 MB</td></tr><tr><td>một lệnh trên mảng</td><td>≈ 300 µs</td><td>≈
      8,0 MB</td></tr><tr><td>nhanh gấp</td><td>≈ 300 lần</td><td>ít hơn ≈ 5 lần</td></tr></table><p
      class='note'>ms = phần nghìn giây; µs = phần triệu giây; MB = triệu byte.</p>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, hãy cộng một triệu số. Bằng vòng lặp trên danh sách, trên máy kiểm
      mất khoảng tám mươi phần nghìn giây và chiếm khoảng bốn mươi triệu byte bộ nhớ.
      Bằng một lệnh trên mảng, mất khoảng ba trăm phần triệu giây và chỉ chiếm khoảng
      tám triệu byte. Nhanh hơn khoảng ba trăm lần, và nhẹ hơn nhiều lần. Số đo trên
      máy kiểm, số minh hoạ. Với dữ liệu phân tích, đây là khác biệt giữa chờ một
      giây và chờ một phút.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li><b>Mảng</b> khác danh sách ở đâu, và <b>hình dạng</b> của nó nói gì?</li>

      <li>Tính <b>theo từng phần tử</b>, <b>lan truyền</b> và tính theo <b>trục</b>
      hoạt động ra sao?</li>

      <li>Vì sao mảng nhanh hơn vòng lặp, và <b>giới hạn</b> của nó là gì?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, mảng khác danh sách ở đâu, và hình dạng
      của nó nói gì. Hai, tính theo từng phần tử, lan truyền và tính theo trục hoạt
      động ra sao. Ba, vì sao mảng nhanh hơn vòng lặp, và giới hạn của nó là gì.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: danh sách, vòng lặp, môi trường ảo và thư viện đã cài'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      danh sách và vòng lặp</td><td><code>for x in ds: tong = tong + x</code>: mỗi
      lượt một phần tử, Python làm từng lệnh một</td></tr><tr><td>② cắt lát danh sách</td><td><code>ds[1:3]</code>
      tạo danh sách <b>mới</b> (bản sao)</td></tr><tr><td>③ thư viện ngoài</td><td>cài
      vào môi trường ảo từ tệp ghim; nạp bằng <code>import numpy as np</code> (<code>as</code>
      đặt tên ngắn)</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 1
    say: Ta ôn lại ba điều. Vòng lặp lấy từng phần tử một và làm từng lệnh một. Cắt
      lát danh sách tạo danh sách mới. Và thư viện ngoài được cài vào môi trường ảo
      từ tệp ghim, rồi nạp bằng lệnh nạp với tên ngắn. Bài này dùng thư viện tính
      trên mảng, đã có trong tệp ghim của khoá, nên hãy chạy trong môi trường ảo đã
      cài.
- id: sym
  kind: symbol
  title: Giải mã mảng, hình dạng, trục, lan truyền và mặt nạ
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>np.array([[1,
      2], [3, 4]])</code></td><td>tạo mảng</td><td>mảng 2 chiều: hàng nhìn từ trên
      xuống, cột từ trái sang; mọi phần tử <b>cùng một kiểu</b></td></tr><tr><td><code>a.shape</code>,
      <code>a.dtype</code>, <code>a.ndim</code></td><td>hình dạng, kiểu, số chiều</td><td><code>(3,
      4)</code> = 3 hàng 4 cột; <code>int64</code> = số nguyên 8 byte; <code>ndim</code>
      = 2</td></tr><tr><td><code>a[1, 2]</code>, <code>a[:, 0]</code></td><td>chỉ
      số, cắt cột</td><td>hàng <code>1</code> cột <code>2</code> (đếm từ $0$); <code>:</code>
      = mọi hàng, cột <code>0</code></td></tr></table>'
    say: Bảng đầu là mảng. Mảng hai chiều có hàng và cột, mọi phần tử cùng một kiểu.
      Hình dạng cho biết số hàng và số cột, kiểu cho biết loại số và cỡ, số chiều
      là hai. Chỉ số đặt hàng trước cột, đếm từ không. Dấu hai chấm nghĩa là mọi hàng,
      nên lấy cột không của mọi hàng.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>a
      * 2</code>, <code>a + b</code></td><td>tính theo phần tử</td><td>mỗi ô một phép
      tính, không cần vòng lặp</td></tr><tr><td><code>a.sum(axis=0)</code>, <code>a.sum(axis=1)</code></td><td>tính
      theo trục</td><td>trục <code>0</code> chạy dọc hàng → <b>một kết quả cho mỗi
      cột</b>; trục <code>1</code> → một kết quả cho mỗi hàng</td></tr><tr><td><code>a.mean()</code>,
      <code>a.std()</code></td><td>trung bình, độ lệch chuẩn</td><td>độ lệch chuẩn
      = căn của trung bình các <b>bình phương độ lệch so với trung bình</b></td></tr><tr><td><code>a[a
      &gt; 1000]</code></td><td>mặt nạ</td><td><code>a &gt; 1000</code> cho mảng đúng/sai
      cùng hình dạng; dùng nó làm chỉ số để lấy phần tử thoả. Cộng mặt nạ, <code>(a
      &gt; 1000).sum()</code>: <code>True</code> tính là $1$, <code>False</code> là
      $0$, nên tổng là <b>số phần tử đúng</b></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    clear: true
    say: Bảng thứ hai là phép tính. Phép tính theo phần tử làm mỗi ô một phép tính
      mà không cần vòng lặp. Tính theo trục không là chạy dọc hàng cho mỗi cột một
      kết quả, còn trục một cho mỗi hàng một kết quả. Trung bình và độ lệch chuẩn,
      trong đó độ lệch chuẩn là căn của trung bình các bình phương độ lệch so với
      trung bình. Cuối cùng là mặt nạ, một mảng đúng sai dùng làm chỉ số để lấy các
      phần tử thoả điều kiện. Cộng một mặt nạ thì đúng tính là một, sai tính là không,
      nên tổng là số phần tử đúng.
