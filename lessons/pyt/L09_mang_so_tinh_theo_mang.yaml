- id: formula
  kind: formula
  title: 'Suy ra từng bước: theo phần tử, theo trục, lan truyền, độ lệch chuẩn'
  checks:
  - 500 + 200 + 1500 == 2200 and 500 + 1200 + 300 + 800 == 2800
  - 2200 + 2800 + 1350 + 2900 == 9250 and 2800 + 1650 + 4800 == 9250
  - (2 + 4 + 4 + 4 + 5 + 5 + 7 + 9) / 8 == 5 and ((2 - 5) ** 2 + 0 + 0 + 0 + 0 + 0
    + 0 + (9 - 5) ** 2) >= 0
  - (9 + 1 + 1 + 1 + 0 + 0 + 4 + 16) / 8 == 4
  steps:
  - show: '<p><b>Bước 1. Phép tính theo phần tử: mỗi ô một phép</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">import</span> numpy <span class="kw">as</span>
      np</div><div><span class="cm">&gt;&gt;&gt; </span>so_tien = np.array([[500,
      1200, 300, 800], [200, 900, 450, 100], [1500, 700, 600, 2000]])</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(so_tien * 2)</div><div>[[1000 2400  600
      1600]</div><div> [ 400 1800  900  200]</div><div> [3000 1400 1200 4000]]</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(np.array([1, 2, 3]) * np.array([10, 20,
      30]))</div><div>[10 40 90]</div></div><p>Hai dòng đầu nạp thư viện và dựng bảng
      <code>so_tien</code> dùng suốt bài (ba tài khoản, bốn tuần). Vì <code>so_tien
      * 2</code> áp dụng cho <b>từng ô</b>, ô đầu $500 \to 1000$. Hai mảng cùng hình
      dạng thì nhân từng cặp ô: $1 \cdot 10,\ 2 \cdot 20,\ 3 \cdot 30$ cho <code>[10
      40 90]</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước một, tính theo phần tử. Hai dòng đầu nạp thư viện và dựng bảng ba tài
      khoản, bốn tuần, dùng suốt bài. Vì phép nhân với hai áp dụng cho từng ô, ô đầu
      năm trăm thành một nghìn. Hai mảng cùng hình dạng thì nhân từng cặp ô, một nhân
      mười, hai nhân hai mươi, ba nhân ba mươi, cho ra mười, bốn mươi, chín mươi.
      Không có vòng lặp nào ở phía người viết.
    introduces:
    - cdot
  - show: '<p><b>Bước 2. Theo trục: hình dạng kết quả là chiều không gộp</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span><span class="kw">import</span>
      numpy <span class="kw">as</span> np</div><div><span class="cm">&gt;&gt;&gt;
      </span>so_tien = np.array([[500, 1200, 300, 800], [200, 900, 450, 100], [1500,
      700, 600, 2000]])</div><div><span class="cm">&gt;&gt;&gt; </span>print(so_tien.sum(axis=0))</div><div>[2200
      2800 1350 2900]</div><div><span class="cm">&gt;&gt;&gt; </span>print(so_tien.sum(axis=1))</div><div>[2800
      1650 4800]</div><div><span class="cm">&gt;&gt;&gt; </span>print(so_tien.sum())</div><div>9250</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(so_tien.sum(axis=0).shape)</div><div>(4,)</div></div><p>Vì
      <code>axis=0</code> gộp các hàng, còn $4$ số: $500 + 200 + 1500 = 2200$. <code>axis=1</code>
      gộp các cột: $500 + 1200 + 300 + 800 = 2800$. Cả hai phải cho tổng chung $9250$:
      $2200 + 2800 + 1350 + 2900 = 9250$ ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, tính theo trục. Vì trục không gộp các hàng, còn bốn số, mỗi cột
      một tổng, ví dụ cột đầu là năm trăm cộng hai trăm cộng một nghìn năm trăm, bằng
      hai nghìn hai trăm. Trục một gộp các cột, còn ba số, mỗi hàng một tổng. Cả hai
      cách cho cùng tổng chung chín nghìn hai trăm năm mươi, và hình dạng kết quả
      là chiều không bị gộp.
  - show: '<p><b>Bước 3. Lan truyền: một hàng bốn số được kéo dài xuống cho khớp</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span><span class="kw">import</span>
      numpy <span class="kw">as</span> np</div><div><span class="cm">&gt;&gt;&gt;
      </span>so_tien = np.array([[500, 1200, 300, 800], [200, 900, 450, 100], [1500,
      700, 600, 2000]])</div><div><span class="cm">&gt;&gt;&gt; </span>print(so_tien
      + np.array([10, 20, 30, 40]))</div><div>[[ 510 1220  330  840]</div><div> [
      210  920  480  140]</div><div> [1510  720  630 2040]]</div></div><p>Hình dạng
      <code>(3, 4)</code> và <code>(4,)</code>: so từ phải, $4 = 4$, nên máy kéo hàng
      $[10, 20, 30, 40]$ xuống cả ba hàng rồi cộng từng ô. <code>(4,)</code> là hình
      dạng của mảng <b>một chiều</b> có $4$ số (dấu phẩy sau $4$ để phân biệt với
      chính số $4$).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, lan truyền. Cộng bảng ba hàng bốn cột với một hàng bốn số. So kích
      thước từ bên phải, bốn bằng bốn, nên máy kéo hàng đó xuống cả ba hàng rồi cộng
      từng ô, và mỗi hàng của bảng được cộng cùng một hàng bốn số.
  - show: '<p><b>Khi không khớp: lỗi, và cách sửa bằng một cột</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">import</span> numpy <span class="kw">as</span>
      np</div><div><span class="cm">&gt;&gt;&gt; </span>so_tien = np.array([[500,
      1200, 300, 800], [200, 900, 450, 100], [1500, 700, 600, 2000]])</div><div><span
      class="cm">&gt;&gt;&gt; </span>so_tien + np.array([1, 2, 3])</div><div>Traceback
      (most recent call last):</div><div>  File "&lt;stdin&gt;", line 1, in &lt;module&gt;</div><div>ValueError:
      operands could not be broadcast together with shapes (3,4) (3,) </div><div><span
      class="cm">&gt;&gt;&gt; </span>print(so_tien + np.array([[1], [2], [3]]))</div><div>[[
      501 1201  301  801]</div><div> [ 202  902  452  102]</div><div> [1503  703  603
      2003]]</div></div><p>Vì <code>(3, 4)</code> và <code>(3,)</code>: so từ phải,
      $4$ với $3$ khác nhau và không bên nào bằng $1$ nên lỗi. Đổi hàng thành <b>cột</b>
      <code>(3, 1)</code>: $1$ được kéo dài thành $4$, mỗi hàng cộng một số riêng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Còn với mảng ba số thì bị lỗi, vì so từ bên phải thì bốn khác ba, và không
      bên nào bằng một. Muốn cộng mỗi hàng một số riêng, ta đổi thành một cột ba hàng
      một cột. Kích thước một được kéo dài thành bốn, và hàng thứ nhất cộng một, hàng
      thứ hai cộng hai, hàng thứ ba cộng ba.
  - show: '<p><b>Bước 4. Độ lệch chuẩn tính từ định nghĩa</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">import</span> numpy <span class="kw">as</span>
      np</div><div><span class="cm">&gt;&gt;&gt; </span>x = np.array([2, 4, 4, 4,
      5, 5, 7, 9])</div><div><span class="cm">&gt;&gt;&gt; </span>print(x.mean())</div><div>5.0</div><div><span
      class="cm">&gt;&gt;&gt; </span>print((x - x.mean()) ** 2)</div><div>[ 9.  1.  1.  1.  0.  0.  4.
      16.]</div><div><span class="cm">&gt;&gt;&gt; </span>print(((x - x.mean()) **
      2).mean())</div><div>4.0</div><div><span class="cm">&gt;&gt;&gt; </span>print(np.sqrt(4.0))</div><div>2.0</div><div><span
      class="cm">&gt;&gt;&gt; </span>print(x.std())</div><div>2.0</div></div><p>Tám
      số $2, 4, 4, 4, 5, 5, 7, 9$ có trung bình $5$; bình phương độ lệch: $(2-5)^2
      = 9$, … , $(9-5)^2 = 16$; trung bình của chúng $= 4$; căn $= 2$ (<code>np.sqrt</code>
      lấy căn bậc hai). Khớp với <code>x.std()</code> ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước bốn, độ lệch chuẩn từ định nghĩa. Ta lập mảng tám số hai, bốn, bốn,
      bốn, năm, năm, bảy, chín, có trung bình năm. Bình phương độ lệch của từng số
      so với trung bình là chín, một, một, một, không, không, bốn, mười sáu. Trung
      bình các bình phương đó bằng bốn, lấy căn được hai. Lệnh có sẵn cho cùng kết
      quả hai, nên ta tin nó.
- id: example
  kind: example
  title: 'Ví dụ: thống kê theo tuần và theo tài khoản, mặt nạ, chuẩn hoá cột'
  checks:
  - (500 + 1200 + 300 + 800) / 4 == 700 and (200 + 900 + 450 + 100) / 4 == 412.5 and
    (1500 + 700 + 600 + 2000) / 4 == 1200
  - len([x for x in [500, 1200, 300, 800, 200, 900, 450, 100, 1500, 700, 600, 2000]
    if x > 1000]) == 3
  steps:
  - show: '<p><b>Dựng bảng giao dịch: 3 tài khoản × 4 tuần (nghìn đồng)</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span><span class="kw">import</span>
      numpy <span class="kw">as</span> np</div><div><span class="cm">&gt;&gt;&gt;
      </span>so_tien = np.array([[500, 1200, 300, 800], [200, 900, 450, 100], [1500,
      700, 600, 2000]])</div><div><span class="cm">&gt;&gt;&gt; </span>so_tien.shape</div><div>(3,
      4)</div><div><span class="cm">&gt;&gt;&gt; </span>so_tien.dtype</div><div>dtype(''int64'')</div><div><span
      class="cm">&gt;&gt;&gt; </span>so_tien.ndim</div><div>2</div><div><span class="cm">&gt;&gt;&gt;
