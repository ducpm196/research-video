- id: scale
  kind: concept
  title: 'Khi dữ liệu lớn dần: mảng nhanh hơn nhiều lần, nhưng vẫn phải nằm vừa bộ
    nhớ'
  checks:
  - 10 ** 7 * 10 == 10 ** 8
  - 8 * 10 ** 8 == 800000000
  steps:
  - show: '<table class=''t''><tr><th>số phần tử</th><th>vòng lặp Python</th><th>một
      lệnh trên mảng</th><th>nhanh gấp</th></tr><tr><td>×1: 10 000</td><td>≈ 800 µs</td><td>≈
      5 µs</td><td>≈ 200</td></tr><tr><td>×100: 1 000 000</td><td>≈ 80 ms</td><td>≈
      300 µs</td><td>≈ 300</td></tr><tr><td>×1 000: 10 000 000</td><td>≈ 900 ms</td><td>≈
      5 ms</td><td>≈ 200</td></tr><tr><td>×10 000 (ngoại suy): 100 000 000</td><td>≈
      9 s</td><td>≈ 50 ms</td><td>—</td></tr></table><p class=''note''>Đo trên máy
      kiểm, số minh hoạ. <b>Ngoại suy</b> = nhân theo tỉ lệ từ số đã đo để đoán số
      ở quy mô chưa đo (ở đây từ mức mười triệu, nhân $10$). Hệ số “nhanh gấp” khác
      nhau giữa các quy mô và giữa các máy: chỉ nên nhớ cỡ hàng chục đến hàng trăm
      lần.</p>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    introduces:
    - pyt_ngoai_suy
    say: Bảng này là kết quả đo. Một vạn số, vòng lặp mất khoảng tám trăm phần triệu
      giây, mảng mất khoảng năm phần triệu giây. Một triệu số, vòng lặp mất khoảng
      tám mươi phần nghìn giây, mảng mất khoảng ba trăm phần triệu giây. Mười triệu
      số, vòng lặp mất khoảng chín trăm phần nghìn giây, mảng mất khoảng năm phần
      nghìn giây. Hàng cuối là ngoại suy, nghĩa là nhân theo tỉ lệ từ số đã đo để
      đoán số ở quy mô chưa đo. Một trăm triệu số, vòng lặp cỡ khoảng chín giây, mảng
      cỡ khoảng năm mươi phần nghìn giây. Hệ số nhanh gấp khác nhau giữa các quy mô
      và giữa các máy, nên chỉ nhớ cỡ hàng chục đến hàng trăm lần.
  - show: '<table class=''t''><tr><th>số phần tử</th><th>bộ nhớ mảng (8 byte mỗi số)</th><th>bộ
      nhớ danh sách các số nguyên</th></tr><tr><td>1 000 000</td><td>≈ 8,0 MB</td><td>≈
      40 MB</td></tr><tr><td>10 000 000</td><td>≈ 80 MB</td><td>≈ 400 MB (ngoại suy)</td></tr><tr><td>100
      000 000</td><td>≈ 800 MB</td><td>≈ 4,0 GB (ngoại suy)</td></tr></table><div
      class=''box key''><b>Đánh đổi:</b> mảng nhanh vì dữ liệu nằm <b>liền nhau</b>,
      <b>cùng một kiểu</b>, và phép tính chạy bằng mã <b>đã biên dịch</b> (viết sẵn
      bằng ngôn ngữ gần máy hơn, đã dịch ra lệnh máy), không qua từng lệnh của Python.
      Nhưng mảng vẫn phải nằm <b>trọn trong bộ nhớ</b>: một trăm triệu số nguyên tám
      byte là 800 MB. Và nó nhanh nhất khi tính cả mảng một lệnh; quay lại vòng lặp
      từng phần tử thì mất lợi thế.</div>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    introduces:
    - pyt_bien_dich
    clear: true
    say: Cái giá nằm ở bộ nhớ. Một triệu số trong mảng chiếm khoảng tám triệu byte,
      trong danh sách chiếm khoảng bốn mươi triệu byte. Một trăm triệu số trong mảng
      chiếm khoảng tám trăm triệu byte, và trong danh sách cần cỡ khoảng bốn tỉ byte.
      Mảng nhanh vì dữ liệu nằm liền nhau, cùng một kiểu, và phép tính chạy bằng mã
      đã biên dịch, nghĩa là mã viết sẵn bằng một ngôn ngữ gần máy hơn và đã dịch
      ra lệnh máy. Nhưng mảng vẫn phải nằm trọn trong bộ nhớ. Và nó nhanh nhất khi
      tính cả mảng bằng một lệnh. Số đo trên máy kiểm, số minh hoạ.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 2000000000 + 2000000000 > 2 ** 31 - 1
  - 2 ** 31 - 1 == 2147483647
  - (2000000000 * 2) - 2 ** 32 == -294967296
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Cộng hai mảng khác hình
      dạng, không khớp từ bên phải.</div><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span><span class="kw">import</span> numpy <span class="kw">as</span> np</div><div><span
      class="cm">&gt;&gt;&gt; </span>so_tien = np.array([[500, 1200, 300, 800], [200,
      900, 450, 100], [1500, 700, 600, 2000]])</div><div><span class="cm">&gt;&gt;&gt;
      </span>so_tien + np.array([1, 2, 3])</div><div>Traceback (most recent call last):</div><div>  File
      "&lt;stdin&gt;", line 1, in &lt;module&gt;</div><div>ValueError: operands could
      not be broadcast together with shapes (3,4) (3,) </div></div><p>Đọc dòng cuối:
      hình dạng <code>(3,4)</code> và <code>(3,)</code> không lan truyền được. Phép
      thử: <b>in <code>.shape</code></b> của từng mảng trước khi tính.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là cộng hai mảng khác hình dạng, không khớp
      từ bên phải. Dòng cuối nói hai hình dạng không lan truyền được. Phép thử là
      in hình dạng của từng mảng trước khi tính.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Kiểu số nguyên nhỏ
      bị tràn mà không báo lỗi.</div><div class="code"><div><span class="kw">import</span>
      numpy <span class="kw">as</span> np</div><div> </div><div>a = np.array([2000000000],
      dtype=np.int32)</div><div>print(a + a)</div><div>b = a.astype(np.int64)</div><div>print(b
      + b)</div></div><div class="code"><div>[-294967296]</div><div>[4000000000]</div></div><p>Hai
      tỉ cộng hai tỉ vượt $2^{31} - 1 = 2\,147\,483\,647$ của số nguyên $4$ byte ($32$
      bit: <b>bit</b> là một chữ số $0$ hoặc $1$, một byte có $8$ bit; một bit dành
      cho dấu): kết quả <b>quay vòng</b> thành số âm: $4\,000\,000\,000 - 2^{32} =
      -294\,967\,296$. Không cảnh báo. Phép thử: so tổng với tính tay; đổi sang kiểu
      $8$ byte khi tổng có thể lớn.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là kiểu số nguyên nhỏ bị tràn mà không
      báo lỗi. Số nguyên bốn byte có ba mươi hai bit, mỗi bit là một chữ số không
      hoặc một, và một bit dành cho dấu, nên số lớn nhất chỉ hơn hai tỉ một trăm bốn
      mươi bảy triệu. Hai tỉ cộng hai tỉ vượt giới hạn đó, nên kết quả quay vòng.
      Bốn tỉ trừ hai mũ ba mươi hai ra âm hai trăm chín mươi bốn triệu chín trăm sáu
      mươi bảy nghìn hai trăm chín mươi sáu. Không có cảnh báo nào. Phép thử là so
      tổng với tính tay, và đổi sang kiểu tám byte khi tổng có thể lớn.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Cắt lát mảng là một
      <b>cái nhìn</b>, không phải bản sao: khác với danh sách.</div><div class="code"><div><span
      class="kw">import</span> numpy <span class="kw">as</span> np</div><div> </div><div>a
      = np.array([10, 20, 30, 40])</div><div>b = a[1:3]</div><div>b[0] = 999</div><div>print(a)</div><div>c
      = a[1:3].copy()</div><div>c[0] = 0</div><div>print(a)</div></div><div class="code"><div>[
      10 999  30  40]</div><div>[ 10 999  30  40]</div></div><p>Sửa <code>b</code>
      làm <code>a</code> đổi theo, vì chung bộ nhớ. Muốn độc lập: <code>.copy()</code>
      (dòng $7$ không ảnh hưởng $a$).</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là cắt lát mảng chỉ là một cái nhìn vào
      cùng bộ nhớ, không phải bản sao. Khác với danh sách. Sửa một phần tử của lát
      làm mảng gốc đổi theo. Muốn bản độc lập phải gọi lệnh sao chép, và khi đó sửa
      bản sao không ảnh hưởng mảng gốc.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '[1 + 4, 2 + 5, 3 + 6] == [5, 7, 9] and [1 + 2 + 3, 4 + 5 + 6] == [6, 15]'
  - 8 * 10 ** 9 == 8000000000
  steps:
  - show: '<p><b>Đề.</b> <code>a = np.array([[1, 2, 3], [4, 5, 6]])</code> (hình dạng
