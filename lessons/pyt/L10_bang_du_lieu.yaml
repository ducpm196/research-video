- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cộng bằng thư viện chuẩn'
  checks:
  - 1450000 + 3000000 + 300000 == 4750000
  steps:
  - show: '<p><b>Không dùng thư viện bảng: bộ đọc CSV và từ điển</b></p><div class="code"><div><span
      class="kw">import</span> csv</div><div> </div><div>tong = {}</div><div><span
      class="kw">with</span> open("gd.csv", encoding="utf-8", newline="") <span class="kw">as</span>
      f:</div><div>    <span class="kw">for</span> h <span class="kw">in</span> csv.DictReader(f):</div><div>        <span
      class="kw">if</span> h["so_tien"]:</div><div>            tong[h["loai"]] = tong.get(h["loai"],
      0) + int(h["so_tien"])</div><div>print(tong)</div></div><div class="code"><div>{''chuyen'':
      1450000, ''nap'': 3000000, ''rut'': 300000}</div></div><p>Dòng điều kiện <code>if
      h["so_tien"]:</code> coi chuỗi rỗng <code>""</code> (ô trống) là <b>sai</b>,
      nên dòng thiếu bị bỏ; <code>csv.DictReader(f)</code> cho mỗi dòng một từ điển,
      khoá là tên cột; <code>newline=""</code> để bộ đọc tự xử lý xuống dòng trong
      ô.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, không dùng thư viện bảng. Bộ đọc bảng của thư viện chuẩn
      cho mỗi dòng một từ điển. Câu điều kiện coi chuỗi rỗng là sai, nên dòng thiếu
      bị bỏ qua, và từ điển cộng theo loại.
  - show: <div class='box key'>Hai đường độc lập cùng cho chuyển $1\,450\,000$, nạp
      $3\,000\,000$, rút $300\,000$. Tổng $= 4\,750\,000$, trùng bước $4$ ✓</div>
    clear: true
    say: Hai đường cho đúng ba con số, một triệu bốn trăm năm mươi nghìn, ba triệu,
      ba trăm nghìn, trùng với kết quả nhóm. Tổng bốn triệu bảy trăm năm mươi nghìn
      nên trùng tổng chung.
- id: scale
  kind: concept
  title: 'Khi bảng lớn dần: bộ nhớ tăng theo số dòng, kiểu danh mục tiết kiệm'
  checks:
  - 10 ** 6 * 100 == 10 ** 8
  - 10 ** 4 * 100 == 10 ** 6
  steps:
  - show: '<table class=''t''><tr><th>số dòng</th><th>cột chữ kiểu thường</th><th>cột
      chữ kiểu danh mục</th><th>tiết kiệm</th></tr><tr><td>×1: 10 000</td><td>≈ 1,4
      MB</td><td>≈ 250 KB</td><td>≈ 5,5 lần</td></tr><tr><td>×100: 1 000 000</td><td>≈
      140 MB</td><td>≈ 19 MB</td><td>≈ 7,3 lần</td></tr><tr><td>×10 000 (ngoại suy):
      100 000 000</td><td>≈ 14 GB</td><td>≈ 1,9 GB</td><td>—</td></tr></table><p class=''note''>Hai
      cột chữ (<code>loai</code>, <code>tai_khoan</code>) đổi sang kiểu danh mục.
      Hệ số tiết kiệm gần như <b>không đổi theo số dòng</b>: nó phụ thuộc số giá trị
      khác nhau trong cột (ở đây $3$ loại, $1\,000$ tài khoản). Bộ nhớ đo bằng lệnh
      đo bộ nhớ của bảng (kể cả nội dung chuỗi); đo trên máy kiểm, số minh hoạ; ngoại
      suy = nhân theo tỉ lệ từ số đã đo.</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bảng này đo bộ nhớ của một bảng bốn cột. Mười nghìn dòng chiếm khoảng một
      phẩy bốn triệu byte với cột chữ kiểu thường, và khoảng hai trăm năm mươi nghìn
      byte khi đổi sang kiểu danh mục. Một triệu dòng chiếm khoảng một trăm bốn mươi
      triệu byte và khoảng mười chín triệu byte. Hệ số tiết kiệm xấp xỉ nhau ở hai
      quy mô, cỡ bảy phẩy ba lần, vì nó phụ thuộc số giá trị khác nhau trong cột chứ
      không phụ thuộc số dòng. Ngoại suy một trăm triệu dòng, kiểu thường cần khoảng
      mười bốn tỉ byte, kiểu danh mục cần khoảng một phẩy chín tỉ byte. Số đo trên
      máy kiểm, số minh hoạ.
  - show: '<table class=''t''><tr><th>nhóm theo loại (dữ liệu đã nằm sẵn)</th><th>vòng
      lặp Python trên danh sách</th><th>một lệnh trên bảng</th><th>nhanh gấp</th></tr><tr><td>10
      000 dòng</td><td>≈ 2 ms</td><td>≈ 1 ms</td><td>cùng cỡ; chưa chắc nhanh hơn</td></tr><tr><td>1
      000 000 dòng</td><td>≈ 200 ms</td><td>≈ 70 ms</td><td>≈ 2,9</td></tr></table><div
      class=''box key''><b>Đánh đổi:</b> bảng nhanh vì tính theo cột bằng mã đã biên
      dịch, nhưng <b>mọi dòng nằm trong bộ nhớ</b>. Khi bảng lớn: chọn <b>kiểu hẹp</b>
      (danh mục cho chữ lặp, số nguyên nhỏ cho số), <b>chỉ đọc cột cần</b>, hoặc <b>đọc
      theo khối</b> (mỗi lần chỉ đọc một phần tệp, cỡ vài trăm nghìn dòng) rồi cộng
      dồn. Với hàng trăm triệu dòng và hơn, người làm nghề chuyển sang cơ sở dữ liệu.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Về thời gian, nhóm theo loại ở một triệu dòng mất khoảng hai trăm phần nghìn
      giây bằng vòng lặp trên danh sách. Một lệnh trên bảng mất khoảng bảy mươi phần
      nghìn giây, nhanh hơn cỡ hai phẩy chín lần. Ở mười nghìn dòng hai cách cùng
      cỡ thời gian, và có máy lệnh trên bảng còn chậm hơn, vì nó có chi phí cố định.
      Đánh đổi là bảng nhanh vì tính theo cột bằng mã đã biên dịch, nhưng mọi dòng
      nằm trong bộ nhớ. Khi bảng lớn, ta chọn kiểu hẹp, chỉ đọc cột cần, hoặc đọc
      theo khối, nghĩa là mỗi lần chỉ đọc một phần tệp, rồi cộng dồn. Với hàng trăm
      triệu dòng trở lên, người làm nghề chuyển sang cơ sở dữ liệu.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - float('nan') != float('nan')
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nối hai điều kiện trên
      bảng bằng <code>and</code> thay cho <code>&amp;</code>.</div><div class="code"><div><span
      class="kw">import</span> pandas <span class="kw">as</span> pd</div><div>gd =
      pd.read_csv("gd.csv")</div><div>print(gd[(gd["so_tien"] &gt; 100000) <span class="kw">and</span>
      (gd["loai"] == "nap")])</div></div><div class="code"><div><span class="cm">ValueError:
      The truth value of a Series is ambiguous…</span></div></div><p>Đọc dòng cuối:
      “giá trị đúng/sai của cả một cột là mập mờ”. <code>and</code> đòi <b>một</b>
      đúng/sai; cột có <b>nhiều</b>. Dùng <code>&amp;</code>, <code>|</code>, và ngoặc.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là nối hai điều kiện trên bảng bằng từ và thay
      cho dấu và. Dòng cuối nói giá trị đúng sai của cả một cột là mập mờ. Từ và đòi
      một giá trị đúng sai, trong khi cột có nhiều. Phải dùng dấu và, dấu gạch đứng,
      và đặt mỗi điều kiện trong ngoặc.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Tổng bỏ qua ô thiếu
      và <b>không báo</b>: số trông hợp lý nhưng thiếu một giao dịch.</div><div class="code"><div><span
      class="kw">import</span> pandas <span class="kw">as</span> pd</div><div>gd =
      pd.read_csv("gd.csv")</div><div>print(gd["so_tien"].isna().sum())</div><div>print(gd["so_tien"].sum())</div></div><div
      class="code"><div>1</div><div>4750000.0</div></div><p>Tổng $4\,750\,000$ chỉ
      của $6$ trong $7$ giao dịch. Phép thử: <b>luôn in <code>isna().sum()</code></b>
      trước khi tin một tổng, và ghi lại cách xử lý thiếu.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là tổng bỏ qua ô thiếu mà không báo. Bốn
      triệu bảy trăm năm mươi nghìn trông hợp lý, nhưng chỉ là của sáu trong bảy giao
      dịch. Phép thử là luôn in số ô thiếu trước khi tin một tổng, và ghi lại cách
      xử lý.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> So giá trị thiếu
      bằng <code>==</code>.</div><div class="code"><div><span class="kw">import</span>
      pandas <span class="kw">as</span> pd</div><div>gd = pd.read_csv("gd.csv")</div><div>print((gd["so_tien"]
      == float("nan")).sum(), gd["so_tien"].isna().sum())</div></div><div class="code"><div>0
      1</div></div><p><code>NaN == NaN</code> là <b>sai</b> (nó “không phải số”, không
      bằng cả chính nó): đếm bằng <code>==</code> ra $0$, đúng phải là <code>isna()</code>
      $= 1$. <code>float("nan")</code> tự dựng giá trị thiếu <code>NaN</code> bằng
      tay để thử so sánh.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là so giá trị thiếu bằng dấu hai bằng. Ở
      đây lệnh đổi chữ sang số, với chữ nan, tự dựng một giá trị thiếu. Giá trị thiếu
      không bằng cả chính nó, nên đếm bằng phép so ra không, trong khi đúng phải là
      một. Luôn dùng lệnh hỏi thiếu.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 300 + 500 == 800
  - round((300 + 200 + 500) / 3, 2) == 333.33 and (300 + 200 + 500) / 4 == 250
  steps:
  - show: '<p><b>Đề.</b> Bảng nhỏ <code>kk</code> gồm $4$ dòng (một ô số tiền thiếu).</p>

      <table class=''t''><tr><th>kenh</th><th>so_tien</th></tr><tr><td>quay</td><td>300</td></tr><tr><td>mang</td><td>200</td></tr><tr><td>quay</td><td>500</td></tr><tr><td>mang</td><td>(thiếu)</td></tr></table>

      <ol><li><code>kk.groupby("kenh")["so_tien"].sum()</code> cho mỗi kênh bao nhiêu?</li>

      <li><code>kk["so_tien"].mean()</code> bằng bao nhiêu? Điền $0$ vào ô thiếu rồi
      lấy trung bình thì sao?</li></ol>

      <p><b>Quyết định:</b> tệp $10^8$ dòng, $4$ cột: <b>đọc cả một lần</b> hay <b>đọc
      theo khối</b>? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 4
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Bảng nhỏ có bốn dòng, kênh và số tiền, một ô
      số tiền thiếu. Câu một, tổng theo từng kênh là bao nhiêu. Câu hai, trung bình
      của cột số tiền bằng bao nhiêu, và nếu điền không vào ô thiếu thì sao. Sau đó
      là một quyết định, tệp một trăm triệu dòng bốn cột, đọc cả một lần hay đọc theo
      khối, và vì sao. Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th></tr><tr><td>1</td><td><code>quay</code>:
      $300 + 500 = 800$; <code>mang</code>: $200$ (ô thiếu không được cộng). Tổng
      hai nhóm $= 1000$</td></tr><tr><td>2</td><td>ô thiếu bị bỏ qua: $\frac{300 +
      200 + 500}{3} \approx 333{,}33$ (chia cho $3$, không phải $4$); điền $0$ thì
      chia cho $4$ được $250$</td></tr></table>'
    say: Đáp án như sau. Câu một, kênh quầy cộng được tám trăm, kênh mạng chỉ có hai
      trăm, vì ô thiếu không được cộng. Câu hai, ô thiếu bị bỏ qua nên trung bình
      chia cho ba, được ba trăm ba mươi ba phẩy ba ba. Nếu điền không thì chia cho
      bốn, được hai trăm năm mươi.
