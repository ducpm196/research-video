- id: formula
  kind: formula
  title: 'Suy ra từng bước: đọc, chọn bằng mặt nạ, nhóm, giá trị thiếu'
  checks:
  - 800000 + 1000000 + 2000000 > 0 and 2000000 + 1000000 == 3000000
  - 500000 + 150000 + 800000 == 1450000 and 1450000 + 3000000 + 300000 == 4750000
  - 500000 + 300000 + 1000000 == 1800000 and 2000000 + 800000 == 2800000
  - round(4750000 / 6, 4) == 791666.6667 and round(4750000 / 7, 2) == 678571.43
  steps:
  - show: '<p><b>Tệp gd.csv dùng suốt bài: bảy giao dịch, năm cột</b></p><div class="code"><div>ma,ngay,loai,tai_khoan,so_tien</div><div>1,2026-03-01,chuyen,A01,500000</div><div>2,2026-03-01,nap,A02,2000000</div><div>3,2026-03-02,rut,A01,300000</div><div>4,2026-03-02,chuyen,A03,150000</div><div>5,2026-03-03,nap,A01,1000000</div><div>6,2026-03-03,rut,A03,</div><div>7,2026-03-04,chuyen,A02,800000</div></div><p>Ô
      <code>so_tien</code> của giao dịch $6$ để <b>trống</b>: đó là <b>giá trị thiếu</b>.
      Tệp <code>gd.csv</code> nằm cùng thư mục với chương trình.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Vì mọi ví dụ sau đều đọc tệp này, ta xem nó trước. Đây là tệp giao dịch dùng
      suốt bài, bảy giao dịch và năm cột. Giao dịch thứ sáu có ô số tiền để trống,
      và ta sẽ thấy ô thiếu đó làm đổi kết quả thế nào.
  - show: '<p><b>Bước 1. Đọc: hình dạng và kiểu từng cột</b></p><div class="code"><div><span
      class="kw">import</span> pandas <span class="kw">as</span> pd</div><div>gd =
      pd.read_csv("gd.csv")</div><div>print(gd.shape)</div><div>print(gd.dtypes)</div></div><div
      class="code"><div>(7, 5)</div><div>ma             int64</div><div>ngay             str</div><div>loai             str</div><div>tai_khoan        str</div><div>so_tien      float64</div><div>dtype:
      object</div></div><p>Vì CSV chỉ là chữ, thư viện <b>đoán kiểu</b> từng cột:
      <code>so_tien</code> thành số <b>thực</b> (<code>float64</code>) vì có ô trống.
      <code>str</code> là kiểu chữ (đo bằng <b>pandas 3.1.1</b>; bản 2.x hiện <code>object</code>).</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước một, đọc tệp. Bảng có bảy dòng, năm cột. Vì tệp chỉ là chữ, thư viện
      đoán kiểu từng cột, và kiểu chữ hiện viết tắt là chuỗi. Tên kiểu này là của
      bản thư viện ghim trong khoá, bản cũ hơn ghi tên khác. Cột số tiền thành số
      thực, dù các số đều nguyên, vì có một ô trống, tức giá trị thiếu, mà số nguyên
      không chứa được.
  - show: <p><b>Xem nhanh ba dòng đầu</b></p><div class="code"><div><span class="kw">import</span>
      pandas <span class="kw">as</span> pd</div><div>gd = pd.read_csv("gd.csv")</div><div>print(gd.head(3))</div></div><div
      class="code"><div>   ma        ngay    loai tai_khoan    so_tien</div><div>0   1  2026-03-01  chuyen       A01   500000.0</div><div>1   2  2026-03-01     nap       A02  2000000.0</div><div>2   3  2026-03-02     rut       A01   300000.0</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Vì vậy ba dòng đầu cho ta xem nhanh dữ liệu mà không cần mở cả tệp. Số tiền
      hiện dưới dạng số thực, có một chữ số không sau dấu phẩy.
  - show: '<p><code>gd.loc[điều_kiện, "cột"]</code>: trong ngoặc vuông, <b>điều kiện</b>
      chọn dòng, dấu phẩy, rồi <b>tên cột</b> cần lấy.</p><p><b>Bước 2. Chọn dòng
      bằng mặt nạ, tính trên một cột</b></p><div class="code"><div><span class="kw">import</span>
      pandas <span class="kw">as</span> pd</div><div>gd = pd.read_csv("gd.csv")</div><div>lon
      = gd[gd["so_tien"] &gt;= 800000]</div><div>print(lon[["ma", "loai", "so_tien"]])</div><div>print(gd.loc[gd["loai"]
      == "nap", "so_tien"].sum())</div></div><div class="code"><div>   ma    loai    so_tien</div><div>1   2     nap  2000000.0</div><div>4   5     nap  1000000.0</div><div>6   7  chuyen   800000.0</div><div>3000000.0</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước hai, chọn bằng mặt nạ. Vì so sánh cột số tiền với tám trăm nghìn cho
      một cột đúng sai theo từng dòng, đưa nó vào trong ngoặc vuông giữ các dòng đúng,
      được ba dòng. Dòng lệnh thứ hai dùng cách chọn có nhãn: trong ngoặc vuông ghi
      điều kiện, dấu phẩy, rồi tên cột, để chọn các dòng thoả điều kiện và lấy đúng
      cột đó.'
    introduces:
    - pyt_loc
  - show: '<div class=''box key''>Vì <code>so_tien &gt;= 800000</code> cho một cột
      đúng/sai theo từng dòng, đưa nó vào <code>gd[…]</code> giữ các dòng đúng: $3$
      dòng. Dòng thứ hai (<code>.loc</code>) chọn các dòng thoả điều kiện rồi lấy
      đúng cột đó. Tổng tiền loại <code>nap</code>: $2\,000\,000 + 1\,000\,000 = 3\,000\,000$
      ✓</div>'
    clear: true
    say: Vì vậy nó cộng tiền các giao dịch nạp, hai triệu cộng một triệu bằng ba triệu.
  - show: '<p><b>Bước 3. Nhóm: tách – tính – gộp</b></p><div class="code"><div><span
      class="kw">import</span> pandas <span class="kw">as</span> pd</div><div>gd =
      pd.read_csv("gd.csv")</div><div>print(gd.groupby("loai")["so_tien"].agg(["count",
      "sum"]))</div></div><div class="code"><div>        count        sum</div><div>loai</div><div>chuyen      3  1450000.0</div><div>nap         2  3000000.0</div><div>rut         1   300000.0</div></div><p>Vì
      mỗi nhóm cộng riêng: <code>chuyen</code> $500\,000 + 150\,000 + 800\,000 = 1\,450\,000$;
      <code>nap</code> $2\,000\,000 + 1\,000\,000 = 3\,000\,000$; <code>rut</code>
      chỉ $300\,000$ (rút thứ hai có ô tiền trống nên không đếm).</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, nhóm. Nhóm theo loại, đếm và cộng tiền mỗi nhóm. Vì mỗi nhóm cộng
      riêng, ba giao dịch chuyển cộng được một triệu bốn trăm năm mươi nghìn, hai
      giao dịch nạp cộng ba triệu. Chỉ một giao dịch rút có tiền cộng ba trăm nghìn,
      vì giao dịch rút thứ hai có ô tiền trống nên không được đếm.
  - show: '<p><b>Nhóm theo tài khoản</b></p><div class="code"><div><span class="kw">import</span>
      pandas <span class="kw">as</span> pd</div><div>gd = pd.read_csv("gd.csv")</div><div>print(gd.groupby("tai_khoan")["so_tien"].sum())</div></div><div
      class="code"><div>tai_khoan</div><div>A01    1800000.0</div><div>A02    2800000.0</div><div>A03     150000.0</div><div>Name:
      so_tien, dtype: float64</div></div><p><code>A01</code>: $500\,000 + 300\,000
      + 1\,000\,000 = 1\,800\,000$; <code>A02</code>: $2\,000\,000 + 800\,000 = 2\,800\,000$;
      <code>A03</code>: $150\,000$. Kiểm: ba nhóm cộng lại $= 4\,750\,000$.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Nhóm theo tài khoản cho tổng theo từng tài khoản. Tài khoản A không một gồm
      ba giao dịch, năm trăm nghìn, ba trăm nghìn và một triệu, cộng được một triệu
      tám trăm nghìn. Tài khoản A không hai có hai triệu tám trăm nghìn. Tài khoản
      A không ba chỉ có một trăm năm mươi nghìn.
  - show: '<p><b>Bước 4. Giá trị thiếu: tổng và trung bình bỏ qua nó</b></p><div class="code"><div><span
      class="kw">import</span> pandas <span class="kw">as</span> pd</div><div>gd =
      pd.read_csv("gd.csv")</div><div>print(gd["so_tien"].isna().sum())</div><div>print(gd["so_tien"].sum())</div><div>print(gd["so_tien"].count(),
      gd["so_tien"].mean())</div></div><div class="code"><div>1</div><div>4750000.0</div><div>6
      791666.6666666666</div></div><p><code>isna()</code> cho một cột đúng/sai (<code>True</code>
      ở ô thiếu); <code>True</code> tính là $1$, <code>False</code> là $0$, nên <code>.sum()</code>
      đếm số ô thiếu.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước bốn, giá trị thiếu. Vì tệp có một ô trống, ta đếm ô thiếu, cộng, và
      lấy trung bình. Hỏi thiếu cho cột đúng sai, đúng tính là một, nên tổng đếm số
      ô thiếu. Có một ô thiếu. Tổng là bốn triệu bảy trăm năm mươi nghìn, và trung
      bình chia cho sáu ô có số.
  - show: '<p><b>Bỏ dòng thiếu, hoặc điền không</b></p><div class="code"><div><span
      class="kw">import</span> pandas <span class="kw">as</span> pd</div><div>gd =
      pd.read_csv("gd.csv")</div><div>sach = gd.dropna(subset=["so_tien"])</div><div>print(len(sach))</div><div>print(gd["so_tien"].fillna(0).mean())</div></div><div
      class="code"><div>6</div><div>678571.4285714285</div></div><p>Vì <code>sum</code>
      và <code>mean</code> bỏ qua ô thiếu: tổng $4\,750\,000$ của $6$ ô; trung bình
      chia cho $6$. Điền $0$ vào ô thiếu thì chia cho $7$, trung bình thấp hơn: $\frac{4\,750\,000}{7}
      \approx 678\,571$. <code>gd.dropna(subset=["so_tien"])</code> bỏ các dòng mà
      cột <code>so_tien</code> thiếu (<code>subset</code> = chỉ xét các cột được nêu).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lệnh bỏ dòng thiếu, kèm tên cột cần xét, còn sáu dòng. Nếu điền không vào
      ô thiếu thì phải chia cho bảy, và trung bình thấp hơn. Vì thế quyết định bỏ,
      điền hay giữ ô thiếu đổi kết quả, và phải được nêu rõ.
