scenes:
- id: hook
  kind: hook
  title: 'Bảng một triệu dòng: nhóm một lệnh, bộ nhớ nhân theo số dòng'
  steps:
  - show: '<table class=''t''><tr><th>bảng giao dịch bốn cột, cột chữ kiểu thường</th><th>bộ
      nhớ (đo, số minh hoạ)</th><th>nhóm theo loại: vòng lặp Python trên danh sách</th><th>nhóm
      theo loại: một lệnh trên bảng</th></tr><tr><td>10 000 dòng</td><td>≈ 1,4 MB</td><td>≈
      2 ms</td><td>≈ 1 ms</td></tr><tr><td>1 000 000 dòng</td><td>≈ 140 MB</td><td>≈
      200 ms</td><td>≈ 70 ms</td></tr><tr><td>100 000 000 dòng (ngoại suy)</td><td>≈
      14 GB</td><td>≈ 20 s</td><td>≈ 7 s</td></tr></table><p class=''note''>Bốn cột:
      <code>ma</code>, <code>loai</code>, <code>tai_khoan</code>, <code>so_tien</code>
      (chưa tính cột ngày). Vòng lặp duyệt các danh sách đã có sẵn trong bộ nhớ. <b>Ngoại
      suy</b> = nhân theo tỉ lệ từ số đã đo (ước lượng, chưa đo).</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: 'Chào bạn, một bảng giao dịch có một triệu dòng, bốn cột là mã, loại, tài
      khoản và số tiền. Trên máy kiểm nó chiếm khoảng một trăm bốn mươi triệu byte
      bộ nhớ, tức cỡ một trăm bốn mươi byte mỗi dòng. Nhóm theo loại giao dịch bằng
      vòng lặp thuần trên danh sách mất khoảng hai trăm phần nghìn giây, còn bằng
      một lệnh trên bảng mất khoảng bảy mươi phần nghìn giây. Ngoại suy, tức nhân
      theo tỉ lệ từ số đã đo, một trăm triệu dòng: bảng chiếm khoảng mười bốn tỉ byte,
      nhiều hơn bộ nhớ của nhiều máy cá nhân. Số đo trên máy kiểm, số minh hoạ. Hôm
      nay ta học công cụ này và học nhìn ra giới hạn của nó.'
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Đọc một tệp CSV thành <b>bảng</b>, <b>chọn</b> và <b>nhóm</b> các dòng
      ra sao?</li>

      <li><b>Ghép</b> hai bảng, và xử lý <b>giá trị thiếu</b> và <b>ngày</b> thế nào
      cho đúng?</li>

      <li>Vì sao bộ nhớ tăng theo số dòng, và có cách nào giảm?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, đọc một tệp bảng thành bảng trong chương
      trình, chọn và nhóm các dòng ra sao. Hai, ghép hai bảng, và xử lý giá trị thiếu
      và ngày thế nào cho đúng. Ba, vì sao bộ nhớ tăng theo số dòng, và có cách nào
      giảm.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: mảng và trục, mặt nạ, đọc CSV, nhóm bằng từ điển'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      mảng, trục, mặt nạ</td><td><code>a.sum(axis=0)</code> gộp theo cột; <code>a[a
      &gt; 1000]</code> chọn bằng mặt nạ đúng/sai</td></tr><tr><td>② đọc tệp CSV</td><td><code>csv.DictReader</code>:
      mỗi dòng một từ điển, mọi giá trị là <b>chuỗi</b></td></tr><tr><td>③ nhóm bằng
      từ điển</td><td><code>d[k] = d.get(k, 0) + tien</code> cộng dồn theo khoá</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 1
    say: Ta ôn lại ba điều. Mảng cho phép tính theo trục và chọn bằng mặt nạ đúng
      sai. Bộ đọc bảng của thư viện chuẩn cho mỗi dòng một từ điển, với mọi giá trị
      là chuỗi. Và từ điển cộng dồn theo khoá để nhóm. Thư viện bảng dữ liệu gộp cả
      ba ý đó lại, và thêm nhãn cho hàng và cột.
- id: sym
  kind: symbol
  title: Giải mã bảng, cột, mặt nạ, nhóm, ghép và giá trị thiếu
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>pd.read_csv("gd.csv")</code></td><td>đọc
      CSV thành bảng</td><td><code>pd</code> là tên ngắn của thư viện; kết quả là
      <b>bảng</b> (<code>DataFrame</code>): hàng có <b>số thứ tự</b>, cột có <b>tên</b></td></tr><tr><td><code>gd.shape</code>,
      <code>gd.dtypes</code>, <code>gd.head(3)</code></td><td>hình dạng, kiểu từng
      cột, 3 dòng đầu</td><td><code>(7, 5)</code> = 7 hàng, 5 cột; mỗi cột <b>một
      kiểu</b></td></tr><tr><td><code>gd["so_tien"]</code>, <code>gd[["ma", "loai"]]</code></td><td>lấy
      một cột, nhiều cột</td><td>một cột là <b>chuỗi giá trị có nhãn</b> (<code>Series</code>);
      nhiều cột là bảng con</td></tr></table>'
    say: Bảng đầu là bảng dữ liệu. Lệnh đọc biến tệp thành bảng, hàng có số thứ tự,
      cột có tên. Ba lệnh xem nhanh cho hình dạng, kiểu từng cột và vài dòng đầu.
      Mỗi cột có đúng một kiểu. Lấy một cột cho một chuỗi giá trị có nhãn, lấy nhiều
      cột cho một bảng con.
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>gd[gd["so_tien"]
      &gt;= 800000]</code></td><td>chọn dòng bằng mặt nạ</td><td>mặt nạ đúng/sai theo
      từng dòng; nhiều điều kiện nối bằng <code>&amp;</code> (và), <code>|</code>
      (hoặc), mỗi điều kiện đặt trong <b>ngoặc tròn</b></td></tr><tr><td><code>gd.groupby("loai")["so_tien"].sum()</code></td><td>nhóm
      rồi tính</td><td>tách các dòng thành nhóm theo <code>loai</code>, tính tổng
      <code>so_tien</code> mỗi nhóm; <code>.agg(["count", "sum"])</code> tính nhiều
      thứ</td></tr><tr><td><code>gd.merge(tk, on="tai_khoan", how="left")</code></td><td>ghép
      hai bảng</td><td>nối theo cột chung; <code>left</code> giữ <b>mọi dòng</b> của
      bảng bên trái</td></tr></table>
    clear: true
    say: Bảng thứ hai là chọn, nhóm, ghép. Chọn dòng bằng mặt nạ, và nhiều điều kiện
      nối bằng dấu và hay dấu gạch đứng, mỗi điều kiện đặt trong ngoặc tròn. Nhóm
      là tách các dòng theo một cột rồi tính trên mỗi nhóm. Ghép nối hai bảng theo
      cột chung, và kiểu trái giữ mọi dòng của bảng bên trái.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>s.isna()</code>,
      <code>s.dropna()</code>, <code>s.fillna(0)</code></td><td>hỏi thiếu, bỏ dòng
      thiếu, điền</td><td>giá trị thiếu hiện là <code>NaN</code> (không phải số);
      <code>sum</code>, <code>mean</code> <b>bỏ qua</b> nó</td></tr><tr><td><code>parse_dates=["ngay"]</code>,
      <code>s.dt.day</code></td><td>đọc cột ngày, lấy ngày trong tháng</td><td>không
      khai thì cột ngày chỉ là chữ</td></tr><tr><td><code>astype("category")</code></td><td>kiểu
      danh mục</td><td>lưu mỗi giá trị chữ lặp lại <b>một lần</b>, các dòng chỉ giữ
      mã số: tiết kiệm bộ nhớ</td></tr></table>'
    clear: true
    say: Bảng cuối là giá trị thiếu, ngày và kiểu danh mục. Giá trị thiếu hiện là
      một ký hiệu không phải số, và các phép tổng, trung bình bỏ qua nó. Khai cột
      ngày khi đọc thì mới có kiểu ngày, không thì chỉ là chữ. Kiểu danh mục lưu mỗi
      giá trị chữ lặp lại một lần, các dòng chỉ giữ mã số, nên tiết kiệm bộ nhớ.
