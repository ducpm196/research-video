- id: practice
  kind: practice
  title: 'Tự làm: thống kê giao dịch theo loại và theo ngày'
  steps:
  - show: '<p><b>Đề</b> (cần môi trường ảo đã cài thư viện): tạo <code>thong_ke.py</code>.
      Dòng đầu <b>ghi sẵn</b> <code>gd.csv</code> (8 giao dịch, cột <code>ma, ngay,
      loai, kenh, so_tien</code>; chép từ <code>de.md</code>; một ô <code>so_tien</code>
      trống). Rồi:</p>

      <ol><li>đọc với <code>parse_dates=["ngay"]</code>; in <code>Thieu so_tien: …</code>;</li>

      <li>bỏ dòng thiếu; in bảng <code>count</code> và <code>sum</code> theo <code>loai</code>;</li>

      <li>in tổng theo ngày (<code>.dt.day</code>); in <code>Ngay nhieu nhat: &lt;ngày&gt;
      &lt;tổng&gt;</code>: <code>idxmax()</code> cho <b>nhãn</b> (ở đây là ngày) của
      giá trị lớn nhất; tổng in dạng <b>số nguyên</b> (dùng <code>int(…)</code>, vì
      tổng là số thực).</li></ol><p class="note">Lưu tệp ở thư mục gốc của bộ khoá
      (nơi có thư mục <code>labs</code>), mở Git Bash tại đó để chấm.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 360
    say: Bây giờ tới phần bạn tự làm, trong môi trường ảo đã cài thư viện. Ghi sẵn
      tệp tám giao dịch từ đề bài, có một ô số tiền trống. Đọc với cột ngày được khai.
      In số ô thiếu. Bỏ dòng thiếu, rồi in bảng đếm và tổng tiền theo loại. In tổng
      theo ngày trong tháng, và in ngày có tổng lớn nhất cùng tổng đó, viết thành
      số nguyên. Hãy dừng video và làm.
    introduces:
    - pyt_idxmax
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Thieu so_tien: 1</div><div>        count        sum</div><div>loai</div><div>chuyen      3  1540000.0</div><div>nap         2  8000000.0</div><div>rut         2  1200000.0</div><div>ngay</div><div>1    1700000.0</div><div>2    5250000.0</div><div>3     700000.0</div><div>4    3090000.0</div><div>Name:
      so_tien, dtype: float64</div><div>Ngay nhieu nhat: 2 5250000</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh PYT L10 thong_ke.py</code> — in <b>ĐÚNG</b>
      khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>gd["so_tien"].isna().sum()</code>;
      <code>sach = gd.dropna(subset=["so_tien"])</code>; <code>sach.groupby("loai")["so_tien"].agg(["count",
      "sum"])</code>; <code>theo_ngay = sach.groupby(sach["ngay"].dt.day)["so_tien"].sum()</code>;
      <code>theo_ngay.idxmax()</code>; <code>int(theo_ngay.max())</code>.

      Lời giải ở <code>labs/PYT/L10/loi_giai.py</code>.</div>

      '
    clear: true
    say: Nếu kẹt, đếm ô thiếu bằng lệnh hỏi thiếu, rồi bỏ dòng thiếu bằng lệnh bỏ.
      Nhóm theo loại với hai phép tính, nhóm theo ngày trong tháng. Tìm nhãn của giá
      trị lớn nhất, và đổi tổng sang số nguyên. Lời giải nằm trong thư mục thực hành,
      chỉ mở sau khi đã thử.
  lab: labs/PYT/L10
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>bảng = mảng có nhãn; mỗi cột một
      kiểu</span><span class=''a''>→</span><span class=''n''>chọn bằng mặt nạ; & |
      và ngoặc</span><span class=''a''>→</span><span class=''n''>nhóm: tách – tính
      – gộp; tổng nhóm = tổng gốc</span><span class=''a''>→</span><span class=''n''>ô
      thiếu: tổng bỏ qua, phải đếm và nêu cách xử lý</span><span class=''a''>→</span><span
      class=''n''>kiểu danh mục giảm bộ nhớ</span><span class=''a''>→</span><span
      class=''n''>mọi dòng nằm trong bộ nhớ: lớn thì đọc theo khối</span></div>'
    say: Tổng kết chuỗi logic. Bảng là mảng có nhãn, mỗi cột một kiểu. Chọn bằng mặt
      nạ, nối điều kiện bằng dấu và và ngoặc. Nhóm là tách, tính, gộp, và tổng các
      nhóm bằng tổng gốc. Ô thiếu bị tổng bỏ qua, nên phải đếm và nêu cách xử lý.
      Kiểu danh mục giảm bộ nhớ. Và mọi dòng nằm trong bộ nhớ, nên khi bảng lớn thì
      đọc theo khối.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi tin một con số từ bảng,
      hỏi ba câu: <b>có ô thiếu không?</b>, <b>tổng các nhóm có bằng tổng gốc không?</b>,
      và <b>bảng này nằm vừa bộ nhớ không?</b></div>

      <p>Bài sau: vẽ biểu đồ từ dữ liệu, và đọc biểu đồ cho đúng, kể cả khi biểu đồ
      cố ý đánh lừa.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    forward_ref: true
    say: Điều cần mang theo, trước khi tin một con số từ bảng hãy hỏi ba câu. Có ô
      thiếu không. Tổng các nhóm có bằng tổng gốc không. Và bảng này nằm vừa bộ nhớ
      không. Bài sau, ta học vẽ biểu đồ từ dữ liệu, và đọc biểu đồ cho đúng, kể cả
      khi biểu đồ cố ý đánh lừa.
    clear: true
