- id: formula
  kind: formula
  title: 'Suy ra từng bước: bộ nhớ theo số dòng, và vì sao đổi thiết kế'
  checks:
  - 10 ** 6 * 100 == 10 ** 8
  - 400000 + 250000 == 650000 and 650000 < 5400000
  steps:
  - show: '<p><b>Bước 0. Cách đo: thời gian và đỉnh bộ nhớ của một việc</b></p><div
      class="code"><div><span class="kw">import</span> time</div><div><span class="kw">import</span>
      tracemalloc</div><div>tracemalloc.start()</div><div>t0 = time.perf_counter()</div><div>dong
      = open("gd.csv", encoding="utf-8").read().split("\n")</div><div>giay = time.perf_counter()
      - t0</div><div>dinh = tracemalloc.get_traced_memory()[1]</div><div>print(len(dong),
      giay &gt; 0, dinh &gt; 0)</div></div><div class="code"><div>10 True True</div></div><p><code>perf_counter()</code>
