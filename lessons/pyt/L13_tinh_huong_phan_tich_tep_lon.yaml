    say: Trước khi làm, hãy đọc hàm chấm qua bảng này, nó làm năm việc. Việc một kiểm
      mã mô-đun của bạn không có lệnh đọc cả tệp. Việc hai và ba nạp mô-đun vừa ghi,
      vì máy tìm mô-đun trong một danh sách thư mục theo thứ tự, nên ta chèn thư mục
      của bạn lên đầu.
  - show: <table class='t'><tr><th>việc của hàm chấm</th><th>lệnh trong hàm</th><th>đọc
      là</th></tr><tr><td>4. ba ca kiểm qua</td><td><code>subprocess.run([sys.executable,
