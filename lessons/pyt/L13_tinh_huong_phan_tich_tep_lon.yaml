      encoding="utf-8", newline="") <span class="kw">as</span> f:</div><div>    tong
      = 0</div><div>    <span class="kw">for</span> hang <span class="kw">in</span>
      csv.DictReader(f):</div><div>        tong = tong + int(hang["so_tien"])</div><div>print(tong)</div></div><div
      class="code"><div>5400000</div></div><p>$1\,450\,000 + 3\,400\,000 + 550\,000
      = 5\,400\,000$ ✓ Cách B và cách C cho cùng ba số; phép kiểm này bắt được lỗi
      quên cộng dồn ở bước $3$.</p>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Đường kiểm khác, cộng tổng chung bằng một vòng lặp, không nhóm. Vì cách này
      độc lập với việc nhóm, nên nó kiểm được cả hai. Được năm triệu bốn trăm nghìn,
      đúng bằng tổng ba nhóm cộng lại. Phép kiểm này bắt được lỗi quên cộng dồn.
- id: scale
  kind: concept
  title: 'Ba quy mô, ba quyết định: thiết kế phải đổi khi dữ liệu đổi bậc'
  checks:
  - 10 ** 8 // 10 ** 6 == 100
  steps:
  - show: '<table class=''t''><tr><th>quy mô</th><th>A: cả tệp</th><th>B: từng dòng</th><th>C:
      từng khối</th><th>nên chọn</th></tr><tr><td>10<sup>3</sup> dòng</td><td>≈ 10 ms,
      ≈ 98 KB</td><td>≈ 3 ms, ≈ 42 KB</td><td>≈ 3 ms, ≈ 300 KB</td><td>cách đơn giản
      nhất</td></tr><tr><td>10<sup>6</sup> dòng</td><td>≈ 800 ms, ≈ 94 MB</td><td>≈ 2 s,
      ≈ 43 KB</td><td>≈ 300 ms, ≈ 9,3 MB</td><td>B hoặc C; A còn chạy được</td></tr><tr><td>10<sup>8</sup>
      dòng (ngoại suy)</td><td>≈ 9,4 GB (hết bộ nhớ)</td><td>≈ 3 phút, ≈ 43 KB</td><td>≈ 30 s,
      ≈ 9,3 MB</td><td>C (hoặc cơ sở dữ liệu: chương trình chuyên lưu và tìm trong
      bảng rất lớn)</td></tr></table><p class=''note''>Cách đo: thời gian = <code>time.perf_counter()</code>
      sau trừ trước việc cần đo; đỉnh bộ nhớ = <code>tracemalloc.get_traced_memory()[1]</code>.
      Số minh hoạ trên máy kiểm; ở $10^3$ dòng cả ba cách chỉ vài phần nghìn giây
      nên chênh lệch không có ý nghĩa; <b>ngoại suy</b> = nhân theo tỉ lệ từ số đã
      đo.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bảng này tóm tắt ba quy mô. Ở một nghìn dòng, chọn cách đơn giản nhất, vì
      cả ba đều rẻ. Ở một triệu dòng, từng dòng hay từng khối đều tốt, còn cả tệp
      tốn khoảng chín mươi bốn triệu byte. Ở một trăm triệu dòng, cả tệp cần khoảng
      chín phẩy bốn tỉ byte, hết bộ nhớ, nên từng khối là lựa chọn hợp lý, cỡ khoảng
      ba mươi giây với bộ nhớ không đổi.
  - show: '<div class=''box key''><b>Đánh đổi và điều kiện áp dụng:</b> cách C nhanh
      nhưng cần thư viện ngoài và phải <b>cộng dồn đúng</b>; cách B không cần gì ngoài
      thư viện chuẩn nhưng chậm hơn. Cách cộng dồn chỉ dùng được cho thống kê <b>có
      thể gộp</b> (tổng, đếm, nhỏ nhất, lớn nhất). <b>Trung vị</b> (giá trị đứng giữa
      khi xếp các số từ nhỏ đến lớn; ví dụ trung vị của $1, 2, 9$ là $2$), hay nối
      hai tệp lớn, <b>không</b> gộp được theo khối: cần xếp trên đĩa (sắp xếp bằng
      cách ghi từng phần ra đĩa rồi trộn lại), ước lượng, hoặc cơ sở dữ liệu. Và <b>đo
      trước khi đổi</b>: ở $10^3$ dòng, mọi tối ưu chỉ làm mã khó đọc hơn.</div>'
    introduces:
    - pyt_trung_vi
    clear: true
    say: 'Đánh đổi và điều kiện áp dụng. Cách từng khối nhanh nhưng cần thư viện ngoài
      và phải cộng dồn đúng. Cách từng dòng không cần gì ngoài thư viện chuẩn nhưng
      chậm hơn. Cách cộng dồn chỉ dùng được cho thống kê có thể gộp, như tổng, đếm,
      nhỏ nhất, lớn nhất. Trung vị là giá trị đứng giữa khi xếp các số từ nhỏ đến
      lớn, và không gộp được theo khối: cần xếp trên đĩa, ước lượng, hoặc cơ sở dữ
      liệu. Hãy đo trước khi đổi, vì ở một nghìn dòng mọi tối ưu chỉ làm mã khó đọc
      hơn.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 650000 != 5400000
  - (2 + 4) / 2 == 3 and (3 + 4) / 2 == 3.5
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên cộng dồn qua các khối.</div><div
      class="code"><div><span class="kw">import</span> pandas <span class="kw">as</span>
      pd</div><div><span class="kw">for</span> khoi <span class="kw">in</span> pd.read_csv("gd.csv",
      chunksize=3):</div><div>    tong = khoi.groupby("loai")["so_tien"].sum()</div><div>print({loai:
      int(tien) <span class="kw">for</span> loai, tien <span class="kw">in</span>
      tong.items()})</div></div><div class="code"><div>{''nap'': 400000, ''rut'':
      250000}</div></div><p>Kết quả sai mà <b>không báo lỗi</b>. Phép thử: đối chiếu
      với <b>tổng chung</b> tính bằng đường khác (bước kiểm).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là quên cộng dồn qua các khối. Kết quả sai mà
      không báo lỗi. Phép thử là đối chiếu với tổng chung tính bằng đường khác.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Tối ưu trước khi
      đo: viết lại cách phức tạp khi dữ liệu chưa tới ngưỡng cần.</div><p>Ở $10^3$
      dòng, cách đơn giản mất ≈ 10 ms: viết lại thành khối là <b>tốn công, thêm lỗi,
      không lợi gì</b>. Ngược lại, <b>không đo quy mô sắp tới</b> làm chương trình
      chết lúc nửa đêm. Phép thử: <b>đo ở hai quy mô</b> rồi ngoại suy bộ nhớ.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là tối ưu trước khi đo. Ở một nghìn dòng,
      cách đơn giản mất khoảng mười phần nghìn giây, viết lại thành khối là tốn công,
      thêm lỗi, không lợi gì. Nhưng ngược lại, không đo quy mô sắp tới làm chương
      trình chết lúc nửa đêm. Phép thử là đo ở hai quy mô rồi ngoại suy bộ nhớ.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nhầm thống kê gộp
      được với không gộp được.</div><p>Tổng, đếm, nhỏ nhất, lớn nhất: gộp qua các
      khối đúng. <b>Trung bình của các trung bình</b> chỉ đúng khi mọi khối cùng cỡ;
      <b>trung vị</b> thì không gộp được: trung vị của các trung vị khối <b>khác</b>
      trung vị cả tệp. Ví dụ: hai khối $[1, 2, 9]$ và $[3, 4, 5]$ có trung vị $2$
      và $4$, trung vị của hai số đó là $3$; nhưng trung vị cả sáu số là $\frac{3
      + 4}{2} = 3{,}5$.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là nhầm thống kê gộp được với không gộp
      được. Tổng, đếm, nhỏ nhất, lớn nhất gộp qua các khối đúng, còn trung vị thì
      không. Hai khối một, hai, chín và ba, bốn, năm có trung vị hai và bốn, trung
      vị của hai số đó là ba. Nhưng trung vị của cả sáu số là ba phẩy năm.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 5 * 10 ** 9 < 8 * 10 ** 9
  - 5 * 5 * 10 ** 9 > 8 * 10 ** 9
  steps:
  - show: '<p><b>Đề.</b> Tệp $5$ GB, máy có $8$ GB bộ nhớ.</p>

      <ol><li>Cần tổng tiền theo $50\,000$ tài khoản: cách A, B hay C? Vì sao?</li>

      <li>Cần <b>trung vị</b> số tiền của cả tệp: cộng dồn theo khối có đủ không?</li></ol>

      <p><b>Quyết định:</b> báo cáo chạy $2$ giây trên $10^3$ dòng. Có nên viết lại
      ngay theo khối không?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Tệp năm tỉ byte, máy có tám tỉ byte bộ nhớ.
      Câu một, cần tổng tiền theo năm mươi nghìn tài khoản, dùng cách một, hai hay
      ba, và vì sao. Câu hai, cần trung vị số tiền của cả tệp, cộng dồn theo khối
      có đủ không. Sau đó là một quyết định, báo cáo chạy hai giây trên một nghìn
      dòng, có nên viết lại ngay theo khối không. Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th></tr><tr><td>1</td><td><b>B
      hoặc C</b>: kết quả chỉ là $50\,000$ khoá, nhỏ; mỗi dòng xem xong là bỏ. A giữ
      bộ nhớ cỡ $5$ lần dung lượng tệp, tức cỡ $25$ GB, nhiều hơn $8$ GB nên chắc
      chắn hết bộ nhớ</td></tr><tr><td>2</td><td><b>không đủ</b>: trung vị không gộp
      được từ trung vị các khối; cần xếp trên đĩa, lấy mẫu để ước lượng, hoặc cơ sở
      dữ liệu</td></tr></table>'
    say: Đáp án như sau. Câu một, từng dòng hoặc từng khối, vì kết quả chỉ năm mươi
      nghìn khoá. Cách cả tệp cần cỡ hai mươi lăm tỉ byte, nhiều hơn tám tỉ byte của
      máy. Câu hai, không đủ, vì trung vị không gộp được từ trung vị các khối; cần
      xếp trên đĩa, lấy mẫu ước lượng, hoặc cơ sở dữ liệu.
    clear: true
  - show: <div class='box key'><b>Quyết định:</b> <b>chưa</b>. Hai giây ở $10^3$ dòng
      là do lệnh khác (hoặc đo sai), không phải do cách đọc. Hãy <b>đo</b> chỗ nào
      chậm trước, rồi mới sửa. Chỉ cần đổi thiết kế khi số dòng hoặc bộ nhớ sắp chạm
      ngưỡng, và có phép kiểm tổng để chắc kết quả không đổi.</div>
    clear: true
    say: Quyết định, chưa. Hai giây ở một nghìn dòng là do việc khác, hoặc đo sai,
      không phải do cách đọc. Hãy đo chỗ nào chậm trước rồi mới sửa. Chỉ đổi thiết
      kế khi số dòng hoặc bộ nhớ sắp chạm ngưỡng, và có phép kiểm tổng để chắc kết
      quả không đổi.
- id: practice
  kind: practice
  title: 'Tự làm: dựng dự án nhỏ và tự chấm bằng thang 10 điểm'
  steps:
  - show: <table class='t'><tr><th>việc của hàm chấm</th><th>lệnh trong hàm</th><th>đọc
      là</th></tr><tr><td>1. kiểm đọc từng dòng</td><td><code>ma = (p / "phan_tich.py").read_text(…)</code>,
      <code>".read(" not in ma</code></td><td>đọc mã mô-đun của bạn thành chuỗi <code>ma</code>,
      rồi kiểm trong đó không có chữ <code>.read(</code></td></tr><tr><td>2–3. kết
      quả, tệp rỗng</td><td><code>sys.path.insert(0, str(p))</code>, <code>import
