    clear: true
  - show: '<p><b>Đề</b> (cần môi trường ảo đã cài thư viện): tạo <code>du_an.py</code>
      gồm: dòng đầu <code>import pytest</code>; hàm chấm <code>cham(thu_muc)</code>
      <b>chép nguyên</b> từ <code>de.md</code> (5 tiêu chí, 10 điểm); chuỗi <code>MODULE</code>,
      <code>TESTS</code> do <b>bạn viết</b>; rồi ghi ba tệp vào một thư mục tạm và
      gọi <code>cham</code>:</p>

      <ol><li><code>phan_tich.py</code>: <code>tong_theo_loai(duong_dan)</code> trả
      <code>(tổng theo loại, số dòng bỏ qua)</code>, đọc <b>từng dòng</b>, bỏ qua
      dòng <code>so_tien</code> hỏng;</li>

      <li><code>test_phan_tich.py</code>: <b>3</b> ca (tổng đúng, dòng hỏng, tệp rỗng);
      <code>requirements.txt</code> có dòng ghim <code>==</code>;</li>

      <li><b>đo</b>: với tệp $2\,000$ rồi $20\,000$ dòng, đo đỉnh bộ nhớ của hàm bằng
      <code>tracemalloc</code>, rồi in <code>Bo nho khi dong tang 10 lan: …</code>
      (<code>gan nhu khong doi</code> hay <code>tang theo so dong</code>).</li></ol>

      <p class="note">Video dừng 20 phút cho lượt đầu; cả bài dự kiến 45–60 phút (xem
      <code>de.md</code>): cứ làm tiếp sau khi video chạy lại.</p><p class="note">Lưu
      tệp ở thư mục gốc của bộ khoá (nơi có thư mục <code>labs</code>), mở Git Bash
      tại đó để chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 4
    pause: 1200
    say: Bây giờ tới phần bạn tự làm, trong môi trường ảo đã cài thư viện. Viết một
      chương trình chép nguyên hàm chấm từ tệp đề bài. Rồi bạn viết mô-đun đọc từng
      dòng, trả về tổng theo loại và số dòng bỏ qua, ba ca kiểm, và tệp thư viện có
      dòng ghim. Ghi ba tệp vào thư mục tạm, gọi hàm chấm, rồi đo đỉnh bộ nhớ với
      tệp hai nghìn và hai mươi nghìn dòng. Video dừng hai mươi phút cho lượt đầu,
