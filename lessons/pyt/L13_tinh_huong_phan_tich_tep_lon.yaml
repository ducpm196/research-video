      Ba ca kiem qua: DAT (2/2)</div><div>5. Ghim phien ban: DAT (1/1)</div><div>Tong
      diem: 10/10</div><div>Bo nho khi dong tang 10 lan: gan nhu khong doi</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh PYT L13 du_an.py</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
