scenes:
- id: hook
  kind: hook
  title: 'Báo cáo chết lúc 3 giờ sáng: tệp giao dịch đã lớn một trăm nghìn lần'
  steps:
  - show: '<table class=''t''><tr><th>quy mô</th><th>dòng giao dịch</th><th>dung lượng
      tệp</th><th>kết quả của cách đọc cả tệp</th></tr><tr><td>ngày đầu</td><td>1 000</td><td>≈ 16 KB</td><td>chạy
      trong ≈ 10 ms, dùng ≈ 98 KB bộ nhớ</td></tr><tr><td>sau vài tháng</td><td>1 000 000</td><td>≈ 19 MB</td><td>chạy
      trong ≈ 800 ms, dùng ≈ 94 MB bộ nhớ</td></tr><tr><td>sau hai năm (ngoại suy)</td><td>100 000 000</td><td>≈ 1,9 GB</td><td>cần
      ≈ 9,4 GB bộ nhớ: hết bộ nhớ, chương trình chết</td></tr></table><p class=''note''><b>Ngoại
      suy</b> = nhân theo tỉ lệ từ số đã đo (ước lượng, chưa đo).</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, đây là câu chuyện của một chương trình báo cáo tổng tiền theo loại
      giao dịch. Ngày đầu, tệp có một nghìn dòng, chương trình đọc cả tệp rồi tính,
      chạy trong khoảng mười phần nghìn giây. Vài tháng sau, một triệu dòng, mất khoảng
      tám trăm phần nghìn giây và dùng khoảng chín mươi bốn triệu byte bộ nhớ. Hai
      năm sau, một trăm triệu dòng, theo ngoại suy, tức nhân theo tỉ lệ từ số đã đo,
      cần cỡ khoảng chín phẩy bốn tỉ byte bộ nhớ. Đó là nhiều hơn cái máy có, nên
      chương trình chết lúc ba giờ sáng. Đây là số minh hoạ.
  - show: '<div class="box key">Bài tình huống cuối khoá, ba câu hỏi:

      <ol><li>Ba cách đọc: <b>cả tệp</b>, <b>từng dòng</b>, <b>từng khối</b>: mỗi
      cách tốn bao nhiêu <b>thời gian và bộ nhớ</b> ở từng quy mô?</li>

      <li>Ở quy mô nào thì <b>thiết kế phải đổi</b>, và đổi theo hướng nào?</li>

      <li>Một <b>dự án nhỏ</b> trông ra sao: mô-đun, ca kiểm, danh sách thư viện ghim?</li></ol></div>

      '
    say: Bài tình huống cuối khoá hỏi ba điều. Ba cách đọc, cả tệp, từng dòng, từng
      khối, tốn bao nhiêu thời gian và bộ nhớ ở từng quy mô. Ở quy mô nào thiết kế
      phải đổi. Và một dự án nhỏ trông ra sao.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn lại những mảnh ghép sẽ dùng
  steps:
  - show: '<table class=''t''><tr><th>điều đã học</th><th>dùng ở đây thế nào</th></tr><tr><td>đọc
      tệp từng dòng</td><td>bộ nhớ không đổi, dù tệp lớn đến đâu; đọc cả tệp thì bộ
      nhớ tăng theo tệp</td></tr><tr><td>từ điển cộng dồn</td><td><code>tong[loai]
      = tong.get(loai, 0) + tien</code>: nhóm khi không cần giữ mọi dòng</td></tr><tr><td>bảng
      và đọc theo khối</td><td><code>read_csv(…, chunksize=n)</code>: mỗi lần đọc
      <code>n</code> dòng thành một bảng nhỏ (một <b>khối</b>), tính nhanh bằng <b>mã
      đã biên dịch</b>: thư viện viết sẵn, chạy nhanh hơn vòng lặp Python; <code>khoi.groupby("loai")["so_tien"].sum()</code>:
      nhóm các dòng theo cột <code>loai</code> rồi cộng cột <code>so_tien</code> mỗi
      nhóm</td></tr><tr><td>ca kiểm và môi trường ảo</td><td>ca kiểm chạy sau mỗi
      thay đổi; tệp thư viện ghim để dựng lại môi trường</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - 1
    introduces:
    - pyt_chunksize
    say: Ta ôn lại những mảnh ghép sẽ dùng. Đọc từng dòng giữ bộ nhớ không đổi, còn
      đọc cả tệp làm bộ nhớ tăng theo tệp. Từ điển cộng dồn cho phép nhóm mà không
      giữ mọi dòng. Bảng đọc theo khối cho mỗi lần một bảng nhỏ, tính nhanh bằng mã
      đã biên dịch, tức thư viện viết sẵn chạy nhanh hơn vòng lặp của ngôn ngữ. Nhóm
      theo một cột rồi cộng cột khác cho tổng mỗi nhóm. Ca kiểm và môi trường ảo giữ
      cho chương trình đúng và dựng lại được.
- id: sym
  kind: symbol
  title: Giải mã ba chiến lược và cấu trúc dự án
  steps:
  - show: <table class='t'><tr><th>chiến lược</th><th>viết</th><th>bộ nhớ</th><th>ghi
      chú</th></tr><tr><td>A. đọc cả tệp</td><td><code>f.read().split("\n")</code>
      rồi duyệt</td><td>tăng theo số dòng</td><td>đơn giản; hợp tệp nhỏ</td></tr><tr><td>B.
      từng dòng</td><td><code>for hang in csv.DictReader(f):</code></td><td>gần như
      không đổi</td><td>chậm hơn một chút mỗi dòng (nhiều lệnh Python)</td></tr><tr><td>C.
      từng khối</td><td><code>for khoi in pd.read_csv(p, chunksize=100000):</code></td><td>bằng
      một khối</td><td>nhanh nhờ mã biên dịch; phải <b>cộng dồn</b> kết quả các khối</td></tr></table>
    say: 'Bảng đầu là ba chiến lược. Đọc cả tệp: bộ nhớ tăng theo số dòng, hợp tệp
      nhỏ. Đọc từng dòng: bộ nhớ gần như không đổi, nhưng chậm hơn chút. Đọc từng
      khối: bộ nhớ bằng một khối, nhanh nhờ mã biên dịch, nhưng phải cộng dồn.'
  - show: '<table class=''t''><tr><th>tệp</th><th>vai trò</th></tr><tr><td><code>phan_tich.py</code></td><td>mô-đun:
      hàm <code>tong_theo_loai(duong_dan)</code> làm <b>một việc</b>, nhận đường dẫn,
      trả kết quả</td></tr><tr><td><code>test_phan_tich.py</code></td><td>các ca kiểm:
      dữ liệu nhỏ có đáp án tính tay, gồm tệp rỗng và dòng hỏng</td></tr><tr><td><code>requirements.txt</code></td><td>danh
      sách thư viện ghim <code>tên==phiên_bản</code></td></tr></table>'
    clear: true
    say: Bảng thứ hai là cấu trúc dự án nhỏ. Một mô-đun có hàm làm một việc, nhận
      đường dẫn và trả kết quả. Một tệp ca kiểm với dữ liệu nhỏ có đáp án tính tay,
      gồm cả tệp rỗng và dòng hỏng. Và một tệp danh sách thư viện ghim đúng phiên
      bản.
