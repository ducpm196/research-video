- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - round((103 - 99) / (100 - 99), 1) == 4.0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Cắt trục ở biểu đồ cột:
      hiệu ứng thị giác không còn tỉ lệ với giá trị.</div><div class="code"><div><span
      class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div>fig,
      ax = plt.subplots()</div><div>ax.bar(["thang 1", "thang 2"], [100, 103])</div><div>ax.set_ylim(99,
      104)</div><div>print([float(v) <span class="kw">for</span> v <span class="kw">in</span>
      ax.get_ylim()])</div><div>thay = round((103 - 99) / (100 - 99), 1)</div><div>print("ti
      le nhin thay:", thay, "- ti le that:", round(103 / 100, 2))</div></div><div
      class="code"><div>[99.0, 104.0]</div><div>ti le nhin thay: 4.0 - ti le that:
      1.03</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ nhất, của người mới, là cắt trục ở biểu đồ cột. Chiều cao cột là
      thông tin, nên cột luôn phải bắt đầu từ không.
  - show: '<div class=''box key''>Cột <b>luôn</b> bắt đầu từ $0$ (chiều cao là thông
      tin). Phép thử: <b>đọc <code>get_ylim()</code></b> và tính tỉ lệ nhìn thấy so
      với tỉ lệ dữ liệu: ở đây $4{,}0$ so với $1{,}03$.</div>'
    clear: true
    say: Phép thử là đọc khoảng của trục và tính tỉ lệ nhìn thấy, vì chỉ so với tỉ
      lệ dữ liệu mới biết có bị đánh lừa không. Ở đây bốn so với một phẩy không ba.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Gộp mọi nhóm vào
      một con số: kết luận đảo ngược khi tách nhóm.</div><p>Trong ví dụ: A tốt hơn
