- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: số liệu vẽ khớp dữ liệu'
  checks:
  - 1450 + 3000 + 300 == 4750
  - 3000 // 300 == 10
  steps:
  - show: '<p>Cách 1: so <code>[int(p.get_height()) for p in ax.patches]</code> với
      danh sách đã đưa vào: $[1450, 3000, 300]$ ✓. Cách 2: tổng các cột $1450 + 3000
      + 300 = 4750$ phải bằng tổng bảng gốc (đã tính ở bài trước). Cách 3: tỉ lệ nhìn
      thấy của hai cột <b>bằng</b> tỉ lệ dữ liệu khi gốc trục là $0$: $\frac{3000}{300}
      = 10$.</p>'
    say: Ba cách kiểm, độc lập nhau nên khớp cả ba là đáng tin. Cách một, đọc lại
      chiều cao các cột từ hình đã vẽ và so với danh sách đã đưa vào. Cách hai, cộng
      các cột, được bốn nghìn bảy trăm năm mươi, phải bằng tổng của bảng gốc ở bài
      trước. Cách ba, khi gốc trục bằng không, tỉ lệ nhìn thấy giữa hai cột bằng tỉ
      lệ dữ liệu.
- id: scale
  kind: concept
  title: 'Khi dữ liệu lớn dần: đám điểm thành mực đen, tệp vector phình theo, nên
    phải gộp'
  checks:
  - 10 ** 6 // 10 ** 3 == 1000
  - 10 ** 8 // 10 ** 6 == 100
  steps:
  - show: '<table class=''t''><tr><th>số điểm</th><th>vẽ phân tán rồi lưu PNG (đo,
      số minh hoạ)</th><th>kích thước SVG (đo)</th><th>vẽ gộp thành ô lục giác</th></tr><tr><td>×1:
      1 000</td><td>≈ 90 ms</td><td>≈ 120 KB</td><td>≈ 100 ms</td></tr><tr><td>×100:
      100 000</td><td>≈ 200 ms</td><td>≈ 11 MB</td><td>≈ 100 ms</td></tr><tr><td>×1
      000: 1 000 000</td><td>≈ 1 s</td><td>≈ 110 MB (ngoại suy tuyến tính)</td><td>≈
      200 ms</td></tr><tr><td>×100 000 (ngoại suy): 100 000 000</td><td>≈ 2 phút</td><td>≈
      11 GB</td><td>—</td></tr></table><p class=''note''>Đo trên máy kiểm, số minh
      hoạ; tệp SVG ghi mỗi điểm một dòng nên lớn tỉ lệ với số điểm. <b>Ngoại suy</b>
      = nhân theo tỉ lệ từ số đã đo (ước lượng, chưa đo).</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - pyt_luc_giac
    say: Một nghìn điểm mất khoảng chín mươi phần nghìn giây. Một trăm nghìn điểm
      mất khoảng hai trăm phần nghìn giây. Một triệu điểm mất khoảng một giây, và
      tệp ảnh vector, loại ảnh ghi từng hình, ngoại suy, tức nhân theo tỉ lệ từ số
      đã đo, lên cỡ khoảng một trăm mười triệu byte. Cột cuối là vẽ gộp thành ô lục
      giác, nghĩa là chia mặt phẳng thành các ô sáu cạnh rồi tô màu theo số điểm rơi
      vào mỗi ô.
  - show: '<p><b>Vẽ gộp (1/2): dựng một trăm nghìn điểm ngẫu nhiên</b></p><div class="code"><div><span
      class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div><span
      class="kw">import</span> numpy <span class="kw">as</span> np</div><div>rng =
      np.random.default_rng(1)</div><div>x = rng.normal(size=100000)</div><div>y =
      rng.normal(size=100000)</div></div><p><code>default_rng(1)</code>: bộ sinh số
      ngẫu nhiên, hạt giống $1$ (cùng hạt giống thì cùng dãy số); <code>rng.normal(size=…)</code>:
      số hình chuông, phần lớn gần $0$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là cách vẽ gộp một trăm nghìn điểm. Dòng đầu dựng bộ sinh số ngẫu nhiên
      với hạt giống một, cùng hạt giống thì cùng dãy số. Mỗi lần gọi, bộ sinh lấy
      một trăm nghìn số hình chuông, phần lớn gần không.
  - show: '<p><b>Vẽ gộp (2/2): chia mặt phẳng thành ô lục giác</b></p><div class="code"><div>fig,
      ax = plt.subplots()</div><div>ax.hexbin(x, y, gridsize=30)</div><div>fig.savefig("luc_giac.png")</div><div>print(int(ax.collections[0].get_array().sum()))</div></div><div
      class="code"><div>100000</div></div><p><code>gridsize=30</code>: khoảng $30$
      ô lục giác theo bề ngang. Mỗi ô đếm số điểm rơi vào nó; tổng các ô vẫn là $100\,000$,
      không điểm nào mất.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đối số cuối chia mặt phẳng thành các ô lục giác, khoảng ba mươi ô theo bề
      ngang. Tổng số điểm đếm trong mọi ô vẫn đúng một trăm nghìn, nên không điểm
      nào bị mất. Vì ô chỉ đếm điểm, thời gian vẽ gộp gần như không đổi khi số điểm
      tăng.
