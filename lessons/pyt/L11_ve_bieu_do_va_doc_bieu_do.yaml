      86, 83, 92]</div><div>fig, ax = plt.subplots()</div><div>ax.scatter(so_gd, doanh_thu)</div><div>print(len(ax.collections[0].get_offsets()))</div></div><div
      class="code"><div>7</div></div><p>Đọc lại từ hình đã vẽ: <code>get_offsets()</code>
      (lấy lại toạ độ các điểm đã vẽ) có $7$ điểm, đúng $7$ ngày. Luôn đối chiếu <b>số
      điểm vẽ</b> với <b>số dòng dữ liệu</b>.</p>'
