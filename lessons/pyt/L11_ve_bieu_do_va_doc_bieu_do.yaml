- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - round((103 - 99) / (100 - 99)) == 4
  steps:
  - show: '<p><b>Đề.</b></p>

      <ol><li>Chọn loại biểu đồ: (a) tổng tiền của $3$ kênh; (b) số giao dịch mỗi
      ngày trong $30$ ngày; (c) quan hệ giữa số giao dịch và doanh thu.</li>

      <li>Biểu đồ cột có trục từ $99$, hai cột $100$ và $103$: cột hai <b>trông</b>
      cao gấp mấy lần cột một?</li>

      <li>Nhìn lại biểu đồ B ở đầu bài và đọc theo thứ tự: tiêu đề, đơn vị, trục,
      thang. Chỗ nào cho thấy nó đánh lừa?</li></ol>

      <p><b>Quyết định:</b> $10^6$ cặp (số giao dịch, doanh thu) cần xem quan hệ:
      vẽ <b>từng điểm</b> hay <b>gộp</b> trước? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Câu một, chọn loại biểu đồ cho ba trường hợp
      trên màn hình. Câu hai, trục bắt đầu từ chín mươi chín, hai cột một trăm và
      một trăm lẻ ba, cột hai trông cao gấp mấy lần cột một. Câu ba, đọc lại biểu
      đồ bên phải ở đầu bài theo thứ tự và chỉ ra chỗ đánh lừa. Sau đó là một quyết
      định, một triệu cặp số cần xem quan hệ, vẽ từng điểm hay gộp trước, và vì sao.
      Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th></tr><tr><td>1</td><td>(a)
      cột, so sánh nhóm; (b) đường, theo thời gian; (c) phân tán, hai số</td></tr><tr><td>2</td><td>$\frac{103
      - 99}{100 - 99} = 4$ lần (tỉ lệ thật chỉ $1{,}03$)</td></tr><tr><td>3</td><td>tiêu
      đề và đơn vị đều đúng, thang đều; <b>trục bắt đầu ở $99$ chứ không phải $0$</b>:
      phần cột nhô lên bị phóng đại</td></tr></table>'
    say: Đáp án như sau. Câu một, tổng tiền của ba kênh là cột, số giao dịch theo
      ngày là đường, quan hệ hai số là phân tán. Câu hai, bốn lần, vì phần cột nhô
      lên trên gốc trục là bốn so với một, trong khi tỉ lệ thật chỉ một phẩy không
      ba. Câu ba, tiêu đề, đơn vị và thang đều ổn, nhưng trục bắt đầu ở chín mươi
      chín chứ không phải không, nên phần cột nhô lên bị phóng đại.
    clear: true
  - show: <div class='box key'><b>Quyết định:</b> <b>gộp trước</b>. Một triệu điểm
      chồng thành đám kín (không thấy chỗ dày chỗ thưa), vẽ chậm, và tệp vector phình
      tỉ lệ với số điểm. Gộp thành ô lục giác hoặc lấy mẫu giữ lại cấu trúc; nhưng
      ghi rõ cách gộp và thử gộp theo nhóm quan trọng để không bị đánh lừa.</div>
    clear: true
    say: Quyết định, gộp trước. Một triệu điểm chồng thành đám kín, vẽ chậm, và tệp
      vector phình tỉ lệ với số điểm. Gộp thành ô lục giác hoặc lấy mẫu giữ lại cấu
      trúc. Nhưng phải ghi rõ cách gộp và thử gộp theo nhóm quan trọng để không bị
      đánh lừa.
