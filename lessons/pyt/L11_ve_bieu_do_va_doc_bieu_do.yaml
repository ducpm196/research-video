    say: Hình này cho thấy vấn đề khác ngoài thời gian. Một nghìn điểm còn đọc được
      từng cụm. Một triệu điểm chồng lên nhau thành một đám kín, và mắt không còn
      thấy chỗ nào dày hơn chỗ nào. Tệp ảnh điểm ảnh, tức ảnh lưu từng chấm nhỏ của
      màn hình, chỉ nặng cỡ vài chục nghìn byte, nhưng thông tin đã mất.
