scenes:
- id: hook
  kind: hook
  title: 'Cùng dữ liệu, hai biểu đồ: tăng 3% hay tăng gấp bốn?'
  steps:
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><text
      x="375" y="30" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">biểu
      đồ A: trục y từ 0 đến 110</text><rect x="120" y="50" width="500" height="250"
      fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><rect x="176" y="73" width="138"
      height="227" fill="#2a78d6" opacity="0.85"/><text x="245" y="105" font-size="26"
      text-anchor="middle" fill="#ffffff" font-weight="bold">100</text><text x="245"
      y="328" font-size="26" text-anchor="middle" fill="#1f2937">tháng 1</text><rect
      x="426" y="66" width="138" height="234" fill="#2a78d6" opacity="0.85"/><text
      x="495" y="98" font-size="26" text-anchor="middle" fill="#ffffff" font-weight="bold">103</text><text
      x="495" y="328" font-size="26" text-anchor="middle" fill="#1f2937">tháng 2</text><text
      x="112" y="300" font-size="26" text-anchor="end" fill="#6b7280">0</text><text
      x="112" y="70" font-size="26" text-anchor="end" fill="#6b7280">110</text><text
      x="1125" y="30" font-size="26" text-anchor="middle" fill="#dc2626" font-weight="bold">biểu
      đồ B: trục y từ 99 đến 104</text><rect x="870" y="50" width="500" height="250"
      fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><rect x="926" y="250" width="138"
      height="50" fill="#dc2626" opacity="0.85"/><text x="995" y="242" font-size="26"
      text-anchor="middle" fill="#1f2937" font-weight="bold">100</text><text x="995"
      y="328" font-size="26" text-anchor="middle" fill="#1f2937">tháng 1</text><rect
      x="1176" y="100" width="138" height="200" fill="#dc2626" opacity="0.85"/><text
      x="1245" y="92" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">103</text><text
      x="1245" y="328" font-size="26" text-anchor="middle" fill="#1f2937">tháng 2</text><text
      x="862" y="300" font-size="26" text-anchor="end" fill="#6b7280">99</text><text
      x="862" y="70" font-size="26" text-anchor="end" fill="#6b7280">104</text><text
      x="750" y="370" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="bold">dữ
      liệu giống hệt nhau: 100 và 103 (triệu đồng)</text></svg></div>'
    clear: true
    say: Chào bạn, đây là hai biểu đồ vẽ từ cùng một dữ liệu, doanh thu tháng một
      là một trăm và tháng hai là một trăm lẻ ba triệu đồng. Biểu đồ bên trái có trục
      dọc bắt đầu từ không, cột hai chỉ cao hơn chút. Biểu đồ bên phải cắt trục từ
      chín mươi chín, cột hai trông cao gấp bốn lần.
  - show: '<div class="box key">Tỉ lệ <b>nhìn thấy</b> = (cột hai − gốc trục) ÷ (cột
      một − gốc trục). Gốc trục $0$: $\frac{103}{100} = 1{,}03$. Gốc trục $99$: $\frac{103
      - 99}{100 - 99} = 4$.</div><div class="box key">Hôm nay ta trả lời ba câu hỏi:<ol><li>Chọn
      loại biểu đồ nào cho câu hỏi nào, và vẽ ra <b>tệp ảnh</b> thế nào?</li><li><b>Đọc</b>
      một biểu đồ cho đúng: nhìn vào đâu trước?</li><li>Ba cách biểu đồ <b>đánh lừa</b>,
      và khi dữ liệu lớn thì biểu đồ gặp vấn đề gì?</li></ol></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Tỉ lệ nhìn thấy bằng chiều cao phần cột nhô lên trên gốc trục. Gốc trục bằng
      không thì tỉ lệ là một phẩy không ba. Gốc trục chín mươi chín thì tỉ lệ là bốn.
      Hôm nay ta học chọn loại biểu đồ và vẽ ra tệp ảnh, đọc một biểu đồ cho đúng,
      và nhận ra ba cách biểu đồ đánh lừa cùng vấn đề khi dữ liệu lớn.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: danh sách, mảng, bảng và nạp thư viện bằng tên ngắn'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      danh sách, mảng, bảng</td><td>dữ liệu cần vẽ nằm trong danh sách <code>[1450,
      3000, 300]</code>, mảng hoặc cột của bảng</td></tr><tr><td>② nạp bằng tên ngắn</td><td><code>import
      matplotlib.pyplot as plt</code>: <code>as</code> đặt tên ngắn; thư viện vẽ đã
      có trong tệp ghim của khoá</td></tr><tr><td>③ đối tượng và phương thức</td><td><code>ax.bar(…)</code>
      là gọi một <b>phương thức</b> của đối tượng <code>ax</code></td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Dữ liệu cần vẽ nằm trong danh sách, mảng hoặc cột của bảng. Lệnh nạp với
      tên ngắn mang thư viện vẽ vào chương trình. Và gọi một lệnh trên đối tượng là
      gọi một phương thức của nó.
- id: sym
  kind: symbol
  title: Giải mã khung ảnh, trục, bốn loại biểu đồ và tệp ảnh
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>fig,
      ax = plt.subplots()</code></td><td>dựng khung ảnh và một biểu đồ</td><td><code>fig</code>
      là <b>khung ảnh</b>; <code>ax</code> là <b>một biểu đồ</b> nằm trong khung (có
      hai trục)</td></tr><tr><td><code>matplotlib.use("Agg")</code></td><td>vẽ ra
      tệp, không mở cửa sổ</td><td>dùng trên máy chủ hoặc khi chạy tự động; sau đó
      <code>fig.savefig("cot.png")</code> ghi ảnh</td></tr><tr><td><code>ax.set_title(…)</code>,
      <code>ax.set_xlabel(…)</code>, <code>ax.set_ylabel(…)</code></td><td>đặt tiêu
      đề, nhãn trục ngang, nhãn trục đứng</td><td>luôn ghi <b>đơn vị</b> ở nhãn trục</td></tr></table>
    say: Bảng đầu là khung và tệp ảnh. Lệnh dựng khung cho ta khung ảnh và một biểu
      đồ nằm trong đó, với hai trục. Chọn chế độ vẽ ra tệp khi chạy trên máy chủ hoặc
      chạy tự động, rồi lệnh lưu ghi ảnh ra tệp. Tiêu đề và nhãn trục phải có, và
      luôn ghi đơn vị ở nhãn trục.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>loại biểu đồ</th><th>viết</th></tr><tr><td>so
      sánh <b>giữa các nhóm</b></td><td>cột</td><td><code>ax.bar(nhãn, giá_trị)</code></td></tr><tr><td>xu
      hướng <b>theo thời gian</b></td><td>đường</td><td><code>ax.plot(x, y)</code></td></tr><tr><td>quan
      hệ <b>giữa hai số</b></td><td>phân tán</td><td><code>ax.scatter(x, y)</code></td></tr><tr><td><b>phân
      bố</b> của một số</td><td>biểu đồ tần suất (histogram)</td><td><code>ax.hist(dữ_liệu,
      bins=…)</code>: các cột đếm số giá trị rơi vào mỗi <b>khoảng</b></td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: So sánh giữa các nhóm thì dùng cột. Xu hướng theo thời gian thì dùng đường.
      Quan hệ giữa hai số thì dùng phân tán, mỗi điểm là một cặp. Phân bố của một
      số thì dùng biểu đồ tần suất, các cột đếm số giá trị rơi vào mỗi khoảng.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>ax.set_ylim(99,
      104)</code></td><td>đặt khoảng của trục y</td><td>chọn <b>gốc trục</b> và đầu
      trên: quyết định hình dáng cột; <code>ax.get_ylim()</code> hỏi khoảng đang dùng</td></tr><tr><td><code>ax.set_yscale("log")</code></td><td>thang
      lôgarit</td><td>mỗi vạch cách nhau <b>một hệ số nhân</b> (×10), không phải một
      số cộng; <code>ax.get_yscale()</code> hỏi thang đang dùng</td></tr><tr><td><code>ax.patches</code>,
      <code>ax.lines[0].get_ydata()</code></td><td>các hình đã vẽ</td><td>đọc lại
      <b>số liệu thật</b> để kiểm: <code>ax.lines[0]</code> là đường đầu, <code>get_ydata()</code>
      là các giá trị trục đứng của nó</td></tr><tr><td><code>ax.collections[0].get_offsets()</code>,
      <code>.get_array()</code></td><td>đọc lại điểm, ô gộp</td><td><code>ax.collections</code>:
      các nhóm điểm (hoặc ô gộp) đã vẽ, <code>[0]</code> lấy nhóm đầu; <code>get_offsets()</code>
      = toạ độ từng điểm; <code>get_array()</code> = số điểm rơi vào từng ô gộp</td></tr></table>'
    introduces:
    - pyt_get_offsets
    clear: true
    say: Đặt khoảng của trục chọn gốc trục, và gốc trục quyết định hình dáng cột.
      Thang lôgarit làm mỗi vạch cách nhau một hệ số nhân. Các lệnh hỏi lại cho biết
      khoảng và thang đang dùng. Ta đọc lại các hình đã vẽ và giá trị của đường để
      lấy số liệu thật. Với điểm và ô gộp, ta lấy nhóm đã vẽ đầu tiên, rồi hỏi toạ
      độ từng điểm hoặc số điểm trong từng ô gộp.
