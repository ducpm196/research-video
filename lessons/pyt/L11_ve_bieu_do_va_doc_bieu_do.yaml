- id: example
  kind: example
  title: 'Ví dụ: đường, phân tán, và đọc số liệu thật từ hình đã vẽ'
  checks:
  - round(100 * (171 - 120) / 120, 1) == 42.5
  - len([120, 135, 128, 150, 162, 158, 171]) == 7
  steps:
  - show: '<p><b>Đường: số giao dịch theo ngày trong tuần</b></p><div class="code"><div><span
      class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div>ngay
      = [1, 2, 3, 4, 5, 6, 7]</div><div>so_gd = [120, 135, 128, 150, 162, 158, 171]</div><div>fig,
      ax = plt.subplots()</div><div>ax.plot(ngay, so_gd, marker="o")</div><div>ax.set_xlabel("ngay
      trong tuan")</div><div>print([int(y) <span class="kw">for</span> y <span class="kw">in</span>
      ax.lines[0].get_ydata()])</div><div>print([round(float(v), 2) <span class="kw">for</span>
      v <span class="kw">in</span> ax.get_ylim()])</div></div><div class="code"><div>[120,
