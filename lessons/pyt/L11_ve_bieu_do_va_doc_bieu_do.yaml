- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>câu hỏi quyết định loại biểu đồ:
      cột, đường, phân tán, tần suất</span><span class=''a''>→</span><span class=''n''>đọc
      trục trước: gốc, thang, đơn vị</span><span class=''a''>→</span><span class=''n''>cột
      phải bắt đầu từ 0</span><span class=''a''>→</span><span class=''n''>gộp có thể
      đảo ngược kết luận: vẽ thêm theo nhóm</span><span class=''a''>→</span><span
      class=''n''>thang lôgarit: đường thẳng là tăng theo hệ số nhân</span><span class=''a''>→</span><span
      class=''n''>dữ liệu lớn: gộp trước, rồi vẽ</span></div>'
    say: Tổng kết chuỗi logic. Câu hỏi quyết định loại biểu đồ, cột, đường, phân tán,
      tần suất. Đọc trục trước, gốc, thang và đơn vị. Cột phải bắt đầu từ không. Gộp
      có thể đảo ngược kết luận, nên vẽ thêm theo nhóm. Trên thang lôgarit, đường
      thẳng là tăng theo hệ số nhân. Và khi dữ liệu lớn, gộp trước rồi mới vẽ.
  - show: '<div class=''box key''><b>Tư duy:</b> một biểu đồ là một <b>lập luận</b>.
      Trước khi tin hay đưa ra một biểu đồ, hỏi: <b>trục bắt đầu từ đâu?</b>, <b>đã
      gộp những gì?</b>, <b>thang gì?</b>, và <b>số liệu vẽ có khớp dữ liệu không?</b></div>

      <p>Bài sau: kiểm thử tự động, để mỗi lần sửa mã, máy tự kiểm lại các số mà ta
      đã tin.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Một biểu đồ là một lập luận. Trước khi tin hay đưa ra một biểu đồ, hãy hỏi
      trục bắt đầu từ đâu, đã gộp những gì, thang gì, và số liệu vẽ có khớp dữ liệu
      không. Bài sau, ta học kiểm thử tự động.
    clear: true
