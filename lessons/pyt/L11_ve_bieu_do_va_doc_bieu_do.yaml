- id: formula
  kind: formula
  title: 'Suy ra từng bước: vẽ cột đọc lại số liệu, cắt trục, khoảng chia, gộp, thang
    lôgarit'
  checks:
  - round(103 / 100, 2) == 1.03 and round((103 - 99) / (100 - 99), 1) == 4.0
  - 5 + 5 + 0 + 0 + 1 == 11
  - 3000 // 300 == 10 and round(3000 * 1.05) == 3150
  - round(100 * 9 / 10, 1) == 90.0 and round(100 * 80 / 90, 1) == 88.9 and round(100
    * 30 / 90, 1) == 33.3 and round(100 * 2 / 10, 1) == 20.0
  - round(100 * 39 / 100) == 39 and round(100 * 82 / 100) == 82 and 9 + 30 == 39 and
    80 + 2 == 82
  steps:
  - show: '<p><b>Bước 1. Cột bắt đầu từ 0: chiều cao tỉ lệ giá trị</b></p><div class="code"><div><span
      class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div>loai
      = ["chuyen", "nap", "rut"]</div><div>tong = [1450, 3000, 300]</div><div>fig,
      ax = plt.subplots()</div><div>ax.bar(loai, tong)</div><div>ax.set_title("Tong
      tien theo loai (nghin dong)")</div><div>fig.savefig("cot.png")</div><div>print([int(p.get_height())
      <span class="kw">for</span> p <span class="kw">in</span> ax.patches])</div><div>print([round(float(v),
      1) <span class="kw">for</span> v <span class="kw">in</span> ax.get_ylim()])</div></div><div
      class="code"><div>[1450, 3000, 300]</div><div>[0.0, 3150.0]</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước một, vẽ cột. Vì ta cần vẽ ra tệp chứ không mở cửa sổ, ba dòng đầu nạp
      thư viện và chọn chế độ vẽ ra tệp. Ta vẽ tổng tiền ba loại, rồi đọc lại số liệu
      từ các hình đã vẽ: lấy danh sách các cột, hỏi chiều cao từng cột, gom thành
      một danh sách suy ra, đúng ba số.'
  - show: '<div class=''box key''>Ba dòng đầu nạp thư viện và chọn chế độ vẽ ra tệp
      (<code>Agg</code>: vẽ ra tệp, không mở cửa sổ); ba dòng này có mặt ở mọi chương
      trình vẽ bên dưới. Vì trục <code>y</code> tự chọn từ $0$ tới $3150$ ($3000$
      cộng $5\%$ đệm), chiều cao cột tỉ lệ với giá trị: cột nạp cao gấp $\frac{3000}{300}
      = 10$ lần cột rút. <code>ax.patches</code> là danh sách các cột (hình chữ nhật)
      đã vẽ; <code>p.get_height()</code> hỏi chiều cao cột <code>p</code>; <code>[…
      for p in ax.patches]</code> là danh sách suy ra: một phần tử cho mỗi cột.</div>'
    clear: true
    say: Trục dọc tự chọn từ không đến ba nghìn một trăm năm mươi, tức giá trị lớn
      nhất cộng năm phần trăm đệm. Vì gốc trục là không, chiều cao cột tỉ lệ với giá
      trị, cột nạp cao gấp mười lần cột rút.
  - show: '<p><b>Bước 2. Cắt trục làm tỉ lệ nhìn thấy khác tỉ lệ thật</b></p><div
      class="code"><div><span class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div>fig,
      ax = plt.subplots()</div><div>ax.bar(["thang 1", "thang 2"], [100, 103])</div><div>ax.set_ylim(99,
      104)</div><div>print([float(v) <span class="kw">for</span> v <span class="kw">in</span>
      ax.get_ylim()])</div><div>thay = round((103 - 99) / (100 - 99), 1)</div><div>print("ti
      le nhin thay:", thay, "- ti le that:", round(103 / 100, 2))</div></div><div
      class="code"><div>[99.0, 104.0]</div><div>ti le nhin thay: 4.0 - ti le that:
      1.03</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, cắt trục. Ta vẽ cột cho dữ liệu một trăm và một trăm lẻ ba, nhưng
      đặt trục bắt đầu từ chín mươi chín. Máy in khoảng của trục, và tỉ lệ cột nhìn
      thấy là bốn, trong khi tỉ lệ dữ liệu thật là một phẩy không ba. Vì phần cột
      nhô lên trên gốc trục mới là phần mắt so sánh.
  - show: '<p><b>Bước 3. Khoảng chia quyết định hình dáng phân bố</b></p><div class="code"><div><span
      class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div>so_tien
      = [50, 80, 120, 150, 160, 200, 220, 250, 300, 310, 900]</div><div>fig, ax =
      plt.subplots()</div><div>dem, bien, _ = ax.hist(so_tien, bins=[0, 200, 400,
      600, 800, 1000])</div><div>print([int(x) <span class="kw">for</span> x <span
      class="kw">in</span> dem])</div><div>print([int(b) <span class="kw">for</span>
      b <span class="kw">in</span> bien])</div></div><p><code>dem, bien, _ = ax.hist(…)</code>:
      hàm trả về <b>ba thứ</b> (số đếm, các mốc khoảng, các hình cột); gán cùng lúc
      cho ba tên, và <code>_</code> là tên cho thứ không dùng.</p><div class="code"><div>[5,
      5, 0, 0, 1]</div><div>[0, 200, 400, 600, 800, 1000]</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, khoảng chia của biểu đồ tần suất. Hàm vẽ cột trả về ba thứ, ta gán
      cả ba cùng lúc cho ba tên, và dấu gạch dưới là tên cho thứ ta bỏ qua. Vì mười
      một giao dịch chia vào năm khoảng rộng hai trăm nghìn, số đếm là năm, năm, không,
      không, một.
  - show: '<div class=''box key''>$11$ giao dịch chia vào $5$ khoảng rộng $200$: $[5,
      5, 0, 0, 1]$; tổng $5 + 5 + 0 + 0 + 1 = 11$ ✓. Khoảng khác thì hình khác; giao
      dịch $900$ nằm lẻ loi xa nhóm chính.</div>'
    clear: true
    say: Tổng đúng mười một. Giao dịch chín trăm nghìn nằm lẻ loi, xa nhóm chính,
      nên khoảng chia khác thì hình khác.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>kenh_a
      = {"nho": (9, 10), …}</code></td><td>từ điển của các bộ</td><td>mỗi loại giao
      dịch ứng với một bộ <code>(đạt, tổng)</code>: $9$ đạt trong $10$</td></tr><tr><td><code>for
      ten, kenh in (("A", kenh_a), ("B", kenh_b)):</code></td><td>mở gói bộ</td><td>mỗi
      lượt lấy một bộ <code>(tên, kênh)</code> và gán luôn cho hai tên <code>ten</code>,
      <code>kenh</code></td></tr><tr><td><code>dat, tong = kenh[loai]</code></td><td>mở
      gói bộ</td><td>lấy bộ <code>(đạt, tổng)</code> của loại đó, gán cho hai tên
      <code>dat</code>, <code>tong</code></td></tr></table>'
    clear: true
    say: Trước khi chạy gộp, đọc ba dòng chính, vì chúng mở gói bộ. Mỗi loại giao
      dịch ứng với một bộ hai số, đạt và tổng. Vòng lặp ngoài lấy từng bộ tên và kênh,
      gán luôn cho hai tên. Dòng trong mở gói bộ đạt và tổng của loại đó, gán cho
      hai tên.
  - show: '<p><b>Bước 4. Gộp che mất cấu trúc: A tốt hơn ở MỌI loại, nhưng B tốt hơn
      khi gộp</b></p><div class="code"><div>kenh_a = {"nho": (9, 10), "lon": (30,
      90)}</div><div>kenh_b = {"nho": (80, 90), "lon": (2, 10)}</div><div><span class="kw">for</span>
      ten, kenh <span class="kw">in</span> (("A", kenh_a), ("B", kenh_b)):</div><div>    dat_chung
      = 0</div><div>    tong_chung = 0</div><div>    <span class="kw">for</span> loai
      <span class="kw">in</span> ["nho", "lon"]:</div><div>        dat, tong = kenh[loai]</div><div>        print(ten,
      loai, round(100 * dat / tong, 1))</div><div>        dat_chung = dat_chung +
      dat</div><div>        tong_chung = tong_chung + tong</div><div>    print(ten,
      "chung", round(100 * dat_chung / tong_chung, 1))</div></div><div class=''box
      key''>Mỗi tỉ lệ là <code>round(100 * dat / tong, 1)</code>: phần trăm đạt, làm
      tròn một chữ số; <code>dat_chung</code> và <code>tong_chung</code> cộng dồn
      đạt và tổng của từng kênh.</div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn là gộp, với hai kênh và tỉ lệ thành công theo giao dịch nhỏ và lớn.
      Vì mỗi tỉ lệ là phần trăm đạt làm tròn một chữ số, còn hai biến cộng dồn đạt
      và tổng của từng kênh, ta chạy và đọc kết quả thật ở bước kế.
  - show: '<p>$A$: nhỏ $\frac{9}{10}$, lớn $\frac{30}{90}$, chung $\frac{39}{100}$.
      $B$: nhỏ $\frac{80}{90}$, lớn $\frac{2}{10}$, chung $\frac{82}{100}$. $A$ nhận
      <b>nhiều giao dịch lớn khó</b>, $B$ nhận nhiều giao dịch nhỏ dễ.</p><p><b>Kết
      quả chạy</b></p><div class="code"><div>A nho 90.0</div><div>A lon 33.3</div><div>A
      chung 39.0</div><div>B nho 88.9</div><div>B lon 20.0</div><div>B chung 82.0</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Kênh A tốt hơn ở cả hai loại, chín mươi phần trăm so với tám mươi tám phẩy
      chín, và ba mươi ba phẩy ba so với hai mươi. Nhưng khi gộp lại, kênh B hơn hẳn,
      tám mươi hai phần trăm so với ba mươi chín, vì kênh A nhận nhiều giao dịch lớn
      khó.
  - show: '<p><b>Bước 5. Thang lôgarit: mỗi vạch là nhân mười</b></p><div class="code"><div><span
      class="kw">import</span> matplotlib</div><div>matplotlib.use("Agg")</div><div><span
      class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt</div><div>du_lieu
      = [1, 10, 100, 1000]</div><div>fig, (ax1, ax2) = plt.subplots(1, 2)</div><div>ax1.plot(du_lieu)</div><div>ax2.plot(du_lieu)</div><div>ax2.set_yscale("log")</div><div>print(ax1.get_yscale(),
      ax2.get_yscale())</div></div><p><code>plt.subplots(1, 2)</code> dựng <b>một
      hàng, hai biểu đồ</b> cạnh nhau và trả về khung ảnh cùng <b>một cặp</b> biểu
      đồ; <code>fig, (ax1, ax2) = …</code> tách cặp đó thành hai tên. <code>ax1.plot(du_lieu)</code>
      chỉ có một đối số: trục ngang tự lấy 0, 1, 2, … (số thứ tự).</p><div class="code"><div>linear
      log</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Bước năm, thang lôgarit. Vì cần so hai thang, ta dựng một hàng hai biểu đồ
      cạnh nhau, và tách cặp biểu đồ ấy thành hai tên.
  - show: '<div class=''box key''>Dữ liệu $1, 10, 100, 1000$ tăng <b>gấp mười</b>
      mỗi bước: trên thang thường là đường cong dốc dần, trên thang lôgarit là <b>đường
      thẳng</b>. Người đọc quen thang thường dễ hiểu sai thành “tăng đều”.</div>'
    clear: true
    say: Vì dữ liệu tăng gấp mười mỗi bước, trên thang thường nó là đường cong dốc
      dần. Trên thang lôgarit nó là đường thẳng, vì mỗi vạch là một lần nhân mười.
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
