- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>hàm = tên + tham số + khối lệnh
      + trả về</span><span class=''a''>→</span><span class=''n''>không trả về thì
      được None</span><span class=''a''>→</span><span class=''n''>mặc định và gọi
      có tên chống nhầm thứ tự</span><span class=''a''>→</span><span class=''n''>biến
      cục bộ sống trong một lần gọi</span><span class=''a''>→</span><span class=''n''>hàm
      cũng là giá trị: truyền được, lambda</span><span class=''a''>→</span><span class=''n''>viết
      một lần, sửa một chỗ</span></div>'
    say: Tổng kết chuỗi logic. Hàm gồm tên, tham số, khối lệnh và giá trị trả về.
      Không trả về thì hàm cho giá trị rỗng. Tham số mặc định và gọi có tên giúp tránh
      nhầm thứ tự. Biến cục bộ chỉ sống trong một lần gọi. Hàm cũng là giá trị, nên
      truyền được và có thể viết gọn không tên. Và viết một lần thì sửa một chỗ.
  - show: '<div class=''box key''><b>Tư duy:</b> một hàm tốt làm <b>một việc</b>,
