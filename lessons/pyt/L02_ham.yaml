scenes:
- id: hook
  kind: hook
  title: Công thức thuế chép ở 40 chỗ, sửa quên 3 chỗ
  steps:
  - show: '<p><b>Công thức thuế viết MỘT lần, đặt tên</b></p><div class="code"><div><span
      class="kw">def</span> tinh_vat(gia, ty_le=10):</div><div>    <span class="kw">return</span>
      gia * ty_le // 100</div><div> </div><div><span class="kw">def</span> tong_tien(gia,
      ty_le=10):</div><div>    <span class="kw">return</span> gia + tinh_vat(gia,
      ty_le)</div><div> </div><div>print("VAT:", tinh_vat(2000000))</div><div>print("Tong:",
      tong_tien(2000000))</div><div>print("Tong (8%):", tong_tien(2000000, ty_le=8))</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>VAT: 200000</div><div>Tong: 2200000</div><div>Tong
      (8%): 2160000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 4
    clear: true
    say: Chào bạn, giả sử công thức tính thuế giá trị gia tăng được chép vào bốn mươi
      chỗ trong một hệ thống. Khi thuế suất đổi, ai đó sửa ba mươi bảy chỗ và quên
      ba chỗ. Sổ sách của khách hàng ở ba chỗ đó sai, và không có thông báo lỗi nào.
      Đây là số minh hoạ, nhưng lỗi kiểu này rất thật. Cách tránh là viết công thức
      một lần, đặt cho nó một cái tên, rồi gọi tên đó ở mọi nơi. Đó chính là hàm.
      Chữ viết tắt ở đầu dòng kết quả đầu tiên là tên tiếng Anh của thuế giá trị gia
      tăng.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Cách <b>khai báo hàm</b>: tham số vào, giá trị <b>trả về</b> ra?</li>

      <li>Biến nằm ở đâu thì ai nhìn thấy: <b>phạm vi</b> của biến?</li>

      <li>Vì sao hàm cũng là một <b>giá trị</b>, và khi nào dùng hàm một dòng không
      tên?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, cách khai báo hàm, tham số đi vào, giá
      trị trả về đi ra. Hai, biến nằm ở đâu thì ai nhìn thấy, tức là phạm vi của biến.
      Ba, vì sao hàm cũng là một giá trị, và khi nào dùng hàm một dòng không tên.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: biến, phép tính và khối lệnh thụt lề'
  steps:
  - show: '<p><b>Tính thuế bằng tay, bằng biến</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>gia = 2000000</div><div><span class="cm">&gt;&gt;&gt;
      </span>gia * 10 // 100</div><div>200000</div><div><span class="cm">&gt;&gt;&gt;
      </span>gia + gia * 10 // 100</div><div>2200000</div></div><p>Ta đã biết: biến
      là nhãn dán lên giá trị; <code>//</code> chia lấy phần nguyên; một khối lệnh
      là các dòng <b>thụt vào</b> sau dấu hai chấm. Công thức thuế $10\%$ là <code>gia
      * 10 // 100</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Biến là nhãn dán lên giá trị. Phép chia lấy phần nguyên cho ra số nguyên,
      hợp với tiền đồng. Và một khối lệnh là các dòng thụt vào sau dấu hai chấm. Với
      giá hai triệu, thuế mười phần trăm là hai trăm nghìn, cộng vào được hai triệu
      hai trăm nghìn.
- id: sym
  kind: symbol
  title: Giải mã khai báo hàm, trả về, tham số mặc định, gọi có tên, hàm một dòng
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>def
      tên(a, b):</code></td><td>khai báo hàm</td><td>đặt tên <code>tên</code> cho
      một khối lệnh; <code>a, b</code> là <b>tham số</b>: chỗ trống chờ giá trị</td></tr><tr><td><code>return
      giá_trị</code></td><td>trả về</td><td>kết thúc hàm và <b>đưa giá trị ra</b>
      cho nơi gọi; không có <code>return</code> thì hàm trả <code>None</code> (không
      có gì)</td></tr><tr><td><code>tên(2000000, 8)</code></td><td>gọi hàm</td><td>các
      giá trị trong ngoặc là <b>đối số</b>: điền vào tham số theo thứ tự</td></tr></table>'
    say: Bảng đầu là ba thứ cơ bản. Từ khoá khai báo hàm đặt tên cho một khối lệnh.
      Các tên trong ngoặc là tham số, tức chỗ trống chờ giá trị. Từ khoá trả về kết
      thúc hàm và đưa một giá trị ra cho nơi gọi. Không có nó thì hàm trả về một giá
      trị rỗng. Khi gọi hàm, các giá trị trong ngoặc gọi là đối số, và chúng điền
      vào tham số theo đúng thứ tự.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>def
      f(gia, ty_le=10):</code></td><td>tham số mặc định</td><td><code>ty_le=10</code>:
      nếu người gọi <b>không đưa</b> giá trị thì dùng <code>10</code></td></tr><tr><td><code>f(ty_le=8,
      gia=1000)</code></td><td>gọi có tên</td><td>ghi <b>tên tham số</b> trước giá
      trị: thứ tự không còn quan trọng</td></tr><tr><td><code>lambda g: g * 2</code></td><td>hàm
      một dòng không tên</td><td>tương đương hàm có một lệnh trả về <code>g * 2</code>,
      nhưng <b>không đặt tên</b></td></tr></table>'
    clear: true
    say: Bảng thứ hai là ba cách gọi và viết gọn. Tham số mặc định là giá trị dùng
      khi người gọi không đưa. Gọi có tên là ghi tên tham số trước giá trị, nên thứ
      tự không còn quan trọng. Và hàm một dòng không tên là cách viết gọn một hàm
      chỉ có đúng một lệnh trả về, mà không đặt tên.
