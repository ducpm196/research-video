      các biến gán bên trong. Hộp này nhìn được hộp toàn cục, nhưng chỉ sống trong
      lúc hàm chạy. Hàm xong, hộp biến mất, nên bên ngoài không còn nhìn thấy biến
      phí thêm nữa.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: gọi hàm, tham số mặc định, phạm vi, hàm là giá trị'
  checks:
  - 2000000 * 10 // 100 == 200000 and 2000000 + 200000 == 2200000
  - 2000000 * 8 // 100 == 160000 and 2000000 + 160000 == 2160000
  steps:
  - show: '<table class=''t''><tr><th>bước</th><th>việc máy làm</th><th>giá trị</th></tr><tr><td>1</td><td>gọi
      <code>tong_tien(2000000)</code>: dựng hộp, điền <code>gia</code></td><td>gia
      = 2 000 000, ty_le = 10 (mặc định)</td></tr><tr><td>2</td><td>tính <code>tinh_vat(gia,
      ty_le)</code>: dựng hộp con</td><td>2 000 000 * 10 // 100 = 200 000</td></tr><tr><td>3</td><td>hộp
      con trả về, bị xoá; <code>tong_tien</code> tính <code>gia + 200000</code></td><td>2
      200 000</td></tr><tr><td>4</td><td><code>return</code>: đưa ra, xoá hộp</td><td>kết
      quả 2 200 000</td></tr></table><p>Vì <code>tong_tien</code> cần kết quả của
      <code>tinh_vat</code> nên máy làm xong hàm con trước, rồi mới quay lại cộng.</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước một, chạy tay một lần gọi. Gọi hàm tổng tiền với giá hai triệu. Máy
      dựng một hộp, điền giá bằng hai triệu và thuế suất bằng mười theo mặc định.
      Vì hàm tổng tiền cần kết quả của hàm tính thuế, máy dựng thêm một hộp con, tính
      hai trăm nghìn, trả về và xoá hộp con. Rồi hàm tổng tiền cộng giá với hai trăm
      nghìn được hai triệu hai trăm nghìn, trả về và xoá hộp của nó.
  - show: '<p><b>Bước 2. Tham số mặc định và gọi có tên (gõ hàm vào cửa sổ trước)</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span><span class="kw">def</span>
      tong_tien(gia, ty_le=10):</div><div><span class="cm">... </span>    <span class="kw">return</span>
      gia + gia * ty_le // 100</div><div><span class="cm">... </span></div><div><span
      class="cm">&gt;&gt;&gt; </span>tong_tien(2000000)</div><div>2200000</div><div><span
      class="cm">&gt;&gt;&gt; </span>tong_tien(2000000, 8)</div><div>2160000</div><div><span
      class="cm">&gt;&gt;&gt; </span>tong_tien(ty_le=8, gia=2000000)</div><div>2160000</div></div><p>Vì
      <code>ty_le</code> có mặc định nên bỏ qua được. Gọi theo vị trí <code>(2000000,
      8)</code> và gọi có tên <code>(ty_le=8, gia=2000000)</code> cho cùng kết quả:
      $2\,000\,000 + 160\,000 = 2\,160\,000$.</p><p class=''note''>Dòng bắt đầu bằng
      <code>...</code> là <b>dấu nhắc nối</b>: máy chờ thêm các dòng thụt vào của
      hàm. Bấm Enter thêm một lần (dòng trống) để báo hàm đã xong.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 4
    - 4
    clear: true
    say: 'Bước hai, tham số mặc định và gọi có tên. Ta gõ hàm vào cửa sổ gõ từng câu
      trước, rồi mới gọi. Dòng bắt đầu bằng ba dấu chấm là dấu nhắc nối, máy đang
      chờ các dòng thụt vào của hàm. Ta bấm xuống dòng thêm một lần trống để báo hàm
      đã xong. Vì thuế suất có giá trị mặc định mười, ta gọi chỉ với giá và được hai
      triệu hai trăm nghìn. Đưa thêm số tám thì thuế suất là tám phần trăm, được hai
      triệu một trăm sáu mươi nghìn. Gọi có tên với thứ tự đảo cho đúng kết quả đó.
      Làm thử bằng tay: tám phần trăm của hai triệu là một trăm sáu mươi nghìn.'
  - show: '<p><b>Bước 3. Phạm vi: biến cục bộ không nhìn thấy từ ngoài</b></p><div
      class="code"><div>TY_LE = 10</div><div> </div><div><span class="kw">def</span>
      tong_tien(gia):</div><div>    phi_them = gia * TY_LE // 100</div><div>    <span
      class="kw">return</span> gia + phi_them</div><div> </div><div>print(tong_tien(2000000))</div><div>print(phi_them)</div></div><div
      class="code"><div>2200000</div><div><span class="cm">NameError: name ''phi_them''
      is not defined</span></div></div><p>Trong hàm <code>TY_LE</code> (toàn cục)
      <b>đọc</b> được; ngoài hàm, <code>phi_them</code> (cục bộ) không còn: <b>dòng
      cuối</b> báo tên chưa được định nghĩa.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, phạm vi. Hàm đọc được biến toàn cục thuế suất, nên in ra hai triệu
      hai trăm nghìn. Nhưng biến phí thêm chỉ có trong hộp cục bộ của hàm. Hàm xong
      thì hộp biến mất, nên dòng in cuối báo lỗi, tên chưa được định nghĩa. Đọc dòng
      cuối là biết ngay lỗi gì.
  - show: '<p><b>Bước 4. Hàm cũng là một giá trị</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">def</span> tang(x):</div><div><span
      class="cm">... </span>    <span class="kw">return</span> x + 1</div><div><span
      class="cm">... </span></div><div><span class="cm">&gt;&gt;&gt; </span>tang(5)</div><div>6</div><div><span
      class="cm">&gt;&gt;&gt; </span>f = tang</div><div><span class="cm">&gt;&gt;&gt;
      </span>f(5)</div><div>6</div><div><span class="cm">&gt;&gt;&gt; </span>type(tang)</div><div>&lt;class
      ''function''&gt;</div><div><span class="cm">&gt;&gt;&gt; </span>(<span class="kw">lambda</span>
      x: x + 1)(5)</div><div>6</div></div><p>Vì tên hàm cũng chỉ là <b>nhãn dán</b>
      lên một giá trị kiểu hàm, ta dán thêm nhãn <code>f</code> lên nó và gọi qua
      nhãn mới; <code>lambda</code> tạo hàm mà chưa dán nhãn nào.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, hàm cũng là một giá trị. Ta khai báo hàm tăng thêm một, gọi nó
      được sáu, rồi hỏi kiểu của nó là kiểu hàm, vì tên hàm chỉ là nhãn dán lên một
      giá trị, giống mọi biến khác. Ta dán thêm nhãn f lên hàm tăng, và gọi qua nhãn
      mới vẫn cho sáu. Hàm một dòng không tên tạo ra một hàm mà chưa dán nhãn nào,
      và ta có thể gọi nó ngay.
- id: example
  kind: example
  title: 'Ví dụ: hai hàm thuế, rồi truyền hàm cho hàm khác'
  checks:
  - 2000000 * 110 // 100 == 2200000 and 2000000 * 108 // 100 == 2160000
  steps:
  - show: '<p><b>Tệp ham.py</b></p><div class="code"><div><span class="kw">def</span>
      tinh_vat(gia, ty_le=10):</div><div>    <span class="kw">return</span> gia *
      ty_le // 100</div><div> </div><div><span class="kw">def</span> tong_tien(gia,
      ty_le=10):</div><div>    <span class="kw">return</span> gia + tinh_vat(gia,
      ty_le)</div><div> </div><div>print("VAT:", tinh_vat(2000000))</div><div>print("Tong:",
      tong_tien(2000000))</div><div>print("Tong (8%):", tong_tien(2000000, ty_le=8))</div></div><div
      class="code"><div>VAT: 200000</div><div>Tong: 2200000</div><div>Tong (8%): 2160000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta ráp lại thành một tệp, trong đó hàm tính thuế nhận giá và thuế suất mặc
      định mười. Hàm tổng tiền gọi hàm tính thuế. Ba dòng cuối gọi hàm với các đối
      số khác nhau. Máy in thuế hai trăm nghìn, tổng hai triệu hai trăm nghìn, và
      tổng với thuế tám phần trăm là hai triệu một trăm sáu mươi nghìn.
  - show: '<p><b>Hàm nhận hàm: ap_dung(ham, x)</b></p><div class="code"><div><span
      class="kw">def</span> ap_dung(ham, x):</div><div>    <span class="kw">return</span>
      ham(x)</div><div> </div><div><span class="kw">def</span> them_vat(g):</div><div>    <span
      class="kw">return</span> g * 110 // 100</div><div> </div><div>print(ap_dung(them_vat,
      2000000))</div><div>print(ap_dung(<span class="kw">lambda</span> g: g * 108
      // 100, 2000000))</div></div><div class="code"><div>2200000</div><div>2160000</div></div><p>Hàm
      <code>ap_dung</code> nhận <b>một hàm</b> làm tham số và gọi nó. Đưa <code>them_vat</code>
      (có tên) hay <code>lambda</code> (không tên) đều được.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Vì hàm là giá trị, ta truyền nó cho hàm khác. Hàm áp dụng nhận một hàm và
      một giá trị, rồi gọi hàm đó với giá trị. Ta đưa vào hàm thêm thuế có tên, được
      hai triệu hai trăm nghìn. Rồi đưa vào một hàm một dòng không tên với thuế tám
      phần trăm, được hai triệu một trăm sáu mươi nghìn. Cách này cho phép đổi quy
      tắc tính mà không sửa hàm áp dụng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>import
      time</code></td><td>nạp thư viện thời gian</td><td>mang thư viện <code>time</code>
      vào chương trình</td></tr><tr><td><code>time.perf_counter()</code></td><td>đọc
      đồng hồ</td><td>dấu chấm đọc là “của”: hàm <code>perf_counter</code> <b>của</b>
      thư viện <code>time</code>; hiệu hai lần đọc là số giây</td></tr><tr><td><code>for
      i in range(n): …</code></td><td>lặp n lượt</td><td><code>i</code> đếm từ $0$
      tới $n - 1$</td></tr></table>'
    introduces:
    - pyt_perf_counter
    clear: true
    say: 'Ta còn cần đo một việc mất bao lâu. Dòng nạp mang thư viện thời gian vào
      chương trình. Dấu chấm giữa hai tên đọc là của: hàm đồng hồ chính xác cao nằm
      trong thư viện đó, và hiệu hai lần đọc là số giây đã trôi. Vòng lặp nhiều lượt
      có biến đếm từ không.'
  - show: '<p><b>Đo một việc mất bao lâu: đọc đồng hồ trước và sau</b></p><div class="code"><div><span
      class="kw">import</span> time</div><div><span class="kw">def</span> tang(x):</div><div>    <span
      class="kw">return</span> x + 1</div><div><span class="kw">def</span> chay(n):</div><div>    y
      = 0</div><div>    <span class="kw">for</span> i <span class="kw">in</span> range(n):</div><div>        y
      = tang(y)</div><div> </div><div>t0 = time.perf_counter()</div><div>chay(1000000)</div><div>print(round(time.perf_counter()
      - t0, 2), "giay")</div></div><div class="code"><div>0.24 giay</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta hỏi đồng hồ ngay trước và ngay sau việc cần đo, rồi làm tròn hiệu hai
      lần đọc tới hai chữ số sau dấu phẩy. Việc đo là vòng lặp một triệu lượt, mỗi
      lượt gọi hàm tăng thêm một.
  - show: '<div class=''box key''><code>time.perf_counter()</code> trả số giây của
      một đồng hồ chính xác cao; <b>hiệu hai lần đọc</b> là thời gian chạy. Số in
      ra mỗi máy, mỗi lần một khác (số minh hoạ); đo nhiều lần và lấy lần <b>nhanh
      nhất</b>.</div><p><b>Lần nhanh nhất = số nhỏ nhất: <code>min</code></b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>min(0.31, 0.29, 0.30)</div><div>0.29</div></div><p><code>min(a,
      b, c)</code> trả về số <b>nhỏ nhất</b> trong các số đưa vào; thời gian ngắn
      nhất là lần nhanh nhất.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Số giây in ra mỗi máy một khác, và mỗi lần chạy cũng lệch một chút vì máy
      còn việc khác chen vào. Vì vậy người làm nghề chạy nhiều lần rồi lấy lần nhanh
      nhất. Lần nhanh nhất là lần có thời gian ngắn nhất, và lệnh tìm số nhỏ nhất
      nhận vài số rồi trả về số nhỏ nhất trong chúng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: gọi hàm khớp với tính tay, và với công thức gộp'
  checks:
  - 2 * (2 * 3) == 12 and 3 * 2 * 2 == 12
  - 2 * 3 + 2 * 4 == 14 == 2 * (3 + 4)
  steps:
  - show: '<p><b>Hàm lồng nhau cho kết quả như tính tay</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span><span class="kw">def</span> gap(x):</div><div><span
      class="cm">... </span>    <span class="kw">return</span> x * 2</div><div><span
      class="cm">... </span></div><div><span class="cm">&gt;&gt;&gt; </span>gap(gap(3))</div><div>12</div></div><p>Hàm
      $gap(x) = 2x$. Gọi hai lần: $gap(gap(3)) = gap(6) = 12$, trùng $3 \cdot 2 \cdot
      2 = 12$ ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, so hàm với tính tay. Một hàm nhân đôi, gọi hai lần lồng
      nhau với số ba. Gọi trong trước được sáu, gọi ngoài được mười hai. Tính tay,
      ba nhân hai nhân hai cũng bằng mười hai. Hai cách khớp nhau, nên ta tin hàm
      hơn, dù một lần thử chưa phải là chứng minh.
    introduces:
    - cdot
  - show: '<p><b>Và hai lần gọi độc lập</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>gap(3) + gap(4)</div><div>14</div></div><p>$gap(3) + gap(4) = 6 + 8 =
      14 = gap(3 + 4)$: hàm này <b>giữ phép cộng</b>, nên hai cách tính khớp.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép thử thứ hai, hai lần gọi độc lập. Nhân đôi ba cộng nhân đôi bốn là sáu
      cộng tám, bằng mười bốn, cũng bằng nhân đôi của bảy. Với hàm nhân đôi thì hai
      cách tính khớp, vì phép nhân đôi giữ nguyên phép cộng.
- id: scale
  kind: concept
  title: 'Khi hệ thống lớn dần: sửa một chỗ thay vì N chỗ, và cái giá của một lần
    gọi'
  checks:
  - round(100 * (1 - 0.98 ** 10), 1) == 18.3 and round(100 * (1 - 0.98 ** 100), 1)
    == 86.7
  - 10 ** 9 // 10 ** 7 == 100
  steps:
  - show: '<table class=''t''><tr><th>số nơi dùng công thức</th><th>chép tay: số chỗ
      phải sửa</th><th>hàm: số chỗ phải sửa</th><th>khả năng bỏ sót ≥ 1 chỗ nếu mỗi
      chỗ quên 2% (số minh hoạ)</th></tr><tr><td>×1: 1</td><td>1</td><td>1</td><td>2,0%</td></tr><tr><td>×10:
      10</td><td>10</td><td>1</td><td>18,3%</td></tr><tr><td>×100: 100</td><td>100</td><td>1</td><td>86,7%</td></tr></table>'
    say: Bảng này nói về quy mô bảo trì. Công thức dùng ở một nơi thì sửa một chỗ.
      Dùng ở mười nơi, nếu chép tay thì phải sửa mười chỗ, và nếu mỗi chỗ có hai phần
      trăm khả năng quên, khả năng bỏ sót ít nhất một chỗ là mười tám phẩy ba phần
      trăm. Dùng ở một trăm nơi, khả năng đó lên tới tám mươi sáu phẩy bảy phần trăm.
      Với hàm, mọi quy mô đều chỉ sửa một chỗ.
  - show: '<p><b>Hai cách viết đem so: gọi hàm ở mỗi vòng, và viết thẳng phép cộng</b></p><div
      class="code"><div><span class="kw">def</span> tang(x):</div><div>    <span class="kw">return</span>
      x + 1</div><div><span class="kw">def</span> goi(n):</div><div>    y = 0</div><div>    <span
      class="kw">for</span> i <span class="kw">in</span> range(n):</div><div>        y
      = tang(y)</div><div>    <span class="kw">return</span> y</div><div><span class="kw">def</span>
      thang(n):</div><div>    y = 0</div><div>    <span class="kw">for</span> i <span
      class="kw">in</span> range(n):</div><div>        y = y + 1</div><div>    <span
      class="kw">return</span> y</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Để so hai cách viết, ta dùng hai hàm có cùng một việc. Hàm thứ nhất ở mỗi
      vòng gọi hàm tăng thêm một. Hàm thứ hai ở mỗi vòng viết thẳng phép cộng một,
      không gọi hàm nào.
  - show: '<table class=''t''><tr><th>số lần chạy</th><th>gọi qua hàm (ms = phần nghìn
      giây, s = giây)</th><th>viết thẳng, không hàm</th></tr><tr><td>×1 000 000: 10<sup>6</sup></td><td>≈
      240 ms</td><td>≈ 100 ms</td></tr><tr><td>×10 000 000: 10<sup>7</sup></td><td>≈
      2,0 s</td><td>≈ 1,2 s</td></tr><tr><td>ngoại suy: 10<sup>9</sup></td><td>≈ 3,4
      phút (tuyến tính)</td><td>—</td></tr></table><p class=''note''><b>Ngoại suy</b>
      = nhân theo tỉ lệ từ số đã đo để đoán quy mô lớn hơn (ước lượng, chưa đo).</p><div
      class=''box key''><b>Đánh đổi:</b> mỗi lần gọi hàm tốn thêm một khoản nhỏ: đo
      trên máy kiểm (Python 3.11, vòng lặp nằm trong một hàm, hàm chỉ có một phép
      cộng, lấy lần nhanh nhất của 3 lần), gọi hàm chậm hơn cỡ 1,7 đến 2,4 lần (ở
      $10^6$ và $10^7$ lần gọi). Hàm này chỉ có một phép cộng nên khoản gọi chiếm
      phần lớn; hàm làm việc thật thì khoản gọi chỉ là phần nhỏ trong việc nó làm.
      Hầu hết chương trình đáng đổi khoản đó lấy sự rõ ràng; chỉ ở vòng lặp nóng chạy
      hàng trăm triệu lần mới đo rồi mới tối ưu (số minh hoạ, máy bạn khác).</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Còn cái giá của một lần gọi hàm. Trên máy kiểm, với vòng lặp nằm trong một
      hàm, mười triệu lần gọi hàm mất khoảng hai giây, còn viết thẳng phép cộng mất
      khoảng một phẩy hai giây. Hàm chậm hơn cỡ một phẩy bảy đến hai phẩy bốn lần.
      Hàm này chỉ có một phép cộng nên khoản gọi chiếm phần lớn, còn hàm làm việc
      thật thì khoản gọi chỉ là phần nhỏ. Ngoại suy, tức nhân theo tỉ lệ từ số đã
      đo, một tỉ lần gọi mất khoảng ba phẩy bốn phút. Đánh đổi là gọi hàm tốn thêm
      một khoản nhỏ, nhưng hầu hết chương trình nên đổi khoản đó lấy sự rõ ràng. Chỉ
      ở vòng lặp nóng, chạy hàng trăm triệu lần, mới cần đo rồi mới tối ưu. Số minh
      hoạ, máy bạn sẽ khác.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 2000000 // 4 == 500000 and 4 // 2000000 == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> In ra màn hình nhưng quên
      <code>return</code>.</div><div class="code"><div><span class="kw">def</span>
      tinh_vat(gia):</div><div>    vat = gia * 10 // 100</div><div>    print(vat)</div><div>
      </div><div>ket_qua = tinh_vat(2000000)</div><div>print("Ket qua:", ket_qua)</div></div><div
      class="code"><div>200000</div><div>Ket qua: None</div></div><p>Màn hình hiện
      $200\,000$ nên tưởng đúng, nhưng giá trị trả về là <code>None</code>: không
      dùng tiếp được. Phép thử: in <b>kết quả đã gán</b>, như dòng cuối.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là chỉ in mà quên trả về. Màn hình hiện hai
      trăm nghìn nên tưởng đúng. Nhưng giá trị trả về của hàm là rỗng, và biến kết
      quả nhận giá trị rỗng. Mọi phép tính sau đó sẽ hỏng. Phép thử bắt được lỗi là
      in chính biến kết quả.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Gán vào biến trùng tên
      với biến toàn cục: máy coi là biến cục bộ mới.</div><div class="code"><div>tong
      = 0</div><div> </div><div><span class="kw">def</span> cong(x):</div><div>    tong
      = tong + x</div><div> </div><div>cong(5)</div></div><div class="code"><div><span
      class="cm">UnboundLocalError: cannot access local variable ''tong'' where it
      is not associated with a value</span></div></div><p>Trong hàm có <code>tong
      = …</code> nên <code>tong</code> là <b>cục bộ</b>; vế phải đọc nó trước khi
      nó có giá trị. Sửa: nhận và trả về giá trị, <b>không</b> sửa biến ngoài.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
