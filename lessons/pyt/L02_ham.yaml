      sửa biến ẩn bên ngoài.</div>

      <p>Bài sau: danh sách, từ điển và tập hợp, những cách xếp nhiều giá trị lại
      để tìm và đếm nhanh.</p>

      '
    focus:
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, một hàm tốt làm một việc, nhận mọi thứ qua tham số và
      đưa kết quả qua giá trị trả về, không đọc hay sửa biến ẩn bên ngoài. Bài sau,
