- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '(lambda g: g(g(3)))(lambda x: x * 2) == 12'
  steps:
  - show: '<p><b>Đề.</b> Cho <code>def gap(x): return x * 2</code>.</p>

      <ol><li><code>gap(gap(3))</code> bằng bao nhiêu?</li>

      <li>Hàm <code>def hai(x): print(x * 2)</code> khác hàm trên ở điểm nào khi viết
      <code>y = hai(3) + 1</code>?</li></ol>

      <p><b>Quyết định:</b> thuế suất đổi theo từng tháng: truyền thuế suất làm <b>tham
      số</b> hay đặt làm <b>biến toàn cục</b>? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Cho một hàm nhân đôi. Câu một, gọi hàm hai lần
      lồng nhau với số ba bằng bao nhiêu. Câu hai, một hàm khác chỉ in mà không trả
      về, thì khác gì khi ta cộng thêm một vào kết quả của nó. Sau đó là một quyết
      định, thuế suất đổi theo từng tháng, nên truyền làm tham số hay đặt làm biến
      toàn cục, và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Câu 1</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span><span class="kw">def</span> gap(x):</div><div><span class="cm">... </span>    <span
      class="kw">return</span> x * 2</div><div><span class="cm">... </span></div><div><span
      class="cm">&gt;&gt;&gt; </span>gap(gap(3))</div><div>12</div></div><p>Gọi trong:
      $gap(3) = 6$; gọi ngoài: $gap(6) = 12$.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Đáp án câu một. Gọi trong cho sáu, gọi ngoài với sáu cho mười hai.
  - show: <p><b>Câu 2.</b> Hàm chỉ in trả về <code>None</code>; <code>None + 1</code>
      không cộng được, máy báo lỗi kiểu. Hàm có <code>return</code> trả về số, cộng
      được.</p>
    clear: true
    say: Đáp án câu hai. Hàm chỉ in trả về giá trị rỗng, và cộng một vào giá trị rỗng
      không được, máy báo lỗi. Hàm có trả về thì cho ra một số, cộng được.
  - show: '<div class=''box key''><b>Quyết định:</b> truyền làm <b>tham số</b>. Hàm
      chỉ phụ thuộc vào thứ nó nhận, nên thử được với mọi thuế suất và ai đọc cũng
      thấy dữ liệu vào từ đâu. Biến toàn cục là đầu vào <b>ẩn</b>: đổi nó ở một nơi
      làm kết quả hàm đổi ở mọi nơi, rất khó lần ra.</div>'
    clear: true
    say: Còn quyết định cuối thì thế này. Nên truyền thuế suất làm tham số. Khi đó
      hàm chỉ phụ thuộc vào thứ nó nhận, thử được với mọi thuế suất, và người đọc
      thấy dữ liệu vào từ đâu. Biến toàn cục là đầu vào ẩn, đổi nó ở một nơi làm kết
      quả của hàm đổi ở mọi nơi, rất khó lần ra.
- id: practice
  kind: practice
  title: 'Tự làm: ba hàm phí và thuế, và hàm nhận hàm'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>phi_thue.py</code> gồm ba hàm (số nguyên đồng,
      chia lấy phần nguyên):</p>

      <ol><li><code>phi_rut(tien)</code>: trả <code>1100</code> nếu <code>tien &lt;
      2000000</code>, ngược lại <code>tien * 5 // 10000</code>;</li>

      <li><code>vat(phi, ty_le=10)</code>: <code>phi * ty_le // 100</code>;</li>

      <li><code>tong_chi(tien, ham_phi)</code>: gọi <code>ham_phi(tien)</code> được
      phí, trả <code>phi + vat(phi)</code>.</li></ol>

      <p>Rồi in (xem <code>de.md</code>) ba dòng cho <code>[500000, 3000000, 80000000]</code>
      dạng <code>tien phi tong</code>, và một dòng <code>tong_chi(3000000, lambda
      t: t // 1000)</code>.</p>

      <p><b>Đo</b>: với <code>time.perf_counter</code>, chạy <code>vat(1100)</code>
      một triệu lần, rồi chạy <code>phi * 10 // 100</code> một triệu lần (<code>phi
      = 1100</code>); mỗi cách lấy lần nhanh nhất trong ba lần. Dòng cuối: <code>Goi
      ham cham hon viet thang: CO</code> nếu gọi hàm chậm hơn.</p><p class="note">Lưu
      tệp ở thư mục gốc của bộ khoá (nơi có thư mục <code>labs</code>), mở Git Bash
      tại đó để chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 4
    - 4
    - 5
    pause: 300
    say: Bây giờ tới phần bạn tự làm. Viết ba hàm. Hàm phí rút trả một nghìn một trăm
      nếu tiền dưới hai triệu, còn lại là năm phần mười nghìn của số tiền. Hàm thuế
      giá trị gia tăng nhận phí và thuế suất mặc định mười. Hàm tổng chi nhận số tiền
      và một hàm tính phí, trả về phí cộng thuế. Rồi in ba dòng cho ba số tiền cho
      sẵn, và một dòng truyền vào hàm một dòng không tên. Cuối cùng, tự đo hai cách.
      Gọi hàm thuế một triệu lần, rồi viết thẳng công thức thuế một triệu lần, mỗi
      cách lấy lần nhanh nhất trong ba lần, và in có phải gọi hàm chậm hơn không.
      Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>500000 1100 1210</div><div>3000000
      1500 1650</div><div>80000000 40000 44000</div><div>3300</div><div>Goi ham cham
      hon viet thang: CO</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh PYT L02 phi_thue.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi hàm một khối <code>def</code>
      có <code>return</code>. <code>tong_chi</code> không biết <code>phi_rut</code>:
      nó chỉ gọi <code>ham_phi(tien)</code>. Khi truyền hàm, viết <b>tên không có
      ngoặc</b>: <code>tong_chi(tien, phi_rut)</code>.

      Đo ba lần lấy nhanh nhất: <code>min(mot_lan(f), mot_lan(f), mot_lan(f))</code>,
      với <code>mot_lan(f)</code> trả hiệu hai lần đọc đồng hồ quanh <code>f()</code>.

      Lời giải ở <code>labs/PYT/L02/loi_giai.py</code>.</div>

      '
    clear: true
    say: Nếu kẹt, mỗi hàm là một khối khai báo có trả về. Hàm tổng chi không biết
      hàm phí rút, nó chỉ gọi hàm được truyền vào. Khi truyền hàm, viết tên mà không
      có ngoặc, vì có ngoặc là gọi nó ngay. Để lấy lần nhanh nhất trong ba lần, gọi
      một hàm đo ba lần rồi đưa ba kết quả cho lệnh tìm số nhỏ nhất. Lời giải nằm
      trong thư mục thực hành, chỉ mở sau khi đã thử.
