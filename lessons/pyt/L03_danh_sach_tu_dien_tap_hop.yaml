scenes:
- id: hook
  kind: hook
  title: Một nghìn lần hỏi “mã này đã xử lý chưa?” trên một triệu mã
  steps:
  - show: <table class='t'><tr><th>cách lưu một triệu mã đã xử lý</th><th>một lần
      hỏi “có trong đó không?”</th><th>1 000 lần hỏi (số đo trên máy kiểm, số minh
      hoạ)</th></tr><tr><td>danh sách</td><td>≈ 7,3 ms</td><td>≈ 7,3 s</td></tr><tr><td>tập
      hợp</td><td>≈ 100 ns</td><td>≈ 100 µs</td></tr></table>
    say: Chào bạn, hãy tưởng tượng một hệ thống đã xử lý một triệu mã giao dịch, và
      với mỗi giao dịch mới phải hỏi mã này đã xử lý chưa. Nếu lưu các mã trong một
      danh sách, mỗi lần hỏi máy phải duyệt từ đầu, mất khoảng bảy phẩy ba phần nghìn
      giây. Một nghìn lần hỏi mất khoảng bảy phẩy ba giây. Nếu lưu trong một tập hợp
      thì mỗi lần hỏi chỉ mất khoảng một trăm phần tỉ giây, và một nghìn lần hỏi chỉ
      mất khoảng một trăm phần triệu giây. Số đo trên máy kiểm, máy của bạn sẽ khác,
      nhưng chênh lệch thì có thật.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Bốn cách xếp nhiều giá trị: <b>danh sách</b>, <b>bộ</b>, <b>từ điển</b>,
      <b>tập hợp</b> khác nhau ở đâu?</li>

      <li>Vì sao <b>gán</b> một danh sách cho biến khác không tạo ra bản sao?</li>

      <li>Khi dữ liệu lớn lên, vì sao <b>cách xếp</b> quyết định tốc độ?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, bốn cách xếp nhiều giá trị, là danh sách,
      bộ, từ điển và tập hợp, khác nhau ở đâu. Hai, vì sao gán một danh sách cho biến
      khác không tạo ra bản sao. Ba, khi dữ liệu lớn lên, vì sao cách xếp quyết định
      tốc độ.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: vòng lặp đi qua danh sách, và hàm một dòng làm khoá'
  steps:
  - show: <p><b>Hai bài trước ta đã gặp danh sách trong vòng lặp</b></p><div class="code"><div>loai
      = ["chuyen", "nap", "rut", "chuyen", "chuyen", "nap"]</div></div><p>Vòng lặp
      đếm lấy từng phần tử một; hàm một dòng không tên <code>lambda</code> là cách
      viết gọn một quy tắc. Bài này đi sâu vào <b>danh sách</b> và các anh em của
      nó.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta ôn lại hai điều. Ta đã thấy một danh sách các giá trị trong cặp ngoặc
      vuông, và vòng lặp đếm lấy từng phần tử một. Ta cũng đã biết hàm một dòng không
      tên, cách viết gọn một quy tắc. Hôm nay ta đi sâu vào danh sách và các cấu trúc
      họ hàng của nó.
- id: sym
  kind: symbol
  title: Giải mã ngoặc vuông, ngoặc tròn, ngoặc nhọn, chỉ số và cắt lát
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>[a,
      b, c]</code></td><td>danh sách</td><td>các giá trị xếp thành hàng, <b>sửa được</b>;
      <code>x[0]</code> là phần tử đầu (chỉ số bắt đầu từ <code>0</code>), <code>x[-1]</code>
      là phần tử cuối</td></tr><tr><td><code>x[1:3]</code></td><td>cắt lát</td><td>lấy
      từ chỉ số <code>1</code> đến <b>trước</b> chỉ số <code>3</code> (giống <code>range</code>);
      <code>x[:2]</code> hai phần tử đầu</td></tr><tr><td><code>len(x)</code>, <code>x.append(v)</code></td><td>độ
      dài, thêm cuối</td><td><code>len</code> đếm số phần tử; dấu chấm gọi một việc
      (<b>phương thức</b>) gắn với giá trị đứng trước nó: <code>append</code> thêm
      <code>v</code> vào cuối</td></tr></table>'
    say: Bảng đầu là danh sách. Các giá trị xếp thành hàng trong cặp ngoặc vuông,
      và sửa được. Chỉ số bắt đầu từ không, nên chỉ số không là phần tử đầu, và chỉ
      số âm một là phần tử cuối. Cắt lát lấy từ chỉ số này đến trước chỉ số kia, giống
      lệnh sinh dãy số. Lệnh đếm độ dài cho biết số phần tử. Dấu chấm sau tên một
      danh sách gọi một việc gắn với danh sách đó, gọi là phương thức, ở đây là thêm
      một giá trị vào cuối.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>(a,
      b)</code></td><td>bộ</td><td>như danh sách nhưng <b>không sửa được</b></td></tr><tr><td><code>{"A01":
      5}</code></td><td>từ điển</td><td>bảng tra <b>khoá → giá trị</b>; <code>d["A01"]</code>
      lấy giá trị; <code>d.get(k, 0)</code> lấy hoặc trả <code>0</code> nếu thiếu</td></tr><tr><td><code>{"nap",
      "rut"}</code></td><td>tập hợp</td><td>các giá trị <b>không trùng</b>, hỏi “có
      trong đó không” rất nhanh; <code>{}</code> rỗng là từ điển, không phải tập hợp</td></tr></table>'
    clear: true
    say: Bảng thứ hai là ba họ hàng. Bộ giống danh sách nhưng không sửa được. Từ điển
      là bảng tra, đưa khoá vào thì lấy ra giá trị, và có cách lấy an toàn trả về
      một giá trị mặc định nếu khoá thiếu. Tập hợp chứa các giá trị không trùng nhau,
      và hỏi có trong đó không rất nhanh. Chú ý cặp ngoặc nhọn rỗng là từ điển rỗng,
      không phải tập hợp.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>sorted(x,
      key=f)</code></td><td>sắp xếp theo khoá</td><td>trả danh sách mới xếp theo <code>f(phần_tử)</code>;
      <code>reverse=True</code> xếp giảm dần</td></tr><tr><td><code>[f(x) for x in
      xs if đk]</code></td><td>danh sách suy ra</td><td>viết gọn vòng lặp: với mỗi
      <code>x</code> thoả <code>đk</code>, thêm <code>f(x)</code> vào danh sách mới</td></tr><tr><td><code>for
      ma, tien in cac_cap:</code></td><td>mở gói</td><td>mỗi phần tử là bộ hai giá
      trị, gán luôn cho hai biến</td></tr></table>'
    clear: true
    say: 'Bảng cuối là ba cách viết gọn. Lệnh sắp xếp theo khoá cho một danh sách
      mới xếp theo kết quả của hàm khoá, và đảo ngược nếu cần giảm dần. Danh sách
      suy ra viết gọn một vòng lặp: với mỗi phần tử thoả điều kiện, thêm kết quả vào
      danh sách mới. Và mở gói cho phép vòng lặp gán luôn hai giá trị của một bộ cho
      hai biến.'
