- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>danh sách: dãy ô, chỉ số từ 0, cắt
      lát trước chỉ số cuối</span><span class=''a''>→</span><span class=''n''>bộ không
      sửa; từ điển: khoá → giá trị; tập hợp: không trùng</span><span class=''a''>→</span><span
      class=''n''>gán chỉ dán nhãn; muốn bản sao thì cắt lát hoặc sao chép</span><span
      class=''a''>→</span><span class=''n''>sắp xếp theo khoá; danh sách suy ra</span><span
      class=''a''>→</span><span class=''n''>tìm trong danh sách: n bước; tập hợp:
      gần như một bước</span></div>'
    say: Tổng kết chuỗi logic. Danh sách là dãy ô, chỉ số từ không, và cắt lát dừng
      trước chỉ số cuối. Bộ không sửa được, từ điển ghép khoá với giá trị, tập hợp
      không chứa trùng. Gán chỉ dán nhãn, muốn bản sao phải làm riêng. Sắp xếp theo
      khoá và danh sách suy ra viết gọn việc hay gặp. Tìm trong danh sách mất n bước,
      còn trong tập hợp gần như một bước.
  - show: '<div class=''box key''><b>Tư duy:</b> chọn cấu trúc theo <b>câu hỏi sẽ
      hỏi nhiều nhất</b>: duyệt theo thứ tự (danh sách), tra theo khoá (từ điển),
      hỏi “có không” (tập hợp). Rồi <b>đo</b> ở quy mô thật.</div>

      <p>Bài sau: chuỗi chữ và biểu thức chính quy, để đọc dữ liệu dạng chữ như dòng
      nhật ký.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, chọn cấu trúc theo câu hỏi sẽ hỏi nhiều nhất, duyệt theo
      thứ tự, tra theo khoá, hay hỏi có hay không. Rồi đo ở quy mô thật. Bài sau,
      ta học chuỗi chữ và biểu thức chính quy, để đọc dữ liệu dạng chữ như các dòng
      nhật ký.
    clear: true
