      sao mới</text><text x="1180" y="330" font-size="24" text-anchor="middle" fill="#16a34a"
      font-weight="bold">goc[:] tạo danh sách MỚI</text></svg></div>'
    clear: true
    say: Hình thứ hai là điều hay gây lỗi. Khi viết biến mới bằng biến cũ, máy chỉ
      dán thêm một nhãn lên cùng danh sách, không tạo danh sách mới. Sửa qua nhãn
      nào, nhãn kia cũng thấy. Muốn có bản sao độc lập, ta cắt lát toàn bộ, và máy
      tạo ra một danh sách mới.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: chỉ số, cắt lát, bản sao, khoá sắp xếp, đếm bằng từ điển'
  checks:
  - '[450000, 12000000, 800000][-1] == [450000, 12000000, 800000][2]'
  - len([10, 20, 30, 40, 50][1:3]) == 3 - 1 and [10, 20, 30, 40, 50][1:3] == [20,
    30]
  - 'sorted([(''A01'', 500000), (''A02'', 150000), (''A03'', 900000)], key=lambda
    g: g[1])[0][1] == 150000'
  - '[x // 1000 for x in [450000, 12000000, 800000, 30000000]] == [450, 12000, 800,
    30000]'
  steps:
  - show: '<p><b>Bước 1. Chỉ số bắt đầu từ 0, âm đếm từ cuối</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>gd = [450000, 12000000, 800000]</div><div><span
      class="cm">&gt;&gt;&gt; </span>gd[0]</div><div>450000</div><div><span class="cm">&gt;&gt;&gt;
      </span>gd[-1]</div><div>800000</div><div><span class="cm">&gt;&gt;&gt; </span>len(gd)</div><div>3</div></div><p>Vì
      chỉ số là <b>khoảng cách tính từ đầu</b>, phần tử đầu cách đầu $0$ ô nên <code>gd[0]</code>.
      Chỉ số $-1$ là một ô tính từ cuối: <code>450000</code>, <code>12000000</code>,
      <code>800000</code> có $3$ phần tử, cuối là <code>gd[2]</code> = <code>gd[-1]</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, chỉ số. Vì chỉ số là khoảng cách tính từ đầu, phần tử đầu cách
      đầu không ô nên có chỉ số không. Với ba phần tử, phần tử cuối có chỉ số hai,
      và chỉ số âm một cũng trỏ đúng ô đó, vì âm một đếm một ô từ cuối. Máy xác nhận,
      phần tử đầu là bốn trăm năm mươi nghìn, phần tử cuối là tám trăm nghìn.
  - show: '<p><b>Bước 1b. Sửa tại chỗ bằng chỉ số: danh sách được, bộ không</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>gd = [450000, 12000000,
      800000]</div><div><span class="cm">&gt;&gt;&gt; </span>gd[0] = 500000</div><div><span
      class="cm">&gt;&gt;&gt; </span>gd</div><div>[500000, 12000000, 800000]</div><div><span
      class="cm">&gt;&gt;&gt; </span>tk = (450000, 12000000, 800000)</div><div><span
      class="cm">&gt;&gt;&gt; </span>tk[0] = 500000</div><div>Traceback (most recent
      call last):</div><div>  File "&lt;stdin&gt;", line 1, in &lt;module&gt;</div><div>TypeError:
      ''tuple'' object does not support item assignment</div></div><p>Vì danh sách
      <b>sửa được</b>, <code>gd[0] = 500000</code> thay phần tử có chỉ số $0$ ngay
      trong danh sách. Bộ <b>không sửa được</b>: máy báo lỗi, <b>dòng cuối</b> nói
      không gán được vào phần tử của bộ. (Python 3.13 in thêm dòng mã và dấu <code>^</code>
      ở giữa; dòng cuối giống nhau.)</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Thêm một điều về chỉ số, đó là sửa. Vì danh sách sửa được, gán một giá trị
      vào chỗ chỉ số không thay phần tử đầu ngay trong danh sách, số bốn trăm năm
      mươi nghìn thành năm trăm nghìn. Còn bộ không sửa được, nên gán vào chỉ số không
      của một bộ làm máy báo lỗi, và dòng cuối nói rõ điều đó.
  - show: '<p><b>Bước 1c. Tập hợp: hỏi “có không”; từ điển: thêm khoá, lấy có mặc
      định</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt; </span>s =
      {"nap", "rut"}</div><div><span class="cm">&gt;&gt;&gt; </span>"nap" <span class="kw">in</span>
      s</div><div>True</div><div><span class="cm">&gt;&gt;&gt; </span>s.add("nap")</div><div><span
      class="cm">&gt;&gt;&gt; </span>len(s)</div><div>2</div><div><span class="cm">&gt;&gt;&gt;
      </span>d = {"A01": 5}</div><div><span class="cm">&gt;&gt;&gt; </span>d["A02"]
      = 3</div><div><span class="cm">&gt;&gt;&gt; </span>d.get("A09", 0)</div><div>0</div></div><p><code>in</code>
      hỏi một giá trị có <b>nằm trong</b> tập hợp không: đúng hoặc sai. Thêm giá trị
      đã có thì tập hợp <b>không đổi</b> ($2$ phần tử). <code>d.get(khoá, 0)</code>
      trả <code>0</code> nếu khoá thiếu.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Thêm tập hợp và từ điển là hai kiểu chứa dữ liệu cuối cùng của bài này. Chữ
      in hỏi một giá trị có nằm trong tập hợp không, và máy trả về đúng hoặc sai.
      Vì tập hợp không chứa giá trị trùng, thêm một giá trị đã có thì tập hợp không
      đổi, vẫn hai phần tử. Với từ điển, gán vào một khoá mới là thêm cặp mới, còn
      cách lấy có giá trị mặc định trả về không nếu khoá thiếu.
  - show: '<p><b>Bước 2. Cắt lát: từ chỉ số đầu đến TRƯỚC chỉ số cuối</b></p><div
      class="code"><div><span class="cm">&gt;&gt;&gt; </span>x = [10, 20, 30, 40,
      50]</div><div><span class="cm">&gt;&gt;&gt; </span>x[1:3]</div><div>[20, 30]</div><div><span
      class="cm">&gt;&gt;&gt; </span>x[:2]</div><div>[10, 20]</div></div><p>Vì lát
      <code>[1:3]</code> lấy các chỉ số $1$ và $2$, số phần tử là $3 - 1 = 2$: <code>[20,
      30]</code>. Bỏ chỉ số đầu thì bắt đầu từ $0$, bỏ chỉ số cuối thì đi tới hết.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, cắt lát. Lát từ một đến ba lấy các chỉ số một và hai, dừng trước
      ba, nên có ba trừ một bằng hai phần tử, là hai mươi và ba mươi. Vì thế số phần
      tử của một lát bằng chỉ số cuối trừ chỉ số đầu, khi chỉ số cuối không vượt quá
      độ dài. Bỏ chỉ số đầu thì bắt đầu từ không, bỏ chỉ số cuối thì đi tới hết.
  - show: '<p><b>Bước 3. Gán không sao chép; cắt lát toàn bộ thì sao chép</b></p><div
      class="code"><div>goc = [100000, 200000]</div><div>ban_sao = goc</div><div>ban_sao.append(300000)</div><div>print(goc)</div><div>doc_lap
      = goc[:]</div><div>doc_lap.append(400000)</div><div>print(goc)</div><div>print(doc_lap)</div></div><div
      class="code"><div>[100000, 200000, 300000]</div><div>[100000, 200000, 300000]</div><div>[100000,
      200000, 300000, 400000]</div></div><p>Dòng $2$ chỉ <b>dán thêm nhãn</b>; <code>goc[:]</code>
      là lát từ đầu đến cuối nên là danh sách <b>mới</b>. Nhưng bản sao này <b>nông</b>:
      các phần tử bên trong (nếu là danh sách) vẫn dùng chung.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, sao chép. Vì dòng hai chỉ dán thêm một nhãn, thêm phần tử qua nhãn
      bản sao làm cả hai nhãn thấy ba phần tử. Còn cắt lát toàn bộ tạo một danh sách
      mới, nên thêm phần tử vào bản độc lập không đổi danh sách ban đầu. Nhưng bản
      sao này là sao chép nông, các phần tử bên trong nếu cũng là danh sách thì vẫn
      dùng chung.
  - show: '<p><b>Bước 4. Sắp xếp theo một khoá</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>gd = [("A01", 500000), ("A02", 150000), ("A03",
      900000)]</div><div><span class="cm">&gt;&gt;&gt; </span>sorted(gd, key=<span
      class="kw">lambda</span> g: g[1])</div><div>[(''A02'', 150000), (''A01'', 500000),
      (''A03'', 900000)]</div><div><span class="cm">&gt;&gt;&gt; </span>sorted(gd,
      key=<span class="kw">lambda</span> g: g[1], reverse=<span class="kw">True</span>)[0]</div><div>(''A03'',
      900000)</div></div><p>Vì mỗi phần tử là bộ <code>(mã, tiền)</code>, khoá <code>g[1]</code>
      lấy tiền; máy xếp theo tiền tăng dần: $150\,000 < 500\,000 < 900\,000$. <code>reverse=True</code>
      đảo lại, lấy phần tử đầu là lớn nhất.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, sắp xếp theo khoá. Mỗi phần tử là một bộ gồm mã và tiền, nên hàm
      khoá lấy phần tử có chỉ số một, tức là tiền. Máy xếp theo tiền tăng dần, từ
      một trăm năm mươi nghìn đến chín trăm nghìn. Thêm tham số đảo ngược thì xếp
      giảm dần, và phần tử đầu là giao dịch lớn nhất.
  - show: '<p><b>Bước 5. Danh sách suy ra = vòng lặp viết gọn</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>xs = [450000, 12000000, 800000, 30000000]</div><div><span
      class="cm">&gt;&gt;&gt; </span>[x // 1000 <span class="kw">for</span> x <span
      class="kw">in</span> xs]</div><div>[450, 12000, 800, 30000]</div><div><span
      class="cm">&gt;&gt;&gt; </span>[x <span class="kw">for</span> x <span class="kw">in</span>
      xs <span class="kw">if</span> x &gt;= 1000000]</div><div>[12000000, 30000000]</div></div><p>Vì
      <code>[x // 1000 for x in xs]</code> nghĩa là: với mỗi <code>x</code> trong
      <code>xs</code>, thêm <code>x // 1000</code>. Thêm <code>if x &gt;= 1000000</code>
      thì chỉ giữ các <code>x</code> thoả điều kiện.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước năm, danh sách suy ra. Vì dòng đầu nghĩa là với mỗi phần tử, thêm phần
      tử chia nghìn vào danh sách mới, nên bốn số thành bốn số đã chia nghìn. Thêm
      điều kiện ở cuối thì chỉ giữ các phần tử thoả điều kiện, ở đây hai giao dịch
      từ một triệu trở lên. Mỗi cách viết gọn đều thay được bằng một vòng lặp.
- id: example
  kind: example
  title: 'Ví dụ: đếm tần suất bằng từ điển, rồi gộp hai nguồn theo khoá'
  checks:
  - 'sorted({''A01'': 500000, ''A02'': 550000, ''A03'': 120000}, key=lambda m: {''A01'':
    500000, ''A02'': 550000, ''A03'': 120000}[m], reverse=True)[:2] == [''A02'', ''A01'']'
  - 300000 + 250000 == 550000
  - 'dict((k, [''chuyen'', ''nap'', ''rut'', ''chuyen'', ''chuyen'', ''nap''].count(k))
    for k in [''chuyen'', ''nap'', ''rut'']) == {''chuyen'': 3, ''nap'': 2, ''rut'':
    1}'
  steps:
  - show: '<p><b>Đếm số giao dịch theo loại</b></p><div class="code"><div>loai = ["chuyen",
      "nap", "rut", "chuyen", "chuyen", "nap"]</div><div>dem = {}</div><div><span
      class="kw">for</span> l <span class="kw">in</span> loai:</div><div>    dem[l]
      = dem.get(l, 0) + 1</div><div>print(dem)</div></div><div class="code"><div>{''chuyen'':
      3, ''nap'': 2, ''rut'': 1}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Ví dụ một, đếm tần suất. Từ điển rỗng ban đầu. Mỗi lượt lấy số đếm hiện tại
      của loại đó, trả về không nếu chưa có, cộng một rồi ghi lại. Máy in sáu giao
      dịch gồm ba chuyển khoản, hai nạp và một rút. Cách này đếm được dù không biết
      trước có những loại nào.
  - show: '<p><b>Gộp hai nguồn: danh sách giao dịch và bảng tra tên</b></p><div class="code"><div>ten
      = {"A01": "Lan", "A02": "Minh"}</div><div>giao_dich = [("A02", 300000), ("A01",
      500000), ("A02", 250000)]</div><div>tong = {}</div><div><span class="kw">for</span>
      ma, tien <span class="kw">in</span> giao_dich:</div><div>    tong[ma] = tong.get(ma,
      0) + tien</div><div><span class="kw">for</span> ma <span class="kw">in</span>
      sorted(tong):</div><div>    print(ten[ma], tong[ma])</div></div><div class="code"><div>Lan
      500000</div><div>Minh 550000</div></div><p>Vòng đầu cộng tiền theo mã tài khoản:
      $300\,000 + 250\,000 = 550\,000$ cho <code>A02</code>. Vòng sau duyệt <code>sorted(tong)</code>:
      danh sách các <b>khoá</b> của từ điển <code>tong</code>, xếp tăng dần; mỗi khoá
      dùng để tra tên.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Ví dụ hai. Ta có danh sách giao dịch và một bảng tra tên theo mã tài khoản.
      Vòng đầu cộng tiền theo mã, ở đây tài khoản A không hai có ba trăm nghìn cộng
      hai trăm năm mươi nghìn bằng năm trăm năm mươi nghìn. Vòng sau duyệt danh sách
      các khoá của từ điển, đã xếp tăng dần, và tra tên bằng khoá, rồi máy in tên
      kèm tổng tiền.
  - show: '<p><b>Xếp các mã theo tổng giảm dần, lấy hai mã đầu</b></p><div class="code"><div>tong
      = {"A01": 500000, "A02": 550000, "A03": 120000}</div><div>xep = sorted(tong,
      key=<span class="kw">lambda</span> m: tong[m], reverse=<span class="kw">True</span>)</div><div>print(xep)</div><div>print(xep[:2])</div></div><div
      class="code"><div>[''A02'', ''A01'', ''A03'']</div><div>[''A02'', ''A01'']</div></div><p>Hàm
      khoá <code>lambda m: tong[m]</code> tra tổng của từng mã; <code>reverse=True</code>
      xếp giảm dần; cắt lát <code>[:2]</code> lấy hai mã đầu.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Ví dụ ba, xếp theo khoá. Ta xếp các mã tài khoản theo tổng tiền giảm dần,
      với hàm khoá tra tổng trong từ điển. Mã A không hai có tổng lớn nhất, rồi đến
      A không một, rồi A không ba. Cắt lát lấy hai phần tử đầu cho ra hai tài khoản
      có tổng lớn nhất.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm lại, và cộng các nhóm'
