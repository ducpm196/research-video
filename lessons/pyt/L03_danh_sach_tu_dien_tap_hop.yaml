  - 1000 * 1000 == 10 ** 6
  steps:
  - show: '<table class=''t''><tr><th>số phần tử</th><th>danh sách: 1 lần hỏi</th><th>tập
      hợp: 1 lần hỏi</th><th>chênh (lần)</th></tr><tr><td>×1: 1 000</td><td>≈ 5,9
      µs</td><td>≈ 110 ns</td><td>≈ 54</td></tr><tr><td>×1 000: 1 000 000</td><td>≈
      7,3 ms</td><td>≈ 100 ns</td><td>≈ 73 000</td></tr><tr><td>ngoại suy ×100 000:
      100 000 000</td><td>≈ 730 ms (tuyến tính)</td><td>≈ 100 ns (gần như không đổi)</td><td>≈
      7 300 000</td></tr></table><p class=''note''>Đo trên máy kiểm, số minh hoạ (ns
      = phần tỉ giây, µs = phần triệu giây); hỏi giá trị <b>không có</b> trong dữ
      liệu (trường hợp tệ nhất của danh sách). <b>Ngoại suy</b> = nhân theo tỉ lệ
      từ số đã đo để đoán quy mô lớn hơn (ước lượng, chưa đo).</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bảng này đo một lần hỏi giá trị không có trong dữ liệu, là trường hợp tệ
      nhất của danh sách. Với một nghìn phần tử, danh sách mất khoảng năm phẩy chín
      phần triệu giây, tập hợp mất khoảng một trăm mười phần tỉ giây. Với một triệu
      phần tử, danh sách mất khoảng bảy phẩy ba phần nghìn giây, còn tập hợp vẫn chỉ
      khoảng một trăm phần tỉ giây. Ngoại suy, tức nhân theo tỉ lệ từ số đã đo, cho
      thấy một trăm triệu phần tử khiến danh sách mất khoảng bảy trăm ba mươi phần
      nghìn giây mỗi lần hỏi. Nhân một nghìn lần hỏi, đó là khoảng mười hai phút,
      còn tập hợp gần như không đổi.
  - show: <table class='t'><tr><th>cấu trúc, một triệu số nguyên</th><th>bộ nhớ (đo
      bằng công cụ theo dõi bộ nhớ, máy kiểm, số minh hoạ)</th></tr><tr><td>danh sách</td><td>≈
      40 MB</td></tr><tr><td>tập hợp</td><td>≈ 66 MB</td></tr></table><p class='note'><b>byte</b>
      là đơn vị đo bộ nhớ (một byte đủ chứa một chữ cái); <b>KB</b> ≈ một nghìn byte,
      <b>MB</b> ≈ một triệu byte.</p><div class='box key'><b>Đánh đổi:</b> tập hợp
      và từ điển tìm nhanh nhưng tốn bộ nhớ hơn và phải dựng một lần (lần dựng cũng
      tốn thời gian). Nếu chỉ hỏi vài lần, danh sách đủ; nếu hỏi nhiều lần trên dữ
      liệu lớn, đáng dựng tập hợp. Người làm nghề <b>đo</b> chứ không đoán.</div>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: 'Cái giá của tốc độ là bộ nhớ, đo bằng byte: một byte đủ chứa một chữ cái,
      màn hình ghi tắt một triệu byte bằng hai chữ cái. Một triệu số nguyên trong
      danh sách chiếm khoảng bốn mươi triệu byte, trong tập hợp chiếm khoảng sáu mươi
      sáu triệu byte. Đánh đổi là tập hợp và từ điển tìm nhanh nhưng tốn bộ nhớ hơn,
      và phải dựng một lần. Nếu chỉ hỏi vài lần thì danh sách đủ dùng. Nếu hỏi nhiều
      lần trên dữ liệu lớn thì đáng dựng tập hợp.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - '[x for x in [5, 0, 0, 7, 0] if x != 0] == [5, 7]'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng gán danh sách là
      sao chép.</div><div class="code"><div>goc = [100000, 200000]</div><div>ban_sao
      = goc</div><div>ban_sao.append(300000)</div><div>print(goc)</div><div>print(goc
      <span class="kw">is</span> ban_sao)</div></div><div class="code"><div>[100000,
      200000, 300000]</div><div>True</div></div><p>Sửa <code>ban_sao</code> làm <code>goc</code>
      đổi theo. Phép thử: in cả hai biến sau khi sửa, hoặc hỏi <code>goc is ban_sao</code>:
      <code>is</code> hỏi hai nhãn có dán vào <b>cùng một đối tượng</b> (một giá trị
      nằm trong bộ nhớ) không.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là tưởng gán danh sách là sao chép. Thêm phần
      tử vào bản sao làm danh sách gốc đổi theo, vì chỉ có một danh sách với hai nhãn.
      Phép thử là in cả hai biến, hoặc dùng phép so sánh danh tính để hỏi hai nhãn
      có dán vào cùng một giá trị trong bộ nhớ không, và máy trả lời đúng.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Xoá khi đang lặp:
      <code>gd.remove(x)</code> xoá <code>x</code> đầu tiên khỏi danh sách.</div><div
      class="code"><div>gd = [5, 0, 0, 7, 0]</div><div><span class="kw">for</span>
      x <span class="kw">in</span> gd:</div><div>    <span class="kw">if</span> x
      == 0:</div><div>        gd.remove(x)</div><div>print(gd)</div><div>gd = [5,
      0, 0, 7, 0]</div><div>gd = [x <span class="kw">for</span> x <span class="kw">in</span>
      gd <span class="kw">if</span> x != 0]</div><div>print(gd)</div></div><div class="code"><div>[5,
      7, 0]</div><div>[5, 7]</div></div><p>Vòng đầu bỏ sót một số $0$ vì danh sách
      co lại: còn <code>[5, 7, 0]</code>. Cách đúng: dựng danh sách <b>mới</b> bằng
      danh sách suy ra.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là xoá phần tử khi đang lặp qua chính danh
      sách đó, bằng lệnh xoá phần tử đầu tiên có giá trị cho trước. Mỗi lần xoá, danh
      sách co lại và các phần tử dịch chỗ, nên vòng lặp bỏ sót một số không. Kết quả
      còn năm, bảy, không, không báo lỗi. Cách đúng là dựng một danh sách mới bằng
      danh sách suy ra, như dòng cuối.
  - show: '<div class="box warn"><b>Lỗi 3 (người mới).</b> Hỏi từ điển một khoá chưa
      có.</div><div class="code"><div>so_gd = {"A01": 5, "A02": 3}</div><div>print(so_gd["A01"])</div><div>print(so_gd["A09"])</div></div><div
      class="code"><div>5</div><div><span class="cm">KeyError: ''A09''</span></div></div><p>Đọc
      dòng cuối: khoá <code>''A09''</code> không có. Nếu thiếu là chuyện bình thường,
      dùng <code>d.get(khoá, mặc_định)</code>; nếu thiếu là <b>lỗi dữ liệu</b>, để
      máy báo to còn hơn che đi.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba, của người mới, là hỏi từ điển một khoá chưa có. Máy báo lỗi khoá,
      và dòng cuối nêu khoá thiếu. Nếu thiếu là chuyện bình thường, hãy dùng cách
      lấy có giá trị mặc định. Nhưng nếu thiếu là lỗi dữ liệu thì để máy báo to còn
      hơn che đi, vì che đi làm con số sai lọt vào báo cáo.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '[10, 20, 30, 40, 50][-2:] == [40, 50] and len([10, 20, 30, 40, 50][1:4]) == 4
    - 1'
  steps:
  - show: '<p><b>Đề.</b> Cho <code>x = [10, 20, 30, 40, 50]</code>.</p>

      <ol><li><code>x[-2:]</code> là gì?</li>

      <li><code>x[1:4]</code> có mấy phần tử, là những gì?</li></ol>

      <p><b>Quyết định:</b> lưu $50\,000$ mã tài khoản để hỏi “mã này có trong hệ
      thống không?” hàng triệu lần: dùng <b>danh sách</b> hay <b>tập hợp</b>? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Cho một danh sách năm số. Câu một, lát từ âm
      hai đến hết là gì. Câu hai, lát từ một đến bốn có mấy phần tử và là những số
      nào. Sau đó là một quyết định, lưu năm mươi nghìn mã tài khoản để hỏi một mã
      có trong hệ thống không hàng triệu lần, dùng danh sách hay tập hợp, và vì sao.
      Hãy dừng video và làm.
  - show: '<p><b>Câu 1 và câu 2</b></p><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>x = [10, 20, 30, 40, 50]</div><div><span class="cm">&gt;&gt;&gt; </span>x[-2:]</div><div>[40,
      50]</div><div><span class="cm">&gt;&gt;&gt; </span>x[1:4]</div><div>[20, 30,
      40]</div><div><span class="cm">&gt;&gt;&gt; </span>len(x[1:4])</div><div>3</div></div><p>$-2$
      là hai ô tính từ cuối: <code>[40, 50]</code>. Lát <code>[1:4]</code> lấy các
      chỉ số $1, 2, 3$: ba phần tử $= 4 - 1$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đáp án như sau. Chỉ số âm hai là hai ô tính từ cuối, nên lát từ đó đến hết
      là bốn mươi và năm mươi. Lát từ một đến bốn lấy các chỉ số một, hai, ba, nên
      có ba phần tử, hai mươi, ba mươi và bốn mươi.
  - show: '<div class=''box key''><b>Quyết định:</b> <b>tập hợp</b>. Hỏi hàng triệu
      lần thì mỗi lần phải rẻ: tập hợp nhảy thẳng tới ngăn, danh sách phải duyệt tới
      $50\,000$ ô. Dựng tập hợp một lần là chi phí nhỏ so với hàng triệu lần hỏi.
      Nếu cần giữ thứ tự hoặc cho phép trùng thì danh sách.</div>'
    clear: true
    say: Còn quyết định cuối thì thế này, ta chọn tập hợp. Hỏi hàng triệu lần thì
      mỗi lần phải rẻ, tập hợp nhảy thẳng tới ngăn, còn danh sách phải duyệt tới năm
      mươi nghìn ô. Dựng tập hợp một lần là chi phí nhỏ so với hàng triệu lần hỏi.
      Nếu cần giữ thứ tự hoặc cho phép trùng thì mới dùng danh sách.
