      kiện cứ vòng lại chừng nào câu hỏi còn đúng.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: so sánh, thứ tự các nhánh, biến cộng dồn, vòng điều kiện'
  checks:
  - 1000000 <= 7500000 < 20000000
  - not (7500000 < 1000000 or 7500000 >= 20000000)
  - '[sum([450000, 12000000, 800000, 30000000, 2500000][:i + 1]) for i in range(5)]
    == [450000, 12450000, 13250000, 43250000, 45750000]'
  - 1.005 ** 139 >= 2 > 1.005 ** 138
  steps:
  - show: '<p><b>Bước 1. Ghép điều kiện bằng và / hoặc / không phải</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>tien = 7500000</div><div><span class="cm">&gt;&gt;&gt;
      </span>tien &gt;= 1000000 <span class="kw">and</span> tien &lt; 20000000</div><div>True</div><div><span
      class="cm">&gt;&gt;&gt; </span>tien &lt; 1000000 <span class="kw">or</span>
      tien &gt;= 20000000</div><div>False</div></div><p>Mức vừa là $1\,000\,000 \le
      tien < 20\,000\,000$: cần <b>cả hai</b> vế đúng nên dùng <code>and</code>. Mức
      nhỏ <b>hoặc</b> lớn: chỉ cần một vế, dùng <code>or</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Bước một, ghép điều kiện. Mức vừa đòi cả hai vế cùng đúng, tiền không nhỏ
      hơn một triệu và nhỏ hơn hai mươi triệu, nên dùng từ và. Bảy triệu rưỡi thoả
      cả hai, máy trả lời đúng. Còn mức nhỏ hoặc lớn chỉ cần một vế đúng, nên dùng
      từ hoặc. Với bảy triệu rưỡi cả hai vế đều sai, máy trả lời sai. Và từ phủ định
      đảo kết quả.
  - show: '<div class="code"><div>tien = 7500000</div><div><span class="kw">if</span>
      tien &lt; 1000000:</div><div>    muc = "nho"</div><div><span class="kw">elif</span>
      tien &lt; 20000000:</div><div>    muc = "vua"</div><div><span class="kw">else</span>:</div><div>    muc
      = "lon"</div><div>print("Giao dich", tien, "thuoc muc", muc)</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Giao dich 7500000 thuoc muc vua</div></div><p>Vì
      máy hỏi từ trên xuống và <b>dừng ở nhánh đúng đầu tiên</b>, nhánh sau không
      cần ghi lại cận dưới: tới <code>elif</code> là đã chắc <code>tien &gt;= 1000000</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: 'Bước hai, thứ tự các nhánh. Vì máy hỏi từ trên xuống và dừng ở nhánh đúng
      đầu tiên, nhánh sau không cần ghi lại cận dưới. Tới nhánh thứ hai là đã chắc
      số tiền không nhỏ hơn một triệu, vì nhánh một đã sai. Làm thử với bảy triệu
      rưỡi: nhánh một sai, nhánh hai đúng, in mức vừa.'
  - show: '<table class=''t''><tr><th>lượt</th><th>tien</th><th>tong sau lượt</th></tr><tr><td>bắt
      đầu</td><td>—</td><td>0</td></tr><tr><td>1</td><td>450 000</td><td>450 000</td></tr><tr><td>2</td><td>12
      000 000</td><td>12 450 000</td></tr><tr><td>3</td><td>800 000</td><td>13 250
      000</td></tr><tr><td>4</td><td>30 000 000</td><td>43 250 000</td></tr><tr><td>5</td><td>2
      500 000</td><td>45 750 000</td></tr></table><p>Vì mỗi lượt <code>tong = tong
      + tien</code> lấy <b>giá trị tong cũ</b> cộng thêm <code>tien</code> rồi dán
      nhãn mới, <code>tong</code> là biến <b>cộng dồn</b>: bắt đầu từ $0$ để không
      cộng thừa.</p>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bước ba, biến cộng dồn. Ta chạy tay chương trình tổng. Bắt đầu tổng bằng
      không. Lượt một, cộng bốn trăm năm mươi nghìn. Lượt hai, cộng mười hai triệu,
      được mười hai triệu bốn trăm năm mươi nghìn. Cứ thế đến lượt năm, tổng là bốn
      mươi lăm triệu bảy trăm năm mươi nghìn. Vì mỗi lượt lấy giá trị tổng cũ cộng
      thêm số tiền rồi dán nhãn mới, nên phải bắt đầu từ không, nếu không ta cộng
      thừa một số.
  - show: '<div class="code"><div>so_du = 10000000</div><div>thang = 0</div><div><span
      class="kw">while</span> so_du &lt; 20000000:</div><div>    so_du = so_du + so_du
      * 5 // 1000</div><div>    thang = thang + 1</div><div>print("So thang de gap
      doi:", thang)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>So
      thang de gap doi: 139</div></div><p>Vì không biết trước bao nhiêu lượt, ta dùng
      vòng điều kiện: mỗi lượt <b>phải làm điều kiện tiến dần tới sai</b> (số dư tăng,
      tháng tăng). Lãi $0{,}5\%$ một tháng là <code>so_du * 5 // 1000</code>; <code>//</code>
      chia lấy <b>phần nguyên</b> (<code>7 // 2</code> ra <code>3</code>), nên lãi
      là số nguyên đồng.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 4
    clear: true
    say: Bước bốn, vòng điều kiện. Ta muốn biết gửi mười triệu, lãi không phẩy năm
      phần trăm mỗi tháng nhập vào gốc, sau bao nhiêu tháng thì gấp đôi. Vì không
      biết trước số lượt, ta dùng vòng điều kiện. Mỗi lượt số dư tăng và số tháng
      tăng, nên điều kiện tiến dần tới sai. Hai dấu gạch chéo chia lấy phần nguyên,
      nên lãi mỗi tháng là số nguyên đồng. Máy trả lời một trăm ba mươi chín tháng,
      hơn mười một năm rưỡi.
  - show: '<div class="code"><div>giao_dich = [450000, 12000000, 800000, 30000000,
      2500000]</div><div><span class="kw">for</span> tien <span class="kw">in</span>
      giao_dich:</div><div>    <span class="kw">if</span> tien &lt; 1000000:</div><div>        <span
      class="kw">continue</span></div><div>    <span class="kw">if</span> tien &gt;=
      20000000:</div><div>        print("Dung o giao dich", tien)</div><div>        <span
      class="kw">break</span></div><div>    print("Xet", tien)</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Xet 12000000</div><div>Dung o giao dich
      30000000</div></div><p><code>continue</code>: <b>bỏ qua phần còn lại của lượt
      này</b>, sang lượt sau. <code>break</code>: <b>thoát hẳn</b> vòng lặp.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước năm, hai lệnh điều khiển. Lệnh bỏ lượt này, ở đây bỏ qua các giao dịch
      dưới một triệu. Lệnh thoát hẳn, ở đây dừng ngay khi gặp giao dịch từ hai mươi
      triệu trở lên. Vì vậy chỉ giao dịch mười hai triệu được xét, rồi chương trình
      dừng ở ba mươi triệu.
- id: example
  kind: example
  title: 'Ví dụ: phân loại cả danh sách, và đọc một lỗi thụt lề'
  checks:
  - sum([450000, 12000000, 800000, 30000000, 2500000]) == 45750000
  - len(range(1, 4)) == 3
  - 3 + 1 == 4
  steps:
  - show: '<p><b>Tệp tong.py</b></p><div class="code"><div>giao_dich = [450000, 12000000,
      800000, 30000000, 2500000]</div><div>tong = 0</div><div>dem_lon = 0</div><div><span
      class="kw">for</span> tien <span class="kw">in</span> giao_dich:</div><div>    tong
      = tong + tien</div><div>    <span class="kw">if</span> tien &gt;= 20000000:</div><div>        dem_lon
      = dem_lon + 1</div><div>print("Tong:", tong)</div><div>print("So giao dich lon:",
      dem_lon)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Tong: 45750000</div><div>So
      giao dich lon: 1</div></div><p>Danh sách có năm giao dịch, tổng $45\,750\,000$,
      đúng bảng chạy tay.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Ta chạy lại chương trình tổng và đối chiếu với bảng chạy tay. Danh sách có
      năm giao dịch. Mỗi lượt cộng dồn vào tổng, và nếu giao dịch từ hai mươi triệu
      trở lên thì tăng biến đếm lên một. Kết quả khớp bảng, bốn mươi lăm triệu bảy
      trăm năm mươi nghìn, và chỉ một giao dịch lớn.
  - show: '<p><b>Vòng đếm với dãy số: số tháng</b></p><div class="code"><div><span
      class="kw">for</span> thang <span class="kw">in</span> range(1, 4):</div><div>    print("Thang",
      thang)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Thang 1</div><div>Thang
      2</div><div>Thang 3</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Khi không có sẵn danh sách mà chỉ cần lặp một số lần, ta dùng lệnh sinh dãy
      số. Dãy từ một đến bốn dừng trước bốn, nên ba lượt, in ba tháng.
  - show: '<p><b>Quên thụt lề dòng in</b></p><div class="code"><div>tien = 500000</div><div><span
      class="kw">if</span> tien &gt; 100000:</div><div>print("lon")</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">File "…", line 3</span></div><div><span
      class="cm">IndentationError: expected an indented block after ''if'' statement
      on line 2</span></div></div><p>Đọc <b>dòng cuối</b>: máy <b>mong một khối thụt
      vào</b> sau dòng rẽ nhánh ở dòng $2$. Sửa: thụt dòng $3$ bốn dấu cách.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: 'Giờ ta đọc một lỗi thụt lề. Dòng ba nằm sát lề trái, trong khi dòng hai
      kết thúc bằng dấu hai chấm, nên máy báo lỗi thụt lề. Đọc dòng cuối: máy mong
      một khối thụt vào sau câu lệnh rẽ nhánh ở dòng hai. Cách sửa là thụt dòng ba
      bốn dấu cách.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cộng tay theo nhóm'
  checks:
  - 450000 + 800000 + 2500000 == 3750000 and 12000000 + 30000000 == 42000000 and 3750000
    + 42000000 == 45750000
  steps:
  - show: '<p><b>Cộng tay theo nhóm: nhóm nhỏ rồi nhóm lớn</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>450000 + 800000 + 2500000</div><div>3750000</div><div><span
      class="cm">&gt;&gt;&gt; </span>12000000 + 30000000</div><div>42000000</div><div><span
      class="cm">&gt;&gt;&gt; </span>3750000 + 42000000</div><div>45750000</div></div><p>Chia
      nhóm khác với chương trình: ba giao dịch nhỏ trước, hai giao dịch lớn sau. Cộng
      hai nhóm: $3\,750\,000 + 42\,000\,000 = 45\,750\,000$ ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, cộng tay theo nhóm thay vì từng giao dịch. Ba giao dịch
      nhỏ cộng lại ba triệu bảy trăm năm mươi nghìn. Hai giao dịch lớn cộng lại bốn
      mươi hai triệu. Cộng hai nhóm được bốn mươi lăm triệu bảy trăm năm mươi nghìn,
      trùng với chương trình. Hai cách chia nhóm khác nhau cùng ra một con số.
- id: scale
  kind: concept
  title: 'Khi dữ liệu lớn dần: số lần lặp tăng theo, thời gian cũng tăng theo'
  checks:
  - 1000000 * (1000000 + 1) // 2 == 500000500000
  - 10000000 // 1000 == 10000 and 1000000000 // 1000000 == 1000
  steps:
  - show: <p><b>Cộng 1 + 2 + … + n bằng vòng lặp</b></p><div class="code"><div>n =
      1000000</div><div>tong = 0</div><div><span class="kw">for</span> i <span class="kw">in</span>
      range(1, n + 1):</div><div>    tong = tong + i</div><div>print("Tong 1 den",
      n, "=", tong)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Tong
      1 den 1000000 = 500000500000</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ta thử vòng lặp ở quy mô lớn hơn. Chương trình này cộng các số từ một đến
      một triệu bằng vòng lặp, và cho ra năm trăm tỉ năm trăm nghìn. Một triệu lượt
      lặp, mỗi lượt một phép cộng.
  - show: '<table class=''t''><tr><th>n (số lượt lặp)</th><th>số phép cộng</th><th>thời
      gian vòng lặp (đo trên máy kiểm, số minh hoạ)</th></tr><tr><td>×1: 1 000</td><td>1
      000</td><td>≈ 93 µs (phần triệu giây)</td></tr><tr><td>×1 000: 1 000 000</td><td>1
      000 000</td><td>≈ 140 ms (phần nghìn giây)</td></tr><tr><td>×10 000: 10 000
      000</td><td>10 000 000</td><td>≈ 1,5 s</td></tr><tr><td>×1 000 000: 1 000 000
      000 (ngoại suy)</td><td>1 000 000 000</td><td>≈ 2,6 phút (ngoại suy tuyến tính)</td></tr></table><p
      class=''note''><b>Ngoại suy</b> = nhân theo tỉ lệ từ số đã đo để đoán quy mô
      lớn hơn: ước lượng, chưa đo.</p><div class=''box key''><b>Đánh đổi:</b> số lượt
      lặp tăng bao nhiêu lần thì thời gian tăng cùng bậc chừng đó (mỗi lần nhân $10$
      số lượt, thời gian tăng khoảng $10$ lần, lệch vài chục phần trăm). Với tổng
      các số từ $1$ đến $n$ còn có công thức $\frac{n(n+1)}{2}$ chỉ cần <b>một phép
      tính</b>; nhưng khi phải xem từng giao dịch thì không có lối tắt, ta phải lặp.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 3
    - 3
    - 3
    introduces:
    - pyt_ngoai_suy
    clear: true
    say: Bảng này cho thấy quy mô. Một nghìn lượt gần như tức thì. Một triệu lượt
      mất khoảng một trăm bốn mươi phần nghìn giây. Mười triệu lượt mất khoảng một
      phẩy năm giây. Một tỉ lượt thì ta chưa đo, mà ngoại suy, nghĩa là nhân theo
      tỉ lệ từ số đã đo để đoán quy mô lớn hơn. Ngoại suy tuyến tính cho khoảng hai
      phẩy sáu phút, chỉ là ước lượng. Mỗi lần nhân mười số lượt, thời gian tăng khoảng
      mười lần, lệch vài chục phần trăm. Thời gian đo trên máy kiểm, số minh hoạ,
      máy của bạn sẽ khác. Riêng tổng các số liên tiếp có công thức một phép tính,
      nhưng việc xem từng giao dịch thì không có lối tắt.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - sum(range(1, 5)) == 10 and sum(range(1, 6)) == 15 and 5 * 6 // 2 == 15
  - bool('chuyen') is True
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Lệch một: <code>range(1,
      5)</code> dừng <b>trước</b> $5$.</div><div class="code"><div>tong = 0</div><div><span
      class="kw">for</span> i <span class="kw">in</span> range(1, 5):</div><div>    tong
      = tong + i</div><div>print("Tong 1..5 =", tong)</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>Tong 1..5 = 10</div></div><p>Muốn tổng $1 + 2 + 3 + 4 + 5
      = 15$ phải viết <code>range(1, 6)</code>. Phép thử bắt được lỗi: so với công
      thức $\frac{5 \cdot 6}{2} = 15$ hoặc in vài giá trị của biến đếm.</p>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là lệch một. Dãy từ một đến năm dừng trước năm,
      nên chương trình cộng một đến bốn, ra mười thay vì mười lăm. Phép thử bắt được
      lỗi này là so với công thức năm nhân sáu chia hai, hoặc in vài giá trị của biến
      đếm.
    introduces:
    - cdot
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Viết điều kiện như
      viết câu tiếng Việt.</div><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>loai = "nap"</div><div><span class="cm">&gt;&gt;&gt; </span>loai == "rut"
      <span class="kw">or</span> "chuyen"</div><div>''chuyen''</div><div><span class="cm">&gt;&gt;&gt;
      </span>loai == "rut" <span class="kw">or</span> loai == "chuyen"</div><div>False</div><div><span
      class="cm">&gt;&gt;&gt; </span>loai <span class="kw">in</span> ("rut", "chuyen")</div><div>False</div></div><p><code>loai
      == "rut" or "chuyen"</code> hiểu thành <code>(loai == "rut") or "chuyen"</code>;
      chuỗi không rỗng được coi là <b>đúng</b>, nên điều kiện luôn đúng. Viết đủ từng
      vế, hoặc dùng <code>in</code>: <code>loai in ("rut", "chuyen")</code> hỏi “<code>loai</code>
      có nằm trong nhóm này không?”; nhóm giá trị trong ngoặc tròn là một <b>bộ</b>,
      như danh sách nhưng không sửa được.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, của cả người đã đi làm, là viết điều kiện như viết câu tiếng
      Việt. Loại bằng rút hoặc chuyển, viết gọn như vậy, máy hiểu là loại bằng rút,
      hoặc chữ chuyển. Chuỗi không rỗng được coi là đúng, nên điều kiện luôn đúng,
      kể cả khi loại là nạp. Phải viết đủ từng vế, hoặc dùng từ in để hỏi một giá
      trị có nằm trong một nhóm không, nhóm đó là một bộ, tức các giá trị trong cặp
      ngoặc tròn. Máy đưa kết quả chữ chuyển thay vì sai, nên không ai thấy lỗi.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Vòng lặp điều kiện
      quên làm điều kiện tiến dần tới sai: chạy mãi.</div><p><b>Khi thử, luôn thêm
      một giới hạn số bước</b></p><div class="code"><div>so_du = 10000000</div><div>buoc
      = 0</div><div><span class="kw">while</span> so_du &lt; 20000000 <span class="kw">and</span>
      buoc &lt; 5:</div><div>    buoc = buoc + 1</div><div>print("Sau", buoc, "buoc,
      so_du van la", so_du)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Sau
      5 buoc, so_du van la 10000000</div></div><p>Biến <code>so_du</code> không đổi
      nên điều kiện đúng mãi. Phép thử: <b>thêm bộ đếm bước</b> như trên; sau $5$
      bước số dư vẫn là $10\,000\,000$. Khi chạy mãi ngoài thật, ta ngắt bằng <code>Ctrl+C</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    - 5
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là vòng lặp điều kiện chạy mãi. Quên cộng
      lãi vào số dư, điều kiện không bao giờ sai. Phép thử là thêm một bộ đếm bước
      vào điều kiện, như ở đây. Sau năm bước số dư vẫn là mười triệu, nghĩa là vòng
      lặp không tiến triển. Khi chương trình chạy mãi ngoài thật, bạn ngắt bằng tổ
      hợp phím điều khiển và chữ C.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '[i * 10 for i in range(3)] == [0, 10, 20]'
  - ('vua' if 500000 < 20000000 else ('nho' if 500000 < 1000000 else 'lon')) == 'vua'
  steps:
  - show: '<p><b>Đề.</b></p>

      <ol><li>Vòng <code>for i in range(3): print(i * 10)</code> in những gì?</li>

      <li>Đổi chỗ hai nhánh đầu như mã dưới đây: với <code>tien = 500000</code> nhánh
      nào chạy?</li></ol><div class="code"><div>tien = 500000</div><div><span class="kw">if</span>
      tien &lt; 20000000:</div><div>    muc = "vua"</div><div><span class="kw">elif</span>
      tien &lt; 1000000:</div><div>    muc = "nho"</div><div><span class="kw">else</span>:</div><div>    muc
      = "lon"</div><div>print("Giao dich", tien, "thuoc muc", muc)</div></div>

      <p><b>Quyết định:</b> đọc hết $1\,000\,000$ giao dịch trong tệp, hay lặp tới
      khi số dư đủ gấp ba? Chọn vòng đếm hay vòng điều kiện? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    pause: 60
    clear: true
    say: Bây giờ tới phần bạn tự làm. Câu một, vòng lặp đếm ba lượt, mỗi lượt in số
      đếm nhân mười, in những gì. Câu hai, hai nhánh đầu đã đổi chỗ như mã trên màn
      hình, với giao dịch năm trăm nghìn thì nhánh nào chạy. Sau đó là một quyết định,
      đọc hết một triệu giao dịch, hay lặp tới khi số dư đủ gấp ba, chọn vòng đếm
      hay vòng điều kiện, và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Câu 1: lượt 0, 1, 2</b></p><div class="code"><div><span class="kw">for</span>
      i <span class="kw">in</span> range(3):</div><div>    print(i * 10)</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>0</div><div>10</div><div>20</div></div><p>Lượt
      $0$: in $0$; lượt $1$: in $10$; lượt $2$: in $20$. Ba dòng: <code>0</code>,
      <code>10</code>, <code>20</code>.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Đáp án câu một. Biến đếm chạy không, một, hai, nên in không, mười, hai mươi,
      ba dòng.
  - show: '<div class="code"><div>tien = 500000</div><div><span class="kw">if</span>
      tien &lt; 20000000:</div><div>    muc = "vua"</div><div><span class="kw">elif</span>
      tien &lt; 1000000:</div><div>    muc = "nho"</div><div><span class="kw">else</span>:</div><div>    muc
      = "lon"</div><div>print("Giao dich", tien, "thuoc muc", muc)</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Giao dich 500000 thuoc muc vua</div></div><p>$500\,000
      < 20\,000\,000$ <b>đã</b> thoả ở nhánh đầu nên nhánh <code>nho</code> không
      bao giờ tới (mọi số dưới $1\,000\,000$ cũng dưới $20\,000\,000$): sai thứ tự
      gây ra mức <code>vua</code> thay vì <code>nho</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Đáp án câu hai. Vì năm trăm nghìn đã nhỏ hơn hai mươi triệu ở nhánh đầu,
      máy dừng ở đó và in mức vừa, trong khi đúng ra là mức nhỏ. Nhánh nhỏ không bao
      giờ được tới, vì mọi số dưới một triệu cũng dưới hai mươi triệu. Đổi thứ tự
      nhánh có thể làm sai kết quả mà không báo lỗi.
  - show: '<div class=''box key''><b>Quyết định:</b> đọc hết tệp: <b>vòng đếm</b>,
      vì biết trước phải đi qua từng giao dịch, mỗi giao dịch một lượt. Lặp tới khi
      số dư đủ gấp ba: <b>vòng điều kiện</b>, vì không biết trước số lượt, chỉ biết
      điều kiện dừng. Với vòng điều kiện luôn nghĩ: điều gì làm điều kiện tiến tới
      sai?</div>'
    clear: true
    say: Còn quyết định cuối thì thế này. Đọc hết tệp thì dùng vòng đếm, vì biết trước
      phải đi qua từng giao dịch. Lặp tới khi số dư đủ gấp ba thì dùng vòng điều kiện,
      vì không biết trước số lượt, chỉ biết khi nào dừng. Với vòng điều kiện luôn
      tự hỏi, điều gì làm điều kiện tiến dần tới sai.
