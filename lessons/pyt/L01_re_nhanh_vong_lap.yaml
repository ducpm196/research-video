scenes:
- id: hook
  kind: hook
  title: Một triệu giao dịch, mỗi giao dịch phải được phân loại
  steps:
  - show: '<p><b>Một giao dịch: chương trình tự chọn nhánh (print(a, b, …) in các
      giá trị cách nhau một dấu cách)</b></p><div class="code"><div>tien = 7500000</div><div><span
      class="kw">if</span> tien &lt; 1000000:</div><div>    muc = "nho"</div><div><span
      class="kw">elif</span> tien &lt; 20000000:</div><div>    muc = "vua"</div><div><span
      class="kw">else</span>:</div><div>    muc = "lon"</div><div>print("Giao dich",
      tien, "thuoc muc", muc)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Giao
      dich 7500000 thuoc muc vua</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Một hệ thống thanh toán nhận hàng triệu giao dịch mỗi ngày, và với mỗi giao
      dịch nó phải quyết định xử lý thế nào. Giao dịch nhỏ thì cho qua, giao dịch
      lớn thì cần kiểm tra thêm. Không ai ngồi quyết định từng cái. Chương trình ở
      đây tự chọn một trong ba nhánh theo số tiền, và giao dịch bảy triệu rưỡi rơi
      vào mức vừa. Lệnh in nhận nhiều giá trị cách nhau dấu phẩy và in chúng cách
      nhau một dấu cách.
  - show: '<p><b>Và tự lặp lại việc đó cho cả danh sách</b></p><div class="code"><div>giao_dich
      = [450000, 12000000, 800000, 30000000, 2500000]</div><div>tong = 0</div><div>dem_lon
      = 0</div><div><span class="kw">for</span> tien <span class="kw">in</span> giao_dich:</div><div>    tong
      = tong + tien</div><div>    <span class="kw">if</span> tien &gt;= 20000000:</div><div>        dem_lon
      = dem_lon + 1</div><div>print("Tong:", tong)</div><div>print("So giao dich lon:",
      dem_lon)</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Tong: 45750000</div><div>So
      giao dich lon: 1</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Chuyện thứ hai là lặp lại. Viết một lần, máy làm một triệu lần. Chương trình
      này đi qua năm giao dịch, cộng dồn tổng tiền và đếm số giao dịch lớn. Máy in
      ra tổng bốn mươi lăm triệu bảy trăm năm mươi nghìn đồng, và có một giao dịch
      lớn.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Chương trình <b>chọn nhánh</b> theo điều kiện bằng cách nào?</li>

      <li>Cách <b>lặp lại</b> một việc, và khi nào chọn vòng lặp đếm hay vòng lặp
      điều kiện?</li>

      <li>Vì sao <b>thụt lề</b> quan trọng, và số lần lặp thay đổi thế nào khi dữ
      liệu lớn lên?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, chương trình chọn nhánh theo điều kiện
      bằng cách nào. Hai, cách lặp lại một việc, và khi nào chọn vòng lặp đếm hay
      vòng lặp điều kiện. Ba, vì sao thụt lề quan trọng, và số lần lặp thay đổi thế
      nào khi dữ liệu lớn lên.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: biến, kiểu, và phép so sánh cho ra đúng hoặc sai'
  steps:
  - show: <p><b>Phép so sánh cho ra giá trị đúng hoặc sai</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>tien = 7500000</div><div><span class="cm">&gt;&gt;&gt;
      </span>tien &lt; 1000000</div><div>False</div><div><span class="cm">&gt;&gt;&gt;
      </span>tien &gt;= 1000000</div><div>True</div><div><span class="cm">&gt;&gt;&gt;
      </span>tien == 7500000</div><div>True</div><div><span class="cm">&gt;&gt;&gt;
      </span>tien != 7500000</div><div>False</div></div><p>Biến <code>tien</code>
      là nhãn dán lên số nguyên <code>7500000</code>. Một phép so sánh luôn trả về
      <b>đúng</b> (<code>True</code>) hoặc <b>sai</b> (<code>False</code>), kiểu đúng–sai
      của bài trước.</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Ta ôn lại hai điều từ bài trước. Biến là một cái nhãn dán lên giá trị, ở
      đây nhãn tiền dán lên bảy triệu rưỡi. Và một phép so sánh luôn cho ra giá trị
      đúng hoặc sai, chính là kiểu đúng sai ta đã học. Hỏi bảy triệu rưỡi có nhỏ hơn
      một triệu không, máy trả lời sai. Có lớn hơn hoặc bằng không, máy trả lời đúng.
- id: sym
  kind: symbol
  title: Giải mã sáu phép so sánh, ba từ nối, hai chấm và thụt lề
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>a
      == b</code>, <code>a != b</code></td><td>bằng, khác</td><td>hai dấu <code>=</code>
      hỏi “bằng nhau?”; <code>!=</code> hỏi “khác nhau?”</td></tr><tr><td><code>a
      &lt; b</code>, <code>a &lt;= b</code></td><td>nhỏ hơn, nhỏ hơn hoặc bằng</td><td><code>&lt;=</code>
      gồm cả trường hợp bằng</td></tr><tr><td><code>a &gt; b</code>, <code>a &gt;=
      b</code></td><td>lớn hơn, lớn hơn hoặc bằng</td><td><code>&gt;=</code> gồm cả
      trường hợp bằng</td></tr></table>
    say: Bảng đầu là sáu phép so sánh. Hai dấu bằng hỏi hai bên có bằng nhau không,
      còn dấu chấm than và một dấu bằng hỏi có khác nhau không. Nhỏ hơn và nhỏ hơn
      hoặc bằng khác nhau ở chỗ trường hợp bằng nhau. Lớn hơn và lớn hơn hoặc bằng
      cũng vậy. Mọi phép so sánh đều cho ra đúng hoặc sai.
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>A
      and B</code></td><td>và</td><td>đúng khi <b>cả hai</b> cùng đúng</td></tr><tr><td><code>A
      or B</code></td><td>hoặc</td><td>đúng khi <b>ít nhất một</b> bên đúng</td></tr><tr><td><code>not
      A</code></td><td>không phải</td><td>đảo đúng thành sai và ngược lại</td></tr></table>
    clear: true
    say: Bảng thứ hai là ba từ nối điều kiện. Từ và cho kết quả đúng khi cả hai vế
      cùng đúng. Từ hoặc cho kết quả đúng khi ít nhất một vế đúng. Từ phủ định đảo
      đúng thành sai và sai thành đúng.
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>if
      điều_kiện:</code></td><td>câu lệnh rẽ nhánh</td><td>chạy khối bên dưới <b>chỉ
      khi</b> điều kiện đúng; <code>elif</code> = “nếu không thì, nếu”; <code>else</code>
      = “còn lại”</td></tr><tr><td><code>:</code> và <b>thụt lề</b></td><td>dấu hai
      chấm, bốn dấu cách</td><td>dòng kết thúc bằng <code>:</code> mở một <b>khối
      lệnh</b>; các dòng <b>thụt vào</b> cùng độ sâu là một khối</td></tr><tr><td><code>for
      x in …:</code></td><td>vòng lặp đếm</td><td>lặp khối bên dưới, mỗi lượt <code>x</code>
      nhận <b>một giá trị kế tiếp</b>; <code>in</code> = “nằm trong”</td></tr><tr><td><code>while
      điều_kiện:</code></td><td>vòng lặp điều kiện</td><td>lặp khối bên dưới <b>chừng
      nào</b> điều kiện còn đúng</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ ba là bộ khung của chương trình. Câu lệnh rẽ nhánh chạy khối bên
      dưới chỉ khi điều kiện đúng, từ khoá nếu-không-thì-nếu là nhánh kiểm tra thêm,
      còn từ khoá còn-lại là nhánh cuối. Dòng kết thúc bằng dấu hai chấm mở ra một
      khối lệnh. Các dòng thụt vào cùng độ sâu, thường bốn dấu cách, thuộc cùng một
      khối. Vòng lặp đếm lặp khối bên dưới, mỗi lượt biến nhận một giá trị kế tiếp,
      và chữ in nghĩa là nằm trong. Vòng lặp điều kiện lặp chừng nào điều kiện còn
      đúng.
  - show: '<p><b>range(...) sinh dãy số, bắt đầu từ 0, dừng TRƯỚC số cuối; list(...)
      xếp dãy đó thành danh sách để nhìn thấy</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>list(range(3))</div><div>[0, 1, 2]</div><div><span
      class="cm">&gt;&gt;&gt; </span>list(range(1, 4))</div><div>[1, 2, 3]</div><div><span
      class="cm">&gt;&gt;&gt; </span>list(range(2, 9, 3))</div><div>[2, 5, 8]</div></div><p><code>[
      … ]</code> là một <b>danh sách</b>: các giá trị xếp thành hàng. <code>range(3)</code>
      sinh <code>0, 1, 2</code>; <code>range(1, 4)</code> sinh <code>1, 2, 3</code>;
      số thứ ba là bước nhảy; <code>list(…)</code> xếp các số do <code>range</code>
      sinh ra thành một danh sách để ta nhìn thấy.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Cuối cùng là lệnh sinh dãy số, bọc trong lệnh danh sách để ta nhìn thấy các
      số. Nó cho ra các số bắt đầu từ không và dừng trước số cuối cùng. Dãy ba số
      bắt đầu từ không là không, một, hai. Dãy từ một đến bốn dừng trước bốn là một,
      hai, ba. Số thứ ba là bước nhảy. Cặp ngoặc vuông là một danh sách, tức các giá
      trị xếp thành hàng, và vòng lặp đếm có thể đi qua từng phần tử của nó.
