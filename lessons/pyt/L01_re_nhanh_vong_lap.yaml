- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>so sánh cho ra đúng hoặc sai; and
      / or / not ghép điều kiện</span><span class=''a''>→</span><span class=''n''>if
      – elif – else: dừng ở nhánh đúng đầu tiên</span><span class=''a''>→</span><span
      class=''n''>khối lệnh = dòng thụt vào sau dấu hai chấm</span><span class=''a''>→</span><span
      class=''n''>for: biết trước số lượt; while: biết điều kiện dừng</span><span
      class=''a''>→</span><span class=''n''>biến cộng dồn bắt đầu từ 0; break / continue</span><span
      class=''a''>→</span><span class=''n''>số lượt lặp tăng bao nhiêu thì thời gian
      tăng chừng đó</span></div>'
    say: Tổng kết chuỗi logic. So sánh cho ra đúng hoặc sai, và các từ nối ghép điều
      kiện. Câu lệnh rẽ nhánh dừng ở nhánh đúng đầu tiên. Khối lệnh là các dòng thụt
      vào sau dấu hai chấm. Vòng đếm dùng khi biết trước số lượt, vòng điều kiện dùng
      khi biết khi nào dừng. Biến cộng dồn bắt đầu từ không. Và số lượt lặp tăng bao
      nhiêu lần thì thời gian tăng chừng đó.
  - show: '<div class=''box key''><b>Tư duy:</b> mỗi nhánh và mỗi vòng lặp hỏi hai
      câu: <b>điều kiện này đúng khi nào?</b> và <b>điều gì làm vòng lặp kết thúc?</b>
      Thử với đúng một giá trị nhỏ, bằng tay, trước khi chạy cả triệu.</div>

      <p>Bài sau: hàm, để gói một việc lại, đặt tên và dùng lại ở nhiều nơi.</p>

      '
