- id: formula
  kind: formula
  title: 'Suy ra từng bước: tính lãi, chia dư, thứ tự ưu tiên, và vì sao số thực lệch'
  checks:
  - 2000000 * 0.06 == 120000.0
  - 120000 * 3 // 12 == 30000
  - 2000000 + 30000 == 2030000
  - 2000000 // 3 == 666666 and 2000000 % 3 == 2
  - 666666 * 3 + 2 == 2000000
  - 2 + 3 * 4 == 14 and (2 + 3) * 4 == 20
  - 0.5 + 0.25 == 0.75 and 0.1 + 0.2 != 0.3 and round(0.1 + 0.2, 2) == 0.3
  steps:
  - show: <p><b>Bước 1. Đặt tên cho từng số, rồi tính một năm</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>so_du = 2000000</div><div><span class="cm">&gt;&gt;&gt;
      </span>lai_suat = 0.06</div><div><span class="cm">&gt;&gt;&gt; </span>thang
      = 3</div><div><span class="cm">&gt;&gt;&gt; </span>so_du * lai_suat</div><div>120000.0</div></div><p>Vì
      lãi suất là <b>6%</b> một năm, một năm sinh $2\,000\,000 \cdot 0{,}06 = 120\,000$
      đồng.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, đặt tên cho từng số rồi mới tính. Vì lãi suất sáu phần trăm là
      một năm, nên một năm sinh hai triệu nhân không phẩy không sáu, bằng một trăm
      hai mươi nghìn. Máy trả lời một trăm hai mươi nghìn chấm không, có chấm vì kết
      quả là số thực.
    introduces:
    - cdot
  - show: '<p><b>Bước 2. Chỉ lấy ba tháng, rồi cộng vào gốc</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>so_du * lai_suat * thang / 12</div><div>30000.0</div><div><span
      class="cm">&gt;&gt;&gt; </span>so_du + 30000</div><div>2030000</div></div><p>Vì
      ba tháng là $\frac{3}{12}$ năm, nhân thêm ba rồi chia mười hai: $\frac{120\,000
      \cdot 3}{12} = 30\,000$. Tổng nhận: $2\,000\,000 + 30\,000 = 2\,030\,000$ ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, ta chỉ lấy ba tháng. Vì ba tháng là ba phần mười hai của một năm,
      ta nhân thêm ba rồi chia mười hai, được ba mươi nghìn. Cộng vào gốc, người gửi
      nhận hai triệu không trăm ba mươi nghìn.
  - show: '<p><b>Bước 3. Chia tiền cho người: /, //, %</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>2000000 / 3</div><div>666666.6666666666</div><div><span
      class="cm">&gt;&gt;&gt; </span>2000000 // 3</div><div>666666</div><div><span
      class="cm">&gt;&gt;&gt; </span>2000000 % 3</div><div>2</div><div><span class="cm">&gt;&gt;&gt;
      </span>666666 * 3 + 2</div><div>2000000</div></div><p>Chia $2\,000\,000$ đồng
      cho $3$ người: mỗi người $666\,666$ (phần nguyên), <b>dư $2$</b>. Kiểm: $666\,666
      \cdot 3 + 2 = 2\,000\,000$ ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, chia tiền cho người. Vì chia hai triệu đồng cho ba người không hết,
      dấu chia thường cho ra số thực lẻ, vô nghĩa với đồng tiền. Phần nguyên là sáu
      trăm sáu mươi sáu nghìn sáu trăm sáu mươi sáu đồng mỗi người, và còn dư hai
      đồng, nhân lại ba rồi cộng hai thì đúng hai triệu.
  - show: '<p><b>Bước 4. Thứ tự ưu tiên, như trong toán</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>2 + 3 * 4</div><div>14</div><div><span class="cm">&gt;&gt;&gt;
      </span>(2 + 3) * 4</div><div>20</div><div><span class="cm">&gt;&gt;&gt; </span>2
      ** 3 * 2</div><div>16</div></div><p>Vì nhân làm <b>trước</b> cộng, $2 + 3 \cdot
      4 = 2 + 12 = 14$. Muốn cộng trước thì dùng ngoặc: $(2 + 3) \cdot 4 = 20$.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, thứ tự ưu tiên. Giống toán học, lũy thừa làm trước, rồi nhân chia,
      rồi cộng trừ. Vì nhân làm trước cộng, hai cộng ba nhân bốn bằng hai cộng mười
      hai, là mười bốn. Muốn cộng trước, ta dùng ngoặc, được hai mươi.
  - show: '<p><b>Bước 5. Vì sao 0.1 + 0.2 lệch: máy đếm bằng hệ hai</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>0.5 + 0.25 == 0.75</div><div>True</div><div><span
      class="cm">&gt;&gt;&gt; </span>0.1 + 0.2 == 0.3</div><div>False</div><div><span
      class="cm">&gt;&gt;&gt; </span>round(0.1 + 0.2, 2) == 0.3</div><div>True</div></div><p>Máy
      lưu số bằng <b>hệ nhị phân</b> (hệ hai): chỉ có hai chữ số <code>0</code> và
      <code>1</code>, các vị trí đếm gấp đôi nhau (1, 2, 4, 8… như hệ mười có 1, 10,
      100…), và số chữ số cố định. Một phần mười ở hệ hai là số lặp vô hạn, như một
      phần ba ở hệ mười ($0{,}333$ và cứ thế mãi), nên bị <b>cắt</b>. Nửa và một phần
      tư thì vừa khít.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước năm, vì sao số thực lệch. Máy lưu số bằng hệ hai, chỉ có hai chữ số
      không và một, các vị trí gấp đôi nhau, với một số chữ số cố định. Một phần mười
      ở hệ hai là số lặp vô hạn, giống một phần ba ở hệ mười là không phẩy ba ba ba
      mãi mãi, nên phải bị cắt. Nửa cộng một phần tư thì vừa khít nên đúng, còn làm
      tròn hai chữ số thì cho lại không phẩy ba.
- id: example
  kind: example
  title: 'Ví dụ: chạy một tệp tính lãi, rồi một tệp đọc bàn phím'
  checks:
  - round(2000000 * 0.06 * 3 / 12) == 30000
  - 2000000 + 30000 == 2030000
  - 150000 * 2 == 300000
  steps:
  - show: '<p><b>Trước hết, chuỗi có chỗ điền: f"…{…}…"</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>tong = 2030000</div><div><span class="cm">&gt;&gt;&gt;
      </span>f"Tong: {tong}"</div><div>''Tong: 2030000''</div><div><span class="cm">&gt;&gt;&gt;
      </span>f"Tong: {tong:,}"</div><div>''Tong: 2,030,000''</div><div><span class="cm">&gt;&gt;&gt;
      </span>f"Tong: {2000000 + 30000:,}"</div><div>''Tong: 2,030,000''</div></div><p>Chữ
      <code>f</code> ngay trước cặp nháy cho phép điền vào chỗ <code>{…}</code> một
      tên biến hoặc cả một phép tính; <code>:,</code> thêm dấu phẩy ngăn cách hàng
      nghìn.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Trước khi viết tệp, ta học một dạng chuỗi có chỗ điền. Đặt chữ f ngay trước
      cặp nháy, rồi viết tên biến hoặc cả một phép tính trong cặp ngoặc nhọn, máy
      điền kết quả vào đó. Thêm dấu hai chấm và dấu phẩy, máy ngăn cách hàng nghìn
      cho dễ đọc.
  - show: '<p><b>Tệp lai.py (gõ bằng trình soạn thảo, lưu cùng thư mục)</b></p><div
      class="code"><div>so_du = 2000000</div><div>lai_suat = 0.06</div><div>thang
      = 3</div><div>lai = so_du * lai_suat * thang / 12</div><div>print("So du goc:",
      so_du)</div><div>print("Lai", thang, "thang:", round(lai))</div><div>print(f"Tong:
      {so_du + round(lai):,}")</div></div><p><b>Trình soạn thảo</b> là chương trình
      gõ chữ thuần (Notepad, VS Code; không dùng Word). Lưu tên <code>lai.py</code>
      (đuôi <code>.py</code>) vào thư mục gốc của bộ khoá, đúng thư mục cửa sổ lệnh
      đang đứng (kiểm bằng <code>pwd</code>).</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Bây giờ ta viết tệp đầu tiên. Hãy mở một trình soạn thảo chữ thuần, không
      phải phần mềm soạn văn bản, rồi gõ bảy dòng này. Lưu thành tệp lai chấm py ở
      thư mục gốc của bộ khoá, đúng chỗ cửa sổ lệnh đang đứng. Ba dòng đầu đặt tên
      cho số dư, lãi suất và số tháng. Dòng thứ tư tính lãi bằng công thức vừa suy
      ra. Ba dòng cuối in kết quả, lệnh in nhận các giá trị cách nhau dấu phẩy và
      in chúng cách nhau một dấu cách; dòng cuối dùng chuỗi có chỗ điền.
  - show: '<p><b>Chạy tệp từ cửa sổ lệnh</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>python lai.py</div><div>So du goc: 2000000</div><div>Lai 3 thang: 30000</div><div>Tong:
      2,030,000</div><div><span class="cm"><span>&#36;</span> </span>echo <span>&#36;</span>?</div><div>0</div></div><p>Lệnh
      làm tròn đổi <code>30000.0</code> thành số nguyên <code>30000</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta chạy tệp từ cửa sổ lệnh. Gõ tên ngôn ngữ, dấu cách, rồi tên tệp. Máy in
      ba dòng, đúng như ba lệnh in. Chú ý lệnh làm tròn đã đổi ba mươi nghìn chấm
      không thành số nguyên ba mươi nghìn.
  - show: '<p><b>Tệp nhap.py: đọc một số từ bàn phím</b></p><div class="code"><div>print("Nhap
      so tien:")</div><div>tien = int(input())</div><div>print("Gap doi:", tien *
      2)</div></div><p><b>Chạy và gõ 150000 rồi bấm xuống dòng</b></p><div class="code"><div>Nhap
      so tien:</div><div><span class="kw">150000</span></div><div>Gap doi: 300000</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Tệp thứ hai đọc từ bàn phím. Lệnh nhập đợi bạn gõ một dòng rồi trả về dòng
      đó dưới dạng chuỗi, nên ta bọc nó bằng lệnh đổi sang số nguyên. Bạn gõ một trăm
      năm mươi nghìn, máy in gấp đôi là ba trăm nghìn.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: số nguyên, ngoặc, và phép thử chia dư'
  checks:
  - 2000000 * 6 * 3 // 1200 == 30000
  - (2000000 // 7) * 7 + 2000000 % 7 == 2000000
  steps:
  - show: '<p><b>Cách 1: làm toàn số nguyên, không dùng số thực</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>2000000 * 6 * 3 // 1200</div><div>30000</div><div><span
      class="cm">&gt;&gt;&gt; </span>round(2000000 * 0.06 * 3 / 12)</div><div>30000</div></div><p>Lãi
      suất $6\%$ là $6$ phần $100$; ba tháng là $3$ phần $12$ nên mẫu chung $100 \cdot
      12 = 1200$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, làm toàn bằng số nguyên. Lãi suất sáu phần trăm là sáu phần
      một trăm, ba tháng là ba phần mười hai, nên mẫu chung là một nghìn hai trăm.
      Nhân tử số trước rồi chia nguyên một lần cho ra ba mươi nghìn, trùng kết quả
      bằng số thực.
- id: scale
  kind: concept
  title: 'Khi số lớn dần: số thực mất độ chính xác, số nguyên thì không'
  checks:
  - 2 ** 53 == 9007199254740992 and 2 ** 53 + 1 == 9007199254740993 and float(2 **
    53) + 1 == float(2 ** 53)
  - 1 + 0.1 - 1 != 0.1 and 1000000 + 0.1 - 1000000 != 0.1 and 10 ** 15 + 0.1 - 10
    ** 15 == 0.125
  - 10 ** 15 == 1000000000000000
  - abs((1 + 0.1 - 1) - 0.1) < 1e-15 and 1e-12 < abs((1000000 + 0.1 - 1000000) - 0.1)
    < 1e-10 and abs((10 ** 15 + 0.1 - 10 ** 15) - 0.1) > 0.02
  steps:
  - show: '<p><b>Cộng 0.1 đồng vào một tổng, rồi trừ tổng đó đi</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>1 + 0.1 - 1</div><div>0.10000000000000009</div><div><span
      class="cm">&gt;&gt;&gt; </span>1000000 + 0.1 - 1000000</div><div>0.09999999997671694</div><div><span
      class="cm">&gt;&gt;&gt; </span>1000000000000000 + 0.1 - 1000000000000000</div><div>0.125</div></div><p>Đúng
      ra phải ra $0{,}1$ ở cả ba lần. Cách đọc: $10^{6}$ là một và sáu số không (một
      triệu); $10^{-16}$ là một chia cho $10^{16}$, rất nhỏ ($0{,}0000000000000001$).</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta lấy một số, cộng thêm không phẩy một, rồi trừ lại chính số đó, đúng ra
      luôn ra không phẩy một. Mười mũ sáu là một và sáu số không, mười mũ âm mười
      sáu là một chia cho mười mũ mười sáu, rất nhỏ. Với số một, sai số cỡ mười mũ
      âm mười sáu, với một triệu cỡ mười mũ âm mười một. Với mười mũ mười lăm, máy
      trả lời không phẩy một hai lăm, vì số lẻ không phẩy một đã bị làm tròn thành
      một phần tám.
  - show: '<p><b>Số nguyên không có giới hạn đó</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>2 ** 53</div><div>9007199254740992</div><div><span
      class="cm">&gt;&gt;&gt; </span>2 ** 53 + 1</div><div>9007199254740993</div><div><span
      class="cm">&gt;&gt;&gt; </span>float(2 ** 53) + 1</div><div>9007199254740992.0</div></div><p>Số
      thực chỉ giữ chắc được tới $2^{53} = 9\,007\,199\,254\,740\,992$ (khoảng $9
      \cdot 10^{15}$): ở đó cộng thêm $1$ <b>không thay đổi</b> gì. <code>float(x)</code>
      đổi số nguyên <code>x</code> thành số thực.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: 'Số thực còn có giới hạn cứng. Lệnh đổi sang số thực biến số nguyên thành
      số thực. Hai mũ năm mươi ba là chín nghìn không trăm linh bảy nghìn tỉ và hơn
      nữa. Từ đó trở lên, cộng thêm một vào số thực không thay đổi gì cả. Số nguyên
