  - show: '<table class=''t''><tr><th>quy mô tổng tiền</th><th>số thực (float)</th><th>số
      nguyên (int)</th></tr><tr><td>×1 (1 đồng)</td><td>sai số cỡ 10<sup>−16</sup></td><td>chính
      xác</td></tr><tr><td>×10<sup>6</sup> (1 triệu đồng)</td><td>sai số cỡ 10<sup>−11</sup></td><td>chính
      xác</td></tr><tr><td>×10<sup>15</sup> (1 nghìn nghìn tỉ đồng)</td><td>0,1 bị
      làm tròn thành 0,125: sai 0,025</td><td>chính xác</td></tr></table><div class=''box
      key''><b>Đánh đổi:</b> số thực cho phép phần lẻ nhưng sai số tăng theo độ lớn;
      số nguyên chính xác nhưng không có phần lẻ. Vì vậy tiền đồng lưu bằng <b>số
      nguyên đồng</b>, còn quy tắc làm tròn viết rõ bằng một lệnh (số minh hoạ cho
