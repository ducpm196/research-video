scenes:
- id: hook
  kind: hook
  title: 'Sổ tiết kiệm lệch một đồng: vì sao máy tính cộng sai?'
  steps:
  - show: <p><b>Hỏi máy một phép cộng đơn giản</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>0.1 + 0.2</div><div>0.30000000000000004</div><div><span
      class="cm">&gt;&gt;&gt; </span>0.1 + 0.2 == 0.3</div><div>False</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chào bạn, hôm nay ta bắt đầu học viết chương trình bằng Python, và trước
      hết hãy xem một chuyện lạ. Ta bảo máy lấy không phẩy một cộng không phẩy hai.
      Máy trả lời không phẩy ba, nhưng kèm một dãy số lẻ ở cuối, và khi ta hỏi kết
      quả có bằng không phẩy ba hay không, máy trả lời là không bằng.
  - show: <p><b>Lãi của sổ tiết kiệm 12 triệu đồng, lãi 7,2% một năm</b></p><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>12000000 * 0.072</div><div>863999.9999999999</div></div><p>Đúng
      ra phải là <b>864 000</b> đồng.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Một sổ tiết kiệm mười hai triệu đồng, lãi bảy phẩy hai phần trăm một năm,
      đúng ra sinh lãi tám trăm sáu mươi tư nghìn đồng. Nhưng máy trả lời tám trăm
      sáu mươi ba nghìn chín trăm chín mươi chín phẩy chín chín chín. Cắt phần lẻ
      là mất đúng một đồng.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Chạy một chương trình bằng <b>hai cách</b> nào?</li>

      <li><b>Giá trị</b>, <b>kiểu</b>, <b>biến</b> và các <b>phép toán</b> hoạt động
      ra sao?</li>

      <li>Vì sao <b>số thực</b> lệch một chút, và <b>tiền</b> nên lưu bằng gì?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một, chạy một chương trình bằng hai cách nào.
      Hai, giá trị, kiểu, biến và các phép toán hoạt động ra sao. Ba, vì sao số thực
      lệch một chút, và tiền nên lưu bằng gì.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: cửa sổ lệnh, chương trình tìm được qua PATH, mã thoát'
  steps:
  - show: '<p><b>Gọi chương trình từ cửa sổ lệnh</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -c "print(''xin chao'')"</div><div>xin
      chao</div><div><span class="cm"><span>&#36;</span> </span>echo <span>&#36;</span>?</div><div>0</div></div><p>Máy
      tìm được <code>python</code> vì thư mục chứa nó nằm trong biến <code>PATH</code>.
      Mã thoát <code>0</code> nghĩa là thành công.</p><p>Cờ <code>-c</code> bảo máy
      chạy ngay câu nằm trong cặp nháy, không cần tệp; <code>print(…)</code> in giá
      trị trong ngoặc ra màn hình. Máy báo không tìm thấy <code>python</code> thì
      cài từ <b>python.org</b>, tích ô thêm vào <code>PATH</code> khi cài; kiểm bằng
      <code>python --version</code>.</p><p><b>Git Bash</b> là cửa sổ lệnh của khoá:
      tải <b>Git for Windows</b> ở git-scm.com, cài, rồi mở <b>Git Bash</b> trong
      menu Start. Dấu <code>&#36;</code> ở đầu dòng là dấu nhắc của máy, không gõ
      nó. <code>echo</code> in chữ đứng sau nó ra màn hình; <code>&#36;?</code> là
      mã thoát của lệnh vừa chạy, nên <code>echo &#36;?</code> in mã thoát đó.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Cửa sổ lệnh của khoá cài từ trang chủ bộ công cụ quản lý phiên bản, tên nó
      hiện trên màn hình. Máy tìm được chương trình vì thư mục chứa nó nằm trong biến
      môi trường tìm đường. Lệnh in chữ in một dòng ra màn hình, và dấu hỏi sau dấu
      đô la là mã thoát của lệnh vừa chạy, bằng không nghĩa là thành công. Cờ chữ
      c cho chạy ngay câu nằm trong cặp nháy, và lệnh in của ngôn ngữ in giá trị trong
      ngoặc ra màn hình.
  - show: <p><b>Cửa sổ lệnh luôn đứng trong một thư mục</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>pwd</div><div>/c/Users/ban</div><div><span
      class="cm"><span>&#36;</span> </span>cd khoa_hoc</div><div><span class="cm"><span>&#36;</span>
      </span>pwd</div><div>/c/Users/ban/khoa_hoc</div><div><span class="cm"><span>&#36;</span>
      </span>ls</div><div>labs/</div></div><p><code>pwd</code> in thư mục đang đứng;
      <code>cd khoa_hoc</code> đi vào thư mục con tên đó (<code>cd ..</code> lùi ra
      một cấp); <code>ls</code> liệt kê tên trong thư mục.</p>
    focus:
    - 1
    - 2
    - 3
    introduces:
    - pyt_cd
    clear: true
    say: Mọi tệp của khoá lưu ở thư mục gốc của bộ khoá, nơi có thư mục thực hành.
      Cửa sổ lệnh luôn đứng trong một thư mục, và lệnh hỏi vị trí cho biết đó là đâu.
      Lệnh đổi thư mục kèm tên thì đi vào thư mục con, kèm hai dấu chấm thì lùi ra.
  - show: '<div class=''box key''>Mọi tệp của khoá lưu ở <b>thư mục gốc của bộ khoá</b>
      (gõ <code>ls</code> thấy thư mục <code>labs</code>). Nhanh nhất: mở thư mục
      đó trong File Explorer, chuột phải vào chỗ trống, chọn <i>Open Git Bash here</i>
      (Windows 11: chọn <i>Show more options</i> trước), rồi gõ <code>pwd</code> và
      <code>ls</code> để kiểm.</div>'
    clear: true
    say: Cách nhanh nhất là mở thư mục gốc trong trình quản lý tệp, bấm chuột phải
      vào chỗ trống, chọn mở cửa sổ lệnh tại đây, rồi kiểm lại bằng lệnh hỏi vị trí.
  - show: '<p><b>Khi có lỗi: đọc từ dưới lên</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>python -c "1/0"</div><div>Traceback (most recent call last):</div><div>  File
      "&lt;string&gt;", line 1, in &lt;module&gt;</div><div>ZeroDivisionError: division
      by zero</div><div><span class="cm"><span>&#36;</span> </span>echo <span>&#36;</span>?</div><div>1</div></div><p>Mã
      thoát khác <code>0</code> là thất bại; <b>dòng cuối</b> của thông báo nói lỗi
      gì: <code>ZeroDivisionError</code> = chia cho không; dòng bắt đầu bằng <code>File</code>
      cho biết dòng thứ mấy.</p><p class=''note''>Hình này là Python 3.11. Python
      3.13 in thêm dòng mã và dấu <code>^</code> giữa các dòng; cách đọc vẫn vậy:
      dòng cuối trước, rồi tìm dòng bắt đầu bằng <code>File</code>.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Khi có lỗi, mã thoát khác không và máy in thông báo nhiều dòng. Hãy đọc từ
      dòng cuối lên, vì dòng cuối nói thẳng lỗi gì, ở đây là chia cho không.
- id: sym
  kind: symbol
  title: Giải mã dấu nhắc, dấu bằng, dấu thăng và bảy phép toán
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>python</code></td><td>mở
      cửa sổ gõ từng câu</td><td>máy hiện dấu nhắc <code>&gt;&gt;&gt;</code>: <b>chờ
      bạn gõ một câu</b>, chạy ngay, in kết quả</td></tr><tr><td><code>exit()</code></td><td>thoát
      cửa sổ</td><td>quay về cửa sổ lệnh thường</td></tr><tr><td><code>python lai.py</code></td><td>chạy
      cả tệp</td><td>máy đọc <b>cả tệp</b> <code>lai.py</code> từ trên xuống dưới,
      mỗi dòng một câu lệnh</td></tr></table>'
    say: Bảng đầu là cách mở chương trình. Gõ tên ngôn ngữ, máy mở cửa sổ gõ từng
      câu với dấu nhắc ba dấu lớn hơn, bạn gõ một câu thì máy chạy ngay và in kết
      quả. Cách thứ hai là viết nhiều dòng vào một tệp có đuôi chấm py rồi gõ tên
      ngôn ngữ cùng tên tệp, máy đọc cả tệp từ trên xuống.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>so_du
      = 2000000</code></td><td>gán</td><td>dấu <code>=</code> <b>không</b> là “bằng”
      của toán: nó <b>dán nhãn</b> <code>so_du</code> lên giá trị bên phải</td></tr><tr><td><code>a
      == b</code></td><td>so sánh bằng</td><td>hai dấu <code>==</code> <b>hỏi</b>
      “a có bằng b không?”, trả lời đúng hoặc sai</td></tr><tr><td><code># ghi chú</code></td><td>chú
      thích</td><td>từ dấu <code>#</code> đến hết dòng, máy <b>bỏ qua</b>; chỉ để
      người đọc</td></tr><tr><td><code>"A01"</code></td><td>chuỗi</td><td>chữ đặt
      trong cặp nháy kép (hay đơn); <code>"A01"</code> là chữ, không phải số</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là bốn dấu hay gặp. Một dấu bằng là phép gán, nó dán nhãn bên
      trái lên giá trị bên phải. Hai dấu bằng mới là câu hỏi hai bên có bằng nhau
      không. Dấu thăng mở đầu chú thích, máy bỏ qua đến hết dòng. Chữ đặt trong cặp
      nháy gọi là chuỗi, chuỗi A không một là chữ chứ không phải số.
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>+  -  *</code></td><td>cộng,
      trừ, nhân</td><td><code>7 * 2</code> ra <code>14</code></td></tr><tr><td><code>/</code></td><td>chia,
      <b>luôn ra số thực</b></td><td><code>7 / 2</code> ra <code>3.5</code></td></tr><tr><td><code>//</code></td><td>chia
      lấy <b>phần nguyên</b></td><td><code>7 // 2</code> ra <code>3</code></td></tr><tr><td><code>%</code></td><td>chia
      lấy <b>phần dư</b></td><td><code>7 % 2</code> ra <code>1</code></td></tr><tr><td><code>**</code></td><td>lũy
      thừa</td><td><code>2 ** 10</code> ra <code>1024</code></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    clear: true
    say: Bảng cuối là bảy phép toán số học. Cộng, trừ, nhân như thường. Một dấu gạch
      chéo là phép chia, luôn ra số thực, như bảy chia hai ra ba phẩy năm. Hai dấu
      gạch chéo lấy phần nguyên, bảy chia hai được ba. Dấu phần trăm lấy phần dư,
      bảy chia hai dư một. Hai dấu sao là lũy thừa, hai mũ mười bằng một nghìn không
      trăm hai mươi tư.
