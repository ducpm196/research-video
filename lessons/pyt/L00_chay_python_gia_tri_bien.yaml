- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - '''150000'' * 2 == ''150000150000'''
  - int(12000000 * 0.072) == 863999 and round(12000000 * 0.072) == 864000 and 12000000
    * 72 // 1000 == 864000
  - type(10 / 5) is float and type(10 // 5) is int
  - round(0.5) == 0 and round(1.5) == 2 and round(2.5) == 2 and (2 * 5 + 2) // (2
    * 2) == 3
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên đổi kiểu: lệnh nhập
      luôn trả về <b>chuỗi</b>.</div><p><b>Tệp nhap_sai.py (quên bọc bằng số nguyên)</b></p><div
      class="code"><div>print("Nhap so tien:")</div><div>tien = input()</div><div>print("Gap
      doi:", tien * 2)</div></div><p><b>Gõ 150000</b></p><div class="code"><div>Nhap
      so tien:</div><div><span class="kw">150000</span></div><div>Gap doi: 150000150000</div></div><p>Không
      báo lỗi, nhưng <code>"150000" * 2</code> là <b>lặp chuỗi hai lần</b>: <code>150000150000</code>.
      Phép thử bắt được: hỏi <code>type(tien)</code>, hoặc so với kết quả tính tay
      $300\,000$.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    - 5
    clear: true
    say: Lỗi thứ nhất, của người mới, là quên đổi kiểu. Lệnh nhập luôn trả về chuỗi.
      Nhân một chuỗi với hai là lặp chuỗi hai lần, nên ra một trăm năm mươi nghìn
      một trăm năm mươi nghìn. Chương trình không báo lỗi gì cả. Phép thử bắt được
      là so với kết quả tính tay ba trăm nghìn, hoặc hỏi kiểu của biến.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Phép chia một dấu luôn
      ra số thực, kể cả khi chia hết.</div><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>10 / 5</div><div>2.0</div><div><span class="cm">&gt;&gt;&gt; </span>10
      // 5</div><div>2</div><div><span class="cm">&gt;&gt;&gt; </span>type(10 / 5)</div><div>&lt;class
      ''float''&gt;</div></div><p>Cần số nguyên (số giao dịch, số người) thì dùng
      <code>//</code>. Phép thử: <code>type(...)</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, của người mới, là tưởng phép chia một dấu cho ra số nguyên khi
      chia hết. Mười chia năm ra hai chấm không, một số thực. Khi cần số nguyên, hãy
      dùng phép chia lấy phần nguyên, và hỏi kiểu để kiểm.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tính tiền bằng số
      thực rồi cắt bỏ phần lẻ.</div><div class="code"><div><span class="cm">&gt;&gt;&gt;
      </span>12000000 * 0.072</div><div>863999.9999999999</div><div><span class="cm">&gt;&gt;&gt;
      </span>int(12000000 * 0.072)</div><div>863999</div><div><span class="cm">&gt;&gt;&gt;
      </span>round(12000000 * 0.072)</div><div>864000</div><div><span class="cm">&gt;&gt;&gt;
      </span>12000000 * 72 // 1000</div><div>864000</div></div><p>Cắt bằng <code>int</code>
      mất $1$ đồng; làm tròn rõ ràng, hoặc tính toàn số nguyên, đều ra $864\,000$.
      Số tiền sai mà <b>không báo lỗi</b>, nên dễ lọt vào sổ cái.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là tính tiền bằng số thực rồi cắt phần
      lẻ. Mười hai triệu nhân không phẩy không bảy hai ra tám trăm sáu mươi ba nghìn
      chín trăm chín mươi chín chấm chín, cắt bằng lệnh đổi sang số nguyên mất đúng
      một đồng. Làm tròn có quy tắc, hoặc tính toàn số nguyên, đều cho tám trăm sáu
      mươi tư nghìn.
  - show: '<div class=''box warn''><b>Lưu ý về chính lệnh làm tròn.</b> Đúng giữa
      hai số nguyên, <code>round</code> chọn số <b>chẵn</b>.</div><div class="code"><div><span
      class="cm">&gt;&gt;&gt; </span>round(0.5)</div><div>0</div><div><span class="cm">&gt;&gt;&gt;
      </span>round(1.5)</div><div>2</div><div><span class="cm">&gt;&gt;&gt; </span>round(2.5)</div><div>2</div><div><span
      class="cm">&gt;&gt;&gt; </span>(2 * 5 + 2) // (2 * 2)</div><div>3</div></div><p>$0{,}5
      \to 0$, $1{,}5 \to 2$, $2{,}5 \to 2$. Nếu nghiệp vụ cần “làm tròn lên từ nửa”,
      tự viết bằng số nguyên: $\frac{5}{2}$ làm tròn nửa lên là $\frac{2 \cdot 5 +
      2}{2 \cdot 2} = 3$ (chia nguyên).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Còn một điều về chính lệnh làm tròn. Đúng giữa hai số nguyên, nó chọn số
      chẵn, nên không phẩy năm thành không, còn hai phẩy năm thành hai. Muốn làm tròn
      lên từ nửa, hãy tự viết bằng số nguyên, như công thức hiện trên màn hình.
