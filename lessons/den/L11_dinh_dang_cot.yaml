    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, cùng 100 nhóm, câu hỏi một tuần, ngày từ 10 tới 16. Sắp theo ngày thì đọc mấy
      nhóm? Không sắp thì sao? Câu hai, câu hỏi thường lọc theo cả ngày lẫn tỉnh. Nên sắp theo thứ tự nào? Dừng video và làm
      ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Sắp: nhóm thứ $k$ là ngày $k$ → khoảng 10 tới 16 chạm các nhóm 10, 11, …, 16: $16 - 10 + 1 = \hl{7}$ nhóm.</p>

      <p>Không sắp: mọi nhóm [0, 99] đều giao với [10, 16] → vẫn 100.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Đáp án câu một, khi sắp, nhóm thứ k là ngày k, nên khoảng từ 10 tới 16 chạm các nhóm 10 tới 16, tức 16 trừ 10 cộng
      1, bằng 7 nhóm. Không sắp thì mọi nhóm có khoảng từ 0 tới 99, đều giao với khoảng từ 10 tới 16, nên vẫn đọc 100. Kiểm
      tra điều kiện giao nhau với cặp giá trị nhỏ nhất lớn nhất quyết định ngay nhóm hàng nào được bỏ qua.
  - show: '<p>② Sắp theo <b>ngày, rồi tỉnh</b> trong mỗi ngày: lọc ngày bỏ được nhiều nhóm nhất; tỉnh chỉ giúp thêm khi <b>một
      ngày trải trên nhiều nhóm</b>.</p>

      <table class="t"><tr><th>một ngày 5000 dòng, 5 tỉnh, nhóm 1000 dòng: “ngày 42, tỉnh thứ ba”</th><th>nhóm phải đọc</th></tr>

      <tr><td>chỉ sắp theo ngày, tỉnh lẫn lộn</td><td>5</td></tr>

      <tr><td>sắp theo ngày rồi tỉnh</td><td>$\hl{1}$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    say: Câu hai, sắp theo ngày trước, rồi theo tỉnh trong mỗi ngày, vì lọc ngày bỏ được nhiều nhóm nhất. Tỉnh chỉ giúp thêm
      khi một ngày trải trên nhiều nhóm. Ví dụ một ngày có 5000 dòng của 5 tỉnh, mỗi nhóm 1000 dòng, và câu hỏi là ngày 42,
      tỉnh thứ ba. Nếu chỉ sắp theo ngày, tỉnh lẫn lộn trong cả 5 nhóm của ngày đó nên phải đọc 5 nhóm. Sắp tiếp theo tỉnh
      thì mỗi tỉnh gọn trong một nhóm, chỉ đọc 1 nhóm.
