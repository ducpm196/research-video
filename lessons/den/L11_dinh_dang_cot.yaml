scenes:
- id: hook
  kind: hook
  title: Đọc 1 phần trăm hay 100 phần trăm
  checks:
  - alg.rowgroups_read([[d] * 1000 for d in range(100)], 42, 42) == 1
  steps:
  - show: '<p>Kho dữ liệu lưu 100 ngày đơn hàng trong tệp cột. Câu hỏi chỉ về <b>một ngày</b>. Có đội đọc 1% tệp, có đội đọc
      cả 100% — cùng định dạng, cùng dữ liệu. Khác nhau chỉ ở chỗ dữ liệu được <b>sắp xếp</b> thế nào khi ghi.</p>

      <div class="box key">Hôm nay: <b>định dạng cột trên tệp</b> — nhóm hàng, thống kê nhỏ nhất–lớn nhất, và <b>đẩy điều
      kiện xuống</b> để khỏi đọc phần không cần.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, kho dữ liệu lưu 100 ngày đơn hàng trong tệp cột. Câu hỏi chỉ về một ngày. Có đội đọc 1 phần trăm tệp, có
      đội đọc cả 100 phần trăm, với cùng định dạng và cùng dữ liệu. Khác nhau chỉ ở chỗ dữ liệu được sắp xếp thế nào khi ghi.
      Hôm nay ta học định dạng cột trên tệp, với nhóm hàng, thống kê nhỏ nhất và lớn nhất, và đẩy điều kiện xuống để khỏi
      đọc phần không cần. Kho phân tích dữ liệu lớn không thể quét hết từng tệp khổng lồ nếu thiếu siêu dữ liệu thống kê từng
      nhóm hàng. Sắp xếp cột khéo léo giúp đẩy điều kiện lọc xuống tầng tệp bỏ qua trọn vẹn hàng chín mươi phần trăm khối
      không liên quan.
- id: prereq
  kind: prereq
  title: 'Ôn lại: nhỏ nhất, lớn nhất, và một khoảng có chứa một số không'
  checks:
  - min([3, 7, 5]) == 3 and max([3, 7, 5]) == 7 and (3 <= 5 <= 7) and not (3 <= 42 <= 7)
  - alg.scan_bytes(100e6, 50, 8) / 1e9 == 40 and round(alg.scan_bytes(100e6, 50, 8, 'col', 3) / 1e9, 1) == 2.4
  steps:
  - show: '<table class="t"><tr><th>ý</th><th>ví dụ với dãy 3, 7, 5</th></tr>

      <tr><td>nhỏ nhất, lớn nhất</td><td>3 và 7 → khoảng [3, 7]</td></tr>

      <tr><td>số 5 có thể có trong dãy?</td><td>5 nằm trong [3, 7] → <b>có thể</b>, phải nhìn vào dãy</td></tr>

      <tr><td>số 42 có thể có?</td><td>42 nằm ngoài [3, 7] → <b>chắc chắn không</b>, khỏi nhìn</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Ta ôn lại cách dùng nhỏ nhất và lớn nhất. Dãy 3, 7, 5 có nhỏ nhất là 3, lớn nhất là 7, nên mọi số của dãy nằm trong
      khoảng từ 3 tới 7. Số 5 nằm trong khoảng nên có thể có trong dãy, và ta phải nhìn vào dãy mới biết. Số 42 nằm ngoài
      khoảng nên chắc chắn không có, khỏi cần nhìn. Mỗi nhóm hàng lưu kèm giá trị nhỏ nhất và lớn nhất giúp bộ đọc loại ngay
      cả khối nếu ngoài khoảng tìm.
  - show: '<div class="box key">Ở bài 0, ta đã học <b>lưu theo cột</b> (các giá trị của cùng một cột nằm liền nhau trên đĩa):
      câu hỏi dùng 3 trong 50 cột của bảng 40 GB chỉ đọc 2,4 GB. Hôm nay thêm một cách bỏ bớt nữa: bỏ cả <b>khối dòng</b>.</div>

      '
    say: Ở bài 0, ta đã học lưu theo cột, tức các giá trị của cùng một cột nằm liền nhau trên đĩa. Nhờ vậy câu hỏi dùng 3
      trong 50 cột của bảng 40 GB chỉ phải đọc 2 phẩy 4 GB. Hôm nay ta thêm một cách bỏ bớt nữa, bỏ qua cả một khối dòng.
      Nếu các khoá bị trộn ngẫu nhiên khắp mọi nhóm hàng, khoảng biên trở nên quá rộng làm vô hiệu hoá lọc bỏ.
- id: sym
  kind: symbol
  title: 'Giải mã: nhóm hàng và thống kê'
  steps:
  - show: '<table class="t"><tr><th>thành phần</th><th>vai trò</th></tr>

      <tr><td><b>nhóm hàng</b></td><td>một khối nhiều dòng (ví dụ vài trăm nghìn); bên trong, mỗi cột lưu liền nhau</td></tr>

      <tr><td><b>thống kê cột</b></td><td>mỗi nhóm ghi nhỏ nhất, lớn nhất, số giá trị rỗng của từng cột</td></tr>

      <tr><td><b>đẩy điều kiện xuống</b></td><td>bộ đọc so điều kiện với thống kê <b>trước</b> khi đọc: nhóm nào chắc chắn
      không khớp thì bỏ qua</td></tr>

      <tr><td><b>chỉ đọc cột cần</b></td><td>như bài 0: chỉ tải các cột câu hỏi dùng</td></tr></table>

      <p>Thống kê chỉ giúp khi khoảng [nhỏ nhất, lớn nhất] của mỗi nhóm <b>hẹp</b> — tức dữ liệu đã được gom theo cột đó.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.5'
    - '1.5'
    say: Bảng có bốn thành phần. Nhóm hàng là một khối nhiều dòng, ví dụ vài trăm nghìn dòng, và bên trong mỗi cột được lưu
      liền nhau. Thống kê cột là mỗi nhóm ghi giá trị nhỏ nhất, lớn nhất và số giá trị rỗng của từng cột. Đẩy điều kiện xuống
      là bộ đọc so điều kiện với thống kê trước khi đọc, và nhóm nào chắc chắn không khớp thì bỏ qua. Chỉ đọc cột cần là chỉ
      tải các cột câu hỏi dùng, như lưu theo cột ở bài 0. Thống kê chỉ giúp khi khoảng từ nhỏ nhất tới lớn nhất của mỗi nhóm
      hẹp, tức dữ liệu đã được gom theo cột đó. Thống kê biên nhỏ nhất lớn nhất chỉ phát huy tối đa sức mạnh loại khối khi
      bảng được sắp xếp từ trước. Kết hợp lưu cột chỉ đọc trường cần thiết với lọc bỏ nhóm hàng tiết kiệm gấp chục lần băng
      thông mạng.
