  2026-11-09, no revision given): struct Statistics “Statistics per row group and per page”, min_value/max_value “Lower and
  upper bound values for the column”, ColumnMetaData.statistics “optional statistics for this column chunk”; parquet.apache.org/docs/file-format
  (truy cập 2026-11-09, trang ghi “Last modified November 7, 2026”); S. Melnik và cộng sự, Dremel: Interactive Analysis of
  Web-Scale Datasets (VLDB 2010); bài 0'
