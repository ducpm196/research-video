- id: example
  kind: example
  title: Sắp theo ngày hay không
  checks:
  - 'alg.rowgroups_read([[d] * 1000 for d in range(100)], 42, 42) == 1 and (lambda r: alg.rowgroups_read([[r.randrange(100)
    for _ in range(1000)] for _ in range(100)], 42, 42))(__import__(''random'').Random(3)) == 100'
  - round(0.99 ** 1000 * 100, 4) == 0.0043
  - '(lambda r: all((min(g), max(g)) == (0, 99) for g in [[r.randrange(100) for _ in range(1000)] for _ in range(100)]))(__import__(''random'').Random(3))'
  steps:
  - show: '<p><b>Bước 1</b> — 100 nhóm hàng × 1000 dòng, 100 ngày. Câu hỏi: <code>ngay = 42</code>. Bộ đọc so 42 với khoảng
      [nhỏ nhất, lớn nhất] của từng nhóm.</p>

      '
    say: Bước một, đặt đề bài. Ta có 100 nhóm hàng, mỗi nhóm 1000 dòng, trải trên 100 ngày, và câu hỏi là ngày bằng 42. Bộ
      đọc so 42 với khoảng từ nhỏ nhất tới lớn nhất của từng nhóm.
  - show: '<table class="t"><tr><th>cách ghi</th><th>khoảng ngày mỗi nhóm</th><th>nhóm phải đọc</th></tr>

      <tr><td><b>Bước 2</b> — sắp theo ngày</td><td>nhóm thứ $k$ chứa đúng ngày $k$; nhóm thứ 42: [42, 42]</td><td>$\hl{1}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Bước hai, ghi dữ liệu đã sắp theo ngày. Mỗi ngày có đúng 1000 dòng, bằng cỡ một nhóm, nên nhóm thứ k chứa đúng ngày
      k. Chỉ nhóm thứ 42 có khoảng từ 42 tới 42 chứa 42, nên chỉ đọc 1 nhóm.
  - show: '<table class="t"><tr><th>cách ghi</th><th>khoảng ngày mỗi nhóm</th><th>nhóm phải đọc</th></tr>

      <tr><td><b>Bước 3</b> — không sắp (thứ tự đến ngẫu nhiên)</td><td>mỗi nhóm [0, 99]</td><td>100 — thống kê vô dụng</td></tr></table>

      <p>Một nhóm thiếu hẳn ngày 0: xác suất $0{,}99^{1000} \approx 0{,}0043\%$ — nên gần như mọi nhóm đều có cả ngày 0 lẫn
      ngày 99 (với dữ liệu của ví dụ: cả 100 nhóm).</p>

      '
    introduces:
    - power
    focus:
    - 1
    - '1.2'
    - 2
    say: Bước ba, dữ liệu không sắp, đến theo thứ tự ngẫu nhiên. Cả 100 nhóm đều có khoảng từ 0 tới 99, nên phải đọc cả 100
      nhóm, thống kê trở nên vô dụng. Lý do là một nhóm 1000 dòng thiếu hẳn ngày 0 chỉ với xác suất 0 phẩy 99 mũ 1000, khoảng
      0 phẩy 0043 phần trăm.
  - clear: true
    show: '<table class="t"><tr><th>Bước 4 — cách ghi</th><th>nhóm phải đọc</th><th>phần tệp</th></tr>

      <tr><td>sắp theo ngày</td><td>1</td><td>1%</td></tr>

      <tr><td>không sắp</td><td>100</td><td>100%</td></tr></table>

      <p>Chi phí của việc sắp: một lần khi ghi. Lợi ích: mỗi câu hỏi theo ngày, mãi mãi.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Bước bốn, so hai cách. Sắp theo ngày thì đọc 1 trong 100 nhóm, tức 1 phần trăm tệp. Không sắp thì đọc 100 phần trăm,
      đúng như hai đội ở phần mở đầu. Chi phí của việc sắp chỉ trả một lần khi ghi, còn lợi ích có ở mỗi câu hỏi theo ngày,
      mãi mãi.
- id: check
  kind: check
  title: 'Tự kiểm: mở từng nhóm, đếm thẳng'
  checks:
  - sum(42 in g for g in [[d] * 1000 for d in range(100)]) == 1
  - '(lambda r: sum(42 in g for g in [[r.randrange(100) for _ in range(1000)] for _ in range(100)]))(__import__(''random'').Random(3))
    == 100'
  steps:
  - show: '<table class="t"><tr><th>đường khác: mở hết, đếm nhóm thật sự có dòng ngày 42</th><th>kết quả</th><th>so với thống
      kê</th></tr>

      <tr><td>sắp theo ngày</td><td>1 nhóm</td><td>khớp 1 ✓</td></tr>

      <tr><td>không sắp (cùng dữ liệu ngẫu nhiên)</td><td>100 nhóm</td><td>khớp 100 ✓</td></tr></table>

      <p>Thống kê không “nói dối”: khi không sắp, dòng ngày 42 <b>thật sự</b> rải khắp mọi nhóm.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Kiểm bằng đường khác, bỏ thống kê, mở từng nhóm và đếm thẳng những nhóm thật sự có dòng ngày 42. Khi sắp theo ngày,
      chỉ 1 nhóm có, khớp với thống kê. Khi không sắp, cả 100 nhóm đều có dòng ngày 42, cũng khớp với 100. Vậy thống kê không
      nói dối, vì khi không sắp, dòng ngày 42 thật sự rải khắp mọi nhóm.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - 10000 * 0.002 == 20 and round(100 * 0.002, 1) == 0.2
  - '(lambda r: (lambda L: (alg.rowgroups_read(L, 42, 42), alg.rowgroups_read(L, 10, 16)))([[d] * 950 + [max(0, d - r.randint(1,
    30)) for _ in range(50)] for d in range(100)]))(__import__(''random'').Random(3)) == (30, 37)'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Quá nhiều tệp nhỏ <b class="red">(chi phí mở tệp lấn át)</b>

      <br><span class="note">Luồng ghi mỗi phút một tệp vài trăm KB. 10 000 tệp × 2 ms (giả sử) mở và đọc siêu dữ liệu = 20
      giây trước khi đọc byte dữ liệu nào; gộp thành 100 tệp còn 0,2 giây. Gộp tệp định kỳ.</span></div>

      '
    say: Lỗi thứ nhất, quá nhiều tệp nhỏ, nên chi phí mở tệp lấn át. Luồng ghi mỗi phút một tệp vài trăm nghìn byte. 10 nghìn
      tệp, mỗi tệp giả sử 2 mi li giây để mở và đọc siêu dữ liệu, là 20 giây trước khi đọc byte dữ liệu nào. Gộp thành 100
      tệp thì chỉ còn 0 phẩy 2 giây, nên hãy gộp tệp định kỳ. Ghi dữ liệu vào cột mà không gom sắp xếp theo trường hay lọc
      làm thống kê biên mất hoàn toàn khả năng lọc bỏ. Sắp xếp nhóm hàng trước khi xuất tệp cột giúp thống kê biên nhỏ nhất
      lớn nhất loại bỏ sạch khối thừa.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Bọc cột lọc trong hàm <b class="red">(mất đẩy điều kiện)</b>

      <br><span class="note">Điều kiện “năm(thời điểm) = 2026” thường không so được với thống kê của cột thời điểm. Viết dạng
      khoảng trực tiếp trên cột: thời điểm từ 1/1/2026 tới trước 1/1/2027.</span></div>

      '
    say: Lỗi thứ hai, bọc cột lọc trong một hàm, nên mất đẩy điều kiện. Điều kiện năm của thời điểm bằng 2026 thường không so
      được với thống kê của cột thời điểm. Hãy viết dạng khoảng trực tiếp trên cột, thời điểm từ 1 tháng 1 năm 2026 tới
      trước 1 tháng 1 năm 2027.
  - show: ''
    say: Tạo hàng triệu tệp cực nhỏ thay vì gộp nhóm hàng đủ lớn biến thời gian mở tệp thành nút thắt chí mạng. Kích thước
      chuẩn vài trăm mê-ga-bai mỗi tệp cân đối hoàn hảo giữa độ song song đọc và chi phí liệt kê tệp. Gộp các tệp nhỏ hằng
      giờ thành khối vài trăm mê-ga-bai ngăn tắc nghẽn đọc hàng triệu đầu tệp li ti.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chia thư mục theo cột có quá nhiều giá trị <b class="red">(hàng triệu thư mục)</b>

      <br><span class="note"><b>Chia thư mục</b>: mỗi giá trị của cột có một thư mục riêng, ví dụ <code>ngay=2026-11-09/</code>,
      nên lọc theo cột đó thì bỏ qua cả thư mục. Chia theo ngày là hợp lý; chia theo mã khách tạo một thư mục cho mỗi khách,
      mỗi thư mục vài tệp nhỏ. Chia theo cột ít giá trị, còn cột nhiều giá trị thì <b>sắp</b> trong tệp.</span></div>

      '
    say: Lỗi thứ ba, chia thư mục theo cột có quá nhiều giá trị, tạo ra hàng triệu thư mục. Chia thư mục nghĩa là mỗi giá trị
      của cột có một thư mục riêng, nên lọc theo cột đó thì bỏ qua được cả thư mục. Chia theo ngày là hợp lý, nhưng chia
      theo mã khách tạo một thư mục cho mỗi khách, và mỗi thư mục chỉ vài tệp nhỏ.
  - show: ''
    say: Hãy chia thư mục theo cột ít giá trị, còn cột nhiều giá trị thì sắp xếp bên trong tệp. Quên đẩy điều kiện lọc xuống
      bước đọc định dạng khiến hệ thống tải hết dữ liệu lên RAM rồi mới vứt bỏ. Kích hoạt đầy đủ cơ chế đẩy lọc điều kiện
      xuống định dạng lưu trữ giải phóng phần lớn lưu lượng mạng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tin rằng dữ liệu “đã sắp theo ngày” vì ghi theo giờ đến <b
      class="red">(đơn đến muộn làm khoảng nhóm phình)</b></div>

      <p>Mô phỏng: mỗi nhóm 950 dòng đúng ngày, 50 dòng đến muộn từ 1 tới 30 ngày trước.</p>

      <table class="t"><tr><th>câu hỏi</th><th>sắp thật sự</th><th>có 5% đến muộn</th></tr>

      <tr><td>ngày 42</td><td>1 nhóm</td><td>30 nhóm</td></tr>

      <tr><td>ngày 10 tới 16</td><td>7 nhóm</td><td>37 nhóm</td></tr></table>

      <p class="note">Người có kinh nghiệm đo <b>số nhóm thật sự bị đọc</b> của câu hỏi chính sau mỗi lần nạp, và định kỳ
      sắp lại, gộp lại dữ liệu cũ.</p>

      '
    focus:
    - 1
    - 2
    - '3.2'
    - '3.3'
    - 4
    - 4
    - 4
    say: Lỗi thứ tư hay gặp ở người đã đi làm, tin rằng dữ liệu đã sắp theo ngày chỉ vì ghi theo giờ đến, trong khi đơn đến
      muộn làm khoảng ngày của nhóm phình ra. Mô phỏng mỗi nhóm có 950 dòng đúng ngày và 50 dòng đến muộn từ 1 tới 30 ngày
      trước. Câu hỏi ngày 42 khi đó phải đọc 30 nhóm thay vì 1. Câu hỏi một tuần, từ ngày 10 tới 16, phải đọc 37 nhóm thay
      vì 7. Vì vậy, người có kinh nghiệm đo số nhóm thật sự bị đọc của câu hỏi chính sau mỗi lần nạp, và định kỳ sắp lại,
      gộp lại dữ liệu cũ. Chọn thứ tự sắp xếp nén cột theo tần suất sử dụng câu truy vấn tối ưu cả dung lượng lẫn tốc độ đọc.
      Kết hợp sắp xếp nhóm hàng theo khoá lọc phổ biến phát huy tối đa hiệu quả loại trừ khối thừa.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.rowgroups_read([[d] * 1000 for d in range(100)], 10, 16) == 7 and (lambda r: alg.rowgroups_read([[r.randrange(100)
    for _ in range(1000)] for _ in range(100)], 10, 16))(__import__(''random'').Random(3)) == 100'
  - 16 - 10 + 1 == 7
  - '(lambda r: (lambda rows: [sum(1 for i in range(5) if min(x[i * 1000:(i + 1) * 1000]) <= 2 <= max(x[i * 1000:(i + 1) *
