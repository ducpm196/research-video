="#6b7280" stroke-width="2"/><text x="321" y="278" text-anchor="middle" font-size="19">2</text><rect x="354" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="383" y="278" text-anchor="middle" font-size="19">3</text><text x="529" y="232" text-anchor="middle" font-size="20">cột khách</text><rect x="438" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="467" y="278" text-anchor="middle" font-size="19">1</text><rect x="500" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="529" y="278" text-anchor="middle" font-size="19">2</text><rect x="562" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="591" y="278" text-anchor="middle" font-size="19">3</text><text x="737" y="232" text-anchor="middle" font-size="20">cột tỉnh</text><rect x="646" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="675" y="278" text-anchor="middle" font-size="19">1</text><rect x="708" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="737" y="278" text-anchor="middle" font-size="19">2</text><rect x="770" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="799" y="278" text-anchor="middle" font-size="19">3</text><text x="945" y="232" text-anchor="middle" font-size="20">cột ngày</text><rect x="854" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="883" y="278" text-anchor="middle" font-size="19">1</text><rect x="916" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="945" y="278" text-anchor="middle" font-size="19">2</text><rect x="978" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1007" y="278" text-anchor="middle" font-size="19">3</text><text x="1153" y="232" text-anchor="middle" font-size="20">cột tiền</text><rect x="1062" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1091" y="278" text-anchor="middle" font-size="19">1</text><rect x="1124" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1153" y="278" text-anchor="middle" font-size="19">2</text><rect x="1186" y="245" width="58" height="52" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1215" y="278" text-anchor="middle" font-size="19">3</text><text x="1361" y="232" text-anchor="middle" font-size="20">cột ghi chú</text><rect x="1270" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1299" y="278" text-anchor="middle" font-size="19">1</text><rect x="1332" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1361" y="278" text-anchor="middle" font-size="19">2</text><rect x="1394" y="245" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1423" y="278" text-anchor="middle" font-size="19">3</text><line x1="646" y1="315" x2="1244" y2="315" stroke="#059669" stroke-width="5"/><text x="945" y="348" text-anchor="middle" font-size="22" fill="#059669">chỉ đọc 9 ô</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một bảng nhỏ 3 dòng, 6 cột, xếp lên đĩa theo hai cách. Theo hàng, 6 ô của đơn thứ nhất nằm liền nhau, rồi tới đơn thứ hai, đơn thứ ba, nên muốn lấy cột tỉnh, ngày, tiền thì vẫn phải đọc cả 18 ô. Theo cột, 3 giá trị của cột tỉnh nằm liền nhau, cột ngày nằm liền nhau, nên câu hỏi chỉ cần 3 cột thì chỉ đọc 9 ô màu lục. Ngược lại, muốn lấy trọn đơn thứ hai thì cách xếp theo hàng chỉ cần một đoạn, còn cách theo cột phải nhặt ở 6 chỗ."

  - id: example
    kind: example
    title: "Đếm byte phải đọc"
    checks:
      - "alg.scan_bytes(100e6, 50, 8) / 1e9 == 40 and round(alg.scan_bytes(100e6, 50, 8, 'col', 3) / 1e9, 1) == 2.4 and round(50 / 3, 1) == 16.7"
    steps:
      - show: |
          <p><b>Bước 1</b> — bảng đơn hàng 100 triệu dòng × 50 cột × 8 byte (số minh hoạ). Câu hỏi “tổng tiền theo tỉnh trong tháng” dùng <b>3 cột</b>: tỉnh, ngày, tiền.</p>
        say: "Bước một, đặt đề bài. Bảng đơn hàng có 100 triệu dòng, 50 cột, mỗi ô 8 byte, một số minh hoạ. Câu hỏi tổng tiền theo tỉnh trong tháng chỉ dùng 3 cột là tỉnh, ngày và tiền."
      - show: |
          <table class="t"><tr><th>cách lưu</th><th>phải đọc</th></tr>
          <tr><td><b>Bước 2</b> — theo hàng: đọc cả dòng</td><td>$10^8 \cdot 50 \cdot 8 = 4 \cdot 10^{10}$ byte $= 40$ GB</td></tr></table>
        say: "Bước hai, lưu theo hàng. Lưu theo hàng phải đọc cả dòng, 10 mũ 8 nhân 50 nhân 8, bằng 40 GB."
      - show: |
          <table class="t"><tr><th>cách lưu</th><th>phải đọc</th></tr>
          <tr><td><b>Bước 3</b> — theo cột: chỉ 3 cột</td><td>$10^8 \cdot 3 \cdot 8 = 2{,}4 \cdot 10^{9}$ byte $= \hl{2{,}4}$ GB</td></tr></table>
        say: "Bước ba, lưu theo cột. Lưu theo cột chỉ đọc 3 cột, bằng 2 phẩy 4 GB."
      - show: |
          <p><b>Bước 4</b> — so hai cách: $\frac{40}{2{,}4} = \frac{50}{3} \approx 16{,}7$ lần — trước cả khi nén.</p>
          <div class="box key">Tỉ lệ chỉ phụ thuộc <b>số cột của bảng chia số cột câu hỏi dùng</b>, không phụ thuộc số dòng.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, so hai cách. 40 chia 2 phẩy 4 bằng 50 chia 3, nên ít hơn khoảng 16 phẩy 7 lần, trước cả khi nén. Tỉ lệ này chỉ phụ thuộc số cột của bảng chia số cột câu hỏi dùng, không phụ thuộc số dòng."

  - id: check
    kind: check
    title: "Tự kiểm: tính cho một dòng rồi nhân lên"
    checks:
      - "50 * 8 == 400 and 3 * 8 == 24 and round(400 / 24, 1) == 16.7 and round(24 * 1e8 / 1e9, 1) == 2.4 and 400 * 1e8 / 1e9 == 40"
      - "round(40 * 3 / 50, 1) == 2.4"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>một dòng, theo hàng</td><td>$50 \cdot 8 = 400$ byte; $400 \cdot 10^8$ byte</td><td>40 GB ✓</td></tr>
          <tr><td>một dòng, theo cột</td><td>$3 \cdot 8 = 24$ byte; $24 \cdot 10^8$ byte</td><td>2,4 GB ✓</td></tr>
          <tr><td>tỉ lệ cho một dòng</td><td>$\frac{400}{24}$</td><td>$\approx 16{,}7$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, tính cho một dòng rồi mới nhân lên. Một dòng lưu theo hàng là 50 nhân 8, bằng 400 byte, nhân 10 mũ 8 dòng được 40 GB, khớp. Phần của một dòng mà cách lưu theo cột phải đọc là 3 nhân 8, bằng 24 byte, nhân 10 mũ 8 được 2 phẩy 4 GB, cũng khớp. Tỉ lệ cho một dòng, 400 chia 24, vẫn xấp xỉ 16 phẩy 7, đúng như ta nói tỉ lệ không phụ thuộc số dòng."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "[alg.scan_bytes(1e8, 50, 8, 'col', c) / 1e9 for c in (3, 10, 25, 50)] == [2.4, 8.0, 20.0, 40.0]"
      - "[round(50 / c, 1) for c in (3, 10, 25, 50)] == [16.7, 5.0, 2.0, 1.0]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chạy báo cáo nặng trên cơ sở dữ liệu giao dịch <b class="red">(ứng dụng chậm theo)</b>
          <br><span class="note">Một câu quét 40 GB chiếm đĩa và bộ nhớ đệm của mọi giao dịch khác. Tách: chép dữ liệu sang một kho phân tích riêng, chạy báo cáo ở đó.</span></div>
        say: "Lỗi thứ nhất, chạy báo cáo nặng trên cơ sở dữ liệu giao dịch, nên ứng dụng chậm theo. Một câu quét 40 GB chiếm đĩa và bộ nhớ đệm của mọi giao dịch khác. Hãy tách ra, chép dữ liệu sang một kho phân tích riêng, rồi chạy báo cáo ở đó."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ghi từng dòng lẻ vào kho lưu theo cột <b class="red">(chậm, phân mảnh)</b>
          <br><span class="note">Một dòng mới phải chạm 50 vùng cột khác nhau. Kho cột hợp nạp <b>theo lô lớn</b>; ghi lẻ thì giữ ở kho theo hàng.</span></div>
        say: "Lỗi thứ hai, ghi từng dòng lẻ vào kho lưu theo cột, nên chậm và phân mảnh. Một dòng mới phải chạm 50 vùng cột khác nhau. Kho cột hợp nạp theo lô lớn, còn ghi lẻ thì giữ ở kho theo hàng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn “SELECT *” trong câu hỏi phân tích <b class="red">(mất lợi thế cột)</b>
          <br><span class="note">Lấy mọi cột thì kho cột cũng phải đọc 40 GB. Chỉ chọn đúng cột cần.</span></div>
        say: "Lỗi thứ ba, lấy mọi cột trong câu hỏi phân tích, nên mất lợi thế của lưu theo cột. Lấy mọi cột thì kho cột cũng phải đọc 40 GB, nên chỉ chọn đúng các cột cần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Thử một câu hỏi, thấy nhanh gấp 16,7, rồi hứa cả hệ sẽ nhanh gấp 16,7 <b class="red">(lợi thế tuỳ số cột)</b></div>
          <table class="t"><tr><th>câu hỏi dùng</th><th>kho cột đọc</th><th>ít hơn theo hàng</th></tr>
          <tr><td>3 cột</td><td>2,4 GB</td><td>16,7 lần</td></tr>
          <tr><td>10 cột</td><td>8 GB</td><td>5 lần</td></tr>
          <tr><td>25 cột</td><td>20 GB</td><td>2 lần</td></tr>
          <tr><td>50 cột</td><td>40 GB</td><td>1 lần — không lợi gì</td></tr></table>
          <p class="note">Người có kinh nghiệm lấy <b>danh sách câu hỏi thật</b>, đếm số cột mỗi câu dùng, rồi mới ước lượng lợi ích.</p>
        focus: [1, 2, "2.2", "2.3", "2.5", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, thử một câu hỏi, thấy nhanh gấp 16 phẩy 7, rồi hứa cả hệ thống sẽ nhanh gấp 16 phẩy 7. Bảng tính lại cho cùng bảng 40 GB, chỉ đổi số cột câu hỏi dùng. Câu dùng 3 cột thì kho cột đọc 2 phẩy 4 GB, ít hơn 16 phẩy 7 lần. Câu dùng 10 cột thì đọc 8 GB, chỉ còn ít hơn 5 lần, và câu dùng 25 cột thì chỉ ít hơn 2 lần. Câu dùng cả 50 cột thì hai cách đọc như nhau. Vì vậy, người có kinh nghiệm lấy danh sách câu hỏi thật, đếm số cột mỗi câu dùng, rồi mới ước lượng lợi ích."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.scan_bytes(1e9, 20, 4) / 1e9 == 80 and alg.scan_bytes(1e9, 20, 4, 'col', 2) / 1e9 == 8"
      - "20 / 2 == 10 and 1e9 * 20 * 4 == 8e10"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bảng 1 tỉ dòng × 20 cột × 4 byte. Câu hỏi dùng 2 cột. Lưu theo hàng và theo cột phải đọc bao nhiêu GB?</td></tr>
          <tr><td>2</td><td>Ứng dụng cập nhật trạng thái một đơn hàng mỗi lần khách bấm nút. Cách lưu nào hợp?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bảng 1 tỉ dòng, 20 cột, mỗi ô 4 byte. Câu hỏi dùng 2 cột, lưu theo hàng và theo cột phải đọc bao nhiêu GB? Câu hai, ứng dụng cập nhật trạng thái một đơn hàng mỗi lần khách bấm nút. Cách lưu nào hợp? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Theo hàng: $10^9 \cdot 20 \cdot 4 = 8 \cdot 10^{10}$ byte $= 80$ GB.</p>
          <p>Theo cột: $10^9 \cdot 2 \cdot 4 = 8 \cdot 10^{9}$ byte $= \hl{8}$ GB — ít hơn $\frac{20}{2} = 10$ lần.</p>
        focus: [1, 2]
        say: "Đáp án câu một, theo hàng là 10 mũ 9 nhân 20 nhân 4, bằng 80 GB. Theo cột là 10 mũ 9 nhân 2 nhân 4, bằng 8 GB, ít hơn 20 chia 2, tức 10 lần."
      - show: |
          <table class="t"><tr><th>câu 2: mỗi lần bấm nút</th><th>theo hàng</th><th>theo cột</th></tr>
          <tr><td>chạm bao nhiêu dòng?</td><td colspan="2">một dòng — đúng tải giao dịch</td></tr>
          <tr><td>ghi một dòng mới hay sửa một dòng</td><td>một đoạn liền nhau</td><td>chạm mọi vùng cột</td></tr></table>
          <p>② Chọn <b>theo hàng</b>.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, xét từng bước. Mỗi lần khách bấm nút, ứng dụng chỉ chạm một dòng, đúng là tải giao dịch. Ghi hay sửa một dòng ở cách lưu theo hàng chỉ chạm một đoạn liền nhau, còn ở cách lưu theo cột phải chạm mọi vùng cột. Vậy chọn lưu theo hàng, vì mỗi lần chạm một dòng với mọi cột và ghi lẻ liên tục."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">giao dịch: vài dòng, mọi cột</span><span class="a">→</span>
          <span class="n">phân tích: nhiều dòng, vài cột</span><span class="a">→</span>
          <span class="n">byte phải đọc = số dòng nhân số cột dùng nhân kích thước ô</span><span class="a">→</span>
          <span class="n">tách hai hệ, chọn cách lưu theo tải</span></div>
        say: "Tổng kết lại, giao dịch chạm vài dòng với mọi cột, còn phân tích chạm nhiều dòng với vài cột. Số byte phải đọc bằng số dòng nhân số cột dùng nhân kích thước, nên hãy tách hai hệ và chọn cách lưu theo tải."
      - show: |
          <div class="box key"><b>Tư duy:</b> cấu trúc lưu trữ không có “tốt nhất” — chỉ có <b>hợp với câu hỏi</b> mà nó phải trả lời nhiều nhất.</div>
        say: "Điều cần mang theo, cấu trúc lưu trữ không có loại tốt nhất, chỉ có loại hợp với câu hỏi mà nó phải trả lời nhiều nhất."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>cây gộp theo nhật ký</b> — cấu trúc biến ghi ngẫu nhiên thành ghi tuần tự.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cây gộp theo nhật ký, cấu trúc biến ghi ngẫu nhiên thành ghi tuần tự. Hẹn gặp bạn ở bài tiếp theo."
