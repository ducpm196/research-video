id: L00
course: DEN
series: "DEN · Kỹ thuật dữ liệu"
title: "Bài 0 — Hệ thống giao dịch và hệ thống phân tích: hàng và cột"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/den.yaml L00; audit/den/verify_den.py L00; M. Kleppmann, Designing Data-Intensive Applications (2017), chương 3 (lưu trữ theo cột); D. Abadi và cộng sự, The Design and Implementation of Modern Column-Oriented Database Systems (2013)"
assumes: [arith, cdot, power]
# Quy ước: GB = 10^9 byte. Bỏ qua nén và siêu dữ liệu để thấy ý chính (alg.scan_bytes). Tên OLTP / OLAP chỉ trên màn hình;
#   lời đọc “tải giao dịch”, “tải phân tích”. Bảng 100 triệu dòng × 50 cột × 8 byte là SỐ MINH HOẠ.
objectives:
  - "Phân biệt tải giao dịch và tải phân tích"
  - "Ước lượng lượng dữ liệu phải đọc theo cách lưu"
  - "Biết khi nào lưu theo hàng tốt hơn"
