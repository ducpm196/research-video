scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một bảng, một câu hỏi chạy 1 giây, câu kia chạy 20 phút"
    checks:
      - "alg.scan_bytes(100e6, 50, 8) / 1e9 == 40 and round(alg.scan_bytes(100e6, 50, 8, 'col', 3) / 1e9, 1) == 2.4"
    steps:
      - show: |
          <p>Ứng dụng bán hàng mở đơn của một khách gần như tức thì. Cuối tháng, phòng kế toán hỏi “tổng doanh thu theo tỉnh” trên cùng bảng đó — và câu hỏi chạy 20 phút, làm chậm cả ứng dụng. Cùng dữ liệu, hai kiểu câu hỏi rất khác nhau.</p>
          <div class="box key">Hôm nay: <b>tải giao dịch</b> (OLTP) và <b>tải phân tích</b> (OLAP) — và vì sao cách <b>xếp byte trên đĩa</b> quyết định tốc độ.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, ứng dụng bán hàng mở đơn của một khách gần như tức thì. Cuối tháng, phòng kế toán hỏi tổng doanh thu theo tỉnh trên cùng bảng đó, và câu hỏi chạy 20 phút, làm chậm cả ứng dụng. Cùng dữ liệu, nhưng hai kiểu câu hỏi rất khác nhau. Hôm nay ta học tải giao dịch và tải phân tích, và vì sao cách xếp byte trên đĩa quyết định tốc độ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: byte, GB, đếm ô, trang đĩa"
    checks:
      - "1000 * 5 * 8 == 40000 and 10 ** 9 == 1000000000 and 8e8 / 1e9 == 0.8"
      - "4096 // 8 == 512 and 4096 - 8 == 4088"
    steps:
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>bằng</th><th>ví dụ</th></tr>
          <tr><td>1 ô số nguyên lớn</td><td>8 byte</td><td>một con số tiền, một mã đơn</td></tr>
          <tr><td>1 GB</td><td>$10^9$ byte (một tỉ byte)</td><td>$8 \cdot 10^8$ byte $= 0{,}8$ GB</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Ta ôn lại hai đơn vị đo. Trong bài này, mỗi ô chứa một con số như số tiền hay mã đơn chiếm 8 byte. Một GB là 10 mũ 9 byte, tức một tỉ byte, nên 8 nhân 10 mũ 8 byte bằng 0 phẩy 8 GB."
      - show: |
          <p><b>Một bảng</b> có số ô $=$ số dòng $\cdot$ số cột. Số byte $=$ số ô $\cdot$ byte mỗi ô.</p>
          <p>Ví dụ: 1000 dòng, 5 cột, 8 byte mỗi ô → $1000 \cdot 5 \cdot 8 = 40\,000$ byte.</p>
        focus: [1, 2]
        say: "Một bảng có số ô bằng số dòng nhân số cột, và số byte bằng số ô nhân số byte mỗi ô. Ví dụ bảng 1000 dòng, 5 cột, 8 byte mỗi ô thì có 1000 nhân 5 nhân 8, bằng 40 nghìn byte."
      - show: |
          <div class="box key">Trước hết, ta cần hiểu đĩa đọc thế nào: đĩa không đọc từng ô lẻ mà đọc theo <b>từng đoạn liền nhau</b>, gọi là <b>trang</b>, ví dụ mỗi trang 4096 byte. Muốn lấy một ô 8 byte thì cả trang chứa nó được đọc lên.</div>
          <p>Một trang 4096 byte chứa $4096 / 8 = 512$ ô. Nếu 512 ô đó đều là thứ ta cần thì một lần đọc được 512 ô có ích; nếu chỉ 1 ô có ích thì 4088 byte còn lại đọc phí. Vì vậy <b>cái gì nằm cạnh nhau</b> trên đĩa quyết định ta phải đọc bao nhiêu.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Trước hết, ta cần hiểu đĩa đọc thế nào. Đĩa không đọc từng ô lẻ, mà đọc theo từng đoạn liền nhau gọi là trang, ví dụ mỗi trang 4096 byte, nên muốn lấy một ô 8 byte thì cả trang chứa nó được đọc lên. Một trang 4096 byte chứa 4096 chia 8, bằng 512 ô. Nếu cả 512 ô đều là thứ ta cần thì một lần đọc được 512 ô có ích, còn nếu chỉ 1 ô có ích thì 4088 byte còn lại bị đọc phí. Vì vậy, cái gì nằm cạnh nhau trên đĩa quyết định ta phải đọc bao nhiêu."

  - id: sym
    kind: symbol
    title: "Giải mã: hai kiểu tải, hai cách xếp"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>tải giao dịch (OLTP)</th><th>tải phân tích (OLAP)</th></tr>
          <tr><td>mỗi câu hỏi chạm</td><td>vài dòng, mọi cột</td><td>hàng triệu dòng, vài cột</td></tr>
          <tr><td>thao tác chính</td><td>đọc / ghi theo khoá</td><td>quét, cộng dồn, nhóm</td></tr>
          <tr><td>cách lưu hợp</td><td><b>theo hàng</b>: các cột của một dòng nằm cạnh nhau</td><td><b>theo cột</b>: các giá trị của một cột nằm cạnh nhau</td></tr></table>
          <p>Lưu theo cột còn <b>nén tốt</b> hơn: các giá trị cùng cột giống nhau (cùng tỉnh, cùng ngày) nằm liền nhau.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng so hai kiểu tải. Mỗi câu hỏi giao dịch chạm vài dòng nhưng mọi cột, còn câu hỏi phân tích chạm hàng triệu dòng nhưng chỉ vài cột. Thao tác chính của giao dịch là đọc và ghi theo khoá, của phân tích là quét, cộng dồn và nhóm. Cách lưu hợp với giao dịch là theo hàng, các cột của một dòng nằm cạnh nhau, còn phân tích hợp lưu theo cột, các giá trị của một cột nằm cạnh nhau. Lưu theo cột còn nén tốt hơn, vì các giá trị cùng cột giống nhau như cùng tỉnh, cùng ngày nằm liền nhau."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cùng 18 ô, hai cách xếp trên đĩa"
    checks:
      - "alg.scan_bytes(3, 6, 1) == 18 and alg.scan_bytes(3, 6, 1, 'col', 3) == 9"
    steps:
      - show: |
          <div><svg width="1500" height="365" viewBox="0 0 1500 365"><g fill="#1f2937"><text x="20" y="108" font-size="22" font-weight="bold">theo hàng</text><text x="20" y="278" font-size="22" font-weight="bold">theo cột</text><text x="416" y="62" text-anchor="middle" font-size="20">đơn 1</text><rect x="230" y="75" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="259" y="108" text-anchor="middle" font-size="19">id</text><rect x="292" y="75" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="321" y="108" text-anchor="middle" font-size="19">khách</text><rect x="354" y="75" width="58" height="52" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="383" y="108" text-anchor="middle" font-size="19">tỉnh</text><rect x="416" y="75" width="58" height="52" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="445" y="108" text-anchor="middle" font-size="19">ngày</text><rect x="478" y="75" width="58" height="52" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="507" y="108" text-anchor="middle" font-size="19">tiền</text><rect x="540" y="75" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="569" y="108" text-anchor="middle" font-size="17">ghi chú</text><text x="810" y="62" text-anchor="middle" font-size="20">đơn 2</text><rect x="624" y="75" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="653" y="108" text-anchor="middle" font-size="19">id</text><rect x="686" y="75" width="58" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="715" y="108" text-anchor="middle" font-size="19">khách</text><rect x="748" y="75" width="58" height="52" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="777" y="108" text-anchor="middle" font-size="19">tỉnh</text><rect x="810" y="75" width="58" height="52" rx="5" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><t