id: L02
course: DEN
series: "DEN · Kỹ thuật dữ liệu"
title: "Bài 2 — Cây B và cây gộp theo nhật ký: khuếch đại ghi, đọc và không gian"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/den.yaml L02; audit/den/verify_den.py L02; M. Kleppmann, Designing Data-Intensive Applications (2017), chương 3; M. Athanassoulis và cộng sự, Designing Access Methods: The RUM Conjecture (EDBT 2016); bài 1"
assumes: [arith, frac, power, cdot]
# Quy ước: khuếch đại ghi = số byte thật sự ghi xuống đĩa / số byte ứng dụng muốn ghi. Cây B ghi lại cả trang (chưa kể nhật ký ghi trước).
#   Cây gộp theo nhật ký: mô hình gộp theo bậc kích thước, mỗi bậc gộp `fanout` tệp (alg.tiered_compaction_wa) — mô hình đơn giản hoá, SỐ MINH HOẠ.
#   Độ sâu cây B: alg.btree_depth.
objectives:
  - "Định nghĩa ba loại khuếch đại"
  - "Tính khuếch đại ghi của cây B và của gộp theo bậc"
  - "Chọn cấu trúc theo tỉ lệ đọc–ghi"
asr_reviewed:
  - {sentence: "Bước ba, đếm số bậc của gộp theo bậc.", reason: "ASR chép “Bước 3. Đếm số bật của gột theo bật” (0.667): lệch âm/thanh thuần Việt: bậc/bật, gộp/gột, bậc/bật — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ổ thể rắn có giới hạn tổng số byte ghi trong đời.", reason: "ASR chép “Ủa thể trắng có giới hạn tổng số ba ghi trong đời.” (0.75): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ổ/ủa, rắn/trắng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình bên phải là gộp theo bậc, mỗi lần xả tạo một tệp nhỏ ở bậc 0.", reason: "ASR chép “Hình bên phải là gột theo bật, mỗi lần xả tạo một tẹp nhỏ ở bật không?” (0.765): lệch âm/thanh thuần Việt: gộp/gột, bậc/bật, tệp/tẹp, bậc/bật — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước hai, tính khuếch đại đọc của cây B.", reason: "ASR chép “Bước 2. Tính khuết đại độc của cây B.” (0.778): lệch âm/thanh thuần Việt: khuếch/khuết, đọc/độc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước bốn, cộng các lần ghi của một byte.", reason: "ASR chép “Bước 4. Cộng cắt lần ghi của một bay.” (0.778): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: các/cắt — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì vậy người có kinh nghiệm đo số byte đĩa thật sự ghi, rồi chia cho số byte ứng dụng ghi để ra khuếch đại của chính hệ mình.", reason: "ASR chép “Vì vậy người có kinh nghiệm đo số bay để thật sự ghi, rồi chia cho số bay ứng dụng ghi để ra khuết đại của chính hệ minh.” (0.828): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: đĩa (trong “byte đĩa” → “bay để”), khuếch/khuết, mình/minh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mỗi lần lên bậc, cùng một byte bị ghi lại, nhưng luôn là ghi tuần tự những đoạn dài.", reason: "ASR chép “Mỗi lần Linh Bật cùng một bai bị ghi lại nhưng luôn là ghi tuần tự những đoạn dài.” (0.842): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: lên bậc/linh bật — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ tư hay gặp ở người đã đi làm, lập kế hoạch đĩa theo số byte ứng dụng ghi, quên nhân khuếch đại ghi.", reason: "ASR chép “Lỗi thứ 4 hay gặp ở người đã đi làm, lập kế hoạch để theo số bay ứng dụng ghi, quên nhân khuết đại ghi.” (0.88): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: đĩa/để, khuếch/khuết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với cây B, mỗi lần sửa một bản ghi 100 byte, đĩa thật sự ghi 50 nhân 40 phẩy 96, bằng 2048 GB mỗi ngày, trung bình khoảng 23 phẩy 7 MB mỗi giây.", reason: "ASR chép “Với KB, mỗi lần xử một bản ghi 100B, để thực sự ghi 50 nhân 40,96 bằng 2.048 GB mỗi ngày, trung bình khoảng 23,7 MB mỗi giây.” (0.882): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: cây (trong “cây b” → “kb”), sửa/xử, đĩa thật (trong “byte đĩa thật” → “b để thực”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, khuếch đại ghi bằng byte ghi xuống đĩa chia byte muốn ghi, tức 16384 chia 128, bằng 128 lần.", reason: "ASR chép “Đáp án câu 1, khuết đại ghi bằng bay ghi xuống để chia bay muốn ghi, tức 16384 chia 128, bằng 128 lần.” (0.895): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: khuếch/khuết, đĩa/để — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chỉ 100 byte màu cam đổi, nhưng cả trang 4096 byte được ghi lại, vào một chỗ nằm rải rác trên đĩa.", reason: "ASR chép “Chỉ 100 bay màu cam đổi, nhưng cả trang 4.096 bay được ghi lại vào một chỗ nằm rại rác trên đĩa.” (0.897): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: rải/rại — NOT_VERIFIED bằng tai người"}
  - {sentence: "Giả sử ứng dụng ghi 50 GB mỗi ngày, một số minh hoạ.", reason: "ASR chép “Giả sử ứng dụng ghi 50GB mỗi ngày, một số minh họa.” (1.0): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte” — NOT_VERIFIED bằng tai người"}
