  - {sentence: "Khuếch đại ghi là số byte ghi xuống đĩa chia số byte muốn ghi.", reason: "ASR chép “Quét đại ghi là số bài ghi xuống địa chia số bài muốn ghi.” (0.714): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: khuếch/quét, đĩa/địa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với gộp theo bậc, mỗi bậc gộp 4 tệp, 256 lần xả tạo 4 bậc.", reason: "ASR chép “Với gột theo bật, mỗi bật gột 4 tệp, 256 lần xả tạo 4 bật.” (0.737): lệch âm/thanh thuần Việt: gộp/gột, bậc/bật, bậc gộp/bật gột, bậc/bật — NOT_VERIFIED bằng tai người"}
  - {sentence: "Gộp nhiều bậc vẫn ghi lại mỗi byte nhiều lần.", reason: "ASR chép “Gục nhiều bậc vẫn ghi lại mỗi bai nhiều lần.” (0.8): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: gộp/gục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mô hình gộp ở đây đơn giản hoá, mỗi byte bị ghi lại một lần ở mỗi bậc.", reason: "ASR chép “Mua hình gột ở đây đơn giản hóa, mỗi bay bị ghi lại một lần ở mỗi bậc.” (0.833): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mô/mua, gộp/gột — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cây B sửa 100 byte trong trang 4096 byte, nên khuếch đại ghi bằng 4096 chia 100, tức 40 phẩy 96, chưa kể nhật ký.", reason: "ASR chép “KB xử 100 bài trong trang 4.096 bài, nền khuết đại ghi bằng 4.096 chia 100, tức 40,96, chưa kể nhật ký.” (0.843): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: cây sửa (trong “cây b sửa” → “kb xử”), nên khuếch (trong “byte nên khuếch” → “bài nền khuết”) — NOT_VERIFIED bằng tai người"}
