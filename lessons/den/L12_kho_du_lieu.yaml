    - 1
    - 2
    - 2
    say: Điều cần mang theo, một báo cáo đáng tin phải cho cùng con số mỗi lần in lại, vì sự thật của quá khứ không được phụ thuộc vào hiện tại. Xét hai mức quy mô, bảng 4 dòng cho thấy nối sai mã làm doanh thu tăng gấp đôi. Trong kho dữ liệu nhiều năm, chuẩn loại 2 giúp mỗi báo cáo lịch sử giữ nguyên đúng sự thật quá khứ.
