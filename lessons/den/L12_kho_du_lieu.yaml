    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (3 dòng)</b></p><div class="code"><div>scd_rows=2</div><div>city_mar20=HCM</div><div>city_may01=HN</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>lambda x: ...</code></td><td>Hàm viết gọn một dòng (nhận đầu vào <code>x</code>, trả ngay kết quả sau dấu <code>:</code>)</td></tr><tr><td><code>[a, b, ...]</code></td><td>Danh sách nhiều phần tử theo thứ tự (lấy phần tử thứ <code>i</code> bằng <code>ds[i]</code>, đếm từ <code>0</code>)</td></tr><tr><td><code>(a, b) / tuple(...)</code></td><td>Bộ giá trị cố định đóng gói theo thứ tự (không thay đổi sau khi tạo)</td></tr><tr><td><code>ds[i]</code></td><td>Lấy phần tử ở vị trí <code>i</code> (đếm từ <code>0</code>)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr></table>'
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>f&quot;...{ten_bien}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr><tr><td><code>sqlite3 / .connect(':memory:')</code></td><td>Mở cơ sở dữ liệu SQLite tạm chạy trên bộ nhớ (RAM)</td></tr><tr><td><code>CREATE TABLE / INSERT INTO / SELECT / BETWEEN</code></td><td>Câu lệnh SQL tạo bảng, chèn dòng, truy vấn và lọc giá trị nằm trong khoảng ngày</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: '<p><b>Lời giải tham khảo DEN:L12 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>import sqlite3</div><div>c = sqlite3.connect('':memory:'')</div><div>c.execute(''CREATE TABLE scd(city TEXT, f TEXT, t TEXT)'')</div><div>rows = [(''HCM'',''2026-01-01'',''2026-04-14''),(''HN'',''2026-04-15'',''9999-12-31'')]</div><div>c.executemany(''INSERT INTO scd VALUES(?,?,?)'', rows)</div><div>sql = ''SELECT city FROM scd WHERE ? BETWEEN f AND t''</div><div>q = lambda d: c.execute(sql, (d,)).fetchone()[0]</div><div>n_r = c.execute(''SELECT COUNT(*) FROM scd'').fetchone()[0]</div><div>print(f''scd_rows={n_r}'')</div><div>print(f''city_mar20={q("2026-03-20")}'')</div><div>print(f''city_may01={q("2026-05-01")}'')</div></div>'
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">bảng sự kiện ở giữa, bảng chiều xung quanh</span><span class="a">→</span>
      <span class="n">chọn độ mịn đủ chi tiết cần hỏi</span><span class="a">→</span>
      <span class="n">loại 2: thêm dòng, khoảng hiệu lực</span><span class="a">→</span>
      <span class="n">nối theo dòng chiều đúng thời điểm</span></div>
    say: Tổng kết lại, bảng sự kiện ở giữa, bảng chiều xung quanh, và chọn độ mịn đủ chi tiết cần hỏi. Chiều thay đổi chậm loại 2 thêm dòng với khoảng hiệu lực, và nối theo dòng chiều đúng thời điểm.
  - show: |
      <div class="box key"><b>Tư duy:</b> một báo cáo đáng tin phải cho <b>cùng con số</b> mỗi lần in lại — sự thật của quá khứ không được phụ thuộc vào hiện tại.</div>
      <p class="note"><b>Hai mức quy mô:</b> kho nhỏ 4 dòng ghép lịch sử giá trị đúng 200 thay vì 600 do nối nhầm; ở kho doanh nghiệp nhiều năm, giữ chuẩn chiều thay đổi chậm loại 2 bảo đảm báo cáo cũ luôn khớp số lịch sử.</p>
