- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/DEN/L12
  steps:
  - show: <table class='t'><tr><th>Thực hành DEN:L12</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/DEN/L12/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Bảng chiều thay đổi chậm (SCD Loại 2) truy vấn lịch sử ở hai mốc thời gian</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>scd_rows=...<br/>city_mar20=...<br/>city_may01=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh DEN L12 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
