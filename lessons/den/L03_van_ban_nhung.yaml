scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một đơn hàng: một lần đọc hay năm phép nối?"
    steps:
      - show: |
          <p>Trang chi tiết đơn hàng cần: đơn, khách, địa chỉ giao, các dòng hàng, trạng thái giao. Trong cơ sở dữ liệu quan hệ đó là năm bảng và bốn phép nối. Trong cơ sở dữ liệu văn bản, có thể là <b>một văn bản</b> đọc một lần. Nghe tuyệt — cho đến khi khách đổi địa chỉ, hay đơn có 100 nghìn dòng.</p>
          <div class="box key">Hôm nay: <b>nhúng</b> hay <b>tham chiếu</b> — quyết định theo cách dữ liệu được đọc và được sửa.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, trang chi tiết đơn hàng cần đơn, khách, địa chỉ giao, các dòng hàng và trạng thái giao. Trong cơ sở dữ liệu quan hệ, đó là năm bảng và bốn phép nối. Trong cơ sở dữ liệu văn bản, có thể chỉ là một văn bản đọc một lần. Nghe thật tuyệt, cho đến khi khách đổi địa chỉ, hay một đơn có 100 nghìn dòng. Hôm nay ta học nên nhúng hay tham chiếu, quyết định theo cách dữ liệu được đọc và được sửa."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: lũy thừa của 2, chia làm tròn xuống, chuẩn hoá"
    checks:
      - "2 ** 10 == 1024 and 2 ** 20 == 1048576 and 16 * 2 ** 20 == 16777216 and 17 // 5 == 3"
      - "(lambda kh, don: [kh[k] for _, k in don])({7: 'An'}, [(1042, 7), (1043, 7), (1044, 7)]) == ['An'] * 3"
    steps:
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>bằng</th><th>số byte</th></tr>
          <tr><td>1 KiB</td><td>$2^{10}$ byte</td><td>1024</td></tr>
          <tr><td>1 MiB</td><td>$2^{20}$ byte</td><td>1 048 576</td></tr>
          <tr><td>16 MiB</td><td>$16 \cdot 2^{20}$ byte</td><td>16 777 216</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bài này đo dung lượng bằng lũy thừa của 2. Đơn vị nhỏ nhất trong bảng bằng 2 mũ 10, tức 1024 byte. 1 MiB là 2 mũ 20, tức 1048576 byte. Vậy 16 MiB là 16 nhân 2 mũ 20, bằng 16777216 byte."
      - show: |
          <p><b>Làm tròn xuống</b> $\lfloor x \rfloor$: số nguyên lớn nhất không vượt $x$. Ví dụ hộp chứa 17 kg, mỗi món 5 kg: $\lfloor 17 / 5 \rfloor = \lfloor 3{,}4 \rfloor = 3$ món — món thứ tư không vừa.</p>
        introduces: [floor]
        say: "Ký hiệu hai móc vuông ở chân đọc là phần nguyên, tức làm tròn xuống, lấy số nguyên lớn nhất không vượt x. Ví dụ hộp chứa 17 cân, mỗi món 5 cân, thì 17 chia 5 bằng 3 phẩy 4, làm tròn xuống được 3 món, vì món thứ tư không vừa."
      - clear: true
        show: |
          <p><b>Cơ sở dữ liệu quan hệ</b> cất dữ liệu thành các <b>bảng</b> có dòng và cột; mỗi dòng có một <b>mã</b> riêng để chỉ tới nó.</p>
          <table class="t"><tr><th>ý</th><th>ví dụ</th></tr>
          <tr><td><b>chuẩn hoá</b>: mỗi sự thật lưu ở <b>một</b> chỗ</td><td>tên “An” chỉ nằm ở bảng khách, dòng có mã 7</td></tr>
          <tr><td><b>phép nối</b>: ghép bảng qua mã</td><td>đơn 1042 giữ mã khách 7 → nối sang bảng khách lấy tên</td></tr>
          <tr><td>vì sao chuẩn hoá</td><td>An có 3 đơn: đổi tên chỉ sửa <b>1</b> dòng khách, cả 3 đơn tự thấy tên mới</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Trước hết, ta cần hiểu cách cơ sở dữ liệu quan hệ cất dữ liệu. Nó xếp dữ liệu thành các bảng có dòng và cột, mỗi dòng có một mã riêng để chỉ tới nó. Chuẩn hoá nghĩa là mỗi sự thật lưu ở một chỗ, ví dụ tên An chỉ nằm ở bảng khách, cạnh mã khách 7. Phép nối ghép các bảng qua mã, ví dụ đơn 1042 chỉ giữ mã khách 7, rồi nối sang bảng khách để lấy tên. Nhờ vậy, khi An có 3 đơn mà đổi tên, ta chỉ sửa 1 dòng khách, và cả 3 đơn tự thấy tên mới."

  - id: sym
    kind: symbol
    title: "Giải mã: nhúng, tham chiếu, phi chuẩn hoá"
    steps:
      - show: |
          <div class="code"><div>{ "ma_don": 1042,</div><div>  "khach": { "ma": 7, "ten": "An" },          // nhúng một bản sao tên</div><div>  "dong": [ {"sp": 3, "sl": 2}, {"sp": 9, "sl": 1} ],   // nhúng</div><div>  "ma_kho": 55 }                                // tham chiếu: chỉ giữ mã</div></div>
          <table class="t"><tr><th>cách</th><th>hợp khi</th></tr>
          <tr><td><b>nhúng</b></td><td>luôn đọc cùng nhau, thuộc về cha, số lượng có giới hạn</td></tr>
          <tr><td><b>tham chiếu</b></td><td>dùng chung nhiều nơi, sửa thường xuyên, hoặc tăng không giới hạn</td></tr></table>
          <p><b>Phi chuẩn hoá</b>: chép một giá trị (như tên khách) vào nhiều văn bản để đọc nhanh — đổi lại phải sửa mọi bản.</p>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Văn bản mẫu có mã đơn, nhúng bản sao tên khách, nhúng các dòng hàng, và tham chiếu kho bằng cách chỉ giữ mã kho. Bảng cho biết khi nào dùng cách nào. Nhúng hợp khi các phần luôn được đọc cùng nhau, thuộc về cha, và số lượng có giới hạn. Tham chiếu hợp khi phần đó dùng chung nhiều nơi, sửa thường xuyên, hoặc tăng không giới hạn. Phi chuẩn hoá là chép một giá trị như tên khách vào nhiều văn bản để đọc nhanh, đổi lại phải sửa mọi bản."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ba cách đặt dữ liệu, ba cái giá"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937"><text x="230" y="38" text-anchor="middle" font-size="24" font-weight="bold">nhúng</text><rect x="40" y="55" width="380" height="235" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="230" y="88" text-anchor="middle" font-size="21" font-weight="bold">văn bản đơn 1042</text><rect x="70" y="105" width="320" height="46" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="230" y="135" text-anchor="middle" font-size="20">khách: An</text><rect x="70" y="163" width="320" height="46" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="230" y="193" text-anchor="middle" font-size="20">dòng hàng: sp 3, sl 2</text><rect x="70" y="221" width="320" height="46" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="230" y="251" text-anchor="middle" font-size="20">dòng hàng: sp 9, sl 1</text><text x="230" y="325" text-anchor="middle" font-size="21" fill="#059669">đọc đơn: 1 lần đọc</text><text x="740" y="38" text-anchor="middle" font-size="24" font-weight="bold">tham chiếu</text><rect x="520" y="70" width="230" height="110" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="635" y="112" text-anchor="middle" font-size="21" font-weight="bold">đơn 1042</text><text x="635" y="150" text-anchor="middle" font-size="20">mã kho: 55</text><line x1="750" y1="125" x2="814" y2="125" stroke="#eb6834" stroke-width="4"/><polygon points="830,125 814,133 814,117" fill="#eb6834"/><rect x="835" y="70" width="190" height="110" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="930" y="112" text-anchor="middle" font-size="21" font-weight="bold">kho 55</text><text x="930" y="150" text-anchor="middle" font-size="20">tập riêng</text><text x="770" y="230" text-anchor="middle" font-size="21" fill="#eb6834">đọc đơn kèm kho: 2 lần đọc</text><text x="770" y="265" text-anchor="middle" font-size="21" fill="#059669">đổi kho: sửa 1 chỗ</text><text x="1280" y="38" text-anchor="middle" font-size="24" font-weight="bold">phi chuẩn hoá</text><rect x="1110" y="60" width="340" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1280" y="97" text-anchor="middle" font-size="20">đơn 1042: khách An</text><rect x="1110" y="132" width="340" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1280" y="169" text-anchor="middle" font-size="20">đơn 1043: khách An</text><rect x="1110" y="204" width="340" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1280" y="241" text-anchor="middle" font-size="20">đơn 1044: khách An</text><text x="1280" y="300" text-anchor="middle" font-size="21" fill="#b91c1c">An đổi tên: sửa 3 văn bản</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình so ba cách đặt dữ liệu. Nhúng là bỏ tên khách và các dòng hàng vào ngay trong văn bản đơn, nên đọc đơn chỉ cần một lần. Tham chiếu là đơn chỉ giữ mã kho 55, kho nằm ở một tập riêng, tức nhóm văn bản cùng loại, nên đọc kèm kho cần hai lần, nhưng đổi kho chỉ sửa một chỗ. Phi chuẩn hoá là chép tên An vào cả ba đơn, đọc nhanh, nhưng khi An đổi tên thì phải sửa cả ba văn bản."

  - id: example
    kind: example
    title: "Bao nhiêu dòng hàng thì vỡ giới hạn?"
    checks:
      - "16 * 2 ** 20 == 16777216 and 16 * 2 ** 20 // 200 == 83886"
      - "16 * 2 ** 20 // 1024 == 16384"
    steps:
      - show: |
          <p><b>Bước 1</b> — trần của một văn bản trong MongoDB: <b>16 MiB</b> $= 16 \cdot 2^{20} = 16\,777\,216$ byte (hệ khác có trần khác).</p>
        say: "Bước một, tìm trần của một văn bản. Ở hệ cơ sở dữ liệu văn bản mà bài lấy làm ví dụ, một văn bản tối đa 16 MiB, tức 16 nhân 2 mũ 20, bằng 16777216 byte, còn hệ khác có trần khác."
      - show: |
          <p><b>Bước 2</b> — mỗi dòng hàng nhúng khoảng 200 byte (số minh hoạ):</p>
          <p>$\lfloor 16\,777\,216 / 200 \rfloor = \lfloor 83\,886{,}08 \rfloor = \hl{83\,886}$ dòng — một đơn bình thường thừa sức.</p>
        focus: [1, 2]
        say: "Bước hai, chia trần cho cỡ một dòng hàng. Mỗi dòng hàng nhúng khoảng 200 byte, một số minh hoạ, nên làm tròn xuống thương được 83886 dòng, một đơn bình thường thừa sức."
      - show: |
          <p><b>Bước 3</b> — <b>nhật ký truy cập</b> của một khách, mỗi mục 1 KiB $= 1024$ byte, tăng mãi: $16\,777\,216 / 1024 = 16\,384$ mục là chạm giới hạn.</p>
        say: "Bước ba, xét một thứ tăng mãi. Nhưng nhật ký truy cập của một khách, mỗi mục 1 nghìn byte, tăng mãi. Chính xác hơn, mỗi mục là 2 mũ 10, tức 1024 byte, nên 16777216 chia 1024 bằng 16384 mục là chạm giới hạn."
      - clear: true
        show: |
          <table class="t"><tr><th>khách ghi 50 mục mỗi ngày (số minh hoạ)</th><th>tính</th></tr>
          <tr><td>ngày chạm trần</td><td>$16\,384 / 50 \approx 327{,}7$ → chưa tới 328 ngày</td></tr>
          <tr><td>trước đó</td><td>mỗi lần đọc khách kéo theo cả nhật ký, gần tới 16 MiB</td></tr></table>
          <p><b>Bước 4</b> — quyết định: dữ liệu tăng không giới hạn phải <b>tham chiếu</b>, nằm ở tập riêng.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, ra quyết định. Nếu khách ghi 50 mục mỗi ngày, một số minh hoạ, thì 16384 chia 50 xấp xỉ 327 phẩy 7, chưa tới 328 ngày đã chạm trần. Trước lúc đó, mỗi lần đọc khách đã phải kéo theo cả nhật ký, gần tới 16 MiB. Dữ liệu tăng không giới hạn phải tham chiếu, nằm ở một tập riêng."

  - id: check
    kind: check
    title: "Tự kiểm: nhân ngược lại"
    checks:
      - "83886 * 200 == 16777200 and 16777200 <= 16 * 2 ** 20 < 83887 * 200 == 16777400"
      - "16384 * 1024 == 16 * 2 ** 20 and 16 * 1024 == 16384"
      - "round(16384 / 50, 1) == 327.7 and 16 * 2 ** 20 / 200 == 83886.08"
    steps:
      - show: |
          <table class="t"><tr><th>thử lại</th><th>phép nhân</th><th>so với 16 777 216</th></tr>
          <tr><td>83 886 dòng</td><td>$83\,886 \cdot 200 = 16\,777\,200$</td><td>vừa ✓</td></tr>
          <tr><td>83 887 dòng</td><td>$83\,887 \cdot 200 = 16\,777\,400$</td><td>vượt, <b class="red">(sai)</b> → 83 886 là lớn nhất</td></tr>
          <tr><td>16 384 mục</td><td>$16\,384 \cdot 1024$; hoặc nhanh: $16 \cdot 2^{20} / 2^{10} = 16 \cdot 1024$</td><td>đúng bằng ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, nhân ngược lại. 83886 dòng nhân 200 byte được 16777200, vẫn vừa trần. Thêm một dòng nữa thì 83887 nhân 200 bằng 16777400, vượt trần, nên 83886 đúng là số lớn nhất. Với nhật ký, 16 nhân 2 mũ 20 chia 2 mũ 10 bằng 16 nhân 1024, tức 16384, khớp kết quả."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "10 ** 6 * 1 == 1000000"
      - "20 * 500 == 10000 and 10000 * 1000 / 1e6 == 10 and 30000 * 500 == 15000000 and 15000000 * 1000 / 1e9 == 15 and 15000000 < 16 * 2 ** 20"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Phi chuẩn hoá rồi quên phải sửa mọi bản <b class="red">(dữ liệu lệch nhau)</b>
          <br><span class="note">Tên tác giả chép vào 1 triệu bài viết: đổi tên là 1 triệu lần ghi. Hoặc chấp nhận bản cũ (tên trên hoá đơn cũ đúng là nên giữ), hoặc tham chiếu.</span></div>
        say: "Lỗi thứ nhất, phi chuẩn hoá rồi quên rằng phải sửa mọi bản, nên dữ liệu lệch nhau. Tên tác giả chép vào 1 triệu bài viết thì đổi tên là 1 triệu lần ghi. Hoặc chấp nhận bản cũ, như tên trên hoá đơn cũ đúng là nên giữ, hoặc dùng tham chiếu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhúng mảng tăng không giới hạn <b class="red">(văn bản phình, chạm trần)</b>
          <br><span class="note">Bình luận, nhật ký, lượt thích: đọc văn bản cha kéo theo tất cả. Tách ra tập riêng, có chỉ mục theo mã cha.</span></div>
        say: "Lỗi thứ hai, nhúng một mảng tăng không giới hạn, nên văn bản phình ra và chạm trần. Bình luận, nhật ký, lượt thích đều vậy, đọc văn bản cha là kéo theo tất cả. Hãy tách ra một tập riêng, có chỉ mục theo mã cha."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ “không có lược đồ” là không cần lược đồ <b class="red">(lược đồ nằm rải trong mã)</b>
          <br><span class="note">Văn bản cũ thiếu trường, văn bản mới đổi kiểu: mọi chỗ đọc phải đoán. Kiểm tra lược đồ khi ghi và có phiên bản cho mỗi văn bản.</span></div>
        say: "Lỗi thứ ba, nghĩ không có lược đồ là không cần lược đồ, trong khi lược đồ khi đó nằm rải rác trong mã. Văn bản cũ thiếu trường, văn bản mới đổi kiểu, nên mọi chỗ đọc phải đoán. Hãy kiểm tra lược đồ khi ghi, và có số phiên bản cho mỗi văn bản."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Thử thiết kế nhúng với dữ liệu <b>trung bình</b> <b class="red">(vỡ ở những văn bản lớn nhất)</b></div>
          <table class="t"><tr><th>bình luận nhúng, 500 byte mỗi cái (số minh hoạ)</th><th>cỡ văn bản</th><th>1000 lượt đọc kéo về</th></tr>
          <tr><td>bài thường: 20 bình luận</td><td>10 000 byte</td><td>10 MB</td></tr>
          <tr><td>bài nổi tiếng: 30 000 bình luận</td><td>15 000 000 byte</td><td><b>15 GB</b></td></tr></table>
          <p class="note">Người có kinh nghiệm hỏi “văn bản <b>lớn nhất</b> sẽ lớn tới đâu” chứ không chỉ “trung bình bao nhiêu”, rồi mới quyết định nhúng.</p>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, thử thiết kế nhúng với dữ liệu trung bình, rồi vỡ ở những văn bản lớn nhất. Bảng giả sử mỗi bình luận nhúng 500 byte, một số minh hoạ. Bài thường có 20 bình luận, văn bản chỉ 10 nghìn byte, 1000 lượt đọc kéo về 10 MB. Bài nổi tiếng có 30 nghìn bình luận, văn bản 15 triệu byte, vẫn dưới trần, nhưng 1000 lượt đọc kéo về tới 15 GB. Vì vậy người có kinh nghiệm hỏi văn bản lớn nhất sẽ lớn tới đâu, chứ không chỉ hỏi trung bình bao nhiêu, rồi mới quyết định nhúng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "16 * 2 ** 20 // 500 == 33554"
      - "16 * 2 ** 20 / 500 == 33554.432 and 33554 * 500 == 16777000 and 33555 * 500 == 16777500 > 16 * 2 ** 20"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mỗi bài viết nhúng thẻ (tối đa 10 thẻ, luôn hiện cùng bài) và bình luận (không giới hạn). Thứ nào nhúng, thứ nào tham chiếu?</td></tr>
          <tr><td>2</td><td>Nếu cố nhúng bình luận 500 byte mỗi cái, tối đa bao nhiêu bình luận trong 16 MiB?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, mỗi bài viết có thẻ, tối đa 10 thẻ và luôn hiện cùng bài, và có bình luận không giới hạn. Thứ nào nhúng, thứ nào tham chiếu? Câu hai, nếu cố nhúng bình luận 500 byte mỗi cái, tối đa bao nhiêu bình luận trong 16 MiB? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: tiêu chí</th><th>thẻ</th><th>bình luận</th></tr>
          <tr><td>luôn đọc cùng bài?</td><td>có</td><td>thường phân trang</td></tr>
          <tr><td>số lượng có giới hạn?</td><td>có, tối đa 10</td><td>không</td></tr>
          <tr><td>kết luận</td><td><b>nhúng</b></td><td><b>tham chiếu</b></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, xét từng tiêu chí. Thẻ luôn đọc cùng bài, còn bình luận thường được phân trang. Thẻ có giới hạn, tối đa 10, còn bình luận thì không. Vậy thẻ thì nhúng vì ít, có giới hạn và luôn đọc cùng, còn bình luận thì tham chiếu vì tăng không giới hạn và thường được phân trang."
      - show: |
          <p>② $\lfloor 16\,777\,216 / 500 \rfloor = \lfloor 33\,554{,}432 \rfloor = \hl{33\,554}$ bình luận.</p>
          <p>Thử lại: $33\,554 \cdot 500 = 16\,777\,000$ vừa; thêm một cái là $16\,777\,500$, vượt. Một bài nổi tiếng vượt qua được, và mọi lần đọc bài sẽ rất nặng.</p>
        focus: [1, 2, 2]
        say: "Câu hai, 16777216 chia 500 bằng 33554 phẩy 432, làm tròn xuống được 33554 bình luận. Thử lại, 33554 nhân 500 bằng 16777000, vừa trần, thêm một cái là 16777500, vượt. Một bài nổi tiếng vượt qua được con số này, và mọi lần đọc bài sẽ rất nặng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đọc cùng, thuộc cha, có giới hạn: nhúng</span><span class="a">→</span>
          <span class="n">dùng chung, sửa nhiều, tăng mãi: tham chiếu</span><span class="a">→</span>
          <span class="n">phi chuẩn hoá: đọc nhanh, sửa nhiều chỗ</span><span class="a">→</span>
          <span class="n">vẫn cần lược đồ và phiên bản</span></div>
        say: "Tổng kết lại, phần nào đọc cùng, thuộc về cha, có giới hạn thì nhúng, còn phần dùng chung, sửa nhiều, tăng mãi thì tham chiếu. Phi chuẩn hoá làm đọc nhanh nhưng phải sửa nhiều chỗ, và vẫn cần lược đồ cùng số phiên bản."
      - show: |
          <div class="box key"><b>Tư duy:</b> thiết kế dữ liệu theo <b>câu hỏi sẽ được hỏi</b>, không theo hình dạng của thực thể ngoài đời.</div>
        say: "Điều cần mang theo, thiết kế dữ liệu theo câu hỏi sẽ được hỏi, không theo hình dạng của thực thể ngoài đời."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>kho khoá–giá trị</b> và thiết kế khoá phân vùng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học kho khoá giá trị và cách thiết kế khoá phân vùng. Hẹn gặp bạn ở bài tiếp theo."
