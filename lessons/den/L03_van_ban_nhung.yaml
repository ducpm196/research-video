id: L03
course: DEN
series: "DEN · Kỹ thuật dữ liệu"
title: "Bài 3 — Cơ sở dữ liệu văn bản: nhúng hay tham chiếu, và phi chuẩn hoá có chủ đích"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/den.yaml L03; audit/den/verify_den.py L03; M. Kleppmann, Designing Data-Intensive Applications (2017), chương 2; MongoDB Database Manual 9.0 (Current), MongoDB Limits and Thresholds: “The maximum BSON document size is 16 mebibytes.” (truy cập 2026-11-09)"
assumes: [arith, frac, cdot, power]
# Quy ước: “văn bản” = một bản ghi dạng cây (khoá–giá trị lồng nhau, kiểu JSON). 1 MiB = 2^20 = 1 048 576 byte. Giới hạn 16 MiB là của MongoDB
#   (tên sản phẩm chỉ trên màn hình). Dòng đơn hàng 200 byte là SỐ MINH HOẠ. Lời đọc nói “16 MiB” (lexicon: mê-ga-byte).
objectives:
  - "Quyết định nhúng hay tham chiếu theo mẫu truy cập"
  - "Tính giới hạn số phần tử nhúng"
  - "Nhận ra chi phí cập nhật khi phi chuẩn hoá"
