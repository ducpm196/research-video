          <span class="n">việc lặp: bộ nhớ và dòng dõi</span><span class="a">→</span>
          <span class="n">không bao giờ đủ: cửa sổ, kích hoạt, rút lại</span><span class="a">→</span>
          <span class="n">một bộ máy chung</span></div>
