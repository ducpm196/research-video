title: "Bài 14 — Tình huống chuyên gia theo dòng thời gian: từ ánh xạ rồi rút gọn tới mô hình luồng dữ liệu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/den.yaml L14; audit/den/sources_L14.md (câu trích nguyên văn, đọc 2026-11-02); audit/den/verify_den.py L14; J. Dean, S. Ghemawat, MapReduce: Simplified Data Processing on Large Clusters, OSDI 2004 [MR04]; M. Zaharia và cộng sự, Resilient Distributed Datasets: A Fault-Tolerant Abstraction for In-Memory Cluster Computing, NSDI 2012 [RDD12]; T. Akidau và cộng sự, The Dataflow Model, PVLDB 8(12), VLDB 2015 [DF15]; M. Zaharia và cộng sự, Apache Spark: A Unified Engine for Big Data Processing, CACM 59(11), 11/2016 [SP16]; DEN bài 9 (điểm kiểm tra, phát lại), bài 13 (xáo trộn, phát tán); khoá DSY bài 7 (ánh xạ, xáo trộn, rút gọn), bài 8 (tác vụ chậm, bản dự phòng), bài 9 (cửa sổ, thời gian sự kiện, mốc nước)"
assumes: [arith, cdot, approx]
# Quy ước: “ánh xạ rồi rút gọn” = MapReduce; “tác vụ dự phòng” = backup task; “dòng dõi” = lineage (chuỗi phép biến đổi đã tạo ra một tập
#   dữ liệu); “tập dữ liệu chia phần, chỉ đọc” = RDD; “mốc nước” = watermark (như khoá DSY bài 9); “kích hoạt” = trigger; “rút lại” = retraction;
#   “dữ liệu không giới hạn” = unbounded data; “phiên” = session window. 1 TB = 1000 GB.
#   Mọi sự kiện và con số có nguồn ghi trong audit/den/sources_L14.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   giá trị 7 rồi 10 của một cửa sổ, đội 3 người, 100 GB và 20 lượt của quiz (dùng số đo Hình 7 của [RDD12] như giả định), trễ 10 phút, cửa sổ 5 phút.
#   Lời đọc không nói “MapReduce”, “Spark”, “Hadoop”, “RDD”, “Dataflow”, “Lambda”, “MillWheel”, “FlumeJava”, “TB”: nói “ánh xạ rồi rút gọn”,
#   “hệ tính toán trong bộ nhớ”, “bản mã nguồn mở của ánh xạ rồi rút gọn”, “tập dữ liệu chia phần, chỉ đọc”, “mô hình luồng dữ liệu”,
#   “kiến trúc hai đường ống”, “1000 GB”. Tên công ty: lexicon_vi.DEN.yaml (probe p1_hanh_trinh).
objectives:
  - "Kể lại hành trình xử lý dữ liệu lớn qua năm chặng từ 2003 tới 2016, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng: số lần máy chết mỗi tháng, thời gian 10 lượt lặp, phiên gộp, số lô nhỏ mỗi giây"
  - "Chọn giữa ghi đĩa và giữ trong bộ nhớ, giữa chờ mốc nước và kích hoạt sớm rồi kích hoạt lại, kèm điều kiện đổi lựa chọn"
asr_reviewed:
