        say: "Làm thử với ba con số của bài báo năm 2004. Bước một, một giai đoạn của hệ lập chỉ mục tìm kiếm, khi viết lại theo cách mới, đi từ khoảng 3800 dòng mã xuống 700 dòng, ngắn đi khoảng 5 phẩy 4 lần. Bước hai, bài sắp xếp có 10 mũ 10 bản ghi, mỗi bản 100 byte. Nhân lại được 10 mũ 12 byte, tức 1000 GB. Bước ba, chia thành mảnh 64 MB thì một triệu MB chia 64 được 15 nghìn 625 mảnh, cùng cỡ với 15 nghìn mảnh nguồn đã chọn. Thực hành rút ra là chia việc thành rất nhiều mảnh, ví dụ 200 nghìn mảnh cho 2000 máy, tức 100 mảnh mỗi máy, để máy hỏng thì việc của nó rải ra mọi máy khác. Điều kiện là hai hàm phải tất định, khi đó chạy lại cho đúng kết quả như chạy một lần không lỗi."

