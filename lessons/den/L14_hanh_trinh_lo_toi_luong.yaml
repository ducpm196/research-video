        focus: [1, 1, 1, 1]
        say: "Hình so hai cách nối hai việc xử lý chạy liền nhau. Bên trái, việc một ghi kết quả ra đĩa, được chép nhiều bản để khỏi mất, rồi việc hai đọc lại từ đầu, và việc lặp mười lượt thì chịu chi phí đó mười lần. Bên phải, kết quả nằm lại trong bộ nhớ, chỉ một bản, còn hệ thống nhớ dòng dõi, tức chuỗi phép biến đổi đã tạo ra nó. Nếu mất phần thứ ba, hệ chỉ tính lại phần thứ ba theo chuỗi, không phải chép dữ liệu ra nhiều máy từ trước."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2003 — khai sinh: hai hàm nhỏ, thư viện lo phần khó"
    stage: {year: "2003", scale: "hàng trăm chương trình tính riêng lẻ trên dữ liệu thô; bản đầu của thư viện 2/2003, thêm đọc tại chỗ và cân tải động 8/2003", source: "[MR04]", practice: "hạn chế mô hình lập trình còn hai hàm, để thư viện lo song song, chịu lỗi, phân phối dữ liệu, cân tải; chia việc thành rất nhiều mảnh nhỏ hơn số máy"}
    checks:
      - "round(3800 / 700, 1) == 5.4"
      - "10**10 * 100 == 10**12 and 10**12 // (64 * 10**6) == 15625"
      - "200000 // 2000 == 100"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> trong năm năm, Google viết <b>hàng trăm</b> chương trình tính riêng lẻ trên dữ liệu thô như trang đã thu thập, nhật ký truy cập. Chương trình nào cũng phải tự lo chia việc song song, chịu lỗi, phân phối dữ liệu và cân tải.</p>
          <p><b>Cách xử lý:</b> tháng 2/2003 có bản đầu của thư viện; tháng 8/2003 thêm <b>đọc tại chỗ</b> (máy đọc dữ liệu từ đĩa của chính nó) và <b>cân tải động</b>. Người viết chỉ viết hàm ánh xạ và hàm rút gọn; máy hỏng thì thư viện <b>chạy lại</b> phần việc đó.</p>
        focus: [1, 1, 2, 2]
        say: "Ở chặng một, trong năm năm, Google viết hàng trăm chương trình tính riêng lẻ trên dữ liệu thô như các trang đã thu thập và nhật ký truy cập. Chương trình nào cũng phải tự lo chia việc song song, chịu lỗi, phân phối dữ liệu và cân tải. Tháng 2 năm 2003 có bản đầu của thư viện, và tháng 8 thêm việc đọc dữ liệu từ đĩa của chính máy đó, cùng cân tải động. Người viết chỉ viết hàm ánh xạ và hàm rút gọn, còn máy hỏng thì thư viện chạy lại phần việc đó."
