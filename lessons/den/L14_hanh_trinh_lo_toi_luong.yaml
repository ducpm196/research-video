      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>ghi đĩa giữa các lượt</td><td>không cần nhiều bộ nhớ; ai cũng quen</td><td>$80 + 19 \cdot 76 = \hl{1524}$ giây ≈ 25,4 phút</td></tr>
          <tr><td>giữ trong bộ nhớ</td><td>$46 + 19 \cdot 3 = \hlg{103}$ giây ≈ 1,7 phút; mất máy thì tính lại theo dòng dõi</td><td>cụm phải đủ bộ nhớ chứa 100 GB; thiếu thì tràn ra đĩa, lợi ích giảm</td></tr></table>
          <p class="note">Chọn giữ trong bộ nhớ. Điều kiện đổi: việc chỉ chạy <b>một lượt</b> (đọc, biến đổi, ghi) thì chỉ còn lợi ở lượt đầu, 80 so với 46 giây — khi đó công cụ đội đã quen là đủ.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu một có hai lựa chọn. Ghi đĩa giữa các lượt không cần nhiều bộ nhớ và ai cũng quen, nhưng mất 80 cộng 19 nhân 76, bằng 1524 giây, khoảng 25 phẩy 4 phút. Giữ trong bộ nhớ mất 46 cộng 19 nhân 3, bằng 103 giây, khoảng 1 phẩy 7 phút, và mất máy thì tính lại theo dòng dõi. Đổi lại, cụm phải đủ bộ nhớ chứa 100 GB, thiếu thì dữ liệu tràn ra đĩa và lợi ích giảm. Nên chọn giữ trong bộ nhớ, còn nếu việc chỉ chạy một lượt thì chỉ còn lợi ở lượt đầu, và công cụ đội đã quen là đủ."
      - clear: true
        show: |
          <p>Câu 2. Mỗi cửa sổ phải giữ trạng thái thêm 10 phút sau khi kết thúc: $\frac{5 + 10}{5} = \hlb{3}$ cửa sổ cùng mở cho mỗi khoá.</p>
          <table class="t"><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chờ mốc nước, xuất một lần</td><td>một kết quả mỗi cửa sổ, đơn giản</td><td>trễ ít nhất tới khi mốc nước qua cuối cửa sổ; dữ liệu tới sau mốc không có trong kết quả đã xuất</td></tr>
          <tr><td>kích hoạt sớm mỗi phút, kích hoạt lại khi dữ liệu muộn tới</td><td>bảng điều khiển có số trong 1 phút; bảng tính tiền cuối cùng đúng</td><td>nhiều lần xuất; phải chọn đúng chế độ cho từng bên nhận</td></tr></table>
          <p class="note">Bảng điều khiển ghi đè được: tích lũy. Bảng tính tiền cộng dồn: chỉ gửi phần mới; nếu số tiền còn được gom tiếp theo khoá khác thì tích lũy và rút lại. Điều kiện đổi: dữ liệu gần như tới đúng thứ tự, như tệp nhật ký có cấu trúc, thì mốc nước rất chính xác và xuất một lần là đủ.</p>
        focus: [1, 2, "2.2", "2.3", "2.3", 3, 3]
        say: "Câu hai, mỗi cửa sổ phải giữ trạng thái thêm 10 phút sau khi kết thúc, nên 5 cộng 10 chia 5 bằng 3 cửa sổ cùng mở cho mỗi khoá. Bảng so hai lựa chọn chính cho câu này. Chờ mốc nước rồi xuất một lần thì đơn giản, nhưng trễ ít nhất tới khi mốc nước qua cuối cửa sổ, và dữ liệu tới sau mốc không có trong kết quả đã xuất. Kích hoạt sớm mỗi phút, rồi kích hoạt lại khi dữ liệu muộn tới, thì bảng điều khiển có số trong một phút và bảng tính tiền cuối cùng đúng. Đổi lại, kết quả được xuất nhiều lần, nên phải chọn đúng chế độ cho từng bên nhận. Bảng điều khiển ghi đè được nên dùng tích lũy, còn bảng tính tiền cộng dồn thì chỉ gửi phần mới, hoặc rút lại nếu số tiền còn được gom tiếp theo khoá khác. Nếu dữ liệu gần như tới đúng thứ tự, như tệp nhật ký có cấu trúc, thì mốc nước rất chính xác và xuất một lần là đủ."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
