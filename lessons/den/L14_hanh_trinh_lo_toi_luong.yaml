scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ hai hàm nhỏ tới dữ liệu không bao giờ đủ"
    checks:
      - "round(29423 * 1.2) == 35308"
    steps:
      - show: |
          <p>Tháng 8/2004, Google chạy <b>29&nbsp;423</b> việc ánh xạ rồi rút gọn; trung bình mỗi việc có <b>1,2</b> máy chết giữa chừng.</p>
          <p>Năm 2012, học máy chạy lặp <b>10 lượt</b> trên cùng 100 GB: mỗi lượt lại đọc đĩa từ đầu.</p>
          <p>Năm 2015, Google viết: dữ liệu như nhật ký web <b>không bao giờ đủ</b> — ta không biết bao giờ đã thấy hết.</p>
          <div class="box key">Hôm nay: năm chặng từ 2003 tới 2016 — mỗi quy mô làm lộ ra điểm nghẽn nào, chuyên gia xử lý ra sao, và khi nào cách đó đúng.</div>
        focus: [1, 2, 3, 4]
        say: "Chào bạn, tháng 8 năm 2004, Google chạy 29 nghìn 423 việc ánh xạ rồi rút gọn, và trung bình mỗi việc có 1 phẩy 2 máy chết giữa chừng. Năm 2012, các bài học máy chạy lặp 10 lượt trên cùng 100 GB, mà lượt nào cũng đọc đĩa lại từ đầu. Năm 2015, Google viết rằng dữ liệu như nhật ký web không bao giờ đủ, ta không biết bao giờ mình đã thấy hết. Hôm nay ta đi qua năm chặng từ 2003 tới 2016, xem mỗi quy mô làm lộ ra điểm nghẽn nào, và chuyên gia đã xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại năm điều đã học"
    checks:
      - "1 - 1 / 4 == 0.75 and 8 * 0.75 == 6"
      - "40 - 30 == 10"
      - "max(10, 10, 40) == 40"
      - "3 // 5 == 0 and 7 // 5 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>đã học ở đâu</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>khoá DSY, ánh xạ rồi rút gọn</td><td>ánh xạ phát ra cặp khoá–giá trị; <b>xáo trộn</b> gom cặp cùng khoá về một máy; rút gọn gộp lại</td><td>đếm từ “a b a”: a = 2, b = 1</td></tr>
          <tr><td>bài 13 của khoá này</td><td>xáo trộn trên $M$ máy: mỗi dòng phải chuyển đi với xác suất $\frac{M - 1}{M}$</td><td>4 máy, 8 GB mỗi máy: gửi $8 \cdot \frac{3}{4} = 6$ GB</td></tr>
          <tr><td>bài 9 của khoá này</td><td><b>điểm kiểm tra</b>: lưu trạng thái định kỳ; sập thì quay về điểm gần nhất và <b>phát lại</b></td><td>kiểm tra mỗi 30 giây, sập ở giây 40: phát lại 10 giây</td></tr>
          <tr><td>khoá DSY, tác vụ chậm</td><td>việc song song xong khi tác vụ <b>chậm nhất</b> xong</td><td>10, 10, 40 phút: xong sau 40 phút</td></tr>
          <tr><td>khoá DSY, xử lý luồng</td><td>cửa sổ 5 giây: sự kiện ở giây $t$ vào cửa sổ thứ phần nguyên của $t$ chia 5; <b>mốc nước</b> báo “coi như đã đủ”</td><td>giây 3 vào cửa sổ 0, giây 7 vào cửa sổ 1</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4", "1.5", "1.6"]
        say: "Bảng nhắc lại năm điều đã học ở khoá này và khoá hệ phân tán. Ở khoá hệ phân tán, bước ánh xạ phát ra cặp khoá và giá trị, bước xáo trộn gom các cặp cùng khoá về một máy, rồi bước rút gọn gộp lại. Vì vậy đếm từ trong dòng a b a được a bằng 2, b bằng 1. Ở bài 13 của khoá này, xáo trộn trên 4 máy thì mỗi máy có 8 GB phải gửi đi 8 nhân 3 phần 4, bằng 6 GB. Ở bài 9, điểm kiểm tra lưu trạng thái định kỳ, sập thì quay về điểm gần nhất rồi phát lại. Kiểm tra mỗi 30 giây mà sập ở giây 40 thì phát lại 10 giây. Cũng ở khoá hệ phân tán, việc song song chỉ xong khi tác vụ chậm nhất xong, nên 10, 10 và 40 phút thì xong sau 40 phút. Còn cửa sổ 5 giây xếp giây 3 vào cửa sổ 0, giây 7 vào cửa sổ 1, và mốc nước báo rằng coi như đã đủ dữ liệu."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>tác vụ dự phòng</b></td><td>gần cuối việc, chạy thêm một bản của tác vụ còn dở ở máy khác; bản nào xong trước thì lấy</td></tr>
          <tr><td><b>dòng dõi</b></td><td>chuỗi phép biến đổi đã tạo ra một tập dữ liệu; mất một phần thì tính lại phần đó theo chuỗi</td></tr>
          <tr><td><b>dữ liệu không giới hạn</b></td><td>dữ liệu cứ tới mãi, như nhật ký web: không có lúc “đã đủ”</td></tr>
          <tr><td><b>thời gian sự kiện</b> và <b>thời gian xử lý</b></td><td>lúc việc xảy ra, và lúc hệ thống nhìn thấy nó</td></tr>
          <tr><td><b>kích hoạt</b></td><td>quy định <b>khi nào</b> xuất kết quả của một cửa sổ; có thể xuất nhiều lần</td></tr>
          <tr><td><b>rút lại</b></td><td>xuất kết quả mới thì gửi kèm lệnh huỷ kết quả cũ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài này dùng sáu thuật ngữ, ta đọc lần lượt từng dòng. Tác vụ dự phòng là gần cuối việc, chạy thêm một bản của tác vụ còn dở ở máy khác, bản nào xong trước thì lấy. Dòng dõi là chuỗi phép biến đổi đã tạo ra một tập dữ liệu, mất một phần thì tính lại phần đó theo chuỗi. Dữ liệu không giới hạn là dữ liệu cứ tới mãi, như nhật ký web, không có lúc đã đủ. Thời gian sự kiện là lúc việc xảy ra, còn thời gian xử lý là lúc hệ thống nhìn thấy nó. Kích hoạt quy định khi nào xuất kết quả của một cửa sổ, và có thể xuất nhiều lần. Rút lại là khi xuất kết quả mới thì gửi kèm lệnh huỷ kết quả cũ."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2003</text><text x="160" y="200">hai hàm nhỏ</text><text x="160" y="232">thư viện lo phần khó</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2004</text><text x="500" y="200">nghìn máy, máy chết</text><text x="500" y="232">chạy lại, dự phòng</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2012</text><text x="850" y="200">việc lặp lại</text><text x="850" y="232">giữ trong bộ nhớ</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2015</text><text x="1200" y="200">không bao giờ đủ</text><text x="1200" y="232">cửa sổ, kích hoạt, rút lại</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2016</text><text x="1540" y="200">một bộ máy chung</text><text x="1540" y="232">hơn 1000 tổ chức</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô lớn → dữ liệu không giới hạn → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2003, người viết chỉ viết hai hàm nhỏ, còn thư viện lo phần khó, và năm 2004 hệ chạy trên hàng nghìn máy, nơi máy chết là chuyện thường ngày. Năm 2012, các việc lặp lại cần giữ dữ liệu trong bộ nhớ, rồi năm 2015 xuất hiện mô hình cho dữ liệu không bao giờ đủ. Năm 2016, một bộ máy chung đã được hơn một nghìn tổ chức dùng."

  # ───────────────────────── 5. CƠ CHẾ ─────────────────────────
