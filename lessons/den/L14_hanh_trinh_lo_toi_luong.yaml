        say: "Đây là bài cuối của khoá kỹ thuật dữ liệu. Bạn đã học hàng và cột, cây gộp theo nhật ký, kho khoá giá trị, nhật ký sự kiện, luồng có trạng thái, kho dữ liệu và xử lý theo lô. Hôm nay bạn đã đi lại hành trình mười mấy năm của xử lý dữ liệu lớn. Cảm ơn bạn đã theo học tới bài cuối cùng của khoá."
