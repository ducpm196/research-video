          <tr><td>kết quả sau <b>liên hệ thế nào</b> với kết quả trước</td><td>bỏ, <b>tích lũy</b>, hoặc tích lũy và <b>rút lại</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Cách xử lý của họ bắt đầu từ nguyên tắc không bao giờ dựa vào một khái niệm đã đủ, và mỗi đường ống trả lời bốn câu hỏi. Tính gì, tức phép biến đổi như đếm, cộng hay nối. Tính ở đâu trong thời gian sự kiện, tức chọn cửa sổ cố định, cửa sổ trượt hay phiên. Xuất khi nào trong thời gian xử lý, tức kích hoạt theo mốc nước, theo giờ hay theo số dữ liệu. Kết quả sau liên hệ thế nào với kết quả trước, tức bỏ đi, tích lũy, hay tích lũy kèm rút lại."
      - clear: true
        show: |
          <p>Phiên, khoảng nghỉ 30 phút (ví dụ của bài báo năm 2015): mỗi sự kiện mở cửa sổ dài 30 phút từ lúc của nó; hai cửa sổ chồng nhau thì <b>gộp</b>.</p>
          <table class="t"><tr><th>bước</th><th>khoá k1, sự kiện lúc 13:02, 13:20, 13:57</th><th>kết quả</th></tr>
          <tr><td>Bước 1. 13:02 mở [13:02, 13:32); 13:20 mở [13:20, 13:50)</td><td>13:20 nằm trước 13:32: chồng nhau</td><td>gộp thành $\hlb{[13{:}02,\ 13{:}50)}$</td></tr>
          <tr><td>Bước 2. 13:57 mở [13:57, 14:27)</td><td>13:57 không trước 13:50</td><td>phiên mới $\hlg{[13{:}57,\ 14{:}27)}$</td></tr></table>
          <p class="note">Khoá k2 chỉ có 13:14 → một phiên [13:14, 13:44). Phiên là cửa sổ <b>theo từng khoá</b>, không cắt chung cho mọi người dùng.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Làm thử với phiên, khoảng nghỉ 30 phút, theo ví dụ của bài báo năm 2015, mỗi sự kiện mở một cửa sổ dài 30 phút, hai cửa sổ chồng nhau thì gộp. Bước một, sự kiện 13 giờ 2 phút mở cửa sổ tới 13 giờ 32, còn 13 giờ 20 nằm trước 13 giờ 32 nên chồng nhau, gộp lại thành một phiên tới 13 giờ 50. Bước hai, sự kiện 13 giờ 57 không nằm trước 13 giờ 50, nên mở một phiên mới tới 14 giờ 27. Khoá thứ hai chỉ có một sự kiện lúc 13 giờ 14, nên có đúng một phiên, vì phiên là cửa sổ theo từng khoá."
      - clear: true
        show: |
          <p>Ba chế độ cho cùng một cửa sổ (số minh hoạ): kích hoạt sớm có tổng <b>7</b>; dữ liệu muộn tới, tổng đúng là <b>10</b>.</p>
          <table class="t"><tr><th>chế độ</th><th>gửi đi</th><th>bên nhận cộng dồn</th><th>hợp khi</th></tr>
          <tr><td>bỏ: chỉ gửi phần mới</td><td>7, rồi 3</td><td>$7 + 3 = \hlg{10}$</td><td>bên nhận cộng dồn</td></tr>
          <tr><td>tích lũy</td><td>7, rồi 10</td><td>$7 + 10 = \hl{17}$ <b class="red">(sai)</b></td><td>bên nhận <b>ghi đè</b>: giữ 10</td></tr>
          <tr><td>tích lũy và rút lại</td><td>7, lệnh huỷ 7, rồi 10</td><td>$7 - 7 + 10 = \hlg{10}$</td><td>kết quả còn được gom tiếp theo <b>khoá khác</b></td></tr></table>
          <p class="note">Thực hành: kích hoạt sớm để có số nhanh, kích hoạt lại khi dữ liệu muộn tới, và chọn chế độ theo cách bên nhận dùng kết quả.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.4", 3]
        say: "Ta xét một số minh hoạ, cửa sổ kích hoạt sớm có tổng 7, rồi dữ liệu muộn tới và tổng đúng là 10. Chế độ bỏ chỉ gửi phần mới, tức 7 rồi 3, nên bên nhận cộng dồn được 10, hợp khi bên nhận cộng dồn. Chế độ tích lũy gửi 7 rồi 10, bên nhận cộng dồn sẽ ra 17, sai, nên chỉ hợp khi bên nhận ghi đè giá trị cũ. Chế độ tích lũy và rút lại gửi 7, rồi lệnh huỷ 7, rồi 10, nên 7 trừ 7 cộng 10 bằng 10. Chế độ này cần khi kết quả còn được gom tiếp theo một khoá khác, vì giá trị cũ và giá trị mới có thể rơi vào hai khoá khác nhau. Thực hành là kích hoạt sớm để có số nhanh, kích hoạt lại khi dữ liệu muộn tới, và chọn chế độ theo cách bên nhận dùng kết quả."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2016 — ổn định và tiếp tục phát triển: một bộ máy chung"
    stage: {year: "2016", scale: "phát hành 2010; hơn 1000 người đóng góp, hơn 1000 tổ chức dùng, cụm công bố lớn nhất hơn 8000 máy", source: "[SP16] [RDD12]", practice: "một bộ máy chung cho SQL, luồng, học máy, đồ thị; luồng là chuỗi lô nhỏ; tối ưu bộ máy chung có lợi cho mọi thư viện; đọc được mọi nguồn dữ liệu cũ"}
    checks:
      - "2016 - 2010 == 6"
      - "1000 // 200 == 5 and 3600 * 5 == 18000"
      - "3 * 10 == 30"
    steps:
      - show: |
          <p><b>Quy mô</b> (CACM, 11/2016): phát hành năm 2010; sáu năm sau có hơn <b>1000</b> người đóng góp, hơn <b>1000</b> tổ chức dùng, cụm công bố lớn nhất hơn <b>8000</b> máy.</p>
          <p><b>Điểm nghẽn cũ:</b> mỗi loại việc một bộ máy riêng, nên muốn chuyển dữ liệu sang bộ máy khác thì phải <b>ghi ra lưu trữ</b>. <b>Cách xử lý:</b> một bộ máy chung cho SQL, luồng, học máy và đồ thị; luồng là chuỗi <b>lô nhỏ</b>, ví dụ mỗi 200 mili giây (0,2 giây) một lô, gộp với trạng thái lưu trong bộ nhớ.</p>
          <p>Năm 2014, bộ máy này sắp xếp 100 TB trên đĩa thể rắn, nhanh gấp 3 kỷ lục cũ dùng ánh xạ rồi rút gọn, với số máy ít hơn 10 lần.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng năm, theo bài viết năm 2016 của chính nhóm làm ra nó, hệ tính toán trong bộ nhớ được phát hành năm 2010. Sáu năm sau, hệ có hơn một nghìn người đóng góp, hơn một nghìn tổ chức dùng, và cụm công bố lớn nhất hơn 8 nghìn máy. Trước đó, mỗi loại việc dùng một bộ máy riêng, nên muốn chuyển dữ liệu sang bộ máy khác thì phải ghi ra lưu trữ. Cách xử lý là một bộ máy chung cho truy vấn, luồng, học máy và đồ thị, trong đó luồng là chuỗi lô nhỏ, ví dụ mỗi 0 phẩy 2 giây một lô. Năm 2014, bộ máy này sắp xếp 100 nghìn GB trên đĩa thể rắn, nhanh gấp 3 kỷ lục cũ dùng ánh xạ rồi rút gọn, với số máy ít hơn 10 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. lô nhỏ 200 mili giây</td><td>1000 mili giây chia 200</td><td>$\hlb{5}$ lô mỗi giây; $3600 \cdot 5 = 18\,000$ lô mỗi giờ</td></tr>
          <tr><td>Bước 2. sắp xếp năm 2014: nhanh gấp 3 với số máy ít hơn 10 lần</td><td>mỗi máy làm được gấp $3 \cdot 10$</td><td>$\hlg{30}$ lần mỗi máy</td></tr></table>
          <table class="t"><tr><th>thực hành khi đã có rất nhiều người dùng</th><th>điều kiện</th></tr>
          <tr><td>tối ưu đặt ở bộ máy chung, nên mọi thư viện cùng nhanh lên</td><td>các thư viện thật sự chạy trên cùng bộ máy</td></tr>
          <tr><td>giữ đường cho dữ liệu cũ: đọc mọi nguồn của hệ mã nguồn mở cũ</td><td>dữ liệu đang nằm trong hệ lưu trữ của hệ cũ</td></tr>
          <tr><td>luồng bằng lô nhỏ, kết quả ra theo từng lô</td><td>chấp nhận kết quả mỗi 200 mili giây một lần</td></tr></table>
        focus: [1, "1.2", "1.3", 2, "2.2", "2.3", "2.4"]
        say: "Ta làm thử hai con số của chặng này. Bước một, lô nhỏ 0 phẩy 2 giây thì 1 giây chia 0 phẩy 2 được 5 lô mỗi giây, nhân 3600 giây được 18 nghìn lô mỗi giờ. Bước hai, nhanh gấp 3 với số máy ít hơn 10 lần, nghĩa là mỗi máy làm được gấp 3 nhân 10, bằng 30 lần. Bảng dưới là các thực hành khi đã có rất nhiều người dùng. Tối ưu đặt ở bộ máy chung, nên mọi thư viện cùng nhanh lên, với điều kiện chúng thật sự chạy trên cùng bộ máy. Hệ giữ đường cho dữ liệu cũ, đọc được mọi nguồn dữ liệu của hệ mã nguồn mở cũ, hợp khi dữ liệu đang nằm trong hệ lưu trữ của hệ cũ. Luồng bằng lô nhỏ thì kết quả ra theo từng lô, nên phải chấp nhận kết quả mỗi 0 phẩy 2 giây một lần."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm năm con số của hành trình"
    checks:
      - "abs(29423 / 5 * 6 - 35307.6) < 1e-6"
      - "891 * 1.44 > 1283 and 891 * 1.43 < 1283"
      - "(80 - 46) + 9 * (76 - 3) == 764 - 73"
      - "200 * 5 == 1000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>35&nbsp;308 lần máy chết</td><td>1,2 máy mỗi việc = 6 máy mỗi 5 việc; 29&nbsp;423 chia 5 nhân 6 = 35&nbsp;307,6 ✓</td></tr>
          <tr><td>chậm hơn 44%</td><td>nhân ngược: 891 nhân 1,44 ≈ 1283,04 ✓</td></tr>
          <tr><td>764 và 73 giây</td><td>chênh từng phần: lượt đầu 80 − 46 = 34; 9 lượt sau mỗi lượt chênh 73, thành 657; 34 + 657 = 691 = 764 − 73 ✓</td></tr>
          <tr><td>hai phiên của k1</td><td>đo khoảng cách: 13:02 tới 13:20 là 18 phút, nhỏ hơn 30, cùng phiên; 13:20 tới 13:57 là 37 phút, phiên mới ✓</td></tr>
          <tr><td>5 lô mỗi giây</td><td>nhân ngược: 200 mili giây nhân 5 = 1000 mili giây ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Ta kiểm lại năm con số theo đường khác. Một phẩy hai máy mỗi việc là 6 máy mỗi 5 việc, nên 29 nghìn 423 chia 5 nhân 6 được khoảng 35 nghìn 308. Nhân ngược, 891 nhân 1 phẩy 44 được khoảng 1283, khớp với thời gian khi tắt dự phòng. Tính chênh từng phần, lượt đầu chênh 34 giây, 9 lượt sau mỗi lượt chênh 73 giây thành 657, cộng lại 691, đúng bằng 764 trừ 73. Đo khoảng cách giữa hai sự kiện, 18 phút thì cùng phiên, còn 37 phút thì lớn hơn 30 nên mở phiên mới. Cuối cùng, 0 phẩy 2 giây nhân 5 đúng bằng 1 giây."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "round(80 / 46, 2) == 1.74"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Hệ mới nhanh gấp 20 lần, việc nào cũng vậy”</td><td>nguồn ghi “tới 20 lần” cho việc <b>lặp</b>; k-means chỉ 1,9 tới 3,2 lần; lượt đầu 80 so với 46 giây, chỉ ≈ 1,74 lần</td><td>đo việc của chính mình; biết việc nặng đọc ghi hay nặng tính toán</td></tr>
          <tr><td><b class="red">2.</b> “Máy hỏng là hiếm, để người trực xử lý”</td><td>tháng 8/2004 đã có ≈ 35&nbsp;308 lần máy chết; 80 máy mất liên lạc một lúc khi bảo trì mạng</td><td>thiết kế để <b>chạy lại</b> được, hàm tất định, kết quả trung gian tính lại được</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ hệ mới nhanh gấp 20 lần thì việc nào cũng vậy. Nguồn chỉ ghi tới 20 lần cho việc lặp, bài phân cụm chỉ nhanh 1 phẩy 9 tới 3 phẩy 2 lần, và lượt đầu 80 so với 46 giây chỉ khoảng 1 phẩy 74 lần. Hãy đo việc của chính mình, và biết việc đó nặng đọc ghi hay nặng tính toán. Bài học sai thứ hai là nghĩ máy hỏng là hiếm, cứ để người trực xử lý, trong khi tháng 8 năm 2004 đã có khoảng 35 nghìn lần máy chết. Hãy thiết kế để chạy lại được, với hàm tất định và kết quả trung gian tính lại được."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Chờ mốc nước rồi xuất một lần là đúng”</td><td>mốc nước lúc quá nhanh (bỏ sót dữ liệu muộn), lúc quá chậm (một tác vụ chậm giữ cả đường ống — một nhóm thanh toán đã gặp)</td><td>chọn kích hoạt theo nhu cầu: sớm để nhanh, muộn để đủ; chọn chế độ hợp với bên nhận</td></tr>
          <tr><td><b class="red">4.</b> “Giữ hai đường ống: luồng cho nhanh, lô đêm sửa sai”</td><td>hai bản cài đặt phải giữ khớp nhau; khách hàng dần không tin kết quả nhanh</td><td>một mô hình, một bản cài đặt, chạy được cả theo lô lẫn theo luồng</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ chờ mốc nước rồi xuất một lần là đúng. Mốc nước lúc quá nhanh nên bỏ sót dữ liệu muộn, lúc quá chậm vì một tác vụ chậm giữ cả đường ống, như một nhóm thanh toán đã gặp. Hãy chọn kích hoạt theo nhu cầu, sớm để nhanh, muộn để đủ, và chọn chế độ hợp với bên nhận. Bài học sai thứ tư là giữ hai đường ống, luồng cho nhanh còn lô đêm để sửa sai, trong khi hai bản cài đặt phải giữ khớp nhau và khách hàng dần không tin kết quả nhanh. Hãy dùng một mô hình với một bản cài đặt, chạy được cả theo lô lẫn theo luồng."

