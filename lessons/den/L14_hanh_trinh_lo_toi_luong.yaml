        focus: [1, "2.2", "2.3", "2.4"]
        say: "Làm thử với hồi quy logistic, 100 GB trên 100 máy, theo hình 7 của bài báo năm 2012. Bản mã nguồn mở của ánh xạ rồi rút gọn mất 80 giây lượt đầu, 76 giây mỗi lượt sau, còn hệ giữ bộ nhớ mất 46 giây rồi 3 giây. Bước một, 10 lượt gồm lượt đầu cộng 9 lượt sau, nên 80 cộng 9 nhân 76 bằng 764 giây, so với 46 cộng 9 nhân 3 bằng 73 giây. Bước hai, 764 chia 73 được khoảng 10 phẩy 5 lần cho cả 10 lượt, còn riêng mỗi lượt sau là 76 chia 3, khoảng 25 phẩy 3 lần."
