        say: "Bước ba, khi một máy bị tắt ở lượt 6 của bài phân cụm trên 75 máy, lượt thường mất 58 giây, còn lượt 6 mất 80 giây. Như vậy chỉ thêm 80 trừ 58, bằng 22 giây, rồi trở lại 58 giây. Bước bốn, truy vấn tương tác trên 1000 GB mất 5 tới 7 giây trong bộ nhớ, so với 170 giây từ đĩa, khoảng 24 lần. Thực hành rút ra là giữ trong bộ nhớ dữ liệu sẽ dùng lại, và chịu lỗi bằng dòng dõi. Điều kiện là phép biến đổi thô, cùng một phép cho nhiều phần tử, không hợp với cập nhật lẻ tẻ như kho dữ liệu của ứng dụng web. Dòng dõi quá dài thì nên đặt điểm kiểm tra, và việc nặng tính toán như phân cụm chỉ nhanh 1 phẩy 9 tới 3 phẩy 2 lần."

