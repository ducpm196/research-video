- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">thứ tự chỉ trong một phân vùng</span><span class="a">→</span>

      <span class="n">cùng khoá, cùng phân vùng</span><span class="a">→</span>

      <span class="n">mỗi phân vùng một thành viên: số phân vùng là trần</span><span class="a">→</span>

      <span class="n">ghi nhận vị trí sau khi xử lý, chịu được trùng</span></div>

      '
    say: Tổng kết lại, thứ tự chỉ có trong một phân vùng, và cùng khoá thì cùng phân vùng. Mỗi phân vùng giao cho một thành
      viên, nên số phân vùng là trần song song. Ghi nhận vị trí sau khi xử lý, và chịu được trùng lặp. Nhiều bên đọc độc lập
      hay nhóm tiêu thụ chia đều các phân vùng nhật ký để tăng tốc song song. Tách trạng thái vị trí đọc sang phía người dùng
      biến nhật ký phân vùng thành trục xương sống siêu bền. Mô hình nhật ký phân vùng phục vụ đồng thời nhiều đội đọc độc
      lập nhau với tốc độ quét tuần tự tối đa.
  - show: '<div class="box key"><b>Tư duy:</b> thứ tự toàn cục rất đắt — hãy hỏi <b>thứ tự giữa những gì</b> mới thật sự cần,
      rồi chỉ trả giá cho phần đó.</div>

      <p class="note"><b>So sánh hai quy mô:</b> chia 12 phân vùng cho 5 người mỗi bên giữ 2–3 phân vùng; trên chủ đề lớn
      có 128 phân vùng, mở 4 nhóm tiêu thụ chạy song song vẫn giữ thứ tự chặt bên trong từng khoá.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Điều cần mang theo, thứ tự toàn cục rất đắt, nên hãy hỏi thứ tự giữa những gì mới thật sự cần, rồi chỉ trả giá cho
      phần đó. Xét hai mức quy mô, chia 12 phân vùng cho 5 người đọc giúp quan sát rõ việc gán. Chủ đề 128 phân vùng mở nhiều
      nhóm đọc vẫn bảo đảm thứ tự chặt bên trong từng khoá. Luôn bảo toàn khớp nối giữa bước ghi nhận kết quả và bước lưu
      vị trí đọc tránh rơi hoặc lặp dữ liệu. Khớp chặt số lượng máy xử lý vào số phân vùng khả dụng tối ưu đồng thời thông
      lượng và chi phí máy.
  - clear: true
    show: '<p class="note">Bài sau (bài 9): <b>xử lý luồng có trạng thái</b> — điểm kiểm tra và đúng một lần.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 9, ta học xử lý luồng có trạng thái, với điểm kiểm tra và đúng một lần. Hẹn gặp bạn ở bài tiếp theo.
      Bước kế tiếp đi sâu vào cách các ứng dụng luồng giữ trạng thái chính xác qua nhiều lần khởi động lại.
