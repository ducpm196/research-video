    say: Hình vẽ một chủ đề có 3 phân vùng, mỗi phân vùng là một nhật ký chỉ ghi thêm, sự kiện mới nối vào bên phải với vị
      trí tăng dần. Mọi sự kiện của đơn 42 có cùng khoá nên nằm trong phân vùng 1, theo đúng thứ tự tạo, thanh toán, huỷ.
      Trong nhóm tiêu thụ, thành viên A đọc phân vùng 0 và 1, thành viên B đọc phân vùng 2, mỗi phân vùng chỉ một người. Mũi
      tên xanh là vị trí đọc mà A tự ghi nhận, A đã xử lý xong tới vị trí 3 của phân vùng 1. Như cuốn nhật ký chung để mỗi
