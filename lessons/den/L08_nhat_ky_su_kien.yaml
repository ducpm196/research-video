      stroke="#059669" stroke-width="3"/><text x="590" y="378" text-anchor="middle" font-size="20" fill="#eb6834">mọi sự kiện
      của đơn 42 ở cùng phân vùng 1, nên giữ đúng thứ tự</text></g></svg></div>

      '
