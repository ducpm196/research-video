scenes:
- id: hook
  kind: hook
  title: Đơn bị huỷ trước khi được tạo
  steps:
  - show: '<p>Hệ thống nhận ba sự kiện của đơn 42: “tạo”, “thanh toán”, “huỷ”. Bộ xử lý phía sau lại thấy “huỷ” trước “tạo”
      — và báo lỗi. Không ai làm sai: các sự kiện đi qua <b>các phân vùng khác nhau</b>, xử lý song song.</p>

      <div class="box key">Hôm nay: <b>nhật ký sự kiện phân vùng</b> — thứ tự nằm ở đâu, chia việc cho nhóm tiêu thụ thế nào,
      và ghi nhận vị trí đọc khi nào.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, hệ thống nhận ba sự kiện của đơn 42 là tạo, thanh toán và huỷ. Bộ xử lý phía sau lại thấy huỷ trước tạo,
      và báo lỗi. Không ai làm sai cả, các sự kiện đi qua các phân vùng khác nhau và được xử lý song song. Hôm nay ta học
      nhật ký sự kiện phân vùng, thứ tự nằm ở đâu, chia việc cho nhóm tiêu thụ thế nào, và ghi nhận vị trí đọc khi nào. Lưu
      trữ nhật ký sự kiện phân vùng bất biến mở đường cho hàng chục nhóm ứng dụng tự do đọc độc lập cùng lúc. Nhóm tiêu thụ
      phối hợp chia đều phân vùng giúp nâng công suất xử lý tuyến tính chỉ bằng cách thêm máy. Nhóm tiêu thụ phối hợp phân
      chia đồng đều phân vùng biến hàng đợi nhật ký thành tuyến xử lý siêu tốc.
- id: prereq
  kind: prereq
  title: 'Ôn lại: chia có dư, ước số, và băm khoá'
  checks:
  - divmod(12, 5) == (2, 2) and [d for d in range(1, 13) if 12 % d == 0] == [1, 2, 3, 4, 6, 12] and 1234567 % 12 == 7
  steps:
  - show: '<table class="t"><tr><th>ý</th><th>ví dụ</th></tr>

      <tr><td><b>chia có dư</b></td><td>12 chia 5 được 2, dư 2: $12 = 5 \cdot 2 + 2$</td></tr>

      <tr><td><b>ước số</b>: chia hết, không dư</td><td>các ước của 12: 1, 2, 3, 4, 6, 12</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Ta ôn lại hai phép chia. 12 chia 5 được 2, dư 2, vì 12 bằng 5 nhân 2 cộng 2. Một số là ước của 12 nếu 12 chia hết
      cho nó, không dư, nên các ước của 12 là 1, 2, 3, 4, 6 và 12. Mỗi bên đọc tự nhớ con trỏ vị trí hiện tại của riêng mình
      thay vì ép máy chủ xoá bản ghi khi đã đọc.
  - show: '<div class="box key">Ở bài 4, ta đã học: phân vùng $=$ băm(khoá) chia lấy dư cho số phân vùng. <b>Cùng khoá → cùng
      số băm → cùng phân vùng</b>, ví dụ băm ra 1 234 567, chia lấy dư cho 12 được 7.</div>

      '
    say: Ở bài 4, ta đã học rằng phân vùng bằng giá trị băm của khoá chia lấy dư cho số phân vùng. Cùng một khoá thì luôn
      băm ra cùng một số, nên luôn vào cùng phân vùng, ví dụ băm ra 1 triệu 234 nghìn 567, chia lấy dư cho 12 được 7.
- id: sym
  kind: symbol
  title: 'Giải mã: phân vùng, vị trí đọc, nhóm tiêu thụ'
  steps:
  - show: '<p><b>Chủ đề</b>: một dòng sự kiện có tên, ví dụ “đơn hàng”, được chia thành $P$ phân vùng.</p>

      <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>phân vùng</b></td><td>một nhật ký chỉ ghi thêm; thứ tự chỉ đảm bảo <b>trong</b> một phân vùng</td></tr>

      <tr><td><b>khoá sự kiện</b></td><td>phân vùng = băm(khoá) mod P: cùng khoá → cùng phân vùng → giữ thứ tự</td></tr>

      <tr><td><b>vị trí đọc</b></td><td>số thứ tự sự kiện trong phân vùng; bên đọc tự ghi nhận đã đọc tới đâu</td></tr>

      <tr><td><b>nhóm tiêu thụ</b></td><td>mỗi phân vùng giao cho đúng một thành viên; nhóm khác đọc độc lập, với vị trí đọc
      riêng</td></tr></table>

      <p>Nhật ký <b>không xoá khi đọc</b>: sự kiện giữ theo thời hạn, nên có thể đọc lại từ một vị trí cũ.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - 3
    - 3
    say: Một chủ đề là một dòng sự kiện có tên, ví dụ đơn hàng, được chia thành P phân vùng, và bảng giải thích bốn khái niệm.
      Phân vùng là một nhật ký chỉ ghi thêm, và thứ tự chỉ được đảm bảo bên trong một phân vùng. Khoá sự kiện quyết định phân
      vùng bằng băm khoá chia lấy dư cho P, nên cùng khoá thì cùng phân vùng và giữ thứ tự. Vị trí đọc là số thứ tự của sự
      kiện trong phân vùng, và bên đọc tự ghi nhận mình đã đọc tới đâu. Trong một nhóm tiêu thụ, mỗi phân vùng giao cho đúng
      một thành viên, còn nhóm khác đọc độc lập, với vị trí đọc riêng của mình. Nhật ký không xoá khi đọc, sự kiện được giữ
      theo thời hạn, nên có thể đọc lại từ một vị trí cũ. Thứ tự được bảo đảm chặt chẽ bên trong phạm vi từng phân vùng dựa
      trên khoá gom nhóm thực thể.
