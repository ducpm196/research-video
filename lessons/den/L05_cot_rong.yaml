source: "curriculum/den.yaml L05; audit/den/verify_den.py L05; A. Lakshman, P. Malik, Cassandra: A Decentralized Structured Storage System (2010); F. Chang và cộng sự, Bigtable (OSDI 2006); bài 4 (khoá phân vùng)"
assumes: [arith, cdot]
# Quy ước: khoá chính = (khoá phân vùng, khoá sắp xếp). Khoá phân vùng quyết định MÁY nào giữ dữ liệu; khoá sắp xếp quyết định THỨ TỰ trong
#   phân vùng. MB = 10^6 byte, GB = 10^9 byte. Cảm biến ghi 100 byte mỗi giây là SỐ MINH HOẠ. Tên Cassandra chỉ trên màn hình.
objectives:
  - "Thiết kế khoá phân vùng và khoá sắp xếp cho một truy vấn"
  - "Giới hạn kích thước phân vùng bằng chia theo thời gian"
  - "Chấp nhận chép dữ liệu thay cho phép nối"
