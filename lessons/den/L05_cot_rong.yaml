  - {sentence: "Đi theo giờ, mỗi giờ 100 nhân 3600, bằng 360 nghìn byte, tức 0 phẩy 36 MB, nhân 24 giờ được 8 phẩy 64 MB, khớp.", reason: "ASR chép “Đi theo giờ, mỗi giờ 100 nhân 3600 bằng 360.000 bai, tức 0,36 MB, nhần 24 giờ được 8,64 MB khớp.” (0.949): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: nhân/nhần — NOT_VERIFIED bằng tai người"}
