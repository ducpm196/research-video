  - {sentence: "Mỗi giây 100 byte, một ngày 86400 giây, nên 100 nhân 86400, bằng 8 triệu 640 nghìn byte, tức 8 phẩy 64 MB.", reason: "ASR chép “Mỗi giây 100 bai, 1 ngày 86.400 giây, nên 100 nhân 86.400, bằng 8.640.000 bai, tích 8,64 megabyte.” (0.9): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte”; lệch âm/thanh thuần Việt: tức (trong “byte tức” → “bai tích”) — NOT_VERIFIED bằng tai người"}
