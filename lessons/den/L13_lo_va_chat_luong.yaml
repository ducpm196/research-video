rate: "-5%"
depth: full
source: "curriculum/den.yaml L13; audit/den/verify_den.py L13; M. Zaharia và cộng sự, Resilient Distributed Datasets (NSDI 2012); M. Kleppmann (2017), chương 10 (nối theo lô); E. Breck và cộng sự, Data Validation for Machine Learning (SysML 2019); bài 4, 11, 12"
assumes: [arith, frac, cdot, approx]
# Quy ước: nối bảng lớn L với bảng nhỏ S trên M máy, dữ liệu đã rải đều. Phát tán: gửi S tới M − 1 máy còn lại. Xáo trộn: băm khoá nối, mỗi dòng
#   của cả hai bảng ở lại máy cũ với xác suất 1/M (alg.join_network_gb). 1 TB = 1000 GB. Bỏ qua nén. Số đo là SỐ MINH HOẠ.
objectives:
  - "Chọn kiểu nối: phát tán bảng nhỏ hay xáo trộn cả hai"
  - "Viết kiểm tra chất lượng trước khi công bố bảng"
  - "Nhận ra lệch khoá khi xáo trộn"
asr_reviewed:
  - {sentence: "Bước hai, phát tán.", reason: "ASR chép “Bước 2. Phát tảnh” (0.75): lệch âm/thanh thuần Việt: tán/tảnh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, xáo trộn.", reason: "ASR chép “Bước 3. Sáu trộn” (0.75): lệch âm/thanh thuần Việt: xáo/sáu — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng nhỏ cần 2 GB mà mỗi máy chỉ có 1 GB trống.", reason: "ASR chép “Bản nhỏ cần 2GB mà mỗi máy chỉ có 1GB trống.” (0.923): lệch âm/thanh thuần Việt: bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì bảng nhỏ 1 GB vừa bộ nhớ mỗi máy, ta chọn phát tán.", reason: "ASR chép “Vì bảng nhỏ 1GB vừa bộ nhớ mỗi máy, ta chọn phát tán.” (1.0): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, đường ống chạy đêm nối bảng giao dịch 1000 GB với bảng cửa hàng 1 GB trên 100 máy.", reason: "ASR chép “Chào bạn, đường ống chạy đêm lối bản giao dịch 1000GB với bản cửa hàng 1GB trên 100 máy.” (0.87): lệch âm/thanh thuần Việt: nối bảng/lối bản, bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, không được, vì bảng 2 GB không vừa 1 GB bộ nhớ mỗi máy, nên phải xáo trộn, hoặc lọc bớt cột và dòng của bảng nhỏ trước.", reason: "ASR chép “Câu 2, không được, vì bảng 2GB không vừa 1GB bộ nhớ mỗi máy, nên phải 6 trộn, hoặc lọc bớt cột và dòng của bảng nhỏ trước.” (0.967): lệch âm/thanh thuần Việt: xáo/sáu — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một phép nối gửi 1000 GB qua mạng"
    checks:
      - "round(alg.join_network_gb(1000, 1, 100, 'shuffle'), 2) == 990.99 and alg.join_network_gb(1000, 1, 100, 'broadcast') == 99"
    steps:
      - show: |
          <p>Đường ống đêm nối bảng giao dịch 1 TB với bảng cửa hàng 1 GB trên 100 máy. Nó chạy 3 tiếng, phần lớn thời gian là gửi dữ liệu qua mạng. Đổi một dòng cấu hình, nó chạy 20 phút. Sáng hôm sau, bảng báo cáo có <b>gấp đôi</b> số dòng — và không ai phát hiện tới khi giám đốc hỏi.</p>
          <div class="box key">Hôm nay: <b>nối theo lô</b> ở quy mô lớn, và <b>kiểm tra chất lượng</b> trước khi công bố dữ liệu.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, đường ống chạy đêm nối bảng giao dịch 1000 GB với bảng cửa hàng 1 GB trên 100 máy. Nó chạy 3 tiếng, và phần lớn thời gian là gửi dữ liệu qua mạng. Đổi một dòng cấu hình, nó chạy 20 phút. Sáng hôm sau, bảng báo cáo có gấp đôi số dòng, và không ai phát hiện cho tới khi giám đốc hỏi. Hôm nay ta học nối theo lô ở quy mô lớn, và kiểm tra chất lượng trước khi công bố dữ liệu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: TB và GB, phần dữ liệu phải chuyển, khoá duy nhất"
    checks:
      - "1 * 1000 == 1000 and 1 - 1 / 4 == 0.75 and 1 - 1 / 100 == 0.99 and 8 * 0.75 == 6"
    steps:
      - show: |
          <table class="t"><tr><th>ý</th><th>ví dụ</th></tr>
          <tr><td>1 TB</td><td>$= 1000$ GB</td></tr>
          <tr><td>băm một dòng tới 1 trong $M$ máy: ở lại máy cũ với xác suất $\frac{1}{M}$, phải chuyển đi với xác suất $\frac{M - 1}{M}$</td><td>$M = 4$: ở lại $\frac{1}{4}$, chuyển $\frac{3}{4}$; máy có 8 GB thì gửi đi $8 \cdot \frac{3}{4} = 6$ GB</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Ta ôn lại hai ý. Bảng giao dịch ở đầu bài cỡ 1000 GB, trên màn hình viết gọn bằng đơn vị lớn hơn. Khi băm một dòng tới 1 trong M máy, dòng đó ở lại máy cũ với xác suất 1 phần M, và phải chuyển đi với xác suất M trừ 1 phần M. Ví dụ 4 máy thì ở lại 1 phần 4, chuyển đi 3 phần 4, nên một máy có 8 GB phải gửi đi 8 nhân 3 phần 4, bằng 6 GB."
      - show: |
          <div class="box key">Ở bài 12, ta đã học: bảng sự kiện (giao dịch) <b>lớn</b>, bảng chiều (cửa hàng, khách) <b>nhỏ</b>; khoá của bảng chiều phải <b>duy nhất</b>, nếu không mỗi dòng sự kiện khớp nhiều lần.</div>
        say: "Ở bài 12, ta đã học rằng bảng sự kiện như giao dịch thì lớn, còn bảng chiều như cửa hàng, khách hàng thì nhỏ. Khoá của bảng chiều phải duy nhất, nếu không thì mỗi dòng sự kiện khớp nhiều lần."

  - id: sym
    kind: symbol
    title: "Giải mã: hai kiểu nối phân tán"
    steps:
      - show: |
          <table class="t"><tr><th>kiểu nối</th><th>cách làm</th><th>gửi qua mạng</th></tr>
          <tr><td><b>phát tán</b> bảng nhỏ</td><td>chép cả bảng nhỏ tới mọi máy; mỗi máy nối phần bảng lớn của nó tại chỗ</td><td>$S \cdot (M - 1)$</td></tr>
          <tr><td><b>xáo trộn</b> cả hai</td><td>băm khoá nối, gửi mỗi dòng tới máy phụ trách khoá đó</td><td>$(L + S) \cdot \frac{M - 1}{M}$</td></tr></table>
          <p>Phát tán thắng khi bảng nhỏ <b>vừa bộ nhớ</b> mỗi máy và $S \cdot M$ nhỏ hơn nhiều so với $L$. Hai bảng đều lớn thì phải xáo trộn.</p>
        focus: [1, "1.2", "1.2", "1.3", "1.3", 2, 2]
        say: "Bảng so hai kiểu nối phân tán. Phát tán bảng nhỏ là chép cả bảng nhỏ tới mọi máy, rồi mỗi máy nối phần bảng lớn của nó tại chỗ. Lượng gửi qua mạng bằng S nhân M trừ 1. Xáo trộn cả hai là băm khoá nối, và gửi mỗi dòng tới máy phụ trách khoá đó. Lượng gửi bằng L cộng S, nhân M trừ 1 chia M. Phát tán thắng khi bảng nhỏ vừa bộ nhớ mỗi máy, và S nhân M nhỏ hơn nhiều so với L. Khi hai bảng đều lớn thì phải xáo trộn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chép bảng nhỏ, hay xáo cả hai"
    steps:
      - show: |
          <div><svg width="1500" height="405" viewBox="0 0 1500 405"><g fill="#1f2937"><text x="330" y="35" text-anchor="middle" font-size="22" font-weight="bold">phát tán bảng nhỏ</text><rect x="20" y="60" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="35" y="88" font-size="19">máy 1</text><rect x="35" y="105" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="110" y="134" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="205" y="105" width="90" height="45" fill="#d1fae5" stroke="#059669"/><text x="250" y="134" text-anchor="middle" font-size="18">bảng nhỏ</text><rect x="380" y="60" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="395" y="88" font-size="19">máy 2</text><rect x="395" y="105" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="470" y="134" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="565" y="105" width="90" height="45" fill="#d1fae5" stroke="#059669"/><text x="610" y="134" text-anchor="middle" font-size="18">bảng nhỏ</text><rect x="20" y="240" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="35" y="268" font-size="19">máy 3</text><rect x="35" y="285" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="110" y="314" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="205" y="285" width="90" height="45" fill="#d1fae5" stroke="#059669"/><text x="250" y="314" text-anchor="middle" font-size="18">bảng nhỏ</text><rect x="380" y="240" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="395" y="268" font-size="19">máy 4</text><rect x="395" y="285" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="470" y="314" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="565" y="285" width="90" height="45" fill="#d1fae5" stroke="#059669"/><text x="610" y="314" text-anchor="middle" font-size="18">bảng nhỏ</text><line x1="310" y1="115" x2="380" y2="115" stroke="#059669" stroke-width="4"/><line x1="165" y1="170" x2="165" y2="240" stroke="#059669" stroke-width="4"/><line x1="310" y1="170" x2="380" y2="240" stroke="#059669" stroke-width="4"/><text x="330" y="390" text-anchor="middle" font-size="20" fill="#059669">chỉ bảng nhỏ từ máy 1 đi qua mạng, 3 bản chép</text><line x1="735" y1="20" x2="735" y2="395" stroke="#d1d5db" stroke-width="2"/><text x="1090" y="35" text-anchor="middle" font-size="22" font-weight="bold">xáo trộn cả hai</text><rect x="780" y="60" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="795" y="88" font-size="19">máy 1</text><rect x="795" y="105" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="870" y="134" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="965" y="105" width="90" height="45" fill="#ffedd5" stroke="#eb6834"/><text x="1010" y="134" text-anchor="middle" font-size="16">phần nhỏ</text><rect x="1140" y="60" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1155" y="88" font-size="19">máy 2</text><rect x="1155" y="105" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="1230" y="134" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="1325" y="105" width="90" height="45" fill="#ffedd5" stroke="#eb6834"/><text x="1370" y="134" text-anchor="middle" font-size="16">phần nhỏ</text><rect x="780" y="240" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="795" y="268" font-size="19">máy 3</text><rect x="795" y="285" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="870" y="314" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="965" y="285" width="90" height="45" fill="#ffedd5" stroke="#eb6834"/><text x="1010" y="314" text-anchor="middle" font-size="16">phần nhỏ</text><rect x="1140" y="240" width="290" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1155" y="268" font-size="19">máy 4</text><rect x="1155" y="285" width="150" height="45" fill="#dbeafe" stroke="#2a78d6"/><text x="1230" y="314" text-anchor="middle" font-size="18">phần bảng lớn</text><rect x="1325" y="285" width="90" height="45" fill="#ffedd5" stroke="#eb6834"/><text x="1370" y="314" text-anchor="middle" font-size="16">phần nhỏ</text><line x1="1070" y1="115" x2="1140" y2="115" stroke="#b91c1c" stroke-width="4"/><line x1="1070" y1="295" x2="1140" y2="295" stroke="#b91c1c" stroke-width="4"/><line x1="925" y1="170" x2="925" y2="240" stroke="#b91c1c" stroke-width="4"/><line x1="1285" y1="170" x2="1285" y2="240" stroke="#b91c1c" stroke-width="4"/><line x1="1070" y1="170" x2="1140" y2="240" stroke="#b91c1c" stroke-width="4"/><line x1="1140" y1="170" x2="1070" y2="240" stroke="#b91c1c" stroke-width="4"/><text x="1090" y="390" text-anchor="middle" font-size="20" fill="#b91c1c">mỗi máy gửi đi 3 phần 4 của cả hai bảng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ 4 máy, mỗi máy giữ một phần bảng lớn màu xanh. Bên trái là phát tán, bảng nhỏ màu lục được chép từ một máy sang 3 máy còn lại, còn bảng lớn nằm yên tại chỗ. Bên phải là xáo trộn, mỗi dòng của cả hai bảng được băm tới máy phụ trách khoá của nó. Vì vậy máy nào cũng gửi đi khoảng 3 phần 4 dữ liệu của mình, kể cả phần bảng lớn."

  - id: example
    kind: example
    title: "1000 GB nối 1 GB trên 100 máy"
    checks:
      - "alg.join_network_gb(1000, 1, 100, 'broadcast') == 99 and round(alg.join_network_gb(1000, 1, 100, 'shuffle'), 2) == 990.99 and round(990.99 / 99, 1) == 10.0"
    steps:
      - show: |
          <p><b>Bước 1</b> — số liệu: bảng lớn $L = 1000$ GB, bảng nhỏ $S = 1$ GB, $M = 100$ máy.</p>
        say: "Bước một, ghi số liệu. Bảng lớn L bằng 1000 GB, bảng nhỏ S bằng 1 GB, và có M bằng 100 máy."
      - show: |
          <table class="t"><tr><th>kiểu nối</th><th>phép tính</th><th>gửi qua mạng</th></tr>
          <tr><td><b>Bước 2</b> — phát tán</td><td>$S \cdot (M - 1) = 1 \cdot 99$</td><td>$\hl{99}$ GB</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước hai, phát tán. Phát tán gửi 1 GB tới 99 máy, tức 99 GB."
      - show: |
          <table class="t"><tr><th>kiểu nối</th><th>phép tính</th><th>gửi qua mạng</th></tr>
          <tr><td><b>Bước 3</b> — xáo trộn</td><td>$(L + S) \cdot \frac{M - 1}{M} = 1001 \cdot \frac{99}{100} = 990{,}99$</td><td>≈ 991 GB</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, xáo trộn. Xáo trộn gửi 1001 GB nhân 99 phần 100, bằng 990 phẩy 99, khoảng 991 GB."
      - clear: true
        show: |
          <p><b>Bước 4</b> — so: $\frac{990{,}99}{99} \approx 10{,}0$ → gấp khoảng <b>10 lần</b>. Và xáo trộn còn ghi dữ liệu trung gian ra đĩa ở cả hai đầu.</p>
          <div class="box key">Bảng nhỏ 1 GB vừa bộ nhớ mỗi máy → chọn <b>phát tán</b>.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, so hai con số, 990 phẩy 99 chia 99 xấp xỉ 10. Như vậy gấp khoảng 10 lần, và xáo trộn còn ghi dữ liệu trung gian ra đĩa ở cả hai đầu. Vì bảng nhỏ 1 GB vừa bộ nhớ mỗi máy, ta chọn phát tán."

  - id: check
    kind: check
    title: "Tự kiểm: tính cho một máy rồi nhân 100"
    checks:
      - "1000 / 100 == 10 and 1 / 100 == 0.01 and round(10.01 * 99 / 100, 4) == 9.9099 and round(9.9099 * 100, 2) == 990.99"
      - "99 * 1 == 99 and round(alg.join_network_gb(1000, 1, 100, 'shuffle') / 100, 4) == 9.9099"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác: nhìn từ một máy</th><th>phép tính</th><th>cả 100 máy</th></tr>
          <tr><td>phát tán: mỗi máy khác nhận một bản bảng nhỏ</td><td>1 GB mỗi máy, 99 máy nhận</td><td>99 GB ✓</td></tr>
          <tr><td>xáo trộn: mỗi máy giữ $10 + 0{,}01 = 10{,}01$ GB, gửi đi $\frac{99}{100}$</td><td>$10{,}01 \cdot 0{,}99 = 9{,}9099$ GB</td><td>$9{,}9099 \cdot 100 = 990{,}99$ GB ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, nhìn từ một máy rồi nhân lên. Với phát tán, mỗi máy khác nhận một bản bảng nhỏ 1 GB, 99 máy nhận nên tổng 99 GB, khớp. Với xáo trộn, mỗi máy giữ 10 GB bảng lớn và 0 phẩy 01 GB bảng nhỏ, gửi đi 99 phần 100, tức 9 phẩy 9099 GB. Nhân 100 máy được 990 phẩy 99 GB, cũng khớp."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "[round((n / 1200000 - 1) * 100, 1) for n in (1250000, 2500000, 600000)] == [4.2, 108.3, -50.0]"
      - "[n >= 1000000 for n in (1250000, 2500000, 600000)] == [True, True, False] and [abs(n / 1200000 - 1) <= 0.2 for n in (1250000, 2500000, 600000)] == [True, False, False]"
      - "(lambda rows: (len(rows), len(rows) - len({r[0] for r in rows}), sum(r[1] is None for r in rows)))([(1, 10), (2, None), (2, 5), (3, 7)]) == (4, 1, 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Công bố bảng mà không kiểm <b class="red">(dữ liệu sai lặng lẽ)</b>
          <br><span class="note">Kiểm trước khi công bố: số dòng so với hôm qua, khoá trùng, tỉ lệ rỗng mỗi cột, khoảng giá trị. Bảng 4 dòng (1, 10), (2, rỗng), (2, 5), (3, 7): <b>1 khoá trùng, 1 giá trị rỗng</b> → dừng, không công bố.</span></div>
        say: "Lỗi thứ nhất, công bố bảng mà không kiểm, nên dữ liệu sai lặng lẽ. Hãy kiểm trước khi công bố, gồm số dòng so với hôm qua, khoá trùng, tỉ lệ rỗng mỗi cột, và khoảng giá trị. Một bảng 4 dòng có khoá 1, 2, 2, 3 và một giá trị rỗng thì có 1 khoá trùng và 1 giá trị rỗng, nên phải dừng, không công bố."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nối khi bảng chiều có khoá trùng <b class="red">(số dòng nhân lên)</b>
          <br><span class="note">Một cửa hàng có 2 dòng trong bảng cửa hàng: mọi giao dịch của nó khớp 2 lần — chính là “gấp đôi số dòng” ở đầu bài. Kiểm tính duy nhất của khoá bảng chiều trước khi nối.</span></div>
        say: "Lỗi thứ hai, nối khi bảng chiều có khoá trùng, nên số dòng nhân lên. Một cửa hàng có 2 dòng trong bảng cửa hàng thì mọi giao dịch của nó khớp 2 lần, chính là gấp đôi số dòng ở đầu bài. Hãy kiểm khoá của bảng chiều là duy nhất trước khi nối."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Xáo trộn với một khoá rất nóng <b class="red">(một máy làm mãi không xong)</b>
          <br><span class="note">Giống phân vùng nóng (bài 4): khoá “khách vãng lai” chiếm 30% giao dịch dồn hết vào một máy. Tách khoá nóng ra phát tán riêng, hoặc thêm hậu tố ngẫu nhiên rồi gộp lại.</span></div>
        say: "Lỗi thứ ba, xáo trộn với một khoá rất nóng, nên một máy làm mãi không xong. Giống phân vùng nóng ở bài 4, khoá khách vãng lai chiếm 30 phần trăm giao dịch dồn hết vào một máy. Hãy tách khoá nóng ra phát tán riêng, hoặc thêm hậu tố ngẫu nhiên rồi gộp lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Kiểm số dòng bằng <b>ngưỡng cố định</b> “ít nhất 1 triệu dòng” <b class="red">(gấp đôi vẫn qua)</b></div>
          <table class="t"><tr><th>hôm qua 1 200 000 dòng; hôm nay</th><th>so với hôm qua</th><th>ngưỡng “ít nhất 1 triệu”</th><th>ngưỡng “lệch tối đa 20%”</th></tr>
          <tr><td>1 250 000 (bình thường)</td><td>+4,2%</td><td>qua</td><td>qua</td></tr>
          <tr><td>2 500 000 (nối trùng khoá)</td><td>+108,3%</td><td><b class="red">qua</b></td><td>chặn</td></tr>
          <tr><td>600 000 (mất một nguồn)</td><td>−50%</td><td>chặn</td><td>chặn</td></tr></table>
          <p class="note">Người có kinh nghiệm so với <b>chính bảng đó hôm qua</b> (hoặc cùng ngày tuần trước), vì lỗi nối thường làm số dòng <b>tăng</b>, không giảm.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, kiểm số dòng bằng một ngưỡng cố định như ít nhất 1 triệu dòng, nên bảng gấp đôi vẫn qua. Giả sử hôm qua có 1 triệu 200 nghìn dòng. Hôm nay bình thường có 1 triệu 250 nghìn, tăng 4 phẩy 2 phần trăm, qua cả hai ngưỡng. Nếu nối trùng khoá thành 2 triệu 500 nghìn, tăng 108 phẩy 3 phần trăm, ngưỡng cố định vẫn cho qua, còn ngưỡng lệch tối đa 20 phần trăm thì chặn lại. Nếu mất một nguồn chỉ còn 600 nghìn, giảm 50 phần trăm, cả hai đều chặn. Vì vậy, người có kinh nghiệm so với chính bảng đó hôm qua, vì lỗi nối thường làm số dòng tăng chứ không giảm."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.join_network_gb(500, 2, 50, 'broadcast') == 98 and round(alg.join_network_gb(500, 2, 50, 'shuffle'), 2) == 491.96"
      - "round(491.96 / 98) == 5 and 2 > 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bảng 500 GB nối bảng 2 GB trên 50 máy. Lượng gửi qua mạng của phát tán và của xáo trộn?</td></tr>
          <tr><td>2</td><td>Mỗi máy chỉ có 1 GB bộ nhớ trống. Còn phát tán được không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bảng 500 GB nối bảng 2 GB trên 50 máy. Lượng gửi qua mạng của phát tán và của xáo trộn là bao nhiêu? Câu hai, mỗi máy chỉ có 1 GB bộ nhớ trống, còn phát tán được không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Phát tán: $S \cdot (M - 1) = 2 \cdot 49 = \hl{98}$ GB.</p>
          <p>Xáo trộn: $(L + S) \cdot \frac{M - 1}{M} = 502 \cdot \frac{49}{50} = 491{,}96 \approx 492$ GB — gấp khoảng 5 lần.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, phát tán gửi 2 nhân 49, bằng 98 GB. Xáo trộn gửi 500 cộng 2, tức 502, nhân 49 phần 50, bằng 491 phẩy 96, khoảng 492 GB. Như vậy xáo trộn gửi gấp khoảng 5 lần."
      - show: |
          <table class="t"><tr><th>câu 2: điều kiện phát tán</th><th>cần</th><th>có</th></tr>
          <tr><td>bảng nhỏ vừa bộ nhớ mỗi máy</td><td>2 GB</td><td>1 GB → <b class="red">không vừa</b></td></tr></table>
          <p>② <b>Không</b>: phải xáo trộn, hoặc lọc bớt cột, dòng của bảng nhỏ trước.</p>
        focus: [1, "1.2", 2]
        say: "Câu hai, kiểm điều kiện của phát tán, bảng nhỏ phải vừa bộ nhớ mỗi máy. Bảng nhỏ cần 2 GB mà mỗi máy chỉ có 1 GB trống. Câu hai, không được, vì bảng 2 GB không vừa 1 GB bộ nhớ mỗi máy, nên phải xáo trộn, hoặc lọc bớt cột và dòng của bảng nhỏ trước."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bảng nhỏ vừa bộ nhớ: phát tán</span><span class="a">→</span>
          <span class="n">hai bảng lớn: xáo trộn, cẩn thận khoá nóng</span><span class="a">→</span>
          <span class="n">kiểm khoá duy nhất trước khi nối</span><span class="a">→</span>
          <span class="n">kiểm chất lượng trước khi công bố</span></div>
        say: "Tổng kết lại, bảng nhỏ vừa bộ nhớ thì phát tán, còn hai bảng lớn thì xáo trộn và cẩn thận khoá nóng. Kiểm khoá duy nhất trước khi nối, và kiểm chất lượng trước khi công bố."
      - show: |
          <div class="box key"><b>Tư duy:</b> đường ống <b>dừng</b> vì dữ liệu xấu là đường ống tốt — dữ liệu sai được công bố lặng lẽ mới là thất bại thật.</div>
        say: "Điều cần mang theo, đường ống dừng lại vì dữ liệu xấu là đường ống tốt, còn dữ liệu sai được công bố lặng lẽ mới là thất bại thật."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — xử lý dữ liệu lớn từ ánh xạ rồi rút gọn (2003) tới mô hình cho dữ liệu không bao giờ đủ (2015) và một bộ máy chung (2016).</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, ta đi lại hơn mười năm xử lý dữ liệu lớn, từ cách chia việc cho hàng nghìn máy năm 2003, tới dữ liệu cứ tới mãi, không bao giờ đủ. Ở mỗi chặng, ta xem điểm nghẽn nào xuất hiện và chuyên gia đã xử lý ra sao. Hẹn gặp lại bạn ở bài tiếp theo của khoá."
