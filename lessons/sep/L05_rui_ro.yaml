assumes: []
# Quy ước: p = xác suất một sự cố xảy ra trong một năm (số thập phân), D = thiệt hại mỗi lần (đô la, số minh hoạ),
#   kỳ vọng thiệt hại mỗi năm = p × D. “Ít nhất một lần trong n lần độc lập” = 1 − (1 − p)^n, dùng lại phép tính của bài 0.
#   Mọi rủi ro, hệ thống, máy chủ, con số tiền là SỐ MINH HOẠ. Câu của bộ quy tắc ACM chép nguyên văn ở audit/sep/sources_L05.md.
#   Lời đọc không nói “ACM”: nói “bộ quy tắc của Hiệp hội Máy tính”.
objectives:
  - "Tính kỳ vọng thiệt hại p × D và xếp hạng các rủi ro theo nó, không theo xác suất"
  - "Tính khả năng có ít nhất một sự cố khi cùng một rủi ro lặp trên nhiều máy hoặc nhiều năm"
  - "Giải thích vì sao hậu quả không đảo ngược được cần ngưỡng riêng, không chỉ kỳ vọng"
  - "Quyết định khi nào dừng phát hành, dựa trên con số và nguyên tắc nghề nghiệp"
asr_reviewed:
  - {sentence: "Ở đây n nhân p bằng 1, nên kết quả là 1 trừ 1 chia e, xấp xỉ 0 phẩy 632.", reason: "ASR chép “Ở đây n n nhân P bằng 1, nên kết quả là 1 trừ 1 GE, sắp xỉ 0,632.” (0.833): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: chia xấp (trong “chia e xấp” → “ge sắp”), không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhưng thứ tự đúng là theo p nhân D, lỗi A 1000 đô la, lỗi B chỉ 100 đô la.", reason: "ASR chép “Nhưng thứ tự đúng là theo P nhân V, lỗi A 1000 đô la, lỗi B chỉ 100 đô la.” (0.955): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lỗi hiếm gấp 100 lần lại đáng sửa trước gấp 10 lần"
    checks:
      - "round(0.001 * 1000000) == 1000 and round(0.1 * 1000) == 100"
      - "round(0.1 / 0.001) == 100 and 1000 // 100 == 10"
    steps:
      - show: |
          <p>Đội của bạn còn thời gian sửa <b>một</b> lỗi trước đợt phát hành (số minh hoạ):</p>
          <table class="t"><tr><th>lỗi</th><th>xác suất xảy ra mỗi năm</th><th>thiệt hại mỗi lần</th></tr>
          <tr><td>A: hỏng đối soát thanh toán</td><td>0,001</td><td>1&nbsp;000&nbsp;000 đô la</td></tr>
          <tr><td>B: ảnh đại diện hiển thị sai</td><td>0,1</td><td>1000 đô la</td></tr></table>
          <p>Lỗi B hay gặp hơn <b>100 lần</b>, ai cũng thấy nó. Nhưng tính ra, lỗi A đáng sửa trước gấp <b>10 lần</b>.</p>
          <div class="box key">Hôm nay: (1) so rủi ro bằng con số nào? (2) vì sao lỗi “một phần nghìn” lại xảy ra gần như chắc chắn? (3) khi nào phải dừng, dù con số trung bình trông nhỏ?</div>
        focus: [1, "2.2", "2.3", 3, 4]
        say: "Chào bạn, đội của bạn chỉ còn thời gian sửa một lỗi trước đợt phát hành, với số minh hoạ. Lỗi A làm hỏng đối soát thanh toán, xác suất 0 phẩy 001 mỗi năm, thiệt hại 1 triệu đô la mỗi lần. Lỗi B làm ảnh đại diện hiển thị sai, xác suất 0 phẩy 1 mỗi năm, thiệt hại 1000 đô la. Lỗi B hay gặp hơn 100 lần và ai cũng thấy nó, nhưng tính ra lỗi A đáng sửa trước gấp 10 lần. Hôm nay ta học cách so rủi ro, vì sao lỗi một phần nghìn vẫn xảy ra, và khi nào phải dừng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại hai phép tính sẽ dùng"
    checks:
      - "0.1 * 1000 == 100 and 0.5 * 20000 == 10000"
      - "round(1 - 0.99 ** 100, 3) == 0.634"
    steps:
      - show: |
          <p><b>① Trung bình có trọng số theo xác suất (kỳ vọng).</b> Một vé có 10% cơ hội trúng 1000 đồng thì trung bình mỗi vé đáng:</p>
          $$0{,}1 \times 1000 = 100 \text{ đồng}$$
          <p class="note">Tung đồng xu, ngửa được 20&nbsp;000 đồng: trung bình $0{,}5 \times 20\,000 = 10\,000$ đồng mỗi lần tung.</p>
        focus: [1, 2, 3]
        say: "Điều thứ nhất là kỳ vọng, tức trung bình có trọng số theo xác suất. Một vé có 10 phần trăm cơ hội trúng 1000 đồng thì trung bình mỗi vé đáng 0 phẩy 1 nhân 1000, bằng 100 đồng. Tung đồng xu, ngửa được 20 nghìn đồng, thì trung bình mỗi lần tung đáng 0 phẩy 5 nhân 20 nghìn, bằng 10 nghìn đồng."
      - show: |
          <p><b>② “Ít nhất một lần” là phần bù của “không lần nào”.</b> Ở bài 0, thử $n$ người mà không ai gặp lỗi có khả năng $(1 - p)^n$; vậy có ít nhất một người gặp lỗi là:</p>
          $$1 - (1 - p)^n \qquad p = 0{,}01,\ n = 100: \quad 1 - 0{,}366 = 0{,}634$$
        focus: [1, 2]
        say: "Điều thứ hai, ở bài 0 ta đã tính thử n người mà không ai gặp lỗi có khả năng 1 trừ p, mũ n. Vì vậy khả năng có ít nhất một người gặp lỗi là 1 trừ con số đó, ví dụ với lỗi 1 phần trăm và 100 người là 1 trừ 0 phẩy 366, bằng 0 phẩy 634."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: p, D, kỳ vọng thiệt hại, không đảo ngược được"
    checks:
      - "0.001 * 1000000 == 1000"
    steps:
      - show: |
          <table class="t"><tr><th>từ / ký hiệu</th><th>nghĩa</th><th>lỗi A</th></tr>
          <tr><td>$p$</td><td>xác suất sự cố xảy ra trong một năm</td><td>0,001</td></tr>
          <tr><td>$D$</td><td>thiệt hại mỗi lần xảy ra</td><td>1&nbsp;000&nbsp;000 đô la</td></tr>
          <tr><td><b>kỳ vọng thiệt hại</b> $p \times D$</td><td>thiệt hại trung bình mỗi năm</td><td>1000 đô la</td></tr>
          <tr><td><b>không đảo ngược được</b></td><td>xảy ra rồi thì không sửa lại được: mất dữ liệu không có bản sao, tổn hại sức khoẻ</td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn từ và ký hiệu. Chữ p là xác suất sự cố xảy ra trong một năm, với lỗi A là 0 phẩy 001. Chữ D là thiệt hại mỗi lần xảy ra, ở đây 1 triệu đô la. Kỳ vọng thiệt hại là p nhân D, tức thiệt hại trung bình mỗi năm, ở đây 1000 đô la. Không đảo ngược được nghĩa là xảy ra rồi thì không sửa lại được, như mất dữ liệu không có bản sao, hay tổn hại sức khoẻ."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: code
    kind: concept
    title: "Bộ quy tắc nghề nghiệp nói gì về rủi ro"
    steps:
      - show: |
          <table class="t"><tr><th>nguyên tắc</th><th>ý chính (dịch sát)</th></tr>
          <tr><td>1.2</td><td>có nghĩa vụ <b>báo dấu hiệu rủi ro</b> có thể gây hại; trước khi báo, đánh giá kỹ</td></tr>
          <tr><td>2.5</td><td>hệ thống mà rủi ro tương lai <b>không dự đoán tin cậy được</b> thì phải đánh giá lại thường xuyên khi đang dùng, <b>hoặc không nên triển khai</b></td></tr>
          <tr><td>2.9</td><td>khi lạm dụng hay tác hại là <b>dự đoán được hoặc không tránh được</b>, lựa chọn tốt nhất có thể là <b>không làm hệ thống đó</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bộ quy tắc của Hiệp hội Máy tính năm 2018 có ba câu dùng ngay trong bài này. Nguyên tắc 1 chấm 2 nói người làm nghề có nghĩa vụ báo dấu hiệu rủi ro có thể gây hại, sau khi đã đánh giá kỹ. Nguyên tắc 2 chấm 5 nói hệ thống mà rủi ro tương lai không dự đoán tin cậy được thì phải đánh giá lại thường xuyên khi đang dùng, hoặc không nên triển khai. Nguyên tắc 2 chấm 9 nói khi tác hại là dự đoán được hoặc không tránh được, lựa chọn tốt nhất có thể là không làm hệ thống đó."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bản đồ rủi ro: xác suất, thiệt hại, và vùng không được vào"
    steps:
      - show: |
          <div><svg width="1600" height="460" viewBox="0 0 1600 460">
          <line x1="120" y1="400" x2="980" y2="400" stroke="#1f2937" stroke-width="2"/><line x1="120" y1="400" x2="120" y2="40" stroke="#1f2937" stroke-width="2"/>
          <rect x="120" y="40" width="860" height="60" fill="#fee2e2"/>
          <text x="550" y="79" font-size="23" fill="#b91c1c" text-anchor="middle" font-weight="bold">không đảo ngược được: ngưỡng riêng, bất kể xác suất</text>
          <text x="125" y="28" font-size="21" fill="#1f2937">thiệt hại (đô la, mỗi vạch gấp 10)</text>
          <g font-size="21" fill="#1f2937" text-anchor="middle">
          <text x="220" y="432">0,0001</text><text x="420" y="432">0,001</text><text x="620" y="432">0,01</text><text x="820" y="432">0,1</text>
          </g>
          <text x="980" y="458" font-size="21" text-anchor="end" fill="#1f2937">xác suất mỗi năm (mỗi vạch gấp 10)</text>
          <g font-size="21" fill="#1f2937" text-anchor="end">
          <text x="110" y="387">1000</text><text x="110" y="307">10&nbsp;000</text><text x="110" y="227">100&nbsp;000</text><text x="110" y="147">1&nbsp;000&nbsp;000</text>
          </g>
          <line x1="220" y1="140" x2="870" y2="400" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
          <line x1="320" y1="100" x2="970" y2="360" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
          <circle cx="420" cy="140" r="13" fill="#dc2626"/><text x="440" y="122" font-size="24" fill="#b91c1c" font-weight="bold">A</text>
          <circle cx="820" cy="380" r="13" fill="#2a78d6"/><text x="842" y="366" font-size="24" fill="#2a78d6" font-weight="bold">B</text>
          <g font-size="23" fill="#1f2937">
          <text x="1030" y="120" fill="#b91c1c" font-weight="bold">A: 0,001; 1 triệu; kỳ vọng 1000</text>
          <text x="1030" y="160" fill="#2a78d6" font-weight="bold">B: 0,1; 1000; kỳ vọng 100</text>
          <text x="1030" y="240">đường nét đứt: cùng kỳ vọng thiệt hại</text>
          <text x="1030" y="276">(xác suất gấp 10, thiệt hại chia 10)</text>
          <text x="1030" y="350">A nằm trên đường cao hơn B</text>
          <text x="1030" y="386">→ A rủi ro hơn dù hiếm hơn</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là bản đồ rủi ro, trục ngang là xác suất mỗi năm, mỗi vạch gấp 10 lần, trục dọc là thiệt hại. Hai đường nét đứt nối những điểm có cùng kỳ vọng thiệt hại, nghĩa là xác suất gấp 10 thì thiệt hại chia 10. Lỗi A nằm trên đường cao hơn lỗi B, nên A rủi ro hơn dù hiếm hơn. Dải đỏ trên cùng là hậu quả không đảo ngược được, cần ngưỡng riêng bất kể xác suất."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra hai con số: kỳ vọng mỗi năm, và ít nhất một lần trên nhiều máy"
    checks:
      - "round(0.001 * 1000000) == 1000"
      - "round(1 - 0.999 ** 1000, 3) == 0.632"
      - "round(1000 * 0.001) == 1"
    steps:
      - show: |
          <p><b>Bước 1 — kỳ vọng thiệt hại mỗi năm.</b> Theo nghĩa kỳ vọng ở phần ôn nền, mỗi năm có xác suất $p$ mất $D$, còn lại mất 0:</p>
          $$p \times D + (1 - p) \times 0 = p \times D \qquad \text{lỗi A: } 0{,}001 \times 1\,000\,000 = 1000$$
        focus: [1, 2]
        say: "Bước một, theo nghĩa kỳ vọng ở phần ôn nền, mỗi năm có xác suất p mất D, còn lại thì mất 0. Vì vậy kỳ vọng thiệt hại là p nhân D, với lỗi A là 0 phẩy 001 nhân 1 triệu, bằng 1000 đô la mỗi năm."
      - show: |
          <p><b>Bước 2 — cùng lỗi chạy trên $n$ máy.</b> Vì mỗi máy độc lập (giả định), theo phép tính ở phần ôn nền, khả năng có ít nhất một máy gặp sự cố trong năm là:</p>
          $$1 - (1 - p)^n \qquad n = 1000: \quad 1 - 0{,}999^{1000} \approx \hlo{0{,}632}$$
        focus: [1, 1, 2]
        say: "Bước hai, giả sử cùng một lỗi chạy trên n máy độc lập với nhau. Theo phép tính ở phần ôn nền, khả năng có ít nhất một máy gặp sự cố trong năm là 1 trừ, 1 trừ p mũ n. Với 1000 máy, đó là 1 trừ 0 phẩy 999 mũ 1000, xấp xỉ 0 phẩy 632."
      - clear: true
        show: |
          <p><b>Bước 3 — số lần trung bình.</b> Cộng dồn qua $n$ máy như cách tính số người bị ảnh hưởng ở bài 0:</p>
          $$\text{số sự cố trung bình mỗi năm} = n \times p = 1000 \times 0{,}001 = 1$$
          <p class="note">“Một phần nghìn mỗi năm” nghe rất hiếm; trên 1000 máy, trung bình <b>mỗi năm một lần</b>, và 63% số năm có ít nhất một lần.</p>
        focus: [1, 2, 3]
        say: "Bước ba, ta cộng dồn qua n máy, theo đúng cách tính số người bị ảnh hưởng ở bài 0. Vậy số sự cố trung bình mỗi năm là n nhân p, ở đây 1000 nhân 0 phẩy 001, bằng 1. Một phần nghìn mỗi năm nghe rất hiếm, nhưng trên 1000 máy, trung bình mỗi năm xảy ra một lần, và 63 phần trăm số năm có ít nhất một lần."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Lỗi A và lỗi B: từng phép tính"
    checks:
      - "round(0.001 * 1000000) == 1000"
      - "round(0.1 * 1000) == 100"
      - "round(1000 / 100) == 10 and round(0.1 / 0.001) == 100"
      - "round(1 - 0.999 ** 10, 4) == 0.01 and round(1 - 0.999 ** 1000, 3) == 0.632"
    steps:
      - show: |
          <p><b>Bước 1.</b> Kỳ vọng thiệt hại lỗi A: $0{,}001 \times 1\,000\,000 = \hlb{1000}$ đô la mỗi năm.</p>
        say: "Bước một, kỳ vọng thiệt hại của lỗi A là 0 phẩy 001 nhân 1 triệu, bằng 1000 đô la mỗi năm."
      - show: |
          <p><b>Bước 1.</b> Lỗi A: 1000 đô la mỗi năm.</p>
          <p><b>Bước 2.</b> Lỗi B: $0{,}1 \times 1000 = \hlb{100}$ đô la mỗi năm.</p>
          <p><b>Bước 3.</b> So sánh: B hay gặp hơn $\frac{0{,}1}{0{,}001} = 100$ lần, nhưng kỳ vọng của A lớn hơn $\frac{1000}{100} = \hlo{10}$ lần → sửa A trước.</p>
        focus: [2, 3, 3]
        say: "Bước hai, kỳ vọng thiệt hại của lỗi B là 0 phẩy 1 nhân 1000, bằng 100 đô la mỗi năm. Bước ba, so sánh, lỗi B hay gặp hơn 100 lần, nhưng kỳ vọng của A lớn hơn 10 lần. Vì vậy nếu chỉ sửa được một lỗi, hãy sửa A trước."
      - clear: true
        show: |
          <p><b>Bước 4.</b> “Hiếm” phụ thuộc vào việc ta nhìn bao nhiêu lần lặp của rủi ro:</p>
          <table class="t"><tr><th>lỗi A, xác suất 0,001 mỗi năm, trên</th><th>khả năng có ít nhất một lần</th></tr>
          <tr><td>1 máy, 10 năm</td><td>$1 - 0{,}999^{10} \approx 0{,}01$</td></tr>
          <tr><td>1000 máy, 1 năm</td><td>$1 - 0{,}999^{1000} \approx \hlo{0{,}632}$</td></tr></table>
          <p class="note">Người viết mã thấy “1%” cho máy của mình; người vận hành 1000 máy thấy sự cố gần như mỗi năm.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước bốn, hiếm hay không phụ thuộc vào việc ta nhìn bao nhiêu lần lặp của rủi ro. Một máy chạy 10 năm có khoảng 1 phần trăm khả năng gặp lỗi A. Nhưng 1000 máy chạy 1 năm thì có khoảng 63 phần trăm khả năng gặp ít nhất một lần. Người viết mã thấy 1 phần trăm cho máy của mình, còn người vận hành 1000 máy thấy sự cố gần như mỗi năm."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác"
    checks:
      - "round(1 - __import__('math').exp(-1), 3) == 0.632"
      - "1000000 / 1000 == 1000 and 1000 * 1000 == 1000000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>0,632</td><td>xấp xỉ quen thuộc: $(1 - p)^n$ gần bằng số $e$ mũ âm $n \times p$; ở đây $n \times p = 1$, và $1 - \frac{1}{e} \approx 1 - 0{,}368 = 0{,}632$ ✓</td></tr>
          <tr><td>kỳ vọng lỗi A = 1000</td><td>nhìn 1000 năm: trung bình xảy ra 1 lần, mất 1&nbsp;000&nbsp;000 đô la; chia đều 1000 năm được 1000 đô la mỗi năm ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Ta kiểm lại theo đường khác. Con số 0 phẩy 632 khớp với một xấp xỉ quen thuộc, vì 1 trừ p mũ n gần bằng số e mũ âm n nhân p. Ở đây n nhân p bằng 1, nên kết quả là 1 trừ 1 chia e, xấp xỉ 0 phẩy 632. Kỳ vọng 1000 đô la của lỗi A cũng kiểm được bằng cách nhìn 1000 năm, trung bình lỗi xảy ra 1 lần mất 1 triệu, chia đều ra 1000 đô la mỗi năm."

  # ───────────────────────── 9. KHI NÀO DỪNG ─────────────────────────
  - id: stop
    kind: concept
    title: "Khi nào kỳ vọng không đủ: hậu quả không đảo ngược được"
    checks:
      - "abs(0.0001 * 100000 - 10) < 1e-9"
      - "round(1 - 0.9999 ** 1000, 3) == 0.095"
    steps:
      - show: |
          <p><b>Lỗi C</b> (số minh hoạ): một lệnh dọn dữ liệu có xác suất 0,0001 mỗi năm xoá vĩnh viễn dữ liệu của <b>100&nbsp;000</b> khách, và <b>chưa có bản sao lưu</b>.</p>
          <table class="t"><tr><th>cách nhìn</th><th>con số</th><th>điều nó che đi</th></tr>
          <tr><td>kỳ vọng</td><td>$0{,}0001 \times 100\,000 = 10$ khách mỗi năm</td><td>không bao giờ mất “10 khách”: hoặc 0, hoặc cả 100&nbsp;000</td></tr>
          <tr><td>chạy trên 1000 máy</td><td>$1 - 0{,}9999^{1000} \approx 0{,}095$</td><td>gần 1 trên 10 năm có một lần mất trắng</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Lỗi C là một lệnh dọn dữ liệu có xác suất 0 phẩy 0001 mỗi năm xoá vĩnh viễn dữ liệu của 100 nghìn khách, khi chưa có bản sao lưu. Kỳ vọng chỉ là 10 khách mỗi năm, nghe nhỏ. Nhưng thực tế không bao giờ mất 10 khách, mà hoặc 0, hoặc cả 100 nghìn. Nếu lệnh đó chạy trên 1000 máy, khoảng 9 phẩy 5 phần trăm số năm sẽ có một lần mất trắng."
      - show: |
          <div class="box key"><b>Ngưỡng riêng cho điều không đảo ngược được:</b> không xếp chung với lỗi thường theo kỳ vọng. Dừng phát hành cho tới khi có lớp chặn: bản sao lưu đã <b>thử khôi phục</b>, xác nhận trước khi xoá, giới hạn số bản ghi mỗi lần xoá. Đây là tinh thần của nguyên tắc 2.9: tác hại dự đoán được thì có thể <b>không làm</b>.</div>
        say: "Vì vậy điều không đảo ngược được cần ngưỡng riêng, không xếp chung với lỗi thường theo kỳ vọng. Hãy dừng phát hành cho tới khi có lớp chặn, như bản sao lưu đã thử khôi phục, bước xác nhận trước khi xoá, và giới hạn số bản ghi mỗi lần xoá. Đây là tinh thần của nguyên tắc 2 chấm 9, tác hại dự đoán được thì có thể không làm."

  # ───────────────────────── 10. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round(1 - 0.999 ** 1000, 2) == 0.63 and 0.1 > 0.001"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Xếp hạng theo độ thường gặp <b class="red">(sửa B trước A)</b>
          <br><span class="note">Lỗi hay thấy thì gây chú ý, nhưng thứ tự đúng là theo $p \times D$: A 1000, B 100.</span></div>
          <table class="t"><tr><th>xếp theo</th><th>thứ tự</th></tr><tr><td>xác suất</td><td>B rồi A</td></tr><tr><td>kỳ vọng thiệt hại</td><td>A rồi B</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất là xếp hạng theo độ thường gặp, nên sửa B trước A. Lỗi hay thấy thì gây chú ý hơn. Nhưng thứ tự đúng là theo p nhân D, lỗi A 1000 đô la, lỗi B chỉ 100 đô la."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng kỳ vọng cho hậu quả không đảo ngược được <b class="red">(“chỉ 10 khách mỗi năm”)</b>
          <br><span class="note">Phép thử bắt được: hỏi “nếu xảy ra một lần thì có sửa lại được không?”. Không sửa được → ngưỡng riêng, lớp chặn riêng.</span></div>
        say: "Lỗi thứ hai là dùng kỳ vọng cho hậu quả không đảo ngược được, kiểu chỉ 10 khách mỗi năm. Phép thử bắt được lỗi này là hỏi, nếu xảy ra một lần thì có sửa lại được không. Nếu không sửa được, hãy đặt ngưỡng riêng và lớp chặn riêng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Ước lượng xác suất cho <b>một</b> máy rồi đem đi họp như cho cả hệ thống <b class="red">(0,001 thành 63%)</b>
          <br><span class="note">Luôn hỏi: rủi ro này lặp trên bao nhiêu máy, bao nhiêu người dùng, bao nhiêu năm? Rồi tính $1 - (1 - p)^n$.</span></div>
          <table class="t"><tr><th>số máy</th><th>ít nhất một lần trong năm</th></tr><tr><td>1</td><td>0,001</td></tr><tr><td>1000</td><td>0,632</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là ước lượng xác suất cho một máy rồi đem đi họp như cho cả hệ thống. Khi đó 0 phẩy 001 mỗi máy thực ra là 63 phần trăm cho 1000 máy. Hãy luôn hỏi rủi ro này lặp trên bao nhiêu máy, bao nhiêu người dùng, bao nhiêu năm, rồi tính lại."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Ước lượng một lần rồi để đó <b class="red">(hệ thống đã đổi)</b>
          <br><span class="note">Nguyên tắc 2.5: rủi ro không dự đoán tin cậy được thì phải đánh giá lại thường xuyên khi hệ thống đang dùng. Số máy tăng từ 100 lên 1000 là $n$ đã đổi gấp 10.</span></div>
        say: "Lỗi thứ tư là ước lượng một lần rồi để đó, trong khi hệ thống đã đổi. Nguyên tắc 2 chấm 5 đòi đánh giá lại thường xuyên khi hệ thống đang dùng. Ví dụ số máy tăng từ 100 lên 1000 nghĩa là n đã tăng gấp 10, nên con số cũ không còn đúng."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: ba rủi ro, một quý"
    checks:
      - "round(0.02 * 50000) == 1000 and round(0.5 * 1000) == 500 and round(0.0002 * 2000000) == 400"
      - "round(1 - 0.9998 ** 1000, 3) == 0.181 and round(1000 * 0.0002, 1) == 0.2 and round(0.2 * 2000000) == 400000"
    steps:
      - show: |
          <p>Ba rủi ro của một dịch vụ (số minh hoạ). R1, R2 tính cho cả hệ thống; R3 tính <b>cho mỗi máy chủ</b>, và hệ thống có <b>1000</b> máy chủ.</p>
          <table class="t"><tr><th>rủi ro</th><th>xác suất mỗi năm</th><th>thiệt hại mỗi lần (đô la)</th><th>sửa lại được?</th></tr>
          <tr><td>R1: đơn hàng trùng</td><td>0,02</td><td>50&nbsp;000</td><td>được</td></tr>
          <tr><td>R2: chậm trang giỏ hàng</td><td>0,5</td><td>1000</td><td>được</td></tr>
          <tr><td>R3: lộ toàn bộ dữ liệu khách</td><td>0,0002 mỗi máy</td><td>2&nbsp;000&nbsp;000</td><td class="red">không</td></tr></table>
          <p>1) Kỳ vọng mỗi rủi ro nếu đọc bảng như nhau? 2) Tính đúng R3 cho 1000 máy. 3) Quý này làm gì trước?</p>
        focus: [0, 1, "2.2", "2.3", "2.4", 3, 3, 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Rủi ro R1 và R2 tính cho cả hệ thống, còn R3 tính cho mỗi máy chủ, và hệ thống có 1000 máy chủ. R1 là đơn hàng trùng, xác suất 0 phẩy 02, thiệt hại 50 nghìn đô la. R2 là chậm trang giỏ hàng, xác suất 0 phẩy 5, thiệt hại 1000 đô la. R3 là lộ toàn bộ dữ liệu khách, 0 phẩy 0002 mỗi máy, thiệt hại 2 triệu, không sửa lại được. Câu một, tính kỳ vọng nếu đọc bảng như nhau. Câu hai, tính đúng R3 cho 1000 máy, và câu ba, quý này làm gì trước? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1: đọc như nhau</td><td>$0{,}02 \times 50\,000$; $0{,}5 \times 1000$; $0{,}0002 \times 2\,000\,000$</td><td>1000; 500; 400 → R3 xếp <b>cuối</b></td></tr>
          <tr><td>2: R3 trên 1000 máy</td><td>$1 - 0{,}9998^{1000}$; số lần $1000 \times 0{,}0002 = 0{,}2$</td><td>$\approx \hlo{0{,}181}$ mỗi năm; kỳ vọng $0{,}2 \times 2\,000\,000 = \hl{400\,000}$</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Đáp án câu một, nếu đọc bảng như nhau thì kỳ vọng là 1000, 500 và 400 đô la, và R3 xếp cuối. Đó là cái bẫy của câu này. Câu hai, R3 tính cho mỗi máy, nên trên 1000 máy khả năng có ít nhất một lần trong năm là 1 trừ 0 phẩy 9998 mũ 1000, xấp xỉ 0 phẩy 181. Số lần trung bình là 0 phẩy 2 mỗi năm, nên kỳ vọng thiệt hại là 400 nghìn đô la, gấp 400 lần R1."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3: thứ tự</th><th>vì sao</th></tr>
          <tr><td>1. R3 trước, có thể dừng tính năng liên quan cho tới khi có lớp chặn</td><td>không đảo ngược được, 18% mỗi năm, kỳ vọng 400&nbsp;000</td></tr>
          <tr><td>2. R1</td><td>kỳ vọng 1000, sửa lại được</td></tr>
          <tr><td>3. R2</td><td>kỳ vọng 500, sửa lại được</td></tr></table>
          <p class="note">Báo lên bằng con số và đơn vị đã quy đổi (“cho cả 1000 máy”), đúng nguyên tắc 1.2: đã đánh giá kỹ rồi mới báo.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đáp án câu ba là một thứ tự có lý do. Làm R3 trước, và có thể dừng tính năng liên quan cho tới khi có lớp chặn, vì hậu quả không đảo ngược được, 18 phần trăm mỗi năm, kỳ vọng 400 nghìn. Sau đó là R1 với kỳ vọng 1000, rồi R2 với kỳ vọng 500, vì cả hai sửa lại được. Khi báo lên, hãy dùng con số đã quy đổi cho cả 1000 máy, đúng tinh thần đánh giá kỹ rồi mới báo."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">kỳ vọng thiệt hại $p \times D$</span><span class="a">→</span>
          <span class="n">quy đổi về đúng quy mô: $1 - (1 - p)^n$</span><span class="a">→</span>
          <span class="n">không đảo ngược được → ngưỡng riêng, lớp chặn</span><span class="a">→</span>
          <span class="n">đánh giá lại khi hệ thống đổi; dừng khi tác hại dự đoán được</span></div>
        say: "Tổng kết lại, so rủi ro bằng kỳ vọng thiệt hại p nhân D, rồi quy đổi về đúng quy mô bằng 1 trừ, 1 trừ p mũ n. Hậu quả không đảo ngược được cần ngưỡng riêng và lớp chặn. Cuối cùng, đánh giá lại khi hệ thống đổi, và dừng khi tác hại dự đoán được."
      - show: |
          <div class="box key"><b>Tư duy:</b> “hiếm” không phải là một con số — luôn hỏi “hiếm trên bao nhiêu lần lặp?” và “xảy ra một lần thì có sửa lại được không?”.</div>
        say: "Điều cần mang theo, hiếm không phải là một con số. Hãy luôn hỏi hiếm trên bao nhiêu lần lặp, và nếu xảy ra một lần thì có sửa lại được không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>tác động môi trường của tính toán</b> — ước lượng điện năng và phát thải của một lần huấn luyện mô hình.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học tác động môi trường của tính toán, tức ước lượng điện năng và phát thải của một lần huấn luyện mô hình. Hẹn gặp bạn ở bài tiếp theo."
