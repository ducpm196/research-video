source: "curriculum/sep.yaml L11; audit/sep/sources_L11.md (câu trích nguyên văn, đọc 2026-11-02); audit/sep/verify_sep.py L11; [S00] L. Sweeney, Simple Demographics Often Identify People Uniquely, Carnegie Mellon University, Data Privacy Working Paper 3, 2000; [A18] ACM Code of Ethics and Professional Conduct, 22/6/2018, nguyên tắc 1.6; [N13] Nghị định 13/2023/NĐ-CP ngày 17/4/2023 (hiệu lực 1/7/2023), Điều 23, 24; [L91] Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 ngày 26/6/2025 (hiệu lực 1/1/2026), Điều 2, 8, 9, 12, 22, 23, 38, 39; [N356] Nghị định 356/2025/NĐ-CP ngày 31/12/2025 (hiệu lực 1/1/2026), Điều 41, 42; SEP bài 1 (tổ hợp thuộc tính), bài 5 (kỳ vọng thiệt hại), bài 10 (hạ tầng và báo trước)"
assumes: [arith, frac, power, approx]
objectives:
  - "Kể lại hành trình bảo vệ dữ liệu cá nhân qua năm chặng 2000, 2018, 2023, 2025, 2026–2031, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt: số tổ hợp thuộc tính, tỉ lệ người duy nhất, hạn báo vi phạm, mức phạt tối đa theo doanh thu, ngưỡng quy mô"
  - "Tra một văn bản luật đúng cách: số hiệu, ngày ban hành, ngày hiệu lực, văn bản bị thay thế"
  - "Chọn việc cần làm cho một sản phẩm ở quy mô của mình, kèm điều kiện đổi lựa chọn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Năm 2000: 87% có thể bị nhận ra; năm 2026: một đạo luật"
    checks:
      - "round(216 / 248 * 100) == 87"
      - "2026 - 2000 == 26"
    steps:
      - show: |
          <p>Năm <b>2000</b>, một nghiên cứu ở Mỹ ước tính <b>87%</b> dân số (216 trong 248 triệu người) có thể bị nhận ra duy nhất chỉ từ ba thông tin: <b>mã bưu chính 5 số, giới tính, ngày sinh</b> — không cần tên.</p>
          <p>Ngày <b>1/1/2026</b>, Luật Bảo vệ dữ liệu cá nhân của Việt Nam có hiệu lực, với mức phạt tới <b>5% doanh thu</b> năm trước cho vi phạm khi chuyển dữ liệu ra nước ngoài.</p>
          <div class="box key">Hôm nay: đi lại 26 năm ấy qua năm chặng — ở mỗi chặng, điều gì làm lộ ra điểm nghẽn, người làm nghề và nhà làm luật đã xử lý ra sao, và một con số tính lại.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, năm 2000, một nghiên cứu ở Mỹ ước tính 87 phần trăm dân số, tức 216 trong 248 triệu người, có thể bị nhận ra duy nhất. Nghiên cứu chỉ dùng ba thông tin, mã bưu chính 5 số, giới tính và ngày sinh, mà không cần tên. Hai mươi sáu năm sau, ngày 1 tháng 1 năm 2026, Luật Bảo vệ dữ liệu cá nhân của Việt Nam có hiệu lực. Luật đặt mức phạt tới 5 phần trăm doanh thu năm trước cho vi phạm khi chuyển dữ liệu ra nước ngoài. Hôm nay ta đi lại 26 năm ấy qua năm chặng, xem điểm nghẽn, cách xử lý, và tính lại một con số ở mỗi chặng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "365 * 80 * 2 == 58400 and round((1 - 1 / 58400) ** 9999, 3) == 0.843"
      - "0.001 * 1000000 == 1000"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 1</td><td>số <b>tổ hợp</b> thuộc tính = tích số giá trị của từng thuộc tính; khả năng một người không trùng ai = $\left(1 - \frac{1}{\text{số tổ hợp}}\right)^{\text{số người khác}}$</td><td>$365 \times 80 \times 2 = 58\,400$ tổ hợp, 10&nbsp;000 người → $\approx 0{,}843$</td></tr>
          <tr><td>bài 5</td><td><b>kỳ vọng thiệt hại</b> = xác suất × thiệt hại</td><td>$0{,}001 \times 1\,000\,000 = 1000$</td></tr>
          <tr><td>bài 10</td><td>thứ được nhiều người dựa vào thành <b>hạ tầng</b>; quyền thay đổi đi kèm nghĩa vụ báo trước</td><td>gỡ 273 gói không báo trước → 2,5 giờ gián đoạn</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 1, số tổ hợp thuộc tính bằng tích số giá trị của từng thuộc tính, và khả năng một người không trùng ai là 1 trừ 1 phần số tổ hợp, mũ số người còn lại. Ví dụ 58 nghìn 400 tổ hợp cho 10 nghìn người thì khả năng đó xấp xỉ 0 phẩy 843. Ở bài 5, kỳ vọng thiệt hại bằng xác suất nhân thiệt hại, như 0 phẩy 001 nhân 1 triệu bằng 1000. Ở bài 10, thứ được nhiều người dựa vào thành hạ tầng, và quyền thay đổi nó đi kèm nghĩa vụ báo trước."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa (theo Luật 91/2025/QH15, Điều 2)</th></tr>
          <tr><td><b>dữ liệu cá nhân</b></td><td>dữ liệu số hoặc thông tin dạng khác xác định hoặc <b>giúp xác định</b> một con người cụ thể</td></tr>
          <tr><td><b>chủ thể dữ liệu</b></td><td>người được dữ liệu cá nhân phản ánh</td></tr>
          <tr><td><b>khử nhận dạng</b></td><td>thay đổi hoặc xoá thông tin để tạo dữ liệu mới <b>không thể</b> xác định hay giúp xác định một người</td></tr>
          <tr><td><b>đánh giá tác động</b></td><td>phân tích rủi ro có thể xảy ra khi xử lý dữ liệu để áp biện pháp giảm thiểu</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ theo đúng định nghĩa của luật năm 2025. Dữ liệu cá nhân là dữ liệu số hoặc thông tin dạng khác xác định, hoặc giúp xác định, một con người cụ thể. Chủ thể dữ liệu là người được dữ liệu ấy phản ánh. Khử nhận dạng là thay đổi hoặc xoá thông tin để tạo dữ liệu mới không thể xác định hay giúp xác định một người. Đánh giá tác động là phân tích rủi ro có thể xảy ra khi xử lý dữ liệu, để áp biện pháp giảm thiểu."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1760" height="330" viewBox="0 0 1760 330">
          <line x1="20" y1="150" x2="1740" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="23" text-anchor="middle" fill="#1f2937">
          <circle cx="170" cy="150" r="15" fill="#dc2626"/><text x="170" y="108" font-weight="bold">2000</text><text x="170" y="198">xoá tên ≠ ẩn danh</text><text x="170" y="230">87% duy nhất</text>
          <circle cx="520" cy="150" r="15" fill="#7c3aed"/><text x="520" y="108" font-weight="bold">22/6/2018</text><text x="520" y="198">chuẩn mực nghề</text><text x="520" y="230">thu tối thiểu, gộp cẩn thận</text>
          <circle cx="870" cy="150" r="15" fill="#2a78d6"/><text x="870" y="108" font-weight="bold">17/4/2023</text><text x="870" y="198">nghị định riêng</text><text x="870" y="230">báo vi phạm 72 giờ</text>
          <circle cx="1220" cy="150" r="15" fill="#eb6834"/><text x="1220" y="108" font-weight="bold">26/6/2025</text><text x="1220" y="198">luật, phạt theo doanh thu</text><text x="1220" y="230">hiệu lực 1/1/2026</text>
          <circle cx="1570" cy="150" r="15" fill="#059669"/><text x="1570" y="108" font-weight="bold">2026 → 2031</text><text x="1570" y="198">làm theo quy mô</text><text x="1570" y="230">ngưỡng 100 nghìn người</text>
          </g>
          <text x="880" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh câu hỏi → chuẩn mực nghề → quy định → luật → ổn định theo quy mô</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2000, một nghiên cứu cho thấy xoá tên chưa phải là ẩn danh. Tháng 6 năm 2018, một bộ quy tắc nghề nghiệp ghi chuẩn mực thu tối thiểu và gộp dữ liệu cẩn thận. Tháng 4 năm 2023, Việt Nam có một nghị định riêng, với hạn báo vi phạm 72 giờ, rồi tháng 6 năm 2025 là một đạo luật, có hiệu lực từ đầu năm 2026. Chặng cuối, từ 2026 tới 2031, nghĩa vụ đi theo quy mô, với ngưỡng 100 nghìn người."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2000 — khai sinh câu hỏi: xoá tên chưa phải ẩn danh"
    stage: {year: "2000", scale: "dữ liệu điều tra dân số Mỹ 1990, 248 triệu người; một danh sách cử tri 54 805 người", source: "[S00] tóm tắt, mục 2", practice: "coi tổ hợp vài thuộc tính thường gặp (mã bưu chính, giới tính, ngày sinh) là thông tin giúp nhận dạng; tính số tổ hợp so với số người trước khi công bố dữ liệu"}
    checks:
      - "2 * 5 * 365 * 100 == 365000 and 365000 > 54805"
      - "round(365000 / 54805, 1) == 6.7"
      - "round((1 - 1 / 365000) ** 54804, 2) == 0.86"
      - "round(132 / 248 * 100) == 53 and round(216 / 248 * 100) == 87"
    steps:
      - show: |
          <p><b>Quy mô:</b> nghiên cứu dùng dữ liệu điều tra dân số Mỹ năm 1990 (248 triệu người), và một danh sách cử tri có <b>54 805</b> người.</p>
          <p><b>Điểm nghẽn:</b> dữ liệu y tế và dữ liệu khác về từng người được công bố sau khi <b>bỏ tên</b>, nhưng vẫn giữ mã bưu chính, giới tính, ngày sinh. Tác giả viết: dữ liệu như vậy <b>không nên được coi là ẩn danh</b>.</p>
          <p><b>Kết quả:</b> 87% duy nhất theo {mã bưu chính 5 số, giới tính, ngày sinh}; 53% theo {thành phố, giới tính, ngày sinh}; 18% theo {quận hạt, giới tính, ngày sinh}.</p>
        focus: [1, 2, 2, 3]
        say: "Ở chặng một, nghiên cứu dùng dữ liệu điều tra dân số Mỹ năm 1990 với 248 triệu người, và một danh sách cử tri có 54 nghìn 805 người. Điểm nghẽn là dữ liệu y tế và dữ liệu khác về từng người được công bố sau khi bỏ tên, nhưng vẫn giữ mã bưu chính, giới tính và ngày sinh. Tác giả viết rằng dữ liệu như vậy không nên được coi là ẩn danh. Kết quả là 87 phần trăm duy nhất theo mã bưu chính 5 số, giới tính và ngày sinh, 53 phần trăm theo thành phố, và 18 phần trăm theo quận hạt."
      - clear: true
        show: |
          <p><b>Tính lại</b> với danh sách cử tri mà nghiên cứu mô tả: 2 giới tính, 5 mã bưu chính, ngày sinh trong 365 ngày của 100 năm.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. số tổ hợp</td><td>$2 \times 5 \times 365 \times 100$</td><td>365&nbsp;000 tổ hợp</td></tr>
          <tr><td>2. so với số người</td><td>$365\,000 / 54\,805$</td><td>$\approx 6{,}7$ tổ hợp cho mỗi người</td></tr>
          <tr><td>3. một người không trùng ai (giả định chia đều)</td><td>$\left(1 - \frac{1}{365\,000}\right)^{54\,804}$</td><td>$\approx \hlo{0{,}86}$</td></tr></table>
          <p class="note">Công thức của bài 1, áp vào số của năm 2000, cho khoảng 86% — cùng cỡ với 87% mà nghiên cứu đo trên dữ liệu thật.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Ta tính lại với danh sách cử tri mà nghiên cứu mô tả, gồm 2 giới tính, 5 mã bưu chính, và ngày sinh trong 365 ngày của 100 năm. Bước một, nhân lại được 365 nghìn tổ hợp. Bước hai, 365 nghìn chia 54 nghìn 805 được khoảng 6 phẩy 7 tổ hợp cho mỗi người, nên phần lớn tổ hợp trống. Bước ba, giả định ngày sinh chia đều, khả năng một người không trùng ai là 1 trừ 1 phần 365 nghìn, mũ 54 nghìn 804, xấp xỉ 0 phẩy 86. Công thức của bài 1 cho khoảng 86 phần trăm, cùng cỡ với 87 phần trăm mà nghiên cứu đo trên dữ liệu thật."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2018 — chuẩn mực nghề: thu tối thiểu, gộp cẩn thận"
    stage: {year: "2018", scale: "bộ quy tắc cho mọi người làm nghề tin học, thông qua 22/6/2018", source: "[A18] nguyên tắc 1.6", practice: "chỉ thu lượng tối thiểu cần thiết; thời hạn lưu và huỷ được xác định, thực thi, thông báo; dùng cho mục đích khác phải có đồng ý; chống định danh lại; cẩn thận đặc biệt khi gộp dữ liệu"}
    checks:
      - "2 * 80 == 160 and 80 * 50 == 4000 and 2 * 80 * 50 == 8000"
      - "round((1 - 1 / 160) ** 4999, 4) == 0.0 and round((1 - 1 / 8000) ** 4999, 2) == 0.54"
      - "round(5000 * (1 - 1 / 8000) ** 4999) == 2677"
    steps:
      - show: |
          <table class="t"><tr><th>nguyên tắc 1.6, bộ quy tắc 2018 (dịch sát)</th></tr>
          <tr><td>chỉ thu <b>lượng tối thiểu</b> dữ liệu cá nhân cần thiết cho hệ thống</td></tr>
          <tr><td><b>thời hạn lưu và huỷ</b> phải được xác định, thực thi và thông báo cho chủ thể dữ liệu</td></tr>
          <tr><td>dữ liệu thu cho một mục đích <b>không dùng cho mục đích khác</b> nếu người đó không đồng ý</td></tr>
          <tr><td>phòng ngừa <b>định danh lại</b> dữ liệu đã ẩn danh; <b>gộp</b> các bộ dữ liệu có thể phá các tính năng riêng tư của từng bộ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Chặng hai là năm 2018, khi bộ quy tắc nghề nghiệp của Hiệp hội Máy tính ghi những chuẩn mực này thành nguyên tắc 1 chấm 6. Người làm nghề chỉ thu lượng tối thiểu dữ liệu cá nhân cần thiết cho hệ thống. Thời hạn lưu và huỷ phải được xác định, thực thi và thông báo cho chủ thể dữ liệu. Dữ liệu thu cho một mục đích không được dùng cho mục đích khác nếu người đó không đồng ý. Người làm nghề phải phòng ngừa định danh lại dữ liệu đã ẩn danh. Bộ quy tắc còn cảnh báo rằng gộp các bộ dữ liệu có thể phá các tính năng riêng tư của từng bộ."
      - clear: true
        show: |
          <p><b>Tính lại vì sao gộp nguy hiểm</b> (số minh hoạ): một phường 5000 người; giới tính 2 giá trị, năm sinh 80 giá trị, tổ dân phố 50 giá trị.</p>
          <table class="t"><tr><th>bộ dữ liệu</th><th>số tổ hợp</th><th>một người không trùng ai</th></tr>
          <tr><td>A: {giới tính, năm sinh}</td><td>$2 \times 80 = 160$</td><td>$\left(1 - \frac{1}{160}\right)^{4999} \approx 0$</td></tr>
          <tr><td>B: {năm sinh, tổ dân phố}</td><td>$80 \times 50 = 4000$</td><td>thấp hơn, nhưng mỗi bộ thiếu một thông tin</td></tr>
          <tr><td>A gộp B theo năm sinh: {giới tính, năm sinh, tổ}</td><td>$2 \times 80 \times 50 = 8000$</td><td>$\left(1 - \frac{1}{8000}\right)^{4999} \approx \hl{0{,}54}$ — khoảng 2677 người</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Ta tính lại vì sao gộp dữ liệu nguy hiểm, với số minh hoạ cho một phường 5000 người. Bộ A chỉ có giới tính và năm sinh, nên có 2 nhân 80 bằng 160 tổ hợp, và gần như không ai duy nhất. Bộ B có năm sinh và tổ dân phố, mỗi bộ đều thiếu một thông tin. Khi gộp hai bộ theo năm sinh, ta có 2 nhân 80 nhân 50 bằng 8000 tổ hợp. Khả năng một người không trùng ai lên khoảng 0 phẩy 54, tức khoảng 2677 người trong phường thành duy nhất."

  # ───────────────────────── 7. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2023 — một nghị định riêng: báo vi phạm trong 72 giờ"
    stage: {year: "2023", scale: "mọi bên kiểm soát và xử lý dữ liệu cá nhân ở Việt Nam; ban hành 17/4/2023, hiệu lực 1/7/2023", source: "[N13] Điều 23 khoản 1, 4; Điều 24 khoản 1, 4", practice: "báo vi phạm chậm nhất 72 giờ sau khi xảy ra, quá hạn phải kèm lý do; được báo theo từng đợt; lập hồ sơ đánh giá tác động từ khi bắt đầu xử lý, gửi trong 60 ngày"}
    checks:
      - "(__import__('datetime').date(2023, 7, 1) - __import__('datetime').date(2023, 4, 17)).days == 75"
      - "72 // 24 == 3"
      - "(__import__('datetime').date(2026, 3, 2) + __import__('datetime').timedelta(days=60)) == __import__('datetime').date(2026, 5, 1)"
    steps:
      - show: |
          <p><b>Chặng 3:</b> Nghị định 13/2023/NĐ-CP về bảo vệ dữ liệu cá nhân, ban hành <b>17/4/2023</b>, có hiệu lực <b>1/7/2023</b>.</p>
          <table class="t"><tr><th>điều</th><th>nội dung (đọc nguyên văn)</th></tr>
          <tr><td>23.1</td><td>phát hiện vi phạm thì thông báo cho Bộ Công an <b>chậm nhất 72 giờ sau khi xảy ra</b> hành vi vi phạm; thông báo sau 72 giờ phải <b>kèm lý do</b> chậm, muộn</td></tr>
          <tr><td>23.4</td><td>không thể thông báo đủ nội dung thì được thông báo <b>theo từng đợt</b>, từng giai đoạn</td></tr>
          <tr><td>24.1, 24.4</td><td>lập hồ sơ đánh giá tác động <b>từ thời điểm bắt đầu xử lý</b>; gửi bản chính trong <b>60 ngày</b> kể từ ngày tiến hành xử lý</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4"]
        say: "Chặng ba là năm 2023, khi Nghị định 13 về bảo vệ dữ liệu cá nhân được ban hành ngày 17 tháng 4 và có hiệu lực ngày 1 tháng 7. Điều 23 yêu cầu khi phát hiện vi phạm thì thông báo cho Bộ Công an chậm nhất 72 giờ sau khi hành vi vi phạm xảy ra. Thông báo sau 72 giờ phải kèm lý do chậm, muộn. Nếu chưa thể thông báo đủ nội dung, được thông báo theo từng đợt. Điều 24 yêu cầu lập hồ sơ đánh giá tác động từ khi bắt đầu xử lý, và gửi bản chính trong 60 ngày."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. thời gian chuẩn bị trước hiệu lực</td><td>17/4/2023 → 1/7/2023, đếm bằng lịch</td><td>$\hlb{75}$ ngày</td></tr>
          <tr><td>2. hạn báo vi phạm</td><td>72 chia 24</td><td>3 ngày tính từ lúc vi phạm <b>xảy ra</b></td></tr>
          <tr><td>3. hạn gửi hồ sơ (số minh hoạ: bắt đầu xử lý 2/3)</td><td>2/3 + 60 ngày</td><td>1/5</td></tr></table>
          <p class="note">Thực hành rút ra: muốn báo trong 3 ngày thì phải <b>phát hiện</b> nhanh — có nhật ký truy cập, có người trực, có mẫu thông báo soạn sẵn.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Ta tính lại ba con số. Bước một, từ 17 tháng 4 tới 1 tháng 7, đếm bằng lịch được 75 ngày để chuẩn bị. Bước hai, 72 giờ chia 24 là 3 ngày, tính từ lúc vi phạm xảy ra. Bước ba, với số minh hoạ, nếu bắt đầu xử lý ngày 2 tháng 3 thì hạn gửi hồ sơ là 60 ngày sau, ngày 1 tháng 5. Thực hành rút ra là muốn báo trong 3 ngày thì phải phát hiện nhanh, nghĩa là có nhật ký truy cập, có người trực, và có mẫu thông báo soạn sẵn."

  # ───────────────────────── 8. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2025 — một đạo luật: phạt theo doanh thu"
    stage: {year: "2025", scale: "mọi cơ quan, tổ chức, cá nhân Việt Nam và nước ngoài liên quan tới dữ liệu cá nhân người Việt; thông qua 26/6/2025, hiệu lực 1/1/2026", source: "[L91] Điều 1, 8, 9, 12, 23, 38", practice: "đồng ý theo từng mục đích, im lặng không phải là đồng ý; dữ liệu đã mã hoá vẫn là dữ liệu cá nhân; báo vi phạm chậm nhất 72 giờ kể từ khi phát hiện; ước lượng mức phạt tối đa để đặt ưu tiên"}
    checks:
      - "10 * 0.5 == 5.0"
      - "0.05 * 200 == 10.0 and 10.0 > 3"
      - "3 / 2 == 1.5"
      - "5 + 3 == 8 and 3 < 5"
    steps:
      - show: |
          <table class="t"><tr><th>Luật 91/2025/QH15</th><th>nội dung (đọc nguyên văn)</th></tr>
          <tr><td>Điều 38</td><td>thông qua 26/6/2025; <b>có hiệu lực từ 1/1/2026</b></td></tr>
          <tr><td>Điều 9.4</td><td>đồng ý <b>đối với từng mục đích</b>; <b>sự im lặng hoặc không phản hồi không được coi là sự đồng ý</b></td></tr>
          <tr><td>Điều 12.1</td><td>dữ liệu cá nhân sau khi được mã hoá <b>vẫn là dữ liệu cá nhân</b></td></tr>
          <tr><td>Điều 23.1</td><td>vi phạm có thể gây tổn hại (an ninh, tính mạng, sức khoẻ, danh dự, tài sản của chủ thể…) thì báo cơ quan chuyên trách <b>chậm nhất 72 giờ kể từ khi phát hiện</b></td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Chặng bốn là năm 2025, khi Quốc hội thông qua Luật Bảo vệ dữ liệu cá nhân ngày 26 tháng 6, có hiệu lực từ ngày 1 tháng 1 năm 2026. Điều 9 yêu cầu đồng ý đối với từng mục đích, và ghi rõ sự im lặng hoặc không phản hồi không được coi là đồng ý. Điều 12 ghi dữ liệu cá nhân sau khi mã hoá vẫn là dữ liệu cá nhân. Điều 23 nói về vi phạm có thể gây tổn hại, như tới tính mạng, sức khoẻ, danh dự hay tài sản của chủ thể. Khi đó phải báo cơ quan chuyên trách chậm nhất 72 giờ kể từ khi phát hiện."
      - clear: true
        show: |
          <p><b>Điều 8 — mức phạt tiền tối đa</b> trong xử phạt hành chính (áp cho tổ chức; cá nhân tối đa bằng một nửa):</p>
          <table class="t"><tr><th>hành vi</th><th>mức tối đa</th></tr>
          <tr><td>mua, bán dữ liệu cá nhân</td><td><b>10 lần</b> khoản thu có được từ vi phạm</td></tr>
          <tr><td>vi phạm quy định chuyển dữ liệu xuyên biên giới</td><td><b>5%</b> doanh thu của năm trước liền kề</td></tr>
          <tr><td>vi phạm khác</td><td><b>3 tỉ đồng</b></td></tr></table>
          <p class="note">Hai dòng đầu: nếu không có khoản thu, không có doanh thu, hoặc tính ra thấp hơn mức 3 tỉ, thì áp mức 3 tỉ.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Điều 8 đặt mức phạt tiền tối đa trong xử phạt hành chính, áp cho tổ chức, còn cá nhân tối đa bằng một nửa. Mua, bán dữ liệu cá nhân bị phạt tối đa 10 lần khoản thu có được từ vi phạm. Vi phạm quy định chuyển dữ liệu xuyên biên giới bị phạt tối đa 5 phần trăm doanh thu của năm trước liền kề. Các vi phạm khác bị phạt tối đa 3 tỉ đồng. Với hai dòng đầu, nếu không có khoản thu hay doanh thu, hoặc tính ra thấp hơn 3 tỉ, thì áp mức 3 tỉ."
      - clear: true
        show: |
          <table class="t"><tr><th>bước (số minh hoạ)</th><th>phép tính</th><th>mức tối đa</th></tr>
          <tr><td>1. bán dữ liệu thu được 0,5 tỉ</td><td>$10 \times 0{,}5$</td><td>5 tỉ (lớn hơn 3 tỉ nên giữ 5)</td></tr>
          <tr><td>2. công ty doanh thu 200 tỉ, chuyển ra nước ngoài sai quy định</td><td>$5\% \times 200 = 0{,}05 \times 200$</td><td>$\hl{10}$ tỉ</td></tr>
          <tr><td>3. cá nhân, vi phạm khác</td><td>3 chia 2</td><td>1,5 tỉ</td></tr>
          <tr><td>4. vi phạm xảy ra ngày 0, phát hiện ngày 5</td><td>hạn mới: $5 + 3$</td><td>ngày 8 (theo cách cũ của 2023: ngày 3, đã quá hạn)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta tính lại bốn con số với số minh hoạ. Bước một, bán dữ liệu thu được 0 phẩy 5 tỉ thì mức tối đa là 10 nhân 0 phẩy 5 bằng 5 tỉ, lớn hơn 3 tỉ nên giữ 5 tỉ. Bước hai, công ty doanh thu 200 tỉ chuyển dữ liệu ra nước ngoài sai quy định thì mức tối đa là 5 phần trăm của 200, bằng 10 tỉ. Bước ba, cá nhân vi phạm khác thì tối đa 3 chia 2, bằng 1 phẩy 5 tỉ. Bước bốn, vi phạm xảy ra ngày 0, phát hiện ngày 5, thì hạn báo mới là ngày 8, còn theo cách tính năm 2023 thì hạn là ngày 3, đã qua."

