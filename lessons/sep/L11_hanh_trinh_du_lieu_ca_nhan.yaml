          <tr><td>3. số lần cập nhật hồ sơ mỗi năm khi có thay đổi</td><td>12 chia 6</td><td>2 lần</td></tr></table>
          <p class="note">Thực hành rút ra: đặt một bộ đếm số chủ thể dữ liệu trong hệ thống, và báo trước cho đội khi tiến gần ngưỡng — như theo dõi bất kỳ giới hạn tài nguyên nào.</p>
        focus: [0, "1.2", "1.3", "1.3", "1.4", 2]
        say: "Ta tính lại ba con số. Bước một, thời gian được chọn kéo dài từ 1 tháng 1 năm 2026 thêm 5 năm, tới 1 tháng 1 năm 2031. Bước hai, với số minh hoạ, một ứng dụng khởi nghiệp thêm 4000 người mỗi tháng từ đầu năm 2026 thì sau 100 nghìn chia 4000, tức tháng thứ 25, đã chạm ngưỡng. Đó là đầu năm 2028, sớm hơn mốc 2031 tới ba năm. Bước ba, cập nhật định kỳ 6 tháng nghĩa là 2 lần mỗi năm. Thực hành rút ra là đặt một bộ đếm số chủ thể dữ liệu, và báo trước cho đội khi tiến gần ngưỡng, như theo dõi bất kỳ giới hạn tài nguyên nào."

