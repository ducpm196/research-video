          <tr><td>Luật 91, Điều 22</td><td>hồ sơ đánh giá tác động được cập nhật <b>định kỳ 06 tháng</b> khi có thay đổi</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.4", "1.5"]
        say: "Chặng năm là giai đoạn ổn định và tiếp tục phát triển. Nghị định hướng dẫn số 356 có hiệu lực từ ngày 1 tháng 1 năm 2026, và nghị định năm 2023 hết hiệu lực từ ngày đó. Luật cho phép việc xử lý đã được đồng ý theo nghị định cũ tiếp tục, không phải xin đồng ý lại. Doanh nghiệp nhỏ và khởi nghiệp được chọn làm hay không làm đánh giá tác động trong 5 năm. Ngoại lệ là khi kinh doanh dịch vụ xử lý dữ liệu, xử lý dữ liệu nhạy cảm, hoặc đạt từ 100 nghìn chủ thể trở lên. Hồ sơ đánh giá tác động được cập nhật định kỳ 6 tháng khi có thay đổi."
      - clear: true
        show: |
