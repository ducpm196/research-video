# ═══ BÀI HÀNH TRÌNH THEO DÒNG THỜI GIAN (case: journey, lint E40; case-lessons.md mục 5) ═══
# Quy ước: mọi sự kiện, điều khoản và con số có nguồn lấy NGUYÊN VĂN từ văn bản đã đọc (audit/sep/sources_L11.md, đọc 2026-11-02):
#   [S00] Sweeney 2000; [A18] bộ quy tắc ACM 2018; [N13] Nghị định 13/2023/NĐ-CP; [L91] Luật 91/2025/QH15; [N356] Nghị định 356/2025/NĐ-CP
#   (ba văn bản Việt Nam: bản ký số từ datafiles.chinhphu.vn / cổng Nghệ An, ảnh quét — đọc từng trang). Con số khác là phép tính lại
#   (checks) hoặc ghi “số minh hoạ”. Bài KHÔNG tư vấn pháp lý: dạy nguyên lý và cách tra; luật có thể đổi sau ngày đọc.
#   GDPR NOT_VERIFIED (eur-lex 202, bản lưu 429 trong phiên) → không dạy. Không nêu tên cá nhân (tác giả nghiên cứu ghi trên màn hình
