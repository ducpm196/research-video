          <p class="note">Bài này dạy nguyên lý và cách tra, không phải tư vấn pháp lý cho một trường hợp cụ thể — văn bản có thể đổi sau ngày đọc (2/11/2026).</p>
        focus: [0, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Người làm nghề không cần thuộc luật, nhưng cần biết tra cho đúng. Bước một, lấy toàn văn có chữ ký số từ cổng văn bản của Chính phủ, như bản ký số của luật năm 2025. Bước hai, ghi số hiệu, ngày ban hành và ngày hiệu lực, như thông qua 26 tháng 6 năm 2025, hiệu lực 1 tháng 1 năm 2026. Bước ba, tìm văn bản thay thế và quy định chuyển tiếp, như nghị định năm 2025 làm nghị định năm 2023 hết hiệu lực. Bước bốn, đọc đúng điều, khoản rồi mới kết luận, vì 72 giờ sau khi xảy ra khác với 72 giờ kể từ khi phát hiện. Bài này dạy nguyên lý và cách tra, không phải tư vấn pháp lý, và văn bản có thể đổi sau ngày đọc."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm ba con số của hành trình bằng đường khác"
    checks:
      - "abs((1 - 1 / 365000) ** 54804 - __import__('math').exp(-54804 / 365000)) < 0.001 and round(__import__('math').exp(-0.15), 2) == 0.86"
      - "30 - 17 + 31 + 30 + 1 == 75"
      - "4000 * 25 == 100000 and 4000 * 24 == 96000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>0,86 (chặng 1)</td><td>khi số tổ hợp rất lớn, $\left(1 - \frac{1}{k}\right)^{n} \approx$ “e mũ âm $\frac{n}{k}$”; $\frac{54\,804}{365\,000} \approx 0{,}15$ và e mũ âm 0,15 $\approx 0{,}86$ ✓</td></tr>
          <tr><td>75 ngày (chặng 3)</td><td>đếm từng tháng: tháng 4 còn $30 - 17 = 13$, tháng 5 có 31, tháng 6 có 30, cộng 1 ngày tới 1/7: $13 + 31 + 30 + 1 = 75$ ✓</td></tr>
          <tr><td>tháng thứ 25 (chặng 5)</td><td>nhân ngược: $4000 \times 24 = 96\,000$ chưa tới, $4000 \times 25 = 100\,000$ vừa chạm ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Ta kiểm ba con số theo đường khác. Với 0 phẩy 86, khi số tổ hợp rất lớn, phép lũy thừa ấy xấp xỉ e mũ âm số người chia số tổ hợp. Ở đây là e mũ âm 0 phẩy 15, cũng xấp xỉ 0 phẩy 86. Với 75 ngày, đếm từng tháng, tháng 4 còn 13 ngày, tháng 5 có 31, tháng 6 có 30, cộng 1 ngày tới mùng 1 tháng 7, được 75. Với tháng thứ 25, nhân ngược 4000 nhân 24 bằng 96 nghìn, chưa tới, còn nhân 25 thì vừa chạm 100 nghìn."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "round((1 - 1 / 8000) ** 4999, 2) == 0.54"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Bỏ tên rồi là ẩn danh”</td><td>năm 2000: 87% duy nhất chỉ với ba thuộc tính; gộp hai bộ “an toàn” cho 54% duy nhất</td><td>tính số tổ hợp so với số người; khử nhận dạng thật sự rồi mới công bố</td></tr>
          <tr><td><b class="red">2.</b> “Đã mã hoá thì không còn là dữ liệu cá nhân”</td><td>Luật 91, Điều 12.1: sau khi mã hoá <b>vẫn là</b> dữ liệu cá nhân</td><td>mã hoá là một biện pháp bảo vệ, không phải lối thoát khỏi nghĩa vụ</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là bỏ tên rồi là ẩn danh. Năm 2000, 87 phần trăm đã duy nhất chỉ với ba thuộc tính, và gộp hai bộ tưởng an toàn cho 54 phần trăm duy nhất. Bài học sai thứ hai là đã mã hoá thì không còn là dữ liệu cá nhân. Điều 12 của luật năm 2025 ghi rõ dữ liệu sau khi mã hoá vẫn là dữ liệu cá nhân, nên mã hoá là biện pháp bảo vệ, không phải lối thoát khỏi nghĩa vụ."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Công ty nhỏ thì được miễn hết tới 2031”</td><td>ngoại lệ: dữ liệu nhạy cảm, dịch vụ xử lý dữ liệu, hoặc từ 100 nghìn chủ thể — ứng dụng ví dụ chạm ngưỡng ở tháng thứ 25</td><td>đếm số chủ thể và loại dữ liệu ngay từ đầu</td></tr>
          <tr><td><b class="red">4.</b> “Đợi điều tra xong mới báo” (lỗi của người đã đi làm)</td><td>hạn chỉ 72 giờ; năm 2023 nghị định đã cho báo theo từng đợt khi chưa đủ thông tin</td><td>soạn sẵn quy trình và mẫu thông báo; báo đợt đầu đúng hạn</td></tr>
          <tr><td><b class="red">5.</b> “Chép nguyên quy trình của một tập đoàn lớn”</td><td>nghĩa vụ đi theo quy mô và loại dữ liệu của chính mình</td><td>bắt đầu từ bản đồ dữ liệu của sản phẩm mình</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4"]
        say: "Bài học sai thứ ba là công ty nhỏ thì được miễn hết tới 2031. Luật có ngoại lệ cho dữ liệu nhạy cảm, dịch vụ xử lý dữ liệu, hoặc từ 100 nghìn chủ thể, và ứng dụng ví dụ chạm ngưỡng ngay tháng thứ 25. Bài học sai thứ tư, hay gặp ở người đã đi làm, là đợi điều tra xong mới báo. Hạn chỉ có 72 giờ, và ngay từ năm 2023 nghị định đã cho báo theo từng đợt khi chưa đủ thông tin. Bài học sai thứ năm là chép nguyên quy trình của một tập đoàn lớn, trong khi nghĩa vụ đi theo quy mô và loại dữ liệu của chính mình."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "2 * 50 * 80 == 8000"
      - "(__import__('datetime').datetime(2026, 11, 6, 17) + __import__('datetime').timedelta(hours=72)) == __import__('datetime').datetime(2026, 11, 9, 17)"
      - "100000 - 30000 == 70000 and 70000 // 5000 == 14"
    steps:
      - show: |
          <p>Ứng dụng đặt lịch khám của bạn (số minh hoạ): <b>30 000</b> người dùng, thêm <b>5000</b> người mỗi tháng; mẫu đăng ký hỏi họ tên, ngày sinh, giới tính, tổ dân phố, triệu chứng; máy chủ đặt ở nước ngoài.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Mẫu đăng ký nên bớt gì? Còn bao lâu tới ngưỡng 100 nghìn người?</td></tr>
          <tr><td>2</td><td>Thứ Sáu 6/11/2026 lúc 17:00 đội phát hiện một bản sao lưu bị để công khai. Hạn báo là khi nào, và đợt báo đầu gồm gì?</td></tr></table>
        focus: [0, 1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ. Ứng dụng đặt lịch khám của bạn có 30 nghìn người dùng, và thêm 5000 người mỗi tháng. Mẫu đăng ký hỏi họ tên, ngày sinh, giới tính, tổ dân phố và triệu chứng, còn máy chủ đặt ở nước ngoài. Câu một, mẫu đăng ký nên bớt gì, và còn bao lâu tới ngưỡng 100 nghìn người? Câu hai, thứ Sáu ngày 6 tháng 11 năm 2026, lúc 17 giờ, đội phát hiện một bản sao lưu bị để công khai, vậy hạn báo là khi nào và đợt báo đầu gồm gì? Dừng video và viết ra giấy."
        pause: 25
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>lựa chọn và lý do</th></tr>
          <tr><td>bớt</td><td>chỉ giữ <b>năm sinh</b> thay ngày sinh nếu đủ cho việc khám; tổ dân phố không cần cho đặt lịch — bỏ đi, vì ngày sinh + giới tính + tổ là đúng bộ ba “giúp xác định” của chặng 1 và 2</td></tr>
          <tr><td>nhạy cảm</td><td>triệu chứng là “tình trạng sức khoẻ” — thuộc danh mục dữ liệu <b>nhạy cảm</b> (Nghị định 356, Điều 4.1.d): hỏi riêng, đúng mục đích, lưu có thời hạn — và miễn trừ cho doanh nghiệp nhỏ <b>không áp dụng</b></td></tr>
          <tr><td>ngưỡng</td><td>$100\,000 - 30\,000 = 70\,000$; chia 5000 → còn <b>14 tháng</b></td></tr>
          <tr><td>máy chủ nước ngoài</td><td>Luật 91, Điều 20.1.c: dùng nền tảng ở ngoài lãnh thổ để xử lý dữ liệu thu ở Việt Nam là <b>chuyển xuyên biên giới</b>; Điều 20.2: lập hồ sơ đánh giá, gửi trong <b>60 ngày</b> từ lần chuyển đầu — ca cụ thể thì hỏi người có chuyên môn pháp lý</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4", "1.5", "1.5"]
        say: "Đáp án câu một là một chuỗi lựa chọn có lý do. Hãy giữ năm sinh thay cho ngày sinh nếu đủ cho việc khám, và bỏ tổ dân phố vì đặt lịch không cần. Ngày sinh, giới tính và tổ chính là bộ ba giúp xác định ở chặng một và hai. Triệu chứng là tình trạng sức khoẻ, thuộc danh mục dữ liệu nhạy cảm của nghị định năm 2025. Vì vậy hãy hỏi riêng, đúng mục đích, lưu có thời hạn, và miễn trừ cho doanh nghiệp nhỏ không áp dụng. Về ngưỡng, 100 nghìn trừ 30 nghìn còn 70 nghìn, chia 5000 thì còn 14 tháng. Theo Điều 20, dùng nền tảng ở nước ngoài để xử lý dữ liệu thu ở Việt Nam là chuyển dữ liệu xuyên biên giới. Khi đó phải lập hồ sơ đánh giá và gửi trong 60 ngày từ lần chuyển đầu, còn ca cụ thể thì hỏi người có chuyên môn pháp lý."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2</th><th>đáp án</th></tr>
          <tr><td>hạn báo</td><td>phát hiện thứ Sáu 6/11 lúc 17:00 + 72 giờ = <b>thứ Hai 9/11 lúc 17:00</b> — cuối tuần vẫn tính</td></tr>
          <tr><td>đợt báo đầu</td><td>điều đã biết: thời gian, loại dữ liệu, số người có thể bị ảnh hưởng, người liên hệ, việc đã làm để chặn (gỡ quyền công khai)</td></tr>
          <tr><td>được gì, mất gì</td><td>báo sớm khi chưa đủ thông tin thì phải bổ sung sau; đợi đủ thì có thể quá hạn và người bị ảnh hưởng chậm được biết</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: nếu đánh giá cho thấy vi phạm không thuộc loại có thể gây tổn hại mà Điều 23.1 nêu, vẫn ghi biên bản nội bộ và tra điều khoản trước khi quyết định không báo.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Đáp án câu hai, phát hiện lúc 17 giờ thứ Sáu ngày 6 tháng 11, cộng 72 giờ là 17 giờ thứ Hai ngày 9 tháng 11, và cuối tuần vẫn tính. Đợt báo đầu gồm điều đã biết, như thời gian, loại dữ liệu, số người có thể bị ảnh hưởng, người liên hệ, và việc đã làm để chặn. Báo sớm khi chưa đủ thông tin thì phải bổ sung sau, còn đợi đủ thì có thể quá hạn, và người bị ảnh hưởng chậm được biết. Nếu đánh giá cho thấy vi phạm không thuộc loại có thể gây tổn hại mà luật nêu, vẫn ghi biên bản nội bộ và tra điều khoản trước khi quyết định không báo."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2000: bỏ tên vẫn 87% duy nhất</span><span class="a">→</span>
          <span class="n">2018: chuẩn mực nghề — tối thiểu, có hạn lưu, gộp cẩn thận</span><span class="a">→</span>
          <span class="n">2023: nghị định, báo vi phạm 72 giờ</span><span class="a">→</span>
          <span class="n">2025: luật, phạt tới 5% doanh thu, 72 giờ từ khi phát hiện</span><span class="a">→</span>
          <span class="n">2026–2031: nghĩa vụ theo quy mô, ngưỡng 100 nghìn</span></div>
        say: "Tổng kết lại hành trình. Năm 2000, bỏ tên vẫn để 87 phần trăm dân số duy nhất. Năm 2018, chuẩn mực nghề nghiệp ghi thu tối thiểu, có hạn lưu và gộp cẩn thận. Năm 2023, một nghị định đặt hạn báo vi phạm 72 giờ. Năm 2025, một đạo luật phạt tới 5 phần trăm doanh thu và tính 72 giờ từ khi phát hiện. Từ 2026 tới 2031, nghĩa vụ đi theo quy mô, với ngưỡng 100 nghìn người."
      - show: |
          <div class="box key"><b>Tư duy:</b> luật đi sau kỹ thuật, nhưng câu hỏi thì đã có từ trước: “tổ hợp này có giúp nhận ra một người không?”. Tính số tổ hợp, đếm số người, thu ít nhất có thể — và tra toàn văn có chữ ký số, ghi ngày đọc, trước khi kết luận về nghĩa vụ.</div>
        say: "Điều cần mang theo, luật đi sau kỹ thuật, nhưng câu hỏi thì đã có từ trước, tổ hợp này có giúp nhận ra một người không. Hãy tính số tổ hợp, đếm số người, thu ít nhất có thể, và tra toàn văn có chữ ký số, ghi ngày đọc, trước khi kết luận về nghĩa vụ."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá SEP. Bạn đã đi từ câu hỏi “ai chịu hậu quả của phần mềm” tới cách cả một xã hội đặt luật cho dữ liệu cá nhân.</p>
        say: "Đây là bài cuối của khoá xã hội, đạo đức và nghề nghiệp trong tin học. Bạn đã đi từ câu hỏi ai chịu hậu quả của phần mềm, tới cách cả một xã hội đặt luật cho dữ liệu cá nhân. Cảm ơn bạn đã theo học."
