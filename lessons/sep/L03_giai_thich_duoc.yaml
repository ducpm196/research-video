id: L03
course: SEP
series: "SEP · Xã hội, đạo đức và nghề nghiệp trong tin học"
title: "Bài 3 — Giải thích được và trách nhiệm giải trình: lý do phản chứng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sep.yaml L03; audit/sep/sources_L03.md (câu trích nguyên văn, đọc 2026-11-02); audit/sep/verify_sep.py L03; S. Wachter, B. Mittelstadt, C. Russell, Counterfactual Explanations without Opening the Black Box: Automated Decisions and the GDPR (arXiv 1711.00399) [W17]; ACM Code of Ethics 2018, nguyên tắc 1.3, 1.4 [ACM18]; khoá CS115 bài 18 (tổng có trọng số của hồi quy tuyến tính)"
assumes: []
# Quy ước: mô hình chấm điểm vay là SỐ MINH HOẠ: điểm = 0,5 × thu nhập (triệu đồng mỗi tháng) + 2 × số năm làm việc, ngưỡng 20,
#   điểm ≥ 20 thì duyệt. “Khoảng thiếu” = ngưỡng − điểm. “Lý do phản chứng” = câu “nếu … đã khác thì quyết định đã khác” (W17).
#   Câu mẫu bảng Anh của W17 chép nguyên văn trên màn hình, lời đọc dịch nghĩa. Không bàn quy định pháp lý về quyền được giải thích
#   (W17 bàn GDPR; GDPR chưa đọc nguyên văn trong phiên — NOT_VERIFIED).
objectives:
  - "Tính khoảng thiếu tới ngưỡng và thay đổi nhỏ nhất của từng thuộc tính làm đổi quyết định của một mô hình điểm tuyến tính"
  - "Viết một lý do phản chứng chỉ dùng thuộc tính người được giải thích thay đổi được"
  - "Nhận ra khi giải thích bằng mô hình xấp xỉ sai ở đúng trường hợp cần giải thích"
  - "Ghi lại một quyết định đủ để kiểm tra và tái hiện về sau"
asr_reviewed:
  - {sentence: "Bài dùng bốn từ.", reason: "ASR chép “Bài dùng bốn tư.” (0.75): lệch âm/thanh thuần Việt: từ/bốn — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Vì sao tôi bị từ chối?” — và câu trả lời “do mô hình”"
    checks:
      - "0.5 * 20 + 2 * 3 == 16 and 16 < 20"
      - "0.5 * 28 + 2 * 3 == 20 and 0.5 * 20 + 2 * 5 == 20"
    steps:
      - show: |
          <p>Một ứng dụng cho vay chấm điểm hồ sơ (số minh hoạ): chị Hoa thu nhập <b>20 triệu</b> mỗi tháng, làm việc <b>3 năm</b>, được <b>16 điểm</b>; ngưỡng duyệt là <b>20</b>. Hồ sơ bị từ chối.</p>
          <p>Chị gọi tổng đài hỏi vì sao. Câu trả lời “do hệ thống tự chấm” không giúp chị làm gì tiếp. Một câu trả lời khác: <b>“Nếu thu nhập của chị là 28 triệu, hoặc chị đã làm việc 5 năm, hồ sơ đã được duyệt.”</b></p>
          <div class="box key">Hôm nay: (1) tìm thay đổi nhỏ nhất làm đổi quyết định thế nào? (2) khi nào lời giải thích tự nó sai? (3) ghi gì để quyết định kiểm tra được về sau?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, hãy hình dung một ứng dụng cho vay chấm điểm hồ sơ, với số minh hoạ. Chị Hoa có thu nhập 20 triệu mỗi tháng, làm việc 3 năm, được 16 điểm, trong khi ngưỡng duyệt là 20, nên hồ sơ bị từ chối. Chị gọi tổng đài hỏi vì sao, và câu trả lời do hệ thống tự chấm không giúp chị làm gì tiếp. Một câu trả lời khác là, nếu thu nhập của chị là 28 triệu, hoặc chị đã làm việc 5 năm, thì hồ sơ đã được duyệt. Hôm nay ta học cách tìm câu trả lời đó, khi nào nó sai, và phải ghi gì để kiểm tra lại được."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại tổng có trọng số và giải phương trình bậc nhất"
    checks:
      - "0.5 * 20 == 10 and 2 * 3 == 6 and 10 + 6 == 16"
      - "(20 - 6) / 0.5 == 28"
    steps:
      - show: |
          <p><b>① Tổng có trọng số.</b> Ở khoá Toán cho khoa học máy tính, hồi quy tuyến tính dự đoán bằng cách nhân mỗi đầu vào với một trọng số rồi cộng lại.</p>
          <table class="t"><tr><th>đầu vào</th><th>giá trị</th><th>trọng số</th><th>đóng góp</th></tr>
          <tr><td>thu nhập (triệu/tháng)</td><td>20</td><td>0,5</td><td>0,5 × 20 = 10</td></tr>
          <tr><td>số năm làm việc</td><td>3</td><td>2</td><td>2 × 3 = 6</td></tr>
          <tr><td colspan="3">điểm</td><td>10 + 6 = 16</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Điều thứ nhất là tổng có trọng số. Ở khoá Toán cho khoa học máy tính, hồi quy tuyến tính dự đoán bằng cách nhân mỗi đầu vào với một trọng số rồi cộng lại. Thu nhập 20 triệu nhân trọng số 0 phẩy 5 đóng góp 10 điểm. Ba năm làm việc nhân trọng số 2 đóng góp 6 điểm, nên tổng là 16 điểm."
      - show: |
          <p><b>② Giải phương trình bậc nhất một ẩn</b> bằng chuyển vế rồi chia: tìm thu nhập $x$ để điểm bằng 20 khi số năm vẫn là 3.</p>
          $$0{,}5 \times x + 6 = 20 \;\Rightarrow\; 0{,}5 \times x = 14 \;\Rightarrow\; x = \frac{14}{0{,}5} = 28$$
        introduces: [implies]
        focus: [1, 2, 2]
        say: "Điều thứ hai là giải phương trình bậc nhất một ẩn. Ta tìm thu nhập x để điểm bằng 20 khi số năm vẫn là 3, tức 0 phẩy 5 nhân x cộng 6 bằng 20. Mũi tên kép đọc là suy ra, nên chuyển 6 sang vế phải được 0 phẩy 5 nhân x bằng 14, rồi chia cho 0 phẩy 5 được x bằng 28."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ngưỡng, khoảng thiếu, lý do phản chứng"
    checks:
      - "20 - 16 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>từ</th><th>nghĩa</th><th>ví dụ của chị Hoa</th></tr>
          <tr><td><b>ngưỡng</b></td><td>điểm tối thiểu để được duyệt</td><td>20</td></tr>
          <tr><td><b>khoảng thiếu</b></td><td>ngưỡng trừ điểm hiện tại</td><td>20 − 16 = 4 điểm</td></tr>
          <tr><td><b>lý do phản chứng</b></td><td>câu “nếu điều này đã khác, quyết định đã khác”</td><td>“nếu thu nhập là 28 triệu…”</td></tr>
          <tr><td><b>trách nhiệm giải trình</b></td><td>có thể chỉ ra ai quyết định, dựa trên gì, và sửa khi sai</td><td>nhật ký quyết định</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn từ. Ngưỡng là điểm tối thiểu để được duyệt, ở đây là 20. Khoảng thiếu là ngưỡng trừ điểm hiện tại, với chị Hoa là 20 trừ 16, bằng 4 điểm. Lý do phản chứng là câu nếu điều này đã khác thì quyết định đã khác. Trách nhiệm giải trình là có thể chỉ ra ai quyết định, dựa trên gì, và sửa khi sai."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Lý do phản chứng: thế giới gần nhất có kết quả khác"
    steps:
      - show: |
          <p>Bài báo năm 2017 của ba nhà nghiên cứu ở Anh (Wachter, Mittelstadt, Russell) đưa ra câu mẫu:</p>
          <div class="box key">“You were denied a loan because your annual income was £30,000. If your income had been £45,000, you would have been offered a loan.”</div>
          <p class="note">Dịch: “Bạn bị từ chối vì thu nhập năm là 30&nbsp;000 bảng; nếu thu nhập là 45&nbsp;000 bảng, bạn đã được duyệt.” Ý then chốt của họ là <b>thay đổi nhỏ nhất</b> để có kết quả mong muốn — “thế giới khả dĩ gần nhất”.</p>
        focus: [1, 2, 3, 3]
        say: "Một bài báo năm 2017 của ba nhà nghiên cứu ở Anh đưa ra câu mẫu như trên màn hình. Dịch ra là, bạn bị từ chối vì thu nhập năm là 30 nghìn bảng Anh, nếu thu nhập là 45 nghìn bảng thì bạn đã được duyệt. Ý then chốt của họ là thay đổi nhỏ nhất để có kết quả mong muốn. Họ gọi đó là thế giới khả dĩ gần nhất."
      - show: |
          <table class="t"><tr><th>lời giải thích phản chứng</th><th>cho người bị từ chối</th></tr>
          <tr><td>không cần mở hộp đen</td><td>chỉ cần hỏi mô hình nhiều lần với đầu vào đã đổi</td></tr>
          <tr><td>cho biết phải làm gì tiếp</td><td>tăng thu nhập, chờ thêm thâm niên</td></tr>
          <tr><td>cho căn cứ để khiếu nại</td><td>nếu thông tin đầu vào sai, chỉ ra được ngay</td></tr></table>
          <p class="note">Bộ quy tắc ACM: nói đủ <b>khả năng và giới hạn</b> của hệ thống (1.3); quy trình quyết định phải có <b>đường khiếu nại</b> (1.4).</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Lời giải thích phản chứng có ba lợi ích cho người bị từ chối. Nó không cần mở hộp đen, vì chỉ cần hỏi mô hình nhiều lần với đầu vào đã đổi. Nó cho biết phải làm gì tiếp, như tăng thu nhập hay chờ thêm thâm niên. Nó cho căn cứ để khiếu nại, vì nếu thông tin đầu vào sai thì chỉ ra được ngay. Điều này khớp với nguyên tắc 1 chấm 3 và 1 chấm 4 của bộ quy tắc nghề nghiệp, về nói đủ giới hạn và có đường khiếu nại."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đường ranh giới và hai mũi tên ngắn nhất"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><defs><marker id="sep3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
          <line x1="100" y1="420" x2="900" y2="420" stroke="#1f2937" stroke-width="2"/><line x1="100" y1="420" x2="100" y2="40" stroke="#1f2937" stroke-width="2"/>
          <text x="900" y="455" font-size="22" text-anchor="end" fill="#1f2937">thu nhập (triệu/tháng): 0 → 40</text>
          <text x="115" y="40" font-size="22" fill="#1f2937">số năm: 0 → 10</text>
          <polygon points="100,40 900,420 900,40" fill="#dcfce7" opacity="0.7"/>
          <line x1="100" y1="40" x2="900" y2="420" stroke="#059669" stroke-width="3"/>
          <text x="560" y="150" font-size="23" fill="#059669" font-weight="bold">vùng duyệt: điểm ≥ 20</text>
          <text x="560" y="390" font-size="23" fill="#b91c1c">vùng từ chối</text>
          <circle cx="500" cy="306" r="11" fill="#2a78d6"/><text x="470" y="320" font-size="22" text-anchor="end" fill="#2a78d6">chị Hoa (20; 3)</text>
          <line x1="512" y1="306" x2="650" y2="306" stroke="#eb6834" stroke-width="4" marker-end="url(#sep3a)"/>
          <line x1="500" y1="294" x2="500" y2="240" stroke="#eb6834" stroke-width="4" marker-end="url(#sep3a)"/>
          <text x="600" y="345" font-size="22" fill="#eb6834">+8 triệu</text><text x="485" y="262" font-size="22" text-anchor="end" fill="#eb6834">+2 năm</text>
          <g font-size="23" fill="#1f2937">
          <text x="960" y="120">đường xanh: 0,5 × thu nhập + 2 × năm = 20</text>
          <text x="960" y="180">mỗi mũi tên là một lý do phản chứng:</text>
          <text x="960" y="215">đi ngắn nhất theo MỘT hướng tới ranh giới</text>
          <text x="960" y="290" fill="#b91c1c">trọng số càng lớn, mũi tên càng ngắn</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mặt phẳng với thu nhập nằm ngang và số năm làm việc nằm dọc. Đường xanh là ranh giới, nơi 0 phẩy 5 nhân thu nhập cộng 2 nhân số năm đúng bằng 20, phía trên là vùng duyệt. Chị Hoa là chấm xanh ở 20 triệu và 3 năm, nằm dưới ranh giới. Hai mũi tên cam là hai lý do phản chứng, đi ngắn nhất theo một hướng tới ranh giới, thêm 8 triệu hoặc thêm 2 năm."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra thay đổi cần cho từng thuộc tính"
    checks:
      - "20 - 16 == 4"
      - "4 / 0.5 == 8 and 4 / 2 == 2"
      - "0.5 * 4 + 2 * 1 == 4"
    steps:
      - show: |
          <p><b>Bước 1 — khoảng thiếu.</b> Theo định nghĩa: khoảng thiếu = ngưỡng − điểm = $20 - 16 = 4$ điểm.</p>
          <p><b>Bước 2 — đổi một thuộc tính.</b> Vì thêm 1 đơn vị của thuộc tính thì điểm tăng đúng bằng trọng số của nó, nên:</p>
          $$\text{thay đổi cần} = \frac{\text{khoảng thiếu}}{\text{trọng số}}$$
        focus: [1, 2, 3]
        say: "Bước một, theo định nghĩa, khoảng thiếu bằng ngưỡng trừ điểm, tức 20 trừ 16, bằng 4 điểm. Bước hai, vì thêm 1 đơn vị của một thuộc tính thì điểm tăng đúng bằng trọng số của nó. Nên thay đổi cần bằng khoảng thiếu chia cho trọng số."
      - show: |
          <p><b>Bước 3 — làm thử ngay.</b></p>
          <table class="t"><tr><th>thuộc tính</th><th>trọng số</th><th>thay đổi cần</th></tr>
          <tr><td>thu nhập</td><td>0,5</td><td>$\frac{4}{0{,}5} = \hlo{8}$ triệu → 28 triệu</td></tr>
          <tr><td>số năm làm việc</td><td>2</td><td>$\frac{4}{2} = \hlo{2}$ năm → 5 năm</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, làm thử ngay. Thu nhập có trọng số 0 phẩy 5, nên cần thêm 4 chia 0 phẩy 5, bằng 8 triệu, tức 28 triệu. Số năm có trọng số 2, nên cần thêm 4 chia 2, bằng 2 năm, tức 5 năm."
      - clear: true
        show: |
          <p><b>Bước 4 — đổi cùng lúc hai thuộc tính.</b> Theo phép cộng của tổng có trọng số, phần tăng của hai thuộc tính cộng lại phải đủ khoảng thiếu:</p>
          $$0{,}5 \times (\text{thu nhập thêm}) + 2 \times (\text{số năm thêm}) = 4$$
          <p class="note">Làm thử: thêm 4 triệu và 1 năm: $0{,}5 \times 4 + 2 \times 1 = 2 + 2 = 4$ ✓ — cũng là một lý do phản chứng.</p>
        focus: [1, 2, 3]
        say: "Bước bốn là đổi cùng lúc hai thuộc tính. Theo phép cộng của tổng có trọng số, 0 phẩy 5 nhân thu nhập thêm, cộng 2 nhân số năm thêm, phải đủ khoảng thiếu 4 điểm. Làm thử với thêm 4 triệu và 1 năm, 0 phẩy 5 nhân 4 cộng 2 nhân 1 bằng 4, nên đây cũng là một lý do phản chứng."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Hồ sơ thứ hai: anh Nam, 30 triệu, 1 năm"
    checks:
      - "0.5 * 30 + 2 * 1 == 17"
      - "20 - 17 == 3"
      - "3 / 0.5 == 6 and 3 / 2 == 1.5"
      - "0.5 * 36 + 2 * 1 == 20 and 0.5 * 30 + 2 * 2.5 == 20"
    steps:
      - show: |
          <p><b>Bước 1.</b> Điểm của anh Nam: $0{,}5 \times 30 + 2 \times 1 = 15 + 2 = \hlb{17}$.</p>
        say: "Bước một, điểm của anh Nam là 0 phẩy 5 nhân 30 cộng 2 nhân 1, tức 15 cộng 2, bằng 17 điểm."
      - show: |
          <p><b>Bước 1.</b> Điểm: 17.</p>
          <p><b>Bước 2.</b> Khoảng thiếu: $20 - 17 = \hl{3}$ điểm.</p>
          <p><b>Bước 3.</b> Thu nhập cần thêm $\frac{3}{0{,}5} = 6$ triệu; hoặc số năm cần thêm $\frac{3}{2} = 1{,}5$ năm.</p>
        focus: [2, 3, 3]
        say: "Bước hai, khoảng thiếu là 20 trừ 17, bằng 3 điểm. Bước ba, thu nhập cần thêm 3 chia 0 phẩy 5, bằng 6 triệu. Hoặc số năm làm việc cần thêm 3 chia 2, bằng 1 phẩy 5 năm."
      - clear: true
        show: |
          <p><b>Bước 4.</b> Viết lời giải thích cho anh Nam, rồi thay lại vào mô hình:</p>
          <table class="t"><tr><th>lý do phản chứng</th><th>thay lại vào mô hình</th><th>kết quả</th></tr>
          <tr><td>“nếu thu nhập là 36 triệu”</td><td>$0{,}5 \times 36 + 2 \times 1$</td><td>20 → duyệt</td></tr>
          <tr><td>“nếu đã làm việc 2,5 năm”</td><td>$0{,}5 \times 30 + 2 \times 2{,}5$</td><td>20 → duyệt</td></tr></table>
          <p class="note">So với chị Hoa: anh Nam thiếu ít hơn (3 so với 4), nên các mũi tên ngắn hơn.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước bốn, ta viết lời giải thích cho anh Nam rồi thay lại vào mô hình. Nếu thu nhập là 36 triệu, điểm bằng 18 cộng 2, đúng 20, được duyệt. Nếu đã làm việc 2 phẩy 5 năm, điểm bằng 15 cộng 5, cũng đúng 20. So với chị Hoa, anh Nam thiếu ít hơn, 3 điểm so với 4, nên các mũi tên ngắn hơn."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: thay ngược và dò từng bước"
    checks:
      - "0.5 * 28 + 2 * 3 == 20 and 0.5 * 27 + 2 * 3 < 20"
      - "min(x for x in range(0, 100) if 0.5 * x + 2 * 3 >= 20) == 28"
    steps:
      - show: |
          <table class="t"><tr><th>đường kiểm</th><th>kết quả</th></tr>
          <tr><td>thay ngược: thu nhập 28, 3 năm</td><td>$0{,}5 \times 28 + 6 = 20$ — đúng ngưỡng ✓</td></tr>
          <tr><td>thử một triệu ít hơn: 27</td><td>$0{,}5 \times 27 + 6 = 19{,}5$ — vẫn bị từ chối, nên 28 là <b>nhỏ nhất</b> ✓</td></tr>
          <tr><td>dò bằng máy: thử 0, 1, 2, … triệu cho tới khi đủ 20</td><td>dừng ở 28 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta kiểm theo ba đường. Thay ngược thu nhập 28 và 3 năm, điểm đúng bằng ngưỡng 20. Thử ít hơn một triệu, 27 triệu cho 19 phẩy 5 điểm, vẫn bị từ chối, nên 28 là nhỏ nhất. Cuối cùng cho máy dò lần lượt 0, 1, 2 triệu cho tới khi đủ 20 điểm, máy cũng dừng ở 28."

  # ───────────────────────── 9. NHẬT KÝ ─────────────────────────
  - id: log
    kind: concept
    title: "Trách nhiệm giải trình: ghi gì cho mỗi quyết định"
    steps:
      - show: |
          <table class="t"><tr><th>trường cần ghi</th><th>ví dụ hồ sơ chị Hoa</th><th>để làm gì</th></tr>
          <tr><td>thời điểm, mã hồ sơ</td><td>2/11/2026 09:15, HS-0417</td><td>tìm lại đúng quyết định</td></tr>
          <tr><td>phiên bản mô hình và ngưỡng</td><td>bản 3, ngưỡng 20</td><td>tái hiện điểm khi mô hình đã đổi</td></tr>
          <tr><td>đầu vào đã dùng</td><td>thu nhập 20, 3 năm</td><td>phát hiện dữ liệu sai</td></tr>
          <tr><td>điểm, quyết định, lý do phản chứng đã gửi</td><td>16, từ chối, “+8 triệu hoặc +2 năm”</td><td>khi khiếu nại, so được lời đã nói với mô hình</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Lời giải thích chỉ có giá trị khi quyết định kiểm tra lại được, nên mỗi quyết định cần một dòng nhật ký. Ghi thời điểm và mã hồ sơ để tìm lại đúng quyết định. Ghi phiên bản mô hình và ngưỡng để tái hiện điểm khi mô hình đã đổi. Ghi đầu vào đã dùng để phát hiện dữ liệu sai. Ghi điểm, quyết định và lý do phản chứng đã gửi, để khi có khiếu nại thì so được lời đã nói với mô hình."

  # ───────────────────────── 10. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "0.5 * 36 + 2 * 1 == 20"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 — của người đã đi làm.</b> Giải thích một mô hình phức tạp bằng mô hình đơn giản xấp xỉ <b class="red">(sai đúng chỗ cần giải thích)</b>
          <br><span class="note">Giả sử mô hình thật có thêm luật: <b>dưới 2 năm làm việc thì từ chối</b>, bất kể điểm. Mô hình xấp xỉ tuyến tính vẫn bảo anh Nam “thêm 6 triệu là được”.</span></div>
          <table class="t"><tr><th>anh Nam: 36 triệu, 1 năm</th><th>điểm</th><th>quyết định</th></tr>
          <tr><td>theo mô hình xấp xỉ</td><td>20</td><td>duyệt</td></tr>
          <tr><td>theo mô hình thật</td><td>20</td><td class="red">từ chối — chưa đủ 2 năm</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Lỗi thứ nhất hay gặp ở người đã đi làm, là giải thích một mô hình phức tạp bằng một mô hình đơn giản xấp xỉ nó. Giả sử mô hình thật có thêm luật dưới 2 năm làm việc thì từ chối, bất kể điểm. Mô hình xấp xỉ vẫn bảo anh Nam thêm 6 triệu là được, tức 36 triệu đủ 20 điểm. Nhưng mô hình thật vẫn từ chối vì anh chưa đủ 2 năm, nên lời giải thích sai đúng ở người cần nó."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gợi ý thay đổi điều người ta không thể hay không nên đổi <b class="red">(tuổi, giới tính, nơi sinh)</b>
          <br><span class="note">Bài báo năm 2017 nhắc: lý do hữu ích còn tuỳ việc biến đó có <b>đổi được</b> không. Chỉ đưa phản chứng trên thuộc tính người đó đổi được.</span></div>
        say: "Lỗi thứ hai là gợi ý thay đổi điều người ta không thể hay không nên đổi, như tuổi, giới tính hay nơi sinh. Bài báo năm 2017 nhắc rằng lời giải thích hữu ích còn tuỳ việc biến đó có đổi được không. Hãy chỉ đưa lý do phản chứng trên thuộc tính người đó đổi được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Không ghi phiên bản mô hình và ngưỡng <b class="red">(không tái hiện được)</b>
          <br><span class="note">Ba tháng sau ngưỡng đổi thành 22; khiếu nại đến, không ai biết lúc đó hồ sơ được chấm theo ngưỡng nào.</span></div>
          <table class="t"><tr><th>hồ sơ chị Hoa, 16 điểm</th><th>khoảng thiếu</th></tr><tr><td>ngưỡng 20</td><td>4</td></tr><tr><td>ngưỡng 22</td><td>6</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba là không ghi phiên bản mô hình và ngưỡng. Ba tháng sau ngưỡng đổi thành 22, khiếu nại đến, và không ai biết lúc đó hồ sơ được chấm theo ngưỡng nào. Với 16 điểm, khoảng thiếu có thể là 4 hoặc 6, nên lời giải thích cũ không kiểm lại được."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Chỉ đưa đúng một phản chứng <b class="red">(có thể không khả thi với người đó)</b>
          <br><span class="note">Bài báo năm 2017 gợi ý đưa vài lý do khác nhau: “thêm 8 triệu”, “thêm 2 năm”, hoặc “thêm 4 triệu và 1 năm”.</span></div>
        say: "Lỗi thứ tư là chỉ đưa đúng một lý do phản chứng, có thể không khả thi với người đó. Bài báo năm 2017 gợi ý đưa vài lý do khác nhau, ví dụ thêm 8 triệu, thêm 2 năm, hoặc thêm 4 triệu và 1 năm."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: mô hình ba thuộc tính"
    checks:
      - "abs(0.4 * 25 + 3 * 2 + 5 * 0 - 16) < 1e-9 and 25 - 16 == 9"
      - "abs(9 / 0.4 - 22.5) < 1e-9 and 9 / 3 == 3"
      - "abs(0.4 * 25 + 3 * 2 + 5 * 1 - 21) < 1e-9 and abs(4 / 0.4 - 10) < 1e-9 and round(4 / 3, 2) == 1.33"
    steps:
      - show: |
          <p>Mô hình (số minh hoạ): điểm = 0,4 × thu nhập + 3 × số năm + 5 × (có tài sản đảm bảo: 1, không: 0); ngưỡng <b>25</b>. Anh Tuấn: thu nhập 25 triệu, 2 năm, không có tài sản đảm bảo.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Điểm và khoảng thiếu của anh Tuấn?</td></tr>
          <tr><td>2</td><td>Thay đổi cần nếu chỉ đổi thu nhập, hoặc chỉ đổi số năm?</td></tr>
          <tr><td>3</td><td>Nếu có tài sản đảm bảo thì còn thiếu bao nhiêu? Bạn gửi anh lời giải thích nào, và ghi gì vào nhật ký?</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Điểm bằng 0 phẩy 4 nhân thu nhập, cộng 3 nhân số năm, cộng 5 nếu có tài sản đảm bảo, và ngưỡng là 25. Anh Tuấn có thu nhập 25 triệu, làm việc 2 năm, không có tài sản đảm bảo. Câu một, điểm và khoảng thiếu của anh là bao nhiêu? Câu hai, thay đổi cần nếu chỉ đổi thu nhập, hoặc chỉ đổi số năm? Câu ba, nếu có tài sản đảm bảo thì còn thiếu bao nhiêu, bạn gửi lời giải thích nào và ghi gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$0{,}4 \times 25 + 3 \times 2 + 0 = 10 + 6$</td><td>16 điểm; thiếu $25 - 16 = \hl{9}$</td></tr>
          <tr><td>2</td><td>$\frac{9}{0{,}4}$ và $\frac{9}{3}$</td><td>+22,5 triệu (→ 47,5) hoặc +3 năm (→ 5 năm)</td></tr></table>
        focus: ["1.2", "1.3", "1.3"]
        say: "Đáp án câu một, điểm bằng 0 phẩy 4 nhân 25 cộng 3 nhân 2, tức 10 cộng 6, bằng 16, nên khoảng thiếu là 9 điểm. Câu hai, chỉ đổi thu nhập thì cần thêm 9 chia 0 phẩy 4, bằng 22 phẩy 5 triệu. Chỉ đổi số năm thì cần thêm 9 chia 3, bằng 3 năm."
      - clear: true
        show: |
          <p><b>Câu 3.</b> Có tài sản đảm bảo: $16 + 5 = 21$, còn thiếu 4 → thêm $\frac{4}{0{,}4} = 10$ triệu, hoặc $\frac{4}{3} \approx 1{,}33$ năm.</p>
          <table class="t"><tr><th>quyết định</th><th>lý do</th></tr>
          <tr><td>gửi ba lựa chọn: +3 năm; hoặc tài sản đảm bảo kèm +10 triệu; hoặc tài sản kèm thêm khoảng 1,33 năm</td><td>+22,5 triệu gần như không khả thi; nhiều lựa chọn giúp người đó tự chọn đường</td></tr>
          <tr><td>ghi: phiên bản mô hình, ngưỡng 25, đầu vào, điểm 16, ba lý do đã gửi</td><td>khiếu nại sau này tái hiện được đúng lời đã nói</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Câu ba, nếu có tài sản đảm bảo, điểm lên 21, còn thiếu 4, nên cần thêm 10 triệu hoặc khoảng 1 phẩy 33 năm. Vì thêm 22 phẩy 5 triệu gần như không khả thi, bạn nên gửi ba lựa chọn, thêm 3 năm, hoặc tài sản đảm bảo kèm 10 triệu, hoặc tài sản kèm khoảng 1 phẩy 33 năm. Hãy ghi phiên bản mô hình, ngưỡng 25, đầu vào, điểm 16 và ba lý do đã gửi, để khiếu nại sau này tái hiện được."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">điểm = tổng có trọng số</span><span class="a">→</span>
          <span class="n">khoảng thiếu = ngưỡng − điểm</span><span class="a">→</span>
          <span class="n">thay đổi cần = khoảng thiếu chia trọng số</span><span class="a">→</span>
          <span class="n">vài lý do trên thuộc tính đổi được, kiểm trên mô hình thật, ghi nhật ký</span></div>
        say: "Tổng kết lại, điểm là tổng có trọng số, khoảng thiếu là ngưỡng trừ điểm, và thay đổi cần bằng khoảng thiếu chia trọng số. Từ đó ta đưa vài lý do phản chứng trên thuộc tính đổi được, kiểm chúng trên chính mô hình thật, và ghi nhật ký quyết định."
      - show: |
          <div class="box key"><b>Tư duy:</b> một lời giải thích là một <b>lời hứa có thể kiểm tra</b>. Trước khi gửi, thay nó ngược vào chính mô hình đang chạy; nếu không thay được, đừng gửi.</div>
        say: "Điều cần mang theo, một lời giải thích là một lời hứa có thể kiểm tra. Trước khi gửi, hãy thay nó ngược vào chính mô hình đang chạy, và nếu không thay được thì đừng gửi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>giấy phép phần mềm và mã nguồn mở</b> — dùng mã của người khác thì phải làm gì, và khi nào một thư viện buộc ta mở mã của mình.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học về giấy phép phần mềm và mã nguồn mở. Dùng mã của người khác thì phải làm gì, và khi nào một thư viện buộc ta mở mã của chính mình. Hẹn gặp bạn ở bài tiếp theo."
