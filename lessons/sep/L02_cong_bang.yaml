id: L02
course: SEP
series: "SEP · Xã hội, đạo đức và nghề nghiệp trong tin học"
title: "Bài 2 — Công bằng có định lượng: các tiêu chí và vì sao không thể đạt tất cả"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sep.yaml L02; audit/sep/sources_L02.md (câu trích nguyên văn, đọc 2026-11-02); audit/sep/verify_sep.py L02; A. Chouldechova, Fair prediction with disparate impact (arXiv 1703.00056, 2017) — phương trình (2.6) [C17]; J. Kleinberg, S. Mullainathan, M. Raghavan, Inherent Trade-Offs in the Fair Determination of Risk Scores (arXiv 1609.05807) — Định lý 1.1 [K16]; ACM Code of Ethics 2018, nguyên tắc 1.4 [ACM18]; khoá CS115 bài 21 (ma trận nhầm lẫn)"
assumes: []
# Quy ước: mọi tỉ lệ tính trên 100 người mỗi nhóm (số minh hoạ). Tên tiếng Việt: tỉ lệ nền (base rate), tỉ lệ dương thật (TPR),
#   tỉ lệ dương giả (FPR), giá trị dự đoán dương (PPV), tỉ lệ được chọn. Chữ viết tắt tiếng Anh chỉ trên màn hình, lời đọc nói tên Việt.
#   Ký hiệu p = tỉ lệ nền của một nhóm (số thập phân). Hai nhóm A, B và bộ lọc hồ sơ là tình huống minh hoạ, không phải dữ liệu thật.
#   Định lý không thể đạt mọi tiêu chí: CITED [C17], [K16]; bài chỉ dạy điều kiện “tỉ lệ nền khác nhau”, không dạy chứng minh tổng quát.
objectives:
  - "Tính tỉ lệ được chọn, tỉ lệ dương thật, tỉ lệ dương giả và giá trị dự đoán dương cho từng nhóm từ bảng nhầm lẫn"
  - "Suy ra liên hệ giữa tỉ lệ dương giả, tỉ lệ nền và giá trị dự đoán dương, rồi kiểm bằng số"
  - "Giải thích vì sao khi tỉ lệ nền khác nhau, không thể làm mọi tiêu chí bằng nhau cùng lúc"
  - "Chọn tiêu chí ưu tiên theo hậu quả của từng loại sai trong một bối cảnh cụ thể"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng tỉ lệ lỗi, mà một nhóm bị chọn nhầm gấp ba"
    checks:
      - "round(16 / 24, 3) == 0.667 and round(40 / 45, 3) == 0.889"
      - "round(8 / 24 / (5 / 45)) == 3"
    steps:
      - show: |
          <p>Một bộ lọc chọn hồ sơ để mời phỏng vấn (số minh hoạ). Đội kiểm tra thấy: ở cả hai nhóm A và B, bộ lọc bắt đúng <b>80%</b> người giỏi và chọn nhầm <b>10%</b> người chưa đạt — “lỗi như nhau”.</p>
          <p>Nhưng trong số người <b>được chọn</b>: nhóm A có 1 trên 9 người chọn nhầm, nhóm B có <b>1 trên 3</b> — gấp ba.</p>
          <div class="box key">Hôm nay: (1) đo công bằng bằng những con số nào? (2) vì sao không thể làm mọi con số bằng nhau? (3) chọn tiêu chí nào, theo lý do gì?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, hãy hình dung một bộ lọc chọn hồ sơ để mời phỏng vấn, với số minh hoạ. Đội kiểm tra thấy ở cả hai nhóm A và B, bộ lọc bắt đúng 80 phần trăm người giỏi và chọn nhầm 10 phần trăm người chưa đạt, tức là lỗi như nhau. Nhưng trong số người được chọn, nhóm A có 1 trên 9 người bị chọn nhầm, còn nhóm B có 1 trên 3, gấp ba lần. Hôm nay ta trả lời ba câu hỏi, đo công bằng bằng những con số nào, vì sao không thể làm mọi con số bằng nhau, và chọn tiêu chí nào theo lý do gì."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bảng nhầm lẫn và phép chia tỉ lệ"
    checks:
      - "40 + 10 + 5 + 45 == 100 and 40 / 50 == 0.8 and 5 / 50 == 0.1"
      - "round(40 / 45, 3) == 0.889"
    steps:
      - show: |
          <p>Ở khoá Toán cho khoa học máy tính, ta đã dùng <b>bảng nhầm lẫn</b>: đặt kết quả thật cạnh dự đoán. Ví dụ 100 người, 50 người giỏi thật:</p>
          <table class="t"><tr><th></th><th>dự đoán “chọn”</th><th>dự đoán “loại”</th></tr>
          <tr><td>thật sự giỏi (50)</td><td>đúng dương: 40</td><td>sai âm: 10</td></tr>
          <tr><td>chưa đạt (50)</td><td>sai dương: 5</td><td>đúng âm: 45</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã dùng bảng nhầm lẫn, đặt kết quả thật cạnh dự đoán. Với 100 người, 50 người giỏi thật, có 40 người được chọn đúng và 10 người bị loại oan. Trong 50 người chưa đạt, 5 người bị chọn nhầm và 45 người bị loại đúng."
      - show: |
          <p><b>Tỉ lệ = phần chia cho toàn bộ hàng hay cột mình quan tâm.</b></p>
          <table class="t"><tr><th>câu hỏi</th><th>chia cho</th><th>kết quả</th></tr>
          <tr><td>người giỏi được chọn bao nhiêu?</td><td>hàng “giỏi”: $\frac{40}{50}$</td><td>0,8</td></tr>
          <tr><td>người chưa đạt bị chọn nhầm bao nhiêu?</td><td>hàng “chưa đạt”: $\frac{5}{50}$</td><td>0,1</td></tr>
          <tr><td>người được chọn mà giỏi thật bao nhiêu?</td><td>cột “chọn”: $\frac{40}{40 + 5}$</td><td>0,889</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Một tỉ lệ là phần chia cho toàn bộ hàng hay cột mà mình quan tâm. Người giỏi được chọn bao nhiêu thì chia theo hàng giỏi, 40 chia 50 bằng 0 phẩy 8. Người chưa đạt bị chọn nhầm thì chia theo hàng chưa đạt, 5 chia 50 bằng 0 phẩy 1. Còn người được chọn mà giỏi thật thì chia theo cột chọn, 40 chia 45, xấp xỉ 0 phẩy 889."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bốn tỉ lệ và chữ p"
    steps:
      - show: |
          <table class="t"><tr><th>tên (viết tắt trên màn hình)</th><th>nghĩa</th><th>ví dụ trên</th></tr>
          <tr><td>tỉ lệ nền $p$</td><td>phần người thật sự giỏi trong nhóm</td><td>50 / 100 = 0,5</td></tr>
          <tr><td>tỉ lệ dương thật (TPR)</td><td>trong người giỏi, bao nhiêu được chọn</td><td>0,8</td></tr>
          <tr><td>tỉ lệ dương giả (FPR)</td><td>trong người chưa đạt, bao nhiêu bị chọn nhầm</td><td>0,1</td></tr>
          <tr><td>giá trị dự đoán dương (PPV)</td><td>trong người được chọn, bao nhiêu giỏi thật</td><td>0,889</td></tr>
          <tr><td>tỉ lệ được chọn</td><td>trong cả nhóm, bao nhiêu được chọn</td><td>45 / 100 = 0,45</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm con số, chữ viết tắt chỉ để trên màn hình. Tỉ lệ nền, ký hiệu p, là phần người thật sự giỏi trong nhóm, ở đây 0 phẩy 5. Tỉ lệ dương thật là trong người giỏi, bao nhiêu được chọn, ở đây 0 phẩy 8. Tỉ lệ dương giả là trong người chưa đạt, bao nhiêu bị chọn nhầm, ở đây 0 phẩy 1. Giá trị dự đoán dương là trong người được chọn, bao nhiêu giỏi thật, ở đây 0 phẩy 889. Tỉ lệ được chọn là trong cả nhóm, bao nhiêu người được chọn, ở đây 0 phẩy 45."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: criteria
    kind: concept
    title: "Ba cách hiểu “đối xử như nhau”"
    steps:
      - show: |
          <table class="t"><tr><th>tiêu chí</th><th>đòi hai nhóm bằng nhau ở</th><th>câu hỏi nó trả lời</th></tr>
          <tr><td>1. cân bằng tỉ lệ chọn</td><td>tỉ lệ được chọn</td><td>mỗi nhóm có cùng cơ hội được mời không?</td></tr>
          <tr><td>2. cân bằng lỗi</td><td>tỉ lệ dương thật và tỉ lệ dương giả</td><td>người cùng năng lực có cùng khả năng bị sai không?</td></tr>
          <tr><td>3. cân bằng dự đoán</td><td>giá trị dự đoán dương</td><td>một tấm vé “được chọn” có cùng ý nghĩa ở hai nhóm không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Có ít nhất ba cách hiểu đối xử như nhau, mỗi cách trả lời một câu hỏi khác. Cân bằng tỉ lệ chọn hỏi mỗi nhóm có cùng cơ hội được mời không. Cân bằng lỗi hỏi người cùng năng lực có cùng khả năng bị chọn sai hay loại oan không. Cân bằng dự đoán hỏi một tấm vé được chọn có cùng ý nghĩa ở hai nhóm không."
      - show: |
          <div class="box key">Hai bài báo năm 2016–2017 chứng minh: khi <b>tỉ lệ nền khác nhau</b> giữa hai nhóm và bộ lọc không hoàn hảo, các tiêu chí này <b>không thể cùng thoả</b>. Đây là giới hạn toán học, không phải lỗi cài đặt.</div>
          <p class="note">Chouldechova (2017); Kleinberg, Mullainathan, Raghavan (2016): chỉ có thể đạt cùng lúc khi dự đoán hoàn hảo hoặc tỉ lệ nền bằng nhau.</p>
        focus: [1, 2]
        say: "Hai bài báo năm 2016 và 2017 đã chứng minh rằng khi tỉ lệ nền khác nhau giữa hai nhóm và bộ lọc không hoàn hảo, các tiêu chí này không thể cùng thoả. Đây là giới hạn toán học, không phải lỗi cài đặt, và chỉ biến mất khi dự đoán hoàn hảo hoặc tỉ lệ nền bằng nhau."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "100 người mỗi nhóm: ai được chọn"
    steps:
      - show: |
          <div><svg width="1600" height="420" viewBox="0 0 1600 420">
          <g font-size="23" fill="#1f2937">
          <text x="20" y="60" font-weight="bold">nhóm A (50 giỏi)</text>
          <rect x="250" y="30" width="400" height="50" fill="#16a34a"/><rect x="650" y="30" width="100" height="50" fill="#bbf7d0"/>
          <rect x="750" y="30" width="50" height="50" fill="#dc2626"/><rect x="800" y="30" width="450" height="50" fill="#e5e7eb"/>
          <text x="450" y="112" text-anchor="middle">40 chọn đúng</text><text x="700" y="112" text-anchor="middle">10 loại oan</text>
          <text x="775" y="146" text-anchor="middle" fill="#b91c1c">5 chọn nhầm</text><text x="1025" y="112" text-anchor="middle">45 loại đúng</text>
          <text x="20" y="250" font-weight="bold">nhóm B (20 giỏi)</text>
          <rect x="250" y="220" width="160" height="50" fill="#16a34a"/><rect x="410" y="220" width="40" height="50" fill="#bbf7d0"/>
          <rect x="450" y="220" width="80" height="50" fill="#dc2626"/><rect x="530" y="220" width="720" height="50" fill="#e5e7eb"/>
          <text x="330" y="302" text-anchor="middle">16 đúng</text><text x="430" y="336" text-anchor="middle">4 oan</text>
          <text x="490" y="302" text-anchor="middle" fill="#b91c1c">8 nhầm</text><text x="890" y="302" text-anchor="middle">72 loại đúng</text>
          </g>
          <g font-size="23" fill="#1f2937">
          <text x="1290" y="50">được chọn: 45</text><text x="1290" y="84">giỏi thật: 40 / 45</text>
          <text x="1290" y="240">được chọn: 24</text><text x="1290" y="274" fill="#b91c1c" font-weight="bold">giỏi thật: 16 / 24</text>
          </g>
          <text x="800" y="400" font-size="23" fill="#6b7280" text-anchor="middle">cùng tỉ lệ bắt đúng 0,8 và chọn nhầm 0,1 — nhưng nhóm B có ít người giỏi hơn, nên phần chọn nhầm chiếm nhiều hơn</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ 100 người mỗi nhóm thành một thanh dài. Nhóm A có 50 người giỏi, bộ lọc chọn đúng 40, và trong 50 người chưa đạt chỉ chọn nhầm 5, nên 40 trên 45 người được chọn là giỏi thật. Nhóm B chỉ có 20 người giỏi, chọn đúng 16, nhưng 80 người chưa đạt cho ra 8 người bị chọn nhầm. Vì vậy chỉ 16 trên 24 người được chọn ở nhóm B là giỏi thật, dù tỉ lệ lỗi như nhau."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra mối liên hệ giữa các tỉ lệ"
    checks:
      - "100 * 0.5 * 0.8 == 40 and 100 * 0.5 * 0.1 == 5"
      - "round(40 / (40 + 5), 3) == 0.889"
      - "abs(0.5 / 0.5 * ((1 - 40 / 45) / (40 / 45)) * 0.8 - 0.1) < 1e-12"
    steps:
      - show: |
          <p><b>Bước 1 — đếm đúng và nhầm trên 100 người.</b> Theo nghĩa các tỉ lệ: người giỏi là $100p$, nhân tỉ lệ dương thật ra số chọn đúng; người chưa đạt là $100(1 - p)$, nhân tỉ lệ dương giả ra số chọn nhầm.</p>
          $$\text{đúng} = 100 \times p \times \text{TPR} \qquad \text{nhầm} = 100 \times (1 - p) \times \text{FPR}$$
          <p class="note">Làm thử nhóm A: $100 \times 0{,}5 \times 0{,}8 = 40$; $100 \times 0{,}5 \times 0{,}1 = 5$.</p>
        focus: [1, 2, 3]
        say: "Bước một, theo nghĩa các tỉ lệ, số người giỏi là 100 nhân p, nhân với tỉ lệ dương thật thì ra số được chọn đúng. Số người chưa đạt là 100 nhân 1 trừ p, nhân với tỉ lệ dương giả thì ra số bị chọn nhầm. Làm thử với nhóm A, 100 nhân 0 phẩy 5 nhân 0 phẩy 8 bằng 40, còn 100 nhân 0 phẩy 5 nhân 0 phẩy 1 bằng 5."
      - show: |
          <p><b>Bước 2 — giá trị dự đoán dương.</b> Vì nó là phần giỏi thật trong cột “chọn”:</p>
          $$\text{PPV} = \frac{\text{đúng}}{\text{đúng} + \text{nhầm}} \qquad \text{nhóm A: } \frac{40}{40 + 5} \approx 0{,}889$$
        focus: [1, 2]
        say: "Bước hai, vì giá trị dự đoán dương là phần giỏi thật trong cột chọn, nó bằng số đúng chia cho số đúng cộng số nhầm. Với nhóm A, 40 chia 45, xấp xỉ 0 phẩy 889."
      - clear: true
        show: |
          <p><b>Bước 3 — chuyển vế.</b> Từ bước 2, số nhầm = số đúng × $\frac{1 - \text{PPV}}{\text{PPV}}$. Thay số đúng, số nhầm từ bước 1 rồi chia hai vế cho $100(1 - p)$:</p>
          $$\text{FPR} = \hlo{\frac{p}{1 - p} \times \frac{1 - \text{PPV}}{\text{PPV}} \times \text{TPR}}$$
          <p class="note">Làm thử nhóm A: $\frac{0{,}5}{0{,}5} \times \frac{0{,}111}{0{,}889} \times 0{,}8 \approx 0{,}1$ ✓. Đây là phương trình (2.6) trong bài báo năm 2017 của Chouldechova.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Bước ba là chuyển vế. Từ bước hai, số nhầm bằng số đúng nhân 1 trừ giá trị dự đoán dương, chia cho chính nó. Thay số đúng và số nhầm từ bước một, rồi chia hai vế cho 100 nhân 1 trừ p. Kết quả là tỉ lệ dương giả bằng p chia 1 trừ p, nhân 1 trừ giá trị dự đoán dương chia giá trị đó, nhân tỉ lệ dương thật. Làm thử với nhóm A, kết quả xấp xỉ 0 phẩy 1, đúng với giả thiết."
      - show: |
          <div class="box key"><b>Ý nghĩa:</b> nếu hai nhóm có cùng giá trị dự đoán dương và cùng tỉ lệ dương thật, nhưng $p$ khác nhau, thì thừa số $\frac{p}{1 - p}$ khác nhau buộc tỉ lệ dương giả <b>phải</b> khác nhau.</div>
        say: "Ý nghĩa của công thức là thế này. Giả sử hai nhóm có cùng giá trị dự đoán dương và cùng tỉ lệ dương thật, nhưng tỉ lệ nền p khác nhau. Khi đó, vì thừa số p chia 1 trừ p khác nhau, tỉ lệ dương giả buộc phải khác nhau."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Nhóm A tỉ lệ nền 50%, nhóm B 20%: từng phép tính"
    checks:
      - "100 * 0.2 * 0.8 == 16 and abs(100 * 0.8 * 0.1 - 8) < 1e-9"
      - "round(16 / 24, 3) == 0.667"
      - "45 / 100 == 0.45 and 24 / 100 == 0.24"
      - "round(0.2 / 0.8 * ((1 - 8 / 9) / (8 / 9)) * 0.8, 3) == 0.025"
    steps:
      - show: |
          <p><b>Bước 1.</b> Nhóm B, 100 người, $p = 0{,}2$: chọn đúng $100 \times 0{,}2 \times 0{,}8 = 16$; chọn nhầm $100 \times 0{,}8 \times 0{,}1 = \hl{8}$.</p>
        say: "Bước một, với nhóm B có tỉ lệ nền 0 phẩy 2, số chọn đúng là 100 nhân 0 phẩy 2 nhân 0 phẩy 8, bằng 16. Số chọn nhầm là 100 nhân 0 phẩy 8 nhân 0 phẩy 1, bằng 8."
      - show: |
          <p><b>Bước 1.</b> Nhóm B: đúng 16, nhầm 8.</p>
          <p><b>Bước 2.</b> Giá trị dự đoán dương nhóm B: $\frac{16}{16 + 8} \approx \hlo{0{,}667}$, so với nhóm A là 0,889.</p>
          <p><b>Bước 3.</b> Tỉ lệ được chọn: nhóm A $\frac{45}{100} = 45\%$, nhóm B $\frac{24}{100} = 24\%$.</p>
        focus: [2, 3]
        say: "Bước hai, giá trị dự đoán dương của nhóm B là 16 chia 24, xấp xỉ 0 phẩy 667, thấp hơn hẳn 0 phẩy 889 của nhóm A. Bước ba, tỉ lệ được chọn của nhóm A là 45 phần trăm, của nhóm B là 24 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>tiêu chí</th><th>nhóm A</th><th>nhóm B</th><th>bằng nhau?</th></tr>
          <tr><td>tỉ lệ dương thật, tỉ lệ dương giả</td><td>0,8 và 0,1</td><td>0,8 và 0,1</td><td>có</td></tr>
          <tr><td>giá trị dự đoán dương</td><td>0,889</td><td>0,667</td><td class="red">không</td></tr>
          <tr><td>tỉ lệ được chọn</td><td>45%</td><td>24%</td><td class="red">không</td></tr></table>
          <p><b>Bước 4.</b> Muốn nhóm B cũng có giá trị dự đoán dương 0,889 mà giữ tỉ lệ dương thật 0,8, theo công thức: $\frac{0{,}2}{0{,}8} \times \frac{1}{8} \times 0{,}8 = \hlg{0{,}025}$ — tỉ lệ dương giả của B phải giảm còn 0,025, khác 0,1 của A.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đặt cạnh nhau, cân bằng lỗi thì đạt, vì cả hai nhóm có cùng 0 phẩy 8 và 0 phẩy 1. Nhưng giá trị dự đoán dương là 0 phẩy 889 so với 0 phẩy 667, không bằng. Tỉ lệ được chọn là 45 so với 24 phần trăm, cũng không bằng. Bước bốn, giả sử muốn nhóm B có giá trị dự đoán dương 0 phẩy 889 mà giữ tỉ lệ dương thật 0 phẩy 8. Khi đó công thức buộc tỉ lệ dương giả của B giảm còn 0 phẩy 025, khác hẳn 0 phẩy 1 của nhóm A."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác"
    checks:
      - "round(0.2 / 0.8 * ((1 - 2 / 3) / (2 / 3)) * 0.8, 6) == 0.1"
      - "16 + 4 + 8 + 72 == 100 and round((40 + 45) / 100, 2) == 0.85 and round((16 + 72) / 100, 2) == 0.88"
      - "round(0.025 * 80) == 2 and round(16 / 18, 3) == 0.889"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>tỉ lệ dương giả nhóm B = 0,1</td><td>thay ngược vào công thức: $\frac{0{,}2}{0{,}8} \times \frac{1/3}{2/3} \times 0{,}8 = 0{,}25 \times 0{,}5 \times 0{,}8 = 0{,}1$ ✓</td></tr>
          <tr><td>bảng nhóm B đủ 100 người</td><td>$16 + 4 + 8 + 72 = 100$ ✓</td></tr>
          <tr><td>tỉ lệ dương giả 0,025 cho giá trị dự đoán dương 0,889</td><td>$0{,}025 \times 80 = 2$ người nhầm; $\frac{16}{16 + 2} \approx 0{,}889$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại theo đường khác. Thay ngược số của nhóm B vào công thức, 0 phẩy 25 nhân 0 phẩy 5 nhân 0 phẩy 8 bằng 0 phẩy 1, khớp. Cộng bốn ô của nhóm B, 16 cộng 4 cộng 8 cộng 72 bằng đủ 100 người. Với tỉ lệ dương giả 0 phẩy 025, có 2 người bị chọn nhầm trong 80, nên 16 chia 18 xấp xỉ 0 phẩy 889, đúng như công thức dự đoán."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round((40 + 45) / 100, 2) == 0.85 and round((16 + 72) / 100, 2) == 0.88"
      - "round(1 / 20, 2) == 0.05"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ cột “nhóm” khỏi đầu vào là xong <b class="red">(biến khác thay thế)</b>
          <br><span class="note">Khu vực sống, trường học, thói quen mua sắm thường mang thông tin về nhóm. Phép thử bắt được: vẫn đo bốn tỉ lệ <b>theo từng nhóm</b> trên dữ liệu kiểm thử.</span></div>
          <table class="t"><tr><th>bỏ đi</th><th>vẫn còn trong dữ liệu</th></tr><tr><td>cột “nhóm”</td><td>khu vực, trường — đoán ra nhóm khá chính xác</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất là nghĩ bỏ cột nhóm khỏi đầu vào thì mô hình công bằng. Khu vực sống, trường học hay thói quen mua sắm thường mang thông tin về nhóm, nên mô hình vẫn học được. Phép thử bắt được lỗi này là vẫn đo bốn tỉ lệ theo từng nhóm trên dữ liệu kiểm thử."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ báo độ chính xác chung <b class="red">(che chênh lệch)</b>
          <br><span class="note">Nhóm A đúng $\frac{40 + 45}{100} = 0{,}85$, nhóm B đúng $\frac{16 + 72}{100} = 0{,}88$ — B trông “tốt hơn”, trong khi 1/3 người được chọn ở B là nhầm.</span></div>
        say: "Lỗi thứ hai là chỉ báo độ chính xác chung. Nhóm A đúng 85 phần trăm, nhóm B đúng 88 phần trăm, nên B trông còn tốt hơn. Trong khi đó một phần ba người được chọn ở nhóm B là chọn nhầm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Hứa “mô hình đạt mọi tiêu chí công bằng”, hoặc chọn tiêu chí <b>sau khi</b> thấy kết quả <b class="red">(không thể và không trung thực)</b>
          <br><span class="note">Khi tỉ lệ nền khác nhau, toán học không cho đạt hết. Chọn tiêu chí <b>trước</b>, theo hậu quả của từng loại sai, và ghi lại lý do.</span></div>
          <table class="t"><tr><th>bối cảnh</th><th>loại sai gây hại hơn</th><th>nên ưu tiên</th></tr>
          <tr><td>mời phỏng vấn</td><td>loại oan người giỏi</td><td>cân bằng tỉ lệ dương thật</td></tr>
          <tr><td>cảnh báo gian lận rồi khoá tài khoản</td><td>chọn nhầm người vô tội</td><td>cân bằng tỉ lệ dương giả</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là hứa mô hình đạt mọi tiêu chí công bằng, hoặc chọn tiêu chí sau khi thấy kết quả. Khi tỉ lệ nền khác nhau, toán học không cho đạt hết, nên hãy chọn tiêu chí trước, theo hậu quả của từng loại sai. Với việc mời phỏng vấn, loại oan người giỏi gây hại hơn, nên ưu tiên cân bằng tỉ lệ dương thật. Với cảnh báo gian lận rồi khoá tài khoản, chọn nhầm người vô tội gây hại hơn, nên ưu tiên cân bằng tỉ lệ dương giả."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đo trên nhóm quá nhỏ <b class="red">(con số nhảy lung tung)</b>
          <br><span class="note">Nhóm 20 người: thêm hay bớt 1 người làm tỉ lệ đổi $\frac{1}{20} = 5\%$. Ghi cỡ mẫu cạnh mỗi tỉ lệ; nhóm nhỏ thì gom thêm dữ liệu trước khi kết luận.</span></div>
        say: "Lỗi thứ tư là đo trên nhóm quá nhỏ. Với nhóm 20 người, thêm hay bớt một người đã làm tỉ lệ đổi 5 phần trăm. Hãy ghi cỡ mẫu cạnh mỗi tỉ lệ, và gom thêm dữ liệu trước khi kết luận về nhóm nhỏ."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chương trình hỗ trợ học phí"
    checks:
      - "abs(100 * 0.3 * 0.9 - 27) < 1e-9 and abs(100 * 0.7 * 0.2 - 14) < 1e-9 and round(27 / 41, 3) == 0.659"
      - "abs(100 * 0.1 * 0.9 - 9) < 1e-9 and abs(100 * 0.9 * 0.2 - 18) < 1e-9 and round(9 / 27, 3) == 0.333"
      - "round(0.1 / 0.9 * ((1 - 27 / 41) / (27 / 41)) * 0.9, 3) == 0.052"
    steps:
      - show: |
          <p>Một mô hình chọn sinh viên cần <b>hỗ trợ học phí</b> (số minh hoạ). Nhóm A: 30% thật sự cần; nhóm B: 10%. Cả hai nhóm: tỉ lệ dương thật 0,9, tỉ lệ dương giả 0,2.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Giá trị dự đoán dương và tỉ lệ được chọn của mỗi nhóm (100 người mỗi nhóm)?</td></tr>
          <tr><td>2</td><td>Để B có cùng giá trị dự đoán dương với A, giữ tỉ lệ dương thật 0,9, tỉ lệ dương giả của B phải bằng bao nhiêu?</td></tr>
          <tr><td>3</td><td>Bạn ưu tiên tiêu chí nào cho chương trình này, vì sao?</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Một mô hình chọn sinh viên cần hỗ trợ học phí, nhóm A có 30 phần trăm thật sự cần, nhóm B có 10 phần trăm. Ở cả hai nhóm, tỉ lệ dương thật là 0 phẩy 9 và tỉ lệ dương giả là 0 phẩy 2. Câu một, tính giá trị dự đoán dương và tỉ lệ được chọn của mỗi nhóm. Câu hai, muốn B có cùng giá trị dự đoán dương với A thì tỉ lệ dương giả của B phải bằng bao nhiêu? Câu ba, bạn ưu tiên tiêu chí nào, vì sao? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>đúng</th><th>nhầm</th><th>giá trị dự đoán dương</th><th>tỉ lệ được chọn</th></tr>
          <tr><td>nhóm A</td><td>$100 \times 0{,}3 \times 0{,}9 = 27$</td><td>$100 \times 0{,}7 \times 0{,}2 = 14$</td><td>$\frac{27}{41} \approx \hlo{0{,}659}$</td><td>41%</td></tr>
          <tr><td>nhóm B</td><td>$100 \times 0{,}1 \times 0{,}9 = 9$</td><td>$100 \times 0{,}9 \times 0{,}2 = 18$</td><td>$\frac{9}{27} \approx \hlo{0{,}333}$</td><td>27%</td></tr></table>
          <p><b>Câu 2.</b> $\frac{0{,}1}{0{,}9} \times \frac{1 - 0{,}659}{0{,}659} \times 0{,}9 \approx \hlg{0{,}052}$ — phải giảm gần 4 lần so với 0,2.</p>
        focus: ["1.2", "1.2", "1.3", 2]
        say: "Đáp án câu một, nhóm A có 27 người chọn đúng và 14 người chọn nhầm. Vậy giá trị dự đoán dương là 27 chia 41, xấp xỉ 0 phẩy 659, và tỉ lệ được chọn 41 phần trăm. Nhóm B có 9 đúng và 18 nhầm, nên chỉ 9 chia 27, xấp xỉ 0 phẩy 333, tỉ lệ được chọn 27 phần trăm. Câu hai, theo công thức, tỉ lệ dương giả của B phải xấp xỉ 0 phẩy 052, giảm gần 4 lần so với 0 phẩy 2."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>ưu tiên cân bằng tỉ lệ dương thật (giữ 0,9 cho cả hai)</td><td>người thật sự cần ở hai nhóm có cùng cơ hội được hỗ trợ</td><td>nhóm B có nhiều suất cấp nhầm hơn, tốn ngân sách</td></tr>
          <tr><td>ép cân bằng giá trị dự đoán dương</td><td>mỗi suất hỗ trợ có cùng “độ chắc” ở hai nhóm</td><td>phải siết ngưỡng ở B, dễ bỏ sót người thật sự cần</td></tr></table>
          <p class="note">Ở đây loại oan người cần hỗ trợ gây hại hơn cấp nhầm, nên nhiều đội sẽ ưu tiên dòng đầu; điều quan trọng là chọn trước, công bố lý do, và có đường khiếu nại.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đáp án câu ba là một đánh đổi. Ưu tiên cân bằng tỉ lệ dương thật thì người thật sự cần ở hai nhóm có cùng cơ hội, đổi lại nhóm B có nhiều suất cấp nhầm hơn. Ép cân bằng giá trị dự đoán dương thì phải siết ngưỡng ở B, dễ bỏ sót người thật sự cần. Ở đây loại oan người cần hỗ trợ gây hại hơn, nên nhiều đội sẽ ưu tiên cách đầu, miễn là chọn trước, công bố lý do và có đường khiếu nại."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bảng nhầm lẫn theo từng nhóm</span><span class="a">→</span>
          <span class="n">bốn tỉ lệ: dương thật, dương giả, dự đoán dương, được chọn</span><span class="a">→</span>
          <span class="n">tỉ lệ nền khác nhau → không thể bằng nhau hết</span><span class="a">→</span>
          <span class="n">chọn tiêu chí theo hậu quả, ghi lý do, có đường khiếu nại</span></div>
        say: "Tổng kết lại, ta lập bảng nhầm lẫn theo từng nhóm và tính bốn tỉ lệ. Khi tỉ lệ nền khác nhau, công thức liên hệ cho thấy không thể làm mọi tỉ lệ bằng nhau. Vì vậy phải chọn tiêu chí theo hậu quả của từng loại sai, ghi lại lý do, và có đường khiếu nại."
      - show: |
          <div class="box key"><b>Tư duy:</b> “công bằng” không phải một con số mà là một <b>lựa chọn có lý do</b>. Bộ quy tắc ACM, nguyên tắc 1.4, ghi: công bằng đòi hỏi ngay cả quy trình quyết định cẩn thận cũng phải có <b>đường khiếu nại</b>.</div>
        say: "Điều cần mang theo, công bằng không phải một con số mà là một lựa chọn có lý do. Bộ quy tắc của Hiệp hội Máy tính, ở nguyên tắc 1 chấm 4, ghi rằng ngay cả quy trình quyết định cẩn thận cũng phải có đường khiếu nại."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>giải thích được</b> — với một người bị từ chối, tìm thay đổi nhỏ nhất làm đổi quyết định, và ghi lại quyết định để kiểm tra về sau.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học cách giải thích được một quyết định. Với một người bị từ chối, ta tìm thay đổi nhỏ nhất làm đổi quyết định, và ghi lại quyết định để kiểm tra về sau. Hẹn gặp bạn ở bài tiếp theo."
