title: "Bài 9 — Ước lượng, cam kết và nói “chưa được”"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sep.yaml L09; audit/sep/sources_L09.md (câu trích nguyên văn, đọc 2026-11-02); audit/sep/verify_sep.py L09; ACM Code of Ethics 2018, nguyên tắc 1.3, 2.6 [ACM18]; DMS bài 19 (kỳ vọng, khoá khác)"
assumes: []
# Quy ước: O = số ngày lạc quan, M = khả dĩ nhất, B = bi quan (dùng B thay cho chữ P hay gặp, để khỏi lẫn ký hiệu xác suất);
#   E = ước lượng ba điểm (O + 4M + B)/6, s = độ lệch ước lượng (B − O)/6. Đây là “cách ước lượng ba điểm hay dùng trong quản lý dự án”;
#   bài KHÔNG gán công thức cho một nguồn cụ thể (chưa đọc nguyên văn nguồn gốc). Khoảng báo cáo E ± 2s là lựa chọn của bài, không kèm
#   phát biểu xác suất. Mọi số ngày (2, 4, 12; 3, 5, 13) là SỐ MINH HOẠ. Nhiều việc độc lập: cộng E, còn s cộng theo căn tổng bình phương.
objectives:
  - "Tính ước lượng ba điểm (O + 4M + B)/6 và độ lệch (B − O)/6 cho một việc và cho nhiều việc"
  - "Cam kết theo khoảng có lý do, không theo một con số khả dĩ"
  - "Nói “chưa được” bằng số liệu: nêu ước lượng, rủi ro lớn nhất, và phương án đổi phạm vi"
asr_reviewed:
  - {sentence: "E là ước lượng ba điểm gộp cả ba con số.", reason: "ASR chép “là ước lượng 3 điểm gục cả 3 con số.” (0.857): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: gộp/gục — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Bao giờ xong?” — 4 ngày, nếu mọi thứ suôn sẻ"
    checks:
      - "(2 + 4 * 4 + 12) / 6 == 5"
    steps:
      - show: |
          <p>Trưởng nhóm hỏi: tính năng mới bao giờ xong? Bạn nghĩ: suôn sẻ thì <b>2 ngày</b>, thường thì <b>4 ngày</b>, nhưng nếu phần ghép với hệ thống thanh toán trục trặc thì có thể <b>12 ngày</b> (số minh hoạ).</p>
          <p>Bạn trả lời “4 ngày” — con số khả dĩ nhất. Nhưng ước lượng có tính cả rủi ro lại cho <b>5 ngày</b>.</p>
          <div class="box key">Hôm nay: (1) gộp ba con số thành một ước lượng thế nào? (2) vì sao hứa “4 ngày” dễ trễ? (3) nói “chưa được” sao cho trung thực mà vẫn có ích?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, trưởng nhóm hỏi tính năng mới bao giờ xong. Bạn nghĩ nếu suôn sẻ thì 2 ngày, thường thì 4 ngày, nhưng nếu phần ghép với hệ thống thanh toán trục trặc thì có thể tới 12 ngày, với số minh hoạ. Bạn trả lời 4 ngày, con số khả dĩ nhất, nhưng ước lượng có tính cả rủi ro lại cho 5 ngày. Hôm nay ta trả lời ba câu hỏi, gộp ba con số thế nào, vì sao hứa 4 ngày dễ trễ, và nói chưa được sao cho trung thực mà vẫn có ích."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: trung bình có trọng số và kỳ vọng"
    checks:
      - "(6 * 1 + 9 * 2) / (1 + 2) == 8"
      - "sum(range(1, 7)) / 6 == 3.5 and 100 * sum(range(1, 7)) == 2100 and 2100 / 600 == 3.5"
    steps:
      - show: |
          <p><b>① Trung bình có trọng số.</b> Mỗi số nhân với hệ số của nó, cộng lại, rồi chia cho tổng hệ số.</p>
          <table class="t"><tr><th>bài</th><th>điểm</th><th>hệ số</th></tr>
          <tr><td>kiểm tra 15 phút</td><td>6</td><td>1</td></tr>
          <tr><td>kiểm tra 1 tiết</td><td>9</td><td>2</td></tr></table>
          $$\frac{6 \times 1 + 9 \times 2}{1 + 2} = \frac{24}{3} = 8$$
        focus: [1, 2, 3]
        say: "Điều thứ nhất là trung bình có trọng số, mỗi số nhân với hệ số của nó, cộng lại, rồi chia cho tổng hệ số. Bài kiểm tra 15 phút được 6 điểm, hệ số 1, còn bài 1 tiết được 9 điểm, hệ số 2. Trung bình là 6 cộng 18, bằng 24, chia 3, được 8."
      - show: |
          <p><b>② Kỳ vọng.</b> Nhắc lại từ đầu: kỳ vọng là giá trị trung bình nếu lặp lại rất nhiều lần — tức một trung bình có trọng số, với trọng số là <b>xác suất</b> của từng kết quả.</p>
          <p class="note">Vì sao: tung xúc xắc 6 mặt 600 lần, mỗi mặt ra khoảng 100 lần, tổng điểm khoảng $100 \times 21 = 2100$, chia 600 lần được 3,5. Không mặt nào là 3,5, nhưng trung bình dài hạn là 3,5.</p>
          $$\frac{1 + 2 + 3 + 4 + 5 + 6}{6} = \frac{21}{6} = 3{,}5$$
        focus: [1, 2, 2, 3]
        say: "Điều thứ hai, nhắc lại từ đầu, kỳ vọng là giá trị trung bình nếu lặp lại rất nhiều lần, tức một trung bình có trọng số mà trọng số là xác suất của từng kết quả. Để thấy vì sao, hãy tung xúc xắc 6 mặt 600 lần, mỗi mặt ra khoảng 100 lần, nên tổng điểm khoảng 100 nhân 21, bằng 2100. Chia cho 600 lần tung ta được 3 phẩy 5, dù không mặt nào là 3 phẩy 5. Viết gọn, kỳ vọng là 21 chia 6, bằng 3 phẩy 5."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: O, M, B, E và s"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>$O$</td><td>lạc quan: mọi thứ suôn sẻ</td><td>2 ngày</td></tr>
          <tr><td>$M$</td><td>khả dĩ nhất: điều hay xảy ra nhất</td><td>4 ngày</td></tr>
          <tr><td>$B$</td><td>bi quan: rủi ro lớn xảy ra (không phải tận thế)</td><td>12 ngày</td></tr>
          <tr><td>$E$</td><td>ước lượng ba điểm, gộp cả ba</td><td>sẽ tính</td></tr>
          <tr><td>$s$</td><td>độ lệch: ước lượng chắc tới đâu</td><td>sẽ tính</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm chữ cái. O là số ngày lạc quan, khi mọi thứ suôn sẻ, ở đây là 2. M là khả dĩ nhất, điều hay xảy ra nhất, ở đây là 4. B là bi quan, khi rủi ro lớn xảy ra nhưng không phải tận thế, ở đây là 12. E là ước lượng ba điểm gộp cả ba con số. Còn s là độ lệch, cho biết ước lượng chắc tới đâu."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Ước lượng, mục tiêu, cam kết: ba thứ khác nhau"
    steps:
      - show: |
          <table class="t"><tr><th>từ</th><th>là gì</th><th>ai quyết</th></tr>
          <tr><td><b>ước lượng</b></td><td>dự đoán trung thực việc mất bao lâu, kèm độ chắc</td><td>người làm, theo dữ liệu</td></tr>
          <tr><td><b>mục tiêu</b></td><td>ngày mong muốn (vì khách, vì thị trường)</td><td>người quản lý</td></tr>
          <tr><td><b>cam kết</b></td><td>lời hứa sau khi so ước lượng với mục tiêu, có thể kèm cắt bớt phạm vi</td><td>cả hai, nói rõ với nhau</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ba từ hay bị dùng lẫn. Ước lượng là dự đoán trung thực việc mất bao lâu, kèm độ chắc, do người làm đưa ra theo dữ liệu. Mục tiêu là ngày mong muốn, vì khách hay vì thị trường, do người quản lý đặt. Cam kết là lời hứa sau khi so ước lượng với mục tiêu, có thể kèm cắt bớt phạm vi, và cả hai bên phải nói rõ với nhau."
      - show: |
          <div class="box key">Bộ quy tắc nghề nghiệp năm 2018: <b>1.3</b> — trung thực về trình độ và mọi <b>giới hạn năng lực</b> để hoàn thành việc; và <b>lời cam kết phải được giữ</b>. <b>2.6</b> — nếu thấy thiếu chuyên môn cần thiết, trước hay trong khi làm, <b>phải báo</b> cho người thuê.</div>
          $$\text{cam kết tốt} = \text{ước lượng trung thực} + \text{phạm vi rõ} + \text{báo sớm khi đổi}$$
        focus: [1, 1, 2]
        say: "Bộ quy tắc nghề nghiệp năm 2018 của Hiệp hội Máy tính, ở nguyên tắc 1 chấm 3, đòi trung thực về mọi giới hạn năng lực để hoàn thành việc, và lời cam kết phải được giữ. Nguyên tắc 2 chấm 6 nói nếu thấy thiếu chuyên môn cần thiết, trước hay trong khi làm, thì phải báo cho người thuê. Vậy muốn giữ được cam kết, nó phải dựa trên ước lượng trung thực, phạm vi rõ, và báo sớm khi có thay đổi."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vì sao trung bình lớn hơn khả dĩ: cái đuôi bên phải"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420">
          <path d="M120,330 C200,320 250,90 330,90 C430,90 520,260 700,300 C850,320 1050,328 1240,330" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/>
          <line x1="80" y1="330" x2="1300" y2="330" stroke="#1f2937" stroke-width="3"/>
          <g font-size="23" text-anchor="middle" fill="#1f2937">
          <line x1="190" y1="330" x2="190" y2="345" stroke="#1f2937" stroke-width="3"/><text x="190" y="375">O = 2</text>
          <line x1="330" y1="80" x2="330" y2="345" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="375" fill="#059669" font-weight="bold">M = 4</text>
          <line x1="400" y1="140" x2="400" y2="345" stroke="#eb6834" stroke-width="3"/><text x="430" y="405" fill="#eb6834" font-weight="bold">E = 5</text>
          <line x1="890" y1="330" x2="890" y2="345" stroke="#dc2626" stroke-width="3"/><text x="890" y="375" fill="#dc2626">B = 12</text>
          <text x="330" y="60" fill="#059669">đỉnh: hay xảy ra nhất</text>
          <text x="820" y="250">đuôi dài: tích hợp trục trặc, chờ người khác…</text>
          </g>
          <text x="1360" y="338" font-size="23" fill="#1f2937">ngày</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là khả năng hoàn thành theo số ngày. Đỉnh nằm ở M bằng 4, điều hay xảy ra nhất. Nhưng bên phải có một cái đuôi dài, vì việc ghép hệ thống trục trặc hay chờ người khác chỉ làm chậm thêm, hiếm khi làm nhanh hơn. Cái đuôi đó kéo trung bình sang phải, nên ước lượng E bằng 5 lớn hơn M."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra ước lượng ba điểm từng bước"
    checks:
      - "1 + 4 + 1 == 6 and (3 + 4 * 3 + 3) / 6 == 3"
      - "(8 - 2) / 6 == 1"
    steps:
      - show: |
          <p><b>Bước 1 — trung bình có trọng số.</b> Vì M hay xảy ra nhất, cho nó hệ số 4; O và B mỗi số hệ số 1. Tổng hệ số $1 + 4 + 1 = 6$, nên theo cách tính ở phần ôn nền:</p>
          $$E = \frac{O + 4M + B}{6}$$
          <p class="note">Làm thử khi cả ba bằng nhau, O = M = B = 3: $\frac{3 + 12 + 3}{6} = 3$ — đúng như mong đợi.</p>
        focus: [1, 2, 3]
        introduces: [frac]
        say: "Bước một, vì M hay xảy ra nhất nên cho nó hệ số 4, còn O và B mỗi số hệ số 1, tổng hệ số là 6. Theo cách tính trung bình có trọng số ở phần ôn nền, E bằng O cộng 4 M cộng B, tất cả chia 6. Làm thử khi cả ba bằng 3, ta được 18 chia 6, bằng 3, đúng như mong đợi."
      - show: |
          <p><b>Bước 2 — độ lệch.</b> Khoảng từ lạc quan tới bi quan càng rộng thì ước lượng càng kém chắc; cách ước lượng này lấy một phần sáu khoảng đó:</p>
          $$s = \frac{B - O}{6}$$
          <p class="note">Làm thử: O = 2, B = 8 → $s = \frac{6}{6} = 1$ ngày. Đơn vị của $s$ giống $E$: ngày.</p>
        focus: [1, 2, 3]
        say: "Bước hai, ta tính độ lệch của ước lượng, tức độ rộng của khoảng bất định. Vì khoảng từ lạc quan tới bi quan càng rộng thì ước lượng càng kém chắc, cách ước lượng này lấy một phần sáu khoảng đó, s bằng B trừ O, chia 6. Làm thử với O bằng 2 và B bằng 8, s bằng 6 chia 6, tức 1 ngày, cùng đơn vị với E."
      - clear: true
        show: |
          <p><b>Bước 3 — báo một khoảng.</b> Thay vì một con số, báo E kèm khoảng rộng 2 lần độ lệch mỗi bên:</p>
          $$\text{khoảng báo} = E - 2s \;\text{ tới }\; E + 2s$$
          <p class="note">Làm thử với E = 5, s = 1: từ 3 tới 7 ngày. Khoảng rộng hay hẹp nói cho người nghe biết bạn chắc tới đâu.</p>
        focus: [1, 2, 3]
        say: "Bước ba, thay vì một con số, ta báo E kèm một khoảng rộng 2 lần độ lệch về mỗi bên, từ E trừ 2 s tới E cộng 2 s. Làm thử với E bằng 5 và s bằng 1, khoảng là từ 3 tới 7 ngày. Khoảng rộng hay hẹp nói cho người nghe biết bạn chắc tới đâu."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Lạc quan 2, khả dĩ 4, bi quan 12: từng phép tính"
    checks:
      - "2 + 4 * 4 + 12 == 30"
      - "30 / 6 == 5"
      - "round((12 - 2) / 6, 2) == 1.67"
      - "round(5 - 2 * (12 - 2) / 6, 2) == 1.67 and round(5 + 2 * (12 - 2) / 6, 2) == 8.33"
    steps:
      - show: |
          <p><b>Bước 1.</b> Tử số: $O + 4M + B = 2 + 4 \times 4 + 12 = 2 + 16 + 12 = \hlb{30}$.</p>
          <p><b>Bước 2.</b> Chia cho tổng hệ số: $E = \frac{30}{6} = \hlo{5}$ ngày.</p>
        focus: [1, 2]
        say: "Bước một, tính tử số, 2 cộng 4 nhân 4 cộng 12, tức 2 cộng 16 cộng 12, bằng 30. Bước hai, chia cho tổng hệ số 6, được E bằng 5 ngày."
      - show: |
          <p><b>Bước 3.</b> Độ lệch: $s = \frac{12 - 2}{6} = \frac{10}{6} \approx \hlb{1{,}67}$ ngày.</p>
          <p><b>Bước 4.</b> Khoảng báo: $5 - 2 \times 1{,}67 \approx 1{,}67$ tới $5 + 2 \times 1{,}67 \approx \hlg{8{,}33}$ ngày (chỉ ước chừng: cận dưới 1,67 thấp hơn số lạc quan 2, cận trên 8,33 thấp hơn số bi quan 12).</p>
        focus: [1, 2]
        say: "Bước ba, độ lệch bằng 12 trừ 2, chia 6, tức 10 chia 6, khoảng 1 phẩy 67 ngày. Bước bốn, khoảng báo là 5 trừ 2 lần 1 phẩy 67 tới 5 cộng 2 lần 1 phẩy 67, tức 1 phẩy 67 tới 8 phẩy 33 ngày, chỉ ước chừng, cận dưới thấp hơn lạc quan."
      - clear: true
        show: |
          <table class="t"><tr><th>cách trả lời</th><th>con số</th><th>so với ước lượng</th></tr>
          <tr><td>“4 ngày” (khả dĩ M)</td><td>4</td><td class="red">thấp hơn E = 5: hứa theo kịch bản không có rủi ro</td></tr>
          <tr><td>“khoảng 5 ngày, có thể tới 8–9 ngày nếu phần thanh toán trục trặc”</td><td>5, tới 8,33</td><td>nói rõ rủi ro lớn nhất và độ chắc</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bảng đặt hai cách trả lời cạnh nhau. Nói 4 ngày là hứa theo con số khả dĩ, thấp hơn ước lượng 5, tức hứa theo kịch bản không có rủi ro. Nói khoảng 5 ngày, có thể tới 8 hay 9 ngày nếu phần thanh toán trục trặc, là nói rõ cả rủi ro lớn nhất lẫn độ chắc."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác: tách từng phần trọng số"
    checks:
      - "round(2 * 1 / 6 + 4 * 4 / 6 + 12 * 1 / 6, 9) == 5"
      - "2 <= 5 <= 12 and 4 < 5"
    steps:
      - show: |
          <p>Đường khác: tính phần đóng góp của từng con số, rồi cộng lại.</p>
          <table class="t"><tr><th>con số</th><th>trọng số</th><th>đóng góp</th></tr>
          <tr><td>O = 2</td><td>$\frac{1}{6}$</td><td>$2 \times \frac{1}{6} \approx 0{,}33$</td></tr>
          <tr><td>M = 4</td><td>$\frac{4}{6}$</td><td>$4 \times \frac{4}{6} \approx 2{,}67$</td></tr>
          <tr><td>B = 12</td><td>$\frac{1}{6}$</td><td>$12 \times \frac{1}{6} = 2$</td></tr></table>
          <p class="note">Cộng: $0{,}33 + 2{,}67 + 2 = 5$ ✓. Riêng B đóng góp 2 ngày dù chỉ có trọng số một phần sáu — đó là cái đuôi bên phải.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Ta kiểm theo đường khác, tính phần đóng góp của từng con số. O bằng 2 với trọng số một phần sáu đóng góp khoảng 0 phẩy 33. M bằng 4 với trọng số bốn phần sáu đóng góp khoảng 2 phẩy 67. B bằng 12 với trọng số một phần sáu đóng góp đúng 2. Cộng lại được 5, khớp, và riêng B đóng góp 2 ngày, đó chính là cái đuôi bên phải."
      - show: |
          <div class="box key"><b>Kiểm bằng lý lẽ:</b> E luôn nằm giữa O và B, vì nó là trung bình có trọng số của chúng: $2 \leq 5 \leq 12$. Và khi B xa M hơn O, thì E lớn hơn M.</div>
          $$O \leq E \leq B \qquad 2 \leq 5 \leq 12$$
        focus: [1, 2]
        say: "Kiểm thêm bằng lý lẽ, E luôn nằm giữa O và B vì nó là trung bình có trọng số của chúng, ở đây 5 nằm giữa 2 và 12. Và vì B cách M xa hơn O cách M, nên E lớn hơn M."

  # ───────────────────────── 9. NÓI “CHƯA ĐƯỢC” ─────────────────────────
  - id: say_no
    kind: concept
    title: "Nói “chưa được” bằng số liệu"
    steps:
      - show: |
          <p>Trưởng nhóm: “Khách cần trong <b>3 ngày</b>.” Ước lượng của bạn: E = 5, khoảng tới 8,33.</p>
          <table class="t"><tr><th>câu trả lời</th><th>vì sao</th></tr>
          <tr><td class="red">“Dạ, 3 ngày được ạ.”</td><td>làm vui lòng hôm nay, chuyển rủi ro sang sau — dễ trễ, mất uy tín</td></tr>
          <tr><td class="red">“Không thể.”</td><td>đúng một phần, nhưng không giúp ai quyết định</td></tr>
          <tr><td>“3 ngày thì chưa được với phạm vi này: ước lượng 5, rủi ro lớn nhất là phần thanh toán. Nếu bỏ trang báo cáo, phần còn lại khoảng 3 ngày. Chiều mai tôi báo lại sau khi thử ghép thanh toán.”</td><td>ước lượng + rủi ro + phương án đổi phạm vi + ngày cập nhật</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Giả sử trưởng nhóm nói khách cần trong 3 ngày, trong khi ước lượng của bạn là 5. Trả lời dạ 3 ngày được ạ là làm vui lòng hôm nay mà chuyển rủi ro sang sau, dễ trễ và mất uy tín. Trả lời không thể thì đúng một phần, nhưng không giúp ai quyết định. Cách tốt hơn là nói 3 ngày chưa được với phạm vi này, ước lượng 5, rủi ro lớn nhất là phần thanh toán. Rồi đưa phương án, nếu bỏ trang báo cáo thì phần còn lại khoảng 3 ngày, và hẹn chiều mai báo lại."

  # ───────────────────────── 10. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "3 * 4 == 12 and 3 * 5 == 15"
      - "round((3 * (10 / 6) ** 2) ** 0.5, 2) == 2.89"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đưa con số khả dĩ M làm cam kết <b class="red">(4 &lt; E = 5)</b>
          <br><span class="note">M là đỉnh của hình, không phải trung bình; cái đuôi bên phải làm việc trễ hơn M thường xuyên.</span></div>
          $$M = 4 \;<\; E = 5$$
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất là đưa con số khả dĩ M làm cam kết. M là đỉnh của hình chứ không phải trung bình. Cái đuôi bên phải làm việc trễ hơn M thường xuyên, nên 4 nhỏ hơn ước lượng 5."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ba việc giống nhau, cộng ba con số khả dĩ <b class="red">(12 thay vì 15)</b></div>
          <table class="t"><tr><th>cách cộng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>cộng M</td><td>$4 + 4 + 4$</td><td>12 ngày</td></tr>
          <tr><td>cộng E (đúng)</td><td>$5 + 5 + 5$</td><td>15 ngày</td></tr>
          <tr><td>độ lệch của tổng (ba việc độc lập)</td><td>$\sqrt{3 \times 1{,}67^2}$</td><td>$\approx 2{,}89$, không phải $3 \times 1{,}67 \approx 5$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        introduces: [sqrt]
        say: "Lỗi thứ hai là có ba việc giống nhau mà cộng ba con số khả dĩ. Cộng M được 12 ngày. Cộng E mới đúng, được 15 ngày. Với ba việc độc lập, độ lệch của tổng là căn của 3 nhân 1 phẩy 67 bình phương, khoảng 2 phẩy 89, vì các việc không cùng trễ một lúc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Coi ước lượng như cuộc mặc cả <b class="red">(bị ép từ 5 xuống 3 mà phạm vi giữ nguyên)</b>
          <br><span class="note">Ước lượng không phải đàm phán: rút ngắn để người nghe vui là chuyển rủi ro sang sau. Đàm phán <b>phạm vi</b> hay <b>nguồn lực</b>, không đàm phán con số.</span></div>
          <table class="t"><tr><th>thứ được đàm phán</th><th>ví dụ</th></tr>
          <tr><td>phạm vi</td><td>bỏ trang báo cáo → khoảng 3 ngày</td></tr>
          <tr><td>con số ước lượng</td><td class="red">không — nó là dự đoán, không phải giá</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là coi ước lượng như một cuộc mặc cả, bị ép từ 5 xuống 3 mà phạm vi giữ nguyên. Ước lượng không phải đàm phán, rút ngắn để người nghe vui là chuyển rủi ro sang sau. Hãy đàm phán phạm vi hay nguồn lực, ví dụ bỏ trang báo cáo. Còn con số ước lượng thì không đàm phán, vì nó là dự đoán chứ không phải giá."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Im lặng khi biết mình sẽ trễ, hoặc khi việc vượt năng lực <b class="red">(trái nguyên tắc 1.3 và 2.6)</b>
          <br><span class="note">Báo ngay khi ước lượng đổi: ngày thứ 3 mới xong một nửa thì E cũ không còn đúng. Thiếu chuyên môn thì nói ra, để người thuê chọn: thêm thời gian, thêm người, hoặc bỏ.</span></div>
          $$\text{báo sớm} \;\to\; \text{còn thời gian chọn phương án}$$
        focus: [1, 1, 1, 2]
        say: "Lỗi thứ tư là im lặng khi biết mình sẽ trễ, hoặc khi việc vượt năng lực, trái với nguyên tắc 1 chấm 3 và 2 chấm 6. Hãy báo ngay khi ước lượng thay đổi, ví dụ ngày thứ 3 mới xong một nửa thì ước lượng cũ không còn đúng. Nếu thiếu chuyên môn, hãy nói ra để người thuê chọn thêm thời gian, thêm người, hoặc bỏ việc đó. Báo sớm thì mọi người còn thời gian chọn phương án."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: trưởng nhóm muốn 5 ngày"
    checks:
      - "3 + 4 * 5 + 13 == 36 and 36 / 6 == 6"
      - "round((13 - 3) / 6, 2) == 1.67"
      - "round(6 + 2 * (13 - 3) / 6, 2) == 9.33 and round(6 - 2 * (13 - 3) / 6, 2) == 2.67"
    steps:
      - show: |
          <p>Việc mới (số minh hoạ): lạc quan <b>3</b> ngày, khả dĩ <b>5</b>, bi quan <b>13</b>. Trưởng nhóm muốn hứa với khách <b>5 ngày</b>.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Ước lượng E là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Độ lệch s và khoảng báo E ± 2s?</td></tr>
          <tr><td>3</td><td>Bạn trả lời trưởng nhóm thế nào?</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Việc mới có lạc quan 3 ngày, khả dĩ 5 ngày, bi quan 13 ngày. Trưởng nhóm muốn hứa với khách 5 ngày. Câu một, ước lượng E là bao nhiêu? Câu hai, độ lệch s và khoảng báo là bao nhiêu? Câu ba, bạn trả lời trưởng nhóm thế nào? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$\frac{3 + 4 \times 5 + 13}{6} = \frac{36}{6}$</td><td>$E = \hlo{6}$ ngày</td></tr>
          <tr><td>2</td><td>$s = \frac{13 - 3}{6} = \frac{10}{6}$</td><td>$\approx 1{,}67$; khoảng $\approx 2{,}67$ tới $\hlg{9{,}33}$ ngày</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án từng bước. Câu một, 3 cộng 4 nhân 5 cộng 13 bằng 36, chia 6 được E bằng 6 ngày. Câu hai, s bằng 13 trừ 3, chia 6, khoảng 1 phẩy 67, nên khoảng báo đi từ khoảng 2 phẩy 67 tới khoảng 9 phẩy 33 ngày."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>hứa 5 ngày, phạm vi giữ nguyên</td><td>khách vui hôm nay</td><td class="red">5 = M &lt; E = 6: hứa theo kịch bản không có rủi ro</td></tr>
          <tr><td>hứa “6 ngày, có thể tới 9”, nói rõ rủi ro</td><td>trung thực, ít bất ngờ</td><td>khách phải chờ lâu hơn</td></tr>
          <tr><td>giữ 5 ngày bằng cách cắt một phần phạm vi</td><td>đúng hẹn với phần quan trọng nhất</td><td>phần bị cắt làm sau, phải nói rõ với khách</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: nếu đã từng làm việc rất giống và đo được thời gian thật, dùng số đo đó thay cho ước lượng ba điểm.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Câu ba là một quyết định có đánh đổi. Hứa 5 ngày mà giữ nguyên phạm vi làm khách vui hôm nay, nhưng 5 chỉ là con số khả dĩ, nhỏ hơn ước lượng 6. Hứa 6 ngày, có thể tới 9, là trung thực và ít bất ngờ, đổi lại khách chờ lâu hơn. Hoặc giữ 5 ngày bằng cách cắt một phần phạm vi, làm phần quan trọng nhất trước và nói rõ với khách. Nếu bạn đã từng làm việc rất giống và đo được thời gian thật, hãy dùng số đo đó."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ba con số O, M, B</span><span class="a">→</span>
          <span class="n">E = (O + 4M + B) / 6, s = (B − O) / 6</span><span class="a">→</span>
          <span class="n">báo khoảng E ± 2s kèm rủi ro lớn nhất</span><span class="a">→</span>
          <span class="n">cam kết = ước lượng + phạm vi; báo sớm khi đổi</span></div>
        say: "Tổng kết lại, bắt đầu từ ba con số lạc quan, khả dĩ và bi quan. Ước lượng E bằng O cộng 4 M cộng B, chia 6, và độ lệch s bằng B trừ O, chia 6. Hãy báo một khoảng kèm rủi ro lớn nhất, và cam kết bằng ước lượng cộng phạm vi rõ, báo sớm khi có thay đổi."
      - show: |
          <div class="box key"><b>Tư duy:</b> ước lượng là dự đoán, không phải lời hứa cho vui lòng. Nói “chưa được” kèm <b>con số, rủi ro và phương án</b> là trung thực và có ích hơn một lời “được” sẽ bị trễ.</div>
        say: "Điều cần mang theo, ước lượng là dự đoán, không phải lời hứa cho vui lòng. Nói chưa được kèm con số, rủi ro và phương án vừa trung thực vừa có ích hơn một lời được mà rồi sẽ trễ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>tình huống chuyên gia — một gói nhỏ bị gỡ</b>, trách nhiệm của từng bên trong hệ sinh thái mã nguồn mở.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta phân tích một tình huống chuyên gia có thật, khi một gói phần mềm nhỏ bị gỡ khỏi kho chung. Ta sẽ xem trách nhiệm của từng bên trong hệ sinh thái mã nguồn mở. Hẹn gặp bạn ở bài tiếp theo."
