        say: "Hình cho thấy nghĩa vụ đi theo bản sao. Bên trái là sản phẩm, một chương trình gồm bốn thư viện và mã đóng của công ty. Khi chuyển bản sao sang máy của khách, mọi nghĩa vụ đi theo, và thư viện buộc mở mã đã kết hợp vào thì kéo cả khối theo giấy phép của nó. Còn nếu chỉ trả kết quả qua mạng cho trình duyệt, không chuyển bản sao, thì theo định nghĩa của chính giấy phép đó, đây không phải là phân phối."

  # ───────────────────────── 6. QUY TRÌNH ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra cách kiểm, từng bước"
    checks:
      - "4 + 4 * 3 == 16"
      - "2 + 1 == 3"
    steps:
      - show: |
          <p><b>Bước 1 — có phân phối bản sao không?</b> Vì nghĩa vụ của cả ba giấy phép gắn với việc phân phối, hỏi điều này trước. Cài lên máy khách, gửi tệp chạy, nạp vào thiết bị: <b>có</b>. Chỉ chạy trên máy chủ của mình: theo GPL-3.0 là <b>không</b>.</p>
          <p><b>Bước 2 — lập danh sách đủ.</b> Theo phép đếm ở phần ôn nền, kể cả gói gián tiếp: 4 + 4 × 3 = 16 gói, mỗi gói một dòng giấy phép.</p>
        focus: [1, 1, 2]
        say: "Bước một, vì nghĩa vụ của cả ba giấy phép gắn với việc phân phối, ta hỏi điều này trước. Cài lên máy khách, gửi tệp chạy hay nạp vào thiết bị đều là phân phối, còn chỉ chạy trên máy chủ của mình thì theo giấy phép công cộng chung bản 3 là không. Bước hai, theo phép đếm ở phần ôn nền, lập danh sách đủ cả gói gián tiếp, ở đây 16 gói, mỗi gói một dòng giấy phép."
      - show: |
          <p><b>Bước 3 — nghĩa vụ của gói dễ dãi:</b> gom thông báo. Mỗi gói dễ dãi đóng góp một bản thông báo bản quyền và giấy phép vào phần thông tin đi kèm sản phẩm; gói Apache 2.0 còn đòi kèm nội dung tệp NOTICE nếu có, và đánh dấu tệp mình đã sửa.</p>
          <p><b>Bước 4 — gói buộc mở mã:</b> theo mục 5c và định nghĩa “tập hợp”, nếu nó <b>kết hợp với mã của ta thành một chương trình</b> rồi phân phối, thì cả khối phải theo giấy phép đó, kèm mã nguồn. Ba lựa chọn: thay thư viện, mở mã theo cùng giấy phép, hoặc không phân phối kiểu đó.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Bước ba, với gói dễ dãi, nghĩa vụ chính là gom thông báo, mỗi gói đóng góp một bản thông báo bản quyền và giấy phép vào phần thông tin đi kèm sản phẩm. Gói dễ dãi có điều khoản bằng sáng chế còn đòi kèm nội dung tệp thông báo riêng nếu có, và đánh dấu tệp mình đã sửa. Bước bốn, với gói buộc mở mã, ta dùng mục 5c và định nghĩa tập hợp. Nếu nó kết hợp với mã của ta thành một chương trình rồi phân phối, thì cả khối phải theo giấy phép đó, kèm mã nguồn. Khi đó có ba lựa chọn, thay thư viện, mở mã theo cùng giấy phép, hoặc không phân phối theo kiểu đó."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Sản phẩm cài trên máy khách: từng bước"
    checks:
      - "['MIT', 'MIT', 'Apache-2.0', 'GPL-3.0'].count('MIT') == 2"
      - "sum(x in ('MIT', 'Apache-2.0') for x in ['MIT', 'MIT', 'Apache-2.0', 'GPL-3.0']) == 3"
      - "[x for x in ['MIT', 'MIT', 'Apache-2.0', 'GPL-3.0'] if x == 'GPL-3.0'] == ['GPL-3.0']"
      - "4 + 4 * 3 == 16"
    steps:
      - show: |
          <p><b>Bước 1.</b> Cài trên máy khách → <b>có phân phối</b> bản sao. Nghĩa vụ của cả bốn giấy phép đều được kích hoạt.</p>
        say: "Bước một, sản phẩm được cài trên máy khách, nên có phân phối bản sao, và nghĩa vụ của cả bốn giấy phép đều được kích hoạt."
      - show: |
          <table class="t"><tr><th>thư viện</th><th>loại</th><th>nghĩa vụ khi phân phối</th><th>trong sản phẩm đóng?</th></tr>
          <tr><td>tiện ích 1, 2 (MIT)</td><td>dễ dãi</td><td>kèm 2 bản thông báo</td><td>được</td></tr>
          <tr><td>mạng (Apache 2.0)</td><td>dễ dãi</td><td>kèm bản giấy phép, nội dung tệp NOTICE (nếu có), đánh dấu tệp mình đã sửa (nếu có sửa)</td><td>được</td></tr>
          <tr><td>biểu đồ (GPL-3.0)</td><td>buộc mở mã</td><td>cả chương trình theo GPL-3.0, kèm mã nguồn</td><td class="red">không, nếu giữ mã đóng</td></tr></table>
          <p><b>Bước 2–3.</b> 3 trên 4 thư viện là dễ dãi: được dùng, kèm <b>3 bản thông báo</b>; riêng thư viện mạng (Apache 2.0) kèm thêm bản giấy phép, tệp NOTICE và đánh dấu tệp đã sửa.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước hai, xếp loại từng thư viện. Hai thư viện tiện ích là dễ dãi, chỉ cần kèm hai bản thông báo. Thư viện mạng cũng dễ dãi, cần kèm bản giấy phép, nội dung tệp thông báo riêng nếu có, và đánh dấu những tệp mình đã sửa nếu có sửa. Thư viện biểu đồ là loại buộc mở mã, nên cả chương trình phải theo nó và kèm mã nguồn khi phân phối. Bước ba, vậy 3 trên 4 thư viện được dùng trong sản phẩm đóng, kèm 3 bản thông báo, riêng thư viện mạng còn kèm bản giấy phép, tệp thông báo riêng và đánh dấu tệp đã sửa."
      - clear: true
        show: |
          <p><b>Bước 4.</b> Thư viện biểu đồ: ba lựa chọn, mỗi lựa chọn một cái giá.</p>
          <table class="t"><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>thay bằng thư viện biểu đồ dễ dãi</td><td>giữ mã đóng, đúng hạn nếu kịp đổi</td><td>vài ngày sửa và kiểm thử lại</td></tr>
          <tr><td>mở toàn bộ mã sản phẩm theo GPL-3.0</td><td>dùng tiếp thư viện</td><td>mất mô hình bán mã đóng; khách được quyền chia sẻ lại</td></tr>
          <tr><td>giữ nguyên, bàn giao mã đóng</td><td>—</td><td class="red">vi phạm điều kiện giấy phép</td></tr></table>
          <p><b>Bước 5.</b> Kiểm thêm 12 gói gián tiếp (tổng 16) trước khi trả lời khách.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước bốn, thư viện biểu đồ có ba lựa chọn, mỗi lựa chọn một cái giá. Thay bằng một thư viện biểu đồ dễ dãi thì giữ được mã đóng, đổi lại mất vài ngày sửa và kiểm thử. Mở toàn bộ mã theo giấy phép công cộng chung thì dùng tiếp được, nhưng mất mô hình bán mã đóng. Giữ nguyên mà bàn giao mã đóng là vi phạm điều kiện giấy phép. Bước năm, kiểm thêm 12 gói gián tiếp, tổng 16 gói, trước khi trả lời khách."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác: đổi cách phân phối"
    checks:
      - "len(['MIT', 'MIT', 'Apache-2.0', 'GPL-3.0']) == 4 and 4 - 1 == 3"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi kiểm</th><th>trả lời theo văn bản</th></tr>
          <tr><td>cùng sản phẩm, nhưng chỉ chạy trên máy chủ của công ty, khách dùng qua trình duyệt?</td><td>GPL-3.0: không chuyển bản sao thì không phải phân phối → điều kiện mục 5, 6 chưa kích hoạt</td></tr>
          <tr><td>chỉ đặt chương trình vẽ biểu đồ độc lập cạnh sản phẩm trên cùng đĩa cài?</td><td>là “tập hợp” → GPL không áp lên sản phẩm; vẫn phải tuân thủ GPL cho chính chương trình đó</td></tr>
          <tr><td>đếm lại: bỏ thư viện biểu đồ thì còn mấy gói buộc mở mã?</td><td>4 − 1 = 3 gói trực tiếp còn lại đều dễ dãi → 0 (chưa kể 12 gói gián tiếp còn phải kiểm) ✓</td></tr></table>
          <p class="note">Mỗi giấy phép khác có thể định nghĩa “phân phối” khác — luôn đọc đúng văn bản của gói mình dùng. Ca biên giữa “kết hợp” và “tập hợp”: hỏi người có chuyên môn pháp lý.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Ta kiểm lại bằng cách đổi cách phân phối. Nếu cùng sản phẩm chỉ chạy trên máy chủ của công ty, khách dùng qua trình duyệt, thì theo giấy phép bản 3, không chuyển bản sao nên chưa phải phân phối. Nếu chỉ đặt chương trình vẽ biểu đồ độc lập cạnh sản phẩm trên cùng đĩa cài, đó là tập hợp, nên giấy phép không áp lên sản phẩm. Đếm lại, bỏ thư viện biểu đồ thì 3 gói trực tiếp còn lại đều dễ dãi, chưa kể 12 gói gián tiếp phải kiểm. Nhớ rằng giấy phép khác có thể định nghĩa khác, và ca biên thì hỏi người có chuyên môn pháp lý."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "16 - 4 == 12"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Mã trên mạng không ghi giấy phép, vậy là miễn phí” <b class="red">(ngược lại: giữ mọi quyền)</b>
          <br><span class="note">Không có giấy phép thì luật bản quyền mặc định áp dụng. Phép thử: tìm tệp giấy phép; không có thì hỏi tác giả hoặc viết lại.</span></div>
          <table class="t"><tr><th>đoạn mã tìm được</th><th>làm gì</th></tr><tr><td>có tệp giấy phép dễ dãi</td><td>dùng, giữ thông báo</td></tr><tr><td>không có giấy phép</td><td>hỏi tác giả, hoặc tự viết</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất là nghĩ mã trên mạng không ghi giấy phép thì miễn phí, trong khi thực tế là tác giả giữ mọi quyền. Không có giấy phép thì luật bản quyền mặc định áp dụng. Phép thử là tìm tệp giấy phép, không có thì hỏi tác giả, hoặc tự viết lại."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chép mã vào dự án rồi xoá dòng bản quyền ở đầu tệp <b class="red">(mất điều kiện duy nhất)</b>
          <br><span class="note">Giấy phép MIT cho phép “với điều kiện” giữ thông báo trong mọi bản sao hoặc phần đáng kể. Xoá nó là không còn thoả điều kiện của lời cho phép — dùng như thế là dùng không có phép.</span></div>
        say: "Lỗi thứ hai là chép mã vào dự án rồi xoá dòng bản quyền ở đầu tệp. Giấy phép ngắn gọn dễ dãi chỉ cho phép với điều kiện giữ thông báo trong mọi bản sao hoặc phần đáng kể. Xoá nó là không còn thoả điều kiện của lời cho phép, nên dùng như thế là dùng không có phép."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Chỉ kiểm phụ thuộc trực tiếp <b class="red">(bỏ sót 12 trên 16 gói)</b>
          <br><span class="note">Gói buộc mở mã hay nằm ở tầng sâu. Phép thử: dùng công cụ liệt kê cả cây phụ thuộc và giấy phép của từng gói, chạy tự động mỗi lần thêm gói.</span></div>
          <table class="t"><tr><th>kiểm</th><th>số gói nhìn thấy</th></tr><tr><td>chỉ trực tiếp</td><td>4</td></tr><tr><td>cả cây</td><td>16</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là chỉ kiểm phụ thuộc trực tiếp, nên bỏ sót 12 trên 16 gói. Gói buộc mở mã hay nằm ở tầng sâu. Phép thử là dùng công cụ liệt kê cả cây phụ thuộc kèm giấy phép từng gói, và chạy tự động mỗi lần thêm gói mới."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Coi mọi giấy phép dễ dãi là như nhau <b class="red">(bỏ sót NOTICE, điều khoản bằng sáng chế)</b>
          <br><span class="note">Apache 2.0 đòi kèm nội dung tệp NOTICE, đánh dấu tệp đã sửa; giấy phép bằng sáng chế mà người nhận được hưởng <b>chấm dứt</b> nếu chính người nhận đi kiện, cho rằng tác phẩm vi phạm bằng sáng chế.</span></div>
        say: "Lỗi thứ tư là coi mọi giấy phép dễ dãi là như nhau. Giấy phép dễ dãi có điều khoản bằng sáng chế đòi kèm nội dung tệp thông báo riêng và đánh dấu tệp đã sửa. Giấy phép bằng sáng chế mà người nhận được hưởng còn chấm dứt nếu chính người nhận đi kiện, cho rằng tác phẩm vi phạm bằng sáng chế."

