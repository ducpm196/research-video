          <text x="1060" y="145" font-size="23" text-anchor="middle" fill="#1f2937">máy của khách</text><text x="1060" y="178" font-size="21" text-anchor="middle" fill="#b91c1c">nghĩa vụ đi theo</text>
          <line x1="640" y1="300" x2="900" y2="300" stroke="#9ca3af" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#sep4a)"/>
