  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">không giấy phép = giữ mọi quyền</span><span class="a">→</span>
          <span class="n">có phân phối bản sao không?</span><span class="a">→</span>
          <span class="n">liệt kê cả cây phụ thuộc</span><span class="a">→</span>
          <span class="n">dễ dãi: gom thông báo; buộc mở mã đã kết hợp: thay hoặc mở mã</span></div>
        say: "Tổng kết lại, không có giấy phép nghĩa là tác giả giữ mọi quyền. Muốn biết nghĩa vụ, trước hết hỏi có phân phối bản sao không, rồi liệt kê cả cây phụ thuộc. Gói dễ dãi thì gom thông báo, còn gói buộc mở mã đã kết hợp vào sản phẩm thì thay nó hoặc mở mã."
