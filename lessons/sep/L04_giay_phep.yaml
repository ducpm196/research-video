source: "curriculum/sep.yaml L04; audit/sep/sources_L04.md (câu trích nguyên văn, đọc 2026-11-02); audit/sep/verify_sep.py L04; văn bản giấy phép MIT (opensource.org) [MIT]; Apache License 2.0 (apache.org) [AP2]; GNU GPL phiên bản 3, 29/6/2007 (bản SPDX) [GPL3]; GitHub Docs, Licensing a repository [GH]; ACM Code of Ethics 2018, nguyên tắc 1.5 [ACM18]"
assumes: []
# Quy ước: “dễ dãi” = giấy phép cho dùng, sửa, phân phối, kể cả trong sản phẩm đóng, chỉ đòi giữ thông báo (MIT, Apache 2.0);
#   “buộc mở mã” = giấy phép đòi tác phẩm dựa trên nó, khi phân phối, cũng theo cùng giấy phép (GPL-3.0; nhiều sách gọi copyleft).
#   “Phân phối” = chuyển bản sao cho người khác (GPL-3.0 gọi là “convey”). Tên giấy phép (MIT, Apache, GPL) và chữ copyleft chỉ trên màn hình;
#   lời đọc nói “giấy phép ngắn gọn dễ dãi”, “giấy phép dễ dãi có điều khoản bằng sáng chế”, “giấy phép công cộng chung, loại buộc mở mã”
#   (probe p1 chưa có kết quả khi soạn — xem lexicon_vi.SEP.yaml). Sản phẩm, công ty, số gói là SỐ MINH HOẠ.
#   KHÔNG tư vấn pháp lý: không khẳng định một cách liên kết cụ thể có tạo “tác phẩm dựa trên” hay không (câu hỏi FAQ của GNU không tải
#   được — NOT_VERIFIED); bài dạy điều văn bản giấy phép ghi và khuyên hỏi người có chuyên môn pháp lý cho ca biên.
objectives:
  - "Phân biệt nghĩa vụ của giấy phép dễ dãi (giữ thông báo) và giấy phép buộc mở mã (cả tác phẩm theo cùng giấy phép khi phân phối)"
  - "Kiểm một danh sách phụ thuộc, kể cả phụ thuộc gián tiếp, có phân phối được trong sản phẩm đóng không"
  - "Giải thích vì sao mã không ghi giấy phép không phải là “miễn phí dùng”"
  - "Quyết định thay, giữ hay mở mã khi gặp một thư viện buộc mở mã"
asr_reviewed:
  - {sentence: "Bài dùng bốn từ.", reason: "ASR chép “Bài dùng bốn tư.” (0.75): lệch âm/thanh thuần Việt: từ/bốn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hai thư viện tiện ích là dễ dãi, chỉ cần kèm hai bản thông báo.", reason: "ASR chép “Hai thư viện tiền íp là dễ dãi, chỉ cần kèm hai bản thông báo.” (0.867): lệch âm/thanh thuần Việt: ích/tiền íp, tiện (trong “tiện x” → “tiền íp”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai ngày trước bàn giao: “bên anh có quyền phân phối không?”"
    checks:
      - "2 + 1 + 1 == 4"
    steps:
      - show: |
          <p>Một công ty nhỏ bàn giao phần mềm cài trên máy của khách, <b>mã đóng</b>, tức không công bố mã nguồn (số minh hoạ). Trước ngày ký, bộ phận pháp chế của khách hỏi: “Sản phẩm dùng mã của ai, và bên anh có quyền phân phối không?”</p>
          <table class="t"><tr><th>thư viện</th><th>giấy phép</th></tr>
          <tr><td>2 thư viện tiện ích</td><td>MIT</td></tr>
          <tr><td>1 thư viện mạng</td><td>Apache 2.0</td></tr>
          <tr><td>1 thư viện vẽ biểu đồ</td><td>GPL-3.0</td></tr></table>
          <div class="box key">Hôm nay: (1) mỗi loại giấy phép đòi gì? (2) cái nào ép ta mở mã, và khi nào? (3) mã trên mạng không ghi giấy phép thì sao?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, hãy hình dung một công ty nhỏ sắp bàn giao một phần mềm mã đóng, tức không công bố mã nguồn, cài trên máy của khách, với số minh hoạ. Trước ngày ký, bộ phận pháp chế của khách hỏi, sản phẩm dùng mã của ai, và bên anh có quyền phân phối không. Sản phẩm dùng bốn thư viện, tên giấy phép ghi trên màn hình. Hai cái theo giấy phép ngắn gọn dễ dãi, một cái dễ dãi có điều khoản bằng sáng chế, và một cái theo giấy phép công cộng chung. Hôm nay ta học mỗi loại giấy phép đòi gì, cái nào ép ta mở mã và khi nào, và mã không ghi giấy phép thì sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: bản quyền mặc định, và đếm phụ thuộc gián tiếp"
    checks:
      - "4 + 4 * 3 == 16"
    steps:
      - show: |
          <p><b>① Bản quyền là mặc định.</b> Người viết mã có quyền tác giả ngay khi viết. Trang hướng dẫn của một nền tảng lưu trữ mã lớn ghi: không có giấy phép thì luật bản quyền mặc định áp dụng — tác giả giữ mọi quyền, không ai được sao chép, phân phối hay làm <b>tác phẩm phái sinh</b> (tác phẩm làm ra dựa trên tác phẩm ban đầu, ví dụ một bản đã sửa).</p>
          <div class="box key">Giấy phép là <b>lời cho phép</b> kèm điều kiện. Không có giấy phép = không có lời cho phép.</div>
        focus: [1, 1, 1, 2]
        say: "Điều thứ nhất, người viết mã có quyền tác giả ngay khi viết. Trang hướng dẫn của một nền tảng lưu trữ mã lớn ghi rằng không có giấy phép thì luật bản quyền mặc định áp dụng. Khi đó tác giả giữ mọi quyền, và không ai được sao chép, phân phối hay làm tác phẩm phái sinh, tức tác phẩm làm ra dựa trên tác phẩm ban đầu, như một bản đã sửa. Vì vậy giấy phép là một lời cho phép kèm điều kiện, và không có giấy phép nghĩa là không có lời cho phép."
      - show: |
          <p><b>② Đếm cả phụ thuộc gián tiếp.</b> Một <b>thư viện</b> là gói mã viết sẵn mà chương trình khác gọi dùng. Thư viện của ta lại dùng thư viện khác, và giấy phép của chúng cũng đi theo vào sản phẩm.</p>
          <table class="t"><tr><th>tầng</th><th>số gói</th></tr>
          <tr><td>phụ thuộc trực tiếp</td><td>4</td></tr>
          <tr><td>mỗi gói dùng thêm 3 gói (số minh hoạ)</td><td>4 × 3 = 12</td></tr>
          <tr><td>phải kiểm giấy phép</td><td>4 + 12 = 16 gói</td></tr></table>
        focus: [1, 1, "2.3", "2.4"]
        say: "Điều thứ hai, một thư viện là một gói mã viết sẵn mà chương trình khác gọi ra dùng. Thư viện của ta lại dùng thư viện khác, và giấy phép của chúng cũng đi theo vào sản phẩm. Với 4 phụ thuộc trực tiếp, nếu mỗi gói dùng thêm 3 gói, một số minh hoạ, thì có thêm 4 nhân 3 bằng 12 gói gián tiếp. Vậy phải kiểm giấy phép của 4 cộng 12, tức 16 gói, không phải 4."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: dễ dãi, buộc mở mã, phân phối, tập hợp"
    steps:
      - show: |
          <table class="t"><tr><th>từ</th><th>nghĩa trong bài</th></tr>
          <tr><td><b>giấy phép dễ dãi</b></td><td>cho dùng, sửa, phân phối, kể cả trong sản phẩm đóng; chủ yếu đòi giữ thông báo bản quyền</td></tr>
          <tr><td><b>giấy phép buộc mở mã</b> (copyleft)</td><td>tác phẩm dựa trên mã đó, khi phân phối, phải theo cùng giấy phép và kèm mã nguồn</td></tr>
          <tr><td><b>phân phối</b></td><td>chuyển bản sao cho người khác: bán bản cài, gửi tệp chạy, nạp vào thiết bị</td></tr>
          <tr><td><b>tập hợp</b></td><td>đặt các chương trình độc lập cạnh nhau trên cùng một đĩa, không gộp thành một chương trình lớn hơn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn từ. Giấy phép dễ dãi cho dùng, sửa và phân phối, kể cả trong sản phẩm đóng, và chủ yếu đòi giữ thông báo bản quyền. Giấy phép buộc mở mã đòi tác phẩm dựa trên mã đó, khi phân phối, phải theo cùng giấy phép và kèm mã nguồn. Phân phối là chuyển bản sao cho người khác, như bán bản cài hay nạp vào thiết bị. Tập hợp là đặt các chương trình độc lập cạnh nhau trên cùng một đĩa, không gộp thành một chương trình lớn hơn."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: texts
    kind: concept
    title: "Ba văn bản giấy phép nói gì (trích)"
    steps:
      - show: |
          <table class="t"><tr><th>giấy phép</th><th>cho phép</th><th>điều kiện chính (trích văn bản)</th></tr>
          <tr><td>MIT</td><td>dùng, sao chép, sửa, gộp, xuất bản, phân phối, cấp phép lại, <b>bán</b></td><td>“thông báo bản quyền ở trên và thông báo cho phép này phải được đưa vào mọi bản sao hoặc phần đáng kể”</td></tr>
          <tr><td>Apache 2.0</td><td>như trên, thêm <b>giấy phép bằng sáng chế</b> từ người đóng góp</td><td>đưa bản giấy phép cho người nhận; đánh dấu tệp đã sửa; giữ các thông báo; kèm nội dung tệp NOTICE nếu có</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng trích ý chính của các văn bản giấy phép. Giấy phép ngắn gọn dễ dãi cho dùng, sao chép, sửa, gộp, xuất bản, phân phối, cấp phép lại và cả bán. Điều kiện chính là thông báo bản quyền và thông báo cho phép phải được đưa vào mọi bản sao hoặc phần đáng kể. Giấy phép dễ dãi thứ hai cho như vậy, thêm một giấy phép bằng sáng chế từ người đóng góp. Đổi lại, phải đưa bản giấy phép cho người nhận, đánh dấu tệp đã sửa, giữ các thông báo, và kèm nội dung tệp thông báo riêng nếu có."
      - clear: true
        show: |
          <table class="t"><tr><th>GPL-3.0 (29/6/2007)</th><th>trích văn bản (dịch sát)</th></tr>
          <tr><td>phân phối mã nguồn đã sửa, mục 5c</td><td>“phải cấp phép <b>toàn bộ tác phẩm</b>, như một khối, theo giấy phép này cho bất kỳ ai có được một bản sao”</td></tr>
          <tr><td>phân phối dạng chạy được, mục 6</td><td>được, với điều kiện kèm <b>mã nguồn tương ứng</b> theo một trong các cách liệt kê</td></tr>
          <tr><td>tập hợp</td><td>đặt cạnh các tác phẩm độc lập, không kết hợp thành một chương trình lớn hơn: giấy phép <b>không</b> áp lên phần khác</td></tr>
          <tr><td>định nghĩa “phân phối”</td><td>“chỉ tương tác với người dùng qua mạng máy tính, không chuyển bản sao, thì <b>không</b> phải là phân phối”</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Giấy phép công cộng chung phiên bản 3, ngày 29 tháng 6 năm 2007, là loại buộc mở mã. Mục 5c ghi rằng khi phân phối, phải cấp phép toàn bộ tác phẩm, như một khối, theo giấy phép này. Mục 6 cho phân phối dạng chạy được, với điều kiện kèm mã nguồn tương ứng. Nếu chỉ đặt cạnh các tác phẩm độc lập mà không kết hợp thành một chương trình lớn hơn, giấy phép không áp lên phần khác. Và chỉ tương tác với người dùng qua mạng, không chuyển bản sao, thì không phải là phân phối."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nghĩa vụ đi theo bản sao"
    steps:
      - show: |
          <div><svg width="1600" height="430" viewBox="0 0 1600 430"><defs><marker id="sep4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
          <rect x="30" y="50" width="600" height="320" rx="12" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
          <text x="330" y="88" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f2937">sản phẩm (một chương trình)</text>
