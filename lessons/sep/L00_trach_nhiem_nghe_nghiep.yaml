title: "Bài 0 — Trách nhiệm nghề nghiệp: ai chịu hậu quả của phần mềm"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sep.yaml L00; audit/sep/sources_L00.md (câu trích nguyên văn, đọc 2026-11-02); audit/sep/verify_sep.py L00; ACM Code of Ethics and Professional Conduct (thông qua 22/6/2018), bản PDF trên acm.org — Lời mở đầu, nguyên tắc 1.1, 1.2, 1.3, 2.5"
assumes: []
# Quy ước: n = số người dùng, p = tỉ lệ người bị xếp sai (số thập phân, 1% = 0,01). Dấu nhân viết ×. Mọi con số về sản phẩm là SỐ MINH HOẠ
#   (ghi trên màn hình); con số về bộ quy tắc ACM lấy nguyên văn từ audit/sep/sources_L00.md. Lời đọc không nói “ACM”, “Code”:
#   nói “bộ quy tắc đạo đức nghề nghiệp năm 2018 của Hiệp hội Máy tính”, chữ ACM chỉ trên màn hình (probe p1 — xem lexicon_vi.SEP.yaml).
#   Giả định độc lập: mỗi người thử gặp lỗi hay không độc lập với người khác (đơn giản hoá, nói rõ trên màn hình).
objectives:
  - "Liệt kê các bên chịu ảnh hưởng của một quyết định kỹ thuật, kể cả người không dùng sản phẩm"
  - "Tính số người bị ảnh hưởng n × p và xác suất thử n người mà không thấy lỗi nào (1 − p) mũ n"
  - "Đọc một bộ quy tắc đạo đức nghề nghiệp như công cụ ra quyết định, không như thuật toán"
  - "Quyết định cách phát hành dần để lỗi hiếm lộ ra khi còn ít người bị ảnh hưởng"
asr_reviewed:
  - {sentence: "Bốn nguyên tắc dùng ngay trong bài này.", reason: "ASR chép “Bốn nguyên tác dụng ngay trong bài này.” (0.75): lệch âm/thanh thuần Việt: tắc dùng/tác dụng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nguyên tắc 1 chấm 2 ghi rằng báo rủi ro tuỳ tiện hay sai lệch tự nó có thể gây hại.", reason: "ASR chép “Nguyên tắc 1.2 ghi rằng báo đuổi do tuy tiện hay sai lệch từ nó có thể gây hại.” (0.78): lệch âm/thanh thuần Việt: chấm/∅, rủi ro tuỳ/đuổi do tuy, tự/từ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lỗi 1% trên 1 triệu người dùng, 100 người thử không thấy gì"
    checks:
      - "1000000 * 1 // 100 == 10000 and 100 * 1 // 100 == 1"
      - "round(0.99 ** 100, 3) == 0.366 and round(0.99 ** 100 * 100) == 37"
    steps:
      - show: |
          <p>Một đội đổi thuật toán xếp hạng cho <b>1&nbsp;000&nbsp;000</b> người dùng. Thuật toán mới xếp sai <b>1%</b> số người → <b>10&nbsp;000</b> người bị ảnh hưởng (số minh hoạ).</p>
          <p>Trước khi phát hành, 100 người trong công ty dùng thử. Kỳ vọng chỉ 1 người gặp lỗi — và khoảng <b>37%</b> khả năng là <b>không ai</b> gặp.</p>
          <div class="box key">Hôm nay: (1) ai chịu hậu quả của một quyết định kỹ thuật? (2) vì sao thử ít người không thấy lỗi? (3) người làm nghề phải làm gì khi biết rủi ro?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, hãy hình dung một đội đổi thuật toán xếp hạng cho 1 triệu người dùng, với số minh hoạ. Thuật toán mới xếp sai 1 phần trăm số người, tức 10 nghìn người bị ảnh hưởng. Trước khi phát hành, 100 người trong công ty dùng thử. Kỳ vọng chỉ 1 người gặp lỗi, và có khoảng 37 phần trăm khả năng là không ai gặp cả. Hôm nay ta trả lời ba câu hỏi, ai chịu hậu quả, vì sao thử ít người không thấy lỗi, và người làm nghề phải làm gì khi biết rủi ro."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại hai phép tính sẽ dùng"
    checks:
      - "1000000 // 100 == 10000 and 200 * 1 // 100 == 2"
      - "0.5 * 0.5 == 0.25 and round(0.9 * 0.9, 2) == 0.81"
    steps:
      - show: |
          <p><b>① Phần trăm của một số.</b> 1% là một phần trăm, viết thập phân là 0,01.</p>
          <table class="t"><tr><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1% của 1&nbsp;000&nbsp;000 = 1&nbsp;000&nbsp;000 chia 100</td><td>10&nbsp;000</td></tr>
          <tr><td>1% của 200 = 200 × 0,01</td><td>2</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ nhất là phần trăm của một số, 1 phần trăm viết thập phân là 0 phẩy 01. Một phần trăm của 1 triệu là 1 triệu chia 100, bằng 10 nghìn. Một phần trăm của 200 là 200 nhân 0 phẩy 01, bằng 2."
      - show: |
          <p><b>② Hai việc độc lập cùng “không xảy ra”.</b> Nhân hai xác suất với nhau.</p>
          <table class="t"><tr><th>tình huống</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>tung đồng xu 2 lần, không lần nào ra mặt ngửa</td><td>0,5 × 0,5</td><td>0,25</td></tr>
          <tr><td>mỗi lần 90% không mưa, 2 ngày liền không mưa</td><td>0,9 × 0,9</td><td>0,81</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai, khi hai việc độc lập với nhau, xác suất để cả hai cùng không xảy ra bằng tích hai xác suất. Tung đồng xu 2 lần mà không lần nào ra mặt ngửa có xác suất 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Nếu mỗi ngày có 90 phần trăm khả năng không mưa, hai ngày liền không mưa là 0 phẩy 9 nhân 0 phẩy 9, bằng 0 phẩy 81."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bên liên quan, tác hại, n và p"
    checks:
      - "1 - 0.01 == 0.99"
    steps:
      - show: |
          <table class="t"><tr><th>từ / ký hiệu</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td><b>bên liên quan</b></td><td>mọi người chịu ảnh hưởng của hệ thống, kể cả người không dùng nó</td><td>người dùng, người được xếp hạng, đội vận hành</td></tr>
          <tr><td><b>tác hại</b></td><td>hậu quả xấu, nhất là khi lớn và không công bằng</td><td>bị xếp sai, lộ thông tin</td></tr>
          <tr><td>$n$</td><td>số người dùng (hoặc số người thử)</td><td>1&nbsp;000&nbsp;000</td></tr>
          <tr><td>$p$</td><td>tỉ lệ một người bị lỗi, viết thập phân</td><td>1% = 0,01; không bị lỗi: 1 − 0,01 = 0,99</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn từ và ký hiệu. Bên liên quan là mọi người chịu ảnh hưởng của hệ thống, kể cả người không dùng nó. Tác hại là hậu quả xấu, nhất là khi lớn và không công bằng. Chữ n là số người dùng, hoặc số người thử. Chữ p là tỉ lệ một người bị lỗi viết thập phân, ví dụ 0 phẩy 01, nên khả năng không bị lỗi là 1 trừ p, bằng 0 phẩy 99."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: code
    kind: concept
    title: "Một bộ quy tắc nghề nghiệp nói gì"
    steps:
      - show: |
          <p><b>Bộ quy tắc đạo đức và ứng xử nghề nghiệp của ACM</b> (Hiệp hội Máy tính, thông qua ngày 22/6/2018) có 4 phần:</p>
          <table class="t"><tr><th>phần</th><th>nội dung</th></tr>
          <tr><td>1</td><td>nguyên tắc đạo đức chung</td></tr>
          <tr><td>2</td><td>trách nhiệm nghề nghiệp</td></tr>
          <tr><td>3</td><td>nguyên tắc cho người lãnh đạo</td></tr>
          <tr><td>4</td><td>tuân thủ bộ quy tắc</td></tr></table>
        focus: [1, "2.2", "2.4", "2.5"]
        say: "Nghề tin học có những bộ quy tắc nghề nghiệp viết sẵn, ta dùng bộ quy tắc đạo đức năm 2018 của Hiệp hội Máy tính, tên viết tắt ghi trên màn hình. Phần một là các nguyên tắc đạo đức chung. Phần hai là trách nhiệm nghề nghiệp. Phần ba dành cho người lãnh đạo, và phần bốn nói về việc tuân thủ bộ quy tắc."
      - clear: true
        show: |
          <table class="t"><tr><th>nguyên tắc</th><th>ý chính (dịch sát)</th></tr>
          <tr><td>1.1</td><td>đóng góp cho xã hội; <b>mọi người đều là bên liên quan</b> của tin học. Khi lợi ích các nhóm xung đột, nhu cầu của người <b>yếu thế hơn</b> được ưu tiên.</td></tr>
          <tr><td>1.2</td><td><b>tránh gây hại</b>. Việc làm có thiện ý, kể cả hoàn thành nhiệm vụ được giao, vẫn có thể gây hại; có nghĩa vụ <b>báo dấu hiệu rủi ro</b>.</td></tr>
          <tr><td>1.3</td><td>trung thực: nói đủ <b>khả năng, giới hạn và vấn đề</b> của hệ thống cho đúng người.</td></tr>
          <tr><td>2.5</td><td>đánh giá kỹ hệ thống và tác động, gồm <b>phân tích rủi ro</b>.</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.5"]
        say: "Bốn nguyên tắc dùng ngay trong bài này. Nguyên tắc 1 chấm 1 nói mọi người đều là bên liên quan của tin học. Khi lợi ích các nhóm xung đột, nhu cầu của người yếu thế hơn được ưu tiên. Nguyên tắc 1 chấm 2 là tránh gây hại, vì việc làm có thiện ý, kể cả hoàn thành nhiệm vụ được giao, vẫn có thể gây hại. Nó cũng nói người làm nghề có nghĩa vụ báo dấu hiệu rủi ro. Nguyên tắc 1 chấm 3 đòi nói đủ khả năng, giới hạn và vấn đề của hệ thống, còn 2 chấm 5 đòi phân tích rủi ro."
      - clear: true
        show: |
          <div class="box key">Bộ quy tắc ghi rõ: nó <b>không phải là một thuật toán</b> để giải bài toán đạo đức, mà là <b>cơ sở để ra quyết định</b>. Một tình huống có thể chạm nhiều nguyên tắc, mỗi nguyên tắc nặng nhẹ khác nhau.</div>
        say: "Bộ quy tắc tự ghi rõ rằng nó không phải là một thuật toán để giải bài toán đạo đức, mà là cơ sở để ra quyết định. Một tình huống có thể chạm nhiều nguyên tắc, mỗi nguyên tắc nặng nhẹ khác nhau, nên ta phải cân nhắc chứ không tra bảng."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một quyết định lan ra nhiều vòng"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430">
          <circle cx="430" cy="215" r="200" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
          <circle cx="430" cy="215" r="140" fill="#eff6ff" stroke="#2a78d6" stroke-width="2"/>
          <circle cx="430" cy="215" r="78" fill="#fff7ed" stroke="#eb6834" stroke-width="2.5"/>
          <g font-size="23" text-anchor="middle" fill="#1f2937">
          <text x="430" y="208" font-weight="bold">quyết định</text><text x="430" y="236">của đội</text>
          <text x="430" y="113">người dùng</text>
          <text x="430" y="53">không dùng</text>
          </g>
          <g font-size="23" fill="#1f2937">
          <text x="700" y="80" font-weight="bold">vòng trong:</text><text x="840" y="80">đội làm, người ra yêu cầu</text>
          <text x="700" y="150" font-weight="bold" fill="#2a78d6">vòng giữa:</text><text x="840" y="150">1&nbsp;000&nbsp;000 người được xếp hạng</text>
          <text x="700" y="220" font-weight="bold" fill="#059669">vòng ngoài:</text><text x="840" y="220">không dùng nhưng bị ảnh hưởng: người bán hàng, xã hội</text>
          <text x="700" y="300" fill="#b91c1c" font-weight="bold">tác hại thường rơi vào vòng ngoài,</text>
          <text x="700" y="336" fill="#b91c1c" font-weight="bold">nơi ít người lên tiếng nhất</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy một quyết định lan ra nhiều vòng. Vòng trong là đội làm và người ra yêu cầu, những người có mặt trong cuộc họp. Vòng giữa là 1 triệu người được xếp hạng, những người dùng trực tiếp. Vòng ngoài là người không dùng nhưng vẫn bị ảnh hưởng, như người bán hàng trên nền tảng, và tác hại thường rơi vào đó, nơi ít người lên tiếng nhất."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra hai con số: bao nhiêu người bị hại, và thử bao nhiêu thì thấy"
    checks:
      - "200 * 0.01 == 2"
      - "round(0.99 * 0.99, 4) == 0.9801"
      - "round(0.99 ** 3, 6) == 0.970299"
    steps:
      - show: |
          <p><b>Bước 1 — số người bị ảnh hưởng.</b> Vì mỗi người có tỉ lệ $p$ bị lỗi, cộng dồn qua $n$ người được trung bình:</p>
          $$\text{số người bị ảnh hưởng} = n \times p$$
          <p class="note">Làm thử: $n = 200$, $p = 0{,}01$ → $200 \times 0{,}01 = 2$ người.</p>
        focus: [2, 3]
        say: "Bước một, vì mỗi người có tỉ lệ p bị lỗi, cộng dồn qua n người ta được trung bình n nhân p người bị ảnh hưởng. Làm thử với 200 người và p bằng 0 phẩy 01, ta được 200 nhân 0 phẩy 01, bằng 2 người."
      - show: |
          <p><b>Bước 2 — một người thử không gặp lỗi.</b> Theo nghĩa của $p$, khả năng đó là $1 - p$. Với $p = 0{,}01$: $1 - 0{,}01 = 0{,}99$.</p>
          <p><b>Bước 3 — hai người cùng không gặp.</b> Vì hai người độc lập (giả định), nhân hai khả năng như ở phần ôn nền:</p>
          $$(1 - p) \times (1 - p) = 0{,}99 \times 0{,}99 = 0{,}9801$$
        focus: [1, 2, 3]
        say: "Bước hai, theo nghĩa của p, khả năng một người thử không gặp lỗi là 1 trừ p, ở đây là 0 phẩy 99. Bước ba, vì hai người thử độc lập với nhau, một giả định đơn giản hoá, ta nhân hai khả năng như ở phần ôn nền. Hai người cùng không gặp lỗi là 0 phẩy 99 nhân 0 phẩy 99, bằng 0 phẩy 9801."
      - clear: true
        show: |
          <p><b>Bước 4 — n người cùng không gặp.</b> Nhân $n$ lần thừa số $(1 - p)$, viết gọn bằng lũy thừa:</p>
          $$\text{khả năng không thấy lỗi nào} = \hlo{(1 - p)^n}$$
          <p class="note">Làm thử $n = 3$: $0{,}99 \times 0{,}99 \times 0{,}99 = 0{,}99^3 = 0{,}970299$. Ba người thử thì gần 97% là không ai thấy.</p>
        focus: [2, 3, 3]
        say: "Bước bốn, vì mỗi người thử thêm vào lại nhân thêm một thừa số 1 trừ p, nên n người cùng không gặp lỗi là 1 trừ p, mũ n. Làm thử với 3 người, 0 phẩy 99 nhân ba lần bằng 0 phẩy 970299. Vậy với ba người thử, gần 97 phần trăm khả năng là không ai thấy lỗi."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "1 triệu người dùng, lỗi 1%: từng phép tính"
    checks:
      - "1000000 * 0.01 == 10000"
      - "100 * 0.01 == 1"
      - "round(0.99 ** 100, 3) == 0.366"
      - "[round(0.99 ** k, 3) for k in (100, 200, 300)] == [0.366, 0.134, 0.049]"
      - "min(k for k in range(1, 1000) if 0.99 ** k < 0.05) == 299"
    steps:
      - show: |
          <p><b>Bước 1.</b> Người bị ảnh hưởng khi phát hành cho tất cả: $1\,000\,000 \times 0{,}01 = \hlb{10\,000}$ người.</p>
        say: "Bước một, nếu phát hành cho tất cả, số người bị ảnh hưởng là 1 triệu nhân 0 phẩy 01, bằng 10 nghìn người."
      - show: |
          <p><b>Bước 1.</b> Phát hành cho tất cả: $10\,000$ người bị ảnh hưởng.</p>
          <p><b>Bước 2.</b> 100 người thử nội bộ, trung bình gặp lỗi: $100 \times 0{,}01 = 1$ người.</p>
          <p><b>Bước 3.</b> Khả năng cả 100 người không ai gặp: $0{,}99^{100} \approx \hlo{0{,}366}$, tức khoảng 37%.</p>
        focus: [2, 3, 3]
        say: "Bước hai, 100 người thử nội bộ thì trung bình chỉ 1 người gặp lỗi. Bước ba, khả năng cả 100 người không ai gặp là 0 phẩy 99 mũ 100, xấp xỉ 0 phẩy 366. Tức là cứ khoảng ba lần thử như vậy thì hơn một lần đội không thấy gì và yên tâm phát hành."
      - clear: true
        show: |
          <p><b>Bước 4.</b> Cần thử bao nhiêu người để gần như chắc thấy lỗi? Tính $0{,}99^n$ với vài giá trị $n$:</p>
          <table class="t"><tr><th>số người thử n</th><th>khả năng không thấy lỗi nào</th><th>khả năng thấy ít nhất 1 lỗi</th></tr>
          <tr><td>100</td><td>0,366</td><td>0,634</td></tr>
          <tr><td>200</td><td>0,134</td><td>0,866</td></tr>
          <tr><td>300</td><td>$\hlg{0{,}049}$</td><td>0,951</td></tr></table>
          <p class="note">Số nhỏ nhất làm khả năng bỏ sót dưới 5% là $n = 299$. Muốn thấy lỗi tỉ lệ $p$, cần thử cỡ vài lần $\frac{1}{p}$ người.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước bốn hỏi cần thử bao nhiêu người để gần như chắc thấy lỗi, nên ta tính 0 phẩy 99 mũ n cho vài giá trị. Với 100 người, khả năng bỏ sót là 0 phẩy 366. Với 200 người, khả năng đó còn 0 phẩy 134. Với 300 người, chỉ còn 0 phẩy 049, dưới 5 phần trăm. Số nhỏ nhất làm khả năng bỏ sót dưới 5 phần trăm là 299, nên muốn thấy lỗi tỉ lệ p, cần thử cỡ vài lần 1 chia p người."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác"
    checks:
      - "round(0.99 ** 10, 4) == 0.9044 and round(0.9044 ** 10, 3) == 0.366"
      - "1000000 // 100 == 10000 and 10000 * 100 == 1000000"
      - "round(0.999 ** 100, 3) == 0.905 and round(1000000 * 0.001) == 1000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>$0{,}99^{100} \approx 0{,}366$</td><td>tính hai tầng: $0{,}99^{10} \approx 0{,}9044$, rồi $0{,}9044^{10} \approx 0{,}366$ ✓ (vì 100 = 10 × 10)</td></tr>
          <tr><td>10&nbsp;000 người</td><td>ngược lại: 10&nbsp;000 × 100 = 1&nbsp;000&nbsp;000, đúng là 1 phần trăm ✓</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Ta kiểm lại theo đường khác. Vì 100 bằng 10 nhân 10, tính hai tầng, 0 phẩy 99 mũ 10 xấp xỉ 0 phẩy 9044, rồi 0 phẩy 9044 mũ 10 xấp xỉ 0 phẩy 366, khớp. Với 10 nghìn người, nhân ngược lại 10 nghìn nhân 100 bằng 1 triệu, đúng là 1 phần trăm."
      - show: |
          <div class="box key"><b>Kiểm bằng lý lẽ:</b> lỗi càng hiếm ($p$ nhỏ), $1 - p$ càng gần 1, nên $(1 - p)^n$ càng gần 1 — thử ít người gần như chắc chắn không thấy. Lỗi hiếm không có nghĩa là ít người bị hại:</div>
          $$p = 0{,}001,\ n = 100 \text{ người thử: } 0{,}999^{100} \approx 0{,}905 \qquad n = 1\,000\,000 \text{ người dùng: } n \times p = 1000$$
        focus: [1, 1, 2]
        say: "Kiểm thêm bằng lý lẽ. Lỗi càng hiếm thì 1 trừ p càng gần 1, nên thử ít người gần như chắc chắn không thấy gì, nhưng n nhân p vẫn lớn khi số người dùng lớn. Ví dụ lỗi 0 phẩy 1 phần trăm, 100 người thử thì khoảng 90 phần trăm khả năng không ai thấy, trong khi 1 triệu người dùng vẫn có 1000 người bị hại."

  # ───────────────────────── 9. DÙNG BỘ QUY TẮC ─────────────────────────
  - id: tool
    kind: concept
    title: "Bốn câu hỏi trước khi bấm phát hành"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>dựa trên</th><th>trả lời cho ví dụ</th></tr>
          <tr><td>1. Ai bị ảnh hưởng, kể cả vòng ngoài?</td><td>1.1</td><td>1&nbsp;000&nbsp;000 người được xếp hạng và người bán hàng</td></tr>
          <tr><td>2. Tác hại lớn cỡ nào, có sửa lại được không?</td><td>1.2</td><td>10&nbsp;000 người xếp sai; sửa được nếu có nút quay lại</td></tr>
          <tr><td>3. Mình đã nói đủ giới hạn chưa, cho ai?</td><td>1.3</td><td>“100 người thử chưa đủ để thấy lỗi 1%”</td></tr>
          <tr><td>4. Rủi ro đã được đánh giá và theo dõi chưa?</td><td>2.5</td><td>phát hành dần, đo tỉ lệ khiếu nại</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bộ quy tắc trở thành công cụ khi ta biến nó thành câu hỏi. Câu một, ai bị ảnh hưởng, kể cả vòng ngoài như người bán hàng? Câu hai, tác hại lớn cỡ nào và có sửa lại được không, ở đây là 10 nghìn người, sửa được nếu có nút quay lại. Câu ba, mình đã nói đủ giới hạn chưa, ví dụ 100 người thử chưa đủ để thấy lỗi 1 phần trăm. Câu bốn, rủi ro đã được đánh giá và theo dõi chưa, ví dụ phát hành dần và đo tỉ lệ khiếu nại."

  # ───────────────────────── 10. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round(0.99 ** 100, 2) == 0.37"
      - "round(1 - 0.99 ** 100, 2) == 0.63"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Tôi chỉ làm theo yêu cầu” <b class="red">(không bỏ được trách nhiệm)</b>
          <br><span class="note">Nguyên tắc 1.2: việc hoàn thành nhiệm vụ được giao vẫn có thể gây hại. Người hiểu rủi ro kỹ thuật rõ nhất có nghĩa vụ nói ra.</span></div>
        say: "Lỗi thứ nhất là nghĩ tôi chỉ làm theo yêu cầu. Theo nguyên tắc 1 chấm 2, hoàn thành nhiệm vụ được giao vẫn có thể gây hại. Người hiểu rủi ro kỹ thuật rõ nhất, thường là chính người viết mã, có nghĩa vụ nói ra."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “100 người thử không ai gặp lỗi, vậy là không có lỗi” <b class="red">(37% vẫn có thể như vậy)</b>
          <br><span class="note">Phép thử bắt được: tính $(1 - p)^n$ cho mức lỗi mình lo ngại trước khi kết luận.</span></div>
        say: "Lỗi thứ hai là nghĩ 100 người thử không ai gặp lỗi thì không có lỗi. Với lỗi 1 phần trăm, chuyện đó vẫn xảy ra khoảng 37 phần trăm số lần. Phép thử bắt được lỗi này là tính 1 trừ p, mũ n, cho mức lỗi mình lo ngại, trước khi kết luận."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Báo rủi ro ồn ào mà chưa đánh giá <b class="red">(cũng gây hại)</b>
          <br><span class="note">Nguyên tắc 1.2 ghi: báo rủi ro tuỳ tiện hay sai lệch tự nó có thể gây hại; trước khi báo, hãy đánh giá kỹ.</span></div>
          <table class="t"><tr><th>báo kiểu ồn ào</th><th>báo có số liệu</th></tr>
          <tr><td>“Thuật toán này nguy hiểm lắm!”</td><td>“Xếp sai khoảng 1%, tức 10&nbsp;000 người; 100 người thử có 37% khả năng bỏ sót.”</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là báo rủi ro ồn ào mà chưa đánh giá. Nguyên tắc 1 chấm 2 ghi rằng báo rủi ro tuỳ tiện hay sai lệch tự nó có thể gây hại. Vì vậy hãy mang con số đi họp, ví dụ 10 nghìn người bị ảnh hưởng, khả năng bỏ sót 37 phần trăm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng bộ quy tắc như bảng tra đúng sai <b class="red">(nó không phải thuật toán)</b>
          <br><span class="note">Một tình huống chạm nhiều nguyên tắc; phải cân nhắc và ghi lại lý do, để người khác kiểm tra được quyết định.</span></div>
          <table class="t"><tr><th>ghi lại quyết định</th><th>ví dụ</th></tr>
          <tr><td>nguyên tắc liên quan</td><td>1.2 tránh gây hại, 1.3 nói đủ giới hạn</td></tr>
          <tr><td>lựa chọn và lý do</td><td>phát hành dần vì lỗi 1% khó thấy khi thử ít người</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư là dùng bộ quy tắc như một bảng tra đúng sai. Bộ quy tắc tự nói nó không phải thuật toán. Một tình huống chạm nhiều nguyên tắc, nên phải cân nhắc và ghi lại lý do, để người khác kiểm tra được quyết định."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: phát hành cho 2 triệu người thế nào?"
    checks:
      - "2000000 * 0.005 == 10000"
      - "round(0.995 ** 200, 3) == 0.367"
      - "2000000 // 100 == 20000 and 20000 * 0.005 == 100 and 0.995 ** 20000 < 1e-40"
    steps:
      - show: |
          <p>Ứng dụng có <b>2&nbsp;000&nbsp;000</b> người dùng; tính năng mới làm hỏng tài khoản của <b>0,5%</b> người dùng (số minh hoạ). Thử nội bộ <b>200 người</b>, không ai gặp lỗi.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Phát hành cho tất cả thì bao nhiêu người bị ảnh hưởng?</td></tr>
          <tr><td>2</td><td>Khả năng 200 người thử không ai gặp lỗi là bao nhiêu?</td></tr>
          <tr><td>3</td><td>Bạn đề xuất phát hành thế nào? Nói với ai, nói gì?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Ứng dụng có 2 triệu người dùng, tính năng mới làm hỏng tài khoản của 0 phẩy 5 phần trăm người dùng, và 200 người thử nội bộ không ai gặp lỗi. Câu một, phát hành cho tất cả thì bao nhiêu người bị ảnh hưởng? Câu hai, khả năng 200 người thử không ai gặp lỗi là bao nhiêu? Câu ba, bạn đề xuất phát hành thế nào, và nói với ai? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$2\,000\,000 \times 0{,}005$</td><td>$\hlb{10\,000}$ người</td></tr>
          <tr><td>2</td><td>$(1 - 0{,}005)^{200} = 0{,}995^{200}$</td><td>$\approx \hlo{0{,}367}$ — gần 37%</td></tr></table>
          <p class="note">Câu 2 cho thấy: “200 người không ai gặp” gần như không nói gì về lỗi 0,5%.</p>
        focus: ["1.2", "1.3", 2]
        say: "Đáp án câu một, 2 triệu nhân 0 phẩy 005 bằng 10 nghìn người. Câu hai, khả năng không ai gặp lỗi là 0 phẩy 995 mũ 200, xấp xỉ 0 phẩy 367, gần 37 phần trăm. Vậy kết quả 200 người không ai gặp gần như không nói gì về một lỗi 0 phẩy 5 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3: đề xuất</th><th>vì sao</th></tr>
          <tr><td>phát hành dần: trước cho 1% = 20&nbsp;000 người</td><td>kỳ vọng $20\,000 \times 0{,}005 = 100$ người gặp lỗi — đủ nhiều để thấy, ít hơn 100 lần so với 10&nbsp;000</td></tr>
          <tr><td>có nút quay lại và đo tỉ lệ tài khoản hỏng</td><td>tác hại sửa được nếu phát hiện sớm</td></tr>
          <tr><td>báo trưởng nhóm bằng con số, kèm giới hạn của lần thử</td><td>nguyên tắc 1.3: nói đủ giới hạn cho đúng người</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu ba là một đề xuất có lý do. Hãy phát hành dần, trước cho 1 phần trăm, tức 20 nghìn người, khi đó kỳ vọng 100 người gặp lỗi, đủ nhiều để thấy mà ít hơn 100 lần so với 10 nghìn. Hãy có nút quay lại và đo tỉ lệ tài khoản hỏng. Cuối cùng, báo trưởng nhóm bằng con số kèm giới hạn của lần thử, đúng tinh thần nguyên tắc 1 chấm 3."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic, tư duy và bản đồ khoá"
    steps:
      - show: |
          <div class="chain"><span class="n">một quyết định lan ra nhiều vòng bên liên quan</span><span class="a">→</span>
          <span class="n">người bị hại $\approx n \times p$</span><span class="a">→</span>
          <span class="n">thử $n$ người bỏ sót với khả năng $(1 - p)^n$</span><span class="a">→</span>
          <span class="n">nói rõ giới hạn, phát hành dần, theo dõi</span></div>
        say: "Tổng kết lại, một quyết định kỹ thuật lan ra nhiều vòng bên liên quan. Số người bị hại xấp xỉ n nhân p, còn thử n người thì bỏ sót lỗi với khả năng 1 trừ p, mũ n. Vì vậy người làm nghề nói rõ giới hạn, phát hành dần và theo dõi."
      - show: |
          <div class="box key"><b>Tư duy:</b> “ai chịu hậu quả?” là câu hỏi kỹ thuật, có con số — không phải câu hỏi để sau. Người hiểu rủi ro rõ nhất có nghĩa vụ nói ra, bằng số liệu.</div>
        say: "Điều cần mang theo, câu hỏi ai chịu hậu quả là một câu hỏi kỹ thuật có con số, không phải câu hỏi để sau. Người hiểu rủi ro rõ nhất có nghĩa vụ nói ra, bằng số liệu."
      - clear: true
        show: |
          <table class="t"><tr><th>bài</th><th>nội dung</th><th>bài</th><th>nội dung</th></tr>
          <tr><td>0</td><td>trách nhiệm nghề nghiệp (bài này)</td><td>6</td><td>tác động môi trường: điện năng, phát thải</td></tr>
          <tr><td>1</td><td>dữ liệu cá nhân, vì sao ẩn danh khó</td><td>7</td><td>công bố lỗ hổng có phối hợp</td></tr>
          <tr><td>2</td><td>công bằng có định lượng</td><td>8</td><td>ra quyết định khi lợi ích xung đột</td></tr>
          <tr><td>3</td><td>giải thích được, lý do phản chứng</td><td>9</td><td>ước lượng, cam kết, nói “chưa được”</td></tr>
          <tr><td>4</td><td>giấy phép phần mềm, mã nguồn mở</td><td>10</td><td>tình huống: một gói nhỏ bị gỡ</td></tr>
          <tr><td>5</td><td>rủi ro, an toàn, khi nào phải dừng</td><td>11</td><td>hành trình bảo vệ dữ liệu cá nhân</td></tr></table>
        forward_ref: true
        focus: [1, 1, 1, 1]
        say: "Đây là bản đồ khoá học, gồm 12 bài, từ bài 0 tới bài 11. Bài 1 tới bài 5 là các nền tảng, gồm dữ liệu cá nhân, công bằng có định lượng, giải thích được quyết định, giấy phép phần mềm, và rủi ro. Bài 6 tới bài 9 là tác động môi trường, công bố lỗ hổng, ra quyết định khi lợi ích xung đột, và ước lượng cam kết. Bài 10 là tình huống một gói nhỏ bị gỡ, bài 11 là hành trình bảo vệ dữ liệu cá nhân."
      - show: |
          <p class="note">Bài sau (bài 1): <b>dữ liệu cá nhân</b> — chỉ thu điều cần cho mục đích đã nói, và vì sao xoá tên chưa phải là ẩn danh.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học về dữ liệu cá nhân, chỉ thu điều cần cho mục đích đã nói, và vì sao xoá tên chưa phải là ẩn danh. Hẹn gặp bạn ở bài tiếp theo."
