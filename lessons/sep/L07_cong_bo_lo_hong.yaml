assumes: []
# Quy ước: “ngày d” = số ngày kể từ ngày báo cho bên sửa (ngày báo là ngày 0), đếm theo lịch thật (`datetime`); v = ngày bên sửa phát
#   hành bản vá. Chính sách 90+30 đọc nguyên văn [PZ] (audit/sep/sources_L07.md); ví dụ “vá ngày 47 → công bố ngày 77”, “vá ngày 83 →
#   ngày 113” là ví dụ của chính trang đó. Ngày báo 1/1/2025, 10/3/2025 là số minh hoạ. Không dạy con số ân hạn 120 ngày (câu nguồn
#   viết “disclosed to the public”, nghĩa không rõ) — chỉ nói có ân hạn thêm 14 ngày khi bên sửa xin.
#   An ninh chỉ ở mức khái niệm phòng thủ: không mô tả cách khai thác; không nêu tên người tìm ra lỗi. Lời đọc không nói Heartbleed,
#   OpenSSL, Project Zero, CVE (probe SEC p2: ≤ 1/8, ≤ 6/8) — nói “một lỗ hổng lớn năm 2014”, “một thư viện mã hoá rất phổ biến”,
#   “nhóm săn lỗ hổng của Google”, “mã định danh lỗ hổng”; tên chỉ trên màn hình.
objectives:
  - "Mô tả quy trình báo riêng cho bên sửa, chờ bản vá, rồi mới công bố chi tiết"
  - "Tính hạn vá và ngày công bố theo chính sách 90+30 bằng lịch thật, kể cả năm nhuận và trường hợp lỗi đang bị khai thác"
  - "Cân giữa việc người dùng cần biết để tự bảo vệ và việc kẻ xấu chưa biết chi tiết, rồi quyết định nên làm gì khi tự tìm thấy lỗ hổng"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ngày 3/4/2014 tìm ra lỗi, ngày 7/4 có bản sửa — rồi sao nữa?"
    checks:
      - "(__import__('datetime').date(2014, 4, 7) - __import__('datetime').date(2014, 4, 3)).days == 4"
    steps:
      - show: |
          <p>Năm 2014, một lỗ hổng trong thư viện mã hoá rất phổ biến (Heartbleed, thư viện OpenSSL — gói mã viết sẵn để mã hoá kết nối mạng) cho phép người ngoài đọc trộm bộ nhớ của máy chủ. Một nhóm phát hiện ghi: họ tìm ra ngày <b>3/4/2014</b>; bản sửa 1.0.1g phát hành ngày <b>7/4/2014</b> — sau <b>4 ngày</b>.</p>
          <p>Nhưng trang của nhóm cũng ghi: lỗi đã được <b>người khác tìm ra và công bố chi tiết độc lập</b> trước khi việc báo cho các bên kịp xong.</p>
          <div class="box key">Hôm nay: (1) tìm thấy lỗ hổng thì báo cho ai, chờ bao lâu? (2) tính hạn vá và ngày công bố thế nào? (3) vì sao công bố sớm quá hay giữ kín mãi đều gây hại?</div>
        focus: [1, 1, 1, 2, 3]
        say: "Chào bạn, năm 2014, một lỗ hổng lớn được tìm thấy trong một thư viện mã hoá rất phổ biến, tên ghi trên màn hình. Thư viện là gói mã viết sẵn, ở đây dùng để mã hoá kết nối mạng, và lỗ hổng cho phép người ngoài đọc trộm bộ nhớ của máy chủ. Một nhóm phát hiện ghi rằng họ tìm ra lỗi ngày 3 tháng 4, và bản sửa ra ngày 7 tháng 4, sau 4 ngày. Nhưng trang của nhóm cũng ghi rằng lỗi đã được người khác tìm ra và công bố chi tiết độc lập, trước khi việc báo cho các bên kịp xong. Hôm nay ta trả lời ba câu hỏi, báo cho ai và chờ bao lâu, tính ngày thế nào, và vì sao công bố sớm quá hay giữ kín mãi đều gây hại."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: đếm ngày theo lịch"
    checks:
      - "31 + 28 + 31 == 90 and 31 + 29 + 31 == 91"
      - "(__import__('datetime').date(2025, 2, 1) - __import__('datetime').date(2025, 1, 1)).days == 31"
    steps:
      - show: |
          <p><b>① Số ngày mỗi tháng</b> đầu năm:</p>
          <table class="t"><tr><th>tháng</th><th>số ngày</th><th>cộng dồn</th></tr>
          <tr><td>1</td><td>31</td><td>31</td></tr>
          <tr><td>2</td><td>28 (năm nhuận: 29)</td><td>59 (năm nhuận: 60)</td></tr>
          <tr><td>3</td><td>31</td><td>90 (năm nhuận: 91)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Điều thứ nhất là số ngày mỗi tháng đầu năm. Tháng 1 có 31 ngày. Tháng 2 có 28 ngày, năm nhuận có 29, nên cộng dồn được 59, năm nhuận là 60. Tháng 3 có 31 ngày, cộng dồn lên 90, năm nhuận là 91."
      - show: |
          <p><b>② Cộng thêm d ngày vào một ngày.</b> Đi hết tháng hiện tại, phần còn lại sang tháng sau:</p>
          $$1/1 + 31 \text{ ngày} = 1/2 \qquad 3/4 + 4 \text{ ngày} = 7/4$$
        focus: [1, 2]
        say: "Điều thứ hai là cộng thêm một số ngày vào một ngày, ta đi hết tháng hiện tại rồi chuyển phần còn lại sang tháng sau. Ví dụ ngày 1 tháng 1 cộng 31 ngày là ngày 1 tháng 2, còn ngày 3 tháng 4 cộng 4 ngày là ngày 7 tháng 4."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của nghề: bên sửa, bản vá, ngày 0, công bố có phối hợp"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>lỗ hổng</b></td><td>lỗi cho phép người khác làm điều hệ thống không cho phép</td></tr>
          <tr><td><b>bên sửa</b></td><td>người làm ra phần mềm có lỗi, có quyền phát hành bản sửa</td></tr>
          <tr><td><b>ngày 0, ngày d</b></td><td>ngày báo riêng cho bên sửa là ngày 0; ngày d là d ngày sau đó</td></tr>
          <tr><td><b>công bố có phối hợp</b></td><td>báo riêng trước, chờ bản vá, rồi mới công bố chi tiết, theo một hạn đã nói rõ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Lỗ hổng là lỗi cho phép người khác làm điều hệ thống không cho phép. Bên sửa là người làm ra phần mềm có lỗi, có quyền phát hành bản sửa. Ngày báo riêng cho bên sửa gọi là ngày 0, và ngày d là d ngày sau đó. Công bố có phối hợp là báo riêng trước, chờ bản vá, rồi mới công bố chi tiết, theo một hạn đã nói rõ từ đầu."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: policy
    kind: concept
    title: "Một chính sách thật: 90 + 30 ngày"
    steps:
      - show: |
          <p>Chính sách công bố của nhóm săn lỗ hổng Project Zero (Google), đọc ngày 2/11/2026:</p>
          <table class="t"><tr><th>trường hợp</th><th>quy định (dịch sát)</th></tr>
          <tr><td>bình thường</td><td>bên sửa có <b>90 ngày</b> kể từ khi được báo để phát hành bản vá</td></tr>
          <tr><td>đã vá trong 90 ngày</td><td>chi tiết được công bố <b>30 ngày sau</b> khi bản vá đến tay người dùng</td></tr>
          <tr><td>không vá kịp</td><td>chi tiết được công bố <b>ở cuối hạn 90 ngày</b></td></tr>
          <tr><td>lỗ hổng đang bị khai thác thật</td><td>hạn <b>7 ngày</b> thay cho 90; vá trong 7 ngày thì vẫn chờ 30 ngày sau bản vá</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Đây là một chính sách thật, của nhóm săn lỗ hổng ở Google, đọc ngày 2 tháng 11 năm 2026. Trường hợp bình thường, bên sửa có 90 ngày kể từ khi được báo để phát hành bản vá. Nếu đã vá trong 90 ngày, chi tiết được công bố 30 ngày sau khi bản vá đến tay người dùng. Nếu không vá kịp, chi tiết được công bố ở cuối hạn 90 ngày. Nếu lỗ hổng đang bị khai thác thật, hạn chỉ còn 7 ngày, và vá trong 7 ngày thì vẫn chờ 30 ngày sau bản vá."
      - show: |
          <p>Trang chính sách còn ghi: bên sửa có thể xin thêm <b>14 ngày ân hạn</b> nếu chắc chắn vá được trong thời gian đó; và hai bên có thể <b>cùng đồng ý</b> công bố sớm hơn.</p>
          <div class="box key">Bộ quy tắc nghề nghiệp năm 2018 (nguyên tắc 2.9): vì mối đe doạ có thể xuất hiện sau khi hệ thống đã chạy, người làm nghề cần đưa vào các biện pháp như <b>giám sát, vá lỗi, nhận báo cáo lỗ hổng</b>, và báo cho người bị ảnh hưởng bởi rò rỉ dữ liệu <b>kịp thời, rõ ràng</b>.</div>
        focus: [1, 2, 2]
        say: "Trang chính sách còn ghi rằng bên sửa có thể xin thêm 14 ngày ân hạn, nếu chắc chắn vá được trong thời gian đó, và hai bên có thể cùng đồng ý công bố sớm hơn. Bộ quy tắc nghề nghiệp năm 2018, ở nguyên tắc 2 chấm 9, nói mối đe doạ có thể xuất hiện sau khi hệ thống đã chạy. Vì vậy người làm nghề cần giám sát, vá lỗi và có kênh nhận báo cáo lỗ hổng, rồi báo cho người bị ảnh hưởng một cách kịp thời và rõ ràng."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Trục thời gian: hạn vá và ngày công bố"
    steps:
      - show: |
          <div><svg width="1700" height="400" viewBox="0 0 1700 400"><defs><marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <rect x="100" y="140" width="1080" height="60" rx="6" fill="#eff6ff" stroke="#2a78d6" stroke-width="2"/>
          <line x1="60" y1="170" x2="1640" y2="170" stroke="#1f2937" stroke-width="3" marker-end="url(#ar7)"/>
          <g font-size="23" text-anchor="middle" fill="#1f2937">
          <circle cx="100" cy="170" r="12" fill="#eb6834"/><text x="100" y="116" font-weight="bold">ngày 0</text><text x="100" y="250">báo riêng</text><text x="100" y="282">cho bên sửa</text>
          <text x="640" y="116" fill="#2a78d6" font-weight="bold">90 ngày để vá (chi tiết còn giữ kín)</text>
          <circle cx="664" cy="170" r="12" fill="#059669"/><text x="664" y="250" fill="#059669">vá ở ngày 47</text>
          <circle cx="1024" cy="170" r="12" fill="#059669"/><text x="1024" y="250" fill="#059669">công bố ngày 77</text><text x="1024" y="282" fill="#059669">(47 + 30)</text>
          <circle cx="1180" cy="170" r="12" fill="#dc2626"/><text x="1240" y="116" fill="#dc2626" font-weight="bold">ngày 90</text><text x="1300" y="250" fill="#dc2626">chưa vá: công bố</text><text x="1300" y="282" fill="#dc2626">ở ngày 90</text>
          </g>
          <text x="850" y="365" font-size="23" fill="#6b7280" text-anchor="middle">30 ngày sau bản vá: người dùng kịp cài trước khi chi tiết lan rộng</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian của chính sách. Ngày 0 là ngày báo riêng cho bên sửa, và dải màu xanh là 90 ngày để vá, trong lúc chi tiết còn giữ kín. Nếu bên sửa vá ở ngày 47, chi tiết được công bố ở ngày 77, tức 47 cộng 30, để người dùng kịp cài bản vá. Nếu tới ngày 90 vẫn chưa vá, chi tiết được công bố ngay ở ngày 90."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra ngày công bố từ chính sách"
    checks:
      - "47 + 30 == 77 and 83 + 30 == 113"
      - "min(83 + 30, 10 ** 9) == 113 and 113 > 90"
    steps:
      - show: |
          <p><b>Bước 1 — có bản vá ở ngày v, với v không quá 90.</b> Theo chính sách, chờ thêm 30 ngày sau bản vá:</p>
          $$\text{ngày công bố} = v + 30$$
          <p class="note">Làm thử bằng ví dụ của chính trang chính sách: vá ở ngày 47 → $47 + 30 = 77$; vá ở ngày 83 → $83 + 30 = 113$.</p>
        focus: [1, 2, 3]
        say: "Bước một, nếu có bản vá ở ngày v, với v không quá 90, thì theo chính sách ta chờ thêm 30 ngày sau bản vá, nên ngày công bố bằng v cộng 30. Làm thử bằng ví dụ của chính trang chính sách, vá ở ngày 47 thì công bố ngày 77. Vá ở ngày 83 thì công bố ngày 113."
      - show: |
          <p><b>Bước 2 — chưa vá tới ngày 90.</b> Không còn bản vá để chờ, nên công bố ở cuối hạn:</p>
          $$\text{ngày công bố} = 90$$
          <p class="note">Nhận xét: vá càng muộn, ngày công bố càng muộn — vá ở ngày 83 thì chi tiết lộ ở ngày 113, <b>sau</b> hạn 90. Không có gì “phạt” bên sửa vì vá trong hạn.</p>
        focus: [1, 2, 3, 3]
        say: "Bước hai, nếu tới ngày 90 vẫn chưa vá, thì không còn bản vá để chờ, nên công bố ở cuối hạn, ngày 90. Nhận xét, vá càng muộn thì ngày công bố càng muộn. Vá ở ngày 83 thì chi tiết lộ ở ngày 113, sau cả hạn 90. Vì vậy chính sách không phạt bên sửa nếu vá trong hạn."
      - clear: true
        show: |
          <p><b>Bước 3 — đang bị khai thác thật.</b> Thay 90 bằng 7, giữ nguyên luật 30 ngày:</p>
          <table class="t"><tr><th>tình huống</th><th>ngày công bố</th></tr>
          <tr><td>vá ở ngày v, với v không quá hạn H</td><td>$v + 30$</td></tr>
          <tr><td>chưa vá tới ngày H</td><td>$H$</td></tr></table>
          <p class="note">H = 90 bình thường, H = 7 khi lỗ hổng đang bị khai thác. Làm thử: H = 7, vá ở ngày 5 → công bố ngày $5 + 30 = 35$.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước ba, khi lỗ hổng đang bị khai thác thật, ta thay hạn 90 bằng 7 mà giữ nguyên luật 30 ngày. Gộp lại, nếu vá ở ngày v trong hạn H thì công bố ngày v cộng 30. Nếu chưa vá tới ngày H thì công bố ở ngày H. Làm thử với H bằng 7, vá ở ngày 5 thì công bố ngày 35."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Báo ngày 1/1/2025: từng ngày trên lịch"
    checks:
      - "__import__('datetime').date(2025, 1, 1) + __import__('datetime').timedelta(days=90) == __import__('datetime').date(2025, 4, 1)"
      - "__import__('datetime').date(2025, 1, 1) + __import__('datetime').timedelta(days=47) == __import__('datetime').date(2025, 2, 17)"
      - "__import__('datetime').date(2025, 1, 1) + __import__('datetime').timedelta(days=77) == __import__('datetime').date(2025, 3, 19)"
      - "__import__('datetime').date(2025, 1, 1) + __import__('datetime').timedelta(days=7) == __import__('datetime').date(2025, 1, 8)"
    steps:
      - show: |
          <p>Bạn báo riêng cho bên sửa ngày <b>1/1/2025</b> (số minh hoạ; 2025 không nhuận).</p>
          <p><b>Bước 1.</b> Hạn vá, ngày 90: tháng 1 có 31, tháng 2 có 28, tháng 3 có 31 ngày, và $31 + 28 + 31 = 90$, nên ngày 90 là <b>$\hlb{1/4/2025}$</b>.</p>
        focus: [1, 2, 2]
        say: "Giả sử bạn báo riêng cho bên sửa ngày 1 tháng 1 năm 2025, một năm không nhuận. Bước một, hạn vá là ngày 90. Vì tháng 1 có 31 ngày, tháng 2 có 28, tháng 3 có 31, cộng lại đúng 90, nên ngày 90 là ngày 1 tháng 4 năm 2025."
      - show: |
          <p><b>Bước 2.</b> Bên sửa vá ở ngày 47: 31 ngày tới 1/2, thêm 16 ngày → <b>$\hlb{17/2/2025}$</b>.</p>
          <p><b>Bước 3.</b> Công bố ở ngày $47 + 30 = 77$: từ 17/2 thêm 11 ngày tới 28/2, thêm 19 ngày nữa → <b>$\hlg{19/3/2025}$</b>.</p>
        focus: [1, 2]
        say: "Bước hai, bên sửa vá ở ngày 47, tức đi 31 ngày tới 1 tháng 2 rồi thêm 16 ngày, là ngày 17 tháng 2. Bước ba, ngày công bố là 47 cộng 30, ngày 77, từ 17 tháng 2 thêm 11 ngày tới 28 tháng 2, rồi thêm 19 ngày nữa, là ngày 19 tháng 3."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>tình huống</th><th>ngày</th></tr>
          <tr><td>1</td><td>hạn vá (ngày 90)</td><td>1/4/2025</td></tr>
          <tr><td>2–3</td><td>vá ở ngày 47 → công bố ngày 77</td><td>17/2 → 19/3/2025</td></tr>
          <tr><td>4</td><td>không vá kịp → công bố ở ngày 90</td><td>1/4/2025</td></tr>
          <tr><td>5</td><td>có người đang khai thác: hạn 7 ngày</td><td>$\hlo{8/1/2025}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng gom các trường hợp. Hạn vá là ngày 1 tháng 4. Vá ở ngày 47 thì công bố ngày 19 tháng 3. Bước bốn, không vá kịp thì công bố ngay ngày 1 tháng 4. Bước năm, nếu có người đang khai thác lỗi, hạn chỉ còn 7 ngày, tức ngày 8 tháng 1."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác: số thứ tự ngày trong năm"
    checks:
      - "1 + 77 == 78 and 78 - 59 == 19"
      - "1 + 90 == 91 and 91 - 90 == 1"
      - "(__import__('datetime').date(2025, 3, 19) - __import__('datetime').date(2025, 2, 17)).days == 30"
    steps:
      - show: |
          <p>Đánh số mỗi ngày theo thứ tự trong năm: 1/1 là ngày thứ 1. Vì cộng d ngày là cộng d vào số thứ tự:</p>
          <table class="t"><tr><th>ngày cần tìm</th><th>số thứ tự</th><th>đổi lại thành ngày tháng</th></tr>
          <tr><td>ngày 77 sau 1/1</td><td>$1 + 77 = 78$</td><td>trừ 59 ngày của tháng 1–2: $78 - 59 = 19$ → 19/3 ✓</td></tr>
          <tr><td>ngày 90 sau 1/1</td><td>$1 + 90 = 91$</td><td>trừ 90 ngày của tháng 1–3: $91 - 90 = 1$ → 1/4 ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Ta kiểm lại theo đường khác, đánh số mỗi ngày theo thứ tự trong năm, ngày 1 tháng 1 là ngày thứ 1. Ngày 77 sau đó có số thứ tự 78, trừ 59 ngày của tháng 1 và tháng 2 còn 19, nên là 19 tháng 3, khớp. Ngày 90 sau đó có số thứ tự 91, trừ 90 ngày của ba tháng đầu còn 1, nên là 1 tháng 4, khớp."
      - show: |
          <p>Kiểm thêm khoảng cách: từ ngày vá 17/2 tới ngày công bố 19/3:</p>
          $$(28 - 17) + 19 = 11 + 19 = 30 \text{ ngày} \checkmark$$
        focus: [1, 2]
        say: "Kiểm thêm khoảng cách từ ngày vá 17 tháng 2 tới ngày công bố 19 tháng 3. Vì tháng 2 năm 2025 có 28 ngày nên còn 11 ngày của tháng 2, cộng 19 ngày của tháng 3, bằng 30 ngày, đúng như chính sách, dấu tích ở cuối là đã khớp."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "__import__('datetime').date(2024, 1, 1) + __import__('datetime').timedelta(days=90) == __import__('datetime').date(2024, 3, 31)"
    steps:
      - show: |
          <table class="t"><tr><th>lỗi</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> Đăng chi tiết lỗi lên mạng ngay khi tìm ra</td><td>chưa có bản vá: người dùng không tự bảo vệ được, kẻ xấu thì biết cách</td><td>báo riêng cho bên sửa, kèm hạn rõ ràng</td></tr>
          <tr><td><b class="red">2.</b> Giữ kín mãi “cho an toàn”</td><td>không có hạn thì bên sửa ít động lực vá; người dùng không biết mình đang gặp rủi ro</td><td>đặt hạn, công bố khi đã vá hoặc hết hạn</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai lỗi đầu. Lỗi thứ nhất là đăng chi tiết lỗi lên mạng ngay khi tìm ra. Khi chưa có bản vá, người dùng không tự bảo vệ được, còn kẻ xấu thì biết cách, nên hãy báo riêng cho bên sửa kèm hạn rõ ràng. Lỗi thứ hai là giữ kín mãi cho an toàn. Không có hạn thì bên sửa ít động lực vá, và người dùng không biết mình đang gặp rủi ro."
      - clear: true
        show: |
          <table class="t"><tr><th>lỗi</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3 — của người đã đi làm.</b> Công ty không có kênh nhận báo cáo lỗ hổng, hoặc không trả lời</td><td>người tìm ra lỗi không biết báo ai, dễ công bố thẳng; nguyên tắc 2.9 đòi có quy trình nhận báo cáo</td><td>một địa chỉ nhận báo cáo, hẹn ngày trả lời, theo dõi tới khi vá</td></tr>
          <tr><td><b class="red">4.</b> Đếm “90 ngày” theo trí nhớ, quên năm nhuận</td><td>1/1/2024 cộng 90 ngày là 31/3/2024, không phải 1/4</td><td>tính bằng lịch hoặc máy, ghi rõ ngày hạn trong thư báo</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Lỗi thứ ba hay gặp ở công ty đang chạy sản phẩm, là không có kênh nhận báo cáo lỗ hổng, hoặc có mà không trả lời. Người tìm ra lỗi không biết báo ai nên dễ công bố thẳng, trong khi nguyên tắc 2 chấm 9 đòi có quy trình nhận báo cáo. Lỗi thứ tư là đếm 90 ngày theo trí nhớ mà quên năm nhuận. Ngày 1 tháng 1 năm 2024 cộng 90 ngày là 31 tháng 3, không phải 1 tháng 4."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: bạn tìm thấy một lỗ hổng"
    checks:
      - "__import__('datetime').date(2025, 3, 10) + __import__('datetime').timedelta(days=90) == __import__('datetime').date(2025, 6, 8)"
      - "__import__('datetime').date(2025, 3, 10) + __import__('datetime').timedelta(days=20) == __import__('datetime').date(2025, 3, 30) and __import__('datetime').date(2025, 3, 10) + __import__('datetime').timedelta(days=50) == __import__('datetime').date(2025, 4, 29)"
      - "__import__('datetime').date(2025, 3, 10) + __import__('datetime').timedelta(days=7) == __import__('datetime').date(2025, 3, 17)"
    steps:
      - show: |
          <p>Bạn tìm thấy một lỗ hổng trong thư viện mà nhiều ứng dụng dùng, và báo riêng cho nhóm duy trì ngày <b>10/3/2025</b> (số minh hoạ), theo chính sách 90+30.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Hạn vá (ngày 90) là ngày nào?</td></tr>
          <tr><td>2</td><td>Nhóm vá ở ngày 20. Bạn công bố chi tiết ngày nào?</td></tr>
          <tr><td>3</td><td>Ngày 12/3 bạn thấy có người đang khai thác lỗi đó. Hạn đổi thế nào, và bạn làm gì?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Bạn tìm thấy một lỗ hổng trong thư viện nhiều ứng dụng dùng, và báo riêng cho nhóm duy trì ngày 10 tháng 3 năm 2025. Câu một, hạn vá là ngày nào? Câu hai, nhóm vá ở ngày 20, vậy bạn công bố chi tiết ngày nào? Câu ba, ngày 12 tháng 3 bạn thấy có người đang khai thác lỗi đó, vậy hạn đổi thế nào và bạn làm gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính trên lịch</th><th>kết quả</th></tr>
          <tr><td>1</td><td>10/3 + 90: còn 21 ngày tháng 3, 30 ngày tháng 4, 31 ngày tháng 5 → 82; thêm 8</td><td>$\hlb{8/6/2025}$</td></tr>
          <tr><td>2</td><td>vá ngày 20 = 30/3; công bố ngày $20 + 30 = 50$</td><td>$\hlg{29/4/2025}$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án từng câu. Câu một, từ 10 tháng 3 còn 21 ngày của tháng 3, cộng 30 ngày tháng 4 và 31 ngày tháng 5 được 82, thêm 8 ngày nữa là ngày 8 tháng 6 năm 2025. Câu hai, vá ở ngày 20 là ngày 30 tháng 3, còn công bố ở ngày 20 cộng 30, tức ngày 50, là 29 tháng 4."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3</th><th>vì sao</th></tr>
          <tr><td>hạn vá đổi thành 7 ngày: $10/3 + 7 = $ <b>17/3/2025</b></td><td>người dùng đang bị tấn công thật, chờ 90 ngày là để họ chịu hại lâu</td></tr>
          <tr><td>báo ngay cho nhóm duy trì bằng chứng khai thác, vẫn không đăng cách khai thác</td><td>công bố là để người dùng tự bảo vệ, không phải để dạy kẻ xấu</td></tr>
          <tr><td>nếu chưa có bản vá, gợi ý cách giảm thiệt hại tạm thời (tắt tính năng, chặn đường vào)</td><td>người dùng có việc để làm ngay</td></tr></table>
          <p class="note">Trang chính sách không ghi rõ 7 ngày đếm từ ngày báo hay từ ngày thấy bằng chứng khai thác; bài đếm từ ngày 0 — hãy ghi rõ ngày hạn trong thư gửi bên sửa.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Câu ba, hạn vá đổi thành 7 ngày, tức ngày 17 tháng 3, vì người dùng đang bị tấn công thật. Báo ngay cho nhóm duy trì kèm bằng chứng khai thác, nhưng vẫn không đăng cách khai thác, vì công bố là để người dùng tự bảo vệ. Nếu chưa có bản vá, hãy gợi ý cách giảm thiệt hại tạm thời, như tắt tính năng hay chặn đường vào. Trang chính sách không ghi rõ bảy ngày đếm từ ngày báo hay từ ngày thấy bằng chứng, nên bài đếm từ ngày 0, và bạn hãy ghi rõ ngày hạn trong thư gửi bên sửa."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tìm ra lỗi: báo riêng cho bên sửa (ngày 0)</span><span class="a">→</span>
          <span class="n">hạn vá H = 90, hoặc 7 nếu đang bị khai thác</span><span class="a">→</span>
          <span class="n">vá ở ngày v: công bố ngày v + 30</span><span class="a">→</span>
          <span class="n">chưa vá tới ngày H: công bố ở ngày H</span></div>
        say: "Tổng kết lại, tìm ra lỗi thì báo riêng cho bên sửa, đó là ngày 0. Hạn vá là 90 ngày, hoặc 7 ngày nếu lỗi đang bị khai thác. Vá ở ngày v thì công bố ngày v cộng 30, còn chưa vá tới hạn thì công bố ở ngày hạn."
      - show: |
          <div class="box key"><b>Tư duy:</b> công bố có phối hợp cân hai rủi ro — người dùng <b>chưa biết</b> để tự bảo vệ, và kẻ xấu <b>biết sớm</b> để tấn công. Hạn rõ ràng, tính bằng lịch thật, là thứ giữ cho cả hai rủi ro nhỏ.</div>
        say: "Điều cần mang theo, công bố có phối hợp cân hai rủi ro, người dùng chưa biết để tự bảo vệ, và kẻ xấu biết sớm để tấn công. Một hạn rõ ràng, tính bằng lịch thật, giữ cho cả hai rủi ro đều nhỏ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>ra quyết định khi các bên xung đột lợi ích</b> — lập bảng bên liên quan và tìm phương án không gây hại nặng cho ai.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học cách ra quyết định khi các bên xung đột lợi ích, bằng cách lập bảng bên liên quan và tìm phương án không gây hại nặng cho ai. Hẹn gặp bạn ở bài tiếp theo."
