scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Phương án được nhiều điểm nhất lại làm một bên thiệt nặng"
    checks:
      - "sum([2, 2, 2, -2]) == 4 and sum([1, 1, 1, 0]) == 3"
    steps:
      - show: |
          <p>Một ứng dụng giao đồ ăn chọn thuật toán phân đơn mới — cách chia đơn hàng cho tài xế (số minh hoạ). Cuộc họp chấm điểm ba phương án theo bốn bên, từ −2 tới 2. Phương án X được <b>tổng 4 điểm</b>, cao nhất.</p>
          <p>Nhưng X chấm <b>−2</b> cho tài xế — thu nhập giảm mạnh — và trong phòng họp không có tài xế nào.</p>
          <div class="box key">Hôm nay: (1) liệt kê ai bị ảnh hưởng, kể cả người vắng mặt? (2) vì sao “tổng điểm cao nhất” có thể sai? (3) chọn thế nào khi các bên xung đột?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một ứng dụng giao đồ ăn chọn thuật toán phân đơn mới, tức cách chia đơn hàng cho tài xế, với số minh hoạ. Cuộc họp chấm điểm ba phương án theo bốn bên, từ âm 2 tới 2, và phương án X được tổng 4 điểm, cao nhất. Nhưng X chấm âm 2 cho tài xế, nghĩa là thu nhập giảm mạnh, và trong phòng họp không có tài xế nào. Hôm nay ta trả lời ba câu hỏi, ai bị ảnh hưởng kể cả người vắng mặt, vì sao tổng điểm cao nhất có thể sai, và chọn thế nào khi các bên xung đột."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: cộng số âm, tìm số nhỏ nhất, và ý của bài 5"
    checks:
      - "2 + 2 + 2 + (-2) == 4 and min([2, 2, 2, -2]) == -2"
      - "0.001 * 1000000 == 1000"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>ví dụ</th><th>kết quả</th></tr>
          <tr><td>① cộng có số âm: cộng số âm là trừ đi</td><td>$2 + 2 + 2 + (-2)$</td><td>4</td></tr>
          <tr><td>② số nhỏ nhất của một danh sách</td><td>nhỏ nhất của 2, 2, 2, −2</td><td>−2</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bảng ôn hai phép tính. Thứ nhất, cộng một số âm là trừ đi, nên 2 cộng 2 cộng 2 cộng âm 2 bằng 4. Thứ hai, số nhỏ nhất của danh sách 2, 2, 2, âm 2 là âm 2, đó là bên chịu thiệt nhiều nhất."
      - show: |
          <p>③ Ở bài 5, ta xếp hạng rủi ro bằng <b>kỳ vọng thiệt hại</b> = xác suất × thiệt hại, ví dụ $0{,}001 \times 1\,000\,000 = 1000$; và hậu quả <b>không đảo ngược được</b> cần ngưỡng riêng, không chỉ kỳ vọng.</p>
          $$\text{kỳ vọng} = 0{,}001 \times 1\,000\,000 = 1000$$
        focus: [1, 1, 2]
        say: "Thứ ba, ở bài 5, ta xếp hạng rủi ro bằng kỳ vọng thiệt hại, bằng xác suất nhân thiệt hại, ví dụ 0 phẩy 001 nhân 1 triệu bằng 1000. Ta cũng thấy hậu quả không đảo ngược được cần một ngưỡng riêng. Hôm nay ta dùng đúng ý đó, một tác hại nặng không được bù bằng điểm cộng ở chỗ khác."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bên liên quan, điểm ảnh hưởng, khả năng lên tiếng"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td><b>bên liên quan</b></td><td>người chịu ảnh hưởng của quyết định</td><td>công ty, khách đặt món, nhà hàng, tài xế</td></tr>
          <tr><td><b>điểm ảnh hưởng</b></td><td>số nguyên từ −2 (hại nặng) tới 2 (lợi nhiều), 0 là không đổi</td><td>tài xế −2 với X</td></tr>
          <tr><td><b>khả năng lên tiếng</b></td><td>bên đó có mặt, có tiếng nói khi quyết định không</td><td>tài xế: thấp</td></tr>
          <tr><td><b>ràng buộc</b></td><td>điều phải thoả trước khi so điểm</td><td>không bên nào dưới 0</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Bên liên quan là người chịu ảnh hưởng của quyết định, ở đây là công ty, khách đặt món, nhà hàng và tài xế. Điểm ảnh hưởng là một số nguyên từ âm 2, hại nặng, tới 2, lợi nhiều, còn 0 là không đổi. Khả năng lên tiếng cho biết bên đó có mặt và có tiếng nói khi quyết định hay không. Ràng buộc là điều phải thoả trước khi so điểm, ví dụ không bên nào dưới 0."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: code
    kind: concept
    title: "Bộ quy tắc nghề nghiệp nói gì về xung đột lợi ích"
    steps:
      - show: |
          <table class="t"><tr><th>nguồn</th><th>ý chính (dịch sát)</th></tr>
          <tr><td>nguyên tắc 1.1</td><td>khi lợi ích của nhiều nhóm <b>xung đột</b>, nhu cầu của người <b>yếu thế hơn</b> cần được chú ý và ưu tiên nhiều hơn</td></tr>
          <tr><td>nguyên tắc 1.2</td><td>tránh gây hại bắt đầu bằng việc xét kỹ tác động lên <b>mọi người bị ảnh hưởng</b>; trong mọi trường hợp, giảm tác hại tới mức nhỏ nhất</td></tr>
          <tr><td>lời mở đầu</td><td>cả nghề được lợi khi quá trình ra quyết định <b>giải trình được và minh bạch</b> với mọi bên liên quan</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bộ quy tắc nghề nghiệp năm 2018 của Hiệp hội Máy tính có ba câu dùng được ngay. Nguyên tắc 1 chấm 1 nói khi lợi ích của nhiều nhóm xung đột, nhu cầu của người yếu thế hơn cần được chú ý và ưu tiên nhiều hơn. Nguyên tắc 1 chấm 2 nói tránh gây hại bắt đầu bằng việc xét kỹ tác động lên mọi người bị ảnh hưởng. Lời mở đầu nói cả nghề được lợi khi quá trình ra quyết định giải trình được và minh bạch với mọi bên."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bản đồ bên liên quan: ảnh hưởng và tiếng nói"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><defs><marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <rect x="560" y="250" width="420" height="170" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
          <line x1="140" y1="420" x2="1000" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#ar8)"/>
          <line x1="140" y1="420" x2="140" y2="40" stroke="#1f2937" stroke-width="3" marker-end="url(#ar8)"/>
          <g font-size="23" fill="#1f2937">
          <text x="1010" y="428">ảnh hưởng lớn</text>
          <text x="40" y="30">tiếng nói</text><text x="40" y="58">lớn</text>
          <circle cx="760" cy="110" r="14" fill="#2a78d6"/><text x="785" y="118">công ty</text>
          <circle cx="430" cy="160" r="14" fill="#2a78d6"/><text x="455" y="168">khách đặt món</text>
          <circle cx="430" cy="300" r="14" fill="#059669"/><text x="455" y="308">nhà hàng</text>
          <circle cx="880" cy="360" r="14" fill="#dc2626"/><text x="800" y="368" fill="#dc2626" font-weight="bold" text-anchor="end">tài xế</text>
          <circle cx="250" cy="390" r="12" fill="#6b7280"/><text x="275" y="382" fill="#6b7280">người ở khu phố</text>
          </g>
          <text x="1040" y="290" font-size="23" fill="#dc2626" font-weight="bold">góc dễ bị bỏ quên:</text>
          <text x="1040" y="324" font-size="23" fill="#dc2626">ảnh hưởng lớn, tiếng nói nhỏ</text>
          <text x="1040" y="358" font-size="23" fill="#dc2626">→ chủ động mời, hỏi ý kiến</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là bản đồ bên liên quan, trục ngang là mức ảnh hưởng, trục đứng là tiếng nói khi quyết định. Công ty và khách đặt món ở phía trên, vì họ có tiếng nói lớn. Tài xế nằm ở góc phải dưới, ảnh hưởng lớn mà tiếng nói nhỏ, đó là góc dễ bị bỏ quên. Người ở khu phố quanh nhà hàng không dùng ứng dụng, nhưng vẫn bị ảnh hưởng bởi xe đỗ và tiếng ồn."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra luật chọn từng bước"
    checks:
      - "min([1, 0]) >= 0 and not min([2, -1]) >= 0 and sum([1, 0]) == 1"
    steps:
      - show: |
          <p><b>Bước 1 — ràng buộc trước.</b> Vì tác hại nặng không được bù bằng lợi ở bên khác (như ngưỡng riêng cho hậu quả không đảo ngược ở bài 5), chỉ giữ phương án có điểm nhỏ nhất không dưới 0:</p>
          $$\text{giữ phương án nếu } \text{nhỏ nhất}(\text{các điểm}) \geq 0$$
          <p class="note">Làm thử: phương án [2, −1] bị loại vì nhỏ nhất là −1; phương án [1, 0] được giữ.</p>
        focus: [1, 2, 3]
        say: "Bước một, đặt ràng buộc trước, vì tác hại nặng không được bù bằng lợi ở bên khác, giống ngưỡng riêng cho hậu quả không đảo ngược ở bài 5. Ta chỉ giữ phương án có điểm nhỏ nhất lớn hơn hoặc bằng 0, tức không bên nào bị thiệt. Làm thử, phương án 2 và âm 1 bị loại vì nhỏ nhất là âm 1, còn phương án 1 và 0 được giữ."
      - show: |
          <p><b>Bước 2 — tổng sau.</b> Trong các phương án còn lại, chọn phương án có tổng điểm lớn nhất, vì nó lợi cho nhiều bên nhất mà không ai bị thiệt.</p>
          <p><b>Bước 3 — hoà thì ưu tiên bên yếu thế.</b> Theo nguyên tắc 1.1, so điểm của bên yếu thế nhất (ở đây là tài xế); ai cao hơn thì chọn.</p>
          $$\text{chọn theo thứ tự: } \text{ràng buộc} \;\to\; \text{tổng} \;\to\; \text{bên yếu thế}$$
        focus: [1, 2, 3]
        say: "Bước hai, trong các phương án còn lại, chọn phương án có tổng điểm lớn nhất, vì nó lợi cho nhiều bên nhất mà không ai bị thiệt. Bước ba, nếu hoà thì theo nguyên tắc 1 chấm 1, so điểm của bên yếu thế nhất, ở đây là tài xế, phương án nào cao hơn thì chọn. Vậy thứ tự là ràng buộc trước, tổng sau, rồi tới bên yếu thế."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ba phương án, bốn bên: từng bước"
    checks:
      - "[sum(v) for v in ([2, 2, 2, -2], [1, 1, 1, 0], [0, 1, 1, 1])] == [4, 3, 3]"
      - "[min(v) for v in ([2, 2, 2, -2], [1, 1, 1, 0], [0, 1, 1, 1])] == [-2, 0, 0]"
      - "[k for k, v in {'X': [2, 2, 2, -2], 'Y': [1, 1, 1, 0], 'Z': [0, 1, 1, 1]}.items() if min(v) >= 0] == ['Y', 'Z']"
      - "max(['Y', 'Z'], key=lambda k: (sum({'Y': [1, 1, 1, 0], 'Z': [0, 1, 1, 1]}[k]), {'Y': [1, 1, 1, 0], 'Z': [0, 1, 1, 1]}[k][3])) == 'Z'"
    steps:
      - show: |
          <table class="t"><tr><th>phương án</th><th>công ty</th><th>khách</th><th>nhà hàng</th><th>tài xế</th><th>tổng</th><th>nhỏ nhất</th></tr>
          <tr><td>X: ghép đơn dày, trả theo quãng ngắn</td><td>2</td><td>2</td><td>2</td><td class="red">−2</td><td>$\hlb{4}$</td><td class="red">−2</td></tr>
          <tr><td>Y: ghép đơn vừa phải</td><td>1</td><td>1</td><td>1</td><td>0</td><td>$\hlb{3}$</td><td>0</td></tr>
          <tr><td>Z: ghép đơn vừa, thưởng giờ cao điểm</td><td>0</td><td>1</td><td>1</td><td>1</td><td>$\hlb{3}$</td><td>0</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bảng là điểm minh hoạ cuộc họp chấm cho ba phương án. Bước một, cộng hàng X, 2 cộng 2 cộng 2 cộng âm 2 bằng 4, và nhỏ nhất là âm 2 ở cột tài xế. Hàng Y có tổng 3, nhỏ nhất là 0. Hàng Z cũng tổng 3, nhỏ nhất 0."
      - clear: true
        show: |
          <table class="t"><tr><th>phương án</th><th>tổng</th><th>nhỏ nhất</th><th>tài xế</th></tr>
          <tr><td>X</td><td>4</td><td class="red">−2</td><td>−2</td></tr>
          <tr><td>Y</td><td>3</td><td>0</td><td>0</td></tr>
          <tr><td>Z</td><td>3</td><td>0</td><td>$\hlg{1}$</td></tr></table>
          <p><b>Bước 2.</b> Ràng buộc: X bị loại vì nhỏ nhất là −2 &lt; 0. Còn Y và Z.</p>
          <p><b>Bước 3.</b> Tổng: Y và Z cùng 3 — hoà.</p>
          <p><b>Bước 4.</b> Bên yếu thế nhất là tài xế: Y cho 0, Z cho 1 → chọn <b>Z</b>.</p>
        focus: [0, 2, 3, 4]
        say: "Bảng gọn lại ba cột tổng, nhỏ nhất và tài xế. Bước hai, áp ràng buộc, X bị loại vì nhỏ nhất là âm 2, nhỏ hơn 0, nên còn Y và Z. Bước ba, so tổng thì Y và Z cùng 3, hoà nhau. Bước bốn, theo nguyên tắc 1 chấm 1, nhìn bên yếu thế nhất là tài xế, Y cho 0, Z cho 1, nên chọn Z."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác: xếp cả bộ ba con số"
    checks:
      - "sorted({'X': (-2, 4, -2), 'Y': (0, 3, 0), 'Z': (0, 3, 1)}.items(), key=lambda kv: kv[1], reverse=True)[0][0] == 'Z'"
      - "max({'X': 4, 'Y': 3, 'Z': 3}.items(), key=lambda kv: kv[1])[0] == 'X'"
    steps:
      - show: |
          <p>Đường khác: ghi mỗi phương án thành bộ ba (nhỏ nhất, tổng, điểm tài xế), rồi xếp như xếp từ điển — so số đầu trước, bằng nhau mới so số sau:</p>
          <table class="t"><tr><th>phương án</th><th>bộ ba</th><th>thứ hạng</th></tr>
          <tr><td>Z</td><td>(0, 3, 1)</td><td>$\hlg{1}$</td></tr>
          <tr><td>Y</td><td>(0, 3, 0)</td><td>2</td></tr>
          <tr><td>X</td><td>(−2, 4, −2)</td><td>3</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ta kiểm theo đường khác, ghi mỗi phương án thành bộ ba gồm điểm nhỏ nhất, tổng, và điểm tài xế, rồi xếp như xếp từ trong từ điển, so số đầu trước. Z với bộ 0, 3, 1 đứng đầu. Y với bộ 0, 3, 0 đứng thứ hai. X với bộ âm 2, 4, âm 2 đứng cuối, vì số đầu âm 2 nhỏ nhất, khớp kết quả từng bước."
      - show: |
          <p>Đối chứng: nếu <b>chỉ</b> so tổng thì chọn X (4 &gt; 3) — đúng cái bẫy ở phần mở đầu. Hai cách cho kết quả khác nhau chính vì một bên bị chấm −2.</p>
          $$\text{lớn nhất}(4, 3, 3) = 4 \;\Rightarrow\; X \quad\text{nhưng}\quad \text{nhỏ nhất của } X = -2 < 0$$
        introduces: [implies]
        focus: [1, 1, 2]
        say: "Đối chứng, nếu chỉ so tổng thì chọn X, vì 4 lớn hơn 3, đúng cái bẫy ở phần mở đầu. Mũi tên kép đọc là suy ra, tổng lớn nhất suy ra X, nhưng điểm nhỏ nhất của X là âm 2. Hai cách cho kết quả khác nhau chính vì một bên bị chấm âm 2."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "sum([2, 2, 2, -2, -1]) == 3 and min([2, 2, 2, -2, -1]) == -2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ liệt kê bên có mặt trong phòng họp <b class="red">(bỏ sót người vắng mặt)</b></div>
          <table class="t"><tr><th>thêm cột “người ở khu phố”</th><th>X</th><th>Y</th><th>Z</th></tr>
          <tr><td>điểm (minh hoạ): xe đỗ, tiếng ồn</td><td>−1</td><td>0</td><td>0</td></tr>
          <tr><td>tổng mới của X</td><td>$4 + (-1) = 3$</td><td>3</td><td>3</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi thứ nhất là chỉ liệt kê bên có mặt trong phòng họp. Nếu thêm cột người ở khu phố, chịu xe đỗ và tiếng ồn, X bị thêm âm 1. Tổng mới của X còn 3, bằng Y và Z, và nó còn thêm một bên bị thiệt."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Để tổng điểm che tác hại <b class="red">(4 điểm che −2)</b>
          <br><span class="note">Một bên mất thu nhập nặng không được bù bằng việc ba bên khác vui hơn chút ít. Phép thử bắt được: luôn ghi cột “nhỏ nhất” cạnh cột “tổng”.</span></div>
          $$2 + 2 + 2 + (-2) = 4 \quad\text{nhưng}\quad \text{nhỏ nhất} = -2$$
        focus: [1, 1, 2]
        say: "Lỗi thứ hai là để tổng điểm che tác hại. Một bên mất thu nhập nặng không được bù bằng việc ba bên khác vui hơn chút ít. Phép thử bắt được lỗi này là luôn ghi cột nhỏ nhất ngay cạnh cột tổng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Đội tự chấm điểm thay cho bên bị ảnh hưởng, rồi coi con số là “khách quan” <b class="red">(điểm là ý kiến, không phải phép đo)</b>
          <br><span class="note">Hỏi chính tài xế, nhà hàng — hoặc dùng dữ liệu thật như thu nhập trước và sau khi thử. Ghi ai chấm, dựa trên gì.</span></div>
          <table class="t"><tr><th>điểm tài xế cho X</th><th>ai chấm</th><th>dựa trên</th></tr>
          <tr><td>0</td><td>đội sản phẩm</td><td>cảm nhận</td></tr>
          <tr><td>−2</td><td>đại diện tài xế</td><td>thu nhập giờ thử nghiệm giảm</td></tr></table>
        focus: [1, 1, "2.3"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là đội tự chấm điểm thay cho bên bị ảnh hưởng, rồi coi con số là khách quan. Điểm là ý kiến chứ không phải phép đo, nên hãy hỏi chính tài xế, hoặc dùng dữ liệu thật như thu nhập trước và sau khi thử. Đội có thể chấm 0 theo cảm nhận, trong khi đại diện tài xế chấm âm 2 vì thu nhập trong giờ thử nghiệm giảm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng luật chọn như một cái máy <b class="red">(bộ quy tắc nói nó không phải thuật toán)</b>
          <br><span class="note">Luật giúp nhìn rõ đánh đổi; kết quả vẫn cần lý do bằng lời, ghi lại để bên liên quan đọc và phản hồi; nếu phương án nào cũng có bên dưới 0 thì chọn phương án có điểm nhỏ nhất cao nhất.</span></div>
          <table class="t"><tr><th>ghi lại quyết định</th><th>ví dụ</th></tr>
          <tr><td>lựa chọn</td><td>Z</td></tr>
          <tr><td>lý do</td><td>X làm tài xế thiệt nặng; Y, Z hoà tổng, Z có lợi hơn cho tài xế</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư là dùng luật chọn như một cái máy, trong khi bộ quy tắc tự nói nó không phải thuật toán. Luật giúp nhìn rõ đánh đổi, nhưng vẫn cần lý do bằng lời, và nếu phương án nào cũng có bên thiệt thì chọn phương án có điểm nhỏ nhất cao nhất. Hãy ghi lại để các bên đọc và phản hồi, ví dụ chọn Z vì X làm tài xế thiệt nặng, còn Y và Z hoà tổng nhưng Z có lợi hơn cho tài xế."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chấm bài tự động trong một trường học"
    checks:
      - "[sum(v) for v in ([2, 1, 2, -1], [1, 1, 0, 1], [0, 0, 1, 2], [2, 2, 1, 0])] == [4, 3, 3, 5]"
      - "max([k for k, v in {'A': [2, 1, 2, -1], 'B': [1, 1, 0, 1], 'C': [0, 0, 1, 2], 'D': [2, 2, 1, 0]}.items() if min(v) >= 0], key=lambda k: sum({'A': [2, 1, 2, -1], 'B': [1, 1, 0, 1], 'C': [0, 0, 1, 2], 'D': [2, 2, 1, 0]}[k])) == 'D'"
      - "max(['B', 'C'], key=lambda k: (sum({'B': [1, 1, 0, 1], 'C': [0, 0, 1, 2]}[k]), {'B': [1, 1, 0, 1], 'C': [0, 0, 1, 2]}[k][3])) == 'C'"
    steps:
      - show: |
          <p>Trường học chọn cách dùng hệ thống chấm bài tự động (số minh hoạ). Bốn bên: nhà trường, giáo viên, học sinh, học sinh khuyết tật (ít tiếng nói nhất).</p>
          <table class="t"><tr><th>phương án</th><th>trường</th><th>giáo viên</th><th>học sinh</th><th>HS khuyết tật</th></tr>
          <tr><td>A</td><td>2</td><td>1</td><td>2</td><td>−1</td></tr>
          <tr><td>B</td><td>1</td><td>1</td><td>0</td><td>1</td></tr>
          <tr><td>C</td><td>0</td><td>0</td><td>1</td><td>2</td></tr>
          <tr><td>D</td><td>2</td><td>2</td><td>1</td><td>0</td></tr></table>
          <p class="note">Câu 1: chọn theo luật. Câu 2: D quá đắt, bị bỏ — chọn gì trong số còn lại?</p>
        focus: [0, 1, 2, 3, 3, 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Một trường học chọn cách dùng hệ thống chấm bài tự động. Có bốn bên là nhà trường, giáo viên, học sinh, và học sinh khuyết tật, bên ít tiếng nói nhất, với bốn phương án A, B, C, D. Câu một, chọn theo luật của bài. Câu hai, nếu D quá đắt và bị bỏ, bạn chọn gì trong số còn lại? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>phương án</th><th>tổng</th><th>nhỏ nhất</th><th>sau ràng buộc</th></tr>
          <tr><td>A</td><td>$2 + 1 + 2 + (-1) = 4$</td><td class="red">−1</td><td>loại</td></tr>
          <tr><td>B</td><td>3</td><td>0</td><td>giữ</td></tr>
          <tr><td>C</td><td>3</td><td>0</td><td>giữ</td></tr>
          <tr><td>D</td><td>$2 + 2 + 1 + 0 = \hlg{5}$</td><td>0</td><td>giữ — tổng lớn nhất</td></tr></table>
        focus: [0, "1.2", "1.5", 0]
        say: "Đáp án câu một, tính tổng và điểm nhỏ nhất từng hàng. A có tổng 4 nhưng nhỏ nhất là âm 1 nên bị loại. D có tổng 5, nhỏ nhất là 0, lớn nhất trong các phương án còn lại. Vậy chọn D, và ở đây luật không loại phương án điểm cao nhất, vì D không làm ai thiệt."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2</th><th>tổng</th><th>HS khuyết tật</th><th>kết luận</th></tr>
          <tr><td>B</td><td>3</td><td>1</td><td></td></tr>
          <tr><td>C</td><td>3</td><td>$\hlg{2}$</td><td>chọn C</td></tr></table>
          <p class="note">B và C hoà tổng 3; theo nguyên tắc 1.1, ưu tiên bên yếu thế hơn → C. Điều kiện đổi lựa chọn: nếu chính học sinh khuyết tật (hay người đại diện) cho điểm khác khi được hỏi, chấm lại.</p>
        focus: [0, "1.3", 2, 2]
        say: "Đáp án câu hai, bỏ D thì A vẫn bị loại, còn B và C hoà tổng 3. Nhìn bên yếu thế hơn, B cho học sinh khuyết tật 1 điểm, C cho 2 điểm. Theo nguyên tắc 1 chấm 1, ta chọn C. Nếu chính học sinh khuyết tật hay người đại diện cho điểm khác khi được hỏi, hãy chấm lại."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">liệt kê mọi bên, kể cả người vắng mặt</span><span class="a">→</span>
          <span class="n">chấm điểm cùng bên bị ảnh hưởng</span><span class="a">→</span>
          <span class="n">ràng buộc: không bên nào dưới 0</span><span class="a">→</span>
          <span class="n">tổng lớn nhất; hoà thì ưu tiên bên yếu thế</span><span class="a">→</span>
          <span class="n">ghi lý do</span></div>
        say: "Tổng kết lại, liệt kê mọi bên, kể cả người vắng mặt, rồi chấm điểm cùng chính các bên bị ảnh hưởng. Áp ràng buộc không bên nào dưới 0, chọn tổng lớn nhất, hoà thì ưu tiên bên yếu thế, và ghi lại lý do."
      - show: |
          <div class="box key"><b>Tư duy:</b> tìm phương án <b>chấp nhận được với mọi bên</b> trước, rồi mới tối ưu. Câu hỏi đầu tiên không phải “phương án nào nhiều điểm nhất?” mà là “ai đang không có mặt ở đây?”.</div>
        say: "Điều cần mang theo, hãy tìm phương án chấp nhận được với mọi bên trước, rồi mới tối ưu. Câu hỏi đầu tiên không phải phương án nào nhiều điểm nhất, mà là ai đang không có mặt ở đây."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>ước lượng, cam kết và nói “chưa được”</b> — ước lượng ba điểm và hứa theo khoảng, không theo một con số.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học ước lượng, cam kết và cách nói chưa được, với ước lượng ba điểm và hứa theo khoảng thay vì một con số. Hẹn gặp bạn ở bài tiếp theo."
