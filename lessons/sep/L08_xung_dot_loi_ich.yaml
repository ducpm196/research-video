# Quy ước: mỗi bên liên quan được chấm ảnh hưởng của mỗi phương án từ −2 (hại nặng) tới 2 (lợi nhiều), số nguyên; điểm là SỐ MINH HOẠ
#   (ghi trên màn hình) — chấm điểm là việc của con người, không phải phép đo. Thứ tự cột: công ty, khách đặt món, nhà hàng, tài xế.
#   Luật chọn của bài: (1) loại phương án có bên nào bị chấm dưới 0; (2) trong số còn lại chọn tổng lớn nhất; (3) hoà thì ưu tiên bên
#   yếu thế nhất (theo câu của nguyên tắc 1.1). Số âm đọc “âm 2”. Giáo án cũ ghi X = [2, 2, 3, −2] — 3 nằm ngoài thang −2…2; bài dùng
#   X = [2, 2, 2, −2], tổng 4 (báo người soạn giáo án sửa example + VER SEP:L08).
objectives:
  - "Lập bảng bên liên quan × ảnh hưởng × khả năng lên tiếng, kể cả bên không có mặt trong cuộc họp"
  - "Áp luật ba bước: loại phương án gây hại cho một bên trước, so tổng điểm sau, hoà thì ưu tiên bên yếu thế"
  - "Giải thích vì sao tối đa tổng điểm có thể che một tác hại nặng"
