# Quy ước: “tổ hợp” = bộ giá trị của các thuộc tính giữ lại (ngày sinh, giới tính, …). Mô hình đơn giản hoá: mỗi người rơi đều
#   và độc lập vào một trong c tổ hợp (ghi trên màn hình là giả định). Khu vực 10 000 người, tuổi 0–79 (80 năm), 365 ngày/năm là SỐ
#   MINH HOẠ. Con số của Sweeney (87%, 216/248 triệu, 365 000 giá trị, 54 805 cử tri) và câu luật là CITED (audit/sep/sources_L01.md).
#   Không tư vấn pháp lý cụ thể: bài dạy nguyên lý và cách tra điều luật; luật đọc ngày 2026-11-02, có thể đã đổi.
#   Lời đọc nói “mã bưu chính 5 chữ số” (ZIP chỉ trên màn hình).
objectives:
  - "Đếm số tổ hợp của các thuộc tính giữ lại và ước lượng khả năng một người là duy nhất bằng (1 − 1/c) mũ (N − 1)"
  - "Giải thích vì sao xoá tên chưa phải là khử nhận dạng, và mã hoá vẫn là dữ liệu cá nhân"
  - "Áp nguyên tắc chỉ thu và chỉ chia sẻ dữ liệu cần cho mục đích đã nói, kèm thời hạn lưu"
  - "Quyết định giữ thuộc tính nào khi chia sẻ một bộ dữ liệu cho đối tác"
