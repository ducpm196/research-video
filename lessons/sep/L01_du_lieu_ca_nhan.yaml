scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đã xoá tên, vẫn nhận ra 84% số người"
    checks:
      - "365 * 80 * 2 == 58400"
      - "round((1 - 1 / 58400) ** 9999, 2) == 0.84"
      - "round(216 / 248 * 100) == 87"
    steps:
      - show: |
          <p>Một phòng khám gửi đối tác bảng dữ liệu “đã ẩn danh”: <b>xoá tên</b>, giữ <b>ngày sinh</b>, <b>giới tính</b>, <b>phường</b>. Phường có 10&nbsp;000 người (số minh hoạ).</p>
          <p>Theo phép tính của bài này, khoảng <b>84%</b> người trong phường có bộ ba ngày sinh – giới tính – phường không trùng với ai: biết ba điều đó là biết bệnh án của ai.</p>
          <div class="box key">Năm 2000, một nghiên cứu ở Mỹ ước tính <b>87%</b> dân số (216 trên 248 triệu người) có thể là duy nhất theo bộ {mã bưu chính 5 số, giới tính, ngày sinh}.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, hãy hình dung một phòng khám gửi cho đối tác một bảng dữ liệu đã ẩn danh, với số minh hoạ. Họ xoá tên nhưng giữ ngày sinh, giới tính và phường, mỗi phường khoảng 10 nghìn người. Theo phép tính của bài này, khoảng 84 phần trăm người trong phường có bộ ba đó không trùng với ai. Nghĩa là ai biết ba điều đó về một người thì tìm được bệnh án của người ấy. Năm 2000, một nghiên cứu ở Mỹ ước tính 87 phần trăm dân số có thể là duy nhất theo mã bưu chính 5 chữ số, giới tính và ngày sinh."
      - show: |
          <div class="box key">Hôm nay: (1) vì sao vài thuộc tính bình thường lại nhận ra được một người? (2) luật và bộ quy tắc nghề nghiệp đòi gì? (3) chia sẻ dữ liệu thế nào để vừa đủ dùng?</div>
        say: "Hôm nay ta trả lời ba câu hỏi. Vì sao vài thuộc tính bình thường lại nhận ra được một người? Luật Việt Nam và bộ quy tắc nghề nghiệp đòi hỏi gì? Và chia sẻ dữ liệu thế nào để vừa đủ dùng mà không lộ người?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại hai phép tính sẽ dùng"
    checks:
      - "2 * 3 == 6 and 2 * 3 * 4 == 24"
      - "round(0.99 ** 100, 3) == 0.366"
    steps:
      - show: |
          <p><b>① Đếm tổ hợp bằng phép nhân.</b> Mỗi thuộc tính có một số lựa chọn; số bộ giá trị khác nhau là <b>tích</b> các số lựa chọn.</p>
          <table class="t"><tr><th>thuộc tính</th><th>số lựa chọn</th><th>số tổ hợp</th></tr>
          <tr><td>giới tính × nhóm tuổi (trẻ, trung niên, già)</td><td>2 và 3</td><td>2 × 3 = 6</td></tr>
          <tr><td>thêm mùa sinh (4 mùa)</td><td>2, 3 và 4</td><td>2 × 3 × 4 = 24</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Điều thứ nhất là đếm tổ hợp bằng phép nhân. Mỗi thuộc tính có một số lựa chọn, và số bộ giá trị khác nhau là tích các số lựa chọn. Hai giới tính nhân ba nhóm tuổi cho 6 tổ hợp. Thêm mùa sinh với 4 lựa chọn thì có 2 nhân 3 nhân 4, bằng 24 tổ hợp."
      - show: |
          <p><b>② “Không ai trùng” là nhiều việc độc lập cùng không xảy ra</b> — như ở bài 0: nếu mỗi người thử có khả năng $p$ gặp lỗi, thì $n$ người không ai gặp có khả năng $(1 - p)^n$.</p>
          $$p = 0{,}01,\ n = 100: \quad 0{,}99^{100} \approx 0{,}366$$
        focus: [1, 1, 2]
        say: "Điều thứ hai, ở bài 0 ta đã tính rằng nếu mỗi người thử có khả năng p gặp lỗi, thì n người không ai gặp có khả năng 1 trừ p, mũ n. Đó là vì ta nhân n khả năng độc lập với nhau. Với lỗi 1 phần trăm và 100 người thử, khả năng đó là 0 phẩy 99 mũ 100, xấp xỉ 0 phẩy 366."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: dữ liệu cá nhân, khử nhận dạng, c và N"
    checks:
      - "365 * 80 == 29200"
    steps:
      - show: |
          <table class="t"><tr><th>từ / ký hiệu</th><th>nghĩa</th></tr>
          <tr><td><b>dữ liệu cá nhân</b></td><td>thông tin xác định hoặc <b>giúp xác định</b> một con người cụ thể</td></tr>
          <tr><td><b>khử nhận dạng</b></td><td>thay đổi hoặc xoá thông tin để dữ liệu mới không thể xác định, không thể giúp xác định một người</td></tr>
          <tr><td>$c$</td><td>số tổ hợp của các thuộc tính giữ lại, ví dụ 365 ngày × 80 năm = 29&nbsp;200 ngày sinh</td></tr>
          <tr><td>$N$</td><td>số người trong vùng, ví dụ 10&nbsp;000</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn từ và ký hiệu. Dữ liệu cá nhân là thông tin xác định, hoặc giúp xác định, một con người cụ thể. Khử nhận dạng là thay đổi hoặc xoá thông tin để dữ liệu mới không thể xác định, cũng không thể giúp xác định một người. Chữ c là số tổ hợp của các thuộc tính giữ lại, ví dụ 365 ngày nhân 80 năm là 29 nghìn 200 ngày sinh. Chữ N là số người trong vùng, ví dụ 10 nghìn."

  # ───────────────────────── 4. LUẬT VÀ BỘ QUY TẮC ─────────────────────────
  - id: law
    kind: concept
    title: "Luật 2025 và bộ quy tắc nghề nghiệp nói gì"
    steps:
      - show: |
          <p><b>Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15</b> — thông qua 26/6/2025, hiệu lực từ 1/1/2026 (đọc toàn văn ngày 2/11/2026):</p>
          <table class="t"><tr><th>điều</th><th>nội dung (trích)</th></tr>
          <tr><td>Điều 2, khoản 1</td><td>“Dữ liệu cá nhân sau khi khử nhận dạng không còn là dữ liệu cá nhân.”</td></tr>
          <tr><td>Điều 3, khoản 2</td><td>“Chỉ được thu thập, xử lý dữ liệu cá nhân đúng phạm vi, mục đích cụ thể, rõ ràng”</td></tr>
          <tr><td>Điều 9, khoản 4</td><td>đồng ý “đối với từng mục đích”; “Sự im lặng hoặc không phản hồi không được coi là sự đồng ý.”</td></tr>
          <tr><td>Điều 12, khoản 1</td><td>“dữ liệu cá nhân sau khi được mã hóa vẫn là dữ liệu cá nhân”</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4", "2.5"]
        say: "Luật Bảo vệ dữ liệu cá nhân số 91 năm 2025 được thông qua ngày 26 tháng 6 năm 2025 và có hiệu lực từ 1 tháng 1 năm 2026. Điều 2 ghi rằng dữ liệu cá nhân sau khi khử nhận dạng không còn là dữ liệu cá nhân. Điều 3 ghi rằng chỉ được thu thập, xử lý dữ liệu đúng phạm vi, mục đích cụ thể, rõ ràng. Điều 9 đòi đồng ý đối với từng mục đích. Cũng Điều 9 ghi rằng sự im lặng hoặc không phản hồi không được coi là sự đồng ý. Điều 12 ghi rằng dữ liệu sau khi mã hoá vẫn là dữ liệu cá nhân."
      - clear: true
        show: |
          <p><b>Bộ quy tắc nghề nghiệp của ACM (2018), nguyên tắc 1.6 — tôn trọng quyền riêng tư</b> (dịch sát):</p>
          <table class="t"><tr><th>yêu cầu</th><th>nghĩa với người làm phần mềm</th></tr>
          <tr><td>chỉ thu <b>lượng tối thiểu</b> thông tin cần thiết</td><td>mỗi trường dữ liệu phải trả lời được “để làm gì?”</td></tr>
          <tr><td>thời hạn lưu và huỷ phải <b>được định rõ, thực thi, thông báo</b></td><td>có lịch xoá thật, không chỉ ghi trong chính sách</td></tr>
          <tr><td>đề phòng <b>định danh lại</b> dữ liệu đã ẩn danh</td><td>đếm tổ hợp trước khi chia sẻ</td></tr>
          <tr><td>cẩn trọng khi <b>gộp</b> các bộ dữ liệu</td><td>hai bảng vô hại gộp lại có thể lộ người</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bộ quy tắc năm 2018 của Hiệp hội Máy tính, ở nguyên tắc 1 chấm 6 về quyền riêng tư, nói cùng tinh thần. Chỉ thu lượng tối thiểu thông tin cần thiết, nên mỗi trường dữ liệu phải trả lời được câu hỏi để làm gì. Thời hạn lưu và huỷ phải được định rõ, thực thi và thông báo cho người có dữ liệu. Phải đề phòng định danh lại dữ liệu đã ẩn danh, và cẩn trọng khi gộp các bộ dữ liệu với nhau."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Định danh lại: nối hai bảng vô hại"
    steps:
      - show: |
          <div><svg width="1600" height="400" viewBox="0 0 1600 400"><defs><marker id="sep1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
