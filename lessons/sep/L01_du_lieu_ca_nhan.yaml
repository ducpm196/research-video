          <text x="800" y="140" font-size="22" fill="#b91c1c" text-anchor="middle" font-weight="bold">khớp bộ ba</text>
          <text x="800" y="205" font-size="22" fill="#1f2937" text-anchor="middle">ngày sinh, giới, phường</text>
          <text x="800" y="345" font-size="24" fill="#b91c1c" text-anchor="middle" font-weight="bold">bộ ba không trùng ai → bệnh án gắn lại được với tên</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy định danh lại diễn ra thế nào, với dữ liệu minh hoạ. Bên trái là bảng đã xoá tên nhưng còn ngày sinh, giới tính, phường và bệnh. Bên phải là một danh sách công khai có tên, ví dụ danh sách thành viên một câu lạc bộ, có cùng ba thuộc tính. Nối hai bảng theo bộ ba đó, người nào có bộ ba không trùng ai thì bệnh án gắn lại được với tên."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra khả năng một người là duy nhất"
    checks:
      - "365 * 80 * 2 == 58400"
      - "round(1 / 58400, 7) == 0.0000171"
      - "round((1 - 1 / 24) ** 2, 3) == 0.918"
    steps:
      - show: |
          <p><b>Bước 1 — đếm tổ hợp.</b> Theo phép nhân ở phần ôn nền, ngày sinh trong 80 năm có $365 \times 80$ giá trị, nhân 2 giới tính:</p>
          $$c = 365 \times 80 \times 2 = 58\,400$$
        focus: [1, 2]
        say: "Bước một là đếm tổ hợp. Theo phép nhân ở phần ôn nền, ngày sinh trong 80 năm có 365 nhân 80 giá trị, rồi nhân 2 giới tính, nên c bằng 58 nghìn 400 tổ hợp trong mỗi phường."
      - show: |
          <p><b>Bước 2 — một người khác trùng với bạn.</b> Giả định mỗi người rơi đều vào một trong $c$ tổ hợp, nên khả năng một người khác <b>trùng</b> đúng tổ hợp của bạn là $\frac{1}{c}$, và <b>không trùng</b> là $1 - \frac{1}{c}$.</p>
          <p class="note">Với $c = 58\,400$: $\frac{1}{58\,400} \approx 0{,}0000171$ — rất nhỏ.</p>
        focus: [1, 1, 2]
        say: "Bước hai, giả định mỗi người rơi đều vào một trong c tổ hợp. Vì vậy khả năng một người khác trùng đúng tổ hợp của bạn là 1 chia c, còn khả năng không trùng là 1 trừ 1 chia c. Với 58 nghìn 400 tổ hợp, khả năng trùng chỉ khoảng 0 phẩy 0000171, rất nhỏ."
      - clear: true
        show: |
          <p><b>Bước 3 — không trùng với ai.</b> Trong phường còn $N - 1$ người khác. Vì họ độc lập (giả định), nhân $N - 1$ lần, giống cách tính ở bài 0:</p>
          $$\text{khả năng bạn là duy nhất} = \hlo{\left(1 - \frac{1}{c}\right)^{N - 1}}$$
          <p class="note">Làm thử với 24 tổ hợp, 3 người: $\left(1 - \frac{1}{24}\right)^2 = \left(\frac{23}{24}\right)^2 \approx 0{,}918$.</p>
        focus: [1, 2, 3]
        say: "Bước ba, trong phường còn N trừ 1 người khác, và vì họ độc lập theo giả định, ta nhân N trừ 1 lần, giống cách tính ở bài 0. Vậy khả năng bạn là duy nhất bằng 1 trừ 1 chia c, mũ N trừ 1. Làm thử với 24 tổ hợp và 3 người, ta được 23 phần 24 bình phương, xấp xỉ 0 phẩy 918."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Phường 10 000 người, bộ ba ngày sinh – giới – phường"
    checks:
      - "365 * 80 * 2 == 58400"
      - "round((1 - 1 / 58400) ** 9999, 3) == 0.843"
      - "round(10000 * (1 - 1 / 58400) ** 9999) == 8426"
      - "12 * 80 * 2 == 1920 and round((1 - 1 / 1920) ** 9999, 4) == 0.0055"
      - "80 * 2 == 160 and (1 - 1 / 160) ** 9999 < 1e-20"
    steps:
      - show: |
          <p><b>Bước 1.</b> Số tổ hợp: $c = 365 \times 80 \times 2 = \hlb{58\,400}$; số người khác: $N - 1 = 9999$.</p>
        say: "Bước một, số tổ hợp là 58 nghìn 400, và trong phường có 9999 người khác ngoài bạn."
      - show: |
          <p><b>Bước 1.</b> $c = 58\,400$, $N - 1 = 9999$.</p>
          <p><b>Bước 2.</b> Khả năng một người là duy nhất: $\left(1 - \frac{1}{58\,400}\right)^{9999} \approx \hlo{0{,}843}$.</p>
          <p><b>Bước 3.</b> Số người duy nhất, trung bình: $10\,000 \times 0{,}843 \approx 8426$ người.</p>
        focus: [2, 3]
        say: "Bước hai, khả năng một người là duy nhất bằng 1 trừ 1 chia 58 nghìn 400, mũ 9999, xấp xỉ 0 phẩy 843. Bước ba, nhân với 10 nghìn người, trung bình khoảng 8426 người có bộ ba không trùng ai, nên xoá tên gần như không che được ai."
      - clear: true
        show: |
          <p><b>Bước 4 — tối thiểu hoá:</b> giữ ít chi tiết hơn thì $c$ nhỏ đi, người trùng nhau nhiều lên.</p>
          <table class="t"><tr><th>giữ lại</th><th>số tổ hợp c</th><th>khả năng là duy nhất</th></tr>
          <tr><td>ngày sinh đầy đủ + giới</td><td>58&nbsp;400</td><td>0,843</td></tr>
          <tr><td>tháng và năm sinh + giới</td><td>12 × 80 × 2 = 1920</td><td>0,0055</td></tr>
          <tr><td>chỉ năm sinh + giới</td><td>80 × 2 = 160</td><td>gần như 0</td></tr></table>
          <p class="note">Nếu đối tác chỉ cần nhóm tuổi để nghiên cứu, ngày sinh đầy đủ là dữ liệu <b>thừa</b> — và chính nó làm lộ người.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước bốn là tối thiểu hoá, giữ ít chi tiết hơn thì c nhỏ đi và người trùng nhau nhiều lên. Với ngày sinh đầy đủ và giới tính, khả năng là duy nhất là 0 phẩy 843. Chỉ giữ tháng và năm sinh, c còn 1920, khả năng đó tụt xuống khoảng 0 phẩy 0055. Chỉ giữ năm sinh, c còn 160, và khả năng gần như bằng 0. Nếu đối tác chỉ cần nhóm tuổi, ngày sinh đầy đủ là dữ liệu thừa, và chính nó làm lộ người."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo hai đường khác"
    checks:
      - "round(__import__('math').exp(-9999 / 58400), 3) == 0.843"
      - "abs(float(((__import__('numpy').bincount(__import__('numpy').random.default_rng(1).integers(0, 58400, 10000), minlength=58400)) == 1).sum()) / 10000 - 0.843) < 0.02"
      - "2 * 5 * 365 * 100 == 365000 and 365000 > 54805"
    steps:
      - show: |
          <table class="t"><tr><th>đường kiểm</th><th>kết quả</th></tr>
          <tr><td>xấp xỉ quen thuộc: khi $\frac{1}{c}$ rất nhỏ, $\left(1 - \frac{1}{c}\right)^{N-1}$ gần bằng $e$ mũ âm $\frac{N-1}{c}$; $\frac{9999}{58\,400} \approx 0{,}171$</td><td>$\approx 0{,}843$ ✓</td></tr>
          <tr><td>mô phỏng: rải ngẫu nhiên 10&nbsp;000 người vào 58&nbsp;400 ô, đếm người đứng một mình</td><td>khoảng 0,84 ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3"]
        say: "Ta kiểm lại bằng hai đường khác. Đường thứ nhất là một xấp xỉ quen thuộc, vì khi 1 chia c rất nhỏ thì kết quả gần bằng số e mũ âm N trừ 1 chia c. Ở đây số mũ là âm 0 phẩy 171. Tính ra cũng xấp xỉ 0 phẩy 843, khớp. Đường thứ hai là máy rải ngẫu nhiên 10 nghìn người vào 58 nghìn 400 ô, rồi đếm người đứng một mình, cũng ra khoảng 0 phẩy 84."
      - show: |
          <div class="box key"><b>Kiểm bằng dữ kiện thật:</b> trong nghiên cứu năm 2000, danh sách cử tri một thành phố có 2 giới tính × 5 mã bưu chính × 365 ngày × 100 năm = 365&nbsp;000 tổ hợp, mà chỉ có 54&nbsp;805 cử tri — số ô nhiều hơn số người, nên phần lớn người đứng một mình.</div>
        say: "Kiểm thêm bằng dữ kiện thật. Trong nghiên cứu năm 2000, danh sách cử tri một thành phố có 2 giới tính, 5 mã bưu chính và ngày sinh trong 100 năm. Như vậy có 365 nghìn tổ hợp, mà chỉ có 54 nghìn 805 cử tri. Số ô nhiều hơn số người, nên phần lớn người đứng một mình, đúng như công thức dự đoán."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round((1 - 1 / 58400) ** 9999, 2) == 0.84"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Đã xoá tên và số điện thoại, vậy là ẩn danh” <b class="red">(84% vẫn duy nhất)</b>
          <br><span class="note">Luật định nghĩa khử nhận dạng là không thể <b>giúp xác định</b> một người. Phép thử bắt được: đếm tổ hợp $c$ so với số người $N$.</span></div>
          <table class="t"><tr><th>bộ thuộc tính</th><th>c so với N</th><th>kết luận</th></tr>
          <tr><td>ngày sinh, giới, phường</td><td>58&nbsp;400 &gt; 10&nbsp;000</td><td class="red">phần lớn duy nhất</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất là nghĩ đã xoá tên và số điện thoại thì dữ liệu là ẩn danh, trong khi 84 phần trăm người vẫn duy nhất. Luật định nghĩa khử nhận dạng là dữ liệu không thể giúp xác định một người. Phép thử bắt được lỗi này là đếm số tổ hợp, rồi so với số người trong vùng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “Đã mã hoá rồi, không còn là dữ liệu cá nhân” <b class="red">(Điều 12: vẫn là dữ liệu cá nhân)</b>
          <br><span class="note">Mã hoá bảo vệ khi bị lộ đường truyền hay ổ đĩa; ai có khoá thì vẫn đọc được từng người.</span></div>
        say: "Lỗi thứ hai là nghĩ đã mã hoá thì không còn là dữ liệu cá nhân. Điều 12 của luật ghi rõ dữ liệu sau khi mã hoá vẫn là dữ liệu cá nhân. Mã hoá chỉ bảo vệ khi lộ đường truyền hay ổ đĩa, còn ai có khoá vẫn đọc được từng người."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> “Cứ thu thêm, sau này biết đâu cần” <b class="red">(trái nguyên tắc mục đích)</b>
          <br><span class="note">Điều 3: chỉ thu đúng phạm vi, mục đích cụ thể. Mỗi trường thừa là thêm tổ hợp, thêm rủi ro lộ người, thêm việc phải bảo vệ và xoá đúng hạn.</span></div>
          <table class="t"><tr><th>thêm trường</th><th>c nhân thêm</th></tr>
          <tr><td>giới tính</td><td>× 2</td></tr>
          <tr><td>ngày sinh thay vì năm sinh</td><td>× 365</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là cứ thu thêm vì biết đâu sau này cần. Điều 3 của luật chỉ cho thu đúng phạm vi, mục đích cụ thể. Mỗi trường thừa nhân số tổ hợp lên, ví dụ ngày sinh thay cho năm sinh nhân thêm 365 lần, nên thêm rủi ro lộ người và thêm việc phải bảo vệ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Gộp hai bộ dữ liệu, mỗi bộ đều “an toàn” <b class="red">(gộp lại thì lộ)</b>
          <br><span class="note">Nguyên tắc 1.6: gộp dữ liệu có thể phá các biện pháp riêng tư của từng bộ. Đếm lại tổ hợp của <b>bảng sau khi gộp</b>.</span></div>
          <table class="t"><tr><th>bộ</th><th>thuộc tính</th><th>c</th></tr>
          <tr><td>A</td><td>năm sinh + giới</td><td>160</td></tr>
          <tr><td>A gộp B (thêm ngày và tháng sinh)</td><td>ngày sinh đầy đủ + giới</td><td>58&nbsp;400</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư là gộp hai bộ dữ liệu mà mỗi bộ đều có vẻ an toàn. Nguyên tắc 1 chấm 6 cảnh báo rằng gộp dữ liệu có thể phá các biện pháp riêng tư của từng bộ. Bộ A chỉ có 160 tổ hợp, nhưng gộp với bộ B có ngày tháng sinh thì lên 58 nghìn 400, nên phải đếm lại trên bảng sau khi gộp."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: gửi gì cho đối tác nghiên cứu?"
    checks:
      - "365 * 60 * 2 == 43800 and round((1 - 1 / 43800) ** 4999, 3) == 0.892"
      - "6 * 2 == 12 and (1 - 1 / 12) ** 4999 < 1e-100"
    steps:
      - show: |
          <p>Ứng dụng đặt lịch khám muốn gửi đối tác dữ liệu để nghiên cứu <b>tỉ lệ bệnh theo nhóm tuổi</b>. Mỗi quận có 5000 người dùng, tuổi 0–59 (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Giữ ngày sinh đầy đủ + giới + quận: c bằng bao nhiêu, khả năng một người là duy nhất?</td></tr>
          <tr><td>2</td><td>Đổi thành 6 nhóm tuổi (mỗi nhóm 10 năm) + giới: c và khả năng là duy nhất?</td></tr>
          <tr><td>3</td><td>Bạn đề xuất gửi gì, kèm những điều kiện nào?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Ứng dụng đặt lịch khám muốn gửi cho đối tác dữ liệu để nghiên cứu tỉ lệ bệnh theo nhóm tuổi, mỗi quận có 5000 người dùng, tuổi từ 0 tới 59. Câu một, giữ ngày sinh đầy đủ, giới tính và quận thì c bằng bao nhiêu, và khả năng một người là duy nhất là bao nhiêu? Câu hai, đổi thành 6 nhóm tuổi mỗi nhóm 10 năm, cộng giới tính, thì sao? Câu ba, bạn đề xuất gửi gì, kèm điều kiện nào? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$c = 365 \times 60 \times 2 = 43\,800$; $\left(1 - \frac{1}{43\,800}\right)^{4999}$</td><td>$\approx \hlo{0{,}892}$ — gần 9 trên 10 người duy nhất</td></tr>
          <tr><td>2</td><td>$c = 6 \times 2 = 12$; $\left(1 - \frac{1}{12}\right)^{4999}$</td><td>gần như 0 — mỗi ô có khoảng 400 người</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Đáp án câu một, c bằng 365 nhân 60 nhân 2, bằng 43 nghìn 800. Vậy khả năng là duy nhất bằng 1 trừ 1 chia 43 nghìn 800, mũ 4999, xấp xỉ 0 phẩy 892, gần 9 trên 10 người. Câu hai, c chỉ còn 12, mỗi ô trung bình khoảng 400 người, nên khả năng một người là duy nhất gần như bằng 0."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3: đề xuất</th><th>vì sao</th></tr>
          <tr><td>gửi nhóm tuổi + giới + quận + bệnh; <b>không</b> gửi ngày sinh</td><td>đủ cho mục đích đã nói; c nhỏ, khó lộ người</td></tr>
          <tr><td>ghi rõ mục đích, cấm gộp với dữ liệu khác, hẹn ngày xoá</td><td>nguyên tắc 1.6 và Điều 3 của luật</td></tr>
          <tr><td>kiểm lại các ô quá nhỏ (vd bệnh hiếm chỉ 1 người)</td><td>một ô 1 người vẫn lộ người đó</td></tr></table>
          <p class="note">Ca biên (dữ liệu sức khoẻ, chuyển ra nước ngoài): tra toàn văn luật và nghị định hiện hành, hỏi người phụ trách pháp lý.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu ba là một đề xuất có lý do. Hãy gửi nhóm tuổi, giới tính, quận và bệnh, không gửi ngày sinh, vì như vậy đủ cho mục đích mà c nhỏ. Hãy ghi rõ mục đích, cấm gộp với dữ liệu khác và hẹn ngày xoá. Kiểm thêm các ô quá nhỏ, ví dụ một bệnh hiếm chỉ có 1 người, vì ô đó vẫn lộ người. Với ca biên như dữ liệu sức khoẻ, hãy tra toàn văn luật hiện hành và hỏi người phụ trách pháp lý."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">giữ vài thuộc tính → $c$ tổ hợp</span><span class="a">→</span>
          <span class="n">duy nhất với khả năng $\left(1 - \frac{1}{c}\right)^{N-1}$</span><span class="a">→</span>
          <span class="n">$c$ lớn hơn $N$ thì phần lớn người lộ</span><span class="a">→</span>
          <span class="n">chỉ giữ điều cần cho mục đích, hẹn ngày xoá</span></div>
        say: "Tổng kết lại, giữ vài thuộc tính cho ta c tổ hợp, và một người là duy nhất với khả năng 1 trừ 1 chia c, mũ N trừ 1. Khi c lớn hơn số người, phần lớn người bị lộ dù đã xoá tên. Vì vậy chỉ giữ điều cần cho mục đích đã nói, và hẹn ngày xoá."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi chia sẻ một bảng, hỏi “mỗi cột để làm gì?” và đếm tổ hợp. Xoá tên không phải khử nhận dạng; dữ liệu không thu thì không bao giờ lộ.</div>
        say: "Điều cần mang theo, trước khi chia sẻ một bảng, hãy hỏi mỗi cột để làm gì, rồi đếm tổ hợp. Xoá tên không phải là khử nhận dạng, và dữ liệu không thu thì không bao giờ bị lộ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>công bằng có định lượng</b> — đo một bộ phân loại có đối xử như nhau với hai nhóm người không, và vì sao không thể đạt mọi tiêu chí cùng lúc.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học công bằng có định lượng, tức đo xem một bộ phân loại có đối xử như nhau với hai nhóm người không. Ta cũng sẽ thấy vì sao không thể đạt mọi tiêu chí cùng lúc. Hẹn gặp bạn ở bài tiếp theo."
