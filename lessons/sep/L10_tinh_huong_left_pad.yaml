scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chiều 22/3/2016: hàng trăm lỗi mỗi phút"
    checks:
      - "1 + 272 == 273"
      - "__import__('datetime').date(2016, 3, 22).weekday() == 1"
    steps:
      - show: |
          <p>Chiều thứ Ba <b>22/3/2016</b>, ngay sau <b>14:30</b> (giờ Thái Bình Dương), kho gói <b>npm</b> ghi nhận <b>hàng trăm lỗi mỗi phút</b>: rất nhiều dự án không cài được gói mình cần.</p>
          <p>Nguyên nhân: một tác giả gỡ khỏi kho gói <code>kik</code> và <b>272</b> gói khác, không báo trước cho người dùng. Một trong số đó là gói nhỏ <code>left-pad</code>.</p>
          <div class="box key">Hôm nay: (1) vì sao gỡ một gói nhỏ làm hỏng hàng nghìn dự án? (2) mỗi bên chịu trách nhiệm gì? (3) đội của bạn nên làm gì?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, chiều thứ Ba ngày 22 tháng 3 năm 2016, ngay sau 14 giờ 30 theo giờ Thái Bình Dương, một kho gói mã nguồn mở rất lớn ghi nhận hàng trăm lỗi mỗi phút. Rất nhiều dự án không cài được gói mình cần. Nguyên nhân là một tác giả gỡ khỏi kho một gói mang tên một ứng dụng nhắn tin, cùng 272 gói khác, mà không báo trước cho người dùng. Một trong số đó là một gói nhỏ dùng để đệm thêm ký tự vào bên trái một chuỗi. Hôm nay ta trả lời ba câu hỏi, vì sao gỡ một gói nhỏ làm hỏng hàng nghìn dự án, mỗi bên chịu trách nhiệm gì, và đội của bạn nên làm gì."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều sẽ dùng"
    checks:
      - "3 ** 2 == 9 and 3 ** 3 == 27 and 3 + 9 + 27 == 39"
      - "(16 - 14) * 60 + (55 - 30) == 145"
    steps:
      - show: |
          <table class="t"><tr><th>điều</th><th>nội dung</th><th>ví dụ số</th></tr>
          <tr><td>① giấy phép (bài 4)</td><td>mã nguồn mở theo giấy phép dễ dãi cho phép <b>người khác đăng lại</b>, miễn giữ thông báo bản quyền</td><td>một bản sao giống hệt có thể được đăng lại</td></tr>
          <tr><td>② bên liên quan (bài 8)</td><td>lập bảng các bên, ảnh hưởng và khả năng lên tiếng; thêm cả người <b>không có mặt</b></td><td>hàng nghìn dự án gián tiếp không ai hỏi ý</td></tr>
          <tr><td>③ lũy thừa và cộng dồn</td><td>mỗi tầng nhân thêm một thừa số</td><td>$3^2 = 9$, $3^3 = 27$, $3 + 9 + 27 = 39$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta ôn lại bốn điều, ba điều đầu nằm trong bảng này. Ở bài 4, giấy phép mã nguồn mở dễ dãi cho phép người khác đăng lại mã, miễn giữ thông báo bản quyền, nên một bản sao giống hệt có thể được đăng lại. Ở bài 8, ta lập bảng các bên liên quan, ảnh hưởng và khả năng lên tiếng, và phải thêm cả người không có mặt. Điều thứ ba là lũy thừa, mỗi tầng nhân thêm một thừa số, 3 mũ 2 bằng 9, 3 mũ 3 bằng 27, cộng 3, 9 và 27 được 39."
      - clear: true
        show: |
          <p><b>④ Phiên bản ba số</b> <code>a.b.c</code>: số đầu tăng khi có thay đổi phá vỡ cách dùng cũ. Một dự án có thể <b>yêu cầu đúng</b> một phiên bản:</p>
          <table class="t"><tr><th>yêu cầu</th><th>phiên bản có trong kho</th><th>khớp?</th></tr>
          <tr><td>đúng <code>0.0.3</code></td><td><code>0.0.3</code></td><td>có</td></tr>
          <tr><td>đúng <code>0.0.3</code></td><td><code>1.0.0</code></td><td class="red">không</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ tư là phiên bản ba số, số đầu tăng khi có thay đổi phá vỡ cách dùng cũ, và một dự án có thể yêu cầu đúng một phiên bản. Nếu yêu cầu đúng 0 chấm 0 chấm 3 thì chỉ phiên bản 0 chấm 0 chấm 3 khớp. Phiên bản 1 chấm 0 chấm 0, dù mã giống hệt, vẫn không khớp."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của người điều tra"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>dòng thời gian</b></td><td>chuỗi sự kiện có giờ, lấy từ nguồn ghi lại, tách khỏi suy đoán</td></tr>
          <tr><td><b>phụ thuộc bắc cầu</b></td><td>gói mà dự án dùng gián tiếp: gói của gói của gói…</td></tr>
          <tr><td><b>gỡ đăng</b></td><td>xoá một phiên bản (hay cả gói) khỏi kho, nên không ai tải được nữa</td></tr>
          <tr><td><b>gói giữ chỗ</b></td><td>gói rỗng đặt vào tên cũ, để kẻ xấu không chiếm tên đó</td></tr>
          <tr><td><b>tệp khoá phiên bản</b></td><td>tệp ghi đúng cây phụ thuộc đã cài, để lần cài sau ra cây y hệt</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Dòng thời gian là chuỗi sự kiện có giờ, lấy từ nguồn ghi lại và tách khỏi suy đoán. Phụ thuộc bắc cầu là gói mà dự án dùng gián tiếp, tức gói của gói của gói. Gỡ đăng là xoá một phiên bản, hay cả gói, khỏi kho, nên không ai tải được nữa. Gói giữ chỗ là một gói rỗng đặt vào tên cũ, để kẻ xấu không chiếm tên đó. Tệp khoá phiên bản ghi đúng cây phụ thuộc đã cài, để lần cài sau ra cây y hệt."

