          <text x="1220" y="280" font-size="22" fill="#1f2937" text-anchor="middle">bản 1.0.0 đăng lại không khớp “đúng 0.0.3”</text>
          <text x="495" y="90" font-size="22" fill="#6b7280" text-anchor="middle">bạn chọn tầng này</text>
          <text x="1030" y="90" font-size="22" fill="#6b7280" text-anchor="middle">các tầng này do người khác chọn</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là một chuỗi phụ thuộc như nguồn mô tả. Dự án của bạn chỉ chọn một bộ công cụ lớn, bộ đó dùng một gói đánh số dòng, và gói đánh số dòng yêu cầu đúng phiên bản 0 chấm 0 chấm 3 của gói đệm trái. Bạn chỉ chọn tầng đầu, các tầng sau do người khác chọn. Khi gói cuối bị gỡ, mọi tầng phía trước đều hỏng khi cài, dù không ai trong đó thay đổi gì."

  # ───────────────────────── 5. DÒNG THỜI GIAN (VÍ DỤ) ─────────────────────────
  - id: example
    kind: example
    title: "Tái hiện sự cố bằng số, từng bước"
    checks:
      - "(16 - 14) * 60 + (55 - 30) == 145 and round(145 / 60, 2) == 2.42"
      - "(16 * 60 + 55) - (16 * 60 + 5) == 50"
      - "'0.0.3' != '1.0.0' and tuple(map(int, '1.0.0'.split('.'))) > tuple(map(int, '0.0.3'.split('.')))"
      - "sum(3 ** k for k in (1, 2, 3)) == 39 and 3 ** 3 == 27"
    steps:
      - show: |
          <table class="t"><tr><th>giờ (22/3/2016)</th><th>sự kiện (theo bài của kho gói, 23/3/2016)</th></tr>
          <tr><td>ngay sau 14:30</td><td>hàng trăm lỗi mỗi phút: dự án — và dự án dùng dự án đó, và tiếp nữa — không tải được gói đã bị gỡ</td></tr>
          <tr><td>trong 10 phút</td><td>một người trong cộng đồng đăng lại bản giống hệt, số hiệu <code>1.0.0</code> — lỗi vẫn nhiều</td></tr>
          <tr><td>16:05</td><td>kho gói công bố kế hoạch đăng lại đúng <code>0.0.3</code> từ <b>bản sao lưu</b></td></tr>
          <tr><td>16:55</td><td>xong; gián đoạn kéo dài <b>2,5 giờ</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Đây là dòng thời gian theo bài của chính kho gói, viết ngày hôm sau. Ngay sau 14 giờ 30, hàng trăm lỗi mỗi phút xuất hiện, vì dự án, rồi dự án dùng dự án đó, không tải được gói đã bị gỡ. Trong vòng 10 phút, một người trong cộng đồng đăng lại một bản giống hệt với số hiệu 1 chấm 0 chấm 0, nhưng lỗi vẫn nhiều. Lúc 16 giờ 05, kho gói công bố kế hoạch đăng lại đúng phiên bản 0 chấm 0 chấm 3 từ bản sao lưu. Lúc 16 giờ 55 việc đó xong, và bài viết ghi gián đoạn kéo dài 2 phẩy 5 giờ."
      - clear: true
        show: |
          <p><b>Bước 1 — tính lại thời gian.</b> Từ 14:30 tới 16:55:</p>
          $$(16 - 14) \times 60 + (55 - 30) = 120 + 25 = 145 \text{ phút} \approx 2{,}4 \text{ giờ}$$
          <p class="note">Khớp với “2,5 giờ” của nguồn ở mức làm tròn (lỗi bắt đầu “ngay sau 14:30”). Riêng việc đăng lại từ bản sao lưu: 16:05 → 16:55 = 50 phút.</p>
        focus: [1, 2, 3]
        say: "Bước một, tính lại thời gian từ 14 giờ 30 tới 16 giờ 55. Vì có 2 giờ chẵn và thêm 25 phút, ta được 120 cộng 25, bằng 145 phút, khoảng 2 phẩy 4 giờ. Con số này khớp với 2 phẩy 5 giờ của nguồn ở mức làm tròn, còn riêng việc đăng lại từ bản sao lưu mất 50 phút."
      - show: |
          <p><b>Bước 2 — vì sao bản <code>1.0.0</code> không cứu được?</b> Theo nguồn, gói đánh số dòng <b>yêu cầu đúng <code>0.0.3</code></b>. So hai số hiệu: $0.0.3 \ne 1.0.0$ → không khớp, dù mã giống hệt.</p>
          <p class="note">Và kho gói không cho dùng lại một số hiệu đã có: đăng lại đúng <code>0.0.3</code> phải dựa vào bản sao lưu — một việc “chưa từng làm”.</p>
        focus: [1, 1, 2]
        say: "Bước hai hỏi vì sao bản 1 chấm 0 chấm 0 không cứu được. Theo nguồn, gói đánh số dòng yêu cầu đúng 0 chấm 0 chấm 3, và hai số hiệu khác nhau thì không khớp, dù mã giống hệt. Kho gói lại không cho dùng lại một số hiệu đã có, nên đăng lại đúng 0 chấm 0 chấm 3 phải dựa vào bản sao lưu, một việc chính họ gọi là chưa từng làm."
      - clear: true
        show: |
          <p><b>Bước 3 — đếm gói gián tiếp</b> (số minh hoạ: mỗi gói dùng 3 gói khác, sâu 3 tầng):</p>
          <table class="t"><tr><th>tầng</th><th>số gói</th><th>vì sao</th></tr>
          <tr><td>1</td><td>3</td><td>dự án dùng 3 gói</td></tr>
          <tr><td>2</td><td>$3^2 = 9$</td><td>mỗi gói tầng 1 dùng 3 gói</td></tr>
          <tr><td>3</td><td>$3^3 = 27$</td><td>nhân thêm 3 lần nữa</td></tr>
          <tr><td>cộng</td><td>$3 + 9 + 27 = \hlo{39}$</td><td>gói mà dự án chạy mã của chúng</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước ba đếm gói gián tiếp với số minh hoạ, mỗi gói dùng 3 gói khác, sâu 3 tầng. Tầng một có 3 gói, vì dự án dùng 3 gói. Tầng hai có 3 mũ 2 bằng 9 gói, vì mỗi gói tầng một lại dùng 3 gói. Tầng ba có 3 mũ 3 bằng 27 gói. Cộng lại 39 gói mà dự án chạy mã của chúng, trong khi đội chỉ chọn 3."
      - show: |
          <p><b>Bước 4 — quy mô lần gỡ.</b> Gói tên ứng dụng nhắn tin + 272 gói khác $= 1 + 272 = \hlb{273}$ gói. Nguồn ghi: các gói còn lại được người trong cộng đồng nhận lại trong thời gian tương tự — đăng lại <b>bản rẽ nhánh</b> (bản chép từ mã gốc rồi phát triển riêng), hoặc đăng <b>gói giữ chỗ</b> để kẻ xấu không chiếm tên.</p>
        say: "Bước bốn là quy mô lần gỡ, một gói mang tên ứng dụng nhắn tin cộng 272 gói khác, bằng 273 gói. Nguồn ghi rằng các gói còn lại được người trong cộng đồng nhận lại trong thời gian tương tự. Họ đăng lại bản rẽ nhánh, tức bản chép từ mã gốc rồi phát triển riêng, hoặc đăng gói giữ chỗ để kẻ xấu không chiếm tên."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm hai con số bằng đường khác"
    checks:
      - "(3 ** 4 - 3) // (3 - 1) == 39 and 3 * (3 + 9 + 27) - (3 + 9 + 27) == 81 - 3 == 78"
      - "16 * 60 + 55 == 1015 and 14 * 60 + 30 == 870 and 1015 - 870 == 145 and 81 - 3 == 78"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>39 gói gián tiếp</td><td>gọi tổng là S: $3S = 9 + 27 + 81$, trừ đi $S = 3 + 9 + 27$ còn $2S = 81 - 3 = 78$, nên $S = \dfrac{3^4 - 3}{3 - 1} = 39$ ✓</td></tr>
          <tr><td>145 phút</td><td>đổi cả hai mốc ra phút tính từ nửa đêm: $16 \times 60 + 55 = 1015$, $14 \times 60 + 30 = 870$, hiệu $1015 - 870 = 145$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Ta kiểm hai con số theo đường khác. Với 39 gói, gọi tổng là S, nhân 3 thì mỗi số dịch lên một tầng, nên 3 S trừ S chỉ còn 81 trừ 3, tức 2 S bằng 78, và S bằng 39, khớp. Với 145 phút, đổi cả hai mốc ra phút tính từ nửa đêm, 16 giờ 55 là 1015 phút, 14 giờ 30 là 870 phút, hiệu bằng 145, khớp."

  # ───────────────────────── 7. TRÁCH NHIỆM ─────────────────────────
  - id: duty
    kind: concept
    title: "Mỗi bên chịu trách nhiệm gì"
    steps:
