# ═══ BÀI TÌNH HUỐNG CHUYÊN GIA (sự cố có thật) — tạo bằng lv.py new … --kind case; khung case-lessons.md ═══
# Quy ước: mọi sự kiện, giờ và con số về sự cố lấy nguyên văn từ hai bài của chính kho gói (audit/sep/sources_L10.md: [N16a] 23/3/2016,
#   [N16b] 29/3/2016) và tài liệu chính sách hiện hành [N26], [N26b] (đọc 2026-11-02). Giờ là giờ Thái Bình Dương như nguồn ghi.
#   Con số khác là phép tính lại (checks) hoặc ghi “số minh hoạ”. KHÔNG nêu tên cá nhân (tác giả gói, người đăng lại); không dạy
#   chi tiết “gói 11 dòng” (nguồn không ghi). Lời đọc không nói npm, left-pad, kik, babel, atom, line-numbers: tên chỉ trên màn hình;
#   lời đọc nói “kho gói”, “gói đệm trái”, “gói mang tên một ứng dụng nhắn tin”, “gói đánh số dòng”, “hai bộ công cụ lớn”.
#   Phiên bản viết ba số a.b.c; “yêu cầu đúng 0.0.3” nghĩa là chỉ nhận đúng phiên bản đó.
