  - id: intuition
    kind: intuition
    title: "Chuỗi phụ thuộc: dự án của bạn chưa bao giờ chọn gói ấy"
    steps:
      - show: |
          <div><svg width="1600" height="360" viewBox="0 0 1600 360"><defs><marker id="sp10a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle">
          <rect x="20" y="120" width="250" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="145" y="155" fill="#1f2937" font-weight="bold">dự án của bạn</text><text x="145" y="185" fill="#1f2937">1 phụ thuộc trực tiếp</text>
          <rect x="370" y="120" width="250" height="80" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="495" y="155" fill="#1f2937">bộ công cụ lớn</text><text x="495" y="185" fill="#6b7280">babel / atom</text>
