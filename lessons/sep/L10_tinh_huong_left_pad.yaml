          <tr><td><b>kho gói</b></td><td>tự nhận: “gỡ đăng không giới hạn gây rất nhiều đau đớn”; cần “rào chắn”</td><td>nguyên tắc 3.7: hệ thống thành hạ tầng xã hội thì trách nhiệm lớn theo mức dùng</td></tr>
          <tr><td><b>người dùng gói</b></td><td>bản dựng phụ thuộc vào việc kho luôn còn đúng phiên bản cũ</td><td>biết mình chạy mã của những ai; ghi khoá phiên bản; có bản sao nội bộ</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4"]
        say: "Bảng chia trách nhiệm cho ba bên. Tác giả gói đã gỡ mà không báo trước cho người phát triển dự án phụ thuộc. Nguyên tắc 3 chấm 6 của bộ quy tắc nghề nghiệp đòi thận trọng khi ngừng một thứ người khác còn dựa vào, tức báo trước và chuyển giao. Kho gói tự nhận rằng gỡ đăng không giới hạn gây rất nhiều đau đớn, và họ cần rào chắn. Nguyên tắc 3 chấm 7 nói khi hệ thống thành hạ tầng xã hội, trách nhiệm lớn dần theo mức dùng. Người dùng gói thì để bản dựng phụ thuộc vào việc kho luôn còn đúng phiên bản cũ."
      - clear: true
        show: |
          <table class="t"><tr><th>chính sách gỡ đăng</th><th>điều kiện</th></tr>
          <tr><td>trước 3/2016</td><td>tác giả gỡ được bất cứ lúc nào</td></tr>
          <tr><td>29/3/2016</td><td>phiên bản dưới <b>24 giờ</b> tuổi thì gỡ được; cũ hơn phải liên hệ hỗ trợ, họ kiểm xem có làm hỏng bản cài nào không; gỡ hết thì thay bằng gói giữ chỗ</td></tr>
          <tr><td>hiện hành (đọc 2026)</td><td>trong <b>72 giờ</b> đầu nếu không gói nào phụ thuộc; sau đó chỉ khi cả ba: không gói nào phụ thuộc, dưới <b>300</b> lượt tải tuần trước, <b>một</b> người duy trì</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Kho gói đổi luật theo từng bước. Trước tháng 3 năm 2016, tác giả gỡ được bất cứ lúc nào. Từ ngày 29 tháng 3 năm 2016, chỉ phiên bản dưới 24 giờ tuổi mới gỡ được, còn bản cũ hơn phải liên hệ bộ phận hỗ trợ. Họ kiểm xem việc gỡ có làm hỏng bản cài nào không, và gỡ hết thì thay bằng gói giữ chỗ. Chính sách hiện hành cho gỡ trong 72 giờ đầu nếu không gói nào phụ thuộc, sau đó chỉ khi không gói nào phụ thuộc, dưới 300 lượt tải tuần trước, và chỉ một người duy trì."

  # ───────────────────────── 8. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    checks:
      - "3 + 9 + 27 == 39"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên rút ra</th></tr>
          <tr><td><b class="red">1.</b> “Lỗi của một người, đổ cho tác giả là xong”</td><td>kho cho phép một thao tác phá hàng nghìn dự án; người khác vẫn có thể làm lại</td><td>sửa luật của hệ thống: gỡ đăng có điều kiện, gói giữ chỗ</td></tr>
          <tr><td><b class="red">2.</b> “Đừng bao giờ dùng gói nhỏ”</td><td>kết luận quá rộng; tự viết lại mọi thứ cũng sinh lỗi; vấn đề là phụ thuộc không được quản lý</td><td>biết cây phụ thuộc của mình, chọn có chủ đích</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là đổ cho tác giả là xong. Kho đã cho phép một thao tác phá hàng nghìn dự án, nên người khác vẫn có thể làm lại, và điều cần sửa là luật của hệ thống. Bài học sai thứ hai là đừng bao giờ dùng gói nhỏ, một kết luận quá rộng, vì tự viết lại mọi thứ cũng sinh lỗi. Vấn đề thật là phụ thuộc không được quản lý."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên rút ra</th></tr>
          <tr><td><b class="red">3.</b> “Đăng lại một bản giống hệt thật nhanh là sửa xong”</td><td>bản <code>1.0.0</code> lên trong 10 phút nhưng chuỗi yêu cầu đúng <code>0.0.3</code> — sửa triệu chứng</td><td>đọc cơ chế (số hiệu yêu cầu) trước khi sửa</td></tr>
          <tr><td><b class="red">4.</b> “Có tệp khoá phiên bản là an toàn tuyệt đối” (lỗi của người đã đi làm)</td><td>tệp khoá giúp lần cài sau ra cây y hệt, nhưng mã vẫn tải từ kho; phiên bản bị gỡ thì vẫn hỏng</td><td>tệp khoá + bản sao nội bộ các gói đã dùng</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là đăng lại một bản giống hệt thật nhanh là sửa xong. Bản 1 chấm 0 chấm 0 lên trong 10 phút, nhưng chuỗi phụ thuộc yêu cầu đúng 0 chấm 0 chấm 3, nên đó chỉ là sửa triệu chứng. Bài học sai thứ tư hay gặp ở người đã đi làm, là có tệp khoá phiên bản thì an toàn tuyệt đối. Tệp khoá giúp lần cài sau ra cây y hệt, nhưng mã vẫn được tải từ kho, nên phiên bản bị gỡ thì vẫn hỏng."

