# Quy ước: N = số thiết bị tính, P = công suất trung bình MỖI thiết bị (kW), t = số giờ chạy; điện năng tính bằng kWh (1 kWh = 1 “số điện”).
#   PUE = tổng điện của trung tâm dữ liệu chia điện của thiết bị tính ([P21] §2.3: phần chi phí thêm 50% thì PUE = 1,50).
#   Hệ số phát thải c = kg khí thải quy đổi (CO2e) cho mỗi kWh; 0,5 là SỐ MINH HOẠ (ghi trên màn hình); 0,429 là trung bình Mỹ 2020 theo [P21].
#   Tình huống 8 thiết bị, 0,4 kW, 720 giờ, PUE 1,2 và phần phục vụ 10 kWh mỗi ngày là số minh hoạ. Không viết “P(” để khỏi lẫn ký hiệu xác suất.
#   Lời đọc không nói GPU, PUE, kWh, CO2: nói “bộ xử lý đồ hoạ”, “hệ số điện năng của trung tâm dữ liệu”, “số điện”, “khí thải quy đổi”.
objectives:
  - "Ước lượng điện năng một lần huấn luyện từ số thiết bị, công suất, thời gian và hệ số điện năng của trung tâm dữ liệu"
  - "Đổi điện năng thành khí thải bằng hệ số phát thải của lưới điện, và giải thích vì sao mỗi nơi khác nhau"
  - "So sánh chi phí huấn luyện với chi phí phục vụ cả vòng đời, rồi chọn chỗ nên tối ưu"
asr_reviewed:
  - {sentence: "Cuối cùng, c là số ki lô gam khí thải quy đổi cho mỗi số điện của lưới điện.", reason: "ASR chép “Cuối cùng, sẽ là số kilogram khí thải quy đổi cho mỗi số điện của lưới điện.” (0.833): chữ c đứng riêng đọc “xê”, ASR chép “sẽ”; “ki lô gam” ASR viết gộp “kilogram” — đúng đơn vị — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một tháng huấn luyện trên 8 bộ xử lý đồ hoạ tốn bao nhiêu số điện?"
    checks:
      - "round(8 * 0.4 * 720 * 1.2, 1) == 2764.8 and round(2764.8 * 0.5) == 1382"
    steps:
      - show: |
          <p>Một nhóm huấn luyện mô hình trên <b>8 GPU</b> (bộ xử lý đồ hoạ), mỗi chiếc dùng trung bình <b>0,4 kW</b>, chạy liền <b>30 ngày</b> (số minh hoạ). Hoá đơn ghi khoảng <b>2764,8 kWh</b> — gần 2765 số điện.</p>
          <p>Với hệ số phát thải 0,5 kg mỗi kWh (số minh hoạ), đó là khoảng <b>1382 kg</b> khí thải quy đổi.</p>
          <div class="box key">Hôm nay: (1) con số 2764,8 từ đâu ra? (2) vì sao cùng một lần huấn luyện mà khí thải mỗi nơi một khác? (3) phục vụ người dùng hàng ngày có tốn hơn huấn luyện không?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một nhóm huấn luyện mô hình trên 8 bộ xử lý đồ hoạ, mỗi chiếc dùng trung bình 0 phẩy 4 ki lô oát, chạy liền 30 ngày, với số minh hoạ. Hoá đơn ghi khoảng 2764 phẩy 8 số điện. Với hệ số phát thải minh hoạ 0 phẩy 5 ki lô gam mỗi số điện, đó là khoảng 1382 ki lô gam khí thải quy đổi. Hôm nay ta trả lời ba câu hỏi, con số đó từ đâu ra, vì sao mỗi nơi phát thải khác nhau, và phục vụ hàng ngày có tốn hơn huấn luyện không."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: công suất, điện năng và nhân với một hệ số"
    checks:
      - "0.4 * 10 == 4 and 2 * 0.4 * 10 == 8"
      - "round(100 * 1.2) == 120 and round(100 * 0.2) == 20"
    steps:
      - show: |
          <p><b>① Điện năng = công suất × thời gian.</b> Công suất đo bằng kW (ki lô oát), điện năng đo bằng kWh — đúng bằng một <b>số điện</b> trên hoá đơn.</p>
          <table class="t"><tr><th>thiết bị</th><th>phép tính</th><th>điện năng</th></tr>
          <tr><td>1 máy 0,4 kW chạy 10 giờ</td><td>0,4 × 10</td><td>4 kWh</td></tr>
          <tr><td>2 máy như thế, 10 giờ</td><td>2 × 0,4 × 10</td><td>8 kWh</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ nhất, điện năng bằng công suất nhân thời gian, công suất đo bằng ki lô oát, còn điện năng đo bằng số điện trên hoá đơn. Một máy 0 phẩy 4 ki lô oát chạy 10 giờ dùng 0 phẩy 4 nhân 10, bằng 4 số điện. Hai máy như thế chạy 10 giờ thì gấp đôi, 8 số điện."
      - show: |
          <p><b>② Nhân với một hệ số lớn hơn 1</b> nghĩa là cộng thêm một phần. Nhân 1,2 là thêm 20%:</p>
          $$100 \times 1{,}2 = 100 + 100 \times 0{,}2 = 100 + 20 = 120$$
        focus: [1, 2]
        say: "Điều thứ hai, nhân với một hệ số lớn hơn 1 nghĩa là cộng thêm một phần. Ví dụ 100 nhân 1 phẩy 2 bằng 100 cộng 20 phần trăm của 100, tức 120."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: N, P, t, PUE và hệ số phát thải c"
    checks:
      - "1 + 0.5 == 1.5"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ của bài</th></tr>
          <tr><td>$N$</td><td>số thiết bị tính</td><td>8</td></tr>
          <tr><td>$P$</td><td>công suất trung bình mỗi thiết bị (kW)</td><td>0,4</td></tr>
          <tr><td>$t$</td><td>số giờ chạy</td><td>720 (30 ngày)</td></tr>
          <tr><td>PUE</td><td>tổng điện của trung tâm dữ liệu chia điện của riêng thiết bị tính</td><td>1,2</td></tr>
          <tr><td>$c$</td><td>kg khí thải quy đổi cho mỗi kWh của lưới điện</td><td>0,5 (minh hoạ)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm ký hiệu. N là số thiết bị tính, ở đây là 8. P là công suất trung bình mỗi thiết bị, 0 phẩy 4 ki lô oát. t là số giờ chạy, 30 ngày là 720 giờ. Chữ viết tắt kế tiếp là hệ số điện năng của trung tâm dữ liệu, bằng tổng điện chia điện của riêng thiết bị tính, ở đây là 1 phẩy 2. Cuối cùng, c là số ki lô gam khí thải quy đổi cho mỗi số điện của lưới điện."
      - show: |
          <p><b>Hệ số điện năng của trung tâm dữ liệu</b> (bài báo năm 2021 của nhóm Patterson): nếu phần điện tiêu thêm cho làm mát, biến điện… là 50% thì</p>
          $$\text{PUE} = 1 + 0{,}5 = 1{,}5$$
          <p class="note">Trung bình các trung tâm dữ liệu ở Mỹ: 1,58 năm 2018 và 1,59 năm 2020; một trung tâm của Google ở Iowa: 1,11 (cùng bài báo).</p>
        focus: [1, 2, 3]
        say: "Một bài báo năm 2021 của nhóm nghiên cứu ở Google giải thích hệ số này. Nếu phần điện tiêu thêm cho làm mát và biến điện là 50 phần trăm, hệ số bằng 1 cộng 0 phẩy 5, tức 1 phẩy 5. Cùng bài báo ghi trung bình ở Mỹ là 1 phẩy 58 năm 2018, và một trung tâm của Google chỉ 1 phẩy 11."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Điện đi đâu: từ lưới điện tới thiết bị tính và khí thải"
    steps:
      - show: |
          <div><svg width="1700" height="400" viewBox="0 0 1700 400"><defs><marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="20" y="120" width="260" height="120" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
          <text x="150" y="172" font-weight="bold">lưới điện</text><text x="150" y="208">hệ số c kg mỗi kWh</text>
          <rect x="400" y="40" width="760" height="300" rx="12" fill="#eff6ff" stroke="#2a78d6" stroke-width="2"/>
          <text x="780" y="80" font-weight="bold" fill="#2a78d6">trung tâm dữ liệu: tổng điện = PUE × điện thiết bị tính</text>
          <rect x="440" y="120" width="380" height="180" rx="8" fill="#fff7ed" stroke="#eb6834" stroke-width="2.5"/>
          <text x="630" y="170" font-weight="bold">thiết bị tính</text><text x="630" y="210">N × P × t</text><text x="630" y="250">8 × 0,4 × 720 = 2304 kWh</text>
          <rect x="860" y="120" width="260" height="180" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
          <text x="990" y="170">làm mát,</text><text x="990" y="206">biến điện…</text><text x="990" y="250" fill="#b91c1c">+20% = 460,8 kWh</text>
          <rect x="1290" y="120" width="390" height="120" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
          <text x="1485" y="172" font-weight="bold">khí thải quy đổi</text><text x="1485" y="208">tổng kWh × c</text>
          </g>
          <line x1="285" y1="180" x2="392" y2="180" stroke="#eb6834" stroke-width="5" marker-end="url(#ar6)"/>
          <line x1="1165" y1="180" x2="1282" y2="180" stroke="#eb6834" stroke-width="5" marker-end="url(#ar6)"/>
          <text x="850" y="385" font-size="23" fill="#1f2937" text-anchor="middle">cùng một lần huấn luyện: số điện do thiết bị và PUE quyết định, khí thải do lưới điện quyết định</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy điện đi đâu. Điện từ lưới vào trung tâm dữ liệu, phần lớn chạy thiết bị tính, ở đây là 8 nhân 0 phẩy 4 nhân 720, bằng 2304 số điện. Phần còn lại dành cho làm mát và biến điện, với hệ số 1 phẩy 2 là thêm 20 phần trăm, tức 460 phẩy 8 số điện. Khí thải thì do lưới điện quyết định, nên cùng một lần huấn luyện có thể phát thải rất khác ở hai nơi."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức điện năng và khí thải từng bước"
    checks:
      - "1 * 0.5 * 2 == 1.0 and 1.0 * 1.5 == 1.5"
      - "round(1.5 * 0.4, 1) == 0.6"
    steps:
      - show: |
          <p><b>Bước 1 — thiết bị tính.</b> Vì công suất các thiết bị cộng dồn, và điện năng bằng công suất nhân thời gian:</p>
          $$\text{điện thiết bị tính} = N \times P \times t$$
          <p class="note">Làm thử: 1 thiết bị 0,5 kW chạy 2 giờ → $1 \times 0{,}5 \times 2 = 1$ kWh.</p>
        focus: [2, 3]
        say: "Bước một, vì công suất của các thiết bị cộng dồn, và điện năng bằng công suất nhân thời gian, nên điện của thiết bị tính bằng N nhân P nhân t. Làm thử với 1 thiết bị 0 phẩy 5 ki lô oát chạy 2 giờ, ta được 1 số điện."
      - show: |
          <p><b>Bước 2 — cả trung tâm dữ liệu.</b> Theo định nghĩa, PUE = tổng điện chia điện thiết bị tính. Chuyển vế, nhân hai vế với điện thiết bị tính:</p>
          $$\text{tổng điện} = \text{PUE} \times N \times P \times t$$
          <p class="note">Làm thử với PUE 1,5: $1{,}5 \times 1 = 1{,}5$ kWh.</p>
        focus: [1, 2, 3]
        say: "Bước hai, theo định nghĩa, hệ số điện năng bằng tổng điện chia điện thiết bị tính. Chuyển vế bằng cách nhân hai vế với điện thiết bị tính, ta được tổng điện bằng hệ số đó nhân N nhân P nhân t. Làm thử với hệ số 1 phẩy 5, một số điện của thiết bị thành 1 phẩy 5 số điện cho cả trung tâm."
      - clear: true
        show: |
          <p><b>Bước 3 — khí thải.</b> Vì mỗi kWh của lưới điện kèm $c$ kg khí thải quy đổi, nhân tổng điện với $c$:</p>
          $$\text{khí thải (kg)} = \hlg{c \times \text{PUE} \times N \times P \times t}$$
          <p class="note">Làm thử với $c = 0{,}4$: $0{,}4 \times 1{,}5 = 0{,}6$ kg. Ba bước là ba phép nhân — đổi thứ tự không đổi kết quả.</p>
        focus: [1, 2, 3, 3]
        say: "Bước ba, vì mỗi số điện của lưới kèm c ki lô gam khí thải quy đổi, ta nhân tổng điện với c. Vậy khí thải bằng c nhân hệ số điện năng nhân N nhân P nhân t. Làm thử với c bằng 0 phẩy 4, 1 phẩy 5 số điện cho 0 phẩy 6 ki lô gam. Ba bước chỉ là ba phép nhân, nên đổi thứ tự không đổi kết quả."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "8 thiết bị, 0,4 kW, 30 ngày: từng phép tính"
    checks:
      - "round(8 * 0.4, 1) == 3.2"
      - "round(3.2 * 720, 1) == 2304.0"
      - "round(2304 * 1.2, 1) == 2764.8"
      - "round(2764.8 * 0.5, 1) == 1382.4"
    steps:
      - show: |
          <p><b>Bước 1.</b> Công suất cả nhóm thiết bị: $8 \times 0{,}4 = \hlb{3{,}2}$ kW.</p>
          <p><b>Bước 2.</b> Điện thiết bị tính trong 30 ngày = 720 giờ: $3{,}2 \times 720 = \hlb{2304}$ kWh.</p>
        focus: [1, 2]
        say: "Bước một, công suất của cả nhóm thiết bị là 8 nhân 0 phẩy 4, bằng 3 phẩy 2 ki lô oát. Bước hai, 30 ngày là 720 giờ, nên điện của thiết bị tính là 3 phẩy 2 nhân 720, bằng 2304 số điện."
      - show: |
          <p><b>Bước 3.</b> Cả trung tâm dữ liệu, PUE 1,2: $2304 \times 1{,}2 = \hlo{2764{,}8}$ kWh.</p>
          <p><b>Bước 4.</b> Khí thải với $c = 0{,}5$ (số minh hoạ): $2764{,}8 \times 0{,}5 = \hlg{1382{,}4}$ kg.</p>
        focus: [1, 2]
        say: "Bước ba, nhân với hệ số điện năng 1 phẩy 2 của trung tâm dữ liệu, ta được 2764 phẩy 8 số điện, đúng con số trên hoá đơn. Bước bốn, nhân với hệ số phát thải minh hoạ 0 phẩy 5, ta được 1382 phẩy 4 ki lô gam khí thải quy đổi."
      - clear: true
        show: |
          <table class="t"><tr><th>phần</th><th>kWh</th><th>tỉ lệ</th></tr>
          <tr><td>thiết bị tính</td><td>2304</td><td>$\frac{2304}{2764{,}8} \approx 83\%$</td></tr>
          <tr><td>làm mát, biến điện…</td><td>$2764{,}8 - 2304 = 460{,}8$</td><td>$\approx 17\%$</td></tr>
          <tr><td>tổng</td><td>2764,8</td><td>100%</td></tr></table>
          <p class="note">PUE 1,2 nghĩa là thêm 20% so với thiết bị tính, nhưng chỉ chiếm khoảng 17% tổng điện — hai cách nói khác nhau về cùng 460,8 kWh.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bảng tách tổng điện ra hai phần. Thiết bị tính dùng 2304 số điện, khoảng 83 phần trăm tổng. Phần làm mát và biến điện là 460 phẩy 8 số điện, khoảng 17 phần trăm. Hệ số 1 phẩy 2 là thêm 20 phần trăm so với thiết bị tính, nhưng chỉ chiếm 17 phần trăm tổng, đó là hai cách nói về cùng một lượng điện."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm theo đường khác: tính theo ngày, đổi lưới điện"
    checks:
      - "round(3.2 * 24, 1) == 76.8 and round(76.8 * 30, 1) == 2304.0"
      - "round(2304 + 2304 * 0.2, 1) == 2764.8"
      - "round(2764.8 * 0.429) == 1186 and round(2764.8 * 0.201) == 556 and round(2764.8 * 0.545) == 1507"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>2304 kWh</td><td>mỗi ngày $3{,}2 \times 24 = 76{,}8$ kWh, rồi $76{,}8 \times 30 = 2304$ ✓</td></tr>
          <tr><td>2764,8 kWh</td><td>cộng thêm 20%: $2304 + 460{,}8 = 2764{,}8$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Ta kiểm lại theo đường khác. Tính theo ngày, mỗi ngày dùng 3 phẩy 2 nhân 24, bằng 76 phẩy 8 số điện, nhân 30 ngày được 2304, khớp. Cộng thêm 20 phần trăm, 2304 cộng 460 phẩy 8 cũng bằng 2764 phẩy 8."
      - show: |
          <p>Đổi lưới điện, giữ nguyên 2764,8 kWh. Hệ số theo bài báo năm 2021 (lúc mô hình chạy):</p>
          <table class="t"><tr><th>lưới điện</th><th>kg mỗi kWh</th><th>khí thải</th></tr>
          <tr><td>trung bình Mỹ 2020</td><td>0,429</td><td>$\approx 1186$ kg</td></tr>
          <tr><td>trung tâm có hệ số thấp nhất trong bảng</td><td>0,201</td><td>$\approx 556$ kg</td></tr>
          <tr><td>trung tâm có hệ số cao nhất trong bảng</td><td>0,545</td><td>$\approx 1507$ kg</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bây giờ đổi lưới điện mà giữ nguyên số điện, vì khí thải bằng c nhân số điện nên chỉ cần thay c, theo các hệ số ghi trong bài báo năm 2021. Với trung bình của Mỹ năm 2020, 0 phẩy 429, ta được khoảng 1186 ki lô gam. Với trung tâm có hệ số thấp nhất trong bảng, 0 phẩy 201, chỉ còn khoảng 556 ki lô gam. Với trung tâm cao nhất, 0 phẩy 545, lên khoảng 1507 ki lô gam, gần gấp ba."

  # ───────────────────────── 8. PHỤC VỤ ─────────────────────────
  - id: serving
    kind: concept
    title: "Huấn luyện một lần, phục vụ mỗi ngày"
    checks:
      - "round(2764.8 / 10, 2) == 276.48 and 10 * 365 == 3650 and 3650 > 2764.8"
    steps:
      - show: |
          <p>Bài báo năm 2022 của cùng nhóm đo ở Google trong ba năm 2019–2021: học máy chiếm <b>10–15%</b> điện năng, và khoảng <b>⅗ (ba phần năm)</b> điện của học máy là cho <b>suy luận</b> (phục vụ người dùng), ⅖ cho huấn luyện.</p>
          <table class="t"><tr><th>số minh hoạ</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>phục vụ: 10 kWh mỗi ngày</td><td>$\frac{2764{,}8}{10}$</td><td>sau $\approx 276$ ngày đã bằng điện huấn luyện</td></tr>
          <tr><td>một năm phục vụ</td><td>$10 \times 365$</td><td>3650 kWh &gt; 2764,8 kWh</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Bài báo năm 2022 của cùng nhóm đo ở Google ba năm liền, học máy chiếm 10 tới 15 phần trăm điện năng. Khoảng ba phần năm điện của học máy là cho suy luận, tức phục vụ người dùng, chỉ hai phần năm cho huấn luyện. Lấy số minh hoạ, nếu phục vụ tốn 10 số điện mỗi ngày, sau khoảng 276 ngày đã bằng điện huấn luyện. Một năm phục vụ là 3650 số điện, nhiều hơn cả lần huấn luyện."
      - show: |
          <div class="box key">Bộ quy tắc nghề nghiệp năm 2018 (nguyên tắc 1.1): an sinh của con người cần một môi trường tự nhiên an toàn, nên người làm tin học nên <b>thúc đẩy tính bền vững môi trường</b>, ở địa phương và toàn cầu. Muốn bền vững thì phải <b>đo</b> trước: số điện, nơi chạy, và cả vòng đời.</div>
          $$\text{vòng đời} = \text{huấn luyện} + \text{số ngày phục vụ} \times \text{điện mỗi ngày}$$
        focus: [1, 1, 2]
        say: "Bộ quy tắc nghề nghiệp năm 2018 của Hiệp hội Máy tính, ở nguyên tắc 1 chấm 1, nói an sinh của con người cần một môi trường tự nhiên an toàn. Vì vậy người làm tin học nên thúc đẩy tính bền vững môi trường, ở địa phương và toàn cầu. Muốn vậy phải đo cả vòng đời, bằng điện huấn luyện cộng số ngày phục vụ nhân điện mỗi ngày."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round(2304 * 1.58, 1) == 3640.3 and round(2764.8 - 2304, 1) == 460.8"
      - "round(0.545 / 0.201, 1) == 2.7"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ tính điện của thiết bị tính <b class="red">(quên phần làm mát)</b></div>
          <table class="t"><tr><th>cách tính</th><th>kWh</th></tr>
          <tr><td>chỉ thiết bị tính</td><td>2304</td></tr>
          <tr><td>trung tâm PUE 1,2</td><td>2764,8 (thiếu 460,8)</td></tr>
          <tr><td>trung tâm PUE 1,58 (trung bình Mỹ 2018)</td><td>$2304 \times 1{,}58 \approx 3640{,}3$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ nhất là chỉ tính điện của thiết bị tính mà quên phần làm mát. Chỉ thiết bị thì là 2304 số điện. Ở trung tâm có hệ số 1 phẩy 2, con số thật là 2764 phẩy 8, thiếu 460 phẩy 8. Ở trung tâm có hệ số trung bình của Mỹ năm 2018 là 1 phẩy 58, tổng lên khoảng 3640 số điện."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng một hệ số phát thải cho mọi nơi <b class="red">(lệch tới gần 3 lần)</b>
          <br><span class="note">Trong bảng của bài báo năm 2021, hệ số từ 0,201 tới 0,545 kg mỗi kWh: $0{,}545 / 0{,}201 \approx 2{,}7$. Hỏi đúng hệ số của nơi chạy và của thời điểm chạy.</span></div>
          $$\frac{0{,}545}{0{,}201} \approx 2{,}7$$
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là dùng một hệ số phát thải cho mọi nơi. Trong bảng của bài báo năm 2021, hệ số đi từ 0 phẩy 201 tới 0 phẩy 545, chênh nhau khoảng 2 phẩy 7 lần. Vì vậy hãy hỏi đúng hệ số của nơi chạy và của thời điểm chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Tối ưu lần huấn luyện, bỏ qua phần phục vụ <b class="red">(⅗ điện là suy luận)</b>
          <br><span class="note">Mô hình dùng mỗi ngày: giảm 10% điện phục vụ có thể lợi hơn giảm 10% điện huấn luyện. Đo cả hai trước khi chọn chỗ tối ưu.</span></div>
          <table class="t"><tr><th>giảm 10% (số minh hoạ)</th><th>tiết kiệm trong một năm</th></tr>
          <tr><td>điện huấn luyện 2764,8 kWh</td><td>276,48 kWh</td></tr>
          <tr><td>điện phục vụ 3650 kWh</td><td>365 kWh</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là chỉ tối ưu lần huấn luyện mà bỏ qua phần phục vụ, trong khi đo ở Google cho thấy ba phần năm điện là suy luận. Với mô hình dùng mỗi ngày, giảm 10 phần trăm điện phục vụ có thể lợi hơn. Giảm 10 phần trăm điện huấn luyện tiết kiệm 276 phẩy 48 số điện, còn 10 phần trăm điện phục vụ một năm là 365 số điện."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lấy công suất ghi trên nhãn thiết bị thay cho công suất đo được <b class="red">(ước lượng lệch)</b>
          <br><span class="note">Bài báo năm 2019 của nhóm Strubell lấy mẫu công suất thật của bộ xử lý trong lúc huấn luyện, rồi mới nhân với PUE 1,58. Thiết bị hiếm khi chạy đúng mức tối đa suốt cả tháng.</span></div>
          $$\text{điện} = \text{PUE} \times (\text{công suất đo được}) \times t$$
        focus: [1, 1, 2]
        say: "Lỗi thứ tư là lấy công suất ghi trên nhãn thiết bị thay cho công suất đo được. Một bài báo năm 2019 về chi phí năng lượng của học sâu lấy mẫu công suất thật của bộ xử lý trong lúc huấn luyện, rồi mới nhân với hệ số 1 phẩy 58. Thiết bị hiếm khi chạy đúng mức tối đa suốt cả tháng, nên hãy dùng công suất đo được."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chạy ở đâu?"
    checks:
      - "round(16 * 0.3, 1) == 4.8 and round(4.8 * 240, 1) == 1152.0 and round(1152 * 1.5, 1) == 1728.0"
      - "round(1728 * 0.4, 1) == 691.2"
      - "round(1152 * 1.1, 1) == 1267.2 and round(1728 - 1267.2, 1) == 460.8 and round(460.8 * 0.4, 2) == 184.32"
    steps:
      - show: |
          <p>Huấn luyện trên <b>16</b> thiết bị, mỗi chiếc <b>0,3 kW</b>, chạy <b>240 giờ</b>, ở phòng máy công ty có PUE <b>1,5</b>; lưới điện $c = 0{,}4$ (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Tổng điện năng bao nhiêu kWh?</td></tr>
          <tr><td>2</td><td>Khí thải quy đổi bao nhiêu kg?</td></tr>
          <tr><td>3</td><td>Thuê một trung tâm PUE 1,1, cùng lưới điện: tiết kiệm bao nhiêu? Bạn chọn gì, cần hỏi thêm gì?</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Một lần huấn luyện dùng 16 thiết bị, mỗi chiếc 0 phẩy 3 ki lô oát, chạy 240 giờ. Phòng máy công ty có hệ số điện năng 1 phẩy 5, lưới điện có c bằng 0 phẩy 4. Câu một, tổng điện năng bao nhiêu số điện? Câu hai, khí thải quy đổi bao nhiêu ki lô gam? Câu ba, nếu thuê một trung tâm có hệ số 1 phẩy 1, cùng lưới điện, thì tiết kiệm bao nhiêu, và bạn chọn gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$16 \times 0{,}3 = 4{,}8$ kW; $4{,}8 \times 240 = 1152$; $1152 \times 1{,}5$</td><td>$\hlb{1728}$ kWh</td></tr>
          <tr><td>2</td><td>$1728 \times 0{,}4$</td><td>$\hlg{691{,}2}$ kg</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Đáp án câu một, công suất nhóm thiết bị là 16 nhân 0 phẩy 3, bằng 4 phẩy 8 ki lô oát. Nhân 240 giờ được 1152 số điện, nhân hệ số 1 phẩy 5 được 1728 số điện. Câu hai, 1728 nhân 0 phẩy 4 bằng 691 phẩy 2 ki lô gam khí thải quy đổi."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>trung tâm PUE 1,1</td><td>$1152 \times 1{,}1$</td><td>1267,2 kWh</td></tr>
          <tr><td>tiết kiệm</td><td>$1728 - 1267{,}2$</td><td>$\hlg{460{,}8}$ kWh, tức $\approx 184{,}3$ kg</td></tr></table>
          <p class="note">Quyết định: chuyển nếu giá và quy định về dữ liệu cho phép; hỏi thêm hệ số phát thải thật của nơi đó — nếu lưới điện ở đó có $c$ cao hơn, phần lợi có thể mất. Và đo cả điện phục vụ sau này.</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Câu ba, ở trung tâm có hệ số 1 phẩy 1, tổng điện là 1152 nhân 1 phẩy 1, bằng 1267 phẩy 2 số điện. Tiết kiệm 460 phẩy 8 số điện, tức khoảng 184 phẩy 3 ki lô gam khí thải. Hãy chuyển nếu giá và quy định về dữ liệu cho phép, nhưng hỏi thêm hệ số phát thải thật của nơi đó, vì lưới điện có c cao hơn có thể xoá phần lợi. Và nhớ đo cả điện phục vụ sau này."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">điện thiết bị = N × P × t</span><span class="a">→</span>
          <span class="n">tổng điện = PUE × điện thiết bị</span><span class="a">→</span>
          <span class="n">khí thải = c × tổng điện, c tuỳ lưới điện</span><span class="a">→</span>
          <span class="n">vòng đời = huấn luyện + phục vụ</span></div>
        say: "Tổng kết lại, điện của thiết bị bằng N nhân P nhân t. Tổng điện bằng hệ số điện năng của trung tâm nhân điện thiết bị. Khí thải bằng c nhân tổng điện, với c tuỳ lưới điện. Và chi phí cả vòng đời gồm huấn luyện cộng phục vụ."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi nói “mô hình này xanh” hay “tốn kém”, hãy có ba con số: <b>số điện đo được</b>, <b>hệ số của nơi chạy</b>, và <b>điện phục vụ mỗi ngày</b> nhân số ngày dùng.</div>
        say: "Điều cần mang theo, trước khi nói mô hình này xanh hay tốn kém, hãy có ba con số, số điện đo được, hệ số của nơi chạy, và điện phục vụ mỗi ngày nhân số ngày dùng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>công bố lỗ hổng có phối hợp</b> — báo riêng cho bên sửa, chờ bản vá, rồi mới công bố.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học công bố lỗ hổng có phối hợp, tức báo riêng cho bên sửa, chờ bản vá, rồi mới công bố cho mọi người. Hẹn gặp bạn ở bài tiếp theo."
