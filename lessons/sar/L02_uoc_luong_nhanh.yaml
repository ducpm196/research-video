scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cần mấy máy chủ?"
    steps:
      - show: |
          <p>Sếp hỏi: “ứng dụng có 10 triệu người dùng mỗi ngày, cần mấy máy chủ, mấy ổ đĩa?” Bạn không cần câu trả lời chính xác tới từng máy — nhưng cần biết là 3 máy hay 300 máy, trước khi vẽ bất kỳ sơ đồ nào.</p>
          <div class="box key">Hôm nay: <b>ước lượng nhanh</b> — vài phép nhân trên mặt sau phong bì, đúng tới bậc độ lớn.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, sếp hỏi ứng dụng có 10 triệu người dùng mỗi ngày thì cần mấy máy chủ, mấy ổ đĩa. Bạn không cần câu trả lời chính xác tới từng máy, nhưng cần biết là 3 máy hay 300 máy, trước khi vẽ bất kỳ sơ đồ nào. Hôm nay ta học ước lượng nhanh, vài phép nhân trên mặt sau phong bì, đúng tới bậc độ lớn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: giây trong ngày, tiền tố, byte và bit"
    checks:
      - "24 * 60 * 60 == 86400 and 864000 / 86400 == 10"
      - "2e3 * 1e6 == 2e9 and 1e9 / 8 / 1e6 == 125"
    steps:
      - show: |
          <p>Một ngày có $24 \cdot 60 \cdot 60 = \hl{86\,400}$ giây. Nếu 864 000 yêu cầu rải đều trong ngày thì mỗi giây có $\frac{864\,000}{86\,400} = 10$ yêu cầu.</p>
        say: "Trước hết, ôn ba điều sẽ dùng. Một ngày có 24 nhân 60 nhân 60, bằng 86 nghìn 400 giây. Nếu 864 nghìn yêu cầu rải đều trong ngày thì mỗi giây có 864 nghìn chia 86 nghìn 400, bằng 10 yêu cầu."
      - show: |
          <table class="t"><tr><th>tiền tố</th><th>bằng</th><th>ví dụ</th></tr>
          <tr><td>KB</td><td>$10^3$ byte</td><td rowspan="3">1 triệu bài, mỗi bài 2 KB: $2 \cdot 10^3 \cdot 10^6 = 2 \cdot 10^9$ byte = 2 GB</td></tr>
          <tr><td>GB</td><td>$10^9$ byte</td></tr>
          <tr><td>TB</td><td>$10^{12}$ byte</td></tr></table>
        introduces: [cdot, power]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Thứ hai, tiền tố đơn vị. KB là một nghìn byte, GB là một tỉ byte, tê-ra-byte là một nghìn tỉ byte. Ví dụ 1 triệu bài, mỗi bài 2 KB, là 2 nhân 10 mũ 3 nhân 10 mũ 6, bằng 2 nhân 10 mũ 9 byte, tức 2 GB. Cộng số mũ khi nhân là cách nhanh nhất để khỏi đếm sai số không."
      - show: |
          <p><b>Bit</b> là một chữ số nhị phân, 0 hoặc 1; <b>1 byte = 8 bit</b>, đủ ghi một chữ cái không dấu. Dung lượng lưu trữ tính bằng <b>byte</b>, còn tốc độ đường truyền tính bằng <b>bit</b> mỗi giây. Đường truyền 1 gigabit/s chở $\frac{10^9}{8} = 125 \cdot 10^6$ byte, tức 125 MB mỗi giây.</p>
        say: "Thứ ba, ta cần phân biệt hai đơn vị của dữ liệu. Bit là một chữ số nhị phân, 0 hoặc 1, còn 1 byte gồm 8 bit, đủ ghi một chữ cái không dấu. Dung lượng lưu trữ tính bằng byte, còn tốc độ đường truyền tính bằng bit mỗi giây. Đường truyền một tỉ bit mỗi giây chỉ chở được một tỉ chia 8, tức 125 triệu byte mỗi giây."

  - id: sym
    kind: symbol
    title: "Giải mã: ba câu hỏi ước lượng"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>công thức</th></tr>
          <tr><td>yêu cầu mỗi giây (trung bình)</td><td>$\frac{\text{người dùng mỗi ngày} \cdot \text{yêu cầu mỗi người}}{86\,400}$</td></tr>
          <tr><td>cao điểm</td><td>trung bình $\cdot$ hệ số cao điểm (đo từ dữ liệu theo giờ)</td></tr>
          <tr><td>lưu trữ mỗi năm</td><td>bản ghi mới mỗi ngày $\cdot$ kích thước $\cdot$ 365</td></tr>
          <tr><td>băng thông</td><td>yêu cầu mỗi giây $\cdot$ kích thước trả về $\cdot$ 8 (đổi byte sang bit)</td></tr></table>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng cho bốn công thức ước lượng. Yêu cầu mỗi giây trung bình bằng số người dùng mỗi ngày nhân số yêu cầu mỗi người, chia 86 nghìn 400 giây. Cao điểm bằng trung bình nhân hệ số cao điểm, đo từ dữ liệu theo giờ. Lưu trữ mỗi năm bằng số bản ghi mới mỗi ngày nhân kích thước, nhân 365. Băng thông bằng yêu cầu mỗi giây nhân kích thước trả về, nhân 8 để đổi byte sang bit."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một con số đi qua chuỗi phép nhân, chia"
    checks:
      - "10e6 * 20 == 200e6 and round(200e6 / 86400) == 2315 and round(200e6 / 86400 * 3) == 6944"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="22" fill="#1f2937"><rect x="20" y="40" width="230" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="135" y="75" text-anchor="middle">10 triệu</text><text x="135" y="103" text-anchor="middle">người mỗi ngày</text><text x="300" y="70" text-anchor="middle" fill="#2a78d6">nhân 20</text><line x1="255" y1="80" x2="345" y2="80" stroke="#2a78d6" stroke-width="3"/><rect x="350" y="40" width="250" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="475" y="75" text-anchor="middle">200 triệu</text><text x="475" y="103" text-anchor="middle">yêu cầu mỗi ngày</text><text x="700" y="70" text-anchor="middle" fill="#2a78d6">chia 86 400</text><line x1="605" y1="80" x2="795" y2="80" stroke="#2a78d6" stroke-width="3"/><rect x="800" y="40" width="250" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="925" y="75" text-anchor="middle">2315 mỗi giây</text><text x="925" y="103" text-anchor="middle">trung bình</text><text x="1130" y="70" text-anchor="middle" fill="#eb6834">nhân 3</text><line x1="1055" y1="80" x2="1205" y2="80" stroke="#eb6834" stroke-width="3"/><rect x="1210" y="40" width="270" height="80" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1345" y="75" text-anchor="middle" font-weight="bold">6944 mỗi giây</text><text x="1345" y="103" text-anchor="middle">cao điểm</text><line x1="925" y1="125" x2="925" y2="215" stroke="#059669" stroke-width="3"/><text x="945" y="168" fill="#059669">nhân 50 KB, nhân 8</text><rect x="800" y="220" width="250" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="925" y="255" text-anchor="middle">926 megabit/s</text><text x="925" y="283" text-anchor="middle">băng thông</text><line x1="135" y1="125" x2="135" y2="215" stroke="#d97706" stroke-width="3"/><text x="155" y="168" fill="#d97706">nhân 2 KB, nhân 365</text><rect x="20" y="220" width="250" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="145" y="255" text-anchor="middle">7,3 TB</text><text x="145" y="283" text-anchor="middle">lưu trữ mỗi năm</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình cho thấy ước lượng là một chuỗi phép tính, mỗi mũi tên một phép. Hàng trên, 10 triệu người nhân 20 yêu cầu thành 200 triệu yêu cầu mỗi ngày, chia 86 nghìn 400 giây thành khoảng 2315 mỗi giây, rồi nhân hệ số cao điểm thành 6944. Hai nhánh xuống dưới tách ra từ những ô đã có, một nhánh thành băng thông, một nhánh thành lưu trữ mỗi năm."

  - id: example
    kind: example
    title: "10 triệu người dùng mỗi ngày"
    checks:
      - "round(10e6 * 20 / 86400) == 2315 and round(10e6 * 20 / 86400 * 3) == 6944"
      - "10e6 * 2e3 / 1e9 == 20.0 and round(10e6 * 2e3 * 365 / 1e12, 1) == 7.3 and round(10e6 * 20 / 86400 * 50e3 * 8 / 1e6) == 926"
      - "10e6 * 20 == 2e8 and 20 * 365 == 7300 and round(10e6 * 20 / 86400 * 50e3 / 1e6, 1) == 115.7 and math.ceil(10e6 * 20 / 86400 * 3 / 1000) == 7"
      - "round(2e8 / 86400, 1) == 2314.8 and round(2314.8 * 3) == 6944 and 2315 * 3 == 6945 and round(2314.8 * 50e3 / 1e6, 1) == 115.7"
    steps:
      - show: |
          <p><b>Bước 1 — tổng yêu cầu mỗi ngày:</b> mỗi người 20 yêu cầu → $10^7 \cdot 20 = 2 \cdot 10^8$, tức 200 triệu yêu cầu.</p>
          <p><b>Bước 2 — chia cho số giây:</b> $\frac{2 \cdot 10^8}{86\,400} \approx \hl{2315}$ yêu cầu/s trung bình.</p>
        focus: [1, 2]
        say: "Bước một, ứng dụng có 10 triệu người dùng mỗi ngày, mỗi người 20 yêu cầu, nên tổng là 10 triệu nhân 20, bằng 200 triệu yêu cầu mỗi ngày. Bước hai, chia cho 86 nghìn 400 giây, được khoảng 2315 yêu cầu mỗi giây trung bình."
      - show: |
          <p><b>Bước 3 — cao điểm:</b> giả định giờ đông nhất gấp 3 trung bình → $2314{,}8 \cdot 3 \approx \hl{6944}$ yêu cầu/s (nhân từ số chưa làm tròn 2314,8; lấy 2315 nhân 3 sẽ ra 6945).</p>
          <p class="note">Hệ số 3 ở đây là giả định cho ví dụ; hệ thống thật thì đo từ số liệu theo giờ.</p>
        focus: [1, 1, 1, 2]
        say: "Bước ba, cao điểm. Ta giả định giờ đông nhất gấp 3 trung bình, nên cao điểm khoảng 6944 yêu cầu mỗi giây. Ta nhân 3 từ số chưa làm tròn là 2314 phẩy 8, còn lấy 2315 nhân 3 thì ra 6945. Hệ số 3 ở đây là giả định cho ví dụ, còn hệ thống thật thì đo từ số liệu theo giờ."
      - clear: true
        show: |
          <p><b>Bước 4 — lưu trữ:</b> mỗi người 1 bài 2 KB mỗi ngày → $10^7 \cdot 2 \text{ KB} = 20$ GB mỗi ngày; nhân 365 → $7300$ GB $\approx \hl{7{,}3}$ TB mỗi năm.</p>
          <p><b>Bước 5 — băng thông:</b> mỗi lần trả về 50 KB → $2314{,}8 \cdot 50 \text{ KB} \approx 115{,}7$ MB/s; nhân 8 → $\approx \hl{926}$ megabit/s trung bình.</p>
        focus: [1, 1, 1, 2, 2, 2]
        say: "Bước bốn, lưu trữ. Mỗi người đăng 1 bài 2 KB mỗi ngày thì mỗi ngày có 20 GB, nhân 365 thành 7300 GB. Nếu mỗi người đăng 1 bài 2 KB mỗi ngày, lưu trữ khoảng 7 phẩy 3 tê-ra-byte mỗi năm. Bước năm, băng thông. Nếu mỗi lần trả về 50 KB, băng thông trung bình khoảng 926 mê-ga-bít mỗi giây. Đó là vì 2314 phẩy 8 nhân 50 KB là khoảng 115 phẩy 7 MB mỗi giây, nhân 8 để đổi sang bit."
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>trung bình</td><td>$\frac{10\,000\,000 \cdot 20}{86\,400}$</td><td>≈ 2315 yêu cầu/s</td></tr>
          <tr><td>cao điểm (gấp 3)</td><td>$2314{,}8 \cdot 3$</td><td>≈ $\hl{6944}$ yêu cầu/s</td></tr>
          <tr><td>lưu trữ (mỗi người 1 bài 2 KB mỗi ngày)</td><td>$10^7 \cdot 2 \text{ KB} \cdot 365$</td><td>≈ $\hl{7{,}3}$ TB mỗi năm</td></tr>
          <tr><td>băng thông (trả về 50 KB)</td><td>$2314{,}8 \cdot 50 \text{ KB} \cdot 8$</td><td>≈ 926 megabit/s trung bình</td></tr></table>
          <p class="note"><b>Bước 6 — số máy:</b> giả sử một máy chủ ứng dụng chịu khoảng 1000 yêu cầu/s (số minh hoạ; máy thật phải đo bằng thử tải) thì cần ít nhất 7 máy ở cao điểm, chưa tính dự phòng — “cỡ một chục máy” chứ không phải “vài trăm”.</p>
        focus: [1, 1, 2, 2]
        say: "Bảng gom lại bốn con số. Trung bình khoảng 2315 yêu cầu mỗi giây, cao điểm khoảng 6944, lưu trữ khoảng 7 phẩy 3 tê-ra-byte mỗi năm, băng thông trung bình khoảng 926 mê-ga-bít mỗi giây. Bước sáu, ta tính số máy chủ, với số minh hoạ là mỗi máy chủ ứng dụng chịu khoảng 1000 yêu cầu mỗi giây. Khi đó cần ít nhất 7 máy ở cao điểm, chưa tính dự phòng, tức cỡ một chục máy chứ không phải vài trăm."

  - id: check
    kind: check
    title: "Tự kiểm: tính ngược, đổi thứ tự nhân"
    checks:
      - "2315 * 86400 == 200016000 and abs(2315 * 86400 - 2e8) / 2e8 < 0.001"
      - "2e3 * 365 == 730e3 and 730e3 * 10e6 / 1e12 == 7.3"
      - "round(926 / 8, 1) == 115.8 and round(926 / 8 * 1e6 / 50e3) == 2315"
      - "7 * 1000 >= 6944 > 6 * 1000"
    steps:
      - show: |
          <table class="t"><tr><th>kết quả</th><th>đường khác</th><th>khớp?</th></tr>
          <tr><td>2315 yêu cầu/s</td><td>nhân ngược: $2315 \cdot 86\,400 \approx 200$ triệu yêu cầu mỗi ngày</td><td>✓</td></tr>
          <tr><td>7,3 TB mỗi năm</td><td>tính theo một người trước: $2 \text{ KB} \cdot 365 = 730$ KB, rồi nhân $10^7$ người</td><td>✓</td></tr>
          <tr><td>926 megabit/s</td><td>chia ngược: $\frac{926}{8} \approx 115{,}8$ MB/s, chia 50 KB → ≈ 2315 lần mỗi giây</td><td>✓</td></tr>
          <tr><td>7 máy</td><td>$7 \cdot 1000 = 7000 \geq 6944$, còn 6 máy chỉ 6000</td><td>✓</td></tr></table>
        introduces: [geq]
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Kiểm bằng đường khác, đi ngược từng kết quả. Lấy 2315 nhân 86 nghìn 400 thì được khoảng 200 triệu, đúng tổng yêu cầu mỗi ngày. Tính lưu trữ theo một người trước, 2 KB nhân 365 là 730 KB mỗi năm, nhân 10 triệu người lại ra 7 phẩy 3 tê-ra-byte. Lấy 926 chia 8 được khoảng 115 phẩy 8 MB mỗi giây, chia tiếp cho 50 KB lại ra khoảng 2315 lần trả về mỗi giây. Cuối cùng, 7 máy chịu 7000, đủ cho 6944, còn 6 máy chỉ chịu 6000, không đủ."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "round(10e6 * 20 / 86400 * 3 * 50e3 * 8 / 1e6) == 2778 and 926 < 1000 < 2778 and round(2778 / 1000, 1) == 2.8"
      - "[round(1 / (1 - b), 6) for b in (0.5, 0.9, 0.99)] == [2.0, 10.0, 100.0] and round(7.3 * 3, 1) == 21.9"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thiết kế theo trung bình <b class="red">(sập giờ cao điểm)</b>
          <br><span class="note">2315 yêu cầu/s trung bình nhưng 6944 lúc cao điểm: đủ cho trung bình là thiếu gấp 3 lúc đông nhất. Thiết kế theo cao điểm, cộng <b>dư địa</b> (chừa sức chịu thừa), vì máy càng gần bận kín thì hàng chờ càng dài.</span></div>
          <table class="t"><tr><th>máy bận (phần thời gian)</th><th>50%</th><th>90%</th><th>99%</th></tr>
          <tr><td>thời gian trả lời trung bình $= \frac{1 \text{ ms}}{1 - \text{bận}}$</td><td>2 ms</td><td>10 ms</td><td>$\hl{100}$ ms</td></tr></table>
          <p class="note">Mô hình hàng chờ đơn giản nhất (yêu cầu đến ngẫu nhiên, mỗi yêu cầu cần trung bình 1 ms, một máy): bận 99% thì chậm gấp 100 lần lúc rảnh.</p>
        focus: [1, 1, 1, 2, 2, 3, 3]
        say: "Lỗi thứ nhất, thiết kế theo trung bình. Trung bình 2315 yêu cầu mỗi giây nhưng cao điểm 6944, đủ cho trung bình là thiếu gấp 3 lúc đông nhất. Hãy thiết kế theo cao điểm cộng dư địa, tức chừa thêm sức chịu, vì máy càng gần bận kín thì hàng chờ càng dài. Bảng cho thời gian trả lời trung bình bằng 1 mi li giây chia cho 1 trừ phần thời gian máy bận. Máy bận 50 phần trăm thì mất 2 mi li giây, bận 90 thì 10, bận 99 thì tới 100. Đây là mô hình hàng chờ đơn giản nhất, yêu cầu đến ngẫu nhiên, mỗi yêu cầu cần trung bình 1 mi li giây trên một máy. Lý do là yêu cầu đến ngẫu nhiên nên có lúc dồn cục, mà máy gần bận kín thì không có lúc rảnh để xả hàng chờ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Lẫn byte và bit <b class="red">(sai 8 lần)</b>
          <br><span class="note">Đường truyền 1 gigabit/s chỉ chở khoảng 125 MB/s. Ghi rõ đơn vị ở mỗi bước.</span></div>
        say: "Lỗi thứ hai là nhầm lẫn giữa đơn vị byte và đơn vị bit. Đường truyền 1 ghi-ga-bít mỗi giây chỉ chở khoảng 125 MB mỗi giây, sai 8 lần, nên hãy ghi rõ đơn vị ở mỗi bước."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên nhân bản sao và chỉ mục <b class="red">(thiếu đĩa)</b>
          <br><span class="note">7,3 TB dữ liệu, sao chép 3 bản là $7{,}3 \cdot 3 = 21{,}9$ TB, đã gấp 3 con số thô. Thêm <b>chỉ mục</b> (bảng tra giúp tìm nhanh) và <b>nhật ký</b> (bản ghi mọi thay đổi để phục hồi) thì còn hơn nữa — ước chừng gấp 4 đến 5 (số minh hoạ; đo ở hệ của mình).</span></div>
        say: "Lỗi thứ ba, quên nhân thêm bản sao và chỉ mục. Có 7 phẩy 3 tê-ra-byte dữ liệu, sao chép 3 bản là 21 phẩy 9 tê-ra-byte, đã gấp 3 con số thô. Thêm chỉ mục, tức bảng tra giúp tìm nhanh, và nhật ký, tức bản ghi mọi thay đổi để phục hồi, thì dung lượng còn lớn hơn nữa. Ước chừng gấp 4 đến 5 lần con số thô, đây là số minh hoạ, hãy đo ở hệ của mình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Nhân cao điểm cho số yêu cầu nhưng <b>quên nhân cho băng thông</b> <b class="red">(nghẽn đường truyền)</b></div>
          <table class="t"><tr><th>đại lượng</th><th>trung bình</th><th>cao điểm (gấp 3)</th><th>đường truyền 1000 megabit/s</th></tr>
          <tr><td>yêu cầu/s</td><td>2315</td><td>6944</td><td>—</td></tr>
          <tr><td>băng thông</td><td>926 megabit/s</td><td>$\hl{2778}$ megabit/s</td><td>đủ trung bình, thiếu gần 3 lần lúc cao điểm</td></tr></table>
          <p class="note">Người làm nghề tính <b>mọi</b> đại lượng (máy, băng thông, ghi đĩa) ở cùng một giờ cao điểm, rồi mới so với sức chứa.</p>
        focus: [1, 2, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là đã nhân hệ số cao điểm cho số yêu cầu nhưng quên nhân cho băng thông. Trung bình 926 mê-ga-bít mỗi giây nằm gọn trong đường truyền 1000 mê-ga-bít, nhưng lúc cao điểm gấp 3 thì cần khoảng 2778, gần gấp 3 sức chở của đường truyền. Người làm nghề tính mọi đại lượng, từ số máy, băng thông đến tốc độ ghi đĩa, ở cùng một giờ cao điểm, rồi mới so với sức chứa."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(2e6 * 50 / 86400) == 1157 and round(2e6 * 50 / 86400 * 4) == 4630 and round(2e6 * 100 * 1e3 * 365 / 1e12) == 73"
      - "2e6 * 50 == 1e8 and 2e6 * 100e3 / 1e9 == 200 and 200 * 365 == 73000"
      - "math.ceil(2e6 * 50 / 86400 * 4 / 1000) == 5 and math.ceil(2e6 * 50 / 86400 * 4 / 1000) + 1 == 6 and (6 - 1) * 1000 >= 4630 > 4 * 1000"
    steps:
      - show: |
          <p>Ứng dụng nhắn tin: 2 triệu người dùng mỗi ngày, mỗi người gửi 50 tin, mỗi người tạo 100 KB dữ liệu mới mỗi ngày, cao điểm gấp 4.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Yêu cầu mỗi giây trung bình và cao điểm?</td></tr>
          <tr><td>2</td><td>Lưu trữ mỗi năm (chưa tính bản sao)?</td></tr>
          <tr><td>3</td><td>Mỗi máy chịu 1000 tin/s. Cần mấy máy để qua cao điểm <b>kể cả khi 1 máy hỏng</b>?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm với một ứng dụng nhắn tin có 2 triệu người dùng mỗi ngày. Mỗi người gửi 50 tin, tạo 100 KB dữ liệu mới mỗi ngày, cao điểm gấp 4. Câu một, yêu cầu mỗi giây trung bình và cao điểm là bao nhiêu? Câu hai, lưu trữ mỗi năm, chưa tính bản sao, là bao nhiêu? Câu ba, mỗi máy chịu 1000 tin mỗi giây, cần mấy máy để qua cao điểm kể cả khi 1 máy hỏng? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Tổng tin mỗi ngày $2 \cdot 10^6 \cdot 50 = 10^8$; chia 86 400 → $\frac{2 \cdot 10^6 \cdot 50}{86\,400} \approx \hl{1157}$ tin/s; cao điểm gấp 4 → $\approx \hl{4630}$ tin/s.</p>
        say: "Đáp án câu một, tổng tin mỗi ngày là 2 triệu nhân 50, bằng 100 triệu tin. Chia 86 nghìn 400 được khoảng 1157 tin mỗi giây, nhân 4 thì cao điểm khoảng 4630 tin mỗi giây."
      - show: |
          <p>② Mỗi ngày $2 \cdot 10^6 \cdot 100 \text{ KB} = 200$ GB; nhân 365 → $73\,000$ GB $= \hl{73}$ TB mỗi năm.</p>
        say: "Câu hai, mỗi ngày có 2 triệu nhân 100 KB, bằng 200 GB, nhân 365 thành 73 nghìn GB. Câu hai, 2 triệu nhân 100 KB nhân 365, khoảng 73 tê-ra-byte mỗi năm."
      - show: |
          <table class="t"><tr><th>bước</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>đủ cao điểm</td><td>$\frac{4630}{1000} = 4{,}63$ → làm tròn lên</td><td>5 máy</td></tr>
          <tr><td>chịu 1 máy hỏng</td><td>$5 + 1$; còn lại $5 \cdot 1000 = 5000 \geq 4630$</td><td>$\hl{6}$ máy</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu ba là một quyết định. Cao điểm 4630 chia 1000 được 4 phẩy 63, làm tròn lên thành 5 máy. Muốn chịu được 1 máy hỏng thì thêm 1, thành 6 máy, vì khi 1 máy hỏng, 5 máy còn lại chịu 5000 tin mỗi giây, vẫn đủ cho 4630."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">người dùng → yêu cầu mỗi giây</span><span class="a">→</span>
          <span class="n">nhân hệ số cao điểm</span><span class="a">→</span>
          <span class="n">lưu trữ, băng thông, ghi rõ đơn vị</span><span class="a">→</span>
          <span class="n">nhân bản sao, cộng dư địa</span></div>
        say: "Tổng kết lại, đổi số người dùng thành yêu cầu mỗi giây, nhân hệ số cao điểm, tính lưu trữ và băng thông với đơn vị ghi rõ, rồi nhân bản sao và cộng dư địa."
      - show: |
          <div class="box key"><b>Tư duy:</b> một con số ước lượng sai 2 lần vẫn hữu ích; không có con số nào thì mọi thiết kế chỉ là đoán.</div>
        say: "Điều cần mang theo, một con số ước lượng sai 2 lần vẫn hữu ích, còn không có con số nào thì mọi thiết kế chỉ là đoán."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>phân lớp</b>, mô-đun hoá và ranh giới.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học phân lớp, mô-đun hoá, và ranh giới. Hẹn gặp bạn ở bài tiếp theo."
