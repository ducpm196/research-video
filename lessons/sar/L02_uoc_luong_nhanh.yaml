      '
    focus:
    - 1
    - 1
    - 1
    say: Hình cho thấy ước lượng là một chuỗi phép tính, mỗi mũi tên một phép. Hàng trên, 10 triệu người nhân 20 yêu cầu thành
      200 triệu yêu cầu mỗi ngày, chia 86 nghìn 400 giây thành khoảng 2315 mỗi giây, rồi nhân hệ số cao điểm thành 6944. Hai
      nhánh xuống dưới tách ra từ những ô đã có, một nhánh thành băng thông, một nhánh thành lưu trữ mỗi năm.
- id: example
  kind: example
  title: 10 triệu người dùng mỗi ngày
  checks:
  - round(10e6 * 20 / 86400) == 2315 and round(10e6 * 20 / 86400 * 3) == 6944
  - 10e6 * 2e3 / 1e9 == 20.0 and round(10e6 * 2e3 * 365 / 1e12, 1) == 7.3 and round(10e6 * 20 / 86400 * 50e3 * 8 / 1e6) ==
    926
  - 10e6 * 20 == 2e8 and 20 * 365 == 7300 and round(10e6 * 20 / 86400 * 50e3 / 1e6, 1) == 115.7 and math.ceil(10e6 * 20 /
    86400 * 3 / 1000) == 7
  - round(2e8 / 86400, 1) == 2314.8 and round(2314.8 * 3) == 6944 and 2315 * 3 == 6945 and round(2314.8 * 50e3 / 1e6, 1) ==
    115.7
  steps:
  - show: '<p><b>Bước 1 — tổng yêu cầu mỗi ngày:</b> mỗi người 20 yêu cầu → $10^7 \cdot 20 = 2 \cdot 10^8$, tức 200 triệu
      yêu cầu.</p>

      <p><b>Bước 2 — chia cho số giây:</b> $\frac{2 \cdot 10^8}{86\,400} \approx \hl{2315}$ yêu cầu/s trung bình.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước một, ứng dụng có 10 triệu người dùng mỗi ngày, mỗi người 20 yêu cầu, nên tổng là 10 triệu nhân 20, bằng 200
      triệu yêu cầu mỗi ngày. Bước hai, chia cho 86 nghìn 400 giây, được khoảng 2315 yêu cầu mỗi giây trung bình. Chia cho
      tám mươi sáu nghìn bốn trăm thu gọn hai trăm triệu lượt truy cập mỗi ngày xuống hai nghìn ba trăm mười lăm lượt mỗi
      giây.
  - show: '<p><b>Bước 3 — cao điểm:</b> giả định giờ đông nhất gấp 3 trung bình → $2314{,}8 \cdot 3 \approx \hl{6944}$ yêu
      cầu/s (nhân từ số chưa làm tròn 2314,8; lấy 2315 nhân 3 sẽ ra 6945).</p>

      <p class="note">Hệ số 3 ở đây là giả định cho ví dụ; hệ thống thật thì đo từ số liệu theo giờ.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, cao điểm. Ta giả định giờ đông nhất gấp 3 trung bình, nên cao điểm khoảng 6944 yêu cầu mỗi giây. Ta nhân
      3 từ số chưa làm tròn là 2314 phẩy 8, còn lấy 2315 nhân 3 thì ra 6945. Hệ số 3 ở đây là giả định cho ví dụ, còn hệ thống
      thật thì đo từ số liệu theo giờ. Nhân hệ số cao điểm từ giá trị trung bình chưa làm tròn giúp chặn sai số làm tròn lan
      rộng sang bước chọn số máy chủ.
  - clear: true
    show: '<p><b>Bước 4 — lưu trữ:</b> mỗi người 1 bài 2 KB mỗi ngày → $10^7 \cdot 2 \text{ KB} = 20$ GB mỗi ngày; nhân 365
      → $7300$ GB $\approx \hl{7{,}3}$ TB mỗi năm.</p>

      <p><b>Bước 5 — băng thông:</b> mỗi lần trả về 50 KB → $2314{,}8 \cdot 50 \text{ KB} \approx 115{,}7$ MB/s; nhân 8 →
      $\approx \hl{926}$ megabit/s trung bình.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Bước bốn, lưu trữ. Mỗi người đăng 1 bài 2 KB mỗi ngày thì mỗi ngày có 20 GB, nhân 365 thành 7300 GB. Nếu mỗi người
      đăng 1 bài 2 KB mỗi ngày, lưu trữ khoảng 7 phẩy 3 tê-ra-byte mỗi năm. Bước năm, băng thông. Nếu mỗi lần trả về 50 KB,
      băng thông trung bình khoảng 926 mê-ga-bít mỗi giây. Đó là vì 2314 phẩy 8 nhân 50 KB là khoảng 115 phẩy 7 MB mỗi giây,
      nhân 8 để đổi sang bit. Chú ý cộng dồn sản lượng từng ngày nhân ba trăm sáu mươi lăm cho thấy con số bảy phẩy ba tê-ra-bai
      dữ liệu thô tích lũy mỗi năm.
  - show: '<table class="t"><tr><th>đại lượng</th><th>tính</th><th>kết quả</th></tr>

      <tr><td>trung bình</td><td>$\frac{10\,000\,000 \cdot 20}{86\,400}$</td><td>≈ 2315 yêu cầu/s</td></tr>

      <tr><td>cao điểm (gấp 3)</td><td>$2314{,}8 \cdot 3$</td><td>≈ $\hl{6944}$ yêu cầu/s</td></tr>

      <tr><td>lưu trữ (mỗi người 1 bài 2 KB mỗi ngày)</td><td>$10^7 \cdot 2 \text{ KB} \cdot 365$</td><td>≈ $\hl{7{,}3}$ TB
      mỗi năm</td></tr>

      <tr><td>băng thông (trả về 50 KB)</td><td>$2314{,}8 \cdot 50 \text{ KB} \cdot 8$</td><td>≈ 926 megabit/s trung bình</td></tr></table>

      <p class="note"><b>Bước 6 — số máy:</b> giả sử một máy chủ ứng dụng chịu khoảng 1000 yêu cầu/s (số minh hoạ; máy thật
      phải đo bằng thử tải) thì cần ít nhất 7 máy ở cao điểm, chưa tính dự phòng — “cỡ một chục máy” chứ không phải “vài trăm”.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bảng gom lại bốn con số. Trung bình khoảng 2315 yêu cầu mỗi giây, cao điểm khoảng 6944, lưu trữ khoảng 7 phẩy 3 tê-ra-byte
      mỗi năm, băng thông trung bình khoảng 926 mê-ga-bít mỗi giây. Bước sáu, ta tính số máy chủ, với số minh hoạ là mỗi máy
      chủ ứng dụng chịu khoảng 1000 yêu cầu mỗi giây. Khi đó cần ít nhất 7 máy ở cao điểm, chưa tính dự phòng, tức cỡ một
      chục máy chứ không phải vài trăm. Bảng tổng kết bốn thông số thiết lập chuẩn mực kiểm tra ngân sách phần cứng thực tế
      cho mọi phiên thẩm định kiến trúc.
- id: check
  kind: check
  title: 'Tự kiểm: tính ngược, đổi thứ tự nhân'
  checks:
  - 2315 * 86400 == 200016000 and abs(2315 * 86400 - 2e8) / 2e8 < 0.001
  - 2e3 * 365 == 730e3 and 730e3 * 10e6 / 1e12 == 7.3
  - round(926 / 8, 1) == 115.8 and round(926 / 8 * 1e6 / 50e3) == 2315
  - 7 * 1000 >= 6944 > 6 * 1000
  steps:
  - show: '<table class="t"><tr><th>kết quả</th><th>đường khác</th><th>khớp?</th></tr>

      <tr><td>2315 yêu cầu/s</td><td>nhân ngược: $2315 \cdot 86\,400 \approx 200$ triệu yêu cầu mỗi ngày</td><td>✓</td></tr>

      <tr><td>7,3 TB mỗi năm</td><td>tính theo một người trước: $2 \text{ KB} \cdot 365 = 730$ KB, rồi nhân $10^7$ người</td><td>✓</td></tr>

      <tr><td>926 megabit/s</td><td>chia ngược: $\frac{926}{8} \approx 115{,}8$ MB/s, chia 50 KB → ≈ 2315 lần mỗi giây</td><td>✓</td></tr>

      <tr><td>7 máy</td><td>$7 \cdot 1000 = 7000 \geq 6944$, còn 6 máy chỉ 6000</td><td>✓</td></tr></table>

      '
    introduces:
    - geq
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Kiểm bằng đường khác, đi ngược từng kết quả. Lấy 2315 nhân 86 nghìn 400 thì được khoảng 200 triệu, đúng tổng yêu
      cầu mỗi ngày. Tính lưu trữ theo một người trước, 2 KB nhân 365 là 730 KB mỗi năm, nhân 10 triệu người lại ra 7 phẩy
      3 tê-ra-byte. Lấy 926 chia 8 được khoảng 115 phẩy 8 MB mỗi giây, chia tiếp cho 50 KB lại ra khoảng 2315 lần trả về mỗi
      giây. Cuối cùng, 7 máy chịu 7000, đủ cho 6944, còn 6 máy chỉ chịu 6000, không đủ. Thực hiện phép nhân ngược bốn thông
      số kiểm tra chéo ngăn triệt để mọi lỗi quên nhân hệ số tám bít mỗi bai hay ba trăm sáu lăm ngày.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc, 1 lỗi người đã đi làm
  checks:
  - round(10e6 * 20 / 86400 * 3 * 50e3 * 8 / 1e6) == 2778 and 926 < 1000 < 2778 and round(2778 / 1000, 1) == 2.8
  - '[round(1 / (1 - b), 6) for b in (0.5, 0.9, 0.99)] == [2.0, 10.0, 100.0] and round(7.3 * 3, 1) == 21.9'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Thiết kế theo trung bình <b class="red">(sập giờ cao điểm)</b>

      <br><span class="note">2315 yêu cầu/s trung bình nhưng 6944 lúc cao điểm: đủ cho trung bình là thiếu gấp 3 lúc đông
      nhất. Thiết kế theo cao điểm, cộng <b>dư địa</b> (chừa sức chịu thừa), vì khi máy tiến sát ngưỡng bận kín thì hàng chờ
      dựng đứng nhanh chóng.</span></div>

      <table class="t"><tr><th>máy bận (phần thời gian)</th><th>50%</th><th>90%</th><th>99%</th></tr>

      <tr><td>thời gian trả lời trung bình $= \frac{1 \text{ ms}}{1 - \text{bận}}$</td><td>2 ms</td><td>10 ms</td><td>$\hl{100}$
      ms</td></tr></table>

      <p class="note">Mô hình hàng chờ đơn giản nhất (yêu cầu đến ngẫu nhiên, mỗi yêu cầu cần trung bình 1 ms, một máy): bận
      99% thì chậm gấp 100 lần lúc rảnh.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 3
    say: Lỗi thứ nhất, thiết kế theo trung bình. Trung bình 2315 yêu cầu mỗi giây nhưng cao điểm 6944, đủ cho trung bình là
      thiếu gấp 3 lúc đông nhất. Hãy thiết kế theo cao điểm cộng dư địa, tức chừa thêm sức chịu, vì khi máy tiến sát ngưỡng
      bận kín thì hàng chờ dựng đứng nhanh chóng. Bảng cho thời gian trả lời trung bình bằng 1 mi li giây chia cho 1 trừ phần
      thời gian máy bận. Máy bận 50 phần trăm thì mất 2 mi li giây, bận 90 thì 10, bận 99 thì tới 100. Đây là mô hình hàng
      chờ đơn giản nhất, yêu cầu đến ngẫu nhiên, mỗi yêu cầu cần trung bình 1 mi li giây trên một máy. Lý do là yêu cầu đến
      ngẫu nhiên nên có lúc dồn cục, mà máy gần bận kín thì không có lúc rảnh để xả hàng chờ. Dung lượng chuẩn bị theo cao
      điểm nhân thêm biên an toàn bảo đảm hệ thống không sụp đổ đúng giờ vàng đón lượng khách đông nhất.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 2.</b> Lẫn byte và bit <b class="red">(sai 8 lần)</b>

      <br><span class="note">Đường truyền 1 gigabit/s chỉ chở khoảng 125 MB/s. Ghi rõ đơn vị ở mỗi bước.</span></div>

      '
    say: Lỗi thứ hai là nhầm lẫn giữa đơn vị byte và đơn vị bit. Đường truyền 1 ghi-ga-bít mỗi giây chỉ chở khoảng 125 MB
      mỗi giây, sai 8 lần, nên hãy ghi rõ đơn vị ở mỗi bước. Phân biệt rạch ròi một ghi-ga-bít mỗi giây trên thẻ mạng chỉ
      tải tối đa hơn một trăm mê-ga-bai mỗi giây dữ liệu thực tế.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Quên nhân bản sao và chỉ mục <b class="red">(thiếu đĩa)</b>

      <br><span class="note">7,3 TB dữ liệu, sao chép 3 bản là $7{,}3 \cdot 3 = 21{,}9$ TB, đã gấp 3 con số thô. Thêm <b>chỉ
      mục</b> (bảng tra giúp tìm nhanh) và <b>nhật ký</b> (bản ghi mọi thay đổi để phục hồi) thì còn hơn nữa — ước chừng gấp
      4 đến 5 (số minh hoạ; đo ở hệ của mình).</span></div>

      '
    say: Lỗi thứ ba, quên nhân thêm bản sao và chỉ mục. Có 7 phẩy 3 tê-ra-byte dữ liệu, sao chép 3 bản là 21 phẩy 9 tê-ra-byte,
      đã gấp 3 con số thô. Thêm chỉ mục, tức bảng tra giúp tìm nhanh, và nhật ký, tức bản ghi mọi thay đổi để phục hồi, thì
      dung lượng còn lớn hơn nữa. Ước chừng gấp 4 đến 5 lần con số thô, đây là số minh hoạ, hãy đo ở hệ của mình. Nhân thêm
      bản sao, chỉ mục và nhật ký phục hồi nâng tổng dung lượng đĩa yêu cầu lên khoảng bốn tới năm lần dữ liệu thô.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Nhân cao điểm cho số yêu cầu nhưng <b>quên nhân cho băng
      thông</b> <b class="red">(nghẽn đường truyền)</b></div>

      <table class="t"><tr><th>đại lượng</th><th>trung bình</th><th>cao điểm (gấp 3)</th><th>đường truyền 1000 megabit/s</th></tr>

      <tr><td>yêu cầu/s</td><td>2315</td><td>6944</td><td>—</td></tr>

      <tr><td>băng thông</td><td>926 megabit/s</td><td>$\hl{2778}$ megabit/s</td><td>đủ trung bình, thiếu gần 3 lần lúc cao
      điểm</td></tr></table>

      <p class="note">Người làm nghề tính <b>mọi</b> đại lượng (máy, băng thông, ghi đĩa) ở cùng một giờ cao điểm, rồi mới
      so với sức chứa.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Lỗi thứ tư hay gặp ở người đã đi làm, là đã nhân hệ số cao điểm cho số yêu cầu nhưng quên nhân cho băng thông. Trung
      bình 926 mê-ga-bít mỗi giây nằm gọn trong đường truyền 1000 mê-ga-bít, nhưng lúc cao điểm gấp 3 thì cần khoảng 2778,
      gần gấp 3 sức chở của đường truyền. Người làm nghề tính mọi đại lượng, từ số máy, băng thông đến tốc độ ghi đĩa, ở cùng
      một giờ cao điểm, rồi mới so với sức chứa.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(2e6 * 50 / 86400) == 1157 and round(2e6 * 50 / 86400 * 4) == 4630 and round(2e6 * 100 * 1e3 * 365 / 1e12) == 73
  - 2e6 * 50 == 1e8 and 2e6 * 100e3 / 1e9 == 200 and 200 * 365 == 73000
  - math.ceil(2e6 * 50 / 86400 * 4 / 1000) == 5 and math.ceil(2e6 * 50 / 86400 * 4 / 1000) + 1 == 6 and (6 - 1) * 1000 >=
    4630 > 4 * 1000
  steps:
  - show: '<p>Ứng dụng nhắn tin: 2 triệu người dùng mỗi ngày, mỗi người gửi 50 tin, mỗi người tạo 100 KB dữ liệu mới mỗi ngày,
      cao điểm gấp 4.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Yêu cầu mỗi giây trung bình và cao điểm?</td></tr>

      <tr><td>2</td><td>Lưu trữ mỗi năm (chưa tính bản sao)?</td></tr>

      <tr><td>3</td><td>Mỗi máy chịu 1000 tin/s. Cần mấy máy để qua cao điểm <b>kể cả khi 1 máy hỏng</b>?</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    say: Bây giờ đến lượt bạn tự làm với một ứng dụng nhắn tin có 2 triệu người dùng mỗi ngày. Mỗi người gửi 50 tin, tạo 100
      KB dữ liệu mới mỗi ngày, cao điểm gấp 4. Câu một, yêu cầu mỗi giây trung bình và cao điểm là bao nhiêu? Câu hai, lưu
      trữ mỗi năm, chưa tính bản sao, là bao nhiêu? Câu ba, mỗi máy chịu 1000 tin mỗi giây, cần mấy máy để qua cao điểm kể
      cả khi 1 máy hỏng? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Tổng tin mỗi ngày $2 \cdot 10^6 \cdot 50 = 10^8$; chia 86 400 → $\frac{2 \cdot 10^6 \cdot 50}{86\,400} \approx
      \hl{1157}$ tin/s; cao điểm gấp 4 → $\approx \hl{4630}$ tin/s.</p>

      '
    say: Đáp án câu một, tổng tin mỗi ngày là 2 triệu nhân 50, bằng 100 triệu tin. Chia 86 nghìn 400 được khoảng 1157 tin
      mỗi giây, nhân 4 thì cao điểm khoảng 4630 tin mỗi giây. Quy đổi nhanh một trăm triệu tin chia gần chín mươi nghìn giây
      giúp tự tin chốt quy mô nghìn lượt mỗi giây không cần máy tính.
  - show: '<p>② Mỗi ngày $2 \cdot 10^6 \cdot 100 \text{ KB} = 200$ GB; nhân 365 → $73\,000$ GB $= \hl{73}$ TB mỗi năm.</p>

      '
    say: Câu hai, mỗi ngày có 2 triệu nhân 100 KB, bằng 200 GB, nhân 365 thành 73 nghìn GB. Câu hai, 2 triệu nhân 100 KB nhân
      365, khoảng 73 tê-ra-byte mỗi năm.
  - show: '<table class="t"><tr><th>bước</th><th>tính</th><th>kết quả</th></tr>

      <tr><td>đủ cao điểm</td><td>$\frac{4630}{1000} = 4{,}63$ → làm tròn lên</td><td>5 máy</td></tr>

      <tr><td>chịu 1 máy hỏng</td><td>$5 + 1$; còn lại $5 \cdot 1000 = 5000 \geq 4630$</td><td>$\hl{6}$ máy</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Câu ba là một quyết định. Cao điểm 4630 chia 1000 được 4 phẩy 63, làm tròn lên thành 5 máy. Muốn chịu được 1 máy
      hỏng thì thêm 1, thành 6 máy, vì khi 1 máy hỏng, 5 máy còn lại chịu 5000 tin mỗi giây, vẫn đủ cho 4630.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SAR/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành SAR:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính
      QPS trung bình, QPS cao điểm làm tròn nguyên và băng thông MB/s (không nhân 8)</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>dau=4000000
      req_day=30 req_b=1500 peak_x=3</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh SAR L02 duong_dan/bai_cua_ban.py</code>
      (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 2 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Thực hành ước lượng lưu lượng trung bình, lưu lượng đỉnh
      cao điểm và băng thông yêu cầu từ lượng người dùng hoạt động hằng ngày. Bảo đảm xuất đủ ba giá trị đúng đơn vị giây
      và mê-ga-bai mỗi giây.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai SAR:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tính QPS trung bình)</b></td><td>Nhân người dùng ngày với lượt mỗi người rồi chia số giây trong ngày</td></tr><tr><td><b>Bước
      2 (QPS giờ cao điểm)</b></td><td>Nhân QPS trung bình với hệ số cao điểm cho trước</td></tr><tr><td><b>Bước 3 (đổi MB/giây)</b></td><td>Nhân
      QPS đỉnh với kích thước gói byte rồi chia một triệu</td></tr></table>
    say: Gợi ý cài đặt bài số 2 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 3 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>avg_qps=1389</div><div>peak_qps=4167</div><div>peak_mb_per_s=6.25</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">người dùng → yêu cầu mỗi giây</span><span class="a">→</span>

      <span class="n">nhân hệ số cao điểm</span><span class="a">→</span>

      <span class="n">lưu trữ, băng thông, ghi rõ đơn vị</span><span class="a">→</span>

      <span class="n">nhân bản sao, cộng dư địa</span></div>

      '
    say: Tổng kết lại, đổi số người dùng thành yêu cầu mỗi giây, nhân hệ số cao điểm, tính lưu trữ và băng thông với đơn vị
      ghi rõ, rồi nhân bản sao và cộng dư địa.
  - show: '<div class="box key"><b>Tư duy:</b> một con số ước lượng sai 2 lần vẫn hữu ích; không có con số nào thì mọi thiết
      kế chỉ là đoán.</div>

      <p class="note"><b>So sánh hai quy mô:</b> 10 triệu người dùng tạo trung bình 2 315 yêu cầu/s (cụm 7 máy chịu 7 000
      yêu cầu/s; ở cao điểm gấp 3 lên 6 944 yêu cầu/s tải chạm 99,2% bận, khiến độ trễ vọt gấp 50 lần lên 100 ms.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Điều cần mang theo, một con số ước lượng sai 2 lần vẫn hữu ích, còn không có con số nào thì mọi thiết kế chỉ là đoán.
      Ở hai mức quy mô, 10 triệu người dùng tạo trung bình 2 315 lượt nhưng cao điểm gấp ba lên 6 944 mỗi giây. Trên cụm chịu
      bảy nghìn lượt mỗi giây, tải cao điểm chạm 99 phẩy 2 phần trăm khiến độ trễ tăng vọt.
  - clear: true
    show: '<p class="note">Bài sau (bài 3): <b>phân lớp</b>, mô-đun hoá và ranh giới.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 3, ta học phân lớp, mô-đun hoá, và ranh giới. Hẹn gặp bạn ở bài tiếp theo.
