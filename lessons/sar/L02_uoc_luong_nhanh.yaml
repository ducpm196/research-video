scenes:
- id: hook
  kind: hook
  title: Cần mấy máy chủ?
  steps:
  - show: '<p>Sếp hỏi: “ứng dụng có 10 triệu người dùng mỗi ngày, cần mấy máy chủ, mấy ổ đĩa?” Bạn không cần câu trả lời chính
      xác tới từng máy — nhưng cần biết là 3 máy hay 300 máy, trước khi vẽ bất kỳ sơ đồ nào.</p>

      <div class="box key">Hôm nay: <b>ước lượng nhanh</b> — vài phép nhân trên mặt sau phong bì, đúng tới bậc độ lớn.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, sếp hỏi ứng dụng có 10 triệu người dùng mỗi ngày thì cần mấy máy chủ, mấy ổ đĩa. Bạn không cần câu trả
      lời chính xác tới từng máy, nhưng cần biết là 3 máy hay 300 máy, trước khi vẽ bất kỳ sơ đồ nào. Hôm nay ta học ước lượng
      nhanh, vài phép nhân trên mặt sau phong bì, đúng tới bậc độ lớn. Ước lượng nhanh bậc độ lớn giúp loại bỏ các ý tưởng
      bất khả thi ngay trên bảng trắng chỉ trong vài phút trước khi viết dòng mã đầu tiên.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: giây trong ngày, tiền tố, byte và bit'
  checks:
  - 24 * 60 * 60 == 86400 and 864000 / 86400 == 10
  - 2e3 * 1e6 == 2e9 and 1e9 / 8 / 1e6 == 125
  steps:
  - show: '<p>Một ngày có $24 \cdot 60 \cdot 60 = \hl{86\,400}$ giây. Nếu 864 000 yêu cầu rải đều trong ngày thì mỗi giây
      có $\frac{864\,000}{86\,400} = 10$ yêu cầu.</p>

      '
    say: Trước hết, ôn ba điều sẽ dùng. Một ngày có 24 nhân 60 nhân 60, bằng 86 nghìn 400 giây. Nếu 864 nghìn yêu cầu rải
      đều trong ngày thì mỗi giây có 864 nghìn chia 86 nghìn 400, bằng 10 yêu cầu. Nhớ chuẩn xác số tám mươi sáu nghìn bốn
      trăm giây giúp chuyển đổi tức thời giữa lượng việc trong ngày và lưu lượng mỗi giây.
  - show: '<table class="t"><tr><th>tiền tố</th><th>bằng</th><th>ví dụ</th></tr>

      <tr><td>KB</td><td>$10^3$ byte</td><td rowspan="3">1 triệu bài, mỗi bài 2 KB: $2 \cdot 10^3 \cdot 10^6 = 2 \cdot 10^9$
      byte = 2 GB</td></tr>

      <tr><td>GB</td><td>$10^9$ byte</td></tr>

      <tr><td>TB</td><td>$10^{12}$ byte</td></tr></table>

      '
    introduces:
    - cdot
    - power
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Thứ hai, tiền tố đơn vị. KB là một nghìn byte, GB là một tỉ byte, tê-ra-byte là một nghìn tỉ byte. Ví dụ 1 triệu
      bài, mỗi bài 2 KB, là 2 nhân 10 mũ 3 nhân 10 mũ 6, bằng 2 nhân 10 mũ 9 byte, tức 2 GB. Cộng số mũ khi nhân là cách nhanh
      nhất để khỏi đếm sai số không. Nắm chắc bội số nghìn từ ki-lô đến mê-ga, ghi-ga và tê-ra giúp đọc đúng dung lượng ổ đĩa
      hàng năm chỉ qua một vài phép cộng số mũ.
  - show: '<p><b>Bit</b> là một chữ số nhị phân, 0 hoặc 1; <b>1 byte = 8 bit</b>, đủ ghi một chữ cái không dấu. Dung lượng
      lưu trữ tính bằng <b>byte</b>, còn tốc độ đường truyền tính bằng <b>bit</b> mỗi giây. Đường truyền 1 gigabit/s chở $\frac{10^9}{8}
      = 125 \cdot 10^6$ byte, tức 125 MB mỗi giây.</p>

      '
    say: Thứ ba, ta cần phân biệt hai đơn vị của dữ liệu. Bit là một chữ số nhị phân, 0 hoặc 1, còn 1 byte gồm 8 bit, đủ ghi
      một chữ cái không dấu. Dung lượng lưu trữ tính bằng byte, còn tốc độ đường truyền tính bằng bit mỗi giây. Đường truyền
      một tỉ bit mỗi giây chỉ chở được một tỉ chia 8, tức 125 triệu byte mỗi giây. Luôn gắn rõ chữ bít thường cho tốc độ dây
      dẫn và bai viết hoa cho ổ đĩa lưu trữ để tránh sai lệch tám lần nghiêm trọng.
- id: sym
  kind: symbol
  title: 'Giải mã: ba câu hỏi ước lượng'
  steps:
  - show: '<table class="t"><tr><th>đại lượng</th><th>công thức</th></tr>

      <tr><td>yêu cầu mỗi giây (trung bình)</td><td>$\frac{\text{người dùng mỗi ngày} \cdot \text{yêu cầu mỗi người}}{86\,400}$</td></tr>

      <tr><td>cao điểm</td><td>trung bình $\cdot$ hệ số cao điểm (đo từ dữ liệu theo giờ)</td></tr>

      <tr><td>lưu trữ mỗi năm</td><td>bản ghi mới mỗi ngày $\cdot$ kích thước $\cdot$ 365</td></tr>

      <tr><td>băng thông</td><td>yêu cầu mỗi giây $\cdot$ kích thước trả về $\cdot$ 8 (đổi byte sang bit)</td></tr></table>

      <p class="note"><b>Đơn vị lưu lượng:</b> lượng người dùng hoạt động mỗi ngày là <b>DAU</b> (Daily Active Users), và
      số truy vấn phục vụ mỗi giây là <b>QPS</b> (Queries Per Second).</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    say: Bảng cho bốn công thức ước lượng. Yêu cầu mỗi giây trung bình bằng số người dùng mỗi ngày nhân số yêu cầu mỗi người,
      chia 86 nghìn 400 giây. Cao điểm bằng trung bình nhân hệ số cao điểm, đo từ dữ liệu theo giờ. Lưu trữ mỗi năm bằng số
      bản ghi mới mỗi ngày nhân kích thước, nhân 365. Băng thông bằng yêu cầu mỗi giây nhân kích thước trả về, nhân 8 để đổi
      byte sang bit. Hai chỉ số sức tải thường tính trước khi chọn máy là số người dùng hằng ngày và lượng truy vấn trên giây.
      Bốn phép tính nhân chia cơ bản phơi bày toàn bộ nhu cầu máy tính, dung lượng lưu trữ và băng thông đường truyền cho
      bất kỳ ứng dụng nào.
