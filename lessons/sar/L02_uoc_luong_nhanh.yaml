assumes: [arith, cdot, frac, approx]
# Quy ước: một ngày = 86 400 giây; KB = 10^3 byte, GB = 10^9, TB = 10^12; băng thông tính bằng megabit/giây (1 byte = 8 bit).
#   Hệ số cao điểm (gấp 3) là GIẢ ĐỊNH cho ví dụ — thật thì đo từ dữ liệu theo giờ. Sức chịu 1000 yêu cầu/s mỗi máy cũng là SỐ MINH HOẠ.
objectives:
  - "Đổi số người dùng thành yêu cầu mỗi giây"
  - "Ước lượng dung lượng lưu trữ và băng thông"
  - "Thiết kế theo cao điểm, không theo trung bình"
