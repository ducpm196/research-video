id: L00
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 0 — Thuộc tính chất lượng và đánh đổi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L00; audit/sar/verify_sar.py L00; L. Bass, P. Clements, R. Kazman, Software Architecture in Practice, 4th ed. (2021), chương 3–4 (kịch bản thuộc tính chất lượng); ISO/IEC 25010:2023 (mô hình chất lượng sản phẩm); SWF bài 0 (hợp đồng)"
assumes: [arith]
# Quy ước: alg.scenario_latencies() = độ trễ (ms) của 1000 yêu cầu tìm kiếm giả lập (hạt giống 3): phần lớn quanh 80 ms, khoảng 6% chạm ổ đĩa chậm.
#   Phân vị theo hạng gần nhất (alg.percentile_nr). Kịch bản thuộc tính: nguồn kích thích, kích thích, môi trường, phản hồi, thước đo.
objectives:
  - "Liệt kê thuộc tính chất lượng: hiệu năng, sẵn sàng, an toàn, dễ sửa, chi phí"
  - "Viết kịch bản thuộc tính đo được"
  - "Hiểu mọi kiến trúc là một bộ đánh đổi"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Hệ thống phải nhanh”"
    steps:
      - show: |
          <p>Bản yêu cầu ghi: “hệ thống phải nhanh, ổn định, an toàn, dễ mở rộng”. Ai cũng đồng ý. Ba tháng sau, nhóm kiểm thử nói “đủ nhanh”, khách hàng nói “chậm”. Không ai sai — vì “nhanh” chưa bao giờ được định nghĩa.</p>
          <div class="box key">Hôm nay: <b>thuộc tính chất lượng</b> — biến “nhanh, ổn định” thành con số kiểm được, và thấy chúng kéo nhau như thế nào.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, bản yêu cầu ghi hệ thống phải nhanh, ổn định, an toàn, dễ mở rộng, và ai cũng đồng ý. Ba tháng sau, nhóm kiểm thử nói đủ nhanh, khách hàng nói chậm. Không ai sai cả. Đó là vì chữ nhanh chưa bao giờ được định nghĩa. Hôm nay ta học thuộc tính chất lượng, biến nhanh và ổn định thành con số kiểm được, và thấy chúng kéo nhau như thế nào."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trung bình, phần trăm và phân vị"
    checks:
      - "round(sum([82.4, 111.3, 432.9, 73.5, 88.1, 162.0, 44.7, 85.3, 100.6, 57.6]) / 10, 1) == 123.8 and alg.scenario_latencies()[:10] == [82.4, 111.3, 432.9, 73.5, 88.1, 162.0, 44.7, 85.3, 100.6, 57.6]"
      - "alg.percentile_nr([82.4, 111.3, 432.9, 73.5, 88.1, 162.0, 44.7, 85.3, 100.6, 57.6], 0.9) == 162.0 and sum(x < 163 for x in alg.scenario_latencies()[:10]) == 9"
      - "200 / 1000 == 0.2 and 954 / 1000 == 0.954"
    steps:
      - show: |
          <p>Mười yêu cầu đầu tiên đo được (mi li giây, ms; 1000 ms = 1 giây):</p>
          <table class="t"><tr><td>82,4</td><td>111,3</td><td>432,9</td><td>73,5</td><td>88,1</td><td>162,0</td><td>44,7</td><td>85,3</td><td>100,6</td><td>57,6</td></tr></table>
          <p><b>Trung bình</b> = tổng chia 10 ≈ $\hl{123{,}8}$ ms — cao hơn 9 trong 10 số, vì một mình 432,9 kéo lên.</p>
        focus: [1, 2, 3]
        say: "Trước hết, ôn ba điều sẽ dùng. Đây là mười yêu cầu đầu tiên đo được, tính bằng mi li giây, một nghìn mi li giây là một giây. Trung bình bằng tổng chia 10, khoảng 123 phẩy 8 mi li giây, cao hơn 9 trong 10 số, vì một mình số 432 phẩy 9 kéo trung bình lên."
      - show: |
          <p><b>Phân vị $p$</b> (theo hạng gần nhất): sắp các số từ nhỏ đến lớn, lấy số ở vị trí $p \cdot n$ (làm tròn lên). Với 10 số, phân vị 90 là số thứ $0{,}9 \cdot 10 = 9$:</p>
          <table class="t"><tr><td>44,7</td><td>57,6</td><td>73,5</td><td>82,4</td><td>85,3</td><td>88,1</td><td>100,6</td><td>111,3</td><td>$\hl{162{,}0}$</td><td>432,9</td></tr></table>
          <p>Nghĩa là 90% số đo không vượt 162,0 ms. <b>Phần trăm</b>: 954 trong 1000 là $\frac{954}{1000} = 95{,}4\%$.</p>
        introduces: [cdot]
        focus: [1, 1, 2, 3, 3]
        say: "Thứ hai, phân vị p theo hạng gần nhất. Ta sắp các số từ nhỏ đến lớn, rồi lấy số ở vị trí p nhân n, làm tròn lên. Với 10 số này, phân vị 90 là số thứ 0 phẩy 9 nhân 10, tức số thứ 9, bằng 162 mi li giây. Nghĩa là 90 phần trăm số đo không vượt quá 162 mi li giây. Thứ ba, phần trăm, 954 trong 1000 là 954 chia 1000, bằng 95 phẩy 4 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: thuộc tính chất lượng, kịch bản"
    steps:
      - show: |
          <table class="t"><tr><th>thuộc tính</th><th>câu hỏi</th></tr>
          <tr><td>hiệu năng</td><td>trả lời nhanh đến đâu, ở tải bao nhiêu?</td></tr>
          <tr><td>sẵn sàng</td><td>chạy được bao nhiêu phần trăm thời gian?</td></tr>
          <tr><td>an toàn</td><td>ai làm được gì, khi bị tấn công thì sao?</td></tr>
          <tr><td>dễ sửa</td><td>đổi một tính năng mất bao lâu, chạm bao nhiêu chỗ?</td></tr>
          <tr><td>chi phí</td><td>tốn bao nhiêu mỗi tháng ở tải dự kiến?</td></tr></table>
          <p><b>Kịch bản thuộc tính</b>: <i>nguồn</i> (ai) — <i>kích thích</i> (làm gì) — <i>môi trường</i> (lúc nào) — <i>phản hồi</i> — <i>thước đo</i> (con số).</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2]
        say: "Bảng liệt kê năm thuộc tính chất lượng cùng câu hỏi của mỗi thuộc tính. Hiệu năng hỏi trả lời nhanh đến đâu, ở tải bao nhiêu. Sẵn sàng hỏi chạy được bao nhiêu phần trăm thời gian. An toàn hỏi ai làm được gì, và khi bị tấn công thì sao. Dễ sửa hỏi đổi một tính năng mất bao lâu, chạm bao nhiêu chỗ. Chi phí hỏi tốn bao nhiêu mỗi tháng ở tải dự kiến. Một kịch bản thuộc tính gồm nguồn là ai, kích thích là làm gì, môi trường là lúc nào, phản hồi, và thước đo là một con số."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Xếp hàng 1000 yêu cầu theo độ trễ"
    checks:
      - "sorted(alg.scenario_latencies())[949] == 147.7 and sorted(alg.scenario_latencies())[989] == 399.4 and round(sum(alg.scenario_latencies()) / 1000, 1) == 93.0"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g font-size="21" fill="#1f2937"><line x1="120" y1="290" x2="1330" y2="290" stroke="#6b7280" stroke-width="2"/><line x1="120" y1="40" x2="120" y2="290" stroke="#6b7280" stroke-width="2"/><text x="110" y="296" text-anchor="end">0</text><text x="110" y="46" text-anchor="end">500</text><text x="110" y="196" text-anchor="end">200</text><line x1="120" y1="190" x2="1330" y2="190" stroke="#eb6834" stroke-width="2" stroke-dasharray="10 8"/><text x="140" y="180" fill="#eb6834">mốc 200 ms</text><line x1="120" y1="244" x2="1330" y2="244" stroke="#059669" stroke-width="2" stroke-dasharray="4 6"/><text x="140" y="236" fill="#059669">trung bình 93,0 ms</text><polyline points="121,286 133,279 145,274 157,272 169,271 181,270 193,269 205,268 217,266 229,266 241,265 253,264 265,263 277,263 289,263 301,262 313,262 325,261 337,261 349,260 361,260 373,260 385,259 397,259 409,258 421,258 433,257 445,257 457,256 469,256 481,256 493,255 505,255 517,254 529,254 541,254 553,253 565,253 577,253 589,252 601,252 613,252 625,252 637,251 649,251 661,251 673,250 685,250 697,250 709,249 721,249 733,249 745,248 757,248 769,248 781,247 793,247 805,247 817,246 829,246 841,246 853,245 865,245 877,245 889,245 901,244 913,244 925,244 937,243 949,242 961,242 973,242 985,241 997,241 1009,240 1021,240 1033,240 1045,239 1057,238 1069,238 1081,237 1093,237 1105,236 1117,235 1129,234 1141,233 1153,232 1165,231 1177,230 1189,229 1201,228 1213,228 1225,226 1237,224 1249,220 1250,220 1252,219 1253,218 1254,218 1255,218 1256,218 1258,218 1259,217 1260,216 1261,216 1262,215 1264,214 1265,209 1266,180 1267,173 1268,165 1270,165 1271,164 1272,161 1273,159 1274,159 1276,158 1277,157 1278,155 1279,152 1280,150 1282,149 1283,141 1284,141 1285,139 1286,137 1288,136 1289,129 1290,125 1291,122 1292,115 1294,113 1295,113 1296,111 1297,110 1298,109 1300,107 1301,107 1302,99 1303,98 1304,96 1306,95 1307,95 1308,90 1309,88 1310,86 1312,74 1313,72 1314,64 1315,64 1316,60 1318,58 1319,55 1320,42" fill="none" stroke="#2a78d6" stroke-width="3"/><circle cx="1260" cy="216" r="7" fill="#2a78d6"/><line x1="1252" y1="210" x2="1185" y2="160" stroke="#2a78d6" stroke-width="2"/><text x="1180" y="155" text-anchor="end" fill="#2a78d6" font-weight="bold">vị trí 950: 147,7 ms</text><circle cx="1308" cy="90" r="7" fill="#b91c1c"/><line x1="1300" y1="88" x2="1185" y2="88" stroke="#b91c1c" stroke-width="2"/><text x="1180" y="95" text-anchor="end" fill="#b91c1c" font-weight="bold">vị trí 990: 399,4 ms</text><text x="725" y="325" text-anchor="middle">1000 yêu cầu xếp từ nhanh đến chậm</text><text x="1345" y="296">vị trí</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình xếp 1000 yêu cầu đo được thành một hàng, từ nhanh nhất bên trái đến chậm nhất bên phải, chiều cao là độ trễ. Phần lớn hàng nằm thấp và bằng phẳng, chỉ vài chục yêu cầu cuối vọt lên rất cao. Phân vị 95 chỉ là đứng ở vị trí 950 rồi đọc độ cao, được 147 phẩy 7 mi li giây, còn vị trí 990 đã lên 399 phẩy 4. Đường trung bình 93 mi li giây nằm sát đáy, nên nó không cho thấy cái đuôi vọt lên ấy."

  - id: example
    kind: example
    title: "Kiểm một kịch bản hiệu năng"
    checks:
      - "alg.percentile_nr(alg.scenario_latencies(), 0.95) == 147.7 and alg.percentile_nr(alg.scenario_latencies(), 0.99) == 399.4"
      - "round(sum(alg.scenario_latencies()) / 1000, 1) == 93.0"
      - "0.95 * 1000 == 950 and round(0.99 * 1000) == 990 and 147.7 < 200 < 399.4"
    steps:
      - show: |
          <div class="box key">“Khi 1000 người dùng tìm kiếm mỗi giây, trong giờ cao điểm, <b>95%</b> yêu cầu trả kết quả <b>dưới 200 ms</b>.”</div>
          <table class="t"><tr><th>nguồn</th><th>kích thích</th><th>môi trường</th><th>phản hồi</th><th>thước đo</th></tr>
          <tr><td>người dùng</td><td>tìm kiếm, 1000 lần/s</td><td>giờ cao điểm</td><td>trả kết quả</td><td>95% dưới 200 ms</td></tr></table>
        focus: [1, 1, 2, 2, 2]
        say: "Bước một, viết kịch bản. Khi 1000 người dùng tìm kiếm mỗi giây trong giờ cao điểm, 95 phần trăm yêu cầu trả kết quả dưới 200 mi li giây. Tách ra đủ năm phần. Nguồn là người dùng, kích thích là tìm kiếm 1000 lần mỗi giây, môi trường là giờ cao điểm. Phản hồi là trả kết quả, và thước đo là 95 phần trăm dưới 200 mi li giây."
      - show: |
          <p><b>Bước 2 — đo và sắp:</b> đo 1000 yêu cầu ở đúng tải đó, sắp từ nhanh đến chậm. Phân vị 95 là số ở vị trí $0{,}95 \cdot 1000 = 950$ → $\hl{147{,}7}$ ms.</p>
          <p><b>Bước 3 — so với thước đo:</b> 147,7 ms dưới 200 ms → kịch bản <b class="green">đạt</b>.</p>
        focus: [1, 1, 2]
        say: "Bước hai, ta đo 1000 yêu cầu ở đúng tải đó và sắp từ nhanh đến chậm. Phân vị 95 là số ở vị trí 0 phẩy 95 nhân 1000, tức vị trí 950, bằng 147 phẩy 7 mi li giây. Bước ba, so với thước đo, 147 phẩy 7 dưới 200 nên kịch bản đạt."
      - clear: true
        show: |
          <p><b>Bước 4 — nếu đòi 99%:</b> phân vị 99 ở vị trí $0{,}99 \cdot 1000 = 990$ → 399,4 ms, vượt 200 ms → <b class="red">trượt</b>.</p>
          <table class="t"><tr><th>trung bình</th><th>phân vị 95</th><th>phân vị 99</th></tr>
          <tr><td>93,0 ms</td><td>$\hl{147{,}7}$ ms</td><td>399,4 ms</td></tr></table>
        focus: [1, 2, 2]
        say: "Bước bốn, nếu yêu cầu là 99 phần trăm thì sao. Phân vị 99 ở vị trí 990, bằng 399 phẩy 4 mi li giây, vượt 200 nên kịch bản trượt. Bảng gom ba con số, trung bình 93 mi li giây, phân vị 95 là 147 phẩy 7, phân vị 99 là 399 phẩy 4."
      - show: |
          <p><b>Bước 5 — đọc trung bình:</b> 93,0 ms thấp hơn cả phân vị 95 — nó không nói gì về phần đuôi chậm.</p>
          <div class="box key">Con số đo cho ta biết phải làm gì tiếp, còn chữ “nhanh” thì không.</div>
        focus: [1, 1, 2]
        say: "Bước năm, đọc con số trung bình. Trung bình 93 mi li giây còn thấp hơn cả phân vị 95, nên nó không nói gì về phần đuôi chậm. Con số đo cho ta biết phải làm gì tiếp, còn chữ nhanh thì không."

  - id: check
    kind: check
    title: "Tự kiểm: đếm thẳng thay vì tìm phân vị"
    checks:
      - "sum(x < 200 for x in alg.scenario_latencies()) == 954 and 954 >= 950"
      - "sum(x <= 147.7 for x in alg.scenario_latencies()) == 950 and sum(x > 399.4 for x in alg.scenario_latencies()) == 10 and 1000 - 990 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>đếm thẳng trong 1000 số đo</th><th>khớp?</th></tr>
          <tr><td>đạt “95% dưới 200 ms”?</td><td>954 yêu cầu dưới 200 ms, cần ít nhất 950</td><td>đạt ✓</td></tr>
          <tr><td>phân vị 95 là 147,7?</td><td>đúng 950 yêu cầu không vượt 147,7 ms</td><td>✓</td></tr>
          <tr><td>phân vị 99 là 399,4?</td><td>đúng 10 yêu cầu vượt 399,4 ms, tức 1%</td><td>✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không tìm phân vị mà đếm thẳng trong 1000 số đo. Có 954 yêu cầu dưới 200 mi li giây, nhiều hơn mức cần là 950, nên kịch bản đạt. Có đúng 950 yêu cầu không vượt 147 phẩy 7, khớp với phân vị 95. Có đúng 10 yêu cầu vượt 399 phẩy 4, tức 1 phần trăm, khớp với phân vị 99."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[round(0.954 ** n * 100, 1) for n in (1, 2, 5, 10)] == [95.4, 91.0, 79.0, 62.4]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tìm “kiến trúc tốt nhất” <b class="red">(không tồn tại)</b>
          <br><span class="note">Thêm bản sao tăng sẵn sàng nhưng tăng chi phí và làm nhất quán khó hơn; thêm lớp mã hoá tăng an toàn nhưng thêm độ trễ. Chỉ có kiến trúc hợp với <b>thứ tự ưu tiên</b> của bài toán này.</span></div>
        say: "Lỗi thứ nhất, đi tìm kiến trúc tốt nhất. Thêm bản sao tăng sẵn sàng nhưng tăng chi phí và làm nhất quán khó hơn, thêm lớp mã hoá tăng an toàn nhưng thêm độ trễ. Chỉ có kiến trúc hợp với thứ tự ưu tiên của bài toán này."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Viết yêu cầu bằng tính từ <b class="red">(không kiểm được)</b>
          <br><span class="note">“Nhanh”, “ổn định”, “dễ mở rộng” không trượt được kiểm thử nào. Mỗi thuộc tính quan trọng cần ít nhất một kịch bản có <b>thước đo</b>.</span></div>
        say: "Lỗi thứ hai, viết yêu cầu bằng tính từ. Nhanh, ổn định, dễ mở rộng không làm trượt được kiểm thử nào, nên mỗi thuộc tính quan trọng cần ít nhất một kịch bản có thước đo."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đo bằng trung bình <b class="red">(che đuôi)</b>
          <br><span class="note">Trung bình 93 ms trông rất tốt trong khi 1% yêu cầu mất gần 400 ms. Kịch bản hiệu năng nên viết theo phân vị.</span></div>
        say: "Lỗi thứ ba, đo bằng trung bình. Trung bình 93 mi li giây trông rất tốt trong khi 1 phần trăm yêu cầu mất gần 400 mi li giây, nên kịch bản hiệu năng nên viết theo phân vị."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Mỗi dịch vụ đạt kịch bản riêng, nhưng một trang gọi <b>nhiều dịch vụ song song</b> và chờ cái chậm nhất <b class="red">(trang trượt)</b></div>
          <table class="t"><tr><th>số dịch vụ trang phải chờ</th><th>1</th><th>2</th><th>5</th><th>10</th></tr>
          <tr><td>trang xong dưới 200 ms (mỗi dịch vụ 95,4%, độc lập)</td><td>95,4%</td><td>91,0%</td><td>$\hl{79{,}0\%}$</td><td>62,4%</td></tr></table>
          <p class="note">Người làm nghề viết kịch bản cho <b>thứ người dùng thấy</b> (cả trang), rồi chia ngân sách thời gian xuống từng dịch vụ.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm. Mỗi dịch vụ đều đạt kịch bản riêng, nhưng một trang gọi nhiều dịch vụ song song và phải chờ dịch vụ chậm nhất. Giả sử mỗi dịch vụ có 95 phẩy 4 phần trăm yêu cầu dưới 200 mi li giây, và các dịch vụ độc lập với nhau. Khi đó trang chờ 5 dịch vụ chỉ xong dưới 200 mi li giây trong 79 phần trăm số lần, chờ 10 dịch vụ chỉ còn 62 phẩy 4 phần trăm. Người làm nghề viết kịch bản cho thứ người dùng thấy, tức cả trang, rồi chia ngân sách thời gian xuống từng dịch vụ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(sum(x < 200 for x in alg.scenario_latencies()) / 1000 - 0.954) < 1e-9"
      - "0.95 * 1000 <= 954 < 0.96 * 1000 and 1000 - 954 == 46 and round(0.01 * 1000) == 10 and sum(x >= 200 for x in alg.scenario_latencies()) == 46"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trong 1000 yêu cầu đo được, 954 yêu cầu dưới 200 ms. Kịch bản “95% dưới 200 ms” đạt không? “96% dưới 200 ms” thì sao?</td></tr>
          <tr><td>2</td><td>Viết lại yêu cầu “hệ thống phải luôn chạy” thành một kịch bản sẵn sàng có thước đo.</td></tr>
          <tr><td>3</td><td>Đòi “99% dưới 200 ms”. Nhóm có một tuần: làm mọi yêu cầu nhanh thêm vài ms, hay xử lý các yêu cầu chạm ổ đĩa chậm?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, trong 1000 yêu cầu đo được có 954 yêu cầu dưới 200 mi li giây. Kịch bản 95 phần trăm dưới 200 mi li giây có đạt không, và 96 phần trăm thì sao? Câu hai, hãy viết lại yêu cầu hệ thống phải luôn chạy thành một kịch bản sẵn sàng có thước đo. Câu ba, kịch bản đòi 99 phần trăm dưới 200 mi li giây, nhóm có một tuần, nên làm mọi yêu cầu nhanh thêm vài mi li giây, hay xử lý các yêu cầu chạm ổ đĩa chậm? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Tỉ lệ: $\frac{954}{1000} = 95{,}4\%$. So với 95%: 95,4% ≥ 95% → <b>đạt</b>. So với 96%: 95,4% &lt; 96% → <b>trượt</b> (cần ít nhất 960 yêu cầu).</p>
        say: "Đáp án câu một, tỉ lệ là 954 chia 1000, bằng 95 phẩy 4 phần trăm. Con số này không nhỏ hơn 95 nên đạt, nhưng nhỏ hơn 96 nên trượt. Muốn đạt 96 phần trăm thì cần ít nhất 960 yêu cầu dưới 200 mi li giây."
      - show: |
          <table class="t"><tr><th>nguồn</th><th>kích thích</th><th>môi trường</th><th>phản hồi</th><th>thước đo</th></tr>
          <tr><td>phần cứng</td><td>một máy chủ hỏng</td><td>giờ làm việc</td><td>dịch vụ tiếp tục trả lời</td><td>tính theo 30 ngày, ít nhất 99,9% yêu cầu thành công</td></tr></table>
        focus: [1, "1.2"]
        say: "Câu hai, ta điền đủ năm phần của kịch bản. Chẳng hạn, khi một máy chủ hỏng trong giờ làm việc, dịch vụ vẫn tiếp tục trả lời, và tính theo 30 ngày thì ít nhất 99 phẩy 9 phần trăm yêu cầu thành công."
      - show: |
          <p>③ 99% dưới 200 ms nghĩa là tối đa $1000 - 990 = 10$ yêu cầu được chậm hơn 200 ms. Hiện có $1000 - 954 = \hl{46}$ yêu cầu chậm hơn — gần như đều là yêu cầu chạm ổ đĩa chậm.</p>
          <div class="box key">Quyết định: xử lý <b>đuôi chậm</b>. Làm mọi yêu cầu nhanh thêm vài ms hạ trung bình, nhưng 46 yêu cầu cách mốc hàng trăm ms vẫn trượt.</div>
        focus: [1, 1, 1, 2, 2]
        say: "Câu ba là một quyết định. Đòi 99 phần trăm dưới 200 mi li giây nghĩa là chỉ được tối đa 10 yêu cầu chậm hơn 200. Hiện có 1000 trừ 954, bằng 46 yêu cầu chậm hơn, gần như đều là yêu cầu chạm ổ đĩa chậm. Vậy nên xử lý phần đuôi chậm. Làm mọi yêu cầu nhanh thêm vài mi li giây chỉ hạ trung bình, còn 46 yêu cầu cách mốc hàng trăm mi li giây vẫn trượt."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">năm thuộc tính chất lượng</span><span class="a">→</span>
          <span class="n">mỗi thuộc tính một kịch bản có thước đo</span><span class="a">→</span>
          <span class="n">đo bằng phân vị</span><span class="a">→</span>
          <span class="n">kiến trúc = bộ đánh đổi theo ưu tiên</span></div>
        say: "Tổng kết lại, có năm thuộc tính chất lượng, mỗi thuộc tính quan trọng cần một kịch bản có thước đo, đo bằng phân vị, và kiến trúc là một bộ đánh đổi theo thứ tự ưu tiên."
      - show: |
          <div class="box key"><b>Tư duy:</b> người làm kiến trúc không chọn “công nghệ hay”, mà chọn đánh đổi nào chấp nhận được — và viết ra bằng con số.</div>
        say: "Điều cần mang theo, người làm kiến trúc không chọn công nghệ hay, mà chọn đánh đổi nào chấp nhận được, và viết ra bằng con số."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>ghi lại quyết định kiến trúc</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cách ghi lại các quyết định kiến trúc. Hẹn gặp bạn ở bài tiếp theo."
