id: L10
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 10 — Nhất quán và vị trí địa lý: một vùng, nhiều vùng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L10; audit/sar/verify_sar.py L10; D. Abadi, Consistency Tradeoffs in Modern Distributed Database System Design (PACELC), IEEE Computer 45(2), 2012; J. C. Corbett và cộng sự, Spanner: Google's Globally-Distributed Database, OSDI (2012); DSY bài 4 (đồng thuận đa số)"
assumes: [arith, cdot]
# Quy ước: ghi đồng bộ = chờ đủ số xác nhận rồi mới trả lời; mỗi bản sao xác nhận sau một vòng khứ hồi = 2 × độ trễ một chiều (bỏ qua thời gian xử lý).
#   alg.quorum_write_ms(độ trễ một chiều mỗi bản sao, số xác nhận cần) = vòng khứ hồi của bản sao thứ “cần” nhanh nhất.
objectives:
  - "Ước lượng độ trễ của ghi đồng bộ nhiều vùng"
  - "Chọn mức nhất quán theo từng loại dữ liệu"
  - "Hiểu đánh đổi giữa nhất quán và độ trễ"
asr_reviewed:
  - {sentence: "Bất đồng bộ chỉ chờ vùng gần, mất 10 mi li giây.", reason: "ASR chép “Bất đồng bộ chỉ chờ vùng gần, mất 10 mili dây.” (0.783): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mỗi lượt thích chờ 180 ms"
    checks:
      - "alg.quorum_write_ms([5, 40, 90], 3) == 180"
    steps:
      - show: |
          <p>Để “không bao giờ mất dữ liệu”, nhóm cho mọi lần ghi chờ cả ba vùng xác nhận: vùng gần (5 ms một chiều), vùng giữa (40 ms), vùng xa (90 ms). Mỗi lần bấm thích phải chờ $\hl{180}$ ms. Một lượt thích chậm nửa nhịp thì có sao không?</p>
          <div class="box key">Hôm nay: <b>nhất quán và vị trí địa lý</b> — cái giá bằng mi li giây của nhất quán mạnh, và chọn mức nhất quán theo từng loại dữ liệu.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, để không bao giờ mất dữ liệu, nhóm cho mọi lần ghi chờ cả ba vùng xác nhận, vùng gần cách 5 mi li giây một chiều, vùng giữa 40, vùng xa 90. Mỗi lần bấm thích phải chờ 180 mi li giây. Một lượt thích chậm nửa nhịp thì có sao không? Hôm nay ta học nhất quán và vị trí địa lý, cái giá bằng mi li giây của nhất quán mạnh, và cách chọn mức nhất quán theo từng loại dữ liệu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: vòng khứ hồi, đa số, bản nhanh thứ k"
    checks:
      - "2 * 40 == 80 and 2 * 5 == 10"
      - "[n // 2 + 1 for n in (3, 5)] == [2, 3] and [n - (n // 2 + 1) for n in (3, 5)] == [1, 2]"
      - "sorted([80, 10, 180]) == [10, 80, 180] and sorted([80, 10, 180])[2 - 1] == 80"
    steps:
      - show: |
          <p><b>Vòng khứ hồi</b> (khoá Mạng máy tính): gửi đi rồi nhận trả lời = hai lần độ trễ một chiều. Vùng cách 40 ms một chiều → khứ hồi $2 \cdot 40 = \hl{80}$ ms.</p>
        say: "Trước hết, ôn ba điều sẽ dùng. Ở khoá Mạng máy tính, vòng khứ hồi là gửi đi rồi nhận trả lời, bằng hai lần độ trễ một chiều. Vùng cách 40 mi li giây một chiều thì khứ hồi mất 2 nhân 40, bằng 80 mi li giây."
      - show: |
          <table class="t"><tr><th>số bản sao</th><th>đa số (quá nửa)</th><th>chịu được mấy bản chết</th></tr>
          <tr><td>3</td><td>2</td><td>1</td></tr>
          <tr><td>5</td><td>3</td><td>2</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thứ hai, ở khoá Hệ phân tán, đa số là quá nửa số bản sao. Có 3 bản thì đa số là 2, nên chịu được 1 bản chết. Có 5 bản thì đa số là 3, nên chịu được 2 bản chết."
      - show: |
          <p><b>Bản nhanh thứ k</b>: xếp các thời gian từ nhỏ tới lớn rồi đếm tới vị trí $k$. Thời gian 80, 10, 180 → xếp lại 10, 80, 180 → bản nhanh thứ 2 xong ở $\hl{80}$.</p>
        say: "Thứ ba, muốn biết bản nhanh thứ k, ta xếp các thời gian từ nhỏ tới lớn rồi đếm tới vị trí k. Ba thời gian 80, 10, 180 xếp lại thành 10, 80, 180, nên bản nhanh thứ hai xong ở 80."

  - id: sym
    kind: symbol
    title: "Giải mã: ghi đồng bộ, đa số, nhất quán cuối cùng"
    steps:
      - show: |
          <table class="t"><tr><th>cách ghi</th><th>trả lời khi</th><th>đánh đổi</th></tr>
          <tr><td><b>đồng bộ tất cả</b></td><td>mọi bản sao xác nhận</td><td>chậm theo bản xa nhất; một vùng chết là không ghi được</td></tr>
          <tr><td><b>đồng bộ đa số</b></td><td>quá nửa bản sao xác nhận (như đồng thuận ở DSY)</td><td>chậm theo bản nhanh thứ “đa số”; chịu được thiểu số chết</td></tr>
          <tr><td><b>bất đồng bộ</b> (nhất quán cuối cùng)</td><td>bản sao gần nhất ghi xong</td><td>nhanh; vùng khác thấy trễ, có thể mất vài lần ghi khi vùng chính chết</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so ba cách ghi. Đồng bộ tất cả trả lời khi mọi bản sao xác nhận, nên chậm theo bản xa nhất, và một vùng chết là không ghi được. Đồng bộ đa số trả lời khi quá nửa bản sao xác nhận, như đồng thuận ở khoá Hệ phân tán, nên chậm theo bản nhanh thứ đa số, và chịu được thiểu số chết. Bất đồng bộ trả lời khi bản sao gần nhất ghi xong, rất nhanh, nhưng vùng khác thấy trễ, và có thể mất vài lần ghi khi vùng chính chết."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ai trả lời trước, ai trả lời sau"
    checks:
      - "[2 * x for x in (5, 40, 90)] == [10, 80, 180] and [200 + 6 * r for r in (10, 80, 180)] == [260, 680, 1280]"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="22" fill="#1f2937"><text x="200" y="35">thanh xanh: lượt đi, thanh cam: lượt về; mỗi vùng xác nhận sau một vòng khứ hồi</text><text x="20" y="83">vùng gần, 5 ms</text><rect x="200" y="60" width="30" height="32" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="230" y="60" width="30" height="32" fill="#fdba74" stroke="#eb6834" stroke-width="2"/><text x="20" y="153">vùng giữa, 40 ms</text><rect x="200" y="130" width="240" height="32" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="440" y="130" width="240" height="32" fill="#fdba74" stroke="#eb6834" stroke-width="2"/><text x="20" y="223">vùng xa, 90 ms</text><rect x="200" y="200" width="540" height="32" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="740" y="200" width="540" height="32" fill="#fdba74" stroke="#eb6834" stroke-width="2"/><text x="275" y="84" fill="#059669" font-weight="bold">10 ms: bất đồng bộ trả lời</text><text x="695" y="154" fill="#2a78d6" font-weight="bold">80 ms: đa số 2 trên 3 trả lời</text><text x="1280" y="192" text-anchor="end" fill="#b91c1c" font-weight="bold">180 ms: chờ tất cả mới trả lời</text><line x1="200" y1="265" x2="1400" y2="265" stroke="#6b7280" stroke-width="2"/><text x="200" y="300" text-anchor="middle">0</text><text x="500" y="300" text-anchor="middle">50</text><text x="800" y="300" text-anchor="middle">100</text><text x="1100" y="300" text-anchor="middle">150</text><text x="1400" y="300" text-anchor="middle">200 ms</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ một lần ghi gửi tới ba vùng cùng lúc, thanh xanh là lượt đi, thanh cam là lượt về. Vùng gần xác nhận sau 10 mi li giây, vùng giữa sau 80, vùng xa sau 180. Cách ghi nào cũng phải đợi tới một thanh nào đó về xong, bất đồng bộ đợi thanh ngắn nhất, đa số đợi thanh thứ hai, còn chờ tất cả thì đợi thanh dài nhất."

  - id: example
    kind: example
    title: "Ba vùng: 5, 40, 90 ms một chiều"
    checks:
      - "[alg.quorum_write_ms([5, 40, 90], k) for k in (1, 2, 3)] == [10, 80, 180]"
      - "180 - 80 == 100 and 180 / 80 == 2.25 and 3 - 2 == 1"
    steps:
      - show: |
          <p><b>Bước 1 — đổi sang khứ hồi:</b> $2 \cdot 5 = 10$, $2 \cdot 40 = 80$, $2 \cdot 90 = 180$ ms.</p>
        say: "Bước một, đổi độ trễ một chiều sang vòng khứ hồi, nhân mỗi số với 2. Mỗi bản sao xác nhận sau một vòng khứ hồi, lần lượt 10, 80 và 180 mi li giây."
      - show: |
          <p><b>Bước 2 — bất đồng bộ:</b> chờ 1 xác nhận, tức bản nhanh nhất → $\hl{10}$ ms.</p>
          <p><b>Bước 3 — đa số 2 trên 3:</b> xếp 10, 80, 180, lấy bản nhanh thứ 2 → $\hl{80}$ ms.</p>
        focus: [1, 1, 2, 2]
        say: "Bước hai, cách ghi bất đồng bộ. Bất đồng bộ chỉ chờ vùng gần, mất 10 mi li giây. Bước ba, đồng bộ đa số chờ 2 trên 3 xác nhận. Xếp 10, 80, 180 rồi lấy bản nhanh thứ hai, được 80 mi li giây."
      - clear: true
        show: |
          <p><b>Bước 4 — đồng bộ tất cả:</b> chờ cả 3, tức bản chậm nhất → $\hl{180}$ ms.</p>
          <table class="t"><tr><th>cách ghi</th><th>chờ</th><th>thời gian ghi</th></tr>
          <tr><td>bất đồng bộ (chỉ vùng gần)</td><td>1 xác nhận</td><td>10 ms</td></tr>
          <tr><td>đồng bộ đa số (2 trên 3)</td><td>2 xác nhận nhanh nhất</td><td>$\hl{80}$ ms</td></tr>
          <tr><td>đồng bộ tất cả</td><td>3 xác nhận</td><td>$\hl{180}$ ms</td></tr></table>
        focus: [1, 2]
        say: "Bước bốn, đồng bộ tất cả phải chờ cả 3, tức chờ bản chậm nhất, mất 180 mi li giây. Bảng gom ba cách ghi lại, 10, 80 và 180 mi li giây."
      - show: |
          <p><b>Bước 5 — so sánh:</b> đa số nhanh hơn chờ tất cả $180 - 80 = 100$ ms, tức chờ tất cả lâu gấp $\frac{180}{80} = 2{,}25$ lần, mà đa số vẫn chịu được $3 - 2 = 1$ vùng chết.</p>
          <div class="box key">Vật lý đặt giới hạn: không thuật toán nào làm ánh sáng đi nhanh hơn. Nhất quán mạnh giữa các vùng xa nhau <b>luôn</b> tốn ít nhất một vòng khứ hồi.</div>
        introduces: [frac]
        focus: [1, 1, 2]
        say: "Bước năm, so sánh. Đa số nhanh hơn chờ tất cả 100 mi li giây, tức chờ tất cả lâu gấp 2 phẩy 25 lần, mà đa số vẫn chịu được 1 vùng chết. Vật lý đặt giới hạn, không thuật toán nào làm ánh sáng đi nhanh hơn, nên nhất quán mạnh giữa các vùng xa nhau luôn tốn ít nhất một vòng khứ hồi."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê từng cặp đủ đa số"
    checks:
      - "[max(2 * a, 2 * b) for a, b in __import__('itertools').combinations([5, 40, 90], 2)] == [80, 180, 180]"
      - "min(max(2 * a, 2 * b) for a, b in __import__('itertools').combinations([5, 40, 90], 2)) == 80 == alg.quorum_write_ms([5, 40, 90], 2)"
      - "alg.quorum_write_ms([5, 90], 2) == 180 and alg.quorum_write_ms([5, 40], 2) == 80 and alg.quorum_write_ms([40, 90], 2) == 180"
    steps:
      - show: |
          <table class="t"><tr><th>cặp vùng đủ đa số</th><th>cặp này xong khi cả hai về</th></tr>
          <tr><td>gần + giữa</td><td>lớn hơn của 10 và 80 = 80 ms</td></tr>
          <tr><td>gần + xa</td><td>lớn hơn của 10 và 180 = 180 ms</td></tr>
          <tr><td>giữa + xa</td><td>lớn hơn của 80 và 180 = 180 ms</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 1]
        say: "Kiểm bằng đường khác, liệt kê mọi cặp vùng đủ đa số, mỗi cặp xong khi cả hai đã về. Cặp gần và giữa xong ở 80 mi li giây. Cặp gần và xa xong ở 180. Cặp giữa và xa cũng 180. Lần ghi xong ngay khi cặp đầu tiên đủ, nên mất 80, khớp với cách xếp thứ tự."
      - show: |
          <table class="t"><tr><th>vùng chết</th><th>còn lại</th><th>ghi đa số mất</th></tr>
          <tr><td>vùng gần</td><td>giữa + xa</td><td>180 ms</td></tr>
          <tr><td>vùng giữa</td><td>gần + xa</td><td>$\hl{180}$ ms</td></tr>
          <tr><td>vùng xa</td><td>gần + giữa</td><td>80 ms</td></tr></table>
        focus: [1, "1.3", "1.4", "1.2"]
        say: "Bảng còn cho một hệ quả. Khi vùng giữa chết, đa số chỉ còn cặp gần và xa, nên mỗi lần ghi mất 180 mi li giây, vẫn ghi được nhưng chậm hơn hẳn. Khi vùng xa chết thì vẫn 80 mi li giây. Còn khi vùng gần chết, cặp giữa và xa cũng cho 180."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đòi nhất quán mạnh cho mọi dữ liệu <b class="red">(chậm vô ích)</b>
          <br><span class="note">Số dư tài khoản, tồn kho cuối cùng: cần mạnh. Lượt thích, lượt xem, bình luận hiện trễ vài giây: nhất quán cuối cùng là đủ. Chọn theo <b>từng loại dữ liệu</b>.</span></div>
        say: "Lỗi thứ nhất, đòi nhất quán mạnh cho mọi dữ liệu. Số dư tài khoản hay tồn kho cuối cùng cần nhất quán mạnh. Còn lượt thích, lượt xem, bình luận hiện trễ vài giây thì nhất quán cuối cùng là đủ, nên hãy chọn theo từng loại dữ liệu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ghi bất đồng bộ mà nghĩ không mất gì <b class="red">(mất lần ghi cuối)</b>
          <br><span class="note">Vùng chính chết trước khi kịp sao chép: vài giây ghi cuối có thể mất. Ghi rõ con số này (mất tối đa bao nhiêu) trong bản ghi quyết định.</span></div>
        say: "Lỗi thứ hai, ghi bất đồng bộ mà nghĩ không mất gì. Vùng chính chết trước khi kịp sao chép thì vài giây ghi cuối có thể mất, nên hãy ghi rõ con số này, tức mất tối đa bao nhiêu, trong bản ghi quyết định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đặt người dùng ở vùng xa dữ liệu của họ <b class="red">(mọi yêu cầu đi vòng)</b>
          <br><span class="note">Khách ở Việt Nam, dữ liệu chính ở châu Âu: mọi lần đọc ghi đều cộng hàng trăm mi li giây. Đặt dữ liệu gần người dùng nhiều nhất của nó.</span></div>
        say: "Lỗi thứ ba, đặt người dùng ở xa dữ liệu của họ. Khách ở Việt Nam mà dữ liệu chính ở châu Âu thì mọi lần đọc ghi đều cộng thêm hàng trăm mi li giây, nên hãy đặt dữ liệu gần những người dùng nó nhiều nhất."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.quorum_write_ms([0, 40, 90], 2) == 80 and alg.quorum_write_ms([0, 30, 35, 90, 120], 3) == 70"
      - "[2 * x for x in (0, 40, 90)] == [0, 80, 180] and [2 * x for x in (0, 30, 35, 90, 120)] == [0, 60, 70, 180, 240] and 5 // 2 + 1 == 3 and 5 - 3 == 2"
      - "alg.quorum_write_ms([5, 40, 90], 1) == 10 and alg.quorum_write_ms([5, 40, 90], 2) == 80"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bản chính nằm ngay tại chỗ (0 ms), hai bản sao cách 40 và 90 ms một chiều. Ghi đa số (2 trên 3) mất bao lâu?</td></tr>
          <tr><td>2</td><td>Năm bản sao cách 0, 30, 35, 90, 120 ms một chiều. Ghi đa số (3 trên 5) mất bao lâu?</td></tr>
          <tr><td>3</td><td>Ba vùng 5, 40, 90 ms. Lượt thích và số dư tài khoản: mỗi loại chọn cách ghi nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bản chính nằm ngay tại chỗ, hai bản sao cách 40 và 90 mi li giây một chiều, ghi đa số 2 trên 3 mất bao lâu? Câu hai, năm bản sao cách 0, 30, 35, 90, 120 mi li giây một chiều, ghi đa số 3 trên 5 mất bao lâu? Câu ba, với ba vùng 5, 40, 90 mi li giây, lượt thích và số dư tài khoản nên chọn cách ghi nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Khứ hồi: $2 \cdot 0 = 0$, $2 \cdot 40 = 80$, $2 \cdot 90 = 180$. Hai xác nhận nhanh nhất: 0 và 80 ms → $\hl{80}$ ms.</p>
        focus: [1, 1]
        say: "Đáp án câu một, nhân đôi để có vòng khứ hồi, được 0, 80 và 180. Hai xác nhận nhanh nhất là 0 và 80, nên mất 80 mi li giây."
      - show: |
          <table class="t"><tr><th>một chiều (ms)</th><td>0</td><td>30</td><td>35</td><td>90</td><td>120</td></tr>
          <tr><th>khứ hồi (ms)</th><td>0</td><td>60</td><td><b>70</b></td><td>180</td><td>240</td></tr></table>
          <p>② Đa số của 5 là 3 → xác nhận thứ 3 ở $\hl{70}$ ms. Đặt các bản sao gần nhau đủ đa số thì ghi nhanh mà vẫn chịu được hai vùng xa chết.</p>
        focus: [1, 2, 2]
        say: "Câu hai, nhân đôi từng số, các vòng khứ hồi là 0, 60, 70, 180, 240. Đa số của 5 là 3, nên xác nhận thứ ba tới ở 70 mi li giây. Đặt đủ đa số bản sao gần nhau thì ghi nhanh, mà vẫn chịu được hai vùng xa chết."
      - show: |
          <table class="t"><tr><th>dữ liệu</th><th>chọn</th><th>thời gian ghi</th><th>lý do</th></tr>
          <tr><td>lượt thích</td><td>bất đồng bộ</td><td>10 ms</td><td>hiện trễ vài giây không sao</td></tr>
          <tr><td>số dư tài khoản</td><td>đồng bộ đa số</td><td>80 ms</td><td>không được mất lần ghi; vẫn chịu 1 vùng chết</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu ba là một quyết định theo từng loại dữ liệu. Lượt thích chọn bất đồng bộ, ghi mất 10 mi li giây, vì hiện trễ vài giây không sao. Số dư tài khoản chọn đồng bộ đa số, mất 80 mi li giây, vì không được mất lần ghi, mà vẫn chịu được 1 vùng chết, không phải chờ tới 180 như khi chờ tất cả."

