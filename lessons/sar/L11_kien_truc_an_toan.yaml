      90% (số minh hoạ): chỉ 1 phần 10 số đòn đi tiếp</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ 1000 đòn tấn công đi qua ba lớp khác loại, tường lửa, xác thực và phân quyền. Giả sử mỗi lớp chặn 90 phần
      trăm, một số minh hoạ, nên sau lớp đầu còn 100 đòn, sau lớp thứ hai còn 10, sau lớp thứ ba chỉ còn 1 đòn tới được dữ
      liệu. Không lớp nào hoàn hảo, nhưng ghép lại thì chỉ lọt một phần nghìn, với điều kiện các lớp hỏng độc lập với nhau.
      Ngăn khoang tàu thuỷ đảm bảo một lỗ thủng nhỏ ở mũi tàu không làm chìm toàn bộ con tàu lớn.
- id: example
  kind: example
  title: Thu hẹp phạm vi thiệt hại
  checks:
  - 'alg.blast_radius({''bao_cao'': {(''ban_sao_doc'', ''đọc'')}}, ''bao_cao'') == {(''ban_sao_doc'', ''đọc'')}'
  - round(0.1 ** 3, 6) == 0.001 and round(1 - 0.1 ** 3, 3) == 0.999
  - 'len(alg.blast_radius({''bao_cao'': {(''csdl_chinh'', ''đọc''), (''csdl_chinh'', ''ghi''), (''kho_bi_mat'', ''đọc'')}},
    ''bao_cao'')) == 3 and round(0.1 / 0.1 ** 3) == 100'
  steps:
  - show: '<p><b>Bước 1 — liệt kê quyền đang cấp:</b> dịch vụ báo cáo có quyền quản trị cơ sở dữ liệu chính và đọc kho bí
      mật → bị chiếm thì kẻ tấn công có <b class="red">3 cặp quyền nguy hiểm</b>.</p>

      '
    say: Bước một, liệt kê quyền đang cấp. Dịch vụ báo cáo có quyền quản trị cơ sở dữ liệu chính và đọc kho bí mật, nên khi
      bị chiếm, kẻ tấn công có 3 cặp quyền nguy hiểm. Nguyên tắc đặc quyền tối thiểu yêu cầu cắt bỏ quyền đọc bí mật khỏi
      dịch vụ chỉ làm báo cáo. Ta liệt kê đủ tài sản cần bảo vệ là hai kho dữ liệu, kẻ tấn công chiếm dịch vụ, và đường tấn công qua quyền thừa.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
  - show: '<table class="t"><tr><th>cặp quyền</th><th>báo cáo có cần không?</th></tr>

      <tr><td>ghi cơ sở dữ liệu chính</td><td>không — báo cáo chỉ đọc</td></tr>

      <tr><td>đọc kho bí mật</td><td>không — không dùng khoá nào</td></tr>

      <tr><td>đọc cơ sở dữ liệu chính</td><td>chỉ cần dữ liệu báo cáo → thay bằng đọc <b>bản sao</b> (bản chép riêng phần
      dữ liệu báo cáo; sửa ở đó không đổi được bản chính)</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bước hai, hỏi từng cặp xem báo cáo có cần không. Ghi cơ sở dữ liệu chính thì không, vì báo cáo chỉ đọc. Đọc kho bí
      mật cũng không, vì báo cáo không dùng khoá nào. Đọc cơ sở dữ liệu chính thì chỉ cần phần dữ liệu báo cáo, nên thay bằng
      quyền đọc bản sao. Bản sao ở đây là bản chép riêng phần dữ liệu báo cáo, sửa ở đó không đổi được bản chính.
  - clear: true
    show: '<table class="t"><tr><th>dịch vụ báo cáo được cấp</th><th>bị chiếm thì kẻ tấn công có</th></tr>

      <tr><td>quản trị cơ sở dữ liệu chính + đọc kho bí mật</td><td>đọc, ghi cơ sở dữ liệu chính; đọc mọi khoá — <b class="red">3
      quyền nguy hiểm</b></td></tr>

      <tr><td>chỉ đọc <b>bản sao</b> dữ liệu báo cáo</td><td>đọc bản sao — $\hl{1}$ quyền, không ghi được gì</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Bước ba, so hai cách cấp quyền cho dịch vụ báo cáo. Nếu được cấp quyền quản trị cơ sở dữ liệu chính và đọc kho bí
      mật, khi bị chiếm kẻ tấn công có ba quyền nguy hiểm, đọc và ghi cơ sở dữ liệu chính, đọc mọi khoá. Nếu chỉ được đọc
      bản sao dữ liệu báo cáo, khi bị chiếm kẻ tấn công chỉ có một quyền, và không ghi được gì. Tách biệt danh tính từng tác
      nhân cho phép thu hồi ngay lập tức phiên làm việc có dấu hiệu lạ.
  - show: '<p><b>Bước 4 — thêm nhiều lớp:</b> nếu mỗi lớp chặn được 90% đòn tấn công và các lớp độc lập, ba lớp chỉ để lọt
      $0{,}1^3 = \hl{0{,}001}$ — một phần nghìn, tức chặn được 99,9%.</p>

      '
    say: Bước bốn, thêm nhiều lớp. Với nhiều lớp, nếu mỗi lớp chặn được 90 phần trăm và các lớp độc lập, ba lớp chỉ để lọt
      0 phẩy 1 mũ 3, tức một phần nghìn. Nói cách khác, ba lớp chặn được 99 phẩy 9 phần trăm. Ba hàng rào độc lập giảm rủi
      ro rò rỉ dữ liệu nhạy cảm xuống mức một phần nghìn so với ban đầu.
  - show: '<p><b>Bước 5 — kiểm giả thiết:</b> nếu ba lớp dùng chung một điểm yếu, chúng hỏng cùng lúc như <b>một</b> lớp →
      lọt 0,1, gấp $\frac{0{,}1}{0{,}001} = 100$ lần.</p>

      <p class="note">Giả thiết độc lập là lạc quan: các lớp dùng chung thư viện hay cùng một mật khẩu thì một lỗ là thủng
      cả. Đó là lý do dùng lớp <b>khác loại</b>.</p>

      '
    introduces:
    - frac
    focus:
    - 1
    - 2
    - 2
    say: Bước năm, kiểm lại giả thiết độc lập, vì nếu ba lớp dùng chung một điểm yếu thì chúng hỏng cùng lúc như một lớp,
      để lọt 0 phẩy 1, gấp 100 lần một phần nghìn. Giả thiết độc lập là lạc quan, các lớp dùng chung thư viện hay cùng một
      mật khẩu thì một lỗ là thủng cả, nên hãy dùng các lớp khác loại. Kết hợp nhiều cơ chế bảo vệ khác công nghệ giúp loại
      bỏ hoàn toàn điểm lỗi chung chết người.
- id: check
  kind: check
  title: 'Tự kiểm: đếm thẳng số đòn, so tập quyền'
  checks:
  - 1000 - 900 == 100 and 100 - 90 == 10 and 10 - 9 == 1 and 1 / 1000 == 0.001
  - '{(''csdl_chinh'', ''đọc''), (''csdl_chinh'', ''ghi''), (''kho_bi_mat'', ''đọc'')} & {(''ban_sao_doc'', ''đọc'')} == set()
    and not any(q == ''ghi'' for _, q in {(''ban_sao_doc'', ''đọc'')})'
  steps:
  - show: '<table class="t"><tr><th>lớp</th><th>đến lớp</th><th>bị chặn (90%)</th><th>lọt qua</th></tr>

      <tr><td>tường lửa</td><td>1000</td><td>900</td><td>100</td></tr>

      <tr><td>xác thực</td><td>100</td><td>90</td><td>10</td></tr>

      <tr><td>phân quyền</td><td>10</td><td>9</td><td>1</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 1
    say: Kiểm bằng đường khác, đếm thẳng số đòn thay vì nhân xác suất. Tường lửa nhận 1000 đòn, chặn 900, lọt 100. Xác thực
      nhận 100, chặn 90, lọt 10. Phân quyền nhận 10, chặn 9, lọt 1. Một đòn trên một nghìn đúng bằng 0 phẩy 001, khớp với
      phép lũy thừa.
  - show: '<table class="t"><tr><th>tập quyền</th><th>có quyền ghi?</th><th>chạm cơ sở dữ liệu chính hay kho bí mật?</th></tr>

      <tr><td>quyền rộng (3 cặp)</td><td>có</td><td>có</td></tr>

      <tr><td>quyền tối thiểu (1 cặp)</td><td>không</td><td>không — hai tập không chung cặp nào</td></tr></table>

      <div class="code"><div>c.execute("PRAGMA query_only = ON")</div><div>val = c.execute("SELECT amt FROM invoices").fetchone()[0]</div><div>try:
      c.execute("DELETE FROM invoices")</div><div>except sqlite3.OperationalError: blocked = 1</div></div>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Với phân quyền, so thẳng hai tập. Tập quyền rộng có quyền ghi và chạm cả cơ sở dữ liệu chính lẫn kho bí mật. Tập
      quyền tối thiểu không có quyền ghi nào, và không chung cặp nào với tập rộng, nên kẻ chiếm dịch vụ báo cáo không chạm
      được dữ liệu chính. Trên SQLite, chỉ lệnh khoá chế độ chỉ đọc vẫn cho phép câu lệnh chọn dữ liệu chạy bình thường nhưng
      chặn đứng câu lệnh xoá bằng ngoại lệ vận hành. Cách đặt kiểm soát và quyền tối thiểu này giúp thu hẹp thiệt hại hiệu quả.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Coi mạng nội bộ là vùng tin cậy <b class="red">(một lỗ là vào hết)</b>

      <br><span class="note">Kẻ tấn công vào được một máy bên trong thì gọi được mọi dịch vụ không xác thực. Xác thực và mã
      hoá cả lời gọi nội bộ; mỗi dịch vụ một danh tính.</span></div>

      '
    say: Lỗi thứ nhất, coi mạng nội bộ là vùng tin cậy. Kẻ tấn công vào được một máy bên trong thì gọi được mọi dịch vụ không
      xác thực, nên hãy xác thực và mã hoá cả lời gọi nội bộ, mỗi dịch vụ một danh tính. Dùng chung một tài khoản quản trị
      cho cả cụm dịch vụ là sai lầm phổ biến nhất làm mất sạch an toàn. Tách biệt tài khoản dịch vụ giúp cô lập tức thì phạm
      vi ảnh hưởng ngay khi một thành phần gặp sự cố.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Cấp quyền rộng “cho tiện”, định thu hẹp sau <b class="red">(không bao giờ thu
      hẹp)</b>

      <br><span class="note">Quyền thừa hiếm khi bị gỡ vì không ai biết gỡ có làm hỏng gì không. Bắt đầu từ <b>không có quyền</b>,
      thêm đúng thứ cần, ghi lý do.</span></div>

      '
    say: Lỗi thứ hai, cấp quyền rộng cho tiện, định thu hẹp sau. Quyền thừa hiếm khi bị gỡ vì không ai biết gỡ đi có làm hỏng
      gì không, nên hãy bắt đầu từ không có quyền nào, chỉ thêm đúng thứ cần, và ghi lý do. Mọi quyền mới được cấp thêm đều
      cần kỳ hạn rà soát tự động để thu hồi khi dự án kết thúc.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Không ghi nhật ký truy cập <b class="red">(không biết đã mất gì)</b>

      <br><span class="note">Bị tấn công mà không có nhật ký thì không biết kẻ tấn công đã đọc gì, từ khi nào. Ghi nhật ký
      truy cập dữ liệu nhạy cảm, lưu ở nơi kẻ chiếm dịch vụ không xoá được.</span></div>

      '
    say: Lỗi thứ ba, không ghi nhật ký truy cập. Bị tấn công mà không có nhật ký thì không biết kẻ tấn công đã đọc gì và từ
      khi nào. Hãy ghi nhật ký truy cập dữ liệu nhạy cảm, lưu ở nơi mà kẻ chiếm dịch vụ không xoá được. Kho lưu vết kiểm toán
      tách biệt là bằng chứng duy nhất giúp điều tra nguyên nhân sau khi gặp sự cố.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(0.2 ** 2, 2) == 0.04 and round(0.2 ** 4, 4) == 0.0016
  - round(1 - 0.8, 10) == 0.2 and round(0.2 ** 3, 10) == 0.008 and round(0.04 * 0.04, 10) == 0.0016
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Mỗi lớp chặn 80%, độc lập. Hai lớp để lọt bao nhiêu? Bốn lớp?</td></tr>

      <tr><td>2</td><td>Dịch vụ gửi thư cần đọc địa chỉ thư của khách. Nên cấp quyền gì? Không nên cấp gì?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, mỗi lớp chặn được 80 phần trăm và độc lập, hai lớp để lọt bao nhiêu, và bốn
      lớp thì sao? Câu hai, dịch vụ gửi thư cần đọc địa chỉ thư của khách. Nên cấp quyền gì, và không nên cấp gì? Dừng video
      và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Mỗi lớp để lọt $1 - 0{,}8 = 0{,}2$.</p>

      <table class="t"><tr><th>số lớp</th><td>1</td><td>2</td><td>3</td><td>4</td></tr>

      <tr><th>để lọt</th><td>0,2</td><td>$0{,}2^2 = \hl{0{,}04}$</td><td>0,008</td><td>$0{,}2^4 = \hl{0{,}0016}$</td></tr></table>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Đáp án câu một, mỗi lớp chặn 80 phần trăm thì để lọt 0 phẩy 2. Hai lớp để lọt 0 phẩy 2 bình phương, tức 0 phẩy 04,
      ba lớp 0 phẩy 008. Bốn lớp để lọt 0 phẩy 0016, tức 0 phẩy 04 nhân 0 phẩy 04, nếu các lớp thật sự độc lập. Xác suất phá
      vỡ cả hai lớp độc lập bằng tích của từng xác suất vượt qua riêng lẻ.
  - show: '<table class="t"><tr><th>cặp quyền</th><th>cấp?</th></tr>

      <tr><td>đọc cột địa chỉ thư (hoặc một bảng riêng chứa nó)</td><td>có — đúng thứ cần</td></tr>

      <tr><td>đọc số thẻ, mật khẩu</td><td>không</td></tr>

      <tr><td>ghi bất kỳ bảng nào; vào kho bí mật khác</td><td>không</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Câu hai, đi từng cặp quyền như ở ví dụ. Chỉ cấp quyền đọc cột địa chỉ thư, hoặc một bảng riêng chứa nó, vì đó đúng
      là thứ dịch vụ cần. Không cấp quyền đọc số thẻ hay mật khẩu. Cũng không cấp quyền ghi, hay quyền vào kho bí mật khác.
