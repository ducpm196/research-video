- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tài sản, kẻ tấn công, đường tấn công</span><span class="a">→</span>

      <span class="n">nhiều lớp khác loại</span><span class="a">→</span>

      <span class="n">quyền tối thiểu thu hẹp thiệt hại</span><span class="a">→</span>

      <span class="n">xác thực nội bộ, nhật ký không xoá được</span></div>

      '
    say: Tổng kết lại, mô hình hoá tài sản, kẻ tấn công và đường tấn công. Đặt nhiều lớp phòng thủ khác loại, dùng quyền tối
      thiểu để thu hẹp thiệt hại, xác thực cả lời gọi nội bộ, và giữ nhật ký không xoá được. Cô lập quyền theo vùng nhỏ nhất
      biến lỗ hổng ở một thành phần ngoại vi thành sự cố khoanh vùng thay vì mất kiểm soát toàn bộ hạ tầng. Cấp phát quyền
      rộng rãi lúc mới dựng cho tiện thử nghiệm rất dễ bị bỏ quên kéo dài mãi. Thu hồi mọi quyền thừa chưa cần thiết đóng
      sập đường leo thang đặc quyền trên toàn bộ hệ thống.
  - show: '<div class="box key"><b>Tư duy:</b> câu hỏi không phải “có bị tấn công không”, mà là “khi một phần bị chiếm, kẻ
      tấn công làm được gì tiếp”.</div>

      <p class="note"><b>So sánh hai quy mô:</b> một lớp bảo vệ có xác suất lọt 10% (0,1); phòng thủ 3 lớp độc lập giảm xác
      suất vượt cả 3 xuống $0{,}1^3 = 0{,}001$ (từ 10% xuống 0,1% — giảm 100 lần), kết hợp quyền tối thiểu chỉ đọc để cô lập
      vùng thiệt hại.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Điều cần mang theo, câu hỏi không phải là có bị tấn công không, mà là khi một phần bị chiếm, kẻ tấn công làm được
      gì tiếp theo. Xét hai mức quy mô, một lớp bảo vệ chỉ có xác suất lọt 10 phần trăm. Ba lớp độc lập giảm xác suất vượt
      qua xuống một phần nghìn, tức giảm đi 100 lần so với một lớp. Nhiều hàng rào bảo vệ khác chủng loại tạo thành mạng lưới
      chặn đứng chuỗi leo thang đặc quyền. Kết hợp lớp phòng vệ độc lập nhiều tầng tạo lá chắn vững chắc trước mọi rủi ro
      xâm nhập phức tạp.
  - clear: true
    show: '<p class="note">Bài sau (bài 12): <b>thiết kế tổng hợp</b> — từ yêu cầu tới bản kiến trúc.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 12, ta tổng hợp tất cả, đi từ yêu cầu tới một bản kiến trúc hoàn chỉnh. Hẹn gặp bạn ở bài tiếp theo.
