scenes:
- id: hook
  kind: hook
  title: Lỗ nhỏ ở dịch vụ báo cáo, mất cả cơ sở dữ liệu
  checks:
  - 'len(alg.blast_radius({''bao_cao'': {(''csdl_chinh'', ''đọc''), (''csdl_chinh'', ''ghi''), (''kho_bi_mat'', ''đọc'')}},
    ''bao_cao'')) == 3'
  steps:
  - show: '<p>Dịch vụ báo cáo nội bộ có một thư viện cũ dính lỗ hổng. Kẻ tấn công chiếm được nó — và vì nó dùng tài khoản
      quản trị cơ sở dữ liệu “cho tiện”, kẻ tấn công đọc, sửa, xoá được mọi bảng, rồi lấy luôn khoá trong kho bí mật (nơi
      cất mật khẩu và khoá mật mã của mọi dịch vụ).</p>

      <div class="box key">Hôm nay: <b>kiến trúc an toàn</b> — giả định một phần sẽ bị chiếm, và thiết kế để thiệt hại nhỏ
      nhất.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, dịch vụ báo cáo nội bộ có một thư viện cũ dính lỗ hổng. Kẻ tấn công chiếm được nó, và vì nó dùng tài khoản
      quản trị cơ sở dữ liệu cho tiện, kẻ tấn công đọc, sửa, xoá được mọi bảng, rồi lấy luôn khoá trong kho bí mật. Kho bí
      mật là nơi cất mật khẩu và khoá mật mã của mọi dịch vụ. Hôm nay ta học kiến trúc an toàn, giả định một phần sẽ bị chiếm,
      và thiết kế để thiệt hại nhỏ nhất. Giả định kẻ xấu chắc chắn sẽ xuyên qua lớp vỏ ngoài giúp bạn thiết kế hệ thống khó
      sụp đổ. Bảo mật theo chiều sâu kết hợp tối thiểu quyền hạn cô lập thiệt hại trong bán kính hẹp nhất.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: quyền là một cặp, và quy tắc nhân xác suất'
  checks:
  - len({('csdl_chinh', 'đọc'), ('csdl_chinh', 'ghi'), ('kho_bi_mat', 'đọc')}) == 3
  - round(1 - 0.9, 10) == 0.1 and 0.5 * 0.5 == 0.25 and round(0.1 * 0.1, 10) == 0.01 and round(0.1 ** 3, 10) == 0.001
  steps:
  - show: '<p>Một <b>quyền</b> là một cặp (tài nguyên, thao tác). Dịch vụ báo cáo trong ví dụ mở đầu có 3 cặp:</p>

      <table class="t"><tr><th>tài nguyên</th><th>thao tác</th></tr>

      <tr><td>cơ sở dữ liệu chính</td><td>đọc</td></tr>

      <tr><td>cơ sở dữ liệu chính</td><td>ghi</td></tr>

      <tr><td>kho bí mật</td><td>đọc</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Trước hết, ôn hai điều sẽ dùng. Thứ nhất, một quyền là một cặp gồm tài nguyên và thao tác. Dịch vụ báo cáo trong
      ví dụ mở đầu có 3 cặp, đọc cơ sở dữ liệu chính, ghi cơ sở dữ liệu chính, và đọc kho bí mật. Ai chiếm được dịch vụ thì
      có đúng 3 cặp quyền ấy. Mỗi cặp quyền dư thừa mở thêm một cánh cửa để kẻ tấn công leo thang từ dịch vụ nhỏ sang kho
      lõi.
  - show: '<p><b>Quy tắc nhân</b>: hai sự kiện độc lập cùng xảy ra có xác suất bằng tích. Tung hai đồng xu, cả hai ngửa: $0{,}5
      \cdot 0{,}5 = 0{,}25$.</p>

      <p>Một lớp chặn 90% thì để lọt $1 - 0{,}9 = 0{,}1$. Lọt qua hai lớp độc lập: $0{,}1 \cdot 0{,}1 = 0{,}01$; ba lớp: $0{,}1^3
      = 0{,}001$.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Thứ hai, quy tắc nhân của xác suất, hai sự kiện độc lập cùng xảy ra có xác suất bằng tích. Tung hai đồng xu, cả hai
      cùng ngửa có xác suất 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Một lớp phòng thủ chặn 90 phần trăm thì để lọt 0 phẩy
      1. Lọt qua hai lớp độc lập là 0 phẩy 1 nhân 0 phẩy 1, bằng 0 phẩy 01, còn ba lớp là 0 phẩy 1 mũ 3, bằng 0 phẩy 001.
      Nhờ các lớp phòng thủ độc lập, xác suất xuyên thủng toàn chuỗi giảm theo cấp số nhân nhanh chóng.
- id: sym
  kind: symbol
  title: 'Giải mã: mô hình mối đe doạ, ba nguyên tắc'
  steps:
  - show: '<p><b>Mô hình hoá mối đe doạ</b>: trả lời bốn câu — ta bảo vệ <b>tài sản</b> gì? <b>Ai</b> muốn tấn công? Họ đi
      <b>đường nào</b>? Ta <b>chặn</b> ở đâu?</p>

      <table class="t"><tr><th>nguyên tắc</th><th>nghĩa</th></tr>

      <tr><td><b>phòng thủ nhiều lớp</b></td><td>không dựa vào một hàng rào: tường lửa, xác thực, quyền, mã hoá, nhật ký</td></tr>

      <tr><td><b>quyền tối thiểu</b></td><td>mỗi dịch vụ chỉ có đúng quyền nó cần</td></tr>

      <tr><td><b>không tin mạng nội bộ</b></td><td>xác thực cả lời gọi giữa các dịch vụ bên trong</td></tr></table>

      <p class="note"><b>Tường lửa</b>: chặn kết nối mạng không được phép. <b>Xác thực</b>: kiểm ai đang gọi. <b>Phân quyền</b>:
      kiểm người đó được làm gì. <b>Mã hoá</b>: biến dữ liệu thành dạng chỉ ai có khoá mới đọc được. <b>Nhật ký</b>: ghi lại
      ai làm gì, lúc nào.</p>

      <p class="note"><b>Chỉ lệnh chỉ đọc trên SQLite:</b> cơ sở dữ liệu nhúng <b>SQLite</b> hỗ trợ câu lệnh cấu hình <b>PRAGMA</b>
      để khoá kết nối ở chế độ chỉ đọc an toàn cho báo cáo.</p>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    - 3
    - 3
    - 4
    - 4
    - 4
    say: Mô hình hoá mối đe doạ là trả lời bốn câu hỏi, ta bảo vệ tài sản gì, ai muốn tấn công, họ đi đường nào, và ta chặn
      ở đâu. Bảng giới thiệu ba nguyên tắc. Phòng thủ nhiều lớp là không dựa vào một hàng rào duy nhất, mà có tường lửa, xác
      thực, phân quyền, mã hoá và nhật ký. Quyền tối thiểu là mỗi dịch vụ chỉ có đúng quyền nó cần. Không tin mạng nội bộ
      là xác thực cả những lời gọi giữa các dịch vụ bên trong. Tường lửa chặn kết nối mạng không được phép, xác thực kiểm
      ai đang gọi, còn phân quyền kiểm người đó được làm gì. Mã hoá biến dữ liệu thành dạng chỉ ai có khoá mới đọc được. Nhật
      ký ghi lại ai đã làm gì và vào lúc nào. Trên cơ sở dữ liệu gọn nhẹ SQLite, ta dùng chỉ lệnh cấu hình để khoá cứng quyền
      chỉ đọc cho tài khoản tra cứu. Mô hình ba khái niệm cốt lõi giúp đội ngũ dễ dàng rà soát lỗ hổng ngay từ bước vẽ sơ
      đồ khối. Mỗi dịch vụ con chỉ nên giữ đúng chìa khoá tối thiểu cần cho duy nhất nghiệp vụ hàng ngày của nó.
