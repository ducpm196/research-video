  - {sentence: "Gom 5 bài đăng thì được 1000 byte, tức 1 KB, nên 500 triệu bài đăng là 100 triệu KB, đúng 100 GB.", reason: "ASR chép “Gom 5 bài đăng thì được 1.000 bài, tức 1 kilobyte, nên 500 triệu bài đăng là 100 triệu kilobyte, đúng 100 gigabyte.” (0.852): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte” — NOT_VERIFIED bằng tai người"}
