          <rect x="980" y="150" width="200" height="56" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1080" y="187">dòng thời gian</text>
          <rect x="1250" y="150" width="200" height="56" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1350" y="187">tin nhắn riêng</text>
