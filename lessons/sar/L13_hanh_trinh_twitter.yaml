  - {sentence: "Về sau, Twitter nhận hơn 500 triệu bài đăng mỗi ngày, và một bài đăng 140 ký tự cỡ khoảng 200 byte.", reason: "ASR chép “Về sau, Twitter nhận hơn 500 triệu bài đăng mỗi ngày và một bài đăng 140 ký tự cỡ khoảng 200 bài.” (0.963): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ sự cố năm 2010 tới 143 199 tweet mỗi giây"
    checks:
      - "round(143199 / 6000) == 24"
    steps:
      - show: |
          <p>Năm 2010, trong mùa World Cup, Twitter gặp liên tiếp sự cố — kỹ sư Twitter gọi đó là “World Cup Woes”.</p>
          <p>Năm 2013, Twitter nhận một đỉnh <b>143&nbsp;199 tweet trong một giây</b>, trong khi lúc bình thường là <b>hơn 6000 tweet mỗi giây</b> — gấp khoảng <b>24 lần</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 2006 tới 2014 — điều gì đã đổi để cùng một trang mạng chịu được đỉnh gấp 24 lần?</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, năm 2010, trong mùa giải bóng đá thế giới, mạng xã hội Twitter gặp liên tiếp sự cố. Năm 2013, nó nhận một đỉnh 143 nghìn 199 bài đăng trong một giây. Lúc bình thường chỉ hơn 6000 bài đăng mỗi giây, nên đỉnh đó gấp khoảng 24 lần. Hôm nay ta đi qua năm chặng từ 2006 tới 2014, xem điều gì đã đổi để cùng một trang chịu được đỉnh như vậy."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "round(10**7 * 20 / 86400) == 2315 and round(10**7 * 20 / 86400 * 3) == 6944"
      - "round(0.99 * 0.99, 4) == 0.9801 and round(1 - 0.9999, 4) == 0.0001"
      - "(1000 - 100) * 5 == 4500"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 2</td><td><b>ước lượng</b>: chia cho 86&nbsp;400 giây mỗi ngày, rồi nhân hệ số cao điểm</td><td>10 triệu người, 20 yêu cầu mỗi người → ≈ 2315 yêu cầu/s; cao điểm gấp 3 → ≈ 6944</td></tr>
          <tr><td>bài 3</td><td><b>ranh giới</b>: một phần chỉ biết phần kia qua một giao diện hẹp; phụ thuộc đi một chiều</td><td>giao diện gọi nghiệp vụ, nghiệp vụ gọi dữ liệu, không có chiều ngược lại</td></tr>
          <tr><td>bài 6</td><td><b>nối tiếp</b>: cần mọi phần cùng chạy, nên nhân xác suất</td><td>hai phần 99% → 99% nhân 99% = 98,01%; phần bù của 99,99% là 0,01%</td></tr>
          <tr><td>bài 7</td><td><b>áp lực ngược</b>: bên nhận báo bên gửi chậm lại, thay vì nhận vô hạn</td><td>đến 1000/s, làm 100/s → mỗi giây thêm 900 việc chờ; sau 5 giây là 4500</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 2, ta ước lượng bằng cách chia cho 86 nghìn 400 giây mỗi ngày, rồi nhân hệ số cao điểm. Ví dụ 10 triệu người, mỗi người 20 yêu cầu, được khoảng 2315 yêu cầu mỗi giây, cao điểm gấp 3 là khoảng 6944. Ở bài 3, ranh giới là chỗ một phần chỉ biết phần kia qua một giao diện hẹp, và phụ thuộc chỉ đi một chiều. Ở bài 6, các phần mắc nối tiếp thì nhân xác suất, hai phần 99% cho 98 phẩy 01%. Phần bù của 99 phẩy 99% là 0 phẩy 01%. Ở bài 7, áp lực ngược là bên nhận báo bên gửi chậm lại. Nếu không, đến 1000 việc mà làm 100 việc mỗi giây, sau 5 giây có 4500 việc chờ."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>nguyên khối</b> (monolith)</td><td>một ứng dụng làm mọi việc: nhận yêu cầu, hiển thị, nghiệp vụ, đọc ghi cơ sở dữ liệu</td></tr>
          <tr><td><b>dịch vụ</b> (service)</td><td>một chương trình riêng lo một việc, các dịch vụ gọi nhau qua mạng</td></tr>
          <tr><td><b>máy ảo Java</b> (JVM)</td><td>nền chạy chung cho chương trình viết bằng Java và các ngôn ngữ cùng họ</td></tr>
          <tr><td><b>tweet mỗi giây</b> (TPS)</td><td>số dòng trạng thái được đăng trong một giây</td></tr>
          <tr><td><b>độ trễ đuôi</b> (p99)</td><td>thời gian trả lời mà 99% yêu cầu nhanh hơn nó — phần chậm nhất của phân bố</td></tr>
          <tr><td><b>thư viện gọi dịch vụ chung</b></td><td>một thư viện mọi đội dùng để gọi nhau: tìm máy, chia tải, thử lại, đo đếm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Nguyên khối là một ứng dụng làm mọi việc, từ nhận yêu cầu, hiển thị, nghiệp vụ, tới đọc ghi cơ sở dữ liệu. Dịch vụ là một chương trình riêng lo một việc, và các dịch vụ gọi nhau qua mạng. Máy ảo Java là nền chạy chung cho chương trình viết bằng Java và các ngôn ngữ cùng họ. Bài đăng mỗi giây, trên màn hình ghi bằng tên tiếng Anh, là số dòng trạng thái được đăng trong một giây. Độ trễ đuôi là thời gian trả lời mà 99% yêu cầu nhanh hơn nó, tức phần chậm nhất. Thư viện gọi dịch vụ chung là thư viện mọi đội cùng dùng để tìm máy, chia tải, thử lại và đo đếm."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2006 → 2008</text><text x="160" y="200">một ứng dụng Ruby</text><text x="160" y="232">một cơ sở dữ liệu</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2010</text><text x="500" y="200">World Cup: sự cố</text><text x="500" y="232">200–300 yêu cầu mỗi máy</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">từ 2010</text><text x="850" y="200">tách dịch vụ theo danh từ</text><text x="850" y="232">máy ảo Java, thư viện chung</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2013</text><text x="1200" y="200">đỉnh 143 199 tweet/s</text><text x="1200" y="232">gấp 24 lần lúc thường</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2014</text><text x="1540" y="200">đo tỉ lệ lỗi, độ trễ đuôi</text><text x="1540" y="232">chia máy cho cả trung tâm</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → đỉnh tải kỷ lục → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Từ 2006 tới 2008, cả trang là một ứng dụng Ruby với một cơ sở dữ liệu, rồi năm 2010 mùa giải bóng đá thế giới làm lộ giới hạn của nó. Từ 2010, Twitter tách dần thành các dịch vụ chạy trên máy ảo Java, với một thư viện gọi dịch vụ chung. Năm 2013 là đỉnh tải kỷ lục, và năm 2014 là lúc họ đo tỉ lệ lỗi, độ trễ đuôi, và chia máy cho cả trung tâm dữ liệu."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: split
    kind: concept
    title: "Cơ chế chung: từ một khối sang các dịch vụ theo danh từ"
    steps:
      - show: |
          <div><svg width="1560" height="360" viewBox="0 0 1560 360">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <text x="250" y="36" font-weight="bold">trước: nguyên khối</text>
          <rect x="60" y="60" width="380" height="170" rx="10" fill="#fde2e2" stroke="#e11d48" stroke-width="3"/>
          <text x="250" y="100">một ứng dụng Ruby</text><text x="250" y="136">định tuyến, hiển thị,</text><text x="250" y="168">nghiệp vụ, kết nối dữ liệu</text><text x="250" y="204">đổi một chỗ: triển khai lại hết</text>
          <rect x="140" y="275" width="220" height="60" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="250" y="313">cơ sở dữ liệu</text>
          <text x="1060" y="36" font-weight="bold">sau: dịch vụ theo danh từ cốt lõi</text>
