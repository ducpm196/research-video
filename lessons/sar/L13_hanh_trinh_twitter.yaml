source: "curriculum/sar.yaml L13; audit/sar/sources_L13.md (câu trích nguyên văn, đọc 2026-11-02); audit/sar/verify_sar.py L13; C. Aniszczyk (Head of Open Source, Twitter), Scaling Twitter with Open Source, bài trình bày, 2014 (năm suy từ nội dung) [AN14]; B. Degenhardt (Twitter), Lessons Learned in Scaling Twitter, QCon London 2014 [BD14]; M. Eriksen (Twitter), Your Server as a Function, bản tiền ấn phẩm 27/9/2013, PLOS 2013 [ME13]; bài blog Twitter 2013 “New Tweets per second record, and how!” KHÔNG đọc được (403/429) — chỉ dùng con số mà AN14 dẫn; SAR bài 2 (ước lượng), bài 3 (ranh giới), bài 5 (làm tròn lên), bài 6 (sẵn sàng), bài 7 (áp lực ngược); khoá CLD bài 15 (Borg → Kubernetes)"
assumes: [arith]
# Quy ước: “nguyên khối” = monolith (một ứng dụng làm mọi việc, Twitter gọi là monorail); “dịch vụ” = service (một chương trình riêng,
#   gọi nhau qua mạng); “máy ảo Java” = JVM; “tweet mỗi giây” = TPS; “thư viện gọi dịch vụ chung” = Finagle; “độ trễ đuôi” = phân vị cao
#   (p99) của thời gian trả lời. Mọi sự kiện và con số có nguồn ghi trong audit/sar/sources_L13.md. Con số khác là phép tính lại (checks)
#   hoặc ghi “(số minh hoạ)”: 30 000 yêu cầu mỗi giây, 10 ms mỗi lần gọi, 1% chậm, ba cụm 100 máy, quiz 400 yêu cầu/s, 250 yêu cầu mỗi máy.
#   Lời đọc không nói “Rails”, “MySQL”, “Finagle”, “Mesos”, “Scala”, “QCon”: nói “ứng dụng Ruby”, “cơ sở dữ liệu quan hệ”, “thư viện gọi
#   dịch vụ chung”, “hệ chia máy cho cả trung tâm dữ liệu”, “một ngôn ngữ chạy trên máy ảo Java”, “một hội nghị ở Luân Đôn”.
#   Tên Twitter, Ruby, Java, tweet: lexicon_vi.SAR.yaml (probe p2, p3).
objectives:
  - "Kể lại hành trình của Twitter qua năm chặng từ 2006 tới 2014, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng: dung lượng mỗi ngày, số máy, độ trễ tuần tự và song song, hệ số cao điểm, số lỗi mỗi giây"
  - "Chọn giữa thêm máy và tách dịch vụ ở quy mô của chính mình, kèm điều kiện đổi lựa chọn"
