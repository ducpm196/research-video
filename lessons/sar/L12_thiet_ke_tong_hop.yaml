# Quy ước: dịch vụ rút gọn đường dẫn. Giả định yêu cầu: 100 triệu đường dẫn mới mỗi tháng, đọc gấp 100 lần ghi, lưu 5 năm, 500 byte mỗi bản ghi,
#   mã ngắn 7 ký tự trong bảng 62 ký tự (a–z, A–Z, 0–9), cao điểm gấp 3, tháng 30 ngày (alg.shortener_estimate). Số va chạm kỳ vọng khi sinh mã
#   NGẪU NHIÊN: xấp xỉ n²/(2N) (bài toán ngày sinh).
objectives:
  - "Đi đủ các bước: yêu cầu, ước lượng, thành phần, dữ liệu, đánh đổi, rủi ro"
  - "Trình bày bản thiết kế có số liệu và bản ghi quyết định"
  - "Dùng lại công cụ của các bài trước"
