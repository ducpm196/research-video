  kind: intuition
  title: 'Thùng token: vòi nạp chậm, cửa ra có điều kiện'
  steps:
  - show: '<div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="22" fill="#1f2937"><text x="20" y="150">1000
      yêu cầu</text><text x="20" y="178">mỗi giây</text><line x1="160" y1="160" x2="560" y2="160" stroke="#1f2937" stroke-width="3"/><polygon
