- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">thùng token: dồn ngắn tới B, trung bình không quá r</span><span class="a">→</span>

      <span class="n">giới hạn theo từng khách</span><span class="a">→</span>

      <span class="n">giảm tải: bỏ việc ít quan trọng</span><span class="a">→</span>

      <span class="n">từ chối sớm, kèm thời gian thử lại</span></div>

      '
    say: Tổng kết lại, thùng token cho dồn ngắn tới B mà trung bình không quá r, và nên giới hạn theo từng khách. Giảm tải
      bằng cách bỏ việc ít quan trọng, và từ chối sớm, kèm thời gian nên thử lại. Khi giao diện lập trình tiếp nhận lưu lượng
      dồn cục, thùng giới hạn giúp bảo vệ tài nguyên phía sau. Kiểm soát tải từ biên giúp tầng lưu trữ luôn hoạt động trong
      vùng hiệu năng tối ưu.
  - show: '<div class="box key"><b>Tư duy:</b> một hệ thống bền không phải hệ thống không bao giờ quá tải, mà là hệ thống
      <b>biết cách nói “không”</b> khi quá tải.</div>

      <p class="note"><b>So sánh hai quy mô:</b> cụm 10 máy tự co giãn lên 20 máy chỉ giúp nâng giới hạn từ 100 lên 200 yêu
      cầu/giây; trước đợt dồn 1 000 yêu cầu/giây, thùng token tốc độ 10/s (sức chứa 20) chỉ nhận 69 và từ chối phần dư để
      giữ dịch vụ còn sống.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, một hệ thống bền không phải hệ thống không bao giờ quá tải, mà là hệ thống biết cách nói không
      khi quá tải. Xét hai mức quy mô, co giãn gấp đôi chỉ nâng ngưỡng từ 100 lên 200 lượt mỗi giây. Trước đợt dồn 1 000 lượt
      mỗi giây, thùng token chỉ nhận 69 lượt để giữ hệ thống sống. Thuật toán xô thẻ cân bằng gọn gàng giữa hạn mức trung
      bình và nhu cầu đột biến ngắn hạn.
