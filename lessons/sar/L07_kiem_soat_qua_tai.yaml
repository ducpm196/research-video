id: L07
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 7 — Kiểm soát quá tải: giới hạn tốc độ, giảm tải, áp lực ngược"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L07; audit/sar/verify_sar.py L07; J. S. Turner, New Directions in Communications (or Which Way to the Information Age?), IEEE Communications Magazine 24(10), 1986 (thùng rò, thùng token); Google SRE Book (2016), chương 21 (xử lý quá tải) và 22 (lỗi dây chuyền); CLD bài 10"
assumes: [arith, cdot]
# Quy ước: thùng token sức chứa B, nạp r token mỗi giây, bắt đầu đầy; mỗi yêu cầu lấy 1 token, hết token thì bị từ chối (alg.token_bucket).
#   Ví dụ: r = 10, B = 20, dồn 1000 yêu cầu mỗi giây trong 5 giây (5000 yêu cầu cách nhau 1 ms).
objectives:
  - "Cài thùng token"
  - "Thiết kế từ chối có kiểm soát khi quá tải"
  - "Dùng áp lực ngược thay vì để hàng đợi phình vô hạn"
asr_reviewed:
