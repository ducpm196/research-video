      y2="110" stroke="#059669" stroke-width="3" stroke-dasharray="6 5"/><path d="M600 110 L620 290 L820 290 L840 110" fill="none"
      stroke="#2a78d6" stroke-width="4"/><rect x="626" y="230" width="188" height="56" fill="#93c5fd"/><text x="720" y="265"
      text-anchor="middle">còn token</text><text x="720" y="320" text-anchor="middle" fill="#2a78d6">sức chứa 20 token</text><line
      x1="860" y1="160" x2="1100" y2="110" stroke="#059669" stroke-width="3"/><text x="1110" y="105" fill="#059669" font-weight="bold">có
      token: lấy 1, nhận</text><line x1="860" y1="190" x2="1100" y2="240" stroke="#b91c1c" stroke-width="3"/><text x="1110"
      y="235" fill="#b91c1c" font-weight="bold">hết token: từ chối ngay</text><text x="1110" y="263" fill="#b91c1c">báo “thử
      lại sau”</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ thùng token như một cái thùng có vòi nạp. Vòi nạp đều 10 token mỗi giây, nhưng thùng chỉ chứa được 20, nạp
      thêm khi đầy thì tràn mất. Mỗi yêu cầu đến phải lấy 1 token, còn token thì được nhận, hết token thì bị từ chối ngay
      và được báo thử lại sau. Người dùng nhận mã báo bận ngay trong vài mi li giây thay vì chờ treo cả phút vô ích.
- id: example
  kind: example
  title: Thùng 10 token mỗi giây, sức chứa 20
  checks:
  - alg.token_bucket(10, 20, [i * 0.001 for i in range(5000)]) == 69 and 20 + 10 * 4.999 < 70
  - alg.token_bucket(10, 20, [i * 0.001 for i in range(20)]) == 20 and round(10 * 4.999, 2) == 49.99 and math.floor(20 + 10
    * 4.999) == 69 and 5000 - 69 == 4931
  steps:
  - show: '<p><b>Bước 1 — token có sẵn:</b> khách dồn 1000 yêu cầu mỗi giây trong 5 giây, tổng 5000 yêu cầu. Thùng bắt đầu
      <b>đầy 20</b> token → 20 yêu cầu đầu (đến trong 20 mi li giây đầu) được nhận ngay.</p>

      '
    say: Bước một, khách dồn 1000 yêu cầu mỗi giây trong 5 giây, tổng 5000 yêu cầu. Thùng bắt đầu đầy với 20 token, nên 20
      yêu cầu đầu tiên, đến trong 20 mi li giây đầu, được nhận ngay. Mỗi yêu cầu đi qua ngay lập tức tiêu tốn đúng một thẻ
      trong sức chứa dự trữ ban đầu.
  - show: '<p><b>Bước 2 — token nạp thêm:</b> yêu cầu cuối đến lúc 4,999 giây. Từ lúc bắt đầu tới đó vòi nạp $10 \cdot 4{,}999
      = 49{,}99$ token. Thùng không bao giờ đầy lại (vừa có token là bị lấy ngay), nên không token nào bị tràn mất.</p>

      '
    say: Bước hai, yêu cầu cuối đến lúc 4 phẩy 999 giây. Từ lúc bắt đầu tới đó, vòi nạp 10 nhân 4 phẩy 999, bằng 49 phẩy 99
      token. Thùng không bao giờ đầy lại, vì vừa có token là bị lấy ngay, nên không token nào bị tràn mất. Nhờ giữ nguyên
      lượng thẻ tích lũy không tràn đáy, cụm máy sẵn sàng đón đợt bùng phát kế tiếp.
  - show: '<p><b>Bước 3 — cộng lại, bỏ phần lẻ:</b> $20 + 49{,}99 = 69{,}99$ token, mỗi yêu cầu cần trọn 1 token → nhận $\hl{69}$
      yêu cầu.</p>

      '
    say: Bước ba, cộng lại được 20 cộng 49 phẩy 99, bằng 69 phẩy 99 token. Mỗi yêu cầu cần trọn 1 token, nên bỏ phần lẻ, nhận
      được 69 yêu cầu.
  - clear: true
    show: '<p><b>Bước 4 — gom lại:</b></p>

      <table class="t"><tr><th>nguồn token</th><th>số lượng</th></tr>

      <tr><td>có sẵn lúc đầu</td><td>20</td></tr>

      <tr><td>nạp thêm trong 4,999 giây</td><td>≈ 49,99 → dùng được 49</td></tr>

      <tr><td><b>số yêu cầu được nhận</b></td><td>$\hl{69}$ trên 5000</td></tr></table>

      <div class="box key">4931 yêu cầu bị từ chối <b>ngay</b>, với mã lỗi “quá nhiều yêu cầu” và thời điểm nên thử lại —
      máy chủ không mất công xử lý chúng, khách khác vẫn được phục vụ.</div>

      <p class="note"><b>Áp lực ngược thay vì để hàng đợi phình vô hạn:</b> từ chối sớm bằng mã quá tải giữ hàng đợi trong
      giới hạn cố định và bảo vệ thông lượng.</p>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    - 3
    - 4
    say: Bước bốn, bảng gom lại số token dùng được. Có sẵn lúc đầu là 20. Nạp thêm trong 4 phẩy 999 giây được khoảng 49 phẩy
      99, tức dùng được 49. Tổng số yêu cầu được nhận là 69 trên 5000. Còn 5000 trừ 69, bằng 4931 yêu cầu bị từ chối ngay.
      Chúng nhận mã lỗi quá nhiều yêu cầu và thời điểm nên thử lại, nên máy chủ không mất công xử lý chúng và khách khác vẫn
      được phục vụ. Tách riêng xô thẻ theo từng định danh khách hàng giữ công bằng tuyệt đối khi chia sẻ hạ tầng. Từ chối
      sớm như vậy chính là áp lực ngược giúp giữ hàng đợi luôn nằm trong giới hạn an toàn thay vì để nó phình vô hạn.
  - clear: true
    show: '<p><b>Bước 5 — cài thùng token bằng Python:</b> mỗi yêu cầu nạp thêm theo thời gian trôi qua, kẹp không vượt sức chứa <code>B</code>.</p>

      <div class="code"><div>tok, last, ok = 20.0, 0.0, 0</div><div>for i in range(5000):</div><div>    t = i * 0.001</div><div>    tok = min(20, tok + (t - last) * 10); last = t</div><div>    if tok &gt;= 1: tok -= 1; ok += 1</div><div>print(ok)  # 69</div></div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước năm, đây là cài đặt thùng token chỉ mất sáu dòng mã kiểm thử. Trước mỗi yêu cầu ta cộng lượng nạp mới vào thùng và kẹp không vượt sức chứa hai mươi, rồi trừ đi một nếu còn đủ. Chạy qua năm nghìn yêu cầu cách đều một mi li giây sẽ đếm ra đúng sáu mươi chín lượt được nhận, khớp hoàn toàn phép tính tay.
