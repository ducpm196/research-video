      và 9 token vừa nạp. Mỗi giây sau chỉ nhận thêm 10, vì thùng đã cạn và chỉ còn vòi nạp 10 token mỗi giây. Cộng dồn sau
      5 giây là 69, khớp với cách tính ở trên.
  - show: '<table class="t"><tr><th>kiểm thêm</th><th>tính</th><th>kết quả</th></tr>

      <tr><td>trần lý thuyết</td><td>$B + r \cdot T = 20 + 10 \cdot 5 = 70 \geq 69$</td><td>✓</td></tr>

      <tr><td>khách <b>lịch sự</b>: đều 10 yêu cầu/s trong 5 giây</td><td>50 yêu cầu</td><td>nhận đủ $\hl{50}$ ✓ — thùng chỉ
      chặn phần vượt</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    introduces:
    - geq
    say: Thêm hai kiểm tra nữa. Trần lý thuyết là B cộng r nhân T, bằng 20 cộng 10 nhân 5, bằng 70, không nhỏ hơn 69. Còn
      khách lịch sự gửi đều 10 yêu cầu mỗi giây trong 5 giây, tổng 50 yêu cầu, thì được nhận đủ cả 50, vì thùng chỉ chặn phần
      vượt. Giới hạn tốc độ theo xô thẻ vừa giữ lưu lượng trung bình ổn định vừa cho phép xử lý đợt tăng ngắn.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc, 1 lỗi người đã đi làm
  checks:
  - 10 * 10 == 100 and 20 * 10 == 200 and 100 // 20 == 5 and 20 * 5 == 100
  - sum([1, 2, 4, 8]) == 15 and [2 ** i for i in range(4)] == [1, 2, 4, 8] and 1000 / 8 == 125
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Không biết từ chối <b class="red">(sụp hẳn)</b>

      <br><span class="note">Nhận hết để “không phụ lòng khách”: hàng đợi phình (như bảng chuẩn bị: đến 1000, làm 100, mỗi
      giây thêm 900 việc chờ), độ trễ bùng nổ, hết giờ, thử lại, sập. Từ chối nhanh một phần còn hơn phục vụ chậm tất cả.</span></div>

      '
    say: Lỗi thứ nhất, không biết từ chối. Như bảng ở phần chuẩn bị, đến 1000 mà làm 100 thì mỗi giây thêm 900 việc chờ. Nhận
      hết để không phụ lòng khách thì hàng đợi phình, độ trễ bùng nổ, hết giờ, thử lại, rồi sập. Từ chối nhanh một phần còn
      hơn phục vụ chậm tất cả. Cố nhồi thêm yêu cầu vượt công suất thực chỉ biến sự cố cục bộ thành sập toàn hệ thống.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Giới hạn chung cho mọi khách <b class="red">(một người làm hại tất cả)</b>

      <br><span class="note">Một kịch bản lỗi dùng hết hạn mức chung, mọi khách khác bị từ chối. Giới hạn <b>theo từng khách</b>:
      mỗi khoá truy cập (mã riêng khách gửi kèm mỗi yêu cầu để máy chủ biết ai gọi) một thùng.</span></div>

      '
    say: Lỗi thứ hai, đặt giới hạn chung cho mọi khách. Một kịch bản lỗi dùng hết hạn mức chung thì mọi khách khác bị từ chối,
      nên hãy giới hạn theo từng khách. Mỗi khoá truy cập, tức mã riêng mà khách gửi kèm mỗi yêu cầu để máy chủ biết ai gọi,
      có một thùng riêng. Thiếu bước định danh khách gọi khiến một đoạn mã lỗi làm tê liệt mọi người dùng còn lại.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Từ chối mà không nói khi nào thử lại <b class="red">(bão thử lại)</b>

      <br><span class="note">Khách thử lại ngay lập tức, tải dồn thêm đúng lúc máy đang quá tải. Trả kèm thời gian chờ đề
      nghị, và khách thử lại <b>có lùi, có ngẫu nhiên</b>:</span></div>

      <table class="t"><tr><th>cách thử lại</th><th>làm gì</th><th>1000 khách bị từ chối cùng lúc</th></tr>

      <tr><td><b>lùi</b> (gấp đôi thời gian chờ)</td><td>chờ 1, 2, 4, 8 giây: bốn lần thử trải trên $1 + 2 + 4 + 8 = 15$ giây</td><td>vẫn
      cả 1000 thử lại cùng giây thứ 1</td></tr>

      <tr><td><b>lùi + ngẫu nhiên</b></td><td>mỗi lần chờ một số bất kỳ từ 0 tới mức đó (lần thứ tư: 0 đến 8 giây)</td><td>lần
      thứ tư trải ra 8 giây: khoảng $\frac{1000}{8} = \hl{125}$ khách mỗi giây</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.3'
    say: Lỗi thứ ba, từ chối mà không nói khi nào thử lại. Khách thử lại ngay lập tức thì tải dồn thêm đúng lúc máy đang quá
      tải, nên hãy trả kèm thời gian chờ đề nghị, và để khách thử lại có lùi, có ngẫu nhiên. Bảng giải thích hai chữ đó. Lùi
      là mỗi lần thất bại thì chờ gấp đôi, 1, 2, 4, 8 giây, nên bốn lần thử trải trên 15 giây. Nhưng nếu 1000 khách bị từ
      chối cùng lúc, cả 1000 vẫn thử lại cùng giây thứ nhất. Thêm ngẫu nhiên là mỗi lần chờ một số bất kỳ từ 0 tới mức đó,
      lần thứ tư là từ 0 đến 8 giây. Khi đó 1000 khách trải ra 8 giây, chỉ khoảng 125 khách mỗi giây, máy kịp thở.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đặt giới hạn trên <b>từng máy chủ</b> rồi quên rằng số máy
      thay đổi <b class="red">(hạn mức trôi theo số máy)</b></div>

      <table class="t"><tr><th>số máy</th><th>giới hạn mỗi máy</th><th>khách thật sự được gửi</th></tr>

      <tr><td>10</td><td>10 yêu cầu/s</td><td>100 yêu cầu/s (đúng hợp đồng)</td></tr>

      <tr><td>20 (tự động thêm máy lúc đông)</td><td>10 yêu cầu/s</td><td>$\hl{200}$ yêu cầu/s — gấp đôi</td></tr></table>

      <p class="note">Người làm nghề đếm hạn mức ở <b>một kho đếm chung</b>, hoặc chia hạn mức cho số máy đang chạy: 20 máy
      thì mỗi máy $\frac{100}{20} = 5$ yêu cầu/s.</p>

      '
    introduces:
    - frac
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - 3
    say: Lỗi thứ tư hay gặp ở người đã đi làm, là đặt giới hạn trên từng máy chủ rồi quên rằng số máy thay đổi. Với 10 máy,
      mỗi máy cho khách 10 yêu cầu mỗi giây, thì khách được 100 yêu cầu mỗi giây, đúng hợp đồng. Lúc đông, hệ thống tự thêm
      lên 20 máy, mỗi máy vẫn cho 10, nên khách được gửi tới 200, gấp đôi. Đó là lúc hệ thống đang đông nhất, nên hạn mức
      nới ra đúng lúc cần chặt nhất. Người làm nghề đếm hạn mức ở một kho đếm chung, hoặc chia hạn mức cho số máy đang chạy,
      20 máy thì mỗi máy 100 chia 20, bằng 5 yêu cầu mỗi giây.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.token_bucket(5, 10, [i * 0.01 for i in range(200)]) == 19 and alg.token_bucket(100, 50, [i * 0.005 for i in range(1000)])
    == 549
  - 199 * 0.01 == 1.99 and round(5 * 1.99, 2) == 9.95 and math.floor(10 + 5 * 1.99) == 19
  - 999 * 0.005 == 4.995 and math.floor(50 + 100 * 4.995) == 549 and 200 / 100 == 2
  - alg.token_bucket(5, 30, [0.0] * 30) == 30 and alg.token_bucket(5, 20, [0.0] * 30) == 20
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Thùng 5 token mỗi giây, sức chứa 10. Khách gửi 100 yêu cầu mỗi giây trong 2 giây (200 yêu cầu). Nhận
      bao nhiêu?</td></tr>

      <tr><td>2</td><td>Thùng 100 mỗi giây, sức chứa 50; khách gửi 200 mỗi giây trong 5 giây (1000 yêu cầu). Nhận bao nhiêu?
      Vì sao gần một nửa?</td></tr>

      <tr><td>3</td><td>Khách hợp lệ đôi khi dồn <b>30</b> yêu cầu cùng lúc, trung bình 5 mỗi giây. Chọn tốc độ nạp $r$ và
      sức chứa $B$ thế nào?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, thùng 5 token mỗi giây, sức chứa 10, khách gửi 100 yêu cầu mỗi giây trong 2
      giây, tức 200 yêu cầu, được nhận bao nhiêu? Câu hai, thùng 100 mỗi giây, sức chứa 50, khách gửi 200 mỗi giây trong 5
      giây, tức 1000 yêu cầu, được nhận bao nhiêu? Vì sao gần một nửa? Câu ba, khách hợp lệ đôi khi dồn 30 yêu cầu cùng lúc,
      trung bình 5 mỗi giây. Chọn tốc độ nạp r và sức chứa B thế nào? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① 200 yêu cầu cách nhau 0,01 giây → yêu cầu cuối đến lúc 1,99 giây. Có sẵn 10, nạp thêm $5 \cdot 1{,}99 = 9{,}95$
      → tổng $10 + 9{,}95 = 19{,}95$ → bỏ phần lẻ: $\hl{19}$ yêu cầu.</p>

      '
    say: Đáp án câu một, 200 yêu cầu cách nhau 0 phẩy 01 giây, nên yêu cầu cuối đến lúc 1 phẩy 99 giây. Có sẵn 10 token, nạp
      thêm 5 nhân 1 phẩy 99, bằng 9 phẩy 95. Tổng là 19 phẩy 95, bỏ phần lẻ thì nhận 19 yêu cầu. Cần làm tròn xuống thành
      số nguyên khi tính số lượt phục vụ từ lượng thẻ khả dụng.
  - show: '<p>② Yêu cầu cuối đến lúc 4,995 giây: $50 + 100 \cdot 4{,}995 = 549{,}5$ → $\hl{549}$. Khách gửi 200 mỗi giây,
      gấp đôi tốc độ nạp 100, nên về lâu dài chỉ được nhận khoảng một nửa.</p>

      '
    say: Câu hai, yêu cầu cuối đến lúc 4 phẩy 995 giây. Có 50 token sẵn cộng 100 nhân 4 phẩy 995, bằng 549 phẩy 5, nên nhận
      549. Khách gửi 200 mỗi giây, gấp đôi tốc độ nạp 100, nên về lâu dài chỉ được nhận khoảng một nửa. Phần tải kéo dài sau
      khi cạn thẻ buộc phải tuân theo nhịp cấp thẻ cố định từng giây.
  - show: '<table class="t"><tr><th>chọn</th><th>khách dồn 30 cùng lúc được nhận</th><th>kết luận</th></tr>

      <tr><td>$r = 5$, $B = 20$</td><td>20</td><td>chặn nhầm 10 yêu cầu hợp lệ</td></tr>

      <tr><td>$r = 5$, $B = 30$</td><td>$\hl{30}$</td><td>đủ: dồn ngắn tới 30, trung bình không quá 5</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Câu ba là một quyết định. Tốc độ nạp r đặt bằng mức trung bình, 5 mỗi giây, còn sức chứa B phải đủ cho lần dồn lớn
      nhất. Nếu chọn B bằng 20 thì khách dồn 30 chỉ được nhận 20, chặn nhầm 10 yêu cầu hợp lệ. Chọn B bằng 30 thì nhận đủ
      30, mà trung bình về lâu dài vẫn không quá 5 mỗi giây.
