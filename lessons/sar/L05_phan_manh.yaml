id: L05
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 5 — Mở rộng dữ liệu: bản sao đọc, phân mảnh, chọn khoá phân mảnh"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L05; audit/sar/verify_sar.py L05; M. Kleppmann, Designing Data-Intensive Applications (O'Reilly, 2017), chương 5 (sao chép) và 6 (phân mảnh); DSY bài 3 (sao chép), DSY bài 6 (băm nhất quán)"
assumes: [arith, cdot, frac, ceil]
# Quy ước: số nút = ⌈dữ liệu / dung lượng mỗi nút⌉ × hệ số sao chép (alg.shard_nodes). alg.hot_shard(khoá, số mảnh, hàm khoá) trả (tải mảnh đông nhất,
#   tải trung bình). Băm khoá khách bằng CRC-32 (zlib). 10 000 lần ghi trong một ngày; khoá ngày tạo = cùng một giá trị cho mọi lần ghi hôm nay.
objectives:
  - "Ước lượng số nút cần"
  - "Phân biệt mở rộng đọc và mở rộng ghi"
  - "Chọn khoá phân mảnh tránh điểm nóng"
