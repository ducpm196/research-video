id: L01
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 1 — Ghi lại quyết định kiến trúc"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L01; audit/sar/verify_sar.py L01; M. Nygard, Documenting Architecture Decisions (cognitect.com, 2011); J. Bezos, thư gửi cổ đông Amazon 2015 (quyết định “cửa một chiều” và “cửa hai chiều”); L. Bass và cộng sự, Software Architecture in Practice, 4th ed. (2021), chương 22"
assumes: [arith, frac, approx]
# Quy ước: bản ghi quyết định kiến trúc (ADR) = một trang: bối cảnh, quyết định, các lựa chọn đã cân nhắc, hệ quả. ADR chỉ trên màn hình;
#   lời đọc “bản ghi quyết định”. Số liệu trong ví dụ là số đo giả định của một bản thử nghiệm, ghi kèm trong bản ghi.
objectives:
  - "Viết bản ghi quyết định: bối cảnh, lựa chọn, hệ quả"
  - "Phân biệt quyết định đảo ngược được và khó đảo ngược"
  - "Ghi số liệu làm căn cứ"
asr_reviewed:
  - {sentence: "Tải ghi hiện tại là 900 mỗi giây.", reason: "ASR chép “tại vì hiện tại là 900 mỗi dây.” (0.778): lệch âm/thanh thuần Việt: tải ghi/tại vì — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Ai quyết định thế này, và vì sao?”"
    steps:
      - show: |
          <p>Hai năm sau, một kỹ sư mới thấy hệ thống dùng một <b>cơ sở dữ liệu quan hệ</b> duy nhất (dữ liệu xếp thành các bảng, nằm trên một máy) và đề xuất “chuyển sang loại <b>phân tán</b> — chia dữ liệu ra nhiều máy — cho hiện đại”. Không ai nhớ vì sao ngày trước chọn như vậy. Có thể lý do vẫn còn đúng — có thể không.</p>
          <div class="box key">Hôm nay: <b>bản ghi quyết định kiến trúc</b> — một trang ngắn giữ lại <b>vì sao</b>, không chỉ <b>cái gì</b>.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, hai năm sau, một kỹ sư mới thấy hệ thống dùng một cơ sở dữ liệu quan hệ duy nhất, tức dữ liệu xếp thành các bảng trên một máy. Anh ấy đề xuất chuyển sang loại phân tán, chia dữ liệu ra nhiều máy, cho hiện đại. Không ai nhớ vì sao ngày trước lại chọn như vậy. Có thể lý do vẫn còn đúng, có thể không. Hôm nay ta học bản ghi quyết định kiến trúc, một trang ngắn giữ lại vì sao, không chỉ cái gì."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: kịch bản có số, dư địa, giao dịch"
    checks:
      - "147.7 < 200 and 1000 / 250 == 4 and 1000 / 2 == 500"
      - "10 - 3 == 7"
    steps:
      - show: |
          <p><b>Bài 0</b>: mỗi thuộc tính chất lượng cần một kịch bản có thước đo, ví dụ “95% yêu cầu dưới 200 ms”; đo được phân vị 95 là 147,7 ms → đạt. Kiến trúc là một bộ <b>đánh đổi</b>: được cái này thì mất cái kia.</p>
        say: "Trước hết, ôn ba điều sẽ dùng. Ở bài 0, ta đã học mỗi thuộc tính chất lượng cần một kịch bản có thước đo. Ví dụ, kịch bản 95 phần trăm yêu cầu dưới 200 mi li giây, đo được phân vị 95 là 147 phẩy 7 nên đạt. Ta cũng thấy kiến trúc là một bộ đánh đổi, được cái này thì mất cái kia."
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>cách tính</th><th>ví dụ</th></tr>
          <tr><td><b>dư địa</b></td><td>$\frac{\text{sức chịu đo được}}{\text{tải hiện tại}}$</td><td>máy chịu 1000/s, tải 250/s → $\frac{1000}{250} = \hl{4}$ lần</td></tr>
          <tr><td><b>ngưỡng xem lại</b></td><td>một phần sức chịu, chọn trước</td><td>một nửa của 1000 → 500/s</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thứ hai, dư địa bằng sức chịu đo được chia cho tải hiện tại. Máy chịu được 1000 yêu cầu mỗi giây mà tải chỉ 250 thì dư địa là 4 lần. Ngưỡng xem lại là một phần sức chịu chọn trước, ví dụ một nửa của 1000 là 500 mỗi giây, tải chạm mốc đó thì phải nghĩ lại."
      - show: |
          <p><b>Giao dịch</b>: gói nhiều thay đổi trên nhiều bảng thành một khối, xảy ra <b>cùng nhau hoặc không cái nào</b>. Kho còn 10, khách đặt 3 — cần hai thay đổi: ghi một dòng vào bảng đơn, và đổi kho thành $10 - 3 = 7$.</p>
          <table class="t"><tr><th>máy sập ngay sau thay đổi thứ nhất</th><th>bảng đơn</th><th>bảng kho</th></tr>
          <tr><td>không có giao dịch</td><td>có đơn 3 cái</td><td class="red">vẫn 10 — lệch</td></tr>
          <tr><td>có giao dịch</td><td>chưa có đơn</td><td>vẫn 10 — khớp, khách đặt lại</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Thứ ba, ta cần hiểu giao dịch là gì. Giao dịch gói nhiều thay đổi trên nhiều bảng thành một khối, xảy ra cùng nhau hoặc không cái nào. Ví dụ kho còn 10, khách đặt 3, cần ghi một dòng vào bảng đơn và đổi kho thành 7. Nếu máy sập ngay sau thay đổi thứ nhất mà không có giao dịch, bảng đơn có đơn nhưng kho vẫn 10, hai bảng lệch nhau. Có giao dịch thì thay đổi dở dang bị huỷ cả khối, chưa có đơn và kho vẫn 10, hai bảng khớp, khách chỉ cần đặt lại."

  - id: sym
    kind: symbol
    title: "Giải mã: bản ghi quyết định, hai loại cửa"
    steps:
      - show: |
          <table class="t"><tr><th>mục</th><th>trả lời</th></tr>
          <tr><td><b>bối cảnh</b></td><td>bài toán, ràng buộc, số liệu lúc đó</td></tr>
          <tr><td><b>quyết định</b></td><td>chọn gì, một câu</td></tr>
          <tr><td><b>các lựa chọn khác</b></td><td>đã cân nhắc gì, vì sao không chọn</td></tr>
          <tr><td><b>hệ quả</b></td><td>được gì, mất gì, <b>khi nào nên xem lại</b></td></tr></table>
          <p><b>Cửa hai chiều</b>: quyết định dễ đảo ngược (đổi thư viện ghi nhật ký) — quyết nhanh. <b>Cửa một chiều</b>: rất khó đảo ngược (khoá phân mảnh — trường quyết định mỗi bản ghi nằm ở máy nào; định dạng dữ liệu công khai) — cân nhắc kỹ, ghi kỹ.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2, 2]
        say: "Bảng liệt kê bốn mục của một bản ghi quyết định. Bối cảnh ghi bài toán, ràng buộc và số liệu lúc đó. Quyết định ghi chọn gì, trong một câu. Các lựa chọn khác ghi đã cân nhắc gì và vì sao không chọn. Hệ quả ghi được gì, mất gì, và khi nào nên xem lại. Cửa hai chiều là quyết định dễ đảo ngược, như đổi thư viện ghi nhật ký, nên quyết nhanh. Cửa một chiều là quyết định rất khó đảo ngược, như chọn định dạng dữ liệu công khai, hay chọn khoá phân mảnh, nên cân nhắc kỹ và ghi kỹ. Khoá phân mảnh là trường quyết định mỗi bản ghi nằm ở máy nào, đổi nó là phải dời gần hết dữ liệu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bản ghi giữ lại lý do và vạch phải nghĩ lại"
    checks:
      - "5000 / 2 == 2500 and 300 < 900 < 2500 < 2600 < 5000"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><g font-size="21" fill="#1f2937"><line x1="60" y1="280" x2="1100" y2="280" stroke="#6b7280" stroke-width="2"/><line x1="60" y1="60" x2="1100" y2="60" stroke="#b91c1c" stroke-width="3"/><line x1="60" y1="170" x2="1100" y2="170" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 8"/><rect x="150" y="267" width="150" height="13" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/><text x="225" y="259" text-anchor="middle" font-weight="bold">300/s</text><text x="225" y="306" text-anchor="middle">lúc quyết định</text><text x="225" y="332" text-anchor="middle"></text><rect x="500" y="240" width="150" height="40" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/><text x="575" y="232" text-anchor="middle" font-weight="bold">900/s</text><text x="575" y="306" text-anchor="middle">hai năm sau</text><text x="575" y="332" text-anchor="middle"></text><rect x="850" y="166" width="150" height="114" fill="#fdba74" stroke="#1f2937" stroke-width="2"/><text x="925" y="158" text-anchor="middle" font-weight="bold">2600/s</text><text x="925" y="306" text-anchor="middle">khi tải vượt</text><text x="925" y="332" text-anchor="middle">ngưỡng</text><text x="1120" y="67" fill="#b91c1c" font-weight="bold">sức chịu đo được 5000/s</text><text x="1120" y="177" fill="#eb6834" font-weight="bold">ngưỡng xem lại 2500/s</text><text x="1120" y="230" fill="#1f2937">bản ghi giữ cả hai</text><text x="1120" y="256" fill="#1f2937">vạch này</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ tải ghi của hệ thống đơn hàng qua thời gian. Vạch đỏ là sức chịu đo được, 5000 lần ghi mỗi giây, vạch cam đứt là ngưỡng xem lại 2500, một nửa sức chịu. Lúc quyết định, tải chỉ 300, hai năm sau là 900, vẫn dưới vạch cam nên quyết định cũ còn đúng. Khi tải vượt vạch cam, bản ghi tự nói rằng đã tới lúc nghĩ lại, chứ không chờ ai đó nhớ ra."

  - id: example
    kind: example
    title: "Một bản ghi quyết định có số liệu"
    checks:
      - "round(5000 / 300, 1) == 16.7 and 300 * 10 < 5000"
      - "5000 / 2 == 2500 and 900 < 2500 and round(5000 / 900, 1) == 5.6"
    steps:
      - show: |
          <div class="code"><div><b>Quyết định 007: dùng một cơ sở dữ liệu quan hệ cho đơn hàng</b></div><div>Bối cảnh: đặt hàng cần giao dịch trên 3 bảng (đơn, kho, thanh toán).</div><div>          Tải ghi dự kiến 300/s; bản thử đo được 5000 ghi/s trên một máy.</div><div>Quyết định: một cơ sở dữ liệu quan hệ, có bản sao đọc (máy chép lại dữ liệu, chỉ để chia việc đọc).</div><div>Lựa chọn khác: một cơ sở dữ liệu phân tán đã thử — bỏ vì bản đã thử không hỗ trợ giao dịch nhiều bảng.</div><div>Hệ quả: dư địa ghi khoảng 16,7 lần; khó mở rộng ghi quá một máy.</div><div>Xem lại khi: tải ghi vượt 2500/s (một nửa sức chịu).</div></div>
        focus: [1, 1, 1, 1, 1]
        say: "Bước một, đọc bản ghi quyết định số 7, dùng một cơ sở dữ liệu quan hệ cho đơn hàng. Bối cảnh là đặt hàng cần giao dịch trên 3 bảng, tải ghi dự kiến 300 mỗi giây, và bản thử đo được 5000 lần ghi mỗi giây trên một máy. Quyết định là một cơ sở dữ liệu quan hệ có bản sao đọc, tức những máy chép lại dữ liệu chỉ để chia bớt việc đọc. Lựa chọn khác là một cơ sở dữ liệu phân tán đã thử, bị bỏ vì bản đã thử không hỗ trợ giao dịch nhiều bảng. Hệ quả là dư địa ghi lớn, nhưng khó mở rộng ghi quá một máy."
      - clear: true
        show: |
          <p><b>Bước 2 — dư địa:</b> $\frac{5000}{300} \approx \hl{16{,}7}$ lần. Tải phải tăng hơn 16 lần mới chạm trần một máy.</p>
          <p><b>Bước 3 — ngưỡng xem lại:</b> một nửa sức chịu, $\frac{5000}{2} = 2500$/s — chạm mốc này vẫn còn nửa sức chịu để kịp chuẩn bị phương án mới.</p>
        focus: [1, 1, 2, 2]
        say: "Bước hai, tính dư địa. Dư địa là 5000 chia 300, khoảng 16 phẩy 7 lần, tức tải phải tăng hơn 16 lần mới chạm trần của một máy. Bước ba, ngưỡng xem lại là một nửa sức chịu, 5000 chia 2, bằng 2500 lần ghi mỗi giây. Chạm mốc này thì vẫn còn nửa sức chịu để kịp chuẩn bị phương án mới."
      - show: |
          <table class="t"><tr><th>hai năm sau</th><th>giá trị</th></tr>
          <tr><td>tải ghi hiện tại</td><td>900/s</td></tr>
          <tr><td>so với ngưỡng 2500/s</td><td>chưa tới</td></tr>
          <tr><td>dư địa còn</td><td>$\frac{5000}{900} \approx 5{,}6$ lần</td></tr></table>
          <p><b>Bước 4 — kết luận:</b> giao dịch 3 bảng vẫn cần, tải chưa tới ngưỡng → <b>giữ nguyên, có lý do</b>; đề xuất “chuyển sang phân tán” bị bác bằng số, không bằng cảm tính.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Hai năm sau, kỹ sư mới đọc dòng cuối của bản ghi. Tải ghi hiện tại là 900 mỗi giây. So với ngưỡng 2500 thì chưa tới. Dư địa vẫn còn 5000 chia 900, khoảng 5 phẩy 6 lần. Bước bốn, kết luận, giao dịch 3 bảng vẫn cần và tải chưa tới ngưỡng, nên giữ nguyên quyết định, có lý do. Đề xuất chuyển sang phân tán bị bác bằng số, chứ không bằng cảm tính."

  - id: check
    kind: check
    title: "Tự kiểm: nhân ngược và thử các mức tăng"
    checks:
      - "round(300 * 16.7) == 5010 and abs(300 * 16.7 - 5000) < 20"
      - "round(2500 / 300, 1) == 8.3 and 900 / 300 == 3"
      - "900 * 2 == 1800 < 2500 < 900 * 3 == 2700"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>đường khác</th><th>khớp?</th></tr>
          <tr><td>dư địa 16,7 lần</td><td>nhân ngược: $300 \cdot 16{,}7 \approx 5010 \approx 5000$</td><td>✓</td></tr>
          <tr><td>ngưỡng 2500 ở xa</td><td>từ lúc quyết định, tải phải tăng $\frac{2500}{300} \approx 8{,}3$ lần; hai năm đầu mới tăng 3 lần</td><td>✓</td></tr>
          <tr><td>khi nào chạm ngưỡng?</td><td>nếu tải tăng gấp đôi nữa: 1800 → chưa; nếu gấp ba nữa: 2700 → đã vượt</td><td>xem lại ở mức gấp ba</td></tr></table>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Nhân ngược, vì dư địa là sức chịu chia cho tải, nên 300 nhân 16 phẩy 7 phải ra xấp xỉ 5000, và đúng là được khoảng 5010. Từ lúc quyết định, tải phải tăng khoảng 8 phẩy 3 lần mới chạm ngưỡng, mà hai năm đầu mới tăng từ 300 lên 900, tức 3 lần. Thử tiếp, nếu tải tăng gấp đôi nữa thì là 1800, chưa tới ngưỡng, còn nếu gấp ba nữa thì là 2700, đã vượt, lúc đó phải xem lại."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "math.ceil(math.log(2500 / 900) / math.log(1.05)) == 21 and math.ceil(math.log(5000 / 900) / math.log(1.05)) == 36 and 36 - 21 == 15"
      - "round(900 * 1.05 ** 21) == 2507 and round(900 * 1.05 ** 36) == 5213 and round(900 * 1.05 ** 35) == 4964"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ có sơ đồ, không có lý do <b class="red">(bị sửa sai)</b>
          <br><span class="note">Sơ đồ cho biết hệ thống <b>là</b> gì; người sau cần biết <b>vì sao</b> để không phá điều kiện ngầm (như giao dịch nhiều bảng).</span></div>
        say: "Lỗi thứ nhất, chỉ có sơ đồ mà không có lý do. Sơ đồ cho biết hệ thống là gì, còn người sau cần biết vì sao, để không phá điều kiện ngầm như giao dịch nhiều bảng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cân nhắc cửa hai chiều như cửa một chiều <b class="red">(chậm vô ích)</b>
          <br><span class="note">Họp ba tuần để chọn thư viện định dạng ngày là phí; đổi sau chỉ mất một buổi. Dành thời gian cho quyết định khó đảo ngược.</span></div>
        say: "Lỗi thứ hai, cân nhắc cửa hai chiều như cửa một chiều. Họp ba tuần để chọn thư viện định dạng ngày là phí, vì đổi sau chỉ mất một buổi, nên hãy dành thời gian cho quyết định khó đảo ngược."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Sửa bản ghi cũ khi đổi ý <b class="red">(mất lịch sử)</b>
          <br><span class="note">Viết bản ghi mới “thay thế quyết định 007”, giữ bản cũ. Lịch sử lý do cũng là thông tin.</span></div>
        say: "Lỗi thứ ba, sửa bản ghi cũ khi đổi ý. Hãy viết bản ghi mới ghi rõ thay thế quyết định số 7, và giữ bản cũ, vì lịch sử lý do cũng là thông tin."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Ghi ngưỡng xem lại vào bản ghi nhưng <b>không ai theo dõi</b> <b class="red">(phát hiện khi đã chạm trần)</b></div>
          <table class="t"><tr><th>giả định tải tăng 5% mỗi tháng từ 900/s</th><th>tháng</th><th>tải ghi</th></tr>
          <tr><td>vượt ngưỡng xem lại 2500/s</td><td>21</td><td>≈ 2507/s</td></tr>
          <tr><td>vượt sức chịu 5000/s</td><td>36</td><td>≈ 5213/s</td></tr></table>
          <p class="note">Chỉ có $\hl{15}$ tháng giữa hai mốc để làm phương án mới. Người làm nghề biến ngưỡng trong bản ghi thành <b>cảnh báo tự động</b> trên số đo tải.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là ghi ngưỡng xem lại vào bản ghi nhưng không ai theo dõi. Giả định tải tăng 5 phần trăm mỗi tháng từ 900, thì tới tháng 21 tải vượt ngưỡng 2500. Tới tháng 36 tải vượt sức chịu 5000. Vậy chỉ có 15 tháng giữa hai mốc để làm phương án mới, và nếu không ai nhìn ngưỡng thì cả 15 tháng ấy trôi qua vô ích. Người làm nghề biến ngưỡng trong bản ghi thành cảnh báo tự động trên số đo tải."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(5000 / 2600, 2) == 1.92 and 2600 > 2500"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tải ghi tăng lên 2600/s. Theo bản ghi 007, nên làm gì? Dư địa còn bao nhiêu lần?</td></tr>
          <tr><td>2</td><td>Xếp loại cửa: (a) đổi màu nút bấm; (b) chọn định dạng mã đơn hàng in trên hoá đơn đã gửi khách; (c) đổi thư viện vẽ biểu đồ nội bộ.</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tải ghi tăng lên 2600 mỗi giây. Theo bản ghi số 7 thì nên làm gì, và dư địa còn bao nhiêu lần? Câu hai, hãy xếp loại cửa cho ba quyết định, đổi màu nút bấm, chọn định dạng mã đơn hàng in trên hoá đơn đã gửi khách, và đổi thư viện vẽ biểu đồ nội bộ. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① So ngưỡng: $2600 \gt 2500$ → đã vượt → <b>xem lại quyết định</b>, viết bản ghi mới “thay thế quyết định 007”.</p>
          <p>Dư địa còn $\frac{5000}{2600} \approx \hl{1{,}92}$ lần — chưa sập, nhưng chỉ còn chưa tới gấp đôi.</p>
        focus: [1, 2]
        say: "Đáp án câu một, trước hết so với ngưỡng, 2600 lớn hơn 2500 nên đã vượt, phải xem lại quyết định và viết bản ghi mới thay thế quyết định số 7. Sau đó tính dư địa, chỉ còn 5000 chia 2600, khoảng 1 phẩy 92 lần, chưa sập nhưng chưa tới gấp đôi."
      - show: |
          <table class="t"><tr><th>quyết định</th><th>đổi lại có chạm tới khách hay dữ liệu đã lưu?</th><th>loại cửa</th></tr>
          <tr><td>(a) màu nút bấm</td><td>không, sửa trong một lần phát hành</td><td>hai chiều</td></tr>
          <tr><td>(b) định dạng mã đơn trên hoá đơn</td><td><b>có</b> — mã đã nằm trong tay khách</td><td><b>một chiều</b></td></tr>
          <tr><td>(c) thư viện vẽ biểu đồ nội bộ</td><td>không, chỉ người trong nhóm dùng</td><td>hai chiều</td></tr></table>
        focus: [1, "1.2", "1.4", "1.3"]
        say: "Câu hai, hỏi một câu cho mỗi quyết định, đổi lại có chạm tới khách hay dữ liệu đã lưu không. Đổi màu nút là cửa hai chiều. Đổi thư viện vẽ biểu đồ nội bộ cũng là cửa hai chiều. Còn định dạng mã đơn hàng trên hoá đơn là cửa một chiều, vì mã đã nằm trong tay khách."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bối cảnh có số liệu</span><span class="a">→</span>
          <span class="n">quyết định và lựa chọn đã bỏ</span><span class="a">→</span>
          <span class="n">hệ quả và ngưỡng xem lại</span><span class="a">→</span>
          <span class="n">cửa một chiều: kỹ; hai chiều: nhanh</span></div>
        say: "Tổng kết lại, một bản ghi quyết định có bối cảnh với số liệu, quyết định và các lựa chọn đã bỏ, hệ quả và ngưỡng xem lại. Cửa một chiều thì cân nhắc kỹ, cửa hai chiều thì quyết nhanh."
      - show: |
          <div class="box key"><b>Tư duy:</b> một quyết định không kèm lý do sẽ bị người sau coi là ngẫu nhiên — và sửa như thể nó ngẫu nhiên.</div>
        say: "Điều cần mang theo, một quyết định không kèm lý do sẽ bị người sau coi là ngẫu nhiên, và bị sửa như thể nó ngẫu nhiên."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>ước lượng nhanh</b> — tải, lưu trữ, băng thông.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học ước lượng nhanh, cho tải, lưu trữ, và băng thông. Hẹn gặp bạn ở bài tiếp theo."
