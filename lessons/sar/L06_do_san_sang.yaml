id: L06
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 6 — Độ sẵn sàng: dự phòng, điểm hỏng đơn, miền lỗi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L06; audit/sar/verify_sar.py L06; M. L. Shooman, Reliability of Computer Systems and Networks (Wiley, 2002), chương 3 (hệ nối tiếp, song song); L. A. Barroso, U. Hölzle, P. Ranganathan, The Datacenter as a Computer, 3rd ed. (2018), chương 7 (miền lỗi); CLD bài 3"
assumes: [arith, cdot, approx]
# Quy ước: các thành phần hỏng ĐỘC LẬP. Nối tiếp (cần tất cả): Π p_i (alg.series_avail). Song song dự phòng (cần ít nhất một): 1 − Π (1 − p_i)
#   (alg.parallel_avail). Tháng = 43 200 phút. Ví dụ: bộ cân bằng tải 99,9%, mỗi máy ứng dụng 99%, cơ sở dữ liệu 99,9%.
objectives:
  - "Tính sẵn sàng của mắc song song và nối tiếp"
  - "Tìm điểm hỏng đơn"
  - "Hiểu miền lỗi làm hỏng giả thiết độc lập"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai máy dự phòng, cùng một ổ cắm"
    steps:
      - show: |
          <p>Hệ thống có hai máy chủ ứng dụng dự phòng cho nhau — “không bao giờ chết cả hai cùng lúc”. Một đêm, bộ nguồn của tủ máy hỏng: cả hai máy cùng tắt, vì chúng cắm chung một tủ.</p>
          <div class="box key">Hôm nay: <b>độ sẵn sàng</b> — dự phòng tính bằng công thức nào, và khi nào công thức đó sai.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, hệ thống có hai máy chủ ứng dụng dự phòng cho nhau, không bao giờ chết cả hai cùng lúc. Một đêm, bộ nguồn của tủ máy hỏng, và cả hai máy cùng tắt, vì chúng cắm chung một tủ. Hôm nay ta học độ sẵn sàng, dự phòng được tính bằng công thức nào, và khi nào công thức đó sai."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm thời gian, phần bù, nhân xác suất"
    checks:
      - "30 * 24 * 60 == 43200 and round(43200 * 0.01) == 432 and 432 / 60 == 7.2"
      - "round(1 - 0.99, 2) == 0.01 and 0.5 * 0.5 == 0.25 and round(0.01 * 0.01, 4) == 0.0001"
    steps:
      - show: |
          <p><b>Độ sẵn sàng</b> = phần thời gian hệ thống chạy được. Một tháng 30 ngày có $30 \cdot 24 \cdot 60 = 43\,200$ phút. Sẵn sàng 99% nghĩa là ngừng 1%: $43\,200 \cdot 0{,}01 = \hl{432}$ phút, tức 7,2 giờ mỗi tháng.</p>
        say: "Trước hết, ôn ba điều sẽ dùng. Độ sẵn sàng là phần thời gian hệ thống chạy được. Một tháng 30 ngày có 30 nhân 24 nhân 60, bằng 43 nghìn 200 phút. Sẵn sàng 99 phần trăm nghĩa là ngừng 1 phần trăm, tức 432 phút, khoảng 7 phẩy 2 giờ mỗi tháng."
      - show: |
          <p><b>Phần bù</b>: chạy 99% thì hỏng $1 - 0{,}99 = 0{,}01$. Ta hay tính phần <b>hỏng</b> vì nó nhỏ và dễ nhân.</p>
        say: "Thứ hai, phần bù. Một máy chạy 99 phần trăm thời gian thì hỏng 1 trừ 0 phẩy 99, bằng 0 phẩy 01. Ta hay tính phần hỏng vì nó nhỏ và dễ nhân."
      - show: |
          <table class="t"><tr><th>hai việc <b>độc lập</b> cùng xảy ra</th><th>nhân xác suất</th></tr>
          <tr><td>hai đồng xu cùng sấp</td><td>$\frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$</td></tr>
          <tr><td>hai máy, mỗi máy hỏng 0,01, cùng hỏng</td><td>$0{,}01 \cdot 0{,}01 = \hl{0{,}0001}$</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.3", 1]
        say: "Thứ ba, hai việc độc lập cùng xảy ra thì nhân xác suất. Hai đồng xu cùng sấp có xác suất một phần hai nhân một phần hai, bằng một phần tư. Hai máy, mỗi máy hỏng 0 phẩy 01, cùng hỏng một lúc có xác suất 0 phẩy 01 nhân 0 phẩy 01, bằng 0 phẩy 0001. Chữ độc lập rất quan trọng, cuối bài ta sẽ thấy khi nó sai thì sao."

  - id: sym
    kind: symbol
    title: "Giải mã: nối tiếp, song song, điểm hỏng đơn"
    steps:
      - show: |
          <table class="t"><tr><th>cách mắc</th><th>chạy khi</th><th>độ sẵn sàng</th></tr>
          <tr><td><b>nối tiếp</b></td><td><b>mọi</b> thành phần cùng chạy</td><td>$p_1 \cdot p_2 \cdots$</td></tr>
          <tr><td><b>song song</b> (dự phòng)</td><td><b>ít nhất một</b> thành phần chạy</td><td>$1 - (1 - p_1)(1 - p_2) \cdots$</td></tr></table>
          <p><b>Điểm hỏng đơn</b>: thành phần mà nó hỏng là cả hệ hỏng. <b>Miền lỗi</b>: nhóm thành phần hỏng <b>cùng nhau</b> vì chung một thứ (tủ, nguồn điện, vùng, bản cập nhật).</p>
        introduces: [sub, dots]
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bảng này so sánh hai cách mắc các thành phần. Mắc nối tiếp chỉ chạy khi mọi thành phần cùng chạy, nên độ sẵn sàng là tích các độ sẵn sàng. Mắc song song, tức dự phòng, chạy khi ít nhất một thành phần chạy, nên độ sẵn sàng là 1 trừ tích các xác suất hỏng. Điểm hỏng đơn là thành phần mà nó hỏng thì cả hệ hỏng. Miền lỗi là một nhóm thành phần hỏng cùng nhau vì chung một thứ, như tủ máy, nguồn điện, vùng, hay một bản cập nhật."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đường đi của một yêu cầu: chỗ nào có lối vòng, chỗ nào không"
    checks:
      - "round(0.01 * 0.01, 4) == 0.0001"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="22" fill="#1f2937"><text x="20" y="160">yêu cầu</text><line x1="110" y1="153" x2="170" y2="153" stroke="#1f2937" stroke-width="3"/><rect x="175" y="113" width="230" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="290" y="148" text-anchor="middle">cân bằng tải</text><text x="290" y="176" text-anchor="middle">99,9%</text><line x1="405" y1="153" x2="520" y2="85" stroke="#1f2937" stroke-width="3"/><line x1="405" y1="153" x2="520" y2="225" stroke="#1f2937" stroke-width="3"/><rect x="525" y="40" width="260" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="655" y="75" text-anchor="middle">máy ứng dụng 1</text><text x="655" y="103" text-anchor="middle">99%</text><rect x="525" y="185" width="260" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="655" y="220" text-anchor="middle">máy ứng dụng 2</text><text x="655" y="248" text-anchor="middle">99%</text><line x1="785" y1="80" x2="900" y2="153" stroke="#1f2937" stroke-width="3"/><line x1="785" y1="225" x2="900" y2="153" stroke="#1f2937" stroke-width="3"/><rect x="905" y="113" width="260" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1035" y="148" text-anchor="middle">cơ sở dữ liệu</text><text x="1035" y="176" text-anchor="middle">99,9%</text><text x="1185" y="60" fill="#059669">song song: hỏng khi</text><text x="1185" y="88" fill="#059669">CẢ HAI cùng hỏng</text><text x="1185" y="118" fill="#059669">0,01 nhân 0,01 = 0,0001</text><text x="1185" y="235" fill="#b91c1c">viền đỏ: chỉ có một,</text><text x="1185" y="263" fill="#b91c1c">nó hỏng là cả hệ hỏng</text><text x="175" y="318" fill="#6b7280">yêu cầu phải đi qua cả ba tầng (nối tiếp); tầng giữa có hai đường (song song)</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ đường đi của một yêu cầu qua hệ ba tầng. Yêu cầu phải đi qua cả ba tầng, nên ba tầng mắc nối tiếp. Nhưng tầng giữa có hai máy, mất một máy vẫn còn lối kia, nên tầng đó chỉ hỏng khi cả hai cùng hỏng, xác suất 0 phẩy 0001. Cân bằng tải và cơ sở dữ liệu viền đỏ vì mỗi thứ chỉ có một, nó hỏng là cả hệ hỏng."

  - id: example
    kind: example
    title: "Một hệ ba tầng"
    checks:
      - "round(alg.parallel_avail([0.99, 0.99]), 4) == 0.9999 and round(alg.series_avail([0.99, 0.99]), 4) == 0.9801"
      - "round(alg.series_avail([0.999, alg.parallel_avail([0.99, 0.99]), 0.999]), 4) == 0.9979 and round(alg.series_avail([0.999, 0.99, 0.999]), 4) == 0.988"
      - "round((1 - alg.series_avail([0.999, 0.99, 0.999])) * 43200) == 517 and round((1 - alg.series_avail([0.999, alg.parallel_avail([0.99, 0.99]), 0.999])) * 43200) == 91"
      - "round(0.002 / (1 - alg.series_avail([0.999, alg.parallel_avail([0.99, 0.99]), 0.999])) * 100) == 95"
    steps:
      - show: |
          <p><b>Bước 1 — song song:</b> hai máy 99% độc lập, cùng hỏng $0{,}01^2 = 0{,}0001$ → sẵn sàng $1 - 0{,}01^2 = \hl{99{,}99\%}$.</p>
          <p><b>Bước 2 — nối tiếp:</b> cần cả hai cùng chạy → $0{,}99 \cdot 0{,}99 = 0{,}99^2 = 98{,}01\%$, <b>tệ hơn</b> một máy.</p>
        focus: [1, 1, 2, 2]
        say: "Bước một, mắc song song. Hai máy 99 phần trăm độc lập, cùng hỏng với xác suất 0 phẩy 01 bình phương, bằng 0 phẩy 0001, nên sẵn sàng 99 phẩy 99 phần trăm. Bước hai, mắc nối tiếp, cần cả hai cùng chạy, nên 0 phẩy 99 nhân 0 phẩy 99, bằng 98 phẩy 01 phần trăm. Thêm một thành phần nối tiếp làm hệ tệ hơn cả một máy."
      - show: |
          <p><b>Bước 3 — hệ ba tầng, 1 máy ứng dụng:</b> $0{,}999 \cdot 0{,}99 \cdot 0{,}999 \approx 0{,}9880$ → ngừng $(1 - 0{,}9880) \cdot 43\,200 \approx 517$ phút mỗi tháng.</p>
        say: "Bước ba, xét một hệ ba tầng gồm cân bằng tải 99 phẩy 9, một máy ứng dụng 99, và cơ sở dữ liệu 99 phẩy 9, mắc nối tiếp. Nhân ba số được khoảng 0 phẩy 9880, tức hệ ngừng khoảng 517 phút mỗi tháng."
      - clear: true
        show: |
          <table class="t"><tr><th>thiết kế (cân bằng tải 99,9% → ứng dụng → cơ sở dữ liệu 99,9%)</th><th>sẵn sàng</th><th>ngừng mỗi tháng</th></tr>
          <tr><td>1 máy ứng dụng 99%</td><td>98,80%</td><td>≈ 517 phút</td></tr>
          <tr><td>2 máy ứng dụng song song</td><td>$\hl{99{,}79\%}$</td><td>≈ 91 phút</td></tr></table>
          <p><b>Bước 4</b> — thay tầng giữa bằng hai máy song song (99,99%): $0{,}999 \cdot 0{,}9999 \cdot 0{,}999 \approx 0{,}9979$.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bảng so hai thiết kế. Với một máy ứng dụng 99 phần trăm, cả hệ đạt 98 phẩy 80, ngừng khoảng 517 phút mỗi tháng. Với hai máy ứng dụng song song, cả hệ đạt 99 phẩy 79, chỉ ngừng khoảng 91 phút. Bước bốn giải thích con số đó, tầng giữa giờ đạt 99 phẩy 99, nhân với hai tầng 99 phẩy 9 được khoảng 0 phẩy 9979."
      - show: |
          <table class="t"><tr><th>phần hỏng còn lại (thiết kế 2 máy)</th><th>xác suất hỏng</th></tr>
          <tr><td>cân bằng tải</td><td>0,001</td></tr>
          <tr><td>cơ sở dữ liệu</td><td>0,001</td></tr>
          <tr><td>tầng ứng dụng (cả hai máy)</td><td>0,0001</td></tr></table>
          <p class="note"><b>Bước 5</b> — sau khi dự phòng tầng ứng dụng, phần lớn thời gian ngừng còn lại (khoảng 95%) đến từ cân bằng tải và cơ sở dữ liệu — giờ chúng là điểm hỏng đơn.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước năm, xem thời gian ngừng còn lại đến từ đâu. Cân bằng tải hỏng 0 phẩy 001. Cơ sở dữ liệu cũng 0 phẩy 001. Tầng ứng dụng giờ chỉ còn 0 phẩy 0001. Sau khi dự phòng tầng ứng dụng, phần lớn thời gian ngừng còn lại, khoảng 95 phần trăm, đến từ cân bằng tải và cơ sở dữ liệu, giờ chúng là điểm hỏng đơn."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê mọi trạng thái, cộng phút ngừng"
    checks:
      - "[round(a * b, 4) for a, b in __import__('itertools').product([0.99, 0.01], repeat=2)] == [0.9801, 0.0099, 0.0099, 0.0001]"
      - "round(0.9801 + 0.0099 + 0.0099, 4) == 0.9999 and round(0.9801 + 0.0099 * 2 + 0.0001, 4) == 1"
      - "round(43200 * (0.001 + 0.01 + 0.001), 1) == 518.4 and round(43200 * (0.001 + 0.0001 + 0.001), 1) == 90.7"
    steps:
      - show: |
          <table class="t"><tr><th>máy 1</th><th>máy 2</th><th>xác suất</th><th>song song chạy?</th><th>nối tiếp chạy?</th></tr>
          <tr><td>chạy</td><td>chạy</td><td>0,9801</td><td>✓</td><td>✓</td></tr>
          <tr><td>chạy</td><td>hỏng</td><td>0,0099</td><td>✓</td><td>—</td></tr>
          <tr><td>hỏng</td><td>chạy</td><td>0,0099</td><td>✓</td><td>—</td></tr>
          <tr><td>hỏng</td><td>hỏng</td><td>0,0001</td><td>—</td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3", "1.5", 1, 1]
        say: "Kiểm bằng đường khác, liệt kê cả bốn trạng thái của hai máy. Cả hai chạy có xác suất 0 phẩy 9801. Một máy chạy, một máy hỏng có hai trường hợp, mỗi trường hợp 0 phẩy 0099. Cả hai hỏng là 0 phẩy 0001. Song song chạy ở ba dòng đầu vì chỉ cần một máy, cộng lại 0 phẩy 9999. Nối tiếp chỉ chạy ở dòng đầu vì cần cả hai, nên được 0 phẩy 9801, khớp bước một và bước hai."
      - show: |
          <table class="t"><tr><th>cộng phút ngừng từng phần</th><th>tính</th><th>so với</th></tr>
          <tr><td>1 máy ứng dụng</td><td>$43\,200 \cdot (0{,}001 + 0{,}01 + 0{,}001) \approx 518$ phút</td><td>517 ✓ (sát)</td></tr>
          <tr><td>2 máy ứng dụng</td><td>$43\,200 \cdot (0{,}001 + 0{,}0001 + 0{,}001) \approx 91$ phút</td><td>91 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Cách thứ hai, khi xác suất hỏng nhỏ thì hiếm khi hai phần cùng hỏng một lúc, nên cộng phút ngừng của từng phần gần đúng bằng phút ngừng cả hệ. Với một máy, 43 nghìn 200 nhân tổng 0 phẩy 012 được khoảng 518 phút, sát con số 517. Với hai máy, được khoảng 91 phút, khớp bảng."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "round(alg.parallel_avail([0.99, 0.99]) * 0.995, 4) == 0.9949"
      - "round(43200 * 0.001, 2) == 43.2 and round(43200 * 0.0001, 2) == 4.32 and alg.series_avail([0.9999, 0.999]) < 0.999 and round(43.2 / 4.32) == 10"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nhân xác suất khi các bản dự phòng chung miền lỗi <b class="red">(lạc quan giả)</b>
          <br><span class="note">Hai máy 99% cắm chung một tủ nguồn 99,5%: thật ra là (song song hai máy) nối tiếp (tủ): $0{,}9999 \cdot 0{,}995 \approx 99{,}49\%$, không phải 99,99%. Đặt bản dự phòng ở miền lỗi khác nhau.</span></div>
        say: "Lỗi thứ nhất, nhân xác suất khi các bản dự phòng chung một miền lỗi. Hai máy 99 phần trăm cắm chung một tủ nguồn 99 phẩy 5 phần trăm thì thật ra là hai máy song song, nối tiếp với cái tủ. Kết quả là khoảng 99 phẩy 49 phần trăm, không phải 99 phẩy 99, nên hãy đặt bản dự phòng ở các miền lỗi khác nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dự phòng chưa bao giờ được thử <b class="red">(hỏng khi cần)</b>
          <br><span class="note">Bản dự phòng nằm im hai năm; ngày cần chuyển sang thì cấu hình đã cũ, không chạy. Thử chuyển đổi định kỳ, có chủ đích.</span></div>
        say: "Lỗi thứ hai, có dự phòng mà chưa bao giờ được thử. Bản dự phòng nằm im hai năm, đến ngày cần chuyển sang thì cấu hình đã cũ và không chạy, nên hãy thử chuyển đổi định kỳ, có chủ đích."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dự phòng thành phần nhưng quên điểm hỏng đơn ẩn <b class="red">(chứng chỉ, tên miền)</b>
          <br><span class="note">Mười máy, ba vùng — nhưng một chứng chỉ hết hạn hoặc một bản ghi tên miền sai làm tất cả ngừng. Liệt kê mọi thứ “chỉ có một”.</span></div>
        say: "Lỗi thứ ba, dự phòng từng thành phần nhưng quên điểm hỏng đơn ẩn. Có mười máy, ba vùng, nhưng một chứng chỉ hết hạn hoặc một bản ghi tên miền sai làm tất cả ngừng, nên hãy liệt kê mọi thứ chỉ có một."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Hứa với khách 99,99% trong khi hệ gọi nối tiếp một dịch vụ ngoài chỉ 99,9% <b class="red">(hứa điều không thể)</b></div>
          <table class="t"><tr><th>mức</th><th>phút ngừng mỗi tháng</th></tr>
          <tr><td>cam kết 99,99%</td><td>$43\,200 \cdot 0{,}0001 = 4{,}32$</td></tr>
          <tr><td>riêng dịch vụ ngoài 99,9%</td><td>$43\,200 \cdot 0{,}001 = \hl{43{,}2}$ — gấp 10 lần mức được phép</td></tr></table>
          <p class="note">Nối tiếp thì cả hệ <b>không bao giờ</b> tốt hơn khâu yếu nhất. Người làm nghề cộng thời gian ngừng của mọi phụ thuộc nối tiếp trước khi hứa, hoặc làm khâu đó thành không bắt buộc (có đường dự phòng, có bộ nhớ đệm).</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là hứa với khách 99 phẩy 99 phần trăm trong khi hệ gọi nối tiếp một dịch vụ ngoài chỉ đạt 99 phẩy 9. Mức 99 phẩy 99 chỉ cho phép ngừng khoảng 4 phẩy 32 phút mỗi tháng. Riêng dịch vụ ngoài đã ngừng khoảng 43 phẩy 2 phút, gấp 10 lần mức được phép. Mắc nối tiếp thì cả hệ không bao giờ tốt hơn khâu yếu nhất. Người làm nghề cộng thời gian ngừng của mọi phụ thuộc nối tiếp trước khi hứa, hoặc làm khâu đó thành không bắt buộc, có đường dự phòng hay bộ nhớ đệm."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.parallel_avail([0.99] * 3), 6) == 0.999999 and round(alg.series_avail([0.999, alg.parallel_avail([0.999, 0.999])]), 4) == 0.999"
      - "round(0.01 ** 3, 6) == 0.000001 and round(1 - 0.001 ** 2, 6) == 0.999999 and round(43200 * 0.001, 1) == 43.2"
      - "round(alg.series_avail([alg.parallel_avail([0.999, 0.999])] * 2), 6) == 0.999998 and round((1 - alg.series_avail([alg.parallel_avail([0.999, 0.999])] * 2)) * 43200, 2) == 0.09"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ba máy 99% song song, độc lập: sẵn sàng bao nhiêu?</td></tr>
          <tr><td>2</td><td>Cơ sở dữ liệu 99,9% đặt sau hai máy ứng dụng 99,9% song song: cả hệ bao nhiêu? Muốn tốt hơn, dự phòng chỗ nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ba máy 99 phần trăm song song và độc lập, sẵn sàng bao nhiêu? Câu hai, cơ sở dữ liệu 99 phẩy 9 đặt sau hai máy ứng dụng 99 phẩy 9 song song, cả hệ bao nhiêu? Muốn tốt hơn thì dự phòng chỗ nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Ba máy cùng hỏng: $0{,}01^3 = 0{,}000001$ → sẵn sàng $1 - 0{,}01^3 = \hl{99{,}9999\%}$.</p>
        say: "Đáp án câu một, ba máy cùng hỏng với xác suất 0 phẩy 01 mũ 3, tức một phần triệu. Vậy sẵn sàng là 1 trừ một phần triệu, bằng 99 phẩy 9999 phần trăm."
      - show: |
          <p>② Hai máy 99,9% song song: $1 - 0{,}001^2 \approx 99{,}9999\%$. Nối tiếp cơ sở dữ liệu 99,9% → $\approx \hl{99{,}9\%}$, ngừng khoảng $43\,200 \cdot 0{,}001 = 43{,}2$ phút mỗi tháng.</p>
        say: "Câu hai, hai máy song song đạt khoảng 99 phẩy 9999, nối tiếp với cơ sở dữ liệu 99 phẩy 9 thì cả hệ khoảng 99 phẩy 9. Tức là ngừng khoảng 43 phẩy 2 phút mỗi tháng, gần như toàn bộ do cơ sở dữ liệu."
      - show: |
          <table class="t"><tr><th>dự phòng chỗ nào</th><th>cả hệ (nếu hỏng độc lập)</th><th>ngừng mỗi tháng</th></tr>
          <tr><td>thêm máy ứng dụng thứ ba</td><td>vẫn ≈ 99,9%</td><td>≈ 43,2 phút</td></tr>
          <tr><td>thêm cơ sở dữ liệu dự phòng</td><td>$\approx \hl{99{,}9998\%}$</td><td>≈ 0,09 phút</td></tr></table>
        focus: [1, "1.2", "1.3", 1]
        say: "Vế sau câu hai là một quyết định. Thêm máy ứng dụng thứ ba gần như không đổi gì, cả hệ vẫn khoảng 99 phẩy 9. Thêm một cơ sở dữ liệu dự phòng thì nếu hỏng độc lập, cả hệ đạt khoảng 99 phẩy 9998, ngừng chưa tới một phút mỗi tháng. Cơ sở dữ liệu là điểm hỏng đơn, nên phải dự phòng cơ sở dữ liệu."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nối tiếp: nhân các độ sẵn sàng</span><span class="a">→</span>
          <span class="n">song song: 1 − tích xác suất hỏng</span><span class="a">→</span>
          <span class="n">tìm điểm hỏng đơn, kể cả ẩn</span><span class="a">→</span>
          <span class="n">dự phòng ở miền lỗi khác nhau, thử định kỳ</span></div>
        say: "Tổng kết lại, nối tiếp thì nhân các độ sẵn sàng, song song thì 1 trừ tích các xác suất hỏng. Hãy tìm điểm hỏng đơn, kể cả những điểm ẩn, đặt dự phòng ở miền lỗi khác nhau, và thử định kỳ."
      - show: |
          <div class="box key"><b>Tư duy:</b> dự phòng chỉ có giá trị khi các bản <b>không cùng chết vì một lý do</b>. Hãy hỏi: thứ gì chúng còn dùng chung?</div>
        say: "Điều cần mang theo, dự phòng chỉ có giá trị khi các bản không cùng chết vì một lý do. Hãy hỏi thứ gì chúng còn dùng chung."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>kiểm soát quá tải</b> — giới hạn tốc độ, giảm tải, áp lực ngược.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học kiểm soát quá tải, với giới hạn tốc độ, giảm tải, và áp lực ngược. Hẹn gặp bạn ở bài tiếp theo."
