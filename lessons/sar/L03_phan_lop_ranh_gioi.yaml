id: L03
course: SAR
series: "SAR · Kiến trúc hệ thống"
title: "Bài 3 — Phân lớp, mô-đun hoá và ranh giới"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sar.yaml L03; audit/sar/verify_sar.py L03; D. L. Parnas, On the Criteria To Be Used in Decomposing Systems into Modules, CACM 15(12), 1972; E. W. Dijkstra, The Structure of the “THE”-Multiprogramming System, CACM 11(5), 1968 (hệ phân lớp); SDP bài 7 (đảo phụ thuộc), CLD bài 0"
assumes: [arith]
# Quy ước: lớp xếp từ trên xuống; cạnh (a, b) nghĩa là “a gọi b”. Hợp lệ khi b nằm ở lớp DƯỚI a (alg.layer_violations trả các cạnh vi phạm).
#   Tên lớp trong mã viết không dấu (giao_dien, nghiep_vu, du_lieu); lời đọc dùng tên tiếng Việt.
objectives:
  - "Chia hệ thống theo trách nhiệm"
  - "Giữ phụ thuộc một chiều giữa các lớp"
  - "Kiểm ranh giới bằng máy"
asr_reviewed:
  - {sentence: "Luật là cạnh a gọi b hợp lệ khi hạng của b lớn hơn hạng của a.", reason: "ASR chép “Luật là cạnh A gọi B hợp lệ khi hạng của B lớn hơn hạng qua.” (0.909): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: của (trong “của a” → “qua”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đổi cơ sở dữ liệu, sửa cả giao diện"
    checks:
      - "alg.layer_violations([('du_lieu', 'nghiep_vu')], ['giao_dien', 'nghiep_vu', 'du_lieu']) == [('du_lieu', 'nghiep_vu')]"
    steps:
      - show: |
          <p>Nhóm muốn đổi cơ sở dữ liệu. Tìm thử: câu truy vấn nằm rải trong 200 tệp, kể cả mã giao diện; lớp dữ liệu lại gọi ngược lên tính giá trong lớp nghiệp vụ. Đổi một chỗ, vỡ mười chỗ.</p>
          <div class="box key">Hôm nay: <b>phân lớp</b> và <b>ranh giới</b> — mỗi phần một trách nhiệm, phụ thuộc chỉ đi một chiều.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, nhóm muốn đổi cơ sở dữ liệu. Tìm thử thì câu truy vấn nằm rải trong 200 tệp, kể cả mã giao diện, còn lớp dữ liệu lại gọi ngược lên phép tính giá trong lớp nghiệp vụ. Đổi một chỗ là vỡ mười chỗ. Hôm nay ta học phân lớp và ranh giới, mỗi phần một trách nhiệm, và phụ thuộc chỉ đi một chiều."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: mũi tên “gọi”, hạng, và vòng lặp phụ thuộc"
    checks:
      - "alg.layer_violations([('A', 'B')], ['A', 'B', 'C']) == [] and alg.layer_violations([('C', 'B')], ['A', 'B', 'C']) == [('C', 'B')]"
      - "{'A', 'B'} == {a for a, b in [('A', 'B'), ('B', 'A')]}"
    steps:
      - show: |
          <p><b>Mũi tên “gọi”</b>: viết $A \to B$ khi mã của A gọi hàm của B. Khi đó A <b>phụ thuộc</b> B: B đổi cách gọi thì A phải sửa theo; A đổi thì B không biết gì.</p>
        say: "Trước hết, ôn ba điều sẽ dùng. Ta viết A mũi tên B khi mã của A gọi một hàm của B. Khi đó A phụ thuộc B, nghĩa là B đổi cách gọi thì A phải sửa theo, còn A đổi thì B không hề biết."
      - show: |
          <table class="t"><tr><th>lớp</th><th>hạng (từ trên xuống)</th></tr><tr><td>A</td><td>0</td></tr><tr><td>B</td><td>1</td></tr><tr><td>C</td><td>2</td></tr></table>
          <p><b>Hạng</b>: đánh số các lớp từ trên xuống. Luật một chiều: mũi tên chỉ được đi từ hạng nhỏ sang hạng <b>lớn hơn</b>. $A \to B$: 0 sang 1 → hợp lệ. $C \to B$: 2 sang 1 → <b class="red">vi phạm</b>.</p>
        focus: [1, 2, 2, 2]
        say: "Thứ hai, ta đánh số các lớp từ trên xuống, gọi là hạng, A hạng 0, B hạng 1, C hạng 2. Luật một chiều nói mũi tên chỉ được đi từ hạng nhỏ sang hạng lớn hơn. A gọi B là từ 0 sang 1 nên hợp lệ. C gọi B là từ 2 về 1 nên vi phạm."
      - show: |
          <p><b>Vòng lặp phụ thuộc</b>: có $A \to B$ và cả $B \to A$. Lúc đó đổi A có thể phải sửa B, đổi B lại phải sửa A — không tách riêng, không kiểm thử riêng được cái nào.</p>
        say: "Thứ ba, vòng lặp phụ thuộc là khi có A gọi B và cả B gọi A. Lúc đó đổi A có thể phải sửa B, đổi B lại phải sửa A, nên không tách riêng, cũng không kiểm thử riêng được cái nào."

  - id: sym
    kind: symbol
    title: "Giải mã: lớp, ranh giới, phụ thuộc một chiều"
    steps:
      - show: |
          <table class="t"><tr><th>lớp</th><th>trách nhiệm</th><th>thường gọi</th></tr>
          <tr><td><b>giao diện</b></td><td>nhận yêu cầu, hiển thị kết quả</td><td>lớp nghiệp vụ</td></tr>
          <tr><td><b>nghiệp vụ</b></td><td>quy tắc: tính giá, kiểm tồn kho</td><td>lớp dữ liệu</td></tr>
          <tr><td><b>dữ liệu</b></td><td>đọc, ghi cơ sở dữ liệu</td><td>không gọi lên trên</td></tr></table>
          <div class="box key"><b>Ranh giới</b>: chỗ một lớp chỉ biết lớp kia qua một <b>giao diện hẹp</b> — vài hàm được phép gọi, ghi rõ nhận gì, trả gì (khác với “lớp giao diện” là phần hiển thị). Đổi bên trong một lớp không làm đổi lớp khác, miễn giao diện giữ nguyên.</div>
        focus: [1, "1.2", "1.3", "1.4", 2, 2, 2]
        say: "Bảng chia hệ thống thành ba lớp. Lớp giao diện nhận yêu cầu và hiển thị kết quả, thường gọi lớp nghiệp vụ. Lớp nghiệp vụ giữ các quy tắc như tính giá, kiểm tồn kho, thường gọi lớp dữ liệu. Lớp dữ liệu đọc và ghi cơ sở dữ liệu, không được gọi lên trên. Ranh giới là chỗ một lớp chỉ biết lớp kia qua một giao diện hẹp. Giao diện hẹp ở đây là vài hàm được phép gọi, ghi rõ nhận gì và trả gì, khác với lớp giao diện là phần hiển thị. Đổi bên trong một lớp không làm đổi lớp khác, miễn giao diện giữ nguyên."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phụ thuộc như nước: chỉ được chảy xuống"
    checks:
      - "alg.layer_violations([('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')], ['giao_dien', 'nghiep_vu', 'du_lieu']) == [('du_lieu', 'nghiep_vu')] and ('nghiep_vu', 'du_lieu') in [('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')]"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><g font-size="22" fill="#1f2937"><rect x="300" y="20" width="360" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="480" y="62" text-anchor="middle" font-weight="bold">giao diện (hạng 0)</text><rect x="300" y="135" width="360" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="480" y="177" text-anchor="middle" font-weight="bold">nghiệp vụ (hạng 1)</text><rect x="300" y="250" width="360" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="480" y="292" text-anchor="middle" font-weight="bold">dữ liệu (hạng 2)</text><line x1="420" y1="92" x2="420" y2="131" stroke="#059669" stroke-width="4" marker-end="url(#ahg)"/><line x1="420" y1="207" x2="420" y2="246" stroke="#059669" stroke-width="4" marker-end="url(#ahg)"/><line x1="560" y1="248" x2="560" y2="209" stroke="#b91c1c" stroke-width="4" marker-end="url(#ahr)"/><path d="M 298 55 C 200 55, 200 285, 296 285" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ahk)"/><text x="720" y="120" fill="#059669">mũi tên xanh: gọi xuống, hợp lệ</text><text x="720" y="232" fill="#b91c1c" font-weight="bold">mũi tên đỏ: dữ liệu gọi ngược lên</text><text x="720" y="262" fill="#b91c1c">cùng mũi tên xanh dưới tạo vòng lặp</text><text x="20" y="170" fill="#6b7280">gọi tắt</text><text x="20" y="197" fill="#6b7280">xuống đáy</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình xếp ba lớp từ trên xuống, giống nước chỉ được chảy từ cao xuống thấp. Hai mũi tên xanh đi xuống là hợp lệ, mũi tên xám đứt từ giao diện xuống thẳng dữ liệu vẫn đi xuống nên không vi phạm luật. Mũi tên đỏ đi ngược từ dữ liệu lên nghiệp vụ, và cùng mũi tên xanh bên dưới, nó tạo thành một vòng lặp. Vòng lặp này chính là lý do đổi cơ sở dữ liệu thì vỡ cả phần tính giá."

  - id: example
    kind: example
    title: "Để máy kiểm phụ thuộc"
    checks:
      - "alg.layer_violations([('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')], ['giao_dien', 'nghiep_vu', 'du_lieu']) == [('du_lieu', 'nghiep_vu')]"
      - "len([('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')]) == 4 and len(alg.layer_violations([('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')], ['giao_dien', 'nghiep_vu', 'du_lieu'])) == 1"
      - "alg.layer_violations([('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('giao_dien', 'du_lieu')], ['giao_dien', 'nghiep_vu', 'du_lieu']) == []"
    steps:
      - show: |
          <p><b>Bước 1 — gán hạng:</b> giao diện 0, nghiệp vụ 1, dữ liệu 2. Luật: cạnh “a gọi b” hợp lệ khi hạng của b <b>lớn hơn</b> hạng của a.</p>
          <p class="note">Máy liệt kê được 4 lời gọi giữa các lớp trong mã.</p>
        focus: [1, 1, 2]
        say: "Bước một, gán hạng cho ba lớp, giao diện 0, nghiệp vụ 1, dữ liệu 2. Luật là cạnh a gọi b hợp lệ khi hạng của b lớn hơn hạng của a. Máy quét mã và liệt kê được 4 lời gọi giữa các lớp."
      - show: |
          <table class="t"><tr><th>lời gọi tìm thấy trong mã</th><th>hạng</th><th>kết luận</th></tr>
          <tr><td>giao diện → nghiệp vụ</td><td>0 → 1</td><td class="green">hợp lệ</td></tr>
          <tr><td>nghiệp vụ → dữ liệu</td><td>1 → 2</td><td class="green">hợp lệ</td></tr>
          <tr><td>dữ liệu → nghiệp vụ</td><td>2 → 1</td><td class="red">vi phạm: gọi ngược lên</td></tr>
          <tr><td>giao diện → dữ liệu</td><td>0 → 2</td><td>hợp lệ theo luật “gọi lớp dưới”</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bước hai, xét từng lời gọi bằng hạng. Giao diện gọi nghiệp vụ, 0 sang 1, hợp lệ. Nghiệp vụ gọi dữ liệu, 1 sang 2, cũng hợp lệ. Dữ liệu gọi ngược lên nghiệp vụ, 2 về 1, là vi phạm. Giao diện gọi thẳng dữ liệu, 0 sang 2, hợp lệ theo luật gọi lớp dưới."
      - clear: true
        show: |
          <p><b>Bước 3 — xét lại cạnh hợp lệ nhưng đáng ngờ:</b> giao diện → dữ liệu bỏ qua lớp nghiệp vụ, nên dễ bỏ qua quy tắc như kiểm tồn kho. Luật không cấm, nhưng nên hỏi “vì sao”.</p>
          <p><b>Bước 4 — kết quả:</b> 4 lời gọi, $\hl{1}$ vi phạm: dữ liệu → nghiệp vụ. Sửa bằng sự kiện hoặc đảo phụ thuộc.</p>
        focus: [1, 1, 2, 2]
        say: "Bước ba, xét lại cạnh hợp lệ nhưng đáng ngờ. Giao diện gọi thẳng dữ liệu là bỏ qua lớp nghiệp vụ, nên dễ bỏ qua quy tắc như kiểm tồn kho, luật không cấm nhưng nên hỏi vì sao. Bước bốn, kết quả là trong 4 lời gọi có đúng 1 vi phạm, dữ liệu gọi ngược lên nghiệp vụ. Cạnh này cần sửa bằng sự kiện hoặc đảo phụ thuộc."
      - clear: true
        show: |
          <p><b>Bước 5 — hai cách sửa cạnh gọi ngược.</b> Lớp dữ liệu ghi xong đơn, cần báo để lớp nghiệp vụ tính lại giá:</p>
          <table class="t"><tr><th>cách</th><th>làm thế nào</th><th>lời gọi còn lại</th></tr>
          <tr><td><b>sự kiện</b></td><td>lớp dữ liệu phát thông báo “đã ghi đơn” lên một kênh nằm ở lớp dữ liệu; lớp nghiệp vụ đăng ký nghe kênh đó. Lớp dữ liệu không biết ai đang nghe.</td><td>nghiệp vụ → dữ liệu (đăng ký nghe)</td></tr>
          <tr><td><b>đảo phụ thuộc</b></td><td>lớp dữ liệu tự khai một giao diện “khi ghi xong”; lớp nghiệp vụ viết hàm theo giao diện đó rồi truyền xuống. Lớp dữ liệu chỉ gọi giao diện <b>của chính nó</b>.</td><td>nghiệp vụ → dữ liệu (truyền hàm xuống)</td></tr></table>
          <p class="note">Hai cách đều bỏ được cạnh dữ liệu → nghiệp vụ: chạy lại luật trên 3 lời gọi còn lại thì còn $\hl{0}$ vi phạm.</p>
        focus: [1, "2.2", "2.2", "2.3", "2.3", 3]
        say: "Bước năm, xem hai cách sửa cạnh gọi ngược, khi lớp dữ liệu ghi xong đơn và cần báo để lớp nghiệp vụ tính lại giá. Cách thứ nhất là sự kiện, lớp dữ liệu phát một thông báo đã ghi đơn lên một kênh nằm ở chính lớp dữ liệu, và lớp nghiệp vụ đăng ký nghe kênh đó. Lớp dữ liệu không hề biết ai đang nghe, nên nó không gọi lên trên. Cách thứ hai là đảo phụ thuộc, lớp dữ liệu tự khai một giao diện khi ghi xong, lớp nghiệp vụ viết hàm theo giao diện đó rồi truyền xuống. Lớp dữ liệu chỉ gọi giao diện của chính nó, nên mũi tên phụ thuộc lại đi từ nghiệp vụ xuống dữ liệu. Chạy lại luật trên 3 lời gọi còn lại thì còn 0 vi phạm."
      - show: |
          <div class="box key"><b>Bước 6 — để máy giữ luật:</b> viết luật này thành kiểm thử trong <b>đường ống</b> (chuỗi bước kiểm tự động chạy mỗi khi có người gộp mã mới vào bản chung). Mỗi lần gộp mã, máy liệt kê lời gọi và chặn cạnh vi phạm — ranh giới không mục dần.</div>
        say: "Bước sáu, hãy viết luật này thành kiểm thử trong đường ống, tức chuỗi bước kiểm tự động chạy mỗi khi có người gộp mã mới vào bản chung. Mỗi lần gộp mã, máy liệt kê lời gọi và chặn cạnh vi phạm, để ranh giới không mục dần."

  - id: check
    kind: check
    title: "Tự kiểm: thử mọi cách xếp lớp"
    checks:
      - "sorted(len(alg.layer_violations([('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')], list(o))) for o in __import__('itertools').permutations(['giao_dien', 'nghiep_vu', 'du_lieu'])) == [1, 1, 2, 2, 3, 3]"
      - "alg.layer_violations([e for e in [('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')] if e != ('du_lieu', 'nghiep_vu')], ['giao_dien', 'nghiep_vu', 'du_lieu']) == [] and ('nghiep_vu', 'du_lieu') in [('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')] and ('du_lieu', 'nghiep_vu') in [('giao_dien', 'nghiep_vu'), ('nghiep_vu', 'du_lieu'), ('du_lieu', 'nghiep_vu'), ('giao_dien', 'du_lieu')]"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>có đổi thứ tự lớp để hết vi phạm được không?</td><td>máy thử cả 6 cách xếp 3 lớp</td><td>cách nào cũng có ít nhất 1 vi phạm</td></tr>
          <tr><td>vì sao?</td><td>tìm vòng lặp: nghiệp vụ → dữ liệu và dữ liệu → nghiệp vụ</td><td>có vòng lặp ✓</td></tr>
          <tr><td>bỏ cạnh dữ liệu → nghiệp vụ</td><td>chạy lại luật</td><td>0 vi phạm ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Có thể chỉ cần đổi thứ tự các lớp là hết vi phạm không? Máy thử cả 6 cách xếp 3 lớp, cách nào cũng còn ít nhất 1 vi phạm. Lý do là có vòng lặp, nghiệp vụ gọi dữ liệu và dữ liệu gọi nghiệp vụ, mà vòng lặp thì không cách xếp nào làm mọi mũi tên cùng đi xuống. Bỏ cạnh dữ liệu gọi nghiệp vụ rồi chạy lại luật thì còn 0 vi phạm, khớp với kết luận ở ví dụ."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[e for e in [('du_lieu', 'tien_ich'), ('tien_ich', 'nghiep_vu')] if e[0] in ['giao_dien', 'nghiep_vu', 'du_lieu'] and e[1] in ['giao_dien', 'nghiep_vu', 'du_lieu']] == []"
      - "alg.layer_violations([('du_lieu', 'tien_ich'), ('tien_ich', 'nghiep_vu')], ['giao_dien', 'nghiep_vu', 'du_lieu', 'tien_ich']) == [('tien_ich', 'nghiep_vu')]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tách dịch vụ mà vẫn dùng chung cơ sở dữ liệu <b class="red">(nguyên khối phân tán)</b>
          <br><span class="note"><b>Nguyên khối</b> là một chương trình làm mọi việc, triển khai một lần. Tách thành nhiều <b>dịch vụ</b> (chương trình riêng, gọi nhau qua mạng) mà hai dịch vụ cùng đọc ghi một bảng thì đổi <b>lược đồ</b> (tên cột, kiểu dữ liệu của bảng) là phải đổi và triển khai cả hai cùng lúc — vẫn dính như nguyên khối, lại thêm độ trễ mạng. Ranh giới dịch vụ phải là ranh giới dữ liệu: mỗi dịch vụ giữ bảng của riêng mình.</span></div>
        focus: [1, 1, 1, 1, 1]
        say: "Lỗi thứ nhất, tách dịch vụ mà vẫn dùng chung cơ sở dữ liệu. Nguyên khối là một chương trình làm mọi việc và được triển khai một lần, còn dịch vụ là các chương trình riêng gọi nhau qua mạng. Nếu hai dịch vụ cùng đọc ghi một bảng thì đổi lược đồ, tức tên cột và kiểu dữ liệu của bảng, là phải đổi và triển khai cả hai cùng lúc. Chúng vẫn dính nhau như nguyên khối, lại thêm độ trễ mạng, nên gọi là nguyên khối phân tán. Ranh giới dịch vụ phải là ranh giới dữ liệu, mỗi dịch vụ giữ bảng của riêng mình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Lớp dưới cần gọi lên thì gọi thẳng <b class="red">(chu trình)</b>
          <br><span class="note">Lớp dữ liệu cần báo khi ghi xong: thay vì gọi thẳng lên, cho nó phát sự kiện, hoặc nhận một hàm được truyền vào theo giao diện do <b>chính lớp dưới</b> khai (đảo phụ thuộc, như bước 5 của ví dụ).</span></div>
        say: "Lỗi thứ hai, lớp dưới cần báo lên thì gọi thẳng lên. Lớp dữ liệu cần báo khi ghi xong, thay vì gọi thẳng lên, hãy cho nó phát sự kiện. Hoặc cho nó nhận một hàm được truyền vào theo giao diện do chính lớp dưới khai, tức đảo phụ thuộc như bước năm của ví dụ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chia lớp theo kỹ thuật thay vì theo nghiệp vụ <b class="red">(ranh giới sai)</b>
          <br><span class="note">Một thư mục “tất cả lớp điều khiển”, một thư mục “tất cả lớp dữ liệu”: tính năng “đặt hàng” rải khắp nơi. Trong mỗi lớp, nhóm theo miền nghiệp vụ (đơn hàng, kho, thanh toán).</span></div>
        say: "Lỗi thứ ba, chia theo kỹ thuật thay vì theo nghiệp vụ. Một thư mục chứa tất cả lớp điều khiển, một thư mục chứa tất cả lớp dữ liệu, thì tính năng đặt hàng rải khắp nơi. Trong mỗi lớp, hãy nhóm theo miền nghiệp vụ như đơn hàng, kho, thanh toán."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Để thư mục “tiện ích” ngoài luật kiểm ranh giới <b class="red">(gọi ngược đi đường vòng)</b></div>
          <table class="t"><tr><th>lời gọi</th><th>luật chỉ xét 3 lớp đã khai</th><th>mọi thư mục phải có hạng (tiện ích hạng 3)</th></tr>
          <tr><td>dữ liệu → tiện ích</td><td>bỏ qua</td><td>2 → 3: hợp lệ</td></tr>
          <tr><td>tiện ích → nghiệp vụ</td><td>bỏ qua</td><td>3 → 1: <b class="red">vi phạm</b></td></tr>
          <tr><td>số vi phạm máy thấy</td><td>$\hl{0}$</td><td>$\hl{1}$</td></tr></table>
          <p class="note">Người làm nghề bắt <b>mọi</b> thư mục phải được xếp vào một lớp; thư mục nào chưa có hạng thì kiểm thử báo lỗi.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là để thư mục tiện ích nằm ngoài luật kiểm ranh giới. Dữ liệu gọi tiện ích, rồi tiện ích gọi nghiệp vụ, tức là gọi ngược lên bằng đường vòng. Nếu luật chỉ xét ba lớp đã khai thì cả hai lời gọi bị bỏ qua. Máy báo 0 vi phạm. Nếu bắt tiện ích có hạng 3, ở đáy, thì tiện ích gọi nghiệp vụ là từ 3 về 1, và máy thấy 1 vi phạm. Người làm nghề bắt mọi thư mục phải được xếp vào một lớp, thư mục nào chưa có hạng thì kiểm thử báo lỗi."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.layer_violations([('api', 'dich_vu'), ('dich_vu', 'kho'), ('kho', 'ha_tang'), ('ha_tang', 'dich_vu'), ('api', 'kho')], ['api', 'dich_vu', 'kho', 'ha_tang']) == [('ha_tang', 'dich_vu')]"
      - "[(['api', 'dich_vu', 'kho', 'ha_tang'].index(a), ['api', 'dich_vu', 'kho', 'ha_tang'].index(b)) for a, b in [('api', 'dich_vu'), ('dich_vu', 'kho'), ('kho', 'ha_tang'), ('ha_tang', 'dich_vu'), ('api', 'kho')]] == [(0, 1), (1, 2), (2, 3), (3, 1), (0, 2)] and 3 - 1 == 2"
      - "alg.layer_violations([e for e in [('api', 'dich_vu'), ('dich_vu', 'kho'), ('kho', 'ha_tang'), ('ha_tang', 'dich_vu'), ('api', 'kho')] if e != ('ha_tang', 'dich_vu')], ['api', 'dich_vu', 'kho', 'ha_tang']) == []"
    steps:
      - show: |
          <p>Bốn lớp từ trên xuống: <code>api</code>, <code>dich_vu</code>, <code>kho</code>, <code>ha_tang</code>. Lời gọi tìm thấy:</p>
          <p><code>api → dich_vu</code>, <code>dich_vu → kho</code>, <code>kho → ha_tang</code>, <code>ha_tang → dich_vu</code>, <code>api → kho</code></p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cạnh nào vi phạm?</td></tr>
          <tr><td>2</td><td>Sửa cạnh đó thế nào?</td></tr></table>
        focus: [1, 2, "3.2", "3.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với bốn lớp từ trên xuống, giao diện lập trình, dịch vụ, kho, và hạ tầng. Trên màn hình là năm lời gọi tìm thấy trong mã. Câu một, cạnh nào vi phạm? Câu hai, sửa cạnh đó thế nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>lời gọi</th><th>hạng</th><th>kết luận</th></tr>
          <tr><td><code>api → dich_vu</code></td><td>0 → 1</td><td class="green">hợp lệ</td></tr>
          <tr><td><code>dich_vu → kho</code></td><td>1 → 2</td><td class="green">hợp lệ</td></tr>
          <tr><td><code>kho → ha_tang</code></td><td>2 → 3</td><td class="green">hợp lệ</td></tr>
          <tr><td><code>ha_tang → dich_vu</code></td><td>3 → 1</td><td class="red">vi phạm</td></tr>
          <tr><td><code>api → kho</code></td><td>0 → 2</td><td>hợp lệ (bỏ qua một lớp, nên hỏi vì sao)</td></tr></table>
        focus: [1, 1, "1.5", "1.6"]
        say: "Đáp án câu một, trước hết gán hạng, giao diện lập trình 0, dịch vụ 1, kho 2, hạ tầng 3. Ba lời gọi đầu đều đi từ hạng nhỏ sang hạng lớn hơn nên hợp lệ. Chỉ có cạnh hạ tầng gọi dịch vụ là vi phạm, vì nó gọi ngược lên hai lớp. Còn giao diện lập trình gọi thẳng kho là hợp lệ, nhưng bỏ qua một lớp nên cần hỏi vì sao."
      - show: |
          <p>② Hạ tầng phát sự kiện (“đã ghi xong”) lên kênh của chính nó để dịch vụ đăng ký nghe; hoặc hạ tầng tự khai một giao diện, dịch vụ viết hàm theo giao diện đó rồi truyền xuống cho hạ tầng gọi — phụ thuộc lại đi một chiều.</p>
          <p class="note">Bỏ cạnh <code>ha_tang → dich_vu</code> rồi chạy lại luật: còn 0 vi phạm.</p>
        focus: [1, 1, 2]
        say: "Câu hai, cho hạ tầng phát sự kiện đã ghi xong lên kênh của chính nó để dịch vụ đăng ký nghe. Hoặc hạ tầng tự khai một giao diện, dịch vụ viết hàm theo giao diện đó rồi truyền xuống cho hạ tầng gọi, như vậy phụ thuộc lại đi một chiều. Bỏ cạnh hạ tầng gọi dịch vụ rồi chạy lại luật thì còn 0 vi phạm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mỗi lớp một trách nhiệm</span><span class="a">→</span>
          <span class="n">chỉ gọi lớp dưới, qua giao diện hẹp</span><span class="a">→</span>
          <span class="n">cần báo lên: sự kiện hoặc đảo phụ thuộc</span><span class="a">→</span>
          <span class="n">máy kiểm ranh giới mỗi lần hợp nhất</span></div>
        say: "Tổng kết lại, mỗi lớp một trách nhiệm, chỉ gọi lớp dưới qua một giao diện hẹp. Cần báo lên thì dùng sự kiện hoặc đảo phụ thuộc, và để máy kiểm ranh giới mỗi lần hợp nhất."
      - show: |
          <div class="box key"><b>Tư duy:</b> ranh giới tốt cho phép thay một phần mà không phải hiểu toàn bộ. Đó là cách một hệ thống lớn vẫn sửa được.</div>
        say: "Điều cần mang theo, ranh giới tốt cho phép thay một phần mà không phải hiểu toàn bộ, và đó là cách một hệ thống lớn vẫn sửa được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>bộ nhớ đệm</b> — ở đâu, bao lâu, làm mất hiệu lực thế nào.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học bộ nhớ đệm, đặt ở đâu, giữ bao lâu, và làm mất hiệu lực thế nào. Hẹn gặp bạn ở bài tiếp theo."
