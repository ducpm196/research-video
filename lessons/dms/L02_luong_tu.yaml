assumes: [lnot, land, lor, lto, equiv]
# Quy ước: vị từ (câu có biến) đặt tên Q(x), R(x) — KHÔNG dùng P(x) vì sổ ký hiệu chung dành “P(” cho xác suất.
#   ℕ = {0, 1, 2, …} (có số 0, như Rosen). Lượng từ viết dạng “∀x ∈ ℕ: Q(x)”.
objectives:
  - "Đọc và viết câu có “với mọi”, “tồn tại”"
  - "Phủ định một câu có lượng từ"
  - "Nhận ra miền xác định và thứ tự lượng từ làm đổi chân trị"
asr_reviewed:
  - {sentence: "Phủ định phép và theo luật De Morgan ở bài 1, ta dùng luật hai lần, lần đầu coi Q của 1 và Q của 2 là một khối.", reason: "De Morgan đọc “Đơ Mo-gần” (lexicon_vi.DMS.yaml, probe p1_ten 8/8, đối chứng 0/8); ASR chép “đơ mô gần/đơ Morgan”, cùng âm"}
  - {sentence: "Câu với mọi là phép và của tất cả các ô, nên chỉ một ô đỏ là đủ làm cả câu sai.", reason: "ASR chép “Câu với mọi là phép và của tất cả các cô, nền chỉ một ô đỏ là đủ làm cả câu sai.” (0.909): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: nên (trong “ô nên” → “cô nền”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Việc thứ hai là luật De Morgan đã học ở bài 1, phủ định của phép và là phép hoặc của hai phủ định.", reason: "ASR chép “Việc thứ hai là luật đơ Morgan đã học ở bài một, phủ định của phép và là phép hoặc của hai phủ định.” (0.958): lệch âm/thanh thuần Việt: de/đơ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bình phương có luôn lớn hơn chính nó?"
    checks:
      - "all(x * x >= x for x in range(0, 10**4))"
      - "Fraction(1, 2) ** 2 == Fraction(1, 4) and Fraction(1, 4) < Fraction(1, 2)"
    steps:
      - show: |
          <div class="box key">“Mọi số đều có bình phương lớn hơn hoặc bằng chính nó.”</div>
          <p>Với 0, 1, 2, 3, …: $0 \ge 0$, $1 \ge 1$, $4 \ge 2$, $9 \ge 3$ — có vẻ đúng.</p>
          <p>Với $\frac{1}{2}$: bình phương là $\frac{1}{4}$, mà $\frac{1}{4}$ nhỏ hơn $\frac{1}{2}$ — sai!</p>
        focus: [1, 2, 3]
        say: "Chào bạn, câu này đúng hay sai, mọi số đều có bình phương lớn hơn hoặc bằng chính nó? Với các số 0, 1, 2, 3, có vẻ đúng. Nhưng với một phần hai, bình phương là một phần tư, lại nhỏ hơn một phần hai."
      - show: |
          <p>Câu đúng hay sai phụ thuộc vào “mọi số” là <b>số nào</b>. Hôm nay: cách nói chính xác “với mọi”, “tồn tại”, và cách phủ định chúng.</p>
        say: "Vậy câu đúng hay sai phụ thuộc vào mọi số là những số nào. Hôm nay ta học cách nói chính xác với mọi và tồn tại, và cách phủ định chúng."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bình phương, so sánh phân số, luật De Morgan"
    checks:
      - "3 ** 2 == 9 and Fraction(1, 2) ** 2 == Fraction(1, 2) * Fraction(1, 2) == Fraction(1, 4)"
      - "Fraction(1, 2) == Fraction(2, 4) and Fraction(1, 4) < Fraction(2, 4)"
      - "(lambda a, b: (not (a and b)) == ((not a) or (not b)) == True)(True, False)"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>bình phương</th><th>so với chính nó</th></tr>
          <tr><td>3</td><td>$3 \times 3 = 9$</td><td>$9 \ge 3$</td></tr>
          <tr><td>$\frac{1}{2}$</td><td>$\frac{1}{2} \times \frac{1}{2} = \frac{1}{4}$</td><td>$\frac{1}{2} = \frac{2}{4}$, mà $\frac{1}{4} \lt \frac{2}{4}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Trước khi vào bài, ta ôn hai phép tính sẽ dùng. Bình phương là nhân một số với chính nó, 3 bình phương bằng 3 nhân 3, bằng 9, lớn hơn 3. Một phần hai bình phương bằng một phần hai nhân một phần hai, bằng một phần tư. Muốn so một phần tư với một phần hai, ta quy đồng, một phần hai bằng hai phần tư, nên một phần tư nhỏ hơn."
      - clear: true
        show: |
          <p>Luật De Morgan của bài 1: phủ định của “và” là “hoặc” của hai phủ định.</p>
          <table class="t"><tr><th>đủ tuổi</th><th>có vé</th><th>không (đủ tuổi và có vé)</th><th>thiếu tuổi hoặc thiếu vé</th></tr>
          <tr><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Việc thứ hai là luật De Morgan đã học ở bài 1, phủ định của phép và là phép hoặc của hai phủ định. Thử một người đủ tuổi mà không có vé, câu không vừa đủ tuổi vừa có vé là đúng. Câu thiếu tuổi hoặc thiếu vé cũng đúng, vì người đó thiếu vé."

  # ───────────────────────── 2. KÝ HIỆU: VỊ TỪ, TẬP SỐ ─────────────────────────
  - id: sym_pred
    kind: symbol
    title: "Giải mã: vị từ Q(x), thuộc ∈, tập ℕ và ℚ"
    checks:
      - "(3 * 3 >= 3) is True"
    steps:
      - show: |
          <p><b>Vị từ</b>: câu có biến, như $Q(x)$: “$x^2 \ge x$”. Chưa có chân trị — thay $x = 3$ thì thành mệnh đề $Q(3)$: “$9 \ge 3$”, đúng.</p>
        say: "Câu có chứa biến gọi là vị từ, ví dụ Q của x là câu x bình phương lớn hơn hoặc bằng x. Nó chưa có chân trị. Thay x bằng 3, ta được mệnh đề Q của 3, 9 lớn hơn hoặc bằng 3, đúng."
      - show: |
          <p>$x \in A$: đọc “x thuộc A”, nghĩa là $x$ là một phần tử của tập $A$.</p>
          <p>$\mathbb{N} = \{0, 1, 2, 3, \dots\}$: tập số tự nhiên (tính cả số 0).</p>
          <p>$\mathbb{Q}$: tập số hữu tỉ — các phân số $\frac{a}{b}$ với $a, b$ nguyên, $b \neq 0$, như $\frac{1}{2}$ hay âm $\frac{3}{4}$.</p>
        introduces: [in, naturals, rationals, set, dots]
        focus: [1, 2, 3]
        say: "Ký hiệu giống chữ e cong đọc là thuộc, x thuộc A nghĩa là x là một phần tử của tập A. Chữ N in đậm kép là tập số tự nhiên, 0, 1, 2, 3, và cứ thế tiếp tục, ta tính cả số 0. Chữ Q in đậm kép là tập số hữu tỉ, gồm các phân số a phần b, với a và b là số nguyên, b khác 0, như một phần hai."

  # ───────────────────────── 3. KÝ HIỆU: LƯỢNG TỪ ─────────────────────────
  - id: sym_quant
    kind: symbol
    title: "Giải mã: với mọi ∀, tồn tại ∃"
    checks:
      - "all(x * x >= x for x in range(10**4)) and any(x * x == x for x in range(10))"
    steps:
      - show: |
          <table class="t"><tr><th>viết</th><th>đọc</th><th>đúng khi</th></tr>
          <tr><td>$\forall x \in \mathbb{N}: Q(x)$</td><td>với mọi x thuộc N, Q(x)</td><td><b>mọi</b> $x$ trong $\mathbb{N}$ làm $Q(x)$ đúng</td></tr>
          <tr><td>$\exists x \in \mathbb{N}: Q(x)$</td><td>tồn tại x thuộc N, Q(x)</td><td><b>ít nhất một</b> $x$ làm $Q(x)$ đúng</td></tr></table>
          <p class="note">Hai ký hiệu $\forall$, $\exists$ gọi chung là <b>lượng từ</b>.</p>
        introduces: [forall, exists]
        focus: ["1.2", "1.3", ["1.3", 2]]
        say: "Chữ A lộn ngược đọc là với mọi, câu với mọi x thuộc N, Q của x, đúng khi mọi x trong N đều làm Q đúng. Chữ E quay ngược đọc là tồn tại, câu tồn tại x thuộc N, Q của x, đúng khi có ít nhất một x làm Q đúng. Chỉ cần một là đủ, không cần duy nhất, và hai ký hiệu này gọi chung là lượng từ."
      - show: |
          <div class="box ok">Với $Q(x)$: “$x^2 \ge x$”: &nbsp; $\forall x \in \mathbb{N}: Q(x)$ <b>đúng</b>; &nbsp; $\forall x \in \mathbb{Q}: Q(x)$ <b>sai</b> (vì $x = \frac{1}{2}$).</div>
        say: "Quay lại câu đầu bài. Với mọi x thuộc N, x bình phương lớn hơn hoặc bằng x, là đúng. Nhưng với mọi x thuộc Q thì sai, vì x bằng một phần hai làm Q sai. Cùng một vị từ, đổi miền là đổi chân trị."

  # ───────────────────────── 4. PHỦ ĐỊNH LƯỢNG TỪ ─────────────────────────
  - id: negation
    kind: concept
    title: "Phủ định: “với mọi” thành “tồn tại … không”"
    checks:
      - "all((not all(q)) == any(not v for v in q) for q in [(a, b, c) for a in (True, False) for b in (True, False) for c in (True, False)])"
      - "all((not any(q)) == all(not v for v in q) for q in [(a, b, c) for a in (True, False) for b in (True, False) for c in (True, False)])"
    steps:
      - show: |
          <div class="box key">$$\neg\, \forall x: Q(x) \;\equiv\; \exists x: \neg Q(x) \qquad \neg\, \exists x: Q(x) \;\equiv\; \forall x: \neg Q(x)$$</div>
        say: "Luật phủ định lượng từ. Phủ định của với mọi x, Q của x, là tồn tại x mà Q của x sai. Phủ định của tồn tại x, Q của x, là với mọi x, Q của x đều sai."
      - show: |
          <p>Vì sao? Trên miền $\{1, 2, 3\}$:</p>
          <p>$\forall x: Q(x)$ chính là $Q(1) \land Q(2) \land Q(3)$; &nbsp; $\exists x: Q(x)$ chính là $Q(1) \lor Q(2) \lor Q(3)$.</p>
          <p>Phủ định theo De Morgan, dùng hai lần (lần đầu coi $Q(1) \land Q(2)$ là một khối): $\neg(Q(1) \land Q(2) \land Q(3)) \equiv \neg Q(1) \lor \neg Q(2) \lor \neg Q(3)$ — tức là “tồn tại $x$ làm $Q$ sai”.</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Vì sao lại như vậy? Xét miền chỉ có ba số 1, 2, 3. Khi đó với mọi chính là một phép và rất dài, Q của 1 và Q của 2 và Q của 3. Còn tồn tại chính là một phép hoặc rất dài. Phủ định phép và theo luật De Morgan ở bài 1, ta dùng luật hai lần, lần đầu coi Q của 1 và Q của 2 là một khối. Ta được phép hoặc của các phủ định, tức là tồn tại một x làm Q sai."
      - show: |
          <p>Bằng lời: phủ định của “mọi sinh viên đều qua môn” là “<b>có ít nhất một</b> sinh viên trượt” — không phải “mọi sinh viên đều trượt”.</p>
        say: "Nói bằng lời, phủ định của mọi sinh viên đều qua môn là có ít nhất một sinh viên trượt, chứ không phải mọi sinh viên đều trượt."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Lượng từ là một hàng đèn"
    checks:
      - "[x * x >= x for x in (0, Fraction(1, 2), 1, 2, 3)] == [True, False, True, True, True]"
      - "Fraction(1, 2) ** 2 == Fraction(1, 4) and 2 ** 2 == 4 and 3 ** 2 == 9"
    steps:
      - show: |
          <div><svg width="1460" height="330" viewBox="0 0 1460 330"><circle cx="200" cy="110" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="200" y="121" font-size="32" text-anchor="middle">0</text><text x="200" y="200" font-size="22" text-anchor="middle" fill="#15803d">0 ≥ 0</text><text x="200" y="232" font-size="22" text-anchor="middle" fill="#15803d" font-weight="700">Đ</text><circle cx="390" cy="110" r="52" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="390" y="121" font-size="32" text-anchor="middle">1/2</text><text x="390" y="200" font-size="22" text-anchor="middle" fill="#b91c1c">1/4 &lt; 1/2</text><text x="390" y="232" font-size="22" text-anchor="middle" fill="#b91c1c" font-weight="700">S</text><circle cx="580" cy="110" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="580" y="121" font-size="32" text-anchor="middle">1</text><text x="580" y="200" font-size="22" text-anchor="middle" fill="#15803d">1 ≥ 1</text><text x="580" y="232" font-size="22" text-anchor="middle" fill="#15803d" font-weight="700">Đ</text><circle cx="770" cy="110" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="770" y="121" font-size="32" text-anchor="middle">2</text><text x="770" y="200" font-size="22" text-anchor="middle" fill="#15803d">4 ≥ 2</text><text x="770" y="232" font-size="22" text-anchor="middle" fill="#15803d" font-weight="700">Đ</text><circle cx="960" cy="110" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="960" y="121" font-size="32" text-anchor="middle">3</text><text x="960" y="200" font-size="22" text-anchor="middle" fill="#15803d">9 ≥ 3</text><text x="960" y="232" font-size="22" text-anchor="middle" fill="#15803d" font-weight="700">Đ</text><text x="200" y="36" font-size="24" fill="#374151">Miền 5 số, mỗi số một ô; ô xanh: Q(x) đúng, ô đỏ: Q(x) sai</text><text x="1130" y="96" font-size="23" fill="#b91c1c">với mọi = và của mọi ô</text><text x="1130" y="128" font-size="23" fill="#b91c1c">một ô đỏ là đủ làm SAI</text><text x="1130" y="196" font-size="23" fill="#15803d">tồn tại = hoặc của mọi ô</text><text x="1130" y="228" font-size="23" fill="#15803d">một ô xanh là đủ làm ĐÚNG</text><text x="200" y="300" font-size="24" fill="#ea580c">Phủ định “mọi ô xanh” = “có một ô đỏ”: chỉ tay vào ô 1/2 là xong.</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hãy hình dung miền gồm năm số, 0, một phần hai, 1, 2 và 3, mỗi số là một ô đèn, xanh khi Q của x đúng, đỏ khi Q của x sai. Câu với mọi là phép và của tất cả các ô, nên chỉ một ô đỏ là đủ làm cả câu sai. Câu tồn tại là phép hoặc của tất cả các ô, nên chỉ một ô xanh là đủ làm cả câu đúng. Ở đây ô một phần hai màu đỏ, vì một phần tư nhỏ hơn một phần hai. Vậy phủ định câu mọi ô đều xanh là có một ô đỏ, chỉ tay vào ô đó là xong."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Lượng từ trong mã: all và any"
    checks:
      - "all(x * x >= x for x in range(10**4))"
      - "not any(x * x < x for x in range(10**4))"
      - "any(x * x < x for x in [Fraction(1, 2), Fraction(3, 2), 2])"
      - "(lambda D: all(x * x >= x for x in D) is False and any(not (x * x >= x) for x in D) is True)([0, Fraction(1, 2), 1, 2])"
    steps:
      - show: |
          <p>Trong Python, trên một danh sách hữu hạn: <code>all(...)</code> là “với mọi”, <code>any(...)</code> là “tồn tại”.</p>
          <div class="code"><div>all(x*x &gt;= x for x in range(10000))   # True</div>
          <div>any(x*x &lt;  x for x in range(10000))   # False — phủ định, cũng nhất quán</div></div>
        focus: [1, "2.1", "2.2"]
        say: "Trong một số ngôn ngữ lập trình có sẵn hai hàm, trên một danh sách hữu hạn, hàm đầu tiên trên màn hình chính là với mọi, hàm thứ hai chính là tồn tại. Kiểm mọi số từ 0 đến 9999, x bình phương lớn hơn hoặc bằng x luôn đúng. Câu phủ định, tồn tại x có bình phương nhỏ hơn x, cho sai, đúng như luật phủ định vừa học."
      - show: |
          <div class="code"><div>any(x*x &lt; x for x in [1/2, 3/2, 2])   # True — tìm thấy x = 1/2</div></div>
          <div class="box warn">Máy kiểm 10 000 số chỉ chứng minh điều đó cho 10 000 số, chưa phải cho cả $\mathbb{N}$ (vô hạn).</div>
        focus: [1, 2, 2]
        say: "Trên các phân số, hàm tồn tại tìm ra ngay x bằng một phần hai. Lưu ý, máy kiểm mười nghìn số chỉ chứng minh điều đó cho mười nghìn số. Muốn chắc cho cả tập N vô hạn, ta cần một chứng minh."
      - clear: true
        show: |
          <p><b>Làm tay</b> trên miền $\{0, \frac{1}{2}, 1, 2\}$ với $Q(x)$: “$x^2 \ge x$”:</p>
          <table class="t"><tr><th>$x$</th><th>0</th><th>$\frac{1}{2}$</th><th>1</th><th>2</th></tr>
          <tr><td>$Q(x)$</td><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td></tr></table>
          <p>với mọi: Đ và S và Đ và Đ = <b>S</b>; &nbsp; tồn tại $x$ làm $Q$ sai: có, $x = \frac{1}{2}$ → <b>Đ</b>. Hai câu ngược nhau, đúng luật phủ định.</p>
        focus: [1, 2, 3, 3]
        say: "Bây giờ làm tay trên một miền nhỏ gồm 0, một phần hai, 1 và 2. Tính Q ở từng số, được đúng, sai, đúng, đúng. Câu với mọi là phép và của bốn kết quả, nên sai, vì có một ô sai. Còn câu tồn tại x làm Q sai thì đúng, nhờ x bằng một phần hai, nên hai câu ngược nhau đúng như luật phủ định."

  # ───────────────────────── 6. THỨ TỰ LƯỢNG TỪ ─────────────────────────
  - id: order
    kind: concept
    title: "Đổi thứ tự lượng từ là đổi nghĩa"
    checks:
      - "all(any(y > x for y in range(x, x + 2)) for x in range(1000))"
      - "not any(all(y > x for x in range(1000)) for y in range(1000))"
    steps:
      - show: |
          <p>① $\forall x \in \mathbb{N}\ \exists y \in \mathbb{N}: y \gt x$ — mỗi số có một số lớn hơn nó (chọn $y = x + 1$): <b>đúng</b>.</p>
          <p>② $\exists y \in \mathbb{N}\ \forall x \in \mathbb{N}: y \gt x$ — có một số lớn hơn <b>mọi</b> số: <b>sai</b> (chính nó không lớn hơn nó).</p>
        focus: [1, 1, 2, 2]
        say: "Câu thứ nhất, với mọi x tồn tại y lớn hơn x. Câu này đúng, vì với mỗi x ta chọn y bằng x cộng 1. Câu thứ hai đảo thứ tự, tồn tại một y lớn hơn mọi x. Câu này sai, vì y không lớn hơn chính nó."
      - show: |
          <div class="box key">Trong câu ①, $y$ được chọn <b>sau</b> khi biết $x$ — được phép phụ thuộc $x$. Trong câu ②, $y$ phải chọn <b>trước</b>, một lần cho mọi $x$.</div>
        say: "Điểm khác nhau nằm ở thứ tự. Ở câu một, y được chọn sau khi biết x, nên y được phép phụ thuộc vào x. Ở câu hai, y phải chọn trước, một lần dùng cho mọi x."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: một ví dụ hay một phản ví dụ"
    checks:
      - "any(x * x == 2 * x for x in range(1, 10))"
      - "all(x * x - x == x * (x - 1) >= 0 for x in range(10**4)) and 3 * (3 - 1) == 6"
      - "Fraction(1, 2) * (Fraction(1, 2) - 1) == Fraction(-1, 4)"
    steps:
      - show: |
          <table class="t"><tr><th>muốn chứng tỏ</th><th>cần</th></tr>
          <tr><td>$\exists x: Q(x)$ đúng</td><td>chỉ ra <b>một</b> $x$ làm $Q$ đúng</td></tr>
          <tr><td>$\forall x: Q(x)$ sai</td><td>chỉ ra <b>một</b> phản ví dụ</td></tr>
          <tr><td>$\forall x: Q(x)$ đúng</td><td>một chứng minh cho <b>mọi</b> $x$ — ví dụ không đủ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng bảng này. Muốn chứng tỏ tồn tại là đúng, chỉ cần chỉ ra một x, vì một là đủ, ví dụ x bằng 2 làm x bình phương bằng 2x. Muốn chứng tỏ với mọi là sai, cũng chỉ cần một phản ví dụ. Nhưng muốn chứng tỏ với mọi là đúng, ví dụ bao nhiêu cũng không đủ, phải chứng minh."
      - clear: true
        show: |
          <p><b>Đường khác: chứng minh cho cả $\mathbb{N}$</b>, không cần máy thử. Viết $x^2 - x = x \times (x - 1)$.</p>
          <p>Với $x \in \mathbb{N}$: hoặc $x = 0$, tích bằng 0; hoặc $x \ge 1$, khi đó $x \ge 1$ và $x - 1 \ge 0$, tích hai số không âm thì không âm.</p>
          <p>Vậy $x^2 - x \ge 0$, tức $x^2 \ge x$, với <b>mọi</b> $x \in \mathbb{N}$.</p>
        focus: [1, 2, 2, 3]
        say: "Bây giờ kiểm câu với mọi x thuộc N bằng một đường khác, chứng minh cho cả tập vô hạn mà không cần máy thử. Ta viết x bình phương trừ x thành x nhân với x trừ 1. Nếu x bằng 0 thì tích bằng 0, còn nếu x lớn hơn hoặc bằng 1 thì cả hai thừa số đều không âm, nên tích không âm. Vậy x bình phương lớn hơn hoặc bằng x, với mọi x thuộc N."
      - show: |
          <table class="t"><tr><th>$x$</th><th>$x \times (x - 1)$</th><th>dấu</th></tr>
          <tr><td>3</td><td>$3 \times 2 = 6$</td><td>không âm</td></tr>
          <tr><td>$\frac{1}{2}$</td><td>$\frac{1}{2} \times (\text{âm } \frac{1}{2}) = \text{âm } \frac{1}{4}$</td><td>âm: đúng là phản ví dụ</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Làm thử công thức vừa viết bằng hai số. Với x bằng 3, x nhân x trừ 1 bằng 3 nhân 2, bằng 6, không âm, khớp với 9 lớn hơn 3. Với x bằng một phần hai, x trừ 1 là âm một phần hai, tích bằng âm một phần tư, nên đây đúng là phản ví dụ ta gặp ở đầu bài."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Phủ định $\forall x: Q(x)$ thành $\forall x: \neg Q(x)$ <b class="red">(sai)</b>
          <br><span class="note">Đúng là $\exists x: \neg Q(x)$ — chỉ cần một trường hợp sai.</span></div>
        say: "Lỗi thứ nhất, phủ định của với mọi x, Q của x, viết thành với mọi x, Q của x sai. Đúng phải là tồn tại x làm Q sai, chỉ cần một trường hợp sai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nói “với mọi số” mà không nói số nào <b class="red">(thiếu)</b>
          <br><span class="note">Cùng câu $x^2 \ge x$: đúng trên $\mathbb{N}$, sai trên $\mathbb{Q}$. Phải ghi rõ miền.</span></div>
        say: "Lỗi thứ hai, nói với mọi số mà không nói rõ là số nào. Cùng câu x bình phương lớn hơn hoặc bằng x, đúng trên N mà sai trên Q, nên phải ghi rõ miền."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đổi chỗ $\forall$ và $\exists$ cho “gọn” <b class="red">(sai)</b>
          <br><span class="note">“Mỗi người có một mật khẩu” khác “có một mật khẩu dùng cho mọi người”.</span></div>
          <table class="t"><tr><th>câu</th><th>An</th><th>Bình</th></tr>
          <tr><td>với mọi người, tồn tại mật khẩu</td><td>mật khẩu riêng của An</td><td>mật khẩu riêng của Bình</td></tr>
          <tr><td>tồn tại mật khẩu, với mọi người</td><td>một mật khẩu chung</td><td>đúng mật khẩu chung ấy</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ ba, đổi chỗ với mọi và tồn tại cho gọn. Mỗi người có một mật khẩu, khác hẳn có một mật khẩu dùng chung cho mọi người."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Máy thử 10 000 số đều đúng nên câu “với mọi” đúng <b class="red">(sai)</b>
          <br><span class="note">Có những câu đúng với hàng triệu số đầu rồi mới sai. Thử nhiều chỉ làm ta tin hơn, không chứng minh.</span></div>
        say: "Lỗi thứ tư, máy thử mười nghìn số đều đúng nên kết luận câu với mọi là đúng. Có những câu đúng với hàng triệu số đầu tiên rồi mới sai, thử nhiều chỉ làm ta tin hơn, chứ chưa chứng minh."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "not any(x + 1 == 0 for x in range(10**4))"
      - "not (0 * 0 > 0) and not all(x * x > 0 for x in range(-5, 6))"
      - "(-2) ** 2 == 4 and 3 ** 2 == 9 and 0 ** 2 == 0 and 0 + 1 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phủ định câu $\exists x \in \mathbb{N}: x + 1 = 0$. Câu phủ định đúng hay sai?</td></tr>
          <tr><td>2</td><td>Câu “mọi số nguyên đều có bình phương lớn hơn 0” đúng hay sai? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, phủ định câu tồn tại x thuộc N để x cộng 1 bằng 0, câu phủ định đúng hay sai? Câu hai, câu mọi số nguyên đều có bình phương lớn hơn 0 đúng hay sai, vì sao? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — đổi “tồn tại” thành “với mọi”, phủ định vế sau: $\forall x \in \mathbb{N}: x + 1 \neq 0$.</p>
          <p><b>Bước 2</b> — vì $x \ge 0$ nên $x + 1 \ge 1$, không thể bằng 0 → câu phủ định <b>đúng</b> (thử $x = 0$: $0 + 1 = 1$).</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, bước một, theo luật phủ định, đổi tồn tại thành với mọi rồi phủ định vế sau, được với mọi x thuộc N, x cộng 1 khác 0. Bước hai, vì x lớn hơn hoặc bằng 0 nên x cộng 1 ít nhất là 1, không thể bằng 0, nên câu phủ định đúng. Thử số nhỏ nhất x bằng 0, ta được 0 cộng 1 bằng 1, khác 0."
      - show: |
          <table class="t"><tr><th>$x$</th><th>âm 2</th><th>0</th><th>3</th></tr>
          <tr><td>$x^2$</td><td>4</td><td>$\hl{0}$</td><td>9</td></tr>
          <tr><td>$x^2 \gt 0$?</td><td>Đ</td><td>$\hl{\text{S}}$</td><td>Đ</td></tr></table>
          <p>② <b>Sai</b> — một phản ví dụ là đủ: $x = 0$ cho $0^2 = 0$, không lớn hơn 0.</p>
        focus: [1, 2]
        say: "Câu hai, thử vài số nguyên, âm 2 bình phương bằng 4, 3 bình phương bằng 9, đều lớn hơn 0, nhưng 0 bình phương bằng 0. Vậy câu sai, vì một phản ví dụ là x bằng 0 đã đủ bác bỏ câu với mọi."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vị từ $Q(x)$ + miền</span><span class="a">→</span>
          <span class="n">$\forall$: mọi $x$; $\exists$: ít nhất một</span><span class="a">→</span>
          <span class="n">phủ định: đổi $\forall$ thành $\exists$ (và ngược lại), phủ định $Q$</span><span class="a">→</span>
          <span class="n">thứ tự lượng từ quan trọng</span></div>
        say: "Tổng kết lại, vị từ là câu có biến, luôn đi kèm một miền. Với mọi nghĩa là mọi x, tồn tại nghĩa là ít nhất một x. Phủ định thì đổi với mọi thành tồn tại và ngược lại, rồi phủ định vị từ. Và thứ tự các lượng từ làm thay đổi nghĩa."
      - show: |
          <div class="box key"><b>Tư duy:</b> một phản ví dụ đủ bác bỏ “với mọi”; còn khẳng định “với mọi” cần một chứng minh.</div>
        say: "Điều cần mang theo, một phản ví dụ là đủ để bác bỏ câu với mọi, còn muốn khẳng định câu với mọi thì cần một chứng minh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>các kiểu chứng minh</b> — trực tiếp, phản đảo, phản chứng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học các kiểu chứng minh, chứng minh trực tiếp, chứng minh qua phản đảo, và chứng minh bằng phản chứng. Hẹn gặp bạn ở bài tiếp theo."
