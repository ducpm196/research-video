      focus:
      - 1
      - 1
      - 1
      - 1
      - 1
      - 0
      pause: 420
      say: Bây giờ tới phần bạn tự làm. Hãy viết chương trình tìm nghịch đảo theo mô-đun và nhận ra khi nào không có nghịch đảo. Sau đó tính một lũy thừa lớn theo mô-đun bằng hai cách, bình phương liên tiếp và định lý Fermat nhỏ, và đếm số phép nhân của cách thứ nhất. Cuối cùng chỉ ra rằng 561 là hợp số dù vẫn qua phép thử Fermat. Năm dòng và định dạng nằm trong thư mục thực hành. Hãy dừng video và tự làm.
    - clear: true
      show: |
        <p><b>Kết quả mong đợi</b></p><div class="code"><div>nghich dao cua 7 theo mo-dun 40: 23</div><div>nghich dao cua 12 theo mo-dun 18: khong co</div><div>6^100 mod 19: 6 6</div><div>so phep nhan cua luy thua nhanh voi mu 1000: 16</div><div>2^560 mod 561: 1, uoc nho nhat cua 561: 3</div></div><p class="note">Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b>. Chấm bằng Git Bash: <code>bash labs/cham.sh DMS L14 luythua.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>DMS L14 luythua.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
      focus:
      - 2
      - 2
      - 3
      - 3
      say: 'Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng với màn hình. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
    - clear: true
      show: |
        <div class="box key"><b>Nếu kẹt:</b> nghịch đảo: thử từng $b$ trong 1..n−1. Lũy thừa nhanh: lặp <code>if e % 2 == 1: kq = kq * a % n</code>, rồi <code>a = a * a % n</code>, <code>e = e // 2</code>. Fermat: $p$ nguyên tố thì $a^{p-1} \equiv 1$, nên hạ số mũ bằng <code>e % (p - 1)</code>. Lời giải ở <code>labs/DMS/L14/loi_giai.py</code> — chỉ mở sau khi đã thử.</div><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>if e % 2 == 1:</code></td><td><code>e % 2</code> là số dư khi chia e cho 2, <code>==</code> là so sánh bằng: chỉ khi e lẻ mới làm dòng thụt vào</td><td>e = 5: 5 % 2 = 1 nên đúng</td></tr><tr><td><code>kq = kq * a % n, a = a * a % n</code></td><td><code>*</code> là nhân; nhân rồi lấy dư cho n và cất lại vào tên bên trái</td><td>kq = 3, a = 9, n = 7: kq thành 27 % 7 = 6</td></tr><tr><td><code>e = e // 2</code></td><td><code>//</code> là chia lấy phần nguyên: chia đôi số mũ, bỏ chữ số nhị phân cuối</td><td>13 // 2 = 6</td></tr><tr><td><code>e % (p - 1)</code></td><td>số dư khi chia e cho p − 1, không phải cho p</td><td>e = 100, p = 7: 100 % 6 = 4</td></tr></table>
      focus:
      - 1
      - 1
      - 1
      - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
      - 1
      say: Nếu kẹt, tìm nghịch đảo bằng cách thử từng số nhỏ hơn mô-đun. Lũy thừa nhanh lặp việc bình phương cơ số và chia đôi số mũ, và nhân vào kết quả khi bit thấp là một. Với Fermat, số mũ được hạ bằng cách lấy dư cho số nguyên tố trừ một. Dòng đầu chỉ làm dòng thụt vào khi số mũ lẻ, vì dấu phần trăm là chia lấy số dư và hai dấu bằng là so sánh bằng. Hai dòng sau nhân rồi lấy dư cho mô-đun và cất lại vào tên bên trái, một dòng cho kết quả, một dòng cho cơ số. Hai dấu gạch chéo là chia lấy phần nguyên, nên dòng này chia đôi số mũ và bỏ chữ số nhị phân cuối. Biểu thức cuối là số dư của số mũ khi chia cho p trừ 1, chứ không phải cho p. Lời giải nằm trong thư mục thực hành, và bạn chỉ nên mở sau khi đã thử.
    lab: labs/DMS/L14


