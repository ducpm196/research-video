scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "3 mũ 100 chia 7 dư mấy?"
    checks:
      - "len(str(3 ** 100)) == 48 and pow(3, 100, 7) == 4"
    steps:
      - show: |
          <p>$3^{100}$ có <b>48 chữ số</b>. Chia nó cho 7 dư bao nhiêu?</p>
          <p>Máy tính bỏ túi bó tay; còn mật mã khoá công khai phải tính những lũy thừa có <b>hàng trăm chữ số</b> mỗi giây.</p>
        focus: [1, 1, 2]
        say: "Chào bạn, 3 mũ 100 là một số có 48 chữ số. Chia nó cho 7 thì dư bao nhiêu? Máy tính bỏ túi bó tay, còn mật mã khoá công khai phải tính những lũy thừa có hàng trăm chữ số, nhiều lần mỗi giây."
      - show: |
          <div class="box key">Đáp án là 4, tính nhẩm được — nhờ hai công cụ: <b>định lý Fermat nhỏ</b> và <b>lũy thừa nhanh</b>. Trước đó: phép “chia” theo mô-đun.</div>
        say: "Đáp án là 4, và ta có thể tính nhẩm được nhờ hai công cụ, định lý Fermat nhỏ và lũy thừa nhanh. Nhưng trước hết, ta cần hiểu phép chia theo mô-đun."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: quy tắc lũy thừa, số dư của tích, viết nhị phân"
    checks:
      - "3 ** 4 * 3 ** 2 == 81 * 9 == 729 == 3 ** 6 and (3 ** 2) ** 3 == 9 ** 3 == 729"
      - "(3 * 5) % 7 == 1 and 15 == 2 * 7 + 1 and 18 == 2 * 7 + 4 and (10 * 12) % 7 == ((10 % 7) * (12 % 7)) % 7 == 1"
      - "13 == 8 + 4 + 1 and bin(13) == '0b1101'"
    steps:
      - show: |
          <table class="t"><tr><th>quy tắc</th><th>làm thử</th></tr>
          <tr><td>cộng số mũ khi nhân: $a^{m} \times a^{k} = a^{m + k}$</td><td>$3^4 \times 3^2 = 81 \times 9 = 729 = 3^6$</td></tr>
          <tr><td>nhân số mũ khi lũy thừa tiếp: $(a^{m})^{k} = a^{mk}$ (số mũ nhân với nhau)</td><td>$(3^2)^3 = 9^3 = 729 = 3^6$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn hai quy tắc lũy thừa sẽ dùng để tách số mũ. Nhân hai lũy thừa cùng cơ số thì cộng số mũ, ví dụ 3 mũ 4 nhân 3 mũ 2 bằng 81 nhân 9, bằng 729, đúng bằng 3 mũ 6. Lũy thừa tiếp một lũy thừa thì nhân số mũ, ví dụ 3 bình phương, rồi mũ 3, bằng 9 mũ 3, cũng bằng 729."
      - clear: true
        show: |
          <table class="t"><tr><th>việc</th><th>làm thử</th></tr>
          <tr><td>số dư của tích chỉ cần số dư từng số</td><td>$10 \times 12$: dư 3 và dư 5 khi chia 7, $3 \times 5 = 15$, dư 1</td></tr>
          <tr><td>viết số thành tổng các lũy thừa của 2</td><td>$13 = 8 + 4 + 1$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Thêm hai việc nữa. Như bài 13 đã thấy, số dư của một tích chỉ cần số dư của từng thừa số, ví dụ 10 nhân 12 chia 7, ta chỉ cần 3 nhân 5 bằng 15, nên dư 1. Cuối cùng, mỗi số viết được thành tổng các lũy thừa của 2, ví dụ 13 bằng 8 cộng 4 cộng 1, đó là cách viết nhị phân."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_inv
    kind: symbol
    title: "Giải mã: nghịch đảo theo mô-đun"
    checks:
      - "(3 * 5) % 7 == 1"
      - "[x for x in range(4) if (2 * x) % 4 == 1] == []"
    steps:
      - show: |
          <p><b>Nghịch đảo</b> của $a$ theo mô-đun $n$: số $b$ sao cho $a \times b \equiv 1 \pmod{n}$ — đóng vai “$\frac{1}{a}$”.</p>
          <p>Ví dụ: $3 \times 5 = 15 \equiv 1 \pmod{7}$, nên nghịch đảo của 3 theo mô-đun 7 là 5.</p>
          <p class="note">Không phải số nào cũng có: theo mô-đun 4, $2 \times x$ luôn chẵn nên không bao giờ dư 1.</p>
        focus: [1, 2, 3]
        say: "Nghịch đảo của a theo mô-đun n là số b sao cho a nhân b đồng dư với 1, nó đóng vai một chia a. Ví dụ 3 nhân 5 bằng 15, đồng dư 1 theo mô-đun 7, nên nghịch đảo của 3 là 5. Không phải số nào cũng có nghịch đảo, theo mô-đun 4, 2 nhân x luôn chẵn nên không bao giờ dư 1."

  # ───────────────────────── 3. TÌM NGHỊCH ĐẢO ─────────────────────────
  - id: find_inv
    kind: concept
    title: "Tìm nghịch đảo bằng thuật toán chia lấy dư mở rộng"
    checks:
      - "__import__('math').gcd(3, 7) == 1 and 7 == 2 * 3 + 1 and 1 == 7 - 2 * 3"
      - "(-2) % 7 == 5 and (3 * 5) % 7 == 1"
      - "all((pow(a, -1, n) * a) % n == 1 for n in range(2, 40) for a in range(1, n) if __import__('math').gcd(a, n) == 1)"
    steps:
      - show: |
          <div class="box key">$a$ có nghịch đảo theo mô-đun $n$ <b>khi và chỉ khi</b> $\gcd(a, n) = 1$.</div>
          <p>Bài 13: viết $1 = a x + n y$. Lấy dư cho $n$, phần $n y$ biến mất: $a x \equiv 1$, vậy $x$ là nghịch đảo.</p>
          <p>Với $a = 3, n = 7$: $\; 7 = 2 \times 3 + 1 \implies 1 = 7 - 2 \times 3$, nên $x = -2 \equiv \hl{5} \pmod{7}$ ✓</p>
        focus: [1, 2, 2, 3, 3]
        say: "Định lý, a có nghịch đảo theo mô-đun n khi và chỉ khi ước chung lớn nhất của a và n bằng 1. Ở bài 13, ta đã biết viết 1 thành a nhân x cộng n nhân y bằng cách đi ngược các phép chia. Lấy dư cho n, phần n nhân y biến mất, còn a nhân x đồng dư 1, vậy x chính là nghịch đảo. Với a bằng 3 và n bằng 7, 7 bằng 2 lần 3 cộng 1, nên 1 bằng 7 trừ 2 lần 3. Vậy x bằng âm 2, tức là 5 theo mô-đun 7."
      - show: |
          <p>Dùng nghịch đảo để “chia”: giải $3x \equiv 4 \pmod{7}$ — nhân hai vế với 5:</p>
          $$x \equiv 4 \times 5 = 20 \equiv \hl{6} \pmod{7}$$
          <p>Kiểm: $3 \times 6 = 18 = 2 \times 7 + 4$ ✓</p>
        focus: [1, 2, 3]
        say: "Nghịch đảo cho ta làm phép chia. Muốn giải 3x đồng dư 4 theo mô-đun 7, ta nhân hai vế với 5, nghịch đảo của 3. Được x đồng dư 20, tức là 6, và kiểm lại, 3 nhân 6 bằng 18, chia 7 dư 4."

  # ───────────────────────── 4. FERMAT NHỎ ─────────────────────────
  - id: fermat
    kind: concept
    title: "Định lý Fermat nhỏ"
    checks:
      - "all(pow(a, p - 1, p) == 1 for p in (2, 3, 5, 7, 11, 13, 17, 19, 23) for a in range(1, p))"
      - "3 ** 6 == 729 == 104 * 7 + 1"
    steps:
      - show: |
          <div class="box key">Nếu $p$ là số <b>nguyên tố</b> và $p$ không chia hết $a$ thì $a^{p - 1} \equiv 1 \pmod{p}$.</div>
          <p>Thử: $3^6 = 729 = 104 \times 7 + 1 \equiv 1 \pmod{7}$ ✓ &nbsp; Máy kiểm mọi $a$ với 9 số nguyên tố đầu tiên.</p>
          <p class="note">Ý chứng minh: nhân $a$ với $1, 2, \dots, p - 1$ chỉ <b>xáo trộn</b> các số dư khác 0 (vì $a$ có nghịch đảo), nên tích không đổi.</p>
        focus: [1, 2, 2, 3]
        say: "Định lý Fermat nhỏ, nếu p là số nguyên tố và p không chia hết a, thì a mũ p trừ 1 đồng dư với 1 theo mô-đun p. Thử với 3 mũ 6 bằng 729, bằng 104 lần 7 cộng 1, đúng là dư 1. Máy cũng kiểm mọi a với chín số nguyên tố đầu tiên. Ý chính của chứng minh, nhân a với các số từ 1 đến p trừ 1 chỉ xáo trộn các số dư khác 0, vì a có nghịch đảo, nên tích của chúng không đổi."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Lũy thừa chạy vòng: 6 bước quay về 1"
    checks:
      - "[pow(3, k, 7) for k in range(7)] == [1, 3, 2, 6, 4, 5, 1] and 100 == 16 * 6 + 4 and pow(3, 4, 7) == 4 and 16 * 6 == 96"
    steps:
      - show: |
          <div><svg width="1340" height="480" viewBox="0 0 1340 480"><defs><marker id="ah14" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#6b7280"/></marker></defs><line x1="353" y1="89" x2="428" y2="132" stroke="#6b7280" stroke-width="3" marker-end="url(#ah14)"/><text x="407" y="91" font-size="20" text-anchor="middle" fill="#6b7280">× 3</text><line x1="463" y1="190" x2="463" y2="278" stroke="#6b7280" stroke-width="3" marker-end="url(#ah14)"/><text x="494" y="242" font-size="20" text-anchor="middle" fill="#6b7280">× 3</text><line x1="430" y1="336" x2="355" y2="380" stroke="#6b7280" stroke-width="3" marker-end="url(#ah14)"/><text x="407" y="393" font-size="20" text-anchor="middle" fill="#6b7280">× 3</text><line x1="287" y1="381" x2="212" y2="338" stroke="#6b7280" stroke-width="3" marker-end="url(#ah14)"/><text x="233" y="393" font-size="20" text-anchor="middle" fill="#6b7280">× 3</text><line x1="177" y1="280" x2="177" y2="192" stroke="#6b7280" stroke-width="3" marker-end="url(#ah14)"/><text x="146" y="242" font-size="20" text-anchor="middle" fill="#6b7280">× 3</text><line x1="210" y1="134" x2="285" y2="90" stroke="#6b7280" stroke-width="3" marker-end="url(#ah14)"/><text x="233" y="91" font-size="20" text-anchor="middle" fill="#6b7280">× 3</text><circle cx="320" cy="70" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="320" y="80" font-size="28" text-anchor="middle" font-weight="700" fill="#2563eb">1</text><text x="320" y="25" font-size="20" text-anchor="middle" fill="#2563eb">mũ 0, mũ 6, mũ 12, …</text><circle cx="463" cy="152" r="34" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="463" y="162" font-size="28" text-anchor="middle" font-weight="700" fill="#1f2937">3</text><text x="525" y="134" font-size="20" text-anchor="middle" fill="#1f2937">mũ 1</text><circle cx="463" cy="318" r="34" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="463" y="328" font-size="28" text-anchor="middle" font-weight="700" fill="#1f2937">2</text><text x="525" y="350" font-size="20" text-anchor="middle" fill="#1f2937">mũ 2</text><circle cx="320" cy="400" r="34" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="320" y="410" font-size="28" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><text x="320" y="459" font-size="20" text-anchor="middle" fill="#1f2937">mũ 3</text><circle cx="177" cy="318" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="177" y="328" font-size="28" text-anchor="middle" font-weight="700" fill="#15803d">4</text><text x="115" y="351" font-size="20" text-anchor="middle" fill="#15803d">mũ 4</text><circle cx="177" cy="152" r="34" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="177" y="162" font-size="28" text-anchor="middle" font-weight="700" fill="#1f2937">5</text><text x="115" y="133" font-size="20" text-anchor="middle" fill="#1f2937">mũ 5</text><text x="680" y="140" font-size="25" fill="#1f2937">số dư của 3, 9, 27, … khi chia 7: nhân 3 rồi lấy dư</text><text x="680" y="200" font-size="25" fill="#2563eb">sau 6 bước (= 7 − 1) quay về 1: đó là Fermat nhỏ</text><text x="680" y="260" font-size="25" fill="#1f2937">mũ 100: 100 = 16 × 6 + 4</text><text x="680" y="320" font-size="25" fill="#15803d">16 vòng đủ về chỗ cũ, thêm 4 bước: dư 4</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy Fermat nhỏ hoạt động thế nào. Bắt đầu từ 1, mỗi bước ta nhân 3 rồi lấy dư cho 7, lần lượt được 3, 2, 6, 4, 5, và bước thứ sáu quay về đúng 1. Vì 6 bằng 7 trừ 1, vòng này dài đúng p trừ 1 bước, nên các số mũ 0, 6, 12 đều rơi vào cùng chỗ. Muốn tới mũ 100, ta đi 16 vòng đủ, tức 96 bước, rồi thêm 4 bước nữa, dừng ở ô số 4."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính 3¹⁰⁰ mod 7"
    checks:
      - "100 == 16 * 6 + 4 and pow(3, 6, 7) == 1"
      - "3 ** 4 == 81 and 81 % 7 == 4 == pow(3, 100, 7)"
      - "96 + 4 == 100 and 6 * 16 == 96 and 81 == 11 * 7 + 4"
    steps:
      - show: |
          <p>① Fermat với $p = 7$: $3^6 \equiv 1$. &nbsp; Chia số mũ cho 6: $100 = 16 \times 6 + 4$.</p>
        say: "Bước một, theo Fermat với p bằng 7, 3 mũ 6 đồng dư 1. Ta chia số mũ 100 cho 6, được 16 dư 4."
      - show: |
          <p>② Theo hai quy tắc lũy thừa: $3^{100} = 3^{96} \times 3^4 = (3^6)^{16} \times 3^4$.</p>
        say: "Bước hai, theo quy tắc cộng số mũ, 3 mũ 100 bằng 3 mũ 96 nhân 3 mũ 4. Theo quy tắc nhân số mũ, 3 mũ 96 lại bằng 3 mũ 6, lũy thừa 16."
      - show: |
          <p>③ Thay $3^6 \equiv 1$: &nbsp; $(3^6)^{16} \times 3^4 \equiv 1^{16} \times 3^4 = 81$.</p>
        say: "Bước ba, vì 3 mũ 6 đồng dư 1, và số dư của tích chỉ cần số dư từng thừa số, nên phần đầu đồng dư 1 mũ 16, tức là 1. Vậy chỉ còn 3 mũ 4, bằng 81."
      - show: |
          <p>④ Lấy dư lần cuối:</p>
          $$81 = 11 \times 7 + 4 \implies 3^{100} \bmod 7 = \hl{4}$$
        focus: [1, 2]
        say: "Bước bốn, lấy dư lần cuối. Tám mươi mốt bằng 11 lần 7 cộng 4, nên dư 4, khớp với kết quả máy tính trên số 48 chữ số."

  # ───────────────────────── 6. LŨY THỪA NHANH ─────────────────────────
  - id: fastpow
    kind: concept
    title: "Lũy thừa nhanh: bình phương liên tiếp"
    checks:
      - "[pow(3, 2 ** i, 7) for i in range(4)] == [3, 2, 4, 2]"
      - "13 == 8 + 4 + 1 and (2 * 4 * 3) % 7 == 3 == pow(3, 13, 7)"
      - "(lambda e: 3900 < (e.bit_length() - 1) + (bin(e).count('1') - 1) <= 4096)(2 ** 2048 - 1)"
    steps:
      - show: |
          <p>Không có Fermat (số mũ lớn, mô-đun bất kỳ), vẫn tính nhanh: bình phương liên tiếp rồi lấy dư ngay mỗi bước.</p>
          <table class="t"><tr><th>lũy thừa</th><th>$3^1$</th><th>$3^2$</th><th>$3^4$</th><th>$3^8$</th></tr>
          <tr><td>dư cho 7</td><td>3</td><td>9, dư 2</td><td>$2^2 = 4$</td><td>$4^2 = 16$, dư 2</td></tr></table>
          <p>$13 = 8 + 4 + 1$ (viết nhị phân), nên $3^{13} \equiv 2 \times 4 \times 3 = 24 \equiv \hl{3} \pmod{7}$.</p>
        focus: [1, ["2.1", "2.2"], 3, 3]
        say: "Khi không dùng được Fermat, ta vẫn tính nhanh bằng bình phương liên tiếp và lấy dư ngay ở mỗi bước. Bình phương liên tục, 3 mũ 2 dư 2, 3 mũ 4 dư 4, 3 mũ 8 dư 2. Viết 13 thành 8 cộng 4 cộng 1, rồi nhân các số dư tương ứng 2, 4, 3, được 24. Lấy dư cho 7, kết quả là 3."
      - show: |
          <div class="box ok">Số mũ có $b$ chữ số nhị phân chỉ cần khoảng $2b$ phép nhân: số mũ 2048 chữ số nhị phân cần khoảng 4000 phép nhân, thay vì gần $2^{2048}$ phép.</div>
        say: "Số mũ có b chữ số nhị phân chỉ cần khoảng 2b phép nhân, mỗi chữ số một lần bình phương và nhiều nhất một lần nhân. Vì vậy số mũ dài 2048 chữ số nhị phân chỉ cần khoảng bốn nghìn phép nhân, đó là điều làm mật mã khoá công khai chạy được."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "(3 * 5) % 7 == 1 and (3 * 6) % 7 == 4"
      - "100 == 64 + 32 + 4 and [pow(3, 2 ** i, 7) for i in range(7)] == [3, 2, 4, 2, 4, 2, 4] and 4 * 2 * 4 == 32 == 4 * 7 + 4"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>kết quả</th></tr>
          <tr><td>Nghịch đảo: nhân lại phải dư 1</td><td>$3 \times 5 = 15$, dư 1 ✓</td></tr>
          <tr><td>Nghiệm đồng dư: thay lại vào phương trình</td><td>$3 \times 6 = 18$, dư 4 ✓</td></tr>
          <tr><td>Hạ số mũ bằng Fermat</td><td>chia số mũ cho $p - 1$, <b>không</b> chia cho $p$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, nghịch đảo nhân lại phải dư 1, 3 nhân 5 bằng 15, dư 1. Hai, nghiệm của đồng dư thì thay lại vào phương trình, 3 nhân 6 bằng 18, dư 4. Ba, khi hạ số mũ bằng Fermat, nhớ chia số mũ cho p trừ 1, vì chu kỳ lặp là p trừ 1, không phải p."
      - clear: true
        show: |
          <p><b>Đường khác — tính $3^{100} \bmod 7$ bằng lũy thừa nhanh</b>, không dùng Fermat. Viết $100 = 64 + 32 + 4$:</p>
          <table class="t"><tr><th>lũy thừa</th><th>$3^1$</th><th>$3^2$</th><th>$3^4$</th><th>$3^8$</th><th>$3^{16}$</th><th>$3^{32}$</th><th>$3^{64}$</th></tr>
          <tr><td>dư cho 7</td><td>3</td><td>2</td><td>4</td><td>2</td><td>4</td><td>2</td><td>4</td></tr></table>
          $$3^{100} = 3^{64} \times 3^{32} \times 3^{4} \equiv 4 \times 2 \times 4 = 32 = 4 \times 7 + 4 \equiv \hl{4}$$
        focus: [1, 2, 3, 3]
        say: "Kiểm ví dụ bằng một đường khác hẳn, lũy thừa nhanh, không dùng Fermat. Viết 100 bằng 64 cộng 32 cộng 4, rồi bình phương liên tiếp và lấy dư mỗi bước, được dãy 3, 2, 4, 2, 4, 2, 4. Lấy ba số dư ứng với mũ 64, 32 và 4, là 4, 2 và 4, nhân lại được 32. Ba mươi hai bằng 4 lần 7 cộng 4, nên dư 4, khớp với cách dùng Fermat."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "3 * 11 * 17 == 561 and all(pow(a, 560, 561) == 1 for a in range(2, 561) if __import__('math').gcd(a, 561) == 1)"
      - "pow(3, 100 % 7, 7) == 2 and pow(3, 100, 7) == 4"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tìm nghịch đảo khi $\gcd(a, n) \neq 1$ <b class="red">(sai)</b>
          <br><span class="note">2 không có nghịch đảo theo mô-đun 4. Phải kiểm ước chung trước.</span></div>
        say: "Lỗi thứ nhất, đi tìm nghịch đảo khi ước chung lớn nhất khác 1. Số 2 không có nghịch đảo theo mô-đun 4, nên phải kiểm ước chung trước."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hạ số mũ theo mô-đun $p$ <b class="red">(sai)</b>
          <br><span class="note">$100 \bmod 7 = 2$ cho $3^2 \equiv 2$ — sai. Đúng là lấy số mũ dư cho $p - 1 = 6$: ra 4.</span></div>
          <table class="t"><tr><th>số mũ chia cho</th><th>dư</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>7 (sai)</td><td>2</td><td>$3^2 = 9$</td><td>dư 2 — sai</td></tr>
          <tr><td>6 (đúng)</td><td>4</td><td>$3^4 = 81$</td><td>dư 4 ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi thứ hai, hạ số mũ theo mô-đun p. Lấy 100 chia 7 dư 2 rồi tính 3 bình phương, được 2, sai. Phải lấy số mũ chia cho p trừ 1 bằng 6, ra kết quả đúng là 4."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Thấy $a^{n - 1} \equiv 1$ là kết luận $n$ nguyên tố <b class="red">(sai)</b>
          <br><span class="note">$561 = 3 \times 11 \times 17$ là hợp số, nhưng $a^{560} \equiv 1 \pmod{561}$ với <b>mọi</b> $a$ có ước chung 1 với 561 (máy kiểm). Gọi là số giả nguyên tố Carmichael.</span></div>
        say: "Lỗi thứ ba, thấy a mũ n trừ 1 đồng dư 1 rồi kết luận n là số nguyên tố. Số 561 bằng 3 nhân 11 nhân 17, là hợp số. Nhưng nó qua phép thử Fermat với mọi a có ước chung 1 với nó, máy đã kiểm, nên gọi là số giả nguyên tố."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tính hết lũy thừa rồi mới lấy dư <b class="red">(chậm, tràn số)</b>
          <br><span class="note">Lấy dư <b>sau mỗi phép nhân</b> — số luôn nhỏ hơn $n^2$.</span></div>
        say: "Lỗi thứ tư, tính hết lũy thừa rồi mới lấy dư, vừa chậm vừa tràn số. Hãy lấy dư sau mỗi phép nhân, khi đó các số luôn nhỏ hơn n bình phương."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(4 * 7) % 9 == 1 and __import__('math').gcd(4, 9) == 1"
      - "9 == 2 * 4 + 1 and 1 == 9 - 2 * 4 and (-2) % 9 == 7 and 28 == 3 * 9 + 1"
      - "50 == 8 * 6 + 2 and pow(2, 50, 7) == 4 == 2 ** 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tìm nghịch đảo của 4 theo mô-đun 9.</td></tr>
          <tr><td>2</td><td>Tính $2^{50} \bmod 7$.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tìm nghịch đảo của 4 theo mô-đun 9. Câu hai, tính 2 mũ 50 chia 7 dư bao nhiêu? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① $9 = 2 \times 4 + 1$, nên $\gcd(4, 9) = 1$ và chuyển vế: $1 = 9 - 2 \times 4$.</p>
          <p>Lấy dư cho 9: $4 \times (-2) \equiv 1$, và $-2 \equiv \hl{7} \pmod{9}$. Kiểm: $4 \times 7 = 28 = 3 \times 9 + 1$ ✓</p>
          $$x \equiv -2 \equiv 7 \pmod{9}$$
        focus: [1, 2, 2, 3]
        say: "Đáp án câu một, 9 bằng 2 lần 4 cộng 1, nên ước chung của 4 và 9 bằng 1, và có nghịch đảo. Chuyển vế được 1 bằng 9 trừ 2 lần 4, lấy dư cho 9 thì 4 nhân âm 2 đồng dư 1. Âm 2 cộng 9 bằng 7, và 4 nhân 7 bằng 28, chia 9 dư 1. Vậy nghịch đảo là 7."
      - show: |
          <p>② Fermat: $2^6 \equiv 1 \pmod{7}$; $50 = 8 \times 6 + 2$ $\implies 2^{50} = (2^6)^{8} \times 2^2 \equiv 2^2 = \hl{4}$.</p>
        say: "Câu hai, theo Fermat 2 mũ 6 đồng dư 1, và 50 bằng 8 lần 6 cộng 2. Vậy 2 mũ 50 bằng 2 mũ 6 lũy thừa 8, nhân 2 bình phương, đồng dư 2 bình phương, bằng 4."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nghịch đảo tồn tại khi gcd = 1</span><span class="a">→</span>
          <span class="n">tìm bằng Euclid mở rộng</span><span class="a">→</span>
          <span class="n">Fermat: $a^{p - 1} \equiv 1$</span><span class="a">→</span>
          <span class="n">lũy thừa nhanh: bình phương, lấy dư mỗi bước</span></div>
        say: "Tổng kết lại, nghịch đảo theo mô-đun tồn tại khi ước chung lớn nhất bằng 1, và tìm được bằng thuật toán chia lấy dư mở rộng. Định lý Fermat nhỏ giúp hạ số mũ. Lũy thừa nhanh bình phương liên tiếp và lấy dư ở mỗi bước."
      - show: |
          <div class="box key"><b>Tư duy:</b> một phép toán “dễ làm, khó đảo ngược” — như lũy thừa theo mô-đun — là hạt giống của mật mã.</div>
        say: "Điều cần mang theo, một phép toán dễ làm nhưng khó đảo ngược, như lũy thừa theo mô-đun, là hạt giống của mật mã."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 15): <b>RSA trên số nhỏ</b> — dựng một hệ mã khoá công khai từ chính các công cụ của bài này.</p>
        forward_ref: true
        say: "Ở bài sau, bài 15, ta dựng một hệ mã khoá công khai trên số nhỏ, từ chính các công cụ của bài này. Hẹn gặp bạn ở bài tiếp theo."
