id: L20
course: DMS
series: "DMS · Toán rời rạc"
title: "Bài 20 — Tình huống chuyên gia theo dòng thời gian: hàm băm từ MD5 tới SHA-256"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/dms.yaml L20; audit/dms/sources_L20.md (câu trích nguyên văn, đọc 2026-11-02); audit/verify_plan_curricula.py DMS:L20; S. Turner, L. Chen, RFC 6151, IETF, 3/2011 [RF11]; NIST CSRC, NIST Policy on Hash Functions (15/3/2006, 28/9/2012, 5/8/2015, 15/12/2022) [NP]; NIST CSRC, SHA-3 Project (cuộc thi 2/11/2007 – 2/10/2012) [S3]; M. Stevens, E. Bursztein, P. Karpman, A. Albertini, Y. Markov, The first collision for full SHA-1, CRYPTO 2017, ePrint 2017/190 [ST17]; Google Online Security Blog, Announcing the first SHA1 collision, 23/2/2017 [GB17]; Git, Documentation/technical/hash-function-transition và BreakingChanges (Git 3.0) [GIT]; NIST News, NIST Retires SHA-1 Cryptographic Algorithm, 15/12/2022 [NI22]; DMS bài 6 (chuồng bồ câu), bài 19 (nghịch lý ngày sinh, va chạm băm)"
assumes: [binom]
# Quy ước: “mã băm n bit” = đầu ra của hàm băm; “va chạm” = hai tin khác nhau cùng mã băm; “vét cạn kiểu ngày sinh” = thử băm nhiều
#   tin tới khi hai mã trùng, khoảng 2^(n/2) lần (bài 19). Dấu nhân: × (như bài 19). Chỉ mức khái niệm phòng thủ: KHÔNG trình bày cách
#   dựng va chạm. Mọi sự kiện và con số có nguồn ghi trong audit/dms/sources_L20.md; số khác là phép tính lại (checks) hoặc “(số minh hoạ)”:
#   máy băm 10⁹ lần mỗi giây, 1000 nhân máy, 10 000 tệp là SỐ MINH HOẠ.
#   Lời đọc không nói “Git”, “NIST”, “Keccak”, “PDF”, “TLS”, “CPU”, “GPU” (chưa dò hoặc dò không đạt): nói “hệ quản lý phiên bản mã
#   nguồn phổ biến”, “viện tiêu chuẩn của Mỹ”, “thuật toán thắng cuộc”, “hai tệp văn bản”, “chứng chỉ của trang web”, “bộ xử lý thường”,
#   “bộ xử lý đồ hoạ”. Tên hàm băm: MD5 đọc thô, SHA-1 theo lexicon_vi.DMS.yaml (probe p5, p6); SHA-256, SHA-2, SHA-3
#   dò ≤ 6/8 → lời đọc nói “hàm băm 256 bit”, “họ hàm băm thứ hai”, “hàm chuẩn thứ ba”, tên chỉ trên màn hình.
objectives:
  - "Kể lại hành trình của hàm băm qua năm chặng từ 2004 tới 2030, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại số lần thử của vét cạn kiểu ngày sinh, tỉ lệ nhanh hơn vét cạn và khoảng thời gian chuyển đổi"
  - "Chọn độ dài mã băm hợp với việc của mình, có hay không có kẻ tấn công, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Nếu MD5 không có điểm yếu, muốn tìm va chạm phải vét cạn kiểu ngày sinh, với một máy băm một tỉ lần mỗi giây, một số minh hoạ.", reason: "ASR chép “Nếu em đi nằm không có điểm yếu, muốn tìm va chạm phải vét cạn kiểu ngày sinh với một máy 31 tỷ lần mỗi giây, một số minh họa.” (0.806): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: vét/véc, băm/ba mươi; “MD5” đọc thô (probe p5 8/8), ASR chép “em đi năm/nằm” — đúng âm chữ cái — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì không ai cố ý làm giả, 64 bit hay MD5 đều đủ.", reason: "ASR chép “Vì không ai cố ý làm giả, 64 biết hay em đi 5 đều đủ.” (0.848): lệch âm/thanh thuần Việt: bit/biết; “MD5” đọc thô (probe p5 8/8), ASR chép “em đi” — đúng âm chữ cái — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàm băm biến một tin dài bao nhiêu cũng được thành một mã băm có độ dài cố định n bit.", reason: "ASR chép “Hàm băm biến một tin dài bao nhiêu cũng được thành một mả băm có độ dài cố định Enervics.” (0.878): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: mã/mả, bit (trong “n bit” → “enervics”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, bản cài đặt phát hành ra ngoài kèm chữ ký số đang ký trên mã SHA-1, vậy đổi sang gì và chuyển thế nào?", reason: "ASR chép “Câu 2, bản cài đã phát hành ra ngoài kèm chữ ký số đăng ký trên mạ SHA1, vậy đổi sang gì và chuyển thế nào?” (0.889): lệch âm/thanh thuần Việt: đặt/đã, đang/đăng, mã/mạ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lúc đó chưa ai có một cặp va chạm SHA-1 thật.", reason: "ASR chép “Lúc đó chưa ai có một cặp va chạm FHA một thật.” (0.917): “SHA-1” đọc “ét-hát-a một” theo lexicon_vi.DMS.yaml (probe p6 7/8), ASR chép “fha” — cần người nghe — NOT_VERIFIED bằng tai người"}
  - {sentence: "Điều kiện quan trọng, nếu MD5 chỉ dùng để phát hiện lỗi ngẫu nhiên khi truyền, không có ai cố ý làm giả, thì văn bản ấy vẫn coi là chấp nhận được.", reason: "ASR chép “Điều kiện quan trọng, nếu em đi 5 chỉ dùng để phát hiện lỗi nẫu nhiên khi truyền, không có ai cố ý làm giả, thì văn bản ấy vẫn coi là chấp nhận được.” (0.928): lệch âm/thanh thuần Việt: ngẫu/nẫu; “MD5” đọc thô (probe p5 8/8), ASR chép “em đi” — đúng âm chữ cái — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhóm nghiên cứu năm 2017 trả lời bằng một cặp thật, hai tệp văn bản khác nội dung mà cùng mã SHA-1.", reason: "ASR chép “Nhóm nghiên cứu năm 2017 trả lời bằng một cặp thật, hay tẹp văn bản khác nội dung mà cùng mã SHA1.” (0.929): lệch âm/thanh thuần Việt: hai tệp/hay tẹp — NOT_VERIFIED bằng tai người"}
