#   ≡ đã dùng ở bài 1 cho tương đương lôgic — step notation_note nói rõ: có “(mod n)” đi kèm là đồng dư. Dấu nhân: × (cả bài).
#   Tên “Euclid” không đọc (lexicon CS112: mọi cách viết 0/8) — lời đọc nói “thuật toán chia lấy dư liên tiếp”.
