scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "100 ngày nữa là thứ mấy?"
    checks:
      - "100 % 7 == 2 and (10 + 5) % 12 == 3"
    steps:
      - show: |
          <p>Hôm nay là <b>thứ Hai</b>. 100 ngày nữa là thứ mấy?</p>
          <p>Không cần đếm 100 ngày: tuần lặp lại sau 7 ngày, $100 = 14 \times 7 + 2$, nên chỉ cần tiến thêm 2 ngày: <b>thứ Tư</b>.</p>
          <p class="note">Đồng hồ cũng vậy: 10 giờ thêm 5 tiếng là 3 giờ, vì $15 = 12 + 3$.</p>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hôm nay là thứ Hai, vậy 100 ngày nữa là thứ mấy? Không cần đếm từng ngày, vì tuần lặp lại sau 7 ngày, và 100 bằng 14 tuần cộng 2 ngày. Vậy chỉ cần tiến thêm 2 ngày, là thứ Tư. Đồng hồ cũng vậy, 10 giờ thêm 5 tiếng là 3 giờ."
      - show: |
          <div class="box key">Chỉ giữ lại <b>số dư</b> — đó là số học mô-đun, nền của bảng băm, mã kiểm lỗi và mật mã.</div>
        say: "Chỉ giữ lại số dư, đó là số học mô-đun, nền tảng của bảng băm, mã kiểm lỗi và mật mã."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phép chia có dư và ước chung"
    checks:
      - "17 == 3 * 5 + 2 and 0 <= 2 < 5 and 100 == 14 * 7 + 2 and 14 * 7 == 98"
      - "[d for d in range(1, 13) if 12 % d == 0] == [1, 2, 3, 4, 6, 12] and [d for d in range(1, 19) if 18 % d == 0] == [1, 2, 3, 6, 9, 18] and __import__('math').gcd(12, 18) == 6"
    steps:
      - show: |
          <p>Chia $a$ cho $n$: tìm thương $q$ và số dư $r$ sao cho $a = q \times n + r$, với $r$ từ 0 đến $n - 1$.</p>
          <table class="t"><tr><th>phép chia</th><th>thương</th><th>dư</th></tr>
          <tr><td>$17 = 3 \times 5 + 2$</td><td>3</td><td>2</td></tr>
          <tr><td>$100 = 14 \times 7 + 2$</td><td>14</td><td>2</td></tr></table>
        focus: [0, 1, "2.2", "2.3"]
        say: "Trước khi vào bài, ta ôn phép chia có dư. Chia a cho n là tìm thương q và số dư r, sao cho a bằng q lần n cộng r, với r từ 0 đến n trừ 1. Ví dụ 17 bằng 3 lần 5 cộng 2, nên thương là 3, dư 2. Còn 100 bằng 14 lần 7, tức 98, cộng 2, nên thương là 14, dư 2."
      - clear: true
        show: |
          <table class="t"><tr><th>số</th><th>các ước (số chia hết nó)</th></tr>
          <tr><td>12</td><td>1, 2, 3, 4, 6, 12</td></tr>
          <tr><td>18</td><td>1, 2, 3, 6, 9, 18</td></tr>
          <tr><td>ước chung</td><td>1, 2, 3, $\hl{6}$ — lớn nhất là 6</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Việc thứ hai là ước chung, tức số chia hết cả hai số. Mười hai có các ước 1, 2, 3, 4, 6, 12. Mười tám có các ước 1, 2, 3, 6, 9, 18. Các ước chung là 1, 2, 3, 6, nên ước chung lớn nhất là 6, và lát nữa ta tìm nó mà không cần liệt kê."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_mod
    kind: symbol
    title: "Giải mã: số dư a mod n và đồng dư a ≡ b (mod n)"
    checks:
      - "17 % 5 == 2 and (17 - 2) % 5 == 0"
      - "(-7) % 3 == 2 and -7 == 3 * (-3) + 2"
    steps:
      - show: |
          <p>$a \bmod n$: <b>số dư</b> khi chia $a$ cho $n$, luôn nằm trong $0, 1, \dots, n - 1$. &nbsp; $17 \bmod 5 = 2$ vì $17 = 3 \times 5 + 2$.</p>
          <p>$a \equiv b \pmod{n}$: <b>đồng dư</b> — $a$ và $b$ có cùng số dư khi chia cho $n$, tức là $a - b$ chia hết cho $n$. &nbsp; $17 \equiv 2 \pmod{5}$.</p>
        introduces: [mod]
        focus: [1, 1, 2, 2]
        say: "Ký hiệu đầu tiên là số dư khi chia a cho n, luôn nằm trong khoảng từ 0 đến n trừ 1. Ví dụ 17 chia 5 dư 2, vì 17 bằng 3 lần 5 cộng 2. Còn a đồng dư với b theo mô-đun n nghĩa là a và b có cùng số dư khi chia cho n. Nói cách khác, a trừ b chia hết cho n, ví dụ 17 đồng dư với 2 theo mô-đun 5."
      - show: |
          <div class="box warn">Dấu $\equiv$ ở bài 1 là tương đương lôgic. Ở đây nó luôn đi kèm “$\pmod{n}$” — đọc là “đồng dư”.</div>
        notation_note: true
        say: "Chú ý, dấu ba gạch ở bài 1 là tương đương logic. Trong số học mô-đun, nó luôn đi kèm chữ mô-đun n trong ngoặc, và đọc là đồng dư."
      - show: |
          <p>Số âm: $-7 \bmod 3 = 2$, vì $-7 = (-3) \times 3 + 2$ — số dư phải không âm.</p>
          <p class="note">Đồng dư theo mô-đun $n$ là một quan hệ tương đương (bài 7): các lớp chính là các số dư $0, 1, \dots, n - 1$.</p>
        focus: [1, 2]
        say: "Với số âm, âm 7 chia 3 dư 2, vì âm 7 bằng âm 3 lần 3 cộng 2, và số dư phải không âm. Đồng dư theo mô-đun n là một quan hệ tương đương như bài 7, mỗi lớp ứng với một số dư từ 0 đến n trừ 1."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Số dư là vị trí trên một vòng tròn"
    checks:
      - "100 == 14 * 7 + 2 and 98 % 7 == 0 and (0 + 100) % 7 == 2"
    steps:
      - show: |
          <div><svg width="1340" height="470" viewBox="0 0 1340 470"><defs><marker id="ah13" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#15803d"/></marker></defs><circle cx="330" cy="230" r="160" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="6 6"/><circle cx="330" cy="70" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="330" y="78" font-size="22" text-anchor="middle" fill="#2563eb">0</text><text x="330" y="28" font-size="21" text-anchor="middle" fill="#2563eb">thứ Hai</text><circle cx="455" cy="130" r="24" fill="#ffffff" stroke="#6b7280" stroke-width="3"/><text x="455" y="138" font-size="22" text-anchor="middle" fill="#6b7280">1</text><text x="525" y="107" font-size="21" text-anchor="middle" fill="#6b7280">thứ Ba</text><circle cx="486" cy="266" r="24" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="486" y="274" font-size="22" text-anchor="middle" fill="#15803d">2</text><text x="574" y="285" font-size="21" text-anchor="middle" fill="#15803d">thứ Tư</text><circle cx="399" cy="374" r="24" fill="#ffffff" stroke="#6b7280" stroke-width="3"/><text x="399" y="382" font-size="22" text-anchor="middle" fill="#6b7280">3</text><text x="438" y="427" font-size="21" text-anchor="middle" fill="#6b7280">thứ Năm</text><circle cx="261" cy="374" r="24" fill="#ffffff" stroke="#6b7280" stroke-width="3"/><text x="261" y="382" font-size="22" text-anchor="middle" fill="#6b7280">4</text><text x="222" y="427" font-size="21" text-anchor="middle" fill="#6b7280">thứ Sáu</text><circle cx="174" cy="266" r="24" fill="#ffffff" stroke="#6b7280" stroke-width="3"/><text x="174" y="274" font-size="22" text-anchor="middle" fill="#6b7280">5</text><text x="86" y="285" font-size="21" text-anchor="middle" fill="#6b7280">thứ Bảy</text><circle cx="205" cy="130" r="24" fill="#ffffff" stroke="#6b7280" stroke-width="3"/><text x="205" y="138" font-size="22" text-anchor="middle" fill="#6b7280">6</text><text x="135" y="107" font-size="21" text-anchor="middle" fill="#6b7280">Chủ nhật</text><path d="M330,115 Q390,190 420,158 Q400,240 442,256" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#ah13)"/><text x="660" y="140" font-size="25" fill="#1f2937">100 bước = 14 vòng đủ (98 bước) + 2 bước</text><text x="660" y="200" font-size="25" fill="#6b7280">mỗi vòng 7 bước quay về đúng chỗ cũ</text><text x="660" y="260" font-size="25" fill="#15803d">chỉ 2 bước cuối làm đổi vị trí: thứ Hai → thứ Tư</text><text x="660" y="320" font-size="25" fill="#b45309">vị trí trên vòng = số dư khi chia cho 7</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy vì sao chỉ cần số dư. Bảy ngày trong tuần xếp thành một vòng tròn, đánh số từ 0 là thứ Hai đến 6 là Chủ nhật. Đi 100 bước thì 98 bước đầu là đúng 14 vòng đủ, mỗi vòng quay về chỗ cũ, nên chỉ 2 bước cuối làm đổi vị trí, từ thứ Hai sang thứ Tư. Vì vậy vị trí trên vòng chính là số dư khi chia cho 7, và hai số có cùng số dư thì đứng cùng một chỗ."

  # ───────────────────────── 3. PHÉP TOÁN ─────────────────────────
  - id: arith
    kind: concept
    title: "Cộng và nhân chỉ cần số dư"
    checks:
      - "123 * 456 == 56088 and (123 * 456) % 10 == 8 == (3 * 6) % 10"
      - "all((a + b) % n == ((a % n) + (b % n)) % n and (a * b) % n == ((a % n) * (b % n)) % n for a in range(-30, 31) for b in range(-30, 31) for n in range(1, 12))"
    steps:
      - show: |
          <div class="box key">$(a + b) \bmod n = \big((a \bmod n) + (b \bmod n)\big) \bmod n$, &nbsp; nhân cũng vậy.</div>
          <p>Chữ số cuối của $123 \times 456$: chỉ cần $3 \times 6 = 18$, lấy dư 10 được $\hl{8}$. Kiểm: $123 \times 456 = 56088$ ✓</p>
          <p class="note">Lý do: viết $a = qn + r$; phần $qn$ chia hết cho $n$ nên không ảnh hưởng số dư của tổng hay tích.</p>
        focus: [1, 2, 2, 3]
        say: "Tính chất quan trọng, khi cộng hay nhân theo mô-đun, ta chỉ cần số dư của từng số. Ví dụ chữ số cuối của 123 nhân 456 chỉ phụ thuộc chữ số cuối 3 và 6. Ba nhân sáu bằng 18, lấy dư cho 10 được 8, và kiểm lại, 123 nhân 456 bằng 56088. Lý do, viết a bằng q lần n cộng r, phần q lần n chia hết cho n nên không ảnh hưởng số dư."

  # ───────────────────────── 4. ƯỚC CHUNG LỚN NHẤT ─────────────────────────
  - id: euclid
    kind: concept
    title: "Ước chung lớn nhất: thuật toán Euclid"
    checks:
      - "__import__('math').gcd(252, 198) == 18"
      - "252 == 1 * 198 + 54 and 198 == 3 * 54 + 36 and 54 == 1 * 36 + 18 and 36 == 2 * 18 + 0"
      - "all(__import__('math').gcd(a, b) == __import__('math').gcd(b, a % b) for a in range(1, 80) for b in range(1, 80))"
    steps:
      - show: |
          <p>$\gcd(a, b)$: ước chung lớn nhất. &nbsp; Ý chính: $\gcd(a, b) = \gcd(b,\ a \bmod b)$ — số chia hết cả $a$ và $b$ thì chia hết cả $a - qb$.</p>
          <table class="t"><tr><th>chia</th><th>dư</th></tr>
          <tr><td>$252 = 1 \times 198 + 54$</td><td>54</td></tr>
          <tr><td>$198 = 3 \times 54 + 36$</td><td>36</td></tr>
          <tr><td>$54 = 1 \times 36 + 18$</td><td>18</td></tr>
          <tr><td>$36 = 2 \times 18 + 0$</td><td>0 → dừng</td></tr></table>
          <p>Số dư khác 0 cuối cùng: $\gcd(252, 198) = \hl{18}$.</p>
        introduces: [gcd]
        focus: [1, 1, 1, "2.2", ["2.3", "2.4"], "2.5", 3]
        say: "Viết g c d của a và b là ước chung lớn nhất. Ý chính của thuật toán, ước chung của a và b cũng là ước chung của b và số dư khi chia a cho b. Lý do, số chia hết cả a lẫn b thì chia hết cả a trừ q lần b. Bắt đầu, 252 chia 198 dư 54. Tiếp theo 198 chia 54 dư 36, rồi 54 chia 36 dư 18. Cuối cùng 36 chia 18 dư 0, ta dừng. Số dư khác 0 cuối cùng là 18, đó là ước chung lớn nhất."

  # ───────────────────────── 5. VÍ DỤ: EUCLID MỞ RỘNG ─────────────────────────
  - id: example
    kind: example
    title: "Euclid mở rộng: viết 18 = 252x + 198y"
    checks:
      - "18 == 54 - 1 * 36"
      - "54 - (198 - 3 * 54) == 4 * 54 - 198 == 18"
      - "4 * (252 - 198) - 198 == 4 * 252 - 5 * 198 == 18"
    steps:
      - show: |
          <p>Đi ngược các dòng chia, mỗi lần thay số dư bằng “số bị chia trừ thương lần số chia”:</p>
          <p>① Từ $54 = 1 \times 36 + 18$, chuyển vế: $18 = 54 - 1 \times 36$</p>
        focus: [1, 2]
        say: "Thuật toán mở rộng đi ngược các dòng chia, mỗi lần thay một số dư bằng số bị chia trừ thương lần số chia. Bước một, từ dòng thứ ba, 54 bằng 36 cộng 18, chuyển vế được 18 bằng 54 trừ 36."
      - show: |
          <p>② Từ $198 = 3 \times 54 + 36$ có $36 = 198 - 3 \times 54$; thay vào: &nbsp; $18 = 54 - (198 - 3 \times 54) = 4 \times 54 - 198$</p>
        say: "Bước hai, từ dòng thứ hai, 36 bằng 198 trừ 3 lần 54, ta thay vào chỗ 36. Vì có 1 lần 54 cộng thêm 3 lần 54, gom lại được 4 lần 54 trừ 198."
      - show: |
          <p>③ Từ $252 = 1 \times 198 + 54$ có $54 = 252 - 198$; thay vào rồi gom:</p>
          $$18 = 4 \times (252 - 198) - 198 = \hl{4 \times 252 - 5 \times 198}$$
        focus: [1, 2]
        say: "Bước ba, từ dòng đầu, 54 bằng 252 trừ 198, ta thay vào chỗ 54. Phá ngoặc được 4 lần 252 trừ 4 lần 198, trừ thêm 1 lần 198 nữa, nên 18 bằng 4 lần 252 trừ 5 lần 198."
      - show: |
          <div class="box ok">Kiểm: $4 \times 252 - 5 \times 198 = 1008 - 990 = 18$ ✓ &nbsp; Cặp $(4, -5)$ gọi là <b>hệ số Bézout</b>.</div>
          <p class="note">Cách tìm hệ số này là chìa khoá để tìm “số nghịch đảo” theo mô-đun trong mật mã.</p>
        focus: [1, 1, 2]
        say: "Kiểm lại, 4 lần 252 là 1008, 5 lần 198 là 990, hiệu đúng bằng 18. Cặp số 4 và âm 5 gọi là cặp hệ số biểu diễn ước chung, tên nhà toán học đặt cho nó ghi trên màn hình. Cách tìm hệ số này sẽ dùng để tìm số nghịch đảo theo mô-đun, chìa khoá của mật mã."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: ba phép thử"
    checks:
      - "252 % 18 == 0 and 198 % 18 == 0 and __import__('math').gcd(252 // 18, 198 // 18) == 1"
      - "252 == 2 * 2 * 3 * 3 * 7 and 198 == 2 * 3 * 3 * 11 and 2 * 3 * 3 == 18 and 252 // 18 == 14 and 198 // 18 == 11 and 4 * 252 - 5 * 198 == 1008 - 990 == 18"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>kết quả</th></tr>
          <tr><td>Ước chung tìm được phải chia hết <b>cả hai</b> số</td><td>$252 = 14 \times 18$, $198 = 11 \times 18$ ✓</td></tr>
          <tr><td>Chia hai số cho nó, thương phải <b>không còn ước chung</b></td><td>14 và 11 ✓</td></tr>
          <tr><td>Hệ số Bézout: nhân thử lại, phải ra đúng ước chung</td><td>$1008 - 990 = 18$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba phép thử. Một, ước chung tìm được phải chia hết cả hai số, 252 bằng 14 lần 18, 198 bằng 11 lần 18. Hai, chia hai số cho nó thì hai thương không còn ước chung nào lớn hơn 1, vì nếu còn thì ước chung tìm được chưa lớn nhất. Ba, với cặp hệ số biểu diễn ước chung, nhân thử lại phải ra đúng ước chung."
      - clear: true
        show: |
          <p><b>Đường khác — tách thừa số nguyên tố</b>, không dùng phép chia liên tiếp:</p>
          <table class="t"><tr><th>số</th><th>tách thành tích số nguyên tố</th></tr>
          <tr><td>252</td><td>2 × 2 × 3 × 3 × 7</td></tr>
          <tr><td>198</td><td>2 × 3 × 3 × 11</td></tr>
          <tr><td>phần chung</td><td>2 × 3 × 3 = $\hl{18}$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng một đường khác hẳn, tách mỗi số thành tích các số nguyên tố. Hai trăm năm mươi hai bằng 2 nhân 2 nhân 3 nhân 3 nhân 7. Một trăm chín mươi tám bằng 2 nhân 3 nhân 3 nhân 11. Phần chung của hai tích là một số 2 và hai số 3, nhân lại được 18, nên ước chung lớn nhất là 18, khớp với kết quả của thuật toán."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "(-7) % 3 == 2 and int(__import__('math').fmod(-7, 3)) == -1"
      - "(6 - 2) % 4 == 0 and (3 - 1) % 4 != 0"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin rằng mọi ngôn ngữ cho $-7 \bmod 3 = 2$ <b class="red">(sai)</b>
          <br><span class="note">Trong toán: 2. Toán tử <code>%</code> của C, Java cho <code>-7 % 3 == -1</code>; của Python cho 2. Phải biết quy ước của ngôn ngữ mình dùng.</span></div>
        say: "Lỗi thứ nhất, tin rằng mọi ngôn ngữ lập trình đều cho âm 7 chia 3 dư 2. Trong toán là 2, nhưng toán tử phần trăm của một số ngôn ngữ lập trình lại trả về âm 1. Phải biết quy ước của ngôn ngữ mình dùng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chia hai vế của đồng dư như phương trình <b class="red">(sai)</b>
          <br><span class="note">$6 \equiv 2 \pmod{4}$ nhưng chia 2 hai vế: $3 \equiv 1 \pmod{4}$ là sai: $3 - 1 = 2$ không chia hết cho 4.</span></div>
          <table class="t"><tr><th>khẳng định</th><th>hiệu</th><th>chia hết cho 4?</th></tr>
          <tr><td>$6 \equiv 2 \pmod{4}$</td><td>6 − 2 = 4</td><td>có ✓</td></tr>
          <tr><td>$3 \equiv 1 \pmod{4}$</td><td>3 − 1 = 2</td><td>không</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, chia hai vế của đồng dư như phương trình thường. 6 đồng dư 2 theo mô-đun 4, nhưng chia hai vế cho 2 thì 3 đồng dư 1 theo mô-đun 4 lại sai, vì 3 trừ 1 bằng 2 không chia hết cho 4."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lấy số dư 0 làm ước chung lớn nhất <b class="red">(sai)</b>
          <br><span class="note">Kết quả là số dư <b>khác 0 cuối cùng</b> (ở ví dụ là 18), không phải số 0 làm thuật toán dừng.</span></div>
        say: "Lỗi thứ ba, lấy số dư 0 làm kết quả. Ước chung lớn nhất là số dư khác 0 cuối cùng, ở ví dụ là 18, còn số 0 chỉ báo hiệu thuật toán dừng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Viết $17 = 2 \pmod{5}$ thay cho $17 \equiv 2 \pmod{5}$ <b class="red">(sai)</b>
          <br><span class="note">17 không bằng 2. Đúng là: 17 <b>đồng dư</b> 2, hoặc $17 \bmod 5 = 2$ (số dư bằng 2).</span></div>
        say: "Lỗi thứ tư, viết dấu bằng giữa 17 và 2. Mười bảy không bằng 2, cách viết đúng là 17 đồng dư 2 theo mô-đun 5, hoặc số dư của 17 chia 5 bằng 2."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "50 % 7 == 1 and 50 == 7 * 7 + 1 and 84 - 2 * 36 == 84 - 72 == 12"
      - "__import__('math').gcd(84, 36) == 12 and 84 == 2 * 36 + 12 and 36 == 3 * 12 and 84 - 2 * 36 == 12"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hôm nay thứ Ba. 50 ngày nữa là thứ mấy?</td></tr>
          <tr><td>2</td><td>Tìm $\gcd(84, 36)$ và viết nó dưới dạng $84x + 36y$.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hôm nay thứ Ba, 50 ngày nữa là thứ mấy? Câu hai, tìm ước chung lớn nhất của 84 và 36, rồi viết nó dưới dạng 84x cộng 36y. Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① $50 = 7 \times 7 + 1$: 7 tuần đủ quay về thứ Ba, còn tiến 1 ngày: <b>thứ Tư</b>.</p>
        say: "Đáp án câu một, 50 bằng 7 lần 7 cộng 1, tức 7 tuần đủ cộng 1 ngày. Bảy tuần đủ đưa ta về đúng thứ Ba, nên chỉ còn tiến 1 ngày, là thứ Tư."
      - show: |
          <table class="t"><tr><th>chia</th><th>dư</th></tr>
          <tr><td>$84 = 2 \times 36 + 12$</td><td>12</td></tr>
          <tr><td>$36 = 3 \times 12 + 0$</td><td>0 → dừng</td></tr></table>
          <p>② $\gcd(84, 36) = \hl{12}$; từ dòng đầu chuyển vế: $12 = 84 - 2 \times 36$, tức $x = 1$, $y = -2$. Kiểm: $84 - 72 = 12$ ✓</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Câu hai, 84 chia 36 được 2, dư 12. Rồi 36 chia 12 dư 0, nên ta dừng, và ước chung lớn nhất là số dư khác 0 cuối cùng, bằng 12. Từ dòng chia đầu, chuyển vế được 12 bằng 84 trừ 2 lần 36, tức x bằng 1 và y bằng âm 2. Kiểm lại, 84 trừ 72 đúng bằng 12."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$a \bmod n$: số dư 0..n − 1</span><span class="a">→</span>
          <span class="n">đồng dư: $n$ chia hết $a - b$</span><span class="a">→</span>
          <span class="n">cộng, nhân chỉ cần số dư</span><span class="a">→</span>
          <span class="n">Euclid: gcd và hệ số Bézout</span></div>
        say: "Tổng kết lại, số dư khi chia cho n nằm trong khoảng từ 0 đến n trừ 1. Hai số đồng dư khi hiệu của chúng chia hết cho n. Cộng và nhân theo mô-đun chỉ cần số dư. Thuật toán chia lấy dư liên tiếp cho ước chung lớn nhất, và đi ngược lại cho cặp hệ số biểu diễn ước chung đó."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi số quá lớn, hãy hỏi “mình có thật sự cần cả con số, hay chỉ cần số dư?” — câu hỏi này là nền của băm và mật mã.</div>
        say: "Điều cần mang theo, khi gặp số quá lớn, hãy hỏi mình có thật sự cần cả con số, hay chỉ cần số dư, đó là nền của băm và mật mã."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>nghịch đảo mô-đun, định lý Fermat nhỏ, lũy thừa nhanh</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, ta học nghịch đảo mô-đun, định lý Fermat nhỏ, và cách tính lũy thừa thật nhanh. Hẹn gặp bạn ở bài tiếp theo."
