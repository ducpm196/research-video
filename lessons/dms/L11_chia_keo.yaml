id: L11
course: DMS
series: "DMS · Toán rời rạc"
title: "Bài 11 — Tổ hợp có lặp: bài toán chia kẹo"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dms.yaml L11; audit/verify_plan_curricula.py DMS:L11; phương pháp “sao và vạch” theo K. Rosen, Discrete Mathematics and Its Applications, mục 6.5"
assumes: [set, dots, binom, factorial, in, implies, naturals]
# Quy ước: tổ hợp viết $\binom{n}{k}$ như bài 10. Biến x₁, x₂, … dùng chỉ số dưới (giới thiệu lại ở step sym_eq).
#   Dấu nhân giữa hai số: × (cả bài).
objectives:
  - "Đếm số cách chia vật giống nhau vào các hộp khác nhau"
  - "Đếm nghiệm nguyên không âm của x₁ + … + x_k = n"
  - "Đổi biến khi mỗi hộp phải có ít nhất một vật"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chia 10 viên kẹo cho 3 bạn"
    checks:
      - "sum(1 for a in range(11) for b in range(11 - a)) == 66"
      - "3 ** 10 == 59049"
    steps:
      - show: |
          <p>Chia 10 viên kẹo <b>giống hệt nhau</b> cho 3 bạn An, Bình, Chi. Có bạn được 0 viên cũng được. Có bao nhiêu cách?</p>
          <p class="note">Không phải $3^{10}$: con số đó coi 10 viên kẹo là <b>khác nhau</b> (viên nào cho ai). Ở đây chỉ quan tâm <b>mỗi bạn được bao nhiêu</b>.</p>
        focus: [1, 1, 2, 2]
        say: "Chào bạn, chia 10 viên kẹo giống hệt nhau cho 3 bạn An, Bình, Chi, và có bạn được 0 viên cũng được. Có bao nhiêu cách? Đáp án không phải 3 mũ 10, vì con số đó coi 10 viên kẹo là khác nhau. Ở đây ta chỉ quan tâm mỗi bạn được bao nhiêu viên."
      - show: |
          <div class="box key">Đáp án là 66 — và có một mẹo nhìn rất đẹp để ra con số đó: <b>sao và vạch</b>.</div>
        say: "Đáp án là 66, và hôm nay ta học một mẹo nhìn rất đẹp để ra con số đó, gọi là sao và vạch."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tổ hợp và ghép đôi một một"
    checks:
      - "__import__('math').comb(4, 2) == 4 * 3 // 2 == 6 and __import__('math').comb(12, 2) == 12 * 11 // 2 == 66"
      - "__import__('math').comb(7, 3) == 7 * 6 * 5 // 6 == 35 and 7 * 6 * 5 == 210 and 3 * 2 * 1 == 6"
    steps:
      - show: |
          <table class="t"><tr><th>chọn</th><th>cách tính</th><th>kết quả</th></tr>
          <tr><td>2 chỗ trong 4 chỗ</td><td>$\binom{4}{2} = \frac{4 \times 3}{2}$</td><td>6</td></tr>
          <tr><td>2 chỗ trong 12 chỗ</td><td>$\binom{12}{2} = \frac{12 \times 11}{2}$</td><td>66</td></tr>
          <tr><td>3 chỗ trong 7 chỗ</td><td>$\binom{7}{3} = \frac{7 \times 6 \times 5}{3 \times 2 \times 1} = \frac{210}{6}$</td><td>35</td></tr></table>
        focus: [0, 0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn lại tổ hợp ở bài 10. Tổ hợp chập k của n là số cách chọn k chỗ trong n chỗ, không kể thứ tự. Chọn 2 chỗ trong 4 chỗ, ta lấy 4 nhân 3 chia 2, được 6. Chọn 2 chỗ trong 12 chỗ, lấy 12 nhân 11 chia 2, được 66. Chọn 3 chỗ trong 7 chỗ, lấy 7 nhân 6 nhân 5, bằng 210, chia cho 3 nhân 2 nhân 1, bằng 6, được 35."
      - clear: true
        show: |
          <p><b>Ghép đôi một một</b> (song ánh, bài 6): mỗi phần tử bên trái ghép với đúng một bên phải, không thừa, không thiếu, nên hai bên có <b>cùng số phần tử</b>.</p>
          <table class="t"><tr><th>bên trái</th><th>bên phải</th><th>đếm bên nào dễ hơn</th></tr>
          <tr><td>30 học sinh, mỗi em đúng một ghế</td><td>30 ghế, không ghế trống</td><td>đếm ghế: 30</td></tr></table>
        focus: [1, 1, 2]
        say: "Việc thứ hai là ghép đôi một một, ở bài 6 ta gọi là song ánh, nghĩa là mỗi phần tử bên trái ghép với đúng một phần tử bên phải, không thừa, không thiếu. Khi đó hai bên có cùng số phần tử, nên muốn đếm bên khó, ta đếm bên dễ. Ví dụ lớp có 30 học sinh, mỗi em ngồi đúng một ghế và không ghế nào trống, thì đếm ghế cũng ra 30 học sinh."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_eq
    kind: symbol
    title: "Giải mã: phương trình x₁ + x₂ + x₃ = 10"
    checks:
      - "3 + 5 + 2 == 10"
    steps:
      - show: |
          <p>Gọi $x_1, x_2, x_3$ là số kẹo của An, Bình, Chi (chỉ số dưới 1, 2, 3 chỉ để phân biệt ba bạn).</p>
          <p>Mỗi cách chia là một nghiệm của $x_1 + x_2 + x_3 = 10$ với $x_1, x_2, x_3 \in \mathbb{N}$ (số tự nhiên, kể cả 0).</p>
          <p class="note">Ví dụ An 3, Bình 5, Chi 2 là nghiệm $(3, 5, 2)$.</p>
        introduces: [sub]
        focus: [1, 2, 3]
        say: "Gọi x một, x hai, x ba là số kẹo của An, Bình, Chi, các chỉ số dưới 1, 2, 3 chỉ để phân biệt ba bạn. Mỗi cách chia là một nghiệm của phương trình x một cộng x hai cộng x ba bằng 10, với các số tự nhiên kể cả 0. Ví dụ An 3, Bình 5, Chi 2 là nghiệm 3, 5, 2."

  # ───────────────────────── 3. SAO VÀ VẠCH ─────────────────────────
  - id: stars
    kind: concept
    title: "Sao và vạch"
    checks:
      - "__import__('math').comb(12, 2) == 66"
      - "len('★★★|★★★★★|★★') == 12"
    steps:
      - show: |
          <p>Viết 10 viên kẹo thành 10 ngôi sao, dùng <b>2 vạch</b> để chia thành 3 phần (trái, giữa, phải):</p>
          <div class="box key" style="font-size:1.25em">★★★ | ★★★★★ | ★★ &nbsp;&nbsp;→&nbsp;&nbsp; $(3, 5, 2)$<br>★★★★★★★★★★ | | &nbsp;&nbsp;→&nbsp;&nbsp; $(10, 0, 0)$</div>
          <p>Mỗi cách chia ứng với <b>đúng một</b> dãy 12 ký hiệu (10 sao, 2 vạch), và ngược lại — một song ánh (bài 6).</p>
        focus: [1, 2, 2, 3]
        say: "Viết 10 viên kẹo thành 10 ngôi sao, rồi dùng 2 vạch để chia hàng sao thành 3 phần. Ba sao, vạch, năm sao, vạch, hai sao ứng với cách chia 3, 5, 2. Mười sao rồi hai vạch liền nhau ứng với cách chia 10, 0, 0. Mỗi cách chia ứng với đúng một dãy 12 ký hiệu, và ngược lại, đó là một song ánh như bài 6."
      - show: |
          <p>Đếm dãy: trong 12 chỗ, chọn 2 chỗ đặt vạch (các chỗ còn lại là sao):</p>
          $$\binom{12}{2} = \frac{12 \times 11}{2} = \hl{66}$$
          <div class="box ok">Tổng quát: số nghiệm tự nhiên của $x_1 + \dots + x_k = n$ là $\binom{n + k - 1}{k - 1}$ — có $n$ sao và $k - 1$ vạch.</div>
        focus: [[1, 2], 3, 3]
        say: "Vậy chỉ cần đếm các dãy, trong 12 chỗ chọn 2 chỗ đặt vạch, còn lại là sao, được 12 nhân 11 chia 2, bằng 66. Tổng quát, phương trình k ẩn có tổng bằng n có tổ hợp chập k trừ 1 của n cộng k trừ 1 nghiệm. Lý do là có n sao và k trừ 1 vạch để chia thành k phần."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "12 ô: chọn 2 ô làm vạch"
    checks:
      - "3 + 1 + 5 + 1 + 2 == 12 and 10 + 2 == 12"
    steps:
      - show: |
          <div><svg width="1300" height="370" viewBox="0 0 1300 370"><rect x="150" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="182" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="182" y="154" font-size="18" text-anchor="middle" fill="#6b7280">1</text><rect x="220" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="252" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="252" y="154" font-size="18" text-anchor="middle" fill="#6b7280">2</text><rect x="290" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="322" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="322" y="154" font-size="18" text-anchor="middle" fill="#6b7280">3</text><rect x="360" y="70" width="64" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><line x1="392" y1="80" x2="392" y2="120" stroke="#dc2626" stroke-width="6"/><text x="392" y="154" font-size="18" text-anchor="middle" fill="#6b7280">4</text><rect x="430" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="462" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="462" y="154" font-size="18" text-anchor="middle" fill="#6b7280">5</text><rect x="500" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="532" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="532" y="154" font-size="18" text-anchor="middle" fill="#6b7280">6</text><rect x="570" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="602" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="602" y="154" font-size="18" text-anchor="middle" fill="#6b7280">7</text><rect x="640" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="672" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="672" y="154" font-size="18" text-anchor="middle" fill="#6b7280">8</text><rect x="710" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="742" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="742" y="154" font-size="18" text-anchor="middle" fill="#6b7280">9</text><rect x="780" y="70" width="64" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><line x1="812" y1="80" x2="812" y2="120" stroke="#dc2626" stroke-width="6"/><text x="812" y="154" font-size="18" text-anchor="middle" fill="#6b7280">10</text><rect x="850" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="882" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="882" y="154" font-size="18" text-anchor="middle" fill="#6b7280">11</text><rect x="920" y="70" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="952" y="112" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="952" y="154" font-size="18" text-anchor="middle" fill="#6b7280">12</text><path d="M150,62 L150,54 L354,54 L354,62" fill="none" stroke="#2563eb" stroke-width="2"/><text x="252" y="46" font-size="22" text-anchor="middle" fill="#2563eb">An: 3</text><path d="M430,62 L430,54 L774,54 L774,62" fill="none" stroke="#2563eb" stroke-width="2"/><text x="602" y="46" font-size="22" text-anchor="middle" fill="#2563eb">Bình: 5</text><path d="M850,62 L850,54 L984,54 L984,62" fill="none" stroke="#2563eb" stroke-width="2"/><text x="917" y="46" font-size="22" text-anchor="middle" fill="#2563eb">Chi: 2</text><text x="1010" y="110" font-size="26" fill="#15803d">An 3, Bình 5, Chi 2</text><rect x="150" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="182" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="182" y="334" font-size="18" text-anchor="middle" fill="#6b7280">1</text><rect x="220" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="252" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="252" y="334" font-size="18" text-anchor="middle" fill="#6b7280">2</text><rect x="290" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="322" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="322" y="334" font-size="18" text-anchor="middle" fill="#6b7280">3</text><rect x="360" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="392" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="392" y="334" font-size="18" text-anchor="middle" fill="#6b7280">4</text><rect x="430" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="462" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="462" y="334" font-size="18" text-anchor="middle" fill="#6b7280">5</text><rect x="500" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="532" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="532" y="334" font-size="18" text-anchor="middle" fill="#6b7280">6</text><rect x="570" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="602" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="602" y="334" font-size="18" text-anchor="middle" fill="#6b7280">7</text><rect x="640" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="672" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="672" y="334" font-size="18" text-anchor="middle" fill="#6b7280">8</text><rect x="710" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="742" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="742" y="334" font-size="18" text-anchor="middle" fill="#6b7280">9</text><rect x="780" y="250" width="64" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="812" y="292" font-size="30" text-anchor="middle" fill="#b45309">★</text><text x="812" y="334" font-size="18" text-anchor="middle" fill="#6b7280">10</text><rect x="850" y="250" width="64" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><line x1="882" y1="260" x2="882" y2="300" stroke="#dc2626" stroke-width="6"/><text x="882" y="334" font-size="18" text-anchor="middle" fill="#6b7280">11</text><rect x="920" y="250" width="64" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><line x1="952" y1="260" x2="952" y2="300" stroke="#dc2626" stroke-width="6"/><text x="952" y="334" font-size="18" text-anchor="middle" fill="#6b7280">12</text><path d="M150,242 L150,234 L844,234 L844,242" fill="none" stroke="#2563eb" stroke-width="2"/><text x="497" y="226" font-size="22" text-anchor="middle" fill="#2563eb">An: 10</text><text x="1010" y="290" font-size="26" fill="#15803d">An 10, Bình 0, Chi 0</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy vì sao chỉ cần chọn chỗ cho vạch. Có 12 ô xếp thành hàng, ta chọn 2 ô để đặt vạch đỏ, các ô còn lại tự động là sao. Ở hàng trên, vạch nằm ở ô 4 và ô 10, nên số sao trước vạch đầu là 3 cho An, giữa hai vạch là 5 cho Bình, sau vạch thứ hai là 2 cho Chi. Ở hàng dưới, hai vạch nằm ở hai ô cuối, nên An được cả 10 viên, Bình và Chi được 0."

  # ───────────────────────── 4. ÍT NHẤT MỘT ─────────────────────────
  - id: atleast
    kind: concept
    title: "Mỗi bạn ít nhất một viên: đổi biến"
    checks:
      - "sum(1 for a in range(1, 11) for b in range(1, 11 - a) if 10 - a - b >= 1) == 36 == __import__('math').comb(9, 2)"
    steps:
      - show: |
          <p>Nếu mỗi bạn phải được <b>ít nhất 1</b> viên: chia trước mỗi bạn 1 viên, còn $10 - 3 = 7$ viên chia tự do.</p>
          <p>Bằng ẩn: đặt $y_i = x_i - 1 \ge 0$ $\implies y_1 + y_2 + y_3 = 7$ $\implies \binom{7 + 2}{2} = \binom{9}{2} = \hl{36}$.</p>
        focus: [1, 2, 2]
        say: "Nếu mỗi bạn phải được ít nhất một viên, ta chia trước cho mỗi bạn một viên, còn 7 viên để chia tự do. Viết bằng ẩn, đặt y bằng x trừ 1, khi đó các y không âm và có tổng bằng 7. Theo công thức sao và vạch, có tổ hợp chập 2 của 9, bằng 36 cách."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chọn có lặp: 3 viên kem từ 5 vị"
    checks:
      - "len(list(__import__('itertools').combinations_with_replacement(range(5), 3))) == 35 == __import__('math').comb(7, 3)"
      - "__import__('math').comb(7, 3) == __import__('math').comb(7, 4)"
      - "7 * 6 * 5 * 4 == 840 and 4 * 3 * 2 * 1 == 24 and 840 // 24 == 35 and 3 + 4 == 7 and 5 - 1 == 4"
    steps:
      - show: |
          <p>Quầy có 5 vị kem. Mua 3 viên, <b>được trùng vị</b>, không quan tâm thứ tự. Có bao nhiêu cách?</p>
          <p><b>Bước 1 — đặt ẩn.</b> Gọi $x_1, \dots, x_5$ là số viên mỗi vị: $x_1 + \dots + x_5 = 3$.</p>
        focus: [1, 2]
        say: "Ví dụ, quầy có 5 vị kem, ta mua 3 viên, được trùng vị và không quan tâm thứ tự. Bước một, gọi x một đến x năm là số viên của mỗi vị, thì tổng của chúng bằng 3, vì cả thảy mua 3 viên."
      - show: |
          <p><b>Bước 2 — đổi sang sao và vạch.</b> 3 viên là 3 sao; 5 vị cần $5 - 1 = 4$ vạch; tổng $3 + 4 = 7$ ô.</p>
        say: "Bước hai, đổi sang sao và vạch. Ba viên kem là 3 sao, còn 5 vị cần 5 trừ 1, bằng 4 vạch, nên hàng có 3 cộng 4, bằng 7 ô."
      - show: |
          <p><b>Bước 3 — chọn ô cho vạch:</b></p>
          $$\binom{7}{4} = \frac{7 \times 6 \times 5 \times 4}{4 \times 3 \times 2 \times 1} = \frac{840}{24} = \hl{35}$$
        focus: [1, 2]
        say: "Bước ba, chọn 4 ô trong 7 ô để đặt vạch. Ta lấy 7 nhân 6 nhân 5 nhân 4, bằng 840, chia cho 4 nhân 3 nhân 2 nhân 1, bằng 24, được 35."
      - show: |
          <p><b>Bước 4 — hoặc chọn ô cho sao:</b> cùng kết quả, vì chọn 3 ô cho sao là để lại 4 ô cho vạch.</p>
          $$\binom{7}{3} = \frac{210}{6} = 35 \qquad \binom{3 + 5 - 1}{5 - 1} = \hl{35}$$
        focus: [2, 1]
        say: "Bước bốn, ta cũng có thể chọn 3 ô cho sao, được tổ hợp chập 3 của 7, bằng 210 chia 6, bằng 35. Hai cách cho cùng kết quả, vì chọn 3 ô cho sao thì 4 ô còn lại chính là chỗ đặt vạch."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: trường hợp nhỏ đếm bằng tay"
    checks:
      - "sum(1 for a in range(3) for b in range(3 - a)) == 6 == __import__('math').comb(4, 2)"
      - "5 + 5 * 4 + __import__('math').comb(5, 3) == 35 and 5 * 4 == 20 and __import__('math').comb(5, 3) == 10"
      - "sum(11 - a for a in range(11)) == 11 * 12 // 2 == 66"
    steps:
      - show: |
          <p>Chia 2 viên cho 3 bạn: liệt kê $(2,0,0), (0,2,0), (0,0,2), (1,1,0), (1,0,1), (0,1,1)$ — 6 cách.</p>
          <p>Công thức: $\binom{2 + 2}{2} = \binom{4}{2} = 6$ ✓ &nbsp; Số vạch luôn bằng <b>số hộp trừ 1</b>.</p>
        focus: [1, 1, 2, 2]
        say: "Tự kiểm bằng một trường hợp đủ nhỏ để đếm tay. Chia 2 viên cho 3 bạn, liệt kê được 6 cách như trên màn hình. Công thức cho tổ hợp chập 2 của 4, cũng bằng 6, vì có 2 sao và 2 vạch. Nhớ rằng số vạch luôn bằng số hộp trừ 1."
      - clear: true
        show: |
          <p><b>Đường khác 1 — chia theo kiểu cốc kem</b>, không dùng sao và vạch:</p>
          <table class="t"><tr><th>kiểu</th><th>cách đếm</th><th>số cách</th></tr>
          <tr><td>3 viên cùng vị</td><td>chọn 1 vị</td><td>5</td></tr>
          <tr><td>2 viên cùng vị, 1 viên khác</td><td>vị đôi 5 cách, vị lẻ 4 cách: 5 × 4</td><td>20</td></tr>
          <tr><td>3 vị khác nhau</td><td>$\binom{5}{3}$</td><td>10</td></tr>
          <tr><td colspan="2">tổng</td><td>5 + 20 + 10 = 35 ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Kiểm ví dụ kem bằng đường khác, chia theo kiểu cốc kem. Nếu ba viên cùng vị, chỉ cần chọn một vị, có 5 cách. Nếu hai viên cùng vị và một viên khác, vị đôi có 5 cách, vị lẻ còn 4 cách, nên có 20 cách. Nếu ba vị khác nhau, chọn 3 trong 5 vị, có 10 cách. Cộng lại 5 cộng 20 cộng 10, bằng 35, khớp với sao và vạch."
      - clear: true
        show: |
          <p><b>Đường khác 2 — đếm 66 theo phần của An:</b> An được $a$ viên thì Bình và Chi chia $10 - a$ viên, có $11 - a$ cách (Bình được 0, 1, …, $10 - a$).</p>
          <table class="t"><tr><th>An</th><td>0</td><td>1</td><td>2</td><td>…</td><td>10</td></tr>
          <tr><th>số cách</th><td>11</td><td>10</td><td>9</td><td>…</td><td>1</td></tr></table>
          $$11 + 10 + \dots + 1 = \frac{11 \times 12}{2} = 66$$
        focus: [1, 2, 3]
        say: "Kiểm bài chia kẹo của đầu bài bằng đường khác, đếm theo phần của An. Nếu An được a viên, thì Bình có thể được từ 0 đến 10 trừ a viên, và Chi nhận phần còn lại, nên có 11 trừ a cách. Cho a chạy từ 0 đến 10, ta cộng 11 cộng 10 cộng đến 1, bằng 11 nhân 12 chia 2, bằng 66, khớp với tổ hợp chập 2 của 12."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "sum(1 for a in range(5) for b in range(5) if 0 <= 10 - a - b <= 4) == 6 == 3 + 3"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng $3^{10}$ cho kẹo giống nhau <b class="red">(sai)</b>
          <br><span class="note">$3^{10}$ đếm “viên nào cho ai” — đúng khi kẹo <b>khác nhau</b>. Kẹo giống nhau thì dùng sao và vạch.</span></div>
        say: "Lỗi thứ nhất, dùng 3 mũ 10 cho kẹo giống nhau. Con số đó đếm viên nào cho ai, chỉ đúng khi các viên kẹo khác nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên đổi biến khi mỗi hộp phải có ít nhất 1 <b class="red">(sai)</b>
          <br><span class="note">Với $x_i \ge 1$: trừ trước 1 ở mỗi hộp, rồi mới dùng công thức với tổng mới.</span></div>
        say: "Lỗi thứ hai, quên đổi biến khi mỗi hộp phải có ít nhất một vật. Phải trừ trước 1 ở mỗi hộp, rồi mới dùng công thức với tổng mới."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng $k$ vạch cho $k$ hộp <b class="red">(sai)</b>
          <br><span class="note">$k$ hộp chỉ cần $k - 1$ vạch ngăn. Thử lại bằng trường hợp nhỏ để bắt lỗi này.</span></div>
        say: "Lỗi thứ ba, dùng k vạch cho k hộp. Chia thành k phần chỉ cần k trừ 1 vạch ngăn, và thử bằng trường hợp nhỏ sẽ bắt được lỗi này."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng thẳng công thức khi có <b>giới hạn trên</b> <b class="red">(sai)</b>
          <br><span class="note">“Mỗi bạn nhiều nhất 4 viên” loại bớt nghiệm — phải trừ ra các nghiệm vi phạm giới hạn.</span></div>
          <table class="t"><tr><th>chia 10 viên cho 3 bạn</th><th>số cách</th></tr>
          <tr><td>không giới hạn</td><td>66</td></tr>
          <tr><td>mỗi bạn nhiều nhất 4 viên</td><td>chỉ 6: kiểu (4, 4, 2) và (4, 3, 3), mỗi kiểu 3 cách</td></tr></table>
        focus: [1, 1, "2.3", "2.3"]
        say: "Lỗi thứ tư, dùng thẳng công thức khi có giới hạn trên, như mỗi bạn nhiều nhất 4 viên. Giới hạn đó loại bớt một số nghiệm, nên cần thêm một bước trừ ra những nghiệm vi phạm. Thử với 10 viên, không giới hạn có 66 cách, nhưng nếu mỗi bạn nhiều nhất 4 viên thì chỉ còn 6 cách. Lý do là chỉ có hai kiểu chia 4, 4, 2 và 4, 3, 3, mỗi kiểu xếp được 3 cách."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sum(1 for t in __import__('itertools').product(range(7), repeat=4) if sum(t) == 6) == 84 == __import__('math').comb(9, 3)"
      - "sum(1 for t in __import__('itertools').product(range(1, 8), repeat=3) if sum(t) == 7) == 15 == __import__('math').comb(6, 2)"
      - "9 * 8 * 7 == 504 and 504 // 6 == 84 and 6 + 3 == 9 and 7 - 3 == 4 and 6 * 5 // 2 == 15"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Có bao nhiêu nghiệm tự nhiên của $x_1 + x_2 + x_3 + x_4 = 6$?</td></tr>
          <tr><td>2</td><td>Chia 7 viên kẹo giống nhau cho 3 bạn, mỗi bạn ít nhất 1 viên. Có bao nhiêu cách?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, phương trình bốn ẩn có tổng bằng 6 có bao nhiêu nghiệm tự nhiên? Câu hai, chia 7 viên kẹo giống nhau cho 3 bạn, mỗi bạn ít nhất một viên, có bao nhiêu cách? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① 6 sao; 4 ẩn cần $4 - 1 = 3$ vạch; hàng có $6 + 3 = 9$ ô.</p>
          $$\binom{9}{3} = \frac{9 \times 8 \times 7}{3 \times 2 \times 1} = \frac{504}{6} = \hl{84}$$
        focus: [1, 2, 2]
        say: "Đáp án câu một, có 6 sao, và bốn ẩn cần 4 trừ 1, bằng 3 vạch, nên hàng có 9 ô. Chọn 3 ô cho vạch, ta lấy 9 nhân 8 nhân 7, bằng 504, chia cho 6. Kết quả là 84 nghiệm."
      - show: |
          <p>② Chia trước mỗi bạn 1 viên, còn $7 - 3 = 4$ viên chia tự do: 4 sao, 2 vạch, 6 ô.</p>
          $$\binom{4 + 2}{2} = \binom{6}{2} = \frac{6 \times 5}{2} = \hl{15}$$
        focus: [1, 2, 2]
        say: "Câu hai, chia trước mỗi bạn một viên, còn lại 7 trừ 3, bằng 4 viên chia tự do. Vậy có 4 sao và 2 vạch, tổng 6 ô. Ta được tổ hợp chập 2 của 6, bằng 6 nhân 5 chia 2, bằng 15 cách."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vật giống nhau, hộp khác nhau</span><span class="a">→</span>
          <span class="n">$n$ sao, $k - 1$ vạch</span><span class="a">→</span>
          <span class="n">$\binom{n + k - 1}{k - 1}$</span><span class="a">→</span>
          <span class="n">“ít nhất 1”: trừ trước rồi đếm</span></div>
        say: "Tổng kết lại, khi chia vật giống nhau vào các hộp khác nhau, ta vẽ n sao và k trừ 1 vạch. Số cách là tổ hợp chập k trừ 1 của n cộng k trừ 1. Nếu mỗi hộp phải có ít nhất một vật, ta trừ trước rồi mới đếm."
      - show: |
          <div class="box key"><b>Tư duy:</b> một bài đếm khó thường trở nên dễ khi tìm được một <b>song ánh</b> sang thứ quen thuộc — ở đây là dãy sao và vạch.</div>
        say: "Điều cần mang theo, một bài đếm khó thường trở nên dễ khi ta tìm được một song ánh sang một thứ quen thuộc, ở đây là dãy sao và vạch."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>bao hàm–loại trừ tổng quát</b> cho nhiều tập, và đếm hoán vị không điểm cố định.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học bao hàm loại trừ tổng quát cho nhiều tập, và đếm hoán vị không điểm cố định. Hẹn gặp bạn ở bài tiếp theo."
