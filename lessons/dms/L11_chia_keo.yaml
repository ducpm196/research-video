      focus:
      - 1
      - 1
      - 1
      - 2
      - 1
      - 0
      pause: 360
      say: Bây giờ tới phần bạn tự làm. Hãy viết chương trình giải bốn bài đếm, nghiệm không âm, mỗi biến ít nhất hai, chọn kem có lặp, và mỗi biến không quá năm. Mỗi dòng in kết quả của công thức sao và vạch cạnh kết quả liệt kê hết mọi trường hợp, và hai số phải bằng nhau. Bài bốn có giới hạn trên, nên dùng tổng số nghiệm trừ các trường hợp vi phạm. Định dạng nằm trong thư mục thực hành. Hãy dừng video và tự làm.
