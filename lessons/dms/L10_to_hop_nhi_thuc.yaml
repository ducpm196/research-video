# Quy ước: tổ hợp viết $\binom{n}{k}$, đọc “tổ hợp chập k của n”. Chỉnh hợp A(n, k) như bài 9. Dấu nhân giữa hai số: × (cả bài).
#   Tổng nhiều số viết bằng dấu ba chấm, không dùng Σ (chưa giới thiệu ở khoá DMS).
objectives:
  - "Tính tổ hợp và giải thích vì sao chia k!"
  - "Dựng tam giác Pascal và giải thích quy tắc cộng của nó"
  - "Khai triển nhị thức và chứng minh tổng một hàng bằng 2 mũ n"
