# Quy ước: quan hệ R trên A là một tập các cặp có thứ tự (a, b); viết $a\,R\,b$ khi (a, b) thuộc R. “Lớp của a” viết bằng chữ,
#   không dùng ký hiệu ngoặc vuông. Số dư nói bằng lời “số dư khi chia cho 3” (phép mod học ở bài 13).
objectives:
  - "Kiểm ba tính chất phản xạ, đối xứng, bắc cầu của một quan hệ"
  - "Nhận ra quan hệ tương đương"
  - "Chia một tập thành các lớp tương đương"
