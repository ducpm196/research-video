  - {sentence: "Hễ a R b và b R a thì a phải bằng b, như với nhỏ hơn hoặc bằng.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Ta viết a R b khi cặp a, b thuộc R.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Định nghĩa a R b khi a và b có cùng số dư khi chia cho 3.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chia 9 số thành nhóm “cùng số dư”"
    checks:
      - "[x for x in range(9) if x % 3 == 0] == [0, 3, 6] and [x for x in range(9) if x % 3 == 1] == [1, 4, 7]"
    steps:
      - show: |
          <p>Các số 0, 1, 2, …, 8. Gom các số có <b>cùng số dư khi chia cho 3</b>:</p>
          <p>$\{0, 3, 6\}$ (dư 0) &nbsp; $\{1, 4, 7\}$ (dư 1) &nbsp; $\{2, 5, 8\}$ (dư 2)</p>
          <p>Ba nhóm, rời nhau, phủ kín cả 9 số. Vì sao “cùng số dư” chia được gọn như vậy, còn “là bạn của nhau” thì không?</p>
        focus: [1, 2, 3, 3]
        say: "Chào bạn, lấy các số từ 0 đến 8 và gom những số có cùng số dư khi chia cho 3. Ta được ba nhóm, dư 0, dư 1, dư 2. Ba nhóm này rời nhau và phủ kín cả chín số. Vì sao quan hệ cùng số dư chia được gọn như vậy, còn quan hệ là bạn của nhau thì không?"

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số dư khi chia cho 3, hiệu chẵn hay lẻ"
    checks:
      - "7 == 3 * 2 + 1 and 7 % 3 == 1 and 8 == 3 * 2 + 2 and 8 % 3 == 2 and 6 % 3 == 0 and 4 % 3 == 1"
      - "(5 - 3) % 2 == 0 and (6 - 3) % 2 == 1 and (2 + 4) % 2 == 0 and (5 - 3) + (3 - 1) == 5 - 1"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>chia cho 3</th><th>số dư</th></tr>
          <tr><td>6</td><td>6 = 3 × 2</td><td>0</td></tr>
          <tr><td>7</td><td>7 = 3 × 2 + 1</td><td>1</td></tr>
          <tr><td>8</td><td>8 = 3 × 2 + 2</td><td>2</td></tr>
          <tr><td>4</td><td>4 = 3 × 1 + 1</td><td>1</td></tr></table>
        focus: [0, 0, "1.2", "1.3", "1.5"]
        say: "Trước khi vào bài, ta ôn hai phép tính sẽ dùng đến. Thứ nhất là số dư khi chia cho 3, số dư chỉ có thể là 0, 1 hoặc 2. Số 6 bằng 3 nhân 2, dư 0. Số 7 bằng 3 nhân 2 cộng 1, dư 1, còn 8 thì dư 2. Số 4 bằng 3 nhân 1 cộng 1, cũng dư 1, nên 4 và 7 có cùng số dư."
      - clear: true
        show: |
          <table class="t"><tr><th>phép tính</th><th>kết quả</th><th>chẵn hay lẻ</th></tr>
          <tr><td>5 − 3</td><td>2</td><td>chẵn</td></tr>
          <tr><td>6 − 3</td><td>3</td><td>lẻ</td></tr>
          <tr><td>(5 − 3) + (3 − 1)</td><td>2 + 2 = 4 = 5 − 1</td><td>chẵn</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Thứ hai là xem một hiệu chẵn hay lẻ. Năm trừ 3 bằng 2, là số chẵn. Sáu trừ 3 bằng 3, là số lẻ. Để ý dòng cuối, cộng hai hiệu 5 trừ 3 và 3 trừ 1 thì số 3 ở giữa triệt tiêu, được 5 trừ 1, bằng 4, và tổng hai số chẵn là số chẵn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_rel
    kind: symbol
    title: "Giải mã: quan hệ R và cặp có thứ tự"
    checks:
      - "(1, 2) != (2, 1) and {1, 2} == {2, 1}"
    steps:
      - show: |
          <p><b>Cặp có thứ tự</b> $(a, b)$: thứ tự quan trọng, $(1, 2) \neq (2, 1)$ — khác tập $\{1, 2\} = \{2, 1\}$.</p>
          <p><b>Quan hệ</b> $R$ trên tập $A$: một tập các cặp $(a, b)$ với $a, b \in A$. Viết $a\,R\,b$ khi cặp $(a, b)$ thuộc $R$.</p>
          <p class="note">Ví dụ “nhỏ hơn hoặc bằng” trên $\{1, 2\}$: $R = \{(1, 1), (1, 2), (2, 2)\}$.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Cặp có thứ tự viết trong ngoặc tròn, ở đây thứ tự quan trọng, cặp 1, 2 khác cặp 2, 1. Điều này khác tập hợp, vì tập 1, 2 và tập 2, 1 là một. Quan hệ R trên tập A là một tập các cặp có thứ tự lấy từ A. Ta viết a R b khi cặp a, b thuộc R. Ví dụ quan hệ nhỏ hơn hoặc bằng trên tập 1, 2 gồm ba cặp như trên màn hình."

  # ───────────────────────── 3. BA TÍNH CHẤT ─────────────────────────
  - id: props
    kind: concept
    title: "Phản xạ, đối xứng, bắc cầu"
    checks:
      - "(lambda R: all(R(a, a) for a in range(20)) and not all(R(a, b) <= R(b, a) for a in range(20) for b in range(20)) and R(1, 2) and not R(2, 1))(lambda a, b: a <= b)"
      - "all(((a <= b) and (b <= c)) <= (a <= c) for a in range(12) for b in range(12) for c in range(12))"
    steps:
      - show: |
          <table class="t"><tr><th>tính chất</th><th>định nghĩa</th><th>“$\le$” trên $\mathbb{N}$</th></tr>
          <tr><td><b>phản xạ</b></td><td>$\forall a: a\,R\,a$</td><td>có: $a \le a$</td></tr>
          <tr><td><b>đối xứng</b></td><td>$a\,R\,b \implies b\,R\,a$</td><td>không: $1 \le 2$ nhưng $2 \le 1$ sai</td></tr>
          <tr><td><b>bắc cầu</b></td><td>$a\,R\,b \land b\,R\,c \implies a\,R\,c$</td><td>có</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4"]
        say: "Ba tính chất quan trọng của một quan hệ. Phản xạ, mọi a đều có quan hệ với chính nó, như a nhỏ hơn hoặc bằng a. Đối xứng, hễ a R b thì b R a. Quan hệ nhỏ hơn hoặc bằng không đối xứng, vì 1 nhỏ hơn hoặc bằng 2 mà 2 không nhỏ hơn hoặc bằng 1. Bắc cầu, a R b và b R c thì a R c, nhỏ hơn hoặc bằng có tính chất này."
      - show: |
          <p>“Là bạn của nhau”: đối xứng (bạn của tôi thì tôi là bạn của họ), nhưng <b>không</b> bắc cầu — bạn của bạn chưa chắc là bạn.</p>
        say: "Còn quan hệ là bạn của nhau thì đối xứng, vì bạn của tôi thì tôi cũng là bạn của họ. Nhưng nó không bắc cầu, bạn của bạn chưa chắc đã là bạn, nên nó không chia được thành nhóm gọn gàng."

  # ───────────────────────── 4. QUAN HỆ TƯƠNG ĐƯƠNG ─────────────────────────
  - id: equivalence
    kind: concept
    title: "Quan hệ tương đương và lớp tương đương"
    checks:
      - "all(len({x for x in range(9) if x % 3 == a % 3}) == 3 for a in range(9))"
    steps:
      - show: |
          <div class="box key"><b>Quan hệ tương đương</b> = phản xạ + đối xứng + bắc cầu.</div>
          <p><b>Lớp tương đương</b> của $a$: tập mọi $x$ có $x\,R\,a$. &nbsp; Ví dụ với “cùng số dư khi chia cho 3”: lớp của 4 là $\{1, 4, 7\}$.</p>
        focus: [1, 2, 2]
        say: "Một quan hệ có đủ ba tính chất phản xạ, đối xứng, bắc cầu gọi là quan hệ tương đương. Lớp tương đương của a là tập mọi x có quan hệ với a. Ví dụ với quan hệ cùng số dư khi chia cho 3, lớp của 4 gồm 1, 4 và 7."
      - show: |
          <div class="box ok"><b>Định lý</b>: các lớp tương đương <b>rời nhau</b> và <b>phủ kín</b> tập $A$ — gọi là một <b>phân hoạch</b> của $A$.</div>
          <p class="note">Ý chính: nếu hai lớp có chung một phần tử $c$ thì nhờ đối xứng và bắc cầu, mọi phần tử của lớp này liên hệ được với lớp kia — hai lớp trùng nhau.</p>
        focus: [1, 2, 2]
        say: "Định lý quan trọng, các lớp tương đương rời nhau và phủ kín tập A, ta gọi đó là một phân hoạch. Ý chính của chứng minh, nếu hai lớp có chung một phần tử c, thì nhờ đối xứng và bắc cầu, mọi phần tử lớp này đều liên hệ được với lớp kia. Vì vậy hai lớp phải trùng nhau."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Có bắc cầu thì thành cụm khép kín"
    checks:
      - "all(len({x for x in range(9) if x % 3 == r}) == 3 for r in range(3))"
    steps:
      - show: |
          <div><svg width="1400" height="330" viewBox="0 0 1400 330"><text x="400" y="36" font-size="25" text-anchor="middle">cùng số dư khi chia cho 3: có bắc cầu</text><rect x="35" y="58" width="230" height="210" rx="20" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/><line x1="150" y1="100" x2="80" y2="220" stroke="#2563eb" stroke-width="3"/><line x1="80" y1="220" x2="220" y2="220" stroke="#2563eb" stroke-width="3"/><line x1="150" y1="100" x2="220" y2="220" stroke="#2563eb" stroke-width="3"/><circle cx="150" cy="100" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="150" y="109" font-size="24" text-anchor="middle">0</text><circle cx="80" cy="220" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="80" y="229" font-size="24" text-anchor="middle">3</text><circle cx="220" cy="220" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="220" y="229" font-size="24" text-anchor="middle">6</text><text x="150" y="300" font-size="24" text-anchor="middle" fill="#2563eb">lớp dư 0</text><rect x="285" y="58" width="230" height="210" rx="20" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5"/><line x1="400" y1="100" x2="330" y2="220" stroke="#15803d" stroke-width="3"/><line x1="330" y1="220" x2="470" y2="220" stroke="#15803d" stroke-width="3"/><line x1="400" y1="100" x2="470" y2="220" stroke="#15803d" stroke-width="3"/><circle cx="400" cy="100" r="26" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><text x="400" y="109" font-size="24" text-anchor="middle">1</text><circle cx="330" cy="220" r="26" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><text x="330" y="229" font-size="24" text-anchor="middle">4</text><circle cx="470" cy="220" r="26" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><text x="470" y="229" font-size="24" text-anchor="middle">7</text><text x="400" y="300" font-size="24" text-anchor="middle" fill="#15803d">lớp dư 1</text><rect x="535" y="58" width="230" height="210" rx="20" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/><line x1="650" y1="100" x2="580" y2="220" stroke="#d97706" stroke-width="3"/><line x1="580" y1="220" x2="720" y2="220" stroke="#d97706" stroke-width="3"/><line x1="650" y1="100" x2="720" y2="220" stroke="#d97706" stroke-width="3"/><circle cx="650" cy="100" r="26" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="650" y="109" font-size="24" text-anchor="middle">2</text><circle cx="580" cy="220" r="26" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="580" y="229" font-size="24" text-anchor="middle">5</text><circle cx="720" cy="220" r="26" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="720" y="229" font-size="24" text-anchor="middle">8</text><text x="650" y="300" font-size="24" text-anchor="middle" fill="#d97706">lớp dư 2</text><line x1="830" y1="40" x2="830" y2="320" stroke="#d1d5db" stroke-width="2"/><text x="1130" y="36" font-size="25" text-anchor="middle">là bạn: không bắc cầu</text><line x1="960" y1="220" x2="1130" y2="100" stroke="#6b7280" stroke-width="3"/><line x1="1130" y1="100" x2="1300" y2="220" stroke="#6b7280" stroke-width="3"/><line x1="960" y1="220" x2="1300" y2="220" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8"/><circle cx="960" cy="220" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="960" y="229" font-size="24" text-anchor="middle">An</text><circle cx="1130" cy="100" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1130" y="109" font-size="24" text-anchor="middle">Bình</text><circle cx="1300" cy="220" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1300" y="229" font-size="24" text-anchor="middle">Chi</text><text x="1130" y="250" font-size="22" text-anchor="middle" fill="#dc2626">An và Chi: không là bạn</text><text x="1130" y="300" font-size="22" text-anchor="middle" fill="#dc2626">nhóm An, Bình chồng lên nhóm Bình, Chi</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này vẽ mỗi cặp có quan hệ thành một đoạn nối. Bên trái là quan hệ cùng số dư, vì có bắc cầu nên hễ nối được 0 với 3 và 3 với 6 thì 0 cũng nối với 6. Các đoạn nối khép kín thành ba cụm tách rời, mỗi cụm là một lớp. Bên phải là quan hệ là bạn, An là bạn Bình, Bình là bạn Chi, nhưng An và Chi không là bạn. Cầu nối bị đứt, nên nhóm An và Bình chồng lên nhóm Bình và Chi, và không chia được thành các nhóm rời nhau."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Kiểm “cùng số dư khi chia cho 3” trên {0, …, 8}"
    checks:
      - "(lambda R: all(R(a, a) for a in range(9)) and not R(0, 1))(lambda a, b: a % 3 == b % 3)"
      - "all((a % 3 == b % 3) <= (b % 3 == a % 3) for a in range(9) for b in range(9))"
      - "all(((a % 3 == b % 3) and (b % 3 == c % 3)) <= (a % 3 == c % 3) for a in range(9) for b in range(9) for c in range(9))"
      - "sorted({tuple(x for x in range(9) if x % 3 == a % 3) for a in range(9)}) == [(0, 3, 6), (1, 4, 7), (2, 5, 8)]"
    steps:
      - show: |
          <p>$a\,R\,b$ khi $a$ và $b$ có cùng số dư khi chia cho 3.</p>
          <p><b>Bước 1</b> — ① Phản xạ: $a$ cùng số dư với chính nó ✓ &nbsp; (thử: 7 dư 1, 7 dư 1)</p>
        focus: [1, 2, 2]
        say: "Định nghĩa a R b khi a và b có cùng số dư khi chia cho 3. Bước một, phản xạ, đúng, vì a cùng số dư với chính nó. Thử với số 7, hai lần chia đều dư 1."
      - show: |
          <p><b>Bước 2</b> — ② Đối xứng: $a$ cùng dư với $b$ thì $b$ cùng dư với $a$ ✓ &nbsp; (thử: 1 và 4 cùng dư 1, nên 4 và 1 cũng vậy)</p>
        say: "Bước hai, đối xứng, đúng, vì câu cùng số dư không phân biệt ai trước ai sau. Thử với 1 và 4, cùng dư 1, nên đọc ngược 4 và 1 cũng cùng dư."
      - show: |
          <p><b>Bước 3</b> — ③ Bắc cầu: dư của $a$ bằng dư của $b$, dư của $b$ bằng dư của $c$ $\implies$ dư của $a$ bằng dư của $c$ ✓</p>
          <table class="t"><tr><th>$a = 1$</th><th>$b = 4$</th><th>$c = 7$</th></tr>
          <tr><td>dư 1</td><td>dư 1</td><td>dư 1</td></tr></table>
        focus: [1, 1, 2]
        say: "Bước ba, bắc cầu, đúng, vì hai đẳng thức về số dư nối được với nhau qua số dư của b. Nói cách khác, dư của a bằng dư của b, mà dư của b bằng dư của c, nên dư của a bằng dư của c. Thử với 1, 4, 7, cả ba đều dư 1, nên 1 R 4, 4 R 7 kéo theo 1 R 7."
      - clear: true
        show: |
          <p><b>Bước 4</b> — Vậy $R$ là quan hệ tương đương, chia $\{0, \dots, 8\}$ thành 3 lớp: $\{0, 3, 6\}$, $\{1, 4, 7\}$, $\{2, 5, 8\}$.</p>
          <p class="note">Máy kiểm đủ $9^3 = 729$ bộ $(a, b, c)$ cho bắc cầu và ra đúng 3 lớp ✓</p>
        focus: [1, 2]
        say: "Bước bốn, vậy R là một quan hệ tương đương, và nó chia các số từ 0 đến 8 thành đúng ba lớp. Máy đã kiểm đủ 729 bộ ba cho tính bắc cầu, và tìm ra đúng ba lớp như đầu bài."

  # ───────────────────────── 6. PHẢN ĐỐI XỨNG ─────────────────────────
  - id: antisym
    kind: concept
    title: "Phản đối xứng"
    checks:
      - "all(((a <= b) and (b <= a)) <= (a == b) for a in range(20) for b in range(20))"
    steps:
      - show: |
          <p><b>Phản đối xứng</b>: $a\,R\,b \land b\,R\,a \implies a = b$. &nbsp; Ví dụ “$\le$”: $a \le b$ và $b \le a$ thì $a = b$.</p>
          <div class="box warn">Phản đối xứng <b>không</b> phải “không đối xứng”. Quan hệ “bằng” vừa đối xứng vừa phản đối xứng.</div>
        focus: [1, 1, 2, 2]
        say: "Thêm một tính chất nữa, gọi là phản đối xứng. Hễ a R b và b R a thì a phải bằng b, như với nhỏ hơn hoặc bằng. Chú ý phản đối xứng không có nghĩa là không đối xứng. Quan hệ bằng nhau vừa đối xứng vừa phản đối xứng."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tìm phản ví dụ cho từng tính chất"
    checks:
      - "[x % 3 for x in range(9)] == [0, 1, 2, 0, 1, 2, 0, 1, 2] and [[x % 3 for x in range(9)].count(r) for r in range(3)] == [3, 3, 3] and 3 + 3 + 3 == 9"
    steps:
      - show: |
          <table class="t"><tr><th>tính chất bị nghi</th><th>phản ví dụ cần tìm</th></tr>
          <tr><td>phản xạ</td><td>một $a$ <b>không</b> có $a\,R\,a$</td></tr>
          <tr><td>đối xứng</td><td>một cặp có $a\,R\,b$ nhưng không có $b\,R\,a$</td></tr>
          <tr><td>bắc cầu</td><td>$a\,R\,b$, $b\,R\,c$ nhưng không có $a\,R\,c$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng cách tìm phản ví dụ, vì mỗi tính chất là một câu với mọi, như bài 2. Muốn bác bỏ phản xạ, chỉ cần một a không quan hệ với chính nó. Muốn bác bỏ đối xứng, chỉ cần một cặp đi một chiều. Muốn bác bỏ bắc cầu, chỉ cần một bộ ba a, b, c mà cầu nối bị đứt."
      - clear: true
        show: |
          <p><b>Đường khác — tính thẳng số dư của từng số</b>, không dùng ba tính chất:</p>
          <table class="t"><tr><th>số</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>
          <tr><td>dư khi chia 3</td><td>0</td><td>1</td><td>2</td><td>0</td><td>1</td><td>2</td><td>0</td><td>1</td><td>2</td></tr></table>
          <p>Gom theo dư: dư 0 có 3 số, dư 1 có 3 số, dư 2 có 3 số; $3 + 3 + 3 = 9$ — đủ 9 số, không số nào ở hai lớp ✓</p>
        focus: [1, 2, 3, 3]
        say: "Bây giờ kiểm bằng đường khác, tính thẳng số dư của từng số mà không dùng ba tính chất. Bảng cho dư 0, 1, 2 lặp lại ba lần. Gom theo số dư, mỗi lớp có 3 số, và 3 cộng 3 cộng 3 bằng 9. Vậy ba lớp phủ đủ chín số, mỗi số chỉ có một số dư nên không số nào nằm ở hai lớp, khớp với ví dụ."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda R: R(1, 2) and R(2, 3) and not R(1, 3))(lambda a, b: abs(a - b) <= 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi phản đối xứng là “không đối xứng” <b class="red">(sai)</b>
          <br><span class="note">“Bằng nhau” có cả hai tính chất. Hai khái niệm không loại trừ nhau.</span></div>
        say: "Lỗi thứ nhất, coi phản đối xứng là không đối xứng. Quan hệ bằng nhau có cả hai tính chất, hai khái niệm không loại trừ nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ kiểm vài cặp rồi kết luận bắc cầu <b class="red">(sai)</b>
          <br><span class="note">Bắc cầu là câu “với mọi bộ ba” — phải chứng minh, hoặc trên tập nhỏ thì kiểm hết mọi bộ ba.</span></div>
          <table class="t"><tr><th>“hơn kém nhau nhiều nhất 1”</th><th>có quan hệ?</th></tr>
          <tr><td>1 và 2</td><td>có</td></tr><tr><td>2 và 3</td><td>có</td></tr><tr><td>1 và 3</td><td><b class="red">không</b> — bắc cầu đứt</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, chỉ kiểm vài cặp rồi kết luận bắc cầu. Bắc cầu là câu với mọi bộ ba, nên phải chứng minh, hoặc với tập nhỏ thì kiểm hết mọi bộ ba. Ví dụ quan hệ hơn kém nhau nhiều nhất 1, cặp 1 và 2, cặp 2 và 3 đều có, nhưng 1 và 3 hơn kém nhau 2, nên bắc cầu bị đứt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn cặp có thứ tự $(a, b)$ với tập $\{a, b\}$ <b class="red">(sai)</b>
          <br><span class="note">Với quan hệ không đối xứng, $(1, 2)$ thuộc $R$ không kéo theo $(2, 1)$ thuộc $R$.</span></div>
        say: "Lỗi thứ ba, lẫn cặp có thứ tự với tập hai phần tử. Với quan hệ không đối xứng, cặp 1, 2 thuộc R không có nghĩa là cặp 2, 1 cũng thuộc R."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ mọi quan hệ đều chia được thành nhóm <b class="red">(sai)</b>
          <br><span class="note">Chỉ quan hệ <b>tương đương</b> mới cho phân hoạch. “Là bạn” không bắc cầu nên các “nhóm bạn” có thể chồng lên nhau.</span></div>
        say: "Lỗi thứ tư, nghĩ mọi quan hệ đều chia được thành nhóm. Chỉ quan hệ tương đương mới cho một phân hoạch. Quan hệ là bạn không bắc cầu, nên các nhóm bạn có thể chồng lên nhau."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sorted({tuple(x for x in range(1, 7) if (x - a) % 2 == 0) for a in range(1, 7)}) == [(1, 3, 5), (2, 4, 6)]"
      - "(5 - 3, 3 - 5, 5 - 1) == (2, -2, 4) and 1 < 2 < 5"
      - "not any(a < a for a in range(10)) and all(((a < b) and (b < c)) <= (a < c) for a in range(10) for b in range(10) for c in range(10))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trên $\{1, \dots, 6\}$, $a\,R\,b$ khi $a - b$ chẵn. $R$ có là quan hệ tương đương không? Liệt kê các lớp.</td></tr>
          <tr><td>2</td><td>Quan hệ “nhỏ hơn hẳn” trên $\mathbb{N}$ có phản xạ không? Có bắc cầu không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, trên các số từ 1 đến 6, a R b khi a trừ b là số chẵn, R có là quan hệ tương đương không, và liệt kê các lớp. Câu hai, quan hệ nhỏ hơn hẳn trên tập số tự nhiên có phản xạ không, có bắc cầu không? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① Có: $a - a = 0$ chẵn; $a - b$ chẵn thì $b - a$ chẵn; tổng hai số chẵn là chẵn. Hai lớp: $\{1, 3, 5\}$ và $\{2, 4, 6\}$.</p>
          <table class="t"><tr><th>tính chất</th><th>lý do</th><th>thử bằng số</th></tr>
          <tr><td>phản xạ</td><td>$a - a = 0$ chẵn</td><td>$3 - 3 = 0$</td></tr>
          <tr><td>đối xứng</td><td>$b - a = -(a - b)$, đổi dấu vẫn chẵn</td><td>$5 - 3 = 2$, $3 - 5 = -2$</td></tr>
          <tr><td>bắc cầu</td><td>$a - c = (a - b) + (b - c)$, tổng hai số chẵn</td><td>$5 - 1 = 2 + 2 = 4$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 1]
        say: "Đáp án câu một, có. Phản xạ vì a trừ a bằng 0 là số chẵn, đối xứng vì đổi dấu số chẵn vẫn chẵn, bắc cầu vì a trừ c bằng tổng hai hiệu chẵn. Thử bằng số, 5 trừ 3 bằng 2 thì 3 trừ 5 bằng âm 2, vẫn chẵn. Còn 5 trừ 1 bằng 2 cộng 2, bằng 4, chẵn. Hai lớp là các số lẻ và các số chẵn."
      - show: |
          <p>② Phản xạ cần $a \lt a$ — sai với mọi $a$, ví dụ $0 \lt 0$ sai → <b>không</b> phản xạ. Bắc cầu: $a \lt b$ và $b \lt c$ thì $a \lt c$, ví dụ $1 \lt 2 \lt 5$ → <b>có</b>.</p>
        say: "Câu hai, phản xạ đòi hỏi a nhỏ hơn hẳn chính a, điều này sai với mọi a, ví dụ 0 không nhỏ hơn 0, nên không phản xạ. Còn bắc cầu thì có, vì a nhỏ hơn b và b nhỏ hơn c thì a nhỏ hơn c, ví dụ 1 nhỏ hơn 2, 2 nhỏ hơn 5, nên 1 nhỏ hơn 5."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quan hệ: tập các cặp có thứ tự</span><span class="a">→</span>
          <span class="n">phản xạ, đối xứng, bắc cầu</span><span class="a">→</span>
          <span class="n">đủ cả ba: tương đương</span><span class="a">→</span>
          <span class="n">các lớp: phân hoạch tập</span></div>
        say: "Tổng kết lại, quan hệ là một tập các cặp có thứ tự. Ba tính chất cần kiểm là phản xạ, đối xứng, bắc cầu. Đủ cả ba thì đó là quan hệ tương đương, và các lớp tương đương tạo thành một phân hoạch của tập."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi khi gom “những thứ giống nhau” vào nhóm (bảng băm, gom cụm, phân lớp), hãy hỏi: quan hệ “giống nhau” này có bắc cầu không?</div>
        say: "Điều cần mang theo, mỗi khi gom những thứ giống nhau vào một nhóm, như trong bảng băm hay gom cụm dữ liệu, hãy hỏi quan hệ giống nhau đó có bắc cầu không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>thứ tự bộ phận</b> — khi quan hệ phản xạ, phản đối xứng, bắc cầu; vẽ biểu đồ thứ tự và sắp xếp các việc phụ thuộc nhau.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học thứ tự bộ phận, khi quan hệ phản xạ, phản đối xứng và bắc cầu, cùng cách sắp xếp những việc phụ thuộc nhau. Hẹn gặp bạn ở bài tiếp theo."
