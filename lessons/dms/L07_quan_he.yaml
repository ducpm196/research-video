  - {sentence: "Câu hai, phản xạ đòi hỏi a nhỏ hơn hẳn chính a, điều này sai với mọi a, ví dụ 0 không nhỏ hơn 0, nên không phản xạ.", reason: "ASR chép “Câu 2, phản xạ đòi hỏi ai nhỏ hơn hẳn chính A, điều này sai với mọi A, ví dụ 0 không nhỏ hơn 0, nên không phản xạ” (0.966): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
