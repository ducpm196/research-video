  - {sentence: "Câu hai, mỗi đỉnh có bậc 4, là số chẵn.", reason: "bậc/bật (âm cuối c/t, cùng loại với Fermat → “phét ma” ở probe p1), chẵn/chẳng, lẻ/lẽ (thanh ngã/hỏi): nhầm của ASR lặp ở mọi bài đồ thị; đỉnh/định là nhầm thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lý do là tổng mọi bậc thì chẵn, mà phần các bậc chẵn đã chẵn, nên phần các bậc lẻ cũng phải có tổng chẵn.", reason: "bậc/bật (âm cuối c/t, cùng loại với Fermat → “phét ma” ở probe p1), chẵn/chẳng, lẻ/lẽ (thanh ngã/hỏi): nhầm của ASR lặp ở mọi bài đồ thị; NOT_VERIFIED bằng tai người"}
  - {sentence: "Đồ thị lại liên thông, nên có chu trình Euler đi qua cả 10 cạnh.", reason: "Euler → “ở lè” (probe p1_ten 8/8, cùng âm); đồ/đô, chu/chư: nhầm thanh của ASR"}
  - {sentence: "Năm 1736, nhà toán học Euler chứng minh là không có, và chỉ cần đếm số cạnh ở mỗi đỉnh.", reason: "Euler đọc “Ơ-le” (probe p1_ten 8/8); ASR chép “ơ le/ở Lê/ở lè”, cùng âm hoặc lệch thanh"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bảy cây cầu"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="560" height="380" viewBox="0 0 560 380"><path d="M200,60 Q270,125 200,190" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M200,60 Q130,125 200,190" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M200,320 Q130,255 200,190" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M200,320 Q270,255 200,190" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M200,60 Q335,125 470,190" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M200,320 Q335,255 470,190" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M200,190 Q335,190 470,190" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="200" cy="60" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="200" y="71" font-size="30" text-anchor="middle">A</text><text x="105" y="68" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 3</text><circle cx="200" cy="190" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="200" y="201" font-size="30" text-anchor="middle">C</text><text x="90" y="198" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 5</text><circle cx="200" cy="320" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="200" y="331" font-size="30" text-anchor="middle">B</text><text x="105" y="328" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 3</text><circle cx="470" cy="190" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="470" y="201" font-size="30" text-anchor="middle">D</text><text x="470" y="252" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 3</text></svg></div>
          <div class="col"><p>Thành phố Königsberg (thế kỷ 18) có hai bờ sông A, B, một đảo C, một vùng D, nối bằng <b>7 cây cầu</b>.</p>
          <p>Có cách đi dạo qua <b>mỗi cây cầu đúng một lần</b> rồi về chỗ cũ không?</p></div></div>
        focus: ["1.1", "1.2", "1.2"]
        say: "Chào bạn, một thành phố châu Âu ở thế kỷ 18 có hai bờ sông, một hòn đảo và một vùng đất, nối với nhau bằng bảy cây cầu. Trên hình, mỗi vùng là một đỉnh, mỗi cây cầu là một cạnh. Có cách nào đi dạo qua mỗi cây cầu đúng một lần rồi về chỗ cũ không?"
      - show: |
          <div class="box key">Năm 1736, nhà toán học Euler chứng minh là <b>không có</b> — và chỉ cần đếm số cạnh ở mỗi đỉnh. Đó là bài toán đầu tiên của lý thuyết đồ thị.</div>
        say: "Năm 1736, nhà toán học Euler chứng minh là không có, và chỉ cần đếm số cạnh ở mỗi đỉnh. Đó được xem là bài toán đầu tiên của lý thuyết đồ thị."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cộng số chẵn, số lẻ; đếm mỗi thứ hai lần"
    checks:
      - "4 + 2 == 6 and 3 + 5 == 8 and 3 + 4 == 7 and (4 + 2) % 2 == 0 and (3 + 5) % 2 == 0 and (3 + 4) % 2 == 1"
      - "3 + 5 + 7 == 15 and 15 % 2 == 1 and 3 + 5 + 7 + 1 == 16"
      - "4 * 3 == 12 and 12 // 2 == 6 and len(list(__import__('itertools').combinations(range(4), 2))) == 6"
    steps:
      - show: |
          <table class="t"><tr><th>phép cộng</th><th>kết quả</th><th>chẵn hay lẻ</th></tr>
          <tr><td>chẵn + chẵn: 4 + 2</td><td>6</td><td>chẵn</td></tr>
          <tr><td>lẻ + lẻ: 3 + 5</td><td>8</td><td>chẵn</td></tr>
          <tr><td>lẻ + chẵn: 3 + 4</td><td>7</td><td>lẻ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn hai việc nhỏ sẽ dùng đến. Việc thứ nhất là cộng các số chẵn và số lẻ, chẳng hạn 4 cộng 2 bằng 6, vẫn là số chẵn. Ba cộng 5 bằng 8, là số chẵn, vì hai phần dư 1 gộp lại thành 2. Còn 3 cộng 4 bằng 7, là số lẻ, vì chỉ có một phần dư 1."
      - show: |
          <p>Hệ quả: tổng của <b>một số lẻ</b> các số lẻ thì lẻ: $3 + 5 + 7 = 15$ lẻ; thêm một số lẻ nữa: $15 + 1 = 16$ chẵn.</p>
        say: "Từ đó suy ra, cộng một số lẻ các số lẻ thì được số lẻ, ví dụ 3 cộng 5 cộng 7 bằng 15. Thêm một số lẻ nữa, như 1, thì tổng thành 16, lại chẵn, vì các phần dư 1 đã ghép đủ thành từng cặp."
      - clear: true
        show: |
          <p>Việc thứ hai: <b>đếm mỗi thứ hai lần rồi chia 2</b>. Bốn người, ai cũng bắt tay mọi người còn lại:</p>
          <table class="t"><tr><th>đếm theo từng người</th><th>mỗi cái bắt tay bị đếm</th><th>số cái bắt tay</th></tr>
          <tr><td>$4 \times 3 = 12$ lượt</td><td>2 lần (mỗi người một lần)</td><td>$\frac{12}{2} = 6$</td></tr></table>
        focus: [1, "2.2", "2.2", "2.2"]
        say: "Việc thứ hai là đếm mỗi thứ hai lần rồi chia đôi. Bốn người, ai cũng bắt tay ba người còn lại. Nếu đếm theo từng người, ta có 4 nhân 3, bằng 12 lượt. Nhưng mỗi cái bắt tay bị đếm hai lần, một lần cho mỗi người, nên số cái bắt tay thật là 12 chia 2, bằng 6."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_graph
    kind: symbol
    title: "Giải mã: đồ thị, đỉnh, cạnh, bậc"
    checks:
      - "sorted(__import__('collections').Counter([x for e in [('A','C'),('A','C'),('B','C'),('B','C'),('A','D'),('B','D'),('C','D')] for x in e]).values()) == [3, 3, 3, 5]"
    steps:
      - show: |
          <p><b>Đồ thị</b> $G = (V, E)$: tập <b>đỉnh</b> $V$ và tập <b>cạnh</b> $E$, mỗi cạnh nối hai đỉnh. Thường đặt $n = |V|$, $m = |E|$.</p>
          <p>$\deg(v)$: <b>bậc</b> của đỉnh $v$ — số đầu cạnh chạm vào $v$. Ở hình cầu: $\deg(C) = 5$, còn A, B, D có bậc 3.</p>
          <p class="note">Hai đỉnh có thể nối bằng nhiều cạnh (A và C có 2 cầu) — gọi là đa đồ thị.</p>
        introduces: [deg]
        focus: [1, 1, 2, 2, 3]
        say: "Một đồ thị gồm tập đỉnh V và tập cạnh E, mỗi cạnh nối hai đỉnh. Thường ta đặt n là số đỉnh, m là số cạnh. Ký hiệu d e g của v là bậc của đỉnh v, tức số đầu cạnh chạm vào v. Ở hình cây cầu, đảo C có bậc 5, ba vùng còn lại có bậc 3. Hai đỉnh có thể nối bằng nhiều cạnh, như A và C có hai cầu, khi đó gọi là đa đồ thị."

  # ───────────────────────── 3. BỔ ĐỀ BẮT TAY ─────────────────────────
  - id: handshake
    kind: concept
    title: "Bổ đề bắt tay: tổng bậc bằng 2m"
    checks:
      - "3 + 3 + 3 + 5 == 14 == 2 * 7"
      - "all(sum(__import__('collections').Counter([x for e in es for x in e]).values()) == 2 * len(es) for es in [[(0, 1)], [(0, 1), (1, 2), (2, 0)], [(0, 1), (0, 1), (2, 3)]])"
    steps:
      - show: |
          <div class="box key">Tổng các bậc $= 2m$: mỗi cạnh có <b>hai đầu</b>, góp 1 vào bậc của mỗi đầu.</div>
          <p>Hình cầu: $3 + 3 + 3 + 5 = 14 = 2 \times 7$ ✓</p>
          <p><b>Hệ quả</b>: số đỉnh có bậc lẻ luôn là số <b>chẵn</b> — vì tổng bậc chẵn, mà tổng các bậc chẵn đã chẵn.</p>
        focus: [1, 2, 3, 3]
        say: "Bổ đề bắt tay, tổng các bậc bằng 2 lần số cạnh, vì mỗi cạnh có hai đầu và góp 1 vào bậc của mỗi đầu. Ở hình cây cầu, 3 cộng 3 cộng 3 cộng 5 bằng 14, đúng bằng 2 lần 7 cầu. Hệ quả, số đỉnh có bậc lẻ luôn là số chẵn. Lý do là tổng mọi bậc thì chẵn, mà phần các bậc chẵn đã chẵn, nên phần các bậc lẻ cũng phải có tổng chẵn."

  # ───────────────────────── 4. ĐỊNH LÝ EULER ─────────────────────────
  - id: euler
    kind: concept
    title: "Khi nào đi được qua mọi cạnh đúng một lần?"
    checks:
      - "sum(1 for d in [3, 3, 3, 5] if d % 2 == 1) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>đồ thị liên thông, số đỉnh bậc lẻ</th><th>kết luận</th></tr>
          <tr><td>0</td><td>có <b>chu trình Euler</b> (qua mọi cạnh một lần, về chỗ cũ)</td></tr>
          <tr><td>2</td><td>có <b>đường đi Euler</b>, bắt đầu và kết thúc ở hai đỉnh lẻ đó</td></tr>
          <tr><td>4 trở lên</td><td>không có</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Định lý Euler cho đồ thị liên thông, tức là đi được từ đỉnh nào tới đỉnh nào. Nếu không có đỉnh bậc lẻ, có một chu trình đi qua mọi cạnh đúng một lần và về chỗ cũ. Nếu có đúng hai đỉnh bậc lẻ, có đường đi qua mọi cạnh, bắt đầu và kết thúc ở hai đỉnh lẻ đó. Nếu có từ bốn đỉnh lẻ trở lên thì không có."
      - show: |
          <p><b>Vì sao cần bậc chẵn</b>: mỗi lần đi <b>qua</b> một đỉnh, ta dùng một cạnh để vào và một cạnh để ra — cạnh ở đỉnh đó bị dùng theo từng cặp.</p>
          <div class="box warn">Bảy cây cầu: cả 4 đỉnh đều bậc lẻ $\implies$ <b>không</b> có chu trình, cũng không có đường đi Euler.</div>
        focus: [1, 1, 2]
        say: "Vậy vì sao mỗi đỉnh lại cần có bậc chẵn? Mỗi lần đi qua một đỉnh, ta dùng một cạnh để vào và một cạnh để ra, nên các cạnh ở đỉnh đó bị dùng theo từng cặp. Với bảy cây cầu, cả bốn đỉnh đều có bậc lẻ, nên không có chu trình, cũng không có đường đi nào qua mỗi cầu đúng một lần."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Vẽ phong bì bằng một nét"
    checks:
      - "sorted(__import__('collections').Counter([x for e in [(1,2),(2,3),(3,4),(4,1),(4,5),(5,3),(1,3),(2,4)] for x in e]).items()) == [(1, 3), (2, 3), (3, 4), (4, 4), (5, 2)]"
      - "(lambda E: [sorted([b for a, b in E if a == v] + [a for a, b in E if b == v]) for v in range(1, 6)] == [[2, 3, 4], [1, 3, 4], [1, 2, 4, 5], [1, 2, 3, 5], [3, 4]])([(1,2),(2,3),(3,4),(4,1),(4,5),(5,3),(1,3),(2,4)])"
      - "(lambda w, E: len(w) == 9 and sorted(tuple(sorted(p)) for p in zip(w, w[1:])) == sorted(tuple(sorted(e)) for e in E))([1, 3, 5, 4, 2, 3, 4, 1, 2], [(1,2),(2,3),(3,4),(4,1),(4,5),(5,3),(1,3),(2,4)])"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="520" height="380" viewBox="0 0 520 380"><path d="M130,340 Q260,340 390,340" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M390,340 Q390,255 390,170" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M390,170 Q260,170 130,170" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M130,170 Q130,255 130,340" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M130,170 Q195,110 260,50" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M260,50 Q325,110 390,170" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M130,340 Q260,255 390,170" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M390,340 Q260,255 130,170" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="130" cy="340" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="130" y="351" font-size="30" text-anchor="middle">1</text><text x="52" y="348" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 3</text><circle cx="390" cy="340" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="390" y="351" font-size="30" text-anchor="middle">2</text><text x="468" y="348" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 3</text><circle cx="390" cy="170" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="390" y="181" font-size="30" text-anchor="middle">3</text><text x="470" y="178" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 4</text><circle cx="130" cy="170" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="130" y="181" font-size="30" text-anchor="middle">4</text><text x="50" y="178" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 4</text><circle cx="260" cy="50" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="260" y="61" font-size="30" text-anchor="middle">5</text><text x="350" y="58" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">bậc 2</text></svg></div>
          <div class="col"><p>Hình phong bì: 5 đỉnh, 8 cạnh. Bậc: 3, 3, 4, 4, 2.</p>
          <p>Đúng <b>2</b> đỉnh bậc lẻ (1 và 2) $\implies$ có đường đi Euler, phải bắt đầu ở 1 và kết thúc ở 2 (hoặc ngược lại).</p></div></div>
        focus: ["1.1", "1.2", "1.2"]
        say: "Ví dụ, trò chơi vẽ hình phong bì bằng một nét, không nhấc bút và không tô lại nét nào. Hình có 5 đỉnh, 8 cạnh, với bậc lần lượt 3, 3, 4, 4, 2. Có đúng hai đỉnh bậc lẻ là 1 và 2, nên có đường đi, và đường đi phải bắt đầu ở đỉnh 1 rồi kết thúc ở đỉnh 2, hoặc ngược lại."
      - clear: true
        show: |
          <p><b>Bước đếm bậc</b> — đọc từ danh sách 8 cạnh: 1–2, 2–3, 3–4, 4–1, 4–5, 5–3, 1–3, 2–4.</p>
          <table class="t"><tr><th>đỉnh</th><th>nối với</th><th>bậc</th></tr>
          <tr><td>1</td><td>2, 4, 3</td><td>3 (lẻ)</td></tr>
          <tr><td>2</td><td>1, 3, 4</td><td>3 (lẻ)</td></tr>
          <tr><td>3</td><td>2, 4, 5, 1</td><td>4</td></tr>
          <tr><td>4</td><td>3, 1, 5, 2</td><td>4</td></tr>
          <tr><td>5</td><td>4, 3</td><td>2</td></tr></table>
        focus: [1, 1, ["2.2", "2.3"], ["2.4", "2.5", "2.6"], 2]
        say: "Bậc ở trên được đếm thế nào? Ta đọc danh sách tám cạnh và ghi mỗi đỉnh nối với những đỉnh nào. Đỉnh 1 nối với 2, 4, 3, nên bậc 3, và đỉnh 2 nối với 1, 3, 4, cũng bậc 3. Đỉnh 3 và đỉnh 4 mỗi đỉnh nối với bốn đỉnh, còn đỉnh 5 chỉ nối với 4 và 3, nên có bậc 2. Vậy đúng hai đỉnh lẻ là 1 và 2, như đã nói."
      - clear: true
        show: |
          <div class="row"><div class="col"><svg width="520" height="380" viewBox="0 0 520 380"><path d="M130,340 Q260,340 390,340" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="221" cy="340" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="221" y="348" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">8</text><path d="M390,340 Q390,255 390,170" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="390" cy="280" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="390" y="288" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">5</text><path d="M390,170 Q260,170 130,170" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="299" cy="170" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="299" y="178" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">6</text><path d="M130,170 Q130,255 130,340" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="130" cy="230" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="130" y="238" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">7</text><path d="M130,170 Q195,110 260,50" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="176" cy="128" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="176" y="136" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">3</text><path d="M260,50 Q325,110 390,170" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="306" cy="92" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="306" y="100" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">2</text><path d="M130,340 Q260,255 390,170" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="221" cy="280" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="221" y="288" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">1</text><path d="M390,340 Q260,255 130,170" fill="none" stroke="#6b7280" stroke-width="5"/><circle cx="299" cy="280" r="17" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="299" y="288" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">4</text><circle cx="130" cy="340" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="130" y="351" font-size="30" text-anchor="middle">1</text><circle cx="390" cy="340" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="390" y="351" font-size="30" text-anchor="middle">2</text><circle cx="390" cy="170" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="390" y="181" font-size="30" text-anchor="middle">3</text><circle cx="130" cy="170" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="130" y="181" font-size="30" text-anchor="middle">4</text><circle cx="260" cy="50" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="260" y="61" font-size="30" text-anchor="middle">5</text></svg></div>
          <div class="col"><p>Một đường: $1 - 3 - 5 - 4 - 2 - 3 - 4 - 1 - 2$.</p>
          <p class="note">Số thứ tự trên mỗi cạnh là lượt đi; 8 cạnh, mỗi cạnh đúng một lần ✓ (máy kiểm).</p></div></div>
        focus: ["1.2", "1.2"]
        say: "Một đường đi như vậy là 1, 3, 5, 4, 2, 3, 4, 1, rồi 2. Số thứ tự trên mỗi cạnh là lượt đi, đủ 8 cạnh, mỗi cạnh đúng một lần, máy đã kiểm."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "3 + 3 + 4 + 4 + 2 == 16 == 2 * 8"
      - "(lambda w: [(w[0] == v) + (w[-1] == v) + 2 * w[1:-1].count(v) for v in range(1, 6)] == [3, 3, 4, 4, 2] and [w[1:-1].count(v) for v in range(1, 6)] == [1, 1, 2, 2, 1])([1, 3, 5, 4, 2, 3, 4, 1, 2])"
    steps:
      - show: |
          <ol><li>Tổng bậc phải bằng hai lần số cạnh — phong bì: $3 + 3 + 4 + 4 + 2 = 16 = 2 \times 8$ ✓</li>
          <li>Số đỉnh bậc lẻ phải chẵn; đếm được số lẻ đỉnh lẻ là đã đếm sai bậc.</li>
          <li>Đường đi tìm được: đếm số cạnh trong đường phải bằng $m$, không cạnh nào lặp.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, tổng bậc phải bằng hai lần số cạnh vì mỗi cạnh có hai đầu, phong bì có tổng bậc 16, đúng hai lần 8. Hai, số đỉnh bậc lẻ phải chẵn, đếm ra một số lẻ đỉnh lẻ là đã đếm sai bậc. Ba, đường đi tìm được phải có đúng m cạnh, không cạnh nào lặp lại."
      - clear: true
        show: |
          <p><b>Đường khác — đọc bậc ngược từ chính đường đi</b> $1 - 3 - 5 - 4 - 2 - 3 - 4 - 1 - 2$: mỗi lần đi <b>qua</b> một đỉnh dùng 2 cạnh, đầu và cuối đường dùng 1 cạnh.</p>
          <table class="t"><tr><th>đỉnh</th><th>đầu/cuối</th><th>số lần đi qua</th><th>bậc</th></tr>
          <tr><td>1</td><td>đầu: 1</td><td>1 lần: 2</td><td>1 + 2 = 3 ✓</td></tr>
          <tr><td>2</td><td>cuối: 1</td><td>1 lần: 2</td><td>1 + 2 = 3 ✓</td></tr>
          <tr><td>3</td><td>0</td><td>2 lần: 4</td><td>4 ✓</td></tr>
          <tr><td>4</td><td>0</td><td>2 lần: 4</td><td>4 ✓</td></tr>
          <tr><td>5</td><td>0</td><td>1 lần: 2</td><td>2 ✓</td></tr></table>
        focus: [1, 1, ["2.2", "2.3"], ["2.4", "2.5", "2.6"]]
        say: "Còn một cách kiểm bằng đường khác, đọc ngược bậc từ chính đường đi vừa tìm, không nhìn danh sách cạnh. Mỗi lần đi qua một đỉnh ta dùng hai cạnh, còn đỉnh đầu và đỉnh cuối của đường chỉ dùng một cạnh. Đỉnh 1 là đầu đường và được đi qua một lần, nên bậc 1 cộng 2 bằng 3, đỉnh 2 là cuối đường cũng vậy. Đỉnh 3 và đỉnh 4 được đi qua hai lần nên bậc 4, đỉnh 5 được đi qua một lần nên bậc 2, khớp với bảng đếm từ danh sách cạnh."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "3 + 3 == 6 and all(d % 2 == 0 for d in [2, 2, 2, 2, 2, 2])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lẫn đường đi Euler với đường đi Hamilton <b class="red">(sai)</b>
          <br><span class="note">Euler: qua mọi <b>cạnh</b> một lần — kiểm bằng bậc, rất dễ. Hamilton: qua mọi <b>đỉnh</b> một lần — chưa ai biết cách kiểm nhanh cho mọi đồ thị.</span></div>
        say: "Lỗi thứ nhất, lẫn đường đi qua mọi cạnh với đường đi qua mọi đỉnh. Qua mọi cạnh một lần thì kiểm bằng bậc, rất dễ. Qua mọi đỉnh một lần là bài toán khác hẳn, chưa ai biết cách kiểm nhanh cho mọi đồ thị."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên điều kiện liên thông <b class="red">(sai)</b>
          <br><span class="note">Hai tam giác rời nhau: mọi đỉnh bậc 2 (chẵn) nhưng không có chu trình qua cả 6 cạnh.</span></div>
          <table class="t"><tr><th>tam giác</th><th>đỉnh</th><th>bậc</th><th>số cạnh</th></tr>
          <tr><td>thứ nhất</td><td>a, b, c</td><td>2, 2, 2</td><td>3</td></tr>
          <tr><td>thứ hai</td><td>x, y, z</td><td>2, 2, 2</td><td>3</td></tr></table>
        focus: [1, 2, 2]
        say: "Lỗi thứ hai, quên điều kiện liên thông. Hai tam giác rời nhau có mọi đỉnh bậc 2, đều chẵn, nhưng không có chu trình nào đi qua cả sáu cạnh. Lý do là đang ở tam giác thứ nhất thì không có cạnh nào dẫn sang tam giác thứ hai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bắt đầu đường đi Euler ở một đỉnh bậc chẵn khi có 2 đỉnh lẻ <b class="red">(sai)</b>
          <br><span class="note">Khi có đúng 2 đỉnh lẻ, đường đi <b>buộc</b> bắt đầu ở một đỉnh lẻ và kết thúc ở đỉnh lẻ kia.</span></div>
        say: "Lỗi thứ ba, bắt đầu ở một đỉnh bậc chẵn khi đồ thị có hai đỉnh lẻ. Khi đó đường đi buộc phải bắt đầu ở một đỉnh lẻ và kết thúc ở đỉnh lẻ kia."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đếm bậc mà quên cạnh lặp <b class="red">(sai)</b>
          <br><span class="note">A nối C bằng 2 cầu thì góp 2 vào bậc của A — không phải 1.</span></div>
        say: "Lỗi thứ tư, đếm bậc mà quên các cạnh lặp. Đỉnh A nối với C bằng hai cầu thì góp 2 vào bậc của A, không phải 1."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[sorted(__import__('collections').Counter([x for e in __import__('itertools').combinations(range(n), 2) for x in e]).values()) for n in (4, 5)] == [[3] * 4, [4] * 5]"
      - "len(list(__import__('itertools').combinations(range(5), 2))) == 10"
      - "4 - 1 == 3 and 3 * 4 == 12 == 2 * 6 and 5 - 1 == 4 and 5 * 4 // 2 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đồ thị đầy đủ 4 đỉnh (mọi cặp đỉnh nối nhau một cạnh) có chu trình Euler không?</td></tr>
          <tr><td>2</td><td>Còn đồ thị đầy đủ 5 đỉnh?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, đồ thị đầy đủ 4 đỉnh, nghĩa là mọi cặp đỉnh nối nhau bằng một cạnh, có chu trình Euler không? Câu hai, còn đồ thị đầy đủ 5 đỉnh thì sao? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — bậc: mỗi đỉnh nối với $4 - 1 = 3$ đỉnh còn lại.</p>
          <table class="t"><tr><th>đỉnh</th><th>a</th><th>b</th><th>c</th><th>d</th><th>tổng</th></tr>
          <tr><td>bậc</td><td>3</td><td>3</td><td>3</td><td>3</td><td>$12 = 2 \times 6$ cạnh</td></tr></table>
          <p><b>Bước 2</b> — đếm đỉnh lẻ: cả 4 đỉnh lẻ, mà 4 đỉnh lẻ thì theo định lý $\implies$ <b>không</b> có chu trình, cũng không có đường đi Euler.</p>
        focus: [1, 2, 3, 3]
        say: "Đáp án câu một, bước một, tính bậc, mỗi đỉnh nối với 4 trừ 1, bằng 3 đỉnh còn lại, nên có bậc 3. Kiểm bằng bổ đề bắt tay, tổng bậc 12, bằng 2 nhân 6 cạnh, khớp với sáu cái bắt tay của bốn người lúc đầu bài. Bước hai, đếm đỉnh lẻ, cả bốn đỉnh đều lẻ. Theo định lý, có từ bốn đỉnh lẻ trở lên thì không có chu trình, cũng không có đường đi nào qua mỗi cạnh đúng một lần."
      - show: |
          <p>② Mỗi đỉnh nối với $5 - 1 = 4$ đỉnh: bậc 4, chẵn; số cạnh $\frac{5 \times 4}{2} = 10$; đồ thị liên thông $\implies$ <b>có</b> chu trình Euler qua cả 10 cạnh.</p>
        say: "Câu hai, mỗi đỉnh có bậc 4, là số chẵn. Lý do là mỗi đỉnh nối với 5 trừ 1, bằng 4 đỉnh còn lại. Số cạnh bằng 5 nhân 4 chia 2, bằng 10, vì mỗi cạnh được đếm ở cả hai đầu. Đồ thị lại liên thông, nên có chu trình Euler đi qua cả 10 cạnh."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bậc: số đầu cạnh chạm đỉnh</span><span class="a">→</span>
          <span class="n">tổng bậc $= 2m$</span><span class="a">→</span>
          <span class="n">0 đỉnh lẻ: chu trình; 2 đỉnh lẻ: đường đi</span><span class="a">→</span>
          <span class="n">qua mọi cạnh khác qua mọi đỉnh</span></div>
        say: "Tổng kết lại, bậc là số đầu cạnh chạm vào đỉnh, và tổng các bậc bằng hai lần số cạnh. Đồ thị liên thông không có đỉnh lẻ thì có chu trình Euler, có đúng hai đỉnh lẻ thì có đường đi Euler. Và nhớ rằng đi qua mọi cạnh khác hẳn đi qua mọi đỉnh."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi tìm kiếm vét cạn, hãy tìm một <b>bất biến</b> đếm được (ở đây là tính chẵn lẻ của bậc) — nó có thể trả lời ngay là “không thể”.</div>
        say: "Điều cần mang theo, trước khi tìm kiếm vét cạn, hãy tìm một đại lượng đếm được không đổi, ở đây là tính chẵn lẻ của bậc, nó có thể trả lời ngay rằng không thể."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 17): <b>cây</b> — đồ thị liên thông không có chu trình, vì sao luôn có $n - 1$ cạnh, và đếm số cây có nhãn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 17, ta học cây, đồ thị liên thông không có chu trình, vì sao nó luôn có n trừ 1 cạnh, và cách đếm số cây có nhãn. Hẹn gặp bạn ở bài tiếp theo."
