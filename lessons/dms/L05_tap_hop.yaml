  - {sentence: "Ba, tập lũy thừa phải có đủ 2 mũ n tập, đừng quên tập rỗng và chính A.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
