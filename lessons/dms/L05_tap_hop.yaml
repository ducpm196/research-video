        <p><b>Kết quả mong đợi</b></p><div class="code"><div>hop: 1 2 3 5 7 9 11 13</div><div>giao: 3 5 7 11</div><div>A bo B: 2 13</div><div>B bo A: 1 9</div><div>so tap con cua A: 64</div><div>chia het cho 4 hoac 6, tu 1 den 1000: dem=333 congthuc=333</div></div><p class="note">Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b>. Chấm bằng Git Bash: <code>bash labs/cham.sh DMS L05 taphop.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>DMS L05 taphop.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
      focus:
      - 2
      - 2
      - 3
      - 3
      say: 'Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng với màn hình. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
    - clear: true
      show: |
        <div class="box key"><b>Nếu kẹt:</b> Python có sẵn <code>A | B</code> (hợp), <code>A &amp; B</code> (giao), <code>A - B</code> (hiệu). Số tập con là $2^{|A|}$. Số chia hết cho 4 và 6 cùng lúc là số chia hết cho bội chung nhỏ nhất của chúng, tức 12 (chứ không phải 24), nên công thức là <code>n // 4 + n // 6 - n // 12</code>. Lời giải ở <code>labs/DMS/L05/loi_giai.py</code> — chỉ mở sau khi đã thử.</div><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>A | B, A &amp; B, A - B</code></td><td>hợp, giao, hiệu của hai tập</td><td>{1, 2} | {2, 3} là {1, 2, 3}; {1, 2} & {2, 3} là {2}; {1, 2} - {2, 3} là {1}</td></tr><tr><td><code>n // 4 + n // 6 - n // 12</code></td><td><code>//</code> là chia lấy phần nguyên, bỏ phần lẻ</td><td>n = 24: 6 + 4 - 2 = 8 số chia hết cho 4 hoặc 6</td></tr></table>
      focus:
