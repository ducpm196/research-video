      say: Bây giờ tới phần bạn tự làm. Với hai tập cho sẵn, hãy viết chương trình in hợp, giao và hai hiệu của chúng, rồi số tập con của tập đầu. Sau đó đếm các số từ một đến một nghìn chia hết cho 4 hoặc 6, bằng vòng lặp và bằng bao hàm loại trừ. Định dạng sáu dòng nằm trong thư mục thực hành. Hãy dừng video và tự làm.
    - clear: true
