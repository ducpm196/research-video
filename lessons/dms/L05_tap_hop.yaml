        <p><b>Đề</b>: với $A = \{2, 3, 5, 7, 11, 13\}$ và $B = \{1, 3, 5, 7, 9, 11\}$, viết <code>taphop.py</code> in hợp, giao, hai hiệu, số tập con của $A$, và số từ 1 đến 1 000 chia hết cho 4 hoặc 6 (đếm bằng vòng lặp và bằng bao hàm–loại trừ). Sáu dòng, định dạng ở <code>labs/DMS/L05/de.md</code>.</p><p class="note">Số liệu khác ví dụ trong bài. Để ý: bội chung nhỏ nhất của 4 và 6, tức số nhỏ nhất chia hết cho cả hai, là 12, không phải 24.</p>
      focus:
      - 1
      - 1
      - 1
      - 1
      - 0
