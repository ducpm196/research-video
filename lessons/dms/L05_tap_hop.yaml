      - 1
      - 1
      - '2.2'
      - '2.3'
      say: Nếu kẹt, ngôn ngữ lập trình có sẵn các phép hợp, giao và hiệu cho tập. Số tập con là hai mũ số phần tử. Số chia hết cho cả 4 và 6 là số chia hết cho bội chung nhỏ nhất của chúng, là 12 chứ không phải 24. Nên công thức là n chia 4, cộng n chia 6, trừ n chia 12, mỗi phép lấy phần nguyên. Lời giải nằm trong thư mục thực hành, và bạn chỉ nên mở sau khi đã thử. Dấu gạch đứng, dấu và, dấu trừ nối hai tập lần lượt cho hợp, giao và hiệu. Hai dấu gạch chéo là chia lấy phần nguyên, nên cả công thức cho số bội của 4 hoặc 6 mà không cần duyệt.
