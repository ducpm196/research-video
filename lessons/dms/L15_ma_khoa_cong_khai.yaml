id: L15
course: DMS
series: "DMS · Toán rời rạc"
title: "Bài 15 — RSA trên số nhỏ: khoá công khai từ số học mô-đun"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dms.yaml L15; audit/verify_plan_curricula.py DMS:L15; R. Rivest, A. Shamir, L. Adleman (1978), “A Method for Obtaining Digital Signatures and Public-Key Cryptosystems”; K. Rosen, mục 4.6"
assumes: [equiv, mod, gcd, integers, naturals, in, implies, dots]
# Quy ước: tên “RSA” chỉ hiện trên màn hình (probe p1: mọi cách viết ≤ 5/8) — lời đọc nói “hệ mã khoá công khai”.
#   Tích (p − 1)(q − 1) viết là L (không dùng φ — sổ chung đã dùng φ cho nghĩa khác; không dùng T — x mũ T trùng ký hiệu chuyển vị).
#   Bản tin x, bản mã y. Dấu nhân: × (cả bài).
objectives:
  - "Sinh khoá, mã hoá, giải mã một hệ mã khoá công khai trên số nhỏ"
  - "Giải thích vì sao giải mã trả lại đúng bản tin"
  - "Giải thích vì sao độ an toàn dựa vào độ khó phân tích thừa số"
asr_reviewed:
  - {sentence: "Theo định lý Fermat nhỏ áp cho cả p và q, x mũ L đồng dư 1, nên chỉ còn lại x, và máy đã kiểm mọi bản tin từ 0 đến 32.", reason: "Fermat đọc “Phéc-ma” (lexicon DMS, probe p1_ten 8/8 khi khoá nhận “phét ma”); ASR không phân biệt âm cuối c/t — chép “phét ma”, cùng âm"}
  - {sentence: "Một, e nhân d chia cho L phải dư 1.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Mã hoá là lũy thừa e, giải mã là lũy thừa d, đều lấy dư cho n.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bước ba, tìm d là nghịch đảo của 3 theo mô-đun 20.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bước một, chọn p bằng 3, q bằng 11, nên n bằng 33, còn L bằng 2 nhân 10, bằng 20.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Gửi bí mật cho người chưa từng gặp"
    steps:
      - show: |
          <p>Bạn muốn gửi số thẻ cho một trang bán hàng chưa từng gặp, qua một mạng mà ai cũng nghe lén được. Hai bên chưa có khoá bí mật chung nào.</p>
          <div class="box key">Ý tưởng <b>khoá công khai</b>: người nhận phát cho cả thế giới một “ổ khoá mở sẵn” — ai cũng khoá được, nhưng chỉ người giữ chìa mới mở được.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, bạn muốn gửi số thẻ cho một trang bán hàng chưa từng gặp, qua một mạng mà ai cũng nghe lén được. Hai bên chưa có khoá bí mật chung nào. Ý tưởng của khoá công khai là người nhận phát cho cả thế giới một ổ khoá mở sẵn, ai cũng khoá được, nhưng chỉ người giữ chìa mới mở được."
      - show: |
          <p>Hệ mã RSA (Rivest, Shamir, Adleman, 1978) dựng ổ khoá đó bằng đúng các công cụ của bài 13 và 14. Hôm nay làm bằng tay trên số nhỏ.</p>
        say: "Hệ mã khoá công khai nổi tiếng nhất, công bố năm 1978, dựng ổ khoá đó bằng đúng các công cụ của bài 13 và 14, là số dư, nghịch đảo và lũy thừa nhanh. Hôm nay ta làm bằng tay trên số nhỏ."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số nguyên tố, nghịch đảo, số dư âm"
    checks:
      - "[k for k in range(2, 14) if all(k % j for j in range(2, k))] == [2, 3, 5, 7, 11, 13] and 33 == 3 * 11"
      - "(3 * 5) % 7 == 1 and 15 == 2 * 7 + 1 and [b for b in range(1, 20) if (3 * b) % 20 == 1] == [7] and 21 == 20 + 1"
      - "(31 - (-2)) % 33 == 0 and 31 - (-2) == 33 and (32 - (-1)) == 33"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>các ước</th><th>loại</th></tr>
          <tr><td>11</td><td>1, 11</td><td>nguyên tố</td></tr>
          <tr><td>33</td><td>1, 3, 11, 33</td><td>hợp số: $33 = 3 \times 11$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn ba việc. Số nguyên tố là số lớn hơn 1 chỉ chia hết cho 1 và chính nó, ví dụ 11 chỉ có hai ước là 1 và 11. Còn 33 có thêm hai ước 3 và 11, nên là hợp số, bằng 3 nhân 11."
      - clear: true
        show: |
          <table class="t"><tr><th>tìm</th><th>thử nhân</th><th>kết quả</th></tr>
          <tr><td>nghịch đảo của 3 theo mô-đun 7</td><td>$3 \times 5 = 15 = 2 \times 7 + 1$</td><td>5</td></tr>
          <tr><td>nghịch đảo của 3 theo mô-đun 20</td><td>$3 \times 7 = 21 = 20 + 1$</td><td>7</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Việc thứ hai, ở bài 14 ta đã học nghịch đảo của a theo mô-đun n, là số b sao cho a nhân b chia n dư 1. Nghịch đảo của 3 theo mô-đun 7 là 5, vì 3 nhân 5 bằng 15, chia 7 dư 1. Nghịch đảo của 3 theo mô-đun 20 là 7, vì 3 nhân 7 bằng 21, chia 20 dư 1."
      - clear: true
        show: |
          <table class="t"><tr><th>đồng dư</th><th>lý do: hiệu chia hết cho 33</th></tr>
          <tr><td>$31 \equiv -2 \pmod{33}$</td><td>$31 - (-2) = 33$</td></tr>
          <tr><td>$32 \equiv -1 \pmod{33}$</td><td>$32 - (-1) = 33$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Việc thứ ba, một số gần n có thể thay bằng một số âm nhỏ, vì hai số đồng dư khi hiệu của chúng chia hết cho n. Ba mươi mốt đồng dư âm 2 theo mô-đun 33, vì 31 trừ âm 2 bằng 33. Tương tự, 32 đồng dư âm 1, và số âm nhỏ thì lũy thừa dễ hơn nhiều."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: các con số của một bộ khoá"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>công khai?</th></tr>
          <tr><td>$p, q$</td><td>hai số nguyên tố bí mật</td><td>không</td></tr>
          <tr><td>$n = p \times q$</td><td>mô-đun</td><td>có</td></tr>
          <tr><td>$L = (p - 1)(q - 1)$</td><td>dùng để tính khoá</td><td>không</td></tr>
          <tr><td>$e$</td><td>số mũ mã hoá, $\gcd(e, L) = 1$</td><td>có</td></tr>
          <tr><td>$d$</td><td>số mũ giải mã: nghịch đảo của $e$ theo mô-đun $L$</td><td>không — đây là “chìa”</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Một bộ khoá gồm các con số sau. Chữ p và q là hai số nguyên tố giữ bí mật. Chữ n bằng p nhân q là mô-đun, công bố cho mọi người. Chữ L bằng p trừ 1 nhân q trừ 1, chỉ dùng để tính khoá và giữ bí mật. Số mũ mã hoá e có ước chung 1 với L, và được công bố. Số mũ giải mã d là nghịch đảo của e theo mô-đun L, đó chính là chiếc chìa, phải giữ bí mật."

  # ───────────────────────── 3. SINH KHOÁ ─────────────────────────
  - id: keygen
    kind: concept
    title: "Sinh khoá với p = 3, q = 11"
    checks:
      - "3 * 11 == 33 and (3 - 1) * (11 - 1) == 20"
      - "__import__('math').gcd(3, 20) == 1 and (3 * 7) % 20 == 1 and pow(3, -1, 20) == 7"
    steps:
      - show: |
          <p>① $p = 3$, $q = 11$ $\implies n = 33$, $\; L = 2 \times 10 = 20$.</p>
          <p>② Chọn $e = 3$: $\gcd(3, 20) = 1$ ✓</p>
          <p>③ $d$: nghịch đảo của 3 theo mô-đun 20. $3 \times 7 = 21 = 20 + 1$ $\implies d = 7$.</p>
          <div class="box key">Khoá công khai: $(n, e) = (33, 3)$. &nbsp; Khoá bí mật: $d = 7$.</div>
        focus: [1, 2, 3, 3, 4]
        say: "Bước một, chọn p bằng 3, q bằng 11, nên n bằng 33, còn L bằng 2 nhân 10, bằng 20. Bước hai, chọn e bằng 3, vì ước chung của 3 và 20 bằng 1. Bước ba, tìm d là nghịch đảo của 3 theo mô-đun 20. Ba nhân bảy bằng 21, chia 20 dư 1, nên d bằng 7. Vậy khoá công khai là cặp 33 và 3, còn khoá bí mật là số 7."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bản tin đi đâu, ai cầm khoá nào"
    checks:
      - "pow(4, 3, 33) == 31 and 4 ** 3 == 64 and pow(31, 7, 33) == 4 and 3 * 11 == 33"
    steps:
      - show: |
          <div><svg width="1340" height="410" viewBox="0 0 1340 410"><defs><marker id="ah15" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#6b7280"/></marker></defs><rect x="20" y="90" width="170" height="100" rx="12" fill="#f9fafb" stroke="#1f2937" stroke-width="3"/><text x="105" y="128" font-size="24" text-anchor="middle" font-weight="700" fill="#1f2937">bản tin</text><text x="105" y="162" font-size="21" text-anchor="middle" fill="#1f2937">x = 4</text><line x1="190" y1="140" x2="245" y2="140" stroke="#6b7280" stroke-width="3" marker-end="url(#ah15)"/><rect x="250" y="90" width="260" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="380" y="128" font-size="24" text-anchor="middle" font-weight="700" fill="#2563eb">mã hoá</text><text x="380" y="162" font-size="21" text-anchor="middle" fill="#1f2937">4 mũ 3 = 64, dư 31</text><line x1="510" y1="140" x2="565" y2="140" stroke="#6b7280" stroke-width="3" marker-end="url(#ah15)"/><rect x="570" y="90" width="200" height="100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="3"/><text x="670" y="128" font-size="24" text-anchor="middle" font-weight="700" fill="#b45309">bản mã</text><text x="670" y="162" font-size="21" text-anchor="middle" fill="#1f2937">y = 31</text><line x1="770" y1="140" x2="825" y2="140" stroke="#6b7280" stroke-width="3" marker-end="url(#ah15)"/><rect x="830" y="90" width="280" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="970" y="128" font-size="24" text-anchor="middle" font-weight="700" fill="#15803d">giải mã</text><text x="970" y="162" font-size="21" text-anchor="middle" fill="#1f2937">31 mũ 7, dư 4</text><line x1="1110" y1="140" x2="1165" y2="140" stroke="#6b7280" stroke-width="3" marker-end="url(#ah15)"/><rect x="1170" y="90" width="150" height="100" rx="12" fill="#f9fafb" stroke="#1f2937" stroke-width="3"/><text x="1245" y="128" font-size="24" text-anchor="middle" font-weight="700" fill="#1f2937">nhận</text><text x="1245" y="162" font-size="21" text-anchor="middle" fill="#1f2937">x = 4</text><text x="380" y="235" font-size="21" text-anchor="middle" fill="#2563eb">dùng khoá công khai</text><text x="380" y="263" font-size="21" text-anchor="middle" fill="#2563eb">n = 33, e = 3: ai cũng có</text><text x="970" y="235" font-size="21" text-anchor="middle" fill="#15803d">dùng khoá bí mật d = 7</text><text x="970" y="263" font-size="21" text-anchor="middle" fill="#15803d">chỉ người nhận có</text><rect x="440" y="300" width="460" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/><text x="670" y="336" font-size="22" text-anchor="middle" fill="#dc2626">kẻ nghe lén thấy: 33, 3 và 31</text><text x="670" y="370" font-size="22" text-anchor="middle" fill="#dc2626">thiếu 7, vì không biết 33 = 3 × 11</text><line x1="670" y1="190" x2="670" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 6"/></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy bản tin đi đâu và ai cầm khoá nào. Người gửi lấy bản tin 4, dùng khoá công khai 33 và 3 để tính 4 mũ 3, bằng 64, chia 33 dư 31, rồi gửi 31 qua mạng. Kẻ nghe lén thấy cả 33, 3 và 31, nhưng thiếu số 7, vì muốn tính ra 7 phải biết 33 bằng 3 nhân 11. Chỉ người nhận giữ số 7, tính 31 mũ 7 rồi lấy dư cho 33, và nhận lại đúng bản tin 4."

  # ───────────────────────── 4. VÍ DỤ: MÃ HOÁ, GIẢI MÃ ─────────────────────────
  - id: example
    kind: example
    title: "Mã hoá 4, giải mã lại"
    checks:
      - "4 ** 3 == 64 and 64 % 33 == 31 == pow(4, 3, 33)"
      - "31 % 33 == (-2) % 33 and (-2) ** 7 == -128 and (-128) % 33 == 4 == pow(31, 7, 33)"
      - "4 * 4 * 4 == 64 == 1 * 33 + 31 and 4 * 33 == 132 and -128 + 132 == 4"
    steps:
      - show: |
          <p><b>Bước 1 — mã hoá</b> (ai cũng làm được, chỉ cần $n, e$): bản tin $x = 4$, tính $x^e = 4^3 = 4 \times 4 \times 4 = 64$.</p>
        say: "Bước một, mã hoá thì ai cũng làm được, chỉ cần n và e. Bản tin x bằng 4, ta tính 4 mũ 3, bằng 4 nhân 4 nhân 4, bằng 64."
      - show: |
          <p><b>Bước 2 — lấy dư cho $n$:</b> $64 = 1 \times 33 + 31$, nên bản mã $y = 64 \bmod 33 = \hl{31}$.</p>
        say: "Bước hai, lấy dư cho n bằng 33. Vì 64 bằng 33 cộng 31, nên bản mã là 31, và đó là con số được gửi đi."
      - show: |
          <p><b>Bước 3 — giải mã</b> (cần $d = 7$): tính $31^7 \bmod 33$. Vì $31 \equiv -2$, nên $31^7 \equiv (-2)^7 = -128$.</p>
        say: "Bước ba, giải mã thì cần d bằng 7, ta tính 31 mũ 7 rồi lấy dư cho 33. Mẹo nhỏ, 31 đồng dư âm 2, nên 31 mũ 7 đồng dư âm 2 mũ 7, bằng âm 128."
      - show: |
          <p><b>Bước 4 — đưa về số dư từ 0 đến 32:</b> cộng thêm bội của 33.</p>
          $$-128 + 4 \times 33 = -128 + 132 = \hl{4} = x$$
        focus: [1, 2]
        say: "Bước bốn, số dư phải nằm trong khoảng từ 0 đến 32, nên ta cộng thêm bội của 33. Âm 128 cộng 4 lần 33, tức cộng 132, được đúng 4, bản tin ban đầu."

  # ───────────────────────── 5. VÌ SAO ĐÚNG, VÌ SAO AN TOÀN ─────────────────────────
  - id: why
    kind: concept
    title: "Vì sao giải mã đúng, vì sao khó phá"
    checks:
      - "all(pow(pow(x, 3, 33), 7, 33) == x for x in range(33))"
      - "3 * 7 == 21 == 1 * 20 + 1"
      - "[k for k in range(2, 33) if 33 % k == 0] == [3, 11]"
    steps:
      - show: |
          <p><b>Vì sao đúng</b>: $e \times d = 21 = 1 + L$, nên $x^{ed} = x \times x^{L}$. Theo Fermat nhỏ áp cho cả $p$ và $q$, $x^L$ đồng dư 1 (khi $x$ có ước chung 1 với $n$), nên còn lại $x$.</p>
          <p class="note">Máy kiểm: giải mã trả đúng <b>mọi</b> bản tin $x$ từ 0 đến 32 ✓</p>
          <p><b>Vì sao khó phá</b>: muốn có $d$ phải biết $L$, tức phải biết $p, q$ — phải <b>phân tích</b> $n$ ra thừa số. Với $n = 33$ thì tức khắc; với $n$ dài 2048 chữ số nhị phân thì chưa ai biết cách làm trong thời gian chấp nhận được.</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Vì sao giải mã đúng? Vì e nhân d bằng 21, bằng 1 cộng L, nên x mũ e d bằng x nhân x mũ L. Theo định lý Fermat nhỏ áp cho cả p và q, x mũ L đồng dư 1, nên chỉ còn lại x, và máy đã kiểm mọi bản tin từ 0 đến 32. Vì sao khó phá? Muốn có d phải biết L, tức là phải phân tích n ra hai thừa số nguyên tố. Với n bằng 33 thì tức khắc, nhưng với n dài 2048 chữ số nhị phân thì chưa ai biết cách làm trong thời gian chấp nhận được."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm một bộ khoá"
    checks:
      - "(3 * 7) % 20 == 1 and pow(pow(4, 3, 33), 7, 33) == 4"
      - "31 ** 2 == 961 == 29 * 33 + 4 and pow(31, 4, 33) == 16 and 16 * 4 * 31 == 1984 == 60 * 33 + 4 and 7 == 4 + 2 + 1"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>kết quả</th></tr>
          <tr><td>$e \times d$ chia cho $L$ phải dư 1</td><td>$21 = 20 + 1$ ✓</td></tr>
          <tr><td>Mã hoá rồi giải mã vài bản tin phải ra lại chính nó</td><td>4 mã thành 31, giải lại thành 4 ✓</td></tr>
          <tr><td>Bản tin phải nhỏ hơn $n$</td><td>số dư chỉ phân biệt 0 đến $n - 1$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm một bộ khoá bằng ba cách. Một, e nhân d chia cho L phải dư 1. Hai, mã hoá rồi giải mã vài bản tin phải ra lại chính nó, như 4 thành 31 rồi về 4. Ba, bản tin phải nhỏ hơn n, vì số dư chỉ phân biệt được các số từ 0 đến n trừ 1."
      - clear: true
        show: |
          <p><b>Đường khác — giải mã $31^7 \bmod 33$ bằng bình phương liên tiếp</b>, không dùng mẹo số âm. Viết $7 = 4 + 2 + 1$:</p>
          <table class="t"><tr><th>lũy thừa</th><th>tính</th><th>dư cho 33</th></tr>
          <tr><td>$31^2$</td><td>$961 = 29 \times 33 + 4$</td><td>4</td></tr>
          <tr><td>$31^4$</td><td>$4 \times 4 = 16$</td><td>16</td></tr></table>
          $$31^7 = 31^4 \times 31^2 \times 31 \equiv 16 \times 4 \times 31 = 1984 = 60 \times 33 + 4 \equiv \hl{4}$$
        focus: [1, "2.2", "2.3", 3]
        say: "Kiểm bước giải mã bằng một đường khác, bình phương liên tiếp như bài 14, không dùng mẹo số âm. Ba mươi mốt bình phương bằng 961, bằng 29 lần 33 cộng 4, nên dư 4. Bình phương tiếp, 4 nhân 4 bằng 16, nên 31 mũ 4 dư 16. Vì 7 bằng 4 cộng 2 cộng 1, ta nhân 16 nhân 4 nhân 31, được 1984, bằng 60 lần 33 cộng 4, nên dư 4, khớp với kết quả trước."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "__import__('math').gcd(3, 33) == 3"
      - "[pow(x, 3, 33) for x in range(5)] == [0, 1, 8, 27, 31]"
      - "37 % 33 == 4 and pow(37, 3, 33) == pow(4, 3, 33)"
      - "37 ** 3 == 50653 and 50653 % 33 == 31 and pow(31, 7, 33) == 4"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tìm nghịch đảo của $e$ theo mô-đun $n$ <b class="red">(sai)</b>
          <br><span class="note">Phải theo mô-đun $L = 20$. Theo mô-đun 33, số 3 thậm chí không có nghịch đảo ($\gcd(3, 33) = 3$).</span></div>
        say: "Lỗi thứ nhất, tìm nghịch đảo của e theo mô-đun n. Phải tìm theo mô-đun L bằng 20, còn theo mô-đun 33 thì số 3 thậm chí không có nghịch đảo, vì ước chung của 3 và 33 là 3."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn $e$ có ước chung với $L$ <b class="red">(sai)</b>
          <br><span class="note">Khi đó không có $d$ — không giải mã được. Luôn kiểm $\gcd(e, L) = 1$.</span></div>
        say: "Lỗi thứ hai, chọn e có ước chung lớn hơn 1 với L. Khi đó không có d, không giải mã được, nên luôn kiểm ước chung của e và L bằng 1."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng hệ mã “sách giáo khoa” này cho dữ liệu thật <b class="red">(không an toàn)</b>
          <br><span class="note">Cùng bản tin luôn ra cùng bản mã: với $n = 33$, kẻ nghe lén chỉ cần mã hoá thử 0, 1, 2, … rồi so. Hệ thật dùng khoá ≥ 2048 chữ số nhị phân và thêm phần đệm ngẫu nhiên.</span></div>
        say: "Lỗi thứ ba, dùng phiên bản sách giáo khoa này cho dữ liệu thật. Cùng một bản tin luôn ra cùng một bản mã, nên kẻ nghe lén chỉ cần mã hoá thử mọi bản tin rồi so. Hệ thật dùng khoá rất dài và thêm phần đệm ngẫu nhiên trước khi mã hoá."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Mã hoá bản tin lớn hơn hoặc bằng $n$ <b class="red">(sai)</b>
          <br><span class="note">$x = 37$ và $x = 4$ cho cùng bản mã vì $37 \equiv 4 \pmod{33}$ — giải mã chỉ trả về 4.</span></div>
          <table class="t"><tr><th>bản tin</th><th>lũy thừa 3</th><th>dư cho 33</th><th>giải mã ra</th></tr>
          <tr><td>4</td><td>64</td><td>31</td><td>4</td></tr>
          <tr><td>37</td><td>50653</td><td>31</td><td>4, mất bản tin 37</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ tư, mã hoá bản tin lớn hơn hoặc bằng n. Bản tin 37 và 4 cho cùng bản mã, vì 37 đồng dư 4 theo mô-đun 33, nên giải mã chỉ trả về 4."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "5 * 11 == 55 and 4 * 10 == 40 and __import__('math').gcd(3, 40) == 1"
      - "(3 * 27) % 40 == 1 and pow(3, -1, 40) == 27"
      - "pow(2, 3, 55) == 8 and pow(8, 27, 55) == 2"
      - "27 == 16 + 8 + 2 + 1 and [pow(8, 2 ** i, 55) for i in range(5)] == [8, 9, 26, 16, 36] and 36 * 16 == 576 and 576 % 55 == 26 and 26 * 9 == 234 and 234 % 55 == 14 and 14 * 8 == 112 and 112 % 55 == 2 and 81 == 2 * 40 + 1"
    steps:
      - show: |
          <p>Với $p = 5$, $q = 11$, $e = 3$:</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $n$, $L$ và khoá bí mật $d$.</td></tr>
          <tr><td>2</td><td>Mã hoá bản tin $x = 2$, rồi giải mã lại.</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với p bằng 5, q bằng 11 và e bằng 3. Câu một, tính n, L và khoá bí mật d. Câu hai, mã hoá bản tin 2, rồi giải mã lại. Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① $n = 5 \times 11 = 55$, $L = 4 \times 10 = 40$.</p>
          $$3 \times 27 = 81 = 2 \times 40 + 1 \implies d = \hl{27}$$
        focus: [1, 2, 2]
        say: "Đáp án câu một, n bằng 5 nhân 11, bằng 55, và L bằng 4 nhân 10, bằng 40. Ta cần tìm số d sao cho 3 nhân d, khi chia cho 40, có số dư bằng 1. Ba nhân 27 bằng 81, bằng 2 lần 40 cộng 1, nên d bằng 27."
      - clear: true
        show: |
          <p>② Mã: $y = 2^3 = 8$. Giải: $8^{27} \bmod 55$, viết $27 = 16 + 8 + 2 + 1$ và bình phương liên tiếp:</p>
          <table class="t"><tr><th>lũy thừa</th><th>$8^1$</th><th>$8^2$</th><th>$8^4$</th><th>$8^8$</th><th>$8^{16}$</th></tr>
          <tr><td>dư cho 55</td><td>8</td><td>9</td><td>26</td><td>16</td><td>36</td></tr></table>
          <p>$36 \times 16 = 576 \equiv 26$; &nbsp; $26 \times 9 = 234 \equiv 14$; &nbsp; $14 \times 8 = 112 \equiv \hl{2}$ ✓</p>
        focus: [1, 1, 2, 3, 3]
        say: "Câu hai, bản mã là 2 mũ 3 bằng 8. Giải mã cần 8 mũ 27 chia 55, ta viết 27 bằng 16 cộng 8 cộng 2 cộng 1. Bình phương liên tiếp và lấy dư mỗi bước, được 8, 9, 26, 16, 36. Nhân dần các số dư ứng với mũ 16, 8, 2 và 1, mỗi lần lấy dư, được 26, rồi 14, rồi 2. Vậy giải mã trả lại đúng bản tin 2."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$n = pq$, $L = (p - 1)(q - 1)$</span><span class="a">→</span>
          <span class="n">$d$: nghịch đảo của $e$ theo $L$</span><span class="a">→</span>
          <span class="n">mã: $x^e$, giải: $y^d$ (mod $n$)</span><span class="a">→</span>
          <span class="n">an toàn nhờ khó phân tích $n$</span></div>
        say: "Tổng kết lại, n bằng p nhân q, L bằng p trừ 1 nhân q trừ 1. Khoá bí mật d là nghịch đảo của e theo mô-đun L. Mã hoá là lũy thừa e, giải mã là lũy thừa d, đều lấy dư cho n. Độ an toàn dựa vào việc phân tích n ra thừa số là rất khó."
      - show: |
          <div class="box key"><b>Tư duy:</b> mật mã thật không phải tự chế. Hiểu toán để biết giới hạn, còn khi viết phần mềm thì dùng thư viện đã được kiểm định.</div>
        say: "Điều cần mang theo, mật mã thật không phải thứ để tự chế. Hiểu toán để biết giới hạn của nó, còn khi viết phần mềm thì dùng thư viện đã được kiểm định."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 16): <b>đồ thị</b> — bậc, bổ đề bắt tay, và đường đi qua mọi cạnh đúng một lần.</p>
        forward_ref: true
        say: "Ở bài sau, bài 16, ta chuyển sang đồ thị, với bậc của đỉnh, bổ đề bắt tay, và đường đi qua mọi cạnh đúng một lần. Hẹn gặp bạn ở bài tiếp theo."
