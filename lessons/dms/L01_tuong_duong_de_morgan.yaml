  - {sentence: "Luật De Morgan, phủ định đổi và thành hoặc, đổi hoặc thành và.", reason: "De Morgan đọc “Đơ Mo-gần” (lexicon_vi.DMS.yaml, probe p1_ten 8/8, đối chứng 0/8); ASR chép “đơ mô gần/đơ Morgan”, cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một lỗi lọt qua cửa soát vé"
    checks:
      - "(not (True and False)) == True and ((not True) and (not False)) == False"
    steps:
      - show: |
          <div class="code"><div>// chặn người KHÔNG đủ điều kiện vào cửa</div>
          <div>if (!(du_tuoi &amp;&amp; co_ve)) chan();</div></div>
          <p>Một bạn “viết lại cho gọn” thành:</p>
          <div class="code"><div>if (!du_tuoi &amp;&amp; !co_ve) chan();</div></div>
        focus: ["1.2", 3, 3]
        say: "Chào bạn, đoạn mã này chặn người không đủ điều kiện vào cửa, tức là không đúng khi vừa đủ tuổi vừa có vé. Một bạn viết lại cho gọn, chặn khi không đủ tuổi và không có vé. Nghe thì giống nhau, phải không?"
      - show: |
          <div class="box warn">Người <b>đủ tuổi nhưng không có vé</b>: cách viết đầu chặn, bản “gọn” cho vào. Hai điều kiện <b>không</b> cùng nghĩa.</div>
        say: "Nhưng thử một người đủ tuổi mà không có vé. Cách viết đầu chặn người đó, còn bản viết lại thì cho vào. Hôm nay ta học cách biến đổi điều kiện mà chắc chắn không đổi nghĩa."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bốn phép toán của bài 0, và phủ định một so sánh"
    checks:
      - "(lambda p, q: [not p, p and q, p or q, (not p) or q] == [False, False, True, False])(3 > 2, 5 < 1)"
      - "[(x > 0) for x in (-1, 0, 1)] == [False, False, True] and [(x <= 0) for x in (-1, 0, 1)] == [True, True, False]"
    steps:
      - show: |
          <p>Ôn bài 0 bằng hai mệnh đề có số: $p$: “3 &gt; 2” (Đ), $q$: “5 &lt; 1” (S).</p>
          <table class="t"><tr><th>$\neg p$</th><th>$p \land q$</th><th>$p \lor q$</th><th>$p \to q$</th></tr>
          <tr><td>S</td><td>S</td><td>Đ</td><td>S</td></tr></table>
        focus: [1, "2.1", "2.2", "2.2", "2.2"]
        say: "Trước khi vào bài, ta ôn lại bốn phép toán đã học ở bài 0, bằng hai mệnh đề có số, p là 3 lớn hơn 2, đúng, và q là 5 nhỏ hơn 1, sai. Không p đổi đúng thành sai. P và q sai, vì q sai. P hoặc q đúng, vì chỉ cần p đúng. P kéo theo q sai, vì đây đúng là trường hợp vế đầu đúng mà vế sau sai."
      - clear: true
        show: |
          <p>Phủ định một so sánh: “$x \gt 0$” sai ở đâu thì phủ định của nó đúng ở đó — kể cả <b>điểm biên</b> $x = 0$.</p>
          <table class="t"><tr><th>$x$</th><th>âm 1</th><th>0</th><th>1</th></tr>
          <tr><td>$x \gt 0$</td><td>S</td><td>S</td><td>Đ</td></tr>
          <tr><td>không ($x \gt 0$), tức $x \le 0$</td><td>Đ</td><td>Đ</td><td>S</td></tr></table>
        focus: [1, "2.2", "2.3", 1]
        say: "Việc thứ hai cần ôn là phủ định một phép so sánh. Với x bằng âm 1, 0 và 1, câu x lớn hơn 0 lần lượt sai, sai, đúng. Phủ định đảo cả ba, thành đúng, đúng, sai, đó chính là x nhỏ hơn hoặc bằng 0. Để ý điểm biên x bằng 0 thuộc về phần phủ định, vì 0 không lớn hơn 0."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_equiv
    kind: symbol
    title: "Giải mã: tương đương lôgic ≡"
    checks:
      - "[(not (a and b)) == ((not a) and (not b)) for a in (True, False) for b in (True, False)] == [True, False, False, True] and all(((not p) or q) == (q if p else True) for p in (True, False) for q in (True, False))"
    steps:
      - show: |
          <div class="box key">$A \equiv B$ (đọc “A tương đương B”): hai biểu thức có <b>cùng chân trị ở mọi dòng</b> của bảng chân trị.</div>
        introduces: [equiv]
        say: "Ký hiệu gồm ba gạch ngang xếp chồng lên nhau, đọc là tương đương. A tương đương B nghĩa là hai biểu thức có cùng chân trị ở mọi dòng của bảng chân trị, không sót dòng nào."
      - show: |
          <p>So với bài 0: $p \leftrightarrow q$ là một <b>phép toán</b>, cho ra Đ hoặc S ở từng dòng.</p>
          <p>Còn $A \equiv B$ là một <b>khẳng định về hai biểu thức</b>: nó đúng khi $A \leftrightarrow B$ cho Đ ở <b>mọi</b> dòng.</p>
        focus: [1, 2]
        say: "Ở bài 0, mũi tên hai chiều là một phép toán, cho ra đúng hoặc sai ở từng dòng. Còn dấu tương đương là một khẳng định về hai biểu thức, nó đúng khi mũi tên hai chiều cho đúng ở mọi dòng."

  # ───────────────────────── 3. KHÁI NIỆM: KIỂM BẰNG BẢNG ─────────────────────────
  - id: by_table
    kind: concept
    title: "Chứng minh tương đương bằng bảng chân trị"
    checks:
      - "[((not p) or q) for p in (True, False) for q in (True, False)] == [True, False, True, True]"
    steps:
      - show: |
          <p>Kiểm $p \to q \equiv \neg p \lor q$:</p>
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$p \to q$</th><th>$\neg p$</th><th>$\neg p \lor q$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td></tr>
          <tr><td>Đ</td><td>S</td><td>S</td><td>S</td><td>S</td></tr>
          <tr><td>S</td><td>Đ</td><td>Đ</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>S</td><td>S</td><td>Đ</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [1, "2.1", ["2.2", "2.3", "2.4", "2.5"]]
        say: "Ví dụ, ta kiểm p kéo theo q tương đương với không p hoặc q. Lập bảng có đủ bốn dòng, cột kéo theo lấy từ bài 0, rồi tính cột không p, và cột không p hoặc q. So hai cột, ở cả bốn dòng đều là đúng, sai, đúng, đúng, nên hai biểu thức tương đương."
      - show: |
          <div class="box ok">Chứng minh tương đương = lập bảng đủ $2^n$ dòng và so hai cột. <b>Chỉ một dòng khác</b> là không tương đương.</div>
        say: "Vậy muốn chứng minh tương đương, ta lập bảng đủ 2 mũ n dòng rồi so hai cột. Chỉ cần một dòng khác nhau là hai biểu thức không tương đương."

  # ───────────────────────── 4. LUẬT DE MORGAN ─────────────────────────
  - id: demorgan
    kind: concept
    title: "Luật De Morgan: phủ định đổi “và” thành “hoặc”"
    checks:
      - "[(not (p and q)) for p in (True, False) for q in (True, False)] == [False, True, True, True]"
      - "[((not p) or (not q)) for p in (True, False) for q in (True, False)] == [False, True, True, True]"
      - "all((not (p or q)) == ((not p) and (not q)) for p in (True, False) for q in (True, False))"
    steps:
      - show: |
          <div class="box key">$\neg(p \land q) \equiv \neg p \lor \neg q$ &nbsp;&nbsp;và&nbsp;&nbsp; $\neg(p \lor q) \equiv \neg p \land \neg q$</div>
        say: "Luật De Morgan có hai vế. Phủ định của p và q tương đương với không p hoặc không q. Phủ định của p hoặc q tương đương với không p và không q."
      - show: |
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$p \land q$</th><th>$\neg(p \land q)$</th><th>$\neg p \lor \neg q$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>S</td><td>S</td></tr>
          <tr><td>Đ</td><td>S</td><td>S</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>S</td><td>S</td><td>S</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [0, "1.2", ["1.3", "1.4", "1.5"]]
        say: "Ta kiểm vế thứ nhất của luật bằng bảng chân trị. Dòng đầu, p và q cùng đúng, nên phủ định của nó sai, và không p hoặc không q cũng sai vì cả hai vế đều sai. Ba dòng còn lại, có ít nhất một bên sai, nên cả hai cột đều đúng."
      - show: |
          <p>Đọc bằng lời: “<b>không</b> (đủ tuổi <b>và</b> có vé)” = “<b>không</b> đủ tuổi <b>hoặc</b> <b>không</b> có vé”.</p>
          <p class="note">Vế thứ hai kiểm y hệt; máy đã kiểm đủ 4 dòng cho cả hai vế.</p>
        focus: [1, 2]
        say: "Đọc bằng lời, không vừa đủ tuổi vừa có vé, nghĩa là thiếu tuổi hoặc thiếu vé, chỉ cần thiếu một trong hai. Vế thứ hai kiểm y hệt, máy đã kiểm đủ bốn dòng cho cả hai vế."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn loại người ở cửa: thấy De Morgan bằng mắt"
    checks:
      - "sum(1 for a in (True, False) for b in (True, False) if not (a and b)) == 3 and sum(1 for a in (True, False) for b in (True, False) if (not a) and (not b)) == 1"
    steps:
      - show: |
          <div><svg width="1420" height="330" viewBox="0 0 1420 330"><rect x="300" y="70" width="300" height="120" fill="#dcfce7" stroke="#6b7280" stroke-width="2"/><text x="450" y="138" font-size="24" text-anchor="middle" fill="#15803d">cho vào</text><rect x="600" y="70" width="300" height="120" fill="#fee2e2" stroke="#6b7280" stroke-width="2"/><text x="750" y="138" font-size="24" text-anchor="middle" fill="#b91c1c">bị chặn: thiếu vé</text><rect x="300" y="190" width="300" height="120" fill="#fee2e2" stroke="#6b7280" stroke-width="2"/><text x="450" y="258" font-size="24" text-anchor="middle" fill="#b91c1c">bị chặn: thiếu tuổi</text><rect x="600" y="190" width="300" height="120" fill="#fee2e2" stroke="#6b7280" stroke-width="2"/><text x="750" y="258" font-size="24" text-anchor="middle" fill="#b91c1c">bị chặn: thiếu cả hai</text><rect x="606" y="196" width="288" height="108" fill="none" stroke="#ea580c" stroke-width="5" stroke-dasharray="12 6"/><text x="750" y="106" font-size="21" text-anchor="middle" fill="#ea580c" font-weight="700">bản gọn cho lọt ô này</text><text x="450" y="56" font-size="24" text-anchor="middle">có vé</text><text x="750" y="56" font-size="24" text-anchor="middle">không vé</text><text x="284" y="138" font-size="24" text-anchor="end">đủ tuổi</text><text x="284" y="258" font-size="24" text-anchor="end">thiếu tuổi</text><text x="940" y="120" font-size="24" fill="#b91c1c">Cần chặn: 3 ô đỏ</text><text x="940" y="154" font-size="22" fill="#b91c1c">= thiếu tuổi HOẶC thiếu vé</text><text x="940" y="230" font-size="24" fill="#ea580c">Bản gọn chặn: 1 ô viền cam</text><text x="940" y="264" font-size="22" fill="#ea580c">= thiếu tuổi VÀ thiếu vé</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này chia mọi người ở cửa thành bốn ô, theo đủ tuổi hay thiếu tuổi, có vé hay không vé. Chỉ ô xanh ở góc trên trái được vào, ba ô đỏ còn lại phải bị chặn, và ba ô đó chính là thiếu tuổi hoặc thiếu vé, đúng như luật De Morgan nói. Bản viết gọn ở đầu bài là thiếu tuổi và thiếu vé, nên chỉ chặn một ô có viền cam. Vì vậy ô đủ tuổi mà không có vé bị cho lọt, đó là lỗi ta gặp ở đầu bài."

  # ───────────────────────── 5. VÍ DỤ: PHỦ ĐỊNH ĐIỀU KIỆN TRONG MÃ ─────────────────────────
  - id: example
    kind: example
    title: "Phủ định một điều kiện có khoảng giá trị"
    checks:
      - "all((not (0 < x and x < 10)) == (x <= 0 or x >= 10) for x in range(-50, 51))"
      - "[(not (0 < x < 10)) for x in (-1, 5, 10)] == [True, False, True]"
    steps:
      - show: |
          <p>Trong mã: <code>!</code> là không, <code>&amp;&amp;</code> là và, <code>||</code> là hoặc.</p>
          <div class="code"><div>if (!(x &gt; 0 &amp;&amp; x &lt; 10))   // x KHÔNG nằm trong khoảng (0; 10)</div></div>
        focus: [1, 2]
        say: "Trong nhiều ngôn ngữ lập trình, dấu chấm than là không, hai dấu và là và, hai gạch đứng là hoặc. Điều kiện này đúng khi x không nằm trong khoảng từ 0 đến 10."
      - show: |
          <p>① De Morgan: $\neg(x > 0 \land x < 10) \equiv \neg(x > 0) \lor \neg(x < 10)$</p>
          <p>② Phủ định từng so sánh: $\neg(x > 0)$ là $x \le 0$; &nbsp; $\neg(x < 10)$ là $x \ge 10$.</p>
          <div class="code"><div>if (x &lt;= 0 || x &gt;= 10)</div></div>
        focus: [1, 2, 3]
        say: "Bước một, theo De Morgan, phủ định của và thành hoặc của hai phủ định. Bước hai, phủ định từng phép so sánh, không lớn hơn 0 là nhỏ hơn hoặc bằng 0, không nhỏ hơn 10 là lớn hơn hoặc bằng 10. Ta được điều kiện mới, x nhỏ hơn hoặc bằng 0, hoặc x lớn hơn hoặc bằng 10."
      - show: |
          <table class="t"><tr><th>$x$</th><th>điều kiện đầu</th><th>điều kiện mới</th></tr>
          <tr><td>âm 1</td><td>Đ</td><td>Đ</td></tr><tr><td>5</td><td>S</td><td>S</td></tr><tr><td>10</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [0, ["1.2", "1.3", "1.4"]]
        say: "Làm thử ngay bằng số. Với x bằng âm 1, 5 và 10, hai điều kiện cho cùng kết quả, đúng, sai, đúng, và máy đã kiểm mọi số nguyên từ âm 50 đến 50."

  # ───────────────────────── 6. ĐẢO VÀ PHẢN ĐẢO ─────────────────────────
  - id: contrapositive
    kind: concept
    title: "Đảo và phản đảo của p → q"
    checks:
      - "all(((not p) or q) == (q or (not p)) for p in (True, False) for q in (True, False))"
      - "[((not q) or p) for p in (True, False) for q in (True, False)] == [True, True, False, True]"
    steps:
      - show: |
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$p \to q$</th><th>đảo: $q \to p$</th><th>phản đảo: $\neg q \to \neg p$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>Đ</td><td>S</td><td>S</td><td>Đ</td><td>S</td></tr>
          <tr><td>S</td><td>Đ</td><td>Đ</td><td>$\hl{\text{S}}$</td><td>Đ</td></tr>
          <tr><td>S</td><td>S</td><td>Đ</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [0, "1.4", ["1.2", "1.3", "1.5"]]
        say: "Từ p kéo theo q, ta có thể đảo hai vế thành q kéo theo p, gọi là mệnh đề đảo. Hoặc vừa đảo vừa phủ định cả hai, thành không q kéo theo không p, gọi là phản đảo. Ở dòng p sai, q đúng, mệnh đề đảo cho sai, còn phản đảo luôn trùng với mệnh đề gốc ở cả bốn dòng."
      - show: |
          <div class="box key">$p \to q \equiv \neg q \to \neg p$ (phản đảo). Còn $p \to q$ và $q \to p$ (đảo) <b>không</b> tương đương.</div>
          <p class="note">“Nếu mưa thì đường ướt” cũng chính là “nếu đường khô thì không mưa”. Còn “nếu đường ướt thì mưa” có thể sai: đường ướt vì xe tưới.</p>
        focus: [1, 2, 2]
        say: "Vậy kéo theo luôn tương đương với phản đảo, nhưng không tương đương với đảo. Nếu mưa thì đường ướt, cũng là nếu đường khô thì trời không mưa. Còn nếu đường ướt thì trời mưa có thể sai, vì đường có thể ướt do xe tưới."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: thử giá trị ở biên"
    checks:
      - "[(not (0 < x < 10)) == (x <= 0 or x >= 10) for x in (0, 10)] == [True, True]"
      - "[(not (0 < x < 10)) == (x < 0 or x > 10) for x in (0, 10)] == [False, False]"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: biểu thức lôgic có $n$ biến thì máy lập đủ $2^n$ dòng và so hai cột — làm được ngay trong vài dòng mã.</p>
          <p><b>Phép thử 2</b>: điều kiện có so sánh thì thử đúng <b>giá trị ở biên</b>: $x = 0$ và $x = 10$.</p>
          <p class="note">Viết nhầm $x \lt 0 \lor x \gt 10$ thì cả $x = 0$ và $x = 10$ cho kết quả khác điều kiện đầu.</p>
        focus: [0, 1, 2, 3]
        say: "Tự kiểm hai cách. Một, biểu thức có n biến thì cho máy lập đủ 2 mũ n dòng và so hai cột. Hai, điều kiện có phép so sánh thì thử ngay các giá trị ở biên, như x bằng 0 và x bằng 10. Nếu viết nhầm thành nhỏ hơn 0 hoặc lớn hơn 10, cả hai giá trị biên đều cho kết quả sai, vì số ở biên bị xếp nhầm phía."
      - clear: true
        show: |
          <p>Thử thẳng hai giá trị biên, không dùng luật nào:</p>
          <table class="t"><tr><th>$x$</th><th>điều kiện đầu: không ($0 \lt x \lt 10$)</th><th>$x \le 0 \lor x \ge 10$</th><th>bản nhầm $x \lt 0 \lor x \gt 10$</th></tr>
          <tr><td>0</td><td>Đ</td><td>Đ</td><td>$\hl{\text{S}}$</td></tr>
          <tr><td>10</td><td>Đ</td><td>Đ</td><td>$\hl{\text{S}}$</td></tr></table>
        focus: [1, "2.2", "2.3", 2]
        say: "Bây giờ ta thử thẳng hai giá trị biên, không dùng luật nào cả. Với x bằng 0, số 0 không nằm giữa 0 và 10, nên điều kiện đầu đúng, bản đúng cũng cho đúng, còn bản nhầm cho sai. Với x bằng 10 cũng vậy, vì 10 không nhỏ hơn 10. Hai giá trị biên đủ để bắt bản viết nhầm."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "sum(((not p) or q) == ((not q) or p) for p in (True, False) for q in (True, False)) == 2"
      - "sum((not p) or q for p in (True, False) for q in (True, False)) == 3 and sum((not q) or p for p in (True, False) for q in (True, False)) == 3"
      - "[((not p) or q) == ((not q) or p) for p in (True, False) for q in (True, False)] == [True, False, False, True]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Viết $\neg(p \land q)$ thành $\neg p \land \neg q$ <b class="red">(sai)</b>
          <br><span class="note">Phủ định đổi “và” thành “hoặc”. Dòng (Đ, S) cho hai kết quả khác nhau — đúng là lỗi ở đầu bài.</span></div>
        say: "Lỗi thứ nhất, phủ định của p và q mà vẫn giữ chữ và. Phủ định phải đổi và thành hoặc, và dòng p đúng, q sai cho hai kết quả khác nhau, đúng là lỗi ở đầu bài."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Phủ định của $x \lt 10$ là $x \gt 10$ <b class="red">(sai)</b>
          <br><span class="note">Phủ định đúng là $x \ge 10$: số 10 không nhỏ hơn 10, nên phải thuộc phần phủ định.</span></div>
        say: "Lỗi thứ hai, phủ định của x nhỏ hơn 10 là x lớn hơn 10. Sai, vì số 10 không nhỏ hơn 10, nên phủ định đúng là x lớn hơn hoặc bằng 10."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chứng minh được mệnh đề đảo là xong <b class="red">(sai)</b>
          <br><span class="note">Đảo không tương đương mệnh đề gốc. Muốn đổi cách chứng minh, dùng <b>phản đảo</b>.</span></div>
        say: "Lỗi thứ ba, chứng minh được mệnh đề đảo rồi coi như đã chứng minh mệnh đề gốc. Đảo không tương đương với gốc, muốn đổi cách chứng minh thì phải dùng phản đảo."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Thử vài dòng thấy giống là kết luận tương đương <b class="red">(sai)</b>
          <br><span class="note">$p \to q$ và $q \to p$ mỗi bên đều đúng ở 3 trên 4 dòng, trùng nhau ở dòng đầu và dòng cuối, mà vẫn không tương đương. Phải đủ mọi dòng.</span></div>
          <table class="t"><tr><th>$(p, q)$</th><th>(Đ, Đ)</th><th>(Đ, S)</th><th>(S, Đ)</th><th>(S, S)</th></tr>
          <tr><td>$p \to q$</td><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>$q \to p$</td><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td></tr></table>
        focus: [1, 2, 2]
        say: "Lỗi thứ tư, thử vài dòng thấy giống nhau rồi kết luận tương đương. Kéo theo và đảo của nó mỗi bên đều đúng ở ba trên bốn dòng, và trùng nhau ở dòng đầu, dòng cuối. Thế mà hai dòng giữa lại khác nhau, nên chúng không tương đương, và ta phải kiểm đủ mọi dòng."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all((not (x >= 0 or y % 2 == 0)) == (x < 0 and y % 2 == 1) for x in range(-5, 6) for y in range(-5, 6))"
      - "[(not ((not q) or p)) for p in (True, False) for q in (True, False)] == [False, False, True, False]"
      - "(lambda c: c(-1, 3) is False and c(2, 3) is True)(lambda x, y: x >= 0 or y % 2 == 0) and (lambda d: d(-1, 3) and not d(2, 3))(lambda x, y: x < 0 and y % 2 != 0)"
      - "6 % 2 == 0 and 6 == 2 * 3 and 6 % 4 == 2 and 6 == 4 * 1 + 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phủ định điều kiện <code>x &gt;= 0 || y % 2 == 0</code> (x không âm hoặc y chẵn).</td></tr>
          <tr><td>2</td><td>Câu “nếu $n$ chia hết cho 4 thì $n$ chẵn” có phản đảo là gì? Đảo của nó có đúng không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, phủ định điều kiện x không âm hoặc y chẵn. Câu hai, câu nếu n chia hết cho 4 thì n chẵn có phản đảo là gì, và mệnh đề đảo của nó có đúng không? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — De Morgan: phủ định của “hoặc” là “và” của hai phủ định.</p>
          <p><b>Bước 2</b> — phủ định từng vế: không ($x \ge 0$) là $x \lt 0$; không (y chẵn) là y lẻ.</p>
          <div class="code"><div>x &lt; 0 &amp;&amp; y % 2 != 0     // x âm VÀ y lẻ</div></div>
        focus: [1, 2, 3]
        say: "Đáp án câu một, bước một, theo De Morgan, phủ định của hoặc là và của hai phủ định. Bước hai, phủ định từng vế, không lớn hơn hoặc bằng 0 là nhỏ hơn 0, không chẵn là lẻ. Ta được điều kiện x âm và y lẻ."
      - show: |
          <table class="t"><tr><th>$(x, y)$</th><th>điều kiện gốc</th><th>phủ định đúng phải là</th><th>x âm và y lẻ</th></tr>
          <tr><td>(âm 1, 3)</td><td>S</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>(2, 3)</td><td>Đ</td><td>S</td><td>S</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Thử lại bằng số để chắc chắn. Với x bằng âm 1, y bằng 3, điều kiện gốc sai, vì x âm và y lẻ, nên phủ định phải đúng, và x âm và y lẻ cho đúng. Với x bằng 2, y bằng 3, điều kiện gốc đúng vì x không âm, nên phủ định phải sai, và kết quả của ta cũng sai."
      - clear: true
        show: |
          <p>② Phản đảo: “nếu $n$ lẻ thì $n$ không chia hết cho 4” — đúng, như câu gốc.</p>
          <p>&nbsp;&nbsp;&nbsp;Đảo: “nếu $n$ chẵn thì $n$ chia hết cho 4” — <b>sai</b>, vì $n = 6$.</p>
          <table class="t"><tr><th>$n$</th><th>chẵn?</th><th>chia hết cho 4?</th></tr>
          <tr><td>6</td><td>Đ ($6 = 2 \times 3$)</td><td>S ($6 = 4 \times 1 + 2$)</td></tr></table>
        focus: [1, 2, 3]
        say: "Câu hai, phản đảo là nếu n lẻ thì n không chia hết cho 4, đúng như câu gốc, vì phản đảo luôn tương đương với gốc. Còn đảo là nếu n chẵn thì chia hết cho 4, sai. Một phản ví dụ là 6, chẵn vì bằng 2 nhân 3, nhưng chia 4 còn dư 2."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$A \equiv B$: cùng chân trị mọi dòng</span><span class="a">→</span>
          <span class="n">$p \to q \equiv \neg p \lor q$</span><span class="a">→</span>
          <span class="n">De Morgan: phủ định đổi “và” thành “hoặc” (và ngược lại)</span><span class="a">→</span>
          <span class="n">phản đảo $\equiv$ gốc; đảo thì không</span></div>
        say: "Tổng kết lại, hai biểu thức tương đương khi cùng chân trị ở mọi dòng. Kéo theo tương đương với không p hoặc q. Luật De Morgan, phủ định đổi và thành hoặc, đổi hoặc thành và. Phản đảo tương đương với mệnh đề gốc, còn đảo thì không."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi lần “viết lại cho gọn” một điều kiện, hãy kiểm bằng bảng hoặc bằng giá trị ở biên — đừng tin vào cảm giác “nghe giống nhau”.</div>
        say: "Điều cần mang theo, mỗi lần viết lại cho gọn một điều kiện, hãy kiểm bằng bảng chân trị hoặc bằng giá trị ở biên, đừng tin vào cảm giác nghe giống nhau."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>lượng từ “với mọi”, “tồn tại”</b> — nói về cả một tập giá trị cùng lúc, và cách phủ định chúng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học các câu nói về cả một tập giá trị cùng lúc, như với mọi số và tồn tại một số, cùng cách phủ định chúng. Hẹn gặp bạn ở bài tiếp theo."
