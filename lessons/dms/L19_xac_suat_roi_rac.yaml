/><line x1="1315" y1="165" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1200" y2="280" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="280" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="280" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="280" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1119" y1="246" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1119" y1="246" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1085" y1="165" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><circle cx="1200" cy="50" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1281" cy="84" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1315" cy="165" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1281" cy="246" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1200" cy="280" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1119" cy="246" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1085" cy="165" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1119" cy="84" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1200" y="322" font-size="26" text-anchor="middle">8 người: <tspan fill="#c2410c" font-weight="700">28 cặp</tspan></text></svg></div>
          <p>Mỗi đường cam là một <b>cặp</b> — một cơ hội trùng ngày sinh. 23 người có $\binom{23}{2} = 253$ cặp, hơn 10 lần số người.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Hình này cho thấy vì sao trực giác về ngày sinh hay sai. Mỗi chấm xanh là một người, mỗi đường cam nối hai người là một cặp, tức một cơ hội để trùng ngày sinh. Bốn người có 6 cặp, sáu người có 15 cặp, tám người đã có 28 cặp, số người tăng đều mà số cặp tăng vọt. Với 23 người, số cặp là 253, hơn 10 lần số người. Người đoán 6 phần trăm đã nghĩ theo số người, trong khi cần nghĩ theo số cặp."

  # ───────────────────────── 4. VÍ DỤ: NGÀY SINH ─────────────────────────
  - id: example
    kind: example
    title: "Tính xác suất trùng ngày sinh"
    checks:
      - "365 - 22 == 343 and round(364 / 365, 5) == 0.99726 and round(363 / 365, 5) == 0.99452"
      - "round(364 * 363 / 365 ** 2, 4) == 0.9918 and round((1 - 364 * 363 / 365 ** 2) * 100, 2) == 0.82"
      - "__import__('math').comb(23, 2) == 253 and round(253 / 365, 3) == 0.693"
      - "round(__import__('math').prod((365 - k) / 365 for k in range(23)), 4) == 0.4927"
      - "min(n for n in range(1, 100) if 1 - __import__('math').prod((365 - k) / 365 for k in range(n)) >= 0.5) == 23"
    steps:
      - show: |
          <p><b>Bước 1 — mỗi người phải tránh bao nhiêu ngày</b> (để không ai trùng ai):</p>
          <table class="t"><tr><th>người thứ</th><th>ngày đã có người</th><th>ngày còn trống</th><th>tỉ số</th></tr>
          <tr><td>1</td><td>0</td><td>365</td><td>$\frac{365}{365} = 1$</td></tr>
          <tr><td>2</td><td>1</td><td>364</td><td>$\frac{364}{365} \approx 0{,}99726$</td></tr>
          <tr><td>3</td><td>2</td><td>363</td><td>$\frac{363}{365} \approx 0{,}99452$</td></tr>
          <tr><td>23</td><td>22</td><td>$365 - 22 = 343$</td><td>$\frac{343}{365}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước một, xem mỗi người phải tránh bao nhiêu ngày để không ai trùng ai. Người thứ nhất sinh ngày nào cũng được, tỉ số là 1. Người thứ hai phải tránh một ngày đã có người, còn 364 ngày trống, tỉ số khoảng 0 phẩy 99726. Người thứ ba tránh hai ngày, còn 363 ngày, tỉ số khoảng 0 phẩy 99452. Cứ thế, người thứ 23 phải tránh 22 ngày, chỉ còn 365 trừ 22, bằng 343 ngày."
      - clear: true
        show: |
          <p><b>Bước 2 — nhân thử với 3 người</b>:</p>
          <div>$$1 \times \frac{364}{365} \times \frac{363}{365} \approx 0{,}9918$$</div>
          <p>nên khả năng có trùng $\approx 1 - 0{,}9918 = 0{,}82\%$ — còn rất nhỏ.</p>
        focus: [2, 3]
        say: "Bước hai, nhân thử với 3 người, 1 nhân 364 phần 365 nhân 363 phần 365, được khoảng 0 phẩy 9918. Theo phần bù, khả năng có trùng trong 3 người chỉ khoảng 0 phẩy 82 phần trăm, còn rất nhỏ."
      - clear: true
        show: |
          <p><b>Đếm phần bù</b>: “không ai trùng” — người thứ nhất tuỳ ý, người thứ hai tránh 1 ngày, người thứ ba tránh 2 ngày, …</p>
          <p>$P(\text{không trùng}) = \frac{365}{365} \times \frac{364}{365} \times \dots \times \frac{343}{365} \approx 0{,}4927$ &nbsp; $\implies$ $P(\text{có trùng}) \approx \hl{0{,}5073}$.</p>
          <p class="note">Vì sao lớn vậy: có $\binom{23}{2} = 253$ <b>cặp</b> người, mỗi cặp trùng với xác suất $\frac{1}{365}$. Kỳ vọng số cặp trùng $= \frac{253}{365} \approx 0{,}69$. 23 là số người nhỏ nhất vượt 50% (máy dò).</p>
        focus: [1, 2, 2, 3, 3, 3]
        say: "Ta đếm phần bù, không ai trùng ai. Người thứ nhất sinh ngày nào cũng được, người thứ hai phải tránh 1 ngày, người thứ ba tránh 2 ngày, và cứ thế. Nhân các tỉ số lại được khoảng 0 phẩy 49, nên xác suất có trùng là khoảng 0 phẩy 51. Vì sao lớn như vậy? Vì 23 người tạo ra 253 cặp, mỗi cặp trùng với xác suất 1 phần 365, nên kỳ vọng số cặp trùng là khoảng 0 phẩy 69. Máy dò cũng cho thấy 23 là số người nhỏ nhất làm xác suất vượt 50 phần trăm."

  # ───────────────────────── 5. VA CHẠM BĂM ─────────────────────────
  - id: hashing
    kind: concept
    title: "Va chạm băm: khoảng căn bậc hai của số ô"
    checks:
      - "round((2 * __import__('math').log(2) * 365) ** 0.5, 1) == 22.5"
      - "round((2 * __import__('math').log(2) * 2 ** 32) ** 0.5) == 77163"
      - "__import__('math').comb(20, 2) / 100 == 1.9"
      - "__import__('math').isqrt(2 ** 256) == 2 ** 128"
    steps:
      - show: |
          <p>Băm $n$ khoá vào $m$ ô (giả định hàm băm rải đều): kỳ vọng số <b>cặp va chạm</b> $= \frac{\binom{n}{2}}{m}$.</p>
          <p>Xác suất có va chạm vượt 50% khi $n \approx 1{,}18\sqrt{m}$ ($\sqrt{m}$: số dương có bình phương bằng $m$): &nbsp; $m = 365$ cho khoảng 22,5 người; &nbsp; mã băm 32 bit, tức 32 chữ số nhị phân ($m = 2^{32}$) chỉ cần khoảng <b>77 nghìn</b> khoá.</p>
        focus: [1, 2, 2, 2, 2]
        say: "Băm n khoá vào m ô, với giả định hàm băm rải đều, thì kỳ vọng số cặp va chạm là tổ hợp chập 2 của n chia m. Xác suất có va chạm vượt 50 phần trăm khi n vào khoảng 1 phẩy 18 nhân căn bậc hai của m, tức số dương mà bình phương lên bằng m. Với 365 ngày, đó là khoảng 22 phẩy 5 người, khớp với kết quả trên. Mã băm là con số hàm băm tính ra, dài 32 bit, nghĩa là 32 chữ số nhị phân, nên có hơn bốn tỉ giá trị. Nhưng chỉ cần khoảng 77 nghìn khoá là đã có một nửa khả năng va chạm."
      - show: |
          <div class="box key">Muốn khó tìm va chạm cỡ $2^{128}$ lần thử, mã băm phải dài <b>256 bit</b> (nếu hàm băm không có điểm yếu) — gấp đôi số bit bạn nghĩ.</div>
          <div>$$\sqrt{2^{256}} = 2^{128}$$</div>
        say: "Vì vậy, muốn kẻ tấn công phải thử cỡ 2 mũ 128 lần, mã băm phải dài 256 bit, nếu hàm băm không có điểm yếu, gấp đôi số bit bạn nghĩ."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "__import__('math').comb(23, 2) == 253"
      - "(lambda a: len(a) == 64 == 4 * 4 * 4 and sum(len(set(x)) == 3 for x in a) == 24 == 4 * 3 * 2)(list(__import__('itertools').product(range(4), repeat=3))) and (64 - 24) / 64 == 0.625 == 1 - 4 / 4 * 3 / 4 * 2 / 4"
      - "round((364 / 365) ** 253, 4) == 0.4995 and round(__import__('math').prod((365 - k) / 365 for k in range(23)), 4) == 0.4927"
    steps:
      - show: |
          <ol><li>Xác suất phải nằm trong $[0, 1]$; nếu đếm phần bù, nhớ lấy 1 trừ đi.</li>
          <li>Kỳ vọng số cặp: đếm đúng số <b>cặp</b> $\binom{n}{2}$, không phải $n$.</li>
          <li>Ghi rõ giả định (đều, độc lập) — kết quả chỉ đúng trong giả định đó.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, xác suất phải nằm giữa 0 và 1, và nếu đếm phần bù thì nhớ lấy 1 trừ đi. Hai, khi tính kỳ vọng số cặp, đếm đúng số cặp là tổ hợp chập 2 của n, không phải n. Ba, ghi rõ giả định như rải đều và độc lập, vì kết quả chỉ đúng trong giả định đó."
      - clear: true
        show: |
          <p><b>Đường khác 1 — đếm thẳng một “năm tí hon” 4 ngày</b>, 3 người, rồi so với cách nhân tỉ số:</p>
          <table class="t"><tr><th>cách</th><th>phép tính</th><th>khả năng có trùng</th></tr>
          <tr><td>liệt kê: mọi cách gán ngày</td><td>$4 \times 4 \times 4 = 64$; không trùng: $4 \times 3 \times 2 = 24$</td><td>$\frac{64 - 24}{64} = 0{,}625$</td></tr>
          <tr><td>nhân tỉ số như trên</td><td>$1 - \frac{4}{4} \times \frac{3}{4} \times \frac{2}{4} = 1 - 0{,}375$</td><td>$0{,}625$ ✓</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Bây giờ kiểm cách nhân tỉ số bằng một đường khác, đếm thẳng trên một năm tí hon chỉ có 4 ngày, với 3 người. Mỗi người có 4 lựa chọn, nên có 4 nhân 4 nhân 4, bằng 64 cách gán ngày. Số cách không ai trùng là 4 nhân 3 nhân 2, bằng 24, nên khả năng có trùng là 40 phần 64, bằng 0 phẩy 625. Cách nhân tỉ số cho 1 trừ 0 phẩy 375, cũng bằng 0 phẩy 625, hai đường khớp nhau."
      - show: |
          <p><b>Đường khác 2 — ước lượng theo cặp</b>: coi 253 cặp như 253 lần thử, mỗi lần “không trùng” với khả năng $\frac{364}{365}$:</p>
          <table class="t"><tr><th>cách</th><th>khả năng không ai trùng</th></tr>
          <tr><td>ước lượng theo cặp: $\left(\frac{364}{365}\right)^{253}$</td><td>$\approx 0{,}4995$</td></tr>
          <tr><td>tính đúng: nhân 23 tỉ số</td><td>$\approx 0{,}4927$</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Đường khác thứ hai, ước lượng theo cặp, coi 253 cặp như 253 lần thử, mỗi lần không trùng với khả năng 364 phần 365. Nâng lên mũ 253 được khoảng 0 phẩy 4995. Cách tính đúng cho 0 phẩy 4927. Hai số lệch nhau một chút vì các cặp không hoàn toàn độc lập, nhưng cả hai đều nói khoảng một nửa, nên đáp án 51 phần trăm là hợp lý."
  - id: quymo
    kind: example
    title: 'Khi số ô lớn dần: số khoá để có va chạm chỉ cỡ căn của số ô'
    checks:
    - '[next(n for n, p in enumerate(__import__(''itertools'').accumulate(((m - i) / m for i in range(10 ** 6)), __import__(''operator'').mul), 1) if p <= 0.5) for m in (365, 10 ** 6, 2 ** 32)] == [23, 1178, 77164]'
    - '[round(n / m ** 0.5, 2) for n, m in ((23, 365), (1178, 10 ** 6), (77164, 2 ** 32))] == [1.2, 1.18, 1.18]'
    - '[abs(1.17741 * 2 ** (b / 2) / 1e9 / 31557600 - y) / y < 0.01 for b, y in ((128, 688), (256, 1.27e22))] == [True, True]'
    - round(1.17741 * 2 ** 32 / 1e9, 0) == 5.0
    steps:
    - clear: true
      show: |
        <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for m in (365, 10 ** 6, 2 ** 32):</code></td><td>với mỗi m lần lượt trong ngoặc, làm các dòng thụt vào; <code>**</code> là lũy thừa: <code>10 ** 6</code> là một triệu, <code>2 ** 32</code> là hơn bốn tỉ</td><td>ba lượt: m = 365, rồi 1000000, rồi 4294967296</td></tr><tr><td><code>khong_trung, n = 1.0, 0</code></td><td>một dấu bằng là <b>gán</b>; gán hai giá trị cùng lúc: khong_trung nhận 1.0 (số có phần thập phân, chắc chắn chưa trùng), n nhận 0</td><td>khong_trung = 1.0 là 100%; n = 0 khoá</td></tr><tr><td><code>while khong_trung &gt; 0.5:</code></td><td>lặp lại các dòng thụt vào bên dưới chừng nào khong_trung còn lớn hơn 0.5</td><td>0.51 thì lặp tiếp; 0.49 thì dừng</td></tr></table>
      focus:
      - '1.1'
      - '1.2'
      - '1.3'
      - '1.4'
      say: 'Chương trình tìm số khoá dùng sáu ký hiệu, ta đọc từng cái trước khi chạy. Vòng lặp cho m lần lượt là 365, một triệu, rồi hơn bốn tỉ, trong đó hai dấu sao là lũy thừa. Một dấu bằng là gán hai giá trị cùng lúc: xác suất không trùng bắt đầu bằng 1 chấm 0, số khoá bằng 0. Vòng lặp này chạy chừng nào xác suất không trùng còn lớn hơn 0 chấm 5.'
    - clear: true
      show: |
        <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>khong_trung = khong_trung * (m - n) / m, n = n + 1</code></td><td>nhân với tỉ số ô còn trống (m − n) / m rồi cất lại, rồi tăng n thêm 1; <code>*</code> là nhân, <code>/</code> là chia ra số có phần thập phân</td><td>m = 365, n = 1: 1.0 * 364 / 365 ≈ 0.9973</td></tr><tr><td><code>round(n / m ** 0.5, 2)</code></td><td><code>m ** 0.5</code> là m mũ một nửa, tức căn bậc hai của m; <code>round(x, 2)</code> làm tròn x tới hai chữ số thập phân</td><td>round(1.18321, 2) = 1.18</td></tr><tr><td><code>print(m, &#x27;o: can&#x27;, n, ...)</code></td><td>in chữ trong dấu nháy và các giá trị ra cửa sổ, cách nhau một dấu cách; <code>o</code> là ô, <code>can</code> là cần</td><td>in ra 365 o: can 23 khoa; …</td></tr></table>
      focus:
      - '1.1'
      - '1.2'
      - '1.3'
      - '1.4'
      say: Tiếp theo là các ký hiệu còn lại nữa. Hai dòng này nhân xác suất với tỉ số ô còn trống, dấu sao là nhân, dấu gạch chéo là chia, rồi tăng số khoá thêm một. Hai dấu sao với 0 chấm 5 là căn bậc hai, và hàm làm tròn giữ hai chữ số thập phân. Hàm in đưa chữ trong dấu nháy và các giá trị ra cửa sổ, cách nhau một dấu cách.
    - clear: true
      show: |
        <p><b>Chạy thật</b>: số khoá nhỏ nhất để xác suất có hai khoá cùng ô đạt 50% khi có $m$ ô</p><div class="code"><div>for m in (365, 10 ** 6, 2 ** 32):</div><div>    khong_trung, n = 1.0, 0</div><div>    while khong_trung &gt; 0.5:</div><div>        khong_trung = khong_trung * (m - n) / m</div><div>        n = n + 1</div><div>    print(m, &#x27;o: can&#x27;, n, &#x27;khoa; ti so n / can(m) =&#x27;, round(n / m ** 0.5, 2))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>365 o: can 23 khoa; ti so n / can(m) = 1.2</div><div>1000000 o: can 1178 khoa; ti so n / can(m) = 1.18</div><div>4294967296 o: can 77164 khoa; ti so n / can(m) = 1.18</div></div>
      focus:
      - 2
      - '4.1'
      - '4.2'
      - '4.3'
      - 4
      say: Đây là chương trình chạy thật, dừng khi xác suất không trùng tụt xuống dưới một nửa. Với 365 ngày là 23 người. Với một triệu ô là 1178 khoá. Với hơn bốn tỉ ô là 77164 khoá. Cả ba lần, số khoá gần bằng 1 phẩy 18 nhân căn của số ô.
    - clear: true
      show: |
        <table class="t"><tr><th>mã băm dài $b$ bit ($m = 2^b$ ô)</th><th>số khoá để va chạm đạt 50% ($\approx 1{,}18 \times 2^{b/2}$)</th><th>thử một tỉ khoá mỗi giây (số minh hoạ)</th></tr><tr><td>32</td><td>khoảng 77 000</td><td>chưa tới một phần nghìn giây</td></tr><tr><td>64</td><td>khoảng $5{,}1 \times 10^9$</td><td>khoảng 5 giây</td></tr><tr><td>128</td><td>khoảng $2{,}2 \times 10^{19}$</td><td>khoảng 690 năm</td></tr><tr><td>256</td><td>khoảng $4{,}0 \times 10^{38}$</td><td>khoảng $1{,}3 \times 10^{22}$ năm</td></tr></table><div class="box key">Mỗi lần gấp đôi độ dài bit chỉ <b>bình phương</b> số khoá cần thử. Vì vậy mã băm cần giữ an toàn trước va chạm phải dài <b>gấp đôi</b> mức an toàn mong muốn: muốn khoảng $2^{128}$ phép thử thì dùng 256 bit.</div>
      focus:
      - 1
      - - '1.3'
        - '1.4'
        - '1.5'
      - 2
      say: Bảng này cho thấy số khoá để có va chạm chỉ cỡ căn của số ô. Với 64 bit mất vài giây, với 128 bit khoảng 690 năm, với 256 bit thì không bao giờ xong. Người làm nghề chọn độ dài mã băm gấp đôi mức an toàn mong muốn, đánh đổi bằng mã dài hơn và chậm hơn một chút.


  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "round(1 - (364 / 365) ** 22, 3) == 0.059"
      - "round((1 - __import__('math').prod((365 - k) / 365 for k in range(23))) * 100, 1) == 50.7 and __import__('math').comb(23, 2) == 253"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lẫn “có hai người trùng nhau” với “có người trùng với <b>tôi</b>” <b class="red">(sai)</b>
          <br><span class="note">22 người kia trùng ngày sinh của bạn: chỉ $1 - (\frac{364}{365})^{22} \approx 5{,}9\%$. Còn “hai người bất kỳ trùng” là 51%.</span></div>
          <table class="t"><tr><th>câu hỏi</th><th>số lần so sánh</th><th>khả năng</th></tr>
          <tr><td>có người trùng với <b>tôi</b></td><td>22</td><td>khoảng 5,9%</td></tr>
          <tr><td>có <b>hai người bất kỳ</b> trùng</td><td>253 cặp</td><td>khoảng 50,7%</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, lẫn có hai người trùng nhau với có người trùng ngày sinh của chính mình. Trong 22 người còn lại, khả năng có người trùng ngày sinh của bạn chỉ khoảng 5 phẩy 9 phần trăm, còn hai người bất kỳ trùng nhau là 51 phần trăm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ cộng kỳ vọng cần các biến độc lập <b class="red">(sai)</b>
          <br><span class="note">Các $I_i$ của bài trả mũ phụ thuộc nhau, nhưng kỳ vọng của tổng vẫn bằng tổng kỳ vọng.</span></div>
        say: "Lỗi thứ hai, nghĩ rằng cộng kỳ vọng chỉ đúng khi các biến độc lập. Các biến chỉ báo của bài trả mũ phụ thuộc nhau, nhưng kỳ vọng của tổng vẫn bằng tổng các kỳ vọng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ bảng băm nửa trống thì chưa có va chạm <b class="red">(sai)</b>
          <br><span class="note">20 khoá vào 100 ô: kỳ vọng $\frac{\binom{20}{2}}{100} = 1{,}9$ cặp va chạm, dù 80% ô còn trống.</span></div>
        say: "Lỗi thứ ba, nghĩ bảng băm còn trống nhiều thì chưa có va chạm. Hai mươi khoá vào 100 ô cho kỳ vọng 1 phẩy 9 cặp va chạm, dù 80 phần trăm ô vẫn còn trống."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên giả định “rải đều” <b class="red">(thiếu)</b>
          <br><span class="note">Ngày sinh thật không đều (có tháng sinh nhiều hơn) — thực tế còn dễ trùng hơn. Hàm băm tồi cũng làm va chạm tăng.</span></div>
        say: "Lỗi thứ tư, quên mất giả định rằng ngày sinh rải đều trên cả năm. Ngày sinh thật không đều, có những tháng nhiều người sinh hơn, nên thực tế còn dễ trùng hơn."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sum(sum(p[i] == i for i in range(5)) for p in __import__('itertools').permutations(range(5))) / 120 == 1.0"
      - "__import__('math').comb(30, 2) == 435 == 30 * 29 // 2 and round(435 / 1000, 3) == 0.435 and 10 * (1 / 10) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>10 người gửi mũ, trả ngẫu nhiên. Trung bình bao nhiêu người nhận đúng mũ?</td></tr>
          <tr><td>2</td><td>Băm 30 khoá vào bảng 1000 ô (rải đều). Kỳ vọng số cặp va chạm là bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 10 người gửi mũ và được trả ngẫu nhiên, trung bình bao nhiêu người nhận đúng mũ? Câu hai, băm 30 khoá vào bảng 1000 ô, rải đều, kỳ vọng số cặp va chạm là bao nhiêu? Dừng video và làm ra giấy."
        pause: 30
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — đặt $I_i = 1$ nếu người thứ $i$ nhận đúng mũ; mũ của người đó nằm ở 1 trong 10 chỗ như nhau, nên $\mathbb{E}[I_i] = \frac{1}{10}$.</p>
          <p><b>Bước 2</b> — cộng kỳ vọng (không cần độc lập): $10 \times \frac{1}{10} = \hl{1}$ người — như mọi $n$.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, bước một, đặt biến chỉ báo cho người thứ i, bằng 1 nếu người đó nhận đúng mũ. Vì mũ của người đó nằm ở một trong 10 chỗ như nhau, kỳ vọng của nó là 1 phần 10. Bước hai, cộng mười kỳ vọng lại, không cần độc lập, được 10 nhân 1 phần 10, bằng 1 người, giống như với mọi n."
      - show: |
          <p>② Số cặp khoá: $\binom{30}{2} = \frac{30 \times 29}{2} = 435$; mỗi cặp va chạm với khả năng $\frac{1}{1000}$ $\implies$ kỳ vọng $\frac{435}{1000} = \hl{0{,}435}$ cặp.</p>
        say: "Câu hai, trước hết đếm số cặp khoá, 30 nhân 29 chia 2, bằng 435 cặp. Mỗi cặp rơi vào cùng một ô với khả năng 1 phần 1000, nên theo tính cộng của kỳ vọng, kỳ vọng số cặp va chạm là 435 chia 1000, bằng 0 phẩy 435 cặp."
  - id: practice
    kind: practice
    title: 'Tự làm: xác suất ngày sinh, va chạm băm và kỳ vọng của biến chỉ báo'
    steps:
    - show: |
        <p><b>Đề</b>: viết <code>xacsuat.py</code> tính xác suất trùng ngày sinh của 30 người, số người nhỏ nhất để trùng đạt 50% với 1 000 ngày, kỳ vọng số cặp va chạm của 200 khoá vào 10 000 ô, số điểm cố định trung bình của 7 vật (liệt kê mọi hoán vị, tức mọi cách xếp lại; điểm cố định là vật ở đúng chỗ cũ), và xác suất không trùng khi liệt kê hết (năm dòng, định dạng ở <code>labs/DMS/L19/de.md</code>).</p><p class="note">Số liệu khác ví dụ trong bài. Dự đoán trước phần thứ tư: trung bình mấy vật ở đúng chỗ cũ?</p>
      focus:
      - 1
      - 1
      - 1
      - 1
      - 0
      pause: 420
      say: Bây giờ tới phần bạn tự làm. Hãy viết chương trình tính xác suất trùng ngày sinh của 30 người, và số người nhỏ nhất để xác suất trùng đạt một nửa khi có một nghìn ngày. Sau đó tính kỳ vọng số cặp va chạm, số điểm cố định trung bình của bảy vật, tức vật nằm đúng chỗ cũ, và một xác suất tính bằng cách liệt kê hết. Năm dòng và định dạng nằm trong thư mục thực hành. Hãy dừng video và tự làm.
    - clear: true
      show: |
        <p><b>Kết quả mong đợi</b></p><div class="code"><div>P(trung ngay sinh) voi 30 nguoi: 0.7063</div><div>so nguoi nho nhat de P &gt;= 0.5 voi 1000 ngay: 38</div><div>ky vong so cap va cham 200 khoa vao 10000 o: 1.99</div><div>so diem co dinh trung binh cua 7 vat: 1.0</div><div>P(khong trung) 5 nguoi, 10 ngay (liet ke het): 0.3024</div></div><p class="note">Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b>. Chấm bằng Git Bash: <code>bash labs/cham.sh DMS L19 xacsuat.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>DMS L19 xacsuat.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
      focus:
      - 2
      - 2
      - 3
      - 3
      say: 'Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng với màn hình. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
    - clear: true
      show: |
        <div class="box key"><b>Nếu kẹt:</b> xác suất không trùng là tích các tỉ số $(m - i)/m$; xác suất trùng là $1$ trừ tích đó. Kỳ vọng số cặp va chạm = số cặp $\times$ xác suất mỗi cặp. Điểm cố định trung bình: cộng số điểm cố định của từng hoán vị rồi chia cho 5 040. Lời giải ở <code>labs/DMS/L19/loi_giai.py</code> — chỉ mở sau khi đã thử.</div>
      say: Nếu kẹt, xác suất không trùng là tích các tỉ số số ô còn lại chia tổng số ô, và xác suất trùng là một trừ tích đó. Kỳ vọng số cặp va chạm bằng số cặp nhân xác suất của mỗi cặp. Số điểm cố định trung bình lấy tổng trên mọi hoán vị chia cho số hoán vị. Lời giải nằm trong thư mục thực hành, và bạn chỉ nên mở sau khi đã thử.
    lab: labs/DMS/L19


  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">biến chỉ báo: $\mathbb{E}[I_A] = P(A)$</span><span class="a">→</span>
          <span class="n">kỳ vọng của tổng = tổng kỳ vọng</span><span class="a">→</span>
          <span class="n">số cặp $\binom{n}{2}$ tăng rất nhanh</span><span class="a">→</span>
          <span class="n">va chạm từ khoảng $\sqrt{m}$ khoá</span></div>
        say: "Tổng kết lại, kỳ vọng của biến chỉ báo bằng xác suất. Kỳ vọng của tổng bằng tổng các kỳ vọng, kể cả khi phụ thuộc. Số cặp tăng rất nhanh theo n, nên va chạm xuất hiện từ khoảng căn bậc hai của số ô."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi trực giác về xác suất lệch xa, hãy đếm số <b>cặp</b> — nhiều hiện tượng “bất ngờ” đến từ chỗ số cặp lớn hơn số phần tử rất nhiều.</div>
        say: "Điều cần mang theo, khi trực giác về xác suất lệch xa, hãy đếm số cặp, vì nhiều hiện tượng bất ngờ đến từ chỗ số cặp lớn hơn số phần tử rất nhiều."
      - clear: true
        show: |
          <p class="note">Hết phần kiến thức của khoá Toán rời rạc: lôgic, chứng minh, tập hợp–quan hệ–hàm, đếm, số học mô-đun, đồ thị, xác suất rời rạc.</p>
          <p class="note">Bài sau (bài 20, bài cuối của khoá): <b>tình huống chuyên gia theo dòng thời gian</b> — hàm băm từ năm 2004 tới 2030, khi số cặp và độ dài mã băm quyết định chuyện an toàn.</p>
        forward_ref: true
        focus: [1, 2, 2, 0]
        say: "Đến đây là hết phần kiến thức của khoá Toán rời rạc. Ở bài sau, bài 20, bài cuối của khoá, ta đi theo dòng thời gian của hàm băm, từ năm 2004 tới năm 2030. Ta sẽ thấy cách đếm số cặp của bài này quyết định một mã băm dài bao nhiêu thì an toàn. Hẹn gặp bạn ở bài tiếp theo."
