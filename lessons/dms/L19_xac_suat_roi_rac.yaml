stroke-width="2.5"/><line x1="720" y1="280" x2="620" y2="107" stroke="#eb6834" stroke-width="2.5"/><line x1="620" y1="223" x2="620" y2="107" stroke="#eb6834" stroke-width="2.5"/><circle cx="720" cy="50" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="820" cy="107" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="820" cy="222" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="720" cy="280" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="620" cy="223" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="620" cy="107" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="720" y="322" font-size="26" text-anchor="middle">6 người: <tspan fill="#c2410c" font-weight="700">15 cặp</tspan></text><line x1="1200" y1="50" x2="1281" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="50" x2="1315" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="50" x2="1281" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="50" x2="1200" y2="280" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="50" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="50" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="50" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="84" x2="1315" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="84" x2="1281" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="84" x2="1200" y2="280" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="84" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="84" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="84" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1281" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1200" y2="280" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1315" y1="165" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1200" y2="280" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1281" y1="246" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="280" x2="1119" y2="246" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="280" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1200" y1="280" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1119" y1="246" x2="1085" y2="165" stroke="#eb6834" stroke-width="2.5"/><line x1="1119" y1="246" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><line x1="1085" y1="165" x2="1119" y2="84" stroke="#eb6834" stroke-width="2.5"/><circle cx="1200" cy="50" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1281" cy="84" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1315" cy="165" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1281" cy="246" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1200" cy="280" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1119" cy="246" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1085" cy="165" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="1119" cy="84" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1200" y="322" font-size="26" text-anchor="middle">8 người: <tspan fill="#c2410c" font-weight="700">28 cặp</tspan></text></svg></div>
          <p>Mỗi đường cam là một <b>cặp</b> — một cơ hội trùng ngày sinh. 23 người có $\binom{23}{2} = 253$ cặp, hơn 10 lần số người.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Hình này cho thấy vì sao trực giác về ngày sinh hay sai. Mỗi chấm xanh là một người, mỗi đường cam nối hai người là một cặp, tức một cơ hội để trùng ngày sinh. Bốn người có 6 cặp, sáu người có 15 cặp, tám người đã có 28 cặp, số người tăng đều mà số cặp tăng vọt. Với 23 người, số cặp là 253, hơn 10 lần số người. Người đoán 6 phần trăm đã nghĩ theo số người, trong khi cần nghĩ theo số cặp."

  # ───────────────────────── 4. VÍ DỤ: NGÀY SINH ─────────────────────────
  - id: example
    kind: example
    title: "Tính xác suất trùng ngày sinh"
    checks:
      - "365 - 22 == 343 and round(364 / 365, 5) == 0.99726 and round(363 / 365, 5) == 0.99452"
      - "round(364 * 363 / 365 ** 2, 4) == 0.9918 and round((1 - 364 * 363 / 365 ** 2) * 100, 2) == 0.82"
      - "__import__('math').comb(23, 2) == 253 and round(253 / 365, 3) == 0.693"
      - "round(__import__('math').prod((365 - k) / 365 for k in range(23)), 4) == 0.4927"
      - "min(n for n in range(1, 100) if 1 - __import__('math').prod((365 - k) / 365 for k in range(n)) >= 0.5) == 23"
    steps:
      - show: |
          <p><b>Bước 1 — mỗi người phải tránh bao nhiêu ngày</b> (để không ai trùng ai):</p>
          <table class="t"><tr><th>người thứ</th><th>ngày đã có người</th><th>ngày còn trống</th><th>tỉ số</th></tr>
          <tr><td>1</td><td>0</td><td>365</td><td>$\frac{365}{365} = 1$</td></tr>
          <tr><td>2</td><td>1</td><td>364</td><td>$\frac{364}{365} \approx 0{,}99726$</td></tr>
          <tr><td>3</td><td>2</td><td>363</td><td>$\frac{363}{365} \approx 0{,}99452$</td></tr>
          <tr><td>23</td><td>22</td><td>$365 - 22 = 343$</td><td>$\frac{343}{365}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước một, xem mỗi người phải tránh bao nhiêu ngày để không ai trùng ai. Người thứ nhất sinh ngày nào cũng được, tỉ số là 1. Người thứ hai phải tránh một ngày đã có người, còn 364 ngày trống, tỉ số khoảng 0 phẩy 99726. Người thứ ba tránh hai ngày, còn 363 ngày, tỉ số khoảng 0 phẩy 99452. Cứ thế, người thứ 23 phải tránh 22 ngày, chỉ còn 365 trừ 22, bằng 343 ngày."
      - clear: true
        show: |
          <p><b>Bước 2 — nhân thử với 3 người</b>:</p>
          <div>$$1 \times \frac{364}{365} \times \frac{363}{365} \approx 0{,}9918$$</div>
          <p>nên khả năng có trùng $\approx 1 - 0{,}9918 = 0{,}82\%$ — còn rất nhỏ.</p>
        focus: [2, 3, 0]
        say: "Bước hai, nhân thử với 3 người, 1 nhân 364 phần 365 nhân 363 phần 365, được khoảng 0 phẩy 9918. Theo phần bù, khả năng có trùng trong 3 người chỉ khoảng 0 phẩy 82 phần trăm, còn rất nhỏ. Nhưng mỗi người thêm vào lại nhân thêm một tỉ số nhỏ hơn, và tích giảm ngày càng nhanh."
      - clear: true
        show: |
          <p><b>Đếm phần bù</b>: “không ai trùng” — người thứ nhất tuỳ ý, người thứ hai tránh 1 ngày, người thứ ba tránh 2 ngày, …</p>
          <p>$P(\text{không trùng}) = \frac{365}{365} \times \frac{364}{365} \times \dots \times \frac{343}{365} \approx 0{,}4927$ &nbsp; $\implies$ $P(\text{có trùng}) \approx \hl{0{,}5073}$.</p>
          <p class="note">Vì sao lớn vậy: có $\binom{23}{2} = 253$ <b>cặp</b> người, mỗi cặp trùng với xác suất $\frac{1}{365}$. Kỳ vọng số cặp trùng $= \frac{253}{365} \approx 0{,}69$. 23 là số người nhỏ nhất vượt 50% (máy dò).</p>
        focus: [1, 2, 2, 3, 3, 3]
        say: "Ta đếm phần bù, không ai trùng ai. Người thứ nhất sinh ngày nào cũng được, người thứ hai phải tránh 1 ngày, người thứ ba tránh 2 ngày, và cứ thế. Nhân các tỉ số lại được khoảng 0 phẩy 49, nên xác suất có trùng là khoảng 0 phẩy 51. Vì sao lớn như vậy? Vì 23 người tạo ra 253 cặp, mỗi cặp trùng với xác suất 1 phần 365, nên kỳ vọng số cặp trùng là khoảng 0 phẩy 69. Máy dò cũng cho thấy 23 là số người nhỏ nhất làm xác suất vượt 50 phần trăm."

  # ───────────────────────── 5. VA CHẠM BĂM ─────────────────────────
  - id: hashing
    kind: concept
    title: "Va chạm băm: khoảng căn bậc hai của số ô"
    checks:
      - "round((2 * __import__('math').log(2) * 365) ** 0.5, 1) == 22.5"
      - "round((2 * __import__('math').log(2) * 2 ** 32) ** 0.5) == 77163"
      - "__import__('math').comb(20, 2) / 100 == 1.9"
      - "__import__('math').isqrt(2 ** 256) == 2 ** 128"
    steps:
      - show: |
          <p>Băm $n$ khoá vào $m$ ô (giả định hàm băm rải đều): kỳ vọng số <b>cặp va chạm</b> $= \frac{\binom{n}{2}}{m}$.</p>
          <p>Xác suất có va chạm vượt 50% khi $n \approx 1{,}18\sqrt{m}$: &nbsp; $m = 365$ cho khoảng 22,5 người; &nbsp; mã băm 32 bit ($m = 2^{32}$) chỉ cần khoảng <b>77 nghìn</b> khoá.</p>
        focus: [1, 2, 2, 2]
        say: "Băm n khoá vào m ô, với giả định hàm băm rải đều, thì kỳ vọng số cặp va chạm là tổ hợp chập 2 của n chia m. Xác suất có va chạm vượt 50 phần trăm khi n vào khoảng 1 phẩy 18 nhân căn bậc hai của m. Với 365 ngày, đó là khoảng 22 phẩy 5 người, khớp với kết quả trên. Với mã băm 32 bit, có hơn bốn tỉ giá trị, nhưng chỉ cần khoảng 77 nghìn khoá là đã có một nửa khả năng va chạm."
      - show: |
          <div class="box key">Muốn khó tìm va chạm cỡ $2^{128}$ lần thử, mã băm phải dài <b>256 bit</b> — gấp đôi số bit bạn nghĩ.</div>
          <div>$$\sqrt{2^{256}} = 2^{128}$$</div>
        say: "Vì vậy, muốn kẻ tấn công phải thử cỡ 2 mũ 128 lần mới tìm được va chạm, mã băm phải dài 256 bit, gấp đôi số bit bạn nghĩ ban đầu."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "__import__('math').comb(23, 2) == 253"
      - "(lambda a: len(a) == 64 == 4 * 4 * 4 and sum(len(set(x)) == 3 for x in a) == 24 == 4 * 3 * 2)(list(__import__('itertools').product(range(4), repeat=3))) and (64 - 24) / 64 == 0.625 == 1 - 4 / 4 * 3 / 4 * 2 / 4"
      - "round((364 / 365) ** 253, 4) == 0.4995 and round(__import__('math').prod((365 - k) / 365 for k in range(23)), 4) == 0.4927"
    steps:
      - show: |
          <ol><li>Xác suất phải nằm trong $[0, 1]$; nếu đếm phần bù, nhớ lấy 1 trừ đi.</li>
          <li>Kỳ vọng số cặp: đếm đúng số <b>cặp</b> $\binom{n}{2}$, không phải $n$.</li>
          <li>Ghi rõ giả định (đều, độc lập) — kết quả chỉ đúng trong giả định đó.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, xác suất phải nằm giữa 0 và 1, và nếu đếm phần bù thì nhớ lấy 1 trừ đi. Hai, khi tính kỳ vọng số cặp, đếm đúng số cặp là tổ hợp chập 2 của n, không phải n. Ba, ghi rõ giả định như rải đều và độc lập, vì kết quả chỉ đúng trong giả định đó."
      - clear: true
        show: |
          <p><b>Đường khác 1 — đếm thẳng một “năm tí hon” 4 ngày</b>, 3 người, rồi so với cách nhân tỉ số:</p>
          <table class="t"><tr><th>cách</th><th>phép tính</th><th>khả năng có trùng</th></tr>
          <tr><td>liệt kê: mọi cách gán ngày</td><td>$4 \times 4 \times 4 = 64$; không trùng: $4 \times 3 \times 2 = 24$</td><td>$\frac{64 - 24}{64} = 0{,}625$</td></tr>
          <tr><td>nhân tỉ số như trên</td><td>$1 - \frac{4}{4} \times \frac{3}{4} \times \frac{2}{4} = 1 - 0{,}375$</td><td>$0{,}625$ ✓</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Bây giờ kiểm cách nhân tỉ số bằng một đường khác, đếm thẳng trên một năm tí hon chỉ có 4 ngày, với 3 người. Mỗi người có 4 lựa chọn, nên có 4 nhân 4 nhân 4, bằng 64 cách gán ngày. Số cách không ai trùng là 4 nhân 3 nhân 2, bằng 24, nên khả năng có trùng là 40 phần 64, bằng 0 phẩy 625. Cách nhân tỉ số cho 1 trừ 0 phẩy 375, cũng bằng 0 phẩy 625, hai đường khớp nhau."
      - show: |
          <p><b>Đường khác 2 — ước lượng theo cặp</b>: coi 253 cặp như 253 lần thử, mỗi lần “không trùng” với khả năng $\frac{364}{365}$:</p>
          <table class="t"><tr><th>cách</th><th>khả năng không ai trùng</th></tr>
          <tr><td>ước lượng theo cặp: $\left(\frac{364}{365}\right)^{253}$</td><td>$\approx 0{,}4995$</td></tr>
          <tr><td>tính đúng: nhân 23 tỉ số</td><td>$\approx 0{,}4927$</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Đường khác thứ hai, ước lượng theo cặp, coi 253 cặp như 253 lần thử, mỗi lần không trùng với khả năng 364 phần 365. Nâng lên mũ 253 được khoảng 0 phẩy 4995. Cách tính đúng cho 0 phẩy 4927. Hai số lệch nhau một chút vì các cặp không hoàn toàn độc lập, nhưng cả hai đều nói khoảng một nửa, nên đáp án 51 phần trăm là hợp lý."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "round(1 - (364 / 365) ** 22, 3) == 0.059"
      - "round((1 - __import__('math').prod((365 - k) / 365 for k in range(23))) * 100, 1) == 50.7 and __import__('math').comb(23, 2) == 253"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lẫn “có hai người trùng nhau” với “có người trùng với <b>tôi</b>” <b class="red">(sai)</b>
          <br><span class="note">22 người kia trùng ngày sinh của bạn: chỉ $1 - (\frac{364}{365})^{22} \approx 5{,}9\%$. Còn “hai người bất kỳ trùng” là 51%.</span></div>
          <table class="t"><tr><th>câu hỏi</th><th>số lần so sánh</th><th>khả năng</th></tr>
          <tr><td>có người trùng với <b>tôi</b></td><td>22</td><td>khoảng 5,9%</td></tr>
          <tr><td>có <b>hai người bất kỳ</b> trùng</td><td>253 cặp</td><td>khoảng 50,7%</td></tr></table>
        focus: [1, 2, 2]
        say: "Lỗi thứ nhất, lẫn có hai người trùng nhau với có người trùng ngày sinh của chính mình. Trong 22 người còn lại, khả năng có người trùng ngày sinh của bạn chỉ khoảng 5 phẩy 9 phần trăm, còn hai người bất kỳ trùng nhau là 51 phần trăm. Bảng cho thấy lý do, câu hỏi thứ nhất chỉ có 22 lần so sánh, câu hỏi thứ hai có tới 253 cặp."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ cộng kỳ vọng cần các biến độc lập <b class="red">(sai)</b>
          <br><span class="note">Các $I_i$ của bài trả mũ phụ thuộc nhau, nhưng kỳ vọng của tổng vẫn bằng tổng kỳ vọng.</span></div>
        say: "Lỗi thứ hai, nghĩ rằng cộng kỳ vọng chỉ đúng khi các biến độc lập. Các biến chỉ báo của bài trả mũ phụ thuộc nhau, nhưng kỳ vọng của tổng vẫn bằng tổng các kỳ vọng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ bảng băm nửa trống thì chưa có va chạm <b class="red">(sai)</b>
          <br><span class="note">20 khoá vào 100 ô: kỳ vọng $\frac{\binom{20}{2}}{100} = 1{,}9$ cặp va chạm, dù 80% ô còn trống.</span></div>
        say: "Lỗi thứ ba, nghĩ bảng băm còn trống nhiều thì chưa có va chạm. Hai mươi khoá vào 100 ô cho kỳ vọng 1 phẩy 9 cặp va chạm, dù 80 phần trăm ô vẫn còn trống."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên giả định “rải đều” <b class="red">(thiếu)</b>
          <br><span class="note">Ngày sinh thật không đều (có tháng sinh nhiều hơn) — thực tế còn dễ trùng hơn. Hàm băm tồi cũng làm va chạm tăng.</span></div>
        say: "Lỗi thứ tư, quên mất giả định rằng ngày sinh rải đều trên cả năm. Ngày sinh thật không đều, có những tháng nhiều người sinh hơn, nên thực tế còn dễ trùng hơn. Một hàm băm tồi cũng làm va chạm tăng lên."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sum(sum(p[i] == i for i in range(5)) for p in __import__('itertools').permutations(range(5))) / 120 == 1.0"
      - "__import__('math').comb(30, 2) == 435 == 30 * 29 // 2 and round(435 / 1000, 3) == 0.435 and 10 * (1 / 10) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>10 người gửi mũ, trả ngẫu nhiên. Trung bình bao nhiêu người nhận đúng mũ?</td></tr>
          <tr><td>2</td><td>Băm 30 khoá vào bảng 1000 ô (rải đều). Kỳ vọng số cặp va chạm là bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 10 người gửi mũ và được trả ngẫu nhiên, trung bình bao nhiêu người nhận đúng mũ? Câu hai, băm 30 khoá vào bảng 1000 ô, rải đều, kỳ vọng số cặp va chạm là bao nhiêu? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — đặt $I_i = 1$ nếu người thứ $i$ nhận đúng mũ; mũ của người đó nằm ở 1 trong 10 chỗ như nhau, nên $\mathbb{E}[I_i] = \frac{1}{10}$.</p>
          <p><b>Bước 2</b> — cộng kỳ vọng (không cần độc lập): $10 \times \frac{1}{10} = \hl{1}$ người — như mọi $n$.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, bước một, đặt biến chỉ báo cho người thứ i, bằng 1 nếu người đó nhận đúng mũ. Vì mũ của người đó nằm ở một trong 10 chỗ như nhau, kỳ vọng của nó là 1 phần 10. Bước hai, cộng mười kỳ vọng lại, không cần độc lập, được 10 nhân 1 phần 10, bằng 1 người, giống như với mọi n."
      - show: |
          <p>② Số cặp khoá: $\binom{30}{2} = \frac{30 \times 29}{2} = 435$; mỗi cặp va chạm với khả năng $\frac{1}{1000}$ $\implies$ kỳ vọng $\frac{435}{1000} = \hl{0{,}435}$ cặp.</p>
        say: "Câu hai, trước hết đếm số cặp khoá, 30 nhân 29 chia 2, bằng 435 cặp. Mỗi cặp rơi vào cùng một ô với khả năng 1 phần 1000, nên theo tính cộng của kỳ vọng, kỳ vọng số cặp va chạm là 435 chia 1000, bằng 0 phẩy 435 cặp."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">biến chỉ báo: $\mathbb{E}[I_A] = P(A)$</span><span class="a">→</span>
          <span class="n">kỳ vọng của tổng = tổng kỳ vọng</span><span class="a">→</span>
          <span class="n">số cặp $\binom{n}{2}$ tăng rất nhanh</span><span class="a">→</span>
          <span class="n">va chạm từ khoảng $\sqrt{m}$ khoá</span></div>
        say: "Tổng kết lại, kỳ vọng của biến chỉ báo bằng xác suất. Kỳ vọng của tổng bằng tổng các kỳ vọng, kể cả khi phụ thuộc. Số cặp tăng rất nhanh theo n, nên va chạm xuất hiện từ khoảng căn bậc hai của số ô."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi trực giác về xác suất lệch xa, hãy đếm số <b>cặp</b> — nhiều hiện tượng “bất ngờ” đến từ chỗ số cặp lớn hơn số phần tử rất nhiều.</div>
        say: "Điều cần mang theo, khi trực giác về xác suất lệch xa, hãy đếm số cặp, vì nhiều hiện tượng bất ngờ đến từ chỗ số cặp lớn hơn số phần tử rất nhiều."
      - clear: true
        show: |
          <p class="note">Hết phần kiến thức của khoá Toán rời rạc: lôgic, chứng minh, tập hợp–quan hệ–hàm, đếm, số học mô-đun, đồ thị, xác suất rời rạc.</p>
          <p class="note">Bài sau (bài 20, bài cuối của khoá): <b>tình huống chuyên gia theo dòng thời gian</b> — hàm băm từ năm 2004 tới 2030, khi số cặp và độ dài mã băm quyết định chuyện an toàn.</p>
        forward_ref: true
        focus: [1, 2, 2, 0]
        say: "Đến đây là hết phần kiến thức của khoá Toán rời rạc, với logic, chứng minh, tập hợp, quan hệ, hàm, đếm, số học mô-đun, đồ thị và xác suất rời rạc. Ở bài sau, bài 20, bài cuối của khoá, ta đi theo dòng thời gian của hàm băm, từ năm 2004 tới năm 2030. Ta sẽ thấy cách đếm số cặp của bài này quyết định một mã băm dài bao nhiêu thì an toàn. Hẹn gặp bạn ở bài tiếp theo."
