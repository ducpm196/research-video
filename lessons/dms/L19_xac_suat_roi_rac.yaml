source: "curriculum/dms.yaml L19; audit/verify_plan_curricula.py DMS:L19; K. Rosen, mục 7.1–7.4; mọi con số tính lại trong checks (giả định 365 ngày đều nhau, bỏ 29 tháng 2)"
