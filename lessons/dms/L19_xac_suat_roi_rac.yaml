scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "23 người trong một phòng"
    checks:
      - "round(1 - __import__('math').prod((365 - k) / 365 for k in range(23)), 4) == 0.5073"
    steps:
      - show: |
          <p>Trong một phòng có 23 người, khả năng có <b>hai người trùng ngày sinh</b> là bao nhiêu? (giả định 365 ngày, đều nhau)</p>
          <p>Nhiều người đoán khoảng $\frac{23}{365} \approx 6\%$. Đáp án thật: khoảng <b>51%</b>.</p>
        focus: [1, 2, 2]
        say: "Chào bạn, trong một phòng có 23 người, khả năng có hai người trùng ngày sinh là bao nhiêu, nếu ngày sinh rải đều trên 365 ngày? Nhiều người đoán chỉ khoảng 6 phần trăm. Đáp án thật là khoảng 51 phần trăm."
      - show: |
          <div class="box key">Cùng hiện tượng này quyết định khi nào bảng băm bắt đầu va chạm, và vì sao mã băm cần đủ dài.</div>
        say: "Bảng băm là một dãy ô, hàm băm chỉ mỗi khoá, tức mã định danh của dữ liệu, tới một ô, và va chạm là hai khoá rơi vào cùng một ô. Cùng hiện tượng này quyết định khi nào bảng băm bắt đầu va chạm, và vì sao mã băm dùng trong bảo mật phải đủ dài."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tỉ số, đếm cặp, phần bù"
    checks:
      - "round(364 / 365, 4) == 0.9973 and round(1 / 2 * 1 / 2, 2) == 0.25"
      - "__import__('math').comb(4, 2) == 4 * 3 // 2 == 6 and __import__('math').comb(23, 2) == 23 * 22 // 2 == 253"
      - "round(1 - 5 / 6, 4) == round(1 / 6, 4) and round(5 / 6 * 100, 1) == 83.3 and round(1 / 6 * 100, 1) == 16.7"
    steps:
      - show: |
          <table class="t"><tr><th>việc</th><th>ví dụ</th><th>kết quả</th></tr>
          <tr><td>tỉ số: phần thuận lợi chia tổng</td><td>364 ngày trên 365 ngày</td><td>$\frac{364}{365} \approx 0{,}9973$</td></tr>
          <tr><td>hai việc <b>không ảnh hưởng nhau</b> (độc lập) cùng xảy ra: nhân hai tỉ số</td><td>tung hai đồng xu, cả hai ngửa</td><td>$\frac{1}{2} \times \frac{1}{2} = 0{,}25$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Trước khi vào bài, ta ôn ba việc sẽ dùng đến. Việc thứ nhất là tỉ số, phần thuận lợi chia cho tổng, ví dụ 364 ngày trên 365 ngày, khoảng 0 phẩy 9973. Khi hai việc không ảnh hưởng nhau, ta gọi là độc lập, mà cùng phải xảy ra, thì ta nhân hai tỉ số. Tung hai đồng xu, khả năng cả hai cùng ngửa là một phần hai nhân một phần hai, bằng 0 phẩy 25."
      - clear: true
        show: |
          <p>Việc thứ hai — <b>đếm cặp</b>: $n$ người tạo ra $\binom{n}{2} = \frac{n \times (n - 1)}{2}$ cặp, vì mỗi người ghép với $n - 1$ người, mỗi cặp bị đếm hai lần.</p>
          <table class="t"><tr><th>số người</th><th>phép tính</th><th>số cặp</th></tr>
          <tr><td>4</td><td>$\frac{4 \times 3}{2}$</td><td>6</td></tr>
          <tr><td>23</td><td>$\frac{23 \times 22}{2}$</td><td>253</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Việc thứ hai là đếm cặp, như ở bài 10, n người tạo ra tổ hợp chập 2 của n cặp, bằng n nhân n trừ 1 chia 2. Lý do là mỗi người ghép với n trừ 1 người và mỗi cặp bị đếm hai lần. Bốn người có 4 nhân 3 chia 2, bằng 6 cặp. Hai mươi ba người có 23 nhân 22 chia 2, bằng 253 cặp."
      - clear: true
        show: |
          <p>Việc thứ ba — <b>phần bù</b>: khả năng “có” bằng 1 trừ khả năng “không có”.</p>
          <table class="t"><tr><th>tung một xúc xắc</th><th>khả năng</th></tr>
          <tr><td>không ra mặt 6</td><td>$\frac{5}{6} \approx 83{,}3\%$</td></tr>
          <tr><td>ra mặt 6</td><td>$1 - \frac{5}{6} = \frac{1}{6} \approx 16{,}7\%$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Việc thứ ba là phần bù, khả năng có một điều bằng 1 trừ khả năng không có điều đó. Tung một xúc xắc, khả năng không ra mặt 6 là 5 phần 6, khoảng 83 phẩy 3 phần trăm. Vì vậy khả năng ra mặt 6 là 1 trừ 5 phần 6, bằng 1 phần 6, khoảng 16 phẩy 7 phần trăm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: P(A), 𝔼[X], biến chỉ báo"
    checks:
      - "sum(1 for d in range(1, 7) if d % 2 == 0) / 6 == 0.5"
      - "sum(range(1, 7)) == 21 and Fraction(sum(range(1, 7)), 6) == Fraction(7, 2) and 1 * 0.5 + 0 * 0.5 == 0.5 == 3 / 6"
    steps:
      - show: |
          <p>$P(A)$: xác suất của biến cố $A$ (một điều có thể xảy ra hoặc không, như “ra mặt chẵn”). Khi mọi kết quả <b>đồng khả năng</b> (khả năng như nhau): $P(A) = \frac{\text{số kết quả thuận lợi}}{\text{số kết quả có thể}}$.</p>
          <p>$\mathbb{E}[X]$: kỳ vọng — giá trị trung bình của $X$ nếu lặp thí nghiệm rất nhiều lần.</p>
          <p><b>Biến chỉ báo</b> $I_A$: bằng 1 nếu $A$ xảy ra, bằng 0 nếu không. Khi đó $\mathbb{E}[I_A] = P(A)$.</p>
        introduces: [prob, expect]
        focus: [1, 1, 2, 3, 3]
        say: "Chữ P của A là xác suất của biến cố A, tức là một điều có thể xảy ra hoặc không khi làm thí nghiệm, như tung xúc xắc ra mặt chẵn. Khi mọi kết quả đồng khả năng, tức khả năng như nhau, nó bằng số kết quả thuận lợi chia số kết quả có thể. Chữ E in đậm kép của X là kỳ vọng, giá trị trung bình của X nếu lặp thí nghiệm rất nhiều lần. Biến chỉ báo của A bằng 1 nếu A xảy ra, bằng 0 nếu không. Vì vậy kỳ vọng của nó đúng bằng xác suất của A."
      - clear: true
        show: |
          <p><b>Làm thử với một xúc xắc</b> (6 mặt đồng khả năng). Kỳ vọng = cộng từng giá trị nhân xác suất của giá trị đó.</p>
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>$P(A)$, với $A$: ra mặt chẵn</td><td>mặt 2, 4, 6: $\frac{3}{6}$</td><td>0,5</td></tr>
          <tr><td>$\mathbb{E}[X]$, với $X$: số chấm</td><td>$\frac{1 + 2 + 3 + 4 + 5 + 6}{6} = \frac{21}{6}$</td><td>3,5</td></tr>
          <tr><td>$\mathbb{E}[I_A]$</td><td>$1 \times 0{,}5 + 0 \times 0{,}5$</td><td>0,5 = $P(A)$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Làm thử với một con xúc xắc có 6 mặt đồng khả năng. Kỳ vọng được tính bằng cách cộng từng giá trị nhân với xác suất của giá trị đó. Biến cố A là ra mặt chẵn, gồm các mặt 2, 4 và 6, nên xác suất là 3 phần 6, bằng 0 phẩy 5. Số chấm X có kỳ vọng bằng 1 cộng 2 cộng đến 6, tức 21, chia cho 6, bằng 3 phẩy 5, dù không mặt nào có 3 phẩy 5 chấm. Biến chỉ báo của A bằng 1 với xác suất 0 phẩy 5 và bằng 0 với xác suất 0 phẩy 5, nên kỳ vọng của nó là 0 phẩy 5, đúng bằng xác suất của A."

  # ───────────────────────── 3. TUYẾN TÍNH CỦA KỲ VỌNG ─────────────────────────
  - id: linearity
    kind: concept
    title: "Kỳ vọng của tổng bằng tổng các kỳ vọng"
    checks:
      - "sum(sum(p[i] == i for i in range(4)) for p in __import__('itertools').permutations(range(4))) / 24 == 1.0"
      - "all(sum(sum(p[i] == i for i in range(n)) for p in __import__('itertools').permutations(range(n))) == __import__('math').factorial(n) for n in range(1, 7))"
    steps:
      - show: |
          <div class="box key">$\mathbb{E}[X + Y] = \mathbb{E}[X] + \mathbb{E}[Y]$ — <b>luôn</b> đúng, kể cả khi $X$, $Y$ phụ thuộc nhau.</div>
          <p><b>Trả mũ</b>: $n$ người gửi mũ, mũ bị trả ngẫu nhiên; trung bình bao nhiêu người nhận đúng mũ của mình? Đặt $I_i = 1$ nếu người $i$ đúng. $P(\text{người } i \text{ đúng}) = \frac{1}{n}$.</p>
          <p>Số người đúng $= I_1 + \dots + I_n$ $\implies$ kỳ vọng $= n \times \frac{1}{n} = \hl{1}$ — với mọi $n$. Máy kiểm $n$ từ 1 đến 6 ✓</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Tính chất quan trọng nhất, kỳ vọng của một tổng bằng tổng các kỳ vọng. Điều này luôn đúng, kể cả khi các biến phụ thuộc nhau. Áp dụng cho bài trả mũ, n người gửi mũ và mũ bị trả ngẫu nhiên, trung bình có bao nhiêu người nhận đúng mũ của mình? Đặt I i bằng 1 nếu người thứ i nhận đúng, xác suất đó là 1 phần n. Số người nhận đúng là tổng các I i, nên kỳ vọng bằng n nhân 1 phần n, bằng 1. Kết quả đúng với mọi n."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Số người tăng đều, số cặp tăng vọt"
    checks:
      - "[n * (n - 1) // 2 for n in (4, 6, 8)] == [6, 15, 28] and __import__('math').comb(23, 2) == 253 and 253 > 10 * 23"
    steps:
      - show: |
