#   lessons/dms/L08_thu_tu_bo_phan.yaml HASSE=audit/dms/fig/hasse12.svg HASSE_BAD=audit/dms/fig/hasse12_bad.svg
# Quy ước: quan hệ thứ tự nói bằng lời “a là ước của b” (không dùng dấu gạch đứng — sổ chung dành \mid cho “khi biết”).
#   Tên “Hasse” chỉ hiện trên màn hình; lời đọc nói “biểu đồ thứ tự” (probe p3: mọi cách viết ≤ 5/8).
objectives:
  - "Nhận ra thứ tự bộ phận và cặp không so sánh được"
  - "Vẽ biểu đồ Hasse (biểu đồ thứ tự) chỉ với các cạnh nối hai phần tử liền kề"
  - "Liệt kê một thứ tự tuyến tính tương thích (sắp xếp tô pô)"
asr_reviewed:
  - {sentence: "Bước một, nắm luật.", reason: "ASR chép “Bước 1. Nắm lực” (0.75): lệch âm/thanh thuần Việt: luật/lực — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tiếp theo, ôn tính bắc cầu ở bài 7, a R b và b R c thì a R c.", reason: "ASR chép “Tiếp theo, ông tính bắt cầu ở bài bẫy A, B và B, R, C thì A, L, C.” (0.769): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: ôn/ông, bắc/bắt, bảy/bẫy — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Học môn nào trước?"
    checks:
      - "5 == len([p for p in __import__('itertools').permutations([1, 2, 3, 4, 6, 12]) if all(p.index(a) < p.index(b) for a in p for b in p if a != b and b % a == 0)])"
    steps:
      - show: |
          <p>Muốn học bài 3 phải xong bài 2; muốn học bài 5 phải xong bài 3. Nhưng bài 4 và bài 5 <b>không</b> phụ thuộc nhau.</p>
          <p>Ràng buộc kiểu “cái này trước cái kia” có mặt khắp nơi: thứ tự nấu các món, thứ tự lắp đồ đạc, lịch các công việc.</p>
        focus: [1, 1, 2]
        say: "Chào bạn, muốn học bài 3 phải xong bài 2, muốn học bài 5 phải xong bài 3. Nhưng bài 4 và bài 5 lại không phụ thuộc nhau. Ràng buộc kiểu cái này trước cái kia có mặt khắp nơi, từ thứ tự nấu các món, thứ tự lắp đồ đạc, đến lịch các công việc."
      - show: |
          <div class="box key">Hôm nay: quan hệ “đứng trước” mà có những cặp <b>không so sánh được</b> — thứ tự bộ phận — và cách xếp tất cả thành một hàng hợp lệ.</div>
        say: "Hôm nay ta học thứ tự bộ phận, một quan hệ đứng trước mà có những cặp không so sánh được, và cách xếp tất cả thành một hàng hợp lệ."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ước số và tính bắc cầu"
    checks:
      - "12 % 4 == 0 and 12 == 4 * 3 and 12 % 5 == 2 and [d for d in range(1, 13) if 12 % d == 0] == [1, 2, 3, 4, 6, 12]"
      - "4 == 2 * 2 and 12 == 4 * 3 and 12 == 2 * (2 * 3) and 2 * 3 == 6"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>phép chia</th><th>kết luận</th></tr>
          <tr><td>4 có là ước của 12?</td><td>12 = 4 × 3, dư 0</td><td>có</td></tr>
          <tr><td>5 có là ước của 12?</td><td>12 = 5 × 2 + 2, dư 2</td><td>không</td></tr>
          <tr><td>mọi ước của 12</td><td>thử chia 1, 2, …, 12</td><td>1, 2, 3, 4, 6, 12</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn khái niệm ước số. Số 4 là ước của 12, vì 12 bằng 4 nhân 3, chia hết, không dư. Số 5 không là ước của 12, vì 12 bằng 5 nhân 2 cộng 2, còn dư 2. Thử chia 12 cho từng số từ 1 đến 12, ta được đủ sáu ước là 1, 2, 3, 4, 6 và 12."
      - clear: true
        show: |
          <table class="t"><tr><th>biết</th><th>viết thành phép nhân</th></tr>
          <tr><td>2 là ước của 4</td><td>4 = 2 × 2</td></tr>
          <tr><td>4 là ước của 12</td><td>12 = 4 × 3</td></tr>
          <tr><td>suy ra 2 là ước của 12</td><td>12 = (2 × 2) × 3 = 2 × 6</td></tr></table>
        focus: [0, 0, ["1.2", "1.3"], "1.4"]
        say: "Tiếp theo, ôn tính bắc cầu ở bài 7, a R b và b R c thì a R c. Quan hệ là ước của có tính chất này. Hai là ước của 4 vì 4 bằng 2 nhân 2, và 4 là ước của 12 vì 12 bằng 4 nhân 3. Thay 4 bằng 2 nhân 2, được 12 bằng 2 nhân 6, nên 2 là ước của 12."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_poset
    kind: symbol
    title: "Giải mã: thứ tự bộ phận"
    checks:
      - "all(a % a == 0 for a in [1, 2, 3, 4, 6, 12])"
      - "all(((b % a == 0) and (a % b == 0)) <= (a == b) for a in [1, 2, 3, 4, 6, 12] for b in [1, 2, 3, 4, 6, 12])"
      - "3 % 2 != 0 and 2 % 3 != 0"
    steps:
      - show: |
          <div class="box key"><b>Thứ tự bộ phận</b>: quan hệ <b>phản xạ</b>, <b>phản đối xứng</b>, <b>bắc cầu</b> (bài 7).</div>
          <p>Ví dụ: trên $\{1, 2, 3, 4, 6, 12\}$, quan hệ “$a$ là ước của $b$” (b chia hết cho a).</p>
          <p>Phản xạ: $a$ là ước của $a$. &nbsp; Phản đối xứng: $a$ là ước của $b$ và ngược lại thì $a = b$. &nbsp; Bắc cầu: ước của ước là ước.</p>
        focus: [1, 2, 3, 3, 3]
        say: "Thứ tự bộ phận là một quan hệ phản xạ, phản đối xứng và bắc cầu, ba tính chất ta đã học ở bài 7. Ví dụ trên tập 1, 2, 3, 4, 6, 12, xét quan hệ a là ước của b. Nó phản xạ, vì mỗi số là ước của chính nó. Phản đối xứng, vì hai số là ước của nhau thì bằng nhau. Bắc cầu, vì ước của ước cũng là ước."
      - show: |
          <div class="box warn">2 và 3: 2 không là ước của 3, 3 cũng không là ước của 2 — <b>không so sánh được</b>. Vì vậy gọi là thứ tự <b>bộ phận</b>, khác thứ tự <b>toàn phần</b> như “$\le$”, nơi mọi cặp đều so sánh được.</div>
        say: "Nhưng xét 2 và 3, không số nào là ước của số kia, ta nói chúng không so sánh được. Vì vậy mới gọi là thứ tự bộ phận, khác với thứ tự toàn phần như nhỏ hơn hoặc bằng, nơi mọi cặp đều so sánh được."

  # ───────────────────────── 3. BIỂU ĐỒ THỨ TỰ ─────────────────────────
  - id: hasse
    kind: concept
    title: "Biểu đồ Hasse: chỉ vẽ cạnh “liền kề”"
    checks:
      - "len([(a, b) for a in [1, 2, 3, 4, 6, 12] for b in [1, 2, 3, 4, 6, 12] if a != b and b % a == 0 and not any(c not in (a, b) and c % a == 0 and b % c == 0 for c in [1, 2, 3, 4, 6, 12])]) == 7"
      - "len([(a, b) for a in [1, 2, 3, 4, 6, 12] for b in [1, 2, 3, 4, 6, 12] if a != b and b % a == 0]) == 12"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="520" height="380" viewBox="0 0 520 380"><line x1="260" y1="330" x2="173" y2="237" stroke="#6b7280" stroke-width="4"/><line x1="260" y1="330" x2="347" y2="237" stroke="#6b7280" stroke-width="4"/><line x1="173" y1="237" x2="173" y2="143" stroke="#6b7280" stroke-width="4"/><line x1="173" y1="237" x2="347" y2="143" stroke="#6b7280" stroke-width="4"/><line x1="347" y1="237" x2="347" y2="143" stroke="#6b7280" stroke-width="4"/><line x1="173" y1="143" x2="260" y2="50" stroke="#6b7280" stroke-width="4"/><line x1="347" y1="143" x2="260" y2="50" stroke="#6b7280" stroke-width="4"/><circle cx="260" cy="330" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="260" y="341" font-size="30" text-anchor="middle">1</text><circle cx="173" cy="237" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="173" y="248" font-size="30" text-anchor="middle">2</text><circle cx="347" cy="237" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="347" y="248" font-size="30" text-anchor="middle">3</text><circle cx="173" cy="143" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="173" y="154" font-size="30" text-anchor="middle">4</text><circle cx="347" cy="143" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="347" y="154" font-size="30" text-anchor="middle">6</text><circle cx="260" cy="50" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="260" y="61" font-size="30" text-anchor="middle">12</text></svg></div>
          <div class="col"><p>Luật vẽ <b>biểu đồ Hasse</b> (còn gọi là biểu đồ thứ tự):</p><ol><li>Số lớn hơn (theo thứ tự) đặt <b>cao hơn</b>.</li>
          <li>Bỏ vòng $a$ với chính nó (phản xạ — ai cũng biết).</li>
          <li>Chỉ nối $a$ với $b$ khi $a$ đứng ngay dưới $b$, <b>không có</b> phần tử nào ở giữa.</li></ol></div></div>
        focus: ["1.1", "1.2", "1.2", "1.2", "1.2"]
        say: "Biểu đồ thứ tự trên màn hình, mang tên một nhà toán học ghi trên màn hình, vẽ quan hệ này rất gọn. Luật một, phần tử lớn hơn theo thứ tự đặt cao hơn. Luật hai, bỏ các vòng của một phần tử với chính nó. Luật ba, chỉ nối a với b khi a đứng ngay dưới b, không có phần tử nào ở giữa. Ví dụ không nối 1 với 4, vì 2 nằm giữa."
      - show: |
          <p>Quan hệ “là ước của” trên tập này có 12 cặp hai số khác nhau, nhưng biểu đồ chỉ cần <b>7 cạnh</b>: các cặp còn lại suy ra được bằng <b>bắc cầu</b>, đi dần lên theo cạnh.</p>
          <p class="note">Đọc biểu đồ: $a$ đứng trước $b$ khi có đường đi <b>lên</b> từ $a$ tới $b$. Ví dụ 3 lên 6 lên 12, nên 3 là ước của 12.</p>
        focus: [1, 1, 2, 2]
        say: "Quan hệ là ước của trên tập này có 12 cặp gồm hai số khác nhau, nhưng biểu đồ chỉ cần 7 cạnh. Các cặp còn lại suy ra được bằng tính bắc cầu, đi dần lên theo cạnh. Cách đọc, a đứng trước b khi có đường đi lên từ a tới b. Ví dụ 3 lên 6 rồi lên 12, nên 3 là ước của 12."

  # ───────────────────────── 4. SẮP XẾP TÔ PÔ ─────────────────────────
  - id: example
    kind: example
    title: "Sắp xếp tô pô: xếp thành một hàng hợp lệ"
    checks:
      - "[p for p in __import__('itertools').permutations([1, 2, 3, 4, 6, 12]) if all(p.index(a) < p.index(b) for a in p for b in p if a != b and b % a == 0)][0] == (1, 2, 3, 4, 6, 12)"
      - "5 == len([p for p in __import__('itertools').permutations([1, 2, 3, 4, 6, 12]) if all(p.index(a) < p.index(b) for a in p for b in p if a != b and b % a == 0)])"
      - "all(p.index(a) < p.index(b) for p in [(1, 3, 2, 6, 4, 12)] for a in p for b in p if a != b and b % a == 0)"
    steps:
      - show: |
          <p><b>Bước 1 — luật.</b> <b>Sắp xếp tô pô</b>: xếp mọi phần tử thành một hàng sao cho $a$ đứng trước $b$ trong thứ tự thì cũng đứng trước trong hàng.</p>
          <p>Cách làm: lặp lại — chọn một phần tử <b>không còn ai đứng dưới nó</b> (trong phần chưa xếp), đưa ra hàng, xoá khỏi biểu đồ.</p>
        focus: [1, 1, 2, 2]
        say: "Bước một, nắm luật. Sắp xếp tô pô là xếp mọi phần tử thành một hàng, sao cho nếu a đứng trước b trong thứ tự thì a cũng đứng trước b trong hàng. Cách làm rất đơn giản, ta lặp lại việc chọn một phần tử không còn ai đứng dưới nó. Đưa phần tử đó ra hàng, rồi xoá nó khỏi biểu đồ."
      - show: |
          <p><b>Bước 2 — chạy từng lượt</b> trên biểu đồ của $\{1, 2, 3, 4, 6, 12\}$:</p>
          <table class="t"><tr><th>lượt</th><th>chưa ai đứng dưới</th><th>chọn</th><th>hàng</th></tr>
          <tr><td>1</td><td>1</td><td>1</td><td>1</td></tr>
          <tr><td>2</td><td>2, 3</td><td>2</td><td>1, 2</td></tr>
          <tr><td>3</td><td>3, 4</td><td>3</td><td>1, 2, 3</td></tr>
          <tr><td>4</td><td>4, 6</td><td>4</td><td>1, 2, 3, 4</td></tr>
          <tr><td>5–6</td><td>6, rồi 12</td><td>6, 12</td><td>$\hl{1, 2, 3, 4, 6, 12}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.6"]
        say: "Bước hai, ta chạy thuật toán qua từng lượt một. Lượt một, chỉ có số 1 không có ai đứng dưới, ta chọn 1. Lượt hai, bỏ 1 đi thì 2 và 3 đều trống bên dưới, ta chọn 2. Lượt ba, còn 3 và 4 trống, chọn 3. Lượt bốn, còn 4 và 6, chọn 4. Cuối cùng là 6 rồi 12, ta được hàng 1, 2, 3, 4, 6, 12."
      - clear: true
        show: |
          <p><b>Bước 3 — nhiều lựa chọn.</b> Hàng vừa xếp: $1, 2, 3, 4, 6, 12$.</p>
          <p class="note">Ở lượt có nhiều lựa chọn, chọn khác sẽ ra hàng khác: ví dụ 1, 3, 2, 6, 4, 12 cũng hợp lệ. Máy thử mọi cách xếp sáu số thành hàng, đếm được đúng <b>5</b> hàng hợp lệ.</p>
        focus: [1, 2, 2]
        say: "Bước ba, để ý hàng vừa xếp. Ở những lượt có nhiều lựa chọn, chọn khác sẽ ra hàng khác, ví dụ 1, 3, 2, 6, 4, 12 cũng hợp lệ. Máy thử mọi cách xếp sáu số thành một hàng và đếm được đúng 5 hàng hợp lệ."

  # ───────────────────────── 5. NHỎ NHẤT VÀ TỐI TIỂU ─────────────────────────
  - id: minimal
    kind: concept
    title: "Phần tử nhỏ nhất và phần tử tối tiểu"
    checks:
      - "[a for a in [2, 3, 4, 6] if not any(b != a and a % b == 0 for b in [2, 3, 4, 6])] == [2, 3]"
      - "[a for a in [2, 3, 4, 6] if all(b % a == 0 for b in [2, 3, 4, 6])] == []"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>nghĩa</th><th>trong $\{2, 3, 4, 6\}$</th></tr>
          <tr><td><b>tối tiểu</b></td><td>không có ai đứng <b>dưới</b> nó</td><td>2 và 3</td></tr>
          <tr><td><b>nhỏ nhất</b></td><td>đứng dưới <b>mọi</b> phần tử khác</td><td>không có</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Cần phân biệt hai khái niệm. Phần tử tối tiểu là phần tử không có ai đứng dưới nó, trong tập 2, 3, 4, 6 có hai phần tử tối tiểu là 2 và 3. Còn phần tử nhỏ nhất phải đứng dưới mọi phần tử khác, và tập này không có phần tử nào như vậy, vì 2 không là ước của 3."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm biểu đồ và hàng đã xếp"
    checks:
      - "(lambda p, S: [sum(1 for b in S if b != a and b % a == 0) for a in [1, 2, 3, 4, 6]] == [5, 3, 2, 1, 1] and all(p.index(a) < p.index(b) for a in S for b in S if a != b and b % a == 0))((1, 3, 2, 6, 4, 12), [1, 2, 3, 4, 6, 12])"
      - "5 + 3 + 2 + 1 + 1 == 12 and (1, 3, 2, 6, 4, 12).index(2) + 1 == 3 and (1, 3, 2, 6, 4, 12).index(4) + 1 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>câu hỏi</th></tr>
          <tr><td>cạnh</td><td>Phần tử dưới đúng là ước của phần tử trên, và <b>không</b> có phần tử nào ở giữa?</td></tr>
          <tr><td>hàng</td><td>Mỗi cặp so sánh được: phần tử nhỏ hơn có đứng <b>trước</b> không?</td></tr>
          <tr><td>vòng</td><td>Có chu trình (A cần B, B cần A) thì <b>không</b> có hàng hợp lệ nào.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba câu hỏi. Một, mỗi cạnh của biểu đồ có nối đúng hai phần tử liền kề, không có ai ở giữa không. Hai, với mỗi cặp so sánh được, trong hàng phần tử nhỏ hơn có đứng trước không. Ba, nếu ràng buộc tạo thành vòng, A cần B mà B lại cần A, thì không có hàng hợp lệ nào, vì không phần tử nào trong vòng được đứng đầu."
      - clear: true
        show: |
          <p><b>Đường khác — dò thẳng 12 cặp</b> trong hàng 1, 3, 2, 6, 4, 12 (không chạy lại thuật toán). Vị trí: 1 ở chỗ thứ nhất, 3 thứ hai, 2 thứ ba, 6 thứ tư, 4 thứ năm, 12 thứ sáu.</p>
          <table class="t"><tr><th>ước đứng trước bội?</th><th></th><th></th><th></th></tr>
          <tr><td>1 trước 2, 3, 4, 6, 12 ✓</td><td>2 trước 4 ✓</td><td>2 trước 6 ✓</td><td>2 trước 12 ✓</td></tr>
          <tr><td>3 trước 6 ✓</td><td>3 trước 12 ✓</td><td>4 trước 12 ✓</td><td>6 trước 12 ✓</td></tr></table>
          <p>Số cặp: $5 + 3 + 2 + 1 + 1 = 12$ — đủ 12 cặp, cặp nào cũng đúng chiều ✓</p>
        focus: [1, 1, 2, 2, 3]
        say: "Bây giờ kiểm bằng đường khác, ta dò thẳng từng cặp so sánh được trong hàng 1, 3, 2, 6, 4, 12, không chạy lại thuật toán. Ghi vị trí của mỗi số trong hàng trước, ví dụ 2 đứng thứ ba, 4 đứng thứ năm. Số 1 đứng trước cả năm số còn lại, nên năm cặp của số 1 đều đúng chiều. Hai đứng trước 4, 6, 12, còn 3 đứng trước 6 và 12, rồi 4 và 6 đều đứng trước 12. Cộng lại 5 cộng 3 cộng 2 cộng 1 cộng 1, bằng 12 cặp, đúng bằng số cặp của quan hệ, và cặp nào cũng đúng chiều."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="520" height="380" viewBox="0 0 520 380"><line x1="260" y1="330" x2="173" y2="237" stroke="#6b7280" stroke-width="4"/><line x1="260" y1="330" x2="347" y2="237" stroke="#6b7280" stroke-width="4"/><line x1="173" y1="237" x2="173" y2="143" stroke="#6b7280" stroke-width="4"/><line x1="173" y1="237" x2="347" y2="143" stroke="#6b7280" stroke-width="4"/><line x1="347" y1="237" x2="347" y2="143" stroke="#6b7280" stroke-width="4"/><line x1="173" y1="143" x2="260" y2="50" stroke="#6b7280" stroke-width="4"/><line x1="347" y1="143" x2="260" y2="50" stroke="#6b7280" stroke-width="4"/><line x1="260" y1="330" x2="173" y2="143" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/><line x1="260" y1="330" x2="260" y2="50" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/><circle cx="260" cy="330" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="260" y="341" font-size="30" text-anchor="middle">1</text><circle cx="173" cy="237" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="173" y="248" font-size="30" text-anchor="middle">2</text><circle cx="347" cy="237" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="347" y="248" font-size="30" text-anchor="middle">3</text><circle cx="173" cy="143" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="173" y="154" font-size="30" text-anchor="middle">4</text><circle cx="347" cy="143" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="347" y="154" font-size="30" text-anchor="middle">6</text><circle cx="260" cy="50" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="260" y="61" font-size="30" text-anchor="middle">12</text></svg></div>
          <div class="col"><div class="box warn"><b>Lỗi 1.</b> Vẽ cả cạnh suy ra được bằng bắc cầu <b class="red">(thừa)</b>
          <br><span class="note">Nét đứt đỏ 1–4, 1–12 là thừa: đã có đường đi lên 1–2–4 và 1–2–4–12.</span></div></div></div>
        focus: ["1.2", "1.1"]
        say: "Lỗi thứ nhất, vẽ cả các cạnh suy ra được bằng bắc cầu. Hai nét đứt màu đỏ nối 1 với 4 và 1 với 12 là thừa, vì đã có đường đi lên qua 2 và 4."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ mọi cặp đều so sánh được <b class="red">(sai)</b>
          <br><span class="note">2 và 3 không so sánh được theo quan hệ “là ước của”. Đó là điều làm thứ tự này “bộ phận”.</span></div>
        say: "Lỗi thứ hai, nghĩ mọi cặp đều so sánh được. Hai và ba không so sánh được theo quan hệ là ước của, chính điều đó làm thứ tự này là bộ phận."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn tối tiểu với nhỏ nhất <b class="red">(sai)</b>
          <br><span class="note">$\{2, 3, 4, 6\}$ có hai phần tử tối tiểu nhưng không có phần tử nhỏ nhất.</span></div>
        say: "Lỗi thứ ba, lẫn tối tiểu với nhỏ nhất. Tập 2, 3, 4, 6 có hai phần tử tối tiểu, nhưng không có phần tử nhỏ nhất."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ sắp xếp tô pô chỉ có một kết quả <b class="red">(sai)</b>
          <br><span class="note">Thường có nhiều hàng hợp lệ — ví dụ trên có 5. Chương trình nào chọn khác cũng vẫn đúng.</span></div>
        say: "Lỗi thứ tư, nghĩ sắp xếp tô pô chỉ có một kết quả. Thường có nhiều hàng hợp lệ, ví dụ trên có 5, nên hai chương trình cho hai hàng khác nhau vẫn có thể cùng đúng."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len([(a, b) for a in [1, 2, 4, 8] for b in [1, 2, 4, 8] if a != b and b % a == 0 and not any(c not in (a, b) and c % a == 0 and b % c == 0 for c in [1, 2, 4, 8])]) == 3"
      - "len([(a, b) for a in [1, 2, 4, 8] for b in [1, 2, 4, 8] if a != b and b % a == 0]) == 6"
      - "1 == len([p for p in __import__('itertools').permutations([1, 2, 4, 8]) if all(p.index(a) < p.index(b) for a in p for b in p if a != b and b % a == 0)])"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Vẽ biểu đồ thứ tự của “là ước của” trên $\{1, 2, 4, 8\}$. Có bao nhiêu cạnh?</td></tr>
          <tr><td>2</td><td>Tập đó có bao nhiêu cách sắp xếp tô pô? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, vẽ biểu đồ thứ tự của quan hệ là ước của trên tập 1, 2, 4, 8, có bao nhiêu cạnh? Câu hai, tập đó có bao nhiêu cách sắp xếp tô pô, vì sao? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <table class="t"><tr><th>cặp ước – bội</th><th>có số ở giữa?</th><th>vẽ cạnh?</th></tr>
          <tr><td>1 – 2, 2 – 4, 4 – 8</td><td>không</td><td>có</td></tr>
          <tr><td>1 – 4, 2 – 8</td><td>có (2, rồi 4)</td><td>không</td></tr>
          <tr><td>1 – 8</td><td>có (2 và 4)</td><td>không</td></tr></table>
          <p>① Một đường thẳng đứng 1 – 2 – 4 – 8: <b>3 cạnh</b>.</p>
        focus: [1, "1.2", ["1.3", "1.4"], 2]
        say: "Đáp án câu một, xét lần lượt mọi cặp ước và bội, tập này có 6 cặp như vậy. Ba cặp 1 và 2, 2 và 4, 4 và 8 không có số nào ở giữa, nên vẽ cạnh. Ba cặp còn lại đều có số ở giữa, ví dụ giữa 1 và 4 có 2, nên không vẽ. Biểu đồ là một đường thẳng đứng từ 1 lên 2, lên 4, lên 8, có 3 cạnh."
      - show: |
          <table class="t"><tr><th>lượt</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>chưa ai đứng dưới</td><td>1</td><td>2</td><td>4</td><td>8</td></tr></table>
          <p>② Chỉ <b>1</b> cách: mọi cặp đều so sánh được (đây là thứ tự toàn phần), nên mỗi lượt chỉ có một lựa chọn.</p>
        focus: [1, 2, 2]
        say: "Câu hai, chạy thuật toán thì mỗi lượt chỉ có đúng một phần tử không còn ai đứng dưới, lần lượt là 1, 2, 4, 8. Vì vậy chỉ có một cách. Lý do là mọi cặp đều so sánh được, đây là thứ tự toàn phần, nên mỗi lượt chỉ có đúng một lựa chọn."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">phản xạ + phản đối xứng + bắc cầu</span><span class="a">→</span>
          <span class="n">có cặp không so sánh được</span><span class="a">→</span>
          <span class="n">biểu đồ: chỉ cạnh liền kề</span><span class="a">→</span>
          <span class="n">tô pô: lấy dần phần tử tối tiểu</span></div>
        say: "Tổng kết lại, thứ tự bộ phận là quan hệ phản xạ, phản đối xứng, bắc cầu, và có thể có cặp không so sánh được. Biểu đồ thứ tự chỉ vẽ các cạnh liền kề. Sắp xếp tô pô lấy dần từng phần tử tối tiểu ra hàng."
      - show: |
          <div class="box key"><b>Tư duy:</b> lập lịch học, nấu một bữa ăn hay lắp một món đồ đều là sắp xếp tô pô các việc phụ thuộc nhau — và phải nhận ra khi ràng buộc tạo thành vòng.</div>
        say: "Điều cần mang theo, lập lịch học, nấu một bữa ăn hay lắp một món đồ đều là sắp xếp tô pô các việc phụ thuộc nhau, và phải nhận ra khi ràng buộc tạo thành vòng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>quy tắc đếm</b> — quy tắc cộng, quy tắc nhân, hoán vị và chỉnh hợp.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học các quy tắc đếm, quy tắc cộng, quy tắc nhân, hoán vị và chỉnh hợp. Hẹn gặp bạn ở bài tiếp theo."
