      - clear: true
        show: |
          <p>① Đếm bội số từ 1 đến 60 bằng cách lấy 60 chia:</p>
          <table class="t"><tr><th>chia hết cho</th><th>2</th><th>3</th><th>5</th><th>6</th><th>10</th><th>15</th><th>30</th></tr>
          <tr><td>số lượng</td><td>30</td><td>20</td><td>12</td><td>10</td><td>6</td><td>4</td><td>2</td></tr></table>
          <p>Ít nhất một: $30 + 20 + 12 - 10 - 6 - 4 + 2 = 44$. &nbsp; Còn lại $60 - 44 = \hl{16}$.</p>
        focus: [1, 2, 3, 3]
        say: "Đáp án câu một, trước hết đếm bội số từ 1 đến 60 bằng cách lấy 60 chia cho từng số. Ta được 30, 20, 12 số chia hết cho 2, 3, 5, và 10, 6, 4, 2 số chia hết cho 6, 10, 15, 30. Theo bao hàm loại trừ, số chia hết cho ít nhất một trong ba số là 30 cộng 20 cộng 12, trừ 10, 6, 4, cộng 2, bằng 44. Vậy còn lại 60 trừ 44, bằng 16 số."
      - clear: true
        show: |
          <p>② Với 5 người, nhân $\binom{5}{k}$ với $(5 - k)!$ rồi đặt dấu xen kẽ:</p>
          $$D_5 = 120 - 5 \times 24 + 10 \times 6 - 10 \times 2 + 5 \times 1 - 1 \times 1 = 120 - 120 + 60 - 20 + 5 - 1 = \hl{44}$$
        focus: [1, 2]
        say: "Câu hai, với 5 người, ta nhân số cách chọn k người với 5 trừ k giai thừa, rồi đặt dấu xen kẽ. D năm bằng 120 trừ 120 cộng 60 trừ 20 cộng 5 trừ 1, bằng 44."
