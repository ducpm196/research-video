id: L03
course: DMS
series: "DMS · Toán rời rạc"
title: "Bài 3 — Các kiểu chứng minh: trực tiếp, phản đảo, phản chứng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dms.yaml L03; K. Rosen, Discrete Mathematics and Its Applications, mục 1.7; đa thức n² + n + 41 (Euler, 1772) kiểm bằng máy trong checks"
assumes: [lnot, lto, equiv, forall, exists, in, naturals, rationals, set, dots]
# Quy ước: “n chẵn” nghĩa là n = 2k với k ∈ ℤ; “n lẻ” nghĩa là n = 2k + 1. ⇒ (\implies) đọc “suy ra” — bước lập luận,
#   khác phép toán → của bài 0. Không dùng dấu nhân chấm (chưa giới thiệu ở khoá DMS) — viết 2(…).
objectives:
  - "Phân biệt ví dụ và chứng minh"
  - "Viết chứng minh trực tiếp, chứng minh qua phản đảo, chứng minh phản chứng"
  - "Chứng minh căn 2 là số vô tỉ"
asr_reviewed:
  - {sentence: "Mỗi số đều nằm kẹp giữa hai số chính phương liền nhau, ví dụ 50 nằm giữa 49 và 64, nên không có a nguyên nào.", reason: "ASR chép “Mỗi số đời nằm kẹp giữa hai số chính phương liền nhau, ví dụ 50 nằm giữa 49 và 64, nên không có an nguyên nào.” (0.935): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đều/đời — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, giả sử căn 2 bằng a chia b, với phân số đã rút gọn tối giản.", reason: "chia/chi, phân/phần, rút/trúc, giản/giãn: ASR lẫn âm cuối, thanh; “phân số”, “tối giản” nghe đúng ở các câu khác của L03 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Định lý, tổng hai số lẻ là số chẵn.", reason: "chẵn/chẳng, lẻ/lẽ: ASR lẫn thanh ngã/hỏi — lặp ở nhiều câu L03 (mục tham khảo), “lẻ” khung 9 nghe đúng; NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "40 ví dụ đúng — rồi sai"
    checks:
      - "all((lambda m: m > 1 and all(m % d for d in range(2, int(m ** 0.5) + 1)))(n * n + n + 41) for n in range(40))"
      - "40 * 40 + 40 + 41 == 1681 == 41 * 41"
    steps:
      - show: |
          <p>Biểu thức $n^2 + n + 41$ với $n = 0, 1, 2, \dots, 39$: &nbsp; 41, 43, 47, 53, 61, … — <b>cả 40 giá trị đều là số nguyên tố</b>.</p>
          <p>Có thể kết luận “với mọi $n \in \mathbb{N}$ đều ra số nguyên tố” không?</p>
        focus: [1, 1, 2]
        say: "Chào bạn, thử biểu thức n bình phương cộng n cộng 41 với n từ 0 đến 39. Ta được 41, 43, 47, 53, và cả bốn mươi giá trị đều là số nguyên tố. Vậy có thể kết luận với mọi n đều ra số nguyên tố không?"
      - show: |
          <div class="box warn">$n = 40$: $\; 40^2 + 40 + 41 = 1681 = 41^2$ — <b>không</b> phải số nguyên tố.</div>
        say: "Không, với n bằng 40, ta được 1681, bằng 41 bình phương, không phải số nguyên tố. Bốn mươi ví dụ đúng vẫn không thay được một chứng minh, và hôm nay ta học ba cách chứng minh."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đặt thừa số chung, bình phương một tổng, phản đảo"
    checks:
      - "all(6 * k + 2 == 2 * (3 * k + 1) for k in range(-50, 51)) and 6 * 2 + 2 == 14 == 2 * 7"
      - "all((2 * k + 1) ** 2 == 4 * k * k + 4 * k + 1 for k in range(-50, 51)) and 7 ** 2 == 49 == 36 + 12 + 1"
      - "all(((not p) or q) == (q or (not p)) for p in (True, False) for q in (True, False))"
    steps:
      - show: |
          <p><b>Đặt thừa số chung</b>: mọi số hạng đều có thừa số 2 thì rút 2 ra ngoài ngoặc.</p>
          <table class="t"><tr><th>viết</th><th>thử $k = 2$</th></tr>
          <tr><td>$6k + 2 = 2(3k + 1)$</td><td>$12 + 2 = 14$ và $2(6 + 1) = 14$</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Trước khi vào bài, ta ôn ba việc sẽ dùng trong các chứng minh. Việc thứ nhất là đặt thừa số chung, mọi số hạng đều có thừa số 2 thì rút 2 ra ngoài ngoặc, 6k cộng 2 bằng 2 nhân 3k cộng 1. Thử với k bằng 2, vế trái bằng 12 cộng 2, bằng 14, vế phải bằng 2 nhân 7, cũng bằng 14."
      - clear: true
        show: |
          <p><b>Bình phương một tổng</b>: nhân phá ngoặc từng cặp.</p>
          <table class="t"><tr><th>viết</th><th>thử $k = 3$</th></tr>
          <tr><td>$(2k + 1)^2 = 4k^2 + 4k + 1$</td><td>$7^2 = 49$ và $36 + 12 + 1 = 49$</td></tr></table>
        focus: [1, "2.1", "2.2"]
        say: "Việc thứ hai là bình phương một tổng, ta nhân phá ngoặc từng cặp. Hai k cộng 1, bình phương lên, được 4k bình phương cộng 4k cộng 1. Thử với k bằng 3, vế trái là 7 bình phương, bằng 49, vế phải là 36 cộng 12 cộng 1, cũng bằng 49."
      - clear: true
        show: |
          <table class="t"><tr><th>đã học</th><th>nhắc lại</th></tr>
          <tr><td>bài 1</td><td>$p \to q \equiv \neg q \to \neg p$ — chứng minh phản đảo là chứng minh câu gốc</td></tr>
          <tr><td>bài 2</td><td>phủ định “với mọi $n$, … ” là “tồn tại $n$ không …”</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Việc thứ ba là hai điều đã học. Ở bài 1, kéo theo luôn tương đương với phản đảo, nên chứng minh được phản đảo là chứng minh được câu gốc. Ở bài 2, phủ định của với mọi n là tồn tại một n không thoả."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: suy ra ⇒, số nguyên ℤ, chẵn và lẻ"
    checks:
      - "all(n % 2 == 0 for n in (2 * k for k in range(-20, 21)))"
      - "all(n % 2 == 1 for n in (2 * k + 1 for k in range(-20, 21)))"
    steps:
      - show: |
          <p>$A \implies B$: đọc “A suy ra B” — một <b>bước lập luận</b>: biết A đúng thì khẳng định được B đúng.</p>
        introduces: [implies]
        say: "Mũi tên đôi đọc là suy ra. A suy ra B là một bước lập luận, đã biết A đúng thì khẳng định được B cũng đúng."
      - show: |
          <p>$\mathbb{Z} = \{\dots, -2, -1, 0, 1, 2, \dots\}$: tập số nguyên.</p>
          <p>$n$ <b>chẵn</b> nghĩa là $n = 2k$ với một $k \in \mathbb{Z}$; &nbsp; $n$ <b>lẻ</b> nghĩa là $n = 2k + 1$.</p>
          <p class="note">Ví dụ: $14 = 2(7)$ chẵn; $\; 7 = 2(3) + 1$ lẻ.</p>
        introduces: [integers]
        focus: [1, 2, 3]
        say: "Chữ Z in đậm kép là tập số nguyên, gồm cả số âm. Số n chẵn nghĩa là n bằng 2 nhân một số nguyên k, còn n lẻ nghĩa là n bằng 2k cộng 1. Ví dụ, 14 bằng 2 nhân 7 nên chẵn, 7 bằng 2 nhân 3 cộng 1 nên lẻ."

  # ───────────────────────── 3. CHỨNG MINH TRỰC TIẾP ─────────────────────────
  - id: direct
    kind: concept
    title: "Chứng minh trực tiếp: từ giả thiết đi thẳng tới kết luận"
    checks:
      - "all((2 * a + 1) + (2 * b + 1) == 2 * (a + b + 1) for a in range(-30, 31) for b in range(-30, 31))"
      - "(2 * 3 + 1) + (2 * 4 + 1) == 16 == 2 * (3 + 4 + 1)"
    steps:
      - show: |
          <p><b>Định lý</b>: tổng hai số lẻ là số chẵn.</p>
          <table class="t"><tr><th>bước</th><th>viết</th><th>lý do</th></tr>
          <tr><td>①</td><td>lấy hai số lẻ bất kỳ: $m = 2a + 1$, $\; n = 2b + 1$ với $a, b \in \mathbb{Z}$</td><td>định nghĩa số lẻ</td></tr>
          <tr><td>②</td><td>$m + n = 2a + 2b + 2 = 2(a + b + 1)$</td><td>cộng, rồi đặt 2 ra ngoài</td></tr>
          <tr><td>③</td><td>$a + b + 1$ là số nguyên, nên $m + n$ có dạng $2k$ $\implies$ $m + n$ chẵn</td><td>định nghĩa số chẵn</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4"]
        say: "Định lý, tổng hai số lẻ là số chẵn. Bước một, lấy hai số lẻ bất kỳ, theo định nghĩa viết m bằng 2a cộng 1, n bằng 2b cộng 1. Chữ bất kỳ rất quan trọng, vì ta chứng minh cho mọi cặp, không chọn riêng cặp nào. Bước hai, cộng lại rồi đặt 2 ra ngoài, được 2 nhân a cộng b cộng 1. Bước ba, vì a cộng b cộng 1 là số nguyên, nên tổng có dạng 2k, tức là số chẵn."
      - show: |
          <p>Làm thử ngay bằng số: $a = 3$, $b = 4$ cho $7 + 9 = 16 = 2(3 + 4 + 1)$ ✓</p>
        say: "Làm thử ngay bằng số, a bằng 3 và b bằng 4 cho 7 cộng 9 bằng 16, đúng bằng 2 nhân 8. Ví dụ này chỉ để kiểm tra phép biến đổi, phần chứng minh là ba bước ở trên."

  # ───────────────────────── 4. PHẢN ĐẢO ─────────────────────────
  - id: contrapositive
    kind: concept
    title: "Chứng minh qua phản đảo"
    checks:
      - "all((2 * k + 1) ** 2 == 2 * (2 * k * k + 2 * k) + 1 for k in range(-50, 51))"
      - "all((n * n % 2 == 0) <= (n % 2 == 0) for n in range(-200, 201))"
      - "7 ** 2 == 49 == 2 * (2 * 9 + 2 * 3) + 1"
    steps:
      - show: |
          <p><b>Định lý</b>: nếu $n^2$ chẵn thì $n$ chẵn.</p>
          <p class="note">Đi thẳng khó: biết $n^2 = 2k$ thì chưa nói được gì ngay về $n$.</p>
          <p>Bài 1: $p \to q \equiv \neg q \to \neg p$. &nbsp; Nên chứng minh <b>phản đảo</b>: nếu $n$ lẻ thì $n^2$ lẻ.</p>
        focus: [1, 2, 3]
        say: "Định lý, nếu n bình phương chẵn thì n chẵn. Đi thẳng thì khó, vì biết n bình phương bằng 2k chưa cho ta biết gì ngay về n. Ở bài 1, ta đã thấy kéo theo luôn tương đương với phản đảo, nên ta chứng minh phản đảo, nếu n lẻ thì n bình phương lẻ."
      - show: |
          <table class="t"><tr><th>bước</th><th>viết</th><th>lý do</th></tr>
          <tr><td>①</td><td>$n$ lẻ $\implies n = 2k + 1$</td><td>định nghĩa số lẻ</td></tr>
          <tr><td>②</td><td>$n^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1$</td><td>bình phương một tổng, đặt 2 ra ngoài</td></tr>
          <tr><td>③</td><td>$2k^2 + 2k$ là số nguyên $\implies n^2$ lẻ. Phản đảo đúng, nên định lý đúng.</td><td>định nghĩa số lẻ; bài 1</td></tr></table>
          <p class="note">Thử: $k = 3$, $n = 7$: $\; 49 = 2(18 + 6) + 1$ ✓</p>
        focus: ["1.2", "1.3", "1.4", "1.4", 2]
        say: "Bước một, n lẻ nên viết n bằng 2k cộng 1. Bước hai, bình phương lên, được 4k bình phương cộng 4k cộng 1, rồi đặt 2 ra ngoài phần đầu. Bước ba, phần trong ngoặc là số nguyên, nên n bình phương có dạng 2 nhân một số cộng 1, tức là lẻ. Phản đảo đúng, nên định lý ban đầu đúng. Thử với k bằng 3, n bằng 7, 49 đúng bằng 2 nhân 24 cộng 1."

  # ───────────────────────── 5. PHẢN CHỨNG ─────────────────────────
  - id: contradiction
    kind: concept
    title: "Chứng minh phản chứng: căn 2 là số vô tỉ"
    checks:
      - "not any(a * a == 2 * b * b for b in range(1, 2000) for a in (__import__('math').isqrt(2 * b * b),))"
      - "all((2 * c) ** 2 == 4 * c * c for c in range(50))"
    steps:
      - show: |
          <p><b>Ý tưởng phản chứng</b>: giả sử điều cần chứng minh là <b>sai</b>, rồi suy ra một điều vô lý (mâu thuẫn). Vậy giả sử sai.</p>
          <p><b>Định lý</b>: $\sqrt{2}$ không viết được thành phân số, tức là $\sqrt{2} \notin \mathbb{Q}$ (đọc “không thuộc”).</p>
        introduces: [notin]
        focus: [1, 1, 2]
        say: "Cách thứ ba là phản chứng. Ta giả sử điều cần chứng minh là sai, rồi suy luận cho tới khi gặp một điều vô lý. Định lý, căn 2 không viết được thành phân số, tức là căn 2 không thuộc tập Q."
      - show: |
          <table class="t"><tr><th>bước</th><th>viết</th></tr>
          <tr><td>①</td><td>Giả sử $\sqrt{2} = \frac{a}{b}$, phân số <b>tối giản</b> ($a$, $b$ không cùng chia hết cho 2 — rút gọn trước là được).</td></tr>
          <tr><td>②</td><td>Bình phương: $2 = \frac{a^2}{b^2} \implies a^2 = 2b^2 \implies a^2$ chẵn $\implies a$ chẵn (định lý vừa chứng minh).</td></tr>
          <tr><td>③</td><td>Viết $a = 2c$: $\; 4c^2 = 2b^2 \implies b^2 = 2c^2 \implies b$ cũng chẵn.</td></tr>
          <tr><td>④</td><td>$a$ và $b$ cùng chẵn — <b>mâu thuẫn</b> với “tối giản”. Vậy $\sqrt{2}$ vô tỉ.</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.4", "1.5"]
        say: "Bước một, giả sử căn 2 bằng a chia b, với phân số đã rút gọn tối giản. Bước hai, bình phương hai vế rồi nhân chéo, được a bình phương bằng 2 b bình phương, nên a bình phương chẵn. Theo định lý ta vừa chứng minh qua phản đảo, a cũng chẵn. Bước ba, thay a bằng 2c rồi chia hai vế cho 2, được b bình phương bằng 2c bình phương, nên b cũng chẵn. Bước bốn, a và b cùng chẵn, mâu thuẫn với tối giản, vậy căn 2 là số vô tỉ."
      - show: |
          <p class="note">Máy kiểm: không có cặp $a$, $b$ với $b$ từ 1 đến 1999 thoả $a^2 = 2b^2$ — phù hợp, nhưng <b>chứng minh</b> mới bao trùm mọi $b$.</p>
        say: "Máy cũng kiểm, không có cặp a, b nào với b từ 1 đến 1999 thoả a bình phương bằng 2 b bình phương. Kết quả phù hợp, nhưng chỉ chứng minh mới bao trùm được mọi b."

  # ───────────────────────── 5b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ba con đường: xuất phát ở đâu, về đích ở đâu"
    steps:
      - show: |
          <div><svg width="1480" height="340" viewBox="0 0 1480 340"><text x="20" y="78" font-size="24" font-weight="700" fill="#374151">trực tiếp</text><rect x="200" y="44" width="330" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="365" y="78" font-size="22" text-anchor="middle">m, n lẻ</text><line x1="536" y1="70" x2="582" y2="70" stroke="#6b7280" stroke-width="3"/><polygon points="594,70 580,62 580,78" fill="#6b7280"/><rect x="600" y="44" width="330" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="765" y="78" font-size="22" text-anchor="middle">m + n = 2(a + b + 1)</text><line x1="936" y1="70" x2="982" y2="70" stroke="#6b7280" stroke-width="3"/><polygon points="994,70 980,62 980,78" fill="#6b7280"/><rect x="1000" y="44" width="260" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1130" y="78" font-size="22" text-anchor="middle">m + n chẵn</text><text x="20" y="188" font-size="24" font-weight="700" fill="#374151">phản đảo</text><rect x="200" y="154" width="330" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="365" y="188" font-size="22" text-anchor="middle">n lẻ</text><line x1="536" y1="180" x2="582" y2="180" stroke="#6b7280" stroke-width="3"/><polygon points="594,180 580,172 580,188" fill="#6b7280"/><rect x="600" y="154" width="330" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="765" y="188" font-size="22" text-anchor="middle">n² = 2(2k² + 2k) + 1</text><line x1="936" y1="180" x2="982" y2="180" stroke="#6b7280" stroke-width="3"/><polygon points="994,180 980,172 980,188" fill="#6b7280"/><rect x="1000" y="154" width="260" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1130" y="188" font-size="22" text-anchor="middle">n² lẻ</text><text x="20" y="298" font-size="24" font-weight="700" fill="#374151">phản chứng</text><rect x="200" y="264" width="330" height="52" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/><text x="365" y="298" font-size="22" text-anchor="middle">giả sử căn 2 = a/b tối giản</text><line x1="536" y1="290" x2="582" y2="290" stroke="#6b7280" stroke-width="3"/><polygon points="594,290 580,282 580,298" fill="#6b7280"/><rect x="600" y="264" width="330" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="765" y="298" font-size="22" text-anchor="middle">a chẵn và b chẵn</text><line x1="936" y1="290" x2="982" y2="290" stroke="#6b7280" stroke-width="3"/><polygon points="994,290 980,282 980,298" fill="#6b7280"/><rect x="1000" y="264" width="260" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1130" y="298" font-size="22" text-anchor="middle">mâu thuẫn</text><text x="1280" y="186" font-size="20" fill="#15803d">tương đương câu gốc</text><text x="1280" y="210" font-size="20" fill="#15803d">“n² chẵn thì n chẵn”</text><text x="1280" y="298" font-size="20" fill="#b91c1c">nên giả sử là sai</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này đặt ba kiểu chứng minh cạnh nhau, mỗi kiểu là một con đường từ trái sang phải. Chứng minh trực tiếp xuất phát từ giả thiết, hai số lẻ, và về đích ở kết luận, tổng chẵn. Chứng minh qua phản đảo xuất phát từ phủ định của kết luận, n lẻ, và về đích ở phủ định của giả thiết, n bình phương lẻ. Theo bài 1, con đường này tương đương với câu gốc. Chứng minh phản chứng xuất phát từ giả sử điều cần chứng minh là sai, và về đích ở một mâu thuẫn, nên giả sử ấy phải bỏ."

  # ───────────────────────── 6. VÍ DỤ: CHỌN CÁCH ─────────────────────────
  - id: example
    kind: example
    title: "Chọn cách chứng minh: nếu 3n + 2 lẻ thì n lẻ"
    checks:
      - "all((3 * n + 2) % 2 == 0 for n in range(-100, 101, 2))"
      - "all(3 * (2 * k) + 2 == 2 * (3 * k + 1) for k in range(-50, 51))"
      - "all(((3 * n + 2) % 2 == 1) <= (n % 2 == 1) for n in range(-200, 201))"
      - "3 * 4 + 2 == 14 == 2 * 7"
    steps:
      - show: |
          <p><b>Định lý</b>: với $n \in \mathbb{Z}$, nếu $3n + 2$ lẻ thì $n$ lẻ.</p>
          <p>Đi thẳng: $3n + 2 = 2k + 1$ — khó rút ra $n$. &nbsp; <b>Phản đảo</b>: nếu $n$ chẵn thì $3n + 2$ chẵn.</p>
        focus: [1, 2, 2]
        say: "Ví dụ, với n nguyên, nếu 3n cộng 2 lẻ thì n lẻ. Đi thẳng thì khó, vì từ 3n cộng 2 bằng 2k cộng 1 không dễ rút ra n. Ta chọn phản đảo, nếu n chẵn thì 3n cộng 2 chẵn."
      - show: |
          <table class="t"><tr><th>bước</th><th>viết</th><th>lý do</th></tr>
          <tr><td>①</td><td>$n$ chẵn $\implies n = 2k$</td><td>định nghĩa số chẵn</td></tr>
          <tr><td>②</td><td>$3n + 2 = 6k + 2 = 2(3k + 1)$, và $3k + 1 \in \mathbb{Z}$ $\implies 3n + 2$ chẵn</td><td>đặt 2 ra ngoài</td></tr></table>
          <p class="note">Thử: $n = 4$, $k = 2$: $\; 14 = 2(7)$ ✓; phản đảo đúng nên định lý đúng.</p>
        focus: ["1.2", "1.3", 2]
        say: "Bước một, n chẵn nên n bằng 2k. Bước hai, thay vào được 6k cộng 2, đặt 2 ra ngoài thành 2 nhân 3k cộng 1, vì 3k cộng 1 là số nguyên nên 3n cộng 2 chẵn. Thử với n bằng 4, ta được 14 bằng 2 nhân 7, phản đảo đúng nên định lý đúng."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm một chứng minh"
    checks:
      - "[3 * n + 2 for n in range(-2, 4)] == [-4, -1, 2, 5, 8, 11] and [(3 * n + 2) % 2 == 1 for n in range(-2, 4)] == [n % 2 == 1 for n in range(-2, 4)]"
      - "[2 * b * b for b in range(1, 6)] == [2, 8, 18, 32, 50] and all(__import__('math').isqrt(2 * b * b) ** 2 < 2 * b * b < (__import__('math').isqrt(2 * b * b) + 1) ** 2 for b in range(1, 6))"
      - "[(__import__('math').isqrt(2 * b * b) ** 2, (__import__('math').isqrt(2 * b * b) + 1) ** 2) for b in range(1, 6)] == [(1, 4), (4, 9), (16, 25), (25, 36), (49, 64)]"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>vì sao</th></tr>
          <tr><td>Mỗi dấu $\implies$ có lý do không?</td><td>định nghĩa, phép biến đổi, hay định lý đã có</td></tr>
          <tr><td>Có lấy “bất kỳ” không, hay chọn riêng một số?</td><td>chọn riêng chỉ là một ví dụ</td></tr>
          <tr><td>Đang chứng minh câu gốc, phản đảo, hay lỡ chứng minh <b>đảo</b>?</td><td>đảo không tương đương gốc</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm một chứng minh bằng ba câu hỏi. Một, mỗi dấu suy ra có lý do không, là định nghĩa, một phép biến đổi, hay một định lý đã có. Hai, ta có lấy phần tử bất kỳ không, hay chỉ chọn riêng một số, vì chọn riêng thì chỉ là ví dụ. Ba, ta đang chứng minh câu gốc hay phản đảo, hay lỡ chứng minh mệnh đề đảo."
      - clear: true
        show: |
          <p><b>Đường khác 1 — dò thẳng các số nhỏ</b> cho “nếu $3n + 2$ lẻ thì $n$ lẻ”:</p>
          <table class="t"><tr><th>$n$</th><th>âm 2</th><th>âm 1</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>$3n + 2$</td><td>âm 4</td><td>âm 1</td><td>2</td><td>5</td><td>8</td><td>11</td></tr>
          <tr><td>$3n + 2$ lẻ?</td><td>không</td><td>có</td><td>không</td><td>có</td><td>không</td><td>có</td></tr>
          <tr><td>$n$ lẻ?</td><td>không</td><td>có</td><td>không</td><td>có</td><td>không</td><td>có</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ kiểm định lý của ví dụ bằng một đường khác, dò thẳng các số nhỏ từ âm 2 đến 3. Thay từng n vào 3n cộng 2, được âm 4, âm 1, 2, 5, 8 và 11. Ba giá trị lẻ là âm 1, 5 và 11. Đúng ba cột đó có n lẻ, là âm 1, 1 và 3. Bảng khớp với định lý, nhưng nhớ rằng dò sáu số chỉ là kiểm tra, chứng minh mới bao trùm mọi n."
      - clear: true
        show: |
          <p><b>Đường khác 2 — thử bước ② của chứng minh căn 2</b>: có $a$ nào để $a^2 = 2b^2$ không?</p>
          <table class="t"><tr><th>$b$</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>$2b^2$</td><td>2</td><td>8</td><td>18</td><td>32</td><td>50</td></tr>
          <tr><td>hai bình phương kẹp hai bên</td><td>1, 4</td><td>4, 9</td><td>16, 25</td><td>25, 36</td><td>49, 64</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Đường khác thứ hai, thử bước hai của chứng minh căn 2 với b từ 1 đến 5. Hai b bình phương lần lượt bằng 2, 8, 18, 32 và 50. Mỗi số đều nằm kẹp giữa hai số chính phương liền nhau, ví dụ 50 nằm giữa 49 và 64, nên không có a nguyên nào. Kết quả khớp với mâu thuẫn mà chứng minh đã chỉ ra cho mọi b."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "[n * n + n + 41 for n in (38, 39, 40)] == [1523, 1601, 1681] and 1681 == 41 * 41"
      - "all(all(m % d for d in range(2, int(m ** 0.5) + 1)) for m in (1523, 1601))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thử nhiều ví dụ rồi kết luận “với mọi” <b class="red">(sai)</b>
          <br><span class="note">$n^2 + n + 41$ đúng 40 lần liền rồi sai. Một phản ví dụ bác bỏ được, nghìn ví dụ không khẳng định được.</span></div>
          <table class="t"><tr><th>$n$</th><th>38</th><th>39</th><th>40</th></tr>
          <tr><td>$n^2 + n + 41$</td><td>1523 (nguyên tố)</td><td>1601 (nguyên tố)</td><td>$\hl{1681 = 41 \times 41}$</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, thử nhiều ví dụ rồi kết luận với mọi. Biểu thức đầu bài đúng bốn mươi lần liền rồi sai, một phản ví dụ bác bỏ được, còn nghìn ví dụ không khẳng định được."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chứng minh mệnh đề đảo thay cho câu gốc <b class="red">(sai)</b>
          <br><span class="note">Muốn “nếu $n^2$ chẵn thì $n$ chẵn” mà chứng minh “nếu $n$ chẵn thì $n^2$ chẵn” — đó là câu khác.</span></div>
        say: "Lỗi thứ hai, chứng minh mệnh đề đảo thay cho câu gốc. Cần chứng minh nếu n bình phương chẵn thì n chẵn, mà lại chứng minh nếu n chẵn thì n bình phương chẵn, đó là một câu khác."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng chính điều cần chứng minh làm một bước <b class="red">(lập luận vòng)</b>
          <br><span class="note">“$\sqrt{2}$ vô tỉ vì nó không viết được thành phân số” chỉ là nói lại định lý, chưa chứng minh gì.</span></div>
        say: "Lỗi thứ ba, dùng chính điều cần chứng minh làm một bước, gọi là lập luận vòng. Nói căn 2 vô tỉ vì nó không viết được thành phân số, chỉ là nói lại định lý, chưa chứng minh gì."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Phản chứng mà giả sử sai điều phủ định <b class="red">(sai)</b>
          <br><span class="note">Phủ định của “với mọi $n$ …” là “tồn tại $n$ không …” (bài 2), không phải “với mọi $n$ không …”.</span></div>
        say: "Lỗi thứ tư, khi phản chứng lại phủ định sai điều cần chứng minh. Như bài 2, phủ định của với mọi n là tồn tại một n không thoả, chứ không phải với mọi n đều không thoả."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all((2 * k) ** 2 == 2 * (2 * k * k) for k in range(-50, 51))"
      - "all(((5 * n + 1) % 2 == 0) <= (n % 2 == 1) for n in range(-200, 201))"
      - "all(5 * (2 * k) + 1 == 2 * (5 * k) + 1 for k in range(-50, 51))"
      - "6 ** 2 == 36 == 2 * 18 and 5 * 4 + 1 == 21 == 2 * 10 + 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chứng minh trực tiếp: nếu $n$ chẵn thì $n^2$ chẵn.</td></tr>
          <tr><td>2</td><td>Chọn cách và chứng minh: nếu $5n + 1$ chẵn thì $n$ lẻ.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chứng minh trực tiếp, nếu n chẵn thì n bình phương chẵn. Câu hai, tự chọn cách và chứng minh, nếu 5n cộng 1 chẵn thì n lẻ. Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>viết</th><th>lý do</th></tr>
          <tr><td>①</td><td>$n = 2k$</td><td>định nghĩa số chẵn</td></tr>
          <tr><td>②</td><td>$n^2 = 4k^2 = 2(2k^2)$</td><td>bình phương, đặt 2 ra ngoài</td></tr>
          <tr><td>③</td><td>$2k^2 \in \mathbb{Z}$ $\implies n^2$ chẵn</td><td>định nghĩa số chẵn</td></tr></table>
          <p class="note">Thử: $k = 3$, $n = 6$: $36 = 2(18)$ ✓</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Đáp án câu một, bước một, n chẵn nên theo định nghĩa n bằng 2k. Bước hai, bình phương lên được 4k bình phương, viết thành 2 nhân 2k bình phương. Bước ba, vì 2k bình phương là số nguyên nên n bình phương chẵn. Thử với k bằng 3, n bằng 6, ta có 36 bằng 2 nhân 18."
      - clear: true
        show: |
          <p>② Đi thẳng từ “$5n + 1$ chẵn” khó rút ra $n$ → chọn <b>phản đảo</b>: nếu $n$ chẵn thì $5n + 1$ lẻ.</p>
          <table class="t"><tr><th>bước</th><th>viết</th><th>lý do</th></tr>
          <tr><td>①</td><td>$n = 2k$</td><td>định nghĩa số chẵn</td></tr>
          <tr><td>②</td><td>$5n + 1 = 10k + 1 = 2(5k) + 1$ — lẻ ✓</td><td>đặt 2 ra ngoài; $5k \in \mathbb{Z}$</td></tr></table>
          <p class="note">Thử: $n = 4$: $5 \times 4 + 1 = 21 = 2(10) + 1$, lẻ ✓</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Câu hai, đi thẳng từ 5n cộng 1 chẵn thì khó rút ra n, nên ta chọn phản đảo, nếu n chẵn thì 5n cộng 1 lẻ. Bước một, n chẵn nên n bằng 2k. Bước hai, thay vào được 10k cộng 1, bằng 2 nhân 5k cộng 1, vì 5k là số nguyên nên đây là số lẻ. Thử với n bằng 4, ta được 21, bằng 2 nhân 10 cộng 1, đúng là số lẻ."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ví dụ không phải chứng minh</span><span class="a">→</span>
          <span class="n">trực tiếp: giả thiết $\implies$ kết luận</span><span class="a">→</span>
          <span class="n">phản đảo: $\neg q \implies \neg p$</span><span class="a">→</span>
          <span class="n">phản chứng: giả sử sai $\implies$ mâu thuẫn</span></div>
        say: "Tổng kết lại, ví dụ không phải chứng minh. Chứng minh trực tiếp đi từ giả thiết tới kết luận. Chứng minh qua phản đảo, từ không q suy ra không p. Chứng minh phản chứng, giả sử điều cần chứng minh sai rồi suy ra mâu thuẫn."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi đi thẳng bị kẹt, thử phản đảo; khi cần chứng tỏ “không tồn tại”, thử phản chứng.</div>
        say: "Điều cần mang theo, khi đi thẳng bị kẹt thì thử phản đảo, còn khi cần chứng tỏ một thứ không tồn tại thì thử phản chứng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>quy nạp toán học</b> — chứng minh cho mọi $n$ bằng một bước cơ sở và một bước “truyền” từ $n$ sang $n + 1$.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học quy nạp toán học, cách chứng minh cho mọi n bằng một bước cơ sở và một bước truyền từ n sang n cộng 1. Hẹn gặp bạn ở bài tiếp theo."
