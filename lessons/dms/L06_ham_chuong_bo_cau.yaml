        <p><b>Đề</b>: viết <code>ham.py</code> phân loại năm hàm cho sẵn là đơn ánh, toàn ánh hay song ánh, rồi liệt kê MỌI cách chọn 7 số, và 6 số, từ 1 đến 12 để đếm bao nhiêu cách có hai số tổng 13 (năm hàm và định dạng ở <code>labs/DMS/L06/de.md</code>).</p><p class="note">Số liệu khác ví dụ trong bài. Dự đoán trước: chọn 7 số thì cách nào cũng có cặp tổng 13 không? Chọn 6 số thì sao?</p>
      focus:
      - 1
      - 1
      - 1
      - 2
      - 1
