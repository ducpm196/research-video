# Quy ước: hàm viết $f\colon A \to B$; mũi tên ở đây là “đi từ A sang B”, KHÁC phép kéo theo của bài 0 — step notation_note nói rõ.
#   Không dùng ký hiệu làm tròn lên: chuồng bồ câu tổng quát nói bằng lời và phản chứng.
objectives:
  - "Phân loại một hàm là đơn ánh, toàn ánh, song ánh"
  - "Phát biểu và chứng minh nguyên lý chuồng bồ câu"
  - "Dùng chuồng bồ câu để chứng minh va chạm tất yếu"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "367 người và 366 ngày"
    checks:
      - "367 > 366 and 11 > 10"
    steps:
      - show: |
          <p>Một năm có nhiều nhất 366 ngày (năm nhuận). Trong 367 người, có chắc chắn <b>hai người trùng ngày sinh</b> không?</p>
          <p>Bảng băm (dãy ô; một quy tắc gọi là hàm băm chỉ mỗi khoá tới một ô) có 10 ô, ta cất 11 khoá. Có chắc chắn hai khoá rơi vào <b>cùng một ô</b> không?</p>
        focus: [1, 1, 2, 2]
        say: "Chào bạn, một năm có nhiều nhất 366 ngày, kể cả năm nhuận. Trong 367 người, có chắc chắn hai người trùng ngày sinh không? Một bảng băm, tức một dãy ô mà máy tính dùng quy tắc gọi là hàm băm để chỉ mỗi khoá tới một ô, có 10 ô, và ta cất vào 11 khoá. Có chắc chắn hai khoá rơi vào cùng một ô không?"
      - show: |
          <div class="box key">Cả hai đều <b>chắc chắn</b> — không cần biết ai sinh ngày nào, hay hàm băm là gì. Hôm nay: hàm, và nguyên lý chuồng bồ câu.</div>
        say: "Cả hai đều chắc chắn, mà không cần biết ai sinh ngày nào hay hàm băm là gì. Hôm nay ta học về hàm, và nguyên lý chuồng bồ câu giải thích vì sao."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đếm phần tử, nhân để chặn tổng, cặp bù"
    checks:
      - "len({1, 2, 3}) == 3 and len({'a', 'b'}) == 2"
      - "2 * 12 == 24 and 24 < 25 and 1 * 10 == 10 and 10 < 11"
      - "all(k + (11 - k) == 11 for k in range(1, 11)) and 11 - 3 == 8"
    steps:
      - show: |
          <table class="t"><tr><th>tập</th><th>liệt kê</th><th>số phần tử</th></tr>
          <tr><td>$A$</td><td>$\{1, 2, 3\}$</td><td>$|A| = 3$</td></tr>
          <tr><td>$B$</td><td>$\{a, b\}$</td><td>$|B| = 2$</td></tr></table>
        focus: [0, 0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn ba việc nhỏ sẽ dùng đến. Việc thứ nhất là đếm số phần tử của một tập, viết bằng hai vạch đứng như ở bài 5. Tập A gồm 1, 2, 3 nên có 3 phần tử. Tập B gồm a và b nên có 2 phần tử."
      - clear: true
        show: |
          <table class="t"><tr><th>mỗi nhóm nhiều nhất</th><th>số nhóm</th><th>tổng nhiều nhất</th><th>so với</th></tr>
          <tr><td>1</td><td>10</td><td>1 × 10 = 10</td><td>10 nhỏ hơn 11</td></tr>
          <tr><td>2</td><td>12</td><td>2 × 12 = 24</td><td>24 nhỏ hơn 25</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Việc thứ hai là chặn một tổng bằng phép nhân. Nếu có 10 nhóm và mỗi nhóm nhiều nhất 1 thứ, thì cả thảy nhiều nhất 1 nhân 10, bằng 10 thứ, nhỏ hơn 11. Nếu có 12 nhóm và mỗi nhóm nhiều nhất 2 thứ, thì cả thảy nhiều nhất 2 nhân 12, bằng 24, nhỏ hơn 25."
      - clear: true
        show: |
          <table class="t"><tr><th>số $k$</th><th>số bù $11 - k$</th><th>tổng</th></tr>
          <tr><td>1</td><td>10</td><td>11</td></tr>
          <tr><td>3</td><td>8</td><td>11</td></tr>
          <tr><td>5</td><td>6</td><td>11</td></tr></table>
        focus: [1, "1.3", 0]
        say: "Việc thứ ba là tìm số bù để được tổng 11, ta lấy 11 trừ đi số đó. Ví dụ số 3 có số bù là 11 trừ 3, bằng 8. Bảng cho thấy mỗi số từ 1 đến 10 có đúng một số bù, và lát nữa các cặp bù này sẽ thành những cái chuồng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_func
    kind: symbol
    title: "Giải mã: hàm f: A → B"
    checks:
      - "{1: 'b', 2: 'a', 3: 'b'}[3] == 'b'"
    steps:
      - show: |
          <p>$f\colon A \to B$: <b>hàm</b> $f$ đi từ tập $A$ sang tập $B$ — gán cho <b>mỗi</b> $x \in A$ <b>đúng một</b> giá trị $f(x) \in B$, gọi là <b>ảnh</b> của $x$.</p>
          <p>Ví dụ $A = \{1, 2, 3\}$, $B = \{a, b\}$: &nbsp; $f(1) = b$, $\; f(2) = a$, $\; f(3) = b$.</p>
        introduces: [func]
        focus: [1, 1, 2]
        say: "Viết f, dấu hai chấm, A mũi tên B, nghĩa là hàm f đi từ tập A sang tập B. Hàm gán cho mỗi phần tử x của A đúng một giá trị f của x nằm trong B, gọi là ảnh của x. Ví dụ A gồm 1, 2, 3 và B gồm a, b, với f của 1 là b, f của 2 là a, f của 3 là b."
      - show: |
          <div class="box warn">Mũi tên trong $f\colon A \to B$ nghĩa là “đi từ A sang B”, <b>khác</b> phép kéo theo $p \to q$ của bài 0. Dấu hai chấm sau tên hàm báo hiệu nghĩa này.</div>
        notation_note: true
        say: "Chú ý, mũi tên trong cách viết hàm nghĩa là đi từ A sang B, khác với phép kéo theo ở bài 0. Dấu hai chấm sau tên hàm báo hiệu ta đang nói về hàm."

  # ───────────────────────── 3. BA LOẠI HÀM ─────────────────────────
  - id: kinds
    kind: concept
    title: "Đơn ánh, toàn ánh, song ánh"
    checks:
      - "len(set({1: 'a', 2: 'b', 3: 'c'}.values())) == 3"
      - "set({1: 'b', 2: 'a', 3: 'b'}.values()) == {'a', 'b'}"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>nghĩa</th><th>bằng lời</th></tr>
          <tr><td><b>đơn ánh</b></td><td>$x_1 \neq x_2 \implies f(x_1) \neq f(x_2)$</td><td>không có hai phần tử chung một ảnh</td></tr>
          <tr><td><b>toàn ánh</b></td><td>$\forall y \in B\ \exists x \in A: f(x) = y$</td><td>mọi phần tử của $B$ đều được “trúng”</td></tr>
          <tr><td><b>song ánh</b></td><td>vừa đơn ánh vừa toàn ánh</td><td>ghép cặp một–một, không thừa không thiếu</td></tr></table>
        introduces: [sub]
        focus: ["1.2", "1.2", "1.3", "1.4"]
        say: "Có ba loại hàm quan trọng. Đơn ánh, hai phần tử khác nhau luôn cho hai giá trị khác nhau, chỉ số dưới 1 và 2 chỉ để phân biệt hai phần tử. Toàn ánh, mọi phần tử y của B đều là ảnh của ít nhất một x. Song ánh, vừa đơn ánh vừa toàn ánh, tức là ghép cặp một với một, không thừa không thiếu."
      - show: |
          <p>Hàm ví dụ ở trên, $f(1) = b, f(2) = a, f(3) = b$: <b>không</b> đơn ánh (1 và 3 cùng ảnh $b$), nhưng <b>là</b> toàn ánh (cả $a$, $b$ đều được trúng).</p>
          <p>Hàm $g\colon \{1, 2, 3\} \to \{a, b, c\}$ với $g(1) = a, g(2) = b, g(3) = c$: song ánh.</p>
        focus: [1, 1, 2]
        say: "Hàm ví dụ ở trên không phải đơn ánh, vì 1 và 3 cùng có ảnh là b. Nhưng nó là toàn ánh, vì cả a và b đều được trúng. Còn hàm g ghép 1 với a, 2 với b, 3 với c là một song ánh."
      - show: |
          <div class="box key">Với tập hữu hạn: đơn ánh $\implies |A| \le |B|$; &nbsp; toàn ánh $\implies |A| \ge |B|$; &nbsp; song ánh $\implies |A| = |B|$.</div>
        say: "Với tập hữu hạn, có đơn ánh thì A không nhiều phần tử hơn B, vì mỗi phần tử của A chiếm riêng một ảnh. Có toàn ánh thì A không ít hơn B, còn có song ánh thì hai tập có cùng số phần tử."

  # ───────────────────────── 4. CHUỒNG BỒ CÂU ─────────────────────────
  - id: pigeonhole
    kind: concept
    title: "Nguyên lý chuồng bồ câu"
    checks:
      - "1 * 10 < 11 and 2 * 12 < 25"
    steps:
      - show: |
          <div class="box key">Xếp $n + 1$ con bồ câu vào $n$ chuồng thì có ít nhất một chuồng chứa <b>từ 2 con trở lên</b>.</div>
          <p>Bằng ngôn ngữ hàm: nếu $|A| \gt |B|$ thì <b>không</b> có đơn ánh $f\colon A \to B$.</p>
        focus: [1, 2]
        say: "Nguyên lý chuồng bồ câu, xếp n cộng 1 con bồ câu vào n chuồng thì có ít nhất một chuồng chứa từ 2 con trở lên. Nói bằng ngôn ngữ hàm, nếu A nhiều phần tử hơn B thì không có đơn ánh nào từ A sang B."
      - show: |
          <p><b>Chứng minh</b> (phản chứng, bài 3): giả sử mọi chuồng chứa nhiều nhất 1 con. Khi đó tổng số bồ câu $\le n$ — mâu thuẫn với $n + 1$ con.</p>
          <p><b>Dạng tổng quát</b>: 25 bạn, 12 tháng → có tháng có <b>ít nhất 3</b> bạn sinh, vì nếu mỗi tháng nhiều nhất 2 thì tổng nhiều nhất 24.</p>
          <table class="t"><tr><th>giả sử mỗi tháng nhiều nhất</th><th>tổng nhiều nhất</th><th>thực tế</th><th>kết luận</th></tr>
          <tr><td>2 bạn</td><td>2 × 12 = 24</td><td>25 bạn</td><td>mâu thuẫn → có tháng ít nhất 3</td></tr></table>
        focus: [1, 1, 2, 3]
        say: "Chứng minh bằng phản chứng như bài 3, tức là giả sử điều ngược lại rồi tìm mâu thuẫn. Giả sử mọi chuồng chứa nhiều nhất một con, khi đó tổng số bồ câu không quá n, mâu thuẫn với n cộng 1 con. Dạng tổng quát, 25 bạn với 12 tháng thì có tháng có ít nhất 3 bạn sinh. Vì nếu mỗi tháng nhiều nhất 2 bạn thì tổng nhiều nhất là 24."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chuồng là các cặp bù, bồ câu là số được chọn"
    checks:
      - "[sum(v in pr for v in [1, 3, 4, 6, 8, 9]) for pr in [(1, 10), (2, 9), (3, 8), (4, 7), (5, 6)]] == [1, 1, 2, 1, 1]"
      - "[(a, b) for a in [1, 3, 4, 6, 8, 9] for b in [1, 3, 4, 6, 8, 9] if a < b and a + b == 11] == [(3, 8)]"
    steps:
      - show: |
          <div><svg width="1440" height="330" viewBox="0 0 1440 330"><text x="720" y="40" font-size="26" text-anchor="middle">chọn 6 số: 1, 3, 4, 6, 8, 9 — mỗi số bay vào chuồng chứa nó</text><text x="175" y="95" font-size="24" text-anchor="middle" fill="#2563eb">chuồng 1 và 10</text><rect x="60" y="110" width="230" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><circle cx="175" cy="180" r="30" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="175" y="190" font-size="28" text-anchor="middle">1</text><text x="445" y="95" font-size="24" text-anchor="middle" fill="#2563eb">chuồng 2 và 9</text><rect x="330" y="110" width="230" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><circle cx="445" cy="180" r="30" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="445" y="190" font-size="28" text-anchor="middle">9</text><text x="715" y="95" font-size="24" text-anchor="middle" fill="#dc2626">chuồng 3 và 8</text><rect x="600" y="110" width="230" height="140" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/><circle cx="675" cy="180" r="30" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="675" y="190" font-size="28" text-anchor="middle">3</text><circle cx="755" cy="180" r="30" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="755" y="190" font-size="28" text-anchor="middle">8</text><text x="985" y="95" font-size="24" text-anchor="middle" fill="#2563eb">chuồng 4 và 7</text><rect x="870" y="110" width="230" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><circle cx="985" cy="180" r="30" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="985" y="190" font-size="28" text-anchor="middle">4</text><text x="1255" y="95" font-size="24" text-anchor="middle" fill="#2563eb">chuồng 5 và 6</text><rect x="1140" y="110" width="230" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><circle cx="1255" cy="180" r="30" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="1255" y="190" font-size="28" text-anchor="middle">6</text><text x="720" y="300" font-size="25" text-anchor="middle" fill="#dc2626" font-weight="700">6 số, 5 chuồng: chuồng 3 và 8 nhận 2 số, và 3 + 8 = 11</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy cơ chế của nguyên lý trên một lần chọn cụ thể, chọn 1, 3, 4, 6, 8 và 9. Năm cái chuồng là năm cặp bù, và mỗi số được chọn bay vào cái chuồng chứa nó. Có 6 số mà chỉ có 5 chuồng, nên không thể mỗi chuồng một số, và ở đây chuồng 3 và 8 nhận hai số. Hai số chung một chuồng thì là cặp bù của nhau, nên tổng bằng 11."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chọn 6 số từ 1 đến 10: chắc có hai số tổng bằng 11"
    checks:
      - "all(any(a + b == 11 for a, b in __import__('itertools').combinations(s, 2)) for s in __import__('itertools').combinations(range(1, 11), 6))"
      - "any(all(a + b != 11 for a, b in __import__('itertools').combinations(s, 2)) for s in __import__('itertools').combinations(range(1, 11), 5))"
      - "[(k, 11 - k) for k in range(1, 6)] == [(1, 10), (2, 9), (3, 8), (4, 7), (5, 6)]"
    steps:
      - show: |
          <p><b>Bài toán</b>: chọn 6 số khác nhau từ 1 đến 10. Chứng minh có hai số có tổng bằng 11.</p>
          <p><b>Bước 1 — chuồng</b>: 5 cặp bù — mỗi số từ 1 đến 10 thuộc đúng một cặp.</p>
          <table class="t"><tr><th>chuồng</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>cặp</td><td>$\{1, 10\}$</td><td>$\{2, 9\}$</td><td>$\{3, 8\}$</td><td>$\{4, 7\}$</td><td>$\{5, 6\}$</td></tr></table>
        focus: [1, 2, 3]
        say: "Bài toán, chọn 6 số khác nhau từ 1 đến 10, chứng minh có hai số có tổng bằng 11. Bước một, cũng là bước khó nhất, là chọn chuồng. Ta lấy 5 cặp có tổng 11, và theo bảng số bù, mỗi số từ 1 đến 10 thuộc đúng một cặp."
      - show: |
          <p><b>Bước 2 — bồ câu</b>: 6 số được chọn; mỗi số vào cặp chứa nó. Đếm: 6 bồ câu, 5 chuồng, $6 \gt 5$.</p>
        say: "Bước hai, bồ câu là 6 số được chọn, và mỗi số vào đúng cái cặp chứa nó. Đếm lại, có 6 bồ câu mà chỉ có 5 chuồng, nên số bồ câu lớn hơn số chuồng."
      - show: |
          <p><b>Bước 3 — kết luận</b>: 6 con vào 5 chuồng $\implies$ có một cặp chứa cả hai số được chọn — tổng của chúng bằng 11.</p>
        say: "Bước ba, theo nguyên lý chuồng bồ câu, sáu con vào năm chuồng nên có một cặp chứa cả hai số được chọn. Hai số đó là cặp bù của nhau, nên tổng của chúng bằng 11."
      - show: |
          <p class="note">Máy kiểm cả 210 cách chọn 6 số: cách nào cũng có cặp tổng 11 ✓. Với 5 số thì <b>không</b> chắc: chọn 1, 2, 3, 4, 5.</p>
        focus: [1, 1]
        say: "Bước bốn, máy kiểm cả 210 cách chọn 6 số, cách nào cũng có một cặp tổng 11. Với 5 số thì không chắc, ví dụ chọn 1, 2, 3, 4, 5, vì năm con vào năm chuồng thì có thể mỗi chuồng một con."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm khi dùng chuồng bồ câu"
    checks:
      - "all(any(x + y == 11 for y in [1, 2, 3, 4, 5]) for x in [6, 7, 8, 9, 10]) and all(x + y != 11 for x in [1, 2, 3, 4, 5] for y in [1, 2, 3, 4, 5])"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>ở ví dụ</th></tr>
          <tr><td>Bồ câu là gì, chuồng là gì, mỗi bồ câu vào đúng một chuồng?</td><td>6 số; 5 cặp bù</td></tr>
          <tr><td>Số bồ câu có thật sự <b>lớn hơn</b> số chuồng? Bằng nhau thì chưa đủ.</td><td>6 lớn hơn 5</td></tr>
          <tr><td>“Hai bồ câu chung chuồng” có đúng là điều bài cần?</td><td>chung cặp nên tổng 11</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba câu hỏi. Một, chỉ rõ bồ câu là gì, chuồng là gì, và mỗi bồ câu vào đúng một chuồng. Hai, số bồ câu có thật sự lớn hơn số chuồng không, vì bằng nhau thì chưa đủ. Ba, kết luận hai bồ câu chung chuồng có đúng là điều bài cần không."
      - clear: true
        show: |
          <p><b>Đường khác — cố tình né tổng 11.</b> Lấy mỗi cặp một số: 1, 2, 3, 4, 5 (đã 5 số, chưa có tổng 11). Số thứ sáu là gì cũng dính:</p>
          <table class="t"><tr><th>số thứ sáu</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
          <tr><td>ghép với</td><td>5</td><td>4</td><td>3</td><td>2</td><td>1</td></tr>
          <tr><td>tổng</td><td>11</td><td>11</td><td>11</td><td>11</td><td>11</td></tr></table>
        focus: [1, 1, 2, 2]
        say: "Bây giờ kiểm bằng đường khác, ta thử cố tình né tổng 11. Lấy mỗi cặp một số, chẳng hạn 1, 2, 3, 4, 5, được 5 số mà chưa có tổng 11. Số thứ sáu chỉ còn là 6, 7, 8, 9 hoặc 10. Số nào cũng ghép với một số đã có để thành 11, ví dụ 6 với 5, 10 với 1, nên lần né này thất bại, đúng như nguyên lý đã báo trước."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "366 + 1 == 367 and not (366 > 366)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ chuồng bồ câu chỉ ra <b>chuồng nào</b> bị trùng <b class="red">(sai)</b>
          <br><span class="note">Nó chỉ nói <b>có</b> chuồng trùng. Muốn biết ở đâu thì vẫn phải tìm.</span></div>
        say: "Lỗi thứ nhất, nghĩ nguyên lý chuồng bồ câu chỉ ra chuồng nào bị trùng. Nó chỉ nói có một chuồng trùng, muốn biết ở đâu thì vẫn phải tìm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đếm sai số chuồng <b class="red">(sai)</b>
          <br><span class="note">Ngày sinh có 366 khả năng (tính 29 tháng 2), nên cần 367 người — 366 người chưa chắc trùng.</span></div>
          <table class="t"><tr><th>số người</th><th>số chuồng</th><th>chắc chắn trùng?</th></tr>
          <tr><td>366</td><td>366</td><td>chưa — có thể mỗi người một ngày</td></tr>
          <tr><td>367</td><td>366</td><td>chắc chắn</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, đếm sai số chuồng. Ngày sinh có 366 khả năng nếu tính ngày 29 tháng 2, nên cần 367 người mới chắc chắn trùng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ “có va chạm” là hàm băm tồi <b class="red">(sai)</b>
          <br><span class="note">Va chạm: hai khoá rơi vào cùng một ô. Nhiều khoá hơn số ô thì <b>mọi</b> hàm băm đều có va chạm. Hàm băm tốt chỉ làm va chạm phân tán đều.</span></div>
        say: "Lỗi thứ ba, thấy va chạm, tức là hai khoá rơi vào cùng một ô, là cho rằng hàm băm tồi. Khi số khoá nhiều hơn số ô thì mọi hàm băm đều có va chạm, hàm băm tốt chỉ làm va chạm phân bố đều."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lẫn đơn ánh với toàn ánh <b class="red">(sai)</b>
          <br><span class="note">Đơn ánh: không ai chung ảnh. Toàn ánh: không phần tử nào của $B$ bị bỏ sót. Hai điều kiện độc lập nhau.</span></div>
        say: "Lỗi thứ tư, lẫn đơn ánh với toàn ánh. Đơn ánh là không có hai phần tử chung ảnh, toàn ánh là không bỏ sót phần tử nào của B, hai điều kiện này độc lập nhau."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len({2 * x for x in range(-50, 51)}) == 101 and 1 not in {2 * x for x in range(-50, 51)}"
      - "12 + 1 == 13 and [2 * x for x in (-1, 0, 1, 2)] == [-2, 0, 2, 4] and all(2 * x != 1 for x in range(-100, 101))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hàm $f\colon \mathbb{Z} \to \mathbb{Z}$, $f(x) = 2x$ có là đơn ánh không? Toàn ánh không?</td></tr>
          <tr><td>2</td><td>Cần ít nhất bao nhiêu người để chắc chắn có hai người sinh cùng tháng?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hàm f của x bằng 2x từ tập số nguyên sang tập số nguyên có là đơn ánh không, có là toàn ánh không? Câu hai, cần ít nhất bao nhiêu người để chắc chắn có hai người sinh cùng tháng? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Đơn ánh?</b> Giả sử $f(x_1) = f(x_2)$, tức $2x_1 = 2x_2$; chia hai vế cho 2: $x_1 = x_2$ ✓ — đơn ánh.</p>
          <table class="t"><tr><th>$x$</th><th>-1</th><th>0</th><th>1</th><th>2</th></tr>
          <tr><td>$f(x) = 2x$</td><td>-2</td><td>0</td><td>2</td><td>4</td></tr></table>
          <p><b>Toàn ánh?</b> Không: $2x = 1$ cho $x = \frac{1}{2}$, không phải số nguyên — số lẻ 1 không được trúng.</p>
        focus: [1, 1, 2, 3]
        say: "Đáp án câu một, xét đơn ánh trước. Giả sử f của x một bằng f của x hai, tức 2x một bằng 2x hai, chia hai vế cho 2 được x một bằng x hai, nên hàm là đơn ánh. Bảng vài giá trị cho thấy ảnh toàn là số chẵn, âm 2, 0, 2, 4. Vì vậy hàm không là toàn ánh, vì muốn 2x bằng 1 thì x phải là một phần hai, không phải số nguyên."
      - show: |
          <p>② 12 tháng là 12 chuồng. 12 người: có thể mỗi người một tháng. 13 người $= 12 + 1$ bồ câu → <b>chắc chắn</b> có hai người cùng tháng. Đáp số: 13.</p>
        say: "Câu hai, 12 tháng là 12 chuồng. Với 12 người thì vẫn có thể mỗi người một tháng, nên chưa chắc. Với 13 người, tức 12 cộng 1 bồ câu, theo nguyên lý thì chắc chắn có hai người cùng tháng, nên đáp số là 13."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hàm: mỗi $x$ đúng một $f(x)$</span><span class="a">→</span>
          <span class="n">đơn ánh, toàn ánh, song ánh</span><span class="a">→</span>
          <span class="n">$|A| \gt |B|$: không có đơn ánh</span><span class="a">→</span>
          <span class="n">chuồng bồ câu: chắc chắn có trùng</span></div>
        say: "Tổng kết lại, hàm gán cho mỗi x đúng một giá trị. Có ba loại, đơn ánh, toàn ánh và song ánh. Khi A nhiều phần tử hơn B thì không có đơn ánh, đó chính là nguyên lý chuồng bồ câu, chắc chắn có trùng."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi cần chứng minh “chắc chắn có trùng”, hãy tìm đúng bộ chuồng — đó là phần sáng tạo của lời giải.</div>
        say: "Điều cần mang theo, khi cần chứng minh chắc chắn có trùng, hãy tìm đúng bộ chuồng, đó là phần sáng tạo của lời giải."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>quan hệ</b> — phản xạ, đối xứng, bắc cầu, và chia một tập thành các lớp tương đương.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học quan hệ, với ba tính chất phản xạ, đối xứng, bắc cầu, và cách chia một tập thành các lớp tương đương. Hẹn gặp bạn ở bài tiếp theo."
