# Quy ước: chân trị viết Đ (đúng), S (sai) trên bảng; lời đọc nói “đúng”, “sai”. Kéo theo viết →, khi và chỉ khi viết ↔ — đây là PHÉP TOÁN
#   lôgic; dấu ⇒ (suy ra trong lập luận) chưa dùng ở bài này.
objectives:
  - "Nhận biết một câu có phải mệnh đề không"
  - "Lập bảng chân trị cho phủ định, và, hoặc, kéo theo, khi và chỉ khi"
  - "Giải thích vì sao p → q đúng khi p sai"
asr_reviewed:
  - {sentence: "Từ điểm bắt đầu, p tách thành hai nhánh, đúng hoặc sai, rồi ở mỗi nhánh q lại tách đôi, nên có 2 nhân 2, bằng 4 lá, mỗi lá là một dòng của bảng.", reason: "ASR chép “Từ điểm bắt đầu, t tách thành hai nhánh, đúng hoặc sai, rồi ở mỗi nhánh quy lại tắt đôi, nền có hai nhân hai, bằng bốn lá, mỗi lá là một dòng của bảng.” (0.914): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: tách/tắt, nên/nền — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đường khác thứ hai, đếm lại công thức 2 mũ 3 bằng cách liệt kê ba mệnh đề p, q, r.", reason: "ASR chép “Đường khác thứ hai, đếm lại công thức hai mũ ba bằng cách liệt kê ba mệnh DP, Q, R.” (0.927): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đề (trong “đề p” → “dp”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, tôi hứa rằng nếu trời mưa thì tôi mang ô.", reason: "“ô” (cái ô) bị ASR chép “o” — từ một âm tiết cuối câu, cả hai mô hình chép khác dấu; nghĩa rõ từ hình (lời hứa “mang ô” trên màn hình)"}
  - {sentence: "Dấu chữ V ngược đọc là và, p và q chỉ đúng khi cả hai cùng đúng, tức dòng đầu.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t (pe, t, tệ), không phải TTS đọc sai; chữ hiện trên màn hình"}
  - {sentence: "Dấu chữ V đọc là hoặc, p hoặc q chỉ sai khi cả hai cùng sai, tức dòng cuối.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t (pe, t, tệ), không phải TTS đọc sai; chữ hiện trên màn hình"}
  - {sentence: "Để ý dòng thứ hai, p đúng, q sai, nên và cho sai nhưng hoặc cho đúng.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t (pe, t, tệ), không phải TTS đọc sai; chữ hiện trên màn hình; “nên” → “nền” là cặp thanh dễ lẫn của ASR"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tôi có nói sai không?"
    steps:
      - show: |
          <div class="box key">“Nếu trời mưa thì tôi mang ô.”</div>
          <p>Hôm nay trời <b>không</b> mưa, và tôi <b>không</b> mang ô. Lời hứa có bị phá không?</p>
          <p class="note">Máy tính cũng phải trả lời đúng những câu như vậy trong mọi câu lệnh <code>if</code>.</p>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, tôi hứa rằng nếu trời mưa thì tôi mang ô. Hôm nay trời không mưa, và tôi cũng không mang ô. Vậy lời hứa có bị phá không? Máy tính cũng phải trả lời đúng những câu như thế này trong mọi câu lệnh điều kiện."
      - show: |
          <p>Hôm nay: <b>mệnh đề</b> là gì, năm phép toán ghép mệnh đề, và cách dùng <b>bảng chân trị</b> để trả lời chắc chắn.</p>
        say: "Hôm nay ta học mệnh đề là gì, năm phép toán ghép các mệnh đề lại, và cách dùng bảng chân trị để trả lời câu hỏi đó một cách chắc chắn."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chẵn lẻ, nhân đôi, liệt kê mọi trường hợp"
    checks:
      - "6 % 2 == 0 and 7 % 2 == 1 and 7 == 2 * 3 + 1"
      - "2 ** 1 == 2 and 2 ** 2 == 2 * 2 == 4 and 2 ** 3 == 2 * 2 * 2 == 8"
      - "len([(a, b) for a in ('bật', 'tắt') for b in ('bật', 'tắt')]) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>chia cho 2</th><th>số dư</th><th>kết luận</th></tr>
          <tr><td>6</td><td>6 = 2 × 3</td><td>0</td><td>chẵn</td></tr>
          <tr><td>7</td><td>7 = 2 × 3 + 1</td><td>1</td><td>lẻ</td></tr></table>
        focus: [0, 0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn ba việc nhỏ sẽ dùng đến. Việc thứ nhất là xem một số chẵn hay lẻ, bằng cách chia cho 2 rồi nhìn số dư. Số 6 bằng 2 nhân 3, dư 0, nên 6 là số chẵn. Số 7 bằng 2 nhân 3 cộng 1, dư 1, nên 7 là số lẻ."
      - show: |
          <table class="t"><tr><th>viết gọn</th><th>nghĩa</th><th>kết quả</th></tr>
          <tr><td>$2^1$</td><td>một số 2</td><td>2</td></tr>
          <tr><td>$2^2$</td><td>2 × 2</td><td>4</td></tr>
          <tr><td>$2^3$</td><td>2 × 2 × 2</td><td>8</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Việc thứ hai là nhân đôi liên tiếp, viết gọn là 2 mũ n, nghĩa là nhân n số 2 với nhau. Hai mũ một chỉ là 2. Hai mũ hai bằng 2 nhân 2, bằng 4. Hai mũ ba bằng 2 nhân 2 nhân 2, bằng 8."
      - clear: true
        show: |
          <p>Hai công tắc, mỗi cái <b>bật</b> hoặc <b>tắt</b>. Liệt kê theo thứ tự cố định, cái thứ nhất đổi chậm, cái thứ hai đổi nhanh:</p>
          <table class="t"><tr><th>công tắc 1</th><th>công tắc 2</th></tr>
          <tr><td>bật</td><td>bật</td></tr><tr><td>bật</td><td>tắt</td></tr>
          <tr><td>tắt</td><td>bật</td></tr><tr><td>tắt</td><td>tắt</td></tr></table>
        focus: [1, 2, 2, 0]
        say: "Việc thứ ba là liệt kê đủ mọi trường hợp, không sót, không trùng. Có hai công tắc, mỗi cái bật hoặc tắt. Ta cho công tắc thứ nhất đổi chậm, công tắc thứ hai đổi nhanh, được bốn dòng, bật bật, bật tắt, tắt bật, tắt tắt. Lát nữa, bảng chân trị được lập đúng theo cách này."

  # ───────────────────────── 2. KÝ HIỆU: MỆNH ĐỀ ─────────────────────────
  - id: sym_prop
    kind: symbol
    title: "Giải mã: mệnh đề và chân trị"
    checks:
      - "2 + 3 == 5 and 7 % 2 == 1"
    steps:
      - show: |
          <div class="box key"><b>Mệnh đề</b>: một câu khẳng định có chân trị xác định — hoặc đúng (Đ), hoặc sai (S), không thể cả hai.</div>
          <table class="t"><tr><th>câu</th><th>mệnh đề?</th></tr>
          <tr><td>2 + 3 = 5</td><td>có, Đ</td></tr>
          <tr><td>7 là số chẵn</td><td>có, S</td></tr>
          <tr><td>x lớn hơn 3</td><td>không — chưa biết x</td></tr>
          <tr><td>Hãy đóng cửa lại!</td><td>không — câu mệnh lệnh</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Mệnh đề là một câu khẳng định có chân trị xác định, hoặc đúng, hoặc sai, không thể cả hai. Câu 2 cộng 3 bằng 5 là mệnh đề đúng. Câu 7 là số chẵn cũng là mệnh đề, nhưng sai. Câu x lớn hơn 3 chưa phải mệnh đề, vì chưa biết x là bao nhiêu. Còn câu hãy đóng cửa lại là câu mệnh lệnh, không đúng cũng không sai."
      - show: |
          <p>Ta đặt tên mệnh đề bằng chữ thường: $p$, $q$, $r$. &nbsp; Ví dụ $p$: “trời mưa”, $q$: “tôi mang ô”.</p>
        say: "Để viết gọn, ta đặt tên mệnh đề bằng chữ cái thường, như p, q, r. Ví dụ p là trời mưa, q là tôi mang ô."

  # ───────────────────────── 3. KÝ HIỆU: PHỦ ĐỊNH, VÀ, HOẶC ─────────────────────────
  - id: sym_ops
    kind: symbol
    title: "Giải mã: phủ định ¬, và ∧, hoặc ∨"
    checks:
      - "[(p and q) for p in (True, False) for q in (True, False)] == [True, False, False, False]"
      - "[(p or q) for p in (True, False) for q in (True, False)] == [True, True, True, False]"
    steps:
      - show: |
          <p>$\neg p$ (đọc “không p”): đổi chân trị — $p$ đúng thì $\neg p$ sai, và ngược lại.</p>
        introduces: [lnot]
        say: "Phép toán thứ nhất là phủ định, viết bằng dấu móc nhỏ trước p, đọc là không p. Nó đổi chân trị, p đúng thì không p sai, p sai thì không p đúng."
      - show: |
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$p \land q$ (và)</th><th>$p \lor q$ (hoặc)</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>Đ</td><td>S</td><td>S</td><td>Đ</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td><td>Đ</td></tr>
          <tr><td>S</td><td>S</td><td>S</td><td>S</td></tr></table>
        introduces: [land, lor]
        focus: ["1.1", "1.2", "1.5", "1.3"]
        say: "Hai mệnh đề có bốn khả năng, mỗi khả năng là một dòng của bảng chân trị. Dấu chữ V ngược đọc là và, p và q chỉ đúng khi cả hai cùng đúng, tức dòng đầu. Dấu chữ V đọc là hoặc, p hoặc q chỉ sai khi cả hai cùng sai, tức dòng cuối. Để ý dòng thứ hai, p đúng, q sai, nên và cho sai nhưng hoặc cho đúng."
      - show: |
          <div class="box warn">Trong toán và trong lập trình, “hoặc” là <b>hoặc bao hàm</b>: cả hai cùng đúng thì $p \lor q$ vẫn đúng (dòng đầu).</div>
        say: "Lưu ý, trong toán và trong lập trình, hoặc là hoặc bao hàm, cả hai cùng đúng thì vẫn đúng, như dòng đầu của bảng. Nó khác chữ hoặc trong câu nói đời thường kiểu, chọn trà hoặc cà phê."

  # ───────────────────────── 4. KÉO THEO ─────────────────────────
  - id: implication
    kind: concept
    title: "Kéo theo p → q: một lời hứa"
    checks:
      - "[((not p) or q) for p in (True, False) for q in (True, False)] == [True, False, True, True]"
    steps:
      - show: |
          <table class="t"><tr><th>$p$ (mưa)</th><th>$q$ (mang ô)</th><th>$p \to q$</th><th>vì sao</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>mưa, có mang ô: giữ lời</td></tr>
          <tr><td>Đ</td><td>S</td><td>$\hl{\text{S}}$</td><td>mưa mà không mang ô: phá lời hứa</td></tr>
          <tr><td>S</td><td>Đ</td><td>Đ</td><td>không mưa, vẫn mang ô: lời hứa không cấm</td></tr>
          <tr><td>S</td><td>S</td><td>Đ</td><td>không mưa, không mang ô: lời hứa không bị phá</td></tr></table>
        introduces: [lto]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Mũi tên từ p sang q đọc là p kéo theo q, giống một lời hứa, nếu p thì q. Dòng đầu, trời mưa và tôi mang ô, tôi giữ lời. Dòng hai, trời mưa mà tôi không mang ô, đây là trường hợp duy nhất lời hứa bị phá, nên kéo theo sai. Dòng ba, không mưa mà vẫn mang ô, lời hứa không hề cấm điều đó. Dòng bốn, không mưa và không mang ô, lời hứa cũng không bị phá."
      - show: |
          <div class="box key">$p \to q$ chỉ sai khi $p$ đúng mà $q$ sai. Khi $p$ sai, $p \to q$ <b>luôn đúng</b> — gọi là đúng hiển nhiên.</div>
        say: "Tóm lại, p kéo theo q chỉ sai khi p đúng mà q sai. Khi p sai, kéo theo luôn đúng, người ta gọi là đúng hiển nhiên. Đó chính là câu trả lời cho câu hỏi đầu bài, lời hứa không bị phá."

  # ───────────────────────── 5. KHI VÀ CHỈ KHI ─────────────────────────
  - id: bicond
    kind: concept
    title: "Khi và chỉ khi p ↔ q"
    checks:
      - "[(p == q) for p in (True, False) for q in (True, False)] == [True, False, False, True]"
    steps:
      - show: |
          <p>$p \leftrightarrow q$ (đọc “p khi và chỉ khi q”): đúng khi $p$ và $q$ <b>cùng chân trị</b>.</p>
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$p \leftrightarrow q$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td></tr><tr><td>Đ</td><td>S</td><td>S</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td></tr><tr><td>S</td><td>S</td><td>Đ</td></tr></table>
        introduces: [lbic]
        focus: [1, ["2.2", "2.5"], ["2.3", "2.4"]]
        say: "Mũi tên hai chiều đọc là p khi và chỉ khi q, nó đúng khi p và q có cùng chân trị. Vì vậy dòng đầu và dòng cuối cho đúng. Hai dòng giữa, một bên đúng một bên sai, cho sai."

  # ───────────────────────── 5b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cây chọn chân trị: mỗi lá là một dòng"
    checks:
      - "2 * 2 == 4 and [((not p) or q) for p in (True, False) for q in (True, False)].count(False) == 1"
    steps:
      - show: |
          <div><svg width="1440" height="380" viewBox="0 0 1440 380"><line x1="200" y1="190" x2="380" y2="100" stroke="#6b7280" stroke-width="3"/><line x1="200" y1="190" x2="380" y2="280" stroke="#6b7280" stroke-width="3"/><line x1="520" y1="100" x2="710" y2="55" stroke="#6b7280" stroke-width="3"/><line x1="520" y1="100" x2="710" y2="145" stroke="#6b7280" stroke-width="3"/><line x1="520" y1="280" x2="710" y2="235" stroke="#6b7280" stroke-width="3"/><line x1="520" y1="280" x2="710" y2="325" stroke="#6b7280" stroke-width="3"/><rect x="60" y="166" width="140" height="48" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="130" y="199" font-size="24" text-anchor="middle">bắt đầu</text><rect x="380" y="76" width="140" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="450" y="109" font-size="24" text-anchor="middle">p = Đ</text><rect x="380" y="256" width="140" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="450" y="289" font-size="24" text-anchor="middle">p = S</text><rect x="710" y="31" width="140" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="780" y="64" font-size="24" text-anchor="middle">q = Đ</text><text x="875" y="63" font-size="23" fill="#15803d">dòng đầu: kéo theo đúng</text><rect x="710" y="121" width="140" height="48" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="780" y="154" font-size="24" text-anchor="middle">q = S</text><text x="875" y="153" font-size="23" fill="#dc2626" font-weight="700">dòng thứ hai: SAI — mưa mà không mang ô</text><rect x="710" y="211" width="140" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="780" y="244" font-size="24" text-anchor="middle">q = Đ</text><text x="875" y="243" font-size="23" fill="#15803d">dòng thứ ba: kéo theo đúng</text><rect x="710" y="301" width="140" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="780" y="334" font-size="24" text-anchor="middle">q = S</text><text x="875" y="333" font-size="23" fill="#15803d">dòng thứ tư: kéo theo đúng</text><text x="130" y="262" font-size="22" text-anchor="middle" fill="#6b7280">2 nhánh rồi 2 nhánh</text><text x="130" y="292" font-size="22" text-anchor="middle" fill="#6b7280">2 × 2 = 4 lá = 4 dòng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy bảng chân trị từ đâu ra. Từ điểm bắt đầu, p tách thành hai nhánh, đúng hoặc sai, rồi ở mỗi nhánh q lại tách đôi, nên có 2 nhân 2, bằng 4 lá, mỗi lá là một dòng của bảng. Với phép kéo theo, chỉ có đúng một lá màu đỏ, là p đúng mà q sai, tức trời mưa mà không mang ô. Ba lá còn lại đều cho kéo theo đúng, kể cả hai lá ở nhánh p sai."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Bảng chân trị cho một điều kiện trong mã"
    checks:
      - "2 ** 2 == 4 and 2 ** 3 == 8"
      - "[((a and b) or (not a)) for a in (True, False) for b in (True, False)] == [True, False, True, True]"
    steps:
      - show: |
          <p><b>Bước 1 — số dòng.</b> Có $n$ mệnh đề thì bảng có $2^n$ dòng: 2 mệnh đề cho $2^2 = 4$ dòng, 3 mệnh đề cho $2^3 = 8$ dòng.</p>
          <p>Lập bảng cho $(a \land b) \lor \neg a$, với $a$: “đủ 18 tuổi”, $b$: “có vé”:</p>
          <table class="t"><tr><th>$a$</th><th>$b$</th></tr>
          <tr><td>Đ</td><td>Đ</td></tr><tr><td>Đ</td><td>S</td></tr>
          <tr><td>S</td><td>Đ</td></tr><tr><td>S</td><td>S</td></tr></table>
        focus: [1, 1, 2, 3]
        say: "Bước một, đếm số dòng. Có n mệnh đề thì bảng chân trị có 2 mũ n dòng, vì mỗi mệnh đề có hai khả năng, như cây vừa vẽ. Giờ lập bảng cho a và b, hoặc không a, với a là đủ 18 tuổi, b là có vé. Hai mệnh đề cho 2 mũ 2, bằng 4 dòng, liệt kê như hai công tắc."
      - clear: true
        show: |
          <p><b>Bước 2 — cột $a \land b$</b>: chỉ đúng khi cả hai cùng đúng.</p>
          <table class="t"><tr><th>$a$</th><th>$b$</th><th>$a \land b$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td></tr><tr><td>Đ</td><td>S</td><td>S</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td></tr><tr><td>S</td><td>S</td><td>S</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4", "2.5"]]
        say: "Bước hai, tính cột trung gian a và b, cột này chỉ đúng khi cả hai cùng đúng. Dòng đầu, a đúng và b đúng, nên được đúng. Ba dòng còn lại đều có ít nhất một vế sai, nên được sai."
      - clear: true
        show: |
          <p><b>Bước 3 — cột $\neg a$</b>: đảo chân trị của $a$.</p>
          <table class="t"><tr><th>$a$</th><th>$b$</th><th>$a \land b$</th><th>$\neg a$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>S</td></tr><tr><td>Đ</td><td>S</td><td>S</td><td>S</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td><td>Đ</td></tr><tr><td>S</td><td>S</td><td>S</td><td>Đ</td></tr></table>
        focus: [1, ["2.2", "2.3"], ["2.4", "2.5"]]
        say: "Bước ba, tính cột không a, chỉ việc đảo chân trị của a. Hai dòng đầu a đúng, nên không a sai. Hai dòng cuối a sai, nên không a đúng."
      - clear: true
        show: |
          <p><b>Bước 4 — ghép bằng hoặc</b>: dòng nào có ít nhất một cột trung gian đúng thì được Đ.</p>
          <table class="t"><tr><th>$a$</th><th>$b$</th><th>$a \land b$</th><th>$\neg a$</th><th>$(a \land b) \lor \neg a$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td></tr>
          <tr><td>Đ</td><td>S</td><td>S</td><td>S</td><td>$\hl{\text{S}}$</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>S</td><td>S</td><td>S</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [1, "2.2", "2.3", ["2.4", "2.5"]]
        say: "Bước bốn, ghép hai cột trung gian bằng hoặc, ở mỗi dòng chỉ cần một trong hai cột đúng. Dòng đầu có a và b đúng, nên được đúng. Dòng hai, cả hai cột trung gian đều sai, nên kết quả sai, đó là người đủ tuổi mà không có vé. Hai dòng cuối có không a đúng, nên được đúng."
      - show: |
          <div class="box ok">Cột cuối <b>giống hệt</b> cột của $a \to b$ ở bảng kéo theo: Đ, S, Đ, Đ.</div>
        say: "Để ý, cột cuối giống hệt cột của a kéo theo b mà ta vừa học, đúng, sai, đúng, đúng. Hai biểu thức trông khác hẳn nhau mà luôn cùng chân trị, đó là điều rất đáng chú ý."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đếm dòng và đọc dòng phá lệ"
    checks:
      - "len([(p, q, r) for p in (0, 1) for q in (0, 1) for r in (0, 1)]) == 8"
      - "(lambda f: f(True, False) is False and f(False, False) is True)(lambda a, b: (a and b) or (not a))"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: bảng $n$ mệnh đề phải có đủ $2^n$ dòng, không trùng — liệt kê như hai công tắc, mệnh đề đầu đổi chậm nhất: ĐĐ, ĐS, SĐ, SS.</p>
          <p><b>Phép thử 2</b>: với kéo theo, chỉ cần tìm dòng “$p$ đúng, $q$ sai”; không có dòng đó thì kéo theo đúng.</p>
        focus: [0, 1, 2]
        say: "Tự kiểm hai điều. Một, bảng có n mệnh đề phải có đủ 2 mũ n dòng, không trùng, cách chắc nhất là liệt kê như hai công tắc, mệnh đề đầu đổi chậm nhất, mệnh đề cuối đổi nhanh nhất. Hai, với kéo theo, chỉ cần tìm dòng p đúng mà q sai, không có dòng đó thì kéo theo đúng."
      - clear: true
        show: |
          <p><b>Đường khác 1 — thay thẳng hai người</b>, không nhìn bảng:</p>
          <table class="t"><tr><th>người</th><th>$a$</th><th>$b$</th><th>$a \land b$</th><th>$\neg a$</th><th>kết quả</th></tr>
          <tr><td>An, 20 tuổi, không vé</td><td>Đ</td><td>S</td><td>S</td><td>S</td><td>S — khớp dòng thứ hai</td></tr>
          <tr><td>Bình, 16 tuổi, không vé</td><td>S</td><td>S</td><td>S</td><td>Đ</td><td>Đ — khớp dòng thứ tư</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.3"]
        say: "Bây giờ kiểm bằng đường khác, thay thẳng hai người cụ thể mà không nhìn bảng. An 20 tuổi, không có vé, nên a đúng, b sai. Khi đó a và b sai, không a cũng sai, ghép lại được sai, khớp với dòng hai. Bình 16 tuổi, không có vé, nên a sai, b sai. Không a đúng, nên kết quả đúng, khớp với dòng bốn."
      - show: |
          <p><b>Đường khác 2 — đếm lại $2^3$ bằng liệt kê</b> ba mệnh đề $p, q, r$:</p>
          <table class="t"><tr><td>ĐĐĐ</td><td>ĐĐS</td><td>ĐSĐ</td><td>ĐSS</td></tr>
          <tr><td>SĐĐ</td><td>SĐS</td><td>SSĐ</td><td>SSS</td></tr></table>
        focus: [1, 2, 2]
        say: "Đường khác thứ hai, đếm lại công thức 2 mũ 3 bằng cách liệt kê ba mệnh đề p, q, r. Vì p đổi chậm nhất, hàng trên là bốn trường hợp p đúng, hàng dưới là bốn trường hợp p sai. Tổng cộng 8 trường hợp, đúng bằng 2 mũ 3."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda imp: imp(False, True) is True and imp(True, False) is False)(lambda a, b: (not a) or b)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ $p \to q$ sai khi $p$ sai <b class="red">(sai)</b>
          <br><span class="note">“Nếu 2 + 2 = 5 thì trăng vuông” là mệnh đề đúng: vế đầu sai nên đúng hiển nhiên.</span></div>
        say: "Lỗi thứ nhất, nghĩ p kéo theo q sai khi p sai. Câu nếu 2 cộng 2 bằng 5 thì trăng vuông là một mệnh đề đúng, vì vế đầu sai nên đúng hiển nhiên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hiểu “hoặc” là chỉ một trong hai <b class="red">(sai)</b>
          <br><span class="note">$p \lor q$ đúng cả khi hai vế cùng đúng. “Một trong hai nhưng không cả hai” là phép khác (hoặc loại trừ, XOR).</span></div>
        say: "Lỗi thứ hai, hiểu hoặc là chỉ một trong hai. P hoặc q vẫn đúng khi cả hai cùng đúng, còn một trong hai nhưng không cả hai là một phép khác, gọi là hoặc loại trừ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi $p \to q$ giống $q \to p$ <b class="red">(sai)</b>
          <br><span class="note">“Nếu mưa thì mang ô” không có nghĩa “nếu mang ô thì trời mưa” — dòng (S, Đ) cho hai kết quả khác nhau.</span></div>
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$p \to q$</th><th>$q \to p$</th></tr>
          <tr><td>S</td><td>Đ</td><td>Đ</td><td>S</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ ba, coi p kéo theo q giống q kéo theo p. Nếu mưa thì mang ô không có nghĩa là cứ mang ô thì trời mưa, và ở dòng không mưa mà mang ô, hai câu cho kết quả khác nhau."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đọc ngược “$p$ chỉ khi $q$” <b class="red">(sai)</b>
          <br><span class="note">“Được thi chỉ khi đóng học phí” là $p \to q$ (được thi kéo theo đã đóng), không phải đóng học phí thì chắc được thi.</span></div>
        say: "Lỗi thứ tư, đọc ngược cụm p chỉ khi q. Câu được thi chỉ khi đã đóng học phí nghĩa là được thi kéo theo đã đóng học phí, chứ không phải cứ đóng học phí là chắc chắn được thi."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[(p or (not q)) for p in (True, False) for q in (True, False)] == [True, True, False, True]"
      - "(lambda imp: imp(2 + 2 == 5, 1 == 2 - 1) is True and imp(2 + 2 == 4, 1 == 2) is False)(lambda a, b: (not a) or b)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Lập bảng chân trị cho $p \lor \neg q$.</td></tr>
          <tr><td>2</td><td>Mệnh đề “Nếu 2 + 2 = 5 thì 1 = 1” đúng hay sai?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, lập bảng chân trị cho p hoặc không q. Câu hai, mệnh đề nếu 2 cộng 2 bằng 5 thì 1 bằng 1 là đúng hay sai? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — 4 dòng; cột $\neg q$ đảo cột $q$:</p>
          <table class="t"><tr><th>$p$</th><th>$q$</th><th>$\neg q$</th><th>$p \lor \neg q$</th></tr>
          <tr><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td></tr><tr><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td></tr>
          <tr><td>S</td><td>Đ</td><td>S</td><td>$\hl{\text{S}}$</td></tr><tr><td>S</td><td>S</td><td>Đ</td><td>Đ</td></tr></table>
        focus: [1, 2, 2, "2.4"]
        say: "Đáp án câu một, bước một, hai mệnh đề cho 4 dòng, và cột không q là đảo của cột q. Ta được cột không q là sai, đúng, sai, đúng. Ghép bằng hoặc với p, được đúng, đúng, sai, đúng. Kết quả chỉ sai ở dòng ba, khi p sai và q đúng, vì lúc đó cả hai vế của phép hoặc đều sai."
      - show: |
          <p>② Vế đầu “2 + 2 = 5” <b>sai</b>, vế sau “1 = 1” đúng → dòng (S, Đ) của bảng kéo theo → <b>Đúng</b> (đúng hiển nhiên).</p>
        say: "Câu hai, vế đầu 2 cộng 2 bằng 5 là sai, còn vế sau 1 bằng 1 là đúng. Đó là dòng sai, đúng của bảng kéo theo, nên mệnh đề đúng. Vế đầu đã sai thì kéo theo đúng hiển nhiên, dù vế sau là gì."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mệnh đề: đúng hoặc sai</span><span class="a">→</span>
          <span class="n">$\neg,\ \land,\ \lor$</span><span class="a">→</span>
          <span class="n">$p \to q$: chỉ sai khi $p$ Đ, $q$ S</span><span class="a">→</span>
          <span class="n">$p \leftrightarrow q$: cùng chân trị</span><span class="a">→</span>
          <span class="n">bảng $2^n$ dòng</span></div>
        say: "Tổng kết chuỗi logic. Mệnh đề là câu có chân trị đúng hoặc sai. Ta ghép chúng bằng không, và, hoặc. Kéo theo chỉ sai khi vế đầu đúng mà vế sau sai, còn khi và chỉ khi đúng khi hai vế cùng chân trị. Bảng chân trị với n mệnh đề có 2 mũ n dòng."
      - show: |
          <div class="box key"><b>Tư duy:</b> đừng tranh luận bằng cảm giác về một câu “nếu… thì”. Lập bảng chân trị — máy tính cũng làm đúng như vậy.</div>
        say: "Điều cần mang theo, đừng tranh luận bằng cảm giác về một câu nếu thì. Hãy lập bảng chân trị, máy tính cũng làm đúng như vậy."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>tương đương lôgic và luật De Morgan</b> — biến đổi điều kiện mà không đổi nghĩa.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học khi nào hai biểu thức là tương đương, và các luật giúp biến đổi một điều kiện mà không làm đổi nghĩa. Hẹn gặp bạn ở bài tiếp theo."
