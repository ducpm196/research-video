  - id: quymo
    kind: example
    title: 'Khi n lớn dần: n phép cộng hay một công thức đã chứng minh'
    checks:
    - '[sum(2 * k - 1 for k in range(1, n + 1)) for n in (10, 1000)] == [100, 1000000]'
    - sum(2 * k - 1 for k in range(1, 10 ** 6 + 1)) == 10 ** 12
    - 10 ** 9 / 1e9 == 1.0 and round(10 ** 18 / 1e9 / 86400 / 365.25) == 32
    steps:
    - clear: true
      show: |
        <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for n in (10, 1000, 1000000):</code></td><td>với mỗi n lần lượt trong ngoặc, làm các dòng thụt vào bên dưới</td><td>ba lượt: n = 10, rồi 1000, rồi 1000000</td></tr><tr><td><code>range(1, n + 1)</code></td><td>các số từ 1 tới n (số sau trong ngoặc không lấy)</td><td>range(1, 5) cho 1, 2, 3, 4</td></tr><tr><td><code>tong = tong + 2 * k - 1</code></td><td>một dấu bằng là <b>gán</b>; <code>*</code> là nhân; dòng này cộng số lẻ thứ k, tức 2k − 1, vào tong</td><td>k = 3: 2 * 3 - 1 = 5</td></tr><tr><td><code>print(n, &#x27;so le&#x27;, n * n)</code></td><td>in các giá trị ra cửa sổ, cách nhau một dấu cách; <code>n * n</code> là n nhân n</td><td>n = 10 thì n * n là 100</td></tr></table>
      focus:
      - '1.1'
      - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
      say: 'Chương trình cộng số lẻ dùng bốn ký hiệu, ta đọc từng cái. Dòng mở đầu vòng lặp: với mỗi n lần lượt là 10, một nghìn, rồi một triệu, làm các dòng thụt vào bên dưới. Hàm tạo dãy số với hai số trong ngoặc cho các số từ số đầu tới số sau trừ 1, nên với 1 và n cộng 1 nó cho đúng các số từ 1 tới n. Dòng này gán: cộng số lẻ thứ k, tức hai nhân k trừ 1, vào tổng, trong đó dấu sao là phép nhân. Hàm in đưa chữ trong dấu nháy và các giá trị ra cửa sổ, cách nhau một dấu cách, còn n sao n là n nhân n.'
    - clear: true
      show: |
        <p><b>Chạy thật</b>: cộng tay từng số lẻ đầu tiên với $n = 10$, 1 000, 1 000 000 rồi so với $n \times n$</p><div class="code"><div>for n in (10, 1000, 1000000):</div><div>    tong = 0</div><div>    for k in range(1, n + 1):</div><div>        tong = tong + 2 * k - 1</div><div>    print(n, &#x27;so le: cong&#x27;, n, &#x27;lan, tong =&#x27;, tong, &#x27;, n * n =&#x27;, n * n)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>10 so le: cong 10 lan, tong = 100 , n * n = 100</div><div>1000 so le: cong 1000 lan, tong = 1000000 , n * n = 1000000</div><div>1000000 so le: cong 1000000 lan, tong = 1000000000000 , n * n = 1000000000000</div></div>
      focus:
      - 2
      - - '2.3'
        - '2.4'
      - '4.1'
      - '4.2'
      say: Đây là chương trình chạy thật. Vòng lặp cộng từng số lẻ, số lẻ thứ k là 2k trừ 1, rồi in tổng cùng n nhân n. Với n bằng 10 phải cộng 10 lần, với n bằng một nghìn phải cộng một nghìn lần, với n bằng một triệu phải cộng một triệu lần. Ở cả ba cỡ, tổng đúng bằng n nhân n, đúng như điều quy nạp đã chứng minh.
    - clear: true
      show: |
        <table class="t"><tr><th>$n$</th><th>cộng từng số lẻ</th><th>dùng $n^2$ đã chứng minh</th></tr><tr><td>1 000</td><td>1 000 phép cộng</td><td>1 phép nhân</td></tr><tr><td>$10^9$</td><td>$10^9$ phép cộng, khoảng 1 giây (một tỉ phép mỗi giây, số minh hoạ)</td><td>1 phép nhân</td></tr><tr><td>$10^{18}$</td><td>$10^{18}$ phép cộng, khoảng 32 năm</td><td>1 phép nhân</td></tr><tr><td>mọi $n$</td><td>không bao giờ xong</td><td><b>1 phép nhân, nhờ chứng minh bằng quy nạp</b></td></tr></table><div class="box key">Chứng minh quy nạp cho ta một công thức đúng với <b>mọi</b> n. Công thức đổi chi phí từ tỉ lệ với n thành một phép tính.</div>
      focus:
      - 1
      - '1.3'
      - '1.4'
      - 2
      say: Bảng này cho thấy giá trị của một chứng minh. Cộng từng số lẻ tốn số phép cộng bằng n, với n bằng mười mũ chín thì khoảng một giây, với mười mũ mười tám thì khoảng ba mươi hai năm. Còn công thức n bình phương, đã chứng minh bằng quy nạp, chỉ tốn một phép nhân dù n là bao nhiêu. Người làm nghề chọn công thức đã được chứng minh thay cho vòng lặp dài.


  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "[n - 4 for n in (13, 14, 15, 16)] == [9, 10, 11, 12]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ bước cơ sở <b class="red">(sai)</b>
          <br><span class="note">“$n = n + 1$” có bước quy nạp đúng (cộng 1 hai vế), nhưng không có $n$ nào làm nó đúng.</span></div>
        say: "Lỗi thứ nhất, bỏ bước cơ sở. Câu n bằng n cộng 1 có bước quy nạp đúng, vì cộng 1 vào hai vế, nhưng không có n nào làm nó đúng cả."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bước quy nạp hỏng ở $n$ nhỏ <b class="red">(sai)</b>
          <br><span class="note">“Mọi con ngựa cùng màu”: bước từ $n$ sang $n + 1$ bỏ con cuối được $n$ con cùng màu, bỏ con đầu được $n$ con cùng màu, rồi dùng hai nhóm chồng nhau — với $n = 1$, hai nhóm không chung con nào, nên bước hỏng.</span></div>
        say: "Lỗi thứ hai, bước quy nạp hỏng ở n nhỏ. Có một chứng minh nổi tiếng mà sai, rằng mọi con ngựa cùng màu. Với n cộng 1 con, nó bỏ con cuối để được một nhóm n con cùng màu, rồi bỏ con đầu để được một nhóm n con khác cùng màu. Nó nói hai nhóm có con chung nên cả đàn cùng màu. Nhưng khi n bằng 1, hai nhóm không có con nào chung, nên bước đó hỏng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Giả sử luôn $Q(n + 1)$ rồi “chứng minh” nó <b class="red">(lập luận vòng)</b>
          <br><span class="note">Giả thiết quy nạp chỉ là $Q(n)$; $Q(n + 1)$ là điều phải suy ra.</span></div>
        say: "Lỗi thứ ba, giả sử luôn Q của n cộng 1 rồi biến đổi để chứng minh nó, đó là lập luận vòng. Giả thiết quy nạp chỉ là Q của n, còn Q của n cộng 1 là điều phải suy ra."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quy nạp mạnh mà thiếu giá trị cơ sở <b class="red">(sai)</b>
          <br><span class="note">Chỉ kiểm 12 thì bước cho 13 cần 9 — số 9 nằm ngoài phạm vi đã chứng minh. Cần đủ 12, 13, 14, 15.</span></div>
          <table class="t"><tr><th>muốn trả</th><th>13</th><th>14</th><th>15</th><th>16</th></tr>
          <tr><td>bước quy nạp cần</td><td>$\hl{9}$</td><td>$\hl{10}$</td><td>$\hl{11}$</td><td>12</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ tư, quy nạp mạnh mà thiếu giá trị cơ sở. Nếu chỉ kiểm 12, thì bước cho 13 cần số 9, nằm ngoài phạm vi đã chứng minh, nên phải có đủ 12, 13, 14 và 15."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all(sum(range(1, n + 1)) == n * (n + 1) // 2 for n in range(1, 300))"
      - "all(n * (n + 1) + 2 * (n + 1) == (n + 1) * (n + 2) for n in range(0, 300))"
      - "not any(4 * a + 5 * b == 11 for a in range(3) for b in range(3))"
      - "[[4 * a + 5 * b for b in range(3)] for a in range(3)] == [[0, 5, 10], [4, 9, 14], [8, 13, 18]]"
      - "1 == 1 * 2 // 2 and 1 + 2 + 3 + 4 == 10 and 10 + 5 == 15 == 5 * 6 // 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chứng minh bằng quy nạp: $1 + 2 + \dots + n = \frac{n(n + 1)}{2}$ với $n \ge 1$.</td></tr>
          <tr><td>2</td><td>Số tiền 11 nghìn có trả được bằng tờ 4 và 5 nghìn không? Điều đó có mâu thuẫn với định lý không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chứng minh bằng quy nạp, tổng từ 1 đến n bằng n nhân, trong ngoặc n cộng 1, rồi chia 2. Câu hai, số tiền 11 nghìn có trả được bằng tờ 4 và 5 nghìn không, và điều đó có mâu thuẫn với định lý không? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>viết</th><th>lý do</th></tr>
          <tr><td>cơ sở</td><td>$1 = \frac{1(2)}{2}$ ✓</td><td>thay $n = 1$</td></tr>
          <tr><td>quy nạp ①</td><td>$1 + \dots + n + (n + 1) = \hl{\frac{n(n + 1)}{2}} + (n + 1)$</td><td>thay giả thiết quy nạp</td></tr>
          <tr><td>quy nạp ②</td><td>$= \frac{n(n + 1) + 2(n + 1)}{2}$</td><td>quy đồng mẫu 2</td></tr>
          <tr><td>quy nạp ③</td><td>$= \frac{(n + 1)(n + 2)}{2}$ ✓</td><td>đặt $n + 1$ ra ngoài</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, bước cơ sở, thay n bằng 1, vế trái là 1, vế phải là 1 nhân 2 chia 2, cũng bằng 1. Bước quy nạp, cộng thêm số n cộng 1, rồi thay phần đầu bằng n nhân, trong ngoặc n cộng 1, rồi chia 2, theo giả thiết quy nạp. Tiếp theo, quy đồng mẫu 2, được n nhân, trong ngoặc n cộng 1, cộng 2 nhân, trong ngoặc n cộng 1, rồi tất cả chia 2. Cuối cùng, đặt thừa số n cộng 1 ra ngoài, được tích của n cộng 1 và n cộng 2, rồi chia 2, đúng công thức với n cộng 1."
      - show: |
          <p class="note">Thử: $n = 4$: $10 + 5 = 15 = \frac{5 \times 6}{2}$ ✓</p>
        say: "Làm thử bằng số, từ n bằng 4 sang 5, tổng 10 cộng thêm 5 được 15, đúng bằng 5 nhân 6 chia 2."
      - clear: true
        show: |
          <p>② Liệt kê mọi tổng không quá 11 của tờ 4 nghìn và 5 nghìn:</p>
          <table class="t"><tr><th>số tờ 4</th><th>0 tờ 5</th><th>1 tờ 5</th><th>2 tờ 5</th></tr>
          <tr><td>0</td><td>0</td><td>5</td><td>10</td></tr>
          <tr><td>1</td><td>4</td><td>9</td><td>14 (quá)</td></tr>
          <tr><td>2</td><td>8</td><td>13 (quá)</td><td>18 (quá)</td></tr></table>
          <p>Không ô nào bằng 11 → không trả được. Không mâu thuẫn — định lý chỉ nói từ 12 trở lên.</p>
        focus: [1, "2.2", "2.3", "2.4", 3, 3]
        say: "Câu hai, ta liệt kê mọi tổng không quá 11. Không tờ 4 nghìn nào thì có 0, 5 và 10. Một tờ 4 nghìn thì có 4 và 9, còn 14 đã quá. Hai tờ 4 nghìn thì có 8, còn 13 đã quá. Không ô nào bằng 11, nên 11 nghìn không trả được. Điều đó không mâu thuẫn, vì định lý chỉ nói từ 12 trở lên."
  - id: practice
    kind: practice
    title: 'Tự làm: kiểm hai bước quy nạp cho tổng bình phương bằng chương trình'
    steps:
    - show: |
        <p><b>Đề</b>: viết <code>quynap.py</code> kiểm công thức $1^2 + 2^2 + \dots + n^2 = n(n+1)(2n+1)/6$: in bước cơ sở, bốn lần “đẩy” từ $n$ sang $n+1$, kiểm mọi $n$ từ 1 đến 1 000, và tìm $n$ đầu tiên làm một công thức SAI bị bác bỏ (bảy dòng, định dạng ở <code>labs/DMS/L04/de.md</code>).</p><p class="note">Số liệu khác ví dụ trong bài. Công thức sai vẫn đúng ở n = 1: bước cơ sở đơn độc chưa đủ.</p>
      focus:
      - 1
      - 1
      - 1
      - 1
      - 2
