2" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="136" y="30" width="52" height="52" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="192" y="30" width="52" height="52" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="248" y="30" width="52" height="52" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="304" y="30" width="52" height="52" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="470" y="62" font-size="23" fill="#2563eb">lớp 1: 1 ô</text><text x="470" y="108" font-size="23" fill="#15803d">lớp 2: 3 ô</text><text x="470" y="154" font-size="23" fill="#ea580c">lớp 3: 5 ô</text><text x="470" y="200" font-size="23" fill="#9333ea">lớp 4: 7 ô</text><text x="470" y="246" font-size="23" fill="#b91c1c">lớp 5: 9 ô</text><text x="700" y="140" font-size="24" fill="#374151">1 + 3 + 5 + 7 + 9 ô</text><text x="700" y="178" font-size="24" fill="#374151">= hình vuông 5 × 5 = 25 ô</text></svg></div>
        focus: [1, 2, 2, 2]
        say: "Bây giờ kiểm công thức tổng số lẻ bằng một đường khác, đếm ô vuông. Ô góc dưới trái là lớp 1, có 1 ô. Mỗi lớp hình chữ L tiếp theo bọc quanh hình vuông cũ, thêm một hàng và một cột, nên lớp thứ k có 2k trừ 1 ô, lần lượt 3, 5, 7, 9. Năm lớp ghép lại thành hình vuông 5 nhân 5, đúng 25 ô, khớp với 5 bình phương."
      - clear: true
        show: |
          <p><b>Đường khác 2 — liệt kê</b> các số sau cơ sở của bài trả tiền: lấy cách trả cũ, thêm một tờ 4 nghìn.</p>
          <table class="t"><tr><th>số tiền</th><th>16</th><th>17</th><th>18</th><th>19</th></tr>
          <tr><td>lấy lại</td><td>12</td><td>13</td><td>14</td><td>15</td></tr>
          <tr><td>cách trả</td><td>$4 + 4 + 4 + 4$</td><td>$4 + 4 + 5 + 4$</td><td>$4 + 5 + 5 + 4$</td><td>$5 + 5 + 5 + 4$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Đường khác thứ hai, liệt kê thẳng bốn số tiền ngay sau cơ sở của bài trả tiền. Mười sáu lấy lại cách trả 12, mười bảy lấy lại cách trả 13, cứ thế tới 19 lấy lại 15. Mỗi cách trả chỉ cần thêm một tờ 4 nghìn, và cộng lại đúng bằng số tiền cần trả. Từ 20 trở đi, ta lại lấy các số 16 đến 19 vừa có, nên bốn giá trị cơ sở đủ phủ mọi số."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "[n - 4 for n in (13, 14, 15, 16)] == [9, 10, 11, 12]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ bước cơ sở <b class="red">(sai)</b>
          <br><span class="note">“$n = n + 1$” có bước quy nạp đúng (cộng 1 hai vế), nhưng không có $n$ nào làm nó đúng.</span></div>
        say: "Lỗi thứ nhất, bỏ bước cơ sở. Câu n bằng n cộng 1 có bước quy nạp đúng, vì cộng 1 vào hai vế, nhưng không có n nào làm nó đúng cả."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bước quy nạp hỏng ở $n$ nhỏ <b class="red">(sai)</b>
          <br><span class="note">“Mọi con ngựa cùng màu”: bước từ $n$ sang $n + 1$ dùng hai nhóm chồng nhau — với $n = 1$, hai nhóm không chung con nào, nên bước hỏng.</span></div>
        say: "Lỗi thứ hai, bước quy nạp hỏng ở n nhỏ. Có một chứng minh nổi tiếng mà sai, rằng mọi con ngựa cùng màu. Nó dùng hai nhóm chồng lên nhau, nhưng khi n bằng 1, hai nhóm không có con nào chung, nên bước đó hỏng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Giả sử luôn $Q(n + 1)$ rồi “chứng minh” nó <b class="red">(lập luận vòng)</b>
          <br><span class="note">Giả thiết quy nạp chỉ là $Q(n)$; $Q(n + 1)$ là điều phải suy ra.</span></div>
        say: "Lỗi thứ ba, giả sử luôn Q của n cộng 1 rồi biến đổi để chứng minh nó, đó là lập luận vòng. Giả thiết quy nạp chỉ là Q của n, còn Q của n cộng 1 là điều phải suy ra."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quy nạp mạnh mà thiếu giá trị cơ sở <b class="red">(sai)</b>
          <br><span class="note">Chỉ kiểm 12 thì bước cho 13 cần 9 — số 9 nằm ngoài phạm vi đã chứng minh. Cần đủ 12, 13, 14, 15.</span></div>
          <table class="t"><tr><th>muốn trả</th><th>13</th><th>14</th><th>15</th><th>16</th></tr>
          <tr><td>bước quy nạp cần</td><td>$\hl{9}$</td><td>$\hl{10}$</td><td>$\hl{11}$</td><td>12</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ tư, quy nạp mạnh mà thiếu giá trị cơ sở. Nếu chỉ kiểm 12, thì bước cho 13 cần số 9, nằm ngoài phạm vi đã chứng minh, nên phải có đủ 12, 13, 14 và 15."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all(sum(range(1, n + 1)) == n * (n + 1) // 2 for n in range(1, 300))"
      - "all(n * (n + 1) + 2 * (n + 1) == (n + 1) * (n + 2) for n in range(0, 300))"
      - "not any(4 * a + 5 * b == 11 for a in range(3) for b in range(3))"
      - "[[4 * a + 5 * b for b in range(3)] for a in range(3)] == [[0, 5, 10], [4, 9, 14], [8, 13, 18]]"
      - "1 == 1 * 2 // 2 and 1 + 2 + 3 + 4 == 10 and 10 + 5 == 15 == 5 * 6 // 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chứng minh bằng quy nạp: $1 + 2 + \dots + n = \frac{n(n + 1)}{2}$ với $n \ge 1$.</td></tr>
          <tr><td>2</td><td>Số tiền 11 nghìn có trả được bằng tờ 4 và 5 nghìn không? Điều đó có mâu thuẫn với định lý không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chứng minh bằng quy nạp, tổng từ 1 đến n bằng n nhân n cộng 1, chia 2. Câu hai, số tiền 11 nghìn có trả được bằng tờ 4 và 5 nghìn không, và điều đó có mâu thuẫn với định lý không? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>viết</th><th>lý do</th></tr>
          <tr><td>cơ sở</td><td>$1 = \frac{1(2)}{2}$ ✓</td><td>thay $n = 1$</td></tr>
          <tr><td>quy nạp ①</td><td>$1 + \dots + n + (n + 1) = \hl{\frac{n(n + 1)}{2}} + (n + 1)$</td><td>thay giả thiết quy nạp</td></tr>
          <tr><td>quy nạp ②</td><td>$= \frac{n(n + 1) + 2(n + 1)}{2}$</td><td>quy đồng mẫu 2</td></tr>
          <tr><td>quy nạp ③</td><td>$= \frac{(n + 1)(n + 2)}{2}$ ✓</td><td>đặt $n + 1$ ra ngoài</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, bước cơ sở, thay n bằng 1, vế trái là 1, vế phải là 1 nhân 2 chia 2, cũng bằng 1. Bước quy nạp, cộng thêm số n cộng 1, rồi thay phần đầu bằng n nhân n cộng 1 chia 2, theo giả thiết quy nạp. Tiếp theo, quy đồng mẫu 2, được n nhân n cộng 1, cộng 2 nhân n cộng 1, tất cả chia 2. Cuối cùng, đặt n cộng 1 ra ngoài, được n cộng 1 nhân n cộng 2, chia 2, đúng công thức với n cộng 1."
      - show: |
          <p class="note">Thử: $n = 4$: $10 + 5 = 15 = \frac{5 \times 6}{2}$ ✓</p>
        say: "Làm thử bằng số, từ n bằng 4 sang 5, tổng 10 cộng thêm 5 được 15, đúng bằng 5 nhân 6 chia 2."
      - clear: true
        show: |
          <p>② Liệt kê mọi tổng không quá 11 của tờ 4 nghìn và 5 nghìn:</p>
          <table class="t"><tr><th>số tờ 4</th><th>0 tờ 5</th><th>1 tờ 5</th><th>2 tờ 5</th></tr>
          <tr><td>0</td><td>0</td><td>5</td><td>10</td></tr>
          <tr><td>1</td><td>4</td><td>9</td><td>14 (quá)</td></tr>
          <tr><td>2</td><td>8</td><td>13 (quá)</td><td>18 (quá)</td></tr></table>
          <p>Không ô nào bằng 11 → không trả được. Không mâu thuẫn — định lý chỉ nói từ 12 trở lên.</p>
        focus: [1, "2.2", "2.3", "2.4", 3, 3]
        say: "Câu hai, ta liệt kê mọi tổng không quá 11. Không tờ 4 nghìn nào thì có 0, 5 và 10. Một tờ 4 nghìn thì có 4 và 9, còn 14 đã quá. Hai tờ 4 nghìn thì có 8, còn 13 đã quá. Không ô nào bằng 11, nên 11 nghìn không trả được. Điều đó không mâu thuẫn, vì định lý chỉ nói từ 12 trở lên."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cơ sở: $Q(n_0)$</span><span class="a">→</span>
          <span class="n">quy nạp: $Q(n) \implies Q(n + 1)$</span><span class="a">→</span>
          <span class="n">chỉ ra chỗ dùng giả thiết</span><span class="a">→</span>
          <span class="n">quy nạp mạnh: giả sử mọi giá trị trước, đủ cơ sở</span></div>
        say: "Tổng kết lại, quy nạp gồm bước cơ sở và bước quy nạp từ n sang n cộng 1. Trong bước quy nạp phải chỉ ra chỗ dùng giả thiết. Quy nạp mạnh giả sử mọi giá trị trước đều đúng, và cần đủ các giá trị cơ sở."
      - show: |
          <div class="box key"><b>Tư duy:</b> nhiều thuật toán đệ quy được chứng minh đúng chính bằng quy nạp — lời gọi nhỏ hơn đúng thì lời gọi lớn đúng.</div>
        say: "Điều cần mang theo, nhiều thuật toán đệ quy được chứng minh đúng chính bằng quy nạp, nếu các lời gọi nhỏ hơn cho kết quả đúng thì lời gọi lớn cũng đúng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>tập hợp</b> — phép hợp, giao, hiệu, tập lũy thừa, và đếm bằng bao hàm–loại trừ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học tập hợp, các phép hợp, giao, hiệu, tập lũy thừa, và cách đếm bằng bao hàm loại trừ. Hẹn gặp bạn ở bài tiếp theo."
