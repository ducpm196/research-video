# Quy ước: vị từ Q(n) (không dùng P(n) — sổ chung dành “P(” cho xác suất). “Giả thiết quy nạp” = Q(n) được giả sử đúng trong bước
#   quy nạp. Quy nạp mạnh: giả sử Q đúng với MỌI giá trị từ cơ sở tới n.
objectives:
  - "Viết đủ bước cơ sở và bước quy nạp"
  - "Chỉ ra chỗ dùng giả thiết quy nạp"
  - "Dùng quy nạp mạnh khi bước sau cần nhiều giá trị trước"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một hàng domino dài vô tận"
    checks:
      - "[sum(2 * k - 1 for k in range(1, n + 1)) for n in range(1, 6)] == [1, 4, 9, 16, 25]"
    steps:
      - show: |
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>$1 + 3 + \dots + (2n - 1)$</td><td>1</td><td>4</td><td>9</td><td>16</td><td>25</td></tr></table>
          <p>Có vẻ tổng $n$ số lẻ đầu tiên luôn bằng $n^2$. Nhưng bài 3 dạy: thử nhiều ví dụ <b>không</b> phải chứng minh.</p>
        focus: [1, 2, 2]
        say: "Chào bạn, cộng các số lẻ đầu tiên, ta được 1, 4, 9, 16, 25, đều là số chính phương. Có vẻ tổng của n số lẻ đầu tiên luôn bằng n bình phương. Nhưng như bài 3, thử nhiều ví dụ đến đâu cũng không phải chứng minh."
      - show: |
          <div class="box key">Hàng domino: ① quân đầu tiên đổ; ② quân nào đổ cũng làm quân kế tiếp đổ. Vậy <b>mọi</b> quân đều đổ.</div>
        say: "Hãy nghĩ tới một hàng quân cờ dựng đứng sát nhau. Nếu quân đầu tiên đổ, và quân nào đổ cũng làm quân kế tiếp đổ, thì mọi quân đều đổ. Đó chính là ý tưởng của quy nạp toán học."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số lẻ thứ k, dấu ba chấm, bình phương một tổng"
    checks:
      - "[2 * k - 1 for k in range(1, 5)] == [1, 3, 5, 7]"
      - "sum(2 * k - 1 for k in range(1, 4)) == 1 + 3 + 5 == 9 and 2 * 3 - 1 == 5"
      - "all((n + 1) ** 2 == n * n + 2 * n + 1 for n in range(-50, 51)) and (4 + 1) ** 2 == 25 == 16 + 8 + 1"
    steps:
      - show: |
          <table class="t"><tr><th>thứ tự $k$</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>số lẻ thứ $k$ là $2k - 1$</td><td>1</td><td>3</td><td>5</td><td>7</td></tr></table>
        focus: [1, 1, 1]
        say: "Trước khi vào bài, ta ôn ba việc nhỏ. Việc thứ nhất, số lẻ thứ k là 2k trừ 1. Thay k bằng 1, 2, 3, 4, ta được 1, 3, 5, 7, đúng là bốn số lẻ đầu tiên."
      - clear: true
        show: |
          <p>Dấu ba chấm: $1 + 3 + \dots + (2n - 1)$ nghĩa là cộng mọi số lẻ từ 1 tới số lẻ thứ $n$.</p>
          <table class="t"><tr><th>$n$</th><th>số cuối $2n - 1$</th><th>tổng viết đủ</th></tr>
          <tr><td>3</td><td>$2 \times 3 - 1 = 5$</td><td>$1 + 3 + 5 = 9$</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Việc thứ hai là đọc dấu ba chấm, 1 cộng 3 cộng ba chấm cộng 2n trừ 1 nghĩa là cộng mọi số lẻ từ 1 tới số lẻ thứ n. Với n bằng 3, số cuối là 2 nhân 3 trừ 1, bằng 5. Tổng viết đủ là 1 cộng 3 cộng 5, bằng 9."
      - clear: true
        show: |
          <p>Bình phương một tổng: nhân phá ngoặc.</p>
          <table class="t"><tr><th>viết</th><th>thử $n = 4$</th></tr>
          <tr><td>$(n + 1)^2 = n^2 + 2n + 1$</td><td>$5^2 = 25$ và $16 + 8 + 1 = 25$</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Việc thứ ba là bình phương một tổng, ta nhân phá ngoặc. N cộng 1 tất cả bình phương bằng n bình phương cộng 2n cộng 1. Thử với n bằng 4, vế trái là 5 bình phương, bằng 25, vế phải là 16 cộng 8 cộng 1, cũng bằng 25."

  # ───────────────────────── 2. KÝ HIỆU / KHUÔN ─────────────────────────
  - id: sym_frame
    kind: symbol
    title: "Giải mã: hai bước của quy nạp"
    steps:
      - show: |
          <p>Muốn chứng minh $\forall n \ge n_0: Q(n)$, làm hai bước ($n_0$: giá trị bắt đầu, số 0 nhỏ phía dưới chỉ là tên):</p>
          <table class="t"><tr><th>bước</th><th>phải chứng minh</th><th>domino</th></tr>
          <tr><td><b>cơ sở</b></td><td>$Q(n_0)$ đúng</td><td>quân đầu đổ</td></tr>
          <tr><td><b>quy nạp</b></td><td>với mọi $n \ge n_0$: &nbsp;$Q(n) \implies Q(n + 1)$</td><td>quân này đổ kéo quân sau đổ</td></tr></table>
        introduces: [sub]
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Muốn chứng minh Q của n đúng với mọi n từ n không trở đi, ta làm hai bước, n không là giá trị bắt đầu. Bước cơ sở, chứng minh Q của n không đúng, giống quân đầu tiên đổ. Bước quy nạp, với mọi n, giả sử Q của n đúng rồi suy ra Q của n cộng 1 đúng. Đó là quân này đổ kéo quân sau đổ."
      - show: |
          <div class="box warn">Trong bước quy nạp, “giả sử $Q(n)$ đúng” gọi là <b>giả thiết quy nạp</b>. Ta <b>không</b> giả sử điều cần chứng minh cho mọi $n$ — chỉ giả sử cho <b>một</b> $n$ rồi đẩy sang $n + 1$.</div>
        say: "Câu giả sử Q của n đúng gọi là giả thiết quy nạp. Đây không phải giả sử điều cần chứng minh cho mọi n, ta chỉ giả sử cho một n, rồi chứng minh nó đẩy được sang n cộng 1."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi quân domino là một câu Q(n)"
    checks:
      - "[(n + 1) ** 2 - n * n for n in range(1, 5)] == [3, 5, 7, 9] and [n * n for n in range(1, 6)] == [1, 4, 9, 16, 25]"
    steps:
      - show: |
          <div><svg width="1460" height="320" viewBox="0 0 1460 320"><line x1="30" y1="135" x2="118" y2="135" stroke="#15803d" stroke-width="4"/><polygon points="132,135 116,126 116,144" fill="#15803d"/><text x="76" y="118" font-size="20" text-anchor="middle" fill="#15803d">cơ sở</text><rect x="140" y="70" width="80" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="180" y="143" font-size="24" text-anchor="middle">Q(1)</text><text x="180" y="240" font-size="22" text-anchor="middle" fill="#15803d">tổng 1 = 1²</text><line x1="230" y1="135" x2="366" y2="135" stroke="#ea580c" stroke-width="3"/><polygon points="380,135 364,126 364,144" fill="#ea580c"/><text x="305" y="120" font-size="22" text-anchor="middle" fill="#ea580c">+ 3</text><rect x="390" y="70" width="80" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="430" y="143" font-size="24" text-anchor="middle">Q(2)</text><text x="430" y="240" font-size="22" text-anchor="middle" fill="#15803d">tổng 4 = 2²</text><line x1="480" y1="135" x2="616" y2="135" stroke="#ea580c" stroke-width="3"/><polygon points="630,135 614,126 614,144" fill="#ea580c"/><text x="555" y="120" font-size="22" text-anchor="middle" fill="#ea580c">+ 5</text><rect x="640" y="70" width="80" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="680" y="143" font-size="24" text-anchor="middle">Q(3)</text><text x="680" y="240" font-size="22" text-anchor="middle" fill="#15803d">tổng 9 = 3²</text><line x1="730" y1="135" x2="866" y2="135" stroke="#ea580c" stroke-width="3"/><polygon points="880,135 864,126 864,144" fill="#ea580c"/><text x="805" y="120" font-size="22" text-anchor="middle" fill="#ea580c">+ 7</text><rect x="890" y="70" width="80" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="930" y="143" font-size="24" text-anchor="middle">Q(4)</text><text x="930" y="240" font-size="22" text-anchor="middle" fill="#15803d">tổng 16 = 4²</text><line x1="980" y1="135" x2="1116" y2="135" stroke="#ea580c" stroke-width="3"/><polygon points="1130,135 1114,126 1114,144" fill="#ea580c"/><text x="1055" y="120" font-size="22" text-anchor="middle" fill="#ea580c">+ 9</text><rect x="1140" y="70" width="80" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="1180" y="143" font-size="24" text-anchor="middle">Q(5)</text><text x="1180" y="240" font-size="22" text-anchor="middle" fill="#15803d">tổng 25 = 5²</text><text x="1250" y="143" font-size="30" fill="#374151">…</text><text x="140" y="300" font-size="22" fill="#ea580c">mỗi mũi tên cam: cộng số lẻ tiếp theo 2n + 1, vì n² + 2n + 1 = (n + 1)²</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này vẽ mỗi câu Q của n thành một quân cờ dựng đứng. Mũi tên xanh là bước cơ sở, đẩy đổ quân Q của 1, tức tổng bằng 1. Mỗi mũi tên cam là bước quy nạp, từ tổng n bình phương, cộng thêm số lẻ tiếp theo 2n cộng 1, được n cộng 1 tất cả bình phương. Ví dụ, 1 cộng 3 bằng 4, rồi 4 cộng 5 bằng 9. Ta không cần đẩy từng quân bằng tay, vì một lập luận cho mọi mũi tên là đủ làm cả hàng đổ."

  # ───────────────────────── 3. VÍ DỤ CHÍNH ─────────────────────────
  - id: example
    kind: example
    title: "Chứng minh: tổng n số lẻ đầu tiên bằng n²"
    checks:
      - "all(sum(2 * k - 1 for k in range(1, n + 1)) == n * n for n in range(1, 200))"
      - "all(n * n + (2 * n + 1) == (n + 1) ** 2 for n in range(0, 500))"
      - "2 * (1 + 1) - 1 == 3 and 2 * 4 + 1 == 9 and 16 + 9 == 25 == 5 ** 2"
    steps:
      - show: |
          <p>$Q(n)$: “$1 + 3 + \dots + (2n - 1) = n^2$”, &nbsp; $n \ge 1$.</p>
          <p><b>Cơ sở</b> $n = 1$: vế trái là 1, vế phải là $1^2 = 1$ ✓</p>
        focus: [1, 2]
        say: "Đặt Q của n là câu, tổng n số lẻ đầu tiên bằng n bình phương, với n từ 1 trở đi. Bước cơ sở, n bằng 1, vế trái chỉ có số 1, vế phải là 1 bình phương cũng bằng 1, đúng."
      - show: |
          <p><b>Quy nạp</b>: giả sử $1 + 3 + \dots + (2n - 1) = n^2$. Số lẻ tiếp theo là $2(n + 1) - 1 = 2n + 1$, nên:</p>
          <table class="t"><tr><th>viết</th><th>lý do</th></tr>
          <tr><td>$1 + 3 + \dots + (2n - 1) + (2n + 1) = \hl{n^2} + (2n + 1)$</td><td>thay giả thiết quy nạp</td></tr>
          <tr><td>$= n^2 + 2n + 1 = (n + 1)^2$ ✓</td><td>hằng đẳng thức bình phương của tổng</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Bước quy nạp, giả sử tổng n số lẻ đầu tiên bằng n bình phương. Số lẻ tiếp theo là 2 nhân n cộng 1 trừ 1, tức 2n cộng 1. Cộng thêm số đó, phần đầu được thay bằng n bình phương, theo giả thiết quy nạp. Ta được n bình phương cộng 2n cộng 1, chính là n cộng 1 tất cả bình phương, đúng Q của n cộng 1."
      - show: |
          <p>Làm thử ngay bằng số, đẩy từ $n = 4$ sang $n = 5$: $\; 16 + (2(4) + 1) = 16 + 9 = 25 = 5^2$ ✓</p>
          <p class="note">Cả hai bước đều xong, nên $Q(n)$ đúng với mọi $n \ge 1$. Máy cũng kiểm $n$ từ 1 đến 199.</p>
        focus: [1, 2]
        say: "Làm thử ngay bằng số, đẩy từ n bằng 4 sang 5, 16 cộng 9 bằng 25, đúng 5 bình phương. Cả hai bước đều xong, nên câu đúng với mọi n từ 1 trở đi, và máy cũng kiểm lại cho n từ 1 đến 199."

  # ───────────────────────── 4. VÌ SAO ĐÚNG ─────────────────────────
  - id: why
    kind: concept
    title: "Vì sao hai bước là đủ"
    steps:
      - show: |
          <p>Cơ sở cho $Q(1)$. Bước quy nạp với $n = 1$ cho $Q(1) \implies Q(2)$, nên $Q(2)$ đúng. Với $n = 2$ cho $Q(3)$, …</p>
          <p class="note">Phản chứng (bài 3): nếu có $n$ làm $Q$ sai, lấy $n$ <b>nhỏ nhất</b> như vậy; cơ sở cho $Q(1)$ đúng nên $n \ge 2$, và $n - 1$ thì $Q$ đúng, nên theo bước quy nạp $Q(n)$ đúng — mâu thuẫn.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Vì sao hai bước là đủ? Bước cơ sở cho Q của 1. Áp bước quy nạp với n bằng 1 cho Q của 2, rồi với n bằng 2 cho Q của 3, cứ thế không dừng. Nói chặt hơn bằng phản chứng, nếu có n làm Q sai thì lấy n nhỏ nhất như vậy. Vì Q của 1 đúng nên n ít nhất là 2, khi đó Q của n trừ 1 đúng, nên theo bước quy nạp Q của n cũng đúng, mâu thuẫn."

  # ───────────────────────── 5. QUY NẠP MẠNH ─────────────────────────
  - id: strong
    kind: concept
    title: "Quy nạp mạnh: trả tiền bằng tờ 4 nghìn và 5 nghìn"
    checks:
      - "[n for n in range(1, 40) if not any(4 * a + 5 * b == n for a in range(n // 4 + 1) for b in range(n // 5 + 1))] == [1, 2, 3, 6, 7, 11]"
      - "all(any(4 * a + 5 * b == n for a in range(n // 4 + 1) for b in range(n // 5 + 1)) for n in range(12, 2000))"
      - "12 == 4 * 3 and 13 == 4 * 2 + 5 and 14 == 4 + 5 * 2 and 15 == 5 * 3"
      - "17 - 4 == 13"
    steps:
      - show: |
          <p><b>Định lý</b>: mọi số tiền từ 12 nghìn trở lên đều trả đúng được bằng tờ 4 nghìn và tờ 5 nghìn.</p>
          <table class="t"><tr><th>cơ sở</th><th>12</th><th>13</th><th>14</th><th>15</th></tr>
          <tr><td>cách trả</td><td>$4 + 4 + 4$</td><td>$4 + 4 + 5$</td><td>$4 + 5 + 5$</td><td>$5 + 5 + 5$</td></tr></table>
        focus: [1, 2]
        say: "Định lý, mọi số tiền từ 12 nghìn trở lên đều trả đúng được bằng tờ 4 nghìn và tờ 5 nghìn. Bước cơ sở ở đây có bốn giá trị, 12, 13, 14, 15, và mỗi giá trị đều ghép được như trên màn hình."
      - show: |
          <p><b>Quy nạp mạnh</b>: với $n \ge 16$, giả sử <b>mọi</b> số từ 12 tới $n - 1$ đều trả được. Vì $n - 4 \ge 12$, trả $n - 4$ rồi thêm một tờ 4 nghìn.</p>
          <p class="note">Thử: $17 = 13 + 4$, mà 13 đã trả được ✓</p>
          <div class="box key">Khác quy nạp thường: bước sau cần giá trị cách đó <b>4</b> bước, nên giả thiết phải phủ mọi giá trị trước, và cơ sở phải có đủ 4 giá trị.</div>
        focus: [1, 1, 2, 3]
        say: "Bước quy nạp mạnh, với n từ 16 trở đi, giả sử mọi số từ 12 tới n trừ 1 đều trả được. Vì n trừ 4 vẫn từ 12 trở lên, ta trả n trừ 4 rồi thêm một tờ 4 nghìn. Thử với 17, ta lấy cách trả 13 rồi thêm một tờ 4 nghìn. Khác quy nạp thường, bước sau cần giá trị cách đó 4 bước, nên cơ sở phải có đủ bốn giá trị."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm một chứng minh quy nạp"
    checks:
      - "[sum(1 for r in range(5) for c in range(5) if max(r, c) == k) for k in range(5)] == [1, 3, 5, 7, 9] and 5 * 5 == 25 == 1 + 3 + 5 + 7 + 9"
      - "[4 * 4, 4 + 4 + 5 + 4, 4 + 5 + 5 + 4, 5 + 5 + 5 + 4] == [16, 17, 18, 19] and [n - 4 for n in (16, 17, 18, 19)] == [12, 13, 14, 15]"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>tự hỏi</th></tr>
          <tr><td>1</td><td>Bước cơ sở đã kiểm <b>đúng</b> giá trị bắt đầu chưa?</td></tr>
          <tr><td>2</td><td>Chỉ ra được dòng nào <b>dùng giả thiết quy nạp</b> chưa? Không dùng thì gần như chắc có lỗi.</td></tr>
          <tr><td>3</td><td>Bước quy nạp có đúng với giá trị $n$ <b>nhỏ nhất</b> không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba câu hỏi. Một, bước cơ sở đã kiểm đúng giá trị bắt đầu chưa. Hai, chỉ ra được dòng nào dùng giả thiết quy nạp chưa, vì không dùng đến nó thì gần như chắc có lỗi. Ba, bước quy nạp có còn đúng với giá trị n nhỏ nhất không, lỗi hay nấp ở đó."
      - clear: true
        show: |
          <p><b>Đường khác 1 — đếm ô</b>: xếp các số lẻ thành từng lớp hình chữ L.</p>
