    - clear: true
      show: |
        <p><b>Chạy thật</b>: PIN 4, 6 chữ số; mật khẩu 8, 12 ký tự từ 62 ký tự (1 tỉ lần thử/giây, minh hoạ)</p><div class="code"><div>for do_dai in (4, 6):</div><div>    dem = 0</div><div>    for ma in range(10 ** do_dai):</div><div>        dem = dem + 1</div><div>    print(do_dai, &#x27;chu so:&#x27;, dem, &#x27;ma&#x27;)</div><div>for do_dai in (8, 12):</div><div>    so = 62 ** do_dai</div><div>    print(do_dai, &#x27;ky tu:&#x27;, so, &#x27;mat khau,&#x27;, so // 10 ** 9 // 86400, &#x27;ngay&#x27;)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>4 chu so: 10000 ma</div><div>6 chu so: 1000000 ma</div><div>8 ky tu: 218340105584896 mat khau, 2 ngay</div><div>12 ky tu: 3226266762397899821056 mat khau, 37341050 ngay</div></div>
      focus:
