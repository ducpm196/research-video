id: L09
course: DMS
series: "DMS · Toán rời rạc"
title: "Bài 9 — Quy tắc đếm: cộng, nhân, hoán vị, chỉnh hợp"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dms.yaml L09; audit/verify_plan_curricula.py DMS:L09; K. Rosen, Discrete Mathematics and Its Applications, mục 6.1, 6.3"
assumes: [set, dots, card, cup, cap, emptyset, in, implies]
# Quy ước: phép nhân hai số viết × (cả bài một kiểu). Chỉnh hợp viết A(n, k) như sách phổ thông Việt Nam (KHÔNG dùng P(n, k) —
#   sổ chung dành “P(” cho xác suất). Tốc độ thử mật khẩu 10⁹ lần/giây là giả định minh hoạ, ghi rõ trên màn hình.
objectives:
  - "Chọn đúng quy tắc cộng hay quy tắc nhân"
  - "Đếm hoán vị và chỉnh hợp"
  - "Ước lượng độ khó dò mật khẩu bằng phép đếm"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mật khẩu 8 ký tự mạnh đến đâu?"
    checks:
      - "26 ** 8 == 208827064576 and round(26 ** 8 / 10 ** 9) == 209"
      - "36 ** 8 == 2821109907456 and round(36 ** 8 / 10 ** 9 / 60) == 47"
    steps:
      - show: |
          <p>Giả sử máy dò thử được $10^9$ mật khẩu mỗi giây (giả định để minh hoạ).</p>
          <table class="t"><tr><th>mật khẩu 8 ký tự gồm</th><th>số mật khẩu</th><th>thử hết mất</th></tr>
          <tr><td>chữ thường (26 chữ)</td><td>$26^8 \approx 2{,}1 \times 10^{11}$</td><td>khoảng 209 giây</td></tr>
          <tr><td>chữ thường + chữ số (36)</td><td>$36^8 \approx 2{,}8 \times 10^{12}$</td><td>khoảng 47 phút</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, giả sử một máy dò thử được một tỉ mật khẩu mỗi giây. Mật khẩu 8 chữ thường có 26 mũ 8 khả năng, thử hết chỉ mất khoảng 209 giây. Thêm chữ số thì có 36 mũ 8 khả năng, mất khoảng 47 phút."
      - show: |
          <div class="box key">Những con số này đến từ một phép đếm rất đơn giản. Hôm nay: quy tắc cộng, quy tắc nhân, hoán vị, chỉnh hợp.</div>
        say: "Những con số đó đến từ một phép đếm rất đơn giản. Hôm nay ta học quy tắc cộng, quy tắc nhân, hoán vị và chỉnh hợp."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa và tích đếm lùi"
    checks:
      - "3 ** 2 == 3 * 3 == 9 and 10 ** 4 == 10 * 10 * 10 * 10 == 10000 and 2 ** 3 == 8"
      - "10 * 9 == 90 and 90 * 8 == 720 and 5 * 4 == 20 and 20 * 3 == 60"
    steps:
      - show: |
          <table class="t"><tr><th>viết gọn</th><th>nghĩa</th><th>kết quả</th></tr>
          <tr><td>$2^3$</td><td>2 × 2 × 2</td><td>8</td></tr>
          <tr><td>$3^2$</td><td>3 × 3</td><td>9</td></tr>
          <tr><td>$10^4$</td><td>10 × 10 × 10 × 10</td><td>10 000</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn hai phép tính sẽ dùng nhiều. Thứ nhất là lũy thừa, a mũ k là nhân k số a với nhau, ví dụ 2 mũ 3 bằng 2 nhân 2 nhân 2, bằng 8. Ba mũ hai bằng 3 nhân 3, bằng 9. Mười mũ bốn là bốn số 10 nhân nhau, bằng mười nghìn."
      - clear: true
        show: |
          <table class="t"><tr><th>tích đếm lùi</th><th>nhân dần từ trái</th><th>kết quả</th></tr>
          <tr><td>10 × 9 × 8</td><td>10 × 9 = 90, rồi 90 × 8</td><td>720</td></tr>
          <tr><td>5 × 4 × 3</td><td>5 × 4 = 20, rồi 20 × 3</td><td>60</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Thứ hai là tích đếm lùi, mỗi thừa số sau nhỏ hơn thừa số trước 1 đơn vị, ta nhân dần từ trái sang. Mười nhân 9 bằng 90, rồi 90 nhân 8 bằng 720. Năm nhân 4 bằng 20, rồi 20 nhân 3 bằng 60."

  # ───────────────────────── 2. QUY TẮC CỘNG VÀ NHÂN ─────────────────────────
  - id: rules
    kind: concept
    title: "Quy tắc cộng và quy tắc nhân"
    checks:
      - "3 + 4 == 7 and 3 * 4 == 12"
      - "len([(a, q) for a in range(3) for q in range(4)]) == 12"
    steps:
      - show: |
          <table class="t"><tr><th>quy tắc</th><th>khi nào</th><th>ví dụ</th></tr>
          <tr><td><b>cộng</b></td><td>chọn <b>một</b> trong các nhóm <b>rời nhau</b></td><td>3 món mặn hoặc 4 món chay: $3 + 4 = 7$ cách</td></tr>
          <tr><td><b>nhân</b></td><td>làm <b>lần lượt</b> nhiều bước, số cách mỗi bước không đổi</td><td>3 áo rồi 4 quần: $3 \times 4 = 12$ bộ</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Quy tắc cộng dùng khi ta chọn một trong các nhóm rời nhau. Ví dụ chọn một món trong 3 món mặn hoặc 4 món chay thì có 7 cách. Quy tắc nhân dùng khi làm lần lượt nhiều bước, và số cách ở mỗi bước không phụ thuộc bước trước đã chọn gì. Ví dụ 3 áo rồi 4 quần cho 3 nhân 4 bằng 12 bộ."
      - show: |
          <p>Vì sao nhân? Mỗi áo đi được với cả 4 quần: 4 bộ cho áo thứ nhất, 4 bộ cho áo thứ hai, 4 bộ cho áo thứ ba — cộng lại $4 + 4 + 4 = 3 \times 4$.</p>
          <p class="note">Quy tắc cộng chính là bao hàm–loại trừ của bài 5 khi hai nhóm không có phần chung.</p>
        focus: [1, 1, 2]
        say: "Vì sao lại nhân? Mỗi áo đi được với cả 4 quần, nên áo thứ nhất cho 4 bộ, áo thứ hai cho 4 bộ, áo thứ ba cho 4 bộ, cộng lại là 3 nhân 4. Còn quy tắc cộng chính là công thức bao hàm loại trừ ở bài 5, khi hai nhóm không có phần chung."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym_fact
    kind: symbol
    title: "Giải mã: giai thừa n! và chỉnh hợp A(n, k)"
    checks:
      - "__import__('math').factorial(5) == 120 and __import__('math').factorial(0) == 1"
      - "__import__('math').perm(10, 3) == 10 * 9 * 8 == 720"
      - "[__import__('math').factorial(n) for n in range(6)] == [1, 1, 2, 6, 24, 120] and 6 * 4 == 24 and 24 * 5 == 120"
    steps:
      - show: |
          <p>$n! = 1 \times 2 \times \dots \times n$ (đọc “n giai thừa”). &nbsp; $5! = 120$. &nbsp; Quy ước $0! = 1$.</p>
          <p>$A(n, k) = n \times (n - 1) \times \dots \times (n - k + 1)$: có đúng $k$ thừa số. &nbsp; $A(10, 3) = 10 \times 9 \times 8 = 720$.</p>
        introduces: [factorial]
        focus: [1, 1, 2, 2]
        say: "Dấu chấm than sau n đọc là n giai thừa, là tích các số từ 1 đến n, ví dụ 5 giai thừa bằng 120. Người ta quy ước 0 giai thừa bằng 1. Chữ A của n, k là số chỉnh hợp, tích của k số đếm lùi bắt đầu từ n. Ví dụ A của 10, 3 bằng 10 nhân 9 nhân 8, bằng 720."
      - show: |
          <table class="t"><tr><th>$n$</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>$n!$</td><td>1</td><td>1</td><td>2</td><td>6</td><td>24</td><td>120</td></tr></table>
        focus: [1, 1, 1]
        say: "Bảng giai thừa tính dần, mỗi ô bằng ô trước nhân với n. Ví dụ 4 giai thừa bằng 6 nhân 4, bằng 24, rồi 5 giai thừa bằng 24 nhân 5, bằng 120. Giai thừa tăng rất nhanh, nên ta thường để nguyên dạng tích."

  # ───────────────────────── 4. HOÁN VỊ, CHỈNH HỢP ─────────────────────────
  - id: perms
    kind: concept
    title: "Hoán vị và chỉnh hợp: chọn có thứ tự"
    checks:
      - "len(list(__import__('itertools').permutations('ABC'))) == 6"
      - "len(list(__import__('itertools').permutations(range(10), 3))) == 720"
    steps:
      - show: |
          <p><b>Hoán vị</b>: xếp $n$ vật khác nhau thành một hàng — $n!$ cách. &nbsp; 3 bạn A, B, C: ABC, ACB, BAC, BCA, CAB, CBA = $3! = 6$.</p>
          <p>Theo quy tắc nhân: chỗ đầu 3 lựa chọn, chỗ thứ hai còn 2, chỗ cuối còn 1: $3 \times 2 \times 1$.</p>
        focus: [1, 1, 2]
        say: "Hoán vị là cách xếp n vật khác nhau thành một hàng, có n giai thừa cách. Ba bạn A, B, C có 6 cách xếp như trên màn hình. Lý do theo quy tắc nhân, chỗ đầu có 3 lựa chọn, chỗ thứ hai còn 2, chỗ cuối còn 1."
      - show: |
          <p><b>Chỉnh hợp</b>: chọn $k$ trong $n$ vật <b>có thứ tự</b> — $A(n, k)$ cách.</p>
          <p>Trao giải nhất, nhì, ba cho 10 bạn: giải nhất 10 cách, giải nhì còn 9, giải ba còn 8 → $A(10, 3) = \hl{720}$.</p>
        focus: [1, 2, 2]
        say: "Chỉnh hợp là chọn k trong n vật, có tính thứ tự. Ví dụ trao giải nhất, nhì, ba cho 10 bạn. Giải nhất có 10 cách, giải nhì còn 9 bạn, giải ba còn 8 bạn, nên có 720 cách."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cây lựa chọn: vì sao nhân, vì sao bớt đi một"
    checks:
      - "len(list(__import__('itertools').product('abc', repeat=2))) == 3 * 3 == 9 and len([p for p in __import__('itertools').product('abc', repeat=2) if p[0] == p[1]]) == 3 and 9 - 3 == 6 == 3 * 2"
    steps:
      - show: |
          <div><svg width="1400" height="390" viewBox="0 0 1400 390"><text x="90" y="186" font-size="24" text-anchor="middle">bắt đầu</text><line x1="140" y1="178" x2="330" y2="70" stroke="#6b7280" stroke-width="3"/><line x1="380" y1="70" x2="600" y2="37" stroke="#fca5a5" stroke-width="3"/><text x="620" y="45" font-size="24" fill="#dc2626">aa</text><text x="670" y="45" font-size="20" fill="#dc2626">lặp: bỏ khi không lặp</text><line x1="380" y1="70" x2="600" y2="70" stroke="#6b7280" stroke-width="3"/><text x="620" y="78" font-size="24" fill="#15803d">ab</text><line x1="380" y1="70" x2="600" y2="103" stroke="#6b7280" stroke-width="3"/><text x="620" y="111" font-size="24" fill="#15803d">ac</text><circle cx="355" cy="70" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="355" y="78" font-size="24" text-anchor="middle">a</text><line x1="140" y1="178" x2="330" y2="180" stroke="#6b7280" stroke-width="3"/><line x1="380" y1="180" x2="600" y2="147" stroke="#6b7280" stroke-width="3"/><text x="620" y="155" font-size="24" fill="#15803d">ba</text><line x1="380" y1="180" x2="600" y2="180" stroke="#fca5a5" stroke-width="3"/><text x="620" y="188" font-size="24" fill="#dc2626">bb</text><text x="670" y="188" font-size="20" fill="#dc2626">lặp: bỏ khi không lặp</text><line x1="380" y1="180" x2="600" y2="213" stroke="#6b7280" stroke-width="3"/><text x="620" y="221" font-size="24" fill="#15803d">bc</text><circle cx="355" cy="180" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="355" y="188" font-size="24" text-anchor="middle">b</text><line x1="140" y1="178" x2="330" y2="290" stroke="#6b7280" stroke-width="3"/><line x1="380" y1="290" x2="600" y2="257" stroke="#6b7280" stroke-width="3"/><text x="620" y="265" font-size="24" fill="#15803d">ca</text><line x1="380" y1="290" x2="600" y2="290" stroke="#6b7280" stroke-width="3"/><text x="620" y="298" font-size="24" fill="#15803d">cb</text><line x1="380" y1="290" x2="600" y2="323" stroke="#fca5a5" stroke-width="3"/><text x="620" y="331" font-size="24" fill="#dc2626">cc</text><text x="670" y="331" font-size="20" fill="#dc2626">lặp: bỏ khi không lặp</text><circle cx="355" cy="290" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="355" y="298" font-size="24" text-anchor="middle">c</text><text x="330" y="370" font-size="22" text-anchor="middle" fill="#2563eb">ký tự đầu: 3 nhánh</text><text x="640" y="370" font-size="22" text-anchor="middle" fill="#6b7280">ký tự sau: 3 nhánh mỗi chỗ</text><text x="960" y="120" font-size="25">được lặp: 3 × 3 = 9 lá</text><text x="960" y="180" font-size="25" fill="#dc2626">bỏ 3 lá lặp (aa, bb, cc)</text><text x="960" y="240" font-size="25" fill="#15803d">không lặp: 3 × 2 = 6 lá</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cây lựa chọn khi lập chuỗi 2 ký tự từ a, b, c. Ký tự đầu có 3 nhánh, và từ mỗi nhánh ký tự sau lại tách 3 nhánh, nên được lặp thì có 3 nhân 3, bằng 9 lá. Nếu không được lặp, ba lá màu đỏ có hai ký tự giống nhau bị bỏ, vì ký tự sau trùng ký tự đầu. Khi đó mỗi nhánh đầu chỉ còn 2 nhánh con, nên còn 3 nhân 2, bằng 6 lá, đúng bằng A của 3, 2."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Mật khẩu: được lặp hay không được lặp"
    checks:
      - "26 ** 8 == 208827064576 and round(26 ** 8 / __import__('math').perm(26, 8), 1) == 3.3"
      - "__import__('math').perm(26, 8) == 62990928000"
      - "len([p for p in __import__('itertools').product('abc', repeat=2)]) == 9 and len(list(__import__('itertools').permutations('abc', 2))) == 6"
    steps:
      - show: |
          <p><b>Bước 1 — được lặp.</b> Mật khẩu 8 chữ thường, <b>được lặp</b> chữ: mỗi vị trí 26 lựa chọn $\implies 26^8 = 208\,827\,064\,576$.</p>
        say: "Bước một, mật khẩu 8 chữ thường được phép lặp chữ, mỗi vị trí có 26 lựa chọn, nên theo quy tắc nhân có 26 mũ 8 khả năng."
      - show: |
          <p><b>Bước 2 — không lặp.</b> Nếu <b>không được lặp</b>: $26 \times 25 \times \dots \times 19 = A(26, 8) = 62\,990\,928\,000$ — ít hơn khoảng 3 lần.</p>
        say: "Bước hai, nếu không được lặp, vị trí đầu có 26 lựa chọn, vị trí sau còn 25, cứ thế đến 19. Đó là chỉnh hợp A của 26, 8, ít hơn khoảng 3 lần."
      - show: |
          <table class="t"><tr><th>Bước 3 — so sánh</th><th>số khả năng</th></tr>
          <tr><td>được lặp, $26^8$</td><td>208 827 064 576</td></tr>
          <tr><td>không lặp, $A(26, 8)$</td><td>62 990 928 000</td></tr>
          <tr><td>chia nhau</td><td>$\frac{208\,827\,064\,576}{62\,990\,928\,000} \approx 3{,}3$</td></tr></table>
        focus: [1, "1.4", 1]
        say: "Bước ba, đặt hai con số cạnh nhau để so sánh. Chia số thứ nhất cho số thứ hai, được khoảng 3 phẩy 3. Vì vậy cấm lặp chữ làm số khả năng giảm khoảng 3 lần, chứ không làm mật khẩu mạnh hơn."
      - clear: true
        show: |
          <p class="note"><b>Bước 4 — thử nhỏ để kiểm</b>: 2 ký tự từ $\{a, b, c\}$: được lặp $3^2 = 9$ (aa, ab, …), không lặp $A(3, 2) = 6$ ✓</p>
        say: "Bước bốn, kiểm bằng trường hợp nhỏ, 2 ký tự từ a, b, c, được lặp có 9 cách, không lặp có 6 cách, máy liệt kê đều khớp, đúng như cây lựa chọn vừa vẽ."
      - show: |
          <div class="box key">Mỗi ký tự thêm vào nhân số khả năng lên 26 lần — độ dài quan trọng hơn mọi “mẹo” thay chữ.</div>
        say: "Điều rút ra, mỗi ký tự thêm vào nhân số khả năng lên 26 lần, nên độ dài mật khẩu quan trọng hơn mọi mẹo thay chữ."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: hai câu hỏi trước khi đếm"
    checks:
      - "26 * 26 == 676 and 676 * 676 == 456976 and 456976 * 456976 == 208827064576 and round(208827064576 / 10 ** 9) == 209"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>trả lời → dùng</th></tr>
          <tr><td>Các trường hợp có <b>chồng nhau</b> không?</td><td>không → cộng; có → bao hàm–loại trừ</td></tr>
          <tr><td><b>Thứ tự</b> có quan trọng không? Có được <b>lặp</b> không?</td><td>có thứ tự, lặp → $n^k$; có thứ tự, không lặp → $A(n, k)$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Tự kiểm bằng hai câu hỏi trước khi đếm. Một, các trường hợp có chồng nhau không, nếu không thì cộng, nếu có thì dùng bao hàm loại trừ. Hai, thứ tự có quan trọng không, và có được lặp không, vì mỗi câu trả lời dẫn tới một công thức khác nhau."
      - clear: true
        show: |
          <p><b>Đường khác — tính lại $26^8$ bằng bình phương liên tiếp</b>, vì $8 = 2 \times 2 \times 2$:</p>
          <table class="t"><tr><th>lũy thừa</th><th>cách tính</th><th>kết quả</th></tr>
          <tr><td>$26^2$</td><td>26 × 26</td><td>676</td></tr>
          <tr><td>$26^4$</td><td>676 × 676</td><td>456 976</td></tr>
          <tr><td>$26^8$</td><td>456 976 × 456 976</td><td>208 827 064 576 ✓</td></tr></table>
          <p>Ở tốc độ giả định $10^9$ lần mỗi giây: $\frac{208\,827\,064\,576}{10^9} \approx 209$ giây — khớp con số đầu bài ✓</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bây giờ kiểm bằng đường khác, không nhân tám lần số 26 mà bình phương liên tiếp, vì 8 bằng 2 nhân 2 nhân 2. Hai mươi sáu bình phương bằng 676. Bình phương tiếp được 456 nghìn 976, đó là 26 mũ 4. Bình phương lần nữa được đúng con số 26 mũ 8 ở ví dụ. Chia cho một tỉ lần thử mỗi giây, được khoảng 209 giây, khớp với con số đầu bài."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "sum(1 for n in range(10, 100) if n // 10 != n % 10) == 81 == 9 * 9"
      - "len(range(10, 100)) == 90 and len([n for n in range(10, 100) if n // 10 == n % 10]) == 9 and 90 - 9 == 81"
      - "__import__('math').factorial(0) == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cộng hai nhóm có phần chung <b class="red">(sai)</b>
          <br><span class="note">Học sinh giỏi Toán hoặc giỏi Văn: phải trừ những bạn giỏi cả hai (bài 5).</span></div>
        say: "Lỗi thứ nhất, cộng hai nhóm có phần chung. Đếm học sinh giỏi Toán hoặc giỏi Văn thì phải trừ đi những bạn giỏi cả hai, như bài 5."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhân khi số cách ở bước sau <b>thay đổi</b> theo bước trước <b class="red">(sai)</b>
          <br><span class="note">Số có 2 chữ số khác nhau: chọn chữ số cuối trước thì chữ số đầu còn 8 hay 9 cách tuỳ chữ số cuối có là 0 không. Chọn chữ số đầu trước: $9 \times 9 = 81$ ✓</span></div>
          <table class="t"><tr><th>đếm thẳng</th><th>số lượng</th></tr>
          <tr><td>mọi số có 2 chữ số, 10 đến 99</td><td>90</td></tr>
          <tr><td>bỏ số hai chữ số trùng: 11, 22, …, 99</td><td>9</td></tr>
          <tr><td>còn lại</td><td>90 − 9 = 81 ✓</td></tr></table>
        focus: [1, 1, 1, 2]
        say: "Lỗi thứ hai, nhân mà không để ý số cách ở bước sau phụ thuộc bước trước. Với số có 2 chữ số khác nhau, ta chọn chữ số đầu trước, có 9 cách vì khác 0, rồi chữ số sau còn 9 cách, được 81. Nếu chọn chữ số sau trước thì số cách cho chữ số đầu thay đổi theo, không nhân thẳng được. Đếm thẳng cũng ra vậy, có 90 số từ 10 đến 99, bỏ 9 số có hai chữ số trùng nhau, còn 81."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng chỉnh hợp khi thứ tự <b>không</b> quan trọng <b class="red">(sai)</b>
          <br><span class="note">Chọn 3 bạn đi trực nhật (không phân vai): A, B, C và C, B, A là một nhóm — chỉnh hợp đếm nhóm đó 6 lần.</span></div>
        say: "Lỗi thứ ba, dùng chỉnh hợp khi thứ tự không quan trọng. Chọn 3 bạn đi trực nhật mà không phân vai, thì ba bạn A, B, C xếp theo kiểu nào cũng là một nhóm, nhưng chỉnh hợp lại đếm nhóm đó 6 lần."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ $0! = 0$ <b class="red">(sai)</b>
          <br><span class="note">$0! = 1$: có đúng một cách xếp 0 vật — không làm gì. Quy ước này giữ cho công thức đúng cả khi $k = n$.</span></div>
        say: "Lỗi thứ tư, nghĩ 0 giai thừa bằng 0. Thật ra 0 giai thừa bằng 1, vì có đúng một cách xếp 0 vật, là không làm gì cả, và quy ước này giữ cho các công thức đúng ở trường hợp biên."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len(list(__import__('itertools').permutations(range(1, 6), 3))) == 60 == 5 * 4 * 3"
      - "9999 + 1 == 10000 == 10 * 10 * 10 * 10"
      - "10 ** 4 == 10000 and len(list(__import__('itertools').product(range(10), repeat=4))) == 10000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Có bao nhiêu số có 3 chữ số <b>khác nhau</b> lập từ các chữ số 1, 2, 3, 4, 5?</td></tr>
          <tr><td>2</td><td>Mã khoá cửa gồm 4 chữ số (0 đến 9, được lặp). Có bao nhiêu mã?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có bao nhiêu số có 3 chữ số khác nhau lập từ các chữ số 1, 2, 3, 4, 5? Câu hai, mã khoá cửa gồm 4 chữ số từ 0 đến 9, được lặp, có bao nhiêu mã? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <table class="t"><tr><th>chữ số</th><th>hàng trăm</th><th>hàng chục</th><th>hàng đơn vị</th></tr>
          <tr><td>số lựa chọn</td><td>5</td><td>4 (khác hàng trăm)</td><td>3 (khác hai số trước)</td></tr></table>
          <p>① Có thứ tự, không lặp: $A(5, 3) = 5 \times 4 \times 3 = \hl{60}$.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, lập số theo từng hàng. Hàng trăm có 5 lựa chọn, hàng chục còn 4 vì phải khác hàng trăm, hàng đơn vị còn 3. Đây là có thứ tự và không lặp, nên là A của 5, 3, bằng 5 nhân 4 nhân 3, bằng 60."
      - show: |
          <p>② Có thứ tự, được lặp: mỗi vị trí 10 lựa chọn, $10 \times 10 \times 10 \times 10 = 10^4 = \hl{10\,000}$ mã — đúng bằng các số từ 0000 đến 9999.</p>
        say: "Câu hai, có thứ tự và được lặp, mỗi vị trí 10 lựa chọn, nên có 10 nhân 10 nhân 10 nhân 10, bằng 10 mũ 4, tức mười nghìn mã. Kiểm nhanh, mỗi mã là một số từ 0 đến 9999 viết đủ bốn chữ số, và có đúng 9999 cộng 1, bằng mười nghìn số như vậy."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">rời nhau: cộng</span><span class="a">→</span>
          <span class="n">lần lượt từng bước: nhân</span><span class="a">→</span>
          <span class="n">xếp hết $n$ vật: $n!$</span><span class="a">→</span>
          <span class="n">chọn $k$ có thứ tự: $A(n, k)$</span></div>
        say: "Tổng kết lại, các nhóm rời nhau thì cộng, làm lần lượt từng bước thì nhân. Xếp hết n vật có n giai thừa cách. Chọn k vật có thứ tự có A của n, k cách."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi đếm, hãy mô tả một cách tạo ra từng đối tượng theo từng bước — rồi mới chọn quy tắc.</div>
        say: "Điều cần mang theo, trước khi đếm hãy mô tả cách tạo ra từng đối tượng theo từng bước, rồi mới chọn quy tắc."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>tổ hợp</b> — chọn không quan tâm thứ tự, nhị thức Newton và tam giác Pascal.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học tổ hợp, cách chọn không quan tâm thứ tự, cùng nhị thức Newton và tam giác Pascal. Hẹn gặp bạn ở bài tiếp theo."
