      - - '2.7'
        - '2.8'
      - '2.8'
      - - '4.3'
        - '4.4'
      say: Đây là chương trình chạy thật. Vòng lặp đầu đếm từng mã PIN, 4 chữ số có đúng 10 nghìn mã, 6 chữ số có đúng một triệu mã. Ở các dòng cuối, ta tính 62 mũ 8 và 62 mũ 12 bằng quy tắc nhân, rồi chia cho một tỉ lần thử mỗi giây để ra số giây. Chia tiếp cho 86400, số giây của một ngày, để ra số ngày; hai dấu gạch chéo là chia lấy phần nguyên. Máy bỏ phần lẻ, nên mật khẩu 8 ký tự hiện 2 ngày, thật ra khoảng hai ngày rưỡi, còn mật khẩu 12 ký tự cần hơn 37 triệu ngày.
    - clear: true
      show: |
        <table class="t"><tr><th>độ dài và bảng ký tự</th><th>số khả năng</th><th>dò hết ở một tỉ lần mỗi giây (số minh hoạ)</th></tr><tr><td>PIN 4 chữ số ($10^4$)</td><td>10 000</td><td>10 phần triệu giây</td></tr><tr><td>PIN 6 chữ số ($10^6$)</td><td>1 000 000</td><td>1 phần nghìn giây</td></tr><tr><td>8 ký tự từ 62 ký tự: 26 chữ thường, 26 chữ hoa, 10 chữ số ($62^8$)</td><td>khoảng $2{,}2 \times 10^{14}$</td><td>hơn 2 ngày (khoảng 2,5 ngày)</td></tr><tr><td>12 ký tự từ 62 ký tự ($62^{12}$)</td><td>khoảng $3{,}2 \times 10^{21}$</td><td>khoảng 102 000 năm</td></tr></table><div class="box key">Mỗi ký tự thêm vào <b>nhân</b> số khả năng lên 62 lần. Hệ thật không chỉ dựa vào độ dài: thường còn <b>giới hạn số lần thử</b> mỗi tài khoản, vì máy dò thật không nhanh một tỉ lần mỗi giây vào một dịch vụ trực tuyến (số minh hoạ).</div>
      focus:
