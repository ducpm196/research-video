    - clear: true
      show: |
        <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>dem = dem + 1</code></td><td>một dấu bằng là <b>gán</b>: tính bên phải rồi cất vào tên bên trái, ở đây là tăng dem thêm 1</td><td>dem đang là 9 thì thành 10</td></tr><tr><td><code>print(do_dai, &#x27;chu so:&#x27;, dem)</code></td><td>in chữ trong dấu nháy và các giá trị ra cửa sổ, cách nhau một dấu cách</td><td>in ra 4 chu so: 10000</td></tr><tr><td><code>so // 10 ** 9 // 86400</code></td><td><code>//</code> là chia lấy phần nguyên: chia cho 10<sup>9</sup> (một tỉ lần thử mỗi giây) ra số giây, rồi chia cho 86400 (số giây của một ngày) ra số ngày</td><td>7 // 2 là 3</td></tr></table>
