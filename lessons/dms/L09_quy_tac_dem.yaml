        <div class="box key"><b>Nếu kẹt:</b> có lặp: mỗi vị trí $n$ lựa chọn, $n^k$ cách (<code>product(..., repeat=k)</code>). Không lặp: $n \times (n-1) \times \dots$ (<code>permutations(..., k)</code>); cả hai mượn từ <code>itertools</code>, cú pháp và ví dụ nhỏ ở <code>de.md</code>. Số chẵn: hàng đơn vị là 2 hoặc 4 (2 cách), hai hàng còn lại chọn từ 4 chữ số còn lại, có thứ tự: $2 \times 4 \times 3 = 24$. Lời giải ở <code>labs/DMS/L09/loi_giai.py</code> — chỉ mở sau khi đã thử.</div><table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>product(X, repeat=k)</code></td><td>mọi chuỗi độ dài k, mỗi vị trí chọn <b>có lặp</b> từ X</td><td>product('ab', repeat=2) cho aa, ab, ba, bb: 4 chuỗi, bằng 2 mũ 2</td></tr><tr><td><code>permutations(X, k)</code></td><td>mọi chuỗi độ dài k, <b>không lặp</b> phần tử</td><td>permutations('abc', 2) cho ab, ac, ba, bc, ca, cb: 6 chuỗi, bằng 3 nhân 2</td></tr></table>
      focus:
      - 1
      - 1
      - 1
      - 1
      - 1
      - '2.2'
      - '2.3'
      say: Nếu kẹt, khi được lặp thì mỗi vị trí có n lựa chọn, nhân lại là n mũ k. Khi không lặp thì mỗi vị trí sau ít hơn vị trí trước một lựa chọn. Với số chẵn, hàng đơn vị là 2 hoặc 4, rồi hai hàng còn lại chọn có thứ tự từ bốn chữ số còn lại. Hai hàm liệt kê có sẵn được mượn ở đầu tệp, cách dùng kèm ví dụ nằm trong đề. Lời giải nằm trong thư mục thực hành, và bạn chỉ nên mở sau khi đã thử. Hàm đầu liệt kê mọi chuỗi độ dài k mà mỗi vị trí được chọn lặp lại từ tập X, nên có n mũ k chuỗi. Hàm sau liệt kê mọi chuỗi độ dài k không lặp phần tử, nên có n nhân n trừ 1 nhân tiếp, đủ k thừa số.
