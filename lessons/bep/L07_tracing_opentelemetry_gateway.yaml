    say: Gợi ý triển khai làm rõ hai bẫy dễ nhầm khi chấm các ca kiểm ẩn. Thứ nhất nếu tổng số sự kiện vượt quá hạn mức quota
      ở đầu vào. Cổng chỉ được phép xử lý đúng trong phạm vi quota nên các lỗi đến sau sẽ không thể làm bật cầu dao. Thứ hai
      hãy đặt lại bộ đếm lỗi về không mỗi khi gặp một yêu cầu thành công trước ngưỡng. Đặt lại bộ đếm lỗi liên tiếp về không
      ngay khi có một lượt xử lý thành công nhằm tránh mở nhầm cầu dao vì các lỗi rải rác.
