  title: Truy vết phân tán OpenTelemetry và điều phối API Gateway
  checks:
  - 120 - (25 + 80) == 15
  - 80 > 25
  steps:
  - show: <div class='box key'><p>Trên cây <b>OpenTelemetry</b>, nhịp cổng <code>GW = 120 ms</code> chứa hai con <code>Auth(25
      ms)</code> và <code>Pay(80 ms)</code>, nên thời gian tự xử lý của cổng chỉ là <code><b>15 ms</b></code> còn nút thắt
      nằm tại <b>Pay</b>.</p></div>
    say: Rất nhiều đội vận hành thấy cảnh báo cổng API Gateway phản hồi chậm một trăm hai mươi mi-li-giây liền vội vàng tăng
      gấp đôi máy chủ cổng. Tuy nhiên hiệu năng toàn hệ thống vẫn không hề nhúc nhích. Chỉ khi dựng đúng cây truy vết OpenTelemetry
      để trừ đi tổng thời gian các nhịp con chờ dịch vụ phía sau, nguyên nhân gốc mới lộ diện rõ ràng.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Tính thời gian tự xử lý ròng trên cây <b>OpenTelemetry</b> và cài
      bảo vệ tại <b>API Gateway</b>.</p></div>
    say: Hôm nay ta học cách tính thời gian tự xử lý ròng trên cây OpenTelemetry và cài cơ chế chặn quá tải ở API Gateway.
      Phân tích thời gian tự xử lý ròng tránh quyết định mở rộng nhầm tầng hệ thống vốn chỉ đang đứng chờ đối tác phía sau.
      Bảo vệ cửa ngõ API đúng cách chặn đứng lưu lượng tràn trước khi làm sập toàn bộ cụm dịch vụ bên trong.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Vết truy vết phân tán</td><td>Một
      yêu cầu đi qua nhiều máy chủ cùng mang một mã vết chung trace_id</td></tr><tr><td>Cầu dao tự ngắt</td><td>Ngắt mạch
      chuyển nhanh sang trạng thái mở khi dịch vụ hạ lưu lỗi liên tiếp</td></tr><tr><td>Độ trễ phân vị p95</td><td>Không dùng
      giá trị trung bình vì giấu nhẹm 5% ca chậm nặng của người dùng</td></tr></table>
    say: Khi một lời gọi API thanh toán đi qua cổng API Gateway rồi phân nhánh qua xác thực, rủi ro và sổ cái. Nhật ký rời
      rạc từng máy không thể trả lời được câu hỏi khâu nào thật sự làm chậm người dùng. Chuẩn OpenTelemetry giải quyết trọn
      vẹn điểm mù đó bằng cây truy vết phân tán nơi mọi dịch vụ con gắn chặt vào mã vết chung cùng mã nhịp cha. Kết hợp số
      liệu truy vết với cổng API Gateway kiểm soát tốc độ và cầu dao tự ngắt giúp hệ thống vừa nhìn rõ điểm nghẽn. Vừa chặn
      đứng lưu lượng tràn khi hạ lưu suy yếu. Bài học hôm nay trang bị kỹ năng đọc cây OpenTelemetry và cài thuật toán bảo
      vệ ngay tại tầng Gateway. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Truy vết phân
      tán nối liền từng mẩu thời gian rời rạc qua nhiều máy chủ thành một cây gọi thống nhất dễ phân tích. Giới hạn tốc độ
      và cầu dao tự ngắt đóng vai trò hai van an toàn giữ ổn định cổng vào trước mọi cơn bão lưu lượng hay sự cố hạ lưu.
