      rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Tìm dịch vụ tự nghẽn</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Pay
      chiếm self_ms lớn nhất</text></svg></div>
    say: Hình minh hoạ cách cổng API Gateway khởi tạo mã vết OpenTelemetry ngay điểm chạm đầu tiên rồi truyền dọc toàn hệ
      thống. Dịch vụ xác thực và thanh toán tiếp nhận mã vết cha qua phần đầu HTTP để gắn nhịp con của mình vào cùng một cây.
      Từ cây thu thập được, bộ phân tích chỉ ra ngay dịch vụ nào tiêu tốn thời gian tự xử lý lớn nhất.
    clear: true
  - show: <table class='t'><tr><th>công cụ quan sát &amp; cổng</th><th>quyết định vận hành chuẩn</th></tr><tr><td>Đo <code>self_ms</code>
      trên Span</td><td>Tối ưu đúng dịch vụ gây nghẽn thay vì đoán mò</td></tr><tr><td>Rate Limit + Circuit Breaker</td><td>Chặn
      bão tải tại cửa ngõ, giữ luồng dịch vụ lành</td></tr></table>
    say: Khi biết dịch vụ nào đang chiếm thời gian ròng lớn nhất, đội ngũ tập trung tối ưu đúng điểm nóng thay vì đoán mò. Cầu
      dao ở cửa ngõ giúp ngắt nhanh các nhánh gọi hỏng liên tiếp để tài nguyên luồng phục vụ kịp các tính năng khác.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 120 - (25 + 80) == 15
  - 80 > 25
  steps:
  - show: <div class='box key'><p><b>1. Thời gian tự xử lý (Self-time):</b> <code>self(s) = dur(s) - sum(dur(c) for c in direct_children(s))</code>.</p><p><b>2.
      Bảo vệ API Gateway:</b> Từ chối <code>429</code> khi vượt hạn mức <code>quota</code> và mở <code>Circuit Breaker (503)</code>
      khi chuỗi lỗi chạm <code>threshold</code>.</p></div>
    say: Hai biểu thức giúp phân tích cây truy vết chính xác và giữ an toàn cửa ngõ trước mọi cơn bão lưu lượng. Khi tính
      thời gian tự xử lý, ta chỉ trừ trực tiếp các nhịp con nối tiếp không chạy lồng song song để biết hàm cục bộ đang tiêu
      tốn bao nhiêu công sức. Ở API Gateway, yêu cầu vượt hạn mức tốc độ nhận mã bốn hai chín ngay tại cửa vào, còn nhánh
      hạ lưu lỗi liên tiếp sẽ bị ngắt sang mã năm lẻ ba. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát
      định nghĩa gốc. Phép trừ các nhịp con trực tiếp tránh cộng trùng thời gian của các tầng cháu nằm sâu bên dưới hơn nữa.
      Kết hợp giới hạn tốc độ mã bốn hai chín và mở cầu dao mã năm lẻ ba bảo vệ trọn vẹn cả hai chiều vào ra của cổng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 120 - (25 + 80) == 15
  - 80 > 25
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>spans = [(''gw'', None, 120), (''auth'', ''gw'',
      25), (''pay'', ''gw'', 80), (''db'', ''pay'', 70)]</div><div>children_sum = {sid: 0 for sid, _, _ in spans}</div><div>for
      sid, pid, dur in spans:</div><div>    if pid: children_sum[pid] += dur</div><div>self_ms = {sid: dur - children_sum[sid]
      for sid, _, dur in spans}</div><div>bottleneck = max(self_ms, key=self_ms.get)</div><div>print(f''gw_self={self_ms["gw"]}ms
      db_self={self_ms["db"]}ms top={bottleneck}'')</div></div>'
    say: Đoạn mã dựng cây vết phân tán OpenTelemetry nối từng dịch vụ theo cặp định danh nhịp và nhịp cha qua bốn chặng thực
      thi. Dịch vụ cổng ghi nhận tổng một trăm hai mươi mi-li-giây nhưng gần như toàn bộ nằm ở hai nhánh con xác thực và thanh
      toán. Thanh toán ghi tám mươi mi-li-giây nhưng bảy mươi mi-li-giây trong số đó lại chờ tại tầng cơ sở dữ liệu. Dù nhìn
      tổng thời gian tại cổng là một trăm hai mươi mi-li-giây, cây vết minh oan ngay cho cổng và chỉ ra nút nghẽn nằm sâu
      ở cơ sở dữ liệu.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>gw_self=15ms db_self=70ms top=db</div></div>
    say: Đầu ra chạy thật chỉ đích danh nút thắt tự xử lý lớn nhất nằm ở cơ sở dữ liệu với bảy mươi mi-li-giây, còn cổng chỉ
      mất mười lăm mi-li-giây. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Tách biệt
      đúng hai thông số cổng và cơ sở dữ liệu rút ngắn đáng kể thời gian khoanh vùng sự cố trong ca trực thực tế.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 120 - (25 + 80) == 15
  - 80 > 25
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import math</div><div>latencies = [10, 12, 14, 15,
      18, 20, 22, 25, 30, 180]</div><div>p95_idx = math.ceil(0.95 * len(latencies)) - 1</div><div>reqs = [''ok'', ''ok'',
      ''fail'', ''fail'', ''fail'', ''ok'']</div><div>fails, cb_open = 0, False</div><div>for r in reqs:</div><div>    if
      cb_open: break</div><div>    fails = 0 if r == ''ok'' else fails + 1</div><div>    if fails &gt;= 3: cb_open = True</div><div>m
      = sum(latencies) / len(latencies)</div><div>print(f''p95={latencies[p95_idx]}ms mean={m:.1f}ms cb_open={int(cb_open)}'')</div></div>'
    say: Phép kiểm chứng thứ hai tính thời gian tự xử lý ròng và tìm nhịp nghẽn phân vị chín lăm trên mảng độ trễ kèm mô phỏng
      cầu dao tự ngắt. Trên mười mẫu đo chỉ có một ca chậm tới một trăm tám mươi mi-li-giây, giá trị trung bình vẫn khá thấp
      nhưng phân vị chín lăm phản ánh ngay độ trễ xấu. Đồng thời khi gặp ba lỗi nối tiếp nhau, cầu dao tự chuyển trạng thái
      mở ngay trước yêu cầu thứ sáu. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Mức
      phân vị chín mươi lăm phản ánh trung thực phần đuôi chậm mà khách hàng cảm nhận, điều mà giá trị trung bình thường che
      mất.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>p95=180ms mean=34.6ms cb_open=1</div></div>
    say: Đầu ra kiểm chứng cho thấy trung bình ba mươi bốn phẩy sáu mi-li-giây trong khi phân vị chín lăm vọt lên một trăm
      tám mươi mi-li-giây và cầu dao kịp mở khoá chặt luồng. Vì vậy phân vị chín lăm phản ánh trực tiếp độ trễ đuôi thực tế
      so với mức trung bình cộng. Khi ba lỗi liên tiếp xảy ra, cầu dao lập tức đóng cửa ngắt nhánh lỗi nhằm bảo vệ hệ thống
      không chờ hết thời gian vô ích.
    focus:
    - 1
    - 2
