      thời gian nằm ở dịch vụ con chứ không phải cổng.</p></td></tr></table>
    say: 'Đáp án câu một: thời gian tự xử lý của cổng chỉ là hai mươi mi-li-giây, nguyên nhân chậm nằm ở dịch vụ con. Con
      số hai mươi mi-li-giây tách rõ chi phí tự xử lý tại cổng ra khỏi phần thời gian đứng chờ dịch vụ phía sau.'
