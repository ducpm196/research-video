      chứa một nhịp con một trăm ba mươi mi-li-giây. Thì thời gian tự xử lý của cổng bằng bao nhiêu? Câu hai, tại sao ta ưu
      tiên lưu đủ trăm phần trăm các vết bị lỗi thay vì vết bình thường? Tạm dừng và tự trả lời. Hai câu hỏi giúp củng cố
      phép tính thời gian tự xử lý ròng trên cây vết và chiến lược lấy mẫu tiết kiệm ở quy mô lớn.
