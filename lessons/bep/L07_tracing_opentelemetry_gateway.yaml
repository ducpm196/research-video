      định danh duy nhất toàn hành trình và mã từng công đoạn gọi con</td></tr><tr><td><code>self_ms = dur - sum(children)</code></td><td>Thời
      gian thực sự tiêu tốn bên trong dịch vụ sau khi trừ các lời gọi hạ lưu</td></tr><tr><td><code>Gateway Rate + CB</code></td><td>Giới
      hạn số yêu cầu mỗi giây kết hợp cầu dao mở mạch ngay ở cửa ngõ</td></tr></table>
    say: Bảng ký hiệu trình bày ba khái niệm cốt lõi của khả năng quan sát phân tán và kiểm soát lưu lượng cửa ngõ. Nhờ cặp
      mã vết và mã nhịp cha, mọi nhật ký rải rác trên các cụm máy tự động ghép khít thành cây gọi hoàn chỉnh. Phép trừ tổng
      thời gian các nhịp con giúp tách bạch ngay dịch vụ tự xử lý chậm khỏi dịch vụ chỉ đứng chờ đối tác. Cổng API Gateway
      kết hợp giới hạn tần suất và cầu dao chặn tải độc hại trước khi lọt vào bên trong. Những quy chuẩn trên sẽ xuyên suốt
      từ phần chạy thực nghiệm mẫu tới bài tập thực hành cuối bài. Cặp định danh vết và nhịp cho phép tái dựng toàn bộ quan
      hệ cha con chính xác dù bản ghi gửi về lệch thứ tự thời gian. Thao tác trừ tổng nhịp con trực tiếp chỉ ra đúng nơi tiêu
      tốn tài nguyên CPU hay chờ khoá bảng trong cơ sở dữ liệu thật sự.
