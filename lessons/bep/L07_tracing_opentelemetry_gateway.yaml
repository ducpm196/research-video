- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn vận hành
  checks:
  - 120 - (25 + 80) == 15
  - 80 > 25
  steps:
  - show: '<table class=''t''><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Truy vết
      mọi yêu cầu 100%</td><td>Chi phí lưu trữ lớn ở tải 50k RPS</td><td>Lấy mẫu theo đầu vết tail-sampling: giữ 100% vết
      lỗi & chậm</td></tr><tr><td>Thiếu truyền traceparent HTTP</td><td>Cây vết bị đứt thành nhiều mảnh rời</td><td>Tự động
      chuyển tiếp tiêu đề traceparent qua mọi khách HTTP/Kafka</td></tr><tr><td>Dịch vụ hạ lưu kẹt cạn thread</td><td>Cả cổng
      API Gateway treo lây</td><td>Áp hạn mức token bucket + Circuit Breaker cô lập tại Gateway</td></tr></table><div class="code"><div>quota,
      passed, fails = 4, 0, 0</div><div>for i, ev in enumerate([''OK'', ''OK'', ''FAIL'', ''FAIL'', ''OK'']):</div><div>    if
      i &gt;= quota or fails &gt;= 2: break  <span class="cm"># chặn 429 hoặc 503</span></div><div>    fails = 0 if ev ==
      ''OK'' else fails + 1; passed += int(ev == ''OK'')</div></div>'
    say: Bảng kiến trúc hướng dẫn cách cài chính sách giới hạn tốc độ và tự ngắt Circuit Breaker ngay tại API Gateway song
      song chiến lược lấy mẫu thông minh. Khi lưu lượng chạm hàng chục nghìn yêu cầu mỗi giây, thay vì lưu mọi vết sạch. Đội
      vận hành lưu trọn trăm phần trăm các vết có mã lỗi hoặc độ trễ vượt ngưỡng P95. Ngoài ra truyền đủ phần đầu tiêu đề
      vết qua hàng đợi bất đồng bộ giúp cây OpenTelemetry liền mạch xuyên suốt từ cửa ngõ tới kho lưu trữ. Lấy mẫu thông minh
      theo đuôi vết giữ đủ dấu vết sự cố nhưng giảm hơn chín mươi phần trăm chi phí lưu trữ ở quy mô chục nghìn yêu cầu giây.
      Truyền đầy đủ ngữ cảnh tiêu đề vết chuẩn qua hàng đợi bất đồng bộ bảo đảm hành trình theo dõi không đứt đoạn.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (quên truyền traceparent):</b>
      Tự tạo mã vết mới ở dịch vụ sau làm đứt gãy hành trình kết nối từ cổng vào.<br><b>Lỗi 2 (đánh giá theo trung bình):</b>
      Báo cáo độ trễ trung bình 20 ms che giấu hoàn toàn 5% khách hàng phải đợi hơn 2 giây.<br><b>Lỗi 3 (thiếu cô lập tại
      Gateway):</b> Cho phép dịch vụ lỗi chậm chiếm giữ kết nối vô hạn làm tê liệt luôn cả các tuyến API lành khác.</div></td></tr></table>
    say: Hãy lưu tâm ba lỗi thường gặp khi triển khai OpenTelemetry và bảo vệ API Gateway. Lỗi thứ nhất là quên chuyển tiếp
      phần đầu ngữ cảnh vết sang cuộc gọi tiếp theo khiến một giao dịch bị tách thành nhiều mảnh rời rạc. Lỗi thứ hai là lấy
      con số trung bình làm báo cáo chất lượng dịch vụ trong khi người dùng chịu đựng độ trễ phân vị cao. Lỗi thứ ba là đặt
      cầu dao sai chỗ hoặc quên giới hạn thời gian chờ tại cửa ngõ. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững
      tính ổn định khi lưu lượng tăng cao. Kiểm kỹ các cấu hình hộp thư khách HTTP xem có tự động truyền tiếp tiêu đề vết
      chuẩn qua mọi dịch vụ hay không. Không quên cấu hình ngưỡng thời gian phục hồi cho cầu dao chuyển sang trạng thái bán
      mở thử thăm dò lại dịch vụ hạ lưu.
