      giữ lại toàn bộ dấu vết phục vụ điều tra sự cố khi có lỗi hoặc chậm.</p></td></tr></table>
    say: 'Đáp án câu hai: nhằm tối ưu chi phí lưu trữ dữ liệu quan sát nhưng vẫn giữ trọn bằng chứng phục vụ phân tích mỗi
      khi có sự cố. Ưu tiên lưu trọn vẹn vết chậm và vết lỗi mang lại dữ liệu điều tra giá trị nhất với mức chi phí hợp lý.'
