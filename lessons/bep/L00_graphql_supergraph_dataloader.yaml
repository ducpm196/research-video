- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>API theo tài nguyên REST</td><td>Mỗi
      điểm cuối trả cấu trúc cố định nên dễ thừa hoặc thiếu trường</td></tr><tr><td>Khái niệm hợp nhất thực thể</td><td>Khoá
      định danh giúp nối dữ liệu từ nhiều dịch vụ miền con</td></tr><tr><td>Chi phí lượt mạng và truy vấn</td><td>Một truy
      vấn lớn gộp khoá nhanh hơn rất nhiều so với hai mươi truy vấn nhỏ</td></tr></table>
    say: Chào bạn đến với bài mở đầu của khoá hệ sinh thái backend doanh nghiệp đáp ứng các yêu cầu phỏng vấn chuyên sâu.
      Khi ứng dụng di động cần đọc thông tin đơn hàng cùng hồ sơ chủ tài khoản và lịch sử ví điện tử trên cùng một màn hình.
      Kiến trúc truyền thống theo tài nguyên buộc đội ngũ phải gọi nối tiếp nhiều điểm cuối rời rạc hoặc nhận thừa hàng chục
      trường không dùng tới. Mô hình GraphQL Supergraph ghép nối nhiều Subgraph miền con qua một lớp định tuyến thống nhất
      giúp trình khách truy vấn đúng phần cần thiết trong một yêu cầu duy nhất. Tuy nhiên nếu không tổ chức khâu phân giải
      khéo léo ở tầng máy chủ. Một truy vấn lồng nhau nhìn đơn giản rất dễ biến thành hàng trăm truy vấn lặp xuống cơ sở dữ
      liệu. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Mỗi phân hệ miền con sở hữu trọn
      vẹn lược đồ và kho lưu trữ riêng mà không cần biết chi tiết bảng của phân hệ khác. Cổng hợp nhất ở tầng trên giữ vai
      trò cầu nối duy nhất nhận câu truy vấn khách rồi điều phối xuống bên dưới.
