      học. Cuối cùng bạn cộng thêm một truy vấn cha ban đầu. Phép chia làm tròn lên bằng hàm trần bảo đảm ngay cả phần dư
      nhỏ hơn kích thước lô cũng được tính thêm một truy vấn lô.
