- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 1 + 20 == 21
  - 21 - 2 == 19
  steps:
  - show: <div class='box key'><p><b>1. Chi phí N+1 thô:</b> <code>Q_naive = 1 + N_items</code> (tăng tuyến tính theo kích
      thước trang).</p><p><b>2. Chi phí DataLoader:</b> <code>Q_batched = 1 + ceil(k / batch_limit)</code> (bằng <code>1</code>
      nếu rỗng <code>k=0</code>; bằng <code>2</code> nếu <code>1 &lt;= k &lt;= batch_limit</code>).</p></div>
    say: Hai biểu thức định lượng chỉ ra giới hạn mở rộng của hai chiến lược phân giải trường lồng nhau. Với cách viết ngây
      thơ, số lượt gọi tầng lưu trữ luôn bằng một cộng thêm toàn bộ số dòng trả về ở tầng cha. Ngược lại khi gom các mã ngoại
      sang tập hợp duy nhất rồi chia thành từng lô theo giới hạn kích thước lô. Tổng số truy vấn chỉ bằng một nếu danh sách
      rỗng, hoặc bằng hai khi số khoá không vượt giới hạn một lô. Nhờ vậy hệ số giảm tải đạt hàng chục lần chỉ bằng gom khoá
      mà không cần nâng cấp máy chủ. Với kích thước lô giới hạn hợp lý, câu truy vấn hợp nhất tận dụng tối đa chỉ mục sẵn
      có của bảng tài khoản. Đoạn công thức mới bảo toàn đúng cả trường hợp danh sách rỗng lẫn trường hợp chia nhiều lô.
