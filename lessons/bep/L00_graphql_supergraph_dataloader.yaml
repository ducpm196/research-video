      riêng):</b> Dùng chung một thực thể DataLoader toàn cục cho nhiều yêu cầu HTTP gây lộ dữ liệu đệm giữa hai người dùng.<br><b>Lỗi
      2 (bỏ kiểm độ sâu):</b> Cho phép lồng trường cha con tuỳ ý làm kẻ xấu tạo truy vấn tổ hợp đánh sập bộ nhớ máy chủ.<br><b>Lỗi
      3 (nhồi quá tải IN):</b> Không cắt lô kích thước lớn hơn một nghìn khoá khiến câu lệnh cơ sở dữ liệu vượt giới hạn tham
      số.</div></td></tr></table>
    say: Hãy lưu ý ba lỗi kiến trúc phổ biến khi đưa GraphQL vào hệ thống thực tế. Lỗi thứ nhất là chia sẻ đối tượng bộ nhớ
      đệm theo lượt ở phạm vi toàn ứng dụng thay vì khởi tạo mới theo từng yêu cầu HTTP riêng lẻ. Dễ làm rò dữ liệu giữa các
      tài khoản. Lỗi thứ hai là quên chặn độ sâu cây truy vấn khiến tin tặc lồng bảy tám tầng để gây quá tải. Lỗi thứ ba là
      truyền danh sách khoá hơn một nghìn phần tử trong một câu lệnh duy nhất mà không cắt thành các lô vừa phải. Nhận diện sớm
      các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng tăng cao. Cần rà kỹ vòng đời yêu cầu trong khung
      ứng dụng để đối tượng bộ nạp lô được tạo mới đúng phạm vi từng lượt gọi HTTP. Đồng thời bảo đảm thứ tự kết quả trả về
      từ câu truy vấn lô khớp đúng trình tự mảng khoá đã gửi xuống.
