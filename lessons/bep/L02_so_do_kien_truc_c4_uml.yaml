scenes:
- id: hook
  kind: hook
  title: Sơ đồ kiến trúc C4, UML tuần tự và đường găng độ trễ
  checks:
  - 10 + max(40, 65) + 25 == 100
  - 40 + 65 + 35 == 140
  steps:
  - show: '<div class=''box key''><p>Từ <b>Sơ đồ C4 &amp; UML</b>: cổng <code>GW(10ms)</code> gọi đồng thời <code>Auth(40ms)</code>
      và <code>Risk(65ms)</code> rồi ghi <code>Ledger(25ms)</code> cho đường găng <code>10 + max(40,65) + 25 = <b>100 ms</b></code>.</p></div>'
    say: Rất nhiều bản thiết kế trên giấy nhìn thoáng qua trông gọn gàng. Nhưng vừa triển khai thật lại đứng hình vì hai dịch
      vụ gọi vòng lẫn nhau hoặc một nhánh song song ẩn làm vượt ngưỡng chờ nửa giây. Chuyển cấu trúc C4 và biểu đồ tuần tự
      UML thành dữ liệu đồ thị giúp kiểm tra ngay hai yếu tố đó bằng phép tính chính xác tuyệt đối.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Tổ chức mô hình <b>C4</b>, kiểm phụ thuộc không vòng và tính
      <b>đường găng độ trễ</b>.</p></div>
    say: Hôm nay ta học cách tổ chức mô hình C4, kiểm phụ thuộc không vòng và tính đường găng độ trễ tuần tự. Phát hiện sớm
      nút nghẽn đường găng và vòng gọi phụ thuộc ngay trên bản vẽ kiến trúc giúp tiết kiệm hàng tuần sửa lại mã nguồn. Chuẩn
      hoá hồ sơ kiến trúc thành đồ thị định lượng tạo tiếng nói chung giữa kỹ sư hệ thống và bộ phận vận hành.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Đồ thị có hướng không chu trình</td><td>Kiến
      trúc phụ thuộc dịch vụ lành mạnh không cho phép hai dịch vụ gọi chéo vòng nhau</td></tr><tr><td>Khái niệm luồng yêu
      cầu HTTP</td><td>Mỗi lượt gọi từ trình khách kích hoạt chuỗi gọi dịch vụ phía sau</td></tr><tr><td>Ngân sách độ trễ
      SLA</td><td>Đường gọi chậm nhất quy định thời gian phản hồi người dùng cuối</td></tr></table>
    say: Một bản vẽ kiến trúc chỉ có giá trị kỹ thuật thực sự khi giúp cả nhóm kiểm chứng được luồng phụ thuộc và ngân sách
      thời gian trước lúc viết mã. Thay vì vẽ hộp mũi tên tuỳ hứng khó hiểu, chuẩn C4 chia góc nhìn thành bốn tầng từ bối
      cảnh toàn cảnh tới thành phần bên trong dịch vụ. Kết hợp với biểu đồ tuần tự UML ghi rõ các bước gọi đồng bộ lẫn gọi
      song song theo thời gian thực. Kỹ sư nhanh chóng phát hiện điểm nghẽn cổ chai và phụ thuộc vòng chéo. Khi mọi bước trên
      sơ đồ đều quy được thành đồ thị có hướng tính toán đường găng, sơ đồ trở thành hợp đồng kiến trúc kiểm chứng tự động
      được. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Tính chất không chu trình của đồ
      thị phụ thuộc bảo đảm các dịch vụ luôn khởi động theo một trình tự xác định. Biểu đồ tuần tự ghi rõ độ trễ ước lượng
      ở từng chặng là đầu vào trực tiếp để thẩm định ngân sách phản hồi của hệ thống.
