      (Hệ thống) → Container (Ứng dụng/DB) → Component (Mô-đun lõi)</td></tr><tr><td><code>UML Sequence</code></td><td>Biểu
      diễn thứ tự thời gian gọi đồng bộ (chờ) và rẽ nhánh song song giữa các đối tượng</td></tr><tr><td><code>Critical Path</code></td><td>Tổng
      độ trễ dài nhất từ điểm vào tới khi kết thúc mọi nhánh phụ thuộc</td></tr></table>
    say: Bảng ký hiệu tóm gọn ba khái niệm chuẩn dùng để mô tả và đo lường bản thiết kế backend. Ba tầng đầu của mô hình C4
      giúp tách rạch ròi bức tranh cho lãnh đạo với chi tiết triển khai công nghệ và cấu trúc mô-đun của lập trình viên. Sơ
      đồ tuần tự UML nhấn mạnh trục thời gian theo chiều dọc để tính chính xác đường găng độ trễ tổng hợp. Những quy chuẩn
      trên sẽ xuyên suốt từ phần chạy thực nghiệm mẫu tới bài tập thực hành cuối bài. Phân tầng từ bức tranh tổng quan tới
      thành phần giúp cả quản lý dự án lẫn lập trình viên tập trung đúng mức độ thông tin cần thiết. Thuật toán quy hoạch
      động trên thứ tự sắp xếp tô pô xử lý dễ dàng mọi mạng lưới nhánh song song phức tạp.
    focus:
