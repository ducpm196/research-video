- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 10 + max(40, 65) + 25 == 100
  - 40 + 65 + 35 == 140
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật (C4 &amp; đường găng DAG)</b></p><div class="code"><div>nodes = {''GW'': 10,
      ''Auth'': 40, ''Risk'': 65, ''Ledger'': 25}</div><div>edges = [(''GW'', ''Auth''), (''GW'', ''Risk''),</div><div>         (''Auth'',
      ''Ledger''), (''Risk'', ''Ledger'')]</div><div>ind = {u: 0 for u in nodes}; adj = {u: [] for u in nodes}</div><div>for
      u, v in edges: adj[u].append(v); ind[v] += 1</div><div>q = [u for u in nodes if ind[u] == 0]; dp = dict(nodes)</div><div>while
      q:</div><div>    u = q.pop(0)</div><div>    for v in adj[u]:</div><div>        dp[v] = max(dp[v], dp[u] + nodes[v])</div><div>        ind[v]
      -= 1</div><div>        if ind[v] == 0: q.append(v)</div><div>print(f''critical_ms={max(dp.values())} ledger_ms={dp["Ledger"]}'')</div></div>'
    say: Đoạn mã tính đường găng độ trễ tổng thể qua đồ thị gọi tuần tự từ cổng vào qua hai nhánh song song tới sổ cái. Ta chuyển cấu trúc đó sang bốn nút và các cạnh phụ thuộc có độ trễ riêng từng dịch vụ. Nhánh xác thực mất bốn mươi mi-li-giây và nhánh rủi ro mất sáu mươi lăm mi-li-giây chạy đồng thời sau bước phân tích tại cổng. Ta lan truyền độ trễ tích lũy theo từng cạnh phụ thuộc bằng thuật toán duyệt từ đỉnh bậc vào bằng không để xác định tổng thời gian chờ của đường găng. Nhờ gọi đồng thời hai dịch vụ xác thực và đánh giá rủi ro sau cổng vào, nhánh chậm hơn quyết định thời điểm dịch vụ sổ cái bắt đầu chạy.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>critical_ms=100 ledger_ms=100</div></div>
    say: Kết quả chạy thật chứng nhận nhánh xác thực bốn mươi bị che khuất hoàn toàn bởi nhánh rủi ro sáu mươi lăm nên đường
      găng chốt ở tròn một trăm mi-li-giây. Chênh lệch tiết kiệm bốn mươi mi-li-giây đến trực tiếp từ việc tận dụng tính chất
      bất đồng bộ song song của hai nhánh phụ thuộc.
    clear: true
    focus:
    - 1
    - 2
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 10 + max(40, 65) + 25 == 100
  - 40 + 65 + 35 == 140
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai (Kahn phát hiện mọi chu trình)</b></p><div class="code"><div>nodes = [''GW'', ''A'',
      ''B'']</div><div>edges = [(''GW'', ''A''), (''A'', ''B''), (''B'', ''A'')]</div><div>ind = {u: 0 for u in nodes}; adj
      = {u: [] for u in nodes}</div><div>for u, v in edges: adj[u].append(v); ind[v] += 1</div><div>q = [u for u in nodes
      if ind[u] == 0]; seen = 0</div><div>while q:</div><div>    u = q.pop(0); seen += 1</div><div>    for v in adj[u]:</div><div>        ind[v]
      -= 1</div><div>        if ind[v] == 0: q.append(v)</div><div>cyc = int(seen != len(nodes))</div><div>print(f''acyclic={int(not
      cyc)} cycle_detected={cyc}'')</div></div>'
    say: Phép kiểm chứng thứ hai dùng thuật toán Kahn kiểm tra chuỗi gọi tuần tự UML ngay cả khi có nút nguồn đi vào vòng
      lặp. Cổng vào có bậc vào bằng không được duyệt trước, nhưng hai nút A và B nối vòng giữ bậc vào dương mãi mãi. Số đỉnh
      đã thăm chỉ đạt một nhỏ hơn tổng ba đỉnh nên thuật toán bắt trọn chu trình vòng ngay lập tức. Chu trình khép kín bị
      phát hiện tự động trước khi chia việc cho các nhóm phát triển.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>acyclic=0 cycle_detected=1</div></div>
    say: Kết quả đối chứng in ra phát hiện chu trình bằng một vì sau khi duyệt cổng GW, hai dịch vụ A và B gọi vòng lẫn nhau nên chỉ thăm được một trên ba đỉnh. Tính năng phát hiện chu trình tự động giúp chặn ngay thiết kế hỏng trước khi chia việc cho các nhóm lập
      trình.
    clear: true
    focus:
    - 1
    - 2
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn vận hành
  checks:
  - 10 + max(40, 65) + 25 == 100
  - 40 + 65 + 35 == 140
  steps:
  - show: '<table class=''t''><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Hồ sơ văn
      bản thuần</td><td>Khó nhận ra phụ thuộc vòng & đường găng</td><td>Bổ sung sơ đồ C4 Level 2 + cạnh tuần tự tường minh</td></tr><tr><td>Chuỗi
      gọi nối tiếp 6 tầng</td><td>Cộng dồn độ trễ + giảm độ sẵn sàng</td><td>Song song hoá hai lời gọi độc lập trên sơ đồ
      UML</td></tr><tr><td>Kiểm tra trước buổi rà soát</td><td>Tranh luận cảm tính mất nhiều giờ</td><td>Chạy bộ kiểm đồ thị
      tính đường găng độ trễ tự động</td></tr></table>

      <p class="note"><b>3 tầng C4 cho hệ thống thanh toán:</b> Context (Khách hàng → Hệ thống Thanh toán → Ngân hàng đối tác) → Container (Cổng API <code>GW</code>, Dịch vụ <code>Auth</code>, <code>Risk</code>, <code>Ledger</code>) → Component (Bộ kiểm thẻ <code>TokenCheck</code>, Động cơ luật <code>RuleEngine</code>).</p>

      '
    say: Bảng tổng kết tổ chức bản vẽ kiến trúc phân tầng C4 và kiểm soát độ trễ đường găng ở quy mô lớn. Tầng Bối cảnh vẽ người dùng với ngân hàng, tầng Vùng chứa tách bốn dịch vụ, còn tầng Thành phần chi tiết mô-đun. Tách hai nhánh độc lập chạy song song giúp tổng độ trễ rút về nhánh lớn hơn thay vì cộng dồn. Gắn bộ kiểm đồ thị vào hồ sơ kiến trúc biến bản vẽ C4 thành công cụ đo lường được trước khi viết mã. Nhờ kiểm chứng tự động ngay trong kho thiết kế, hệ thống nhiều chục dịch vụ vẫn tránh được vòng gọi chéo.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (nhầm tầng C4):</b>
      Nhồi tên lớp hàm chi tiết vào sơ đồ Context dành cho người ngoài chuyên môn gây rối thông tin.<br><b>Lỗi 2 (cộng nhầm
      nhánh song song):</b> Cộng thẳng thời gian hai lời gọi song song trên đường găng thay vì lấy giá trị lớn nhất.<br><b>Lỗi
      3 (bỏ qua vòng chéo):</b> Cho dịch vụ Thanh toán gọi trực tiếp về Đơn hàng trong lúc Đơn hàng cũng gọi đồng bộ Thanh
      toán.</div></td></tr></table>
    say: Tránh ba sai lầm rất hay gặp khi lập hồ sơ kiến trúc C4 và biểu đồ tuần tự. Thứ nhất là trộn lẫn mức độ chi tiết,
      đưa tận tên bảng hay thư viện mã nguồn lên bản đồ tổng quan hệ thống. Thứ hai là cộng sai thời gian của hai lời gọi
      chạy đồng thời khiến ước lượng độ trễ đường găng sai lệch gấp đôi. Thứ ba là chấp nhận hai dịch vụ gọi đồng bộ qua lại
      thành vòng tròn gây bế tắc khi một bên khởi động chậm. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính
      ổn định khi lưu lượng tăng cao. Luôn chú thích rõ ràng trên mũi tên sơ đồ tuần tự xem hai bước gọi nối tiếp nhau hay
      phát đồng thời song song. Nếu hai dịch vụ cần trao đổi hai chiều, hãy chuyển ít nhất một chiều sang giao tiếp bất đồng
      bộ qua sự kiện để cắt vòng phụ thuộc.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 10 + max(40, 65) + 25 == 100
  - 40 + 65 + 35 == 140
  steps:
  - show: <ol><li>Chuỗi cổng 15 ms rồi gọi song song hai dịch vụ 30 ms và 50 ms thì tổng đường găng là bao nhiêu?</li><li>Vì
      sao cần tách sơ đồ C4 theo 3 cấp Context, Container, Component?</li></ol>
    say: Mời bạn tự trả lời hai câu hỏi ôn tập cho bài kiến trúc. Câu một, một cổng mất mười lăm mi-li-giây gọi song song
      hai nhánh ba mươi và năm mươi mi-li-giây thì tổng đường găng là bao nhiêu? Câu hai, tại sao phải tách sơ đồ C4 theo
      nhiều cấp độ? Tạm dừng và tự trả lời. Hai câu hỏi này ôn lại phép tính đường găng với nhánh song song và mục đích phân
      tầng của tiêu chuẩn kiến trúc.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code>15 + max(30, 50) = <b>65 ms</b></code>, không
      cộng 30 với 50.</p></td></tr></table>
    say: 'Đáp án câu một: bằng sáu mươi lăm mi-li-giây vì hai nhánh song song lấy giá trị lớn nhất là năm mươi cộng với mười
      lăm. Tất cả nhánh con chạy đồng thời kết thúc khi nhánh chậm nhất hoàn thành công việc của nó.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Để mỗi đối tượng đọc xem đúng tầng chi tiết cần thiết
      mà không bị quá tải bởi chi tiết kỹ thuật tầng khác.</p></td></tr></table>
    say: 'Đáp án câu hai: nhằm phục vụ đúng góc nhìn của từng vai trò trong dự án mà không gây nhiễu bởi chi tiết tầng khác.
      Tách biệt góc nhìn giúp bản vẽ không trở nên quá rối rắm mà vẫn giữ đầy đủ thông tin sâu ở đúng tầng cần thiết.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/BEP/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành BEP:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Tính
      đường găng độ trễ tổng thể qua chuỗi gọi nối tiếp và rẽ nhánh song song</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>nodes=GW:10,Auth:40,Risk:65,Ledger:25;
      edges=GW-&gt;Auth,GW-&gt;Risk,Auth-&gt;Ledger,Risk-&gt;Ledger</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh BEP L02 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Hãy cài đặt công cụ kiểm chứng tự động cho sơ đồ kiến trúc C4 và tuần tự ngay trên máy của bạn. Chương trình đọc
      danh sách nút kèm thời lượng xử lý và các cạnh gọi phụ thuộc từ luồng chuẩn. Sau đó kiểm tra chu trình bằng sắp xếp
      tô pô và tính độ trễ đường găng. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng
      để đáp ứng đủ cả ca ẩn. Lưu ý các nút trong đồ thị có thể có nhiều điểm khởi đầu độc lập chứ không nhất thiết chỉ bắt
      đầu từ duy nhất nút cổng. Nếu đồ thị phát hiện chu trình, chương trình bắt buộc gắn cờ báo chu trình bằng một và đặt
      đường găng về âm một.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai BEP:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (đồ thị)</b></td><td>Nạp bảng chi phí từng nút, xây danh sách kề và mảng bậc vào <code>indegree</code></td></tr><tr><td><b>Bước
      2 (Kahn)</b></td><td>Duyệt hàng đợi từ các nút bậc vào bằng 0, cập nhật <code>dp[v] = max(dp[v], dp[u] + costs[v])</code></td></tr><tr><td><b>Bước
      3 (chu trình)</b></td><td>Nếu số nút đã duyệt khác tổng số nút thì đặt <code>has_cycle=1</code> và <code>critical_ms=-1</code></td></tr></table>
    say: Gợi ý cài đặt chỉ dẫn bạn ba bước áp dụng sắp xếp tô pô làm bộ kiểm thiết kế tự động. Trước hết hãy đảm bảo mọi nút
      nguồn có bậc vào bằng không đều nằm trong hàng đợi khởi tạo chứ không riêng một cổng đầu vào duy nhất. Kế tiếp chỉ cập
      nhật kết quả đường găng khi số nút duyệt hết toàn bộ tập đỉnh khai báo, còn nếu phát hiện chu trình thì trả về âm một.
      Khởi tạo khoảng cách đường găng bằng chính thời gian tự xử lý của các nút gốc trước khi lan truyền sang các nút kế tiếp.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>node_count=4</div><div>has_cycle=0</div><div>critical_ms=100</div></div>
    say: Đầu ra mẫu cho mạng bốn dịch vụ hiển thị đúng số nút bằng bốn, không có chu trình và tổng đường găng một trăm mi-li-giây.
      Hai ca ẩn sẽ kiểm nghiệm đồng thời đồ thị có chu trình lẫn cấu trúc nhiều nhánh song song lệch chiều dài. Khi toàn bộ
      các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn đều thông qua, bạn có thể an tâm lưu kết quả và chuyển
      tiếp. Kiểm chứng cả đồ thị thẳng nhiều tầng và đồ thị chứa vòng lặp ẩn nhằm bảo đảm vượt qua mọi ca kiểm ẩn.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">C4 phân tầng rõ vai trò</span><span class="a">→</span><span class="n">Quét tô
      pô chặn chu trình</span><span class="a">→</span><span class="n">Quy hoạch động đường găng SLA</span></div>
    say: Chuỗi quy tắc chốt lại cách biến sơ đồ kiến trúc C4. Biểu đồ tuần tự UML từ tranh vẽ tĩnh thành mô hình đồ thị kiểm
      định chu trình và đường găng chính xác. Mọi quy trình đều được chứng minh bằng số liệu định lượng chạy thật thay cho
      mô tả lý thuyết suông. Tư duy mô hình hoá kiến trúc bằng đồ thị giúp bạn thiết kế hệ thống phân tán rõ ràng, không bế
      tắc và đạt mục tiêu độ trễ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành BEP:L02:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Chúc mừng bạn đã hoàn tất bài kiểm chứng thiết kế kiến trúc và sẵn sàng bước sang chủ đề hạ tầng đám mây và lập trình
      an toàn OWASP.
    clear: true
    forward_ref: true
