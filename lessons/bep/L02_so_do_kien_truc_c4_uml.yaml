- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 10 + max(40, 65) + 25 == 100
  - 40 + 65 + 35 == 140
  steps:
  - show: <div class='box key'><p><b>1. Đường găng tuần tự (Critical Path):</b> <code>DP[v] = cost[v] + max(DP[u] for u in
      preds(v))</code>.</p><p><b>2. Bất biến kiến trúc sạch:</b> Nếu <code>visited_order &lt; total_nodes</code> thì tồn tại
      <b>chu trình phụ thuộc</b> (cấm triển khai).</p></div>
    say: Hai biểu thức cho thấy sơ đồ tuần tự cũng tuân theo đúng quy luật quy hoạch động trên đồ thị có hướng không chu trình.
      Thời điểm hoàn thành tại mỗi nút dịch vụ bằng chi phí tự xử lý cộng thêm giá trị lớn nhất trong tất cả các nút tiền
      nhiệm gửi dữ liệu tới nó. Nếu thuật toán sắp xếp tô pô không duyệt hết toàn bộ số nút khai báo, bản thiết kế chắc chắn
      chứa một vòng gọi phụ thuộc chéo cần phá bỏ ngay. Với đồ thị có chu trình gọi vòng, số lượng đỉnh duyệt được luôn nhỏ
      hơn tổng số đỉnh do hàng đợi bậc vào bằng không bị cạn sớm. Nhờ kiểm điều kiện này ngay sau vòng lặp sắp xếp tô pô,
      ta bắt gọn mọi cấu trúc gọi chéo hai chiều chỉ trong thời gian tuyến tính.
    focus:
