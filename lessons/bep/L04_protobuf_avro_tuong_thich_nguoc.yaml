    say: Hôm nay ta học nguyên tắc mã hoá Protobuf và Avro cùng bộ kiểm định tương thích lược đồ. Chuyển đổi sang định dạng nhị phân có lược đồ vừa tiết kiệm phần lớn băng thông mạng vừa ép buộc kỷ luật tiến hoá dữ liệu chặt chẽ. Nhờ cổng kiểm định tự động, hàng chục nhóm dịch vụ có thể nâng cấp cấu trúc bản tin độc lập mà không lo gãy kết nối.
