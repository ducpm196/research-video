  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>v1 = {1: (''int'', True), 2: (''str'', True)}</div><div>v2_ok = {1: (''int'', True), 2: (''str'', True), 3: (''str'', False)}</div><div>v2_bad = {1: (''str'', True), 2: (''str'', True)}</div><div>def is_compat(old, new):</div><div>    same_types = all(new[k][0] == t for k, (t, req) in old.items() if k in new)</div><div>    no_new_req = all((k in old) or (not req) for k, (_, req) in new.items())</div><div>    return same_types and no_new_req and all((k in new) or not req for k, (_, req) in old.items())</div><div> </div><div>print(f''v2_ok={int(is_compat(v1, v2_ok))} v2_bad={int(is_compat(v1, v2_bad))}'')</div></div>'
    say: Phép kiểm chứng thứ hai cài hàm kiểm định tương thích ngược và tương thích xuôi trong Schema Registry giữa hai phiên bản cấu trúc. Trường hợp thứ nhất bổ sung thẻ số ba kiểu chuỗi ở chế độ tuỳ chọn nên hoàn toàn hợp lệ cả hai chiều. Trường hợp thứ hai tự ý đổi kiểu dữ liệu của thẻ số một từ số nguyên sang chuỗi nên bị gắn cờ phá vỡ tức thì. Bộ kiểm tự động rà từng cặp số thẻ giữa hai phiên bản để phát hiện ngay trường hợp đổi kiểu từ số nguyên sang chuỗi văn bản.
