    say: Thực nghiệm phân biệt mã hoá nhị phân theo số thẻ trường của Protobuf và Avro so với JSON văn bản truyền thống trên cùng một bản ghi thanh toán. Trong định dạng văn bản, mọi dấu ngoặc kép và tên khoá như currency chiếm gần hết dung lượng gói tin truyền đi. Ở mã hoá nhị phân dùng số thẻ nguyên, mỗi trường chỉ tốn hai byte thẻ và độ dài kèm bốn byte, bốn byte và ba byte giá trị nên tổng còn mười bảy byte. Sự chênh lệch kích thước gói tin từ bốn mươi chín byte xuống còn mười bảy byte trên một bản ghi nhân lên khổng lồ ở quy mô triệu tin.
