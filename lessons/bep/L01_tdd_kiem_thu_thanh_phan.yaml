  title: Quy chuẩn và cấu trúc dữ liệu
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>ý nghĩa cài đặt</th></tr><tr><td><code>Red → Green → Refactor</code></td><td>Viết ca kiểm lỗi trước, sửa vừa đủ cho xanh, rồi dọn mã giữ nguyên kiểm thử xanh</td></tr><tr><td><code>Contract Schema Check</code></td><td>Kiểm chứng đủ khoá bắt buộc, đúng kiểu và bất biến trạng thái ở ranh giới dịch vụ</td></tr><tr><td><code>status == 422</code></td><td>Mã từ chối ngữ nghĩa nghiệp vụ chuẩn khi định dạng hợp lệ nhưng số dư không đủ</td></tr></table>
    say: Bảng ký hiệu tóm tắt ba bước vòng lặp TDD và hai chốt kiểm hợp đồng thành phần phổ biến. Pha Đỏ xác nhận bộ kiểm thực sự bắt được ca lỗi thay vì luôn đi qua do viết sai điều kiện khẳng định. Pha Xanh tập trung viết đoạn logic đơn giản nhất vượt qua ca kiểm đó, còn pha Tái cấu trúc loại bỏ trùng lặp dưới tấm lưới bảo vệ an toàn. Khi kiểm thử ranh giới thành phần, ta kiểm chặt từng khoá bắt buộc và mã trạng thái từ chối nghiệp vụ. Những quy chuẩn trên sẽ xuyên suốt từ phần chạy thực nghiệm mẫu tới bài tập thực hành cuối bài. Kỷ luật ba bước nhỏ lặp đi lặp lại giữ kích thước mỗi lần thay đổi gọn gàng và dễ kiểm soát rủi ro. Bộ kiểm hợp đồng biên giới bảo đảm giao diện giao tiếp giữa các dịch vụ luôn tuân thủ chặt thoả thuận ban đầu.
