  steps:
  - show: <ol><li>Trong quy trình TDD, khi nào bạn mới bắt đầu viết đoạn mã nghiệp vụ sản xuất?</li><li>Với lệnh rút vượt quá số dư, mã trạng thái HTTP nào biểu diễn đúng từ chối nghiệp vụ?</li></ol>
    say: Hãy tự trả lời hai câu hỏi kiểm hiểu về TDD và kiểm thử hợp đồng. Câu một, khi nào bạn mới viết đoạn mã nghiệp vụ theo kỷ luật TDD? Câu hai, mã HTTP nào phù hợp khi dữ liệu đúng định dạng nhưng vi phạm quy tắc số dư? Tạm dừng và tự trả lời. Hai câu hỏi giúp củng cố thứ tự hành động trong quy trình phát triển hướng kiểm thử và cách chọn mã HTTP chuẩn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Chỉ viết sau khi đã viết xong ít nhất một ca kiểm tự động phản ánh đúng yêu cầu và nhìn thấy nó báo <b>Đỏ (thất bại)</b>.</p></td></tr></table>
    say: 'Đáp án câu một: chỉ viết mã sản xuất sau khi đã viết ca kiểm và trực tiếp xác nhận ca kiểm đó thất bại ở pha Đỏ. Nhìn thấy đèn đỏ là bằng chứng xác nhận chính bài kiểm thử mới viết đủ khả năng phát hiện lỗi thực sự.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Mã <b>422</b> (hoặc 400 tuỳ quy ước hợp đồng), tuyệt đối không trả 200 kèm lỗi ngầm bên trong.</p></td></tr></table>
    say: 'Đáp án câu hai: dùng mã bốn hai hai cho lỗi từ chối quy tắc nghiệp vụ, tuyệt đối tránh trả về mã hai trăm đánh lừa. Không bao giờ trả mã thành công hai trăm kèm thông báo lỗi bên trong thân JSON vì gây nhầm lẫn cho cổng giám sát và ứng dụng khách.'
