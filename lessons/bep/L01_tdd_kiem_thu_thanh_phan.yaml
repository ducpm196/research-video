- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 100 - 40 - 50 == 10
  - 40 > 0 and 100 >= 40
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>cases = [(100, 50, 200, 50), (100, 120, 422, 100), (100, 0, 422, 100)]</div><div>def tx(b, a): return {''code'': 200 if a&gt;0 and b&gt;=a else 422, ''new_bal'': b-a if a&gt;0 and b&gt;=a else b}</div><div>ok = int(all(tx(b,a)=={''code'':ec,''new_bal'':eb} for b,a,ec,eb in cases))</div><div>print(f''contract_verified={ok} cases={len(cases)}'')</div></div>'
    say: Phép kiểm chứng độc lập cài bộ kiểm thử thành phần xác minh hợp đồng đầu ra và bất biến nghiệp vụ qua ba kịch bản biên. Hàm kiểm tra đối chiếu đồng thời tập khoá JSON bắt buộc, mã phản hồi HTTP và số dư mới sau pha tái cấu trúc mã ngắn gọn. Chỉ cần sai một khoá trả về hoặc lệch một bước chuyển trạng thái, ca kiểm lập tức chặn bản phát hành. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Ba trường hợp thử nghiệm bao phủ trọn vẹn cả nhánh thành công, nhánh vượt số dư và nhánh số tiền bằng không ở ranh giới.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
