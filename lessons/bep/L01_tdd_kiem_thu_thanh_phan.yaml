scenes:
- id: hook
  kind: hook
  title: TDD Red–Green–Refactor & kiểm thử thành phần hợp đồng
  checks:
  - 100 - 40 - 50 == 10
  - 40 > 0 and 100 >= 40
  steps:
  - show: <div class='box key'><p>Trong vòng <b>TDD 3 bước</b>, ca kiểm lỗi <code>amount &lt;= 0</code> phải <b>Đỏ</b> ở phiên bản rỗng, chuyển <b>Xanh</b> ở phiên bản cài đặt và giữ <b>Xanh 100%</b> qua pha tái cấu trúc hợp đồng.</p></div>
    say: Nhiều nhóm chờ triển khai lên môi trường thử nghiệm mới phát hiện sai quy tắc tính phí hay trả nhầm mã hai trăm cho giao dịch âm. Ngược lại, kỹ sư backend chuyên nghiệp khoá hợp đồng ngay từ giây đầu bằng kiểm thử. Mỗi thay đổi nhỏ sau này đều được chạy qua hàng chục ca kiểm hợp đồng thành phần chỉ trong chưa đầy một giây.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Cài trọn chu trình <b>TDD Đỏ–Xanh–Tái cấu trúc</b> và bộ kiểm thử hợp đồng API.</p></div>
    say: Hôm nay ta cài trọn vẹn chu trình TDD Đỏ Xanh Tái cấu trúc và bộ kiểm thử thành phần xác minh hợp đồng API. Áp dụng vòng lặp kiểm thử trước giúp tiết kiệm hàng giờ gỡ lỗi dây chuyền khi hệ thống mở rộng tới hàng trăm quy tắc. Hợp đồng thành phần rõ ràng biến bộ kiểm tự động thành hàng rào bảo vệ đáng tin cậy cho mọi đợt nâng cấp mã.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Kiểm thử đơn vị (pytest / unittest)</td><td>Kiểm tra một hàm thuần trong bộ nhớ chạy trong vài mi-li-giây</td></tr><tr><td>Khái niệm hợp đồng API</td><td>Quy định chặt kiểu trường, mã trạng thái và bất biến nghiệp vụ</td></tr><tr><td>Mock và giả lập ranh giới</td><td>Thay cổng ngân hàng bên ngoài bằng đối tượng giả tất định</td></tr></table>
    say: Nhiều lập trình viên quen viết xong hàng trăm dòng logic rồi mới quay lại bổ sung kiểm thử cho đủ chỉ tiêu phần trăm che phủ. Cách làm ngược đó dẫn tới bẫy tâm lý nguy hiểm là viết ca kiểm chỉ để khẳng định hành vi hiện tại kể cả khi hành vi đó đang sai yêu cầu gốc. Kỷ luật phát triển hướng kiểm thử TDD đảo ngược quy trình bằng cách viết ca kiểm thất bại trước khi chạm vào dòng mã sản xuất đầu tiên. Kết hợp cùng kiểm thử thành phần kiểm chứng hợp đồng biên giới. Hệ thống phát hiện lệch quy tắc nghiệp vụ ngay trên máy cá nhân trước lúc đẩy lên nhánh chung. Thói quen viết kiểm thử trước còn ép hàm nghiệp vụ giữ chữ ký gọn sạch và tách biệt rạch ròi khỏi phụ thuộc hạ tầng. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Mỗi khi sửa nhỏ một quy tắc phí hay hạn mức, chạy toàn bộ bộ kiểm đơn vị cho phép phát hiện hồi quy chỉ trong tích tắc. Thay vì phụ thuộc cơ sở dữ liệu thật trong mọi bài kiểm, cô lập lớp nghiệp vụ giúp tăng tốc đáng kể quy trình phát triển.
