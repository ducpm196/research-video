- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/BEP/L01
  steps:
  - show: <table class='t'><tr><th>Thực hành BEP:L01</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Mô phỏng vòng kiểm tra hợp đồng chuyển tiền (amt &gt; 0, bal &gt;= amt) và đếm số ca lỗi bắt được ở pha Đỏ</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>balance=100; ops=40,0,80,-5,50</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh BEP L01 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự tay cài đặt bài thực hành về quy trình TDD và kiểm thử hợp đồng giao dịch từ luồng chuẩn. Bạn đọc số dư khởi đầu cùng dãy giao dịch nối tiếp. Xử lý từng lệnh theo điều kiện biên chặt chẽ để không bao giờ trừ nhầm xuống âm và đếm đúng số ca lỗi bắt được ở pha Đỏ. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn. Chú ý đếm số ca kiểm mà hàm khung ngây thơ bỏ lọt so với bộ quy tắc bảo vệ số dư và số tiền dương. Đọc kỹ chuỗi lệnh đầu vào gồm số dư khởi đầu và danh sách giao dịch để xử lý chính xác từng bước.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai BEP:L01</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (đọc trạng thái)</b></td><td>Tách <code>balance</code> khởi tạo và danh sách số nguyên <code>ops</code> theo dấu phẩy</td></tr><tr><td><b>Bước 2 (kiểm bất biến)</b></td><td>Chỉ trừ <code>bal -= amt</code> khi thoả đồng thời <code>amt &gt; 0</code> và <code>bal &gt;= amt</code></td></tr><tr><td><b>Bước 3 (đếm pha Đỏ)</b></td><td>Mỗi lệnh bị từ chối mã 422 tương ứng một điểm lệch so với hàm giả luôn trả 200</td></tr></table>
    say: Gợi ý cài đặt bài thực hành nhắc bạn ba chi tiết nhỏ nhưng rất quan trọng ở ranh giới nghiệp vụ. Thứ nhất hãy kiểm điều kiện số tiền thực dương và đủ số dư trước khi cập nhật biến trạng thái chung. Thứ hai lưu ý khi giao dịch trước trừ hết hoặc bớt một phần số dư, giao dịch kế tiếp phải đánh giá trên phần số dư còn lại. Thứ ba mọi giao dịch thất bại đều phản ánh số trường hợp mà hàm stub bỏ lọt ở pha Đỏ. Mọi giao dịch hợp lệ cần trừ thẳng vào biến số dư hiện hành ngay trước khi kiểm tra giao dịch kế tiếp trong chuỗi.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
