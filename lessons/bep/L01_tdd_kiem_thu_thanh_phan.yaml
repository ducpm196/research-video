- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 100 - 40 - 50 == 10
  - 40 > 0 and 100 >= 40
  steps:
  - show: <div class='box key'><p><b>1. Điều kiện bất biến TDD:</b> Mọi trường hợp biên (<code>amount &lt;= 0</code>, <code>balance &lt; amount</code>) phải có ít nhất 1 ca kiểm phủ.</p><p><b>2. Kiểm hợp đồng thành phần:</b> <code>keys(resp) == expected_schema</code> và <code>code in {200, 422}</code>.</p></div>
    say: Hai quy tắc định lượng giúp đánh giá chất lượng một bộ kiểm thử thành phần theo chuẩn TDD. Quy tắc thứ nhất đòi hỏi mỗi nhánh từ chối biên như số tiền không dương hoặc thiếu số dư phải được khoá bởi ít nhất một ca kiểm đỏ ban đầu. Quy tắc thứ hai bảo đảm đầu ra thành phần không chỉ đúng một con số đơn lẻ mà phải khớp toàn bộ tập khoá hợp đồng và mã trạng thái quy định. Kiểm đồng thời toàn bộ tập khoá bắt buộc và trạng thái trả về ngăn tình trạng hàm vượt qua kiểm thử nhưng thiếu dữ liệu cho bên gọi. Mỗi nhánh biên được khoá trước bằng ca kiểm thất bại bảo đảm không có điều kiện ngoại lệ nào bị bỏ quên.
