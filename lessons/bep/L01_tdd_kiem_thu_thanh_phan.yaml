- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (không thấy pha Đỏ):</b> Không chạy ca kiểm trước khi viết logic dễ tạo ca kiểm luôn đúng giả tạo không bắt được lỗi.<br><b>Lỗi 2 (giả lập quá tay):</b> Dùng đối tượng giả đè lên logic nghiệp vụ chính làm bài kiểm thử tách rời hành vi thật.<br><b>Lỗi 3 (bỏ quên hợp đồng khoá):</b> Chỉ kiểm trường giá trị tiền mà bỏ qua tập khoá bắt buộc hoặc kiểu dữ liệu trả về.</div></td></tr></table>
    say: Hãy rà kỹ ba sai lầm thường gặp khi áp dụng quy trình TDD và kiểm thử thành phần. Thứ nhất là bỏ qua pha xác nhận đèn đỏ trước khi sửa mã, dễ dẫn tới lỗi viết nhầm câu khẳng định luôn trả đúng. Thứ hai là lạm dụng đối tượng giả lên chính lớp nghiệp vụ nội bộ thay vì chỉ dùng ở biên giới hệ thống ngoài. Thứ ba là kiểm giá trị rời rạc mà quên kiểm toàn bộ cấu trúc hợp đồng khoá đầu ra. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng tăng cao. Tránh thói quen viết bộ kiểm chỉ chạy đường thuận mà quên hết các tình huống âm, rỗng hay thiếu quyền. Một bài kiểm thử chỉ thực sự có giá trị khi nó từng thất bại lúc mã nguồn thiếu điều kiện bảo vệ tương ứng.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
