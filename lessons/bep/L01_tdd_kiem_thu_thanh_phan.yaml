- id: intuition
  kind: intuition
  title: Luồng xử lý tổng thể
  steps:
  - show: <div><svg width="960" height="170" viewBox="0 0 960 170"><rect x="40" y="35" width="250" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="75" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">1. Pha Đỏ (Red)</text><text x="165.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Viết ca kiểm failing rõ ràng</text><line x1="290" y1="80" x2="350" y2="80" stroke="#475569" stroke-width="2"/><polygon points="350,80 342.0,85.0 342.0,75.0" fill="#475569"/><text x="320" y="72" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">bước 1</text><rect x="350" y="35" width="250" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="475.0" y="75" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">2. Pha Xanh (Green)</text><text x="475.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Cài logic vượt qua bất biến</text><line x1="600" y1="80" x2="660" y2="80" stroke="#475569" stroke-width="2"/><polygon points="660,80 652.0,85.0 652.0,75.0" fill="#475569"/><text x="630" y="72" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">bước 2</text><rect x="660" y="35" width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">3. Tái cấu trúc (Refactor)</text><text x="790.0" y="102" font-size="15" text-anchor="middle" fill="#475569">Dọn mã giữ 100% ca xanh</text></svg></div>
    say: Chu trình ba nhịp liên hoàn giữ mã nguồn sạch sẽ suốt vòng đời dự án kéo dài nhiều năm. Nhịp đầu tạo một ca kiểm mô tả đúng yêu cầu nghiệp vụ đang còn thiếu nên phải báo đỏ tức thì. Nhịp hai viết đoạn mã tối giản đáp ứng đúng hợp đồng đó để đèn chuyển xanh. Nhịp ba tối ưu cấu trúc dữ liệu, đặt tên biến rõ nghĩa mà không làm rớt bất kỳ ca kiểm cũ nào.
