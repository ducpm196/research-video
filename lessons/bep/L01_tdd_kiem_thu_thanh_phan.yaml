- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn vận hành
  checks:
  - 100 - 40 - 50 == 10
  - 40 > 0 and 100 >= 40
  steps:
  - show: '<table class=''t''><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Kiểm thử đơn vị (< 1 ms)</td><td>Chạy 500 ca mỗi lần lưu tệp</td><td>Khoá chặt công thức và biên thuật toán thuần</td></tr><tr><td>Kiểm thử thành phần (50 ms)</td><td>Cô lập phụ thuộc ngoài bằng giả lập chuẩn</td><td>Xác minh hợp đồng JSON, mã 422 và quy tắc trạng thái</td></tr><tr><td>Kiểm thử tích hợp thật (5 s)</td><td>Dựng cơ sở dữ liệu thật trong container</td><td>Kiểm lại truy vấn SQL và ràng buộc duy nhất cuối cùng</td></tr></table><div class="code"><div>class FakeGateway:</div><div>    def charge(self, amt): return amt &gt; 0</div><div>assert FakeGateway().charge(40)  <span class="cm"># cô lập phụ thuộc ngoài</span></div></div>'
    say: Bảng kim tự tháp giải thích cách cô lập bộ phụ thuộc ngoài khi kiểm thử tích hợp dịch vụ backend nhằm giữ tốc độ phản hồi nhanh. Ta dùng hàng trăm ca đơn vị và kiểm thử thành phần chạy giả lập ranh giới để phản hồi dưới một giây ngay trong phiên chỉnh sửa. Sau đó tầng kiểm thử tích hợp thật chạy trên cơ sở dữ liệu cô lập đảm nhiệm khâu kiểm tra ràng buộc và truy vấn thực tế cuối cùng. Trên các dự án lớn có hàng chục kỹ sư cùng cộng tác, sự phân tách rõ giữa kiểm thử nhanh và kiểm thử tích hợp là tiêu chuẩn bắt buộc. Kiểm thử đơn vị và thành phần đóng vai trò lưới lọc hàng đầu trong đường ống tích hợp liên tục.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
