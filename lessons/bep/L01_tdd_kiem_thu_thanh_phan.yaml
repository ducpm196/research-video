  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>final_balance=10</div><div>rejected_count=3</div><div>red_caught=3</div></div>
    say: Màn hình hiện ba dòng kết quả chuẩn cho số dư một trăm với năm giao dịch mẫu gồm hai giao dịch hợp lệ bốn mươi và năm mươi. Cùng ba lệnh không hợp lệ. Các ca ẩn sẽ thử nhiều dãy giao dịch rút cạn tuần tự. Khi toàn bộ các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn đều thông qua, bạn có thể an tâm lưu kết quả và chuyển tiếp. Cả ba chỉ số số dư cuối, số lượng từ chối và số ca đỏ bắt được đều phải trùng khớp tuyệt đối trên mọi bộ ca ẩn.
