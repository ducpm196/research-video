- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 100 - 40 - 50 == 10
  - 40 > 0 and 100 >= 40
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>def stub_transfer(bal, amt):</div><div>    return {''code'': 200, ''new_bal'': bal}</div><div> </div><div>def real_transfer(bal, amt):</div><div>    if amt &lt;= 0 or bal &lt; amt:</div><div>        return {''code'': 422, ''new_bal'': bal}</div><div>    return {''code'': 200, ''new_bal'': bal - amt}</div><div> </div><div>red_ok = stub_transfer(100, 150)[''code''] == 422</div><div>green_ok = real_transfer(100, 150)[''code''] == 422 and real_transfer(100, 40)[''new_bal''] == 60</div><div>print(f''red_passed={int(red_ok)} green_passed={int(green_ok)}'')</div></div>

      <p class="note"><b>Pha Refactor (tái cấu trúc):</b> rút gọn hàm kiểm tra thành một biểu thức rõ ràng sau khi ca Đỏ đã chuyển Xanh.</p>

      '
    say: Đoạn mã áp dụng trực tiếp vòng lặp Đỏ Xanh Tái cấu trúc trong phát triển hướng kiểm thử TDD cho nghiệp vụ chuyển khoản. Ở pha Đỏ, hàm khung ban đầu trả bừa mã hai trăm cho lệnh rút quá số dư nên ca kiểm lập tức phát hiện lỗ hổng. Sang pha Xanh, hàm hoàn chỉnh kiểm đủ điều kiện số tiền dương và số dư khả dụng trước khi trừ tiền. Sự tương phản giữa hàm khung sơ sài và hàm hoàn chỉnh minh hoạ giá trị thiết thực của bước kiểm tra đèn đỏ ban đầu.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>red_passed=0 green_passed=1</div></div>
    say: Kết quả chạy thật xác nhận hàm khung báo không ở pha Đỏ đúng như kỳ vọng và chuyển sang một khi cài đủ điều kiện bảo vệ ở pha Xanh. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Sau khi mọi ca biên đã xanh sạch, nhóm lập trình có thể tự tin tối ưu cách viết bên trong mà vẫn bảo toàn hành vi ngoài.
    focus:
