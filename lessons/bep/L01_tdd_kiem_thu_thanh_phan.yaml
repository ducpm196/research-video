  - show: <table class='t'><tr><th>nguyên tắc TDD</th><th>lợi ích khi mở rộng</th></tr><tr><td>Đỏ → Xanh trước khi sửa đẹp</td><td>Chặn lọt lỗi nghiệp vụ khi đổi cấu trúc mã</td></tr><tr><td>Khoá ngưỡng xanh 100%</td><td>Mỗi lần tái cấu trúc chạy kiểm hợp đồng trong tích tắc</td></tr></table>
    say: Vòng lặp Đỏ, Xanh và Tái cấu trúc tạo nhịp phát triển đều đặn, vừa bảo đảm tính đúng đắn vừa duy trì chất lượng cấu trúc mã. Không bao giờ chuyển sang tối ưu hay tái cấu trúc khi bộ kiểm vẫn đang báo đỏ dù chỉ một ca nhỏ.
