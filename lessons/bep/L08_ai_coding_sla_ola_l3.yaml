    say: Đoạn mã minh hoạ bước rà soát mã do công cụ AI coding Cursor và Claude Code sinh ra bằng kiểm chứng bất biến biên tại ranh giới hàm. Hàm nháp ban đầu tính trung bình bằng phép chia thẳng nên lập tức đổ vỡ nếu danh sách đầu vào rỗng hoặc số lượng bằng không. Sau khi bổ sung chốt kiểm biên trả về không khi mẫu số không dương, hàm vượt qua đồng thời cả phép thử biên lẫn phép thử thông thường. Một kiểm tra nhỏ chống mẫu số bằng không đủ ngăn chặn ngoại lệ làm sập tiến trình xử lý hàng loạt khi gặp tài khoản chưa có giao dịch.
