    say: Hãy lưu tâm ba lỗi thường gặp khi dùng trợ lý AI và vận hành cam kết dịch vụ ngân hàng. Thứ nhất là gộp mã AI coding thiếu đọc lại và không viết bổ sung kiểm thử biên cho giá trị rỗng hoặc không. Thứ hai là chuyển vé sự cố lên đội kỹ sư mức ba L3 mà thiếu mã vết và khoảng thời gian chính xác. Thứ ba là nhầm lẫn giữa cam kết với khách hàng SLA và cam kết thời hạn xử lý giữa các phòng ban nội bộ OLA. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng tăng cao. Không bao giờ tắt bớt kiểm thử tự động chỉ để kịp tiến độ đưa đoạn mã AI mới sinh lên môi trường chạy chính. Luôn ghi lại đầy đủ thông tin giả định của đoạn mã AI ngay trong nhận xét rà soát để đồng đội dễ đối chiếu.
