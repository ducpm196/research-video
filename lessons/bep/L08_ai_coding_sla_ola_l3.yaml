    say: Hai công thức đơn giản này cho phép đội ngũ kiểm soát định lượng trạng thái sức khoẻ dịch vụ mỗi tuần. Với một tháng chuẩn ba mươi ngày gồm bốn mươi ba nghìn hai trăm phút. Chỉ một phần mười phần trăm dung sai tương ứng đúng bốn mươi ba phẩy hai phút ngưng trệ. Nếu tổng số phút sự cố thực tế vượt quá một trăm phần trăm ngân sách lỗi, toàn đội phải tạm dừng tính năng mới để tập trung gia cố độ tin cậy. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Nhìn vào tỉ lệ đốt ngân sách lỗi hằng tuần giúp trưởng nhóm quyết định tạm dừng phát hành tính năng hay tiếp tục mở rộng sản phẩm. Con số bốn mươi ba phẩy hai phút mỗi tháng cho mức chín chín phẩy chín nhấn mạnh tầm quan trọng của tự động hoá kiểm tra trước phát hành.
