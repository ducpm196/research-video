  - show: <table class='t'><tr><th>Gợi ý triển khai BEP:L08</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (SLA)</b></td><td>Tính <code>budget = (1.0 - sla_pct / 100.0) * 43200.0</code> với độ chính xác 2 chữ số thập phân</td></tr><tr><td><b>Bước 2 (OLA → L3)</b></td><td>Chỉ ra <code>ESCALATE_L3</code> khi quá hạn OLA và đủ vết <code>has_trace == 1</code>, thiếu vết trả <code>NEED_TRACE</code></td></tr><tr><td><b>Bước 3 (ca biên)</b></td><td>Đếm toàn bộ phần tử <code>&lt;= 0</code> trong mảng <code>edge_vals</code> cần được bộ chắn xử lý</td></tr></table>
    say: Gợi ý triển khai làm rõ hai điều kiện chuyển cấp và định dạng số liệu. Chú ý làm tròn ngân sách lỗi tới hai chữ số thập phân để hiển thị chuẩn cho cả mức bốn con chín là bốn phẩy ba mươi hai phút. Ngoài ra khi chưa vượt hạn OLA thì dù có hay không có mã vết vẫn giữ trạng thái xử lý ở tuyến hai. Lưu ý nếu đủ cả vượt hạn thời gian lẫn có mã vết chuẩn thì mới kích hoạt hành động chuyển cấp L3 ngay lập tức.
