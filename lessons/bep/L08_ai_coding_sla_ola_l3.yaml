    say: Hãy bắt tay cài đặt bộ kiểm tra cam kết SLA, tuyến chuyển cấp L3 theo chuẩn OLA và bộ đếm ca biên từ luồng chuẩn. Lưu ý tách rạch ròi ba trạng thái định tuyến theo thời gian chờ OLA và trạng thái có đủ mã vết hay không trước khi kiểm thử trên các ca ẩn. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn. Chú ý kiểm thử đồng thời điều kiện vượt hạn OLA và trạng thái đính kèm mã vết hợp lệ khi xác định quyết định leo thang L3. Kiểm kỹ phép tính tỉ lệ ngân sách để xác định chính xác cờ vi phạm cam kết dịch vụ cuối tháng.
