  title: Code review OWASP, Agile DoD và Postmortem RCA
  checks:
  - sum(1 for f in ['SQLI_CONCAT', 'CLEAN', 'NO_IDEM'] if f != 'CLEAN') == 2
  - len([a for a in ['add_lint_rule_E99', 'remind_dev'] if a.startswith('add_')]) == 1
  steps:
  - show: <div class='box key'><p>Rà soát một nhánh thanh toán phát hiện đủ <b>3 lỗi chặn</b> (nối SQL, dùng <code>==</code> so HMAC, thiếu <b>lũy đẳng</b>); quy trình <b>Postmortem RCA</b> gắn luôn luật chặn vào CI để không ai lặp lại.</p></div>
    say: Một kỹ sư giỏi không chỉ tự viết mã sạch mà còn nâng mặt bằng toàn đội qua mỗi lượt rà soát mã nghiêm túc và mỗi báo cáo hậu kiểm công tâm. Nếu buổi hậu kiểm chỉ dừng lại ở kết luận nhân sự sơ suất xoá nhầm dữ liệu, chỉ vài tháng sau người khác lại mắc đúng cái bẫy giao diện y hệt.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Thực hành rà soát mã <b>OWASP</b>, kiểm chuẩn <b>Agile DoD</b> và lập báo cáo <b>Postmortem RCA</b>.</p></div>
    say: Hôm nay ta thực hành tình huống chuyên gia rà soát mã nguồn OWASP, kiểm tra tiêu chuẩn Agile và lập báo cáo Postmortem RCA. Tình huống chốt khoá kết hợp rà soát lỗi bảo mật thực tế, chuẩn hoàn thành Agile và văn hoá hậu kiểm xây dựng không đổ lỗi. Chính năng lực dẫn dắt quy trình kỹ thuật này phân biệt kỹ sư cao cấp với lập trình viên chỉ hoàn thành tính năng đơn lẻ.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Danh mục an toàn OWASP & lũy đẳng</td><td>Tổng hợp kiến thức bảo mật và chống giao dịch lặp từ đầu chặng ba</td></tr><tr><td>Truy vết nhật ký và SLA (BEP:L07–L08)</td><td>Dùng vết thời gian thật dựng lại dòng sự kiện lúc sự cố xảy ra</td></tr><tr><td>Nhịp phát hành Agile & Definition of Done</td><td>Một tính năng chỉ xem là hoàn thành khi đạt đủ kiểm thử tự động và cảnh báo</td></tr></table>
    say: Bài cuối cùng tổng hợp toàn bộ kỹ năng kỹ thuật và dẫn dắt đội ngũ mà các công ty như ACB. VPBank, NAB hay Vingroup tìm kiếm ở cấp độ kỹ sư backend trưởng thành. Khi bạn ngồi ghế rà soát mã cho đồng nghiệp trẻ, mắt nghề cần bắt nhanh ba loại rủi ro chí tử gồm chèn SQL. So sánh mật mã dễ lộ kênh kề và quên khoá lũy đẳng. Còn khi sự cố sản xuất xảy ra bất ngờ lúc nửa đêm. Nghệ thuật viết báo cáo hậu kiểm Postmortem không đổ lỗi kết hợp truy nguyên năm lần hỏi tại sao RCA giúp biến thiệt hại thành hàng rào tự động ngăn tái diễn. Bài học tình huống hôm nay đóng gói toàn bộ quy trình dẫn dắt đội ngũ qua code review và RCA. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Kinh nghiệm tổng hợp từ cả chặng giúp bạn đọc lướt một nhánh thay đổi mới và nhận diện nhanh các điểm hổng cốt lõi. Kết hợp tư duy truy nguyên không đổ lỗi biến mọi sự cố đã qua thành khoản đầu tư củng cố độ bền cho toàn bộ dây chuyền.
