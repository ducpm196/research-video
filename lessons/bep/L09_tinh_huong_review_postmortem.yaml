  title: Công thức và bất biến định lượng
  checks:
  - sum(1 for f in ['SQLI_CONCAT', 'CLEAN', 'NO_IDEM'] if f != 'CLEAN') == 2
  - len([a for a in ['add_lint_rule_E99', 'remind_dev'] if a.startswith('add_')]) == 1
  steps:
  - show: <div class='box key'><p><b>1. Quy tắc từ chối PR tự động:</b> <code>reject = has_sqli_concat or uses_eq_secret or missing_idem_key</code>.</p><p><b>2. Chỉ số hậu kiểm có giá trị:</b> Mỗi biên bản <b>RCA</b> phải đi kèm ít nhất <b>1 action item tự động hoá</b> (lint/test/alert) có hạn chốt rõ ràng.</p></div>
    say: Hai tiêu chí hành động biến quy trình rà soát mã và hậu kiểm sự cố thành hệ thống phòng thủ chủ động. Chỉ cần tồn tại bất kỳ một trong ba dấu hiệu nối chuỗi SQL. Dùng dấu hai bằng kiểm chữ ký hay thiếu khoá lũy đẳng ở cổng ghi tiền thì yêu cầu hợp nhất bị từ chối ngay. Còn mỗi bản điều tra nguyên nhân gốc phải tạo ra ít nhất một hành động tự động hoá để ngăn lỗi lặp lại mãi mãi. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Bất biến từ chối hợp nhất tự động khoá chặt ba lỗi nguy hiểm nhất trong xử lý thanh toán gồm chèn SQL, so bí mật thường và thiếu lũy đẳng. Yêu cầu ít nhất một hành động tự động hoá ở mỗi biên bản sự cố bảo đảm hệ thống không phụ thuộc vào lời hứa cẩn thận hơn của con người.
