- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - sum(1 for f in ['SQLI_CONCAT', 'CLEAN', 'NO_IDEM'] if f != 'CLEAN') == 2
  - len([a for a in ['add_lint_rule_E99', 'remind_dev'] if a.startswith('add_')]) == 1
  steps:
  - show: <p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>lines = ["sql = f'SELECT * FROM pay WHERE id={pid}'", 'if hmac.compare_digest(a,b):', 'charge(req_id)']</div><div>sqli = any("f'SELECT" in l for l in lines); bad_eq = any('sig ==' in l for l in lines)</div><div>no_idem = not any('idem_key' in l for l in lines); ok = int(not (sqli or bad_eq or no_idem))</div><div>print(f'sqli={int(sqli)} bad_eq={int(bad_eq)} no_idem={int(no_idem)} pr_approved={ok}')</div></div>
    say: Đoạn mã thực hiện rà soát mã nguồn code review tự động quét nhanh ba rủi ro thường bị bỏ sót nhất trên nhánh thay đổi thanh toán. Chương trình phát hiện dòng ghép chuỗi truy vấn SQL trực tiếp từ biến đầu vào và nhận thấy hàm ghi tiền thiếu khoá chống trùng lặp lũy đẳng. Vì có tới hai lỗi mức độ chặn gộp nên yêu cầu hợp nhất bị gắn cờ từ chối ngay trên bảng tổng kết. Tự động hoá bước quét sơ bộ các mẫu lỗi kinh điển trước khi người duyệt đọc sâu giúp tiết kiệm rất nhiều công sức rà soát.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>sqli=1 bad_eq=0 no_idem=1 pr_approved=0</div></div>
    say: Đầu ra chạy thật chỉ đích danh lỗi nối chuỗi SQL bằng một, thiếu lũy đẳng bằng một và phán quyết duyệt gộp bằng không. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Chỉ khi mọi chỉ dấu chặn gộp đều bằng không, nhánh mã mới đủ điều kiện chuyển sang bước thẩm định logic nghiệp vụ.
