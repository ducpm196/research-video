    say: Đoạn mã cài máy điều phối quy trình Saga gọi bù trừ theo thứ tự đảo ngược khi một bước cuối gặp lỗi giả lập. Hai
      bước giữ hàng và trừ tiền hoàn thành nên được ghi nhận lần lượt vào danh sách đã thực thi. Ngay khi bước giao vận thứ
      ba thất bại, vòng lặp dừng lại và phát sinh danh sách hoàn tác đảo ngược đúng trình tự. Đưa hai bước đã hoàn thành vào
