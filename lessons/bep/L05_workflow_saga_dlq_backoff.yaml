  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>base, cap, max_ret = 100, 350, 3</div><div>waits = [min(cap,
      base * (2 ** k)) for k in range(max_ret)]</div><div>routed_dlq = int(len(waits) &gt;= max_ret)</div><div>print(f'waits={waits}
      total_wait={sum(waits)}ms dlq={routed_dlq}')</div></div>
    say: Phép kiểm chứng thứ hai áp dụng lùi lũy thừa Exponential Backoff có trần giới hạn cho lỗi mạng tạm thời trước khi
      phân luồng. Với nền một trăm mi-li-giây và trần ba trăm năm mươi, ba lần chờ lần lượt tăng từ một trăm, hai trăm lên
      ba trăm năm mươi thay vì bốn trăm. Tổng thời gian chờ và cờ báo chuyển sang kênh thư chết chứng minh vòng thử lại không
      bao giờ vượt giới hạn. Dãy thời gian một trăm, hai trăm rồi chạm trần ba trăm năm mươi mi-li-giây minh hoạ chính xác
      cơ chế giới hạn bước nhảy.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>waits=[100, 200, 350] total_wait=650ms dlq=1</div></div>
    say: Đầu ra kiểm chứng xác nhận tổng thời gian chờ của ba lượt là sáu trăm năm mươi mi-li-giây và thông điệp được đẩy
      về DLQ. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Đếm đủ ba lần thất bại liên
      tiếp là điều kiện rẽ nhánh gọn ghẽ đẩy bản tin sang kênh thư chết để kỹ sư kiểm tra.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn vận hành
  checks:
  - 100 * (2 ** 2) == 400
  - 100 + 200 + 400 == 700
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Sự cố gián
      đoạn mạng 5 s</td><td>Nhiều worker thử lại cùng lúc</td><td>Dùng lùi lũy thừa + trần giới hạn + dao động ngẫu nhiên</td></tr><tr><td>Thông
      điệp độc sai lược đồ</td><td>Tắc cứng cả phân vùng Kafka</td><td>Đẩy qua kênh thư chết DLQ sau đúng K lần thử thất bại</td></tr><tr><td>Quy
      trình Saga 6 bước dài</td><td>Dễ sót bước bù trừ khi thêm nhánh</td><td>Cặp khai báo cố định (do, compensate) cho mỗi
      bước tiến</td></tr></table>
    say: Bảng kiến trúc làm rõ cơ chế chuyển thông điệp độc hại sang kênh thư chết DLQ sau khi hết số lần thử lại tối đa ở
      quy mô cụm lớn. Nếu giữ thông điệp lỗi tại đầu phân vùng và thử lại vĩnh viễn, toàn bộ lưu lượng người dùng bình thường
      xếp phía sau đều bị đình trệ theo. Đẩy qua hàng đợi thư chết kết hợp cảnh báo giúp hệ thống thông suốt trong lúc kỹ
      sư phân tích sửa bản tin. Trong thực tế phân tán, bổ sung độ lệch ngẫu nhiên vào khoảng chờ lùi lũy thừa giúp hàng nghìn
      máy trạm không cùng thức dậy thử lại đúng một giây. Kênh thư chết cần đi kèm hệ thống theo dõi và công cụ phát lại có
      kiểm soát sau khi đã sửa lỗi định dạng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (bù trừ ngược thiếu
      lũy đẳng):</b> Hàm hoàn tác chạy hai lần khi mạng chập chờn gây hoàn tiền đúp cho cùng một đơn hàng.<br><b>Lỗi 2 (bão
      thử lại đồng pha):</b> Hàng nghìn máy chờ đúng cùng chu kỳ lũy thừa rồi đánh sập máy chủ đích lúc vừa hồi phục.<br><b>Lỗi
      3 (DLQ bỏ hoang):</b> Đẩy sang kênh thư chết nhưng không gắn cảnh báo hoặc công cụ phát lại sau khi vá lỗi.</div></td></tr></table>
    say: Hãy lưu ý ba lỗi vận hành rất dễ gặp khi cài đặt Saga, thử lại và kênh thư chết. Thứ nhất là quên bảo đảm tính lũy
      đẳng cho hàm bù trừ khiến việc phát lại hoàn tác trừ hoặc cộng tiền nhiều lần. Thứ hai là thử lại không trần hoặc không
      rải ngẫu nhiên gây bão đồng pha đập vào dịch vụ mới khởi động lại. Thứ ba là coi DLQ như thùng rác vứt đi mà không theo
      dõi hay xây dựng quy trình xử lý lại. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu
      lượng tăng cao. Đặc biệt chú ý đảm bảo mọi thao tác bù trừ hoàn tác đều có khả năng chịu được việc nhận trùng thông
      điệp nhiều lần. Nếu hàm hoàn tiền chạy lặp hai lần vì rớt mạng thì số dư khách hàng có nguy cơ bị cộng dôi sai lệch
      nghiêm trọng.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 100 * (2 ** 2) == 400
  - 100 + 200 + 400 == 700
  steps:
  - show: <ol><li>Nếu quy trình 4 bước thành công ở 3 bước đầu và lỗi ở bước 4, hàm bù trừ chạy theo thứ tự nào?</li><li>Vì
      sao kênh thư chết DLQ không thể thiếu trong kiến trúc tiêu thụ sự kiện?</li></ol>
    say: Hãy tự kiểm tra qua hai câu hỏi chốt bài năm. Câu một, quy trình bốn bước lỗi ở bước cuối cùng thì trình tự bù trừ
      diễn ra thế nào? Câu hai, tại sao mọi hàng đợi sự kiện cần có kênh thư chết? Tạm dừng và tự trả lời. Hai câu hỏi này
      củng cố thứ tự đảo ngược khi bù trừ quy trình nhiều chặng và vai trò chống nghẽn của kênh thư chết.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① Chạy ngược từ bước đã xong gần nhất trở về đầu: <code>comp(3)
      → comp(2) → comp(1)</code> (không bù trừ bước 4).</p></td></tr></table>'
    say: 'Đáp án câu một: chạy đảo ngược từ bước ba về bước hai rồi bước một và bỏ qua bước bốn chưa hoàn thành. Nguyên tắc
      đơn giản là bước nào chưa thực thi xong thì không cần bù trừ, chỉ hoàn tác tuần tự các bước đã chốt thành công.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Để tách riêng bản tin hỏng vĩnh viễn sau hữu hạn lần
      thử, tránh làm tắc toàn bộ thông điệp hợp lệ phía sau.</p></td></tr></table>
    say: 'Đáp án câu hai: nhằm cách ly thông điệp lỗi vĩnh viễn sau khi hết lượt thử để không nghẽn các thông điệp sạch. Cô
      lập bản tin lỗi vào kênh riêng giúp giữ vững thông lượng hệ thống ngay cả khi đối tác gửi định dạng hỏng hàng loạt.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/BEP/L05
  steps:
  - show: <table class='t'><tr><th>Thực hành BEP:L05</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Chuyển
      thông điệp độc hại sang kênh thư chết DLQ sau khi hết số lần thử lại tối đa</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>steps=reserve:OK,debit:OK,ship:FAIL;
      base_ms=100 cap_ms=350 max_retries=3</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh BEP L05
      duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự tay cài đặt bộ điều phối Saga và đường ống lùi lũy thừa đẩy sang kênh thư chết từ luồng chuẩn. Lưu ý xử
      lý chính xác cả tình huống mọi bước đều thành công hoặc bước đầu tiên lỗi ngay khiến không có bước bù trừ nào và thời
      gian chờ bằng không. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ
      cả ca ẩn. Kiểm kỹ cách ghép chuỗi các bước bù trừ phân cách bằng dấu phẩy và giá trị mặc định khi không có bước nào
      cần hoàn tác. Tình huống thử lại không xảy ra ở chuỗi thành công hoàn toàn phải giữ tổng thời gian chờ bằng không.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai BEP:L05</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (Saga tiến)</b></td><td>Duyệt <code>steps</code> đến bước <code>FAIL</code> đầu tiên thì <code>break</code> và đánh
      dấu <code>failed=True</code></td></tr><tr><td><b>Bước 2 (bù trừ ngược)</b></td><td>Đảo ngược <code>done</code> nối chuỗi
      <code>undo_&lt;step&gt;</code>; nếu không lỗi hoặc <code>done</code> rỗng thì in <code>NONE</code></td></tr><tr><td><b>Bước
      3 (Backoff trần)</b></td><td>Chỉ cộng chuỗi chờ <code>min(cap_ms, base_ms * 2**k)</code> khi phát sinh lỗi</td></tr></table>
    say: Gợi ý cài đặt bài thực hành nhấn mạnh ba nhánh biên dễ quên khi chấm ca ẩn. Nếu bước đầu tiên thất bại ngay lập tức,
      danh sách đã làm xong rỗng nên chuỗi bù trừ vẫn là NONE dù cờ đẩy DLQ bật lên bằng một. Ngược lại nếu toàn bộ quy trình
      đều thông suốt thành công, tổng thời gian chờ thử lại phải bằng không. Lưu ý chỉ cộng dồn max retries lượt chờ backoff
      khi có ít nhất một bước thất bại; nếu mọi bước đều đạt thì tổng chờ bằng không.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>compensations=undo_debit,undo_reserve</div><div>backoff_total_ms=650</div><div>routed_dlq=1</div></div>
    say: Kết quả chuẩn cho chuỗi ba bước lỗi tại vận đơn là bù trừ ngược trừ tiền rồi nhả hàng, tổng chờ sáu trăm năm mươi
      mi-li-giây và chuyển tuyến DLQ bằng một. Khi toàn bộ các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn
      đều thông qua, bạn có thể an tâm lưu kết quả và chuyển tiếp. Các ca ẩn kiểm nghiệm cả nhánh thành công sạch, nhánh lỗi
      ở chặng đầu tiên lẫn các trần chờ khác nhau.
    focus:
    - 1
    - 2
    - 2
    clear: true
