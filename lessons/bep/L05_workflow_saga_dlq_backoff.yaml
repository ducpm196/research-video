  steps:
  - show: <p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>steps = [('reserve', True), ('debit', True), ('ship',
      False)]</div><div>done = []</div><div>comps = []</div><div>for name, ok in steps:</div><div>    if not ok:</div><div>        comps
      = [f'undo_{x}' for x in reversed(done)]</div><div>        break</div><div>    done.append(name)</div><div>print('done='
