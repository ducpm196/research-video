      (Dead Letter Queue)</code></td><td>Hàng đợi riêng giữ các thông điệp vượt quá số lần thử lại tối đa chờ con người xử
      lý</td></tr></table>
    say: Bảng ký hiệu tóm tắt ba mảnh ghép kiểm soát lỗi cho quy trình bất đồng bộ nhiều chặng. Ngăn xếp bù trừ của Saga ghi
      lại từng bước thành công để hoàn tác đảo chiều khi gặp trục trặc về sau. Công thức lùi lũy thừa kìm hãm tần suất gọi
      lại dịch vụ đang quá tải bằng ngưỡng trần cố định. Khi hết ngân sách thử lại, thông điệp được chuyển thẳng sang hàng
      đợi thư chết DLQ để giải phóng luồng. Những quy chuẩn trên sẽ xuyên suốt từ phần chạy thực nghiệm mẫu tới bài tập thực
      hành cuối bài. Ngăn xếp lưu vết hoàn tác bảo đảm thứ tự khôi phục đúng chiều ngược lại của tiến trình thực thi thực
      tế. Giới hạn trần chờ thử lại bảo vệ người nhận không rơi vào trạng thái đợi kéo dài vô tận trước khi chuyển tuyến lỗi.
