      chuỗi thử lại <b>Backoff</b> từ <code>100 ms</code> vượt ngưỡng <b>3 lượt</b> sẽ tách gọn vào <b>DLQ</b>.</p></div>
    say: Một thông điệp hỏng định dạng nếu bị thử lại vô tận ở đầu hàng đợi có thể chặn đứng hàng trăm nghìn giao dịch hợp
      lệ phía sau suốt nhiều giờ liền. Tương tự, nếu khâu giao vận từ chối nhưng khâu trừ tiền trước đó không có đường hoàn
      tác ngược thứ tự, số dư khách hàng sẽ bị giữ sai vĩnh viễn.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Cài bộ điều phối <b>Saga bù trừ ngược</b>, <b>Exponential Backoff</b>
      và phân luồng <b>DLQ</b>.</p></div>
    say: Hôm nay ta cài đặt bộ điều phối Saga bù trừ ngược, tính bước lùi lũy thừa và phân luồng kênh thư chết DLQ. Cơ chế
      bù trừ đảo ngược bảo đảm trạng thái nghiệp vụ cuối cùng luôn sạch sẽ dù giao dịch kéo dài nhiều dịch vụ hỏng giữa đường.
      Khi kết hợp với hàng đợi thư chết và thời gian lùi lũy thừa, hệ thống vừa chống nghẽn hàng đợi vừa tránh dồn tải vào
      máy đang yếu.
    clear: true
