      nhất</td><td>Cho phép gọi lại bước bù trừ hoặc thử lại an toàn nhiều lần</td></tr><tr><td>Phân biệt lỗi tạm thời và
      vĩnh viễn</td><td>Mất mạng tạm thời thử lại được, còn sai dữ liệu thì thử mãi vẫn lỗi</td></tr></table>
    say: Khi một nghiệp vụ ngân hàng hay thương mại điện tử kéo dài qua ba đến năm dịch vụ độc lập như giữ tồn kho. Trích
      nợ ví và tạo vận đơn, giao dịch khoá phân tán hai pha trở nên quá chậm và dễ treo. Các bộ điều phối quy trình hiện đại
      như Temporal. Camunda hay mô hình Saga giải quyết bài toán bằng chuỗi bước tiến nối tiếp đi kèm từng thao tác bù trừ
      hoàn tác nếu khâu sau gặp sự cố. Song song đó ở tầng nhận thông điệp. Chiến lược thử lại với độ trễ lùi theo lũy thừa
      kèm kênh thư chết DLQ giúp cô lập lỗi vĩnh viễn không làm tắc nghẽn luồng chính. Bài học hôm nay giúp bạn tự cài đặt
      hoàn chỉnh bộ khung điều phối Saga có bù trừ đảo ngược và chuyển tuyến DLQ. Kết nối chặt chẽ các nền tảng này giúp giải
      pháp cài đặt gọn gàng và ổn định. Thay cho khoá giữ chặt tài nguyên hai pha vốn làm chậm toàn bộ hệ thống, giao dịch
      dài dùng bù trừ từng chặng gọn nhẹ. Mỗi bước tiến đều phải thiết kế sẵn hàm đảo ngược có tính lũy đẳng để sẵn sàng chạy
      bù trừ khi nhánh sau thất bại.
