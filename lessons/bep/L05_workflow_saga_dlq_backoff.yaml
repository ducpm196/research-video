- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 100 * (2 ** 2) == 400
  - 100 + 200 + 400 == 700
  steps:
  - show: <div class='box key'><p><b>1. Thời gian trễ lũy thừa có trần:</b> <code>delay(attempt) = min(cap_ms, base_ms * 2**attempt)</code>.</p><p><b>2.
      Bất biến hoàn tác Saga:</b> Thành công <code>[s_1, s_2]</code> rồi lỗi tại <code>s_3</code> thì chỉ bù trừ <code>[comp_2,
      comp_1]</code>.</p></div>
    say: Hai công thức bảo đảm bộ điều phối quy trình xử lý đúng cả độ trễ mạng lẫn tính nhất quán nghiệp vụ cuối cùng. Công
      thức thử lại nhân đôi khoảng nghỉ qua từng lần thất bại nhưng luôn chặn trên bởi ngưỡng trần để không làm cạn thời gian
      chờ toàn cục. Bất biến bù trừ bắt buộc chỉ hoàn tác các bước đã chạy xong theo đúng chiều đảo ngược của ngăn xếp. Áp
      dụng trần trên lên hàm mũ thời gian chờ giữ cho tổng độ trễ thử lại nằm gọn trong ngân sách thời gian cho phép. Bất
      biến bù trừ bảo đảm bước nào chưa kịp chạy tới thì tuyệt đối không nằm trong danh sách gọi hàm hoàn tác.
