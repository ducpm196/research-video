  steps:
  - show: <div class='box key'><p>Hàm <b>Serverless</b> có độ trễ ấm <code>40 ms</code> nhưng thêm <code>350 ms</code> khi
      khởi động nguội thành <code>390 ms</code>; kiểm <code>sub == owner_id</code> tại truy vấn chặn đứng <b>OWASP BOLA</b>.</p></div>
    say: Chi phí hàm phi máy chủ AWS Lambda hay Azure Functions có thể rẻ hơn nhiều lần máy chủ chạy liên tục khi lưu lượng
      thưa thớt. Nhưng một đợt khởi động nguội ba trăm chín mươi mi-li-giây dễ làm rớt chỉ tiêu phản hồi nhanh. Song song
      đó, tách nhỏ từng điểm cuối thành nhiều hàm rời dễ gây lỗi quên kiểm tra chủ sở hữu BOLA nếu thiếu lớp bảo vệ chung.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Định lượng độ trễ <b>Cold Start Serverless</b> và cài chốt kiểm
      <b>OWASP BOLA</b>.</p></div>
    say: Hôm nay ta định lượng độ trễ khởi động nguội Serverless và cài chốt kiểm OWASP bảo mật cấp đối tượng. Kiến trúc phi
      máy chủ mang lại lợi thế chi phí tuyệt vời nhưng đòi hỏi sự tính toán kỹ lưỡng về độ trễ đuôi và rào chắn phân quyền.
      Bảo vệ quyền sở hữu ở mức bản ghi là chốt chặn bắt buộc dù bạn chạy ứng dụng trên cụm máy chủ hay hàm đám mây.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Xác thực JWT ở cổng vào</td><td>Chữ
      ký hợp lệ chỉ chứng minh người dùng là ai, chưa chứng minh họ được phép xem đơn hàng nào</td></tr><tr><td>Mô hình thực
      thi không máy chủ</td><td>Nhà cung cấp AWS hay Azure tự cấp phát hộp chạy theo từng yêu cầu và thu tiền theo mi-li-giây</td></tr><tr><td>Danh
      sách rủi ro OWASP API</td><td>Nhóm lỗ hổng đứng đầu nhiều năm liền là Broken Object Level Authorization</td></tr></table>
    say: Chuyển dịch khối lượng xử lý lên hạ tầng đám mây AWS. Azure thông qua các hàm phi máy chủ Serverless FaaS giúp đội
      ngũ không phải bảo trì máy ảo khi tải biến thiên mạnh. Tuy nhiên sự tiện lợi đó đi kèm hai bài toán kỹ thuật sống còn
      là độ trễ khởi động nguội và kiểm soát quyền chi tiết ở từng điểm cuối rời rạc. Nhiều hệ thống ngân hàng dùng JWT hoàn
      hảo. Nhưng vẫn để lọt dữ liệu nhạy cảm vì tin vào mã định danh trên đường dẫn mà quên đối chiếu quyền sở hữu cấp bản
      ghi. Bài học hôm nay ghép nối phần tính toán thông lượng đám mây Serverless cùng hai phòng tuyến cốt lõi trong danh
      sách an toàn mã nguồn OWASP. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Vì mỗi hàm
      phi máy chủ chạy tách biệt theo từng yêu cầu, lập trình viên rất dễ quên bước kiểm tra sở hữu lặp lại ở hàng chục hàm.
      Nhúng kiểm soát quyền sở hữu ngay vào tầng truy xuất dữ liệu hoặc bộ lọc dùng chung giúp khắc phục triệt để điểm yếu
      này.
