  steps:
  - show: <div class='box key'><p><b>1. Độ trễ trung bình Serverless:</b> <code>T_avg = T_warm + cold_ratio * T_cold_penalty</code>.</p><p><b>2.
      Điều kiện truy xuất an toàn:</b> <code>SELECT * FROM doc WHERE id = ? AND owner_id = ?</code> (khoá chặt cả SQLi lẫn
      BOLA).</p></div>
    say: Hai biểu thức định lượng giúp kỹ sư kiểm soát đồng thời hiệu năng đám mây và an toàn truy cập tầng dữ liệu. Độ trễ
      trung bình kỳ vọng cho mỗi lượt gọi bằng độ trễ xử lý ấm cộng thêm tỉ lệ yêu cầu chạm khởi động nguội nhân với mức phạt
      khởi tạo môi trường. Còn ở câu lệnh SQL, gắn thêm điều kiện mã chủ sở hữu cùng tham số dấu hỏi bảo vệ dữ liệu ngay cả.
      Khi tầng kiểm quyền phía trên vô tình bị bỏ sót. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định
      nghĩa gốc. Khi tỉ lệ chạm khởi động nguội giảm về không nhờ giữ sẵn phiên bản ấm, độ trễ trung bình hội tụ sát về mức
      xử lý ấm tối ưu. Tại tầng dữ liệu, ràng buộc kép cả mã bản ghi và mã chủ sở hữu giữ tính an toàn ngay cả khi có lỗi
      gọi nhầm ở lớp điều khiển.
