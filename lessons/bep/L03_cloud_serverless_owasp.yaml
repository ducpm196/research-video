- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (bỏ qua BOLA):</b>
      Kiểm tra người dùng đã đăng nhập xong trả thẳng <code>SELECT * FROM ord WHERE id = ?</code> mà thiếu <code>owner_id
      = ?</code>.<br><b>Lỗi 2 (lệch chi phí FaaS):</b> Đưa khối lượng tải ổn định cực lớn 24/7 lên FaaS làm hoá đơn cao gấp
      nhiều lần cụm container cố định.<br><b>Lỗi 3 (rò thông báo lỗi):</b> Trả thẳng dấu vết ngăn xếp cơ sở dữ liệu ra HTTP
      500 làm lộ tên bảng và phiên bản thư viện.</div></td></tr></table>
    say: Hãy cảnh giác với ba lỗ hổng tốn kém nhất khi vận hành kiến trúc phi máy chủ và bảo mật API. Thứ nhất là lỗi kinh
      điển chỉ kiểm tra tính hợp lệ của thẻ đăng nhập mà bỏ qua quyền sở hữu trên từng mã bản ghi. Thứ hai là đẩy cả tải nền
      liên tục cường độ cao lên hạ tầng tính tiền từng nhịp gây đội chi phí hàng tháng. Thứ ba là in thẳng lỗi nội bộ cơ sở
      dữ liệu về trình duyệt giúp kẻ xấu thăm dò cấu trúc dữ liệu. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững
      tính ổn định khi lưu lượng tăng cao. Tránh kết luận vội hàm phi máy chủ luôn rẻ hơn cụm chạy liên tục khi lưu lượng
      nền thực tế đã ổn định ở cường độ cao. Luôn tính thử cả chi phí giữ ấm và chi phí gọi kho dữ liệu trước khi chốt mô
      hình triển khai đám mây.
