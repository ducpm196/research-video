      liệu mẫu</b></td><td><code>warm_ms=40 cold_penalty=350 cold_rate=0.10; owners=101:alice,102:bob,103:alice; reqs=alice:101,alice:102,bob:102,eve:103</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh BEP L03 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự lập trình bộ mô phỏng độ trễ đám mây phi máy chủ và cổng kiểm soát quyền sở hữu BOLA chuẩn OWASP. Chương
      trình đọc chi phí ấm, mức phạt nguội, bảng sở hữu hồ sơ cùng danh sách yêu cầu truy cập từ luồng chuẩn rồi lọc sạch
      mọi truy cập trái chủ. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng
      đủ cả ca ẩn. Chú ý kiểm tra chính xác danh tính chủ tài khoản đối với từng yêu cầu đọc hồ sơ đưa vào qua luồng chuẩn.
      Nếu mã hồ sơ yêu cầu không tồn tại trong bảng sở hữu, hệ thống không được phép sập mà phải chặn gọn ở nhánh từ chối.
