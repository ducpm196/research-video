      thử nghiệm chéo tài khoản. Tài khoản Alice mang thẻ xác thực hợp lệ nhưng truyền mã hồ sơ của Bob hòng đọc trộm dữ liệu
      số dư. Hàm kiểm tra so khớp mã chủ sở hữu trên bản ghi với danh tính bên trong thẻ phiên để từ chối bằng mã bốn lẻ ba
      ngay lập tức. Mã kiểm tra từ chối tức thì mọi lượt truy vấn sang mã hồ sơ không thuộc về người dùng đang giữ phiên hợp
      lệ.
