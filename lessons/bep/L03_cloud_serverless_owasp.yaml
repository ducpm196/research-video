- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 40 + 350 == 390
  - 390 > 40
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>warm_ms, cold_pen, cold_pct = 40, 350, 0.10</div><div>avg_ms
      = warm_ms + cold_pct * cold_pen</div><div>print(f''warm={warm_ms}ms p_cold_peak={warm_ms + cold_pen}ms avg={avg_ms:.1f}ms'')</div></div>

      <p class="note"><b>Thông lượng đồng thời (Little):</b> số luồng đồng thời = <code>RPS × thời gian xử lý (giây)</code>; ở tải <code>200 RPS</code> với trễ <code>75 ms = 0,075 s</code> cần <code>200 * 0.075 = 15</code> luồng.</p>

      '
    say: Đoạn mã ước lượng chi phí khởi động nguội và thông lượng đồng thời trên Serverless FaaS AWS Lambda và Azure Functions
      từ các thông số thực tế. Với thời gian thực thi ấm bốn mươi mi-li-giây và mức phạt khởi nguội ba trăm năm mươi mi-li-giây
      chiếm mười phần trăm lưu lượng. Thời gian đỉnh vọt lên gần gấp mười lần. Vì vậy trung bình trượt nhẹ nhưng phân vị cao
      tăng vọt nếu không giữ trước phiên bản ấm cho luồng giao dịch thanh toán chính. Dù phần trăm yêu cầu gặp khởi động nguội
      chỉ chiếm một phần nhỏ, đỉnh trễ gần bốn trăm mi-li-giây vẫn ảnh hưởng mạnh các phân vị cao.
    focus:
