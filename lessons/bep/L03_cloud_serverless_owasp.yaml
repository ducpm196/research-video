    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>warm=40ms p_cold_peak=390ms avg=75.0ms</div></div>
    say: Kết quả chạy thật xác nhận đỉnh độ trễ khi khởi nguội đạt ba trăm chín mươi mi-li-giây, kéo độ trễ trung bình lên
