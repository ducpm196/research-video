  - show: <table class='t'><tr><th>Gợi ý triển khai BEP:L03</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (Serverless)</b></td><td>Cộng <code>warm_ms</code> với tích <code>cold_rate * cold_penalty</code> làm tròn một chữ số
      thập phân</td></tr><tr><td><b>Bước 2 (bảng quyền)</b></td><td>Nạp từ điển ánh xạ <code>doc_id -&gt; owner</code> từ
      dòng <code>owners=</code></td></tr><tr><td><b>Bước 3 (kiểm chéo)</b></td><td>Với mỗi yêu cầu <code>u:did</code>, kiểm
      tra chính xác <code>owners.get(did) == u</code> để tách đếm hợp lệ và bị chặn</td></tr></table>
    say: Gợi ý triển khai chia rõ hai phần tính hiệu năng và chặn quyền truy cập đối tượng. Lưu ý dùng phương thức tra cứu
      an toàn trên từ điển để trường hợp hồ sơ không tồn tại cũng được từ chối thay vì văng lỗi thiếu khoá. Nếu chỉ tin vào
      việc thẻ phiên có mặt trên danh sách hợp lệ mà quên so đối chiếu chủ sở hữu, các ca ẩn tấn công chéo sẽ lập tức thất
      bại. Phép tính độ trễ trung bình cần tuân thủ đúng quy cách làm tròn một chữ số thập phân để khớp chuẩn đầu ra.
