      Stampede khi khoá nóng hết hạn đồng loạt. Trong một trăm hai mươi yêu cầu dồn vào hai khoá nóng đang trống. Mô hình
      không gộp sẽ phóng toàn bộ số truy vấn đó xuống cơ sở dữ liệu cùng một thời khắc. Khi qua bộ lọc hợp nhất yêu cầu theo
      tên khoá đang bay, số truy vấn thật rút xuống đúng bằng số lượng khoá duy nhất. Thử nghiệm trên hai khoá nóng với tổng
      một trăm hai mươi lượt gọi cho thấy tỉ lệ giảm truy vấn nguồn gần chín mươi chín phần trăm.
