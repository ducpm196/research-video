- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 100 - 1 == 99
  - 64 == 8 * 8
  steps:
  - show: <div class='box key'><p><b>1. Hệ số nén tải Singleflight:</b> N yêu cầu đồng thời trên 1 khoá chỉ tạo <code><b>1</b>
      lượt đọc DB</code> và <code>N - 1 lượt dùng chung</code>.</p><p><b>2. Liên kết Audit bất biến:</b> <code>chain[i] =
      sha256(chain[i-1] + '|' + event_i)</code> (sửa 1 ký tự ở bất kỳ đâu làm gãy toàn bộ phần đuôi).</p></div>
    say: Hai biểu thức định lượng nhấn mạnh sức mạnh bảo vệ của kiến trúc hợp nhất tải và liên kết băm kiểm toán. Dù số lượng
      yêu cầu đồng thời chạm vào cùng một khoá bị hụt tăng lên một trăm hay một nghìn, số lượt truy vấn nguồn gốc vẫn giữ
      nguyên ở giá trị một. Còn ở chuỗi kiểm toán, chỉ cần thay đổi một ký tự của bản ghi đầu tiên cũng làm toàn bộ chuỗi
      giá trị băm đứng sau bị sai lệch hoàn toàn. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa
      gốc. Hệ số nén tải từ trăm lượt xuống một lượt giảm áp lực đột biến cho máy chủ dữ liệu ngay trong mi-li-giây nhạy cảm
      nhất. Độ nhạy tuyết lở của hàm băm chuẩn bảo đảm sửa dù chỉ một bít dữ liệu cũ cũng làm sai hoàn toàn phần mã băm đuôi.
