    say: Sự cố Cache Stampede thường xảy ra đúng lúc nhiều dịch vụ nhất loạt hết hạn bộ nhớ đệm hoặc vừa khởi động lại cùng
      một giây. Hậu quả là hàng trăm truy vấn giống hệt nhau đánh sập cơ sở dữ liệu phía sau. Ngoài ra nếu bảng nhật ký kiểm
      toán chỉ lưu từng dòng văn bản rời rạc, kẻ chiếm quyền dễ sửa âm thầm một dòng giao dịch mà không để lại dấu vết.
