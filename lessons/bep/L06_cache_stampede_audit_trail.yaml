- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 100 - 1 == 99
  - 64 == 8 * 8
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import hashlib</div><div>def chain_hashes(events):</div><div>    h
      = '0' * 64</div><div>    out = []</div><div>    for ev in events:</div><div>        h = hashlib.sha256(f'{h}|{ev}'.encode()).hexdigest()</div><div>        out.append(h)</div><div>    return
      out</div><div> </div><div>c1 = chain_hashes(['login:an', 'pay:100', 'logout:an'])</div><div>c2 = chain_hashes(['login:an',
      'pay:999', 'logout:an'])</div><div>print(f'tamper_caught={int(c1[-1] != c2[-1])} same_prefix={int(c1[0] == c2[0])}')</div></div>
    say: Phép kiểm chứng thứ hai cài đặt nhật ký kiểm toán Audit Trail liên kết chuỗi băm phát hiện mọi chỉnh sửa trái phép
      trong lịch sử vận hành. Ta xây hai chuỗi băm ba sự kiện hoàn toàn giống nhau ngoại trừ sửa giá trị thanh toán tại sự
      kiện thứ hai từ một trăm thành chín chín chín. Vì mỗi mã băm tiếp theo gộp chặt mã băm bước liền trước nên chỉ sửa một
      bản ghi cũng làm mã băm cuối đổi hoàn toàn. Khi dữ liệu thứ hai bị sửa lén, toàn bộ chuỗi mã băm từ bước hai trở về
      sau đều đổi khác hoàn toàn so với chuỗi mẫu ban đầu.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>tamper_caught=1 same_prefix=1</div></div>
    say: Kết quả đối chiếu xác nhận mã băm đầu giữ nguyên nhưng mã băm cuối phát hiện sai lệch ngay tức thì. Điều này giữ
      nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Nhờ mã băm trước sửa vẫn giữ nguyên, kiểm toán viên
      còn xác định được chính xác vị trí bản ghi bị can thiệp trái phép.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn vận hành
  checks:
  - 100 - 1 == 99
