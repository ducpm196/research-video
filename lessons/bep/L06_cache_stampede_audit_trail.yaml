- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (TTL đồng loạt):</b>
      Ghi cố định đúng 3600 giây cho cả lô mười nghìn sản phẩm khiến toàn bộ hết hạn cùng lúc.<br><b>Lỗi 2 (học đòi khoá chặt):</b>
      Dùng chung một khoá toàn cục cho mọi tên khoá làm các yêu cầu khác khoá cũng bị xếp hàng chờ oan.<br><b>Lỗi 3 (Audit
      thiếu prev_hash):</b> Băm từng dòng độc lập nên kẻ xấu sửa cặp nội dung kèm chữ ký của riêng dòng đó mà chuỗi vẫn hợp
      lệ.</div></td></tr></table>
    say: Hãy lưu tâm ba lỗi thường làm hỏng giải pháp chống dồn tải bộ nhớ đệm và kiểm toán dữ liệu. Thứ nhất là đặt chung
      một hạn sống cứng không dao động ngẫu nhiên cho cả lô hàng nghìn khoá. Thứ hai là đặt khoá đồng bộ trên toàn bộ bộ nhớ
      đệm thay vì cô lập theo từng tên khoá, khiến các luồng không liên quan bị nghẽn oan. Thứ ba là băm rời từng dòng nhật
      ký mà quên nối băm bước liền trước. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng
      tăng cao. Cũng cần đặt thời gian chờ tối đa trên cơ chế gộp lượt bay để một yêu cầu bị kẹt không làm cả nhóm đứng chờ
      vô hạn. Lưu ý dùng chung chuẩn nối chuỗi có dấu ngăn cách cố định khi tính băm để tránh nhầm lẫn ranh giới giữa hai
      trường kề nhau.
