  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Khoá trang
      chủ 10k req/s</td><td>Hụt cache 100 ms → 1 000 câu SQL</td><td>Dùng Singleflight + giữ bản cũ làm mới ngầm dưới nền</td></tr><tr><td>10
      000 khoá hết hạn tròn 00:00</td><td>Đỉnh CPU định kỳ mỗi giờ</td><td>Rải ngẫu nhiên TTL thêm từ 5% đến 15%</td></tr><tr><td>Bảng
      Audit hàng triệu dòng</td><td>Nguy cơ nhân sự nội bộ sửa trộm dòng</td><td>Nối chuỗi băm SHA-256 & định kỳ lưu chốt
      gốc ra ngoài</td></tr></table><div class="code"><div>in_flight = set(['hot1', 'hot1', 'hot2'])  <span class="cm"># Singleflight</span></div><div>ttl_s
      = [300 + (i * 17) % 45 for i in range(len(in_flight))]  <span class="cm"># rải TTL jitter</span></div></div>
    say: Bảng tổng hợp giải thích cách vận hành thực tế để ngăn chặn bão truy vấn Cache Stampede và bảo vệ bảng nhật ký kiểm
      toán ở quy mô sản xuất. Rải đều thời hạn sống cho từng khoá giúp xoá sạch các đỉnh tải đồng hồ vào mỗi đầu giờ chẵn.
      Còn đối với nhật ký kiểm toán, việc định kỳ gửi mã băm chốt cuối ra một hệ thống lưu trữ tách quyền bảo đảm không ai
      sửa được lịch sử đã ký. Kết hợp mô hình giữ bản đệm cũ phục vụ tạm trong lúc làm mới ngầm giúp giảm độ trễ trượt đệm
      cho trang chủ xuống bằng không. Xuất mã băm chốt cuối định kỳ sang kho lưu trữ chỉ nối thêm bảo vệ nhật ký ngay cả khi
      máy chủ chính bị xâm nhập.
