        say: "Băng thời gian trên hình vẽ theo đúng tỉ lệ độ dài của từng thao tác. Ở thanh trên, khi dùng chuột, hai khối chuẩn bị M và hai khối trỏ chuột P chiếm phần lớn thời gian vì phải tìm và bấm tới hai nút khác nhau. Ở thanh dưới, khi tay đã nằm trên bàn phím, họ chỉ cần một nhịp M 1 phẩy 35 giây rồi bấm hai phím K K mất 0 phẩy 4 giây, tổng cộng 1 phẩy 75 giây."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Quy tắc lập chuỗi thao tác và đặt nhịp chuẩn bị tâm lý M"
    checks:
      - "alg.hci_klm_time('MPBB') == round(1.35 + 1.1 + 0.2, 2)"
      - "alg.hci_klm_time('MKK') == 1.35 + 0.4"
    steps:
      - show: |
          <p><b>Bước 1 — Liệt kê đầy đủ các thao tác vật lý ($H, P, B, K$).</b> Trước hết viết ra mọi động tác tay từ trạng thái bắt đầu tới khi hoàn tất lệnh:</p>
          $$\text{Chuột: } H \to P \to BB \to P \to BB, \qquad \text{Phím tắt (tay sẵn trên phím): } K \to K$$
        focus: [1, 2, 2]
        say: "Bước một của phương pháp là liệt kê thật trung thực mọi thao tác vật lý của bàn tay. Với cách dùng chuột, tay rời phím sang chuột là H, trỏ nút xoá là P, nhấp là B B, rồi trỏ nút đồng ý là P và nhấp B B. Với cách bấm phím tắt khi tay đã ở sẵn trên bàn phím, phần vật lý chỉ có hai lần gõ phím K và K."
      - show: |
          <p><b>Bước 2 — Quy tắc chèn nhịp chuẩn bị tâm lý $M = 1{,}35\text{ s}$.</b> Ta đặt một chữ $M$ trước mỗi bước bắt đầu một cụm lệnh hoặc tìm một đích mới trên màn hình, nhưng <b>không</b> đặt $M$ giữa hai thao tác đã gắn liền thành một phản xạ đơn:</p>
          $$\text{Tìm đích rồi nhấp chuột: } M + P + BB \quad (\text{không viết } M + P + M + BB)$$
          $$\text{Gõ một tổ hợp phím hoặc từ quen thuộc: } M + K + K \quad (\text{chỉ 1 chữ } M \text{ ở đầu cụm})$$
        focus: [1, 2, 3]
        say: "Bước hai là bước quan trọng nhất: chèn chữ M vào đúng chỗ theo quy tắc của bài báo năm 1980. Khi đã trỏ chuột P tới nút thì việc nhấp B B diễn ra liền mạch, nên chỉ đặt một chữ M trước P thành M cộng P cộng B B. Tương tự, một tổ hợp hai phím tắt đã thuộc lòng được não phát lệnh như một cụm duy nhất nên chỉ có một chữ M đứng đầu là M cộng K cộng K."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính chi tiết nhiệm vụ xoá tệp bằng chuột (5,7 s) và bằng phím tắt (1,75 s)"
    checks:
      - "round(0.4 + 1.35 + 1.1 + 0.2, 2) == 3.05"
      - "round(1.35 + 1.1 + 0.2, 2) == 2.65 and round(3.05 + 2.65, 2) == 5.70 == alg.hci_klm_time('HMPBBMPBB')"
      - "round(1.35 + 0.2 + 0.2, 2) == 1.75 == alg.hci_klm_time('MKK')"
      - "round((5.7 - 1.75) * 200 / 60, 1) == 13.2"
    steps:
      - show: |
          <p><b>Bước 1 — Chặng đầu của phương án dùng chuột: rời bàn phím và bấm biểu tượng thùng rác.</b></p>
          $$T_{\text{chuột, chặng 1}} = H + M + P + BB = 0{,}4 + 1{,}35 + 1{,}1 + (0{,}1 + 0{,}1) = \hlb{3{,}05}\text{ s}$$
        focus: [1, 2]
        say: "Ta tính từng bước cho ví dụ chuẩn của bài. Ở bước một, chặng đầu dùng chuột gồm H bằng 0 phẩy 4, M bằng 1 phẩy 35, P bằng 1 phẩy 1 và B B bằng 0 phẩy 2 giây, cộng lại được 3 phẩy 05 giây."
      - show: |
          <p><b>Bước 2 — Chặng hai của phương án dùng chuột: định vị hộp xác nhận và bấm nút “Đồng ý”.</b></p>
          $$T_{\text{chuột, chặng 2}} = M + P + BB = 1{,}35 + 1{,}1 + 0{,}2 = \hlb{2{,}65}\text{ s}$$
          $$T_{\text{chuột}} = 3{,}05 + 2{,}65 = \hl{5{,}7}\text{ s}$$
        focus: [2, 3]
        say: "Bước hai, khi hộp xác nhận bật ra, người dùng mất thêm M bằng 1 phẩy 35, P bằng 1 phẩy 1 và B B bằng 0 phẩy 2 giây, tức chặng hai hết 2 phẩy 65 giây. Cộng hai chặng lại, 3 phẩy 05 cộng 2 phẩy 65 bằng đúng 5 phẩy 7 giây."
      - clear: true
        show: |
          <p><b>Bước 3 — Phương án dùng phím tắt khi tay đang đặt sẵn trên bàn phím (ví dụ phím xoá rồi phím xác nhận).</b></p>
          $$T_{\text{phím tắt}} = M + K + K = 1{,}35 + 0{,}2 + 0{,}2 = \hlg{1{,}75}\text{ s}$$
        focus: [1, 2]
        say: "Bước ba, ta tính phương án hai khi nhân viên đang để sẵn tay trên bàn phím và dùng hai phím bấm liên tiếp. Không tốn H và P, chuỗi thao tác chỉ còn M cộng K cộng K, tức 1 phẩy 35 cộng 0 phẩy 2 cộng 0 phẩy 2 bằng 1 phẩy 75 giây."
      - show: |
          <p><b>Bước 4 — Nhân lên quy mô công việc lặp lại 200 lần mỗi ca.</b></p>
          <table class="t"><tr><th>đại lượng so sánh</th><th>dùng chuột</th><th>dùng phím tắt</th><th>chênh lệch</th></tr>
          <tr><td>thời gian 1 lần thao tác</td><td>$5{,}70$ s</td><td>$1{,}75$ s</td><td>tiết kiệm $\mathbf{3{,}95}$ s / lần (nhanh gấp $\approx 3{,}26$ lần)</td></tr>
          <tr><td>lặp lại 200 lần mỗi ca</td><td>$1140$ s ($19$ phút)</td><td>$350$ s ($\approx 5{,}8$ phút)</td><td>tiết kiệm $790$ s ($\approx \mathbf{13{,}2}$ phút thao tác thuần)</td></tr></table>
        focus: ["2.2", "2.3"]
        say: "Bước bốn, ta nhân con số chênh lệch 3 phẩy 95 giây ở một lần thao tác cho một nhân viên phải xử lý 200 hồ sơ mỗi ca làm việc. Dùng chuột ngốn 1140 giây tức 19 phút, còn phím tắt chỉ hết 350 giây, tiết kiệm hơn 13 phút thao tác cơ học mỗi ca."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng cách gom nhóm theo từng loại toán tử"
    checks:
      - "round(1 * 0.4 + 2 * 1.35 + 2 * 1.1 + 4 * 0.1, 2) == 5.7 == alg.hci_klm_time('HMPBBMPBB')"
      - "round(0.4 + 1.35 + 2 * 1.1, 2) == 3.95 == round(5.7 - 1.75, 2)"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Đếm tần suất từng chữ cái trong chuỗi <code>H M P BB M P BB</code> rồi nhân trọng số.</b> Thay vì cộng theo thứ tự thời gian, ta gom theo loại thao tác ($1H$, $2M$, $2P$, $4B$):</p>
          $$1 \cdot 0{,}4 + 2 \cdot 1{,}35 + 2 \cdot 1{,}1 + 4 \cdot 0{,}1 = 0{,}4 + 2{,}7 + 2{,}2 + 0{,}4 = 5{,}7\text{ s} \;\checkmark$$
        focus: [1, 2]
        say: "Ta tự kiểm tra bằng con đường gom nhóm theo từng loại ký hiệu thay vì cộng tuần tự theo thời gian. Vì chuỗi có 1 chữ H, 2 chữ M, 2 chữ P và 4 chữ B, cộng bốn tích lại ra đúng 5 phẩy 7 giây."
      - show: |
          <p><b>Kiểm tra 2 — Trừ trực tiếp hai chuỗi ký hiệu trước khi thay số.</b> Vì $BB = 2 \cdot 0{,}1 = 0{,}2\text{ s}$ đúng bằng $K = 0{,}2\text{ s}$, nên phần $(M + BB + BB)$ của chuột bằng đúng $(M + K + K) = 1{,}75\text{ s}$ của phím tắt:</p>
          $$T_{\text{chuột}} - T_{\text{phím tắt}} = H + M + 2P = 0{,}4 + 1{,}35 + 2 \cdot 1{,}1 = 3{,}95\text{ s} \;\checkmark$$
        focus: [1, 2]
        say: "Kiểm tra thứ hai: vì B B tốn 0 phẩy 2 giây bằng đúng một phím K, nên phần M cộng hai lần B B triệt tiêu với M cộng hai chữ K. Vậy phần thời gian chuột tốn thêm chính là 1 chữ H cộng 1 chữ M cộng 2 chữ P, bằng đúng 3 phẩy 95 giây."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi ước lượng thời gian bằng mô hình phím bấm"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Dùng mô hình KLM để ước lượng thời gian của người dùng mới hoặc tính cả lúc làm sai <b class="red">(mô hình chỉ đúng cho người thành thạo, thao tác thuần thục không lỗi)</b>
          <br><span class="note">Bài báo năm 1980 nêu rõ giả định: người dùng đã biết rõ phương pháp thực hiện và không mắc lỗi; muốn biết người mới học mất bao lâu thì phải làm kiểm thử khả dụng thật.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất rất quan trọng là đem con số của mô hình này đi báo cáo làm thời gian thao tác của khách hàng mới dùng lần đầu. Công thức này chỉ tính cho người dùng đã thành thạo và không mắc lỗi, chứ không đo được thời gian mò mẫm của người mới."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên cộng thao tác chuyển tay $H = 0{,}4\text{ s}$ khi biểu mẫu bắt đổi qua lại giữa gõ chữ và bấm chuột <b class="red">(mỗi lần rời bàn phím sang chuột rồi quay về bàn phím mất $2H = 0{,}8\text{ s}$)</b></div>
          $$\text{Gõ ô 1} \xrightarrow{H = 0{,}4\text{ s}} \text{Bấm chuột chọn ngày} \xrightarrow{H = 0{,}4\text{ s}} \text{Gõ ô 2} \;\implies\; \text{Mất không } 0{,}8\text{ s chỉ để chuyển tay}$$
        focus: [1, 2]
        say: "Lỗi thứ hai khi lập chuỗi tính toán là quên mất chữ H bằng 0 phẩy 4 giây mỗi khi người dùng phải rời tay khỏi bàn phím để nắm lấy chuột. Nếu giữa hai ô gõ chữ lại chèn một ô bắt buộc dùng chuột, người dùng sẽ mất hai lần chữ H là 0 phẩy 8 giây chỉ để chuyển tay."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhầm $B = 0{,}1\text{ s}$ là cả một cú nhấp chuột nên tính thiếu một nửa <b class="red">(0,1 s chỉ là nhấn xuống hoặc nhả ra; một cú nhấp chuột hoàn chỉnh là BB = 0,2 s)</b>
          <br><span class="note">Thao tác kéo–thả chuột gồm: trỏ tới vật ($P$), nhấn giữ ($B = 0{,}1\text{ s}$), kéo tới đích ($P$), rồi nhả nút chuột ($B = 0{,}1\text{ s}$).</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là tính một cú nhấp chuột chỉ bằng một chữ B tức 0 phẩy 1 giây. Trong bảng chuẩn, 0 phẩy 1 giây chỉ là nửa hành trình nhấn xuống hoặc nhả lên, nên một cú nhấp chuột luôn phải tính là B B bằng 0 phẩy 2 giây."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Xoá hết nút trên màn hình để ép mọi người dùng phím tắt vì thấy $1{,}75\text{ s} \lt 5{,}7\text{ s}$ <b class="red">(người mới không nhớ phím tắt sẽ bị kẹt cứng hoàn toàn)</b>
          <br><span class="note">Thiết kế tốt phục vụ cả hai nhóm: giữ nút bấm trực quan trên màn hình cho người mới, và mở thêm phím tắt cho người dùng hằng ngày.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư của người thiết kế quá mê tốc độ là nhìn thấy phím tắt nhanh gấp ba lần chuột nên xoá luôn nút bấm trên màn hình. Làm vậy khiến người mới không biết cách thao tác, nên nguyên tắc đúng là giữ nút bấm rõ ràng kèm chú thích phím tắt bên cạnh."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính thời gian chuỗi thao tác và chọn cách cải tiến biểu mẫu"
    checks:
      - "alg.hci_klm_time('HMPBB') == 3.05"
      - "alg.hci_klm_time('MK') == 1.55 and round(3.05 - 1.55, 2) == 1.50"
    steps:
      - show: |
          <p>Nhân viên nhập liệu vừa gõ xong số tiền vào ô nhập (hai tay đang ở trên bàn phím) và cần gửi biểu mẫu đi. Dùng bảng chuẩn $K = 0{,}2\text{ s}$, $B = 0{,}1\text{ s}$, $P = 1{,}1\text{ s}$, $H = 0{,}4\text{ s}$, $M = 1{,}35\text{ s}$ (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Thiết kế A bắt nhân viên chuyển tay sang chuột, định hướng, trỏ tới nút “Gửi” và nhấp chuột: hãy tính thời gian của chuỗi $H + M + P + BB$.</td></tr>
          <tr><td>2</td><td>Thiết kế B cho phép bấm thẳng phím <code>Enter</code> trên bàn phím để gửi (chuỗi $M + K$): hãy tính thời gian của thiết kế B và độ tiết kiệm so với A.</td></tr>
          <tr><td>3</td><td>Nếu đây là phần mềm thu ngân siêu thị mà nhân viên đều được đào tạo kỹ và bấm 500 đơn mỗi ngày, bạn ưu tiên tối ưu theo KLM không? Còn với ki-ốt bán vé tự động cho khách vãng lai lần đầu đứng bấm thì sao?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự ước lượng thời gian cho bước gửi biểu mẫu sau khi nhân viên vừa gõ xong số tiền trên bàn phím. Câu một, tính tổng thời gian của thiết kế A dùng chuột theo chuỗi H cộng M cộng P cộng B B. Câu hai, tính thời gian của thiết kế B cho phép bấm thẳng một phím xác nhận trên bàn phím theo chuỗi M cộng K và tìm phần thời gian tiết kiệm được. Câu ba, quyết định xem ưu tiên mô hình này cho quầy thu ngân chuyên nghiệp hay cho ki-ốt khách vãng lai. Bạn hãy dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước tính</th><th>đáp số</th></tr>
          <tr><td>1. Thiết kế A ($H + M + P + BB$)</td><td>$0{,}4 + 1{,}35 + 1{,}1 + (0{,}1 + 0{,}1)$</td><td>$\mathbf{3{,}05}\text{ s}$</td></tr>
          <tr><td>2. Thiết kế B ($M + K$)</td><td>$1{,}35 + 0{,}2 = 1{,}55\text{ s}$ → tiết kiệm $3{,}05 - 1{,}55$</td><td>$\mathbf{1{,}55}\text{ s}$ (nhanh hơn $\mathbf{1{,}50}\text{ s}$, giảm gần một nửa)</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Ở câu một, chuỗi H cộng M cộng P cộng B B bằng 0 phẩy 4 cộng 1 phẩy 35 cộng 1 phẩy 1 cộng 0 phẩy 2, ra đúng 3 phẩy 05 giây. Ở câu hai, chuỗi M cộng K chỉ mất 1 phẩy 35 cộng 0 phẩy 2 bằng 1 phẩy 55 giây, giúp tiết kiệm đúng 1 phẩy 50 giây ở mỗi đơn."
      - show: |
          <table class="t"><tr><th>bối cảnh ở câu 3</th><th>quyết định áp dụng KLM</th></tr>
          <tr><td>Quầy thu ngân siêu thị (nhân viên thành thạo, 500 đơn/ngày)</td><td><b class="green">✓ Rất phù hợp</b> — người dùng đã thuần thục; tiết kiệm $1{,}5\text{ s} \times 500 = 750\text{ s}$ ($12{,}5$ phút) mỗi ngày cho mỗi quầy</td></tr>
          <tr><td>Ki-ốt bán vé cho khách vãng lai dùng 1 lần</td><td><b class="red">Không lấy KLM làm thước đo chính</b> — khách vãng lai là người mới nên cần nút bấm to, tự giải thích và chống bấm nhầm hơn là phím tắt</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở câu ba, với quầy thu ngân siêu thị lặp lại 500 đơn mỗi ngày, tối ưu theo mô hình phím bấm giúp tiết kiệm 12 phút rưỡi mỗi ca. Ngược lại, với ki-ốt bán vé cho khách vãng lai lần đầu chạm màn hình, ta phải ưu tiên bố cục dễ hiểu và kiểm thử với người thật."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic và vị trí của mô hình phím bấm trong quy trình thiết kế"
    steps:
      - show: |
          <div class="chain"><span class="n">bẻ nhỏ nhiệm vụ thành K, P, B, H, M</span><span class="a">→</span>
          <span class="n">chèn M trước mỗi cụm quyết định</span><span class="a">→</span>
          <span class="n">cộng trọng số chuẩn</span><span class="a">→</span>
          <span class="n">so sánh hai thiết kế trước khi viết mã</span></div>
        focus: [1, 1]
        say: "Tổng kết lại chuỗi logic của bài năm, mọi nhiệm vụ lặp lại của người dùng thành thạo đều bẻ nhỏ được thành các bước vật lý K, P, B, H kèm nhịp chuẩn bị tâm lý M. Chỉ bằng phép cộng các trọng số chuẩn trên giấy, ta so sánh được ngay hai luồng thiết kế chênh nhau bao nhiêu giây trước khi tốn công lập trình."
      - show: |
          <div class="box key"><b>Tư duy:</b> Hãy dùng mô hình cộng thao tác phím bấm để <b>sàng lọc nhanh trên giấy</b> các luồng thao tác lặp đi lặp lại của người làm việc chuyên nghiệp — và luôn nhớ nó chỉ đo <b>tốc độ khi đã thành thạo</b>, không đo độ dễ học.</div>
        focus: [1, 1]
        say: "Tư duy cần mang theo là hãy dùng mô hình này để phát hiện những chỗ bắt người dùng chuyển tay H hoặc trỏ chuột P thừa thãi. Đồng thời, đừng quên giới hạn của nó: muốn biết người mới có tự dùng được không và mắc lỗi ở đâu, ta phải đưa cho người thật dùng thử."
      - show: |
          <p class="note">Bài sau (bài 6): <b>Kiểm thử khả dụng: bao nhiêu người thử là đủ</b> — khi đưa giao diện cho người thật dùng thử để tìm lỗi thiết kế, vì sao thử theo từng vòng 5 người lại phát hiện được hơn 84% vấn đề?</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài sau, bài 6, ta bước sang phần kiểm thử khả dụng với người dùng thật để trả lời câu hỏi bao nhiêu người thử là đủ cho một vòng đánh giá. Ta sẽ tự tay tính công thức xác suất phát hiện lỗi thiết kế với 5 người và 15 người thử, hẹn gặp bạn ở bài tiếp theo."
