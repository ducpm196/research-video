scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "5,7 giây bằng chuột so với 1,75 giây bằng phím tắt: biết trước khi viết mã!"
    checks:
      - "alg.hci_klm_time('HMPBBMPBB') == 5.7"
      - "alg.hci_klm_time('MKK') == 1.75"
      - "round(5.7 - 1.75, 2) == 3.95"
    steps:
      - show: |
          <p>Bạn đang phân vân giữa hai luồng <b>xoá một tệp đã chọn</b> cho nhân viên xử lý hồ sơ lặp đi lặp lại hằng ngày (khi hai tay họ đang đặt sẵn trên bàn phím). Chưa cần viết mã hay dựng nguyên mẫu, mô hình KLM (Card, Moran, Newell 1980; ký hiệu $B$ theo Kieras 2001) cho ngay con số:</p>
          <table class="t"><tr><th>phương án thiết kế</th><th>chuỗi thao tác cơ sở</th><th>tổng thời gian ước lượng</th></tr>
          <tr><td>Cách 1: dùng chuột bấm biểu tượng thùng rác rồi bấm nút xác nhận</td><td>$H + M + P + BB + M + P + BB$</td><td>$\mathbf{5{,}7}\text{ s}$</td></tr>
          <tr><td>Cách 2: dùng tổ hợp hai phím tắt khi tay đang ở trên bàn phím</td><td>$M + K + K$</td><td>$\mathbf{1{,}75}\text{ s}$ (nhanh hơn $3{,}95\text{ s}$)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, giả sử bạn đang thiết kế tính năng xoá nhanh một tệp cho nhân viên xử lý hồ sơ khi tay họ đang đặt sẵn trên bàn phím. Theo mô hình cộng thao tác năm 1980, dùng chuột bấm thùng rác rồi bấm xác nhận mất 5 phẩy 7 giây. Trong khi đó, bấm tổ hợp hai phím tắt trên bàn phím chỉ mất đúng 1 phẩy 75 giây."
      - show: |
          <div class="box key">Hôm nay ta trả lời: các chữ cái $K, P, B, H, M$ có giá trị bao nhiêu giây? Đặt chữ $M$ (nhịp chuẩn bị trong đầu) theo quy tắc nào? Và vì sao mô hình này không dùng để đo người mới học?</div>
        focus: [1, 1]
        say: "Hôm nay ta trả lời ba câu hỏi thực hành. Năm thao tác K, P, B, H, M tốn bao nhiêu giây, chèn nhịp chuẩn bị M theo quy tắc nào, và vì sao mô hình này chỉ đo người thành thạo?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại phép cộng có trọng số và thời gian trỏ trung bình"
    checks:
      - "round(1 * 0.4 + 2 * 1.35 + 2 * 1.1 + 4 * 0.1, 2) == 5.7"
    steps:
      - show: |
          <p><b>① Cộng thời gian của một chuỗi bước nối tiếp:</b> nếu một công việc gồm nhiều bước làm nối tiếp nhau (không gối đầu), tổng thời gian bằng tổng thời gian của từng bước; hoặc gom theo số lần xuất hiện $c_i$ của từng loại thao tác có thời gian $w_i$:</p>
          $$T = \sum_{i} c_i \cdot w_i \qquad \text{ví dụ: } 1 \cdot 0{,}4 + 2 \cdot 1{,}35 + 2 \cdot 1{,}1 + 4 \cdot 0{,}1 = 5{,}7\text{ s}$$
        focus: [1, 2]
        say: "Trước hết ta ôn lại phép tính tổng thời gian của một chuỗi công việc nối tiếp nhau. Ta có thể cộng lần lượt từng bước từ đầu đến cuối, hoặc đếm xem mỗi loại thao tác xuất hiện mấy lần rồi nhân với thời gian chuẩn của loại đó và cộng lại."
      - show: |
          <p><b>② Từ định luật thời gian trỏ về hằng số trỏ trung bình $P = 1{,}1\text{ s}$.</b> Nhắc lại bài 2: thời gian đưa con trỏ tới một nút là $T = a + b \cdot \log_2(D/W + 1)$, với $D$ là khoảng cách tới tâm nút và $W$ là bề rộng nút — nút càng xa, càng hẹp thì càng lâu.</p>
          <p>Khi ước lượng nhanh cả quy trình mà chưa cố định toạ độ từng nút, ta lấy mức trung bình thực nghiệm $P = 1{,}1\text{ s}$ cho một lần di chuột tới đích.</p>
        focus: [1, 1, 2]
        say: "Điều thứ hai là sự kết nối với định luật thời gian trỏ ở bài 2. Nhắc lại, thời gian đưa con trỏ tới một nút tăng theo lôgarit cơ số 2 của khoảng cách chia bề rộng cộng 1, nên nút càng xa và càng hẹp thì càng lâu. Khi chưa cố định toạ độ từng nút trên màn hình, mô hình cộng thao tác dùng con số thực nghiệm trung bình là 1 phẩy 1 giây cho một lần trỏ chuột tới đích."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã 5 thao tác cơ sở K, P, B, H, M và thời gian chuẩn"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc là</th><th>thao tác cơ sở</th><th>thời gian chuẩn</th></tr>
          <tr><td>$K$</td><td>ca</td><td>gõ <b>1 phím</b> trên bàn phím (người gõ thành thạo mức trung bình)</td><td>$0{,}2\text{ s}$</td></tr>
          <tr><td>$B$</td><td>bê</td><td>nhấn xuống <b>hoặc</b> nhả ra nút chuột; một cú bấm–nhả chuột trọn vẹn là $BB$ (cách tính hay dùng về sau; bài báo năm 1980 tính một cú bấm chuột là một $K = 0{,}2$ s, cùng kết quả)</td><td>$0{,}1\text{ s}$ ($BB = 0{,}2\text{ s}$)</td></tr>
          <tr><td>$P$</td><td>pê</td><td>di chuyển con trỏ chuột tới một đích trên màn hình</td><td>$1{,}1\text{ s}$</td></tr>
          <tr><td>$H$</td><td>hát</td><td>chuyển bàn tay giữa bàn phím và chuột (<i>homing</i>)</td><td>$0{,}4\text{ s}$</td></tr>
          <tr><td>$M$</td><td>em-mờ</td><td>nhịp chuẩn bị tâm lý (nghĩ/định hướng ngắn trước một cụm hành động)</td><td>$1{,}35\text{ s}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.6"]
        say: "Bảng này giải mã năm ký hiệu thao tác cơ sở, trong đó bốn giá trị K, P, H, M lấy từ bài báo năm 1980, còn B là cách tính hay dùng về sau. Chữ K là gõ một phím trên bàn phím mất 0 phẩy 2 giây. Chữ B là nhấn hoặc nhả nút chuột mất 0 phẩy 1 giây, nên một cú nhấp chuột gồm nhấn rồi nhả được viết là B B bằng 0 phẩy 2 giây. Chữ P là trỏ chuột mất 1 phẩy 1 giây, còn chữ H là chuyển tay giữa bàn phím và chuột mất 0 phẩy 4 giây. Cuối cùng, chữ M là nhịp chuẩn bị tâm lý trong đầu mất 1 phẩy 35 giây."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Băng thời gian của hai phương án: vì sao chuột mất tới 5,7 giây?"
