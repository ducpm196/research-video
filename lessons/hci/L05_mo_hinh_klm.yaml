          <text x="60" y="55" text-anchor="start" font-weight="bold" fill="#991b1b">Cách 1 — Xoá bằng chuột: H + M + P + BB + M + P + BB = 5,70 s</text>
          <rect x="60" y="75" width="88" height="70" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="104" y="106" font-weight="bold">H</text><text x="104" y="132" font-size="17">0,4 s</text>
          <rect x="148" y="75" width="297" height="70" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="296" y="106" font-weight="bold">M (nghĩ)</text><text x="296" y="132" font-size="17">1,35 s</text>
          <rect x="445" y="75" width="242" height="70" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="566" y="106" font-weight="bold">P (trỏ)</text><text x="566" y="132" font-size="17">1,1 s</text>
          <rect x="687" y="75" width="44" height="70" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="709" y="106" font-weight="bold">BB</text><text x="709" y="132" font-size="16">0,2</text>
