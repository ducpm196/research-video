          <rect x="1028" y="75" width="242" height="70" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="1149" y="106" font-weight="bold">P (trỏ)</text><text x="1149" y="132" font-size="17">1,1 s</text>
          <rect x="1270" y="75" width="44" height="70" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="1292" y="106" font-weight="bold">BB</text><text x="1292" y="132" font-size="16">0,2</text>
          <text x="1375" y="118" font-weight="bold" fill="#991b1b">= 5,70 s</text>
          <text x="60" y="215" text-anchor="start" font-weight="bold" fill="#065f46">Cách 2 — Xoá bằng phím tắt (tay đang ở bàn phím): M + K + K = 1,75 s</text>
          <rect x="60" y="235" width="297" height="70" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><text x="208" y="266" font-weight="bold">M (nghĩ)</text><text x="208" y="292" font-size="17">1,35 s</text>
          <rect x="357" y="235" width="44" height="70" fill="#6ee7b7" stroke="#047857" stroke-width="2"/><text x="379" y="266" font-weight="bold">K</text><text x="379" y="292" font-size="16">0,2</text>
          <rect x="401" y="235" width="44" height="70" fill="#6ee7b7" stroke="#047857" stroke-width="2"/><text x="423" y="266" font-weight="bold">K</text><text x="423" y="292" font-size="16">0,2</text>
          <text x="465" y="278" text-anchor="start" font-weight="bold" fill="#065f46">= 1,75 s (tiết kiệm 3,95 s mỗi lần)</text>
