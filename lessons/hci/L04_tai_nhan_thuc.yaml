scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng là 6 chữ số, vì sao 482 913 dễ đọc chép hơn hẳn 482913?"
    checks:
      - "alg.hci_chunks('482913') == (6, 1) and len('482913') == 6"
      - "alg.hci_chunks('482 913') == (6, 2)"
    steps:
      - show: |
          <p>Điện thoại nhận tin nhắn mã xác thực một lần rồi bạn phải chuyển sang ứng dụng ngân hàng để gõ lại. So sánh ba cách hiển thị chuỗi ký tự phải nhớ tạm trong đầu:</p>
          <table class="t"><tr><th>chuỗi hiển thị</th><th>số ký tự rời</th><th>số nhóm trong trí nhớ làm việc</th><th>mức tải nhận thức</th></tr>
          <tr><td><code>482913</code> (viết liền)</td><td>$6$ chữ số</td><td>$6$ đơn vị rời (hoặc tự tách bằng mắt)</td><td>dễ nhầm thứ tự chữ số giữa</td></tr>
          <tr><td><code>482 913</code> (tách giữa)</td><td>$6$ chữ số</td><td><b>2 nhóm</b> ba chữ số</td><td>nhớ nhẹ nhàng trong một lần nhìn</td></tr>
          <tr><td><code>K9Q7X2M8P4W5</code> (12 ký tự ngẫu nhiên)</td><td>$12$ ký tự</td><td>vượt quá khoảng <b>4 nhóm</b> giữ được</td><td>phải chuyển qua lại nhiều lần</td></tr></table>
        focus: ["2.2", "2.3", "2.4"]
        say: "Chào bạn, khi nhận một mã xác thực gồm 6 chữ số để gõ sang màn hình khác, chuỗi viết liền 4 8 2 9 1 3 bắt mắt bạn phải giữ 6 chữ số rời rạc. Chỉ cần thêm một khoảng trắng ở giữa thành 482 và 913, 6 chữ số đó gom lại còn đúng 2 nhóm nên đọc lướt một lần là nhớ ngay. Còn nếu hệ thống bắt chép tay một chuỗi 12 ký tự ngẫu nhiên không gom nhóm được, nó vượt xa sức chứa khoảng 4 nhóm của trí nhớ làm việc."
      - clear: true
        show: |
          <div class="box key">Hôm nay ta trả lời: trí nhớ làm việc giữ được bao nhiêu nhóm? Gom nhóm làm giảm số đơn vị phải nhớ thế nào? Và vì sao con số “7 cộng trừ 2” không phải là quy tắc cấm thực đơn có quá 7 mục?</div>
        focus: [1, 1]
        say: "Hôm nay ta trả lời ba câu hỏi thiết thực. Trí nhớ làm việc giữ được mấy nhóm, kỹ thuật gom nhóm giảm tải nhận thức ra sao, và vì sao con số 7 cộng trừ 2 không cấm thực đơn quá 7 mục?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại phép chia nhóm đều và hai cách lấy thông tin của não"
    checks:
      - "6 // 3 == 2 and 16 // 4 == 4 and 10 // 3 == 3"
    steps:
      - show: |
          <p><b>① Chia một chuỗi dài $L$ ký tự thành các cụm nhỏ độ dài $k$.</b> Khi $L$ chia hết cho $k$, số cụm phải giữ trong đầu giảm từ $L$ xuống đúng $L / k$:</p>
          $$L = 6,\; k = 3 \;\implies\; \frac{6}{3} = 2\text{ nhóm}, \qquad L = 16,\; k = 4 \;\implies\; \frac{16}{4} = 4\text{ nhóm}$$
        focus: [1, 2, 2]
        say: "Trước hết ta ôn lại phép chia một chuỗi dài L ký tự thành các cụm nhỏ có độ dài k ký tự. Khi L chia hết cho k, số cụm mà đầu óc phải quản lý giảm từ L xuống còn L chia k. Ví dụ chuỗi 6 chữ số chia mỗi cụm 3 số thì còn 6 chia 3 bằng 2 nhóm, và số thẻ ngân hàng 16 chữ số chia mỗi cụm 4 số thì còn đúng 4 nhóm."
      - show: |
          <p><b>② Tự nhớ lại trong đầu khác hẳn với nhìn thấy rồi nhận ra trên màn hình:</b></p>
          <table class="t"><tr><th>cơ chế</th><th>người dùng phải làm gì</th><th>ví dụ trên phần mềm</th></tr>
          <tr><td>tự nhớ lại (<i>recall</i>)</td><td>tự lục tìm dữ liệu từ trí nhớ mà không có gợi ý trước mắt</td><td>bắt gõ lại tên tệp hoặc mã đơn hàng từ màn hình trước</td></tr>
          <tr><td>nhận ra (<i>recognition</i>)</td><td>nhìn danh sách đang hiện sẵn trên màn hình và chọn mục đúng</td><td>hiện danh sách tệp vừa mở để bấm chọn ngay</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai cần phân biệt rõ là việc tự nhớ lại trong đầu và việc nhìn thấy rồi nhận ra trên màn hình. Tự nhớ lại bắt não phải lục tìm thông tin trong khoảng trống mà không có gợi ý nào, như bắt gõ lại mã đơn hàng từ trang trước. Ngược lại, nhận ra là khi giao diện bày sẵn danh sách trước mắt để người dùng nhìn thấy và chọn ngay."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: trí nhớ làm việc, đơn vị gom nhóm, 7 ± 2, 4 ± 1 và tải nhận thức"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm / ký hiệu</th><th>đọc là</th><th>nghĩa trong tương tác người–máy</th></tr>
          <tr><td>trí nhớ làm việc (<i>working memory</i>)</td><td>trí nhớ làm việc</td><td>bộ đệm tạm thời giữ vài mẩu thông tin trong vài giây khi đang làm một việc</td></tr>
          <tr><td>nhóm / cụm (<i>chunk</i>)</td><td>nhóm thông tin</td><td>một đơn vị có nghĩa hoặc một cụm ký tự ngắn được não gom lại như một khối duy nhất</td></tr>
          <tr><td>$7 \pm 2$ (Miller, 1956)</td><td>bảy cộng trừ hai</td><td>khoảng nhớ tức thời từ $5$ đến $9$ đơn vị trong thí nghiệm đọc chép chuỗi khi có tự nhẩm</td></tr>
          <tr><td>$4 \pm 1$ (Cowan, 2001)</td><td>bốn cộng trừ một</td><td>sức chứa thuần tuý khoảng $3$ đến $5$ nhóm của trí nhớ làm việc khi không được nhẩm lặp lại</td></tr>
          <tr><td>tải nhận thức (<i>cognitive load</i>)</td><td>tải nhận thức</td><td>tổng công sức trí óc mà người dùng phải bỏ ra để giữ thông tin và suy tính trên giao diện</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng này giải mã các thuật ngữ về trí nhớ và tải nhận thức. Trí nhớ làm việc là bộ đệm rất nhỏ trong đầu, chỉ giữ tạm vài thông tin trong lúc ta đang thao tác. Nhóm thông tin là một cụm ký tự hoặc một từ có nghĩa được não đóng gói thành một khối duy nhất. Dấu cộng trừ đọc là cộng trừ: con số 7 cộng trừ 2 là khoảng nhớ khi có tự nhẩm, còn sức chứa thuần tuý chỉ khoảng 4 cộng trừ 1 nhóm. Tổng công sức mà bộ đệm này phải gánh gọi là tải nhận thức."

