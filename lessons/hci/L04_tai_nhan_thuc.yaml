  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Đếm số nhóm thông tin và điều kiện không vượt ngưỡng 4 nhóm"
    checks:
      - "alg.hci_chunks('482913') == (6, 1) and alg.hci_chunks('482 913') == (6, 2)"
      - "12 > 4 and 2 <= 4"
    steps:
      - show: |
          <p><b>Bước 1 — Phân biệt tổng số ký tự $L$ với số nhóm $C$ (Miller 1956, Cowan 2001).</b> Sức chứa của trí nhớ làm việc bị chặn bởi số nhóm $C \le 4$ (hoặc $4 \pm 1$), chứ không phải tổng số ký tự $L$:</p>
          $$\text{Mỗi nhóm gồm } k \text{ ký tự dễ đọc} \;\implies\; \text{Số nhóm phải nhớ } C = \frac{L}{k}$$
        focus: [1, 2]
        say: "Bước một, ta viết mối liên hệ toán học giữa tổng số ký tự L và số nhóm C mà trí nhớ làm việc phải giữ. Vì bộ đệm ngắn hạn bị chặn bởi số nhóm C nhỏ hơn hoặc bằng 4, khi đóng gói mỗi nhóm k chữ số dễ đọc thì suy ra số nhóm C giảm xuống còn L chia k."
      - show: |
          <p><b>Bước 2 — Điều kiện độ dài mỗi nhóm $k$ để bản thân nhóm không bị vỡ.</b> Một nhóm chỉ đóng gói thành 1 đơn vị khi bản thân nó có $k \le 3$ hoặc $k \le 4$ ký tự quen thuộc:</p>
          $$k \in \{3, 4\} \quad \text{và} \quad C = \frac{L}{k} \le 4 \;\implies\; \text{người dùng đọc chép được trong 1–2 lượt nhìn}$$
        introduces: [in, set]
        focus: [1, 2]
        say: "Bước hai, ta không thể gom bừa cả 12 chữ số vào làm một nhóm duy nhất vì bản thân nhóm đó quá dài sẽ tự vỡ ra. Ký hiệu thuộc và cặp ngoặc nhọn chỉ tập hợp: khi độ dài k thuộc tập 3 hoặc 4 và số nhóm C không quá 4, suy ra người dùng giữ gọn trong đầu."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Kiểm tra mã 6 chữ số, chuỗi 12 ký tự ngẫu nhiên và số thẻ 16 chữ số"
    checks:
      - "alg.hci_chunks('482913')[0] == 6 and alg.hci_chunks('482 913') == (6, 2)"
      - "alg.hci_chunks('K9Q7X2M8P4W5')[0] == 12 and 12 > 4"
      - "alg.hci_chunks('4829 1305 7741 9026') == (16, 4)"
    steps:
      - show: |
          <p><b>Bước 1 — Mã xác thực 6 chữ số <code>482913</code> so với <code>482 913</code>.</b></p>
          $$\text{Để rời 6 chữ số: } 6\text{ đơn vị} \gt 4 \qquad \xrightarrow{\text{tách 3 + 3}} \qquad \text{Còn } \frac{6}{3} = \hlg{2}\text{ nhóm} \le 4 \;\checkmark$$
        focus: [1, 2]
        say: "Ta kiểm tra từng trường hợp trong giáo án bằng con số cụ thể. Ở bước một, mã 6 chữ số để rời là 6 đơn vị vượt quá 4, nhưng tách thành hai cụm 482 và 913 thì chỉ còn 6 chia 3 bằng 2 nhóm, nhỏ hơn 4."
      - show: |
          <p><b>Bước 2 — Chuỗi 12 ký tự ngẫu nhiên lẫn chữ và số <code>K9Q7X2M8P4W5</code>.</b> Vì chữ cái và chữ số xen kẽ không tạo thành âm đọc được như số có ba chữ số, mỗi ký tự vẫn là 1 đơn vị rời:</p>
          $$\text{Số đơn vị phải nhớ} = \hl{12}\text{ đơn vị} \;\gt\; 4\text{ nhóm (vượt gấp 3 lần sức chứa trí nhớ làm việc)}$$
        focus: [1, 2]
        say: "Bước hai, xét một mã kích hoạt gồm 12 ký tự ngẫu nhiên trộn lẫn chữ cái và chữ số. Vì chữ xen số ngẫu nhiên không ghép thành nhịp quen thuộc được, người dùng phải nhớ đủ 12 đơn vị rời, vượt gấp 3 lần ngưỡng 4 nhóm nên phải có nút sao chép."
      - clear: true
        show: |
          <p><b>Bước 3 — Số thẻ thanh toán 16 chữ số <code>4829 1305 7741 9026</code>.</b> Thay vì một ô nhập 16 chữ số liền nhau, tách thành 4 cụm 4 chữ số:</p>
          $$\text{Tổng } 16\text{ chữ số} \xrightarrow{\text{tách 4 cụm 4 số}} C = \frac{16}{4} = \hlb{4}\text{ nhóm (mỗi lượt mắt đối chiếu 1 nhóm 4 số)}$$
        focus: [1, 2]
        say: "Bước ba, xét số thẻ thanh toán gồm 16 chữ số trên các trang mua hàng. Khi tách bằng khoảng trắng thành 4 cụm 4 chữ số, tổng số nhóm bằng 16 chia 4 là 4 nhóm, giúp mắt dễ dàng đối chiếu từng cụm 4 số với thẻ nhựa trên tay."
      - clear: true
        show: |
          <p><b>Bước 4 — Giảm số đơn vị phải nhớ về $0$ bằng cách chuyển từ “ghi nhớ” sang “nhận ra”.</b></p>
          <table class="t"><tr><th>tác vụ của người dùng</th><th>thiết kế bắt ghi nhớ (tải cao)</th><th>thiết kế cho nhận ra (tải $\approx 0$)</th></tr>
          <tr><td>nhập mã xác thực 6 số</td><td>tự đọc từ tin nhắn rồi qua ứng dụng gõ lại ($2$ nhóm)</td><td>hệ điều hành hiện nút <b>“Tự điền mã 482 913”</b> ngay trên bàn phím ($0$ nhóm)</td></tr>
          <tr><td>so sánh 2 sản phẩm</td><td>mở trang A nhớ 5 thông số, rồi mở trang B tự so trong đầu ($5$ đơn vị)</td><td>đặt bảng 2 cột A và B cạnh nhau trên cùng màn hình ($0$ đơn vị phải nhớ)</td></tr></table>
        focus: ["2.2", "2.3"]
        say: "Bước bốn là bước tiến cao nhất trong thiết kế: đưa số nhóm người dùng phải nhớ về đúng bằng 0. Thay vì bắt người dùng tự nhớ mã xác thực hay nhớ 5 thông số ở trang trước, giao diện hiện nút tự điền mã hoặc đặt bảng hai cột cạnh nhau để mắt nhìn và nhận ra."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng đếm ký tự, đếm nhóm và câu hỏi kiểm tra giao diện"
    checks:
      - "alg.hci_chunks('0912345678') == (10, 1) and alg.hci_chunks('0912 345 678') == (10, 3) and 4 + 3 + 3 == 10"
      - "alg.hci_chunks('482-913') == (6, 2)"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Bảo toàn tổng số chữ số khi tách nhóm số điện thoại 10 số.</b> Chuỗi <code>0912345678</code> ($10$ chữ số rời) khi tách thành <code>0912 345 678</code>:</p>
          $$\text{Tổng chữ số} = 4 + 3 + 3 = 10\text{ chữ số}, \qquad \text{Số nhóm } C = 3\text{ nhóm} \le 4 \;\checkmark$$
        focus: [1, 2]
        say: "Ta tự kiểm tra bằng phép bảo toàn số chữ số trên một số điện thoại 10 số. Vì tách thành cụm 4 số và hai cụm 3 số nên tổng vẫn là 10 chữ số, nhưng chỉ còn 3 nhóm phải nhớ."
      - show: |
          <p><b>Kiểm tra 2 — Phép thử phát hiện tải nhận thức thừa giữa hai màn hình.</b> Mỗi khi người dùng chuyển từ màn hình 1 sang màn hình 2, hãy đếm số mẩu thông tin họ buộc phải mang theo trong đầu:</p>
          $$\text{Số nhóm phải mang theo qua màn hình mới} = 0 \;\implies\; \text{Thiết kế đạt chuẩn nhận ra thay vì bắt nhớ}$$
        focus: [1, 2]
        say: "Kiểm tra thứ hai là phép thử thực hành cho mọi luồng nhiều bước. Khi chuyển sang màn hình hai, vì màn hình mới đã hiện lại đủ thông tin nên số nhóm phải mang theo bằng 0."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp về con số 7 ± 2 và tải nhận thức trên biểu mẫu"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Biến con số “$7 \pm 2$” của Miller thành quy tắc “thực đơn trên màn hình chỉ được có tối đa 7 mục” <b class="red">(sai bản chất — 7 ± 2 là giới hạn nhớ trong đầu khi không được nhìn, còn thực đơn đang hiện sờ sờ trên màn hình)</b>
          <br><span class="note">Thực đơn trên màn hình dùng cơ chế <b>nhận ra</b> và định luật thời gian chọn ở bài 3, không bắt người dùng nhắm mắt đọc thuộc lòng danh sách.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất là hiểu lầm nổi tiếng nhất trong ngành giao diện: biến con số 7 cộng trừ 2 trong bài báo năm 1956 thành quy tắc cấm thanh thực đơn có quá 7 mục. Con số 7 cộng trừ 2 là giới hạn nhớ trong đầu khi cất giấy đi, còn thực đơn nằm ngay trên màn hình nên có 15 mục rõ ràng vẫn dùng tốt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Ô nhập số thẻ 16 chữ số hoặc số điện thoại tự động xoá sạch khoảng trắng của người dùng <b class="red">(bắt người dùng đếm từng chữ số trong một chuỗi 16 số dính liền)</b></div>
          $$\text{Gõ } \texttt{4829 1305...} \implies \text{Màn hình giữ nhóm 4 số, máy tự lọc khoảng trắng}$$
        focus: [1, 2]
        say: "Lỗi thứ hai rất gây ức chế trên các biểu mẫu thanh toán là lập trình viên cấm gõ dấu cách trong ô số thẻ 16 chữ số để tiện lưu cơ sở dữ liệu. Cách làm đúng là trên màn hình phải tự động tách thành 4 nhóm 4 chữ số cho mắt người dễ dò, còn việc bỏ khoảng trắng là việc máy tính tự làm ở hậu trường."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng chữ gợi ý mờ bên trong ô nhập (<i>placeholder</i>) làm nhãn duy nhất của ô đó <b class="red">(vừa bấm vào gõ thì dòng chữ biến mất, người dùng phải tự nhớ ô này đang đòi định dạng gì)</b>
          <br><span class="note">Luôn giữ nhãn cố định phía trên ô nhập để người dùng nhìn thấy bất cứ lúc nào khi đang gõ hoặc kiểm tra lại.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là bỏ nhãn phía trên ô nhập liệu rồi nhét toàn bộ tên trường và yêu cầu định dạng vào dòng chữ mờ bên trong ô. Ngay khi người dùng bấm vào gõ ký tự đầu tiên, dòng chữ mờ biến mất, bắt trí nhớ làm việc phải tự nhớ xem ô này đang đòi định dạng gì."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Bắt người dùng tự nhớ mã lỗi hoặc số tham chiếu từ hộp thông báo rồi đóng hộp đó mới mở được trang hỗ trợ <b class="red">(vừa bấm “Đóng” là quên ngay chuỗi mã lỗi 8–10 ký tự)</b>
          <br><span class="note">Mọi mã tham chiếu phải đi kèm nút “Sao chép mã” hoặc tự động đính kèm sẵn khi bấm nút “Gửi yêu cầu hỗ trợ”.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư là hiện một hộp báo lỗi có mã tham chiếu dài rồi bắt người dùng đóng hộp đó mới mở được trang hỗ trợ. Vừa đóng hộp thoại lại là chuỗi mã kia bay khỏi trí nhớ làm việc, nên giao diện phải tự động đính kèm mã đó vào phiếu hỗ trợ."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: gom nhóm chuỗi số và sửa luồng bắt người dùng nhớ"
    checks:
      - "alg.hci_chunks('904182736512') == (12, 1) and alg.hci_chunks('9041 8273 6512') == (12, 3)"
      - "alg.hci_chunks('904 182 736 512') == (12, 4) and 3 <= 4"
    steps:
      - show: |
          <p>Một ứng dụng tra cứu vận đơn hiển thị mã đơn hàng gồm <b>12 chữ số</b> <code>904182736512</code> ở trang danh sách, rồi yêu cầu khách hàng sang trang “Khiếu nại” tự gõ lại mã đó vào ô trống (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Khi để nguyên chuỗi <code>904182736512</code> viết liền, có bao nhiêu chữ số rời và con số đó gấp mấy lần ngưỡng $4$ nhóm của trí nhớ làm việc?</td></tr>
          <tr><td>2</td><td>Nếu tách chuỗi 12 chữ số đó thành các nhóm có $k = 4$ chữ số (hoặc $k = 3$ chữ số) bằng khoảng trắng, số nhóm $C$ giảm xuống còn bao nhiêu?</td></tr>
          <tr><td>3</td><td>Làm thế nào để khách hàng chuyển từ trang danh sách vận đơn sang trang “Khiếu nại” mà số nhóm phải nhớ trong đầu bằng $0$?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn thực hành giảm tải nhận thức cho ứng dụng tra cứu vận đơn có mã đơn hàng gồm 12 chữ số. Câu một, khi để nguyên 12 chữ số viết liền, số đơn vị rời gấp mấy lần ngưỡng 4 nhóm của trí nhớ làm việc. Câu hai, tính số nhóm C khi tách mỗi cụm 4 chữ số hoặc mỗi cụm 3 chữ số. Câu ba, sửa lại luồng chuyển sang trang khiếu nại để số nhóm khách hàng phải nhớ trong đầu bằng 0. Bạn hãy dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước tính</th><th>đáp số</th></tr>
          <tr><td>1. Để liền 12 chữ số</td><td>$12$ chữ số rời chia cho ngưỡng $4$ nhóm: $12 / 4 = 3$</td><td><b>12 đơn vị</b> (vượt gấp <b>3 lần</b> ngưỡng 4 nhóm)</td></tr>
          <tr><td>2. Tách nhóm $k = 4$ hoặc $k = 3$</td><td><code>9041 8273 6512</code> → $C = 12 / 4 = 3$ nhóm; hoặc <code>904 182 736 512</code> → $C = 12 / 3 = 4$ nhóm</td><td>Còn <b>3 nhóm</b> (hoặc <b>4 nhóm</b>), đều $\le 4$</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Ta cùng đối chiếu đáp án câu một và câu hai. Ở câu một, để liền 12 chữ số tạo ra 12 đơn vị rời, chia cho 4 bằng 3, tức vượt gấp 3 lần sức chứa thuần tuý của trí nhớ làm việc. Ở câu hai, tách mỗi cụm 4 số được 12 chia 4 bằng 3 nhóm, hoặc tách mỗi cụm 3 số được 4 nhóm, đều không vượt quá 4."
      - show: |
          <table class="t"><tr><th>cách thiết kế ở câu 3</th><th>số nhóm khách hàng phải nhớ</th></tr>
          <tr><td>Bắt khách hàng tự chép hoặc tự nhớ mã sang trang Khiếu nại</td><td><b class="red">(sai)</b> Tốn $3$–$4$ nhóm nhớ và dễ gõ nhầm chữ số</td></tr>
          <tr><td>Đặt nút <b>“Khiếu nại đơn này”</b> ngay trên dòng vận đơn để trang sau <b>tự điền sẵn mã</b> <code>9041 8273 6512</code> (hoặc cho chọn từ danh sách đơn gần đây)</td><td><b class="green">✓ Đúng — 0 nhóm phải nhớ</b> (chuyển hoàn toàn từ ghi nhớ sang nhận ra)</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở câu ba, thay vì bắt khách hàng tự nhớ rồi gõ lại mã vận đơn, ta đặt nút khiếu nại ngay trên dòng đơn hàng để trang sau tự điền sẵn mã. Nếu khách hàng vào thẳng trang khiếu nại từ đầu, ta hiện danh sách các đơn gần đây kèm hình ảnh món hàng để họ nhìn và chọn ngay, đưa số nhóm phải nhớ về 0."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic và nguyên tắc giảm tải nhận thức"
    steps:
      - show: |
          <div class="chain"><span class="n">trí nhớ làm việc chỉ giữ khoảng 4 nhóm</span><span class="a">→</span>
          <span class="n">tách chuỗi dài thành cụm 3–4 ký tự</span><span class="a">→</span>
          <span class="n">bày sẵn thông tin trên màn hình</span><span class="a">→</span>
          <span class="n">nhận ra thay vì bắt ghi nhớ</span></div>
        focus: [1, 1]
        say: "Tổng kết lại chuỗi logic của bài bốn, vì trí nhớ làm việc rất hẹp và chỉ giữ được khoảng 4 nhóm, mọi chuỗi số dài đều phải tách thành cụm 3 đến 4 ký tự. Hơn thế nữa, bất cứ thông tin nào máy tính đã biết thì hãy bày sẵn lên màn hình để người dùng nhận ra thay vì bắt họ tự nhớ trong đầu."
      - show: |
          <div class="box key"><b>Tư duy:</b> Trí nhớ làm việc của người dùng là tài nguyên quý và hiếm nhất trong phiên thao tác — đừng tiêu xài nó vào việc nhớ mã số, nhớ định dạng ô nhập hay nhớ dữ liệu của trang trước.</div>
        focus: [1, 1]
        say: "Tư duy cần mang theo là hãy coi bốn khe nhớ trong đầu người dùng như tài nguyên quý giá nhất. Đừng bao giờ bắt người dùng lãng phí những khe nhớ đó vào việc giữ một dãy số hay nhớ xem ô nhập vừa xoá mất chữ gợi ý đang hỏi thông tin gì."
      - show: |
          <p class="note">Bài sau (bài 5): <b>Mô hình phím bấm KLM: ước lượng thời gian thao tác trước khi làm</b> — làm sao cộng thời gian chuyển tay, nghĩ, trỏ chuột và bấm phím để so sánh hai thiết kế ngay trên giấy trước khi viết một dòng mã nào?</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài sau, bài 5, ta sẽ ghép tất cả các thao tác cơ sở lại để ước lượng thời gian thao tác trước khi làm phần mềm. Ta sẽ tính ra bằng giây xem xoá một tệp bằng chuột hay bằng phím tắt chênh nhau bao nhiêu, hẹn gặp bạn ở bài tiếp theo."
