            <text x="278" y="155" fill="#7dd3fc" font-size="14" text-anchor="middle" font-weight="bold">24×24 (576 điểm ảnh²)</text>
            <text x="278" y="178" fill="#cbd5e1" font-size="13" text-anchor="middle">Đạt tối thiểu mức AA</text>

            <rect x="454" y="57" width="88" height="88" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2.5"/>
            <rect x="482" y="85" width="32" height="32" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
            <circle cx="498" cy="101" r="8" fill="none" stroke="#f8fafc" stroke-width="2"/>
            <text x="498" y="178" fill="#86efac" font-size="14" text-anchor="middle" font-weight="bold">44×44 (1936 điểm ảnh²)</text>
            <text x="498" y="198" fill="#cbd5e1" font-size="13" text-anchor="middle">Đệm 14 điểm ảnh mỗi phía (AAA)</text>
          </svg>
        focus: [1, 1, 1]
        say: "Nhiều nhà thiết kế lo ngại rằng làm nút 44 nhân 44 điểm ảnh sẽ khiến biểu tượng nhìn thô kệch và chiếm hết chỗ trên màn hình. Hình minh họa cho thấy giải pháp chuẩn xác: bạn hoàn toàn có thể giữ nguyên nét vẽ biểu tượng kính lúp 16 nhân 16 điểm ảnh ở chính giữa để đảm bảo thẩm mỹ. Sau đó, ta thêm vùng đệm trong suốt rộng 14 điểm ảnh về bốn phía để vùng nhận cảm ứng mở rộng thành 44 nhân 44 điểm ảnh."

  # ───────────────────────── 6. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Công thức kiểm tra vùng đích và độ giảm thời gian trỏ khi mở rộng nút"
    checks:
      - "alg.hci_wcag_target_ok(24, 24, 24) is True and alg.hci_wcag_target_ok(24, 20, 24) is False"
      - "round(alg.hci_fitts_id(200, 24) - alg.hci_fitts_id(200, 44), 3) == 0.751"
    steps:
      - show: |
          <p><b>Điều kiện đạt kích thước vùng đích tối thiểu $W_{\text{min}}$</b> (cả chiều rộng lẫn chiều cao đều phải đạt ngưỡng):</p>
          $$\text{Đạt theo kích thước}(W, H, W_{\text{min}}) \iff \left(W \ge W_{\text{min}}\right) \text{ và } \left(H \ge W_{\text{min}}\right)$$
          <p class="note">Tiêu chí 2.5.8 còn có ngoại lệ, ví dụ ngoại lệ khoảng cách: đích nhỏ hơn vẫn đạt nếu vòng tròn đường kính 24 điểm ảnh đặt giữa mỗi đích không chạm đích khác. Bài chỉ xét điều kiện kích thước.</p>
        focus: [1, 2, 3]
        say: "Theo điều kiện kích thước, một nút bấm đạt khi cả chiều rộng W lẫn chiều cao H đều lớn hơn hoặc bằng ngưỡng quy định. Vì phải thỏa mãn đồng thời cả hai chiều, nên một nút rộng 40 điểm ảnh nhưng chỉ cao 18 điểm ảnh không đạt điều kiện kích thước mức hai chữ A. Tiêu chí này còn có ngoại lệ, chẳng hạn đích nhỏ hơn vẫn đạt nếu được đặt đủ xa các đích khác, nhưng bài này chỉ xét điều kiện kích thước."
      - show: |
          <p><b>Độ tiết kiệm thời gian trỏ khi tăng bề rộng nút từ $W_1$ lên $W_2$</b> (tại cùng khoảng cách $D$):</p>
          $$T(D, W_1) - T(D, W_2) = b \times \left[\log_2\!\left(\frac{D}{W_1} + 1\right) - \log_2\!\left(\frac{D}{W_2} + 1\right)\right]$$
        focus: [1, 2]
        say: "Khi giữ nguyên khoảng cách di chuyển D và mở rộng nút từ W1 lên W2, hằng số khởi động a tự triệt tiêu khi lấy hiệu hai thời gian. Vì vậy, lượng thời gian tiết kiệm được bằng hệ số b nhân với phần giảm xuống của chỉ số độ khó theo lôgarit cơ số 2."

  # ───────────────────────── 7. VÍ DỤ SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ số: nâng cấp nút kính lúp 16×16 ở khoảng cách D = 200 điểm ảnh"
    checks:
      - "alg.hci_wcag_target_ok(16, 16, 24) is False"
      - "round(alg.hci_fitts_id(200, 16), 3) == 3.755 and round(alg.hci_fitts_time(200, 16, 0.1, 0.15), 3) == 0.663"
      - "round(alg.hci_fitts_id(200, 24), 3) == 3.222 and round(alg.hci_fitts_time(200, 24, 0.1, 0.15), 3) == 0.583"
      - "round(alg.hci_fitts_id(200, 44), 3) == 2.471 and round(alg.hci_fitts_time(200, 44, 0.1, 0.15), 3) == 0.471"
      - "round(0.583 - 0.471, 3) == 0.112"
    steps:
      - show: |
          <p><b>Bước 1 — kiểm tra nút gốc $16 \times 16$ cách con trỏ chuột $D = 200$ điểm ảnh</b> (hằng số của chuột, số minh hoạ: $a = 0{,}1\text{ s},\ b = 0{,}15\text{ s/bit}$):</p>
          $$W = 16 \lt 24 \implies \text{Vi phạm chuẩn 2.5.8}; \qquad ID_{16} = \log_2\!\left(\frac{200}{16} + 1\right) = \log_2(13{,}5) \approx 3{,}755\text{ bit}$$
          $$T_{16} = 0{,}1 + 0{,}15 \times 3{,}755 \approx \hlb{0{,}663\text{ s}}$$
        focus: [1, 2, 3]
        say: "Bước một, ta xét nút tìm kiếm 16 nhân 16 điểm ảnh nằm cách con trỏ chuột 200 điểm ảnh, với hằng số minh hoạ a bằng 0 phẩy 1 giây và b bằng 0 phẩy 15. Vì 16 nhỏ hơn 24 nên nút này vi phạm chuẩn tối thiểu và có độ khó 3 phẩy 755 bit. Thay vào công thức, mỗi lần trỏ tới nút mất khoảng 0 phẩy 663 giây."
      - clear: true
        show: |
          <p><b>Bước 2 — nâng lên mức tối thiểu AA ($W = 24\text{ điểm ảnh}$):</b></p>
          $$ID_{24} = \log_2\!\left(\frac{200}{24} + 1\right) = \log_2(9{,}333) \approx 3{,}222\text{ bit}$$
          $$T_{24} = 0{,}1 + 0{,}15 \times 3{,}222 \approx \hlb{0{,}583\text{ s}}$$
        focus: [1, 2, 3]
        say: "Bước hai, ta mở rộng vùng bấm lên 24 nhân 24 điểm ảnh để vừa đạt ngưỡng tối thiểu mức hai chữ A. Khi đó tỉ số 200 chia 24 cộng 1 còn khoảng 9 phẩy 333, lấy lôgarit cơ số 2 được 3 phẩy 222 bit. Thay vào công thức, thời gian trỏ giảm xuống còn 0 phẩy 583 giây."
      - clear: true
        show: |
          <p><b>Bước 3 — nâng lên mức tăng cường AAA ($W = 44\text{ điểm ảnh}$):</b></p>
          $$ID_{44} = \log_2\!\left(\frac{200}{44} + 1\right) = \log_2(5{,}545) \approx 2{,}471\text{ bit}$$
          $$T_{44} = 0{,}1 + 0{,}15 \times 2{,}471 \approx \hlg{0{,}471\text{ s}} \quad\implies\quad T_{24} - T_{44} = 0{,}583 - 0{,}471 = \hlg{0{,}112\text{ s}}$$
        focus: [1, 2, 3]
        say: "Bước ba, ta mở rộng vùng đệm lên 44 nhân 44 điểm ảnh theo mức tăng cường ba chữ A. Độ khó giảm xuống chỉ còn 2 phẩy 471 bit, kéo thời gian trỏ xuống còn 0 phẩy 471 giây. Như vậy chỉ riêng việc nâng từ 24 lên 44 điểm ảnh đã cắt giảm thêm 0 phẩy 112 giây, tức nhanh hơn gần 20 phần trăm."
      - clear: true
        show: |
          <p><b>Bước 4 — hoàn thiện bàn phím và nhãn đọc màn hình cho nút kính lúp:</b></p>
          <table class="t"><tr><th>hạng mục sửa</th><th>trước khi sửa (lỗi)</th><th>sau khi sửa (đạt chuẩn)</th></tr>
          <tr><td><b>vùng bấm</b></td><td>$16 \times 16$ điểm ảnh</td><td>biểu tượng $16 \times 16$ + đệm $14$ điểm ảnh mỗi bên = $44 \times 44$</td></tr>
          <tr><td><b>bàn phím</b></td><td>thẻ văn bản, ẩn viền tiêu điểm</td><td>phần tử nút chuẩn, nhận phím chuyển tiếp, viền sáng $2$ điểm ảnh</td></tr>
          <tr><td><b>trình đọc màn hình</b></td><td>không có nhãn chữ</td><td>gắn nhãn ngữ nghĩa: <b>“Tìm kiếm sản phẩm, nút bấm”</b></td></tr></table>
        focus: [1, "2.3", "2.4"]
        say: "Bước bốn, ta hoàn thiện hai trụ cột còn lại cho nút kính lúp này. Ta đổi thẻ văn bản giả làm nút sang phần tử nút bấm chuẩn để bàn phím tự động dừng lại khi người dùng bấm phím chuyển tiêu điểm, kèm đường viền sáng dày 2 điểm ảnh. Cuối cùng, ta gắn nhãn chữ Tìm kiếm sản phẩm để trình đọc màn hình phát âm rõ ràng ngay khi tiêu điểm chạm tới nút."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: tính trực tiếp hiệu độ khó và tỉ số diện tích"
    checks:
      - "round(0.15 * math.log2((200 / 24 + 1) / (200 / 44 + 1)), 3) == 0.113"
      - "44 * 44 == 1936 and 24 * 24 == 576 and round(1936 / 576, 2) == 3.36"
      - "round(alg.hci_fitts_time(200, 24, 0.1, 0.15) - alg.hci_fitts_time(200, 44, 0.1, 0.15), 4) == 0.1127"
    steps:
      - show: |
          <p><b>Đường kiểm 1 — tính thẳng độ giảm thời gian từ tỉ số hai biểu thức trong lôgarit:</b></p>
          $$ID_{24} - ID_{44} = \log_2\!\left(\frac{200/24 + 1}{200/44 + 1}\right) = \log_2\!\left(\frac{9{,}333}{5{,}545}\right) \approx 0{,}751\text{ bit} \implies 0{,}15 \times 0{,}751 \approx \hlg{0{,}113\text{ s}}\ \checkmark$$
          <p class="note">Bước ba ra $0{,}112$ vì trừ hai số đã làm tròn; giá trị chính xác là $\approx 0{,}1127$ s, nên hai cách khớp nhau tới phần nghìn giây.</p>
        focus: [1, 2, 3]
        say: "Đường kiểm thứ nhất, thay vì tính rời từng thời gian rồi trừ đi nhau, ta lấy lôgarit cơ số 2 của tỉ số 9 phẩy 333 chia 5 phẩy 545. Vì hiệu độ khó bằng 0 phẩy 751 bit, nhân với 0 phẩy 15 giây mỗi bit ta được khoảng 0 phẩy 113 giây. Bước ba ra 0 phẩy 112 chỉ vì trừ hai số đã làm tròn, còn giá trị chính xác xấp xỉ 0 phẩy 1127 giây, nên hai cách khớp nhau."
      - show: |
          <p><b>Đường kiểm 2 — đối chiếu diện tích vùng nhận chạm theo bình phương cạnh:</b></p>
          $$\frac{S_{44}}{S_{24}} = \left(\frac{44}{24}\right)^2 = \frac{1936}{576} \approx \hlb{3{,}36\text{ lần}}; \qquad \frac{S_{44}}{S_{16}} = \left(\frac{44}{16}\right)^2 = \frac{1936}{256} = \hlg{7{,}5625\text{ lần}}$$
        focus: [1, 2]
        say: "Đường kiểm thứ hai, vì vùng bấm là hình vuông nên diện tích nhận chạm tăng theo bình phương của cạnh. Nâng cạnh từ 24 lên 44 điểm ảnh giúp diện tích tăng từ 576 lên 1936 điểm ảnh vuông, rộng gấp 3 phẩy 36 lần nên giảm hẳn lỗi bấm trượt."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Bẫy thường gặp: xoá viền tiêu điểm, bẫy bàn phím và nhãn hình ảnh thừa chữ"
    checks:
      - "alg.hci_wcag_target_ok(48, 18, 24) is False"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Xoá sạch viền tiêu điểm bàn phím vì chê “viền xanh nhìn xấu” <b class="red">(làm người dùng bàn phím mù vị trí)</b>
          <br><span class="note">Khi người dùng bấm phím chuyển tiếp mà không thấy vệt sáng ở đâu, họ không biết bấm phím kích hoạt sẽ mở hay xoá mục nào. Phép sửa: chỉ ẩn viền khi bấm chuột, nhưng <b>bắt buộc hiện viền dày và rõ khi di chuyển bằng bàn phím</b>.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất cực kỳ phổ biến ở người đã đi làm là dùng một dòng lệnh xóa sạch viền tiêu điểm mặc định vì chê viền xanh quanh nút nhìn kém sang trọng. Khi mất viền này, người điều hướng bằng bàn phím hoàn toàn không biết mình đang đứng ở nút Lưu hay nút Xóa dữ liệu. Cách sửa chuẩn là chỉ tắt viền khi người dùng nhấp chuột, nhưng luôn bật viền tương phản rõ rệt khi họ di chuyển bằng bàn phím."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Hộp thoại nổi xử lý bàn phím sai và gắn nhãn lặp từ “hình ảnh / nút bấm”
          <br><span class="note">• <b>Bẫy bàn phím</b> (tiêu điểm bị kẹt, không thoát ra được): mở hộp thoại lên nhưng không đóng được bằng phím, ví dụ phím thoát không có tác dụng.<br>• <b>Lạc tiêu điểm</b> (lỗi ngược lại): quên giữ tiêu điểm trong hộp thoại nên nó trôi ra nền phía sau đang bị che.<br>• <b>Nhãn thừa:</b> đặt nhãn là “Nút tìm kiếm” khiến máy đọc lặp thành <i>“Nút tìm kiếm, nút bấm”</i> (chỉ cần đặt nhãn <b>“Tìm kiếm”</b>).</span></div>
        focus: [1, 1, 1, 1, 1]
        say: "Lỗi thứ hai là hộp thoại nổi xử lý bàn phím sai. Nếu không đóng được bằng phím, ví dụ phím thoát không có tác dụng, người dùng bàn phím bị kẹt lại, đó gọi là bẫy bàn phím. Ngược lại, nếu quên giữ tiêu điểm bên trong hộp thoại, tiêu điểm sẽ trôi ra nền phía sau đang bị che. Ngoài ra, nhiều người gắn nhãn cho nút là Nút tìm kiếm, khiến trình đọc màn hình đọc lặp thành Nút tìm kiếm, nút bấm. Bạn chỉ cần ghi đúng động từ chức năng là Tìm kiếm, vì vai trò nút bấm đã được hệ thống tự động đọc kèm."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: kiểm tra chuẩn kích thước đích và sửa nút đóng hộp thoại"
    checks:
      - "alg.hci_wcag_target_ok(32, 20, 24) is False"
      - "round(alg.hci_fitts_time(160, 20, 0.1, 0.15) - alg.hci_fitts_time(160, 40, 0.1, 0.15), 3) == 0.127"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Một thẻ chọn danh mục có chiều rộng $W = 32$ điểm ảnh và chiều cao $H = 20$ điểm ảnh. Thẻ này có đạt chuẩn kích thước tối thiểu mức AA ($24 \times 24$) không? Cần thêm đệm tối thiểu mấy điểm ảnh?</td></tr>
          <tr><td>2</td><td>Với khoảng cách $D = 160$ điểm ảnh ($a = 0{,}1\text{ s},\ b = 0{,}15\text{ s/bit}$), tăng bề rộng nút từ $W_1 = 20$ lên $W_2 = 40$ điểm ảnh giúp tiết kiệm bao nhiêu giây?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự luyện. Câu một, một thẻ chọn rộng 32 điểm ảnh nhưng cao 20 điểm ảnh có đạt chuẩn 24 nhân 24 không, và cần thêm đệm tối thiểu mấy điểm ảnh? Câu hai, ở khoảng cách 160 điểm ảnh, tăng bề rộng nút từ 20 lên 40 điểm ảnh giúp giảm bao nhiêu giây thời gian trỏ? Dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> Dù $W = 32 \ge 24$, nhưng chiều cao $H = 20 \lt 24$ nên <b>không đạt điều kiện kích thước</b> (chỉ còn cách đạt qua ngoại lệ khoảng cách):</p>
          $$\text{Cần tăng chiều cao thêm tối thiểu } 24 - 20 = \hlg{4\text{ điểm ảnh}}\ (\text{đệm trên } 2 + \text{đệm dưới } 2)$$
        focus: [1, 2]
        say: "Đáp án câu một, dù chiều rộng 32 đã vượt ngưỡng 24, nhưng chiều cao 20 điểm ảnh nhỏ hơn 24 nên thẻ này không đạt chuẩn. Ta cần cộng thêm tối thiểu 4 điểm ảnh chiều cao, tức thêm đệm trên 2 điểm ảnh và đệm dưới 2 điểm ảnh để đạt 32 nhân 24."
      - clear: true
        show: |
          <p><b>Đáp án câu 2.</b> Tại $D = 160$ điểm ảnh, ta tính độ khó ở $W_1 = 20$ và $W_2 = 40$:</p>
          $$ID_{20} = \log_2\!\left(\frac{160}{20} + 1\right) = \log_2(9) \approx 3{,}170\text{ bit} \implies T_{20} \approx 0{,}575\text{ s}$$
          $$ID_{40} = \log_2\!\left(\frac{160}{40} + 1\right) = \log_2(5) \approx 2{,}322\text{ bit} \implies T_{40} \approx 0{,}448\text{ s}$$
          $$T_{20} - T_{40} \approx 0{,}575 - 0{,}448 = \hlg{0{,}127\text{ s}}$$
        focus: [1, 2, 3]
        say: "Ở câu hai, với bề rộng 20 điểm ảnh, tỉ số 160 chia 20 cộng 1 bằng 9, lấy lôgarit cơ số 2 được 3 phẩy 17 bit nên thời gian trỏ là 0 phẩy 575 giây. Khi nâng bề rộng lên 40 điểm ảnh, tỉ số 160 chia 40 cộng 1 bằng 5, độ khó còn 2 phẩy 322 bit và thời gian còn 0 phẩy 448 giây. Vậy người dùng tiết kiệm được khoảng 0 phẩy 127 giây mỗi lần bấm."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">định luật thời gian trỏ: W nhỏ → trỏ chậm, dễ trượt</span><span class="a">→</span>
          <span class="n">vùng đích ≥ 24×24 (AA) hoặc 44×44 (AAA)</span><span class="a">→</span>
          <span class="n">điều hướng đủ bằng bàn phím + hiện viền tiêu điểm</span><span class="a">→</span>
          <span class="n">khai báo đủ Tên nhãn, Vai trò, Trạng thái</span><span class="a">→</span>
          <span class="n">giúp cả người khuyết tật lẫn người bận tay, nắng chói</span></div>
        say: "Tổng kết lại, từ định luật thời gian trỏ ta hiểu vì sao vùng bấm phải đạt tối thiểu 24 nhân 24 hoặc 44 nhân 44 điểm ảnh. Kết hợp vùng bấm đủ lớn với luồng điều hướng bàn phím rõ viền tiêu điểm và bộ ba tên nhãn, vai trò, trạng thái sẽ mở cánh cửa giao diện cho tất cả mọi người."
      - show: |
