scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nút biểu tượng 16×16 đẹp mắt nhưng làm nhiều người bấm trượt"
    checks:
      - "alg.hci_wcag_target_ok(16, 16, 24) is False"
      - "alg.hci_wcag_target_ok(24, 24, 24) is True"
      - "alg.hci_wcag_target_ok(44, 44, 44) is True"
    steps:
      - show: |
          <p>Ở bài 8, ta đã biết cách thiết kế thí nghiệm công bằng. Nhưng nếu giao diện chỉ thử trên <b>người nhìn rõ, cầm chuột vững</b>, ba rào cản sau sẽ chặn đứng rất nhiều người dùng thật:</p>
          <table class="t"><tr><th>thành phần trên màn hình</th><th>thiết kế thiếu tiếp cận</th><th>ai bị chặn lại?</th></tr>
          <tr><td><b>vùng bấm</b></td><td class="red">biểu tượng $16 \times 16$ điểm ảnh</td><td>người run tay, người bấm bằng ngón cái khi đang đi bộ</td></tr>
          <tr><td><b>bàn phím</b></td><td class="red">ẩn viền tiêu điểm vì muốn đẹp</td><td>người gãy tay bó bột, người chỉ dùng bàn phím</td></tr>
          <tr><td><b>trình đọc màn hình</b></td><td class="red">nút chỉ có hình kính lúp, không có nhãn chữ</td><td>người khiếm thị chỉ nghe máy đọc “nút, không nhãn”</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở bài 8, ta đã biết cách tổ chức thí nghiệm công bằng giữa các phương án giao diện. Nhưng nếu chỉ thiết kế cho người nhìn rõ và cầm chuột vững, một nút biểu tượng 16 nhân 16 điểm ảnh sẽ làm người run tay hoặc người đang đi bộ bấm trượt liên tục. Nếu ẩn luôn viền tiêu điểm bàn phím vì lý do thẩm mỹ, người không dùng chuột sẽ mù phương hướng. Còn nếu nút chỉ có hình vẽ mà thiếu nhãn chữ, trình đọc màn hình của người khiếm thị sẽ im lặng hoặc đọc vô nghĩa."
      - show: |
          <p>Chuẩn tiếp cận web quy định vùng bấm tối thiểu <b>$24 \times 24$ điểm ảnh</b> (mức AA) và khuyến nghị <b>$44 \times 44$ điểm ảnh</b> (mức AAA), đi kèm điều hướng bàn phím và nhãn ngữ nghĩa:</p>
          $$16 \times 16\text{ (không đạt)} \;\to\; \hlb{24 \times 24\text{ (tối thiểu AA)}} \;\to\; \hlg{44 \times 44\text{ (tăng cường AAA)}}$$
        focus: [1, 2, 2]
        say: "Để không bỏ rơi bất kỳ ai, bộ chuẩn tiếp cận web quốc tế đưa ra các tiêu chí đo được cho vùng bấm, bàn phím và trình đọc màn hình. Ta sẽ dùng lại định luật thời gian trỏ ở bài 2 để định lượng lợi ích của nút 24 nhân 24 và 44 nhân 44 điểm ảnh. Từ đó, ta sẽ sửa trọn vẹn một nút bấm từ chỗ bất khả tiếp cận thành đạt chuẩn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: định luật thời gian trỏ (bài 2) và dấu hiệu gợi ý (bài 1)"
    checks:
      - "round(alg.hci_fitts_id(200, 24), 3) == 3.222"
      - "round(alg.hci_fitts_id(200, 44), 3) == 2.471"
    steps:
      - show: |
          <p><b>Ôn nền 1 — định luật thời gian trỏ (bài 2).</b> Thời gian di chuyển tới đích cách $D$ có bề rộng $W$ là:</p>
          $$T = a + b \times \log_2\!\left(\frac{D}{W} + 1\right)$$
        focus: [1, 2, 2]
        say: "Trước hết, ta ôn lại định luật thời gian trỏ đã học ở bài 2. Thời gian di chuyển con trỏ hoặc ngón tay tới một nút cách khoảng D và có bề rộng W tỉ lệ thuận với lôgarit cơ số 2 của D chia W cộng 1. Khi bề rộng W quá nhỏ, tỉ số D chia W tăng vọt làm thời gian trỏ kéo dài và tỉ lệ bấm trượt tăng cao, nhất là với người có biên độ run tay lớn."
      - show: |
          <p><b>Ôn nền 2 — dấu hiệu nhận biết và phản hồi đa kênh (bài 1).</b> Một điều khiển tốt phải trả lời được 3 câu hỏi mà <b>không phụ thuộc vào một giác quan duy nhất</b>:</p>
          <table class="t"><tr><th>câu hỏi của người dùng</th><th>kênh thị giác (mắt nhìn)</th><th>kênh phi thị giác (bàn phím / tai nghe)</th></tr>
          <tr><td>đây là cái gì, làm việc gì?</td><td>hình biểu tượng + chữ trên nút</td><td><b>tên nhãn</b> và <b>vai trò</b> đọc thành tiếng</td></tr>
          <tr><td>con trỏ đang đứng ở đâu?</td><td>vệt sáng khi rê chuột</td><td><b>viền tiêu điểm</b> khi bấm phím chuyển tiếp</td></tr>
          <tr><td>đang bật hay đang tắt?</td><td>màu nền đổi xanh / xám</td><td><b>trạng thái</b> đọc rõ “đang bật” hoặc “đang tắt”</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Thứ hai, ta nhớ lại nguyên lý dấu hiệu gợi ý ở bài 1, mở rộng thêm cho phản hồi. Một nút bấm tốt phải cho người dùng biết nó là gì, tiêu điểm đang đứng ở đâu và trạng thái hiện tại là bật hay tắt. Thiết kế tiếp cận thực chất là bảo đảm cả ba thông tin đó luôn truyền tải đầy đủ qua cả kênh mắt nhìn lẫn kênh bàn phím và âm thanh."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ký hiệu kích thước vùng bấm và bộ ba ngữ nghĩa của điều khiển"
    checks:
      - "24 * 24 == 576"
      - "44 * 44 == 1936"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đơn vị / miền giá trị</th><th>ý nghĩa trong chuẩn tiếp cận web</th></tr>
          <tr><td>$W \times H$</td><td>điểm ảnh CSS (đơn vị kích thước của trang web, không phải chấm vật lý trên màn hình)</td><td>chiều rộng $W$ và chiều cao $H$ của vùng nhận thao tác bấm</td></tr>
          <tr><td>A, AA, AAA</td><td>ba mức của chuẩn</td><td>mức A thấp nhất, AA là mức thường được yêu cầu, AAA cao nhất</td></tr>
          <tr><td>$W_{\text{min}} = 24$</td><td>$24 \times 24 = 576$ điểm ảnh vuông</td><td>ngưỡng kích thước đích tối thiểu mức AA (tiêu chí 2.5.8)</td></tr>
          <tr><td>$W_{\text{AAA}} = 44$</td><td>$44 \times 44 = 1936$ điểm ảnh vuông</td><td>ngưỡng kích thước đích tăng cường mức AAA (tiêu chí 2.5.5)</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Ta gọi W nhân H là chiều rộng và chiều cao tính bằng điểm ảnh của vùng thực sự nhận thao tác bấm, chứ không chỉ riêng phần hình vẽ bên trong. Điểm ảnh ở đây là đơn vị kích thước của trang web, không phải chấm vật lý trên màn hình. Bộ chuẩn chia ba mức, mức một chữ A thấp nhất, mức hai chữ A thường được yêu cầu và mức ba chữ A cao nhất. Chuẩn tiếp cận web quy định hai mốc chuẩn: mức tối thiểu hai chữ A đòi hỏi mỗi chiều ít nhất 24 điểm ảnh, tức 576 điểm ảnh vuông. Mức tăng cường ba chữ A đòi hỏi mỗi chiều ít nhất 44 điểm ảnh, tức 1936 điểm ảnh vuông, rất phù hợp cho đầu ngón tay trên màn hình cảm ứng."
      - show: |
          <p><b>Bộ ba ngữ nghĩa bắt buộc của mọi điều khiển tương tác (tiêu chí 4.1.2):</b></p>
          $$\text{Điều khiển tiếp cận được} \;=\; (\text{Tên nhãn},\ \text{Vai trò},\ \text{Trạng thái})$$
        focus: [1, 2, 2]
        say: "Bên cạnh kích thước vật lý, mọi phần tử tương tác trên giao diện đều phải khai báo đủ bộ ba ngữ nghĩa gồm tên nhãn, vai trò và trạng thái. Tên nhãn trả lời nút này dùng để làm gì, chẳng hạn Tìm kiếm hay Đóng hộp thoại. Vai trò cho biết đó là nút bấm, ô đánh dấu hay danh sách chọn, còn trạng thái cho biết nó đang mở hay đóng, đã chọn hay chưa chọn."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Ba trụ cột tiếp cận: vùng bấm đủ lớn, điều hướng bàn phím, nhãn đọc màn hình"
    checks:
      - "round(1936 / 576, 2) == 3.36"
    steps:
      - show: |
          <p><b>Trụ cột 1 & 2 — vùng bấm đủ lớn và luồng bàn phím minh bạch:</b></p>
          <table class="t"><tr><th>trụ cột</th><th>yêu cầu kỹ thuật đo được</th><th>lỗi vi phạm phổ biến</th></tr>
          <tr><td><b>1. Kích thước đích</b></td><td>$W \ge 24$, $H \ge 24$ (hoặc $\ge 44$ ở mức AAA)</td><td>nút đóng hoặc nút xoá chỉ rộng $16 \times 16$ điểm ảnh</td></tr>
          <tr><td><b>2. Bàn phím & tiêu điểm</b></td><td>mọi chức năng đều dùng được bằng phím; viền tiêu điểm luôn nhìn thấy rõ</td><td>dùng thẻ văn bản làm nút giả nên phím chuyển tiếp đi xuyên qua; xoá viền tiêu điểm</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Thiết kế tiếp cận đứng vững trên ba trụ cột kỹ thuật có thể kiểm tra khách quan. Trụ cột thứ nhất là vùng bấm phải đạt ít nhất 24 nhân 24 điểm ảnh, hoặc mở rộng đệm bấm xung quanh biểu tượng nhỏ để đạt 44 nhân 44 điểm ảnh. Trụ cột thứ hai là mọi chức năng trên trang đều phải kích hoạt được chỉ bằng bàn phím theo một thứ tự hợp lý với nội dung, kèm viền tiêu điểm nổi bật."
      - clear: true
        show: |
          <p><b>Trụ cột 3 — hiệu ứng lề đường vỉa hè: thiết kế cho người khuyết tật nhưng giúp tất cả mọi người:</b></p>
          <table class="t"><tr><th>nhóm người dùng</th><th>khiếm khuyết vĩnh viễn</th><th>bất lợi tạm thời</th><th>tình huống bất lợi hàng ngày</th></tr>
          <tr><td><b>vận động / chạm</b></td><td>chứng run tay, liệt một tay</td><td>bó bột cổ tay sau chấn thương</td><td>cầm điện thoại bằng 1 tay trên xe buýt đang xóc</td></tr>
          <tr><td><b>thị giác / nghe đọc</b></td><td>khiếm thị hoàn toàn hoặc thị lực kém</td><td>mới nhỏ thuốc giãn đồng tử khám mắt</td><td>nhìn màn hình ngoài trời nắng gắt hoặc vừa lái xe vừa nghe</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Trụ cột thứ ba là gắn nhãn ngữ nghĩa cho trình đọc màn hình, đồng thời mở ra nguyên lý hiệu ứng lề đường vỉa hè. Giống như đoạn vạt dốc ở vỉa hè ban đầu làm cho xe lăn nhưng lại giúp cả người đẩy xe nôi và người kéo hành lý, giao diện tiếp cận giúp mọi người dùng. Một người hoàn toàn khoẻ mạnh nhưng đang đứng trên xe buýt rung lắc hay nhìn điện thoại dưới nắng gắt cũng hưởng lợi trực tiếp từ nút bấm 44 điểm ảnh."

  # ───────────────────────── 5. TRỰC GIÁC ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Trực giác: giữ nguyên biểu tượng 16×16 nhưng mở rộng vùng đệm bấm lên 44×44"
    checks:
      - "(44 - 16) // 2 == 14"
      - "44 * 44 == 1936 and 16 * 16 == 256"
    steps:
      - show: |
          <svg viewBox="0 0 620 210" width="100%" height="auto">
            <rect x="60" y="85" width="32" height="32" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
            <circle cx="76" cy="101" r="8" fill="none" stroke="#f8fafc" stroke-width="2"/>
            <text x="76" y="155" fill="#fca5a5" font-size="14" text-anchor="middle" font-weight="bold">16×16 (256 điểm ảnh²)</text>
            <text x="76" y="178" fill="#cbd5e1" font-size="13" text-anchor="middle">Dễ bấm trượt</text>

            <rect x="254" y="77" width="48" height="48" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,3"/>
