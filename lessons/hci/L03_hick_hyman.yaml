scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "15 mục để chung một thực đơn phẳng hay chia thành 3 nhóm × 5 mục?"
    checks:
      - "round(alg.hci_hick_time(15, 0.2), 3) == 0.8"
      - "round(alg.hci_hick_time(3, 0.2) + alg.hci_hick_time(5, 0.2), 3) == 0.917"
      - "alg.hci_hick_time(15, 0.2) < alg.hci_hick_time(3, 0.2) + alg.hci_hick_time(5, 0.2)"
    steps:
      - show: |
          <p>Một thanh điều hướng có <b>15 mục chức năng</b> đã được xếp theo thứ tự bảng chữ cái và người dùng quen việc đã biết tên mục cần tìm (với $b = 0{,}2\text{ s/bit}$). Một đồng nghiệp đề xuất gom thành <b>2 cấp</b>: cấp một chọn 1 trong <b>3 nhóm</b>, cấp hai chọn 1 trong <b>5 mục</b>:</p>
          <table class="t"><tr><th>kiểu thiết kế thực đơn</th><th>công thức thời gian chọn</th><th>kết quả</th></tr>
          <tr><td>thực đơn phẳng 15 mục</td><td>$0{,}2 \cdot \log_2(15 + 1) = 0{,}2 \cdot \log_2 16$</td><td>$\mathbf{0{,}8}\text{ s}$</td></tr>
          <tr><td>thực đơn hai cấp (3 nhóm × 5 mục)</td><td>$0{,}2 \cdot \log_2(3 + 1) + 0{,}2 \cdot \log_2(5 + 1)$</td><td>$\approx \mathbf{0{,}917}\text{ s}$ (chậm hơn!)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, giả sử ứng dụng của bạn có 15 mục chức năng xếp có trật tự và người dùng đã biết tên mục mình cần bấm. Nhiều người nghĩ rằng chia nhỏ 15 mục thành thực đơn hai cấp gồm 3 nhóm, mỗi nhóm 5 mục sẽ giúp chọn nhanh hơn. Nhưng khi tính ra bằng số với b bằng 0 phẩy 2 giây, thực đơn phẳng 15 mục chỉ mất 0 phẩy 8 giây, còn thực đơn hai cấp lại mất tới 0 phẩy 917 giây."
      - show: |
          <div class="box key">Hôm nay ta trả lời: vì sao thời gian chọn trong $n$ mục quen thuộc lại tỉ lệ với $\log_2(n + 1)$? Vì sao tách hai cấp lại cộng thêm độ trễ? Và khi nào người dùng mới bị rơi vào cảnh dò từng dòng?</div>
        focus: [1, 1]
        say: "Hôm nay ta trả lời ba câu hỏi thiết kế thực đơn. Vì sao thời gian chọn tỉ lệ với lôgarit cơ số 2 của n cộng 1, vì sao tách hai cấp lại chậm hơn, và khi nào công thức này không còn đúng?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bài toán tìm kiếm chia đôi và tính chất cộng lôgarit"
    checks:
      - "math.log2(4) + math.log2(6) == math.log2(24) and 24 > 16"
      - "math.log2(16) == 4 and round(math.log2(6), 4) == 2.5850"
    steps:
      - show: |
          <p><b>① Tìm kiếm chia đôi trên danh sách có thứ tự.</b> Khi 15 mục đã xếp theo bảng chữ cái (hoặc theo vị trí quen thuộc), mắt không đọc từ mục 1 đến mục 15 mà nhảy vào giữa để loại bỏ một nửa danh sách sau mỗi nhịp:</p>
          $$16 \xrightarrow{: 2} 8 \xrightarrow{: 2} 4 \xrightarrow{: 2} 2 \xrightarrow{: 2} 1 \;\implies\; \log_2 16 = 4\text{ bước chia đôi}$$
        focus: [1, 1, 2]
        say: "Trước hết ta ôn lại ý tưởng tìm kiếm chia đôi trên một danh sách đã sắp xếp có trật tự. Khi người dùng đã biết tên mục cần tìm, mắt họ nhảy vào khoảng giữa để loại đi một nửa số mục sau mỗi nhịp nhìn. Vì vậy 16 trạng thái chỉ cần lôgarit cơ số 2 của 16 bằng 4 bước chia đôi."
      - show: |
          <p><b>② Tổng hai lôgarit bằng lôgarit của tích</b> (đã học ở khoá Toán cho khoa học máy tính):</p>
          $$\log_2 A + \log_2 B = \log_2(A \cdot B) \;\implies\; \log_2 4 + \log_2 6 = \log_2(4 \cdot 6) = \log_2 24 \gt \log_2 16$$
        focus: [1, 2]
        say: "Điều thứ hai là tính chất cộng hai lôgarit cùng cơ số bằng lôgarit của tích hai số đó. Nhờ tính chất này, ta thấy ngay tổng của lôgarit cơ số 2 của 4 và lôgarit cơ số 2 của 6 bằng lôgarit cơ số 2 của 24, lớn hơn hẳn lôgarit cơ số 2 của 16."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: số lựa chọn n, hằng số b, thời gian chọn T và xác suất p i"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc là</th><th>nghĩa và đơn vị</th></tr>
          <tr><td>$n$</td><td>en-nờ</td><td>số lựa chọn có mặt trên màn hình (ví dụ $n = 15$ mục trong thực đơn)</td></tr>
          <tr><td>$\log_2(n + 1)$</td><td>lôgarit cơ số hai của n cộng một</td><td>lượng thông tin quyết định khi $n$ mục có khả năng được chọn ngang nhau (bit); $+1$ ứng với trạng thái “chưa chọn / không có tín hiệu”</td></tr>
          <tr><td>$b$</td><td>bê</td><td>thời gian não xử lý mỗi <b>1 bit</b> lựa chọn (giây trên bit, thường quanh $0{,}15$ đến $0{,}20\text{ s/bit}$)</td></tr>
          <tr><td>$T = b \cdot \log_2(n + 1)$</td><td>tê</td><td>thời gian phản xạ chọn mục khi các mục đã quen thuộc và có trật tự (giây)</td></tr>
          <tr><td>$p_i$</td><td>pê i</td><td>xác suất (tần suất) người dùng cần chọn mục thứ $i$, với $\sum_{i=1}^{n} p_i = 1$</td></tr></table>
        introduces: [sum]
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng này giải mã các ký hiệu của định luật thời gian chọn. Chữ n là số lựa chọn hiển thị trước mắt người dùng. Lôgarit cơ số 2 của n cộng 1 đo lượng thông tin tính bằng bit, với số cộng 1 chỉ trạng thái nghỉ chưa chọn. Hằng số b là số giây cho mỗi bit quyết định, nên thời gian chọn T bằng b nhân lôgarit cơ số 2 của n cộng 1. Khi các mục được dùng nhiều ít khác nhau, ta gọi p i là tần suất chọn mục thứ i với tổng Sigma các p i bằng 1."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cây quyết định một lần so với hai lần cộng thêm phần dư +1"
    steps:
      - show: |
          <div><svg width="1460" height="390" viewBox="0 0 1460 390">
          <g font-size="21" fill="#1f2937" text-anchor="middle">
          <rect x="40" y="30" width="640" height="330" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
          <text x="360" y="68" font-weight="bold" fill="#065f46">Thực đơn phẳng 15 mục (đã xếp thứ tự quen thuộc)</text>
          <rect x="90" y="95" width="540" height="48" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
          <text x="360" y="126">15 mục + 1 trạng thái nghỉ = 16 trạng thái</text>
          <text x="360" y="185">Số bit quyết định: log₂(15 + 1) = log₂ 16 = 4 bit</text>
          <rect x="150" y="220" width="420" height="60" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
          <text x="360" y="258" font-weight="bold" fill="#065f46">T = 0,2 nhân 4 = 0,800 giây (1 lần quyết định)</text>
          <rect x="760" y="30" width="660" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
          <text x="1090" y="68" font-weight="bold" fill="#991b1b">Thực đơn 2 cấp: cấp 1 (3 nhóm) → cấp 2 (5 mục)</text>
          <rect x="805" y="95" width="265" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
          <text x="937" y="130" font-weight="bold">Cấp 1: chọn 1/3 nhóm</text>
          <text x="937" y="165">log₂(3 + 1) = 2 bit (0,4 s)</text>
          <rect x="1115" y="95" width="265" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
          <text x="1247" y="130" font-weight="bold">Cấp 2: chọn 1/5 mục</text>
          <text x="1247" y="165">log₂(5 + 1) ≈ 2,585 bit</text>
          <rect x="850" y="220" width="480" height="60" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
          <text x="1090" y="258" font-weight="bold" fill="#991b1b">T ≈ 0,4 + 0,517 = 0,917 giây (chậm hơn 0,117 s)</text>
          <text x="1090" y="322" font-size="19" fill="#991b1b">Mỗi cấp đều gánh thêm “+1” trạng thái khởi tạo quyết định</text>
          </g></svg></div>
        say: "Hình vẽ giải thích trực quan vì sao chia thực đơn 15 mục thành hai cấp lại làm người dùng quen việc chậm đi. Ở khung xanh bên trái, người dùng chỉ mở thực đơn một lần, chọn giữa 15 mục cộng 1 trạng thái nghỉ là 16, ứng với đúng 4 bit tức 0 phẩy 8 giây. Ở khung đỏ bên phải, cấp một chọn 1 trong 3 nhóm mất 0 phẩy 4 giây, cấp hai chọn 1 trong 5 mục mất thêm 0 phẩy 517 giây, cộng lại thành 0 phẩy 917 giây."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức Hick–Hyman và bất đẳng thức giữa 1 cấp với 2 cấp"
    checks:
      - "4 * 6 == 24 and 24 > 16"
      - "round(0.2 * math.log2(24) - 0.2 * math.log2(16), 3) == 0.117"
    steps:
      - show: |
          <p><b>Bước 1 — Thời gian chọn một cấp với $n$ mục đồng xác suất (Hick, 1952).</b> Giữa $n$ mục cộng $1$ trạng thái chưa phát tín hiệu, lượng thông tin là $\log_2(n + 1)$ bit:</p>
          $$T_{\text{1 cấp}}(n) = b \cdot \log_2(n + 1)$$
        focus: [1, 2]
        say: "Bước một, theo kết quả thực nghiệm năm 1952, khi n lựa chọn đều quen thuộc và có xác suất xuất hiện ngang nhau, người dùng phân đôi tập lựa chọn trong đầu. Vì có n lựa chọn cộng 1 trạng thái chưa có tín hiệu, nên thời gian chọn một cấp bằng b nhân lôgarit cơ số 2 của n cộng 1."
      - show: |
          <p><b>Bước 2 — Thời gian chọn khi chia $n = n_1 \cdot n_2$ mục thành hai cấp liên tiếp.</b> Người dùng phải hoàn thành quyết định cấp 1 ($n_1$ nhóm) rồi mới nhìn và quyết định cấp 2 ($n_2$ mục):</p>
          $$T_{\text{2 cấp}}(n_1, n_2) = b \cdot \log_2(n_1 + 1) + b \cdot \log_2(n_2 + 1) = b \cdot \log_2\!\big((n_1 + 1)(n_2 + 1)\big)$$
        focus: [1, 2]
        say: "Bước hai, nếu ta chia n mục thành n 1 nhóm ở cấp một và mỗi nhóm có n 2 mục ở cấp hai, người dùng phải chịu hai lần quyết định nối tiếp nhau. Khi cộng hai biểu thức lôgarit lại theo quy tắc nhân bên trong, tổng thời gian hai cấp bằng b nhân lôgarit cơ số 2 của tích n 1 cộng 1 nhân với n 2 cộng 1."
      - clear: true
        show: |
          <p><b>Bước 3 — Khai triển tích $(n_1 + 1)(n_2 + 1)$ để thấy phần đội thêm.</b> Vì $n_1 \cdot n_2 = n$:</p>
          $$(n_1 + 1)(n_2 + 1) = n_1 n_2 + n_1 + n_2 + 1 = (n + 1) + \hl{(n_1 + n_2)} \gt n + 1$$
          <p class="note">Với $n_1 = 3, n_2 = 5$: $(3 + 1)(5 + 1) = 24$ lớn hơn $15 + 1 = 16$ đúng bằng $3 + 5 = 8$ đơn vị.</p>
        focus: [1, 2]
        say: "Bước ba, khi khai triển tích n 1 cộng 1 nhân n 2 cộng 1, ta được biểu thức lớn hơn n cộng 1 một lượng đúng bằng n 1 cộng n 2. Thay số với 3 nhóm nhân 5 mục, tích bên trong lôgarit là 4 nhân 6 bằng 24, lớn hơn 16 nên tách hai cấp luôn chậm hơn."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính từng bước thực đơn 15 mục phẳng, thực đơn 3 × 5 và trường hợp tần suất lệch"
    checks:
      - "round(alg.hci_hick_time(15, 0.2), 3) == 0.8"
      - "round(alg.hci_hick_time(3, 0.2), 3) == 0.4 and round(alg.hci_hick_time(5, 0.2), 3) == 0.517"
      - "round(alg.hci_hick_time(3, 0.2) + alg.hci_hick_time(5, 0.2), 3) == 0.917"
      - "round(alg.hci_hick_entropy([0.5, 0.25, 0.125, 0.125], 0.2)[0], 2) == 0.35 and round(0.2 * math.log2(4), 2) == 0.40"
    steps:
      - show: |
          <p><b>Bước 1 — Thực đơn phẳng $n = 15$ mục với $b = 0{,}2\text{ s/bit}$.</b></p>
          $$T_{\text{phẳng}} = 0{,}2 \cdot \log_2(15 + 1) = 0{,}2 \cdot \log_2 16 = 0{,}2 \cdot 4 = \hlg{0{,}8}\text{ s}$$
        focus: [1, 2]
        say: "Ta trình bày từng phép tính của ví dụ chuẩn trong giáo án với b bằng 0 phẩy 2 giây mỗi bit. Ở bước một, thực đơn phẳng có 15 mục, lấy 15 cộng 1 bằng 16, lôgarit cơ số 2 của 16 bằng 4 bit, nhân 0 phẩy 2 được 0 phẩy 8 giây."
      - show: |
          <p><b>Bước 2 — Thực đơn hai cấp: cấp một $n_1 = 3$ nhóm, cấp hai $n_2 = 5$ mục.</b></p>
          $$T_{\text{cấp 1}} = 0{,}2 \cdot \log_2(3 + 1) = 0{,}2 \cdot \log_2 4 = 0{,}2 \cdot 2 = \hlb{0{,}4}\text{ s}$$
          $$T_{\text{cấp 2}} = 0{,}2 \cdot \log_2(5 + 1) = 0{,}2 \cdot \log_2 6 \approx 0{,}2 \cdot 2{,}585 = \hlb{0{,}517}\text{ s}$$
        focus: [1, 2, 3]
        say: "Bước hai, ta tính riêng từng chặng của thực đơn hai cấp 3 nhóm nhân 5 mục. Ở cấp một, chọn 1 trong 3 nhóm mất 0 phẩy 2 nhân lôgarit cơ số 2 của 4, tức 0 phẩy 2 nhân 2 bằng 0 phẩy 4 giây. Sang cấp hai, chọn 1 trong 5 mục mất 0 phẩy 2 nhân lôgarit cơ số 2 của 6, tức 0 phẩy 2 nhân 2 phẩy 585 xấp xỉ 0 phẩy 517 giây."
      - clear: true
        show: |
          <p><b>Bước 3 — Cộng hai chặng của thực đơn hai cấp và so với thực đơn phẳng.</b></p>
          $$T_{\text{2 cấp}} = 0{,}4 + 0{,}517 = \hl{0{,}917}\text{ s} \gt 0{,}8\text{ s} \quad (\text{chậm hơn } 0{,}117\text{ s mỗi lần chọn})$$
          <p class="note">Chưa kể thực đơn hai cấp còn bắt người dùng trỏ chuột hoặc bấm thêm một lần để mở cấp hai.</p>
        focus: [2, 3]
        say: "Bước ba, cộng hai chặng lại ta có 0 phẩy 4 cộng 0 phẩy 517 bằng 0 phẩy 917 giây, chậm hơn thực đơn phẳng 0 phẩy 117 giây. Đó là chưa kể thực đơn hai cấp còn bắt tay người dùng phải di chuột và bấm thêm một lần nữa để mở danh sách con."
      - show: |
          <p><b>Bước 4 — Khi các mục có tần suất dùng rất lệch nhau (Hyman, 1953).</b> Xét 4 mục có xác suất được chọn là $p = (0{,}5;\; 0{,}25;\; 0{,}125;\; 0{,}125)$:</p>
          $$H = \sum_{i=1}^{4} p_i \log_2 \frac{1}{p_i} = 0{,}5 \cdot 1 + 0{,}25 \cdot 2 + 0{,}125 \cdot 3 + 0{,}125 \cdot 3 = \hlb{1{,}75}\text{ bit} \lt \log_2 4 = 2\text{ bit}$$
          $$T_{\text{lệch}} = 0{,}2 \cdot 1{,}75 = \hlg{0{,}35}\text{ s} \quad (\text{nhanh hơn mức đồng đều } 0{,}2 \cdot 2 = 0{,}40\text{ s})$$
        focus: [2, 3]
        say: "Bước bốn, theo mở rộng năm 1953 cho các lựa chọn lệch nhau, giả sử 4 mục có tần suất là một phần hai, một phần tư và hai mục một phần tám. Khi đó lượng thông tin giảm từ 2 bit xuống 1 phẩy 75 bit, giúp thời gian phản xạ rút xuống còn 0 phẩy 35 giây nếu đặt mục hay dùng lên đầu."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng công thức gộp log₂ 24 và kiểm tra giới hạn người mới"
    checks:
      - "round(0.2 * math.log2(24), 3) == 0.917 == round(alg.hci_hick_time(3, 0.2) + alg.hci_hick_time(5, 0.2), 3)"
      - "15 * 0.15 == 2.25 and 2.25 > 0.8"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Tính thực đơn hai cấp bằng một lôgarit duy nhất $\log_2 24$.</b> Thay vì tính rời cấp 1 và cấp 2 rồi cộng, ta dùng đẳng thức $(3 + 1)(5 + 1) = 24$:</p>
          $$T_{\text{2 cấp}} = 0{,}2 \cdot \log_2 24 = 0{,}2 \cdot (\log_2 4 + \log_2 6) \approx 0{,}2 \cdot 4{,}585 = 0{,}917\text{ s} \;\checkmark$$
        focus: [1, 2]
        say: "Ta tự kiểm tra bằng con đường gộp hai lôgarit thành một phép tính duy nhất. Vì 4 nhân 6 bằng 24, lấy 0 phẩy 2 nhân với lôgarit cơ số 2 của 24 tức 4 phẩy 585 bit cũng ra đúng 0 phẩy 917 giây."
      - show: |
          <p><b>Kiểm tra 2 — So sánh người quen việc (hàm lôgarit) với người mới lần đầu (hàm tuyến tính).</b> Nếu 15 mục xếp lộn xộn và người mới phải đọc dò từng mục mất $0{,}15\text{ s}$ mỗi mục (trung bình đọc qua nửa danh sách là $8$ mục, xấu nhất đọc hết $15$ mục):</p>
          <table class="t"><tr><th>trạng thái người dùng và danh sách</th><th>quy luật thời gian</th><th>thời gian với $n = 15$</th></tr>
          <tr><td>mục quen thuộc, xếp có trật tự</td><td>$b \cdot \log_2(n + 1)$ (lôgarit)</td><td>$0{,}80$ s</td></tr>
          <tr><td>mục lạ hoặc xếp ngẫu nhiên (đọc hết 15 mục)</td><td>$c \cdot n$ (tuyến tính)</td><td>$0{,}15 \cdot 15 = 2{,}25$ s</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm tra thứ hai đối chiếu ranh giới áp dụng của định luật. Khi danh sách có trật tự và người dùng đã thuộc tên mục, thời gian tăng rất chậm theo hàm lôgarit và chỉ mất 0 phẩy 80 giây. Ngược lại, nếu các mục xếp lộn xộn khiến người mới phải đọc dò từng dòng với 0 phẩy 15 giây mỗi dòng, quét hết 15 mục tốn tới 2 phẩy 25 giây."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi dùng định luật thời gian chọn để thiết kế thực đơn"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Áp dụng công thức $\log_2(n + 1)$ cho danh sách không có trật tự hoặc người dùng mới lần đầu nhìn thấy <b class="red">(người mới phải đọc dò từng mục, thời gian tăng tuyến tính theo n chứ không phải lôgarit)</b>
          <br><span class="note">Trong thí nghiệm của Hick và Hyman, người tham gia đã luyện tập hàng nghìn lượt nên thuộc lòng vị trí các lựa chọn.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất hay gặp nhất ở người làm sản phẩm là lấy công thức lôgarit áp cho một trang danh sách lộn xộn mà khách hàng mới nhìn thấy lần đầu. Định luật này chỉ đúng khi các lựa chọn đã quen thuộc và được sắp xếp có trật tự, còn người mới sẽ phải đọc dò từng dòng một theo thời gian tuyến tính."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tưởng rằng “cứ giảm số mục mỗi cấp là luôn nhanh hơn” nên băm thực đơn thành 3–4 tầng sâu <b class="red">(mỗi tầng cộng thêm một lần quyết định và một lần trỏ chuột)</b></div>
          $$T_{\text{nhiều cấp}} = \sum_{k} \big(T_{\text{chọn cấp } k} + T_{\text{trỏ cấp } k}\big) \;\gt\; T_{\text{phẳng}}$$
        focus: [1, 2]
        say: "Lỗi thứ hai là lạm dụng việc chia nhỏ bằng cách băm một thực đơn vừa phải thành ba bốn tầng lồng nhau. Mỗi tầng mới không chỉ cộng thêm phần dư trong công thức thời gian chọn mà còn cộng thêm cả thời gian di chuột và mở thực đơn con, làm tổng thời gian tăng vọt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhét 15 mục vào thực đơn hai cấp với tên nhóm cấp 1 mơ hồ <b class="red">(người dùng mở nhầm nhóm cấp 1, phải quay lui tìm lại ở nhóm khác)</b>
          <br><span class="note">Khi người dùng không đoán chắc mục mình cần nằm ở nhóm nào trong 3 nhóm cấp 1, họ phải mở thử từng nhóm, tốn gấp đôi gấp ba thời gian.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là chia thực đơn thành hai cấp nhưng đặt tên cho ba nhóm ở cấp một quá chung chung như công cụ, tiện ích và nâng cao. Khi người dùng không biết mục mình cần nằm trong nhóm nào, họ sẽ mở nhầm nhóm cấp một rồi phải đóng lại mở nhóm khác, làm thời gian thực tế tăng gấp nhiều lần."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tự động đảo thứ tự các mục trong thực đơn mỗi ngày theo tần suất bấm <b class="red">(phá vỡ trí nhớ không gian, biến người dùng thành thạo thành người mới phải dò lại từ đầu)</b>
          <br><span class="note">Giữ nguyên thứ tự toàn bộ danh sách, hoặc tách riêng một khung nhỏ “Gần đây” cố định ở trên đầu.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư của các kỹ sư phần mềm là viết thuật toán tự động xáo trộn lại vị trí các nút trên thanh thực đơn mỗi ngày theo số lần bấm. Việc đổi chỗ liên tục sẽ phá hỏng trí nhớ vị trí của người dùng quen, biến tốc độ lôgarit của họ quay ngược về tốc độ đọc dò tuyến tính chậm chạp."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: so sánh thực đơn 7 mục phẳng với hai cấp và chọn cách sắp xếp"
    checks:
      - "round(alg.hci_hick_time(7, 0.2), 2) == 0.60"
      - "round(alg.hci_hick_time(2, 0.2) + alg.hci_hick_time(4, 0.2), 3) == 0.781"
      - "0.60 < 0.781"
    steps:
      - show: |
          <p>Một thanh công cụ có $b = 0{,}2\text{ s/bit}$ cần hiển thị các lệnh quen thuộc cho nhân viên thu ngân (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Tính thời gian chọn $T$ của một thực đơn phẳng có $n = 7$ mục quen thuộc.</td></tr>
          <tr><td>2</td><td>Nếu gom thành thực đơn hai cấp: cấp một có $n_1 = 2$ nhóm, cấp hai có $n_2 = 4$ mục (tổng $8$ ô), hãy tính tổng thời gian chọn của hai cấp ($\log_2 3 \approx 1{,}585$; $\log_2 5 \approx 2{,}322$).</td></tr>
          <tr><td>3</td><td>Khi màn hình đủ chỗ hiển thị cả 7 mục quen thuộc, bạn chọn thực đơn phẳng hay thực đơn hai cấp? Nếu có 1 mục chiếm tới 80% số lần bấm trong ca làm việc, bạn thiết kế nút đó thế nào?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự tính để ra quyết định thiết kế cho màn hình thu ngân với b bằng 0 phẩy 2 giây mỗi bit. Câu một, tính thời gian chọn của thực đơn phẳng có 7 mục quen thuộc. Câu hai, tính tổng thời gian chọn nếu chia làm hai cấp gồm 2 nhóm ở cấp một và 4 mục ở cấp hai. Câu ba, chọn giữa thực đơn phẳng với hai cấp và xử lý mục chiếm 80 phần trăm lượt bấm. Bạn hãy dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước tính</th><th>đáp số</th></tr>
          <tr><td>1. Phẳng $n = 7$</td><td>$T = 0{,}2 \cdot \log_2(7 + 1) = 0{,}2 \cdot \log_2 8 = 0{,}2 \cdot 3$</td><td>$\mathbf{0{,}60}\text{ s}$</td></tr>
          <tr><td>2. Hai cấp ($2$ rồi $4$)</td><td>$T = 0{,}2 \cdot \log_2 3 + 0{,}2 \cdot \log_2 5 \approx 0{,}2 \cdot (1{,}585 + 2{,}322) = 0{,}2 \cdot 3{,}907$</td><td>$\approx \mathbf{0{,}781}\text{ s}$ (chậm hơn $0{,}181\text{ s}$)</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Ở câu một, với 7 mục phẳng ta có 7 cộng 1 bằng 8, lôgarit cơ số 2 của 8 bằng 3 bit, nhân 0 phẩy 2 được đúng 0 phẩy 60 giây. Ở câu hai, tổng số bit của hai cấp là 1 phẩy 585 cộng 2 phẩy 322 bằng 3 phẩy 907 bit, nhân 0 phẩy 2 ra 0 phẩy 781 giây, chậm hơn 0 phẩy 181 giây."
      - show: |
          <table class="t"><tr><th>ý trong câu 3</th><th>quyết định thiết kế</th></tr>
          <tr><td>Chọn phẳng hay hai cấp cho 7 mục quen thuộc?</td><td><b class="green">✓ Chọn thực đơn phẳng 7 mục</b> — vừa nhanh hơn về thời gian quyết định ($0{,}60\text{ s} \lt 0{,}781\text{ s}$), vừa bớt 1 cú bấm mở nhóm</td></tr>
          <tr><td>Một mục chiếm 80% số lần bấm</td><td>Đưa mục đó ra thành <b>nút lớn cố định ở vị trí đầu tiên</b> (kèm phím tắt) để giảm lượng thông tin trung bình và giảm cả thời gian trỏ</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở câu ba, khi màn hình đủ chỗ cho 7 mục quen thuộc của thu ngân, ta dứt khoát chọn thực đơn phẳng một cấp để tiết kiệm cả thời gian nghĩ lẫn thao tác tay. Với lệnh chiếm 80 phần trăm số lần dùng trong ca trực, ta tách nó thành một nút lớn cố định ở vị trí đầu tiên kèm phím tắt riêng."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic và nguyên tắc tổ chức lựa chọn trên màn hình"
    steps:
      - show: |
          <div class="chain"><span class="n">n lựa chọn quen thuộc và có trật tự</span><span class="a">→</span>
          <span class="n">thời gian chọn b nhân log₂(n + 1)</span><span class="a">→</span>
          <span class="n">chia cấp cộng thêm phần dư</span><span class="a">→</span>
          <span class="n">ưu tiên thực đơn phẳng có trật tự cố định</span></div>
        focus: [1, 1]
        say: "Tổng kết lại chuỗi logic của bài ba, khi người dùng đứng trước n lựa chọn quen thuộc và có trật tự, thời gian quyết định tăng theo hàm lôgarit cơ số 2 của n cộng 1. Việc chia nhỏ thành nhiều cấp làm đội thêm phần dư ở mỗi cấp, nên với số mục vừa phải và người dùng đã biết tên mục, thực đơn phẳng có thứ tự cố định luôn thắng thế."
      - show: |
          <div class="box key"><b>Tư duy:</b> Muốn người dùng hưởng tốc độ $\log_2(n + 1)$ thay vì phải đọc dò tuyến tính từng dòng, giao diện phải giữ <b>thứ tự nhất quán</b> và <b>nhãn mục rõ nghĩa</b>; chỉ chia nhóm khi số mục quá lớn không thể bày hết trên màn hình.</div>
        focus: [1, 1]
        say: "Tư duy cần nhớ là công thức lôgarit không tự nhiên mà có, nó là phần thưởng dành cho một giao diện sắp xếp có trật tự và giữ vị trí các mục ổn định. Hãy chỉ dùng cây nhiều cấp khi có hàng chục hay hàng trăm mục không thể bày hết trên một màn hình."
      - show: |
          <p class="note">Bài sau (bài 4): <b>Trí nhớ làm việc, gom nhóm và tải nhận thức</b> — khi các mục không hiện sẵn trên màn hình mà bắt người dùng tự nhớ trong đầu, não bộ giữ được tối đa mấy nhóm thông tin?</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài sau, bài 4, ta sẽ tìm hiểu về trí nhớ làm việc, gom nhóm và tải nhận thức khi người dùng phải giữ thông tin ngắn hạn trong đầu. Ta sẽ thấy vì sao việc tách một mã sáu chữ số thành hai cụm lại giảm ngay gánh nặng ghi nhớ, hẹn gặp bạn ở bài tiếp theo."
