objectives:
  - "Tính tỉ lệ vấn đề khả dụng phát hiện được 1 − (1 − λ)ⁿ sau khi cho n người thử độc lập"
  - "Giải thích vì sao 5 người thử phát hiện khoảng 84,4% vấn đề có λ = 0,31 nhưng 15 người chỉ tăng thêm khoảng 15,2 điểm phần trăm"
  - "Thiết kế nhiều vòng thử nhỏ (3 vòng × 5 người sau mỗi đợt sửa) thay vì dồn 15 người vào một vòng duy nhất"
  - "Nhận biết khi nào λ nhỏ hơn 0,31 và cần chia theo nhóm người dùng"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dồn 15 người vào một lần thử, hay chia thành 3 vòng 5 người?"
    checks:
      - "round(alg.hci_nielsen_found(5, 0.31) * 100, 1) == 84.4"
      - "round(alg.hci_nielsen_found(15, 0.31) * 100, 1) == 99.6"
      - "3 * 5 == 15"
    steps:
      - show: |
          <p>Đội sản phẩm có ngân sách mời <b>15 người dùng</b> đến thử giao diện đặt vé mới. Một bên đề nghị mời cả 15 người trong một tuần để tìm tới <b>99,6%</b> lỗi; bên kia đề nghị chỉ mời <b>5 người</b> (đã thấy <b>84,4%</b> lỗi), sửa ngay, rồi thử tiếp vòng hai và vòng ba.</p>
          <div class="box key">Hôm nay ta trả lời: con số 84,4% và 99,6% từ đâu ra? Vì sao 3 vòng 5 người lại lợi hơn 1 vòng 15 người? Và khi nào con số 5 người không còn đủ?</div>
        focus: [1, 1, 2]
        say: "Chào bạn, đội sản phẩm có ngân sách mời 15 người dùng đến thử giao diện đặt vé mới. Một bên muốn mời cả 15 người trong một tuần để tìm 99 phẩy 6 phần trăm lỗi, bên kia muốn chia thành ba vòng 5 người. Hôm nay ta xem con số 84 phẩy 4 phần trăm từ đâu ra, vì sao chia vòng nhỏ lợi hơn, và khi nào 5 người chưa đủ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại hai điều sẽ dùng"
    checks:
      - "round(1 - 0.31, 2) == 0.69"
      - "round(0.69 ** 2, 4) == 0.4761 and round(1 - 0.69 ** 2, 4) == 0.5239"
    steps:
      - show: |
          <p><b>① Xác suất biến cố đối</b> (ở khoá Toán rời rạc, phần xác suất cơ bản): nếu khả năng một người <b>thấy</b> lỗi là $0{,}31$ thì khả năng người đó <b>bỏ sót</b> lỗi là phần bù tới $1$:</p>
          $$1 - 0{,}31 = 0{,}69$$
        focus: [1, 2]
        say: "Điều thứ nhất là xác suất của biến cố đối, đã học ở khoá Toán rời rạc, phần xác suất cơ bản. Nếu khả năng một người thấy lỗi là 0 phẩy 31, thì khả năng người đó bỏ sót lỗi là 1 trừ 0 phẩy 31, bằng 0 phẩy 69."
      - show: |
          <p><b>② Nhân xác suất độc lập và lấy phần bù:</b> hai người thử độc lập cùng bỏ sót một lỗi với xác suất $0{,}69 \cdot 0{,}69 = 0{,}69^2 = 0{,}4761$. Khả năng <b>ít nhất một người thấy</b> lỗi là:</p>
          $$1 - 0{,}69^2 = 1 - 0{,}4761 = 0{,}5239$$
        focus: [1, 1, 2]
        say: "Điều thứ hai là nhân xác suất của các lần thử độc lập. Hai người cùng bỏ sót một lỗi có xác suất 0 phẩy 69 nhân 0 phẩy 69, bằng 0 phẩy 4761. Lấy 1 trừ đi số đó, khả năng ít nhất một người thấy lỗi là 0 phẩy 5239."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tỉ lệ phát hiện lam-đa và số người thử n"
    checks:
      - "round(alg.hci_nielsen_found(1, 0.31), 2) == 0.31"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>cách đọc</th><th>nghĩa</th><th>ví dụ số</th></tr>
          <tr><td>$\lambda$</td><td>lam-đa</td><td>tỉ lệ vấn đề khả dụng mà <b>một người thử</b> phát hiện được (từ $0$ tới $1$)</td><td>$\lambda = 0{,}31$ (tức 31%)</td></tr>
          <tr><td>$1 - \lambda$</td><td>một trừ lam-đa</td><td>xác suất một người thử <b>bỏ sót</b> một vấn đề</td><td>$1 - 0{,}31 = 0{,}69$</td></tr>
          <tr><td>$n$</td><td>en-nơ</td><td>số người thử độc lập cùng làm nhiệm vụ</td><td>$n = 5$ người</td></tr>
          <tr><td>$1 - (1 - \lambda)^n$</td><td>một trừ mở ngoặc một trừ lam-đa đóng ngoặc mũ n</td><td>tỉ lệ vấn đề được <b>ít nhất một</b> trong $n$ người phát hiện</td><td>$n = 5 \to \approx 0{,}844$</td></tr></table>
        introduces: [lambda]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn ký hiệu của bài. Chữ Hy Lạp lam-đa là tỉ lệ vấn đề khả dụng mà một người thử phát hiện được, ví dụ 0 phẩy 31. Một trừ lam-đa là xác suất một người bỏ sót vấn đề đó, bằng 0 phẩy 69. Chữ n là số người thử độc lập cùng làm nhiệm vụ. Biểu thức 1 trừ mở ngoặc 1 trừ lam-đa đóng ngoặc mũ n là tỉ lệ vấn đề được ít nhất một người phát hiện."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Kiểm thử khả dụng phát hiện trùng lặp ngày càng nhiều"
    checks:
      - "round(0.31 * 0.69, 4) == 0.2139"
    steps:
      - show: |
          <p>Ở bài 0, ta đã biết giao diện gây lỗi phải được kiểm bằng người thật làm nhiệm vụ cụ thể. Khi cho nhiều người thử độc lập trên cùng một bản thiết kế:</p>
          <table class="t"><tr><th>người thử</th><th>điều xảy ra</th><th>phần đóng góp mới</th></tr>
          <tr><td>Người thứ 1</td><td>thấy khoảng $\lambda = 31\%$ số vấn đề</td><td>toàn bộ 31% là mới</td></tr>
          <tr><td>Người thứ 2</td><td>cũng thấy khoảng 31%, nhưng <b>trùng</b> một phần với người thứ 1</td><td>chỉ thêm $0{,}31 \cdot 0{,}69 \approx 21{,}4\%$ mới</td></tr>
          <tr><td>Người thứ 5 trở đi</td><td>phần lớn vấn đề họ gặp đều đã được người trước ghi nhận</td><td>đóng góp mới giảm nhanh</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở bài 0, ta đã biết giao diện gây lỗi phải được kiểm bằng người thật làm nhiệm vụ cụ thể. Người thử thứ nhất tìm ra khoảng 31 phần trăm số vấn đề, và tất cả đều mới. Người thứ hai cũng thấy 31 phần trăm, nhưng trùng một phần với người đầu, nên chỉ đóng góp thêm khoảng 21 phẩy 4 phần trăm mới. Từ người thứ năm trở đi, phần lớn vấn đề họ gặp đều đã được người trước ghi nhận."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đường cong bão hoà: 5 người đầu dốc đứng, 10 người sau gần phẳng"
    checks:
      - "[round(alg.hci_nielsen_found(k, 0.31) * 100, 1) for k in (1, 3, 5, 10, 15)] == [31.0, 67.1, 84.4, 97.6, 99.6]"
    steps:
      - show: |
          <div><svg width="1400" height="420" viewBox="0 0 1400 420">
          <line x1="120" y1="350" x2="920" y2="350" stroke="#1f2937" stroke-width="2.5"/>
          <line x1="120" y1="350" x2="120" y2="40" stroke="#1f2937" stroke-width="2.5"/>
          <line x1="120" y1="50" x2="920" y2="50" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 6"/>
          <polyline fill="none" stroke="#2a78d6" stroke-width="4" points="120,350 170,257 220,193 270,149 320,118 370,97 620,57 870,51"/>
          <circle cx="170" cy="257" r="7" fill="#2a78d6"/>
          <circle cx="270" cy="149" r="7" fill="#2a78d6"/>
          <circle cx="370" cy="97" r="9" fill="#059669"/>
          <circle cx="620" cy="57" r="7" fill="#eb6834"/>
          <circle cx="870" cy="51" r="7" fill="#dc2626"/>
          <line x1="370" y1="97" x2="370" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
