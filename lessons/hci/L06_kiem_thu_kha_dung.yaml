          <text x="120" y="382">0</text><text x="170" y="382">1</text><text x="270" y="382">3</text>
          <text x="370" y="382" fill="#059669" font-weight="bold">5</text>
          <text x="620" y="382">10</text><text x="870" y="382">15</text>
          <text x="500" y="412">số người thử n</text></g>
          <g font-size="21" fill="#1f2937" text-anchor="end">
          <text x="108" y="356">0%</text><text x="108" y="262">31%</text>
          <text x="108" y="102" fill="#059669" font-weight="bold">84,4%</text>
          <text x="108" y="56">100%</text></g>
          <g font-size="23" fill="#1f2937">
          <text x="955" y="110" fill="#059669" font-weight="bold">5 người đầu: 0% → 84,4%</text>
          <text x="955" y="155">(tăng 84,4 điểm phần trăm)</text>
          <text x="955" y="220" fill="#dc2626" font-weight="bold">10 người tiếp (6 → 15):</text>
          <text x="955" y="265">84,4% → 99,6% (chỉ thêm 15,2 điểm)</text>
          <text x="955" y="325" fill="#2a78d6">giữ tiền cho vòng sau khi đã sửa lỗi</text></g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ đường cong tỉ lệ vấn đề phát hiện được theo số người thử, với lam-đa bằng 0 phẩy 31. Năm người đầu tiên đưa đường cong vọt từ 0 lên 84 phẩy 4 phần trăm, tức điểm màu lục. Mười người tiếp theo, từ người thứ 6 tới người thứ 15, chỉ nhích đường cong từ 84 phẩy 4 lên 99 phẩy 6 phần trăm, thêm có 15 phẩy 2 điểm phần trăm. Vì vậy, giữ phần ngân sách đó cho vòng thử sau khi đã sửa lỗi sẽ hiệu quả hơn nhiều."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức từ xác suất cả n người cùng bỏ sót"
    checks:
      - "round((1 - 0.31) ** 3, 6) == 0.328509 and round(1 - (1 - 0.31) ** 3, 3) == 0.671"
      - "round(alg.hci_nielsen_found(3, 0.31), 3) == 0.671"
    steps:
      - show: |
          <p><b>Bước 1 — xác suất một người bỏ sót.</b> Xét một vấn đề có xác suất phát hiện $\lambda$. Vì một người chỉ có hai khả năng là thấy hoặc bỏ sót, nên xác suất người đó bỏ sót là:</p>
          $$p_{\text{sót, 1}} = 1 - \lambda$$
          <p class="note">Làm thử với $\lambda = 0{,}31$: một người bỏ sót với xác suất $1 - 0{,}31 = 0{,}69$.</p>
        focus: [1, 1, 2, 3]
        say: "Bước một là tính xác suất một người bỏ sót một vấn đề. Xét một vấn đề có xác suất phát hiện bằng lam-đa. Vì một người chỉ có hai khả năng là thấy hoặc bỏ sót, nên xác suất người đó bỏ sót bằng 1 trừ lam-đa. Làm thử với lam-đa bằng 0 phẩy 31, xác suất một người bỏ sót là 0 phẩy 69."
      - show: |
          <p><b>Bước 2 — xác suất cả $n$ người độc lập cùng bỏ sót.</b> Vì mỗi người thử làm việc riêng rẽ không nhìn nhau, xác suất cả $n$ người đều không thấy vấn đề là tích của $n$ thừa số $(1 - \lambda)$:</p>
          $$p_{\text{sót, } n} = (1 - \lambda)^n$$
          <p class="note">Làm thử với $n = 3$: $0{,}69^3 = 0{,}69 \cdot 0{,}69 \cdot 0{,}69 \approx 0{,}329$.</p>
        focus: [1, 2, 3]
        say: "Bước hai là xác suất cả n người độc lập cùng bỏ sót. Vì mỗi người thử làm việc riêng rẽ không nhìn nhau, nên xác suất cả n người đều không thấy vấn đề là 1 trừ lam-đa tất cả mũ n. Làm thử với 3 người, 0 phẩy 69 mũ 3 xấp xỉ bằng 0 phẩy 329."
      - clear: true
        show: |
          <p><b>Bước 3 — lấy phần bù để được tỉ lệ phát hiện.</b> Một vấn đề được phát hiện nghĩa là <b>không phải</b> cả $n$ người cùng bỏ sót, nên theo quy tắc biến cố đối:</p>
          $$\text{Tỉ lệ phát hiện}(n) = 1 - (1 - \lambda)^n$$
          <p class="note">Làm thử với $n = 3$: $1 - 0{,}69^3 \approx 1 - 0{,}329 = 0{,}671$ (67,1%) ✓. Đây là công thức của hai nhà nghiên cứu năm 1993 (Nielsen &amp; Landauer, 1993).</p>
        focus: [1, 2, 3, 3]
        say: "Bước ba là lấy phần bù để tìm tỉ lệ phát hiện. Vấn đề được phát hiện nghĩa là không phải cả n người cùng bỏ sót, nên tỉ lệ này bằng 1 trừ đi 1 trừ lam-đa mũ n. Làm thử với 3 người, 1 trừ 0 phẩy 329 bằng 0 phẩy 671, tức 67 phẩy 1 phần trăm. Đây là công thức nổi tiếng của hai nhà nghiên cứu công bố năm 1993."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ bằng số: 5 người, 15 người, và 3 vòng 5 người"
    checks:
      - "round(0.69 ** 5, 4) == 0.1564 and round(alg.hci_nielsen_found(5, 0.31), 3) == 0.844"
      - "round(0.69 ** 15, 4) == 0.0038 and round(alg.hci_nielsen_found(15, 0.31), 3) == 0.996"
      - "round(20 * alg.hci_nielsen_found(5, 0.31), 1) == 16.9 and round(20 * alg.hci_nielsen_found(15, 0.31), 1) == 19.9"
      - "round((20 - 16.9 + 10) * alg.hci_nielsen_found(5, 0.31), 1) == 11.1 and round(16.9 + 11.1, 1) == 28.0"
    steps:
      - show: |
          <p><b>Bước 1 — tính cho $n = 5$ người thử</b> với $\lambda = 0{,}31$:</p>
          $$0{,}69^5 \approx 0{,}1564 \implies 1 - 0{,}69^5 \approx \hlg{0{,}844}\ \text{(84,4\%)}$$
        introduces: [implies]
        focus: [1, 2, 2]
        say: "Bước một, ta tính cho 5 người thử với lam-đa bằng 0 phẩy 31. Ký hiệu mũi tên kép đọc là suy ra. Ta có 0 phẩy 69 mũ 5 xấp xỉ 0 phẩy 1564, suy ra tỉ lệ phát hiện là 1 trừ 0 phẩy 1564, xấp xỉ 0 phẩy 844, tức 84 phẩy 4 phần trăm."
      - show: |
          <p><b>Bước 2 — tính cho $n = 15$ người thử</b> trong cùng một vòng:</p>
          $$0{,}69^{15} \approx 0{,}0038 \implies 1 - 0{,}69^{15} \approx \hlb{0{,}996}\ \text{(99,6\%)}$$
          <p class="note">Tăng gấp 3 số người thử (từ 5 lên 15) chỉ tăng tỉ lệ phát hiện từ 84,4% lên 99,6% trên <b>cùng một bản thiết kế cũ</b>.</p>
        focus: [1, 2, 3]
        say: "Bước hai, tính cho 15 người thử trong cùng một vòng. Ta có 0 phẩy 69 mũ 15 xấp xỉ 0 phẩy 0038, suy ra tỉ lệ phát hiện xấp xỉ 0 phẩy 996, tức 99 phẩy 6 phần trăm. Tăng gấp ba số người thử chỉ tăng tỉ lệ phát hiện thêm 15 phẩy 2 điểm phần trăm trên cùng bản thiết kế cũ."
      - clear: true
        show: |
          <p><b>Bước 3 — so sánh trên một sản phẩm có 20 lỗi ban đầu</b> (số minh hoạ). Khi sửa xong đợt 1, người dùng mới đi sâu hơn vào luồng thanh toán và bộc lộ <b>10 lỗi tầng sâu</b> mà đợt 1 bị chặn chưa chạm tới:</p>
          <table class="t"><tr><th>cách dùng 15 người</th><th>vòng 1 (trên 20 lỗi đầu)</th><th>vòng 2 (trên 3,1 lỗi sót + 10 lỗi sâu = 13,1 lỗi)</th><th>tổng lỗi tìm được</th></tr>
          <tr><td>1 vòng × 15 người</td><td>$20 \cdot 0{,}996 \approx 19{,}9$ lỗi</td><td>không còn người thử sau khi sửa</td><td class="red">19,9 lỗi</td></tr>
          <tr><td>vòng 1 (5 người) + vòng 2 (5 người)</td><td>$20 \cdot 0{,}844 \approx 16{,}9$ lỗi</td><td>$13{,}1 \cdot 0{,}844 \approx 11{,}1$ lỗi</td><td class="green">28,0 lỗi (và còn 5 người cho vòng 3)</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3"]
        say: "Bước ba, ta so sánh bằng số minh hoạ khi giao diện có 20 lỗi ban đầu. Khi sửa xong đợt một, người dùng mới đi sâu hơn vào luồng thanh toán và làm lộ thêm 10 lỗi tầng sâu. Nếu dồn cả 15 người vào một vòng, ta tìm được 19 phẩy 9 lỗi ban đầu nhưng hết sạch người thử sau khi sửa. Còn nếu chia thành từng vòng 5 người, vòng một tìm được 16 phẩy 9 lỗi, sửa xong vòng hai tìm tiếp 11 phẩy 1 lỗi. Tổng cộng chỉ sau hai vòng đã tìm được 28 lỗi mà vẫn còn 5 người cho vòng ba."
      - show: |
          <p><b>Bước 4 — kết luận thiết kế vòng thử.</b> Mỗi lần sửa giao diện vừa <b>mở đường</b> tới các bước từng bị chặn, vừa có thể <b>sinh lỗi mới</b>, nên 3 vòng × 5 người luôn thắng 1 vòng × 15 người.</p>
        focus: [1, 1]
        say: "Bước bốn, ta rút ra nguyên tắc tổ chức kiểm thử. Mỗi lần sửa giao diện vừa mở đường tới các bước trước đó bị chặn, vừa có thể sinh ra lỗi mới, nên ba vòng 5 người luôn thắng một vòng 15 người."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: cộng phần mới từng người, và tích lũy thừa"
    checks:
      - "round(sum(0.31 * (0.69 ** k) for k in range(5)), 4) == round(alg.hci_nielsen_found(5, 0.31), 4)"
      - "round(1 - (0.69 ** 5) ** 3, 4) == round(alg.hci_nielsen_found(15, 0.31), 4)"
    steps:
      - show: |
          <p><b>Đường khác 1 — cộng phần đóng góp mới của từng người từ 1 tới 5.</b> Người thứ $k$ chỉ đóng góp mới trên phần lỗi mà $k - 1$ người trước đã bỏ sót, tức $\lambda \cdot (1 - \lambda)^{k - 1}$:</p>
          $$0{,}31 + 0{,}31 \cdot 0{,}69 + 0{,}31 \cdot 0{,}69^2 + 0{,}31 \cdot 0{,}69^3 + 0{,}31 \cdot 0{,}69^4 \approx 0{,}8436 \approx \hlg{84{,}4\%}\ \checkmark$$
        focus: [1, 2]
        say: "Ta kiểm tra theo đường thứ nhất bằng cách cộng phần đóng góp mới của từng người từ 1 tới 5. Vì người thứ k chỉ tìm mới trên phần mà các người trước đã sót, cộng năm số hạng lại ta được 0 phẩy 8436, tức 84 phẩy 4 phần trăm."
      - show: |
          <p><b>Đường khác 2 — tính 15 người từ kết quả của nhóm 5 người.</b> Vì 15 người là 3 nhóm 5 người độc lập, xác suất cả 15 người cùng bỏ sót bằng lập phương xác suất một nhóm 5 người bỏ sót:</p>
          $$1 - \left(0{,}69^5\right)^3 \approx 1 - 0{,}1564^3 \approx 1 - 0{,}0038 = \hlb{0{,}996}\ \checkmark$$
        focus: [1, 2]
        say: "Kiểm tra thứ hai, vì 15 người là ba nhóm 5 người độc lập, nên xác suất cả 15 người bỏ sót bằng xác suất một nhóm 5 người bỏ sót mũ 3. Lấy 1 trừ đi 0 phẩy 1564 mũ 3, ta cũng được 0 phẩy 996, khớp với bước hai."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Bốn lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round(alg.hci_nielsen_found(5, 0.10) * 100, 1) == 41.0"
      - "round(alg.hci_nielsen_found(15, 0.10) * 100, 1) == 79.4"
      - "round(alg.hci_nielsen_found(5, 0.40) * 100, 1) == 92.2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Coi $\lambda = 0{,}31$ là hằng số vũ trụ cho mọi sản phẩm <b class="red">(với lỗi hiếm $\lambda = 0{,}10$, 5 người chỉ thấy 41,0%)</b></div>
          <table class="t"><tr><th>loại vấn đề</th><th>$\lambda$</th><th>5 người thấy</th><th>15 người thấy</th></tr>
          <tr><td>trung bình khảo sát năm 1993</td><td>$0{,}31$</td><td>84,4%</td><td>99,6%</td></tr>
          <tr><td>lỗi ở nhánh phụ hoặc sản phẩm phức tạp</td><td>$0{,}10$</td><td class="red">41,0%</td><td>79,4%</td></tr></table>
          <p class="note">Con số 31% chỉ là trung bình của các dự án khảo sát năm 1993. Phép thử: theo dõi xem người thứ 4 và thứ 5 có còn gặp lỗi mới hoàn toàn không; nếu còn nhiều, $\lambda$ thực tế đang thấp.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ nhất rất hay gặp ở người đã đi làm là coi 31 phần trăm như hằng số cho mọi sản phẩm. Con số 31 phần trăm chỉ là trung bình của các dự án khảo sát năm 1993. Với sản phẩm phức tạp có lam-đa bằng 0 phẩy 10, năm người chỉ thấy 41 phần trăm số lỗi. Phép thử là xem người thứ tư và thứ năm có còn gặp nhiều lỗi mới hoàn toàn hay không."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Gộp chung nhiều nhóm người dùng khác hẳn nhau vào con số 5 người <b class="red">(mỗi nhóm chỉ có 1–2 người)</b>
          <br><span class="note">Ứng dụng có cả người mua lẫn người bán (hai màn hình, hai nhiệm vụ khác nhau): phải dùng <b>ít nhất 3–5 người cho mỗi nhóm</b>, không phải 5 người chia đôi.</span></div>
          <div class="box warn"><b>Lỗi 3.</b> Cộng thẳng $5 \cdot 31\% = 155\%$ <b class="red">(quên trừ phần trùng lặp giữa các người thử)</b>
          <br><span class="note">Phép thử biên: tỉ lệ vấn đề tìm thấy không bao giờ vượt 100%, nên công thức đúng phải là $1 - (1 - \lambda)^n$.</span></div>
        focus: [1, 1, 2, 2]
        say: "Lỗi thứ hai là gộp nhiều nhóm người dùng khác hẳn nhau vào chung 5 người. Nếu sản phẩm có cả người mua lẫn người bán làm hai nhiệm vụ khác nhau, bạn cần từ 3 tới 5 người cho mỗi nhóm. Lỗi thứ ba là lấy 5 nhân 31 phần trăm ra 155 phần trăm vì quên phần trùng lặp. Phép thử biên cho thấy tỉ lệ không thể vượt 100 phần trăm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Người điều phối gợi ý cách bấm trong lúc thử <b class="red">(làm $\lambda$ giả tạo, mất lỗi thật)</b>
          <br><span class="note">Khi người dùng ngập ngừng mà bạn chỉ chỗ bấm, vấn đề bị che đi. Phép thử: giao nhiệm vụ rõ ràng rồi giữ im lặng quan sát nơi họ vấp.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư là người điều phối sốt ruột gợi ý cách bấm ngay trong lúc thử, làm lỗi thật bị che mất. Phép thử đúng là giao nhiệm vụ rõ ràng rồi giữ im lặng quan sát nơi người dùng tự vấp."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính tỉ lệ phát hiện và chọn kế hoạch kiểm thử"
    checks:
      - "round(alg.hci_nielsen_found(4, 0.25), 4) == 0.6836 and round(1 - (3 / 4) ** 4, 4) == 0.6836"
      - "math.ceil(math.log(1 - 0.80) / math.log(1 - 0.20)) == 8 and alg.hci_nielsen_found(7, 0.20) < 0.80 < alg.hci_nielsen_found(8, 0.20)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Với sản phẩm có $\lambda = 0{,}25$, cho $n = 4$ người thử độc lập thì phát hiện được bao nhiêu phần trăm vấn đề?</td></tr>
          <tr><td>2</td><td>Với nhóm lỗi khó hơn có $\lambda = 0{,}20$, cần tối thiểu bao nhiêu người thử trong một vòng để phát hiện ít nhất 80% vấn đề?</td></tr>
          <tr><td>3</td><td>Đội bạn có ngân sách 12 người thử cho ứng dụng gồm 2 vai trò tách biệt (bác sĩ kê đơn và bệnh nhân đặt lịch). Bạn phân bổ thế nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với lam-đa bằng 0 phẩy 25 và 4 người thử độc lập, tỉ lệ vấn đề phát hiện được là bao nhiêu? Câu hai, với lam-đa bằng 0 phẩy 20, cần tối thiểu mấy người để phát hiện ít nhất 80 phần trăm vấn đề? Câu ba, có ngân sách 12 người cho ứng dụng gồm bác sĩ và bệnh nhân, bạn phân bổ thế nào? Dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> Xác suất một người bỏ sót là $1 - 0{,}25 = 0{,}75 = \frac{3}{4}$. Sau 4 người độc lập:</p>
          $$1 - 0{,}75^4 = 1 - \frac{81}{256} = \frac{175}{256} \approx \hlg{0{,}6836}\ \text{(68,4\%)}$$
          <p><b>Đáp án câu 2.</b> Với $\lambda = 0{,}20$, một người bỏ sót $0{,}80$. Thử $n = 7$: $1 - 0{,}80^7 \approx 0{,}790 \lt 0{,}80$ (chưa đủ); thử $n = 8$: $1 - 0{,}80^8 \approx 0{,}832 \ge 0{,}80$ → cần tối thiểu $\hlb{8}$ người.</p>
        focus: [1, 2, 3]
        say: "Đáp án câu một, xác suất một người bỏ sót là 0 phẩy 75, tức ba phần tư. Sau 4 người độc lập, ta lấy 1 trừ đi 81 phần 256, được 175 phần 256, xấp xỉ 68 phẩy 4 phần trăm. Ở câu hai, với 7 người ta mới đạt 79 phần trăm, chưa đủ 80, còn với 8 người ta đạt 83 phẩy 2 phần trăm, nên cần tối thiểu 8 người."
      - show: |
          <table class="t"><tr><th>câu 3: phương án</th><th>được</th><th>mất</th><th>khi nào đổi lựa chọn</th></tr>
          <tr><td><b>2 vòng × (3 bác sĩ + 3 bệnh nhân)</b> = 12 người</td><td>mỗi vai trò đều được thử ở cả bản đầu lẫn bản sau khi sửa lỗi</td><td>mỗi vòng chỉ 3 người mỗi vai trò (thấy khoảng 67,1% lỗi nếu $\lambda = 0{,}31$)</td><td>khi một vai trò đã rất ổn định, dồn người sang vai trò mới</td></tr>
          <tr><td>1 vòng × (6 bác sĩ + 6 bệnh nhân)</td><td>vòng đầu thấy khoảng 89,2% lỗi mỗi bên</td><td class="red">hết ngân sách, không kiểm được bản sau khi sửa</td><td>chỉ khi chấm nghiệm thu cuối cùng, không sửa thêm</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Ở câu ba, ta chọn phương án chia làm hai vòng, mỗi vòng gồm 3 bác sĩ và 3 bệnh nhân. Cách này giúp cả hai vai trò đều được kiểm lại sau khi sửa lỗi, dù mỗi vòng với 3 người chỉ thấy khoảng 67 phẩy 1 phần trăm lỗi. Chỉ khi nghiệm thu cuối cùng không sửa thêm, hoặc khi một vai trò đã thật sự ổn định, ta mới dồn người theo cách khác."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">1 người bỏ sót: 1 − λ</span><span class="a">→</span>
          <span class="n">n người độc lập cùng bỏ sót: (1 − λ)ⁿ</span><span class="a">→</span>
          <span class="n">tỉ lệ phát hiện: 1 − (1 − λ)ⁿ</span><span class="a">→</span>
          <span class="n">5 người thấy 84,4% khi λ = 0,31</span><span class="a">→</span>
          <span class="n">chia nhiều vòng nhỏ sau mỗi đợt sửa</span></div>
        say: "Tổng kết lại, từ xác suất một người bỏ sót là 1 trừ lam-đa, ta suy ra xác suất cả n người bỏ sót rồi lấy phần bù. Với lam-đa bằng 0 phẩy 31, năm người đã thấy 84 phẩy 4 phần trăm lỗi, nên chia nhiều vòng nhỏ sau mỗi đợt sửa luôn lợi hơn một vòng lớn."
      - show: |
          <div class="box key"><b>Tư duy:</b> kiểm thử khả dụng không phải cuộc thi tìm hết lỗi trong một lần, mà là vòng lặp <b>thử nhỏ → sửa ngay → thử lại</b>, và luôn hỏi $\lambda$ của bài toán mình lớn hay nhỏ.</div>
        say: "Tư duy cần mang theo là kiểm thử khả dụng không phải cuộc thi tìm hết lỗi trong một lần. Hãy lặp vòng thử nhỏ, sửa ngay rồi thử lại, và luôn tự hỏi hệ số phát hiện của bài toán mình lớn hay nhỏ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>Đo cảm nhận: thang khả dụng hệ thống SUS</b> — sau khi người dùng làm xong nhiệm vụ, làm sao đo cảm nhận chủ quan của họ bằng 10 câu hỏi và vì sao câu chẵn phải đảo chiều.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học cách đo cảm nhận bằng thang khả dụng hệ thống mười câu. Ta sẽ xem cách tính điểm từ 10 câu trả lời 1 tới 5 và vì sao các câu chẵn phải đảo chiều. Hẹn gặp bạn ở bài tiếp theo."
