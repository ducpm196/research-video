id: L12
course: HCI
series: "HCI · Tương tác người–máy"
title: "Bài 12 — Hành trình: chuẩn tiếp cận web từ 14 hướng dẫn năm 1999 tới tiêu chí đo được năm 2008–2023"
version: 2
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/hci.yaml L12; audit/hci/verify_hci.py L12; audit/hci/sources_L12.md; [W99] W3C Recommendation, Web Content Accessibility Guidelines 1.0 (5/1999); [W08] W3C Recommendation, Web Content Accessibility Guidelines 2.0 (12/2008); [W18] W3C Recommendation, Web Content Accessibility Guidelines 2.1 (6/2018); [W23] W3C Recommendation, Web Content Accessibility Guidelines 2.2 (10/2023); HCI bài 2 (thời gian trỏ); HCI bài 4 (tải nhận thức); HCI bài 9 (kích thước đích chạm)"
assumes: [arith, cdot, frac, approx, geq, sub, sub2, in, power, ltgt, det, implies, log]
objectives:
  - "Kể lại bốn chặng 1999 → 2008 → 2018 → 2023 của chuẩn tiếp cận web, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt: 65 điểm kiểm năm 1999, tương phản 21:1 năm 2008, dòng lại 320 px năm 2018, diện tích 576 px² năm 2023"
  - "Chọn bộ tiêu chí kiểm tự động kết hợp thử nghiệm người thật theo quy mô sản phẩm"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ 14 hướng dẫn định tính năm 1999 tới 86 tiêu chí đo được bằng máy năm 2023"
    checks:
      - "16 + 30 + 19 == 65"
      - "78 - 1 + 9 == 86"
    steps:
      - show: |
          <table class="t"><tr><th>năm</th><th>phiên bản chuẩn</th><th>quy mô tiêu chí kiểm thử</th></tr>
          <tr><td>1999</td><td>Chuẩn tiếp cận web 1.0 [W99]</td><td><b>14 hướng dẫn</b>, $16 + 30 + 19 = \mathbf{65}$ điểm kiểm định tính</td></tr>
          <tr><td>2008</td><td>Chuẩn tiếp cận web 2.0 [W08]</td><td><b>4 nguyên tắc</b>, 12 hướng dẫn, <b>61</b> tiêu chí kiểm được độc lập công nghệ</td></tr>
          <tr><td>2018</td><td>Chuẩn tiếp cận web 2.1 [W18]</td><td>giữ nguyên nền cũ, thêm 17 tiêu chí di động → <b>78</b> tiêu chí</td></tr>
          <tr><td>2023</td><td>Chuẩn tiếp cận web 2.2 [W23]</td><td>bỏ 1 tiêu chí lỗi thời, thêm 9 tiêu chí nhận thức → <b>86</b> tiêu chí hiệu lực</td></tr></table>
          <div class="box key">Hôm nay: đi dọc 24 năm tiến hoá của chuẩn tiếp cận web — xem mỗi thời kỳ web thay đổi đã làm nảy sinh điểm nghẽn gì, và chuyên gia đã chuẩn hoá các phép đo công học ra sao.</div>
        focus: ["1.2", "1.5", 2, 2]
        say: "Chào bạn, năm 1999, chuẩn tiếp cận web ra đời với 14 hướng dẫn sơ khai gắn liền với các trang web tĩnh. Đến năm 2023, chuẩn đã phát triển thành 86 tiêu chí đo lường chính xác bằng máy. Hôm nay ta sẽ đi lại hành trình 24 năm đó. Ta xem mỗi giai đoạn công nghệ đã làm lộ ra điểm nghẽn nào, và các chuyên gia quốc tế đã chuẩn hoá kỹ thuật ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: ba trụ cột công học của khoá học"
    checks:
      - "24 * 24 == 576"
      - "44 * 44 == 1936"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>kiến thức công học</th><th>ứng dụng trong chuẩn tiếp cận</th></tr>
          <tr><td>Bài 2</td><td>Định luật thời gian trỏ</td><td>Thời gian chạm tỉ lệ với $\log_2(2D/W)$; nút bấm quá nhỏ làm tăng mạnh thời gian và lỗi bấm trượt</td></tr>
          <tr><td>Bài 4</td><td>Tải nhận thức và trí nhớ ngắn hạn</td><td>Giới hạn 4 mảnh thông tin; người khuyết tật nhận thức gặp khó khi phải nhớ mật khẩu phức tạp</td></tr>
          <tr><td>Bài 9</td><td>Kích thước đích chạm công thái học</td><td>Ngón tay cái người lớn che khuất diện tích chạm; chuẩn quy định tối thiểu $24 \times 24$ điểm ảnh</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Trước hết, ta ôn lại ba trụ cột công học từ các bài trước. Bài 2 chỉ ra rằng nút càng nhỏ thì người dùng càng mất nhiều thời gian và dễ bấm trượt. Bài 4 chứng minh trí nhớ ngắn hạn có giới hạn nên không bắt người dùng nhớ chuỗi ký tự ngẫu nhiên. Bài 9 khẳng định ngón tay người lớn cần diện tích tiếp xúc tối thiểu 24 nhân 24 điểm ảnh."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình chuẩn tiếp cận web"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa trong hành trình</th></tr>
          <tr><td><b>Điểm kiểm định tính</b></td><td>Quy định bằng lời mô tả chung chung, phụ thuộc vào cách diễn giải của người đánh giá (chuẩn 1999)</td></tr>
          <tr><td><b>Tiêu chí kiểm chứng được</b></td><td>Quy tắc có thể viết thành thuật toán hoặc kiểm thử đúng/sai rõ ràng bằng công cụ tự động (từ 2008)</td></tr>
          <tr><td><b>Tỉ lệ tương phản</b></td><td>Tỉ số độ chói $(L_1 + 0{,}05) / (L_2 + 0{,}05)$ giữa màu chữ và màu nền để mắt người đọc rõ</td></tr>
          <tr><td><b>Tự động dàn dòng lại</b></td><td>Khả năng trang web tự co giãn nội dung về một cột cuộn dọc khi người nhìn kém phóng to $400\%$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng tóm tắt bốn thuật ngữ then chốt của hành trình. Điểm kiểm định tính là các quy định bằng lời văn chung chung rất khó đo lường tự động. Tiêu chí kiểm chứng được là các quy tắc có thể viết thành mã kiểm thử máy tính. Tỉ lệ tương phản là công thức toán học đo độ chênh sáng giữa chữ và nền. Tự động dàn dòng lại là khả năng giao diện co giãn về một cột khi phóng to 400 phần trăm."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Dòng thời gian bốn chặng phát triển của chuẩn tiếp cận web"
    steps:
      - show: |
          <div><svg width="1440" height="380" viewBox="0 0 1440 380">
          <line x1="80" y1="180" x2="1360" y2="180" stroke="#334155" stroke-width="4"/>
          <circle cx="160" cy="180" r="16" fill="#3b82f6"/>
          <circle cx="540" cy="180" r="16" fill="#10b981"/>
          <circle cx="920" cy="180" r="16" fill="#f59e0b"/>
          <circle cx="1280" cy="180" r="16" fill="#8b5cf6"/>
          <g font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">
          <text x="160" y="130">1999</text>
          <text x="540" y="130">2008</text>
          <text x="920" y="130">2018</text>
          <text x="1280" y="130">2023</text>
          </g>
          <g font-size="19" fill="#1e293b" text-anchor="middle">
          <text x="160" y="230">Chuẩn 1.0</text>
          <text x="160" y="260">14 hướng dẫn</text>
          <text x="160" y="290">Gắn chặt trang web tĩnh</text>

          <text x="540" y="230">Chuẩn 2.0</text>
          <text x="540" y="260">4 nguyên tắc lớn</text>
          <text x="540" y="290">Tương phản số học 21:1</text>

          <text x="920" y="230">Chuẩn 2.1</text>
          <text x="920" y="260">Kỷ nguyên di động</text>
          <text x="920" y="290">Dàn dòng lại 320 px</text>

          <text x="1280" y="230">Chuẩn 2.2</text>
          <text x="1280" y="260">Đích chạm 24 px</text>
          <text x="1280" y="290">Bảo vệ nhận thức</text>
          </g>
          <text x="720" y="350" font-size="20" fill="#dc2626" font-weight="bold" text-anchor="middle">Mỗi chặng: Bối cảnh công nghệ → Điểm nghẽn → Cách chuẩn hoá → Con số then chốt</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Sơ đồ trục thời gian qua bốn mốc lịch sử. Năm 1999 đặt nền móng với 14 hướng dẫn cho trang web tĩnh. Năm 2008 đưa ra công thức tương phản số học độc lập công nghệ. Năm 2018 bổ sung các tiêu chuẩn cho màn hình cảm ứng di động. Và năm 2023 hoàn thiện các quy định về nhận thức và kích thước chạm tối thiểu."

  # ───────────────────────── 5. CHẶNG 1 (1999) ─────────────────────────
  - id: stage1
    kind: example
    title: "Năm 1999 — Khai sinh: 14 hướng dẫn và 65 điểm kiểm định tính"
    stage:
      year: "1999"
      scale: "Web văn bản tĩnh, khởi đầu kỷ nguyên chuẩn hoá trợ năng"
      source: "[W99]"
      practice: "Cung cấp văn bản thay thế tương đương cho mọi nội dung nghe nhìn phi văn bản"
    checks:
      - "16 + 30 + 19 == 65"
    steps:
      - show: |
          <p><b>Bối cảnh 1999:</b> Web chủ yếu là các văn bản liên kết tĩnh; hình ảnh bắt đầu tràn ngập làm người khiếm thị dùng trình đọc màn hình bị mù thông tin.</p>
          <table class="t"><tr><th>mức ưu tiên</th><th>số điểm kiểm</th><th>ý nghĩa bắt buộc</th></tr>
          <tr><td>Ưu tiên 1</td><td>16</td><td>Nhà phát triển bắt buộc phải đáp ứng, nếu không người khuyết tật không thể tiếp cận</td></tr>
          <tr><td>Ưu tiên 2</td><td>30</td><td>Nên đáp ứng để loại bỏ các rào cản nghiêm trọng</td></tr>
          <tr><td>Ưu tiên 3</td><td>19</td><td>Có thể đáp ứng để nâng cao trải nghiệm</td></tr>
          <tr><td><b>Tổng cộng</b></td><td><b>65</b></td><td>$16 + 30 + 19 = \hlg{65\text{ điểm kiểm}}$ [W99]</td></tr></table>
          <p class="note"><b>Điểm nghẽn 1999:</b> Nhiều tiêu chí dùng từ ngữ định tính như “cho đến khi trình duyệt hỗ trợ” và gắn cứng vào cấu trúc mã thời đó, khiến máy tính không thể tự động kiểm thử tính tuân thủ.</p>
        focus: [1, 2, 3]
        say: "Ở chặng đầu tiên năm 1999, chuẩn phiên bản 1.0 ra đời với 14 hướng dẫn và 65 điểm kiểm tra. Nguyên tắc cốt lõi là luôn có văn bản mô tả thay thế cho hình ảnh. Tuy nhiên, các tiêu chí thời đó mang tính định tính nên máy tính chưa thể tự động đánh giá."

  # ───────────────────────── 6. CHẶNG 2 (2008) ─────────────────────────
  - id: stage2
    kind: example
    title: "Năm 2008 — Tăng trưởng: 4 nguyên tắc và công thức tương phản 21:1"
    stage:
      year: "2008"
      scale: "Web ứng dụng động bùng nổ, kiểm thử tự động hoá diện rộng"
      source: "[W08]"
      practice: "Độc lập công nghệ và đo lường định lượng tương phản màu sắc bằng công thức số học"
    checks:
      - "round((1.0 + 0.05) / (0.0 + 0.05)) == 21"
      - "round((1.0 + 0.05) / (0.2 + 0.05), 1) == 4.2"
    steps:
      - show: |
          <p><b>Bước đột phá 2008:</b> Tách chuẩn khỏi ngôn ngữ cụ thể, chia thành <b>4 nguyên tắc lớn</b>:</p>
          <p>• <b>Cảm nhận được:</b> người dùng phải thấy hoặc nghe được thông tin.<br>• <b>Vận hành được:</b> mọi nút bấm phải điều khiển được bằng bàn phím.<br>• <b>Hiểu được:</b> nội dung và cách điều hướng rõ ràng, dễ đoán.<br>• <b>Vững chắc:</b> mã nguồn tương thích tốt với các phần mềm trợ năng.</p>
          <p><b>Công thức tỉ lệ tương phản màu sắc $C$:</b></p>
          $$C = \frac{L_1 + 0{,}05}{L_2 + 0{,}05} \quad (\text{với } L_1 \ge L_2 \in [0, 1] \text{ là độ chói tương đối})$$
          <p>Tương phản cực đại giữa chữ trắng ($L_1 = 1$) và nền đen ($L_2 = 0$):</p>
          $$C_{\text{max}} = \frac{1 + 0{,}05}{0 + 0{,}05} = \frac{1{,}05}{0{,}05} = \hlg{21:1}$$
          <p class="note">Mức tiêu chuẩn thông dụng yêu cầu tỉ lệ tối thiểu <b>$4{,}5:1$</b> cho chữ thường để người thị lực kém đọc được.</p>
        focus: [1, 3, 4, 5]
        say: "Năm 2008, phiên bản 2.0 tạo bước ngoặt lớn với bốn nguyên tắc bất biến. Điểm đặc sắc là tổ chức quốc tế đã đưa ra công thức số học đo tỉ lệ tương phản màu sắc. Tỉ lệ giữa màu trắng và đen đạt mức tối đa 21 trên 1. Tiêu chuẩn bắt buộc mọi văn bản thường phải đạt độ tương phản tối thiểu 4 phẩy 5 trên 1."

  # ───────────────────────── 7. CHẶNG 3 (2018) ─────────────────────────
  - id: stage3
    kind: example
    title: "Năm 2018 — Quy mô lớn: kỷ nguyên di động và dàn dòng lại 320 px"
    stage:
      year: "2018"
      scale: "Hàng tỉ điện thoại thông minh và máy tính bảng thống trị truy cập web"
      source: "[W18]"
      practice: "Thiết kế đáp ứng không cuộn ngang và đảm bảo đích chạm ngón tay"
    checks:
      - "61 + 17 == 78"
      - "1280 // 4 == 320"
      - "44 * 44 == 1936"
    steps:
      - show: |
          <p><b>Bối cảnh 2018:</b> Người dùng truy cập bằng điện thoại di động vượt qua máy tính bàn; chuẩn 2.0 thiếu quy định cho cảm ứng và phóng to màn hình.</p>
          <table class="t"><tr><th>quy mô tiêu chí</th><th>điểm nghẽn mới trên di động</th><th>tiêu chuẩn hoá năm 2018</th></tr>
          <tr><td>$61 + 17 = \mathbf{78}$ tiêu chí [W18]</td><td>Người kém mắt phóng to chữ bị tràn khung hình</td><td><b>Tiêu chí dàn dòng lại:</b> ở chiều rộng <b>320 điểm ảnh</b>, nội dung tự cuộn dọc, cấm cuộn ngang</td></tr>
          <tr><td>Đích chạm cảm ứng</td><td>Ngón tay chạm trúng nút lân cận</td><td><b>Đích chạm mức cao nhất:</b> tối thiểu $44 \times 44$ điểm ảnh ($1936\text{ px}^2$)</td></tr></table>
          <p class="note">Phép tính tương đương: màn hình máy tính $1280\text{ px}$ khi người nhìn kém phóng đại $400\%$ thì chiều rộng hiệu dụng còn:</p>
          $$\frac{1280}{4} = \hlg{320\text{ điểm ảnh}}$$
        focus: [1, 2, 3]
        say: "Đến năm 2018, chuẩn được bổ sung 17 tiêu chí mới để đáp ứng làn sóng điện thoại thông minh. Yêu cầu lớn nhất là trang web phải tự dàn dòng lại ở chiều rộng 320 điểm ảnh khi phóng to mà không cuộn ngang. Đồng thời, chuẩn đặt ra kích thước đích chạm tối thiểu 44 nhân 44 điểm ảnh cho mức tiêu chuẩn cao nhất."

  # ───────────────────────── 8. CHẶNG 4 (2023) ─────────────────────────
  - id: stage4
    kind: example
    title: "Năm 2023 — Ổn định và tiến hoá: đích chạm 24 px và bảo vệ nhận thức"
    stage:
      year: "2023"
      scale: "Hệ thống số đa nền tảng, trí tuệ nhân tạo và dịch vụ công trực tuyến"
      source: "[W23]"
      practice: "Bảo vệ chức năng nhận thức khi xác thực và tinh chỉnh kích thước đích chạm thực tế"
    checks:
      - "78 - 1 + 9 == 86"
      - "24 * 24 == 576"
      - "round(1936 / 576, 2) == 3.36"
    steps:
      - show: |
          <p><b>Tiến hoá 2023:</b> Chuẩn lược bỏ tiêu chí lỗi thời và hoàn thiện bộ 86 tiêu chí hiệu lực:</p>
          $$\text{Số tiêu chí} = 78 - 1\text{ (bỏ phân tích thẻ)} + 9\text{ (mới)} = \hlg{86\text{ tiêu chí}} [W23]$$
          <p><b>Hai tiêu chí then chốt của năm 2023:</b></p>
          <p>• <b>Đích chạm tối thiểu mức phổ thông (2.5.8):</b> kích thước tối thiểu $24 \times 24\text{ px}$ (diện tích $576\text{ px}^2$, nhỏ hơn mức tối cao $1936\text{ px}^2$ khoảng $3{,}36$ lần nhưng thực tế cho các bảng nút dày đặc).</p>
          <p>• <b>Xác thực dễ tiếp cận (3.3.8):</b> không bắt người dùng giải câu đố nhận thức phức tạp hoặc gõ lại mật khẩu mà cấm dán khi đăng nhập.</p>
        focus: [1, 2, 3, 4]
        say: "Năm 2023, phiên bản 2.2 loại bỏ tiêu chí kiểm tra cú pháp thẻ vì trình duyệt hiện đại đã tự xử lý tốt. Chuẩn bổ sung chín tiêu chí mới, nâng tổng số lên 86 tiêu chí hiệu lực. Nổi bật là quy định đích chạm tối thiểu 24 nhân 24 điểm ảnh cho các giao diện thực tế. Đồng thời, chuẩn cấm chặn thao tác dán mật khẩu để bảo vệ người có trí nhớ ngắn hạn hạn chế."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: kiểm chứng các con số cốt lõi của hành trình"
    checks:
      - "16 + 30 + 19 == 65"
      - "round((1.0 + 0.05) / (0.0 + 0.05)) == 21"
      - "78 - 1 + 9 == 86"
      - "round(1936 / 576, 2) == 3.36"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Tính toán tổng số tiêu chí qua các mốc lịch sử:</b></p>
          <p>• Năm 1999: $16 + 30 + 19 = \hlg{65\text{ điểm kiểm}}\ \checkmark$</p>
          <p>• Năm 2023: $78 - 1 + 9 = \hlg{86\text{ tiêu chí hiệu lực}}\ \checkmark$</p>
        focus: [1, 2]
        say: "Để tự kiểm tra tính nhất quán số học, ta tính lại số tiêu chí qua các mốc theo báo cáo chuẩn. Do năm 1999 có 65 điểm kiểm và năm 2023 có thêm bớt, ta suy ra tổng số tiêu chí hiệu lực là 86."
      - show: |
          <p><b>Kiểm tra 2 — Tỉ số diện tích giữa hai mức đích chạm:</b></p>
          $$\text{Mức cao nhất (2018)} = 44 \times 44 = 1936\text{ px}^2; \quad \text{Mức phổ thông (2023)} = 24 \times 24 = 576\text{ px}^2$$
          $$\text{Tỉ số diện tích} = \frac{1936}{576} = \frac{121}{36} \approx \hlg{3{,}36\text{ lần}}\ \checkmark$$
          <p class="note">Mức phổ thông giúp nhà thiết kế linh hoạt hơn gấp 3 lần về không gian nhưng vẫn giữ an toàn cho người dùng.</p>
        focus: [1, 2]
        say: "Ở phép kiểm tra thứ hai, ta thay toạ độ vào công thức để tính diện tích đích chạm. Vì 1936 chia cho 576 bằng 3 phẩy 36, nên mức mới giúp tiết kiệm không gian hơn 3 lần mà vẫn chuẩn công thái học."

  # ───────────────────────── 10. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Hai hiểu lầm tai hại khi áp dụng chuẩn tiếp cận web"
    checks:
      - "78 - 1 + 9 == 86"
    steps:
      - show: |
          <div class="box warn"><b>Hiểu lầm 1.</b> Đồng nhất việc “vượt qua công cụ quét tự động” với việc “người khuyết tật dùng được thực tế” <b class="red">(máy chỉ quét được khoảng 30% rào cản!)</b></div>
          <p class="note">Công cụ tự động chỉ bắt được lỗi thẻ và mã màu tương phản. Rào cản về thứ tự bấm phím điều hướng và khả năng hiểu ngữ cảnh bắt buộc phải kiểm thử bằng người thật.</p>
        focus: [1, 2]
        say: "Hiểu lầm phổ biến nhất là nghĩ rằng trang web đạt 100 điểm trên công cụ quét tự động thì người khuyết tật sẽ dùng được. Thực tế máy móc chỉ phát hiện được khoảng 30 phần trăm các lỗi cú pháp và màu sắc, còn độ mượt mà khi điều hướng bắt buộc phải thử bằng người thật."
      - show: |
          <div class="box warn"><b>Hiểu lầm 2.</b> Thấy chuẩn 2023 bỏ tiêu chí 4.1.1 liền nghĩ rằng có thể viết mã cẩu thả tuỳ ý <b class="red">(sai lầm nghiêm trọng!)</b></div>
          <p class="note">Chuẩn bỏ tiêu chí này chỉ vì trình duyệt hiện đại đã tự động sửa lỗi đóng mở thẻ HTML. Các thuộc tính mô tả vai trò nút bấm và nhãn trợ năng vẫn bắt buộc phải chính xác tuyệt đối.</p>
        focus: [1, 2]
        say: "Hiểu lầm thứ hai là nghĩ rằng khi chuẩn bỏ tiêu chí phân tích mã thì lập trình viên có thể viết thẻ tuỳ tiện. Chuẩn bỏ tiêu chí đó vì trình duyệt hiện đại tự sửa lỗi thẻ, nhưng các thuộc tính gắn nhãn nút bấm cho người mù vẫn bắt buộc phải làm đúng."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: thiết lập chiến lược kiểm thử trợ năng theo quy mô dự án"
    checks:
      - "round((1.0 + 0.05) / (0.2 + 0.05), 1) == 4.2"
      - "24 * 24 == 576"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Một nút bấm có màu nền đo được độ chói $L_2 = 0{,}20$ và chữ màu trắng ($L_1 = 1{,}00$). Tính tỉ lệ tương phản và kiểm tra xem có đạt ngưỡng $4{,}5:1$ cho chữ thường không.</td></tr>
          <tr><td>2</td><td>Đội phát triển của bạn có 3 người đang phụ trách 40 màn hình sản phẩm. Bạn nên phân bổ nguồn lực kiểm thử tiếp cận như thế nào giữa công cụ tự động và kiểm thử bằng người thật?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự luyện tập hai câu hỏi. Câu một, tính độ tương phản của chữ trắng trên nền có độ chói 0 phẩy 20 và đối chiếu với ngưỡng 4 phẩy 5. Câu hai, với đội ngũ ba người và 40 màn hình, bạn nên phân bổ kiểm thử thế nào? Hãy dừng video và suy nghĩ."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 — Tính tương phản:</b></p>
          $$C = \frac{1 + 0{,}05}{0{,}20 + 0{,}05} = \frac{1{,}05}{0{,}25} = \hlb{4{,}2:1} < 4{,}5:1 \implies \hlo{\text{Không đạt!}}$$
          <p class="note">Tỉ lệ $4{,}2:1$ chưa đạt ngưỡng $4{,}5:1$; cần chỉnh nền tối hơn ($L_2 \le 0{,}18$) để chữ hiển thị rõ nét.</p>
        focus: [1, 2]
        say: "Đáp án câu một, tỉ lệ tương phản đạt 4 phẩy 2 trên 1. Con số này nhỏ hơn ngưỡng quy định 4 phẩy 5 nên không đạt chuẩn, bạn cần chỉnh màu nền đậm hơn một chút."
      - show: |
          <p><b>Đáp án câu 2 — Chiến lược phân bổ kiểm thử:</b></p>
          <div class="box key"><b>Chiến lược kết hợp theo kim tự tháp:</b> Chạy công cụ quét tự động hàng ngày trên cả $40$ màn hình để bắt nhanh lỗi màu và thẻ. Nhưng dành thời gian thử nghiệm bằng bàn phím và trình đọc màn hình trên <b>5 luồng nghiệp vụ cốt lõi nhất</b> (như đăng ký, mua hàng, thanh toán).</div>
        focus: [1, 1]
        say: "Đáp án câu hai, chiến lược thông minh là dùng công cụ quét tự động hàng ngày cho toàn bộ 40 màn hình. Đồng thời, dành thời gian thử nghiệm thực tế với bàn phím trên năm luồng nghiệp vụ quan trọng nhất của sản phẩm."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic toàn bộ khoá học Tương tác người–máy"
    steps:
      - show: |
          <div class="chain"><span class="n">Đo lường cơ bản (Bài 0–1)</span><span class="a">→</span>
          <span class="n">Công thái học & Nhận thức (Bài 2–5)</span><span class="a">→</span>
          <span class="n">Đánh giá & Chống lỗi (Bài 6–10)</span><span class="a">→</span>
          <span class="n">Chuẩn tiếp cận toàn cầu (Bài 11–12)</span></div>
        focus: [1, 1]
        say: "Tổng kết toàn bộ khoá học Tương tác người máy, chúng ta đã đi từ các thước đo cơ bản tới chuẩn tiếp cận quốc tế. Thiết kế tốt không phải là làm cho đẹp mắt, mà là xây dựng sự thấu cảm và trách nhiệm bảo vệ người dùng."
      - clear: true
        show: |
          <div class="box key"><b>Tư duy chuyên gia mang theo:</b> Công nghệ số chỉ thực sự có giá trị khi bất kỳ ai, ở bất kỳ độ tuổi nào hay hoàn cảnh thể chất nào, cũng có thể tiếp cận và làm chủ nó một cách bình đẳng. Chúc mừng bạn đã hoàn thành khoá học!</div>
        focus: [1, 1]
        say: "Tư duy lớn nhất bạn cần mang theo là công nghệ chỉ thực sự có ý nghĩa khi phục vụ bình đẳng tất cả mọi người. Chúc mừng bạn đã hoàn thành trọn vẹn toàn bộ khoá học Tương tác người máy!"
