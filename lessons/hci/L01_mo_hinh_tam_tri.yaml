        say: "Hình vẽ đặt hai mặt bếp cạnh nhau để thấy ngay cơ chế của ánh xạ tự nhiên. Ở thiết kế A bên trái, bốn lò xếp hai chiều trên dưới trái phải nhưng bốn núm dưới đáy lại trải trên một đường thẳng ngang. Vì vậy núm thứ hai từ trái sang có thể ứng với lò trên hay lò dưới đều có lý. Sang thiết kế B bên phải, cụm bốn núm được thu nhỏ đúng thành hình vuông hai trên hai dưới nên người nấu nhìn là biết ngay."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra số cách ghép khi lệch chiều không gian và khi thu hẹp bằng phân cụm"
    checks:
      - "alg.hci_mappings(4) == 24"
      - "alg.hci_mappings(2) * alg.hci_mappings(2) == 4"
    steps:
      - show: |
          <p><b>Bước 1 — Đếm tổng số cách ghép một–một khi hoàn toàn không có gợi ý không gian.</b> Với 4 lò và 4 núm rời nhau:</p>
          $$\text{Số cách ghép toàn bộ} = 4 \cdot 3 \cdot 2 \cdot 1 = 4! = \hl{24}\text{ cách}$$
        focus: [1, 2]
        say: "Bước một, ta suy ra công thức đếm khi bốn núm xoay không có sự tương ứng không gian với bốn lò nấu. Vì núm đầu chọn trong 4 lò, núm hai còn 3, núm ba còn 2 và núm cuối còn 1, nên theo quy tắc nhân ta có 4 giai thừa bằng 24 cách ghép."
      - show: |
          <p><b>Bước 2 — Nếu tách thành 2 cụm trái–phải nhưng mỗi cụm vẫn xếp ngang.</b> Hai núm bên trái chỉ điều khiển 2 lò bên trái ($2!$ cách), hai núm bên phải điều khiển 2 lò bên phải ($2!$ cách):</p>
          $$\text{Số cách ghép khi chia đôi trái–phải} = 2! \cdot 2! = 2 \cdot 2 = \hlb{4}\text{ cách}$$
        focus: [1, 2]
        say: "Bước hai, giả sử nhà sản xuất đẩy hai núm sang hẳn bên trái và hai núm sang hẳn bên phải. Khi đó trong mỗi bên vẫn còn 2 giai thừa bằng 2 cách đoán xem núm nào là lò trên hay lò dưới, nên tổng cộng vẫn còn 2 nhân 2 bằng 4 cách ghép."
      - clear: true
        show: |
          <p><b>Bước 3 — Khi bố cục núm trùng khớp cả hai chiều trái–phải và trên–dưới.</b> Mỗi chiều chỉ còn đúng 1 thứ tự tự nhiên:</p>
          $$\text{Số cách ghép tự nhiên} = 1 \cdot 1 = \hlg{1}\text{ cách duy nhất}$$
        focus: [1, 2]
        say: "Bước ba, khi ta xếp cụm bốn núm theo cả hai chiều trái phải và trên dưới giống hệt mặt bếp, sự nhập nhằng biến mất hoàn toàn. Vì mỗi vị trí trong không gian chỉ còn đúng 1 cách ghép tự nhiên duy nhất, nên tải ghi nhớ của người dùng giảm về không."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính số cách hiểu của mặt bếp 4 lò và bảng công tắc phòng họp"
    checks:
      - "alg.hci_mappings(4) == 24"
      - "alg.hci_mappings(2) * alg.hci_mappings(2) == 4"
      - "alg.hci_mappings(3) == 6"
      - "24 // 4 == 6 and 24 // 1 == 24"
    steps:
      - show: |
          <p><b>Bước 1 — Đếm trực tiếp trên mặt bếp 4 lò xếp ô vuông.</b> Gọi 4 lò là $A$ (trái-trên), $B$ (trái-dưới), $C$ (phải-trên), $D$ (phải-dưới). Khi 4 núm xếp thành một hàng ngang:</p>
          $$\text{Núm 1 có } 4 \text{ cách}, \quad \text{Núm 2 có } 3 \text{ cách}, \quad \text{Núm 3 có } 2 \text{ cách}, \quad \text{Núm 4 có } 1 \text{ cách} \;\implies\; 4 \cdot 3 \cdot 2 \cdot 1 = \hl{24}$$
        focus: [1, 1, 2]
        say: "Ta làm từng bước bằng số với ví dụ mặt bếp bốn lò trong giáo án. Gọi bốn lò là A, B, C, D ở bốn góc của ô vuông. Khi bốn núm xoay đặt trên một hàng ngang, núm một có 4 khả năng, núm hai còn 3, núm ba còn 2 và núm bốn còn 1, nhân lại được 24 cách ghép."
      - show: |
          <p><b>Bước 2 — So sánh các quy ước ngầm của người dùng trên hàng ngang 4 núm.</b> Ngay cả khi đã quen nhìn từ trái sang phải, các người dùng vẫn có những mô hình tâm trí xung đột nhau:</p>
          <table class="t"><tr><th>người dùng đoán theo quy tắc</th><th>thứ tự 4 núm từ trái sang phải</th></tr>
          <tr><td>ưu tiên cột trái trước (trên → dưới), rồi cột phải (trên → dưới)</td><td>$(A, B, C, D)$</td></tr>
          <tr><td>ưu tiên cột trái (dưới → trên), rồi cột phải (dưới → trên)</td><td>$(B, A, D, C)$</td></tr>
          <tr><td>ưu tiên hàng dưới trước (trái → phải), rồi hàng trên (trái → phải)</td><td>$(B, D, A, C)$</td></tr>
          <tr><td>ưu tiên vòng ngoài vào trong (trái-dưới, trái-trên, phải-trên, phải-dưới)</td><td>$(B, A, C, D)$</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước hai, ngay cả khi không xét hết 24 hoán vị ngẫu nhiên, ta vẫn thấy ít nhất bốn quy tắc hợp lý mà những người dùng khác nhau tự đặt ra. Người thứ nhất đoán theo cột từ trên xuống dưới, người thứ hai đoán từ dưới lên trên vì lò dưới gần tay hơn, còn người thứ ba đoán theo hàng ngang."
      - clear: true
        show: |
          <p><b>Bước 3 — Thu gọn từ 24 cách xuống 4 cách rồi về 1 cách bằng thiết kế không gian.</b></p>
          <table class="t"><tr><th>bố cục bảng điều khiển</th><th>phép tính</th><th>số cách ghép còn lại</th><th>tỉ lệ giảm độ mơ hồ</th></tr>
          <tr><td>4 núm xếp 1 hàng ngang đều nhau</td><td>$4!$</td><td>$24$</td><td>mức gốc (phải dán nhãn)</td></tr>
          <tr><td>tách 2 núm trái và 2 núm phải (vẫn ngang)</td><td>$2! \cdot 2!$</td><td>$4$</td><td>giảm $24 / 4 = 6$ lần</td></tr>
          <tr><td>xếp 4 núm theo đúng ô vuông 2 × 2 như 4 lò</td><td>$1$</td><td>$\hlg{1}$</td><td>giảm $24 / 1 = 24$ lần (không cần nhãn)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, ta lập bảng so sánh hiệu quả của từng phương án sửa bố cục. Để nguyên một hàng ngang đều nhau thì có 24 cách ghép và bắt buộc phải in hình chú thích. Tách đôi thành cụm trái và cụm phải giúp giảm 6 lần xuống còn 4 cách. Còn xếp bốn núm theo đúng ô vuông hai nhân hai thì giảm 24 lần về đúng 1 cách tự nhiên, không cần đọc nhãn chữ nào."
      - show: |
          <p><b>Bước 4 — Áp dụng tương tự cho phòng họp có 3 cụm đèn trần.</b> Ba cụm đèn xếp theo chiều sâu của phòng (bục giảng, giữa phòng, cuối phòng) nhưng 3 công tắc trên tường lại xếp ngang:</p>
          $$\text{Số cách ghép của 3 công tắc ngang} = 3! = 3 \cdot 2 \cdot 1 = \hl{6}\text{ cách}$$
        focus: [1, 2]
        say: "Bước bốn, ta áp dụng ngay cho bảng công tắc đèn trong phòng họp có ba dãy đèn bố trí từ bục giảng ra cuối phòng. Khi ba công tắc gắn ngang trên tường, người bước vào phòng đứng trước 3 giai thừa bằng 6 cách ghép nên hầu như luôn phải bật thử từng cái."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng liệt kê toàn bộ hoán vị của 3 nút và công thức đệ quy"
    checks:
      - "len(list(__import__('itertools').permutations([1, 2, 3]))) == 6 == alg.hci_mappings(3)"
      - "4 * alg.hci_mappings(3) == 24 == alg.hci_mappings(4)"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Liệt kê tường minh mọi cách ghép của 3 nút với 3 thiết bị $(X, Y, Z)$.</b> Không dùng công thức giai thừa, ta viết thẳng mọi bộ thứ tự có thể:</p>
          $$(X, Y, Z),\; (X, Z, Y),\; (Y, X, Z),\; (Y, Z, X),\; (Z, X, Y),\; (Z, Y, X) \;\implies\; \text{đúng } 6\text{ bộ} = 3! \;\checkmark$$
        focus: [1, 2]
        say: "Để tự kiểm tra mà không phụ thuộc vào công thức nhân, ta liệt kê tường minh mọi cách xếp của ba thiết bị X, Y, Z. Khi X đứng đầu có hai bộ, khi Y đứng đầu có hai bộ và khi Z đứng đầu có hai bộ, nên đếm trực tiếp được đúng 6 bộ, khớp với 3 giai thừa."
      - show: |
          <p><b>Kiểm tra 2 — Nhân từ trường hợp $n = 3$ lên $n = 4$.</b> Thêm thiết bị thứ tư $W$ vào một bộ 3 phần tử có sẵn: $W$ có thể chèn vào <b>4 vị trí</b> (trước phần tử 1, giữa 1–2, giữa 2–3, hoặc cuối cùng):</p>
          $$\text{Số cách ghép của 4 nút} = 4 \cdot (\text{số cách ghép của 3 nút}) = 4 \cdot 6 = 24 = 4! \;\checkmark$$
        focus: [1, 1, 2]
        say: "Kiểm tra thứ hai đi từ kết quả 6 bộ của ba nút để suy lên bốn nút. Với mỗi bộ ba phần tử có sẵn, khi thêm phần tử thứ tư W vào, ta có đúng 4 chỗ trống để chèn W. Vì mỗi bộ trong 6 bộ đều nở thành 4 bộ mới, ta lấy 4 nhân 6 được 24, khớp tuyệt đối với kết quả ở phần ví dụ."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thiết kế làm gãy mô hình tâm trí và ánh xạ tự nhiên"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Dùng nhãn chữ để vá một bố cục ngược tự nhiên <b class="red">(nhãn chữ là cứu chữa sau cùng — nếu cần nhãn mới biết nút làm gì thì bố cục đã chưa đủ rõ)</b>
          <br><span class="note">Nhãn chữ bị mờ theo thời gian, không đọc được trong bóng tối hoặc khi người dùng đang vội; hãy sửa vị trí không gian trước khi nghĩ tới việc dán chữ.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất hay gặp nhất ở người làm thiết kế là giữ nguyên bố cục rối rắm rồi dán nhãn chữ lên để giải thích. Nhãn chữ chỉ là cứu chữa sau cùng khi bố cục đã chưa đủ rõ, vì chữ viết sẽ mờ đi theo thời gian và bắt người dùng phải dừng lại đọc."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Làm đẹp giao diện bằng cách xoá sạch dấu hiệu gợi ý <b class="red">(cửa kính phẳng lì không biết kéo hay đẩy, chữ trên màn hình phẳng giống hệt nút bấm)</b></div>
          $$\text{Có khả năng tác động} + \text{Thiếu dấu hiệu gợi ý} \;\implies\; \text{Người dùng không biết chạm vào đâu}$$
        focus: [1, 2]
        say: "Lỗi thứ hai là chạy theo trào lưu tối giản cực đoan đến mức xoá sạch các dấu hiệu gợi ý trên bề mặt. Khi nút bấm trên màn hình phẳng lì như dòng chữ thường hoặc cánh cửa không lộ bản lề, người dùng sẽ đứng khựng lại vì không thấy tín hiệu chỉ dẫn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chiều điều khiển ngược với mô hình tâm trí không gian <b class="red">(bấm mũi tên lên nhưng danh sách hoặc độ sáng lại giảm xuống)</b>
          <br><span class="note">Phép thử: hướng chuyển động của tay (lên, xuống, sang trái, sang phải) phải khớp với hướng thay đổi trên màn hình.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là đặt chiều tăng giảm của thanh điều khiển ngược với mô hình không gian trong đầu người dùng. Phép thử đơn giản là chiều tay di chuyển phải thuận với chiều kết quả biến thiên trên màn hình để người dùng không vặn ngược."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đổi vị trí nút quen thuộc giữa các màn hình trong cùng một sản phẩm <b class="red">(màn hình trước nút “Lưu” bên phải, màn hình sau nút “Xoá” lại đặt đúng chỗ bên phải đó)</b>
          <br><span class="note">Người dùng xây dựng mô hình tâm trí dựa trên tính nhất quán; đảo chỗ đột ngột sẽ biến phản xạ quen tay thành lỗi trượt nguy hiểm.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư của người làm phần mềm là thay đổi vị trí của cặp nút xác nhận và huỷ bỏ giữa các hộp thoại trong cùng một ứng dụng. Khi ở các màn hình trước nút lưu nằm bên phải mà màn hình sau lại đặt nút xoá vào đúng góc phải đó, người dùng sẽ bấm xoá theo thói quen."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: đếm số cách ghép và thiết kế lại bảng điều khiển"
    checks:
      - "alg.hci_mappings(5) == 120"
      - "alg.hci_mappings(3) * alg.hci_mappings(2) == 12"
    steps:
      - show: |
          <p>Một bàn điều khiển hội trường có <b>5 nút trượt</b> xếp thành một hàng dọc bên cạnh màn hình, dùng để chỉnh <b>3 cụm đèn sân khấu</b> (trái, giữa, phải) và <b>2 quạt thông gió</b> (trước, sau) — tất cả các nút đều cùng màu và cùng kích thước (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Khi chưa đọc nhãn chữ, có bao nhiêu cách ghép một–một giữa 5 nút trượt với 5 thiết bị trong hội trường?</td></tr>
          <tr><td>2</td><td>Nếu kỹ thuật viên tách riêng cụm 3 nút đèn ở khung trên và cụm 2 nút quạt ở khung dưới (nhưng trong mỗi khung vẫn xếp dọc không theo sơ đồ phòng), số cách ghép giảm xuống còn bao nhiêu?</td></tr>
          <tr><td>3</td><td>Hãy đề xuất cách bố trí 3 nút đèn và 2 nút quạt trên mặt bảng để đạt <b>ánh xạ tự nhiên</b> (chỉ còn 1 cách hiểu).</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn thực hành thiết kế bảng điều khiển. Một hội trường có 5 nút trượt giống hệt nhau xếp thành một hàng dọc để chỉnh 3 cụm đèn sân khấu và 2 quạt thông gió. Câu một, tính tổng số cách ghép một một giữa 5 nút và 5 thiết bị khi chưa đọc nhãn. Câu hai, tính số cách ghép nếu tách riêng khung 3 nút đèn và khung 2 nút quạt, và câu ba, thiết kế lại bố cục để đạt ánh xạ tự nhiên. Bạn hãy dừng video lại và tính ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước tính</th><th>đáp số</th></tr>
          <tr><td>1. Cả 5 nút trộn chung</td><td>$5! = 5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 24 \cdot 5$</td><td><b>120 cách ghép</b></td></tr>
          <tr><td>2. Tách cụm 3 đèn và 2 quạt</td><td>Cụm đèn có $3! = 6$ cách, cụm quạt có $2! = 2$ cách → nhân hai cụm độc lập: $6 \cdot 2$</td><td><b>12 cách ghép</b> (giảm 10 lần)</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Ta cùng đối chiếu đáp án câu một và câu hai. Ở câu một, khi 5 nút giống hệt nhau xếp thành một hàng dọc, tổng số cách ghép là 5 giai thừa, tức lấy 24 nhân 5 bằng 120 cách ghép. Ở câu hai, khi tách thành khung 3 nút đèn và khung 2 nút quạt, số cách ghép còn lại là 6 nhân 2 bằng 12 cách, giảm đi được 10 lần."
      - show: |
          <table class="t"><tr><th>câu 3: cụm thiết bị</th><th>cách đặt trên bảng điều khiển</th><th>kết quả ánh xạ</th></tr>
          <tr><td>3 cụm đèn (trái, giữa, phải)</td><td>xếp 3 nút theo <b>hàng ngang</b> trái – giữa – phải trên hình vẽ sân khấu</td><td>1 cách tự nhiên theo trục ngang</td></tr>
          <tr><td>2 quạt thông gió (trước, sau)</td><td>xếp 2 nút theo <b>trục trên – dưới</b> (phía sân khấu ở trên, phía cuối phòng ở dưới) kèm biểu tượng cánh quạt</td><td>1 cách tự nhiên theo trục dọc → tổng cộng $1 \cdot 1 = \hlg{1}$ cách hiểu</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở câu ba, để đưa 12 cách về đúng 1 cách tự nhiên, ta đặt ba nút đèn nằm ngang theo đúng vị trí trái, giữa, phải của sân khấu. Đồng thời hai nút quạt được đặt theo trục trên dưới tương ứng với phía trước và phía sau hội trường, nhờ vậy người điều khiển nhìn vào là thao tác đúng ngay."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic và tư duy ánh xạ tự nhiên"
    steps:
      - show: |
          <div class="chain"><span class="n">mô hình tâm trí trong đầu</span><span class="a">→</span>
          <span class="n">dấu hiệu gợi ý trên bề mặt</span><span class="a">→</span>
          <span class="n">ánh xạ tự nhiên theo không gian</span><span class="a">→</span>
          <span class="n">giảm từ n! cách đoán về 1 cách duy nhất</span></div>
        focus: [1, 1]
        say: "Tổng kết lại chuỗi logic của bài một, người dùng luôn mang sẵn một mô hình tâm trí khi tiếp xúc với sản phẩm. Dấu hiệu gợi ý chỉ cho họ biết thao tác ở đâu, còn ánh xạ tự nhiên xếp các nút trùng với không gian vật lý để giảm n giai thừa cách đoán về một."
      - show: |
          <div class="box key"><b>Tư duy:</b> Trước khi viết thêm một dòng chữ hướng dẫn hay dán thêm một cái nhãn, hãy tự hỏi: <i>“Mình có thể đổi vị trí và hình dáng của nút bấm để người dùng nhìn là hiểu ngay không?”</i></div>
        focus: [1, 1]
        say: "Điều cần mang theo khi thiết kế bảng điều khiển hay màn hình phần mềm là trước khi dán nhãn chữ, hãy thử đổi lại vị trí không gian của các nút bấm. Một bố cục có ánh xạ tự nhiên luôn bền vững và nhanh hơn mọi dòng chữ chú thích."
      - show: |
          <p class="note">Bài sau (bài 2): <b>Định luật Fitts: thời gian trỏ tới một đích</b> — khi đã biết cần bấm vào nút nào, tay người dùng mất bao nhiêu phần mười giây để di chuyển con trỏ tới nút đó?</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài sau, bài 2, khi người dùng đã biết rõ cần bấm vào đâu, ta sẽ tính chính xác thời gian trỏ tới một đích theo khoảng cách và bề rộng của nút bấm. Hẹn gặp bạn ở bài tiếp theo."
