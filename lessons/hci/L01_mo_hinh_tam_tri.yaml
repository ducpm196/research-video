          <text x="360" y="65" font-weight="bold" fill="#991b1b">Thiết kế A: 4 lò ô vuông, 4 núm hàng ngang (24 cách ghép)</text>
          <circle cx="260" cy="130" r="34" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="260" y="138">Lò TB</text>
          <circle cx="460" cy="130" r="34" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="460" y="138">Lò ĐB</text>
