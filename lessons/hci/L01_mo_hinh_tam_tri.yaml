          <circle cx="960" cy="135" r="34" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="960" y="143">Trái-Trên</text>
          <circle cx="1120" cy="135" r="34" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1120" y="143">Phải-Trên</text>
          <circle cx="960" cy="245" r="34" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="960" y="253">Trái-Dưới</text>
          <circle cx="1120" cy="245" r="34" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1120" y="253">Phải-Dưới</text>
          <circle cx="1270" cy="150" r="20" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
          <circle cx="1350" cy="150" r="20" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
          <circle cx="1270" cy="230" r="20" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
          <circle cx="1350" cy="230" r="20" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
          <text x="1310" y="298" font-size="17" fill="#065f46" font-weight="bold">cụm 4 núm</text>
          <text x="1310" y="325" font-size="17" fill="#065f46" font-weight="bold">xếp đúng hình lò</text>
