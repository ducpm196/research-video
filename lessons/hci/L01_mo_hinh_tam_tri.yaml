scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bốn lò bếp, bốn núm vặn, sao người nấu cứ bật nhầm?"
    checks:
      - "alg.hci_mappings(4) == 24"
    steps:
      - show: |
          <p>Trên rất nhiều mặt bếp gia đình, <b>4 lò nấu</b> được xếp thành một <b>ô vuông</b> (trái-trên, trái-dưới, phải-trên, phải-dưới), nhưng <b>4 núm xoay</b> lại xếp thành một <b>hàng ngang</b> thẳng tắp ở phía trước (Norman, 2013).</p>
          <table class="t"><tr><th>bố cục núm xoay</th><th>số cách ghép 4 núm với 4 lò</th><th>cảm giác của người dùng</th></tr>
          <tr><td>4 núm xếp thành một hàng ngang</td><td>$4! = 24$ cách ghép</td><td>phải cúi xuống đọc nhãn chữ nhỏ xíu hoặc bật thử</td></tr>
          <tr><td>4 núm xếp theo đúng ô vuông như 4 lò</td><td><b>1</b> cách tự nhiên</td><td>nhìn vị trí núm là biết ngay lò nào sẽ nóng</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, trên nhiều mặt bếp gia đình, bốn lò nấu được xếp thành một ô vuông nhưng bốn núm vặn lại xếp thành một hàng ngang. Khi bốn núm xếp hàng ngang, về mặt toán học có tới 24 cách ghép bốn núm với bốn lò, buộc người nấu phải cúi xuống đọc nhãn chữ. Tại sao chỉ cần đổi bốn núm thành hình vuông giống hệt bốn lò thì chỉ còn đúng một cách hiểu tự nhiên?"
      - show: |
          <div class="box key">Hôm nay ta trả lời: mô hình tâm trí và dấu hiệu gợi ý là gì? Vì sao $n$ nút không có ánh xạ tự nhiên lại đẻ ra $n!$ cách đoán? Và vì sao nhãn chữ chỉ là giải pháp chữa cháy cuối cùng?</div>
        focus: [1, 1]
        say: "Hôm nay ta trả lời ba câu hỏi cốt lõi của thiết kế giao diện. Mô hình tâm trí và dấu hiệu gợi ý là gì, vì sao n nút đặt lệch bố cục lại đẻ ra n giai thừa cách đoán, và vì sao nhãn chữ chỉ là cứu chữa sau cùng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại quy tắc nhân và số hoán vị của n phần tử"
    checks:
      - "alg.hci_mappings(2) == 2 and alg.hci_mappings(3) == 6 and alg.hci_mappings(4) == 24"
      - "4 * 3 * 2 * 1 == 24"
    steps:
      - show: |
          <p><b>① Quy tắc nhân và giai thừa</b> (như ở khoá Toán rời rạc): khi ghép một–một $n$ nút điều khiển với $n$ thiết bị, nút thứ nhất có $n$ lựa chọn, nút thứ hai còn $n - 1$ lựa chọn, cứ thế tới nút cuối cùng:</p>
          $$n! = n \cdot (n - 1) \cdot (n - 2) \cdots 2 \cdot 1$$
        introduces: [dots]
        focus: [1, 2, 2]
        say: "Trước hết ta ôn lại phép đếm số hoán vị đã gặp ở khoá Toán rời rạc. Khi ghép n nút với n thiết bị, nút một có n cách, nút hai còn n trừ 1 cách, ba dấu chấm đọc là và cứ thế tới 1. Tích của các số từ n lùi về 1 được viết gọn là n chấm than, đọc là n giai thừa."
      - show: |
          <p><b>② Nhẩm nhanh các giá trị nhỏ của $n!$:</b> tốc độ tăng của giai thừa rất gắt khi thêm chỉ một nút điều khiển mới:</p>
          <table class="t"><tr><th>số nút $n$</th><th>phép nhân</th><th>số cách ghép $n!$</th></tr>
          <tr><td>$2$</td><td>$2 \cdot 1$</td><td>$2$</td></tr>
          <tr><td>$3$</td><td>$3 \cdot 2 \cdot 1$</td><td>$6$</td></tr>
          <tr><td>$4$</td><td>$4 \cdot 3 \cdot 2 \cdot 1$</td><td>$24$</td></tr></table>
        focus: [1, "2.2", "2.4"]
        say: "Bảng này cho thấy tốc độ phình to rất nhanh của số cách ghép khi thêm nút mới. Chỉ với 2 công tắc và 2 bóng đèn đã có 2 nhân 1 bằng 2 cách ghép. Lên 3 công tắc là 6 cách, và khi lên 4 núm bếp thì số cách ghép vọt lên 4 nhân 3 nhân 2 nhân 1 bằng 24 cách."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: mô hình tâm trí, dấu hiệu gợi ý, ánh xạ và n!"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm / ký hiệu</th><th>đọc là</th><th>nghĩa trong thiết kế giao diện</th></tr>
          <tr><td>mô hình tâm trí (<i>mental model</i>)</td><td>mô hình tâm trí</td><td>hình dung trong đầu người dùng về cách hệ thống vận hành (nút nào tác động vào đâu, bấm xong chuyện gì xảy ra)</td></tr>
          <tr><td>khả năng tác động (<i>affordance</i>)</td><td>khả năng tác động</td><td>hành động vật lý có thể làm với vật (núm xoay được, nút ấn xuống được, thanh trượt kéo được)</td></tr>
          <tr><td>dấu hiệu gợi ý (<i>signifier</i>)</td><td>dấu hiệu gợi ý</td><td>tín hiệu nhìn thấy hoặc chạm thấy cho biết <b>thao tác ở đâu và theo hướng nào</b> (vạch chỉ trên núm, bóng đổ của nút bấm)</td></tr>
          <tr><td>ánh xạ tự nhiên (<i>natural mapping</i>)</td><td>ánh xạ tự nhiên</td><td>sắp xếp các nút điều khiển sao cho <b>tương ứng về không gian</b> với các vật được điều khiển</td></tr>
          <tr><td>$n!$</td><td>en-nờ giai thừa</td><td>số cách ghép một–một giữa $n$ nút điều khiển và $n$ thiết bị khi không có quy ước không gian</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Ta cùng giải mã các khái niệm nền tảng của bài học hôm nay. Mô hình tâm trí là bức tranh trong đầu người dùng về cách thiết bị hoạt động. Khả năng tác động nói lên vật đó có thể xoay hay ấn được, còn dấu hiệu gợi ý là tín hiệu trên bề mặt chỉ rõ cần chạm vào đâu. Ánh xạ tự nhiên là cách xếp nút điều khiển trùng khớp vị trí không gian với thiết bị, giúp loại bỏ con số n giai thừa cách đoán mò."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "So sánh hàng núm ngang mơ hồ với cụm núm xếp theo đúng ô vuông"
    steps:
      - show: |
          <div><svg width="1460" height="400" viewBox="0 0 1460 400">
          <g font-size="21" fill="#1f2937" text-anchor="middle">
