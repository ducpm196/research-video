title: "Bài 10 — Thiết kế chống lỗi: ngăn, phát hiện, hoàn tác"
version: 2
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/hci.yaml L10; audit/hci/sources_L10.md; [N13] D. A. Norman, The Design of Everyday Things, Revised and Expanded Edition, Basic Books, 2013, ch. 4–5 (Constraints, Slips vs. Mistakes, Designing for Error, Undo vs. Confirmation, trang 125–216); [R90] J. Reason, Human Error, Cambridge University Press, 1990; [R00] J. Reason, Human error: models and management, BMJ, vol. 320, trang 768–770, 2000 (Swiss cheese model)"
assumes: [arith, cdot, frac, power, approx, geq, sub, ltgt, implies, in, set]
objectives:
  - "Sắp thứ tự ưu tiên ba tầng chống lỗi: ngăn lỗi bằng ràng buộc, cho phép hoàn tác an toàn, rồi mới tới xác nhận cụ thể"
  - "Tính xác suất lỗi lọt qua nhiều lớp phòng thủ độc lập (mô hình phô mai Thụy Sĩ) và giải thích vì sao hai lớp không độc lập thì không giảm lỗi như công thức nhân"
  - "Phân biệt hộp thoại xác nhận chung chung (“Bạn có chắc không?”) bị bấm theo phản xạ với xác nhận gắn nội dung và xem trước kết quả"
asr_reviewed:
  - sentence: "Xác suất để một sai sót lọt qua cả lớp một lẫn lớp hai bằng xác suất lọt lớp một nhân với xác suất lọt lớp hai với điều kiện đã lọt lớp một."
    reason: "từ thuần Việt lặp nhiều âm khó (xác suất, lọt), ASR nghe nhầm - NOT_VERIFIED bằng tai người"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao hộp thoại “Bạn có chắc không?” không cứu được thao tác bấm nhầm?"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.01]), 6) == 0.00001"
      - "1000 * 100 == 100000"
    steps:
      - show: |
          <p>Ở bài 1, ta đã thấy tai họa khi gửi nhầm cảnh báo tên lửa mà mất 38 phút mới đính chính được. Nhưng giao diện hôm đó <b>đã có hộp thoại hỏi lại</b> — vì sao lỗi vẫn lọt qua?</p>
          <table class="t"><tr><th>loại lớp chắn thứ hai</th><th>xác suất lọt qua lớp 1 ($p_1$)</th><th>xác suất lọt qua lớp 2 ($p_2$)</th><th>xác suất lọt cả hai</th></tr>
          <tr><td><b>hộp thoại “Bạn có chắc không?” lặp lại</b></td><td>$1 / 1000$</td><td class="red">$\approx 1$ (bấm theo thói quen)</td><td class="red">$\approx 1 / 1000$</td></tr>
          <tr><td><b>người thứ hai duyệt độc lập (bắt 99% lỗi)</b></td><td>$1 / 1000$</td><td>$1 / 100$</td><td>1 / 100&nbsp;000</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Ở bài 1, ta đã biết vụ gửi nhầm cảnh báo tên lửa mất tới 38 phút mới thu hồi được. Điều đáng nói là màn hình hôm đó đã có một hộp thoại hỏi lại, nhưng câu hỏi lại giống hệt giữa lúc tập dượt và lúc báo động thật. Khi một câu hỏi chung chung xuất hiện mỗi ngày, người vận hành sẽ bấm Đồng ý theo phản xạ tự động, khiến lớp chắn thứ hai hoàn toàn vô tác dụng."
      - show: |
          <p>Thang ưu tiên chống lỗi và <b>mô hình phô mai Thụy Sĩ</b> cho các lớp phòng thủ độc lập:</p>
          $$\text{1. Ràng buộc ngăn lỗi} \;\to\; \text{2. Hoàn tác (Undo)} \;\to\; \text{3. Xác nhận gắn nội dung} \;\to\; \text{4. Duyệt độc lập } (p_1 \times p_2)$$
        focus: [1, 2]
        say: "Để chặn đứng sự cố do thao tác nhầm, ta cần xếp các biện pháp chống lỗi theo thứ tự ưu tiên và tính rủi ro bằng mô hình phô mai Thụy Sĩ. Bài học này sẽ giúp bạn thiết kế từng tầng phòng thủ và tính đúng xác suất lỗi lọt qua nhiều lớp kiểm soát."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: nhân xác suất độc lập (bài 6) và phân biệt trượt tay với nhầm lẫn"
    checks:
      - "round(0.001 * 0.01, 6) == 0.00001"
    steps:
      - show: |
          <p><b>Ôn nền 1 — hai loại lỗi con người: lỗi trượt tay (slip) và lỗi nhận thức (mistake):</b></p>
          <table class="t"><tr><th>loại lỗi</th><th>ý định trong đầu</th><th>hành động thực tế</th><th>ví dụ trên giao diện</th></tr>
          <tr><td><b>trượt tay (slip)</b></td><td>đúng ý định</td><td>bấm lệch hoặc làm theo thói quen</td><td>muốn bấm <i>Lưu</i> nhưng trượt sang nút <i>Xoá</i> sát bên cạnh</td></tr>
          <tr><td><b>nhầm lẫn (mistake)</b></td><td>sai mô hình tư duy</td><td>làm đúng theo ý định sai đó</td><td>tưởng đang ở chế độ tập dượt nên chủ động bấm gửi thật</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Trước hết, ta cần phân biệt hai loại lỗi rất khác nhau của con người là lỗi trượt tay và lỗi nhận thức. Lỗi trượt tay xảy ra khi ý định trong đầu hoàn toàn đúng nhưng ngón tay lại bấm nhầm nút bên cạnh hoặc bấm theo quán tính. Ngược lại, lỗi nhận thức xảy ra khi người dùng hiểu sai trạng thái hệ thống, chẳng hạn tưởng đang ở chế độ tập dượt nên chủ động ra lệnh phát cảnh báo thật."
      - introduces: [prob, given]
        show: |
          <p><b>Ôn nền 2 — quy tắc nhân xác suất (bài 6).</b> Hai biến cố $E_1, E_2$ chỉ nhân được xác suất khi chúng <b>độc lập</b>:</p>
          $$P(E_1 \text{ và } E_2) = P(E_1) \times P(E_2 \mid E_1); \qquad \text{Nếu độc lập: } P(E_1 \text{ và } E_2) = P(E_1) \times P(E_2)$$
        focus: [1, 2, 2]
        say: "Thứ hai, ta ôn lại quy tắc nhân xác suất đã dùng ở bài 6 khi tính tỉ lệ bỏ sót lỗi. Xác suất để một sai sót lọt qua cả lớp một lẫn lớp hai bằng xác suất lọt lớp một nhân với xác suất lọt lớp hai với điều kiện đã lọt lớp một. Chỉ khi hai lớp kiểm tra hoàn toàn độc lập với nhau, phép tính này mới rút gọn thành tích đơn giản của hai xác suất riêng lẻ."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ký hiệu xác suất lọt lỗi qua từng lớp phòng thủ"
    checks:
      - "round(1 - 0.99, 2) == 0.01"
      - "round(alg.hci_swiss_cheese_leak([0.01, 0.01]), 4) == 0.0001"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>miền giá trị</th><th>ý nghĩa trong mô hình phòng thủ nhiều lớp</th></tr>
          <tr><td>$m$</td><td>$m \ge 1$</td><td>số lớp phòng thủ xếp nối tiếp nhau</td></tr>
          <tr><td>$p_i$</td><td>$0 \le p_i \le 1$</td><td>xác suất một lỗi lọt qua lỗ hổng của lớp thứ $i$ (tỉ lệ lọt)</td></tr>
          <tr><td>$1 - p_i$</td><td>$0 \le 1 - p_i \le 1$</td><td>tỉ lệ lỗi bị lớp thứ $i$ chặn lại thành công</td></tr>
          <tr><td>$P_{\text{lọt}}$</td><td>$0 \le P_{\text{lọt}} \le 1$</td><td>xác suất lỗi xuyên thủng toàn bộ $m$ lớp để gây hậu quả</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Ta ký hiệu m là tổng số lớp phòng thủ được xếp nối tiếp nhau để bảo vệ một thao tác quan trọng. Với mỗi lớp thứ i, số p i từ 0 đến 1 là xác suất một lỗi lọt qua lỗ hổng của lớp đó. Phần bù 1 trừ p i chính là hiệu suất bắt lỗi của lớp thứ i. Cuối cùng, P lọt là xác suất tổng hợp để một lỗi xuyên qua tất cả m lớp và gây ra sự cố ngoài đời thực."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Thang ưu tiên ba tầng chống lỗi: ngăn bằng ràng buộc, hoàn tác, xác nhận"
    checks:
      - "3 > 2 > 1"
    steps:
      - show: |
          <p><b>Thứ tự ưu tiên thiết kế chống lỗi (từ mạnh nhất tới yếu nhất):</b></p>
          <table class="t"><tr><th>tầng ưu tiên</th><th>cơ chế trên giao diện</th><th>ví dụ thực tế</th></tr>
          <tr><td><b>1. Ngăn lỗi (Constraints)</b></td><td>làm thao tác sai <b>không thể thực hiện được</b></td><td>vô hiệu hoá nút <i>Gửi</i> khi chưa điền đủ; tách riêng màn hình <i>Tập dượt</i></td></tr>
          <tr><td><b>2. Hoàn tác (Undo)</b></td><td>cho phép <b>khôi phục tức thì</b> sau khi lỡ bấm</td><td>thùng rác lưu 30 ngày; hoãn gửi thư 10 giây kèm nút <i>Hoàn tác</i></td></tr>
          <tr><td><b>3. Xác nhận cụ thể</b></td><td>bắt xem trước kết quả và <b>gõ lại thông tin định danh</b></td><td>gõ đúng tên kho dữ liệu cần xoá thay vì chỉ bấm <i>Đồng ý</i></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Khi bảo vệ người dùng khỏi sai sót, bạn phải ưu tiên theo đúng ba tầng từ mạnh xuống yếu. Tầng mạnh nhất là ngăn lỗi bằng ràng buộc, khiến thao tác sai không thể bấm được, như tách hẳn chế độ tập dượt sang màn hình riêng. Tầng ưu tiên thứ hai là cho phép hoàn tác dễ dàng, như giữ thư điện tử lại 10 giây trước khi phát đi thật hoặc tạo sẵn nút thu hồi khẩn cấp. Chỉ khi hành động không thể hoàn tác, ta mới dùng tầng thứ ba là xác nhận, nhưng phải là xác nhận gắn chặt với nội dung sắp thực thi."

  # ───────────────────────── 5. TRỰC GIÁC ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mô hình phô mai Thụy Sĩ: khi nào các lỗ hổng thẳng hàng?"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.1, 0.1, 0.1]), 4) == 0.001"
    steps:
      - show: |
          <svg viewBox="0 0 620 210" width="100%" height="auto">
            <rect x="70" y="25" width="45" height="150" rx="6" fill="#eab308" fill-opacity="0.25" stroke="#eab308" stroke-width="2"/>
            <circle cx="92" cy="70" r="14" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
            <circle cx="92" cy="135" r="10" fill="#0f172a"/>
            <text x="92" y="195" fill="#fde047" font-size="13" text-anchor="middle" font-weight="bold">Lớp 1: p₁ = 1/1000</text>

            <rect x="240" y="25" width="45" height="150" rx="6" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="262" cy="120" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="262" cy="55" r="8" fill="#0f172a"/>
            <text x="262" y="195" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="bold">Lớp 2: p₂ = 1/100</text>

            <rect x="410" y="25" width="45" height="150" rx="6" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e" stroke-width="2"/>
            <circle cx="432" cy="95" r="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
            <text x="432" y="195" fill="#86efac" font-size="13" text-anchor="middle" font-weight="bold">Lớp 3: Hoàn tác</text>

            <line x1="15" y1="70" x2="240" y2="70" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
            <circle cx="240" cy="70" r="6" fill="#22c55e"/>
            <text x="535" y="100" fill="#86efac" font-size="15" text-anchor="middle" font-weight="bold">Lỗ lệch nhau:</text>
            <text x="535" y="122" fill="#f8fafc" font-size="14" text-anchor="middle">Chặn được lỗi!</text>
          </svg>
        focus: [1, 1, 1]
        say: "Mô hình phô mai Thụy Sĩ ví mỗi lớp phòng thủ như một lát phô mai có vài lỗ thủng đại diện cho điểm yếu của lớp đó. Không có lát phô mai nào hoàn hảo tuyệt đối, nhưng nếu các lát phô mai được thiết kế độc lập nhau thì vị trí các lỗ thủng sẽ nằm lệch nhau. Một tia lỗi dù xuyên qua lỗ thủng ở lát thứ nhất cũng sẽ đập vào phần đặc của lát thứ hai và bị chặn đứng."

  # ───────────────────────── 6. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Công thức nhân xác suất lọt qua m lớp độc lập so với lớp phụ thuộc"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.01]), 6) == 0.00001"
      - "round(0.001 * 0.90, 6) == 0.0009"
    steps:
      - show: |
          <p><b>Trường hợp 1 — $m$ lớp phòng thủ hoàn toàn độc lập:</b></p>
          $$P_{\text{lọt}}^{\text{độc lập}} = p_1 \times p_2 \times \dots \times p_m$$
        introduces: [dots]
        focus: [1, 2]
        say: "Theo quy tắc nhân xác suất, khi m lớp phòng thủ độc lập nhau, xác suất lỗi lọt qua toàn hệ thống bằng tích p 1 nhân p 2 cho tới p m. Vì mỗi số p i đều nhỏ hơn 1 rất nhiều, nên cứ thêm một lớp độc lập thực sự là rủi ro lại giảm đi hàng chục hoặc hàng trăm lần."
      - show: |
          <p><b>Trường hợp 2 — lớp thứ 2 bị phụ thuộc do thói quen (hộp thoại hỏi lại giống hệt nhau):</b></p>
          $$P_{\text{lọt}}^{\text{phụ thuộc}} = p_1 \times P(\text{lọt lớp 2} \mid \text{đã lọt lớp 1}) \approx p_1 \times 1 = p_1$$
        focus: [1, 2]
        say: "Ngược lại, nếu lớp thứ hai chỉ là hộp thoại hỏi Bạn có chắc không hiện ra ngay dưới ngón tay vừa bấm nhầm, xác suất có điều kiện để lọt tiếp lớp hai xấp xỉ bằng 1. Bởi vì người dùng đang bấm theo quán tính hoặc đang hiểu nhầm ngữ cảnh, nên lấy p 1 nhân với 1 thì xác suất lỗi lọt ra ngoài vẫn giữ nguyên là p 1."

  # ───────────────────────── 7. VÍ DỤ SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ số: giảm xác suất lọt lỗi nhờ duyệt độc lập thay vì quen tay"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.01]), 6) == 0.00001"
      - "round(1 / alg.hci_swiss_cheese_leak([0.001, 0.01])) == 100000"
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.80]), 5) == 0.0008"
      - "round(0.0008 / 0.00001) == 80"
    steps:
      - show: |
          <p><b>Bước 1 — xác suất bấm nhầm ở lớp 1 (người vận hành đầu tiên).</b> Giả sử trong $1000$ ca trực có $1$ lần chọn nhầm mục:</p>
          $$p_1 = \frac{1}{1000} = 0{,}001$$
        focus: [1, 2]
        say: "Bước một, ta xét một trung tâm điều hành nơi người trực ca có xác suất bấm nhầm dòng lệnh trong danh sách thả xuống là 1 phần 1000, tức p 1 bằng 0 phẩy 001. Nếu hệ thống phát lệnh đi ngay sau cú nhấp chuột này, cứ trung bình 1000 lần thao tác sẽ xảy ra 1 vụ báo động giả."
      - clear: true
        show: |
          <p><b>Bước 2 — thêm lớp 2 độc lập (người thứ hai duyệt trên màn hình riêng, bắt được $99\%$ lỗi):</b></p>
          $$p_2 = 1 - 0{,}99 = 0{,}01 = \frac{1}{100}$$
          $$P_{\text{lọt}}^{\text{độc lập}} = p_1 \times p_2 = \frac{1}{1000} \times \frac{1}{100} = \frac{1}{100\,000} = \hlg{0{,}00001}$$
        focus: [1, 2, 3]
        say: "Bước hai, ta thêm một lớp phòng thủ độc lập: người trực thứ hai nhìn bản xem trước trên máy riêng và ký duyệt, bắt được 99 phần trăm lỗi. Khi đó xác suất lọt qua người thứ hai chỉ là 1 phần 100, tức 0 phẩy 01. Nhân hai lớp độc lập, xác suất lọt lỗi giảm xuống còn 1 phần 100 nghìn, tức giảm đi đúng 100 lần."
      - clear: true
        show: |
          <p><b>Bước 3 — nếu lớp 2 chỉ là hộp thoại “Bạn có chắc không?” lặp lại ở mọi ca tập dượt:</b></p>
          $$\text{Giả sử } 80\% \text{ số lần bấm nhầm ở bước 1 cũng bấm luôn “Đồng ý” theo phản xạ: } P(\text{lọt 2} \mid \text{lọt 1}) = 0{,}80$$
          $$P_{\text{lọt}}^{\text{quen tay}} = 0{,}001 \times 0{,}80 = \hlb{0{,}0008} = \frac{1}{1250} \quad (\text{cao gấp } 80 \text{ lần so với duyệt độc lập!})$$
        focus: [1, 2, 3]
        say: "Bước ba, ta so sánh với thiết kế tồi: thay vì người thứ hai duyệt độc lập, giao diện chỉ bật lên hộp thoại hỏi Bạn có chắc không giống hệt mọi ngày. Nếu 80 phần trăm số lần bấm nhầm ở bước một cũng bấm luôn Đồng ý theo thói quen, xác suất lọt là 0 phẩy 001 nhân 0 phẩy 80 bằng 0 phẩy 0008. Con số 1 phần 1250 này cao gấp 80 lần so với phương án duyệt độc lập."
      - clear: true
        show: |
          <p><b>Bước 4 — bảng đối chiếu hiệu quả của 3 phương án thiết kế lớp phòng thủ thứ hai:</b></p>
          <table class="t"><tr><th>phương án thiết kế lớp 2</th><th>tỉ lệ lọt lớp 2</th><th>xác suất sự cố</th><th>số ca trực trung bình mới gặp 1 lỗi</th></tr>
          <tr><td>không có lớp 2</td><td>$1{,}00$</td><td>$1 / 1000$</td><td>$1000$ ca</td></tr>
          <tr><td>hộp thoại chung chung (quen tay)</td><td class="red">$0{,}80$</td><td class="red">$1 / 1250$</td><td>$1250$ ca</td></tr>
          <tr><td><b>người thứ hai duyệt độc lập</b></td><td>$0{,}01$</td><td><b>1 / 100&nbsp;000</b></td><td><b>100&nbsp;000 ca</b></td></tr></table>
        focus: [1, "2.3", "2.4"]
        say: "Bước bốn, bảng tổng hợp cho thấy sự khác biệt một trời một vực giữa lớp chắn giả và lớp chắn thật. Hộp thoại chung chung chỉ nâng khoảng cách trung bình giữa hai sự cố từ 1000 ca lên 1250 ca trực. Trong khi đó, một lớp duyệt độc lập đẩy khoảng cách an toàn lên tới 100 nghìn ca trực, kết hợp với nút thu hồi dựng sẵn sẽ khoanh vùng hậu quả tức khắc."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: đếm số trường hợp trên 100 000 ca trực"
    checks:
      - "100000 // 1000 == 100 and 100 - 99 == 1"
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.01, 0.05]), 8) == 5e-7"
    steps:
      - show: |
          <p><b>Đường kiểm 1 — đếm trực tiếp theo tần số trên $100\,000$ ca trực:</b></p>
          $$100\,000\text{ ca} \;\to\; \text{lọt lớp 1: } 100\text{ lần bấm nhầm} \;\to\; \text{lớp 2 chặn } 99\text{ lần} \implies \hlg{1\text{ lần lọt ra ngoài}}\ \checkmark$$
        focus: [1, 2]
        say: "Đường kiểm thứ nhất, ta kiểm tra không cần phân số bằng cách xét trọn vẹn 100 nghìn ca trực. Vì trong 100 nghìn ca có đúng 100 lần lọt qua lớp một và người thứ hai chặn 99 lần, nên chỉ còn 1 lần lọt ra ngoài."
      - show: |
          <p><b>Đường kiểm 2 — thêm lớp thứ 3 (nút thu hồi khẩn cấp trong 60 giây đầu chặn tiếp $95\%$ hậu quả):</b></p>
          $$p_3 = 1 - 0{,}95 = 0{,}05 \quad\implies\quad P_{\text{thảm họa}} = 0{,}001 \times 0{,}01 \times 0{,}05 = \hlb{5 \times 10^{-7}}\ \left(\text{tức } \frac{1}{2\,000\,000}\right)$$
        focus: [1, 2]
        say: "Đường kiểm thứ hai, nếu thêm lớp thứ ba là nút thu hồi trong phút đầu tiên chặn tiếp 95 phần trăm thiệt hại, thì tỉ lệ lọt của lớp ba là 0 phẩy 05. Vì ba lớp độc lập nên nhân tiếp với 1 phần 100 nghìn, suy ra xác suất thảm họa giảm xuống chỉ còn 1 phần 2 triệu."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Bẫy thường gặp: lạm dụng cảnh báo gây mù cảnh báo và đặt nút Xoá cạnh nút Lưu"
    checks:
      - "alg.hci_swiss_cheese_leak([0.01, 1.0]) == 0.01"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Lạm dụng hộp thoại xác nhận cho cả thao tác nhỏ <b class="red">(gây chứng mù cảnh báo)</b>
          <br><span class="note">Nếu đóng cửa sổ nháp, đổi trang, lưu bài đều bật hộp thoại hỏi lại, người dùng sẽ hình thành phản xạ cơ bắp bấm phím xác nhận trong $0{,}2$ giây mà không đọc chữ. Phép sửa: <b>bỏ hẳn hộp thoại ở thao tác thường</b> (thay bằng Hoàn tác), chỉ giữ xác nhận cho hành động nguy hiểm không thể đảo ngược.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất rất hay gặp ở người đã đi làm là gắn hộp thoại xác nhận vào mọi thao tác nhỏ nhặt vì nghĩ rằng hỏi lại càng nhiều càng an toàn. Chính sự lạm dụng này huấn luyện người dùng thói quen nhắm mắt bấm nút Đồng ý trong hai phần mười giây mà không thèm đọc nội dung. Cách sửa đúng là dẹp bỏ hộp thoại ở các thao tác thường ngày để thay bằng nút Hoàn tác, chỉ giữ lại xác nhận đặc biệt cho hành động huỷ diệt không thể đảo ngược."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Đặt nút <i>Xoá vĩnh viễn</i> nằm sát cạnh nút <i>Lưu</i> và tô cùng một màu nổi bật
          <br><span class="note">Theo định luật thời gian trỏ (bài 3), hai nút sát nhau rất dễ bị bấm trượt. Phép sửa: tách xa vị trí địa lý của nút huỷ diệt, đổi sang kiểu nút phụ màu đỏ cảnh báo, và bắt gõ lại tên đối tượng trước khi xoá.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là đặt nút Xoá vĩnh viễn nằm sát ngay cạnh nút Lưu thay đổi và tô cùng một kiểu màu nổi bật. Theo định luật thời gian trỏ ở bài 3, cách bố trí này biến một cú trượt tay nhỏ thành tai họa mất dữ liệu. Vì vậy, ta phải tách xa nút nguy hiểm và bắt gõ lại tên mục cần xoá."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính xác suất lọt qua 3 lớp và chọn lại cơ chế chống lỗi"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.02, 0.10, 0.05]), 6) == 0.0001"
      - "round(1 / alg.hci_swiss_cheese_leak([0.02, 0.10, 0.05])) == 10000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Một quy trình chuyển tiền lớn có 3 lớp độc lập: người lập lệnh nhầm với $p_1 = 0{,}02$; hệ thống kiểm tra hạn mức bỏ sót $p_2 = 0{,}10$; giám đốc duyệt độc lập bỏ sót $p_3 = 0{,}05$. Tính xác suất lỗi lọt qua cả 3 lớp.</td></tr>
          <tr><td>2</td><td>Trong ứng dụng thư điện tử, để chống lỗi “bấm Gửi xong mới nhớ quên đính kèm tệp”, bạn chọn bật hộp thoại hỏi <i>“Bạn có chắc muốn gửi?”</i> mỗi lần bấm hay dùng cơ chế nào?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự luyện. Câu một, quy trình chuyển tiền có ba lớp độc lập với tỉ lệ lọt 0 phẩy 02, 0 phẩy 10 và 0 phẩy 05; hãy tính xác suất lỗi lọt qua cả ba lớp. Câu hai, để giúp người dùng không gửi thư thiếu tệp đính kèm, bạn nên bật hộp thoại hỏi lại mỗi lần gửi hay dùng cơ chế nào trong ba tầng đã học? Dừng video và suy nghĩ."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> Vì 3 lớp kiểm soát độc lập nhau, ta nhân ba tỉ lệ lọt:</p>
          $$P_{\text{lọt}} = p_1 \times p_2 \times p_3 = 0{,}02 \times 0{,}10 \times 0{,}05 = \hlg{0{,}0001} = \frac{1}{10\,000}\ \text{(giảm 200 lần so với } p_1\text{)}$$
        focus: [1, 2]
        say: "Đáp án câu một, vì ba lớp kiểm soát hoạt động độc lập, ta lấy 0 phẩy 02 nhân 0 phẩy 10 rồi nhân 0 phẩy 05. Kết quả bằng 0 phẩy 0001, tức 1 phần 10 nghìn, giúp giảm rủi ro đi đúng 200 lần so với khi chỉ có một người lập lệnh."
      - show: |
          <p><b>Đáp án câu 2.</b> Kết hợp <b>tầng 2 (Hoàn tác)</b> và <b>tầng 1 (Phát hiện theo ngữ cảnh)</b> thay vì hỏi lại mọi lần gửi:</p>
          <table class="t"><tr><th>cơ chế áp dụng</th><th>cách hoạt động</th><th>vì sao hiệu quả?</th></tr>
          <tr><td><b>1. Phát hiện theo từ khoá</b></td><td>chỉ hỏi khi nội dung thư có chữ <i>“đính kèm”</i> mà số tệp $= 0$</td><td>chỉ xuất hiện đúng lúc có dấu hiệu quên thật nên không gây nhàm</td></tr>
          <tr><td><b>2. Hoàn tác gửi (Undo)</b></td><td>giữ thư lại $10\text{–}30$ giây kèm nút <b>Hoàn tác</b> ở góc màn hình</td><td>không làm gián đoạn 99% lần gửi đúng, nhưng cứu kịp lần gửi nhầm</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Ở câu hai, tuyệt đối không bật hộp thoại hỏi lại ở mọi lần gửi thư vì người dùng sẽ bấm bỏ qua theo thói quen. Thay vào đó, ta dùng tầng phát hiện thông minh: chỉ bật cảnh báo khi trong nội dung thư có viết cụm từ đính kèm nhưng chưa có tệp nào. Đồng thời, ta cung cấp nút Hoàn tác gửi trong vòng 10 đến 30 giây đầu để người dùng tự rút thư về êm ái."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">con người luôn có lúc trượt tay / nhầm lẫn</span><span class="a">→</span>
          <span class="n">ưu tiên 1: ràng buộc ngăn lỗi</span><span class="a">→</span>
          <span class="n">ưu tiên 2: hoàn tác (Undo) dễ dàng</span><span class="a">→</span>
          <span class="n">ưu tiên 3: xác nhận gắn nội dung cụ thể</span><span class="a">→</span>
          <span class="n">xếp nhiều lớp độc lập: P_lọt = p₁ × p₂ × …</span></div>
        say: "Tổng kết lại, vì con người luôn có lúc trượt tay hoặc nhầm lẫn, giao diện phải ưu tiên ngăn lỗi bằng ràng buộc, tiếp theo là hoàn tác, rồi mới tới xác nhận gắn nội dung. Khi cần bảo vệ thao tác trọng yếu, hãy xếp chồng các lớp phòng thủ thực sự độc lập để nhân xác suất lọt lỗi xuống mức cực nhỏ."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi người dùng bấm nhầm gây hậu quả lớn, đừng vội trách người dùng bất cẩn — hãy hỏi vì sao giao diện <b>cho phép bấm nhầm dễ đến thế</b> và vì sao <b>không có đường hoàn tác nhanh</b>.</div>
        say: "Tư duy cần mang theo là khi xảy ra thao tác nhầm, đừng đổ lỗi cho sự bất cẩn cá nhân, mà hãy sửa lại ràng buộc, bản xem trước và đường hoàn tác trên chính giao diện."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>Tình huống chuyên gia: thiết kế lại giao diện gửi cảnh báo khẩn cấp</b> — tổng hợp các công cụ đã học để mổ xẻ báo cáo điều tra vụ 38 phút và thiết kế lại màn hình điều hành.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta bước vào bài tình huống chuyên gia: thiết kế lại giao diện gửi cảnh báo khẩn cấp. Ta sẽ vận dụng các nguyên lý và công thức vừa học để mổ xẻ biên bản điều tra vụ báo động tên lửa giả 38 phút và kiểm định lại thiết kế mới. Hẹn gặp bạn ở bài tiếp theo."
