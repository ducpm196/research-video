          <text x="1247" y="240" fill="#b91c1c">đều đi lọt qua một chạm</text>
          </g></svg></div>
        say: "Hình vẽ cho thấy cơ chế làm sự cố lọt qua. Bên trái là hai lệnh có hậu quả khác nhau hẳn, lệnh trên chỉ tập trận nội bộ còn lệnh dưới phát cảnh báo thật cho toàn dân. Thế nhưng cả hai mũi tên đều dẫn vào cùng một hộp màu vàng ở giữa với câu hỏi giống hệt nhau và không cho xem trước nội dung. Khi giao diện trả về cùng một phản hồi cho hai hành động khác hẳn nhau, người trực không có cơ hội nhận ra mình đang ở nhánh sai."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: concept
    kind: concept
    title: "Phân loại lỗi của Norman và vì sao hộp xác nhận chung thất bại"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
    steps:
      - show: |
          <p><b>Bước 1 — Phân biệt lỗi trượt và lỗi nhầm theo chặng bị hỏng.</b> Trong sách thiết kế đồ vật hằng ngày (Norman, 2013), lỗi con người tách thành hai nhánh rõ rệt:</p>
          $$\text{Ý định đúng} + \text{Tay làm lệch} \;\implies\; \text{Lỗi trượt}, \qquad \text{Hiểu sai tình huống} \implies \text{Ý định sai} \;\implies\; \text{Lỗi nhầm}$$
        introduces: [implies]
        focus: [1, 2, 2]
        say: "Bước một, ta đặt tên chính xác cho hai loại sự cố theo chặng bị hỏng. Dấu mũi tên kép đọc là suy ra, nếu ý định trong đầu đúng nhưng tay bấm lệch sang dòng bên cạnh thì suy ra đó là lỗi trượt. Ngược lại, nếu thông tin đầu vào mập mờ làm người trực hiểu sai tình huống thì họ lập ý định sai, và đó là lỗi nhầm."
      - show: |
          <p><b>Bước 2 — Chẩn đoán sự cố ngày 13/1/2018 từ báo cáo FCC.</b> Trong cuộc diễn tập đổi ca, cuộc gọi phát băng ghi âm vừa có câu <i>“Tập trận, tập trận, tập trận”</i> vừa cài câu của kịch bản thật <i>“Đây không phải tập trận”</i>:</p>
          <table class="t"><tr><th>tình huống có thể gặp</th><th>loại lỗi</th><th>vì sao hộp “Bạn có chắc?” không cứu được</th></tr>
          <tr><td>định bấm mẫu tập trận nhưng chuột trượt sang dòng cảnh báo thật sát bên</td><td><b>lỗi trượt</b></td><td>hộp xác nhận hiện ở mọi lần tập trận nên tay bấm “Đồng ý” theo thói quen</td></tr>
          <tr><td>nghe câu “Đây không phải tập trận” nên tin là có tên lửa thật và chủ đích chọn dòng cảnh báo thật</td><td><b>lỗi nhầm</b> (trường hợp thật hôm 13/1/2018)</td><td>người trực đang <b>chắc chắn</b> muốn gửi cảnh báo thật, nên hỏi “Bạn có chắc?” thì tất nhiên bấm “Đồng ý”</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Bước hai, ta đối chiếu với báo cáo điều tra của cơ quan viễn thông Mỹ. Nếu nhân viên định chọn dòng tập trận mà chuột trượt sang dòng cảnh báo thật rồi bấm đồng ý theo thói quen, đó là lỗi trượt. Nhưng thực tế hôm đó cuộc gọi diễn tập đọc lẫn câu đây không phải tập trận, làm nhân viên tin rằng có tên lửa thật nên mắc lỗi nhầm. Khi một người đang tin chắc là có tên lửa thật, câu hỏi bạn có chắc muốn gửi không trở nên vô dụng vì họ đang hoàn toàn chắc chắn."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính dòng thời gian 38 phút và kiểm từng nút chặn bị thiếu"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 31) == 24"
      - "alg.hci_minutes_diff(8, 31, 8, 44) == 13"
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
      - "24 + 13 + 1 == 38"
    steps:
      - show: |
          <p><b>Bước 1 — Đổi mốc phát cảnh báo giả và mốc đính chính ra phút.</b> Theo báo cáo FCC, cảnh báo giả phát lúc $8\text{:}07$ sáng và thông điệp huỷ phát lúc $8\text{:}45$ sáng:</p>
          $$t_1 = 8 \cdot 60 + 7 = \hlb{487}\text{ phút}, \qquad t_2 = 8 \cdot 60 + 45 = \hlb{525}\text{ phút}$$
        focus: [1, 2, 2]
        say: "Bước một, ta tính chính xác thời gian người dân phải sống trong hoảng loạn từ số liệu của báo cáo điều tra. Cảnh báo giả rời hệ thống lúc 8 giờ 7 phút sáng, đổi ra phút là 8 nhân 60 cộng 7 bằng 487 phút tính từ nửa đêm. Thông điệp đính chính phát đi lúc 8 giờ 45 phút sáng, tức là 8 nhân 60 cộng 45 bằng 525 phút."
      - show: |
          <p><b>Bước 2 — Tính tổng thời gian từ lúc phát nhầm tới lúc đính chính.</b> Lấy mốc sau trừ mốc đầu:</p>
          $$\Delta t = t_2 - t_1 = 525 - 487 = \hl{38}\text{ phút}$$
        focus: [1, 2, 0]
        say: "Bước hai, lấy mốc đính chính trừ đi mốc phát nhầm, 525 trừ 487 bằng đúng 38 phút. Trong khoảng thời gian đó, đường dây điện thoại của cơ quan cảnh báo bị người dân gọi tới hỏi làm nghẽn. Lệnh ngừng phát lại cũng không thu hồi được tin đã hiện trên điện thoại."
      - clear: true
        show: |
          <p><b>Bước 3 — Vì sao mất tới 38 phút mới gửi được đính chính?</b> Báo cáo FCC ghi lại các chặng bên trong phòng vận hành:</p>
          <table class="t"><tr><th>khoảng giờ</th><th>việc phải làm</th><th>số phút</th></tr>
          <tr><td>8:07 → 8:31</td><td>biết ngay là báo nhầm; 8:12 ra lệnh ngừng phát lại (không thu hồi được tin đã hiện); đường dây bị gọi tới nghẽn; vì <b>không có quy trình đính chính</b>, 8:27 mới họp chọn mã cho tin đính chính</td><td>$31 - 7 = 24$ phút</td></tr>
          <tr><td>8:31 → 8:44</td><td>gọi cơ quan liên bang hỏi ý về mã (họ không cần cho phép); tự soạn thông điệp đính chính vì <b>không có mẫu soạn sẵn</b></td><td>$44 - 31 = 13$ phút</td></tr>
          <tr><td>8:44 → 8:45</td><td>phát thông điệp đính chính lên sóng (báo cáo ghi mốc 8:45)</td><td>$45 - 44 = 1$ phút</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4"]
        say: "Bước ba, ta bóc tách xem 38 phút đó đã trôi đi ở đâu trong phòng vận hành. Từ 8 giờ 7 phút đến 8 giờ 31 phút là 24 phút, dù cơ quan biết ngay là báo nhầm. Lệnh ngừng phát lại không thu hồi được tin đã hiện, và không có quy trình đính chính nên phải họp chọn cách gửi. Từ 8 giờ 31 phút đến 8 giờ 44 phút là 13 phút để hỏi ý cơ quan liên bang và tự soạn nội dung đính chính, vì không có mẫu soạn sẵn. Cuối cùng, từ 8 giờ 44 phút đến 8 giờ 45 phút mất thêm 1 phút để phát thông điệp đính chính lên sóng."
      - clear: true
        show: |
          <p><b>Bước 4 — Đặt đúng cơ chế giao diện vào từng lỗ hổng.</b> Mỗi đoạn thời gian bị mất chỉ ra một yêu cầu thiết kế cụ thể:</p>
          <table class="t"><tr><th>lỗ hổng giao diện hôm 13/1/2018</th><th>loại lỗi lọt qua</th><th>cách sửa bằng thiết kế</th></tr>
          <tr><td>mẫu tập trận và mẫu thật nằm chung một danh sách</td><td>lỗi trượt</td><td>tách hẳn chế độ tập trận khỏi màn hình phát sóng thật</td></tr>
          <tr><td>hộp xác nhận giống hệt nhau, không cho xem trước nội dung</td><td>lỗi nhầm + thói quen</td><td>hiện toàn văn thông điệp và yêu cầu người thứ hai duyệt độc lập</td></tr>
          <tr><td>không có mẫu đính chính soạn sẵn</td><td>kéo dài 38 phút</td><td>thêm mẫu đính chính có sẵn để gửi ngay khi được duyệt</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, từ bảng phân tích đó ta gắn đúng thuốc chữa cho từng lỗ hổng. Để chặn lỗi trượt, phải tách hẳn màn hình tập trận khỏi màn hình phát cảnh báo thật. Để chặn lỗi nhầm và thói quen bấm lướt, phải hiện nguyên văn thông điệp sắp gửi kèm yêu cầu người thứ hai xác nhận độc lập. Đồng thời giao diện phải chuẩn bị sẵn mẫu đính chính để không phải soạn tay giữa lúc khẩn cấp."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng hai cách tính thời gian và phép thử hoán đổi tình huống"
    checks:
      - "(45 - 7) == 38 and (24 + 13 + 1) == 38 and alg.hci_minutes_diff(8, 7, 8, 45) == 38"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Cộng các chặng con so với trừ trực tiếp số phút.</b> Vì cả hai mốc đều nằm trong khung 8 giờ sáng, ta trừ thẳng phần phút hoặc cộng ba chặng con:</p>
          $$45 - 7 = 38\text{ phút} \;=\; 24 + 13 + 1\text{ phút} \;\checkmark$$
        focus: [1, 2, 2]
        say: "Ta tự kiểm tra lại bằng một con đường khác để chắc chắn không nhầm số học. Vì cả hai mốc đều nằm trong cùng giờ thứ tám buổi sáng, nên lấy thẳng 45 phút trừ 7 phút được 38 phút. Khi cộng ba chặng nhỏ 24 cộng 13 cộng 1 ta cũng ra đúng 38 phút, hoàn toàn khớp nhau."
      - show: |
          <p><b>Kiểm tra 2 — Phép thử phân biệt lỗi trượt và lỗi nhầm.</b> Đặt câu hỏi: <i>“Nếu tay người dùng bấm trúng 100% điều họ định trong đầu, sự cố có còn xảy ra không?”</i></p>
          <table class="t"><tr><th>trả lời cho câu hỏi thử</th><th>kết luận</th></tr>
          <tr><td>Nếu tay bấm đúng ý định mà sự cố <b>biến mất</b></td><td>đó là <b>lỗi trượt</b> (chỉ cần nới khoảng cách nút, tách danh sách)</td></tr>
          <tr><td>Nếu tay bấm đúng ý định mà sự cố <b>vẫn xảy ra</b></td><td>đó là <b>lỗi nhầm</b> (phải sửa thông tin hiển thị, thêm xem trước và người duyệt thứ hai)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm tra thứ hai là phép thử logic để không bao giờ lẫn lỗi trượt với lỗi nhầm. Bạn hãy tự hỏi, nếu tay người dùng bấm trúng một trăm phần trăm điều họ đang nghĩ trong đầu thì sự cố có biến mất không. Nếu sự cố biến mất thì đó là lỗi trượt, còn nếu họ vẫn bấm gửi vì tin tình huống là thật thì đó là lỗi nhầm."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi điều tra sự cố và thiết kế hộp xác nhận"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Kết luận “do nhân viên bấm nhầm” rồi khép hồ sơ <b class="red">(dừng quá sớm, để nguyên giao diện chờ người tiếp theo mắc lại)</b>
          <br><span class="note">Báo cáo FCC kết luận sự cố là kết quả của cả lỗi con người lẫn thiếu cơ chế an toàn; đổi người mà giữ nguyên giao diện thì rủi ro vẫn còn nguyên.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất rất phổ biến trong vận hành là kết luận nhân viên bấm nhầm rồi kỷ luật cá nhân và khép hồ sơ. Báo cáo của cơ quan viễn thông Mỹ chỉ rõ sự cố đến từ cả lỗi con người lẫn thiếu cơ chế an toàn, nên giữ nguyên màn hình cũ thì người mới cũng sẽ sập bẫy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng cùng một câu hỏi <i>“Bạn có chắc chắn không?”</i> cho cả việc nhỏ lẫn việc không thể hoàn tác <b class="red">(tạo phản xạ bấm “Đồng ý” không cần đọc)</b></div>
          $$\text{Hộp xác nhận tập trận} = \text{Hộp xác nhận thật} \;\implies\; \text{Bấm theo thói quen}$$
        focus: [1, 2]
        say: "Lỗi thứ hai là gắn cùng một hộp thoại hỏi bạn có chắc không cho cả thao tác thường ngày lẫn thao tác nguy hiểm. Khi người dùng phải bấm đồng ý trên hộp thoại đó ở mọi lần tập trận, não bộ sẽ tự động bấm mà không đọc chữ nữa."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhầm lỗi nhầm thành lỗi trượt nên chỉ sửa kích thước nút <b class="red">(nút to hơn chỉ giúp bấm gửi cảnh báo sai… nhanh hơn)</b>
          <br><span class="note">Khi người dùng hiểu sai tình huống, phải cho họ thấy <b>hậu quả và nội dung thật</b> trước khi phát, chứ không phải chỉ làm nút dễ bấm hơn.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là chẩn đoán nhầm lỗi nhầm thành lỗi trượt nên chỉ đi nới rộng khoảng cách giữa các nút bấm. Khi người vận hành đã tin rằng có tên lửa thật, việc làm nút bấm to hơn chỉ giúp họ kích hoạt lệnh sai nhanh hơn mà thôi."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Thiết kế nút “Phát đi” rất kỹ nhưng quên thiết kế đường “Đính chính / Thu hồi” <b class="red">(không có quy trình và mẫu đính chính góp phần làm 38 phút sau mới phát được tin đính chính)</b>
          <br><span class="note">Mọi hệ thống phát lệnh diện rộng đều phải có sẵn quy trình và mẫu đính chính kiểm thử từ trước.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư của người làm sản phẩm là dồn hết công sức cho luồng gửi đi mà quên thiết kế luồng thu hồi khi có sự cố. Báo cáo điều tra chỉ ra việc không có quy trình và mẫu thông điệp đính chính soạn sẵn là một nguyên nhân khiến cơ quan mất tổng cộng 38 phút mới đính chính được."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: phân loại lỗi và chọn cơ chế sửa giao diện"
    checks:
      - "alg.hci_minutes_diff(9, 12, 9, 49) == 37"
      - "(9 * 60 + 49) - (9 * 60 + 12) == 37"
    steps:
      - show: |
          <p>Một hệ thống quản trị gửi thông báo khuyến mãi phát nhầm tin nhắn thử nghiệm cho <b>50&nbsp;000 khách hàng</b> lúc <b>9:12</b> sáng, và tới <b>9:49</b> sáng mới gửi được tin đính chính (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>tình huống và việc cần làm</th></tr>
          <tr><td>1</td><td>Tính số phút từ lúc phát nhầm (9:12) tới lúc gửi tin đính chính (9:49).</td></tr>
          <tr><td>2</td><td>Trường hợp A: nhân viên định bấm nút <i>“Gửi thử cho 5 người nội bộ”</i> nhưng tay bấm lệch sang nút <i>“Gửi toàn bộ khách hàng”</i> đặt sát bên. Trường hợp B: nhân viên tưởng danh sách <code>khach_hang_2026</code> là danh sách thử nghiệm nên chủ đích chọn nó để gửi. Phân loại đâu là <b>lỗi trượt</b>, đâu là <b>lỗi nhầm</b>.</td></tr>
          <tr><td>3</td><td>Thêm một hộp thoại hỏi <i>“Bạn có chắc muốn gửi?”</i> có chặn được trường hợp B không? Phải đổi hộp xác nhận thế nào?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự giải quyết một tình huống thực tế. Một hệ thống quản trị phát nhầm tin nhắn thử nghiệm cho 50 nghìn khách hàng lúc 9 giờ 12 phút sáng, và tới 9 giờ 49 phút mới gửi được tin đính chính. Câu một, tính số phút từ lúc phát nhầm tới lúc đính chính. Câu hai, phân loại trường hợp A và trường hợp B xem đâu là lỗi trượt, đâu là lỗi nhầm, và câu ba, chọn cách sửa hộp xác nhận cho trường hợp B. Bạn hãy dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước giải</th><th>kết quả</th></tr>
          <tr><td>1. Khoảng thời gian</td><td>Đổi ra phút: $t_1 = 9 \cdot 60 + 12 = 552$, $t_2 = 9 \cdot 60 + 49 = 589$ → $589 - 552 = 37$ phút (hoặc $49 - 12 = 37$ phút)</td><td><b>37 phút</b></td></tr>
          <tr><td>2. Trường hợp A</td><td>Ý định đúng (gửi 5 người nội bộ), tay bấm lệch sang nút bên cạnh</td><td><b>lỗi trượt</b></td></tr>
          <tr><td>2. Trường hợp B</td><td>Hiểu sai ý nghĩa tệp danh sách nên lập ý định sai ngay từ đầu</td><td><b>lỗi nhầm</b></td></tr></table>
        focus: ["1.1", "1.2", "1.3", "1.4"]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Ở câu một, lấy 49 trừ 12 hoặc đổi ra 589 trừ 552 phút đều cho kết quả đúng 37 phút. Ở câu hai, trường hợp A có ý định đúng nhưng tay bấm lệch sang nút sát bên nên là lỗi trượt. Còn trường hợp B hiểu sai tên danh sách nên chủ đích chọn nhầm tập khách hàng, đó là lỗi nhầm."
      - show: |
          <table class="t"><tr><th>cách làm ở câu 3</th><th>tác dụng với trường hợp B (lỗi nhầm)</th></tr>
          <tr><td>Hộp thoại <i>“Bạn có chắc muốn gửi?”</i></td><td><b class="red">(sai)</b> Không chặn được — nhân viên đang tin đó là danh sách thử nghiệm nên sẽ bấm “Đồng ý” ngay</td></tr>
          <tr><td>Hộp xác nhận hiện rõ <b>“Sắp gửi thật cho 50&nbsp;000 khách hàng”</b> và yêu cầu gõ lại con số <code>50000</code></td><td><b class="green">✓ Đúng</b> — con số 50&nbsp;000 mâu thuẫn ngay với ý định “gửi thử nội bộ”, giúp người vận hành phát hiện lỗi nhầm trước khi phát</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở câu ba, hộp thoại chỉ hỏi bạn có chắc muốn gửi không hoàn toàn thất bại vì nhân viên đang tin mình chọn đúng danh sách thử nghiệm. Cách sửa đúng là hộp xác nhận phải hiện rõ con số sắp gửi thật cho 50 nghìn khách hàng và bắt gõ lại số 50 nghìn đó để đánh thức người trực."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic, tư duy thiết kế và bản đồ cả khoá học"
    steps:
      - show: |
          <div class="chain"><span class="n">người dùng thao tác</span><span class="a">→</span>
          <span class="n">tách chặng ý định và chặng thực hiện tay</span><span class="a">→</span>
          <span class="n">phân biệt lỗi nhầm với lỗi trượt</span><span class="a">→</span>
          <span class="n">xác nhận có ngữ cảnh và đường đính chính sẵn</span></div>
        focus: [1, 1]
        say: "Tổng kết lại chuỗi logic của bài mở đầu, từ một sự cố thao tác ta tách thành chặng lập ý định và chặng thực hiện bằng tay. Từ đó ta phân biệt rõ lỗi nhầm do hiểu sai tình huống với lỗi trượt do tay bấm lệch, rồi đặt đúng hộp xác nhận có ngữ cảnh."
      - show: |
          <div class="box key"><b>Tư duy:</b> Khi người vận hành bấm nhầm trên giao diện, câu hỏi đầu tiên không phải là <i>“Ai làm sai?”</i> mà là <i>“Giao diện đã hiển thị gì khiến việc làm sai trông giống hệt việc làm đúng?”</i></div>
        focus: [1, 1]
        say: "Tư duy cốt lõi cần mang theo suốt khoá học này là khi người dùng thao tác sai, đừng vội dừng lại ở câu hỏi ai bấm nhầm. Hãy hỏi giao diện đã thiết kế thế nào mà hành động nguy hiểm lại cho phản hồi giống hệt một thao tác bình thường."
      - clear: true
        show: |
          <table class="t"><tr><th>bài</th><th>bản đồ khoá học Tương tác người–máy</th></tr>
          <tr><td>1</td><td>mô hình tâm trí, dấu hiệu gợi ý và ánh xạ tự nhiên trên bảng điều khiển</td></tr>
          <tr><td style="white-space:nowrap">2–3</td><td>định luật thời gian trỏ tới một đích và định luật thời gian chọn trong nhiều lựa chọn</td></tr>
          <tr><td style="white-space:nowrap">4–5</td><td>trí nhớ làm việc, gom nhóm, tải nhận thức và mô hình cộng thao tác phím bấm</td></tr>
          <tr><td style="white-space:nowrap">6–8</td><td>kiểm thử khả dụng, thang điểm mười câu và thiết kế thí nghiệm giao diện cân bằng thứ tự</td></tr>
          <tr><td style="white-space:nowrap">9–10</td><td>truy cập cho mọi người, kích thước đích tối thiểu và các lớp thiết kế chống lỗi</td></tr>
          <tr><td>11</td><td>tình huống chuyên gia: thiết kế lại toàn diện giao diện gửi cảnh báo khẩn cấp</td></tr>
          <tr><td>12</td><td>hành trình chuẩn tiếp cận web từ 14 hướng dẫn năm 1999 tới tiêu chí đo được năm 2023</td></tr></table>
