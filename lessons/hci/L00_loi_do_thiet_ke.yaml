scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "38 phút hoảng loạn vì một dòng chọn và một hộp xác nhận"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
    steps:
      - show: |
          <p>Sáng ngày <b>13/1/2018</b> tại Hawaii (báo cáo điều tra của FCC, tháng 4/2018): lúc <b>8:07</b>, điện thoại khắp bang đồng loạt hiện thông báo tên lửa đạn đạo đang bay tới và ghi rõ <i>“Đây không phải tập trận”</i>.</p>
          <table class="t"><tr><th>mốc giờ</th><th>sự kiện trên hệ thống cảnh báo</th><th>khoảng cách</th></tr>
          <tr><td>8:07</td><td>phát nhầm cảnh báo tên lửa thật trên toàn bang</td><td>mốc bắt đầu</td></tr>
          <tr><td>8:45</td><td>gửi thông điệp đính chính qua hệ thống cảnh báo</td><td><b>38 phút</b> sau</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, sáng ngày 13 tháng 1 năm 2018 tại một bang hải đảo của Mỹ, điện thoại khắp nơi bỗng báo có tên lửa đang bay tới. Cảnh báo giả phát đi lúc 8 giờ 7 phút sáng và làm rất nhiều người dân hoảng loạn. Phải đến 8 giờ 45 phút, tức là 38 phút sau, thông điệp đính chính mới được gửi đi qua hệ thống cảnh báo."
      - show: |
          <p>Trên màn hình vận hành hôm đó, cả lệnh <b>tập trận</b> lẫn lệnh <b>cảnh báo thật</b> đều nằm chung trong một danh sách thả xuống, và khi bấm vào đều hiện cùng một câu hỏi: <code>Are you sure that you want to send this Alert?</code></p>
          <div class="box key">Hôm nay ta trả lời: lỗi trượt khác lỗi nhầm ở đâu? Vì sao hộp xác nhận giống hệt nhau không chặn được thảm hoạ? Và thiết kế giao diện phải đổi thế nào?</div>
        focus: [1, 2]
        say: "Trên màn hình vận hành hôm đó, lệnh tập trận và lệnh cảnh báo thật nằm chung một danh sách và hiện cùng một câu hỏi xác nhận. Hôm nay ta trả lời ba câu hỏi, lỗi trượt khác lỗi nhầm ở đâu, vì sao hộp xác nhận giống nhau thất bại, và giao diện phải sửa thế nào."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại cách đổi giờ sang phút và hai bước của một thao tác"
    checks:
      - "8 * 60 + 7 == 487 and 8 * 60 + 45 == 525 and 525 - 487 == 38"
      - "45 - 7 == 38 and alg.hci_minutes_diff(8, 7, 8, 45) == 38"
    steps:
      - show: |
          <p><b>① Đổi mốc thời gian ra số phút trong ngày.</b> Một giờ có 60 phút, nên thời điểm $h$ giờ $m$ phút cách nửa đêm đúng $60 \cdot h + m$ phút:</p>
          $$8\text{ giờ } 07\text{ phút} = 60 \cdot 8 + 7 = 487\text{ phút}, \qquad 8\text{ giờ } 45\text{ phút} = 60 \cdot 8 + 45 = 525\text{ phút}$$
        introduces: [cdot]
        focus: [1, 2, 2]
        say: "Trước hết ta ôn lại cách tính khoảng thời gian giữa hai mốc giờ trong cùng một ngày. Dấu chấm nằm giữa dòng là phép nhân, một giờ có 60 phút nên thời điểm h giờ m phút cách nửa đêm đúng 60 nhân h cộng m phút. Với 8 giờ 7 phút ta có 60 nhân 8 cộng 7 bằng 487 phút, còn 8 giờ 45 phút là 525 phút."
      - show: |
          <p><b>② Hai chặng trong đầu người dùng trước mỗi cú bấm.</b> Mọi thao tác trên máy đều đi qua hai chặng nối tiếp nhau:</p>
          <table class="t"><tr><th>chặng</th><th>câu hỏi trong đầu người dùng</th><th>ví dụ</th></tr>
          <tr><td>1. Lập ý định</td><td>mình đang ở tình huống nào, cần làm việc gì?</td><td>đây là buổi tập trận hay tình huống khẩn cấp thật?</td></tr>
          <tr><td>2. Thực hiện tay</td><td>để làm việc đó, tay phải bấm vào nút nào?</td><td>di chuột tới đúng dòng và bấm nút gửi</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai cần nhớ là mọi thao tác của con người trước máy tính đều đi qua hai chặng nối tiếp nhau. Chặng một là lập ý định ở trong đầu, tức là đánh giá tình huống rồi quyết định mình cần làm việc gì. Chặng hai là thực hiện bằng tay và mắt, tức là đưa con trỏ tới đúng chỗ trên màn hình và bấm nút."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: mốc thời gian, lỗi trượt, lỗi nhầm và hộp xác nhận"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu / thuật ngữ</th><th>đọc là</th><th>nghĩa trong bài</th></tr>
          <tr><td>$t_1, t_2$</td><td>tê một, tê hai</td><td>hai mốc thời gian (tính bằng phút từ đầu ngày), với $t_2 \ge t_1$</td></tr>
          <tr><td>$\Delta t = t_2 - t_1$</td><td>đen-ta tê</td><td>khoảng thời gian trôi qua giữa mốc đầu và mốc sau</td></tr>
          <tr><td>lỗi trượt (<i>slip</i>)</td><td>lỗi trượt</td><td>ý định trong đầu <b>đúng</b>, nhưng tay hoặc mắt thực hiện <b>sai</b></td></tr>
          <tr><td>lỗi nhầm (<i>mistake</i>)</td><td>lỗi nhầm</td><td>hiểu sai tình huống nên lập ý định <b>sai</b> ngay từ đầu, rồi tay làm đúng theo ý định sai đó</td></tr></table>
        introduces: [sub, det]
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Bảng này giải mã các ký hiệu và thuật ngữ ta sẽ dùng xuyên suốt khoá học. Chữ t có số nhỏ ở chân là mốc thời gian, còn hình tam giác trước chữ t đọc là đen-ta tê, chỉ hiệu số giữa hai mốc. Lỗi trượt xảy ra khi ý định trong đầu hoàn toàn đúng nhưng tay bấm lệch sang nút khác. Còn lỗi nhầm xảy ra khi hiểu sai tình huống nên lập kế hoạch sai ngay từ đầu."
      - clear: true
        show: |
          <table class="t"><tr><th>loại hộp xác nhận</th><th>hiện gì trên màn hình</th><th>tác dụng với lỗi trượt và lỗi nhầm</th></tr>
          <tr><td>xác nhận chung chung</td><td>chỉ hỏi <i>“Bạn có chắc không?”</i>, không nêu nội dung sắp gửi</td><td>người dùng bấm đồng ý theo thói quen, không chặn được lỗi nhầm</td></tr>
          <tr><td>xác nhận có ngữ cảnh</td><td>hiện nguyên văn nội dung, phạm vi ảnh hưởng và bắt thao tác riêng cho lệnh thật</td><td>buộc người dùng đối chiếu ý định trong đầu với hậu quả thật trên màn hình</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Bảng thứ hai phân biệt hai kiểu hộp xác nhận trên giao diện phần mềm. Hộp xác nhận chung chung chỉ hỏi một câu giống nhau cho mọi lệnh nên người dùng bấm đồng ý theo phản xạ. Ngược lại, hộp xác nhận có ngữ cảnh hiện nguyên văn thông điệp và phạm vi ảnh hưởng để người trực thấy rõ hậu quả thật."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai nhánh hành động rất khác nhau nhưng giao diện cho cùng một cửa"
    steps:
      - show: |
          <div><svg width="1460" height="390" viewBox="0 0 1460 390">
          <defs><marker id="hc0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
          <g font-size="22" fill="#1f2937" text-anchor="middle">
          <rect x="40" y="55" width="380" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
