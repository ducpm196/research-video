  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức độ khó dạng Shannon và đường thẳng thời gian trỏ"
    checks:
      - "alg.hci_fitts_id(0, 16) == 0"
      - "round(alg.hci_fitts_id(256, 16), 2) == 4.09"
    steps:
      - show: |
          <p><b>Bước 1 — Tỉ số khoảng cách trên bề rộng $D / W$.</b> Cùng khoảng cách $D$ nhưng bề rộng $W$ giảm một nửa thì việc căn trúng khó tương đương như giữ nguyên $W$ mà đẩy đích ra xa gấp đôi:</p>
          $$\text{Độ gay gắt hình học} = \frac{D}{W} \qquad \text{(không thứ nguyên vì } D \text{ và } W \text{ cùng đơn vị)}$$
        focus: [1, 2]
        say: "Bước một, ta xét tỉ số hình học giữa khoảng cách D và bề rộng W. Vì D và W đo cùng đơn vị điểm ảnh, thương số D chia W là con số không thứ nguyên, phản ánh mức độ nhỏ của đích so với quãng đường phải đi."
      - show: |
          <p><b>Bước 2 — Lấy lôgarit cơ số 2 và cộng 1 (dạng chuẩn MacKenzie, 1992).</b> Mỗi nhịp chỉnh tay cắt khoảng lệch còn lại theo một tỉ lệ gần như cố định (ví dụ còn một nửa) nên số nhịp tỉ lệ với $\log_2$; cộng thêm $1$ giúp độ khó không bao giờ âm kể cả khi $D = 0$:</p>
          $$\text{ID} = \log_2\!\left(\frac{D}{W} + 1\right) \text{ (bit)}, \qquad D = 0 \;\implies\; \text{ID} = \log_2(0 + 1) = 0\text{ bit}$$
        focus: [1, 2, 2]
        say: "Bước hai, mỗi nhịp điều chỉnh của mắt và tay thu hẹp khoảng lệch theo cấp số nhân, nên số nhịp tăng theo hàm lôgarit cơ số 2. Theo dạng công thức chuẩn năm 1992, ta cộng thêm 1 bên trong lôgarit của tỉ số D chia W. Nhờ đó khi con trỏ nằm sẵn tại tâm nút tức D bằng 0, suy ra độ khó bằng lôgarit cơ số 2 của 1 bằng đúng 0 bit."
      - clear: true
        show: |
          <p><b>Bước 3 — Ghép thời gian khởi động $a$ và tốc độ xử lý $b$.</b> Thời gian trỏ $T$ gồm phần cứng cố định $a$ cộng với tích của $b$ và độ khó $\text{ID}$:</p>
          $$T = a + b \cdot \text{ID} = a + b \cdot \log_2\!\left(\frac{D}{W} + 1\right)$$
        focus: [1, 2]
        say: "Bước ba, ta chuyển từ số bit độ khó sang thời gian tính bằng giây. Vì tay cần thời gian khởi động a cố định và mất thêm b giây cho mỗi bit độ khó, nên tổng thời gian trỏ T bằng a cộng b nhân với độ khó."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "So sánh nút rộng 16 điểm ảnh với nút rộng 64 điểm ảnh ở khoảng cách 256"
    checks:
      - "256 // 16 + 1 == 17 and round(alg.hci_fitts_id(256, 16), 2) == 4.09"
      - "round(alg.hci_fitts_time(256, 16, 0.1, 0.15), 3) == 0.713 and round(0.1 + 0.15 * 4.0875, 3) == 0.713"
      - "256 // 64 + 1 == 5 and round(alg.hci_fitts_id(256, 64), 2) == 2.32"
      - "round(alg.hci_fitts_time(256, 64, 0.1, 0.15), 3) == 0.448 and round(0.713 - 0.448, 3) == 0.265"
    steps:
      - show: |
          <p><b>Bước 1 — Tính độ khó và thời gian cho nút hẹp ($D = 256$, $W = 16$).</b> Với hằng số thiết bị $a = 0{,}1\text{ s}$ và $b = 0{,}15\text{ s/bit}$:</p>
          $$\text{ID}_1 = \log_2\!\left(\frac{256}{16} + 1\right) = \log_2(16 + 1) = \log_2 17 \approx \hlb{4{,}09}\text{ bit}$$
          $$T_1 = 0{,}1 + 0{,}15 \cdot \log_2 17 \approx 0{,}1 + 0{,}15 \cdot 4{,}0875 \approx \hl{0{,}713}\text{ s}$$
        focus: [1, 2, 3]
        say: "Ta tính từng bước cho ví dụ chuẩn của bài với a bằng 0 phẩy 1 giây và b bằng 0 phẩy 15 giây mỗi bit. Ở bước một, nút hẹp có D bằng 256 và W bằng 16, lấy 256 chia 16 cộng 1 bằng 17, suy ra độ khó xấp xỉ 4 phẩy 09 bit. Thay vào công thức thời gian, 0 phẩy 1 cộng 0 phẩy 15 nhân 4 phẩy 09 cho kết quả xấp xỉ 0 phẩy 713 giây."
      - show: |
          <p><b>Bước 2 — Tính độ khó và thời gian khi nới rộng nút lên gấp 4 lần ($D = 256$, $W = 64$).</b></p>
          $$\text{ID}_2 = \log_2\!\left(\frac{256}{64} + 1\right) = \log_2(4 + 1) = \log_2 5 \approx \hlb{2{,}32}\text{ bit}$$
          $$T_2 = 0{,}1 + 0{,}15 \cdot \log_2 5 \approx 0{,}1 + 0{,}15 \cdot 2{,}3219 \approx \hlg{0{,}448}\text{ s}$$
        focus: [1, 2, 3]
        say: "Bước hai, giữ nguyên khoảng cách 256 nhưng nới rộng nút lên 64 điểm ảnh. Khi đó 256 chia 64 bằng 4, cộng 1 bằng 5, nên độ khó giảm xuống còn lôgarit cơ số 2 của 5 xấp xỉ 2 phẩy 32 bit. Thay vào công thức thời gian, 0 phẩy 1 cộng 0 phẩy 15 nhân 2 phẩy 32 chỉ còn xấp xỉ 0 phẩy 448 giây."
      - clear: true
        show: |
          <p><b>Bước 3 — Độ chênh lệch thời gian và ý nghĩa của thanh thực đơn sát mép trên.</b></p>
          <table class="t"><tr><th>phương án thiết kế</th><th>$D/W + 1$</th><th>độ khó (bit)</th><th>thời gian $T$</th><th>tiết kiệm mỗi lần bấm</th></tr>
          <tr><td>nút hẹp $W = 16$ giữa màn hình</td><td>$17$</td><td>$\approx 4{,}09$</td><td>$\approx 0{,}713$ s</td><td>mức gốc</td></tr>
          <tr><td>nút rộng $W = 64$ giữa màn hình</td><td>$5$</td><td>$\approx 2{,}32$</td><td>$\approx 0{,}448$ s</td><td>nhanh hơn $0{,}265$ s ($\approx 37\%$)</td></tr>
          <tr><td>nút đặt sát mép màn hình ($W_{\text{hiệu dụng}}$ rất lớn)</td><td>sát $1$</td><td>giảm mạnh</td><td>sát mức sàn</td><td>không cần hãm phanh chiều dọc</td></tr></table>
        focus: [1, "2.3", "2.4"]
        say: "Bước ba, ta đặt các con số vào bảng để thấy rõ giá trị thực tế. Việc mở rộng nút từ 16 lên 64 điểm ảnh giúp giảm 1 phẩy 77 bit độ khó và tiết kiệm 0 phẩy 265 giây, tức nhanh hơn khoảng 37 phần trăm ở mỗi cú bấm. Đặc biệt nếu đặt thanh thực đơn dính sát mép trên màn hình, viền màn hình chặn con trỏ lại nên người dùng đẩy chuột thẳng lên mép mà không tốn nhịp hãm phanh nào."
      - show: |
          <p><b>Bước 4 — Hai cách làm đạt cùng một độ khó: mở rộng nút gấp 4 hoặc đưa nút lại gần gấp 4.</b> Nếu giữ $W = 16$ nhưng đưa nút về gần con trỏ ở $D = 64$ (như thực đơn chuột phải mở ngay tại chỗ):</p>
          $$\text{ID}_3 = \log_2\!\left(\frac{64}{16} + 1\right) = \log_2 5 \approx 2{,}32\text{ bit} \;\implies\; T_3 \approx \hlg{0{,}448}\text{ s}$$
        focus: [1, 1, 2]
        say: "Bước bốn cho ta một nguyên lý thiết kế rất đẹp về tỉ số D chia W. Nếu màn hình chật không thể tăng bề rộng W lên 64, ta có thể đưa nút lại gần con trỏ 4 lần về khoảng cách D bằng 64 như thực đơn chuột phải. Khi đó tỉ số 64 chia 16 vẫn bằng 4, nên độ khó vẫn là lôgarit cơ số 2 của 5 và thời gian cũng chỉ mất 0 phẩy 448 giây."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng luỹ thừa ngược và hiệu hai lôgarit"
    checks:
      - "round(2 ** alg.hci_fitts_id(256, 16) - 1) == 16 == 256 // 16"
      - "round(2 ** alg.hci_fitts_id(256, 64) - 1) == 4 == 256 // 64"
      - "round(0.15 * (math.log2(17) - math.log2(5)), 3) == 0.265 == round(alg.hci_fitts_time(256, 16) - alg.hci_fitts_time(256, 64), 3)"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Lấy lũy thừa cơ số 2 ngược lại từ độ khó để khôi phục tỉ số $D / W$.</b> Vì $\text{ID} = \log_2(D/W + 1)$ nên $2^{\text{ID}} - 1$ phải bằng đúng $D / W$:</p>
          $$2^{4{,}0875} - 1 \approx 17 - 1 = 16 = \frac{256}{16} \;\checkmark, \qquad 2^{2{,}3219} - 1 \approx 5 - 1 = 4 = \frac{256}{64} \;\checkmark$$
        focus: [1, 2, 2]
        say: "Ta tự kiểm tra bằng phép toán ngược của lôgarit là hàm mũ cơ số hai. Vì độ khó bằng lôgarit cơ số 2 của D chia W cộng 1, nên khi lấy 2 mũ độ khó rồi trừ đi 1 ta phải thu lại đúng tỉ số D chia W ban đầu. Với 4 phẩy 0875 bit ta có 2 mũ 4 phẩy 0875 trừ 1 bằng đúng 16, và với 2 phẩy 3219 bit ta thu lại đúng 4, khớp hoàn toàn."
      - show: |
          <p><b>Kiểm tra 2 — Tính trực tiếp độ tiết kiệm thời gian mà không cần hằng số $a$.</b> Khi trừ $T_1 - T_2$ trên cùng một thiết bị, hằng số $a$ tự triệt tiêu:</p>
          $$\Delta T = T_1 - T_2 = b \cdot (\text{ID}_1 - \text{ID}_2) = 0{,}15 \cdot (\log_2 17 - \log_2 5) \approx 0{,}15 \cdot 1{,}7655 \approx 0{,}265\text{ s} \;\checkmark$$
        focus: [1, 2]
        say: "Kiểm tra thứ hai là tính phần thời gian tiết kiệm bằng cách lấy hiệu hai độ khó nhân với b. Vì hai lần đo trên cùng một thiết bị nên a tự triệt tiêu, lấy 0 phẩy 15 nhân hiệu hai độ khó ra đúng 0 phẩy 265 giây."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi áp dụng định luật thời gian trỏ"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Lấy nguyên bộ hằng số $a, b$ của chuột máy tính áp cho màn hình cảm ứng hoặc bàn di chuột <b class="red">(a, b phải đo riêng cho từng thiết bị và từng nhóm người dùng)</b>
          <br><span class="note">Chuột để bàn, ngón tay trên điện thoại và bút cảm ứng có cơ học tay khác hẳn nhau; dùng chung $a, b$ sẽ ước lượng sai thời gian tuyệt đối.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất rất hay gặp ở người đã đi làm là chép một bộ hằng số a và b từ sách giáo khoa của chuột máy tính rồi đem áp vào màn hình cảm ứng điện thoại. Hằng số a và b phụ thuộc mạnh vào từng thiết bị đầu vào và từng nhóm người dùng như người trẻ hay người cao tuổi, nên dùng chéo thiết bị là sai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đặt một dãy khoảng trống 1–2 điểm ảnh giữa nút bấm và mép màn hình <b class="red">(làm mất hoàn toàn lợi thế tường chặn của mép màn hình)</b></div>
          $$\text{Cách mép } 1\text{ điểm ảnh} \;\implies\; \text{Trượt qua nút là bấm trượt (mất đích vô hạn)}$$
          <p class="note">Lợi thế mép chỉ có với chuột hoặc bàn di chuột (viền màn hình giữ con trỏ lại); ngón tay trên màn hình cảm ứng không bị viền chặn nên mép không phải đích lớn.</p>
        focus: [1, 2, 3]
        say: "Lỗi thứ hai trong lập trình giao diện là để chừa một viền trang trí rộng chỉ một hai điểm ảnh giữa nút bấm với mép ngoài cùng của màn hình. Khoảng hở nhỏ xíu đó phá hỏng hoàn toàn bức tường chặn của mép màn hình, bởi vì khi người dùng vẩy chuột kịch kim sát mép thì con trỏ đã trượt ra ngoài vùng nhận cú bấm. Cũng cần nhớ lợi thế mép chỉ có với chuột hoặc bàn di chuột, còn ngón tay trên màn hình cảm ứng không bị viền màn hình chặn lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng kích thước chiều ngang của nút cho chuyển động trỏ theo chiều dọc <b class="red">(bề rộng W phải đo dọc theo hướng di chuyển của con trỏ)</b>
          <br><span class="note">Một dòng chữ trong danh sách rộng 300 điểm ảnh nhưng chỉ cao 16 điểm ảnh: khi di chuột từ trên xuống thì $W = 16$ chứ không phải $300$.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là lấy nhầm chiều rộng ngang của một nút hình chữ nhật khi con trỏ đang di chuyển từ trên xuống dưới. Bạn cần nhớ W là bề rộng của đích đo dọc theo trục chuyển động của tay, nên khi rà chuột từ trên xuống một danh sách thì W chính là chiều cao rất hẹp của từng dòng."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đặt nút nguy hiểm (“Xoá vĩnh viễn”) vừa to vừa nằm sát nút dùng thường xuyên (“Lưu”) <b class="red">(cả D nhỏ lẫn W lớn đều làm tăng xác suất bấm nhầm khi trượt tay)</b>
          <br><span class="note">Định luật thời gian trỏ hoạt động theo cả hai chiều: muốn nút thường dùng dễ bấm thì làm $W$ lớn và $D$ nhỏ; muốn nút huỷ diệt khó bấm nhầm thì phải đẩy $D$ ra xa.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư của người thiết kế là đặt nút xoá dữ liệu ngay sát bên cạnh nút lưu và làm cả hai nút to bằng nhau. Cái gì vừa gần vừa to thì tay rất dễ chạm trúng, nên với những nút nguy hiểm ta phải chủ động đẩy khoảng cách D ra xa."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính thời gian trỏ và chọn vị trí đặt nút"
    checks:
      - "alg.hci_fitts_id(210, 30) == 3.0 and round(alg.hci_fitts_time(210, 30, 0.1, 0.15), 2) == 0.55"
      - "alg.hci_fitts_id(210, 70) == 2.0 and round(alg.hci_fitts_time(210, 70, 0.1, 0.15), 2) == 0.40"
      - "round(0.55 - 0.40, 2) == 0.15"
    steps:
      - show: |
          <p>Trên một giao diện có $a = 0{,}1\text{ s}$ và $b = 0{,}15\text{ s/bit}$, con trỏ đang cách nút <b>“Tiếp tục”</b> một khoảng $D = 210$ điểm ảnh (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>việc cần làm</th></tr>
          <tr><td>1</td><td>Khi bề rộng nút dọc theo hướng trỏ là $W = 30$ điểm ảnh, hãy tính độ khó $\text{ID}$ (bit) và thời gian trỏ $T$ (giây).</td></tr>
          <tr><td>2</td><td>Nếu tăng bề rộng nút lên $W = 70$ điểm ảnh (giữ $D = 210$), độ khó $\text{ID}$ và thời gian $T$ giảm xuống còn bao nhiêu?</td></tr>
          <tr><td>3</td><td>Giữa việc đặt nút hay dùng cách mép màn hình $2$ điểm ảnh cho đẹp mắt và việc kéo vùng nhận cú bấm chạm khít mép màn hình, bạn chọn cách nào và vì sao?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự tính toán để chọn thiết kế. Trên một màn hình có a bằng 0 phẩy 1 giây và b bằng 0 phẩy 15 giây mỗi bit, con trỏ đang cách nút tiếp tục 210 điểm ảnh. Câu một, tính độ khó và thời gian trỏ khi bề rộng nút là 30 điểm ảnh. Câu hai, tính lại độ khó và thời gian trỏ khi tăng bề rộng nút lên 70 điểm ảnh, và câu ba, quyết định xem có nên để hở 2 điểm ảnh ở mép màn hình không. Bạn hãy dừng video lại và làm ra giấy nhé."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước tính</th><th>đáp số</th></tr>
          <tr><td>1. Với $W = 30$</td><td>$\text{ID} = \log_2(210 / 30 + 1) = \log_2(7 + 1) = \log_2 8 = 3$ bit → $T = 0{,}1 + 0{,}15 \cdot 3$</td><td>$\text{ID} = \mathbf{3}\text{ bit}$, $T = \mathbf{0{,}55}\text{ s}$</td></tr>
          <tr><td>2. Với $W = 70$</td><td>$\text{ID} = \log_2(210 / 70 + 1) = \log_2(3 + 1) = \log_2 4 = 2$ bit → $T = 0{,}1 + 0{,}15 \cdot 2$</td><td>$\text{ID} = \mathbf{2}\text{ bit}$, $T = \mathbf{0{,}40}\text{ s}$ (nhanh hơn $0{,}15$ s)</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Ở câu một, lấy 210 chia 30 cộng 1 bằng 8, lôgarit cơ số 2 của 8 bằng 3 bit, nên thời gian T bằng 0 phẩy 55 giây. Ở câu hai, với bề rộng 70 thì 210 chia 70 được 3, cộng 1 bằng 4, lôgarit cơ số 2 của 4 bằng 2 bit, và thời gian giảm xuống còn 0 phẩy 40 giây."
      - show: |
          <table class="t"><tr><th>phương án ở câu 3</th><th>phân tích cơ chế</th></tr>
          <tr><td>Chừa khoảng trống $2$ điểm ảnh ở sát mép</td><td><b class="red">(sai)</b> Người dùng phải hãm phanh con trỏ để không lọt vào khe $2$ điểm ảnh vô tác dụng</td></tr>
          <tr><td>Kéo vùng nhận cú bấm chạm khít mép màn hình (dù phần hình vẽ nút bên trong có thể bo góc)</td><td><b class="green">✓ Đúng</b> — giữ trọn lợi thế tường chặn của mép màn hình mà nhìn vẫn thoáng đẹp</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở câu ba, ta chọn kéo vùng nhận cú bấm chạm khít vào mép màn hình thay vì bỏ phí 2 điểm ảnh ngoài rìa. Phần màu nền của nút vẫn có thể vẽ lùi vào vài điểm ảnh cho đẹp, nhưng khung bắt sự kiện chuột thì phải phủ kín ra tận mép."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic và quy tắc thiết kế đích bấm"
    steps:
      - show: |
          <div class="chain"><span class="n">khoảng cách D và bề rộng W</span><span class="a">→</span>
          <span class="n">độ khó log₂(D/W + 1)</span><span class="a">→</span>
          <span class="n">thời gian T = a + b nhân ID</span><span class="a">→</span>
          <span class="n">ưu tiên đích to, đích gần và sát mép màn hình</span></div>
        focus: [1, 1]
        say: "Tổng kết lại chuỗi logic của bài hai, từ khoảng cách D và bề rộng W dọc theo hướng di chuyển ta tính được độ khó theo lôgarit cơ số 2 của D chia W cộng 1. Nhân độ khó với b rồi cộng a sẽ cho ra thời gian trỏ T, chỉ dẫn ta làm nút thường dùng to hơn, gần hơn hoặc sát mép màn hình."
      - show: |
          <div class="box key"><b>Tư duy:</b> Mọi điểm ảnh trên màn hình không có giá trị ngang nhau — <b>vị trí hiện tại của con trỏ</b> và <b>bốn góc, bốn mép màn hình</b> là những mảnh đất vàng có thời gian trỏ ngắn nhất.</div>
        focus: [1, 1]
        say: "Tư duy cần mang theo là các vị trí trên màn hình không hề bình đẳng với bàn tay người dùng. Chỗ con trỏ đang đứng có D bằng không, còn bốn mép màn hình có bề rộng chặn rất lớn, nên hãy dành những vị trí đó cho thao tác quan trọng."
