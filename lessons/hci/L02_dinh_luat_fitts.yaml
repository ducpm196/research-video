scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tăng bề rộng nút gấp bốn lần giúp tiết kiệm bao nhiêu phần giây?"
    checks:
      - "round(alg.hci_fitts_id(256, 16), 2) == 4.09 and round(alg.hci_fitts_time(256, 16, 0.1, 0.15), 3) == 0.713"
      - "round(alg.hci_fitts_id(256, 64), 2) == 2.32 and round(alg.hci_fitts_time(256, 64, 0.1, 0.15), 3) == 0.448"
    steps:
      - show: |
          <p>Con trỏ chuột đang đứng cách nút <b>“Lưu”</b> một khoảng $D = 256$ điểm ảnh. Thiết kế cũ để nút rộng $W = 16$ điểm ảnh; thiết kế mới nới rộng nút lên $W = 64$ điểm ảnh (với $a = 0{,}1\text{ s}$, $b = 0{,}15\text{ s/bit}$ — số minh hoạ):</p>
          <table class="t"><tr><th>thiết kế</th><th>khoảng cách $D$</th><th>bề rộng $W$</th><th>độ khó (bit)</th><th>thời gian trỏ $T$</th></tr>
          <tr><td>nút hẹp</td><td>$256$</td><td>$16$</td><td>$\log_2 17 \approx 4{,}09$ bit</td><td>$\approx 0{,}713$ s</td></tr>
          <tr><td>nút rộng gấp 4</td><td>$256$</td><td>$64$</td><td>$\log_2 5 \approx 2{,}32$ bit</td><td>$\approx 0{,}448$ s</td></tr></table>
        introduces: [log]
        focus: [1, "2.2", "2.3"]
        say: "Chào bạn, giả sử con trỏ chuột đang đứng cách nút lưu một khoảng 256 điểm ảnh. Khi nút chỉ rộng 16 điểm ảnh, người dùng mất khoảng 0 phẩy 713 giây để đưa chuột tới bấm. Nhưng khi nới rộng nút lên 64 điểm ảnh ở cùng khoảng cách đó, thời gian trỏ rút xuống chỉ còn 0 phẩy 448 giây."
      - show: |
          <div class="box key">Hôm nay ta trả lời: công thức nào tính ra $0{,}713\text{ s}$ và $0{,}448\text{ s}$? Vì sao trong biểu thức lôgarit lại cộng thêm $1$? Và vì sao mép cùng góc màn hình là những đích bấm nhanh nhất?</div>
        focus: [1, 1]
        say: "Hôm nay ta trả lời ba câu hỏi định lượng quan trọng. Công thức nào tính ra thời gian trỏ từ khoảng cách và bề rộng, vì sao bên trong lôgarit lại cộng một, và vì sao mép màn hình rất dễ bấm?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại lôgarit cơ số 2 và cách ước lượng nhanh giữa hai lũy thừa"
    checks:
      - "math.log2(1) == 0 and math.log2(2) == 1 and math.log2(4) == 2 and math.log2(8) == 3 and math.log2(16) == 4"
      - "2 < math.log2(5) < 3 and 4 < math.log2(17) < 5"
      - "round(2 ** 2.32, 2) == 4.99 and round(2 ** 4.09, 2) == 17.03 and round(math.log2(5), 2) == 2.32 and round(math.log2(17), 2) == 4.09"
    steps:
      - show: |
          <p><b>① Lôgarit cơ số 2.</b> $\log_2 x$ trả lời câu hỏi <i>“$2$ mũ bao nhiêu thì bằng $x$?”</i>, tức là phải nhân bao nhiêu số $2$ với nhau để ra $x$. Ví dụ $2 \cdot 2 \cdot 2 = 2^3 = 8$ nên $\log_2 8 = 3$; còn $2^0 = 1$ (không nhân số 2 nào) nên $\log_2 1 = 0$:</p>
          $$\log_2 1 = 0, \quad \log_2 2 = 1, \quad \log_2 4 = 2, \quad \log_2 8 = 3, \quad \log_2 16 = 4$$
          <p>Trực giác: mỗi lần $x$ <b>gấp đôi</b>, $\log_2 x$ chỉ tăng thêm đúng $1$. Vì vậy lôgarit lớn lên rất chậm khi $x$ tăng.</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Trước hết, ta cần hiểu lôgarit cơ số hai, phép toán nằm ngay trong công thức của bài. Ký hiệu lôgarit cơ số 2 của x trả lời câu hỏi 2 mũ bao nhiêu thì bằng x, tức là phải nhân bao nhiêu số 2 với nhau để ra x. Ví dụ 2 nhân 2 nhân 2 bằng 8 nên lôgarit cơ số 2 của 8 bằng 3, còn 2 mũ 0 bằng 1 nên lôgarit cơ số 2 của 1 bằng 0. Tương tự, lôgarit cơ số 2 của 2 bằng 1, của 4 bằng 2 và của 16 bằng 4. Điều cần cảm nhận là mỗi lần x gấp đôi thì lôgarit cơ số 2 của x chỉ tăng thêm đúng 1. Vì vậy lôgarit lớn lên rất chậm, khi x đi từ 1 lên 16 thì nó chỉ đi từ 0 lên 4."
      - show: |
          <p><b>② Ước lượng nhanh khi $x$ nằm sát một lũy thừa của 2.</b> Vì $5$ nhỉnh hơn $4 = 2^2$ một chút và $17$ nhỉnh hơn $16 = 2^4$ một chút:</p>
          $$2 = \log_2 4 \lt \log_2 5 \approx 2{,}32 \lt \log_2 8 = 3, \qquad 4 = \log_2 16 \lt \log_2 17 \approx 4{,}09 \lt \log_2 32 = 5$$
          <p>Số lẻ sau dấu phẩy lấy từ máy tính bỏ túi; thử ngược lại: $2^{2{,}32} \approx 4{,}99 \approx 5$ và $2^{4{,}09} \approx 17{,}03 \approx 17$.</p>
        focus: [1, 2, 2, 3]
        say: "Điều thứ hai là cách nhẩm nhanh các giá trị nằm sát lũy thừa của hai. Vì 5 lớn hơn 4 một chút nên lôgarit cơ số 2 của 5 nằm ngay trên 2, xấp xỉ 2 phẩy 32. Tương tự, 17 lớn hơn 16 một chút nên lôgarit cơ số 2 của 17 nằm ngay trên 4, xấp xỉ 4 phẩy 09. Phần lẻ sau dấu phẩy lấy từ máy tính, và thử ngược lại thì 2 mũ 2 phẩy 32 xấp xỉ 4 phẩy 99, còn 2 mũ 4 phẩy 09 xấp xỉ 17 phẩy 03."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: khoảng cách D, bề rộng W, độ khó ID và hằng số a, b"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc là</th><th>nghĩa và đơn vị</th></tr>
          <tr><td>$D$</td><td>đê</td><td>khoảng cách từ vị trí con trỏ hiện tại tới tâm của đích (điểm ảnh hoặc mi-li-mét)</td></tr>
          <tr><td>$W$</td><td>vê-kép</td><td>bề rộng của đích dọc theo hướng di chuyển của con trỏ (cùng đơn vị với $D$)</td></tr>
          <tr><td>$\text{ID} = \log_2\!\left(\frac{D}{W} + 1\right)$</td><td>độ khó</td><td>chỉ số độ khó của thao tác trỏ, tính bằng đơn vị <b>bit</b></td></tr>
          <tr><td>$a$</td><td>a</td><td>thời gian khởi động cố định của tay và thiết bị (giây), không phụ thuộc vào độ khó</td></tr>
          <tr><td>$b$</td><td>bê</td><td>độ dốc: thời gian tốn thêm cho mỗi <b>1 bit</b> độ khó (giây trên bit)</td></tr>
          <tr><td>$T = a + b \cdot \text{ID}$</td><td>tê</td><td>tổng thời gian trung bình để di chuyển con trỏ tới đích (giây)</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.7"]
        say: "Bảng này giải mã các đại lượng trong định luật thời gian trỏ. Chữ D là khoảng cách từ con trỏ tới tâm nút bấm, còn chữ W là bề rộng của nút dọc theo hướng di chuyển. Tỉ số D chia W cộng 1 lấy lôgarit cơ số 2 được gọi là chỉ số độ khó, tính bằng đơn vị bit. Hằng số a là thời gian khởi động cố định tính bằng giây, còn b là số giây tốn thêm cho mỗi bit độ khó. Tổng thời gian trỏ T bằng a cộng b nhân với độ khó."

