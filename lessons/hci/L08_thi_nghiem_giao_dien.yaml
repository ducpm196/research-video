    reason: "chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác - NOT_VERIFIED bằng tai người"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Giao diện sau thắng vì tốt hơn hay vì người thử đã quen tay?"
    checks:
      - "alg.hci_mappings(3) == 6"
      - "alg.hci_is_latin_square([['A', 'B', 'C'], ['B', 'C', 'A'], ['C', 'A', 'B']]) is True"
      - "alg.hci_mappings(4) == 24"
    steps:
      - show: |
          <p>Ở bài 7, ta đã đo điểm cảm nhận sau mỗi phiên thử. Bây giờ muốn <b>so sánh hai giao diện $A$ và $B$</b>, nếu cho mọi người thử $A$ trước rồi thử $B$ sau:</p>
          $$\text{Mọi người thử } A \to B \quad\implies\quad \text{Giao diện } B \text{ nhanh hơn } 20\% \;\text{(số minh hoạ)}$$
          <table class="t"><tr><th>cách giải thích</th><th>nguyên nhân thực sự</th><th>kết luận thiết kế</th></tr>
          <tr><td><b>giả thuyết thiết kế</b></td><td>giao diện $B$ thực sự dễ dùng hơn $A$</td><td>nên chọn giao diện $B$</td></tr>
          <tr><td><b>hiệu ứng học quen</b></td><td>người thử đã thuộc bài toán ở lượt thử $A$</td><td class="red">chưa chắc $B$ tốt hơn $A$</td></tr></table>
        focus: [1, 2, 3]
        say: "Ở bài 7, ta đã biết cách chấm điểm cảm nhận khả dụng sau mỗi phiên thử nghiệm. Giả sử bạn cho 12 người làm tác vụ trên giao diện A rồi chuyển sang giao diện B, và thấy B nhanh hơn 20 phần trăm. Liệu B thực sự tốt hơn, hay người dùng chỉ thao tác nhanh hơn vì đã quen đề bài từ lượt thử A?"
      - show: |
          <p>Với $k = 3$ giao diện $(A, B, C)$, chạy đủ mọi thứ tự cần $3! = 6$ nhóm, còn <b>hình vuông Latin $3 \times 3$</b> chỉ cần 3 nhóm:</p>
          $$L_3 = \begin{pmatrix} A & B & C \\ B & C & A \\ C & A & B \end{pmatrix}$$
        focus: [1, 2, 2]
        say: "Khi cùng một người thử nhiều giao diện liên tiếp, kết quả đo luôn bị trộn lẫn với sự quen tay hoặc sự mệt mỏi. Thay vì phải chạy toàn bộ 6 hoán vị của ba thiết kế, khoa học thực nghiệm dùng hình vuông Latin với đúng 3 nhóm người dùng. Bài học hôm nay giúp bạn chọn đúng mô hình thí nghiệm và tự dựng bảng cân bằng thứ tự chuẩn xác."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: giai thừa, hoán vị và hai nguồn nhiễu khi đo người dùng"
    checks:
      - "alg.hci_mappings(3) == 6"
      - "alg.hci_mappings(5) == 120"
    steps:
      - show: |
          <p><b>Ôn nền 1 — số hoán vị $k!$ (bài 1).</b> Số cách sắp xếp thứ tự không lặp của $k$ giao diện là:</p>
          $$k! = 1 \times 2 \times \dots \times k \quad\implies\quad 2! = 2,\quad 3! = 6,\quad 4! = 24,\quad 5! = 120$$
        focus: [1, 2, 2]
        say: "Trước khi thiết kế thí nghiệm, ta ôn lại phép đếm số thứ tự sắp xếp đã gặp ở bài 1. Nếu có k giao diện cần thử lần lượt, số thứ tự khác nhau là k giai thừa, bằng 6 khi k bằng 3. Khi số giao diện tăng lên 4 hoặc 5, số thứ tự vọt lên 24 rồi 120 cách, khiến việc thử hết mọi thứ tự rất tốn kém."
      - show: |
          <p><b>Ôn nền 2 — hai nguồn nhiễu ngoài giao diện.</b> Thời gian hoàn thành tác vụ luôn chịu ảnh hưởng của:</p>
          <table class="t"><tr><th>nguồn sai lệch</th><th>bản chất thực nghiệm</th><th>cách khử sai lệch</th></tr>
          <tr><td><b>khác biệt cá nhân</b></td><td>người thao tác nhanh gấp đôi người thao tác chậm</td><td>cho cùng một người thử cả hai giao diện</td></tr>
          <tr><td><b>hiệu ứng thứ tự</b></td><td>làm lượt sau đã thuộc bài hoặc đã mỏi mắt</td><td>đảo thứ tự thử cân xứng giữa các nhóm</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Mặt khác, mỗi con số thời gian thu được đều chịu tác động của hai nguồn nhiễu lớn ngoài bản thân giao diện. Nguồn thứ nhất là khác biệt cá nhân, vì có người gõ phím nhanh gấp đôi người khác dù dùng chung màn hình. Nguồn thứ hai là hiệu ứng thứ tự, xuất hiện khi việc làm lượt trước giúp người thử quen tay hoặc làm họ mệt mỏi ở lượt sau."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ký hiệu thí nghiệm: số điều kiện k, số người N và bảng thứ tự L"
    checks:
      - "len(['A', 'B', 'C']) == 3"
      - "12 % 3 == 0"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>tên gọi</th><th>ý nghĩa trong thí nghiệm giao diện</th></tr>
          <tr><td>$k$</td><td>số điều kiện</td><td>số phiên bản giao diện cần so sánh ($A, B, C, \dots$)</td></tr>
          <tr><td>$N$</td><td>cỡ mẫu</td><td>tổng số người tham gia buổi thử nghiệm</td></tr>
          <tr><td>$j \in \{1, \dots, k\}$</td><td>vị trí lượt thử</td><td>lượt thử thứ nhất, thứ hai, …, thứ $k$ theo thời gian</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Ta thống nhất ba ký hiệu cơ bản trước khi lập bảng thiết kế thí nghiệm. Chữ k là số lượng phiên bản giao diện cần đem ra so sánh, chẳng hạn ba giao diện A, B và C. Chữ N hoa là tổng số người tham gia, còn chỉ số j từ 1 tới k đánh dấu vị trí lượt thử thứ j theo thời gian."
      - show: |
          <p><b>Bảng phân công thứ tự $L$ kích thước $k \times k$:</b> hàng $i$ là thứ tự thử của nhóm $i$, cột $j$ là giao diện ở lượt thứ $j$:</p>
          $$L = \begin{pmatrix} L_{1,1} & L_{1,2} & \dots & L_{1,k} \\ L_{2,1} & L_{2,2} & \dots & L_{2,k} \\ L_{k,1} & L_{k,2} & \dots & L_{k,k} \end{pmatrix}$$
        focus: [1, 2, 2]
        say: "Bảng phân công thứ tự được viết thành một ma trận vuông L có kích thước k nhân k. Mỗi hàng ngang thứ i quy định trình tự các giao diện mà nhóm người dùng thứ i sẽ lần lượt trải nghiệm. Mỗi cột dọc thứ j cho biết tại đúng lượt thử thứ j, từng nhóm đang thao tác trên giao diện nào."

  # ───────────────────────── 4. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Hai thiết kế cơ bản: giữa chủ thể và trong chủ thể"
    checks:
      - "12 * 1 == 12 and 12 * 3 == 36"
    steps:
      - show: |
          <p><b>1. Thiết kế giữa chủ thể (between-subject):</b> mỗi người chỉ thử <b>đúng 1 giao diện</b>.</p>
          $$\text{Nhóm 1 } (12\text{ người}) \to A, \qquad \text{Nhóm 2 } (12\text{ người}) \to B, \qquad \text{Nhóm 3 } (12\text{ người}) \to C \quad (N = 36)$$
        focus: [1, 2, 2]
        say: "Trong thiết kế giữa chủ thể, mỗi người tham gia được chia vào một nhóm duy nhất và chỉ dùng đúng một giao diện. Ưu điểm lớn nhất là không hề có sự lây kiến thức hay mệt mỏi tích lũy từ giao diện này sang giao diện khác. Tuy nhiên, bạn phải tuyển tới 36 người để có 12 lượt đo cho mỗi giao diện, và dễ bị nhiễu bởi chênh lệch kỹ năng giữa các nhóm."
      - show: |
          <p><b>2. Thiết kế trong chủ thể (within-subject):</b> mỗi người thử <b>đủ cả $k$ giao diện</b> (chỉ cần $N = 12$ người).</p>
          <table class="t"><tr><th>tiêu chí</th><th>giữa chủ thể</th><th>trong chủ thể</th></tr>
          <tr><td><b>số người cần tuyển</b></td><td>nhiều ($36$ người cho $3$ giao diện)</td><td>ít ($12$ người cho $3$ giao diện)</td></tr>
          <tr><td><b>nhiễu khác biệt cá nhân</b></td><td>cao (so người nhóm này với nhóm khác)</td><td>thấp (mỗi người tự so với chính mình)</td></tr>
          <tr><td><b>nhiễu hiệu ứng thứ tự</b></td><td>không có (mỗi người làm $1$ lượt)</td><td class="red">rất mạnh (bắt buộc cân bằng thứ tự)</td></tr></table>
        focus: [1, "2.3", "2.4"]
        say: "Ngược lại, trong thiết kế trong chủ thể, cùng 12 người đó sẽ lần lượt thử cả ba giao diện A, B và C. Cách này tiết kiệm nhân lực và giảm mạnh nhiễu cá nhân, vì mỗi người tự làm mốc chuẩn để so sánh với chính mình. Đổi lại, hiệu ứng thứ tự chắc chắn sẽ xuất hiện, buộc ta phải cân bằng thứ tự thử nghiệm giữa các nhóm."

  # ───────────────────────── 5. TRỰC GIÁC ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cơ chế đối xứng vị trí: vì sao hình vuông Latin khử được độ lệch thứ tự?"
    checks:
      - "(0 + 3 + 6) / 3 == 3.0"
    steps:
      - show: |
          <svg viewBox="0 0 600 220" width="100%" height="auto">
            <rect x="20" y="20" width="160" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <text x="100" y="50" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Lượt 1 (Chưa quen: +6s)</text>
            <rect x="220" y="20" width="160" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
            <text x="300" y="50" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Lượt 2 (Đã quen: +3s)</text>
            <rect x="420" y="20" width="160" height="50" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
            <text x="500" y="50" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Lượt 3 (Thành thạo: +0s)</text>
            <text x="100" y="105" fill="#38bdf8" font-size="16" text-anchor="middle">Nhóm 1: A</text>
            <text x="300" y="105" fill="#22c55e" font-size="16" text-anchor="middle">Nhóm 1: B</text>
            <text x="500" y="105" fill="#eab308" font-size="16" text-anchor="middle">Nhóm 1: C</text>
            <text x="100" y="145" fill="#22c55e" font-size="16" text-anchor="middle">Nhóm 2: B</text>
            <text x="300" y="145" fill="#eab308" font-size="16" text-anchor="middle">Nhóm 2: C</text>
            <text x="500" y="145" fill="#38bdf8" font-size="16" text-anchor="middle">Nhóm 2: A</text>
            <text x="100" y="185" fill="#eab308" font-size="16" text-anchor="middle">Nhóm 3: C</text>
            <text x="300" y="185" fill="#38bdf8" font-size="16" text-anchor="middle">Nhóm 3: A</text>
            <text x="500" y="185" fill="#22c55e" font-size="16" text-anchor="middle">Nhóm 3: B</text>
          </svg>
        focus: [1, 1, 1]
        say: "Hãy hình dung ở lượt 1 người dùng còn bỡ ngỡ nên mất thêm 6 giây, sang lượt 2 mất thêm 3 giây và đến lượt 3 thì mất thêm 0 giây. Nếu mọi người đều thử theo một thứ tự cố định A rồi B rồi C, giao diện A sẽ chịu trọn 6 giây phạt bỡ ngỡ. Ngược lại, khi xoay vòng ba nhóm trên hình vẽ, mỗi giao diện đều đứng ở lượt 1 đúng một lần, lượt 2 một lần và lượt 3 một lần."
      - clear: true
        show: |
          <p><b>Độ lệch thứ tự trung bình của từng giao diện $A, B, C$ trên cả 3 nhóm:</b></p>
          $$\frac{6 + 3 + 0}{3} = \hlg{3{,}0\text{ giây}}\quad (\text{như nhau cho cả } A, B \text{ và } C)$$
        focus: [1, 2]
        say: "Khi lấy trung bình cộng trên cả ba nhóm, mỗi giao diện đều nhận đúng một lần cộng 6 giây, một lần cộng 3 giây và một lần cộng 0 giây. Nhờ tính đối xứng vị trí của hình vuông Latin, phần thời gian bỡ ngỡ trung bình đều bằng 3 giây như nhau nên tự triệt tiêu khi so sánh."

  # ───────────────────────── 6. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Điều kiện hình vuông Latin và công thức dịch vòng tuần hoàn"
    checks:
      - "alg.hci_is_latin_square([['A', 'B', 'C'], ['B', 'C', 'A'], ['C', 'A', 'B']]) is True"
      - "[[(i + j) % 3 for j in range(3)] for i in range(3)] == [[0, 1, 2], [1, 2, 0], [2, 0, 1]]"
    steps:
      - show: |
          <p><b>Định nghĩa hình vuông Latin cấp $k$:</b></p>
          $$\text{Bảng } L_{k \times k} \text{ là hình vuông Latin} \iff \begin{cases} \text{mỗi hàng } i \text{ chứa đủ } k \text{ giao diện (mỗi cái } 1 \text{ lần)} \\ \text{mỗi cột } j \text{ chứa đủ } k \text{ giao diện (mỗi cái } 1 \text{ lần)} \end{cases}$$
        focus: [1, 2]
        say: "Theo định nghĩa tổ hợp, một bảng vuông cấp k là hình vuông Latin khi mỗi giao diện xuất hiện đúng một lần trên từng hàng và từng cột. Điều kiện hàng bảo đảm mỗi nhóm thử đủ k giao diện, còn điều kiện cột bảo đảm mỗi lượt thử đều có mặt đủ các giao diện."
      - show: |
          <p><b>Quy tắc dựng nhanh bằng phép dịch vòng tuần hoàn</b> (đẩy phần tử đầu hàng trước xuống cuối hàng sau):</p>
          $$\text{Hàng } 1: (A, B, C) \;\to\; \text{Hàng } 2: (B, C, A) \;\to\; \text{Hàng } 3: (C, A, B) \quad\implies\quad L_3 = \begin{pmatrix} A & B & C \\ B & C & A \\ C & A & B \end{pmatrix}$$
        focus: [1, 2, 2]
        say: "Cách nhanh nhất để dựng hình vuông Latin cấp k là dùng quy tắc dịch vòng tuần hoàn qua từng hàng. Ta viết hàng đầu theo thứ tự chuẩn A, B, C, rồi ở hàng kế tiếp đẩy chữ đứng đầu xuống cuối hàng. Vì dịch vòng đều đặn như vậy, với k bằng 3 ta suy ra ngay ba hàng là A-B-C, B-C-A và C-A-B."

  # ───────────────────────── 7. VÍ DỤ SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ số: khử ảo giác thắng cuộc giữa 3 giao diện A, B, C trên 12 người"
    checks:
      - "alg.hci_mappings(3) == 6"
      - "alg.hci_is_latin_square([['A', 'B', 'C'], ['B', 'C', 'A'], ['C', 'A', 'B']]) is True"
      - "(30 + 6) == 36 and (27 + 3) == 30 and (30 + 0) == 30"
      - "(36 + 33 + 30) / 3 == 33.0"
      - "(30 + 33 + 27) / 3 == 30.0"
    steps:
      - show: |
          <p><b>Bước 1 — thông số thật của bài toán.</b> So sánh $k = 3$ giao diện đặt vé $A, B, C$ trên $N = 12$ người (số minh hoạ):</p>
          $$T_A^{\text{gốc}} = 30\text{ s}, \qquad T_B^{\text{gốc}} = 27\text{ s}, \qquad T_C^{\text{gốc}} = 30\text{ s}$$
          $$\text{Độ trễ bỡ ngỡ theo lượt: Lượt 1 cộng } +6\text{ s}, \quad \text{Lượt 2 cộng } +3\text{ s}, \quad \text{Lượt 3 cộng } +0\text{ s}$$
        focus: [1, 2, 3]
        say: "Bước một, ta xét bài toán so sánh ba giao diện đặt vé A, B, C trên 12 người dùng thử nghiệm. Giả sử thời gian chuẩn thực sự của A và C đều là 30 giây, còn B thực sự nhanh hơn với 27 giây. Do người dùng cần làm quen kịch bản, lượt đầu bị trễ thêm 6 giây, lượt hai trễ thêm 3 giây và lượt ba không bị trễ thêm."
      - clear: true
        show: |
          <p><b>Bước 2 — hậu quả khi không cân bằng thứ tự.</b> Nếu cả 12 người đều thử cố định $A \to B \to C$:</p>
          $$\overline{T}_A^{\text{sai}} = 30 + 6 = 36\text{ s}, \qquad \overline{T}_B^{\text{sai}} = 27 + 3 = 30\text{ s}, \qquad \overline{T}_C^{\text{sai}} = 30 + 0 = 30\text{ s}$$
          <p class="note">Ảo giác nguy hiểm: nhìn số đo thô, ta tưởng $C$ nhanh ngang $B$ ($30\text{ s}$) và vượt xa $A$ ($36\text{ s}$), dù thực chất $A$ và $C$ ngang nhau!</p>
        focus: [1, 2, 3]
        say: "Bước hai, nếu cho cả 12 người thử theo đúng một thứ tự cố định A rồi B rồi C, kết quả sẽ bị méo nặng. Giao diện A bị cộng 6 giây thành 36 giây, B cộng 3 giây thành 30 giây, còn C ở lượt cuối giữ nguyên 30 giây. Nhìn số đo này, ta sẽ kết luận nhầm rằng C tốt ngang B và hơn hẳn A, dù thực chất A và C bằng nhau."
      - clear: true
        show: |
          <p><b>Bước 3 — chia 12 người thành 3 nhóm (4 người/nhóm) theo hình vuông Latin $3 \times 3$:</b></p>
          <table class="t"><tr><th>nhóm (4 người)</th><th>lượt 1 (+6 s)</th><th>lượt 2 (+3 s)</th><th>lượt 3 (+0 s)</th></tr>
          <tr><td><b>nhóm 1</b> $(A \to B \to C)$</td><td>$A:\ 30+6 = 36\text{ s}$</td><td>$B:\ 27+3 = 30\text{ s}$</td><td>$C:\ 30+0 = 30\text{ s}$</td></tr>
          <tr><td><b>nhóm 2</b> $(B \to C \to A)$</td><td>$B:\ 27+6 = 33\text{ s}$</td><td>$C:\ 30+3 = 33\text{ s}$</td><td>$A:\ 30+0 = 30\text{ s}$</td></tr>
          <tr><td><b>nhóm 3</b> $(C \to A \to B)$</td><td>$C:\ 30+6 = 36\text{ s}$</td><td>$A:\ 30+3 = 33\text{ s}$</td><td>$B:\ 27+0 = 27\text{ s}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, ta sửa lại bằng cách chia 12 người thành 3 nhóm 4 người theo bảng hình vuông Latin ba nhân ba. Nhóm một thử theo thứ tự A-B-C, nhóm hai thử theo thứ tự B-C-A và nhóm ba thử theo thứ tự C-A-B. Trên bảng, giao diện A xuất hiện ở lượt 1 tại nhóm một với 36 giây, lượt 3 tại nhóm hai với 30 giây và lượt 2 tại nhóm ba với 33 giây."
      - clear: true
        show: |
          <p><b>Bước 4 — tính trung bình từng giao diện trên cả 3 nhóm:</b></p>
          $$\overline{T}_A = \frac{36 + 30 + 33}{3} = \hlb{33{,}0\text{ s}}, \qquad \overline{T}_B = \frac{30 + 33 + 27}{3} = \hlg{30{,}0\text{ s}}, \qquad \overline{T}_C = \frac{30 + 33 + 36}{3} = \hlb{33{,}0\text{ s}}$$
          $$\implies \overline{T}_B - \overline{T}_A = -3{,}0\text{ s}\ (\text{đúng bằng } 27 - 30), \quad \text{và } \overline{T}_A = \overline{T}_C = 33{,}0\text{ s}$$
        focus: [1, 2, 3]
        say: "Bước bốn, lấy trung bình cộng trên cả ba nhóm, ta được thời gian trung bình của A và C cùng bằng 33 giây, còn B đạt 30 giây. Khoảng cách B nhanh hơn A đúng 3 giây và sự ngang bằng giữa A với C đã được khôi phục chính xác. Quan trọng hơn, ta chỉ cần chia làm 3 nhóm thay vì phải chia nhỏ thành 6 nhóm cho đủ 6 hoán vị."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: phát hiện bảng lỗi và tính tỉ số tiết kiệm nhóm"
    checks:
      - "alg.hci_is_latin_square([['A', 'B', 'C'], ['B', 'C', 'A'], ['C', 'A', 'B']]) is True"
      - "alg.hci_is_latin_square([['A', 'B', 'C'], ['B', 'A', 'C'], ['C', 'A', 'B']]) is False"
      - "alg.hci_mappings(4) // 4 == 6"
    steps:
      - show: |
          <p><b>Đường kiểm 1 — kiểm tra điều kiện cột khi đổi nhầm một hàng:</b></p>
          $$M = \begin{pmatrix} A & B & C \\ B & A & C \\ C & A & B \end{pmatrix} \quad\implies\quad \text{Cột 2 có hai chữ } A,\ \text{Cột 3 có hai chữ } C \implies \text{Không phải hình vuông Latin!}$$
        focus: [1, 2]
        say: "Đường kiểm thứ nhất, để biết một bảng có hợp lệ hay không, ta rà soát từng hàng ngang và từng cột dọc. Vì nếu ở hàng hai ta viết nhầm thành B-A-C, cột hai sẽ có hai chữ A và cột ba có hai chữ C, nên bảng lập tức mất cân bằng."
      - show: |
          <p><b>Đường kiểm 2 — tỉ số tiết kiệm số nhóm so với chạy đủ $k!$ hoán vị:</b></p>
          $$\frac{k!}{k} = (k - 1)! \quad\implies\quad \begin{cases} k = 3 \implies 3! / 3 = 2\text{ lần } (3\text{ nhóm thay vì } 6) \\ k = 4 \implies 4! / 4 = 6\text{ lần } (4\text{ nhóm thay vì } 24) \\ k = 5 \implies 5! / 5 = 24\text{ lần } (5\text{ nhóm thay vì } 120) \end{cases}$$
        focus: [1, 2]
        say: "Đường kiểm thứ hai, ta tính tỉ số tiết kiệm nhóm bằng cách lấy k giai thừa chia cho k, suy ra bằng k trừ 1 giai thừa. Vì vậy với 4 giao diện, hình vuông Latin chỉ cần 4 nhóm thay vì 24 nhóm, còn với 5 giao diện chỉ cần 5 nhóm thay vì 120 nhóm."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Bẫy thường gặp: lặp lại y hệt một câu hỏi và hiệu ứng chuyển tiếp liền kề"
    checks:
      - "alg.hci_is_latin_square([['A', 'B', 'D', 'C'], ['B', 'C', 'A', 'D'], ['C', 'D', 'B', 'A'], ['D', 'A', 'C', 'B']]) is True"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Dùng lại y hệt một đề bài tìm kiếm cho cả 3 giao diện <b class="red">(người thử nhớ sẵn đáp án từ lượt 1)</b>
          <br><span class="note">Nếu lượt 1 bắt tìm “giá vé đi Đà Nẵng ngày mai”, sang lượt 2 họ đã biết sẵn con số mà không cần đọc màn hình. Phép sửa: chuẩn bị $k$ đề bài tương đương độ khó $(T_1, T_2, T_3)$ đi kèm các lượt thử.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất rất phổ biến là cho người dùng làm đi làm lại đúng một câu hỏi y hệt nhau trên cả ba giao diện. Nếu ở lượt đầu họ phải tìm giá vé đi Đà Nẵng ngày mai, sang lượt hai họ đã nhớ sẵn con số kết quả mà không cần đọc kỹ màn hình. Cách sửa bắt buộc là chuẩn bị ba đề bài khác nhau nhưng có độ khó tương đương cho ba lượt thử."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ qua hiệu ứng chuyển tiếp liền kề (carryover effect) trong bảng dịch vòng đơn giản
          <br><span class="note">Trong bảng $(A,B,C),\ (B,C,A),\ (C,A,B)$, giao diện $B$ đi ngay sau $A$ tới 2 lần, nhưng $A$ chưa bao giờ đi ngay sau $B$. Nếu cần cân bằng cả cặp liền kề cho $k = 4$, dùng <b>hình vuông Latin cân bằng Williams</b>:</span></div>
          $$W_4 = \begin{pmatrix} A & B & D & C \\ B & C & A & D \\ C & D & B & A \\ D & A & C & B \end{pmatrix}$$
        focus: [1, 1, 2]
        say: "Lỗi thứ hai tinh vi hơn: trong bảng dịch vòng ba nhân ba, giao diện B đi ngay sau A tới hai lần, nhưng A không bao giờ đi ngay sau B. Nếu thói quen bấm phím ở giao diện A gây nhầm lẫn đặc biệt cho riêng giao diện đi liền sau nó, phép dịch vòng đơn giản chưa khử hết xung đột này. Khi đó, ta dùng hình vuông Latin cân bằng cặp liền kề như ma trận bốn nhân bốn trên màn hình, hoặc chạy đủ 6 hoán vị khi k bằng 3."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: hoàn thiện hình vuông Latin 4×4 và chọn cỡ mẫu cân bằng"
    checks:
      - "alg.hci_is_latin_square([['A', 'B', 'C', 'D'], ['B', 'C', 'D', 'A'], ['C', 'D', 'A', 'B'], ['D', 'A', 'B', 'C']]) is True"
      - "16 % 4 == 0 and 15 % 4 != 0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Cho 3 hàng đầu của hình vuông Latin $4 \times 4$ là $(A, B, C, D)$, $(B, C, D, A)$ và $(C, D, A, B)$. Hãy tìm hàng thứ 4.</td></tr>
          <tr><td>2</td><td>Với bảng $4 \times 4$ đó, nếu ngân sách cho phép tuyển khoảng 15–16 người thử, bạn nên chốt $N = 15$ hay $N = 16$ người? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự luyện. Câu một, cho ba hàng đầu của hình vuông Latin bốn nhân bốn là A-B-C-D, B-C-D-A và C-D-A-B, bạn hãy xác định thứ tự đúng cho hàng thứ tư. Câu hai, với bảng bốn nhóm đó, bạn nên chốt danh sách ở con số 15 người hay 16 người? Dừng video và tính nhanh ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> Dò từng cột dọc từ trái sang phải để tìm chữ cái còn thiếu trong $\{A, B, C, D\}$:</p>
          $$\begin{pmatrix} A & B & C & D \\ B & C & D & A \\ C & D & A & B \\ \hlg{D} & \hlg{A} & \hlg{B} & \hlg{C} \end{pmatrix} \quad\implies\quad \text{Hàng 4 là } \hlg{(D, A, B, C)}$$
        focus: [1, 2]
        say: "Đáp án câu một, ta dò theo từng cột từ trái sang phải: cột một thiếu chữ D, cột hai thiếu chữ A, cột ba thiếu chữ B và cột bốn thiếu chữ C. Vậy hàng thứ tư bắt buộc phải là D-A-B-C, hoàn toàn khớp với quy tắc dịch vòng tuần hoàn."
      - show: |
          <p><b>Đáp án câu 2.</b> Phải chọn $N$ là <b>bội số của số nhóm $k = 4$</b> để mọi thứ tự có trọng số bằng nhau:</p>
          $$N = 16 = 4 \text{ nhóm} \times 4 \text{ người/nhóm} \quad (\text{cân bằng hoàn hảo; nếu } N = 15 \text{ sẽ có một nhóm thiếu người})$$
        focus: [1, 2]
        say: "Ở câu hai, ta phải chọn N bằng 16 người để chia đều mỗi nhóm đúng 4 người. Nếu chọn 15 người thì sẽ có một nhóm chỉ gồm 3 người, làm lệch trọng số khi tính trung bình cộng giữa bốn thứ tự thử nghiệm."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">trong chủ thể: 1 người thử đủ k giao diện</span><span class="a">→</span>
          <span class="n">sinh hiệu ứng thứ tự (quen tay / mệt mỏi)</span><span class="a">→</span>
          <span class="n">k! hoán vị quá lớn khi k ≥ 4</span><span class="a">→</span>
          <span class="n">hình vuông Latin k × k chỉ cần k nhóm</span><span class="a">→</span>
          <span class="n">mỗi giao diện đứng mọi vị trí đúng 1 lần</span></div>
        say: "Tổng kết lại, thiết kế trong chủ thể cho mỗi người thử đủ k giao diện để tiết kiệm người và khử nhiễu cá nhân, nhưng luôn sinh ra hiệu ứng thứ tự. Thay vì chạy đủ k giai thừa hoán vị, ta dùng hình vuông Latin k nhân k với đúng k nhóm để mỗi giao diện xuất hiện đều đặn ở mọi vị trí."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi tin rằng giao diện $B$ thắng giao diện $A$, hãy hỏi ngay: <b>thứ tự thử đã được cân bằng chưa</b>, và các đề bài giữa các lượt có tương đương độ khó không.</div>
        say: "Tư duy cần mang theo là trước khi tin rằng giao diện B thắng giao diện A, hãy hỏi ngay thứ tự thử đã được cân bằng chưa, và các đề bài có tương đương độ khó không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>Truy cập cho mọi người: kích thước đích, bàn phím, trình đọc màn hình</b> — thiết kế nút bấm đủ lớn theo định luật thời gian trỏ và mở đường cho người dùng không dùng chuột.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta chuyển sang thiết kế tiếp cận cho mọi người với kích thước đích, bàn phím và trình đọc màn hình. Ta sẽ dùng lại định luật thời gian trỏ ở bài 2 để tính xem nút 24 điểm ảnh và 44 điểm ảnh khác nhau bao nhiêu phần mười giây. Hẹn gặp bạn ở bài tiếp theo."
