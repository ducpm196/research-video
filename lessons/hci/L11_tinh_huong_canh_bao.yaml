    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>[a, b, ...]</code></td><td>Danh sách nhiều phần tử theo thứ tự (lấy phần tử thứ <code>i</code> bằng <code>ds[i]</code>, đếm từ <code>0</code>)</td></tr><tr><td><code>len(ds)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{ten_bien}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo HCI:L11 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>mins = (9 * 60 + 49) - (9 * 60 + 12)</div><div>guards = ['env_split', 'preview_nonempty', 'two_person', 'cancel_tpl']</div><div>print(f"mins_delay={mins} guards_passed={len(guards)}")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
