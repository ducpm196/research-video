scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Phát nhầm cảnh báo tên lửa đạn đạo: vì sao mất 38 phút mới đính chính?"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
      - "alg.hci_minutes_diff(8, 31, 8, 44) == 13"
    steps:
      - show: |
          <p>Vào một buổi sáng đầu năm 2018 tại một bang hải đảo của Mỹ, hệ thống phát đi thông điệp đỏ rực tới hơn 1 triệu điện thoại: <i>“Mối đe dọa tên lửa đạn đạo đang hướng tới. Hãy tìm nơi trú ẩn ngay. Đây không phải tập trận.”</i></p>
          <div class="box warn">Người dân hoảng loạn chui xuống cống ngầm, nhưng sự thật đó chỉ là một ca tập trận nội bộ! Phải mất tới <b>$45 - 7 = 38\text{ phút}$</b> toàn bang mới nhận được tin đính chính. Vì sao một cú nhấp chuột sai lại làm tê liệt cả hệ thống lâu đến thế?</div>
        focus: [1, 2]
        say: "Năm 2018, một cảnh báo tên lửa đạn đạo giả đã làm hoảng loạn hơn một triệu người dân suốt 38 phút. Trong bài học này, ta đóng vai chuyên gia tương tác để giải mã những cái bẫy chết người trên giao diện và thiết kế lại quy trình an toàn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: ba tầng chống lỗi bài 10 và phương pháp đo kiểm bài 8"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.01]), 6) == 0.00001"
      - "alg.hci_minutes_diff(8, 7, 8, 10) == 3"
    steps:
      - show: |
          <p><b>① Mô hình phô mai Thụy Sĩ và các tầng chống lỗi</b> (bài 10):</p>
          <p>• <b>Tầng 1 (Ngăn chặn):</b> ràng buộc giao diện để hành động phá huỷ không thể bấm nhầm.<br>• <b>Tầng 2 (Giảm thiểu):</b> hộp xác nhận nêu rõ hậu quả và bắt buộc người thứ hai duyệt độc lập.<br>• <b>Tầng 3 (Hồi phục):</b> cơ chế thu hồi lệnh và mẫu bản tin đính chính gửi đi ngay lập tức.</p>
        focus: [1, 2]
        say: "Trước hết, ta ôn lại ba tầng phòng thủ chống lỗi từ bài 10. Hệ thống an toàn phải có tầng ngăn chặn để không bấm nhầm, tầng giảm thiểu yêu cầu duyệt độc lập, và tầng hồi phục để sửa sai ngay lập tức."
      - show: |
          <p><b>② Đo lường hành vi người dùng dưới áp lực</b> (bài 8):</p>
          <p class="note">Người vận hành khi gặp báo động khẩn cấp sẽ bị thu hẹp tầm chú ý và thao tác theo phản xạ quán tính. Đừng bao giờ tin vào phỏng vấn lúc bình tĩnh — phải đo bằng diễn tập có kịch bản áp lực thật!</p>
        focus: [1, 1]
        say: "Thứ hai, theo bài 8, khi đối mặt với tình huống khẩn cấp, con người dễ bị hoảng loạn và hành động theo quán tính. Do đó, mọi giải pháp thiết kế phải được kiểm chứng qua các buổi diễn tập có áp lực thời gian thực tế."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: các mốc thời gian chẩn đoán sự cố theo báo cáo điều tra chính thức"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
    steps:
      - show: |
          <table class="t"><tr><th>mốc giờ</th><th>sự kiện trên giao diện</th><th>khoảng trễ</th></tr>
          <tr><td>8:05</td><td>Bắt đầu cuộc gọi diễn tập chuyển ca không báo trước</td><td>$0\text{ phút}$</td></tr>
          <tr><td>8:07</td><td>Nhân viên chọn nhầm dòng phát thật và bấm <i>“Yes”</i> xác nhận</td><td>$2\text{ phút}$ phát nhầm</td></tr>
          <tr><td>8:10</td><td>Cán bộ trực nhận ra lỗi phát nhầm cảnh báo thật</td><td>$3\text{ phút}$ nhận diện</td></tr>
          <tr><td>8:31 – 8:44</td><td>Tự soạn thảo bản tin đính chính thủ công vì <b>không có mẫu sẵn</b></td><td>$13\text{ phút}$ gõ tay</td></tr>
          <tr><td>8:45</td><td>Bản tin đính chính chính thức được phát đi toàn bang</td><td>Tổng $\Delta T = 38\text{ phút}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng phân tích dòng thời gian theo báo cáo điều tra của cơ quan viễn thông. Lúc 8 giờ 05 cuộc gọi diễn tập bắt đầu. Đến 8 giờ 07, nhân viên chọn nhầm dòng và bấm xác nhận khiến cảnh báo giả phát đi. Tới 8 giờ 10 cơ quan đã nhận ra lỗi. Nhưng từ 8 giờ 31 đến 8 giờ 44, họ phải mất 13 phút gõ tay bản tin đính chính vì hệ thống không có mẫu sẵn. Mãi tới 8 giờ 45 thông báo huỷ mới được phát sóng, tạo ra tổng thời gian tê liệt lên tới 38 phút."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình cơ chế: ba cái bẫy giao diện chết người biến cú trượt tay thành thảm hoạ"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
      - "alg.hci_minutes_diff(8, 31, 8, 44) == 13"
    steps:
      - show: |
          <div><svg width="1440" height="420" viewBox="0 0 1440 420">
          <rect x="50" y="30" width="410" height="360" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
          <text x="255" y="70" font-size="21" font-weight="bold" fill="#c2410c" text-anchor="middle">Bẫy 1: Danh sách thả xuống chung</text>
          <rect x="80" y="100" width="350" height="45" fill="#ffffff" stroke="#94a3b8"/>
          <text x="100" y="130" font-size="16" fill="#334155">DRILL: Missile Alert (Tập trận)</text>
          <rect x="80" y="150" width="350" height="45" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
          <text x="100" y="180" font-size="16" fill="#dc2626" font-weight="bold">LIVE: Missile Alert (Phát thật)</text>
          <text x="255" y="330" font-size="17" fill="#475569" text-anchor="middle">Hai dòng chữ gần giống hệt nhau</text>

          <rect x="515" y="30" width="410" height="360" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
          <text x="720" y="70" font-size="21" font-weight="bold" fill="#b91c1c" text-anchor="middle">Bẫy 2: Hộp hỏi lại vô nghĩa</text>
          <rect x="545" y="120" width="350" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="720" y="165" font-size="17" fill="#1e293b" text-anchor="middle">Are you sure?</text>
          <rect x="585" y="200" width="120" height="45" rx="6" fill="#2563eb"/>
          <text x="645" y="228" font-size="16" fill="#ffffff" text-anchor="middle">Yes</text>
          <text x="720" y="330" font-size="17" fill="#475569" text-anchor="middle">Tập trận và phát thật hỏi y như nhau</text>

          <rect x="980" y="30" width="410" height="360" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
          <text x="1185" y="70" font-size="21" font-weight="bold" fill="#334155" text-anchor="middle">Bẫy 3: Không có mẫu đính chính</text>
          <rect x="1010" y="120" width="350" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6"/>
          <text x="1185" y="195" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle">Trống trơn (Mất 13 phút gõ tay)</text>
          <text x="1185" y="330" font-size="17" fill="#475569" text-anchor="middle">Không có quy trình huỷ khẩn cấp</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ tái hiện ba cái bẫy nghiêm trọng trên giao diện cũ. Bẫy thứ nhất là đặt dòng lệnh tập trận nằm lẫn trong cùng một danh sách thả xuống với lệnh phát thật. Bẫy thứ hai là hộp thoại hỏi xác nhận chung chung khiến người trực bấm đồng ý theo quán tính. Bẫy thứ ba là hệ thống hoàn toàn không có sẵn mẫu tin huỷ cảnh báo khiến mọi người phải mất 13 phút tự gõ tay nội dung đính chính."

  # ───────────────────────── 5. PHÂN RÃ CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Phân rã thời gian: vì sao 13 phút gõ tay thủ công làm tê liệt hệ thống?"
    checks:
      - "alg.hci_minutes_diff(8, 7, 8, 45) == 38"
      - "alg.hci_minutes_diff(8, 31, 8, 44) == 13"
      - "45 - 7 == 38"
    steps:
      - show: |
          <p><b>Tổng thời gian tê liệt khủng hoảng $\Delta T_{\text{tổng}}$ phân rã thành 4 giai đoạn:</b></p>
          $$\Delta T_{\text{tổng}} = \Delta T_{\text{nhận ra}} + \Delta T_{\text{họp duyệt}} + \Delta T_{\text{soạn thảo}} + \Delta T_{\text{gửi}}$$
          <p class="note">Theo báo cáo, thời gian nhận ra lỗi chỉ mất $3\text{ phút}$ (8:07 $\to$ 8:10). Nhưng thời gian soạn thảo gõ tay kéo dài từ 8:31 đến 8:44:</p>
          $$\Delta T_{\text{soạn thảo}} = 44 - 31 = \hlg{13\text{ phút}} \quad \left(\frac{13}{38} \approx 34{,}2\% \text{ tổng thời gian!}\right)$$
        focus: [1, 2, 2]
        say: "Theo phân tích dữ liệu, tổng thời gian khủng hoảng 38 phút gồm bốn giai đoạn chính. Thời gian nhận ra sai sót chỉ mất 3 phút, nhưng việc gõ tay văn bản đính chính kéo dài từ 8 giờ 31 đến 8 giờ 44. Con số 13 phút gõ tay này chiếm tới hơn một phần ba thời gian hoảng loạn của người dân."
      - show: |
          <p><b>Vì sao việc gõ tay lại kéo dài tới $13\text{ phút}$ dưới áp lực?</b></p>
          <p>Vì trong lúc hoảng loạn, người soạn phải vừa nghĩ từ ngữ đính chính chuẩn mực pháp lý, vừa kiểm tra mật khẩu tài khoản, vừa sửa lỗi chính tả. Thay vào đó, nếu có <b>mẫu đính chính một chạm</b>:</p>
          $$\Delta T_{\text{soạn mới}} \le \hlb{1\text{ phút}} \implies \text{tiết kiệm ít nhất } 12\text{ phút quý báu!}$$
        focus: [1, 2]
        say: "Bởi vì trong cơn khủng hoảng, người soạn thảo vừa phải cân nhắc từng từ ngữ pháp lý vừa lo sửa lỗi gõ phím. Nếu giao diện cung cấp sẵn mẫu đính chính một chạm, thời gian thao tác sẽ giảm xuống dưới 1 phút và cứu vãn được ít nhất 12 phút quý báu."

  # ───────────────────────── 6. VÍ DỤ NÂNG CẤP ─────────────────────────
  - id: example
    kind: example
    title: "Đối chiếu thiết kế: 4 lớp phòng vệ chuẩn chuyên gia thay thế giao diện cũ"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.001, 0.01, 0.05]), 8) == 5e-7"
      - "round(1 / 5e-7) == 2000000"
    steps:
      - show: |
          <p><b>Bảng so sánh: Giao diện sự cố 2018 so với Thiết kế lại chuẩn chuyên gia:</b></p>
          <table class="t"><tr><th>lớp phòng vệ</th><th>giao diện cũ (2018)</th><th>thiết kế lại đề xuất</th></tr>
          <tr><td><b>1. Môi trường</b></td><td>Tập trận chung màn hình với phát thật</td><td>Tách hẳn cổng riêng, nền vàng cam nổi bật cho tập trận</td></tr>
          <tr><td><b>2. Xác nhận</b></td><td>Hộp thoại <i>“Are you sure?”</i> trần trụi</td><td>Hiện toàn văn bản tin xem trước kèm bản đồ vùng phát</td></tr>
          <tr><td><b>3. Người duyệt</b></td><td>1 người tự chọn và tự bấm gửi</td><td><b>Quy tắc hai người duyệt:</b> máy thứ hai phải quét mã chấp thuận</td></tr>
          <tr><td><b>4. Thu hồi</b></td><td>Không có mẫu huỷ, mất 13 phút gõ tay</td><td>Nút <b>Đính chính một chạm</b> chuẩn bị sẵn văn bản chuẩn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bảng đối chiếu chỉ ra bốn lớp bảo vệ được thiết kế lại. Thứ nhất, tách hẳn môi trường tập trận sang giao diện riêng có màu sắc phân biệt rõ. Thứ hai, thay thế câu hỏi vô nghĩa bằng màn hình hiển thị toàn bộ nội dung tin nhắn sẽ phát. Thứ ba, áp dụng nguyên tắc hai người duyệt độc lập trên hai thiết bị khác nhau. Thứ tư, bổ sung ngay nút đính chính một chạm với câu chữ đã được kiểm duyệt sẵn."
      - clear: true
        show: |
          <p><b>Tính toán hiệu quả xác suất lỗi lọt qua theo mô hình bài 10:</b></p>
          $$p_1 = 0{,}001 \text{ (nhân viên chọn nhầm)}; \quad p_2 = 0{,}01 \text{ (màn hình xem trước bỏ sót)}$$
          $$p_3 = 0{,}05 \text{ (người thứ hai duyệt bỏ sót)} \implies P_{\text{lọt}} = 0{,}001 \times 0{,}01 \times 0{,}05 = \hlg{5 \times 10^{-7}} = \frac{1}{2\,000\,000}$$
          <p class="note">Nguy cơ phát nhầm giảm từ $1/1\,000$ xuống $1/2\,000\,000$ — tức <b>an toàn hơn gấp 2 triệu lần</b>!</p>
        focus: [1, 2, 3]
        say: "Dựa trên mô hình nhân xác suất ở bài 10, ta tính toán hiệu quả an toàn của ba lớp độc lập. Giả sử nhân viên chọn nhầm với xác suất 1 phần nghìn, màn hình xem trước bỏ sót 1 phần trăm, và người duyệt thứ hai bỏ sót 5 phần trăm. Khi đó xác suất phát nhầm giảm xuống chỉ còn 1 phần 2 triệu, giúp hệ thống an toàn hơn hàng triệu lần."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: kiểm chứng thời gian đính chính rút ngắn từ 38 phút xuống dưới 5 phút"
    checks:
      - "45 - 7 == 38"
      - "44 - 31 == 13"
    steps:
      - show: |
          <p><b>Kiểm chứng 1 — Dòng thời gian khi có sẵn mẫu đính chính một chạm:</b></p>
          $$\Delta T_{\text{mới}} = \Delta T_{\text{nhận ra}} (3\text{ phút}) + \Delta T_{\text{bấm nút đính chính}} (1\text{ phút}) = \hlg{4\text{ phút}}$$
          <p class="note">Vì không còn công đoạn gõ tay thủ công 13 phút và không mất thời gian họp bàn soạn thảo, nên toàn bang nhận tin đính chính trong vòng chưa đầy 5 phút.</p>
        focus: [1, 2, 2]
        say: "Để kiểm chứng thiết kế mới, ta tính lại dòng thời gian khi có sẵn mẫu đính chính một chạm. Vì thời gian nhận ra sự cố chỉ mất 3 phút và thao tác bấm đính chính mất 1 phút, nên toàn bộ quy trình huỷ hoàn tất chỉ sau 4 phút. Nhờ loại bỏ 13 phút gõ tay, khủng hoảng được dập tắt nhanh hơn 9 lần."
      - show: |
          <p><b>Kiểm chứng 2 — Ràng buộc vật lý tách biệt không gian làm việc:</b></p>
          <p>Khi tách hoàn toàn phân hệ diễn tập sang dải màu vàng cam và tên miền riêng, khả năng nhầm lẫn với hệ thống thật bị triệt tiêu theo nguyên tắc tương hợp bài 1:</p>
          $$P(\text{nhầm môi trường}) \approx 0 \implies \text{loại bỏ hoàn toàn nguồn gốc kích hoạt sai!}$$
          <p class="note">Theo nguyên tắc tương hợp ở bài 1, màu sắc và không gian thị giác tách bạch là biện pháp ngăn chặn lỗi nhận thức hiệu quả nhất.</p>
        focus: [1, 2, 3]
        say: "Bước kiểm chứng thứ hai xét hiệu quả của việc phân tách màu sắc không gian làm việc. Do hệ thống tập trận mang dải màu vàng cam hoàn toàn khác biệt, nên nhân viên sẽ không thể nhầm lẫn với giao diện phát sóng thật. Theo bài 1, sự tương hợp màu sắc là tấm khiên vững chắc nhất bảo vệ người vận hành."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Ba sai lầm nghiêm trọng khi thiết kế hệ thống cảnh báo khẩn cấp"
    checks:
      - "round(alg.hci_swiss_cheese_leak([0.01, 0.90]), 5) == 0.009"
    steps:
      - show: |
          <div class="box warn"><b>Sai lầm 1.</b> Đổ hết trách nhiệm cho cá nhân bấm nhầm mà không sửa giao diện bẫy lỗi <b class="red">(người khác trực ca sau vẫn sẽ bấm nhầm!)</b></div>
          <p class="note">Tư duy đổ lỗi cho người vận hành là thất bại lớn nhất trong tương tác người máy. Nếu giao diện đặt bẫy, sớm muộn tai hoạ cũng sẽ lặp lại.</p>
        focus: [1, 2]
        say: "Sai lầm nguy hiểm nhất là đổ hết trách nhiệm cho người trực ca mà không chịu sửa đổi giao diện bẫy lỗi. Chuyên gia tương tác hiểu rằng khi hệ thống thiết kế cẩu thả thì người khác vào trực cũng sẽ mắc lại đúng sai lầm đó."
      - show: |
          <div class="box warn"><b>Sai lầm 2.</b> Thiết lập người duyệt thứ hai nhưng cho ngồi chung một bàn và nhìn chung một màn hình <b class="red">(mất tính độc lập!)</b></div>
          <p class="note">Khi ngồi cạnh nhau, người duyệt thứ hai có xác suất tán thành theo thói quen lên tới $90\%$, khiến lớp phòng vệ thứ hai gần như vô hiệu hoá.</p>
        focus: [1, 2]
        say: "Sai lầm thứ hai là bố trí người duyệt thứ hai ngồi cùng bàn nhìn chung một màn hình. Do tâm lý nể nang và tin tưởng đồng nghiệp, người thứ hai sẽ bấm đồng ý theo thói quen và làm mất hoàn toàn tính độc lập của lớp phòng thủ."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chẩn đoán dòng thời gian cứu hộ và chọn phương án duyệt an toàn"
    checks:
      - "alg.hci_minutes_diff(9, 10, 9, 35) == 25"
      - "alg.hci_minutes_diff(9, 20, 9, 32) == 12"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Một trung tâm điều hành phát nhầm lệnh xả lũ lúc 9:10 và gửi tin đính chính lúc 9:35. Trong đó từ 9:20 đến 9:32 là thời gian gõ văn bản đính chính. Tính tổng thời gian sự cố và phần trăm thời gian gõ tay.</td></tr>
          <tr><td>2</td><td>Để ngăn phát nhầm tín hiệu sơ tán lúc nửa đêm, bạn nên dùng hộp thoại yêu cầu gõ chữ <i>“TOÀN BANG”</i> hay yêu cầu người trực ca thứ hai quét thẻ duyệt trên máy riêng?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự luyện tập hai câu hỏi thực tế. Câu một, tính tổng thời gian sự cố xả lũ phát nhầm từ 9 giờ 10 đến 9 giờ 35 và tỉ lệ thời gian gõ tay. Câu hai, để chống phát nhầm vào ban đêm, bạn nên bắt gõ từ xác nhận hay dùng máy duyệt thứ hai? Dừng video và suy nghĩ."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 — Tính thời gian sự cố xả lũ:</b></p>
          $$\Delta T_{\text{tổng}} = 35 - 10 = \hlg{25\text{ phút}}; \quad \Delta T_{\text{gõ tay}} = 32 - 20 = \hlb{12\text{ phút}}$$
          $$\text{Tỉ lệ gõ tay} = \frac{12}{25} = \hlo{48\%} \quad (\text{gần một nửa thời gian bị lãng phí do thiếu mẫu sẵn!})$$
        focus: [1, 2]
        say: "Đáp án câu một, tổng thời gian sự cố kéo dài 25 phút. Trong đó thời gian gõ tay chiếm 12 phút, tức 48 phần trăm thời gian quý báu bị lãng phí chỉ vì không chuẩn bị sẵn mẫu đính chính."
      - show: |
          <p><b>Đáp án câu 2 — Chọn cơ chế kiểm soát tối ưu:</b></p>
          <div class="box key"><b>Chọn người thứ hai quét thẻ trên máy riêng:</b> Gõ lại từ chỉ ngăn được cú trượt tay vô thức của 1 người, nhưng không ngăn được khi người đó đang hiểu nhầm bối cảnh. Người thứ hai trên máy riêng tạo ra <b>lớp phòng vệ độc lập thực sự</b>.</div>
        focus: [1, 1]
        say: "Đáp án câu hai, phương án tối ưu là yêu cầu người thứ hai quét thẻ trên thiết bị độc lập. Việc bắt gõ từ xác nhận chỉ ngăn được trượt tay chứ không cứu được người đang hiểu nhầm ngữ cảnh bài tập."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
