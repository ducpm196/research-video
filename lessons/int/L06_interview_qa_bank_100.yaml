scenes:
- id: hook
  kind: hook
  title: Nghệ thuật đối thoại kỹ thuật với Hội đồng Kiến trúc và Lãnh đạo Khối CNTT
    ACB
  steps:
  - show: '<p>Hội đồng phỏng vấn Kỹ sư Cấp cao thường không dừng ở các định nghĩa
      trắc nghiệm lý thuyết sách vở.</p>

      <div class="box key">Họ sẽ liên tục xoáy sâu vào các điểm nghẽn cao tải, phân
      tích nguyên nhân sự cố sản xuất và chất vấn phương án kiến trúc. Làm thế nào
      để phản xạ tự nhiên và trả lời trôi chảy mọi câu hỏi khó nhất?</div>

      <p>Video này luyện phương pháp trả lời và năm tình huống tiêu biểu; trọn bộ 100
      câu để tự luyện nằm trong tệp câu hỏi đi kèm (interview/06_interview_qa_bank_100.md). Bộ câu hỏi do người soạn tự biên soạn,
      không phải đề tuyển dụng của ACB.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, buổi phỏng vấn Kỹ sư Cấp cao tại ngân hàng Á Châu là một cuộc đối
      thoại kỹ thuật chuyên sâu giữa các chuyên gia. Hội đồng tuyển dụng sẽ liên tục
      đào sâu vào các tình huống sự cố thực tế và thử thách bản lĩnh kiến trúc của
      bạn. Hôm nay, ta rèn luyện phương pháp trả lời qua năm tình huống tiêu biểu, còn trọn bộ một trăm câu tự biên soạn để tự luyện nằm trong tệp câu hỏi đi kèm video này.
      Bộ câu hỏi này không phải đề tuyển dụng của ACB.
  - show: "<table class=\"t\">\n  <tr><th>nhóm câu hỏi</th><th>phạm vi chuyên môn</th><th>tiêu\
      \ chuẩn phản xạ chuẩn Senior</th></tr>\n  <tr><td>Phần 1: Khoa học máy tính</td><td>Bộ\
      \ nhớ máy ảo, đa luồng và cấu trúc dữ liệu</td><td>Nắm chắc bản chất thanh ghi,\
      \ cây B-Tree và luồng ảo</td></tr>\n  <tr><td>Phần 2 & 3: Dịch vụ nhỏ & Phân\
      \ tán</td><td>Quản lý giao dịch Spring, Kafka và Oracle</td><td>Mô hình SAGA,\
      \ hộp thư sự kiện và giảm đáng kể bế tắc</td></tr>\n  <tr><td>Phần 4 & 5: Nghiệp\
      \ vụ & Thiết kế</td><td>Core banking (ví dụ T24), NAPAS, tín dụng và đề bài 10k TPS (giao dịch mỗi giây)</td><td>Bảo\
      \ toàn dòng tiền, chỉ nêu số liệu thật có nguồn</td></tr>\n</table>\n\
      <p>Hôm nay, ta làm chủ: <b>Phương pháp trả lời đào sâu 5 tầng</b>, <b>bài\
      \ thiết kế cổng thanh toán 10000 TPS (đề bài giả định)</b>, và <b>bản lĩnh xử lý sự cố</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau giải mã toàn bộ năm nhóm câu hỏi trọng điểm. Ta nắm
      vững phương pháp trả lời đào sâu năm tầng để thuyết phục các kiến trúc sư trưởng.
      Ta luyện bài thiết kế hệ thống thanh toán với yêu cầu giả định mười nghìn giao
      dịch mỗi giây. Ta cũng tôi luyện bản lĩnh của người kỹ sư luôn đặt an toàn dòng tiền
      lên hàng đầu.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Phương pháp Trả lời Đào sâu 5 Tầng'
  checks:
  - 20 * 5 == 100
  - 100 // 10 == 10
  steps:
  - show: "<p><b>Phương pháp trả lời Đào sâu 5 Tầng</b> (khung tự đặt để luyện tập, khác kỹ thuật 5 Whys tìm nguyên nhân gốc):</p>\n\
      <table class=\"t\">\n  <tr><th>tầng trả lời</th><th>nội dung bắt buộc</th><th>cách\
      \ ghi điểm</th></tr>\n  <tr><td>Tầng 1: Định nghĩa</td><td>Khái niệm\
      \ kỹ thuật ngắn gọn, súc tích</td><td>Nêu đúng bản chất trong 2 câu</td></tr>\n\
      \  <tr><td>Tầng 2: Cơ chế ngầm</td><td>Nguyên lý hoạt động dưới tầng hệ điều\
      \ hành hoặc máy ảo</td><td>Giải thích cơ chế bộ nhớ và dòng chảy dữ liệu</td></tr>\n\
      \  <tr><td>Tầng 3: Tình huống biên</td><td>Các trường hợp mạng lỗi, bế tắc khóa\
      \ hoặc quá hạn</td><td>Chỉ ra nguy cơ tiềm ẩn mà người khác bỏ qua</td></tr>\n\
      \  <tr><td>Tầng 4: Sự cố thực tế</td><td>Câu chuyện từng xử lý thành công trên\
      \ môi trường thật</td><td>Nêu bối cảnh, hành động và kết quả tại OCB</td></tr>\n\
      \  <tr><td>Tầng 5: Số liệu đo lường</td><td>Thông số thông lượng, độ trễ và\
      \ tỉ lệ sẵn sàng</td><td>Chỉ nêu số đo thật có nguồn; chưa đo thì nói định tính</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    say: Trước hết, ta cần nắm phương pháp trả lời năm tầng, một khung tự đặt để luyện tập. Khi nhận
      câu hỏi, bạn không chỉ nêu định nghĩa ngắn gọn mà phải giải thích tường tận
      cơ chế ngầm bên dưới. Tiếp theo, bạn nêu các trường hợp lỗi biên, dẫn chứng
      sự cố thực tế từng xử lý và chốt lại bằng số đo thật nếu bạn có nguồn đo.
  - show: '<div class="box key">Tư duy Kỹ sư Cấp cao thực thụ: Không phải là người
      viết những đoạn mã nguồn phức tạp nhất, mà là người luôn đặt tính an toàn và
      bảo toàn dòng tiền của khách hàng lên vị trí số một, dự báo trước mọi điểm lỗi
      và viết mã nguồn tự phục hồi!</div>'
    focus:
    - 0
    - 0
    say: Thước đo giá trị của một Kỹ sư Cấp cao nằm ở tư duy phòng ngừa rủi ro. Bạn
      luôn đặt an toàn vốn của ngân hàng lên hàng đầu, biết cách dự báo trước các
      điểm nghẽn và thiết kế hệ thống có khả năng tự phục hồi khi có biến cố xảy ra.
    clear: true
- id: concept
  kind: concept
  title: 'Bài Thiết kế Hệ thống: Payment Hub 10,000 TPS (Đề bài Giả định)'
  steps:
  - show: "<p><b>Kiến trúc 4 Tầng Payment Hub 10,000 TPS (yêu cầu giả định của đề bài)</b>:</p>\n\
      <svg viewBox=\"0 0 700 220\" style=\"width:100%;max-height:420px;\">\n  <rect\
      \ x=\"20\" y=\"20\" width=\"660\" height=\"40\" rx=\"6\" fill=\"#e8f4fd\" stroke=\"\
      #003366\"/>\n  <text x=\"30\" y=\"45\" font-size=\"12\" font-weight=\"bold\"\
      \ fill=\"#003366\">TẦNG 1: CỔNG VÀO (INGRESS) — Cụm API Gateway, Kiểm tra mTLS,\
      \ Giới hạn tốc độ</text>\n  <rect x=\"20\" y=\"70\" width=\"660\" height=\"\
      40\" rx=\"6\" fill=\"#d4edda\" stroke=\"#28a745\"/>\n  <text x=\"30\" y=\"95\"\
      \ font-size=\"12\" font-weight=\"bold\" fill=\"#155724\">TẦNG 2: ĐIỀU PHỐI (ORCHESTRATION)\
      \ — Java 21 Luồng Ảo, Máy trạng thái SAGA</text>\n  <rect x=\"20\" y=\"120\"\
      \ width=\"660\" height=\"40\" rx=\"6\" fill=\"#fff3cd\" stroke=\"#ffc107\"/>\n\
      \  <text x=\"30\" y=\"145\" font-size=\"12\" font-weight=\"bold\" fill=\"#856404\"\
      >TẦNG 3: TRUYỀN DỮ LIỆU (STREAMING) — Apache Kafka cụm đôi, Hộp thư Outbox CDC</text>\n\
      \  <rect x=\"20\" y=\"170\" width=\"660\" height=\"40\" rx=\"6\" fill=\"#f8d7da\"\
      \ stroke=\"#dc3545\"/>\n  <text x=\"30\" y=\"195\" font-size=\"12\" font-weight=\"\
      bold\" fill=\"#721c24\">TẦNG 4: BỘ ĐIỀU HỢP (ADAPTERS) — Core banking qua IBM MQ,\
      \ Cổng NAPAS qua TCP Socket</text>\n</svg>\n<p>Payment Hub = trung tâm điều phối\
      \ thanh toán. API Gateway = cổng vào chung kiểm tra rồi chuyển yêu cầu; mTLS =\
      \ TLS hai chiều, cả máy khách cũng trình chứng thư số; giới hạn tốc độ = chặn\
      \ bớt khi một bên gửi quá nhiều. Kafka cụm đôi = hai cụm ở hai trung tâm dữ liệu.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Hệ thống cần thiết kế là một trung tâm điều phối thanh toán, còn cổng vào chung, gọi là API Gateway, kiểm tra từng yêu cầu rồi mới chuyển vào trong. Khi đề bài giả định yêu cầu cổng thanh toán mười nghìn giao dịch mỗi giây,
      ta vẽ ngay sơ đồ kiến trúc bốn tầng mạch lạc. Tầng cổng vào chịu trách nhiệm
      bảo mật và phân luồng. Tầng điều phối áp dụng luồng ảo Java 21. Tầng truyền
      dữ liệu dùng đường truyền sự kiện cụm đôi, và tầng điều hợp kết nối độc lập
      với ngân hàng lõi.
  - show: '<div class="box key">Chiến lược thời gian quá hạn phân tầng (ví dụ minh họa): Dịch vụ nội
      bộ ngân hàng (core banking, thẻ) khống chế thời gian dưới 3 giây. Dịch vụ đối tác
      bên ngoài (Cổng CIC, thuế, điện thoại) đặt thời gian dưới 8 giây kết hợp cơ
      chế gọi lại bất đồng bộ để chống cạn kiệt tài nguyên!</div>'
    focus:
    - 0
    - 0
    - 0
    say: Một điểm cộng lớn là việc thiết lập ma trận thời gian quá hạn phân tầng.
      Ví dụ minh họa, với các hệ thống nội bộ, ta khống chế thời gian phản hồi dưới ba giây. Đối
      với các đối tác ngoài mạng lưới, ta cho phép tối đa tám giây kết hợp cơ chế
      phản hồi bất đồng bộ để bảo vệ cổng giao tiếp.
    clear: true
- id: symbol
  kind: symbol
  title: Ma trận Đo lường và Chỉ số SLA của Cổng Thanh toán
  checks:
  - 10000 // 100 == 100
  - 9999 // 100 == 99
  - 525600 / 10000 < 53
  - round(365 * 24 * 60 * (1 - 0.9999), 2) == 52.56
  steps:
  - show: '<p><b>Bốn chỉ số mục tiêu (SLA) — yêu cầu giả định của đề bài, không phải số liệu
      của ngân hàng nào</b>:</p>

      <div class="box key">

      $$\text{Thông lượng đỉnh (Throughput): } \text{TPS} \ge 10\,000\text{ giao dịch
      mỗi giây}$$

      $$\text{Độ trễ trung bình (Latency): } T_{\text{avg}} \le 120\text{ mili giây}$$

      $$\text{Tỉ lệ sẵn sàng (Availability): } A \ge 99{,}99\%\text{ (ngừng tối đa } 525\,600 \times 0{,}0001 \approx 52{,}56\text{
      phút mỗi năm)}$$

      $$\text{Tỉ lệ lỗi giao dịch (Error Rate): } E < 0{,}001\%$$

      </div>

      <p>SLA = mức dịch vụ cam kết. Đừng gọi đây là "bốn tín hiệu vàng": sách Site Reliability
      Engineering (Google, 2016) dùng tên đó cho độ trễ, lưu lượng, lỗi và độ bão hoà.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trong phần thi thiết kế hệ thống, ta bám vào bốn chỉ số mục tiêu, tức mức dịch vụ cam kết.
      Theo yêu cầu giả định của đề bài, hệ thống cần thông lượng mười nghìn giao dịch
      mỗi giây với độ trễ trung bình không quá một trăm hai mươi mili giây. Mục tiêu
      sẵn sàng bốn số chín cho phép ngừng tối đa 525600 phút nhân 0 phẩy 0001, khoảng 52 phẩy 56 phút trong
      cả năm. Lưu ý, cụm từ bốn tín hiệu vàng trong sách kinh điển năm 2016 về vận hành hệ thống quy mô lớn chỉ độ trễ, lưu lượng, lỗi và độ bão hoà, không phải bốn chỉ số này.
    clear: true
  - show: "<p><b>Quy tắc Phản biện Kiến trúc Microservices và Đơn khối Mô-đun</b>:</p>\n\
      <pre><code>// Nguyên tắc đánh đổi kiến trúc của Kỹ sư Cấp cao\nif (domainComplexity\
      \ == LOW && teamSize < 10) {\n    chooseModularMonolith(); // Triển khai đơn\
      \ khối mô-đun, tiết kiệm chi phí\n} else {\n    chooseMicroservicesWithSaga();\
      \ // Tách khi nghiệp vụ phức tạp hoặc nhiều nhóm\n}</code></pre>\n<p>Đơn khối mô-đun\
      \ (modular monolith) = một chương trình triển khai chung, nhưng bên trong chia\
      \ mô-đun có ranh giới rõ, sau này dễ tách. Ngưỡng 10 người chỉ là ví dụ minh hoạ.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Khi hội đồng hỏi về việc chọn kiến trúc dịch vụ nhỏ hay đơn khối, ta phản
      biện dựa trên phân tích chi phí lợi ích. Nếu nghiệp vụ ít biến động và đội ngũ
      tinh gọn, ta ưu tiên đơn khối dạng mô đun, tức một chương trình triển khai chung nhưng chia mô đun rõ ràng, để giảm chi phí hạ tầng. Chỉ khi nghiệp vụ
      phức tạp hoặc nhiều nhóm cần phát hành độc lập, ta mới tách dịch vụ nhỏ.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Kể Câu chuyện Sự cố Sản xuất Thực tế tại OCB'
  checks:
  - 3000 // 1000 == 3
  - 8000 // 1000 == 8
  steps:
  - show: "<p><b>Tình huống phỏng vấn kinh điển</b>: Hãy kể lại sự cố kỹ thuật nghiêm\
      \ trọng nhất mà bạn từng trực tiếp điều tra và khắc phục trên môi trường thực\
      \ tế?</p>\n<ul>\n  <li>Bối cảnh: Ví dụ minh họa (hãy thay bằng sự cố thật của\
      \ bạn): bế tắc khóa Oracle ORA-00060 ngày thanh toán lương.</li>\n  <li>Lưu\
      \ lượng: Tăng vọt, nhiều luồng bị treo cứng, cổng API báo lỗi 504 (cổng chờ hệ thống phía sau quá hạn).</li>\n  <li>Nhiệm\
      \ vụ: Tìm ra nguyên nhân gốc rễ và khôi phục dịch vụ.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta cùng thực hành câu trả lời cho câu hỏi phỏng vấn kinh điển về sự cố thực
      tế. Đây chỉ là ví dụ minh họa, bạn hãy thay bằng sự cố thật của mình, chẳng
      hạn lưu lượng tăng vọt ngày chi lương khiến cổng thanh toán bị treo cứng. Đây
      là cơ hội vàng để chứng minh bản lĩnh của bạn.
  - show: '<p><b>Bước 1: Hành động ứng cứu tức thời và trích xuất tệp nhật ký vết</b>:</p>

      <div class="box pit">Hành động: Không khởi động lại máy chủ một cách mù quáng!
      Tôi lập tức truy cập thư mục nhật ký cảnh báo của Oracle, trích xuất tệp vết
      chấm trc và đọc biểu đồ chu trình bế tắc khóa Deadlock Graph!</div>'
    focus:
    - 0
    - 0
    say: Bước một, người kỹ sư bản lĩnh không khởi động lại hệ thống một cách hoảng
      loạn. Bạn lập tức truy cập thư mục nhật ký chuyên dụng, trích xuất tệp vết và
      đọc biểu đồ chu trình bế tắc để định vị chính xác hai câu lệnh xung đột.
    clear: true
  - show: "<p><b>Bước 2: Tìm ra nguyên nhân gốc rễ</b>:</p>\n<pre><code>-- Phiên 1 (chuyển 100 từ A sang B)\n\
      UPDATE account SET balance = balance - 100 WHERE no = 'A';\nUPDATE account SET balance\
      \ = balance + 100 WHERE no = 'B';</code></pre>\n<pre><code>-- Phiên 2 (chuyển 100 từ B sang A)\n\
      UPDATE account SET balance = balance - 100 WHERE no = 'B';\nUPDATE account SET balance\
      \ = balance + 100 WHERE no = 'A';</code></pre>\n<p>Hai phiên cùng chạy xong dòng UPDATE\
      \ đầu, rồi mỗi phiên chờ khóa phiên kia giữ.</p>\n<div class=\"box key\">Hai phiên khóa hai tài\
      \ khoản theo thứ tự ngược nhau nên chờ nhau thành vòng; Oracle phát hiện vòng\
      \ chờ, báo ORA-00060 và huỷ câu lệnh của một phiên.</div>"
    focus:
    - 0
    - 0
    say: Bước hai, tệp vết cho thấy hai phiên chuyển tiền khóa hai tài khoản theo
      thứ tự ngược nhau, nên mỗi phiên giữ một khóa và chờ khóa mà phiên kia đang
      giữ. Oracle phát hiện vòng chờ này, báo lỗi bế tắc và huỷ câu lệnh của một
      trong hai phiên.
    clear: true
  - show: '<p><b>Bước 3: Giải pháp lâu dài và kết quả đo lường thuyết phục</b>:</p>

      <div class="box key">Viết lại thủ tục lưu trữ: khóa từng dòng tài khoản bằng
      câu lệnh riêng theo thứ tự mã tăng dần (không dựa vào ORDER BY ... FOR UPDATE).
      Kết quả: nêu số đo thật trước và sau khi sửa, ví dụ
      tần suất lỗi và thời gian phản hồi từ hệ thống giám sát.</div>'
    focus:
    - 0
    - 0
    say: Bước ba, bạn trình bày giải pháp lâu dài là khóa từng dòng tài khoản bằng
      câu lệnh riêng, theo thứ tự mã tài khoản tăng dần. Bạn nêu kết quả bằng số đo thật trước và sau khi
      sửa, và không bao giờ bịa số liệu.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Cân bằng Giữa Bảo mật Sinh trắc học và Trải nghiệm Người dùng'
  checks:
  - 4 * 25 == 100
  - 100 // 2 == 50
  steps:
  - show: "<p><b>Tình huống phỏng vấn Senior</b>: Quyết định 2345/QĐ-NHNN (ký 18/12/2023,\
      \ hiệu lực 01/07/2024) yêu cầu xác thực\
      \ khuôn mặt khi một lần chuyển trên 10 triệu đồng hoặc khi tổng chuyển trong\
      \ ngày vượt 20 triệu đồng. Làm sao bạn bảo đảm tuân thủ\
      \ pháp lý mà không làm khách hàng khó chịu vì độ trễ?</p>\n<ul>\n  <li>(A) Bắt\
      \ buộc xác thực khuôn mặt cho mọi giao dịch kể cả một nghìn đồng.</li>\n  <li>(B)\
      \ Áp dụng cơ chế Xác thực theo mức độ rủi ro (Risk-Based Authentication): Giao\
      \ dịch nhỏ và địa điểm quen thuộc chỉ cần xác thực nhẹ; chỉ kích hoạt sinh trắc\
      \ học khi một lần chuyển trên 10 triệu, khi tổng trong ngày vượt 20 triệu, hoặc\
      \ khi xuất hiện hành vi bất thường.</li>\n\
      \  <li>(C) Bỏ qua kiểm tra sinh trắc học để người dùng chuyển tiền cho nhanh.</li>\n\
      </ul>"
    focus:
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi về cân bằng giữa an ninh bảo mật và trải nghiệm người
      dùng. Khi áp dụng quy định bắt buộc về sinh trắc học khuôn mặt của Ngân hàng
      Nhà nước, kỹ sư cấp cao sẽ thiết kế giải pháp như thế nào để giữ chân khách
      hàng.
  - show: '<p><b>Đáp án chính xác: Lựa chọn (B)</b></p>

      <div class="box key">Giải thích vì: Cơ chế xác thực theo rủi ro kết hợp mô hình
      AI phát hiện điểm bất thường giúp phân loại giao dịch thông minh. Do đó phần
      lớn giao dịch nhỏ hằng ngày diễn ra mượt mà, còn mọi giao dịch chạm ngưỡng
      (một lần trên 10 triệu, hoặc làm tổng trong ngày vượt 20 triệu) đều bắt buộc
      xác thực khuôn mặt theo đúng quy định.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì cơ chế xác thực theo mức độ rủi ro giúp
      phân loại giao dịch thông minh. Do đó các khoản chuyển tiền nhỏ diễn ra nhanh
      chóng. Còn giao dịch một lần trên 10 triệu, hoặc làm tổng trong ngày vượt 20
      triệu, luôn phải xác thực khuôn mặt theo đúng quy định.
    clear: true
