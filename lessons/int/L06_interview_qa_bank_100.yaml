- id: quiz
  kind: quiz
  title: 'Trắc nghiệm tính toán: bao nhiêu máy cho một cổng thanh toán'
  checks:
  - round(8000 * 0.13) == 1040
  - math.ceil(1040 / 500) == 3
  - math.ceil(1040 / 500) + 1 == 4
  - math.ceil(8000 * 130 / 500) + 1 == 2081
  - math.ceil(8000 / 500) + 1 == 17
  steps:
  - show: |-
      <p><b>Câu hỏi tính toán</b> (số minh hoạ): cổng nhận <b>8 000</b> giao dịch mỗi giây, mỗi giao dịch ở lại hệ thống <b>130 mili giây</b>, mỗi máy giữ được <b>500</b> yêu cầu cùng lúc, và ta thêm <b>1</b> máy dự phòng. Cần tổng cộng bao nhiêu máy?</p>
      <ul>
        <li><b>A</b>: 2 081 máy</li>
        <li><b>B</b>: 3 máy</li>
        <li><b>C</b>: 4 máy</li>
        <li><b>D</b>: 17 máy</li>
      </ul>
    focus:
    - 0
    say: Xin mời bạn tính số máy cho cổng tám nghìn giao dịch mỗi giây, mỗi giao dịch ở lại một trăm ba mươi mili giây, mỗi máy giữ năm trăm yêu cầu, thêm một máy dự phòng.
    pause: 45
  - show: |-
      <div class="box key"><b>Đáp án chính xác là C: 4 máy</b></div>
      <table class="t">
        <tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
        <tr><td>1. Đổi đơn vị</td><td>130 mili giây = 0,13 giây</td><td>0,13 giây</td></tr>
        <tr><td>2. Yêu cầu dở cùng lúc</td><td>8 000 × 0,13</td><td>1 040</td></tr>
        <tr><td>3. Số máy chạy</td><td>1 040 ÷ 500 = 2,08, làm tròn lên</td><td>3</td></tr>
        <tr><td>4. Cộng máy dự phòng</td><td>3 + 1</td><td>4</td></tr>
      </table>
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: Đáp án chính xác là C. Đổi một trăm ba mươi mili giây ra không phẩy mười ba giây, nên số yêu cầu dở là tám nghìn nhân không phẩy mười ba, được một nghìn không trăm bốn mươi. Chia cho năm trăm được hai phẩy không tám, làm tròn lên thành ba máy. Cộng một máy dự phòng, tổng cộng bốn máy.
  - show: |-
      <table class="t">
        <tr><th>phương án</th><th>lỗi tính dẫn tới kết quả này</th></tr>
        <tr><td>A: 2 081 máy</td><td>quên đổi mili giây ra giây: 8 000 × 130 = 1 040 000 yêu cầu dở, chia 500 làm tròn lên 2 080, cộng 1</td></tr>
        <tr><td>B: 3 máy</td><td>quên máy dự phòng: dừng ở bước 3</td></tr>
        <tr><td>D: 17 máy</td><td>quên nhân với thời gian ở lại: 8 000 chia 500 = 16, cộng 1</td></tr>
      </table>
      <p>Mỗi phương án sai là kết quả của một lỗi tính thường gặp, nên khi kiểm lại đáp án hãy soát ba chỗ: đơn vị thời gian, máy dự phòng, và bước nhân với thời gian ở lại.</p>
    focus:
    - '1.2'
    - ['1.3', '1.4']
    - 2
    clear: true
    say: Phương án A là lỗi quên đổi mili giây ra giây, nên con số phình lên một nghìn lần. Phương án B là quên máy dự phòng, còn phương án D là quên nhân với thời gian ở lại. Vì vậy khi kiểm lại, hãy soát đơn vị thời gian, máy dự phòng và bước nhân với thời gian ở lại.
- id: practice
  kind: practice
  title: 'Tự làm: câu phỏng vấn có số về thiết kế cổng và ngưỡng sinh trắc học'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn ra đề: cổng nhận <b>2 000</b> giao dịch mỗi giây, độ trễ trung bình <b>200 mili giây</b>, mỗi máy giữ <b>150</b> yêu cầu cùng lúc, mục tiêu sẵn sàng <b>99,95%</b>, chuỗi <b>3</b> tầng nối tiếp mỗi tầng 99,95%. Rồi hỏi thêm: chuyển <b>12 triệu</b> một lần có cần xác thực khuôn mặt không; hai lần chuyển <b>8 triệu</b> và <b>7 triệu</b> trong cùng một ngày thì sao?</p>
      <p class="note">Định dạng sáu dòng nằm trong <code>de.md</code>; ở dòng chuỗi tầng, tính phút ngừng bằng tích chưa làm tròn.</p>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Cổng hai nghìn giao dịch mỗi giây, độ trễ hai trăm mili giây, mỗi máy giữ một trăm năm mươi yêu cầu, hãy tính số yêu cầu dở và số máy kèm một máy dự phòng. Rồi tính ngân sách ngừng của mục tiêu chín mươi chín phẩy chín mươi lăm phần trăm, và độ sẵn sàng của chuỗi ba tầng nối tiếp. Cuối cùng cho biết hai tình huống chuyển tiền có cần xác thực khuôn mặt không. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>yeu cau do cung luc: 400</div><div>so may (moi may 150, +1 du phong): 4</div><div>ngan sach 99.95%: 262.8 phut/nam</div><div>chuoi 3 tang 99.95%: 99.85%, ngung 788.0 phut/nam</div><div>sinh trac hoc 12 trieu mot lan: can</div><div>tong ngay 8 + 7 = 15 trieu: chua can</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L06/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> yêu cầu dở = giao dịch mỗi giây × số giây; số máy = làm tròn lên (yêu cầu dở chia sức chứa một máy), rồi cộng 1. Ngân sách = 525 600 × (1 − 0,9995). Chuỗi = tích các tỉ lệ. Ngưỡng sinh trắc học (theo báo chí, chưa đọc nguyên văn): một lần trên 10 triệu, hoặc tổng trong ngày trên 20 triệu.
      Lời giải đầy đủ ở <code>labs/INT/L06/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, yêu cầu dở bằng số giao dịch mỗi giây nhân số giây, số máy bằng yêu cầu dở chia sức chứa một máy rồi làm tròn lên và cộng một. Ngân sách ngừng bằng năm trăm hai mươi lăm nghìn sáu trăm phút nhân một trừ chín mươi chín phẩy chín mươi lăm phần trăm, còn chuỗi bằng tích các tỉ lệ. Xác thực khuôn mặt bắt buộc khi một lần chuyển trên mười triệu hoặc tổng trong ngày trên hai mươi triệu. Lời giải đầy đủ nằm trong thư mục thực hành.
  lab: labs/INT/L06
- id: recap
  kind: recap
  title: Tổng kết chuỗi logic Phỏng vấn Thực chiến Senior Banking
  steps:
  - show: |-
      <p><b>Kế hoạch 90 ngày đầu nếu gia nhập ngân hàng</b> (khung gợi ý để trả lời, không phải cam kết của ngân hàng nào):</p>
      <table class="t">
        <tr><th>giai đoạn</th><th>mục tiêu</th><th>kết quả bàn giao</th></tr>
        <tr><td>30 ngày đầu</td><td>Hòa nhập, nắm kiến trúc và quy trình bảo mật</td><td>Bản đồ rủi ro các cổng tích hợp hiện hữu</td></tr>
        <tr><td>Tới ngày 60</td><td>Tạo giá trị thực tế</td><td>Cải tiến một bộ điều hợp tích hợp hiện hữu</td></tr>
        <tr><td>Tới ngày 90</td><td>Dẫn dắt độc lập</td><td>Làm chủ một dự án tích hợp mới, chia sẻ nội bộ</td></tr>
      </table>
      <p>Tránh ba lối trả lời sai: đòi viết lại hệ cũ khi chưa hiểu nó; chỉ đọc và dự họp mà không tạo giá trị; đề xuất đổi kiến trúc lớn khi chưa nắm hệ đang chạy.</p>
    focus:
    - 1
    - ['2.2', '2.3', '2.4']
    - 3
    say: Cuối cùng là kế hoạch chín mươi ngày đầu, chia thành ba mốc ba mươi ngày. Tháng đầu hòa nhập và nắm kiến trúc, tháng thứ hai cải tiến một bộ điều hợp hiện hữu, tháng thứ ba độc lập dẫn dắt một dự án mới. Hãy tránh viết lại khi chưa hiểu, quá thụ động, hoặc đổi kiến trúc khi chưa nắm hệ đang chạy.
