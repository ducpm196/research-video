- id: symbol
  kind: symbol
  title: Ma trận Đo lường và Chỉ số SLA của Cổng Thanh toán
  checks:
  - 525600 / 10000 < 53
  - round(365 * 24 * 60 * (1 - 0.9999), 2) == 52.56
  steps:
  - show: |-
      <p><b>Bốn chỉ số mục tiêu (SLA) — yêu cầu giả định của đề bài, không phải số liệu của ngân hàng nào</b>:</p>
      <div class="box key">
      $$\text{Thông lượng đỉnh (Throughput): } \text{TPS} \ge 10\,000\text{ giao dịch mỗi giây}$$
      $$\text{Độ trễ trung bình (Latency): } T_{\text{avg}} \le 120\text{ mili giây}$$
      $$\text{Tỉ lệ sẵn sàng (Availability): } A \ge 99{,}99\%\text{ (ngừng tối đa } 525\,600 \times 0{,}0001 \approx 52{,}56\text{ phút mỗi năm)}$$
      $$\text{Tỉ lệ lỗi giao dịch (Error Rate): } E < 0{,}001\%$$
      </div>
      <p>SLA = mức dịch vụ cam kết. Đừng gọi đây là "bốn tín hiệu vàng": sách Site Reliability Engineering (Google, 2016, về vận hành hệ thống quy mô lớn) dùng tên đó cho độ trễ, lưu lượng, lỗi và độ bão hoà.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Trong phần thi thiết kế hệ thống, ta bám vào bốn chỉ số mục tiêu, tức mức dịch vụ cam kết. Theo yêu cầu giả định của đề bài, hệ thống cần thông lượng mười nghìn giao dịch mỗi giây với độ trễ trung bình không quá một trăm hai mươi mili giây. Mục tiêu sẵn sàng bốn số chín cho phép ngừng tối đa 525600 phút nhân 0 phẩy 0001, khoảng 52 phẩy 56 phút trong cả năm. Cùng với đó là tỉ lệ lỗi giao dịch dưới không phẩy không không một phần trăm. Lưu ý, cụm từ bốn tín hiệu vàng trong sách kinh điển năm 2016 về vận hành hệ thống quy mô lớn chỉ độ trễ, lưu lượng, lỗi và độ bão hoà, không phải bốn chỉ số này.
    clear: true
  - show: |-
      <p><b>Quy tắc Phản biện Kiến trúc Microservices và Đơn khối Mô-đun</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>if (điều kiện) { A } else { B }</td><td>nếu điều kiện đúng thì chạy A, ngược lại thì chạy B</td></tr>
        <tr><td>domainComplexity == LOW</td><td>== là so sánh bằng (khác một dấu =, là gán); domainComplexity là độ phức tạp nghiệp vụ; LOW là mức thấp</td></tr>
        <tr><td>&amp;&amp;; teamSize &lt; 10</td><td>&amp;&amp; nghĩa là "và": cả hai điều kiện cùng đúng; teamSize &lt; 10: số người trong đội nhỏ hơn 10</td></tr>
        <tr><td>chooseModularMonolith(), chooseMicroservicesWithSaga(); // ...</td><td>hai hàm, tên cho biết việc làm: chọn đơn khối mô-đun, hoặc chọn dịch vụ nhỏ kèm SAGA; // là ghi chú, máy bỏ qua</td></tr>
      </table>
    focus:
    - 0
    - ['2.3', '2.4']
    clear: true
    say: Khi hội đồng hỏi về việc chọn kiến trúc dịch vụ nhỏ hay đơn khối, ta phản biện dựa trên chi phí lợi ích. Dòng điều kiện đọc là nếu độ phức tạp nghiệp vụ thấp và đội dưới mười người.
  - show: |-
      <pre><code>// Nguyên tắc đánh đổi kiến trúc của Kỹ sư Cấp cao
      if (domainComplexity == LOW && teamSize < 10) {
          chooseModularMonolith(); // Triển khai đơn khối mô-đun, tiết kiệm chi phí
      } else {
          chooseMicroservicesWithSaga(); // Tách khi nghiệp vụ phức tạp hoặc nhiều nhóm
      }</code></pre>
      <p>Đơn khối mô-đun (modular monolith) = một chương trình triển khai chung, nhưng bên trong chia mô-đun có ranh giới rõ, sau này dễ tách. Ngưỡng 10 người chỉ là ví dụ minh hoạ.</p>
    focus:
    - 1
    - 2
    say: Khi đó ta ưu tiên đơn khối dạng mô đun, tức một chương trình triển khai chung nhưng chia mô đun rõ ràng, để giảm chi phí hạ tầng. Chỉ khi nghiệp vụ phức tạp hoặc nhiều nhóm cần phát hành độc lập, ta mới tách dịch vụ nhỏ.
    clear: true
- id: example
  kind: example
  title: 'Khung kể một sự cố (ví dụ minh hoạ, không phải kinh nghiệm của bạn)'
  checks: []
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn kinh điển</b>: Hãy kể lại sự cố kỹ thuật nghiêm trọng nhất mà bạn từng trực tiếp điều tra và khắc phục trên môi trường thực tế?</p>
      <ul>
        <li>Bối cảnh: Ví dụ minh họa (hãy thay bằng sự cố thật của bạn): bế tắc khoá (hai phiên giữ khoá rồi chờ nhau mãi) của Oracle, mã lỗi ORA-00060, ngày thanh toán lương.</li>
        <li>Lưu lượng: Tăng vọt, nhiều luồng bị treo cứng, cổng API báo lỗi 504 (cổng chờ hệ thống phía sau quá hạn).</li>
        <li>Nhiệm vụ: Tìm ra nguyên nhân gốc rễ và khôi phục dịch vụ.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta cùng thực hành câu trả lời cho câu hỏi phỏng vấn kinh điển về sự cố thực tế. Đây chỉ là ví dụ minh họa, bạn hãy thay bằng sự cố thật của mình. Chẳng hạn bế tắc khoá, tức hai phiên giữ khoá rồi chờ nhau mãi, ngày chi lương khiến cổng thanh toán bị treo cứng. Đây là cơ hội vàng để chứng minh bản lĩnh của bạn.
  - show: |-
      <p><b>Bước 1: Hành động ứng cứu tức thời và trích xuất tệp nhật ký vết</b>:</p>
      <div class="box pit">Hành động trong tình huống minh hoạ (câu mẫu, không phải kinh nghiệm của bạn): không khởi động lại máy chủ một cách mù quáng; mở thư mục nhật ký cảnh báo của Oracle, lấy tệp vết (tệp .trc, nơi Oracle ghi chi tiết lỗi) và đọc biểu đồ bế tắc Deadlock Graph (phiên nào giữ khoá nào, đang chờ khoá nào).</div>
    focus:
    - 0
    - 0
    - 0
    say: Bước một, trong tình huống minh hoạ này, người kỹ sư không khởi động lại hệ thống một cách hoảng loạn. Họ truy cập thư mục nhật ký chuyên dụng và lấy tệp vết, nơi Oracle ghi chi tiết lỗi. Rồi họ đọc biểu đồ bế tắc, cho biết phiên nào giữ khoá nào và đang chờ khoá nào, để định vị hai câu lệnh xung đột.
    clear: true
  - show: |-
      <p><b>Đọc trước một dòng lệnh SQL</b> (SQL là ngôn ngữ ra lệnh cho cơ sở dữ liệu):</p>
      <table class="t">
        <tr><th>phần của lệnh</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>-- ...</td><td>từ dấu -- tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>UPDATE account</td><td>sửa dữ liệu trong bảng tài khoản (account)</td></tr>
        <tr><td>SET balance = balance - 100</td><td>đặt số dư mới bằng số dư cũ trừ 100</td></tr>
        <tr><td>WHERE no = 'A'</td><td>chỉ ở dòng có số tài khoản A; dòng đó bị khoá cho tới khi giao dịch xong</td></tr>
      </table>
    focus:
    - 0
    - ['2.3', '2.4', '2.5']
    clear: true
    say: Trước khi xem hai phiên, ta đọc một dòng lệnh. Sửa trong bảng tài khoản, ở dòng có số A, đặt số dư mới bằng số dư cũ trừ một trăm, và dòng đó bị khoá đến khi giao dịch xong.
  - show: |-
      <p><b>Bước 2: Tìm ra nguyên nhân gốc rễ</b>:</p>
      <pre><code>-- Phiên 1 (chuyển 100 từ A sang B)
      UPDATE account SET balance = balance - 100 WHERE no = 'A';
      UPDATE account SET balance = balance + 100 WHERE no = 'B';</code></pre>
      <pre><code>-- Phiên 2 (chuyển 100 từ B sang A)
      UPDATE account SET balance = balance - 100 WHERE no = 'B';
      UPDATE account SET balance = balance + 100 WHERE no = 'A';</code></pre>
      <p>Hai phiên cùng chạy xong dòng UPDATE đầu, rồi mỗi phiên chờ khoá phiên kia giữ.</p>
      <div class="box key">Hai phiên khoá hai tài khoản theo thứ tự ngược nhau nên chờ nhau thành vòng; Oracle phát hiện vòng chờ, báo ORA-00060 và huỷ câu lệnh của một phiên.</div>
    focus:
    - 0
    - 0
    say: Bước hai, tệp vết cho thấy hai phiên chuyển tiền khoá hai tài khoản theo thứ tự ngược nhau, nên mỗi phiên giữ một khoá và chờ khoá mà phiên kia đang giữ. Oracle phát hiện vòng chờ này, báo lỗi bế tắc và huỷ câu lệnh của một trong hai phiên.
    clear: true
  - show: |-
      <p><b>Bước 3: Giải pháp lâu dài và kết quả đo lường thuyết phục</b>:</p>
      <div class="box key">Viết lại thủ tục lưu trữ (đoạn chương trình lưu sẵn trong cơ sở dữ liệu, gọi bằng tên): khoá từng dòng tài khoản bằng câu lệnh riêng theo thứ tự mã tăng dần (tự đặt thứ tự khoá bằng mã, không để cơ sở dữ liệu tự chọn thứ tự). Kết quả: nêu số đo thật trước và sau khi sửa, ví dụ tần suất lỗi và thời gian phản hồi từ hệ thống giám sát.</div>
    focus:
    - 0
    - 0
    say: Bước ba, bạn trình bày giải pháp lâu dài là khoá từng dòng tài khoản bằng câu lệnh riêng, theo thứ tự mã tài khoản tăng dần. Bạn nêu kết quả bằng số đo thật trước và sau khi sửa, và không bao giờ bịa số liệu.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Cân bằng Giữa Bảo mật Sinh trắc học và Trải nghiệm Người dùng'
  checks:
  - 10 < 20
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn Senior</b>: báo chí nêu, chuyển tiền trực tuyến của khách cá nhân phải xác thực khuôn mặt khi một lần chuyển trên 10 triệu đồng hoặc khi tổng chuyển trong ngày trên 20 triệu đồng. Có nơi gắn ngưỡng này với Thông tư 50/2024/TT-NHNN (đã được sửa đổi bởi Thông tư 77/2025/TT-NHNN), có nơi gắn với Quyết định 2345/QĐ-NHNN; chưa đọc nguyên văn các văn bản này, chưa kiểm biên "trên" hay "từ"; bài không nêu số điều hay phụ lục. Làm sao bạn bảo đảm tuân thủ pháp lý mà không làm khách hàng khó chịu vì độ trễ?</p>
      <ul>
        <li>(A) Bắt buộc xác thực khuôn mặt cho mọi giao dịch kể cả một nghìn đồng.</li>
        <li>(B) Áp dụng cơ chế Xác thực theo mức độ rủi ro (Risk-Based Authentication): Giao dịch nhỏ và địa điểm quen thuộc chỉ cần xác thực nhẹ; chỉ kích hoạt sinh trắc học khi một lần chuyển trên 10 triệu, khi tổng trong ngày vượt 20 triệu, hoặc khi xuất hiện hành vi bất thường.</li>
        <li>(C) Bỏ qua kiểm tra sinh trắc học để người dùng chuyển tiền cho nhanh.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi về cân bằng giữa an ninh bảo mật và trải nghiệm người dùng. Ngưỡng mười triệu mỗi lần và hai mươi triệu mỗi ngày do báo chí nêu, tôi chưa đọc nguyên văn, nên làm thật bạn phải mở văn bản hiện hành. Khi áp dụng quy định bắt buộc về sinh trắc học khuôn mặt của Ngân hàng Nhà nước, kỹ sư cấp cao sẽ thiết kế giải pháp như thế nào để giữ chân khách hàng.
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn (B)</b></p>
      <div class="box key">Giải thích vì: Cơ chế xác thực theo rủi ro kết hợp mô hình AI phát hiện điểm bất thường giúp phân loại giao dịch thông minh. Do đó phần lớn giao dịch nhỏ hằng ngày diễn ra mượt mà, còn mọi giao dịch chạm ngưỡng (một lần trên 10 triệu, hoặc làm tổng trong ngày vượt 20 triệu) đều bắt buộc xác thực khuôn mặt theo ngưỡng đã nêu (ngưỡng theo báo chí, chưa đọc nguyên văn).</div>
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì cơ chế xác thực theo mức độ rủi ro giúp phân loại giao dịch thông minh. Do đó các khoản chuyển tiền nhỏ diễn ra nhanh chóng. Còn giao dịch một lần trên 10 triệu, hoặc làm tổng trong ngày vượt 20 triệu, luôn phải xác thực khuôn mặt theo ngưỡng đã nêu.
    clear: true
- id: quymo
  kind: example
  title: 'Khi tải đề thiết kế tăng: số máy tăng theo tải, độ sẵn sàng tụt theo số tầng'
  checks:
  - round(1000 * 0.120) == 120
  - round(10000 * 0.120) == 1200
  - round(100000 * 0.120) == 12000
  - math.ceil(1200 / 500) == 3
  - math.ceil(12000 / 500) == 24
  - round(0.9999 ** 4 * 100, 4) == 99.96
  - round((1 - 0.9999 ** 4) * 525600, 1) == 210.2
  steps:
  - show: '<p><b>Yêu cầu dở</b> = yêu cầu đã nhận nhưng chưa xong. Công thức: yêu cầu dở = giao dịch mỗi giây × số giây ở lại.</p><table class="t"><tr><th>giao dịch mỗi giây</th><th>số giây ở lại</th><th>yêu cầu dở</th></tr><tr><td>100</td><td>2</td><td>100 × 2 = 200</td></tr></table>'
    focus:
    - 0
    say: Yêu cầu dở là yêu cầu đã nhận nhưng chưa xong, ví dụ một trăm yêu cầu mỗi giây, mỗi yêu cầu ở lại hai giây, thì lúc nào cũng có hai trăm yêu cầu đang dở.
    clear: true
  - show: |-
      <p><b>Đọc trước đoạn mã Python sắp chạy</b> (Python là ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>import math</td><td>lấy sẵn bộ công cụ toán của Python; math.ceil làm tròn lên</td></tr>
        <tr><td>for tps in (1000, 10000, 100000):</td><td>lặp lần lượt ba mức tải; các dòng thụt vào là phần được lặp</td></tr>
        <tr><td>do = tps * 0.120  # ...</td><td>đặt tên do (yêu cầu dở) bằng tải nhân 0,120 giây ở lại (dấu * là nhân); từ dấu # tới hết dòng là ghi chú, máy bỏ qua</td></tr>
        <tr><td>may = math.ceil(do / 500)</td><td>chia cho 500 yêu cầu mỗi máy rồi làm tròn lên (2,3 thành 3)</td></tr>
        <tr><td>print(...)</td><td>in kết quả ra màn hình</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3']
    - '2.4'
    - ['2.5', '2.6']
    clear: true
    say: Trước khi chạy, ta đọc mã Python. Dòng đầu lấy sẵn bộ công cụ toán, và dòng lặp thử ba mức tải. Số yêu cầu dở bằng tải nhân số giây ở lại, và dấu thăng mở đầu ghi chú. Số máy bằng yêu cầu dở chia sức chứa mỗi máy, làm tròn lên, rồi lệnh in hiện kết quả.
  - show: '<p><b>Chạy thật bằng Python: đề thiết kế ở ×1, ×10, ×100</b></p><div class="code"><div>import math</div><div>for tps in (1000, 10000, 100000):</div><div>    do = tps * 0.120            # yeu cau do cung luc (tre TB 120 ms)</div><div>    may = math.ceil(do / 500)   # moi may giu 500 yeu cau (so minh hoa)</div><div>    print(tps, ''tps:'', do, ''do,'', may, ''may, +1 du phong ='', may + 1)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 tps: 120.0 do, 1 may, +1 du phong = 2</div><div>10000 tps: 1200.0 do, 3 may, +1 du phong = 4</div><div>100000 tps: 12000.0 do, 24 may, +1 du phong = 25</div></div>'
    focus:
    - 2
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật cho đề thiết kế, với độ trễ trung bình một trăm hai mươi mili giây và mỗi máy giữ năm trăm yêu cầu cùng lúc, hai số minh hoạ. Ở một nghìn giao dịch mỗi giây có 120 yêu cầu dở, cần một máy cộng một máy dự phòng. Ở mười nghìn, đúng như đề bài, có 1200 yêu cầu dở, cần ba máy cộng một dự phòng. Ở một trăm nghìn, có 12000 yêu cầu dở, cần hai mươi bốn máy cộng một dự phòng.
  - show: |-
      <p><b>Đọc trước mã Python chuỗi bốn tầng</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>a = 0.9999 ** 4  # ...</td><td>đặt tên a cho 0,9999 nhân với chính nó bốn lần (hai dấu sao là lũy thừa); phần sau dấu # là ghi chú</td></tr>
        <tr><td>round(x, 4)</td><td>làm tròn, giữ bốn chữ số sau dấu phẩy</td></tr>
        <tr><td>print(round(a * 100, 4), '%', round((1 - a) * 525600, 1), 'phut ngung/nam')</td><td>in ba phần: độ sẵn sàng theo phần trăm, dấu %, và số phút ngừng mỗi năm = (1 − a) nhân 525 600 phút của một năm</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3']
    - '2.4'
    clear: true
    say: Trước khi chạy, ta đọc mã chuỗi. Hai dấu sao rồi số bốn nghĩa là nhân bốn lần, và lệnh làm tròn giữ bốn chữ số sau dấu phẩy. Lệnh in hiện độ sẵn sàng cùng số phút ngừng mỗi năm.
  - show: '<p><b>Chuỗi bốn tầng nối tiếp, mỗi tầng 99,99%</b></p><div class="code"><div>a = 0.9999 ** 4   # 4 tang noi tiep, moi tang 99.99%</div><div>print(round(a * 100, 4), ''%'', round((1 - a) * 525600, 1), ''phut ngung/nam'')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>99.96 % 210.2 phut ngung/nam</div></div>'
    focus:
    - 0
    - 2
    - 4
    - 4
    clear: true
    say: Còn ngân sách ngừng của cả chuỗi thì sao, khi nhiều tầng nối tiếp nhau. Bốn tầng nối tiếp, mỗi tầng chín mươi chín phẩy chín chín phần trăm, nhân với nhau chỉ còn chín mươi chín phẩy chín sáu phần trăm. Đổi ra phút, mỗi năm ngừng tới khoảng 210 phút, gấp bốn lần mức 52 phẩy 56 phút của mục tiêu. Vì vậy mỗi tầng phải cao hơn mục tiêu chung.
  - show: |
      <table class="t">
        <tr><th>mức tải</th><th>yêu cầu dở</th><th>số máy</th><th>điều gì gãy, cách xử lý</th></tr>
        <tr><td>1 000 (×1)</td><td>120</td><td>1 + 1</td><td>chưa gãy; máy thứ hai chủ yếu để dự phòng</td></tr>
        <tr><td>10 000 (×10, đề bài)</td><td>1 200</td><td>3 + 1</td><td>một máy hỏng thì ba máy còn lại vẫn gánh đủ</td></tr>
        <tr><td>100 000 (×100)</td><td>12 000</td><td>24 + 1</td><td>quản lý 25 máy bằng tay không nổi nên phải tự động; kho dữ liệu chung thành nút cổ chai, phải chia dữ liệu</td></tr>
      </table>
      <p>Đánh đổi: thêm máy dự phòng tốn tiền hơn, thêm tầng nối tiếp làm tụt độ sẵn sàng chung.</p>
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Bảng này gom lại điều người làm nghề phải cân nhắc. Ở mức nhỏ, máy thứ hai chủ yếu để dự phòng. Ở mười nghìn, ba máy chạy và một máy dự phòng, một máy hỏng thì ba máy còn lại vẫn đủ. Ở một trăm nghìn, hai mươi lăm máy không thể quản lý bằng tay, và kho dữ liệu chung thành nút cổ chai, nên phải tự động hoá và chia dữ liệu. Đánh đổi là máy dự phòng tốn tiền, và thêm tầng nối tiếp làm tụt độ sẵn sàng chung.
