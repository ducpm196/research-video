    clear: true
  - show: '<p><b>Bước 2 — Khẳng định cam kết với Ban Lãnh đạo ACB</b>:</p>

      <div class="box key">Một kế hoạch 90 ngày sắc sảo cho thấy bạn là nhân sự cấp
      cao vào để đóng góp sớm và giải quyết vấn đề, một lý do hợp lý khi đề xuất mức
