  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm của Giám đốc Khối CNTT</b>: Nếu được nhận vào\
      \ ACB với mức đãi ngộ 50 triệu gross, kế hoạch hành động trong 90 ngày đầu tiên\
      \ của bạn là gì?</p>\n<ul>\n  <li><b>A</b>: Đòi viết lại toàn bộ hệ thống cũ\
      \ từ đầu bằng ngôn ngữ lập trình mới nhất.</li>\n  <li><b>B</b>: 30 ngày đầu\
      \ nắm vững kiến trúc hiện hữu và quy trình bảo mật; tới ngày 60 trực tiếp\
      \ tối ưu hóa một phân hệ lõi; tới ngày 90 độc lập dẫn dắt dự án tích hợp mới và\
      \ chuyển giao công nghệ.</li>\n  <li><b>C</b>: Chỉ ngồi đợi đồng nghiệp giao\
      \ việc gì thì làm việc đó.</li>\n  <li><b>D</b>: Xin nghỉ phép dài ngày để làm\
      \ quen môi trường mới.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Xin mời bạn lựa chọn kế hoạch hành động chín mươi ngày đầu tiên khi gia nhập
      ngân hàng. Đây là câu hỏi quyết định bạn có được giao trọng trách lớn hay không.
      Bạn có 15 giây suy nghĩ trước khi nghe đáp án chuẩn.
    pause: 15
  - show: "<div class=\"box key\"><b>Đáp án chính xác là B</b>!</div>\n<p><b>Bước\
