scenes:
- id: hook
  kind: hook
  title: Nghệ thuật đối thoại kỹ thuật với Hội đồng Kiến trúc và Lãnh đạo Khối CNTT ACB
  steps:
  - show: |-
      <p>Hội đồng phỏng vấn Kỹ sư Cấp cao thường không dừng ở các định nghĩa trắc nghiệm lý thuyết sách vở.</p>
      <div class="box key">Họ sẽ liên tục xoáy sâu vào các điểm nghẽn cao tải, phân tích nguyên nhân sự cố sản xuất và chất vấn phương án kiến trúc. Làm thế nào để phản xạ tự nhiên và trả lời trôi chảy mọi câu hỏi khó nhất?</div>
      <p>Video này luyện phương pháp trả lời và năm tình huống tiêu biểu, tự đứng được, không cần tệp nào khác. Bộ 100 câu tự biên soạn chỉ là bộ luyện thêm, không phải đề tuyển dụng của ACB.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, buổi phỏng vấn Kỹ sư Cấp cao tại ngân hàng Á Châu là một cuộc đối thoại kỹ thuật chuyên sâu. Hội đồng sẽ liên tục đào sâu vào tình huống sự cố thực tế và thử thách bản lĩnh kiến trúc của bạn. Hôm nay ta rèn phương pháp trả lời qua năm tình huống tiêu biểu, và bài này tự đứng được. Bộ một trăm câu tự biên soạn chỉ là bộ luyện thêm, không phải đề tuyển dụng của ACB.
  - show: |-
      <table class="t">
        <tr><th>nhóm câu hỏi</th><th>phạm vi chuyên môn</th><th>tiêu chuẩn phản xạ chuẩn Senior</th></tr>
        <tr><td>Phần 1: Khoa học máy tính</td><td>Bộ nhớ máy ảo, đa luồng và cấu trúc dữ liệu</td><td>Nắm chắc bản chất bộ nhớ, chỉ mục dạng cây (B-Tree) và luồng ảo (luồng nhẹ của Java 21)</td></tr>
        <tr><td>Phần 2 & 3: Dịch vụ nhỏ & Phân tán</td><td>Quản lý giao dịch bằng Spring (khung lập trình Java), Kafka (hàng đợi sự kiện) và Oracle</td><td>SAGA (chuỗi bước, mỗi bước có bước hoàn tác), hộp thư sự kiện (ghi tin cần gửi cùng giao dịch), khoá theo thứ tự để giảm bế tắc</td></tr>
        <tr><td>Phần 4 & 5: Nghiệp vụ & Thiết kế</td><td>Core banking (ví dụ T24), NAPAS (đơn vị chuyển mạch thanh toán liên ngân hàng), tín dụng, đề bài 10k TPS (giao dịch mỗi giây)</td><td>Bảo toàn dòng tiền, chỉ nêu số liệu thật có nguồn</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta giải mã năm nhóm câu hỏi trọng điểm. Ta nắm phương pháp trả lời năm tầng và luyện bài thiết kế hệ thống thanh toán với yêu cầu giả định mười nghìn giao dịch mỗi giây. Trên bảng, Spring là khung lập trình Java có sẵn phần quản lý giao dịch, còn NAPAS là đơn vị chuyển mạch thanh toán liên ngân hàng. Ta cũng rèn bản lĩnh đặt an toàn dòng tiền lên hàng đầu.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Phương pháp Trả lời Đào sâu 5 Tầng'
  checks:
  - 20 * 5 == 100
  - 100 // 10 == 10
  steps:
  - show: |-
      <p><b>Phương pháp trả lời Đào sâu 5 Tầng</b> (khung tự đặt để luyện tập, khác kỹ thuật 5 Whys, tức hỏi "vì sao" năm lần liên tiếp để tìm nguyên nhân gốc):</p>
      <table class="t">
        <tr><th>tầng trả lời</th><th>nội dung bắt buộc</th><th>cách ghi điểm</th></tr>
        <tr><td>Tầng 1: Định nghĩa</td><td>Khái niệm kỹ thuật ngắn gọn, súc tích</td><td>Nêu đúng bản chất trong 2 câu</td></tr>
        <tr><td>Tầng 2: Cơ chế ngầm</td><td>Nguyên lý hoạt động dưới tầng hệ điều hành hoặc máy ảo</td><td>Giải thích cơ chế bộ nhớ và dòng chảy dữ liệu</td></tr>
        <tr><td>Tầng 3: Tình huống biên</td><td>Mạng lỗi, bế tắc khoá (hai bên đợi nhau, không bên nào chạy tiếp), quá hạn (chờ quá thời gian cho phép)</td><td>Chỉ ra nguy cơ tiềm ẩn mà người khác bỏ qua</td></tr>
        <tr><td>Tầng 4: Sự cố thực tế</td><td>Câu chuyện từng xử lý thành công trên môi trường thật</td><td>Nêu bối cảnh, hành động và kết quả tại nơi bạn từng làm</td></tr>
        <tr><td>Tầng 5: Số liệu đo lường</td><td>Thông số thông lượng, độ trễ và tỉ lệ sẵn sàng</td><td>Chỉ nêu số đo thật có nguồn; chưa đo thì nói định tính</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    say: Trước hết, ta cần nắm phương pháp trả lời năm tầng, một khung tự đặt để luyện tập. Khi nhận câu hỏi, bạn không chỉ nêu định nghĩa ngắn gọn mà phải giải thích tường tận cơ chế ngầm bên dưới. Tiếp theo, bạn nêu các trường hợp lỗi biên, dẫn chứng sự cố thực tế từng xử lý và chốt lại bằng số đo thật nếu bạn có nguồn đo.
  - show: '<div class="box key">Tư duy Kỹ sư Cấp cao thực thụ: Không phải là người viết những đoạn mã nguồn phức tạp nhất, mà là người luôn đặt tính an toàn và bảo toàn dòng tiền của khách hàng lên vị trí số một, dự báo trước mọi điểm lỗi và viết mã nguồn tự phục hồi!</div>'
    focus:
    - 0
    - 0
    say: Thước đo giá trị của một Kỹ sư Cấp cao nằm ở tư duy phòng ngừa rủi ro. Bạn luôn đặt an toàn vốn của ngân hàng lên hàng đầu, biết cách dự báo trước các điểm nghẽn và thiết kế hệ thống có khả năng tự phục hồi khi có biến cố xảy ra.
    clear: true
  - show: |
      <p><b>Chọn trọng tâm ôn theo hai nhóm vai trò</b> (một số tin tuyển dụng ngân hàng chia như vậy; đối chiếu trang chính thức):</p>
      <table class="t">
        <tr><th>câu hay được hỏi về</th><th>Nhóm A: dịch vụ nhỏ hiện đại</th><th>Nhóm B: hệ cũ và nghiệp vụ</th></tr>
        <tr><td>dữ liệu</td><td>lũy đẳng (gửi hai lần vẫn chỉ tính một lần), Outbox (hộp thư gửi tin cùng giao dịch), Kafka</td><td>chỉ mục (mục tra nhanh theo cột, như mục lục sách), kế hoạch truy vấn (cách cơ sở dữ liệu chọn tìm dòng), khoá và bế tắc Oracle hoặc MS SQL</td></tr>
        <tr><td>nghiệp vụ</td><td>thanh toán, chuyển tiền, đối soát</td><td>phê duyệt tín dụng, tra cứu lịch sử tín dụng</td></tr>
        <tr><td>vận hành</td><td>triển khai, giám sát, xử lý sự cố</td><td>viết bản thiết kế, kịch bản kiểm thử, làm việc với nghiệp vụ</td></tr>
      </table>
      <p><i>Hỗ trợ mức 3</i> = nhận phiếu sự cố khi mức 1 và 2 bó tay; nhóm nào cũng có, nên không dùng để phân loại.</p>
    focus:
    - 0
    - '2.2'
    - '2.2'
    - '2.2'
    - '2.4'
    - 3
    clear: true
    say: Bộ một trăm câu chia thành năm nhóm, nhưng không phải tin tuyển dụng nào cũng hỏi đều cả năm nhóm. Với vai trò dịch vụ nhỏ hiện đại, câu hỏi nghiêng về lũy đẳng, Kafka, thanh toán và vận hành. Hộp thư sự kiện, hay Outbox, là cách ghi tin cần gửi vào một bảng cùng giao dịch rồi đẩy đi sau. Với vai trò hệ cũ và nghiệp vụ, câu hỏi nghiêng về chỉ mục, khoá, bế tắc và phê duyệt tín dụng, còn kế hoạch truy vấn là cách cơ sở dữ liệu chọn đường tìm dữ liệu. Câu hỏi vận hành có hỗ trợ mức ba, tức kỹ sư nhận phiếu sự cố khi mức một và mức hai không giải quyết được, nên không dùng nó để phân loại. Bạn đọc kỹ tin tuyển dụng, chọn nhóm vai trò, rồi ôn kỹ các câu của nhóm đó trước.
- id: concept
  kind: concept
  title: 'Bài Thiết kế Hệ thống: Payment Hub 10,000 TPS (Đề bài Giả định)'
  steps:
  - show: |-
      <p><b>Các từ sẽ gặp trên sơ đồ</b>:</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>API Gateway</td><td>cổng vào chung, kiểm tra yêu cầu rồi mới chuyển vào trong</td></tr>
        <tr><td>mTLS</td><td>hai bên cùng xuất trình giấy chứng nhận để xác nhận nhau, trên đường truyền đã mã hoá (TLS là lớp mã hoá của địa chỉ https)</td></tr>
        <tr><td>IBM MQ</td><td>phần mềm hàng đợi tin: bên gửi bỏ tin vào hàng, bên nhận lấy ra dần</td></tr>
        <tr><td>TCP</td><td>kênh nối hai chương trình qua mạng, gửi dữ liệu theo đúng thứ tự</td></tr>
        <tr><td>NAPAS</td><td>đơn vị chuyển mạch thanh toán liên ngân hàng</td></tr>
        <tr><td>Giới hạn tốc độ, Kafka cụm đôi, CDC</td><td>chặn bớt khi một bên gửi quá nhiều; hai cụm Kafka ở hai trung tâm dữ liệu; bắt thay đổi dữ liệu từ nhật ký của cơ sở dữ liệu</td></tr>
      </table>
    focus:
    - 0
    - '2.3'
    clear: true
    say: Trước khi xem sơ đồ, ta giải nghĩa các từ sẽ gặp, từ cổng vào chung đến hàng đợi tin và chuyển mạch liên ngân hàng. Hai bên cùng xuất trình giấy chứng nhận là ý nghĩa của mTLS.
  - show: |-
      <p><b>Kiến trúc 4 Tầng Payment Hub 10,000 TPS (yêu cầu giả định của đề bài)</b>:</p>
