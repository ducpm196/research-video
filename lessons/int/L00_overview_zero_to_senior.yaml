- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Gói Thu nhập Năm với Số Minh hoạ'
  checks:
  - 40 * 12 == 480
  - 480 + 40 == 520
  - 520 + 40 * 1 == 560
  - 520 + 40 * 4 == 680
  steps:
  - show: |-
      <p class="quiz-q">Câu hỏi: Giả sử lương gross L = 40 triệu một tháng (số minh hoạ). Tin tuyển dụng ghi lương tháng 13 cố định và thưởng từ 1 đến 4 tháng lương tuỳ xếp loại. Gói thu nhập một năm trước thuế nằm trong khoảng nào?</p>
      <div class="step">A: Đúng 480 triệu đồng</div>
      <div class="step">B: Từ 560 đến 680 triệu đồng</div>
      <div class="step">C: Cố định 600 triệu đồng</div>
    focus:
    - 0
    say: Mời bạn tính gói thu nhập một năm khi lương gross là 40 triệu, một số minh hoạ, với tháng thứ mười ba cố định và thưởng từ một đến bốn tháng lương.
    pause: 25
  - show: |-
      <table class="t">
        <tr><th>thành phần thu nhập</th><th>công thức tính toán</th><th>giá trị quy đổi</th></tr>
        <tr><td>Lương 12 tháng</td><td>40 triệu nhân 12 tháng</td><td>480 triệu đồng</td></tr>
        <tr><td>Lương tháng 13 cố định</td><td>480 triệu cộng 40 triệu</td><td>520 triệu đồng</td></tr>
        <tr><td>Thưởng 1 đến 4 tháng</td><td>520 cộng 40 đến 160 triệu</td><td>560 đến 680 triệu đồng</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta lấy 40 triệu nhân 12 tháng để có 480 triệu lương cơ bản. Bước hai, ta cộng lương tháng 13 cố định để được 520 triệu đồng. Bước ba, ta cộng thưởng từ 1 đến 4 tháng, tức từ 40 đến 160 triệu đồng, nên gói năm từ 560 đến 680 triệu đồng.
    clear: true
  - show: |
      <p><b>Đáp án chính xác: Lựa chọn B (560 đến 680 triệu đồng)</b></p>
      <div class="box key">
      $$T = L \times (13 + k),\ k \text{ từ 1 đến 4: } T \text{ từ 560 đến 680 triệu}$$
      <p>Con số cụ thể phụ thuộc xếp loại cuối năm, nên không thể nói cố định 600 triệu. Lương ghi "Thương lượng": $L$ thật phải hỏi nhà tuyển dụng, kèm hai câu hỏi nữa: thưởng tính trên lương cứng hay tổng thu nhập, và điều kiện xếp loại ra sao.</p>
      </div>
    focus:
    - 0
    - 0
    say: Gói thu nhập cả năm nằm trong khoảng 560 đến 680 triệu đồng, tuỳ xếp loại thưởng. Vì lương trong tin tuyển dụng ghi thương lượng, bạn phải hỏi nhà tuyển dụng con số L thật, thưởng tính trên lương cứng hay tổng thu nhập, và điều kiện xếp loại.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: trả lời một câu phỏng vấn có số về tải, độ sẵn sàng và nhóm vai trò'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi: &laquo;Cổng thanh toán nhận <b>8 000</b> giao dịch mỗi giây, mỗi giao dịch ở lại hệ thống <b>25 mili giây</b>, mục tiêu sẵn sàng <b>99,95%</b>. Bạn tính tải và ngân sách ngừng thế nào?&raquo; Rồi đưa một tin tuyển dụng yêu cầu: <b>JBoss, JSP, MS SQL, sở hữu một mảng nghiệp vụ, hỗ trợ mức 3 theo SLA</b>; tin này nghiêng về nhóm A hay B?</p>
      <p>Viết ba dòng: số yêu cầu dở cùng lúc; phút ngừng tối đa mỗi năm (365 ngày); nhóm của tin.</p>
      <p class="note">Định dạng ba dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Tính số yêu cầu dở cùng lúc của cổng tám nghìn giao dịch mỗi giây, rồi đổi mục tiêu chín mươi chín phẩy chín mươi lăm phần trăm ra phút ngừng mỗi năm. Sau đó cho biết tin tuyển dụng đòi máy chủ ứng dụng cũ, trang web cũ, cơ sở dữ liệu thương mại và sở hữu một mảng nghiệp vụ nghiêng về nhóm nào. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>dang xu ly do: 200</div><div>ngung toi da 99.95%: 262.8 phut/nam</div><div>nhom tin tuyen dung: B</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L00/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> yêu cầu dở = giao dịch mỗi giây × số giây ở lại (25 mili giây = 0,025 giây). Phút ngừng = 525 600 phút một năm × (1 − 0,9995). Nhóm: JBoss, JSP, MS SQL và sở hữu mảng nghiệp vụ là dấu hiệu nghiêng về nhóm B; mức 3 có ở cả hai nhóm nên không dùng để phân loại.
      Lời giải đầy đủ ở <code>labs/INT/L00/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, yêu cầu dở bằng số giao dịch mỗi giây nhân với số giây ở lại, trong đó hai mươi lăm mili giây là không phẩy không hai mươi lăm giây. Phút ngừng bằng năm trăm hai mươi lăm nghìn sáu trăm phút nhân một trừ chín mươi chín phẩy chín mươi lăm phần trăm. Máy chủ ứng dụng cũ, trang web cũ, cơ sở dữ liệu thương mại và sở hữu mảng nghiệp vụ nghiêng về nhóm B, còn mức ba thì không phân loại được.
  lab: labs/INT/L00
- id: recap
  kind: recap
  title: Tóm lược Chuỗi Logic Lột xác Năng lực Kỹ sư Ngân hàng
  steps:
  - show: |-
      <p><b>Chuỗi logic năm bước tiến hóa từ con số không đến kỹ sư backend ngân hàng cấp cao</b>:</p>
