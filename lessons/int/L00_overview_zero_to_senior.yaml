    say: Trước khi chạy, ta đọc cách viết từng dòng mã Python. Dấu thăng mở đầu một ghi chú, ngoặc tròn chứa danh sách ba giá trị, và vòng lặp lấy lần lượt từng giá trị.
  - show: |
