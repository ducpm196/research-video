- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Xác định Gói Thu nhập và Mức Lương Gross'
  checks:
  - 50 * 12 == 600
  - 600 + 50 == 650
  - 650 + 50 * 1 == 700
  - 650 + 50 * 4 == 850
  steps:
  - show: '<p class="quiz-q">Câu hỏi: Giả sử ứng viên đạt mức lương cứng 50 triệu
      gross mỗi tháng tại ACB. Tin tuyển dụng ghi lương tháng 13 cố định và thưởng
      từ 1 đến 4 tháng lương tuỳ xếp loại. Gói thu nhập một năm nằm trong khoảng nào?</p>

      <div class="step">A: Đúng 600 triệu đồng</div>

      <div class="step">B: Từ 700 đến 850 triệu đồng</div>

      <div class="step">C: Cố định 750 triệu đồng</div>'
    focus:
    - 0
    say: 'Mời bạn tính toán gói thu nhập: Với mức lương 50 triệu gross một tháng, lương
      tháng 13 cố định và thưởng từ 1 đến 4 tháng, gói thu nhập một năm nằm trong khoảng
      nào?'
    pause: 5
  - show: "<table class=\"t\">\n  <tr><th>thành phần thu nhập</th><th>công thức tính\
      \ toán</th><th>giá trị quy đổi</th></tr>\n  <tr><td>Lương 12 tháng</td><td>50\
      \ triệu nhân 12 tháng</td><td>600 triệu đồng</td></tr>\n  <tr><td>Lương tháng\
      \ 13 cố định</td><td>600 triệu cộng 50 triệu</td><td>650 triệu đồng</td></tr>\n\
      \  <tr><td>Thưởng 1 đến 4 tháng</td><td>650 cộng 50 đến 200 triệu</td><td>700\
      \ đến 850 triệu đồng</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta lấy 50 triệu nhân 12 tháng để có 600 triệu lương cơ bản. Bước
      hai, ta cộng lương tháng 13 cố định để được 650 triệu đồng. Bước ba, ta cộng
      thưởng từ 1 đến 4 tháng, tức từ 50 đến 200 triệu đồng, nên gói năm từ 700 đến
      850 triệu đồng.
    clear: true
  - show: '<p><b>Đáp án chính xác: Lựa chọn B (700 đến 850 triệu đồng)</b></p>

      <div class="box key">

      $$T = 50 \times (13 + k),\ k \text{ từ 1 đến 4: } T \text{ từ 700 đến 850 triệu}$$

      <p>Con số cụ thể phụ thuộc xếp loại cuối năm, nên không thể nói cố định 750 triệu.
      Lương ACB ghi "Thương lượng": 50 triệu là mức kỳ vọng, không phải kết quả được bảo đảm.</p>

      </div>'
    focus:
    - 0
    - 0
    say: Gói thu nhập cả năm nằm trong khoảng 700 đến 850 triệu đồng, tuỳ xếp loại thưởng.
      Vì lương trong tin tuyển dụng ghi thương lượng, 50 triệu chỉ là mức kỳ vọng bạn
      phải bảo vệ bằng năng lực có bằng chứng.
    clear: true
