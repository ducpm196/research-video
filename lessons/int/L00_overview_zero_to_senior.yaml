- id: symbol
  kind: symbol
  title: Công thức Gói Thu nhập Năm và Nguyên tắc Nói chuyện Lương
  checks:
  - 40 * 12 == 480
  - 40 * (13 + 1) == 560
  - 40 * (13 + 4) == 680
  steps:
  - show: |
      <p><b>Công thức gói thu nhập một năm</b> (trước thuế). Mọi con số dưới đây là số minh hoạ để tập tính, không phải mức lương của ngân hàng nào:</p>
      <div class="box key">
      $$S_{\text{năm}} = L \times 12$$
      $$T = L \times (13 + k)$$
      $$L = 40 \text{ (số minh hoạ)}: T = 40 \times 14 = 560 \text{ đến } 40 \times 17 = 680 \text{ triệu}$$
      </div>
      <p>$L$ = lương gross một tháng; $13$ = 12 tháng cộng một tháng lương thứ mười ba cố định; $k$ = số tháng thưởng, từ 1 đến 4 tuỳ xếp loại. Tin tuyển dụng của ACB (Ngân hàng Thương mại Cổ phần Á Châu; tin đã lưu, đọc 2026-11; kiểm lại tin hiện hành trước khi nộp hồ sơ) ghi lương tháng 13 cố định và thưởng cuối năm 1–4 tháng lương tuỳ xếp loại, còn mức lương ghi "Thương lượng": con số $L$ thật phải hỏi nhà tuyển dụng.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Để nói chuyện lương có căn cứ, ta cần một công thức tính gói thu nhập cả năm. Gọi L là lương gross một tháng, thì lương mười hai tháng là L nhân mười hai. Thêm một tháng lương thứ mười ba cố định và k tháng thưởng, gói năm là L nhân mười ba cộng k. Với L bằng 40 triệu, một số minh hoạ để tập tính, k từ một đến bốn cho gói từ 560 đến 680 triệu. Tin tuyển dụng của ACB ghi tháng thứ mười ba cố định và thưởng một đến bốn tháng, còn lương ghi thương lượng, nên con số L thật bạn phải hỏi nhà tuyển dụng.
  - show: |-
      <table class="t">
        <tr><th>nguyên tắc đàm phán</th><th>hành vi sai lầm</th><th>hành vi chuẩn mực</th></tr>
        <tr><td>Cơ sở xác định lương</td><td>Dựa vào nhu cầu chi tiêu cá nhân</td><td>Dựa vào giá trị giải quyết tắc nghẽn</td></tr>
        <tr><td>Bảo vệ năng lực</td><td>Nói lý thuyết suông</td><td>Dẫn chứng kiến trúc và số liệu thật có nguồn</td></tr>
        <tr><td>Chương trình AI đang học</td><td>Tự ti vì học trái ngành</td><td>Nêu nền thuật toán AI, nói đúng mốc dự kiến</td></tr>
      </table>
    focus:
    - 0
    - 0
    say: Quy tắc vàng khi đàm phán lương là tuyệt đối không nói về nhu cầu chi tiêu cá nhân. Bạn định vị bản thân như một nhà giải quyết bài toán kinh doanh, và dẫn chứng bằng số liệu thật có nguồn.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Bốn bước giải bài toán chống trừ tiền kép khi chuyển khoản'
  checks:
  - 60000 // 60 == 1000
  - 120 - 60 == 60
  - 50000 > 10000
  - 60 > 30
  - 500 < 60 * 1000
  steps:
  - show: |-
      <p><b>Bài toán thực tế</b>: Khách hàng nhấn chuyển khoản 20 triệu đồng qua App ACB, mạng 4G bị chập chờn.</p>
      <div class="step">Khách hàng nhấn nút chuyển 2 lần liên tiếp trong khoảng thời gian 500 mili giây.</div>
      <p>Làm thế nào để hệ thống chỉ trừ tiền duy nhất một lần và phản hồi chính xác?</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xét bài toán kinh điển trong phỏng vấn kỹ sư ngân hàng. Khách hàng thực hiện chuyển 20 triệu đồng nhưng mạng viễn thông chập chờn. Khách hàng nhấn nút chuyển hai lần liên tiếp. Hệ thống phải xử lý thế nào để chỉ trừ tiền đúng một lần duy nhất.
  - show: |-
      <p><b>Bước 1: Thiết lập khoá phân tán Redis bằng lệnh nguyên tử</b>:</p>
      <p>Mã sinh MỘT lần mỗi lệnh; hai lần bấm gửi CÙNG mã. Redis là kho dữ liệu nằm trong RAM, ra lệnh bằng một dòng chữ. Cách đọc dòng lệnh:</p>
      <table class="t">
        <tr><th>viết trong lệnh</th><th>đọc là</th></tr>
        <tr><td>SET</td><td>đặt một khoá vào kho, kèm một giá trị</td></tr>
        <tr><td>lock:transfer:TXN_998822</td><td>tên khoá, ghép từ nhãn "khoá" + "chuyển khoản" + mã yêu cầu</td></tr>
        <tr><td>1</td><td>giá trị cất kèm, chỉ để đánh dấu "đã có người giữ"</td></tr>
        <tr><td>NX, EX 60</td><td>NX: chỉ đặt khi khoá chưa có; EX 60: khoá tự hết hạn sau 60 giây</td></tr>
      </table>
    focus:
    - 0
    - 0
    - '3.5'
    say: Bước một, ứng dụng sinh một mã yêu cầu duy nhất cho lệnh chuyển, và cả hai lần bấm đều gửi cùng mã này, gọi là khoá lũy đẳng. Lũy đẳng nghĩa là gửi nhiều lần vẫn cho kết quả như gửi một lần. Dòng lệnh đặt một khoá kèm giá trị, chỉ khi khoá chưa có, và khoá tự hết hạn sau 60 giây.
    clear: true
    introduces:
    - int_luy_dang
    - int_nguyen_tu
  - show: |-
      <pre><code>SET lock:transfer:TXN_998822 1 NX EX 60</code></pre>
      <p><i>Lệnh nguyên tử</i> = kiểm tra và đặt trong một bước, không ai chen giữa được. <i>Lũy đẳng</i> = gửi một lần hay nhiều lần cùng một yêu cầu thì kết quả vẫn như gửi một lần. Yêu cầu đầu tiên lấy được khoá, yêu cầu thứ hai (500 mili giây sau) bị chặn.</p>
    focus:
    - 1
    - 1
    - 2
    say: Cổng tích hợp dùng lệnh nguyên tử của Redis, tức kiểm tra và đặt khoá trong một bước, nghĩa là lệnh đặt ghi một khoá mang tên theo mã đó, và chỉ ghi khi chưa có ai giữ. Khoá tự hết hạn sau 60 giây để không bị kẹt mãi nếu dịch vụ dừng giữa chừng. Yêu cầu đầu tiên lấy được khoá sẽ đi tiếp, trong khi yêu cầu thứ hai đến sau 500 mili giây bị chặn lại.
    clear: true
  - show: |-
      <p><b>Bước 2: Lớp chặn cuối cùng trong cơ sở dữ liệu: ràng buộc UNIQUE</b>:</p>
      <pre><code>-- cột idempotency_key có ràng buộc UNIQUE (không cho hai dòng trùng mã)
      INSERT INTO payment_transactions (idempotency_key, status)
      VALUES ('TXN_998822', 'PROCESSING');
      -- lần chèn thứ hai báo lỗi trùng khoá</code></pre>
      <p><i>Cơ sở dữ liệu</i> lưu dữ liệu thành các bảng gồm hàng và cột, như bảng tính. <code>INSERT INTO bảng (các cột) VALUES (các giá trị)</code> = thêm một hàng mới vào bảng. <i>UNIQUE</i> = luật của bảng: cột đó không được có hai hàng cùng giá trị.</p>
    focus:
    - 1
    - 3
    - 3
    say: Bước hai, khoá Redis có thể mất khi máy chủ bộ nhớ gặp sự cố, nên lớp chặn cuối cùng nằm trong cơ sở dữ liệu. Cơ sở dữ liệu lưu dữ liệu thành các bảng gồm hàng và cột như bảng tính, và câu lệnh chèn thêm một hàng mới vào bảng. Ràng buộc duy nhất là luật của bảng, cấm hai hàng cùng giá trị ở cột mã yêu cầu.
    clear: true
  - show: |-
      <p>Nếu chèn bị lỗi trùng: đọc trạng thái cũ (Đang xử lý / Thành công) và trả lại, không trừ tiền lần hai. Vì sao không chỉ dùng <code>SELECT … FOR UPDATE</code>? <code>SELECT</code> = đọc các hàng của bảng; <code>FOR UPDATE</code> = đọc xong thì khoá luôn các hàng đó, người khác chưa sửa được. Oracle, PostgreSQL và MySQL là ba phần mềm cơ sở dữ liệu phổ biến. Trên Oracle và PostgreSQL, khi dòng chưa tồn tại thì chẳng có hàng nào để khoá, hai yêu cầu cùng thấy "chưa có" và cùng đi tiếp (MySQL, với công cụ lưu trữ InnoDB, còn khoá cả khoảng trống giữa các giá trị, nên khác).</p>
    focus:
    - 1
    - 1
    say: Lần chèn thứ hai với cùng mã sẽ báo lỗi trùng, và hệ thống trả lại trạng thái cũ mà không trừ tiền lần hai. Cách đọc hàng rồi khoá luôn hàng đó thì chưa đủ, vì khi dòng chưa tồn tại thì không có gì để khoá, và hai yêu cầu cùng đi tiếp.
    clear: true
  - show: |-
      <p><b>Bước 3: Gửi bản tin trừ tiền vào core banking (hệ thống ngân hàng lõi giữ sổ cái) qua hàng đợi IBM MQ</b>:</p>
      <div class="box ok">IBM MQ là phần mềm hàng đợi tin nhắn: bên gửi đặt tin vào, bên nhận lấy ra xử lý sau. Bản tin mang mã định danh không đổi; hệ thống lõi từ chối mã đã gặp, nên kiểm tra số dư và hạch toán đúng một lần.</div>
      <p><b>Bước 4: Giải phóng khoá phân tán và hoàn tất phản hồi</b>.</p>
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, hệ thống gửi bản tin trừ tiền sang hệ thống ngân hàng lõi qua hàng đợi IBM MQ, là phần mềm mà bên gửi đặt tin vào còn bên nhận lấy ra xử lý sau. Bản tin mang mã định danh không đổi, nên hệ thống lõi nhận ra mã đã gặp và chỉ hạch toán một lần. Sau khi có phản hồi, bước bốn sẽ giải phóng khoá phân tán và gửi thông báo thành công cho người dùng.
    clear: true
- id: quymo
  kind: example
  title: 'Khi hệ thống lớn dần: số yêu cầu dở cùng lúc và phút ngừng cho phép'
  checks:
  - 500 * 0.010 == 5
  - 50000 * 0.010 == 500
  - 5000000 * 0.010 == 50000
  - round(525600 * 10 ** -2, 2) == 5256.0
  - round(525600 * 10 ** -3, 2) == 525.6
  - round(525600 * 10 ** -4, 2) == 52.56
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b> (Python là một ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>w = 0.010</td><td>đặt tên w cho số 0,010 (số giây một giao dịch ở lại)</td></tr>
