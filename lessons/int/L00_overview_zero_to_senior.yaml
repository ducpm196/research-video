scenes:
- id: hook
  kind: hook
  title: Khoảng cách thực tế giữa xem video lý thuyết và đỗ kỹ sư ngân hàng cấp cao
  steps:
  - show: |-
      <p>Một lập trình viên mới bắt đầu hoặc mất gốc tự hỏi liệu chỉ xem một chuỗi video ngắn có đủ sức đỗ kỹ sư backend ngân hàng cấp cao hay không?</p>
      <div class="box key">Câu trả lời thẳng thắn là không thể nếu chỉ học vẹt kiến thức bề mặt. Cần một lộ trình khổ luyện có hệ thống từ nền tảng máy tính đến nghiệp vụ tài chính chuyên sâu.</div>
      <p><i>Lương gross</i> = lương ghi trong hợp đồng, trước khi trừ thuế thu nhập cá nhân và phần bảo hiểm bắt buộc của người lao động.</p>
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, nhiều bạn băn khoăn liệu chỉ xem vài chục phút video có đủ để trở thành kỹ sư ngân hàng cấp cao hay không. Lương gross là lương ghi trong hợp đồng, trước khi trừ thuế thu nhập cá nhân và phần bảo hiểm bắt buộc của người lao động. Câu trả lời trung thực là hoàn toàn không thể nếu bạn chỉ học vẹt mà thiếu nền tảng.
    introduces:
    - int_gross
  - show: |-
      <table class="t">
        <tr><th>tầng năng lực</th><th>nguy cơ nếu học vẹt</th><th>giải pháp chuẩn kỹ sư cấp cao</th></tr>
        <tr><td>Nền tảng máy tính</td><td>Bị đánh trượt khi hỏi về bộ nhớ đệm CPU</td><td>Học lại từ đầu bộ nhớ đệm và bộ nhớ Java bằng ví dụ số nhỏ</td></tr>
        <tr><td>Hệ thống phân tán</td><td>Gây lỗi trừ tiền kép khi mạng bị ngắt</td><td>Biết cách hoàn tác từng bước khi lỗi giữa chừng và chặn xử lý trùng</td></tr>
        <tr><td>Chương trình đại học</td><td>Bị coi là trái ngành vì học trí tuệ nhân tạo</td><td>Trình bày việc học AI như một lợi thế có thật</td></tr>
      </table>
      <p>Hôm nay, ta giải mã: <b>Kim tự tháp năng lực</b>, <b>nghiệp vụ ngân hàng lõi</b>, và <b>hai nhóm vai trò backend</b>.</p>
    focus:
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau giải mã kim tự tháp năng lực toàn diện. Ta biết chọn một trong hai nhóm vai trò ở phía máy chủ để ôn đúng trọng tâm. Ta cũng xây dựng cách trình bày trung thực chương trình đại học đang học để đàm phán thu nhập có căn cứ.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: ba chỉ số đo lưu lượng, độ trễ và tính sẵn sàng'
  checks:
  - 1000 * 50 == 50000
  - 100 // 10 == 10
  - 50000 * 10 / 1000 == 500
  - round(365 * 24 * 60 * (1 - 0.9999), 2) == 52.56
  steps:
  - show: |-
      <p><b>Các chỉ số kỹ thuật đo lường hiệu năng cốt lõi</b>:</p>
      <table class="t">
        <tr><th>chỉ số kỹ thuật</th><th>ý nghĩa bằng lời thường</th><th>ví dụ minh họa</th></tr>
        <tr><td>Giao dịch mỗi giây TPS</td><td>Số giao dịch hệ thống xử lý xong trong một giây</td><td>Ví dụ: 50000 lệnh mỗi giây</td></tr>
        <tr><td>Độ trễ phản hồi Latency</td><td>Thời gian từ lúc gửi yêu cầu tới lúc nhận kết quả</td><td>Ví dụ: 10 mili giây mỗi yêu cầu</td></tr>
        <tr><td>Tính sẵn sàng Availability</td><td>Tỉ lệ thời gian hệ thống phục vụ được</td><td>99,99% (bốn số chín): mỗi năm ngừng tối đa khoảng 52,56 phút</td></tr>
      </table>
      <p><i>Cổng tích hợp</i> = lớp phần mềm đứng giữa ứng dụng của khách và các hệ thống bên trong ngân hàng: nhận yêu cầu rồi chuyển đi. Các con số là ví dụ minh họa, không phải số liệu của ngân hàng nào.</p>
    focus:
    - 0
    - 0
    - 2
    - 0
    - 0
    introduces:
    - int_cong_tich_hop
    say: Trước hết, ta cần hiểu ba chỉ số hiệu năng cơ bản trong ngân hàng. Lưu lượng giao dịch mỗi giây là số giao dịch hệ thống làm xong trong một giây, phản ánh sức chịu tải của cổng tích hợp. Cổng tích hợp là lớp phần mềm đứng giữa ứng dụng của khách và các hệ thống bên trong, để nhận rồi chuyển yêu cầu đi. Độ trễ phản hồi là thời gian từ lúc gửi yêu cầu tới lúc nhận kết quả, quyết định trải nghiệm thanh toán của khách hàng. Tính sẵn sàng bốn số chín nghĩa là hệ thống phục vụ được 99 phẩy 99 phần trăm thời gian, tức mỗi năm chỉ được ngừng khoảng 52 phẩy 56 phút.
  - show: |-
      <div class="box info">
        <h4>Có bao nhiêu yêu cầu đang dở cùng lúc? (ví dụ minh họa)</h4>
        <p>Giả sử một cổng thanh toán nhận 50000 giao dịch mỗi giây, mỗi giao dịch nằm trong hệ thống 10 mili giây = 0,01 giây.</p>
        $$L = \lambda \times W = 50000 \times 0{,}01 = 500$$
        <p>Định luật Little: số yêu cầu đang xử lý dở trung bình $L$ = tốc độ đến $\lambda$ × thời gian mỗi yêu cầu ở lại $W$. Đây là con số <b>trung bình</b>, lúc cao điểm có thể lớn hơn.</p>
      </div>
    introduces:
    - lambda
    - int_be_ket_noi
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Kỹ sư cấp cao đo lường tải bằng con số cụ thể. Trong ví dụ minh họa, mỗi giây có 50000 giao dịch đến, và mỗi giao dịch nằm trong hệ thống 10 mili giây, tức 0 phẩy 01 giây. Nhân hai số này, ta được trung bình khoảng 500 yêu cầu đang xử lý dở cùng một lúc, theo một quy luật cơ bản của hàng đợi. Con số này là cơ sở để chọn kích thước bể kết nối, tức số kết nối mở sẵn để các yêu cầu dùng chung, và lúc cao điểm có thể cần nhiều hơn.
    clear: true
- id: concept
  kind: concept
  title: Kim tự tháp năm tầng năng lực từ con số không đến Senior
  steps:
  - show: |-
      <p><b>Các từ sẽ gặp trên kim tự tháp</b> (mỗi chuyên đề sau giảng kỹ lại):</p>
      <table class="t">
        <tr><th>thuật ngữ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>JVM, B-Tree</td><td>Máy ảo chạy chương trình Java; cây tìm kiếm nhiều nhánh mà cơ sở dữ liệu dùng làm chỉ mục (chỉ mục giống mục lục sách: tra mục lục để nhảy tới đúng dòng thay vì đọc từng dòng)</td></tr>
        <tr><td>Microservices, Spring Boot, Redis</td><td>Chia phần mềm thành nhiều dịch vụ nhỏ; bộ khung viết dịch vụ Java; kho dữ liệu nằm trong RAM (bộ nhớ chính của máy), đọc ghi rất nhanh</td></tr>
        <tr><td>SAGA, Outbox, Kafka</td><td>Chuỗi bước, bước nào lỗi thì chạy bước hoàn tác; bảng "hộp thư" ghi sự kiện cùng lúc với dữ liệu; hệ thống chuyển sự kiện giữa các dịch vụ</td></tr>
        <tr><td>T24, NAPAS, Squad</td><td>Một phần mềm ngân hàng lõi (core banking) của hãng Temenos; công ty chuyển mạch tiền giữa các ngân hàng Việt Nam; nhóm nhỏ lo trọn một sản phẩm, ví dụ nhóm cho vay</td></tr>
        <tr><td>AI multiplier</td><td>Kiến thức trí tuệ nhân tạo như một "hệ số nhân" làm tăng giá trị kỹ sư tích hợp</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.2'
    - '2.4'
    - '2.5'
    - 0
    say: Trước khi xem kim tự tháp, ta giải nghĩa từng từ sẽ gặp trên hình bằng lời thường. Máy ảo Java là chương trình chạy mã Java, còn cây nhiều nhánh là cấu trúc mà cơ sở dữ liệu dùng làm chỉ mục. Chỉ mục giống mục lục sách, giúp nhảy tới đúng dòng thay vì đọc từng dòng. SAGA là chuỗi bước mà bước nào lỗi thì chạy bước hoàn tác, Outbox là bảng hộp thư ghi sự kiện cùng lúc với dữ liệu, còn Kafka chuyển sự kiện giữa các dịch vụ. T24 là một phần mềm ngân hàng lõi của hãng Temenos, còn NAPAS là công ty chuyển mạch tiền giữa các ngân hàng Việt Nam. Mỗi chuyên đề phía sau sẽ giảng kỹ lại các khái niệm này từ đầu.
    introduces:
    - int_chi_muc
  - clear: true
    show: |-
      <p><b>Kiến trúc năm tầng năng lực của kỹ sư ngân hàng cấp cao</b>:</p>
      <svg viewBox="0 0 700 240" style="width:100%;max-height:420px;">
        <polygon points="350,10 690,230 10,230" fill="#f0f7ff" stroke="#003366" stroke-width="2"/>
        <line x1="80" y1="185" x2="620" y2="185" stroke="#003366" stroke-width="1.5"/>
        <line x1="149" y1="140" x2="551" y2="140" stroke="#003366" stroke-width="1.5"/>
        <line x1="219" y1="95" x2="481" y2="95" stroke="#003366" stroke-width="1.5"/>
        <line x1="280" y1="55" x2="420" y2="55" stroke="#003366" stroke-width="1.5"/>
        <text x="350" y="48" font-size="11" font-weight="bold" fill="#003366" text-anchor="middle">TẦNG 5: AI</text>
        <text x="350" y="82" font-size="11" font-weight="bold" fill="#003366" text-anchor="middle">TẦNG 4: T24, NAPAS, TÍN DỤNG</text>
        <text x="350" y="122" font-size="12" font-weight="bold" fill="#003366" text-anchor="middle">TẦNG 3: HỆ PHÂN TÁN, SAGA, OUTBOX, KAFKA</text>
        <text x="350" y="167" font-size="12" font-weight="bold" fill="#003366" text-anchor="middle">TẦNG 2: MICROSERVICES, SPRING BOOT, REDIS</text>
        <text x="350" y="212" font-size="12" font-weight="bold" fill="#003366" text-anchor="middle">TẦNG 1: KHOA HỌC MÁY TÍNH, JAVA 21, JVM, B-TREE</text>
      </svg>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Giờ quan sát kim tự tháp năng lực, bạn sẽ thấy lộ trình phát triển gồm 5 tầng rõ rệt. Tầng một là khoa học máy tính và Java lõi. Tầng hai là dịch vụ nhỏ, khung Spring Boot và kho dữ liệu Redis. Tầng ba là hệ thống phân tán chịu lỗi. Tầng bốn là nghiệp vụ tài chính chuyên sâu. Và tầng đỉnh cao là bộ nhân công nghệ trí tuệ nhân tạo.
  - show: |-
      <table class="t">
        <tr><th>tầng năng lực</th><th>hậu quả khi thiếu hụt</th><th>yêu cầu chuẩn mực</th></tr>
        <tr><td>Tầng 1 (Khoa học máy tính)</td><td>Nghẽn bộ nhớ đệm CPU, rò rỉ bộ nhớ Heap</td><td>Nắm chắc kiến trúc máy tính và JVM</td></tr>
        <tr><td>Tầng 3 (Hệ thống phân tán)</td><td>Trừ tiền kép, sai lệch sổ cái hạch toán</td><td>Làm chủ mô hình SAGA và Outbox</td></tr>
