    - 4
    clear: true
    say: Đây là mã Python chạy thật, thử ba mức tải với mỗi giao dịch ở lại hệ thống mười mili giây, một số minh hoạ. Năm trăm giao dịch mỗi giây chỉ có 5 yêu cầu dở cùng lúc, còn năm mươi nghìn giao dịch mỗi giây, gấp một trăm lần, có 500 yêu cầu dở. Gấp thêm một trăm lần nữa, tới năm triệu giao dịch mỗi giây, là 50000 yêu cầu dở cùng lúc. Ba dòng cuối đổi số chín của mục tiêu sẵn sàng ra phút ngừng mỗi năm, từ 5256 phút xuống 52 phẩy 56 phút.
  - show: |
      <table class="t">
        <tr><th>mức tải</th><th>yêu cầu dở cùng lúc</th><th>điều gì bắt đầu gãy</th><th>cách người làm nghề xử lý</th></tr>
        <tr><td>×1 (500 mỗi giây)</td><td>5</td><td>chưa gãy: một máy, một bể kết nối nhỏ là đủ</td><td>giữ thiết kế đơn giản</td></tr>
        <tr><td>×100 (50 000 mỗi giây)</td><td>500</td><td>bể kết nối vài chục không đủ cho 500 yêu cầu dở; luồng nặng tốn nhiều bộ nhớ</td><td>chặn trùng sớm, luồng nhẹ, nhiều máy</td></tr>
        <tr><td>×10 000 (5 triệu mỗi giây)</td><td>50 000</td><td>một máy hay một sổ cái chung đều nghẽn</td><td>chia dữ liệu cho nhiều cụm, đối soát sau</td></tr>
      </table>
      <p><i>Luồng</i> = một dòng công việc chạy riêng trong chương trình; luồng nặng tốn nhiều bộ nhớ nên chạy được ít, luồng nhẹ tốn rất ít nên chạy được rất nhiều. <i>Đối soát</i> = so từng giao dịch giữa sổ của hai bên để tìm chỗ lệch. Thêm số chín hay thêm máy đều tốn tiền.</p>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 2
    - '1.4'
    - 2
    clear: true
    forward_ref: true
    introduces:
    - int_luong
    say: Bảng này cho thấy cùng một thiết kế gãy ở các chỗ khác nhau khi tải lớn dần. Ở mức nhỏ, một máy với bể kết nối nhỏ là đủ, nên giữ thiết kế đơn giản. Gấp một trăm lần, năm trăm yêu cầu dở cùng lúc làm bể kết nối cạn, nên phải chặn trùng sớm, dùng luồng nhẹ và tách thành nhiều máy. Luồng là một dòng công việc chạy riêng trong chương trình, luồng nặng tốn nhiều bộ nhớ nên chạy được ít, còn luồng nhẹ tốn rất ít nên chạy được rất nhiều. Gấp thêm một trăm lần, một máy hay một sổ cái chung đều nghẽn, nên phải chia dữ liệu rồi đối soát sau, tức so khớp sổ hai bên. Mỗi lời giải đều tốn tiền, nên người làm nghề chỉ cam kết đúng mức khách cần.
- id: check
  kind: check
  title: 'Tự Kiểm tra: Đánh giá Năng lực Phản xạ Kiến trúc Phân tán'
  checks:
  - 4 - 1 == 3
  - 50 > 30
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn</b>: Khi kết nối giữa cổng thanh toán và hệ thống ngân hàng lõi (core banking) bị đứt giữa chừng, bạn chọn giải pháp nào?</p>
      <table class="t">
        <tr><th>phương án</th><th>cách thức xử lý mạng</th></tr>
        <tr><td>Phương án A</td><td>Báo lỗi thất bại ngay lập tức</td></tr>
        <tr><td>Phương án B</td><td>Treo trạng thái nghi ngờ, đối soát bù trừ</td></tr>
        <tr><td>Phương án C</td><td>Gửi lại lệnh liên tục tự động</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi tình huống phỏng vấn cấp cao. Vì đường truyền mạng bị đứt đoạn bất ngờ nên ta chưa rõ giao dịch đã được hạch toán hay chưa. Do đó bạn sẽ lựa chọn cách xử lý nào để bảo đảm an toàn cho tiền của khách hàng.
    pause: 15
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn Phương án B</b></p>
      <table class="t">
        <tr><th>phương án</th><th>đánh giá an toàn tài chính</th></tr>
        <tr><td>Phương án A</td><td>Nguy hiểm: bản tin có thể đã tới đích, báo thất bại rồi khách chuyển lại thì trừ tiền kép</td></tr>
        <tr><td>Phương án B</td><td>Cách làm chuẩn của ngân hàng: chưa biết thì giữ nguyên trạng thái nghi ngờ, rồi đối soát</td></tr>
        <tr><td>Phương án C</td><td>Gây quá tải: mỗi lần gửi lại có thể thành thêm một lần trừ tiền, trừ khi có mã chặn trùng</td></tr>
      </table>
      <div class="box key">Nguyên lý ngân hàng: Mất kết nối mạng không đồng nghĩa với giao dịch thất bại. Bản tin có thể đã tới đích và trừ tiền thành công. Trả về thất bại sẽ dẫn tới trừ tiền kép nếu khách hàng chuyển lại. Bắt buộc treo trạng thái và đối soát bù trừ!</div>
      <p>Trạng thái nghi ngờ (IN_DOUBT) = chưa biết giao dịch thành hay bại. Đối soát = so từng giao dịch giữa sổ của hai bên để tìm chỗ lệch, rồi sửa (hoàn tiền hoặc xác nhận).</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B. Trong hệ thống tài chính, mất kết nối mạng không có nghĩa là giao dịch đã thất bại. Hệ thống bắt buộc phải giữ trạng thái nghi ngờ, nghĩa là chưa biết thành hay bại, và kích hoạt quy trình đối soát để không làm thất thoát tiền. Đối soát là so từng giao dịch giữa sổ của hai bên để tìm chỗ lệch, rồi hoàn tiền hoặc xác nhận cho đúng.
    clear: true
- id: pitfall
  kind: pitfall
