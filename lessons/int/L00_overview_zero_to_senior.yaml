scenes:
- id: hook
  kind: hook
  title: Khoảng cách thực tế giữa xem video lý thuyết và đỗ kỹ sư ngân hàng cấp cao
  steps:
  - show: '<p>Một lập trình viên mới bắt đầu hoặc mất gốc tự hỏi liệu chỉ xem một
      chuỗi video ngắn có đủ sức đỗ kỹ sư tích hợp ngân hàng với mức lương 50 triệu
      gross hay không?</p>

      <div class="box key">Câu trả lời thẳng thắn là không thể nếu chỉ học vẹt kiến
      thức bề mặt. Cần một lộ trình khổ luyện có hệ thống từ nền tảng máy tính đến
      nghiệp vụ tài chính chuyên sâu.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, nhiều bạn băn khoăn liệu chỉ xem vài chục phút video có đủ để trở
      thành kỹ sư ngân hàng cấp cao và thương lượng mức lương 50 triệu gross hay không.
      Câu trả lời trung thực là hoàn toàn không thể nếu bạn chỉ học vẹt mà thiếu nền
      tảng. Bài học này sẽ vạch rõ toàn bộ lộ trình năng lực giúp bạn nâng cao năng
      lực thực chất.
  - show: "<table class=\"t\">\n  <tr><th>tầng năng lực</th><th>nguy cơ nếu học vẹt</th><th>giải\
      \ pháp chuẩn kỹ sư cấp cao</th></tr>\n  <tr><td>Nền tảng máy tính</td><td>Bị\
      \ đánh trượt khi hỏi về bộ nhớ đệm CPU</td><td>Học nền từ kho 643 bài giảng\
      \ đã dựng</td></tr>\n  <tr><td>Hệ thống phân tán</td><td>Gây lỗi trừ tiền kép\
      \ khi mạng bị ngắt</td><td>Làm chủ mô hình SAGA và khóa phân tán Redis</td></tr>\n\
      \  <tr><td>Chương trình đại học</td><td>Bị coi là trái ngành vì học trí tuệ nhân tạo</td><td>Trình\
      \ bày việc học AI như một lợi thế có thật</td></tr>\n</table>\n<p>Hôm nay,\
      \ ta giải mã: <b>Kim tự tháp năng lực</b>, <b>nghiệp vụ ngân hàng lõi</b>, và\
      \ <b>chiến lược phỏng vấn 50 triệu gross</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau giải mã kim tự tháp năng lực toàn diện. Ta tìm hiểu
      cách kết nối nền tảng máy tính với hệ thống ngân hàng thực tế. Ta làm chủ quy
      trình nghiệp vụ cốt lõi không thể thay thế. Ta cũng xây dựng cách trình bày
      trung thực chương trình đại học đang học để đàm phán thu nhập xứng đáng.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: Đơn vị đo lường lưu lượng và độ trễ trong giao dịch ngân hàng'
  checks:
  - 1000 * 50 == 50000
  - 100 // 10 == 10
  steps:
  - show: "<p><b>Các chỉ số kỹ thuật đo lường hiệu năng cốt lõi</b>:</p>\n<table class=\"\
      t\">\n  <tr><th>chỉ số kỹ thuật</th><th>ý nghĩa trong ngân hàng</th><th>ví\
      \ dụ minh họa</th></tr>\n  <tr><td>Giao dịch mỗi giây TPS</td><td>Số lượng\
      \ bản tin tài chính xử lý đồng thời</td><td>Ví dụ: 50000 lệnh mỗi giây</td></tr>\n\
      \  <tr><td>Độ trễ phản hồi Latency</td><td>Thời gian hoàn tất một yêu cầu thanh\
      \ toán</td><td>Ví dụ: 10 mili giây mỗi yêu cầu</td></tr>\n  <tr><td>Tính\
      \ sẵn sàng Availability</td><td>Thời gian hệ thống hoạt động liên tục</td><td>Mục\
      \ tiêu thiết kế, ví dụ 99.99 phần trăm</td></tr>\n</table>\n<p>Các con số là\
      \ ví dụ minh họa, không phải số liệu của ngân hàng nào.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại các chỉ số hiệu năng cơ bản trong ngân hàng. Lưu lượng
      giao dịch mỗi giây phản ánh sức chịu tải của cổng tích hợp. Độ trễ phản hồi
      quyết định trải nghiệm thanh toán của khách hàng. Các con số trên bảng chỉ là
      ví dụ minh họa, còn tính sẵn sàng bốn số chín là một mục tiêu thiết kế thường gặp.
  - show: "<div class=\"box info\">\n  <h4>Phép tính lưu lượng đồng thời (ví dụ minh họa)</h4>\n  <p>Giả sử một\
      \ cổng thanh toán xử lý 50000 giao dịch mỗi giây với thời gian phục vụ 10 mili\
      \ giây.</p>\n  <p class=\"math-block\">50000 \\text{ TPS} \\times 10 \\text{\
      \ ms} = 500000 \\text{ req·ms}</p>\n  <p>Số kết nối đồng thời trung bình luôn\
      \ duy trì ở mức:</p>\n  <p class=\"math-block\">\\frac{50000 \\times 10}{1000}\
      \ = 500 \\text{ kết nối song song}</p>\n</div>"
    focus:
    - 0
    - 0
    - 0
    say: Kỹ sư cấp cao luôn đo lường tải bằng con số cụ thể. Trong ví dụ minh họa
      với 50000 giao dịch mỗi giây và độ trễ 10 mili giây, hệ thống phải duy trì ổn định 500 kết nối song
      song liên tục. Đây là cơ sở để cấu hình kích thước bể kết nối mạng.
    clear: true
- id: concept
  kind: concept
  title: Kim tự tháp năm tầng năng lực từ con số không đến Senior
  steps:
  - show: "<p><b>Kiến trúc năm tầng năng lực của kỹ sư ngân hàng cấp cao</b>:</p>\n\
      <svg viewBox=\"0 0 700 240\" style=\"width:100%;max-height:220px;\">\n  <polygon\
      \ points=\"350,10 650,230 50,230\" fill=\"#f0f7ff\" stroke=\"#003366\" stroke-width=\"\
      2\"/>\n  <line x1=\"110\" y1=\"185\" x2=\"590\" y2=\"185\" stroke=\"#003366\"\
      \ stroke-width=\"1.5\"/>\n  <line x1=\"170\" y1=\"140\" x2=\"530\" y2=\"140\"\
      \ stroke=\"#003366\" stroke-width=\"1.5\"/>\n  <line x1=\"230\" y1=\"95\" x2=\"\
      470\" y2=\"95\" stroke=\"#003366\" stroke-width=\"1.5\"/>\n  <line x1=\"290\"\
      \ y1=\"55\" x2=\"410\" y2=\"55\" stroke=\"#003366\" stroke-width=\"1.5\"/>\n\
      \  <text x=\"350\" y=\"42\" font-size=\"12\" font-weight=\"bold\" fill=\"#003366\"\
      \ text-anchor=\"middle\">TẦNG 5: AI MULTIPLIER &amp; DEAL 50M</text>\n  <text\
      \ x=\"350\" y=\"80\" font-size=\"12\" font-weight=\"bold\" fill=\"#003366\"\
      \ text-anchor=\"middle\">TẦNG 4: NGHIỆP VỤ T24, NAPAS, SQUAD</text>\n  <text\
      \ x=\"350\" y=\"122\" font-size=\"12\" font-weight=\"bold\" fill=\"#003366\"\
      \ text-anchor=\"middle\">TẦNG 3: HỆ PHÂN TÁN, SAGA, OUTBOX, KAFKA</text>\n \
      \ <text x=\"350\" y=\"167\" font-size=\"12\" font-weight=\"bold\" fill=\"#003366\"\
      \ text-anchor=\"middle\">TẦNG 2: MICROSERVICES, SPRING BOOT, REDIS</text>\n\
      \  <text x=\"350\" y=\"212\" font-size=\"12\" font-weight=\"bold\" fill=\"#003366\"\
      \ text-anchor=\"middle\">TẦNG 1: KHOA HỌC MÁY TÍNH, JAVA 21, JVM, B-TREE</text>\n\
      </svg>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Quan sát kim tự tháp năng lực, bạn sẽ thấy lộ trình phát triển gồm 5 tầng
      rõ rệt. Tầng một là khoa học máy tính và Java lõi. Tầng hai là dịch vụ nhỏ và
      cơ sở dữ liệu. Tầng ba là hệ thống phân tán chịu lỗi. Tầng bốn là nghiệp vụ
      tài chính chuyên sâu. Và tầng đỉnh cao là bộ nhân công nghệ trí tuệ nhân tạo.
  - show: "<table class=\"t\">\n  <tr><th>tầng năng lực</th><th>hậu quả khi thiếu\
      \ hụt</th><th>yêu cầu chuẩn mực</th></tr>\n  <tr><td>Tầng 1 (Khoa học máy tính)</td><td>Nghẽn\
      \ bộ nhớ đệm CPU, rò rỉ bộ nhớ Heap</td><td>Nắm chắc kiến trúc máy tính và JVM</td></tr>\n\
      \  <tr><td>Tầng 3 (Hệ thống phân tán)</td><td>Trừ tiền kép, sai lệch sổ cái\
      \ hạch toán</td><td>Làm chủ mô hình SAGA và Outbox</td></tr>\n  <tr><td>Tầng\
      \ 5 (Bộ nhân công nghệ)</td><td>Bị ép lương, thiếu điểm nhấn khác biệt</td><td>Ứng\
      \ dụng AI tối ưu phân luồng hệ thống</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Các tầng năng lực có mối quan hệ phụ thuộc nhân quả chặt chẽ. Nếu thiếu nền
      tảng máy tính, bạn sẽ viết mã làm nghẽn bộ nhớ. Nếu thiếu kiến thức hệ phân
      tán, bạn sẽ làm mất mát tiền của khách hàng. Do đó người mới bắt đầu phải học
      tuần tự từng bước vững chắc.
    clear: true
- id: symbol
  kind: symbol
  title: Công thức Giá trị Kinh doanh và Tỉ lệ Thu nhập Kỳ vọng
  checks:
  - 50 * 12 == 600
  - 50 * (13 + 1) == 700
  - 50 * (13 + 4) == 850
  steps:
  - show: '<p><b>Công thức lượng hóa giá trị đóng góp của kỹ sư ngân hàng cấp cao</b>:</p>

      <div class="box key">

      $$\text{Giá trị kinh doanh: } V = B_{\text{tiet kiem}} + B_{\text{doanh thu}}
      - C_{\text{ha tang}}$$

      $$\text{Lương 12 tháng: } S_{\text{nam}} = 50 \times 12 = 600\text{ triệu
      VNĐ}$$

      $$\text{Gói năm: } T_{\text{total}} = 50 \times (13 + k) = 700 \text{ đến } 850\text{
      triệu}$$

      </div>

      <p>$k$ = số tháng thưởng, từ 1 đến 4 tuỳ xếp loại (tin tuyển dụng ACB: lương
      tháng 13 cố định + thưởng 1–4 tháng); $V$ là giá trị tạo ra, $B$ là lợi ích kinh doanh.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Để bảo vệ mức lương 50 triệu gross, ta sử dụng công thức lượng hóa giá trị
      kinh doanh. Kỹ sư cấp cao phải chứng minh giá trị mình tạo ra vượt xa chi phí
      bỏ ra. Với mức lương cứng 50 triệu, lương 12 tháng là 600 triệu đồng. Tin tuyển
      dụng của ACB ghi lương tháng 13 cố định và thưởng từ 1 đến 4 tháng tuỳ xếp loại,
      nên gói năm nằm trong khoảng 700 đến 850 triệu đồng.
  - show: "<table class=\"t\">\n  <tr><th>nguyên tắc đàm phán</th><th>hành vi sai\
      \ lầm</th><th>hành vi chuẩn mực</th></tr>\n  <tr><td>Cơ sở xác định lương</td><td>Dựa\
      \ vào nhu cầu chi tiêu cá nhân</td><td>Dựa vào giá trị giải quyết tắc nghẽn</td></tr>\n\
      \  <tr><td>Bảo vệ năng lực</td><td>Nói lý thuyết suông</td><td>Dẫn chứng kiến\
      \ trúc và số liệu thật có nguồn</td></tr>\n  <tr><td>Chương trình AI đang học</td><td>Tự\
      \ ti vì học trái ngành</td><td>Nêu nền thuật toán AI, nói đúng mốc dự kiến</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    say: Quy tắc vàng khi đàm phán lương là tuyệt đối không nói về nhu cầu chi tiêu
      cá nhân. Bạn phải định vị bản thân như một nhà giải quyết bài toán kinh doanh.
      Hãy lấy các giải pháp giảm thiểu rủi ro tài chính làm điểm tựa vững chắc để
      chốt mức thu nhập mong muốn.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Bốn bước giải bài toán chống trừ tiền kép khi chuyển khoản'
  checks:
  - 60000 // 60 == 1000
  - 120 - 60 == 60
  - 50000 > 10000
  - 60 > 30
  steps:
  - show: '<p><b>Bài toán thực tế</b>: Khách hàng nhấn chuyển khoản 20 triệu đồng
      qua App ACB, mạng 4G bị chập chờn.</p>

      <div class="step">Khách hàng nhấn nút chuyển 2 lần liên tiếp trong khoảng thời
      gian 500 mili giây.</div>

      <p>Làm thế nào để hệ thống chỉ trừ tiền duy nhất một lần và phản hồi chính xác?</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xét bài toán kinh điển trong phỏng vấn kỹ sư ngân hàng. Khách hàng thực
      hiện chuyển 20 triệu đồng nhưng mạng viễn thông chập chờn. Khách hàng mất kiên
      nhẫn và nhấn nút chuyển hai lần liên tiếp. Hệ thống phải xử lý thế nào để chỉ
      trừ tiền đúng một lần duy nhất.
  - show: '<p><b>Bước 1: Thiết lập khóa phân tán Redis bằng lệnh nguyên tử</b>:</p>

      <pre><code>// Sử dụng khóa duy nhất theo mã giao dịch của khách hàng

      SET lock:transfer:TXN_998822 1 NX EX 60</code></pre>

      <p>Yêu cầu đầu tiên chiếm được khóa thành công trong 60 giây. Yêu cầu thứ hai
      bị chặn ngay lập tức.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, cổng tích hợp sử dụng lệnh nguyên tử của Redis để tạo khóa phân
      tán theo mã giao dịch. Khóa này có hiệu lực trong 60 giây. Yêu cầu đầu tiên
      lấy được khóa sẽ đi tiếp, trong khi yêu cầu thứ hai bị chặn đứng ngay lập tức.
    clear: true
  - show: "<p><b>Bước 2: Kiểm tra bảng lịch sử giao dịch với khóa dòng bi quan</b>:</p>\n\
      <pre><code>SELECT status FROM payment_transactions \nWHERE idempotency_key =\
      \ 'KEY_123' FOR UPDATE;</code></pre>\n<p>Nếu bản ghi đã tồn tại ở trạng thái\
      \ Đang xử lý hoặc Thành công, trả về kết quả cũ ngay lập tức.</p>"
    focus:
    - 0
    - 0
    say: Bước hai, dịch vụ truy vấn bảng thanh toán trong cơ sở dữ liệu với khóa dòng
      bi quan. Nếu mã giao dịch đã tồn tại, hệ thống lập tức hoàn trả trạng thái trước
      đó cho khách hàng mà không thực hiện lệnh trừ tiền lần hai.
    clear: true
  - show: '<p><b>Bước 3: Gửi bản tin trừ tiền vào Core Banking T24 qua hàng đợi IBM
      MQ</b>:</p>

      <div class="box ok">Bản tin mang mã định danh duy nhất. Core T24 kiểm tra số
      dư và hạch toán đúng một lần.</div>

      <p><b>Bước 4: Giải phóng khóa phân tán và hoàn tất phản hồi</b>.</p>'
    focus:
    - 0
    - 0
    say: Bước ba, hệ thống gửi bản tin trừ tiền sang hệ thống ngân hàng lõi qua hàng
      đợi tin cậy với mã định danh không đổi. Sau khi có phản hồi, bước bốn sẽ giải
      phóng khóa phân tán và gửi thông báo thành công cho người dùng.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Đánh giá Năng lực Phản xạ Kiến trúc Phân tán'
  checks:
  - 4 - 1 == 3
  - 50 > 30
  steps:
