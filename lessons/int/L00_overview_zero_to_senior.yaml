    say: Lệnh in hiện kết quả ra màn hình. Dấu sao là nhân, 525600 là số phút trong một năm, mười mũ âm hai là một phần trăm, còn lệnh làm tròn giữ hai chữ số sau dấu phẩy.
  - show: '<p><b>Chạy thật bằng Python: tải tăng ×1, ×100, ×10 000</b></p><div class="code"><div>w = 0.010   # giay moi giao dich o lai he thong (so minh hoa)</div><div>for tps in (500, 50000, 5000000):</div><div>    print(tps, ''giao dich/giay -&gt;'', tps * w, ''yeu cau do cung luc'')</div><div>for chin in (2, 3, 4):</div><div>    print(chin, ''so chin:'', round(525600 * 10 ** -chin, 2), ''phut ngung/nam'')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>500 giao dich/giay -&gt; 5.0 yeu cau do cung luc</div><div>50000 giao dich/giay -&gt; 500.0 yeu cau do cung luc</div><div>5000000 giao dich/giay -&gt; 50000.0 yeu cau do cung luc</div><div>2 so chin: 5256.0 phut ngung/nam</div><div>3 so chin: 525.6 phut ngung/nam</div><div>4 so chin: 52.56 phut ngung/nam</div></div>'
    focus:
    - 2
