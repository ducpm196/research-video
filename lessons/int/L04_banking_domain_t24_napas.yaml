- id: symbol
  kind: symbol
  title: Cấu trúc Bản tin OFS và Gói tin ISO 8583 NAPAS
  checks:
  - str(50000000).zfill(12) == '000050000000'
  - len('202611070001') == 12
  steps:
  - show: |-
      <p><b>Cấu trúc bản tin hạch toán Core T24 OFS</b> (một dòng văn bản, không có dấu cách sau dấu phẩy; xuống dòng ở đây chỉ để dễ đọc):</p>
      <table class="t">
        <tr><th>viết trong bản tin</th><th>đọc là</th></tr>
        <tr><td>FUNDS.TRANSFER</td><td>tên ứng dụng của T24 lo việc chuyển tiền</td></tr>
        <tr><td>ACTP/I/PROCESS//0</td><td>nhóm tuỳ chọn, các phần cách nhau bằng dấu gạch chéo: version, chức năng, chế độ xử lý... (ví dụ minh hoạ, cần kiểm lại với hãng Temenos)</td></tr>
        <tr><td>USER123/PASS123,,</td><td>người dùng và mật khẩu minh hoạ; hai dấu phẩy liền = mã giao dịch để trống cho T24 tự sinh</td></tr>
        <tr><td>TRANSACTION.TYPE=AC, DEBIT.ACCT.NO, CREDIT.ACCT.NO, DEBIT.AMOUNT, DEBIT.CURRENCY</td><td>các cặp tên trường = giá trị: loại giao dịch (AC, ví dụ minh hoạ), tài khoản trích nợ (bị trừ tiền), tài khoản thụ hưởng (nhận tiền), số tiền, loại tiền</td></tr>
      </table>
    focus:
    - 0
    say: Đây là cấu trúc bản tin OFS dùng để hạch toán vào hệ lõi T24, gồm năm nhóm cách nhau bằng dấu phẩy.
    clear: true
  - show: |-
      <pre><code>FUNDS.TRANSFER,ACTP/I/PROCESS//0,USER123/PASS123,,
      TRANSACTION.TYPE=AC,DEBIT.ACCT.NO=12345678,
      CREDIT.ACCT.NO=87654321,DEBIT.AMOUNT=50000000,
      DEBIT.CURRENCY=VND</code></pre>
      <p>Bản tin gồm năm nhóm cách nhau bằng dấu phẩy: tên ứng dụng, tuỳ chọn, người dùng, mã giao dịch để trống, và các cặp trường giá trị hạch toán (không hard-code mật khẩu thật).</p>
    focus:
    - 0
    clear: true
    say: Bản tin khai báo tường minh tài khoản trích nợ, tài khoản thụ hưởng tức tài khoản nhận tiền, số tiền chuyển khoản là 50 triệu đồng và loại tiền tệ hạch toán.
  - show: |-
      <p><b>Bản tin MTI 0200 minh họa theo ISO 8583:1987</b> (đặc tả NAPAS 247 cần kiểm):</p>
      <pre><code>Field 0 (MTI): 0200 (Yêu cầu tài chính)
      Field 3 (Processing Code): 40xxxx (chuyển khoản giữa tài khoản; mã NAPAS cần kiểm)
      Field 4 (Amount): 000050000000 (50 000 000 VND, 12 chữ số, không phần lẻ)
      Field 7 (Transmission Date/Time): 1107103000 (thời điểm gửi gốc)
      Field 11 (STAN): 123456 (số theo dõi 6 chữ số do bên gửi đặt)
      Field 37 (RRN): 202611070001 (số tham chiếu truy hồi 12 ký tự)
      Field 41 (Terminal ID): ATM00012 (mã thiết bị)
      Field 52 (PIN Block): chỉ có ở giao dịch thẻ</code></pre>
      <p>VND không có phần lẻ (theo ISO 4217, chuẩn quốc tế đặt mã và số chữ số lẻ cho từng loại tiền), nên 50 triệu đồng là 000050000000. Khoá khử trùng = khoá ghi nhớ một giao dịch đã gửi, để chặn gửi trùng.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trong cổng chuyển mạch liên ngân hàng, gói tin theo đặc tả có gốc từ chuẩn quốc tế, với các trường dữ liệu được đánh số. Trường số tiền dài 12 chữ số, và vì đồng Việt Nam không có phần lẻ nên 50 triệu đồng viết là bốn số 0, rồi 50, rồi sáu số 0. Số theo dõi STAN và số tham chiếu RRN mười hai ký tự là căn cứ chính để tra cứu và đối soát giao dịch giữa các ngân hàng thành viên. Trường bảy là thời điểm gửi gốc, còn trường bốn mươi mốt là mã thiết bị, hai trường này dùng để dựng khoá khử trùng ở phần sau.
    introduces:
    - int_stan
    clear: true
- id: chaythat
  kind: example
  title: 'Chạy thật: dựng bản đồ bit ISO 8583 và khối PIN định dạng 0'
  checks:
  - sum(1 << (64 - b) for b in (3, 4, 11, 37, 52)) == 0x3020000008001000
  steps:
  - show: |-
      <p><b>Đọc trước mã Python sắp chạy</b> (Python là ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>bit = [3, 4, 11, 37, 52]</td><td>đặt tên bit cho một danh sách (ngoặc vuông): các số trường có mặt trong bản tin</td></tr>
        <tr><td>bm = sum(1 &lt;&lt; (64 - b) for b in bit)</td><td>1 &lt;&lt; (64 - b): viết số 1 rồi dịch sang trái (64 - b) bước, bật đúng bit thứ b tính từ bên trái trong dãy 64 bit; sum(... for b in bit): cộng kết quả của từng trường b</td></tr>
        <tr><td>print(f"{bm:016X}")</td><td>print = in ra màn hình; f"..." là chuỗi chèn giá trị trong ngoặc nhọn; :016X = hệ mười sáu, đủ 16 chữ số, chữ in hoa</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3']
    - '2.4'
    clear: true
    say: Trước khi chạy, ta đọc mã Python từng dòng. Danh sách trong ngoặc vuông là các trường có mặt, và dịch số một sang trái là cách bật đúng một bit trong dãy sáu mươi tư bit. Lệnh in hiện kết quả ra màn hình, với phần định dạng đổi số sang hệ mười sáu đủ mười sáu chữ số.
  - show: |-
      <p><b>Đọc tiếp</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>pin = int("041234FFFFFFFFFF", 16)</td><td>int("...", 16) = đọc chuỗi như số hệ mười sáu; pin là tên cho trường PIN</td></tr>
        <tr><td>pan = int("0000" + "4321987654321098"[-13:-1], 16)</td><td>pan là tên cho trường số thẻ; dấu + nối chuỗi; [-13:-1] cắt chuỗi, lấy 12 chữ số trước chữ số cuối</td></tr>
        <tr><td>pin ^ pan</td><td>phép hoặc loại trừ (XOR) từng bit của hai số</td></tr>
      </table>
    focus:
    - ['2.2', '2.3']
    - ['2.3', '2.4']
    clear: true
    say: Hai dòng sau đọc trường PIN và trường số thẻ như số hệ mười sáu. Ngoặc vuông với số âm lấy mười hai chữ số trước chữ số kiểm tra, và dấu mũ là phép hoặc loại trừ.
  - show: '<p><b>Chạy thật bằng Python: bản đồ bit và khối PIN</b></p><div class="code"><div>bit = [3, 4, 11, 37, 52]</div><div>bm = sum(1 &lt;&lt; (64 - b) for b in bit)</div><div>print(f"{bm:016X}")</div><div>pin = int("041234FFFFFFFFFF", 16)</div><div>pan = int("0000" + "4321987654321098"[-13:-1], 16)</div><div>print(f"{pin ^ pan:016X}")</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>3020000008001000</div><div>04122D789ABCDEF6</div></div><p class="note">Số thẻ và PIN là dữ liệu minh hoạ, không phải thẻ thật.</p>'
    focus:
    - 2
    - 4
    - 4
    - 5
    clear: true
    say: Đây là mã Python chạy thật, dựng lại hai con số ta đã tính tay ở phần ôn nền. Với các trường 3, 4, 11, 37 và 52, mỗi trường bật một bit đếm từ bên trái, và kết quả là chuỗi mười sáu chữ số hệ mười sáu, đúng bằng bản đồ bit ta tính tay. Với khối PIN, ta lấy phép hoặc loại trừ giữa trường PIN và trường số thẻ, và được đúng khối PIN rõ đã tính tay. Dữ liệu ở đây là số thẻ và PIN minh hoạ, không phải thẻ thật.
- id: quymo
  kind: example
  title: 'Khi tải tăng: số theo dõi STAN quay vòng và số tin đang chờ phình ra'
  checks:
  - 10**6 // 100 == 10000
  - 10**6 // 1000 == 1000
  - 10**6 // 10000 == 100
  - 1000 * 2 == 2000
  - 10000 * 2 / 1000 == 20.0
  - 10**6 / 100 / 3600 < 3
  - 1000 / 60 < 17
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>for tps in (100, 1000, 10000):</td><td>thử lần lượt ba mức giao dịch mỗi giây; các dòng thụt vào là phần được lặp</td></tr>
        <tr><td>10**6 / tps</td><td>10**6 là 10 mũ 6 = một triệu giá trị STAN; chia cho tốc độ để ra số giây quay hết một vòng</td></tr>
        <tr><td># ...</td><td>từ dấu # tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>cho = tps * 2</td><td>số tin đang chờ = tốc độ nhân 2 giây chờ mỗi tin</td></tr>
        <tr><td>print(...)</td><td>in các phần trong ngoặc ra màn hình, cách nhau một dấu cách</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3']
    - ['2.3', '2.4']
    - ['2.5', '2.6']
    clear: true
    say: Trước khi chạy, ta đọc mã từng dòng. Dòng lặp thử ba mức tốc độ, và mười mũ sáu là một triệu giá trị của số theo dõi. Chia cho tốc độ ta được số giây quay hết một vòng, và dấu thăng mở đầu ghi chú. Số tin đang chờ bằng tốc độ nhân hai giây, rồi lệnh in hiện kết quả.
  - show: |
      <p><b>Chạy thật bằng Python: số giao dịch mỗi giây tăng ×1, ×10, ×100</b> (số minh hoạ: mỗi tin chờ phản hồi 2 giây, mỗi luồng giữ 1 megabyte ngăn xếp, khoá khử trùng sống 300 giây)</p><div class="code"><div>for tps in (100, 1000, 10000):</div><div>    quay = 10**6 / tps   # giay de dung het mot vong STAN</div><div>    cho = tps * 2        # tin dang cho, moi tin cho 2 giay</div><div>    print(tps, 'gd/s: STAN quay sau', quay, 's;', cho, 'tin cho;',</div><div>          cho / 1000, 'GB neu giu luong')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>100 gd/s: STAN quay sau 10000.0 s; 200 tin cho; 0.2 GB neu giu luong</div><div>1000 gd/s: STAN quay sau 1000.0 s; 2000 tin cho; 2.0 GB neu giu luong</div><div>10000 gd/s: STAN quay sau 100.0 s; 20000 tin cho; 20.0 GB neu giu luong</div></div>
    focus:
    - 2
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, với số minh hoạ là mỗi tin chờ phản hồi hai giây, và mỗi luồng giữ khoảng một megabyte vùng nhớ ngăn xếp riêng. Số theo dõi STAN chỉ có sáu chữ số, nên chỉ có một triệu giá trị và sẽ quay vòng, ở một trăm giao dịch mỗi giây là gần ba giờ mới quay lại. Ở một nghìn giao dịch mỗi giây chỉ còn một nghìn giây, và ở mười nghìn giao dịch mỗi giây chỉ còn một trăm giây. Cùng lúc đó, số tin đang chờ phản hồi tăng từ hai trăm lên hai mươi nghìn, nên nếu mỗi tin giữ một luồng thì cần hai mươi gigabyte ngăn xếp.
  - show: |
      <table class="t">
        <tr><th>giao dịch mỗi giây</th><th>STAN quay lại sau</th><th>tin đang chờ</th><th>điều gì gãy, cách xử lý</th></tr>
        <tr><td>100 (×1)</td><td>10 000 giây, gần 3 giờ</td><td>200 (0,2 GB nếu giữ luồng)</td><td>mỗi tin chờ giữ một luồng đứng chờ (bể luồng chặn) vẫn gánh được</td></tr>
        <tr><td>1 000 (×10)</td><td>1 000 giây, khoảng 17 phút</td><td>2 000 (2 GB)</td><td>khoá 300 giây hết hạn trước nên chưa chặn nhầm; nhưng khoá sống lâu hơn 17 phút mà chỉ có STAN thì chặn nhầm giao dịch mới trùng số</td></tr>
        <tr><td>10 000 (×100)</td><td>100 giây</td><td>20 000 (20 GB)</td><td>STAN quay nhanh hơn khoá 300 giây: khoá thêm RRN, mã thiết bị, thời điểm; bỏ chặn luồng, giữ tin chờ bằng bảng tra theo mã tương quan</td></tr>
      </table>
      <p>Đánh đổi: khoá nhiều thành phần tốn bộ nhớ hơn, và mô hình bất đồng bộ cần thêm bảng tin chờ.</p>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Bảng này cho thấy điều gì gãy khi tải tăng lên. Ở một trăm giao dịch mỗi giây, STAN quay lại sau gần ba giờ, và hai trăm tin chờ thì cách cho mỗi tin giữ một luồng đứng chờ vẫn gánh được. Ở một nghìn, STAN quay lại sau khoảng mười bảy phút, nên khoá ba trăm giây chưa chặn nhầm, nhưng khoá sống lâu hơn mười bảy phút mà chỉ có STAN thì sẽ chặn nhầm. Ở mười nghìn, STAN quay lại sau một trăm giây, ngắn hơn khoá ba trăm giây, nên khoá phải thêm số tham chiếu, mã thiết bị và thời điểm. Đánh đổi là khoá nhiều thành phần tốn bộ nhớ hơn.
- id: check
  kind: check
  title: 'Tự Kiểm tra: Xử lý Bản tin Mã lỗi 68 Nghi vấn từ NAPAS'
  checks:
  - 1014 - 1000 == 14
  - 68 > 0
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn Senior</b>: Khi gửi lệnh chuyển khoản 50 triệu qua NAPAS 247 mà cổng trả về mã phản hồi 68 (theo cách gọi phổ biến: giao dịch nghi vấn do ngân hàng thụ hưởng, tức ngân hàng của người nhận, chưa trả lời kịp; đặc tả NAPAS cần kiểm), hệ thống xử lý ra sao?</p>
      <ul>
        <li>(A) Hoàn tiền ngay lập tức vào tài khoản người gửi.</li>
        <li>(B) Trừ tiền lần thứ hai và gửi lại gói tin.</li>
        <li>(C) Giữ nguyên trạng thái Chờ đối soát (In-doubt), không tự ý hoàn tiền hay trừ tiền kép, và tự động truy vấn hoặc tra soát trạng thái theo quy trình của NAPAS (lưu ý: 0400 là yêu cầu đảo, 0420 là thông báo đảo; ở luồng chuyển khoản 247 chỉ đảo khi đã biết chắc thất bại (cần kiểm đặc tả), ở giao dịch thẻ đảo khi hết giờ chờ là thông lệ).</li>
      </ul>
      <p>Tra soát = gửi yêu cầu hỏi lại trạng thái thật của giao dịch tới NAPAS hoặc ngân hàng nhận. Mã 68 trong chuẩn ISO 8583 gốc nghĩa là phản hồi về quá muộn; cách NAPAS gán nghĩa cho mã này cần kiểm đặc tả hiện hành.</p>
    focus:
    - 0
    - 0
    - 0
    say: Tra soát nghĩa là gửi yêu cầu hỏi lại trạng thái thật của giao dịch tới NAPAS hoặc ngân hàng nhận. Mời bạn trả lời tình huống xử lý mã lỗi nhạy cảm của cổng chuyển mạch. Khi phía chuyển mạch phản hồi mã sáu mươi tám báo hiệu giao dịch nghi vấn, kỹ sư tích hợp cấp cao sẽ điều khiển luồng tiền như thế nào.
    pause: 20
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn (C)</b></p>
      <div class="box key">Giải thích vì: theo cách gọi phổ biến, mã 68 cho thấy ngân hàng thụ hưởng có thể đã cộng tiền cho người nhận nhưng chưa kịp phản hồi (đặc tả NAPAS cần kiểm). Nếu vội hoàn tiền cho người gửi, ngân hàng có thể bị thất thoát tài chính. Nên ta treo trạng thái và phát lệnh tra soát tự động; trong luồng chuyển khoản này chỉ đảo giao dịch khi đã biết chắc nó thất bại (cần kiểm đặc tả), còn với giao dịch thẻ, đảo khi hết giờ chờ là thông lệ.</div>
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn C vì mã nghi vấn, theo cách gọi phổ biến, cho thấy người nhận có thể đã được cộng tiền, còn đặc tả của NAPAS thì cần kiểm. Hoàn tiền vội có thể làm ngân hàng mất vốn, nên ta giữ trạng thái chờ và tra soát tự động. Trong luồng chuyển khoản này chỉ đảo khi đã biết chắc giao dịch thất bại, còn với giao dịch thẻ, đảo khi hết giờ chờ là thông lệ, và đặc tả vẫn cần kiểm.
    clear: true
- id: pitfall
  kind: pitfall
  title: 'Bẫy Nguy hiểm: Tin tưởng Tuyệt đối vào Mạng Viễn thông'
  steps:
  - show: |-
      <div class="box pit">Sai lầm nghiêm trọng khi tích hợp cổng thanh toán liên ngân hàng:</div>
      <table class="t" style="margin-top: 10px;">
        <tr><th>sai lầm sơ cấp</th><th>hiểm họa tài chính</th><th>giải pháp chuẩn Senior</th></tr>
        <tr><td>Cộng tiền khi nhận gói tin không xác thực</td><td>Bị tấn công làm giả gói tin chuyển tiền</td><td>Luôn kiểm tra mã xác thực toàn vẹn MAC (trường 64 hoặc 128)</td></tr>
        <tr><td>Bỏ qua kiểm tra trùng lặp khoá phân tán</td><td>Khách hàng quẹt thẻ một lần bị trừ nợ hai lần</td><td>Khoá khử trùng đặt ở một kho chung, theo STAN và RRN, kèm mã thiết bị và thời điểm gửi gốc (trường 7, giữ nguyên khi gửi lại); STAN chỉ 6 chữ số nên quay vòng</td></tr>
      </table>
      <p>MAC (mã xác thực thông điệp) = mã tính từ nội dung bản tin và một khoá bí mật hai bên cùng giữ; sửa một ký tự là MAC sai. Khác hàm băm thường ở chỗ kẻ gian không có khoá thì không tính lại được (hàm băm thường: phép tính ra một mã ngắn từ nội dung mà ai cũng tính được).</p>
    focus:
    - 0
    - 0
    - 0
    say: Một sai lầm nguy hiểm là việc cộng tiền khi chưa xác thực mã kiểm tra toàn vẹn MAC của gói tin. MAC là mã tính từ nội dung bản tin và một khoá bí mật hai bên cùng giữ. Khác với hàm băm thường, là phép tính mã ngắn mà ai cũng làm được, kẻ gian không có khoá thì không tính lại được mã này, nên sửa một ký tự là bị phát hiện.
  - show: |-
      <div class="box pit">Sai lầm thứ hai: bỏ qua kiểm tra trùng lặp, khách quẹt thẻ một lần bị trừ hai lần.</div>
      <p>Khoá nguyên tử = thao tác “đặt khoá nếu chưa có” làm trong một bước, nên hai máy chủ không thể cùng đặt thành công; khoá phân tán = khoá mà nhiều máy chủ cùng nhìn thấy, đặt ở một kho chung như Redis (kho dữ liệu dạng khoá và giá trị, chạy trong bộ nhớ nên rất nhanh, nhiều máy chủ cùng đọc ghi). Thời điểm trong khoá là thời điểm gốc của bản tin (trường 7), giữ nguyên khi gửi lại; sinh lại mỗi lần gửi thì khoá đổi và không khử được trùng.</p>
    clear: true
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Sai lầm thứ hai là bỏ qua kiểm tra trùng lặp. Kỹ sư đặt khoá khử trùng gồm số theo dõi, số tham chiếu, mã thiết bị và thời điểm gửi gốc của bản tin, giữ nguyên khi gửi lại. Khoá nằm ở một kho chung mà mọi máy chủ cùng thấy, ví dụ Redis, một kho khoá và giá trị chạy trong bộ nhớ, nên gọi là khoá phân tán. Thao tác đặt khoá nếu chưa có làm trong một bước nguyên tử, nên hai máy chủ không thể cùng đặt thành công.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: chọn khoá khử trùng lặp cho cổng mười nghìn giao dịch mỗi giây'
  checks:
  - 10**6 // 10000 == 100
  - 100 < 300
  steps:
  - show: |-
      <p><b>Câu hỏi chọn A hay B, vì sao</b>: cổng nhận <b>10 000</b> giao dịch mỗi giây, dùng khoá khử trùng lặp sống <b>300</b> giây (số minh hoạ). Nên đặt khoá theo những thông tin nào để chặn gửi trùng mà không chặn nhầm giao dịch mới?</p>
      <ul>
        <li><b>A</b>: chỉ STAN, vì nó đã là số theo dõi của bản tin.</li>
        <li><b>B</b>: STAN cùng số tham chiếu RRN, mã thiết bị và thời điểm gửi gốc (trường 7, không đổi khi gửi lại).</li>
        <li><b>C</b>: chỉ thời điểm gửi tính đến từng giây.</li>
        <li><b>D</b>: không dùng khoá, vì mạng không bao giờ gửi trùng.</li>
      </ul>
    focus:
    - 0
    say: Xin mời bạn chọn cách đặt khoá khử trùng lặp cho cổng có mười nghìn giao dịch mỗi giây.
    pause: 20
  - show: |-
      <div class="box key"><b>Đáp án chính xác là B</b>!</div>
      <p><b>Vì sao A sai</b>: STAN chỉ có một triệu giá trị. Ở 10 000 giao dịch mỗi giây, nó quay lại sau 1 000 000 ÷ 10 000 = 100 giây, ngắn hơn khoá 300 giây. Một giao dịch mới trùng STAN với giao dịch cũ sẽ bị chặn nhầm.</p>
      <p>Lưu ý ở B: thời điểm phải là thời điểm gốc của bản tin, giữ nguyên khi gửi lại; nếu sinh lại mỗi lần gửi thì khoá đổi theo và không chặn được trùng.</p>
    focus:
    - 1
    - 2
    - 2
    - 0
    clear: true
    say: Đáp án chính xác là B. Phương án A sai vì STAN chỉ có một triệu giá trị, nên ở mười nghìn giao dịch mỗi giây nó quay lại sau một trăm giây. Khoảng đó ngắn hơn khoá ba trăm giây, nên một giao dịch mới trùng STAN với giao dịch cũ sẽ bị chặn nhầm. Ở phương án B, thời điểm phải là thời điểm gốc của bản tin, giữ nguyên khi gửi lại, nếu không khoá đổi theo mỗi lần gửi.
  - show: |-
      <table class="t">
        <tr><th>phương án</th><th>vì sao không chọn</th></tr>
        <tr><td>C: chỉ thời điểm</td><td>10 000 giao dịch cùng rơi vào một giây, nên khoá giống hệt nhau và bị chặn nhầm gần hết</td></tr>
        <tr><td>D: không khoá</td><td>khi hết giờ chờ, bên gửi thử lại; không có khoá thì lệnh chạy hai lần và trừ tiền hai lần</td></tr>
      </table>
      <p>Còn lại một rủi ro: khoá hết hạn trong lúc hệ lõi còn chậm. Vì thế lớp chặn cuối vẫn phải là ràng buộc duy nhất (UNIQUE) ở cơ sở dữ liệu của hệ lõi: cột mã giao dịch không cho phép hai hàng cùng giá trị, hàng thứ hai bị cơ sở dữ liệu từ chối.</p>
    focus:
    - '1.2'
    - '1.3'
    - 2
    - 0
    clear: true
    say: Phương án C sai vì mười nghìn giao dịch cùng rơi vào một giây có khoá giống hệt nhau, nên bị chặn nhầm gần hết. Phương án D sai vì khi hết giờ chờ bên gửi sẽ thử lại, nên không có khoá thì lệnh chạy hai lần. Khoá chỉ là lớp chặn sớm. Lớp chặn cuối là ràng buộc duy nhất ở cơ sở dữ liệu của hệ lõi, tức là cột mã giao dịch không cho phép hai hàng cùng giá trị, nên hàng trùng bị từ chối.
- id: practice
  kind: practice
  title: 'Tự làm: câu phỏng vấn có số về bản đồ bit, khối PIN, vòng quay STAN'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi bốn ý nhỏ: (1) bản tin ISO 8583 chỉ có các trường <b>3, 7, 11, 41</b> thì bản đồ bit 64 bit viết ở hệ mười sáu là gì; (2) khối PIN định dạng 0 với PIN <b>5821</b> và số thẻ <b>5412345678901234</b>; (3) một bên gửi <b>4 000</b> giao dịch mỗi giây thì STAN quay lại sau bao lâu, và khoá khử trùng chỉ có STAN sống <b>300</b> giây có chặn nhầm không; (4) mỗi tin chờ phản hồi <b>1,5</b> giây thì cùng lúc có bao nhiêu tin đang chờ.</p>
      <p class="note">Định dạng năm dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 1
    - 1
    pause: 240
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Viết bản đồ bit của bản tin có các trường 3, 7, 11 và 41, rồi dựng khối PIN từ PIN năm tám hai một và số thẻ trên màn hình. Tiếp theo tính sau bao lâu STAN quay lại khi mỗi giây có bốn nghìn giao dịch, và có chặn nhầm hay không. Cuối cùng tính số tin đang chờ, và hãy dừng video tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>bitmap: 2220000000800000</div><div>khoi PIN: 045802BA9876FEDC</div><div>STAN quay vong sau: 250 giay</div><div>chan nham: co</div><div>tin dang cho: 6000</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L04/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> bit k nằm ở nhóm 8 bit thứ (k chia 8, làm tròn lên); trong nhóm, bit thứ nhất ứng với 80, thứ hai 40, thứ ba 20, thứ tư 10, thứ năm 08, thứ sáu 04, thứ bảy 02, thứ tám 01 (hệ mười sáu). Khối PIN: trường PIN = <code>0</code> + độ dài + PIN + đệm F cho đủ 16 chữ số; trường số thẻ = <code>0000</code> + 12 chữ số bên phải của số thẻ sau khi bỏ chữ số cuối; rồi XOR từng chữ số hệ mười sáu. STAN quay lại sau 1 000 000 chia số giao dịch mỗi giây; khoá bị chặn nhầm khi thời gian đó ngắn hơn thời gian sống của khoá. Số tin đang chờ = giao dịch mỗi giây × số giây chờ.
      Lời giải đầy đủ ở <code>labs/INT/L04/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, mỗi nhóm tám bit cho một cặp chữ số hệ mười sáu, và trong nhóm, bit đầu ứng với tám mươi, bit thứ ba ứng với hai mươi. Khối PIN là phép hoặc loại trừ giữa trường PIN đã đệm F và trường số thẻ bốn số không cộng mười hai chữ số. STAN quay lại sau một triệu chia số giao dịch mỗi giây, và bị chặn nhầm khi thời gian đó ngắn hơn thời gian sống của khoá. Số tin đang chờ bằng số giao dịch mỗi giây nhân số giây chờ.
