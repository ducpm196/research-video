  - {sentence: "Ở ngân hàng, một lệnh của HSM dịch khối PIN từ khoá của máy đầu cuối sang khoá vùng dùng với NAPAS, và một lệnh khác dịch giữa hai khoá vùng.", reason: "ASR chép “Ở ngân hàng, một lệnh của HSM dịch khối pin từ khóa của máy đầu cuối sang khóa vùng dùng với NAPAC và một lệnh khác dịch giữa hai khóa vùng.” (0.968): “napas” đọc theo luật lexicon (lexicon_vi.INT.yaml: “Na-pát”), ASR viết “napac” — NOT_VERIFIED bằng tai người"}
