- id: prereq
  kind: prereq
  title: 'Trước hết: OFS, MTI, bản đồ bit, khối PIN và HSM'
  checks:
  - 8000 * 60 == 480000
  - sum(1 << (64 - b) for b in (3, 4, 11, 37, 52)) == 0x3020000008001000
  - format(int('041234FFFFFFFFFF', 16) ^ int('0000' + '4321987654321098'[-13:-1], 16), '016X') == '04122D789ABCDEF6'
  - '''4321987654321098''[-13:-1] == ''198765432109'''
  steps:
  - show: |-
      <p><b>Ba khái niệm then chốt trong hạ tầng thanh toán ngân hàng</b>:</p>
      <table class="t">
        <tr><th>khái niệm</th><th>định nghĩa bằng lời thường</th><th>vai trò trong giao dịch</th></tr>
        <tr><td>Temenos T24 OFS</td><td>OFS (Open Financial Service): bản tin dạng chữ, các nhóm cách nhau bằng dấu phẩy, để hệ thống khác ra lệnh cho hệ lõi T24</td><td>Hạch toán tài khoản tiền gửi, tiền vay và hạn mức</td></tr>
        <tr><td>NAPAS 247, ISO 8583</td><td>ISO 8583: chuẩn quốc tế cho bản tin giao dịch thẻ; đặc tả NAPAS thường được mô tả có gốc từ chuẩn này</td><td>Định tuyến lệnh chuyển tiền liên ngân hàng tức thời</td></tr>
        <tr><td>Thiết bị HSM</td><td>Thiết bị phần cứng chống can thiệp, giữ khoá mật mã và làm phép mã hoá bên trong</td><td>PIN chỉ được dịch từ khoá này sang khoá khác bên trong HSM, không bao giờ ra ngoài ở dạng rõ</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu ba khái niệm then chốt trong thanh toán ngân hàng. Bản tin OFS là bản tin dạng chữ, các nhóm cách nhau bằng dấu phẩy, để hệ thống khác ra lệnh cho hệ lõi T24. ISO 8583 là chuẩn quốc tế cho bản tin giao dịch thẻ, và đặc tả của NAPAS thường được mô tả có gốc từ chuẩn này. HSM là thiết bị phần cứng chống can thiệp giữ khoá mật mã, và mã pin chỉ được dịch từ khoá này sang khoá khác bên trong thiết bị, không bao giờ lộ dạng rõ ra ngoài.
    introduces:
    - int_hsm
  - show: |-
      <p><b>MTI và bản đồ bit (bitmap) của bản tin ISO 8583</b></p>
      <ul>
        <li><b>MTI</b> = 4 chữ số đầu bản tin cho biết loại: chữ số 1 là phiên bản (0 = bản 1987), chữ số 2 là lớp (2 = tài chính, 4 = đảo giao dịch, tức gửi lệnh huỷ tác dụng của giao dịch đã gửi trước đó), chữ số 3 là chức năng (0 yêu cầu, 1 phản hồi, 2 thông báo), chữ số 4 là nguồn gửi.</li>
        <li>Ví dụ: 0200 yêu cầu tài chính, 0210 phản hồi, 0400 yêu cầu đảo, <b>0420 thông báo đảo (reversal advice)</b>.</li>
        <li><b>Bit</b> = một chữ số nhị phân, chỉ là 0 hoặc 1; bit thứ k = bit ở vị trí k, đếm từ trái sang; 4 bit liền nhau tương ứng đúng một chữ số hệ mười sáu.</li>
        <li><b>Bitmap</b> = 64 bit sau MTI; bit thứ k bằng 1 nghĩa là bản tin có trường k. Bit 1 bằng 1 nghĩa là còn bitmap thứ hai cho trường 65–128.</li>
      </ul>
    focus:
    - '2.1'
    - ['2.3', '2.4']
    clear: true
    introduces:
    - int_hex
    say: MTI là bốn chữ số đầu bản tin cho biết loại bản tin, ví dụ 0200 là yêu cầu tài chính, 0210 là phản hồi, 0400 là yêu cầu đảo, còn 0420 là thông báo đảo giao dịch. Bit là một chữ số nhị phân, chỉ bằng không hoặc một, và bản đồ bit gồm 64 bit ngay sau MTI, bit thứ k bằng 1 nghĩa là bản tin có trường thứ k.
  - show: |-
      <p><b>Hệ mười sáu và ví dụ bản đồ bit</b></p>
      <ul>
        <li><b>Hệ mười sáu (hex)</b> = cách viết số có 16 ký hiệu: 0–9 rồi A–F (A = 10, B = 11, …, F = 15); một chữ số hệ mười sáu thay cho đúng 4 bit: 0011 → 3, 0000 → 0, 1111 → F, nên 8 bit 0011 0000 viết là 30.</li>
        <li>Bản tin chỉ có trường 3, 4, 11, 37, 52: byte (nhóm 8 bit) 1 (bit 1–8) bật bit 3, 4 → 0011 0000 = <code>30</code>; byte 2 bật bit 11 → <code>20</code>; byte 5 bật bit 37 → <code>08</code>; byte 7 bật bit 52 → <code>10</code>. Bitmap = <code>3020000008001000</code>.</li>
      </ul>
    focus:
    - '2.1'
    - '2.2'
    - '2.2'
    - '2.2'
    introduces:
    - int_hex
    say: Hệ mười sáu là cách viết số với mười sáu ký hiệu, từ không đến chín rồi A đến F cho mười đến mười lăm, và mỗi chữ số thay cho đúng bốn bit. Với bản tin chỉ có các trường 3, 4, 11, 37 và 52, nhóm tám bit đầu, tức byte một, bật bit 3 và 4, tức không không một một không không không không, là 30. Nhóm thứ hai bật bit 11 nên là 20. Nhóm thứ năm bật bit 37 nên là 08, nhóm thứ bảy bật bit 52 nên là 10, còn lại bằng 0.
    clear: true
  - show: |-
      <p><b>Lưới bản đồ bit</b> cho bản tin có các trường 3, 4, 11, 37, 52: mỗi hàng là một nhóm tám bit, số trong ô là số thứ tự của bit.</p>
