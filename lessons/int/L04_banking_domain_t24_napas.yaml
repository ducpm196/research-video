scenes:
- id: hook
  kind: hook
  title: Vòng đời Bản tin Chuyển tiền Liên ngân hàng NAPAS 247
  steps:
  - show: '<p>Khi khách hàng bấm nút chuyển tiền nhanh 247 trên một ứng dụng ngân hàng
      số, gói tin di chuyển qua những trạm kiểm soát nào?</p>

      <div class="box key">Trong vài giây, hệ thống phải trích nợ trên core banking
      (hệ thống ngân hàng lõi giữ sổ cái), đóng gói bản tin theo đặc tả của NAPAS
      (công ty chuyển mạch tiền giữa các ngân hàng Việt Nam) gửi qua cổng chuyển mạch,
      với giao dịch thẻ thì dịch khối PIN trong HSM, rồi đối soát cuối ngày. Làm sao
      làm chủ trọn vẹn?</div>

      <p>Bài dùng Temenos T24 làm ví dụ hệ lõi (ứng viên đã tích hợp với T24 ở OCB).
      Tin tuyển dụng ACB không nói ACB dùng hệ lõi nào, nên đừng khẳng định điều đó
      khi phỏng vấn.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, một lệnh chuyển tiền nhanh liên ngân hàng diễn ra chỉ trong vài
      giây nhưng phải đi qua hàng loạt chốt kiểm soát an ninh nghiêm ngặt. Hệ thống
      phải hạch toán sổ cái ngân hàng lõi, rồi đóng gói bản tin gửi NAPAS, công ty chuyển mạch tiền giữa các ngân hàng.
      Với giao dịch thẻ, hệ thống còn phải bảo vệ khối mã pin bằng phần cứng chuyên dụng. Bài này dùng hệ lõi T24 của hãng Temenos làm ví dụ. Tin tuyển dụng của ACB không nói ACB dùng hệ lõi nào, nên bạn đừng khẳng định điều đó khi phỏng vấn. Hôm nay, ta cùng nhau khám
      phá bức tranh nghiệp vụ ngân hàng toàn diện.
  - show: "<table class=\"t\">\n  <tr><th>trụ cột nghiệp vụ</th><th>tiêu chuẩn kỹ\
      \ thuật lõi</th><th>phân hệ tích hợp</th></tr>\n  <tr><td>Ngân hàng lõi Temenos\
      \ T24</td><td>Bản tin OFS (chuỗi văn bản) qua hàng đợi IBM MQ bất đồng bộ</td><td>Bộ điều\
      \ hợp chuyển đổi dữ liệu và hạch toán sổ cái</td></tr>\n  <tr><td>Chuyển mạch\
      \ NAPAS 247</td><td>Đặc tả riêng của NAPAS, thường mô tả có gốc ISO 8583, qua kết nối TCP (giao thức mạng giữ một đường nối hai chiều, bảo đảm dữ liệu tới đủ và đúng thứ tự)\
      \ (cần kiểm đặc tả hiện hành)</td><td>Cổng\
      \ thanh toán liên ngân hàng và dịch mã PIN trong HSM</td></tr>\n  <tr><td>Tín dụng số\
      \ Squad Lending (nhóm sản phẩm cho vay số)</td><td>Phong tỏa sổ cái hai pha, cấp thấu chi và cổng CIC</td><td>Hệ\
      \ thống quản lý khoản vay và ký số đám mây</td></tr>\n</table>\n<p>Hôm nay,\
      \ ta làm chủ: <b>Tích hợp Core T24</b>, <b>chuyển mạch NAPAS 247</b>, và <b>sáu\
      \ trụ cột tín dụng bán lẻ</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba trụ cột nghiệp vụ cốt lõi của ngân hàng
      thương mại. Ta tìm hiểu cách ra lệnh cho hệ lõi T24 bằng bản tin OFS, một định
      dạng chữ riêng của hãng Temenos. Ta nắm vững bản tin chuyển mạch theo đặc tả
      riêng của NAPAS, thường được mô tả có gốc từ chuẩn quốc tế ISO 8583. Ta cũng
      làm chủ toàn bộ hệ sinh thái tín dụng bán lẻ tốc độ cao.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: OFS, MTI, bản đồ bit, khối PIN và HSM'
  checks:
  - 8000 * 60 == 480000
  - 1500 - 120 == 1380
  - sum(1 << (64 - b) for b in (3, 4, 11, 37, 52)) == 0x3020000008001000
  - format(int('041234FFFFFFFFFF', 16) ^ int('0000' + '4321987654321098'[-13:-1], 16), '016X') == '04122D789ABCDEF6'
  - "'4321987654321098'[-13:-1] == '198765432109'"
  steps:
  - show: "<p><b>Ba khái niệm then chốt trong hạ tầng thanh toán ngân hàng</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>định nghĩa bằng lời thường</th><th>vai\
      \ trò trong giao dịch</th></tr>\n  <tr><td>Temenos T24 OFS</td><td>OFS (Open Financial\
      \ Service): bản tin dạng chữ, các phần cách nhau bằng dấu phẩy, để hệ thống khác ra lệnh cho hệ lõi T24</td><td>Hạch toán tài\
      \ khoản tiền gửi, tiền vay và hạn mức</td></tr>\n  <tr><td>NAPAS 247, ISO 8583</td><td>ISO 8583:\
      \ chuẩn quốc tế cho bản tin giao dịch thẻ; đặc tả NAPAS thường được mô tả có gốc từ chuẩn này</td><td>Định tuyến lệnh\
      \ chuyển tiền liên ngân hàng tức thời</td></tr>\n  <tr><td>Thiết bị HSM</td><td>Thiết bị\
      \ phần cứng chống can thiệp, giữ khóa mật mã và làm phép mã hoá bên trong</td><td>PIN chỉ được\
      \ dịch từ khóa này sang khóa khác bên trong HSM, không bao giờ ra ngoài ở dạng rõ</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu ba khái niệm then chốt trong thanh toán ngân hàng. Bản
      tin OFS là bản tin dạng chữ, các phần cách nhau bằng dấu phẩy, để hệ thống khác ra lệnh cho hệ lõi T24. ISO 8583 là chuẩn quốc tế cho bản tin giao dịch thẻ, và đặc tả của NAPAS thường được mô tả có gốc từ chuẩn này.
      HSM là thiết bị phần cứng chống can thiệp giữ khóa mật mã, và mã pin chỉ được dịch từ khóa này sang khóa khác bên trong thiết bị, không bao giờ lộ dạng rõ ra ngoài.
  - show: |-
      <p><b>MTI và bản đồ bit (bitmap) của bản tin ISO 8583</b></p>
      <ul>
        <li><b>MTI</b> = 4 chữ số đầu bản tin cho biết loại: chữ số 1 là phiên bản (0 = bản 1987), chữ số 2 là lớp (2 = tài chính, 4 = đảo giao dịch), chữ số 3 là chức năng (0 yêu cầu, 1 phản hồi, 2 thông báo), chữ số 4 là nguồn gửi.</li>
        <li>Ví dụ: 0200 yêu cầu tài chính, 0210 phản hồi, 0400 yêu cầu đảo, <b>0420 thông báo đảo (reversal advice)</b>.</li>
        <li><b>Bitmap</b> = 64 bit sau MTI; bit thứ k bằng 1 nghĩa là bản tin có trường k. Bit 1 bằng 1 nghĩa là còn bitmap thứ hai cho trường 65–128.</li>
        <li>Bản tin chỉ có trường 3, 4, 11, 37, 52: byte 1 (bit 1–8) bật bit 3, 4 → 0011 0000 = <code>30</code>; byte 2 bật bit 11 → <code>20</code>; byte 5 bật bit 37 → <code>08</code>; byte 7 bật bit 52 → <code>10</code>. Bitmap = <code>3020000008001000</code>.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: MTI là bốn chữ số đầu bản tin cho biết loại bản tin, ví dụ 0200 là yêu cầu tài chính, 0210 là phản hồi, 0400 là yêu cầu đảo, còn 0420 là thông báo đảo giao dịch.
      Ngay sau MTI là bản đồ bit gồm 64 bit, bit thứ k bằng 1 nghĩa là bản tin có trường thứ k.
      Với bản tin chỉ có các trường 3, 4, 11, 37 và 52, nhóm tám bit đầu bật bit 3 và 4 nên viết là 30 ở hệ mười sáu.
      Nhóm thứ hai bật bit 11 nên là 20.
      Nhóm thứ năm bật bit 37 nên là 08, nhóm thứ bảy bật bit 52 nên là 10, và các nhóm còn lại bằng 0.
    clear: true
  - show: |-
      <p><b>Khối PIN (ISO 9564 định dạng 0) và việc dịch PIN trong HSM</b></p>
      <ul>
        <li>Trường PIN: <code>0</code> + độ dài + PIN + đệm F → PIN 1234: <code>041234FFFFFFFFFF</code></li>
        <li>Trường số thẻ: <code>0000</code> + 12 chữ số bên phải của số thẻ, bỏ chữ số kiểm tra cuối → số thẻ 4321987654321098: <code>0000198765432109</code></li>
        <li>XOR (phép hoặc loại trừ trên từng bit) từng chữ số hệ mười sáu: khối PIN rõ = <code>04122D789ABCDEF6</code>, được mã hoá ngay trong thiết bị nhập PIN.</li>
        <li>Lệnh HSM (họ Thales payShield): <code>CA</code> dịch từ TPK (khóa giữa máy ATM/POS và ngân hàng) sang ZPK (khóa vùng giữa ngân hàng và NAPAS); <code>CC</code> dịch ZPK sang ZPK; <code>JE</code>/<code>JC</code> dịch ZPK/TPK sang LMK (khóa chủ của chính HSM). ZMK chỉ dùng để bọc khi trao đổi khóa, không mã hoá PIN.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Khối PIN định dạng 0 được tạo từ hai trường, trường PIN gồm số 0, độ dài, các chữ số PIN rồi đệm chữ F.
      Trường số thẻ gồm bốn số 0 và 12 chữ số bên phải của số thẻ, bỏ chữ số kiểm tra cuối.
      Lấy hai trường làm phép hoặc loại trừ trên từng chữ số, ta được khối PIN rõ, và khối này được mã hoá ngay trong thiết bị nhập PIN.
      Ở ngân hàng, một lệnh của HSM dịch khối PIN từ khóa của máy đầu cuối sang khóa vùng dùng với NAPAS, và một lệnh khác dịch giữa hai khóa vùng.
      Trong suốt quá trình, PIN chỉ được dịch bên trong HSM, không bao giờ bị giải mã ra dạng rõ ở máy chủ ứng dụng.
    clear: true
  - show: '<div class="box key">Quy tắc mã tương quan trên IBM MQ (phần mềm hàng đợi
      tin nhắn): Để tránh làm nghẽn luồng xử lý, cách thường dùng là mô hình yêu cầu
