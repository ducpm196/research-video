      <rect x="378" y="204" width="42" height="23" fill="#f8f9fa" stroke="#6c757d"/>
      <text x="399.0" y="220" font-size="10" fill="#555" text-anchor="middle">64</text>
      <text x="452" y="221" font-size="13" font-weight="bold" fill="#003366">00</text>
      <text x="492" y="126" font-size="11" fill="#555">ô đậm = bit bằng 1 (trường có mặt)</text>
      <text x="492" y="152" font-size="11" fill="#555">ghép 8 nhóm: 3020000008001000</text>
      </svg>
    focus:
    - 0
    - 0
    - 2
    clear: true
    say: Hình lưới này vẽ bản đồ bit gồm tám nhóm, mỗi nhóm tám bit. Ô đậm là bit bằng một, tức trường có mặt trong bản tin. Mỗi nhóm đổi sang hệ mười sáu cho hai chữ số, và ghép tám nhóm lại ta được ba không hai không không không không không tám không không một không không không.
  - show: |-
      <p><b>Khối PIN (ISO 9564 định dạng 0) và việc dịch PIN trong HSM</b></p>
      <ul>
        <li>Trường PIN (ISO 9564 là chuẩn quốc tế về cách xử lý PIN, ở đây là định dạng 0): <code>0</code> + độ dài + PIN + đệm F → PIN 1234: <code>041234FFFFFFFFFF</code></li>
        <li>Trường số thẻ: <code>0000</code> + 12 chữ số bên phải của số thẻ, bỏ chữ số kiểm tra cuối (chữ số cuối cùng của số thẻ, dùng để phát hiện gõ sai) → số thẻ 4321987654321098: <code>0000198765432109</code></li>
        <li>XOR (phép hoặc loại trừ: hai bit giống nhau cho 0, khác nhau cho 1) làm theo từng cặp chữ số hệ mười sáu bằng cách đổi sang 4 bit. Ví dụ 3 XOR 1: 0011 XOR 0001 = 0010 = 2; 4 XOR 9: 0100 XOR 1001 = 1101 = D; vậy cặp 34 và 19 cho 2D. Làm đủ 8 cặp hai chữ số ta được khối PIN rõ = <code>04122D789ABCDEF6</code>, được mã hoá ngay trong thiết bị nhập PIN.</li>
      </ul>
    focus:
    - '2.1'
    - '2.2'
    - '2.3'
    - '2.3'
    clear: true
    say: Khối PIN định dạng 0 được tạo từ hai trường, trường PIN gồm số 0, độ dài, các chữ số PIN rồi đệm chữ F. Trường số thẻ gồm bốn số 0 và 12 chữ số bên phải của số thẻ, bỏ chữ số kiểm tra cuối. Phép hoặc loại trừ cho không khi hai bit giống nhau và cho một khi khác nhau, chẳng hạn ba với một cho hai, bốn với chín cho chữ D. Làm đủ tám cặp hai chữ số ta được khối PIN rõ, mã hoá ngay trong thiết bị nhập PIN.
  - show: |-
      <p><b>Dịch PIN trong HSM</b></p>
      <ul>
        <li>Lệnh HSM (họ Thales payShield): <code>CA</code> dịch từ TPK (khoá giữa máy đầu cuối và ngân hàng; máy đầu cuối là ATM, máy rút tiền, hoặc POS, máy quẹt thẻ ở cửa hàng) sang ZPK (khoá vùng giữa ngân hàng và NAPAS); <code>CC</code> dịch ZPK sang ZPK; <code>JE</code>/<code>JC</code> dịch ZPK/TPK sang LMK (khoá chủ của chính HSM). ZMK chỉ dùng để bọc khi trao đổi khoá, không mã hoá PIN.</li>
      </ul>
    focus:
    - '2.1'
    - '2.1'
    say: Ở ngân hàng, một lệnh của HSM dịch khối PIN từ khoá của máy đầu cuối sang khoá vùng dùng với NAPAS, và một lệnh khác dịch giữa hai khoá vùng. PIN không bao giờ lộ dạng rõ ở máy chủ ứng dụng.
    clear: true
  - show: '<div class="box key">Quy tắc mã tương quan trên IBM MQ (phần mềm hàng đợi tin nhắn): Để tránh làm nghẽn luồng xử lý, cách thường dùng là mô hình yêu cầu phản hồi bất đồng bộ. Mỗi bản tin gửi đi được gắn một mã tương quan duy nhất (JMSCorrelationID). Bộ điều hợp chỉ nhận bản tin trả về có đúng mã định danh này.</div>'
    focus:
    - 0
    - 0
    say: Để tránh nghẽn kết nối khi giao tiếp với ngân hàng lõi qua hàng đợi IBM MQ, ta thường dùng mô hình gửi nhận bất đồng bộ qua mã tương quan. Ứng dụng gửi lệnh vào hàng đợi rồi giải phóng luồng ngay, sau đó chỉ nhận kết quả khi có bản tin trùng mã tương quan xuất hiện.
    clear: true
