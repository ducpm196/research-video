- id: symbol
  kind: symbol
  title: Cấu trúc Bản tin OFS và Gói tin ISO 8583 NAPAS
  checks:
  - 100000000 * 85 // 100 == 85000000
  - 300 // 60 == 5
  - str(50000000).zfill(12) == '000050000000'
  - len('202611070001') == 12
  steps:
  - show: '<p><b>Cấu trúc bản tin hạch toán Core T24 OFS</b> (một dòng văn bản, không
      có dấu cách sau dấu phẩy; xuống dòng ở đây chỉ để dễ đọc):</p>

      <pre><code>FUNDS.TRANSFER,ACTP/I/PROCESS//0,USER123/PASS123,,

      TRANSACTION.TYPE=AC,DEBIT.ACCT.NO=12345678,

      CREDIT.ACCT.NO=87654321,DEBIT.AMOUNT=50000000,

      DEBIT.CURRENCY=VND</code></pre>

      <p>Bản tin gồm tên ứng dụng, tuỳ chọn version/chức năng/xử lý, người dùng (ví
      dụ minh họa, không hard-code mật khẩu), mã giao dịch để trống cho T24 tự sinh,
      và các cặp trường giá trị hạch toán.</p>'
    focus:
    - 0
    - 0
    say: Đây là cấu trúc bản tin OFS dùng để hạch toán vào hệ lõi T24, gồm năm phần cách nhau bằng dấu phẩy. Bản tin khai báo tường minh tài khoản trích nợ, tài khoản thụ hưởng,
      số tiền chuyển khoản là 50 triệu đồng và loại tiền tệ hạch toán.
  - show: '<p><b>Bản tin MTI 0200 minh họa theo ISO 8583:1987</b> (đặc tả NAPAS 247
      cần kiểm):</p>

      <pre><code>Field 0 (MTI): 0200 (Yêu cầu tài chính)

      Field 3 (Processing Code): 40xxxx (chuyển khoản giữa tài khoản; mã NAPAS cần kiểm)

      Field 4 (Amount): 000050000000 (50 000 000 VND, 12 chữ số)

      Field 11 (STAN): 123456 (số theo dõi 6 chữ số do bên gửi đặt)

      Field 37 (RRN): 202611070001 (số tham chiếu truy hồi 12 ký tự)

      Field 52 (PIN Block): chỉ có ở giao dịch thẻ</code></pre>

      <p>VND không có phần lẻ (ISO 4217: 0 chữ số thập phân), nên 50 triệu đồng viết
      đủ 12 chữ số là 000050000000.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Trong cổng chuyển mạch liên ngân hàng, gói tin theo đặc tả có gốc từ chuẩn
      quốc tế, với các trường dữ liệu được đánh số. Trường số tiền dài 12 chữ số, và vì đồng Việt Nam không có phần lẻ nên 50 triệu đồng viết là bốn số 0, rồi 50, rồi sáu số 0.
      Số theo dõi STAN và số tham chiếu RRN mười hai ký tự là căn cứ chính để tra cứu và đối soát giao dịch giữa các ngân hàng thành viên.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Đối soát Ba bên Cuối ngày EOD bằng Thuật toán Hai con trỏ'
  checks:
  - 3000000 // 1000000 == 3
  - 100 - 90 == 10
  - 3000000 * 22 * 3 < 300000000
  - 3 * 3000000 * 22 == 198000000
  - (3 * 10**6) ** 2 == 9 * 10**12
  - 9 * 10**12 / 10**9 / 3600 == 2.5
  - math.ceil(math.log2(3 * 10**6)) == 22
  - round(math.log2(3 * 10**6), 1) == 21.5
  - 2 * (3000000 + 3000000) == 12000000
  - round((198000000 + 12000000) / 10**9, 1) == 0.2
  steps:
  - show: "<p><b>Dữ liệu bài toán giả định: đối soát 3 bên cuối ngày (EOD)</b>:</p>\n<ul>\n\
      \  <li>EOD (end of day) = khâu xử lý cuối ngày; đối soát = so từng giao dịch giữa\
      \ sổ của các bên để tìm chỗ lệch.</li>\n\
      \  <li>Quy mô dữ liệu: $3\\,000\\,000$ giao dịch trong ngày giữa ngân hàng lõi, NAPAS\
      \ và Đối tác (ví dụ minh họa).</li>\n  <li>Mục tiêu thiết kế giả định: hoàn tất đối soát trong vòng 5\
      \ phút (300 giây).</li>\n  <li>Ký hiệu O(…) chỉ cỡ số phép tính khi số giao dịch N lớn:\
      \ O(N) tăng tỉ lệ thuận với N, O(N log N) cỡ N nhân lôgarit cơ số 2 của N, O(N^2) cỡ N nhân N.</li>\n\
      \  <li>Nếu dùng vòng lặp lồng nhau O(N^2): $(3 \\times 10^6)^2\
      \ = 9 \\times 10^{12}$ phép so sánh; ở tốc độ giả định $10^9$ phép mỗi giây là\
      \ 9 000 giây = 2,5 giờ.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Ta xem xét bài toán giả định, đối soát cuối ngày với ba triệu giao dịch giữa ngân hàng
      lõi, cổng chuyển mạch và đối tác thu hộ.
      Đối soát nghĩa là so từng giao dịch giữa sổ của các bên để tìm chỗ lệch. Giả sử mục tiêu thiết kế là năm phút.
      Ký hiệu chữ O kèm ngoặc chỉ cỡ số phép tính khi số giao dịch N lớn, ví dụ O của N bình phương nghĩa là cỡ N nhân N phép tính.
      Nếu dùng hai vòng lặp lồng nhau, mỗi giao dịch so với mọi giao dịch kia, ta cần 9 nghìn tỉ phép so sánh.
      Với tốc độ giả định một tỉ phép mỗi giây, việc đó mất 9000 giây, tức hai giờ rưỡi.
  - show: '<p><b>Bước 1: Sắp xếp các tệp dữ liệu theo Mã đối soát RRN</b>:</p>

      $$\text{Độ phức tạp sắp xếp: } O(N \log N) \text{ với thuật toán TimSort}$$

      <p class="note">TimSort: cách sắp xếp có sẵn trong thư viện của Python và Java,
      ghép dần các đoạn đã có thứ tự. Cỡ N log N phép so sánh là mức thấp nhất mà
      mọi cách sắp xếp chỉ dựa vào phép so sánh đều phải tốn trong trường hợp xấu nhất.</p>

      <div class="box key">Sau khi sắp xếp, cả 3 danh sách giao dịch đều có trật tự
      mã đối soát tăng dần!</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta sắp xếp các tệp dữ liệu theo mã đối soát tăng dần bằng thuật
      toán sắp xếp có sẵn trong thư viện. Số phép so sánh cỡ N nhân lôgarit của N,
      mức thấp nhất mà mọi cách sắp xếp dựa vào phép so sánh đều phải tốn trong trường hợp xấu nhất. Sau bước này, toàn bộ hàng triệu bản ghi của ba bên
      đều nằm trên một đường thẳng có thứ tự hoàn hảo.
    clear: true
  - show: "<p><b>Bước 2: Duyệt đồng thời bằng Thuật toán Hai con trỏ O(N)</b> (mã giả):</p>\n\
      <pre><code>while (i < core.size() && j < napas.size()) {  // i, j chỉ tiến\n\
      \    if (core[i].rrn == napas[j].rrn)\n        matchOrFlagAmount(core[i++], napas[j++]);\
      \  // so cả số tiền\n    else if (core[i].rrn < napas[j].rrn) reportMissingInNapas(core[i++]);\n\
      \    else reportMissingInCore(napas[j++]);\n}\nwhile (i < core.size())  reportMissingInNapas(core[i++]);\
      \  // phần dư = lệch\nwhile (j < napas.size()) reportMissingInCore(napas[j++]);\n\
      // lặp lại cách này giữa NAPAS và Đối tác</code></pre>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước hai, ta áp dụng giải thuật hai con trỏ tịnh tiến đồng thời. Con trỏ
      chỉ duyệt tiến một chiều nên mỗi bản ghi được xem đúng một lần, độ phức tạp tuyến tính. Các giao dịch trùng mã được so thêm số tiền, còn các lệnh lệch được tách riêng vào danh sách nghi
      vấn. Khi một danh sách đã hết, phần còn dư của danh sách kia đều là lệch, và ta lặp lại cách này giữa NAPAS với đối tác.
    clear: true
  - show: '<p><b>Bước 3: Ước lượng khối lượng tính toán cho 3 triệu bản ghi</b>:</p>

      <div class="box key">Sắp xếp 3 danh sách: khoảng $3 \times 3\,000\,000 \times
      22 = 198\,000\,000 \approx 2 \times 10^8$ phép so sánh ($\log_2 3\,000\,000 \approx 21{,}5$,
      làm tròn lên 22), hai con trỏ thêm tối đa khoảng 12 triệu bước (mỗi lượt 3 + 3 = 6 triệu,
      hai lượt). Ở tốc độ giả định trên, chỉ khoảng 0,2 giây, nên mục tiêu 300 giây là khả thi (ví dụ minh họa). Thời gian
      thật phải đo, vì đọc ghi tệp thường chậm hơn phép so sánh; các giao dịch lệch
      được đưa sang luồng tra soát.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước ba, với ba triệu bản ghi, lôgarit cơ số hai của ba triệu xấp xỉ 21 phẩy 5, làm tròn lên 22, nên sắp xếp ba danh sách cần khoảng 198 triệu phép so sánh. Hai con trỏ thêm tối đa khoảng 12 triệu bước, vì mỗi lượt đi qua hai danh sách ba triệu. Ở tốc độ giả định một tỉ phép mỗi giây, việc này chỉ khoảng 0 phẩy 2 giây, nên mục tiêu ba trăm giây là khả thi. Con
      số thật phải đo vì đọc ghi tệp thường chậm hơn phép so sánh, và các giao dịch lệch được chuyển sang luồng tra soát.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Xử lý Bản tin Mã lỗi 68 Nghi vấn từ NAPAS'
  checks:
  - 1014 - 1000 == 14
  - 68 > 0
  steps:
  - show: "<p><b>Tình huống phỏng vấn Senior</b>: Khi gửi lệnh chuyển khoản 50 triệu\
      \ qua NAPAS 247 mà cổng trả về mã phản hồi 68 (Giao dịch đang nghi vấn do ngân\
      \ hàng thụ hưởng chưa trả lời kịp), hệ thống xử lý ra sao?</p>\n<ul>\n  <li>(A)\
      \ Hoàn tiền ngay lập tức vào tài khoản người gửi.</li>\n  <li>(B) Trừ tiền lần\
      \ thứ hai và gửi lại gói tin.</li>\n  <li>(C) Giữ nguyên trạng thái Chờ đối\
      \ soát (In-doubt), không tự ý hoàn tiền hay trừ tiền kép, và tự động truy vấn\
      \ hoặc tra soát trạng thái theo quy trình của NAPAS (lưu ý: MTI 0400 là yêu cầu đảo, không phải truy vấn).</li>\n</ul>\n\
      <p>Tra soát = gửi yêu cầu hỏi lại trạng thái thật của giao dịch tới NAPAS hoặc\
      \ ngân hàng nhận. Mã 68 trong chuẩn ISO 8583 nghĩa là phản hồi về quá muộn.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Tra soát nghĩa là gửi yêu cầu hỏi lại trạng thái thật của giao dịch tới NAPAS hoặc ngân hàng nhận. Mời bạn trả lời tình huống xử lý mã lỗi nhạy cảm của cổng chuyển mạch. Khi
      phía chuyển mạch phản hồi mã sáu mươi tám báo hiệu giao dịch nghi vấn, kỹ sư
      tích hợp cấp cao sẽ điều khiển luồng tiền như thế nào.
  - show: '<p><b>Đáp án chính xác: Lựa chọn (C)</b></p>

      <div class="box key">Giải thích vì: Mã lỗi 68 có nghĩa là ngân hàng thụ hưởng
      có thể đã cộng tiền cho người nhận nhưng chưa kịp phản hồi. Nếu ACB vội vàng
      hoàn tiền cho người gửi, ngân hàng sẽ bị thất thoát tài chính. Ta bắt buộc phải
      treo trạng thái và phát lệnh tra soát đối soát tự động!</div>'
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn C vì mã lỗi nghi vấn cho thấy người nhận có
      thể đã được cộng tiền. Nếu hệ thống vội vã hoàn tiền, ngân hàng sẽ chịu rủi
      ro mất vốn. Ta bắt buộc phải chuyển sang luồng tra soát tự động.
    clear: true
- id: pitfall
  kind: pitfall
  title: 'Bẫy Nguy hiểm: Tin tưởng Tuyệt đối vào Mạng Viễn thông'
  steps:
  - show: "<div class=\"box pit\">Sai lầm nghiêm trọng khi tích hợp cổng thanh toán\
      \ liên ngân hàng:</div>\n<table class=\"t\" style=\"margin-top: 10px;\">\n \
      \ <tr><th>sai lầm sơ cấp</th><th>hiểm họa tài chính</th><th>giải pháp chuẩn\
      \ Senior</th></tr>\n  <tr><td>Cộng tiền khi nhận gói tin không xác thực</td><td>Bị\
      \ tấn công làm giả gói tin chuyển tiền</td><td>Luôn kiểm tra mã xác thực toàn\
      \ vẹn MAC (trường 64 hoặc 128)</td></tr>\n  <tr><td>Bỏ qua kiểm tra trùng lặp khóa phân tán</td><td>Khách\
      \ hàng quẹt thẻ một lần bị trừ nợ hai lần</td><td>Khóa nguyên tử Redis theo\
      \ STAN và RRN, kèm mã thiết bị và thời điểm gửi (STAN chỉ 6 chữ số nên quay vòng)</td></tr>\n</table>\n\
      <p>MAC (mã xác thực thông điệp) = mã tính từ nội dung bản tin và một khóa bí mật\
      \ hai bên cùng giữ; sửa một ký tự là MAC sai. Khác hàm băm thường ở chỗ kẻ gian\
      \ không có khóa thì không tính lại được (hàm băm thường: phép tính ra một mã ngắn\
      \ từ nội dung mà ai cũng tính được).</p>"
    focus:
    - 0
    - 0
    - 0
    say: Một sai lầm nguy hiểm là việc cộng tiền khi chưa xác thực mã kiểm tra toàn
      vẹn MAC của gói tin.
      MAC là mã tính từ nội dung bản tin và một khóa bí mật hai bên cùng giữ. Khác với hàm băm thường, là phép tính mã ngắn mà ai cũng làm được, kẻ gian không có khóa thì không tính lại được mã này, nên sửa một ký tự là bị phát hiện.
  - show: |-
      <div class="box pit">Sai lầm thứ hai: bỏ qua kiểm tra trùng lặp, khách quẹt thẻ một lần bị trừ hai lần.</div>
      <p>Khóa nguyên tử = thao tác “đặt khóa nếu chưa có” làm trong một bước, nên hai máy chủ không thể cùng đặt thành công; khóa phân tán = khóa mà nhiều máy chủ cùng nhìn thấy, đặt ở một chỗ chung như Redis.</p>
    clear: true
    focus:
    - 0
    - 0
    - 0
    say: Kỹ sư cũng phải kích hoạt khóa khử trùng lặp, gồm số theo dõi, số tham chiếu, mã thiết bị và thời điểm gửi, để bảo vệ tài khoản khách hàng.
      Khóa này đặt ở một chỗ chung mà mọi máy chủ cùng thấy, gọi là khóa phân tán.
      Thao tác đặt khóa nếu chưa có làm trong một bước nguyên tử, nên hai máy chủ không thể cùng đặt thành công.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: Thứ tự Hai pha khi Cấp Thấu chi Cầm cố'
  checks:
  - 100 - 85 == 15
  - 90 > 85
  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm nghiệp vụ tín dụng</b>: Khi cấp hạn mức thấu\
      \ chi cầm cố sổ tiết kiệm 100 triệu với tỉ lệ cấp vốn 85% (tỉ lệ minh hoạ), thứ tự điều phối\
      \ nào sau đây bảo đảm an toàn sổ cái?</p>\n<ul>\n  <li><b>A</b>: Mở\
      \ hạn mức thấu chi 85 triệu trước, sau đó gửi thông báo phong tỏa sổ tiết kiệm\
      \ sau.</li>\n  <li><b>B</b>: Phong tỏa số dư sổ tiết kiệm trên phân hệ tiền\
      \ gửi Core T24 trước, sau khi thành công mới cấp hạn mức thấu chi vào tài khoản\
      \ thanh toán CASA.</li>\n  <li><b>C</b>: Giải ngân tiền mặt trực tiếp cho khách\
      \ hàng mà không cần ghi nhận vào ngân hàng lõi.</li>\n  <li><b>D</b>: Chờ khách\
      \ hàng ký giấy tờ tại quầy mới thực hiện thao tác.</li>\n</ul>"
    focus:
    - 0
    - 0
    say: Xin mời bạn lựa chọn quy trình hai pha chuẩn mực khi cấp hạn mức thấu chi
      cầm cố tài sản. Bạn có 15 giây suy nghĩ trước khi nghe giải thích quy chuẩn
      ngân hàng số.
    pause: 15
  - show: "<div class=\"box key\"><b>Đáp án chính xác là B</b>!</div>\n<p><b>Bước\
      \ 1 — Nguyên tắc tài sản bảo đảm trong ngân hàng</b>:</p>\n<table class=\"t\"\
      >\n  <tr><th>trình tự</th><th>thao tác Core T24</th><th>ý nghĩa quản trị rủi\
      \ ro</th></tr>\n  <tr><td>Pha 1: Phong tỏa</td><td>Phong tỏa sổ tiết kiệm trên\
      \ Core T24</td><td>Khách hàng không thể rút tiền gửi khi đang vay</td></tr>\n\
      \  <tr><td>Giữa hai pha: Ký hợp đồng</td><td>Khách ký hợp đồng (có thể ký số từ xa)</td><td>Có\
      \ căn cứ pháp lý trước khi cấp vốn</td></tr>\n\
      \  <tr><td>Pha 2: Cấp vốn</td><td>Ghi hạn mức thấu chi 85 triệu vào CASA (tài khoản thanh toán)</td><td>Chỉ cấp\
      \ vốn khi tài sản bảo đảm đã an toàn</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án B. Sổ tiết kiệm đóng vai trò là tài sản bảo
      đảm nên bắt buộc phải được phong tỏa an toàn trước. Sau khi phong tỏa, khách ký hợp đồng, có thể bằng chữ ký số từ xa. Chỉ khi các bước đó thành
      công thì hạn mức 85 triệu mới được ghi vào tài khoản thanh toán.
    clear: true
  - show: '<p><b>Bước 2 — Cơ chế phục hồi khi pha 2 gặp sự cố</b>:</p>

      <div class="box key">Nếu hệ lõi từ chối rõ ràng việc cấp hạn mức, hệ thống tự
      động phát lệnh mở phong tỏa sổ tiết kiệm để trả lại trạng thái nguyên vẹn cho
      khách hàng, hạn chế rủi ro tài sản bị khóa oan (nếu lệnh mở cũng lỗi thì đưa
      vào hàng đợi thử lại và đối soát). Nếu chỉ lỗi mạng hoặc hết giờ chờ thì kết quả là
      chưa biết: truy vấn T24 trước, chỉ mở phong tỏa khi chắc chắn hạn mức chưa được ghi.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, nếu hệ lõi từ chối rõ ràng việc cấp hạn mức, hệ thống sẽ tự động giải tỏa phong
      tỏa để hoàn trả trạng thái ban đầu cho sổ tiết kiệm. Điều này bảo đảm quyền
      lợi hợp pháp cho khách hàng và giữ uy tín cho ngân hàng.
      Còn nếu chỉ lỗi mạng hoặc hết giờ chờ, hệ thống phải hỏi lại hệ lõi trước, vì hạn mức có thể đã được ghi.
    clear: true
- id: recap
  kind: recap
  title: Tổng kết chuỗi logic Nghiệp vụ Ngân hàng và Cổng NAPAS
  steps:
  - show: "<div class=\"chain\">\n  <span>Tích hợp Core T24 OFS qua IBM MQ bất\
      \ đồng bộ</span> &rarr;\n  <span>Chuyển mạch NAPAS 247 & Dịch mã\
      \ PIN trong HSM</span> &rarr;\n  <span>Làm chủ 6 Trụ cột Tín dụng Bán lẻ Squad Lending</span>\
      \ &rarr;\n  <span>Đối soát Ba bên EOD Thuật toán Hai con trỏ O(N)</span> &rarr;\n\
      \  <span>Xử lý Chuẩn xác Mã lỗi Nghi vấn 68 bảo toàn nguồn vốn</span>\n</div>\n\
      <table class=\"t\" style=\"margin-top: 15px;\">\n  <tr><th>giá trị chuyên môn</th><th>điều\
      \ cần chứng minh khi phỏng vấn</th></tr>\n  <tr><td>Làm chủ T24 & NAPAS\
      \ 247</td><td>Giải thích được luồng bản tin, xử lý timeout và đối soát</td></tr>\n\
      \  <tr><td>Kiến trúc Squad Lending</td><td>Thứ tự phong tỏa, ký, cấp hạn mức;\
      \ chống giải ngân trùng</td></tr>\n  <tr><td>Đối soát EOD</td><td>Hai con trỏ\
      \ O(N) sau khi sắp xếp; số đo thật chỉ nêu nếu có</td></tr>\n</table>\n<p style=\"margin-top: 15px;\"><b>Bản lĩnh Kỹ sư\
      \ Tích hợp Cấp cao</b>: Nắm vững huyết mạch thanh toán ngân hàng, bảo vệ từng\
      \ đồng tiền của khách hàng và tự tin chốt mức lương 50 triệu gross.</p>"
    focus:
    - 0
    - 0
    say: Tóm lại, chuỗi logic gồm tích hợp ngân hàng lõi, chuẩn hóa gói tin chuyển
      mạch, bao quát sáu trụ cột tín dụng và đối soát hai con trỏ siêu tốc. Làm chủ
      nghiệp vụ ngân hàng cốt lõi này, bạn tự tin thể hiện bản lĩnh chuyên gia và
      khẳng định mức đãi ngộ 50 triệu gross tại ACB.
