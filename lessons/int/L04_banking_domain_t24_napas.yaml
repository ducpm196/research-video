scenes:
- id: hook
  kind: hook
  title: Vòng đời Bản tin Chuyển tiền Liên ngân hàng NAPAS 247
  steps:
  - show: '<p>Khi khách hàng bấm nút chuyển tiền nhanh 247 trên ứng dụng ngân hàng
      số ACB, gói tin di chuyển qua những trạm kiểm soát nào?</p>

      <div class="box key">Trong vài giây, hệ thống phải trích nợ sổ cái Core T24,
      đóng gói bản tin theo đặc tả NAPAS (gốc ISO 8583) gửi qua cổng chuyển mạch,
      với giao dịch thẻ thì dịch mã khối PIN trong HSM, rồi đối soát cuối ngày. Làm
      sao làm chủ trọn vẹn?</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, một lệnh chuyển tiền nhanh liên ngân hàng diễn ra chỉ trong vài
      giây nhưng phải đi qua hàng loạt chốt kiểm soát an ninh nghiêm ngặt. Hệ thống
      phải vừa hạch toán sổ cái ngân hàng lõi, vừa đóng gói bản tin chuyển mạch, và
      với giao dịch thẻ thì bảo vệ khối mã pin bằng phần cứng chuyên dụng. Hôm nay, ta cùng nhau khám
      phá bức tranh nghiệp vụ ngân hàng toàn diện.
  - show: "<table class=\"t\">\n  <tr><th>trụ cột nghiệp vụ</th><th>tiêu chuẩn kỹ\
      \ thuật lõi</th><th>phân hệ tích hợp</th></tr>\n  <tr><td>Ngân hàng lõi Temenos\
      \ T24</td><td>Bản tin OFS (chuỗi văn bản) qua hàng đợi IBM MQ bất đồng bộ</td><td>Bộ điều\
      \ hợp chuyển đổi dữ liệu và hạch toán sổ cái</td></tr>\n  <tr><td>Chuyển mạch\
      \ NAPAS 247</td><td>Đặc tả gốc ISO 8583 qua kết nối TCP</td><td>Cổng\
      \ thanh toán liên ngân hàng và dịch mã PIN trong HSM</td></tr>\n  <tr><td>Tín dụng số\
      \ Squad Lending</td><td>Phong tỏa sổ cái hai pha, cấp thấu chi và cổng CIC</td><td>Hệ\
      \ thống quản lý khoản vay và ký số đám mây</td></tr>\n</table>\n<p>Hôm nay,\
      \ ta làm chủ: <b>Tích hợp Core T24</b>, <b>chuyển mạch NAPAS 247</b>, và <b>sáu\
      \ trụ cột tín dụng bán lẻ</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba trụ cột nghiệp vụ cốt lõi của ngân hàng
      thương mại. Ta tìm hiểu cách giao tiếp với ngân hàng lõi qua bản tin đặc tả
      mở. Ta nắm vững quy chuẩn gói tin chuyển mạch liên ngân hàng quốc tế. Ta cũng
      làm chủ toàn bộ hệ sinh thái tín dụng bán lẻ tốc độ cao.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: Bản tin OFS, Mã giao dịch MTI và Thiết bị Bảo mật HSM'
  checks:
  - 8000 * 60 == 480000
  - 1500 - 120 == 1380
  steps:
  - show: "<p><b>Ba khái niệm then chốt trong hạ tầng thanh toán ngân hàng</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>định nghĩa kỹ thuật</th><th>vai\
      \ trò trong giao dịch</th></tr>\n  <tr><td>Temenos T24 OFS</td><td>Chuỗi\
      \ văn bản phân cách bằng dấu phẩy, giao tiếp trực tiếp với ngân hàng lõi</td><td>Hạch toán tài\
      \ khoản tiền gửi, tiền vay và hạn mức</td></tr>\n  <tr><td>NAPAS 247 ISO 8583</td><td>Đặc\
      \ tả kết nối có gốc chuẩn ISO 8583 cho thẻ và chuyển khoản</td><td>Định tuyến lệnh\
      \ chuyển tiền liên ngân hàng tức thời</td></tr>\n  <tr><td>Thiết bị HSM</td><td>Hộp\
      \ phần cứng bảo mật chuyên dụng mã hóa khối mã PIN</td><td>Bảo vệ mã pin thẻ\
      \ không bị giải mã trong bộ nhớ máy chủ</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại ba khái niệm then chốt trong thanh toán ngân hàng. Bản
      tin mở của ngân hàng lõi giúp giao tiếp trực tiếp với sổ cái tài khoản. Giao
      thức chuyển mạch liên ngân hàng điều phối dòng tiền giữa các tổ chức tín dụng.
      Thiết bị bảo mật phần cứng bảo đảm mã pin thẻ không bao giờ lộ dạng rõ ra ngoài
      thiết bị.
  - show: '<div class="box key">Quy tắc mã tương quan trên IBM MQ: Để tránh làm nghẽn
      luồng xử lý của ngân hàng lõi, ta luôn dùng mô hình yêu cầu phản hồi bất đồng
      bộ. Mỗi bản tin gửi đi được gắn một mã tương quan duy nhất (JMSCorrelationID).
      Bộ điều hợp chỉ lắng nghe bản tin trả về có đúng mã định danh này!</div>'
    focus:
    - 0
    - 0
    say: Để tránh nghẽn kết nối khi giao tiếp với ngân hàng lõi, ta sử dụng mô hình
      gửi nhận bất đồng bộ qua mã tương quan. Ứng dụng gửi lệnh vào hàng đợi rồi giải
      phóng luồng ngay, sau đó chỉ nhận kết quả khi có bản tin trùng mã tương quan
      xuất hiện.
    clear: true
