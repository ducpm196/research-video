- id: symbol
  kind: symbol
  title: Cấu trúc Bản tin OFS và Gói tin ISO 8583 NAPAS
  checks:
  - 100000000 * 85 // 100 == 85000000
  - 300 // 60 == 5
  steps:
  - show: '<p><b>Cấu trúc bản tin hạch toán Core T24 OFS</b> (một dòng văn bản, không
      có dấu cách sau dấu phẩy; xuống dòng ở đây chỉ để dễ đọc):</p>

      <pre><code>FUNDS.TRANSFER,ACTP/I/PROCESS//0,USER123/PASS123,,

      TRANSACTION.TYPE=AC,DEBIT.ACCT.NO=12345678,

      CREDIT.ACCT.NO=87654321,DEBIT.AMOUNT=50000000,

      DEBIT.CURRENCY=VND</code></pre>

      <p>Bản tin gồm tên ứng dụng, tuỳ chọn version/chức năng/xử lý, người dùng (ví
      dụ minh họa, không hard-code mật khẩu), mã giao dịch để trống cho T24 tự sinh,
      và các cặp trường giá trị hạch toán.</p>'
    focus:
    - 0
    - 0
    say: Đây là cấu trúc bản tin mở chuẩn mực dùng để hạch toán vào hệ thống ngân
      hàng lõi. Bản tin khai báo tường minh tài khoản trích nợ, tài khoản thụ hưởng,
      số tiền chuyển khoản và loại tiền tệ hạch toán.
  - show: '<p><b>Bản tin MTI 0200 minh họa theo ISO 8583:1987</b> (đặc tả NAPAS 247
      cần kiểm):</p>

      <pre><code>Field 0 (MTI): 0200 (Yêu cầu tài chính)

      Field 3 (Processing Code): 40xxxx (chuyển khoản giữa tài khoản; mã NAPAS cần kiểm)

      Field 4 (Amount): 000005000000 (50,000,000 VND)

      Field 11 (STAN): 123456 (Mã số thứ tự phiên giao dịch)

      Field 37 (RRN): 202611070001 (Mã đối soát duy nhất 12 ký tự)

      Field 52 (PIN Block): chỉ có ở giao dịch thẻ</code></pre>'
    focus:
    - 0
    - 0
    say: Trong cổng chuyển mạch liên ngân hàng, gói tin theo đặc tả có gốc từ chuẩn
      quốc tế, với các trường dữ liệu được đánh số. Mã số phiên và mã đối soát mười
      hai ký tự là căn cứ chính để đối soát giao dịch giữa các ngân hàng thành viên.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Đối soát Ba bên Cuối ngày EOD bằng Thuật toán Hai con trỏ'
  checks:
  - 3000000 // 1000000 == 3
  - 180 < 300
  - 100 - 90 == 10
  - 3000000 * 22 * 3 < 300000000
  steps:
  - show: "<p><b>Dữ liệu bài toán đối soát 3 bên cuối ngày tại ACB</b>:</p>\n<ul>\n\
      \  <li>Quy mô dữ liệu: $3\\,000\\,000$ giao dịch trong ngày giữa Core T24, NAPAS\
      \ và Đối tác (ví dụ minh họa).</li>\n  <li>Mục tiêu thiết kế giả định: hoàn tất đối soát trong vòng 5\
      \ phút (300 giây).</li>\n  <li>Nếu dùng vòng lặp quét lồng nhau O(N^2): Tốn\
      \ hàng nghìn tỉ phép so sánh, làm tê liệt máy chủ!</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét bài toán đối soát cuối ngày với ba triệu giao dịch giữa ngân hàng
      lõi, cổng chuyển mạch và đối tác thu hộ. Giả sử mục tiêu thiết kế là năm phút.
      Nếu dùng thuật toán duyệt lồng nhau thông thường, hệ thống sẽ chạy mất hàng
      giờ.
  - show: '<p><b>Bước 1: Sắp xếp các tệp dữ liệu theo Mã đối soát RRN</b>:</p>

      $$\text{Độ phức tạp sắp xếp: } O(N \log N) \text{ với thuật toán TimSort}$$

      <div class="box key">Sau khi sắp xếp, cả 3 danh sách giao dịch đều có trật tự
      mã đối soát tăng dần!</div>'
    focus:
    - 0
    - 0
    say: Bước một, ta tiến hành sắp xếp các tệp dữ liệu theo mã đối soát tăng dần
      với độ phức tạp tối ưu. Sau bước này, toàn bộ hàng triệu bản ghi của ba bên
      đều nằm trên một đường thẳng có thứ tự hoàn hảo.
    clear: true
  - show: "<p><b>Bước 2: Duyệt đồng thời bằng Thuật toán Hai con trỏ O(N)</b>:</p>\n\
      <pre><code>// Duyệt tịnh tiến con trỏ i và j mà không bao giờ quay lui\nwhile\
      \ (i < coreList.size() && j < napasList.size()) {\n    if (coreList[i].rrn ==\
      \ napasList[j].rrn) {\n        matchTransaction(coreList[i], napasList[j]);\n\
      \        i++; j++;\n    } else if (coreList[i].rrn < napasList[j].rrn) {\n \
      \       reportMissingInNapas(coreList[i]); i++;\n    } else {\n        reportMissingInCore(napasList[j]);\
      \ j++;\n    }\n}</code></pre>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, ta áp dụng giải thuật hai con trỏ tịnh tiến đồng thời. Con trỏ
      chỉ duyệt tiến một chiều với độ phức tạp tuyến tính. Các giao dịch khớp nhau
      được ghi nhận tức thì, còn các lệnh lệch được tách riêng vào danh sách nghi
      vấn.
    clear: true
  - show: '<p><b>Bước 3: Ước lượng khối lượng tính toán cho 3 triệu bản ghi</b>:</p>

      <div class="box key">Sắp xếp 3 danh sách: khoảng $3 \times 3\,000\,000 \times
      22 \approx 2 \times 10^8$ phép so sánh, nên mục tiêu 180 giây là khả thi (ví dụ
      minh họa). Thời gian thật phải đo; các giao dịch lệch được đưa sang luồng tra
      soát.</div>'
    focus:
    - 0
    - 0
    say: Bước ba, với ba triệu bản ghi, sắp xếp và hai con trỏ chỉ cần khoảng vài
      trăm triệu phép so sánh, nên mục tiêu một trăm tám mươi giây là khả thi. Con
      số thật phải đo, và các giao dịch lệch được chuyển sang luồng tra soát.
    clear: true
