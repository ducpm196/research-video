scenes:
- id: hook
  kind: hook
  title: Vòng đời Bản tin Chuyển tiền Liên ngân hàng NAPAS 247
  steps:
  - show: |-
      <p>Khi khách hàng bấm nút chuyển tiền nhanh 247 trên một ứng dụng ngân hàng số, gói tin di chuyển qua những trạm kiểm soát nào?</p>
      <div class="box key">Trong vài giây, hệ thống phải trích nợ trên core banking (hệ thống ngân hàng lõi giữ sổ cái), đóng gói bản tin theo đặc tả của NAPAS (công ty chuyển mạch tiền giữa các ngân hàng Việt Nam) gửi qua cổng chuyển mạch, với giao dịch thẻ thì dịch khối PIN (PIN = mã bí mật khách nhập khi dùng thẻ) bằng thiết bị phần cứng chuyên dụng, và khi có nghi vấn thì tra soát. Làm sao làm chủ trọn vẹn?</div>
      <p>Trích nợ = trừ tiền khỏi tài khoản; hạch toán = ghi giao dịch vào sổ kế toán của ngân hàng; tra soát = hỏi lại trạng thái thật của một giao dịch. Bài dùng Temenos T24 làm ví dụ hệ lõi. Tin tuyển dụng ACB không nói ACB dùng hệ lõi nào, nên đừng khẳng định điều đó khi phỏng vấn.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, một lệnh chuyển tiền nhanh liên ngân hàng diễn ra chỉ trong vài giây nhưng phải đi qua nhiều chốt kiểm soát an ninh. Hệ thống phải hạch toán sổ cái ngân hàng lõi, rồi đóng gói bản tin gửi NAPAS, công ty chuyển mạch tiền giữa các ngân hàng. Với giao dịch thẻ, hệ thống còn phải bảo vệ khối mã pin bằng phần cứng chuyên dụng. Bài này dùng hệ lõi T24 của hãng Temenos làm ví dụ, và tin tuyển dụng của ACB không nói ACB dùng hệ lõi nào, nên đừng khẳng định điều đó khi phỏng vấn.
  - show: |-
      <table class="t">
        <tr><th>trụ cột nghiệp vụ</th><th>tiêu chuẩn kỹ thuật lõi</th><th>phân hệ tích hợp</th></tr>
        <tr><td>Ngân hàng lõi Temenos T24</td><td>Bản tin OFS (chuỗi văn bản) qua hàng đợi IBM MQ bất đồng bộ</td><td>Bộ điều hợp chuyển đổi dữ liệu và hạch toán sổ cái</td></tr>
        <tr><td>Chuyển mạch NAPAS 247</td><td>Đặc tả riêng của NAPAS, thường mô tả có gốc ISO 8583, qua kết nối TCP (giao thức mạng giữ một đường nối hai chiều, bảo đảm dữ liệu tới đủ và đúng thứ tự) (cần kiểm đặc tả hiện hành)</td><td>Cổng thanh toán liên ngân hàng và dịch mã PIN bằng thiết bị phần cứng bảo mật</td></tr>
