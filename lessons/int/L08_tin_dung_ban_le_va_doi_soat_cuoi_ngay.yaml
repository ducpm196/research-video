scenes:
- id: hook
  kind: hook
  title: Từ một khoản vay số đến sổ sách đối soát cuối ngày
  steps:
  - show: |-
      <p>Khách bấm vay một khoản trên ứng dụng ngân hàng số. Từ lúc bấm đến lúc tiền về tài khoản, và đến lúc cuối ngày mọi sổ khớp nhau, có những việc kỹ thuật nào?</p>
      <div class="box key">Hệ thống phải tính hạn mức an toàn, tra nợ xấu của khách, khoá tài sản bảo đảm, ký hợp đồng, ghi hạn mức vào hệ lõi (hệ ngân hàng lõi giữ sổ cái, ở đây lấy T24 của hãng Temenos làm ví dụ), rồi cuối ngày đối soát hàng triệu giao dịch giữa các bên.</div>
      <p>Squad Lending là tên một nhóm cho vay số trong một tin tuyển dụng đã lưu, chưa kiểm lại; bài chỉ mượn sáu mảng tín dụng làm khung ví dụ, không khẳng định ngân hàng nào có đúng sáu mảng này.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, một khoản vay số trông chỉ là một lần bấm nút, nhưng phía sau là hàng chục việc kỹ thuật nối tiếp nhau. Hệ thống phải tính hạn mức an toàn, tra nợ xấu của khách, khoá tài sản bảo đảm rồi ghi hạn mức vào hệ lõi. Cuối ngày, ngân hàng còn đối soát hàng triệu giao dịch giữa các bên để tìm chỗ lệch. Squad Lending chỉ là tên nhóm lấy từ một tin tuyển dụng đã lưu, chưa kiểm, nên bài mượn nó làm khung ví dụ.
  - show: |-
      <table class="t">
        <tr><th>mảng nghiệp vụ</th><th>câu hỏi phỏng vấn hay gặp</th><th>con số bạn sẽ tự tính</th></tr>
        <tr><td>Tín dụng bán lẻ</td><td>Hạn mức tối đa bao nhiêu, người vay có gánh nổi không, trả thiếu thì sao</td><td>hạn mức, tỉ lệ trả nợ trên thu nhập, số tiền thu từng phần</td></tr>
        <tr><td>Thứ tự an toàn của sổ cái</td><td>Khoá tài sản trước hay cấp vốn trước, lỗi giữa chừng thì phục hồi thế nào</td><td>hạn mức theo tỉ lệ cho vay</td></tr>
        <tr><td>Đối soát cuối ngày</td><td>Hàng triệu giao dịch của ba bên được so trong bao lâu</td><td>số phép so sánh ở ba cỡ dữ liệu</td></tr>
      </table>
      <p>Hôm nay, ta làm chủ <b>sáu mảng tín dụng bán lẻ</b>, <b>thứ tự hai pha của sổ cái</b> và <b>đối soát ba bên cuối ngày</b>.</p>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Hôm nay ta làm chủ ba việc mà người phỏng vấn thường hỏi. Việc đầu là tín dụng bán lẻ, với hạn mức, tỉ lệ trả nợ trên thu nhập và số tiền thu từng phần. Việc hai là thứ tự an toàn của sổ cái khi khoá tài sản và cấp vốn. Việc ba là đối soát cuối ngày, nơi ta tính số phép so sánh ở ba cỡ dữ liệu.
- id: prereq
  kind: prereq
  title: 'Trước hết: các từ cần biết của tín dụng bán lẻ'
  checks:
  - 100 * 85 // 100 == 85
  - 12 / 30 == 0.4
  steps:
  - show: |-
      <p><b>Giải nghĩa các từ sẽ xuất hiện trên sơ đồ</b>:</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>Thấu chi, phong tỏa, AZ, CASA</td><td>Cho tiêu quá số dư tới một hạn mức; khoá một khoản tiền để chủ tài khoản không rút được; AZ là phân hệ tiền gửi có kỳ hạn của T24; CASA là tài khoản thanh toán dùng chi tiêu hằng ngày</td></tr>
        <tr><td>LTV</td><td>Tỉ lệ cho vay trên giá trị tài sản bảo đảm. Ví dụ sổ 100 triệu, LTV 85% (tỉ lệ minh hoạ): hạn mức tối đa 100 × 0,85 = 85 triệu</td></tr>
        <tr><td>DTI</td><td>Tỉ lệ tiền trả nợ mỗi tháng trên thu nhập. Ví dụ trả 12 triệu, thu nhập 30 triệu: 12 / 30 = 40%</td></tr>
        <tr><td>Giải ngân</td><td>ngân hàng đưa tiền vay ra cho khách: chuyển tiền vào tài khoản hoặc ghi hạn mức cho khách dùng</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    introduces:
    - int_ltv
    - int_dti
    say: Trước khi xem sơ đồ, ta giải nghĩa các từ sẽ gặp. Thấu chi là cho tiêu quá số dư tới một hạn mức, và phong tỏa là khoá một khoản tiền để chủ tài khoản không rút được. AZ là phân hệ tiền gửi có kỳ hạn của hệ lõi, còn CASA là tài khoản thanh toán dùng chi tiêu hằng ngày. LTV là tỉ lệ cho vay trên giá trị tài sản bảo đảm, ví dụ sổ 100 triệu với tỉ lệ minh hoạ 85 phần trăm thì hạn mức tối đa là 85 triệu. DTI là tỉ lệ tiền trả nợ mỗi tháng trên thu nhập, ví dụ trả 12 triệu trên thu nhập 30 triệu là 40 phần trăm. Giải ngân là ngân hàng đưa tiền vay ra cho khách.
    clear: true
  - show: |-
      <p><b>Giải nghĩa các từ sẽ xuất hiện trên sơ đồ (tiếp)</b>:</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>CIC, năm nhóm nợ</td><td>Trung tâm Thông tin Tín dụng Quốc gia (thuộc Ngân hàng Nhà nước Việt Nam, viết tắt NHNN). Nợ chia 5 nhóm theo TT 31/2024/TT-NHNN (đối chiếu nguồn thứ cấp; thông tư này đã được TT 37/2025/TT-NHNN sửa đổi, cần đối chiếu bản hợp nhất): ví dụ quá hạn 10–90 ngày là nhóm 2 (định nghĩa rút gọn, thông tư còn nêu thêm vài trường hợp khác); nhóm 3–5 là nợ xấu</td></tr>
        <tr><td>Cloud CA, OTP</td><td>Ký số từ xa với chứng thư số giữ ở nhà cung cấp (khung pháp lý cần kiểm lại khi dẫn); OTP là mật khẩu dùng một lần</td></tr>
        <tr><td>B2B; Redis, khoá 300 giây</td><td>B2B: kết nối thẳng giữa hai tổ chức (ngân hàng với CIC). Redis: phần mềm giữ dữ liệu trong bộ nhớ, rất nhanh, nhiều máy chủ dùng chung. Trước khi giải ngân, ghi một khoá theo mã khoản vay, tự hết hạn sau 300 giây (số minh hoạ); lệnh giải ngân trùng tới khi khoá còn thì bị chặn</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    introduces:
    - int_cic
    say: CIC là Trung tâm Thông tin Tín dụng Quốc gia, nơi tra nhóm nợ. Ví dụ quá hạn từ 10 đến 90 ngày là nhóm 2, một định nghĩa rút gọn, còn nhóm 3 đến 5 là nợ xấu. Thông tư quy định các nhóm này đã được sửa đổi, nên khi dẫn con số phải đối chiếu bản hợp nhất. Redis là phần mềm giữ dữ liệu trong bộ nhớ, rất nhanh, để nhiều máy chủ dùng chung một chỗ ghi khoá. Trước khi giải ngân, hệ thống ghi một khoá theo mã khoản vay, tự hết hạn sau 300 giây, một số minh hoạ, nên lệnh giải ngân trùng tới trong lúc khoá còn sẽ bị chặn.
    clear: true
  - show: |-
      <p><b>Giải nghĩa các từ về bảo đảm khoản vay và sản phẩm</b>:</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>Tài sản bảo đảm</td><td>tài sản khách đưa ra để bảo đảm trả nợ, ví dụ sổ tiết kiệm hoặc nhà; nếu không trả được, ngân hàng xử lý tài sản đó</td></tr>
        <tr><td>Cầm cố</td><td>giao tài sản cho ngân hàng giữ làm bảo đảm, ví dụ sổ tiết kiệm bị phong tỏa trong lúc còn nợ</td></tr>
        <tr><td>Tín chấp</td><td>vay chỉ dựa vào uy tín và thu nhập của khách, không cần tài sản bảo đảm</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - ['2.3', '2.4']
    say: Ta giải nghĩa thêm một số từ. Tài sản bảo đảm là thứ khách đưa ra để bảo đảm trả nợ, ví dụ sổ tiết kiệm hoặc nhà. Cầm cố là giao tài sản cho ngân hàng giữ, còn tín chấp là vay chỉ dựa vào uy tín và thu nhập.
    clear: true
  - show: |-
      <p><b>Các sản phẩm sẽ gặp trên sơ đồ</b>:</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>Bội số lương</td><td>hạn mức tín chấp tính bằng một số lần lương tháng, ví dụ 3 lần lương (số minh hoạ)</td></tr>
        <tr><td>Rút tiền mặt trả góp, thẻ ảo</td><td>rút tiền từ hạn mức thẻ tín dụng rồi trả dần từng tháng; số thẻ dùng ngay trên điện thoại, chưa cần thẻ nhựa</td></tr>
        <tr><td>Thu hộ</td><td>ngân hàng thu tiền của khách thay cho bên bán (ví dụ tiền điện) rồi chuyển lại cho bên đó</td></tr>
      </table>
    focus:
    - ['2.2', '2.3', '2.4']
    say: Bội số lương là hạn mức tính bằng số lần lương tháng, rút tiền mặt trả góp là rút từ thẻ rồi trả dần, và thu hộ là ngân hàng thu tiền thay bên bán.
    clear: true
