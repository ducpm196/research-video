- id: symbol
  kind: symbol
  title: 'Ký hiệu: ba công thức của tín dụng bán lẻ'
  checks:
  - 100 * 85 // 100 == 85
  - 12 / 30 == 0.4
  - min(2, 5) == 2
  steps:
  - show: |-
      <table class="t">
        <tr><th>đại lượng</th><th>công thức viết bằng chữ</th><th>ví dụ (số minh hoạ)</th></tr>
        <tr><td>Hạn mức tối đa</td><td>giá trị tài sản bảo đảm × LTV</td><td>100 triệu × 0,85 = 85 triệu</td></tr>
        <tr><td>DTI</td><td>tiền trả nợ mỗi tháng / thu nhập mỗi tháng</td><td>12 / 30 = 0,4 = 40%</td></tr>
        <tr><td>Trích nợ từng phần</td><td>thu = số dư khả dụng nếu số dư nhỏ hơn số phải trả; còn thiếu = phải trả − thu</td><td>phải trả 5, có 2 thì thu 2, còn thiếu 3</td></tr>
      </table>
      <p>Ba công thức này đều chỉ là phép nhân, phép chia và phép trừ; điều khó là biết khi nào dùng và khi nào chính sách chặn.</p>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Ba công thức của tín dụng bán lẻ đều chỉ gồm phép nhân, phép chia và phép trừ. Hạn mức bằng giá trị tài sản bảo đảm nhân LTV, ví dụ một trăm triệu nhân không phẩy tám mươi lăm là tám mươi lăm triệu. Tỉ lệ trả nợ bằng tiền trả mỗi tháng chia thu nhập, ví dụ mười hai chia ba mươi là bốn mươi phần trăm. Khi số dư nhỏ hơn số phải trả, thu từng phần bằng số dư và phần thiếu là hiệu của hai số.
- id: check
  kind: check
  title: 'Tự kiểm tra: tính hạn mức, tỉ lệ trả nợ trên thu nhập và số tiền thu từng phần'
  checks:
  - 150 * 80 // 100 == 120
  - round((6 + 4.5) / 25 * 100) == 42
  - 42 < 50
  - round(4.5 - 2.7, 1) == 1.8
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn</b> (số minh hoạ): khách có sổ tiết kiệm <b>150 triệu</b>, tỉ lệ cho vay LTV <b>80%</b>. Thu nhập <b>25 triệu</b> mỗi tháng, đang trả nợ khác <b>6 triệu</b> mỗi tháng, khoản mới phải trả thêm <b>4,5 triệu</b> mỗi tháng. Chính sách ví dụ: chặn duyệt khi DTI trên 50%. Tháng này đến hạn trả <b>4,5 triệu</b> nhưng số dư khả dụng chỉ có <b>2,7 triệu</b>.</p>
      <ul>
        <li>(a) Hạn mức tối đa là bao nhiêu?</li>
        <li>(b) DTI sau khi vay là bao nhiêu, có bị chặn theo chính sách ví dụ không?</li>
        <li>(c) Trích nợ từng phần thu được bao nhiêu, còn thiếu bao nhiêu?</li>
      </ul>
    focus:
    - 1
    - [1, '2.1']
    - '2.2'
    - '2.3'
    pause: 90
    say: Mời bạn tính ba ý của tình huống này, với số minh hoạ trên màn hình. Ý a hỏi hạn mức tối đa của sổ tiết kiệm một trăm năm mươi triệu với tỉ lệ cho vay tám mươi phần trăm. Ý b hỏi tỉ lệ trả nợ trên thu nhập sau khi vay, và có bị chặn theo chính sách ví dụ không. Ý c hỏi số tiền thu từng phần khi số dư không đủ.
  - show: |-
      <p><b>Đáp án từng bước</b>:</p>
      <table class="t">
        <tr><th>ý</th><th>cách tính</th><th>kết quả</th></tr>
        <tr><td>(a) hạn mức</td><td>giá trị sổ × LTV = 150 × 0,80</td><td>120 triệu</td></tr>
        <tr><td>(b) DTI</td><td>(nợ đang trả + khoản mới) / thu nhập = (6 + 4,5) / 25</td><td>10,5 / 25 = 42%, thấp hơn 50% nên không bị chặn</td></tr>
        <tr><td>(c) thu từng phần</td><td>thu bằng số dư khả dụng; còn thiếu = phải trả − đã thu</td><td>thu 2,7 triệu; còn thiếu 4,5 − 2,7 = 1,8 triệu</td></tr>
      </table>
      <div class="box key">Phần thiếu 1,8 triệu vẫn bị tính ngày quá hạn để phân nhóm nợ; trích nợ từng phần không xoá nợ.</div>
    focus:
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    clear: true
    say: Đáp án từng bước như sau, bắt đầu từ hạn mức bằng giá trị sổ nhân tỉ lệ cho vay. Một trăm năm mươi nhân tám mươi phần trăm là một trăm hai mươi triệu. Tỉ lệ trả nợ bằng mười phẩy năm trên hai mươi lăm, là bốn mươi hai phần trăm, thấp hơn năm mươi nên không bị chặn. Thu từng phần bằng số dư khả dụng là hai phẩy bảy triệu, còn thiếu một phẩy tám triệu. Phần thiếu này vẫn bị tính ngày quá hạn, vì trích nợ từng phần không xoá nợ.
- id: example
  kind: example
  title: 'Thực hành: Đối soát Ba bên Cuối ngày EOD bằng Thuật toán Hai con trỏ'
  checks:
  - 3000000 // 1000000 == 3
  - '[x for x in [101, 103, 104, 107, 109] if x not in [101, 102, 104]] == [103, 107, 109]'
  - '[x for x in [101, 102, 104] if x not in [101, 103, 104, 107, 109]] == [102]'
  - 100 - 90 == 10
  - 3000000 * 22 * 3 < 300000000
  - 3 * 3000000 * 22 == 198000000
  - (3 * 10**6) ** 2 == 9 * 10**12
  - 9 * 10**12 / 10**9 / 3600 == 2.5
  - math.ceil(math.log2(3 * 10**6)) == 22
  - round(math.log2(3 * 10**6), 1) == 21.5
  - 2 * (3000000 + 3000000) == 12000000
  - round((198000000 + 12000000) / 10**9, 1) == 0.2
  steps:
  - show: |-
      <p><b>Dữ liệu bài toán giả định: đối soát 3 bên cuối ngày (EOD)</b>:</p>
      <ul>
        <li>EOD (end of day) = khâu xử lý cuối ngày; đối soát = so từng giao dịch giữa sổ của các bên để tìm chỗ lệch.</li>
        <li>Quy mô dữ liệu: $3\,000\,000$ giao dịch trong ngày giữa ngân hàng lõi, NAPAS (công ty chuyển mạch tiền giữa các ngân hàng) và Đối tác (ví dụ minh họa).</li>
        <li>Mục tiêu thiết kế giả định: hoàn tất đối soát trong vòng 5 phút (300 giây).</li>
        <li>Ký hiệu O(…) chỉ cỡ số phép tính khi số giao dịch N lớn: O(N) tăng tỉ lệ thuận với N, O(N log N) cỡ N nhân lôgarit cơ số 2 của N, O(N<sup>2</sup>) cỡ N nhân N.</li>
        <li>Nếu dùng vòng lặp lồng nhau O(N<sup>2</sup>):$(3 \times 10^6)^2 = 9 \times 10^{12}$ phép so sánh cho một cặp danh sách (đối soát đủ hai cặp thì gấp đôi); ở tốc độ giả định $10^9$ phép mỗi giây là 9 000 giây = 2,5 giờ.</li>
      </ul>
    focus:
    - 2
    - '2.1'
    - '2.4'
    - '2.5'
    introduces:
    - int_eod
    say: Ta xem xét bài toán giả định, đối soát cuối ngày với ba triệu giao dịch giữa ngân hàng lõi, cổng chuyển mạch và đối tác thu hộ. Đối soát nghĩa là so từng giao dịch giữa sổ của các bên để tìm chỗ lệch, với mục tiêu thiết kế năm phút. Ký hiệu chữ O kèm ngoặc chỉ cỡ số phép tính khi N lớn, ví dụ O của N bình phương nghĩa là cỡ N nhân N phép tính. Hai vòng lặp lồng nhau cần 9 nghìn tỉ phép so sánh cho một cặp danh sách, và ở tốc độ giả định một tỉ phép mỗi giây, việc đó mất 9000 giây, tức hai giờ rưỡi.
  - show: |-
      <p><b>Bước 1: Sắp xếp các tệp dữ liệu theo Mã đối soát RRN</b>:</p>
      $$\text{Độ phức tạp sắp xếp: } O(N \log N) \text{ với thuật toán TimSort}$$
      <p class="note">TimSort: cách sắp xếp có sẵn trong thư viện của Python và Java, ghép dần các đoạn đã có thứ tự. Cỡ N log N phép so sánh là mức thấp nhất mà mọi cách sắp xếp chỉ dựa vào phép so sánh đều phải tốn trong trường hợp xấu nhất.</p>
      <div class="box key">Sau khi sắp xếp, cả 3 danh sách giao dịch đều có trật tự mã đối soát tăng dần!</div>
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta sắp xếp các tệp dữ liệu theo mã đối soát tăng dần bằng thuật toán sắp xếp có sẵn trong thư viện. Số phép so sánh cỡ N nhân lôgarit của N, mức thấp nhất mà mọi cách sắp xếp dựa vào phép so sánh đều phải tốn trong trường hợp xấu nhất. Sau bước này, toàn bộ hàng triệu bản ghi của ba bên đều nằm trên một đường thẳng có thứ tự hoàn hảo.
    clear: true
  - show: |-
      <p><b>Chạy tay hai con trỏ trên hai danh sách nhỏ</b> (mã đối soát đã sắp xếp, số minh hoạ):</p>
      <ul>
        <li>Mảng = dãy ô xếp liền nhau, mỗi ô có chỉ số 0, 1, 2…; core = [101, 103, 104, 107, 109] (5 ô), napas = [101, 102, 104] (3 ô).</li>
        <li>Con trỏ = một số nhớ ô đang xét; i cho core, j cho napas, cùng bắt đầu từ 0. Viết i++ là tăng i lên 1, tức nhích sang ô kế.</li>
        <li>Vòng lặp while = làm đi làm lại khi điều kiện còn đúng; ở đây lặp khi cả hai con trỏ còn nằm trong danh sách.</li>
      </ul>
    focus:
    - 1
    - '2.1'
    - '2.2'
    - '2.3'
    clear: true
    say: Trước khi xem mã, ta chạy tay thuật toán trên hai danh sách nhỏ đã sắp xếp theo mã đối soát. Mảng là dãy ô xếp liền nhau, mỗi ô có chỉ số bắt đầu từ 0, ở đây danh sách của lõi có 5 ô và danh sách của cổng chuyển mạch có 3 ô. Con trỏ chỉ là một con số nhớ ô đang xét, i cho danh sách thứ nhất và j cho danh sách thứ hai, đều bắt đầu từ 0. Vòng lặp là làm đi làm lại khi điều kiện còn đúng, và viết i hai dấu cộng nghĩa là tăng i thêm 1, tức nhích sang ô kế tiếp.
  - show: |-
      <p><b>Chạy tay từng bước</b> (core = [101, 103, 104, 107, 109]; napas = [101, 102, 104]):</p>
      <table class="t">
        <tr><th>bước</th><th>i, j</th><th>core[i] so napas[j]</th><th>việc làm</th></tr>
        <tr><td>1</td><td>0, 0</td><td>101 = 101</td><td>khớp; i++ và j++</td></tr>
        <tr><td>2</td><td>1, 1</td><td>103 &gt; 102</td><td>102 chỉ có ở napas; j++</td></tr>
        <tr><td>3</td><td>1, 2</td><td>103 &lt; 104</td><td>103 chỉ có ở core; i++</td></tr>
        <tr><td>4</td><td>2, 2</td><td>104 = 104</td><td>khớp; i++ và j++</td></tr>
        <tr><td>5</td><td>3, 3</td><td>napas đã hết</td><td>107 và 109 còn dư ở core: đều là lệch</td></tr>
      </table>
    focus:
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.6'
    clear: true
    say: Bước một, hai ô đầu cùng là 101 nên khớp, và cả hai con trỏ cùng nhích lên. Bước hai, 103 lớn hơn 102, nên 102 chỉ có ở cổng chuyển mạch và chỉ con trỏ thứ hai nhích. Bước ba, 103 nhỏ hơn 104, nên 103 chỉ có ở lõi và chỉ con trỏ thứ nhất nhích. Bước bốn, hai ô cùng là 104 nên lại khớp, rồi cả hai nhích lên. Bước năm, danh sách thứ hai đã hết, nên 107 và 109 còn dư bên lõi đều là giao dịch lệch.
  - show: |-
      <p><b>Đọc trước mã giả hai con trỏ</b> (mã giả = mã viết gần giống chương trình thật để nắm ý):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>i = 0; j = 0;  // ...</td><td>hai con trỏ cùng bắt đầu ở ô 0; từ // tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>while (điều kiện) { ... }</td><td>làm đi làm lại phần trong ngoặc nhọn khi điều kiện còn đúng</td></tr>
        <tr><td>i &lt; core.size() &amp;&amp; j &lt; napas.size()</td><td>core.size() là số ô của danh sách core; &lt; là nhỏ hơn; &amp;&amp; nghĩa là "và": lặp khi cả hai con trỏ còn nằm trong danh sách</td></tr>
        <tr><td>core[i].rrn</td><td>mã đối soát (RRN) của ô thứ i trong core</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3', '2.4']
    clear: true
    say: Trước khi xem mã giả, ta đọc cú pháp. Hai con trỏ bắt đầu ở ô không, và vòng lặp chạy khi cả hai còn nằm trong danh sách, trong đó hai dấu và nghĩa là cả hai vế cùng đúng.
  - show: |-
      <p><b>Đọc tiếp mã giả</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>if (A == B) ... else if (A &lt; B) ... else ...</td><td>nếu A bằng B thì việc một; nếu không, nếu A nhỏ hơn B thì việc hai; còn lại thì việc ba; == là so sánh bằng</td></tr>
        <tr><td>matchOrFlagAmount(...), reportMissingInNapas(...), reportMissingInCore(...)</td><td>ba hàm, tên cho biết việc làm: so khớp và kiểm số tiền; báo thiếu bên napas; báo thiếu bên core</td></tr>
        <tr><td>core[i++]</td><td>lấy ô i, rồi tăng i thêm 1</td></tr>
        <tr><td>Giả định</td><td>mã RRN duy nhất trong mỗi danh sách và cả hai danh sách sắp xếp cùng kiểu</td></tr>
      </table>
    focus:
    - '2.2'
    - ['2.3', '2.4']
    clear: true
    say: Khối nếu rồi nếu không thì chọn một trong ba việc theo so sánh hai mã, với hai dấu bằng là so sánh bằng. Ba hàm báo cáo có tên cho biết việc làm, và i hai dấu cộng là lấy ô rồi nhích sang ô kế.
  - show: |-
      <p><b>Bước 2: Duyệt đồng thời bằng Thuật toán Hai con trỏ O(N)</b> (mã giả):</p>
      <pre><code>i = 0; j = 0;  // hai con trỏ cùng bắt đầu ở ô 0
      while (i < core.size() && j < napas.size()) {  // i, j chỉ tiến
          if (core[i].rrn == napas[j].rrn)
              matchOrFlagAmount(core[i++], napas[j++]);  // so cả số tiền
          else if (core[i].rrn < napas[j].rrn) reportMissingInNapas(core[i++]);
          else reportMissingInCore(napas[j++]);
      }
      while (i < core.size())  reportMissingInNapas(core[i++]);  // phần dư = lệch
      while (j < napas.size()) reportMissingInCore(napas[j++]);
      // lặp lại cách này giữa NAPAS và Đối tác</code></pre>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước hai, ta áp dụng giải thuật hai con trỏ tịnh tiến đồng thời. Con trỏ chỉ duyệt tiến một chiều nên mỗi bản ghi được xem đúng một lần, độ phức tạp tuyến tính. Các giao dịch trùng mã được so thêm số tiền, còn các lệnh lệch được tách riêng vào danh sách nghi vấn. Khi một danh sách đã hết, phần còn dư của danh sách kia đều là lệch, và ta lặp lại cách này giữa NAPAS với đối tác.
    clear: true
- id: quymo
  kind: example
  title: 'Khi dữ liệu lớn dần: vòng lặp lồng nhau gãy, hai con trỏ vẫn chạy'
  checks:
  - round(3 * 10**6 * 3 * 10**6 / 1e9 / 3600, 1) == 2.5
  - round((3 * 10**7) ** 2 / 1e9 / 3600, 1) == 250.0
  - round((3 * 10**8) ** 2 / 1e9 / 3600, 1) == 25000.0
  - round((3 * 3 * 10**6 * 22 + 2 * (2 * 3 * 10**6)) / 1e9, 2) == 0.21
  - round((3 * 3 * 10**7 * math.ceil(math.log2(3 * 10**7)) + 2 * (2 * 3 * 10**7)) / 1e9, 2) == 2.37
  - round((3 * 3 * 10**8 * math.ceil(math.log2(3 * 10**8)) + 2 * (2 * 3 * 10**8)) / 1e9, 2) == 27.3
  - 3 * 10**7 * 100 * 3 / 1e9 == 9.0
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b> (Python là ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td style="white-space:nowrap">import math</td><td>lấy sẵn bộ công cụ toán của Python: math.log2, math.ceil</td></tr>
        <tr><td style="white-space:nowrap">for n in (3 * 10**6, 3 * 10**7, 3 * 10**8):</td><td>thử lần lượt 3 triệu, 30 triệu, 300 triệu giao dịch (10**6 là 10 mũ 6); các dòng thụt vào là phần được lặp</td></tr>
        <tr><td style="white-space:nowrap">lap = n * n / 1e9 / 3600  # ...</td><td>n nhân n phép so sánh, chia 1e9 (một tỉ phép mỗi giây) ra giây, chia 3600 ra giờ; từ dấu # tới hết dòng là ghi chú</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3', '2.4']
    clear: true
    say: Trước khi chạy, ta đọc mã Python. Dòng đầu lấy sẵn bộ công cụ toán, dòng lặp thử ba cỡ dữ liệu, và một e chín là một tỉ phép mỗi giây.
  - show: |
      <p><b>Đọc tiếp: công thức của cột sắp xếp</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>xep = 3 * n * math.ceil(math.log2(n)) + 2 * (n + n)</td><td>3 lần sắp xếp (ba danh sách), mỗi lần n × ⌈log₂ n⌉ phép so sánh; cộng 2 lượt hai con trỏ (hai cặp danh sách), mỗi lượt đi qua n + n bản ghi</td></tr>
        <tr><td>math.ceil(math.log2(n))</td><td>log2(n) là số lần gấp đôi 1 để tới n; ceil làm tròn lên</td></tr>
        <tr><td>print(...), round(x, 1)</td><td>in các phần trong ngoặc ra màn hình; làm tròn, giữ một chữ số sau dấu phẩy</td></tr>
      </table>
    focus:
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: Số phép của cột sắp xếp là ba lần N nhân lôgarit cơ số hai của N làm tròn lên, vì có ba danh sách, cộng hai lượt hai con trỏ đi qua hai danh sách. Lôgarit cơ số hai là số lần gấp đôi một để tới N. Lệnh in hiện kết quả đã làm tròn.
  - show: |
      <p><b>Chạy thật bằng Python: số giao dịch tăng ×1, ×10, ×100</b> (giả định 1 tỉ phép so sánh mỗi giây, 100 byte mỗi bản ghi: số minh hoạ; cột vòng lặp lồng nhau tính một cặp danh sách, cột sắp xếp tính cả 3 danh sách)</p><div class="code"><div>import math</div><div>for n in (3 * 10**6, 3 * 10**7, 3 * 10**8):</div><div>    lap = n * n / 1e9 / 3600   # gio, hai vong lap long nhau</div><div>    xep = 3 * n * math.ceil(math.log2(n)) + 2 * (n + n)   # 3 danh sach + hai con tro</div><div>    toc = round(xep / 1e9, 2)</div><div>    print(n, 'gd:', round(lap, 1), 'gio vs', toc, 'giay;', round(n * 100 / 1e9, 1), 'GB/ds')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>3000000 gd: 2.5 gio vs 0.21 giay; 0.3 GB/ds</div><div>30000000 gd: 250.0 gio vs 2.37 giay; 3.0 GB/ds</div><div>300000000 gd: 25000.0 gio vs 27.3 giay; 30.0 GB/ds</div></div>
    focus:
    - 2
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, giả định một tỉ phép so sánh mỗi giây và mỗi bản ghi một trăm byte, một số minh hoạ. Với ba triệu giao dịch, hai vòng lặp lồng nhau mất hai phẩy năm giờ cho một cặp danh sách, còn sắp xếp cộng hai con trỏ cho cả ba danh sách chỉ khoảng 0 phẩy 21 giây. Gấp mười lần, vòng lặp lồng nhau mất 250 giờ, còn cách sắp xếp mất chưa tới ba giây. Gấp một trăm lần, mỗi danh sách nặng ba mươi gigabyte, nên không còn nằm vừa trong bộ nhớ của một máy.
  - show: |
      <table class="t">
        <tr><th>số giao dịch</th><th>vòng lặp lồng nhau (một cặp)</th><th>sắp xếp + hai con trỏ (3 danh sách)</th><th>điều gì gãy, cách xử lý</th></tr>
        <tr><td>3 triệu (×1)</td><td>2,5 giờ</td><td>0,21 giây</td><td>vòng lặp lồng nhau đã quá mục tiêu 5 phút; sắp xếp thì dư sức</td></tr>
        <tr><td>30 triệu (×10)</td><td>250 giờ</td><td>2,37 giây</td><td>3 danh sách khoảng 9 GB, một máy 16 GB còn vừa nhưng sát</td></tr>
        <tr><td>300 triệu (×100)</td><td>25 000 giờ</td><td>27,3 giây</td><td>danh sách vượt bộ nhớ: sắp xếp ngoài bộ nhớ (chia thành mảnh vừa bộ nhớ, sắp từng mảnh rồi trộn lại), hoặc chia theo dải mã đối soát rồi đối soát từng mảnh</td></tr>
      </table>
      <p>Đánh đổi: chia mảnh cần thêm bước chia và gộp kết quả, và thời gian đọc ghi tệp thường vượt thời gian so sánh nên phải đo thật.</p>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bảng này cho thấy điều gì gãy khi số giao dịch tăng. Ở ba triệu, vòng lặp lồng nhau đã vượt mục tiêu năm phút, còn sắp xếp thì dư sức. Ở ba mươi triệu, ba danh sách khoảng chín gigabyte, một máy mười sáu gigabyte còn vừa nhưng sát. Ở ba trăm triệu, danh sách vượt bộ nhớ nên ta sắp xếp ngoài bộ nhớ, tức chia thành mảnh vừa bộ nhớ, sắp từng mảnh rồi trộn lại.
- id: pitfall
  kind: pitfall
  title: 'Bẫy: khoá giải ngân hết hạn trước khi hệ lõi kịp trả lời'
  checks:
  - 350 > 300
  - 2 * 120 == 240
  - 240 < 300
  steps:
  - show: |-
      <div class="box pit">Sai lầm hay gặp: tin rằng khoá Redis 300 giây (số minh hoạ) chặn được mọi lệnh giải ngân trùng.</div>
      <p>Tình huống: hệ lõi quá tải nên trả lời sau 400 giây. Bên gọi hết kiên nhẫn và gửi lại lệnh ở giây thứ 350.</p>
      <table class="t">
        <tr><th>thời điểm</th><th>khoá Redis</th><th>điều xảy ra</th></tr>
        <tr><td>giây 0</td><td>đặt khoá, sống 300 giây</td><td>lệnh thứ nhất gửi sang hệ lõi</td></tr>
        <tr><td>giây 300</td><td>khoá tự hết hạn</td><td>hệ lõi vẫn chưa trả lời</td></tr>
        <tr><td>giây 350</td><td>không còn khoá</td><td>lệnh thứ hai qua được, giải ngân lần hai</td></tr>
        <tr><td>giây 400</td><td>không còn khoá</td><td>cả hai lệnh đều được ghi: khoản vay giải ngân hai lần</td></tr>
      </table>
    focus:
    - 1
    - 2
    - '3.2'
    - '3.3'
    - '3.4'
    - '3.5'
    say: Sai lầm hay gặp là tin rằng khoá Redis ba trăm giây, một số minh hoạ, chặn được mọi lệnh giải ngân trùng. Giả sử hệ lõi quá tải nên trả lời sau bốn trăm giây, còn bên gọi hết kiên nhẫn và gửi lại ở giây thứ ba trăm năm mươi. Ở giây không, khoá được đặt và lệnh thứ nhất sang hệ lõi. Ở giây ba trăm khoá hết hạn trong khi hệ lõi chưa trả lời. Ở giây ba trăm năm mươi không còn khoá nên lệnh thứ hai qua được. Đến giây bốn trăm cả hai lệnh đều được ghi, nên khoản vay bị giải ngân hai lần.
  - show: |-
      <table class="t">
        <tr><th>lớp chặn</th><th>cách làm</th><th>vì sao cần</th></tr>
        <tr><td>Khoá sớm (lớp chặn 1)</td><td>quy tắc kinh nghiệm: thời gian sống của khoá thường chọn ít nhất gấp đôi thời gian chờ tối đa; chờ tối đa 120 giây thì khoá ít nhất 240 giây</td><td>giữ khoá còn sống suốt lúc lệnh đang chạy, chưa có trả lời</td></tr>
        <tr><td>Lớp cuối (lớp chặn 2)</td><td>ràng buộc duy nhất (cơ sở dữ liệu từ chối dòng thứ hai trùng mã) theo mã khoản vay và lần giải ngân ở hệ lõi</td><td>khoá Redis vẫn có thể mất hoặc hết hạn, còn ràng buộc thì từ chối bản ghi thứ hai</td></tr>
        <tr><td>Đối soát (lớp phát hiện, không chặn)</td><td>so sổ hệ lõi với sổ giải ngân cuối ngày</td><td>bắt ca lọt lưới trước khi tiền thất thoát</td></tr>
      </table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Cách chữa gồm hai lớp chặn và một lớp phát hiện, và lớp chặn đầu là một quy tắc kinh nghiệm, đặt thời gian sống của khoá ít nhất gấp đôi thời gian chờ tối đa. Lớp chặn cuối là ràng buộc duy nhất theo mã khoản vay và lần giải ngân ở cơ sở dữ liệu của hệ lõi, vì khoá Redis vẫn có thể mất. Lớp phát hiện là đối soát cuối ngày để bắt ca lọt lưới.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: Thứ tự Hai pha khi Cấp Thấu chi Cầm cố'
  checks:
  - 100 - 85 == 15
  - 90 > 85
  steps:
  - show: |-
      <p><b>Câu hỏi trắc nghiệm nghiệp vụ tín dụng</b>: Khi cấp hạn mức thấu chi cầm cố sổ tiết kiệm 100 triệu với tỉ lệ cấp vốn 85% (tỉ lệ minh hoạ), thứ tự điều phối nào sau đây bảo đảm an toàn sổ cái?</p>
      <ul>
        <li><b>A</b>: Mở hạn mức thấu chi 85 triệu trước, sau đó gửi thông báo phong tỏa sổ tiết kiệm sau.</li>
        <li><b>B</b>: Phong tỏa số dư sổ tiết kiệm trên phân hệ tiền gửi Core T24 trước, sau khi thành công mới cấp hạn mức thấu chi vào tài khoản thanh toán CASA.</li>
        <li><b>C</b>: Giải ngân tiền mặt trực tiếp cho khách hàng mà không cần ghi nhận vào ngân hàng lõi.</li>
        <li><b>D</b>: Chờ khách hàng ký giấy tờ tại quầy mới thực hiện thao tác.</li>
      </ul>
    focus:
    - 0
    say: Xin mời bạn chọn quy trình hai pha đúng khi cấp hạn mức thấu chi cầm cố.
    pause: 15
  - show: |-
      <div class="box key"><b>Đáp án chính xác là B</b>!</div>
      <p><b>Bước 1 — Nguyên tắc tài sản bảo đảm trong ngân hàng</b>:</p>
      <table class="t">
        <tr><th>trình tự</th><th>thao tác Core T24</th><th>ý nghĩa quản trị rủi ro</th></tr>
        <tr><td>Pha 1: Phong tỏa</td><td>Phong tỏa sổ tiết kiệm trên Core T24</td><td>Khách hàng không thể rút tiền gửi khi đang vay</td></tr>
        <tr><td>Giữa hai pha: Ký hợp đồng</td><td>Khách ký hợp đồng (có thể ký số từ xa); thứ tự này là minh hoạ, quy trình thật theo hợp đồng cầm cố của ngân hàng</td><td>Có căn cứ pháp lý trước khi cấp vốn</td></tr>
        <tr><td>Pha 2: Cấp vốn</td><td>Ghi hạn mức thấu chi 85 triệu vào CASA (tài khoản thanh toán)</td><td>Chỉ cấp vốn khi tài sản bảo đảm đã an toàn</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án B. Sổ tiết kiệm đóng vai trò là tài sản bảo đảm nên bắt buộc phải được phong tỏa an toàn trước. Sau khi phong tỏa, khách ký hợp đồng, có thể bằng chữ ký số từ xa. Chỉ khi các bước đó thành công thì hạn mức 85 triệu mới được ghi vào tài khoản thanh toán.
    clear: true
  - show: |-
      <p><b>Bước 2 — Cơ chế phục hồi khi pha 2 gặp sự cố</b>:</p>
      <div class="box key">Nếu hệ lõi từ chối rõ ràng việc cấp hạn mức, hệ thống tự động phát lệnh mở phong tỏa sổ tiết kiệm để trả lại trạng thái nguyên vẹn cho khách hàng, hạn chế rủi ro tài sản bị khoá oan (nếu lệnh mở cũng lỗi thì đưa vào hàng đợi thử lại và đối soát). Nếu chỉ lỗi mạng hoặc hết giờ chờ thì kết quả là chưa biết: truy vấn T24 trước, chỉ mở phong tỏa khi chắc chắn hạn mức chưa được ghi.</div>
    focus:
    - 0
    - 0
    say: Bước hai, nếu hệ lõi từ chối rõ ràng việc cấp hạn mức, hệ thống giải tỏa phong tỏa để trả sổ tiết kiệm về trạng thái ban đầu. Còn nếu chỉ lỗi mạng hoặc hết giờ chờ, hệ thống phải hỏi lại hệ lõi trước, vì hạn mức có thể đã được ghi.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: câu phỏng vấn có số về LTV, DTI, trích nợ từng phần và đối soát'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi bốn ý nhỏ: (1) sổ tiết kiệm <b>240 triệu</b> với LTV <b>70%</b> thì hạn mức tối đa; (2) trả nợ <b>9 triệu</b> mỗi tháng trên thu nhập <b>36 triệu</b> thì DTI; (3) đến hạn phải trả <b>12 triệu</b> nhưng số dư khả dụng chỉ <b>7,5 triệu</b> thì thu từng phần được bao nhiêu và còn thiếu bao nhiêu; (4) đối soát ba danh sách mỗi danh sách <b>2 000 000</b> giao dịch, tốc độ <b>10<sup>9</sup></b> phép so sánh mỗi giây: hai vòng lặp lồng nhau mất mấy giờ, và sắp xếp cộng hai con trỏ mất mấy giây.</p>
      <p class="note">Công thức sắp xếp + hai con trỏ như trong bài: 3 × N × ⌈log₂ N⌉ + 2 × (N + N). Định dạng năm dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 1
    - 1
    pause: 240
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Tính hạn mức theo tỉ lệ cho vay trên sổ tiết kiệm hai trăm bốn mươi triệu, rồi tỉ lệ trả nợ trên thu nhập. Tiếp theo tính số tiền thu từng phần và phần còn thiếu khi số dư không đủ trả. Cuối cùng tính thời gian đối soát hai triệu giao dịch bằng hai cách, và hãy dừng video tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>han muc LTV 70%: 168 trieu</div><div>DTI: 25%</div><div>thu tung phan: 7.5 trieu, con thieu 4.5 trieu</div><div>doi soat long nhau: 1.1 gio</div><div>doi soat sap xep: 0.13 giay</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L08/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> hạn mức = giá trị sổ × LTV. DTI = tiền trả nợ mỗi tháng chia thu nhập mỗi tháng. Thu từng phần = số dư khả dụng; còn thiếu = phải trả − số thu được. Hai vòng lặp lồng nhau: N × N phép so sánh, chia 10<sup>9</sup> được giây, chia 3 600 được giờ. Sắp xếp: ⌈log₂ 2 000 000⌉ = 21 (vì 2<sup>20</sup> = 1 048 576 chưa tới 2 triệu, còn 2<sup>21</sup> = 2 097 152 đã vượt).
      Lời giải đầy đủ ở <code>labs/INT/L08/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, hạn mức bằng giá trị sổ nhân tỉ lệ cho vay, còn tỉ lệ trả nợ bằng tiền trả chia thu nhập. Số thu từng phần bằng số dư khả dụng, và phần còn thiếu bằng số phải trả trừ số đã thu. Hai vòng lặp lồng nhau tốn N nhân N phép so sánh, còn lôgarit cơ số hai của hai triệu làm tròn lên là hai mươi mốt. Lời giải đầy đủ nằm trong thư mục thực hành.
