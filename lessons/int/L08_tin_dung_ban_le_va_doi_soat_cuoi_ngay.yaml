objectives:
- Nêu sáu mảng tín dụng bán lẻ và các khái niệm LTV, DTI, CIC, trích nợ từng phần
- Tính hạn mức theo LTV, tỉ lệ DTI và số tiền thu từng phần khi số dư không đủ trả
- Đọc cách đối soát hai danh sách đã sắp xếp bằng hai con trỏ, trong đó mỗi bản ghi chỉ được xem đúng một lần
- Tính số phép so sánh của đối soát ba bên cuối ngày bằng vòng lặp lồng nhau và bằng sắp xếp cộng hai con trỏ ở ba cỡ dữ liệu
- Nêu vì sao khoá giải ngân hết hạn trước khi hệ lõi trả lời gây giải ngân trùng, và hai lớp chặn cần có
- Nêu thứ tự hai pha khi cấp thấu chi cầm cố và cách phục hồi khi pha hai lỗi
- 'Trả lời một câu phỏng vấn có số: hạn mức theo LTV, tỉ lệ DTI, trích nợ từng phần và số phép so sánh của đối soát'
