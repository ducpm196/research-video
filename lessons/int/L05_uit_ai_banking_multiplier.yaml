    focus:
    - 0
    - 0
    - 0
    say: Để áp dụng học máy vào ngân hàng mà không làm nghẽn giao dịch, ta sử dụng
      kiến trúc đường dẫn kép. Đường dẫn nhanh thực thi mô hình siêu nhẹ trực tiếp
      trong bộ nhớ ứng dụng với mục tiêu thiết kế chỉ vài mili giây. Trong khi đó, đường dẫn
      chậm đẩy dữ liệu vào hàng đợi để các mô hình đồ thị sâu phân tích quan hệ ngầm.
  - show: '<div class="box key">ONNX Runtime trong Java: Mô hình Isolation Forest
      xuất sang ONNX và chạy qua lõi mã máy C++ ngay trong tiến trình. Mục tiêu thiết
      kế: vài mili giây mỗi lần suy luận để nằm gọn trong ngân sách độ trễ của cổng
      thanh toán; con số thật phải đo bằng benchmark (JMH, p95/p99).</div>

      <p>ONNX = định dạng chung để lưu mô hình học máy, nạp được từ Java. Ngân sách độ
      trễ = phần thời gian tối đa được phép dùng trong một giao dịch. p99 = 99% yêu cầu
      nhanh hơn mức này; JMH = công cụ đo hiệu năng cho Java.</p>'
    focus:
    - 0
    - 0
    - 0
    say: ONNX là định dạng chung để lưu mô hình học máy, và ngân sách độ trễ là phần thời gian tối đa được phép dùng trong một giao dịch. Điểm then chốt là việc nạp mô hình trực tiếp vào bộ nhớ ứng dụng thông qua
      lõi mã máy, không phải gọi qua mạng. Mục tiêu thiết kế là chỉ vài mili giây cho
      mỗi lần tính điểm rủi ro, còn con số thật phải đo bằng phép đo hiệu năng trước
      khi nói ra.
    clear: true
- id: symbol
  kind: symbol
  title: Công thức Thuật toán Định tuyến Thông minh và So khớp Ngữ nghĩa
  checks:
  - 5 - 3 == 2
  - 15 * 60 == 900
  - round(0.9 + math.sqrt(2 * math.log(110) / 100), 2) == 1.21
  - round(0.8 + math.sqrt(2 * math.log(110) / 10), 2) == 1.77
  - 1 * 2 + 2 * 3 == 8
  - round(8 / math.sqrt(5 * 13), 3) == 0.992
  steps:
  - show: '<p><b>Công thức Định tuyến Đa kênh với Thuật toán Bandit UCB1</b>:</p>

      <div class="box key">

      $$\text{Điểm tin cậy kênh } k: \text{Score}_k = \hat{\mu}_k + c \sqrt{\frac{\ln
      N}{N_k}}$$

      $$\text{Độ tương đồng Cosine ngữ nghĩa: } \cos(\vec{u}, \vec{v}) = \frac{\vec{u}
      \cdot \vec{v}}{\|\vec{u}\| \|\vec{v}\|}$$

      </div>

      <p>$\hat{\mu}_k$ = tỉ lệ thành công đo được của kênh $k$; $N$ = tổng số lần
      thử mọi kênh; $N_k$ = số lần đã thử kênh $k$; $c$ = hệ số khám phá. UCB1 nguyên
      thủy (Auer, Cesa-Bianchi, Fischer, 2002) đếm từ đầu; bản đo trong cửa sổ trượt 15 phút
      là một biến thể. Chỉ chọn trong các kênh hợp lệ (ý tưởng thiết kế).</p>'
    focus:
    - 0
    - 0
    - 0
    say: Công thức cận tin cậy trên của bài toán máy đánh bạc nhiều tay, được công bố năm 2002, chấm điểm từng kênh chuyển tiền bằng hai phần cộng lại.
      Phần đầu là tỉ lệ thành công đo được, phần sau là phần thưởng khám phá, càng lớn khi kênh đó còn ít được thử.
      Khi một cổng chuyển mạch gặp sự cố, tỉ lệ thành công giảm và lưu lượng chuyển sang kênh
      khác, nhưng chỉ trong các kênh mà quy định nghiệp vụ cho phép.
  - show: |-
      <p><b>Ví dụ số (minh hoạ), chọn $c = \sqrt{2}$</b>: đã thử tổng $N = 110$ lần.</p>
      <ul>
        <li>Kênh A: 90 thành công / 100 lần → $0{,}9 + \sqrt{2 \ln 110 / 100} \approx 0{,}9 + 0{,}31 = 1{,}21$</li>
        <li>Kênh B: 8 thành công / 10 lần → $0{,}8 + \sqrt{2 \ln 110 / 10} \approx 0{,}8 + 0{,}97 = 1{,}77$</li>
        <li>Lần tới chọn B để thử thêm, dù tỉ lệ thành công thấp hơn; thử nhiều rồi thì phần khám phá của B nhỏ lại.</li>
        <li>Cosine 2 chiều: $\vec{u} = (1, 2)$, $\vec{v} = (2, 3)$: tích vô hướng $1 \cdot 2 + 2 \cdot 3 = 8$; $\cos = 8 / (\sqrt{5}\sqrt{13}) \approx 0{,}992$, gần 1 nghĩa là hai vector gần cùng hướng.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Lấy ví dụ minh hoạ, đã thử tổng cộng 110 lần, kênh A thành công 90 trên 100 lần nên điểm khoảng 0 phẩy 9 cộng 0 phẩy 31, bằng 1 phẩy 21.
      Kênh B thành công 8 trên 10 lần, điểm khoảng 0 phẩy 8 cộng 0 phẩy 97, bằng 1 phẩy 77, nên lần tới ta thử B thêm dù tỉ lệ thấp hơn.
      Với độ tương đồng Cosine, hai véc tơ 1, 2 và 2, 3 có tích vô hướng bằng 8, chia cho căn 5 nhân căn 13 được khoảng 0 phẩy 992.
      Con số gần 1 nghĩa là hai véc tơ gần cùng hướng, tức hai câu có nghĩa gần nhau.
    clear: true
