objectives:
- Nêu các khối kiến thức của chương trình Cử nhân AI ở UIT và nói đúng mốc dự kiến tốt nghiệp cuối năm 2026
- 'Trình bày kiến trúc đường dẫn kép: mô hình nhẹ ở luồng đồng bộ, mô hình nặng ở luồng bất đồng bộ'
- Tính vận tốc di chuyển, điểm Z, điểm UCB1 và độ tương đồng cosine bằng mã Python chạy thật
- Tính số nhân xử lý cần cho mô hình nhẹ và mô hình nặng ở ba mức tải
- Xác định ngưỡng điểm rủi ro của mô hình khác ngưỡng xác thực sinh trắc học theo quy định
- Nêu cách trả lời trung thực khi được hỏi vì sao đang làm tích hợp lại học Cử nhân AI
- Trả lời một câu phỏng vấn có số về số nhân xử lý, điểm Z, UCB1 và cosine
