      \ làm nghiên cứu dữ liệu?</p>\n<ul>\n  <li>(A) Trả lời là vì thích học thêm\
      \ để chuyển ngành sang làm khoa học dữ liệu.</li>\n  <li>(B) Trả lời thẳng thắn:\
      \ Mục tiêu nhất quán là trở thành Kỹ sư Kiến trúc Tích hợp Cấp cao, và AI là\
      \ nền toán học giúp hiểu các bài toán như phát hiện bất thường, vốn khó giải\
      \ bằng luật if-else thuần túy.</li>\n  <li>(C) Trả lời\
      \ là học để lấy thêm bằng cấp cho đẹp hồ sơ.</li>\n</ul>"
