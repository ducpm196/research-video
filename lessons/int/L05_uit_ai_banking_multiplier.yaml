  - show: "<p><b>Mô hình Đường dẫn Kép Dual-Path Architecture trong Phòng chống Gian\
      \ lận</b>:</p>\n<svg viewBox=\"0 0 700 220\" style=\"width:100%;max-height:200px;\"\
      >\n  <rect x=\"20\" y=\"80\" width=\"140\" height=\"60\" rx=\"6\" fill=\"#e8f4fd\"\
      \ stroke=\"#003366\" stroke-width=\"2\"/>\n  <text x=\"35\" y=\"115\" font-size=\"\
      12\" font-weight=\"bold\" fill=\"#003366\">Giao dịch Inbound</text>\n  <path\
      \ d=\"M 160 95 L 230 50\" stroke=\"#28a745\" stroke-width=\"2\"/>\n  <rect x=\"\
