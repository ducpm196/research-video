      <p>Phân biệt với quy định của Ngân hàng Nhà nước: báo chí nêu, chuyển tiền trực tuyến của khách cá nhân trên 10 triệu đồng một lần hoặc tổng trong ngày trên 20 triệu đồng phải xác thực sinh trắc học. Có nơi gắn ngưỡng này với Thông tư 50/2024/TT-NHNN (đã được sửa đổi bởi Thông tư 77/2025/TT-NHNN), có nơi gắn với Quyết định 2345/QĐ-NHNN; chưa đọc nguyên văn các văn bản này, chưa kiểm biên "trên" hay "từ"; bài không nêu số điều hay phụ lục, khi làm thật hãy mở văn bản hiện hành. Đó là ngưỡng theo quy định, khác ngưỡng điểm rủi ro của mô hình.</p>
