- id: example
  kind: example
  title: 'Thực hành: Phát hiện Gian lận Thẻ trong Ngân sách Độ trễ'
  checks:
  - 1100 / 0.25 == 4400
  - 4400 > 900
  - 300 // 60 == 5
  - round((30 - 2) / 1.5, 2) == 18.67
  steps:
  - show: "<p><b>Đề bài giả định: bảo vệ thẻ tín dụng số</b>:</p>\n<ul>\n\
      \  <li>Tình huống: Khách hàng vừa rút tiền tại Thành phố Hồ Chí Minh lúc 10h00,\
      \ đến 10h15 xuất hiện giao dịch quẹt thẻ tại Singapore.</li>\n  <li>Khoảng cách\
      \ địa lý: khoảng $1\\,100$ km đường chim bay (làm tròn) trong 15 phút = 0,25 giờ:\
      \ $1\\,100 / 0{,}25 = 4\\,400$ km/h, gần gấp năm máy bay chở khách (khoảng 900 km/h).</li>\n\
      \  <li>Yêu cầu: Phát hiện và chặn đứng giao dịch gian lận trước\
      \ khi gửi lệnh sang ngân hàng lõi.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét tình huống khách hàng vừa thực hiện giao dịch tại Thành phố Hồ Chí Minh,
      nhưng chỉ mười lăm phút sau lại xuất hiện giao dịch tại Xin-ga-po. Hai nơi cách nhau khoảng một nghìn một trăm cây số đường chim bay, chia cho 0 phẩy 25 giờ được 4400 cây số một giờ.
      Vận tốc đó gần gấp năm máy bay chở khách, nên bất khả thi về mặt vật lý.
  - show: "<p><b>Bước 1: Trích xuất véc tơ đặc trưng tức thời trong Java Gateway</b>:</p>\n\
      <pre><code>// Trích xuất đặc trưng ngay trong bộ nhớ, không gọi mạng\n\
      float[] features = new float[] {\n    calcGeoVelocity(loc1, loc2, dt), // Vận\
      \ tốc di chuyển\n    calcZScore(amount, avg30, std30), // Điểm Z của số tiền\n\
      \    getTxCount(cardId, 300) // Tần suất giao dịch 5 phút\n};</code></pre>\n\
      <p>Điểm Z = (số tiền − trung bình 30 ngày) / độ lệch chuẩn 30 ngày. Ví dụ trung\
      \ bình 2 triệu, độ lệch chuẩn 1,5 triệu, giao dịch 30 triệu: $(30 - 2) / 1{,}5\
      \ \\approx 18{,}67$, tức cách trung bình gần 19 lần độ lệch chuẩn.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước một, cổng giao tiếp lập tức tính toán các đặc trưng rủi ro như vận tốc
      di chuyển địa lý, điểm Z của số tiền và tần suất quẹt thẻ. Điểm Z cho biết số tiền cách mức trung bình bao nhiêu lần độ lệch chuẩn.
      Ví dụ trung bình 2 triệu, độ lệch chuẩn 1 phẩy 5 triệu, giao dịch 30 triệu thì điểm Z xấp xỉ 18 phẩy 67. Quá trình trích
      xuất này diễn ra ngay trong bộ nhớ, không cần gọi qua mạng.
    clear: true
  - show: "<p><b>Bước 2: Thực thi suy luận mô hình học máy qua ONNX Runtime</b>:</p>\n\
      <pre><code>OnnxTensor inputTensor = OnnxTensor.createTensor(\n    env, FloatBuffer.wrap(features),\
      \ shape);\nOrtSession.Result result = session.run(\n    Collections.singletonMap(\"\
      input\", inputTensor));\nfloat anomalyScore = ((float[][]) result.get(0).getValue())[0][0];\n\
      \n// Mục tiêu thiết kế: vài mili giây, phải đo bằng benchmark</code></pre>"
    focus:
    - 0
    - 0
    say: Bước hai, các đặc trưng được đưa vào mô hình học máy đã được huấn luyện sẵn.
      Mục tiêu thiết kế là chỉ vài mili giây để giao dịch không bị gián đoạn, và con
      số thật phải được đo bằng phép đo hiệu năng trên máy và mô hình của mình.
    clear: true
  - show: '<p><b>Bước 3: Quyết định khi điểm rủi ro vượt ngưỡng</b>:</p>

      <div class="box key">Giao dịch quẹt thẻ ở Singapore: từ chối (hoặc tạm giữ) và
      báo khách xác nhận qua ứng dụng ngân hàng; ngưỡng điểm rủi ro do ngân hàng tự đặt
      và phải hiệu chỉnh trên dữ liệu thật.</div>

      <p>Phân biệt với QĐ 2345/QĐ-NHNN (ký 18/12/2023, hiệu lực 01/07/2024): bắt buộc
      xác thực sinh trắc học khi chuyển tiền trực tuyến trên 10 triệu đồng một lần hoặc
      tổng trong ngày trên 20 triệu đồng. Đó là ngưỡng theo quy định, khác ngưỡng điểm
      rủi ro của mô hình.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bước ba, khi điểm bất thường vượt ngưỡng, hệ thống từ chối hoặc tạm giữ giao dịch quẹt thẻ và báo khách xác nhận qua ứng dụng.
      Ngưỡng điểm này do ngân hàng tự đặt và phải hiệu chỉnh trên dữ liệu thật.
      Đừng nhầm với Quyết định 2345 của Ngân hàng Nhà nước, có hiệu lực từ ngày 1 tháng 7 năm 2024.
      Quyết định đó bắt buộc xác thực sinh trắc học khi chuyển tiền trực tuyến trên 10 triệu một lần hoặc tổng ngày trên 20 triệu.
