      \  <rect x=\"490\" y=\"20\" width=\"180\" height=\"70\" rx=\"6\" fill=\"#fff3cd\"\
      \ stroke=\"#ffc107\"/>\n  <text x=\"500\" y=\"45\" font-size=\"12\" font-weight=\"\
      bold\" fill=\"#856404\">Quyết định tức thời</text>\n  <text x=\"500\" y=\"68\"\
      \ font-size=\"11\" fill=\"#856404\">Cho qua / Chặn ngay</text>\n  <rect x=\"\
      490\" y=\"130\" width=\"180\" height=\"70\" rx=\"6\" fill=\"#f8d7da\" stroke=\"\
      #dc3545\"/>\n  <text x=\"500\" y=\"155\" font-size=\"12\" font-weight=\"bold\"\
