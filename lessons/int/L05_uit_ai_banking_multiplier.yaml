      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>OnnxTensor.createTensor(env, FloatBuffer.wrap(features), shape)</td><td>đóng gói mảng số thành tensor, tức khối số mô hình đọc được; env = môi trường chạy ONNX đã tạo sẵn; shape = số hàng, số cột của khối số</td></tr>
        <tr><td>session.run(Collections.singletonMap("input", inputTensor))</td><td>session = phiên đã nạp sẵn mô hình; chạy mô hình, đưa tensor vào ô đầu vào tên "input"</td></tr>
