    - 0
    say: Để áp dụng học máy vào ngân hàng mà không làm nghẽn giao dịch, ta sử dụng
      kiến trúc đường dẫn kép. Đường dẫn nhanh thực thi mô hình siêu nhẹ trực tiếp
      trong bộ nhớ ứng dụng với mục tiêu thiết kế chỉ vài mili giây. Trong khi đó, đường dẫn
      chậm đẩy dữ liệu vào hàng đợi để các mô hình đồ thị sâu phân tích quan hệ ngầm.
  - show: '<div class="box key">ONNX Runtime trong Java: Mô hình Isolation Forest
      xuất sang ONNX và chạy qua lõi mã máy C++ ngay trong tiến trình. Mục tiêu thiết
      kế: vài mili giây mỗi lần suy luận để nằm gọn trong ngân sách độ trễ của cổng
      thanh toán; con số thật phải đo bằng benchmark (JMH, p95/p99).</div>'
    focus:
    - 0
    - 0
    say: Điểm then chốt là việc nạp mô hình trực tiếp vào bộ nhớ ứng dụng thông qua
      lõi mã máy, không phải gọi qua mạng. Mục tiêu thiết kế là chỉ vài mili giây cho
      mỗi lần tính điểm rủi ro, còn con số thật phải đo bằng phép đo hiệu năng trước
      khi nói ra.
    clear: true
- id: symbol
  kind: symbol
  title: Công thức Thuật toán Định tuyến Thông minh và So khớp Ngữ nghĩa
  checks:
  - 5 - 3 == 2
  - 15 * 60 == 900
  steps:
  - show: '<p><b>Công thức Định tuyến Đa kênh với Thuật toán Bandit UCB1</b>:</p>

      <div class="box key">

      $$\text{Điểm tin cậy kênh } k: \text{Score}_k = \hat{\mu}_k + c \sqrt{\frac{\ln
      N}{N_k}}$$

      $$\text{Độ tương đồng Cosine ngữ nghĩa: } \cos(\vec{u}, \vec{v}) = \frac{\vec{u}
      \cdot \vec{v}}{\|\vec{u}\| \|\vec{v}\|}$$

      </div>

      <p>Thuật toán tự động đo đạc tỉ lệ thành công $\hat{\mu}_k$ và độ bất định của
      từng cổng chuyển mạch trong cửa sổ trượt 15 phút, chỉ chọn trong các kênh hợp
      lệ (ý tưởng thiết kế).</p>'
    focus:
    - 0
    - 0
    say: Theo công thức của lý thuyết học tăng cường tại trường đại học, thuật toán
      liên tục tính toán điểm tin cậy của từng kênh chuyển tiền. Khi một cổng chuyển
      mạch gặp sự cố mạng, điểm của kênh đó giảm và lưu lượng được chuyển sang kênh
      khác, nhưng chỉ trong các kênh mà quy định nghiệp vụ cho phép.
  - show: "<p><b>So khớp Sao kê Ngữ nghĩa bằng Vector Embeddings 384 chiều</b>:</p>\n\
      <pre><code>// Sinh vector nhúng biểu diễn ngữ nghĩa của chuỗi sao kê\nvector1\
      \ = model.encode(\"Chuyen tien thanh toan hoa don tien dien thang 11\")\nvector2\
      \ = model.encode(\"EVN HCMC - Dien luc TP.HCM ky 11/2026\")\n\n// Ngưỡng 0.88\
      \ là ví dụ minh họa; vẫn phải khớp mã giao dịch và số tiền\nif (cosineSimilarity(vector1,\
      \ vector2) >= 0.88) {\n    proposeMatch(); // dưới ngưỡng: người vận hành duyệt\n}</code></pre>"
    focus:
    - 0
    - 0
    say: Đối với bài toán đối soát hóa đơn sai lệch chính tả, ta sử dụng mô hình ngôn
      ngữ để chuyển chuỗi văn bản thành các véc tơ số học nhiều chiều. Bằng cách so
      khớp độ tương đồng góc hình học, hệ thống đề xuất cặp giao dịch khớp, còn các cặp
      dưới ngưỡng do người vận hành duyệt.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Phát hiện Gian lận Thẻ trong Ngân sách Độ trễ'
  checks:
  - 1500 * 4 == 6000
  - 6000 > 800
  - 300 // 60 == 5
  steps:
  - show: "<p><b>Đề bài giả định: bảo vệ thẻ tín dụng số</b>:</p>\n<ul>\n\
      \  <li>Tình huống: Khách hàng vừa rút tiền tại Thành phố Hồ Chí Minh lúc 10h00,\
      \ đến 10h15 xuất hiện giao dịch quẹt thẻ tại Singapore.</li>\n  <li>Khoảng cách\
      \ địa lý: $1\\,500$ km trong thời gian 15 phút, tương đương vận tốc $6\\,000$\
      \ km/h!</li>\n  <li>Yêu cầu: Phát hiện và chặn đứng giao dịch gian lận trước\
      \ khi gửi lệnh sang ngân hàng lõi.</li>\n</ul>"
    focus:
    - 0
    - 0
    say: Ta xem xét tình huống khách hàng vừa thực hiện giao dịch tại một thành phố,
      nhưng chỉ mười lăm phút sau lại xuất hiện giao dịch tại một quốc gia khác. Khoảng
      cách địa lý hàng nghìn cây số trong thời gian ngắn cho thấy vận tốc di chuyển
      bất khả thi về mặt vật lý.
  - show: "<p><b>Bước 1: Trích xuất véc tơ đặc trưng tức thời trong Java Gateway</b>:</p>\n\
      <pre><code>// Trích xuất đặc trưng ngay trong bộ nhớ, không gọi mạng\n\
      float[] features = new float[] {\n    calcGeoVelocity(loc1, loc2, dt), // Vận\
      \ tốc di chuyển\n    calcZScore(amount, avg30, std30), // Độ lệch số tiền\n\
      \    getTxCount(cardId, 300) // Tần suất giao dịch 5 phút\n};</code></pre>"
    focus:
    - 0
    - 0
    say: Bước một, cổng giao tiếp lập tức tính toán các đặc trưng rủi ro như vận tốc
      di chuyển địa lý, độ lệch chuẩn số tiền và tần suất quẹt thẻ. Quá trình trích
      xuất này diễn ra ngay trong bộ nhớ, không cần gọi qua mạng.
    clear: true
  - show: "<p><b>Bước 2: Thực thi suy luận mô hình học máy qua ONNX Runtime</b>:</p>\n\
      <pre><code>OnnxTensor inputTensor = OnnxTensor.createTensor(\n    env, FloatBuffer.wrap(features),\
      \ shape);\nOrtSession.Result result = session.run(\n    Collections.singletonMap(\"\
      input\", inputTensor));\nfloat anomalyScore = ((float[][]) result.get(0).getValue())[0][0];\n\
      \n// Mục tiêu thiết kế: vài mili giây, phải đo bằng benchmark</code></pre>"
    focus:
    - 0
    - 0
    say: Bước hai, các đặc trưng được đưa vào mô hình học máy đã được huấn luyện sẵn.
      Mục tiêu thiết kế là chỉ vài mili giây để giao dịch không bị gián đoạn, và con
      số thật phải được đo bằng phép đo hiệu năng trên máy và mô hình của mình.
    clear: true
  - show: '<p><b>Bước 3: Quyết định kích hoạt hàng rào bảo vệ sinh trắc học QĐ 2345</b>:</p>

      <div class="box key">Khi điểm rủi ro vượt ngưỡng an toàn: Hệ thống lập tức yêu
      cầu khách hàng thực hiện xác thực khuôn mặt sinh trắc học 3D so khớp dữ liệu
      căn cước công dân gắn chip. Rủi ro gian lận giảm đáng kể.</div>'
    focus:
    - 0
    - 0
    say: Bước ba, khi phát hiện điểm bất thường vượt ngưỡng, hệ thống kích hoạt ngay
      hàng rào xác thực khuôn mặt sinh trắc học theo quyết định của Ngân hàng Nhà
      nước. Bước này khiến kẻ gian khó vượt qua hơn nhiều và giảm đáng kể rủi ro mất
      tiền của khách hàng.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Bản lĩnh Trả lời Phỏng vấn về Bằng Cử nhân AI UIT'
  checks:
  - 2026 - 2025 == 1
  - 1000 // 100 == 10
  steps:
  - show: "<p><b>Tình huống phỏng vấn thường gặp</b>: Bạn\
