scenes:
- id: hook
  kind: hook
  title: Vì sao Kỹ sư Tích hợp Ngân hàng lại cần Bằng Cử nhân Trí tuệ Nhân tạo?
  steps:
  - show: '<p>Đa số lập trình viên backend truyền thống nhìn bài toán tích hợp chỉ
      là: Nhận gói tin JSON, gọi ngân hàng lõi, lưu cơ sở dữ liệu và trả về kết quả.</p>

      <div class="box key">Tuy nhiên ở ngân hàng, luồng thanh toán lưu lượng lớn cần
      phát hiện gian lận trong ngân sách độ trễ rất chặt, định tuyến khi kênh nghẽn
      và đối soát tự động. Chương trình Cử nhân AI tại UIT bổ trợ gì cho kỹ sư tích
      hợp?</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, đa số kỹ sư phần mềm chỉ nhìn bài toán tích hợp là việc chuyển
      tiếp dữ liệu tuần tự. Nhưng tại các ngân hàng hàng đầu, hệ thống đối mặt với
      lưu lượng lớn và các hành vi gian lận tinh vi. Chương trình Cử nhân Trí tuệ
      Nhân tạo tại trường Đại học Công nghệ Thông tin mang lại một nền tảng bổ trợ
      đáng giá cho kỹ sư tích hợp.
  - show: "<table class=\"t\">\n  <tr><th>bài toán ngân hàng số</th><th>cách làm truyền\
      \ thống</th><th>đột phá cấp số nhân từ nền tảng AI UIT</th></tr>\n  <tr><td>Phát\
      \ hiện gian lận thẻ & tài khoản</td><td>Bộ quy tắc tĩnh if-else cứng nhắc</td><td>Mô\
      \ hình Isolation Forest nhẹ suy luận ngay trong RAM</td></tr>\n  <tr><td>Định\
      \ tuyến luồng thanh toán đa kênh</td><td>Cấu hình kênh cố định bằng tay</td><td>Thuật\
      \ toán bandit UCB1 chọn kênh hợp lệ khi kênh chậm</td></tr>\n  <tr><td>Đối\
      \ soát sao kê sai lệch cú pháp</td><td>Kế toán tra soát thủ công từng dòng</td><td>Sentence-Transformers\
      \ đề xuất cặp khớp, người duyệt ca khó</td></tr>\n</table>\n<p>Hôm\
      \ nay, ta giải mã: <b>các khối kiến thức Cử nhân AI UIT</b>, <b>ba ý tưởng\
      \ thiết kế</b>, và <b>chiến lược phỏng vấn trung thực</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá giá trị cốt lõi của học vấn công nghệ cao.
      Ta tìm hiểu các khối kiến thức chính của chương trình cử nhân trí tuệ nhân tạo.
      Ta nắm vững ba ý tưởng thiết kế đưa học máy vào luồng xử lý giao dịch. Ta
      cũng làm chủ kỹ năng đối đáp tự tin trước hội đồng tuyển dụng.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: Ma trận Học phần Cử nhân AI tại UIT ĐHQG-HCM'
  checks:
  - 5 - 2 == 3
  steps:
  - show: "<p><b>Năm khối kiến thức trụ cột trong chương trình Cử nhân AI tại UIT</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khối kiến thức</th><th>các học phần tiêu biểu</th><th>ứng\
      \ dụng thực chiến trong ngân hàng</th></tr>\n  <tr><td>Toán học & Cơ sở AI</td><td>Giải\
      \ tích, Đại số tuyến tính, Xác suất thống kê</td><td>Tính độ lệch chuẩn Z-Score\
      \ và ma trận rủi ro giao dịch</td></tr>\n  <tr><td>Giải thuật nâng cao</td><td>Cấu\
      \ trúc dữ liệu nâng cao, Phân tích thuật toán</td><td>Khóa theo thứ tự toàn cục\
      \ giảm bế tắc, Bộ giới hạn tốc độ</td></tr>\n  <tr><td>Hệ thống & Mạng</td><td>Kiến\
      \ trúc máy tính, Hệ điều hành, Mạng phân tán</td><td>Quản lý luồng ảo, tối ưu\
      \ bộ nhớ đệm CPU L1/L2/L3</td></tr>\n  <tr><td>Cơ sở dữ liệu lớn</td><td>Cơ\
      \ sở dữ liệu nâng cao, Hệ phân tán, NoSQL</td><td>Phân vùng bảng Oracle, Streaming\
      \ ksqlDB, CDC Debezium</td></tr>\n  <tr><td>Học máy & Thị giác</td><td>Machine\
      \ Learning, Deep Learning, Computer Vision</td><td>Phát hiện gian lận thời gian\
      \ thực, Sinh trắc học 2345</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại năm khối kiến thức trụ cột trong chương trình cử nhân
      trí tuệ nhân tạo. Nền tảng toán học và giải thuật nâng cao giúp giải quyết tận
      gốc các bài toán cao tải. Kiến thức học máy và thị giác máy tính cho phép triển
      khai giải pháp bảo mật sinh trắc học chuẩn quốc gia.
  - show: '<div class="box key">Định vị Kỹ sư Tích hợp đang học Cử nhân AI: Vừa
      có kinh nghiệm tích hợp Core T24 và phối hợp luồng NAPAS 247 với đội Switch,
      vừa có nền toán học và giải thuật để hiểu cách đưa mô hình học máy vào đường
      ống dữ liệu mà không làm chậm giao dịch.</div>'
    focus:
    - 0
    - 0
    say: Sự kết hợp giữa kinh nghiệm thực chiến ngân hàng lõi và nền tảng học thuật
      đại học tạo nên một lợi thế cạnh tranh rõ rệt. Kỹ sư vừa am hiểu các
      giao thức tài chính, vừa có khả năng ứng dụng các mô hình thông minh để giải
      quyết bài toán phức tạp.
    clear: true
- id: concept
  kind: concept
  title: 'Kiến trúc Đường dẫn Kép: Phân tách Luồng Nhanh và Luồng Chậm'
