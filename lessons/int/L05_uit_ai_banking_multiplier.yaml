      #28a745\"/>\n  <text x=\"240\" y=\"45\" font-size=\"12\" font-weight=\"bold\"\
      \ fill=\"#155724\">Đường dẫn Nhanh (Fast Path)</text>\n  <text x=\"240\" y=\"\
