scenes:
- id: hook
  kind: hook
  title: Vì sao Kỹ sư Tích hợp Ngân hàng lại cần Bằng Cử nhân Trí tuệ Nhân tạo?
  steps:
  - show: |-
      <p>Đa số lập trình viên backend truyền thống nhìn bài toán tích hợp chỉ là: Nhận gói tin JSON (văn bản gồm các cặp tên và giá trị), gọi ngân hàng lõi, lưu cơ sở dữ liệu và trả về kết quả.</p>
      <div class="box key">Tuy nhiên ở ngân hàng, luồng thanh toán lưu lượng lớn cần phát hiện gian lận trong ngân sách độ trễ rất chặt, định tuyến khi kênh nghẽn và đối soát tự động. Chương trình Cử nhân AI tại UIT bổ trợ gì cho kỹ sư tích hợp?</div>
      <p><i>UIT</i> = Trường Đại học Công nghệ Thông tin, thuộc Đại học Quốc gia TP.HCM (ĐHQG-HCM).</p>
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, đa số kỹ sư phần mềm chỉ nhìn bài toán tích hợp là việc chuyển tiếp dữ liệu tuần tự. Nhưng tại các ngân hàng hàng đầu, hệ thống đối mặt với lưu lượng lớn và các hành vi gian lận tinh vi. Chương trình Cử nhân Trí tuệ Nhân tạo tại trường Đại học Công nghệ Thông tin mang lại một nền tảng bổ trợ đáng giá cho kỹ sư tích hợp.
  - show: |-
      <table class="t">
        <tr><th>bài toán ngân hàng số</th><th>cách làm truyền thống</th><th>đột phá cấp số nhân từ nền tảng AI UIT</th></tr>
        <tr><td>Phát hiện gian lận thẻ & tài khoản</td><td>Bộ quy tắc tĩnh if-else cứng nhắc</td><td>Mô hình Isolation Forest nhẹ suy luận ngay trong RAM</td></tr>
        <tr><td>Định tuyến luồng thanh toán đa kênh</td><td>Cấu hình kênh cố định bằng tay</td><td>Thuật toán bandit UCB1 chọn kênh hợp lệ khi kênh chậm</td></tr>
        <tr><td>Đối soát sao kê sai lệch cú pháp</td><td>Kế toán tra soát thủ công từng dòng</td><td>Sentence-Transformers đề xuất cặp khớp, người duyệt ca khó</td></tr>
      </table>
      <p>if-else = quy tắc viết dạng "nếu điều kiện đúng thì làm việc A, ngược lại thì làm việc B". Isolation Forest = nhiều cây chia dữ liệu ngẫu nhiên, điểm bất thường bị tách riêng sau rất ít lần chia. UCB1 = công thức chọn kênh, giảng kỹ ở phần ký hiệu. Sentence-Transformers = mô hình biến câu chữ thành dãy số để so nghĩa.</p>
    focus:
    - 0
    - 0
    say: Rừng cô lập, tức Isolation Forest, là nhiều cây chia dữ liệu ngẫu nhiên, và điểm bất thường bị tách riêng sau rất ít lần chia. Hôm nay ta tìm hiểu các khối kiến thức chính của chương trình cử nhân trí tuệ nhân tạo và ba ý tưởng đưa học máy vào luồng giao dịch.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Các khối kiến thức Cử nhân AI tại UIT ĐHQG-HCM'
  checks:
  - 5 - 2 == 3
  steps:
  - show: |-
      <p><b>Năm khối kiến thức trụ cột của Cử nhân AI tại UIT</b> (đối chiếu bảng điểm khi nói):</p>
      <table class="t">
        <tr><th>khối</th><th>các học phần tiêu biểu</th><th>ứng dụng thực chiến trong ngân hàng</th></tr>
        <tr><td>Toán học & Cơ sở AI</td><td>Giải tích, Đại số tuyến tính, Xác suất thống kê</td><td>Điểm Z (số tiền lệch khỏi trung bình bao nhiêu lần); cosine (độ giống hướng của hai dãy số)</td></tr>
        <tr><td>Giải thuật nâng cao</td><td>Cấu trúc dữ liệu nâng cao, Phân tích thuật toán</td><td>Khoá theo thứ tự cố định tránh bế tắc (hai bên giữ khoá chờ nhau mãi); giới hạn số yêu cầu mỗi giây</td></tr>
        <tr><td>Hệ thống & Mạng</td><td>Kiến trúc máy tính, Hệ điều hành, Mạng phân tán</td><td>Luồng ảo (luồng nhẹ Java 21), bộ nhớ đệm của bộ xử lý</td></tr>
      </table>
    focus:
    - 0
    - 0
    - ['2.2', '2.3']
    clear: true
    say: Trước hết, ta cần nắm năm khối kiến thức trụ cột trong chương trình cử nhân trí tuệ nhân tạo. Tên từng học phần trên bảng phải được đối chiếu với bảng điểm thật trước khi bạn nói trong phỏng vấn. Nền tảng toán học và giải thuật nâng cao giúp giải quyết tận gốc các bài toán cao tải.
  - show: |-
      <p><b>Hai khối còn lại</b>. Học máy = cách máy tự rút quy luật từ dữ liệu cũ; mô hình = một hàm đã học từ dữ liệu cũ, nhận dữ liệu mới rồi trả điểm:</p>
      <table class="t">
        <tr><th>khối</th><th>các học phần tiêu biểu</th><th>ứng dụng thực chiến trong ngân hàng</th></tr>
        <tr><td>Cơ sở dữ liệu lớn</td><td>Cơ sở dữ liệu nâng cao, Hệ phân tán</td><td>Phân vùng bảng (chia bảng lớn theo ngày), Kafka (hàng đợi chịu tải lớn)</td></tr>
        <tr><td>Học máy & Thị giác</td><td>Học máy (Machine Learning), Học sâu (Deep Learning), Thị giác máy tính (Computer Vision)</td><td>Phát hiện gian lận thời gian thực, sinh trắc học (khuôn mặt, vân tay)</td></tr>
      </table>
    focus:
    - '2.3'
    clear: true
    say: Kiến thức học máy và thị giác máy tính cho phép triển khai xác thực sinh trắc học, tức nhận ra người bằng khuôn mặt hay vân tay, theo quy định của Ngân hàng Nhà nước.
  - show: '<div class="box key">Định vị Kỹ sư Tích hợp đang học Cử nhân AI: vừa có nền tích hợp ngân hàng (hãy kể đúng phần việc thật của mình), vừa có nền toán học và giải thuật để hiểu cách đưa mô hình học máy vào đường ống dữ liệu mà không làm chậm giao dịch.</div>'
    focus:
    - 0
    - 0
    say: Sự kết hợp giữa nền tích hợp ngân hàng và nền tảng học thuật đại học tạo nên một lợi thế cạnh tranh rõ rệt. Kỹ sư vừa am hiểu các giao thức tài chính, vừa biết ứng dụng mô hình thông minh để giải quyết bài toán phức tạp.
    clear: true
- id: concept
  kind: concept
  title: 'Kiến trúc Đường dẫn Kép: Phân tách Luồng Nhanh và Luồng Chậm'
  steps:
  - show: |-
      <p><b>Mô hình Đường dẫn Kép Dual-Path Architecture trong Phòng chống Gian lận</b>:</p>
      <svg viewBox="0 0 700 220" style="width:100%;max-height:420px;">
        <rect x="20" y="80" width="140" height="60" rx="6" fill="#e8f4fd" stroke="#003366" stroke-width="2"/>
        <text x="35" y="115" font-size="12" font-weight="bold" fill="#003366">Giao dịch đến</text>
        <path d="M 160 95 L 228 52" stroke="#28a745" stroke-width="2" marker-end="url(#ar5)"/>
        <rect x="230" y="20" width="220" height="70" rx="6" fill="#d4edda" stroke="#28a745"/>
        <text x="240" y="45" font-size="12" font-weight="bold" fill="#155724">Đường dẫn Nhanh (Fast Path)</text>
        <text x="240" y="68" font-size="11" fill="#155724">ONNX trong RAM (vài ms)</text>
        <path d="M 160 125 L 228 148" stroke="#17a2b8" stroke-width="2" marker-end="url(#ar5)"/>
        <rect x="230" y="130" width="220" height="70" rx="6" fill="#d1ecf1" stroke="#17a2b8"/>
        <text x="240" y="155" font-size="12" font-weight="bold" fill="#0c5460">Đường dẫn Chậm (Slow Path)</text>
        <text x="240" y="178" font-size="11" fill="#0c5460">Đẩy vào hàng đợi Kafka, chạy ngầm</text>
        <rect x="490" y="20" width="180" height="70" rx="6" fill="#fff3cd" stroke="#ffc107"/>
        <text x="500" y="45" font-size="12" font-weight="bold" fill="#856404">Quyết định tức thời</text>
        <text x="500" y="68" font-size="11" fill="#856404">Cho qua / Chặn ngay</text>
        <rect x="490" y="130" width="180" height="70" rx="6" fill="#f8d7da" stroke="#dc3545"/>
        <text x="500" y="155" font-size="12" font-weight="bold" fill="#721c24">Phân tích Đồ thị AI</text>
        <text x="500" y="178" font-size="11" fill="#721c24">Cập nhật danh sách đen</text>
        <defs><marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#003366"/></marker></defs>
        <line x1="452" y1="55" x2="487" y2="55" stroke="#003366" stroke-width="2" marker-end="url(#ar5)"/>
        <line x1="452" y1="165" x2="487" y2="165" stroke="#003366" stroke-width="2" marker-end="url(#ar5)"/>
      </svg>
      <p>Đồng bộ = giao dịch phải đợi kết quả rồi mới đi tiếp. Bất đồng bộ = đẩy việc vào hàng đợi (nơi xếp việc chờ xử lý), đi tiếp ngay, kết quả đến sau. Mô hình đồ thị = xem tài khoản như điểm nối nhau bằng đường chuyển tiền; mạng nơ-ron sâu = mô hình nhiều tầng tính toán, chính xác hơn nhưng chậm hơn.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Để áp dụng học máy vào ngân hàng mà không làm nghẽn giao dịch, ta sử dụng kiến trúc đường dẫn kép. Đồng bộ nghĩa là giao dịch phải đợi kết quả rồi mới đi tiếp, còn bất đồng bộ nghĩa là đẩy việc vào hàng đợi và đi tiếp, kết quả đến sau. Đường dẫn nhanh chạy mô hình siêu nhẹ trong bộ nhớ ứng dụng, với mục tiêu thiết kế chỉ vài mili giây. Đường dẫn chậm đẩy dữ liệu vào hàng đợi cho mô hình đồ thị, xem tài khoản như các điểm nối nhau bằng đường chuyển tiền, để phân tích ngầm.
  - show: |-
      <div class="box key">ONNX Runtime trong Java: Mô hình Isolation Forest xuất sang ONNX và chạy qua lõi mã máy C++ ngay trong tiến trình. Mục tiêu thiết kế: vài mili giây mỗi lần suy luận để nằm gọn trong ngân sách độ trễ của cổng thanh toán; con số thật phải đo bằng benchmark (JMH, p95/p99).</div>
