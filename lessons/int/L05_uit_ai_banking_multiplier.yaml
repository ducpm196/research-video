- id: symbol
  kind: symbol
  title: Công thức Thuật toán Định tuyến Thông minh và So khớp Ngữ nghĩa
  checks:
  - 5 - 3 == 2
  - 15 * 60 == 900
  - round(0.9 + math.sqrt(2 * math.log(110) / 100), 2) == 1.21
  - round(0.8 + math.sqrt(2 * math.log(110) / 10), 2) == 1.77
  - 1 * 2 + 2 * 3 == 8
  - round(8 / math.sqrt(5 * 13), 3) == 0.992
  steps:
  - show: |-
      <p><b>Công thức Định tuyến Đa kênh với Thuật toán Bandit UCB1</b>:</p>
      <div class="box key">
      $$\text{Điểm tin cậy kênh } k: \text{Score}_k = \hat{\mu}_k + c \sqrt{\frac{\ln N}{N_k}}$$
      $$\text{Độ tương đồng Cosine ngữ nghĩa: } \cos(\vec{u}, \vec{v}) = \frac{\vec{u} \cdot \vec{v}}{\|\vec{u}\| \|\vec{v}\|}$$
      </div>
      <p>$\hat{\mu}_k$ = tỉ lệ thành công đo được của kênh $k$; $N$ = tổng số lần thử mọi kênh; $N_k$ = số lần đã thử kênh $k$; $c$ = hệ số khám phá; $\ln N$ = lôgarit tự nhiên của $N$, tăng rất chậm khi $N$ lớn; $\sqrt{x}$ = căn bậc hai, số nhân với chính nó ra $x$.</p>
      <p>Véc tơ = một dãy số, ví dụ $(1, 2)$. $\vec{u} \cdot \vec{v}$ = tích vô hướng: nhân từng cặp số cùng vị trí rồi cộng lại. $\|\vec{u}\|$ = độ dài véc tơ: căn bậc hai của tổng bình phương các số.</p>
    focus:
    - 0
    - 0
    - 0
    say: Bài toán máy đánh bạc nhiều tay là chọn nhiều lần giữa các lựa chọn chưa biết tỉ lệ thành công, vừa dùng lựa chọn tốt nhất vừa thử lựa chọn còn ít được thử. Công thức cận tin cậy trên của bài toán này, được công bố năm 2002, chấm điểm từng kênh chuyển tiền bằng hai phần cộng lại. Phần đầu là tỉ lệ thành công đo được, phần sau là phần thưởng khám phá, càng lớn khi kênh đó còn ít được thử.
  - show: |-
      <p>$\ln N$ = lôgarit tự nhiên của $N$ (số mũ để $e \approx 2{,}718$ lũy thừa lên bằng $N$; $N$ tăng thì $\ln N$ tăng rất chậm, $\ln 110 \approx 4{,}70$). Điểm này gọi là cận tin cậy trên: tỉ lệ thành công đo được cộng một phần dự phòng cho sự không chắc chắn của kênh mới thử ít lần. UCB1 nguyên thủy (Auer, Cesa-Bianchi, Fischer, 2002) đếm từ đầu; bản đo trong cửa sổ trượt 15 phút là một biến thể. Chỉ chọn trong các kênh hợp lệ (ý tưởng thiết kế). Bài toán bandit = nhiều lựa chọn chưa biết tỉ lệ thành công; mỗi lần chọn một, vừa dùng lựa chọn đang tốt nhất vừa thử lựa chọn còn ít được thử.</p>
    focus:
    - 0
    - 0
    clear: true
    say: Trong đó lôgarit tự nhiên của N tăng rất chậm khi N lớn. Khi một cổng chuyển mạch gặp sự cố, tỉ lệ thành công giảm và lưu lượng chuyển sang kênh khác, nhưng chỉ trong các kênh mà quy định nghiệp vụ cho phép.
  - show: |-
      <p><b>Ví dụ số (minh hoạ), chọn $c = \sqrt{2}$</b>: đã thử tổng $N = 110$ lần.</p>
      <ul>
        <li>Kênh A: 90 thành công / 100 lần → $0{,}9 + \sqrt{2 \ln 110 / 100} \approx 0{,}9 + 0{,}31 = 1{,}21$</li>
        <li>Kênh B: 8 thành công / 10 lần → $0{,}8 + \sqrt{2 \ln 110 / 10} \approx 0{,}8 + 0{,}97 = 1{,}77$</li>
        <li>Lần tới chọn B để thử thêm, dù tỉ lệ thành công thấp hơn; thử nhiều rồi thì phần khám phá của B nhỏ lại.</li>
        <li>Cosine 2 chiều: $\vec{u} = (1, 2)$, $\vec{v} = (2, 3)$: tích vô hướng $1 \cdot 2 + 2 \cdot 3 = 8$; $\cos = 8 / (\sqrt{5}\sqrt{13}) \approx 0{,}992$, gần 1 nghĩa là hai vector gần cùng hướng. Độ dài của $\vec{u}$ là căn của $1^2 + 2^2 = 5$, của $\vec{v}$ là căn của $2^2 + 3^2 = 13$.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Lấy ví dụ minh hoạ, đã thử tổng cộng 110 lần, kênh A thành công 90 trên 100 lần nên điểm khoảng 0 phẩy 9 cộng 0 phẩy 31, bằng 1 phẩy 21. Kênh B thành công 8 trên 10 lần, điểm khoảng 0 phẩy 8 cộng 0 phẩy 97, bằng 1 phẩy 77, nên lần tới ta thử B thêm dù tỉ lệ thấp hơn. Với độ tương đồng Cosine, hai véc tơ 1, 2 và 2, 3 có tích vô hướng, nghĩa là nhân từng cặp cùng vị trí rồi cộng, bằng 1 nhân 2 cộng 2 nhân 3, được 8. Độ dài véc tơ là căn của tổng bình phương, nên hai độ dài là căn 5 và căn 13, và thương là khoảng 0 phẩy 992. Con số gần 1 nghĩa là hai véc tơ gần cùng hướng, tức hai câu có nghĩa gần nhau.
    clear: true
  - show: |-
      <p><b>So khớp Sao kê Ngữ nghĩa bằng Vector Embeddings 384 chiều</b> (mã giả):</p>
      <table class="t">
        <tr><th>viết trong mã giả</th><th>đọc là</th></tr>
        <tr><td>vector1 = model.encode("...")</td><td>nhờ mô hình biến một câu chữ thành một dãy số, cất vào biến vector1</td></tr>
        <tr><td>if (... &gt;= 0.88) { ... }</td><td>nếu điều kiện trong ngoặc đúng thì chạy phần trong ngoặc nhọn; &gt;= nghĩa là lớn hơn hoặc bằng</td></tr>
        <tr><td>cosineSimilarity(a, b)</td><td>hàm tính độ tương đồng cosine của hai dãy số a và b</td></tr>
        <tr><td>// ...</td><td>ghi chú cho người đọc, máy bỏ qua</td></tr>
      </table>
    focus:
    - 0
    say: Đối với bài toán đối soát hóa đơn sai lệch chính tả, ta dùng mô hình ngôn ngữ chuyển chuỗi văn bản thành véc tơ số học nhiều chiều.
    clear: true
  - show: |-
      <pre><code>// Sinh vector nhúng biểu diễn ngữ nghĩa của chuỗi sao kê
      vector1 = model.encode("Chuyen tien thanh toan hoa don tien dien thang 11")
      vector2 = model.encode("EVN HCMC - Dien luc TP.HCM ky 11/2026")

      // Ngưỡng 0.88 là ví dụ minh họa; vẫn phải khớp mã giao dịch và số tiền
      if (cosineSimilarity(vector1, vector2) >= 0.88) {
          proposeMatch(); // dưới ngưỡng: người vận hành duyệt
      }</code></pre>
      <p>model.encode biến một câu thành dãy 384 số (vector nhúng); hai câu cùng nghĩa cho hai dãy gần cùng hướng, đo bằng cosine. Ngưỡng 0,88 là số minh hoạ.</p>
    focus:
    - 2
    - 1
    say: Mỗi véc tơ ở đây là một dãy ba trăm tám mươi bốn số. Bằng cách so khớp độ tương đồng góc hình học, hệ thống đề xuất cặp giao dịch khớp, còn các cặp dưới ngưỡng do người vận hành duyệt.
    clear: true
- id: chaythat
  kind: example
  title: 'Chạy thật: vận tốc, điểm Z, điểm UCB1 và độ tương đồng cosine'
  checks:
  - round(1100 / 0.25, 1) == 4400.0
  - round((30 - 2) / 1.5, 2) == 18.67
  - round(0.9 + math.sqrt(2 * math.log(110) / 100), 2) == 1.21
  - round(0.8 + math.sqrt(2 * math.log(110) / 10), 2) == 1.77
  - round(8 / math.sqrt(5 * 13), 3) == 0.992
  steps:
  - show: |-
      <p><b>Đọc trước mã Python sắp chạy</b> (Python là ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td style="white-space:nowrap">import math</td><td>lấy sẵn bộ công cụ toán của Python: math.sqrt là căn bậc hai, math.log là lôgarit tự nhiên</td></tr>
        <tr><td style="white-space:nowrap">def ucb(mu, nk, n):</td><td>định nghĩa hàm tên ucb nhận ba số: tỉ lệ thành công mu, số lần thử kênh nk, tổng số lần thử n; các dòng thụt vào là thân hàm</td></tr>
        <tr><td style="white-space:nowrap">return mu + math.sqrt(2 * math.log(n) / nk)</td><td>trả về tỉ lệ thành công cộng phần khám phá; dấu * là nhân, dấu / là chia</td></tr>
        <tr><td style="white-space:nowrap">print(a, b)</td><td>in các giá trị ra màn hình; round(x, 2) làm tròn hai chữ số sau dấu phẩy</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - ['2.3', '2.4']
    - '2.5'
    clear: true
    say: Trước khi chạy, ta đọc mã từng dòng. Dòng đầu lấy sẵn bộ công cụ toán. Hàm nhận tỉ lệ thành công, số lần thử kênh và tổng số lần thử, rồi trả về tỉ lệ thành công cộng phần khám phá. Lệnh in hiện kết quả đã làm tròn.
  - show: '<p><b>Chạy thật bằng Python: bốn con số của bài</b></p><div class="code"><div>import math</div><div>def ucb(mu, nk, n):</div><div>    return mu + math.sqrt(2 * math.log(n) / nk)</div><div>print(1100 / 0.25, round((30 - 2) / 1.5, 2))</div><div>print(round(ucb(0.9, 100, 110), 2), round(ucb(0.8, 10, 110), 2))</div><div>print(round(8 / math.sqrt(5 * 13), 3))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>4400.0 18.67</div><div>1.21 1.77</div><div>0.992</div></div>'
    focus:
    - 2
    - 4
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, tính lại các con số ví dụ của bài. Dòng đầu là vận tốc 4400 cây số một giờ của hai giao dịch cách nhau mười lăm phút, và điểm Z khoảng 18 phẩy 67 của giao dịch ba mươi triệu. Dòng hai là điểm của hai kênh theo công thức cận tin cậy trên, kênh A được 1 phẩy 21 còn kênh B ít được thử hơn được 1 phẩy 77. Dòng cuối là độ tương đồng Cosine khoảng 0 phẩy 992 của hai véc tơ ví dụ. Các số liệu đều là số minh hoạ.
- id: example
  kind: example
  title: 'Thực hành: Phát hiện Gian lận Thẻ trong Ngân sách Độ trễ'
  checks:
  - 1100 / 0.25 == 4400
  - 4400 > 900
  - 300 // 60 == 5
  - round((30 - 2) / 1.5, 2) == 18.67
  steps:
  - show: |-
      <p><b>Đề bài giả định: bảo vệ thẻ tín dụng số</b>:</p>
      <ul>
        <li>Tình huống: Khách hàng vừa rút tiền tại Thành phố Hồ Chí Minh lúc 10h00, đến 10h15 xuất hiện giao dịch quẹt thẻ tại Singapore.</li>
        <li>Khoảng cách địa lý: khoảng $1\,100$ km đường chim bay (làm tròn) trong 15 phút = 0,25 giờ: $1\,100 / 0{,}25 = 4\,400$ km/h, gần gấp năm máy bay chở khách (khoảng 900 km/h).</li>
        <li>Yêu cầu: Phát hiện và chặn đứng giao dịch gian lận trước khi gửi lệnh sang ngân hàng lõi.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét tình huống khách hàng vừa thực hiện giao dịch tại Thành phố Hồ Chí Minh, nhưng chỉ mười lăm phút sau lại xuất hiện giao dịch tại Xin-ga-po. Hai nơi cách nhau khoảng một nghìn một trăm cây số đường chim bay, chia cho 0 phẩy 25 giờ được 4400 cây số một giờ. Vận tốc đó gần gấp năm máy bay chở khách, nên bất khả thi về mặt vật lý.
  - show: |-
      <p><b>Đọc trước mã Java của bước 1</b> (mỗi câu lệnh Java kết thúc bằng dấu chấm phẩy):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>float[] features = new float[] { ... };</td><td>tạo mảng, tức một danh sách số thực, tên features; ba phần tử liệt kê trong ngoặc nhọn</td></tr>
        <tr><td>calcGeoVelocity(...), calcZScore(...), getTxCount(...)</td><td>ba hàm tự viết, tên cho biết việc làm: tính vận tốc di chuyển, tính điểm Z, đếm số giao dịch của thẻ trong 300 giây</td></tr>
        <tr><td>// ...</td><td>từ // tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    clear: true
    say: Trước khi xem mã, ta đọc cách viết. Mảng là một danh sách số, với ba phần tử là ba đặc trưng. Ba hàm trong ngoặc nhọn tự tính vận tốc, điểm Z và số giao dịch trong ba trăm giây.
  - show: |-
      <p><b>Bước 1: Trích xuất véc tơ đặc trưng tức thời trong Java Gateway</b>:</p>
      <pre><code>// Trích xuất đặc trưng ngay trong bộ nhớ, không gọi mạng
      float[] features = new float[] {
          calcGeoVelocity(loc1, loc2, dt), // Vận tốc di chuyển
          calcZScore(amount, avg30, std30), // Điểm Z của số tiền
          getTxCount(cardId, 300) // Tần suất giao dịch 5 phút
      };</code></pre>
      <p>Điểm Z = (số tiền − trung bình 30 ngày) / độ lệch chuẩn 30 ngày (độ lệch chuẩn = mức các khoản thường lệch khỏi trung bình). Ví dụ trung bình 2 triệu, độ lệch chuẩn 1,5 triệu, giao dịch 30 triệu: $(30 - 2) / 1{,}5 \approx 18{,}67$, tức cách trung bình gần 19 lần độ lệch chuẩn.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước một, cổng giao tiếp lập tức tính toán các đặc trưng rủi ro như vận tốc di chuyển địa lý, điểm Z của số tiền và tần suất quẹt thẻ. Độ lệch chuẩn là mức mà các khoản thường lệch khỏi trung bình. Điểm Z cho biết số tiền cách mức trung bình bao nhiêu lần độ lệch chuẩn. Ví dụ trung bình 2 triệu, độ lệch chuẩn 1 phẩy 5 triệu, giao dịch 30 triệu thì điểm Z xấp xỉ 18 phẩy 67.
    clear: true
  - show: |-
