- id: quymo
  kind: example
  title: 'Khi tải tăng: mô hình nhẹ còn nuôi nổi, mô hình nặng phải rời luồng đồng bộ'
  checks:
  - 500 * 2 / 1000 == 1.0
  - 5000 * 2 / 1000 == 10.0
  - 50000 * 2 / 1000 == 100.0
  - 500 * 80 / 1000 == 40.0
  - 5000 * 80 / 1000 == 400.0
  - 50000 * 80 / 1000 == 4000.0
  - math.ceil(100 / 8) == 13
  - 400 / 8 == 50.0
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>for ten, ms in (('nhe 2 ms', 2), ('nang 80 ms', 80)):</td><td>lấy lần lượt từng cặp (tên, mili giây) trong ngoặc: mô hình nhẹ rồi mô hình nặng; các dòng thụt vào là phần được lặp</td></tr>
        <tr><td>for tps in (500, 5000, 50000):</td><td>với mỗi cặp, thử ba mức tải</td></tr>
        <tr><td>tps * ms / 1000</td><td>tải nhân mili giây, chia 1000 để đổi sang giây: số nhân cần dùng</td></tr>
        <tr><td>print(...)</td><td>in các phần trong ngoặc ra màn hình</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3']
    - ['2.4', '2.5']
    clear: true
    say: Trước khi chạy, ta đọc mã từng dòng. Hai vòng lặp lồng nhau thử từng mô hình ở ba mức tải. Số nhân cần dùng bằng tải nhân mili giây rồi chia một nghìn để đổi ra giây, và lệnh in hiện kết quả.
  - show: '<p><b>Chạy thật bằng Python: tải tăng ×1, ×10, ×100</b> (một nhân xử lý = một lõi của bộ xử lý, làm một việc tại một thời điểm; 2 ms và 80 ms là số minh hoạ)</p><div class="code"><div>for ten, ms in ((''nhe 2 ms'', 2), (''nang 80 ms'', 80)):</div><div>    for tps in (500, 5000, 50000):</div><div>        print(ten, tps, ''gd/giay -&gt;'', tps * ms / 1000, ''nhan xu ly'')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>nhe 2 ms 500 gd/giay -&gt; 1.0 nhan xu ly</div><div>nhe 2 ms 5000 gd/giay -&gt; 10.0 nhan xu ly</div><div>nhe 2 ms 50000 gd/giay -&gt; 100.0 nhan xu ly</div><div>nang 80 ms 500 gd/giay -&gt; 40.0 nhan xu ly</div><div>nang 80 ms 5000 gd/giay -&gt; 400.0 nhan xu ly</div><div>nang 80 ms 50000 gd/giay -&gt; 4000.0 nhan xu ly</div></div>'
    focus:
    - 2
    - 2
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, tính số nhân xử lý, mỗi nhân là một lõi của bộ xử lý, cần cho một mô hình nhẹ hai mili giây và một mô hình nặng tám mươi mili giây. Hai số này chỉ là số minh hoạ, chưa đo trên mô hình thật. Ở năm trăm giao dịch mỗi giây, mô hình nhẹ cần một nhân, mô hình nặng cần bốn mươi nhân. Gấp một trăm lần, mô hình nhẹ cần một trăm nhân, còn mô hình nặng cần bốn nghìn nhân.
  - show: |
      <table class="t">
        <tr><th>mức tải</th><th>mô hình nhẹ 2 ms</th><th>mô hình nặng 80 ms</th><th>điều gì gãy</th></tr>
        <tr><td>500 mỗi giây (×1)</td><td>1 nhân</td><td>40 nhân</td><td>mô hình nặng vượt ngay ngân sách độ trễ của luồng đồng bộ</td></tr>
        <tr><td>5 000 mỗi giây (×10)</td><td>10 nhân</td><td>400 nhân</td><td>nặng cần khoảng 50 máy 8 nhân chỉ cho phần chấm điểm</td></tr>
        <tr><td>50 000 mỗi giây (×100)</td><td>100 nhân</td><td>4 000 nhân</td><td>nặng cần khoảng 500 máy; nhẹ vẫn chỉ cần khoảng 13 máy</td></tr>
      </table>
      <p>Đánh đổi: mô hình nặng chuyển sang luồng bất đồng bộ thì chấm điểm chậm vài giây, nên chỉ dùng cho phát hiện đường dây phức tạp.</p>
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Bảng này cho thấy vì sao mô hình nặng không đứng ở luồng đồng bộ. Ngay ở mức nhỏ, tám mươi mili giây đã vượt ngân sách độ trễ của luồng đồng bộ. Ở năm nghìn giao dịch mỗi giây, mô hình nặng cần khoảng năm mươi máy tám nhân chỉ để chấm điểm. Ở năm mươi nghìn, nó cần khoảng năm trăm máy, trong khi mô hình nhẹ chỉ cần khoảng mười ba máy. Đánh đổi là mô hình nặng đặt ở luồng bất đồng bộ thì chấm điểm chậm vài giây, nên chỉ dùng cho các đường dây phức tạp.
- id: check
  kind: check
  title: 'Tự Kiểm tra: Bản lĩnh Trả lời Phỏng vấn về Bằng Cử nhân AI UIT'
  checks:
  - 2026 - 2025 == 1
  - 1000 // 100 == 10
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn thường gặp</b>: Bạn đang làm về tích hợp hệ thống ngân hàng. Tại sao lại đi học Cử nhân Trí tuệ Nhân tạo tại UIT? Liệu có phải bạn đang định hướng chuyển nghề sang làm nghiên cứu dữ liệu?</p>
      <ul>
        <li>(A) Nói rằng dự án AI của bạn đã chạy thật ở ngân hàng cũ và giúp giảm mạnh thất thoát, vì như vậy nghe thuyết phục hơn.</li>
        <li>(B) Trả lời thẳng thắn: Mục tiêu nhất quán là trở thành Kỹ sư Kiến trúc Tích hợp Cấp cao, và AI là nền toán học giúp hiểu các bài toán như phát hiện bất thường, vốn khó giải bằng luật if-else thuần túy.</li>
        <li>(C) Nói rằng học AI chỉ là sở thích cá nhân, không liên quan gì tới công việc tích hợp hiện tại.</li>
      </ul>
    focus:
    - 0
    - 0
    say: Mời bạn lựa chọn chiến lược trả lời câu hỏi cốt tử của lãnh đạo khối công nghệ thông tin. Khi người phỏng vấn hỏi động cơ học cử nhân trí tuệ nhân tạo, bạn trả lời thế nào.
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn (B)</b></p>
      <div class="box key">Giải thích vì: Khẳng định mục tiêu nhất quán trở thành Kỹ sư Kiến trúc Cấp cao giúp hội đồng phỏng vấn thấy rõ tầm nhìn dài hạn của bạn. Nền tảng AI tại UIT là điểm bổ trợ giúp bạn khác biệt, miễn là nói đúng: dự kiến tốt nghiệp cuối năm 2026, dự án AI ở mức nguyên mẫu học thuật.</div>
    focus:
    - 0
    say: Đáp án chính xác là lựa chọn B vì nó khẳng định tầm nhìn nhất quán của bạn, nên chương trình học trí tuệ nhân tạo là phần bổ trợ chứ không phải sự phân tán định hướng.
    clear: true
- id: pitfall
  kind: pitfall
  title: 'Bẫy Nguy hiểm: Dùng Mô hình Quá Nặng làm Nghẽn Cổng Thanh toán'
  steps:
  - show: |-
      <div class="box pit">Sai lầm chết người khi ứng dụng AI vào cổng giao dịch tài chính:</div>
      <table class="t" style="margin-top: 10px;">
        <tr><th>sai lầm sơ cấp</th><th>hậu quả hệ thống</th><th>giải pháp chuẩn Senior UIT</th></tr>
        <tr><td>Nhúng mạng nơ-ron sâu vào luồng đồng bộ</td><td>Độ trễ tăng mạnh, dễ làm quá hạn API</td><td>Ưu tiên mô hình cây nhẹ chạy trong RAM; mô hình nặng đưa sang luồng chậm</td></tr>
        <tr><td>Gọi API học máy qua đường truyền mạng</td><td>Tạo thêm điểm nghẽn mạng phân tán</td><td>Nhúng trực tiếp thư viện mã máy nội tại ứng dụng (nếu buộc gọi mạng thì đặt hạn chờ ngắn và có phương án dự phòng)</td></tr>
      </table>
      <p>API = cách một chương trình gọi chương trình khác; quá hạn API = trả lời chậm hơn thời gian chờ cho phép.</p>
    focus:
    - 0
    - 0
    - 0
    say: Một sai lầm phổ biến là việc đưa các mô hình quá cồng kềnh vào luồng xử lý đồng bộ khiến thời gian phản hồi bị kéo dài. Trên luồng đồng bộ, kỹ sư cấp cao ưu tiên các mô hình nhỏ gọn đã được tối ưu hóa để thời gian thực thi tính bằng mili giây. Mô hình nặng được đưa sang luồng chậm chạy ngầm phía sau.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: Phân bổ Tài nguyên cho Cổng AI Ngân hàng'
  checks:
  - 10 - 5 == 5
  - 1000 > 5
  steps:
  - show: |-
      <p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong hệ thống chống rửa tiền và phát hiện gian lận đa tầng, phân hệ nào nên được xử lý đồng bộ và phân hệ nào nên đưa vào hàng đợi bất đồng bộ?</p>
      <ul>
        <li><b>A</b>: Xử lý đồng bộ kiểm tra điểm bất thường nhẹ (vài ms); đưa toàn bộ đồ thị quan hệ rửa tiền phức tạp vào hàng đợi Kafka để cụm máy chủ AI phân tích ngầm.</li>
        <li><b>B</b>: Xử lý toàn bộ trên luồng đồng bộ để đảm bảo an toàn tuyệt đối.</li>
        <li><b>C</b>: Đưa cả kiểm tra nhẹ lẫn đồ thị quan hệ vào hàng đợi bất đồng bộ, vì mô hình nhẹ cũng làm chậm giao dịch.</li>
        <li><b>D</b>: Chỉ dùng luật if-else cố định ở luồng đồng bộ và bỏ hẳn mô hình học máy vì quá phức tạp.</li>
      </ul>
      <p>Rửa tiền = chuyển tiền bất hợp pháp qua nhiều giao dịch để che nguồn gốc.</p>
    focus:
    - 0
    say: Xin mời bạn lựa chọn mô hình phân bổ tải tối ưu giữa kiểm tra tức thời và phân tích chuyên sâu.
    pause: 15
  - show: |-
      <div class="box key"><b>Đáp án chính xác là A</b>!</div>
      <p><b>Bước 1 — Nguyên tắc phân tầng rủi ro trong ngân hàng</b>:</p>
      <table class="t">
        <tr><th>tầng xử lý</th><th>độ trễ chấp nhận</th><th>mục tiêu bảo vệ</th></tr>
        <tr><td>Đồng bộ (Fast Path)</td><td>Mục tiêu vài mili giây (phải đo)</td><td>Chặn các giao dịch bất thường hiển nhiên ngay tại cửa ngõ</td></tr>
        <tr><td>Bất đồng bộ (Slow Path)</td><td>Vài giây đến vài phút</td><td>Phát hiện các đường dây rửa tiền phức tạp và giao dịch chéo</td></tr>
      </table>
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Ta chia hệ thống thành tầng kiểm tra tức thời tại cửa ngõ và tầng phân tích chuyên sâu chạy ngầm phía sau.
    clear: true
  - show: |-
      <table class="t">
        <tr><th>phương án</th><th>vì sao không chọn</th></tr>
        <tr><td>B: tất cả đồng bộ</td><td>mô hình nặng 80 ms ở 50 000 giao dịch mỗi giây cần 4 000 nhân và vượt ngân sách độ trễ (số minh hoạ ở phần quy mô)</td></tr>
        <tr><td>C: tất cả bất đồng bộ</td><td>giao dịch gian lận hiển nhiên đã được ghi sổ trước khi bị phát hiện, vài giây sau tiền đã đi mất</td></tr>
        <tr><td>D: chỉ luật cố định</td><td>luật cố định bỏ lỡ mẫu gian lận mới; nên giữ luật làm lớp nền cạnh mô hình nhẹ chứ không thay nó</td></tr>
      </table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Phương án B sai vì mô hình nặng ở năm mươi nghìn giao dịch mỗi giây cần bốn nghìn nhân và vượt ngân sách độ trễ. Phương án C sai vì giao dịch gian lận hiển nhiên đã được ghi sổ trước khi bị phát hiện. Phương án D sai vì luật cố định bỏ lỡ mẫu mới, nên chỉ làm lớp nền cạnh mô hình nhẹ.
  - show: |-
      <p><b>Bước 2 — Giá trị cấp số nhân mang lại cho ACB</b>:</p>
      <div class="box key">Kiến trúc đường dẫn kép giúp một ngân hàng vừa giữ trải nghiệm chuyển khoản nhanh, vừa có thêm lớp phân tích rủi ro sâu chạy ngầm. Đây là ý tưởng thiết kế, không phải hệ thống ứng viên đã vận hành.</div>
    focus:
    - 0
    - 0
    say: Bước hai, mô hình đường dẫn kép giúp ngân hàng cân bằng giữa trải nghiệm mượt mà và an toàn bảo mật. Khi trình bày, hãy nói rõ đây là ý tưởng thiết kế, không phải hệ thống bạn đã vận hành.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: trả lời một câu phỏng vấn có số về số nhân xử lý, điểm Z, UCB1 và cosine'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi bảy ý nhỏ: (1) <b>12 000</b> giao dịch mỗi giây, mô hình nhẹ <b>3 mili giây</b> cần mấy nhân; (2) mô hình nặng <b>40 mili giây</b> cần mấy nhân; (3) giao dịch <b>45 triệu</b>, trung bình 30 ngày <b>5 triệu</b>, độ lệch chuẩn <b>4 triệu</b> thì điểm Z; (4) hai kênh, cùng tỉ lệ thành công 0,9: A thành công <b>180 trên 200</b> lần, B thành công <b>9 trên 10</b> lần, tổng đã thử <b>210</b>, hệ số khám phá bằng căn bậc hai của 2 — điểm UCB1 mỗi kênh và chọn kênh nào; (5) cosine của hai véc tơ <b>(2, 1)</b> và <b>(1, 3)</b>.</p>
      <p class="note">Định dạng bảy dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Tính số nhân cho mô hình nhẹ và mô hình nặng ở mười hai nghìn giao dịch mỗi giây, rồi điểm Z của giao dịch bốn mươi lăm triệu. Sau đó chấm điểm hai kênh có cùng tỉ lệ thành công nhưng số lần thử khác nhau và chọn một kênh, rồi tính độ tương đồng Cosine của hai véc tơ. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>so nhan mo hinh nhe 3 ms: 36</div><div>so nhan mo hinh nang 40 ms: 480</div><div>diem Z: 10</div><div>diem A: 1.13</div><div>diem B: 1.93</div><div>chon kenh: B</div><div>cosine: 0.707</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L05/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> số nhân = giao dịch mỗi giây × thời gian (giây). Điểm Z = (số tiền − trung bình) chia độ lệch chuẩn. UCB1 = tỉ lệ thành công + căn bậc hai của (2 × ln N chia số lần thử của kênh); kênh ít được thử có phần khám phá lớn hơn. Cosine = tích vô hướng chia tích hai độ dài.
      Lời giải đầy đủ ở <code>labs/INT/L05/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, số nhân bằng số giao dịch mỗi giây nhân với thời gian xử lý tính bằng giây, còn điểm Z bằng số tiền trừ trung bình rồi chia độ lệch chuẩn. Điểm của mỗi kênh bằng tỉ lệ thành công cộng phần khám phá, và kênh ít được thử có phần khám phá lớn hơn. Độ tương đồng Cosine bằng tích vô hướng chia tích hai độ dài. Lời giải đầy đủ nằm trong thư mục thực hành.
  lab: labs/INT/L05
- id: recap
  kind: recap
  title: Tổng kết chuỗi logic Ứng dụng AI và Giá trị Cấp số nhân UIT
  steps:
  - show: |-
      <div class="chain">
        <span>Nền tảng Toán & Giải thuật Cử nhân AI UIT</span> &rarr;
        <span>Mô hình Đường dẫn kép Fast Path & Slow Path</span> &rarr;
        <span>Suy luận ONNX Runtime trong RAM (mục tiêu vài ms)</span> &rarr;
        <span>Thuật toán Bandit UCB1 Định tuyến Thông minh</span> &rarr;
        <span>Trình bày trung thực, nêu việc học AI đúng mức</span>
      </div>
      <table class="t" style="margin-top: 15px;">
        <tr><th>lợi thế cạnh tranh</th><th>giá trị có thể tạo ra (ý tưởng thiết kế)</th></tr>
        <tr><td>Tư duy giải thuật tối ưu</td><td>Hiểu hệ thống phân tán, giảm bế tắc khoá (hai bên giữ khoá chờ nhau mãi) nhờ khoá theo thứ tự nhất quán; mức giảm phải đo</td></tr>
        <tr><td>Học máy thời gian thực</td><td>Phát hiện bất thường sớm hơn; hiệu quả phải đo trên dữ liệu thật</td></tr>
        <tr><td>Tự động hóa đối soát AI</td><td>Giảm việc dò tay; mức giảm và tỉ lệ khớp phải đo trên tập có nhãn</td></tr>
      </table>
    focus:
    - 0
    - 0
    clear: true
    say: Tóm lại, chuỗi logic gồm nền tảng học thuật đại học, kiến trúc đường dẫn kép, suy luận máy học tốc độ cao và định tuyến thông minh. Hãy nói trung thực rằng mới ở mức nguyên mẫu học thuật.
