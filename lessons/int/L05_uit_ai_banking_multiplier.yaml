      nhân tạo, ứng viên bản lĩnh sẽ thể hiện định hướng nghề nghiệp như thế nào.
  - show: '<p><b>Đáp án chính xác: Lựa chọn (B)</b></p>

      <div class="box key">Giải thích vì: Khẳng định mục tiêu nhất quán trở thành
