- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Phân bổ Tài nguyên cho Cổng AI Ngân hàng'
  checks:
  - 10 - 5 == 5
  - 1000 > 5
  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong hệ thống chống rửa tiền\
      \ và phát hiện gian lận đa tầng, phân hệ nào nên được xử lý đồng bộ và phân\
      \ hệ nào nên đưa vào hàng đợi bất đồng bộ?</p>\n<ul>\n  <li><b>A</b>: Xử lý\
      \ đồng bộ kiểm tra điểm bất thường nhẹ (vài ms); đưa toàn bộ đồ thị quan hệ\
      \ rửa tiền phức tạp vào hàng đợi Kafka để cụm máy chủ AI phân tích ngầm.</li>\n\
      \  <li><b>B</b>: Xử lý toàn bộ trên luồng đồng bộ để đảm bảo an toàn tuyệt đối.</li>\n\
      \  <li><b>C</b>: Không cần kiểm tra đồng bộ, chỉ gửi báo cáo vào cuối tháng.</li>\n\
      \  <li><b>D</b>: Chuyển toàn bộ dữ liệu sang cho đối tác nước ngoài xử lý.</li>\n\
      </ul>"
    focus:
    - 0
    - 0
    say: Xin mời bạn lựa chọn mô hình phân bổ tải tối ưu giữa kiểm tra tức thời và
      phân tích chuyên sâu. Bạn có 15 giây suy nghĩ trước khi nghe phân tích chuẩn
      mực từ chuyên gia hệ thống.
    pause: 15
  - show: "<div class=\"box key\"><b>Đáp án chính xác là A</b>!</div>\n<p><b>Bước\
      \ 1 — Nguyên tắc phân tầng rủi ro trong ngân hàng</b>:</p>\n<table class=\"\
      t\">\n  <tr><th>tầng xử lý</th><th>độ trễ chấp nhận</th><th>mục tiêu bảo vệ</th></tr>\n\
      \  <tr><td>Đồng bộ (Fast Path)</td><td>Mục tiêu vài mili giây (phải đo)</td><td>Chặn các\
      \ giao dịch bất thường hiển nhiên ngay tại cửa ngõ</td></tr>\n  <tr><td>Bất\
      \ đồng bộ (Slow Path)</td><td>Vài giây đến vài phút</td><td>Phát hiện các đường\
      \ dây rửa tiền phức tạp và giao dịch chéo</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Ta chia hệ thống thành tầng kiểm tra tức
      thời tại cửa ngõ và tầng phân tích chuyên sâu chạy ngầm phía sau. Cách phân
      bổ này vừa bảo đảm tốc độ phục vụ khách hàng, vừa phát hiện được các thủ đoạn
      tinh vi.
    clear: true
  - show: '<p><b>Bước 2 — Giá trị cấp số nhân mang lại cho ACB</b>:</p>

      <div class="box key">Kiến trúc đường dẫn kép giúp một ngân hàng vừa giữ trải
      nghiệm chuyển khoản nhanh, vừa có thêm lớp phân tích rủi ro sâu chạy ngầm. Đây
      là ý tưởng thiết kế, không phải hệ thống ứng viên đã vận hành.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, mô hình đường dẫn kép giúp ngân hàng cân bằng giữa trải nghiệm
      mượt mà và an toàn bảo mật. Khi trình bày, hãy nói rõ đây là ý tưởng thiết kế,
      không phải hệ thống bạn đã vận hành.
    clear: true
