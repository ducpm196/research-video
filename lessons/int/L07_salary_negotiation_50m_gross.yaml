        <li>Lương được xem xét tăng bao lâu một lần?</li>
        <li>Thời gian thử việc bao lâu, mức lương thử việc tính thế nào? (luật lao động giới hạn thời gian thử việc: cần kiểm lại văn bản hiện hành)</li>
