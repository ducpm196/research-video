scenes:
- id: hook
  kind: hook
  title: Nghệ thuật Đàm phán Mức lương 50 Triệu Gross
  steps:
  - show: '<p>Đa số kỹ sư đi phỏng vấn bị động chấp nhận mức lương do phòng nhân sự
      áp đặt theo khung thâm niên có sẵn.</p>

      <div class="box key">Tại sao một kỹ sư có 3 năm tích hợp ngân hàng lõi có thể
      tự tin đề xuất 50 triệu gross (gói năm 700 đến 850 triệu)? Bí quyết nằm ở việc
      chuyển cuộc đối thoại từ thời gian làm việc sang giá trị có bằng chứng.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, nhiều kỹ sư tài năng thường ngập ngừng khi đàm phán mức lương vì
      bị rào cản số năm kinh nghiệm đè nặng. Giá trị của một Kỹ sư Cấp cao không chỉ
      đo bằng số tháng ngồi ở văn phòng, mà còn đo bằng quy mô rủi ro mà bạn đã thật
      sự giải quyết. Hôm nay, ta cùng nhau giải mã chiến lược đề xuất và bảo vệ có
      căn cứ mức lương năm mươi triệu gross.
  - show: "<table class=\"t\">\n  <tr><th>đối thoại thông thường</th><th>đối thoại\
      \ chuyển dịch giá trị (Value Anchor)</th></tr>\n  <tr><td>Em có 3 năm kinh nghiệm,\
      \ mong muốn lương 40 triệu</td><td>Tôi chịu trách nhiệm an toàn cho luồng tích\
      \ hợp mình phụ trách</td></tr>\n  <tr><td>Hỏi gì đáp nấy, phụ thuộc vào khung\
      \ lương của HR</td><td>Chứng minh giá trị bằng bằng chứng và số đo thật</td></tr>\n\
      \  <tr><td>Bị ép giá vì chưa nhận bằng đại học</td><td>Nói đúng mốc dự kiến\
      \ 11/2026, nêu kinh nghiệm từ 01/2019</td></tr>\n</table>\n<p>Hôm\
      \ nay, ta làm chủ: <b>Ma trận giá trị có bằng chứng</b>, <b>kịch bản đối đáp 3\
      \ vòng phỏng vấn</b>, và <b>nghệ thuật hóa giải đòn ép giá</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba kỹ thuật đàm phán của nhân sự cấp cao.
      Ta tìm hiểu cách xây dựng ma trận giá trị bằng những bằng chứng có thật. Ta nắm vững kịch bản đối đáp chi tiết qua từng vòng tuyển dụng. Ta cũng
      làm chủ nghệ thuật phản biện thông minh trước mọi câu hỏi ép giá của phòng nhân
      sự.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: Căn cứ Tài chính và Ma trận Giá trị (ROI)'
  checks:
  - 50000000 * 12 == 600000000
  - 50 - 42 == 8
  - 50 * (1 + 1) == 100
  - 50 * (1 + 4) == 250
  steps:
  - show: "<p><b>Ma trận So sánh Chi phí Tuyển dụng và Giá trị Bảo vệ Tài sản</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>chi phí ngân hàng chi trả (50M Gross)</th><th>giá\
      \ trị Kỹ sư Cấp cao mang lại cho ACB</th></tr>\n  <tr><td>Lương cơ bản: 600\
      \ triệu đồng một năm</td><td>Giảm rủi ro sự cố tích hợp: nêu một sự cố thật\
      \ đã xử lý</td></tr>\n  <tr><td>Tháng 13 + thưởng 1–4 tháng: 100 đến 250\
      \ triệu đồng một năm</td><td>Hòa nhập nhanh vì đã làm với Core T24, Oracle, Kafka</td></tr>\n\
      \  <tr><td>Chi phí bảo hiểm và trang thiết bị máy trạm</td><td>Chỉ nêu số tiền\
      \ tiết kiệm khi có số đo thật</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại bài toán tài chính từ góc nhìn của ban điều hành ngân
      hàng. Với mức lương năm mươi triệu gross, gói thu nhập một năm vào khoảng bảy
      trăm đến tám trăm năm mươi triệu, tuỳ số tháng thưởng. Một kỹ sư giỏi có thể
      giúp giảm rủi ro sự cố và rút ngắn thời gian hòa nhập, nhưng bạn chỉ nêu con
      số khi có số đo thật.
  - show: '<div class="box key">Quy tắc ở vòng sàng lọc hồ sơ: khai đúng Tổng thu nhập
      thật hiện tại (lương cứng, phụ cấp, thưởng) = [điền số thật theo bảng lương].
      Không khai cao hơn thực tế: ngân hàng có thể xác minh.</div>'
    focus:
    - 0
    - 0
    say: Nguyên tắc cốt tử ngay từ vòng đầu tiên là khai đúng tổng thu nhập thật, gồm
      lương cứng, phụ cấp và thưởng, theo bảng lương của bạn. Tuyệt đối không khai
      cao hơn thực tế, vì ngân hàng có thể xác minh.
    clear: true
