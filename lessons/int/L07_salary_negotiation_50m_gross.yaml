- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Phân tích Tổng Thu nhập Năm Thực nhận'
  checks:
  - 50 * 12 == 600
  - 600 + 50 == 650
  - 650 + 50 * 1 == 700
  - 650 + 50 * 4 == 850
  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm tài chính cá nhân</b>: Giả sử lương 50 triệu\
      \ gross tại ACB; tin tuyển dụng ghi lương tháng 13 cố định và thưởng 1 đến 4\
      \ tháng lương tuỳ xếp loại. Thu nhập trước thuế cả năm nằm trong khoảng nào?</p>\n\
      <ul>\n  <li><b>A</b>: Đúng 600 triệu đồng tròn.</li>\n  <li><b>B</b>: Từ 700\
      \ đến 850 triệu đồng (14 đến 17 tháng lương).</li>\n  <li><b>C</b>: Cố định\
      \ 750 triệu đồng.</li>\n  <li><b>D</b>: 1 tỉ đồng.</li>\n</ul>"
    focus:
    - 0
    - 0
    say: Xin mời bạn tính toán nhanh tổng thu nhập năm thực tế khi đạt mức lương kỳ
      vọng tại ngân hàng. Bạn có 15 giây suy nghĩ trước khi nghe công thức tính toán
      chuẩn mực.
    pause: 15
  - show: "<div class=\"box key\"><b>Đáp án chính xác là B</b>!</div>\n<p><b>Bước\
      \ 1 — Bóc tách cấu trúc thu nhập cả năm</b>:</p>\n<table class=\"t\">\n  <tr><th>khoản\
      \ thu nhập</th><th>công thức tính toán</th><th>tổng số tiền thực nhận</th></tr>\n\
      \  <tr><td>Lương 12 tháng</td><td>50 triệu nhân 12 tháng</td><td>600 triệu đồng</td></tr>\n\
      \  <tr><td>Lương tháng 13 cố định</td><td>600 triệu cộng 50 triệu</td><td>650\
      \ triệu đồng</td></tr>\n  <tr><td>Thưởng 1 đến 4 tháng</td><td>650 cộng 50 đến\
      \ 200 triệu</td><td>700 đến 850 triệu đồng một năm</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án B. Mức lương năm mươi triệu nhân với mười bốn
      đến mười bảy tháng cho tổng thu nhập từ bảy trăm đến tám trăm năm mươi triệu
      đồng một năm. Con số cụ thể phụ thuộc xếp loại thưởng cuối năm, nên không nói
      một con số cố định.
    clear: true
  - show: '<p><b>Bước 2 — Vì sao không nói một con số cố định</b>:</p>

      <div class="box key">Thưởng phụ thuộc xếp loại, và lương trong tin tuyển dụng
      ACB ghi "Thương lượng". Hãy hỏi HR: thưởng tính trên lương cứng hay tổng thu
      nhập, và điều kiện xếp loại ra sao.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, vì thưởng phụ thuộc xếp loại và lương trong tin tuyển dụng ghi thương
      lượng, bạn nên nói khoảng thu nhập thay vì một con số cố định. Hãy hỏi phòng
      nhân sự thưởng được tính trên lương cứng hay tổng thu nhập, và điều kiện xếp
      loại ra sao.
    clear: true
