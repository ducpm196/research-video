- id: practice
  kind: practice
  title: 'Tự làm: so hai đề nghị bằng tổng đãi ngộ năm'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Bạn nhận hai đề nghị, cả hai có tháng 13 cố định và thưởng <b>k = 2</b> tháng lương. <b>Offer A</b>: lương cứng <b>38</b> triệu, không phụ cấp. <b>Offer B</b>: lương cứng <b>34</b> triệu, phụ cấp <b>2</b> triệu mỗi tháng. Giả định phụ cấp không được tính vào thưởng.</p>
      <p>Viết bốn dòng: tổng đãi ngộ năm của A; của B; A hơn B bao nhiêu; phụ cấp mỗi tháng B cần có để tổng đãi ngộ bằng A.</p>
      <p class="note">Định dạng bốn dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Hai đề nghị cùng có tháng mười ba cố định và thưởng hai tháng lương. Phương án A lương cứng 38 triệu không phụ cấp, phương án B lương cứng 34 triệu cộng phụ cấp 2 triệu mỗi tháng. Hãy tính tổng đãi ngộ năm của từng phương án, phần A hơn B, và phụ cấp mỗi tháng B cần có để bằng A. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>offer A tong nam (k=2): 570 trieu</div><div>offer B tong nam (k=2): 534 trieu</div><div>chenh lech A hon B: 36 trieu</div><div>phu cap B can de bang A: 5 trieu/thang</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L07/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> T = L × (13 + k) + 12 × P với k = 2, nên L × 15 cộng 12 lần phụ cấp. Chênh lệch = T của A trừ T của B. Phụ cấp cần có: lấy T của A, trừ phần lương của B (34 × 15), rồi chia cho 12.
      Lời giải đầy đủ ở <code>labs/INT/L07/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, tổng đãi ngộ bằng L nhân mười lăm, vì k bằng hai, cộng mười hai lần phụ cấp. Chênh lệch bằng tổng đãi ngộ của A trừ của B. Phụ cấp cần có bằng tổng đãi ngộ của A, trừ phần lương của B là 34 nhân 15, rồi chia cho mười hai. Lời giải đầy đủ nằm trong thư mục thực hành.
  lab: labs/INT/L07
