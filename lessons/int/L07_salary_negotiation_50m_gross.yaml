    say: Quy trình đàm phán trải qua ba vòng độc lập. Ở vòng một, bạn neo giá trị
      vào tổng thu nhập thật của mình và đề xuất mức kỳ vọng năm mươi triệu. Ở vòng
      hai, bạn dùng chuyên môn thực chiến thuyết phục hội đồng kỹ thuật. Ở vòng ba,
      bạn giữ vững lập trường kiên định để chốt thỏa thuận có lợi nhất.
  - show: '<div class="box key">Chiến thuật Đối ứng Kiên định Firm Counter-Offer:
      Giả sử phòng nhân sự đề xuất 42 triệu do vướng khung kinh nghiệm, ta không vội
      đồng ý mà đưa ra cấu trúc linh hoạt: 46 triệu lương cứng cộng 4 triệu phụ cấp,
      hoặc cam kết KPI trong thời gian thử việc (tối đa 60 ngày, Điều 25 BLLĐ 2019).</div>'
    focus:
    - 0
    - 0
    say: Khi nhận đề xuất thấp hơn kỳ vọng, kỹ sư thông minh không từ chối gay gắt
