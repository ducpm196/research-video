    say: Đây là bốn câu nên hỏi nhà tuyển dụng, và không câu nào cần bạn nêu một con số. Câu đầu hỏi khung lương và các khoản cấu thành. Câu hai hỏi tháng mười ba và thưởng tính trên lương cứng hay tổng thu nhập. Câu ba hỏi chu kỳ xem xét tăng lương. Câu bốn hỏi thời gian thử việc, và bạn nên kiểm lại quy định hiện hành của luật lao động.
- id: symbol
  kind: symbol
  title: Công thức Định dạng Thu nhập và Cấu trúc Gói Đãi ngộ Toàn diện
  checks:
  - 34 * 15 + 12 * 2 == 534
  - 34 * 15 == 510
  - 38 * 15 == 570
  steps:
  - show: |
      <p><b>Công thức tổng đãi ngộ năm</b> (trước thuế). Mọi con số dưới đây là số minh hoạ để tập tính:</p>
      <div class="box key">
      $$T = L \times (13 + k) + 12 \times P$$
      $$L = 34,\ k = 2,\ P = 2 \text{ (số minh hoạ)}: T = 34 \times 15 + 12 \times 2 = 534 \text{ triệu}$$
      </div>
      <p>$L$ = lương cứng mỗi tháng, $k$ = số tháng thưởng, $P$ = phụ cấp mỗi tháng, đơn vị triệu. Công thức giả định thưởng và tháng 13 tính trên lương cứng $L$, còn phụ cấp $P$ không được tính vào thưởng; mỗi nơi tính khác nhau nên phải hỏi. Tách phụ cấp có thể đổi cách tính bảo hiểm xã hội (BHXH), thưởng và tháng 13.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    clear: true
    say: Đây là công thức tổng đãi ngộ năm. T bằng L nhân mười ba cộng k, cộng mười hai lần phụ cấp P mỗi tháng. Với L bằng 34, k bằng 2 và P bằng 2 triệu, một bộ số minh hoạ, T bằng 34 nhân 15 cộng 24, được 534 triệu. Công thức giả định thưởng và tháng mười ba tính trên lương cứng, còn phụ cấp không được tính vào thưởng. Mỗi nơi tính khác nhau, nên bạn phải hỏi, nhất là việc tách phụ cấp ảnh hưởng thế nào tới bảo hiểm xã hội, thưởng và tháng mười ba.
  - show: |-
      <p><b>Danh mục 4 Phúc lợi Ngoài lương cần Đối soát</b> (mục 1 có nguồn, mục 2–4 là câu cần hỏi HR, tức phòng nhân sự):</p>
      <div class="box ok">
      <p>1. Tháng lương 13 cố định + thưởng 1 đến 4 tháng lương tuỳ xếp loại (tin tuyển dụng ACB)</p>
      <p>2. Hỏi: gói bảo hiểm sức khoẻ áp dụng cho chức danh, phạm vi và người thân</p>
      <p>3. Hỏi: máy cấp phát, chính sách làm việc linh hoạt</p>
      <p>4. Hỏi: ngân sách đào tạo, chứng chỉ được tài trợ và cam kết đi kèm</p>
      </div>
    focus:
