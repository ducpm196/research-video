scenes:
- id: hook
  kind: hook
  title: 'Nghệ thuật đàm phán thu nhập: hỏi khung trước, nêu số sau'
  steps:
  - show: |
      <p>Đa số kỹ sư đi phỏng vấn bị động chấp nhận mức lương do phòng nhân sự đưa ra, hoặc nêu một con số theo cảm tính. Bí quyết nằm ở hai việc: <b>hỏi khung lương và cấu trúc thu nhập của vị trí trước</b>, rồi chuyển cuộc đối thoại từ thời gian làm việc sang giá trị có bằng chứng.</p>
      <div class="box key">Tin tuyển dụng chính thức thường ghi lương là &laquo;Thương lượng&raquo;, còn các con số lương trên mạng chênh nhau nhiều và hay không có nguồn. Vì vậy bài này <b>không đưa mức lương nào</b>: mọi số tiền trong bài là số minh hoạ để tập tính.</div>
      <p><i>Lương gross</i> = lương ghi trong hợp đồng, trước khi trừ thuế thu nhập cá nhân và phần bảo hiểm bắt buộc của người lao động; số tiền thực nhận (net) thấp hơn. <i>ACB</i> = Ngân hàng Thương mại Cổ phần Á Châu; <i>UIT</i> = Trường Đại học Công nghệ Thông tin, thuộc Đại học Quốc gia TP.HCM.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, nhiều kỹ sư tài năng thường nêu ngay một con số lương theo cảm tính, hoặc chấp nhận mức nhà tuyển dụng đưa ra. Bí quyết là hỏi khung lương và cấu trúc thu nhập của vị trí trước, rồi mới đối thoại bằng giá trị có bằng chứng. Tin tuyển dụng chính thức thường ghi lương là thương lượng, còn các con số lương trên mạng chênh nhau nhiều và hay không có nguồn, nên bài này không đưa mức lương nào. Mọi số tiền trong bài là số minh hoạ để tập tính. Lương gross là lương ghi trong hợp đồng, trước khi trừ thuế và bảo hiểm bắt buộc, nên số thực nhận thấp hơn.
  - show: |
      <table class="t">
        <tr><th>đối thoại thông thường</th><th>đối thoại có căn cứ</th></tr>
        <tr><td>Nêu ngay một con số khi chưa biết khung lương</td><td>Hỏi khung lương và cấu trúc thu nhập, rồi nêu khoảng kỳ vọng</td></tr>
        <tr><td>Chỉ nói về số năm làm việc</td><td>Chứng minh giá trị bằng một sự cố đã xử lý, kèm số đo thật hoặc nói rõ chưa đo</td></tr>
        <tr><td>Bị ép vì chưa nhận bằng đại học</td><td>Nói đúng mốc dự kiến cuối năm 2026, nêu kinh nghiệm thật của bạn</td></tr>
      </table>
      <p>Hôm nay, ta làm chủ: <b>công thức tổng đãi ngộ</b>, <b>kịch bản đối đáp ba vòng</b>, và <b>cách đáp ba đòn ép giá</b>.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    clear: true
    say: Hôm nay, ta khám phá ba kỹ thuật đàm phán. Đầu tiên là công thức tổng đãi ngộ, để so các đề nghị bằng con số thay vì cảm giác. Tiếp theo là kịch bản đối đáp qua ba vòng tuyển dụng. Cuối cùng là cách đáp ba đòn ép giá thường gặp, bằng lời trung thực.
- id: prereq
  kind: prereq
  title: 'Trước hết: các thành phần của tổng đãi ngộ và câu cần hỏi'
  checks:
  - 32 * 12 == 384
  - 384 + 32 == 416
  - 416 + 32 * 1 == 448
  - 416 + 32 * 4 == 544
  steps:
  - show: |
      <p><b>Tổng đãi ngộ</b> = mọi khoản bạn nhận trong một năm, không chỉ lương hàng tháng:</p>
      <table class="t">
        <tr><th>thành phần</th><th>ý nghĩa bằng lời thường</th><th>câu cần hỏi nhà tuyển dụng</th></tr>
        <tr><td>Lương cứng L</td><td>lương gross ghi trong hợp đồng mỗi tháng</td><td>khung lương của vị trí là bao nhiêu</td></tr>
        <tr><td>Tháng 13</td><td>thêm một tháng lương mỗi năm</td><td>cố định hay có điều kiện (tin ACB đã lưu, đọc 2026-11, ghi cố định; kiểm lại tin hiện hành)</td></tr>
        <tr><td>Thưởng k tháng</td><td>thưởng bằng k tháng lương, tuỳ xếp loại (tin ACB ghi 1–4 tháng)</td><td>tính trên lương cứng hay tổng thu nhập; điều kiện xếp loại</td></tr>
        <tr><td>Phụ cấp P</td><td>khoản cộng thêm mỗi tháng</td><td>có tính vào bảo hiểm và thưởng không</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    clear: true
    say: Trước hết, ta cần hiểu tổng đãi ngộ là mọi khoản bạn nhận trong một năm, không chỉ lương hàng tháng. Lương cứng L là lương gross ghi trong hợp đồng. Tháng mười ba là thêm một tháng lương mỗi năm, và tin tuyển dụng của ACB ghi là cố định. Thưởng k tháng là thưởng bằng k tháng lương tuỳ xếp loại, còn phụ cấp P là khoản cộng thêm mỗi tháng. Với mỗi khoản, bạn cần hỏi nhà tuyển dụng nó cố định hay có điều kiện, và tính trên lương cứng hay tổng thu nhập.
  - show: '<div class="box key">Quy tắc ở vòng sàng lọc hồ sơ: khai đúng Tổng thu nhập thật hiện tại (lương cứng, phụ cấp, thưởng) = [điền số thật theo bảng lương]. Không khai cao hơn thực tế: ngân hàng có thể xác minh.</div>'
    focus:
    - 0
    - 0
    say: Nguyên tắc cốt tử ngay từ vòng đầu tiên là khai đúng tổng thu nhập thật, gồm lương cứng, phụ cấp và thưởng, theo bảng lương của bạn. Tuyệt đối không khai cao hơn thực tế, vì ngân hàng có thể xác minh.
    clear: true
