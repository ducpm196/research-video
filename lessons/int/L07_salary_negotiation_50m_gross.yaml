      việc để tháo gỡ vướng mắc cho phòng nhân sự.
    clear: true
- id: symbol
  kind: symbol
  title: Công thức Định dạng Thu nhập và Cấu trúc Gói Đãi ngộ Toàn diện
  checks:
  - 46000000 + 4000000 == 50000000
  - 50 * (13 + 1) == 700
  - 50 * (13 + 4) == 850
  steps:
  - show: '<p><b>Ba Cấu trúc Đề xuất Linh hoạt để Đạt mục tiêu 50M Gross</b>:</p>

      <div class="box key">

      $$\text{Phương án A (Chuẩn): } 50\,000\,000\text{ VND Gross mỗi tháng}$$

      $$\text{Phương án B (Linh hoạt): } 46\,000\,000\text{ Lương cứng} + 4\,000\,000\text{
      Phụ cấp cao tải}$$

      $$\text{Phương án C (Thử thách): } 50\,000\,000\text{ Gross đi kèm cam kết KPI
      thử việc}$$

      </div>

      <p>Gói năm nếu đạt 50M: 50 × (13 + 1 đến 4) = 700 đến 850 triệu đồng (tháng 13
      cố định + thưởng 1–4 tháng tuỳ xếp loại). Tách phụ cấp làm đổi cách tính BHXH,
      thưởng và tháng 13: hỏi HR trước.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Ta chuẩn bị sẵn ba phương án linh hoạt để đề xuất mức đãi ngộ mong muốn. Nếu
      ngân hàng gặp rào cản về thang bảng lương cứng, phương án kết hợp phụ cấp hoặc
      cam kết hiệu quả thử việc có thể gỡ nút thắt. Nhưng hãy hỏi phòng nhân sự cách
      tính bảo hiểm xã hội và thưởng khi tách phụ cấp.
  - show: '<p><b>Danh mục 4 Phúc lợi Ngoài lương cần Đối soát</b> (mục 1 có nguồn,
      mục 2–4 là câu cần hỏi HR):</p>

      <div class="box ok">

      <p>1. Tháng lương 13 cố định + thưởng 1 đến 4 tháng lương tuỳ xếp loại (tin
      tuyển dụng ACB)</p>

      <p>2. Hỏi: gói bảo hiểm sức khoẻ áp dụng cho chức danh, phạm vi và người thân</p>

      <p>3. Hỏi: máy cấp phát, chính sách làm việc linh hoạt</p>

      <p>4. Hỏi: ngân sách đào tạo, chứng chỉ được tài trợ và cam kết đi kèm</p>

      </div>'
    focus:
    - 0
    - 0
    say: Ngoài tiền lương hàng tháng, bạn cần kiểm tra kỹ bốn chế độ phúc lợi kèm
      theo. Tháng lương thứ mười ba và thưởng có ghi trong tin tuyển dụng, còn bảo
      hiểm sức khoẻ, thiết bị và ngân sách đào tạo là những câu bạn cần hỏi phòng
      nhân sự.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Bẻ gãy Ba Đòn Ép giá Kinh điển của Tuyển dụng'
  checks:
  - 50000000 * 14 == 700000000
  - 50000000 * 17 == 850000000
  - 50 - 45 == 5
  steps:
  - show: '<p><b>Đòn ép giá số 1: Thị trường năm nay các ngân hàng đều thắt chặt ngân
      sách tuyển dụng</b></p>

      <div class="box pit">Tâm lý nhân sự: Tạo áp lực khan hiếm cơ hội việc làm để
      ép ứng viên hạ thấp mức kỳ vọng lương.</div>

      <div class="box key">Lời đáp trả chuẩn mực: Dạ em rất hiểu ngân hàng đang tối
      ưu hóa chi phí vận hành. Chính vì vậy, việc tuyển một Kỹ sư Cấp cao có thể làm
      được việc sớm, giảm chi phí sai sót và chi phí đào tạo lại, là một cách dùng
      ngân sách hiệu quả cho ACB.</div>'
    focus:
    - 0
    - 0
    say: Khi phòng nhân sự nói thị trường thắt chặt ngân sách, bạn đảo ngược tình
      thế bằng cách cho thấy tuyển kỹ sư làm được việc sớm là cách dùng ngân sách hiệu
      quả. Ngân hàng giảm được chi phí sửa chữa sai sót và thời gian đào tạo lại.
  - show: "<p><b>Đòn ép giá số 2: Bạn chưa nhận bằng Cử nhân AI (UIT, dự kiến 11/2026),\
      \ liệu có quá sớm để nhận mức 50 triệu?</b></p>\n<table class=\"t\" style=\"margin-bottom:\
      \ 8px;\">\n  <tr><th>yếu tố đánh giá</th><th>góc nhìn của nhân sự</th><th>thực\
      \ tế của ứng viên</th></tr>\n  <tr><td>Cử nhân AI UIT</td><td>Chưa\
      \ nhận bằng</td><td>Học song song khi đi làm, dự kiến 11/2026</td></tr>\n\
      \  <tr><td>Kinh nghiệm công tác</td><td>Nghi ngờ thời gian làm việc</td><td>Đi\
      \ làm từ 01/2019: Sutrix, freelance, Grooo, OCB</td></tr>\n</table>\n<div\
      \ class=\"box key\">Lời đáp: Dạ em đi làm phần mềm từ 01/2019: Sutrix (2019–2021),\
      \ freelance (2022), Grooo làm dự án cho Mirae Asset Finance (2022–2023) và OCB\
      \ (10/2023 – nay). Bằng Cử nhân AI tại UIT là phần em học thêm song song, dự\
      \ kiến tốt nghiệp 11/2026; em có thể gửi xác nhận của trường khi có.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Khi người phỏng vấn vin vào việc bạn chưa nhận bằng đại học, bạn nói đúng mốc
      dự kiến tốt nghiệp tháng mười một năm hai nghìn không trăm hai mươi sáu. Sau đó
      bạn làm rõ quá trình đi làm phần mềm từ năm hai nghìn không trăm mười chín. Chương trình
      đại học là mảnh ghép học thuật bổ trợ cho kinh nghiệm thực tế chứ không phản
      ánh thâm niên của bạn.
    clear: true
  - show: '<p><b>Đòn ép giá số 3: Nếu bạn nhận mức 45 triệu, ngân hàng sẽ bù đắp bằng
      các kỳ thưởng cuối năm rất cao</b></p>

      <div class="box pit">Tâm lý nhân sự: Dịch chuyển rủi ro tài chính sang ứng viên
      vì tiền thưởng phụ thuộc vào kết quả kinh doanh chung.</div>

      <div class="box key">Lời đáp trả chuẩn mực: Dạ em rất trân trọng chế độ thưởng
      hấp dẫn của ACB. Tuy nhiên, mức lương cứng 50 triệu là thước đo cam kết trách
      nhiệm và sự công nhận năng lực thực tế, giúp em tập trung trọn vẹn vào các bài
      toán công nghệ lớn của ngân hàng.</div>'
    focus:
    - 0
    - 0
    say: Khi nhà tuyển dụng đề xuất hạ lương cứng để bù bằng tiền thưởng, bạn lịch
      thiệp khẳng định mức lương hàng tháng là thước đo cam kết năng lực. Mức thu
      nhập ổn định giúp bạn toàn tâm toàn ý cống hiến cho các dự án huyết mạch của
      ngân hàng.
    clear: true
  - show: '<p><b>Sau 3 vòng đối thoại: các kết quả có thể xảy ra</b>:</p>

      <div class="box key">Không có kịch bản nào bảo đảm kết quả (lương ACB ghi "Thương
      lượng"). Nếu được duyệt 50,000,000 VND Gross/tháng: gói năm = 50 × 14 đến 50
      × 17 = 700 đến 850 triệu đồng, tuỳ xếp loại thưởng. Nếu không: so với phương
      án thay thế tốt nhất (BATNA) rồi mới quyết định.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Sau ba vòng đối thoại, không có kịch bản nào bảo đảm kết quả cho bạn. Nếu
      được duyệt mức năm mươi triệu gross, gói năm vào khoảng bảy trăm đến tám trăm
      năm mươi triệu đồng. Còn nếu không, bạn so sánh với phương án thay thế tốt nhất
      của mình rồi mới quyết định.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Bản lĩnh Giữ vững Mức lương Kỳ vọng'
  checks:
  - 700 // 14 == 50
  - 850 // 17 == 50
  - 600 // 12 == 50
  steps:
  - show: "<p><b>Tình huống giả định khi nhận Offer</b>: Trưởng phòng tuyển dụng gọi điện:\
      \ ACB rất ấn tượng với chuyên môn của bạn nhưng theo khung chính sách thâm niên\
