- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Tổng Đãi ngộ Năm với Số Minh hoạ'
  checks:
  - 32 * 12 == 384
  - 384 + 32 == 416
  - 416 + 32 * 1 == 448
  - 416 + 32 * 4 == 544
  - 448 + 24 == 472
  - 544 + 24 == 568
  steps:
  - show: |
      <p class="quiz-q">Câu hỏi: Giả sử lương cứng L = 32 triệu một tháng, phụ cấp P = 2 triệu một tháng (số minh hoạ). Lương tháng 13 cố định, thưởng từ 1 đến 4 tháng lương tuỳ xếp loại. Tổng đãi ngộ một năm trước thuế nằm trong khoảng nào?</p>
      <div class="step">A: Đúng 384 triệu đồng</div>
      <div class="step">B: Từ 472 đến 568 triệu đồng</div>
      <div class="step">C: Cố định 544 triệu đồng</div>
    focus:
    - 0
    - 0
    pause: 25
    say: Mời bạn tính tổng đãi ngộ một năm khi lương cứng là 32 triệu và phụ cấp 2 triệu mỗi tháng, một bộ số minh hoạ. Tháng mười ba cố định, còn thưởng từ một đến bốn tháng lương.
  - show: |
