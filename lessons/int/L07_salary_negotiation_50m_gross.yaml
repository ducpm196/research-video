- id: example
  kind: example
  title: 'Thực hành: Bẻ gãy ba đòn ép giá bằng lời trung thực và phép tính'
  checks:
  - 36 * 14 == 504
  - 36 * 15 == 540
  - 36 * 16 == 576
  - 36 * 17 == 612
  - 36 * (13 + 5) == 648
  - round(600 / 36 - 13, 2) == 3.67
  - 40 * 14 == 560
  - 40 * 17 == 680
  - 40 * 14 - 36 * 14 == 56
  - 40 * 17 - 36 * 17 == 68
  steps:
  - show: |-
      <p><b>Đòn ép giá số 1: Thị trường năm nay các ngân hàng đều thắt chặt ngân sách tuyển dụng</b></p>
      <div class="box pit">Tâm lý nhân sự: Tạo áp lực khan hiếm cơ hội việc làm để ép ứng viên hạ thấp mức kỳ vọng lương.</div>
      <div class="box key">Lời đáp trả chuẩn mực: Dạ em rất hiểu ngân hàng đang tối ưu hóa chi phí vận hành. Chính vì vậy, việc tuyển một Kỹ sư Cấp cao có thể làm được việc sớm, giảm chi phí sai sót và chi phí đào tạo lại, là một cách dùng ngân sách hiệu quả cho ACB.</div>
    focus:
    - 0
    - 0
    say: Khi phòng nhân sự nói thị trường thắt chặt ngân sách, bạn đảo ngược tình thế bằng cách cho thấy tuyển kỹ sư làm được việc sớm là cách dùng ngân sách hiệu quả. Ngân hàng giảm được chi phí sửa chữa sai sót và thời gian đào tạo lại.
  - show: |-
      <p><b>Đòn ép giá số 2: Bạn chưa nhận bằng Cử nhân AI (UIT, dự kiến cuối năm 2026), liệu có quá sớm để nhận mức lương cấp cao?</b></p>
      <table class="t" style="margin-bottom: 8px;">
        <tr><th>yếu tố đánh giá</th><th>góc nhìn của nhân sự</th><th>thực tế của ứng viên</th></tr>
        <tr><td>Cử nhân AI UIT</td><td>Chưa nhận bằng</td><td>Học song song khi đi làm, dự kiến cuối năm 2026</td></tr>
        <tr><td>Kinh nghiệm công tác</td><td>Nghi ngờ thời gian làm việc</td><td>[năm bắt đầu đi làm]: kể lần lượt các nơi bạn đã làm (điền thật)</td></tr>
      </table>
      <div class="box key">Lời đáp (câu mẫu minh hoạ, hãy thay bằng kinh nghiệm thật của bạn): Dạ em đi làm phần mềm từ [năm bắt đầu]: [nơi làm thứ nhất] ([năm]–[năm]), [nơi làm thứ hai] ([năm]–[năm]) và [nơi làm hiện tại] ([tháng/năm] – nay). Bằng Cử nhân AI tại UIT là phần em học thêm song song, dự kiến tốt nghiệp cuối năm 2026; em có thể gửi xác nhận của trường khi có.</div>
    focus:
    - 0
    - 0
    - 0
    say: Khi người phỏng vấn vin vào việc bạn chưa nhận bằng đại học, bạn nói đúng mốc dự kiến tốt nghiệp vào cuối năm 2026. Sau đó bạn kể đúng quá trình đi làm phần mềm của mình, nơi nào và năm nào, như câu mẫu minh hoạ trên màn hình. Chương trình đại học là mảnh ghép học thuật bổ trợ cho kinh nghiệm thực tế chứ không phản ánh thâm niên của bạn.
    clear: true
  - show: |
      <p><b>Đòn ép giá số 3: &laquo;Lương cứng thấp hơn một chút, nhưng cuối năm thưởng rất cao&raquo;</b> (đẩy rủi ro thưởng sang bạn)</p>
      <table class="t">
        <tr><th>mức thưởng k</th><th>đề nghị L = 36</th><th>mong muốn L = 40</th><th>chênh mỗi năm</th></tr>
        <tr><td>1 tháng</td><td>36 × 14 = 504</td><td>40 × 14 = 560</td><td>56</td></tr>
        <tr><td>2 tháng</td><td>36 × 15 = 540</td><td>40 × 15 = 600</td><td>60</td></tr>
        <tr><td>3 tháng</td><td>36 × 16 = 576</td><td>40 × 16 = 640</td><td>64</td></tr>
        <tr><td>4 tháng</td><td>36 × 17 = 612</td><td>40 × 17 = 680</td><td>68</td></tr>
      </table>
      <div class="box key">Số minh hoạ, triệu đồng. Cùng mức thưởng k thì 36 thua vì lương cứng thấp kéo cả thưởng xuống. Nếu bên kia hứa k lớn hơn: 36 × (13 + k) = 600 (bằng 40 × 15) khi k ≈ 3,67; k = 5 cho 648. Hỏi k đó có được bảo đảm không. Lời đáp: &laquo;Dạ em xin so tổng đãi ngộ cả năm của hai phương án, và cần biết thưởng có được bảo đảm.&raquo;</div>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    clear: true
    say: Đòn ba là hạ lương cứng một chút và hứa thưởng cuối năm rất cao. Ta thử bằng số minh hoạ, đề nghị là 36 triệu và mong muốn là 40 triệu, thưởng từ một đến bốn tháng. Vì thưởng tính bằng số tháng lương, lương cứng thấp cũng kéo thưởng xuống, nên ở cùng mức thưởng, phương án 36 triệu thua từ 56 đến 68 triệu mỗi năm. Nếu bên kia hứa thưởng nhiều tháng hơn thì phải tính lại, và 36 triệu chỉ hoà vốn với 40 triệu thưởng hai tháng khi thưởng khoảng 3 phẩy 67 tháng. Lời đáp trung thực là xin so sánh tổng đãi ngộ cả năm và hỏi mức thưởng đó có được bảo đảm hay phụ thuộc xếp loại.
  - show: |
      <p><b>Sau ba vòng đối thoại: các kết quả có thể xảy ra</b>:</p>
      <div class="box key">Không kịch bản nào bảo đảm kết quả: tin tuyển dụng ghi lương &laquo;Thương lượng&raquo;. Nếu đề nghị thấp hơn mong muốn: so tổng đãi ngộ rồi so với phương án thay thế tốt nhất (BATNA, tức việc bạn sẽ làm nếu thương lượng đổ vỡ, ví dụ một lời mời khác hoặc ở lại chỗ cũ) trước khi quyết định.</div>
    focus:
    - 0
    - 0
    - 0
    clear: true
    say: Sau ba vòng đối thoại, không có kịch bản nào bảo đảm kết quả cho bạn, vì tin tuyển dụng ghi lương là thương lượng. Nếu đề nghị thấp hơn mong muốn, bạn so tổng đãi ngộ rồi so với phương án thay thế tốt nhất của mình. Đó là việc bạn sẽ làm nếu thương lượng đổ vỡ, ví dụ một lời mời khác hoặc ở lại chỗ cũ, rồi mới quyết định.
- id: quymo
  kind: example
  title: 'Theo thời gian: lương cứng khởi điểm thấp làm chênh lệch phình ra'
  checks:
  - 4 * (13 + 2) == 60
  - round(sum(60 * 1.08 ** i for i in range(3)), 1) == 194.8
  - round(sum(60 * 1.08 ** i for i in range(5)), 1) == 352.0
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b> (Python là ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td style="white-space:nowrap">chenh = 4 * (13 + 2)  # ...</td><td>đặt tên chenh cho số tiền chênh mỗi năm: 4 triệu lương × (13 + 2 tháng thưởng); từ dấu # tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td style="white-space:nowrap">tong, tang = 0, 1.0</td><td>gán cùng lúc: tong = 0 (tổng chênh tích lũy), tang = 1.0 (hệ số tăng lương, bắt đầu bằng 1)</td></tr>
        <tr><td style="white-space:nowrap">for nam in range(1, 6):</td><td>lặp cho nam lần lượt bằng 1, 2, 3, 4, 5 (range(1, 6) dừng trước số 6); các dòng thụt vào là phần được lặp</td></tr>
        <tr><td style="white-space:nowrap">tong += chenh * tang</td><td>cộng thêm vào tong số tiền chênh của năm này (tong = tong + chenh × tang)</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    - ['2.4', '2.5']
    clear: true
    say: Trước khi chạy, ta đọc mã Python từng dòng. Dòng đầu đặt số tiền chênh mỗi năm, và dấu thăng mở đầu ghi chú. Dòng hai gán cùng lúc tổng bằng không và hệ số tăng bằng một. Vòng lặp cho biến năm chạy từ một đến năm, mỗi vòng cộng phần chênh vào tổng.
  - show: |
      <p><b>Đọc tiếp</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td style="white-space:nowrap">if nam in (1, 3, 5):</td><td>chỉ khi nam là 1, 3 hoặc 5 thì chạy dòng thụt vào kế tiếp</td></tr>
        <tr><td>print(...)</td><td>in các phần trong ngoặc ra màn hình; round(x, 1) làm tròn một chữ số sau dấu phẩy</td></tr>
        <tr><td style="white-space:nowrap">tang *= 1.08</td><td>nhân tang với 1,08, tức mỗi năm tăng 8% (tang = tang × 1,08)</td></tr>
      </table>
    focus:
    - ['2.2', '2.3']
    - '2.4'
    clear: true
    say: Chỉ ba năm đánh dấu mới in kết quả. Dòng cuối nhân hệ số tăng với một phẩy không tám, tức mỗi năm tăng tám phần trăm.
  - show: '<p><b>Chạy thật bằng Python: chốt lương cứng thấp ở đầu, sau 1, 3 và 5 năm</b></p><div class="code"><div>chenh = 4 * (13 + 2)   # trieu/nam: luong cung thap hon 4 trieu, k = 2 (so minh hoa)</div><div>tong, tang = 0, 1.0</div><div>for nam in range(1, 6):</div><div>    tong += chenh * tang</div><div>    if nam in (1, 3, 5):</div><div>        print(nam, ''nam: mat'', round(tong, 1), ''trieu'')</div><div>    tang *= 1.08         # moi nam tang 8% tren luong hien tai (so minh hoa)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>1 nam: mat 60.0 trieu</div><div>3 nam: mat 194.8 trieu</div><div>5 nam: mat 352.0 trieu</div></div>'
    focus:
    - 2
    - 2
    - 4
    clear: true
    say: Đây là mã Python chạy thật, theo dõi phần thu nhập mất đi khi chốt lương cứng thấp hơn bốn triệu ngay từ đầu, với thưởng hai tháng. Giả định mỗi năm lương tăng tám phần trăm trên mức hiện tại, một số minh hoạ. Năm đầu mất 60 triệu, nhưng sau ba năm mất 194 phẩy 8 triệu, và sau năm năm mất 352 triệu.
  - show: |
      <table class="t">
        <tr><th>mốc thời gian</th><th>phần mất đi tích lũy</th><th>điều gì đổi</th></tr>
        <tr><td>1 năm (×1)</td><td>60 triệu</td><td>chênh lệch còn nhìn như nhỏ</td></tr>
        <tr><td>3 năm (×3)</td><td>194,8 triệu</td><td>mỗi kỳ tăng theo phần trăm đều cộng thêm vào chênh lệch</td></tr>
        <tr><td>5 năm (×5)</td><td>352 triệu</td><td>mức khởi điểm thấp kéo theo cả thưởng và mọi kỳ tăng sau</td></tr>
      </table>
      <p>Giả định: tăng lương theo phần trăm trên lương hiện tại và thưởng theo số tháng lương; thực tế phải hỏi cách tăng lương. Đánh đổi: đòi quá cao có thể mất lời mời, nên cần phương án thay thế.</p>
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Bảng này cho thấy thời gian làm khoản chênh lệch phình ra. Sau một năm, chênh lệch còn nhìn như nhỏ. Sau ba năm, mỗi kỳ tăng theo phần trăm đều cộng thêm vào chênh lệch. Sau năm năm, mức khởi điểm thấp đã kéo theo cả thưởng và mọi kỳ tăng sau đó. Giả định này cần kiểm với cách tăng lương thật, và đánh đổi là đòi quá cao có thể mất lời mời, nên bạn cần có phương án thay thế.
- id: check
  kind: check
  title: 'Tự kiểm tra: Giữ vững khi nhận đề nghị thấp hơn mong muốn'
  steps:
  - show: |
      <p><b>Tình huống giả định khi nhận đề nghị</b>: nhà tuyển dụng gọi điện: &laquo;Chúng tôi ấn tượng với chuyên môn của bạn, nhưng khung chính sách của vị trí này thấp hơn mức bạn mong.&raquo; Bạn xử lý thế nào?</p>
      <ul>
        <li><b>A</b>: Đồng ý ngay vì sợ bị huỷ lời mời.</li>
        <li><b>B</b>: Cảm ơn, hỏi rõ cấu trúc (lương cứng, tháng 13, thưởng và điều kiện, phụ cấp, kỳ tăng lương), tính tổng đãi ngộ của hai phương án rồi mới trả lời.</li>
        <li><b>C</b>: Bực tức và cúp máy.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    pause: 15
    say: Mời bạn thử sức với tình huống nhận đề nghị. Nhà tuyển dụng nói khung chính sách của vị trí thấp hơn mức bạn mong. Bạn có thể đồng ý ngay, cảm ơn rồi hỏi rõ cấu trúc và tính tổng đãi ngộ, hoặc cúp máy, và bạn sẽ chọn cách nào.
  - show: |
      <p><b>Đáp án chính xác: Lựa chọn B</b></p>
      <div class="box key">Khung thấp hơn mong muốn chưa nói gì về tổng đãi ngộ: một đề nghị lương cứng thấp nhưng có phụ cấp, thưởng bảo đảm hay kỳ tăng lương dày có thể ngang hoặc hơn. Hỏi cấu trúc rồi tính $T = L \times (13 + k) + 12 \times P$ cho cả hai phương án mới có căn cứ để trả lời, và không phải trả lời ngay trong cuộc gọi.</div>
    focus:
    - 0
    - 0
    - 0
    clear: true
    say: Đáp án chính xác là lựa chọn B. Khung thấp hơn mong muốn chưa nói gì về tổng đãi ngộ, vì phụ cấp, thưởng bảo đảm hay kỳ tăng lương có thể bù lại. Bạn hỏi cấu trúc, tính tổng đãi ngộ của cả hai phương án, và không cần trả lời ngay trong cuộc gọi.
