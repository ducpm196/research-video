- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Phân biệt Filter, Interceptor và AOP Aspect'
  checks:
  - 422 > 400
  - 120 - 60 == 60
  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm cấu trúc</b>: Khi cần đọc chứng thư client mTLS\
      \ (Tomcat đã bắt tay TLS) để xác định danh tính và giải nén dữ liệu trước khi\
      \ request đi vào Spring MVC, ta nên dùng thành phần nào?</p>\n<ul>\n  <li><b>A</b>: Bộ\
      \ lọc Servlet Filter.</li>\n  <li><b>B</b>: Bộ chặn Spring Interceptor.</li>\n\
      \  <li><b>C</b>: Khía cạnh AOP Aspect.</li>\n  <li><b>D</b>: Khối điều khiển\
      \ Controller Advice.</li>\n</ul>"
    focus:
    - 0
    - 0
    say: Xin mời bạn chọn thành phần kiến trúc phù hợp để đọc chứng thư bảo mật
      của khách trước khi yêu cầu đi vào khung làm việc. Bạn có 15 giây suy nghĩ
      trước khi nghe phân tích chi tiết.
    pause: 15
  - show: "<div class=\"box key\"><b>Đáp án chính xác là A</b>!</div>\n<p><b>Bước\
      \ 1 — Phân định ranh giới xử lý của các thành phần</b>:</p>\n<table class=\"\
      t\">\n  <tr><th>thành phần</th><th>vị trí trong luồng xử lý</th><th>ứng dụng\
      \ thực tế ngân hàng</th></tr>\n  <tr><td>Servlet Filter</td><td>Chuỗi filter\
      \ của Web Container, trước DispatcherServlet (vẫn có thể là Spring bean)</td><td>Ánh\
      \ xạ chứng thư mTLS thành danh tính, giải nén, CORS</td></tr>\n  <tr><td>Spring\
      \ Interceptor</td><td>Bên trong DispatcherServlet, trước Controller</td><td>Kiểm tra mã định danh phiên và chữ ký nghiệp vụ</td></tr>\n\
      \  <tr><td>AOP Aspect</td><td>Bọc quanh từng phương thức nghiệp vụ</td><td>Ghi\
      \ vết kiểm toán, đo đạc thời gian thực thi</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Bộ lọc chạy trong máy chủ web, trước bộ
      điều phối của Spring, nên phù hợp để xử lý yêu cầu thô. Việc bắt tay bảo mật
      do máy chủ web đảm nhận, còn bộ lọc đọc chứng thư của khách để xác định danh
      tính trước khi chuyển tiếp vào bên trong.
    clear: true
  - show: '<p><b>Bước 2 — Kết luận triển khai cho Kỹ sư Cấp cao</b>:</p>

      <div class="box key">Hiểu rõ ranh giới giữa Filter, Interceptor và Aspect giúp
      kỹ sư đặt đúng chức năng vào đúng vị trí kiến trúc, tránh gây lãng phí bộ nhớ
      và bảo đảm tính bảo mật đa tầng cho ngân hàng!</div>'
    focus:
    - 0
    - 0
    say: Bước hai, việc phân định rạch ròi các tầng xử lý giúp ứng dụng vận hành trơn
      tru và bảo đảm an toàn đa tầng. Đây là kiến thức thường được hỏi khi phỏng
      vấn vị trí Kỹ sư Cấp cao.
    clear: true
