- id: practice
  kind: practice
  title: 'Tự làm: trả lời một câu phỏng vấn có số về bể kết nối và nhật ký giao dịch độc lập'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi: &laquo;Cơ sở dữ liệu có <b>16 nhân</b> và <b>2 ổ đĩa</b>. Mỗi giao dịch giữ kết nối chính <b>20 mili giây</b>; nếu thêm ghi nhật ký bằng <b>REQUIRES_NEW</b>, nhật ký giữ thêm một kết nối khác <b>5 mili giây</b>. Bạn đặt bể bao nhiêu kết nối và trần thông lượng là bao nhiêu?&raquo;</p>
      <p>Viết ba dòng: số kết nối theo công thức (nhân × 2 + số đĩa); thông lượng tối đa khi không có nhật ký; thông lượng tối đa khi có nhật ký độc lập.</p>
      <p class="note">Định dạng ba dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Cơ sở dữ liệu mười sáu nhân và hai ổ đĩa, hãy tính số kết nối theo công thức nhân hai cộng số đĩa. Rồi tính trần thông lượng khi mỗi giao dịch giữ kết nối hai mươi mili giây, và khi nhật ký độc lập giữ thêm năm mili giây. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>be ket noi: 34</div><div>toi da khong nhat ky: 1700 giao dich/giay</div><div>toi da co nhat ky REQUIRES_NEW: 1360 giao dich/giay</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L02/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> số kết nối = 16 × 2 + 2. Thông lượng tối đa = số kết nối chia cho tổng thời gian giữ kết nối của một giao dịch (đổi mili giây ra giây). Khi có nhật ký, tổng thời gian giữ là 20 + 5 mili giây.
      Lời giải đầy đủ ở <code>labs/INT/L02/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, số kết nối bằng mười sáu nhân hai cộng hai. Thông lượng tối đa bằng số kết nối chia cho tổng thời gian một giao dịch giữ kết nối, đổi từ mili giây ra giây. Khi có nhật ký, tổng thời gian giữ là hai mươi cộng năm mili giây.
  lab: labs/INT/L02
