scenes:
- id: hook
  kind: hook
  title: Hiểm họa mất dữ liệu do lỗi tự gọi hàm nội bộ trong Spring Boot
  steps:
  - show: |-
      <p>Một giao dịch chuyển khoản đã trừ tiền khách hàng nhưng các bước ghi kèm theo không được hoàn tác khi hệ thống gặp sự cố mạng.</p>
      <div class="box key">Nguyên nhân bắt nguồn từ việc lập trình viên gọi hàm nội bộ trong cùng một lớp dịch vụ khiến cơ chế bọc Proxy của Spring bị bỏ qua hoàn toàn. Làm sao để thiết kế chuẩn kiến trúc doanh nghiệp?</div>
      <p>Spring (Spring Boot) = bộ khung phổ biến để viết dịch vụ Java. Proxy (lớp vỏ ủy quyền) = đối tượng Spring bọc quanh đối tượng của bạn, tự mở và đóng giao dịch cơ sở dữ liệu trước và sau mỗi lời gọi.</p>
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, một lỗi kinh điển trong ứng dụng ngân hàng là giao dịch bị trừ tiền nhưng các bước ghi kèm theo không được hoàn tác khi có sự cố. Nguyên nhân là lớp vỏ ủy quyền của Spring bị bỏ qua khi tự gọi hàm nội bộ. Spring là bộ khung phổ biến để viết dịch vụ Java, còn lớp vỏ ủy quyền là đối tượng bọc quanh đối tượng của bạn để tự mở và đóng giao dịch.
    introduces:
    - int_lop_vo
  - show: |-
      <table class="t">
        <tr><th>điểm nghẽn kiến trúc</th><th>nguy cơ tài chính</th><th>giải pháp chuẩn Senior ACB</th></tr>
        <tr><td>Lỗi tự gọi hàm nội bộ</td><td>Mất giao dịch khi có lỗi ngoại lệ</td><td>Tách dịch vụ độc lập (một đối tượng khác) để lời gọi đi qua lớp vỏ Proxy</td></tr>
        <tr><td>Cấu hình bể kết nối quá lớn</td><td>Gây nghẽn nhân xử lý của máy chủ dữ liệu</td><td>Áp dụng công thức HikariCP tối ưu theo số nhân CPU</td></tr>
        <tr><td>Gọi lặp lại lệnh thanh toán</td><td>Khách hàng bị trừ tiền hai lần</td><td>Khoá Redis chặn sớm + ràng buộc UNIQUE ở DB (tính lũy đẳng)</td></tr>
      </table>
      <p><i>RFC</i> = văn bản chuẩn Internet do tổ chức IETF ban hành. <i>DB</i> = cơ sở dữ liệu. <i>UNIQUE</i> = luật của bảng: một cột không được có hai hàng cùng giá trị.</p>
    focus:
    - 0
    - 0
    - 0
    say: Ta tìm hiểu cách khắc phục lỗi tự gọi hàm trong quản lý giao dịch. Ta nắm vững quy chuẩn thiết kế cổng giao tiếp chuẩn quốc tế. Ta cũng làm chủ kỹ thuật khử trùng lặp lệnh bằng bộ nhớ đệm phân tán.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Từ vựng, Spring Bean và Mức lan truyền'
  checks:
  - 30 * 2 == 60
  - 120 // 60 == 2
  steps:
  - show: |-
      <p><b>Từ vựng cần nắm trước</b> (giải nghĩa bằng lời thường):</p>
      <table class="t">
        <tr><th>thuật ngữ</th><th>nghĩa</th></tr>
        <tr><td>Microservices (dịch vụ nhỏ)</td><td>Chia hệ thống thành nhiều chương trình nhỏ, mỗi chương trình lo một việc, gọi nhau qua mạng</td></tr>
        <tr><td>Giao dịch (transaction), rollback</td><td>Nhóm thao tác cơ sở dữ liệu hoặc cùng thành công, hoặc cùng bị huỷ (rollback = huỷ, trả về như cũ)</td></tr>
        <tr><td>REST API, mã trạng thái HTTP</td><td>Cách các dịch vụ gọi nhau qua HTTP, quy ước gửi yêu cầu qua mạng; mã trả về: 200 xong, 202 đã nhận chưa xong, 409 xung đột, 422 không xử lý được</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    clear: true
    say: Trước hết, ta cần hiểu một số từ sẽ dùng cả bài. Dịch vụ nhỏ là cách chia hệ thống thành nhiều chương trình nhỏ gọi nhau qua mạng. Giao dịch là nhóm thao tác cơ sở dữ liệu hoặc cùng thành công, hoặc cùng bị huỷ.
  - show: |-
      <p><b>Từ vựng cần nắm trước (tiếp)</b>:</p>
      <table class="t">
        <tr><th>thuật ngữ</th><th>nghĩa</th></tr>
        <tr><td>Redis</td><td>Kho dữ liệu nằm trong RAM, đọc ghi rất nhanh, hay dùng làm bộ nhớ đệm và khoá</td></tr>
        <tr><td>Bể kết nối (HikariCP)</td><td>Nhóm kết nối tới cơ sở dữ liệu được mở sẵn và dùng lại</td></tr>
        <tr><td>Lũy đẳng (idempotency)</td><td>Gửi một lần hay nhiều lần cùng một yêu cầu thì kết quả vẫn như gửi một lần</td></tr>
      </table>
    focus:
    - '2.2'
    - ['2.3', '2.4']
    clear: true
    say: Redis là kho dữ liệu nằm trong bộ nhớ, đọc ghi rất nhanh. Bể kết nối là nhóm kết nối mở sẵn để dùng lại, còn lũy đẳng nghĩa là gửi nhiều lần vẫn như gửi một lần.
  - show: |-
      <p><b>Vòng đời Spring Bean</b> (bean = đối tượng do Spring tạo và quản lý):</p>
      <table class="t">
        <tr><th>giai đoạn</th><th>thao tác của Spring Container (bộ chứa tạo và quản lý bean)</th><th>ý nghĩa thực chiến</th></tr>
        <tr><td>1. Khởi tạo</td><td>Gọi hàm tạo (constructor), tiêm phụ thuộc (Spring tự đưa đối tượng bean cần vào)</td><td>Nạp các thuộc tính cấu hình</td></tr>
        <tr><td>2. Tiền khởi tạo</td><td>Chạy hàm có nhãn PostConstruct ("chạy ngay sau khi tạo xong")</td><td>Chuẩn bị dữ liệu ban đầu</td></tr>
        <tr><td>3. Bọc ủy quyền</td><td>Tạo đối tượng Proxy qua CGLIB hoặc JDK (hai cách sinh lớp vỏ)</td><td>Gắn quản lý giao dịch và bảo mật</td></tr>
        <tr><td>4. Phục vụ</td><td>Tiếp nhận yêu cầu từ Controller (lớp nhận yêu cầu web, giao việc cho dịch vụ)</td><td>Singleton = chỉ một bản, mọi luồng dùng chung; không để biến thay đổi được trong bean</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Tiếp theo là vòng đời của bean, tức đối tượng do Spring tạo và quản lý. Tiêm phụ thuộc nghĩa là Spring tự đưa các đối tượng mà bean cần vào cho nó. Sau đó Spring tạo một lớp vỏ ủy quyền bọc quanh đối tượng thật, nhờ vậy quản lý giao dịch mới hoạt động. Bean chỉ có một bản dùng chung cho mọi luồng nên không giữ biến thay đổi được.
    clear: true
    introduces:
    - int_bean
  - show: |-
      <div class="box key">Mức lan truyền (propagation) = quy tắc khi một hàm có giao dịch gọi sang một hàm có giao dịch khác. Mặc định <code>REQUIRED</code>: nhập chung giao dịch đang chạy, huỷ là huỷ cả. <code>REQUIRES_NEW</code>: tạm dừng giao dịch đang chạy, mở một giao dịch riêng và chốt riêng. Cách làm thường gặp: ghi nhật ký kiểm toán bằng <code>REQUIRES_NEW</code> để nhật ký thất bại vẫn được lưu dù lệnh chuyển tiền chính bị huỷ.</div>
      <p>Điều kiện: hàm ghi nhật ký phải được gọi qua proxy (nằm ở bean khác), và cần thêm một kết nối từ bể trong lúc giao dịch chính vẫn giữ kết nối của nó.</p>
    focus:
    - 0
    - 0
    - 0
    say: Mức lan truyền là quy tắc khi một hàm có giao dịch gọi sang hàm có giao dịch khác, mặc định hàm sau nhập chung giao dịch đang chạy nên huỷ là huỷ cả. Cách làm thường gặp trong ngân hàng là ghi nhật ký kiểm toán bằng mức lan truyền độc lập, mở giao dịch riêng, để nhật ký lỗi vẫn được lưu dù giao dịch chính bị huỷ. Mức này chỉ có tác dụng khi hàm ghi nhật ký được gọi qua lớp vỏ ủy quyền, và nó cần thêm một kết nối từ bể.
    clear: true
  - show: |-
      <p><b>Vết chạy của REQUIRES_NEW</b> (số minh hoạ): bể có 2 kết nối; giao dịch chính chuyển tiền gọi hàm ghi nhật ký, rồi gặp lỗi khi trừ tiền.</p>
      <table class="t">
        <tr><th>bước</th><th>giao dịch chính</th><th>giao dịch nhật ký</th><th>kết nối đang giữ</th></tr>
        <tr><td>1</td><td>mở, giữ kết nối số 1</td><td>chưa có</td><td>1 trên 2</td></tr>
        <tr><td>2</td><td>tạm dừng, vẫn giữ kết nối số 1</td><td>mở riêng, giữ kết nối số 2</td><td>2 trên 2</td></tr>
        <tr><td>3</td><td>vẫn tạm dừng</td><td>ghi 1 dòng nhật ký, chốt, trả kết nối số 2</td><td>1 trên 2</td></tr>
        <tr><td>4</td><td>trừ tiền gặp lỗi, bị huỷ</td><td>đã chốt, không bị huỷ theo</td><td>0 trên 2</td></tr>
      </table>
      <p>Kết quả: số dư về như cũ nhưng bảng nhật ký còn 1 dòng. Với REQUIRED, dòng nhật ký bị huỷ cùng giao dịch chính nên bảng nhật ký còn 0 dòng. Cái giá: nếu 2 giao dịch chính chạy cùng lúc, mỗi cái giữ 1 kết nối và đều chờ kết nối thứ hai, bể 2 kết nối cạn và cả hai treo.</p>
    focus:
    - ['2.2', '2.3']
    - ['2.4', '2.5']
    - 3
    clear: true
    say: Xem vết chạy với bể hai kết nối, trong đó giao dịch chính giữ kết nối số một rồi tạm dừng, để giao dịch nhật ký mở riêng, giữ kết nối số hai, chốt xong thì trả lại. Khi trừ tiền lỗi, chỉ giao dịch chính bị huỷ nên bảng nhật ký còn một dòng, còn nếu nhập chung thì không còn dòng nào. Cái giá là nếu hai giao dịch chính cùng chờ kết nối thứ hai, bể cạn và treo.
- id: concept
  kind: concept
  title: Bản chất Lỗi Tự gọi hàm Nội bộ và Quy tắc Hủy bỏ Giao dịch
  steps:
  - show: |-
      <p><b>Vì sao việc tự gọi hàm nội bộ làm mất tính năng Quản lý Giao dịch?</b></p>
      <svg viewBox="0 0 700 220" style="width:100%;max-height:420px;">
        <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#003366"/></marker></defs>
        <rect x="20" y="20" width="160" height="50" rx="6" fill="#e8f4fd" stroke="#003366" stroke-width="2"/>
        <text x="35" y="51" font-size="13" font-weight="bold" fill="#003366">Client Request</text>
        <path d="M 180 45 L 238 45" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
        <rect x="240" y="10" width="210" height="50" rx="8" fill="#fff" stroke="#28a745" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="250" y="41" font-size="12" font-weight="bold" fill="#28a745">Lớp vỏ Spring Proxy (mở GD)</text>
        <path d="M 345 60 L 345 82" stroke="#003366" stroke-width="2" marker-end="url(#arrow)"/>
        <rect x="240" y="84" width="210" height="130" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2"/>
        <text x="250" y="102" font-size="11" font-weight="bold" fill="#333">Đối tượng thật (không có vỏ)</text>
        <rect x="260" y="110" width="170" height="30" rx="4" fill="#d4edda" stroke="#28a745"/>
        <text x="270" y="130" font-size="11" font-weight="bold" fill="#155724">Hàm công khai ngoài</text>
        <path d="M 345 140 L 345 162" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="355" y="156" font-size="11" fill="#dc3545">gọi qua this</text>
        <rect x="260" y="164" width="170" height="40" rx="4" fill="#f8d7da" stroke="#dc3545"/>
        <text x="270" y="189" font-size="11" font-weight="bold" fill="#721c24">Hàm Transactional</text>
        <rect x="480" y="60" width="190" height="120" rx="6" fill="#f8f9fa" stroke="#6c757d"/>
        <text x="490" y="85" font-size="12" font-weight="bold" fill="#333">Hậu quả thực tế</text>
        <text x="490" y="115" font-size="11" fill="#dc3545">Mất Transaction!</text>
        <text x="490" y="140" font-size="11" fill="#555">Dữ liệu ghi không an toàn</text>
        <text x="490" y="165" font-size="11" fill="#555">Không thể tự hoàn tác</text>
      </svg>
      <p><i>Transactional</i> = nhãn gắn trước một hàm để dặn Spring mở và chốt giao dịch quanh hàm đó. <i>this</i> = chính đối tượng đang chạy: gọi qua this là gọi thẳng, không qua lớp vỏ.</p>
    focus:
    - 0
    - 0
    - 0
    - 3
    say: Khi yêu cầu từ bên ngoài đi vào, nó sẽ đi qua lớp vỏ ủy quyền của Spring. Tuy nhiên, nếu hàm bên ngoài gọi hàm bên trong ngay trên chính đối tượng thật, lời gọi sẽ bỏ qua lớp vỏ bảo vệ. Do đó tính năng quản lý giao dịch bị vô hiệu hóa hoàn toàn. Nhãn giao dịch dặn Spring mở giao dịch quanh hàm, còn gọi qua chính đối tượng là gọi thẳng, không qua lớp vỏ.
  - show: |-
      <div class="box key">Quy tắc huỷ bỏ giao dịch mặc định: Spring chỉ tự động huỷ bỏ khi gặp lỗi thời gian chạy (<code>RuntimeException</code>, và <code>Error</code>). Nếu gặp lỗi kiểm tra (checked exception), Spring vẫn chốt giao dịch. Vì vậy nhiều đội quy ước khai báo tường minh: <code>rollbackFor = Exception.class</code> (dặn Spring huỷ giao dịch khi gặp bất kỳ loại lỗi nào, vì Exception là tên chung của mọi lỗi).</div>
      <p>Lỗi kiểm tra = loại lỗi Java bắt buộc khai báo hoặc bắt, ví dụ <code>IOException</code>. Lỗi thời gian chạy = loại không bắt buộc khai báo, ví dụ <code>NullPointerException</code>.</p>
    focus:
    - 0
    - 0
    say: Quy tắc quan trọng là Spring mặc định chỉ huỷ giao dịch khi gặp lỗi thời gian chạy, loại lỗi Java không bắt buộc khai báo. Với lỗi kiểm tra, loại lỗi Java bắt buộc khai báo, giao dịch vẫn bị chốt, nên nhiều đội khai báo huỷ cho mọi loại lỗi.
    clear: true
- id: chaythat
  kind: example
  title: 'Chạy thật (mô phỏng): vì sao hàm tự gọi nội bộ bỏ qua lớp vỏ'
  steps:
  - show: |-
      <p><b>Đọc trước mã Java sắp chạy</b> (mỗi câu lệnh Java kết thúc bằng dấu chấm phẩy):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>import java.lang.reflect.*;</td><td>lấy sẵn bộ công cụ của Java có chứa Proxy (dấu * nghĩa là lấy cả gói)</td></tr>
        <tr><td>public class TuGoi { ... }</td><td>khung bắt buộc: lớp tên TuGoi chứa mọi mã; tên tệp trùng tên lớp</td></tr>
        <tr><td>public static void main(String[] args)</td><td>chỗ chương trình bắt đầu chạy; static = gọi không cần tạo đối tượng; void = không trả giá trị; String[] args = đối số gõ kèm lệnh (không dùng)</td></tr>
        <tr><td>static int moGD = 0; ... moGD++;</td><td>biến số nguyên đếm số giao dịch đã mở, bắt đầu từ 0; ++ nghĩa là tăng thêm 1</td></tr>
      </table>
    focus:
    - 0
    - ['2.4', '2.5']
    clear: true
    say: Trước khi xem mã, ta đọc các cú pháp lạ. Hàm chính là nơi chương trình bắt đầu, còn biến đếm tăng thêm một mỗi lần mở giao dịch.
  - show: |-
      <p><b>Đọc trước phần chính của mã</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>Dv that = new DvThat();</td><td>tạo đối tượng thật, cất trong biến that</td></tr>
        <tr><td>InvocationHandler vv = (p, m, a) -&gt; { ... };</td><td>vv là bộ xử lý lời gọi: đoạn mã chạy mỗi khi ai gọi một hàm qua lớp vỏ; p = lớp vỏ, m = hàm đang gọi, a = các đối số</td></tr>
        <tr><td>Class&lt;?&gt;[] gt = { Dv.class };</td><td>gt là danh sách (mảng) các hợp đồng mà lớp vỏ phải đóng giả; Dv.class là tên hợp đồng Dv; { ... } liệt kê phần tử; Class&lt;?&gt; = kiểu của một "lớp", dấu &lt;?&gt; nghĩa là kiểu bất kỳ</td></tr>
      </table>
    focus:
    - '2.3'
    - '2.4'
    clear: true
    say: Bộ xử lý lời gọi là đoạn mã chạy mỗi khi ai gọi hàm qua lớp vỏ. Dòng khai báo mảng liệt kê các hợp đồng mà lớp vỏ phải đóng giả.
  - show: |-
      <p><b>Đọc tiếp</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>Proxy.newProxyInstance(Dv.class.getClassLoader(), gt, vv)</td><td>nhờ Java tạo lớp vỏ: nó làm đúng các hợp đồng trong gt và mọi lời gọi chạy vào vv; đối số đầu chỉ là chỗ Java nạp lớp, cứ viết như mẫu</td></tr>
        <tr><td>(Dv) đứng trước Proxy...</td><td>ép kiểu: báo Java coi đối tượng vừa tạo như một Dv</td></tr>
        <tr><td>System.out.println("...");</td><td>in một dòng chữ ra màn hình</td></tr>
      </table>
    focus:
    - ['2.2', '2.3']
    clear: true
    say: Lệnh tạo lớp vỏ nhờ Java sinh ra đối tượng làm đúng các hợp đồng đó, và dấu ngoặc đứng trước là ép kiểu.
  - show: '<p><b>Chạy thật (mô phỏng): lớp thật và hàm tự gọi nội bộ</b></p><div class="code"><div>import java.lang.reflect.*;</div><div>public class TuGoi {</div><div>    interface Dv { void chuyen(); void ghiVet(); }</div><div>    static int moGD = 0;</div><div>    static class DvThat implements Dv {</div><div>        public void chuyen() { ghiVet(); }</div><div>        public void ghiVet() { System.out.println("  ghiVet chay"); }</div><div>    }</div></div><p class="note"><b>MÔ PHỎNG</b> bằng thư viện Java chuẩn, không phải Spring thật: Spring dùng cùng cơ chế bọc này để mở giao dịch.</p><p class="note"><i>interface</i> = bản hợp đồng liệt kê các hàm mà lớp phải có; <i>implements</i> = lớp cam kết làm đúng hợp đồng đó; <i>static class</i> = lớp viết lồng bên trong lớp ngoài.</p>'
    focus:
    - 0
    - '2.3'
    - 2
    clear: true
    say: Ta mô phỏng lớp vỏ ủy quyền bằng thư viện Java chuẩn, không phải Spring thật, nhưng Spring dùng cùng cơ chế bọc này. Dòng khai báo giao diện là bản hợp đồng liệt kê các hàm mà một lớp phải có, và lớp thật cam kết làm đúng hợp đồng đó. Đây là lớp thật, trong đó hàm chuyển gọi thẳng sang hàm ghi vết trong cùng lớp, và hàm ghi vết chỉ in một dòng.
  - show: |
      <p><b>Phần chính: bọc lớp thật bằng một lớp vỏ</b></p><div class="code"><div>    public static void main(String[] args) {</div><div>        Dv that = new DvThat();</div><div>        InvocationHandler vv = (p, m, a) -&gt; {</div><div>            moGD++; System.out.println("vo mo giao dich cho " + m.getName());</div><div>            return m.invoke(that, a);</div><div>        };</div><div>        Class&lt;?&gt;[] gt = { Dv.class };</div><div>        Dv vo = (Dv) Proxy.newProxyInstance(Dv.class.getClassLoader(), gt, vv);</div></div><p class="note"><b>MÔ PHỎNG</b> bằng thư viện Java chuẩn, không phải Spring thật: Spring dùng cùng cơ chế bọc này để mở giao dịch.</p><p class="note"><i>(p, m, a) -&gt; {…}</i> = hàm viết gọn không tên (lambda): nhận ba giá trị p, m, a rồi chạy khối lệnh trong ngoặc nhọn. <i>m.invoke(that, a)</i> = gọi hàm tên m trên đối tượng thật.</p>
    focus:
    - 2
    - 2
    clear: true
    say: Hàm chính tạo đối tượng thật, rồi bọc nó bằng một lớp vỏ. Mỗi lần ai gọi hàm nào qua lớp vỏ, đoạn bọc đếm một giao dịch mới và in tên hàm trước khi chuyển lời gọi vào đối tượng thật.
  - show: '<p><b>Gọi hai hàm qua lớp vỏ</b></p><div class="code"><div>        vo.chuyen();</div><div>        System.out.println("so giao dich: " + moGD);</div><div>        vo.ghiVet();</div><div>        System.out.println("so giao dich: " + moGD);</div><div>    }</div><div>}</div></div><p class="note">Ghép ba khung mã theo thứ tự thành một tệp TuGoi.java để gõ lại và chạy.</p>'
    focus:
    - 2
    - 2
    clear: true
    say: Ta gọi hàm chuyển qua lớp vỏ, in số giao dịch, rồi gọi hàm ghi vết trực tiếp qua lớp vỏ và in số giao dịch lần nữa. Trước khi chạy, hãy đoán số giao dịch sau lần gọi đầu là một hay hai.
    pause: 15
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>vo mo giao dich cho chuyen</div><div>  ghiVet chay</div><div>so giao dich: 1</div><div>vo mo giao dich cho ghiVet</div><div>  ghiVet chay</div><div>so giao dich: 2</div></div>'
    focus:
    - 0
    - 0
    - 0
    clear: true
    say: Lớp vỏ mở một giao dịch cho hàm chuyển, nhưng bên trong, hàm chuyển tự gọi hàm ghi vết nên không có dòng vỏ mở giao dịch cho ghi vết, và số giao dịch vẫn là một. Chỉ khi ta gọi hàm ghi vết trực tiếp qua lớp vỏ thì số mới thành hai. Đó là lý do hàm gọi nội bộ mất giao dịch riêng, và cách sửa là đặt hàm kia sang một đối tượng khác để lời gọi đi qua lớp vỏ.
- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Bể Kết nối HikariCP
  checks:
  - 8 * 2 + 1 == 17
  - 120 > 60
  steps:
  - show: |-
      <p><b>Công thức vàng tính kích thước Bể kết nối HikariCP</b>:</p>
      <div class="box key">
      $$\text{Điểm khởi đầu: } C = (\text{Số nhân CPU máy chủ DB} \times 2) + \text{Số lượng đĩa}$$
      $$\text{Máy chủ DB 8 nhân, 1 ổ đĩa: } C = (8 \times 2) + 1 = 17\text{ kết nối}$$
      </div>
      <p>Công thức kinh nghiệm từ wiki PostgreSQL, được HikariCP dẫn lại làm điểm khởi đầu (không phải định lý): tính cho tổng kết nối của mọi bản chạy (instance) của ứng dụng, rồi đo tải để tinh chỉnh.</p>
    focus:
    - 0
    - 0
    say: Theo một công thức kinh nghiệm phổ biến, điểm khởi đầu cho số kết nối bằng số nhân của máy chủ cơ sở dữ liệu nhân hai, cộng thêm số đĩa. Với máy chủ cơ sở dữ liệu tám nhân và một ổ đĩa, ta bắt đầu với khoảng mười bảy kết nối rồi đo tải để tinh chỉnh.
    clear: true
  - show: |-
      <p><b>Khoá phân tán Redis</b>:</p>
      <p>Khoá Redis chặn sớm yêu cầu trùng (tuyến cuối: UNIQUE ở DB). Cách đọc dòng lệnh:</p>
      <table class="t">
        <tr><th>viết trong lệnh</th><th>đọc là</th></tr>
        <tr><td>SET</td><td>đặt một khoá vào kho Redis, kèm một giá trị</td></tr>
        <tr><td>trans:{requestId}</td><td>tên khoá; ngoặc nhọn là chỗ điền mã yêu cầu thật</td></tr>
        <tr><td>"PROCESSING"</td><td>giá trị cất kèm: đang xử lý</td></tr>
        <tr><td>NX</td><td>chỉ đặt khi khoá chưa có</td></tr>
        <tr><td>EX 120</td><td>hết hạn sau 120 giây (chọn lớn hơn thời gian xử lý tối đa; số minh hoạ)</td></tr>
      </table>
      <pre><code>SET trans:{requestId} "PROCESSING" NX EX 120</code></pre>
    focus:
    - 0
    - 0
    say: Để chặn sớm các yêu cầu trùng lặp, ta dùng lệnh khoá nguyên tử trong bộ nhớ đệm, chỉ đặt khi khoá chưa có. Khoá tự hết hạn sau một trăm hai mươi giây, lớn hơn thời gian xử lý tối đa, đó là số minh hoạ.
    clear: true
  - show: |-
      <p><b>Đặc tả lỗi chuẩn RFC 9457</b>:</p>
      <p>Lỗi theo RFC 9457 (IETF là tổ chức đặt chuẩn Internet; chuẩn ra năm 2023, thay RFC 7807; example.com là địa chỉ ví dụ; JSON = cách viết dữ liệu thành các cặp tên và giá trị trong ngoặc nhọn):</p>
      <pre><code>{
        "type": "https://example.com/errors/insufficient-funds",
        "title": "Insufficient Account Balance",
        "status": 422,
        "detail": "So du tai khoan khong du de thuc hien giao dich"
      }</code></pre>
    focus:
    - 0
    - 0
    say: Đồng thời, cấu trúc lỗi trả về theo RFC 9457, là chuẩn quốc tế ban hành năm 2023 quy định khung báo lỗi gồm loại lỗi, tiêu đề, mã trạng thái và mô tả. Ở đây mã 422 nghĩa là yêu cầu đúng cú pháp nhưng không xử lý được, vì số dư không đủ.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Xử lý 5,000 Yêu cầu Chuyển tiền với Khoá Phân tán'
  checks:
  - 5000 // 100 == 50
  - 120 > 60
  - 422 > 400
  steps:
  - show: |-
      <p><b>Dữ liệu bài toán giả định (minh họa) cho cổng chuyển tiền nhanh</b>:</p>
      <ul>
        <li>Lưu lượng cao điểm: $5\,000$ yêu cầu chuyển khoản mỗi giây.</li>
        <li>Hiện tượng mạng: Người dùng bấm nút chuyển tiền liên tiếp 2 lần do mạng chập chờn.</li>
        <li>Mục tiêu: Đảm bảo tài khoản nguồn chỉ bị trừ tiền đúng 1 lần duy nhất.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định, cổng thanh toán tiếp nhận năm nghìn yêu cầu mỗi giây. Do mạng di động chập chờn, khách hàng bấm nút xác nhận hai lần liên tiếp. Nhiệm vụ của hệ thống là bảo đảm tiền chỉ bị trừ đúng một lần duy nhất.
  - show: |-
      <p><b>Đọc trước mã Java của bước 1</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>redis.setIfAbsent("trans:" + reqId, "PROCESSING", 120, TimeUnit.SECONDS)</td><td>đặt khoá chỉ khi chưa có, hết hạn sau 120 giây; dấu + nối chữ "trans:" với mã yêu cầu thành tên khoá; trả về đúng hoặc sai, cất vào biến locked</td></tr>
        <tr><td>if (!Boolean.TRUE.equals(locked))</td><td>nếu KHÔNG đặt được khoá (dấu ! nghĩa là "không")</td></tr>
        <tr><td>return ResponseEntity.status(409).body(...)</td><td>return = dừng và trả lời bên gọi: mã 409 kèm một câu chữ</td></tr>
        <tr><td>// ...</td><td>từ // tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - ['2.3', '2.4']
    - '2.5'
    clear: true
    say: Trước khi xem mã bước một, ta đọc các cú pháp lạ. Lệnh đầu đặt khoá nếu chưa có, trả về đúng hoặc sai. Dấu chấm than nghĩa là không, nên nếu không đặt được khoá thì dừng và trả mã bốn trăm linh chín. Hai gạch chéo mở đầu ghi chú cho người đọc.
  - show: |-
      <p><b>Bước 1: Kiểm tra khoá độc quyền trên bộ nhớ đệm phân tán Redis</b>:</p>
      <pre><code>// Lệnh kiểm tra và xác lập khoá duy nhất
      Boolean locked = redis.setIfAbsent(
          "trans:" + reqId, "PROCESSING", 120, TimeUnit.SECONDS);
      if (!Boolean.TRUE.equals(locked)) {
          return ResponseEntity.status(409)
              .body("Giao dich dang duoc xu ly");
      }</code></pre>
      <div class="box key">Nếu khoá đã tồn tại, cổng từ chối ngay lập tức và trả về mã xung đột 409!</div>
    focus:
    - 0
    - 0
