        <tr><td># ...</td><td>từ dấu # tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>for tps in (500, 5000, 50000):</td><td>thử lần lượt ba mức tải trong ngoặc; các dòng thụt vào là phần được lặp</td></tr>
      </table>
    focus:
