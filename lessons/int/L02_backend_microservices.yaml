  steps:
  - show: "<p><b>Dữ liệu bài toán giả định (minh họa) cho cổng chuyển tiền nhanh</b>:</p>\n<ul>\n  <li>Lưu\
      \ lượng cao điểm: $5\\,000$ yêu cầu chuyển khoản mỗi giây.</li>\n  <li>Hiện\
      \ tượng mạng: Người dùng bấm nút chuyển tiền liên tiếp 2 lần do mạng chập chờn.</li>\n\
      \  <li>Mục tiêu: Đảm bảo tài khoản nguồn chỉ bị trừ tiền đúng 1 lần duy nhất.</li>\n\
      </ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định, cổng thanh toán tiếp nhận năm nghìn yêu
      cầu mỗi giây.
      Do mạng di động chập chờn, khách hàng bấm nút xác nhận hai lần liên tiếp. Nhiệm
      vụ của hệ thống là bảo đảm tiền chỉ bị trích nợ đúng một lần duy nhất.
  - show: "<p><b>Bước 1: Kiểm tra khóa độc quyền trên bộ nhớ đệm phân tán Redis</b>:</p>\n\
      <pre><code>// Lệnh kiểm tra và xác lập khóa duy nhất\nBoolean locked = redis.setIfAbsent(\n\
      \    \"trans:\" + reqId, \"PROCESSING\", 120, TimeUnit.SECONDS);\nif (!Boolean.TRUE.equals(locked))\
      \ {\n    return ResponseEntity.status(409)\n        .body(\"Giao dich dang duoc\
      \ xu ly\");\n}</code></pre>\n<div class=\"box key\">Nếu khóa đã tồn tại, cổng\
      \ từ chối ngay lập tức và trả về mã xung đột 409!</div>"
    focus:
    - 0
    - 0
    say: Bước một, hệ thống kiểm tra khóa độc quyền trên bộ nhớ đệm phân tán. Nếu
      yêu cầu trùng lặp được phát hiện, cổng thanh toán lập tức từ chối và trả về
      mã xung đột mà không chuyển lệnh xuống ngân hàng lõi.
    clear: true
  - show: "<p><b>Bước 2: Hạch toán an toàn và cập nhật kết quả giao dịch</b>:</p>\n\
      <pre><code>try {\n    TransferResult res = coreBanking.debitAndCredit(transferData);\n\
      \    redis.set(\"trans:\" + reqId, serialize(res), 86400, TimeUnit.SECONDS);\n\
      \    return ResponseEntity.ok(res);\n} catch (ValidationException ex) { // chắc\
      \ chắn chưa hạch toán\n    redis.delete(\"trans:\" + reqId); throw ex;\n\
      } catch (TimeoutException ex) {    // kết quả CHƯA BIẾT\n    redis.set(\"trans:\"\
      \ + reqId, \"PENDING\", 86400, TimeUnit.SECONDS);\n    return ResponseEntity.accepted().build();\
      \ // đối soát sau\n}</code></pre>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, khi giữ được khóa thành công, hệ thống mới tiến hành hạch toán.
      Sau khi hoàn tất, kết quả được lưu trữ để phản hồi ngay nếu khách hàng vô tình
      gửi lại yêu cầu cũ. Nếu ngân hàng lõi quá hạn phản hồi thì kết quả là chưa biết,
      nên ta giữ trạng thái chờ và đối soát, tuyệt đối không xóa khóa.
