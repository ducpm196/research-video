    - '2.4'
    clear: true
    say: Trước khi chạy, ta đọc mã Python từng dòng. Số mười bảy là cỡ bể, và dấu thăng mở đầu ghi chú. Dòng lặp thử ba mức tải trong ngoặc.
  - show: |-
      <p><b>Đọc tiếp</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>can = tps * giu</td><td>số kết nối cần = tải nhân thời gian giữ (dấu * là nhân)</td></tr>
        <tr><td>print(...)</td><td>in các phần trong ngoặc ra màn hình</td></tr>
        <tr><td>'du' if can &lt;= pool else 'thieu'</td><td>nếu cần ít hơn hoặc bằng cỡ bể thì ghi "du", không thì ghi "thieu"</td></tr>
        <tr><td>round(pool / giu)</td><td>cỡ bể chia thời gian giữ, làm tròn: số giao dịch mỗi giây tối đa</td></tr>
      </table>
    focus:
