      \ hệ thống</th></tr>\n  <tr><td>Bấm chuyển tiền hai lần</td><td>Lần hai nhận\
      \ 409, không gọi Core lần nữa (muốn trả lại kết quả cũ thì đọc giá trị khóa trước\
      \ khi trả 409; mã ở bước 1 chưa vẽ phần này)</td></tr>\n  <tr><td>Redis\
      \ mất khóa khi failover</td><td>Ràng buộc UNIQUE(request_id) ở DB chặn ghi nợ\
      \ lần hai</td></tr>\n  <tr><td>Core quá hạn phản hồi</td><td>Giữ PENDING, đối\
      \ soát rồi mới báo kết quả</td></tr>\n</table>"
    focus:
    - 0
    - 0
