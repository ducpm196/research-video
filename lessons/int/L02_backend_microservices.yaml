    focus:
    - 0
    - 0
    - 0
    say: Khi yêu cầu từ bên ngoài đi vào, nó sẽ đi qua lớp vỏ ủy quyền của Spring.
      Tuy nhiên, nếu hàm bên ngoài gọi hàm bên trong thông qua con trỏ nội bộ, lời
      gọi sẽ bỏ qua lớp vỏ bảo vệ. Do đó tính năng quản lý giao dịch bị vô hiệu hóa
      hoàn toàn.
  - show: '<div class="box key">Quy tắc huỷ bỏ giao dịch mặc định: Spring chỉ tự động
      huỷ bỏ khi gặp lỗi thời gian chạy (<code>RuntimeException</code>, và <code>Error</code>).
      Nếu gặp lỗi kiểm tra (checked exception), Spring vẫn chốt giao dịch. Vì vậy nhiều
      đội quy ước khai báo tường minh: <code>rollbackFor = Exception.class</code>.</div>

      <p>Lỗi kiểm tra = loại lỗi Java bắt buộc khai báo hoặc bắt, ví dụ <code>IOException</code>.
      Lỗi thời gian chạy = loại không bắt buộc khai báo, ví dụ <code>NullPointerException</code>.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Một quy tắc quan trọng là Spring mặc định chỉ huỷ bỏ giao dịch khi gặp lỗi
      thời gian chạy, là loại lỗi Java không bắt buộc khai báo. Nếu hệ thống ném ra lỗi kiểm tra, là loại Java bắt buộc khai báo, giao dịch vẫn
      bị chốt. Vì vậy nhiều đội kỹ sư ngân hàng quy ước khai báo huỷ bỏ cho mọi loại lỗi
      ngoại lệ. Nhờ đó, lỗi kiểm tra cũng làm giao dịch được hoàn tác như mong đợi.
    clear: true
- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Bể Kết nối HikariCP
  checks:
  - 8 * 2 + 1 == 17
  - 120 > 60
  steps:
  - show: '<p><b>Công thức vàng tính kích thước Bể kết nối HikariCP</b>:</p>

      <div class="box key">

      $$\text{Điểm khởi đầu: } C = (\text{Số nhân CPU máy chủ DB} \times 2) + \text{Số
      lượng đĩa}$$

      $$\text{Máy chủ DB 8 nhân, 1 ổ đĩa: } C = (8 \times 2) + 1 = 17\text{
      kết nối}$$

      </div>

      <p>Công thức kinh nghiệm từ wiki PostgreSQL, được HikariCP dẫn lại làm điểm
      khởi đầu (không phải định lý): tính cho tổng kết nối của mọi instance ứng dụng,
      rồi đo tải để tinh chỉnh.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Theo một công thức kinh nghiệm phổ biến, điểm khởi đầu cho số kết nối bằng
      số nhân của máy chủ cơ sở dữ liệu nhân hai, cộng thêm số đĩa. Với máy chủ cơ
      sở dữ liệu tám nhân và một ổ đĩa, ta bắt đầu với khoảng mười bảy kết nối rồi
      đo tải để tinh chỉnh. Việc mở hàng trăm kết nối thường làm cơ sở dữ liệu tranh
      chấp nhân xử lý và tăng độ trễ.
  - show: "<p><b>Đặc tả lỗi chuẩn RFC 9457 và Khóa phân tán Redis</b>:</p>\n<pre><code>//\
      \ Khóa Redis chặn sớm yêu cầu trùng (tuyến cuối: UNIQUE ở DB)\nSET dedup:transfer:{requestId}\
      \ \"PROCESSING\" NX EX 120\n// Lỗi theo RFC 9457 (IETF 2023, thay RFC 7807)\n{\n  \"type\": \"https://example.com/errors/insufficient-funds\"\
      ,\n  \"title\": \"Insufficient Account Balance\",\n  \"status\": 422,\n  \"\
      detail\": \"So du tai khoan khong du de thuc hien giao dich\"\n}</code></pre>\n\
      <p>NX: chỉ đặt khi chưa có; EX 120: hết hạn sau 120 giây; example.com là địa chỉ ví dụ.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Để chặn sớm các yêu cầu trùng lặp, ta dùng lệnh khóa nguyên tử trong
      bộ nhớ đệm, chỉ đặt khi khóa chưa có và tự hết hạn sau một trăm hai mươi giây. Đồng thời, cấu trúc lỗi
      trả về theo RFC 9457, là chuẩn quốc tế ban hành năm 2023 quy định khung báo lỗi gồm loại lỗi, tiêu đề, mã trạng thái và mô tả.
      Ở đây mã 422 nghĩa là yêu cầu đúng cú pháp nhưng không xử lý được, vì số dư không đủ.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Xử lý 5,000 Yêu cầu Chuyển tiền với Khóa Phân tán'
  checks:
