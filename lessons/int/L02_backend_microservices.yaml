scenes:
- id: hook
  kind: hook
  title: Hiểm họa mất dữ liệu do lỗi tự gọi hàm nội bộ trong Spring Boot
  steps:
  - show: '<p>Một giao dịch chuyển khoản đã trừ tiền khách hàng nhưng không lưu lịch
      sử vào cơ sở dữ liệu khi hệ thống gặp sự cố mạng.</p>

      <div class="box key">Nguyên nhân bắt nguồn từ việc lập trình viên gọi hàm nội
      bộ trong cùng một lớp dịch vụ khiến cơ chế bọc Proxy của Spring bị bỏ qua hoàn
      toàn. Làm sao để thiết kế chuẩn kiến trúc doanh nghiệp?</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, một lỗi kinh điển trong các ứng dụng ngân hàng là việc giao dịch
      bị trừ tiền nhưng không thể hoàn tác khi xảy ra sự cố. Nguyên nhân bắt nguồn
      từ cơ chế ủy quyền động của Spring Boot bị vô hiệu hóa khi tự gọi hàm nội bộ.
      Hôm nay, ta cùng nhau giải mã toàn diện kỹ nghệ dịch vụ nhỏ chuẩn ngân hàng.
  - show: "<table class=\"t\">\n  <tr><th>điểm nghẽn kiến trúc</th><th>nguy cơ tài\
      \ chính</th><th>giải pháp chuẩn Senior ACB</th></tr>\n  <tr><td>Lỗi tự gọi hàm\
      \ nội bộ</td><td>Mất giao dịch khi có lỗi ngoại lệ</td><td>Tách dịch vụ độc\
      \ lập hoặc tiêm ủy quyền qua ngữ cảnh</td></tr>\n  <tr><td>Cấu hình bể kết nối\
      \ quá lớn</td><td>Gây nghẽn nhân xử lý của máy chủ dữ liệu</td><td>Áp dụng công\
      \ thức HikariCP tối ưu theo số nhân CPU</td></tr>\n  <tr><td>Gọi lặp lại lệnh\
      \ thanh toán</td><td>Khách hàng bị trừ tiền hai lần</td><td>Khóa Redis chặn\
      \ sớm + ràng buộc UNIQUE ở DB (tính lũy đẳng)</td></tr>\n</table>\n<p>Hôm nay, ta\
      \ làm chủ: <b>Cơ chế Dynamic Proxy</b>, <b>REST API chuẩn RFC 9457</b>, và <b>khóa\
      \ phân tán Redis</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba giải pháp then chốt cho hệ thống dịch vụ
      nhỏ. Ta tìm hiểu cách khắc phục lỗi tự gọi hàm trong quản lý giao dịch. Ta nắm
      vững quy chuẩn thiết kế cổng giao tiếp chuẩn quốc tế. Ta cũng làm chủ kỹ thuật
      khử trùng lặp lệnh bằng bộ nhớ đệm phân tán.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: Vòng đời Spring Bean, Ủy quyền động và Mức lan truyền Giao dịch'
  checks:
  - 30 * 2 == 60
  - 120 // 60 == 2
  steps:
  - show: "<p><b>Vòng đời Spring Bean và Cơ chế Ủy quyền động Dynamic Proxy</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>giai đoạn</th><th>thao tác của Spring Container</th><th>ý\
      \ nghĩa thực chiến</th></tr>\n  <tr><td>1. Khởi tạo</td><td>Gọi hàm khởi tạo\
      \ constructor và tiêm phụ thuộc</td><td>Nạp các thuộc tính cấu hình</td></tr>\n\
      \  <tr><td>2. Tiền khởi tạo</td><td>Thực thi các hàm đánh dấu PostConstruct</td><td>Chuẩn\
      \ bị dữ liệu ban đầu</td></tr>\n  <tr><td>3. Bọc ủy quyền</td><td>Tạo đối tượng\
      \ Proxy qua CGLIB hoặc JDK</td><td>Gắn tính năng quản lý giao dịch và bảo mật</td></tr>\n\
      \  <tr><td>4. Phục vụ</td><td>Bean sẵn sàng tiếp nhận yêu cầu từ Controller</td><td>Singleton\
      \ dùng chung giữa các luồng: không giữ trạng thái khả biến</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại vòng đời của đối tượng trong Spring Boot. Sau khi tiêm
      các phụ thuộc, khung làm việc sẽ tạo một lớp vỏ ủy quyền bọc quanh đối tượng
      thực tế. Nhờ lớp vỏ này, các tính năng quản lý giao dịch và ghi vết bảo mật
      mới hoạt động chính xác.
  - show: '<div class="box key">Quy tắc lan truyền giao dịch bắt buộc: Trong ngân
      hàng, khi ghi nhật ký kiểm toán giao dịch, ta luôn dùng mức REQUIRES_NEW. Mức
      này mở ra một giao dịch độc lập, bảo đảm dù lệnh chuyển tiền chính bị lỗi thì
      nhật ký thất bại vẫn được ghi thành công xuống đĩa cứng!</div>'
    focus:
    - 0
    - 0
    say: Trong hệ thống ngân hàng, việc ghi nhật ký kiểm toán bắt buộc phải dùng mức
      lan truyền độc lập. Cơ chế này bảo đảm dù giao dịch chính bị huỷ bỏ thì nhật
      ký lỗi vẫn được lưu trữ nguyên vẹn để phục vụ thanh tra.
    clear: true
- id: concept
  kind: concept
  title: Bản chất Lỗi Tự gọi hàm Nội bộ và Quy tắc Hủy bỏ Giao dịch
  steps:
  - show: "<p><b>Vì sao việc tự gọi hàm nội bộ làm mất tính năng Quản lý Giao dịch?</b></p>\n\
      <svg viewBox=\"0 0 700 220\" style=\"width:100%;max-height:200px;\">\n  <rect\
      \ x=\"20\" y=\"30\" width=\"160\" height=\"70\" rx=\"6\" fill=\"#e8f4fd\" stroke=\"\
      #003366\" stroke-width=\"2\"/>\n  <text x=\"35\" y=\"65\" font-size=\"13\" font-weight=\"\
      bold\" fill=\"#003366\">Client Request</text>\n  <path d=\"M 180 65 L 240 65\"\
      \ stroke=\"#003366\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/>\n  <rect\
      \ x=\"240\" y=\"20\" width=\"200\" height=\"180\" rx=\"8\" fill=\"#fff\" stroke=\"\
      #28a745\" stroke-width=\"2\" stroke-dasharray=\"5,5\"/>\n  <text x=\"250\" y=\"\
      45\" font-size=\"12\" font-weight=\"bold\" fill=\"#28a745\">Lớp vỏ Spring Proxy</text>\n\
      \  <rect x=\"260\" y=\"60\" width=\"160\" height=\"50\" rx=\"4\" fill=\"#d4edda\"\
      \ stroke=\"#28a745\"/>\n  <text x=\"270\" y=\"88\" font-size=\"11\" font-weight=\"\
      bold\" fill=\"#155724\">Hàm công khai ngoài</text>\n  <path d=\"M 340 110 L\
      \ 340 140\" stroke=\"#dc3545\" stroke-width=\"2\"/>\n  <text x=\"350\" y=\"\
      130\" font-size=\"11\" fill=\"#dc3545\">gọi qua this</text>\n  <rect x=\"260\"\
      \ y=\"140\" width=\"160\" height=\"50\" rx=\"4\" fill=\"#f8d7da\" stroke=\"\
      #dc3545\"/>\n  <text x=\"270\" y=\"168\" font-size=\"11\" font-weight=\"bold\"\
      \ fill=\"#721c24\">Hàm Transactional</text>\n  <rect x=\"480\" y=\"60\" width=\"\
      190\" height=\"120\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#6c757d\"/>\n  <text\
      \ x=\"490\" y=\"85\" font-size=\"12\" font-weight=\"bold\" fill=\"#333\">Hậu\
      \ quả thực tế</text>\n  <text x=\"490\" y=\"115\" font-size=\"11\" fill=\"#dc3545\"\
      >Mất Transaction!</text>\n  <text x=\"490\" y=\"140\" font-size=\"11\" fill=\"\
      #555\">Dữ liệu ghi không an toàn</text>\n  <text x=\"490\" y=\"165\" font-size=\"\
      11\" fill=\"#555\">Không thể tự hoàn tác</text>\n</svg>"
    focus:
    - 0
    - 0
    - 0
    say: Khi yêu cầu từ bên ngoài đi vào, nó sẽ đi qua lớp vỏ ủy quyền của Spring.
      Tuy nhiên, nếu hàm bên ngoài gọi hàm bên trong thông qua con trỏ nội bộ, lời
      gọi sẽ bỏ qua lớp vỏ bảo vệ. Do đó tính năng quản lý giao dịch bị vô hiệu hóa
      hoàn toàn.
  - show: '<div class="box key">Quy tắc huỷ bỏ giao dịch mặc định: Spring chỉ tự động
      huỷ bỏ khi gặp lỗi ngoại lệ không kiểm tra (RuntimeException). Nếu gặp lỗi kiểm
      tra thông thường, Spring sẽ không huỷ bỏ. Do đó ta luôn khai báo tường minh:
      rollbackFor = Exception.class!</div>'
    focus:
    - 0
    - 0
    - 0
    say: Một quy tắc quan trọng là Spring mặc định chỉ huỷ bỏ giao dịch khi gặp lỗi
      thời gian chạy. Nếu hệ thống ném ra lỗi kiểm tra thông thường, giao dịch vẫn
      bị ghi nhận. Kỹ sư ngân hàng luôn bắt buộc khai báo huỷ bỏ cho mọi loại lỗi
      ngoại lệ.
    clear: true
- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Bể Kết nối HikariCP
  checks:
  - 8 * 2 + 1 == 17
  - 120 > 60
  steps:
  - show: '<p><b>Công thức vàng tính kích thước Bể kết nối HikariCP</b>:</p>

      <div class="box key">

      $$\text{Điểm khởi đầu: } C = (\text{Số nhân CPU máy chủ DB} \times 2) + \text{Số
      lượng đĩa}$$

      $$\text{Máy chủ DB 8 nhân, 1 ổ đĩa: } C = (8 \times 2) + 1 = 17\text{
      kết nối}$$

      </div>

      <p>Công thức kinh nghiệm từ wiki PostgreSQL, được HikariCP dẫn lại làm điểm
      khởi đầu (không phải định lý): tính cho tổng kết nối của mọi instance ứng dụng,
      rồi đo tải để tinh chỉnh.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Theo một công thức kinh nghiệm phổ biến, điểm khởi đầu cho số kết nối bằng
      số nhân của máy chủ cơ sở dữ liệu nhân hai, cộng thêm số đĩa. Với máy chủ cơ
      sở dữ liệu tám nhân và một ổ đĩa, ta bắt đầu với khoảng mười bảy kết nối rồi
      đo tải để tinh chỉnh. Việc mở hàng trăm kết nối thường làm cơ sở dữ liệu tranh
      chấp nhân xử lý và tăng độ trễ.
  - show: "<p><b>Đặc tả lỗi chuẩn RFC 9457 và Khóa phân tán Redis</b>:</p>\n<pre><code>//\
      \ Khóa Redis chặn sớm yêu cầu trùng (tuyến cuối: UNIQUE ở DB)\nSET dedup:transfer:{requestId}\
      \ \"PROCESSING\" NX EX 120\n\n// Lỗi chuẩn RFC 9457 (thay RFC 7807) trả về cho cổng\
      \ Open Banking\n{\n  \"type\": \"https://api.acb.com.vn/errors/insufficient-funds\"\
      ,\n  \"title\": \"Insufficient Account Balance\",\n  \"status\": 422,\n  \"\
      detail\": \"So du tai khoan khong du de thuc hien giao dich\"\n}</code></pre>"
    focus:
    - 0
    - 0
    say: Để chặn sớm các yêu cầu trùng lặp, ta dùng lệnh khóa nguyên tử trong
      bộ nhớ đệm với thời gian sống một trăm hai mươi giây. Đồng thời, cấu trúc lỗi
      trả về phải tuân thủ chuẩn quốc tế với đầy đủ mã định danh và thông điệp rõ
      ràng.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Xử lý 5,000 Yêu cầu Chuyển tiền với Khóa Phân tán'
  checks:
  - 5000 // 100 == 50
  - 120 > 60
  - 422 > 400
  steps:
  - show: "<p><b>Dữ liệu bài toán giả định (minh họa) cho cổng chuyển tiền nhanh</b>:</p>\n<ul>\n  <li>Lưu\
      \ lượng cao điểm: $5\\,000$ yêu cầu chuyển khoản mỗi giây.</li>\n  <li>Hiện\
      \ tượng mạng: Người dùng bấm nút chuyển tiền liên tiếp 2 lần do mạng chập chờn.</li>\n\
      \  <li>Mục tiêu: Đảm bảo tài khoản nguồn chỉ bị trừ tiền đúng 1 lần duy nhất.</li>\n\
      </ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định, cổng thanh toán tiếp nhận năm nghìn yêu
      cầu mỗi giây.
      Do mạng di động chập chờn, khách hàng bấm nút xác nhận hai lần liên tiếp. Nhiệm
      vụ của hệ thống là bảo đảm tiền chỉ bị trích nợ đúng một lần duy nhất.
  - show: "<p><b>Bước 1: Kiểm tra khóa độc quyền trên bộ nhớ đệm phân tán Redis</b>:</p>\n\
      <pre><code>// Lệnh kiểm tra và xác lập khóa duy nhất\nBoolean locked = redis.setIfAbsent(\n\
      \    \"trans:\" + reqId, \"PROCESSING\", 120, TimeUnit.SECONDS);\nif (!Boolean.TRUE.equals(locked))\
      \ {\n    return ResponseEntity.status(409)\n        .body(\"Giao dich dang duoc\
      \ xu ly\");\n}</code></pre>\n<div class=\"box key\">Nếu khóa đã tồn tại, cổng\
      \ từ chối ngay lập tức và trả về mã xung đột 409!</div>"
    focus:
    - 0
    - 0
    say: Bước một, hệ thống kiểm tra khóa độc quyền trên bộ nhớ đệm phân tán. Nếu
      yêu cầu trùng lặp được phát hiện, cổng thanh toán lập tức từ chối và trả về
      mã xung đột mà không chuyển lệnh xuống ngân hàng lõi.
    clear: true
  - show: "<p><b>Bước 2: Hạch toán an toàn và cập nhật kết quả giao dịch</b>:</p>\n\
      <pre><code>try {\n    TransferResult res = coreBanking.debitAndCredit(transferData);\n\
      \    redis.set(\"trans:\" + reqId, serialize(res), 86400, TimeUnit.SECONDS);\n\
      \    return ResponseEntity.ok(res);\n} catch (ValidationException ex) { // chắc\
      \ chắn chưa hạch toán\n    redis.delete(\"trans:\" + reqId); throw ex;\n\
      } catch (TimeoutException ex) {    // kết quả CHƯA BIẾT\n    redis.set(\"trans:\"\
      \ + reqId, \"PENDING\", 86400, TimeUnit.SECONDS);\n    return ResponseEntity.accepted().build();\
      \ // đối soát sau\n}</code></pre>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, khi giữ được khóa thành công, hệ thống mới tiến hành hạch toán.
      Sau khi hoàn tất, kết quả được lưu trữ để phản hồi ngay nếu khách hàng vô tình
      gửi lại yêu cầu cũ. Nếu ngân hàng lõi quá hạn phản hồi thì kết quả là chưa biết,
      nên ta giữ trạng thái chờ và đối soát, tuyệt đối không xóa khóa.
    clear: true
  - show: "<p><b>Bước 3: Hành vi kỳ vọng của thiết kế (minh họa, không phải số liệu\
      \ đo thật)</b>:</p>\n<table class=\"t\">\n  <tr><th>tình huống</th><th>hành vi\
      \ hệ thống</th></tr>\n  <tr><td>Bấm chuyển tiền hai lần</td><td>Lần hai nhận\
      \ 409 hoặc kết quả đã lưu, không gọi Core lần nữa</td></tr>\n  <tr><td>Redis\
      \ mất khóa khi failover</td><td>Ràng buộc UNIQUE(request_id) ở DB chặn ghi nợ\
      \ lần hai</td></tr>\n  <tr><td>Core quá hạn phản hồi</td><td>Giữ PENDING, đối\
      \ soát rồi mới báo kết quả</td></tr>\n</table>"
    focus:
    - 0
    - 0
    say: Bước ba, đây là hành vi kỳ vọng của thiết kế, không phải số liệu đo thật.
      Lần bấm thứ hai bị chặn ngay tại cổng, còn tính đúng cuối cùng do ràng buộc
      duy nhất trong cơ sở dữ liệu bảo đảm, kể cả khi bộ nhớ đệm mất khóa.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Xử lý Thủng Bộ nhớ đệm bằng Bộ lọc Bloom'
  checks:
  - 409 - 400 == 9
  - 30 // 10 == 3
  steps:
  - show: "<p><b>Tình huống phỏng vấn Senior</b>: Khi kẻ gian liên tục gửi hàng triệu\
      \ yêu cầu tra cứu mã số tài khoản không tồn tại khiến bộ nhớ đệm bị bỏ qua và\
      \ chọc thẳng vào cơ sở dữ liệu gây sập hệ thống, ta xử lý thế nào?</p>\n<ul>\n\
      \  <li>(A) Tăng gấp mười lần dung lượng RAM của máy chủ.</li>\n  <li>(B) Triển\
      \ khai Bộ lọc Bloom Filter trước tầng bộ nhớ đệm để kiểm tra sự tồn tại trong\
      \ O(1).</li>\n  <li>(C) Tắt hoàn toàn tính năng tra cứu tài khoản.</li>\n</ul>"
    focus:
    - 0
