      Lần bấm thứ hai bị chặn ngay tại cổng, còn tính đúng cuối cùng do ràng buộc
      duy nhất trong cơ sở dữ liệu bảo đảm, kể cả khi bộ nhớ đệm mất khóa.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Xử lý Thủng Bộ nhớ đệm bằng Bộ lọc Bloom'
  checks:
  - 409 - 400 == 9
  - 30 // 10 == 3
  steps:
  - show: "<p><b>Tình huống phỏng vấn Senior</b>: Khi kẻ gian liên tục gửi hàng triệu\
      \ yêu cầu tra cứu mã số tài khoản không tồn tại khiến bộ nhớ đệm bị bỏ qua và\
      \ chọc thẳng vào cơ sở dữ liệu gây sập hệ thống, ta xử lý thế nào?</p>\n<ul>\n\
      \  <li>(A) Tăng gấp mười lần dung lượng RAM của máy chủ.</li>\n  <li>(B) Triển\
      \ khai Bộ lọc Bloom Filter trước tầng bộ nhớ đệm để kiểm tra sự tồn tại trong\
      \ thời gian hằng số.</li>\n  <li>(C) Tắt hoàn toàn tính năng tra cứu tài khoản.</li>\n</ul>\n\
      <p>Thủng bộ nhớ đệm (cache penetration) = yêu cầu hỏi khóa không hề tồn tại, nên\
      \ bộ nhớ đệm không bao giờ có sẵn, lần nào cũng phải xuống cơ sở dữ liệu.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Thủng bộ nhớ đệm là khi yêu cầu hỏi khóa không hề tồn tại, nên bộ nhớ đệm không bao giờ có sẵn và lần nào cũng phải xuống cơ sở dữ liệu. Mời bạn trả lời câu hỏi đối phó với hiện tượng thủng bộ nhớ đệm. Khi kẻ tấn
      công gửi hàng triệu yêu cầu tra cứu dữ liệu ảo làm quá tải cơ sở dữ liệu, kỹ
      sư cấp cao sẽ áp dụng giải pháp kiến trúc nào.
  - show: '<p><b>Đáp án chính xác: Lựa chọn (B)</b></p>

      <div class="box key">Giải thích vì: Bộ lọc Bloom Filter là một mảng bit; mỗi
      tài khoản được đưa qua k hàm băm và bật k bit tương ứng. Kiểm tra chỉ cần xem
      k bit, nên số bước không phụ thuộc số tài khoản. Nếu có một bit tắt thì chắc
      chắn tài khoản không có (không có âm tính giả, với điều kiện được nạp đủ mọi
      tài khoản mới), nên từ chối ngay mà không cần truy vấn DB.</div>

      <p>Bộ lọc có thể báo nhầm "có" (dương tính giả) với tỉ lệ nhỏ chọn trước; khi
      đó yêu cầu mới xuống DB, nên vẫn đúng, chỉ chậm hơn.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì bộ lọc Bloom là một mảng bit, mỗi tài khoản bật vài bit qua vài hàm băm, nên kiểm tra chỉ cần xem vài bit đó.
      Nếu có một bit tắt thì chắc chắn tài khoản không có thật, và hệ thống
      từ chối ngay lập tức để bảo vệ cơ sở dữ liệu. Bộ lọc có thể báo nhầm là có với tỉ lệ nhỏ, khi đó yêu cầu mới xuống cơ sở dữ liệu, nên kết quả vẫn đúng.
    clear: true
