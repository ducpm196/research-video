    - ['2.3', '2.4', '2.5']
    clear: true
    say: Số kết nối cần bằng tải nhân thời gian giữ. Lệnh in hiện kết quả, chữ thieu hay du tuỳ số cần có vượt cỡ bể hay không, và dòng cuối cho trần của bể.
  - show: '<p><b>Chạy thật bằng Python: tải tăng ×1, ×10, ×100</b></p><div class="code"><div>pool = 17      # ket noi (cong thuc: DB 8 nhan, 1 o dia)</div><div>giu = 0.020    # moi giao dich giu 1 ket noi 20 mili giay (so minh hoa)</div><div>for tps in (500, 5000, 50000):</div><div>    can = tps * giu</div><div>    print(tps, ''giao dich/giay can'', round(can), ''ket noi:'', ''du'' if can &lt;= pool else ''thieu'')</div><div>print(''toi da'', round(pool / giu), ''giao dich/giay'')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>500 giao dich/giay can 10 ket noi: du</div><div>5000 giao dich/giay can 100 ket noi: thieu</div><div>50000 giao dich/giay can 1000 ket noi: thieu</div><div>toi da 850 giao dich/giay</div></div>'
    focus:
    - 2
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, dùng bể mười bảy kết nối và mỗi giao dịch giữ một kết nối hai mươi mili giây, một số minh hoạ. Năm trăm giao dịch mỗi giây cần mười kết nối, nên đủ. Gấp mười lần thì cần một trăm kết nối, gấp một trăm lần thì cần một nghìn, và cả hai đều thiếu. Dòng cuối cho thấy trần của bể này là tám trăm năm mươi giao dịch mỗi giây, bất kể ta có thêm bao nhiêu máy ứng dụng.
  - show: |
      <table class="t">
        <tr><th>mức tải</th><th>kết nối cần</th><th>điều gì gãy</th><th>cách người làm nghề xử lý</th></tr>
        <tr><td>500 mỗi giây (×1)</td><td>10</td><td>chưa gãy: 10 nhỏ hơn 17</td><td>giữ bể nhỏ, đo thời gian giữ kết nối</td></tr>
        <tr><td>5 000 mỗi giây (×10)</td><td>100</td><td>cần nhiều hơn bể; mở thêm hàng trăm kết nối thì cơ sở dữ liệu tranh nhân xử lý</td><td>rút ngắn thời gian giữ: không gọi mạng khi giữ kết nối; dùng bộ nhớ đệm, hàng đợi</td></tr>
        <tr><td>50 000 mỗi giây (×100)</td><td>1 000</td><td>một cơ sở dữ liệu không đủ</td><td>chia dữ liệu hoặc đọc từ bản sao</td></tr>
      </table>
      <p>Đánh đổi: REQUIRES_NEW giữ thêm một kết nối cho mỗi giao dịch; nếu mọi giao dịch chính cùng chờ kết nối thứ hai thì bể cạn và treo, nên số giao dịch chính chạy cùng lúc phải nhỏ hơn cỡ bể.</p>
