  kind: concept
  title: Bản chất Lỗi Tự gọi hàm Nội bộ và Quy tắc Hủy bỏ Giao dịch
  steps:
  - show: "<p><b>Vì sao việc tự gọi hàm nội bộ làm mất tính năng Quản lý Giao dịch?</b></p>\n\
      <svg viewBox=\"0 0 700 220\" style=\"width:100%;max-height:200px;\">\n  <rect\
      \ x=\"20\" y=\"30\" width=\"160\" height=\"70\" rx=\"6\" fill=\"#e8f4fd\" stroke=\"\
