- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: Phân biệt Filter, Interceptor và AOP Aspect'
  checks:
  - 422 > 400
  - 120 - 60 == 60
  steps:
  - show: |-
      <p><b>Câu hỏi trắc nghiệm cấu trúc</b>: Khi cần đọc chứng thư client mTLS để xác định danh tính và giải nén dữ liệu trước khi yêu cầu đi vào Spring MVC, ta nên dùng thành phần nào?</p>
      <ul>
        <li><b>A</b>: Bộ lọc Servlet Filter.</li>
        <li><b>B</b>: Bộ chặn Spring Interceptor.</li>
        <li><b>C</b>: Khía cạnh AOP Aspect.</li>
        <li><b>D</b>: Khối điều khiển Controller Advice.</li>
      </ul>
      <p>TLS = mã hoá kết nối; chứng thư số = giấy chứng nhận điện tử; mTLS = TLS hai chiều; Tomcat = máy chủ web đã bắt tay TLS; Spring MVC = phần Spring nhận yêu cầu web, chuyển tới Controller; Servlet = chương trình Java trong máy chủ web nhận yêu cầu; AOP = gắn thêm việc (ghi vết, đo thời gian) quanh nhiều hàm mà không sửa chúng, mỗi khối việc là một Aspect.</p>
    focus:
    - 1
    - 3
    say: Xin mời bạn chọn thành phần kiến trúc phù hợp để đọc chứng thư bảo mật của khách trước khi yêu cầu đi vào khung làm việc. Bốn lựa chọn là bốn cách chen mã vào đường đi của yêu cầu, và vị trí của từng cách sẽ được giải thích ở đáp án.
    pause: 15
  - show: |-
      <div class="box key"><b>Đáp án chính xác là A</b>!</div>
      <p><b>Bước 1 — Phân định ranh giới xử lý của các thành phần</b>:</p>
      <table class="t">
        <tr><th>thành phần</th><th>vị trí trong luồng xử lý</th><th>ứng dụng thực tế ngân hàng</th></tr>
        <tr><td>Servlet Filter</td><td>Trong máy chủ web, trước DispatcherServlet (cổng trung tâm của Spring)</td><td>Ánh xạ chứng thư mTLS thành danh tính, giải nén dữ liệu</td></tr>
        <tr><td>Spring Interceptor</td><td>Bên trong DispatcherServlet, trước Controller</td><td>Kiểm tra mã định danh phiên và chữ ký nghiệp vụ</td></tr>
        <tr><td>AOP Aspect</td><td>Bọc quanh từng phương thức nghiệp vụ</td><td>Ghi vết kiểm toán, đo đạc thời gian thực thi</td></tr>
        <tr><td>Controller Advice</td><td>Sau Controller, gom các lỗi mà Controller ném ra</td><td>Đổi lỗi thành khung trả lời RFC 9457</td></tr>
      </table>
