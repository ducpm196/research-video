    say: Bảng này cho thấy bể kết nối gãy ở mức tải nào. Ở năm trăm giao dịch mỗi giây chỉ cần mười kết nối nên chưa gãy. Ở năm nghìn, cần một trăm kết nối, nên phải rút ngắn thời gian giữ kết nối. Ở năm mươi nghìn, một cơ sở dữ liệu không đủ, nên phải chia dữ liệu hoặc đọc từ bản sao. Đánh đổi là mức lan truyền độc lập giữ thêm một kết nối, nên số giao dịch chính chạy cùng lúc phải nhỏ hơn cỡ bể.
- id: check
  kind: check
  title: 'Tự Kiểm tra: Xử lý Thủng Bộ nhớ đệm bằng Bộ lọc Bloom'
  checks:
  - 409 - 400 == 9
  - 30 // 10 == 3
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn Senior</b>: Khi kẻ gian liên tục gửi hàng triệu yêu cầu tra cứu mã số tài khoản không tồn tại khiến bộ nhớ đệm bị bỏ qua và chọc thẳng vào cơ sở dữ liệu gây sập hệ thống, ta xử lý thế nào?</p>
      <ul>
        <li>(A) Tăng gấp mười lần dung lượng RAM của máy chủ.</li>
        <li>(B) Triển khai Bộ lọc Bloom Filter trước tầng bộ nhớ đệm để kiểm tra sự tồn tại trong thời gian hằng số.</li>
        <li>(C) Tắt hoàn toàn tính năng tra cứu tài khoản.</li>
      </ul>
      <p>Thủng bộ nhớ đệm (cache penetration) = yêu cầu hỏi khoá không hề tồn tại, nên bộ nhớ đệm không bao giờ có sẵn, lần nào cũng phải xuống cơ sở dữ liệu. Thời gian hằng số = số bước không đổi dù có bao nhiêu tài khoản.</p>
    focus:
    - 0
    - 0
    say: Thủng bộ nhớ đệm là khi yêu cầu hỏi khoá không hề tồn tại, nên bộ nhớ đệm không bao giờ có sẵn và lần nào cũng phải xuống cơ sở dữ liệu. Khi kẻ tấn công gửi hàng triệu yêu cầu tra cứu dữ liệu ảo làm quá tải cơ sở dữ liệu, kỹ sư cấp cao sẽ áp dụng giải pháp kiến trúc nào.
    pause: 15
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn (B)</b></p>
      <div class="box key">Giải thích vì: Bộ lọc Bloom Filter là một mảng bit; mỗi tài khoản được đưa qua k hàm băm (hàm băm = phép tính biến nội dung thành một con số) và bật k bit tương ứng. Kiểm tra chỉ cần xem k bit, nên số bước không phụ thuộc số tài khoản. Nếu có một bit tắt thì chắc chắn tài khoản không có (không có âm tính giả, tức không bao giờ báo "không có" cho tài khoản thật sự có, với điều kiện được nạp đủ mọi tài khoản mới), nên từ chối ngay mà không cần truy vấn DB.</div>
      <p>Bộ lọc có thể báo nhầm "có" (dương tính giả) với tỉ lệ nhỏ chọn trước; khi đó yêu cầu mới xuống DB, nên vẫn đúng, chỉ chậm hơn. Ví dụ: $10\,000$ truy vấn sai với $1\%$ báo nhầm chỉ để $100$ yêu cầu lọt xuống DB.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B. Bộ lọc Bloom là một mảng bit, mỗi tài khoản bật vài bit qua vài hàm băm, tức phép tính biến nội dung thành một con số, nên kiểm tra chỉ cần xem vài bit đó. Nếu có một bit tắt thì chắc chắn tài khoản không có thật, và hệ thống từ chối ngay lập tức để bảo vệ cơ sở dữ liệu. Bộ lọc có thể báo nhầm là có với tỉ lệ nhỏ, ví dụ mười nghìn truy vấn sai chỉ còn một trăm yêu cầu xuống cơ sở dữ liệu, nên kết quả vẫn đúng.
    clear: true
