scenes:
- id: hook
  kind: hook
  title: Hiểm họa mất dữ liệu do lỗi tự gọi hàm nội bộ trong Spring Boot
  steps:
  - show: '<p>Một giao dịch chuyển khoản đã trừ tiền khách hàng nhưng không lưu lịch
      sử vào cơ sở dữ liệu khi hệ thống gặp sự cố mạng.</p>

      <div class="box key">Nguyên nhân bắt nguồn từ việc lập trình viên gọi hàm nội
      bộ trong cùng một lớp dịch vụ khiến cơ chế bọc Proxy của Spring bị bỏ qua hoàn
      toàn. Làm sao để thiết kế chuẩn kiến trúc doanh nghiệp?</div>

      <p>Spring Boot = bộ khung phổ biến để viết dịch vụ Java. Proxy (lớp vỏ ủy quyền)
      = đối tượng Spring bọc quanh đối tượng của bạn, tự mở và đóng giao dịch cơ sở
      dữ liệu trước và sau mỗi lời gọi.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, một lỗi kinh điển trong các ứng dụng ngân hàng là việc giao dịch
      bị trừ tiền nhưng không thể hoàn tác khi xảy ra sự cố. Nguyên nhân bắt nguồn
      từ cơ chế ủy quyền động của Spring Boot bị vô hiệu hóa khi tự gọi hàm nội bộ.
      Spring Boot là bộ khung phổ biến để viết dịch vụ Java, còn lớp vỏ ủy quyền là đối tượng bọc quanh đối tượng của bạn để tự mở và đóng giao dịch.
      Hôm nay, ta cùng nhau giải mã toàn diện kỹ nghệ dịch vụ nhỏ chuẩn ngân hàng.
  - show: "<table class=\"t\">\n  <tr><th>điểm nghẽn kiến trúc</th><th>nguy cơ tài\
      \ chính</th><th>giải pháp chuẩn Senior ACB</th></tr>\n  <tr><td>Lỗi tự gọi hàm\
      \ nội bộ</td><td>Mất giao dịch khi có lỗi ngoại lệ</td><td>Tách dịch vụ độc\
      \ lập hoặc tiêm ủy quyền qua ngữ cảnh</td></tr>\n  <tr><td>Cấu hình bể kết nối\
      \ quá lớn</td><td>Gây nghẽn nhân xử lý của máy chủ dữ liệu</td><td>Áp dụng công\
      \ thức HikariCP tối ưu theo số nhân CPU</td></tr>\n  <tr><td>Gọi lặp lại lệnh\
      \ thanh toán</td><td>Khách hàng bị trừ tiền hai lần</td><td>Khóa Redis chặn\
      \ sớm + ràng buộc UNIQUE ở DB (tính lũy đẳng)</td></tr>\n</table>\n<p>Hôm nay, ta\
      \ làm chủ: <b>Cơ chế Dynamic Proxy</b>, <b>REST API chuẩn RFC 9457</b>, và <b>khóa\
      \ phân tán Redis</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba giải pháp then chốt cho hệ thống dịch vụ
      nhỏ. Ta tìm hiểu cách khắc phục lỗi tự gọi hàm trong quản lý giao dịch. Ta nắm
      vững quy chuẩn thiết kế cổng giao tiếp chuẩn quốc tế. Ta cũng làm chủ kỹ thuật
      khử trùng lặp lệnh bằng bộ nhớ đệm phân tán.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Từ vựng, Spring Bean và Mức lan truyền'
  checks:
  - 30 * 2 == 60
  - 120 // 60 == 2
  steps:
  - show: |-
      <p><b>Từ vựng cần nắm trước</b> (giải nghĩa bằng lời thường):</p>
      <table class="t">
        <tr><th>thuật ngữ</th><th>nghĩa</th></tr>
        <tr><td>Microservices (dịch vụ nhỏ)</td><td>Chia hệ thống thành nhiều chương trình nhỏ, mỗi chương trình lo một việc, gọi nhau qua mạng</td></tr>
        <tr><td>Giao dịch (transaction), rollback</td><td>Nhóm thao tác cơ sở dữ liệu hoặc cùng thành công, hoặc cùng bị huỷ (rollback = huỷ, trả về như cũ)</td></tr>
        <tr><td>REST API, mã trạng thái HTTP</td><td>Cách các dịch vụ gọi nhau qua HTTP; con số trả về cho biết kết quả: 200 thành công, 202 đã nhận chưa xong, 409 xung đột, 422 dữ liệu không xử lý được</td></tr>
        <tr><td>Redis</td><td>Kho dữ liệu nằm trong RAM, đọc ghi rất nhanh, hay dùng làm bộ nhớ đệm và khóa</td></tr>
        <tr><td>Bể kết nối (HikariCP)</td><td>Nhóm kết nối tới cơ sở dữ liệu được mở sẵn và dùng lại, khỏi mở mới mỗi lần</td></tr>
        <tr><td>Lũy đẳng (idempotency)</td><td>Gửi một lần hay nhiều lần cùng một yêu cầu thì kết quả vẫn như gửi một lần</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu một số từ sẽ dùng cả bài. Dịch vụ nhỏ là cách chia hệ thống thành nhiều chương trình nhỏ, mỗi chương trình lo một việc và gọi nhau qua mạng.
      Giao dịch là nhóm thao tác cơ sở dữ liệu hoặc cùng thành công, hoặc cùng bị huỷ để trả về như cũ.
      Bể kết nối là nhóm kết nối cơ sở dữ liệu mở sẵn để dùng lại, còn lũy đẳng nghĩa là gửi một lần hay nhiều lần thì kết quả vẫn như gửi một lần.
    clear: true
  - show: "<p><b>Vòng đời Spring Bean</b> (bean = đối tượng do Spring tạo và quản lý):</p>\n\
      <table class=\"t\">\n  <tr><th>giai đoạn</th><th>thao tác của Spring Container</th><th>ý\
      \ nghĩa thực chiến</th></tr>\n  <tr><td>1. Khởi tạo</td><td>Gọi constructor và\
      \ tiêm phụ thuộc (Spring tự đưa đối tượng bean cần vào)</td><td>Nạp các thuộc tính cấu hình</td></tr>\n\
      \  <tr><td>2. Tiền khởi tạo</td><td>Thực thi các hàm đánh dấu PostConstruct</td><td>Chuẩn\
      \ bị dữ liệu ban đầu</td></tr>\n  <tr><td>3. Bọc ủy quyền</td><td>Tạo đối tượng\
      \ Proxy qua CGLIB hoặc JDK</td><td>Gắn tính năng quản lý giao dịch và bảo mật</td></tr>\n\
      \  <tr><td>4. Phục vụ</td><td>Bean sẵn sàng tiếp nhận yêu cầu từ Controller</td><td>Singleton\
      \ dùng chung giữa các luồng: không giữ trạng thái khả biến</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Tiếp theo là vòng đời của bean, tức đối tượng do Spring tạo và quản lý. Tiêm phụ thuộc nghĩa là Spring tự đưa các đối tượng mà bean cần vào cho nó. Sau khi tiêm
      các phụ thuộc, khung làm việc sẽ tạo một lớp vỏ ủy quyền bọc quanh đối tượng
      thực tế. Nhờ lớp vỏ này, các tính năng quản lý giao dịch và ghi vết bảo mật
      mới hoạt động chính xác.
    clear: true
  - show: '<div class="box key">Mức lan truyền (propagation) = quy tắc khi một hàm
      có giao dịch gọi sang một hàm có giao dịch khác. Mặc định <code>REQUIRED</code>:
      nhập chung giao dịch đang chạy, huỷ là huỷ cả. <code>REQUIRES_NEW</code>: tạm
      dừng giao dịch đang chạy, mở một giao dịch riêng và chốt riêng. Cách làm thường
      gặp: ghi nhật ký kiểm toán bằng <code>REQUIRES_NEW</code> để nhật ký thất bại
      vẫn được lưu dù lệnh chuyển tiền chính bị huỷ.</div>

      <p>Điều kiện: hàm ghi nhật ký phải được gọi qua proxy (nằm ở bean khác), và
      cần thêm một kết nối từ bể trong lúc giao dịch chính vẫn giữ kết nối của nó.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Mức lan truyền là quy tắc khi một hàm có giao dịch gọi sang hàm có giao dịch khác, mặc định hàm sau nhập chung giao dịch đang chạy nên huỷ là huỷ cả.
      Cách làm thường gặp trong ngân hàng là ghi nhật ký kiểm toán bằng mức lan truyền độc lập, mở giao dịch riêng, để nhật ký lỗi vẫn được lưu dù giao dịch chính bị huỷ.
      Mức này chỉ có tác dụng khi hàm ghi nhật ký được gọi qua lớp vỏ ủy quyền, và nó cần thêm một kết nối từ bể.
    clear: true
