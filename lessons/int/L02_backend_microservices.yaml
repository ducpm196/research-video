        <tr><td>ValidationException, TimeoutException</td><td>lỗi dữ liệu sai (chắc chắn chưa ghi sổ), và lỗi quá hạn chờ (chưa biết kết quả)</td></tr>
        <tr><td>ResponseEntity.ok(res), ResponseEntity.accepted().build()</td><td>trả mã 200 kèm kết quả; trả mã 202, đã nhận chưa xong</td></tr>
        <tr><td>// đối soát sau</td><td>đối soát = so từng giao dịch giữa sổ hai bên để tìm chỗ lệch</td></tr>
