    - '3.2'
    say: Đáp án chính xác là phương án A. Bộ lọc chạy trong máy chủ web, trước cổng trung tâm của Spring, nên phù hợp để xử lý yêu cầu thô. Việc bắt tay bảo mật do máy chủ web đảm nhận, còn bộ lọc đọc chứng thư của khách để xác định danh tính trước khi chuyển tiếp vào bên trong.
