        <li>Nguyên nhân: Hai tiến trình chuyển tiền đồng thời khoá tài khoản theo thứ tự đảo ngược nhau.</li>
      </ul>
      <p>Bế tắc (deadlock) = hai phiên làm việc, mỗi phiên giữ một khoá và chờ khoá phiên kia đang giữ, nên không ai đi tiếp được. Oracle là hệ quản trị cơ sở dữ liệu thương mại hay gặp ở ngân hàng; ORA-00060 là mã lỗi Oracle báo đã phát hiện bế tắc.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định, chi lương cho mười nghìn nhân viên với tổng ngân sách một trăm năm mươi tỉ đồng. Vào giờ cao điểm, cơ sở dữ liệu liên tục báo lỗi bế tắc khoá do hai luồng đồng thời tranh chấp tài nguyên theo thứ tự ngược chiều. Bế tắc là khi mỗi phiên giữ một khoá và chờ khoá mà phiên kia đang giữ. Mã lỗi ORA-00060 là cách Oracle, một hệ cơ sở dữ liệu thương mại hay gặp ở ngân hàng, báo đã phát hiện điều đó.
  - show: |-
      <p><b>Bước 1: Phân tích tệp nhật ký vết bế tắc khoá (.trc) của Oracle</b>:</p>
      <div class="box pit">Tiến trình A giữ khoá tài khoản X và chờ tài khoản Y. Trong khi đó tiến trình B đang giữ khoá tài khoản Y và chờ tài khoản X. Hai tiến trình chờ nhau vô hạn tạo thành chu trình bế tắc khoá!</div>
    focus:
    - 0
    - 0
    say: Bước một, khi phân tích tệp vết của cơ sở dữ liệu, ta thấy tiến trình thứ nhất giữ tài khoản này và chờ tài khoản kia. Ngược lại, tiến trình thứ hai lại giữ tài khoản kia và chờ tài khoản này, tạo thành vòng tròn chờ đợi bế tắc.
    clear: true
  - show: |-
      <p><b>Đọc trước mã PL/SQL của bước 2</b>. SQL = ngôn ngữ ra lệnh cho cơ sở dữ liệu; PL/SQL = SQL thêm biến và vòng lặp, chạy bên trong Oracle.</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>-- ...</td><td>từ dấu -- tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>v_first := LEAST(acc_from, acc_to);</td><td>dấu := là gán giá trị vào biến; LEAST lấy số nhỏ hơn, GREATEST lấy số lớn hơn</td></tr>
        <tr><td>SELECT balance INTO v_b1 FROM accounts WHERE account_no = v_first FOR UPDATE;</td><td>SELECT = đọc; INTO v_b1 = bỏ kết quả vào biến v_b1; FROM accounts = từ bảng accounts; WHERE = điều kiện chọn dòng; FOR UPDATE = đọc xong thì khoá luôn dòng đó tới khi giao dịch kết thúc</td></tr>
        <tr><td>ORDER BY cột</td><td>sắp các dòng kết quả theo cột đó</td></tr>
      </table>
    focus:
    - 0
    - 1
    - '2.3'
    - '2.4'
    clear: true
    say: Trước khi xem mã bước hai, ta đọc các cú pháp lạ. SQL là ngôn ngữ ra lệnh cho cơ sở dữ liệu, còn PL/SQL thêm biến và vòng lặp. Dấu hai chấm bằng là gán giá trị, hàm nhỏ nhất và hàm lớn nhất chọn hai tài khoản theo thứ tự. Câu chọn đọc số dư bỏ vào biến, và khoá luôn dòng đó.
  - show: |-
      <p><b>Bước 2: Áp dụng Thuật toán Khoá hàng có Thứ tự Xác định</b>:</p>
      <pre><code>-- Sắp tăng dần rồi khoá TỪNG dòng bằng câu lệnh riêng
      v_first  := LEAST(acc_from, acc_to);
      v_second := GREATEST(acc_from, acc_to);
      SELECT balance INTO v_b1 FROM accounts WHERE account_no = v_first  FOR UPDATE;
      SELECT balance INTO v_b2 FROM accounts WHERE account_no = v_second FOR UPDATE;</code></pre>
      <p>Đây là đoạn trích thân thủ tục PL/SQL; các biến khai báo ở phần DECLARE.</p>
    focus:
    - 2
    - 3
    say: Bước hai, ta sắp xếp hai tài khoản tăng dần rồi khoá từng dòng bằng một câu lệnh riêng, tài khoản nhỏ trước, lớn sau. Dòng nào được đọc cũng bị giữ khoá cho tới khi giao dịch kết thúc.
    clear: true
  - show: |-
      <div class="box key">Không dựa vào <code>ORDER BY ... FOR UPDATE</code>: Oracle không bảo đảm khoá dòng theo thứ tự ORDER BY. Khi mọi luồng code khoá nhỏ trước, lớn sau, giữa các luồng đó không hình thành chu trình chờ; ORA-00060 vẫn có thể đến từ luồng khác hoặc khoá ngoại (FK: cột ở bảng con trỏ tới bảng cha) chưa có chỉ mục.</div>
    focus:
    - 0
    - 0
    say: Khi mọi luồng xử lý đều tuân theo cùng trật tự này, giữa chúng không thể hình thành chu trình chờ đợi bế tắc. Nhưng bế tắc vẫn có thể đến từ luồng khác, hoặc từ khoá ngoại chưa có chỉ mục, tức cột bảng con trỏ tới bảng cha.
    clear: true
  - show: |-
      <p><b>Đọc trước mã PL/SQL của bước 3</b>. Con trỏ (cursor) = đối tượng giữ vị trí đọc và đưa dữ liệu ra từng đợt.</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>OPEN cur_payroll; ... CLOSE cur_payroll;</td><td>mở con trỏ, dùng xong thì đóng</td></tr>
        <tr><td>LOOP ... END LOOP;</td><td>lặp lại các dòng ở giữa cho tới khi gặp lệnh thoát</td></tr>
        <tr><td>FETCH cur_payroll BULK COLLECT INTO l_accounts LIMIT 1000;</td><td>lấy tối đa 1000 dòng một lần, bỏ vào mảng l_accounts</td></tr>
        <tr><td>EXIT WHEN l_accounts.COUNT = 0;</td><td>thoát vòng lặp khi mảng không còn dòng nào</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3', '2.4', '2.5']
    clear: true
    say: Trước khi xem mã bước ba, ta đọc các cú pháp. Con trỏ được mở rồi đóng khi xong, vòng lặp lấy từng lô tối đa một nghìn dòng vào mảng, và thoát khi mảng rỗng.
  - show: |-
      <p><b>Đọc tiếp mã bước 3</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>FORALL i IN 1..l_accounts.COUNT UPDATE ...</td><td>i chạy từ 1 tới số phần tử của mảng; cả mảng được gửi đi một lần</td></tr>
        <tr><td>l_accounts(i).amount</td><td>phần tử thứ i của mảng, lấy trường amount (số tiền); acc_no là số tài khoản</td></tr>
        <tr><td>UPDATE accounts SET balance = balance + ... WHERE ...</td><td>sửa số dư của các dòng thỏa điều kiện</td></tr>
        <tr><td>ORDER BY acc_no</td><td>con trỏ lấy dòng theo số tài khoản tăng dần, nên mọi lô khoá cùng một thứ tự</td></tr>
      </table>
    focus:
    - ['2.2', '2.4']
    - ['2.3', '2.5']
    clear: true
    say: Lệnh cập nhật gửi cả mảng một lần, với số i chạy từ một tới hết mảng. Chỉ số trong ngoặc lấy phần tử thứ i, và sắp theo số tài khoản nên mọi lô khoá cùng thứ tự.
  - show: |-
      <p><b>Bước 3: Xử lý theo lô với Bulk Collect và Forall</b> (trích thân thủ tục PL/SQL):</p>
      <pre><code>-- 10 000 dòng, mỗi lô 1 000 dòng = 10 lô
      -- cur_payroll lấy dữ liệu ORDER BY acc_no: mọi lô khoá theo cùng thứ tự
      OPEN cur_payroll;
      LOOP
        FETCH cur_payroll BULK COLLECT INTO l_accounts LIMIT 1000;
        EXIT WHEN l_accounts.COUNT = 0;
        FORALL i IN 1..l_accounts.COUNT
          UPDATE accounts SET balance = balance + l_accounts(i).amount
          WHERE account_no = l_accounts(i).acc_no;
      END LOOP;
      CLOSE cur_payroll;</code></pre>
    focus:
    - 2
    say: Bước ba, kỹ sư viết bằng PL/SQL, ngôn ngữ lập trình chạy bên trong Oracle, lấy dữ liệu theo từng lô một nghìn dòng trong một vòng lặp và cập nhật đồng loạt từng lô.
    clear: true
  - show: |-
      <p><b>Vì sao xử lý theo lô nhanh hơn?</b></p>
      <ul>
        <li>PL/SQL = ngôn ngữ lập trình chạy bên trong Oracle; câu lệnh SQL chạy ở một bộ máy khác.</li>
        <li>BULK COLLECT lấy nhiều dòng một lần vào mảng; FORALL gửi một lệnh UPDATE cho cả mảng.</li>
        <li>Mỗi lần PL/SQL chuyển việc sang bộ máy SQL là một lần đổi ngữ cảnh.</li>
        <li>Từng dòng: khoảng 10 000 × 2 = 20 000 lần (một lần lấy, một lần cập nhật mỗi dòng). Theo lô: khoảng 10 × 2 = 20 lần. Đây là mô hình đơn giản hoá: Oracle bản mới còn tự lấy mảng nhiều dòng trong vòng lặp con trỏ, nên chênh lệch thật nhỏ hơn và phải đo.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    say: Vì sao xử lý theo lô nhanh hơn, vì câu lệnh cơ sở dữ liệu chạy ở một bộ máy khác với ngôn ngữ PL/SQL. Mỗi lần chuyển việc sang bộ máy đó là một lần đổi ngữ cảnh, nên theo mô hình đơn giản hoá làm từng dòng tốn khoảng 20000 lần, còn làm theo lô chỉ khoảng 20 lần. Oracle bản mới còn tự gộp một phần, nên chênh lệch thật nhỏ hơn và phải đo trên dữ liệu thật.
    clear: true
- id: quymo
  kind: example
  title: 'Khi đối tác chậm dần: cam kết hai pha giữ khoá lâu, SAGA thì không'
  checks:
  - round(2 * 0.020 * 1000) == 40
  - round(10000 * 2 * 0.020) == 400
  - round(10000 * 2 * 0.200) == 4000
  - round(10000 * 2 * 2.0) == 40000
  - round(10000 * 0.004) == 40
  - round(1 / 0.004) == 250
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>doi_tac = [('nhanh 20 ms', 0.020), ...]</td><td>danh sách (ngoặc vuông) các cặp (tên, thời gian trả lời tính bằng giây); từ dấu # tới hết dòng là ghi chú, máy bỏ qua</td></tr>
        <tr><td>for ten, rtt in doi_tac:</td><td>lần lượt lấy từng cặp ra hai biến: ten là tên, rtt là thời gian trả lời; các dòng thụt vào là phần được lặp</td></tr>
        <tr><td>giu = 2 * rtt; print(a, b, ...)</td><td>khoá giữ gấp đôi thời gian trả lời (hai vòng hỏi đáp); print in các giá trị cách nhau một dấu cách</td></tr>
        <tr><td>toc, xong = round(1 / giu, 2), round(tong * giu)</td><td>gán cùng lúc hai kết quả: toc = 1 chia thời gian giữ, xong = số lệnh nhân thời gian giữ; round(x) làm tròn thành số nguyên, round(x, 2) giữ hai chữ số lẻ</td></tr>
      </table>
    focus:
    - 0
    - ['2.2', '2.3']
    - '2.4'
    - '2.5'
    clear: true
    say: Trước khi chạy, ta đọc mã Python. Danh sách là các cặp gồm tên và thời gian trả lời, và dòng lặp lấy lần lượt từng cặp ra hai biến. Khoá giữ gấp đôi thời gian trả lời. Tốc độ bằng một chia thời gian giữ, còn thời gian xong bằng số lệnh nhân thời gian giữ, gán cùng lúc vào hai biến.
  - show: |
      <p><b>Chạy thật bằng Python: đối tác chậm dần ×1, ×10, ×100</b></p><div class="code"><div>tong = 10000   # lenh chuyen tu mot tai khoan tra luong (so minh hoa)</div><div>doi_tac = [('nhanh 20 ms', 0.020), ('cham 200 ms', 0.200), ('rat cham 2000 ms', 2.0)]</div><div>for ten, rtt in doi_tac:</div><div>    giu = 2 * rtt        # 2PC: khoa giu qua hai vong hoi dap</div><div>    toc, xong = round(1 / giu, 2), round(tong * giu)</div><div>    print(ten, '-&gt; giu', round(giu * 1000), 'ms;', toc, 'lenh/giay;', xong, 'giay')</div><div>s = 0.004            # SAGA: chi giu khoa trong giao dich cuc bo 4 ms</div><div>print('SAGA cuc bo 4 ms -&gt;', round(1 / s), 'lenh/giay;', round(tong * s), 'giay')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>nhanh 20 ms -&gt; giu 40 ms; 25.0 lenh/giay; 400 giay</div><div>cham 200 ms -&gt; giu 400 ms; 2.5 lenh/giay; 4000 giay</div><div>rat cham 2000 ms -&gt; giu 4000 ms; 0.25 lenh/giay; 40000 giay</div><div>SAGA cuc bo 4 ms -&gt; 250 lenh/giay; 40 giay</div></div>
    focus:
    - 2
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, với dòng nóng, tức dòng dữ liệu mà rất nhiều lệnh cùng cần khoá, là tài khoản trả lương xử lý mười nghìn lệnh, một số minh hoạ. Với cam kết hai pha, khoá giữ qua hai vòng hỏi đáp, nên đối tác nhanh hai mươi mili giây giữ khoá bốn mươi mili giây, và mười nghìn lệnh xong sau bốn trăm giây. Đối tác chậm gấp mười lần thì xong sau bốn nghìn giây, và chậm gấp một trăm lần thì mất bốn mươi nghìn giây, hơn mười một giờ. Còn SAGA, trong mô hình rút gọn này, chỉ giữ khoá dòng nóng bốn mili giây, đối tác chậm hơn cũng không đổi số đó, nên xong sau bốn mươi giây.
  - show: |
      <table class="t">
        <tr><th>đối tác chậm dần</th><th>cam kết hai pha</th><th>SAGA</th><th>điều gì đổi</th></tr>
        <tr><td>20 mili giây (×1)</td><td>400 giây</td><td style="white-space:nowrap">40 giây</td><td>cả hai còn chấp nhận được</td></tr>
        <tr><td>200 mili giây (×10)</td><td>4 000 giây (hơn 1 giờ)</td><td style="white-space:nowrap">40 giây</td><td>dòng nóng thành nút cổ chai của cam kết hai pha</td></tr>
        <tr><td>2 000 mili giây (×100)</td><td>40 000 giây (hơn 11 giờ)</td><td style="white-space:nowrap">40 giây</td><td>cam kết hai pha không dùng được; đối tác chậm kéo cả hệ thống</td></tr>
      </table>
      <p>Đánh đổi: SAGA nhanh vì không giữ khoá qua mạng, nhưng kết quả chỉ nhất quán sau một lúc, và mỗi bước phải có bước bù trừ lũy đẳng. Đây là mô hình rút gọn: chưa cộng 4 mili giây cục bộ vào cam kết hai pha và chưa tính bước bồi hoàn của SAGA.</p>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - 2
    - 2
    clear: true
    say: Bảng này đặt hai cách cạnh nhau khi đối tác chậm dần. Ở hai mươi mili giây, cả hai còn chấp nhận được. Ở hai trăm mili giây, dòng nóng thành nút cổ chai của cam kết hai pha, mất hơn một giờ. Ở hai nghìn mili giây, cam kết hai pha mất hơn mười một giờ nên không dùng được, còn SAGA vẫn bốn mươi giây. Đánh đổi của SAGA là kết quả chỉ nhất quán sau một lúc, và mỗi bước phải có bước bù trừ chạy lại được an toàn. Đây là mô hình rút gọn, chưa tính bước bồi hoàn.
- id: check
  kind: check
  title: 'Tự Kiểm tra: So sánh Mô hình SAGA Tự phối hợp và Điều phối'
  checks:
  - 100 > 10
  - 60 * 1000 == 60000
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn Senior</b>: Trong luồng thanh toán hóa đơn gồm 8 dịch vụ tham gia (quy trình nhiều bước), tại sao ngân hàng thường ưu tiên mô hình SAGA Điều phối tập trung hơn mô hình Tự phối hợp qua sự kiện?</p>
      <ul>
        <li>(A) Điều phối tập trung cho kết quả nhất quán ngay tức thì, như một giao dịch cơ sở dữ liệu duy nhất.</li>
        <li>(B) Với nhiều bước, mô hình tự phối hợp dễ rơi vào bẫy vòng lặp sự kiện và khó truy vết khi có lỗi (ít bước, ít đội thì vẫn có thể hợp lý), trong khi điều phối tập trung quản lý máy trạng thái rõ ràng và kiểm soát bù trừ chuẩn xác.</li>
        <li>(C) Mô hình tự phối hợp không thể bù trừ khi có lỗi, nên chỉ điều phối tập trung mới có bước bù trừ.</li>
      </ul>
      <p>Tự phối hợp (choreography) = không có bộ điều phối; mỗi dịch vụ tự nghe sự kiện của dịch vụ khác rồi làm phần mình. Điều phối tập trung (orchestration) = một dịch vụ điều phối ra lệnh từng bước.</p>
    focus:
    - 0
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi lựa chọn kiến trúc giao dịch phân tán. Tự phối hợp nghĩa là không có bộ điều phối, mỗi dịch vụ tự nghe sự kiện của dịch vụ khác rồi làm phần mình. Với quy trình phức tạp gồm tám bước tham gia, vì sao mô hình điều phối tập trung thường được ưu tiên.
    pause: 15
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn (B)</b></p>
      <div class="box key">Giải thích vì: Khi quy trình có nhiều bước, mô hình tự phối hợp khiến đồ thị sự kiện trở nên rối và khó kiểm soát trạng thái bồi hoàn. Mô hình điều phối tập trung lưu vết máy trạng thái vào cơ sở dữ liệu và kích hoạt các giao dịch bù trừ theo thứ tự ngược; mỗi bước bù trừ phải lũy đẳng để chạy lại an toàn.</div>
      <p>Vì sao không chọn A và C: A nhầm SAGA với một giao dịch duy nhất; SAGA nào cũng chỉ nhất quán sau một lúc, vì từng bước đã chốt riêng. C sai vì mô hình tự phối hợp vẫn bù trừ được bằng sự kiện hoàn tác, chỉ khó theo dõi khi nhiều bước.</p>
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì khi quy trình có nhiều bước, việc để các dịch vụ tự lắng nghe nhau sẽ gây hỗn loạn đồ thị sự kiện. Do đó máy điều phối tập trung giúp lưu vết trạng thái và kích hoạt bù trừ chuẩn xác. Còn SAGA nào cũng chỉ nhất quán sau một lúc, và tự phối hợp vẫn bù trừ được.
    clear: true
- id: pitfall
  kind: pitfall
  title: 'Bẫy Nguy hiểm: Thiếu Phân vùng Bảng và Quên Đánh Chỉ mục Khoá ngoại'
  steps:
  - show: |-
      <div class="box pit">Hai sai lầm kinh điển làm sập cơ sở dữ liệu Oracle vào giờ cao điểm:</div>
      <table class="t" style="margin-top: 10px;">
        <tr><th>sai lầm sơ cấp</th><th>hậu quả vận hành</th><th>giải pháp chuẩn Senior</th></tr>
        <tr><td>Bảng giao dịch không phân vùng</td><td>Khi truy vấn theo ngày mà không có chỉ mục phù hợp, phải quét toàn bảng hàng chục triệu dòng, làm đơ I/O</td><td>Phân vùng theo khoảng ngày kết hợp lược tỉa phân vùng</td></tr>
        <tr><td>Thiếu chỉ mục trên cột khoá ngoại</td><td>Khoá mức bảng trên bảng con khi xóa dòng cha hoặc sửa khoá chính bảng cha</td><td>Tạo chỉ mục trên cột khoá ngoại khi bảng cha có xóa dòng hoặc sửa khoá chính</td></tr>
      </table>
      <p>Chỉ mục = bảng tra phụ giống mục lục sách (nhắc lại từ chuyên đề 0 và 1). Phân vùng = chia một bảng lớn thành nhiều phần theo ngày; lược tỉa = Oracle chỉ đọc phần chứa ngày được hỏi. Khoá ngoại = cột ở bảng con trỏ tới khoá chính của bảng cha (ví dụ giao dịch trỏ tới tài khoản).</p>
    focus:
    - 3
    - 3
    - 2
    - '2.2'
    - '2.3'
    say: Phân vùng là chia một bảng lớn thành nhiều phần theo ngày để Oracle chỉ đọc phần chứa ngày được hỏi. Khoá ngoại là cột ở bảng con trỏ tới khoá chính của bảng cha, còn chỉ mục giống mục lục sách để tra nhanh một cột. Hai sai lầm phổ biến là để bảng giao dịch phình to mà không phân vùng theo thời gian, và quên đánh chỉ mục trên cột khoá ngoại. Thiếu phân vùng, truy vấn theo ngày phải quét cả bảng. Thiếu chỉ mục khoá ngoại, khi xóa dòng ở bảng chính hoặc sửa khoá chính, cơ sở dữ liệu khoá cả bảng phụ, khiến các phiên khác phải chờ.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: Điều tra Nguyên nhân Bế tắc Khoá Oracle'
  checks:
  - 100 - 90 == 10
  - 19 * 10 == 190
  steps:
  - show: |-
      <p><b>Câu hỏi trắc nghiệm thực chiến</b>: Khi nhật ký ứng dụng báo lỗi ORA-00060, công cụ nào sau đây cho phép Kỹ sư Cấp cao xác định chính xác câu lệnh và dòng dữ liệu gây ra tranh chấp?</p>
      <ul>
        <li><b>A</b>: Tăng thời gian chờ khoá lên vài giờ để các phiên không bỏ cuộc sớm.</li>
        <li><b>B</b>: Mở tệp vết nhật ký trace file có đuôi chấm trc trong thư mục trace (ADR) của Oracle để đọc biểu đồ chu trình bế tắc khoá.</li>
        <li><b>C</b>: Thêm chỉ mục cho mọi cột của bảng giao dịch để khoá nhanh hơn.</li>
        <li><b>D</b>: Đọc kỹ thêm nhật ký ứng dụng, vì nó ghi đủ cả hai câu lệnh và dòng bị khoá.</li>
      </ul>
      <p>Thời gian chờ khoá = số giây một phiên đợi khoá trước khi bỏ cuộc. Tệp vết (.trc) = bản ghi chi tiết một sự cố; ADR = thư mục chẩn đoán mà Oracle dùng để cất nhật ký lỗi và tệp vết. Nhật ký ứng dụng = tệp chữ do chính chương trình của bạn ghi ra.</p>
    focus:
    - 1
    - 3
    say: Xin mời bạn chọn phương án xử lý sự cố chuẩn mực khi hệ thống gặp lỗi bế tắc khoá. Mỗi phương án đều là một phản xạ có thật của người mới, nhưng chỉ một phương án cho ta biết đúng hai câu lệnh xung đột.
    pause: 15
  - show: |-
      <div class="box key"><b>Đáp án chính xác là B</b>!</div>
      <p><b>Bước 1 — Quy trình điều tra sự cố chuyên nghiệp</b>:</p>
      <table class="t">
        <tr><th>bước thực hiện</th><th>công cụ sử dụng</th><th>kết quả trích xuất</th></tr>
        <tr><td>1. Định vị tệp vết</td><td>Thư mục nhật ký trace directory</td><td>Tệp vết chứa định danh phiên làm việc và mã lỗi</td></tr>
        <tr><td>2. Đọc đồ thị chu trình</td><td>Biểu đồ Deadlock Graph</td><td>Xác định chính xác hai câu lệnh SQL và vị trí dòng bị khoá trong bảng</td></tr>
      </table>
      <p>Vì sao không chọn A, C, D: A sai vì bế tắc là vòng chờ nhau, chờ lâu hơn không gỡ được vòng; Oracle tự chọn một phiên làm nạn nhân và huỷ câu lệnh của nó. C sai vì thêm chỉ mục không đổi thứ tự khoá, lại làm mỗi lần ghi chậm hơn. D sai vì nhật ký ứng dụng chỉ có mã lỗi, không có biểu đồ tranh chấp.</p>
    focus:
    - 0
    - 0
    - 0
    - 4
    say: Đáp án chính xác là phương án B. Khi xảy ra bế tắc khoá, hệ quản trị tự động sinh một tệp vết ghi lại toàn bộ biểu đồ tranh chấp. Kỹ sư cấp cao sẽ đọc tệp này để tìm chính xác hai câu lệnh xung đột. Chờ lâu hơn không gỡ được vòng chờ, thêm chỉ mục không đổi thứ tự khoá, còn nhật ký ứng dụng chỉ có mã lỗi.
    clear: true
  - show: |-
      <p><b>Bước 2 — Hành động khắc phục gốc rễ</b>:</p>
      <div class="box key">Sau khi xác định hai câu lệnh gây xung đột, kỹ sư chuẩn hóa thứ tự khoá tài khoản và bổ sung chỉ mục khoá ngoại, rồi kiểm chứng bằng kiểm thử đồng thời và theo dõi tần suất lỗi, không khẳng định "hết 100%" khi chưa có số đo.</div>
    focus:
    - 0
    - 0
    say: Bước hai, sau khi đã làm rõ nguyên nhân gốc rễ, kỹ sư tiến hành chuẩn hóa trật tự khoá tài nguyên và bổ sung chỉ mục cần thiết. Sau đó ta kiểm chứng bằng kiểm thử đồng thời và theo dõi tần suất lỗi, thay vì khẳng định sự cố đã biến mất hoàn toàn.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: trả lời một câu phỏng vấn có số về xử lý lô lương và thời gian giữ khoá'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi: &laquo;Lô lương có <b>24 000</b> dòng, xử lý theo lô <b>2 000</b> dòng; mỗi dòng (hoặc mỗi lô) tốn 2 lần đổi ngữ cảnh. Đối tác trả lời mất <b>15 mili giây</b>; cam kết hai pha giữ khoá qua 2 vòng hỏi đáp, còn giao dịch cục bộ của SAGA giữ khoá <b>3 mili giây</b>. Bạn tính số lô, số lần đổi ngữ cảnh và trần thông lượng của một dòng nóng thế nào?&raquo;</p>
      <p>Viết sáu dòng theo mẫu trong <code>de.md</code>: số lô; đổi ngữ cảnh từng dòng; đổi ngữ cảnh theo lô; thời gian giữ khoá của cam kết hai pha; trần của cam kết hai pha; trần của SAGA (lấy phần nguyên).</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Lô lương hai mươi bốn nghìn dòng, xử lý theo lô hai nghìn dòng, hãy tính số lô và số lần đổi ngữ cảnh khi làm từng dòng so với theo lô. Rồi với đối tác trả lời mười lăm mili giây, tính thời gian giữ khoá của cam kết hai pha và trần thông lượng của một dòng nóng, so với SAGA giữ khoá ba mili giây. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>so lo: 12</div><div>doi ngu canh tung dong: 48000</div><div>doi ngu canh theo lo: 24</div><div>giu khoa 2PC: 30 ms</div><div>toi da 2PC tren mot dong nong: 33 giao dich/giay</div><div>toi da SAGA tren mot dong nong: 333 giao dich/giay</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L03/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> số lô = số dòng chia cỡ lô. Đổi ngữ cảnh = số đơn vị × 2. Cam kết hai pha giữ khoá = 2 × thời gian trả lời của đối tác. Trần thông lượng của một dòng = 1 chia cho thời gian giữ khoá (đổi ra giây).
      Lời giải đầy đủ ở <code>labs/INT/L03/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, số lô bằng số dòng chia cỡ lô, và số lần đổi ngữ cảnh bằng số đơn vị nhân hai. Cam kết hai pha giữ khoá bằng hai lần thời gian trả lời của đối tác, còn trần thông lượng của một dòng bằng một chia cho thời gian giữ khoá tính bằng giây.
  lab: labs/INT/L03
- id: recap
  kind: recap
  title: Tổng kết chuỗi logic Hệ thống Phân tán và Oracle 19c
  steps:
  - show: |-
      <div class="chain" style="flex-direction:column;align-items:flex-start;gap:4px">
        <span class="n">1. Mô hình SAGA Orchestration quản lý giao dịch bồi hoàn</span>
        <span class="a">↓</span>
        <span class="n">2. Mẫu Transactional Outbox loại bỏ hiểm họa ghi kép</span>
        <span class="a">↓</span>
        <span class="n">3. Kafka acks=all và producer lũy đẳng giảm mất/trùng tin</span>
        <span class="a">↓</span>
        <span class="n">4. Khoá hàng theo thứ tự phòng ngừa ORA-00060</span>
        <span class="a">↓</span>
        <span class="n">5. Phân vùng Bảng và Đánh chỉ mục Khoá ngoại tối ưu I/O</span>
      </div>
