scenes:
- id: hook
  kind: hook
  title: Giới hạn của giao thức cam kết hai pha ở quy mô ngân hàng cao tải
  steps:
  - show: '<p>Khi tích hợp nhiều hệ thống ngân hàng độc lập, giao thức cam kết hai
      pha (2PC) giữ khóa trên các dòng dữ liệu liên quan cho tới khi mọi bên commit,
      nên một đối tác chậm mạng khiến các giao dịch khác phải chờ.</p>

      <div class="box key">Làm sao một ngân hàng như ACB có thể thanh toán hóa đơn
      điện nước qua bên thứ ba, tự động bồi hoàn khi có lỗi mà không làm nghẽn kết
      nối cơ sở dữ liệu?</div>

      <p>Cam kết hai pha: pha 1, bộ điều phối hỏi mọi bên "sẵn sàng chốt chưa?" và
      mỗi bên khóa dữ liệu của mình; pha 2, khi tất cả trả lời "sẵn sàng" mới ra lệnh
      chốt (commit), chỉ một bên từ chối là cả nhóm huỷ.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, trong các hệ thống phân tán quy mô lớn, giao thức cam kết hai pha
      truyền thống bộc lộ nhược điểm chí tử khi một đối tác bị chậm mạng. Ở pha một, bộ điều phối hỏi mọi bên đã sẵn sàng chốt chưa và mỗi bên khóa dữ liệu của mình, rồi ở pha hai mới ra lệnh chốt. Các dòng
      số dư liên quan bị giữ khóa, khiến giao dịch khác phải chờ và ứng dụng cạn kiệt
      kết nối. Hôm
      nay, ta cùng nhau giải mã mô hình điều phối giao dịch phân tán và tối ưu hóa
      cơ sở dữ liệu lõi.
  - show: "<table class=\"t\">\n  <tr><th>vấn đề phân tán</th><th>nguy cơ hệ thống</th><th>giải\
      \ pháp chuẩn Kỹ sư Cấp cao</th></tr>\n  <tr><td>Giao thức cam kết hai pha (2PC)</td><td>Treo\
      \ cứng hàng đợi kết nối khi mạng chậm</td><td>Mô hình SAGA điều phối tập trung\
      \ với máy trạng thái</td></tr>\n  <tr><td>Hiểm họa ghi kép dữ liệu</td><td>Mất\
      \ tính nhất quán giữa cơ sở dữ liệu và Kafka</td><td>Mẫu Transactional Outbox\
      \ kết hợp bắt biến động dữ liệu CDC</td></tr>\n  <tr><td>Bế tắc khóa Oracle\
      \ ngày chi lương</td><td>Xảy ra lỗi ORA-00060 làm treo cổng hạch toán</td><td>Sắp\
      \ xếp thứ tự tài khoản trước khi khóa hàng</td></tr>\n</table>\n<p>Hôm nay,\
      \ ta làm chủ: <b>Mô hình SAGA Orchestration</b>, <b>mẫu Transactional Outbox</b>,\
      \ và <b>thuật toán phòng ngừa bế tắc khóa Oracle 19c</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba giải pháp then chốt cho hệ thống phân tán.
      Ta tìm hiểu cách tổ chức chuỗi giao dịch bù trừ để bảo đảm an toàn dòng tiền.
      Ta nắm vững kỹ thuật truyền biến động dữ liệu qua hộp thư sự kiện. Ta cũng làm
      chủ thuật toán phòng ngừa bế tắc khóa trong cơ sở dữ liệu.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Định lý CAP, Mô hình ACID và Hiểm họa Ghi kép'
  checks:
  - 50000 * 60 == 3000000
  - 1000 // 100 == 10
  - 5 - 1 == 4
  - 2 + 1 == 3
  - 4 + 3 == 5 + 2
  steps:
  - show: "<p><b>Định lý CAP và Sự đánh đổi trong Kiến trúc Ngân hàng</b>:</p>\n<table\
      \ class=\"t\">\n  <tr><th>thuộc tính</th><th>định nghĩa</th><th>chiến lược của\
      \ ngân hàng</th></tr>\n  <tr><td>Tính nhất quán (Consistency)</td><td>Mọi nút\
      \ đều nhìn thấy dữ liệu mới nhất</td><td>Bắt buộc đối với số dư tài khoản tiền\
      \ gửi</td></tr>\n  <tr><td>Tính sẵn sàng (Availability)</td><td>Mọi yêu cầu\
      \ đều nhận phản hồi không lỗi</td><td>Không phải tỉ lệ uptime; với số dư, ưu tiên\
      \ nhất quán khi mạng bị phân vùng</td></tr>\n\
      \  <tr><td>Chịu đựng phân vùng (Partition)</td><td>Hệ thống vẫn chạy khi mạng\
      \ bị đứt đoạn</td><td>Bắt buộc trong mạng phân tán đám mây</td></tr>\n</table>\n\
      <p>Nút = một máy chủ trong cụm. Phân vùng mạng = mạng giữa các máy bị đứt, cụm\
      \ tách thành nhóm không liên lạc được. Khi đó hệ thống phải chọn: nhất quán\
      \ (từ chối phục vụ) hay sẵn sàng (trả lời bằng dữ liệu có thể cũ).</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu định lý CAP, một định lý cơ bản của hệ thống phân tán. Khi mạng giữa các máy chủ bị đứt, hệ thống phải chọn giữa nhất quán, tức từ chối phục vụ, và sẵn sàng, tức trả lời bằng dữ liệu có thể đã cũ.
      Trong môi trường tài chính, với số dư sổ cái ta chọn nhất quán.
      Ngân hàng không thể chấp nhận việc dữ liệu bị sai lệch khi có sự cố phân vùng
      mạng.
  - show: |-
      <p><b>ACID: bốn tính chất của một giao dịch cơ sở dữ liệu</b></p>
      <table class="t">
        <tr><th>tính chất</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>A, nguyên tử (Atomicity)</td><td>Làm hết hoặc không làm gì</td></tr>
        <tr><td>C, nhất quán (Consistency)</td><td>Sau giao dịch, dữ liệu vẫn đúng quy tắc, ví dụ tổng tiền không đổi khi chuyển nội bộ</td></tr>
        <tr><td>I, cô lập (Isolation)</td><td>Giao dịch chạy song song không thấy dữ liệu làm dở của nhau</td></tr>
        <tr><td>D, bền vững (Durability)</td><td>Đã chốt thì mất điện vẫn còn</td></tr>
      </table>
      <p>Ví dụ: chuyển 1 triệu từ A (5 triệu) sang B (2 triệu). Xong: A = 5 − 1 = 4, B = 2 + 1 = 3, tổng 4 + 3 = 7 = 5 + 2. Nếu máy chết sau khi trừ A mà chưa cộng B, tính nguyên tử buộc hoàn tác: A trở lại 5.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Tiếp theo là bốn tính chất của một giao dịch cơ sở dữ liệu, gồm nguyên tử, nhất quán, cô lập và bền vững. Ví dụ, chuyển 1 triệu từ tài khoản A có 5 triệu sang tài khoản B có 2 triệu.
      Khi xong, A còn 4 triệu, B có 3 triệu, tổng vẫn là 7 triệu như trước, đó là tính nhất quán.
      Nếu máy chết sau khi trừ A mà chưa cộng B, tính nguyên tử buộc hoàn tác để A trở lại 5 triệu.
    clear: true
  - show: '<div class="box key">Hiểm họa ghi kép: Nếu dịch vụ vừa ghi cơ sở dữ liệu
      vừa phát bản tin vào Kafka (hệ thống chuyển sự kiện giữa các dịch vụ) mà không
      nằm trong cùng một giao dịch, việc một trong hai bước thất bại sẽ làm hỏng tính
      toàn vẹn dữ liệu. Cách phổ biến là mẫu hộp thư sự kiện Transactional Outbox.</div>

      <p>Ví dụ: ghi "đã trừ tiền" vào cơ sở dữ liệu xong thì mất mạng, sự kiện không
      tới Kafka, dịch vụ khác không biết tiền đã trừ. Ngược lại, gửi sự kiện xong mà
      giao dịch cơ sở dữ liệu bị huỷ thì các bên nhận được tin về một việc không xảy ra.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hiểm họa ghi kép xảy ra khi dịch vụ vừa ghi cơ sở dữ liệu vừa gửi thông điệp
      ra ngoài qua Kafka, là hệ thống chuyển sự kiện giữa các dịch vụ. Nếu ghi xong mà bước gửi mạng bị lỗi, dịch vụ khác không biết tiền đã bị trừ.
      Ngược lại, nếu gửi xong mà giao dịch cơ sở dữ liệu bị huỷ, các bên nhận tin về một việc không hề xảy ra.
      Cách phổ biến để giải quyết là mẫu hộp thư sự kiện dùng chung giao dịch.
    clear: true
- id: concept
  kind: concept
  title: Mô hình SAGA Điều phối Tập trung và Mẫu Transactional Outbox
  steps:
  - show: "<p><b>Luồng Điều phối SAGA Orchestration trong Thanh toán Hóa đơn</b>:</p>\n\
      <svg viewBox=\"0 0 700 220\" style=\"width:100%;max-height:300px;\">\n  <rect\
      \ x=\"250\" y=\"10\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#e8f4fd\" stroke=\"\
      #003366\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"45\" font-size=\"13\"\
      \ font-weight=\"bold\" fill=\"#003366\">SAGA Điều phối Tập trung</text>\n  <rect\
      \ x=\"30\" y=\"130\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#d4edda\" stroke=\"\
      #28a745\"/>\n  <text x=\"40\" y=\"155\" font-size=\"11\" font-weight=\"bold\"\
      \ fill=\"#155724\">Bước 1: Trích nợ CASA</text>\n  <text x=\"40\" y=\"175\"\
      \ font-size=\"10\" fill=\"#155724\">Bồi hoàn: Hoàn tiền CASA</text>\n  <rect x=\"\
      270\" y=\"130\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#fff3cd\" stroke=\"\
      #ffc107\"/>\n  <text x=\"280\" y=\"155\" font-size=\"11\" font-weight=\"bold\"\
      \ fill=\"#856404\">Bước 2: Gạch nợ đối tác</text>\n  <text x=\"280\" y=\"175\"\
      \ font-size=\"10\" fill=\"#856404\">Đối tác từ chối rõ ràng</text>\n  <rect x=\"\
      510\" y=\"130\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#d1ecf1\" stroke=\"\
      #17a2b8\"/>\n  <text x=\"520\" y=\"155\" font-size=\"11\" font-weight=\"bold\"\
      \ fill=\"#0c5460\">Bước 3: Gửi thông báo</text>\n  <text x=\"520\" y=\"175\"\
      \ font-size=\"10\" fill=\"#0c5460\">Tin nhắn ứng dụng</text>\n  <path d=\"M\
      \ 310 70 L 110 130\" stroke=\"#28a745\" stroke-width=\"2\"/>\n  <path d=\"M\
      \ 350 70 L 350 130\" stroke=\"#ffc107\" stroke-width=\"2\"/>\n  <path d=\"M\
      \ 390 70 L 590 130\" stroke=\"#17a2b8\" stroke-width=\"2\"/>\n</svg>\n<p>SAGA\
      \ = chuỗi giao dịch nhỏ, mỗi bước có sẵn một bước bù trừ (làm ngược lại). CASA\
      \ = tài khoản thanh toán của khách. Gạch nợ = báo bên bán (ví dụ công ty điện)\
      \ rằng hoá đơn đã trả. Máy trạng thái = bản ghi cho biết giao dịch đang ở bước nào (ví dụ\
      \ ĐÃ_TRỪ_TIỀN, ĐANG_GẠCH_NỢ, ĐÃ_HOÀN_TIỀN) và được chuyển sang bước nào tiếp. Hết giờ chờ\
      \ không phải là bị từ chối: hỏi lại trạng thái trước khi bồi hoàn.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: SAGA là chuỗi giao dịch nhỏ, mỗi bước có sẵn một bước bù trừ làm ngược lại, còn gạch nợ là báo cho bên bán rằng hoá đơn đã được trả. Nhìn vào sơ đồ điều phối tập trung, bộ điều phối ghi lại giao dịch đang ở bước nào và quản lý chuỗi các bước cục
      bộ độc lập. Khi đối tác bên ngoài từ chối rõ ràng, bộ điều phối sẽ tự động kích
      hoạt luồng bồi hoàn ngược lại để hoàn trả tiền cho khách hàng một cách an toàn.
      Nếu đối tác chỉ im lặng quá hạn thì kết quả là chưa biết, nên bộ điều phối hỏi lại trạng thái trước rồi mới bồi hoàn.
    clear: true
  - show: '<div class="box key">Kiến trúc Hộp thư sự kiện Transactional Outbox: Dữ
      liệu nghiệp vụ và sự kiện được ghi chung vào bảng outbox trong cùng một transaction.
      Sau đó, công cụ CDC (bắt thay đổi dữ liệu, ví dụ Debezium) đọc nhật ký giao dịch
      của cơ sở dữ liệu (WAL / redo log) để đẩy vào Kafka. Giao nhận là ít nhất một
      lần (at-least-once), nên consumer (bên nhận) phải idempotent, tức nhận trùng
      vẫn chỉ xử lý một lần.</div>

      <p>Vì sao hết ghi kép? Dữ liệu và sự kiện cùng thành công hoặc cùng bị huỷ trong
      một giao dịch; việc gửi ra Kafka làm sau và được thử lại cho tới khi xong.</p>'
    focus:
    - 0
    - 0
    - 0
    say: Với mẫu hộp thư sự kiện, ứng dụng ghi thông tin nghiệp vụ và bản tin sự kiện
      vào cùng một giao dịch cơ sở dữ liệu, nên hai thứ cùng thành công hoặc cùng bị huỷ. Công cụ bắt biến động dữ liệu, ví dụ Debezium, đọc nhật ký giao
      dịch của cơ sở dữ liệu để phát bản tin, và thử lại cho tới khi gửi xong. Vì giao nhận ít nhất một lần nên bên nhận
      phải chịu được bản tin trùng, tức nhận trùng vẫn chỉ xử lý một lần.
    clear: true
- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Cơ chế Zero-Copy trong Apache Kafka
  checks:
  - 600000 // 60 == 10000
  - 60 - 60 == 0
  - 3 - 2 == 1
  steps:
  - show: '<p><b>Cấu hình đảm bảo Không mất tin nhắn trong Apache Kafka</b>:</p>

      <div class="box key">

      $$\text{Xác nhận toàn bộ bản sao: } \text{acks} = \text{all}$$

      $$\text{Topic: } \text{min.insync.replicas} = 2,\ \text{replication.factor} = 3$$

      $$\text{Khử trùng lặp phát tin: } \text{enable.idempotence} = \text{true}$$

      </div>

      <p>Khi bật chế độ phát tin lũy đẳng, mỗi producer có một định danh kèm số thứ
      tự theo từng partition; broker bỏ bản ghi trùng do producer tự retry trong cùng
      phiên (không chặn được việc ứng dụng tự gửi lại).</p>'
    focus:
    - 0
    - 0
    say: Theo cấu hình phổ biến, ta yêu cầu xác nhận từ mọi bản sao đồng bộ, và đặt
      ở mức chủ đề tối thiểu hai bản sao đồng bộ. Khi bật chế độ phát tin lũy đẳng,
      máy chủ nhận biết số thứ tự để loại bỏ bản tin trùng do chính nhà sản xuất gửi
      lại khi lỗi mạng.
  - show: |-
      <p><b>Giải nghĩa các từ của Kafka</b>:</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>producer / broker</td><td>chương trình gửi tin / máy chủ Kafka lưu tin</td></tr>
        <tr><td>topic / partition</td><td>kênh chứa tin cùng loại / một phần của kênh, mỗi phần giữ tin theo thứ tự</td></tr>
        <tr><td>replica, in-sync replica</td><td>bản sao của một partition trên broker khác; bản sao "đồng bộ" là bản đang theo kịp</td></tr>
        <tr><td>acks=all</td><td>producer chỉ coi là gửi xong khi mọi bản sao đồng bộ đã ghi</td></tr>
      </table>
      <p>Ví dụ: 3 bản sao (replication.factor), tối thiểu 2 bản đồng bộ: hỏng $3 - 2 = 1$ broker vẫn ghi được; hỏng 2 broker thì Kafka từ chối ghi, thay vì nhận tin chỉ còn một bản dễ mất.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Để hiểu cấu hình trên, ta giải nghĩa vài từ, nhà sản xuất là chương trình gửi tin, còn Broker là máy chủ Kafka lưu tin.
      Mỗi kênh tin được chia thành nhiều phần, và mỗi phần có bản sao trên các máy chủ khác nhau.
      Với ba bản sao và tối thiểu hai bản đồng bộ, hỏng 3 trừ 2 bằng 1 máy chủ thì vẫn ghi được.
      Nếu hỏng hai máy chủ, Kafka từ chối ghi, thay vì nhận tin chỉ còn một bản dễ mất.
    clear: true
  - show: '<p><b>Cơ chế Zero-Copy truyền dữ liệu siêu tốc ra mạng</b>:</p>

      <pre><code>// Lệnh truyền trực tiếp từ bộ nhớ đệm hệ điều hành ra cổng mạng

      sendfile(socket_fd, file_fd, offset, count);


      // Bỏ qua hoàn toàn việc sao chép qua vùng nhớ ứng dụng JVM

      Disk File -> OS Page Cache -> Network Socket Buffer -> Network Card


      // Lưu ý: bật TLS client-broker thì không còn zero-copy</code></pre>'
    focus:
    - 0
    - 0
    say: Để tăng thông lượng, hệ thống sử dụng lệnh truyền trực tiếp của nhân hệ điều
      hành. Dữ liệu từ vùng đệm tập tin được đẩy thẳng ra cổng mạng mà không sao chép
      qua bộ nhớ ứng dụng Java, nhưng lợi ích này mất đi khi bật mã hóa đường truyền.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Phòng ngừa Bế tắc Khóa Oracle ORA-00060 Ngày Chi lương'
  checks:
  - 150000000000 // 10000 == 15000000
  - 19 > 11
  - 10000 // 1000 == 10
  - 10000 * 2 == 20000
  - 10000 // 1000 * 2 == 20
  steps:
  - show: "<p><b>Dữ liệu bài toán giả định (minh họa): chi lương một tập đoàn lớn</b>:</p>\n<ul>\n\
      \  <li>Quy mô lô lệnh: $10\\,000$ nhân viên nhận tổng số tiền $150$ tỉ đồng.</li>\n\
      \  <li>Hiện tượng lỗi: Xuất hiện liên tục mã lỗi bế tắc khóa Oracle ORA-00060\
      \ vào giờ cao điểm.</li>\n  <li>Nguyên nhân: Hai tiến trình chuyển tiền đồng\
      \ thời khóa tài khoản theo thứ tự đảo ngược nhau.</li>\n</ul>\n<p>Bế tắc (deadlock)\
      \ = hai phiên làm việc, mỗi phiên giữ một khóa và chờ khóa phiên kia đang giữ,\
      \ nên không ai đi tiếp được. ORA-00060 là mã lỗi Oracle báo đã phát hiện bế tắc.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định, chi lương cho mười nghìn nhân viên với tổng ngân sách
      một trăm năm mươi tỉ đồng. Vào giờ cao điểm, cơ sở dữ liệu liên tục báo lỗi
      bế tắc khóa do hai luồng đồng thời tranh chấp tài nguyên theo thứ tự ngược chiều.
      Bế tắc là khi mỗi phiên giữ một khóa và chờ khóa mà phiên kia đang giữ, và mã lỗi ORA-00060 là cách Oracle báo đã phát hiện điều đó.
  - show: '<p><b>Bước 1: Phân tích tệp nhật ký vết bế tắc khóa (.trc) của Oracle</b>:</p>

      <div class="box pit">Tiến trình A giữ khóa tài khoản X và chờ tài khoản Y. Trong
      khi đó tiến trình B đang giữ khóa tài khoản Y và chờ tài khoản X. Hai tiến trình
      chờ nhau vô hạn tạo thành chu trình bế tắc khóa!</div>'
    focus:
    - 0
    - 0
    say: Bước một, khi phân tích tệp vết của cơ sở dữ liệu, ta thấy tiến trình thứ
      nhất giữ tài khoản này và chờ tài khoản kia. Ngược lại, tiến trình thứ hai lại
      giữ tài khoản kia và chờ tài khoản này, tạo thành vòng tròn chờ đợi bế tắc.
    clear: true
  - show: "<p><b>Bước 2: Áp dụng Thuật toán Khóa hàng có Thứ tự Xác định</b>:</p>\n\
      <pre><code>-- Sắp tăng dần rồi khóa TỪNG dòng bằng câu lệnh riêng\nv_first\
      \  := LEAST(acc_from, acc_to);\nv_second := GREATEST(acc_from, acc_to);\nSELECT\
      \ balance INTO v_b1 FROM accounts WHERE account_no = v_first  FOR UPDATE;\nSELECT\
      \ balance INTO v_b2 FROM accounts WHERE account_no = v_second FOR UPDATE;</code></pre>\n\
      <p><code>SELECT … FOR UPDATE</code> = đọc dòng và khóa nó tới khi giao dịch kết thúc. Đây là đoạn trích thân thủ tục PL/SQL; các biến khai báo ở phần DECLARE.</p>\n\
      <div class=\"box key\">Không dựa vào <code>ORDER BY ... FOR UPDATE</code>: Oracle\
      \ không bảo đảm khóa dòng theo thứ tự ORDER BY. Khi mọi luồng code khóa nhỏ trước,\
      \ lớn sau, giữa các luồng đó không hình thành chu trình chờ; ORA-00060 vẫn có\
      \ thể đến từ luồng khác hoặc FK thiếu index.</div>"
    focus:
    - 0
    - 0
    say: Bước hai, ta sắp xếp hai tài khoản tăng dần rồi khóa từng dòng bằng một câu
      lệnh riêng, tài khoản nhỏ trước, lớn sau. Khi mọi luồng xử lý đều tuân theo
      cùng trật tự này, giữa chúng không thể hình thành chu trình chờ đợi bế tắc.
    clear: true
  - show: "<p><b>Bước 3: Xử lý theo lô với Bulk Collect và Forall</b> (trích thân thủ tục PL/SQL):</p>\n\
      <pre><code>-- 10 000 dòng, mỗi lô 1 000 dòng = 10 lô\n-- cur_payroll lấy dữ liệu ORDER BY acc_no: mọi lô khóa theo cùng thứ tự\nOPEN cur_payroll;\n\
      LOOP\n  FETCH cur_payroll BULK COLLECT INTO l_accounts LIMIT 1000;\n  EXIT\
      \ WHEN l_accounts.COUNT = 0;\n  FORALL i IN 1..l_accounts.COUNT\n    UPDATE\
      \ accounts SET balance = balance + l_accounts(i).amount\n    WHERE account_no\
      \ = l_accounts(i).acc_no;\nEND LOOP;\nCLOSE cur_payroll;</code></pre>"
    focus:
    - 0
    - 0
    say: Bước ba, kỹ sư viết bằng PL/SQL, ngôn ngữ lập trình chạy bên trong Oracle, lấy dữ liệu theo từng lô một nghìn dòng trong một vòng lặp
      và cập nhật đồng loạt từng lô. Con trỏ lấy dữ liệu theo số tài khoản tăng dần, nên mọi lô đều khóa theo cùng một thứ tự.
    clear: true
  - show: "<p><b>Vì sao xử lý theo lô nhanh hơn?</b></p>\n<ul>\n  <li>PL/SQL = ngôn\
      \ ngữ lập trình chạy bên trong Oracle; câu lệnh SQL chạy ở một bộ máy khác.</li>\n\
      \  <li>BULK COLLECT lấy nhiều dòng một lần vào mảng; FORALL gửi một lệnh UPDATE\
      \ cho cả mảng.</li>\n  <li>Mỗi lần PL/SQL chuyển việc sang bộ máy SQL là một\
      \ lần đổi ngữ cảnh.</li>\n  <li>Từng dòng: khoảng 10 000 × 2 = 20 000 lần (một lần\
      \ lấy, một lần cập nhật mỗi dòng). Theo lô: khoảng 10 × 2 = 20 lần.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Vì sao xử lý theo lô nhanh hơn, vì câu lệnh cơ sở dữ liệu chạy ở một bộ máy khác với ngôn ngữ PL/SQL. Mỗi lần chuyển việc sang bộ máy đó là một lần đổi ngữ cảnh, nên làm từng dòng tốn khoảng 20000 lần, còn làm theo lô chỉ khoảng 20 lần.
      Thời gian thực tế vẫn phải đo trên dữ liệu thật.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: So sánh Mô hình SAGA Tự phối hợp và Điều phối'
  checks:
  - 100 > 10
  - 60 * 1000 == 60000
  steps:
  - show: "<p><b>Tình huống phỏng vấn Senior</b>: Trong luồng thanh toán hóa đơn gồm\
      \ 8 dịch vụ tham gia, tại sao ngân hàng nên chọn mô hình SAGA Điều phối tập\
      \ trung thay vì mô hình Tự phối hợp qua sự kiện?</p>\n<ul>\n  <li>(A) Mô hình\
      \ điều phối tập trung dễ triển khai hơn và không cần cơ sở dữ liệu.</li>\n \
      \ <li>(B) Mô hình tự phối hợp dễ rơi vào bẫy vòng lặp sự kiện và rất khó truy\
      \ vết khi có lỗi, trong khi điều phối tập trung quản lý máy trạng thái rõ ràng\
      \ và kiểm soát bù trừ chuẩn xác.</li>\n  <li>(C) Mô hình tự phối hợp có độ bảo\
      \ mật cao hơn.</li>\n</ul>\n<p>Tự phối hợp (choreography) = không có bộ điều\
      \ phối; mỗi dịch vụ tự nghe sự kiện của dịch vụ khác rồi làm phần mình. Điều\
      \ phối tập trung (orchestration) = một dịch vụ điều phối ra lệnh từng bước.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi lựa chọn kiến trúc giao dịch phân tán. Tự phối hợp nghĩa là không có bộ điều phối, mỗi dịch vụ tự nghe sự kiện của dịch vụ khác rồi làm phần mình. Với quy trình
      phức tạp gồm tám bước tham gia, vì sao mô hình điều phối tập trung thường được ưu tiên.
  - show: '<p><b>Đáp án chính xác: Lựa chọn (B)</b></p>

      <div class="box key">Giải thích vì: Khi quy trình có nhiều bước, mô hình tự
      phối hợp khiến đồ thị sự kiện trở nên rối và khó kiểm soát trạng thái bồi hoàn.
      Mô hình điều phối tập trung lưu vết máy trạng thái vào cơ sở dữ liệu và kích
      hoạt các giao dịch bù trừ theo thứ tự ngược; mỗi bước bù trừ phải lũy đẳng
      để chạy lại an toàn.</div>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì khi quy trình có nhiều bước, việc để các
      dịch vụ tự lắng nghe nhau sẽ gây hỗn loạn đồ thị sự kiện. Do đó máy điều phối
      tập trung giúp lưu vết trạng thái và kích hoạt bù trừ chuẩn xác.
    clear: true
