  - show: |-
      <div class="box key">Kiến trúc Hộp thư sự kiện Transactional Outbox: Dữ liệu nghiệp vụ và sự kiện được ghi chung vào bảng outbox trong cùng một transaction. Sau đó, công cụ CDC (bắt thay đổi dữ liệu, ví dụ Debezium, một công cụ mã nguồn mở) đọc nhật ký giao dịch của cơ sở dữ liệu (WAL / redo log: cuốn sổ ghi mọi thay đổi theo thứ tự, cơ sở dữ liệu dùng để khôi phục khi sự cố) để đẩy vào Kafka. Giao nhận là ít nhất một lần (at-least-once), nên consumer (bên nhận) phải idempotent, tức nhận trùng vẫn chỉ xử lý một lần.</div>
      <p>Vì sao hết ghi kép? Dữ liệu và sự kiện cùng thành công hoặc cùng bị huỷ trong một giao dịch; việc gửi ra Kafka làm sau và được thử lại cho tới khi xong.</p>
    focus:
    - 1
    say: Với mẫu hộp thư sự kiện, ứng dụng ghi thông tin nghiệp vụ và bản tin sự kiện vào cùng một giao dịch cơ sở dữ liệu, nên hai thứ cùng thành công hoặc cùng bị huỷ.
