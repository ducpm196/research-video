  kind: quiz
  title: 'Trắc nghiệm: Điều tra Nguyên nhân Bế tắc Khóa Oracle'
  checks:
  - 100 - 90 == 10
  - 19 * 10 == 190
  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm thực chiến</b>: Khi nhật ký ứng dụng báo lỗi\
      \ ORA-00060, công cụ nào sau đây cho phép Kỹ sư Cấp cao xác định chính xác câu\
