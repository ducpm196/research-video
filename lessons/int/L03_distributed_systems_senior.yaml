    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án B. Khi xảy ra bế tắc khóa, hệ quản trị tự động
      sinh một tệp vết ghi lại toàn bộ biểu đồ tranh chấp. Kỹ sư cấp cao sẽ đọc tệp
      này để tìm chính xác hai câu lệnh xung đột.
