scenes:
- id: hook
  kind: hook
  title: Giới hạn của giao thức cam kết hai pha ở quy mô ngân hàng cao tải
  steps:
  - show: |-
      <p>Khi tích hợp nhiều hệ thống ngân hàng độc lập, giao thức cam kết hai pha (2PC) giữ khoá trên các dòng dữ liệu liên quan cho tới khi mọi bên chốt (commit), nên một đối tác chậm mạng khiến các giao dịch khác phải chờ.</p>
      <div class="box key">Làm sao một ngân hàng như ACB có thể thanh toán hóa đơn điện nước qua bên thứ ba, tự động bồi hoàn khi có lỗi mà không làm nghẽn kết nối cơ sở dữ liệu?</div>
      <p>Cam kết hai pha: pha 1, bộ điều phối hỏi mọi bên "sẵn sàng chốt chưa?" và mỗi bên khoá dữ liệu của mình; pha 2, khi tất cả trả lời "sẵn sàng" mới ra lệnh chốt (commit), chỉ một bên từ chối là cả nhóm huỷ.</p>
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, trong hệ thống phân tán quy mô lớn, giao thức cam kết hai pha bộc lộ nhược điểm khi một đối tác bị chậm mạng. Ở pha một, bộ điều phối hỏi mọi bên đã sẵn sàng chốt chưa và mỗi bên khoá dữ liệu của mình, rồi ở pha hai mới ra lệnh chốt. Các dòng số dư bị giữ khoá nên giao dịch khác phải chờ.
  - show: |-
      <table class="t">
        <tr><th>vấn đề phân tán</th><th>nguy cơ hệ thống</th><th>giải pháp chuẩn Kỹ sư Cấp cao</th></tr>
        <tr><td>Giao thức cam kết hai pha (2PC)</td><td>Treo cứng hàng đợi kết nối khi mạng chậm</td><td>Mô hình SAGA điều phối tập trung với máy trạng thái</td></tr>
        <tr><td>Hiểm họa ghi kép dữ liệu</td><td>Mất tính nhất quán giữa cơ sở dữ liệu và Kafka</td><td>Mẫu Transactional Outbox kết hợp bắt biến động dữ liệu CDC</td></tr>
        <tr><td>Bế tắc khoá Oracle ngày chi lương</td><td>Xảy ra lỗi ORA-00060 làm treo cổng hạch toán</td><td>Sắp xếp thứ tự tài khoản trước khi khoá hàng</td></tr>
      </table>
      <p>Hôm nay, ta làm chủ: <b>Mô hình SAGA Orchestration</b>, <b>mẫu Transactional Outbox</b>, và <b>thuật toán phòng ngừa bế tắc khoá Oracle 19c</b>.</p>
      <p><i>Hạch toán</i> = ghi một giao dịch vào sổ kế toán của ngân hàng; <i>trích nợ</i> = trừ tiền khỏi tài khoản; <i>Kafka</i> = hệ thống chuyển sự kiện giữa các dịch vụ; <i>Oracle</i> = phần mềm cơ sở dữ liệu thương mại hay gặp ở ngân hàng.</p>
    focus:
    - 0
    - 0
    - 0
    say: Ta tìm hiểu cách tổ chức chuỗi giao dịch bù trừ để bảo đảm an toàn dòng tiền. Ta nắm vững kỹ thuật truyền biến động dữ liệu qua hộp thư sự kiện. Ta cũng làm chủ thuật toán phòng ngừa bế tắc khoá trong cơ sở dữ liệu.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Định lý CAP, Mô hình ACID và Hiểm họa Ghi kép'
  checks:
  - 1000 // 100 == 10
  - 5 - 1 == 4
  - 2 + 1 == 3
  - 4 + 3 == 5 + 2
  steps:
  - show: |-
      <p><b>Định lý CAP và Sự đánh đổi trong Kiến trúc Ngân hàng</b>:</p>
      <table class="t">
        <tr><th>thuộc tính</th><th>định nghĩa</th><th>chiến lược của ngân hàng</th></tr>
        <tr><td>Tính nhất quán (Consistency)</td><td>Mọi nút đều nhìn thấy dữ liệu mới nhất</td><td>Bắt buộc đối với số dư tài khoản tiền gửi</td></tr>
        <tr><td>Tính sẵn sàng (Availability)</td><td>Mọi yêu cầu đều nhận phản hồi không lỗi</td><td>Không phải tỉ lệ uptime (phần trăm thời gian máy chạy); với số dư, ưu tiên nhất quán khi mạng bị phân vùng</td></tr>
        <tr><td>Chịu đựng phân vùng (Partition)</td><td>Hệ thống vẫn chạy khi mạng bị đứt đoạn</td><td>Bắt buộc trong mạng phân tán đám mây (đám mây = máy chủ thuê qua Internet thay vì tự đặt phòng máy)</td></tr>
      </table>
      <p>Nút = một máy chủ trong cụm. Phân vùng mạng = mạng giữa các máy bị đứt, cụm tách thành nhóm không liên lạc được. Khi đó hệ thống phải chọn: nhất quán (từ chối phục vụ) hay sẵn sàng (trả lời bằng dữ liệu có thể cũ).</p>
    focus:
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu định lý CAP của hệ thống phân tán. Khi mạng giữa các máy chủ bị đứt, hệ thống phải chọn giữa nhất quán, tức từ chối phục vụ, và sẵn sàng, tức trả lời bằng dữ liệu có thể đã cũ. Với số dư sổ cái ta chọn nhất quán, vì ngân hàng không chấp nhận dữ liệu sai lệch.
  - show: |-
      <p><b>ACID: bốn tính chất của một giao dịch cơ sở dữ liệu</b></p>
      <table class="t">
        <tr><th>tính chất</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>A, nguyên tử (Atomicity)</td><td>Làm hết hoặc không làm gì</td></tr>
        <tr><td>C, nhất quán (Consistency)</td><td>Sau giao dịch, dữ liệu vẫn đúng quy tắc, ví dụ tổng tiền không đổi khi chuyển nội bộ</td></tr>
        <tr><td>I, cô lập (Isolation)</td><td>Giao dịch chạy song song không thấy dữ liệu làm dở của nhau</td></tr>
        <tr><td>D, bền vững (Durability)</td><td>Đã chốt thì mất điện vẫn còn</td></tr>
      </table>
      <p>Ví dụ: chuyển 1 triệu từ A (5 triệu) sang B (2 triệu). Xong: A = 5 − 1 = 4, B = 2 + 1 = 3, tổng 4 + 3 = 7 = 5 + 2. Nếu máy chết sau khi trừ A mà chưa cộng B, tính nguyên tử buộc hoàn tác: A trở lại 5.</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Tiếp theo là bốn tính chất của một giao dịch cơ sở dữ liệu, gồm nguyên tử, nhất quán, cô lập và bền vững. Ví dụ, chuyển 1 triệu từ tài khoản A có 5 triệu sang tài khoản B có 2 triệu. Khi xong, A còn 4 triệu, B có 3 triệu, tổng vẫn là 7 triệu như trước, đó là tính nhất quán. Nếu máy chết sau khi trừ A mà chưa cộng B, tính nguyên tử buộc hoàn tác để A trở lại 5 triệu.
