- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Cơ chế Zero-Copy trong Apache Kafka
  checks:
  - 600000 // 60 == 10000
  - 60 - 60 == 0
  - 3 - 2 == 1
  steps:
  - show: |-
      <p><b>Giải nghĩa các từ của Kafka</b> (trước khi xem cấu hình):</p>
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>producer / broker</td><td>chương trình gửi tin / máy chủ Kafka lưu tin</td></tr>
        <tr><td>topic / partition</td><td>kênh chứa tin cùng loại / một phần của kênh, mỗi phần giữ tin theo thứ tự</td></tr>
        <tr><td>replica, in-sync replica</td><td>bản sao của một partition trên broker khác; bản sao "đồng bộ" là bản đang theo kịp</td></tr>
        <tr><td>acks=all</td><td>producer chỉ coi là gửi xong khi mọi bản sao đồng bộ đã ghi</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    clear: true
    say: Trước khi xem cấu hình, ta giải nghĩa vài từ. Nhà sản xuất là chương trình gửi tin, còn Broker là máy chủ Kafka lưu tin. Mỗi kênh tin chia thành nhiều phần, và mỗi phần có bản sao trên các máy chủ khác nhau.
  - show: |-
      <table class="t">
        <tr><th>từ</th><th>nghĩa bằng lời thường</th></tr>
        <tr><td>replication.factor, min.insync.replicas</td><td>số bản sao của mỗi partition; số bản sao đồng bộ tối thiểu phải có thì Kafka mới nhận ghi</td></tr>
        <tr><td>enable.idempotence</td><td>bật chế độ phát tin lũy đẳng: broker bỏ bản tin trùng do producer tự gửi lại</td></tr>
      </table>
      <p>Ví dụ: 3 bản sao (replication.factor), tối thiểu 2 bản đồng bộ: hỏng $3 - 2 = 1$ broker vẫn ghi được; hỏng 2 broker thì Kafka từ chối ghi, thay vì nhận tin chỉ còn một bản dễ mất.</p>
    focus:
    - 2
    clear: true
    say: Với ba bản sao và tối thiểu hai bản đồng bộ, hỏng 3 trừ 2 bằng 1 máy chủ thì vẫn ghi được, còn hỏng hai máy chủ thì Kafka từ chối ghi.
  - show: |-
      <p><b>Cấu hình đảm bảo Không mất tin nhắn trong Apache Kafka</b>:</p>
      <div class="box key">
      $$\text{Xác nhận toàn bộ bản sao: } \text{acks} = \text{all}$$
      $$\text{Topic: } \text{min.insync.replicas} = 2,\ \text{replication.factor} = 3$$
      $$\text{Khử trùng lặp phát tin: } \text{enable.idempotence} = \text{true}$$
      </div>
      <p>Khi bật chế độ phát tin lũy đẳng, mỗi producer có một định danh kèm số thứ tự theo từng partition; broker bỏ bản ghi trùng do producer tự retry trong cùng phiên (không chặn được việc ứng dụng tự gửi lại).</p>
    focus:
    - 0
    - 0
    clear: true
    say: Theo cấu hình phổ biến, ta yêu cầu xác nhận từ mọi bản sao đồng bộ, và đặt ở mức chủ đề tối thiểu hai bản sao đồng bộ. Khi bật chế độ phát tin lũy đẳng, máy chủ nhận biết số thứ tự để loại bỏ bản tin trùng do chính nhà sản xuất gửi lại khi lỗi mạng.
  - show: |-
      <p><b>Cơ chế Zero-Copy truyền dữ liệu siêu tốc ra mạng</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>sendfile(socket_fd, file_fd, offset, count)</td><td>lệnh của hệ điều hành gửi một đoạn tệp thẳng ra mạng; socket_fd = số hiệu của cổng mạng để gửi; file_fd = số hiệu của tệp nguồn; offset = vị trí bắt đầu; count = số byte cần gửi</td></tr>
        <tr><td>Disk File -&gt; OS Page Cache -&gt; Network Socket Buffer -&gt; Network Card</td><td>đường đi của dữ liệu: tệp trên đĩa, vùng nhớ hệ điều hành giữ bản sao nội dung tệp, hàng chờ gửi của cổng mạng, rồi card mạng</td></tr>
        <tr><td>// ...; TLS client-broker</td><td>từ // tới hết dòng là ghi chú; TLS = mã hoá đường truyền; client-broker = đoạn giữa chương trình khách và máy chủ Kafka</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    say: Để tăng thông lượng, hệ thống sử dụng lệnh truyền trực tiếp của nhân hệ điều hành. Lệnh này nhận bốn đối số, gồm cổng mạng để gửi, tệp nguồn, vị trí bắt đầu và số byte cần gửi.
    clear: true
  - show: |-
      <pre><code>// Lệnh truyền trực tiếp từ bộ nhớ đệm hệ điều hành ra cổng mạng
      sendfile(socket_fd, file_fd, offset, count);

      // Bỏ qua hoàn toàn việc sao chép qua vùng nhớ ứng dụng JVM
      Disk File -> OS Page Cache -> Network Socket Buffer -> Network Card

      // Lưu ý: bật TLS client-broker thì không còn zero-copy</code></pre>
    focus:
    - 0
    say: Dữ liệu đi thẳng từ vùng nhớ hệ điều hành giữ nội dung tệp ra hàng chờ của cổng mạng, không qua bộ nhớ ứng dụng Java, nhưng lợi ích này mất khi bật mã hóa đường truyền.
    clear: true
