    - 0
    say: Tóm lại, chuỗi logic gồm điều phối giao dịch bù trừ, truyền sự kiện qua hộp thư an toàn, phát tin có xác nhận đầy đủ và khoá các dòng dữ liệu theo một thứ tự cố định.
  - show: |-
      <table class="t" style="margin-top: 15px;">
        <tr><th>năng lực phân tán</th><th>giá trị bảo vệ tài sản số ngân hàng ACB</th></tr>
        <tr><td>SAGA & Outbox CDC</td><td>Các hệ thống khớp nhau sau một độ trễ ngắn (nhất quán cuối cùng), tự động bù trừ khi đối tác từ chối</td></tr>
        <tr><td>Kafka acks=all + idempotent</td><td>Không mất tin đã xác nhận khi một broker hỏng nhờ acks=all và tối thiểu 2 bản đồng bộ; phát tin lũy đẳng chỉ khử trùng do producer tự gửi lại</td></tr>
        <tr><td>Tối ưu Oracle 19c</td><td>Xử lý lô theo mẻ, khoá có thứ tự, giảm tranh chấp sổ cái</td></tr>
      </table>
      <p style="margin-top: 15px;"><b>Khẳng định đẳng cấp Senior tại ACB</b>: Làm chủ kiến trúc hệ thống phân tán, tối ưu hóa cơ sở dữ liệu huyết mạch và trả lời được câu hỏi sâu của hội đồng tuyển dụng.</p>
    focus:
    - 0
    say: Mỗi năng lực bảo vệ tài sản số của ngân hàng, từ nhất quán sau một lúc, đến không mất tin đã xác nhận, và giảm tranh chấp trên sổ cái.
    clear: true
