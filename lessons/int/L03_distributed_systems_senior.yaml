      \ vết nhật ký trace file có đuôi chấm trc trong thư mục trace (ADR) của Oracle\
      \ để đọc biểu đồ chu trình bế tắc khóa.</li>\n  <li><b>C</b>: Xóa bỏ toàn bộ\
      \ các chỉ mục trên bảng giao dịch.</li>\n  <li><b>D</b>: Chuyển toàn bộ cơ sở\
      \ dữ liệu sang bảng nhớ tạm.</li>\n</ul>"
    focus:
    - 0
    - 0
    say: Xin mời bạn chọn phương án xử lý sự cố chuẩn mực khi hệ thống gặp lỗi bế
      tắc khóa. Bạn có 15 giây suy nghĩ trước khi nghe phân tích quy trình điều tra
