- id: concept
  kind: concept
  title: Mô hình SAGA Điều phối Tập trung và Mẫu Transactional Outbox
  steps:
  - show: |-
      <p><b>Giải nghĩa các từ của SAGA</b>:</p>
      <ul>
        <li><b>SAGA</b> = chuỗi giao dịch nhỏ, mỗi bước có sẵn một bước bù trừ (làm ngược lại).</li>
        <li><b>CASA</b> = tài khoản thanh toán của khách.</li>
        <li><b>Gạch nợ</b> = báo bên bán (ví dụ công ty điện) rằng hoá đơn đã trả.</li>
        <li><b>Máy trạng thái</b> = bản ghi cho biết giao dịch đang ở bước nào (ví dụ ĐÃ_TRỪ_TIỀN, ĐANG_GẠCH_NỢ, ĐÃ_HOÀN_TIỀN) và được chuyển sang bước nào tiếp.</li>
        <li><b>Bồi hoàn</b> = bước làm ngược lại để trả mọi thứ về như cũ, ví dụ hoàn tiền cho khách.</li>
      </ul>
    focus:
    - '2.1'
    - '2.2'
    - '2.4'
    say: SAGA là chuỗi giao dịch nhỏ, mỗi bước có sẵn một bước bù trừ làm ngược lại. CASA là tài khoản thanh toán của khách, còn gạch nợ là báo cho bên bán rằng hoá đơn đã được trả. Máy trạng thái là bản ghi cho biết giao dịch đang ở bước nào và sẽ chuyển sang bước nào tiếp theo.
