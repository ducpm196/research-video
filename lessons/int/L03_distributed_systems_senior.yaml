      <p>Ví dụ: ghi "đã trừ tiền" vào cơ sở dữ liệu xong thì mất mạng, sự kiện không tới Kafka, dịch vụ khác không biết tiền đã trừ. Ngược lại, gửi sự kiện xong mà giao dịch cơ sở dữ liệu bị huỷ thì các bên nhận được tin về một việc không xảy ra.</p>
    focus:
