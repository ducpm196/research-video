objectives:
- Nêu hạn chế của cam kết hai pha và cách mô hình SAGA điều phối bù trừ khi đối tác lỗi
- Trình bày mẫu Transactional Outbox với bắt thay đổi dữ liệu và vì sao hết ghi kép
- 'Nêu cấu hình Kafka để không mất tin: xác nhận đủ bản sao, số bản sao đồng bộ tối thiểu, phát tin lũy đẳng'
- Áp dụng khoá hàng có thứ tự xác định để tránh bế tắc ORA-00060
- Tính số lần đổi ngữ cảnh giữa PL/SQL và SQL khi xử lý từng dòng so với xử lý theo lô
- Tính thời gian một dòng nóng bị giữ khoá của cam kết hai pha so với SAGA ở ba mức chậm của đối tác
- Nêu quy trình điều tra ORA-00060 qua tệp vết và cách chữa tận gốc
- 'Nêu hai sai lầm làm Oracle quá tải giờ cao điểm: bảng không phân vùng và khoá ngoại thiếu chỉ mục'
- Trả lời một câu phỏng vấn có số về xử lý lô lương và thời gian giữ khoá
