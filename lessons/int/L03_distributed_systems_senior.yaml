      kiểm thử đồng thời và theo dõi tần suất lỗi, không khẳng định "hết 100%" khi
      chưa có số đo.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, sau khi đã làm rõ nguyên nhân gốc rễ, kỹ sư tiến hành chuẩn hóa
