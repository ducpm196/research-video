      85\" rx=\"8\" fill=\"#f8f9fa\" stroke=\"#6c757d\" stroke-width=\"2\"/>\n  <text\
      \ x=\"500\" y=\"45\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">VÙNG\
      \ METASPACE</text>\n  <text x=\"500\" y=\"70\" font-size=\"11\" fill=\"#666\"\
