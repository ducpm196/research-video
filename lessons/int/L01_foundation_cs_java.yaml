      2\"/>\n  <text x=\"500\" y=\"140\" font-size=\"13\" font-weight=\"bold\" fill=\"\
      #333\">NGĂN XẾP LUỒNG (STACK)</text>\n  <text x=\"500\" y=\"165\" font-size=\"\
      11\" fill=\"#666\">Một megabyte cho mỗi luồng</text>\n</svg>"
    focus:
    - 0
    - 0
    - 0
    say: Nhìn vào sơ đồ bộ nhớ máy ảo Java, vùng đệm đối tượng được chia thành thế
      hệ trẻ và thế hệ già. Hầu hết các bản tin yêu cầu ngắn hạn sinh ra trong vùng
      tạo mới và nhanh chóng bị dọn sạch. Các đối tượng sống sót qua nhiều chu kỳ
      sẽ được chuyển lên thế hệ già.
  - show: "<table class=\"t\">\n  <tr><th>đợt thu gom rác</th><th>vùng tác động</th><th>mức\
      \ độ ảnh hưởng đến giao dịch</th></tr>\n  <tr><td>Thu gom rác nhỏ (Minor GC)</td><td>Vùng\
      \ thế hệ trẻ (Eden và Survivor)</td><td>Cũng dừng ứng dụng nhưng thường ngắn</td></tr>\n  <tr><td>Thu gom rác lớn (Major GC)</td><td>Vùng thế\
      \ hệ già (Tenured Old Gen)</td><td>Dọn dẹp đối tượng tồn tại lâu năm</td></tr>\n\
      \  <tr><td>Thu gom rác toàn phần (Full GC)</td><td>Toàn bộ bộ nhớ Heap và Metaspace</td><td>Dừng\
      \ toàn bộ hệ thống, nguyên nhân gây quá hạn API</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Đợt thu gom rác nhỏ cũng tạm dừng ứng dụng, nhưng thường rất ngắn.
      Tuy nhiên, đợt thu gom rác toàn phần đóng băng toàn bộ ứng dụng, với vùng nhớ
      lớn có thể kéo dài tới hàng giây. Đây là một nguyên nhân thường gặp khiến các
      kết nối liên ngân hàng bị quá hạn thời gian xử lý.
    clear: true
- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Tính toán Luồng Ảo Java 21
  steps:
  - show: '<p><b>Mô hình minh họa bộ nhớ ngăn xếp của hai loại luồng</b>:</p>

      <div class="box key">

      $$\text{Luồng hệ điều hành (dự trữ tối đa): } M_{\text{os}} \le N \times 1\text{
      MB}$$

      $$\text{Luồng ảo Java 21 (JEP 444): } M_{\text{vt}} \approx N \times S$$

      </div>

      <p>Trong đó $N$ là số tác vụ chờ vào ra đồng thời; $M_{\text{os}}$ là không
      gian ngăn xếp dự trữ (bộ nhớ thật được cấp dần); $S$ là kích thước ngăn xếp
      của một luồng ảo, nằm trên heap và thay đổi theo độ sâu lời gọi (vài trăm byte
      đến vài KB, không có con số cố định).</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta so sánh bộ nhớ ngăn xếp giữa hai mô hình luồng bằng một mô hình minh
      họa. Với luồng truyền thống, mỗi luồng dự trữ tới một megabyte ngăn xếp, dù
      hệ điều hành chỉ cấp bộ nhớ thật dần dần. Với luồng ảo trong Java 21, ngăn xếp
      nằm trên bộ nhớ động và chỉ lớn theo độ sâu lời gọi, thường từ vài trăm đến
      vài nghìn byte. Vì vậy lợi ích chính là phục vụ được rất nhiều tác vụ chờ vào
      ra cùng lúc, chứ không phải một hệ số tiết kiệm cố định.
  - show: '<p><b>Độ phức tạp thuật toán và cấu trúc Cây B-Tree trong cơ sở dữ liệu</b>:</p>

      <pre><code>// Chiều cao cây B-Tree với hệ số phân nhánh m = 1000

      H = ceil(log_m(N))


      // Với 10 triệu bản ghi tài khoản ngân hàng (N = 10,000,000)

      H = ceil(log_1000(10,000,000)) = 3 tầng I/O đĩa cứng!</code></pre>'
    focus:
    - 0
    - 0
    - 0
    say: Để tối ưu hóa truy xuất dữ liệu sổ cái, các hệ quản trị dùng cây nhiều nhánh
      với hệ số phân nhánh lên tới một nghìn con. Do đó, với mười triệu tài khoản
      ngân hàng, chiều cao cây chỉ có ba tầng. Nghĩa là hệ thống chỉ cần tối đa ba
      lần đọc đĩa cứng để tìm thấy số dư.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Tối ưu Xử lý 10,000 Giao dịch Đồng thời với Luồng Ảo'
  checks:
  - 10000 * 2000 // 1000000 == 20
  - 10000 * 1 == 10000
  - 10000 // 20 == 500
  steps:
  - show: "<p><b>Dữ liệu bài toán giả định (minh họa) cho một cổng thanh toán</b>:</p>\n<ul>\n\
      \  <li>Lưu lượng đồng thời: $N = 10\\,000$ kết nối chuyển tiền cần xử lý I/O\
      \ mạng.</li>\n  <li>Thời gian xử lý I/O gọi Core T24: $T = 50$ mili giây mỗi\
      \ giao dịch.</li>\n  <li>Hạ tầng máy chủ: RAM 16 GB, CPU 8 nhân vật lý.</li>\n\
      </ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định tại cổng thanh toán với mười nghìn kết nối
      đồng thời. Mỗi lệnh chuyển tiền mất năm mươi mili giây để chờ phản hồi
      từ hệ thống ngân hàng lõi. Hạ tầng máy chủ trang bị mười sáu gigabyte bộ nhớ
      và tám nhân xử lý.
  - show: '<p><b>Bước 1: Phân tích khi dùng mô hình Luồng Hệ điều hành truyền thống</b>:</p>

      $$\text{Ngăn xếp dự trữ: } M \le 10\,000 \times 1\text{ MB} \approx 10\text{
      GB}$$

      <div class="box pit">Bộ nhớ thật được cấp dần nên thường thấp hơn nhiều, nhưng
      hệ điều hành vẫn phải lập lịch mười nghìn luồng; vì vậy bể luồng truyền thống
      thường bị giới hạn ở vài trăm luồng.</div>'
    focus:
    - 0
    - 0
    say: Bước một, nếu dùng luồng truyền thống, mười nghìn luồng dự trữ tới khoảng
      mười gigabyte không gian ngăn xếp. Bộ nhớ thật được cấp dần nên thường ít hơn,
      nhưng hệ điều hành vẫn phải lập lịch cho mười nghìn luồng, nên bể luồng thường
      bị giới hạn ở vài trăm.
    clear: true
  - show: '<p><b>Bước 2: Phân tích khi dùng Luồng Ảo Java 21 (Virtual Threads)</b>:</p>

      $$\text{Giả định } S \approx 2\,000\text{ bytes: } M_{\text{vt}} \approx 10\,000
      \times 2\,000 = 20\,000\,000\text{ bytes} \approx 20\text{ MB}$$

      <div class="box key">Tám nhân CPU chạy khoảng 8 luồng vận chuyển (Carrier Threads).
      Bẫy ghim luồng ở Java 21: chặn vào ra bên trong <code>synchronized</code> giữ
      chặt luồng vận chuyển; thay bằng <code>ReentrantLock</code>.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, với luồng ảo, nếu giả định mỗi luồng tốn khoảng hai nghìn byte
      thì mười nghìn luồng cần khoảng hai mươi megabyte trên bộ nhớ động. Tám nhân
      xử lý chạy khoảng tám luồng vận chuyển. Nhưng ở Java 21, nếu chặn vào ra bên
      trong khối đồng bộ hóa thì luồng ảo bị ghim chặt, nên ta thay khối đó bằng khóa
      tường minh.
