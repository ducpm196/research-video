      >\n  <tr><th>nguy cơ tiềm ẩn</th><th>cơ chế rò rỉ</th><th>giải pháp khắc phục\
      \ bắt buộc</th></tr>\n  <tr><td>Rò rỉ bộ nhớ Heap</td><td>ThreadLocal không\
      \ được giải phóng sau request</td><td>Luôn gọi lệnh remove() trong khối finally</td></tr>\n\
      \  <tr><td>Lộ lọt thông tin</td><td>Luồng phục vụ phiên của khách hàng kế tiếp</td><td>Xóa\
      \ sạch thông tin định danh và token cũ</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Một cạm bẫy kinh điển là việc dùng biến cục bộ luồng trong bể luồng tái sử
      dụng. Nếu kỹ sư quên gọi lệnh dọn dẹp sau khi xử lý xong, dữ liệu phiên làm
      việc cũ sẽ không được giải phóng. Điều này gây rò rỉ bộ nhớ nghiêm trọng và
      làm lộ lọt thông tin giữa các khách hàng khác nhau.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm Tính toán: Phân biệt String và StringBuilder trong Bản tin Ngân
    hàng'
  checks:
  - 50 - 5 == 45
  - 21 > 8
  steps:
  - show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong xử lý bản tin tài chính\
      \ đơn luồng với hàng triệu vòng lặp nối chuỗi XML, tại sao ta không nên dùng\
      \ phép cộng chuỗi String thông thường mà nên dùng StringBuilder?</p>\n<ul>\n\
      \  <li><b>A</b>: String chiếm ít bộ nhớ hơn StringBuilder.</li>\n  <li><b>B</b>:\
      \ String là đối tượng bất biến, mỗi phép cộng chuỗi sao chép lại chuỗi cũ thành\
      \ một đối tượng mới trên Heap, còn StringBuilder là khả biến giúp nối trực\
      \ tiếp trong mảng đệm nội bộ.</li>\n  <li><b>C</b>: String an toàn đa luồng\
      \ hơn StringBuilder.</li>\n  <li><b>D</b>: Cả hai có hiệu năng hoàn toàn tương\
      \ đương nhau.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Xin mời bạn suy nghĩ câu hỏi về tối ưu hóa bộ nhớ khi xử lý bản tin ngân
      hàng. Phép nối chuỗi thông thường khác biệt thế nào so với bộ dựng chuỗi khả
      biến. Bạn có 15 giây suy nghĩ trước khi nghe lời giải chi tiết.
    pause: 15
  - show: "<div class=\"box key\"><b>Đáp án chính xác là B</b>!</div>\n<p><b>Bước\
      \ 1 — Cơ chế bất biến của chuỗi String trong Java</b>:</p>\n<table class=\"\
      t\">\n  <tr><th>thao tác</th><th>cơ chế bộ nhớ Heap</th><th>hậu quả tài nguyên</th></tr>\n\
      \  <tr><td>Cộng chuỗi String (s += part)</td><td>Mỗi lần sao chép lại toàn bộ\
      \ chuỗi cũ</td><td>Chi phí O(n²), nhiều rác ngắn hạn làm Minor GC dày hơn</td></tr>\n\
      \  <tr><td>Dùng StringBuilder (sb.append)</td><td>Nối vào mảng đệm, chỉ cấp phát\
      \ lại khi đầy</td><td>Chi phí tuyến tính (khấu hao), ít rác hơn</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án B. Chuỗi trong Java là đối tượng bất biến nên
      mỗi lần nối chuỗi sẽ cấp phát một vùng nhớ mới trên bộ nhớ động. Trong vòng
      lặp, mỗi lần nối lại sao chép toàn bộ chuỗi cũ, nên chi phí tăng theo bình phương
      và sinh nhiều rác ngắn hạn khiến các đợt thu gom rác nhỏ dày đặc hơn.
    clear: true
  - show: '<p><b>Bước 2 — Kết luận thực chiến cho hệ thống ngân hàng</b>:</p>

      <div class="box key">Trong mọi dịch vụ chuyển đổi bản tin như ISO 8583 hoặc
      OFS XML, dùng StringBuilder với dung lượng khởi tạo ước tính trước để giảm sao
      chép và rác; thông lượng thực tế phải đo bằng kiểm thử tải.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, trong mọi dịch vụ chuyển đổi bản tin tài chính, ta luôn sử dụng
      bộ dựng chuỗi khả biến với dung lượng dự tính trước. Kỹ thuật này giảm sao chép
      và giảm rác, còn thông lượng thực tế phải đo bằng kiểm thử tải.
    clear: true
