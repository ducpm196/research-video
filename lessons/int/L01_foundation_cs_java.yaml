        <tr><td>Thu gom rác nhỏ (Minor GC)</td><td>Vùng thế hệ trẻ (Eden và Survivor)</td><td>Cũng dừng ứng dụng nhưng thường ngắn</td></tr>
        <tr><td>Thu gom rác lớn (Major GC)</td><td>Vùng thế hệ già (Tenured Old Gen)</td><td>Dọn dẹp đối tượng tồn tại lâu năm</td></tr>
        <tr><td>Thu gom rác toàn phần (Full GC)</td><td>Toàn bộ bộ nhớ Heap và Metaspace</td><td>Dừng toàn bộ ứng dụng; với vùng nhớ lớn có thể kéo dài hàng giây, một nguyên nhân thường gặp gây quá hạn API (API = cổng để phần mềm này gọi phần mềm khác; quá hạn = chờ quá thời gian cho phép); G1 và ZGC là hai bộ thu gom rác hiện đại của Java, dừng ngắn hơn nhiều</td></tr>
      </table>
