- id: hook
  kind: hook
  title: Bản chất máy tính và ranh giới giữa kỹ sư bình thường và Kỹ sư Cấp cao
  steps:
  - show: '<p>Đa số lập trình viên viết code Java chỉ nhìn thấy cú pháp mà không hiểu
      điều gì diễn ra dưới thanh ghi CPU và bộ nhớ RAM.</p>

      <div class="box key">Khi hệ thống ngân hàng xử lý mười nghìn giao dịch mỗi giây,
      một lỗi chia sẻ giả trên bộ nhớ đệm CPU hoặc đợt dừng toàn bộ hệ thống của bộ
      thu gom rác có thể làm nghẽn toàn bộ cổng thanh toán. Làm sao để làm chủ tận
      gốc?</div>

      <p>Thanh ghi = ô nhớ nhỏ nhất nằm ngay trong CPU; bộ nhớ đệm (cache) = vùng nhớ
      nhỏ, nhanh, nằm giữa CPU và RAM. Hai từ "chia sẻ giả" và "thu gom rác" được giảng
      kỹ ngay trong bài này.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, đa số lập trình viên viết mã nguồn Java mà chưa hiểu rõ điều gì
      thực sự xảy ra dưới thanh ghi và bộ nhớ máy tính. Thanh ghi là ô nhớ nhỏ nhất nằm ngay trong bộ xử lý,
      còn bộ nhớ đệm là vùng nhớ nhỏ và nhanh nằm giữa bộ xử lý và bộ nhớ chính. Khi cổng thanh toán ngân hàng
      chạm mốc mười nghìn giao dịch mỗi giây, sự thiếu hiểu biết về bộ nhớ đệm sẽ
      khiến hệ thống sụt giảm hiệu năng nghiêm trọng. Hôm nay, ta cùng nhau xây dựng
      lại nền tảng vững chắc từ con số không.
  - show: "<table class=\"t\">\n  <tr><th>tầng kiến thức</th><th>vấn đề hiệu năng\
      \ cốt lõi</th><th>giải pháp chuẩn Kỹ sư Cấp cao</th></tr>\n  <tr><td>Bộ nhớ\
      \ máy tính</td><td>Độ trễ truy xuất RAM và hiện tượng chia sẻ giả</td><td>Căn\
      \ chỉnh khối đệm 64 byte và phân cấp bộ nhớ</td></tr>\n  <tr><td>Bộ nhớ máy\
      \ ảo JVM</td><td>Hiện tượng dừng toàn bộ hệ thống do thu gom rác</td><td>Phân\
      \ vùng nhớ thế hệ trẻ và thế hệ già tối ưu</td></tr>\n  <tr><td>Luồng thực thi\
      \ Java 21</td><td>Chi phí chuyển đổi ngữ cảnh luồng hệ điều hành</td><td>Ứng\
      \ dụng luồng ảo siêu nhẹ trong không gian người dùng</td></tr>\n</table>\n<p>Hôm\
      \ nay, ta giải mã: <b>Mô hình bộ nhớ máy tính</b>, <b>tinh chỉnh máy ảo Java</b>,\
      \ và <b>công nghệ luồng ảo Java 21</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba trụ cột khoa học máy tính lõi. Ta tìm hiểu
      cách tổ chức bộ nhớ đệm để tránh hiện tượng chia sẻ giả. Ta nắm vững cơ
      chế thu gom rác thế hệ mới của máy ảo Java. Ta cũng làm chủ kỹ thuật lập trình
      đồng thời với hàng triệu luồng ảo trong Java 21.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Phân cấp bộ nhớ, Khối đệm 64 byte và Số thực dấu phẩy động'
  checks:
  - 1000 * 1000 == 1000000
  - 100 // 1 == 100
  - 64 // 8 == 8
  - len('30000000000000004') == 17
  - 0.1 + 0.2 != 0.3
  - abs((0.1 + 0.2) - 0.30000000000000004) < 1e-18
  steps:
  - show: "<p><b>Phân cấp tốc độ bộ nhớ từ thanh ghi đến bộ nhớ chính</b> (số liệu\
      \ xấp xỉ, minh họa; tuỳ đời CPU):</p>\n<table\
      \ class=\"t\">\n  <tr><th>tầng bộ nhớ</th><th>thời gian truy xuất</th><th>khoảng\
      \ cách tương đối</th></tr>\n  <tr><td>Thanh ghi CPU</td><td>0.5 nano giây</td><td>tức\
      \ thời tại nhân xử lý</td></tr>\n  <tr><td>Bộ nhớ đệm cấp một L1</td><td>1 nano\
      \ giây</td><td>nhanh gấp một trăm lần RAM</td></tr>\n  <tr><td>Bộ nhớ đệm cấp\
      \ hai L2</td><td>3 đến 10 nano giây</td><td>gắn liền từng nhân xử lý</td></tr>\n\
      \  <tr><td>Bộ nhớ đệm cấp ba L3</td><td>20 đến 40 nano giây</td><td>chia sẻ\
      \ chung giữa các nhân</td></tr>\n  <tr><td>Bộ nhớ chính RAM</td><td>100 nano\
      \ giây</td><td>điểm nghẽn truy xuất dữ liệu</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu mô hình phân cấp bộ nhớ của máy tính. Thanh ghi và bộ
      nhớ đệm cấp một có tốc độ tính bằng nano giây. Trong khi đó, bộ nhớ chính chậm
      hơn khoảng một trăm lần, tuỳ đời máy. Dữ liệu được nạp từ bộ nhớ chính lên bộ nhớ đệm
      theo từng khối, trên hầu hết bộ xử lý máy chủ hiện nay mỗi khối dài 64 byte.
  - show: |-
      <p><b>Khối đệm 64 byte và hiện tượng chia sẻ giả (false sharing)</b>:</p>
      <ul>
        <li>Một biến kiểu <code>long</code> dài 8 byte, nên một khối 64 byte chứa $64 / 8 = 8$ biến <code>long</code> nằm cạnh nhau.</li>
        <li>Nhân CPU 1 liên tục ghi biến <code>a</code>, nhân CPU 2 liên tục ghi biến <code>b</code>; hai biến khác nhau nhưng nằm <b>chung một khối</b>.</li>
        <li>Mỗi lần một nhân ghi, khối trong bộ nhớ đệm của nhân kia bị đánh dấu cũ và phải nạp lại: hai nhân "giành nhau" một khối dù không dùng chung dữ liệu.</li>
        <li>Cách sửa: đệm thêm byte trống để mỗi biến nóng nằm ở một khối riêng (Java có chú thích <code>@Contended</code> làm việc này).</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Vì dữ liệu đi theo khối 64 byte, nên một khối chứa được 64 chia 8, bằng 8 biến số nguyên dài nằm cạnh nhau.
      Giả sử nhân thứ nhất liên tục ghi biến a, nhân thứ hai liên tục ghi biến b, hai biến khác nhau nhưng nằm chung một khối.
      Mỗi lần một nhân ghi, bản sao khối đó trong bộ nhớ đệm của nhân kia bị coi là cũ và phải nạp lại.
      Hai nhân giành nhau một khối dù không dùng chung dữ liệu, hiện tượng này gọi là chia sẻ giả.
      Cách sửa là đệm thêm byte trống để mỗi biến hay bị ghi nằm ở một khối riêng.
    clear: true
  - show: '<div class="box key">Quy tắc vàng trong hệ thống ngân hàng: không dùng kiểu
      số thực nhị phân float hay double để lưu trữ tiền tệ. Lỗi làm tròn nhị phân
      (chuẩn IEEE 754) sẽ làm sai lệch số dư. Ta dùng kiểu số thập phân chính xác
      BigDecimal với quy tắc làm tròn ghi rõ.</div>

      <pre><code>double d = 0.1 + 0.2;   // in ra 0.30000000000000004

      new BigDecimal("0.1").add(new BigDecimal("0.2"))   // đúng 0.3</code></pre>

      <p>Vì sao? 0,1 viết ở hệ nhị phân là một dãy lặp vô hạn (giống 1/3 = 0,333… ở
      hệ thập phân), nên máy chỉ lưu được giá trị gần đúng.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trong hệ thống tài chính ngân hàng, ta không dùng kiểu
      số thực nhị phân để lưu tiền vì lỗi làm tròn dấu phẩy động. Ví dụ, máy cộng 0 phẩy 1 với 0 phẩy 2
      ra một số hơi lớn hơn 0 phẩy 3, có chữ số 4 ở vị trí thứ mười bảy sau dấu phẩy.
      Lý do là 0 phẩy 1 viết ở hệ nhị phân là một dãy lặp vô hạn, giống một phần ba ở hệ thập phân, nên máy chỉ lưu được giá trị gần đúng.
      Mọi phép tính tiền bạc và lãi suất vì vậy dùng kiểu số thập phân chính xác với quy tắc làm tròn rõ ràng.
    clear: true
