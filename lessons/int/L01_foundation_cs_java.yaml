    clear: true
    say: Nhìn vào sơ đồ bộ nhớ máy ảo Java, heap là vùng nhớ chứa mọi đối tượng chương trình tạo ra, và nó được chia thành thế hệ trẻ và thế hệ già. Hầu hết các bản tin yêu cầu ngắn hạn sinh ra trong vùng tạo mới và nhanh chóng bị dọn sạch. Đối tượng sống sót qua nhiều chu kỳ được chuyển lên thế hệ già. Ở đó có đệm tĩnh, vùng nhớ dùng chung giữ dữ liệu tra nhanh, và bể kết nối, nhóm kết nối cơ sở dữ liệu mở sẵn.
  - show: |-
      <p><b>Giải nghĩa các từ trên sơ đồ</b>:</p>
      <ul>
        <li><b>Heap</b> = vùng nhớ chứa mọi đối tượng chương trình tạo ra (đối tượng = một khối dữ liệu có tên và các trường, ví dụ một giao dịch).</li>
        <li><b>Thu gom rác (GC)</b> = phần của máy ảo Java tự tìm và giải phóng đối tượng không còn ai dùng.</li>
        <li><b>S0 và S1 (Survivor)</b> = hai vùng nhỏ giữ tạm đối tượng còn sống sau mỗi lần dọn Eden, trước khi chuyển lên thế hệ già.</li>
        <li><b>Metaspace</b> giữ thông tin về các lớp; <b>ngăn xếp</b> giữ biến cục bộ (biến khai báo trong một hàm) của từng luồng.</li>
      </ul>
    focus:
    - '2.1'
    - '2.2'
    - '2.4'
    say: Mỗi đối tượng là một khối dữ liệu có tên và các trường, ví dụ một giao dịch. Bộ thu gom rác là phần của máy ảo Java tự tìm và giải phóng những đối tượng không còn ai dùng. Vùng siêu dữ liệu giữ thông tin về các lớp, còn ngăn xếp giữ biến cục bộ, tức biến khai báo trong một hàm, của từng luồng.
