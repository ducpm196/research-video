- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Tính toán Luồng Ảo Java 21
  checks:
  - 1000 * 1000 == 1000000
  - 1000 ** 2 < 10 ** 7 <= 1000 ** 3
  - round(7 / 3, 2) == 2.33
  steps:
  - show: '<p><b>Mô hình minh họa bộ nhớ ngăn xếp của hai loại luồng</b>:</p>

      <div class="box key">

      $$\text{Luồng hệ điều hành (dự trữ tối đa): } M_{\text{os}} \le N \times 1\text{
      MB}$$

      $$\text{Luồng ảo Java 21 (JEP 444): } M_{\text{vt}} \approx N \times S$$

      </div>

      <p>Trong đó $N$ là số tác vụ chờ vào ra đồng thời; $M_{\text{os}}$ là không
      gian ngăn xếp dự trữ (bộ nhớ thật được cấp dần); $S$ là kích thước ngăn xếp
      của một luồng ảo, nằm trên heap và thay đổi theo độ sâu lời gọi (vài trăm byte
      đến vài KB, không có con số cố định).</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta so sánh bộ nhớ ngăn xếp giữa hai mô hình luồng bằng một mô hình minh
      họa. Với luồng truyền thống, mỗi luồng dự trữ tới một megabyte ngăn xếp, dù
      hệ điều hành chỉ cấp bộ nhớ thật dần dần. Với luồng ảo trong Java 21, ngăn xếp
      nằm trên bộ nhớ động và chỉ lớn theo độ sâu lời gọi, thường từ vài trăm đến
      vài nghìn byte. Vì vậy lợi ích chính là phục vụ được rất nhiều tác vụ chờ vào
      ra cùng lúc, chứ không phải một hệ số tiết kiệm cố định.
  - show: '<p><b>Độ phức tạp thuật toán và cấu trúc Cây B-Tree trong cơ sở dữ liệu</b>:</p>

      <pre><code>// Chiều cao cây B-Tree với hệ số phân nhánh m = 1000 (mỗi nút ~1000 con)

      H = ceil(log_m(N))     // ceil = làm tròn lên


      // Với 10 triệu bản ghi tài khoản ngân hàng (N = 10 000 000 = 10^7)

      log_1000(10^7) = 7/3 ≈ 2,33  →  H = 3 tầng</code></pre>

      <p>Trực giác: tầng 1 chia 1000 nhánh, tầng 2 thành 1000 × 1000 = 1 triệu, tầng
      3 thành 1 tỉ, đủ chứa 10 triệu. Ký hiệu O(N) = số bước tăng tỉ lệ với số dòng;
      O(log N) = số bước tăng rất chậm, dữ liệu lớn gấp 1000 lần chỉ thêm một tầng.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Để tối ưu hóa truy xuất dữ liệu sổ cái, các hệ quản trị dùng cây nhiều nhánh
      với hệ số phân nhánh có thể tới khoảng một nghìn con. Tầng một chia một nghìn nhánh, tầng hai thành một triệu, tầng ba thành một tỉ nhánh.
      Vậy mười triệu tài khoản chỉ cần cây cao ba tầng, đúng bằng 7 chia 3 xấp xỉ 2 phẩy 33 rồi làm tròn lên. Nghĩa là hệ thống chỉ cần tối đa khoảng ba
      lần đọc đĩa để tìm thấy số dư, và thường còn ít hơn vì các tầng trên đã nằm sẵn trong bộ nhớ.
      Người ta gọi đây là độ phức tạp lôgarit, tức số bước tăng rất chậm khi dữ liệu lớn lên.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Tối ưu Xử lý 10,000 Giao dịch Đồng thời với Luồng Ảo'
  checks:
  - 10000 * 2000 // 1000000 == 20
  - 10000 * 1 == 10000
  - 10000 // 20 == 500
  steps:
  - show: "<p><b>Dữ liệu bài toán giả định (minh họa) cho một cổng thanh toán</b>:</p>\n<ul>\n\
      \  <li>Lưu lượng đồng thời: $N = 10\\,000$ kết nối chuyển tiền cần xử lý I/O\
      \ mạng (I/O = vào ra: chờ mạng, chờ đĩa).</li>\n  <li>Thời gian chờ hệ thống ngân hàng lõi (core banking) trả lời: $T = 50$ mili giây mỗi\
      \ giao dịch.</li>\n  <li>Hạ tầng máy chủ: RAM 16 GB, CPU 8 nhân vật lý.</li>\n\
      </ul>"
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định tại cổng thanh toán với mười nghìn kết nối
      đồng thời. Mỗi lệnh chuyển tiền mất năm mươi mili giây để chờ phản hồi
      từ hệ thống ngân hàng lõi. Hạ tầng máy chủ trang bị mười sáu gigabyte bộ nhớ
      và tám nhân xử lý.
  - show: '<p><b>Bước 1: Phân tích khi dùng mô hình Luồng Hệ điều hành truyền thống</b>:</p>

      $$\text{Ngăn xếp dự trữ: } M \le 10\,000 \times 1\text{ MB} \approx 10\text{
      GB}$$

      <div class="box pit">Bộ nhớ thật được cấp dần nên thường thấp hơn nhiều, nhưng
      hệ điều hành vẫn phải lập lịch mười nghìn luồng; vì vậy bể luồng truyền thống
      thường bị giới hạn ở vài trăm luồng.</div>'
    focus:
    - 0
    - 0
    say: Bước một, nếu dùng luồng truyền thống, mười nghìn luồng dự trữ tới khoảng
      mười gigabyte không gian ngăn xếp. Bộ nhớ thật được cấp dần nên thường ít hơn,
      nhưng hệ điều hành vẫn phải lập lịch cho mười nghìn luồng, nên bể luồng thường
      bị giới hạn ở vài trăm.
    clear: true
  - show: '<p><b>Bước 2: Phân tích khi dùng Luồng Ảo Java 21 (Virtual Threads)</b>:</p>

      $$\text{Giả định } S \approx 2\,000\text{ bytes: } M_{\text{vt}} \approx 10\,000
      \times 2\,000 = 20\,000\,000\text{ bytes} \approx 20\text{ MB}$$

      <div class="box key">Tám nhân CPU chạy khoảng 8 luồng vận chuyển (Carrier Threads:
      luồng hệ điều hành thật "chở" các luồng ảo; luồng ảo nào đang chờ vào ra thì
      nhả luồng vận chuyển cho luồng khác). Bẫy ghim luồng ở Java 21: chặn vào ra bên
      trong <code>synchronized</code> giữ chặt luồng vận chuyển; thay bằng <code>ReentrantLock</code>
      (Java 24, JEP 491, đã gỡ phần lớn bẫy này).</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước hai, với luồng ảo, nếu giả định mỗi luồng tốn khoảng hai nghìn byte
      thì mười nghìn luồng cần khoảng hai mươi megabyte trên bộ nhớ động. Tám nhân
      xử lý chạy khoảng tám luồng vận chuyển, là các luồng hệ điều hành thật chở các luồng ảo, và luồng ảo nào đang chờ vào ra thì nhả chỗ cho luồng khác. Nhưng ở Java 21, nếu chặn vào ra bên
      trong khối đồng bộ hóa thì luồng ảo bị ghim chặt, nên ta thay khối đó bằng khóa
      tường minh. Từ Java 24, phần lớn bẫy này đã được gỡ bỏ.
    clear: true
  - show: '<p><b>Bước 3: Cấu hình chuẩn doanh nghiệp trên Spring Boot 3.2+</b>:</p>

      <pre><code># Kích hoạt luồng ảo toàn diện trong tệp cấu hình application.properties

      spring.threads.virtual.enabled=true</code></pre>

      <p>Tomcat phục vụ mỗi request bằng một luồng ảo; các thuộc tính bể luồng như
      <code>server.tomcat.threads.max</code> không còn tác dụng. Giới hạn đồng thời
      thực sự là bể kết nối DB (HikariCP: nhóm kết nối cơ sở dữ liệu mở sẵn, dùng lại).</p>'
    focus:
    - 0
    - 0
    say: Bước ba, kỹ sư chỉ cần kích hoạt tính năng luồng ảo trong tệp cấu hình của
      hệ thống. Máy chủ web nhúng sẽ xử lý mỗi yêu cầu bằng một luồng ảo riêng, còn
      giới hạn đồng thời thực sự nằm ở bể kết nối cơ sở dữ liệu.
    clear: true
- id: check
  kind: check
  title: 'Tự Kiểm tra: Đánh giá Độ phức tạp Thuật toán và B-Tree'
  checks:
  - 4 - 1 == 3
  - 1000 > 100
  steps:
  - show: "<p><b>Tình huống phỏng vấn Senior</b>: Một bảng giao dịch có 50 triệu dòng\
      \ dữ liệu. Nếu bảng chưa có chỉ mục, độ phức tạp tìm kiếm là bao nhiêu? Khi\
      \ đánh chỉ mục bằng Cây B-Tree, ta tốn tối đa bao nhiêu lần đọc đĩa?</p>\n<ul>\n\
      \  <li>(A) Không chỉ mục tốn O(log N), có chỉ mục tốn O(1).</li>\n  <li>(B)\
      \ Không chỉ mục quét toàn bảng O(N), có chỉ mục B-Tree tốn O(log N) với tối\
      \ đa 3 đến 4 lần đọc đĩa.</li>\n  <li>(C) Không chỉ mục tốn O(N^2), có chỉ mục\
      \ tốn 100 lần đọc đĩa.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi chuyên sâu về cơ sở dữ liệu. Với bảng giao dịch năm
      mươi triệu dòng, việc không đánh chỉ mục sẽ dẫn tới độ phức tạp nào. Và khi
      đánh chỉ mục dạng cây nhiều nhánh, hệ thống mất bao nhiêu lần truy xuất đĩa
      cứng.
  - show: '<p><b>Đáp án chính xác: Lựa chọn (B)</b></p>

      <div class="box key">Giải thích bản chất: Khi không có chỉ mục, hệ quản trị
      bắt buộc phải quét tuần tự toàn bộ bảng với độ phức tạp tuyến tính O(N), tương
      đương duyệt 50 triệu dòng. Khi có chỉ mục B-Tree với hệ số phân nhánh lớn, độ
      phức tạp là lôgarit O(log N) và chỉ mất 3 đến 4 lần đọc đĩa cơ học!</div>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì khi không có chỉ mục, hệ thống phải quét
      tuần tự toàn bộ năm mươi triệu dòng. Do đó khi có chỉ mục cây nhiều nhánh, việc
      tìm kiếm đạt độ phức tạp lôgarit và chỉ mất từ ba đến bốn lần đọc đĩa.
    clear: true
- id: pitfall
  kind: pitfall
  title: 'Bẫy Nguy hiểm: Rò rỉ Bộ nhớ khi Dùng ThreadLocal với Bể luồng'
  steps:
  - show: "<div class=\"box pit\">Hiểm họa rò rỉ bộ nhớ với biến cục bộ luồng trong\
      \ bể luồng tái sử dụng. ThreadLocal = biến mà mỗi luồng giữ một bản riêng; bể luồng\
      \ = nhóm luồng được dùng lại cho hết yêu cầu này tới yêu cầu khác.</div>\n<table class=\"t\" style=\"margin-top: 10px;\"\
      >\n  <tr><th>nguy cơ tiềm ẩn</th><th>cơ chế rò rỉ</th><th>giải pháp khắc phục\
      \ bắt buộc</th></tr>\n  <tr><td>Rò rỉ bộ nhớ Heap</td><td>ThreadLocal không\
      \ được giải phóng sau request</td><td>Luôn gọi lệnh remove() trong khối finally</td></tr>\n\
      \  <tr><td>Lộ lọt thông tin</td><td>Luồng phục vụ phiên của khách hàng kế tiếp</td><td>Xóa\
      \ sạch thông tin định danh và token cũ</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Một cạm bẫy kinh điển là việc dùng biến cục bộ luồng, tức biến mà mỗi luồng giữ một bản riêng, trong bể luồng tái sử
      dụng, tức nhóm luồng được dùng lại cho nhiều yêu cầu. Nếu kỹ sư quên gọi lệnh dọn dẹp sau khi xử lý xong, dữ liệu phiên làm
      việc cũ vẫn bám theo luồng và không được giải phóng. Điều này gây rò rỉ bộ nhớ và
      làm lộ lọt thông tin, vì yêu cầu của khách hàng kế tiếp chạy trên đúng luồng đó sẽ thấy dữ liệu cũ.
