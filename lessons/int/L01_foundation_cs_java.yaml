      \ x=\"250\" y=\"115\" font-size=\"11\" fill=\"#555\">Chứa đối tượng sống lâu\
      \ năm</text>\n  <text x=\"250\" y=\"140\" font-size=\"11\" fill=\"#555\">Bể\
