scenes:
- id: hook
  kind: hook
  title: Bản chất máy tính và ranh giới giữa kỹ sư bình thường và Kỹ sư Cấp cao
  steps:
  - show: |-
      <p>Đa số lập trình viên viết code Java chỉ nhìn thấy cú pháp mà không hiểu điều gì diễn ra dưới thanh ghi CPU và bộ nhớ RAM.</p>
      <div class="box key">Khi hệ thống ngân hàng xử lý mười nghìn giao dịch mỗi giây, một lỗi chia sẻ giả trên bộ nhớ đệm CPU hoặc đợt dừng toàn bộ hệ thống của bộ thu gom rác có thể làm nghẽn toàn bộ cổng thanh toán. Làm sao để làm chủ tận gốc?</div>
      <p>CPU = bộ xử lý; RAM = bộ nhớ chính. Thanh ghi = ô nhớ nhỏ nhất nằm ngay trong CPU; bộ nhớ đệm (cache) = vùng nhớ nhỏ, nhanh, nằm giữa CPU và RAM. Hai từ "chia sẻ giả" và "thu gom rác" được giảng kỹ ngay trong bài này.</p>
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, đa số lập trình viên viết mã nguồn Java mà chưa hiểu rõ điều gì thực sự xảy ra dưới thanh ghi và bộ nhớ máy tính. Thanh ghi là ô nhớ nhỏ nhất nằm ngay trong bộ xử lý, còn bộ nhớ đệm là vùng nhớ nhỏ và nhanh nằm giữa bộ xử lý và bộ nhớ chính. Khi cổng thanh toán ngân hàng chạm mốc mười nghìn giao dịch mỗi giây, thiếu hiểu biết về bộ nhớ đệm sẽ làm hệ thống sụt hiệu năng nghiêm trọng.
  - show: |-
      <table class="t">
        <tr><th>tầng kiến thức</th><th>vấn đề hiệu năng cốt lõi</th><th>giải pháp chuẩn Kỹ sư Cấp cao</th></tr>
        <tr><td>Bộ nhớ máy tính</td><td>Độ trễ truy xuất RAM và hiện tượng chia sẻ giả</td><td>Căn chỉnh khối đệm 64 byte và phân cấp bộ nhớ</td></tr>
        <tr><td>Bộ nhớ máy ảo JVM</td><td>Hiện tượng dừng toàn bộ hệ thống do thu gom rác</td><td>Phân vùng nhớ thế hệ trẻ và thế hệ già tối ưu</td></tr>
        <tr><td>Luồng thực thi Java 21</td><td>Chi phí chuyển đổi ngữ cảnh luồng hệ điều hành</td><td>Ứng dụng luồng ảo siêu nhẹ trong không gian người dùng</td></tr>
      </table>
      <p>Hôm nay, ta giải mã: <b>Mô hình bộ nhớ máy tính</b>, <b>tinh chỉnh máy ảo Java</b>, và <b>công nghệ luồng ảo Java 21</b>. <i>Luồng</i> = một dòng công việc chạy riêng trong chương trình.</p>
    focus:
    - 0
    - 0
    - 0
    say: Hôm nay ta tìm hiểu cách tổ chức bộ nhớ đệm để tránh hiện tượng chia sẻ giả. Ta nắm vững bố cục thế hệ trẻ và thế hệ già trong bộ nhớ máy ảo Java, cùng các đợt thu gom rác. Ta cũng chạy thử hàng chục nghìn luồng ảo trong Java 21, mà luồng là một dòng công việc chạy riêng trong chương trình.
    clear: true
- id: prereq
  kind: prereq
  title: 'Trước hết: Phân cấp bộ nhớ, Khối đệm 64 byte và Số thực dấu phẩy động'
  checks:
  - 1000 * 1000 == 1000000
  - 100 // 1 == 100
  - 64 // 8 == 8
  - len('30000000000000004') == 17
  - 0.1 + 0.2 != 0.3
  - abs((0.1 + 0.2) - 0.30000000000000004) < 1e-18
  steps:
  - show: |-
      <p><b>Phân cấp tốc độ bộ nhớ từ thanh ghi đến bộ nhớ chính</b> (số liệu xấp xỉ, minh họa; tuỳ đời CPU; 1 nano giây = một phần tỉ giây):</p>
      <table class="t">
        <tr><th>tầng bộ nhớ</th><th>thời gian truy xuất</th><th>khoảng cách tương đối</th></tr>
        <tr><td>Thanh ghi CPU</td><td>0,5 nano giây</td><td>tức thời tại nhân xử lý</td></tr>
        <tr><td>Bộ nhớ đệm cấp một L1</td><td>1 nano giây</td><td>nhanh gấp một trăm lần RAM</td></tr>
        <tr><td>Bộ nhớ đệm cấp hai L2</td><td>3 đến 10 nano giây</td><td>gắn liền từng nhân xử lý</td></tr>
        <tr><td>Bộ nhớ đệm cấp ba L3</td><td>20 đến 40 nano giây</td><td>chia sẻ chung giữa các nhân</td></tr>
        <tr><td>Bộ nhớ chính RAM</td><td>100 nano giây</td><td>điểm nghẽn truy xuất dữ liệu</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu mô hình phân cấp bộ nhớ của máy tính. Thanh ghi và bộ nhớ đệm cấp một có tốc độ tính bằng nano giây, mỗi nano giây là một phần tỉ giây. Trong khi đó, bộ nhớ chính chậm hơn khoảng một trăm lần, tuỳ đời máy. Dữ liệu được nạp từ bộ nhớ chính lên bộ nhớ đệm theo từng khối, trên hầu hết bộ xử lý máy chủ hiện nay mỗi khối dài 64 byte.
  - show: |-
      <p><b>Khối đệm 64 byte và hiện tượng chia sẻ giả (false sharing)</b>:</p>
      <ul>
        <li>Biến = ô nhớ có tên; kiểu <code>long</code> = số nguyên dài 8 byte. Một khối 64 byte chứa $64 / 8 = 8$ biến <code>long</code> nằm cạnh nhau.</li>
        <li>CPU có nhiều nhân, mỗi nhân chạy được một dòng việc riêng. Nhân 1 liên tục ghi biến <code>a</code>, nhân 2 liên tục ghi biến <code>b</code>; hai biến khác nhau nhưng nằm <b>chung một khối</b>.</li>
        <li>Mỗi lần một nhân ghi, khối trong bộ nhớ đệm của nhân kia bị đánh dấu cũ và phải nạp lại: hai nhân "giành nhau" một khối dù không dùng chung dữ liệu.</li>
        <li>Cách sửa: đệm thêm byte trống để mỗi biến nóng nằm ở một khối riêng (JDK, bộ công cụ lập trình Java, có sẵn một nhãn dặn máy ảo làm việc này, tên <code>@Contended</code>; nhãn là chữ bắt đầu bằng @ đặt trước biến. Mã của ứng dụng muốn dùng nó phải bật tuỳ chọn <code>-XX:-RestrictContended</code> khi chạy chương trình).</li>
      </ul>
    focus:
    - '2.1'
    - '2.1'
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.3'
    - '2.4'
    say: Biến là một ô nhớ có tên, và biến số nguyên dài chiếm 8 byte. Vì dữ liệu đi theo khối 64 byte, nên một khối chứa được 64 chia 8, bằng 8 biến số nguyên dài nằm cạnh nhau. Bộ xử lý có nhiều nhân, mỗi nhân chạy được một dòng việc riêng. Giả sử nhân thứ nhất liên tục ghi biến a, nhân thứ hai liên tục ghi biến b, hai biến khác nhau nhưng nằm chung một khối. Mỗi lần một nhân ghi, bản sao khối đó trong bộ nhớ đệm của nhân kia bị coi là cũ và phải nạp lại. Hai nhân giành nhau một khối dù không dùng chung dữ liệu, hiện tượng này gọi là chia sẻ giả. Cách sửa là đệm thêm byte trống để mỗi biến hay bị ghi nằm ở một khối riêng.
    clear: true
  - show: |-
      <div class="box key">Quy tắc vàng trong hệ thống ngân hàng: không dùng kiểu số thực nhị phân (trong Java tên là float và double) để lưu trữ tiền tệ. Lỗi làm tròn nhị phân (chuẩn quốc tế IEEE 754 cho số thực) sẽ làm sai lệch số dư. Ta dùng kiểu số thập phân chính xác BigDecimal với quy tắc làm tròn ghi rõ.</div>
      <table class="t">
        <tr><th>viết trong mã Java</th><th>đọc là</th></tr>
        <tr><td>double d = 0.1 + 0.2;</td><td>tạo biến d kiểu số thực nhị phân double, gán bằng 0,1 + 0,2; dấu chấm phẩy kết thúc câu lệnh</td></tr>
        <tr><td>// ...</td><td>từ // tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>new BigDecimal("0.1")</td><td>tạo một số thập phân chính xác từ chữ "0.1"</td></tr>
        <tr><td>.add(...)</td><td>cộng số đứng trước với số trong ngoặc, trả về số mới</td></tr>
      </table>
    focus:
    - 1
    - '2.2'
    - '2.4'
    say: Trong hệ thống tài chính ngân hàng, ta không dùng kiểu số thực nhị phân để lưu tiền vì lỗi làm tròn dấu phẩy động. Trong mã Java, kiểu này cộng 0 phẩy 1 với 0 phẩy 2 ra số hơi lớn hơn 0 phẩy 3, chữ số 4 nằm ở vị trí thứ mười bảy. Số thập phân chính xác, tạo từ chữ rồi cộng bằng lệnh cộng, cho đúng 0 phẩy 3.
    clear: true
  - show: |-
      <pre><code>double d = 0.1 + 0.2;   // in ra 0.30000000000000004
      new BigDecimal("0.1").add(new BigDecimal("0.2"))   // đúng 0.3</code></pre>
      <p>Vì sao? 0,1 viết ở hệ nhị phân là một dãy lặp vô hạn (giống 1/3 = 0,333… ở hệ thập phân), nên máy chỉ lưu được giá trị gần đúng.</p>
    focus:
    - 2
    say: Lý do là 0 phẩy 1 ở hệ nhị phân là một dãy lặp vô hạn, giống một phần ba ở hệ thập phân, nên máy chỉ lưu gần đúng; tiền phải dùng số thập phân chính xác.
    clear: true
- id: concept
  kind: concept
  title: Mô hình Bộ nhớ Máy ảo Java và Cơ chế Thu gom rác
  steps:
  - show: |-
      <p><b>Cấu trúc bộ nhớ máy ảo Java gồm ba khu vực chính</b>. <i>Đệm tĩnh</i> = vùng nhớ dùng chung giữ dữ liệu tra nhanh, tồn tại suốt đời chương trình; <i>bể kết nối</i> = nhóm kết nối cơ sở dữ liệu mở sẵn, dùng lại:</p>
      <svg viewBox="0 0 700 220" style="width:100%;max-height:440px;">
        <rect x="20" y="20" width="450" height="180" rx="8" fill="#e8f4fd" stroke="#003366" stroke-width="2"/>
        <text x="30" y="45" font-size="14" font-weight="bold" fill="#003366">VÙNG BỘ NHỚ HEAP</text>
        <rect x="40" y="60" width="180" height="120" rx="6" fill="#fff" stroke="#006699" stroke-width="1.5"/>
        <text x="50" y="85" font-size="12" font-weight="bold" fill="#006699">Young Gen (Thế hệ trẻ)</text>
