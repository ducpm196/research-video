- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Tính toán Luồng Ảo Java 21
  checks:
  - 1000 * 1000 == 1000000
  - 1000 ** 2 < 10 ** 7 <= 1000 ** 3
  - round(7 / 3, 2) == 2.33
  - 3 + 1 == 4
  steps:
  - show: |-
      <p><b>Mô hình minh họa bộ nhớ ngăn xếp của hai loại luồng</b>:</p>
      <div class="box key">
      $$\text{Luồng hệ điều hành (dự trữ tối đa): } M_{\text{os}} \le N \times 1\text{ MB}$$
      $$\text{Luồng ảo Java 21 (JEP 444): } M_{\text{vt}} \approx N \times S$$
      </div>
      <p>JEP = đề xuất cải tiến của Java, mỗi đề xuất có một số; JEP 444 đưa luồng ảo vào Java 21. Trong đó $N$ là số tác vụ chờ vào ra (chờ mạng hoặc chờ đĩa) đồng thời; $M_{\text{os}}$ là không gian ngăn xếp dự trữ (bộ nhớ thật được cấp dần); $S$ là kích thước ngăn xếp của một luồng ảo, nằm trên heap và thay đổi theo độ sâu lời gọi (vài trăm byte đến vài KB, không có con số cố định).</p>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta so sánh bộ nhớ ngăn xếp giữa hai mô hình luồng bằng một mô hình minh họa. Với luồng truyền thống, mỗi luồng dự trữ tới một megabyte ngăn xếp, dù hệ điều hành chỉ cấp bộ nhớ thật dần dần. Với luồng ảo trong Java 21, ngăn xếp nằm trên bộ nhớ động và chỉ lớn theo độ sâu lời gọi, thường từ vài trăm đến vài nghìn byte. Vì vậy lợi ích chính là phục vụ được rất nhiều tác vụ chờ vào ra, tức chờ mạng hoặc chờ đĩa, cùng lúc, chứ không phải một hệ số tiết kiệm cố định.
  - show: |-
      <p><b>Độ phức tạp thuật toán và cấu trúc Cây B-Tree trong cơ sở dữ liệu</b>:</p>
      <table class="t">
        <tr><th>viết trong dòng mã</th><th>đọc là</th></tr>
        <tr><td>log_m(N)</td><td>lôgarit cơ số m của N: nhân m với chính nó bao nhiêu lần thì tới N</td></tr>
        <tr><td>log_1000(10^7) = 7/3</td><td>1000 = 10^3, nên 1000^x = 10^7 khi 3x = 7, tức x = 7/3 ≈ 2,33 lần</td></tr>
        <tr><td>ceil(...)</td><td>làm tròn lên số nguyên gần nhất: ceil(2,33) = 3</td></tr>
        <tr><td>// ...</td><td>ghi chú cho người đọc, máy bỏ qua</td></tr>
      </table>
    focus:
    - 0
    - '2.3'
    say: Trước khi xem công thức, ta đọc cách viết. Lôgarit cơ số một nghìn của mười triệu là số lần nhân một nghìn để tới mười triệu, bằng 7 chia 3 xấp xỉ 2 phẩy 33, làm tròn lên ba tầng.
    clear: true
  - show: |-
      <pre><code>// Chiều cao cây B-Tree với hệ số phân nhánh m = 1000 (mỗi nút ~1000 con)
      H = ceil(log_m(N))     // ceil = làm tròn lên

      // Với 10 triệu bản ghi tài khoản ngân hàng (N = 10 000 000 = 10^7)
      log_1000(10^7) = 7/3 ≈ 2,33  →  H = 3 tầng</code></pre>
      <p><i>Chỉ mục</i> = bảng tra phụ giống mục lục sách: nhảy tới đúng dòng thay vì lật từng trang. Trực giác: tầng 1 chia 1000 nhánh, tầng 2 thành 1000 × 1000 = 1 triệu, tầng 3 thành 1 tỉ, đủ chứa 10 triệu. Ký hiệu O(N) = số bước tăng tỉ lệ với số dòng; O(log N) = số bước tăng rất chậm, dữ liệu lớn gấp 1000 lần chỉ thêm một tầng. Đọc một số dư: 3 lần đọc trên cây + 1 lần đọc dòng dữ liệu = 4 lần.</p>
    focus:
    - 2
    - 2
    - 2
    - 2
    - 2
    say: Chỉ mục giống mục lục của cuốn sách, giúp nhảy tới đúng dòng thay vì đọc từng dòng. Để tra sổ cái nhanh, các hệ quản trị dùng cây nhiều nhánh, mỗi nút có thể tới khoảng một nghìn con. Tầng một chia một nghìn nhánh, tầng hai thành một triệu, tầng ba thành một tỉ nhánh. Để tìm số dư, hệ thống đọc ba lần trên cây và một lần đọc dòng dữ liệu, tức tối đa khoảng bốn lần đọc đĩa. Độ phức tạp lôgarit nghĩa là số bước tăng rất chậm khi dữ liệu lớn lên.
    clear: true
- id: example
  kind: example
  title: 'Thực hành: Tối ưu Xử lý 10,000 Giao dịch Đồng thời với Luồng Ảo'
  checks:
  - 10000 * 2000 // 1000000 == 20
  - 10000 * 1 == 10000
  - 10000 // 20 == 500
  steps:
  - show: |-
      <p><b>Dữ liệu bài toán giả định (minh họa) cho một cổng thanh toán</b>:</p>
      <ul>
        <li>Lưu lượng đồng thời: $N = 10\,000$ kết nối chuyển tiền cần xử lý I/O mạng (I/O = vào ra: chờ mạng, chờ đĩa).</li>
        <li>Thời gian chờ hệ thống ngân hàng lõi (core banking) trả lời: $T = 50$ mili giây mỗi giao dịch.</li>
        <li>Hạ tầng máy chủ: RAM 16 GB, CPU 8 nhân vật lý.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét một bài toán giả định tại cổng thanh toán với mười nghìn kết nối đồng thời. Mỗi lệnh chuyển tiền mất năm mươi mili giây để chờ phản hồi từ hệ thống ngân hàng lõi. Hạ tầng máy chủ trang bị mười sáu gigabyte bộ nhớ và tám nhân xử lý.
  - show: |-
      <p><b>Bước 1: Phân tích khi dùng mô hình Luồng Hệ điều hành truyền thống</b>:</p>
      $$\text{Ngăn xếp dự trữ: } M \le 10\,000 \times 1\text{ MB} \approx 10\text{ GB}$$
      <div class="box pit">Bộ nhớ thật được cấp dần nên thường thấp hơn nhiều, nhưng hệ điều hành vẫn phải lập lịch (tính toán luồng nào chạy lúc nào) cho mười nghìn luồng; vì vậy bể luồng truyền thống thường bị giới hạn ở vài trăm luồng.</div>
    focus:
    - 0
    - 0
    say: Bước một, nếu dùng luồng truyền thống, mười nghìn luồng dự trữ tới khoảng mười gigabyte không gian ngăn xếp. Bộ nhớ thật được cấp dần nên thường ít hơn, nhưng hệ điều hành vẫn phải chia thời gian chạy cho mười nghìn luồng, nên bể luồng thường chỉ vài trăm.
    clear: true
  - show: |-
      <p><b>Bước 2: Phân tích khi dùng Luồng Ảo Java 21 (Virtual Threads)</b>:</p>
      $$\text{Giả định } S \approx 2\,000\text{ bytes: } M_{\text{vt}} \approx 10\,000 \times 2\,000 = 20\,000\,000\text{ bytes} \approx 20\text{ MB}$$
      <div class="box key">Tám nhân CPU chạy khoảng 8 luồng vận chuyển (Carrier Threads: luồng hệ điều hành thật "chở" các luồng ảo; luồng ảo nào đang chờ vào ra thì nhả luồng vận chuyển cho luồng khác). Bẫy ghim luồng ở Java 21: chặn vào ra bên trong <code>synchronized</code> (khối chỉ cho một luồng vào mỗi lúc, luồng khác phải chờ) giữ chặt luồng vận chuyển; thay bằng <code>ReentrantLock</code>, khoá tường minh tự gọi lock() rồi unlock(). Java 24 (JEP 491) đã gỡ phần lớn bẫy này.</div>
    focus:
    - 2
    - 3
    - 3
    - 3
    - 3
    - 3
    say: Bước hai, với luồng ảo, nếu giả định mỗi luồng tốn khoảng hai nghìn byte thì mười nghìn luồng cần khoảng hai mươi megabyte trên bộ nhớ động. Tám nhân xử lý chạy khoảng tám luồng vận chuyển, là các luồng hệ điều hành thật chở các luồng ảo, và luồng ảo nào đang chờ vào ra thì nhả chỗ cho luồng khác. Nhưng ở Java 21, nếu chặn vào ra bên trong khối đồng bộ hóa thì luồng ảo bị ghim chặt. Khối đồng bộ hóa là đoạn mã chỉ cho một luồng vào mỗi lúc. Vì vậy ta thay khối đó bằng khoá tường minh. Từ Java 24, phần lớn bẫy này đã được gỡ bỏ.
    clear: true
  - show: |-
      <p><b>Đọc trước mã Java sắp chạy</b> (mỗi câu lệnh kết thúc bằng dấu chấm phẩy):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>import java.util.concurrent.*;</td><td>lấy sẵn bộ công cụ chạy việc song song của Java (dấu * nghĩa là lấy cả gói)</td></tr>
        <tr><td>public class LuongAo { ... }</td><td>khung bắt buộc: một lớp tên LuongAo chứa mã; tên tệp phải trùng tên lớp</td></tr>
        <tr><td>public static void main(String[] args) throws Exception</td><td>main là nơi chương trình bắt đầu chạy; static = gọi không cần tạo đối tượng; void = không trả giá trị; String[] args = đối số gõ kèm lệnh (không dùng); throws Exception = cho lỗi thoát ra ngoài</td></tr>
        <tr><td>try (var ex = Executors.newVirtualThreadPerTaskExecutor())</td><td>tạo bộ chạy việc, mỗi việc một luồng ảo; var = Java tự suy ra kiểu của ex; hết khối try thì tự đợi mọi việc xong</td></tr>
      </table>
    focus:
    - 0
    - '2.2'
    - ['2.3', '2.4']
    - '2.5'
    clear: true
    say: Trước khi xem mã chạy, ta đọc từng phần. Dòng đầu lấy sẵn bộ công cụ chạy việc song song. Khung lớp và hàm chính là nơi chương trình bắt đầu chạy. Dòng thử tạo bộ chạy việc, mỗi việc một luồng ảo.
  - show: |-
      <p><b>Đọc tiếp mã Java</b>:</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>for (int i = 0; i &lt; 10_000; i++)</td><td>int i = 0: biến số nguyên i bắt đầu từ 0; i &lt; 10_000: lặp khi i nhỏ hơn mười nghìn (10_000 = 10000); i++: mỗi vòng tăng i thêm 1</td></tr>
        <tr><td>ex.submit(() -&gt; { Thread.sleep(50); return 1; });</td><td>giao một việc: ngủ 50 mili giây rồi trả về 1 (dấu -&gt; nghĩa là "việc cần làm là")</td></tr>
        <tr><td>System.out.println("...");</td><td>in một dòng chữ ra màn hình</td></tr>
      </table>
    focus:
    - '2.2'
    - ['2.3', '2.4']
    clear: true
    say: Vòng lặp đếm từ không, mỗi vòng thêm một, đủ mười nghìn vòng. Lệnh giao việc bảo luồng ngủ năm mươi mili giây, lệnh in hiện một dòng chữ.
  - show: '<p><b>Chạy thật trên Java 21: mười nghìn luồng ảo, mỗi luồng ngủ 50 mili giây</b></p><div class="code"><div>import java.util.concurrent.*;</div><div>public class LuongAo {</div><div>    public static void main(String[] args) throws Exception {</div><div>        try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {</div><div>            for (int i = 0; i &lt; 10_000; i++) {</div><div>                ex.submit(() -&gt; { Thread.sleep(50); return 1; });</div><div>            }</div><div>        }</div><div>        System.out.println("xong 10000 tac vu");</div><div>    }</div><div>}</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>xong 10000 tac vu</div></div>'
    focus:
    - 2
    - 2
    - 4
    clear: true
    say: Đây là mã Java chạy thật trên Java 21, bạn gõ lại từ trên xuống rồi chạy được. Máy tạo mười nghìn luồng ảo, mỗi luồng ngủ năm mươi mili giây để giả lập việc chờ ngân hàng lõi trả lời. Khối bao ngoài tự đợi mọi luồng xong rồi mới đi tiếp, nên chương trình in đúng một dòng xong mười nghìn tác vụ.
  - show: |-
      <p><b>Cách chạy mã Java trên máy bạn</b> (cần cài JDK 21):</p>
      <div class="box key">1. Lưu mã thành tệp <b>LuongAo.java</b> (tên tệp trùng tên lớp).<br>2. Mở cửa sổ lệnh ở cùng thư mục, gõ <code>javac LuongAo.java</code> để dịch.<br>3. Gõ <code>java LuongAo</code> để chạy; màn hình in: xong 10000 tac vu.</div>
    focus:
    - 0
    - 0
    say: Để chạy, lưu mã thành tệp trùng tên lớp, rồi mở cửa sổ lệnh ở cùng thư mục. Gõ lệnh dịch, sau đó gõ lệnh chạy, và màn hình in dòng xong mười nghìn tác vụ.
    clear: true
  - show: |-
      <p><b>Bước 3: Cấu hình chuẩn doanh nghiệp trên Spring Boot 3.2+</b>:</p>
      <pre><code># Kích hoạt luồng ảo toàn diện trong tệp cấu hình application.properties
      spring.threads.virtual.enabled=true</code></pre>
      <p>Spring Boot = bộ khung viết dịch vụ Java; Tomcat = máy chủ web chạy dịch vụ; request = một yêu cầu gửi tới. Tomcat phục vụ mỗi request bằng một luồng ảo; các thuộc tính bể luồng như <code>server.tomcat.threads.max</code> không còn tác dụng. Giới hạn đồng thời thực sự là bể kết nối DB (HikariCP: nhóm kết nối cơ sở dữ liệu mở sẵn, dùng lại).</p>
    focus:
    - 0
    - 0
    say: Bước ba, kỹ sư chỉ cần kích hoạt tính năng luồng ảo trong tệp cấu hình của bộ khung Spring Boot, bộ khung viết dịch vụ Java. Máy chủ web chạy dịch vụ sẽ xử lý mỗi yêu cầu bằng một luồng ảo riêng, còn giới hạn đồng thời thực sự nằm ở bể kết nối cơ sở dữ liệu.
    clear: true
    introduces:
    - int_hikari
- id: quymo
  kind: example
  title: 'Khi dữ liệu lớn dần: cây B-Tree thêm một tầng, quét toàn bảng tăng theo số dòng'
  checks:
  - 500 ** 3 >= 80_000_000 > 500 ** 2
  - math.ceil(math.log(10**4, 1000)) == 2
  - math.ceil(round(math.log(10**7, 1000), 9)) == 3
  - math.ceil(round(math.log(10**10, 1000), 9)) == 4
  steps:
  - show: |
      <p><b>Đọc trước đoạn mã Python sắp chạy</b> (Python là ngôn ngữ lập trình; máy chạy từng dòng từ trên xuống):</p>
      <table class="t">
        <tr><th>viết trong mã</th><th>đọc là</th></tr>
        <tr><td>m = 1000</td><td>đặt tên m cho số 1000 (số nhánh mỗi nút)</td></tr>
        <tr><td># ...</td><td>từ dấu # tới hết dòng là ghi chú cho người đọc, máy bỏ qua</td></tr>
        <tr><td>for n in (10**4, 10**7, 10**10):</td><td>thử lần lượt ba cỡ bảng; 10**4 là 10 mũ 4 = 10000</td></tr>
        <tr><td>cao, suc = 0, 1</td><td>gán cùng lúc: cao = 0, suc = 1</td></tr>
        <tr><td>while suc &lt; n:</td><td>lặp lại các dòng thụt vào chừng nào suc còn nhỏ hơn n</td></tr>
        <tr><td>suc *= m; cao += 1</td><td>suc = suc × m (nhân thêm một tầng); cao = cao + 1 (đếm tầng)</td></tr>
        <tr><td>print(...)</td><td>in các phần trong ngoặc ra màn hình, cách nhau một dấu cách</td></tr>
      </table>
    focus:
    - 0
    - ['2.3', '2.4']
    - ['2.5', '2.6']
    - '2.7'
    - '2.8'
    clear: true
    say: Trước khi chạy, ta đọc mã Python từng dòng. Dấu thăng mở đầu ghi chú, dòng lặp thử lần lượt ba cỡ bảng. Hai biến được gán cùng lúc, vòng lặp có điều kiện chạy chừng nào số nhánh gộp còn nhỏ hơn cỡ bảng. Mỗi vòng nhân thêm một nghìn và đếm thêm một tầng. Lệnh in hiện kết quả ra màn hình.
  - show: '<p><b>Chạy thật bằng Python: bảng lớn dần ×1, ×1 000, ×1 000 000</b></p><div class="code"><div>m = 1000   # so nhanh moi nut (so minh hoa)</div><div>for n in (10**4, 10**7, 10**10):</div><div>    cao, suc = 0, 1</div><div>    while suc &lt; n:</div><div>        suc *= m; cao += 1</div><div>    print(n, ''dong: cay cao'', cao, ''-&gt; doc'', cao + 1, ''lan, quet bang doc'', n, ''dong'')</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>10000 dong: cay cao 2 -&gt; doc 3 lan, quet bang doc 10000 dong</div><div>10000000 dong: cay cao 3 -&gt; doc 4 lan, quet bang doc 10000000 dong</div><div>10000000000 dong: cay cao 4 -&gt; doc 5 lan, quet bang doc 10000000000 dong</div></div>'
    focus:
    - 2
    - 4
    - 4
    - 4
    clear: true
    say: Đây là mã Python chạy thật, đếm số tầng của cây nhiều nhánh khi bảng lớn dần, mỗi nút có khoảng một nghìn nhánh, một số minh hoạ. Bảng mười nghìn dòng cần cây cao hai tầng, tức ba lần đọc, còn quét toàn bảng phải đọc mười nghìn dòng. Bảng lớn gấp một nghìn lần, mười triệu dòng, cây chỉ cao thêm một tầng, trong khi quét toàn bảng đọc mười triệu dòng. Bảng mười tỉ dòng cần cây bốn tầng, năm lần đọc.
  - show: |
      <table class="t">
        <tr><th>cỡ bảng</th><th>quét toàn bảng</th><th>tra bằng chỉ mục</th><th>điều gì đổi</th></tr>
        <tr><td>10 nghìn dòng (×1)</td><td>10 nghìn dòng</td><td>3 lần đọc</td><td>chưa thấy khác biệt: quét vẫn đủ nhanh</td></tr>
        <tr><td>10 triệu dòng (×1 000)</td><td>10 triệu dòng</td><td>4 lần đọc</td><td>quét tăng gấp 1 000 lần, cây chỉ thêm 1 lần đọc</td></tr>
        <tr><td>10 tỉ dòng (×1 000 000)</td><td>10 tỉ dòng</td><td>5 lần đọc</td><td>quét không còn dùng được; chỉ mục thành bắt buộc</td></tr>
      </table>
      <p>Đánh đổi: chỉ mục tốn chỗ đĩa và làm chậm mỗi lần ghi vì cây phải cập nhật, nên chỉ lập chỉ mục cho cột hay tra cứu.</p>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - 2
    clear: true
    say: Bảng này cho thấy điều gì đổi khi dữ liệu lớn dần. Ở mười nghìn dòng, quét toàn bảng vẫn đủ nhanh nên chưa thấy khác biệt. Ở mười triệu dòng, quét tăng gấp một nghìn lần còn cây chỉ thêm một lần đọc. Ở mười tỉ dòng, quét toàn bảng không còn dùng được và chỉ mục trở thành bắt buộc. Đánh đổi là chỉ mục tốn chỗ đĩa và làm chậm mỗi lần ghi, nên chỉ lập cho cột hay tra cứu.
- id: check
  kind: check
  title: 'Tự Kiểm tra: Đánh giá Độ phức tạp Thuật toán và B-Tree'
  checks:
  - 4 - 1 == 3
  - 1000 > 100
  steps:
  - show: |-
      <p><b>Tình huống phỏng vấn Senior</b>: Một bảng giao dịch có 50 triệu dòng dữ liệu. Nếu bảng chưa có chỉ mục, độ phức tạp tìm kiếm là bao nhiêu? Khi đánh chỉ mục bằng Cây B-Tree, ta tốn tối đa bao nhiêu lần đọc đĩa?</p>
      <ul>
        <li>(A) Không chỉ mục tốn O(log N), có chỉ mục tốn O(1).</li>
        <li>(B) Không chỉ mục quét toàn bảng O(N), có chỉ mục B-Tree tốn O(log N) với tối đa 3 đến 4 lần đọc đĩa.</li>
        <li>(C) Không chỉ mục tốn O(N^2), có chỉ mục tốn 100 lần đọc đĩa.</li>
      </ul>
      <p>O(1) nghĩa là số bước không đổi dù dữ liệu lớn bao nhiêu; O(N^2) nghĩa là số bước cỡ N nhân N.</p>
    focus:
    - 0
    - 0
    - 0
    say: Mời bạn trả lời câu hỏi chuyên sâu về cơ sở dữ liệu. Với bảng giao dịch năm mươi triệu dòng, việc không đánh chỉ mục sẽ dẫn tới độ phức tạp nào. Và khi đánh chỉ mục dạng cây nhiều nhánh, hệ thống mất bao nhiêu lần truy xuất đĩa cứng.
    pause: 15
  - show: |-
      <p><b>Đáp án chính xác: Lựa chọn (B)</b></p>
      <div class="box key">Giải thích bản chất: Khi không có chỉ mục, hệ quản trị bắt buộc phải quét tuần tự toàn bộ bảng với độ phức tạp tuyến tính O(N), tương đương duyệt 50 triệu dòng. Khi có chỉ mục B-Tree với hệ số phân nhánh lớn, độ phức tạp là lôgarit O(log N) và chỉ mất 3 đến 4 lần đọc đĩa cơ học!</div>
    focus:
    - 0
    - 0
    say: Đáp án chính xác là lựa chọn B vì khi không có chỉ mục, hệ thống phải quét tuần tự toàn bộ năm mươi triệu dòng. Do đó khi có chỉ mục cây nhiều nhánh, việc tìm kiếm đạt độ phức tạp lôgarit và chỉ mất từ ba đến bốn lần đọc đĩa.
    clear: true
- id: pitfall
  kind: pitfall
  title: 'Bẫy Nguy hiểm: Rò rỉ Bộ nhớ khi Dùng ThreadLocal với Bể luồng'
  steps:
  - show: |-
      <div class="box pit">Hiểm họa rò rỉ bộ nhớ với biến cục bộ luồng trong bể luồng tái sử dụng. ThreadLocal = biến mà mỗi luồng giữ một bản riêng; bể luồng = nhóm luồng được dùng lại cho hết yêu cầu này tới yêu cầu khác; <code>finally</code> = khối lệnh luôn chạy, dù có lỗi hay không.</div>
      <table class="t" style="margin-top: 10px;">
        <tr><th>nguy cơ tiềm ẩn</th><th>cơ chế rò rỉ</th><th>giải pháp khắc phục bắt buộc</th></tr>
        <tr><td>Rò rỉ bộ nhớ Heap</td><td>ThreadLocal không được giải phóng sau request</td><td>Luôn gọi lệnh remove() (xoá bản riêng của luồng) trong khối finally</td></tr>
        <tr><td>Lộ lọt thông tin</td><td>Luồng phục vụ phiên của khách hàng kế tiếp</td><td>Xóa sạch thông tin định danh và token cũ (token = chuỗi ký tự làm bằng chứng đã đăng nhập)</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    say: Một cạm bẫy kinh điển là việc dùng biến cục bộ luồng, tức biến mà mỗi luồng giữ một bản riêng, trong bể luồng tái sử dụng, tức nhóm luồng được dùng lại cho nhiều yêu cầu. Nếu kỹ sư quên gọi lệnh dọn dẹp sau khi xử lý xong, dữ liệu phiên làm việc cũ vẫn bám theo luồng và không được giải phóng. Điều này gây rò rỉ bộ nhớ và làm lộ lọt thông tin, vì yêu cầu của khách hàng kế tiếp chạy trên đúng luồng đó sẽ thấy dữ liệu cũ.
- id: quiz
  kind: quiz
  title: 'Trắc nghiệm: Phân biệt String và StringBuilder trong Bản tin Ngân hàng'
  checks:
  - 50 - 5 == 45
  - 21 > 8
  - sum(range(1000)) == 499500
  - sum(16 * 2 ** i for i in range(6)) == 1008
  steps:
  - show: |-
      <p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong xử lý bản tin tài chính đơn luồng với hàng triệu vòng lặp nối chuỗi XML (XML là văn bản chia thành các thẻ lồng nhau, hay dùng làm bản tin), tại sao ta không nên dùng phép cộng chuỗi String thông thường mà nên dùng StringBuilder?</p>
      <ul>
        <li><b>A</b>: String chiếm ít bộ nhớ hơn StringBuilder.</li>
        <li><b>B</b>: String là đối tượng bất biến (đã tạo thì không sửa tại chỗ được), mỗi phép cộng chuỗi sao chép lại chuỗi cũ thành một đối tượng mới trên Heap, còn StringBuilder là khả biến giúp nối trực tiếp trong mảng đệm nội bộ.</li>
        <li><b>C</b>: StringBuilder an toàn đa luồng hơn String.</li>
        <li><b>D</b>: Cả hai có hiệu năng hoàn toàn tương đương nhau.</li>
      </ul>
    focus:
    - 0
    - 0
    say: Xin mời bạn suy nghĩ câu hỏi về tối ưu hóa bộ nhớ khi xử lý bản tin ngân hàng. Phép nối chuỗi thông thường khác biệt thế nào so với bộ dựng chuỗi khả biến.
    pause: 15
  - show: |-
      <div class="box key"><b>Đáp án chính xác là B</b>!</div>
      <p><b>Bước 1 — Cơ chế bất biến của chuỗi String trong Java</b>:</p>
      <table class="t">
        <tr><th>thao tác</th><th>cơ chế bộ nhớ Heap</th><th>hậu quả tài nguyên</th></tr>
        <tr><td>Cộng chuỗi String (s += part: nối thêm part vào s)</td><td>Mỗi lần sao chép lại toàn bộ chuỗi cũ</td><td>Chi phí O(n²), nhiều rác ngắn hạn làm Minor GC dày hơn</td></tr>
        <tr><td>Dùng StringBuilder (sb.append: nối vào bộ dựng sb)</td><td>Nối vào mảng đệm, chỉ cấp phát lại khi đầy</td><td>Chi phí tuyến tính (khấu hao: chi phí trung bình mỗi lần, giải thích ngay dưới bảng), ít rác hơn</td></tr>
      </table>
      <p><i>Khấu hao</i> = lấy tổng chi phí chia đều cho mọi lần làm. Nối 1000 ký tự, mỗi lần một ký tự: cộng String chép 0 + 1 + … + 999 = 499 500 ký tự; StringBuilder khoảng gấp đôi mảng đệm khi đầy (tính như đúng gấp đôi) chép 16 + 32 + … + 512 = 1 008 ký tự, chia 1000 lần nối còn khoảng 1 ký tự mỗi lần.</p>
    focus:
    - 0
    - '3.2'
    - '3.2'
    - '3.3'
    - 4
    - 4
    say: Đáp án chính xác là phương án B. Chuỗi trong Java là đối tượng bất biến, nghĩa là đã tạo thì không sửa tại chỗ được, nên mỗi lần nối chuỗi sẽ cấp phát một vùng nhớ mới trên bộ nhớ động. Trong vòng lặp, mỗi lần nối lại sao chép toàn bộ chuỗi cũ, nên chi phí tăng theo bình phương và sinh nhiều rác ngắn hạn khiến các đợt thu gom rác nhỏ dày đặc hơn. Bộ dựng chuỗi chỉ cấp lại mảng đệm khi đầy, và khoảng gấp đôi cỡ mỗi lần. Khấu hao là lấy tổng chi phí chia đều cho mọi lần nối. Nối một nghìn ký tự, bộ dựng chỉ sao chép khoảng một nghìn ký tự, còn cộng chuỗi sao chép gần năm trăm nghìn.
    clear: true
  - show: |-
      <p><b>Bước 2 — Kết luận thực chiến cho hệ thống ngân hàng</b>:</p>
      <div class="box key">Trong dịch vụ chuyển đổi bản tin như ISO 8583 (chuẩn bản tin giao dịch thẻ) hoặc OFS (bản tin dạng chữ của hệ lõi Temenos T24), dùng StringBuilder với dung lượng khởi tạo ước tính trước để giảm sao chép và rác; thông lượng thực tế phải đo bằng kiểm thử tải.</div>
    focus:
    - 0
    - 0
    say: Bước hai, trong mọi dịch vụ chuyển đổi bản tin tài chính, ta luôn sử dụng bộ dựng chuỗi khả biến với dung lượng dự tính trước. Kỹ thuật này giảm sao chép và giảm rác, còn thông lượng thực tế phải đo bằng kiểm thử tải.
    clear: true
    introduces:
    - int_ofs
    - int_iso8583
- id: practice
  kind: practice
  title: 'Tự làm: trả lời một câu phỏng vấn có số về chỉ mục và bộ nhớ luồng'
  steps:
  - show: |
      <p><b>Đề</b> (giấy bút, số minh hoạ). Người phỏng vấn hỏi: &laquo;Bảng giao dịch có <b>80 000 000</b> dòng, mỗi nút chỉ mục chứa tối đa <b>500</b> nhánh. Cổng có <b>2 000</b> tác vụ chờ vào ra cùng lúc; mỗi luồng hệ điều hành dự trữ <b>1 MB</b> ngăn xếp, mỗi luồng ảo khoảng <b>2 000 byte</b>. Bạn trả lời bằng số thế nào?&raquo;</p>
      <p>Viết bốn dòng: chiều cao cây; số lần đọc một dòng (cây cộng một lần đọc dòng dữ liệu); tổng ngăn xếp luồng hệ điều hành; tổng ngăn xếp luồng ảo.</p>
      <p class="note">Định dạng bốn dòng nằm trong <code>de.md</code>.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 180
    say: Bây giờ tới phần bạn tự làm bằng giấy bút, với số liệu mới trên màn hình. Bảng tám mươi triệu dòng, mỗi nút chỉ mục năm trăm nhánh, thì cây cao mấy tầng và một lần tra đọc mấy lần. Rồi tính tổng ngăn xếp của hai nghìn luồng hệ điều hành, mỗi luồng một megabyte, so với hai nghìn luồng ảo, mỗi luồng khoảng hai nghìn byte. Hãy dừng video và tự làm, đừng chép lại ví dụ.
  - show: '<p><b>Đáp án để đối chiếu</b></p><div class="code"><div>chieu cao cay: 3</div><div>so lan doc mot dong: 4</div><div>ngan xep luong he dieu hanh: 2000 MB</div><div>ngan xep luong ao: 4000000 byte</div></div><p class="note">Bài giấy bút: so từng dòng với <code>labs/INT/L01/loi_giai.md</code> (có cả cách tính).</p>'
    focus:
    - 0
    clear: true
    say: Đây là đáp án để đối chiếu, bài này làm bằng giấy bút, nên bạn so từng dòng với lời giải trong thư mục thực hành, trong đó có cả cách tính.
  - show: |
      <div class="box key"><b>Nếu kẹt:</b> chiều cao = số lần nhân 500 cho tới khi đạt ít nhất 80 triệu (500 × 500 = 250 000 chưa đủ). Số lần đọc = chiều cao + 1. Ngăn xếp = số luồng × kích thước mỗi luồng.
      Lời giải đầy đủ ở <code>labs/INT/L01/loi_giai.md</code> — chỉ mở sau khi bạn đã thử.</div>
    clear: true
    say: Nếu kẹt, chiều cao là số lần nhân năm trăm cho tới khi đạt ít nhất tám mươi triệu, vì năm trăm nhân năm trăm mới được hai trăm năm mươi nghìn, chưa đủ. Số lần đọc bằng chiều cao cộng một. Ngăn xếp bằng số luồng nhân kích thước mỗi luồng.
