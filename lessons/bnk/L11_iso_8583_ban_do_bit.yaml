- id: formula
  kind: formula
  title: 'Suy ra từng bước: dựng và đọc bản đồ bit'
  checks:
  - 2 ** 62 + 2 ** 61 + 2 ** 60 + 2 ** 53 == 0x7020000000000000
  - format(2 ** 62 + 2 ** 61 + 2 ** 60 + 2 ** 53, '016X') == '7020000000000000'
  - 'alg.bnk_iso_unpack(alg.bnk_iso_pack(''0200'', {2: ''4111111111111111'', 3: ''000000'',
    4: ''000000500000'', 11: ''123456''}))[1][2] == ''4111111111111111'''
  steps:
  - show: '<p><b>Bước 1.</b> Bản đồ có $64$ bit. Bit của trường $i$ nằm ở vị trí $i$
      tính từ trái, nên có giá trị $2^{64 - i}$.</p>

      <span class=''note''>Làm thử: trường $2$ cho $2^{62}$, trường $3$ cho $2^{61}$,
      trường $4$ cho $2^{60}$, trường $11$ cho $2^{53}$.</span>

      '
    focus:
    - 1
    - 2
    say: Bước một, vì bản đồ có sáu mươi bốn bit và bit của trường i nằm ở vị trí
      i tính từ trái, nên nó có giá trị hai mũ sáu mươi bốn trừ i. Làm thử, trường
      hai cho hai mũ sáu mươi hai, trường ba cho hai mũ sáu mươi mốt, trường bốn cho
      hai mũ sáu mươi, trường mười một cho hai mũ năm mươi ba.
  - show: '<p><b>Bước 2.</b> Cộng các giá trị rồi đổi sang hex: byte đầu <b>0x70</b>
      (bit 2, 3, 4), byte tiếp <b>0x20</b> (bit 11), các byte còn lại bằng $0$.</p>

      <span class=''note''>Làm thử: bản đồ = <code>7020000000000000</code>, đủ 16
      chữ số hex.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước hai, vì mỗi chữ số thập lục phân tương ứng bốn bit, nên ta đổi từng
      nhóm. Khúc đầu là bảy không từ các bit hai, ba, bốn. Khúc thứ hai là hai không
      từ bit mười một. Các byte còn lại bằng không. Làm thử, bản đồ là bảy không hai
      không rồi mười hai chữ số không, đủ mười sáu chữ số thập lục phân.
  - show: '<p><b>Bước 3.</b> Đọc ngược: duyệt trường $2..64$, bit nào bật thì đọc
      trường đó. Trường cố định đọc đúng số ký tự; <b>LLVAR</b> đọc $2$ chữ số độ
      dài rồi đọc đúng ngần ấy ký tự.</p>

      <span class=''note''>Làm thử: sau bản đồ đọc “16” rồi lấy tiếp 16 ký tự làm
      số thẻ. Bắt đầu từ trường 2 vì bit 1 chỉ báo bản đồ thứ hai.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, vì ta biết trường nào có mặt, nên đọc ngược bằng cách duyệt các
      trường từ trường hai, bit nào bật thì đọc trường đó. Bit một không phải trường
      dữ liệu, nó chỉ báo có bản đồ thứ hai hay không. Trường cố định đọc đúng số
      ký tự đã biết. Trường đổi độ dài thì đọc hai chữ số báo độ dài, rồi đọc đúng
      ngần ấy ký tự. Làm thử, sau bản đồ đọc mười sáu, rồi lấy tiếp mười sáu ký tự
      làm số thẻ.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 'alg.bnk_iso_pack(''0200'', {2: ''4111111111111111'', 3: ''000000'', 4: ''000000500000'',
    11: ''123456''}) == ''02007020000000000000164111111111111111000000000000500000123456'''
  - 2 + 16 == 18
  - len('000000500000') == 12
  - 4 + 16 + 18 + 6 + 12 + 6 == 62 == len('02007020000000000000164111111111111111000000000000500000123456')
  - int(alg.bnk_iso_unpack('02007020000000000000164111111111111111000000000000500000123456')[1][4])
    == 500000
  steps:
  - show: '<p>Dựng bản tin <code>0200</code> với trường $2$ (số thẻ thử), $3$, $4$
      ($500\,000$ đồng), $11$. Số thẻ <code>4111111111111111</code> là số thử, không
      phải thẻ thật.</p>

      $$① \; \text{bản đồ} = 2^{62} + 2^{61} + 2^{60} + 2^{53} = \hl{\mathtt{7020000000000000}}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Ta dựng một bản tin. Mã không hai không không, trường hai là số thẻ thử,
      trường ba, trường bốn là năm trăm nghìn đồng, và trường mười một. Số thẻ này
      là số thử, không phải thẻ thật. Phép tính thứ nhất, bản đồ bằng tổng bốn lũy
      thừa của hai, là hai mũ sáu mươi hai, sáu mươi mốt, sáu mươi và năm mươi ba.
      Kết quả là bảy không hai không, rồi các chữ số không.
  - show: '<p>Trường $2$ là LLVAR: $16$ ký tự nên báo <code>16</code>.</p>

      $$② \; \text{độ dài trường 2} = 2 + 16 = \hl{18}\ \text{ký tự}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ hai, trường hai là loại độ dài thay đổi. Số thẻ có mười sáu
      ký tự nên số báo độ dài là mười sáu. Cả trường chiếm hai cộng mười sáu, bằng
      mười tám ký tự.
  - show: '<p>Trường $4$ có $12$ chữ số, số tiền $500\,000$ đồng viết thành <code>000000500000</code>.
      Với tiền đồng, đơn vị nhỏ nhất là $1$ đồng.</p>

      $$③ \; \text{độ dài trường 4} = \hl{12}\ \text{ký tự}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, trường bốn có mười hai chữ số, năm trăm nghìn đồng viết
      thành sáu chữ số không rồi năm trăm nghìn. Với đồng Việt Nam, đơn vị nhỏ nhất
      là một đồng. Độ dài trường bốn là mười hai ký tự.
  - show: '<p>Cộng độ dài các khúc: MTI $4$, bản đồ $16$, trường $2$: $18$, trường
      $3$: $6$, trường $4$: $12$, trường $11$: $6$.</p>

      $$④ \; 4 + 16 + 18 + 6 + 12 + 6 = \hlg{62}\ \text{ký tự}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ tư, cộng độ dài các khúc. Mã loại bản tin bốn, bản đồ mười
      sáu, trường hai mười tám, trường ba sáu, trường bốn mười hai, trường mười một
      sáu. Tổng là sáu mươi hai ký tự.
  - show: '<p>Đọc ngược bản tin $62$ ký tự: bản đồ cho biết có trường $2, 3, 4, 11$;
      đọc theo thứ tự ra lại đúng số thẻ, mã xử lý, số tiền và mã vết.</p>

      $$⑤ \; \text{số tiền đọc lại} = \hlg{500\,000}\ \text{đồng}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Phép tính thứ năm, đọc ngược bản tin sáu mươi hai ký tự. Bản đồ cho biết
      có bốn trường. Đọc theo thứ tự thì ra lại đúng số thẻ, mã xử lý, số tiền và
      mã vết. Số tiền đọc lại là năm trăm nghìn đồng.
- id: chay_that
  kind: example
  title: 'Chạy thật: dựng và đọc một bản tin ISO 8583'
  steps:
  - show: '<p><b>Dựng bản đồ bit từ các trường 2, 3, 4, 11</b></p><div class="code"><div>truong
      = {2: "4111111111111111", 3: "000000", 4: "000000500000", 11: "123456"}</div><div>bit
      = 0</div><div><span class="kw">for</span> so <span class="kw">in</span> truong:</div><div>    bit
      |= 1 &lt;&lt; (64 - so)                     <span class="cm"># bật bit thứ so
      của bản đồ</span></div><div>bando = "%016X" % bit                         <span
      class="cm"># 64 bit viết bằng 16 chữ số hex</span></div><div>print(bando)</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta dựng một bản tin thật bằng chương trình ngắn. Từ điển giữ bốn trường có
      mặt là số thẻ, mã xử lý, số tiền và số theo dõi. Với mỗi trường, ta bật bit
      tương ứng trong một số sáu mươi bốn bit, bằng cách dịch một sang trái sáu mươi
      tư trừ số trường. Rồi ta viết số đó bằng mười sáu chữ số thập lục phân, gọi
      là bản đồ bit.
  - show: '<p><b>Ghép bản tin: mã loại, bản đồ, rồi các trường</b></p><div class="code"><div>tin
      = "0200" + bando + "16" + truong[2] + truong[3] + truong[4] + truong[11]</div><div>print(tin)</div><div>print(len(tin))</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>7020000000000000</div><div>02007020000000000000164111111111111111000000000000500000123456</div><div>62</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bản tin ghép mã loại không hai không không, bản đồ bit, rồi các trường theo
      thứ tự tăng dần. Trường số thẻ dài biến đổi nên có hai chữ số báo độ dài là
      mười sáu đứng trước. Khi chạy thật, bản đồ bit là bảy không hai không rồi toàn
      số không, đúng như phép tính tay. Bản tin dài sáu mươi hai ký tự.
  - show: <p><b>Đọc ngược bản tin đó</b></p><div class="code"><div>tin = "02007020000000000000164111111111111111000000000000500000123456"</div><div>bando
      = int(tin[4:20], 16)                    <span class="cm"># đọc 16 chữ số hex
      sau MTI</span></div><div>print([k <span class="kw">for</span> k <span class="kw">in</span>
      range(1, 65) <span class="kw">if</span> bando &gt;&gt; (64 - k) &amp; 1])</div><div>vi_tri
      = 20</div><div>dai = int(tin[vi_tri:vi_tri + 2])             <span class="cm">#
      trường 2 có hai chữ số báo độ dài</span></div><div>print(tin[vi_tri + 2:vi_tri
      + 2 + dai])</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>[2,
      3, 4, 11]</div><div>4111111111111111</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bây giờ đọc ngược. Ta đọc mười sáu chữ số sau mã loại, rồi liệt kê các bit
      đang bật. Khi chạy thật, được hai, ba, bốn và mười một, đúng bốn trường đã dựng.
      Rồi ta đọc hai chữ số báo độ dài ở vị trí hai mươi, và cắt đúng số thẻ ra. Vòng
      đi vòng về cho lại dữ liệu ban đầu.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: vòng đi vòng về'
  checks:
  - 'alg.bnk_iso_unpack(alg.bnk_iso_pack(''0210'', {3: ''000000'', 4: ''000000500000'',
    11: ''123456'', 39: ''00''})) == (''0210'', {3: ''000000'', 4: ''000000500000'',
    11: ''123456'', 39: ''00''})'
  - 'alg.bnk_iso_pack(''0210'', {3: ''000000'', 4: ''000000500000'', 11: ''123456'',
    39: ''00''})[4:20] == ''3020000002000000'''
  steps:
  - show: '<p>Đường khác: không tin phép tính tay. Đóng gói rồi <b>đọc ngược</b> bằng
      chương trình, và so với dữ liệu ban đầu.</p>

      $$\text{đóng gói} \to \text{đọc ngược} = \text{dữ liệu ban đầu}\quad \hlg{\text{khớp}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Kiểm bằng đường khác. Vì không nên chỉ tin phép tính tay, ta đóng gói rồi
      đọc ngược bằng chương trình, và so với dữ liệu ban đầu. Kết quả đọc lại khớp
      từng trường một.
  - show: <table class='t'><tr><th>trường</th><th>tên</th><th>kiểu</th><th>ví dụ</th></tr><tr><td>2</td><td>số
      thẻ (PAN)</td><td>LLVAR, tối đa 19</td><td>4111111111111111</td></tr><tr><td>3</td><td>mã
      xử lý (loại giao dịch; 00… = mua hàng)</td><td>6 chữ số</td><td>000000</td></tr><tr><td>4</td><td>số
      tiền</td><td>12 chữ số</td><td>000000500000</td></tr><tr><td>11</td><td>mã vết
      (STAN)</td><td>6 chữ số</td><td>123456</td></tr><tr><td>39</td><td>mã trả lời</td><td>2
      ký tự</td><td>00 = chấp nhận</td></tr></table>
    say: Bảng này liệt kê vài trường hay gặp. Trường hai là số thẻ, độ dài thay đổi.
      Trường ba là mã xử lý, cho biết loại giao dịch, ví dụ hai chữ số đầu không không
      là mua hàng, trường bốn là số tiền, trường mười một là mã vết. Trường ba mươi
      chín là mã trả lời, không không nghĩa là chấp nhận.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - int('000000500000') / 100 == 5000
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Đọc <code>000000500000</code>
      thành “500 nghìn” mà quên <b>đơn vị nhỏ nhất theo loại tiền</b>. Với đồng là
      một đồng, nhưng loại tiền có số lẻ thì cùng dãy số có nghĩa khác: đô la Mỹ có
      2 chữ số lẻ, nên <code>000000500000</code> là $500\,000 / 100 = 5\,000$ đô la.</div>'
    say: Lỗi thứ nhất, của người mới. Đọc dãy sáu chữ số không rồi năm trăm nghìn
      thành năm trăm nghìn mà quên đơn vị nhỏ nhất theo loại tiền. Với đồng là một
      đồng, nhưng loại tiền có số lẻ thì cùng dãy số có nghĩa khác. Ví dụ đô la Mỹ
      có hai chữ số lẻ, đơn vị nhỏ nhất là một xu, nên cùng dãy đó chỉ là năm trăm
      nghìn chia một trăm, bằng năm nghìn đô la.
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Ghi
      nguyên số thẻ vào nhật ký</b> khi gỡ lỗi. Số thẻ là dữ liệu nhạy cảm; nhật ký
      phải che, ví dụ 6 số đầu và 4 số cuối.</div>
    say: Lỗi thứ hai, của người đã đi làm, là ghi nguyên số thẻ vào nhật ký khi gỡ
      lỗi. Số thẻ là dữ liệu nhạy cảm, nên nhật ký phải che, ví dụ chỉ giữ sáu số
      đầu và bốn số cuối.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Coi mọi đối tác dùng
      cùng một bảng trường. Cùng ISO 8583 nhưng <b class="red">mỗi mạng có đặc tả
      riêng</b>: trường nào dùng, độ dài, bảng mã ký tự. Luôn đọc đặc tả kết nối chính
      thức.</div>'
    say: Lỗi thứ ba, cũng của người đã đi làm, là coi mọi đối tác dùng cùng một bảng
      trường. Cùng chuẩn nhưng mỗi mạng có đặc tả riêng, gồm trường nào dùng, độ dài,
      bảng mã ký tự. Luôn đọc đặc tả kết nối chính thức.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - format(2 ** 61 + 2 ** 60 + 2 ** 53, '016X') == '3020000000000000'
  - 'alg.bnk_iso_pack(''0200'', {3: ''000000'', 4: ''000000500000'', 11: ''123456''})[4:20]
    == ''3020000000000000'''
  - '4 + 16 + 6 + 12 + 6 == 44 == len(alg.bnk_iso_pack(''0200'', {3: ''000000'', 4:
    ''000000500000'', 11: ''123456''}))'
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Bản
      tin chỉ có trường 3, 4, 11. Bản đồ bit là gì?</td></tr><tr><td>2</td><td>Tổng
      độ dài bản tin MTI 0200 đó (trường 3: 6, trường 4: 12, trường 11: 6)?</td></tr><tr><td>3</td><td>Quyết
      định: gỡ lỗi cần xem số thẻ, có ghi nguyên vào nhật ký không?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, bản tin chỉ có trường ba, bốn và
      mười một, bản đồ bit là gì? Câu hai, tổng độ dài bản tin đó là bao nhiêu, biết
      trường ba dài sáu, trường bốn mười hai, trường mười một sáu? Câu ba, khi gỡ
      lỗi cần xem số thẻ, có ghi nguyên vào nhật ký không? Hãy dừng video và làm ra
      giấy.
  - show: '<p>Câu 1: $2^{61} + 2^{60} + 2^{53}$. Byte đầu: bit $3, 4$ → $0011\,0000
      = 0x30$. Byte hai: bit $11$ → $0x20$.</p>

      $$\hl{\mathtt{3020000000000000}}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Hai mũ sáu mươi mốt, cộng hai mũ sáu mươi, cộng hai mũ năm
      mươi ba. Khúc đầu có bit ba và bốn bật, nên là không không một một, không không
      không không, tức ba không. Khúc hai có bit mười một bật, tức hai không.
    clear: true
  - show: $$4 + 16 + 6 + 12 + 6 = \hlg{44}\ \text{ký tự}$$
    say: Đáp án câu hai. Mã loại bản tin bốn, bản đồ mười sáu, rồi sáu, mười hai,
      sáu. Tổng là bốn mươi bốn ký tự.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>ghi
      nguyên số thẻ</td><td>gỡ lỗi nhanh</td><td>rò rỉ dữ liệu thẻ, vi phạm yêu cầu
      bảo mật</td></tr><tr><td>che số thẻ (6 đầu + 4 cuối), giữ mã vết</td><td>vẫn
      tra soát được qua mã vết</td><td>khó tìm hơn một chút</td></tr></table>
    say: Đáp án câu ba. Không ghi nguyên số thẻ. Hãy che, chỉ giữ sáu số đầu và bốn
      số cuối, và dùng mã vết để tra soát. Ghi nguyên thì gỡ lỗi nhanh nhưng rò rỉ
      dữ liệu thẻ.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: mỗi giao dịch vài chục byte, nhân lên thành hàng trăm megabyte mỗi
    giây'
  checks:
  - 62 + 46 == 108
  - 108 * 100 == 10_800
  - 108 * 10_000 == 1_080_000
  - 108 * 1_000_000 == 108_000_000
  - 10_800 * 86_400 == 933_120_000
  - round(1_080_000 * 86_400 / 10**9, 1) == 93.3
  - round(108_000_000 * 86_400 / 10**12, 2) == 9.33
  steps:
  - show: '<p>Mỗi giao dịch gồm một yêu cầu $62$ byte và một phản hồi $46$ byte, dạng
      chữ như bài: $108$ byte. Dạng nhị phân (hai chữ số hex gộp thành một byte) khoảng
      một nửa <i>(số minh hoạ)</i>.</p><table class=''t''><tr><th>tải</th><th>giao
      dịch mỗi giây</th><th>băng thông dạng chữ</th><th>dạng nhị phân (≈ nửa)</th><th>nhật
      ký dạng chữ mỗi ngày</th></tr><tr><td>×1</td><td>100</td><td>10,8 KB mỗi giây</td><td>5,4
      KB mỗi giây</td><td>933 MB</td></tr><tr><td>×100</td><td>10 000</td><td>1,08
      MB mỗi giây</td><td>0,54 MB mỗi giây</td><td><b>93,3 GB</b></td></tr><tr><td>×10
      000</td><td>1 000 000</td><td><b>108 MB mỗi giây</b></td><td>54 MB mỗi giây</td><td><b>9,33
      TB</b></td></tr></table>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Mỗi giao dịch gồm một yêu cầu sáu mươi hai byte và một phản hồi bốn mươi
      sáu byte, tổng một trăm linh tám byte ở dạng chữ. Dạng nhị phân gộp hai chữ
      số thập lục phân thành một byte, nên khoảng một nửa. Đây là số minh hoạ. Với
      một trăm giao dịch mỗi giây, băng thông chỉ mười phẩy tám ki lô byte mỗi giây.
      Tải tăng một trăm lần là hơn một mê ga byte mỗi giây. Tải tăng mười nghìn lần
      là một trăm linh tám mê ga byte mỗi giây, và nhật ký dạng chữ mỗi ngày lên tới
      chín phẩy ba nghìn tỉ byte.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Ghi nguyên bản tin
      dạng chữ vào nhật ký, kể cả số thẻ: ở ×1 là 933 MB mỗi ngày, dễ xử lý; ở ×10
      000 là 9,33 TB mỗi ngày, không ai đọc nổi, và mỗi dòng còn chứa số thẻ, vi phạm
      quy tắc che số thẻ.</div>

      <div class="box key"><b>Đánh đổi:</b> dạng nhị phân gọn hơn nhưng khó đọc khi
      gỡ lỗi; nhật ký chỉ nên ghi trường cần thiết, <b>che số thẻ</b> (ví dụ chỉ giữ
      6 số đầu và 4 số cuối), lấy mẫu khi tải cao, và nén hay xoay vòng theo ngày.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Câu hỏi là giải pháp cũ sẽ gãy ở chỗ nào khi tải tăng lên. Ghi nguyên bản
      tin dạng chữ vào nhật ký, kể cả số thẻ. Ở tải gốc là chín trăm ba mươi ba mê
      ga byte mỗi ngày, dễ xử lý. Ở tải gấp mười nghìn lần là chín phẩy ba nghìn tỉ
      byte mỗi ngày, không ai đọc nổi, và mỗi dòng còn chứa số thẻ, vi phạm quy tắc
      che số thẻ. Đánh đổi là dạng nhị phân gọn hơn nhưng khó đọc khi gỡ lỗi. Nhật
      ký chỉ nên ghi trường cần thiết, che số thẻ, lấy mẫu khi tải cao, và nén hay
      xoay vòng theo ngày.
- id: practice
  kind: practice
  title: 'Tự làm: bản đồ bit và độ dài của phản hồi 0210'
  steps:
  - show: '<p><b>Đề</b>: phản hồi <code>0210</code> có trường <code>3</code>=<code>"000000"</code>,
      <code>4</code>=<code>"000000250000"</code>, <code>11</code>=<code>"000042"</code>,
      <code>39</code>=<code>"00"</code>. Viết <code>iso_lab.py</code>:</p>

      <ol><li>dựng bản đồ bit (bật <code>1 &lt;&lt; (64 - số trường)</code>), in <code>"%016X"</code></li>

      <li>in độ dài cả bản tin: 4 + 16 + các trường nối theo thứ tự tăng dần</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    pause: 150
    say: 'Bây giờ tới phần bạn tự làm. Một phản hồi không hai một không có bốn trường:
      ba, bốn, mười một và ba mươi chín, tất cả có độ dài cố định. Hãy viết chương
      trình dựng bản đồ bit bằng cách bật bit cho từng trường, in nó bằng mười sáu
      chữ số thập lục phân. Rồi in độ dài của cả bản tin, gồm mã loại, bản đồ và các
