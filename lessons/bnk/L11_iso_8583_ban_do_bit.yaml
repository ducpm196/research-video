scenes:
- id: hook
  kind: hook
  title: Vì sao một chuỗi ký tự vô nghĩa lại là một giao dịch thẻ?
  steps:
  - show: '<p>Một bản tin ISO 8583 (chuẩn quốc tế cho bản tin giao dịch thẻ) trông
      như dãy số dài, ở đây thêm dấu cách cho dễ đọc:</p>

      <p><code>0200 7020000000000000 16 4111111111111111 000000 000000500000 123456</code></p>

      <div class="box key">Bên nhận biết trường nào ở đâu nhờ <b>bản đồ bit</b> nằm
      ngay sau mã loại bản tin.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Chào bạn, ISO tám nghìn năm trăm tám mươi ba là chuẩn quốc tế cho bản tin
      giao dịch thẻ. Một bản tin như vậy trông như một dãy số dài vô nghĩa, và trên
      màn hình ta thêm dấu cách cho dễ đọc. Nhưng bên nhận đọc ra được số thẻ, số
      tiền, mã vết, nhờ bản đồ bit nằm ngay sau mã loại bản tin. Hôm nay ta dựng một
      bản tin từ đầu, rồi đọc ngược lại.
  - show: <table class='t'><tr><th>ý hỏi</th><th>bài này trả lời</th></tr><tr><td>làm
      sao biết bản tin có những trường nào</td><td>bản đồ 64 bit, bit nào bật thì
      trường đó có mặt</td></tr><tr><td>làm sao biết mỗi trường dài bao nhiêu</td><td>trường
      cố định thì biết trước, trường đổi độ dài thì có số báo độ dài đứng trước</td></tr></table>
    say: Hôm nay ta trả lời hai câu. Làm sao biết bản tin có những trường nào, nhờ
      bản đồ sáu mươi bốn bit. Làm sao biết mỗi trường dài bao nhiêu, nhờ độ dài cố
      định hoặc số báo độ dài đứng trước. Lưu ý, mỗi mạng thanh toán có đặc tả riêng,
      kể cả NAPAS, công ty chuyển mạch thẻ và thanh toán liên ngân hàng của Việt Nam.
      Bài này dạy nguyên lý chung, không phải đặc tả kết nối của riêng mạng nào.
- id: prereq
  kind: prereq
  title: 'Trước hết: bảy điều cần hiểu'
  checks:
  - 0 * 8 + 1 * 4 + 1 * 2 + 1 * 1 == 7 == int('0111', 2)
  - format(7, '04b') == '0111' and format(2, '04b') == '0010'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Nhị phân</td><td>chỉ có hai chữ số 0 và 1, mỗi chữ số là một bit</td><td>0111
      = 7</td></tr><tr><td>② Thập lục phân (hex)</td><td>16 chữ số: 0–9 rồi A–F; một
      chữ số hex = 4 bit</td><td>7 = 0111, 2 = 0010, A = 1010</td></tr><tr><td>③ Byte</td><td>nhóm
      8 bit, viết bằng đúng 2 chữ số hex</td><td>0111 0000 = 0x70 (0x: dấu báo số
      hex)</td></tr><tr><td>④ Lũy thừa của hai</td><td>bit thứ k từ phải sang trái
      (đếm từ 0) có giá trị 2 mũ k</td><td>2 mũ 3 = 8</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Nhị phân chỉ có hai chữ số không và một,
      mỗi chữ số là một bit. Thập lục phân có mười sáu chữ số, từ không tới chín rồi
      A tới F, và mỗi chữ số tương ứng bốn bit. Một byte là nhóm tám bit, nên viết
      bằng đúng hai chữ số thập lục phân. Hai ký tự không và x đứng trước chỉ để báo
      đây là số thập lục phân. Còn bit thứ k từ phải sang, đếm từ không, có giá trị
      hai mũ k.
  - show: '<table class=''t''><tr><th>thêm ba điều để đọc mã</th><th>nghĩa</th><th>ví
      dụ</th></tr><tr><td>⑤ Phép dịch bit</td><td><code>1 &lt;&lt; n</code>: số có
      đúng một bit 1 ở vị trí n (tính từ phải, từ 0); <code>x &gt;&gt; n</code>: dời
      n bit sang phải; <code>x | y</code> bật bit; <code>&amp;</code> giữ bit chung</td><td><code>1
      &lt;&lt; 3</code> = 8</td></tr><tr><td>⑥ Từ điển và vòng lặp</td><td><code>{khoá:
      giá trị}</code> là bảng tra; <code>for k in d:</code> duyệt từng khoá; <code>s[a:b]</code>
      cắt chuỗi từ vị trí a tới trước b</td><td><code>"abcdef"[1:4]</code> = <code>"bcd"</code></td></tr><tr><td>⑦
      In hex</td><td><code>"%016X" % x</code>: viết số x bằng 16 chữ số hex, chữ in
      hoa, thêm 0 ở đầu cho đủ; <code>int(chuỗi, 16)</code> đọc ngược</td><td><code>"%04X"
      % 255</code> = <code>"00FF"</code></td></tr></table>'
    clear: true
    say: Thêm ba điều để đọc mã bằng một ngôn ngữ lập trình khác. Phép dịch bit sang
      trái tạo số có đúng một bit một ở vị trí cho trước. Phép dịch sang phải dời
      các bit, phép hoặc bật bit, và phép và giữ các bit chung. Từ điển là bảng tra
      theo khoá. Cắt chuỗi lấy một đoạn từ vị trí đầu tới trước vị trí cuối. Và định
      dạng thập lục phân viết một số bằng số chữ số thập lục phân cho trước, thêm
      không ở đầu cho đủ, còn lệnh đọc ngược chuyển chuỗi thập lục phân về số.
  - show: $$0111_2 = 0 \cdot 8 + 1 \cdot 4 + 1 \cdot 2 + 1 \cdot 1 = 7$$
    say: Một ví dụ số. Chuỗi bit không một một một bằng không nhân tám, cộng một nhân
      bốn, cộng một nhân hai, cộng một nhân một, bằng bảy. Đó cũng là chữ số thập
      lục phân bảy.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>MTI</td><td>Message
      Type Identifier, 4 chữ số: 0200 là yêu cầu tài chính, 0210 là phản hồi</td></tr><tr><td>bản
      đồ bit (bitmap)</td><td>64 bit; bit thứ i bật (bằng 1) thì trường i có; bit
      1 bật nghĩa là có bản đồ thứ hai (trường 65–128). Nhiều mạng gửi dạng nhị phân
      8 byte, không phải 16 ký tự hex</td></tr><tr><td>DE (data element)</td><td>một
      trường dữ liệu, đánh số 2, 3, 4, …</td></tr><tr><td>LLVAR</td><td>trường có
      độ dài thay đổi: 2 chữ số báo độ dài rồi tới nội dung</td></tr><tr><td>STAN
      / RRN</td><td>DE 11 mã vết 6 số do bên gửi đánh / DE 37 mã tham chiếu 12 ký
      tự</td></tr></table>'
    say: Bảng này giải mã năm từ. MTI là mã loại bản tin gồm bốn chữ số, không hai
      không không là yêu cầu tài chính, không hai một không là phản hồi. Bản đồ bit
      có sáu mươi bốn bit, bit thứ i bật thì trường i có mặt. Riêng bit một bật nghĩa
      là còn bản đồ thứ hai, cho các trường sáu mươi lăm tới một trăm hai mươi tám.
      Nhiều mạng gửi bản đồ ở dạng nhị phân tám byte, chứ không phải mười sáu ký tự.
      D E là một trường dữ liệu, đánh số hai, ba, bốn. Còn trường độ dài thay đổi
      có hai chữ số báo độ dài rồi tới nội dung. Cuối cùng, STAN là trường mười một,
      mã vết sáu chữ số do bên gửi đánh. RRN là trường ba mươi bảy, mã tham chiếu
      mười hai ký tự.
