      Lời giải ở <code>labs/BNK/L11/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: 'Nếu kẹt, làm theo ví dụ vừa xem: bật bit cho từng trường trong vòng lặp,
      rồi in bản đồ bằng mười sáu chữ số thập lục phân. Độ dài là độ dài của chuỗi
