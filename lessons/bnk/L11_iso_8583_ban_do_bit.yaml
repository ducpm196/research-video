  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>3020000002000000</div><div>46</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNK L11 iso_lab.py</code>
