    500)], [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6', 600)])[0] ==
    4 - 1 and alg.bnk_reconcile([('r1', 100), ('r2', 200), ('r3', 300), ('r4', 400),
    ('r5', 500)], [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6', 600)])[3]
    == 1
  - alg.bnk_reconcile([('r1', 100), ('r2', 200), ('r3', 300), ('r4', 400), ('r5',
    500)], [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6', 600)])[1] ==
    5 - 4
  - alg.bnk_reconcile([('r1', 100), ('r2', 200), ('r3', 300), ('r4', 400), ('r5',
    500)], [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6', 600)])[2] ==
    5 - 4
  - sum(alg.bnk_reconcile([('r1', 100), ('r2', 200), ('r3', 300), ('r4', 400), ('r5',
    500)], [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6', 600)])) ==
    6 == 5 + 5 - 4
  steps:
  - show: '<p>Sổ ngân hàng: r1 $100$, r2 $200$, r3 $300$, r4 $400$, r5 $500$. Sổ chuyển
      mạch: r1 $100$, r2 $200$, r3 $350$, r4 $400$, r6 $600$ <i>(số minh hoạ)</i>.</p>

      $$① \; \text{mã chung: r1, r2, r3, r4}\ \Rightarrow\ 4\ \text{mã}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta đối soát hai sổ. Sổ ngân hàng có r một đến r năm, sổ chuyển mạch có r
      một, r hai, r ba, r bốn và r sáu, số tiền như trên màn hình, đây là số minh
      hoạ. Phép tính thứ nhất, mã chung là r một, r hai, r ba, r bốn, tức bốn mã.
    introduces:
    - implies
  - show: '<p>Trong $4$ mã chung, r3 có tiền khác ($300 \ne 350$).</p>

      $$② \; \text{khớp} = 4 - 1 = \hlg{3},\quad \text{lệch tiền} = \hl{1}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, trong bốn mã chung, r ba có tiền khác nhau, ba trăm khác
      ba trăm năm mươi. Vậy khớp là bốn trừ một bằng ba, và lệch tiền là một.
  - show: $$③ \; \text{chỉ ngân hàng} = 5 - 4 = \hl{1}\ (r5)$$
    say: Phép tính thứ ba, sổ ngân hàng có năm mã, trừ bốn mã chung, còn một mã chỉ
      có ở ngân hàng, là r năm.
  - show: $$④ \; \text{chỉ chuyển mạch} = 5 - 4 = \hl{1}\ (r6)$$
    say: Phép tính thứ tư, sổ chuyển mạch có năm mã, trừ bốn mã chung, còn một mã
      chỉ có ở chuyển mạch, là r sáu.
  - show: '<p>Dùng lại bốn con số ở ②, ③, ④.</p>

      $$⑤ \; 3 + 1 + 1 + 1 = \hlg{6}\ \text{mã} = 5 + 5 - 4$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ năm, cộng bốn loại, ba cộng một cộng một cộng một, bằng sáu
      mã, đúng bằng năm cộng năm trừ bốn. Không bỏ sót mã nào.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tổng tiền hai sổ'
  checks:
  - sum(v for _, v in [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6',
    600)]) - sum(v for _, v in [('r1', 100), ('r2', 200), ('r3', 300), ('r4', 400),
    ('r5', 500)]) == 150
  - 50 + 600 - 500 == 150
  steps:
  - show: '<p>Đường khác: cộng tổng tiền mỗi sổ. Ngân hàng $100 + 200 + 300 + 400
      + 500 = 1500$. Chuyển mạch $100 + 200 + 350 + 400 + 600 = 1650$.</p>

      $$1650 - 1500 = \hl{150}\ \text{chênh lệch}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Kiểm bằng đường khác. Vì mỗi giao dịch đều có tiền, ta cộng tổng tiền của
      mỗi sổ. Ngân hàng là một nghìn năm trăm. Chuyển mạch là một nghìn sáu trăm năm
      mươi. Chênh lệch là một trăm năm mươi.
  - show: <table class='t'><tr><th>nguồn chênh lệch</th><th>số tiền</th><th>giải thích</th></tr><tr><td>r3
      lệch tiền</td><td>+50</td><td>350 − 300</td></tr><tr><td>r6 chỉ chuyển mạch</td><td>+600</td><td>ngân
      hàng thiếu</td></tr><tr><td>r5 chỉ ngân hàng</td><td>−500</td><td>chuyển mạch
      thiếu</td></tr><tr><td>tổng</td><td>+150</td><td>50 + 600 − 500</td></tr></table>
    say: Bảng này giải thích từng nguồn chênh lệch giữa hai tổng. Vì mỗi mã góp một
      phần, nên r ba lệch cộng năm mươi. R sáu chỉ có ở chuyển mạch, cộng sáu trăm.
      R năm chỉ có ở ngân hàng, trừ năm trăm. Cộng lại được một trăm năm mươi, khớp
      với hiệu hai tổng.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Ghép hai sổ theo <b>số tiền</b>.
      Hai giao dịch khác nhau cùng số tiền sẽ ghép nhầm. Phải ghép theo mã tham chiếu.</div>
    say: Lỗi thứ nhất, của người mới. Ghép hai sổ theo số tiền. Hai giao dịch khác
      nhau cùng số tiền sẽ ghép nhầm. Phải ghép theo mã tham chiếu.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Lệch
      ranh giới ngày</b>: giao dịch lúc gần nửa đêm được hai bên tính vào hai ngày
      khác nhau, nên cuối ngày xuất hiện lệch giả.

      <br><span class="note">Cách chữa: thống nhất múi giờ và giờ chốt; đối soát theo
      cùng thời điểm cắt.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là lệch ranh giới ngày. Giao dịch lúc gần
      nửa đêm được hai bên tính vào hai ngày khác nhau, nên cuối ngày xuất hiện lệch
      giả. Cách chữa là thống nhất múi giờ và giờ chốt, rồi đối soát theo cùng thời
      điểm cắt.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Tự
      động “sửa” sổ</b> cho khớp mà không qua duyệt. Một người vừa tạo vừa duyệt bút
      toán điều chỉnh là rủi ro gian lận. Cần hai người: người lập và người duyệt.</div>'
    say: Lỗi thứ ba, cũng của người đã đi làm, là tự động sửa sổ cho khớp mà không
      qua duyệt. Một người vừa tạo vừa duyệt bút toán điều chỉnh là rủi ro gian lận.
      Cần hai người, một người lập và một người duyệt.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnk_reconcile([('a1', 10), ('a2', 20), ('a3', 30)], [('a1', 10), ('a2', 25),
    ('a4', 40)]) == (1, 1, 1, 1)
  - 3 + 3 - 2 == 4
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Sổ
      A: a1 10, a2 20, a3 30. Sổ B: a1 10, a2 25, a4 40. Phân loại bao nhiêu mã mỗi
      loại?</td></tr><tr><td>2</td><td>Tổng số mã khác nhau trong hai sổ?</td></tr><tr><td>3</td><td>Quyết
      định: loại “chỉ ngân hàng có” thì làm gì đầu tiên?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, sổ A có a một mười, a hai hai mươi,
      a ba ba mươi. Sổ B có a một mười, a hai hai mươi lăm, a bốn bốn mươi. Phân loại
      bao nhiêu mã mỗi loại? Câu hai, tổng số mã khác nhau trong hai sổ? Câu ba, loại
      chỉ ngân hàng có thì làm gì đầu tiên? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: chung là a1 và a2. a1 khớp, a2 lệch tiền ($20 \ne 25$). a3 chỉ
      A, a4 chỉ B.</p>

      $$\text{khớp } 1,\ \text{lệch } 1,\ \text{chỉ A } 1,\ \text{chỉ B } 1$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Đáp án câu một. Mã chung là a một và a hai. Mã a một khớp ở cả hai sổ. A
      hai lệch tiền, hai mươi khác hai mươi lăm. A ba chỉ có ở sổ A, a bốn chỉ có
      ở sổ B. Mỗi loại một mã.
    clear: true
  - show: $$3 + 3 - 2 = \hlg{4}\ \text{mã}$$
    say: Đáp án câu hai. Mỗi sổ ba mã, hai mã chung, nên ba cộng ba trừ hai bằng bốn
      mã khác nhau, khớp với bốn loại mỗi loại một.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>tra
      soát trạng thái thật của giao dịch trước</td><td>biết đã hạch toán hay chưa
      rồi mới xử lý</td><td>mất một bước</td></tr><tr><td>ghi nợ hoặc hoàn tiền ngay
      theo phỏng đoán</td><td>nhanh</td><td>có thể trừ hoặc hoàn trùng</td></tr></table>
    say: Đáp án câu ba. Việc đầu tiên là tra soát trạng thái thật của giao dịch, để
      biết đã hạch toán hay chưa, rồi mới xử lý. Đoán rồi ghi nợ hoặc hoàn tiền ngay
      có thể gây trừ hoặc hoàn trùng.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>kết quả có thể mất</span><span class='a'>→</span><span
      class='n'>hai bên giữ hai sổ</span><span class='a'>→</span><span class='n'>ghép
      theo mã tham chiếu</span><span class='a'>→</span><span class='n'>bốn loại</span><span
      class='a'>→</span><span class='n'>mỗi loại một hành động</span></div>
    say: Tổng kết chuỗi logic. Kết quả có thể mất, nên hai bên giữ hai sổ. Ghép theo
      mã tham chiếu, chia bốn loại, mỗi loại một hành động.
  - show: <div class='box key'><b>Tư duy:</b> đối soát không phải việc cuối ngày cho
      xong, mà là <b>lưới an toàn</b> bắt mọi trường hợp “chưa biết” mà hệ thống thời
      gian thực để lọt.</div>
    say: Điều cần mang theo. Đối soát không phải việc cuối ngày cho xong, mà là lưới
      an toàn, bắt mọi trường hợp chưa biết mà hệ thống thời gian thực để lọt.
