scenes:
- id: hook
  kind: hook
  title: Vì sao cuối ngày sổ ngân hàng và sổ chuyển mạch lệch nhau?
  steps:
  - show: '<p>Cuối ngày, ngân hàng có $5$ giao dịch, chuyển mạch cũng có $5$. Nhưng
      hai danh sách <b>không giống nhau</b>: có giao dịch chỉ một bên có, và có giao
      dịch hai bên ghi <b>số tiền khác nhau</b>.</p>

      <div class="box key">Việc <b>đối soát</b> tìm ra chúng, theo từng loại, rồi
      mỗi loại có cách xử lý riêng.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, cuối ngày, ngân hàng có năm giao dịch, chuyển mạch cũng có năm.
      Nhưng hai danh sách không giống nhau. Có giao dịch chỉ một bên có, và có giao
      dịch hai bên ghi số tiền khác nhau. Đối soát tìm ra chúng, theo từng loại, rồi
      mỗi loại có cách xử lý riêng.
  - show: <table class='t'><tr><th>loại</th><th>số giao dịch (ví dụ minh hoạ)</th></tr><tr><td>khớp
      hoàn toàn</td><td>3</td></tr><tr><td>chỉ có ở ngân hàng</td><td>1</td></tr><tr><td>chỉ
      có ở chuyển mạch</td><td>1</td></tr><tr><td>cùng mã nhưng lệch tiền</td><td>1</td></tr></table>
    say: Bảng này là kết quả mô phỏng ở cuối bài, với số liệu minh hoạ. Ba giao dịch
      khớp hoàn toàn, một giao dịch chỉ có ở ngân hàng, một chỉ có ở chuyển mạch,
      và một cùng mã nhưng lệch tiền. Lưu ý, bài này dùng mô hình chung của chuyển
      mạch liên ngân hàng. Chi tiết của NAPAS nằm trong đặc tả kết nối chính thức
      của họ.
- id: prereq
  kind: prereq
  title: Ôn lại ba điều sẽ dùng
  checks:
  - 5 + 5 - 4 == 6
  - len({'r1', 'r2', 'r3', 'r4', 'r5'} | {'r1', 'r2', 'r3', 'r4', 'r6'}) == 6
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Mã tham chiếu</td><td>mã định danh giao dịch, cả hai bên cùng giữ; RRN một mình
      thường chưa đủ duy nhất, nên khoá ghép thật là tổ hợp RRN + STAN + ngày giờ
      truyền (DE 7) + mã ngân hàng</td><td>r1, r2, … (bài gộp thành một mã)</td></tr><tr><td>②
      Hai tập hợp</td><td>tập A và tập B; phần chung gọi là giao</td><td>A = {r1,
      r2, r3, r4, r5}</td></tr><tr><td>③ Đếm bù trừ</td><td>|A| + |B| − |giao| = số
      mã khác nhau trong cả hai</td><td>5 + 5 − 4 = 6</td></tr></table>
    say: Trước hết ta ôn lại ba điều sẽ dùng. Mã tham chiếu là mã định danh giao dịch,
      cả hai bên cùng giữ. Thực tế, mã tham chiếu một mình thường chưa đủ duy nhất,
      nên khoá ghép thật gồm cả mã vết, ngày giờ truyền và mã ngân hàng. Bài này gộp
      lại thành một mã cho gọn. Hai tập hợp có phần chung gọi là giao. Còn đếm bù
      trừ nói rằng số mã khác nhau trong cả hai danh sách bằng tổng hai kích thước
      trừ đi phần chung.
  - show: $$5 + 5 - 4 = 6$$
    say: Một ví dụ số. Mỗi bên có năm mã, bốn mã chung, nên tổng số mã khác nhau là
      năm cộng năm trừ bốn, bằng sáu.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>chuyển mạch (switch)</td><td>hệ
      thống ở giữa, nhận lệnh từ ngân hàng gửi và chuyển tới ngân hàng nhận</td></tr><tr><td>ngân
      hàng gửi / nhận</td><td>bên khởi tạo lệnh chuyển / bên có tài khoản thụ hưởng</td></tr><tr><td>đối
      soát</td><td>so cả hai danh sách giao dịch theo mã để tìm chỗ lệch</td></tr><tr><td>tra
      soát</td><td>hỏi trạng thái hoặc khiếu nại cho từng giao dịch cụ thể</td></tr><tr><td>hết
      giờ chờ (chưa rõ kết quả)</td><td>bên gửi chưa nhận được kết quả; trạng thái
      thật phải tra cứu</td></tr><tr><td>bản tin huỷ (reversal)</td><td>bản tin đảo
      một giao dịch đã hạch toán khi cần</td></tr></table>
    say: Bảng dưới đây giải nghĩa sáu thuật ngữ mà bài sẽ dùng. Chuyển mạch là hệ
      thống ở giữa, nhận lệnh từ ngân hàng gửi rồi chuyển tới ngân hàng nhận. Ngân
      hàng gửi khởi tạo lệnh, ngân hàng nhận có tài khoản thụ hưởng. Đối soát là so
      cả hai danh sách theo mã để tìm chỗ lệch. Còn tra soát là hỏi trạng thái hoặc
      khiếu nại cho từng giao dịch cụ thể. Hết giờ chờ là khi chưa nhận được kết quả,
      trạng thái thật phải tra cứu. Bản tin huỷ là bản tin đảo một giao dịch đã hạch
      toán.
