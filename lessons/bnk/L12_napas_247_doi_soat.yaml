- id: formula
  kind: formula
  title: 'Suy ra từng bước: phân loại hai danh sách'
  checks:
  - 3 + 1 + 1 + 1 == 6
  - alg.bnk_reconcile([('r1', 100), ('r2', 200), ('r3', 300), ('r4', 400), ('r5',
    500)], [('r1', 100), ('r2', 200), ('r3', 350), ('r4', 400), ('r6', 600)]) == (3,
    1, 1, 1)
  steps:
  - show: '<p><b>Bước 1.</b> Dùng <b>mã tham chiếu</b> làm khoá ghép, không dùng số
      tiền (hai giao dịch khác nhau có thể cùng số tiền).</p>

      <span class=''note''>Làm thử: hai sổ có $5 + 5 - 4 = 6$ mã khác nhau.</span>

      '
    focus:
    - 1
    - 2
    say: Bước một, vì hai giao dịch khác nhau có thể cùng số tiền, nên ta dùng mã
      tham chiếu làm khoá ghép, không dùng số tiền. Làm thử, hai sổ có năm cộng năm
      trừ bốn, bằng sáu mã khác nhau.
  - show: '<p><b>Bước 2.</b> Với mỗi mã, đúng một trong bốn loại: <b>khớp</b> (cả
      hai có, tiền bằng), <b>lệch tiền</b> (cả hai có, tiền khác), <b>chỉ ngân hàng</b>,
      <b>chỉ chuyển mạch</b>.</p>

      <span class=''note''>Làm thử: $3 + 1 + 1 + 1 = 6$, đủ cả sáu mã, không mã nào
      thuộc hai loại.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước hai, vì mỗi mã chỉ rơi vào đúng một loại, nên ta chia bốn loại. Khớp
      là cả hai có và tiền bằng nhau. Lệch tiền là cả hai có nhưng tiền khác. Còn
      hai loại là chỉ ngân hàng có, hoặc chỉ chuyển mạch có. Làm thử, ba cộng một
      cộng một cộng một bằng sáu, đủ cả sáu mã.
  - show: '<p><b>Bước 3.</b> Mỗi loại có <b>hành động riêng</b> (quy trình điển hình):
      khớp thì xong; chỉ một bên thì tra soát trạng thái thật; lệch tiền thì điều
      tra nguyên nhân. Việc sửa sổ luôn qua bước duyệt.</p>

      <span class=''note''>Sửa sổ bằng bút toán đảo như bài trước, không xoá dòng.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, vì nguyên nhân mỗi loại khác nhau, nên mỗi loại có hành động riêng
      theo quy trình điển hình. Khớp thì xong. Chỉ một bên có thì tra soát trạng thái
      thật. Lệch tiền thì điều tra nguyên nhân. Việc sửa sổ luôn qua bước duyệt, và
      sửa bằng bút toán đảo.
