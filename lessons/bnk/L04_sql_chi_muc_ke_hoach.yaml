scenes:
- id: hook
  kind: hook
  title: Vì sao tra cứu sao kê chậm khi bảng đã có hàng triệu dòng?
  steps:
  - show: '<p>Bảng giao dịch có $10\,000\,000$ dòng <i>(số minh hoạ)</i>. Tra các
      giao dịch của <b>một</b> tài khoản mà đọc cả mười triệu dòng thì quá lãng phí.</p>

      <div class="box key">Có chỉ mục, máy chỉ đi qua khoảng <b>4 tầng</b> của một
      cây tìm kiếm rồi tới thẳng dòng cần

      <i>(mô hình 100 lối rẽ mỗi nút; chỉ mục Oracle thật có hàng trăm lối rẽ nên
      thường còn ít tầng hơn)</i>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, bảng giao dịch có mười triệu dòng, đây là số minh hoạ. Tra các
      giao dịch của một tài khoản mà phải đọc cả mười triệu dòng thì quá lãng phí.
      Có chỉ mục, máy chỉ đi qua khoảng bốn tầng của một cây tìm kiếm rồi tới thẳng
      dòng cần. Bốn tầng là theo mô hình một trăm lối rẽ mỗi nút. Chỉ mục Oracle thật
      có hàng trăm lối rẽ, nên thường còn ít tầng hơn.
  - show: '<table class=''t''><tr><th>ý hỏi</th><th>bài này trả lời</th></tr><tr><td>chỉ
      mục là gì, vì sao nhanh</td><td>một cây đã sắp thứ tự, tìm kiếm theo từng tầng</td></tr><tr><td>làm
      sao biết truy vấn có dùng chỉ mục</td><td>đọc kế hoạch thực thi: SCAN hay SEARCH</td></tr><tr><td>vì
      sao có chỉ mục mà vẫn chậm</td><td>viết điều kiện làm chỉ mục vô dụng</td></tr></table>'
    say: Hôm nay ta trả lời ba câu. Chỉ mục là gì và vì sao nhanh. Làm sao biết truy
      vấn có dùng chỉ mục, bằng cách đọc kế hoạch thực thi. Và vì sao có chỉ mục mà
      vẫn chậm, thường do ta viết điều kiện làm chỉ mục vô dụng.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 2 ** 10 == 1024
  - '(lambda n: next(k for k in range(64) if 2 ** k >= n))(1024) == 10'
  - '(lambda a, x: (lambda f: f(f, 0, len(a) - 1, 0))(lambda f, lo, hi, c: c if lo
    > hi else (c + 1 if a[(lo + hi) // 2] == x else (f(f, (lo + hi) // 2 + 1, hi,
    c + 1) if a[(lo + hi) // 2] < x else f(f, lo, (lo + hi) // 2 - 1, c + 1)))))(list(range(1024)),
    1023) == 11'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Cơ sở dữ liệu và SQL</td><td>cơ sở dữ liệu là phần mềm lưu bảng dữ liệu; SQL
      là ngôn ngữ để hỏi và sửa nó; Oracle là một hệ cơ sở dữ liệu nhiều ngân hàng
      dùng</td><td>Oracle, sqlite</td></tr><tr><td>② Bảng, dòng, cột</td><td>bảng
      gồm nhiều dòng, mỗi dòng có các cột</td><td>dòng giao dịch có cột tài khoản,
      số tiền, ngày</td></tr><tr><td>③ Truy vấn có điều kiện</td><td>SELECT lấy dòng
      thoả điều kiện WHERE</td><td>WHERE account_id = 7</td></tr><tr><td>④ Tìm nhị
      phân</td><td>trong danh sách đã sắp, mỗi bước so phần tử giữa rồi loại một nửa</td><td>1024
      phần tử: 10 lần chia đôi còn 1</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Cơ sở dữ liệu là phần mềm lưu các bảng dữ
      liệu, và SQL là ngôn ngữ để hỏi và sửa nó. Oracle là một hệ cơ sở dữ liệu mà
      nhiều ngân hàng dùng. Bảng gồm nhiều dòng, mỗi dòng có các cột. Truy vấn lấy
      các dòng thoả điều kiện đặt sau mệnh đề điều kiện. Còn tìm nhị phân là trong
      một danh sách đã sắp thứ tự, mỗi bước so với phần tử ở giữa rồi loại bỏ một
      nửa. Một nghìn không trăm hai mươi bốn phần tử, sau mười lần chia đôi chỉ còn
      một.
  - show: '$$2^{10} = 1024$$

      <p>1024 → 512 → 256 → 128 → 64 → 32 → 16 → 8 → 4 → 2 → 1: mười lần chia đôi.</p>

      <p class="small">So thêm phần tử cuối cùng đó nữa là xong: tối đa $10 + 1 =
      11$ lần so.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Vì sao mười lần? Vì hai mũ mười bằng một nghìn không trăm hai mươi bốn, nên
      mỗi lần chia đôi, sau mười lần chỉ còn một phần tử. So thêm phần tử cuối cùng
      đó nữa là xong, nên nhiều nhất là mười một lần so.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>INDEX (chỉ
      mục)</td><td>cấu trúc phụ giúp tìm dòng nhanh, như mục lục của sách</td></tr><tr><td>PRIMARY
      KEY</td><td>khoá chính: cột định danh duy nhất mỗi dòng, thường đã có chỉ mục</td></tr><tr><td>EXPLAIN</td><td>lệnh
      xem kế hoạch: máy sẽ tìm dòng bằng cách nào</td></tr><tr><td>SCAN (Oracle: TABLE
      ACCESS FULL)</td><td>quét toàn bảng, đọc từng dòng</td></tr><tr><td>SEARCH ...
      USING INDEX (Oracle: INDEX RANGE SCAN)</td><td>tìm qua chỉ mục, tới thẳng dòng
      cần</td></tr></table>'
    say: Bảng này giải mã năm từ. Chỉ mục là cấu trúc phụ giúp tìm dòng nhanh, như
      mục lục của cuốn sách. Khoá chính định danh duy nhất mỗi dòng. Lệnh xem kế hoạch
      cho biết máy sẽ tìm dòng bằng cách nào. Quét toàn bảng là đọc từng dòng. Còn
      tìm qua chỉ mục là đi theo cây tới thẳng dòng cần. Trong kế hoạch của Oracle,
      hai cách này mang tên khác, ghi trong ngoặc trên màn hình.
