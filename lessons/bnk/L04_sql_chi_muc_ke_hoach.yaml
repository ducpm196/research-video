- id: formula
  kind: formula
  title: 'Suy ra từng bước: bao nhiêu tầng?'
  checks:
  - 100 ** 2 == 10000
  - alg.bnk_btree_levels(10 ** 7, 100) == 4
  - 100 ** 3 < 10 ** 7 <= 100 ** 4
  - 4 + 1 == 5
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi nút có $f$ lối rẽ. Cây $L$ tầng chứa được tối đa
      $f^L$ dòng.</p>

      <span class=''note''>Làm thử: $f = 100$, $L = 2$ thì $100^2 = 10\,000$ dòng.</span>

      '
    focus:
    - 1
    - 2
    say: Bước một, vì mỗi nút có f lối rẽ, nên cây L tầng chứa được tối đa f mũ L
      dòng. Làm thử, f bằng một trăm, L bằng hai, thì một trăm mũ hai là mười nghìn
      dòng.
  - show: '<p><b>Bước 2.</b> Muốn chứa $n$ dòng, cần $L$ nhỏ nhất sao cho $f^L \ge
      n$. Thử tăng $L$ dần.</p>

      <span class=''note''>Làm thử: $n = 10\,000\,000$: $100^3 = 1\,000\,000$ chưa
      đủ, $100^4 = 100\,000\,000$ đủ.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì cần chứa n dòng, nên ta tìm L nhỏ nhất sao cho f mũ L không
      nhỏ hơn n. Làm thử với mười triệu dòng, một trăm mũ ba là một triệu chưa đủ,
      một trăm mũ bốn là một trăm triệu thì đủ.
  - show: '<p><b>Bước 3.</b> Một lần tra qua chỉ mục đọc khoảng $L$ nút rồi $1$ dòng,
      nên tổng khoảng $L + 1$ lần đọc.</p>

      <span class=''note''>Làm thử: $4 + 1 = 5$ lần đọc thay vì $10\,000\,000$. Tài
      khoản có $k$ giao dịch thì đọc thêm khoảng $k$ dòng.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, vì tra qua chỉ mục đi qua L nút rồi đọc một dòng, nên tổng khoảng
      L cộng một lần đọc. Làm thử, bốn cộng một bằng năm lần đọc, thay vì mười triệu
      lần. Nếu tài khoản có k giao dịch, máy đọc thêm khoảng k dòng nữa.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 100 ** 1 < 10 ** 7
  - 100 ** 2 < 10 ** 7
  - 100 ** 3 < 10 ** 7
  - 100 ** 4 >= 10 ** 7 and alg.bnk_btree_levels(10 ** 7, 100) == 4
  - alg.bnk_btree_levels(10 ** 7, 100) + 1 == 5
  steps:
  - show: '<p>Mô hình đơn giản: mỗi nút $100$ lối rẽ, bảng $10\,000\,000$ dòng.</p>

      $$① \; 100^1 = 100 < 10\,000\,000$$

      '
    focus:
    - 1
    - 2
    say: Ta thử tăng dần số tầng. Phép tính thứ nhất, một tầng chứa tối đa một trăm
      dòng, chưa đủ cho mười triệu dòng.
  - show: $$② \; 100^2 = 10\,000 < 10\,000\,000$$
    say: Phép tính thứ hai, hai tầng chứa tối đa mười nghìn dòng, vẫn chưa đủ.
  - show: $$③ \; 100^3 = 1\,000\,000 < 10\,000\,000$$
    say: Phép tính thứ ba, ba tầng chứa tối đa một triệu dòng, vẫn chưa đủ.
  - show: $$④ \; 100^4 = 100\,000\,000 \ge 10\,000\,000 \Rightarrow L = \hlg{4}$$
    introduces:
    - implies
    say: Phép tính thứ tư, bốn tầng chứa tối đa một trăm triệu dòng, đủ cho mười triệu
      dòng. Vậy cây này cần bốn tầng.
  - show: $$⑤ \; 4 + 1 = \hlg{5}\ \text{lần đọc, so với}\ \hl{10\,000\,000}\ \text{khi
      quét}$$
    say: Phép tính thứ năm, một lần tra qua chỉ mục tốn bốn cộng một bằng năm lần
      đọc, so với mười triệu lần khi quét toàn bảng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: hỏi chính cơ sở dữ liệu'
  checks:
  - alg.bnk_sql_plan(False, 'account_id=7').startswith('SCAN')
  - alg.bnk_sql_plan(True, 'account_id=7').startswith('SEARCH')
  - alg.bnk_sql_plan(False, "account_id=7 AND created='2026-01-05'").startswith('SCAN')
  - alg.bnk_sql_plan(True, "account_id=7 AND created='2026-01-05'").startswith('SEARCH')
  - alg.bnk_sql_plan(True, "created='2026-01-05'").startswith('SCAN')
  - alg.bnk_sql_plan(True, 'account_id+0=7').startswith('SCAN')
  - alg.bnk_sql_plan(False, 'abs(account_id)=7').startswith('SCAN')
  - alg.bnk_sql_plan(True, 'abs(account_id)=7').startswith('SCAN')
  steps:
  - show: '<p>Đường khác: hỏi kế hoạch thực thi thật (sqlite, 5000 dòng). Chưa có
      chỉ mục thì <b>SCAN</b>; có chỉ mục trên tài khoản thì <b>SEARCH</b>.</p>'
    say: Kiểm bằng đường khác, ta hỏi kế hoạch thực thi thật trên một cơ sở dữ liệu
      nhỏ, năm nghìn dòng. Chưa có chỉ mục thì kế hoạch là quét toàn bảng. Có chỉ
      mục trên cột tài khoản thì kế hoạch là tìm qua chỉ mục. Máy này không có Oracle,
      nên ta dùng một cơ sở dữ liệu nhỏ để minh hoạ cùng ý tưởng.
  - show: <table class='t'><tr><th>điều kiện WHERE</th><th>không chỉ mục</th><th>chỉ
      mục (account_id, created)</th></tr><tr><td>account_id = 7</td><td>SCAN</td><td>SEARCH</td></tr><tr><td>account_id
      = 7 AND created = '2026-01-05'</td><td>SCAN</td><td>SEARCH</td></tr><tr><td>created
      = '2026-01-05' (bỏ cột đầu)</td><td>SCAN</td><td>SCAN</td></tr><tr><td>account_id
      + 0 = 7 (bọc phép tính)</td><td>SCAN</td><td>SCAN</td></tr><tr><td>abs(account_id)
      = 7 (bọc hàm)</td><td>SCAN</td><td>SCAN</td></tr></table>
    say: Bảng này là kết quả hỏi thật. Hai điều kiện đầu dùng được chỉ mục. Điều kiện
      thứ ba bỏ cột đầu của chỉ mục nên ở đây vẫn phải quét. Hai điều kiện cuối bọc
      cột trong một phép tính hoặc hàm, nên chỉ mục cũng vô dụng.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ “thêm chỉ mục càng
      nhiều càng tốt”. Mỗi chỉ mục làm <b class="red">chậm việc ghi</b>, vì mỗi lần
      thêm dòng phải cập nhật thêm một mục trong mỗi cây chỉ mục; sửa dòng thì chỉ
      khi cột thuộc chỉ mục thay đổi.</div>
    say: Lỗi thứ nhất, của người mới. Nghĩ thêm chỉ mục càng nhiều càng tốt. Mỗi chỉ
      mục làm chậm việc ghi, vì mỗi lần thêm dòng phải cập nhật thêm một mục trong
      mỗi cây chỉ mục. Còn sửa dòng thì chỉ tốn thêm khi cột thuộc chỉ mục thay đổi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Bọc
      cột trong hàm</b> trong điều kiện, ví dụ lấy tháng của ngày. Chỉ mục trên cột
      bị bỏ qua.

      <br><span class="note">Cách chữa: viết khoảng ngày thay vì hàm, hoặc tạo chỉ
      mục theo đúng biểu thức.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là bọc cột trong một hàm ngay trong điều
      kiện, ví dụ lấy tháng của ngày. Chỉ mục trên cột bị bỏ qua. Cách chữa là viết
      khoảng ngày thay vì dùng hàm, hoặc tạo chỉ mục theo đúng biểu thức đó.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Đặt chỉ mục nhiều
      cột sai thứ tự. Chỉ mục <code>(account_id, created)</code> dùng được cho điều
      kiện bắt đầu từ <code>account_id</code>,

      thường không dùng tốt cho điều kiện chỉ có <code>created</code>. Oracle có thể
      dùng INDEX SKIP SCAN khi cột đầu ít giá trị khác nhau, nhưng thường kém hơn
      chỉ mục đúng thứ tự.</div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là đặt chỉ mục nhiều cột sai thứ tự.
      Chỉ mục tài khoản rồi ngày dùng được cho điều kiện bắt đầu từ tài khoản, nhưng
      thường không dùng tốt cho điều kiện chỉ có ngày. Oracle có cách quét nhảy qua
      cột đầu khi cột đầu ít giá trị khác nhau, nhưng thường kém hơn chỉ mục đúng
      thứ tự.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnk_btree_levels(10 ** 6, 100) == 3
  - alg.bnk_btree_levels(10 ** 6, 100) + 1 == 4
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Bảng
      1 000 000 dòng, mỗi nút 100 lối rẽ. Cần mấy tầng?</td></tr><tr><td>2</td><td>Tra
      qua chỉ mục tốn bao nhiêu lần đọc (tầng + 1 dòng)?</td></tr><tr><td>3</td><td>Quyết
      định: bảng ghi liên tục 20 000 giao dịch mỗi giây, có nên thêm 8 chỉ mục?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, bảng một triệu dòng, mỗi nút một
      trăm lối rẽ, cần mấy tầng? Câu hai, tra qua chỉ mục tốn bao nhiêu lần đọc? Câu
      ba, bảng ghi liên tục hai chục nghìn giao dịch mỗi giây, có nên thêm tám chỉ
      mục không? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: $100^3 = 1\,000\,000 \ge 1\,000\,000$ và $100^2 = 10\,000$ chưa
      đủ.</p>

      $$L = \hl{3}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Một trăm mũ hai chỉ mười nghìn, chưa đủ. Một trăm mũ ba bằng
      đúng một triệu, đủ. Vậy cần ba tầng.
    clear: true
  - show: $$3 + 1 = \hlg{4}\ \text{lần đọc}$$
    say: Đáp án câu hai. Ba tầng cộng một dòng, bằng bốn lần đọc.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>thêm
      cả 8 chỉ mục</td><td>mọi truy vấn tra cứu nhanh</td><td>mỗi giao dịch ghi phải
      cập nhật 8 cây, ghi chậm</td></tr><tr><td>chỉ mục cho truy vấn thật sự hay chạy</td><td>cân
      bằng đọc và ghi</td><td>truy vấn hiếm gặp có thể chậm</td></tr></table>
    say: Đáp án câu ba là đánh đổi. Thêm cả tám chỉ mục thì tra cứu nhanh nhưng mỗi
      lần ghi phải cập nhật tám cây, nên ghi chậm. Chỉ nên tạo chỉ mục cho những truy
      vấn thật sự hay chạy, và đo trước khi thêm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>bảng lớn</span><span class='a'>→</span><span
      class='n'>chỉ mục = cây nhiều tầng</span><span class='a'>→</span><span class='n'>ít
      tầng → ít lần đọc</span><span class='a'>→</span><span class='n'>điều kiện phải
      khớp chỉ mục</span></div>
    say: Tổng kết chuỗi logic. Bảng lớn thì dùng chỉ mục, là cây nhiều tầng. Ít tầng
      nên ít lần đọc. Nhưng điều kiện phải khớp chỉ mục thì nó mới được dùng.
  - show: <div class='box key'><b>Tư duy:</b> đừng đoán, hãy <b>đọc kế hoạch thực
      thi</b>. Thấy SCAN trên bảng lớn là dấu hiệu cần xem lại điều kiện và chỉ mục.</div>
    say: Điều cần mang theo. Đừng đoán, hãy đọc kế hoạch thực thi. Thấy quét toàn
      bảng trên bảng lớn là dấu hiệu cần xem lại điều kiện và chỉ mục.
