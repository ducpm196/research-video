    say: Hình thứ ba so sánh hai cách xử lý việc chờ. Bên trái, mỗi yêu cầu giữ một
      luồng nền trong lúc chờ. Hai trăm luồng đều đứng chờ, nên yêu cầu thứ hai trăm
      lẻ một phải xếp hàng. Bên phải, luồng ảo khi chờ sẽ nhả luồng nền ra, để luồng
      nền đi chạy việc khác. Nhờ vậy mười nghìn luồng ảo cùng chờ cũng không cạn.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: bao nhiêu kết quả có thể xảy ra?'
  checks:
  - 2 * 2 == 4
  - math.comb(4, 2) == 6 == len(set(__import__('itertools').permutations([0, 0, 1,
    1])))
  - alg.bnk_lost_update(100, [50, 30]) == [130, 150, 180]
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi luồng gồm hai việc nhỏ, <b>đọc</b> rồi <b>ghi</b>,
      và việc ghi luôn sau việc đọc của cùng luồng.</p>

      <span class=''note''>Làm thử: hai luồng thì có $2 \cdot 2 = 4$ việc nhỏ.</span>

      '
    focus:
    - 1
    - 2
    introduces:
    - cdot
    say: Bước một, vì mỗi luồng gồm hai việc nhỏ là đọc rồi ghi, và việc ghi luôn
      sau việc đọc của cùng luồng, nên hai luồng có bốn việc nhỏ. Làm thử, hai nhân
      hai bằng bốn.
  - show: '<p><b>Bước 2.</b> Cách xếp bốn việc vào bốn ô, giữ thứ tự trong từng luồng,
      bằng số cách chọn hai ô cho luồng A.</p>

      <span class=''note''>Làm thử: ô đầu của A có $4$ chỗ, ô sau còn $3$, được $4
      \cdot 3$; đổi chỗ hai ô vẫn là một cách chọn nên chia $2 \cdot 1$: $\frac{4
      \cdot 3}{2 \cdot 1} = 6$ cách.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì thứ tự trong từng luồng được giữ, nên số cách xếp bằng số cách
      chọn hai ô trong bốn ô cho luồng A. Làm thử, ô thứ nhất của A có bốn chỗ, ô
      thứ hai còn ba chỗ, nhưng đổi chỗ hai ô vẫn là cùng một cách chọn, nên bốn nhân
      ba chia hai nhân một bằng sáu cách.
  - show: '<p><b>Bước 3.</b> Chạy thử cả sáu cách: hai cách cho $180$, hai cách cho
      $130$, hai cách cho $150$.</p>

      <span class=''note''>Chỉ đúng khi một luồng xong cả đọc lẫn ghi rồi luồng kia
      mới đọc.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, ta chạy thử cả sáu cách. Hai cách cho kết quả một trăm tám mươi,
      hai cách cho một trăm ba mươi, hai cách cho một trăm năm mươi. Kết quả chỉ đúng
      khi một luồng xong cả đọc lẫn ghi rồi luồng kia mới đọc. Vì vậy mới có lúc đúng
      lúc sai, và rất khó thấy khi kiểm thử.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 100 + 50 == 150
  - 100 + 30 == 130
  - 180 - 130 == 50
  - alg.bnk_lost_update(100, [50, 30])[-1] == 100 + 50 + 30
  steps:
  - show: '<p>Chạy A đọc, B đọc, A ghi, B ghi, với số dư đầu $100$.</p>

      $$① \; \text{A đọc } 100,\ \text{B đọc } 100$$

      '
    focus:
    - 1
    - 2
    say: Ta theo dõi cách xen kẽ xấu. Phép tính thứ nhất, A đọc được một trăm, và
      B cũng đọc được một trăm, vì chưa ai ghi.
  - show: $$② \; \text{A ghi } 100 + 50 = \hl{150}$$
    say: Phép tính thứ hai, A ghi giá trị đã đọc cộng năm mươi, là một trăm năm mươi.
  - show: $$③ \; \text{B ghi } 100 + 30 = \hl{130}$$
    say: Phép tính thứ ba, B ghi giá trị mà B đã đọc, một trăm, cộng ba mươi, là một
      trăm ba mươi, và nó đè lên kết quả của A.
  - show: $$④ \; 180 - 130 = \hl{50}\ \text{đã mất}$$
    say: Phép tính thứ tư, kết quả đúng là một trăm tám mươi, thực tế còn một trăm
      ba mươi, nên mất đúng năm mươi, chính là khoản nạp của A.
  - show: '$$⑤ \; \text{có khoá: } 100 + 50 + 30 = \hlg{180}$$'
    say: Phép tính thứ năm, khi có khoá, hai việc chạy lần lượt, nên luôn ra một trăm
      tám mươi.
- id: chay_that
  kind: example
  title: 'Chạy thật: mất cập nhật, khoá, luồng ảo'
  steps:
  - show: <p><b>Tệp MatCapNhat.java (phần chính)</b></p><div class="code"><div><span
      class="kw">static</span> <span class="kw">int</span> dem = 0;</div><div><span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) <span class="kw">throws</span> Exception {</div><div>    Runnable
      viec = () -&gt; { <span class="kw">for</span> (<span class="kw">int</span> i
      = 0; i &lt; 1_000_000; i++) dem++; };</div><div>    Thread a = <span class="kw">new</span>
      Thread(viec);</div><div>    Thread b = <span class="kw">new</span> Thread(viec);</div><div>    a.start();
      b.start();      <span class="cm">// hai luồng cùng chạy</span></div><div>    a.join();
      b.join();        <span class="cm">// chờ cả hai xong</span></div><div>    System.out.println("dung
      2000000? " + (dem == 2_000_000));</div></div>
    focus:
    - 1
    - 1
    - 2
    say: Ta chạy thật hai luồng cùng cộng vào một biến dùng chung. Mỗi luồng làm cùng
      một việc là cộng thêm một, một triệu lần. Lệnh bắt đầu cho cả hai luồng chạy,
      rồi lệnh chờ đợi cả hai xong, và ta kiểm xem tổng có đúng hai triệu không.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>dung 2000000? false</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chạy thật in ra không đúng. Vì cộng thêm một thực ra là đọc, cộng, rồi ghi,
      nên hai luồng hay đọc cùng một số rồi ghi đè nhau, mất những lần cộng. Con số
      mất cụ thể thay đổi từng lần chạy, nên ta chỉ in đúng hay sai.
  - show: '<p><b>Tệp CoKhoa.java (phần chính): bọc phép cộng trong khối đồng bộ</b></p><div
      class="code"><div><span class="kw">static</span> <span class="kw">int</span>
      dem = 0;</div><div><span class="kw">static</span> <span class="kw">final</span>
      Object KHOA = <span class="kw">new</span> Object();</div><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> Exception {</div><div>    Runnable viec = ()
      -&gt; {</div><div>        <span class="kw">for</span> (<span class="kw">int</span>
      i = 0; i &lt; 1_000_000; i++) {</div><div>            <span class="kw">synchronized</span>
      (KHOA) { dem++; }   <span class="cm">// mỗi lúc chỉ một luồng vào khối này</span></div><div>        }</div><div>    };</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ ta bọc phép cộng vào một khối đồng bộ, dùng một đối tượng làm khoá.
      Mỗi lúc chỉ một luồng được vào khối đó, luồng kia chờ ở cửa.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>dung 2000000? true</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật in đúng. Vì hai luồng vào khối lần lượt, nên không còn chuyện đọc
      chen vào giữa, và tổng đúng hai triệu.
  - show: '<p><b>Tệp LuongAo.java (phần chính): mười nghìn việc, mỗi việc chờ một
      phần mười giây</b></p><div class="code"><div>AtomicInteger xong = <span class="kw">new</span>
      AtomicInteger();</div><div><span class="kw">long</span> t0 = System.nanoTime();</div><div><span
      class="kw">try</span> (ExecutorService ex = Executors.newVirtualThreadPerTaskExecutor())
      {</div><div>    <span class="kw">for</span> (<span class="kw">int</span> i =
      0; i &lt; 10_000; i++) {</div><div>        ex.submit(() -&gt; { Thread.sleep(100);
      <span class="kw">return</span> xong.incrementAndGet(); });</div><div>    }</div><div>}                                  <span
      class="cm">// đóng: chờ mọi việc xong</span></div><div><span class="kw">long</span>
      ms = (System.nanoTime() - t0) / 1_000_000;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Còn đây là cách chạy bằng luồng ảo của Java hai mươi mốt. Bộ phân việc này
      tạo mỗi việc một luồng ảo. Mỗi việc chỉ ngủ một phần mười giây, giả làm đang
      chờ đối tác, rồi tăng một biến đếm an toàn khi nhiều luồng cùng tăng. Ta đo
      tổng thời gian, và hỏi có dưới hai giây không.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>xong 10000 yeu cau,
      duoi 2 giay? true</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chạy thật cho thấy mười nghìn việc xong, trong dưới hai giây. Nếu chỉ có
      hai trăm luồng nền, ta đã tính được là mất năm giây, vì mỗi luồng ảo khi chờ
      nhả luồng chạy cho việc khác. Kết quả này đúng khi máy không quá tải.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: luồng ảo nhanh hơn bao nhiêu?'
  checks:
  - alg.bnk_batch_time(10000, 200, 0.1) == 5.0
  - abs(10000 / (200 / 0.1) - 5.0) < 1e-9
  - alg.bnk_batch_time(10000, 10000, 0.1) == 0.1
  steps:
  - show: '<p>Mười nghìn yêu cầu, mỗi yêu cầu chờ $0{,}1$ giây. Với $200$ luồng nền:</p>

      <p>Vì mỗi lượt xử lý được $200$ yêu cầu, nên cần $\frac{10\,000}{200} = 50$
      lượt:</p>

      $$50 \cdot 0{,}1 = \hl{5}\ \text{giây}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Giờ so thời gian xử lý. Mười nghìn yêu cầu, mỗi yêu cầu chờ không phẩy một
      giây. Vì mỗi lượt xử lý được hai trăm yêu cầu, nên cần năm mươi lượt. Năm mươi
      nhân không phẩy một bằng năm giây.
  - show: '<table class=''t''><tr><th>cách tính</th><th>kết quả</th></tr><tr><td>theo
      lô: 50 lô × 0,1 giây</td><td>5 giây</td></tr><tr><td>theo thông lượng: 200 ÷
      0,1 = 2000 yêu cầu mỗi giây, 10 000 ÷ 2000</td><td>5 giây</td></tr><tr><td>luồng
      ảo (mô hình lý tưởng): tất cả chờ cùng lúc</td><td>0,1 giây</td></tr></table>'
    say: Kiểm bằng đường khác. Thông lượng là hai trăm chia không phẩy một, bằng hai
      nghìn yêu cầu mỗi giây, nên mười nghìn yêu cầu mất năm giây, khớp với cách tính
      theo lô. Luồng ảo, trong mô hình lý tưởng bỏ qua chi phí CPU, chờ tất cả cùng
      lúc nên chỉ mất không phẩy một giây.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ rằng <code>soDu +=
      50</code> là một việc không thể chia nhỏ. Thực ra nó là <b>đọc, cộng, ghi</b>:
      ba việc,

      nên luồng khác chen vào được.</div>

      '
    say: Lỗi thứ nhất, của người mới. Nghĩ rằng một câu lệnh cộng thêm năm mươi là
      một việc không chia nhỏ được. Thực ra nó gồm đọc, cộng và ghi, nên luồng khác
      chen vào được.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Giữ
      khoá khi gọi mạng.</b> Khoá bao cả lời gọi sang đối tác mất $300$ ms

      thì mọi luồng khác chờ $300$ ms theo. Khoá chỉ nên bao đoạn đọc rồi ghi ngắn.<br><span
      class="note">Phép thử: đo thời gian giữ khoá.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là giữ khoá khi gọi mạng. Nếu khoá bao
      cả lời gọi sang đối tác mất ba trăm mili giây, mọi luồng khác phải chờ ba trăm
      mili giây theo. Khoá chỉ nên bao đoạn đọc rồi ghi ngắn, và hãy đo thời gian
      giữ khoá.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nghĩ luồng ảo làm
      CPU chạy nhanh hơn. Nó chỉ giúp việc <b>chờ</b>.

      <code>synchronized</code> là từ khoá Java bọc một khối mã bằng khoá, mỗi lúc
      chỉ một luồng vào.

      Ở Java 21, chờ bên trong khối <code>synchronized</code> có thể <b>ghim</b> luồng
      ảo vào luồng nền (luồng nền bị giữ chân), mất lợi ích.

      Từ Java 24 (JEP 491, một bản đề xuất tính năng chính thức của Java), <code>synchronized</code>
      không còn ghim; gọi mã native (mã máy viết ngoài Java) vẫn ghim.</div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là nghĩ luồng ảo làm CPU chạy nhanh
      hơn. Nó chỉ giúp những việc phải chờ. Khối đồng bộ là một từ khoá của Java,
      bọc một đoạn mã bằng khoá để mỗi lúc chỉ một luồng vào. Ở Java hai mươi mốt,
      chờ bên trong khối đồng bộ có thể ghim luồng ảo vào luồng nền, tức là giữ chân
      luồng nền, nên mất lợi ích. Từ Java hai mươi tư, khối đồng bộ không còn ghim,
      nhưng gọi mã máy gốc viết ngoài Java vẫn ghim.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - len(set(__import__('itertools').permutations([0, 0, 1, 1, 2, 2]))) == 90 == 720
    // 8
  - 6 * 5 * 4 * 3 * 2 * 1 == 720 == math.factorial(6) and 2 * 2 * 2 == 8
  - alg.bnk_batch_time(2000, 50, 0.2) == 8.0
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Ba
      luồng, mỗi luồng đọc rồi ghi. Có bao nhiêu cách xen kẽ?</td></tr><tr><td>2</td><td>2000
      yêu cầu, mỗi yêu cầu chờ 0,2 giây, 50 luồng nền. Mất bao lâu?</td></tr><tr><td>3</td><td>Quyết
      định: dịch vụ gọi đối tác chậm 300 ms, hàng nghìn yêu cầu cùng lúc. Chọn gì?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, ba luồng, mỗi luồng đọc rồi ghi,
      có bao nhiêu cách xen kẽ? Câu hai, hai nghìn yêu cầu, mỗi yêu cầu chờ không
      phẩy hai giây, năm mươi luồng nền, mất bao lâu? Câu ba, dịch vụ gọi đối tác
      chậm ba trăm mili giây, hàng nghìn yêu cầu cùng lúc, bạn chọn gì? Hãy dừng video
      và làm ra giấy.
  - show: '<p>Xếp $6$ việc vào $6$ ô: ô đầu có $6$ cách chọn việc, ô hai $5$ cách,
      …: $6 \cdot 5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 720$ thứ tự. Hai việc của mỗi
      luồng có $2$ cách đứng trước sau mà chỉ $1$ cách hợp lệ (đọc trước ghi sau),
      nên chia cho $2 \cdot 2 \cdot 2 = 8$.</p>

      $$\frac{720}{8} = \hl{90}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Xếp sáu việc vào sáu ô, ô đầu có sáu cách chọn, ô hai có
      năm cách, cứ thế được bảy trăm hai mươi thứ tự. Vì hai việc của mỗi luồng có
      hai cách đứng trước sau mà chỉ một cách hợp lệ, là đọc trước ghi sau, nên ta
      chia cho hai nhân hai nhân hai, là tám. Kết quả là chín mươi cách.
    clear: true
  - show: $$\frac{2000}{50} \cdot 0{,}2 = 40 \cdot 0{,}2 = \hlg{8}\ \text{giây}$$
    say: Đáp án câu hai. Hai nghìn chia năm mươi bằng bốn mươi lượt, nhân không phẩy
      hai, được tám giây.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>tăng
      số luồng nền lên rất lớn</td><td>không phải sửa mã</td><td>tốn bộ nhớ, hệ điều
      hành chuyển luồng nặng</td></tr><tr><td>luồng ảo (Java 21)</td><td>chờ gần như
      miễn phí, mã vẫn viết tuần tự</td><td>tránh chỗ gây ghim (Java 21: chờ trong
      synchronized; mã native); đo trước khi tin</td></tr></table>'
    say: Đáp án câu ba là một đánh đổi. Tăng số luồng nền thì không sửa mã nhưng tốn
      bộ nhớ. Luồng ảo cho phép chờ gần như miễn phí mà mã vẫn viết tuần tự, nhưng
      phải tránh ghim và phải đo.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: tải tăng ×100 và ×10 000, giải pháp nào gãy?'
  checks:
  - 10000 / 200 * 0.1 == 5.0
  - 1000000 / 200 * 0.1 == 500.0
  - round(500 / 60, 1) == 8.3
  - 100000000 / 200 * 0.1 == 50000.0
  - round(50000 / 3600, 1) == 13.9
  - 10000 * 1 == 10000
  - 1000000 * 1 == 10**6 and 100000000 * 1 == 10**8
  steps:
  - show: '<p>Mỗi yêu cầu chờ đối tác $0{,}1$ giây; có $200$ luồng nền; ngăn xếp mỗi
      luồng nền thường cỡ $1$ MB (tuỳ hệ điều hành); luồng ảo cỡ $1$ KB <i>(số minh
      hoạ)</i>.</p><table class=''t''><tr><th>tải</th><th>yêu cầu chờ cùng lúc</th><th>200
      luồng nền: thời gian</th><th>một luồng nền mỗi yêu cầu: bộ nhớ</th><th>luồng
      ảo: bộ nhớ</th></tr><tr><td>×1</td><td>10 000</td><td>5 giây</td><td>10 000
      MB ≈ 10 GB</td><td>10 000 KB ≈ 10 MB</td></tr><tr><td>×100</td><td>1 000 000</td><td>500
      giây ≈ <b>8,3 phút</b></td><td>1 000 000 MB ≈ <b>1 TB</b></td><td>≈ 1 GB</td></tr><tr><td>×10
      000</td><td>100 000 000</td><td>50 000 giây ≈ <b>13,9 giờ</b></td><td>≈ <b>100
      TB</b></td><td>≈ <b>100 GB</b></td></tr></table>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giả sử mỗi yêu cầu chờ đối tác không phẩy một giây, có hai trăm luồng nền,
      ngăn xếp mỗi luồng nền cỡ một mê ga byte, luồng ảo cỡ một ki lô byte. Đây là
      số minh hoạ. Với mười nghìn yêu cầu chờ cùng lúc, hai trăm luồng nền mất năm
      giây. Tải tăng một trăm lần thì mất tám phẩy ba phút, và tăng mười nghìn lần
      thì mất mười ba phẩy chín giờ. Nếu cho mỗi yêu cầu một luồng nền, bộ nhớ ngăn
      xếp lên tới một nghìn tỉ byte ở tải gấp trăm lần. Luồng ảo kéo con số đó xuống
      khoảng một nghìn mê ga byte.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Tăng số luồng nền:
      ở ×1 còn chạy được, ở ×100 một luồng mỗi yêu cầu cần cỡ 1 TB bộ nhớ, không máy
      nào có. Giữ 200 luồng thì mất 8,3 phút, người dùng bỏ đi.

      <b>Luồng ảo</b> kéo bộ nhớ xuống cỡ 1 GB, nhưng ở ×10 000 vẫn cần cỡ 100 GB:
      cũng gãy.</div>

      <div class="box key"><b>Đánh đổi người làm nghề chọn:</b> luồng ảo cho việc
      <b>chờ</b>; nếu việc là tính toán thì số lõi CPU mới là giới hạn. Ở quy mô cực
      lớn, phải <b>giới hạn số yêu cầu đồng thời</b> và <b>chia ra nhiều máy</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giải pháp cũ là tăng số luồng nền. Ở tải gốc còn chạy được, nhưng ở tải gấp
      trăm lần, mỗi yêu cầu một luồng cần cỡ một nghìn tỉ byte bộ nhớ, không máy nào
      có. Còn giữ hai trăm luồng thì mất tám phút, người dùng đã bỏ đi. Luồng ảo kéo
      bộ nhớ xuống cỡ một nghìn mê ga byte, nhưng ở tải gấp mười nghìn lần vẫn cần
      cỡ một trăm nghìn mê ga byte, nên cũng gãy. Đánh đổi là luồng ảo chỉ giúp việc
      chờ. Nếu việc là tính toán thì số lõi bộ xử lý mới là giới hạn, và ở quy mô
      cực lớn phải giới hạn số yêu cầu đồng thời rồi chia ra nhiều máy.
- id: practice
  kind: practice
  title: 'Tự làm: ba luồng cộng chung một tổng'
  steps:
