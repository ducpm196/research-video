      ghi số dư. Luồng B tới sau, thấy khoá đang bị giữ, nên đứng chờ. Khi A xong,
      B mới vào. Hai việc chạy lần lượt, nên kết quả luôn đúng.
  - show: '<div><svg width="1500" height="440" viewBox="0 0 1500 440" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
