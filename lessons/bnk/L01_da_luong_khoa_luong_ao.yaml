- id: formula
  kind: formula
  title: 'Suy ra từng bước: bao nhiêu kết quả có thể xảy ra?'
  checks:
  - 2 * 2 == 4
  - math.comb(4, 2) == 6 == len(set(__import__('itertools').permutations([0, 0, 1,
    1])))
  - alg.bnk_lost_update(100, [50, 30]) == [130, 150, 180]
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi luồng gồm hai việc nhỏ, <b>đọc</b> rồi <b>ghi</b>,
      và việc ghi luôn sau việc đọc của cùng luồng.</p>

      <span class=''note''>Làm thử: hai luồng thì có $2 \cdot 2 = 4$ việc nhỏ.</span>

      '
    introduces:
    - cdot
    say: Bước một, vì mỗi luồng gồm hai việc nhỏ là đọc rồi ghi, và việc ghi luôn
      sau việc đọc của cùng luồng, nên hai luồng có bốn việc nhỏ.
  - show: '<p><b>Bước 2.</b> Cách xếp bốn việc vào bốn ô, giữ thứ tự trong từng luồng,
      bằng số cách chọn hai ô cho luồng A.</p>

      <span class=''note''>Làm thử: ô đầu của A có $4$ chỗ, ô sau còn $3$, được $4
      \cdot 3$; đổi chỗ hai ô vẫn là một cách chọn nên chia $2 \cdot 1$: $\frac{4
      \cdot 3}{2 \cdot 1} = 6$ cách.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì thứ tự trong từng luồng được giữ, nên số cách xếp bằng số cách
      chọn hai ô trong bốn ô cho luồng A. Làm thử, ô thứ nhất của A có bốn chỗ, ô
      thứ hai còn ba chỗ, nhưng đổi chỗ hai ô vẫn là cùng một cách chọn, nên bốn nhân
      ba chia hai nhân một bằng sáu cách.
  - show: '<p><b>Bước 3.</b> Chạy thử cả sáu cách: hai cách cho $180$, hai cách cho
      $130$, hai cách cho $150$.</p>

      <span class=''note''>Chỉ đúng khi một luồng xong cả đọc lẫn ghi rồi luồng kia
      mới đọc.</span>

      '
    focus:
    - 1
    - 2
    say: Bước ba, ta chạy thử cả sáu cách. Chỉ hai cách đúng, nên lỗi lúc có lúc không,
      rất khó thấy khi kiểm thử.
  - show: <table class='t'><tr><th>thứ tự bốn việc</th><th>số dư cuối</th></tr><tr><td>A
      đọc, A ghi, B đọc, B ghi</td><td><b>180</b></td></tr><tr><td>B đọc, B ghi, A
      đọc, A ghi</td><td><b>180</b></td></tr><tr><td>A đọc, B đọc, A ghi, B ghi</td><td>130</td></tr><tr><td>B
      đọc, A đọc, A ghi, B ghi</td><td>130</td></tr><tr><td>A đọc, B đọc, B ghi, A
      ghi</td><td>150</td></tr><tr><td>B đọc, A đọc, B ghi, A ghi</td><td>150</td></tr></table>
    clear: true
    say: Bốn cách còn lại có đọc chen nhau, và luồng ghi sau cùng quyết định kết quả,
      nên mất một khoản nạp.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 100 + 50 == 150
  - 100 + 30 == 130
  - 180 - 130 == 50
  - alg.bnk_lost_update(100, [50, 30])[-1] == 100 + 50 + 30
  steps:
  - show: '<p>Chạy A đọc, B đọc, A ghi, B ghi, với số dư đầu $100$.</p>

      $$① \; \text{A đọc } 100,\ \text{B đọc } 100$$

      '
    say: Phép tính thứ nhất, A đọc được một trăm, và B cũng đọc được một trăm, vì
      chưa ai ghi.
  - show: $$② \; \text{A ghi } 100 + 50 = \hl{150}$$
    say: Phép tính thứ hai, A ghi giá trị đã đọc cộng năm mươi, là một trăm năm mươi.
  - show: $$③ \; \text{B ghi } 100 + 30 = \hl{130}$$
    say: Phép tính thứ ba, B ghi giá trị mà B đã đọc, một trăm, cộng ba mươi, là một
      trăm ba mươi, và nó đè lên kết quả của A.
  - show: $$④ \; 180 - 130 = \hl{50}\ \text{đã mất}$$
    say: Phép tính thứ tư, kết quả đúng là một trăm tám mươi, thực tế còn một trăm
      ba mươi, nên mất đúng năm mươi, chính là khoản nạp của A.
  - show: '$$⑤ \; \text{có khoá: } 100 + 50 + 30 = \hlg{180}$$'
    say: Phép tính thứ năm, khi có khoá, hai việc chạy lần lượt, nên luôn ra một trăm
      tám mươi.
- id: chay_that
  kind: example
  title: 'Chạy thật: mất cập nhật, khoá, luồng ảo'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      static kiểu tên(kiểu a, kiểu b)</code></td><td>khai một hàm: <b>kiểu trả về</b>
      (<code>void</code> là không trả gì), <b>tên</b>, rồi <b>tham số</b> trong ngoặc
      tròn, mỗi tham số là kiểu rồi tên; <code>static</code>: thuộc cả lớp; <code>public</code>:
      nơi khác gọi được</td><td><code>static void nap(int tien, int cho)</code> —
      hàm <code>nap</code>, không trả gì, nhận hai số nguyên là tiền và thời gian
      chờ</td></tr><tr><td><code>static final Kiểu TÊN = …;</code></td><td>biến dùng
      chung cho cả lớp; <code>final</code>: gán giá trị một lần rồi không đổi nữa</td><td><code>static
      final Object KHOA = new Object();</code> — biến khoá dùng chung, gán một lần</td></tr></table>'
    clear: true
    say: Khai một hàm gồm kiểu giá trị trả về, rỗng nghĩa là không trả gì, rồi tên
      hàm, rồi các tham số trong ngoặc tròn, mỗi tham số là kiểu rồi tên. Chữ tĩnh
      nghĩa là hàm thuộc cả lớp, chữ công khai nghĩa là nơi khác gọi được. Ví dụ,
      hàm nạp, không trả gì, nhận tiền nạp và thời gian chờ. Chữ cuối cùng nghĩa là
      gán giá trị một lần rồi không đổi nữa, còn chữ tĩnh nghĩa là biến dùng chung
      cho cả lớp. Ví dụ, biến khoá gán một lần, giữ một đối tượng trống chỉ để làm
      khoá.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>try
      { … } catch (Lỗi e) { }</code></td><td>thử chạy khối; nếu bị ngắt giữa chừng
      thì vào <code>catch</code>; để trống vì ta không cần xử lý</td><td><code>try
      { Thread.sleep(cho); } catch (InterruptedException e) { }</code> — ngủ <code>cho</code>
      mili giây</td></tr></table>
    clear: true
    say: Khối thử chạy phần việc, nếu bị ngắt giữa chừng thì nhảy vào khối bắt, ở
      đây để trống vì ta không cần xử lý.
  - show: '<p><b>Tệp MatCapNhat.java (phần 1): nạp tiền, có chậm lại</b></p><div class="code"><div><span
      class="kw">public</span> <span class="kw">class</span> MatCapNhat {</div><div>    <span
      class="kw">static</span> <span class="kw">int</span> soDu = 100;</div><div>    <span
      class="kw">static</span> <span class="kw">void</span> nap(<span class="kw">int</span>
      tien, <span class="kw">int</span> cho) {</div><div>        <span class="kw">int</span>
      doc = soDu;   <span class="cm">// đọc số dư</span></div><div>        <span class="kw">try</span>
      { Thread.sleep(cho); } <span class="kw">catch</span> (InterruptedException e)
      { }   <span class="cm">// chậm lại</span></div><div>        soDu = doc + tien;   <span
      class="cm">// ghi số dư mới</span></div><div>    }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta chạy thật hai luồng cùng nạp tiền vào một số dư chung, biến tĩnh bắt đầu
      từ một trăm. Hàm nạp đọc số dư, ngủ một lúc để giả làm việc chậm, rồi ghi số
      dư đọc được cộng tiền nạp.
  - show: '<p><b>Phần 2: hai luồng nạp cùng lúc</b></p><div class="code"><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) <span class="kw">throws</span> Exception {</div><div>        Thread
      a = <span class="kw">new</span> Thread(() -&gt; nap(50, 100));   <span class="cm">//
      A nạp 50, chậm 100 ms</span></div><div>        Thread b = <span class="kw">new</span>
      Thread(() -&gt; nap(30, 200));   <span class="cm">// B nạp 30, chậm 200 ms</span></div><div>        a.start();
      b.start(); a.join(); b.join();</div><div>        System.out.println("so du =
      " + soDu);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Hàm chính tạo luồng A nạp năm mươi, ngủ một trăm mili giây, và luồng B nạp
      ba mươi, ngủ hai trăm mili giây. Rồi cho cả hai chạy, chờ cả hai xong và in
      số dư.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>so du = 130</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chạy thật in ra một trăm ba mươi, thay vì một trăm tám mươi, vì cả hai luồng
      đều đọc một trăm. Luồng B ghi đè lên một trăm năm mươi của A, nên khoản nạp
      của A biến mất. Thiếu giấc ngủ, lỗi vẫn có thể xảy ra nhưng thất thường.
  - show: '<p><b>Tệp CoKhoa.java (phần 1): bọc đọc rồi ghi trong khối đồng bộ</b></p><div
      class="code"><div><span class="kw">public</span> <span class="kw">class</span>
      CoKhoa {</div><div>    <span class="kw">static</span> <span class="kw">int</span>
      soDu = 100;</div><div>    <span class="kw">static</span> <span class="kw">final</span>
      Object KHOA = <span class="kw">new</span> Object();</div><div>    <span class="kw">static</span>
      <span class="kw">void</span> nap(<span class="kw">int</span> tien, <span class="kw">int</span>
      cho) {</div><div>        <span class="kw">synchronized</span> (KHOA) {   <span
      class="cm">// mỗi lúc chỉ một luồng vào khối này</span></div><div>            <span
      class="kw">int</span> doc = soDu;</div><div>            <span class="kw">try</span>
      { Thread.sleep(cho); } <span class="kw">catch</span> (InterruptedException e)
      { }</div><div>            soDu = doc + tien;</div><div>        }</div><div>    }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ ta bọc cả đoạn đọc rồi ghi vào một khối đồng bộ, dùng một đối tượng
      làm khoá. Lệnh ngủ nằm trong khối khoá chỉ để giả làm việc chậm; mã thật không
      giữ khoá lúc chờ, như lỗi hai sẽ nói.
  - show: '<p><b>Phần 2: hàm chính giữ nguyên</b></p><div class="code"><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) <span class="kw">throws</span> Exception {</div><div>        Thread
      a = <span class="kw">new</span> Thread(() -&gt; nap(50, 100));</div><div>        Thread
      b = <span class="kw">new</span> Thread(() -&gt; nap(30, 200));</div><div>        a.start();
      b.start(); a.join(); b.join();</div><div>        System.out.println("so du =
      " + soDu);</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Phần hai là hàm chính, như trước.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>so du = 180</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật in một trăm tám mươi, đúng. Vì hai luồng vào khối lần lượt, nên
      không còn chuyện đọc chen vào giữa, và không khoản nạp nào mất.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      (int i = 0; i &lt; n; i++) { … }</code></td><td>vòng lặp: i bắt đầu từ 0, còn
      i &lt; n thì làm khối, mỗi vòng tăng i thêm 1</td><td><code>for (int i = 0;
      i &lt; 10_000; i++)</code> — làm đúng mười nghìn lần</td></tr><tr><td><code>return
      giá_trị;</code></td><td>trả giá trị về cho nơi gọi hàm, và hàm kết thúc</td><td><code>return
      xong.incrementAndGet();</code> — tăng biến đếm rồi trả số mới</td></tr><tr><td><code>//
      chú thích</code></td><td>chú thích: máy bỏ qua, chỉ để người đọc hiểu mã</td><td><code>//
      đóng: chờ mọi việc xong</code></td></tr></table>'
    clear: true
    say: 'Vòng lặp có ba phần trong ngoặc: điểm bắt đầu, điều kiện để chạy tiếp, và
      bước tăng sau mỗi vòng. Lệnh trả về đưa một giá trị cho nơi gọi hàm và kết thúc
      hàm. Hai gạch chéo mở đầu một chú thích, máy bỏ qua, chỉ để người đọc hiểu mã.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>System.nanoTime()</code>,
      <code>/ 1_000_000</code></td><td><code>nanoTime</code>: đồng hồ chính xác tính
      bằng nano giây; chia 1 triệu ra mili giây</td><td><code>(System.nanoTime() -
      t0) / 1_000_000</code> — số mili giây đã trôi</td></tr><tr><td><code>"chữ" +
      giá_trị</code></td><td>dấu <code>+</code> giữa chữ và một giá trị nối chúng
      thành một chuỗi</td><td><code>"xong " + xong + " yeu cau"</code></td></tr></table>'
    clear: true
    say: Đồng hồ nano giây rất chính xác, và chia cho một triệu thì ra mili giây.
      Dấu cộng giữa chữ và một giá trị nối chúng thành một chuỗi.
  - show: '<p><b>Tệp LuongAo.java (phần 1): chuẩn bị</b></p><div class="code"><div><span
      class="kw">import</span> java.util.concurrent.*;</div><div><span class="kw">import</span>
      java.util.concurrent.atomic.AtomicInteger;</div><div><span class="kw">public</span>
      <span class="kw">class</span> LuongAo {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> Exception {</div><div>        AtomicInteger xong
      = <span class="kw">new</span> AtomicInteger();</div><div>        <span class="kw">long</span>
      t0 = System.nanoTime();</div><div>        <span class="kw">try</span> (ExecutorService
      ex = Executors.newVirtualThreadPerTaskExecutor()) {</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Còn đây là cách chạy bằng luồng ảo của Java hai mươi mốt. Hai dòng nhập lấy
      các lớp sẵn có về chạy việc song song và về biến đếm an toàn khi nhiều luồng
      cùng tăng. Ta ghi giờ bắt đầu, rồi mở một bộ phân việc, nơi mỗi việc được giao
      sẽ chạy bằng một luồng ảo riêng. Dòng có ngoặc tròn tự đóng bộ phân việc khi
      hết khối.
  - show: '<p><b>Phần 2: mười nghìn việc</b></p><div class="code"><div>            <span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; 10_000; i++)</div><div>                ex.submit(()
      -&gt; { Thread.sleep(100); <span class="kw">return</span> xong.incrementAndGet();
      });</div><div>        }   <span class="cm">// đóng: chờ mọi việc xong</span></div><div>        <span
      class="kw">long</span> ms = (System.nanoTime() - t0) / 1_000_000;</div><div>        System.out.println("xong
      " + xong + " yeu cau, duoi 2 giay? " + (ms &lt; 2000));</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Vòng lặp này giao ra đúng mười nghìn việc. Mỗi việc là một mũi tên: nó ngủ
      một phần mười giây, giả làm đang chờ đối tác, rồi tăng biến đếm. Đóng bộ phân
      việc nghĩa là chờ mọi việc xong.'
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>xong 10000 yeu cau,
      duoi 2 giay? true</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chạy thật cho thấy mười nghìn việc xong dưới hai giây. Với hai trăm luồng
      nền ta đã tính là mất năm giây, vì luồng ảo khi chờ nhả luồng chạy cho việc
      khác. Kết quả này đúng khi máy không quá tải.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: luồng ảo nhanh hơn bao nhiêu?'
  checks:
  - alg.bnk_batch_time(10000, 200, 0.1) == 5.0
  - abs(10000 / (200 / 0.1) - 5.0) < 1e-9
  - alg.bnk_batch_time(10000, 10000, 0.1) == 0.1
  steps:
  - show: '<p>Mười nghìn yêu cầu, mỗi yêu cầu chờ $0{,}1$ giây. Với $200$ luồng nền:</p>

      <p>Vì mỗi lượt xử lý được $200$ yêu cầu, nên cần $\frac{10\,000}{200} = 50$
      lượt:</p>

      $$50 \cdot 0{,}1 = \hl{5}\ \text{giây}$$

      '
    focus:
    - 1
    - 2
    - 3
    say: Mười nghìn yêu cầu, mỗi yêu cầu chờ không phẩy một giây. Vì mỗi lượt xử lý
      được hai trăm yêu cầu, nên cần năm mươi lượt. Năm mươi nhân không phẩy một bằng
      năm giây.
  - show: '<table class=''t''><tr><th>cách tính</th><th>kết quả</th></tr><tr><td>theo
      lô: 50 lô × 0,1 giây</td><td>5 giây</td></tr><tr><td>theo thông lượng: 200 ÷
      0,1 = 2000 yêu cầu mỗi giây, 10 000 ÷ 2000</td><td>5 giây</td></tr><tr><td>luồng
      ảo (mô hình lý tưởng): tất cả chờ cùng lúc</td><td>0,1 giây</td></tr></table>'
    say: Kiểm bằng đường khác. Thông lượng là hai trăm chia không phẩy một, bằng hai
      nghìn yêu cầu mỗi giây, nên mười nghìn yêu cầu mất năm giây, khớp với cách tính
      theo lô. Luồng ảo, trong mô hình lý tưởng bỏ qua chi phí CPU, chờ tất cả cùng
      lúc nên chỉ mất không phẩy một giây.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ rằng <code>soDu +=
      50</code> là một việc không thể chia nhỏ. Thực ra nó là <b>đọc, cộng, ghi</b>,
      nên luồng khác chen vào được. Trong bài ta gộp phép cộng vào bước ghi, nên mỗi
      luồng chỉ còn hai việc: đọc và ghi.</div>'
    say: Lỗi thứ nhất, của người mới. Nghĩ rằng một câu lệnh cộng thêm năm mươi là
      một việc không chia nhỏ được. Thực ra nó gồm đọc, cộng và ghi, nên luồng khác
      chen vào được. Trong bài ta gộp phép cộng vào bước ghi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Giữ
      khoá khi gọi mạng.</b> Khoá bao cả lời gọi sang đối tác mất $300$ ms

      thì mọi luồng khác chờ $300$ ms theo. Khoá chỉ nên bao đoạn đọc rồi ghi ngắn.<br><span
      class="note">Phép thử: đo thời gian giữ khoá.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là giữ khoá khi gọi mạng. Nếu khoá bao
      cả lời gọi sang đối tác mất ba trăm mili giây, mọi luồng khác phải chờ ba trăm
      mili giây theo. Khoá chỉ nên bao đoạn đọc rồi ghi ngắn.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nghĩ luồng ảo làm
      CPU chạy nhanh hơn. Nó chỉ giúp việc <b>chờ</b>.

      <code>synchronized</code> là từ khoá Java bọc một khối mã bằng khoá, mỗi lúc
      chỉ một luồng vào.

      Ở Java 21, chờ bên trong khối <code>synchronized</code> có thể <b>ghim</b> luồng
      ảo vào luồng nền (luồng nền bị giữ chân), mất lợi ích.

      Từ Java 24 (JEP 491, một bản đề xuất tính năng chính thức của Java), <code>synchronized</code>
      không còn ghim; gọi mã native (mã máy viết ngoài Java) vẫn ghim.</div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là nghĩ luồng ảo làm CPU chạy nhanh
      hơn. Nó chỉ giúp những việc phải chờ. Ở Java hai mươi mốt, chờ bên trong khối
      đồng bộ có thể ghim luồng ảo vào luồng nền, tức là giữ chân luồng nền, nên mất
      lợi ích. Từ Java hai mươi tư, khối đồng bộ không còn ghim, nhưng gọi mã máy
      gốc viết ngoài Java vẫn ghim.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - len(set(__import__('itertools').permutations([0, 0, 1, 1, 2, 2]))) == 90 == 720
    // 8
  - 6 * 5 * 4 * 3 * 2 * 1 == 720 == math.factorial(6) and 2 * 2 * 2 == 8
  - alg.bnk_batch_time(2000, 50, 0.2) == 8.0
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Ba
      luồng, mỗi luồng đọc rồi ghi. Có bao nhiêu cách xen kẽ?</td></tr><tr><td>2</td><td>2000
      yêu cầu, mỗi yêu cầu chờ 0,2 giây, 50 luồng nền. Mất bao lâu?</td></tr><tr><td>3</td><td>Quyết
      định: dịch vụ gọi đối tác chậm 300 ms, hàng nghìn yêu cầu cùng lúc. Chọn gì?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, ba luồng, mỗi luồng đọc rồi ghi,
      có bao nhiêu cách xen kẽ? Câu hai, hai nghìn yêu cầu, mỗi yêu cầu chờ không
      phẩy hai giây, năm mươi luồng nền, mất bao lâu? Câu ba, dịch vụ gọi đối tác
      chậm ba trăm mili giây, hàng nghìn yêu cầu cùng lúc, bạn chọn gì? Hãy dừng video
      và làm ra giấy.
  - show: '<p>Xếp $6$ việc vào $6$ ô: ô đầu có $6$ cách chọn việc, ô hai $5$ cách,
      …: $6 \cdot 5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 720$ thứ tự. Hai việc của mỗi
      luồng có $2$ cách đứng trước sau mà chỉ $1$ cách hợp lệ (đọc trước ghi sau),
      nên chia cho $2 \cdot 2 \cdot 2 = 8$.</p>

      $$\frac{720}{8} = \hl{90}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Xếp sáu việc vào sáu ô được bảy trăm hai mươi thứ tự. Mỗi
      luồng chỉ một trong hai cách đứng trước sau là hợp lệ, là đọc trước ghi sau,
      nên chia cho hai nhân hai nhân hai, là tám. Kết quả là chín mươi cách.
    clear: true
  - show: $$\frac{2000}{50} \cdot 0{,}2 = 40 \cdot 0{,}2 = \hlg{8}\ \text{giây}$$
    say: Đáp án câu hai. Hai nghìn chia năm mươi bằng bốn mươi lượt, nhân không phẩy
      hai, được tám giây.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>tăng
      số luồng nền lên rất lớn</td><td>không phải sửa mã</td><td>tốn bộ nhớ, hệ điều
      hành chuyển luồng nặng</td></tr><tr><td>luồng ảo (Java 21)</td><td>chờ gần như
      miễn phí, mã vẫn viết tuần tự</td><td>tránh chỗ gây ghim (Java 21: chờ trong
      synchronized; mã native); đo trước khi tin</td></tr></table>'
    say: Đáp án câu ba là một đánh đổi. Tăng số luồng nền thì không sửa mã nhưng tốn
      bộ nhớ. Luồng ảo cho phép chờ gần như miễn phí mà mã vẫn viết tuần tự, nhưng
      phải tránh ghim và phải đo.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: tải tăng ×100 và ×10 000, giải pháp nào gãy?'
  checks:
  - 10000 / 200 * 0.1 == 5.0
  - 1000000 / 200 * 0.1 == 500.0
  - round(500 / 60, 1) == 8.3
  - 100000000 / 200 * 0.1 == 50000.0
  - round(50000 / 3600, 1) == 13.9
  - 10000 * 1 == 10000
  - 1000000 * 1 == 10**6 and 100000000 * 1 == 10**8
  steps:
  - show: '<p>Mỗi yêu cầu chờ đối tác $0{,}1$ giây; có $200$ luồng nền; ngăn xếp (vùng
      nhớ riêng của luồng) mỗi luồng nền thường cỡ $1$ MB (tuỳ hệ điều hành); luồng
      ảo cỡ $1$ KB <i>(số minh hoạ)</i>.</p><table class=''t''><tr><th>tải</th><th>yêu
      cầu chờ cùng lúc</th><th>200 luồng nền: thời gian</th><th>một luồng nền mỗi
      yêu cầu: bộ nhớ</th><th>luồng ảo: bộ nhớ</th></tr><tr><td><span style="white-space:nowrap">×1</span></td><td>10
      000</td><td>5 giây</td><td>10 000 MB ≈ 10 GB</td><td>10 000 KB ≈ 10 MB</td></tr><tr><td><span
      style="white-space:nowrap">×100</span></td><td>1 000 000</td><td>500 giây ≈
      <b>8,3 phút</b></td><td>1 000 000 MB ≈ <b>1 TB</b></td><td>≈ 1 GB</td></tr><tr><td><span
      style="white-space:nowrap">×10 000</span></td><td>100 000 000</td><td>50 000
      giây ≈ <b>13,9 giờ</b></td><td>≈ <b>100 TB</b></td><td>≈ <b>100 GB</b></td></tr></table>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Giả sử mỗi yêu cầu chờ đối tác không phẩy một giây, có hai trăm luồng nền.
      Ngăn xếp, tức vùng nhớ riêng của luồng, mỗi luồng nền cỡ một mê ga byte, luồng
      ảo cỡ một ki lô byte. Đây là số minh hoạ. Với mười nghìn yêu cầu chờ cùng lúc,
      hai trăm luồng nền mất năm giây. Tải tăng một trăm lần thì mất tám phẩy ba phút,
      và tăng mười nghìn lần thì mất mười ba phẩy chín giờ.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Tăng số luồng nền:
      ở ×1 còn chạy được, ở ×100 một luồng mỗi yêu cầu cần cỡ 1 TB bộ nhớ, không máy
      nào có. Giữ 200 luồng thì mất 8,3 phút, người dùng bỏ đi.

      <b>Luồng ảo</b> kéo bộ nhớ xuống cỡ 1 GB, nhưng ở ×10 000 vẫn cần cỡ 100 GB:
      cũng gãy.</div>

      <div class="box key"><b>Đánh đổi người làm nghề chọn:</b> luồng ảo cho việc
      <b>chờ</b>; nếu việc là tính toán thì số lõi CPU mới là giới hạn. Ở quy mô cực
      lớn, phải <b>giới hạn số yêu cầu đồng thời</b> và <b>chia ra nhiều máy</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Ở tải gấp trăm lần, mỗi yêu cầu một luồng cần cỡ một nghìn tỉ byte, không
      máy nào có. Luồng ảo kéo bộ nhớ xuống cỡ một nghìn mê ga byte, nhưng gấp mười
      nghìn lần vẫn cần cỡ một trăm nghìn mê ga byte, nên cũng gãy. Đánh đổi là luồng
      ảo chỉ giúp việc chờ. Nếu việc là tính toán thì số lõi mới là giới hạn, và ở
      quy mô cực lớn phải giới hạn số yêu cầu đồng thời rồi chia ra nhiều máy.
- id: practice
  kind: practice
  title: 'Tự làm: ba luồng cộng chung một tổng'
  steps:
  - show: '<p><b>Đề</b>: ba luồng, mỗi luồng cộng 1 vào biến chung <code>tong</code>
      đúng 200 000 lần. Viết <code>TongBaLuong.java</code>:</p>

      <ol><li>biến chung <code>static long tong</code> và đối tượng khoá <code>KHOA</code></li>

      <li>mỗi lần cộng bọc trong <code>synchronized (KHOA) { … }</code></li>

      <li>tạo ba luồng, <code>start()</code> cả ba, <code>join()</code> cả ba</li>

      <li>in một dòng <code>tong = …</code></li></ol>

