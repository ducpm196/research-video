scenes:
- id: hook
  kind: hook
  title: Vì sao hai người cùng nạp tiền lại làm mất một khoản?
  steps:
  - show: '<p>Số dư là $100$. Người A nạp $50$, người B nạp $30$ cùng lúc. Đúng ra
      phải ra $180$.</p>

      <div class="box key">Nhưng máy có thể in ra <b>180</b>, <b>150</b> hoặc <b>130</b>,
      tuỳ luồng nào chen vào trước.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, số dư là một trăm. Người A nạp năm mươi, người B nạp ba mươi, cùng
      một lúc, nên kết quả đúng phải là một trăm tám mươi. Nhưng máy có thể in ra
      một trăm tám mươi, một trăm năm mươi, hoặc một trăm ba mươi, tuỳ luồng nào chen
      vào trước.
  - show: <table class='t'><tr><th>tình huống</th><th>hậu quả</th></tr><tr><td>hai
      luồng sửa cùng một số dư</td><td>mất một khoản nạp, ngân hàng lệch sổ</td></tr><tr><td>10
      000 yêu cầu cùng chờ đối tác trả lời</td><td>hết luồng, yêu cầu mới xếp hàng
      dài</td></tr></table>
    say: Hôm nay ta học hai chuyện. Một là hai luồng sửa cùng một số dư thì mất khoản
      nạp. Hai là mười nghìn yêu cầu cùng chờ đối tác thì dịch vụ hết luồng. Luồng
      ảo của Java hai mươi mốt giải quyết chuyện thứ hai.
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - 100 + 50 + 30 == 180
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Luồng</td><td>một dòng việc chạy riêng trong chương trình; nhiều luồng chạy
      cùng lúc và dùng chung dữ liệu</td><td>mỗi yêu cầu chuyển tiền một luồng</td></tr><tr><td>②
      Đọc rồi ghi</td><td>muốn tăng số dư phải đọc số cũ, cộng, rồi ghi lại</td><td>đọc
      100, ghi 150</td></tr><tr><td>③ Chạy xen kẽ</td><td>CPU (bộ xử lý chạy lệnh)
      đổi qua lại giữa các luồng ngay giữa chừng</td><td>A đọc, B đọc, rồi mới ghi</td></tr></table>
    say: Trước hết, ta cần hiểu ba điều sẽ dùng trong bài. Luồng là một dòng việc
      chạy riêng trong chương trình. Nhiều luồng chạy cùng lúc và dùng chung dữ liệu,
      ví dụ mỗi yêu cầu chuyển tiền có một luồng. Muốn tăng số dư phải đọc số cũ,
      cộng thêm, rồi ghi lại. Còn bộ xử lý chạy lệnh có thể đổi qua lại giữa các luồng
      ngay giữa chừng, nên A đọc, B đọc rồi mới ghi là chuyện bình thường.
  - show: <table class='t'><tr><th>thêm ba điều</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Máy chủ và yêu cầu</td><td>máy chủ là chương trình chạy liên tục, chờ máy khách
      (ứng dụng điện thoại, chương trình khác) gửi <b>yêu cầu</b>; mỗi yêu cầu được
      xử lý rồi trả lời</td><td>yêu cầu “chuyển 500 000 đồng”</td></tr><tr><td>⑤ Đối
      tác</td><td>hệ thống bên ngoài mà dịch vụ phải gọi qua mạng; trả lời chậm, cỡ
      hàng trăm mili giây</td><td>cổng thanh toán của đối tác</td></tr><tr><td>⑥ Cú
      pháp luồng trong Java</td><td><code>new Thread(việc)</code> tạo luồng; <code>start()</code>
      cho chạy; <code>join()</code> chờ luồng xong; <code>() -> { … }</code> viết
      gọn một việc</td><td><code>Runnable viec = () -> { … };</code></td></tr></table>
    clear: true
    say: Thêm ba điều nữa. Máy chủ là chương trình chạy liên tục, chờ máy khách gửi
      yêu cầu, mỗi yêu cầu được xử lý rồi trả lời. Đối tác là hệ thống bên ngoài mà
      dịch vụ phải gọi qua mạng, và nó trả lời khá chậm, cỡ hàng trăm mili giây. Cuối
      cùng là cú pháp luồng trong Java. Tạo luồng thì đưa cho nó một việc, lệnh bắt
      đầu cho luồng chạy, lệnh chờ cho luồng xong, và mũi tên với cặp ngoặc nhọn là
      cách viết gọn một việc.
  - show: $$100 + 50 + 30 = 180$$
    say: Nếu hai việc chạy lần lượt, hết việc này rồi mới tới việc kia, thì một trăm
      cộng năm mươi cộng ba mươi bằng một trăm tám mươi, đúng như mong đợi.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>race condition</td><td>kết
      quả phụ thuộc thứ tự chạy may rủi của các luồng</td></tr><tr><td>lost update</td><td>một
      lần ghi đè mất lần ghi trước</td></tr><tr><td>vùng găng</td><td>đoạn mã đọc
      rồi ghi dữ liệu dùng chung, chỉ an toàn khi mỗi lúc một luồng chạy</td></tr><tr><td>lock
      (khoá)</td><td>chỉ một luồng được vào vùng găng tại một thời điểm</td></tr><tr><td>blocking
      I/O</td><td>luồng đứng chờ mạng hoặc đĩa, không làm gì</td></tr><tr><td>virtual
      thread</td><td>luồng ảo, rất nhẹ, do Java quản lý chứ không do hệ điều hành</td></tr><tr><td>luồng
      nền (platform thread)</td><td>luồng thật do hệ điều hành quản lý, tạo bằng <code>new
      Thread</code></td></tr><tr><td>luồng chạy (carrier thread)</td><td><b>một</b>
      luồng nền mà luồng ảo đang mượn để chạy; luồng ảo chờ thì trả lại</td></tr></table>
    say: Bảng dưới đây giải nghĩa tám thuật ngữ mà bài sẽ dùng. Điều kiện tranh chấp
      là khi kết quả phụ thuộc thứ tự chạy may rủi. Mất cập nhật là khi một lần ghi
      đè mất lần ghi trước. Vùng găng là đoạn mã đọc rồi ghi dữ liệu dùng chung, chỉ
      an toàn khi mỗi lúc một luồng chạy. Khoá cho phép chỉ một luồng vào vùng găng.
      Chờ vào ra là khi luồng đứng đợi mạng hoặc đĩa. Luồng ảo là luồng rất nhẹ do
      Java quản lý. Luồng nền là luồng thật do hệ điều hành quản lý. Còn luồng chạy
      là một luồng nền mà luồng ảo đang mượn để chạy, và khi luồng ảo chờ thì trả
      nó lại.
