scenes:
- id: hook
  kind: hook
  title: Vì sao hai người cùng nạp tiền lại làm mất một khoản?
  steps:
  - show: '<p>Số dư là $100$. Người A nạp $50$, người B nạp $30$ cùng lúc, mỗi người
      là một <b>luồng</b>: một dòng việc chạy riêng. Đúng ra phải ra $180$.</p>

      <div class="box key">Nhưng máy có thể in ra <b>180</b>, <b>150</b> hoặc <b>130</b>,
      tuỳ luồng nào chen vào trước.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Số dư là một trăm. Người A nạp năm mươi, người B nạp ba mươi, cùng một lúc,
      mỗi người là một luồng, tức một dòng việc chạy riêng, nên kết quả đúng phải
      là một trăm tám mươi. Nhưng máy có thể in ra một trăm tám mươi, một trăm năm
      mươi, hoặc một trăm ba mươi, tuỳ luồng nào chen vào trước.
  - show: <table class='t'><tr><th>tình huống</th><th>hậu quả</th></tr><tr><td>hai
      luồng sửa cùng một số dư</td><td>mất một khoản nạp, ngân hàng lệch sổ</td></tr><tr><td>10
      000 lần gọi cùng chờ một hệ thống bên ngoài trả lời</td><td>hết luồng, lần gọi
      mới xếp hàng dài</td></tr></table>
    say: 'Hôm nay ta học hai chuyện: hai luồng sửa cùng một số dư thì mất khoản nạp,
      và mười nghìn lần gọi cùng chờ một hệ thống ngoài thì hết luồng. Luồng ảo của
      Java hai mươi mốt giải quyết chuyện thứ hai.'
- id: prereq
  kind: prereq
  title: 'Trước hết: chín điều cần hiểu'
  checks:
  - 100 + 50 + 30 == 180
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Luồng</td><td>một dòng việc chạy riêng trong chương trình; nhiều luồng chạy
      cùng lúc và dùng chung dữ liệu</td><td>mỗi yêu cầu chuyển tiền một luồng</td></tr><tr><td>②
      Đọc rồi ghi</td><td>muốn tăng số dư phải đọc số cũ, cộng, rồi ghi lại</td><td>đọc
      100, ghi 150</td></tr><tr><td>③ Chạy xen kẽ</td><td>CPU (bộ xử lý chạy lệnh)
      đổi qua lại giữa các luồng ngay giữa chừng</td><td>A đọc, B đọc, rồi mới ghi</td></tr></table>
    say: Ba điều cần hiểu. Luồng là một dòng việc chạy riêng trong chương trình. Nhiều
      luồng chạy cùng lúc và dùng chung dữ liệu. Muốn tăng số dư phải đọc số cũ, cộng
      thêm, rồi ghi lại. Còn bộ xử lý chạy lệnh có thể đổi qua lại giữa các luồng
      ngay giữa chừng, nên A đọc, B đọc rồi mới ghi là chuyện bình thường.
  - show: '<table class=''t''><tr><th>thêm ba điều</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Máy chủ và yêu cầu</td><td>máy chủ là chương trình chạy liên tục, chờ máy khách
      (ứng dụng điện thoại, chương trình khác) gửi <b>yêu cầu</b>; mỗi yêu cầu được
      xử lý rồi trả lời</td><td>yêu cầu “chuyển 500 000 đồng”</td></tr><tr><td>⑤ Đối
      tác</td><td>hệ thống bên ngoài mà dịch vụ phải gọi qua mạng; trả lời chậm, cỡ
      hàng trăm mili giây (1 mili giây = một phần nghìn giây)</td><td>cổng thanh toán
      của đối tác</td></tr><tr><td>⑥ Khung tệp và cú pháp luồng</td><td><code>main(String[]
      args) <b>throws Exception</b></code>: hàm chính; <code>throws Exception</code>
      chuyển lỗi lên cho nơi gọi xử lý (như luồng bị đánh thức lúc ngủ). <code>new
      Thread(việc)</code> tạo luồng; <code>start()</code> cho chạy; <code>join()</code>
      chờ xong; <code>() -> { … }</code> viết gọn một việc; <code>Runnable</code>
      là kiểu của việc giao cho luồng</td><td><code>Runnable viec = () -> { … };</code></td></tr></table>'
    clear: true
    say: Thêm ba điều nữa. Máy chủ là chương trình chạy liên tục, chờ máy khách gửi
      yêu cầu rồi trả lời. Đối tác là hệ thống bên ngoài mà dịch vụ gọi qua mạng,
      trả lời cỡ hàng trăm mili giây, mỗi mili giây là một phần nghìn giây. Cuối cùng
      là khung tệp Java. Chương trình chạy từ hàm chính, và lời báo ném lỗi chuyển
      lỗi lên cho nơi gọi xử lý. Tạo luồng thì đưa cho nó một việc, một lệnh cho chạy,
      một lệnh chờ xong, và mũi tên với ngoặc nhọn là cách viết gọn một việc.
  - show: '<table class=''t''><tr><th>thêm ba điều nữa</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>⑦
      Hệ điều hành và lõi</td><td>hệ điều hành là phần mềm nền lo chia máy cho các
      chương trình; lõi là một bộ phận của chip xử lý, mỗi lõi chạy một việc tại một
      lúc</td><td>Windows, Linux; chip 8 lõi</td></tr><tr><td>⑧ Đơn vị lớn</td><td>KB,
      MB, GB, TB: ki lô, mê ga, gi ga, tê ra byte; mỗi bậc gấp khoảng một nghìn lần
      bậc trước (chính xác 1024; từ đây ta làm tròn 1000 cho dễ tính)</td><td>1 GB
      ≈ một tỉ byte</td></tr><tr><td>⑨ <code>static</code> và khối đồng bộ</td><td><code>static</code>:
      biến dùng chung cho mọi luồng; <code>synchronized (KHOA) { … }</code>: khối
      mã mà mỗi lúc chỉ một luồng được vào</td><td><code>static int soDu</code></td></tr></table>'
    clear: true
    say: 'Ba điều cuối: hệ điều hành là phần mềm nền chia máy cho các chương trình,
      còn lõi là một bộ phận của chip, mỗi lõi chạy một việc tại một lúc. Các đơn
      vị lớn gồm ki lô, mê ga, gi ga và tê ra byte, mỗi bậc gấp khoảng một nghìn lần
      bậc trước. Chính xác là một nghìn không trăm hai mươi bốn, nhưng ta làm tròn.
      Biến dùng chung cho mọi luồng khai bằng một từ khoá riêng, còn khối đồng bộ
      chỉ cho một luồng vào mỗi lúc.'
    introduces:
    - bnk_he_dieu_hanh
    - bnk_loi_cpu
  - show: $$100 + 50 + 30 = 180$$
    say: Nếu hai việc chạy lần lượt thì một trăm cộng năm mươi cộng ba mươi bằng một
      trăm tám mươi, đúng như mong đợi.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>race condition</td><td>kết
      quả phụ thuộc thứ tự chạy may rủi của các luồng</td></tr><tr><td>lost update</td><td>một
      lần ghi đè mất lần ghi trước</td></tr><tr><td>vùng găng</td><td>đoạn mã đọc
      rồi ghi dữ liệu dùng chung, chỉ an toàn khi mỗi lúc một luồng chạy</td></tr><tr><td>lock
      (khoá)</td><td>chỉ một luồng được vào vùng găng tại một thời điểm</td></tr><tr><td>blocking
      I/O</td><td>luồng đứng chờ mạng hoặc đĩa, không làm gì</td></tr><tr><td>virtual
      thread</td><td>luồng ảo, rất nhẹ, do Java quản lý chứ không do hệ điều hành</td></tr><tr><td>luồng
      nền (platform thread)</td><td>luồng thật do hệ điều hành quản lý, tạo bằng <code>new
      Thread</code></td></tr><tr><td>luồng chạy (carrier thread)</td><td><b>một</b>
      luồng nền mà luồng ảo đang mượn để chạy; luồng ảo chờ thì trả lại</td></tr></table>
    say: Điều kiện tranh chấp là khi kết quả phụ thuộc thứ tự chạy may rủi. Mất cập
      nhật là khi một lần ghi đè mất lần ghi trước. Vùng găng là đoạn mã đọc rồi ghi
      dữ liệu dùng chung. Khoá cho phép chỉ một luồng vào vùng găng. Chờ vào ra là
      khi luồng đứng đợi mạng hoặc đĩa. Luồng ảo là luồng rất nhẹ do Java quản lý,
      còn luồng nền là luồng thật do hệ điều hành quản lý. Luồng chạy là một luồng
      nền mà luồng ảo đang mượn, và khi luồng ảo chờ thì trả nó lại.
- id: intuition
  kind: intuition
  title: 'Hình dung: xen kẽ, khoá, và luồng ảo'
  steps:
