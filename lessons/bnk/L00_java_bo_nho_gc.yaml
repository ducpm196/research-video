      x="990.0" y="203" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text><rect
      x="340" y="300" width="180" height="90" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3" stroke-dasharray="8 6"/><text x="430.0" y="353" font-size="24"
      text-anchor="middle" fill="#1f2937">D</text><rect x="620" y="300" width="180"
      height="90" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3" stroke-dasharray="8
      6"/><text x="710.0" y="353" font-size="24" text-anchor="middle" fill="#1f2937">E</text><rect
      x="1180" y="150" width="180" height="90" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3" stroke-dasharray="8 6"/><text x="1270.0" y="203" font-size="24"
      text-anchor="middle" fill="#1f2937">F</text><line x1="240" y1="195" x2="335"
