scenes:
- id: hook
  kind: hook
  title: Vì sao một con số tiền lại lệch, và vì sao dịch vụ sập sau vài ngày?
  steps:
  - show: '<p>Cộng mười lần số $0{,}1$ bằng kiểu số thực của Java, máy in ra <b>0.9999999999999999</b>,
      không phải $1$.</p>

      <div class="box key">Hôm nay ta trả lời ba câu: <b>đối tượng nằm ở đâu</b> trong
      bộ nhớ, <b>ai dọn rác</b>, và <b>tiền nên lưu bằng kiểu gì</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, cộng mười lần số không phẩy một bằng kiểu số thực của Java, máy
      không cho ra đúng một. Nó cho ra không phẩy chín chín chín, chín chín chín,
      và còn nhiều chữ chín nữa. Một ngân hàng không thể chấp nhận sai lệch như vậy.
  - show: '<p>Một dịch vụ khác chạy tốt vài ngày rồi báo hết bộ nhớ và sập. Mã không
      có lỗi cú pháp nào.</p>

      <div class="box key">Cả hai lỗi đều có gốc ở một chỗ: <b>hiểu sai cách Java
      giữ dữ liệu</b>.</div>

      '
    focus:
    - 1
    - 2
    say: Một dịch vụ khác chạy tốt vài ngày, rồi báo hết bộ nhớ và sập, dù mã không
      có lỗi cú pháp nào. Cả hai lỗi đều có gốc ở một chỗ, là hiểu sai cách Java giữ
      dữ liệu.
- id: prereq
  kind: prereq
  title: 'Trước hết: chín khái niệm cần hiểu'
  checks:
  - 1024 * 1024 == 1048576
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Biến</td><td>cái tên gắn với một giá trị</td><td><code>int a = 5</code>: tên
      a giữ số năm</td></tr><tr><td>② Lớp</td><td>bản thiết kế: nói một loại đồ vật
      có những dữ liệu gì, làm được việc gì</td><td>lớp <code>TaiKhoan</code></td></tr><tr><td>③
      Đối tượng</td><td>một đồ vật cụ thể làm theo bản thiết kế lớp</td><td>tài khoản
      có số dư 100</td></tr></table>'
    say: Trước hết ta cần hiểu ba điều. Điều thứ nhất, biến là một cái tên gắn với
      một giá trị, ví dụ tên a giữ số năm. Điều thứ hai, lớp là một bản thiết kế,
      nói một loại đồ vật có những dữ liệu gì và làm được việc gì, ví dụ lớp tài khoản.
      Điều thứ ba, đối tượng là một đồ vật cụ thể làm theo bản thiết kế đó, ví dụ
      một tài khoản có số dư một trăm.
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Trường</td><td>một ô dữ liệu bên trong đối tượng</td><td>trường <code>soDu</code>
      giữ 100</td></tr><tr><td>⑤ Phương thức</td><td>một việc đối tượng làm được,
      gọi bằng dấu chấm</td><td><code>s.equals(t)</code>: hỏi s có cùng nội dung với
      t không</td></tr><tr><td>⑥ Tham chiếu</td><td>giá trị chỉ đường tới một đối
      tượng; biến giữ tham chiếu chứ không giữ cả đối tượng</td><td>tờ giấy ghi địa
      chỉ nhà, không phải ngôi nhà</td></tr></table>'
    clear: true
    say: Thêm ba điều nữa. Trường là một ô dữ liệu bên trong đối tượng, ví dụ trường
      số dư giữ một trăm. Phương thức là một việc đối tượng làm được, và ta gọi nó
      bằng dấu chấm, ví dụ hỏi chuỗi s có cùng nội dung với chuỗi t không. Còn tham
      chiếu là giá trị chỉ đường tới một đối tượng, giống tờ giấy ghi địa chỉ nhà,
      chứ không phải chính ngôi nhà.
  - show: '<table class=''t''><tr><th>thêm ba thứ dùng trong mã</th><th>nghĩa</th><th>ví
      dụ</th></tr><tr><td>⑦ Mảng byte</td><td>dãy ô nhớ liền nhau, mỗi ô một byte</td><td><code>new
      byte[1_000_000]</code>: một triệu ô, gần 1 MB</td></tr><tr><td>⑧ Bản đồ (Map)</td><td>bảng
      tra: đưa khoá vào thì lấy ra giá trị</td><td><code>map.put(1, x)</code>: cất
      x dưới khoá 1</td></tr><tr><td>⑨ Tham chiếu yếu</td><td>dây buộc lỏng: trỏ tới
      đối tượng nhưng <b>không giữ nó sống</b></td><td><code>WeakReference</code>:
      hỏi <code>get()</code> còn đối tượng hay đã bị dọn</td></tr></table>'
    clear: true
    say: Thêm ba thứ sẽ xuất hiện trong mã. Mảng byte là dãy ô nhớ liền nhau, mỗi
      ô một byte, ví dụ một triệu ô là gần một mê ga byte. Bản đồ là bảng tra, đưa
      khoá vào thì lấy ra giá trị. Tham chiếu yếu là dây buộc lỏng, nó trỏ tới đối
      tượng nhưng không giữ đối tượng sống, chỉ dùng để hỏi xem đối tượng còn hay
      đã bị dọn.
  - show: '<p>Một đơn vị đo bộ nhớ (cách tính quen dùng cho bộ nhớ): $1\,\text{KB}
      = 1024$ byte, và $1\,\text{MB} = 1024 \cdot 1024 = 1\,048\,576$ byte.</p>'
    introduces:
    - cdot
    say: 'Thêm một đơn vị đo, theo cách tính quen dùng cho bộ nhớ: một ki lô byte
      bằng một nghìn không trăm hai mươi bốn byte, và một mê ga byte là số đó nhân
      với chính nó.'
- id: sym
  kind: symbol
  title: Giải mã vài chữ trong mã Java
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr>

      <tr><td><code>new TaiKhoan()</code></td><td>tạo một đối tượng mới của lớp <code>TaiKhoan</code>
      trên heap</td></tr>

      <tr><td><code>tk</code></td><td>tên biến giữ tham chiếu tới đối tượng</td></tr>

      <tr><td><code>tk.soDu</code></td><td>dấu chấm: đi theo tham chiếu tới trường
      <code>soDu</code> của đối tượng</td></tr>

      <tr><td><code>a == b</code></td><td>với hai biến đối tượng: so hai tham chiếu
      có trỏ cùng một đối tượng không (với số như <code>int</code> thì so giá trị)</td></tr></table>

      '
    say: Bảng này giải mã bốn mẫu chữ hay gặp. Từ khoá tạo đối tượng sinh ra một đối
      tượng mới của lớp tài khoản trên vùng nhớ heap. Biến tài khoản giữ tham chiếu
      tới đối tượng đó. Dấu chấm nghĩa là đi theo tham chiếu để tới một trường bên
      trong. Còn với hai biến đối tượng, hai dấu bằng so xem hai tham chiếu có trỏ
      cùng một đối tượng hay không, còn với số nguyên thì so giá trị.
