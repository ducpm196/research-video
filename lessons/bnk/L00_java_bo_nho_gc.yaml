- id: formula
  kind: formula
  title: 'Suy ra từng bước: đánh dấu rồi quét'
  checks:
  - 'alg.bnk_reachable({''A'': [''B''], ''B'': [''C''], ''C'': [], ''D'': [''E''],
    ''E'': [], ''F'': []}, [''A'']) == [''A'', ''B'', ''C'']'
  - 6 - 3 == 3
  steps:
  - show: '<p><b>Bước 1. Chọn các gốc.</b> Gốc là những chỗ chắc chắn còn dùng: biến
      cục bộ của các hàm đang chạy, biến <code>static</code> (biến gắn với cả lớp,
      sống suốt chương trình), và các luồng đang chạy (luồng: một dòng việc chạy riêng).</p>

      <span class=''note''>Làm thử: ở hình trước, gốc chỉ trỏ tới A, nên tập đánh
      dấu ban đầu là {A}.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước một, chọn các gốc. Gốc là những chỗ chắc chắn còn được dùng, như biến
      cục bộ của các hàm đang chạy, biến tĩnh, và các luồng đang chạy. Biến tĩnh là
      biến gắn với cả lớp, sống suốt chương trình. Luồng là một dòng việc chạy riêng
      trong chương trình. Làm thử với hình trước, gốc chỉ trỏ tới A, nên tập đánh
      dấu lúc đầu chỉ có A.
  - show: '<p><b>Bước 2. Đi theo mũi tên.</b> Mỗi đối tượng được đánh dấu thì đánh
      dấu luôn mọi đối tượng nó trỏ tới, lặp đến khi hết.</p>

      <span class=''note''>Làm thử: A trỏ B, B trỏ C, C không trỏ gì, nên tập là {A,
      B, C}.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, đi theo mũi tên. Hễ một đối tượng được đánh dấu thì mọi đối tượng
      nó trỏ tới cũng được đánh dấu, lặp cho tới khi hết. Làm thử, A trỏ tới B, B
      trỏ tới C, C không trỏ đi đâu, nên tập đánh dấu là A, B, C.
  - show: '<p><b>Bước 3. Quét.</b> Mọi đối tượng chưa được đánh dấu là rác, bộ nhớ
      của chúng được giải phóng.</p>

      <span class=''note''>Làm thử: sáu đối tượng trừ ba đã đánh dấu còn ba đối tượng
      rác: D, E, F.</span>

      <p>Thực tế: bộ thu gom G1 (mặc định trên máy chủ thông thường từ Java 9) thường
      không quét từng ô, mà chép đối tượng sống sang vùng mới rồi giải phóng cả vùng
      cũ.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Bước ba, quét. Mọi đối tượng chưa được đánh dấu là rác, và bộ nhớ của chúng
      được giải phóng. Làm thử, vì có sáu đối tượng và đã đánh dấu ba, nên còn lại
      ba đối tượng rác, là D, E và F. Trong thực tế, bộ thu gom mặc định của Java
      trên máy chủ thông thường không quét từng ô, mà chép đối tượng sống sang vùng
      mới rồi giải phóng cả vùng cũ. Ý tưởng tới được từ gốc thì vẫn như vậy.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 6 * 100 == 600
  - 'len(alg.bnk_reachable({''A'': [''B''], ''B'': [''C''], ''C'': [], ''D'': [''E''],
    ''E'': [], ''F'': []}, [''A''])) * 100 == 300'
  - 600 - 300 == 300 == 3 * 100
  - 'len(alg.bnk_reachable({''A'': [], ''B'': [''C''], ''C'': [], ''D'': [''E''],
    ''E'': [], ''F'': []}, [''A''])) == 1 and (6 - 1) * 100 == 500'
  steps:
  - show: '<p>Giả sử mỗi đối tượng chiếm $100$ byte <i>(số minh hoạ)</i>, và heap
      đang có sáu đối tượng A đến F.</p>

      $$① \; 6 \cdot 100 = \hl{600}\ \text{byte}$$

      '
    focus:
    - 1
    - 2
    say: Giả sử mỗi đối tượng chiếm một trăm byte, đây là số minh hoạ, và heap đang
      có sáu đối tượng từ A đến F. Phép tính thứ nhất, tổng bộ nhớ là sáu nhân một
      trăm, bằng sáu trăm byte.
  - show: '<p>Đối tượng còn sống: A, B, C.</p>

      $$② \; \text{sống} = 3$$

      '
    say: Phép tính thứ hai, theo bước đánh dấu, đối tượng còn sống là A, B và C, tức
      là ba đối tượng.
  - show: '<p>Dùng lại $3$ đối tượng sống ở phép ②.</p>

      $$③ \; 3 \cdot 100 = \hlg{300}\ \text{byte}$$

      '
    say: Phép tính thứ ba, bộ nhớ đang sống là ba nhân một trăm, bằng ba trăm byte.
  - show: '<p>Dùng lại $600$ ở ① và $300$ ở ③.</p>

      $$④ \; 600 - 300 = \hl{300}\ \text{byte} = 3 \cdot 100$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ tư, bộ nhớ dọn được là sáu trăm trừ ba trăm, bằng ba trăm byte.
      Số này đúng bằng ba đối tượng D, E, F nhân một trăm.
  - show: '<p>Bây giờ xoá mũi tên A→B. Gốc chỉ còn tới A, nên tập sống là {A}: sống
      $1$, rác $5$.</p>

      $$⑤ \; 5 \cdot 100 = \hl{500}\ \text{byte}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bây giờ xoá mũi tên từ A sang B. Gốc chỉ còn tới được A, nên tập sống chỉ
      còn một đối tượng, và rác là năm đối tượng. Phép tính thứ năm, dọn được năm
      nhân một trăm, bằng năm trăm byte.
- id: chay_that
  kind: example
  title: 'Chạy thật: tham chiếu mạnh, tham chiếu yếu và gốc static'
  steps:
  - show: '<p><b>Tệp GiuThamChieu.java (phần chính)</b></p><div class="code"><div>Object
      tk = <span class="kw">new</span> <span class="kw">byte</span>[1_000_000];                       <span
      class="cm">// một đối tượng gần 1 MB trên heap</span></div><div>WeakReference&lt;Object&gt;
      yeu = <span class="kw">new</span> WeakReference&lt;&gt;(tk);   <span class="cm">//
      tham chiếu yếu: chỉ để hỏi, không giữ sống</span></div><div>System.out.println("con
      tham chieu: " + (yeu.get() != <span class="kw">null</span>));</div><div>tk =
      <span class="kw">null</span>;                                             <span
      class="cm">// bỏ tham chiếu mạnh cuối cùng</span></div><div>System.gc();                                           <span
      class="cm">// xin máy dọn rác</span></div><div>System.out.println("sau khi bo:
      " + (yeu.get() != <span class="kw">null</span>));</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta chạy thật một chương trình ngắn. Dòng đầu tạo một đối tượng gần một mê
      ga byte, và biến thứ nhất giữ tham chiếu tới nó. Dòng thứ hai buộc thêm một
      tham chiếu yếu, chỉ để hỏi đối tượng còn hay không. Rồi ta gán tham chiếu mạnh
      bằng rỗng và xin máy dọn rác.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>con tham chieu: true</div><div>sau
      khi bo: false</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Kết quả in thật có hai dòng. Dòng đầu là còn, vì biến vẫn trỏ tới đối tượng.
      Dòng sau là không còn, vì hết tham chiếu mạnh thì đối tượng thành rác và máy
      đã dọn nó. Theo đặc tả, lệnh xin dọn chỉ là gợi ý, nhưng ở cách chạy mặc định
      của máy ảo Java trên máy này, nó được thực hiện.
  - show: '<p><b>Tệp RoRi.java (phần chính)</b></p><div class="code"><div><span class="kw">static</span>
      <span class="kw">final</span> Map&lt;Integer, <span class="kw">byte</span>[]&gt;
      BO_DEM = <span class="kw">new</span> HashMap&lt;&gt;();   <span class="cm">//
      biến static: một gốc</span></div><div><span class="kw">static</span> <span class="kw">long</span>
      dungMB() {</div><div>    System.gc();</div><div>    Runtime rt = Runtime.getRuntime();</div><div>    <span
      class="kw">return</span> (rt.totalMemory() - rt.freeMemory()) / 1_000_000;   <span
      class="cm">// heap đang dùng, đơn vị MB</span></div><div>}</div><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>    <span class="kw">for</span> (<span class="kw">int</span> i =
      1; i &lt;= 5; i++) BO_DEM.put(i, <span class="kw">new</span> <span class="kw">byte</span>[1_000_000]);</div><div>    System.out.println("giu
      5 doi tuong, heap &gt;= 5 MB? " + (dungMB() &gt;= 5));</div><div>    BO_DEM.clear();</div><div>    System.out.println("sau
      khi xoa, heap &gt;= 5 MB? " + (dungMB() &gt;= 5));</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bây giờ tới gốc tĩnh. Biến tĩnh bản đồ là một gốc, nên mọi mảng nó giữ đều
      còn tới được. Đối tượng Runtime cho biết bộ nhớ của chương trình, gồm tổng bộ
      nhớ đã xin và phần còn trống. Hàm đo gọi dọn rác rồi lấy hiệu hai số đó, ra
      số mê ga byte heap đang dùng. Ta bỏ năm mảng, mỗi mảng một mê ga byte, vào bản
      đồ và đo. Sau đó xoá bản đồ và đo lại.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>giu 5 doi tuong, heap
      &gt;= 5 MB? true</div><div>sau khi xoa, heap &gt;= 5 MB? false</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Khi bản đồ còn giữ năm mảng, heap đang dùng từ năm mê ga byte trở lên, kết
      quả là đúng. Xoá bản đồ rồi, năm mảng thành rác và bị dọn, nên heap không còn
      tới năm mê ga byte. Vậy rác còn nằm trong bản đồ tĩnh thì không bị dọn. Đó chính
      là rò rỉ bộ nhớ.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tiền không được lưu bằng số thực'
  checks:
  - alg.bnk_float_vs_decimal()[0] != 1.0
  - str(alg.bnk_float_vs_decimal()[1]) == '1.0'
  - alg.bnk_float_vs_decimal()[2] == 10
  - __import__('decimal').Decimal(0.1) != __import__('decimal').Decimal('0.1')
  - sum([1] * 10) == 10
  - 'len([o for o in ''ABCDEF'' if o not in alg.bnk_reachable({''A'': [''B''], ''B'':
    [''C''], ''D'': [''E'']}, [''A''])]) == 3'
  steps:
  - show: '<p>Đường khác cho phần dọn rác: đếm thẳng từng đối tượng. A, B, C có đường
      từ gốc. D trỏ tới E nhưng không có đường từ gốc.

      F không ai trỏ. Rác: $3$ ✓ — <b>bị trỏ tới chưa chắc còn sống</b>.</p>

      '
    say: Kiểm bằng đường khác, đếm thẳng từng đối tượng. A, B và C đều có đường từ
      gốc. D trỏ tới E, nhưng cả hai không có đường từ gốc. F không ai trỏ tới. Vậy
      rác là ba đối tượng, khớp với kết quả ở trên. Lưu ý, bị trỏ tới chưa chắc còn
      sống, phải tới được từ gốc.
  - show: '<table class=''t''><tr><th>cách lưu tiền</th><th>cộng 10 lần 0,1</th><th>đúng
      1?</th></tr><tr><td>kiểu double (số thực nhị phân)</td><td>0.9999999999999999</td><td>không</td></tr><tr><td>BigDecimal
      tạo từ chuỗi <code>"0.1"</code> (số thập phân)</td><td>1.0</td><td>có</td></tr><tr><td>số
      nguyên theo đơn vị nhỏ nhất: lưu 0,1 thành 1 phần mười</td><td>1 + 1 + … = 10
      phần mười = 1</td><td>có</td></tr></table>'
    say: Bảng này so ba cách lưu tiền. Kiểu số thực nhị phân không biểu diễn đúng
      số không phẩy một, nên cộng mười lần bị lệch. BigDecimal giữ số thập phân nên
      đúng, với điều kiện tạo nó từ chuỗi chữ không phẩy một. Nếu tạo từ một số thực
      nhị phân, nó mang theo luôn sai lệch. Cách thứ ba là lưu số nguyên theo đơn
      vị nhỏ nhất. Ở đây đơn vị là một phần mười, nên cộng mười lần số một được mười
      phần mười, đúng bằng một.
  - show: '<p><b>Tệp CongTien.java (phần chính)</b></p><div class="code"><div><span
      class="kw">double</span> a = 0;</div><div>BigDecimal b = BigDecimal.ZERO;</div><div><span
      class="kw">long</span> c = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      i = 0; i &lt; 10; i++) {</div><div>    a += 0.1;                           <span
      class="cm">// số thực nhị phân</span></div><div>    b = b.add(<span class="kw">new</span>
      BigDecimal("0.1"));   <span class="cm">// số thập phân, tạo từ chuỗi</span></div><div>    c
      += 1;                             <span class="cm">// số nguyên: đơn vị một
      phần mười</span></div><div>}</div><div>System.out.println(a + " | " + b + "
      | " + c + " phan muoi");</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là chương trình cộng bằng ba cách. Biến thứ nhất là số thực nhị phân,
      biến thứ hai là số thập phân tạo từ chuỗi, biến thứ ba là số nguyên đếm theo
      phần mười. Mỗi vòng cộng một phần mười vào cả ba, tổng cộng mười vòng.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>0.9999999999999999
      | 1.0 | 10 phan muoi</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật, ba kết quả khác nhau đúng như bảng vừa nói. Số thực nhị phân cho
      không phẩy chín chín chín và nhiều chữ chín, vì nó không biểu diễn đúng không
      phẩy một, nên hai cách còn lại cho đúng một.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Dùng <code>==</code> để
      so hai chuỗi hay hai đối tượng. <code>==</code> chỉ hỏi

      “cùng một đối tượng không”, nên hai chuỗi giống chữ nhưng tạo riêng vẫn cho
      <code>false</code>. Muốn so nội dung dùng <code>equals</code>.</div>

      '
    say: Lỗi thứ nhất, của người mới. Dùng hai dấu bằng để so hai chuỗi. Nó chỉ hỏi
      hai tham chiếu có cùng một đối tượng không. Hai chuỗi giống chữ nhưng tạo riêng
      vẫn cho kết quả là không bằng nhau. Muốn so nội dung thì gọi phương thức so
      sánh nội dung bằng dấu chấm.
  - show: '<p><b>Chạy thật: hai chuỗi cùng chữ</b></p><div class="code"><div>String
      s = <span class="kw">new</span> String("abc");</div><div>String t = <span class="kw">new</span>
      String("abc");</div><div>System.out.println(s == t);        <span class="cm">//
      cùng một đối tượng?</span></div><div>System.out.println(s.equals(t));   <span
      class="cm">// cùng nội dung?</span></div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>false</div><div>true</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Chạy thật hai chuỗi cùng chữ a b c, nhưng được tạo riêng bằng từ khoá tạo
      mới. Phép so hai dấu bằng cho kết quả sai, vì đó là hai đối tượng khác nhau.
      Phương thức so nội dung cho kết quả đúng.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Rò
      rỉ bộ nhớ</b>: bỏ dữ liệu vào một <code>static Map</code> làm bộ đệm (nơi giữ
      sẵn dữ liệu hay dùng để lấy lại cho nhanh)

      mà không bao giờ xoá. Gốc <code>static</code> vẫn trỏ tới chúng, nên chúng vẫn
      “tới được” và bộ thu gom rác không dọn.

      <br><span class="note">Phép thử: theo dõi kích thước heap sau mỗi lần dọn; nếu
      cứ tăng thì có thứ đang bị giữ.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là rò rỉ bộ nhớ. Họ bỏ dữ liệu vào một
      bản đồ tĩnh làm bộ đệm, tức nơi giữ sẵn dữ liệu hay dùng để lấy lại cho nhanh,
      mà không bao giờ xoá. Gốc tĩnh vẫn trỏ tới chúng, nên chúng vẫn tới được, và
      bộ thu gom rác không dọn. Hãy theo dõi kích thước heap sau mỗi lần dọn. Nếu
      nó cứ tăng, có thứ đang bị giữ.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Dùng <code>double</code>
      cho số tiền rồi so sánh <code>==</code>. Kết quả

      lệch ở chữ số thập phân thứ mười sáu, đủ làm đối soát cuối ngày không khớp.</div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm. Dùng kiểu số thực nhị phân cho số tiền,
      rồi so sánh bằng nhau. Sai lệch nhỏ ở chữ số thập phân thứ mười sáu cũng đủ
      làm đối soát cuối ngày không khớp.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '4 - len(alg.bnk_reachable({''X'': [''Y''], ''Z'': [''W'']}, [''X''])) == 2'
  - 2 * 50 == 100
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Heap
      có 4 đối tượng, gốc chỉ trỏ tới X, X trỏ tới Y, Z trỏ tới W. Mấy đối tượng là
      rác?</td></tr><tr><td>2</td><td>Mỗi đối tượng 50 byte. Dọn được bao nhiêu byte?</td></tr><tr><td>3</td><td>Quyết
      định: lưu số dư bằng double hay số nguyên?</td></tr></table>'
    pause: 20
    say: Bây giờ đến lượt bạn. Câu một, heap có bốn đối tượng, gốc chỉ trỏ tới X,
      X trỏ tới Y, còn Z trỏ tới W. Có mấy đối tượng là rác? Câu hai, mỗi đối tượng
      năm mươi byte, dọn được bao nhiêu byte? Câu ba, lưu số dư bằng số thực nhị phân
      hay số nguyên? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1. Gốc → X → Y nên sống là X và Y. Z và W không có đường từ gốc.</p>

      $$4 - 2 = \hl{2}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Từ gốc đi tới X rồi Y, nên sống là hai đối tượng X và Y.
      Z và W không có đường từ gốc, nên rác là bốn trừ hai bằng hai.
    clear: true
  - show: $$2 \cdot 50 = \hlg{100}\ \text{byte}$$
    say: Đáp án câu hai. Hai đối tượng rác nhân năm mươi byte, bằng một trăm byte.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>double</td><td>tính
      nhanh, dễ viết</td><td>lệch ở chữ số cuối, không an toàn cho tiền</td></tr><tr><td>số
      nguyên đơn vị nhỏ nhất</td><td>chính xác, nhanh</td><td>phải nhớ đơn vị khi
      hiển thị</td></tr></table>
    say: Đáp án câu ba là một đánh đổi. Số thực nhị phân dễ viết nhưng lệch. Số nguyên
      đơn vị nhỏ nhất, hoặc BigDecimal, chính xác. Với tiền hãy chọn cách chính xác.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: rò rỉ nhỏ, tải lớn'
  checks:
  - round(4 * 1024**3 / 10240) == 419430
  - round(419430 / 86400, 1) == 4.9
  - 10 * 1024 == 10240
  - 1000 * 1024 == 1024000
  - round(4 * 1024**3 / 1024000) == 4194
  - round(4194 / 60) == 70
  - 100000 * 1024 == 102400000
  - round(4 * 1024**3 / 102400000) == 42
  - 10000 * 1024 == 10240000
  steps:
  - show: '<p>Giả sử mỗi yêu cầu bỏ lại $1$ KB (1024 byte) trong bản đồ tĩnh, và heap
      của dịch vụ là $4$ GB $= 4 \cdot 1024^3$ byte <i>(số minh hoạ)</i>.</p>

      $$\text{thời gian đầy} = \frac{4 \cdot 1024^3}{\text{yêu cầu mỗi giây} \cdot
      1024}\ \text{giây}$$

      <table class=''t''><tr><th>tải</th><th>yêu cầu mỗi giây</th><th>rò rỉ mỗi giây</th><th>đầy
      heap sau</th></tr><tr><td>×1</td><td>10</td><td>10 240 byte</td><td>≈ 419 430
      giây ≈ <b>4,9 ngày</b></td></tr><tr><td>×100</td><td>1 000</td><td>1 024 000
      byte</td><td>≈ 4 194 giây ≈ <b>70 phút</b></td></tr><tr><td>×10 000</td><td>100
      000</td><td>102 400 000 byte</td><td>≈ <b>42 giây</b></td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Giả sử mỗi yêu cầu bỏ lại một ki lô byte trong bản đồ tĩnh, và heap của dịch
      vụ là bốn nghìn không trăm chín mươi sáu mê ga byte. Đây là số minh hoạ. Thời
      gian đầy bằng tổng heap chia cho tốc độ rò rỉ mỗi giây. Với mười yêu cầu mỗi
      giây, heap đầy sau khoảng bốn phẩy chín ngày. Tải tăng một trăm lần, còn khoảng
      bảy mươi phút. Tải tăng mười nghìn lần, chỉ còn khoảng bốn mươi hai giây.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Khởi động lại dịch
      vụ mỗi đêm đủ ở tải ×1 vì 4,9 ngày dài hơn một ngày. Ở ×100 phải khởi động lại
      mỗi giờ, ở ×10 000 thì sập

      trước khi kịp khởi động lại. <b>Tăng heap gấp đôi</b> chỉ kéo dài gấp đôi thời
      gian, không đổi bản chất.</div>

      <div class="box key"><b>Sửa gốc:</b> giới hạn bộ đệm, ví dụ tối đa $10\,000$
      mục, tức tối đa $10\,240\,000$ byte (khoảng 10 MB) dù tải bao nhiêu.

      <b>Đánh đổi:</b> mục bị đuổi đi thì lần sau phải tra lại từ nguồn gốc, chậm
      hơn.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giải pháp cũ là khởi động lại dịch vụ mỗi đêm. Nó đủ ở tải gốc vì bốn phẩy
      chín ngày dài hơn một ngày. Ở tải gấp trăm lần phải khởi động lại mỗi giờ, và
      ở tải gấp mười nghìn lần dịch vụ sập trước khi kịp khởi động lại. Tăng heap
      gấp đôi chỉ kéo dài gấp đôi thời gian, không đổi bản chất. Cách sửa gốc là giới
      hạn bộ đệm, ví dụ tối đa mười nghìn mục, tức khoảng mười mê ga byte dù tải bao
      nhiêu. Đánh đổi là mục bị đuổi đi thì lần sau phải tra lại từ nguồn gốc, chậm
      hơn.
- id: practice
  kind: practice
  title: 'Tự làm: phí 0,3 cộng hai mươi lần'
  steps:
  - show: '<p><b>Đề</b>: một khoản phí 0,3 bị cộng 20 lần. Viết <code>PhiLech.java</code>:</p>

      <ol><li>biến <code>double</code> cộng <code>0.3</code> hai mươi lần; biến <code>long</code>
      cộng <code>3</code> (một phần mười) hai mươi lần</li>

      <li>in ba dòng: <code>double: …</code>, <code>so nguyen: … phan muoi</code>,
      <code>bang 6? …</code> (so <code>tong == 6.0</code>)</li></ol>

      <p class="note">Chạy: <code>javac PhiLech.java &amp;&amp; java PhiLech</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 90
    say: 'Bây giờ tới phần bạn tự làm. Một khoản phí không phẩy ba bị cộng hai mươi
      lần. Hãy viết chương trình cộng nó hai mươi lần bằng số thực nhị phân, và cộng
      số ba, tức ba phần mười, hai mươi lần bằng số nguyên. In ba dòng như trên màn
      hình: tổng số thực, tổng số nguyên, và kết quả so sánh tổng số thực với sáu.
      Hãy dừng video, tự viết và chạy, đừng chép lại ví dụ.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>double: 5.999999999999998</div><div>so
      nguyen: 60 phan muoi</div><div>bang 6? false</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh BNK L00 PhiLech.java</code> — in <b>ĐÚNG</b>
      khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> khai <code>double tong = 0;</code>
      và <code>long phanMuoi = 0;</code>, rồi vòng lặp 20 lần: <code>tong += 0.3;</code>
      và <code>phanMuoi += 3;</code>.

      Lời giải ở <code>labs/BNK/L00/loi_giai.java</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, khai một biến số thực và một biến số nguyên dài, bắt đầu bằng không.
      Trong vòng lặp hai mươi lần, cộng không phẩy ba vào biến thứ nhất và cộng ba
      vào biến thứ hai. Lời giải đầy đủ nằm trong thư mục thực hành của bài, chỉ mở
      sau khi bạn đã tự thử.
    clear: true
  lab: labs/BNK/L00
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>tên biến</span><span class='a'>→</span><span
      class='n'>tham chiếu</span><span class='a'>→</span><span class='n'>đối tượng
      trên heap</span><span class='a'>→</span><span class='n'>còn tới được từ gốc?</span><span
      class='a'>→</span><span class='n'>sống / rác</span></div>
    say: Tổng kết chuỗi logic. Tên biến giữ tham chiếu, tham chiếu trỏ tới đối tượng
      trên heap. Đối tượng còn tới được từ gốc thì sống, không thì là rác.
  - show: '<div class=''box key''><b>Tư duy:</b> rò rỉ bộ nhớ không phải “quên dọn”
      mà là “vẫn còn người trỏ tới”.

      Với tiền: <b>không dùng double</b>; dùng số nguyên đơn vị nhỏ nhất hoặc BigDecimal.</div>

      '
    say: Điều cần mang theo. Rò rỉ bộ nhớ không phải là quên dọn, mà là vẫn còn người
      trỏ tới. Còn với tiền, không dùng số thực nhị phân. Hãy dùng số nguyên đơn vị
      nhỏ nhất, hoặc BigDecimal.
