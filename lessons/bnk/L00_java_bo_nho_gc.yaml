scenes:
- id: hook
  kind: hook
  title: Vì sao một con số tiền lại lệch, và vì sao dịch vụ sập sau vài ngày?
  steps:
  - show: '<p>Cộng mười lần số $0{,}1$ bằng kiểu số thực của Java, máy in ra <b>0.9999999999999999</b>,
      không phải $1$.</p>

      <div class="box key">Hôm nay ta trả lời ba câu: <b>đối tượng nằm ở đâu</b> trong
      bộ nhớ, <b>ai dọn rác</b>, và <b>tiền nên lưu bằng kiểu gì</b>.</div>

      '
    say: Chào bạn, cộng mười lần số không phẩy một bằng kiểu số thực của Java, máy
      không cho ra đúng một.
  - show: '<p>Một chương trình khác, chạy liên tục để phục vụ khách, chạy tốt vài
      ngày rồi báo hết bộ nhớ và sập. Mã không viết sai chữ nào.</p>

      <div class="box key">Cả hai lỗi đều có gốc ở một chỗ: <b>hiểu sai cách Java
      giữ dữ liệu</b>.</div>

      '
    say: Một chương trình khác, chạy liên tục phục vụ khách, chạy tốt vài ngày rồi
      báo hết bộ nhớ và sập, dù mã không viết sai chữ nào.
- id: prereq
  kind: prereq
  title: 'Trước hết: chín khái niệm cần hiểu'
  checks:
  - 1024 * 1024 == 1048576
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Biến</td><td>cái tên gắn với một giá trị</td><td><code>int a = 5</code>: tên
      a giữ số năm</td></tr><tr><td>② Lớp</td><td>bản thiết kế: nói một loại đồ vật
      có những dữ liệu gì, làm được việc gì</td><td>lớp <code>TaiKhoan</code></td></tr><tr><td>③
      Đối tượng</td><td>một đồ vật cụ thể làm theo bản thiết kế lớp</td><td>tài khoản
      có số dư 100</td></tr></table>'
    say: Trước hết ta cần hiểu ba điều. Điều thứ nhất, biến là một cái tên gắn với
      một giá trị, ví dụ tên a giữ số năm. Điều thứ hai, lớp là một bản thiết kế,
      nói một loại đồ vật có những dữ liệu gì và làm được việc gì, ví dụ lớp tài khoản.
      Điều thứ ba, đối tượng là một đồ vật cụ thể làm theo bản thiết kế đó.
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Trường</td><td>một ô dữ liệu bên trong đối tượng</td><td>trường <code>soDu</code>
      giữ 100</td></tr><tr><td>⑤ Phương thức</td><td>một việc đối tượng làm được,
      gọi bằng dấu chấm</td><td><code>s.equals(t)</code>: hỏi dãy chữ s có cùng nội
      dung với dãy chữ t không</td></tr><tr><td>⑥ Tham chiếu</td><td>giá trị chỉ đường
      tới một đối tượng; biến giữ tham chiếu chứ không giữ cả đối tượng</td><td>tờ
      giấy ghi địa chỉ nhà, không phải ngôi nhà</td></tr></table>'
    clear: true
    say: Thêm ba điều nữa. Trường là một ô dữ liệu bên trong đối tượng, ví dụ trường
      số dư giữ một trăm. Phương thức là một việc đối tượng làm được, gọi bằng dấu
      chấm. Còn tham chiếu là giá trị chỉ đường tới một đối tượng, giống tờ giấy ghi
      địa chỉ nhà, chứ không phải chính ngôi nhà.
  - show: '<table class=''t''><tr><th>thêm ba thứ dùng trong mã</th><th>nghĩa</th><th>ví
      dụ</th></tr><tr><td>⑦ Mảng byte</td><td>dãy ô nhớ liền nhau, mỗi ô một byte</td><td><code>new
      byte[1_000_000]</code>: một triệu ô, gần 1 MB</td></tr><tr><td>⑧ Bản đồ (Map)</td><td>bảng
      tra: đưa khoá vào thì lấy ra giá trị</td><td><code>map.put(1, x)</code>: cất
      x dưới khoá 1</td></tr><tr><td>⑨ Tham chiếu yếu</td><td>dây buộc lỏng: trỏ tới
      đối tượng nhưng <b>không giữ nó sống</b></td><td><code>WeakReference</code>:
      hỏi <code>get()</code> còn đối tượng hay đã bị dọn</td></tr></table>'
    clear: true
    say: Thêm ba thứ sẽ xuất hiện trong mã. Mảng byte là dãy ô nhớ liền nhau, mỗi
      ô một byte. Bản đồ là bảng tra, đưa khoá vào thì lấy ra giá trị. Tham chiếu
      yếu là dây buộc lỏng, nó trỏ tới đối tượng nhưng không giữ nó sống, chỉ để hỏi
      xem nó còn không.
  - show: '<p>Một đơn vị đo bộ nhớ (cách tính quen dùng cho bộ nhớ): $1\,\text{KB}
      = 1024$ byte, và $1\,\text{MB} = 1024 \cdot 1024 = 1\,048\,576$ byte. Một gi
      ga byte (GB) bằng 1024 MB.</p>'
    introduces:
    - cdot
    say: 'Thêm một đơn vị đo, theo cách tính quen dùng cho bộ nhớ: một ki lô byte
      bằng một nghìn không trăm hai mươi bốn byte, và một mê ga byte là số đó nhân
      với chính nó.'
- id: sym
  kind: symbol
  title: Giải mã vài chữ trong mã Java
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr>

      <tr><td><code>new TaiKhoan()</code></td><td>tạo một đối tượng mới của lớp <code>TaiKhoan</code>
      trên heap (vùng nhớ dùng chung cho mọi đối tượng)</td></tr>

      <tr><td><code>tk</code></td><td>tên biến giữ tham chiếu tới đối tượng</td></tr>

      <tr><td><code>tk.soDu</code></td><td>dấu chấm: đi theo tham chiếu tới trường
      <code>soDu</code> của đối tượng</td></tr>

      <tr><td><code>a == b</code></td><td>với hai biến đối tượng: so hai tham chiếu
      có trỏ cùng một đối tượng không (với số như <code>int</code> thì so giá trị)</td></tr></table>

      '
    say: Bảng này giải mã bốn mẫu chữ hay gặp. Từ khoá tạo đối tượng sinh một đối
      tượng mới của lớp tài khoản trên heap, vùng nhớ dùng chung cho mọi đối tượng.
      Biến tài khoản giữ tham chiếu tới đối tượng đó. Dấu chấm đi theo tham chiếu
      để tới một trường bên trong. Với hai biến đối tượng, hai dấu bằng so hai tham
      chiếu có trỏ cùng một đối tượng không, còn với số thì so giá trị.
    introduces:
    - bnk_heap
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>int</code>,
      <code>long</code>, <code>double</code></td><td>ba kiểu số: số nguyên vừa, số
      nguyên dài, số thực nhị phân (máy ghi số bằng hệ hai: chỉ hai chữ số 0 và 1,
      nên 0,1 chỉ ghi gần đúng)</td></tr><tr><td><code>final</code></td><td>gán giá
      trị một lần rồi không đổi nữa</td></tr><tr><td><code>Map&lt;Integer, byte[]&gt;</code></td><td>bản
      đồ có khoá là số nguyên, giá trị là mảng byte</td></tr><tr><td>máy ảo Java</td><td>chương
      trình đọc và chạy mã Java đã dịch, lo luôn bộ nhớ và dọn rác</td></tr><tr><td><code>javac</code>,
      <code>java</code></td><td>lệnh dịch tệp mã ra dạng máy ảo hiểu, rồi lệnh chạy
      nó</td></tr></table>'
    clear: true
    say: 'Thêm vài chữ nữa, ba kiểu số là số nguyên vừa, số nguyên dài, và số thực
      nhị phân. Số thực nhị phân là số máy ghi bằng hệ hai, chỉ hai chữ số không và
      một, nên không phẩy một chỉ ghi gần đúng. Từ khoá cuối nghĩa là gán một lần
      rồi không đổi. Cặp ngoặc nhọn ghi kiểu của bản đồ, khoá là số nguyên, giá trị
      là mảng byte. Máy ảo Java là chương trình chạy mã đã dịch: một lệnh để dịch,
      một lệnh để chạy.'
    introduces:
    - bnk_may_ao
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>public
      class PhiLech { … }</code></td><td>khung tệp: mọi mã nằm trong một lớp, tên
      lớp trùng tên tệp <code>PhiLech.java</code></td></tr><tr><td><code>import java.util.*;</code></td><td>nhập
      các lớp có sẵn trong thư viện của Java để dùng</td></tr><tr><td><code>public
      static void main(String[] args) { … }</code></td><td>hàm chính: chương trình
      bắt đầu chạy từ đây; hàm là một nhóm lệnh có tên; <code>args</code> là mảng
      chuỗi gõ thêm sau lệnh chạy, bài này không dùng</td></tr><tr><td><code>for (int
      i = 0; i &lt; 5; i++) { … }</code></td><td>vòng lặp: làm phần trong ngoặc nhọn
      với i = 0, 1, 2, 3, 4, tức năm lần</td></tr><tr><td><code>System.out.println(x)</code></td><td>in
      giá trị x ra màn hình rồi xuống dòng</td></tr><tr><td><code>"abc"</code></td><td>chuỗi:
      một dãy chữ nằm trong ngoặc kép</td></tr></table>'
    clear: true
    say: Bây giờ là khung của một tệp Java. Mã nằm trong một lớp, tên lớp trùng tên
      tệp, và dòng nhập cho dùng các lớp có sẵn. Chương trình chạy từ hàm chính; hàm
      là nhóm lệnh có tên, và tham số mảng chuỗi chứa các chữ gõ thêm sau lệnh chạy,
      bài này không dùng. Vòng lặp làm phần trong ngoặc nhọn nhiều lần. Lệnh in đưa
      một giá trị ra màn hình, và chuỗi là dãy chữ nằm giữa hai dấu ngoặc kép.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>dịch vụ</td><td>chương
      trình chạy liên tục, chờ người khác gọi tới</td></tr><tr><td>yêu cầu</td><td>một
      lần được gọi tới, ví dụ một lần chuyển tiền</td></tr><tr><td>bộ xử lý</td><td>con
      chip chạy lệnh; có nhiều bộ thì làm được nhiều việc cùng lúc</td></tr><tr><td>JDK
      21</td><td>bộ công cụ của Java: mở cửa sổ gõ lệnh (như Git Bash), gõ <code>java
      -version</code> phải thấy số 21</td></tr></table>'
    clear: true
    say: Vài từ đời thường nữa. Dịch vụ là chương trình chạy liên tục chờ người khác
      gọi tới, mỗi lần gọi là một yêu cầu. Để chạy mã trong bài, cài bộ công cụ Java
      bản hai mươi mốt, rồi gõ lệnh hỏi phiên bản, phải thấy số hai mươi mốt.
