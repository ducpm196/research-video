    say: Tổng kết chuỗi logic. Mỗi giao dịch có ít nhất hai dòng và tổng bằng không.
      Sổ chỉ thêm. Số dư bằng tổng các dòng. Có sai thì thêm bút toán đảo.
  - show: <div class='box key'><b>Tư duy:</b> số dư là một <b>kết quả suy ra</b>,
      không phải dữ liệu gốc. Dữ liệu gốc là các bút toán không thể sửa.</div>
    say: Điều cần mang theo. Số dư là một kết quả suy ra, không phải dữ liệu gốc.
      Dữ liệu gốc là các bút toán không thể sửa.
