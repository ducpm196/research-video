      text-anchor="middle" fill="#1f2937">+5 500</text><line x1="400" y1="185" x2="555"
      y2="105" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><line x1="400"
      y1="225" x2="555" y2="320" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="1040" y="150" width="420" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="1250.0" y="198" font-size="22" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Tổng giao dịch</text><text x="1250.0" y="228"
      font-size="22" text-anchor="middle" fill="#1f2937">−505 500 + 500 000 + 5 500
      = 0</text></svg></div>
    clear: true
    say: Hình cho thấy một giao dịch chuyển năm trăm nghìn kèm phí năm nghìn năm trăm.
      Khách A bị trừ năm trăm lẻ năm nghìn năm trăm. Khách B nhận năm trăm nghìn.
      Quỹ thu phí nhận năm nghìn năm trăm. Cộng ba dòng lại, tổng đúng bằng không.
      Tiền không tự sinh ra hay mất đi, chỉ đổi chỗ.
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="40" y="40" width="700" height="70" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3"/><text x="390.0" y="83" font-size="22" text-anchor="middle"
      fill="#1f2937">bút toán A: −505 500   (giao dịch 1)</text><rect x="40" y="120"
      width="700" height="70" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text
      x="390.0" y="163" font-size="22" text-anchor="middle" fill="#1f2937">bút toán
      B: +500 000   (giao dịch 1)</text><rect x="40" y="200" width="700" height="70"
