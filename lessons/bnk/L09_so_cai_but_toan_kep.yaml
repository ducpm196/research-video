scenes:
- id: hook
  kind: hook
  title: Vì sao ngân hàng không chỉ lưu một con số số dư?
  steps:
  - show: '<p>Nếu chỉ lưu <b>một cột số dư</b> và sửa thẳng, khi số dư sai ta <b>không
      biết sai từ đâu</b>, vì mọi dấu vết đã bị ghi đè.</p>

      <div class="box key">Sổ cái ghi <b>từng bút toán</b>, mỗi giao dịch có tổng
      bằng <b>0</b>. Số dư chỉ là <b>tổng các bút toán</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, nếu chỉ lưu một cột số dư và sửa thẳng vào đó, khi số dư sai ta
      không biết sai từ đâu, vì mọi dấu vết đã bị ghi đè. Sổ cái làm khác. Nó ghi
      từng bút toán, mỗi giao dịch có tổng bằng không, và số dư chỉ là tổng các bút
      toán.
  - show: <table class='t'><tr><th>cách lưu</th><th>tìm lỗi</th><th>kiểm cân đối</th></tr><tr><td>một
      cột số dư, sửa trực tiếp</td><td>không thể, dấu vết bị ghi đè</td><td>không
      có gì để cộng lại</td></tr><tr><td>sổ cái bút toán, chỉ thêm</td><td>xem từng
      dòng</td><td>tổng mỗi giao dịch phải bằng 0</td></tr></table>
    say: Bảng này so hai cách lưu. Một cột số dư sửa trực tiếp thì không tìm được
      lỗi và không có gì để cộng lại kiểm tra. Sổ cái chỉ thêm thì xem được từng dòng,
      và kiểm cân đối bằng cách cộng tổng mỗi giao dịch.
- id: prereq
  kind: prereq
  title: 'Trước hết: ba điều cần hiểu'
  checks:
  - -100 + 60 + 40 == 0
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Số nguyên đồng</td><td>trong thanh toán, đồng Việt Nam không dùng phần lẻ (ISO
      4217 ghi VND có 0 chữ số thập phân), nên lưu bằng số nguyên</td><td>500 000
      đồng = 500000</td></tr><tr><td>② Số có dấu</td><td>dương là tiền vào, âm là
      tiền ra khỏi tài khoản</td><td>−505 500 và +500 000</td></tr><tr><td>③ Tổng
      một nhóm</td><td>cộng mọi số trong nhóm</td><td>−100 + 60 + 40 = 0</td></tr></table>
    say: Trước hết, ta cần hiểu ba điều sẽ dùng trong bài. Trong thanh toán, đồng
      Việt Nam không dùng phần lẻ, nên ta lưu bằng số nguyên. Số có dấu cho biết hướng,
      dương là tiền vào, âm là tiền ra khỏi tài khoản. Tổng một nhóm là cộng mọi số
      trong nhóm. Lưu ý, kế toán dùng cách gọi nợ và có theo quy ước riêng, còn bài
      này dùng số có dấu cho dễ thấy.
  - show: $$-100 + 60 + 40 = 0$$
    say: Một ví dụ số. Âm một trăm cộng sáu mươi cộng bốn mươi bằng không. Đó là một
      giao dịch cân đối.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>bút toán</td><td>một
      dòng trong sổ cái: tài khoản nào, bao nhiêu tiền, hướng nào</td></tr><tr><td>bút
      toán kép</td><td>mỗi giao dịch ghi ít nhất hai dòng ở hai tài khoản: tiền rời
      chỗ này thì phải tới chỗ khác</td></tr><tr><td>sổ cái (ledger)</td><td>tập mọi
      bút toán, chỉ thêm, không sửa, không xoá</td></tr><tr><td>cân đối</td><td>tổng
      mọi bút toán của một giao dịch bằng 0</td></tr><tr><td>bút toán đảo</td><td>dòng
      mới làm ngược một dòng cũ để sửa sai, không xoá dòng cũ</td></tr><tr><td>số
      dư</td><td>về nguyên tắc bằng tổng các bút toán của tài khoản; số dư lưu sẵn
      phải khớp tổng đó</td></tr></table>'
    say: Bảng dưới đây giải thích nghĩa của sáu thuật ngữ sẽ gặp trong bài. Bút toán
      là một dòng cho biết tài khoản nào, bao nhiêu tiền, hướng nào. Bút toán kép
      nghĩa là mỗi giao dịch ghi ít nhất hai dòng ở hai tài khoản, vì tiền rời chỗ
      này thì phải tới chỗ khác. Sổ cái là tập mọi bút toán, chỉ thêm, không sửa,
      không xoá. Cân đối là tổng bút toán của một giao dịch bằng không. Bút toán đảo
      là dòng mới làm ngược dòng cũ để sửa sai. Số dư bằng tổng các bút toán của tài
      khoản.
