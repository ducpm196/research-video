      fill="#1f2937" font-weight="bold">chỉ thêm dòng mới ở cuối — không sửa, không
      xoá</text><rect x="840" y="120" width="620" height="150" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="3"/><text x="1150.0" y="171" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">số dư của A</text><text x="1150.0" y="203"
      font-size="24" text-anchor="middle" fill="#1f2937">= tổng các dòng của A</text><text
      x="1150.0" y="235" font-size="24" text-anchor="middle" fill="#1f2937">= −505
      500 (sổ bắt đầu trống)</text><text x="1150" y="330" font-size="22" text-anchor="middle"
      fill="#475569">hệ thống thật lưu thêm số dư tính sẵn,</text><text x="1150" y="362"
