      đối soát với tổng</text></svg></div>'
    clear: true
    say: Sổ cái là một danh sách chỉ thêm ở cuối. Không dòng nào bị sửa hay xoá. Về
      nguyên tắc, số dư của một tài khoản là tổng các dòng của tài khoản đó. Ở đây
      sổ bắt đầu trống, nên số dư của A là âm năm trăm lẻ năm nghìn năm trăm. Hệ thống
      thật thường lưu thêm số dư tính sẵn để đọc nhanh, nhưng phải cập nhật cùng giao
      dịch với bút toán, và đối soát được với tổng bút toán.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: cân đối và sửa sai'
  checks:
  - -505500 + 500000 + 5500 == 0
  - alg.bnk_ledger_demo(500000, 5500)[0] == 0
  - alg.bnk_ledger_demo(500000, 5500)[1]['khach_B'] == 500000
  - all(v == 0 for v in alg.bnk_ledger_after_reversal(500000, 5500)[2].values())
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi giao dịch có ít nhất hai dòng, và tổng các dòng bằng
      $0$. Vì vậy số tiền ra khỏi nơi này luôn bằng số tiền vào nơi khác.</p>

      <span class=''note''>Làm thử: $-505\,500 + 500\,000 + 5\,500 = 0$.</span>

      '
    focus:
    - 1
    - 2
    say: Bước một, vì mỗi giao dịch có ít nhất hai dòng và tổng bằng không, nên số
      tiền ra khỏi nơi này luôn bằng số tiền vào nơi khác. Làm thử, âm năm trăm lẻ
      năm nghìn năm trăm, cộng năm trăm nghìn, cộng năm nghìn năm trăm, bằng không.
  - show: '<p><b>Bước 2.</b> Số dư bằng tổng các dòng của tài khoản. Vì sổ chỉ thêm,
      ta cộng lại bất cứ lúc nào để <b>kiểm</b>.</p>

      <span class=''note''>Làm thử: tài khoản B chỉ có một dòng $+500\,000$ nên số
      dư $500\,000$.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì số dư bằng tổng các dòng của tài khoản, và sổ chỉ thêm, nên
      ta cộng lại bất cứ lúc nào để kiểm. Làm thử, tài khoản B chỉ có một dòng cộng
      năm trăm nghìn, nên số dư là năm trăm nghìn.
  - show: '<p><b>Bước 3.</b> Muốn sửa một giao dịch sai, thêm giao dịch mới có các
      dòng <b>ngược dấu</b>, không xoá dòng cũ. Tổng vẫn bằng $0$.</p>

      <span class=''note''>Làm thử: sau khi đảo, số dư mỗi tài khoản về số dư trước
      giao dịch; sổ ví dụ bắt đầu trống nên về $0$.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, vì sổ không được xoá, nên muốn sửa giao dịch sai ta thêm giao dịch
      mới có các dòng ngược dấu. Tổng vẫn bằng không. Làm thử, sau khi đảo, số dư
      mỗi tài khoản về đúng số dư trước giao dịch. Sổ ví dụ bắt đầu trống, nên về
      không.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 500000 + 5500 == 505500
  - 'alg.bnk_ledger_demo(500000, 5500)[1] == {''khach_A'': -505500, ''khach_B'': 500000,
    ''thu_phi'': 5500}'
  - -505500 + 500000 + 5500 == 0
  - +505500 - 500000 - 5500 == 0
  - alg.bnk_ledger_after_reversal(500000, 5500)[0] == 3 + 3 and alg.bnk_ledger_after_reversal(500000,
    5500)[2]['khach_A'] == 0
  steps:
  - show: '<p>Chuyển $500\,000$ đồng, phí $5\,500$ đồng <i>(số minh hoạ)</i>.</p>

      $$① \; \text{A bị trừ: } 500\,000 + 5\,500 = \hl{505\,500}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta ghi sổ một giao dịch. Chuyển năm trăm nghìn đồng, phí năm nghìn năm trăm
      đồng, đây là số minh hoạ. Phép tính thứ nhất, A bị trừ năm trăm nghìn cộng năm
      nghìn năm trăm, là năm trăm lẻ năm nghìn năm trăm đồng.
  - show: $$② \; \text{B nhận } +500\,000,\quad \text{thu phí } +5\,500$$
    say: Phép tính thứ hai, B nhận cộng năm trăm nghìn, quỹ thu phí nhận cộng năm
      nghìn năm trăm.
  - show: '<p>Dùng lại ba dòng ở ① và ②.</p>

      $$③ \; -505\,500 + 500\,000 + 5\,500 = \hlg{0}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ ba, cộng ba dòng, âm năm trăm lẻ năm nghìn năm trăm, cộng năm
      trăm nghìn, cộng năm nghìn năm trăm, bằng không. Vậy giao dịch này cân đối.
  - show: '<p>Phát hiện chuyển nhầm, thêm giao dịch đảo: ba dòng ngược dấu.</p>

      $$④ \; +505\,500 - 500\,000 - 5\,500 = \hlg{0}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ tư, phát hiện chuyển nhầm, ta thêm giao dịch đảo với ba dòng
      ngược dấu. Tổng của giao dịch đảo cũng bằng không.
  - show: '<p>Sổ lúc này có $3 + 3 = 6$ dòng.</p>

      $$⑤ \; \text{số dư A} = -505\,500 + 505\,500 = \hl{0}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ năm, sổ lúc này có sáu dòng. Số dư của A bằng âm năm trăm lẻ
      năm nghìn năm trăm cộng năm trăm lẻ năm nghìn năm trăm, bằng không. Mọi dấu
      vết vẫn còn nguyên.
- id: chay_that
  kind: example
  title: 'Chạy thật: dựng sổ cái, kiểm cân đối, đảo bút toán (sqlite)'
  steps:
  - show: '<p><b>Sổ cái: một giao dịch có phí, hai câu tổng nhóm</b></p><div class="code"><div><span
      class="kw">CREATE</span> <span class="kw">TABLE</span> but_toan (gd <span class="kw">INTEGER</span>,
      tk <span class="kw">TEXT</span>, tien <span class="kw">INTEGER</span>);</div><div><span
      class="kw">INSERT</span> <span class="kw">INTO</span> but_toan <span class="kw">VALUES</span>
      (1, ''khach_A'', -505500), (1, ''khach_B'', 500000), (1, ''thu_phi'', 5500);</div><div><span
      class="kw">SELECT</span> gd, <span class="kw">SUM</span>(tien) <span class="kw">FROM</span>
      but_toan <span class="kw">GROUP</span> <span class="kw">BY</span> gd;</div><div><span
      class="kw">SELECT</span> tk, <span class="kw">SUM</span>(tien) <span class="kw">FROM</span>
      but_toan <span class="kw">GROUP</span> <span class="kw">BY</span> tk <span class="kw">ORDER</span>
      <span class="kw">BY</span> tk;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: 'Ta dựng sổ cái thật trên cơ sở dữ liệu nhỏ. Bảng bút toán có ba cột là mã
      giao dịch, tài khoản và số tiền có dấu. Giao dịch một có ba dòng: khách A ra
      năm trăm linh năm nghìn năm trăm, khách B vào năm trăm nghìn, và tài khoản thu
      phí vào năm nghìn năm trăm. Câu thứ nhất cộng số tiền theo mã giao dịch, câu
      thứ hai cộng theo tài khoản.'
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>1|0</div><div>khach_A|-505500</div><div>khach_B|500000</div><div>thu_phi|5500</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khi chạy thật, giao dịch một có tổng bằng không, tức là cân đối. Số dư theo
      tài khoản đúng là âm năm trăm linh năm nghìn năm trăm, năm trăm nghìn, và năm
      nghìn năm trăm. Phí năm nghìn năm trăm không biến mất, nó nằm ở tài khoản thu
      phí.
  - show: '<p><b>Sửa sai bằng bút toán đảo: thêm dòng ngược dấu, không xoá dòng cũ</b></p><div
      class="code"><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      but_toan <span class="kw">SELECT</span> 2, tk, -tien <span class="kw">FROM</span>
      but_toan <span class="kw">WHERE</span> gd = 1;</div><div><span class="kw">SELECT</span>
      tk, <span class="kw">SUM</span>(tien) <span class="kw">FROM</span> but_toan
      <span class="kw">GROUP</span> <span class="kw">BY</span> tk <span class="kw">ORDER</span>
      <span class="kw">BY</span> tk;</div><div><span class="kw">SELECT</span> <span
      class="kw">COUNT</span>(*) <span class="kw">FROM</span> but_toan;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bây giờ sửa sai bằng bút toán đảo. Lệnh chèn thứ nhất lấy mọi dòng của giao
      dịch một, đổi dấu số tiền, rồi ghi thành giao dịch hai. Không dòng cũ nào bị
      xoá hay sửa. Hai câu sau cộng số dư theo tài khoản và đếm số dòng của sổ cái.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>khach_A|0</div><div>khach_B|0</div><div>thu_phi|0</div><div>6</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Khi chạy thật, ba tài khoản đều về không, và sổ cái có sáu dòng, ba dòng
      gốc cộng ba dòng đảo. Số dư về không mà lịch sử vẫn còn nguyên, nên người kiểm
      toán thấy cả việc làm sai lẫn việc sửa.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: để cơ sở dữ liệu tìm giao dịch lệch'
  checks:
  - alg.bnk_ledger_unbalanced([(1, 'a', -100), (1, 'b', 90), (2, 'a', -5), (2, 'b',
    5)]) == [1]
  - -100 + 90 == -10
  steps:
  - show: '<p>Đường khác: vì mọi dòng nằm trong một bảng, ta hỏi cơ sở dữ liệu: giao
      dịch nào có tổng khác $0$? Ta cố ý sửa một dòng của giao dịch 1.</p>

      <div class="box code"><code>SELECT txn FROM entry GROUP BY txn HAVING SUM(amt)
      &lt;&gt; 0;</code></div>

      <p class="small">Bảng <code>entry</code> (bút toán) có cột <code>txn</code>
      (mã giao dịch) và <code>amt</code> (số tiền có dấu). <code>GROUP BY txn</code>:
      gom các dòng cùng mã giao dịch thành một nhóm. <code>HAVING SUM(amt) &lt;&gt;
      0</code>: chỉ giữ nhóm có tổng khác 0.</p>

      $$\text{giao dịch lệch} = \hl{[1]}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    say: Kiểm bằng đường khác. Vì mọi dòng nằm trong một bảng, ta hỏi cơ sở dữ liệu
      giao dịch nào có tổng khác không. Bảng bút toán có cột mã giao dịch và cột số
      tiền có dấu. Câu truy vấn gom các dòng cùng mã giao dịch thành một nhóm, rồi
      chỉ giữ những nhóm có tổng khác không. Ta cố ý sửa một dòng của giao dịch một,
      và cơ sở dữ liệu chỉ đúng giao dịch một là lệch.
  - show: <table class='t'><tr><th>giao dịch</th><th>các dòng</th><th>tổng</th><th>kết
      luận</th></tr><tr><td>1 (đã sửa lén)</td><td>−100, +90</td><td>−10</td><td>lệch,
      phải điều tra</td></tr><tr><td>2</td><td>−5, +5</td><td>0</td><td>cân đối</td></tr></table>
    say: Bảng này cho thấy kết quả. Vì giao dịch một có tổng âm mười, nên nó lệch
      và cần điều tra. Giao dịch hai tổng bằng không, nên cân đối. Chỉ cần một câu
      truy vấn tổng nhóm là thấy.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Lưu số dư là một cột rồi
      <b class="red">cộng trừ trực tiếp</b>. Hai giao dịch cùng lúc có thể ghi đè
      nhau, và không còn dấu vết để tìm lỗi.</div>
    say: Lỗi thứ nhất, của người mới. Lưu số dư là một cột rồi cộng trừ trực tiếp.
      Hai giao dịch cùng lúc có thể ghi đè nhau, và không còn dấu vết để tìm lỗi.
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Xoá
      hay sửa dòng cũ</b> khi phát hiện sai, cho “gọn”. Từ đó sổ không còn bằng chứng,
      kiểm toán (người kiểm tra sổ sách độc lập) không dựng lại được. Chỉ thêm bút
      toán đảo.</div>
    say: Lỗi thứ hai, của người đã đi làm, là xoá hay sửa dòng cũ khi phát hiện sai,
      cho gọn. Từ đó sổ không còn bằng chứng, và kiểm toán, tức người kiểm tra sổ
      sách độc lập, không dựng lại được. Hãy chỉ thêm bút toán đảo.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tính phí theo phần
      trăm bằng số thực rồi làm tròn tuỳ ý. Lệch một đồng mỗi giao dịch, nhân với
      hàng triệu giao dịch. Cần <b>quy tắc làm tròn viết rõ</b>, tính bằng số nguyên.</div>
    say: Lỗi thứ ba, cũng của người đã đi làm, là tính phí theo phần trăm bằng số
      thực rồi làm tròn tuỳ ý. Lệch một đồng mỗi giao dịch, nhân với hàng triệu giao
      dịch thì thành số lớn. Cần quy tắc làm tròn viết rõ, và tính bằng số nguyên.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 2000000 + 11000 == 2011000
  - alg.bnk_ledger_demo(2000000, 11000)[0] == 0 and alg.bnk_ledger_demo(2000000, 11000)[1]['khach_A']
    == -2011000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Chuyển
      2 000 000 đồng, phí 11 000 đồng. Khách A bị trừ bao nhiêu?</td></tr><tr><td>2</td><td>Ba
      dòng của giao dịch đó có tổng bằng bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: sửa dòng sai trực tiếp hay thêm bút toán đảo?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, chuyển hai triệu đồng, phí mười
      một nghìn đồng, khách A bị trừ bao nhiêu? Câu hai, ba dòng của giao dịch đó
      có tổng bằng bao nhiêu? Câu ba, sửa dòng sai trực tiếp hay thêm bút toán đảo?
      Hãy dừng video và làm ra giấy.
  - show: $$2\,000\,000 + 11\,000 = \hl{2\,011\,000}$$
    say: Đáp án câu một. Hai triệu cộng mười một nghìn bằng hai triệu không trăm mười
      một nghìn đồng.
    clear: true
  - show: $$-2\,011\,000 + 2\,000\,000 + 11\,000 = \hlg{0}$$
    say: Đáp án câu hai. Âm hai triệu không trăm mười một nghìn, cộng hai triệu, cộng
      mười một nghìn, bằng không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>thêm
      bút toán đảo</td><td>giữ nguyên dấu vết, kiểm toán dựng lại được</td><td>sổ
      dài hơn</td></tr><tr><td>sửa trực tiếp dòng sai</td><td>sổ gọn</td><td>mất bằng
      chứng, không kiểm toán được</td></tr></table>
    say: Đáp án câu ba. Thêm bút toán đảo giữ nguyên dấu vết và kiểm toán dựng lại
      được, đổi lại sổ dài hơn. Sửa trực tiếp thì sổ gọn nhưng mất bằng chứng. Với
      tiền, luôn chọn thêm bút toán đảo.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: cộng lại cả lịch sử cho tài khoản thu phí'
  checks:
  - 100000 * 3 == 300_000
  - 10_000_000 * 3 == 30_000_000
  - 1_000_000_000 * 3 == 3_000_000_000
  - 100000 * 365 == 36_500_000
  - 10_000_000 * 365 == 3_650_000_000
  - 1_000_000_000 * 365 == 365_000_000_000
  - 36_500_000 / 10**6 == 36.5
  - round(3_650_000_000 / 10**6 / 3600, 1) == 1.0
  - round(365_000_000_000 / 10**6 / 86400, 1) == 4.2
  steps:
  - show: <p>Mỗi giao dịch có $3$ dòng, và <b>mỗi</b> giao dịch đều có một dòng ở
      tài khoản thu phí. Cộng lại số dư bằng cách cộng mọi dòng của tài khoản đó trong
      một năm, với tốc độ quét $10^6$ dòng mỗi giây <i>(số minh hoạ)</i>:</p><table
      class='t'><tr><th>tải</th><th>giao dịch mỗi ngày</th><th>dòng sổ cái mỗi ngày</th><th>dòng
      thu phí mỗi năm</th><th>cộng lại số dư thu phí</th></tr><tr><td>×1</td><td>100
      000</td><td>300 000</td><td>36 500 000</td><td>36,5 giây</td></tr><tr><td>×100</td><td>10
      000 000</td><td>30 000 000</td><td>3 650 000 000</td><td><b>≈ 1 giờ</b></td></tr><tr><td>×10
      000</td><td>1 000 000 000</td><td>3 000 000 000</td><td>365 000 000 000</td><td><b>≈
      4,2 ngày</b></td></tr></table>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Mỗi giao dịch có ba dòng, và mỗi giao dịch đều có một dòng ở tài khoản thu
      phí. Giả sử cộng lại số dư bằng cách cộng mọi dòng của tài khoản đó trong một
      năm, quét một triệu dòng mỗi giây. Đây là số minh hoạ. Với một trăm nghìn giao
      dịch mỗi ngày, một năm có ba mươi sáu triệu rưỡi dòng, cộng lại mất ba mươi
      sáu rưỡi giây. Tải tăng một trăm lần, mất khoảng một giờ. Tải tăng mười nghìn
      lần, mất khoảng bốn ngày rưỡi.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> “Số dư luôn bằng tổng
      các bút toán” vẫn đúng, nhưng <b>tính lại từ đầu mỗi lần hỏi</b> thì gãy với
      tài khoản nóng như tài khoản thu phí: 36,5 giây, 1 giờ, 4,2 ngày.</div>

      <div class="box key"><b>Đánh đổi:</b> lưu <b>số dư sẵn</b> và cập nhật cùng
      giao dịch, cộng đối chiếu với tổng bút toán định kỳ (hoặc chỉ cộng các dòng
      mới từ mốc chốt). Nhưng một dòng số dư mà mọi giao dịch cùng sửa sẽ thành <b>điểm
      nghẽn khoá</b> (như bài trước); có thể chia nhỏ thành nhiều dòng phí rồi cộng
      gộp.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Câu hỏi là giải pháp cũ sẽ gãy ở chỗ nào khi tải tăng lên. Số dư luôn bằng
      tổng các bút toán vẫn đúng. Nhưng tính lại từ đầu mỗi lần hỏi thì gãy với tài
      khoản nóng như tài khoản thu phí, từ ba mươi sáu giây tới một giờ rồi bốn ngày.
      Đánh đổi là lưu số dư sẵn và cập nhật cùng giao dịch, cộng đối chiếu với tổng
      bút toán định kỳ, hoặc chỉ cộng các dòng mới kể từ mốc chốt. Nhưng một dòng
      số dư mà mọi giao dịch cùng sửa sẽ thành điểm nghẽn khoá, như bài trước. Cách
      giảm là chia nhỏ thành nhiều dòng phí rồi cộng gộp.
- id: practice
  kind: practice
  title: 'Tự làm: hai giao dịch, tìm giao dịch lệch'
  steps:
  - show: '<p><b>Đề</b>: viết <code>so_cai.sql</code>:</p>

      <ol><li>bảng <code>but_toan(gd, tk, tien)</code>; giao dịch 1: <code>C −1206600</code>,
      <code>D +1200000</code>, <code>phi +6600</code></li>

      <li>giao dịch 2 (cố ý lệch): <code>C −50000</code>, <code>D +40000</code></li>

      <li><code>SELECT</code> mã giao dịch có tổng khác 0; <code>SELECT</code> số
      dư theo tài khoản</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 150
    say: Bây giờ tới phần bạn tự làm. Hãy viết một tệp SQL với bảng bút toán. Giao
      dịch một có phí, gồm ba dòng, C ra một triệu hai trăm linh sáu nghìn sáu trăm,
      D vào một triệu hai trăm nghìn, và phí sáu nghìn sáu trăm. Giao dịch hai cố
      ý lệch, C ra năm mươi nghìn và D vào bốn mươi nghìn. Rồi viết câu tìm giao dịch
      có tổng khác không, và câu tính số dư theo tài khoản. Hãy dừng video, tự viết
      và chạy, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>2</div><div>C|-1256600</div><div>D|1240000</div><div>phi|6600</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNK L09 so_cai.sql</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> câu tìm lệch: <code>SELECT gd FROM
      but_toan GROUP BY gd HAVING SUM(tien) &lt;&gt; 0;</code>; câu số dư: <code>SELECT
      tk, SUM(tien) FROM but_toan GROUP BY tk ORDER BY tk;</code>.

      Lời giải ở <code>labs/BNK/L09/loi_giai.sql</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, để tìm giao dịch lệch thì gom theo mã giao dịch rồi chỉ giữ nhóm
      có tổng khác không. Còn số dư thì gom theo tài khoản và cộng số tiền. Lời giải
      đầy đủ nằm trong thư mục thực hành của bài, chỉ mở sau khi bạn đã tự thử.
    clear: true
  lab: labs/BNK/L09
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>mỗi giao dịch ≥ 2 dòng</span><span class='a'>→</span><span
      class='n'>tổng = 0</span><span class='a'>→</span><span class='n'>sổ chỉ thêm</span><span
      class='a'>→</span><span class='n'>số dư = tổng dòng</span><span class='a'>→</span><span
