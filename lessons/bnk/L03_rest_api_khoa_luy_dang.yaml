scenes:
- id: hook
  kind: hook
  title: Vì sao một lần bấm chuyển tiền lại bị trừ ba lần?
  steps:
  - show: '<p>Khách bấm chuyển $500\,000$ đồng. Mạng chập chờn nên ứng dụng không
      nhận được phản hồi và <b>tự thử lại</b> hai lần nữa.</p>

      <div class="box key">Máy chủ nhận đủ <b>ba</b> yêu cầu. Nếu không phòng bị,
      tài khoản bị trừ <b>ba lần</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, khách bấm chuyển năm trăm nghìn đồng. Mạng chập chờn nên ứng dụng
      không nhận được phản hồi và tự thử lại thêm hai lần. Máy chủ nhận đủ ba yêu
      cầu, và nếu không phòng bị, tài khoản bị trừ ba lần.
  - show: '<table class=''t''><tr><th>ý hỏi</th><th>bài này trả lời</th></tr><tr><td>vì
      sao thử lại là bình thường</td><td>mạng có thể mất phản hồi, người gọi không
      biết việc đã xong chưa</td></tr><tr><td>làm sao thử lại mà không trừ trùng</td><td>khoá
      lũy đẳng: cùng khoá thì chỉ làm một lần</td></tr></table>'
    say: 'Hôm nay ta trả lời hai câu. Vì sao thử lại là chuyện bình thường, và làm
      sao thử lại mà không trừ trùng. Đáp án là khoá lũy đẳng: cùng một khoá thì chỉ
      làm một lần.'
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 2000000 - 500000 == 1500000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      HTTP và REST API</td><td>HTTP là giao thức web: mỗi yêu cầu gồm một phương thức
      (GET, POST…) và một đường dẫn; REST API là cách một dịch vụ mở chức năng qua
      các đường dẫn đó</td><td><code>POST /transfers</code></td></tr><tr><td>② Yêu
      cầu và phản hồi</td><td>người gọi gửi yêu cầu, máy chủ trả phản hồi</td><td>yêu
      cầu chuyển tiền, phản hồi thành công</td></tr><tr><td>③ Mã trạng thái</td><td>số
      báo kết quả: 2xx thành công, 4xx lỗi người gọi, 5xx lỗi máy chủ</td><td>200
      thành công, 404 không thấy, 503 tạm không phục vụ</td></tr><tr><td>④ Hết giờ
      chờ</td><td>chờ quá lâu thì người gọi bỏ cuộc, dù máy chủ có thể đã làm xong</td><td>chờ
      3 giây không thấy gì</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. HTTP là giao thức web. Mỗi yêu cầu gồm một
      phương thức, như lấy hay gửi, và một đường dẫn. REST API là cách một dịch vụ
      mở chức năng của nó qua các đường dẫn đó. Người gọi gửi yêu cầu, máy chủ trả
      phản hồi. Mã trạng thái báo kết quả. Các mã bắt đầu bằng chữ số hai là thành
      công, bắt đầu bằng bốn là lỗi người gọi, bắt đầu bằng năm là lỗi máy chủ. Còn
      hết giờ chờ nghĩa là người gọi bỏ cuộc, dù máy chủ có thể đã làm xong.
  - show: $$2\,000\,000 - 500\,000 = 1\,500\,000$$
    say: Một ví dụ số. Số dư hai triệu, trừ năm trăm nghìn còn một triệu năm trăm
      nghìn. Đó là kết quả đúng cho một lần chuyển.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>GET</td><td>đọc
      dữ liệu, không làm thay đổi gì: an toàn</td></tr><tr><td>POST</td><td>tạo hoặc
      thực hiện việc mới: mỗi lần gọi có thể làm thêm một việc</td></tr><tr><td>PUT</td><td>ghi
      đè tới trạng thái đã cho: gọi nhiều lần cũng cho một kết quả</td></tr><tr><td>lũy
      đẳng</td><td>gọi một lần hay nhiều lần, kết quả cuối cùng như nhau</td></tr><tr><td>khoá
      lũy đẳng</td><td>mã duy nhất do người gọi sinh ra cho mỗi việc, gửi kèm mọi
      lần thử</td></tr></table>'
    say: Bảng này giải mã năm từ. G E T là đọc, không thay đổi gì. P O S T là làm
      một việc mới, mỗi lần gọi có thể làm thêm. P U T là ghi đè tới trạng thái đã
      cho, gọi nhiều lần cho cùng kết quả. Lũy đẳng nghĩa là gọi một lần hay nhiều
      lần, kết quả cuối như nhau. Khoá lũy đẳng là mã duy nhất người gọi gửi kèm mọi
      lần thử.
