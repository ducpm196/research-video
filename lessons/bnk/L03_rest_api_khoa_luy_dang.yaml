- id: formula
  kind: formula
  title: 'Suy ra từng bước: thử lại an toàn'
  checks:
  - len({'k1', 'k1', 'k1'}) == 1
  - alg.bnk_unique_key_rows(3) == 1
  steps:
  - show: '<p><b>Bước 1.</b> Hết giờ chờ chỉ cho biết <b>chưa nhận phản hồi</b>, không
      cho biết máy chủ đã làm hay chưa. Muốn biết kết quả, người gọi phải gửi lại
      hoặc hỏi lại, nên thử lại là chuyện thường xảy ra.</p>

      <span class=''note''>Làm thử: 3 lần gửi, 0 phản hồi tới nơi, vẫn không biết
      số lần đã trừ.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì hết giờ chờ chỉ cho biết chưa nhận được phản hồi, chứ không
      cho biết máy chủ đã làm hay chưa, nên muốn biết kết quả người gọi phải gửi lại
      hoặc hỏi lại. Thử lại vì thế là chuyện thường xảy ra. Làm thử, ba lần gửi mà
      không phản hồi nào tới nơi, người gọi vẫn không biết đã trừ mấy lần.
  - show: '<p><b>Bước 2.</b> Người gọi sinh <b>một khoá duy nhất cho mỗi việc</b>
      rồi gửi kèm cả ba lần. Khoá đại diện cho <i>việc</i>, không đại diện cho <i>lần
      gửi</i>.</p>

      <span class=''note''>Làm thử: ba lần gửi, một khoá k1.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, vì cả ba lần gửi đều là cùng một việc, nên người gọi sinh một khoá
      duy nhất cho việc đó và gửi kèm mọi lần. Khoá đại diện cho việc, không đại diện
      cho lần gửi. Làm thử, ba lần gửi nhưng chỉ có một khoá.
  - show: '<p><b>Bước 3.</b> Máy chủ tra khoá. Chưa có thì làm rồi lưu <b>trong cùng
      một giao dịch</b> với việc trừ tiền. Đã có thì trả kết quả đã lưu.</p>

      <span class=''note''>Làm thử: số lần trừ tiền = số khoá khác nhau = 1.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, máy chủ tra khoá. Chưa có thì làm việc và lưu khoá trong cùng một
      giao dịch với việc trừ tiền. Đã có thì trả kết quả đã lưu. Vì vậy số lần trừ
      tiền bằng số khoá khác nhau, tức là một.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 3 * 500000 == 1500000
  - alg.bnk_retry_sim(2000000, 500000, 3, False) == 500000
  - alg.bnk_retry_sim(2000000, 500000, 3, True) == 1500000
  - alg.bnk_retry_sim(2000000, 500000, 3, True) - alg.bnk_retry_sim(2000000, 500000,
    3, False) == 1000000
  steps:
  - show: '<p>Số dư đầu $2\,000\,000$, mỗi lần chuyển $500\,000$, thử tổng cộng $3$
      lần.</p>

      $$① \; \text{không khoá: } 3 \cdot 500\,000 = \hl{1\,500\,000}\ \text{đã trừ}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta tính cả hai trường hợp. Số dư đầu hai triệu, mỗi lần chuyển năm trăm nghìn,
      thử ba lần. Phép tính thứ nhất, không có khoá, bị trừ ba nhân năm trăm nghìn,
      là một triệu năm trăm nghìn.
    introduces:
    - cdot
  - show: '<p>Dùng lại $1\,500\,000$ ở phép ①.</p>

      $$② \; 2\,000\,000 - 1\,500\,000 = \hl{500\,000}\ \text{còn lại}$$

      '
    say: Phép tính thứ hai, số dư còn hai triệu trừ một triệu năm trăm nghìn, bằng
      năm trăm nghìn.
  - show: '$$③ \; \text{có khoá: } 1 \cdot 500\,000 = \hlg{500\,000}\ \text{đã trừ}$$'
    say: Phép tính thứ ba, khi có khoá, chỉ trừ một lần, tức năm trăm nghìn.
  - show: $$④ \; 2\,000\,000 - 500\,000 = \hlg{1\,500\,000}\ \text{còn lại}$$
    say: Phép tính thứ tư, số dư còn hai triệu trừ năm trăm nghìn, bằng một triệu
      năm trăm nghìn, đúng như một lần chuyển.
  - show: $$⑤ \; 1\,500\,000 - 500\,000 = \hl{1\,000\,000}\ \text{bị trừ oan khi không
      có khoá}$$
    say: Phép tính thứ năm, chênh lệch giữa hai trường hợp là một triệu năm trăm nghìn
      trừ năm trăm nghìn, bằng một triệu, chính là số tiền bị trừ oan khi không có
      khoá.
- id: chay_that
  kind: example
  title: 'Chạy thật: máy chủ nhỏ và sáu lần gọi'
  steps:
  - show: '<p><b>Tệp MayChu.java (phần 1): hai số dư và bảng nhớ khoá</b></p><div
      class="code"><div><span class="kw">static</span> <span class="kw">long</span>
      a = 2_000_000, b = 2_000_000;                 <span class="cm">// hai số dư
      thử</span></div><div><span class="kw">static</span> Map&lt;String, String&gt;
      daXuLy = <span class="kw">new</span> HashMap&lt;&gt;();      <span class="cm">//
      khoá lũy đẳng -&gt; phản hồi đã trả</span></div><div><span class="kw">static</span>
      <span class="kw">void</span> tra(HttpExchange ex, String s) <span class="kw">throws</span>
      IOException {</div><div>    ex.sendResponseHeaders(200, s.length());</div><div>    ex.getResponseBody().write(s.getBytes());</div><div>    ex.close();</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta dựng một máy chủ nhỏ bằng thư viện có sẵn của Java. Hai biến là hai số
      dư thử, mỗi số hai triệu. Bản đồ này ghi nhớ khoá nào đã xử lý, kèm phản hồi
      đã trả. Hàm trả viết phản hồi về cho người gọi.
  - show: '<p><b>Phần 2: hai đường dẫn</b></p><div class="code"><div>HttpServer sv
      = HttpServer.create(<span class="kw">new</span> InetSocketAddress(8099), 0);</div><div>sv.createContext("/chuyen",
      ex -&gt; tra(ex, "so du " + (a -= 500_000)));</div><div>sv.createContext("/chuyen-co-khoa",
      ex -&gt; tra(ex, daXuLy.computeIfAbsent(</div><div>    ex.getRequestHeaders().getFirst("Idempotency-Key"),
      k -&gt; "so du " + (b -= 500_000))));</div><div>sv.start();</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Máy chủ lắng nghe ở cổng tám nghìn không trăm chín mươi chín. Đường dẫn thứ
      nhất không kiểm khoá, nên mỗi lần được gọi là trừ năm trăm nghìn rồi trả số
      dư. Đường dẫn thứ hai lấy khoá từ tiêu đề. Nếu khoá chưa có thì trừ tiền, lưu
      phản hồi và trả. Nếu khoá đã có thì trả lại đúng phản hồi cũ.
  - show: '<p><b>Cửa sổ lệnh thứ hai (máy chủ chạy ở cửa sổ thứ nhất bằng java MayChu.java)</b></p><div
      class="code"><div>curl -s -w "\n" -X POST localhost:8099/chuyen</div><div>curl
      -s -w "\n" -X POST localhost:8099/chuyen</div><div>curl -s -w "\n" -X POST localhost:8099/chuyen</div><div>curl
      -s -w "\n" -X POST localhost:8099/chuyen-co-khoa -H "Idempotency-Key: abc"</div><div>curl
      -s -w "\n" -X POST localhost:8099/chuyen-co-khoa -H "Idempotency-Key: abc"</div><div>curl
      -s -w "\n" -X POST localhost:8099/chuyen-co-khoa -H "Idempotency-Key: abc"</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ở cửa sổ lệnh thứ hai, ta gửi sáu yêu cầu. Ba yêu cầu đầu đi tới đường dẫn
      không khoá. Ba yêu cầu sau đi tới đường dẫn có khoá, và cùng mang một khoá giống
      nhau, giống như ứng dụng thử lại.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>so du 1500000</div><div>so
      du 1000000</div><div>so du 500000</div><div>so du 1500000</div><div>so du 1500000</div><div>so
      du 1500000</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Khi chạy thật, không khoá thì cả ba lần đều bị trừ, số dư còn năm trăm nghìn,
      tức là bị trừ oan hai lần. Có khoá thì lần đầu trừ, hai lần sau nhận lại đúng
      phản hồi cũ, số dư vẫn một triệu năm trăm nghìn. Máy chủ mẫu này xử lý lần lượt
      từng yêu cầu. Hai yêu cầu cùng khoá đến cùng lúc cần thêm một cơ chế chặn, như
      ràng buộc duy nhất ở bước sau.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: để cơ sở dữ liệu chặn trùng'
  checks:
  - alg.bnk_unique_key_rows(3) == 1
  - alg.bnk_unique_key_rows(1) == 1
  steps:
  - show: '<p>Đường khác: tạo bảng có ràng buộc <code>UNIQUE</code> trên khoá, rồi
      chèn cùng khoá ba lần. Ràng buộc cho phép <b>đúng một dòng</b> vào.</p>

      $$\text{số dòng} = \hl{1}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Kiểm bằng đường khác. Trong cơ sở dữ liệu, bảng là nơi lưu các dòng, và ràng
      buộc duy nhất là luật cấm hai dòng có cùng giá trị ở một cột. Ta tạo một bảng
      có ràng buộc duy nhất trên khoá rồi chèn cùng khoá ba lần. Vì cơ sở dữ liệu
      chỉ cho một dòng vào, số dòng cuối cùng là một. Cách này chặn trùng ngay cả
      khi hai lần thử đến cùng lúc.
  - show: '<p><b>Chạy thật: bảng khoá, chèn cùng khoá ba lần (sqlite)</b></p><div
      class="code"><div><span class="kw">CREATE</span> <span class="kw">TABLE</span>
      khoa_luy_dang (khoa <span class="kw">TEXT</span> <span class="kw">PRIMARY</span>
      <span class="kw">KEY</span>, phan_hoi <span class="kw">TEXT</span>);</div><div><span
      class="kw">INSERT</span> <span class="kw">OR</span> IGNORE <span class="kw">INTO</span>
      khoa_luy_dang <span class="kw">VALUES</span> (''abc'', ''so du 1500000'');</div><div><span
      class="kw">INSERT</span> <span class="kw">OR</span> IGNORE <span class="kw">INTO</span>
      khoa_luy_dang <span class="kw">VALUES</span> (''abc'', ''so du 1000000'');</div><div><span
      class="kw">INSERT</span> <span class="kw">OR</span> IGNORE <span class="kw">INTO</span>
      khoa_luy_dang <span class="kw">VALUES</span> (''abc'', ''so du 500000'');</div><div><span
      class="kw">SELECT</span> <span class="kw">COUNT</span>(*) <span class="kw">FROM</span>
      khoa_luy_dang;</div><div><span class="kw">SELECT</span> phan_hoi <span class="kw">FROM</span>
      khoa_luy_dang <span class="kw">WHERE</span> khoa = ''abc'';</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Máy chủ thật không giữ khoá trong bộ nhớ, vì khởi động lại là mất, nên lưu
      vào bảng. Lệnh tạo bảng khai cột khoá là khoá chính, nghĩa là cơ sở dữ liệu
      không cho hai dòng trùng giá trị ở cột này. Lệnh chèn thêm một dòng. Với cách
      bỏ qua nếu trùng của cơ sở dữ liệu nhỏ này, lần chèn trùng bị bỏ qua. Ta chèn
      cùng một khoá ba lần.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>1</div><div>so du
      1500000</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khi chạy thật, lệnh đếm cho ra một, và dòng còn lại mang phản hồi của lần
      chèn đầu. Vì khoá chính từ chối khoá trùng, nên ngay cả hai yêu cầu cùng khoá
      đến cùng lúc, cơ sở dữ liệu chỉ cho một cái vào. Cách bỏ qua nếu trùng là riêng
      của cơ sở dữ liệu này, cơ sở khác dùng cách bắt lỗi trùng khoá.
  - show: <table class='t'><tr><th>phương thức</th><th>an toàn (không đổi dữ liệu)</th><th>lũy
      đẳng</th></tr><tr><td>GET</td><td>có</td><td>có</td></tr><tr><td>PUT</td><td>không</td><td>có</td></tr><tr><td>DELETE</td><td>không</td><td>có</td></tr><tr><td>POST</td><td>không</td><td>không
      (cần khoá)</td></tr></table>
    say: Bảng này tổng hợp các phương thức. Đọc là an toàn và lũy đẳng. Ghi đè và
      xoá thay đổi dữ liệu nhưng lũy đẳng. Còn P O S T không lũy đẳng, nên cần khoá
      nếu muốn thử lại an toàn.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Cho rằng gọi lại cho an
      toàn. Với việc thay đổi tiền, gọi lại <b class="red">không</b> an toàn nếu không
      có khoá.</div>
    say: Lỗi thứ nhất, của người mới. Cho rằng cứ gọi lại là an toàn. Với việc thay
      đổi tiền, gọi lại không an toàn nếu không có khoá.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Kiểm
      tra rồi mới chèn</b>: đọc xem khoá có chưa, chưa có thì làm. Hai lần thử đến
      cùng lúc đều thấy “chưa có” rồi đều làm.

      <br><span class="note">Cách chữa: ràng buộc UNIQUE, để cơ sở dữ liệu quyết định.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là kiểm tra rồi mới chèn. Đọc xem khoá
      đã có chưa, chưa có thì làm. Hai lần thử đến cùng lúc đều thấy chưa có, nên
      đều làm. Cách chữa là dùng ràng buộc duy nhất, để cơ sở dữ liệu quyết định.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Dùng lại cùng khoá
      cho yêu cầu <b>khác nội dung</b>. Máy chủ phải từ chối thay vì trả kết quả cũ.
      Khoá cũng cần hạn lưu đủ dài hơn thời gian thử lại.</div>
    say: Lỗi thứ ba, cũng của người đã đi làm, là dùng lại cùng khoá cho một yêu cầu
      khác nội dung. Máy chủ phải từ chối thay vì trả kết quả cũ. Khoá cũng cần được
      lưu lâu hơn thời gian người gọi còn thử lại.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnk_retry_sim(1000000, 200000, 5, False) == 0
  - alg.bnk_retry_sim(1000000, 200000, 5, True) == 800000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Số
      dư 1 000 000, chuyển 200 000, thử 5 lần, không khoá. Còn bao nhiêu?</td></tr><tr><td>2</td><td>Cùng
      đề nhưng có khoá lũy đẳng. Còn bao nhiêu?</td></tr><tr><td>3</td><td>Quyết định:
      lưu khoá ở bộ đệm (vùng lưu tạm trong bộ nhớ, đọc rất nhanh, có thể mất) hay
      trong cơ sở dữ liệu cùng giao dịch trừ tiền?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, số dư một triệu, chuyển hai trăm
      nghìn, thử năm lần, không khoá, còn bao nhiêu? Câu hai, cùng đề nhưng có khoá
      lũy đẳng, còn bao nhiêu? Câu ba, lưu khoá ở bộ đệm, tức vùng lưu tạm trong bộ
      nhớ đọc rất nhanh nhưng có thể mất, hay trong cơ sở dữ liệu cùng giao dịch trừ
      tiền? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: bị trừ $5 \cdot 200\,000 = 1\,000\,000$.</p>

      $$1\,000\,000 - 1\,000\,000 = \hl{0}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một. Bị trừ năm nhân hai trăm nghìn, là một triệu, nên số dư còn
      lại bằng không.
    clear: true
  - show: '<p>Câu 2: chỉ trừ một lần.</p>

      $$1\,000\,000 - 200\,000 = \hlg{800\,000}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Có khoá thì chỉ trừ một lần, nên còn tám trăm nghìn.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>khoá
      trong cơ sở dữ liệu, cùng giao dịch</td><td>khoá và việc trừ tiền cùng thành
      công hoặc cùng huỷ</td><td>tốn thêm một lần ghi</td></tr><tr><td>khoá chỉ ở
      bộ đệm</td><td>nhanh</td><td>không cùng giao dịch với việc trừ: khoá có thể
      hết hạn, mất khi chuyển dự phòng, hoặc ghi xong mà việc trừ bị huỷ</td></tr></table>'
    say: Đáp án câu ba. Lưu khoá trong cơ sở dữ liệu cùng giao dịch thì khoá và việc
      trừ tiền cùng thành công hoặc cùng huỷ, đổi lại tốn thêm một lần ghi. Chỉ lưu
      ở bộ đệm thì nhanh, nhưng khoá không cùng giao dịch với việc trừ tiền. Khoá
      có thể hết hạn, mất khi chuyển sang máy dự phòng, hoặc ghi xong mà việc trừ
      lại bị huỷ.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: thử lại nhỏ, thiệt hại lớn khi tải tăng'
  checks:
  - 100000 * 0.001 == 100
  - 100 * 500000 == 50_000_000
  - 10_000_000 * 0.001 == 10000
  - 10000 * 500000 == 5_000_000_000
  - 1_000_000_000 * 0.001 == 1_000_000
  - 1_000_000 * 500000 == 500_000_000_000
  - 100000 * 64 == 6_400_000
  - 10_000_000 * 64 == 640_000_000
  - 1_000_000_000 * 64 == 64_000_000_000
  steps:
  - show: '<p>Mỗi ngày có $N$ lệnh chuyển $500\,000$ đồng. Giả sử $0{,}1\%$ lệnh mất
      phản hồi và ứng dụng thử lại một lần (số minh hoạ). Không có khoá thì mỗi lần
      như vậy trừ oan một lần:

      $$\text{thiệt hại} = N \cdot 0{,}001 \cdot 500\,000\ \text{đồng}$$</p><table
      class=''t''><tr><th>tải</th><th>lệnh mỗi ngày $N$</th><th>lệnh bị trừ trùng</th><th>thiệt
      hại mỗi ngày</th><th>bảng khoá (64 byte mỗi khoá)</th></tr><tr><td>×1</td><td>100
      000</td><td>100</td><td>50 000 000 đồng</td><td>6,4 MB</td></tr><tr><td>×100</td><td>10
      000 000</td><td>10 000</td><td><b>5 tỉ đồng</b></td><td>640 MB</td></tr><tr><td>×10
      000</td><td>1 000 000 000</td><td>1 000 000</td><td><b>500 tỉ đồng</b></td><td><b>64
      GB</b></td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Mỗi ngày có N lệnh chuyển năm trăm nghìn đồng. Giả sử một phần nghìn số lệnh
      mất phản hồi và ứng dụng thử lại một lần. Đây là số minh hoạ. Không có khoá
      thì mỗi lần như vậy trừ oan một lần. Ở một trăm nghìn lệnh mỗi ngày, có một
      trăm lệnh trừ trùng, năm mươi triệu đồng. Tải tăng một trăm lần thì thiệt hại
      năm tỉ đồng mỗi ngày. Tải tăng mười nghìn lần thì thiệt hại năm trăm tỉ đồng
      mỗi ngày.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Nhân viên đối soát
      và hoàn tiền thủ công: ở ×1 là 100 lệnh mỗi ngày, làm được; ở ×100 là 10 000
      lệnh; ở ×10 000 là 1 triệu lệnh mỗi ngày, không ai làm nổi.

      <b>Khoá lũy đẳng</b> giải được, nhưng bảng khoá phình theo: 6,4 MB, 640 MB,
      64 GB mỗi ngày (mỗi khoá 64 byte, số minh hoạ).</div>

      <div class="box key"><b>Đánh đổi:</b> cho khoá <b>hết hạn</b> (ví dụ sau 24
      giờ) và chia bảng theo ngày để dọn nhanh. Giữ ngắn thì nhẹ bảng, nhưng ứng dụng
      thử lại muộn hơn thời hạn sẽ bị trừ trùng; giữ dài thì tốn chỗ.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giải pháp cũ là nhân viên đối soát rồi hoàn tiền thủ công. Ở tải gốc là một
      trăm lệnh mỗi ngày, làm được. Ở tải gấp trăm lần là mười nghìn lệnh, và ở tải
      gấp mười nghìn lần là một triệu lệnh mỗi ngày, không ai làm nổi. Khoá lũy đẳng
      giải được chuyện này, nhưng bảng khoá phình theo. Nếu mỗi khoá chiếm sáu mươi
      bốn byte, bảng tăng từ sáu phẩy bốn mê ga byte tới sáu mươi bốn nghìn mê ga
      byte mỗi ngày. Đánh đổi là cho khoá hết hạn, ví dụ sau hai mươi bốn giờ, và
      chia bảng theo ngày để dọn nhanh. Giữ ngắn thì nhẹ bảng nhưng ứng dụng thử lại
      muộn hơn thời hạn sẽ bị trừ trùng, còn giữ dài thì tốn chỗ.
