scenes:
- id: hook
  kind: hook
  title: Vì sao một thông điệp khi thì bị xử lý hai lần, khi thì mất hẳn?
  steps:
  - show: '<p>Một bộ đọc Kafka xử lý thông điệp số $2$ rồi <b>sập trước khi ghi nhớ</b>
      rằng đã đọc. Khi chạy lại, nó đọc thông điệp số $2$ <b>lần nữa</b>.</p>

      <div class="box key">Đổi thứ tự “ghi nhớ trước, xử lý sau” thì thông điệp số
      $2$ lại <b>mất hẳn</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, một bộ đọc Kafka xử lý thông điệp số hai rồi sập, trước khi kịp
      ghi nhớ rằng đã đọc. Khi chạy lại, nó đọc thông điệp số hai lần nữa. Nếu đổi
      thứ tự, ghi nhớ trước rồi xử lý sau, thì thông điệp số hai lại mất hẳn.
  - show: <table class='t'><tr><th>thứ tự</th><th>thông điệp số 2 được xử lý</th><th>tên
      gọi</th></tr><tr><td>xử lý rồi ghi nhớ</td><td>2 lần</td><td>ít nhất một lần</td></tr><tr><td>ghi
      nhớ rồi xử lý</td><td>0 lần</td><td>nhiều nhất một lần</td></tr></table>
    say: Bảng này là kết quả mô phỏng ở cuối bài. Xử lý rồi mới ghi nhớ thì thông
      điệp số hai được xử lý hai lần, gọi là ít nhất một lần. Ghi nhớ rồi mới xử lý
      thì có thể mất, gọi là nhiều nhất một lần. Hôm nay ta học cách sống chung với
      chuyện này.
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - 13 == 2 * 6 + 1 and 13 % 6 == 1
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Kafka và thông điệp</td><td>Kafka là hệ thống chuyển thông điệp: bên gửi ghi
      thông điệp (một gói dữ liệu báo việc gì đó) vào nhật ký, bên đọc lấy ra xử lý</td><td>“TK-1001
      vừa nạp 50 000”</td></tr><tr><td>② Nhật ký chỉ thêm</td><td>chỉ ghi nối vào
      cuối, không sửa dòng cũ</td><td>thông điệp 0, 1, 2, 3, …</td></tr><tr><td>③
      Số thứ tự (offset)</td><td>vị trí của mỗi thông điệp trong nhật ký</td><td>thông
      điệp thứ 2 có offset 2</td></tr><tr><td>④ Khoá thông điệp và băm chia dư</td><td>khoá
      (key) là nhãn đi kèm thông điệp, ví dụ số tài khoản; hàm băm biến khoá thành
      một số (cùng khoá luôn ra cùng số), rồi chia dư để chọn ngăn (sau gọi là phân
      vùng)</td><td>mã băm 13 chia 6 dư 1 → ngăn 1</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Kafka là hệ thống chuyển thông điệp. Bên
      gửi ghi thông điệp, tức một gói dữ liệu báo việc gì đó, vào nhật ký, còn bên
      đọc lấy ra xử lý. Nhật ký chỉ thêm là chỉ ghi nối vào cuối, không sửa dòng cũ.
      Số thứ tự cho biết vị trí của mỗi thông điệp trong nhật ký. Khoá thông điệp
      là nhãn đi kèm, ví dụ số tài khoản. Hàm băm biến khoá thành một số, và cùng
      khoá luôn ra cùng số. Rồi ta chia dư để chọn một ngăn, ví dụ mười ba chia sáu
      dư một thì vào ngăn một, mỗi ngăn sau này gọi là một phân vùng.
  - show: <table class='t'><tr><th>thêm hai điều</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>⑤
      Nhịp báo còn sống (heartbeat)</td><td>tín hiệu gửi đều đặn để nhóm biết một
      bộ đọc chưa chết; ngừng gửi quá hạn thì bị coi là chết và nhóm chia lại việc</td><td>mỗi
      3 giây một nhịp</td></tr><tr><td>⑥ Tác dụng phụ</td><td>việc làm thay đổi thứ
      ở bên ngoài chương trình, như ghi cơ sở dữ liệu, gửi thư, gọi hệ khác; khác
      với việc chỉ tính toán rồi bỏ</td><td>trừ tiền trong cơ sở dữ liệu</td></tr></table>
    clear: true
    say: Thêm hai điều nữa. Nhịp báo còn sống là tín hiệu gửi đều đặn để nhóm biết
      một bộ đọc chưa chết. Nếu ngừng gửi quá hạn, bộ đọc bị coi là chết và nhóm chia
      lại việc. Tác dụng phụ là việc làm thay đổi thứ ở bên ngoài chương trình, như
      ghi cơ sở dữ liệu, gửi thư hay gọi hệ khác, khác với việc chỉ tính toán rồi
      bỏ kết quả.
  - show: $$13 = 2 \cdot 6 + 1$$
    say: Kiểm phép chia dư. Mười ba bằng hai nhân sáu cộng một, nên mười ba chia sáu
      dư một.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>topic</td><td>một
      luồng thông điệp có tên, ví dụ giao dịch chuyển tiền</td></tr><tr><td>partition
      (phân vùng)</td><td>một nhật ký thật của topic; topic gồm nhiều phân vùng chạy
      song song</td></tr><tr><td>consumer group</td><td>nhóm bộ đọc cùng chia nhau
      các phân vùng của topic</td></tr><tr><td>rebalance</td><td>chia lại phân vùng
      khi có bộ đọc vào hoặc ra khỏi nhóm</td></tr><tr><td>commit offset</td><td>ghi
      nhớ đã đọc tới đâu để lần sau đọc tiếp</td></tr></table>
    say: Bảng này giải mã năm từ. Chủ đề là một luồng thông điệp có tên. Phân vùng
      là một nhật ký thật của chủ đề, và chủ đề gồm nhiều phân vùng chạy song song.
      Nhóm bộ đọc là các bộ đọc cùng chia nhau phân vùng. Chia lại là khi có bộ đọc
      vào hay ra khỏi nhóm. Còn ghi nhớ vị trí là lưu lại đã đọc tới đâu.
