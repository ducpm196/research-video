      giữa “ghi nhớ” và “xử lý” → khởi động lại bỏ qua → mất thông điệp</text></svg></div>
    clear: true
    say: Hình thứ ba cho thấy hai thứ tự. Hàng trên, xử lý rồi mới ghi nhớ. Sập ở
      giữa thì khi chạy lại sẽ đọc lại, nên xử lý hai lần. Hàng dưới, ghi nhớ rồi
      mới xử lý. Sập ở giữa thì khi chạy lại sẽ bỏ qua, nên mất thông điệp.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: chia việc và số lần xử lý'
  checks:
  - '[alg.bnk_key_partition(k, 6) for k in (''TK-1001'', ''TK-1001'')] == [1, 1]'
  - len(alg.bnk_assign(6, 8)[6]) + len(alg.bnk_assign(6, 8)[7]) == 0 and sum(1 for
    g in alg.bnk_assign(6, 8) if g) == 6
  - alg.bnk_commit_sim(5, 2, False)[2] >= 1 and alg.bnk_commit_sim(5, 2, True)[2]
    <= 1
  steps:
  - show: '<p><b>Bước 1.</b> Cùng khoá băm ra cùng phân vùng, <b>miễn là số phân vùng
      không đổi</b>, nên thông điệp cùng một tài khoản nằm cùng một phân vùng và <b>giữ
      đúng thứ tự</b>.</p>

      <span class=''note''>Làm thử: khoá TK-1001 hai lần đều vào phân vùng 1. Thêm
      phân vùng thì khoá có thể chuyển sang phân vùng khác.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì cùng khoá băm ra cùng phân vùng, miễn là số phân vùng không
      đổi, nên thông điệp của cùng một tài khoản nằm cùng một phân vùng và giữ đúng
      thứ tự. Làm thử, khoá T K một không không một hai lần đều vào phân vùng một.
      Nếu thêm phân vùng, phép chia dư đổi, và khoá có thể chuyển sang phân vùng khác.
  - show: '<p><b>Bước 2.</b> Mỗi phân vùng chỉ một bộ đọc trong nhóm, nên số bộ đọc
      làm việc thật sự tối đa bằng <b>số phân vùng</b>.</p>

      <span class=''note''>Làm thử: $6$ phân vùng, $8$ bộ đọc → $6$ làm việc, $2$
      ngồi không.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì mỗi phân vùng chỉ có một bộ đọc trong nhóm, nên số bộ đọc làm
      việc tối đa bằng số phân vùng. Làm thử, sáu phân vùng mà tám bộ đọc thì sáu
      người làm việc, hai người ngồi không.
  - show: '<p><b>Bước 3.</b> Số lần xử lý một thông điệp phụ thuộc <b>thứ tự</b> giữa
      xử lý và ghi nhớ khi sập: xử lý trước thì $\ge 1$ lần, ghi nhớ trước thì $\le
      1$ lần.</p>

      <span class=''note''>Muốn đúng một lần về hiệu quả: xử lý trước, ghi nhớ sau,
      và để việc xử lý lũy đẳng.</span>

      '
    focus:
    - 1
    - 2
    say: Bước ba, vì khi sập, thứ tự giữa xử lý và ghi nhớ quyết định kết quả, nên
      xử lý trước thì ít nhất một lần, ghi nhớ trước thì nhiều nhất một lần. Muốn
      hiệu quả đúng một lần, ta xử lý trước, ghi nhớ sau, và làm việc xử lý lũy đẳng.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 6 // 3 == 2 and alg.bnk_assign(6, 3) == [[0, 1], [2, 3], [4, 5]]
  - 6 // 2 == 3 and alg.bnk_assign(6, 2) == [[0, 1, 2], [3, 4, 5]]
  - 8 - 6 == 2
  - alg.bnk_commit_sim(5, 2, False) == [1, 1, 2, 1, 1] and sum(alg.bnk_commit_sim(5,
    2, False)) == 6
  - alg.bnk_commit_sim(5, 2, True) == [1, 1, 0, 1, 1] and sum(alg.bnk_commit_sim(5,
    2, True)) == 4
  steps:
  - show: '<p>Topic $6$ phân vùng, nhóm $3$ bộ đọc: chia đều.</p>

      $$① \; \frac{6}{3} = \hl{2}\ \text{phân vùng mỗi người}$$

      '
    focus:
    - 1
    - 2
    say: Ta tính bốn tình huống. Tình huống một, chủ đề sáu phân vùng, nhóm ba bộ
      đọc, chia đều thì mỗi người nhận sáu chia ba, là hai phân vùng.
  - show: '<p>Một người rời nhóm, còn $2$ người.</p>

      $$② \; \frac{6}{2} = \hl{3}\ \text{phân vùng mỗi người}$$

      '
    focus:
    - 1
    - 2
    say: Tình huống hai, một người rời nhóm, còn hai người. Mỗi người nhận sáu chia
      hai, là ba phân vùng.
  - show: '<p>Thêm người cho đủ $8$ bộ đọc.</p>

      $$③ \; 8 - 6 = \hl{2}\ \text{người ngồi không}$$

      '
    focus:
    - 1
    - 2
    say: Tình huống ba, thêm người cho đủ tám bộ đọc. Chỉ có sáu phân vùng nên hai
      người ngồi không, tám trừ sáu bằng hai.
  - show: '<p>Năm thông điệp $0..4$, ghi nhớ vị trí sau từng thông điệp. Sập ở thông
      điệp $2$, thứ tự <b>xử lý rồi ghi nhớ</b>.</p>

      $$④ \; \text{số lần xử lý} = [1, 1, \hl{2}, 1, 1]\quad \text{tổng } 6$$

      <p class="small">Ghi nhớ theo lô nhiều thông điệp một lần thì còn nhiều thông
      điệp bị xử lý lại hơn.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Tình huống bốn, năm thông điệp từ không tới bốn, và bộ đọc ghi nhớ vị trí
      sau từng thông điệp. Sập ở thông điệp hai, thứ tự xử lý rồi ghi nhớ. Số lần
      xử lý là một, một, hai, một, một, tổng cộng sáu lần cho năm thông điệp. Nếu
      ghi nhớ theo lô nhiều thông điệp một lần, số thông điệp bị xử lý lại còn nhiều
      hơn.
  - show: '<p>Cùng tình huống nhưng <b>ghi nhớ rồi xử lý</b>.</p>

      $$⑤ \; \text{số lần xử lý} = [1, 1, \hl{0}, 1, 1]\quad \text{tổng } 4$$

      '
    focus:
    - 1
    - 2
    say: Tình huống năm, cùng tình huống nhưng ghi nhớ rồi mới xử lý. Số lần xử lý
      là một, một, không, một, một, tổng bốn lần, tức là mất thông điệp số hai.
- id: chay_that
  kind: example
  title: 'Chạy thật: chia phân vùng và thứ tự ghi nhớ (mô phỏng bằng Java)'
  steps:
  - show: '<p><b>ChiaPhanVung.java (phần chính): 10 phân vùng cho 4 bộ đọc</b></p><div
      class="code"><div><span class="kw">int</span> phanVung = 10, bo = 4, p = 0;</div><div><span
      class="kw">for</span> (<span class="kw">int</span> b = 0; b &lt; bo; b++) {</div><div>    <span
      class="kw">int</span> so = phanVung / bo + (b &lt; phanVung % bo ? 1 : 0);   <span
      class="cm">// chia đều, phần dư chia cho các bộ đầu</span></div><div>    StringBuilder
      sb = <span class="kw">new</span> StringBuilder("bo doc " + b + ":");</div><div>    <span
      class="kw">for</span> (<span class="kw">int</span> k = 0; k &lt; so; k++) sb.append("
      P").append(p++);</div><div>    System.out.println(sb);</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Kafka thật cần cài riêng, nên ta mô phỏng cơ chế bằng Java. Đoạn này chia
      mười phân vùng cho bốn bộ đọc. Mỗi bộ được số phân vùng bằng mười chia nguyên
      cho bốn, tức hai, và các bộ đầu nhận thêm một nếu còn dư. Mười chia bốn dư hai,
      nên hai bộ đầu nhận ba phân vùng, hai bộ sau nhận hai.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>bo doc 0: P0 P1 P2</div><div>bo
      doc 1: P3 P4 P5</div><div>bo doc 2: P6 P7</div><div>bo doc 3: P8 P9</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Khi chạy thật, bộ đọc không và một nhận ba phân vùng, bộ hai và ba nhận
      hai. Đúng với phép tính tay: ba cộng ba cộng hai cộng hai bằng mười, không phân
      vùng nào bị thiếu hay trùng.'
  - show: '<p><b>GhiNho.java (phần 1): thông điệp 2 làm bộ đọc sập đúng một lần</b></p><div
      class="code"><div><span class="kw">static</span> <span class="kw">int</span>[]
      chay(<span class="kw">boolean</span> ghiNhoTruoc) {</div><div>    <span class="kw">int</span>[]
      dem = <span class="kw">new</span> <span class="kw">int</span>[5];                 <span
      class="cm">// số lần xử lý mỗi thông điệp 0..4</span></div><div>    <span class="kw">int</span>
      viTri = 0;                          <span class="cm">// vị trí đã ghi nhớ</span></div><div>    <span
      class="kw">boolean</span> daSap = <span class="kw">false</span>;</div><div>    <span
      class="kw">while</span> (viTri &lt; 5) {</div><div>        <span class="kw">int</span>
      m = viTri;</div><div>        <span class="kw">if</span> (ghiNhoTruoc) {</div><div>            viTri
      = m + 1;                  <span class="cm">// ghi nhớ trước</span></div><div>            <span
      class="kw">if</span> (m == 2 &amp;&amp; !daSap) { daSap = <span class="kw">true</span>;
      <span class="kw">continue</span>; }   <span class="cm">// sập: chưa kịp xử lý</span></div><div>            dem[m]++;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bây giờ là thứ tự ghi nhớ và xử lý. Hàm này xử lý năm thông điệp và đếm số
      lần mỗi thông điệp được xử lý. Nếu ghi nhớ trước, thì sập ở thông điệp hai khi
      vị trí đã lưu nhưng chưa xử lý. Lần khởi động lại sau đó bắt đầu sau thông điệp
      hai, nên thông điệp hai bị mất.
  - show: '<p><b>Phần 2: xử lý trước, ghi nhớ sau, rồi so hai cách</b></p><div class="code"><div>        }
      <span class="kw">else</span> {</div><div>            dem[m]++;                       <span
      class="cm">// xử lý trước</span></div><div>            <span class="kw">if</span>
      (m == 2 &amp;&amp; !daSap) { daSap = <span class="kw">true</span>; <span class="kw">continue</span>;
      }   <span class="cm">// sập: chưa kịp ghi nhớ</span></div><div>            viTri
      = m + 1;</div><div>        }</div><div>    }</div><div>    <span class="kw">return</span>
      dem;</div><div>}</div><div><span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) {</div><div>    System.out.println("ghi
      nho truoc: " + Arrays.toString(chay(<span class="kw">true</span>)));</div><div>    System.out.println("xu
      ly truoc:   " + Arrays.toString(chay(<span class="kw">false</span>)));</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Nếu xử lý trước rồi ghi nhớ sau, thì sập ở thông điệp hai khi đã xử lý nhưng
      chưa lưu vị trí. Lần khởi động lại đọc lại từ thông điệp hai, nên nó bị xử lý
      hai lần. Hàm chính in số lần xử lý của năm thông điệp cho cả hai cách.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>ghi nho truoc: [1,
      1, 0, 1, 1]</div><div>xu ly truoc:   [1, 1, 2, 1, 1]</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Khi chạy thật, ghi nhớ trước cho số lần là một, một, không, một, một: thông
      điệp hai bị mất. Xử lý trước cho một, một, hai, một, một: thông điệp hai bị
      xử lý hai lần. Vì thế người làm nghề chọn xử lý trước, ghi nhớ sau, rồi khử
      trùng ở phía xử lý, thay vì chấp nhận mất tiền.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: khử trùng ở phía xử lý'
  checks:
  - len(set(i for i, c in enumerate(alg.bnk_commit_sim(5, 2, False)) for _ in range(c)))
    == 5
  steps:
  - show: '<p>Đường khác: giữ <b>tập các mã đã xử lý</b>. Thông điệp số $2$ đến hai
      lần, nhưng lần hai gặp mã đã có nên bỏ qua.</p>

      $$\text{số thông điệp xử lý thật} = \hlg{5}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Kiểm bằng đường khác. Vì thông điệp đến ít nhất một lần, nên ta giữ tập các
      mã đã xử lý. Thông điệp số hai đến hai lần, nhưng lần hai gặp mã đã có nên bị
      bỏ qua. Kết quả là năm thông điệp được xử lý thật, đúng mỗi thông điệp một lần.
  - show: <table class='t'><tr><th>cách</th><th>xử lý thật mỗi thông điệp</th><th>điều
      kiện</th></tr><tr><td>ít nhất một lần + khử trùng</td><td>đúng 1 lần (về hiệu
      quả)</td><td>mã thông điệp duy nhất, kho mã bền; ghi mã đã xử lý và tác dụng
      nghiệp vụ trong cùng một giao dịch cơ sở dữ liệu</td></tr><tr><td>nhiều nhất
      một lần</td><td>0 hoặc 1 lần</td><td>chấp nhận mất</td></tr></table>
    say: Bảng này so hai cách. Vì thông điệp đã đến ít nhất một lần, nên khử trùng
      cho hiệu quả đúng một lần, với điều kiện mã thông điệp duy nhất và kho mã bền.
      Mã đã xử lý và tác dụng nghiệp vụ phải được ghi trong cùng một giao dịch cơ
      sở dữ liệu, nếu không thì sập ở giữa vẫn trùng hoặc mất. Nhiều nhất một lần
      thì có thể mất, chỉ dùng khi chấp nhận mất.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ thêm bộ đọc là nhanh
      hơn mãi. Quá số phân vùng, các bộ đọc thừa <b class="red">ngồi không</b>.</div>
    say: Lỗi thứ nhất, của người mới. Nghĩ thêm bộ đọc là nhanh hơn mãi. Quá số phân
      vùng thì các bộ đọc thừa ngồi không.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Xử
      lý quá lâu</b> trong một lần đọc. Bộ đọc bị coi là chết, nhóm chia lại, thông
      điệp đang xử lý bị giao cho người khác và <b>xử lý hai lần</b>.

      <br><span class="note">Cách chữa: gọi <code>poll()</code> (lệnh lấy thông điệp)
      lại trong hạn <code>max.poll.interval.ms</code> (hạn tối đa giữa hai lần lấy;
      giảm <code>max.poll.records</code>, số thông điệp mỗi lần lấy, hoặc tăng hạn),
      và làm việc xử lý lũy đẳng.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là xử lý quá lâu trong một lần đọc. Bộ
      đọc bị coi là chết, nhóm chia lại, thông điệp đang xử lý bị giao cho người khác
      và xử lý hai lần. Nhịp báo còn sống chạy ở một luồng riêng, nên lỗi này là do
      quá hạn giữa hai lần đọc. Cách chữa là đọc lại trong hạn cho phép, bằng cách
      lấy ít thông điệp hơn mỗi lần hoặc tăng hạn, và làm việc xử lý lũy đẳng.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nghe “đúng một lần”
      của Kafka rồi tin mọi tác dụng phụ chỉ xảy ra một lần. Giao dịch của Kafka chỉ
      bao trùm đọc, xử lý, ghi <b>trong Kafka</b>.

      Ghi vào cơ sở dữ liệu hay gọi hệ ngoài vẫn cần khoá lũy đẳng.</div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là nghe đúng một lần của Kafka rồi
      tin mọi tác dụng phụ chỉ xảy ra một lần. Giao dịch của Kafka chỉ bao trùm việc
      đọc, xử lý và ghi bên trong Kafka. Ghi vào cơ sở dữ liệu hay gọi hệ ngoài vẫn
      cần khoá lũy đẳng.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '[len(g) for g in alg.bnk_assign(10, 4)] == [3, 3, 2, 2]'
  - 12 - 10 == 2 and sum(1 for g in alg.bnk_assign(10, 12) if not g) == 2
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>10
      phân vùng, 4 bộ đọc, chia khoảng liền nhau; phần dư chia cho những người đầu,
      mỗi người thêm một. Mỗi người nhận mấy phân vùng?</td></tr><tr><td>2</td><td>10
      phân vùng, 12 bộ đọc. Mấy người ngồi không?</td></tr><tr><td>3</td><td>Quyết
      định: lệnh trừ tiền nên ghi nhớ vị trí trước hay sau khi xử lý?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, mười phân vùng, bốn bộ đọc, chia
      liền nhau và phần dư chia cho những người đầu, mỗi người thêm một, vậy mỗi người
      nhận mấy phân vùng? Câu hai, mười phân vùng, mười hai bộ đọc, mấy người ngồi
      không? Câu ba, lệnh trừ tiền nên ghi nhớ vị trí trước hay sau khi xử lý? Hãy
      dừng video và làm ra giấy.
  - show: '<p>Câu 1: $10 = 4 \cdot 2 + 2$, nên hai người đầu nhận $3$, hai người sau
      nhận $2$.</p>

      $$[3, 3, 2, 2]\quad 3 + 3 + 2 + 2 = \hl{10}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Mười bằng bốn nhân hai cộng hai, nên hai người đầu nhận ba
      phân vùng, hai người sau nhận hai. Ba cộng ba cộng hai cộng hai bằng mười.
    clear: true
  - show: $$12 - 10 = \hlg{2}\ \text{người ngồi không}$$
    say: Đáp án câu hai. Mười hai bộ đọc trừ mười phân vùng, nên hai người ngồi không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>xử
      lý rồi ghi nhớ + khoá lũy đẳng</td><td>không mất lệnh, trùng thì bị chặn</td><td>phải
      làm khoá lũy đẳng</td></tr><tr><td>ghi nhớ rồi xử lý</td><td>không bao giờ xử
      lý hai lần</td><td>có thể mất lệnh trừ tiền</td></tr></table>
    say: Đáp án câu ba. Với lệnh trừ tiền, mất lệnh nguy hiểm hơn trùng lệnh, vì trùng
      ta chặn được bằng khoá lũy đẳng. Nên chọn xử lý rồi mới ghi nhớ, kèm khoá lũy
      đẳng.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: một phân vùng, một bộ đọc, và khối việc tồn đọng'
  checks:
  - 5000 / 1000 == 5
  - 500000 / 1000 == 500
  - 50000000 / 1000 == 50000
  - (5000 - 4000) * 3600 == 3_600_000
  - (500_000 - 4000) * 3600 == 1_785_600_000
  - (50_000_000 - 4000) * 3600 == 179_985_600_000
  steps:
  - show: '<p>Mỗi phân vùng được <b>một</b> bộ đọc trong nhóm xử lý, với tốc độ $1\,000$
      thông điệp mỗi giây <i>(số minh hoạ)</i>. Số phân vùng tối thiểu bằng tải chia
      tốc độ một bộ đọc. Nếu chỉ có $4$ phân vùng, thông điệp xử lý được $4\,000$
      mỗi giây, phần còn lại đọng lại sau một giờ ($3\,600$ giây):</p><table class=''t''><tr><th>tải</th><th>thông
      điệp mỗi giây</th><th>phân vùng tối thiểu</th><th>chỉ 4 phân vùng: tồn đọng
      sau 1 giờ</th></tr><tr><td>×1</td><td>5 000</td><td>5</td><td>3 600 000</td></tr><tr><td>×100</td><td>500
      000</td><td>500</td><td><b>≈ 1,79 tỉ</b></td></tr><tr><td>×10 000</td><td>50
      000 000</td><td>50 000</td><td><b>≈ 180 tỉ</b></td></tr></table>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Mỗi phân vùng được một bộ đọc trong nhóm xử lý, với tốc độ một nghìn thông
      điệp mỗi giây, đây là số minh hoạ. Số phân vùng tối thiểu bằng tải chia tốc
      độ của một bộ đọc. Với năm nghìn thông điệp mỗi giây, cần năm phân vùng. Nếu
      chỉ có bốn, mỗi giờ đọng lại ba triệu sáu trăm nghìn thông điệp. Tải tăng một
      trăm lần cần năm trăm phân vùng, và bốn phân vùng đọng hơn một phẩy bảy chín
      tỉ thông điệp. Tải tăng mười nghìn lần cần năm mươi nghìn phân vùng.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Thêm bộ đọc mà không
      thêm phân vùng không giúp gì: bộ đọc thừa ngồi không. Thêm phân vùng thì <b>cùng
      khoá có thể sang phân vùng khác</b> (băm chia dư cho số mới), nên thứ tự theo
      khoá bị phá lúc chuyển.

      Số phân vùng lại <b>không giảm được</b> về sau.</div>

      <div class="box key"><b>Đánh đổi:</b> chọn số phân vùng dư vừa phải ngay từ
      đầu, theo tải dự kiến vài năm. Nhiều phân vùng quá thì mỗi lần chia lại lâu
      hơn và tốn thêm tệp mở; ít quá thì nghẽn như bảng trên.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Câu hỏi là giải pháp cũ sẽ gãy ở chỗ nào khi tải tăng lên. Thêm bộ đọc mà
      không thêm phân vùng không giúp gì, vì bộ đọc thừa ngồi không. Thêm phân vùng
      thì cùng một khoá có thể sang phân vùng khác, vì băm chia dư theo số phân vùng
      mới, nên thứ tự theo khoá bị phá lúc chuyển. Số phân vùng cũng không giảm được
      về sau. Đánh đổi là chọn số phân vùng dư vừa phải ngay từ đầu, theo tải dự kiến
      vài năm. Nhiều quá thì mỗi lần chia lại lâu hơn và tốn thêm tệp mở, còn ít quá
      thì nghẽn như bảng trên.
- id: practice
  kind: practice
  title: 'Tự làm: bảy phân vùng, chín bộ đọc'
  steps:
  - show: '<p><b>Đề</b>: 7 phân vùng, 9 bộ đọc; mỗi bộ nhận <code>7 / 9</code> phân
      vùng, bộ có số nhỏ hơn <code>7 % 9</code> nhận thêm một. Viết <code>NguoiNgoiKhong.java</code>:</p>

      <ol><li>mỗi bộ đọc in <code>bo doc 0: P0</code> …; bộ không nhận gì in <code>ngoi
      khong</code></li>

      <li>dòng cuối <code>so nguoi ngoi khong: …</code></li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 150
    say: Bây giờ tới phần bạn tự làm. Một chủ đề có bảy phân vùng, một nhóm có chín
      bộ đọc. Mỗi bộ nhận bảy chia nguyên cho chín phân vùng, và bộ có số thứ tự nhỏ
      hơn phần dư nhận thêm một. Phân vùng được phát liên tiếp từ không. Hãy in cho
      mỗi bộ đọc một dòng, bộ không nhận gì thì ghi ngồi không, và dòng cuối là số
      người ngồi không. Hãy dừng video, tự viết và chạy, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>bo doc 0: P0</div><div>bo
      doc 1: P1</div><div>bo doc 2: P2</div><div>bo doc 3: P3</div><div>bo doc 4:
      P4</div><div>bo doc 5: P5</div><div>bo doc 6: P6</div><div>bo doc 7: ngoi khong</div><div>bo
      doc 8: ngoi khong</div><div>so nguoi ngoi khong: 2</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh BNK L07 NguoiNgoiKhong.java</code> —
      in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mô theo <code>ChiaPhanVung</code>:
      <code>int so = phanVung / bo + (b &lt; phanVung % bo ? 1 : 0);</code>. Nếu <code>so
      == 0</code> thì thêm chữ <code>ngoi khong</code> và tăng biến đếm.

      Lời giải ở <code>labs/BNK/L07/loi_giai.java</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, làm theo mẫu chia phân vùng vừa xem. Nếu số phân vùng của một bộ
      bằng không thì ghi ngồi không và tăng biến đếm. Lời giải đầy đủ nằm trong thư
      mục thực hành của bài, chỉ mở sau khi bạn đã tự thử.
    clear: true
  lab: labs/BNK/L07
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>khoá → phân vùng</span><span class='a'>→</span><span
      class='n'>mỗi phân vùng một bộ đọc</span><span class='a'>→</span><span class='n'>sập
      → đọc lại</span><span class='a'>→</span><span class='n'>xử lý lũy đẳng</span></div>
    say: Tổng kết chuỗi logic. Khoá quyết định phân vùng. Mỗi phân vùng chỉ một bộ
      đọc. Sập thì đọc lại, nên việc xử lý phải lũy đẳng.
  - show: <div class='box key'><b>Tư duy:</b> đừng hỏi “Kafka có đúng một lần không”.
      Hãy hỏi <b>“khi sập giữa chừng, việc của tôi chạy mấy lần, và có hại không?”</b></div>
    say: Điều cần mang theo. Đừng hỏi Kafka có đúng một lần không. Hãy hỏi, khi sập
      giữa chừng, việc của tôi chạy mấy lần, và có hại không.
