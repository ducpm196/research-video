      font-size="22" text-anchor="middle" fill="#2a78d6">ghi cả hai</text><rect x="1120"
      y="160" width="340" height="110" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text
      x="1290.0" y="207" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">Bộ
      chuyển tiếp</text><text x="1290.0" y="239" font-size="24" text-anchor="middle"
      fill="#1f2937">đọc Outbox → Kafka</text><line x1="1000" y1="270" x2="1115" y2="230"
      stroke="#9333ea" stroke-width="3.5" marker-end="url(#ah)"/><text x="1057" y="240"
      font-size="22" text-anchor="middle" fill="#9333ea">đọc sau</text></svg></div>'
    clear: true
    say: Mẫu Outbox giải quyết việc vừa lưu vừa báo. Dịch vụ ghi lệnh chuyển và ghi
      sự kiện vào hai bảng, nhưng trong cùng một giao dịch, nên cả hai cùng thành
      công hoặc cùng huỷ. Rồi một bộ chuyển tiếp đọc bảng Outbox và gửi sang Kafka,
      kể cả khi dịch vụ đã sập và chạy lại.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: đếm bước bù và chặn mất sự kiện'
  checks:
  - 2 * 2 + 1 == 5
  - all(len(alg.bnk_saga(i, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * i + 1 for
    i in range(3))
  - alg.bnk_outbox_sim('between', True) == (True, 1)
  steps:
  - show: '<p><b>Bước 1.</b> Không có giao dịch bao nhiều dịch vụ, nên mỗi bước là
      giao dịch cục bộ riêng và <b>mỗi bước cần một bước bù</b>.</p>

      <span class=''note''>Làm thử: 3 bước bù được → 3 bước bù. Thông báo đứng sau
      ghi có, là điểm không quay lại, nên lỗi thì <b>thử lại</b>, không bù.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì không có giao dịch nào bao được nhiều dịch vụ, nên mỗi bước
      là một giao dịch cục bộ riêng và mỗi bước cần một bước bù. Làm thử, ba bước
      giữ hạn mức, ghi nợ, ghi có thì cần ba bước bù. Còn thông báo đứng sau ghi có,
      là điểm không quay lại, nên nếu lỗi thì thử lại, chứ không hoàn tiền.
  - show: '<p><b>Bước 2.</b> Nếu bước thứ $i$ lỗi (đếm từ $0$), có $i$ bước đã xong
      cần bù. Nhật ký gồm $i$ bước xong, $1$ lỗi, $i$ bước bù: $2i + 1$ dòng.</p>

      <span class=''note''>Làm thử: $i = 2$ cho $2 \cdot 2 + 1 = 5$ dòng.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, vì nếu bước thứ i bị lỗi, đếm từ không, thì có i bước đã xong cần
      bù. Nên nhật ký gồm i bước xong, một dòng lỗi, và i bước bù, tức hai i cộng
      một dòng. Làm thử, i bằng hai cho hai nhân hai cộng một, bằng năm dòng.
    introduces:
    - cdot
  - show: '<p><b>Bước 3.</b> Hai việc “lưu” và “báo” ở hai nơi khác nhau có thể sập
      ở giữa. Outbox gộp hai việc thành <b>một giao dịch</b> nên không có “giữa”.</p>

      <span class=''note''>Bộ chuyển tiếp có thể phát trùng, nên người nhận phải khử
      trùng (khoá lũy đẳng).</span>

      '
    focus:
    - 1
    - 2
    say: Bước ba, vì hai việc lưu và báo ở hai nơi khác nhau có thể sập ở giữa, nên
      Outbox gộp hai việc thành một giao dịch, và không còn khoảng giữa. Bộ chuyển
      tiếp có thể phát trùng, nên người nhận phải khử trùng.
- id: example
  kind: example
  title: Ví dụ bằng số, từng trường hợp
  checks:
  - len(alg.bnk_saga(0, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * 0 + 1
  - alg.bnk_saga(1, ('giữ hạn mức', 'ghi nợ', 'ghi có')) == ['giữ hạn mức', 'lỗi ghi
    nợ', 'bù giữ hạn mức']
  - len(alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * 2 + 1
  - alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có')) == ['giữ hạn mức', 'ghi nợ',
    'lỗi ghi có', 'bù ghi nợ', 'bù giữ hạn mức']
  - alg.bnk_outbox_sim('between', False)[1] == 0 and alg.bnk_outbox_sim('between',
    True)[1] == 1
  steps:
  - show: '<p>Ba bước bù được, đánh số $0, 1, 2$: giữ hạn mức, ghi nợ, ghi có.</p>

      $$① \; \text{bước 0 lỗi: nhật ký} = 2 \cdot 0 + 1 = \hl{1}\ \text{dòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta xét ba trường hợp lỗi. Ba bước đánh số từ không, là giữ hạn mức, ghi nợ,
      ghi có. Trường hợp một, bước không lỗi, chưa có gì để bù, nhật ký có hai nhân
      không cộng một, bằng một dòng.
  - show: '$$② \; \text{bước 1 lỗi: } 2 \cdot 1 + 1 = \hl{3}\ \text{dòng: giữ hạn
      mức, lỗi ghi nợ, bù giữ hạn mức}$$'
    say: Trường hợp hai, bước một lỗi. Có một bước đã xong cần bù, nhật ký có ba dòng,
      là giữ hạn mức, lỗi ghi nợ, và bù giữ hạn mức, tức trả lại hạn mức.
  - show: '$$③ \; \text{bước 2 lỗi: } 2 \cdot 2 + 1 = \hl{5}\ \text{dòng}$$'
    say: Trường hợp ba, bước hai là ghi có bị lỗi. Có hai bước đã xong cần bù, nhật
      ký có năm dòng.
  - show: '<p>Thứ tự bù ở trường hợp ③:</p>

      $$④ \; \text{giữ hạn mức},\ \text{ghi nợ},\ \text{lỗi ghi có},\ \hl{\text{bù
      ghi nợ}},\ \hl{\text{bù giữ hạn mức}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bây giờ xem thứ tự bù ở trường hợp ba. Nhật ký là giữ hạn mức, ghi nợ, lỗi
      ghi có, rồi bù ghi nợ, rồi bù giữ hạn mức. Bước nào xong sau thì được bù trước.
  - show: '<p>Outbox: lưu xong rồi sập giữa “lưu” và “báo”.</p>

      $$⑤ \; \text{không Outbox: } \hl{0}\ \text{sự kiện};\quad \text{có Outbox: }
      \hlg{1}\ \text{sự kiện}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Cuối cùng, trường hợp sập giữa lưu và báo. Không có Outbox thì không sự kiện
      nào được phát. Có Outbox thì sự kiện vẫn nằm trong bảng và được phát, tức một
      sự kiện.
- id: chay_that
  kind: example
  title: 'Chạy thật: nhật ký SAGA và Outbox gộp lưu với báo'
  steps:
  - show: '<p><b>Saga.java (phần chính): mỗi bước lỗi lần lượt, bước bù chạy ngược</b></p><div
      class="code"><div>String[] buoc = { "giu han muc", "ghi no", "ghi co" };</div><div><span
      class="kw">for</span> (<span class="kw">int</span> loi = 0; loi &lt; 3; loi++)
      {                      <span class="cm">// bước thứ loi bị lỗi</span></div><div>    List&lt;String&gt;
      nhatKy = <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>    <span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; 3; i++) {</div><div>        <span
      class="kw">if</span> (i == loi) {</div><div>            nhatKy.add("loi " +
      buoc[i]);</div><div>            <span class="kw">for</span> (<span class="kw">int</span>
      j = i - 1; j &gt;= 0; j--) nhatKy.add("bu " + buoc[j]);   <span class="cm">//
      bù ngược chiều</span></div><div>            <span class="kw">break</span>;</div><div>        }</div><div>        nhatKy.add(buoc[i]);</div><div>    }</div><div>    System.out.println("loi
      o buoc " + loi + ": " + nhatKy);</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta mô phỏng SAGA bằng Java với ba bước là giữ hạn mức, ghi nợ, ghi có. Vòng
      ngoài cho từng bước lần lượt bị lỗi. Vòng trong chạy các bước theo thứ tự và
      ghi vào nhật ký. Đến bước lỗi, nó ghi dòng lỗi, rồi đi ngược lại, ghi từng bước
      bù cho các bước đã xong.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>loi o buoc 0: [loi
      giu han muc]</div><div>loi o buoc 1: [giu han muc, loi ghi no, bu giu han muc]</div><div>loi
      o buoc 2: [giu han muc, ghi no, loi ghi co, bu ghi no, bu giu han muc]</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khi chạy thật, lỗi ở bước đầu thì nhật ký chỉ một dòng. Lỗi ở bước hai thì
      ba dòng, và lỗi ở bước ba thì năm dòng. Số dòng là hai nhân số bước lỗi cộng
      một, đúng công thức đã suy ra, và bước bù luôn đi ngược chiều.
  - show: '<p><b>Outbox: cập nhật số dư và ghi sự kiện trong một giao dịch (sqlite)</b></p><div
      class="code"><div><span class="kw">CREATE</span> <span class="kw">TABLE</span>
      sodu (tk <span class="kw">TEXT</span> <span class="kw">PRIMARY</span> <span
      class="kw">KEY</span>, so_du <span class="kw">INTEGER</span>);</div><div><span
      class="kw">CREATE</span> <span class="kw">TABLE</span> outbox (id <span class="kw">INTEGER</span>
      <span class="kw">PRIMARY</span> <span class="kw">KEY</span>, su_kien <span class="kw">TEXT</span>,
      da_gui <span class="kw">INTEGER</span> DEFAULT 0);</div><div><span class="kw">INSERT</span>
      <span class="kw">INTO</span> sodu <span class="kw">VALUES</span> (''A'', 2000000);</div><div><span
      class="kw">COMMIT</span>;</div><div><span class="kw">BEGIN</span>;</div><div><span
      class="kw">UPDATE</span> sodu <span class="kw">SET</span> so_du = so_du - 500000
      <span class="kw">WHERE</span> tk = ''A'';</div><div><span class="kw">INSERT</span>
      <span class="kw">INTO</span> outbox (su_kien) <span class="kw">VALUES</span>
      (''lenh 42 da tru 500000'');</div><div><span class="kw">COMMIT</span>;</div><div><span
      class="kw">SELECT</span> so_du <span class="kw">FROM</span> sodu;</div><div><span
      class="kw">SELECT</span> su_kien, da_gui <span class="kw">FROM</span> outbox;</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bây giờ là Outbox, chạy thật trên cơ sở dữ liệu nhỏ. Hai bảng là số dư và
      hộp thư đi. Lệnh bắt đầu mở một giao dịch, trừ năm trăm nghìn ở số dư, ghi một
      dòng sự kiện vào hộp thư đi, rồi lệnh chốt lưu cả hai cùng lúc. Lệnh chốt đầu
      tiên chỉ để kết thúc phần dựng bảng. Hai câu cuối đọc lại số dư và hộp thư đi.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>1500000</div><div>lenh
      42 da tru 500000|0</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Khi chạy thật, số dư là một triệu năm trăm nghìn, và hộp thư đi có đúng một
      sự kiện chưa gửi, đánh dấu không. Bộ chuyển tiếp sẽ đọc dòng này, gửi sự kiện
      đi, rồi đánh dấu đã gửi.
  - show: <p><b>Cùng giao dịch đó nhưng bị huỷ giữa chừng (như sập trước khi chốt)</b></p><div
      class="code"><div><span class="kw">BEGIN</span>;</div><div><span class="kw">UPDATE</span>
      sodu <span class="kw">SET</span> so_du = so_du - 500000 <span class="kw">WHERE</span>
      tk = 'A';</div><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      outbox (su_kien) <span class="kw">VALUES</span> ('lenh 42 da tru 500000');</div><div><span
      class="kw">ROLLBACK</span>;</div><div><span class="kw">SELECT</span> so_du <span
      class="kw">FROM</span> sodu;</div><div><span class="kw">SELECT</span> <span
      class="kw">COUNT</span>(*) <span class="kw">FROM</span> outbox;</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Giờ giả sử giao dịch bị sập trước khi chốt, ta thay lệnh chốt bằng lệnh huỷ.
      Số dư và hộp thư đi được đọc lại ngay sau đó.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>2000000</div><div>0</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Khi chạy thật, số dư vẫn hai triệu và hộp thư đi không có dòng nào. Vì cả
      hai cùng nằm trong một giao dịch, nên hoặc có cả hai, hoặc không có gì, không
      bao giờ trừ tiền mà mất sự kiện.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm tay theo dòng'
  checks:
  - 2 + 1 + 2 == 5 == len(alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có')))
  - '[len(alg.bnk_saga(i, (''giữ hạn mức'', ''ghi nợ'', ''ghi có''))) for i in range(3)]
    == [1, 3, 5]'
  steps:
  - show: '<p>Đường khác: đếm tay từng dòng thay vì công thức. Với bước 2 lỗi: $2$
      dòng “xong”, $1$ dòng “lỗi”, $2$ dòng “bù”.</p>

      $$2 + 1 + 2 = \hl{5}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Kiểm bằng đường khác. Ta đếm tay từng dòng thay vì dùng công thức. Với bước
      hai lỗi, có hai dòng xong, một dòng lỗi và hai dòng bù, tổng là năm, khớp công
      thức.
  - show: <table class='t'><tr><th>bước lỗi</th><th>đã xong</th><th>dòng bù</th><th>tổng
      dòng nhật ký</th></tr><tr><td>0</td><td>0</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>3</td></tr><tr><td>2</td><td>2</td><td>2</td><td>5</td></tr></table>
    say: Bảng này tổng hợp lại ba trường hợp. Vì số dòng bù bằng số bước đã xong,
      nên bước lỗi càng muộn thì càng nhiều bước phải bù, và nhật ký càng dài.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng SAGA cho tính <b>cô
      lập</b> như giao dịch thường. Giữa các bước, người khác vẫn <b class="red">thấy
      trạng thái dở dang</b>, ví dụ tiền đã trừ mà chưa cộng.</div>
    say: Lỗi thứ nhất, của người mới. Tưởng SAGA cho tính cô lập như giao dịch thường.
      Giữa các bước, người khác vẫn thấy trạng thái dở dang, ví dụ tiền đã trừ mà
      chưa cộng.
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Bước
      bù không lũy đẳng</b>. Bước bù lỗi mạng nên được chạy lại, và hoàn tiền hai
      lần. Bước bù phải thử lại được, và ghi dấu “đã bù”.</div>
    say: Lỗi thứ hai, của người đã đi làm, là bước bù không lũy đẳng. Bước bù gặp
      lỗi mạng sẽ được chạy lại, và hoàn tiền hai lần. Bước bù phải thử lại được,
      và ghi dấu đã bù.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Ghi
      kép</b>: lưu cơ sở dữ liệu rồi gửi Kafka thành hai lệnh riêng. Sập giữa hai
      lệnh thì mất sự kiện. Gửi trước lưu sau thì có sự kiện mà không có dữ liệu.</div>'
    say: Lỗi thứ ba, cũng của người đã đi làm, là ghi kép. Lưu cơ sở dữ liệu rồi gửi
      Kafka thành hai lệnh riêng. Sập giữa hai lệnh thì mất sự kiện. Gửi trước lưu
      sau thì có sự kiện mà không có dữ liệu.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 2 * 3 + 1 == 7 == len(alg.bnk_saga(3, ['b0', 'b1', 'b2', 'b3']))
  - alg.bnk_saga(2, ['b0', 'b1', 'b2'])[-3:] == ['lỗi b2', 'bù b1', 'bù b0']
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Chuỗi
      có 4 bước (0..3), bước 3 lỗi. Nhật ký có mấy dòng?</td></tr><tr><td>2</td><td>Thứ
      tự chạy bước bù?</td></tr><tr><td>3</td><td>Quyết định: điều phối tập trung
      hay các dịch vụ tự phản ứng sự kiện?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, chuỗi có bốn bước đánh số từ không
      tới ba, bước ba lỗi, nhật ký có mấy dòng? Câu hai, bước bù chạy theo thứ tự
      nào? Câu ba, nên điều phối tập trung hay để các dịch vụ tự phản ứng theo sự
      kiện? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: $i = 3$ bước đã xong.</p>

      $$2 \cdot 3 + 1 = \hl{7}\ \text{dòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Bước ba lỗi nghĩa là ba bước đã xong. Hai nhân ba cộng một
      bằng bảy dòng.
    clear: true
  - show: '<p>Câu 2: bước nào xong sau thì được bù trước.</p>

      $$\text{bù bước 2} \to \text{bù bước 1} \to \text{bù bước 0}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Bước nào xong sau thì được bù trước, nên thứ tự bù là bước
      hai, bước một, rồi bước không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>điều
      phối tập trung</td><td>luồng rõ ràng, dễ theo dõi và gỡ lỗi</td><td>người điều
      phối thành điểm phụ thuộc</td></tr><tr><td>tự phản ứng theo sự kiện</td><td>các
      dịch vụ lỏng lẻo, dễ mở rộng</td><td>luồng khó thấy, khó gỡ lỗi khi nhiều bước</td></tr></table>
    say: Đáp án câu ba là đánh đổi. Điều phối tập trung cho luồng rõ ràng, dễ theo
      dõi, nhưng người điều phối thành điểm phụ thuộc. Tự phản ứng theo sự kiện thì
      các dịch vụ lỏng lẻo hơn, nhưng luồng khó thấy khi có nhiều bước.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: lệnh cần bù, hộp thư đi và bộ chuyển tiếp khi tải tăng'
  checks:
  - 100000 * 0.001 == 100
  - round(10_000_000 * 0.001) == 10000
  - round(1_000_000_000 * 0.001) == 1_000_000
  - 100000 * 200 == 20_000_000
  - 10_000_000 * 200 == 2_000_000_000
  - 1_000_000_000 * 200 == 200_000_000_000
  - round(100000 / 86400, 1) == 1.2
  - round(10_000_000 / 86400) == 116
  - round(1_000_000_000 / 86400) == 11574
  - -(-11574 // 1000) == 12
  steps:
  - show: <p>Giả sử $0{,}1\%$ lệnh gặp lỗi giữa chừng và cần chạy bước bù; mỗi sự
      kiện trong hộp thư đi chiếm $200$ byte; một bộ chuyển tiếp gửi $1\,000$ sự kiện
      mỗi giây <i>(số minh hoạ)</i>.</p><table class='t'><tr><th>tải</th><th>lệnh
      mỗi ngày</th><th>cần bù mỗi ngày</th><th>hộp thư đi mỗi ngày</th><th>sự kiện
      mỗi giây</th><th>bộ chuyển tiếp cần</th></tr><tr><td>×1</td><td>100 000</td><td>100</td><td>20
      MB</td><td>≈ 1,2</td><td>1</td></tr><tr><td>×100</td><td>10 000 000</td><td>10
      000</td><td>2 GB</td><td>≈ 116</td><td>1</td></tr><tr><td>×10 000</td><td>1
      000 000 000</td><td><b>1 000 000</b></td><td><b>200 GB</b></td><td>≈ 11 574</td><td><b>12</b></td></tr></table>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Giả sử một phần nghìn số lệnh gặp lỗi giữa chừng và cần chạy bước bù, mỗi
      sự kiện trong hộp thư đi chiếm hai trăm byte, một bộ chuyển tiếp gửi một nghìn
      sự kiện mỗi giây. Đây là số minh hoạ. Với một trăm nghìn lệnh mỗi ngày, có một
      trăm lệnh cần bù và hộp thư đi tăng hai mươi mê ga byte mỗi ngày. Tải tăng một
      trăm lần thì có mười nghìn lệnh cần bù và hai nghìn mê ga byte mỗi ngày. Tải
      tăng mười nghìn lần thì một triệu lệnh cần bù, hai trăm nghìn mê ga byte mỗi
      ngày, và cần mười hai bộ chuyển tiếp.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Người đối soát tay
      lệnh bị lỗi giữa chừng: 100 lệnh mỗi ngày làm được, 10 000 khó, 1 triệu không
      thể; vì vậy bước bù phải <b>tự chạy</b>. Hộp thư đi không dọn sẽ phình tới hàng
      trăm GB; một bộ chuyển tiếp duy nhất không kịp ở ×10 000.</div>

      <div class="box key"><b>Đánh đổi:</b> dọn dòng đã gửi (hoặc chia bảng theo ngày);
      chia sự kiện theo khoá cho nhiều bộ chuyển tiếp để giữ thứ tự từng tài khoản.
      Cũng phải chọn <b>điều phối</b> (một nơi ra lệnh từng bước: dễ theo dõi, nhưng
      nghẽn ở nơi đó) hay <b>phối hợp theo sự kiện</b> (không nghẽn, nhưng khó nhìn
      cả luồng).</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Giải pháp cũ là người đối soát tay những lệnh lỗi giữa chừng. Một trăm lệnh
      mỗi ngày thì làm được, mười nghìn thì khó, một triệu thì không thể, nên bước
      bù phải tự chạy. Hộp thư đi không dọn sẽ phình tới hàng trăm nghìn mê ga byte,
      và một bộ chuyển tiếp duy nhất không kịp ở tải gấp mười nghìn lần. Đánh đổi
      là dọn các dòng đã gửi hoặc chia bảng theo ngày, và chia sự kiện theo khoá cho
      nhiều bộ chuyển tiếp để giữ thứ tự từng tài khoản. Còn phải chọn giữa điều phối,
      tức một nơi ra lệnh từng bước, dễ theo dõi nhưng nghẽn ở nơi đó, và phối hợp
      theo sự kiện, không nghẽn nhưng khó nhìn cả luồng.
- id: practice
  kind: practice
  title: 'Tự làm: một giao dịch chốt, một giao dịch huỷ'
  steps:
  - show: '<p><b>Đề</b>: viết <code>outbox.sql</code> (chi tiết ở <code>de.md</code>):</p>

      <ol><li>bảng <code>sodu</code> có <code>(''B'', 3000000)</code> và bảng <code>outbox</code>;
      sau <code>INSERT</code> gõ <code>COMMIT;</code></li>

      <li>giao dịch 1 <b>chốt</b>: trừ 700 000, thêm sự kiện lệnh 77</li>

      <li>giao dịch 2 <b>huỷ</b>: trừ 900 000, thêm sự kiện lệnh 78</li>

      <li>đọc lại <code>so_du</code> và <code>outbox</code></li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 150
    say: Bây giờ tới phần bạn tự làm. Hãy viết một tệp SQL với hai bảng là số dư và
      hộp thư đi, số dư của B là ba triệu. Giao dịch thứ nhất trừ bảy trăm nghìn,
      ghi sự kiện lệnh bảy mươi bảy, rồi chốt. Giao dịch thứ hai trừ chín trăm nghìn,
      ghi sự kiện lệnh bảy mươi tám, rồi huỷ. Cuối cùng đọc lại số dư và hộp thư đi.
      Hãy dừng video, tự viết và chạy, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>2300000</div><div>lenh
      77 da tru 700000|0</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh BNK L08 outbox.sql</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi giao dịch có dạng <code>BEGIN;
      UPDATE …; INSERT INTO outbox …; COMMIT;</code> (giao dịch 2 kết thúc bằng <code>ROLLBACK;</code>).

      Đừng quên <code>COMMIT;</code> ngay sau <code>INSERT INTO sodu</code>. Lời giải
      ở <code>labs/BNK/L08/loi_giai.sql</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, mỗi giao dịch gồm lệnh bắt đầu, lệnh trừ tiền, lệnh ghi sự kiện,
      rồi lệnh chốt, riêng giao dịch thứ hai kết thúc bằng lệnh huỷ. Đừng quên chốt
      ngay sau lệnh thêm số dư ban đầu. Lời giải đầy đủ nằm trong thư mục thực hành
      của bài, chỉ mở sau khi bạn đã tự thử.
    clear: true
  lab: labs/BNK/L08
- id: recap
  kind: recap
