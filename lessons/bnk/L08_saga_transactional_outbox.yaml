- id: formula
  kind: formula
  title: 'Suy ra từng bước: đếm bước bù và chặn mất sự kiện'
  checks:
  - 2 * 2 + 1 == 5
  - all(len(alg.bnk_saga(i, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * i + 1 for
    i in range(3))
  - alg.bnk_outbox_sim('between', True) == (True, 1)
  steps:
  - show: '<p><b>Bước 1.</b> Không có giao dịch bao nhiều dịch vụ, nên mỗi bước là
      giao dịch cục bộ riêng và <b>mỗi bước cần một bước bù</b>.</p>

      <span class=''note''>Làm thử: 3 bước bù được → 3 bước bù. Thông báo đứng sau
      ghi có, là điểm không quay lại, nên lỗi thì <b>thử lại</b>, không bù.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì không có giao dịch nào bao được nhiều dịch vụ, nên mỗi bước
      là một giao dịch cục bộ riêng và mỗi bước cần một bước bù. Làm thử, ba bước
      giữ hạn mức, ghi nợ, ghi có thì cần ba bước bù. Còn thông báo đứng sau ghi có,
      là điểm không quay lại, nên nếu lỗi thì thử lại, chứ không hoàn tiền.
  - show: '<p><b>Bước 2.</b> Nếu bước thứ $i$ lỗi (đếm từ $0$), có $i$ bước đã xong
      cần bù. Nhật ký gồm $i$ bước xong, $1$ lỗi, $i$ bước bù: $2i + 1$ dòng.</p>

      <span class=''note''>Làm thử: $i = 2$ cho $2 \cdot 2 + 1 = 5$ dòng.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, vì nếu bước thứ i bị lỗi, đếm từ không, thì có i bước đã xong cần
      bù. Nên nhật ký gồm i bước xong, một dòng lỗi, và i bước bù, tức hai i cộng
      một dòng. Làm thử, i bằng hai cho hai nhân hai cộng một, bằng năm dòng.
    introduces:
    - cdot
  - show: '<p><b>Bước 3.</b> Hai việc “lưu” và “báo” ở hai nơi khác nhau có thể sập
      ở giữa. Outbox gộp hai việc thành <b>một giao dịch</b> nên không có “giữa”.</p>

      <p class="note">Bộ chuyển tiếp có thể phát trùng, nên người nhận phải khử trùng
      bằng khoá lũy đẳng: mã duy nhất mỗi việc, gặp lại thì bỏ qua, nên làm một hay
      nhiều lần cũng cho một kết quả.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, vì hai việc lưu và báo ở hai nơi khác nhau có thể sập ở giữa, nên
      Outbox gộp hai việc thành một giao dịch, và không còn khoảng giữa. Bộ chuyển
      tiếp có thể phát trùng, nên người nhận phải khử trùng bằng khoá lũy đẳng. Đó
      là mã duy nhất cho mỗi việc, gặp lại thì bỏ qua.
- id: example
  kind: example
  title: Ví dụ bằng số, từng trường hợp
  checks:
  - len(alg.bnk_saga(0, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * 0 + 1
  - alg.bnk_saga(1, ('giữ hạn mức', 'ghi nợ', 'ghi có')) == ['giữ hạn mức', 'lỗi ghi
    nợ', 'bù giữ hạn mức']
  - len(alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * 2 + 1
  - alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có')) == ['giữ hạn mức', 'ghi nợ',
    'lỗi ghi có', 'bù ghi nợ', 'bù giữ hạn mức']
  - alg.bnk_outbox_sim('between', False)[1] == 0 and alg.bnk_outbox_sim('between',
    True)[1] == 1
  steps:
  - show: '<p>Ba bước bù được, đánh số $0, 1, 2$: giữ hạn mức, ghi nợ, ghi có.</p>

      $$① \; \text{bước 0 lỗi: nhật ký} = 2 \cdot 0 + 1 = \hl{1}\ \text{dòng}$$

      '
    say: Trường hợp một, bước không lỗi, chưa có gì để bù, nhật ký có hai nhân không
      cộng một, bằng một dòng.
  - show: '$$② \; \text{bước 1 lỗi: } 2 \cdot 1 + 1 = \hl{3}\ \text{dòng: giữ hạn
      mức, lỗi ghi nợ, bù giữ hạn mức}$$'
    say: Trường hợp hai, bước một lỗi. Có một bước đã xong cần bù, nhật ký có ba dòng,
      là giữ hạn mức, lỗi ghi nợ, và bù giữ hạn mức, tức trả lại hạn mức.
  - show: '$$③ \; \text{bước 2 lỗi: } 2 \cdot 2 + 1 = \hl{5}\ \text{dòng}$$'
    say: Trường hợp ba, bước hai là ghi có bị lỗi. Có hai bước đã xong cần bù, nhật
      ký có năm dòng.
  - show: '<p>Thứ tự bù ở trường hợp ③:</p>

      $$④ \; \text{giữ hạn mức},\ \text{ghi nợ},\ \text{lỗi ghi có},\ \hl{\text{bù
      ghi nợ}},\ \hl{\text{bù giữ hạn mức}}$$

      '
    focus:
    - 1
    - 2
    say: Nhật ký là giữ hạn mức, ghi nợ, lỗi ghi có, rồi bù ghi nợ, rồi bù giữ hạn
      mức. Bước nào xong sau thì được bù trước.
  - show: '<p>Outbox: lưu xong rồi sập giữa “lưu” và “báo”.</p>

      $$⑤ \; \text{không Outbox: } \hl{0}\ \text{sự kiện};\quad \text{có Outbox: }
      \hlg{1}\ \text{sự kiện}$$

      '
    focus:
    - 1
    - 2
    say: Không có Outbox thì không sự kiện nào được phát. Có Outbox thì sự kiện vẫn
      nằm trong bảng và được phát, tức một sự kiện.
- id: chay_that
  kind: example
  title: 'Chạy thật: nhật ký SAGA và Outbox gộp lưu với báo'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      static void main(String[] args)</code></td><td>hàm chính: chương trình bắt đầu
      chạy từ đây; <code>args</code> là mảng chuỗi gõ thêm sau lệnh chạy, bài này
      không dùng</td><td><code>public static void main(String[] args)</code> — chương
      trình bắt đầu ở đây</td></tr><tr><td><code>for (int i = 0; i &lt; n; i++) {
      … }</code></td><td>vòng lặp: i bắt đầu từ 0, còn i &lt; n thì làm khối, mỗi
      vòng tăng i thêm 1</td><td><code>for (int loi = 0; loi &lt; 3; loi++)</code>
      — loi chạy 0, 1, 2, mỗi bước lần lượt bị lỗi</td></tr></table>'
    clear: true
    say: 'Hàm chính là nơi chương trình bắt đầu chạy, và tham số mảng chuỗi chứa các
      chữ gõ thêm sau lệnh chạy, bài này không dùng. Vòng lặp có ba phần trong ngoặc:
      điểm bắt đầu, điều kiện để chạy tiếp, và bước tăng sau mỗi vòng.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>buoc[i]</code></td><td><code>buoc[i]</code>: ô thứ i của mảng buoc, ô đầu là <code>buoc[0]</code></td><td><code>buoc[i]</code>
      — bước thứ i của mảng <code>buoc</code> | <code>buoc[0]</code> là <code>"giu
      han muc"</code></td></tr><tr><td><code>if (điều_kiện) { … } else { … }</code></td><td>nếu
      điều kiện đúng thì làm khối đầu, không thì làm khối sau <code>else</code></td><td><code>if
      (i == loi) { … }</code> — bước i đang bị lỗi thì ghi dòng lỗi (<code>==</code>
      — bằng nhau)</td></tr><tr><td><code>new ArrayList&lt;&gt;()</code></td><td><code>&lt;&gt;</code>
      để trống: Java tự điền kiểu theo vế trái</td><td><code>List&lt;String&gt; nhatKy
      = new ArrayList&lt;&gt;()</code> — danh sách chữ rỗng</td></tr></table>'
    clear: true
    say: Chỉ số trong ngoặc vuông chọn một ô của mảng, ô đầu có chỉ số không. Ví dụ, bước thứ i trong mảng ba bước, và ô số
      không là bước giữ hạn mức. Nếu điều kiện đúng thì làm khối thứ nhất, nếu không
      thì làm khối còn lại. Cặp ngoặc góc để trống nghĩa là Java tự điền kiểu theo
      vế trái.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>j--</code>,
      <code>j &gt;= 0</code></td><td><code>j--</code>: giảm j đi 1; <code>&gt;=</code>:
      lớn hơn hoặc bằng</td><td><code>for (int j = i - 1; j &gt;= 0; j--)</code> —
      đếm lùi từ bước i − 1 về 0</td></tr><tr><td><code>System.out.println(x)</code>,
      <code>break</code>, <code>danhSach.add(x)</code>, <code>//</code>, <code>import</code></td><td>in
      x; thoát vòng ngay; thêm x vào danh sách; chú thích; nhập lớp có sẵn</td><td><code>import
      java.util.*;</code>, <code>nhatKy.add(...)</code>, <code>System.out.println(...)</code></td></tr></table>'
    clear: true
    say: Hai dấu trừ giảm biến đi một, và dấu lớn hơn hoặc bằng so sánh hai giá trị.
      In giá trị ra màn hình, break thoát khỏi vòng lặp ngay, add thêm phần tử vào danh sách,
      hai gạch chéo mở chú thích, và dòng nhập lấy lớp có sẵn.
  - show: '<p><b>Saga.java (phần 1): khai báo ba bước và thử từng bước lỗi</b></p><div
      class="code"><div><span class="kw">import</span> java.util.*;</div><div><span
      class="kw">public</span> <span class="kw">class</span> Saga {</div><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) {</div><div>        String[] buoc = { "giu han muc", "ghi
      no", "ghi co" };</div><div>        <span class="kw">for</span> (<span class="kw">int</span>
      loi = 0; loi &lt; 3; loi++) {                      <span class="cm">// bước
      thứ loi bị lỗi</span></div><div>            List&lt;String&gt; nhatKy = <span
      class="kw">new</span> ArrayList&lt;&gt;();</div></div>'
    focus:
    - 1
    - 1
    - 2
    say: Ta mô phỏng SAGA bằng Java với ba bước là giữ hạn mức, ghi nợ, ghi có, đặt
      trong một mảng chữ. Vòng ngoài cho từng bước lần lượt bị lỗi. Mỗi lượt tạo một
      danh sách chữ rỗng làm nhật ký.
    clear: true
  - show: '<p><b>Phần 2: vòng chạy từng bước và bù ngược khi lỗi</b></p><div class="code"><div>            <span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; 3; i++) {</div><div>                <span
      class="kw">if</span> (i == loi) {</div><div>                    nhatKy.add("loi
      " + buoc[i]);</div><div>                    <span class="kw">for</span> (<span
      class="kw">int</span> j = i - 1; j &gt;= 0; j--) nhatKy.add("bu " + buoc[j]);
      <span class="cm">// bù ngược</span></div><div>                    <span class="kw">break</span>;</div><div>                }</div><div>                nhatKy.add(buoc[i]);</div><div>            }</div><div>            System.out.println("loi
      o buoc " + loi + ": " + nhatKy);</div><div>        }</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Vòng trong chạy các bước theo thứ tự. Khi tới bước lỗi thì ghi dòng lỗi, rồi
      vòng đếm lùi đi ngược về ghi từng bước bù và thoát vòng. Bước nào không lỗi thì
      ghi tên bước vào nhật ký, và cuối cùng in nhật ký.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>loi o buoc 0: [loi
      giu han muc]</div><div>loi o buoc 1: [giu han muc, loi ghi no, bu giu han muc]</div><div>loi
      o buoc 2: [giu han muc, ghi no, loi ghi co, bu ghi no, bu giu han muc]</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Khi chạy thật, lỗi ở bước 0 thì nhật ký chỉ một dòng. Lỗi ở bước 1 thì
      ba dòng, và lỗi ở bước 2 thì năm dòng. Số dòng là hai nhân số bước lỗi cộng
      một, đúng công thức đã suy ra. Nếu bỏ các dòng bù, nhật ký dừng ở dòng lỗi ghi
      có, ghi nợ vẫn còn nguyên, tức tiền đã trừ mà chưa ai nhận.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>tên
      KIỂU DEFAULT giá_trị</code></td><td>cột có giá trị mặc định: dòng mới thêm mà
      không ghi cột này thì tự mang giá trị đó</td><td><code>da_gui INTEGER DEFAULT
      0</code> — cột <code>da_gui</code> mặc định 0, tức chưa gửi</td></tr><tr><td><code>SELECT
      COUNT(*) FROM bảng;</code></td><td>đếm số dòng của bảng</td><td><code>SELECT
      COUNT(*) FROM outbox;</code> — số sự kiện trong hộp thư đi</td></tr><tr><td><code>TEXT</code>,
      <code>INTEGER</code></td><td>kiểu cột: <code>TEXT</code> chứa chữ, <code>INTEGER</code>
      chứa số nguyên</td><td><code>tk TEXT PRIMARY KEY, so_du INTEGER</code> — cột
      chữ, cột số nguyên (khoá chính: không cho hai dòng trùng)</td></tr></table>'
    clear: true
    say: Chữ mặc định sau kiểu cột nghĩa là dòng mới thêm mà không ghi cột này thì
      tự mang giá trị đó. Ví dụ, cột đã gửi mặc định không, tức sự kiện mới là chưa
      gửi. Lệnh chọn đếm cho biết số dòng hiện có của một bảng. Ví dụ, đếm sự kiện
      trong hộp thư đi. Kiểu cột chữ chứa chuỗi chữ, kiểu cột số nguyên chứa số nguyên.
      Ví dụ, cột khoá chính là cột không cho hai dòng trùng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>--
      chú thích</code></td><td>chú thích SQL: máy bỏ qua phần sau hai gạch ngang</td><td><code>--
      sap o day: …</code></td></tr><tr><td><code>BEGIN; … COMMIT;</code></td><td>mở
      giao dịch; chốt lưu mọi thay đổi bên trong cùng lúc</td><td><code>BEGIN; … COMMIT;</code>
      bao các lệnh trừ tiền và ghi sự kiện</td></tr><tr><td><code>UPDATE t SET c =
      c - 500000 WHERE tk = ''A''</code></td><td>sửa cột c của những dòng thoả điều
      kiện: trừ 500 000 ở số dư của A</td><td><code>UPDATE sodu SET so_du = so_du
      - 500000 WHERE tk = ''A''</code></td></tr></table>'
    clear: true
    say: Hai gạch ngang mở đầu một chú thích trong SQL, máy bỏ qua. Lệnh bắt đầu mở
      giao dịch, lệnh chốt lưu mọi thay đổi bên trong cùng lúc. Lệnh cập nhật sửa
      một cột của những dòng thoả điều kiện, ở đây trừ năm trăm nghìn ở số dư của
      A.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>INSERT
      INTO outbox (su_kien) VALUES (…)</code></td><td>thêm dòng chỉ ghi cột <code>su_kien</code>;
      cột còn lại lấy giá trị mặc định</td><td><code>INSERT INTO outbox (su_kien)
      VALUES ('lenh 42 da tru 500000')</code></td></tr><tr><td><code>ROLLBACK;</code></td><td>huỷ
      mọi thay đổi của giao dịch đang mở</td><td><code>ROLLBACK;</code> thay cho <code>COMMIT;</code>
      ở kịch bản huỷ</td></tr></table>
    clear: true
    say: Lệnh thêm dòng này chỉ ghi cột sự kiện, cột còn lại lấy giá trị mặc định.
      Lệnh huỷ bỏ mọi thay đổi của giao dịch đang mở.
  - show: '<p><b>Outbox: cập nhật số dư và ghi sự kiện trong một giao dịch (sqlite)</b></p><div
      class="code"><div><span class="kw">CREATE</span> <span class="kw">TABLE</span>
      sodu (tk <span class="kw">TEXT</span> <span class="kw">PRIMARY</span> <span
      class="kw">KEY</span>, so_du <span class="kw">INTEGER</span>);</div><div><span
      class="kw">CREATE</span> <span class="kw">TABLE</span> outbox (id <span class="kw">INTEGER</span>
      <span class="kw">PRIMARY</span> <span class="kw">KEY</span>, su_kien <span class="kw">TEXT</span>,
      da_gui <span class="kw">INTEGER</span> <span class="kw">DEFAULT</span> 0);</div><div><span
      class="kw">BEGIN</span>;</div><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      sodu <span class="kw">VALUES</span> (''A'', 2000000);</div><div><span class="kw">COMMIT</span>;</div><div><span
      class="kw">BEGIN</span>;</div><div><span class="kw">UPDATE</span> sodu <span
      class="kw">SET</span> so_du = so_du - 500000 <span class="kw">WHERE</span> tk
      = ''A'';</div><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      outbox (su_kien) <span class="kw">VALUES</span> (''lenh 42 da tru 500000'');</div><div><span
      class="kw">COMMIT</span>;</div><div><span class="kw">SELECT</span> so_du <span
      class="kw">FROM</span> sodu;</div><div><span class="kw">SELECT</span> su_kien,
      da_gui <span class="kw">FROM</span> outbox;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bây giờ là Outbox, chạy thật trên cơ sở dữ liệu nhỏ. Hai bảng là số dư và
      hộp thư đi. Giao dịch đầu chỉ đặt số dư ban đầu rồi chốt; ta dùng lệnh bắt đầu
      rõ ràng cho mọi giao dịch để tệp chạy giống nhau ở mọi công cụ. Giao dịch thứ
      hai trừ tiền và ghi sự kiện cùng lúc.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>1500000</div><div>lenh
      42 da tru 500000|0</div></div>
    clear: true
    say: Khi chạy thật, số dư là một triệu năm trăm nghìn, và hộp thư đi có đúng một
      sự kiện chưa gửi, đánh dấu không.
  - show: '<p><b>Ghi kép, trên bảng mới dựng lại: lưu số dư rồi sập</b></p><div class="code"><div><span
      class="kw">CREATE</span> <span class="kw">TABLE</span> sodu (tk <span class="kw">TEXT</span>
      <span class="kw">PRIMARY</span> <span class="kw">KEY</span>, so_du <span class="kw">INTEGER</span>);</div><div><span
      class="kw">CREATE</span> <span class="kw">TABLE</span> outbox (id <span class="kw">INTEGER</span>
      <span class="kw">PRIMARY</span> <span class="kw">KEY</span>, su_kien <span class="kw">TEXT</span>,
      da_gui <span class="kw">INTEGER</span> <span class="kw">DEFAULT</span> 0);</div><div><span
      class="kw">BEGIN</span>;</div><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      sodu <span class="kw">VALUES</span> (''A'', 2000000);</div><div><span class="kw">COMMIT</span>;</div><div><span
      class="kw">BEGIN</span>;</div><div><span class="kw">UPDATE</span> sodu <span
      class="kw">SET</span> so_du = so_du - 500000 <span class="kw">WHERE</span> tk
      = ''A'';</div><div><span class="kw">COMMIT</span>;</div><div><span class="cm">--
      sap o day: lenh INSERT INTO outbox khong bao gio chay</span></div><div><span
      class="kw">SELECT</span> so_du <span class="kw">FROM</span> sodu;</div><div><span
      class="kw">SELECT</span> <span class="kw">COUNT</span>(*) <span class="kw">FROM</span>
      outbox;</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Còn đây là ghi kép, không có Outbox, chạy trên hai bảng mới dựng lại từ đầu,
      số dư của A là hai triệu. Giao dịch lưu số dư xong và chốt, rồi chương trình
      sập trước khi kịp ghi sự kiện, nên lệnh ghi sự kiện không bao giờ chạy.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>1500000</div><div>0</div></div>
    clear: true
    say: Khi chạy thật, số dư đã bị trừ còn một triệu năm trăm nghìn, nhưng lệnh đếm
      cho ra không sự kiện nào trong hộp thư đi, nên không ai biết để báo tiếp.
  - show: <p><b>Cùng giao dịch đó, trên bảng mới, nhưng bị huỷ giữa chừng</b></p><div
      class="code"><div><span class="kw">CREATE</span> <span class="kw">TABLE</span>
      sodu (tk <span class="kw">TEXT</span> <span class="kw">PRIMARY</span> <span
      class="kw">KEY</span>, so_du <span class="kw">INTEGER</span>);</div><div><span
      class="kw">CREATE</span> <span class="kw">TABLE</span> outbox (id <span class="kw">INTEGER</span>
      <span class="kw">PRIMARY</span> <span class="kw">KEY</span>, su_kien <span class="kw">TEXT</span>,
      da_gui <span class="kw">INTEGER</span> <span class="kw">DEFAULT</span> 0);</div><div><span
      class="kw">BEGIN</span>;</div><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      sodu <span class="kw">VALUES</span> ('A', 2000000);</div><div><span class="kw">COMMIT</span>;</div><div><span
      class="kw">BEGIN</span>;</div><div><span class="kw">UPDATE</span> sodu <span
      class="kw">SET</span> so_du = so_du - 500000 <span class="kw">WHERE</span> tk
      = 'A';</div><div><span class="kw">INSERT</span> <span class="kw">INTO</span>
      outbox (su_kien) <span class="kw">VALUES</span> ('lenh 42 da tru 500000');</div><div><span
      class="kw">ROLLBACK</span>;</div><div><span class="kw">SELECT</span> so_du <span
      class="kw">FROM</span> sodu;</div><div><span class="kw">SELECT</span> <span
      class="kw">COUNT</span>(*) <span class="kw">FROM</span> outbox;</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Giờ cũng trên hai bảng mới, giả sử giao dịch bị sập trước khi chốt, ta thay
      lệnh chốt bằng lệnh huỷ. Số dư và số sự kiện được đọc lại ngay sau đó.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>2000000</div><div>0</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Khi chạy thật, số dư vẫn hai triệu và hộp thư đi không có dòng nào. Vì cả
      hai cùng nằm trong một giao dịch, nên hoặc có cả hai, hoặc không có gì.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm tay theo dòng'
  checks:
  - 2 + 1 + 2 == 5 == len(alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có')))
  - '[len(alg.bnk_saga(i, (''giữ hạn mức'', ''ghi nợ'', ''ghi có''))) for i in range(3)]
    == [1, 3, 5]'
  steps:
  - show: '<p>Đường khác: đếm tay từng dòng thay vì công thức. Với bước 2 lỗi: $2$
      dòng “xong”, $1$ dòng “lỗi”, $2$ dòng “bù”.</p>

      $$2 + 1 + 2 = \hl{5}$$

      '
    focus:
    - 1
    - 2
    say: Kiểm bằng đường khác, thay vì dùng công thức. Với bước hai lỗi, có hai dòng
      xong, một dòng lỗi và hai dòng bù, tổng là năm, khớp công thức.
  - show: <table class='t'><tr><th>bước lỗi</th><th>đã xong</th><th>dòng bù</th><th>tổng
      dòng nhật ký</th></tr><tr><td>0</td><td>0</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>3</td></tr><tr><td>2</td><td>2</td><td>2</td><td>5</td></tr></table>
    say: Bảng này tổng hợp lại ba trường hợp. Vì số dòng bù bằng số bước đã xong,
      nên bước lỗi càng muộn thì càng nhiều bước phải bù.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng SAGA cho tính <b>cô
      lập</b> (người khác không thấy trạng thái dở dang) như giao dịch thường. Giữa
      các bước, người khác vẫn <b class="red">thấy trạng thái dở dang</b>, ví dụ tiền
      đã trừ mà chưa cộng.</div>
    say: Lỗi thứ nhất, của người mới. Tưởng SAGA cho tính cô lập, nghĩa là người khác
      không thấy trạng thái dở dang, như giao dịch thường. Giữa các bước, người khác
      vẫn thấy trạng thái dở dang, ví dụ tiền đã trừ mà chưa cộng.
    introduces:
    - bnk_co_lap
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Bước
      bù không lũy đẳng</b>. Bước bù lỗi mạng nên được chạy lại, và hoàn tiền hai
      lần. Bước bù phải thử lại được, và ghi dấu “đã bù”.</div>
    say: Lỗi thứ hai, của người đã đi làm, là bước bù không lũy đẳng, tức chạy lại
      hai lần cho kết quả khác một lần. Bước bù gặp lỗi mạng sẽ được chạy lại, và
      hoàn tiền hai lần. Bước bù phải thử lại được, và ghi dấu đã bù.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Ghi
      kép</b>: lưu cơ sở dữ liệu rồi gửi Kafka thành hai lệnh riêng. Sập giữa hai
      lệnh thì mất sự kiện. Gửi trước lưu sau thì có sự kiện mà không có dữ liệu.</div>'
    say: Lỗi thứ ba, cũng của người đã đi làm, là ghi kép. Sập giữa hai lệnh thì mất
      sự kiện. Gửi trước lưu sau thì có sự kiện mà không có dữ liệu.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 2 * 3 + 1 == 7 == len(alg.bnk_saga(3, ['b0', 'b1', 'b2', 'b3']))
  - alg.bnk_saga(2, ['b0', 'b1', 'b2'])[-3:] == ['lỗi b2', 'bù b1', 'bù b0']
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Chuỗi
      có 4 bước (0..3), bước 3 lỗi. Nhật ký có mấy dòng?</td></tr><tr><td>2</td><td>Thứ
      tự chạy bước bù?</td></tr><tr><td>3</td><td>Chuỗi 6 bước, rẽ nhánh hoàn trả phức tạp, đội ưu tiên luồng dễ theo dõi và gỡ lỗi tập trung: chọn điều phối tập trung hay tự phản ứng sự kiện?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, chuỗi có bốn bước đánh số từ không
      tới ba, bước ba lỗi, nhật ký có mấy dòng? Câu hai, bước bù chạy theo thứ tự
      nào? Câu ba, chuỗi sáu bước có rẽ nhánh hoàn trả phức tạp và đội ưu tiên luồng
      dễ theo dõi, gỡ lỗi tập trung, chọn điều phối tập trung hay tự phản ứng theo
      sự kiện? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: $i = 3$ bước đã xong.</p>

      $$2 \cdot 3 + 1 = \hl{7}\ \text{dòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Bước ba lỗi nghĩa là ba bước đã xong. Hai nhân ba cộng một
      bằng bảy dòng.
    clear: true
  - show: '<p>Câu 2: bước nào xong sau thì được bù trước.</p>

      $$\text{bù bước 2} \to \text{bù bước 1} \to \text{bù bước 0}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Bước nào xong sau thì được bù trước, nên thứ tự bù là bước
      hai, bước một, rồi bước không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>điều
      phối tập trung</td><td>luồng rõ ràng, dễ theo dõi và gỡ lỗi</td><td>người điều
      phối thành điểm phụ thuộc</td></tr><tr><td>tự phản ứng theo sự kiện</td><td>các
      dịch vụ lỏng lẻo, dễ mở rộng</td><td>luồng khó thấy, khó gỡ lỗi khi nhiều bước</td></tr></table>
    say: Đáp án câu ba. Điều phối tập trung cho luồng rõ ràng, dễ theo dõi, nhưng
      người điều phối thành điểm phụ thuộc. Tự phản ứng theo sự kiện thì các dịch
      vụ lỏng lẻo hơn, nhưng luồng khó thấy khi có nhiều bước.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: lệnh cần bù, hộp thư đi và bộ chuyển tiếp khi tải tăng'
  checks:
  - 100000 * 0.001 == 100
  - round(10_000_000 * 0.001) == 10000
  - round(1_000_000_000 * 0.001) == 1_000_000
  - 100000 * 200 == 20_000_000
  - 10_000_000 * 200 == 2_000_000_000
  - 1_000_000_000 * 200 == 200_000_000_000
  - round(100000 / 86400, 1) == 1.2
  - round(10_000_000 / 86400) == 116
  - round(1_000_000_000 / 86400) == 11574
  - -(-11574 // 1000) == 12
  steps:
  - show: <p>Giả sử $0{,}1\%$ lệnh gặp lỗi giữa chừng và cần chạy bước bù; mỗi sự
      kiện trong hộp thư đi chiếm $200$ byte; một bộ chuyển tiếp gửi $1\,000$ sự kiện
      mỗi giây <i>(số minh hoạ)</i>. Sự kiện mỗi giây = lệnh mỗi ngày ÷ 86 400 giây;
      bộ chuyển tiếp = sự kiện mỗi giây ÷ 1 000, làm tròn lên (11 574 thành 12), tính
      theo tải trung bình, chưa tính đỉnh tải; 1 GB ≈ 1000 MB.</p><table class='t'><tr><th>tải</th><th>lệnh
      mỗi ngày</th><th>cần bù mỗi ngày</th><th>hộp thư đi mỗi ngày</th><th>sự kiện
      mỗi giây</th><th>bộ chuyển tiếp cần</th></tr><tr><td><span style="white-space:nowrap">×1</span></td><td>100
      000</td><td>100</td><td>20 MB</td><td>≈ 1,2</td><td>1</td></tr><tr><td><span
      style="white-space:nowrap">×100</span></td><td>10 000 000</td><td>10 000</td><td>2
      GB</td><td>≈ 116</td><td>1</td></tr><tr><td><span style="white-space:nowrap">×10
      000</span></td><td>1 000 000 000</td><td><b>1 000 000</b></td><td><b>200 GB</b></td><td>≈
      11 574</td><td><b>12</b></td></tr></table>
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giả sử một phần nghìn số lệnh gặp lỗi giữa chừng và cần chạy bước bù, mỗi
      sự kiện trong hộp thư đi chiếm hai trăm byte, một bộ chuyển tiếp gửi một nghìn
      sự kiện mỗi giây. Đây là số minh hoạ. Với một trăm nghìn lệnh mỗi ngày, có một
      trăm lệnh cần bù và hộp thư đi tăng hai mươi mê ga byte mỗi ngày. Tải tăng một
      trăm lần thì có mười nghìn lệnh cần bù và hộp thư đi tăng hai gi ga byte mỗi ngày. Tải
      tăng mười nghìn lần thì một triệu lệnh cần bù, hai trăm gi ga byte mỗi
      ngày. Số sự kiện mỗi giây là số lệnh mỗi ngày chia tám mươi sáu nghìn bốn trăm
      giây, nên cần mười hai bộ chuyển tiếp sau khi làm tròn lên. Đó là tải trung
      bình, chưa tính đỉnh tải.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Người đối soát tay
      lệnh bị lỗi giữa chừng: 100 lệnh mỗi ngày làm được, 10 000 khó, 1 triệu không
      thể; vì vậy bước bù phải <b>tự chạy</b>. Hộp thư đi không dọn sẽ phình tới hàng
      trăm GB; một bộ chuyển tiếp duy nhất không kịp ở ×10 000.</div>

      <div class="box key"><b>Đánh đổi:</b> dọn hộp thư đi theo ngày và chia theo khoá
      cho nhiều bộ chuyển tiếp; chọn <b>điều phối tập trung</b> khi chuỗi nhiều bước
      hoặc rẽ nhánh phức tạp để nhìn rõ một nơi, còn <b>tự phản ứng sự kiện</b> khi chỉ
      2–3 bước ít phụ thuộc, tải rất cao muốn bỏ điểm nghẽn trung tâm.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Một trăm lệnh mỗi ngày làm được, mười nghìn thì khó, một triệu bất khả, nên
      phải bù tự động. Hộp thư đi không dọn sẽ phình hàng trăm GB, và một bộ chuyển
      tiếp không kịp ở tải gấp mười nghìn lần. Đánh đổi là dọn theo ngày, chia sự kiện
      theo khoá, và chọn điều phối tập trung khi chuỗi rẽ nhánh phức tạp. Còn tự phản ứng
      dùng khi hai ba bước tải cao cần bỏ nút nghẽn trung tâm.
- id: practice
  kind: practice
  title: 'Tự làm: một giao dịch chốt, một giao dịch huỷ'
  steps:
  - show: '<p><b>Đề</b>: viết <code>outbox.sql</code> (chi tiết ở <code>de.md</code>):</p>

      <ol><li>bảng <code>sodu</code> có <code>(''B'', 3000000)</code> và bảng <code>outbox</code>;
      đặt số dư trong <code>BEGIN; … COMMIT;</code></li>

      <li>giao dịch 1 <b>chốt</b>: trừ 700 000, thêm sự kiện lệnh 77</li>

      <li>giao dịch 2 <b>huỷ</b>: trừ 900 000, thêm sự kiện lệnh 78</li>

      <li>đọc lại <code>so_du</code> và <code>outbox</code></li></ol>

      <p class="note">Chạy tệp: <code>python labs/sqlrun.py outbox.sql</code>, hoặc
      <code>sqlite3 :memory: &lt; outbox.sql</code> nếu máy có sqlite3.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 150
    say: Bây giờ tới phần bạn tự làm. Hãy viết một tệp SQL với hai bảng là số dư và
      hộp thư đi, số dư của B là ba triệu. Giao dịch thứ nhất trừ bảy trăm nghìn,
      ghi sự kiện lệnh bảy mươi bảy, rồi chốt. Giao dịch thứ hai trừ chín trăm nghìn,
      ghi sự kiện lệnh bảy mươi tám, rồi huỷ. Cuối cùng đọc lại số dư và hộp thư đi.
      Hãy dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>2300000</div><div>lenh
      77 da tru 700000|0</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh BNK L08 outbox.sql</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi giao dịch có dạng <code>BEGIN;
      UPDATE …; INSERT INTO outbox …; COMMIT;</code> (giao dịch 2 kết thúc bằng <code>ROLLBACK;</code>).

      Cả lần đặt số dư đầu cũng nằm trong <code>BEGIN; … COMMIT;</code>. Lời giải
      ở <code>labs/BNK/L08/loi_giai.sql</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, mỗi giao dịch gồm lệnh bắt đầu, lệnh trừ tiền, lệnh ghi sự kiện,
      rồi lệnh chốt, riêng giao dịch thứ hai kết thúc bằng lệnh huỷ. Lời giải đầy
      đủ nằm trong thư mục thực hành của bài, chỉ mở sau khi bạn đã tự thử.
    clear: true
