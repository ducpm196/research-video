source: 'curriculum/bnk.yaml L08; audit/bnk/verify_bnk.py L08; audit/review/screen_code/BNK.yaml
  (SAGA mô phỏng bằng Java 21; Outbox chạy thật trên sqlite 3.49: một giao dịch ghi
  số dư và sự kiện, ROLLBACK huỷ cả hai); Garcia-Molina & Salem, Sagas (1987); SQLite:
  COMMIT khi không có giao dịch báo lỗi (cannot commit - no transaction is active),
  nên mọi giao dịch dùng BEGIN rõ ràng; Richardson, Microservices Patterns (Transactional
  Outbox; điều phối và phối hợp theo sự kiện)'
