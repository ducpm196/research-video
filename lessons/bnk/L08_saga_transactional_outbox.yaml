scenes:
- id: hook
  kind: hook
  title: Vì sao tiền bị trừ mà bên kia chưa nhận?
  steps:
  - show: '<p>Chuyển tiền gồm nhiều việc ở nhiều dịch vụ: <b>giữ hạn mức</b>, <b>ghi
      nợ</b>, <b>ghi có</b>, rồi <b>thông báo</b>. Mỗi dịch vụ có cơ sở dữ liệu riêng,
      không có giao dịch chung bao tất cả.</p>

      <div class="box key">Nếu ghi có lỗi sau khi ghi nợ đã xong, tiền của khách <b>đã
      bị trừ</b> mà chưa ai nhận.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, chuyển tiền gồm nhiều việc ở nhiều dịch vụ khác nhau, là giữ hạn
      mức, ghi nợ, ghi có, rồi thông báo. Mỗi dịch vụ có cơ sở dữ liệu riêng, nên
      không có giao dịch chung bao tất cả. Nếu ghi có lỗi sau khi ghi nợ đã xong,
      tiền của khách đã bị trừ mà chưa ai nhận.
  - show: <table class='t'><tr><th>tình huống</th><th>kết quả mô phỏng</th></tr><tr><td>ghi
      có lỗi, không bù</td><td>tiền mất dấu</td></tr><tr><td>ghi có lỗi, chạy bước
      bù</td><td>ghi nợ được hoàn lại</td></tr><tr><td>lưu xong rồi sập trước khi
      báo, không Outbox</td><td>0 sự kiện được phát</td></tr><tr><td>có Outbox</td><td>1
      sự kiện được phát</td></tr></table>
    say: Bảng này là kết quả mô phỏng ở cuối bài. Ghi có lỗi mà không bù thì tiền
      mất dấu. Có bước bù thì ghi nợ được hoàn lại. Lưu xong rồi sập trước khi báo
      thì không có sự kiện nào được phát, còn có Outbox thì sự kiện vẫn được phát.
- id: prereq
  kind: prereq
  title: 'Trước hết: những điều cần hiểu'
  checks:
  - 500000 - 500000 == 0
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Giữ hạn mức</td><td>giữ chỗ trong số tiền khách còn được chuyển trong ngày</td><td>hạn
      mức ngày còn 20 triệu, giữ 500 000</td></tr><tr><td>② Ghi nợ / ghi có</td><td>ghi
      nợ: trừ tiền ở tài khoản người gửi; ghi có: cộng tiền vào tài khoản người nhận</td><td>A
      −500 000, B +500 000</td></tr><tr><td>③ Sự kiện</td><td>thông điệp báo một việc
      đã xảy ra, gửi qua hệ thống chuyển thông điệp như Kafka</td><td>“lệnh 42 đã
      chuyển xong”</td></tr></table>'
    say: Trước hết ta cần hiểu vài điều. Giữ hạn mức là giữ chỗ trong số tiền khách
      còn được chuyển trong ngày. Ghi nợ là trừ tiền ở tài khoản người gửi, còn ghi
      có là cộng tiền vào tài khoản người nhận. Sự kiện là một thông điệp báo một
      việc đã xảy ra, được gửi qua một hệ thống chuyển thông điệp như Kafka, ví dụ
      lệnh bốn mươi hai đã chuyển xong.
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Giao dịch cục bộ</td><td>tất cả hoặc không gì cả, nhưng chỉ trong một cơ sở
      dữ liệu</td><td>trừ và cộng trong cùng một bảng</td></tr><tr><td>⑤ Dịch vụ độc
      lập</td><td>một chương trình chạy riêng, nhận yêu cầu qua mạng, sở hữu dữ liệu
      riêng và có thể lỗi riêng</td><td>dịch vụ ghi nợ, dịch vụ ghi có</td></tr><tr><td>⑥
      Hành động bù</td><td>việc làm ngược lại để huỷ tác dụng của một việc đã xong</td><td>hoàn
      lại tiền đã trừ</td></tr></table>
    clear: true
    say: Giao dịch cục bộ bảo đảm tất cả hoặc không gì cả, nhưng chỉ trong một cơ
      sở dữ liệu. Dịch vụ độc lập là một chương trình chạy riêng, nhận yêu cầu qua
      mạng, sở hữu dữ liệu riêng và có thể lỗi riêng. Hành động bù là việc làm ngược
      lại để huỷ tác dụng của một việc đã xong, ví dụ hoàn lại tiền đã trừ.
  - show: $$+500\,000 - 500\,000 = 0$$
    say: Một ví dụ cho hành động bù. Trừ năm trăm nghìn rồi hoàn lại năm trăm nghìn,
      tổng bằng không, như chưa từng trừ.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>SAGA</td><td>chuỗi
      giao dịch cục bộ; mỗi bước có bước bù để quay lui</td></tr><tr><td>compensation
      (bù)</td><td>bước làm ngược lại cho một bước đã xong</td></tr><tr><td>orchestration
      / choreography</td><td>một người điều phối gọi từng bước / các dịch vụ tự phản
      ứng với sự kiện</td></tr><tr><td>Transactional Outbox</td><td>ghi dữ liệu và
      sự kiện vào cùng một giao dịch, rồi một bộ chuyển tiếp phát sự kiện</td></tr><tr><td>relay
      (bộ chuyển tiếp)</td><td>chương trình chạy nền đọc bảng Outbox rồi gửi sang
      Kafka</td></tr></table>
    say: Bảng này giải mã năm từ. SAGA là chuỗi giao dịch cục bộ, mỗi bước có bước
      bù để quay lui. Bù là việc làm ngược lại cho một bước đã xong. Điều phối là
      một người gọi từng bước, còn phối hợp theo sự kiện là các dịch vụ tự phản ứng.
      Outbox là ghi dữ liệu và sự kiện vào cùng một giao dịch, rồi bộ chuyển tiếp,
      tức một chương trình chạy nền đọc bảng Outbox, gửi sự kiện sang Kafka.
