- id: formula
  kind: formula
  title: 'Suy ra từng bước: đếm bước bù và chặn mất sự kiện'
  checks:
  - 2 * 2 + 1 == 5
  - all(len(alg.bnk_saga(i, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * i + 1 for
    i in range(3))
  - alg.bnk_outbox_sim('between', True) == (True, 1)
  steps:
  - show: '<p><b>Bước 1.</b> Không có giao dịch bao nhiều dịch vụ, nên mỗi bước là
      giao dịch cục bộ riêng và <b>mỗi bước cần một bước bù</b>.</p>

      <span class=''note''>Làm thử: 3 bước bù được → 3 bước bù. Thông báo đứng sau
      ghi có, là điểm không quay lại, nên lỗi thì <b>thử lại</b>, không bù.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì không có giao dịch nào bao được nhiều dịch vụ, nên mỗi bước
      là một giao dịch cục bộ riêng và mỗi bước cần một bước bù. Làm thử, ba bước
      giữ hạn mức, ghi nợ, ghi có thì cần ba bước bù. Còn thông báo đứng sau ghi có,
      là điểm không quay lại, nên nếu lỗi thì thử lại, chứ không hoàn tiền.
  - show: '<p><b>Bước 2.</b> Nếu bước thứ $i$ lỗi (đếm từ $0$), có $i$ bước đã xong
      cần bù. Nhật ký gồm $i$ bước xong, $1$ lỗi, $i$ bước bù: $2i + 1$ dòng.</p>

      <span class=''note''>Làm thử: $i = 2$ cho $2 \cdot 2 + 1 = 5$ dòng.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, vì nếu bước thứ i bị lỗi, đếm từ không, thì có i bước đã xong cần
      bù. Nên nhật ký gồm i bước xong, một dòng lỗi, và i bước bù, tức hai i cộng
      một dòng. Làm thử, i bằng hai cho hai nhân hai cộng một, bằng năm dòng.
    introduces:
    - cdot
  - show: '<p><b>Bước 3.</b> Hai việc “lưu” và “báo” ở hai nơi khác nhau có thể sập
      ở giữa. Outbox gộp hai việc thành <b>một giao dịch</b> nên không có “giữa”.</p>

      <span class=''note''>Bộ chuyển tiếp có thể phát trùng, nên người nhận phải khử
      trùng (khoá lũy đẳng).</span>

      '
    focus:
    - 1
    - 2
    say: Bước ba, vì hai việc lưu và báo ở hai nơi khác nhau có thể sập ở giữa, nên
      Outbox gộp hai việc thành một giao dịch, và không còn khoảng giữa. Bộ chuyển
      tiếp có thể phát trùng, nên người nhận phải khử trùng.
- id: example
  kind: example
  title: Ví dụ bằng số, từng trường hợp
  checks:
  - len(alg.bnk_saga(0, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * 0 + 1
  - alg.bnk_saga(1, ('giữ hạn mức', 'ghi nợ', 'ghi có')) == ['giữ hạn mức', 'lỗi ghi
    nợ', 'bù giữ hạn mức']
  - len(alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có'))) == 2 * 2 + 1
  - alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có')) == ['giữ hạn mức', 'ghi nợ',
    'lỗi ghi có', 'bù ghi nợ', 'bù giữ hạn mức']
  - alg.bnk_outbox_sim('between', False)[1] == 0 and alg.bnk_outbox_sim('between',
    True)[1] == 1
  steps:
  - show: '<p>Ba bước bù được, đánh số $0, 1, 2$: giữ hạn mức, ghi nợ, ghi có.</p>

      $$① \; \text{bước 0 lỗi: nhật ký} = 2 \cdot 0 + 1 = \hl{1}\ \text{dòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta xét ba trường hợp lỗi. Ba bước đánh số từ không, là giữ hạn mức, ghi nợ,
      ghi có. Trường hợp một, bước không lỗi, chưa có gì để bù, nhật ký có hai nhân
      không cộng một, bằng một dòng.
  - show: '$$② \; \text{bước 1 lỗi: } 2 \cdot 1 + 1 = \hl{3}\ \text{dòng: giữ hạn
      mức, lỗi ghi nợ, bù giữ hạn mức}$$'
    say: Trường hợp hai, bước một lỗi. Có một bước đã xong cần bù, nhật ký có ba dòng,
      là giữ hạn mức, lỗi ghi nợ, và bù giữ hạn mức, tức trả lại hạn mức.
  - show: '$$③ \; \text{bước 2 lỗi: } 2 \cdot 2 + 1 = \hl{5}\ \text{dòng}$$'
    say: Trường hợp ba, bước hai là ghi có bị lỗi. Có hai bước đã xong cần bù, nhật
      ký có năm dòng.
  - show: '<p>Thứ tự bù ở trường hợp ③:</p>

      $$④ \; \text{giữ hạn mức},\ \text{ghi nợ},\ \text{lỗi ghi có},\ \hl{\text{bù
      ghi nợ}},\ \hl{\text{bù giữ hạn mức}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bây giờ xem thứ tự bù ở trường hợp ba. Nhật ký là giữ hạn mức, ghi nợ, lỗi
      ghi có, rồi bù ghi nợ, rồi bù giữ hạn mức. Bước nào xong sau thì được bù trước.
  - show: '<p>Outbox: lưu xong rồi sập giữa “lưu” và “báo”.</p>

      $$⑤ \; \text{không Outbox: } \hl{0}\ \text{sự kiện};\quad \text{có Outbox: }
      \hlg{1}\ \text{sự kiện}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Cuối cùng, trường hợp sập giữa lưu và báo. Không có Outbox thì không sự kiện
      nào được phát. Có Outbox thì sự kiện vẫn nằm trong bảng và được phát, tức một
      sự kiện.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm tay theo dòng'
  checks:
  - 2 + 1 + 2 == 5 == len(alg.bnk_saga(2, ('giữ hạn mức', 'ghi nợ', 'ghi có')))
  - '[len(alg.bnk_saga(i, (''giữ hạn mức'', ''ghi nợ'', ''ghi có''))) for i in range(3)]
    == [1, 3, 5]'
  steps:
  - show: '<p>Đường khác: đếm tay từng dòng thay vì công thức. Với bước 2 lỗi: $2$
      dòng “xong”, $1$ dòng “lỗi”, $2$ dòng “bù”.</p>

      $$2 + 1 + 2 = \hl{5}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Kiểm bằng đường khác. Ta đếm tay từng dòng thay vì dùng công thức. Với bước
      hai lỗi, có hai dòng xong, một dòng lỗi và hai dòng bù, tổng là năm, khớp công
      thức.
  - show: <table class='t'><tr><th>bước lỗi</th><th>đã xong</th><th>dòng bù</th><th>tổng
      dòng nhật ký</th></tr><tr><td>0</td><td>0</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>3</td></tr><tr><td>2</td><td>2</td><td>2</td><td>5</td></tr></table>
    say: Bảng này tổng hợp lại ba trường hợp. Vì số dòng bù bằng số bước đã xong,
      nên bước lỗi càng muộn thì càng nhiều bước phải bù, và nhật ký càng dài.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng SAGA cho tính <b>cô
      lập</b> như giao dịch thường. Giữa các bước, người khác vẫn <b class="red">thấy
      trạng thái dở dang</b>, ví dụ tiền đã trừ mà chưa cộng.</div>
    say: Lỗi thứ nhất, của người mới. Tưởng SAGA cho tính cô lập như giao dịch thường.
      Giữa các bước, người khác vẫn thấy trạng thái dở dang, ví dụ tiền đã trừ mà
      chưa cộng.
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Bước
      bù không lũy đẳng</b>. Bước bù lỗi mạng nên được chạy lại, và hoàn tiền hai
      lần. Bước bù phải thử lại được, và ghi dấu “đã bù”.</div>
    say: Lỗi thứ hai, của người đã đi làm, là bước bù không lũy đẳng. Bước bù gặp
      lỗi mạng sẽ được chạy lại, và hoàn tiền hai lần. Bước bù phải thử lại được,
      và ghi dấu đã bù.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Ghi
      kép</b>: lưu cơ sở dữ liệu rồi gửi Kafka thành hai lệnh riêng. Sập giữa hai
      lệnh thì mất sự kiện. Gửi trước lưu sau thì có sự kiện mà không có dữ liệu.</div>'
    say: Lỗi thứ ba, cũng của người đã đi làm, là ghi kép. Lưu cơ sở dữ liệu rồi gửi
      Kafka thành hai lệnh riêng. Sập giữa hai lệnh thì mất sự kiện. Gửi trước lưu
      sau thì có sự kiện mà không có dữ liệu.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 2 * 3 + 1 == 7 == len(alg.bnk_saga(3, ['b0', 'b1', 'b2', 'b3']))
  - alg.bnk_saga(2, ['b0', 'b1', 'b2'])[-3:] == ['lỗi b2', 'bù b1', 'bù b0']
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Chuỗi
      có 4 bước (0..3), bước 3 lỗi. Nhật ký có mấy dòng?</td></tr><tr><td>2</td><td>Thứ
      tự chạy bước bù?</td></tr><tr><td>3</td><td>Quyết định: điều phối tập trung
      hay các dịch vụ tự phản ứng sự kiện?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, chuỗi có bốn bước đánh số từ không
      tới ba, bước ba lỗi, nhật ký có mấy dòng? Câu hai, bước bù chạy theo thứ tự
      nào? Câu ba, nên điều phối tập trung hay để các dịch vụ tự phản ứng theo sự
      kiện? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: $i = 3$ bước đã xong.</p>

      $$2 \cdot 3 + 1 = \hl{7}\ \text{dòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Bước ba lỗi nghĩa là ba bước đã xong. Hai nhân ba cộng một
      bằng bảy dòng.
    clear: true
  - show: '<p>Câu 2: bước nào xong sau thì được bù trước.</p>

      $$\text{bù bước 2} \to \text{bù bước 1} \to \text{bù bước 0}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Bước nào xong sau thì được bù trước, nên thứ tự bù là bước
      hai, bước một, rồi bước không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>điều
      phối tập trung</td><td>luồng rõ ràng, dễ theo dõi và gỡ lỗi</td><td>người điều
      phối thành điểm phụ thuộc</td></tr><tr><td>tự phản ứng theo sự kiện</td><td>các
      dịch vụ lỏng lẻo, dễ mở rộng</td><td>luồng khó thấy, khó gỡ lỗi khi nhiều bước</td></tr></table>
    say: Đáp án câu ba là đánh đổi. Điều phối tập trung cho luồng rõ ràng, dễ theo
      dõi, nhưng người điều phối thành điểm phụ thuộc. Tự phản ứng theo sự kiện thì
      các dịch vụ lỏng lẻo hơn, nhưng luồng khó thấy khi có nhiều bước.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>không có giao dịch chung</span><span
      class='a'>→</span><span class='n'>chuỗi bước cục bộ</span><span class='a'>→</span><span
      class='n'>mỗi bước có bước bù</span><span class='a'>→</span><span class='n'>Outbox
      gộp lưu và báo</span></div>
    say: Tổng kết chuỗi logic. Không có giao dịch chung, nên ta dùng chuỗi bước cục
      bộ. Mỗi bước có bước bù. Và Outbox gộp việc lưu với việc báo vào một giao dịch.
  - show: <div class='box key'><b>Tư duy:</b> trong hệ phân tán, đừng hỏi “làm sao
      để không lỗi”. Hãy hỏi <b>“khi lỗi giữa chừng, làm sao quay về trạng thái nhất
      quán?”</b></div>
    say: Điều cần mang theo. Trong hệ phân tán, đừng hỏi làm sao để không lỗi. Hãy
      hỏi, khi lỗi giữa chừng, làm sao quay về trạng thái nhất quán.
