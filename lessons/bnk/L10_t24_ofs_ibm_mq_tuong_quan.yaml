- id: formula
  kind: formula
  title: 'Suy ra từng bước: ghép đúng và xử lý khi hết giờ chờ'
  checks:
  - math.factorial(5) == 120
  - alg.bnk_reply_match([2, 0, 1, 4, 3]) == (0, 5)
  - alg.bnk_unknown_outcome(True, False) == 2
  steps:
  - show: '<p><b>Bước 1.</b> Lõi xử lý song song, nên thứ tự phản hồi <b>có thể không</b>
      theo thứ tự gửi. $5$ phản hồi có thể về theo $120$ thứ tự.</p>

      <span class=''note''>Làm thử: chỉ $1$ thứ tự trong $120$ là đúng thứ tự gửi.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì lõi xử lý song song, nên thứ tự phản hồi có thể không theo thứ
      tự gửi. Năm phản hồi có thể về theo một trăm hai mươi thứ tự. Làm thử, chỉ một
      thứ tự trong số đó trùng đúng thứ tự gửi.
  - show: '<p><b>Bước 2.</b> Mỗi phản hồi mang <b>mã tương quan</b> bằng mã thông
      điệp của lệnh. Bên gửi giữ bảng “mã → lệnh đang chờ” rồi tra theo mã.</p>

      <span class=''note''>Làm thử: mọi phản hồi đều tìm ra lệnh của mình → $5$ trên
      $5$.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì mỗi phản hồi mang mã tương quan bằng mã thông điệp của lệnh,
      nên bên gửi giữ một bảng mã và lệnh đang chờ, rồi tra theo mã. Làm thử, mọi
      phản hồi đều tìm ra lệnh của mình, năm trên năm.
  - show: '<p><b>Bước 3.</b> Hết giờ chờ chỉ cho biết chưa có phản hồi, không cho
      biết lõi đã hạch toán chưa. <b>Truy vấn trạng thái trước</b>, rồi mới quyết
      định thử lại.</p>

      <span class=''note''>Làm thử: đã hạch toán mà gửi lại ngay → ghi nợ $2$ lần.</span>

      <p>Lưu ý: “chưa thấy” chưa chắc chắn, vì lệnh gốc có thể còn trong hàng đợi.
      Gửi lại phải dùng <b>cùng mã tham chiếu</b> để lõi từ chối trùng, hoặc đặt hạn
      sống (Expiry) cho bản tin.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Bước ba, vì hết giờ chờ chỉ cho biết chưa có phản hồi, chứ không cho biết
      lõi đã hạch toán chưa, nên ta truy vấn trạng thái trước, rồi mới quyết định
      thử lại. Làm thử, nếu đã hạch toán mà gửi lại ngay, khách bị ghi nợ hai lần.
      Lưu ý, kết quả chưa thấy cũng chưa chắc chắn, vì lệnh gốc có thể còn nằm trong
      hàng đợi. Vì vậy gửi lại phải dùng cùng mã tham chiếu để lõi từ chối trùng,
      hoặc đặt hạn sống cho bản tin.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - alg.bnk_reply_match([2, 0, 1, 4, 3])[0] == 0 and all(r != k for k, r in enumerate([2,
    0, 1, 4, 3]))
  - alg.bnk_reply_match([2, 0, 1, 4, 3])[1] == 5
  - 1 + 1 == alg.bnk_unknown_outcome(True, False)
  - alg.bnk_unknown_outcome(True, True) == 1
  steps:
  - show: '<p>Năm lệnh mã $0..4$. Phản hồi về theo thứ tự $2, 0, 1, 4, 3$.</p>

      $$① \; \text{ghép theo thứ tự đến: } 0 \text{ trên } 5\ \text{đúng}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta tính hai trường hợp. Năm lệnh có mã từ không tới bốn. Phản hồi về theo
      thứ tự hai, không, một, bốn, ba. Phép tính thứ nhất, ghép theo thứ tự đến thì
      không phản hồi nào đúng.
  - show: '<p>Vì sao $0$? Vị trí về thứ $k$ chứa mã $2, 0, 1, 4, 3$, và <b>không vị
      trí nào trùng mã của nó</b> ($2 \ne 0$, $0 \ne 1$, $1 \ne 2$, $4 \ne 3$, $3
      \ne 4$).</p>

      $$② \; \text{số vị trí trùng} = \hl{0}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Phép tính thứ hai, vì sao là không. Vị trí thứ nhất chứa hai, khác không.
      Vị trí thứ hai chứa không, khác một. Cứ thế, không vị trí nào trùng mã của nó.
      Số vị trí trùng là không.
  - show: '$$③ \; \text{ghép theo mã tương quan: } \hlg{5} \text{ trên } 5\ \text{đúng}$$'
    say: Phép tính thứ ba, ghép theo mã tương quan thì cả năm đều đúng, vì mỗi phản
      hồi tự mang mã của lệnh.
  - show: '<p>Hết giờ chờ, lõi <b>đã</b> hạch toán, gửi lại không truy vấn.</p>

      $$④ \; 1 + 1 = \hl{2}\ \text{lần ghi nợ}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ tư, hết giờ chờ, nhưng lõi đã hạch toán, và ta gửi lại mà không
      truy vấn. Số lần ghi nợ là một cộng một, bằng hai.
  - show: '<p>Cùng tình huống nhưng <b>truy vấn trạng thái trước</b>: thấy đã hạch
      toán nên không gửi lại.</p>

      $$⑤ \; \text{số lần ghi nợ} = \hlg{1}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ năm, cùng tình huống nhưng truy vấn trạng thái trước. Thấy
      đã hạch toán nên không gửi lại, số lần ghi nợ là một.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm các thứ tự không trùng'
  checks:
  - sum(1 for p in __import__('itertools').permutations(range(5)) if all(p[i] != i
    for i in range(5))) == 44
  - round(44 / 120 * 100) == 37
  - '[alg.bnk_unknown_outcome(a, b) for a, b in ((True, False), (True, True), (False,
    True), (False, False))] == [2, 1, 1, 1]'
  steps:
  - show: '<p>Đường khác: vét cạn $120$ thứ tự, đếm những thứ tự mà <b>không</b> phản
      hồi nào về đúng vị trí. Đáp số là $44$, và thứ tự $2, 0, 1, 4, 3$ nằm trong
      $44$ đó.</p>

      $$\text{44 trên 120} \approx \hl{37\%}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Kiểm bằng đường khác. Ta vét cạn một trăm hai mươi thứ tự, đếm những thứ
      tự mà không phản hồi nào về đúng vị trí. Có bốn mươi bốn thứ tự như vậy, và
      thứ tự của ta nằm trong đó. Bốn mươi bốn trên một trăm hai mươi là khoảng ba
      mươi bảy phần trăm.
  - show: <table class='t'><tr><th>tình huống</th><th>đã hạch toán?</th><th>truy vấn
      trước?</th><th>số lần ghi nợ</th></tr><tr><td>A</td><td>có</td><td>không</td><td>2
      (sai)</td></tr><tr><td>B</td><td>có</td><td>có</td><td>1</td></tr><tr><td>C</td><td>chưa</td><td>có</td><td>1
      (gửi lại cùng mã tham chiếu)</td></tr><tr><td>D</td><td>chưa</td><td>không</td><td>1</td></tr></table>
    say: Bảng này tổng hợp bốn tình huống. Chỉ tình huống A gặp lỗi ghi nợ hai lần.
      Vì truy vấn trước cho ta biết đã hạch toán chưa, nên tình huống B và C đều đúng
      một lần. Ở tình huống C, lần gửi lại mang cùng mã tham chiếu, để lõi từ chối
      nếu lệnh gốc tới muộn.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Giả định phản hồi về <b>đúng
      thứ tự gửi</b>. Khi tải nhẹ có thể đúng, khi tải cao thì sai, nên lỗi chỉ hiện
      lúc cao điểm.</div>
    say: Lỗi thứ nhất, của người mới. Giả định phản hồi về đúng thứ tự gửi. Khi tải
      nhẹ có thể đúng, khi tải cao thì sai, nên lỗi chỉ hiện lúc cao điểm.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Hết
      giờ chờ rồi gửi lại ngay</b>. Lõi có thể đã hạch toán, nên khách bị ghi nợ hai
      lần.

      <br><span class="note">Cách chữa: truy vấn trạng thái bằng mã tham chiếu của
      lệnh trước khi gửi lại, và gắn khoá lũy đẳng vào lệnh.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là hết giờ chờ rồi gửi lại ngay. Lõi có
      thể đã hạch toán, nên khách bị ghi nợ hai lần. Cách chữa là truy vấn trạng thái
      bằng mã tham chiếu của lệnh trước khi gửi lại, và gắn khoá lũy đẳng vào lệnh.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nhiều bản của dịch
      vụ cùng đọc <b>một hàng đợi phản hồi</b>, nên bản này lấy nhầm phản hồi của
      bản kia.

      Mỗi bản cần hàng đợi phản hồi riêng, hoặc chỉ nhận thông điệp có mã tương quan
      của mình.</div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là nhiều bản của dịch vụ cùng đọc một
      hàng đợi phản hồi, nên bản này lấy nhầm phản hồi của bản kia. Mỗi bản cần hàng
      đợi phản hồi riêng, hoặc chỉ nhận thông điệp có mã tương quan của mình.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnk_reply_match([0, 2, 1, 3, 4])[0] == 3
  - alg.bnk_unknown_outcome(False, True) == 1
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Phản
      hồi về theo thứ tự 0, 2, 1, 3, 4. Ghép theo thứ tự đến đúng mấy lệnh?</td></tr><tr><td>2</td><td>Lõi
      chưa hạch toán, bạn truy vấn rồi gửi lại. Ghi nợ mấy lần?</td></tr><tr><td>3</td><td>Quyết
      định: khi hết giờ chờ với lệnh chuyển tiền, làm gì đầu tiên?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, phản hồi về theo thứ tự không,
      hai, một, ba, bốn, ghép theo thứ tự đến đúng mấy lệnh? Câu hai, lõi chưa hạch
      toán, bạn truy vấn rồi gửi lại, ghi nợ mấy lần? Câu ba, khi hết giờ chờ với
      lệnh chuyển tiền, việc đầu tiên là gì? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: vị trí $0$ chứa $0$ ✓, vị trí $3$ chứa $3$ ✓, vị trí $4$ chứa
      $4$ ✓; vị trí $1$ chứa $2$, vị trí $2$ chứa $1$.</p>

      $$\hl{3}\ \text{trên } 5$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Vị trí không chứa không, đúng. Vị trí ba chứa ba, vị trí
      bốn chứa bốn, đúng. Vị trí một và hai chứa nhầm. Vậy đúng ba trên năm.
    clear: true
  - show: $$\text{ghi nợ} = \hlg{1}\ \text{lần (chỉ lần gửi lại)}$$
    say: Đáp án câu hai. Lõi chưa hạch toán nên lần đầu chưa trừ gì, và lần gửi lại
      trừ đúng một lần.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>truy
      vấn trạng thái trước, rồi mới thử lại</td><td>không ghi nợ trùng</td><td>chậm
      hơn một vòng hỏi</td></tr><tr><td>gửi lại ngay</td><td>nhanh</td><td>có thể
      ghi nợ hai lần</td></tr></table>
    say: Đáp án câu ba. Việc đầu tiên là truy vấn trạng thái bằng mã tham chiếu của
      lệnh, rồi mới quyết định thử lại. Chậm hơn một vòng hỏi, nhưng không ghi nợ
      trùng. Gửi lại ngay thì nhanh nhưng có thể ghi nợ hai lần.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>lõi xử lý song song</span><span class='a'>→</span><span
      class='n'>phản hồi lộn xộn</span><span class='a'>→</span><span class='n'>ghép
      theo mã tương quan</span><span class='a'>→</span><span class='n'>hết giờ chờ
      → truy vấn trước</span></div>
    say: Tổng kết chuỗi logic. Lõi xử lý song song nên phản hồi lộn xộn. Ghép theo
      mã tương quan. Hết giờ chờ thì truy vấn trạng thái trước khi thử lại.
  - show: <div class='box key'><b>Tư duy:</b> “không có phản hồi” là <b>trạng thái
      chưa biết</b>, không phải “thất bại”. Chưa biết thì đi hỏi, đừng đoán.</div>
    say: Điều cần mang theo. Không có phản hồi là trạng thái chưa biết, không phải
      thất bại. Chưa biết thì đi hỏi, đừng đoán.
