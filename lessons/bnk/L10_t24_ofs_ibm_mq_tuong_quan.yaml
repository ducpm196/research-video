  title: 'Tự làm: sáu phản hồi lộn xộn'
  steps:
  - show: '<p><b>Đề</b>: yêu cầu <code>Mi</code> là <code>chuyen (i+1)*100</code>;
      phản hồi về theo mã <code>M3 M5 M0 M1 M4 M2</code>. Viết <code>GhepPhanHoi.java</code>:</p>

      <ol><li>bản đồ mã → yêu cầu</li>

      <li>mỗi phản hồi in <code>phan hoi 0: M3 -&gt; chuyen 400</code></li>

      <li>dòng cuối: số phản hồi đúng nếu ghép theo <b>thứ tự đến</b></li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    pause: 150
    say: Bây giờ tới phần bạn tự làm. Sáu yêu cầu mang mã từ M không tới M năm, nội
      dung là chuyển một trăm, hai trăm, cho tới sáu trăm. Sáu phản hồi về theo thứ
      tự mã M ba, M năm, M không, M một, M bốn, M hai. Hãy viết chương trình in cho
      mỗi phản hồi yêu cầu mà mã của nó chỉ tới, rồi đếm xem nếu ghép theo thứ tự
      đến thì đúng mấy phản hồi. Hãy dừng video, tự viết và chạy, đừng chép lại ví
      dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>phan hoi 0: M3 -&gt;
      chuyen 400</div><div>phan hoi 1: M5 -&gt; chuyen 600</div><div>phan hoi 2: M0
      -&gt; chuyen 100</div><div>phan hoi 3: M1 -&gt; chuyen 200</div><div>phan hoi
