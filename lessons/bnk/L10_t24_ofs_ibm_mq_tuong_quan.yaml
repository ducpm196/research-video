scenes:
- id: hook
  kind: hook
  title: Vì sao phản hồi về không đúng thứ tự, và hết giờ chờ thì làm gì?
  steps:
  - show: '<p>Kênh số gửi $5$ lệnh sang lõi ngân hàng qua hàng đợi. Phản hồi quay
      về <b>lộn xộn</b>: lệnh $2$ trả lời trước lệnh $0$.</p>

      <div class="box key">Nếu ghép phản hồi theo <b>thứ tự đến</b>, cả $5$ lệnh nhận
      nhầm kết quả. Phải ghép theo <b>mã tương quan</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, kênh số gửi năm lệnh sang lõi ngân hàng qua hàng đợi. Phản hồi
      quay về lộn xộn, lệnh hai được trả lời trước lệnh không. Nếu ghép phản hồi theo
      thứ tự đến, cả năm lệnh nhận nhầm kết quả. Phải ghép theo mã tương quan.
  - show: '<table class=''t''><tr><th>cách ghép</th><th>số phản hồi đúng (thứ tự về:
      2, 0, 1, 4, 3)</th></tr><tr><td>theo thứ tự đến</td><td>0 trên 5</td></tr><tr><td>theo
      mã tương quan</td><td>5 trên 5</td></tr></table>'
    say: Bảng này là kết quả mô phỏng ở cuối bài. Ghép theo thứ tự đến thì không phản
      hồi nào đúng. Ghép theo mã tương quan thì đúng cả năm. Hôm nay ta học thêm một
      việc khó hơn, là khi hết giờ chờ mà không biết lõi ngân hàng đã hạch toán hay
      chưa.
- id: prereq
  kind: prereq
  title: Ôn lại ba điều sẽ dùng
  checks:
  - 5 * 4 * 3 * 2 * 1 == 120 == math.factorial(5)
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Hàng đợi</td><td>nơi xếp thông điệp, lấy theo thứ tự vào</td><td>lệnh 0, 1,
      2 xếp hàng</td></tr><tr><td>② Thông điệp có tiêu đề</td><td>ngoài nội dung còn
      có các nhãn như mã thông điệp</td><td>mã thông điệp M7</td></tr><tr><td>③ Yêu
      cầu – phản hồi</td><td>bên gửi hỏi, bên nhận làm rồi trả lời</td><td>hỏi chuyển
      tiền, trả kết quả</td></tr></table>
    say: Trước hết ta ôn lại ba điều sẽ dùng. Hàng đợi là nơi xếp thông điệp, lấy
      theo thứ tự vào. Thông điệp ngoài nội dung còn có các nhãn như mã thông điệp.
      Còn yêu cầu và phản hồi là bên gửi hỏi, bên nhận làm rồi trả lời.
  - show: $$5! = 5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 120$$
    say: Một phép đếm cần dùng. Năm phản hồi có thể về theo một trăm hai mươi thứ
      tự khác nhau, vì năm nhân bốn nhân ba nhân hai nhân một bằng một trăm hai mươi.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Temenos T24</td><td>phần
      mềm lõi ngân hàng (nơi giữ tài khoản và sổ cái)</td></tr><tr><td>OFS</td><td>Open
      Financial Service: bản tin dạng chữ để gọi chức năng của lõi từ bên ngoài</td></tr><tr><td>IBM
      MQ</td><td>phần mềm hàng đợi thông điệp, chuyển bản tin giữa hệ thống</td></tr><tr><td>MessageID
      / CorrelationID</td><td>mã của thông điệp / mã của thông điệp mà phản hồi này
      trả lời</td></tr><tr><td>hết giờ chờ (timeout)</td><td>không nhận phản hồi trong
      thời hạn, chưa biết kết quả</td></tr></table>'
    say: Bảng này giải mã năm từ. T24 là phần mềm lõi ngân hàng. OFS là bản tin dạng
      chữ để gọi chức năng của lõi từ bên ngoài. IBM MQ là phần mềm hàng đợi, chuyển
      bản tin giữa các hệ thống. Mã thông điệp là mã của chính thông điệp, còn mã
      tương quan là mã của thông điệp mà phản hồi này trả lời. Hết giờ chờ là khi
      không nhận được phản hồi trong thời hạn.
