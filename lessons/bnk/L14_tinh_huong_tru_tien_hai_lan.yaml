    say: Hình thứ hai ghép nguyên nhân với biện pháp. Nguyên nhân gốc là thử lại không
      có khoá lũy đẳng. Khuếch đại là ứng dụng coi lỗi mạng là thất bại. Phát hiện
      chậm là chỉ thấy khi đối soát hoặc khi khách báo. Mỗi nguyên nhân có một biện
      pháp tương ứng, ở cột bên phải. Lưu ý, khoá lũy đẳng phải được sinh khi tạo
      lệnh, ở màn hình xác nhận, và dùng lại khi khách bấm lại. Nếu mỗi lần bấm sinh
      một khoá mới, lệnh vẫn bị trùng.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ triệu chứng tới cách ngăn'
  checks:
  - (2 - 1) * 500000 == 500000
  - alg.bnk_reconcile([('r7', 500000), ('r7b', 500000)], [('r7', 500000)]) == (1,
    1, 0, 0)
  - -500000 - 500000 + 500000 == -500000
  - alg.bnk_unique_key_rows(2) == 1
  steps:
  - show: '<p><b>Bước 1. Triệu chứng.</b> Khách bị trừ $2$ lần cho $1$ lệnh. Số tiền
      trừ dư $= (2 - 1) \cdot 500\,000$.</p>

      <span class=''note''>Làm thử: $(2 - 1) \cdot 500\,000 = 500\,000$ đồng trừ dư.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, triệu chứng. Khách bị trừ hai lần cho một lệnh, nên số tiền trừ
      dư bằng hai trừ một, nhân năm trăm nghìn. Làm thử, kết quả là năm trăm nghìn
      đồng trừ dư.
  - show: '<p><b>Bước 2. Bằng chứng.</b> Đối soát theo mã: r7 có ở cả hai sổ và khớp,
      r7b chỉ có ở ngân hàng.</p>

      <span class=''note''>Làm thử: khớp $1$, chỉ ngân hàng $1$, chỉ chuyển mạch $0$,
      lệch tiền $0$.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, bằng chứng. Vì đối soát theo mã tách được từng giao dịch, nên r
      bảy có ở cả hai sổ và khớp, còn r bảy b chỉ có ở ngân hàng. Làm thử, khớp một,
      chỉ ngân hàng một, hai loại còn lại bằng không.
  - show: '<p><b>Bước 3. Sửa cho khách.</b> Thêm bút toán đảo cho r7b, không xoá dòng.
      Số dư khách sau đảo chỉ còn bị trừ đúng $500\,000$.</p>

      <span class=''note''>Làm thử:</span>

      $$-500\,000 - 500\,000 + 500\,000 = -500\,000$$

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Bước ba, sửa cho khách. Vì sổ không được xoá dòng, nên ta thêm bút toán đảo
      cho r bảy b. Sau khi đảo, khách chỉ còn bị trừ đúng năm trăm nghìn. Làm thử,
      âm năm trăm nghìn, âm năm trăm nghìn, cộng năm trăm nghìn, bằng âm năm trăm
      nghìn.
  - show: '<p><b>Bước 4. Ngăn lần sau.</b> Cùng khoá thì chỉ một dòng; hết giờ chờ
      thì truy vấn trước khi thử lại.</p>

      <span class=''note''>Làm thử: gửi hai lần cùng khoá → $1$ dòng.</span>

      '
    focus:
    - 1
    - 2
    say: Bước bốn, ngăn lần sau. Vì khoá lũy đẳng chỉ cho một dòng, và truy vấn trước
      giúp biết đã hạch toán chưa, nên gửi hai lần cùng khoá chỉ còn một dòng.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 2000000 - 2 * 500000 == 1000000
  - (2000000 - 500000) - 1000000 == 500000
  - alg.bnk_reconcile([('r7', 500000), ('r7b', 500000)], [('r7', 500000)])[1] == 2
    - 1
  - 1000000 + 500000 == 1500000 == alg.bnk_retry_sim(2000000, 500000, 2, True)
  - alg.bnk_retry_sim(2000000, 500000, 2, False) == 1000000
  steps:
  - show: '<p>Số dư đầu $2\,000\,000$ đồng <i>(số minh hoạ)</i>. Không khoá, ứng dụng
      gửi $2$ lần.</p>

      $$① \; 2\,000\,000 - 2 \cdot 500\,000 = \hl{1\,000\,000}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta tính số liệu giả định. Số dư đầu hai triệu đồng, đây là số minh hoạ. Không
      có khoá, ứng dụng gửi hai lần. Phép tính thứ nhất, hai triệu trừ hai nhân năm
      trăm nghìn, còn một triệu.
  - show: '<p>Số dư đúng là $2\,000\,000 - 500\,000 = 1\,500\,000$.</p>

      $$② \; 1\,500\,000 - 1\,000\,000 = \hl{500\,000}\ \text{trừ dư}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, số dư đúng phải là hai triệu trừ năm trăm nghìn, bằng
      một triệu năm trăm nghìn. Chênh lệch so với thực tế là năm trăm nghìn, đúng
      bằng số trừ dư.
  - show: '<p>Đối soát: ngân hàng có r7 và r7b, chuyển mạch chỉ có r7.</p>

      $$③ \; \text{chỉ ngân hàng} = 2 - 1 = \hl{1}\ (r7b)$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ ba, đối soát. Ngân hàng có hai mã, chuyển mạch có một mã. Mã
      chỉ có ở ngân hàng là hai trừ một, bằng một, và đó là r bảy b.
  - show: '<p>Thêm bút toán đảo $+500\,000$ cho r7b vào tài khoản khách.</p>

      $$④ \; 1\,000\,000 + 500\,000 = \hlg{1\,500\,000}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ tư, thêm bút toán đảo cộng năm trăm nghìn cho r bảy b. Số dư
      của khách về một triệu cộng năm trăm nghìn, bằng một triệu năm trăm nghìn, đúng
      như một lần chuyển.
  - show: '<p>Từ nay có khoá lũy đẳng: gửi $2$ lần cùng khoá.</p>

      $$⑤ \; 2\,000\,000 - 500\,000 = \hlg{1\,500\,000}\ \text{ngay từ đầu}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ năm, từ nay có khoá lũy đẳng, gửi hai lần cùng khoá. Số dư
      đúng một triệu năm trăm nghìn ngay từ đầu, và không cần hoàn tiền.
- id: chay_that
  kind: example
  title: 'Chạy thật: tìm lệnh trừ trùng, đảo bút toán, kiểm số dư (sqlite)'
  steps:
  - show: '<p><b>Dựng hai sổ: ngân hàng ghi hai lần trừ, chuyển mạch chỉ ghi một</b></p><div
      class="code"><div><span class="kw">CREATE</span> <span class="kw">TABLE</span>
      ngan_hang (ma <span class="kw">TEXT</span>, tk <span class="kw">TEXT</span>,
      tien <span class="kw">INTEGER</span>);</div><div><span class="kw">CREATE</span>
      <span class="kw">TABLE</span> chuyen_mach (ma <span class="kw">TEXT</span>,
      tien <span class="kw">INTEGER</span>);</div><div><span class="kw">INSERT</span>
      <span class="kw">INTO</span> ngan_hang <span class="kw">VALUES</span> (''r7'',
      ''A'', -500000), (''r7b'', ''A'', -500000);</div><div><span class="kw">INSERT</span>
      <span class="kw">INTO</span> chuyen_mach <span class="kw">VALUES</span> (''r7'',
      500000);</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta dựng lại tình huống bằng SQL. Sổ ngân hàng của khách A có hai dòng trừ
      năm trăm nghìn, mã r bảy và r bảy b. Sổ chuyển mạch chỉ có một dòng, mã r bảy.
      Số dư đầu của A là hai triệu.
  - show: <p><b>Tìm dòng chỉ ngân hàng có, kiểm số dư, đảo, kiểm lại</b></p><div class="code"><div><span
      class="kw">SELECT</span> ma <span class="kw">FROM</span> ngan_hang <span class="kw">WHERE</span>
      ma <span class="kw">NOT</span> IN (<span class="kw">SELECT</span> ma <span class="kw">FROM</span>
      chuyen_mach);</div><div><span class="kw">SELECT</span> 2000000 + <span class="kw">SUM</span>(tien)
      <span class="kw">FROM</span> ngan_hang;</div><div><span class="kw">INSERT</span>
      <span class="kw">INTO</span> ngan_hang <span class="kw">SELECT</span> 'dao-'
      || ma, tk, -tien <span class="kw">FROM</span> ngan_hang <span class="kw">WHERE</span>
      ma = 'r7b';</div><div><span class="kw">SELECT</span> 2000000 + <span class="kw">SUM</span>(tien)
      <span class="kw">FROM</span> ngan_hang;</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>r7b</div><div>1000000</div><div>1500000</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 4
    clear: true
    say: Câu thứ nhất tìm các mã có ở sổ ngân hàng mà không có ở sổ chuyển mạch. Câu
      thứ hai tính số dư bằng số dư đầu cộng tổng các dòng. Lệnh chèn thêm một dòng
      đảo, ngược dấu, cho mã r bảy b, không xoá dòng nào. Câu cuối tính lại số dư.
      Khi chạy thật, mã thừa là r bảy b. Số dư trước khi sửa là một triệu, bị trừ
      dư năm trăm nghìn. Sau khi đảo, số dư là một triệu năm trăm nghìn, đúng bằng
      hai triệu trừ năm trăm nghìn.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: sổ phải cân đối sau khi sửa'
  checks:
  - alg.bnk_ledger_unbalanced([(1, 'khach', -500000), (1, 'nhan', 500000), (2, 'khach',
    -500000), (2, 'cho_tt_chuyen_mach', 500000), (3, 'khach', 500000), (3, 'cho_tt_chuyen_mach',
    -500000)]) == []
  - len([(1, 'khach', -500000), (1, 'nhan', 500000), (2, 'khach', -500000), (2, 'cho_tt_chuyen_mach',
    500000), (3, 'khach', 500000), (3, 'cho_tt_chuyen_mach', -500000)]) == 4 + 2 ==
    6
  - -500000 + 500000 == 0
  steps:
  - show: '<p>Đường khác: dựng sổ nhiều dòng rồi hỏi cơ sở dữ liệu. Giao dịch gốc
      và giao dịch đảo đều phải cân đối, tức <b>không giao dịch nào lệch</b>.</p>

      $$\text{giao dịch lệch} = \hlg{[\ ]}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Kiểm bằng đường khác. Vì sổ cái cân đối theo từng giao dịch, ta dựng sổ nhiều
      dòng rồi hỏi cơ sở dữ liệu. Giao dịch gốc và giao dịch đảo đều cân đối, nên
      không giao dịch nào lệch.
  - show: <table class='t'><tr><th>kiểm tra</th><th>kết quả mong đợi</th></tr><tr><td>mỗi
      giao dịch cân đối (tổng 0)</td><td>danh sách lệch rỗng</td></tr><tr><td>số dòng
      sau khi đảo</td><td>4 dòng cũ (r7, r7b) + 2 dòng đảo = 6, không dòng nào bị
      xoá</td></tr><tr><td>đối soát sau sửa</td><td>r7 khớp; r7b vẫn chỉ ngân hàng
      có nhưng đã có bút toán đảo đi kèm, tổng 0, nên được đóng</td></tr></table>
    say: Bảng này là ba phép kiểm sau khi sửa, vì sửa xong mới cần chắc sổ đúng. Mỗi
      giao dịch cân đối thì danh sách lệch rỗng. Số dòng bằng bốn dòng cũ của r bảy
      và r bảy b, cộng hai dòng đảo, là sáu dòng, không dòng nào bị xoá. Còn đối soát
      lại thì r bảy khớp. R bảy b vẫn chỉ ngân hàng có, nhưng đã có bút toán đảo đi
      kèm với tổng bằng không, nên khoản lệch đó được đóng.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp khi kể sự cố trong phỏng vấn
  steps:
  - show: <div class="box warn"><b>Lỗi 1.</b> <b class="red">Kể sự cố không phải của
      mình</b> như của mình, hoặc thêm con số không có nguồn. Người phỏng vấn đào
      sâu hai ba lớp là lộ. Chỉ kể điều bạn thật sự làm, và con số nào cũng phải có
      nguồn.</div>
    say: Lỗi thứ nhất, và nặng nhất. Kể sự cố không phải của mình như của mình, hoặc
      thêm con số không có nguồn. Người phỏng vấn đào sâu hai ba lớp là lộ. Chỉ kể
      điều bạn thật sự làm, và con số nào cũng phải có nguồn.
  - show: <div class="box warn"><b>Lỗi 2.</b> <b class="red">Đổ lỗi cho người hay
      hệ thống khác</b>. Sự cố tốt được kể bằng cơ chế và bài học, không bằng đổ lỗi.
      Nói rõ phần bạn sai hoặc chưa biết lúc đó.</div>
    say: Lỗi thứ hai, đổ lỗi cho người hay hệ thống khác. Sự cố tốt được kể bằng cơ
      chế và bài học, không bằng đổ lỗi. Hãy nói rõ phần bạn sai hoặc chưa biết lúc
      đó.
  - show: '<div class="box warn"><b>Lỗi 3.</b> Chỉ kể cách sửa nóng mà <b class="red">bỏ
      phần ngăn lặp lại</b>. Người cấp cao được đánh giá ở chỗ sự cố đó không xảy
      ra lần hai: khoá lũy đẳng, giám sát, đối soát.</div>'
    say: Lỗi thứ ba, chỉ kể cách sửa nóng mà bỏ phần ngăn lặp lại. Người cấp cao được
      đánh giá ở chỗ sự cố đó không xảy ra lần hai, bằng khoá lũy đẳng, giám sát và
      đối soát.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - (3 - 1) * 400000 == 800000 == 3000000 - alg.bnk_retry_sim(3000000, 400000, 3,
    False) - 400000
  - alg.bnk_reconcile([('a', 1), ('b', 1), ('c', 1)], [('a', 1), ('b', 1)])[1] ==
    3 - 2
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Số
      dư đầu 3 000 000, chuyển 400 000, gửi 3 lần không khoá. Bị trừ dư bao nhiêu?</td></tr><tr><td>2</td><td>Ngân
      hàng có 3 mã, chuyển mạch 2 mã, cả 2 mã đều chung. Mấy mã chỉ ở ngân hàng?</td></tr><tr><td>3</td><td>Bài
      tập: viết bốn câu STAR cho một sự cố THẬT của bạn.</td></tr></table>'
    pause: 30
    say: Bây giờ tới phần bạn tự làm bài. Câu một, số dư đầu ba triệu, chuyển bốn
      trăm nghìn, gửi ba lần không khoá, bị trừ dư bao nhiêu? Câu hai, ngân hàng có
      ba mã, chuyển mạch có hai mã, cả hai mã đều chung, mấy mã chỉ ở ngân hàng? Câu
      ba là bài tập, viết bốn câu S T A R cho một sự cố thật của bạn. Hãy dừng video
      và làm ra giấy.
  - show: '<p>Câu 1: trừ $3 \cdot 400\,000$ nhưng đúng ra chỉ $1 \cdot 400\,000$.</p>

      $$(3 - 1) \cdot 400\,000 = \hl{800\,000}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một. Bị trừ ba lần nhưng đúng ra chỉ một lần, nên trừ dư là ba
      trừ một, nhân bốn trăm nghìn, bằng tám trăm nghìn.
    clear: true
  - show: $$3 - 2 = \hlg{1}\ \text{mã chỉ ở ngân hàng}$$
    say: Đáp án câu hai. Ngân hàng ba mã, hai mã chung, nên còn một mã chỉ có ở ngân
      hàng.
  - show: '<div class="box key"><b>Khung điền cho sự cố THẬT của bạn</b> <i>(bài này
      không bịa hộ bạn)</i><br>

      S: [hệ thống, rủi ro] &nbsp; T: [phần bạn chịu trách nhiệm]<br>A: [các bước
      bạn làm, vì sao] &nbsp; R: [thay đổi đo được, nguồn số liệu, bài học]</div>

      '
    clear: true
    say: Câu ba là bài của riêng bạn, nên bài này không bịa hộ bạn. Hãy điền bối cảnh,
      nhiệm vụ, hành động và kết quả của một sự cố thật. Mỗi con số phải có nguồn,
      và nếu không nhớ chính xác thì nói rõ là ước chừng.
- id: quy_mo
  kind: example
  title: 'Quy mô: vụ trừ trùng nhỏ thành hàng nghìn người làm mỗi ngày nếu xử lý tay'
  checks:
  - 100000 * 0.0001 == 10
  - round(10_000_000 * 0.0001) == 1000
  - round(1_000_000_000 * 0.0001) == 100_000
  - 10 * 10 == 100
  - round(1000 * 10 / 60) == 167
  - round(100000 * 10 / 60) == 16667
  - round(1000 * 10 / 60 / 8) == 21
  - round(100000 * 10 / 60 / 8) == 2083
  - round(10 * 10 / 60 / 8, 1) == 0.2
  steps:
  - show: <p>Giả sử $0{,}01\%$ lệnh bị trừ trùng, và mỗi vụ cần $10$ phút xử lý tay
      (đối soát, đảo bút toán, báo khách) <i>(số minh hoạ)</i>; một người làm $8$
      giờ mỗi ngày:</p><table class='t'><tr><th>tải</th><th>lệnh mỗi ngày</th><th>vụ
      trừ trùng</th><th>thời gian xử lý tay</th><th>số người cần</th></tr><tr><td>×1</td><td>100
      000</td><td>10</td><td>100 phút</td><td>≈ 0,2</td></tr><tr><td>×100</td><td>10
      000 000</td><td>1 000</td><td>≈ 167 giờ</td><td><b>≈ 21</b></td></tr><tr><td>×10
      000</td><td>1 000 000 000</td><td>100 000</td><td>≈ 16 667 giờ</td><td><b>≈
      2 083</b></td></tr></table>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giả sử một phần mười nghìn số lệnh bị trừ trùng, và mỗi vụ cần mười phút
      xử lý tay, gồm đối soát, đảo bút toán và báo khách. Mỗi người làm tám giờ mỗi
      ngày. Đây là số minh hoạ. Với một trăm nghìn lệnh mỗi ngày, có mười vụ, chỉ
      một trăm phút, chưa đến một người. Tải tăng một trăm lần thì một nghìn vụ, cần
      khoảng hai mươi mốt người. Tải tăng mười nghìn lần thì một trăm nghìn vụ, cần
      khoảng hai nghìn người, mỗi ngày.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Sửa từng vụ bằng tay:
      ở ×1 chỉ một người làm thêm, ở ×100 cần cả một nhóm, ở ×10 000 là một nhà máy;
      và càng nhiều người sửa tay càng dễ thêm lỗi.</div>

      <div class="box key"><b>Đánh đổi:</b> phòng hơn chữa (khoá lũy đẳng, truy vấn
      trước khi thử lại kéo số vụ về gần 0); với vụ còn lại thì tự động hoá đối soát
      và đảo bút toán, nhưng đặt ngưỡng, bước duyệt và nhật ký kiểm toán để máy không
      tự hoàn nhầm.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Câu hỏi là giải pháp cũ sẽ gãy ở chỗ nào khi tải tăng lên. Sửa từng vụ bằng
      tay thì ở tải gốc chỉ cần một người làm thêm. Ở tải gấp trăm lần cần cả một
      nhóm, và ở tải gấp mười nghìn lần là một nhà máy. Càng nhiều người sửa tay càng
      dễ thêm lỗi. Đánh đổi là phòng hơn chữa, vì khoá lũy đẳng và truy vấn trước
      khi thử lại kéo số vụ về gần không. Với các vụ còn lại thì tự động hoá đối soát
      và đảo bút toán, nhưng phải đặt ngưỡng, bước duyệt và nhật ký kiểm toán để máy
      không tự hoàn nhầm.
- id: practice
  kind: practice
  title: 'Tự làm: ba lần gửi, một lần ghi chuyển mạch'
  steps:
  - show: '<p><b>Đề</b>: số dư đầu 3 000 000; ngân hàng trừ 800 000 ba lần (<code>r8</code>,
      <code>r8b</code>, <code>r8c</code>), chuyển mạch chỉ có <code>r8</code>. Viết
      <code>sua_sai.sql</code>:</p>

      <ol><li>hai bảng và dữ liệu (chi tiết ở <code>de.md</code>)</li><li>tìm mã thừa;
      số dư trước khi sửa</li>

      <li>đảo <b>đúng các mã thừa</b> bằng <code>INSERT … SELECT</code>; số dư sau
      khi sửa</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 180
    say: Bây giờ tới phần bạn tự làm. Khách tên A có số dư ba triệu đồng. Sổ ngân
      hàng trừ tám trăm nghìn ba lần, mã r tám, r tám b và r tám c, còn sổ chuyển
      mạch chỉ có mã r tám. Hãy viết một tệp SQL dựng hai bảng và dữ liệu đó. Rồi
      tìm các mã thừa, tính số dư trước khi sửa, đảo đúng các mã thừa bằng lệnh chèn
      kèm truy vấn, và tính lại số dư. Hãy dừng video, tự viết và chạy, đừng chép
      lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>r8b</div><div>r8c</div><div>600000</div><div>2200000</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNK L14 sua_sai.sql</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mô theo ví dụ; điều kiện mã thừa là
      <code>ma NOT IN (SELECT ma FROM chuyen_mach)</code>, dùng cho cả câu tìm lẫn
      lệnh chèn đảo.

      Lời giải ở <code>labs/BNK/L14/loi_giai.sql</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, làm theo ví dụ vừa xem. Điều kiện mã thừa là mã không nằm trong
      sổ chuyển mạch, và ta dùng đúng điều kiện đó cho cả câu tìm lẫn lệnh chèn dòng
      đảo. Lời giải đầy đủ nằm trong thư mục thực hành của bài, chỉ mở sau khi bạn
      đã tự thử.
    clear: true
  lab: labs/BNK/L14
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>triệu chứng</span><span class='a'>→</span><span
      class='n'>bằng chứng từ sổ</span><span class='a'>→</span><span class='n'>sửa
      bằng bút toán đảo</span><span class='a'>→</span><span class='n'>ngăn bằng khoá
      lũy đẳng</span></div>
    say: Tổng kết chuỗi logic. Bắt đầu từ triệu chứng, tìm bằng chứng từ sổ, sửa bằng
      bút toán đảo, và ngăn lặp lại bằng khoá lũy đẳng.
  - show: <div class='box key'><b>Tư duy:</b> kỹ sư cấp cao không chỉ sửa lỗi. Họ
      <b>giải thích cơ chế</b>, <b>chứng minh bằng dữ liệu</b>, và <b>làm cho lỗi
      đó không thể lặp lại</b>. Hãy kể đúng việc mình đã làm.</div>
    say: Điều cần mang theo. Kỹ sư cấp cao không chỉ sửa lỗi. Họ giải thích cơ chế,
      chứng minh bằng dữ liệu, và làm cho lỗi đó không thể lặp lại. Hãy kể đúng việc
      mình đã làm.
