scenes:
- id: hook
  kind: hook
  title: 'Tình huống giả định: khách bị trừ hai lần cho một lệnh chuyển'
  steps:
  - show: '<p><b>Tình huống giả định, số minh hoạ, không phải sự cố có thật.</b> Khách
      chuyển $500\,000$ đồng. Ứng dụng báo lỗi mạng, khách bấm lại. Sao kê hiện <b>hai</b>
      khoản trừ.</p>

      <div class="box key">Bài này dùng mọi thứ đã học để <b>tìm nguyên nhân, sửa
      cho khách, và ngăn lần sau</b>. Cuối bài là khung để bạn kể sự cố <b>thật</b>
      của mình.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, đây là một tình huống giả định với số liệu minh hoạ, không phải
      sự cố có thật. Khách chuyển năm trăm nghìn đồng. Ứng dụng báo lỗi mạng, khách
      bấm lại. Sao kê hiện hai khoản trừ. Bài này dùng mọi thứ đã học để tìm nguyên
      nhân, sửa cho khách, và ngăn lần sau. Cuối bài là khung để bạn kể sự cố thật
      của chính mình.
  - show: <table class='t'><tr><th>bước</th><th>việc</th><th>kiến thức dùng</th></tr><tr><td>1</td><td>tìm
      nguyên nhân</td><td>hết giờ chờ, thử lại, lõi đã hạch toán</td></tr><tr><td>2</td><td>xác
      nhận bằng sổ</td><td>đối soát hai bên theo mã</td></tr><tr><td>3</td><td>hoàn
      tiền đúng cách</td><td>bút toán đảo, không xoá dòng</td></tr><tr><td>4</td><td>ngăn
      lần sau</td><td>khoá lũy đẳng, truy vấn trước khi thử lại</td></tr></table>
    say: Bảng này là lộ trình bốn bước. Một, tìm nguyên nhân, dùng hiểu biết về hết
      giờ chờ và thử lại. Hai, xác nhận bằng sổ, dùng đối soát. Ba, hoàn tiền đúng
      cách, dùng bút toán đảo. Bốn, ngăn lần sau, dùng khoá lũy đẳng và truy vấn trước
      khi thử lại.
- id: prereq
  kind: prereq
  title: Ôn lại những mảnh ghép sẽ dùng
  checks:
  - 2 * 500000 == 1000000
  steps:
  - show: <table class='t'><tr><th>mảnh ghép</th><th>nội dung đã học</th><th>ví dụ
      số</th></tr><tr><td>thử lại</td><td>mất phản hồi nên người gọi thử lại</td><td>3
      lần gửi, 1 việc thật</td></tr><tr><td>khoá lũy đẳng</td><td>cùng khoá thì chỉ
      làm một lần</td><td>UNIQUE → 1 dòng</td></tr><tr><td>hết giờ chờ</td><td>chưa
      biết kết quả, phải truy vấn</td><td>đã hạch toán + gửi lại = ghi nợ 2 lần</td></tr><tr><td>đối
      soát</td><td>ghép hai sổ theo mã, chia bốn loại</td><td>3 khớp, 1, 1, 1</td></tr><tr><td>bút
      toán đảo</td><td>sửa sai bằng dòng ngược dấu</td><td>6 dòng, số dư về 0</td></tr></table>
    say: Trước hết ta ôn lại năm mảnh ghép sẽ dùng. Thử lại vì mất phản hồi. Khoá
      lũy đẳng giúp cùng khoá chỉ làm một lần. Hết giờ chờ nghĩa là chưa biết kết
      quả, phải truy vấn. Đối soát ghép hai sổ theo mã và chia bốn loại. Bút toán
      đảo sửa sai bằng dòng ngược dấu.
  - show: $$2 \cdot 500\,000 = 1\,000\,000$$
    say: Một phép tính khởi động. Hai lần trừ, mỗi lần năm trăm nghìn, tổng bị trừ
      một triệu. Đúng ra chỉ nên trừ năm trăm nghìn.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: 'Giải mã khung kể sự cố: STAR'
  steps:
  - show: <table class='t'><tr><th>chữ</th><th>nghĩa</th><th>câu hỏi tự hỏi</th></tr><tr><td>S
      — Situation</td><td>bối cảnh</td><td>hệ thống nào, ai dùng, rủi ro gì</td></tr><tr><td>T
      — Task</td><td>nhiệm vụ của bạn</td><td>bạn chịu trách nhiệm phần nào</td></tr><tr><td>A
      — Action</td><td>hành động của bạn</td><td>bạn làm gì, từng bước, vì sao</td></tr><tr><td>R
      — Result</td><td>kết quả</td><td>thay đổi gì, đo bằng gì, học được gì</td></tr></table>
    say: Khung S T A R giúp kể sự cố có cấu trúc. S là bối cảnh, hệ thống nào, ai
      dùng, rủi ro gì. T là nhiệm vụ của bạn, bạn chịu trách nhiệm phần nào. A là
      hành động, bạn làm gì, từng bước, vì sao. R là kết quả, thay đổi gì, đo bằng
      gì, học được gì.
