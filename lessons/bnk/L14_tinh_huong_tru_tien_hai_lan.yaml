scenes:
- id: hook
  kind: hook
  title: 'Tình huống giả định: khách bị trừ hai lần cho một lệnh chuyển'
  steps:
  - show: '<p><b>Tình huống giả định, số minh hoạ, không phải sự cố có thật.</b> Khách
      chuyển $500\,000$ đồng. Ứng dụng báo lỗi mạng, khách bấm lại. Sao kê hiện <b>hai</b>
      khoản trừ.</p>

      <div class="box key">Bài này dùng mọi thứ đã học để <b>tìm nguyên nhân, sửa
      cho khách, và ngăn lần sau</b>. Cuối bài là khung để bạn kể sự cố <b>thật</b>
      của mình.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, đây là một tình huống giả định với số liệu minh hoạ, không phải
      sự cố có thật. Khách chuyển năm trăm nghìn đồng. Ứng dụng báo lỗi mạng, khách
      bấm lại. Sao kê hiện hai khoản trừ. Bài này dùng mọi thứ đã học để tìm nguyên
      nhân, sửa cho khách, và ngăn lần sau. Cuối bài là khung để bạn kể sự cố thật
      của chính mình.
  - show: <table class='t'><tr><th>bước</th><th>việc</th><th>kiến thức dùng</th></tr><tr><td>1</td><td>tìm
      nguyên nhân</td><td>hết giờ chờ, thử lại, lõi đã hạch toán</td></tr><tr><td>2</td><td>xác
      nhận bằng sổ</td><td>đối soát hai bên theo mã</td></tr><tr><td>3</td><td>hoàn
      tiền đúng cách</td><td>bút toán đảo, không xoá dòng</td></tr><tr><td>4</td><td>ngăn
      lần sau</td><td>khoá lũy đẳng, truy vấn trước khi thử lại</td></tr></table>
    say: Bảng này là lộ trình bốn bước. Một, tìm nguyên nhân, dùng hiểu biết về hết
      giờ chờ và thử lại. Hai, xác nhận bằng sổ, dùng đối soát. Ba, hoàn tiền đúng
      cách, dùng bút toán đảo. Bốn, ngăn lần sau, dùng khoá lũy đẳng và truy vấn trước
      khi thử lại.
- id: prereq
  kind: prereq
  title: 'Nhắc lại từ đầu: các mảnh ghép sẽ dùng'
  checks:
  - 2 * 500000 == 1000000
  - alg.bnk_retry_sim(2000000, 500000, 3, True) == 2000000 - 500000
  - alg.bnk_reconcile([('r1', 1), ('r2', 1)], [('r1', 1)]) == (1, 1, 0, 0)
  - -500000 + 500000 == 0
  steps:
  - show: '<table class=''t''><tr><th>mảnh ghép</th><th>nghĩa</th><th>ví dụ số</th></tr><tr><td>thử
      lại</td><td>phản hồi có thể mất trên mạng, nên ứng dụng (hoặc khách) gửi lại
      cùng một lệnh</td><td>1 lệnh, gửi 3 lần</td></tr><tr><td>khoá lũy đẳng</td><td>mã
      duy nhất gắn với mỗi lệnh, gửi kèm mọi lần thử; máy chủ thấy khoá đã có thì
      không làm lại</td><td>3 lần gửi cùng khoá → trừ 1 lần</td></tr><tr><td>hết giờ
      chờ</td><td>không nhận phản hồi kịp: chưa biết lõi ngân hàng đã hạch toán (ghi
      vào sổ) hay chưa, phải truy vấn</td><td>đã hạch toán mà gửi lại → ghi nợ (trừ
      tiền) 2 lần</td></tr></table>'
    say: Trước hết, ta nhắc lại từ đầu năm mảnh ghép sẽ dùng. Thử lại là khi phản
      hồi mất trên mạng, nên ứng dụng hoặc khách gửi lại cùng một lệnh. Khoá lũy đẳng
      là mã duy nhất gắn với mỗi lệnh và gửi kèm mọi lần thử. Máy chủ thấy khoá đã
      có thì không làm lại, nên ba lần gửi cùng khoá chỉ trừ tiền một lần. Hết giờ
      chờ nghĩa là chưa biết lõi ngân hàng đã hạch toán, tức đã ghi vào sổ hay chưa,
      nên phải truy vấn. Nếu đã hạch toán mà gửi lại, khách bị trừ tiền hai lần.
  - show: '<table class=''t''><tr><th>thêm một điều để đọc mã</th><th>nghĩa</th><th>ví
      dụ</th></tr><tr><td>SQL dùng trong bài</td><td><code>x NOT IN (SELECT …)</code>:
      x không nằm trong kết quả của truy vấn con; <code>INSERT INTO t SELECT …</code>:
      chèn mọi dòng mà truy vấn trả về; <code>''dao-'' || ma</code>: nối hai chuỗi;
      <code>SUM(cột)</code>: cộng</td><td><code>''dao-'' || ''r7b''</code> = <code>dao-r7b</code></td></tr></table>'
    clear: true
    say: Thêm một điều để đọc mã SQL trong bài. Điều kiện không nằm trong cho biết
      một giá trị không có trong kết quả của một truy vấn con. Lệnh chèn kèm truy
      vấn chèn mọi dòng mà truy vấn trả về. Hai gạch đứng nối hai chuỗi. Và hàm cộng
      là hàm tính tổng, nó cộng mọi giá trị của một cột lại với nhau.
  - show: '<table class=''t''><tr><th>mảnh ghép</th><th>nghĩa</th><th>ví dụ số</th></tr><tr><td>đối
      soát</td><td>đặt sổ ngân hàng cạnh sổ chuyển mạch (hệ thống ở giữa các ngân
      hàng), ghép theo mã giao dịch, chia bốn loại: khớp, lệch tiền, chỉ ngân hàng
      có, chỉ chuyển mạch có</td><td>ngân hàng có r1, r2; chuyển mạch có r1 → r2 chỉ
      ngân hàng có</td></tr><tr><td>bút toán đảo</td><td>sổ không được xoá dòng; sửa
      sai bằng một dòng mới ngược dấu</td><td>−500 000 rồi +500 000: tổng 0</td></tr></table>'
    clear: true
    say: Đối soát là đặt sổ ngân hàng cạnh sổ của chuyển mạch, tức hệ thống ở giữa
      các ngân hàng, rồi ghép theo mã giao dịch và chia bốn loại. Bốn loại là khớp,
      lệch tiền, chỉ ngân hàng có, và chỉ chuyển mạch có. Bút toán đảo là cách sửa
      sai mà không xoá dòng nào, bằng một dòng mới ngược dấu. Ví dụ trừ năm trăm nghìn
      rồi cộng năm trăm nghìn, tổng bằng không.
  - show: $$2 \cdot 500\,000 = 1\,000\,000$$
    say: Một phép tính khởi động. Hai lần trừ, mỗi lần năm trăm nghìn, tổng bị trừ
      một triệu. Đúng ra chỉ nên trừ năm trăm nghìn.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: 'Giải mã khung kể sự cố: STAR'
  steps:
  - show: <table class='t'><tr><th>chữ</th><th>nghĩa</th><th>câu hỏi tự hỏi</th></tr><tr><td>S
      — Situation</td><td>bối cảnh</td><td>hệ thống nào, ai dùng, rủi ro gì</td></tr><tr><td>T
      — Task</td><td>nhiệm vụ của bạn</td><td>bạn chịu trách nhiệm phần nào</td></tr><tr><td>A
      — Action</td><td>hành động của bạn</td><td>bạn làm gì, từng bước, vì sao</td></tr><tr><td>R
      — Result</td><td>kết quả</td><td>thay đổi gì, đo bằng gì, học được gì</td></tr></table>
    say: Khung S T A R giúp kể sự cố có cấu trúc. S là bối cảnh, hệ thống nào, ai
      dùng, rủi ro gì. T là nhiệm vụ của bạn, bạn chịu trách nhiệm phần nào. A là
      hành động, bạn làm gì, từng bước, vì sao. R là kết quả, thay đổi gì, đo bằng
      gì, học được gì.
