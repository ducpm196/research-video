    clear: true
    say: Hình thứ hai cho thấy lỗi của khoá có hạn. A giữ khoá với hạn mười giây,
      rồi bị tạm dừng, ví dụ do thu gom rác. Khoá hết hạn, B lấy khoá ở giây mười
      một và ghi lúc mười một phẩy năm. Đến giây mười hai A tỉnh dậy, không biết khoá
      đã hết, và vẫn ghi đè lên B.
  - show: <div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
