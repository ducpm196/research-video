      x="950.0" y="233" font-size="24" text-anchor="middle" fill="#1f2937">giây 11:
      B giữ khoá (mã chặn 2)</text><rect x="740" y="290" width="360" height="70" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="920.0" y="333" font-size="24"
      text-anchor="middle" fill="#1f2937">giây 11,5: B ghi</text><rect x="1000" y="80"
      width="440" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text
      x="1220.0" y="123" font-size="24" text-anchor="middle" fill="#1f2937">giây 12:
      A tỉnh dậy, vẫn ghi!</text><text x="750" y="420" font-size="26" text-anchor="middle"
      fill="#dc2626" font-weight="bold">Khoá của A đã hết hạn từ giây 10, nhưng A
      không biết</text></svg></div>'
    clear: true
    say: Hình thứ hai cho thấy lỗi của khoá có hạn. A giữ khoá với hạn mười giây,
      rồi bị tạm dừng. Khoá hết hạn, B lấy khoá ở giây mười một và ghi lúc mười một
      phẩy năm. Đến giây mười hai A tỉnh dậy, không biết khoá đã hết, và vẫn ghi đè
      lên B.
  - show: <div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="60" y="150" width="260" height="100" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="190.0" y="192" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">B ghi</text><text x="190.0" y="224" font-size="24"
      text-anchor="middle" fill="#1f2937">mã chặn 2</text><rect x="60" y="280" width="260"
      height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text
      x="190.0" y="312" font-size="24" text-anchor="middle" fill="#1f2937">A ghi muộn</text><text
      x="190.0" y="344" font-size="24" text-anchor="middle" fill="#1f2937">mã chặn
      1</text><rect x="620" y="130" width="420" height="140" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="3"/><text x="830.0" y="192" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Kho dữ liệu được ghi</text><text x="830.0"
      y="224" font-size="24" text-anchor="middle" fill="#1f2937">nhớ mã chặn lớn nhất
      = 2</text><line x1="320" y1="190" x2="615" y2="190" stroke="#16a34a" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="467" y="178" font-size="22" text-anchor="middle"
      fill="#16a34a" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">nhận</text><line
      x1="320" y1="320" x2="615" y2="240" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="335" y="352" font-size="22" text-anchor="start" fill="#dc2626" stroke="#ffffff"
      stroke-width="8" stroke-linejoin="round" paint-order="stroke">1 < 2 → từ chối</text><text
      x="1260" y="180" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Kho
      dữ liệu chặn người cũ</text><text x="1260" y="220" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">dù khoá đã hết hạn</text></svg></div>
    clear: true
    say: Mã chặn chữa lỗi này. Một bộ đếm tăng dần cấp mã chặn mỗi khi có người giữ
      khoá. Kho dữ liệu được ghi, ví dụ cơ sở dữ liệu, mới là nơi kiểm, chứ không
      phải Redis. Nó nhớ mã chặn lớn nhất đã thấy, ở đây là hai. Khi A ghi muộn với
      mã chặn một, kho thấy một nhỏ hơn hai và từ chối.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: độ trễ trung bình và an toàn của khoá'
  checks:
  - abs(1 + (1 - 0.9) * 20 - 3) < 1e-9
  - abs(alg.bnk_cache_avg(0.9, 1, 20) - 3) < 1e-9
  - alg.bnk_fencing_sim(True) == ['B']
  steps:
  - show: '<p><b>Bước 1.</b> Luôn hỏi bộ đệm: mọi lần tốn $c$ (thời gian bộ đệm, ở
      bảng đầu bài ghi là tđệm). Trượt (xác suất $1 - h$, với $h$ là tỉ lệ trúng)
      thì tốn thêm $d$ (thời gian cơ sở dữ liệu, ghi là tcsdl).</p>

      <span class=''note''>Làm thử: $h = 0{,}9$, $c = 1$, $d = 20$: trượt $0{,}1$
      lần, mỗi lần thêm $20$ ms.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì ta luôn hỏi bộ đệm trước, nên mọi lần đều tốn thời gian của
      bộ đệm, gọi là c, tức t đệm ở bảng đầu bài. Lần nào trượt, với xác suất một
      trừ h, trong đó h là tỉ lệ trúng, thì tốn thêm thời gian của cơ sở dữ liệu,
      gọi là d. Làm thử với h bằng không phẩy chín, mỗi lần trượt thêm hai mươi mili
      giây.
  - show: '<p><b>Bước 2.</b> Vì mọi lần tốn $c$ và chỉ phần trượt tốn thêm $d$, nên
      gộp lại: $T = c + (1 - h) \cdot d$.</p>

      <span class=''note''>Làm thử: $T = 1 + 0{,}1 \cdot 20 = 3$ ms.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì mọi lần tốn thời gian bộ đệm và chỉ phần trượt tốn thêm, nên
      gộp lại, trung bình T bằng thời gian bộ đệm cộng, một trừ h, nhân thời gian
      cơ sở dữ liệu. Làm thử, một cộng không phẩy một nhân hai mươi bằng ba mili giây.
    introduces:
    - cdot
  - show: '<p><b>Bước 3.</b> Khoá có hạn không bảo đảm “một người giữ”, vì người giữ
      có thể bị tạm dừng lâu hơn hạn. Kho dữ liệu được ghi phải kiểm <b>mã chặn</b>
      mới an toàn.</p>

      <span class=''note''>Làm thử: ghi mã 2 rồi mã 1 → kho dữ liệu nhận mã 2, từ
      chối mã 1.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, vì người giữ khoá có thể bị tạm dừng lâu hơn hạn, nên khoá có hạn
      không bảo đảm chỉ một người giữ. Kho dữ liệu được ghi phải kiểm mã chặn mới
      an toàn. Làm thử, ghi mã hai rồi mã một, kho dữ liệu nhận mã hai và từ chối
      mã một.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - abs(alg.bnk_cache_avg(0.9, 1, 20) - 3) < 1e-9
  - abs(alg.bnk_cache_avg(0.5, 1, 20) - 11) < 1e-9
  - abs(20 / 3 - 6.7) < 0.05
  - 12 - 10 == 2 and alg.bnk_fencing_sim(False)[-1] == 'A' and alg.bnk_fencing_sim(True)[-1]
    == 'B'
  steps:
  - show: '<p>Dùng $c = 1$ ms, $d = 20$ ms <i>(số minh hoạ)</i>.</p>

      $$① \; h = 0{,}9:\quad T = 1 + 0{,}1 \cdot 20 = \hlg{3}\ \text{ms}$$

      '
    focus:
    - 1
    - 2
    say: Dùng thời gian bộ đệm một mili giây và cơ sở dữ liệu hai mươi mili giây,
      đây là số minh hoạ. Phép tính thứ nhất, với h bằng không phẩy chín, T bằng một
      cộng không phẩy một nhân hai mươi, là ba mili giây.
  - show: $$② \; h = 0{,}5:\quad T = 1 + 0{,}5 \cdot 20 = \hl{11}\ \text{ms}$$
    say: Phép tính thứ hai, với h bằng không phẩy năm, T bằng một cộng không phẩy
      năm nhân hai mươi, là mười một mili giây.
  - show: '$$③ \; \text{không có bộ đệm: } T = \hl{20}\ \text{ms}$$'
    say: Phép tính thứ ba, không có bộ đệm, mọi lần đều hỏi cơ sở dữ liệu, nên T bằng
      hai mươi mili giây.
  - show: '<p>Dùng lại $T = 3$ ở ① và $20$ ở ③.</p>

      $$④ \; \text{nhanh gấp} \; \frac{20}{3} \approx \hlg{6{,}7}\ \text{lần}$$

      '
    say: Phép tính thứ tư, nhanh gấp hai mươi chia ba, xấp xỉ sáu phẩy bảy lần.
  - show: '<p>Khoá hạn $10$ giây, A tạm dừng tới giây $12$: quá hạn $12 - 10 = \hl{2}$
      giây.</p>

      $$⑤ \; \text{không mã chặn: ghi cuối là A (đè B)};\quad \text{có mã chặn: ghi
      cuối là B}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ năm, khoá hạn mười giây mà A tạm dừng tới giây mười hai, nên
      quá hạn hai giây. Không có mã chặn thì người ghi cuối là A, đè lên B. Có mã
      chặn thì người ghi cuối là B.
- id: chay_that
  kind: example
  title: 'Chạy thật: mô phỏng bộ đệm và mã chặn bằng Java'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      static kiểu tên(kiểu a, kiểu b)</code></td><td>khai một hàm: <b>kiểu trả về</b>
      (<code>void</code> là không trả gì), <b>tên</b>, rồi <b>tham số</b> trong ngoặc
      tròn, mỗi tham số là kiểu rồi tên; <code>static</code>: thuộc cả lớp; <code>public</code>:
      nơi khác gọi được</td><td><code>static long soDu(int tk)</code> — trả về số
      nguyên dài, nhận một số nguyên là mã tài khoản<br><code>static boolean ghi(long
      ma, String v)</code> — trả về đúng hoặc sai, nhận mã chặn và giá trị</td></tr></table>'
    clear: true
    say: Khai một hàm gồm kiểu giá trị trả về, rỗng nghĩa là không trả gì, rồi tên
      hàm, rồi các tham số trong ngoặc tròn, mỗi tham số là kiểu rồi tên. Chữ tĩnh
      nghĩa là hàm thuộc cả lớp, chữ công khai nghĩa là nơi khác gọi được. Ví dụ,
      hàm số dư nhận mã tài khoản, trả về số nguyên dài; hàm ghi nhận mã chặn và giá
      trị, trả về đúng hoặc sai.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      (int i = 0; i &lt; n; i++) { … }</code></td><td>vòng lặp: i bắt đầu từ 0, còn
      i &lt; n thì làm khối, mỗi vòng tăng i thêm 1</td><td><code>for (int i = 0;
      i &lt; 100; i++) soDu(i % 10);</code> — gọi 100 lần, i chạy từ 0 tới 99</td></tr><tr><td><code>if
      (điều_kiện) { … } else { … }</code></td><td>nếu điều kiện đúng thì làm khối
      đầu, không thì làm khối sau <code>else</code></td><td><code>if (boDem.containsKey(tk))
      { … }</code> — có trong bộ đệm thì trúng</td></tr><tr><td><code>x++</code>,
      <code>x += 5</code></td><td><code>x++</code>: tăng x thêm 1; <code>x += 5</code>:
      tăng x thêm 5</td><td><code>trung++;</code>, <code>tong += 1;</code></td></tr></table>'
    clear: true
    say: 'Vòng lặp có ba phần trong ngoặc: điểm bắt đầu, điều kiện để chạy tiếp, và
      bước tăng sau mỗi vòng. Nếu điều kiện đúng thì làm khối thứ nhất, nếu không
      thì làm khối còn lại. Hai dấu cộng tăng biến thêm một, còn cộng bằng tăng biến
      thêm đúng số đứng sau.'
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>"chữ"
      + giá_trị</code></td><td>dấu <code>+</code> giữa chữ và một giá trị nối chúng
      thành một chuỗi</td><td><code>"trung " + trung + "/100, trung binh " + …</code></td></tr></table>
    clear: true
    say: Dấu cộng giữa chữ và một giá trị nối chúng thành một chuỗi.
  - show: '<p><b>BoDem.java (phần 1): hỏi bộ đệm trước, trượt thì hỏi cơ sở dữ liệu
      rồi nạp</b></p><div class="code"><div><span class="kw">import</span> java.util.*;</div><div><span
      class="kw">public</span> <span class="kw">class</span> BoDem {</div><div>    <span
      class="kw">static</span> Map&lt;Integer, Long&gt; boDem = <span class="kw">new</span>
      HashMap&lt;&gt;();   <span class="cm">// giả lập Redis: khoá tra cứu -&gt; số
      dư</span></div><div>    <span class="kw">static</span> <span class="kw">long</span>
      tong = 0;</div><div>    <span class="kw">static</span> <span class="kw">int</span>
      trung = 0;</div><div>    <span class="kw">static</span> <span class="kw">long</span>
      soDu(<span class="kw">int</span> tk) {</div><div>        <span class="kw">if</span>
      (boDem.containsKey(tk)) { trung++; tong += 1; <span class="kw">return</span>
      boDem.get(tk); }   <span class="cm">// trúng: 1 ms</span></div><div>        tong
      += 1 + 20;   <span class="cm">// trượt: 1 ms bộ đệm + 20 ms cơ sở dữ liệu</span></div><div>        <span
      class="kw">long</span> v = tk * 1000L;   <span class="cm">// giả lập đọc từ
      cơ sở dữ liệu</span></div><div>        boDem.put(tk, v);   <span class="cm">//
      nạp vào bộ đệm</span></div><div>        <span class="kw">return</span> v;</div><div>    }</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta mô phỏng bộ đệm bằng Java, vì Redis thật cần cài riêng, còn cơ chế thì
      giống nhau. Một bản đồ đóng vai Redis. Khi hỏi số dư, nếu khoá đã có thì trúng,
      tốn một mili giây. Nếu chưa có thì trượt, tốn một mili giây hỏi bộ đệm cộng
      hai mươi mili giây hỏi cơ sở dữ liệu, rồi nạp kết quả vào bộ đệm.
    clear: true
  - show: '<p><b>Phần 2: một trăm lần hỏi, mười tài khoản</b></p><div class="code"><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) {</div><div>        <span class="kw">for</span> (<span class="kw">int</span>
      i = 0; i &lt; 100; i++) soDu(i % 10);   <span class="cm">// 100 lần hỏi, 10
      tài khoản</span></div><div>        System.out.println("trung " + trung + "/100,
      trung binh " + tong / 100.0 + " ms");</div><div>    }</div><div>}</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>trung 90/100, trung binh 3.0 ms</div></div><p
      class="note"><code>tong / 100.0</code>: có <code>.0</code> để phép chia cho
      ra số thập phân; chia cho <code>100</code> sẽ cắt phần lẻ.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Ta hỏi một trăm lần, quay vòng mười tài khoản. Mười lần đầu trượt, chín mươi
      lần sau trúng. Chương trình in chín mươi trúng trên một trăm, và trung bình
      ba mili giây. Chữ chấm không sau một trăm để phép chia ra số thập phân, chia
      cho một trăm thì cắt mất phần lẻ.
  - show: '<p><b>MaChan.java (phần 1): kho dữ liệu từ chối mã chặn cũ</b></p><div
      class="code"><div><span class="kw">public</span> <span class="kw">class</span>
      MaChan {</div><div>    <span class="kw">static</span> <span class="kw">long</span>
      maCuoi = 0;</div><div>    <span class="kw">static</span> String giaTri = "";</div><div>    <span
      class="kw">static</span> <span class="kw">boolean</span> ghi(<span class="kw">long</span>
      ma, String v) {</div><div>        <span class="kw">if</span> (ma &lt; maCuoi)
      <span class="kw">return</span> <span class="kw">false</span>;                   <span
      class="cm">// từ chối mã chặn cũ</span></div><div>        maCuoi = ma;</div><div>        giaTri
      = v;</div><div>        <span class="kw">return</span> <span class="kw">true</span>;</div><div>    }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ là mã chặn. Kho dữ liệu được ghi nhớ mã chặn lớn nhất đã thấy, và
      từ chối mọi lần ghi mang mã nhỏ hơn.
  - show: '<p><b>Phần 2: B ghi trước, A ghi muộn</b></p><div class="code"><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) {</div><div>        System.out.println("B ghi (ma 34): "
      + ghi(34, "B"));              <span class="cm">// B lấy khoá sau, mã 34</span></div><div>        System.out.println("A
      tinh day ghi (ma 33): " + ghi(33, "A"));     <span class="cm">// A tạm dừng
      rồi ghi muộn</span></div><div>        System.out.println("gia tri cuoi: " +
      giaTri);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Người B lấy khoá sau nên mang mã ba mươi bốn và ghi trước. Người A mang mã
      ba mươi ba, bị tạm dừng quá hạn rồi mới tỉnh dậy và ghi.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>B ghi (ma 34): true</div><div>A
      tinh day ghi (ma 33): false</div><div>gia tri cuoi: B</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Khi chạy thật, lần ghi của B được nhận. Lần ghi muộn của A bị từ chối vì
      mã cũ hơn, nên giá trị cuối cùng là của B.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tính theo từng trường hợp'
  checks:
  - (90 * 1 + 10 * 21) / 100 == 3.0
  - abs(alg.bnk_cache_avg(0.99, 1, 20) - 1.2) < 1e-9
  - abs(20 / 1.2 - 16.7) < 0.05
  - abs(20 / 11 - 1.8) < 0.05
  steps:
  - show: '<p>Đường khác: vì mỗi trường hợp có độ trễ riêng, ta tính theo từng trường
      hợp thay vì công thức. Trong $100$ lần, $90$ lần trúng tốn $1$ ms, $10$ lần
      trượt tốn $1 + 20$ ms.</p>

      $$\frac{90 \cdot 1 + 10 \cdot 21}{100} = \frac{300}{100} = \hl{3}\ \text{ms}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Kiểm bằng đường khác. Thay vì dùng công thức, ta tính theo từng trường hợp.
      Trong một trăm lần, chín mươi lần trúng tốn một mili giây, mười lần trượt tốn
      hai mươi mốt mili giây. Cộng lại được ba trăm, nên chia một trăm bằng ba mili
      giây, khớp công thức.
  - show: <table class='t'><tr><th>tỉ lệ trúng</th><th>độ trễ trung bình</th><th>so
      với 20 ms</th></tr><tr><td>0,5</td><td>11 ms</td><td>nhanh 1,8 lần</td></tr><tr><td>0,9</td><td>3
      ms</td><td>nhanh 6,7 lần</td></tr><tr><td>0,99</td><td>1,2 ms</td><td>nhanh
      16,7 lần</td></tr></table>
    say: Vì phần trượt tốn nhiều nhất, nên từ không phẩy năm lên không phẩy chín chín,
      độ trễ giảm từ mười một xuống một phẩy hai mili giây.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Lưu <b>số dư</b> trong bộ
      đệm rồi dùng nó để quyết định trừ tiền. Bộ đệm có thể cũ. Số dư thật để quyết
      định luôn đọc từ cơ sở dữ liệu nguồn.</div>
    say: Lỗi thứ nhất, của người mới. Lưu số dư trong bộ đệm rồi dùng nó để quyết
      định trừ tiền. Bộ đệm có thể chứa dữ liệu đã cũ. Số dư dùng để quyết định phải
      luôn đọc từ cơ sở dữ liệu nguồn.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Bộ
      đệm hết hạn cùng lúc</b>: nghìn khoá cùng hạn $60$ giây, đến giờ tất cả trượt,
      nghìn truy vấn đổ về cơ sở dữ liệu cùng lúc.

      <br><span class="note">Cách chữa: cộng thêm một số ngẫu nhiên nhỏ vào hạn, và
      chỉ cho một yêu cầu nạp lại mỗi khoá.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là bộ đệm hết hạn cùng lúc. Hàng nghìn
      khoá cùng hạn sáu mươi giây, đến giờ tất cả trượt, nghìn truy vấn đổ về cơ sở
      dữ liệu cùng lúc. Cách chữa là cộng thêm một số ngẫu nhiên nhỏ vào hạn, và chỉ
      cho một yêu cầu nạp lại mỗi khoá.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tin khoá phân tán
      là đủ để bảo vệ việc ghi tiền. Khoá có hạn có thể bị hai người cùng giữ. Hãy
      để <b>cơ sở dữ liệu</b> chặn: ràng buộc duy nhất (cấm hai dòng trùng giá trị),
      hoặc cột phiên bản (mỗi lần sửa tăng 1; câu sửa chỉ thành công nếu phiên bản
      còn như lúc đọc).</div>'
    say: Lỗi thứ ba, cũng của người đã đi làm, là tin khoá phân tán là đủ để bảo vệ
      việc ghi tiền. Khoá có hạn có thể bị hai người cùng giữ. Hãy để cơ sở dữ liệu
      chặn, bằng ràng buộc duy nhất, tức cấm hai dòng trùng giá trị. Hoặc dùng cột
      phiên bản. Mỗi lần sửa thì phiên bản tăng một, và câu sửa chỉ thành công nếu
      phiên bản vẫn còn như lúc đọc.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - abs(alg.bnk_cache_avg(0.8, 2, 30) - 8) < 1e-9
  - abs(30 / 8 - 3.75) < 1e-9
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>tđệm
      = 2 ms, tcsdl = 30 ms, tỉ lệ trúng 0,8. Độ trễ trung bình?</td></tr><tr><td>2</td><td>Nhanh
      hơn không có bộ đệm bao nhiêu lần?</td></tr><tr><td>3</td><td>Quyết định: dùng
      khoá Redis để bảo vệ việc trừ tiền?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, thời gian bộ đệm hai mili giây,
      cơ sở dữ liệu ba mươi mili giây, tỉ lệ trúng không phẩy tám, độ trễ trung bình
      là bao nhiêu? Câu hai, nhanh hơn không có bộ đệm bao nhiêu lần? Câu ba, có nên
      dùng khoá Redis để bảo vệ việc trừ tiền không? Hãy dừng video và làm ra giấy.
  - show: $$T = 2 + 0{,}2 \cdot 30 = 2 + 6 = \hl{8}\ \text{ms}$$
    say: Đáp án câu một. T bằng hai cộng không phẩy hai nhân ba mươi, bằng hai cộng
      sáu, là tám mili giây.
    clear: true
  - show: $$\frac{30}{8} = \hlg{3{,}75}\ \text{lần}$$
    say: Đáp án câu hai. Ba mươi chia tám bằng ba phẩy bảy mươi lăm lần.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>chỉ
      khoá Redis</td><td>nhanh, dễ viết</td><td>khoá hết hạn có thể bị hai người cùng
      giữ, có thể trừ trùng</td></tr><tr><td>khoá Redis + ràng buộc / cột phiên bản
      ở cơ sở dữ liệu</td><td>khoá giảm tranh chấp, cơ sở dữ liệu bảo đảm đúng</td><td>thêm
      mã</td></tr></table>
    say: Đáp án câu ba. Chỉ dùng khoá Redis thì nhanh nhưng có thể trừ trùng. Nên
      dùng khoá để giảm tranh chấp, và để cơ sở dữ liệu bảo đảm tính đúng bằng ràng
      buộc hoặc cột phiên bản.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: bộ đệm giữ cơ sở dữ liệu khỏi quá tải được tới đâu?'
  checks:
  - 100 * 0.02 == 2.0
  - round(10000 * 0.02) == 200
  - round(1000000 * 0.02) == 20000
  - round(2 * 0.1, 2) == 0.2
  - round(200 * 0.1) == 20
  - round(20000 * 0.1) == 2000
  - round(2 * 0.01, 2) == 0.02
  - round(200 * 0.01) == 2
  - round(20000 * 0.01) == 200
  steps:
  - show: '<p>Mỗi lần hỏi cơ sở dữ liệu giữ một kết nối $20$ ms (số minh hoạ). Số
      kết nối bận trung bình bằng số lần hỏi mỗi giây nhân thời gian giữ (định luật
      Little):</p>

      $$\text{kết nối bận} = \text{lần hỏi mỗi giây} \cdot 0{,}02$$<table class=''t''><tr><th>tải</th><th>yêu
      cầu mỗi giây</th><th>không bộ đệm</th><th>trúng 90%</th><th>trúng 99%</th></tr><tr><td><span
      style="white-space:nowrap">×1</span></td><td>100</td><td>2</td><td>0,2</td><td>0,02</td></tr><tr><td><span
      style="white-space:nowrap">×100</span></td><td>10 000</td><td>200</td><td>20</td><td>2</td></tr><tr><td><span
      style="white-space:nowrap">×10 000</span></td><td>1 000 000</td><td><b>20 000</b></td><td><b>2
      000</b></td><td><b>200</b></td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Mỗi lần hỏi cơ sở dữ liệu giữ một kết nối hai mươi mili giây. Số kết nối
      bận trung bình bằng số lần hỏi mỗi giây nhân thời gian giữ, tức nhân không phẩy
      không hai. Ở một trăm yêu cầu mỗi giây, không có bộ đệm thì cần hai kết nối.
      Tải tăng một trăm lần cần hai trăm. Tải tăng mười nghìn lần cần hai mươi nghìn.
      Bộ đệm trúng chín mươi phần trăm cắt con số này còn một phần mười, trúng chín
      mươi chín phần trăm còn một phần trăm.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Bộ đệm trúng 90% cứu
      được ×100 (cần 20 kết nối, một nhóm kết nối vài chục là đủ) nhưng ở ×10 000
      vẫn cần 2 000: gãy. Tăng tỉ lệ trúng lên 99% còn 200; muốn xuống mười thì phải
      trúng <b>99,95%</b> (20 000 × 0,0005 = 10), mà tỉ lệ trúng càng cao càng khó.

      Thêm một cạm bẫy: khi nhiều mục cùng hết hạn một lúc, mọi yêu cầu cùng trượt
      và dồn xuống cơ sở dữ liệu.</div>

      <div class="box key"><b>Đánh đổi:</b> sống lâu hơn thì trúng nhiều hơn nhưng
      số dư hiển thị có thể <b>cũ</b>; số dư tiền thật phải ghi và đọc có kiểm soát.
      Ở quy mô lớn còn phải chia cơ sở dữ liệu và đặt hạn hết hạn ngẫu nhiên để tránh
      dồn cục.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bộ đệm trúng chín mươi phần trăm cứu được tải gấp trăm lần, cần hai mươi
      kết nối, một nhóm kết nối, tức số kết nối mở sẵn để dùng chung, vài chục là
      đủ. Nhưng ở tải gấp mười nghìn lần vẫn cần hai nghìn, nên gãy. Tăng tỉ lệ trúng
      lên chín mươi chín phần trăm còn hai trăm, còn muốn xuống mười thì phải trúng
      chín mươi chín phẩy chín mươi lăm phần trăm. Một cạm bẫy khác là nhiều mục cùng
      hết hạn một lúc, mọi yêu cầu cùng trượt và dồn xuống cơ sở dữ liệu. Đánh đổi
      là sống lâu hơn thì trúng nhiều hơn, nhưng số dư hiển thị có thể cũ. Ở quy mô
      lớn phải chia cơ sở dữ liệu và đặt hạn hết hạn ngẫu nhiên.
- id: practice
  kind: practice
  title: 'Tự làm: bộ đệm nhỏ, bốn tài khoản'
  steps:
  - show: '<p><b>Đề</b>: trúng bộ đệm 2 ms; trượt 2 + 30 ms. Viết <code>BoDemNho.java</code>:</p>

      <ol><li>bộ đệm <code>Map&lt;Integer, Long&gt;</code>; hàm <code>soDu(tk)</code>:
      có thì trúng, không thì trượt rồi nạp <code>tk * 1000L</code></li>

      <li>gọi <code>soDu(i % 4)</code> cho <code>i</code> từ 0 tới 39</li>

      <li>in <code>trung …/40, trung binh … ms</code></li></ol>

      <p class="note">Phần thêm (không chấm): thư mục <code>ma_chan/</code> của lab
      có <code>MaChan.java</code> để thử đổi mã chặn.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 150
    say: 'Bây giờ tới phần bạn tự làm. Trúng bộ đệm tốn hai mili giây, trượt tốn hai
      cộng ba mươi mili giây. Hãy viết chương trình với một bản đồ làm bộ đệm, và
      một hàm hỏi số dư: có trong bộ đệm thì tính trúng, chưa có thì tính trượt rồi
      nạp vào. Gọi hàm bốn mươi lần, quay vòng bốn tài khoản, rồi in số lần trúng
      và độ trễ trung bình. Hãy dừng video, tự viết và chạy. Nếu còn sức, làm phần
      thêm trong thư mục thực hành.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>trung 36/40, trung
      binh 5.0 ms</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      BNK L06 BoDemNho.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mô theo <code>BoDem</code>: <code>if
      (boDem.containsKey(tk)) { trung++; tong += 2; return boDem.get(tk); }</code>,
      còn lại <code>tong += 2 + 30;</code>, nạp bằng <code>boDem.put(tk, v)</code>.

      Độ trễ trung bình là <code>tong / 40.0</code>. Lời giải ở <code>labs/BNK/L06/loi_giai.java</code>
      — chỉ mở sau khi bạn đã thử.</div>

      '
    say: 'Nếu kẹt, làm theo mẫu ví dụ: nếu bản đồ đã có khoá thì cộng độ trễ trúng,
      nếu chưa thì cộng độ trễ trượt rồi nạp. Độ trễ trung bình là tổng chia bốn mươi,
      viết dưới dạng số thực. Lời giải đầy đủ nằm trong thư mục thực hành của bài,
      chỉ mở sau khi bạn đã tự thử.'
    clear: true
  lab: labs/BNK/L06
