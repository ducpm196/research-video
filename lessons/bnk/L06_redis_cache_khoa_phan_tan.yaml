      x="1050" y="78" font-size="22" text-anchor="middle" fill="#16a34a" stroke="#ffffff"
      stroke-width="8" stroke-linejoin="round" paint-order="stroke">trúng → trả</text><line
      x1="260" y1="220" x2="555" y2="300" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="40" y="320" font-size="22" text-anchor="start" fill="#2a78d6" stroke="#ffffff"
