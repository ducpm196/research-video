      tiếp</text><line x1="945" y1="330" x2="1100" y2="330" stroke="#475569" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="1250" y="100" font-size="26" text-anchor="middle"
      fill="#16a34a" font-weight="bold">90 trong 100 lần</text><text x="1250" y="340"
      font-size="26" text-anchor="middle" fill="#d97706" font-weight="bold">10 trong
      100 lần</text></svg></div>
    clear: true
    say: Hình cho thấy kiểu hỏi bộ đệm trước. Trước tiên, dịch vụ sẽ hỏi Redis trước.
      Nếu trúng thì trả luôn, chỉ mất một mili giây, và đó là chín mươi trong một
      trăm lần. Nếu trượt thì hỏi tiếp cơ sở dữ liệu, mất thêm hai mươi mili giây,
      và đó là mười trong một trăm lần.
  - show: '<div><svg width="1500" height="460" viewBox="0 0 1500 460" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
