scenes:
- id: hook
  kind: hook
  title: Vì sao bộ đệm làm nhanh gấp nhiều lần, và vì sao khoá phân tán vẫn có thể
    sai?
  steps:
  - show: '<p>Mỗi lần tra số dư mất $20$ ms ở cơ sở dữ liệu <i>(số minh hoạ)</i>.
      Có bộ đệm mất $1$ ms mỗi lần hỏi, với tỉ lệ trúng $90\%$, trung bình chỉ còn
      khoảng <b>3 ms</b>.</p>

      <div class="box key">Nhưng một khoá phân tán có hạn <b>10 giây</b> vẫn có thể
      bị <b>hai người cùng giữ</b> nếu một người bị tạm dừng.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, giả sử mỗi lần tra số dư mất hai mươi mili giây ở cơ sở dữ liệu,
      đây là số minh hoạ. Có bộ đệm mất một mili giây mỗi lần hỏi, với tỉ lệ trúng
      chín mươi phần trăm, trung bình chỉ còn khoảng ba mili giây. Nhưng một khoá
      phân tán có hạn mười giây vẫn có thể bị hai người cùng giữ, nếu một người bị
      tạm dừng.
  - show: <table class='t'><tr><th>ý hỏi</th><th>bài này trả lời</th></tr><tr><td>bộ
      đệm nhanh hơn bao nhiêu</td><td>độ trễ trung bình = tđệm + (1 − tỉ lệ trúng)
      × tcsdl</td></tr><tr><td>khoá có hạn sai ở đâu</td><td>người giữ khoá bị tạm
      dừng quá hạn rồi vẫn ghi</td></tr><tr><td>chữa thế nào</td><td>mã chặn tăng
      dần, nơi lưu từ chối mã cũ</td></tr></table>
    say: Hôm nay ta trả lời ba câu. Bộ đệm nhanh hơn bao nhiêu, nhờ một công thức
      đơn giản. Khoá có hạn sai ở đâu, khi người giữ khoá bị tạm dừng quá hạn rồi
      vẫn ghi. Và cách chữa, là mã chặn tăng dần để nơi lưu từ chối mã cũ.
- id: prereq
  kind: prereq
  title: 'Trước hết: những điều cần hiểu'
  checks:
  - abs(0.9 + 0.1 - 1) < 1e-12
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Bộ đệm (cache)</td><td>nơi giữ tạm một bản sao dữ liệu ở chỗ đọc nhanh, để khỏi
      hỏi nơi gốc chậm hơn</td><td>bản sao số dư trong bộ nhớ</td></tr><tr><td>② Redis</td><td>một
      kho “tên tra cứu → giá trị” chạy trong bộ nhớ, hay dùng làm bộ đệm</td><td>tên
      <code>so_du:42</code> → giá trị 1500000</td></tr><tr><td>③ Hai nghĩa của “khoá”</td><td>khoá
      tra cứu (key): cái tên để tìm giá trị; khoá giữ quyền (lock): ai giữ thì được
      làm, người khác phải chờ</td><td>key <code>so_du:42</code>; lock trên tài khoản
      42</td></tr></table>'
    say: Trước hết ta cần hiểu vài điều. Bộ đệm là nơi giữ tạm một bản sao dữ liệu
      ở chỗ đọc nhanh, để khỏi phải hỏi nơi gốc chậm hơn. Redis là một kho tên tra
      cứu và giá trị chạy trong bộ nhớ, hay được dùng làm bộ đệm. Ví dụ tên số dư
      của tài khoản bốn mươi hai trả về một triệu năm trăm nghìn. Chú ý chữ khoá có
      hai nghĩa. Khoá tra cứu là cái tên để tìm giá trị. Còn khoá giữ quyền thì ai
      giữ được làm việc, người khác phải chờ.
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Khoá phân tán</td><td>khoá giữ quyền dùng chung giữa nhiều máy chủ, đặt ở một
      nơi lưu chung như Redis</td><td>hai máy chủ cùng muốn sửa tài khoản 42</td></tr><tr><td>⑤
      Hết hạn (TTL)</td><td>mỗi mục tự biến mất sau một thời gian</td><td>hạn 60 giây</td></tr><tr><td>⑥
      Độ trễ</td><td>thời gian từ lúc hỏi tới lúc có đáp</td><td>bộ đệm 1 ms, cơ sở
      dữ liệu 20 ms (số minh hoạ)</td></tr></table>
    clear: true
    say: Khoá phân tán là khoá giữ quyền dùng chung giữa nhiều máy chủ, đặt ở một
      nơi lưu chung như Redis. Mỗi mục trong kho có thể tự hết hạn sau một thời gian.
      Độ trễ là thời gian từ lúc hỏi tới lúc có đáp, ví dụ minh hoạ là bộ đệm một
      mili giây, cơ sở dữ liệu hai mươi mili giây.
  - show: $$0{,}9 + 0{,}1 = 1$$
    say: Một phép kiểm nhỏ. Tỉ lệ trúng cộng tỉ lệ trượt luôn bằng một. Không phẩy
      chín cộng không phẩy một bằng một.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>cache-aside</td><td>hỏi
      bộ đệm trước; trượt thì hỏi cơ sở dữ liệu rồi nạp vào bộ đệm</td></tr><tr><td>hit
      / miss</td><td>trúng bộ đệm / trượt bộ đệm</td></tr><tr><td>TTL</td><td>thời
      gian sống của một mục trước khi tự xoá</td></tr><tr><td>SET key value NX PX
      10000</td><td>lệnh Redis đặt khoá chỉ khi chưa có (NX), hết hạn sau 10 000 mili
      giây (PX)</td></tr><tr><td>fencing token (mã chặn)</td><td>số tăng dần cấp kèm
      mỗi lần giữ khoá, nơi lưu dùng để từ chối người cũ; lệnh SET NX PX (và cả thuật
      toán Redlock dùng nhiều máy Redis) không tự cấp, phải lấy từ một bộ đếm tăng
      dần</td></tr><tr><td>nhả khoá</td><td>so giá trị mình đã đặt rồi mới xoá, gộp
      thành một bước không chen được (Redis chạy một đoạn lệnh nhỏ); không xoá thẳng</td></tr></table>
    say: Bảng dưới đây giải nghĩa sáu thuật ngữ mà bài sẽ dùng. Kiểu hỏi bộ đệm trước,
      trượt thì hỏi cơ sở dữ liệu rồi nạp vào bộ đệm. Trúng là có trong bộ đệm, trượt
      là không có. Thời gian sống là hạn tự xoá của mỗi mục. Lệnh đặt khoá có hai
      tuỳ chọn, chỉ đặt khi chưa có, và tự hết hạn. Mã chặn là số tăng dần để nơi
      lưu từ chối người giữ khoá cũ. Lệnh đặt khoá không tự cấp mã chặn, nên phải
      lấy từ một bộ đếm tăng dần. Cuối cùng, khi nhả khoá, phải so giá trị mình đã
      đặt rồi mới xoá, gộp thành một bước không ai chen vào được, để không xoá nhầm
      khoá của người khác.
