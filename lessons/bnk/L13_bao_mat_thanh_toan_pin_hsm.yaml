- id: formula
  kind: formula
  title: 'Suy ra từng bước: khối PIN, MAC và quy tắc sinh trắc học'
  checks:
  - alg.bnk_pin_block0('1234', '4111111111111111') == '041225EEEEEEEEEE'
  - alg.bnk_mac('k', 'amt=500000') != alg.bnk_mac('k', 'amt=900000')
  - '(lambda amt, day: amt > 10000000 or day + amt > 20000000)(15000000, 0) and not
    (lambda amt, day: amt > 10000000 or day + amt > 20000000)(5000000, 0)'
  steps:
  - show: '<p><b>Bước 1.</b> Khối PIN $= (\text{PIN đệm}) \text{ XOR } (\text{PAN
      đệm})$. Vì XOR hai lần trả về ban đầu, bên có khoá và số thẻ khôi phục được
      PIN.</p>

      <span class=''note''>Làm thử: PIN thử 1234, thẻ thử 4111111111111111 → <code>041225EEEEEEEEEE</code>.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, khối PIN bằng PIN đã đệm XOR với số thẻ đã đệm. Vì XOR hai lần
      trả về ban đầu, nên bên có khoá và số thẻ khôi phục được PIN. Làm thử, PIN thử
      một hai ba bốn với thẻ thử cho khối không bốn một hai hai năm rồi các chữ E.
  - show: '<p><b>Bước 2.</b> MAC tính từ <b>khoá bí mật và nội dung</b>. Sửa một ký
      tự thì MAC mới khác MAC cũ, bên nhận phát hiện ngay.</p>

      <span class=''note''>Làm thử: tiền $500\,000$ đổi thành $900\,000$ → MAC khác.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì MAC được tính từ khoá bí mật và nội dung, nên sửa một ký tự
      thì MAC mới khác MAC cũ, và bên nhận phát hiện ngay. Làm thử, đổi tiền từ năm
      trăm nghìn thành chín trăm nghìn thì MAC khác hẳn.
  - show: '<p><b>Bước 3.</b> Theo Quyết định 2345/QĐ-NHNN của Ngân hàng Nhà nước (ký
      18/12/2023, hiệu lực 01/07/2024), chuyển tiền trực tuyến <b>trên $10$ triệu
      đồng</b> một giao dịch, hoặc khi <b>tổng trong ngày vượt $20$ triệu đồng</b>,
      phải xác thực sinh trắc học.</p>

      <span class=''note''>Làm thử: $15$ triệu → cần. $5$ triệu, ngày chưa có gì →
      không.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước ba nói về Quyết định hai nghìn ba trăm bốn mươi lăm của Ngân hàng Nhà
      nước, ký ngày mười tám tháng mười hai năm hai nghìn không trăm hai mươi ba.
      Quyết định này có hiệu lực từ ngày một tháng bảy năm hai nghìn không trăm hai
      mươi tư. Theo quyết định này, chuyển tiền trực tuyến phải xác thực sinh trắc
      học khi một giao dịch trên mười triệu đồng. Khi tổng trong ngày vượt hai mươi
      triệu đồng cũng phải xác thực. Làm thử, mười lăm triệu thì cần, năm triệu khi
      ngày chưa có giao dịch nào thì không.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 0x34 ^ 0x11 == 0x25
  - 0xFF ^ 0x11 == 0xEE
  - alg.bnk_pin_block0('1234', '4111111111111111') == '0412' + '25' + 'EE' * 5
  - ('0' + str(len('1234')) + '1234').ljust(16, 'F') == '041234FFFFFFFFFF' and len('041234FFFFFFFFFF')
    == 16
  - 'not (lambda amt, day: amt > 10000000 or day + amt > 20000000)(8000000, 8000000)
    and (lambda amt, day: amt > 10000000 or day + amt > 20000000)(8000000, 16000000)'
  - 8 + 8 == 16 <= 20 < 16 + 8
  steps:
  - show: '<p>PIN thử <code>1234</code> đệm thành <code>041234FFFFFFFFFF</code> (0:
      mã định dạng 0; 4: PIN dài 4 chữ số; F lấp cho đủ 16 chữ số). Thẻ thử <code>4111111111111111</code>:
      bỏ số kiểm cuối, lấy $12$ số cuối còn lại rồi đệm.</p>

      $$① \; \text{PAN đệm} = \mathtt{0000\,111111111111}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Ta tính một khối PIN với dữ liệu thử. PIN một hai ba bốn được đệm thành không
      bốn một hai ba bốn rồi các chữ F. Chữ số không đầu là mã định dạng, chữ số bốn
      là độ dài của PIN, còn chữ F lấp cho đủ mười sáu chữ số. Thẻ thử, bỏ số kiểm
      cuối, lấy mười hai số cuối còn lại rồi đệm bốn số không phía trước. Phép tính
      thứ nhất ra dãy PAN đã đệm.
  - show: '<p>Hai byte đầu: $\mathtt{04}\ \text{ XOR }\ \mathtt{00} = \mathtt{04}$
      và $\mathtt{12}\ \text{ XOR }\ \mathtt{00} = \mathtt{12}$.</p>

      $$② \; \mathtt{34} \text{ XOR } \mathtt{11} = \hl{\mathtt{25}}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, hai byte đầu XOR với không nên giữ nguyên là không bốn
      và một hai. Khúc tiếp theo, ba bốn XOR một một, cho hai năm.
  - show: $$③ \; \mathtt{FF} \text{ XOR } \mathtt{11} = \hl{\mathtt{EE}}\quad \text{(lặp
      5 lần)}$$
    clear: true
    say: Phép tính thứ ba, F F XOR một một cho E E, và lặp lại năm lần ở các byte
      còn lại.
  - show: '<p>Ghép lại: $\mathtt{04}\ \mathtt{12}\ \mathtt{25}\ \mathtt{EE}\ \mathtt{EE}\
      \mathtt{EE}\ \mathtt{EE}\ \mathtt{EE}$.</p>

      $$④ \; \text{khối PIN} = \hlg{\mathtt{041225EEEEEEEEEE}}$$

      '
    say: Phép tính thứ tư, ghép lại, khối PIN là không bốn một hai hai năm rồi năm
      cặp E E.
  - show: '<p>Quy tắc sinh trắc học (minh hoạ ranh giới). Ba giao dịch trong ngày:
      $8$, $8$, $8$ triệu.</p>

      $$⑤ \; 8 + 8 = 16 \le 20\ \text{(không)},\quad 16 + 8 = 24 > 20\ \Rightarrow\
      \hl{\text{giao dịch thứ 3 cần}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ năm, ba giao dịch trong ngày, mỗi giao dịch tám triệu. Giao
      dịch thứ hai, cộng dồn mười sáu triệu, chưa vượt hai mươi. Giao dịch thứ ba,
      cộng dồn hai mươi bốn triệu, vượt hai mươi, nên giao dịch thứ ba cần sinh trắc
      học.
    introduces:
    - implies
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: Luhn, che số thẻ và MAC'
  checks:
  - alg.bnk_luhn('4111111111111111') and not alg.bnk_luhn('4111111111111112')
  - 'sum((lambda d: d - 9 if d > 9 else d)(int(c) * (2 if i % 2 else 1)) for i, c
    in enumerate(reversed(''4111111111111111''))) == 30 == 8 + 14 + 8'
  - '(lambda p: p[:6] + ''*'' * (len(p) - 10) + p[-4:])(''4111111111111111'') == ''411111******1111'''
  - alg.bnk_mac('k', 'amt=500000')[:16] == '7625fd27947ee367' and alg.bnk_mac('k',
    'amt=900000')[:16] == '7958d294fb89b6dc'
  steps:
  - show: '<p>Đường khác cho ba việc: (a) số thẻ thử qua phép kiểm <b>Luhn</b>; (b)
      che thẻ giữ $6$ số đầu và $4$ số cuối; (c) đổi một chữ số trong bản tin thì
      <b>MAC khác</b>.</p>

      $$\text{(b)}\ \mathtt{411111}\,******\,\mathtt{1111}$$

      <p class="small">(a) Luhn: từ phải sang, nhân đôi mỗi chữ số thứ hai (quá 9
      thì trừ 9), cộng tất cả; tổng chia hết cho 10 là hợp lệ. Thẻ thử: tám chữ số
      1 giữ nguyên cho $8$, bảy chữ số 1 nhân đôi cho $14$, chữ số 4 nhân đôi cho
      $8$: $8 + 14 + 8 = 30$ ✓.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 3
    - 3
    - 3
    clear: true
    say: Kiểm bằng đường khác cho ba việc. Một, số thẻ thử qua phép kiểm số kiểm cuối.
      Hai, che thẻ, giữ sáu số đầu và bốn số cuối. Ba, đổi một chữ số trong bản tin
      thì MAC khác. Phép kiểm số kiểm cuối làm thế này. Đi từ phải sang, nhân đôi
      mỗi chữ số thứ hai, nếu quá chín thì trừ chín, rồi cộng tất cả, và tổng chia
      hết cho mười là hợp lệ. Với thẻ thử, tám chữ số một giữ nguyên cho tám, bảy
      chữ số một nhân đôi cho mười bốn, chữ số bốn nhân đôi cho tám. Tổng là ba mươi,
      chia hết cho mười. Vì mỗi việc đều tính bằng chương trình, nên kết quả đáng
      tin hơn tính tay.
  - show: <table class='t'><tr><th>bản tin</th><th>MAC (16 ký tự đầu, khoá thử)</th><th>bên
      nhận kết luận</th></tr><tr><td>amt=500000</td><td>7625fd27947ee367</td><td>nguyên
      vẹn</td></tr><tr><td>amt=900000</td><td>7958d294fb89b6dc</td><td>bị sửa, từ
      chối</td></tr></table>
    say: Bảng này cho thấy hai bản tin chỉ khác nhau ở số tiền nhưng MAC hoàn toàn
      khác. Vì bên nhận tính lại MAC từ khoá và nội dung, nên bản tin bị sửa không
      khớp và bị từ chối. Lưu ý đây là minh hoạ, chuẩn thẻ dùng thuật toán MAC riêng.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ “mã hoá” là đủ nên
      ghi cả PIN mã hoá vào nhật ký. PIN, kể cả đã mã hoá, <b class="red">không được
      lưu</b> sau khi xử lý xong.</div>
    say: Lỗi thứ nhất, của người mới. Nghĩ mã hoá là đủ nên ghi cả PIN đã mã hoá vào
      nhật ký. PIN, kể cả đã mã hoá, không được lưu sau khi xử lý xong.
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Để
      khoá trong mã nguồn hay tệp cấu hình</b>. Ai đọc được kho mã là có khoá. Khoá
      phải nằm trong HSM hoặc kho khoá chuyên dụng, và xoay vòng định kỳ.</div>
    say: Lỗi thứ hai, của người đã đi làm, là để khoá trong mã nguồn hay tệp cấu hình.
      Ai đọc được kho mã là có khoá. Khoá phải nằm trong HSM hoặc kho khoá chuyên
      dụng, và được xoay vòng định kỳ.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Chỉ kiểm sinh trắc
      học ở <b>ứng dụng</b>. Kẻ tấn công gọi thẳng API sẽ bỏ qua. Máy chủ phải kiểm
      lại điều kiện cho mọi giao dịch, không tin cờ (giá trị báo “đã xác thực”) do
      ứng dụng gửi lên.</div>
    say: Lỗi thứ ba, cũng của người đã đi làm, là chỉ kiểm sinh trắc học ở ứng dụng.
      Kẻ tấn công gọi thẳng giao diện lập trình sẽ bỏ qua. Máy chủ phải kiểm lại điều
      kiện cho mọi giao dịch, không tin cờ, tức giá trị báo đã xác thực, do ứng dụng
      gửi lên.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '(lambda amt, day: amt > 10000000 or day + amt > 20000000)(12000000, 0)'
  - 'not (lambda amt, day: amt > 10000000 or day + amt > 20000000)(7000000, 6000000)
    and not (lambda amt, day: amt > 10000000 or day + amt > 20000000)(6000000, 0)
    and (lambda amt, day: amt > 10000000 or day + amt > 20000000)(9000000, 13000000)'
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Khách
      chuyển 12 triệu một lần, ngày chưa có giao dịch nào. Có cần sinh trắc học?</td></tr><tr><td>2</td><td>Khách
      chuyển 6 triệu rồi 7 triệu rồi 9 triệu. Giao dịch nào đầu tiên cần?</td></tr><tr><td>3</td><td>Quyết
      định: ghi số thẻ nguyên vào nhật ký để gỡ lỗi nhanh?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, khách chuyển mười hai triệu một
      lần, ngày chưa có giao dịch nào, có cần sinh trắc học không? Câu hai, khách
      chuyển sáu triệu, rồi bảy triệu, rồi chín triệu, giao dịch nào đầu tiên cần?
      Câu ba, có nên ghi số thẻ nguyên vào nhật ký để gỡ lỗi nhanh không? Hãy dừng
      video và làm ra giấy.
  - show: '<p>Câu 1: $12 > 10$ triệu một giao dịch.</p>

      $$\hl{\text{cần}}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một. Mười hai triệu lớn hơn mười triệu cho một giao dịch, nên
      cần.
    clear: true
  - show: '<p>Câu 2: cộng dồn $6 \to 6 + 7 = 13 \to 13 + 9 = 22$. Mỗi giao dịch riêng
      đều dưới $10$ triệu; chỉ cộng dồn $22 > 20$.</p>

      $$\hl{\text{giao dịch thứ 3}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu hai. Cộng dồn sáu, rồi mười ba, rồi hai mươi hai. Mỗi giao dịch
      riêng đều dưới mười triệu, nhưng cộng dồn hai mươi hai vượt hai mươi, nên giao
      dịch thứ ba cần.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>ghi
      nguyên số thẻ</td><td>gỡ lỗi nhanh</td><td>rò rỉ dữ liệu thẻ, vi phạm yêu cầu
      bảo mật</td></tr><tr><td>che số thẻ, ghi mã vết</td><td>vẫn tra soát được, an
      toàn</td><td>thêm một bước tra cứu</td></tr></table>
    say: Đáp án câu ba. Không ghi nguyên số thẻ. Hãy che số thẻ và ghi mã vết để tra
      soát, an toàn hơn dù thêm một bước tra cứu.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>che dữ liệu nhạy cảm</span><span class='a'>→</span><span
      class='n'>khoá nằm trong HSM</span><span class='a'>→</span><span class='n'>MAC
      phát hiện sửa</span><span class='a'>→</span><span class='n'>máy chủ tự kiểm
      điều kiện</span></div>
    say: Tổng kết chuỗi logic. Che dữ liệu nhạy cảm. Khoá nằm trong thiết bị HSM.
      MAC phát hiện bản tin bị sửa. Và máy chủ luôn tự kiểm điều kiện, không tin ứng
      dụng.
  - show: <div class='box key'><b>Tư duy:</b> giả định kẻ xấu đứng ở <b>mọi chỗ ở
      giữa</b>, kể cả trong nhật ký và trong ứng dụng. Mỗi lớp bảo vệ phải đứng được
      một mình.</div>
    say: Điều cần mang theo. Hãy giả định kẻ xấu đứng ở mọi chỗ ở giữa, kể cả trong
      nhật ký và trong ứng dụng. Mỗi lớp bảo vệ phải đứng được một mình.
