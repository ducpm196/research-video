      mười sáu chữ số thập lục phân. Số thẻ được lấy mười hai chữ số rồi đệm bốn số
      không phía trước. Hai dòng XOR với nhau cho khối cuối. Nhờ ghép với số thẻ,
      cùng một PIN trên hai thẻ khác nhau cho hai khối khác nhau. Dữ liệu ở đây là
