scenes:
- id: hook
  kind: hook
  title: Vì sao số thẻ phải được che, còn PIN không bao giờ xuất hiện nguyên văn?
  steps:
  - show: '<p>Một lập trình viên ghi nhật ký để gỡ lỗi: có cả số thẻ và PIN. Nhật
      ký được sao lưu, nhiều người đọc được, và <b>rò rỉ</b> chỉ cần một người xấu.</p>

      <div class="box key">Bảo mật thanh toán dựa trên bốn ý: <b>che dữ liệu</b>,
      <b>không lộ khoá</b>, <b>phát hiện sửa bản tin</b>, <b>xác thực người dùng</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một lập trình viên ghi nhật ký để gỡ lỗi, trong đó có cả số thẻ
      lẫn mã PIN. Nhật ký được sao lưu, nhiều người đọc được, và rò rỉ chỉ cần một
      người xấu. Bảo mật thanh toán dựa trên bốn ý. Che dữ liệu, không lộ khoá, phát
      hiện sửa bản tin, và xác thực người dùng.
  - show: <table class='t'><tr><th>ý</th><th>công cụ</th><th>bài này làm gì</th></tr><tr><td>che
      dữ liệu</td><td>che số thẻ, không ghi PIN</td><td>tự viết hàm che</td></tr><tr><td>không
      lộ khoá</td><td>HSM giữ khoá, mã hoá khối PIN</td><td>tính khối PIN</td></tr><tr><td>phát
      hiện sửa bản tin</td><td>mã xác thực bản tin (MAC)</td><td>đổi 1 chữ số, MAC
      đổi</td></tr><tr><td>xác thực người dùng</td><td>sinh trắc học theo Quyết định
      2345</td><td>tính khi nào bắt buộc</td></tr></table>
    say: Bảng này là kế hoạch bài học. Che dữ liệu bằng cách che số thẻ và không ghi
      PIN. Không lộ khoá nhờ thiết bị HSM giữ khoá và mã hoá khối PIN. Phát hiện sửa
      bản tin bằng mã xác thực bản tin. Xác thực người dùng bằng sinh trắc học theo
      Quyết định hai nghìn ba trăm bốn mươi lăm.
- id: prereq
  kind: prereq
  title: 'Trước hết: những điều cần hiểu'
  checks:
  - 0b0111 ^ 0b0101 == 0b0010
  - (0b0111 ^ 0b0101) ^ 0b0101 == 0b0111
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      PIN</td><td>mã số bí mật vài chữ số khách gõ khi dùng thẻ</td><td>1234 (số thử)</td></tr><tr><td>②
      Bit, hex, byte</td><td>bit là chữ số 0 hoặc 1; một chữ số hex (thập lục phân,
      0–9 rồi A–F) gồm 4 bit; một byte là 8 bit, viết bằng 2 chữ số hex</td><td>F
      = 1111, byte 34 = 0011 0100</td></tr><tr><td>③ Mã hoá và khoá mật mã</td><td>mã
      hoá biến dữ liệu rõ thành dãy không đọc được; chỉ ai có khoá (một chuỗi bí mật)
      mới giải ra được</td><td>khoá K</td></tr></table>
    say: Trước hết ta cần hiểu vài điều. PIN là mã số bí mật vài chữ số mà khách gõ
      khi dùng thẻ. Bit là chữ số không hoặc một. Một chữ số thập lục phân, từ không
      tới chín rồi A tới F, gồm bốn bit, và một byte là tám bit, viết bằng hai chữ
      số thập lục phân. Mã hoá là biến dữ liệu rõ thành một dãy không đọc được, và
      chỉ ai có khoá, tức một chuỗi bí mật, mới giải ra được. Chữ khoá ở bài này là
      khoá mật mã.
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      XOR</td><td>so từng bit: giống nhau cho 0, khác nhau cho 1; làm hai lần thì
      về ban đầu</td><td>0111 XOR 0101 = 0010</td></tr><tr><td>⑤ Hàm băm</td><td>biến
      dữ liệu thành dãy cố định; đổi một chút dữ liệu, dãy đổi hoàn toàn</td><td>SHA-256</td></tr><tr><td>⑥
      Khoá bí mật dùng chung</td><td>khoá chỉ hai bên biết, dùng để chứng minh người
      gửi</td><td>khoá K</td></tr></table>'
    clear: true
    say: Phép XOR so từng bit, giống nhau cho không, khác nhau cho một, và làm hai
      lần thì trở về ban đầu. Hàm băm biến dữ liệu thành một dãy cố định, đổi một
      chút dữ liệu thì dãy đổi hoàn toàn. Khoá bí mật dùng chung là khoá chỉ hai bên
      biết, dùng để chứng minh người gửi.
  - show: $$0111 \text{ XOR } 0101 = 0010$$
    say: Một ví dụ XOR. Không một một một XOR không một không một bằng không không
      một không. Bit nào khác nhau thì thành một.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>PAN</td><td>số
      thẻ chính; nhạy cảm, phải che khi hiển thị và ghi nhật ký</td></tr><tr><td>khối
      PIN</td><td>PIN được ghép với số thẻ theo một định dạng rồi mới mã hoá</td></tr><tr><td>HSM</td><td>thiết
      bị phần cứng giữ khoá; khoá không bao giờ ra ngoài dạng rõ</td></tr><tr><td>MAC</td><td>mã
      xác thực bản tin: sửa một ký tự thì MAC không còn khớp</td></tr><tr><td>Luhn</td><td>phép
      kiểm số kiểm cuối của số thẻ, bắt lỗi gõ nhầm</td></tr></table>'
    say: Bảng này giải mã năm từ. PAN là số thẻ chính, nhạy cảm, phải che khi hiển
      thị và ghi nhật ký. Khối PIN là PIN được ghép với số thẻ theo một định dạng
      rồi mới mã hoá. HSM là thiết bị phần cứng giữ khoá, khoá không bao giờ ra ngoài
      ở dạng rõ. MAC là mã xác thực bản tin. Còn phép kiểm số kiểm cuối của số thẻ
      bắt lỗi gõ nhầm.
