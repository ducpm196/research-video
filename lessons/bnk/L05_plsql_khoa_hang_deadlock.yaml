scenes:
- id: hook
  kind: hook
  title: Vì sao hai lệnh chuyển tiền ngược chiều lại làm nhau treo?
  steps:
  - show: '<p>Lệnh 1 chuyển từ tài khoản A sang B. Lệnh 2 chuyển từ B sang A, cùng
      lúc. Mỗi lệnh <b>khoá hàng của mình trước</b> rồi chờ hàng của lệnh kia.</p>

      <div class="box key">Cả hai chờ nhau mãi. Oracle phát hiện và trả lỗi <b>ORA-00060</b>
      cho một trong hai.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, lệnh một chuyển từ tài khoản A sang B. Lệnh hai chuyển từ B sang
      A, cùng lúc. Mỗi lệnh khoá hàng của mình trước, rồi chờ hàng của lệnh kia. Cả
      hai chờ nhau mãi. Oracle phát hiện chuyện này và trả lỗi O R A không không không
      sáu không cho một trong hai lệnh.
  - show: <table class='t'><tr><th>thứ tự khoá của hai phiên</th><th>kết quả mô phỏng</th></tr><tr><td>A
      rồi B  và  B rồi A (ngược nhau)</td><td>bế tắc khoá</td></tr><tr><td>A rồi B  và  A
      rồi B (cùng thứ tự)</td><td>chạy bình thường</td></tr></table>
    say: Bảng này là kết quả mô phỏng ở cuối bài. Hai phiên khoá ngược thứ tự thì
      bế tắc. Hai phiên khoá cùng thứ tự thì chạy bình thường. Cách chữa nằm gọn trong
      một quy tắc, ta sẽ học hôm nay.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 2 * 2 == 4
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Phiên</td><td>một kết nối đang làm việc với cơ sở dữ liệu (cơ sở dữ liệu: phần
      mềm lưu bảng, hỏi bằng ngôn ngữ SQL), thường của một luồng chương trình</td><td>phiên
      1, phiên 2</td></tr><tr><td>② Giao dịch</td><td>nhiều thao tác cùng thành công
      hoặc cùng huỷ; kết thúc bằng commit (chốt lưu) hoặc rollback (huỷ hết)</td><td>trừ
      A rồi cộng B</td></tr><tr><td>③ Khoá hàng</td><td>khi một phiên sửa một hàng,
      hàng đó bị khoá tới khi giao dịch kết thúc</td><td>UPDATE (lệnh SQL sửa hàng)
      tài khoản A</td></tr><tr><td>④ Chờ</td><td>phiên khác muốn sửa hàng đang khoá
      thì phải đứng chờ</td><td>phiên 2 chờ hàng A</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Phiên là một kết nối đang làm việc với cơ
      sở dữ liệu, tức phần mềm lưu bảng dữ liệu mà ta hỏi bằng ngôn ngữ SQL. Giao
      dịch là nhiều thao tác cùng thành công hoặc cùng huỷ, và kết thúc bằng chốt
      để lưu, hoặc hoàn tác để huỷ hết. Khi một phiên sửa một hàng, hàng đó bị khoá
      cho tới khi giao dịch kết thúc. Phiên khác muốn sửa hàng đang khoá thì phải
      đứng chờ. Vì khoá chỉ được nhả khi giao dịch kết thúc, nên một giao dịch dài
      giữ khoá lâu.
  - show: $$2 \cdot 2 = 4$$
    say: Một phép đếm cần dùng. Hai phiên, mỗi phiên có hai cách chọn thứ tự khoá
      hai hàng, nên có hai nhân hai bằng bốn cặp thứ tự. Ta sẽ xem cặp nào gây bế
      tắc.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>id</td><td>mã
      số định danh mỗi hàng, ví dụ mã tài khoản 2, 5</td></tr><tr><td>deadlock (bế
      tắc)</td><td>hai hay nhiều phiên chờ nhau theo vòng tròn, không ai đi tiếp được</td></tr><tr><td>SELECT
      ... FOR UPDATE</td><td>đọc và khoá luôn các hàng đọc được để sửa an toàn</td></tr><tr><td>ORA-00060</td><td>mã
      lỗi Oracle: phát hiện bế tắc khi chờ tài nguyên</td></tr><tr><td>đồ thị chờ</td><td>mũi
      tên từ phiên đang chờ tới phiên đang giữ khoá; có vòng tròn là bế tắc</td></tr><tr><td>PL/SQL</td><td>ngôn
      ngữ lập trình thủ tục của Oracle, chạy ngay trong cơ sở dữ liệu</td></tr></table>'
    say: Bảng dưới đây giải thích nghĩa của sáu thuật ngữ sẽ gặp trong bài. Mã số
      định danh là con số riêng của mỗi hàng, ví dụ mã tài khoản hai và năm. Bế tắc
      là khi hai hay nhiều phiên chờ nhau theo vòng tròn, không ai đi tiếp được. Câu
      lệnh đọc kèm khoá cho phép đọc rồi khoá luôn các hàng để sửa an toàn. Mã lỗi
      sáu mươi là cách Oracle báo đã phát hiện bế tắc. Đồ thị chờ có mũi tên từ phiên
      chờ tới phiên giữ khoá, có vòng tròn là bế tắc. Cuối cùng, P L S Q L là ngôn
      ngữ thủ tục của Oracle, chạy ngay trong cơ sở dữ liệu.
