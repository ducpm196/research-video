- id: formula
  kind: formula
  title: 'Suy ra từng bước: vì sao thứ tự khoá chặn được bế tắc?'
  checks:
  - 2 * 2 == 4
  - '[alg.bnk_lock_sim([p, q]) for p in ([''A'', ''B''], [''B'', ''A'']) for q in
    ([''A'', ''B''], [''B'', ''A''])] == [''ok'', ''deadlock'', ''deadlock'', ''ok'']'
  - alg.bnk_lock_sim([sorted([5, 2]), sorted([2, 5])]) == 'ok'
  steps:
  - show: '<p><b>Bước 1.</b> Bế tắc cần một <b>vòng tròn chờ</b>: phiên 1 chờ phiên
      2, phiên 2 chờ phiên 1.</p>

      <span class=''note''>Làm thử: 2 phiên, 2 mũi tên chờ khép kín.</span>

      '
    say: Bước một, vì bế tắc cần một vòng tròn chờ, nên ta chỉ cần ngăn vòng tròn
      xuất hiện.
  - show: '<p><b>Bước 2.</b> Vòng tròn <b>chỉ có thể</b> xuất hiện khi hai phiên lấy
      hai khoá theo <b>thứ tự ngược nhau</b>, và xảy ra thật khi cả hai kịp giữ khoá
      đầu. Với 2 khoá có $2 \cdot 2 = 4$ cặp thứ tự, trong đó $2$ cặp ngược nhau.</p>

      <span class=''note''>Làm thử: (A,B)+(B,A) và (B,A)+(A,B) là hai cặp ngược.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì phiên giữ một khoá rồi xin khoá thứ hai, nên trong mô hình hai
      hàng này, vòng tròn chỉ có thể xuất hiện khi hai phiên lấy hai khoá theo thứ
      tự ngược nhau. Với hai khoá có bốn cặp thứ tự, trong đó hai cặp ngược nhau.
  - show: '<p><b>Bước 3.</b> Nếu mọi phiên đều khoá theo thứ tự tăng của id, mọi cặp
      thứ tự đều <b>giống nhau</b>, nên số cặp ngược là $0$.</p>

      <span class=''note''>Làm thử: sắp lại cả hai phiên thành (2,5) và (2,5) → chạy
      bình thường.</span>

      '
    focus:
    - 1
    - 2
    say: Bước ba, vì nếu mọi phiên đều khoá theo thứ tự tăng của mã, thì mọi cặp thứ
      tự đều giống nhau, nên số cặp ngược là không. Làm thử, sắp lại cả hai phiên
      thành hai rồi năm, thì chạy bình thường.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - alg.bnk_lock_sim([[2, 5], [5, 2]]) == 'deadlock'
  - alg.bnk_lock_sim([sorted([2, 5]), sorted([5, 2])]) == 'ok'
  steps:
  - show: '<p>Hai tài khoản có id $2$ và $5$. Lệnh 1 chuyển $2 \to 5$, lệnh 2 chuyển
      $5 \to 2$. Mỗi lệnh khoá <b>nguồn trước</b>.</p>

      $$① \; \text{Phiên 1 khoá } 2,\ \text{Phiên 2 khoá } 5$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Hai tài khoản có mã hai và năm. Lệnh một chuyển từ hai sang năm, lệnh hai
      chuyển từ năm sang hai, mỗi lệnh khoá nguồn trước. Bước thứ nhất, phiên một
      khoá hàng hai, phiên hai khoá hàng năm.
  - show: '<p>Vòng chờ kế tiếp: Phiên 1 xin hàng $5$ nhưng $5$ đang bị Phiên 2 giữ;
      Phiên 2 xin hàng $2$ nhưng $2$ đang bị Phiên 1 giữ.</p>

      $$② \; \text{không ai tiến thêm được} \Rightarrow \hl{\text{bế tắc}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước thứ hai, phiên một xin hàng năm nhưng hàng năm đang do phiên hai giữ.
      Phiên hai xin hàng hai nhưng hàng hai đang do phiên một giữ. Không ai tiến thêm
      được, nên là bế tắc.
    introduces:
    - implies
  - show: '<p>Áp quy tắc: mỗi lệnh sắp hai id tăng dần, ra $(2, 5)$.</p>

      $$③ \; \text{Phiên 1: } 2 \to 5,\quad \text{Phiên 2: } 2 \to 5$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước thứ ba, áp quy tắc. Mỗi lệnh sắp hai mã tăng dần, nên cả hai cùng khoá
      hai rồi mới tới năm.
  - show: '<p>Phiên 1 khoá $2$ trước. Phiên 2 cũng xin $2$ nên <b>chờ ngay từ đầu</b>
      và chưa giữ gì cả.</p>

      $$④ \; \text{số khoá Phiên 2 đang giữ} = \hlg{0} \Rightarrow \text{không ai
      bị chờ vòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước thứ tư, phiên một khoá hai trước. Phiên hai cũng cần hai nên chờ ngay
      từ đầu và chưa giữ khoá nào. Vì phiên hai không giữ gì, nên không ai bị chờ
      vòng.
  - show: '<p>Phiên 1 khoá $5$, trừ, cộng, commit, nhả cả hai khoá. Phiên 2 vào.</p>

      $$⑤ \; \text{kết quả} = \hlg{\text{cả hai lệnh xong lần lượt}}$$

      '
    focus:
    - 1
    - 2
    say: Bước thứ năm, phiên một khoá hàng năm, trừ và cộng, rồi chốt và nhả cả hai
      khoá. Phiên hai mới vào, nên cả hai lệnh xong lần lượt.
- id: chay_that
  kind: example
  title: 'Chạy thật: khoá hàng theo thứ tự trên Oracle, và mô phỏng bế tắc'
  steps:
  - show: '<p><b>Chạy thật trên Oracle 26ai Free (Docker): bật in đầu ra, dựng bảng
      hai hàng</b></p><div class="code"><div><span class="kw">SET</span> SERVEROUTPUT
      <span class="kw">ON</span></div></div><div class="code"><div><span class="kw">CREATE</span>
      <span class="kw">TABLE</span> bnk_tk (id NUMBER <span class="kw">PRIMARY</span>
      <span class="kw">KEY</span>, so_du NUMBER);</div><div><span class="kw">INSERT</span>
      <span class="kw">INTO</span> bnk_tk <span class="kw">VALUES</span> (2, 1000000);</div><div><span
      class="kw">INSERT</span> <span class="kw">INTO</span> bnk_tk <span class="kw">VALUES</span>
      (5, 500000);</div><div><span class="kw">COMMIT</span>;</div></div>'
    focus:
    - 1
    - 2
    - 3
    say: 'Trước hết là mã chạy thật trên Oracle, cài trong Docker, một công cụ chạy
      phần mềm trong một hộp riêng, tách khỏi phần còn lại của máy. Lệnh đầu của công
      cụ gõ lệnh Oracle bật cho hàm in hiển thị chữ ra màn hình. Ta dựng bảng hai
      hàng: mã hai có một triệu, mã năm có năm trăm nghìn, rồi chốt lưu.'
    introduces:
    - bnk_docker
  - show: '<p><b>PL/SQL: khoá id nhỏ trước</b></p><div class="code"><div>DECLARE</div><div>  v_nho
      NUMBER;</div><div>  v_lon NUMBER;</div><div><span class="kw">BEGIN</span></div><div>  <span
      class="kw">SELECT</span> so_du <span class="kw">INTO</span> v_nho <span class="kw">FROM</span>
      bnk_tk <span class="kw">WHERE</span> id = 2 FOR <span class="kw">UPDATE</span>;   <span
      class="cm">-- khoá id nhỏ trước</span></div><div>  <span class="kw">SELECT</span>
      so_du <span class="kw">INTO</span> v_lon <span class="kw">FROM</span> bnk_tk
      <span class="kw">WHERE</span> id = 5 FOR <span class="kw">UPDATE</span>;   <span
      class="cm">-- rồi mới tới id lớn</span></div><div>  <span class="kw">UPDATE</span>
      bnk_tk <span class="kw">SET</span> so_du = so_du - 300000 <span class="kw">WHERE</span>
      id = 2;</div><div>  <span class="kw">UPDATE</span> bnk_tk <span class="kw">SET</span>
      so_du = so_du + 300000 <span class="kw">WHERE</span> id = 5;</div><div>  <span
      class="kw">COMMIT</span>;</div><div>  DBMS_OUTPUT.PUT_LINE(''xong, tong truoc
      = '' || (v_nho + v_lon));</div><div>END;</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khối này khai hai biến kiểu số của Oracle, và từ khoá vào cất giá trị đọc
      được vào biến, và hàm in của Oracle ghi dòng chữ ra màn hình. Rồi nó khoá hàng
      có mã hai, và sau đó mới khoá hàng có mã năm, tức là luôn khoá mã nhỏ trước.
      Sau khi giữ cả hai hàng, nó trừ ba trăm nghìn ở hàng thứ nhất, cộng ba trăm
      nghìn ở hàng thứ hai, chốt lưu, và in tổng trước khi chuyển.
  - show: '<p><b>Câu hỏi cuối: xem số dư hai hàng</b></p><div class="code"><div>/</div><div><span
      class="kw">SELECT</span> id || '' '' || so_du <span class="kw">FROM</span> bnk_tk
      <span class="kw">ORDER</span> <span class="kw">BY</span> id;</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>xong, tong truoc = 1500000</div><div>2
      700000</div><div>5 800000</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Cuối cùng ta hỏi số dư hai hàng. Khi chạy thật, tổng trước khi chuyển là
      một triệu rưỡi. Hàng hai còn bảy trăm nghìn, hàng năm có tám trăm nghìn, tổng
      vẫn một triệu rưỡi, nên không mất đồng nào. Dấu gạch chéo ở dòng riêng báo hết
      khối để Oracle chạy nó, và hai gạch đứng nối mã với số dư thành một dòng chữ.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>System.out.println(x)</code>,
      <code>return</code>, <code>//</code>, <code>import</code>, <code>"a" + x</code></td><td>in
      x ra màn hình; trả giá trị về; chú thích; nhập lớp có sẵn; nối chữ</td><td><code>import
      …;</code>, <code>System.out.println(x)</code>, <code>return duoc;</code>, <code>//
      chú thích</code>, <code>"A roi B " + …</code></td></tr></table>
    clear: true
    say: In giá trị ra màn hình, trả về đưa giá trị cho nơi gọi, hai gạch chéo mở
      chú thích, dòng nhập lấy lớp có sẵn, và dấu cộng nối chữ.
  - show: '<p><b>Mô phỏng bế tắc bằng Java (phần 1): nhập các lớp khoá và mở lớp</b></p><div
      class="code"><div><span class="kw">import</span> java.util.concurrent.TimeUnit;</div><div><span
      class="kw">import</span> java.util.concurrent.locks.Lock;</div><div><span class="kw">import</span>
      java.util.concurrent.locks.ReentrantLock;</div><div><span class="kw">public</span>
      <span class="kw">class</span> BeTac {</div></div>'
    clear: true
    say: Oracle tự phát hiện vòng chờ, nên để thấy bế tắc ta mô phỏng bằng Java, với
      mỗi hàng là một khoá.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      static kiểu tên(kiểu a, kiểu b)</code></td><td>khai một hàm: <b>kiểu trả về</b>
      (<code>void</code> là không trả gì), <b>tên</b>, rồi <b>tham số</b> trong ngoặc
      tròn, mỗi tham số là kiểu rồi tên; <code>static</code>: thuộc cả lớp; <code>public</code>:
      nơi khác gọi được</td><td><code>static boolean lam(Lock dau, Lock sau)</code>
      — hàm <code>lam</code>, trả về đúng hoặc sai, nhận hai khoá</td></tr><tr><td><code>…
      throws Lỗi {</code></td><td>lời báo: hàm này có thể ném lỗi loại đó; hàm không
      tự xử lý mà chuyển lỗi lên cho nơi gọi xử lý</td><td><code>static String thu(Lock
      x1, …) throws Exception</code> — trả về chuỗi, được ném lỗi</td></tr></table>'
    clear: true
    say: Khai một hàm gồm kiểu giá trị trả về, rỗng nghĩa là không trả gì, rồi tên
      hàm, rồi các tham số trong ngoặc tròn, mỗi tham số là kiểu rồi tên. Chữ tĩnh
      nghĩa là hàm thuộc cả lớp, chữ công khai nghĩa là nơi khác gọi được. Ví dụ,
      hàm làm, nhận hai khoá và trả về đúng hoặc sai. Lời báo ném lỗi nghĩa là hàm
      có thể ném lỗi loại đó, và không tự xử lý mà chuyển lỗi lên cho nơi gọi xử lý.
      Ví dụ, hàm thử ở phần ba, được phép ném lỗi chờ luồng.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>if
      (điều_kiện) { … } else { … }</code></td><td>nếu điều kiện đúng thì làm khối
      đầu, không thì làm khối sau <code>else</code></td><td><code>if (duoc) sau.unlock();</code>
      — xin được hàng sau thì nhả nó ngay</td></tr></table>
    clear: true
    say: Nếu điều kiện đúng thì làm khối thứ nhất, nếu không thì làm khối còn lại.
  - show: '<p><b>Phần 2: mỗi luồng khoá hàng đầu rồi xin hàng sau</b></p><div class="code"><div><span
      class="kw">static</span> <span class="kw">boolean</span> lam(Lock dau, Lock
      sau) {</div><div>    dau.lock();                                   <span class="cm">//
      khoá hàng thứ nhất</span></div><div>    <span class="kw">try</span> {</div><div>        Thread.sleep(200);                        <span
      class="cm">// để luồng kia kịp khoá hàng của nó</span></div><div>        <span
      class="kw">boolean</span> duoc = sau.tryLock(500, TimeUnit.MILLISECONDS);   <span
      class="cm">// xin hàng sau, tối đa 0,5 giây</span></div><div>        <span class="kw">if</span>
      (duoc) sau.unlock();</div><div>        <span class="kw">return</span> duoc;</div><div>    }
      <span class="kw">catch</span> (InterruptedException e) {</div><div>        <span
      class="kw">return</span> <span class="kw">false</span>;</div><div>    } <span
      class="kw">finally</span> { dau.unlock(); }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Mỗi luồng giữ hàng thứ nhất, ngủ một chút để luồng kia kịp giữ hàng của nó,
      rồi xin hàng thứ hai, chờ tối đa nửa giây. Lệnh khoá xin khoá và chờ tới khi
      được, còn lệnh thử khoá chỉ chờ một lúc rồi bỏ. Nếu hết giờ mà chưa xin được,
      ta coi là bế tắc. Khối thử là phần làm việc có thể gặp sự cố. Khối bắt lo sự
      cố luồng bị đánh thức giữa lúc ngủ, ta coi như thất bại. Khối cuối luôn chạy
      dù có sự cố hay không, nên khoá luôn được nhả.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>t.start();
      t.join();</code></td><td><code>start</code>: cho luồng t chạy; <code>join</code>:
      chờ luồng t chạy xong</td><td><code>t1.start(); t2.start(); t1.join(); t2.join();</code>
      — cho hai luồng chạy, rồi chờ cả hai xong</td></tr></table>'
    clear: true
    say: Lệnh bắt đầu cho luồng chạy, còn lệnh chờ xong chờ luồng đó chạy xong.
  - show: '<p><b>Phần 3: thử hai thứ tự khoá</b></p><div class="code"><div>    <span
      class="kw">static</span> String thu(Lock x1, Lock y1, Lock x2, Lock y2) <span
      class="kw">throws</span> Exception {</div><div>        <span class="kw">boolean</span>[]
      ok = <span class="kw">new</span> <span class="kw">boolean</span>[2];</div><div>        Thread
      t1 = <span class="kw">new</span> Thread(() -&gt; ok[0] = lam(x1, y1));</div><div>        Thread
      t2 = <span class="kw">new</span> Thread(() -&gt; ok[1] = lam(x2, y2));</div><div>        t1.start();
      t2.start(); t1.join(); t2.join();</div><div>        <span class="kw">return</span>
      ok[0] &amp;&amp; ok[1] ? "xong" : "be tac";</div><div>    }</div><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) <span class="kw">throws</span> Exception {</div><div>        Lock
      a = <span class="kw">new</span> ReentrantLock(), b = <span class="kw">new</span>
      ReentrantLock();</div><div>        System.out.println("A roi B  va  B roi A:
      " + thu(a, b, b, a));</div><div>        System.out.println("A roi B  va  A roi
      B: " + thu(a, b, a, b));</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phần này chạy hai luồng, và trả về xong hay bế tắc. Mảng hai ô đúng sai ghi
      kết quả của từng luồng, và mũi tên là một việc nhỏ gọi hàm khoá rồi ghi vào
      ô của mình. Dấu hỏi chấm chọn một trong hai chữ, tuỳ cả hai ô đều đúng hay không.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>A roi B  va  B roi
      A: be tac</div><div>A roi B  va  A roi B: xong</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khi chạy thật, khoá ngược thứ tự thì bế tắc, vì mỗi luồng giữ hàng mà luồng
      kia cần. Khoá cùng thứ tự thì xong, vì luồng thứ hai không giữ được hàng đầu
      tiên nên chưa giữ gì cả, và đợi luồng thứ nhất làm xong. Mô phỏng này dùng hết
      giờ chờ, còn Oracle trả lỗi không không không sáu không cho một phiên.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: thử hết cặp thứ tự'
  checks:
  - sum(1 for p in (['A', 'B'], ['B', 'A']) for q in (['A', 'B'], ['B', 'A']) if alg.bnk_lock_sim([p,
    q]) == 'deadlock') == 2
  steps:
  - show: '<p>Đường khác: vì chỉ có hai khoá, ta vét cạn mọi cặp thứ tự, rồi chạy
      mô phỏng cho từng cặp.</p>'
    say: Kiểm bằng đường khác. Ta vét cạn mọi cặp thứ tự của hai khoá, rồi chạy mô
      phỏng cho từng cặp. Mô phỏng này kiểm logic thứ tự khoá; bế tắc thật cần hai
      phiên chạy cùng lúc, nên ta mô phỏng bằng Java.
  - show: <table class='t'><tr><th>phiên 1</th><th>phiên 2</th><th>kết quả (khi cả
      hai kịp giữ khoá đầu)</th></tr><tr><td>A, B</td><td>A, B</td><td>bình thường</td></tr><tr><td>A,
      B</td><td>B, A</td><td>bế tắc</td></tr><tr><td>B, A</td><td>A, B</td><td>bế
      tắc</td></tr><tr><td>B, A</td><td>B, A</td><td>bình thường</td></tr></table>
    say: Vì chỉ hai cặp ngược nhau mới bế tắc, nên kết quả khớp với bước hai.
  - show: '<table class=''t''><tr><th>nguyên nhân ORA-00060 ngoài đời</th><th>sắp
      thứ tự hàng có chữa được?</th><th>cách chữa</th></tr><tr><td>hai phiên khoá
      hàng ngược thứ tự</td><td>có</td><td>khoá theo id tăng dần</td></tr><tr><td>khoá
      ngoại (cột ở bảng con trỏ tới bảng cha) không có chỉ mục: xoá hay sửa khoá chính
      ở bảng cha thì Oracle khoá cả bảng con</td><td>không</td><td>tạo chỉ mục (cấu
      trúc tra nhanh) cho cột khoá ngoại</td></tr><tr><td>thiếu chỗ ITL (danh sách
      giao dịch đang sửa khối) trong khối dữ liệu (đơn vị nhỏ nhất Oracle đọc ghi
      trên đĩa, chứa nhiều hàng); tham số INITRANS khai số chỗ ITL dành sẵn, nếu thấp
      thì thiếu</td><td>không</td><td>tăng INITRANS (số chỗ ITL dành sẵn) cho bảng
      hay chỉ mục nóng</td></tr></table>'
    clear: true
    say: 'Ngoài đời, bế tắc còn có nguyên nhân khác. Một là khoá ngoại, cột ở bảng
      con trỏ tới bảng cha, không có chỉ mục: sửa khoá chính ở bảng cha làm Oracle
      khoá cả bảng con. Hai là khối dữ liệu, đơn vị nhỏ nhất Oracle đọc ghi, thiếu
      chỗ ghi các giao dịch đang sửa nó. Vì vậy sắp thứ tự hàng không chữa được hai
      loại này, mà phải tạo chỉ mục hoặc tăng chỗ trong khối.'
    introduces:
    - bnk_initrans
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ đọc dữ liệu cũng làm
      người khác chờ. Với Oracle, <b>câu SELECT thường không khoá hàng</b> và người
      đọc không chặn người ghi.</div>
    say: Lỗi thứ nhất, của người mới. Nghĩ đọc dữ liệu cũng làm người khác chờ. Với
      Oracle, câu đọc thông thường không khoá hàng, và người đọc không chặn người
      ghi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Khoá
      theo thứ tự người gọi đưa vào</b>, tức nguồn rồi đích. Hai lệnh ngược chiều
      sẽ gặp bế tắc đúng lúc cao điểm.

      <br><span class="note">Cách chữa: sắp các id tăng dần rồi khoá từng hàng bằng
      câu riêng; đừng tin <code>ORDER BY … FOR UPDATE</code> khoá theo thứ tự ORDER
      BY.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là khoá theo thứ tự người gọi đưa vào,
      tức nguồn rồi đích. Hai lệnh ngược chiều sẽ gặp bế tắc đúng lúc cao điểm. Cách
      chữa là sắp các mã tăng dần, rồi khoá từng hàng bằng một câu lệnh riêng. Đừng
      tin rằng một câu đọc kèm khoá có sắp thứ tự sẽ khoá đúng theo thứ tự đã sắp.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Gặp ORA-00060 rồi
      <b>thử lại ngay</b>. Theo mô tả của Oracle, chỉ <b>câu lệnh</b> bị huỷ, không
      phải cả giao dịch, nên các khoá cũ vẫn còn.

      <br><span class="note">Cách chữa: rollback cả giao dịch rồi mới thử lại, kèm
      giới hạn số lần thử.</span></div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là gặp lỗi bế tắc rồi thử lại ngay.
      Theo mô tả của Oracle, chỉ câu lệnh bị huỷ, không phải cả giao dịch, nên các
      khoá cũ vẫn còn. Cách chữa là hoàn tác cả giao dịch rồi mới thử lại, kèm giới
      hạn số lần thử.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 3 * 2 * 1 == 6 == len(list(__import__('itertools').permutations('ABC')))
  - sorted([9, 4]) == [4, 9]
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Với
      3 khoá, mỗi phiên khoá cả 3 theo một thứ tự. Mỗi phiên có bao nhiêu thứ tự?</td></tr><tr><td>2</td><td>Chuyển
      tiền từ tài khoản 9 sang tài khoản 4. Thứ tự khoá đúng?</td></tr><tr><td>3</td><td>Quyết
      định: tránh bế tắc bằng sắp thứ tự, hay đặt giới hạn chờ rồi thử lại?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, với ba khoá, mỗi phiên khoá cả
      ba theo một thứ tự, mỗi phiên có bao nhiêu thứ tự? Câu hai, chuyển tiền từ tài
      khoản chín sang tài khoản bốn, thứ tự khoá đúng là gì? Câu ba, nên tránh bế
      tắc bằng sắp thứ tự, hay đặt giới hạn chờ rồi thử lại? Hãy dừng video và làm
      ra giấy.
  - show: '<p>Câu 1: chọn khoá đầu có $3$ cách, khoá hai có $2$ cách, khoá ba có $1$
      cách.</p>

      $$3 \cdot 2 \cdot 1 = \hl{6}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Khoá đầu có ba cách chọn, khoá thứ hai có hai cách, khoá
      thứ ba còn một cách. Ba nhân hai nhân một bằng sáu thứ tự.
    clear: true
  - show: '<p>Câu 2: id nhỏ trước, id lớn sau.</p>

      $$\text{khoá } 4 \text{ trước, rồi khoá } 9$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Luôn khoá mã nhỏ trước, nên khoá tài khoản bốn trước, rồi
      mới khoá tài khoản chín, dù tiền đi từ chín sang bốn.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>sắp
      thứ tự khoá</td><td>ngăn bế tắc từ gốc</td><td>phải biết trước mọi khoá cần
      lấy</td></tr><tr><td>giới hạn chờ rồi thử lại</td><td>đơn giản, bắt được mọi
      trường hợp</td><td>bế tắc vẫn xảy ra, tốn thời gian chờ và thử lại</td></tr></table>
    say: Đáp án câu ba. Sắp thứ tự khoá ngăn bế tắc từ gốc, nhưng phải biết trước
      mọi khoá cần lấy. Giới hạn chờ rồi thử lại đơn giản và bắt được mọi trường hợp,
      nhưng bế tắc vẫn xảy ra.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: cặp phiên tăng bình phương, bế tắc từ hiếm thành liên tục'
  checks:
  - 10 * 9 // 2 == 45
  - round(45 * 0.0001, 4) == 0.0045
  - 1000 * 999 // 2 == 499500
  - round(499500 * 0.0001) == 50
  - 100000 * 99999 // 2 == 4_999_950_000
  - round(4_999_950_000 * 0.0001) == 499995
  steps:
  - show: '<p>Gọi $T$ là số phiên chạy cùng lúc. Số cặp phiên là $\frac{T \cdot (T
      - 1)}{2}$. Giả sử mỗi cặp có xác suất $0{,}0001$ gây bế tắc (tính cả khả năng
      khoá ngược thứ tự lẫn chồng thời gian) <i>(số minh hoạ)</i>; số cặp gây bế tắc
      kỳ vọng là số cặp nhân $0{,}0001$.</p><p class="note">Kỳ vọng: giá trị trung
      bình khi lặp lại thật nhiều lần. Số cặp là T(T−1)/2 vì mỗi phiên ghép với T−1
      phiên khác, nhưng mỗi cặp bị đếm hai lần. Giả định: số hàng nóng giữ nguyên
      khi tải tăng nên xác suất mỗi cặp không đổi; 100 000 phiên cùng tranh hai hàng
      là trường hợp cực đoan.</p><table class=''t''><tr><th>tải</th><th>phiên cùng
      lúc T</th><th>số cặp phiên</th><th>cặp gây bế tắc kỳ vọng (giả định)</th></tr><tr><td><span
      style="white-space:nowrap">×1</span></td><td>10</td><td>45</td><td>0,0045 (hiếm)</td></tr><tr><td><span
      style="white-space:nowrap">×100</span></td><td>1 000</td><td>499 500</td><td><b>≈
      50</b></td></tr><tr><td><span style="white-space:nowrap">×10 000</span></td><td>100
      000</td><td>4 999 950 000</td><td><b>≈ 500 000</b></td></tr></table>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Gọi T là số phiên chạy cùng lúc, thì số cặp phiên là T nhân T trừ một, chia
      hai, vì mỗi phiên ghép với T trừ một phiên khác và mỗi cặp bị đếm hai lần. Giả
      sử mỗi cặp có xác suất một phần mười nghìn gây bế tắc, và số hàng nóng giữ nguyên
      khi tải tăng. Đây là số minh hoạ, và một trăm nghìn phiên cùng tranh hai hàng
      là trường hợp cực đoan. Kỳ vọng là giá trị trung bình khi lặp lại thật nhiều
      lần. Với mười phiên có bốn mươi lăm cặp, kỳ vọng chỉ không phẩy không không
      bốn năm cặp gây bế tắc, rất hiếm. Tải tăng một trăm lần, có gần năm trăm nghìn
      cặp và kỳ vọng khoảng năm mươi cặp. Tải tăng mười nghìn lần, khoảng năm trăm
      nghìn cặp.
    introduces:
    - bnk_ky_vong
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Dựa vào “bế tắc hiếm,
      để cơ sở dữ liệu phát hiện rồi thử lại”: ở ×1 hiếm tới mức không ai thấy, ở
      ×100 xảy ra vài chục lần mỗi lượt, ở ×10 000 liên tục; mỗi lần có một phiên
      bị huỷ rồi thử lại, càng thử càng thêm phiên chờ.</div>

      <div class="box key"><b>Quy tắc khoá theo thứ tự mã tăng dần</b> xoá hẳn vòng
      chờ ở mọi tải. <b>Đánh đổi:</b> phải biết trước mọi hàng cần khoá để sắp thứ
      tự; khi chỉ biết dần trong lúc chạy thì vẫn cần hết giờ chờ và thử lại có giới
      hạn.</div>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Giải pháp cũ là dựa vào việc bế tắc hiếm, để cơ sở dữ liệu phát hiện rồi
      thử lại. Ở tải gốc nó hiếm, ở tải gấp trăm lần xảy ra vài chục lần mỗi lượt,
      và ở tải gấp mười nghìn lần là liên tục, càng thử lại càng thêm phiên chờ. Đánh
      đổi là phải biết trước mọi hàng cần khoá, nếu không vẫn cần hết giờ chờ và thử
      lại có giới hạn.
- id: practice
  kind: practice
  title: 'Tự làm: thứ tự khoá cho bốn lệnh chuyển'
  steps:
  - show: '<p><b>Đề</b>: quy tắc <b>khoá mã nhỏ trước</b>. Bốn lệnh chuyển <code>(từ,
      tới)</code>: <code>(4,9) (9,4) (7,4) (4,7)</code>. Viết <code>ThuTuKhoa.java</code>:</p>

      <ol><li>duyệt bốn lệnh</li><li>mỗi lệnh tính mã nhỏ hơn bằng <code>Math.min</code>,
      mã lớn hơn bằng <code>Math.max</code></li>

      <li>in một dòng <code>4 -&gt; 9: khoa 4 roi 9</code></li></ol>

      <p class="note">Phần thêm (không chấm): thư mục <code>be_tac/</code> của lab
      có <code>BeTac.java</code> để chạy và sửa thứ tự khoá.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm. Có bốn lệnh chuyển, từ bốn tới chín, từ chín
      tới bốn, từ bảy tới bốn, và từ bốn tới bảy. Hãy duyệt từng lệnh, tìm số nhỏ
      hơn và số lớn hơn để ra thứ tự khoá, rồi in ra. Hãy dừng video, tự viết và chạy.
      Nếu còn sức, làm phần thêm trong thư mục thực hành.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>4 -&gt; 9: khoa 4
      roi 9</div><div>9 -&gt; 4: khoa 4 roi 9</div><div>7 -&gt; 4: khoa 4 roi 7</div><div>4
      -&gt; 7: khoa 4 roi 7</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh BNK L05 ThuTuKhoa.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> khai <code>int[][] lenh = { {4, 9},
      {9, 4}, {7, 4}, {4, 7} };</code> (mảng của các cặp), duyệt bằng <code>for (int[]
      l : lenh)</code> (<code>l</code> lần lượt là từng cặp), rồi

      <code>int dau = Math.min(l[0], l[1]);</code> và <code>int sau = Math.max(l[0],
      l[1]);</code> (<code>l[0]</code>: số đầu của cặp, <code>l[1]</code>: số sau).
      Lời giải ở <code>labs/BNK/L05/loi_giai.java</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, khai một mảng gồm bốn cặp số, duyệt từng cặp, rồi lấy số nhỏ hơn
      làm khoá trước và số lớn hơn làm khoá sau. Trong mỗi cặp, ô số không là số đầu,
      ô số một là số sau. Lời giải đầy đủ nằm trong thư mục thực hành, chỉ mở sau
      khi tự thử.
    clear: true
  lab: labs/BNK/L05
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>giữ khoá, xin khoá khác</span><span class='a'>→</span><span
      class='n'>hai phiên ngược thứ tự</span><span class='a'>→</span><span class='n'>vòng
      tròn chờ = bế tắc</span><span class='a'>→</span><span class='n'>luôn khoá theo
      thứ tự id tăng</span></div>
    say: Hai phiên ngược thứ tự thì tạo vòng tròn chờ, tức bế tắc. Luôn khoá theo
      thứ tự mã tăng dần để chặn vòng tròn.
  - show: '<div class=''box key''><b>Tư duy:</b> bế tắc là lỗi <b>thiết kế thứ tự</b>,
      không phải lỗi may rủi.

      Gặp bế tắc: rollback cả giao dịch, thử lại có giới hạn, và sửa thứ tự khoá.</div>

      '
    say: Bế tắc là lỗi thiết kế thứ tự, không phải lỗi may rủi. Gặp bế tắc thì hoàn
      tác cả giao dịch, thử lại có giới hạn, và sửa thứ tự khoá.
