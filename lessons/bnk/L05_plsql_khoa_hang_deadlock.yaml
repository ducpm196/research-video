- id: formula
  kind: formula
  title: 'Suy ra từng bước: vì sao thứ tự khoá chặn được bế tắc?'
  checks:
  - 2 * 2 == 4
  - '[alg.bnk_lock_sim([p, q]) for p in ([''A'', ''B''], [''B'', ''A'']) for q in
    ([''A'', ''B''], [''B'', ''A''])] == [''ok'', ''deadlock'', ''deadlock'', ''ok'']'
  - alg.bnk_lock_sim([sorted([5, 2]), sorted([2, 5])]) == 'ok'
  steps:
  - show: '<p><b>Bước 1.</b> Bế tắc cần một <b>vòng tròn chờ</b>: phiên 1 chờ phiên
      2, phiên 2 chờ phiên 1.</p>

      <span class=''note''>Làm thử: 2 phiên, 2 mũi tên chờ khép kín.</span>

      '
    focus:
    - 1
    - 2
    say: Bước một, vì bế tắc cần một vòng tròn chờ, nên ta chỉ cần ngăn vòng tròn
      xuất hiện. Làm thử, hai phiên chờ nhau tạo ra hai mũi tên khép kín.
  - show: '<p><b>Bước 2.</b> Vòng tròn <b>chỉ có thể</b> xuất hiện khi hai phiên lấy
      hai khoá theo <b>thứ tự ngược nhau</b>, và xảy ra thật khi cả hai kịp giữ khoá
      đầu. Với 2 khoá có $2 \cdot 2 = 4$ cặp thứ tự, trong đó $2$ cặp ngược nhau.</p>

      <span class=''note''>Làm thử: (A,B)+(B,A) và (B,A)+(A,B) là hai cặp ngược.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước hai, vì phiên giữ một khoá rồi xin khoá thứ hai, nên trong mô hình hai
      hàng này, vòng tròn chỉ có thể xuất hiện khi hai phiên lấy hai khoá theo thứ
      tự ngược nhau. Nó xảy ra thật khi cả hai phiên kịp giữ khoá đầu trước khi xin
      khoá thứ hai. Với hai khoá có bốn cặp thứ tự, trong đó hai cặp ngược nhau. Làm
      thử, A rồi B kèm B rồi A là một cặp ngược, và cặp đảo lại là cặp ngược thứ hai.
  - show: '<p><b>Bước 3.</b> Nếu mọi phiên đều khoá theo thứ tự tăng của id, mọi cặp
      thứ tự đều <b>giống nhau</b>, nên số cặp ngược là $0$.</p>

      <span class=''note''>Làm thử: sắp lại cả hai phiên thành (2,5) và (2,5) → chạy
      bình thường.</span>

      '
    focus:
    - 1
    - 2
    say: Bước ba, vì nếu mọi phiên đều khoá theo thứ tự tăng của mã, thì mọi cặp thứ
      tự đều giống nhau, nên số cặp ngược là không. Làm thử, sắp lại cả hai phiên
      thành hai rồi năm, thì chạy bình thường.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - alg.bnk_lock_sim([[2, 5], [5, 2]]) == 'deadlock'
  - alg.bnk_lock_sim([sorted([2, 5]), sorted([5, 2])]) == 'ok'
  steps:
  - show: '<p>Hai tài khoản có id $2$ và $5$. Lệnh 1 chuyển $2 \to 5$, lệnh 2 chuyển
      $5 \to 2$. Mỗi lệnh khoá <b>nguồn trước</b>.</p>

      $$① \; \text{Phiên 1 khoá } 2,\ \text{Phiên 2 khoá } 5$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta theo dõi từng bước. Hai tài khoản có mã hai và năm. Lệnh một chuyển từ
      hai sang năm, lệnh hai chuyển từ năm sang hai, mỗi lệnh khoá nguồn trước. Bước
      thứ nhất, phiên một khoá hàng hai, phiên hai khoá hàng năm.
  - show: '<p>Vòng chờ kế tiếp: Phiên 1 xin hàng $5$ nhưng $5$ đang bị Phiên 2 giữ;
      Phiên 2 xin hàng $2$ nhưng $2$ đang bị Phiên 1 giữ.</p>

      $$② \; \text{không ai tiến thêm được} \Rightarrow \hl{\text{bế tắc}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước thứ hai, phiên một xin hàng năm nhưng hàng năm đang do phiên hai giữ.
      Phiên hai xin hàng hai nhưng hàng hai đang do phiên một giữ. Không ai tiến thêm
      được, nên là bế tắc.
    introduces:
    - implies
  - show: '<p>Áp quy tắc: mỗi lệnh sắp hai id tăng dần, ra $(2, 5)$.</p>

      $$③ \; \text{Phiên 1: } 2 \to 5,\quad \text{Phiên 2: } 2 \to 5$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước thứ ba, áp quy tắc. Mỗi lệnh sắp hai mã tăng dần, nên cả hai cùng khoá
      hai rồi mới tới năm.
  - show: '<p>Phiên 1 khoá $2$ trước. Phiên 2 cũng xin $2$ nên <b>chờ ngay từ đầu</b>
      và chưa giữ gì cả.</p>

      $$④ \; \text{số khoá Phiên 2 đang giữ} = \hlg{0} \Rightarrow \text{không ai
      bị chờ vòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước thứ tư, phiên một khoá hai trước. Phiên hai cũng cần hai nên chờ ngay
      từ đầu và chưa giữ khoá nào. Vì phiên hai không giữ gì, nên không ai bị chờ
      vòng.
  - show: '<p>Phiên 1 khoá $5$, trừ, cộng, commit, nhả cả hai khoá. Phiên 2 vào.</p>

      $$⑤ \; \text{kết quả} = \hlg{\text{cả hai lệnh xong lần lượt}}$$

      '
    focus:
    - 1
    - 2
    say: Bước thứ năm, phiên một khoá hàng năm, trừ và cộng, rồi chốt và nhả cả hai
      khoá. Phiên hai mới vào, nên cả hai lệnh xong lần lượt.
- id: chay_that
  kind: example
  title: 'Chạy thật: khoá hàng theo thứ tự trên Oracle, và mô phỏng bế tắc'
  steps:
  - show: '<p><b>PL/SQL chạy thật trên Oracle 26ai Free (Docker): khoá id nhỏ trước</b></p><div
      class="code"><div>DECLARE</div><div>  v_nho NUMBER;</div><div>  v_lon NUMBER;</div><div><span
      class="kw">BEGIN</span></div><div>  <span class="kw">SELECT</span> so_du <span
      class="kw">INTO</span> v_nho <span class="kw">FROM</span> bnk_tk <span class="kw">WHERE</span>
      id = 2 FOR <span class="kw">UPDATE</span>;   <span class="cm">-- khoá id nhỏ
      trước</span></div><div>  <span class="kw">SELECT</span> so_du <span class="kw">INTO</span>
      v_lon <span class="kw">FROM</span> bnk_tk <span class="kw">WHERE</span> id =
      5 FOR <span class="kw">UPDATE</span>;   <span class="cm">-- rồi mới tới id lớn</span></div><div>  <span
      class="kw">UPDATE</span> bnk_tk <span class="kw">SET</span> so_du = so_du -
      300000 <span class="kw">WHERE</span> id = 2;</div><div>  <span class="kw">UPDATE</span>
      bnk_tk <span class="kw">SET</span> so_du = so_du + 300000 <span class="kw">WHERE</span>
      id = 5;</div><div>  <span class="kw">COMMIT</span>;</div><div>  DBMS_OUTPUT.PUT_LINE(''xong,
      tong truoc = '' || (v_nho + v_lon));</div><div>END;</div></div>'
    focus:
    - 1
    - 1
    - 2
    say: Trước hết là mã chạy thật trên Oracle. Khối này khai hai biến, rồi khoá hàng
      có mã hai, và sau đó mới khoá hàng có mã năm, tức là luôn khoá mã nhỏ trước.
      Sau khi giữ cả hai hàng, nó trừ ba trăm nghìn ở hàng thứ nhất, cộng ba trăm
      nghìn ở hàng thứ hai, chốt lưu, và in tổng trước khi chuyển.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>xong, tong truoc =
      1500000</div><div>2 700000</div><div>5 800000</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khi chạy thật, tổng trước khi chuyển là một triệu rưỡi. Hàng hai còn bảy
      trăm nghìn, hàng năm có tám trăm nghìn, tổng vẫn một triệu rưỡi, nên không mất
      đồng nào. Một phiên khác cũng khoá theo thứ tự mã tăng dần thì không thể tạo
      vòng chờ với phiên này.
  - show: '<p><b>Mô phỏng bế tắc bằng Java (phần 1): mỗi luồng khoá hàng đầu rồi xin
      hàng sau</b></p><div class="code"><div><span class="kw">static</span> <span
      class="kw">boolean</span> lam(Lock dau, Lock sau) {</div><div>    dau.lock();                                   <span
      class="cm">// khoá hàng thứ nhất</span></div><div>    <span class="kw">try</span>
      {</div><div>        Thread.sleep(200);                        <span class="cm">//
      để luồng kia kịp khoá hàng của nó</span></div><div>        <span class="kw">boolean</span>
      duoc = sau.tryLock(500, TimeUnit.MILLISECONDS);   <span class="cm">// xin hàng
      thứ hai, chờ tối đa 0,5 giây</span></div><div>        <span class="kw">if</span>
      (duoc) sau.unlock();</div><div>        <span class="kw">return</span> duoc;</div><div>    }
      <span class="kw">catch</span> (InterruptedException e) {</div><div>        <span
      class="kw">return</span> <span class="kw">false</span>;</div><div>    } <span
      class="kw">finally</span> { dau.unlock(); }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Oracle tự phát hiện vòng chờ, nên để thấy bế tắc ta mô phỏng bằng Java, với
      mỗi hàng là một khoá. Mỗi luồng giữ hàng thứ nhất, ngủ một chút để luồng kia
      kịp giữ hàng của nó, rồi xin hàng thứ hai, chờ tối đa nửa giây. Nếu hết giờ
      mà chưa xin được, ta coi là bế tắc.
  - show: '<p><b>Phần 2: thử hai thứ tự khoá</b></p><div class="code"><div><span class="kw">static</span>
      String thu(Lock x1, Lock y1, Lock x2, Lock y2) <span class="kw">throws</span>
      Exception {</div><div>    <span class="kw">boolean</span>[] ok = <span class="kw">new</span>
      <span class="kw">boolean</span>[2];</div><div>    Thread t1 = <span class="kw">new</span>
      Thread(() -&gt; ok[0] = lam(x1, y1));</div><div>    Thread t2 = <span class="kw">new</span>
      Thread(() -&gt; ok[1] = lam(x2, y2));</div><div>    t1.start(); t2.start();
      t1.join(); t2.join();</div><div>    <span class="kw">return</span> ok[0] &amp;&amp;
      ok[1] ? "xong" : "be tac";</div><div>}</div><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> Exception {</div><div>    Lock a = <span class="kw">new</span>
      ReentrantLock(), b = <span class="kw">new</span> ReentrantLock();</div><div>    System.out.println("A
      roi B  va  B roi A: " + thu(a, b, b, a));</div><div>    System.out.println("A
      roi B  va  A roi B: " + thu(a, b, a, b));</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phần này chạy hai luồng, và trả về xong hay bế tắc. Ta thử hai trường hợp.
      Hai luồng khoá ngược thứ tự, và hai luồng khoá cùng thứ tự.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>A roi B  va  B roi
      A: be tac</div><div>A roi B  va  A roi B: xong</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khi chạy thật, khoá ngược thứ tự thì bế tắc, vì mỗi luồng giữ hàng mà luồng
      kia cần. Khoá cùng thứ tự thì xong, vì luồng thứ hai không giữ được hàng đầu
      tiên nên chưa giữ gì cả, và đợi luồng thứ nhất làm xong. Mô phỏng này dùng hết
      giờ chờ, còn Oracle trả lỗi không không không sáu không cho một phiên.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: thử hết cặp thứ tự'
  checks:
  - sum(1 for p in (['A', 'B'], ['B', 'A']) for q in (['A', 'B'], ['B', 'A']) if alg.bnk_lock_sim([p,
    q]) == 'deadlock') == 2
  steps:
  - show: '<p>Đường khác: vì chỉ có hai khoá, ta vét cạn mọi cặp thứ tự, rồi chạy
      mô phỏng cho từng cặp.</p>'
    say: Kiểm bằng đường khác. Ta vét cạn mọi cặp thứ tự của hai khoá, rồi chạy mô
      phỏng cho từng cặp. Mô phỏng chỉ kiểm logic thứ tự khoá, còn cú pháp riêng của
      Oracle thì máy này không chạy được.
  - show: <table class='t'><tr><th>phiên 1</th><th>phiên 2</th><th>kết quả (khi cả
      hai kịp giữ khoá đầu)</th></tr><tr><td>A, B</td><td>A, B</td><td>bình thường</td></tr><tr><td>A,
      B</td><td>B, A</td><td>bế tắc</td></tr><tr><td>B, A</td><td>A, B</td><td>bế
      tắc</td></tr><tr><td>B, A</td><td>B, A</td><td>bình thường</td></tr></table>
    say: Bốn cặp thứ tự cho kết quả này, trong trường hợp cả hai phiên kịp giữ khoá
      đầu. Vì chỉ hai cặp ngược nhau mới bế tắc, nên kết quả khớp với bước hai. Hai
      cặp cùng thứ tự đều chạy bình thường.
  - show: '<table class=''t''><tr><th>nguyên nhân ORA-00060 ngoài đời</th><th>sắp
      thứ tự hàng có chữa được?</th><th>cách chữa</th></tr><tr><td>hai phiên khoá
      hàng ngược thứ tự</td><td>có</td><td>khoá theo id tăng dần</td></tr><tr><td>khoá
      ngoại (cột ở bảng con trỏ tới bảng cha) không có chỉ mục: xoá hay sửa khoá chính
      ở bảng cha thì Oracle khoá cả bảng con</td><td>không</td><td>tạo chỉ mục (cấu
      trúc tra nhanh) cho cột khoá ngoại</td></tr><tr><td>thiếu chỗ ITL (danh sách
      giao dịch đang sửa khối) trong khối dữ liệu (đơn vị nhỏ nhất Oracle đọc ghi
      trên đĩa, chứa nhiều hàng), INITRANS thấp</td><td>không</td><td>tăng INITRANS
      cho bảng hay chỉ mục nóng</td></tr></table>'
    clear: true
    say: Bảng này nhắc rằng ngoài đời, lỗi bế tắc còn có nguyên nhân khác. Một là
      khoá ngoại không có chỉ mục. Khoá ngoại là cột ở bảng con trỏ tới một hàng của
      bảng cha, còn chỉ mục là cấu trúc giúp tra nhanh. Khi thiếu chỉ mục đó, xoá
      hay sửa khoá chính ở bảng cha làm Oracle khoá cả bảng con, nên nhiều phiên dễ
      chờ nhau. Hai là khối dữ liệu, tức đơn vị nhỏ nhất Oracle đọc ghi trên đĩa và
      chứa nhiều hàng, thiếu chỗ ghi các giao dịch đang sửa nó. Sắp thứ tự hàng không
      chữa được hai loại này, mà phải tạo chỉ mục hoặc tăng chỗ trong khối.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ đọc dữ liệu cũng làm
      người khác chờ. Với Oracle, <b>câu SELECT thường không khoá hàng</b> và người
      đọc không chặn người ghi.</div>
    say: Lỗi thứ nhất, của người mới. Nghĩ đọc dữ liệu cũng làm người khác chờ. Với
      Oracle, câu đọc thông thường không khoá hàng, và người đọc không chặn người
      ghi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Khoá
      theo thứ tự người gọi đưa vào</b>, tức nguồn rồi đích. Hai lệnh ngược chiều
      sẽ gặp bế tắc đúng lúc cao điểm.

      <br><span class="note">Cách chữa: sắp các id tăng dần rồi khoá từng hàng bằng
      câu riêng; đừng tin <code>ORDER BY … FOR UPDATE</code> khoá theo thứ tự ORDER
      BY.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là khoá theo thứ tự người gọi đưa vào,
      tức nguồn rồi đích. Hai lệnh ngược chiều sẽ gặp bế tắc đúng lúc cao điểm. Cách
      chữa là sắp các mã tăng dần, rồi khoá từng hàng bằng một câu lệnh riêng. Đừng
      tin rằng một câu đọc kèm khoá có sắp thứ tự sẽ khoá đúng theo thứ tự đã sắp.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Gặp ORA-00060 rồi
      <b>thử lại ngay</b>. Theo mô tả của Oracle, chỉ <b>câu lệnh</b> bị huỷ, không
      phải cả giao dịch, nên các khoá cũ vẫn còn.

      <br><span class="note">Cách chữa: rollback cả giao dịch rồi mới thử lại, kèm
      giới hạn số lần thử.</span></div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là gặp lỗi bế tắc rồi thử lại ngay.
      Theo mô tả của Oracle, chỉ câu lệnh bị huỷ, không phải cả giao dịch, nên các
      khoá cũ vẫn còn. Cách chữa là hoàn tác cả giao dịch rồi mới thử lại, kèm giới
      hạn số lần thử.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 3 * 2 * 1 == 6 == len(list(__import__('itertools').permutations('ABC')))
  - sorted([9, 4]) == [4, 9]
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Với
      3 khoá, mỗi phiên khoá cả 3 theo một thứ tự. Mỗi phiên có bao nhiêu thứ tự?</td></tr><tr><td>2</td><td>Chuyển
      tiền từ tài khoản 9 sang tài khoản 4. Thứ tự khoá đúng?</td></tr><tr><td>3</td><td>Quyết
      định: tránh bế tắc bằng sắp thứ tự, hay đặt giới hạn chờ rồi thử lại?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, với ba khoá, mỗi phiên khoá cả
      ba theo một thứ tự, mỗi phiên có bao nhiêu thứ tự? Câu hai, chuyển tiền từ tài
      khoản chín sang tài khoản bốn, thứ tự khoá đúng là gì? Câu ba, nên tránh bế
      tắc bằng sắp thứ tự, hay đặt giới hạn chờ rồi thử lại? Hãy dừng video và làm
      ra giấy.
  - show: '<p>Câu 1: chọn khoá đầu có $3$ cách, khoá hai có $2$ cách, khoá ba có $1$
      cách.</p>

      $$3 \cdot 2 \cdot 1 = \hl{6}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Khoá đầu có ba cách chọn, khoá thứ hai có hai cách, khoá
      thứ ba còn một cách. Ba nhân hai nhân một bằng sáu thứ tự.
    clear: true
  - show: '<p>Câu 2: id nhỏ trước, id lớn sau.</p>

      $$\text{khoá } 4 \text{ trước, rồi khoá } 9$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Luôn khoá mã nhỏ trước, nên khoá tài khoản bốn trước, rồi
      mới khoá tài khoản chín, dù tiền đi từ chín sang bốn.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>sắp
      thứ tự khoá</td><td>ngăn bế tắc từ gốc</td><td>phải biết trước mọi khoá cần
      lấy</td></tr><tr><td>giới hạn chờ rồi thử lại</td><td>đơn giản, bắt được mọi
      trường hợp</td><td>bế tắc vẫn xảy ra, tốn thời gian chờ và thử lại</td></tr></table>
    say: Đáp án câu ba. Sắp thứ tự khoá ngăn bế tắc từ gốc, nhưng phải biết trước
      mọi khoá cần lấy. Giới hạn chờ rồi thử lại đơn giản và bắt được mọi trường hợp,
      nhưng bế tắc vẫn xảy ra. Hệ thống thật thường dùng cả hai.
    clear: true
- id: quy_mo
  kind: example
  title: 'Quy mô: cặp phiên tăng bình phương, bế tắc từ hiếm thành liên tục'
  checks:
  - 10 * 9 // 2 == 45
  - round(45 * 0.0001, 4) == 0.0045
  - 1000 * 999 // 2 == 499500
  - round(499500 * 0.0001) == 50
  - 100000 * 99999 // 2 == 4_999_950_000
  - round(4_999_950_000 * 0.0001) == 499995
  steps:
  - show: <p>Gọi $T$ là số phiên chạy cùng lúc. Số cặp phiên là $\frac{T \cdot (T
      - 1)}{2}$. Giả sử mỗi cặp có xác suất $0{,}0001$ khoá ngược thứ tự nhau <i>(số
      minh hoạ)</i>; số cặp gây bế tắc kỳ vọng là số cặp nhân $0{,}0001$.</p><table
      class='t'><tr><th>tải</th><th>phiên cùng lúc T</th><th>số cặp phiên</th><th>cặp
      ngược thứ tự kỳ vọng</th></tr><tr><td>×1</td><td>10</td><td>45</td><td>0,0045
      (hiếm)</td></tr><tr><td>×100</td><td>1 000</td><td>499 500</td><td><b>≈ 50</b></td></tr><tr><td>×10
      000</td><td>100 000</td><td>4 999 950 000</td><td><b>≈ 500 000</b></td></tr></table>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Gọi T là số phiên chạy cùng lúc, thì số cặp phiên là T nhân T trừ một, chia
      hai. Giả sử mỗi cặp có xác suất một phần mười nghìn khoá ngược thứ tự nhau,
      đây là số minh hoạ. Với mười phiên có bốn mươi lăm cặp, nên kỳ vọng chỉ không
      phẩy không không bốn năm cặp ngược thứ tự, rất hiếm. Tải tăng một trăm lần,
      số cặp lên gần năm trăm nghìn, và kỳ vọng khoảng năm mươi cặp. Tải tăng mười
      nghìn lần, kỳ vọng khoảng năm trăm nghìn cặp.
  - show: '<div class="box warn"><b>Giải pháp cũ gãy ở đâu.</b> Dựa vào “bế tắc hiếm,
      để cơ sở dữ liệu phát hiện rồi thử lại”: ở ×1 hiếm tới mức không ai thấy, ở
      ×100 xảy ra vài chục lần mỗi lượt, ở ×10 000 liên tục; mỗi lần có một phiên
      bị huỷ rồi thử lại, càng thử càng thêm phiên chờ.</div>

      <div class="box key"><b>Quy tắc khoá theo thứ tự mã tăng dần</b> xoá hẳn vòng
      chờ ở mọi tải. <b>Đánh đổi:</b> phải biết trước mọi hàng cần khoá để sắp thứ
      tự; khi chỉ biết dần trong lúc chạy thì vẫn cần hết giờ chờ và thử lại có giới
      hạn.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Giải pháp cũ là dựa vào việc bế tắc hiếm, để cơ sở dữ liệu phát hiện rồi
      thử lại. Ở tải gốc nó hiếm tới mức không ai thấy. Ở tải gấp trăm lần, nó xảy
      ra vài chục lần mỗi lượt, và ở tải gấp mười nghìn lần là liên tục. Mỗi lần có
      một phiên bị huỷ rồi thử lại, càng thử càng thêm phiên chờ. Quy tắc khoá theo
      thứ tự mã tăng dần xoá hẳn vòng chờ ở mọi tải. Đánh đổi là phải biết trước mọi
      hàng cần khoá để sắp thứ tự. Khi chỉ biết dần trong lúc chạy thì vẫn cần hết
      giờ chờ và thử lại có giới hạn.
- id: practice
  kind: practice
  title: 'Tự làm: thứ tự khoá cho bốn lệnh chuyển'
  steps:
  - show: '<p><b>Đề</b>: quy tắc <b>khoá mã nhỏ trước</b>. Bốn lệnh chuyển <code>(từ,
      tới)</code>: <code>(4,9) (9,4) (7,4) (4,7)</code>. Viết <code>ThuTuKhoa.java</code>:</p>

      <ol><li>duyệt bốn lệnh</li><li>mỗi lệnh tính mã nhỏ hơn bằng <code>Math.min</code>,
      mã lớn hơn bằng <code>Math.max</code></li>

      <li>in một dòng <code>4 -&gt; 9: khoa 4 roi 9</code></li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    pause: 120
    say: Bây giờ tới phần bạn tự làm. Quy tắc là luôn khoá hàng có mã nhỏ hơn trước.
      Có bốn lệnh chuyển, từ bốn tới chín, từ chín tới bốn, từ bảy tới bốn, và từ
      bốn tới bảy. Hãy viết chương trình duyệt từng lệnh, dùng hàm lấy số nhỏ hơn
      và số lớn hơn để tìm thứ tự khoá, rồi in mỗi lệnh một dòng. Hãy dừng video,
      tự viết và chạy, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>4 -&gt; 9: khoa 4
      roi 9</div><div>9 -&gt; 4: khoa 4 roi 9</div><div>7 -&gt; 4: khoa 4 roi 7</div><div>4
      -&gt; 7: khoa 4 roi 7</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh BNK L05 ThuTuKhoa.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> khai <code>int[][] lenh = { {4, 9},
      {9, 4}, {7, 4}, {4, 7} };</code>, duyệt bằng <code>for (int[] l : lenh)</code>,
      rồi

      <code>int dau = Math.min(l[0], l[1]);</code> và <code>int sau = Math.max(l[0],
      l[1]);</code>. Lời giải ở <code>labs/BNK/L05/loi_giai.java</code> — chỉ mở sau
      khi bạn đã thử.</div>

      '
    say: Nếu kẹt, khai một mảng gồm bốn cặp số, duyệt từng cặp, rồi lấy số nhỏ hơn
      làm khoá trước và số lớn hơn làm khoá sau. Lời giải đầy đủ nằm trong thư mục
      thực hành của bài, chỉ mở sau khi bạn đã tự thử.
    clear: true
  lab: labs/BNK/L05
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>giữ khoá, xin khoá khác</span><span class='a'>→</span><span
      class='n'>hai phiên ngược thứ tự</span><span class='a'>→</span><span class='n'>vòng
      tròn chờ = bế tắc</span><span class='a'>→</span><span class='n'>luôn khoá theo
      thứ tự id tăng</span></div>
    say: Tổng kết chuỗi logic. Phiên giữ một khoá và xin khoá khác. Hai phiên ngược
      thứ tự thì tạo vòng tròn chờ, tức bế tắc. Luôn khoá theo thứ tự mã tăng dần
      để chặn vòng tròn.
  - show: '<div class=''box key''><b>Tư duy:</b> bế tắc là lỗi <b>thiết kế thứ tự</b>,
      không phải lỗi may rủi.

      Gặp bế tắc: rollback cả giao dịch, thử lại có giới hạn, và sửa thứ tự khoá.</div>

      '
    say: Điều cần mang theo. Bế tắc là lỗi thiết kế thứ tự, không phải lỗi may rủi.
      Gặp bế tắc thì hoàn tác cả giao dịch, thử lại có giới hạn, và sửa thứ tự khoá.
