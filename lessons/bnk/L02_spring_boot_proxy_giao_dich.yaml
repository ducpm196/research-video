      x="710.0" y="299" font-size="24" text-anchor="middle" fill="#1f2937">gọi thẳng,
      không qua proxy</text><line x1="340" y1="85" x2="475" y2="85" stroke="#9333ea"
      stroke-width="3.5" marker-end="url(#ah)"/><line x1="710" y1="135" x2="710" y2="225"
      stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text x="1230" y="150"
      font-size="26" text-anchor="middle" fill="#dc2626" font-weight="bold">Không
      qua proxy</text><text x="1230" y="190" font-size="26" text-anchor="middle" fill="#dc2626"
      font-weight="bold">nên không có</text><text x="1230" y="230" font-size="26"
      text-anchor="middle" fill="#dc2626" font-weight="bold">giao dịch mới</text></svg></div>
    clear: true
    say: Nhưng khi hàm chuyển tiền bên trong tự gọi ghi vết bằng cách gọi thẳng chính
      nó, lời gọi đó đi thẳng, không qua proxy. Không có proxy thì không ai đọc nhãn,
      nên không có giao dịch mới. Đây chính là lỗi mở đầu bài.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: khi nào có giao dịch mới?'
  checks:
  - alg.bnk_spring_sim(True, 'REQUIRES_NEW', True)[0] == 1 + 1
  - alg.bnk_spring_sim(False, 'REQUIRES_NEW', True)[0] == 1
  - alg.bnk_spring_sim(True, 'REQUIRES_NEW', True)[1] == ['audit']
  steps:
  - show: '<p><b>Bước 1.</b> Vì lớp này có phương thức mang nhãn giao dịch, người
      gọi từ bên ngoài nhận <b>proxy</b>, nên lời gọi đầu tiên vào <code>chuyenTien()</code>
      đi qua proxy và mở giao dịch 1.</p>

      <span class=''note''>Làm thử: số giao dịch đã mở = $1$.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, vì lớp dịch vụ có phương thức mang nhãn giao dịch, nên người gọi
      từ bên ngoài nhận proxy. Lời gọi đầu tiên vào hàm chuyển tiền vì vậy đi qua
      proxy và mở giao dịch thứ nhất. Làm thử, số giao dịch đã mở bằng một.
  - show: '<p><b>Bước 2.</b> Hàm ghi vết với chế độ <code>REQUIRES_NEW</code> chỉ
      mở giao dịch mới khi lời gọi <b>đi qua proxy</b>.</p>

      <span class=''note''>Qua proxy: $1 + 1 = 2$ giao dịch. Gọi thẳng: vẫn $1$ giao
      dịch.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, vì proxy mới là nơi đọc nhãn, nên hàm ghi vết chỉ mở giao dịch
      mới khi lời gọi đi qua proxy. Làm thử, qua proxy thì một cộng một bằng hai giao
      dịch, còn gọi thẳng vẫn chỉ một giao dịch.
  - show: '<p><b>Bước 3.</b> Giao dịch mới commit riêng, nên khi giao dịch ngoài hỏng,
      dòng ghi vết vẫn còn. Giao dịch dùng chung thì mất theo.</p>

      <p class="small">Mặc định Spring chỉ rollback khi <code>RuntimeException</code>
      hoặc <code>Error</code> (lỗi nghiêm trọng của máy ảo, như hết bộ nhớ) bay ra
      khỏi phương thức; ngoại lệ bắt buộc xử lý thì vẫn commit, trừ khi khai báo <code>rollbackFor</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, vì giao dịch mới chốt riêng, nên khi giao dịch ngoài hỏng, dòng
      ghi vết vẫn còn. Còn giao dịch dùng chung thì mất theo. Mặc định Spring chỉ
      hoàn tác khi một ngoại lệ thời gian chạy, hoặc một lỗi nghiêm trọng của máy
      ảo như hết bộ nhớ, bay ra khỏi phương thức. Ngoại lệ loại bắt buộc xử lý thì
      mặc định vẫn chốt, trừ khi ta khai báo thêm trong nhãn.
- id: example
  kind: example
  title: Ví dụ bằng số, từng trường hợp
  checks:
  - alg.bnk_spring_sim(False, 'REQUIRES_NEW', True)[0] == 1
  - len(alg.bnk_spring_sim(False, 'REQUIRES_NEW', True)[1]) == 0
  - alg.bnk_spring_sim(True, 'REQUIRES_NEW', True)[0] == 1 + 1
  - len(alg.bnk_spring_sim(True, 'REQUIRES_NEW', True)[1]) == 1
  - len(alg.bnk_spring_sim(True, 'REQUIRES_NEW', False)[1]) == 2
  steps:
  - show: '<p>Chuyển $500\,000$ đồng, giao dịch ngoài hỏng. <b>Trường hợp A:</b> ghi
      vết gọi thẳng bằng <code>this</code>.</p>

      $$① \; \text{giao dịch đã mở} = \hl{1}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta chạy ba trường hợp. Trường hợp A, chuyển năm trăm nghìn đồng, giao dịch
      ngoài hỏng, ghi vết gọi thẳng chính nó. Phép tính thứ nhất, số giao dịch đã
      mở là một.
  - show: '<p>Giao dịch ngoài hỏng nên rollback cả hai dòng.</p>

      $$② \; \text{dòng còn lại} = \hl{0}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, giao dịch ngoài hỏng nên hoàn tác cả dòng chuyển tiền
      lẫn dòng ghi vết. Số dòng còn lại là không.
  - show: '<p><b>Trường hợp B:</b> ghi vết gọi qua bean khác, chế độ mới.</p>

      $$③ \; \text{giao dịch đã mở} = 1 + 1 = \hlg{2}$$

      '
    focus:
    - 1
    - 2
    say: Trường hợp B, ghi vết gọi qua một bean khác với chế độ mới. Phép tính thứ
      ba, số giao dịch đã mở là một cộng một bằng hai.
  - show: '<p>Dòng ghi vết commit riêng, dòng chuyển tiền bị huỷ.</p>

      $$④ \; \text{dòng còn lại} = \hlg{1}\ \text{(dòng ghi vết)}$$

      '
    say: Phép tính thứ tư, dòng ghi vết đã chốt riêng, còn dòng chuyển tiền bị huỷ,
      nên còn lại đúng một dòng, là dòng ghi vết.
  - show: '<p><b>Trường hợp C:</b> mọi thứ thành công, lời gọi qua proxy.</p>

      $$⑤ \; \text{dòng còn lại} = \hlg{2}$$

      '
    focus:
    - 1
    - 2
    say: Trường hợp C, mọi việc thành công. Phép tính thứ năm, cả hai dòng đều chốt,
      nên còn hai dòng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm lần đi qua proxy'
  checks:
  - alg.bnk_spring_sim(True, 'REQUIRED', True)[0] == 1 + 0
  - all(alg.bnk_spring_sim(v, m, False)[0] == 1 + (1 if (v and m == 'REQUIRES_NEW')
    else 0) for v in (True, False) for m in ('REQUIRED', 'REQUIRES_NEW'))
  steps:
  - show: '<p>Đường khác: vì chỉ proxy mới mở giao dịch, nên số giao dịch bằng giao
      dịch đầu cộng <b>số lần lời gọi đi qua proxy có chế độ mở mới</b>.</p>

      $$\text{giao dịch} = 1 + \text{số lần qua proxy với chế độ mới}$$

      '
    focus:
    - 1
    - 2
    say: Kiểm bằng đường khác. Vì chỉ proxy mới mở giao dịch, nên số giao dịch bằng
      một, là giao dịch đầu, cộng số lần lời gọi đi qua proxy với chế độ mở mới.
  - show: '<table class=''t''><tr><th>trường hợp</th><th>lần qua proxy với chế độ
      mới</th><th>giao dịch = 1 + lần</th><th>khớp mô phỏng</th></tr><tr><td>A: gọi
      thẳng</td><td>0</td><td>1</td><td>có</td></tr><tr><td>B: qua bean khác</td><td>1</td><td>2</td><td>có</td></tr><tr><td>REQUIRED
      qua proxy</td><td>0</td><td>1</td><td>có</td></tr></table>'
    say: Bảng này so sánh. Gọi thẳng thì không có lần nào qua proxy, nên một giao
      dịch. Qua bean khác với chế độ mới là một lần, nên hai giao dịch. Chế độ dùng
      chung qua proxy cũng không mở thêm, nên một giao dịch. Cả ba khớp mô phỏng.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Tự viết <code>new TransferService()</code>.
      Đối tượng đó không do Spring tạo, nên không được nối phụ thuộc và không có proxy.</div>
    say: Lỗi thứ nhất, của người mới. Tự tạo đối tượng dịch vụ bằng từ khoá tạo mới.
      Đối tượng đó không do Spring tạo, nên không được nối phụ thuộc và không có proxy.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Gọi
      hàm có nhãn giao dịch từ trong cùng lớp</b> bằng <code>this</code>. Ở chế độ
      proxy (mặc định), nhãn bị bỏ qua.

      <br><span class="note">Cách chữa: tách hàm sang bean khác, rồi gọi qua bean
      đó.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là gọi hàm có nhãn giao dịch từ trong cùng
      lớp bằng cách gọi thẳng chính nó. Ở chế độ proxy mặc định, nhãn bị bỏ qua vì
      lời gọi không đi qua proxy. Cách chữa là tách hàm sang bean khác rồi gọi qua
      bean đó.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Bắt ngoại lệ bằng
      <code>try … catch</code> ngay trong hàm có nhãn rồi chỉ ghi log. Ngoại lệ không
      bay ra tới proxy, nên proxy <b class="red">commit nửa chừng</b>.</div>
    say: Lỗi thứ ba, cũng của người đã đi làm, là bắt ngoại lệ ngay trong hàm có nhãn
      rồi chỉ ghi nhật ký. Ngoại lệ không bay ra tới proxy, nên proxy không thấy lỗi
      nào và cứ chốt, làm dữ liệu bị lưu nửa chừng.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - len(alg.bnk_spring_sim(True, 'REQUIRES_NEW', True)[1]) == 1
  - len(alg.bnk_spring_sim(True, 'REQUIRED', True)[1]) == 0
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Gọi
      ghi vết qua proxy, chế độ mới, giao dịch ngoài hỏng. Còn dòng nào?</td></tr><tr><td>2</td><td>Như
      câu 1 nhưng chế độ dùng chung (REQUIRED). Còn dòng nào?</td></tr><tr><td>3</td><td>Quyết
      định: đặt hàm ghi vết ở đâu để luôn lưu được vết?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, gọi ghi vết qua proxy, chế độ mới,
      giao dịch ngoài hỏng, còn dòng nào? Câu hai, như câu một nhưng chế độ dùng chung,
      còn dòng nào? Câu ba, đặt hàm ghi vết ở đâu để luôn lưu được vết? Hãy dừng video
      và làm ra giấy.
  - show: '<p>Câu 1: giao dịch mới commit riêng, nên còn dòng ghi vết.</p>

      $$\text{số dòng} = \hl{1}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một. Giao dịch mới chốt riêng, nên còn đúng dòng ghi vết, một
      dòng.
    clear: true
  - show: '<p>Câu 2: dùng chung thì ghi vết nằm trong giao dịch ngoài, nên bị rollback
      cùng.</p>

      $$\text{số dòng} = \hl{0}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai. Chế độ dùng chung đưa ghi vết vào giao dịch ngoài, nên bị
      hoàn tác cùng, số dòng là không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hàm
      ghi vết ở bean riêng, chế độ mới</td><td>vết lưu kể cả khi giao dịch chính hỏng</td><td>tốn
      thêm một giao dịch</td></tr><tr><td>cùng lớp, gọi bằng this</td><td>ít mã</td><td>nhãn
      bị bỏ qua, vết mất</td></tr></table>
    say: Đáp án câu ba. Đặt hàm ghi vết ở một bean riêng với chế độ mới, thì vết luôn
      được lưu dù giao dịch chính hỏng, đổi lại tốn thêm một giao dịch. Để cùng lớp
      thì ít mã nhưng nhãn bị bỏ qua.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>Spring tạo bean</span><span class='a'>→</span><span
      class='n'>trao proxy cho người gọi</span><span class='a'>→</span><span class='n'>proxy
      đọc nhãn</span><span class='a'>→</span><span class='n'>mở / đóng giao dịch</span></div>
    say: Tổng kết chuỗi logic. Spring tạo bean, trao proxy cho người gọi. Proxy đọc
      nhãn rồi mở và đóng giao dịch.
  - show: '<div class=''box key''><b>Tư duy:</b> nhãn chỉ có tác dụng khi lời gọi
      <b>đi qua proxy</b>.

      Khi giao dịch “không chạy”, hãy hỏi trước tiên: lời gọi này có đi qua proxy
      không?</div>

      '
    say: Điều cần mang theo. Nhãn chỉ có tác dụng khi lời gọi đi qua proxy. Khi giao
      dịch không chạy, hãy hỏi trước tiên, lời gọi này có đi qua proxy không.
