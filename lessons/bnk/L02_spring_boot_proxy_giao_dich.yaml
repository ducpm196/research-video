scenes:
- id: hook
  kind: hook
  title: Vì sao dòng ghi vết vẫn mất dù đã gắn nhãn giao dịch?
  steps:
  - show: '<p>Một lệnh chuyển tiền thất bại giữa chừng. Lập trình viên gắn <code>@Transactional</code>
      lên hàm chuyển tiền, và nhãn giao dịch <b>luôn mở giao dịch mới</b> lên hàm
      ghi vết, vậy mà dòng ghi vết <b>không còn</b> trong bảng.</p>

      <div class="box key">Hôm nay ta trả lời: Spring <b>tạo và nối</b> các đối tượng
      thế nào, <b>proxy</b> là gì, và vì sao nhãn giao dịch đôi khi <b>không có tác
      dụng</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một lệnh chuyển tiền thất bại giữa chừng. Lập trình viên đã gắn
      nhãn giao dịch lên hàm chuyển tiền, và nhãn luôn mở giao dịch mới lên hàm ghi
      vết, vậy mà dòng ghi vết không còn trong bảng. Hôm nay ta trả lời ba câu. Spring
      tạo và nối các đối tượng thế nào, proxy là gì, và vì sao nhãn giao dịch đôi
      khi không có tác dụng.
  - show: <table class='t'><tr><th>cách gọi hàm ghi vết (nhãn luôn mở giao dịch mới)</th><th>giao
      dịch đã mở</th><th>dòng ghi vết sau khi chuyển tiền hỏng</th></tr><tr><td>gọi
      thẳng trong cùng lớp</td><td>1</td><td>mất</td></tr><tr><td>gọi qua một bean
      khác (qua proxy)</td><td>2</td><td>còn</td></tr></table>
    say: Bảng này là kết quả mô phỏng ở cuối bài, khi hàm ghi vết mang nhãn luôn mở
      giao dịch mới. Nếu hàm ghi vết được gọi thẳng trong cùng lớp, chỉ có một giao
      dịch được mở và dòng ghi vết mất theo. Nếu gọi qua một bean khác, tức là qua
      proxy, có hai giao dịch và dòng ghi vết còn lại.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - -500000 + 500000 == 0
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Lớp và đối tượng</td><td>lớp là khuôn, đối tượng là bản làm ra từ khuôn; hàm
      viết trong lớp gọi là phương thức</td><td>lớp TaiKhoan, đối tượng tài khoản
      số 1</td></tr><tr><td>② Một hàm gọi hàm khác</td><td>phương thức A có thể gọi
      phương thức B của chính đối tượng đó hoặc của đối tượng khác</td><td>chuyenTien
      gọi ghiVet</td></tr><tr><td>③ Giao dịch</td><td>một nhóm thao tác ghi vào cơ
      sở dữ liệu (phần mềm lưu dữ liệu lâu dài thành các bảng, mỗi bảng nhiều dòng):
      hoặc cùng thành công, hoặc cùng huỷ</td><td>trừ tiền và cộng tiền cùng lúc</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Lớp là cái khuôn, đối tượng là bản làm ra
      từ khuôn, và một hàm viết trong lớp gọi là phương thức. Một phương thức có thể
      gọi phương thức khác của chính đối tượng đó, hoặc của đối tượng khác, ví dụ
      chuyển tiền gọi ghi vết. Cơ sở dữ liệu là phần mềm lưu dữ liệu lâu dài thành
      các bảng, mỗi bảng gồm nhiều dòng. Giao dịch là nhóm thao tác ghi vào cơ sở
      dữ liệu mà hoặc cùng thành công, hoặc cùng bị huỷ, ví dụ trừ tiền và cộng tiền.
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      Ngoại lệ (exception)</td><td>đối tượng báo lỗi được “ném” ra; phương thức dừng
      ngay, lỗi bay ngược lên người gọi tới khi có chỗ bắt (<code>try … catch</code>)</td><td><code>throw
      new RuntimeException("hết tiền")</code></td></tr><tr><td>loại không bắt buộc
      xử lý</td><td><code>RuntimeException</code> và các lớp con: Java không bắt phải
      khai báo hay bắt</td><td>chia cho 0, số dư âm</td></tr><tr><td>loại bắt buộc
      xử lý (checked)</td><td>Java buộc người viết phải bắt hoặc khai báo <code>throws</code></td><td><code>IOException</code>
      khi đọc tệp</td></tr></table>'
    clear: true
    say: Điều thứ tư là ngoại lệ. Ngoại lệ là một đối tượng báo lỗi được ném ra. Phương
      thức đang chạy dừng ngay, và lỗi bay ngược lên người gọi, cho tới khi có chỗ
      bắt nó. Java chia ngoại lệ làm hai loại. Loại thời gian chạy thì Java không
      bắt buộc phải khai báo hay bắt, ví dụ lỗi số dư âm do ta tự ném. Loại bắt buộc
      xử lý thì người viết phải bắt hoặc khai báo, ví dụ lỗi khi đọc tệp.
  - show: $$-500\,000 + 500\,000 = 0$$
    say: Một ví dụ số cho giao dịch. Trừ năm trăm nghìn ở một tài khoản và cộng năm
      trăm nghìn ở tài khoản kia, tổng bằng không. Nếu chỉ làm một nửa, sổ sách lệch.
- id: sym
  kind: symbol
  title: Giải mã vài từ trong Spring
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Spring / Spring
      Boot</td><td>bộ khung viết dịch vụ Java: lo tạo đối tượng, nối chúng, mở giao
      dịch; Spring Boot là cách đóng gói và chạy nhanh bộ khung đó</td></tr><tr><td>nhãn
      (annotation)</td><td>dòng bắt đầu bằng <code>@</code> đặt trên phương thức hay
      lớp, mang lời dặn cho công cụ khác đọc, ví dụ <code>@Transactional</code></td></tr><tr><td>từ
      khoá <code>this</code></td><td>tham chiếu tới chính đối tượng đang chạy phương
      thức; <code>this.ghiVet()</code> là tự gọi mình</td></tr><tr><td>commit / rollback</td><td>chốt
      lưu vĩnh viễn mọi thay đổi của giao dịch / huỷ mọi thay đổi đó</td></tr></table>'
    say: Bảng này giải mã bốn từ đầu. Spring là bộ khung viết dịch vụ Java, lo tạo
      đối tượng, nối chúng với nhau và mở giao dịch. Spring Boot là cách đóng gói
      và chạy nhanh bộ khung đó. Nhãn là dòng bắt đầu bằng ký hiệu a còng đặt trên
      phương thức hay lớp, mang lời dặn cho công cụ khác đọc, ví dụ nhãn giao dịch.
      Từ khoá tự chỉ là tham chiếu tới chính đối tượng đang chạy, nên gọi qua từ khoá
      này là đối tượng tự gọi mình. Chốt là lưu vĩnh viễn mọi thay đổi của giao dịch,
      còn hoàn tác là huỷ mọi thay đổi đó.
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>bean</td><td>đối
      tượng do Spring tạo và quản lý</td></tr><tr><td>IoC (đảo điều khiển)</td><td>bạn
      không tự tạo đối tượng bằng new, Spring tạo rồi trao cho bạn</td></tr><tr><td>tiêm
      phụ thuộc</td><td>Spring nối các bean với nhau, thường qua hàm tạo (phương thức
      chạy lúc tạo đối tượng)</td></tr><tr><td>proxy</td><td>một đối tượng vỏ bọc
      bean, chạy thêm việc trước và sau khi gọi phương thức</td></tr><tr><td>REQUIRED
      / REQUIRES_NEW</td><td>tham gia giao dịch đang có / luôn mở giao dịch mới</td></tr></table>
    clear: true
    say: Bảng thứ hai giải thích nghĩa của năm thuật ngữ tiếp theo. Bean là đối tượng
      do Spring tạo và quản lý. Đảo điều khiển nghĩa là bạn không tự tạo đối tượng,
      Spring tạo rồi trao cho bạn. Tiêm phụ thuộc là Spring nối các bean với nhau,
      thường qua hàm tạo, tức phương thức chạy lúc tạo đối tượng. Proxy là đối tượng
      vỏ bọc bean, chạy thêm việc trước và sau lời gọi. Cuối cùng, chế độ tham gia
      nghĩa là dùng giao dịch đang có, còn chế độ mới nghĩa là luôn mở giao dịch mới.
