- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">gửi lại lịch sử mỗi bước</span><span class="a">→</span>

      <span class="n">tổng có số hạng n²</span><span class="a">→</span>

      <span class="n">bộ nhớ đệm tiền tố: phần đầu cố định</span><span class="a">→</span>

      <span class="n">lịch sử gọn, gộp lời gọi độc lập</span></div>

      '
    say: Tổng kết lại, tác tử gửi lại lịch sử mỗi bước, nên tổng từ tố có số hạng n bình phương. Dùng bộ nhớ đệm tiền tố với phần đầu cố định, giữ lịch sử gọn, và gộp các lời gọi độc lập. Giữ phần đầu lời nhắc cố định để tận dụng bộ nhớ đệm tiền tố giúp giảm mạnh thời gian xử lý lẫn chi phí trên các vòng lặp nhiều bước.
  - show: '<div class="box key"><b>Tư duy:</b> khi gửi lại cả lịch sử, chi phí của tác tử không tỉ lệ với số bước — khi chạy nhiều bước hơn, chi phí tăng tiệm cận với <b>bình phương</b> số bước. Hãy thiết kế để lịch sử không phình.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ vòng lặp 10 bước gửi lại toàn bộ 42 500 từ tố tới 40 bước (tăng bậc hai lên hàng trăm nghìn từ tố): kích hoạt bộ nhớ đệm tiền tố cắt mạnh chi phí tính lặp nhưng buộc giữ phần đầu lời nhắc cố định.</p>

      '
    say: Điều cần mang theo, khi gửi lại cả lịch sử, chi phí tác tử không tỉ lệ với số bước mà tiến nhanh tới tỉ lệ với bình phương số bước. Vì vậy hãy thiết kế để lịch sử không phình. Từ 10 bước gửi lại hơn 42 nghìn từ tố tới 40 bước tăng gần theo bình phương. Bộ nhớ đệm tiền tố giúp giảm chi phí lặp nhưng buộc cố định phần đầu lời nhắc.
    focus:
    - 1
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 9): <b>an toàn cho tác tử</b> — chèn lời nhắc gián tiếp, quyền tối thiểu, xác nhận của người dùng.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 9, ta học an toàn cho tác tử, với chèn lời nhắc gián tiếp, quyền tối thiểu, và xác nhận của người dùng. Hẹn gặp bạn ở bài tiếp theo.
