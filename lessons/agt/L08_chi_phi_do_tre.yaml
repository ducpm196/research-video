id: L08
course: AGT
series: "AGT · AI agent"
title: "Bài 8 — Chi phí và độ trễ: ngân sách từ tố và bộ nhớ đệm lời nhắc"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L08; audit/agt/verify_agt.py L08; tài liệu các nhà cung cấp mô hình về bộ nhớ đệm tiền tố của lời nhắc, ví dụ Anthropic, Prompt caching (platform.claude.com/docs/en/build-with-claude/prompt-caching, truy cập 2026-11-08, no revision given) — khớp tiền tố 100%, độ dài tối thiểu theo mô hình, hạn mặc định 5 phút, ghi đắt hơn giá thường (tỉ lệ giá trong bài là SỐ MINH HOẠ); LLM bài 5 (bộ nhớ đệm khoá–giá trị); bài 3 (ngân sách ngữ cảnh)"
assumes: [arith, sum, approx, frac]
# Quy ước: vòng lặp n bước, ngữ cảnh bắt đầu S từ tố và tăng G mỗi bước, mỗi bước GỬI LẠI toàn bộ ngữ cảnh: tổng đầu vào = Σ (S + G·i), i = 0 … n − 1
#   (alg.loop_tokens). Bộ nhớ đệm tiền tố: phần ngữ cảnh đã gửi ở bước trước được tính 10% giá (SỐ MINH HOẠ — tỉ lệ thật tuỳ nhà cung cấp),
#   phần mới tính đủ giá. “Quy đổi” = số từ tố tính theo giá đầy đủ.
objectives:
  - "Tính tổng từ tố của vòng lặp nhiều bước"
  - "Giải thích lợi ích của bộ nhớ đệm tiền tố"
  - "Giữ chi phí không tăng gần theo bình phương số bước"
asr_reviewed:
  - {sentence: "Bước thứ i, đếm từ 0, gửi S cộng G nhân i từ tố.", reason: "ASR chép “Bước thứ Y, đếm từ 0, gửi S cộng Ve nhân Y từ tố.” (0.929): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Gấp đôi số bước, gấp ba tiền"
    checks:
      - "alg.loop_tokens(2000, 500, 10)[0] == 42500 and alg.loop_tokens(2000, 500, 20)[0] == 135000"
    steps:
      - show: |
          <p>Tác tử 10 bước tốn 42 500 từ tố đầu vào. Cho nó làm việc dài gấp đôi — 20 bước — thì tốn <b>135 000</b>, gấp hơn 3 lần. Vì mỗi bước gửi lại <b>toàn bộ</b> lịch sử, và lịch sử thì ngày càng dài.</p>
          <div class="box key">Hôm nay: tính <b>ngân sách từ tố</b> của tác tử, và hai cách giảm: <b>bộ nhớ đệm tiền tố</b> và giữ lịch sử gọn.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một tác tử 10 bước tốn 42 nghìn 500 từ tố đầu vào. Cho nó làm việc dài gấp đôi, tức 20 bước, thì tốn 135 nghìn, gấp hơn 3 lần. Đó là vì mỗi bước gửi lại toàn bộ lịch sử, và lịch sử thì ngày càng dài. Hôm nay ta tính ngân sách từ tố của tác tử, và hai cách giảm, bộ nhớ đệm tiền tố và giữ lịch sử gọn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cộng một dãy cách đều, và lấy phần trăm"
    checks:
      - "sum(range(10)) == 45 == 9 * 10 // 2 and (1 + 9) * 4 + 5 == 45"
      - "round(0.1 * 6000) == 600 and 2000 + 500 * 9 == 6500"
    steps:
      - show: |
          <p>Cộng $0 + 1 + 2 + \dots + 9$. Ghép đầu với cuối: $1 + 9$, $2 + 8$, $3 + 7$, $4 + 6$ — bốn cặp, mỗi cặp 10 — còn lẻ số 5:</p>
          <table class="t"><tr><th>cách tính</th><th>kết quả</th></tr>
          <tr><td>ghép cặp: $4 \cdot 10 + 5$</td><td>45</td></tr>
          <tr><td>công thức: $\frac{9 \cdot 10}{2}$</td><td>$\hl{45}$</td></tr></table>
        introduces: [cdot, dots]
        focus: [1, 1, "2.2", "2.3"]
        say: "Trước hết, ôn cách cộng một dãy số cách đều, ví dụ 0 cộng 1 cộng 2, và cứ thế tiếp tục tới 9. Ta ghép số đầu với số cuối, 1 với 9, 2 với 8, 3 với 7, 4 với 6, được bốn cặp, mỗi cặp bằng 10, còn lẻ số 5. Vậy tổng là 4 nhân 10 cộng 5, bằng 45. Công thức nhanh là 9 nhân 10 chia 2, cũng bằng 45, và ta sẽ dùng nó để cộng số từ tố của các bước."
      - show: |
          <p>Lấy phần trăm: 10% của 6000 là $0{,}1 \cdot 6000 = 600$. Một ngữ cảnh bắt đầu 2000 và mỗi bước thêm 500 thì sau 9 lần thêm dài $2000 + 500 \cdot 9 = 6500$.</p>
          <p class="note"><b>Từ tố</b>: những mẩu chữ mô hình đọc và viết (một từ có thể là một hay vài từ tố). <b>Ngữ cảnh</b>: toàn bộ chữ gửi cho mô hình trong một lần gọi. Nhà cung cấp tính tiền theo số từ tố <b>đầu vào</b> (gửi đi) và <b>đầu ra</b> (mô hình viết).</p>
        focus: [1, 1, 2, 2, 2]
        say: "Điều thứ hai là lấy phần trăm, 10 phần trăm của 6000 là 0 phẩy 1 nhân 6000, bằng 600. Còn một ngữ cảnh bắt đầu 2000 từ tố, mỗi bước thêm 500, thì sau 9 lần thêm sẽ dài 2000 cộng 500 nhân 9, bằng 6500 từ tố. Nhắc lại, từ tố là những mẩu chữ mô hình đọc và viết, một từ có thể là một hay vài từ tố. Ngữ cảnh là toàn bộ chữ gửi cho mô hình trong một lần gọi. Nhà cung cấp tính tiền theo số từ tố đầu vào gửi đi, và số từ tố đầu ra mà mô hình viết."

  - id: sym
    kind: symbol
    title: "Giải mã: tổng từ tố và bộ nhớ đệm tiền tố"
    steps:
      - show: |
          <p>Bước thứ $i$ (đếm từ 0) gửi $S + G \cdot i$ từ tố. Tổng $n$ bước: $\sum_{i=0}^{n-1} (S + G \cdot i) = n \cdot S + G \cdot \frac{n(n - 1)}{2}$ — có số hạng <b>$n^2$</b>.</p>
        introduces: [sum, sub]
        focus: [1, 1]
        say: "Bước thứ i, đếm từ 0, gửi S cộng G nhân i từ tố. Tổng n bước bằng n nhân S, cộng G nhân n nhân n trừ 1 chia 2, tức có một số hạng n bình phương."
      - clear: true
        show: |
          <p><b>Bộ nhớ đệm tiền tố</b> (“tiền tố” = phần đầu): nếu phần đầu lời nhắc giống hệt lần trước, nhà cung cấp dùng lại phần đã tính và tính giá rẻ hơn cho phần đó; chỉ phần mới tính đủ giá. Phần “đã tính” là <b>bộ nhớ đệm khoá–giá trị</b>: khi đọc lời nhắc, mô hình tính cho mỗi từ tố vài dãy số trung gian; lưu lại các dãy số đó thì lần sau khỏi tính lại.</p>
          <p>Điều kiện: phần đầu phải <b>giống từng từ tố</b>. Ngoài ra, tuỳ nhà cung cấp: phần đầu phải đủ dài, lần gọi sau phải tới trước khi bộ nhớ đệm hết hạn (ví dụ Anthropic, <i>Prompt caching</i>, truy cập 2026-11-08: hạn mặc định 5 phút), và lần ghi đầu có thể đắt hơn giá thường — ví dụ dưới đây bỏ qua các điều này.</p>
        focus: [1, 1, 1, 2, 2, 2]
        say: "Bộ nhớ đệm tiền tố, với tiền tố nghĩa là phần đầu, hoạt động như sau. Nếu phần đầu lời nhắc giống hệt lần trước, nhà cung cấp dùng lại phần đã tính và tính giá rẻ hơn cho phần đó, chỉ phần mới tính đủ giá. Phần đã tính là bộ nhớ đệm khoá giá trị, tức khi đọc lời nhắc, mô hình tính cho mỗi từ tố vài dãy số trung gian, và lưu lại thì lần sau khỏi tính lại. Điều kiện là phần đầu phải giống nhau đến từng từ tố. Ngoài ra, tuỳ nhà cung cấp, phần đầu phải đủ dài, và lần gọi sau phải tới trước khi bộ nhớ đệm hết hạn, ví dụ một nhà cung cấp ghi hạn mặc định 5 phút. Lần ghi đầu có thể đắt hơn giá thường, còn ví dụ dưới đây bỏ qua các điều này."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi bước gửi lại cả chồng giấy"
    checks:
      - "[2000 + 500 * i for i in (0, 9)] == [2000, 6500] and sum(2000 + 500 * i for i in range(10)) == 42500"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><line x1="190" y1="310" x2="1190" y2="310" stroke="#6b7280" stroke-width="2"/><rect x="200" y="310.0" width="70" height="0.0" fill="#93c5fd"/><rect x="200" y="230.0" width="70" height="80.0" fill="#eb6834"/><text x="235" y="338" font-size="20" text-anchor="middle" fill="#1f2937">0</text><rect x="300" y="230.0" width="70" height="80.0" fill="#93c5fd"/><rect x="300" y="210.0" width="70" height="20.0" fill="#eb6834"/><text x="335" y="338" font-size="20" text-anchor="middle" fill="#1f2937">1</text><rect x="400" y="210.0" width="70" height="100.0" fill="#93c5fd"/><rect x="400" y="190.0" width="70" height="20.0" fill="#eb6834"/><text x="435" y="338" font-size="20" text-anchor="middle" fill="#1f2937">2</text><rect x="500" y="190.0" width="70" height="120.0" fill="#93c5fd"/><rect x="500" y="170.0" width="70" height="20.0" fill="#eb6834"/><text x="535" y="338" font-size="20" text-anchor="middle" fill="#1f2937">3</text><rect x="600" y="170.0" width="70" height="140.0" fill="#93c5fd"/><rect x="600" y="150.0" width="70" height="20.0" fill="#eb6834"/><text x="635" y="338" font-size="20" text-anchor="middle" fill="#1f2937">4</text><rect x="700" y="150.0" width="70" height="160.0" fill="#93c5fd"/><rect x="700" y="130.0" width="70" height="20.0" fill="#eb6834"/><text x="735" y="338" font-size="20" text-anchor="middle" fill="#1f2937">5</text><rect x="800" y="130.0" width="70" height="180.0" fill="#93c5fd"/><rect x="800" y="110.0" width="70" height="20.0" fill="#eb6834"/><text x="835" y="338" font-size="20" text-anchor="middle" fill="#1f2937">6</text><rect x="900" y="110.0" width="70" height="200.0" fill="#93c5fd"/><rect x="900" y="90.0" width="70" height="20.0" fill="#eb6834"/><text x="935" y="338" font-size="20" text-anchor="middle" fill="#1f2937">7</text><rect x="1000" y="90.0" width="70" height="220.0" fill="#93c5fd"/><rect x="1000" y="70.0" width="70" height="20.0" fill="#eb6834"/><text x="1035" y="338" font-size="20" text-anchor="middle" fill="#1f2937">8</text><rect x="1100" y="70.0" width="70" height="240.0" fill="#93c5fd"/><rect x="1100" y="50.0" width="70" height="20.0" fill="#eb6834"/><text x="1135" y="338" font-size="20" text-anchor="middle" fill="#1f2937">9</text><g font-size="22" fill="#1f2937"><text x="235" y="220" text-anchor="middle">2000</text><text x="1135" y="40" text-anchor="middle">6500</text><text x="140" y="338" text-anchor="end">bước</text><rect x="1230" y="120" width="26" height="26" fill="#93c5fd"/><text x="1266" y="142">đã gửi ở bước trước</text><rect x="1230" y="165" width="26" height="26" fill="#eb6834"/><text x="1266" y="187">phần mới</text><text x="1230" y="245">cộng mọi cột: 42 500</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ ngữ cảnh mà tác tử gửi đi ở mỗi bước trong 10 bước, từ bước 0 đến bước 9. Mỗi cột gồm phần xanh nhạt đã gửi ở bước trước, và một khúc cam nhỏ là phần mới thêm. Cột đầu cao 2000 từ tố, cột cuối cao 6500, và tiền đầu vào ta trả là tổng chiều cao mọi cột, tức 42 nghìn 500. Phần xanh nhạt chiếm gần hết, đó chính là chỗ bộ nhớ đệm tiền tố giúp ta tiết kiệm."

  - id: example
    kind: example
    title: "10 bước, có và không có bộ nhớ đệm"
    checks:
      - "alg.loop_tokens(2000, 500, 10) == (42500, 42500) and 10 * 2000 + 500 * 10 * 9 // 2 == 42500"
      - "alg.loop_tokens(2000, 500, 10, 0.1) == (42500, 10100.0) and 2000 + 500 * 9 == 6500"
    steps:
      - show: |
          <p><b>Bước 1 — ngữ cảnh mỗi bước:</b> $S = 2000$, $G = 500$, $n = 10$.</p>
          <table class="t"><tr><th>bước</th><th>0</th><th>1</th><th>2</th><th>…</th><th>9</th></tr>
          <tr><td>từ tố gửi đi</td><td>2000</td><td>2500</td><td>3000</td><td>…</td><td>6500</td></tr></table>
        focus: [1, 2]
        say: "Bước một, viết ra ngữ cảnh gửi đi ở mỗi bước, với S bằng 2000, G bằng 500, n bằng 10. Bước 0 gửi 2000, bước 1 gửi 2500, bước 2 gửi 3000, cứ mỗi bước thêm 500, tới bước 9 gửi 6500 từ tố."
      - show: |
          <p><b>Bước 2 — phần cố định:</b> mỗi bước đều có $S$, nên $n \cdot S = 10 \cdot 2000 = 20\,000$.</p>
        say: "Bước hai, tách phần cố định. Bước nào cũng gửi S bằng 2000 từ tố, nên 10 bước đóng góp 10 nhân 2000, bằng 20 nghìn từ tố."
      - show: |
          <p><b>Bước 3 — phần tăng dần:</b> $G \cdot (0 + 1 + \dots + 9) = 500 \cdot 45 = 22\,500$. Tổng: $20\,000 + 22\,500 = \hl{42\,500}$ từ tố.</p>
        say: "Bước ba, phần tăng dần là G nhân tổng 0 cộng 1 tới 9, mà tổng đó bằng 45 như ta đã ghép cặp, nên được 500 nhân 45, bằng 22 nghìn 500. Cộng hai phần, 20 nghìn cộng 22 nghìn 500, bằng 42 nghìn 500 từ tố."
      - show: |
          <p><b>Bước 4 — so với ngữ cảnh cuối:</b> $\frac{42\,500}{6500} \approx 6{,}5$ lần. Trả tiền cho gần 6,5 lần độ dài cuối cùng, vì phần đầu bị gửi đi gửi lại.</p>
        say: "Bước bốn, so với ngữ cảnh cuối 6500 từ tố, 42 nghìn 500 chia 6500 khoảng 6 phẩy 5 lần. Ta trả tiền cho gần 6 phẩy 5 lần độ dài cuối cùng, vì phần đầu bị gửi đi gửi lại ở mọi bước."
      - clear: true
        show: |
          <p><b>Bước 5 — có bộ nhớ đệm</b> (số minh hoạ: phần đã gửi ở bước trước tính 10% giá):</p>
          <table class="t"><tr><th>phần</th><th>từ tố</th><th>quy đổi theo giá đầy đủ</th></tr>
          <tr><td>bước 0, chưa có gì trong bộ nhớ đệm</td><td>2000</td><td>2000</td></tr>
          <tr><td>phần cũ ở bước 1 tới 9</td><td>36 000</td><td>$0{,}1 \cdot 36\,000 = 3600$</td></tr>
          <tr><td>phần mới ở bước 1 tới 9</td><td>$9 \cdot 500 = 4500$</td><td>4500</td></tr>
          <tr><td>cộng</td><td>42 500</td><td>$\hl{10\,100}$ — rẻ hơn ≈ 4 lần</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước năm, bật bộ nhớ đệm với số minh hoạ, phần đã gửi ở bước trước chỉ tính 10 phần trăm giá. Bước 0 chưa có gì trong bộ nhớ đệm, nên tính đủ 2000. Phần cũ ở các bước 1 tới 9 cộng lại là 36 nghìn từ tố, chỉ tính như 3600. Phần mới ở các bước đó là 9 nhân 500, bằng 4500, tính đủ giá. Cộng lại quy đổi chỉ còn 10 nghìn 100, rẻ hơn khoảng 4 lần."

  - id: check
    kind: check
    title: "Tự kiểm: trung bình nhân số bước, và cộng lại ba phần"
    checks:
      - "(2000 + 6500) * 10 // 2 == 42500 and (2000 + 6500) // 2 == 4250"
      - "sum(2000 + 500 * (i - 1) for i in range(1, 10)) == 36000 and 2000 + 36000 + 4500 == 42500 and alg.loop_tokens(2000, 500, 10, 0.1)[1] == 2000 + 3600 + 4500 == 10100"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>trung bình đầu và cuối, nhân số bước</td><td>$\frac{2000 + 6500}{2} \cdot 10 = 4250 \cdot 10$</td><td>42 500 ✓</td></tr>
          <tr><td>ba phần của bước 5 phải cộng lại thành tổng thô</td><td>$2000 + 36\,000 + 4500$</td><td>42 500 ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, ta tính lại theo hai cách mới. Cách thứ nhất, dãy cách đều thì tổng bằng trung bình của số đầu và số cuối, nhân số bước. Trung bình của 2000 và 6500 là 4250, nhân 10 được 42 nghìn 500, khớp. Cách thứ hai, ba phần trong bảng bộ nhớ đệm phải cộng lại thành tổng thô. Thật vậy, 2000 cộng 36 nghìn cộng 4500 bằng 42 nghìn 500, nên không sót và không đếm trùng phần nào."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "2000 * 10 == 20000 and 2000 * 20 == 40000 and alg.loop_tokens(2000, 500, 10)[0] == 42500 and alg.loop_tokens(2000, 500, 20)[0] == 135000 and round(42500 / 20000, 1) == 2.1 and round(135000 / 40000, 1) == 3.4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đặt thứ thay đổi ở ĐẦU lời nhắc <b class="red">(phá bộ nhớ đệm)</b>
          <br><span class="note">Chèn giờ hiện tại hay mã ngẫu nhiên vào đầu lời nhắc hệ thống làm phần đầu khác nhau mỗi bước — bộ nhớ đệm không dùng được. Phần cố định đặt đầu, phần thay đổi đặt cuối.</span></div>
        say: "Lỗi thứ nhất, đặt thứ thay đổi ở đầu lời nhắc, nên phá bộ nhớ đệm. Chèn giờ hiện tại hay mã ngẫu nhiên vào đầu lời nhắc hệ thống làm phần đầu khác nhau mỗi bước, và bộ nhớ đệm không dùng được. Phần cố định đặt đầu, phần thay đổi đặt cuối."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đưa nguyên kết quả công cụ khổng lồ vào lịch sử <b class="red">(phình nhanh)</b>
          <br><span class="note">Một trang web 20 000 từ tố ở lại lịch sử sẽ bị gửi lại ở mọi bước sau. Lưu ra ngoài, chỉ giữ phần trích cần thiết và đường dẫn để đọc lại khi cần.</span></div>
        say: "Lỗi thứ hai, đưa nguyên kết quả công cụ khổng lồ vào lịch sử, nên lịch sử phình nhanh. Một trang web 20 nghìn từ tố ở lại lịch sử sẽ bị gửi lại ở mọi bước sau. Hãy lưu ra ngoài, chỉ giữ phần trích cần thiết và đường dẫn để đọc lại khi cần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ đo tiền, quên độ trễ <b class="red">(người dùng chờ)</b>
          <br><span class="note">Lời nhắc dài làm thời gian tới từ tố đầu tiên dài hơn; mỗi bước tuần tự cộng thêm một vòng gọi mô hình. Gộp các lời gọi công cụ độc lập trong một bước (bài 2) để giảm số vòng.</span></div>
        say: "Lỗi thứ ba, chỉ đo tiền mà quên độ trễ, nên người dùng phải chờ. Lời nhắc dài làm thời gian tới từ tố đầu tiên dài hơn, và mỗi bước tuần tự cộng thêm một vòng gọi mô hình. Hãy gộp các lời gọi công cụ độc lập trong một bước để giảm số vòng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Lập ngân sách bằng “bước đầu nhân số bước” <b class="red">(hụt hơn 3 lần)</b>
          <br><span class="note">Người đã đi làm hay đo một lời gọi rồi nhân với số bước để báo giá. Nhưng ngữ cảnh dài dần, nên sai số lớn lên khi tác tử chạy lâu hơn. Chuyên gia cộng đủ từng bước, hoặc đo tổng từ tố trên các lần chạy thật.</span></div>
          <table class="t"><tr><th>số bước</th><th>bước đầu nhân số bước</th><th>tổng thật</th><th>thật gấp</th></tr>
          <tr><td>10</td><td>20 000</td><td>42 500</td><td>≈ 2,1 lần</td></tr>
          <tr><td>20</td><td>40 000</td><td>135 000</td><td>$\hl{\approx 3{,}4}$ lần</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, lập ngân sách bằng cách lấy bước đầu nhân với số bước. Họ đo một lời gọi rồi nhân lên để báo giá, nhưng ngữ cảnh dài dần nên sai số lớn lên khi tác tử chạy lâu hơn. Chuyên gia cộng đủ từng bước, hoặc đo tổng từ tố trên các lần chạy thật. Bảng so hai cách với cùng tác tử. Với 10 bước, ước lượng 20 nghìn trong khi thật là 42 nghìn 500, gấp khoảng 2 phẩy 1 lần. Với 20 bước, ước lượng 40 nghìn mà thật là 135 nghìn, gấp khoảng 3 phẩy 4 lần."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.loop_tokens(1000, 300, 20) == (77000, 77000) and alg.loop_tokens(1000, 300, 20, 0.1)[1] == 13730.0"
      - "20 * 1000 == 20000 and sum(range(20)) == 190 == 19 * 20 // 2 and 300 * 190 == 57000 and sum(1000 + 300 * (i - 1) for i in range(1, 20)) == 70300 and round(0.1 * 70300) == 7030 and 19 * 300 == 5700 and 1000 + 70300 + 5700 == 77000 and 1000 + 7030 + 5700 == 13730 and round(77000 / 13730, 1) == 5.6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$S = 1000$, $G = 300$, $n = 20$ bước. Tổng từ tố đầu vào không có bộ nhớ đệm?</td></tr>
          <tr><td>2</td><td>Có bộ nhớ đệm (phần cũ tính 10% giá) thì quy đổi còn bao nhiêu? Có đáng giữ phần đầu lời nhắc cố định không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, S bằng 1000, G bằng 300, n bằng 20 bước, tổng từ tố đầu vào khi không có bộ nhớ đệm là bao nhiêu? Câu hai, có bộ nhớ đệm, phần cũ tính 10 phần trăm giá, thì quy đổi còn bao nhiêu? Có đáng giữ phần đầu lời nhắc cố định không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Phần cố định $20 \cdot 1000 = 20\,000$. Phần tăng dần $300 \cdot \frac{19 \cdot 20}{2} = 300 \cdot 190 = 57\,000$.</p>
          <p>Tổng: $20\,000 + 57\,000 = \hl{77\,000}$ từ tố.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, phần cố định là 20 nhân 1000, bằng 20 nghìn. Phần tăng dần là 300 nhân tổng 0 tới 19, mà tổng đó bằng 19 nhân 20 chia 2, bằng 190, nên được 57 nghìn. Cộng lại là 77 nghìn từ tố."
      - show: |
          <table class="t"><tr><th>phần</th><th>từ tố</th><th>quy đổi</th></tr>
          <tr><td>bước 0</td><td>1000</td><td>1000</td></tr>
          <tr><td>phần cũ ở bước 1 tới 19</td><td>70 300</td><td>7030</td></tr>
          <tr><td>phần mới: $19 \cdot 300$</td><td>5700</td><td>5700</td></tr>
          <tr><td>cộng</td><td>77 000</td><td>$\hl{13\,730}$</td></tr></table>
          <p>② Rẻ hơn $\frac{77\,000}{13\,730} \approx 5{,}6$ lần → <b>đáng</b> giữ phần đầu cố định.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Câu hai, tách làm ba phần như ở ví dụ. Bước 0 tính đủ 1000. Phần cũ ở các bước 1 tới 19 cộng lại 70 nghìn 300 từ tố, chỉ tính như 7030. Phần mới là 19 nhân 300, bằng 5700. Cộng lại quy đổi còn 13 nghìn 730. Rẻ hơn khoảng 5 phẩy 6 lần, nên rất đáng giữ phần đầu lời nhắc cố định để dùng được bộ nhớ đệm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">gửi lại lịch sử mỗi bước</span><span class="a">→</span>
          <span class="n">tổng có số hạng n²</span><span class="a">→</span>
          <span class="n">bộ nhớ đệm tiền tố: phần đầu cố định</span><span class="a">→</span>
          <span class="n">lịch sử gọn, gộp lời gọi độc lập</span></div>
        say: "Tổng kết lại, tác tử gửi lại lịch sử mỗi bước, nên tổng từ tố có số hạng n bình phương. Dùng bộ nhớ đệm tiền tố với phần đầu cố định, giữ lịch sử gọn, và gộp các lời gọi độc lập."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi gửi lại cả lịch sử, chi phí của tác tử không tỉ lệ với số bước — chạy càng lâu, nó càng gần tỉ lệ với <b>bình phương</b> số bước. Hãy thiết kế để lịch sử không phình.</div>
        say: "Điều cần mang theo, khi gửi lại cả lịch sử, chi phí của tác tử không tỉ lệ với số bước, mà chạy càng lâu càng gần tỉ lệ với bình phương số bước. Vì vậy hãy thiết kế để lịch sử không phình."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>an toàn cho tác tử</b> — chèn lời nhắc gián tiếp, quyền tối thiểu, xác nhận của người dùng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học an toàn cho tác tử, với chèn lời nhắc gián tiếp, quyền tối thiểu, và xác nhận của người dùng. Hẹn gặp bạn ở bài tiếp theo."
