          <text x="458" y="138" fill="#7c3aed">① giới hạn số bước</text>
          <text x="1038" y="138" fill="#eb6834">② kiểm tham số, rào chắn</text>
          <text x="750" y="326" fill="#059669">③ đưa lại cho mô hình như dữ liệu, không như lệnh</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế chung của mọi chặng. Mô hình viết một suy nghĩ, rồi đề xuất một lời gọi công cụ để tìm, xem, sửa hay chạy, và kết quả trả về được đưa lại cho mô hình ở vòng sau. Có ba chỗ chặn, giới hạn số bước, kiểm tham số trước khi chạy, và coi kết quả trả về là dữ liệu chứ không phải lệnh. Mỗi chặng sẽ làm rõ thêm một trong ba chỗ chặn này."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, 2022 tới 2023 — khai sinh: xen kẽ nghĩ, làm, xem"
    stage: {year: "2022 → 2023", scale: "ba lệnh tra cứu trên bách khoa toàn thư mở; 134 màn chơi nhà ảo chưa gặp; ví dụ mẫu chỉ một hai vết", source: "[RE23]", practice: "ghi suy nghĩ xen với hành động, giới hạn số bước rồi chuyển sang cách dự phòng, đọc vết để phân loại lỗi"}
    checks:
      - "71 - 37 == 34 and 71 - 45 == 26"
      - "50 * 2 * 2 == 200"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> chỉ suy luận trong đầu thì mô hình <b>bịa</b> sự kiện. Năm 2022, nhóm của ReAct đếm: bịa chiếm <b>56%</b> số lần sai của cách chỉ suy luận.</p>
          <p><b>Cách xử lý:</b> xen kẽ <b>nghĩ → làm → xem</b>, với ba lệnh tra bách khoa toàn thư mở: <code>search</code> lấy 5 câu đầu của trang, <code>lookup</code> tìm câu kế tiếp chứa một chuỗi, <code>finish</code> nộp đáp án.</p>
          <p>Giới hạn <b>7 bước</b> cho bộ câu hỏi nhiều bước; quá 7 bước chưa có đáp án thì <b>chuyển sang cách dự phòng</b>.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng một, điểm nghẽn là khi chỉ suy luận trong đầu, mô hình hay bịa sự kiện. Năm 2022, nhóm đề xuất cách xen kẽ suy nghĩ và hành động đếm được rằng bịa chiếm 56 phần trăm số lần sai của cách chỉ suy luận. Cách xử lý là xen kẽ nghĩ, làm, xem, với ba lệnh tra cứu trên bách khoa toàn thư mở. Ba lệnh này là lấy 5 câu đầu của một trang, tìm câu kế tiếp chứa một chuỗi, và nộp đáp án. Với bộ câu hỏi nhiều bước, họ giới hạn 7 bước, quá 7 bước chưa có đáp án thì chuyển sang cách dự phòng."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. nhà ảo, 134 màn chưa gặp: nghĩ + làm so với cách học bắt chước</td><td>71% trừ 37%</td><td>$\hlg{34}$ điểm phần trăm</td></tr>
          <tr><td>Bước 2. so với chỉ làm, không nghĩ</td><td>71% trừ 45%</td><td>$\hlb{26}$ điểm phần trăm</td></tr>
          <tr><td>Bước 3. số vết họ đọc bằng tay</td><td>50 vết đúng và 50 vết sai, cho mỗi trong 2 cách</td><td>$\hl{200}$ vết</td></tr></table>
          <p class="note">Đọc 200 vết: tìm kiếm không ra gì chiếm 23% số lần sai; có kiểu sai riêng là <b>lặp lại</b> suy nghĩ và hành động cũ.</p>
        focus: ["1.2", "1.3", "1.4", 2, 2]
        say: "Bước một, trong nhà ảo với 134 màn chơi chưa gặp, cách nghĩ cộng làm đạt 71 phần trăm, cách học bắt chước 37 phần trăm, chênh 34 điểm phần trăm. Bước hai, so với chỉ làm mà không nghĩ, đạt 45 phần trăm, chênh 26 điểm. Bước ba, họ đọc bằng tay 50 vết đúng và 50 vết sai cho mỗi trong hai cách, tổng cộng 200 vết. Từ đó họ thấy tìm kiếm không ra gì chiếm 23 phần trăm số lần sai. Họ cũng thấy một kiểu sai riêng, mô hình lặp lại suy nghĩ và hành động cũ."
      - show: |
          <div class="box key">Thực hành: ghi suy nghĩ cạnh hành động; <b>giới hạn số bước</b> và có đường dự phòng; <b>đọc vết</b> để phân loại lỗi. Điều kiện: công cụ trả về thông tin có ích — tìm kiếm rỗng thì suy nghĩ hay cũng lạc hướng.</div>
        say: "Thực hành rút ra là ghi suy nghĩ cạnh hành động, giới hạn số bước và có đường dự phòng. Sau đó đọc vết để phân loại lỗi, như ở bài 10 ta xếp các lần chạy thất bại theo nguyên nhân. Điều kiện là công cụ phải trả về thông tin có ích, vì tìm kiếm rỗng thì suy nghĩ hay đến đâu cũng lạc hướng."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2023 — tăng trưởng: mô hình tự học khi nào gọi công cụ"
    stage: {year: "2023", scale: "mô hình 6,7 tỉ tham số, năm công cụ; hơn một triệu văn bản chỉ cho vài nghìn lời gọi máy tính có ích", source: "[TF23] [GR23]", practice: "chỉ giữ lời gọi làm dự đoán tốt hơn, máy tính cho phép tính, coi kết quả công cụ là dữ liệu, biết giới hạn: không nối công cụ, nhạy cách hỏi, không tính chi phí"}
    checks:
      - "round(400 / 1400, 2) == 0.29 and round(400 / 1400 * 100) == 29"
      - "round(40.4 / 14.8, 2) == 2.73 and 40.4 / 14.8 > 2"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> mô hình lớn giải được việc mới, nhưng lại kém ở việc đơn giản như <b>số học</b> hay <b>tra sự kiện</b>, nơi máy tính bỏ túi thắng dễ. Viết tay ví dụ cho từng công cụ thì quá tốn.</p>
          <p><b>Cách xử lý</b> (Meta AI, 2023): mô hình tự chèn lời gọi thử vào văn bản; chỉ <b>giữ</b> lời gọi nào làm mô hình đoán các từ phía sau <b>dễ hơn</b>, so với không gọi hoặc chỉ gọi mà không có kết quả.</p>
          <p>Ví dụ trong bài báo: “1400 người dự thi, 400 người đỗ” → gọi máy tính <code>Calculator(400 / 1400) → 0.29</code> → viết “29%”.</p>
        focus: [1, 2, 2, 3]
        say: "Ở chặng hai, năm 2023, điểm nghẽn là mô hình lớn giải được việc mới, nhưng lại kém ở việc đơn giản như số học hay tra sự kiện. Một nhóm nghiên cứu công nghiệp cho mô hình tự chèn lời gọi thử vào văn bản. Họ chỉ giữ lời gọi nào làm mô hình đoán các từ phía sau dễ hơn, so với không gọi, hoặc gọi mà không có kết quả. Ví dụ trong bài, 1400 người dự thi và 400 người đỗ, mô hình gọi máy tính chia 400 cho 1400 được 0 phẩy 29, rồi viết 29 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. kiểm lời gọi máy tính</td><td>400 chia 1400 ≈ 0,2857, làm tròn 2 chữ số</td><td>$\hlb{0{,}29}$ = 29%</td></tr>
          <tr><td>Bước 2. bài toán đố, có công cụ so với tắt công cụ</td><td>40,4 chia 14,8</td><td>≈ $\hlg{2{,}73}$ lần, hơn gấp đôi</td></tr></table>
          <p class="note">Trên các bộ toán đố, 97,9% số câu mô hình tự chọn gọi máy tính. Giới hạn tự ghi: không <b>nối</b> công cụ (lấy kết quả này làm đầu vào công cụ khác), không tra lặp, nhạy với cách hỏi, không tính <b>chi phí</b> lời gọi.</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Bước một, 400 chia 1400 xấp xỉ 0 phẩy 2857, làm tròn hai chữ số được 0 phẩy 29, đúng là 29 phần trăm. Bước hai, trên một bộ toán đố, có công cụ đạt 40 phẩy 4, tắt công cụ chỉ 14 phẩy 8, chia ra khoảng 2 phẩy 73 lần, hơn gấp đôi. Mô hình tự chọn gọi máy tính ở 97 phẩy 9 phần trăm số câu toán đố. Nhóm cũng tự ghi giới hạn, không nối công cụ, không tra lặp, nhạy với cách hỏi, và không tính chi phí của lời gọi."
      - clear: true
        show: |
          <p>Cùng tháng 2/2023, một nhóm nghiên cứu an ninh cảnh báo: ứng dụng có mô hình ngôn ngữ làm <b>nhoè ranh giới giữa dữ liệu và lệnh</b> — chữ nằm trong dữ liệu được truy xuất có thể điều khiển việc gọi công cụ khác. Họ ghi: cách phòng hiệu quả <b>còn thiếu</b>.</p>
          <div class="box key">Thực hành: máy tính cho phép tính, không để mô hình tự nhẩm; kết quả công cụ đi vào ngữ cảnh như <b>dữ liệu</b>, mọi hành động có hậu quả đi qua <b>cổng quyền</b> của bài 9. Điều kiện: công cụ trả về chữ ngắn, đúng, và rẻ.</div>
        focus: [1, 1, 1, 2, 2]
        say: "Cũng tháng 2 năm 2023, một nhóm nghiên cứu an ninh cảnh báo rằng ứng dụng có mô hình ngôn ngữ làm nhoè ranh giới giữa dữ liệu và lệnh. Họ ghi rằng cách phòng hiệu quả còn thiếu. Chữ nằm trong dữ liệu được truy xuất có thể điều khiển việc gọi công cụ khác. Thực hành rút ra là dùng máy tính cho phép tính, và đưa kết quả công cụ vào ngữ cảnh như dữ liệu, còn mọi hành động có hậu quả phải đi qua cổng quyền của bài 9. Điều kiện là công cụ trả về chữ ngắn, đúng, và rẻ."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, 2023 tới 2024 — quy mô việc thật: 2294 lỗi, chấm bằng phép thử"
    stage: {year: "2023 → 2024", scale: "12 kho mã nguồn mở, khoảng 90 000 yêu cầu gộp mã lọc còn 2294 bài; mã trung bình 438 nghìn dòng; mô hình tốt nhất 1,96%", source: "[SB24]", practice: "đo trên việc thật, chấm bằng phép thử chạy được, giữ phép thử cũ để bắt hỏng chức năng, lấy bài mới hơn thời điểm huấn luyện"}
    checks:
      - "round(2294 / 90000 * 100, 1) == 2.5"
      - "round(0.0196 * 2294) == 45 and round(45 / 2294 * 100, 2) == 1.96"
      - "round(438000 / 32.8) == 13354"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> các bộ đề cũ chỉ là đoạn mã ngắn, tự đủ — không giống việc của kỹ sư.</p>
          <table class="t"><tr><th>cách dựng bộ đề (2023)</th><th>quy mô</th></tr>
          <tr><td>lấy yêu cầu gộp mã từ <b>12</b> kho mã nguồn mở phổ biến</td><td>khoảng <b>90 000</b></td></tr>
          <tr><td>giữ bài có <b>phép thử chuyển đạt</b>, cài đặt chạy được</td><td>còn <b>2294</b></td></tr>
          <tr><td>chấm: bản vá áp được và <b>mọi</b> phép thử đạt, kể cả trung vị 51 phép thử cũ</td><td>tỉ lệ bài giải được</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở chặng ba, điểm nghẽn là các bộ đề cũ chỉ là đoạn mã ngắn, tự đủ, không giống việc của kỹ sư. Năm 2023, một nhóm lấy khoảng 90 nghìn yêu cầu gộp mã từ 12 kho mã nguồn mở phổ biến. Họ chỉ giữ bài có phép thử chuyển đạt và cài đặt chạy được, còn 2294 bài. Một bài được tính là giải được khi bản vá áp được và mọi phép thử đều đạt, kể cả trung vị 51 phép thử cũ giữ chức năng đã có."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tỉ lệ giữ lại</td><td>2294 chia 90 000</td><td>≈ $\hl{2{,}5}$%</td></tr>
          <tr><td>Bước 2. mô hình tốt nhất 1,96%: bao nhiêu bài?</td><td>0,0196 nhân 2294 ≈ 44,96</td><td>$\hlb{45}$ bài</td></tr>
          <tr><td>Bước 3. kim trong đống rơm: mã trung bình 438 nghìn dòng, bản sửa trung bình 32,8 dòng</td><td>438 000 chia 32,8</td><td>≈ $\hlg{13\,354}$ dòng cho mỗi dòng phải sửa</td></tr></table>
          <p class="note">Thực hành: đo trên việc thật, chấm bằng phép thử chạy được. Điều kiện: dự án có phép thử, và phép thử bắt đúng lỗi.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Bước một, 2294 chia 90 nghìn, chỉ khoảng 2 phẩy 5 phần trăm số yêu cầu gộp mã được giữ lại. Bước hai, mô hình tốt nhất giải 1 phẩy 96 phần trăm, nhân với 2294 được khoảng 45 bài. Bước ba, mã trung bình 438 nghìn dòng, bản sửa trung bình 32 phẩy 8 dòng, nên cứ khoảng 13 nghìn 354 dòng mới có một dòng phải sửa. Thực hành rút ra là đo trên việc thật, chấm bằng phép thử chạy được, với điều kiện dự án có phép thử và phép thử bắt đúng lỗi."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2024 — giao diện riêng cho tác tử: ít lệnh, có rào chắn"
    stage: {year: "2024", scale: "cùng 2294 bài; 12,47% (286 bài); tập nhẹ 300 bài để thử thiết kế; ngân sách 4 đô la mỗi bài", source: "[SA24] [SB24]", practice: "lệnh ít và gọn, kiểm cú pháp chặn bản sửa hỏng, báo rõ cả khi lệnh không in gì, thu gọn quan sát cũ, đặt trần ngân sách, đo từng thay đổi giao diện"}
    checks:
      - "round(286 / 2294 * 100, 2) == 12.47 and round(286 / 45, 1) == 6.4"
      - "0.15 * 300 == 45 and 0.18 * 300 == 54 and 54 - 45 == 9 and round(54 / 300 * 100) == 18"
      - "round(0.157 * 300) == 47 and round(0.12 * 300) == 36 and 47 - 36 == 11"
    steps:
      - show: |
          <p><b>Điểm nghẽn</b> (cùng nhóm, 2024): dòng lệnh làm cho người thì <b>không có lệnh gọn</b> để sửa một đoạn tệp nhỏ, và <b>không báo gì</b> khi tác tử sửa hỏng.</p>
          <table class="t"><tr><th>giao diện cho tác tử</th><th>vì sao</th></tr>
          <tr><td>vài lệnh đơn giản để xem, tìm, sửa; mỗi lần xem 100 dòng</td><td>ít lựa chọn, ít sai</td></tr>
          <tr><td><b>bộ kiểm cú pháp</b> chạy sau mỗi lần sửa; bản sửa hỏng bị bỏ, tác tử sửa lại</td><td>rào chắn, chặn lỗi lan</td></tr>
          <tr><td>lệnh không in gì thì báo “chạy xong, không có kết quả”; quan sát cũ hơn 5 bước thu thành một dòng</td><td>phản hồi rõ, ngữ cảnh gọn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, năm 2024, chính nhóm làm bộ đề thấy rằng dòng lệnh làm cho người không có lệnh gọn để sửa một đoạn tệp nhỏ, và không báo gì khi tác tử sửa hỏng. Họ dựng một giao diện riêng cho tác tử, chỉ vài lệnh đơn giản để xem, tìm, sửa, mỗi lần xem 100 dòng. Một bộ kiểm cú pháp chạy sau mỗi lần sửa, bản sửa hỏng bị bỏ, và tác tử được yêu cầu sửa lại. Lệnh không in gì thì giao diện báo rõ là chạy xong mà không có kết quả, còn quan sát cũ hơn 5 bước được thu thành một dòng."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tập đầy đủ: giải được 286 trên 2294</td><td>286 chia 2294; so với 45 bài của 2023</td><td>$\hlg{12{,}47}$%; ≈ $\hlb{6{,}4}$ lần, cùng một tập</td></tr>
          <tr><td>Bước 2. tập nhẹ 300 bài: có kiểm cú pháp so với không</td><td>18% nhân 300 trừ 15% nhân 300</td><td>54 trừ 45 = $\hl{9}$ bài</td></tr>
          <tr><td>Bước 3. thêm lệnh tìm từng kết quả một, so với không có lệnh tìm</td><td>12% nhân 300 so với 15,7% nhân 300</td><td>36 so với 47: <b>kém hơn</b> 11 bài</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4"]
        say: "Bước một, trên tập đầy đủ, tác tử giải 286 bài, chia cho 2294 được 12 phẩy 47 phần trăm. Con số này gấp khoảng 6 phẩy 4 lần 45 bài của năm 2023, và đây là cùng một tập nên so được. Bước hai, trên tập nhẹ 300 bài, có kiểm cú pháp đạt 18 phần trăm, tức 54 bài, không có thì 15 phần trăm, tức 45 bài, chênh 9 bài. Bước ba, thêm lệnh tìm hiện từng kết quả một chỉ đạt 12 phần trăm, tức 36 bài, kém hơn cả khi không có lệnh tìm, 47 bài, vì tác tử lật hết mọi kết quả."
      - show: |
          <div class="box key">Thực hành: thiết kế công cụ <b>cho tác tử</b> như thiết kế cho người dùng mới — lệnh ít, phản hồi rõ, rào chắn; đặt <b>trần ngân sách</b> (4 đô la mỗi bài). Họ ghi: lần chạy thành công thường xong sớm (trung vị 12 bước, 1,21 đô la), lần thất bại kéo dài (trung bình 21 bước, 2,52 đô la). Điều kiện: đo từng thay đổi giao diện trên cùng một tập.</div>
        say: "Thực hành rút ra là thiết kế công cụ cho tác tử như thiết kế cho một người dùng mới, lệnh ít, phản hồi rõ, có rào chắn. Họ cũng đặt trần ngân sách, ở đây là 4 đô la mỗi bài. Họ ghi rằng lần chạy thành công thường xong sớm, trung vị 12 bước và 1 phẩy 21 đô la, còn lần thất bại kéo dài, trung bình 21 bước và 2 phẩy 52 đô la. Điều kiện là đo từng thay đổi giao diện trên cùng một tập bài."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, 2024 tới 2025 — ổn định và tiếp tục: đo chung, đo đúng"
    stage: {year: "2024 → 2025", scale: "6/2024 đóng gói môi trường chấm; 8/2024 tập 500 bài người xem lại; 7/2025 tác tử khoảng 100 dòng đạt 65% trên tập đó", source: "[SBV]", practice: "đóng gói môi trường chấm, người xem lại đề và phép thử, mọi mô hình chạy trong cùng một vòng lặp đơn giản, ghi số phiên bản, không chỉnh môi trường để đuổi điểm"}
    checks:
      - "0.65 * 500 == 325 and 500 - 325 == 175"
      - "round(325 / 500 * 100) == 65"
    steps:
      - show: |
          <table class="t"><tr><th>thời điểm</th><th>trang chính thức của bộ đề ghi</th></tr>
          <tr><td>6/2024</td><td>đóng gói môi trường chấm để ai cũng chấm giống nhau</td></tr>
          <tr><td>8/2024</td><td>tập <b>500</b> bài, làm cùng một công ty làm mô hình: người xem lại để đề rõ, phép thử đúng, bài giải được</td></tr>
          <tr><td>bảng “chỉ dòng lệnh”</td><td>mọi mô hình chạy trong <b>cùng</b> một môi trường tối giản, “một vòng lặp nghĩ và làm đơn giản”, không thêm công cụ</td></tr>
          <tr><td>ghi phiên bản</td><td>bản 1 và bản 2 của vòng lặp ấy “không nhất thiết so được”; họ không chỉnh môi trường để đuổi điểm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ở chặng năm, trang chính thức của bộ đề ghi lại các bước ổn định. Tháng 6 năm 2024, môi trường chấm được đóng gói để ai cũng chấm giống nhau. Tháng 8 năm 2024, tập 500 bài ra đời cùng một công ty làm mô hình, có người xem lại để đề rõ, phép thử đúng, và bài giải được. Có một bảng chỉ dùng dòng lệnh, nơi mọi mô hình chạy trong cùng một môi trường tối giản, là một vòng lặp nghĩ và làm đơn giản, không thêm công cụ. Họ ghi số phiên bản, nói rõ bản 1 và bản 2 không nhất thiết so được, và không chỉnh môi trường để đuổi điểm."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tháng 7/2025: 65% trên 500 bài</td><td>0,65 nhân 500</td><td>$\hlg{325}$ bài</td></tr>
          <tr><td>Bước 2. còn chưa giải được</td><td>500 trừ 325</td><td>$\hl{175}$ bài</td></tr></table>
          <p class="note">Vòng lặp của chặng 1 quay lại làm <b>chuẩn so sánh</b>. Ổn định không có nghĩa là hết việc: còn 175 bài, và mỗi đổi phiên bản phải đo lại.</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Bước một, với con số tháng 7 năm 2025, 65 phần trăm của 500 bài là 325 bài. Bước hai, 500 trừ 325 còn 175 bài chưa giải được. Điều thú vị là vòng lặp nghĩ và làm của chặng một quay lại làm chuẩn so sánh. Ổn định không có nghĩa là hết việc, vì còn 175 bài, và mỗi lần đổi phiên bản đều phải đo lại."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "round(2294 * 0.02) == 46 and 45 < 46"
      - "abs(round(2294 / 8) - 286) <= 1 and abs(286 / 2294 - 1 / 8) < 0.001"
      - "300 // 100 == 3 and 3 * 3 == 9"
      - "500 // 20 == 25 and 25 * 13 == 325"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>45 bài</td><td>ước nhanh: 2% của 2294 ≈ 46; 1,96% nhỏ hơn 2% một chút, nên 45 hợp lý ✓</td></tr>
          <tr><td>12,47%</td><td>khoảng 1 phần 8: 2294 chia 8 ≈ 287, gần 286 ✓</td></tr>
          <tr><td>9 bài</td><td>chênh 3 điểm phần trăm; mỗi điểm trên 300 bài là 3 bài; 3 nhân 3 = 9 ✓</td></tr>
          <tr><td>325 bài</td><td>đếm theo nhóm 20 bài: 500 bài là 25 nhóm; 65% là 13 trên 20; 25 nhân 13 = 325 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Ước nhanh, 2 phần trăm của 2294 là khoảng 46, mà 1 phẩy 96 nhỏ hơn 2 một chút, nên 45 bài là hợp lý. Mười hai phẩy 47 phần trăm gần bằng một phần tám, mà 2294 chia 8 được khoảng 287, gần 286. Chênh 3 điểm phần trăm trên 300 bài, mỗi điểm là 3 bài, nên 3 nhân 3 bằng 9 bài. Đếm theo nhóm 20 bài, 500 bài là 25 nhóm, 65 phần trăm là 13 trên 20, và 25 nhân 13 bằng 325."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "round(65 / 1.96, 1) == 33.2 and 2294 != 500"
      - "15.7 > 12.0"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “65 chia 1,96 ≈ 33: tác tử giỏi lên 33 lần”</td><td>khác tập (500 bài người xem lại, so với 2294 bài), khác môi trường chấm, khác vòng lặp</td><td>chỉ so hai số trên <b>cùng</b> tập, cùng môi trường; như 45 và 286 bài</td></tr>
          <tr><td><b class="red">2.</b> “Thêm công cụ, tìm kiếm mạnh hơn là tốt hơn”</td><td>lệnh tìm từng kết quả một làm tác tử lật hết mọi kết quả: 12% so với 15,7% khi không có lệnh tìm</td><td>thêm từng công cụ một, đo trên cùng tập</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là lấy 65 chia 1 phẩy 96 được khoảng 33, rồi nói tác tử giỏi lên 33 lần. Hai số này khác tập, một bên 500 bài người xem lại, một bên 2294 bài. Chúng còn khác môi trường chấm, nên chỉ được so trên cùng tập, cùng môi trường, như 45 và 286 bài. Bài học sai thứ hai là nghĩ thêm công cụ, tìm kiếm mạnh hơn là tốt hơn. Lệnh tìm hiện từng kết quả một làm tác tử lật hết mọi kết quả, chỉ đạt 12 phần trăm so với 15 phẩy 7 khi không có lệnh tìm. Hãy thêm từng công cụ một và đo."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Cho thêm tiền, thêm bước là giải được nhiều hơn”</td><td>93% số bài giải được nộp trước khi hết ngân sách; lần thất bại thường kéo dài</td><td>đặt trần ngân sách; lần chạy dài là tín hiệu dừng</td></tr>
          <tr><td><b class="red">4.</b> “Kết quả công cụ đọc về là đáng tin, cứ làm theo”</td><td>dữ liệu được truy xuất có thể mang chữ trông như lệnh; cách phòng hiệu quả còn thiếu</td><td>coi là dữ liệu; hành động có hậu quả qua cổng quyền và người xác nhận</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ cho thêm tiền, thêm bước là giải được nhiều hơn. Nhóm năm 2024 ghi rằng 93 phần trăm số bài giải được đã nộp trước khi hết ngân sách, và lần thất bại thường kéo dài. Bài học sai thứ tư là tin kết quả công cụ đọc về và cứ làm theo. Dữ liệu được truy xuất có thể mang chữ trông như lệnh, và nhóm an ninh năm 2023 ghi rằng cách phòng hiệu quả còn thiếu. Hãy coi đó là dữ liệu, còn hành động có hậu quả phải qua cổng quyền và người xác nhận."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "0.03 * 40 == 1.2 and 40 * 4 == 160"
      - "round(26 / 40 * 100) == 65 and round(0.65 * 40) == 26"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: đội 3 người, 40 lỗi cũ đã có phép thử chuyển đạt, trần 4 đô la mỗi lỗi (số minh hoạ)</th></tr>
          <tr><td>1</td><td>dựng tác tử với 12 công cụ tự viết, hay một vòng lặp đơn giản với vài lệnh xem, tìm, sửa có kiểm cú pháp?</td></tr>
          <tr><td>2</td><td>một nhà cung cấp quảng cáo “65% trên bộ đề công khai”. Bạn có dùng số đó để chọn họ không?</td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với một đội 3 người, 40 lỗi cũ đã có phép thử chuyển đạt, và trần 4 đô la mỗi lỗi, đều là số minh hoạ. Câu một, bạn dựng tác tử với 12 công cụ tự viết, hay một vòng lặp đơn giản với vài lệnh xem, tìm, sửa có kiểm cú pháp? Câu hai, một nhà cung cấp quảng cáo đạt 65 phần trăm trên bộ đề công khai, bạn có dùng số đó để chọn họ không? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>vòng lặp đơn giản, vài lệnh, kiểm cú pháp</td><td>dựng nhanh; đã có bằng chứng: rào chắn thêm 9 trên 300 bài; dễ đọc vết</td><td>thiếu công cụ riêng của đội</td></tr>
          <tr><td>12 công cụ tự viết</td><td>khớp hệ thống nội bộ</td><td>nhiều chỗ sai; chặng 4 cho thấy thêm công cụ có thể làm <b>tệ đi</b></td></tr></table>
          <p class="note">Ở quy mô 40 lỗi, chênh 3 điểm phần trăm chỉ là 0,03 nhân 40 = 1,2 lỗi — quá nhỏ để thấy; chi phí tối đa 40 nhân 4 = 160 đô la. Chọn vòng lặp đơn giản trước. Điều kiện đổi: vết cho thấy tác tử cứ hỏng ở một việc mà một công cụ riêng giải được — thêm đúng công cụ đó, đo lại.</p>
        focus: ["1.2", "1.3", 2, 2, 2]
        say: "Ở câu một, vòng lặp đơn giản với vài lệnh và kiểm cú pháp dựng nhanh, đã có bằng chứng rằng rào chắn thêm 9 trên 300 bài, và vết dễ đọc. Mười hai công cụ tự viết khớp hệ thống nội bộ, nhưng nhiều chỗ sai, và chặng bốn cho thấy thêm công cụ có thể làm tệ đi. Ở quy mô 40 lỗi, chênh 3 điểm phần trăm chỉ là 1 phẩy 2 lỗi, quá nhỏ để thấy, còn chi phí tối đa là 40 nhân 4 bằng 160 đô la. Nên chọn vòng lặp đơn giản trước. Chỉ khi vết cho thấy tác tử cứ hỏng ở một việc mà công cụ riêng giải được, thì thêm đúng công cụ đó và đo lại."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>tin con số 65% công khai</td><td>không tốn công</td><td>khác tập, khác môi trường, có thể khác phiên bản; không phải lỗi của đội bạn</td></tr>
          <tr><td>chạy họ trên 40 lỗi của bạn, cùng môi trường, cùng trần ngân sách</td><td>so được, như 45 và 286 bài trên cùng tập</td><td>tối đa 160 đô la và vài ngày</td></tr></table>
          <p class="note">Nếu họ giải 26 trên 40 lỗi của bạn thì mới nói được 65% — cho đúng việc của bạn. Điều kiện đổi: chỉ cần so sơ bộ nhiều nhà cung cấp — khi đó bảng công khai chạy cùng môi trường (bảng “chỉ dòng lệnh”) là điểm bắt đầu hợp lý.</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Ở câu hai, tin con số 65 phần trăm công khai thì không tốn công, nhưng đó là tập khác, môi trường khác, có thể cả phiên bản khác, và không phải lỗi của đội bạn. Chạy họ trên 40 lỗi của bạn, cùng môi trường và cùng trần ngân sách, thì so được, đổi lại tốn tối đa 160 đô la và vài ngày. Nếu họ giải 26 trên 40 lỗi thì mới nói được 65 phần trăm cho đúng việc của bạn. Chỉ khi cần so sơ bộ nhiều nhà cung cấp, bảng công khai chạy trong cùng một môi trường mới là điểm bắt đầu hợp lý."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">nghĩ, làm, xem: giới hạn bước</span><span class="a">→</span>
          <span class="n">tự học gọi công cụ: kết quả là dữ liệu</span><span class="a">→</span>
          <span class="n">2294 lỗi thật: chấm bằng phép thử</span><span class="a">→</span>
          <span class="n">giao diện cho tác tử: ít lệnh, rào chắn</span><span class="a">→</span>
          <span class="n">đo chung: cùng tập, cùng môi trường</span></div>
        say: "Tổng kết lại hành trình. Xen kẽ nghĩ, làm, xem giúp mô hình bớt bịa, với giới hạn số bước. Mô hình tự học khi nào gọi công cụ, và kết quả công cụ phải được coi là dữ liệu. Bộ đề 2294 lỗi thật chấm bằng phép thử chạy được. Giao diện riêng cho tác tử với ít lệnh và rào chắn giải được nhiều hơn, rồi cả ngành có cách đo chung, cùng tập, cùng môi trường."
      - show: |
          <div class="box key"><b>Tư duy:</b> một con số về tác tử chỉ có nghĩa khi biết nó được đo <b>trên tập nào, trong môi trường nào, phiên bản nào</b>. Trước khi chọn công cụ, hãy đo trên chính việc của mình.</div>
        say: "Điều cần mang theo, một con số về tác tử chỉ có nghĩa khi biết nó được đo trên tập nào, trong môi trường nào, và phiên bản nào. Trước khi chọn công cụ, hãy đo trên chính việc của mình."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá AI agent. Từ vòng lặp tác tử, gọi công cụ, kế hoạch, bộ nhớ, đánh giá, chi phí và an toàn, bạn đã đi qua bốn năm tác tử học dùng công cụ, từ ba lệnh tra cứu tới sửa lỗi phần mềm thật.</p>
        say: "Đây là bài cuối của khoá về tác tử dùng mô hình ngôn ngữ. Từ vòng lặp tác tử, gọi công cụ, kế hoạch, bộ nhớ, đánh giá, chi phí và an toàn, bạn đã đi tiếp qua bốn năm có thật. Đó là bốn năm tác tử học dùng công cụ, từ ba lệnh tra cứu tới sửa lỗi phần mềm thật. Cảm ơn bạn đã theo học."
