          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2022 → 2023</text><text x="160" y="200">nghĩ, làm, xem</text><text x="160" y="232">3 lệnh tra cứu</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2023</text><text x="500" y="200">tự học khi nào</text><text x="500" y="232">gọi công cụ</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2023 → 2024</text><text x="850" y="200">2294 lỗi thật</text><text x="850" y="232">chấm bằng phép thử</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2024</text><text x="1200" y="200">giao diện cho tác tử</text><text x="1200" y="232">lệnh ít, có rào chắn</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2024 → 2025</text><text x="1540" y="200">500 bài người xem lại</text><text x="1540" y="232">môi trường chấm chung</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô việc thật → ổn định → tiếp tục phát triển</text>
