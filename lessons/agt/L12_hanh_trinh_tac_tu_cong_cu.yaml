        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Từ 2022 tới 2023, mô hình xen kẽ nghĩ, làm, xem với ba lệnh tra cứu, rồi năm 2023 có mô hình tự học khi nào gọi công cụ. Từ 2023 tới 2024, tác tử bị đo trên 2294 lỗi thật, chấm bằng phép thử, và năm 2024 có giao diện riêng cho tác tử, ít lệnh, có rào chắn. Từ 2024 tới 2025, tập 500 bài được người xem lại, cùng một môi trường chấm chung cho mọi mô hình."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: loop
    kind: concept
    title: "Cơ chế chung: vòng nghĩ, làm, xem và ba chỗ chặn"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="110" width="280" height="100" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="180" y="152">mô hình</text><text x="180" y="186">viết suy nghĩ</text>
