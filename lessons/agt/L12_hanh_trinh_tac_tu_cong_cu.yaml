#   “nền tảng lưu trữ mã nguồn”, “ngôn ngữ lập trình phổ biến”, “đóng gói môi trường”, “bộ kiểm cú pháp”, “mô hình tốt nhất lúc đó”.
#   Bằng chứng dò phát âm: audit/agt/probes/p2_hanh_trinh.md, ghi ở lexicon_vi.AGT.yaml.
objectives:
  - "Kể lại hành trình của tác tử dùng công cụ qua năm chặng từ 2022 tới 2025, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại tỉ lệ giải được, số bài giải được và mức chênh giữa các cách làm từ số liệu của nguồn"
  - "Chọn cách dựng và cách đo tác tử hợp với quy mô của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ 1,96% tới 65% — nhưng có phải cùng một phép đo?"
    checks:
      - "round(45 / 2294 * 100, 2) == 1.96 and 0.65 * 500 == 325"
    steps:
      - show: |
          <p>Năm 2023, nhóm làm bộ đề <b>SWE-bench</b> giao cho mô hình ngôn ngữ <b>2294</b> lỗi có thật trong mã nguồn mở. Mô hình tốt nhất lúc đó chỉ sửa đúng <b>1,96%</b>.</p>
          <p>Tháng 7/2025, trang chính thức của bộ đề ghi: một tác tử khoảng <b>100 dòng</b> mã đạt <b>65%</b> trên tập <b>500</b> bài đã được người xem lại.</p>
          <div class="box key">Hôm nay: năm chặng từ 2022 tới 2025 — tác tử học dùng công cụ, bị đo trên việc thật, rồi có cách đo chung. Và vì sao không được chia 65 cho 1,96.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Chào bạn, năm 2023, nhóm làm một bộ đề sửa lỗi phần mềm thật giao cho mô hình ngôn ngữ 2294 lỗi có thật trong mã nguồn mở. Mô hình tốt nhất lúc đó chỉ sửa đúng 1 phẩy 96 phần trăm. Tháng 7 năm 2025, trang chính thức của bộ đề ghi rằng một tác tử khoảng 100 dòng mã đạt 65 phần trăm, trên tập 500 bài đã được người xem lại. Hôm nay ta đi qua năm chặng từ 2022 tới 2025, khi tác tử học dùng công cụ, bị đo trên việc thật, rồi có cách đo chung. Ta cũng sẽ thấy vì sao không được lấy 65 chia cho 1 phẩy 96."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "round(0.95 ** 20 * 100, 1) == 35.8"
      - "7 / 10 == 0.7 and 10 * 4 == 40"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 0</td><td>tác tử là <b>vòng lặp</b>: quan sát, suy nghĩ, hành động, rồi quan sát kết quả</td><td>mỗi bước đúng 95%, 20 bước độc lập → 0,95 mũ 20 ≈ 35,8%</td></tr>
          <tr><td>bài 1</td><td><b>gọi công cụ</b>: mô hình đề xuất lời gọi, mã chương trình kiểm tham số rồi mới chạy</td><td>số tiền âm bị từ chối trước khi chạy</td></tr>
          <tr><td>bài 7</td><td><b>tỉ lệ thành công</b> = số nhiệm vụ làm xong chia tổng số nhiệm vụ, trên một tập cố định</td><td>7 trên 10 nhiệm vụ → 0,7 = 70%</td></tr>
          <tr><td>bài 8, bài 9</td><td>mỗi lần chạy có <b>ngân sách</b>; dữ liệu đọc từ trang web <b>không phải lệnh</b>, cổng quyền quyết định</td><td>10 lần chạy, 4 đô la mỗi lần → tối đa 40 đô la</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 0, tác tử là một vòng lặp quan sát, suy nghĩ, hành động, rồi quan sát kết quả. Với 20 bước độc lập mỗi bước đúng 95 phần trăm chỉ còn khoảng 35 phẩy 8 phần trăm. Ở bài 1, mô hình đề xuất lời gọi công cụ, còn mã chương trình kiểm tham số rồi mới chạy, nên số tiền âm bị từ chối. Ở bài 7, tỉ lệ thành công là số nhiệm vụ làm xong chia tổng số nhiệm vụ trên một tập cố định, ví dụ 7 trên 10 là 70 phần trăm. Ở bài 8, mỗi lần chạy có ngân sách, 10 lần chạy với 4 đô la mỗi lần thì tối đa 40 đô la. Ở bài 9, dữ liệu đọc từ trang web không phải lệnh, cổng quyền mới quyết định."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>vết</b> (trajectory)</td><td>chuỗi nghĩ, làm, xem của một lần chạy, ghi lại từng bước</td></tr>
          <tr><td><b>bộ đề</b> (benchmark)</td><td>tập nhiệm vụ cố định kèm cách chấm cố định</td></tr>
          <tr><td><b>phép thử chuyển đạt</b> (fail-to-pass)</td><td>phép thử trượt trước bản sửa của người thật, đạt sau bản sửa đó</td></tr>
          <tr><td><b>giao diện cho tác tử</b></td><td>tập lệnh tác tử dùng để xem, tìm, sửa tệp, kèm thông báo kết quả</td></tr>
          <tr><td><b>môi trường chấm</b> (harness)</td><td>máy, thư viện, lệnh chạy giống hệt nhau cho mọi lần chấm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Vết là chuỗi nghĩ, làm, xem của một lần chạy, ghi lại từng bước. Bộ đề là một tập nhiệm vụ cố định kèm cách chấm cố định. Phép thử chuyển đạt là phép thử trượt trước bản sửa của người thật, và đạt sau bản sửa đó. Giao diện cho tác tử là tập lệnh mà tác tử dùng để xem, tìm, sửa tệp, kèm thông báo kết quả. Môi trường chấm là máy, thư viện và lệnh chạy giống hệt nhau cho mọi lần chấm."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
