id: L03
course: AGT
series: "AGT · AI agent"
title: "Bài 3 — Bộ nhớ: ngữ cảnh ngắn hạn, tóm tắt và truy xuất dài hạn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L03; audit/agt/verify_agt.py L03; C. Packer và cộng sự, MemGPT: Towards LLMs as Operating Systems (2023); J. S. Park và cộng sự, Generative Agents (2023) — bộ nhớ có truy xuất; LLM bài 12 (truy xuất), bài 13 (ngữ cảnh dài)"
assumes: [arith, frac]
# Quy ước: cửa sổ ngữ cảnh 128 000 từ tố, lời nhắc hệ thống 8 000, mỗi lượt hội thoại thêm 2 000 (SỐ MINH HOẠ). alg.turns_until_full(cửa sổ, hệ thống, mỗi lượt)
#   = ⌊(cửa sổ − hệ thống) / mỗi lượt⌋. Kiểu “tóm tắt + giữ nguyên W lượt gần nhất”: hệ thống + tóm tắt + W · mỗi lượt ≤ cửa sổ.
objectives:
  - "Ước lượng ngân sách ngữ cảnh"
  - "So sánh tóm tắt và truy xuất dài hạn"
  - "Nhận ra rủi ro của bộ nhớ lâu dài"
asr_reviewed:
  - {sentence: "Chia 80 cho 30, được xấp xỉ 2 phẩy 67, dấu bằng lượn sóng đọc là xấp xỉ.", reason: "ASR chép “Chìa 80 cho 30, được sắp xỉ 2,67, dấu bằng lượng sóng độc là sắp xỉ.” (0.773): lệch âm/thanh thuần Việt: chia/chìa, xấp/sắp, lượn/lượng, đọc/độc, xấp/sắp — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sau 60 lượt, tác tử quên tên khách hàng"
    checks:
      - "alg.turns_until_full(128000, 8000, 2000) == 60"
    steps:
      - show: |
          <p>Trợ lý chăm sóc khách hàng nói chuyện cả buổi chiều. Tới lượt thứ 61, nó hỏi lại tên khách — dù khách đã nói ở lượt đầu. Ngữ cảnh 128 nghìn từ tố đã đầy sau khoảng <b>60 lượt</b>, và phần đầu bị cắt bỏ.</p>
          <div class="box key">Hôm nay: <b>bộ nhớ</b> của tác tử — ngữ cảnh là bộ nhớ ngắn hạn có hạn; <b>tóm tắt</b> và <b>truy xuất</b> là hai cách nhớ lâu hơn.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trợ lý chăm sóc khách hàng nói chuyện cả buổi chiều. Tới lượt thứ 61, nó hỏi lại tên khách, dù khách đã nói ở lượt đầu. Ngữ cảnh 128 nghìn từ tố đã đầy sau khoảng 60 lượt, và phần đầu bị cắt bỏ. Hôm nay ta học bộ nhớ của tác tử, ngữ cảnh là bộ nhớ ngắn hạn có hạn, còn tóm tắt và truy xuất là hai cách nhớ lâu hơn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trừ phần cố định rồi chia lấy phần nguyên"
    checks:
      - "100 - 20 == 80 and round(80 / 30, 2) == 2.67 and 80 // 30 == 2 and 20 + 2 * 30 == 80 and 20 + 3 * 30 == 110"
    steps:
      - show: |
          <p>Bạn có 100 nghìn đồng; 20 nghìn đã dành sẵn cho vé xe (phần <b>cố định</b>). Mỗi bữa ăn 30 nghìn. Ăn được mấy bữa?</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th></tr>
          <tr><td>trừ phần cố định</td><td>$100 - 20 = 80$</td></tr>
          <tr><td>chia cho mỗi bữa</td><td>$\frac{80}{30} \approx 2{,}67$</td></tr>
          <tr><td>lấy phần nguyên</td><td>$\hl{2}$ bữa trọn vẹn</td></tr></table>
        introduces: [approx]
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Trước hết, ôn một phép tính ngân sách đời thường. Bạn có 100 nghìn đồng, trong đó 20 nghìn đã dành sẵn cho vé xe, gọi là phần cố định, và mỗi bữa ăn hết 30 nghìn. Bước đầu, trừ phần cố định, còn 80 nghìn. Chia 80 cho 30, được xấp xỉ 2 phẩy 67, dấu bằng lượn sóng đọc là xấp xỉ. Vì không ai ăn được hai phẩy sáu bảy bữa, ta lấy phần nguyên, được 2 bữa trọn vẹn."
      - show: |
          <p>Thử lại: 2 bữa tốn $20 + 2 \times 30 = 80 \le 100$, vừa; 3 bữa tốn $20 + 3 \times 30 = 110 > 100$, thiếu tiền.</p>
          <p>Ngữ cảnh của mô hình cũng là một ngân sách như vậy, đo bằng <b>từ tố</b> — những mẩu chữ mô hình đọc.</p>
        introduces: [geq]
        focus: [1, 2]
        say: "Thử lại cho chắc, 2 bữa tốn 20 cộng 2 nhân 30, bằng 80, không vượt 100 nên vừa đủ, còn 3 bữa tốn 110, vượt 100 nên thiếu tiền. Ngữ cảnh của mô hình cũng là một ngân sách như vậy, chỉ khác là đo bằng từ tố, tức những mẩu chữ mà mô hình đọc."

  - id: sym
    kind: symbol
    title: "Giải mã: ba loại bộ nhớ"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>cách làm</th><th>đánh đổi</th></tr>
          <tr><td><b>ngắn hạn</b> (ngữ cảnh)</td><td>giữ nguyên lịch sử trong lời nhắc</td><td>chính xác nhưng có hạn, đắt theo độ dài</td></tr>
          <tr><td><b>tóm tắt</b></td><td>thay các lượt cũ bằng một đoạn tóm tắt ngắn</td><td>gọn nhưng <b>mất chi tiết vĩnh viễn</b></td></tr>
          <tr><td><b>dài hạn có truy xuất</b></td><td>lưu ghi chú ra ngoài, mỗi lượt tìm vài ghi chú liên quan đưa vào</td><td>nhớ nhiều nhưng có thể tìm trượt</td></tr></table>
          <p>Ngân sách: lời nhắc hệ thống + tóm tắt + các lượt giữ nguyên ≤ cửa sổ ngữ cảnh.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng so ba loại bộ nhớ. Bộ nhớ ngắn hạn giữ nguyên lịch sử trong lời nhắc, chính xác nhưng có hạn, và đắt theo độ dài. Tóm tắt thay các lượt cũ bằng một đoạn ngắn, gọn nhưng mất chi tiết vĩnh viễn. Bộ nhớ dài hạn có truy xuất lưu ghi chú ra ngoài, mỗi lượt tìm vài ghi chú liên quan để đưa vào, nhớ được nhiều nhưng có thể tìm trượt. Ngân sách là lời nhắc hệ thống cộng tóm tắt cộng các lượt giữ nguyên không được vượt cửa sổ ngữ cảnh."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ngữ cảnh là một cái thước có chiều dài cố định"
    checks:
      - "8000 + 60 * 2000 == 128000 and 8000 + 4000 + 58 * 2000 == 128000 and 8000 + 61 * 2000 > 128000"
    steps:
      - show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><g font-size="22" fill="#1f2937"><text x="280" y="98" text-anchor="end">giữ hết</text><text x="280" y="268" text-anchor="end">tóm tắt</text></g><rect x="300" y="60" width="62" height="60" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/><rect x="362" y="60" width="938" height="60" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="831" y="98" font-size="20" text-anchor="middle" fill="#ffffff">60 lượt × 2 000</text><rect x="300" y="230" width="62" height="60" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/><rect x="362" y="230" width="31" height="60" fill="#d97706" stroke="#ffffff" stroke-width="2"/><rect x="394" y="230" width="906" height="60" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="847" y="268" font-size="20" text-anchor="middle" fill="#ffffff">58 lượt gần nhất × 2 000</text><line x1="1300" y1="30" x2="1300" y2="330" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8"/><text x="1300" y="355" font-size="21" text-anchor="middle" fill="#1f2937">cửa sổ 128 000</text><rect x="1310" y="60" width="16" height="60" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/><text x="1340" y="98" font-size="21" fill="#b91c1c">lượt 61 tràn</text><text x="300" y="160" font-size="20" fill="#b91c1c">hệ thống 8 000</text><text x="362" y="330" font-size="20" fill="#d97706">tóm tắt 4 000 (thay mọi lượt cũ hơn)</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cửa sổ ngữ cảnh như một cái thước dài đúng 128 nghìn từ tố, vạch đứt ở bên phải là giới hạn. Thanh trên giữ hết lịch sử, phần đỏ là lời nhắc hệ thống 8 nghìn, phần xanh là 60 lượt, mỗi lượt 2 nghìn, vừa khít tới vạch. Vì thế lượt thứ 61 không còn chỗ và tràn ra ngoài, phần đầu cuộc trò chuyện bị cắt. Thanh dưới cắt ra 4 nghìn màu cam cho bản tóm tắt thay mọi lượt cũ, và giữ nguyên 58 lượt gần nhất."

  - id: example
    kind: example
    title: "Tính ngân sách ngữ cảnh"
    checks:
      - "alg.turns_until_full(128000, 8000, 2000) == 60 and (128000 - 8000 - 4000) // 2000 == 58"
    steps:
      - show: |
          <p><b>Bước 1 — trừ phần cố định</b> (số minh hoạ): cửa sổ 128 000, lời nhắc hệ thống 8 000 → còn $128\,000 - 8\,000 = 120\,000$ từ tố cho hội thoại.</p>
        say: "Bước một, với số minh hoạ, cửa sổ có 128 nghìn từ tố, lời nhắc hệ thống chiếm cố định 8 nghìn, nên còn 120 nghìn từ tố cho hội thoại."
      - show: |
          <p><b>Bước 2 — chia cho mỗi lượt:</b></p>
          $$\frac{120\,000}{2\,000} = \hl{60} \text{ lượt}$$
          <p>Lượt 61 không còn chỗ → phần đầu bị cắt, tên khách mất.</p>
        focus: [2, 3]
        say: "Bước hai, chia 120 nghìn cho 2 nghìn mỗi lượt, được 60 lượt. Vì vậy lượt thứ 61 không còn chỗ, phần đầu cuộc trò chuyện bị cắt, và tên khách nói ở lượt đầu bị mất."
      - show: |
          <p><b>Bước 3 — dành chỗ cho tóm tắt</b> 4 000 từ tố: còn $120\,000 - 4\,000 = 116\,000$ cho các lượt giữ nguyên.</p>
        say: "Bước ba, dành 4 nghìn từ tố cho một bản tóm tắt các lượt cũ, nên còn 116 nghìn từ tố cho các lượt được giữ nguyên văn."
      - show: |
          <p><b>Bước 4 — chia lại:</b> $\frac{116\,000}{2\,000} = 58$ lượt gần nhất. Lượt cũ hơn được gộp vào tóm tắt, nên hội thoại kéo dài bao lâu cũng vừa.</p>
        say: "Bước bốn, chia 116 nghìn cho 2 nghìn, được 58 lượt gần nhất. Lượt nào cũ hơn thì được gộp vào bản tóm tắt, nên hội thoại kéo dài bao lâu cũng vẫn vừa cửa sổ."
      - clear: true
        show: |
          <table class="t"><tr><th>cách nhớ</th><th>kết quả</th></tr>
          <tr><td>giữ hết lịch sử</td><td>đầy sau 60 lượt</td></tr>
          <tr><td>tóm tắt 4 000 + giữ nguyên lượt gần nhất</td><td>giữ 58 lượt gần nhất, nói chuyện được mãi</td></tr></table>
          <p><b>Bước 5</b> — thông tin “bất biến” (tên khách, mã đơn) nên ghi riêng thành <b>dữ kiện có cấu trúc</b> và luôn đưa vào lời nhắc, không để trôi theo tóm tắt.</p>
        focus: [1, 2, 2]
        say: "Bảng đặt hai cách nhớ cạnh nhau, giữ hết lịch sử thì đầy sau 60 lượt, còn tóm tắt thì giữ được 58 lượt gần nhất mãi mãi. Bước năm, thông tin bất biến như tên khách hay mã đơn nên ghi riêng thành dữ kiện có cấu trúc. Dữ kiện đó luôn được đưa vào lời nhắc, nên không bị trôi mất theo bản tóm tắt."

  - id: check
    kind: check
    title: "Tự kiểm: cộng ngược xem có vừa không"
    checks:
      - "[8000 + n * 2000 for n in (60, 61)] == [128000, 130000] and [8000 + 4000 + n * 2000 for n in (58, 59)] == [128000, 130000]"
    steps:
      - show: |
          <p>Cách khác: thay vì chia, ta <b>nhân rồi cộng ngược</b>, xem số lượt vừa tính có lọt cửa sổ 128 000 không, và thêm 1 lượt thì có tràn không.</p>
          <table class="t"><tr><th>thử</th><th>tổng từ tố</th><th>vừa 128 000?</th></tr>
          <tr><td>8 000 + 60 × 2 000</td><td>128 000</td><td>vừa khít ✓</td></tr>
          <tr><td>8 000 + 61 × 2 000</td><td>130 000</td><td class="red">tràn</td></tr>
          <tr><td>8 000 + 4 000 + 58 × 2 000</td><td>128 000</td><td>vừa khít ✓</td></tr>
          <tr><td>8 000 + 4 000 + 59 × 2 000</td><td>130 000</td><td class="red">tràn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Kiểm bằng đường khác, thay vì chia, ta nhân rồi cộng ngược, xem số lượt vừa tính có lọt cửa sổ không, và thêm một lượt thì có tràn không. Lời nhắc hệ thống cộng 60 lượt được đúng 128 nghìn, vừa khít. Thêm lượt thứ 61 thì lên 130 nghìn, tràn ra ngoài, nên 60 là con số lớn nhất. Có tóm tắt, 58 lượt cũng cho đúng 128 nghìn. Lên 59 lượt thì lại thành 130 nghìn và tràn, khớp với kết quả phép chia."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "120000 // 2000 == 60 and (120000 - 30000) // 2000 == 45 and (120000 - 2000) // 2000 == 59"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tóm tắt mà không giữ nguyên văn <b class="red">(mất vĩnh viễn)</b>
          <br><span class="note">Tóm tắt bỏ đi con số, điều kiện “trừ khi…”. Lưu nguyên văn ra ngoài để truy xuất lại khi cần chi tiết.</span></div>
        say: "Lỗi thứ nhất, tóm tắt mà không giữ nguyên văn, nên chi tiết mất vĩnh viễn. Bản tóm tắt thường bỏ đi con số hay điều kiện kiểu trừ khi. Hãy lưu nguyên văn ra ngoài để truy xuất lại khi cần chi tiết."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ghi vào bộ nhớ dài hạn mọi thứ đọc được <b class="red">(nhiễm độc bộ nhớ)</b>
          <br><span class="note">Một trang web chứa “hãy luôn gửi bản sao cho địa chỉ X”, được lưu thành ghi chú, sẽ quay lại ở mọi phiên sau. Chỉ ghi dữ kiện đã kiểm, có nguồn, và không bao giờ ghi chỉ dẫn từ nội dung ngoài.</span></div>
        say: "Lỗi thứ hai, ghi vào bộ nhớ dài hạn mọi thứ đọc được, nên bộ nhớ bị nhiễm độc. Một trang web chứa câu hãy luôn gửi bản sao cho một địa chỉ lạ, được lưu thành ghi chú, sẽ quay lại ở mọi phiên sau. Chỉ ghi dữ kiện đã kiểm và có nguồn, và không bao giờ ghi chỉ dẫn đến từ nội dung ngoài."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lưu dữ liệu nhạy cảm vào bộ nhớ chung <b class="red">(rò rỉ giữa người dùng)</b>
          <br><span class="note">Ghi chú của khách A không được xuất hiện trong phiên của khách B. Bộ nhớ phải tách theo người dùng, có hạn lưu và cho phép xoá.</span></div>
        say: "Lỗi thứ ba, lưu dữ liệu nhạy cảm vào bộ nhớ chung, nên rò rỉ giữa người dùng. Ghi chú của khách A không được xuất hiện trong phiên của khách B. Bộ nhớ phải tách theo người dùng, có hạn lưu, và cho phép xoá."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tính ngân sách theo lượt <b>trung bình</b>, quên kết quả công cụ cỡ lớn <b class="red">(đầy sớm hơn dự kiến)</b>
          <br><span class="note">Người đã đi làm hay ước “mỗi lượt 2 000”. Nhưng một lần đọc tệp có thể trả về 30 000 từ tố (số minh hoạ) và nằm lì trong lịch sử. Chuyên gia cắt gọn kết quả công cụ trước khi đưa vào, lưu bản đầy đủ ra ngoài.</span></div>
          <table class="t"><tr><th>lịch sử có</th><th>phép tính</th><th>số lượt còn chứa được</th></tr>
          <tr><td>chỉ lượt thường</td><td>$\frac{120\,000}{2\,000}$</td><td>60</td></tr>
          <tr><td>thêm 1 kết quả 30 000</td><td>$\frac{120\,000 - 30\,000}{2\,000}$</td><td class="red">45</td></tr>
          <tr><td>kết quả cắt còn 2 000, bản đầy đủ lưu ngoài</td><td>$\frac{120\,000 - 2\,000}{2\,000}$</td><td>$\hl{59}$</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tính ngân sách theo lượt trung bình mà quên các kết quả công cụ cỡ lớn. Họ hay ước mỗi lượt khoảng 2 nghìn từ tố, nhưng một lần đọc tệp có thể trả về tới 30 nghìn từ tố, theo số minh hoạ, và nằm lì trong lịch sử. Chuyên gia cắt gọn kết quả công cụ trước khi đưa vào ngữ cảnh, và lưu bản đầy đủ ra ngoài để truy xuất khi cần. Bảng tính số lượt còn chứa được trong ba trường hợp. Chỉ có lượt thường thì chứa được 60 lượt. Thêm một kết quả 30 nghìn thì chỉ còn 120 nghìn trừ 30 nghìn, chia 2 nghìn, bằng 45 lượt. Nếu cắt kết quả còn 2 nghìn thì chứa được 59 lượt, gần như không mất gì."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.turns_until_full(32000, 4000, 1500) == 18 and (32000 - 4000 - 2000) // 1500 == 17"
      - "32000 - 4000 == 28000 and round(28000 / 1500, 1) == 18.7 and 4000 + 18 * 1500 == 31000 and 4000 + 19 * 1500 == 32500 and 28000 - 2000 == 26000 and round(26000 / 1500, 1) == 17.3 and 40 - 17 + 1 == 24 and 5 < 24"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cửa sổ 32 000 từ tố, lời nhắc hệ thống 4 000, mỗi lượt 1 500. Giữ hết lịch sử thì đầy sau mấy lượt?</td></tr>
          <tr><td>2</td><td>Dành 2 000 từ tố cho tóm tắt thì giữ nguyên được bao nhiêu lượt gần nhất?</td></tr>
          <tr><td>3</td><td>Đang ở lượt 40 (cách ở câu 2), khách hỏi lại đúng con số đã nói ở lượt 5. Lấy từ đâu cho chắc?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cửa sổ 32 nghìn từ tố, lời nhắc hệ thống 4 nghìn, mỗi lượt 1 nghìn 500. Giữ hết lịch sử thì đầy sau mấy lượt? Câu hai, dành 2 nghìn từ tố cho tóm tắt thì giữ nguyên được bao nhiêu lượt gần nhất? Câu ba, đang ở lượt 40 theo cách của câu hai, khách hỏi lại đúng con số đã nói ở lượt 5, tác tử nên lấy nó từ đâu cho chắc? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Trừ phần cố định: $32\,000 - 4\,000 = 28\,000$. Chia: $\frac{28\,000}{1\,500} \approx 18{,}7$ → đầy sau <b>$\hl{18}$</b> lượt trọn vẹn.</p>
          <p>Thử lại: $4\,000 + 18 \times 1\,500 = 31\,000$ vừa; 19 lượt thành $32\,500$, tràn.</p>
        focus: [1, 2]
        say: "Đáp án câu một, trừ phần cố định, 32 nghìn trừ 4 nghìn còn 28 nghìn, chia cho 1 nghìn 500 được xấp xỉ 18 phẩy 7, nên đầy sau 18 lượt trọn vẹn. Thử lại, 18 lượt cộng lời nhắc hệ thống là 31 nghìn, vừa, còn 19 lượt thành 32 nghìn 500, tràn."
      - show: |
          <p>② Trừ thêm tóm tắt: $28\,000 - 2\,000 = 26\,000$; $\frac{26\,000}{1\,500} \approx 17{,}3$ → giữ <b>17</b> lượt gần nhất.</p>
        say: "Câu hai, trừ thêm 2 nghìn cho tóm tắt thì còn 26 nghìn, chia 1 nghìn 500 được xấp xỉ 17 phẩy 3, nên giữ nguyên được 17 lượt gần nhất."
      - show: |
          <p>③ Ở lượt 40, 17 lượt gần nhất là lượt $40 - 17 + 1 = 24$ tới 40 → lượt 5 <b>không còn nguyên văn</b> trong ngữ cảnh, và tóm tắt có thể đã bỏ con số.</p>
          <div class="box key">Quyết định: lấy từ <b>bộ nhớ ngoài lưu nguyên văn</b> (hoặc dữ kiện có cấu trúc), không đoán từ tóm tắt.</div>
        focus: [1, 2]
        say: "Câu ba, ở lượt 40 thì 17 lượt gần nhất là từ lượt 24 tới lượt 40, nên lượt 5 không còn nguyên văn trong ngữ cảnh, và bản tóm tắt có thể đã bỏ mất con số. Vậy quyết định đúng là lấy con số từ bộ nhớ ngoài lưu nguyên văn, hoặc từ dữ kiện có cấu trúc, chứ không đoán từ bản tóm tắt."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ngữ cảnh có hạn</span><span class="a">→</span>
          <span class="n">tóm tắt lượt cũ, giữ dữ kiện bất biến riêng</span><span class="a">→</span>
          <span class="n">bộ nhớ ngoài có truy xuất, giữ nguyên văn</span><span class="a">→</span>
          <span class="n">chỉ ghi dữ kiện đã kiểm, tách theo người dùng</span></div>
        say: "Tổng kết lại, ngữ cảnh có hạn, nên tóm tắt các lượt cũ và giữ dữ kiện bất biến riêng. Dùng bộ nhớ ngoài có truy xuất và giữ nguyên văn, chỉ ghi dữ kiện đã kiểm, và tách theo người dùng."
      - show: |
          <div class="box key"><b>Tư duy:</b> bộ nhớ của tác tử là <b>dữ liệu</b> phải được quản lý — có nguồn, có hạn, có quyền — không phải một cuốn nhật ký tự do.</div>
        say: "Điều cần mang theo, bộ nhớ của tác tử là dữ liệu phải được quản lý, có nguồn, có hạn và có quyền, không phải một cuốn nhật ký tự do."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>tác tử tìm thông tin</b> — truy vấn lặp và trích dẫn nguồn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học tác tử tìm thông tin, với truy vấn lặp và trích dẫn nguồn. Hẹn gặp bạn ở bài tiếp theo."
