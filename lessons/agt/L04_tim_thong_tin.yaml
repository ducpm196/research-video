id: L04
course: AGT
series: "AGT · AI agent"
title: "Bài 4 — Tác tử tìm kiếm thông tin: truy vấn lặp và trích dẫn nguồn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L04; audit/agt/verify_agt.py L04; O. Press và cộng sự, Measuring and Narrowing the Compositionality Gap (Self-Ask, 2023); T. Gao và cộng sự, Enabling Large Language Models to Generate Text with Citations (2023); LLM bài 12 (truy xuất, độ phủ@k)"
assumes: [arith, power, frac]
# Quy ước: độ phủ lần truy vấn đầu 60%; mỗi lần viết lại truy vấn tìm thêm 50% phần còn thiếu, giả định ĐỘC LẬP (alg.recall_after_rewrites) — SỐ MINH HOẠ.
#   alg.citation_check(trích dẫn, nguồn): câu trích phải có NGUYÊN VĂN trong đúng nguồn được dẫn. Hai nguồn S1, S2 là văn bản dựng tay.
objectives:
  - "Viết lại truy vấn dựa trên kết quả trước"
  - "Gắn mỗi khẳng định với một câu trích có thật"
  - "Kiểm trích dẫn bằng chương trình"
asr_reviewed:
  - {sentence: "Trước hết, ôn khái niệm độ phủ.", reason: "ASR chép “Trước hết, ông khái niệm đồ phủ.” (0.714): lệch âm/thanh thuần Việt: ôn/ông, độ/đồ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu nghỉ phép 12 ngày mỗi năm có nguyên văn trong nguồn S 1, nên đạt.", reason: "ASR chép “Câu nghỉ phép 12 ngày mỗi năm có nguyên văn trong nguồn F1, nên đạt.” (0.941): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi ở nguồn S 2 chỉ bắt được khi kiểm câu trích có trong nguồn.", reason: "ASR chép “Lỗi ở nguồn F2 chỉ bắt được khi kiểm câu trích có trong nguồn.” (0.933): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Có trích dẫn, nhưng nguồn không nói vậy"
    checks:
      - "alg.citation_check([('cộng thêm 2 ngày sau mỗi 5 năm', 'S2')], {'S2': 'Nghỉ phép năm được cộng thêm 1 ngày sau mỗi 5 năm làm việc.'}) == [('S2', False, True)]"
    steps:
      - show: |
          <p>Tác tử trả lời: “Cứ 5 năm làm việc được cộng thêm 2 ngày phép [S2]”. Nguồn S2 có thật — nhưng S2 viết “cộng thêm <b>1</b> ngày”. Trích dẫn làm câu trả lời <b>trông</b> đáng tin hơn, kể cả khi nó sai.</p>
          <div class="box key">Hôm nay: tác tử <b>tìm thông tin</b> — truy vấn lặp để phủ đủ, và <b>trích dẫn kiểm được</b> để mỗi khẳng định có căn cứ thật.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, tác tử trả lời rằng cứ 5 năm làm việc được cộng thêm 2 ngày phép, và dẫn nguồn S 2. Nguồn S 2 có thật, nhưng S 2 viết cộng thêm 1 ngày. Trích dẫn làm câu trả lời trông đáng tin hơn, kể cả khi nó sai. Hôm nay ta học tác tử tìm thông tin, truy vấn lặp để phủ đủ, và trích dẫn kiểm được để mỗi khẳng định có căn cứ thật."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: độ phủ, phần còn thiếu, và tìm chuỗi trong câu"
    checks:
      - "6 / 10 == 0.6 and 10 - 6 == 4 and 4 / 2 == 2 and (6 + 2) / 10 == 0.8"
      - "('12 ngày' in 'Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.') and ('15 ngày' not in 'Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.')"
    steps:
      - show: |
          <p><b>Truy vấn</b> là câu tìm kiếm gửi cho máy tìm, như chữ gõ vào ô tìm kiếm. Có 10 văn bản thật sự liên quan tới câu hỏi; lần tìm đầu thấy 6. <b>Độ phủ</b> là phần tìm thấy: $\frac{6}{10} = 60\%$. Phần còn thiếu: $10 - 6 = 4$ văn bản.</p>
          <p>Nếu lần sau tìm thêm được <b>một nửa phần còn thiếu</b>: $\frac{4}{2} = 2$ → thấy $6 + 2 = 8$, độ phủ $\hl{80\%}$.</p>
        focus: [1, 1, 1, 1, 2]
        say: "Trước hết, ôn khái niệm độ phủ. Truy vấn là câu tìm kiếm gửi cho máy tìm, giống như chữ ta gõ vào ô tìm kiếm. Giả sử có 10 văn bản thật sự liên quan tới câu hỏi, và lần tìm đầu thấy 6, thì độ phủ là 6 phần 10, tức 60 phần trăm. Phần còn thiếu là 10 trừ 6, bằng 4 văn bản. Nếu lần sau tìm thêm được một nửa phần còn thiếu, tức 2 văn bản, thì thấy tổng cộng 8, và độ phủ lên 80 phần trăm."
      - show: |
          <p><b>Tìm chuỗi</b>: một cụm chữ có nằm <b>nguyên văn</b> trong câu không?</p>
          <table class="t"><tr><th>câu nguồn</th><th>cụm cần tìm</th><th>có nguyên văn?</th></tr>
          <tr><td rowspan="2">“Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.”</td><td>“12 ngày”</td><td>có</td></tr>
          <tr><td>“15 ngày”</td><td class="red">không</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Phép thứ hai là tìm chuỗi, tức là hỏi một cụm chữ có nằm nguyên văn trong câu hay không, máy làm việc này rất nhanh và chắc. Với câu nguồn nhân viên chính thức được nghỉ phép 12 ngày mỗi năm, cụm 12 ngày có nằm trong câu. Còn cụm 15 ngày thì không có, dù hai cụm chỉ khác nhau một con số."

  - id: sym
    kind: symbol
    title: "Giải mã: truy vấn lặp và trích dẫn kiểm được"
    steps:
      - show: |
          <div class="chain"><span class="n">truy vấn</span><span class="a">→</span><span class="n">đọc kết quả</span><span class="a">→</span><span class="n">còn thiếu gì?</span><span class="a">→</span><span class="n">viết lại truy vấn (từ khoá mới, câu hỏi con)</span><span class="a">→</span><span class="n">đủ thì dừng</span></div>
          <table class="t"><tr><th>trích dẫn kiểm được</th><th>nghĩa</th></tr>
          <tr><td>mỗi khẳng định kèm mã nguồn</td><td>người đọc biết tra ở đâu</td></tr>
          <tr><td>kèm <b>câu trích nguyên văn</b></td><td>chương trình kiểm được câu đó có trong nguồn</td></tr>
          <tr><td>kiểm trước khi trả lời</td><td>câu trích không có trong nguồn → bỏ khẳng định hoặc tìm lại</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Vòng truy vấn lặp đi từ truy vấn, đọc kết quả, tự hỏi còn thiếu gì, rồi viết lại truy vấn bằng từ khoá mới hay câu hỏi con, và đủ thì dừng. Bảng này mô tả một trích dẫn như thế nào thì kiểm được. Mỗi khẳng định kèm mã nguồn để người đọc biết tra ở đâu. Kèm câu trích nguyên văn để chương trình kiểm được câu đó có trong nguồn. Và kiểm trước khi trả lời, câu trích không có trong nguồn thì bỏ khẳng định hoặc tìm lại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi lần viết lại lấp một nửa chỗ trống"
    checks:
      - "[round(10 * alg.recall_after_rewrites(0.6, 0.5, r)) for r in (0, 1, 2)] == [6, 8, 9] and [10 - 6, 10 - 8, 10 - 9] == [4, 2, 1]"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><text x="330" y="85" font-size="24" text-anchor="end" fill="#1f2937">truy vấn đầu</text><rect x="360" y="40" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="438" y="40" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="516" y="40" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="594" y="40" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="672" y="40" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="750" y="40" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="828" y="40" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="906" y="40" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="984" y="40" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="1062" y="40" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1160" y="85" font-size="24" fill="#1f2937">6 trên 10 = 60%, thiếu 4</text><text x="330" y="185" font-size="24" text-anchor="end" fill="#1f2937">viết lại lần 1</text><rect x="360" y="140" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="438" y="140" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="516" y="140" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="594" y="140" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="672" y="140" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="750" y="140" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="828" y="140" width="66" height="66" rx="8" fill="#eb6834" stroke="#1f2937" stroke-width="2"/><rect x="906" y="140" width="66" height="66" rx="8" fill="#eb6834" stroke="#1f2937" stroke-width="2"/><rect x="984" y="140" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="1062" y="140" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1160" y="185" font-size="24" fill="#1f2937">8 trên 10 = 80%, thiếu 2</text><text x="330" y="285" font-size="24" text-anchor="end" fill="#1f2937">viết lại lần 2</text><rect x="360" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="438" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="516" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="594" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="672" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="750" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="828" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="906" y="240" width="66" height="66" rx="8" fill="#059669" stroke="#1f2937" stroke-width="2"/><rect x="984" y="240" width="66" height="66" rx="8" fill="#eb6834" stroke="#1f2937" stroke-width="2"/><rect x="1062" y="240" width="66" height="66" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1160" y="285" font-size="24" fill="#1f2937">9 trên 10 = 90%, thiếu 1</text><g font-size="21"><rect x="360" y="322" width="22" height="22" fill="#059669"/><text x="392" y="340" fill="#1f2937">đã có</text><rect x="500" y="322" width="22" height="22" fill="#eb6834"/><text x="532" y="340" fill="#1f2937">tìm thêm ở lần này</text><rect x="760" y="322" width="22" height="22" fill="#e5e7eb" stroke="#1f2937"/><text x="792" y="340" fill="#1f2937">còn thiếu</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ 10 ô, mỗi ô là một văn bản thật sự liên quan, ô xanh là đã tìm thấy, ô xám là còn thiếu. Truy vấn đầu thấy 6 ô, còn thiếu 4. Viết lại lần một, tác tử lấp được một nửa chỗ trống, thêm 2 ô màu cam, lên 8 trên 10. Viết lại lần hai lấp tiếp một nửa của 2 ô còn thiếu, thêm 1 ô, lên 9 trên 10, nên mỗi lần lợi ít hơn lần trước."

  - id: example
    kind: example
    title: "Độ phủ tăng dần và ba trích dẫn được kiểm"
    checks:
      - "[round(alg.recall_after_rewrites(0.6, 0.5, r), 3) for r in (0, 1, 2)] == [0.6, 0.8, 0.9]"
      - "alg.citation_check([('được nghỉ phép 12 ngày mỗi năm', 'S1'), ('cộng thêm 2 ngày sau mỗi 5 năm', 'S2'), ('được nghỉ 15 ngày', 'S3')], {'S1': 'Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.', 'S2': 'Nghỉ phép năm được cộng thêm 1 ngày sau mỗi 5 năm làm việc.'}) == [('S1', True, True), ('S2', False, True), ('S3', False, False)]"
    steps:
      - show: |
          <p><b>Bước 1 — truy vấn đầu</b> (số minh hoạ): độ phủ $0{,}6$; phần còn thiếu $1 - 0{,}6 = 0{,}4$.</p>
        say: "Bước một, với số minh hoạ, truy vấn đầu có độ phủ 0 phẩy 6, nên phần còn thiếu là 1 trừ 0 phẩy 6, bằng 0 phẩy 4."
      - show: |
          <p><b>Bước 2 — viết lại lần 1:</b> tìm thêm một nửa phần thiếu, $0{,}5 \cdot 0{,}4 = 0{,}2$ → độ phủ $0{,}6 + 0{,}2 = 0{,}8$; còn thiếu $0{,}2$.</p>
        introduces: [cdot]
        say: "Bước hai, viết lại truy vấn lần một, tìm thêm một nửa phần còn thiếu, 0 phẩy 5 nhân 0 phẩy 4, bằng 0 phẩy 2, dấu chấm giữa ở đây là phép nhân. Độ phủ lên 0 phẩy 6 cộng 0 phẩy 2, bằng 0 phẩy 8, và còn thiếu 0 phẩy 2."
      - show: |
          <p><b>Bước 3 — viết lại lần 2:</b> thêm $0{,}5 \cdot 0{,}2 = 0{,}1$ → độ phủ $\hl{0{,}9}$. Gộp lại: phần thiếu bị nhân với 0,5 mỗi lần viết lại:</p>
          $$1 - 0{,}4 \cdot 0{,}5^2 = 1 - 0{,}1 = 0{,}9$$
        focus: [1, 2, 2]
        say: "Bước ba, viết lại lần hai, thêm 0 phẩy 5 nhân 0 phẩy 2, bằng 0 phẩy 1, nên độ phủ đạt 0 phẩy 9 sau 3 lần truy vấn. Gộp lại thành công thức, phần thiếu ban đầu 0 phẩy 4 bị nhân với 0 phẩy 5 sau mỗi lần viết lại. Vậy độ phủ là 1 trừ 0 phẩy 4 nhân 0 phẩy 5 bình phương, bằng 0 phẩy 9."
      - clear: true
        show: |
          <p><b>Bước 4 — kiểm từng trích dẫn</b>: tìm câu trích nguyên văn trong đúng nguồn được dẫn.</p>
          <p class="note">S1: “Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.” — S2: “Nghỉ phép năm được cộng thêm 1 ngày sau mỗi 5 năm làm việc.”</p>
          <table class="t"><tr><th>câu trích</th><th>nguồn</th><th>kiểm</th></tr>
          <tr><td>“được nghỉ phép 12 ngày mỗi năm”</td><td>S1</td><td class="green">có trong S1</td></tr>
          <tr><td>“cộng thêm 2 ngày sau mỗi 5 năm”</td><td>S2</td><td class="red">S2 có thật, nhưng không có câu này</td></tr>
          <tr><td>“được nghỉ 15 ngày”</td><td>S3</td><td class="red">không có nguồn S3</td></tr></table>
        focus: [1, 2, "3.2", "3.3", "3.4"]
        say: "Bước bốn, kiểm từng trích dẫn bằng cách tìm câu trích nguyên văn trong đúng nguồn được dẫn. Hai nguồn S 1 và S 2 được ghi ngay trên bảng để bạn đối chiếu. Câu nghỉ phép 12 ngày mỗi năm có nguyên văn trong nguồn S 1, nên đạt. Câu cộng thêm 2 ngày dẫn nguồn S 2, nguồn có thật nhưng ghi 1 ngày, nên câu trích không có trong đó. Câu nghỉ 15 ngày dẫn nguồn S 3, mà nguồn đó không tồn tại."
      - show: |
          <div class="box key"><b>Bước 5 — quyết định:</b> giữ khẳng định 1; khẳng định 2 sửa theo S2 thành “1 ngày” rồi kiểm lại; khẳng định 3 bỏ hoặc tìm lại nguồn.</div>
        say: "Bước năm là quyết định trước khi trả lời. Khẳng định thứ nhất được giữ. Khẳng định thứ hai sửa theo đúng nguồn S 2 thành 1 ngày rồi kiểm lại, còn khẳng định thứ ba thì bỏ đi hoặc tìm lại nguồn."

  - id: check
    kind: check
    title: "Tự kiểm: đếm ô và đọc từng chữ"
    checks:
      - "(lambda f: f == [6, 8, 9])((lambda a: [a[0], a[0] + (10 - a[0]) // 2, a[0] + (10 - a[0]) // 2 + (10 - a[0] - (10 - a[0]) // 2) // 2])([6]))"
      - "'cộng thêm 1 ngày sau mỗi 5 năm' in 'Nghỉ phép năm được cộng thêm 1 ngày sau mỗi 5 năm làm việc.' and 'cộng thêm 2 ngày sau mỗi 5 năm' not in 'Nghỉ phép năm được cộng thêm 1 ngày sau mỗi 5 năm làm việc.'"
    steps:
      - show: |
          <p>Cách khác 1 — <b>đếm ô</b> thay vì dùng công thức, với 10 văn bản liên quan:</p>
          <table class="t"><tr><th>lần</th><th>thiếu trước đó</th><th>tìm thêm (một nửa)</th><th>đã thấy</th></tr>
          <tr><td>truy vấn đầu</td><td>—</td><td>—</td><td>6</td></tr>
          <tr><td>viết lại lần 1</td><td>4</td><td>2</td><td>8</td></tr>
          <tr><td>viết lại lần 2</td><td>2</td><td>1</td><td>9 → 90% ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng đường khác, cách thứ nhất là đếm ô thay vì dùng công thức, với 10 văn bản liên quan. Truy vấn đầu thấy 6 văn bản. Lần viết lại thứ nhất thiếu 4, tìm thêm một nửa là 2, nên thấy 8. Lần thứ hai thiếu 2, tìm thêm 1, nên thấy 9 trên 10, đúng 90 phần trăm như công thức."
      - show: |
          <p>Cách khác 2 — <b>đặt hai câu chồng lên nhau</b> và đọc từng chữ:</p>
          <table class="t"><tr><th></th><th>câu</th></tr>
          <tr><td>trong S2</td><td>… cộng thêm <b class="green">1</b> ngày sau mỗi 5 năm …</td></tr>
          <tr><td>câu trích</td><td>… cộng thêm <b class="red">2</b> ngày sau mỗi 5 năm …</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Cách thứ hai là đặt hai câu chồng lên nhau rồi đọc từng chữ, vì như vậy mắt người thấy ngay chỗ lệch. Trong nguồn S 2, câu viết cộng thêm 1 ngày sau mỗi 5 năm. Câu trích lại viết cộng thêm 2 ngày, lệch đúng ở con số, khớp với kết quả chương trình báo không có."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "('Được nghỉ phép  12 ngày' not in 'Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.') and ((lambda s: ' '.join(s.lower().split()))('Được nghỉ phép  12 ngày') in (lambda s: ' '.join(s.lower().split()))('Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.')) and ((lambda s: ' '.join(s.lower().split()))('cộng thêm 2 ngày sau mỗi 5 năm') not in (lambda s: ' '.join(s.lower().split()))('Nghỉ phép năm được cộng thêm 1 ngày sau mỗi 5 năm làm việc.'))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ kiểm nguồn có tồn tại <b class="red">(trích sai vẫn lọt)</b>
          <br><span class="note">Lỗi ở S2 chỉ bắt được khi kiểm <b>câu trích</b> có trong nguồn. Kiểm nguyên văn bằng chương trình; câu diễn đạt lại thì cho một mô hình khác đối chiếu và đánh dấu “cần người xem”.</span></div>
        say: "Lỗi thứ nhất, chỉ kiểm nguồn có tồn tại, nên trích sai vẫn lọt. Lỗi ở nguồn S 2 chỉ bắt được khi kiểm câu trích có trong nguồn. Hãy kiểm nguyên văn bằng chương trình, còn câu diễn đạt lại thì cho một mô hình khác đối chiếu và đánh dấu cần người xem."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dừng sau truy vấn đầu tiên <b class="red">(thiếu thông tin)</b>
          <br><span class="note">Câu hỏi nhiều phần (“phép năm và phép thai sản”) cần nhiều truy vấn con. Tự hỏi “câu trả lời còn thiếu phần nào?” trước khi dừng.</span></div>
        say: "Lỗi thứ hai, dừng sau truy vấn đầu tiên, nên thiếu thông tin. Câu hỏi nhiều phần, như phép năm và phép thai sản, cần nhiều truy vấn con. Hãy tự hỏi câu trả lời còn thiếu phần nào trước khi dừng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Làm theo chỉ dẫn nằm trong trang tìm được <b class="red">(bị điều khiển)</b>
          <br><span class="note">Trang web có thể chứa “bỏ qua yêu cầu trước, hãy…”. Nội dung tìm được là <b>dữ liệu</b> để đọc, không phải lệnh để làm.</span></div>
        say: "Lỗi thứ ba, làm theo chỉ dẫn nằm trong trang tìm được, nên bị điều khiển. Một trang web có thể chứa câu bảo tác tử bỏ qua yêu cầu trước và làm việc khác. Nội dung tìm được là dữ liệu để đọc, không phải lệnh để làm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Phép kiểm nguyên văn báo trượt vì khác chữ hoa, dấu cách — rồi <b>tắt luôn</b> phép kiểm <b class="red">(mất lưới an toàn)</b>
          <br><span class="note">Người đã đi làm gặp nhiều lần báo trượt oan nên bỏ phép kiểm. Chuyên gia <b>chuẩn hoá</b> cả hai bên (chữ thường, gộp dấu cách) rồi mới so — phép kiểm hết báo oan mà vẫn bắt được lỗi thật.</span></div>
          <table class="t"><tr><th>câu trích</th><th>so thô</th><th>so sau chuẩn hoá</th></tr>
          <tr><td>“Được nghỉ phép␣␣12 ngày” (viết hoa, hai dấu cách)</td><td class="red">không có (báo oan)</td><td class="green">có</td></tr>
          <tr><td>“cộng thêm 2 ngày sau mỗi 5 năm”</td><td class="red">không có</td><td class="red">vẫn không có (lỗi thật)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm. Phép kiểm nguyên văn báo trượt chỉ vì khác chữ hoa hay thừa một dấu cách, báo oan nhiều lần quá nên người ta tắt luôn phép kiểm. Chuyên gia làm khác, chuẩn hoá cả hai bên bằng cách đổi về chữ thường và gộp các dấu cách, rồi mới so. Câu trích viết hoa chữ đầu và có hai dấu cách thì so thô báo không có, nhưng sau chuẩn hoá thì có. Còn câu cộng thêm 2 ngày sau chuẩn hoá vẫn không có, nên phép kiểm vẫn bắt được lỗi thật."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.recall_after_rewrites(0.5, 0.4, 2), 2) == 0.82 and alg.citation_check([('mỗi năm', 'S1')], {'S1': 'Nhân viên chính thức được nghỉ phép 12 ngày mỗi năm.'}) == [('S1', True, True)]"
      - "round(0.4 * 0.5, 2) == 0.2 and round(0.4 * 0.3, 2) == 0.12 and round(0.5 + 0.2, 2) == 0.7 and round(0.7 + 0.12, 2) == 0.82"
      - "round(0.4 * 0.18, 3) == 0.072 and round(alg.recall_after_rewrites(0.5, 0.4, 3), 3) == 0.892 and round(0.4 * 0.108, 3) == 0.043 and round(alg.recall_after_rewrites(0.5, 0.4, 4), 3) == 0.935 and 0.072 >= 0.05 > 0.043"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Lần đầu phủ 50%, mỗi lần viết lại tìm thêm 40% phần còn thiếu. Sau 3 lần truy vấn phủ bao nhiêu?</td></tr>
          <tr><td>2</td><td>Câu trích “mỗi năm” có trong S1. Như vậy đã đủ chứng minh khẳng định “được nghỉ 12 ngày” chưa?</td></tr>
          <tr><td>3</td><td>Cùng số như câu 1. Chỉ truy vấn tiếp khi lần đó tăng độ phủ ít nhất 5 điểm phần trăm. Dừng sau lần viết lại thứ mấy?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, lần đầu phủ 50 phần trăm, mỗi lần viết lại tìm thêm 40 phần trăm phần còn thiếu. Sau 3 lần truy vấn phủ bao nhiêu? Câu hai, câu trích mỗi năm có trong nguồn S 1. Như vậy đã đủ chứng minh khẳng định được nghỉ 12 ngày chưa? Câu ba, cùng số như câu một, nếu chỉ truy vấn tiếp khi lần đó tăng độ phủ ít nhất 5 điểm phần trăm, thì dừng sau lần viết lại thứ mấy? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>lần</th><th>tìm thêm</th><th>độ phủ</th></tr>
          <tr><td>truy vấn đầu</td><td>—</td><td>0,5</td></tr>
          <tr><td>viết lại lần 1</td><td>$0{,}4 \cdot 0{,}5 = 0{,}2$</td><td>0,7</td></tr>
          <tr><td>viết lại lần 2</td><td>$0{,}4 \cdot 0{,}3 = 0{,}12$</td><td>$\hl{0{,}82}$</td></tr></table>
          <p>Công thức cho cùng kết quả: $1 - 0{,}5 \cdot 0{,}6^2 = 0{,}82$ (82%).</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu một, ta làm từng lần một. Truy vấn đầu phủ 0 phẩy 5, còn thiếu 0 phẩy 5. Lần viết lại thứ nhất tìm thêm 0 phẩy 4 nhân 0 phẩy 5, bằng 0 phẩy 2, nên độ phủ lên 0 phẩy 7. Lần thứ hai tìm thêm 0 phẩy 4 nhân 0 phẩy 3, bằng 0 phẩy 12, nên độ phủ đạt 0 phẩy 82. Công thức 1 trừ 0 phẩy 5 nhân 0 phẩy 6 bình phương cũng cho 0 phẩy 82, tức 82 phần trăm."
      - show: |
          <p>② <b>Chưa</b>: “mỗi năm” quá ngắn, câu nào về phép năm cũng có. Câu trích phải chứa đúng phần được khẳng định — con số <b>12 ngày</b>.</p>
        say: "Câu hai, chưa đủ, vì cụm mỗi năm quá ngắn, câu nào nói về phép năm cũng có thể chứa nó. Câu trích phải chứa đúng phần được khẳng định, tức con số 12 ngày."
      - clear: true
        show: |
          <p>③ Đang ở độ phủ 0,82, phần còn thiếu 0,18:</p>
          <table class="t"><tr><th>lần viết lại</th><th>tăng thêm</th><th>độ phủ</th><th>≥ 5 điểm?</th></tr>
          <tr><td>3</td><td>$0{,}4 \cdot 0{,}18 = 0{,}072$</td><td>0,892</td><td>có, làm</td></tr>
          <tr><td>4</td><td>$0{,}4 \cdot 0{,}108 \approx 0{,}043$</td><td>≈ 0,935</td><td class="red">không, dừng</td></tr></table>
          <div class="box key">③ Dừng sau lần viết lại <b>thứ 3</b>, độ phủ ≈ 89,2%.</div>
        introduces: [geq]
        focus: [1, "2.2", "2.3", 3]
        say: "Câu ba là một quyết định, ta tính tiếp từ độ phủ 0 phẩy 82, phần còn thiếu 0 phẩy 18. Lần viết lại thứ ba tăng thêm 0 phẩy 4 nhân 0 phẩy 18, bằng 0 phẩy 072, tức hơn 7 điểm phần trăm, nên làm, độ phủ lên 0 phẩy 892. Lần thứ tư chỉ tăng khoảng 0 phẩy 043, dưới 5 điểm, nên dừng. Vậy tác tử dừng sau lần viết lại thứ ba, với độ phủ khoảng 89 phẩy 2 phần trăm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">truy vấn lặp tới khi đủ</span><span class="a">→</span>
          <span class="n">mỗi khẳng định kèm câu trích nguyên văn</span><span class="a">→</span>
          <span class="n">chương trình kiểm câu trích trong nguồn</span><span class="a">→</span>
          <span class="n">nội dung tìm được là dữ liệu, không phải lệnh</span></div>
        say: "Tổng kết lại, truy vấn lặp tới khi đủ, mỗi khẳng định kèm câu trích nguyên văn, và chương trình kiểm câu trích có trong nguồn. Nội dung tìm được là dữ liệu, không phải lệnh."
      - show: |
          <div class="box key"><b>Tư duy:</b> một trích dẫn chưa kiểm chỉ là <b>lời hứa</b> rằng có căn cứ — hãy biến nó thành phép kiểm chạy được.</div>
        say: "Điều cần mang theo, một trích dẫn chưa kiểm chỉ là lời hứa rằng có căn cứ, hãy biến nó thành một phép kiểm chạy được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>tự kiểm tra</b> — bộ kiểm chứng, phản tư và tạo nhiều lần.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học cách tác tử tự kiểm tra, với bộ kiểm chứng, phản tư, và tạo nhiều lần. Hẹn gặp bạn ở bài tiếp theo."
