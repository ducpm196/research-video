scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sáu tác tử, ba mươi kênh nói chuyện"
    checks:
      - "alg.comm_channels(6, 'full') == 30 and alg.comm_channels(6, 'hub') == 10"
    steps:
      - show: |
          <p>Một đội tác tử: người tìm nguồn, người viết mã, người kiểm thử, người viết báo cáo, người duyệt, người lập kế hoạch. Nếu ai cũng nhắn cho mọi người, có <b>30</b> kênh một chiều — và mỗi tin nhắn là một lần đọc, một lần hiểu, một lần có thể hiểu sai.</p>
          <div class="box key">Hôm nay: <b>hệ nhiều tác tử</b> — khi nào chia vai có lợi, cách <b>điều phối</b>, và cái giá của <b>giao tiếp</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một đội tác tử gồm người tìm nguồn, người viết mã, người kiểm thử, người viết báo cáo, người duyệt và người lập kế hoạch. Nếu ai cũng nhắn cho mọi người, có 30 kênh một chiều, và mỗi tin nhắn là một lần đọc, một lần hiểu, một lần có thể hiểu sai. Hôm nay ta học hệ nhiều tác tử, khi nào chia vai có lợi, cách điều phối, và cái giá của giao tiếp."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đếm cặp có thứ tự, và nhân dồn phần trăm"
    checks:
      - "len(list(__import__('itertools').permutations('ABC', 2))) == 6 == 3 * 2"
      - "round(0.9 * 0.9, 2) == 0.81 and round(0.9 ** 3, 3) == 0.729"
    steps:
      - show: |
          <p>Ba bạn A, B, C nhắn tin cho nhau. “A nhắn B” khác “B nhắn A”, nên ta đếm <b>kênh một chiều</b>:</p>
          <table class="t"><tr><th>người gửi</th><th>gửi tới</th><th>số kênh</th></tr>
          <tr><td>A</td><td>B, C</td><td>2</td></tr>
          <tr><td>B</td><td>A, C</td><td>2</td></tr>
          <tr><td>C</td><td>A, B</td><td>2</td></tr></table>
          <p>Cộng: $3 \cdot 2 = \hl{6}$ — mỗi người gửi cho mọi người <b>trừ chính mình</b>.</p>
        introduces: [cdot]
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Trước hết, ôn cách đếm kênh nhắn tin. Ba bạn A, B, C nhắn tin cho nhau, và A nhắn B khác với B nhắn A, nên ta đếm kênh một chiều. A gửi được cho B và C, tức 2 kênh. B gửi cho A và C, C gửi cho A và B, mỗi người cũng 2 kênh. Cộng lại 3 nhân 2 bằng 6, vì mỗi người gửi cho mọi người trừ chính mình."
      - show: |
          <p>Nhân dồn phần trăm: một bản tin giữ 90% chi tiết sau mỗi lần kể lại. Kể lại 2 lần: $0{,}9 \cdot 0{,}9 = 0{,}81$; kể lại 3 lần: $0{,}9^3 = 0{,}729$.</p>
        say: "Điều thứ hai là nhân dồn phần trăm. Một bản tin giữ được 90 phần trăm chi tiết sau mỗi lần kể lại, thì kể lại 2 lần còn 0 phẩy 9 nhân 0 phẩy 9, bằng 0 phẩy 81. Kể lại 3 lần thì còn 0 phẩy 9 mũ 3, bằng 0 phẩy 729, giống trò chơi truyền tin qua nhiều người."

  - id: sym
    kind: symbol
    title: "Giải mã: hai kiểu tổ chức"
    steps:
      - show: |
          <table class="t"><tr><th>kiểu</th><th>số kênh với n tác tử</th><th>ưu</th><th>nhược</th></tr>
          <tr><td><b>ngang hàng</b> (ai cũng nói với ai)</td><td>$n(n - 1)$</td><td>linh hoạt</td><td>bùng nổ tin nhắn, khó biết ai chịu trách nhiệm</td></tr>
          <tr><td><b>điều phối tập trung</b></td><td>$2(n - 1)$</td><td>rõ ai giao việc, ai tổng hợp</td><td>điều phối là điểm nghẽn và <b>điểm hỏng đơn</b> (chỉ một chỗ hỏng là cả hệ dừng)</td></tr></table>
          <p><b>Chia vai có lợi</b> khi các việc con độc lập (chạy song song: các việc không chờ nhau thì làm cùng lúc, như ở bài 2), cần ngữ cảnh riêng, hoặc cần quyền khác nhau (tác tử đọc web không được quyền gửi thư).</p>
        focus: [1, "1.2", "1.3", "1.3", 2, 2]
        say: "Bảng so hai kiểu tổ chức. Kiểu ngang hàng, ai cũng nói với ai, có n nhân n trừ 1 kênh, linh hoạt nhưng bùng nổ tin nhắn và khó biết ai chịu trách nhiệm. Kiểu điều phối tập trung có 2 nhân n trừ 1 kênh, rõ ai giao việc và ai tổng hợp, nhưng tác tử điều phối là điểm nghẽn và điểm hỏng đơn. Điểm hỏng đơn nghĩa là chỉ cần một chỗ đó hỏng thì cả hệ dừng. Chia vai có lợi khi các việc con độc lập để chạy song song, tức các việc không chờ nhau thì làm cùng lúc. Chia vai cũng có lợi khi cần ngữ cảnh riêng, hoặc cần quyền khác nhau, ví dụ tác tử đọc web thì không được quyền gửi thư."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mạng nhện hay ngôi sao"
    checks:
      - "len(list(__import__('itertools').combinations(range(6), 2))) == 15 and 2 * 15 == 30 and 2 * 5 == 10"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g stroke="#eb6834" stroke-width="2"><line x1="380" y1="50" x2="259" y2="120"/><line x1="380" y1="50" x2="259" y2="260"/><line x1="380" y1="50" x2="380" y2="330"/><line x1="380" y1="50" x2="501" y2="260"/><line x1="380" y1="50" x2="501" y2="120"/><line x1="259" y1="120" x2="259" y2="260"/><line x1="259" y1="120" x2="380" y2="330"/><line x1="259" y1="120" x2="501" y2="260"/><line x1="259" y1="120" x2="501" y2="120"/><line x1="259" y1="260" x2="380" y2="330"/><line x1="259" y1="260" x2="501" y2="260"/><line x1="259" y1="260" x2="501" y2="120"/><line x1="380" y1="330" x2="501" y2="260"/><line x1="380" y1="330" x2="501" y2="120"/><line x1="501" y1="260" x2="501" y2="120"/></g><g stroke="#2a78d6" stroke-width="3"><line x1="1100" y1="190" x2="1100" y2="50"/><line x1="1100" y1="190" x2="967" y2="147"/><line x1="1100" y1="190" x2="1018" y2="303"/><line x1="1100" y1="190" x2="1182" y2="303"/><line x1="1100" y1="190" x2="1233" y2="147"/></g><circle cx="380" cy="50" r="30" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="380" y="59" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><circle cx="259" cy="120" r="30" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="259" y="129" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><circle cx="259" cy="260" r="30" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="259" y="269" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><circle cx="380" cy="330" r="30" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="380" y="339" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><circle cx="501" cy="260" r="30" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="501" y="269" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><circle cx="501" cy="120" r="30" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="501" y="129" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><circle cx="1100" cy="50" r="30" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1100" y="59" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><circle cx="967" cy="147" r="30" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="967" y="156" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><circle cx="1018" cy="303" r="30" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1018" y="312" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><circle cx="1182" cy="303" r="30" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1182" y="312" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><circle cx="1233" cy="147" r="30" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1233" y="156" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><circle cx="1100" cy="190" r="30" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="1100" y="199" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Đ</text><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="380" y="385" fill="#eb6834">ngang hàng: 15 cặp, mỗi cặp 2 chiều = 30 kênh</text><text x="1100" y="385" fill="#2a78d6">qua điều phối Đ: 5 tác tử, mỗi người 2 chiều = 10 kênh</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình bên trái vẽ 6 tác tử ngang hàng, mỗi đường cam nối một cặp, có 15 cặp, và mỗi cặp nói được hai chiều nên có 30 kênh, rối như mạng nhện. Hình bên phải là một ngôi sao, tác tử điều phối Đ ở giữa và 5 tác tử làm việc xung quanh. Mỗi tác tử chỉ có một đường tới Đ, đi và về là 2 kênh, tổng cộng 10 kênh. Đổi lại, mọi tin nhắn đều đi qua Đ, nên Đ là chỗ dễ nghẽn nhất."

  - id: example
    kind: example
    title: "Đếm kênh và mất mát qua chuyển giao"
    checks:
      - "[alg.comm_channels(n, t) for n in (3, 6) for t in ('full', 'hub')] == [6, 4, 30, 10]"
      - "[round(0.9 ** h, 3) for h in (1, 3, 5)] == [0.9, 0.729, 0.59]"
    steps:
      - show: |
          <p><b>Bước 1 — ngang hàng, 6 tác tử:</b> mỗi tác tử gửi cho 5 người còn lại → $6 \cdot 5 = \hl{30}$ kênh.</p>
        say: "Bước một, kiểu ngang hàng với 6 tác tử. Mỗi tác tử gửi được cho 5 người còn lại, vì không ai tự nhắn cho mình, nên có 6 nhân 5, bằng 30 kênh."
      - show: |
          <p><b>Bước 2 — qua điều phối:</b> 5 tác tử làm việc, mỗi người 1 kênh tới điều phối và 1 kênh về → $2 \cdot 5 = \hl{10}$ kênh.</p>
        say: "Bước hai, kiểu điều phối tập trung, ngoài tác tử điều phối còn 5 tác tử làm việc. Mỗi người có một kênh gửi tới điều phối và một kênh nhận về, nên có 2 nhân 5, bằng 10 kênh."
      - show: |
          <table class="t"><tr><th>số tác tử</th><th>ngang hàng</th><th>điều phối</th><th>gấp</th></tr>
          <tr><td>3</td><td>6</td><td>4</td><td>1,5 lần</td></tr>
          <tr><td>6</td><td>$\hl{30}$</td><td>10</td><td>3 lần</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước ba, đặt hai cỡ đội cạnh nhau. Với 3 tác tử, ngang hàng có 6 kênh, điều phối có 4, chỉ gấp 1 phẩy 5 lần. Với 6 tác tử, ngang hàng có 30 kênh, điều phối có 10, đã gấp 3 lần, vì số kênh ngang hàng tăng gần theo bình phương số tác tử."
      - clear: true
        show: |
          <p><b>Bước 4 — mất mát qua chuyển giao</b> (số minh hoạ: mỗi lần chuyển giữ 90% chi tiết cần thiết):</p>
          <table class="t"><tr><th>số lần chuyển</th><th>phép tính</th><th>còn lại</th></tr>
          <tr><td>1</td><td>$0{,}9$</td><td>0,9</td></tr>
          <tr><td>3</td><td>$0{,}9^3$</td><td>$\approx \hl{0{,}729}$</td></tr>
          <tr><td>5</td><td>$0{,}9^5$</td><td>≈ 0,59</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, tính mất mát qua chuyển giao với một số minh hoạ, mỗi lần chuyển bản tóm tắt giữ được 90 phần trăm chi tiết cần thiết. Qua 1 lần còn 0 phẩy 9. Qua 3 lần còn 0 phẩy 9 mũ 3, khoảng 0 phẩy 729. Qua 5 lần chỉ còn khoảng 0 phẩy 59, mất gần một nửa."
      - show: |
          <div class="box key">Vì vậy: chuyển giao bằng <b>dữ liệu có cấu trúc</b> (danh sách yêu cầu, tệp, đường dẫn) thay vì kể lại bằng lời, và giữ số lần chuyển ít nhất có thể.</div>
        say: "Bước năm, rút ra cách làm. Hãy chuyển giao bằng dữ liệu có cấu trúc, như danh sách yêu cầu, tệp hay đường dẫn, thay vì kể lại bằng lời, và giữ số lần chuyển giao ít nhất có thể."

  - id: check
    kind: check
    title: "Tự kiểm: đếm theo cặp và đếm từ phía điều phối"
    checks:
      - "math.comb(6, 2) == 15 and 2 * math.comb(6, 2) == 30 == len(list(__import__('itertools').permutations(range(6), 2))) == alg.comm_channels(6, 'full')"
      - "5 + 5 == 10 == alg.comm_channels(6, 'hub') and round(0.81 * 0.9, 3) == 0.729"
    steps:
      - show: |
          <table class="t"><tr><th>cách đếm khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>ngang hàng: đếm cặp như bắt tay, rồi nhân 2 chiều</td><td>15 cặp $\cdot$ 2</td><td>30 ✓</td></tr>
          <tr><td>điều phối: đứng ở Đ, đếm tin gửi đi và nhận về</td><td>5 + 5</td><td>10 ✓</td></tr>
          <tr><td>mất mát: nhân dần từng lần</td><td>0,9 → 0,81 → 0,729</td><td>0,729 ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, đếm theo cách thứ hai cho từng kết quả. Với kiểu ngang hàng, ta đếm cặp như đếm số cái bắt tay, 6 người có 15 cái bắt tay. Mỗi cặp nói được hai chiều nên nhân 2, ra 30, khớp. Với điều phối, ta đứng ở Đ, đếm 5 tin gửi đi và 5 tin nhận về, ra 10, khớp. Với mất mát, nhân dần từng lần, 0 phẩy 9, rồi 0 phẩy 81, rồi 0 phẩy 729, cũng khớp."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "[round(0.9 ** h, 3) for h in (2, 3, 4)] == [0.81, 0.729, 0.656]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thêm tác tử để “thông minh hơn” <b class="red">(chỉ đắt hơn)</b>
          <br><span class="note">Nhiều tác tử cùng một mô hình, cùng thông tin, không chắc giỏi hơn một tác tử làm cẩn thận: M. Cemri và cộng sự (2025) ghi rằng trên các bộ bài thử phổ biến, hệ nhiều tác tử thường chỉ hơn một tác tử đơn rất ít. Chỉ chia vai khi có lý do: song song, ngữ cảnh riêng, quyền riêng.</span></div>
        say: "Lỗi thứ nhất, thêm tác tử để thông minh hơn, trong khi có thể chỉ đắt hơn. Nhiều tác tử cùng một mô hình và cùng thông tin không chắc giỏi hơn một tác tử làm cẩn thận. Một nghiên cứu năm 2025 ghi rằng trên các bộ bài thử phổ biến, hệ nhiều tác tử thường chỉ hơn một tác tử đơn rất ít. Chỉ chia vai khi có lý do, như chạy song song, cần ngữ cảnh riêng, hay quyền riêng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không ai chịu trách nhiệm kết quả cuối <b class="red">(lỗi rơi vào khe hở)</b>
          <br><span class="note">Người viết nghĩ người kiểm sẽ bắt lỗi, người kiểm nghĩ người viết đã chắc chắn. Mỗi kết quả cần một tác tử chịu trách nhiệm và một phép kiểm chạy được.</span></div>
        say: "Lỗi thứ hai, không ai chịu trách nhiệm kết quả cuối, nên lỗi rơi vào khe hở. Người viết nghĩ người kiểm sẽ bắt lỗi, người kiểm nghĩ người viết đã chắc chắn. Mỗi kết quả cần một tác tử chịu trách nhiệm và một phép kiểm chạy được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Để các tác tử nói chuyện không giới hạn <b class="red">(vòng lặp lịch sự)</b>
          <br><span class="note">Hai tác tử có thể khen nhau, xin lỗi nhau mãi. Đặt giới hạn số lượt, định dạng tin nhắn, và điều kiện kết thúc do điều phối quyết.</span></div>
        say: "Lỗi thứ ba, để các tác tử nói chuyện không giới hạn, nên rơi vào vòng lặp lịch sự. Hai tác tử có thể khen nhau và xin lỗi nhau mãi. Hãy đặt giới hạn số lượt, định dạng tin nhắn, và điều kiện kết thúc do tác tử điều phối quyết định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Vẽ hệ tác tử như sơ đồ tổ chức nhiều tầng <b class="red">(mỗi tầng một lần chuyển giao)</b>
          <br><span class="note">Người đã đi làm hay thêm “trưởng nhóm” giữa điều phối và người làm cho giống công ty thật. Mỗi tầng thêm một lần kể lại yêu cầu. Chuyên gia giữ sơ đồ <b>ít tầng</b>, và chuyển nguyên văn yêu cầu gốc xuống người làm.</span></div>
          <table class="t"><tr><th>cách tổ chức</th><th>số lần chuyển tới người làm</th><th>chi tiết còn lại (90% mỗi lần)</th></tr>
          <tr><td>người dùng → điều phối → người làm</td><td>2</td><td>0,81</td></tr>
          <tr><td>thêm một tầng trưởng nhóm</td><td>3</td><td>0,729</td></tr>
          <tr><td>thêm hai tầng</td><td>4</td><td>$\approx \hl{0{,}656}$</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, vẽ hệ tác tử như một sơ đồ tổ chức nhiều tầng. Họ thêm tác tử trưởng nhóm đứng giữa điều phối và người làm, cho giống một công ty thật. Nhưng mỗi tầng là thêm một lần kể lại yêu cầu, nên chuyên gia giữ sơ đồ thật ít tầng, và chuyển nguyên văn yêu cầu gốc xuống người làm. Bảng tính với cùng số minh hoạ 90 phần trăm. Người dùng tới điều phối rồi tới người làm là 2 lần chuyển, còn 0 phẩy 81. Thêm một tầng trưởng nhóm thì còn 0 phẩy 729. Thêm hai tầng thì chỉ còn khoảng 0 phẩy 656."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.comm_channels(10, 'full') == 90 and alg.comm_channels(10, 'hub') == 18 and round(0.95 ** 4, 3) == 0.815"
      - "round(0.95 ** 2, 4) == 0.9025 and round(0.9025 ** 2, 3) == 0.815 and round(0.95 ** 3, 3) == 0.857 and 90 // 18 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>10 tác tử: bao nhiêu kênh ngang hàng, bao nhiêu kênh qua điều phối?</td></tr>
          <tr><td>2</td><td>Mỗi lần chuyển giao giữ 95% chi tiết. Một yêu cầu đi qua 4 lần chuyển trước khi tới người làm. Còn bao nhiêu phần trăm? Có nên bỏ bớt một tầng?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với 10 tác tử, có bao nhiêu kênh ngang hàng, và bao nhiêu kênh qua điều phối? Câu hai, mỗi lần chuyển giao giữ 95 phần trăm chi tiết. Một yêu cầu đi qua 4 lần chuyển trước khi tới người làm, còn bao nhiêu phần trăm? Có nên bỏ bớt một tầng? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Ngang hàng: mỗi tác tử gửi cho 9 người còn lại, $10 \cdot 9 = \hl{90}$ kênh.</p>
          <p>Điều phối: 9 tác tử làm việc, mỗi người đi và về, $2 \cdot 9 = 18$ kênh — ít hơn 5 lần.</p>
        focus: [1, 2]
        say: "Đáp án câu một, kiểu ngang hàng, mỗi tác tử gửi cho 9 người còn lại, nên có 10 nhân 9, bằng 90 kênh. Kiểu điều phối có 9 tác tử làm việc, mỗi người một kênh đi và một kênh về, nên có 2 nhân 9, bằng 18 kênh, ít hơn 5 lần."
      - show: |
          <p>② Nhân dần: $0{,}95^2 = 0{,}9025$, rồi $0{,}9025^2 \approx \hl{0{,}815}$ — gần một phần năm chi tiết đã mất.</p>
          <p>Bỏ một tầng còn 3 lần chuyển: $0{,}95^3 \approx 0{,}857$ → <b>nên bỏ</b>, nếu tầng đó không thêm phép kiểm nào.</p>
        focus: [1, 2, 2]
        say: "Câu hai, nhân dần cho dễ, 0 phẩy 95 bình phương bằng 0 phẩy 9025, bình phương tiếp được khoảng 0 phẩy 815, tức gần một phần năm chi tiết đã mất. Nếu bỏ một tầng, còn 3 lần chuyển, giữ được khoảng 0 phẩy 857. Vậy nên bỏ tầng đó, trừ khi tầng ấy thêm được một phép kiểm thật sự."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chia vai khi có lý do</span><span class="a">→</span>
          <span class="n">điều phối: 2(n − 1) kênh thay vì n(n − 1)</span><span class="a">→</span>
          <span class="n">chuyển giao bằng dữ liệu có cấu trúc</span><span class="a">→</span>
          <span class="n">một người chịu trách nhiệm, giới hạn số lượt</span></div>
        say: "Tổng kết lại, chỉ chia vai khi có lý do. Điều phối tập trung cần 2 nhân n trừ 1 kênh thay vì n nhân n trừ 1. Chuyển giao bằng dữ liệu có cấu trúc, có một người chịu trách nhiệm, và giới hạn số lượt."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi lần chuyển giao là một lần <b>có thể hiểu sai</b> — thiết kế hệ nhiều tác tử như thiết kế một tổ chức, không phải như chép thêm người.</div>
        say: "Điều cần mang theo, mỗi lần chuyển giao là một lần có thể hiểu sai, nên hãy thiết kế hệ nhiều tác tử như thiết kế một tổ chức, không phải như chép thêm người."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>đánh giá tác tử</b> — thành công nhiệm vụ, pass@k và pass^k.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học đánh giá tác tử, với tỉ lệ thành công nhiệm vụ, thành công ít nhất một lần và thành công mọi lần. Hẹn gặp bạn ở bài tiếp theo."
