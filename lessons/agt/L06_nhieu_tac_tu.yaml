# Quy ước: kênh một chiều giữa n tác tử: trao đổi mọi cặp n(n − 1); qua một tác tử điều phối 2(n − 1) (alg.comm_channels).
#   Mỗi lần chuyển giao giữ được q phần thông tin cần thiết, độc lập: sau h lần còn q^h — SỐ MINH HOẠ để thấy mất mát tích lũy.
objectives:
  - "So sánh điều phối tập trung và trao đổi ngang hàng"
  - "Đếm chi phí giao tiếp"
  - "Thấy mất mát thông tin qua chuyển giao"
