id: L00
course: AGT
series: "AGT · AI agent"
title: "Bài 0 — Từ mô hình ngôn ngữ tới tác tử: vòng lặp quan sát, suy nghĩ, hành động"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L00; audit/agt/verify_agt.py L00; S. Yao và cộng sự, ReAct: Synergizing Reasoning and Acting in Language Models, ICLR (2023); AIF bài 0 (tác tử, môi trường); LLM bài 7 (sinh văn bản)"
assumes: [arith, power, approx]
# Quy ước: mỗi bước đúng với xác suất p ĐỘC LẬP; nhiệm vụ n bước thành công khi mọi bước đúng: p^n (alg.chain_success). Thử lại khi PHÁT HIỆN được lỗi
#   (giả định phát hiện chắc chắn, các lần thử độc lập): (1 − (1 − p)^t)^n (alg.chain_with_retry). Tên ReAct chỉ trên màn hình.
objectives:
  - "Mô tả vòng lặp tác tử và điều kiện dừng"
  - "Tính sai số tích lũy qua nhiều bước"
  - "Thấy giá trị của việc phát hiện lỗi để thử lại"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mỗi bước đúng 95%, cả việc chỉ đúng 36%"
    checks:
      - "round(alg.chain_success(0.95, 20), 3) == 0.358"
    steps:
      - show: |
          <p>Một trợ lý tự đặt vé: tìm chuyến bay, so giá, điền tên, chọn ghế, thanh toán, gửi xác nhận… tổng cộng 20 bước. Mỗi bước nó làm đúng 95% — nghe rất tốt. Nhưng cả 20 bước cùng đúng chỉ khoảng <b>35,8%</b>.</p>
          <div class="box key">Hôm nay: <b>tác tử dùng mô hình ngôn ngữ</b> — vòng lặp quan sát, suy nghĩ, hành động; vì sao sai số <b>tích lũy</b>, và cách giữ cho nó không tích lũy.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một trợ lý tự đặt vé, gồm tìm chuyến bay, so giá, điền tên, chọn ghế, thanh toán, gửi xác nhận, tổng cộng 20 bước. Mỗi bước nó làm đúng 95 phần trăm, nghe rất tốt. Nhưng cả 20 bước cùng đúng chỉ khoảng 35 phẩy 8 phần trăm. Hôm nay ta học tác tử dùng mô hình ngôn ngữ, với vòng lặp quan sát, suy nghĩ, hành động, vì sao sai số tích lũy, và cách giữ cho nó không tích lũy."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: nhân xác suất của các việc độc lập"
    checks:
      - "0.5 * 0.5 == 0.25 and round(0.9 ** 2, 2) == 0.81 and round(0.9 ** 3, 3) == 0.729"
      - "round(1 - 0.95, 2) == 0.05 and round(0.05 ** 2, 4) == 0.0025"
    steps:
      - show: |
          <p>Tung một đồng xu hai lần. Lần nào cũng ra mặt ngửa với xác suất $0{,}5$, và hai lần <b>không ảnh hưởng nhau</b> (độc lập). Cả hai lần cùng ngửa: $0{,}5 \times 0{,}5 = \hl{0{,}25}$.</p>
          <table class="t"><tr><th>số việc liên tiếp, mỗi việc đúng 0,9</th><th>cả chuỗi cùng đúng</th></tr>
          <tr><td>2</td><td>$0{,}9^2 = 0{,}81$</td></tr>
          <tr><td>3</td><td>$0{,}9^3 = 0{,}729$</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn cách nhân xác suất của những việc độc lập, tức là việc này không ảnh hưởng việc kia. Tung đồng xu hai lần, mỗi lần ngửa với xác suất 0 phẩy 5, nên cả hai lần cùng ngửa là 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Hai việc liên tiếp, mỗi việc đúng 0 phẩy 9, thì cả hai cùng đúng là 0 phẩy 9 bình phương, bằng 0 phẩy 81. Ba việc như vậy thì là 0 phẩy 9 mũ 3, bằng 0 phẩy 729, cứ thêm một việc là nhân thêm một lần."
      - show: |
          <p>Xác suất <b>sai</b> bằng 1 trừ xác suất đúng: bước đúng $0{,}95$ thì sai $1 - 0{,}95 = 0{,}05$. Sai <b>hai lần liền</b> (hai lần thử độc lập): $0{,}05^2 = 0{,}0025$.</p>
        say: "Điều thứ hai, xác suất sai bằng 1 trừ xác suất đúng, nên một bước đúng 0 phẩy 95 thì sai 0 phẩy 05. Nếu thử hai lần độc lập mà lần nào cũng sai, xác suất là 0 phẩy 05 bình phương, bằng 0 phẩy 0025, rất nhỏ."

  - id: sym
    kind: symbol
    title: "Giải mã: vòng lặp tác tử"
    steps:
      - show: |
          <div class="chain"><span class="n">quan sát (kết quả công cụ, lời người dùng)</span><span class="a">→</span><span class="n">suy nghĩ (mô hình viết bước tiếp theo)</span><span class="a">→</span><span class="n">hành động (gọi công cụ hoặc trả lời)</span><span class="a">→</span><span class="n">quan sát mới…</span></div>
          <table class="t"><tr><th>thành phần</th><th>vai trò</th></tr>
          <tr><td>mô hình ngôn ngữ</td><td>chọn hành động tiếp theo từ toàn bộ lịch sử trong ngữ cảnh</td></tr>
          <tr><td>công cụ</td><td>chương trình bên ngoài: tìm kiếm, đọc tệp, gọi API, chạy mã</td></tr>
          <tr><td>điều kiện dừng</td><td>đạt mục tiêu, hết ngân sách bước / tiền, hoặc cần người dùng quyết định</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Vòng lặp đi từ quan sát, như kết quả công cụ hay lời người dùng, sang suy nghĩ, khi mô hình viết ra bước tiếp theo. Sau đó là hành động, gọi công cụ hoặc trả lời, và lại có quan sát mới. Bảng ghi ba thành phần. Mô hình ngôn ngữ chọn hành động tiếp theo từ toàn bộ lịch sử trong ngữ cảnh. Công cụ là chương trình bên ngoài như tìm kiếm, đọc tệp, gọi giao diện lập trình, hay chạy mã. Điều kiện dừng là đạt mục tiêu, hết ngân sách bước hay tiền, hoặc cần người dùng quyết định."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vòng lặp, và cái giá của mỗi vòng"
    checks:
      - "[round(0.95 ** n, 3) for n in (0, 10, 20)] == [1.0, 0.599, 0.358] and round(0.99 ** 20, 3) == 0.818 and round(0.9975 ** 20, 3) == 0.951"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><defs><marker id="arA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="120" y="40" width="330" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="285" y="82" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">QUAN SÁT</text><text x="285" y="118" font-size="20" text-anchor="middle" fill="#1f2937">lời người dùng, kết quả công cụ</text><rect x="585" y="40" width="330" height="110" rx="14" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="750" y="82" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">SUY NGHĨ</text><text x="750" y="118" font-size="20" text-anchor="middle" fill="#1f2937">mô hình viết bước tiếp theo</text><rect x="1050" y="40" width="330" height="110" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1215" y="82" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">HÀNH ĐỘNG</text><text x="1215" y="118" font-size="20" text-anchor="middle" fill="#1f2937">gọi công cụ</text><rect x="585" y="250" width="330" height="110" rx="14" fill="#fee2e2" stroke="#1f2937" stroke-width="3"/><text x="750" y="292" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">DỪNG</text><text x="750" y="328" font-size="20" text-anchor="middle" fill="#1f2937">xong, hết ngân sách, hỏi người</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="452" y1="95" x2="580" y2="95" marker-end="url(#arA0)"/><line x1="917" y1="95" x2="1045" y2="95" marker-end="url(#arA0)"/><line x1="750" y1="152" x2="750" y2="245" marker-end="url(#arA0)" stroke="#b91c1c"/><path d="M1215,152 C1215,230 1100,215 1000,215 L500,215 C380,215 285,230 285,155" marker-end="url(#arA0)" stroke="#2a78d6"/></g><g font-size="20" fill="#1f2937"><text x="1230" y="200" fill="#2a78d6">kết quả quay về</text><text x="770" y="240" fill="#b91c1c">điều kiện dừng?</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ vòng lặp của tác tử. Nó quan sát lời người dùng hay kết quả công cụ, rồi mô hình suy nghĩ và viết ra bước tiếp theo, rồi hành động bằng cách gọi một công cụ. Kết quả của công cụ quay về thành quan sát mới, theo mũi tên xanh, và vòng lặp chạy tiếp. Mỗi lần suy nghĩ, tác tử phải hỏi điều kiện dừng, theo mũi tên đỏ: đã xong chưa, còn ngân sách không, có cần hỏi người dùng không."
      - clear: true
        show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><g fill="#1f2937"><line x1="200" y1="300" x2="1230" y2="300" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="300" x2="200" y2="30" stroke="#6b7280" stroke-width="2"/><polyline points="200,50.0 250,52.5 300,55.0 350,57.4 400,59.9 450,62.3 500,64.6 550,67.0 600,69.3 650,71.6 700,73.9 750,76.2 800,78.4 850,80.6 900,82.8 950,85.0 1000,87.1 1050,89.3 1100,91.4 1150,93.5 1200,95.5" fill="none" stroke="#2a78d6" stroke-width="4"/><polyline points="200,50.0 250,62.5 300,74.4 350,85.7 400,96.4 450,106.6 500,116.2 550,125.4 600,134.1 650,142.4 700,150.3 750,157.8 800,164.9 850,171.7 900,178.1 950,184.2 1000,190.0 1050,195.5 1100,200.7 1150,205.7 1200,210.4" fill="none" stroke="#b91c1c" stroke-width="4"/><polyline points="200,50.0 250,50.6 300,51.2 350,51.9 400,52.5 450,53.1 500,53.7 550,54.3 600,55.0 650,55.6 700,56.2 750,56.8 800,57.4 850,58.0 900,58.6 950,59.2 1000,59.8 1050,60.4 1100,61.0 1150,61.6 1200,62.2" fill="none" stroke="#059669" stroke-width="4"/><circle cx="1200" cy="210.4" r="9" fill="#b91c1c"/><circle cx="1200" cy="95.5" r="9" fill="#2a78d6"/><circle cx="1200" cy="62.2" r="9" fill="#059669"/><g font-size="22"><text x="1225" y="56" fill="#059669">95%, thử lại 2 lần: 0,951</text><text x="1225" y="118" fill="#2a78d6">99%: 0,818</text><text x="1225" y="218" fill="#b91c1c">95%: 0,358</text><text x="200" y="330" text-anchor="middle">0</text><text x="700" y="330" text-anchor="middle">10</text><text x="1200" y="330" text-anchor="middle">20 bước</text><text x="185" y="58" text-anchor="end">1</text><text x="185" y="305" text-anchor="end">0</text><text x="215" y="25">xác suất cả nhiệm vụ hoàn thành</text></g></g></svg></div>
        focus: [1, 1, 1]
        say: "Mỗi vòng đi qua là một lần có thể sai, nên xác suất hoàn thành tụt dần theo số bước. Đường đỏ, mỗi bước đúng 95 phần trăm, rơi từ 1 xuống khoảng 0 phẩy 6 sau 10 bước, và 0 phẩy 358 sau 20 bước. Đường xanh lá cũng là 95 phần trăm, nhưng sai thì phát hiện được và thử lại, nên gần như nằm ngang."

  - id: example
    kind: example
    title: "Sai số tích lũy và giá trị của việc phát hiện lỗi"
    checks:
      - "[round(alg.chain_success(p, 20), 3) for p in (0.95, 0.99)] == [0.358, 0.818]"
      - "[round(alg.chain_with_retry(0.95, 20, t), 3) for t in (2, 3)] == [0.951, 0.998]"
    steps:
      - show: |
          <p><b>Bước 1 — mỗi bước đúng 95%, 20 bước:</b> nhân 20 lần $0{,}95$. Tính hai nửa: $0{,}95^{10} \approx 0{,}599$, rồi $0{,}599^2 \approx 0{,}358$. Vậy $0{,}95^{20} \approx \hl{0{,}358}$.</p>
        say: "Bước một, mỗi bước đúng 95 phần trăm, nhiệm vụ 20 bước, ta nhân 20 lần 0 phẩy 95. Tính hai nửa cho dễ, 0 phẩy 95 mũ 10 xấp xỉ 0 phẩy 599, rồi bình phương lên, được khoảng 0 phẩy 358, tức là hơn một phần ba một chút."
      - show: |
          <p><b>Bước 2 — mỗi bước đúng 99%:</b> $0{,}99^{20} \approx \hl{0{,}818}$. Sai mỗi bước giảm từ 5% xuống 1%, nhiệm vụ lên từ 36% tới 82%.</p>
        say: "Bước hai, nếu mỗi bước đúng 99 phần trăm thì 0 phẩy 99 mũ 20 xấp xỉ 0 phẩy 818. Sai mỗi bước giảm từ 5 phần trăm xuống 1 phần trăm, mà nhiệm vụ đi từ 36 lên 82 phần trăm, vì sai số bị nhân lên 20 lần."
      - show: |
          <p><b>Bước 3 — vẫn 95%, nhưng phát hiện lỗi và thử lại tối đa 2 lần:</b> một bước chỉ hỏng khi sai cả hai lần, $0{,}05^2 = 0{,}0025$; bước đó đúng $1 - 0{,}0025 = 0{,}9975$; cả nhiệm vụ $0{,}9975^{20} \approx \hl{0{,}951}$.</p>
        say: "Bước ba, mỗi bước vẫn chỉ đúng 95 phần trăm, nhưng sai thì phát hiện được và thử lại, tối đa 2 lần. Một bước chỉ hỏng khi sai cả hai lần, xác suất 0 phẩy 05 bình phương, bằng 0 phẩy 0025. Vậy mỗi bước đúng 0 phẩy 9975, và cả nhiệm vụ là 0 phẩy 9975 mũ 20, xấp xỉ 0 phẩy 951."
      - clear: true
        show: |
          <p><b>Bước 4 — thử lại tối đa 3 lần:</b> bước hỏng $0{,}05^3 = 0{,}000125$; cả nhiệm vụ $\approx \hl{0{,}998}$.</p>
          <table class="t"><tr><th>nhiệm vụ 20 bước</th><th>xác suất hoàn thành</th></tr>
          <tr><td>95%, không thử lại</td><td>0,358</td></tr><tr><td>99%, không thử lại</td><td>0,818</td></tr>
          <tr><td>95%, thử lại tối đa 2 lần</td><td>0,951</td></tr><tr><td>95%, thử lại tối đa 3 lần</td><td>0,998</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước bốn, cho thử lại tối đa 3 lần thì một bước chỉ hỏng với xác suất 0 phẩy 05 mũ 3, bằng 0 phẩy 000125, và cả nhiệm vụ xấp xỉ 0 phẩy 998. Bảng đặt bốn kết quả cạnh nhau. Không thử lại, 95 phần trăm cho 0 phẩy 358. Không thử lại, 99 phần trăm cho 0 phẩy 818. Thử lại tối đa 2 lần cho 0 phẩy 951. Thử lại tối đa 3 lần thì được 0 phẩy 998."
      - show: |
          <div class="box key">Thử lại chỉ giúp được khi <b>biết</b> bước đó sai: công cụ báo lỗi, phép kiểm tự động, kết quả đối chiếu được. Không phát hiện được thì thử lại không xảy ra, và ta quay về 0,358.</div>
        say: "Bước năm, rút ra điều kiện. Thử lại chỉ giúp được khi biết bước đó sai, nhờ công cụ báo lỗi, phép kiểm tự động, hay kết quả đối chiếu được. Nếu không phát hiện được lỗi thì sẽ không có lần thử lại nào, và ta quay về con số 0 phẩy 358."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê ca nhỏ và chặn dưới"
    checks:
      - "(lambda P: abs(P[('Đ', 'Đ')] - 0.9025) < 1e-12 and abs(P[('Đ', 'S')] - 0.0475) < 1e-12 and abs(P[('S', 'S')] - 0.0025) < 1e-12 and abs(sum(P.values()) - 1) < 1e-12 and abs(P[('Đ', 'Đ')] - alg.chain_success(0.95, 2)) < 1e-12)({o: math.prod(0.95 if x == 'Đ' else 0.05 for x in o) for o in __import__('itertools').product('ĐS', repeat=2)})"
      - "round(20 * 0.05 ** 2, 4) == 0.05 and round(1 - 20 * 0.05 ** 2, 4) == 0.95 and alg.chain_with_retry(0.95, 20, 2) >= 0.95"
    steps:
      - show: |
          <p><b>Cách 1 — liệt kê hết ca nhỏ</b>, nhiệm vụ 2 bước, mỗi bước đúng 0,95 (Đ = đúng, S = sai):</p>
          <table class="t"><tr><th>kết cục</th><th>xác suất</th><th>hoàn thành?</th></tr>
          <tr><td>Đ, Đ</td><td>$0{,}95 \times 0{,}95 = 0{,}9025$</td><td>có</td></tr>
          <tr><td>Đ, S hoặc S, Đ</td><td>$0{,}0475$ mỗi ca</td><td>không</td></tr>
          <tr><td>S, S</td><td>$0{,}0025$</td><td>không</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng đường khác, cách thứ nhất là liệt kê hết các kết cục của một nhiệm vụ nhỏ hai bước, mỗi bước đúng 0 phẩy 95. Cả hai bước đúng có xác suất 0 phẩy 9025, đó là ca duy nhất hoàn thành, vì nhiệm vụ cần mọi bước đúng. Đúng một bước, sai một bước có hai ca, mỗi ca 0 phẩy 0475. Sai cả hai thì 0 phẩy 0025, và bốn ca cộng lại vừa đúng bằng 1, khớp với công thức 0 phẩy 95 bình phương."
      - show: |
          <p><b>Cách 2 — chặn dưới cho ca thử lại</b> (cộng xác suất hỏng của từng bước):</p>
          <table class="t"><tr><th>đại lượng</th><th>giá trị</th></tr>
          <tr><td>mỗi bước hỏng (sai cả 2 lần thử)</td><td>0,0025</td></tr>
          <tr><td>có ít nhất một bước hỏng trong 20 bước</td><td>không quá $20 \times 0{,}0025 = 0{,}05$</td></tr>
          <tr><td>hoàn thành</td><td>ít nhất $1 - 0{,}05 = 0{,}95$ ✓ khớp 0,951</td></tr></table>
        focus: ["2.2", "2.3", "2.4"]
        say: "Cách thứ hai dùng một chặn dưới đơn giản cho ca thử lại. Mỗi bước hỏng với xác suất 0 phẩy 0025, nên xác suất có ít nhất một bước hỏng trong 20 bước không vượt quá 20 nhân 0 phẩy 0025, bằng 0 phẩy 05. Vậy nhiệm vụ hoàn thành với xác suất ít nhất 0 phẩy 95, khớp với con số 0 phẩy 951 đã tính."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "round(1 - 0.95 ** 20, 3) == 0.642 and round(1 - (1 - alg.chain_success(0.95, 20)) ** 3, 3) == 0.736 and 3 * 20 == 60 and 2 * 20 == 40"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không đặt điều kiện dừng <b class="red">(lặp mãi, tốn tiền)</b>
          <br><span class="note">Tác tử không tìm được đáp án có thể gọi công cụ hàng trăm lần. Luôn có giới hạn số bước, thời gian, chi phí, và đường thoát “hỏi người dùng”.</span></div>
        say: "Lỗi thứ nhất, không đặt điều kiện dừng, nên tác tử lặp mãi và tốn tiền. Tác tử không tìm được đáp án có thể gọi công cụ hàng trăm lần. Luôn có giới hạn số bước, thời gian, chi phí, và một đường thoát là hỏi người dùng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đo theo từng bước thay vì theo nhiệm vụ <b class="red">(lạc quan giả)</b>
          <br><span class="note">“95% bước đúng” nghe tốt nhưng chỉ 36% nhiệm vụ 20 bước hoàn thành. Báo cáo tỉ lệ <b>nhiệm vụ</b> thành công trên bộ việc thật.</span></div>
        say: "Lỗi thứ hai, đo theo từng bước thay vì theo nhiệm vụ, một sự lạc quan giả. 95 phần trăm bước đúng nghe tốt, nhưng chỉ 36 phần trăm nhiệm vụ 20 bước hoàn thành. Hãy báo cáo tỉ lệ nhiệm vụ thành công trên bộ việc thật."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cho hành động không đảo ngược được chạy giữa chừng <b class="red">(sai không sửa được)</b>
          <br><span class="note">Thanh toán, xoá, gửi đi là không thu hồi được. Đặt các hành động này cuối cùng, sau bước kiểm tra, và cần người dùng xác nhận.</span></div>
        say: "Lỗi thứ ba, cho hành động không đảo ngược được chạy giữa chừng, nên sai thì không sửa được. Thanh toán, xoá hay gửi đi là không thu hồi được. Hãy đặt các hành động này cuối cùng, sau bước kiểm tra, và cần người dùng xác nhận."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Hỏng thì chạy lại <b>cả nhiệm vụ</b> từ đầu <b class="red">(tốn gấp ba, vẫn kém)</b>
          <br><span class="note">Người đã đi làm hay bọc cả tác tử trong một vòng “thử lại 3 lần”. Mỗi lần chạy chỉ thành công 0,358, nên 3 lần cũng chỉ $1 - 0{,}642^3 \approx 0{,}736$. Chuyên gia thử lại <b>ở bước hỏng</b>, nơi lỗi được phát hiện.</span></div>
          <table class="t"><tr><th>cách thử lại</th><th>tối đa số bước chạy</th><th>xác suất hoàn thành</th></tr>
          <tr><td>chạy lại cả nhiệm vụ, tối đa 3 lần</td><td>60</td><td>0,736</td></tr>
          <tr><td>thử lại từng bước, tối đa 2 lần</td><td>40</td><td>$\hl{0{,}951}$</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, hỏng thì chạy lại cả nhiệm vụ từ đầu. Họ bọc cả tác tử trong một vòng thử lại 3 lần, vì cách đó dễ viết nhất. Nhưng mỗi lần chạy chỉ thành công 0 phẩy 358, nên sau 3 lần cũng chỉ được 1 trừ 0 phẩy 642 mũ 3, xấp xỉ 0 phẩy 736. Bảng so hai cách. Chạy lại cả nhiệm vụ tốn tới 60 bước mà chỉ được 0 phẩy 736. Thử lại ngay ở bước hỏng tốn tối đa 40 bước mà được 0 phẩy 951, nên chuyên gia đặt phép kiểm và thử lại ở từng bước."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.chain_success(0.9, 10), 3) == 0.349 and round(alg.chain_with_retry(0.9, 10, 2), 3) == 0.904"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nhiệm vụ 10 bước, mỗi bước đúng 90%. Xác suất hoàn thành?</td></tr>
          <tr><td>2</td><td>Nếu phát hiện được lỗi ở mọi bước và thử lại tối đa 2 lần thì sao? Nên làm cách nào?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nhiệm vụ 10 bước, mỗi bước đúng 90 phần trăm, xác suất hoàn thành là bao nhiêu? Câu hai, nếu phát hiện được lỗi ở mọi bước và thử lại tối đa 2 lần thì sao? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Mười bước độc lập, mỗi bước đúng 0,9: nhân 10 lần, $0{,}9^{10} \approx \hl{0{,}349}$ — chưa tới 35%.</p>
        say: "Đáp án câu một, mười bước độc lập, mỗi bước đúng 0 phẩy 9, ta nhân 10 lần 0 phẩy 9, được xấp xỉ 0 phẩy 349, tức là chưa tới 35 phần trăm."
      - show: |
          <p>② Một bước chỉ hỏng khi sai cả hai lần: $0{,}1^2 = 0{,}01$; bước đó đúng $0{,}99$.</p>
          <p>Cả nhiệm vụ: $0{,}99^{10} \approx \hl{0{,}904}$ → nên đầu tư vào <b>phát hiện lỗi</b> ở từng bước, xác suất tăng từ 0,349 lên 0,904.</p>
        focus: [1, 2, 2]
        say: "Câu hai, một bước chỉ hỏng khi sai cả hai lần, với xác suất 0 phẩy 1 bình phương, bằng 0 phẩy 01, nên mỗi bước đúng 0 phẩy 99. Cả nhiệm vụ là 0 phẩy 99 mũ 10, xấp xỉ 0 phẩy 904. Vậy quyết định đúng là đầu tư vào phát hiện lỗi ở từng bước, vì xác suất tăng từ 0 phẩy 349 lên 0 phẩy 904."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quan sát → suy nghĩ → hành động</span><span class="a">→</span>
          <span class="n">sai số nhân lên theo số bước</span><span class="a">→</span>
          <span class="n">phát hiện lỗi thì thử lại được</span><span class="a">→</span>
          <span class="n">giới hạn, điểm dừng, xác nhận trước hành động lớn</span></div>
        say: "Tổng kết lại, tác tử lặp quan sát, suy nghĩ, hành động, nên sai số nhân lên theo số bước. Phát hiện được lỗi thì mới thử lại được, và luôn cần giới hạn, điểm dừng, và xác nhận trước hành động lớn."
      - show: |
          <div class="box key"><b>Tư duy:</b> độ tin cậy của tác tử đến từ khả năng <b>biết mình sai</b>, nhiều hơn là từ việc mỗi bước đúng hơn một chút.</div>
        say: "Điều cần mang theo, độ tin cậy của tác tử đến từ khả năng biết mình sai, nhiều hơn là từ việc mỗi bước đúng hơn một chút."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>gọi công cụ</b> — lược đồ, kiểm tra tham số, lỗi và thử lại.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cách gọi công cụ, với lược đồ, kiểm tra tham số, lỗi và thử lại. Hẹn gặp bạn ở bài tiếp theo."
