assumes: [arith, power, approx]
# Quy ước: quy trình cố định 4 bước biết trước, mỗi bước 98%; tác tử tự chọn bước, mỗi bước 95%, trung bình 6 bước — SỐ MINH HOẠ để so độ tin cậy
#   (alg.workflow_vs_agent). Các bước độc lập như bài 0.
objectives:
  - "So sánh quy trình cố định với tác tử tự chủ"
  - "Chọn kiến trúc theo đặc điểm nhiệm vụ"
  - "Thiết kế tác tử có giới hạn, điểm dừng và người giám sát"
asr_reviewed:
  - {sentence: "Bảng tính độ tin cậy của các kiến trúc với số minh hoạ.", reason: "ASR chép “Bản tính đầu tiên cậy của các kiến trúc với số minh họa.” (0.769): lệch âm/thanh thuần Việt: bảng/bản, độ tin/đầu tiên — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Việc 4 bước có cần một tác tử?"
    checks:
      - "[round(x, 3) for x in alg.workflow_vs_agent(0.98, 4, 0.95, 6)] == [0.922, 0.735]"
    steps:
      - show: |
          <p>Phân loại thư hỗ trợ khách hàng luôn gồm 4 bước: đọc thư, xác định loại, tra đơn hàng, soạn trả lời theo mẫu. Một nhóm dựng tác tử tự chủ “cho linh hoạt”; nhóm khác viết quy trình cố định, mỗi bước một lời gọi mô hình. Quy trình cố định đúng <b>92,2%</b>, tác tử chỉ <b>73,5%</b> (số minh hoạ).</p>
          <div class="box key">Hôm nay: <b>tổng hợp</b> — khi nào dùng quy trình cố định, khi nào thật sự cần tác tử, và cách giữ tác tử trong tầm kiểm soát.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, việc phân loại thư hỗ trợ khách hàng luôn gồm 4 bước, đọc thư, xác định loại, tra đơn hàng, và soạn trả lời theo mẫu. Một nhóm dựng tác tử tự chủ cho linh hoạt, nhóm khác viết quy trình cố định, mỗi bước một lời gọi mô hình. Quy trình cố định đúng 92 phẩy 2 phần trăm, còn tác tử chỉ 73 phẩy 5 phần trăm, theo số minh hoạ. Hôm nay ta tổng hợp cả khoá, khi nào dùng quy trình cố định, khi nào thật sự cần tác tử, và cách giữ tác tử trong tầm kiểm soát."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hai công thức của bài 0, và cổng quyền của bài 9"
    checks:
      - "round(alg.chain_success(0.9, 2), 2) == 0.81 and round(1 - 0.1 ** 2, 2) == 0.99 and round(alg.chain_with_retry(0.9, 2, 2), 4) == 0.9801"
      - "[alg.tool_gate(a) for a in ('đọc trang', 'gửi thư', 'xoá dữ liệu', 'chạy lệnh')] == ['chạy', 'hỏi', 'cấm', 'cấm']"
    steps:
      - show: |
          <p>Ở bài 0: nhiệm vụ $n$ bước độc lập, mỗi bước đúng $p$, hoàn thành với xác suất $p^n$. Nếu <b>phát hiện</b> được lỗi và thử lại tối đa $t$ lần, mỗi bước chỉ hỏng khi sai cả $t$ lần.</p>
          <table class="t"><tr><th>2 bước, mỗi bước đúng 0,9</th><th>tính</th><th>hoàn thành</th></tr>
          <tr><td>không thử lại</td><td>$0{,}9^2$</td><td>0,81</td></tr>
          <tr><td>thử lại tối đa 2 lần</td><td>mỗi bước $1 - 0{,}1^2 = 0{,}99$; rồi $0{,}99^2$</td><td>0,9801</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Trước hết, nhắc lại hai công thức của bài 0. Nhiệm vụ n bước độc lập, mỗi bước đúng với xác suất p, thì hoàn thành với xác suất p mũ n. Nếu phát hiện được lỗi và thử lại tối đa t lần, mỗi bước chỉ hỏng khi sai cả t lần. Ví dụ hai bước, mỗi bước đúng 0 phẩy 9, không thử lại thì được 0 phẩy 9 bình phương, bằng 0 phẩy 81. Thử lại tối đa 2 lần thì mỗi bước đúng 1 trừ 0 phẩy 1 bình phương, bằng 0 phẩy 99, và cả nhiệm vụ là 0 phẩy 99 bình phương, bằng 0 phẩy 9801."
      - show: |
          <p>Ở bài 9: mô hình chỉ <b>đề xuất</b> hành động, một <b>cổng quyền</b> bằng mã chương trình quyết định: đọc trang chạy ngay, gửi thư phải hỏi người dùng, xoá dữ liệu bị cấm, công cụ lạ như chạy lệnh cũng bị cấm (mặc định từ chối).</p>
        say: "Điều thứ hai, nhắc lại bài 9, mô hình chỉ đề xuất hành động, còn một cổng quyền viết bằng mã chương trình mới quyết định. Đọc trang được chạy ngay, gửi thư phải hỏi người dùng, xoá dữ liệu bị cấm, và công cụ lạ như chạy lệnh cũng bị cấm, theo nguyên tắc mặc định từ chối."

  - id: sym
    kind: symbol
    title: "Bản đồ lựa chọn"
    steps:
      - show: |
          <table class="t"><tr><th>đặc điểm nhiệm vụ</th><th>nên dùng</th></tr>
          <tr><td>các bước biết trước, thứ tự cố định</td><td><b>quy trình cố định</b>: mỗi bước một lời gọi mô hình, chương trình nối các bước</td></tr>
          <tr><td>chọn một trong vài nhánh biết trước</td><td>quy trình có <b>bộ định tuyến</b>: mô hình chọn nhánh, nhánh là quy trình cố định</td></tr>
          <tr><td>số bước và công cụ cần dùng không biết trước (tìm hiểu, gỡ lỗi, nghiên cứu)</td><td><b>tác tử tự chủ</b> có giới hạn bước, quyền tối thiểu, bộ kiểm chứng</td></tr></table>
          <p>Câu hỏi quyết định: <b>có viết được các bước ra trước không?</b> Viết được thì không cần tác tử.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng là bản đồ lựa chọn. Các bước biết trước và thứ tự cố định thì dùng quy trình cố định, mỗi bước một lời gọi mô hình, chương trình nối các bước. Chọn một trong vài nhánh biết trước thì dùng quy trình có bộ định tuyến, mô hình chọn nhánh, còn mỗi nhánh là một quy trình cố định. Số bước và công cụ cần dùng không biết trước, như tìm hiểu, gỡ lỗi hay nghiên cứu, thì dùng tác tử tự chủ, với giới hạn bước, quyền tối thiểu và bộ kiểm chứng. Câu hỏi quyết định là có viết được các bước ra trước không, viết được thì không cần tác tử."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ít bước hơn, mỗi bước hẹp hơn"
    checks:
      - "[round(x, 3) for x in (0.98 ** 4, 0.95 ** 6, 0.9975 ** 6)] == [0.922, 0.735, 0.985]"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><g fill="#1f2937"><line x1="200" y1="300" x2="1230" y2="300" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="300" x2="200" y2="30" stroke="#6b7280" stroke-width="2"/><polyline points="200,50.0 300,55.0 400,59.9 500,64.7 600,69.4 700,74.0 800,78.5 900,83.0 1000,87.3 1100,91.6 1200,95.7" fill="none" stroke="#2a78d6" stroke-width="4"/><polyline points="200,50.0 300,62.5 400,74.4 500,85.7 600,96.4 700,106.6 800,116.2 900,125.4 1000,134.1 1100,142.4 1200,150.3" fill="none" stroke="#b91c1c" stroke-width="4"/><polyline points="200,50.0 300,50.6 400,51.2 500,51.9 600,52.5 700,53.1 800,53.7 900,54.3 1000,55.0 1100,55.6 1200,56.2" fill="none" stroke="#059669" stroke-width="4"/><circle cx="600" cy="69.4" r="10" fill="#2a78d6"/><circle cx="800" cy="116.2" r="10" fill="#b91c1c"/><circle cx="800" cy="53.7" r="10" fill="#059669"/><g font-size="22"><line x1="600" y1="81" x2="600" y2="200" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 5"/><text x="600" y="222" text-anchor="middle" fill="#2a78d6">quy trình, 4 bước 98%: 0,922</text><line x1="800" y1="128" x2="800" y2="250" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/><text x="800" y="272" text-anchor="middle" fill="#b91c1c">tác tử, 6 bước 95%: 0,735</text><text x="820" y="40" fill="#059669">tác tử có kiểm chứng: 0,985</text><text x="200" y="330" text-anchor="middle">0</text><text x="600" y="330" text-anchor="middle">4</text><text x="800" y="330" text-anchor="middle">6</text><text x="1200" y="330" text-anchor="middle">10 bước</text><text x="185" y="58" text-anchor="end">1</text><text x="185" y="305" text-anchor="end">0</text><text x="215" y="25">độ tin cậy của cả nhiệm vụ</text></g></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ độ tin cậy của cả nhiệm vụ theo số bước, cho ba kiểu làm. Đường xanh dương là quy trình cố định, mỗi bước hẹp nên đúng 98 phần trăm, và dừng ở 4 bước với khoảng 0 phẩy 922. Đường đỏ là tác tử tự chọn, mỗi bước đúng 95 phần trăm và trung bình đi tới 6 bước, nên tụt xuống khoảng 0 phẩy 735. Đường xanh lá là tác tử có bộ kiểm chứng, sai thì phát hiện và thử lại, nên gần như nằm ngang, khoảng 0 phẩy 985 sau 6 bước."

  - id: example
    kind: example
    title: "Tính độ tin cậy hai kiến trúc"
    checks:
      - "[round(x, 3) for x in alg.workflow_vs_agent(0.98, 4, 0.95, 6)] == [0.922, 0.735] and round(alg.chain_with_retry(0.95, 6, 2), 3) == 0.985"
      - "round(0.98 ** 2, 4) == 0.9604 and round(0.95 ** 3, 3) == 0.857 and round(1 - 0.922, 3) == 0.078 and round(1 - 0.735, 3) == 0.265 and round(1 - 0.985, 3) == 0.015 and round(0.265 / 0.078, 1) == 3.4"
    steps:
      - show: |
          <p><b>Bước 1 — quy trình cố định</b>, 4 bước biết trước, mỗi bước 98% (số minh hoạ): $0{,}98^2 = 0{,}9604$, rồi bình phương lần nữa: $0{,}98^4 \approx \hl{0{,}922}$.</p>
        say: "Bước một, quy trình cố định có 4 bước biết trước, mỗi bước đúng 98 phần trăm, theo số minh hoạ. Ta tính 0 phẩy 98 bình phương bằng 0 phẩy 9604, rồi bình phương lần nữa, được 0 phẩy 98 mũ 4, xấp xỉ 0 phẩy 922."
      - show: |
          <p><b>Bước 2 — tác tử tự chọn bước</b>, trung bình 6 bước, mỗi bước 95%: $0{,}95^3 \approx 0{,}857$, rồi bình phương: $0{,}95^6 \approx \hl{0{,}735}$.</p>
        say: "Bước hai, tác tử tự chọn bước, trung bình 6 bước, mỗi bước đúng 95 phần trăm, vì mỗi lần tự quyết là một cơ hội chọn sai. Ta tính 0 phẩy 95 mũ 3 xấp xỉ 0 phẩy 857, rồi bình phương lên, được 0 phẩy 95 mũ 6, xấp xỉ 0 phẩy 735."
      - show: |
          <p><b>Bước 3 — tác tử có bộ kiểm chứng</b> (bài 5) phát hiện lỗi, thử lại tối đa 2 lần: mỗi bước hỏng $0{,}05^2 = 0{,}0025$, đúng $0{,}9975$; cả nhiệm vụ $0{,}9975^6 \approx \hl{0{,}985}$.</p>
        say: "Bước ba, tác tử có bộ kiểm chứng như ở bài 5, phát hiện được lỗi và thử lại tối đa 2 lần. Mỗi bước chỉ hỏng khi sai cả hai lần, 0 phẩy 05 bình phương, bằng 0 phẩy 0025, nên mỗi bước đúng 0 phẩy 9975. Cả nhiệm vụ là 0 phẩy 9975 mũ 6, xấp xỉ 0 phẩy 985."
      - clear: true
        show: |
          <table class="t"><tr><th>kiến trúc (số minh hoạ)</th><th>độ tin cậy</th><th>tỉ lệ hỏng</th></tr>
          <tr><td>quy trình cố định, 4 bước 98%</td><td>0,922</td><td>$1 - 0{,}922 = 0{,}078$</td></tr>
          <tr><td>tác tử, 6 bước 95%</td><td>0,735</td><td>$1 - 0{,}735 = 0{,}265$</td></tr>
          <tr><td>tác tử có kiểm chứng, thử lại 2 lần</td><td>0,985</td><td>0,015</td></tr></table>
          <p>Bước 4 — so: tác tử không kiểm chứng hỏng nhiều gấp $\frac{0{,}265}{0{,}078} \approx \hl{3{,}4}$ lần quy trình cố định.</p>
        focus: [1, 1, "1.2", "1.3", "1.4", 2]
        say: "Bảng tính độ tin cậy của các kiến trúc với số minh hoạ. Cột cuối là tỉ lệ hỏng, bằng 1 trừ độ tin cậy của từng kiến trúc. Quy trình cố định hỏng 0 phẩy 078. Tác tử không kiểm chứng hỏng 0 phẩy 265. Tác tử có kiểm chứng chỉ hỏng 0 phẩy 015. Bước bốn, so hai kiến trúc đầu, tác tử không kiểm chứng hỏng nhiều gấp 0 phẩy 265 chia 0 phẩy 078, khoảng 3 phẩy 4 lần quy trình cố định."
      - show: |
          <div class="box key">Bước 5 — kết luận: tác tử <b>có thể</b> tin cậy, nhưng nhờ bộ kiểm chứng và thử lại, không nhờ “tự do”. Việc viết được thành 4 bước thì quy trình cố định vừa đúng hơn, vừa ít lời gọi hơn.</div>
        say: "Bước năm, kết luận, tác tử có thể tin cậy, nhưng là nhờ bộ kiểm chứng và thử lại, chứ không nhờ sự tự do. Với một việc viết được thành 4 bước, quy trình cố định vừa đúng hơn, vừa ít lời gọi mô hình hơn."

  - id: check
    kind: check
    title: "Tự kiểm: theo 1000 lá thư qua từng bước"
    checks:
      - "[round(1000 * 0.98 ** k, 1) for k in range(1, 5)] == [980.0, 960.4, 941.2, 922.4]"
      - "[round(1000 * 0.95 ** k, 1) for k in range(1, 7)] == [950.0, 902.5, 857.4, 814.5, 773.8, 735.1]"
    steps:
      - show: |
          <p>Đường khác: không dùng lũy thừa, mà cho <b>1000 lá thư</b> đi qua từng bước, mỗi bước giữ lại phần làm đúng.</p>
          <table class="t"><tr><th>sau bước</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
          <tr><td>quy trình (giữ 98%)</td><td>980</td><td>960,4</td><td>941,2</td><td>$\hl{922{,}4}$</td><td>—</td><td>—</td></tr>
          <tr><td>tác tử (giữ 95%)</td><td>950</td><td>902,5</td><td>857,4</td><td>814,5</td><td>773,8</td><td>$\hl{735{,}1}$</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, ta không dùng lũy thừa mà cho 1000 lá thư đi qua từng bước, mỗi bước chỉ giữ lại phần làm đúng. Với quy trình cố định, mỗi bước giữ 98 phần trăm, nên còn 980, rồi 960 phẩy 4, rồi 941 phẩy 2, và sau bước 4 còn 922 phẩy 4 lá đúng. Với tác tử, mỗi bước giữ 95 phần trăm, nên còn 950, 902 phẩy 5, rồi cứ thế giảm dần tới 735 phẩy 1 lá sau bước 6. Chia cho 1000, ta lại được 0 phẩy 922 và 0 phẩy 735, khớp với phép lũy thừa."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "6 * 2000 == 12000 and alg.loop_tokens(2000, 500, 6)[0] == 19500 == sum(range(2000, 5000, 500)) and round(19500 / 12000, 1) == 1.6"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng tác tử cho việc viết được thành quy trình <b class="red">(đắt và kém tin cậy hơn)</b>
          <br><span class="note">Mỗi bước tác tử tự quyết là một cơ hội chọn sai, và lịch sử dài làm chi phí tăng gần bậc hai (bài 8).</span></div>
        say: "Lỗi thứ nhất, dùng tác tử cho việc viết được thành quy trình, nên vừa đắt vừa kém tin cậy hơn. Mỗi bước tác tử tự quyết là một cơ hội chọn sai, và lịch sử dài làm chi phí tăng gần bậc hai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đưa tác tử vào dùng mà chưa có bộ đánh giá <b class="red">(không biết tốt hay tệ)</b>
          <br><span class="note">Trước khi phát hành: bộ nhiệm vụ có trạng thái cuối kiểm được, đo “thành công mọi lần”, vết truy vết, và ngân sách chi phí (bài 7, 8, 10).</span></div>
        say: "Lỗi thứ hai, đưa tác tử vào dùng mà chưa có bộ đánh giá, nên không biết nó tốt hay tệ. Trước khi phát hành phải có bộ nhiệm vụ với trạng thái cuối kiểm được, đo thành công mọi lần, có vết truy vết, và có ngân sách chi phí."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cho tác tử toàn quyền ngay từ đầu <b class="red">(rủi ro không cần thiết)</b>
          <br><span class="note">Bắt đầu chỉ đọc; thêm quyền ghi từng bước, mỗi quyền có người dùng xác nhận và nhật ký (bài 9). Mở rộng tự chủ khi số liệu cho thấy nó đáng tin.</span></div>
        say: "Lỗi thứ ba, cho tác tử toàn quyền ngay từ đầu, một rủi ro không cần thiết. Hãy bắt đầu chỉ với quyền đọc, thêm quyền ghi từng bước, mỗi quyền có người dùng xác nhận và nhật ký. Chỉ mở rộng sự tự chủ khi số liệu cho thấy nó đáng tin."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Ước chi phí tác tử bằng “số bước nhân giá một bước” <b class="red">(ước thấp)</b>
          <br><span class="note">Như ở bài 8, mỗi bước tác tử gửi lại <b>toàn bộ</b> lịch sử, nên bước sau đắt hơn bước trước. Người đã đi làm hay lấy bước đầu nhân số bước. Chuyên gia cộng dồn từng bước.</span></div>
          <table class="t"><tr><th>từ tố đầu vào (số minh hoạ: bước đầu 2000, mỗi bước thêm 500)</th><th>tổng</th></tr>
          <tr><td>ước nhanh: $6 \times 2000$</td><td>12 000</td></tr>
          <tr><td>cộng dồn thật: $2000 + 2500 + 3000 + 3500 + 4000 + 4500$</td><td>$\hl{19\,500}$ — gấp khoảng 1,6 lần</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, ước chi phí tác tử bằng số bước nhân giá một bước, nên ước thấp. Như đã học ở bài 8, mỗi bước tác tử gửi lại toàn bộ lịch sử, nên bước sau đắt hơn bước trước. Người đi làm hay lấy bước đầu nhân với số bước cho nhanh. Chuyên gia thì cộng dồn từng bước, như bảng với số minh hoạ, bước đầu 2000 từ tố và mỗi bước thêm 500. Ước nhanh 6 nhân 2000 được 12 nghìn từ tố. Cộng dồn thật từ 2000 tới 4500 được 19 nghìn 500, gấp khoảng 1 phẩy 6 lần con số ước nhanh."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[round(x, 3) for x in alg.workflow_vs_agent(0.97, 3, 0.97, 5)] == [0.913, 0.859] and round(0.97 ** 2, 3) == 0.941"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Quy trình cố định 3 bước và tác tử trung bình 5 bước, mỗi bước đều 97%. Độ tin cậy mỗi bên?</td></tr>
          <tr><td>2</td><td>Chọn kiến trúc cho: (a) dịch hoá đơn sang mẫu chuẩn; (b) tìm nguyên nhân một lỗi chưa từng gặp trong hệ thống.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, quy trình cố định 3 bước và tác tử trung bình 5 bước, mỗi bước đều đúng 97 phần trăm, độ tin cậy mỗi bên là bao nhiêu? Câu hai, chọn kiến trúc cho hai việc, dịch hoá đơn sang mẫu chuẩn, và tìm nguyên nhân một lỗi chưa từng gặp trong hệ thống. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Quy trình: $0{,}97^2 \approx 0{,}941$, nhân thêm 0,97: $0{,}97^3 \approx \hl{0{,}913}$.</p>
          <p>Tác tử: nhân thêm hai lần nữa, $0{,}97^5 \approx 0{,}859$ — cùng chất lượng từng bước, ít bước hơn thì tin cậy hơn.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, với quy trình, 0 phẩy 97 bình phương xấp xỉ 0 phẩy 941, nhân thêm 0 phẩy 97 nữa được 0 phẩy 97 mũ 3, khoảng 0 phẩy 913. Với tác tử, ta nhân thêm hai lần 0 phẩy 97 nữa, được 0 phẩy 97 mũ 5, khoảng 0 phẩy 859. Cùng chất lượng từng bước thì bên nào ít bước hơn sẽ tin cậy hơn."
      - show: |
          <table class="t"><tr><th>việc</th><th>viết được các bước trước?</th><th>chọn</th></tr>
          <tr><td>(a) dịch hoá đơn sang mẫu chuẩn</td><td>có: đọc, tách trường, điền mẫu</td><td><b>quy trình cố định</b></td></tr>
          <tr><td>(b) tìm nguyên nhân lỗi chưa từng gặp</td><td>không: chưa biết xem nhật ký nào, chạy thử gì</td><td><b>tác tử</b>, chỉ quyền đọc, có giới hạn bước</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Câu hai, ta hỏi đúng câu hỏi quyết định, có viết được các bước ra trước không. Dịch hoá đơn sang mẫu chuẩn thì viết được, gồm đọc, tách trường, điền mẫu, nên chọn quy trình cố định. Tìm nguyên nhân một lỗi chưa từng gặp thì không viết trước được, vì chưa biết cần xem nhật ký nào hay chạy thử gì. Vì vậy ta chọn tác tử, nhưng chỉ cho quyền đọc và có giới hạn bước."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">viết được các bước → quy trình cố định</span><span class="a">→</span>
          <span class="n">vài nhánh biết trước → định tuyến</span><span class="a">→</span>
          <span class="n">không biết trước → tác tử có giới hạn</span><span class="a">→</span>
          <span class="n">đo, kiểm chứng, quyền tối thiểu, mở rộng dần</span></div>
        say: "Tổng kết lại, viết được các bước thì dùng quy trình cố định, có vài nhánh biết trước thì dùng định tuyến, còn không biết trước thì dùng tác tử có giới hạn. Luôn đo, kiểm chứng, giữ quyền tối thiểu, và mở rộng dần."
      - show: |
          <div class="box key"><b>Tư duy:</b> tác tử tốt nhất là tác tử <b>đơn giản nhất</b> làm được việc — sự tự chủ là thứ phải được chứng minh bằng số liệu, không phải mặc định.</div>
        say: "Điều cần mang theo, tác tử tốt nhất là tác tử đơn giản nhất làm được việc, và sự tự chủ là thứ phải được chứng minh bằng số liệu, không phải mặc định."
      - clear: true
        show: |
          <p class="note">Bạn đã có vòng lặp tác tử, công cụ, kế hoạch, bộ nhớ, tìm thông tin, tự kiểm tra, nhiều tác tử, đánh giá, chi phí, an toàn, quan sát và lựa chọn kiến trúc. Bài sau (bài 12): <b>tình huống chuyên gia theo dòng thời gian</b> — tác tử dùng công cụ từ 2022 tới 2025, từ ba lệnh tra cứu tới sửa lỗi phần mềm thật.</p>
        forward_ref: true
        say: "Bạn đã có vòng lặp tác tử, công cụ, kế hoạch, bộ nhớ, tìm thông tin và tự kiểm tra, thêm nhiều tác tử, đánh giá, chi phí, an toàn, quan sát, và cách chọn kiến trúc. Ở bài 12, bài sau, ta đi theo dòng thời gian có thật của tác tử dùng công cụ, từ năm 2022 tới 2025. Đó là bốn năm đi từ ba lệnh tra cứu tới sửa lỗi phần mềm thật, mỗi chặng một điểm nghẽn và một cách xử lý."
