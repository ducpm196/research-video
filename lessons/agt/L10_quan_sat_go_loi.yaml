id: L10
course: AGT
series: "AGT · AI agent"
title: "Bài 10 — Quan sát và gỡ lỗi tác tử: vết truy vết, phát lại, phân loại lỗi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L10; audit/agt/verify_agt.py L10; CLD bài 11 (nhật ký, chỉ số, vết truy vết); OpenTelemetry — khái niệm span, trace (opentelemetry.io/docs/concepts/signals/traces, truy cập 2026-11-09, no revision given); M. Cemri và cộng sự, Why Do Multi-Agent LLM Systems Fail? (2025) — phân loại lỗi"
assumes: [arith, frac]
# Quy ước: 200 lần chạy, 50 lần thất bại, phân loại tay thành 4 nhóm 22 / 15 / 9 / 4 — SỐ MINH HOẠ. Vết truy vết 6 đoạn với thời gian (giây) là SỐ MINH HOẠ.
#   Sau khi sửa mô tả công cụ, giả định nhóm “chọn sai công cụ” giảm từ 22 xuống 6 (số minh hoạ cho bài tự làm).
objectives:
  - "Ghi vết truy vết cho từng bước"
  - "Phân loại lỗi để sửa đúng chỗ"
  - "Phát lại để kiểm bản sửa"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Tác tử hôm nay hơi tệ” — tệ ở đâu?"
    checks:
      - "200 - 50 == 150 and 150 / 200 == 0.75"
    steps:
      - show: |
          <p>Tác tử thành công 150 trong 200 lần chạy. Người dùng phàn nàn, đội sửa lời nhắc theo một ca lỗi họ nhớ — và tỉ lệ thành công không đổi. Không ai biết 50 lần thất bại <b>hỏng ở bước nào</b>.</p>
          <div class="box key">Hôm nay: <b>quan sát tác tử</b> — ghi vết từng bước, phân loại lỗi, sửa nhóm lớn nhất trước, và phát lại để kiểm.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, tác tử thành công 150 trong 200 lần chạy. Người dùng phàn nàn, và đội sửa lời nhắc theo một ca lỗi họ nhớ, nhưng tỉ lệ thành công không đổi. Không ai biết 50 lần thất bại hỏng ở bước nào. Hôm nay ta học quan sát tác tử, ghi vết từng bước, phân loại lỗi, sửa nhóm lớn nhất trước, và phát lại để kiểm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm của một phần, và tỉ lệ thành công trên bộ việc"
    checks:
      - "22 / 50 == 0.44 and 22 * 2 == 44 and round(3.0 / 8.1, 2) == 0.37"
      - "150 / 200 == 0.75 and 200 - 150 == 50"
    steps:
      - show: |
          <p>Muốn biết một phần chiếm bao nhiêu phần trăm của tổng: lấy phần chia tổng, rồi nhân 100.</p>
          <table class="t"><tr><th>phần / tổng</th><th>chia</th><th>phần trăm</th></tr>
          <tr><td>22 trên 50</td><td>$\frac{22}{50} = 0{,}44$</td><td>44% (mẹo: tổng là 50 thì nhân đôi phần, 22 nhân 2 bằng 44)</td></tr>
          <tr><td>3,0 giây trên 8,1 giây</td><td>$\frac{3{,}0}{8{,}1} \approx 0{,}37$</td><td>≈ 37%</td></tr></table>
        introduces: [frac]
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn cách tính một phần chiếm bao nhiêu phần trăm của tổng, ta lấy phần chia cho tổng rồi nhân 100. Bảng có hai ví dụ. 22 trên 50 bằng 0 phẩy 44, tức 44 phần trăm, và có mẹo nhanh là khi tổng bằng 50 thì chỉ cần nhân đôi phần, 22 nhân 2 bằng 44. 3 giây trên 8 phẩy 1 giây thì xấp xỉ 0 phẩy 37, tức khoảng 37 phần trăm."
      - show: |
          <p>Ở bài 7, ta đo tác tử bằng <b>tỉ lệ nhiệm vụ thành công</b> trên một bộ việc cố định, và chạy lại cả bộ sau mỗi thay đổi. Thành công 150 trên 200 lần: $\frac{150}{200} = 75\%$, còn $200 - 150 = 50$ lần thất bại.</p>
        say: "Điều thứ hai, nhắc lại bài 7, ta đo tác tử bằng tỉ lệ nhiệm vụ thành công trên một bộ việc cố định, và chạy lại cả bộ sau mỗi thay đổi. Thành công 150 trên 200 lần là 75 phần trăm, và còn 200 trừ 150, bằng 50 lần thất bại cần tìm nguyên nhân."

  - id: sym
    kind: symbol
    title: "Giải mã: vết truy vết, đoạn, phát lại"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>ghi gì</th></tr>
          <tr><td><b>vết truy vết</b> của một lần chạy</td><td>chuỗi các đoạn theo thời gian, có mã lần chạy chung</td></tr>
          <tr><td><b>đoạn</b> gọi mô hình</td><td>lời nhắc (hoặc mã băm của nó), câu trả lời, số từ tố, thời gian</td></tr>
          <tr><td><b>đoạn</b> gọi công cụ</td><td>tên công cụ, tham số, kết quả hoặc lỗi, thời gian</td></tr>
          <tr><td><b>phát lại</b></td><td>chạy lại với kết quả công cụ đã ghi — bỏ được phần ngẫu nhiên bên ngoài, chỉ thử phần đã sửa</td></tr></table>
          <p class="note"><b>Lời nhắc</b>: chữ gửi cho mô hình; <b>từ tố</b>: mẩu chữ mô hình đọc. <b>Mã băm</b>: chuỗi ngắn tính ra từ một văn bản, văn bản khác thì gần như chắc chắn ra mã khác — lưu mã thay cho cả lời nhắc dài. Chuẩn OpenTelemetry gọi vết là <i>trace</i>, đoạn là <i>span</i>.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2, 2]
        say: "Bảng giới thiệu các khái niệm. Vết truy vết của một lần chạy là chuỗi các đoạn theo thời gian, có chung một mã lần chạy. Đoạn gọi mô hình ghi lời nhắc hoặc mã băm của nó, câu trả lời, số từ tố và thời gian. Đoạn gọi công cụ ghi tên công cụ, tham số, kết quả hoặc lỗi, và thời gian. Phát lại là chạy lại với kết quả công cụ đã ghi, để bỏ được phần ngẫu nhiên bên ngoài và chỉ thử phần đã sửa. Nhắc lại, lời nhắc là chữ gửi cho mô hình, còn từ tố là mẩu chữ mô hình đọc. Mã băm là một chuỗi ngắn tính ra từ văn bản, văn bản khác thì gần như chắc chắn ra mã khác, nên ta lưu mã thay cho cả lời nhắc dài. Một chuẩn ghi vết phổ biến đặt tên tiếng Anh cho vết và đoạn, ghi trên màn hình."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vết là một dải thời gian; lỗi là những cột cao thấp"
    checks:
      - "[round(x, 1) for x in __import__('itertools').accumulate([1.2, 0.8, 1.1, 3.0, 1.4, 0.6])] == [1.2, 2.0, 3.1, 6.1, 7.5, 8.1]"
      - "[round(n / 50 * 100) for n in (22, 15, 9, 4)] == [44, 30, 18, 8]"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g><rect x="120" y="20" width="1080" height="30" fill="#e5e7eb"/><text x="660" y="42" font-size="20" text-anchor="middle" fill="#1f2937">một lần chạy, mã chung, tổng 8,1 giây</text><rect x="120" y="60" width="160" height="32" fill="#2a78d6" opacity="0.85"/><text x="290" y="84" font-size="20" fill="#1f2937">mô hình 1,2 giây</text><rect x="280" y="102" width="107" height="32" fill="#059669" opacity="0.85"/><text x="397" y="126" font-size="20" fill="#1f2937">tìm kiếm 0,8 giây</text><rect x="387" y="144" width="147" height="32" fill="#2a78d6" opacity="0.85"/><text x="543" y="168" font-size="20" fill="#1f2937">mô hình 1,1 giây</text><rect x="533" y="186" width="400" height="32" fill="#eb6834" opacity="0.85"/><text x="943" y="210" font-size="20" fill="#1f2937">đọc trang 3,0 giây</text><rect x="933" y="228" width="187" height="32" fill="#2a78d6" opacity="0.85"/><text x="1130" y="252" font-size="20" fill="#1f2937">mô hình 1,4 giây</text><rect x="1120" y="270" width="80" height="32" fill="#059669" opacity="0.85"/><text x="1210" y="294" font-size="20" fill="#1f2937">trả lời 0,6 giây</text><line x1="120" y1="320" x2="1200" y2="320" stroke="#6b7280" stroke-width="2"/><line x1="120" y1="315" x2="120" y2="325" stroke="#6b7280" stroke-width="2"/><text x="120" y="350" font-size="19" text-anchor="middle" fill="#1f2937">0</text><line x1="387" y1="315" x2="387" y2="325" stroke="#6b7280" stroke-width="2"/><text x="387" y="350" font-size="19" text-anchor="middle" fill="#1f2937">2</text><line x1="653" y1="315" x2="653" y2="325" stroke="#6b7280" stroke-width="2"/><text x="653" y="350" font-size="19" text-anchor="middle" fill="#1f2937">4</text><line x1="920" y1="315" x2="920" y2="325" stroke="#6b7280" stroke-width="2"/><text x="920" y="350" font-size="19" text-anchor="middle" fill="#1f2937">6</text><line x1="1187" y1="315" x2="1187" y2="325" stroke="#6b7280" stroke-width="2"/><text x="1187" y="350" font-size="19" text-anchor="middle" fill="#1f2937">8</text><text x="1210" y="355" font-size="19" fill="#1f2937">giây</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ một vết truy vết như một dải thời gian, mỗi đoạn là một thanh nằm ngang, bắt đầu khi đoạn trước kết thúc. Thanh xanh dương là các lần gọi mô hình, thanh xanh lá là tìm kiếm và trả lời. Thanh cam dài nhất là đọc trang, kéo dài 3 giây, nên chỉ cần nhìn là thấy độ trễ nằm ở đâu."
      - clear: true
        show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><line x1="180" y1="270" x2="1360" y2="270" stroke="#6b7280" stroke-width="2"/><rect x="230" y="50" width="170" height="220" fill="#b91c1c"/><text x="315" y="42" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">22 lần, 44%</text><text x="315" y="302" font-size="21" text-anchor="middle" fill="#1f2937">chọn sai công cụ</text><rect x="520" y="120" width="170" height="150" fill="#eb6834"/><text x="605" y="112" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">15 lần, 30%</text><text x="605" y="302" font-size="21" text-anchor="middle" fill="#1f2937">tham số sai</text><rect x="810" y="180" width="170" height="90" fill="#d97706"/><text x="895" y="172" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">9 lần, 18%</text><text x="895" y="302" font-size="21" text-anchor="middle" fill="#1f2937">dừng sớm</text><rect x="1100" y="230" width="170" height="40" fill="#6b7280"/><text x="1185" y="222" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">4 lần, 8%</text><text x="1185" y="302" font-size="21" text-anchor="middle" fill="#1f2937">công cụ lỗi</text></svg></div>
        focus: [1, 1, 1]
        say: "Khi đã có vết của từng lần thất bại, ta đọc và xếp chúng vào các nhóm, rồi vẽ thành cột từ cao xuống thấp. Cột đỏ, chọn sai công cụ, chiếm 44 phần trăm, gần một nửa số lần thất bại. Vì thế việc đáng làm trước tiên hiện ra ngay trên hình, mà không cần đoán theo ca lỗi mình nhớ."

  - id: example
    kind: example
    title: "Phân loại 50 lần thất bại và một vết truy vết"
    checks:
      - "22 + 15 + 9 + 4 == 50 and [round(x / 50 * 100) for x in (22, 15, 9, 4)] == [44, 30, 18, 8]"
      - "round(1.2 + 0.8 + 1.1 + 3.0 + 1.4 + 0.6, 1) == 8.1 and round(3.0 / 8.1 * 100) == 37"
    steps:
      - show: |
          <p><b>Bước 1 — đọc vết, xếp nhóm</b> (số minh hoạ): mỗi lần thất bại vào đúng một nhóm.</p>
          <table class="t"><tr><th>nhóm lỗi</th><th>số lần</th></tr>
          <tr><td>chọn sai công cụ</td><td>22</td></tr><tr><td>tham số sai</td><td>15</td></tr>
          <tr><td>dừng sớm, chưa xong việc</td><td>9</td></tr><tr><td>công cụ lỗi (bên ngoài)</td><td>4</td></tr></table>
          <p>Cộng lại: $22 + 15 + 9 + 4 = 50$ — đủ 50 lần, không sót lần nào.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước một, đọc vết của từng lần thất bại và xếp mỗi lần vào đúng một nhóm, với số minh hoạ. Chọn sai công cụ có 22 lần, tham số sai có 15 lần. Dừng sớm khi chưa xong việc có 9 lần. Công cụ bên ngoài bị lỗi có 4 lần. Cộng lại 22, 15, 9 và 4 được 50, đủ 50 lần thất bại, không sót lần nào."
      - show: |
          <p><b>Bước 2 — đổi ra tỉ lệ</b> (tổng là 50 nên nhân đôi): chọn sai công cụ $\hl{44\%}$, tham số sai 30%, dừng sớm 18%, công cụ lỗi 8%.</p>
        say: "Bước hai, đổi ra tỉ lệ, vì tổng là 50 nên chỉ cần nhân đôi. Chọn sai công cụ chiếm 44 phần trăm, tham số sai 30 phần trăm, dừng sớm 18 phần trăm, và công cụ lỗi 8 phần trăm."
      - clear: true
        show: |
          <p><b>Bước 3 — chọn nhóm sửa trước:</b> giả sử sửa được <b>hết</b> một nhóm, thành công tăng tối đa bao nhiêu?</p>
          <table class="t"><tr><th>sửa hết nhóm</th><th>thành công tối đa</th></tr>
          <tr><td>chọn sai công cụ (22)</td><td>$\frac{150 + 22}{200} = \hl{86\%}$</td></tr>
          <tr><td>công cụ lỗi (4)</td><td>$\frac{150 + 4}{200} = 77\%$</td></tr></table>
          <p>→ sửa <b>mô tả công cụ</b> trước, vì đó là chỗ mô hình đọc để chọn công cụ.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước ba, chọn nhóm sửa trước bằng cách hỏi, nếu sửa được hết một nhóm thì thành công tăng tối đa bao nhiêu. Sửa hết nhóm chọn sai công cụ thì được 150 cộng 22, trên 200, bằng 86 phần trăm. Sửa hết nhóm công cụ lỗi thì chỉ được 150 cộng 4, trên 200, bằng 77 phần trăm. Vậy ta sửa mô tả công cụ trước, vì đó là chỗ mô hình đọc để chọn công cụ."
      - show: |
          <p><b>Bước 4 — vết thời gian của một lần chạy</b> (giây): mô hình 1,2 → tìm kiếm 0,8 → mô hình 1,1 → <b>đọc trang 3,0</b> → mô hình 1,4 → trả lời 0,6.</p>
          <p>Cộng: $1{,}2 + 0{,}8 + 1{,}1 + 3{,}0 + 1{,}4 + 0{,}6 = 8{,}1$ giây.</p>
        focus: [1, 2]
        say: "Bước bốn, đọc vết thời gian của một lần chạy, gồm mô hình 1 phẩy 2 giây, tìm kiếm 0 phẩy 8, rồi mô hình 1 phẩy 1. Tiếp theo là đọc trang 3 giây, mô hình 1 phẩy 4, và trả lời 0 phẩy 6, cộng tất cả lại được 8 phẩy 1 giây."
      - show: |
          <p><b>Bước 5 — đoạn tốn nhất:</b> đọc trang $\frac{3{,}0}{8{,}1} \approx \hl{37\%}$ thời gian — một đoạn chiếm hơn một phần ba cả lần chạy.</p>
        say: "Bước năm, tìm đoạn tốn nhất. Đọc trang mất 3 giây trên 8 phẩy 1 giây, xấp xỉ 37 phần trăm, nghĩa là một đoạn chiếm hơn một phần ba thời gian của cả lần chạy."

  - id: check
    kind: check
    title: "Tự kiểm: cộng phần trăm và trừ mốc thời gian"
    checks:
      - "44 + 30 + 18 + 8 == 100"
      - "(lambda e: [round(x, 1) for x in e] == [1.2, 2.0, 3.1, 6.1, 7.5, 8.1] and round(e[3] - e[2], 1) == 3.0 and round(e[-1], 1) == 8.1)(list(__import__('itertools').accumulate([1.2, 0.8, 1.1, 3.0, 1.4, 0.6])))"
    steps:
      - show: |
          <p><b>Cách 1:</b> các nhóm không chồng nhau và phủ hết 50 lần, nên các tỉ lệ phải cộng đủ 100: $44 + 30 + 18 + 8 = 100$ ✓.</p>
          <p><b>Cách 2:</b> vết ghi <b>mốc kết thúc</b> của từng đoạn, ta trừ mốc thay vì cộng thời lượng.</p>
          <table class="t"><tr><th>đoạn</th><th>bắt đầu</th><th>kết thúc</th></tr>
          <tr><td>mô hình (lần hai)</td><td>2,0</td><td>3,1</td></tr>
          <tr><td>đọc trang</td><td>3,1</td><td>6,1 → dài $6{,}1 - 3{,}1 = 3{,}0$ ✓</td></tr>
          <tr><td>trả lời</td><td>7,5</td><td>8,1 → cả lần chạy 8,1 giây ✓</td></tr></table>
        focus: [1, 2, 3, "3.3", "3.4"]
        say: "Kiểm bằng đường khác, cách thứ nhất, các nhóm không chồng lên nhau và phủ hết 50 lần, nên các tỉ lệ phải cộng đủ 100, và 44, 30, 18, 8 cộng lại đúng bằng 100. Cách thứ hai, vết ghi mốc kết thúc của từng đoạn, nên ta trừ các mốc thay vì cộng thời lượng. Bảng lấy ba đoạn, đoạn mô hình lần hai kết thúc ở giây 3 phẩy 1. Đọc trang bắt đầu ở 3 phẩy 1 và kết thúc ở 6 phẩy 1, nên dài 3 giây, khớp. Đoạn trả lời kết thúc ở 8 phẩy 1, nên cả lần chạy dài 8 phẩy 1 giây, cũng khớp."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "round(200 * 0.1) == 20 and 20 * 50 / 200 == 5 and 50 + round(150 * 0.1) == 65"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sửa theo một ca lỗi nhớ được <b class="red">(làm hỏng ca khác)</b>
          <br><span class="note">Một câu thêm vào lời nhắc để sửa ca A có thể làm hỏng ca B. Luôn chạy lại toàn bộ bộ đánh giá (bài 7) sau mỗi thay đổi, và <b>so theo cặp</b>: xem từng nhiệm vụ bản cũ đúng hay sai, bản mới đúng hay sai, để thấy cả ca được sửa lẫn ca bị hỏng.</span></div>
        say: "Lỗi thứ nhất, sửa theo một ca lỗi nhớ được, nên làm hỏng ca khác. Một câu thêm vào lời nhắc để sửa ca A có thể làm hỏng ca B. Hãy luôn chạy lại toàn bộ bộ đánh giá sau mỗi thay đổi, và so theo cặp. So theo cặp là xem từng nhiệm vụ, bản cũ đúng hay sai, bản mới đúng hay sai, để thấy cả ca được sửa lẫn ca bị hỏng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ghi vết chứa dữ liệu nhạy cảm <b class="red">(lộ qua nhật ký)</b>
          <br><span class="note">Lời nhắc chứa thông tin khách hàng, tham số chứa mã truy cập. Che trường nhạy cảm trước khi ghi, giới hạn ai được đọc vết, đặt hạn lưu.</span></div>
        say: "Lỗi thứ hai, ghi vết chứa dữ liệu nhạy cảm, nên lộ qua nhật ký. Lời nhắc có thể chứa thông tin khách hàng, tham số có thể chứa mã truy cập. Hãy che trường nhạy cảm trước khi ghi, giới hạn ai được đọc vết, và đặt hạn lưu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ ghi kết quả cuối <b class="red">(không gỡ lỗi được)</b>
          <br><span class="note">“Thất bại” không nói gì. Phải ghi mọi bước trung gian; không có vết thì không phân loại được, và không phát lại được.</span></div>
        say: "Lỗi thứ ba, chỉ ghi kết quả cuối, nên không gỡ lỗi được. Một chữ thất bại không nói gì. Phải ghi mọi bước trung gian, vì không có vết thì không phân loại được, và cũng không phát lại được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Lấy mẫu vết ngẫu nhiên để tiết kiệm <b class="red">(lần thất bại lọt mất)</b>
          <br><span class="note">Người đã đi làm hay chỉ giữ 10% vết, chọn ngẫu nhiên, để bớt tiền lưu trữ. Nhưng thứ cần đọc là lần <b>thất bại</b>. Chuyên gia giữ <b>mọi</b> vết thất bại, chỉ lấy mẫu các lần thành công.</span></div>
          <table class="t"><tr><th>200 lần chạy, 50 lần thất bại</th><th>số vết lưu</th><th>vết thất bại có để đọc</th></tr>
          <tr><td>giữ 10%, chọn ngẫu nhiên</td><td>$200 \times 0{,}1 = 20$</td><td>khoảng $20 \times \frac{50}{200} = 5$</td></tr>
          <tr><td>giữ mọi thất bại, 10% thành công</td><td>$50 + 15 = 65$</td><td>$\hl{50}$</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, lấy mẫu vết ngẫu nhiên để tiết kiệm, nên các lần thất bại lọt mất. Họ chỉ giữ 10 phần trăm số vết, chọn ngẫu nhiên, để bớt tiền lưu trữ. Nhưng thứ cần đọc là lần thất bại, nên chuyên gia giữ mọi vết thất bại và chỉ lấy mẫu các lần thành công. Bảng tính trên 200 lần chạy có 50 lần thất bại. Giữ 10 phần trăm ngẫu nhiên thì lưu 20 vết, và trung bình chỉ khoảng 5 vết là thất bại, quá ít để phân loại. Giữ mọi thất bại cộng 10 phần trăm thành công thì lưu 65 vết, trong đó đủ cả 50 vết thất bại."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(200 - (50 - 22 + 6)) / 200 == 0.83 and 50 - 22 + 6 == 34"
      - "round(3.0 / 8.1 * 100) == 37 and round(1.4 / 8.1 * 100) == 17 and max([1.2, 0.8, 1.1, 3.0, 1.4, 0.6]) == 3.0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Sửa mô tả công cụ, nhóm “chọn sai công cụ” giảm từ 22 xuống 6 (số minh hoạ), các nhóm khác giữ nguyên. Tỉ lệ thành công trên 200 lần mới là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Muốn giảm độ trễ của vết 8,1 giây ở trên, bước nào nên tối ưu trước?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, sửa mô tả công cụ thì nhóm chọn sai công cụ giảm từ 22 xuống 6, một số minh hoạ, các nhóm khác giữ nguyên. Tỉ lệ thành công trên 200 lần mới là bao nhiêu? Câu hai, muốn giảm độ trễ của vết ở trên, bước nào nên tối ưu trước? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Thất bại: bỏ 22 lần cũ, thêm 6 lần còn lại: $50 - 22 + 6 = 34$.</p>
          <p>Thành công: $200 - 34 = 166$ → $\frac{166}{200} = \hl{83\%}$ (từ 75%).</p>
        focus: [1, 2]
        say: "Đáp án câu một, số thất bại bỏ đi 22 lần cũ rồi thêm 6 lần còn lại, bằng 50 trừ 22 cộng 6, được 34. Vậy thành công là 200 trừ 34, bằng 166 lần, tức 166 trên 200, bằng 83 phần trăm, tăng từ 75 phần trăm."
      - show: |
          <table class="t"><tr><th>đoạn</th><th>giây</th><th>phần của 8,1 giây</th></tr>
          <tr><td>đọc trang</td><td>3,0</td><td>$\hl{\approx 37\%}$ — lớn nhất</td></tr>
          <tr><td>mô hình (lần ba)</td><td>1,4</td><td>≈ 17%</td></tr></table>
          <p>Quyết định: tối ưu <b>đọc trang</b> trước — lưu sẵn trang hay gặp, đọc song song nhiều trang, hoặc chỉ đọc phần cần.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, ta so các đoạn theo phần của 8 phẩy 1 giây. Đọc trang mất 3 giây, khoảng 37 phần trăm, lớn nhất trong vết. Đoạn lớn thứ hai là lần gọi mô hình thứ ba, 1 phẩy 4 giây, chỉ khoảng 17 phần trăm. Quyết định là tối ưu đọc trang trước, bằng cách lưu sẵn trang hay gặp, đọc song song nhiều trang, hoặc chỉ đọc phần cần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ghi vết mọi bước</span><span class="a">→</span>
          <span class="n">phân loại lỗi, sửa nhóm lớn nhất</span><span class="a">→</span>
          <span class="n">phát lại, chạy lại cả bộ đánh giá</span><span class="a">→</span>
          <span class="n">che dữ liệu nhạy cảm trong vết</span></div>
        say: "Tổng kết lại, ghi vết mọi bước, phân loại lỗi và sửa nhóm lớn nhất trước. Phát lại và chạy lại cả bộ đánh giá, và che dữ liệu nhạy cảm trong vết."
      - show: |
          <div class="box key"><b>Tư duy:</b> không đo được thì không sửa được — với tác tử, “đo” nghĩa là <b>đọc từng bước nó đã làm</b>.</div>
        say: "Điều cần mang theo, không đo được thì không sửa được, và với tác tử, đo nghĩa là đọc từng bước nó đã làm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>tổng hợp</b> — chọn quy trình cố định hay tác tử tự chủ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta tổng hợp cả khoá, chọn quy trình cố định hay tác tử tự chủ. Hẹn gặp bạn ở bài tiếp theo."
