id: L02
course: AGT
series: "AGT · AI agent"
title: "Bài 2 — Lập kế hoạch và phân rã nhiệm vụ"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L02; audit/agt/verify_agt.py L02; L. Wang và cộng sự, Plan-and-Solve Prompting (2023); S. Yao và cộng sự, ReAct (2023); AIF bài 10 (lập kế hoạch); DMS bài 8 (sắp xếp tô pô); J. Kelley, M. Walker (1959) — phương pháp đường găng"
assumes: [arith]
# Quy ước: nhiệm vụ “viết báo cáo so sánh hai tài liệu” chia 5 bước: tìm (2 s), đọc A (3 s), đọc B (4 s) — cả hai sau tìm —, tổng hợp (2 s) sau
#   đọc A và đọc B, kiểm tra (1 s) sau tổng hợp. Thời gian là SỐ MINH HOẠ. alg.dag_times(thời gian, phụ thuộc) trả (tổng tuần tự, thời điểm xong khi
#   chạy song song tối đa, đường găng).
objectives:
  - "Phân rã nhiệm vụ thành đồ thị phụ thuộc"
  - "Tính thời gian theo đường găng khi chạy song song"
  - "So sánh lập kế hoạch trước và lập kế hoạch từng bước"
asr_reviewed:
  - {sentence: "Đồ thị phụ thuộc có mỗi bước là một nút, tức một ô, và cạnh là mũi tên từ A tới B nếu B cần kết quả của A.", reason: "ASR chép “Đồ thì phụ thuộc có mỗi bước là một nút, tức một ô, và cạnh là mũi tên từ A tới B nếu B cần kết quả qua.” (0.912): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: thị/thì, của (trong “của a” → “qua”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đọc lần lượt hay đọc cùng lúc?"
    checks:
      - "alg.dag_times({'tim': 2, 'docA': 3, 'docB': 4, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'tonghop': ['docA', 'docB'], 'kiem': ['tonghop']})[:2] == (12, 9)"
    steps:
      - show: |
          <p>Tác tử được giao: “so sánh hai bản báo cáo và viết tóm tắt”. Làm lần lượt từng bước mất 12 giây. Nhưng đọc bản A và đọc bản B không phụ thuộc nhau — làm cùng lúc thì chỉ <b>9 giây</b>. Muốn biết làm gì song song được, phải có <b>kế hoạch</b>.</p>
          <div class="box key">Hôm nay: <b>phân rã nhiệm vụ</b> thành đồ thị phụ thuộc, tính <b>đường găng</b>, và khi nào lập kế hoạch trước, khi nào quyết định từng bước.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, tác tử được giao so sánh hai bản báo cáo và viết tóm tắt. Làm lần lượt từng bước mất 12 giây. Nhưng đọc bản A và đọc bản B không phụ thuộc nhau, làm cùng lúc thì chỉ 9 giây. Muốn biết làm gì song song được, phải có kế hoạch. Hôm nay ta học phân rã nhiệm vụ thành đồ thị phụ thuộc, tính đường găng, và khi nào lập kế hoạch trước, khi nào quyết định từng bước."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cộng dồn thời gian và chờ người đến sau"
    checks:
      - "2 + 3 + 4 + 2 + 1 == 12 and max(5, 6) == 6 and max(5, 6) + 2 == 8"
    steps:
      - show: |
          <p>Làm <b>lần lượt</b> thì thời gian cộng dồn: việc 2 s, 3 s, 4 s, 2 s, 1 s nối đuôi nhau mất $2 + 3 + 4 + 2 + 1 = 12$ s.</p>
        say: "Trước hết, ôn hai phép tính sẽ dùng cả bài. Khi làm lần lượt, việc sau chỉ bắt đầu khi việc trước xong, nên thời gian cộng dồn lại. Năm việc mất 2, 3, 4, 2 và 1 giây nối đuôi nhau thì tổng cộng mất 12 giây."
      - show: |
          <p>Hai bạn hẹn nhau đi ăn: bạn An tới lúc 5 giờ, bạn Bình tới lúc 6 giờ. Hai người chỉ đi được khi <b>người tới sau</b> có mặt: $\max(5, 6) = 6$. Đi tiếp 2 giờ thì tới nơi lúc $6 + 2 = \hl{8}$.</p>
        introduces: [max_fn]
        say: "Phép thứ hai là chờ người đến sau. Hai bạn hẹn nhau đi ăn, An tới lúc 5 giờ, Bình tới lúc 6 giờ, nên hai người chỉ đi được khi người tới sau có mặt. Trên màn hình, ký hiệu viết tắt ấy đọc là số lớn nhất của 5 và 6, và nó bằng 6. Đi tiếp 2 giờ thì tới nơi lúc 6 cộng 2, bằng 8 giờ."

  - id: sym
    kind: symbol
    title: "Giải mã: đồ thị phụ thuộc và đường găng"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>đồ thị phụ thuộc</b></td><td>mỗi bước là một <b>nút</b> (một ô); <b>cạnh</b> là mũi tên “A trước B” nếu B cần kết quả của A; <b>không có vòng</b>: đi theo mũi tên không bao giờ quay lại ô cũ</td></tr>
          <tr><td><b>thời điểm xong</b></td><td>xong của một bước = lớn nhất thời điểm xong của các bước nó cần + thời gian của nó</td></tr>
          <tr><td><b>đường găng</b></td><td>chuỗi bước dài nhất từ đầu tới cuối; làm nhanh bước ngoài đường găng không rút ngắn được tổng</td></tr>
          <tr><td>kế hoạch trước / từng bước</td><td>lập cả đồ thị rồi chạy, hay mỗi vòng chỉ quyết định bước kế tiếp theo quan sát mới</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn khái niệm. Đồ thị phụ thuộc có mỗi bước là một nút, tức một ô, và cạnh là mũi tên từ A tới B nếu B cần kết quả của A. Đồ thị không có vòng, nghĩa là đi theo mũi tên thì không bao giờ quay lại ô cũ, nếu không sẽ có hai bước chờ nhau mãi. Thời điểm xong của một bước bằng thời điểm xong lớn nhất của các bước nó cần, cộng thời gian của chính nó. Đường găng là chuỗi bước dài nhất từ đầu tới cuối, và làm nhanh một bước ngoài đường găng không rút ngắn được tổng. Cuối cùng, có thể lập cả đồ thị rồi chạy, hoặc mỗi vòng chỉ quyết định bước kế tiếp theo quan sát mới."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Các thanh thời gian chồng lên nhau"
    checks:
      - "alg.dag_times({'tim': 2, 'docA': 3, 'docB': 4, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'tonghop': ['docA', 'docB'], 'kiem': ['tonghop']}) == (12, 9, ['tim', 'docB', 'tonghop', 'kiem']) and 6 - 5 == 1"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><text x="250" y="58" font-size="22" text-anchor="end" fill="#1f2937">tìm</text><rect x="270" y="30" width="180" height="36" rx="6" fill="#eb6834"/><text x="458" y="57" font-size="20" fill="#1f2937">2</text><text x="250" y="106" font-size="22" text-anchor="end" fill="#1f2937">đọc A</text><rect x="450" y="78" width="270" height="36" rx="6" fill="#2a78d6"/><text x="728" y="105" font-size="20" fill="#1f2937">5</text><text x="250" y="154" font-size="22" text-anchor="end" fill="#1f2937">đọc B</text><rect x="450" y="126" width="360" height="36" rx="6" fill="#eb6834"/><text x="818" y="153" font-size="20" fill="#1f2937">6</text><text x="250" y="202" font-size="22" text-anchor="end" fill="#1f2937">tổng hợp</text><rect x="810" y="174" width="180" height="36" rx="6" fill="#eb6834"/><text x="998" y="201" font-size="20" fill="#1f2937">8</text><text x="250" y="250" font-size="22" text-anchor="end" fill="#1f2937">kiểm tra</text><rect x="990" y="222" width="90" height="36" rx="6" fill="#eb6834"/><text x="1088" y="249" font-size="20" fill="#1f2937">9</text><rect x="720" y="78" width="90" height="36" rx="6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="8 6"/><text x="250" y="318" font-size="22" text-anchor="end" fill="#b91c1c">lần lượt</text><rect x="270" y="290" width="1080" height="36" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="1358" y="317" font-size="20" fill="#b91c1c">12</text><line x1="270" y1="370" x2="1350" y2="370" stroke="#6b7280" stroke-width="2"/><text x="270" y="394" font-size="19" text-anchor="middle" fill="#1f2937">0</text><text x="540" y="394" font-size="19" text-anchor="middle" fill="#1f2937">3</text><text x="810" y="394" font-size="19" text-anchor="middle" fill="#1f2937">6</text><text x="1080" y="394" font-size="19" text-anchor="middle" fill="#1f2937">9</text><text x="1350" y="394" font-size="19" text-anchor="middle" fill="#1f2937">12</text><text x="830" y="104" font-size="21" fill="#2a78d6">đọc A dư 1 giây</text><text x="1380" y="394" font-size="19" fill="#1f2937">giây</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi bước thành một thanh, bắt đầu khi mọi bước nó cần đã xong, và dài bằng thời gian của nó. Đọc A và đọc B cùng bắt đầu lúc 2 giây, nằm chồng lên nhau theo thời gian, nên cả nhiệm vụ xong lúc 9 giây. Các thanh màu cam nối liền nhau từ 0 tới 9 là đường găng, còn đọc A màu xanh xong sớm và phải chờ đọc B thêm 1 giây. Thanh đỏ ở dưới là cách làm lần lượt, kéo dài tới 12 giây."

  - id: example
    kind: example
    title: "Năm bước, đường găng 9 giây"
    checks:
      - "alg.dag_times({'tim': 2, 'docA': 3, 'docB': 4, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'tonghop': ['docA', 'docB'], 'kiem': ['tonghop']}) == (12, 9, ['tim', 'docB', 'tonghop', 'kiem'])"
    steps:
      - show: |
          <table class="t"><tr><th>bước (số minh hoạ)</th><th>cần</th><th>thời gian</th></tr>
          <tr><td>tìm hai bản</td><td>—</td><td>2 s</td></tr><tr><td>đọc A</td><td>tìm</td><td>3 s</td></tr>
          <tr><td>đọc B</td><td>tìm</td><td>4 s</td></tr><tr><td>tổng hợp</td><td>đọc A, đọc B</td><td>2 s</td></tr>
          <tr><td>kiểm tra</td><td>tổng hợp</td><td>1 s</td></tr></table>
          <p><b>Bước 1 — tìm:</b> không cần gì, bắt đầu lúc 0, xong lúc $0 + 2 = 2$.</p>
        focus: [1, 2]
        say: "Bảng ghi năm bước, mỗi bước cần bước nào trước nó và mất bao lâu, với thời gian là số minh hoạ. Bước một, bước tìm không cần bước nào trước, nên bắt đầu lúc 0 và xong lúc 0 cộng 2, bằng 2."
      - show: |
          <p><b>Bước 2 — hai bước đọc:</b> cả hai chỉ cần “tìm”, nên cùng bắt đầu lúc 2. Đọc A xong $2 + 3 = 5$; đọc B xong $2 + 4 = 6$.</p>
        say: "Bước hai, đọc A và đọc B đều chỉ cần bước tìm, nên cùng bắt đầu lúc 2. Đọc A xong lúc 2 cộng 3, bằng 5, còn đọc B xong lúc 2 cộng 4, bằng 6."
      - clear: true
        show: |
          <p>Đọc A xong lúc 5, đọc B xong lúc 6.</p>
          <p><b>Bước 3 — tổng hợp:</b> phải chờ <b>cả hai</b> bản đọc xong, tức chờ bản đến sau: bắt đầu $\max(5, 6) = 6$, xong $6 + 2 = 8$.</p>
        focus: [1, 2]
        say: "Bước ba, tổng hợp cần cả hai bản đọc, nên phải chờ bản đến sau, giống hai bạn hẹn đi ăn. Nó bắt đầu lúc số lớn nhất của 5 và 6, bằng 6, và xong lúc 6 cộng 2, bằng 8."
      - show: |
          <p><b>Bước 4 — kiểm tra:</b> xong $8 + 1 = \hl{9}$ s. Làm lần lượt thì $2 + 3 + 4 + 2 + 1 = 12$ s — song song tiết kiệm 3 s.</p>
        say: "Bước bốn, kiểm tra xong lúc 8 cộng 1, bằng 9 giây. Làm lần lượt thì mất 12 giây, nên chạy song song tiết kiệm được 3 giây."
      - clear: true
        show: |
          <p><b>Bước 5 — lần ngược tìm đường găng:</b> từ kiểm tra lùi về tổng hợp; tổng hợp chờ bản xong muộn hơn là <b>đọc B</b> (6 &gt; 5); đọc B lùi về tìm.</p>
          <div class="chain"><span class="n">tìm 2</span><span class="a">→</span><span class="n">đọc B 4</span><span class="a">→</span><span class="n">tổng hợp 2</span><span class="a">→</span><span class="n">kiểm tra 1</span></div>
          <p>Làm nhanh “đọc A” không giúp gì (nó vốn dư 1 s); làm nhanh “đọc B” thì có.</p>
        focus: [1, 1, 2, 3]
        say: "Bước năm, lần ngược để tìm đường găng. Từ kiểm tra lùi về tổng hợp, mà tổng hợp chờ bản xong muộn hơn là đọc B, vì 6 lớn hơn 5, rồi đọc B lùi về tìm. Vậy đường găng là tìm, đọc B, tổng hợp, kiểm tra. Làm nhanh đọc A không giúp gì vì nó vốn dư 1 giây, còn làm nhanh đọc B thì có."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê mọi đường từ đầu tới cuối"
    checks:
      - "2 + 3 + 2 + 1 == 8 and 2 + 4 + 2 + 1 == 9 and max(8, 9) == alg.dag_times({'tim': 2, 'docA': 3, 'docB': 4, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'tonghop': ['docA', 'docB'], 'kiem': ['tonghop']})[1]"
      - "alg.dag_times({'tim': 2, 'docA': 2, 'docB': 4, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'tonghop': ['docA', 'docB'], 'kiem': ['tonghop']})[1] == 9 and alg.dag_times({'tim': 2, 'docA': 3, 'docB': 3, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'tonghop': ['docA', 'docB'], 'kiem': ['tonghop']})[1] == 8"
    steps:
      - show: |
          <p>Cách khác: không tính thời điểm xong, mà <b>liệt kê mọi đường</b> đi từ “tìm” tới “kiểm tra” và cộng thời gian trên mỗi đường.</p>
          <table class="t"><tr><th>đường</th><th>tổng</th></tr>
          <tr><td>tìm → đọc A → tổng hợp → kiểm tra</td><td>$2 + 3 + 2 + 1 = 8$</td></tr>
          <tr><td>tìm → đọc B → tổng hợp → kiểm tra</td><td>$2 + 4 + 2 + 1 = \hl{9}$ ✓ dài nhất</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, ta không tính thời điểm xong nữa mà liệt kê mọi đường đi từ tìm tới kiểm tra, rồi cộng thời gian trên mỗi đường. Theo đường qua đọc A, ta cộng 2, 3, 2 và 1, được 8 giây. Đường qua đọc B dài 9 giây, là đường dài nhất, khớp với 9 giây và đúng là đường găng đã tìm."
      - show: |
          <table class="t"><tr><th>thử rút 1 giây ở</th><th>xong lúc</th></tr>
          <tr><td>đọc A: 3 → 2 s</td><td>vẫn 9</td></tr>
          <tr><td>đọc B: 4 → 3 s</td><td>8</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Thử thêm một phép kiểm nữa, rút 1 giây ở đọc A, từ 3 xuống 2 giây, thì nhiệm vụ vẫn xong lúc 9. Rút 1 giây ở đọc B, từ 4 xuống 3 giây, thì nhiệm vụ xong lúc 8, vì đọc B nằm trên đường găng, đúng như dự đoán."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "(lambda ends: ends[(3, 4, 5)] == 13 and ends[(5, 4, 3)] == 12 and min(ends.values()) == 12)({o: (lambda s: [s.__setitem__(s.index(min(s)), min(s) + d) for d in o] and max(s) + 2 + 1)([2, 2]) for o in __import__('itertools').permutations((3, 4, 5))})"
      - "2 + 3 == 5 and 5 + 5 == 10 and 10 + 2 + 1 == 13 and 2 + 4 == 6 and 6 + 3 == 9 and 9 + 2 + 1 == 12 and max(2 + 3, 2 + 4, 2 + 5) + 2 + 1 == 10"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lập kế hoạch một lần rồi chạy mù <b class="red">(kế hoạch cũ)</b>
          <br><span class="note">Bước “tìm” có thể chỉ thấy một bản. Sau mỗi quan sát quan trọng, kiểm lại kế hoạch: còn đúng không, cần bước mới không.</span></div>
        say: "Lỗi thứ nhất, lập kế hoạch một lần rồi chạy mù, nên dùng kế hoạch cũ. Bước tìm có thể chỉ thấy một bản. Sau mỗi quan sát quan trọng, hãy kiểm lại kế hoạch, còn đúng không, có cần bước mới không."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chạy song song những bước thật ra phụ thuộc nhau <b class="red">(đọc dữ liệu chưa có)</b>
          <br><span class="note">“Tổng hợp” chạy trước khi “đọc B” xong thì tóm tắt thiếu nửa. Phụ thuộc phải ghi rõ trong đồ thị, không dựa vào thứ tự may mắn.</span></div>
        say: "Lỗi thứ hai, chạy song song những bước thật ra phụ thuộc nhau, nên đọc dữ liệu chưa có. Bước tổng hợp chạy trước khi đọc B xong thì bản tóm tắt thiếu một nửa. Phụ thuộc phải ghi rõ trong đồ thị, không dựa vào thứ tự may mắn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Phân rã quá vụn <b class="red">(chi phí điều phối)</b>
          <br><span class="note">Mỗi bước là một lần gọi mô hình, tốn thời gian và <b>từ tố</b> (những mẩu chữ mô hình đọc và viết; giá mỗi lần gọi tính theo số từ tố). Chia tới mức mỗi bước có kết quả <b>kiểm được</b> là đủ.</span></div>
        say: "Lỗi thứ ba, phân rã quá vụn, nên tốn chi phí điều phối. Mỗi bước là một lần gọi mô hình, tốn thời gian và từ tố. Từ tố là những mẩu chữ mà mô hình đọc và viết, và giá mỗi lần gọi được tính theo số từ tố. Chia tới mức mỗi bước có kết quả kiểm được là đủ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tính đường găng trên giấy mà quên <b>hạn mức gọi cùng lúc</b> <b class="red">(hứa 10 s, chạy 13 s)</b>
          <br><span class="note">Người đã đi làm biết dịch vụ thật thường giới hạn số lời gọi cùng lúc. Ba bản đọc A 3 s, B 4 s, C 5 s mà chỉ được <b>2 lời gọi cùng lúc</b> (số minh hoạ):</span></div>
          <table class="t"><tr><th>cách xếp</th><th>ba bản đọc xong lúc</th><th>kiểm tra xong lúc</th></tr>
          <tr><td>trên giấy, không giới hạn</td><td>7</td><td>10</td></tr>
          <tr><td>2 lời gọi, xếp A, B trước, C chờ chỗ trống</td><td>C: 5 + 5 = 10</td><td class="red">13</td></tr>
          <tr><td>2 lời gọi, xếp C dài nhất trước</td><td>A: 6 + 3 = 9</td><td>$\hl{12}$ (tốt nhất)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tính đường găng trên giấy mà quên hạn mức gọi cùng lúc. Dịch vụ thật thường chỉ cho một số lời gọi chạy cùng lúc, ví dụ minh hoạ là 2, với ba bản đọc mất 3, 4 và 5 giây. Bảng so ba cách xếp. Trên giấy không giới hạn thì ba bản xong lúc 7 và kiểm tra xong lúc 10. Nếu xếp A và B trước, bản C phải chờ A xong lúc 5, nên xong lúc 10, và kiểm tra xong lúc 13. Nếu xếp bản dài nhất là C trước, bản A chờ B xong lúc 6 rồi xong lúc 9, nên kiểm tra xong lúc 12, nhanh nhất có thể. Chuyên gia đo hạn mức thật trước khi hứa thời gian, và xếp việc dài nhất lên trước."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.dag_times({'tim': 2, 'docA': 3, 'docB': 4, 'docC': 5, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'docC': ['tim'], 'tonghop': ['docA', 'docB', 'docC'], 'kiem': ['tonghop']}) == (17, 10, ['tim', 'docC', 'tonghop', 'kiem'])"
      - "[alg.dag_times({'tim': 2, 'docA': a, 'docB': b, 'docC': c, 'tonghop': 2, 'kiem': 1}, {'tim': [], 'docA': ['tim'], 'docB': ['tim'], 'docC': ['tim'], 'tonghop': ['docA', 'docB', 'docC'], 'kiem': ['tonghop']})[1] for a, b, c in ((1, 4, 5), (3, 2, 5), (3, 4, 3))] == [10, 10, 9] and max(2 + 1, 2 + 4, 2 + 5) == 7 and max(2 + 3, 2 + 4, 2 + 3) == 6"
    steps:
      - show: |
          <p>Thêm bản thứ ba: “đọc C” mất 5 s, cần “tìm”; “tổng hợp” giờ cần cả ba bản.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Làm tuần tự mất bao lâu? Chạy song song tối đa mất bao lâu?</td></tr>
          <tr><td>2</td><td>Đường găng mới đi qua những bước nào?</td></tr>
          <tr><td>3</td><td>Chỉ được làm nhanh <b>một</b> bản đọc thêm 2 s: chọn A, B hay C?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Thêm bản thứ ba, đọc C mất 5 giây và cần bước tìm, còn tổng hợp giờ cần cả ba bản. Câu một, làm tuần tự mất bao lâu, chạy song song tối đa mất bao lâu? Câu hai, đường găng mới đi qua những bước nào? Câu ba, nếu chỉ được làm nhanh một bản đọc thêm 2 giây, bạn chọn bản A, B hay C? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Tuần tự: $12 + 5 = 17$ s.</p>
          <table class="t"><tr><th>bước</th><th>xong lúc</th></tr>
          <tr><td>đọc A, B, C (cùng bắt đầu lúc 2)</td><td>5, 6, 7</td></tr>
          <tr><td>tổng hợp</td><td>$\max(5, 6, 7) + 2 = 9$</td></tr>
          <tr><td>kiểm tra</td><td>$9 + 1 = \hl{10}$ s</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án câu một, làm tuần tự mất 12 cộng 5, bằng 17 giây. Chạy song song thì ba bản đọc cùng bắt đầu lúc 2 và xong lúc 5, 6 và 7. Tổng hợp chờ bản đến sau, bắt đầu lúc 7, nên xong lúc 9. Kiểm tra xong lúc 10 giây."
      - show: |
          <p>② Lần ngược: tổng hợp chờ <b>đọc C</b> (7 lớn nhất) → đường găng: tìm → đọc C → tổng hợp → kiểm tra. Thêm một việc song song chỉ cộng thêm 1 s (9 → 10).</p>
        say: "Câu hai, lần ngược từ tổng hợp, nó chờ đọc C vì 7 là lớn nhất, nên đường găng đi qua tìm, đọc C, tổng hợp và kiểm tra. Thêm một việc song song chỉ cộng thêm 1 giây, từ 9 lên 10."
      - clear: true
        show: |
          <p>③ Chỉ được làm nhanh một bản đọc thêm 2 s:</p>
          <table class="t"><tr><th>làm nhanh 2 s</th><th>ba bản xong lúc</th><th>kiểm tra xong</th></tr>
          <tr><td>đọc A: 3 → 1</td><td>3, 6, 7</td><td>10</td></tr>
          <tr><td>đọc B: 4 → 2</td><td>5, 4, 7</td><td>10</td></tr>
          <tr><td>đọc C: 5 → 3</td><td>5, 6, 5</td><td>$\hl{9}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Câu ba là một quyết định, và ta tính thử cả ba lựa chọn. Làm nhanh đọc A thì bản C vẫn xong lúc 7, nên kiểm tra vẫn xong lúc 10. Làm nhanh đọc B cũng vậy, vẫn 10 giây. Làm nhanh đọc C thì ba bản xong lúc 5, 6 và 5, tổng hợp bắt đầu lúc 6, và kiểm tra xong lúc 9. Vậy chọn đọc C, nhưng chỉ lợi 1 giây chứ không phải 2, vì đọc B lại trở thành đường găng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">phân rã thành bước kiểm được</span><span class="a">→</span>
          <span class="n">ghi rõ phụ thuộc</span><span class="a">→</span>
          <span class="n">chạy song song, tối ưu đường găng</span><span class="a">→</span>
          <span class="n">kiểm lại kế hoạch sau quan sát mới</span></div>
        say: "Tổng kết lại, phân rã nhiệm vụ thành các bước kiểm được và ghi rõ phụ thuộc. Chạy song song và tối ưu đường găng, rồi kiểm lại kế hoạch sau mỗi quan sát mới."
      - show: |
          <div class="box key"><b>Tư duy:</b> muốn nhanh hơn, hãy hỏi “bước nào đang <b>chặn</b> tất cả?” — không phải “bước nào chậm nhất?”.</div>
        say: "Điều cần mang theo, muốn nhanh hơn, hãy hỏi bước nào đang chặn tất cả, chứ không phải bước nào chậm nhất."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>bộ nhớ</b> của tác tử — ngữ cảnh ngắn hạn, tóm tắt, truy xuất dài hạn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học bộ nhớ của tác tử, gồm ngữ cảnh ngắn hạn, tóm tắt, và truy xuất dài hạn. Hẹn gặp bạn ở bài tiếp theo."
