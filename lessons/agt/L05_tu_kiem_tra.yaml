id: L05
course: AGT
series: "AGT · AI agent"
title: "Bài 5 — Tự kiểm tra: bộ kiểm chứng, phản tư và tạo nhiều lần"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L05; audit/agt/verify_agt.py L05; K. Cobbe và cộng sự, Training Verifiers to Solve Math Word Problems (2021); N. Shinn và cộng sự, Reflexion (2023); J. Huang và cộng sự, Large Language Models Cannot Self-Correct Reasoning Yet (ICLR 2024) — tóm tắt: LLM “struggle to self-correct their responses without external feedback, and at times, their performance even degrades”; M. Sharma và cộng sự, Towards Understanding Sycophancy in Language Models (2023) — mô hình đổi đáp án đúng khi bị hỏi lại (tình huống mở bài); DSC bài 11 (tỉ lệ nền, Bayes)"
assumes: [arith, frac, approx, power, cdot]
# Quy ước: bộ sinh đúng với xác suất p; bộ kiểm chứng NHẬN câu đúng với xác suất tpr, nhận nhầm câu sai với xác suất fpr. Trong các câu được nhận,
#   tỉ lệ đúng = p·tpr / (p·tpr + (1 − p)·fpr) (alg.verifier_precision). Sinh tối đa n lần, trả câu đầu tiên được nhận (alg.best_of_n_verified),
#   giả định các lần ĐỘC LẬP. Số 0,6 / 0,9 / 0,2 là SỐ MINH HOẠ.
objectives:
  - "Tính độ tin cậy của câu trả lời qua bộ kiểm chứng"
  - "Phân biệt kiểm chứng bằng chương trình và bằng mô hình"
  - "Biết khi nào tự phản tư làm hại"
asr_reviewed:
  - {sentence: "Đây đúng là công thức tỉ lệ nền theo định lý Bayes.", reason: "ASR chép “Đây đúng là công thức tỷ lệ nên theo định lý bay S.” (0.769): “tỉ” ASR viết chính tả “tỷ” (cùng âm); Bayes đọc “Bay-ét” theo lexicon chung (probe 3/8, NOT_VERIFIED), ASR viết “bay X/S”; lệch âm/thanh thuần Việt: nền/nên — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hỏi “bạn chắc chưa?”, câu đúng thành câu sai"
    steps:
      - show: |
          <p>Tác tử giải đúng một bài toán. Người dùng hỏi lại “bạn chắc chưa?” — tác tử xin lỗi và đổi sang đáp án sai. Tự kiểm tra bằng chính mô hình không phải lúc nào cũng làm tốt hơn: nó có thể chiều theo câu hỏi thay vì kiểm sự thật.</p>
          <div class="box key">Hôm nay: <b>bộ kiểm chứng</b> — tính xem kiểm tra giúp được bao nhiêu, và vì sao kiểm bằng <b>chương trình</b> đáng tin hơn kiểm bằng <b>lời</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, tác tử giải đúng một bài toán. Người dùng hỏi lại bạn chắc chưa, và tác tử xin lỗi rồi đổi sang đáp án sai. Tự kiểm tra bằng chính mô hình không phải lúc nào cũng làm tốt hơn, vì nó có thể chiều theo câu hỏi thay vì kiểm sự thật. Hôm nay ta học bộ kiểm chứng, tính xem kiểm tra giúp được bao nhiêu, và vì sao kiểm bằng chương trình đáng tin hơn kiểm bằng lời."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm của một nhóm, và phần trong tổng"
    checks:
      - "round(0.9 * 60) == 54 and round(0.2 * 40) == 8 and 54 + 8 == 62 and round(54 / 62, 3) == 0.871"
      - "round(12 / 30, 1) == 0.4 and round(1 - 0.62, 2) == 0.38"
    steps:
      - show: |
          <p>Lớp có 30 bạn, 12 bạn đeo kính. Phần đeo kính trong cả lớp: $\frac{12}{30} = \hl{0{,}4}$ — lấy <b>phần</b> chia cho <b>tổng</b>.</p>
          <table class="t"><tr><th>nhóm</th><th>lấy bao nhiêu phần trăm</th><th>được</th></tr>
          <tr><td>60 câu trả lời đúng</td><td>90%</td><td>$0{,}9 \cdot 60 = 54$</td></tr>
          <tr><td>40 câu trả lời sai</td><td>20%</td><td>$0{,}2 \cdot 40 = 8$</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn hai phép tính quen thuộc. Lớp có 30 bạn, 12 bạn đeo kính, thì phần đeo kính trong cả lớp là 12 chia 30, bằng 0 phẩy 4, tức là lấy phần chia cho tổng. Lấy 90 phần trăm của 60 câu trả lời đúng, ta nhân 0 phẩy 9 với 60, được 54 câu. Lấy 20 phần trăm của 40 câu trả lời sai, ta nhân 0 phẩy 2 với 40, được 8 câu."
      - show: |
          <p>Gộp hai nhóm vừa lấy: $54 + 8 = 62$ câu. Trong 62 câu đó, phần đến từ nhóm đúng là $\frac{54}{62} \approx 0{,}871$. Phần <b>không</b> được lấy của cả 100 câu: $1 - 0{,}62 = 0{,}38$.</p>
        say: "Gộp hai nhóm vừa lấy, ta có 54 cộng 8, bằng 62 câu. Trong 62 câu đó, phần đến từ nhóm đúng là 54 chia 62, xấp xỉ 0 phẩy 871, cũng theo cách lấy phần chia cho tổng. Phần không được lấy trong cả 100 câu là 1 trừ 0 phẩy 62, bằng 0 phẩy 38, và ta sẽ dùng lại cả ba con số này."

  - id: sym
    kind: symbol
    title: "Giải mã: bộ sinh, bộ kiểm chứng, độ tin cậy sau kiểm"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>nghĩa</th></tr>
          <tr><td>$p$</td><td>xác suất bộ sinh trả lời đúng</td></tr>
          <tr><td>tỉ lệ nhận đúng</td><td>bộ kiểm chứng nhận một câu đúng</td></tr>
          <tr><td>tỉ lệ nhận nhầm</td><td>bộ kiểm chứng nhận một câu sai</td></tr></table>
          <p>Trong các câu được nhận, tỉ lệ đúng $= \frac{p \cdot \text{nhận đúng}}{p \cdot \text{nhận đúng} + (1 - p) \cdot \text{nhận nhầm}}$ — đúng công thức tỉ lệ nền (định lý Bayes): $p$ là <b>tỉ lệ nền</b>, tức tỉ lệ đúng <b>trước</b> khi kiểm; định lý tính lại khả năng đúng khi biết thêm dấu hiệu “được nhận”.</p>
          <p>Bộ kiểm chứng <b>bằng chương trình</b> (chạy <b>bộ kiểm thử</b> — đoạn mã chạy lời giải trên đầu vào đã biết đáp số; so đáp số; kiểm cú pháp — câu lệnh có đúng luật viết của ngôn ngữ lập trình) thường có tỉ lệ nhận nhầm gần 0 — với điều kiện phép kiểm đủ chặt.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2, 2, 3, 3]
        say: "Bảng giới thiệu ba đại lượng. p là xác suất bộ sinh trả lời đúng. Tỉ lệ nhận đúng là khả năng bộ kiểm chứng nhận một câu đúng. Tỉ lệ nhận nhầm là khả năng nó nhận một câu sai. Trong các câu được nhận, tỉ lệ đúng bằng p nhân tỉ lệ nhận đúng, chia cho chính số đó cộng 1 trừ p nhân tỉ lệ nhận nhầm. Đây đúng là công thức tỉ lệ nền theo định lý Bayes. Tỉ lệ nền chính là p, tức tỉ lệ đúng trước khi kiểm, còn định lý này tính lại khả năng đúng khi biết thêm dấu hiệu được nhận. Bộ kiểm chứng bằng chương trình, như chạy bộ kiểm thử, so đáp số hay kiểm cú pháp, thường có tỉ lệ nhận nhầm gần bằng 0, với điều kiện phép kiểm đủ chặt. Bộ kiểm thử là đoạn mã chạy lời giải trên đầu vào đã biết đáp số, còn kiểm cú pháp là xem câu lệnh có đúng luật viết của ngôn ngữ lập trình không."
      - clear: true
        show: |
          <table class="t"><tr><th>cách tự kiểm</th><th>nghĩa</th></tr>
          <tr><td><b>phản tư</b></td><td>bảo mô hình đọc lại câu trả lời của chính nó rồi sửa; có ích khi kèm tín hiệu bên ngoài như kết quả chạy thử (N. Shinn và cộng sự, Reflexion, 2023)</td></tr>
          <tr><td><b>tạo nhiều lần</b></td><td>cho bộ sinh trả lời nhiều lần, bộ kiểm chứng chọn câu được nhận</td></tr></table>
          <p class="note">J. Huang và cộng sự (ICLR 2024): khi <b>không</b> có tín hiệu bên ngoài, mô hình tự sửa suy luận thường không tốt hơn, có lúc còn kém đi.</p>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Bảng thứ hai giới thiệu hai cách tự kiểm. Phản tư là bảo mô hình đọc lại câu trả lời của chính nó rồi sửa. Cách này có ích khi kèm tín hiệu bên ngoài, như kết quả chạy thử. Tạo nhiều lần là cho bộ sinh trả lời nhiều lần, rồi bộ kiểm chứng chọn câu được nhận. Một nghiên cứu năm 2024 thấy rằng khi không có tín hiệu bên ngoài, mô hình tự sửa suy luận thường không tốt hơn, có lúc còn kém đi."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "100 câu trả lời đi qua cửa kiểm"
    checks:
      - "round(0.9 * 60) == 54 and round(0.2 * 40) == 8 and 54 + 8 == 62 and 60 - 54 == 6 and 40 - 8 == 32"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><rect x="60" y="60" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="60" y="108" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="60" y="156" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="60" y="204" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="60" y="252" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="108" y="60" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="108" y="108" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="108" y="156" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="108" y="204" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="108" y="252" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="156" y="60" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="156" y="108" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="156" y="156" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="156" y="204" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="156" y="252" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="204" y="60" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="204" y="108" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="204" y="156" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><rect x="204" y="204" width="40" height="40" rx="5" fill="#2a78d6" stroke="#1f2937" stroke-width="1"/><r