- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bộ sinh + bộ kiểm chứng</span><span class="a">→</span>

      <span class="n">độ đúng sau kiểm theo tỉ lệ nền</span><span class="a">→</span>

      <span class="n">tỉ lệ nhận nhầm quyết định</span><span class="a">→</span>

      <span class="n">kiểm bằng chương trình, phản tư có tín hiệu ngoài</span></div>

      '
    say: Tổng kết lại, ghép bộ sinh với bộ kiểm chứng thì độ đúng sau kiểm tính theo tỉ lệ nền, và tỉ lệ nhận nhầm là yếu tố quyết định. Hãy kiểm bằng chương trình, và chỉ phản tư khi có tín hiệu bên ngoài.
  - show: '<div class="box key"><b>Tư duy:</b> đừng hỏi tác tử “bạn có chắc không” — hãy cho nó một <b>phép thử</b> có thể thất bại.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ 1 bộ kiểm chứng đúng/sai đơn giản tới hệ sinh lặp nhiều lần có kiểm thử mã: tách bộ kiểm chứng bằng chương trình khỏi cùng mô hình sinh giúp tránh chung điểm mù khi tác vụ phức tạp.</p>

      '
    say: Điều cần mang theo, đừng hỏi tác tử bạn có chắc không, hãy cho nó một phép thử có thể thất bại. Từ 1 bộ kiểm đơn giản tới vòng tự sinh kiểm bằng chạy thử mã nguồn. Tách bộ kiểm bằng chương trình khỏi cùng mô hình sinh giúp tránh bị cùng một điểm mù.
