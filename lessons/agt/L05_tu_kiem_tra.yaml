  - id: example
    kind: example
    title: "Từ 60% lên 87,1%"
    checks:
      - "round(alg.verifier_precision(0.6, 0.9, 0.2), 3) == 0.871 and round(0.6 * 0.9 + 0.4 * 0.2, 2) == 0.62"
      - "[round(x, 3) for x in alg.best_of_n_verified(0.6, 0.9, 0.2, 3)] == [0.945, 0.871]"
    steps:
      - show: |
          <p>Số minh hoạ: bộ sinh đúng 60%; bộ kiểm chứng nhận đúng 90% câu đúng, nhận nhầm 20% câu sai.</p>
          <p><b>Bước 1 — câu đúng được nhận:</b> $0{,}6 \cdot 0{,}9 = \hl{0{,}54}$.</p>
        focus: [1, 2]
        say: "Số minh hoạ như sau, bộ sinh đúng 60 phần trăm, bộ kiểm chứng nhận đúng 90 phần trăm câu đúng và nhận nhầm 20 phần trăm câu sai. Bước một, phần câu vừa đúng vừa được nhận là 0 phẩy 6 nhân 0 phẩy 9, bằng 0 phẩy 54."
      - show: |
          <p><b>Bước 2 — câu sai lọt qua:</b> câu sai chiếm $1 - 0{,}6 = 0{,}4$; lọt qua $0{,}4 \cdot 0{,}2 = \hl{0{,}08}$.</p>
        say: "Bước hai, câu sai chiếm 1 trừ 0 phẩy 6, bằng 0 phẩy 4 tổng số câu. Bộ kiểm chứng nhận nhầm 20 phần trăm số đó, nên phần câu sai lọt qua là 0 phẩy 4 nhân 0 phẩy 2, bằng 0 phẩy 08."
      - show: |
          <p><b>Bước 3 — đúng trong các câu được nhận:</b> được nhận $0{,}54 + 0{,}08 = 0{,}62$; tỉ lệ đúng $\frac{0{,}54}{0{,}62} \approx \hl{0{,}871}$.</p>
        say: "Bước ba, tổng phần được nhận là 0 phẩy 54 cộng 0 phẩy 08, bằng 0 phẩy 62. Trong các câu được nhận, tỉ lệ đúng là 0 phẩy 54 chia 0 phẩy 62, xấp xỉ 0 phẩy 871, vì ta lấy phần đúng chia cho tổng được nhận."
      - clear: true
        show: |
          <p><b>Bước 4 — sinh tối đa 3 lần</b>, trả câu đầu tiên được nhận:</p>
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>một lần bị loại</td><td>$1 - 0{,}62$</td><td>0,38</td></tr>
          <tr><td>cả 3 lần đều bị loại</td><td>$0{,}38^3$</td><td>≈ 0,055</td></tr>
          <tr><td>có câu được nhận</td><td>$1 - 0{,}38^3$</td><td>$\hl{0{,}945}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, cho bộ sinh thử tối đa 3 lần, và trả câu đầu tiên được nhận. Một lần bị loại có xác suất 1 trừ 0 phẩy 62, bằng 0 phẩy 38. Ba lần độc lập đều bị loại là 0 phẩy 38 mũ 3, khoảng 0 phẩy 055. Vậy khả năng có câu được nhận là 1 trừ số đó, khoảng 0 phẩy 945."
      - show: |
          <div class="box key">Kiểm chứng nâng độ đúng từ 60% lên 87,1%, và cho phép <b>từ chối trả lời</b> khi cả 3 lần đều không được nhận (khoảng 5,5%).</div>
        say: "Bước năm, rút ra kết luận. Kiểm chứng nâng độ đúng từ 60 lên 87 phẩy 1 phần trăm. Nó còn cho phép tác tử từ chối trả lời khi cả 3 lần đều không được nhận, khoảng 5 phẩy 5 phần trăm số câu hỏi."

  - id: check
    kind: check
    title: "Tự kiểm: đếm trên 1000 câu hỏi"
    checks:
      - "round(1000 * 0.6) == 600 and round(600 * 0.9) == 540 and round(400 * 0.2) == 80 and 540 + 80 == 620 and round(540 / 620, 3) == round(alg.verifier_precision(0.6, 0.9, 0.2), 3) == 0.871"
      - "round(0.62 + 0.38 * 0.62 + 0.38 ** 2 * 0.62, 3) == 0.945 == round(alg.best_of_n_verified(0.6, 0.9, 0.2, 3)[0], 3) and round(0.38 * 0.62, 4) == 0.2356 and round(0.38 ** 2 * 0.62, 4) == 0.0895"
    steps:
      - show: |
          <p><b>Cách 1 — đếm thẳng</b> trên 1000 câu hỏi, không dùng công thức:</p>
          <table class="t"><tr><th>nhóm</th><th>số câu</th><th>được nhận</th></tr>
          <tr><td>đúng</td><td>600</td><td>$0{,}9 \cdot 600 = 540$</td></tr>
          <tr><td>sai</td><td>400</td><td>$0{,}2 \cdot 400 = 80$</td></tr>
          <tr><td>cộng</td><td>1000</td><td>620 → đúng $\frac{540}{620} \approx 0{,}871$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng đường khác, cách thứ nhất là đếm thẳng trên 1000 câu hỏi, không dùng công thức. Có 600 câu đúng, bộ kiểm chứng nhận 90 phần trăm nên được 540 câu. Có 400 câu sai, nó nhận nhầm 80 câu. Cộng lại 620 câu được nhận, trong đó 540 chia 620 xấp xỉ 0 phẩy 871 là đúng, khớp với công thức."
      - clear: true
        show: |
          <p><b>Cách 2 — cộng từng lần thử</b> thay vì lấy phần bù:</p>
          <table class="t"><tr><th>được nhận ở</th><th>xác suất</th></tr>
          <tr><td>lần 1</td><td>0,62</td></tr>
          <tr><td>lần 2 (lần 1 bị loại)</td><td>$0{,}38 \cdot 0{,}62 \approx 0{,}2356$</td></tr>
          <tr><td>lần 3 (hai lần đầu bị loại)</td><td>$0{,}38^2 \cdot 0{,}62 \approx 0{,}0895$</td></tr></table>
          <p>Cộng: $\approx 0{,}945$ ✓ khớp $1 - 0{,}38^3$.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Cách thứ hai cộng xác suất được nhận ở từng lần thử, thay vì lấy phần bù. Được nhận ngay lần đầu là 0 phẩy 62. Được nhận ở lần hai thì lần đầu phải bị loại, nên là 0 phẩy 38 nhân 0 phẩy 62, khoảng 0 phẩy 2356. Được nhận ở lần ba thì hai lần đầu bị loại, khoảng 0 phẩy 0895. Cộng ba số lại được khoảng 0 phẩy 945, khớp với 1 trừ 0 phẩy 38 mũ 3."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "round(alg.verifier_precision(0.3, 0.9, 0.2), 3) == 0.659"
      - "[round(alg.best_of_n_verified(0.6, 0.9, 0.2, n)[0], 3) for n in (1, 3, 10)] == [0.62, 0.945, 1.0] and len({round(alg.best_of_n_verified(0.6, 0.9, 0.2, n)[1], 3) for n in (1, 3, 10)}) == 1"
      - "[round(sum(0.38 ** i for i in range(n)), 2) for n in (1, 3, 10)] == [1.0, 1.52, 1.61]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng cùng mô hình để kiểm chính nó <b class="red">(chung điểm mù)</b>
          <br><span class="note">Lỗi mà bộ sinh mắc vì hiểu sai đề thì bộ kiểm cùng mô hình thường cũng hiểu sai y hệt — tỉ lệ nhận nhầm thật cao hơn nhiều so với đo trên lỗi ngẫu nhiên. Ưu tiên kiểm bằng chương trình hoặc nguồn bên ngoài.</span></div>
        say: "Lỗi thứ nhất, dùng cùng mô hình để kiểm chính nó, nên chung điểm mù. Lỗi mà bộ sinh mắc vì hiểu sai đề thì bộ kiểm cùng mô hình thường cũng hiểu sai y hệt, nên tỉ lệ nhận nhầm thật cao hơn nhiều so với đo trên lỗi ngẫu nhiên. Hãy ưu tiên kiểm bằng chương trình hoặc nguồn bên ngoài."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên tỉ lệ nền khi bài khó <b class="red">(kiểm chứng kém đi)</b>
          <br><span class="note">Cùng bộ kiểm chứng, nếu bộ sinh chỉ đúng 30% thì trong các câu được nhận chỉ ≈ 65,9% là đúng. Bài càng khó, bộ kiểm chứng càng phải chặt.</span></div>
        say: "Lỗi thứ hai, quên tỉ lệ nền khi bài khó, nên kiểm chứng kém đi. Cùng bộ kiểm chứng đó, nếu bộ sinh chỉ đúng 30 phần trăm, thì trong các câu được nhận chỉ khoảng 65 phẩy 9 phần trăm là đúng. Bài càng khó, bộ kiểm chứng càng phải chặt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Phản tư không có thông tin mới <b class="red">(đổi câu đúng thành sai)</b>
          <br><span class="note">“Hãy xem lại” mà không kèm kết quả chạy thử, thông báo lỗi hay nguồn mới thì mô hình dễ chiều theo nghi ngờ. Phản tư có ích khi có <b>tín hiệu bên ngoài</b>.</span></div>
        say: "Lỗi thứ ba, phản tư mà không có thông tin mới, nên đổi câu đúng thành sai. Yêu cầu hãy xem lại mà không kèm kết quả chạy thử, thông báo lỗi hay nguồn mới thì mô hình dễ chiều theo nghi ngờ. Phản tư chỉ có ích khi có tín hiệu bên ngoài."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tăng số lần sinh để câu trả lời “đúng hơn” <b class="red">(độ đúng không tăng)</b>
          <br><span class="note">Người đã đi làm hay tăng từ 3 lên 10 lần sinh khi thấy câu sai. Nhưng câu trả ra luôn là câu đầu tiên được nhận, nên tỉ lệ đúng vẫn là 0,871. Muốn đúng hơn phải <b>giảm tỉ lệ nhận nhầm</b>.</span></div>
          <table class="t"><tr><th>số lần sinh tối đa</th><th>có câu trả ra</th><th>đúng trong số trả ra</th><th>số lần sinh trung bình</th></tr>
          <tr><td>1</td><td>0,620</td><td>0,871</td><td>1</td></tr>
          <tr><td>3</td><td>0,945</td><td>0,871</td><td>≈ 1,52</td></tr>
          <tr><td>10</td><td>≈ 1,000</td><td>0,871</td><td>≈ 1,61</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tăng số lần sinh với hy vọng câu trả lời đúng hơn. Thấy câu sai lọt ra, họ tăng từ 3 lên 10 lần sinh. Nhưng câu trả ra luôn là câu đầu tiên được nhận, nên tỉ lệ đúng trong số câu trả ra vẫn là 0 phẩy 871, muốn đúng hơn phải giảm tỉ lệ nhận nhầm. Bảng cho thấy cột đúng trong số trả ra đứng yên ở 0 phẩy 871. Chỉ một lần sinh thì trả lời được 62 phần trăm câu hỏi. Mười lần sinh thì gần như câu nào cũng có trả lời, với trung bình khoảng 1 phẩy 61 lần sinh mỗi câu, nhưng độ đúng không đổi."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.verifier_precision(0.6, 0.95, 0.05), 3) == 0.966"
      - "round(0.6 * 0.95, 2) == 0.57 and round(0.4 * 0.05, 2) == 0.02 and round(0.57 + 0.02, 2) == 0.59 and round(400 * 0.2) == 80 and round(400 * 0.05) == 20 and 80 // 20 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bộ sinh đúng 60%. Một bộ kiểm thử tự động nhận đúng 95% câu đúng, nhận nhầm 5% câu sai. Trong các câu được nhận, bao nhiêu phần trăm đúng?</td></tr>
          <tr><td>2</td><td>Vì sao bộ kiểm thử tự động này tốt hơn bộ kiểm chứng ở ví dụ dù tỉ lệ nhận đúng gần bằng nhau? Nên chọn bộ nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bộ sinh đúng 60 phần trăm. Một bộ kiểm thử tự động nhận đúng 95 phần trăm câu đúng và nhận nhầm 5 phần trăm câu sai. Trong các câu được nhận, bao nhiêu phần trăm là đúng? Câu hai, vì sao bộ kiểm thử tự động này tốt hơn bộ kiểm chứng ở ví dụ, dù tỉ lệ nhận đúng gần bằng nhau? Nên chọn bộ nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Câu đúng được nhận: $0{,}6 \cdot 0{,}95 = 0{,}57$. Câu sai lọt qua: $0{,}4 \cdot 0{,}05 = 0{,}02$.</p>
          <p>Đúng trong số được nhận: $\frac{0{,}57}{0{,}57 + 0{,}02} = \frac{0{,}57}{0{,}59} \approx \hl{96{,}6\%}$.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, làm theo đúng các bước của ví dụ. Câu đúng được nhận là 0 phẩy 6 nhân 0 phẩy 95, bằng 0 phẩy 57, câu sai lọt qua là 0 phẩy 4 nhân 0 phẩy 05, bằng 0 phẩy 02. Vậy tỉ lệ đúng là 0 phẩy 57 chia 0 phẩy 59, khoảng 96 phẩy 6 phần trăm."
      - show: |
          <table class="t"><tr><th>trên 400 câu sai</th><th>nhận nhầm</th><th>câu sai lọt qua</th></tr>
          <tr><td>bộ kiểm chứng ở ví dụ</td><td>20%</td><td>80</td></tr>
          <tr><td>bộ kiểm thử tự động</td><td>5%</td><td>$\hl{20}$</td></tr></table>
          <p>② Tỉ lệ nhận đúng gần nhau (90% và 95%), nhưng số câu sai lọt qua giảm 4 lần → <b>chọn bộ kiểm thử tự động</b>.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, đếm trên 400 câu sai của 1000 câu hỏi. Bộ kiểm chứng ở ví dụ nhận nhầm 20 phần trăm, nên để lọt 80 câu sai. Bộ kiểm thử tự động chỉ nhận nhầm 5 phần trăm, nên chỉ lọt 20 câu sai. Tỉ lệ nhận đúng hai bên gần nhau, nhưng số câu sai lọt qua giảm 4 lần, nên ta chọn bộ kiểm thử tự động."

