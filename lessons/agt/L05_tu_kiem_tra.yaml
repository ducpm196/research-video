2e2" stroke="#1f2937" stroke-width="1"/><rect x="972" y="204" width="40" height="40" rx="5" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><rect x="972" y="252" width="40" height="40" rx="5" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><g font-size="22" fill="#1f2937"><text x="60" y="40">60 câu đúng (xanh)</text><text x="636" y="40" fill="#b91c1c">40 câu sai (đỏ)</text><text x="60" y="340">ô đậm = bộ kiểm chứng NHẬN, ô nhạt = bị loại</text><text x="1050" y="90" fill="#2a78d6">đúng được nhận: 54</text><text x="1050" y="140" fill="#b91c1c">sai lọt qua: 8</text><text x="1050" y="190">được nhận: 54 + 8 = 62</text><text x="1050" y="240" fill="#059669">đúng trong số nhận: 54/62</text></g></svg></div>
