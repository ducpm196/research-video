id: L01
course: AGT
series: "AGT · AI agent"
title: "Bài 1 — Gọi công cụ: lược đồ, kiểm tra tham số, lỗi và thử lại"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/agt.yaml L01; audit/agt/verify_agt.py L01; T. Schick và cộng sự, Toolformer (2023); JSON Schema (json-schema.org, bản 2020-12); OWASP Top 10 for LLM Applications, bản 2025 (genai.owasp.org, truy cập 2026-11-09, no revision given) — LLM05:2025 Improper Output Handling (bản 2023 v1.1 gọi LLM02 Insecure Output Handling); IETF draft-ietf-httpapi-idempotency-key-header (khoá lũy đẳng, bản nháp, chưa thành RFC); SEC bài 6 (lỗ hổng chèn); SAR bài 9 (lũy đẳng)"
assumes: [arith]
# Quy ước: lược đồ tối giản {tên tham số: (kiểu, điều kiện)}; alg.check_args(tham số, lược đồ) trả (hợp lệ?, lỗi): thiếu, thừa, sai kiểu, ngoài miền.
#   Công cụ ví dụ “chuyển tiền(so_tien, tai_khoan)”: số tiền là số nguyên 1 … 10 000 000, tài khoản là chuỗi đúng 10 chữ số. Tên JSON Schema chỉ trên màn hình.
objectives:
  - "Viết lược đồ tham số cho công cụ"
  - "Kiểm tham số trước khi thực thi"
  - "Thử lại an toàn"
asr_reviewed:
  - {sentence: "Còn chuỗi chữ 1000, viết trong ngoặc kép, cộng với chính nó thì máy nối hai chuỗi lại, thành một dãy tám chữ số 10001000, chứ không phải 2000.", reason: "ASR chép “Còn chủ chữ 1000, viết trong hoạt kết, cộng với chính nó thì máy nối 2 chủ lại, thành một dạy 8 chữ số 1000000, chứ không phải 2000.” (0.754): chữ w đọc “vê kép” (luật chung), ASR viết tách chữ; lệch âm/thanh thuần Việt: chuỗi/chủ, ngoặc (trong “ngoặc kép” → “hoạt kết”), chuỗi/chủ, dãy/dạy, mười/một, không trăm linh một nghìn/∅ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mô hình gọi chuyển tiền với số âm"
    checks:
      - "alg.check_args({'so_tien': -200, 'tai_khoan': '0123456789'}, {'so_tien': (int, lambda v: 0 < v <= 10_000_000), 'tai_khoan': (str, lambda v: len(v) == 10 and v.isdigit())}) == (False, ['so_tien ngoài miền'])"
    steps:
      - show: |
          <p>Tác tử kế toán đề xuất lời gọi <code>chuyen_tien(so_tien=-200, tai_khoan="0123456789")</code>. Nếu công cụ chạy thẳng, một khoản <b>âm</b> có thể thành “rút ngược”. Mô hình sinh tham số như sinh chữ — đúng thường xuyên, nhưng không phải luôn luôn.</p>
          <div class="box key">Hôm nay: <b>gọi công cụ</b> — mô tả bằng <b>lược đồ</b>, <b>kiểm tham số</b> trước khi chạy, và thử lại không gây hại.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, tác tử kế toán đề xuất một lời gọi chuyển tiền với số tiền âm 200. Nếu công cụ chạy thẳng, một khoản âm có thể thành rút ngược. Mô hình sinh tham số như sinh chữ, đúng thường xuyên, nhưng không phải luôn luôn. Hôm nay ta học gọi công cụ, mô tả bằng lược đồ, kiểm tham số trước khi chạy, và thử lại mà không gây hại."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: kiểu dữ liệu và miền giá trị"
    checks:
      - "'1000' + '1000' == '10001000' and 1000 + 1000 == 2000"
      - "[0 < v <= 10_000_000 for v in (-200, 0, 500000, 20_000_000)] == [False, False, True, False] and len('0123456789') == 10 and len('98765') == 5"
    steps:
      - show: |
          <table class="t"><tr><th>giá trị</th><th>kiểu</th><th>cộng với chính nó</th></tr>
          <tr><td><code>1000</code></td><td>số nguyên</td><td>2000</td></tr>
          <tr><td><code>"1000"</code> (có ngoặc kép)</td><td>chuỗi chữ</td><td><code>"10001000"</code> — nối chữ, không phải cộng</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ôn khái niệm kiểu dữ liệu, vì cùng một dãy kí tự có thể mang nghĩa rất khác nhau. Số nguyên 1000 cộng với chính nó thì được 2000. Còn chuỗi chữ 1000, viết trong ngoặc kép, cộng với chính nó thì máy nối hai chuỗi lại, thành một dãy tám chữ số 10001000, chứ không phải 2000."
      - show: |
          <p><b>Miền</b> là khoảng giá trị được phép. Số tiền phải là số nguyên từ 1 tới 10 000 000:</p>
          <table class="t"><tr><th>số tiền</th><th>trong miền?</th></tr>
          <tr><td>−200</td><td>không (âm)</td></tr><tr><td>0</td><td>không</td></tr>
          <tr><td>500 000</td><td>có</td></tr><tr><td>20 000 000</td><td>không (quá trần)</td></tr></table>
          <p>Tài khoản phải đủ <b>10 chữ số</b>: <code>"0123456789"</code> đủ 10, <code>"98765"</code> chỉ có 5.</p>
        focus: [1, "2.2", "2.4", 3]
        say: "Điều thứ hai là miền, tức khoảng giá trị được phép, ở đây số tiền phải từ 1 tới 10 triệu. Thử từng số trong bảng, âm 200 và số 0 đều không thuộc miền vì nhỏ hơn 1. Số 500 nghìn nằm trong miền, còn 20 triệu vượt quá trần 10 triệu nên bị loại. Tài khoản phải có đúng 10 chữ số, nên chuỗi 0123456789 đạt, còn chuỗi 98765 chỉ có 5 chữ số thì không đạt."

  - id: sym
    kind: symbol
    title: "Giải mã: mô tả công cụ và lược đồ"
    steps:
      - show: |
          <table class="t"><tr><th>phần</th><th>ví dụ</th></tr>
          <tr><td>tên</td><td><code>chuyen_tien</code></td></tr>
          <tr><td>mô tả cho mô hình đọc</td><td>“Chuyển tiền tới tài khoản trong nước. Chỉ dùng khi người dùng đã nêu rõ số tiền.”</td></tr>
          <tr><td>lược đồ tham số</td><td><code>so_tien</code>: số nguyên 1 … 10 000 000; <code>tai_khoan</code>: chuỗi đúng 10 chữ số; không có tham số khác</td></tr></table>
          <p>Luồng: mô hình đề xuất lời gọi → <b>chương trình</b> kiểm theo lược đồ → hợp lệ mới thực thi → kết quả (hoặc lỗi rõ ràng) trả lại cho mô hình đọc.</p>
          <p class="note">Trong thực tế, lược đồ của công cụ thường được viết theo chuẩn <b>JSON Schema</b> (bản 2020-12).</p>
        focus: [1, "1.2", "1.3", "1.4", "1.4", 2, 3]
        say: "Bảng mô tả một công cụ bằng ba phần. Tên là chuyển tiền. Mô tả cho mô hình đọc nói công cụ làm gì và khi nào được dùng. Lược đồ tham số là bản mô tả có cấu trúc về kiểu và miền của từng tham số. Ở đây nó nói số tiền là số nguyên từ 1 tới 10 triệu, tài khoản là chuỗi đúng 10 chữ số, và không có tham số nào khác. Luồng đi như sau, mô hình đề xuất lời gọi, chương trình kiểm theo lược đồ, hợp lệ mới thực thi, rồi kết quả hoặc lỗi rõ ràng được trả lại cho mô hình đọc. Trong thực tế, lược đồ của công cụ thường được viết theo một chuẩn chung, tên ghi trên màn hình."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một cái cổng giữa mô hình và công cụ"
    checks:
      - "(lambda r: sum(r) == 1 and len(r) - sum(r) == 3)([alg.check_args(c, {'so_tien': (int, lambda v: 0 < v <= 10_000_000), 'tai_khoan': (str, lambda v: len(v) == 10 and v.isdigit())})[0] for c in ({'so_tien': 500000, 'tai_khoan': '0123456789'}, {'so_tien': -200, 'tai_khoan': '0123456789'}, {'so_tien': '1000', 'tai_khoan': '98765'}, {'so_tien': 1000, 'tai_khoan': '9876543210', 'ghi_chu': 'x'})])"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><defs><marker id="arA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="60" y="60" width="320" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="220" y="102" font-size="27" font-weight="bold" text-anchor="middle" fill="#1f2937">MÔ HÌNH</text><text x="220" y="138" font-size="20" text-anchor="middle" fill="#1f2937">đề xuất 4 lời gọi</text><rect x="560" y="60" width="360" height="110" rx="14" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="740" y="102" font-size="27" font-weight="bold" text-anchor="middle" fill="#1f2937">BỘ KIỂM</text><text x="740" y="138" font-size="20" text-anchor="middle" fill="#1f2937">theo lược đồ</text><rect x="1110" y="30" width="330" height="110" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1275" y="72" font-size="27" font-weight="bold" text-anchor="middle" fill="#1f2937">CÔNG CỤ</text><text x="1275" y="108" font-size="20" text-anchor="middle" fill="#1f2937">thực thi 1 lời gọi</text><rect x="1110" y="220" width="330" height="110" rx="14" fill="#fee2e2" stroke="#1f2937" stroke-width="3"/><text x="1275" y="262" font-size="27" font-weight="bold" text-anchor="middle" fill="#1f2937">LỖI RÕ RÀNG</text><text x="1275" y="298" font-size="20" text-anchor="middle" fill="#1f2937">3 lời gọi bị chặn</text><g fill="none" stroke-width="3"><line x1="382" y1="115" x2="555" y2="115" stroke="#1f2937" marker-end="url(#arA1)"/><line x1="922" y1="100" x2="1105" y2="85" stroke="#059669" marker-end="url(#arA1)"/><line x1="922" y1="140" x2="1105" y2="270" stroke="#b91c1c" marker-end="url(#arA1)"/><path d="M1110,300 C800,370 400,360 220,175" stroke="#b91c1c" stroke-dasharray="12 10" marker-end="url(#arA1)"/></g><g font-size="21"><text x="1010" y="72" text-anchor="middle" fill="#059669">hợp lệ</text><text x="930" y="250" text-anchor="end" fill="#b91c1c">không hợp lệ</text><text x="720" y="290" text-anchor="middle" fill="#b91c1c">trả lỗi để mô hình tự sửa lời gọi</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một cái cổng đặt giữa mô hình và công cụ. Mô hình chỉ đề xuất lời gọi, ở ví dụ hôm nay là 4 lời gọi, và cả 4 phải đi qua bộ kiểm theo lược đồ. Lời gọi hợp lệ đi theo mũi tên xanh tới công cụ để thực thi, và chỉ có 1 lời gọi như vậy. Ba lời gọi còn lại đi theo mũi tên đỏ, bị chặn lại, và một thông báo lỗi rõ ràng được trả về để mô hình tự sửa lời gọi của mình."

  - id: example
    kind: example
    title: "Bốn lời gọi qua bộ kiểm"
    checks:
      - "[alg.check_args(c, {'so_tien': (int, lambda v: 0 < v <= 10_000_000), 'tai_khoan': (str, lambda v: len(v) == 10 and v.isdigit())}) for c in ({'so_tien': 500000, 'tai_khoan': '0123456789'}, {'so_tien': -200, 'tai_khoan': '0123456789'}, {'so_tien': '1000', 'tai_khoan': '98765'}, {'so_tien': 1000, 'tai_khoan': '9876543210', 'ghi_chu': 'x'})] == [(True, []), (False, ['so_tien ngoài miền']), (False, ['so_tien sai kiểu', 'tai_khoan ngoài miền']), (False, ['thừa ghi_chu'])]"
    steps:
      - show: |
          <p><b>Bước 1</b> — <code>so_tien=500000, tai_khoan="0123456789"</code>: đủ hai tham số, 500 000 là số nguyên trong miền, tài khoản đủ 10 chữ số → <span class="green">hợp lệ, thực thi</span>.</p>
        say: "Bước một, lời gọi có số tiền 500 nghìn và tài khoản 0123456789. Lời gọi có đủ hai tham số, số tiền là số nguyên nằm trong miền, tài khoản có đủ 10 chữ số, nên hợp lệ và được thực thi."
      - show: |
          <p><b>Bước 2</b> — <code>so_tien=-200, tai_khoan="0123456789"</code>: đúng kiểu, nhưng −200 nhỏ hơn 1 → <span class="red">số tiền ngoài miền</span>, không chạy.</p>
        say: "Bước hai, lời gọi có số tiền âm 200. Kiểu thì đúng là số nguyên, nhưng âm 200 nhỏ hơn 1, nên số tiền nằm ngoài miền và lời gọi không được chạy."
      - show: |
          <p><b>Bước 3</b> — <code>so_tien="1000", tai_khoan="98765"</code>: hai lỗi cùng lúc.</p>
          <table class="t"><tr><th>tham số</th><th>vấn đề</th></tr>
          <tr><td><code>so_tien</code></td><td class="red">sai kiểu: chuỗi, không phải số nguyên</td></tr>
          <tr><td><code>tai_khoan</code></td><td class="red">ngoài miền: 5 chữ số, cần 10</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, lời gọi này mắc hai lỗi cùng lúc, và bộ kiểm báo cả hai để mô hình sửa một lần. Số tiền được viết trong ngoặc kép, nên là chuỗi chứ không phải số nguyên, tức là sai kiểu. Tài khoản chỉ có 5 chữ số trong khi cần đúng 10, nên nằm ngoài miền."
      - show: |
          <p><b>Bước 4</b> — <code>so_tien=1000, tai_khoan="9876543210", ghi_chu="x"</code>: hai tham số đều đúng, nhưng <code>ghi_chu</code> không có trong lược đồ → <span class="red">tham số thừa</span>.</p>
        say: "Bước bốn, lời gọi có số tiền 1000 và tài khoản đủ 10 chữ số, cả hai đều đúng. Nhưng nó có thêm tham số ghi chú, không có trong lược đồ, nên bị chặn vì tham số thừa."
      - clear: true
        show: |
          <table class="t"><tr><th>lời gọi</th><th>kết quả kiểm</th></tr>
          <tr><td>1: 500 000</td><td class="green">hợp lệ → thực thi</td></tr>
          <tr><td>2: −200</td><td class="red">số tiền ngoài miền</td></tr>
          <tr><td>3: "1000", "98765"</td><td class="red">sai kiểu; tài khoản ngoài miền</td></tr>
          <tr><td>4: thêm ghi_chu</td><td class="red">tham số thừa</td></tr></table>
          <p><b>Bước 5</b> — lỗi được trả về cho mô hình bằng lời rõ ràng (“số tiền phải là số nguyên dương”) để nó sửa lời gọi — <b>không</b> tự đoán sửa giùm.</p>
        focus: [1, 2]
        say: "Bảng gom lại kết quả, chỉ 1 trong 4 lời gọi được thực thi, còn 3 lời gọi bị chặn với lý do cụ thể. Bước năm, lỗi được trả về cho mô hình bằng lời rõ ràng, chẳng hạn số tiền phải là số nguyên dương, để nó tự sửa lời gọi, chứ chương trình không tự đoán sửa giùm."

  - id: check
    kind: check
    title: "Tự kiểm: dò từng điều kiện bằng tay"
    checks:
      - "(lambda C: [[('so_tien' in c and 'tai_khoan' in c), (type(c.get('so_tien')) is int and type(c.get('tai_khoan')) is str), (type(c.get('so_tien')) is int and 0 < c['so_tien'] <= 10_000_000 and len(str(c.get('tai_khoan'))) == 10), set(c) <= {'so_tien', 'tai_khoan'}] for c in C] == [[True, True, True, True], [True, True, False, True], [True, False, False, True], [True, True, True, False]])(({'so_tien': 500000, 'tai_khoan': '0123456789'}, {'so_tien': -200, 'tai_khoan': '0123456789'}, {'so_tien': '1000', 'tai_khoan': '98765'}, {'so_tien': 1000, 'tai_khoan': '9876543210', 'ghi_chu': 'x'}))"
    steps:
      - show: |
          <p>Cách khác: không dùng bộ kiểm, tự dò <b>bốn điều kiện</b> cho từng lời gọi; chỉ lời gọi đạt cả bốn mới được chạy.</p>
          <table class="t"><tr><th>lời gọi</th><th>đủ tham số</th><th>đúng kiểu</th><th>trong miền</th><th>không thừa</th></tr>
          <tr><td>1</td><td>đạt</td><td>đạt</td><td>đạt</td><td>đạt</td></tr>
          <tr><td>2</td><td>đạt</td><td>đạt</td><td class="red">hỏng</td><td>đạt</td></tr>
          <tr><td>3</td><td>đạt</td><td class="red">hỏng</td><td class="red">hỏng</td><td>đạt</td></tr>
          <tr><td>4</td><td>đạt</td><td>đạt</td><td>đạt</td><td class="red">hỏng</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", 2]
        say: "Kiểm bằng đường khác, ta không dùng bộ kiểm mà tự dò bốn điều kiện cho từng lời gọi, vì lời gọi chỉ được chạy khi đạt cả bốn. Lời gọi một đạt cả bốn cột. Lời gọi hai chỉ hỏng ở cột trong miền. Lời gọi ba hỏng hai cột, đúng kiểu và trong miền. Lời gọi bốn chỉ hỏng ở cột không thừa. Đếm lại, đúng 1 hàng đạt hết, khớp với kết quả của bộ kiểm."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, kể cả khi đã đi làm"
    checks:
      - "abs(-200) == 200 and min(20_000_000, 10_000_000) == 10_000_000 and int('1000') == 1000"
      - "[alg.check_args(c, {'so_tien': (int, lambda v: 0 < v <= 10_000_000), 'tai_khoan': (str, lambda v: len(v) == 10 and v.isdigit())})[0] for c in ({'so_tien': -200, 'tai_khoan': '0123456789'}, {'so_tien': 20_000_000, 'tai_khoan': '0123456789'}, {'so_tien': '1000', 'tai_khoan': '0123456789'})] == [False, False, False]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin tham số mô hình sinh ra <b class="red">(đầu vào không tin cậy)</b>
          <br><span class="note">Tham số có thể chứa chuỗi <b>chèn truy vấn</b> (chữ viết sao cho khi ghép vào câu lệnh cơ sở dữ liệu thì thành một lệnh khác) hay lệnh hệ thống, nhất là khi mô hình vừa đọc trang web lạ. Kiểm như dữ liệu người dùng: <b>tham số hoá truy vấn</b> (gửi câu lệnh và giá trị riêng, để giá trị không bao giờ bị đọc như lệnh), không ghép vào lệnh.</span></div>
        say: "Lỗi thứ nhất, tin tham số mô hình sinh ra, trong khi đó là đầu vào không tin cậy. Tham số có thể chứa chuỗi chèn truy vấn hay lệnh hệ thống, nhất là khi mô hình vừa đọc một trang web lạ. Chèn truy vấn là chữ được viết sao cho khi ghép vào câu lệnh cơ sở dữ liệu thì biến thành một lệnh khác. Hãy kiểm như dữ liệu người dùng, và không ghép tham số vào lệnh. Cách đúng là tham số hoá truy vấn, tức gửi câu lệnh và giá trị riêng, để giá trị không bao giờ bị đọc như lệnh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Thử lại công cụ không lũy đẳng <b class="red">(chuyển tiền hai lần)</b>
          <br><span class="note">Việc <b>lũy đẳng</b> là việc làm hai lần cho cùng kết quả như làm một lần: “đặt đèn ở trạng thái bật” là lũy đẳng, “chuyển 500 000” thì không. Lời gọi hết giờ chưa chắc đã thất bại. Gửi kèm <b>khoá lũy đẳng</b>, một mã duy nhất cho mỗi yêu cầu: máy chủ có hỗ trợ thì nhớ mã đã làm, nhận lại cùng mã sẽ không thực hiện lần hai.</span></div>
        say: "Lỗi thứ hai, thử lại một công cụ không lũy đẳng, nên có thể chuyển tiền hai lần. Việc lũy đẳng là việc làm hai lần cho cùng kết quả như làm một lần. Đặt đèn ở trạng thái bật là lũy đẳng, còn chuyển 500 nghìn thì không, vì làm hai lần là mất gấp đôi tiền. Lời gọi hết giờ chưa chắc đã thất bại. Hãy gửi kèm khoá lũy đẳng, là một mã duy nhất cho mỗi yêu cầu. Máy chủ có hỗ trợ thì nhớ mã đã làm, nên nhận lại cùng mã sẽ không thực hiện lần hai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Mô tả công cụ mơ hồ <b class="red">(chọn sai công cụ)</b>
          <br><span class="note">“Xử lý đơn hàng” không nói rõ là xem, sửa hay huỷ. Mô tả phải nói công cụ làm gì, KHI NÀO dùng, khi nào KHÔNG dùng, và ví dụ tham số.</span></div>
        say: "Lỗi thứ ba, mô tả công cụ mơ hồ, nên mô hình chọn sai công cụ. Một mô tả như xử lý đơn hàng không nói rõ là xem, sửa hay huỷ. Mô tả phải nói công cụ làm gì, khi nào dùng, khi nào không dùng, và có ví dụ tham số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Bộ kiểm “dễ tính” tự sửa giùm cho đỡ báo lỗi <b class="red">(chạy điều không ai yêu cầu)</b>
          <br><span class="note">Người đã đi làm muốn giảm số lời gọi bị từ chối nên viết thêm đoạn “sửa nhẹ”: lấy trị tuyệt đối, cắt về trần, ép chuỗi thành số. Mỗi lần sửa như vậy là một quyết định thay người dùng.</span></div>
          <table class="t"><tr><th>tham số mô hình đưa</th><th>“sửa giùm” thành</th><th>hậu quả</th></tr>
          <tr><td>−200</td><td>200</td><td class="red">chuyển 200 mà không ai yêu cầu</td></tr>
          <tr><td>20 000 000</td><td>10 000 000</td><td class="red">chuyển con số người dùng không nói</td></tr>
          <tr><td>"1000"</td><td>1000</td><td>che mất lỗi của mô hình, khó dò về sau</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4", 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, viết một bộ kiểm dễ tính, tự sửa giùm cho đỡ báo lỗi. Họ muốn giảm số lời gọi bị từ chối, nên thêm đoạn sửa nhẹ như lấy trị tuyệt đối, cắt về trần, hay ép chuỗi thành số. Bảng cho thấy hậu quả của từng cách sửa. Âm 200 bị đổi thành 200, nên tiền được chuyển dù không ai yêu cầu khoản đó. Hai mươi triệu bị cắt về 10 triệu, cũng là một con số người dùng chưa hề nói. Ép chuỗi 1000 thành số trông vô hại, nhưng che mất lỗi của mô hình nên về sau rất khó dò. Chuyên gia từ chối và trả lỗi rõ ràng, vì mỗi lần sửa giùm là một quyết định thay người dùng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[alg.check_args(c, {'so_tien': (int, lambda v: 0 < v <= 10_000_000), 'tai_khoan': (str, lambda v: len(v) == 10 and v.isdigit())})[1] for c in ({'so_tien': 20_000_000, 'tai_khoan': '0123456789'}, {'tai_khoan': '0123456789'})] == [['so_tien ngoài miền'], ['thiếu so_tien']]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Lời gọi <code>so_tien=20000000, tai_khoan="0123456789"</code> và lời gọi chỉ có <code>tai_khoan="0123456789"</code>: bộ kiểm báo gì?</td></tr>
          <tr><td>2</td><td>Công cụ “gửi thư” hết giờ không phản hồi. Cách thử lại an toàn là gì?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một lời gọi có số tiền 20 triệu, và một lời gọi chỉ có tài khoản, bộ kiểm báo gì? Câu hai, công cụ gửi thư hết giờ không phản hồi, cách thử lại an toàn là gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>lời gọi</th><th>dò điều kiện</th><th>bộ kiểm báo</th></tr>
          <tr><td>20 000 000, tài khoản đủ 10 số</td><td>đủ, đúng kiểu, nhưng 20 000 000 &gt; 10 000 000</td><td class="red">số tiền ngoài miền</td></tr>
          <tr><td>chỉ có tài khoản</td><td>không có <code>so_tien</code></td><td class="red">thiếu số tiền</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, ta dò từng điều kiện như trong bảng. Lời gọi đầu đủ tham số và đúng kiểu, nhưng 20 triệu lớn hơn trần 10 triệu, nên bộ kiểm báo số tiền ngoài miền. Lời gọi sau hoàn toàn không có tham số số tiền, nên bộ kiểm báo thiếu số tiền."
      - show: |
          <p>② Hết giờ <b>chưa chắc</b> là thất bại — thư có thể đã đi.</p>
          <table class="t"><tr><th>bước</th><th>làm gì</th></tr>
          <tr><td>1</td><td>gửi kèm khoá lũy đẳng (mã thư duy nhất)</td></tr>
          <tr><td>2</td><td>hỏi trạng thái bằng chính khoá đó; nếu chưa gửi thì gửi lại <b>với cùng khoá</b> (máy chủ đã làm thì không làm lần hai)</td></tr>
          <tr><td>3</td><td>không biết chắc → hỏi người dùng, không gửi lại mù</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", "2.4"]
        say: "Câu hai, trước hết nhớ rằng hết giờ chưa chắc là thất bại, vì thư có thể đã được gửi đi rồi. Vì vậy lời gọi phải gửi kèm khoá lũy đẳng, là một mã thư duy nhất. Sau đó tác tử hỏi trạng thái bằng chính khoá đó. Nếu thư chưa đi thì gửi lại với cùng khoá, vì máy chủ đã làm thì sẽ không làm lần hai. Nếu vẫn không biết chắc, quyết định đúng là hỏi người dùng, thay vì gửi lại mù và có thể gửi thư hai lần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mô tả rõ: làm gì, khi nào dùng</span><span class="a">→</span>
          <span class="n">lược đồ: kiểu, miền, không thừa</span><span class="a">→</span>
          <span class="n">chương trình kiểm trước khi chạy</span><span class="a">→</span>
          <span class="n">lỗi rõ ràng, thử lại có khoá lũy đẳng</span></div>
        say: "Tổng kết lại, mô tả công cụ rõ ràng, làm gì và khi nào dùng. Lược đồ nêu kiểu, miền, và không cho tham số thừa. Chương trình kiểm trước khi chạy, trả lỗi rõ ràng, và thử lại bằng khoá lũy đẳng."
      - show: |
          <div class="box key"><b>Tư duy:</b> mô hình <b>đề xuất</b>, chương trình <b>quyết định</b> — ranh giới giữa hai thứ là nơi đặt mọi phép kiểm.</div>
        say: "Điều cần mang theo, mô hình đề xuất, còn chương trình quyết định, và ranh giới giữa hai thứ là nơi đặt mọi phép kiểm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>lập kế hoạch</b> và phân rã nhiệm vụ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học lập kế hoạch và phân rã nhiệm vụ. Hẹn gặp bạn ở bài tiếp theo."
