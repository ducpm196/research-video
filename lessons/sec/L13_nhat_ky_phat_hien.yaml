id: L13
course: SEC
series: "SEC · An toàn thông tin"
title: "Bài 13 — Ghi nhật ký an ninh, phát hiện xâm nhập và tỉ lệ nền"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sec.yaml L13; audit/sec/verify_sec.py L13; S. Axelsson, The Base-Rate Fallacy and the Difficulty of Intrusion Detection, ACM TISSEC 3(3) (2000); OWASP Logging Cheat Sheet; NIST SP 800-92, Guide to Computer Security Log Management (2006); DSC bài 11 (định lý Bayes)"
assumes: [arith, frac]
# Quy ước: alg.alert_precision(tỉ lệ bắt được, tỉ lệ báo nhầm, tỉ lệ nền) = tỉ lệ cảnh báo là thật, theo định lý Bayes (DSC bài 11).
#   Ví dụ trên 1 000 000 sự kiện: 100 tấn công thật, bắt 99; 999 900 sự kiện bình thường, báo nhầm 1% = 9 999.
objectives:
  - "Chọn sự kiện cần ghi và điều không được ghi"
  - "Tính tỉ lệ cảnh báo là thật khi tấn công hiếm"
  - "Giảm cảnh báo nhầm có hệ thống"
asr_reviewed:
  - {sentence: "Lỗi thứ hai, chỉ nhìn tỉ lệ bắt được mà quên tỉ lệ nền.", reason: "ASR chép “Lỗi thứ hai, chỉ nhìn tỷ lệ bắt được mà quên tỷ lệ nên.” (0.786): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: nền/nên — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bắt 99%, nhưng 99 trong 100 cảnh báo là nhầm"
    checks:
      - "round(alg.alert_precision(0.99, 0.01, 1e-4) * 100, 2) == 0.98"
    steps:
      - show: |
          <p>Bộ phát hiện xâm nhập mới: bắt được 99% tấn công, chỉ báo nhầm 1% sự kiện bình thường. Nghe rất tốt. Một tuần sau, đội trực bỏ qua mọi cảnh báo — vì gần như tất cả đều nhầm. Khi tấn công thật đến, không ai nhìn.</p>
          <div class="box key">Hôm nay: <b>ghi nhật ký an ninh</b>, <b>phát hiện xâm nhập</b>, và <b>tỉ lệ nền</b> — vì sao bộ phát hiện tốt vẫn ngập cảnh báo nhầm.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, bộ phát hiện xâm nhập mới bắt được 99 phần trăm tấn công, và chỉ báo nhầm 1 phần trăm sự kiện bình thường. Nghe rất tốt. Một tuần sau, đội trực bỏ qua mọi cảnh báo, vì gần như tất cả đều nhầm. Khi tấn công thật đến, không ai nhìn. Hôm nay ta học ghi nhật ký an ninh, phát hiện xâm nhập, và tỉ lệ nền, vì sao bộ phát hiện tốt vẫn ngập cảnh báo nhầm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm, một phần mấy, và tỉ lệ trong một nhóm"
    checks:
      - "round(999900 * 0.01) == 9999 and 1_000_000 // 10_000 == 100"
      - "2 / 10 == 0.2 and 3 / (3 + 7) == 0.3"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>
          <tr><td>một phần mấy của một số</td><td>$\frac{1}{10\,000}$ của 1 000 000 là 100</td></tr>
          <tr><td>phần trăm của một số</td><td>1% của 999 900 là 9 999</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn hai phép tính bài này sẽ dùng. Lấy 1 phần 10 nghìn của 1 triệu, ta được 100. Lấy 1 phần trăm của 999 nghìn 900, ta được 9 nghìn 999."
      - show: |
          <p>Tỉ lệ trong một nhóm = số phần tử ta quan tâm chia <b>cả nhóm</b>. Giỏ có 3 quả hỏng và 7 quả tốt → tỉ lệ hỏng $\frac{3}{3 + 7} = \hl{30\%}$.</p>
          <p class="note">Ở khoá Khoa học dữ liệu, định lý Bayes cho đúng tỉ lệ này bằng công thức; hôm nay ta đếm thẳng.</p>
        focus: [1, 1, 2]
        say: "Điều thứ ba là tỉ lệ trong một nhóm, bằng số phần tử ta quan tâm chia cho cả nhóm. Giỏ có 3 quả hỏng và 7 quả tốt, tỉ lệ hỏng là 3 chia 10, bằng 30 phần trăm. Ở khoá Khoa học dữ liệu, định lý Bayes cho đúng tỉ lệ này bằng công thức, còn hôm nay ta đếm thẳng."

  - id: sym
    kind: symbol
    title: "Giải mã: ghi gì, không ghi gì, và tỉ lệ nền"
    steps:
      - show: |
          <table class="t"><tr><th>nên ghi</th><th>không được ghi</th></tr>
          <tr><td>đăng nhập thành công, thất bại; đổi quyền; thao tác quản trị; truy cập dữ liệu nhạy cảm; lỗi kiểm quyền</td><td>mật khẩu, mã phiên, mã một lần, số thẻ đầy đủ, khoá bí mật</td></tr></table>
          <p>Mỗi dòng có: <b>thời điểm</b>, <b>ai</b>, <b>làm gì</b>, <b>trên đối tượng nào</b>, <b>kết quả</b>, địa chỉ nguồn.</p>
          <p><b>Tỉ lệ nền</b>: phần sự kiện thật sự là tấn công. Tỉ lệ cảnh báo là thật $= \frac{\text{bắt được} \times \text{nền}}{\text{bắt được} \times \text{nền} + \text{báo nhầm} \times (1 - \text{nền})}$.</p>
        focus: [1, "1.2", "1.2", 2, 3, 3]
        say: "Bảng này chia làm hai cột, điều nên ghi và điều không được ghi. Nên ghi đăng nhập thành công và thất bại, đổi quyền, thao tác quản trị, truy cập dữ liệu nhạy cảm, và lỗi kiểm quyền. Không được ghi mật khẩu, mã phiên, mã một lần, số thẻ đầy đủ hay khoá bí mật. Mỗi dòng nhật ký có thời điểm, ai, làm gì, trên đối tượng nào, kết quả, và địa chỉ nguồn. Tỉ lệ nền là phần sự kiện thật sự là tấn công. Tỉ lệ cảnh báo là thật bằng tích bắt được và nền, chia cho tích đó cộng tích báo nhầm và phần còn lại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cảnh báo thật chìm trong cảnh báo nhầm"
    checks:
      - "99 + 9999 == 10098 and round(1300 * 99 / 10098) == 13"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g fill="#1f2937"><rect x="600" y="20" width="300" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="68" text-anchor="middle" font-size="26">1 000 000 sự kiện</text><rect x="180" y="150" width="300" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="330" y="198" text-anchor="middle" font-size="26">100 tấn công</text><rect x="1020" y="150" width="300" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1170" y="198" text-anchor="middle" font-size="26">999 900 bình thường</text><line x1="700" y1="100" x2="335" y2="148" stroke="#1f2937" stroke-width="3"/><polygon points="335,148 349,140 350,152" fill="#1f2937"/><line x1="800" y1="100" x2="1165" y2="148" stroke="#1f2937" stroke-width="3"/><polygon points="1165,148 1150,152 1151,140" fill="#1f2937"/><text x="330" y="272" text-anchor="middle" font-size="23" fill="#b91c1c">bắt 99%: 99 cảnh báo thật</text><text x="1170" y="272" text-anchor="middle" font-size="23" fill="#eb6834">báo nhầm 1%: 9 999 cảnh báo nhầm</text><rect x="100" y="305" width="1300" height="50" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="100" y="305" width="13" height="50" fill="#b91c1c"/><text x="750" y="400" text-anchor="middle" font-size="23">hộp thư cảnh báo: 10 098 cái, phần đỏ (99 cái thật) chưa tới 1%</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình chia 1 triệu sự kiện thành hai nhánh, 100 tấn công màu đỏ và 999 nghìn 900 sự kiện bình thường. Nhánh đỏ nhỏ xíu cho 99 cảnh báo thật, nhánh bình thường khổng lồ cho 9 nghìn 999 cảnh báo nhầm. Thanh dưới cùng là hộp thư cảnh báo của đội trực, vẽ đúng tỉ lệ. Phần đỏ là cảnh báo thật, chỉ là một vạch mảnh ở mép trái."

  - id: example
    kind: example
    title: "Một triệu sự kiện, đếm thẳng"
    checks:
      - "round(1_000_000 * 1e-4 * 0.99) == 99 and round(1_000_000 * (1 - 1e-4) * 0.01) == 9999"
      - "round(99 / (99 + 9999) * 100, 2) == 0.98 == round(alg.alert_precision(0.99, 0.01, 1e-4) * 100, 2)"
    steps:
      - show: |
          <p><b>Bước 1 — đếm tấn công:</b> tấn công chiếm $\frac{1}{10\,000}$ sự kiện. Xét 1 000 000 sự kiện:</p>
          <table class="t"><tr><th></th><th>số sự kiện</th><th>bị cảnh báo</th></tr>
          <tr><td>tấn công thật</td><td>100</td><td>99 (bắt 99%)</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước một, đếm tấn công. Tấn công chiếm 1 phần 10 nghìn số sự kiện, nên 1 triệu sự kiện có 100 tấn công thật. Bộ phát hiện bắt 99 phần trăm, tức 99 cảnh báo thật."
      - show: |
          <p><b>Bước 2 — đếm sự kiện bình thường:</b> $1\,000\,000 - 100 = 999\,900$.</p>
          <table class="t"><tr><th></th><th>số sự kiện</th><th>bị cảnh báo</th></tr>
          <tr><td>bình thường</td><td>999 900</td><td class="red">9 999 (báo nhầm 1%)</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước hai, đếm sự kiện bình thường, 1 triệu trừ 100 bằng 999 nghìn 900. Báo nhầm 1 phần trăm của số đó là 9 nghìn 999 cảnh báo nhầm."
      - show: |
          <p><b>Bước 3 — gộp hộp thư cảnh báo:</b> $99 + 9\,999 = \hl{10\,098}$ cảnh báo, trong đó chỉ 99 là thật.</p>
        say: "Bước ba, gộp mọi cảnh báo vào hộp thư của đội trực, 99 cộng 9 nghìn 999 bằng 10 nghìn không trăm 98 cảnh báo, mà chỉ 99 cái là thật."
      - show: |
          <p><b>Bước 4 — tỉ lệ cảnh báo là thật:</b> $\frac{99}{99 + 9\,999} = \frac{99}{10\,098} \approx \hl{0{,}98\%}$ — chưa tới 1 trong 100 cảnh báo.</p>
        introduces: [approx]
        say: "Bước bốn, tỉ lệ cảnh báo là thật bằng 99 chia cho 10 nghìn không trăm 98, khoảng 0 phẩy 98 phần trăm, chưa tới 1 trong 100 cảnh báo."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(0.99 * 1e-4 / (0.99 * 1e-4 + 0.01 * (1 - 1e-4)) * 100, 2) == 0.98"
      - "round(9999 / 10098 * 100, 2) == 99.02 and round(100 - 99 / 10098 * 100, 2) == 99.02"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>công thức thay vì đếm</td><td>$\frac{0{,}99 \times 0{,}0001}{0{,}99 \times 0{,}0001 + 0{,}01 \times 0{,}9999}$</td><td>0,98% ✓</td></tr>
          <tr><td>đếm phía ngược lại: phần nhầm</td><td>$\frac{9\,999}{10\,098}$</td><td>99,02%, cộng 0,98% đúng bằng 100% ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Thay số vào công thức ở phần giải mã, 0 phẩy 99 nhân 0 phẩy 0001, chia cho chính nó cộng 0 phẩy 01 nhân 0 phẩy 9999, cũng ra 0 phẩy 98 phần trăm. Đếm phía ngược lại, phần cảnh báo nhầm là 9 nghìn 999 chia 10 nghìn không trăm 98, bằng 99 phẩy 02 phần trăm. Cộng với 0 phẩy 98 phần trăm đúng bằng 100 phần trăm, khớp câu mở đầu rằng 99 trong 100 cảnh báo là nhầm."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, từ người mới tới người đã đi làm"
    checks:
      - "round(10098 / 60, 1) == 168.3 and round(10098 / 60 / 8) == 21"
      - "round(99 + 999900 * 0.001) == 1099 and round((99 + 999900 * 0.001) / 60, 1) == 18.3 and round((99 + 999900 * 0.001) / 60 / 8, 1) == 2.3"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Ghi mật khẩu, mã phiên vào nhật ký <b class="red">(lỗ hổng mới)</b>
          <br><span class="note">Nhật ký được chép đi nhiều nơi, nhiều người đọc, giữ lâu. Ai đọc được nhật ký là dùng được mã phiên. Che hoặc bỏ trường nhạy cảm trước khi ghi.</span></div>
        say: "Lỗi thứ nhất, ghi mật khẩu hay mã phiên vào nhật ký, tạo ra lỗ hổng mới. Nhật ký được chép đi nhiều nơi, nhiều người đọc và giữ lâu, nên ai đọc được nhật ký là dùng được mã phiên. Hãy che hoặc bỏ trường nhạy cảm trước khi ghi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ nhìn tỉ lệ bắt được <b class="red">(quên tỉ lệ nền)</b>
          <br><span class="note">Khi tấn công hiếm, tỉ lệ báo nhầm quyết định gánh nặng. Hỏi thẳng: mỗi ngày bao nhiêu cảnh báo, bao nhiêu là thật?</span></div>
        say: "Lỗi thứ hai, chỉ nhìn tỉ lệ bắt được mà quên tỉ lệ nền. Khi tấn công hiếm, tỉ lệ báo nhầm quyết định gánh nặng, nên hãy hỏi thẳng mỗi ngày có bao nhiêu cảnh báo, và bao nhiêu là thật."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Để kẻ xâm nhập sửa được nhật ký <b class="red">(xoá dấu vết)</b>
          <br><span class="note">Gửi nhật ký ngay về một hệ thống riêng, chỉ thêm được, không sửa xoá được; đồng bộ đồng hồ các máy để ghép được dòng thời gian.</span></div>
        say: "Lỗi thứ ba, để kẻ xâm nhập sửa được nhật ký và xoá dấu vết. Hãy gửi nhật ký ngay về một hệ thống riêng chỉ thêm được, không sửa xoá được, và đồng bộ đồng hồ các máy để ghép được dòng thời gian."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Chọn bộ phát hiện theo phần trăm, không đổi ra giờ trực <b class="red">(đội trực ngập)</b>
          <br><span class="note">Người làm nghề đếm trước: mỗi ngày bao nhiêu cảnh báo, mỗi ca xem kịp bao nhiêu, rồi mới chỉnh luật cho vừa. Giả sử 1 000 000 sự kiện mỗi ngày, mỗi cảnh báo xem mất 1 phút, một ca 8 giờ:</span></div>
          <table class="t"><tr><th>báo nhầm</th><th>cảnh báo mỗi ngày</th><th>giờ xem</th><th>số ca 8 giờ</th></tr>
          <tr><td>1%</td><td>10 098</td><td>≈ 168,3</td><td class="red">≈ $\hl{21}$</td></tr>
          <tr><td>0,1%</td><td>≈ 1 099</td><td>≈ 18,3</td><td>≈ 2,3</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là chọn bộ phát hiện theo phần trăm mà không đổi ra giờ trực. Người làm nghề đếm trước mỗi ngày có bao nhiêu cảnh báo và mỗi ca xem kịp bao nhiêu, rồi mới chỉnh luật cho vừa. Giả sử mỗi ngày có 1 triệu sự kiện, mỗi cảnh báo xem mất 1 phút, và một ca dài 8 giờ. Báo nhầm 1 phần trăm cho 10 nghìn không trăm 98 cảnh báo, khoảng 168 giờ xem, tức khoảng 21 ca mỗi ngày. Báo nhầm 0 phẩy 1 phần trăm chỉ còn khoảng 1 nghìn không trăm 99 cảnh báo, 18 phẩy 3 giờ, chừng 2 ca."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.alert_precision(0.99, 0.001, 1e-4) * 100, 1) == 9.0 and round(alg.alert_precision(0.99, 0.01, 0.01) * 100) == 50"
      - "round(999900 * 0.001, 1) == 999.9 and round(99 / (99 + 999.9) * 100, 1) == 9.0"
      - "round(1_000_000 * 0.01) == 10000 and round(10000 * 0.99) == 9900 and round(990000 * 0.01) == 9900 and 9900 / (9900 + 9900) == 0.5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Giữ tỉ lệ bắt được 99%, nền 1/10 000, nhưng giảm báo nhầm xuống 0,1%. Tỉ lệ cảnh báo là thật bao nhiêu?</td></tr>
          <tr><td>2</td><td>Giữ báo nhầm 1%, nhưng chỉ chạy bộ phát hiện trên các máy chủ quản trị, nơi tấn công chiếm 1% sự kiện. Kết quả?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, giữ tỉ lệ bắt được 99 phần trăm và nền 1 phần 10 nghìn, nhưng giảm báo nhầm xuống 0 phẩy 1 phần trăm, tỉ lệ cảnh báo là thật bao nhiêu? Câu hai, giữ báo nhầm 1 phần trăm, nhưng chỉ chạy bộ phát hiện trên các máy chủ quản trị. Ở đó tấn công chiếm 1 phần trăm sự kiện, kết quả ra sao? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1, trên 1 000 000 sự kiện</th><th>số cảnh báo</th></tr>
          <tr><td>thật: vẫn bắt 99 trong 100</td><td>99</td></tr>
          <tr><td>nhầm: 0,1% của 999 900</td><td>999,9</td></tr></table>
          <p>$\frac{99}{99 + 999{,}9} \approx \hl{9{,}0\%}$ — giảm báo nhầm 10 lần, tỉ lệ thật tăng gần 10 lần.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, đếm lại trên 1 triệu sự kiện. Phần thật không đổi, vẫn 99 cảnh báo. Phần nhầm là 0 phẩy 1 phần trăm của 999 nghìn 900, bằng 999 phẩy 9. Tỉ lệ thật là 99 chia cho 99 cộng 999 phẩy 9, khoảng 9 phần trăm, giảm báo nhầm 10 lần thì tỉ lệ thật tăng gần 10 lần."
      - show: |
          <table class="t"><tr><th>câu 2, trên 1 000 000 sự kiện</th><th>số cảnh báo</th></tr>
          <tr><td>thật: 1% là 10 000 tấn công, bắt 99%</td><td>9 900</td></tr>
          <tr><td>nhầm: 1% của 990 000</td><td>9 900</td></tr></table>
          <p>$\frac{9\,900}{9\,900 + 9\,900} = \hl{50\%}$ — thu hẹp phạm vi để tăng tỉ lệ nền hiệu quả hơn mọi tinh chỉnh.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, cũng đếm trên 1 triệu sự kiện. Tấn công chiếm 1 phần trăm là 10 nghìn, bắt 99 phần trăm được 9 nghìn 900 cảnh báo thật. Sự kiện bình thường còn 990 nghìn, báo nhầm 1 phần trăm cũng là 9 nghìn 900. Hai phần bằng nhau nên tỉ lệ thật là 50 phần trăm, thu hẹp phạm vi để tăng tỉ lệ nền hiệu quả hơn mọi tinh chỉnh."

