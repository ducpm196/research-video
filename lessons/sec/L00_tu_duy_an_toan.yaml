- Phát biểu ba mục tiêu bí mật, toàn vẹn, sẵn sàng
- Liệt kê mối đe doạ theo sáu loại cho một hệ thống nhỏ
- Hiểu an toàn là thuộc tính của cả hệ thống
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Đã có tường lửa rồi mà
  steps:
  - show: '<p>Công ty mua tường lửa đắt nhất, mã hoá mọi đường truyền. Rồi một nhân viên bị lừa nhập mật khẩu vào trang giả; kẻ xấu đăng nhập bằng tài khoản thật, tải về toàn bộ danh sách khách hàng. Không hàng rào nào bị phá — kẻ xấu đi qua cửa chính.</p>

      <div class="box key">Hôm nay: <b>tư duy an toàn</b> — bảo vệ cái gì, khỏi ai, theo những đường nào.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, công ty mua tường lửa đắt nhất và mã hoá mọi đường truyền. Rồi một nhân viên bị lừa nhập mật khẩu vào trang giả, và kẻ xấu đăng nhập bằng tài khoản thật, tải về toàn bộ danh sách khách hàng. Không hàng rào nào bị phá, kẻ xấu đi qua cửa chính. Hôm nay ta học tư duy an toàn, bảo vệ cái gì, khỏi ai, và theo những đường nào. Không tồn tại phần mềm an toàn tuyệt đối mà chỉ có lớp phòng vệ khiến chi phí tấn công lớn hơn giá trị tài sản. Mô hình hoá mối đe doạ ngay từ khâu vẽ sơ đồ luồng dữ liệu giúp khoá đúng điểm yếu trước khi viết dòng mã đầu.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: thành phần, luồng dữ liệu, xác thực và phân quyền'
  checks:
  - 3 * 6 == 18 and len(alg.STRIDE) == 6
  steps:
  - show: '<table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>

      <tr><td>một hệ thống = các <b>thành phần</b> nối bằng <b>luồng dữ liệu</b></td><td>đăng nhập: trình duyệt → máy chủ → cơ sở dữ liệu: 3 thành phần, 2 luồng</td></tr>

      <tr><td><b>xác thực</b>: bạn là ai</td><td>Lan gõ đúng mật khẩu, máy chủ biết đây là Lan</td></tr>

      <tr><td><b>phân quyền</b>: bạn được làm gì</td><td>Lan chỉ xem được hoá đơn của chính mình</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Trước hết, ôn ba điều bài này sẽ dùng. Một hệ thống gồm các thành phần nối với nhau bằng luồng dữ liệu, chức năng đăng nhập có 3 thành phần và 2 luồng. Xác thực trả lời câu hỏi bạn là ai, Lan gõ đúng mật khẩu nên máy chủ biết đây là Lan. Phân quyền trả lời câu hỏi bạn được làm gì, Lan chỉ xem được hoá đơn của chính mình. Xác định rõ danh sách tài sản cần bảo vệ, năng lực kẻ tấn công và mọi ranh giới tin cậy trên hệ thống.
  - show: '<p>Đếm theo bảng (cách đơn giản để không bỏ sót): mỗi <b>luồng dữ liệu</b> hỏi đủ 6 câu, một câu cho mỗi loại mối đe doạ. Hệ có 3 luồng → $3 \times 6 = \hl{18}$ câu hỏi.</p>

      '
    say: Điều thứ ba là đếm theo bảng, một cách đơn giản để không bỏ sót. Mỗi luồng dữ liệu phải hỏi đủ 6 câu, mỗi câu cho một loại mối đe doạ, nên hệ có 3 luồng thì có 3 nhân 6 bằng 18 câu hỏi cần trả lời. Mỗi mũi tên băng qua ranh giới tin cậy là nơi bắt buộc phải thực hiện xác thực và kiểm tra dữ liệu đầu vào.
- id: sym
  kind: symbol
  title: 'Giải mã: ba mục tiêu, sáu loại mối đe doạ'
  checks:
  - len(alg.STRIDE) == 6 and [t for _, t in alg.STRIDE] == ['xác thực', 'toàn vẹn', 'không chối bỏ được', 'bí mật', 'sẵn sàng', 'phân quyền']
  steps:
  - show: '<p>Ba mục tiêu: <b>bí mật</b> (chỉ người được phép mới đọc), <b>toàn vẹn</b> (không bị sửa trái phép), <b>sẵn sàng</b> (dùng được khi cần).</p>

      <table class="t"><tr><th>mối đe doạ (STRIDE)</th><th>phá thuộc tính</th></tr>

      <tr><td><b>S</b> — giả mạo danh tính (Spoofing)</td><td><code>Authentication</code> (xác thực)</td></tr>

      <tr><td><b>T</b> — sửa dữ liệu (Tampering)</td><td><code>Integrity</code> (toàn vẹn)</td></tr>

      <tr><td><b>R</b> — chối bỏ (Repudiation)</td><td><code>NonRepudiation</code> (không chối bỏ được)</td></tr>

      <tr><td><b>I</b> — lộ thông tin (Info Disclosure)</td><td><code>Confidentiality</code> (bí mật)</td></tr>

      <tr><td><b>D</b> — từ chối dịch vụ (DoS)</td><td><code>Availability</code> (sẵn sàng)</td></tr>

      <tr><td><b>E</b> — leo thang quyền (Elevation)</td><td><code>Authorization</code> (phân quyền)</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.6'
    - '2.7'
    - '2.7'
    say: Có ba mục tiêu an toàn, bí mật là chỉ người được phép mới đọc, toàn vẹn là không bị sửa trái phép, sẵn sàng là dùng được khi cần. Bảng liệt kê sáu loại mối đe doạ và thuộc tính mà mỗi loại phá. Giả mạo danh tính phá xác thực. Sửa dữ liệu phá toàn vẹn. Chối bỏ, kiểu tôi không làm, phá tính không chối bỏ được. Lộ thông tin phá bí mật. Từ chối dịch vụ phá sẵn sàng. Leo thang quyền phá phân quyền. Sáu loại đe doạ gồm giả mạo, sửa đổi, chối bỏ, lộ lọt, từ chối dịch vụ và leo thang đặc quyền giúp quét không bỏ sót.
- id: intuition
  kind: intuition
  title: Vẽ ranh giới tin cậy trước khi hỏi
  steps:
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400"><g fill="#1f2937"><rect x="60" y="130" width="300" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="210" y="179" text-anchor="middle" font-size="26">trình duyệt</text><text x="210" y="211" text-anchor="middle" font-size="22" fill="#4b5563">trong tay người dùng</text><rect x="590" y="130" width="300" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="740" y="179" text-anchor="middle" font-size="26">máy chủ web</text><text x="740" y="211" text-anchor="middle" font-size="22" fill="#4b5563">ta kiểm soát</text><rect x="1120" y="130" width="320" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1280" y="179" text-anchor="middle" font-size="26">cơ sở dữ liệu</text><text x="1280" y="211" text-anchor="middle" font-size="22" fill="#4b5563">ta kiểm soát</text><line x1="360" y1="185" x2="588" y2="185" stroke="#1f2937" stroke-width="3"/><polygon points="588,185 573,191 573,179" fill="#1f2937"/><line x1="890" y1="185" x2="1118" y2="185" stroke="#1f2937" stroke-width="3"/><polygon points="1118,185 1103,191 1103,179" fill="#1f2937"/><line x1="475" y1="40" x2="475" y2="350" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 8"/><text x="475" y="375" text-anchor="middle" font-size="22" fill="#b91c1c">ranh giới tin cậy</text><text x="210" y="70" text-anchor="middle" font-size="22" fill="#b91c1c">giả mạo,</text><text x="210" y="98" text-anchor="middle" font-size="22" fill="#b91c1c">sửa dữ liệu</text><text x="740" y="70" text-anchor="middle" font-size="22" fill="#b91c1c">leo thang quyền, chối bỏ,</text><text x="740" y="98" text-anchor="middle" font-size="22" fill="#b91c1c">từ chối dịch vụ</text><text x="1280" y="98" text-anchor="middle" font-size="22" fill="#b91c1c">lộ thông tin</text><text x="210" y="285" text-anchor="middle" font-size="22" fill="#059669">nhiều yếu tố,</text><text x="210" y="313" text-anchor="middle" font-size="22" fill="#059669">mã hoá có xác thực</text><text x="740" y="285" text-anchor="middle" font-size="22" fill="#059669">tự quyết vai trò, nhật ký,</text><text x="740" y="313" text-anchor="middle" font-size="22" fill="#059669">giới hạn tốc độ</text><text x="1280" y="285" text-anchor="middle" font-size="22" fill="#059669">một thông báo chung</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ chức năng đăng nhập thành ba khối, trình duyệt, máy chủ, và cơ sở dữ liệu, nối bằng hai mũi tên dữ liệu. Đường đứt nét màu đỏ là ranh giới tin cậy, mọi thứ bên trái nằm trong tay người dùng, kể cả kẻ xấu. Chữ đỏ phía trên ghi mối đe doạ ở từng chỗ, chữ xanh phía dưới ghi biện pháp chặn ở đúng chỗ đó. Mũi tên vượt qua ranh giới là chỗ phải nghi ngờ nhiều nhất. Giống khảo sát mọi cửa sổ, ống thông gió và ổ khoá ngôi nhà trước lúc chọn mua ổ khoá cửa chính đắt tiền.
- id: example
  kind: example
  title: Sáu câu hỏi cho một biểu mẫu đăng nhập
  checks:
  - len(alg.STRIDE) == 6 and alg.STRIDE[0][0] == 'giả mạo danh tính' and alg.STRIDE[4][1] == 'sẵn sàng'
  steps:
  - show: '<p><b>Bước 1 — vẽ luồng:</b> trình duyệt → máy chủ → cơ sở dữ liệu.</p>

      <table class="t"><tr><th>thành phần</th><th>ai kiểm soát</th><th>có tin được không</th></tr>

      <tr><td>trình duyệt</td><td>người dùng (có thể là kẻ xấu)</td><td class="red">không: mọi thứ gửi lên đều có thể bị sửa</td></tr>

      <tr><td>máy chủ, cơ sở dữ liệu</td><td>ta</td><td>có, nếu ta tự kiểm</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    say: Bước một, vẽ luồng đi từ trình duyệt tới máy chủ rồi tới cơ sở dữ liệu. Bảng ghi ai kiểm soát từng thành phần. Trình duyệt nằm trong tay người dùng, có thể là kẻ xấu, nên mọi thứ gửi lên đều có thể đã bị sửa. Máy chủ và cơ sở dữ liệu do ta kiểm soát, tin được nếu ta tự kiểm.
  - show: '<p><b>Bước 2 — hai câu hỏi đầu</b> cho biểu mẫu đăng nhập:</p>

      <table class="t"><tr><th>mối đe doạ</th><th>câu hỏi</th><th>biện pháp</th></tr>

      <tr><td>giả mạo</td><td>đoán mật khẩu, trang giả?</td><td>giới hạn số lần sai; xác thực nhiều yếu tố (ngoài mật khẩu còn cần thêm một thứ khác, như mã trên điện thoại)</td></tr>

      <tr><td>sửa dữ liệu</td><td>sửa yêu cầu trên đường truyền?</td><td>giao thức mã hoá có xác thực (vừa giấu nội dung, vừa giúp bên nhận phát hiện dữ liệu bị sửa)</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    say: Bước hai, áp hai câu hỏi đầu cho biểu mẫu đăng nhập. Giả mạo, kẻ xấu có đoán mật khẩu hay dựng trang giả được không, biện pháp là giới hạn số lần sai, và xác thực nhiều yếu tố. Xác thực nhiều yếu tố nghĩa là ngoài mật khẩu còn cần thêm một thứ khác, như mã trên điện thoại. Sửa dữ liệu, yêu cầu có bị sửa trên đường truyền không, biện pháp là giao thức mã hoá có xác thực, vừa giấu nội dung, vừa giúp bên nhận phát hiện dữ liệu bị sửa.
  - clear: true
    show: '<p><b>Bước 3 — hai câu hỏi giữa:</b></p>

      <table class="t"><tr><th>mối đe doạ</th><th>câu hỏi</th><th>biện pháp</th></tr>

      <tr><td>chối bỏ</td><td>“không phải tôi đăng nhập”?</td><td>nhật ký có thời điểm, địa chỉ</td></tr>

      <tr><td>lộ thông tin</td><td>báo lỗi “sai mật khẩu” lộ tài khoản có tồn tại?</td><td>một thông báo chung</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Bước ba, hai câu hỏi giữa. Chối bỏ, người dùng có thể nói không phải tôi đăng nhập không, biện pháp là nhật ký có thời điểm và địa chỉ. Lộ thông tin, thông báo sai mật khẩu có làm lộ tài khoản đó tồn tại không, biện pháp là một thông báo chung.
  - show: '<p><b>Bước 4 — hai câu hỏi cuối:</b></p>

      <table class="t"><tr><th>mối đe doạ</th><th>câu hỏi</th><th>biện pháp</th></tr>

      <tr><td>từ chối dịch vụ</td><td>dồn hàng triệu lần thử?</td><td>giới hạn tốc độ</td></tr>

      <tr><td>leo thang quyền</td><td>sửa tham số “vai trò = quản trị”?</td><td>máy chủ tự quyết vai trò</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Bước bốn, hai câu hỏi cuối. Từ chối dịch vụ, kẻ xấu có dồn hàng triệu lần thử không, biện pháp là giới hạn tốc độ. Leo thang quyền, có sửa được tham số vai trò thành quản trị không, biện pháp là để máy chủ tự quyết vai trò.
  - show: <p><b>Chạy thử bằng Python — tra bảng sáu chiều STRIDE:</b></p><div class="code"><div>m = {&#x27;S&#x27;:&#x27;Authentication&#x27;,&#x27;T&#x27;:&#x27;Integrity&#x27;,&#x27;R&#x27;:&#x27;NonRepudiation&#x27;,&#x27;I&#x27;:&#x27;Confidentiality&#x27;,&#x27;D&#x27;:&#x27;Availability&#x27;,&#x27;E&#x27;:&#x27;Authorization&#x27;}</div><div>print(len(set(m.values())), m[&#x27;I&#x27;], m[&#x27;T&#x27;])</div></div>
    say: Đoạn Python nhỏ lập bảng ánh xạ sáu chữ cái STRIDE sang sáu thuộc tính riêng biệt, rồi tra cứu ngay từng ký hiệu truy vấn.
    clear: true
    focus: null
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - len({p for _, p in alg.STRIDE}) == len(alg.STRIDE) == 6
  - dict(alg.STRIDE)['giả mạo danh tính'] == 'xác thực' and dict(alg.STRIDE)['lộ thông tin'] == 'bí mật' and dict(alg.STRIDE)['sửa dữ liệu'] == 'toàn vẹn'
  steps:
  - show: '<table class="t"><tr><th>cách kiểm</th><th>kết quả</th></tr>

      <tr><td>đếm cột thuộc tính trong bảng sáu dòng</td><td>6 thuộc tính khác nhau ✓: không thuộc tính nào bị bỏ sót</td></tr>

      <tr><td>đặt câu chuyện mở đầu vào bảng: trang giả</td><td>giả mạo danh tính → phá xác thực</td></tr>

      <tr><td>tải về danh sách khách hàng</td><td>lộ thông tin → phá bí mật</td></tr>

      <tr><td>tường lửa, mã hoá đường truyền lo</td><td>chặn kết nối không được phép; chống nghe lén và sửa dữ liệu trên đường truyền — không lo $\hl{2}$ mối đe doạ trên</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Kiểm bằng đường khác. Đếm cột thuộc tính trong bảng sáu dòng, ta được 6 thuộc tính khác nhau, nên không thuộc tính nào bị bỏ sót. Đặt câu chuyện mở đầu vào bảng, trang giả là giả mạo danh tính, phá xác thực. Tải về danh sách khách hàng là lộ thông tin, phá bí mật. Tường lửa chặn kết nối không được phép, còn mã hoá đường truyền chống nghe lén và sửa dữ liệu trên đường truyền. Cả hai không lo 2 mối đe doạ kia, vì kẻ xấu đi qua cửa chính bằng tài khoản thật, nên công ty vẫn bị lộ.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, từ người mới tới người đã đi làm
  checks:
  - 2 * 6 == 12 and 3 * 6 == 18 and 18 - 12 == 6
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Coi an toàn là một tính năng thêm vào cuối <b class="red">(quá muộn)</b>

      <br><span class="note">Thiết kế xong rồi mới “thêm bảo mật” thì nhiều lỗ nằm ngay trong kiến trúc (ai giữ dữ liệu, ai gọi ai). Mô hình hoá mối đe doạ ngay từ lúc thiết kế.</span></div>

      '
    say: Lỗi thứ nhất, coi an toàn là một tính năng thêm vào cuối. Thiết kế xong rồi mới thêm bảo mật thì nhiều lỗ nằm ngay trong kiến trúc, như ai giữ dữ liệu, ai gọi ai, nên hãy mô hình hoá mối đe doạ ngay từ lúc thiết kế. Chỉ lắp tường lửa bên ngoài rồi tin mọi kết nối bên trong mạng nội bộ đều sạch sẽ và đáng tin. Đoán mò mối đe doạ theo cảm tính thay vì vẽ rõ biên tin cậy, tài sản cần giữ và từng đường tấn công có thể đi qua.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Chỉ nghĩ tới kẻ tấn công từ bên ngoài <b class="red">(bỏ sót)</b>

      <br><span class="note">Nhân viên bị lừa, tài khoản bị chiếm, thư viện bên thứ ba bị cài mã độc đều là đường vào. Liệt kê cả đường tấn công từ bên trong và từ chuỗi cung ứng.</span></div>

      '
    say: Lỗi thứ hai, chỉ nghĩ tới kẻ tấn công từ bên ngoài. Nhân viên bị lừa, tài khoản bị chiếm, thư viện bên thứ ba bị cài mã độc đều là đường vào, nên hãy liệt kê cả đường tấn công từ bên trong và từ chuỗi cung ứng. Làm khó người dùng bằng mật khẩu đổi hằng tháng đến mức họ viết thẳng ra tờ giấy dán ngay lên màn hình. Giả định mạng nội bộ công ty hoàn toàn miễn nhiễm kẻ gian nên bỏ trống bước mã hoá và xác thực giữa dịch vụ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dựa vào bí mật của thiết kế <b class="red">(che giấu không phải bảo vệ)</b>

      <br><span class="note">“Không ai biết địa chỉ trang quản trị” không phải biện pháp. Giả định kẻ tấn công biết hết thiết kế; chỉ <b>khoá</b> là bí mật (nguyên lý Kerckhoffs, 1883).</span></div>

      '
    say: Lỗi thứ ba, dựa vào bí mật của thiết kế. Không ai biết địa chỉ trang quản trị không phải là một biện pháp. Hãy giả định kẻ tấn công biết hết thiết kế, chỉ có khoá là bí mật, theo một nguyên lý đã có từ năm 1883. Giữ kín thuật toán hay đường dẫn quản trị làm lớp bảo vệ duy nhất trong khi không đặt kiểm quyền thật. Bảo mật mọi nơi đồng đều tốn kém quá mức nhưng lại bỏ hở đúng cửa nhập liệu dễ khai thác nhất.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Làm mô hình mối đe doạ một lần rồi cất đi <b class="red">(thiết kế đã đổi)</b>

      <br><span class="note">Mỗi luồng dữ liệu cần đủ 6 câu hỏi. Thêm một mũi tên trên sơ đồ là thêm 6 câu chưa ai trả lời. Người làm nghề gắn việc hỏi lại sáu câu vào mỗi lần duyệt thay đổi thiết kế.</span></div>

      <table class="t"><tr><th>phiên bản</th><th>luồng dữ liệu</th><th>câu hỏi cần trả lời</th></tr>

      <tr><td>đăng nhập ban đầu</td><td>2</td><td>$2 \times 6 = 12$</td></tr>

      <tr><td>thêm: máy chủ gửi ảnh sang dịch vụ lưu trữ bên ngoài</td><td>3</td><td>$3 \times 6 = 18$, có $\hl{6}$ câu mới</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, là làm mô hình mối đe doạ một lần rồi cất đi. Mỗi luồng dữ liệu cần đủ 6 câu hỏi. Thêm một mũi tên trên sơ đồ là thêm 6 câu chưa ai trả lời. Bảng cho thấy bản đăng nhập ban đầu có 2 luồng, tức 2 nhân 6 bằng 12 câu. Thêm luồng máy chủ gửi ảnh sang dịch vụ lưu trữ bên ngoài, ta có 3 luồng, 18 câu, trong đó 6 câu là mới. Vì vậy người làm nghề hỏi lại sáu câu mỗi lần duyệt một thay đổi thiết kế. Không cập nhật lại mô hình mối đe doạ khi bổ sung thêm cổng kết nối đối tác hoặc chức năng đăng nhập mới. Đưa bản thiết kế ra kiểm định an ninh ngay trước ngày phát hành khiến mọi lỗ hổng lớn đều bị hẹn lại vô thời hạn.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - dict(alg.STRIDE)['lộ thông tin'] == 'bí mật' and dict(alg.STRIDE)['sửa dữ liệu'] == 'toàn vẹn'
  steps:
  - show: '<p>Chức năng “tải ảnh đại diện lên”.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Ảnh của người A bị người B xem được qua đường dẫn đoán được: loại mối đe doạ nào, phá thuộc tính gì?</td></tr>

      <tr><td>2</td><td>Người dùng tải lên tệp 5 GB làm đầy đĩa: loại nào?</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm với chức năng tải ảnh đại diện lên. Câu một, ảnh của người A bị người B xem được qua một đường dẫn đoán được, đó là loại mối đe doạ nào, và phá thuộc tính gì? Câu hai, người dùng tải lên tệp 5 GB làm đầy đĩa, đó là loại nào? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Người B đọc được thứ <b>không phải của mình</b> → <b>lộ thông tin</b>, phá <b>bí mật</b>.</p>

      <p>Biện pháp: máy chủ kiểm quyền trên từng ảnh; đường dẫn dùng mã ngẫu nhiên không đoán được.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một, hỏi trước hết người B có được phép xem ảnh này không. Không được phép mà vẫn đọc được, nên đó là lộ thông tin, phá tính bí mật. Biện pháp là máy chủ kiểm quyền trên từng ảnh, và đường dẫn dùng mã ngẫu nhiên không đoán được. Đối chiếu từng thành phần trong bảng câu hỏi sáu mối đe doạ khớp chính xác vào từng mũi tên qua ranh giới tin cậy.
  - show: '<p>② Không ai đọc hay sửa gì, nhưng đĩa đầy thì <b>mọi người</b> không tải được nữa → <b>từ chối dịch vụ</b>, phá <b>sẵn sàng</b>.</p>

      <p>Biện pháp: giới hạn kích thước và số lần tải.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Câu hai, không ai đọc hay sửa gì, nhưng đĩa đầy thì mọi người khác không tải được nữa, nên đó là từ chối dịch vụ, phá tính sẵn sàng. Biện pháp là giới hạn kích thước và số lần tải lên. Xếp hạng mức độ ưu tiên xử lý dựa trên tích xác suất khai thác thực tế với quy mô thiệt hại kinh doanh.
