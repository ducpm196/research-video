- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bí mật, toàn vẹn, sẵn sàng</span><span class="a">→</span>

      <span class="n">sáu loại mối đe doạ cho mỗi chức năng</span><span class="a">→</span>

      <span class="n">mỗi mối đe doạ một biện pháp</span><span class="a">→</span>

      <span class="n">làm từ lúc thiết kế, chỉ khoá là bí mật</span></div>

      '
    say: Tổng kết lại, ba mục tiêu là bí mật, toàn vẹn, sẵn sàng. Với mỗi chức năng, hãy hỏi đủ sáu loại mối đe doạ, mỗi mối đe doạ một biện pháp, làm từ lúc thiết kế, và chỉ có khoá là bí mật. Bảo mật tốt bắt đầu bằng việc biết rõ mình đang bảo vệ cái gì trước ai và qua những ranh giới tin cậy nào. Mô hình hoá mối đe doạ ngay trên bảng thiết kế rẻ gấp trăm lần vá khẩn cấp sau khi dữ liệu đã rò rỉ.
  - show: '<div class="box key"><b>Tư duy:</b> người phòng thủ phải nghĩ như người tấn công — không để tấn công, mà để biết phải chặn ở đâu.</div>

      '
    say: 'Điều cần mang theo, người phòng thủ phải nghĩ như người tấn công, không phải để tấn công, mà để biết phải chặn ở đâu. Đừng đợi sự cố xảy ra mới vá mà hãy gắn rà soát mối đe doạ trực tiếp vào mọi bản thiết kế mới. Luôn giữ bốn câu hỏi xuyên suốt: ta đang xây gì, gì có thể hỏng, đối phó ra sao và kiểm chứng thế nào.'
  - clear: true
    show: '<p class="note">Bài sau (bài 1): <b>lưu mật khẩu</b> — băm, muối, hàm băm chậm.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 1, ta học cách lưu mật khẩu, với băm, muối, và hàm băm chậm. Hẹn gặp bạn ở bài tiếp theo. Các lớp kiểm soát tiếp theo đi sâu vào từng khâu cụ thể bắt đầu từ việc lưu trữ mật khẩu người dùng an toàn.
