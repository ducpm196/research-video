id: L10
course: SEC
series: "SEC · An toàn thông tin"
title: "Bài 10 — Hàm băm mật mã và tấn công ngày sinh"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sec.yaml L10; audit/sec/verify_sec.py L10; M. Stevens và cộng sự, The First Collision for Full SHA-1, CRYPTO (2017); FIPS 180-4; NIST SP 800-57 Phần 1 Rev. 5 (2020), bảng 2–4 (kháng va chạm = b/2 bit; tối thiểu 112 bit an toàn); DMS bài 19 (bài toán ngày sinh, xác suất)"
assumes: [arith, approx, power]
# Quy ước: số giá trị cần băm để xác suất có va chạm đạt p: n ≈ √(2 · ln(1/(1 − p)) · 2^b) (alg.birthday_n); xác suất có va chạm khi băm n giá trị:
#   1 − e^(−n²/2N), N = 2^b (alg.collision_prob). 23 người trong 365 ngày: tính chính xác bằng tích.
objectives:
  - "Phân biệt kháng tiền ảnh và kháng va chạm"
  - "Ước lượng chi phí tìm va chạm"
  - "Chọn độ dài băm đủ an toàn"
asr_reviewed:
  - {sentence: "Băm 64 bit chỉ cần khoảng 5 phẩy 06 tỉ giá trị.", reason: "ASR chép “Bàm 64 biết chỉ cần khoảng 5,06 tỷ giá trị.” (0.786): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: băm/bàm, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trước tấn công va chạm chỉ còn cỡ b chia 2 bit, nên muốn 128 bit an toàn thì cần băm ít nhất 256 bit.", reason: "ASR chép “Trước tấn công va chạm chỉ còn cửa BG-2-bit nên muốn 128 bit an toàn thì cần bấm ít nhất 256 bit.” (0.892): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: cỡ chia (trong “cỡ b chia” → “cửa bg”), băm/bấm — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "23 người, một nửa khả năng trùng ngày sinh"
    checks:
      - "round(1 - math.prod((365 - i) / 365 for i in range(23)), 3) == 0.507 and math.comb(23, 2) == 253"
    steps:
      - show: |
          <p>Lớp học 23 người. Xác suất có ít nhất hai người trùng ngày sinh là bao nhiêu? Nhiều người đoán khoảng 6% (23 trên 365). Thật ra là $\hl{50{,}7\%}$ — vì ta cần <b>bất kỳ cặp nào</b> trùng, và 23 người tạo ra 253 cặp.</p>
          <div class="box key">Hôm nay: <b>hàm băm mật mã</b> — và vì sao tìm hai đầu vào trùng mã băm dễ hơn nhiều so với tưởng tượng.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, lớp học có 23 người. Xác suất có ít nhất hai người trùng ngày sinh là bao nhiêu? Nhiều người đoán khoảng 6 phần trăm, tức 23 trên 365. Thật ra là 50 phẩy 7 phần trăm, vì ta cần bất kỳ cặp nào trùng, và 23 người tạo ra 253 cặp. Hôm nay ta học hàm băm mật mã, và vì sao tìm hai đầu vào trùng mã băm dễ hơn nhiều so với tưởng tượng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa của 2, đếm cặp, nhân xác suất"
    checks:
      - "2 ** 10 == 1024 and 2 ** 20 == 1048576 and round(2 ** 32 / 1e9, 2) == 4.29 and round(2 ** 64 / 1e19, 2) == 1.84"
      - "23 * 22 // 2 == math.comb(23, 2) == 253 and round(364 / 365, 4) == 0.9973"
      - "round(364 / 365 * 363 / 365, 4) == 0.9918 and round((1 - 364 / 365 * 363 / 365) * 100, 2) == 0.82"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>
          <tr><td>lũy thừa của 2: $2^{10} = 1024 \approx 10^3$</td><td>$2^{20} = 1\,048\,576$, khoảng một triệu; $2^{32} \approx 4{,}29$ tỉ</td></tr>
          <tr><td>mã băm $b$ bit có $N = 2^b$ giá trị</td><td>64 bit: $N \approx 1{,}84 \cdot 10^{19}$</td></tr>
          <tr><td>số cặp từ $n$ thứ: $\frac{n(n - 1)}{2}$</td><td>23 người: $\frac{23 \cdot 22}{2} = 253$ cặp</td></tr></table>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn ba điều bài này sẽ dùng. Lũy thừa của 2, 2 mũ 10 bằng 1024, xấp xỉ 10 mũ 3, nên 2 mũ 20 khoảng một triệu, còn 2 mũ 32 khoảng 4 phẩy 29 tỉ. Mã băm b bit có N bằng 2 mũ b giá trị, với 64 bit thì N khoảng 1 phẩy 84 nhân 10 mũ 19. Từ n thứ ta lập được n nhân n trừ 1 chia 2 cặp, 23 người cho 23 nhân 22 chia 2 bằng 253 cặp."
      - show: |
          <p>Nhắc lại từ đầu: người thứ hai <b>không</b> trùng người đầu khi tránh 1 ngày đã có → xác suất $\frac{364}{365} \approx 0{,}9973$. Người thứ ba phải tránh 2 ngày đã có → $\frac{363}{365}$. Các điều kiện cùng phải xảy ra, nên <b>nhân</b> các phân số.</p>
          <p>Ví dụ 3 người không ai trùng: $\frac{364}{365} \cdot \frac{363}{365} \approx 0{,}9918$, nên có trùng $\approx \hl{0{,}82\%}$.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Nhắc lại từ đầu cách tính xác suất không trùng. Người thứ hai không trùng người đầu khi tránh 1 ngày đã có, xác suất 364 trên 365, khoảng 0 phẩy 9973. Người thứ ba phải tránh 2 ngày đã có, xác suất 363 trên 365, và các điều kiện này cùng phải xảy ra nên ta nhân các phân số. Ví dụ với 3 người, nhân 364 trên 365 với 363 trên 365 được khoảng 0 phẩy 9918. Vậy xác suất có hai người trùng chỉ khoảng 0 phẩy 82 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: ba tính chất của hàm băm mật mã"
    checks:
      - "round(math.e, 3) == 2.718 and round(math.log(2), 3) == 0.693 and round(math.exp(0.693), 2) == 2.0 and round(math.sqrt(2 * math.log(2)), 2) == 1.18"
    steps:
      - show: |
          <table class="t"><tr><th>tính chất</th><th>nghĩa</th><th>chi phí tấn công với băm $b$ bit</th></tr>
          <tr><td><b>kháng tiền ảnh</b></td><td>cho mã băm, không tìm được đầu vào</td><td>cỡ $2^b$</td></tr>
          <tr><td><b>kháng tiền ảnh thứ hai</b></td><td>cho một đầu vào, không tìm được đầu vào <b>khác</b> cùng mã</td><td>cỡ $2^b$</td></tr>
          <tr><td><b>kháng va chạm</b></td><td>không tìm được <b>hai</b> đầu vào bất kỳ cùng mã</td><td>chỉ cỡ $2^{b/2}$ (tấn công ngày sinh)</td></tr></table>
          <p>Số giá trị cần băm để có 50% khả năng va chạm: $n \approx \sqrt{2 \ln 2 \cdot 2^b} \approx 1{,}18 \cdot 2^{b/2}$.</p>
        introduces: [sqrt, log]
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng giới thiệu ba tính chất của hàm băm mật mã. Kháng tiền ảnh là cho mã băm thì không tìm được đầu vào, chi phí tấn công cỡ 2 mũ b. Kháng tiền ảnh thứ hai là cho một đầu vào thì không tìm được đầu vào khác cùng mã, cũng cỡ 2 mũ b. Kháng va chạm là không tìm được hai đầu vào bất kỳ cùng mã, nhưng chi phí chỉ cỡ 2 mũ b chia 2, nhờ tấn công ngày sinh. Số giá trị cần băm để có 50 phần trăm khả năng va chạm xấp xỉ căn bậc hai của 2 nhân lôgarit tự nhiên của 2 nhân 2 mũ b. Con số đó khoảng 1 phẩy 18 nhân 2 mũ b chia 2."
      - clear: true
        show: |
          <p>Hai ký hiệu mới: $e \approx 2{,}718$ là một hằng số của toán học, và $\ln$ (lôgarit tự nhiên) hỏi “$e$ mũ mấy thì được số đó”: $\ln 2 \approx 0{,}693$ vì $e^{0{,}693} \approx 2$.</p>
          <p>Vì sao có công thức: $n$ giá trị tạo khoảng $\frac{n^2}{2}$ cặp; mỗi cặp trùng với xác suất $\frac{1}{N}$, nên trung bình có $\frac{n^2}{2N}$ cặp trùng.</p>
          <p>Xác suất <b>không</b> có cặp nào trùng xấp xỉ $e^{-n^2/2N}$; đặt bằng $\frac{1}{2}$ thì $\frac{n^2}{2N} = \ln 2$, tức $n = \sqrt{2 \ln 2 \cdot N}$.</p>
        introduces: [exp]
        focus: [1, 1, 2, 2, 3, 3]
        say: "Công thức vừa rồi có hai ký hiệu mới. Chữ e là một hằng số của toán học, khoảng 2 phẩy 718, còn lôgarit tự nhiên hỏi e mũ mấy thì được số đó, nên lôgarit tự nhiên của 2 khoảng 0 phẩy 693. Vì sao có công thức, n giá trị tạo ra khoảng n bình phương chia 2 cặp. Mỗi cặp trùng với xác suất 1 phần N, nên trung bình có n bình phương chia 2N cặp trùng. Xác suất không có cặp nào trùng xấp xỉ e mũ âm của số đó. Đặt xác suất này bằng một nửa rồi giải ra, ta được n bằng căn bậc hai của 2 nhân lôgarit tự nhiên của 2 nhân N."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một mục tiêu hay mọi cặp"
    checks:
      - "math.comb(5, 2) == 10 and math.comb(23, 2) == 253"
    steps:
      - show: |
          <div><svg width="1500" height="510" viewBox="0 0 1500 510"><g fill="#1f2937"><line x1="350" y1="70" x2="350" y2="210" stroke="#2a78d6" stroke-width="3"/><line x1="483" y1="167" x2="350" y2="210" stroke="#2a78d6" stroke-width="3"/><line x1="432" y1="323" x2="350" y2="210" stroke="#2a78d6" stroke-width="3"/><line x1="268" y1="323" x2="350" y2="210" stroke="#2a78d6" stroke-width="3"/><line x1="217" y1="167" x2="350" y2="210" stroke="#2a78d6" stroke-width="3"/><line x1="1150" y1="70" x2="1283" y2="167" stroke="#eb6834" stroke-width="3"/><line x1="1150" y1="70" x2="1232" y2="323" stroke="#eb6834" stroke-width="3"/><line x1="1150" y1="70" x2="1068" y2="323" stroke="#eb6834" stroke-width="3"/><line x1="1150" y1="70" x2="1017" y2="167" stroke="#eb6834" stroke-width="3"/><line x1="1283" y1="167" x2="1232" y2="323" stroke="#eb6834" stroke-width="3"/><line x1="1283" y1="167" x2="1068" y2="323" stroke="#eb6834" stroke-width="3"/><line x1="1283" y1="167" x2="1017" y2="167" stroke="#eb6834" stroke-width="3"/><line x1="1232" y1="323" x2="1068" y2="323" stroke="#eb6834" stroke-width="3"/><line x1="1232" y1="323" x2="1017" y2="167" stroke="#eb6834" stroke-width="3"/><line x1="1068" y1="323" x2="1017" y2="167" stroke="#eb6834" stroke-width="3"/><circle cx="350" cy="70" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="483" cy="167" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="432" cy="323" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="268" cy="323" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="217" cy="167" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="1150" cy="70" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="1283" cy="167" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="1232" cy="323" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="1068" cy="323" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><circle cx="1017" cy="167" r="20" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><rect x="300" y="180" width="100" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="350" y="218" text-anchor="middle" font-size="24" fill="#b91c1c">mã</text><text x="350" y="400" text-anchor="middle" font-size="26" fill="#2a78d6">trùng với MỘT mã cho trước</text><text x="350" y="435" text-anchor="middle" font-size="24">5 giá trị → 5 cơ hội</text><text x="1150" y="400" text-anchor="middle" font-size="26" fill="#eb6834">có HAI giá trị trùng nhau</text><text x="1150" y="435" text-anchor="middle" font-size="24">5 giá trị → 10 cặp</text><line x1="750" y1="40" x2="750" y2="450" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><text x="750" y="490" text-anchor="middle" font-size="24" fill="#1f2937">23 giá trị: chỉ 23 cơ hội trúng một mã cho trước, nhưng 253 cặp có thể trùng nhau</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình bên trái là câu hỏi trùng với một mã cho trước, mỗi giá trị mới chỉ có một cơ hội, nên 5 giá trị cho 5 cơ hội. Hình bên phải là câu hỏi có hai giá trị trùng nhau, mỗi giá trị mới được so với mọi giá trị cũ, nên 5 giá trị đã cho 10 cặp. Với 23 giá trị, bên trái vẫn chỉ 23 cơ hội, còn bên phải có tới 253 cặp. Số cặp tăng theo bình phương, đó là lý do va chạm đến sớm hơn trực giác rất nhiều."

  - id: example
    kind: example
    title: "Băm 64 bit: 5 tỉ giá trị là đủ"
    checks:
      - "round(alg.birthday_n(64) / 1e9, 2) == 5.06 and round(alg.collision_prob(1e9, 64), 4) == 0.0267"
      - "round(alg.birthday_n(128) / 1e19, 2) == 2.17"
      - "round(1.18 * 4.29, 2) == 5.06 and round(1.18 * 1.84, 2) == 2.17 and round(1e18 / (2 * 1.84e19), 3) == 0.027 and round(1 - math.exp(-0.027), 3) == 0.027"
    steps:
      - show: |
          <p><b>Bước 1 — băm 64 bit, 50% va chạm:</b> $n \approx 1{,}18 \cdot 2^{32} \approx 1{,}18 \cdot 4{,}29$ tỉ $\approx \hl{5{,}06}$ tỉ giá trị.</p>
          <table class="t"><tr><th>so với</th><th>số giá trị</th></tr>
          <tr><td>tìm tiền ảnh: cỡ $2^{64}$</td><td>$1{,}84 \cdot 10^{19}$</td></tr>
          <tr><td>tìm va chạm</td><td>chỉ cỡ $5{,}06 \cdot 10^9$, trong tầm một máy tính bình thường (cỡ vài giờ, số minh hoạ)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Bước một, với băm 64 bit, số giá trị cần băm để có 50 phần trăm va chạm là 1 phẩy 18 nhân 2 mũ 32. Đó là 1 phẩy 18 nhân 4 phẩy 29 tỉ, khoảng 5 phẩy 06 tỉ. Bảng so với việc tìm tiền ảnh. Tìm tiền ảnh cần cỡ 2 mũ 64, khoảng 1 phẩy 84 nhân 10 mũ 19 giá trị. Tìm va chạm chỉ cần cỡ 5 phẩy 06 tỉ, trong tầm một máy tính bình thường, cỡ vài giờ theo một số minh hoạ."
      - show: |
          <p><b>Bước 2 — chỉ 1 tỉ giá trị</b>, $n = 10^9$, $N = 2^{64}$:</p>
          <p>$\frac{n^2}{2N} = \frac{10^{18}}{2 \cdot 1{,}84 \cdot 10^{19}} \approx 0{,}027$, xác suất $1 - e^{-0{,}027} \approx \hl{2{,}7\%}$.</p>
        focus: [1, 2, 2]
        say: "Bước hai, chỉ băm 1 tỉ giá trị, tức n bằng 10 mũ 9 trên N bằng 2 mũ 64. Tính n bình phương chia 2N, được 10 mũ 18 chia 2 nhân 1 phẩy 84 nhân 10 mũ 19, khoảng 0 phẩy 027. Xác suất có va chạm là 1 trừ e mũ âm 0 phẩy 027, khoảng 2 phẩy 7 phần trăm."
      - show: |
          <p><b>Bước 3 — băm 128 bit:</b> $n \approx 1{,}18 \cdot 2^{64} \approx 1{,}18 \cdot 1{,}84 \cdot 10^{19} \approx \hl{2{,}17 \cdot 10^{19}}$ giá trị: tốn kém, nhưng không còn được coi là đủ cho chữ ký lâu dài.</p>
        say: "Bước ba, với băm 128 bit, cần khoảng 1 phẩy 18 nhân 2 mũ 64, tức 1 phẩy 18 nhân 1 phẩy 84 nhân 10 mũ 19, khoảng 2 phẩy 17 nhân 10 mũ 19 giá trị. Con số này tốn kém, nhưng không còn được coi là đủ cho chữ ký lâu dài."
      - clear: true
        show: |
          <p><b>Bước 4 — gom lại</b> và chọn độ dài:</p>
          <table class="t"><tr><th>độ dài băm</th><th>50% va chạm sau khoảng</th><th>ghi chú</th></tr>
          <tr><td>64 bit</td><td>$\hl{5{,}06}$ tỉ giá trị</td><td>trong tầm một máy tính bình thường</td></tr>
          <tr><td>128 bit</td><td>$2{,}17 \cdot 10^{19}$ giá trị</td><td>tốn kém nhưng không còn được coi là đủ cho chữ ký lâu dài</td></tr>
          <tr><td>256 bit</td><td>cỡ $2^{128}$ giá trị</td><td>ngoài tầm mọi kẻ tấn công đã biết</td></tr></table>
          <p class="note">Mốc khuyến nghị: NIST SP 800-57 Phần 1 Rev. 5 (2020) đòi ít nhất 112 bit an toàn; băm 128 bit chỉ cho 64 bit trước va chạm nên không đạt, băm 256 bit cho 128 bit.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Bước bốn, gom lại để chọn độ dài. Bảng cho số giá trị cần băm để có 50 phần trăm khả năng va chạm. Băm 64 bit chỉ cần khoảng 5 phẩy 06 tỉ giá trị. Băm 128 bit cần khoảng 2 phẩy 17 nhân 10 mũ 19 giá trị. Băm 256 bit cần cỡ 2 mũ 128 giá trị, ngoài tầm mọi kẻ tấn công đã biết, nên đó là lựa chọn cho chữ ký và chứng chỉ. Theo hướng dẫn năm 2020 của Viện Tiêu chuẩn Mỹ, cần ít nhất 112 bit an toàn, nên băm 128 bit với 64 bit trước va chạm là không đạt."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(1.18 * math.sqrt(365), 1) == 22.5 and round(1 - math.prod((365 - i) / 365 for i in range(23)), 3) == 0.507"
      - "round(alg.birthday_n(20)) == 1206 and round(1 - math.prod((2 ** 20 - i) / 2 ** 20 for i in range(1206)), 3) == 0.500"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>kết quả</th></tr>
          <tr><td>công thức với $N = 365$ ngày</td><td>$1{,}18 \cdot \sqrt{365} \approx 22{,}5$ → khoảng 23 người ✓</td></tr>
          <tr><td>nhân thẳng $\frac{364}{365} \cdot \frac{363}{365} \cdots$ cho 23 người</td><td>không trùng 49,3%, có trùng $\hl{50{,}7\%}$ ✓</td></tr>
          <tr><td>nhân thẳng với $N = 2^{20}$, $n = 1206$</td><td>có trùng 50,0% ✓, khớp công thức</td></tr></table>
        introduces: [dots]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm công thức bằng đường khác. Áp công thức cho 365 ngày, 1 phẩy 18 nhân căn của 365 được khoảng 22 phẩy 5, tức khoảng 23 người, khớp câu chuyện mở đầu. Nhân thẳng các phân số cho 23 người, xác suất không trùng là 49 phẩy 3 phần trăm, nên có trùng là 50 phẩy 7 phần trăm. Nhân thẳng với N bằng 2 mũ 20 và n bằng 1206, xác suất có trùng đúng 50 phẩy 0 phần trăm, khớp công thức."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, từ người mới tới người đã đi làm"
    checks:
      - "round(alg.collision_prob(1e5, 32), 2) == 0.69 and alg.collision_prob(1e9, 32) > 0.999999"
      - "f'{alg.collision_prob(1e5, 64):.1e}' == '2.7e-10' and round(alg.collision_prob(1e9, 64), 3) == 0.027"
      - "f'{alg.collision_prob(1e5, 128):.1e}' == '1.5e-29' and f'{alg.collision_prob(1e9, 128):.1e}' == '1.5e-21'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ băm $b$ bit cho $b$ bit an toàn <b class="red">(chỉ một nửa)</b>
          <br><span class="note">Với va chạm, chỉ cỡ $b/2$ bit. Muốn 128 bit an toàn trước va chạm thì cần băm ít nhất 256 bit.</span></div>
        say: "Lỗi thứ nhất, nghĩ băm b bit cho b bit an toàn. Trước tấn công va chạm chỉ còn cỡ b chia 2 bit, nên muốn 128 bit an toàn thì cần băm ít nhất 256 bit."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng tiếp hàm băm đã có va chạm công khai <b class="red">(lỗi thời)</b>
          <br><span class="note">Năm 2017 đã có hai tệp PDF khác nhau cùng mã băm SHA-1. Hàm băm đã vỡ kháng va chạm không được dùng cho chữ ký, chứng chỉ.</span></div>
        say: "Lỗi thứ hai, dùng tiếp một hàm băm đã có va chạm công khai. Năm 2017 đã có hai tệp khác nhau cùng mã băm của một hàm băm cũ phổ biến, nên hàm băm đã vỡ kháng va chạm không được dùng cho chữ ký hay chứng chỉ nữa."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cắt ngắn mã băm “cho gọn” <b class="red">(tự giảm an toàn)</b>
          <br><span class="note">Lấy 8 ký tự hex đầu (32 bit) làm mã định danh: 50% va chạm chỉ sau khoảng 77 nghìn giá trị. Cắt ngắn để hiển thị thì được, để kiểm toàn vẹn thì không.</span></div>
        say: "Lỗi thứ ba, cắt ngắn mã băm cho gọn. Lấy 8 ký tự đầu, tức 32 bit, làm mã định danh thì 50 phần trăm va chạm chỉ sau khoảng 77 nghìn giá trị. Cắt ngắn để hiển thị thì được, còn để kiểm toàn vẹn thì không."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Chọn độ dài mã theo số giá trị <b>hôm nay</b>, không theo cả vòng đời hệ thống <b class="red">(trùng khi lớn lên)</b>
          <br><span class="note">Người làm nghề ước lượng số giá trị tối đa hệ thống sẽ sinh ra, rồi tính xác suất va chạm ở con số đó trước khi chọn độ dài. Bảng dưới chỉ tính trùng <b>tình cờ</b>; nếu có kẻ cố tình tạo trùng thì cần đủ 256 bit như Lỗi 1.</span></div>
          <table class="t"><tr><th>độ dài mã</th><th>$10^5$ giá trị (năm đầu)</th><th>$10^9$ giá trị (vài năm sau)</th></tr>
          <tr><td>32 bit</td><td>69%</td><td class="red">gần 100%</td></tr>
          <tr><td>64 bit</td><td>$2{,}7 \cdot 10^{-10}$</td><td class="red">2,7%</td></tr>
          <tr><td>128 bit</td><td>$1{,}5 \cdot 10^{-29}$</td><td>$\hl{1{,}5 \cdot 10^{-21}}$</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4", 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là chọn độ dài mã theo số giá trị hôm nay, không theo cả vòng đời hệ thống. Người làm nghề ước lượng số giá trị tối đa sẽ sinh ra, rồi tính xác suất va chạm ở con số đó trước khi chọn. Bảng so ba độ dài ở 10 mũ 5 và 10 mũ 9 giá trị. Mã 32 bit đã 69 phần trăm ở năm đầu, và gần 100 phần trăm vài năm sau. Mã 64 bit trông an toàn lúc đầu, nhưng lên tới 2 phẩy 7 phần trăm khi có 10 mũ 9 giá trị. Mã 128 bit vẫn chỉ khoảng 1 phẩy 5 nhân 10 mũ âm 21, nên đó là độ dài nên chọn. Bảng này chỉ tính trùng tình cờ, còn nếu có kẻ cố tình tạo trùng thì cần đủ 256 bit như ở lỗi thứ nhất."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.birthday_n(32)) == 77163 and round(alg.collision_prob(1e5, 32), 2) == 0.69"
      - "2 ** 16 == 65536 and round(1.1774 * 65536) == 77162 and round(math.sqrt(2 * math.log(2)) * 65536) == 77163 and round(1e10 / 2 ** 33, 2) == 1.16 and round(1 - math.exp(-1.16), 2) == 0.69"
      - "f'{1e10 / 2 ** 129:.1e}' == '1.5e-29'"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Băm 32 bit: cần khoảng bao nhiêu giá trị để có 50% va chạm?</td></tr>
          <tr><td>2</td><td>Hệ thống gán mã 32 bit (băm cắt ngắn) cho 100 000 tệp. Xác suất có hai tệp cùng mã khoảng bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với băm 32 bit, cần khoảng bao nhiêu giá trị để có 50 phần trăm khả năng va chạm? Câu hai, hệ thống gán mã 32 bit bằng băm cắt ngắn cho 100 nghìn tệp, xác suất có hai tệp cùng mã khoảng bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Một nửa của 32 bit là 16 bit: $2^{16} = 65\,536$.</p>
          <p>$n \approx 1{,}1774 \cdot 65\,536 \approx \hl{77\,163}$ giá trị ($1{,}1774$ là số $1{,}18$ viết đủ hơn).</p>
        focus: [1, 2]
        say: "Đáp án câu một, trước hết lấy một nửa số bit, 32 bit còn 16 bit, và 2 mũ 16 bằng 65 nghìn 536. Nhân với 1 phẩy 1774, là số 1 phẩy 18 viết đủ hơn, được khoảng 77 nghìn 163 giá trị."
      - show: |
          <p>② $n = 10^5$, $N = 2^{32}$: $\frac{n^2}{2N} = \frac{10^{10}}{2^{33}} \approx 1{,}16$.</p>
          <p>$1 - e^{-1{,}16} \approx \hl{69\%}$ — rất dễ có trùng.</p>
        focus: [1, 2]
        say: "Câu hai, với n bằng 10 mũ 5 và N bằng 2 mũ 32, n bình phương chia 2N bằng 10 mũ 10 chia 2 mũ 33, khoảng 1 phẩy 16. Xác suất là 1 trừ e mũ âm 1 phẩy 16, khoảng 69 phần trăm, tức rất dễ có trùng."
      - show: |
          <p>Quyết định: đổi sang mã 128 bit thì $\frac{n^2}{2N} = \frac{10^{10}}{2^{129}} \approx 1{,}5 \cdot 10^{-29}$: coi như không bao giờ trùng.</p>
        say: "Quyết định là dùng mã dài hơn, ít nhất 128 bit cho định danh ngẫu nhiên. Khi đó n bình phương chia 2N chỉ khoảng 1 phẩy 5 nhân 10 mũ âm 29, coi như không bao giờ trùng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tiền ảnh: cỡ 2^b</span><span class="a">→</span>
          <span class="n">va chạm: chỉ cỡ 2^(b/2)</span><span class="a">→</span>
          <span class="n">dùng băm ≥ 256 bit</span><span class="a">→</span>
          <span class="n">bỏ hàm đã vỡ, không cắt ngắn để kiểm</span></div>
        say: "Tổng kết lại, tìm tiền ảnh tốn cỡ 2 mũ b, nhưng tìm va chạm chỉ tốn cỡ 2 mũ b chia 2. Hãy dùng băm từ 256 bit trở lên, bỏ các hàm đã vỡ, và không cắt ngắn mã băm dùng để kiểm."
      - show: |
          <div class="box key"><b>Tư duy:</b> “trùng với <b>một</b> giá trị cho trước” và “có <b>hai</b> giá trị trùng nhau” là hai câu hỏi rất khác — trực giác thường lẫn chúng.</div>
        say: "Điều cần mang theo, trùng với một giá trị cho trước và có hai giá trị trùng nhau là hai câu hỏi rất khác, và trực giác thường lẫn chúng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>an toàn bộ nhớ</b> và các lớp bảo vệ của hệ điều hành.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học an toàn bộ nhớ và các lớp bảo vệ của hệ điều hành. Hẹn gặp bạn ở bài tiếp theo."
