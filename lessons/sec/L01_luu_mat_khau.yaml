- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">băm, không mã hoá</span><span class="a">→</span>

      <span class="n">muối riêng từng người</span><span class="a">→</span>

      <span class="n">hàm băm chậm làm kẻ đoán chậm hàng triệu lần</span><span class="a">→</span>

      <span class="n">dùng hàm chuẩn, tăng số vòng theo thời gian</span></div>

      '
    say: Tổng kết lại, mật khẩu phải được băm chứ không mã hoá, có muối riêng từng người, và dùng hàm băm chậm để kẻ đoán chậm đi hàng triệu lần. Hãy dùng hàm chuẩn, và tăng số vòng lặp theo thời gian. Không bao giờ lưu mật khẩu bản rõ và tuyệt đối không dùng hàm băm nhanh thiếu muối ngẫu nhiên. Kết hợp muối ngẫu nhiên riêng từng tài khoản và hàm băm chậm thích nghi bảo vệ mật khẩu ngay cả khi lộ bảng dữ liệu.
  - show: '<div class="box key"><b>Tư duy:</b> hãy thiết kế như thể cơ sở dữ liệu <b>sẽ</b> bị lộ. Câu hỏi là khi đó kẻ xấu mất bao lâu để dùng được nó.</div>

      '
    say: Điều cần mang theo, hãy thiết kế như thể cơ sở dữ liệu sẽ bị lộ. Câu hỏi là khi đó kẻ xấu mất bao lâu để dùng được nó. Chọn hàm băm chậm tốn bộ nhớ khiến ngay cả phần cứng chuyên dụng đắt tiền cũng không thử song song nhanh được. Nâng dần chi phí bộ nhớ và số vòng lặp theo từng năm giữ thế chủ động trước sức mạnh phần cứng mới.
  - clear: true
    show: '<p class="note">Bài sau (bài 2): <b>độ mạnh mật khẩu</b> và entropy.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 2, ta học về độ mạnh mật khẩu và entropy. Hẹn gặp bạn ở bài tiếp theo. Hiểu cách đo độ mạnh thực sự của mật khẩu bằng độ hỗn loạn giúp tránh các quy tắc đặt mật khẩu phản tác dụng.
