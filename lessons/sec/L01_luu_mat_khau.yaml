id: L01
course: SEC
series: SEC · An toàn thông tin
title: 'Bài 1 — Lưu mật khẩu: băm, muối, hàm băm chậm'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/sec.yaml L01; audit/sec/verify_sec.py L01; OWASP Password Storage Cheat Sheet (truy cập 2026-11-09, no revision given: Argon2id → scrypt → bcrypt hệ cũ → PBKDF2-HMAC-SHA256 600 000 vòng khi cần FIPS-140; bọc băm cũ rồi thay khi đăng nhập); NIST SP 800-63B-4 (8/2025), mục 3.1.1.2 (muối ≥ 32 bit, băm có chi phí); RFC 8018 (PBKDF2); DMS bài 9 (tổ hợp)'
assumes:
