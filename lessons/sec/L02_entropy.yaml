  - show: <table class='t'><tr><th>Gợi ý triển khai SEC:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (entropy ký tự)</b></td><td>Nhân độ dài mật khẩu với lôgarit cơ số hai của cỡ bảng chữ cái</td></tr><tr><td><b>Bước 2 (entropy cụm từ)</b></td><td>Nhân số lượng từ chọn ngẫu nhiên với lôgarit của cỡ từ điển</td></tr><tr><td><b>Bước 3 (so sánh độ mạnh)</b></td><td>Đối chiếu trực tiếp số bit entropy giữa hai phương án</td></tr></table>
    say: Gợi ý triển khai chia ba bước trên màn hình. In đủ ba dòng gồm số bit mật khẩu ký tự, số bit cụm từ và cờ 0 hoặc 1 xem cụm từ có mạnh hơn không.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>bits_8_lower=37.6</div><div>bits_4_words=51.7</div><div>words_stronger=1</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">entropy = k nhân log₂ N, chỉ khi sinh ngẫu nhiên</span><span class="a">→</span>

      <span class="n">mỗi bit gấp đôi số khả năng</span><span class="a">→</span>

      <span class="n">vẻ phức tạp ≠ độ mạnh</span><span class="a">→</span>

      <span class="n">nhiều từ ngẫu nhiên, riêng từng nơi</span></div>

      '
    say: Tổng kết lại, entropy bằng k nhân lôgarit cơ số 2 của N, và chỉ đúng khi sinh ngẫu nhiên. Mỗi bit gấp đôi số khả năng, vẻ phức tạp không phải là độ mạnh, nên hãy dùng nhiều từ ngẫu nhiên, và riêng cho từng nơi. Chiều dài ngẫu nhiên thật sự quyết định độ mạnh chứ không phải vài ký tự chấm than ở cuối chuỗi quen. Khuyến khích cụm từ dài tự nhiên kết hợp chặn danh sách yếu và giới hạn tốc độ thử đạt độ an toàn vượt trội.
  - show: '<div class="box key"><b>Tư duy:</b> độ mạnh nằm ở <b>cách sinh</b>, không nằm ở chuỗi ký tự trông ra sao.</div>

      '
    say: Điều cần mang theo, độ mạnh nằm ở cách sinh ra mật khẩu, không nằm ở chuỗi ký tự trông ra sao. Kết hợp kiểm tra rò rỉ, giới hạn tốc độ thử sai và xác thực nhiều yếu tố tạo lá chắn đăng nhập hoàn chỉnh. Mỗi bit độ hỗn loạn tăng thêm đều nhân đôi khối công việc dò tìm của kẻ xấu một cách định lượng rõ ràng.
  - clear: true
    show: '<p class="note">Bài sau (bài 3): <b>xác thực nhiều yếu tố</b> và mã một lần.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 3, ta học xác thực nhiều yếu tố và mã một lần. Hẹn gặp bạn ở bài tiếp theo.
