id: L02
course: SEC
series: "SEC · An toàn thông tin"
title: "Bài 2 — Độ mạnh mật khẩu và entropy"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sec.yaml L02; audit/sec/verify_sec.py L02; C. E. Shannon, A Mathematical Theory of Communication, Bell System Technical Journal 27 (1948); A. G. Reinhold, Diceware (1995) — danh sách 7776 = 6⁵ từ; NIST SP 800-63B-4 (8/2025), mục 3.1.1.2 (không bắt đổi định kỳ, không bắt trộn loại ký tự, so danh sách đã lộ; trang pages.nist.gov truy cập 2026-11-09); DMS (lôgarit cơ số 2)"
assumes: [arith, cdot, approx, power]
# Quy ước: entropy (bit) của mật khẩu SINH NGẪU NHIÊN ĐỀU gồm k lựa chọn độc lập, mỗi lựa chọn trong N khả năng = k · log₂ N (alg.entropy_bits).
#   Mỗi bit thêm vào làm số khả năng gấp đôi. Mật khẩu do người tự nghĩ KHÔNG áp dụng được công thức này.
objectives:
  - "Tính entropy của mật khẩu sinh ngẫu nhiên"
  - "Phân biệt entropy và độ phức tạp bề ngoài"
  - "Chọn cách sinh mật khẩu mạnh và dễ nhớ"
asr_reviewed:
  - {sentence: "Câu một, mã PIN 4 chữ số ngẫu nhiên có entropy bao nhiêu bit?", reason: "ASR chép “Câu một, mãp bình bốn chữ số ngẫu nhiên có entropy bao nhiêu biết?” (0.786): lệch âm/thanh thuần Việt: mã pin/mãp bình, bit/biết — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Matkhau@2024” có chữ hoa, số, ký tự đặc biệt"
    steps:
      - show: |
          <p>Quy định bắt mật khẩu có chữ hoa, chữ số, ký tự đặc biệt. Kết quả: ai cũng đặt kiểu <code>Matkhau@2024</code> — đúng mọi quy định, và nằm trong danh sách đoán thử đầu tiên của kẻ xấu.</p>
          <div class="box key">Hôm nay: <b>entropy</b> — đo độ mạnh bằng <b>số khả năng thật</b>, không bằng vẻ ngoài phức tạp.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, quy định bắt mật khẩu phải có chữ hoa, chữ số và ký tự đặc biệt. Kết quả là ai cũng đặt kiểu chữ mật khẩu viết hoa chữ đầu, thêm a còng và năm 2024, đúng mọi quy định, mà lại nằm trong danh sách đoán thử đầu tiên của kẻ xấu. Hôm nay ta học entropy, đo độ mạnh bằng số khả năng thật, không bằng vẻ ngoài phức tạp."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: quy tắc nhân, lũy thừa của 2, lôgarit cơ số 2"
    checks:
      - "26 * 26 == 676 and 2 ** 3 == 8 and math.log2(8) == 3 and 2 ** 4 < 26 < 2 ** 5 and round(math.log2(26), 2) == 4.70"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>
          <tr><td>quy tắc nhân: các lựa chọn độc lập thì số khả năng nhân với nhau</td><td>2 chữ thường: chữ đầu 26 cách, với <b>mỗi</b> chữ đầu lại 26 cách chọn chữ sau → 26 nhóm, mỗi nhóm 26: $26 \cdot 26 = 676$ khả năng</td></tr>
          <tr><td>lũy thừa của 2: mỗi lần nhân 2 là gấp đôi</td><td>$2^3 = 2 \cdot 2 \cdot 2 = 8$</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Trước hết, ta cần hiểu hai điều bài này sẽ dùng. Quy tắc nhân nói các lựa chọn độc lập thì số khả năng nhân với nhau, vì chữ đầu có 26 cách, và với mỗi chữ đầu lại có 26 cách chọn chữ sau. Vậy 2 chữ thường cho 26 nhóm, mỗi nhóm 26, tức 26 nhân 26 bằng 676 khả năng. Lũy thừa của 2 là gấp đôi liên tiếp, 2 mũ 3 bằng 2 nhân 2 nhân 2, bằng 8."
      - show: |
          <p>Lôgarit cơ số 2 hỏi ngược lại: <b>phải gấp đôi mấy lần</b> từ 1 để được số đó.</p>
          <p>$\log_2 8 = 3$ vì $2^3 = 8$. Với 26: $2^4 = 16 < 26 < 32 = 2^5$, nên $\log_2 26 \approx \hl{4{,}70}$, nằm giữa 4 và 5.</p>
        introduces: [log, sub]
        focus: [1, 2, 2]
        say: "Lôgarit cơ số 2 hỏi ngược lại, phải gấp đôi mấy lần từ 1 để được số đó. Lôgarit cơ số 2 của 8 bằng 3, vì 2 mũ 3 bằng 8. Với 26, ta có 2 mũ 4 bằng 16 nhỏ hơn 26, mà 26 nhỏ hơn 2 mũ 5 bằng 32, nên lôgarit cơ số 2 của 26 khoảng 4 phẩy 70, nằm giữa 4 và 5."

  - id: sym
    kind: symbol
    title: "Giải mã: entropy"
    steps:
      - show: |
          <p>Mật khẩu sinh <b>ngẫu nhiên đều</b> gồm $k$ lựa chọn độc lập, mỗi lựa chọn có $N$ khả năng:</p>
          <p>$\text{entropy} = k \cdot \log_2 N$ bit</p>
          <p>Ý nghĩa: số khả năng $= 2^{\text{entropy}}$. Mỗi bit thêm vào làm số khả năng <b>gấp đôi</b>, tức thời gian đoán gấp đôi.</p>
        focus: [1, 2, 3, 3]
        say: "Xét một mật khẩu sinh ngẫu nhiên đều, gồm k lựa chọn độc lập, mỗi lựa chọn có N khả năng. Entropy bằng k nhân lôgarit cơ số 2 của N, tính bằng bit. Ý nghĩa là số khả năng bằng 2 mũ entropy. Mỗi bit thêm vào làm số khả năng gấp đôi, tức thời gian đoán cũng gấp đôi."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi ô một lựa chọn, mỗi bit một lần gấp đôi"
    steps:
      - show: |
          <div><svg width="1500" height="520" viewBox="0 0 1500 520"><g fill="#1f2937"><text x="40" y="50" text-anchor="start" font-size="24">8 chữ thường: 8 ô độc lập, mỗi ô 26 khả năng</text><rect x="40" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="92" y="114" text-anchor="middle" font-size="28">26</text><rect x="160" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="212" y="114" text-anchor="middle" font-size="28">26</text><rect x="280" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="332" y="114" text-anchor="middle" font-size="28">26</text><rect x="400" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="452" y="114" text-anchor="middle" font-size="28">26</text><rect x="520" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="572" y="114" text-anchor="middle" font-size="28">26</text><rect x="640" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="692" y="114" text-anchor="middle" font-size="28">26</text><rect x="760" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="812" y="114" text-anchor="middle" font-size="28">26</text><rect x="880" y="70" width="105" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="932" y="114" text-anchor="middle" font-size="28">26</text><text x="1020" y="115" text-anchor="start" font-size="26" fill="#2a78d6" font-weight="bold">≈ 37,6 bit</text><text x="40" y="200" text-anchor="start" font-size="24">4 từ: 4 ô độc lập, mỗi ô 7776 từ (gieo 5 xúc xắc)</text><rect x="40" y="220" width="225" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="152" y="264" text-anchor="middle" font-size="28">7776</text><rect x="280" y="220" width="225" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="392" y="264" text-anchor="middle" font-size="28">7776</text><rect x="520" y="220" width="225" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="632" y="264" text-anchor="middle" font-size="28">7776</text><rect x="760" y="220" width="225" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="872" y="264" text-anchor="middle" font-size="28">7776</text><text x="1020" y="265" text-anchor="start" font-size="26" fill="#eb6834" font-weight="bold">≈ 51,7 bit</text><text x="40" y="350" text-anchor="start" font-size="22" fill="#4b5563">độ dài thanh = số bit; thêm 1 bit = gấp đôi số khả năng</text><rect x="260" y="375" width="451" height="32" rx="4" fill="#2a78d6"/><text x="245" y="400" text-anchor="end" font-size="22">8 chữ thường</text><text x="721" y="400" text-anchor="start" font-size="22">37,6 bit</text><rect x="260" y="420" width="620" height="32" rx="4" fill="#eb6834"/><text x="245" y="445" text-anchor="end" font-size="22">4 từ</text><text x="890" y="445" text-anchor="start" font-size="22">51,7 bit</text><rect x="260" y="465" width="858" height="32" rx="4" fill="#059669"/><text x="245" y="490" text-anchor="end" font-size="22">12 ký tự từ 62</text><text x="1128" y="490" text-anchor="start" font-size="22">71,5 bit</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mật khẩu như một dãy ô, mỗi ô là một lựa chọn độc lập. Tám chữ thường là 8 ô, mỗi ô 26 khả năng, còn bốn từ là 4 ô, mỗi ô 7776 từ. Ô ít hơn nhưng mỗi ô rộng hơn nhiều, nên tổng số bit lớn hơn. Thanh phía dưới dài theo số bit, và thêm một bit là số khả năng gấp đôi."

  - id: example
    kind: example
    title: "Ba cách sinh mật khẩu"
    checks:
      - "[round(alg.entropy_bits(n, k), 1) for n, k in ((26, 8), (7776, 4), (62, 12))] == [37.6, 51.7, 71.5]"
      - "round(math.log2(26), 2) == 4.70 and round(math.log2(7776), 2) == 12.92 and round(math.log2(62), 2) == 5.95 and round(alg.entropy_bits(7776, 4) - alg.entropy_bits(26, 8)) == 14 and 2 ** 14 == 16384"
      - "7776 == 6 ** 5"
      - "round(math.log2(62), 4) == 5.9542 and round(12 * 5.9542, 2) == 71.45 and round(12 * 5.95, 1) == 71.4 and round(8 * 4.70, 1) == 37.6 and round(4 * 12.92, 1) == 51.7"
    steps:
      - show: |
          <p><b>Bước 1 — 8 chữ thường:</b> $8 \cdot \log_2 26 \approx 8 \cdot 4{,}70 \approx \hl{37{,}6}$ bit.</p>
          <table class="t"><tr><th>cách sinh (ngẫu nhiên)</th><th>tính</th><th>entropy</th></tr>
          <tr><td>8 chữ thường</td><td>$8 \cdot \log_2 26$</td><td>≈ 37,6 bit</td></tr></table>
        focus: [1, 2]
        say: "Bước một, tám chữ thường cho 8 nhân lôgarit cơ số 2 của 26, tức 8 nhân 4 phẩy 70, khoảng 37 phẩy 6 bit. Ta ghi kết quả vào dòng đầu của bảng."
      - show: |
          <p><b>Bước 2 — 4 từ</b> từ danh sách 7776 từ (gieo 5 xúc xắc chọn 1 từ, $6^5 = 7776$): $\log_2 7776 \approx 12{,}92$ bit mỗi từ.</p>
          <p>$4 \cdot 12{,}92 \approx \hl{51{,}7}$ bit.</p>
        focus: [1, 1, 2]
        say: "Bước hai, bốn từ lấy từ danh sách 7776 từ, mỗi từ chọn bằng cách gieo 5 con xúc xắc, vì 6 mũ 5 bằng 7776. Mỗi từ cho lôgarit cơ số 2 của 7776, khoảng 12 phẩy 92 bit. Bốn từ cho 4 nhân 12 phẩy 92, khoảng 51 phẩy 7 bit."
      - show: |
          <p><b>Bước 3 — 12 ký tự</b> từ 62 (hoa, thường, số): $\log_2 62 \approx 5{,}9542$ bit mỗi ký tự.</p>
          <p>$12 \cdot 5{,}9542 \approx 71{,}45 \approx \hl{71{,}5}$ bit.</p>
        focus: [1, 2, 2]
        say: "Bước ba, mười hai ký tự lấy từ 62 ký tự gồm chữ hoa, chữ thường và số, mỗi ký tự cho khoảng 5 phẩy 9542 bit. Mười hai ký tự cho 12 nhân 5 phẩy 9542, khoảng 71 phẩy 45, làm tròn được 71 phẩy 5 bit. Ở đây phải giữ đủ chữ số, vì nhân 12 với số đã làm tròn 5 phẩy 95 chỉ ra 71 phẩy 4."
      - clear: true
        show: |
          <p><b>Bước 4 — so sánh:</b> $51{,}7 - 37{,}6 \approx 14$ bit, tức mạnh hơn khoảng $2^{14} = 16\,384$ lần.</p>
          <table class="t"><tr><th>cách sinh (ngẫu nhiên)</th><th>entropy</th></tr>
          <tr><td>8 chữ thường</td><td>≈ 37,6 bit</td></tr>
          <tr><td>4 từ từ danh sách 7776 từ</td><td>≈ $\hl{51{,}7}$ bit</td></tr>
          <tr><td>12 ký tự từ 62</td><td>≈ $\hl{71{,}5}$ bit</td></tr></table>
          <p>Bốn từ ngẫu nhiên như “mèo-cầu-sông-đèn” dễ nhớ hơn <code>k9Tq2xLm</code> mà mạnh hơn 8 chữ thường tới $2^{14}$ lần.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, so sánh, 51 phẩy 7 trừ 37 phẩy 6 được khoảng 14 bit, tức mạnh hơn khoảng 2 mũ 14, bằng 16 384 lần. Bảng sau gom lại cả ba cách sinh mã để so sánh. Bốn từ ngẫu nhiên như mèo, cầu, sông, đèn dễ nhớ hơn một chuỗi ký tự lộn xộn, mà mạnh hơn 8 chữ thường tới 2 mũ 14 lần."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: đếm thẳng số khả năng"
    checks:
      - "26 ** 8 == 208827064576 and 2 ** 37 < 26 ** 8 < 2 ** 38"
      - "7776 ** 4 == 6 ** 20 == 3656158440062976 and 2 ** 51 < 7776 ** 4 < 2 ** 52"
      - "round(7776 ** 4 / 26 ** 8) == 17508 and 2 ** 14 < 17508 < 2 ** 15"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đếm thẳng, không dùng lôgarit</th><th>kết quả</th></tr>
          <tr><td>37,6 bit</td><td>$26^8 = 208\,827\,064\,576$, nằm giữa $2^{37}$ và $2^{38}$</td><td>giữa 37 và 38 ✓</td></tr>
          <tr><td>51,7 bit</td><td>$7776^4 = 6^{20} = 3\,656\,158\,440\,062\,976$, nằm giữa $2^{51}$ và $2^{52}$</td><td>giữa 51 và 52 ✓</td></tr>
          <tr><td>gấp $2^{14}$ lần</td><td>chia thẳng $7776^4$ cho $26^8$</td><td>≈ $\hl{17\,508}$, giữa $2^{14}$ và $2^{15}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, đếm thẳng số khả năng, vì đếm không cần dùng lôgarit. 26 mũ 8 bằng khoảng 209 tỉ, nằm giữa 2 mũ 37 và 2 mũ 38, khớp 37 phẩy 6 bit. 7776 mũ 4 bằng 6 mũ 20, nằm giữa 2 mũ 51 và 2 mũ 52, khớp 51 phẩy 7 bit. Chia thẳng hai số cho khoảng 17 508 lần, nằm giữa 2 mũ 14 và 2 mũ 15, khớp phần so sánh."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, từ người mới tới người đã đi làm"
    checks:
      - "24 * 60 * 60 == 86400 and round(math.log2(86400), 1) == 16.4 and round(alg.entropy_bits(62, 12), 1) == 71.5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tính entropy cho mật khẩu người tự nghĩ <b class="red">(ảo)</b>
          <br><span class="note"><code>Matkhau@2024</code> “trông như” 12 ký tự từ 94 ký tự, nhưng người ta chọn theo mẫu quen (từ + ký tự + năm). Kẻ xấu đoán theo mẫu, nên số khả năng thật nhỏ hơn rất nhiều. Công thức chỉ đúng khi máy sinh ngẫu nhiên.</span></div>
        say: "Lỗi thứ nhất, tính entropy cho mật khẩu người tự nghĩ. Một mật khẩu kiểu chữ mật khẩu, a còng, 2024 trông như 12 ký tự lấy từ 94 ký tự, nhưng người ta chọn theo mẫu quen là một từ, một ký tự, một năm. Kẻ xấu đoán theo mẫu, nên số khả năng thật nhỏ hơn rất nhiều, và công thức chỉ đúng khi máy sinh ngẫu nhiên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bắt đổi mật khẩu định kỳ không lý do <b class="red">(phản tác dụng)</b>
          <br><span class="note">Người dùng chỉ đổi đuôi: <code>…2024</code> thành <code>…2025</code>. Hướng dẫn NIST SP 800-63B-4 (bản 8/2025): <b>không</b> bắt đổi định kỳ, chỉ bắt đổi khi có dấu hiệu lộ; <b>không</b> bắt trộn loại ký tự; so mật khẩu mới với danh sách mật khẩu đã lộ.</span></div>
        say: "Lỗi thứ hai, bắt đổi mật khẩu định kỳ không có lý do. Người dùng chỉ đổi đuôi từ 2024 thành 2025. Hướng dẫn bản tháng 8 năm 2025 của Viện Tiêu chuẩn Mỹ nói không bắt đổi định kỳ, chỉ bắt đổi khi có dấu hiệu lộ. Hướng dẫn đó cũng không bắt trộn loại ký tự, và yêu cầu so mật khẩu mới với danh sách mật khẩu đã lộ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng lại một mật khẩu cho nhiều trang <b class="red">(lộ một, mất tất cả)</b>
          <br><span class="note">Một trang nhỏ bị lộ, kẻ xấu thử cùng mật khẩu ở ngân hàng, thư điện tử. Dùng trình quản lý mật khẩu sinh mật khẩu ngẫu nhiên riêng cho từng nơi.</span></div>
        say: "Lỗi thứ ba, dùng lại một mật khẩu cho nhiều trang. Một trang nhỏ bị lộ là kẻ xấu thử cùng mật khẩu ở ngân hàng và thư điện tử, nên hãy dùng trình quản lý mật khẩu để sinh mật khẩu ngẫu nhiên riêng cho từng nơi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Sinh mật khẩu bằng bộ sinh số không dành cho mật mã <b class="red">(entropy nằm ở hạt giống)</b>
          <br><span class="note">Chương trình cấp mật khẩu tạm 12 ký tự, nhưng bộ sinh được khởi tạo bằng số giây trong ngày. Chỉ có 86 400 hạt giống, nên chỉ có 86 400 mật khẩu có thể xảy ra. Người làm nghề dùng bộ sinh ngẫu nhiên cho mật mã của hệ điều hành (thư viện <code>secrets</code>).</span></div>
          <table class="t"><tr><th>mật khẩu tạm 12 ký tự từ 62</th><th>trông như</th><th>entropy thật</th></tr>
          <tr><td>bộ sinh cho mật mã</td><td>71,5 bit</td><td>71,5 bit</td></tr>
          <tr><td>bộ sinh khởi tạo bằng giây trong ngày</td><td>71,5 bit</td><td class="red">$\log_2 86\,400 \approx \hl{16{,}4}$ bit</td></tr></table>
        focus: [1, 1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là sinh mật khẩu bằng một bộ sinh số không dành cho mật mã. Chương trình cấp mật khẩu tạm dài 12 ký tự, nhưng bộ sinh được khởi tạo bằng số giây trong ngày. Một ngày chỉ có 86 400 giây, nên chỉ có 86 400 mật khẩu có thể xảy ra. Người làm nghề dùng bộ sinh ngẫu nhiên cho mật mã của hệ điều hành. Bảng so hai cách sinh. Bộ sinh cho mật mã cho đúng 71 phẩy 5 bit như vẻ ngoài. Bộ sinh khởi tạo bằng giây chỉ cho khoảng 16 phẩy 4 bit, vì entropy nằm ở hạt giống, không ở độ dài."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.entropy_bits(10, 4), 1) == 13.3 and round(alg.entropy_bits(7776, 6), 1) == 77.5 and 2 ** 14 == 16384"
      - "round(math.log2(10), 2) == 3.32 and 10 ** 4 == 10000 and round(math.log2(7776), 2) == 12.92 and round(alg.entropy_bits(7776, 6) - alg.entropy_bits(62, 12)) == 6 and 2 ** 6 == 64"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mã PIN 4 chữ số ngẫu nhiên: entropy bao nhiêu bit?</td></tr>
          <tr><td>2</td><td>6 từ ngẫu nhiên từ danh sách 7776 từ: bao nhiêu bit? So với 12 ký tự ngẫu nhiên ở trên?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, mã PIN 4 chữ số ngẫu nhiên có entropy bao nhiêu bit? Câu hai, 6 từ ngẫu nhiên từ danh sách 7776 từ có bao nhiêu bit? So với 12 ký tự ngẫu nhiên ở trên thì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Mỗi chữ số có 10 khả năng: $\log_2 10 \approx 3{,}32$ bit. Bốn chữ số: $4 \cdot 3{,}32 \approx \hl{13{,}3}$ bit, tức chỉ $10^4 = 10\,000$ khả năng.</p>
          <p>Chỉ an toàn khi có giới hạn số lần thử: ví dụ thẻ khoá sau 3 lần sai thì kẻ đoán bừa (3 mã khác nhau) trúng với xác suất $\frac{3}{10\,000}$.</p>
        focus: [1, 1, 2, 2]
        say: "Đáp án câu một, mỗi chữ số có 10 khả năng, cho khoảng 3 phẩy 32 bit. Bốn chữ số cho 4 nhân 3 phẩy 32, khoảng 13 phẩy 3 bit, tức chỉ 10 nghìn khả năng. Vì vậy mã PIN chỉ an toàn khi có giới hạn số lần thử. Ví dụ thẻ khoá sau 3 lần sai thì kẻ đoán bừa 3 mã khác nhau chỉ trúng với xác suất 3 phần 10 nghìn."
      - show: |
          <p>② $6 \cdot \log_2 7776 \approx 6 \cdot 12{,}92 \approx \hl{77{,}5}$ bit.</p>
          <p>So với 12 ký tự ngẫu nhiên (71,5 bit): hơn khoảng 6 bit, tức mạnh hơn khoảng $2^6 = 64$ lần, và dễ nhớ hơn.</p>
        focus: [1, 2]
        say: "Câu hai, 6 nhân lôgarit cơ số 2 của 7776, tức 6 nhân 12 phẩy 92, khoảng 77 phẩy 5 bit. So với 71 phẩy 5 bit của 12 ký tự ngẫu nhiên, sáu từ hơn khoảng 6 bit, tức mạnh hơn khoảng 2 mũ 6 bằng 64 lần, và dễ nhớ hơn."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">entropy = k nhân log₂ N, chỉ khi sinh ngẫu nhiên</span><span class="a">→</span>
          <span class="n">mỗi bit gấp đôi số khả năng</span><span class="a">→</span>
          <span class="n">vẻ phức tạp ≠ độ mạnh</span><span class="a">→</span>
          <span class="n">nhiều từ ngẫu nhiên, riêng từng nơi</span></div>
        say: "Tổng kết lại, entropy bằng k nhân lôgarit cơ số 2 của N, và chỉ đúng khi sinh ngẫu nhiên. Mỗi bit gấp đôi số khả năng, vẻ phức tạp không phải là độ mạnh, nên hãy dùng nhiều từ ngẫu nhiên, và riêng cho từng nơi."
      - show: |
          <div class="box key"><b>Tư duy:</b> độ mạnh nằm ở <b>cách sinh</b>, không nằm ở chuỗi ký tự trông ra sao.</div>
        say: "Điều cần mang theo, độ mạnh nằm ở cách sinh ra mật khẩu, không nằm ở chuỗi ký tự trông ra sao."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>xác thực nhiều yếu tố</b> và mã một lần.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học xác thực nhiều yếu tố và mã một lần. Hẹn gặp bạn ở bài tiếp theo."
