  - 7776 ** 4 == 6 ** 20 == 3656158440062976 and 2 ** 51 < 7776 ** 4 < 2 ** 52
  - round(7776 ** 4 / 26 ** 8) == 17508 and 2 ** 14 < 17508 < 2 ** 15
  steps:
  - show: '<table class="t"><tr><th>con số</th><th>đếm thẳng, không dùng lôgarit</th><th>kết quả</th></tr>

      <tr><td>37,6 bit</td><td>$26^8 = 208\,827\,064\,576$, nằm giữa $2^{37}$ và $2^{38}$</td><td>giữa 37 và 38 ✓</td></tr>

      <tr><td>51,7 bit</td><td>$7776^4 = 6^{20} = 3\,656\,158\,440\,062\,976$, nằm giữa $2^{51}$ và $2^{52}$</td><td>giữa 51 và 52 ✓</td></tr>

      <tr><td>gấp $2^{14}$ lần</td><td>chia thẳng $7776^4$ cho $26^8$</td><td>≈ $\hl{17\,508}$, giữa $2^{14}$ và $2^{15}$ ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, đếm thẳng số khả năng, vì đếm không cần dùng lôgarit. 26 mũ 8 bằng khoảng 209 tỉ, nằm giữa 2 mũ 37 và 2 mũ 38, khớp 37 phẩy 6 bit. 7776 mũ 4 bằng 6 mũ 20, nằm giữa 2 mũ 51 và 2 mũ 52, khớp 51 phẩy 7 bit. Chia thẳng hai số cho khoảng 17 508 lần, nằm giữa 2 mũ 14 và 2 mũ 15, khớp phần so sánh.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, từ người mới tới người đã đi làm
  checks:
  - 24 * 60 * 60 == 86400 and round(math.log2(86400), 1) == 16.4 and round(alg.entropy_bits(62, 12), 1) == 71.5
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tính entropy cho mật khẩu người tự nghĩ <b class="red">(ảo)</b>

      <br><span class="note"><code>Matkhau@2024</code> “trông như” 12 ký tự từ 94 ký tự, nhưng người ta chọn theo mẫu quen (từ + ký tự + năm). Kẻ xấu đoán theo mẫu, nên số khả năng thật nhỏ hơn rất nhiều. Công thức chỉ đúng khi máy sinh ngẫu nhiên.</span></div>

      '
    say: Lỗi thứ nhất, tính entropy cho mật khẩu người tự nghĩ. Một mật khẩu kiểu chữ mật khẩu, a còng, 2024 trông như 12 ký tự lấy từ 94 ký tự, nhưng người ta chọn theo mẫu quen là một từ, một ký tự, một năm. Kẻ xấu đoán theo mẫu, nên số khả năng thật nhỏ hơn rất nhiều, và công thức chỉ đúng khi máy sinh ngẫu nhiên.
  - show: '<div class="box warn"><b>Lỗi 1b.</b> Nhầm $k \cdot N$ hoặc áp $k \cdot \log_2 N$ cho chuỗi theo thói quen <b class="red">(entropy ảo)</b>

      <br><span class="note">Mật khẩu đặt theo ngày sinh hoặc thay chữ thành số vẫn nằm trong từ điển tấn công dù bắt buộc ký tự đặc biệt ở chuỗi ngắn.</span></div>

      '
    say: Đừng nhân nhầm độ dài với cỡ bảng chữ cái, cũng đừng áp công thức lôgarit cho mật khẩu theo khuôn ngày sinh hay chữ thay số quen thuộc. Đặt quy tắc ép buộc ký tự rắc rối nhưng ngắn cũn tám ký tự chỉ tạo thói quen đặt chữ hoa đầu kèm số một cuối chuỗi.
    clear: true
  - show: '<div class="box warn"><b>Lỗi 2.</b> Bắt đổi mật khẩu định kỳ không lý do <b class="red">(phản tác dụng)</b>

      <br><span class="note">Người dùng chỉ đổi đuôi: <code>…2024</code> thành <code>…2025</code>. Hướng dẫn NIST SP 800-63B-4 (bản 8/2025): <b>không</b> bắt đổi định kỳ, chỉ bắt đổi khi có dấu hiệu lộ; <b>không</b> bắt trộn loại ký tự; so mật khẩu mới với danh sách mật khẩu đã lộ.</span></div>

      '
    say: Lỗi thứ hai, bắt đổi mật khẩu định kỳ không có lý do. Người dùng chỉ đổi đuôi từ 2024 thành 2025. Hướng dẫn bản tháng 8 năm 2025 của Viện Tiêu chuẩn Mỹ nói không bắt đổi định kỳ, chỉ bắt đổi khi có dấu hiệu lộ. Hướng dẫn đó cũng không bắt trộn loại ký tự, và yêu cầu so mật khẩu mới với danh sách mật khẩu đã lộ. Ép người dùng đổi mật khẩu định kỳ ngắn ngày làm họ thêm số một, hai ở cuối theo quy luật cực dễ đoán. Bỏ qua bước đối chiếu mật khẩu mới với danh sách hàng trăm nghìn mật khẩu yếu rò rỉ trước khi lưu.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dùng lại một mật khẩu cho nhiều trang <b class="red">(lộ một, mất tất cả)</b>

      <br><span class="note">Một trang nhỏ bị lộ, kẻ xấu thử cùng mật khẩu ở ngân hàng, thư điện tử. Dùng trình quản lý mật khẩu sinh mật khẩu ngẫu nhiên riêng cho từng nơi.</span></div>

      '
    say: Lỗi thứ ba, dùng lại một mật khẩu cho nhiều trang. Một trang nhỏ bị lộ là kẻ xấu thử cùng mật khẩu ở ngân hàng và thư điện tử, nên hãy dùng trình quản lý mật khẩu để sinh mật khẩu ngẫu nhiên riêng cho từng nơi. Không chặn danh sách hàng trăm nghìn mật khẩu phổ biến đã rò rỉ trước đây lúc người dùng tạo tài khoản mới. Chấp nhận mật khẩu toàn chữ cái liền kề trên bàn phím vốn đứng đầu bảng từ điển dò tìm tự động.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Sinh mật khẩu bằng bộ sinh số không dành cho mật mã <b class="red">(entropy nằm ở hạt giống)</b>

      <br><span class="note">Chương trình cấp mật khẩu tạm 12 ký tự, nhưng bộ sinh được khởi tạo bằng số giây trong ngày. Chỉ có 86 400 hạt giống, nên chỉ có 86 400 mật khẩu có thể xảy ra. Người làm nghề dùng bộ sinh ngẫu nhiên cho mật mã của hệ điều hành (thư viện <code>secrets</code>).</span></div>

      <table class="t"><tr><th>mật khẩu tạm 12 ký tự từ 62</th><th>trông như</th><th>entropy thật</th></tr>

      <tr><td>bộ sinh cho mật mã</td><td>71,5 bit</td><td>71,5 bit</td></tr>

      <tr><td>bộ sinh khởi tạo bằng giây trong ngày</td><td>71,5 bit</td><td class="red">$\log_2 86\,400 \approx \hl{16{,}4}$ bit</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, là sinh mật khẩu bằng một bộ sinh số không dành cho mật mã. Chương trình cấp mật khẩu tạm dài 12 ký tự, nhưng bộ sinh được khởi tạo bằng số giây trong ngày. Một ngày chỉ có 86 400 giây, nên chỉ có 86 400 mật khẩu có thể xảy ra. Người làm nghề dùng bộ sinh ngẫu nhiên cho mật mã của hệ điều hành. Bảng so hai cách sinh. Bộ sinh cho mật mã cho đúng 71 phẩy 5 bit như vẻ ngoài. Bộ sinh khởi tạo bằng giây chỉ cho khoảng 16 phẩy 4 bit, vì entropy nằm ở hạt giống, không ở độ dài. Không đặt giới hạn tốc độ sai hay cơ chế khoá tạm lúc đăng nhập trực tuyến cho phép thử hàng triệu lần tự do. Không hạn chế số lần thử sai liên tiếp ở giao diện đăng nhập mở cửa cho dò mật khẩu trực tuyến tự do.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.entropy_bits(10, 4), 1) == 13.3 and round(alg.entropy_bits(7776, 6), 1) == 77.5 and 2 ** 14 == 16384
  - round(math.log2(10), 2) == 3.32 and 10 ** 4 == 10000 and round(math.log2(7776), 2) == 12.92 and round(alg.entropy_bits(7776, 6) - alg.entropy_bits(62, 12)) == 6 and 2 ** 6 == 64
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Mã PIN 4 chữ số ngẫu nhiên: entropy bao nhiêu bit?</td></tr>

      <tr><td>2</td><td>6 từ ngẫu nhiên từ danh sách 7776 từ: bao nhiêu bit? So với 12 ký tự ngẫu nhiên ở trên?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, mã PIN 4 chữ số ngẫu nhiên có entropy bao nhiêu bit? Câu hai, 6 từ ngẫu nhiên từ danh sách 7776 từ có bao nhiêu bit? So với 12 ký tự ngẫu nhiên ở trên thì sao? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Mỗi chữ số có 10 khả năng: $\log_2 10 \approx 3{,}32$ bit. Bốn chữ số: $4 \cdot 3{,}32 \approx \hl{13{,}3}$ bit, tức chỉ $10^4 = 10\,000$ khả năng.</p>

      <p>Chỉ an toàn khi có giới hạn số lần thử: ví dụ thẻ khoá sau 3 lần sai thì kẻ đoán bừa (3 mã khác nhau) trúng với xác suất $\frac{3}{10\,000}$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Đáp án câu một, mỗi chữ số có 10 khả năng, cho khoảng 3 phẩy 32 bit. Bốn chữ số cho 4 nhân 3 phẩy 32, khoảng 13 phẩy 3 bit, tức chỉ 10 nghìn khả năng. Vì vậy mã PIN chỉ an toàn khi có giới hạn số lần thử. Ví dụ thẻ khoá sau 3 lần sai thì kẻ đoán bừa 3 mã khác nhau chỉ trúng với xác suất 3 phần 10 nghìn. Tính chính xác số bit độ hỗn loạn của chuỗi ngẫu nhiên sáu ký tự chữ thường so với cụm bốn từ chọn ngẫu nhiên từ điển.
  - show: '<p>② $6 \cdot \log_2 7776 \approx 6 \cdot 12{,}92 \approx \hl{77{,}5}$ bit.</p>

      <p>So với 12 ký tự ngẫu nhiên (71,5 bit): hơn khoảng 6 bit, tức mạnh hơn khoảng $2^6 = 64$ lần, và dễ nhớ hơn.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Câu hai, 6 nhân lôgarit cơ số 2 của 7776, tức 6 nhân 12 phẩy 92, khoảng 77 phẩy 5 bit. So với 71 phẩy 5 bit của 12 ký tự ngẫu nhiên, sáu từ hơn khoảng 6 bit, tức mạnh hơn khoảng 2 mũ 6 bằng 64 lần, và dễ nhớ hơn. Tính thời gian vét cạn trung bình ở tốc độ phần cứng thực tế để quyết định chuẩn chiều dài tối thiểu.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SEC/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành SEC:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính và so sánh số bit entropy giữa mật khẩu ký tự và cụm từ</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>c_alpha=26 c_len=8 w_dict=7776 w_len=4</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh SEC L02 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 2 theo đúng đề và dữ liệu mẫu trên màn hình, nếu chưa quen cú pháp Python hãy xem trước bài P Y T L 0 4. Đọc cỡ bảng chữ cái, độ dài ký tự, cỡ từ điển và số từ từ đầu vào chuẩn rồi tính hai giá trị entropy cơ số hai.
