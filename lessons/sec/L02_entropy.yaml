ill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="392" y="264" text-anchor="middle" font-size="28">7776</text><rect x="520" y="220" width="225" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="632" y="264" text-anchor="middle" font-size="28">7776</text><rect x="760" y="220" width="225" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="872" y="264" text-anchor="middle" font-size="28">7776</text><text x="1020" y="265" text-anchor="start" font-size="26" fill="#eb6834" font-weight="bold">≈ 51,7 bit</text><text x="40" y="350" text-anchor="start" font-size="22" fill="#4b5563">độ dài thanh = số bit; thêm 1 bit = gấp đôi số khả năng</text><rect x="260" y="375" width="451" height="32" rx="4" fill="#2a78d6"/><text x="245" y="400" text-anchor="end" font-size="22">8 chữ thường</text><text x="721" y="400" text-anchor="start" font-size="22">37,6 bit</text><rect x="260" y="420" width="620" height="32" rx="4" fill="#eb6834"/><text x="245" y="445" text-anchor="end" font-size="22">4 từ</text><text x="890" y="445" text-anchor="start" font-size="22">51,7 bit</text><rect x="260" y="465" width="858" height="32" rx="4" fill="#059669"/><text x="245" y="490" text-anchor="end" font-size="22">12 ký tự từ 62</text><text x="1128" y="490" text-anchor="start" font-size="22">71,5 bit</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ mật khẩu như một dãy ô, mỗi ô là một lựa chọn độc lập. Tám chữ thường là 8 ô, mỗi ô 26 khả năng, còn bốn từ là 4 ô, mỗi ô 7776 từ. Ô ít hơn nhưng mỗi ô rộng hơn nhiều, nên tổng số bit lớn hơn. Thanh phía dưới dài theo số bit, và thêm một bit là số khả năng gấp đôi. Mật khẩu bốn từ ghép ngẫu nhiên giống chiếc chìa khoá có bốn ổ bi độc lập buộc máy tính nhân hàng nghìn lựa chọn mũ bốn.
- id: example
  kind: example
  title: Ba cách sinh mật khẩu
  checks:
  - '[round(alg.entropy_bits(n, k), 1) for n, k in ((26, 8), (7776, 4), (62, 12))] == [37.6, 51.7, 71.5]'
  - round(math.log2(26), 2) == 4.70 and round(math.log2(7776), 2) == 12.92 and round(math.log2(62), 2) == 5.95 and round(alg.entropy_bits(7776, 4) - alg.entropy_bits(26, 8)) == 14 and 2 ** 14 == 16384
  - 7776 == 6 ** 5
  - round(math.log2(62), 4) == 5.9542 and round(12 * 5.9542, 2) == 71.45 and round(12 * 5.95, 1) == 71.4 and round(8 * 4.70, 1) == 37.6 and round(4 * 12.92, 1) == 51.7
  steps:
  - show: '<p><b>Bước 1 — 8 chữ thường:</b> $8 \cdot \log_2 26 \approx 8 \cdot 4{,}70 \approx \hl{37{,}6}$ bit.</p>

      <table class="t"><tr><th>cách sinh (ngẫu nhiên)</th><th>tính</th><th>entropy</th></tr>

      <tr><td>8 chữ thường</td><td>$8 \cdot \log_2 26$</td><td>≈ 37,6 bit</td></tr></table>

      '
    focus:
    - 1
    - 2
    say: Bước một, tám chữ thường cho 8 nhân lôgarit cơ số 2 của 26, tức 8 nhân 4 phẩy 70, khoảng 37 phẩy 6 bit. Ta ghi kết quả vào dòng đầu của bảng.
  - show: '<p><b>Bước 2 — 4 từ</b> từ danh sách 7776 từ (gieo 5 xúc xắc chọn 1 từ, $6^5 = 7776$): $\log_2 7776 \approx 12{,}92$ bit mỗi từ.</p>

      <p>$4 \cdot 12{,}92 \approx \hl{51{,}7}$ bit.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, bốn từ lấy từ danh sách 7776 từ, mỗi từ chọn bằng cách gieo 5 con xúc xắc, vì 6 mũ 5 bằng 7776. Mỗi từ cho lôgarit cơ số 2 của 7776, khoảng 12 phẩy 92 bit. Bốn từ cho 4 nhân 12 phẩy 92, khoảng 51 phẩy 7 bit.
  - show: '<p><b>Bước 3 — 12 ký tự</b> từ 62 (hoa, thường, số): $\log_2 62 \approx 5{,}9542$ bit mỗi ký tự.</p>

      <p>$12 \cdot 5{,}9542 \approx 71{,}45 \approx \hl{71{,}5}$ bit.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước ba, mười hai ký tự lấy từ 62 ký tự gồm chữ hoa, chữ thường và số, mỗi ký tự cho khoảng 5 phẩy 9542 bit. Mười hai ký tự cho 12 nhân 5 phẩy 9542, khoảng 71 phẩy 45, làm tròn được 71 phẩy 5 bit. Ở đây phải giữ đủ chữ số, vì nhân 12 với số đã làm tròn 5 phẩy 95 chỉ ra 71 phẩy 4.
  - clear: true
    show: '<p><b>Bước 4 — so sánh:</b> $51{,}7 - 37{,}6 \approx 14$ bit, tức mạnh hơn khoảng $2^{14} = 16\,384$ lần.</p>

      <table class="t"><tr><th>cách sinh (ngẫu nhiên)</th><th>entropy</th></tr>

      <tr><td>8 chữ thường</td><td>≈ 37,6 bit</td></tr>

      <tr><td>4 từ từ danh sách 7776 từ</td><td>≈ $\hl{51{,}7}$ bit</td></tr>

      <tr><td>12 ký tự từ 62</td><td>≈ $\hl{71{,}5}$ bit</td></tr></table>

      <p>Bốn từ ngẫu nhiên như “mèo-cầu-sông-đèn” dễ nhớ hơn <code>k9Tq2xLm</code> mà mạnh hơn 8 chữ thường tới $2^{14}$ lần.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước bốn, so sánh, 51 phẩy 7 trừ 37 phẩy 6 được khoảng 14 bit, tức mạnh hơn khoảng 2 mũ 14, bằng 16 384 lần. Bảng sau gom lại cả ba cách sinh mã để so sánh. Bốn từ ngẫu nhiên như mèo, cầu, sông, đèn dễ nhớ hơn một chuỗi ký tự lộn xộn, mà mạnh hơn 8 chữ thường tới 2 mũ 14 lần.
  - show: <p><b>Chạy thử bằng Python — đo entropy ký tự vs cụm từ:</b></p><div class="code"><div>import math</div><div>b1, b2 = 8 * math.log2(26), 4 * math.log2(7776)</div><div>print(round(b1, 1), round(b2, 1), b2 &gt; b1)</div></div>
    say: Chạy Python tính số bit entropy cho mật khẩu tám chữ thường và cụm bốn từ chọn ngẫu nhiên, xác nhận cụm bốn từ mạnh hơn rõ rệt.
    clear: true
    focus: null
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm thẳng số khả năng'
  checks:
