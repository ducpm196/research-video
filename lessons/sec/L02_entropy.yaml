scenes:
- id: hook
  kind: hook
  title: “Matkhau@2024” có chữ hoa, số, ký tự đặc biệt
  steps:
  - show: '<p>Quy định bắt mật khẩu có chữ hoa, chữ số, ký tự đặc biệt. Kết quả: ai cũng đặt kiểu <code>Matkhau@2024</code> — đúng mọi quy định, và nằm trong danh sách đoán thử đầu tiên của kẻ xấu.</p>

      <div class="box key">Hôm nay: <b>entropy</b> — đo độ mạnh bằng <b>số khả năng thật</b>, không bằng vẻ ngoài phức tạp.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, quy định bắt mật khẩu phải có chữ hoa, chữ số và ký tự đặc biệt. Kết quả là ai cũng đặt kiểu chữ mật khẩu viết hoa chữ đầu, thêm a còng và năm 2024, đúng mọi quy định, mà lại nằm trong danh sách đoán thử đầu tiên của kẻ xấu. Hôm nay ta học entropy, đo độ mạnh bằng số khả năng thật, không bằng vẻ ngoài phức tạp. Bắt buộc có chữ hoa, số và ký hiệu khiến người dùng đặt những mật khẩu đoán được trong nửa giây trong khi bốn từ ghép tự nhiên lại cực khó. Khái niệm độ hỗn loạn đo bằng đơn vị bit lột tả chính xác không gian tìm kiếm thực sự trước công cụ dò tìm tự động.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: quy tắc nhân, lũy thừa của 2, lôgarit cơ số 2'
  checks:
  - 26 * 26 == 676 and 2 ** 3 == 8 and math.log2(8) == 3 and 2 ** 4 < 26 < 2 ** 5 and round(math.log2(26), 2) == 4.70
  steps:
  - show: '<table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>

      <tr><td>quy tắc nhân: các lựa chọn độc lập thì số khả năng nhân với nhau</td><td>2 chữ thường: chữ đầu 26 cách, với <b>mỗi</b> chữ đầu lại 26 cách chọn chữ sau → 26 nhóm, mỗi nhóm 26: $26 \cdot 26 = 676$ khả năng</td></tr>

      <tr><td>lũy thừa của 2: mỗi lần nhân 2 là gấp đôi</td><td>$2^3 = 2 \cdot 2 \cdot 2 = 8$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    say: Trước hết, ta cần hiểu hai điều bài này sẽ dùng. Quy tắc nhân nói các lựa chọn độc lập thì số khả năng nhân với nhau, vì chữ đầu có 26 cách, và với mỗi chữ đầu lại có 26 cách chọn chữ sau. Vậy 2 chữ thường cho 26 nhóm, mỗi nhóm 26, tức 26 nhân 26 bằng 676 khả năng. Lũy thừa của 2 là gấp đôi liên tiếp, 2 mũ 3 bằng 2 nhân 2 nhân 2, bằng 8. Độ hỗn loạn tỉ lệ thuận theo lô-ga-rít cơ số hai của tổng số tổ hợp khả dĩ chứ không phải suy đoán cảm tính.
  - show: '<p>Lôgarit cơ số 2 hỏi ngược lại: <b>phải gấp đôi mấy lần</b> từ 1 để được số đó.</p>

      <p>$\log_2 8 = 3$ vì $2^3 = 8$. Với 26: $2^4 = 16 < 26 < 32 = 2^5$, nên $\log_2 26 \approx \hl{4{,}70}$, nằm giữa 4 và 5.</p>

      '
    introduces:
    - log
    - sub
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Lôgarit cơ số 2 hỏi ngược lại, phải gấp đôi mấy lần từ 1 để được số đó. Lôgarit cơ số 2 của 8 bằng 3, vì 2 mũ 3 bằng 8. Với 26, ta có 2 mũ 4 bằng 16 nhỏ hơn 26, mà 26 nhỏ hơn 2 mũ 5 bằng 32, nên lôgarit cơ số 2 của 26 khoảng 4 phẩy 70, nằm giữa 4 và 5. Mỗi bit độ hỗn loạn tăng thêm nhân đôi số lượng phép thử trung bình cần thiết để kẻ xấu đoán trúng.
- id: sym
  kind: symbol
  title: 'Giải mã: entropy'
  steps:
  - show: '<p>Mật khẩu sinh <b>ngẫu nhiên đều</b> gồm $k$ lựa chọn độc lập, mỗi lựa chọn có $N$ khả năng:</p>

      <p>$\text{entropy} = k \cdot \log_2 N$ bit</p>

      <p>Ý nghĩa: số khả năng $= 2^{\text{entropy}}$. Mỗi bit thêm vào làm số khả năng <b>gấp đôi</b>, tức thời gian đoán gấp đôi.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    - 3
    - 3
    say: Xét một mật khẩu sinh ngẫu nhiên đều, gồm k lựa chọn độc lập, mỗi lựa chọn có N khả năng. Entropy bằng k nhân lôgarit cơ số 2 của N, tính bằng bit. Ý nghĩa là số khả năng bằng 2 mũ entropy. Mỗi bit thêm vào làm số khả năng gấp đôi, tức thời gian đoán cũng gấp đôi. Mỗi bit độ hỗn loạn tăng thêm nhân đôi không gian tìm kiếm vét cạn của kẻ tấn công. Tập ký tự nhỏ nhưng chuỗi dài tự nhiên dễ nhớ luôn vượt trội vượt bậc so với chuỗi ngắn đầy ký hiệu rập khuôn.
- id: intuition
  kind: intuition
