id: L14
course: SEC
series: "SEC · An toàn thông tin"
title: "Bài 14 — Ứng phó sự cố, sao lưu và phục hồi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sec.yaml L14; audit/sec/verify_sec.py L14; NIST SP 800-61 Rev. 2, Computer Security Incident Handling Guide (2012), mục 3.1 (chuẩn bị là pha đầu; vòng đời 4 pha: chuẩn bị; phát hiện và phân tích; khoanh vùng, loại bỏ và phục hồi; sau sự cố); NIST SP 800-61 Rev. 3 (4/2025, thay Rev. 2; csrc.nist.gov truy cập 2026-11-09); P. Kral, SANS Incident Handler's Handbook (2011) (6 bước); CISA, #StopRansomware Guide (2023) (sao lưu ngoại tuyến, không ghi đè được); quy tắc sao lưu 3-2-1 (P. Krogh, 2009); DVO bài 10"
assumes: [arith]
# Quy ước: alg.backup_321([(phương tiện, nơi, không ghi đè được?)]) kiểm 4 điều kiện: ≥ 3 bản, ≥ 2 loại phương tiện, ≥ 1 bản ở nơi khác,
#   ≥ 1 bản không ghi đè được (điều kiện thứ tư là phần bổ sung chống mã độc tống tiền theo CISA 2023). Trả (đạt?, điều kiện thiếu).
objectives:
  - "Mô tả các bước ứng phó sự cố"
  - "Thiết kế sao lưu chống mã độc tống tiền"
  - "Biết vì sao phải thử khôi phục"
asr_reviewed:
  - {sentence: "Ví dụ 2 nghìn GB tức 2 triệu MB, chép qua đường 100 MB mỗi giây, mất 20 nghìn giây, khoảng 5 phẩy 6 giờ.", reason: "ASR chép “Ví dụ 2000GB tức 2 triệu megabyte, chép qua đường 100 megabyte mỗi giây, mất 20.000 giây, khoảng 5,6 giờ.” (0.926): MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Có sao lưu, nhưng sao lưu cũng bị mã hoá"
    checks:
      - "alg.backup_321([('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False)])[0] is False"
    steps:
      - show: |
          <p>Mã độc tống tiền mã hoá toàn bộ máy chủ. Công ty bình tĩnh: “có sao lưu mỗi đêm”. Nhưng ổ sao lưu gắn vào cùng mạng, cùng tài khoản quản trị — và đã bị mã hoá cùng lúc. Bản sao lưu ngoài cùng thì chưa ai từng thử khôi phục.</p>
          <div class="box key">Hôm nay: <b>ứng phó sự cố</b> theo từng bước, và <b>sao lưu</b> sống sót được qua chính sự cố đó.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, mã độc tống tiền mã hoá toàn bộ máy chủ. Công ty bình tĩnh vì có sao lưu mỗi đêm. Nhưng ổ sao lưu gắn vào cùng mạng, dùng cùng tài khoản quản trị, và đã bị mã hoá cùng lúc. Bản sao lưu ngoài cùng thì chưa ai từng thử khôi phục. Hôm nay ta học ứng phó sự cố theo từng bước, và sao lưu sống sót được qua chính sự cố đó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: sao lưu, đếm loại khác nhau, quyền tối thiểu"
    checks:
      - "15 - 0 == 15 and len({'đĩa', 'đĩa', 'đám mây'}) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>
          <tr><td><b>sao lưu</b>: bản chép dữ liệu tại một thời điểm; <b>khôi phục</b>: chép ngược về</td><td>sao lưu lúc 0 giờ, sự cố lúc 15 giờ → mất tối đa $\hl{15}$ giờ dữ liệu</td></tr>
          <tr><td>đếm số <b>loại khác nhau</b> trong một danh sách</td><td>đĩa, đĩa, đám mây → 3 bản nhưng chỉ 2 loại</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Trước hết, ta cần hiểu ba điều bài này sẽ dùng. Sao lưu là bản chép dữ liệu tại một thời điểm, khôi phục là chép ngược về. Vì vậy sao lưu lúc 0 giờ mà sự cố lúc 15 giờ thì mất tối đa 15 giờ dữ liệu. Đếm số loại khác nhau, danh sách đĩa, đĩa, đám mây có 3 bản nhưng chỉ 2 loại."
      - show: |
          <p>Ở bài 4, <b>quyền tối thiểu</b>: mỗi tài khoản chỉ có đúng quyền nó cần. Tài khoản chạy sao lưu chỉ cần quyền <b>thêm bản mới</b>, không cần quyền xoá hay ghi đè bản cũ.</p>
        say: "Điều thứ ba nhắc lại bài 4, quyền tối thiểu, mỗi tài khoản chỉ có đúng quyền nó cần. Tài khoản chạy sao lưu chỉ cần quyền thêm bản mới, không cần quyền xoá hay ghi đè bản cũ."

  - id: sym
    kind: symbol
    title: "Giải mã: sáu bước ứng phó và quy tắc 3-2-1"
    steps:
      - show: |
          <div class="chain"><span class="n">chuẩn bị</span><span class="a">→</span><span class="n">phát hiện</span><span class="a">→</span><span class="n">khoanh vùng</span><span class="a">→</span><span class="n">loại bỏ</span><span class="a">→</span><span class="n">phục hồi</span><span class="a">→</span><span class="n">rút kinh nghiệm</span></div>
          <p class="note">Sáu bước là cách chia phổ biến trong nghề (sổ tay SANS, 2011). NIST SP 800-61 Rev. 2 (2012) gộp khoanh vùng, loại bỏ, phục hồi thành một pha nên còn 4 pha; bản Rev. 3 (4/2025) đã thay bản 2012.</p>
          <p><b>Quy tắc 3-2-1</b>: ít nhất <b>3</b> bản dữ liệu, trên <b>2</b> loại phương tiện khác nhau, <b>1</b> bản ở nơi khác. Thêm điều kiện chống mã độc tống tiền: ít nhất một bản <b>không ghi đè được</b> (ngoại tuyến, hoặc khoá ghi trong một thời hạn).</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Ứng phó sự cố có sáu bước, chuẩn bị, phát hiện, khoanh vùng, loại bỏ, phục hồi, và rút kinh nghiệm. Chuẩn bị là có sẵn kế hoạch, người trực, công cụ và bản sao lưu đã thử, trước khi sự cố xảy ra. Khoanh vùng là cách ly máy bị chiếm để chặn lan, trước khi dọn. Sáu bước là cách chia phổ biến trong nghề, còn hướng dẫn năm 2012 của Viện Tiêu chuẩn Mỹ gộp ba bước giữa thành một pha, nên chỉ có 4 pha. Quy tắc ba hai một là có ít nhất 3 bản dữ liệu, trên 2 loại phương tiện khác nhau, và 1 bản ở nơi khác. Thêm điều kiện chống mã độc tống tiền, có ít nhất một bản không ghi đè được, tức ngoại tuyến hoặc khoá ghi trong một thời hạn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Kẻ có quyền quản trị với tới đâu"
    steps:
      - show: |
          <div><svg width="1500" height="410" viewBox="0 0 1500 410"><g fill="#1f2937"><rect x="40" y="165" width="360" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="220" y="209" text-anchor="middle" font-size="26">tài khoản quản trị</text><text x="220" y="241" text-anchor="middle" font-size="22" fill="#4b5563">đã bị chiếm</text><rect x="700" y="15" width="360" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="880" y="54" text-anchor="middle" font-size="24">máy chủ</text><text x="1085" y="55" text-anchor="start" font-size="22" fill="#b91c1c">bị mã hoá</text><rect x="700" y="95" width="360" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="880" y="134" text-anchor="middle" font-size="24">ổ sao lưu cùng mạng</text><text x="1085" y="135" text-anchor="start" font-size="22" fill="#b91c1c">bị mã hoá</text><rect x="700" y="175" width="360" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="880" y="214" text-anchor="middle" font-size="24">đám mây ghi đè được</text><text x="1085" y="215" text-anchor="start" font-size="22" fill="#b91c1c">bị xoá</text><rect x="700" y="255" width="360" height="62" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="880" y="294" text-anchor="middle" font-size="24">đám mây có khoá ghi</text><text x="1085" y="295" text-anchor="start" font-size="22" fill="#059669">khoá ghi: từ chối xoá</text><rect x="700" y="335" width="360" height="62" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="880" y="374" text-anchor="middle" font-size="24">băng ở kho khác</text><text x="1085" y="375" text-anchor="start" font-size="22" fill="#059669">ngoại tuyến: không có đường nối</text><line x1="400" y1="215" x2="698" y2="46" stroke="#b91c1c" stroke-width="3"/><polygon points="698,46 688,59 682,48" fill="#b91c1c"/><line x1="400" y1="215" x2="698" y2="126" stroke="#b91c1c" stroke-width="3"/><polygon points="698,126 686,136 682,124" fill="#b91c1c"/><line x1="400" y1="215" x2="698" y2="206" stroke="#b91c1c" stroke-width="3"/><polygon points="698,206 683,213 683,200" fill="#b91c1c"/><line x1="400" y1="215" x2="698" y2="286" stroke="#eb6834" stroke-width="3"/><polygon points="698,286 682,289 685,277" fill="#eb6834"/></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ tài khoản quản trị đã bị chiếm ở bên trái, và năm nơi giữ dữ liệu ở bên phải. Mũi tên đỏ là đường mà tài khoản đó với tới được, máy chủ, ổ sao lưu cùng mạng, và đám mây ghi đè được đều mất. Đám mây có khoá ghi vẫn nhận lệnh, nhưng từ chối xoá cho tới hết hạn khoá. Băng ở kho khác không có đường nối nào, nên không lệnh nào chạm được tới nó."

  - id: example
    kind: example
    title: "Ba phương án sao lưu"
    checks:
      - "alg.backup_321([('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False)]) == (False, ['ít hơn 3 bản', 'chỉ một loại phương tiện', 'không có bản ở nơi khác', 'không có bản không ghi đè được'])"
      - "alg.backup_321([('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False), ('đám mây', 'vùng khác', False)]) == (False, ['không có bản không ghi đè được'])"
      - "alg.backup_321([('đĩa', 'tại chỗ', False), ('băng', 'kho khác', False), ('đám mây', 'vùng khác', True)]) == (True, [])"
    steps:
      - show: |
          <p><b>Bước 1 — phương án A:</b> 2 bản trên cùng đĩa, tại chỗ.</p>
          <table class="t"><tr><th>số bản</th><th>loại phương tiện</th><th>bản ở nơi khác</th><th>bản không ghi đè được</th></tr>
          <tr><td class="red">2 (thiếu)</td><td class="red">1 (thiếu)</td><td class="red">0 (thiếu)</td><td class="red">0 (thiếu)</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước một, phương án A có 2 bản trên cùng một đĩa tại chỗ. Bảng kiểm bốn điều kiện, chỉ 2 bản, 1 loại phương tiện, không bản nào ở nơi khác, không bản nào khoá ghi. Phương án A thiếu cả bốn điều kiện."
      - show: |
          <p><b>Bước 2 — phương án B:</b> 2 đĩa tại chỗ + đám mây ở vùng khác (ghi đè được).</p>
          <table class="t"><tr><th>số bản</th><th>loại phương tiện</th><th>bản ở nơi khác</th><th>bản không ghi đè được</th></tr>
          <tr><td>3</td><td>2</td><td>1</td><td class="red">0 (thiếu)</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước hai, phương án B có 2 đĩa tại chỗ cộng một bản đám mây ở vùng khác nhưng ghi đè được. Có 3 bản, 2 loại, 1 bản ở nơi khác, chỉ thiếu bản không ghi đè được. Mã độc có quyền quản trị xoá được cả đám mây, nên một điều kiện thiếu này đủ làm mất hết."
      - clear: true
        show: |
          <p><b>Bước 3 — phương án C:</b> đĩa tại chỗ + băng ở kho khác + đám mây có khoá ghi.</p>
          <table class="t"><tr><th>số bản</th><th>loại phương tiện</th><th>bản ở nơi khác</th><th>bản không ghi đè được</th></tr>
          <tr><td>3</td><td>3</td><td>2</td><td class="green">1: <b>đạt</b></td></tr></table>
        focus: [1, "2.2"]
        say: "Bước ba, phương án C gồm đĩa tại chỗ, băng ở kho khác, và đám mây có khoá ghi. Có 3 bản, 3 loại, 2 bản ở nơi khác, và 1 bản không ghi đè được, nên phương án C đạt."
      - show: |
          <p><b>Bước 4 — vẫn chưa xong: thử khôi phục</b> và đo thời gian thật. Ví dụ 2 000 GB qua đường 100 MB mỗi giây:</p>
          <p>$\frac{2\,000\,000 \text{ MB}}{100 \text{ MB/s}} = 20\,000$ giây $\approx \hl{5{,}6}$ giờ — chỉ biết con số này khi đã thử.</p>
        introduces: [approx]
        focus: [1, 2, 2]
        say: "Bước bốn, vẫn chưa xong, phải thử khôi phục định kỳ và đo thời gian khôi phục thật. Ví dụ 2 nghìn GB tức 2 triệu MB, chép qua đường 100 MB mỗi giây, mất 20 nghìn giây, khoảng 5 phẩy 6 giờ. Con số này chỉ biết được khi đã thử, không phải khi đang có sự cố."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: diễn tập sự cố"
    checks:
      - "[sum(ro for _, _, ro in pl) for pl in ([('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False)], [('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False), ('đám mây', 'vùng khác', False)], [('đĩa', 'tại chỗ', False), ('băng', 'kho khác', False), ('đám mây', 'vùng khác', True)])] == [0, 0, 1]"
      - "[alg.backup_321(pl)[0] for pl in ([('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False)], [('đĩa', 'tại chỗ', False), ('đĩa', 'tại chỗ', False), ('đám mây', 'vùng khác', False)], [('đĩa', 'tại chỗ', False), ('băng', 'kho khác', False), ('đám mây', 'vùng khác', True)])] == [False, False, True]"
      - "2_000_000 / 100 == 20000 and round(20000 / 3600, 1) == 5.6"
    steps:
      - show: |
          <p>Không đọc lại luật, mà <b>diễn tập</b>: mã độc có quyền quản trị mã hoá mọi bản ghi đè được. Đếm thận trọng chỉ những bản khoá ghi còn lại:</p>
          <table class="t"><tr><th>phương án</th><th>bản còn dùng được</th><th>khớp phép kiểm luật?</th></tr>
          <tr><td>A</td><td class="red">0</td><td>thiếu 4 điều kiện ✓</td></tr>
          <tr><td>B</td><td class="red">0</td><td>thiếu 1 điều kiện ✓</td></tr>
          <tr><td>C</td><td class="green">1</td><td>đạt ✓</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng đường khác, không đọc lại luật mà diễn tập sự cố, vì sự cố thật mới là phép thử cuối cùng. Giả sử mã độc có quyền quản trị mã hoá mọi bản ghi đè được, và ta đếm thận trọng chỉ những bản khoá ghi còn lại. Bảng ghi kết quả từng phương án. Phương án A còn 0 bản. Phương án B cũng còn 0 bản, dù chỉ thiếu một điều kiện. Phương án C còn 1 bản, khớp đúng với kết luận đạt."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, từ người mới tới người đã đi làm"
    checks:
      - "sum(1 for acc, ro in [('qt', False), ('qt', False), ('qt', False)] if acc == 'qt' and not ro) == 3"
      - "sum(1 for acc, ro in [('qt', False), ('sl', False), ('sl', True)] if acc == 'qt' and not ro) == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sao lưu chưa từng thử khôi phục <b class="red">(chưa phải sao lưu)</b>
          <br><span class="note">Bản sao lưu hỏng, thiếu khoá giải mã, hay khôi phục mất ba tuần đều chỉ lộ ra khi thử. Diễn tập khôi phục định kỳ, có ghi kết quả.</span></div>
        say: "Lỗi thứ nhất, có sao lưu nhưng chưa từng thử khôi phục, thì chưa phải là sao lưu. Bản sao lưu hỏng, thiếu khoá giải mã, hay khôi phục mất ba tuần đều chỉ lộ ra khi thử, nên hãy diễn tập khôi phục định kỳ và ghi kết quả."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Xoá máy bị chiếm ngay lập tức <b class="red">(mất bằng chứng)</b>
          <br><span class="note">Khoanh vùng trước (cách ly mạng), giữ ảnh bộ nhớ và đĩa, rồi mới loại bỏ. Không biết kẻ xấu vào bằng đường nào thì phục hồi xong sẽ bị vào lại.</span></div>
        say: "Lỗi thứ hai, xoá máy bị chiếm ngay lập tức, làm mất bằng chứng. Hãy khoanh vùng trước bằng cách cách ly mạng, giữ ảnh bộ nhớ và đĩa, rồi mới loại bỏ. Không biết kẻ xấu vào bằng đường nào thì phục hồi xong sẽ bị vào lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Rút kinh nghiệm để tìm người có lỗi <b class="red">(lần sau ai cũng giấu)</b>
          <br><span class="note">Buổi rút kinh nghiệm không đổ lỗi: tìm vì sao hệ thống cho phép lỗi xảy ra, ghi việc cần làm có người chịu trách nhiệm và hạn chót.</span></div>
        say: "Lỗi thứ ba, rút kinh nghiệm để tìm người có lỗi, nên lần sau ai cũng giấu. Buổi rút kinh nghiệm không đổ lỗi, mà tìm vì sao hệ thống cho phép lỗi xảy ra, rồi ghi việc cần làm có người chịu trách nhiệm và hạn chót."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng chung tài khoản quản trị cho máy chủ và hệ sao lưu <b class="red">(một lần lộ, mất hết)</b>
          <br><span class="note">Người làm nghề cho hệ sao lưu một tài khoản riêng, chỉ có quyền thêm bản mới, và bật khoá ghi trên ít nhất một bản. Đếm số bản mà <b>một</b> tài khoản bị chiếm xoá được:</span></div>
          <table class="t"><tr><th>cách cấp quyền (3 bản)</th><th>bản xoá được khi lộ tài khoản máy chủ</th></tr>
          <tr><td>một tài khoản quản trị cho cả ba</td><td class="red">3 trên 3</td></tr>
          <tr><td>tài khoản sao lưu riêng + một bản khoá ghi</td><td class="green">1 trên 3 (chỉ bản trên máy chủ)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là dùng chung tài khoản quản trị cho máy chủ và hệ sao lưu. Người làm nghề cho hệ sao lưu một tài khoản riêng chỉ có quyền thêm bản mới, và bật khoá ghi trên ít nhất một bản. Bảng đếm số bản mà một tài khoản bị chiếm xoá được. Dùng một tài khoản quản trị cho cả ba thì lộ một lần là mất cả 3 trên 3. Tách tài khoản và khoá ghi thì chỉ mất 1 bản nằm trên chính máy chủ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.backup_321([('đĩa', 'tại chỗ', False), ('đám mây', 'vùng khác', False), ('đám mây', 'vùng khác 2', False)]) == (False, ['không có bản không ghi đè được'])"
      - "len({m for m, _, _ in [('đĩa', 'tại chỗ', False), ('đám mây', 'vùng khác', False), ('đám mây', 'vùng khác 2', False)]}) == 2 and sum(w != 'tại chỗ' for _, w, _ in [('đĩa', 'tại chỗ', False), ('đám mây', 'vùng khác', False), ('đám mây', 'vùng khác 2', False)]) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phương án: đĩa tại chỗ + hai bản đám mây ở hai vùng khác nhau, cùng tài khoản quản trị, ghi đè được. Đạt quy tắc không? Thiếu gì?</td></tr>
          <tr><td>2</td><td>Phát hiện một máy chủ web gửi dữ liệu lạ ra ngoài lúc nửa đêm. Ba việc đầu tiên nên làm theo thứ tự là gì?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, phương án gồm đĩa tại chỗ và hai bản đám mây ở hai vùng khác nhau. Chúng dùng cùng tài khoản quản trị và ghi đè được. Có đạt quy tắc không, và thiếu gì? Câu hai, bạn phát hiện một máy chủ web gửi dữ liệu lạ ra ngoài lúc nửa đêm. Ba việc đầu tiên nên làm theo thứ tự là gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: điều kiện</th><th>đếm</th><th>kết quả</th></tr>
          <tr><td>số bản</td><td>đĩa, mây, mây = 3</td><td>đạt</td></tr>
          <tr><td>loại phương tiện</td><td>đĩa, đám mây = 2</td><td>đạt</td></tr>
          <tr><td>bản ở nơi khác</td><td>2</td><td>đạt</td></tr>
          <tr><td>bản không ghi đè được</td><td>0</td><td class="red">thiếu</td></tr></table>
          <p><b class="red">Không đạt</b>: lộ tài khoản quản trị là mất cả ba. Bật khoá ghi, tách tài khoản sao lưu.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Đáp án câu một, đếm từng điều kiện. Có 3 bản, đạt. Có 2 loại phương tiện là đĩa và đám mây, đạt. Có 2 bản ở nơi khác, đạt. Không có bản nào không ghi đè được, nên thiếu điều kiện cuối. Phương án không đạt, lộ tài khoản quản trị là mất cả ba, nên hãy bật khoá ghi và tách tài khoản sao lưu."
      - show: |
          <table class="t"><tr><th>câu 2: thứ tự</th><th>việc</th><th>vì sao</th></tr>
          <tr><td>1</td><td>ghi nhận, báo đội ứng phó</td><td>bước phát hiện: có người chịu trách nhiệm</td></tr>
          <tr><td>2</td><td><b>khoanh vùng</b>: cách ly mạng máy đó, giữ nguyên máy</td><td>chặn dữ liệu tiếp tục ra ngoài</td></tr>
          <tr><td>3</td><td>giữ bằng chứng: ảnh bộ nhớ, nhật ký</td><td>biết kẻ xấu vào bằng đường nào trước khi dọn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, làm theo đúng thứ tự trong bảng. Việc thứ nhất là ghi nhận và báo đội ứng phó, đó là bước phát hiện, để có người chịu trách nhiệm. Việc thứ hai là khoanh vùng, cách ly mạng máy đó mà giữ nguyên máy, để chặn dữ liệu tiếp tục ra ngoài. Việc thứ ba là giữ bằng chứng như ảnh bộ nhớ và nhật ký, để biết kẻ xấu vào bằng đường nào trước khi dọn."

