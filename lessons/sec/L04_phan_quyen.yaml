- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">xác thực: là ai; phân quyền: được làm gì</span><span class="a">→</span>

      <span class="n">kiểm trên từng đối tượng, ở máy chủ</span><span class="a">→</span>

      <span class="n">vai trò, quyền tối thiểu</span><span class="a">→</span>

      <span class="n">tách bạch nhiệm vụ, rà soát định kỳ</span></div>

      '
    say: Tổng kết lại, xác thực là bạn là ai, phân quyền là bạn được làm gì. Hãy kiểm trên từng đối tượng, ở máy chủ, dùng vai trò với quyền tối thiểu, tách bạch nhiệm vụ, và rà soát định kỳ. Luôn kiểm tra phân quyền phía máy chủ ở mọi giao diện gọi hàm và ở cấp độ từng bản ghi dữ liệu cụ thể. Phân quyền đúng chỗ kết hợp từ chối mặc định và kiểm tra quyền sở hữu từng bản ghi khoá chặt đường leo thang đặc quyền.
  - show: '<div class="box key"><b>Tư duy:</b> mỗi yêu cầu là một câu hỏi “người này có được làm việc này với thứ này không?” — và câu trả lời mặc định là <b>không</b>.</div>

      '
    say: Điều cần mang theo, mỗi yêu cầu là một câu hỏi người này có được làm việc này với thứ này không, và câu trả lời mặc định là không. Quản lý vòng đời quyền hạn định kỳ giữ bán kính rủi ro ở mức tối giản nhất khi sự cố lộ phiên xảy ra. Áp dụng đặc quyền tối thiểu giới hạn thiệt hại ở phạm vi nhỏ nhất ngay cả khi một tài khoản dịch vụ bị chiếm.
  - clear: true
    show: '<p class="note">Bài sau (bài 5): <b>phiên đăng nhập</b>, cookie và giả mạo yêu cầu chéo trang.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 5, ta học phiên đăng nhập, cookie, và giả mạo yêu cầu chéo trang. Hẹn gặp bạn ở bài tiếp theo.
