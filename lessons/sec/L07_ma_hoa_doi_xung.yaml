id: L07
course: SEC
series: "SEC · An toàn thông tin"
title: "Bài 7 — Mã hoá đối xứng dùng đúng: chế độ và số dùng một lần"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sec.yaml L07; audit/sec/verify_sec.py L07; NIST SP 800-38A (2001) (các chế độ ECB, CTR); NIST SP 800-38D (2007) (GCM: mã hoá có xác thực; §8.3: IV ngẫu nhiên 96 bit → ≤ 2³² lần mã mỗi khoá); NIST SP 800-131A Rev. 2 (2019) (AES-128 được chấp nhận); D. Boneh, V. Shoup, A Graduate Course in Applied Cryptography (bản 0.6, 2023), chương 3, 5; NET bài 13"
assumes: [arith]
# Quy ước: alg.toy_block = HÀM KHỐI MINH HOẠ (8 byte đầu của SHA-256(khoá ‖ khối)), không phải mật mã thật, chỉ để thấy cấu trúc: mọi hàm khối thật
#   cũng tất định. ECB = mã từng khối độc lập (alg.ecb_encrypt); kiểu bộ đếm = khối i ⊕ toy_block(khoá, số dùng một lần ‖ i) (alg.ctr_like).
#   Bản mã hiện 8 ký tự hex đầu. ECB, CTR, GCM chỉ trên màn hình.
objectives:
  - "Giải thích vì sao mã từng khối độc lập lộ cấu trúc"
  - "Giải thích vai trò của số dùng một lần"
  - "Chọn mã hoá có xác thực"
asr_reviewed:
  - {sentence: "Với chế độ bộ đếm, lật bit nào ở bản mã là lật đúng bit đó ở bản rõ, chẳng hạn lật 2 bit của một byte biến chữ số 9 thành 5, mà người nhận không biết.", reason: "ASR chép “Với chế độ bộ đếm, lật biết nào ở bản mã là lật đúng biết đó ở bản rõ, chẳng hạn lật 2 biết của một bài biến chữ số 9 thành 5 mà người nhận không biết.” (0.895): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bit/biết, bit/biết, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mã hoá đối xứng là hai bên dùng chung một khoá để mã và giải mã, khoá 16 byte dài 16 nhân 8 bằng 128 bit.", reason: "ASR chép “Mả hóa đối xứng là hai bên dùng chung một khóa để mã và giải mã. Khóa 16 bay dài 16 nhân 8 bằng 128 bit.” (0.938): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mã/mả — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tự băm khoá ghép với khối một bằng thư viện băm và lấy 8 byte đầu, ta được đúng bản mã của khối một.", reason: "ASR chép “Tự băm khóa kép với khối 1 bằng thư viện băm và lấy 8 bay đầu, ta được đúng bản mã của khối 1.” (0.917): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ghép/kép — NOT_VERIFIED bằng tai người"}
  - {sentence: "Byte đầu của chế độ bộ đếm, khối một, là mã chữ T cộng loại trừ byte đầu của dòng khoá, tính tay ra a 6, khớp máy.", reason: "ASR chép “Bay đầu của chế độ bộ đếm, khối 1 là mã chữ T cộng loại trừ bay đầu của dòng khóa tính tay ra A6, khớp máy.” (0.929): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Byte thứ bảy là mã chữ 9 cộng loại trừ mã chữ 5, khác 0.", reason: "ASR chép “Bài thứ 7 là mã chữ 9 cộng loại trừ mã chữ 5, khác không?” (0.933): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ví dụ theo byte, mã chữ 9 cộng loại trừ mã chữ 5 ra một byte khác 0, và cộng loại trừ tiếp với mã chữ 9 thì ra lại mã chữ 5.", reason: "ASR chép “Ví dụ theo bay, mã chữ 9 cộng loại trừ mã chữ 5 ra một bay khác không và cộng loại trừ tiếp với mã chữ 9 thì ra lại mã chữ 5.” (0.939): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khối ba cũng bắt đầu bằng chữ T, nhưng dòng khoá khác, nên byte đầu ra b e, khác a 6.", reason: "ASR chép “Khối ba cũng bắt đầu bằng chữ T, nhưng dòng khóa khác nên bay đầu ra BE khác A6.” (0.952): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nếu kẻ xem trộm biết tin thứ nhất là lương 9 triệu, cộng loại trừ mã chữ 9 với byte vừa tìm ra đúng mã chữ 5, nên đọc được tin thứ hai.", reason: "ASR chép “Nếu kẻ xem trộm biết tin thứ nhất là lương 9 triệu, cộng loại trừ mã chữ 9 với bay vừa tìm ra đúng mã chữ 5 nên đọc được tin thứ 2.” (0.97): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "6 byte đầu bằng 0 vì hai tin giống nhau ở đó, chỉ khác ở byte thứ bảy, nên lộ ra hai tin chỉ khác một chữ số.", reason: "ASR chép “6 bai đầu bằng không vì 2 tin giống nhau ở đó, chỉ khác ở bai thứ 7, nên lộ ra 2 tin chỉ khác 1 chữ số.” (0.929): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàm khối mã một khối cố định, ví dụ 16 byte, bằng khoá, và nó tất định, cùng khoá cùng khối thì cùng kết quả.", reason: "ASR chép “Hàm khối mã một khối cố định, ví dụ 16 bay, bằng khóa và nó tất định, cùng khóa cùng khối thì cùng kết quả.” (0.962): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mã hoá rồi mà vẫn nhìn ra hình"
    checks:
      - "(lambda e: e[0] == e[2] and e[0] != e[1])(alg.ecb_encrypt(b'khoa-bi-mat', [b'TRA 100K', b'CHO  LAN', b'TRA 100K']))"
    steps:
      - show: |
          <p>Một ảnh được mã hoá bằng thuật toán mạnh, khoá dài. Mở bản mã ra xem như ảnh: vẫn thấy rõ đường viền con vật. Thuật toán không yếu — <b>cách dùng</b> sai: mỗi khối điểm ảnh giống nhau được mã thành cùng một khối mã.</p>
          <div class="box key">Hôm nay: dùng <b>mã hoá đối xứng</b> đúng — chế độ mã, số dùng một lần, và mã hoá có xác thực.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một ảnh được mã hoá bằng thuật toán mạnh với khoá dài. Mở bản mã ra xem như ảnh thì vẫn thấy rõ đường viền con vật. Thuật toán không yếu, cách dùng mới sai, vì mỗi khối điểm ảnh giống nhau được mã thành cùng một khối mã. Hôm nay ta học cách dùng đúng mã hoá đối xứng, với chế độ mã, số dùng một lần, và mã hoá có xác thực."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: byte, hệ mười sáu, khoá chung, cộng loại trừ"
    checks:
      - "ord('T') == 84 and format(84, '02x') == '54' and b'TRA 100K'.hex() == '545241203130304b' and len(b'TRA 100K') == 8 and 16 * 8 == 128"
      - "0x39 ^ 0x35 == 0x0c and 0x39 ^ 0x0c == 0x35 and all((a ^ b) == (a != b) for a in (0, 1) for b in (0, 1))"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>
          <tr><td>mỗi chữ là một <b>byte</b>, viết bằng 2 ký tự hệ mười sáu</td><td>chữ T có mã 84, hệ mười sáu là <code>54</code>; khối <code>TRA 100K</code> = 8 byte = <code>545241203130304b</code></td></tr>
          <tr><td>mã hoá đối xứng: hai bên dùng <b>chung một khoá</b> để mã và giải mã; <b>bản rõ</b> là tin gốc, <b>bản mã</b> là kết quả trông như ngẫu nhiên, chỉ ai có khoá mới đổi ngược được</td><td>khoá 16 byte = $16 \times 8 = 128$ bit (cỡ khoá AES-128, NIST vẫn chấp nhận theo SP 800-131A Rev. 2, 2019)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Trước hết, ta cần hiểu ba điều bài này sẽ dùng. Mỗi chữ là một byte, viết bằng 2 ký tự hệ mười sáu, chữ T có mã 84, viết hệ mười sáu là 54, nên khối tám chữ trả 100 nghìn dài đúng 8 byte. Mã hoá đối xứng là hai bên dùng chung một khoá để mã và giải mã, khoá 16 byte dài 16 nhân 8 bằng 128 bit. Bản rõ là tin gốc, còn bản mã là kết quả trông như ngẫu nhiên, chỉ ai có khoá mới đổi ngược được."
      - clear: true
        show: |
          <table class="t"><tr><th>bit a</th><th>bit b</th><th>a ⊕ b</th></tr>
          <tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></table>
          <p>Hai tính chất: <i>a</i> ⊕ <i>a</i> = 0, và (<i>a</i> ⊕ <i>k</i>) ⊕ <i>k</i> = <i>a</i>. Ví dụ theo byte: <code>39</code> (chữ 9) ⊕ <code>35</code> (chữ 5) = <code>0c</code>, rồi <code>39</code> ⊕ <code>0c</code> = <code>35</code>.</p>
        introduces: [xor_op]
        focus: [1, 1, 2, 2]
        say: "Điều thứ ba là phép cộng loại trừ từng bit. Bảng cho thấy hai bit giống nhau cho 0, hai bit khác nhau cho 1. Từ đó, một số cộng loại trừ với chính nó bằng 0, và cộng loại trừ hai lần với cùng một khoá thì quay về chỗ cũ. Ví dụ theo byte, mã chữ 9 cộng loại trừ mã chữ 5 ra một byte khác 0, và cộng loại trừ tiếp với mã chữ 9 thì ra lại mã chữ 5."

  - id: sym
    kind: symbol
    title: "Giải mã: hàm khối, chế độ, số dùng một lần"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>hàm khối</b></td><td>mã một khối cố định (ví dụ 16 byte) bằng khoá; <b>tất định</b>: cùng khoá, cùng khối → cùng kết quả</td></tr>
          <tr><td><b>chế độ ECB</b></td><td>mã từng khối độc lập → khối giống nhau lộ ra giống nhau</td></tr>
          <tr><td><b>chế độ bộ đếm</b></td><td>khối thứ $i$ ⊕ (hàm khối của số dùng một lần và $i$) → cùng bản rõ ở chỗ khác ra bản mã khác</td></tr>
          <tr><td><b>số dùng một lần</b></td><td>giá trị chỉ dùng <b>một lần</b> với mỗi khoá; không cần bí mật nhưng tuyệt đối không lặp</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn khái niệm. Hàm khối mã một khối cố định, ví dụ 16 byte, bằng khoá, và nó tất định, cùng khoá cùng khối thì cùng kết quả. Chế độ mã từng khối độc lập làm các khối giống nhau lộ ra giống nhau. Chế độ bộ đếm lấy khối thứ i cộng loại trừ từng bit với hàm khối của số dùng một lần và i, nên cùng bản rõ ở chỗ khác ra bản mã khác. Số dùng một lần là giá trị chỉ dùng một lần với mỗi khoá, nó không cần bí mật, nhưng tuyệt đối không được lặp."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cùng khối vào, cùng khối ra — trừ khi trộn thêm vị trí"
    checks:
      - "[__import__('hashlib').sha256(b'khoa-bi-mat' + b'N001' + i.to_bytes(4, 'big')).digest()[:4].hex() for i in range(3)] == ['f2b0b039', '255f07ca', 'ea261f45']"
      - "[x.hex()[:8] for x in alg.ecb_encrypt(b'khoa-bi-mat', [b'TRA 100K', b'CHO  LAN', b'TRA 100K'])] == ['d054752c', '8210f1d9', 'd054752c'] and [x.hex()[:8] for x in alg.ctr_like(b'khoa-bi-mat', b'N001', [b'TRA 100K', b'CHO  LAN', b'TRA 100K'])] == ['a6e2f119', '661748ea', 'be745e65']"
    steps:
      - show: |
          <div><svg width="1300" height="624" viewBox="0 0 1500 720"><g fill="#1f2937"><text x="60" y="35" text-anchor="start" font-size="24" fill="#b91c1c" font-weight="bold">mã từng khối độc lập (ECB)</text><rect x="160" y="50" width="280" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="300" y="88" text-anchor="middle" font-size="24">TRA 100K</text><line x1="300" y1="110" x2="300" y2="143" stroke="#1f2937" stroke-width="3"/><polygon points="300,143 294,128 306,128" fill="#1f2937"/><rect x="160" y="145" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="300" y="182" text-anchor="middle" font-size="22">hàm khối, khoá</text><line x1="300" y1="205" x2="300" y2="238" stroke="#1f2937" stroke-width="3"/><polygon points="300,238 294,223 306,223" fill="#1f2937"/><rect x="160" y="240" width="280" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="300" y="278" text-anchor="middle" font-size="24">d054752c…</text><rect x="610" y="50" width="280" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="750" y="88" text-anchor="middle" font-size="24">CHO  LAN</text><line x1="750" y1="110" x2="750" y2="143" stroke="#1f2937" stroke-width="3"/><polygon points="750,143 744,128 756,128" fill="#1f2937"/><rect x="610" y="145" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="182" text-anchor="middle" font-size="22">hàm khối, khoá</text><line x1="750" y1="205" x2="750" y2="238" stroke="#1f2937" stroke-width="3"/><polygon points="750,238 744,223 756,223" fill="#1f2937"/><rect x="610" y="240" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="278" text-anchor="middle" font-size="24">8210f1d9…</text><rect x="1060" y="50" width="280" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="1200" y="88" text-anchor="middle" font-size="24">TRA 100K</text><line x1="1200" y1="110" x2="1200" y2="143" stroke="#1f2937" stroke-width="3"/><polygon points="1200,143 1194,128 1206,128" fill="#1f2937"/><rect x="1060" y="145" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1200" y="182" text-anchor="middle" font-size="22">hàm khối, khoá</text><line x1="1200" y1="205" x2="1200" y2="238" stroke="#1f2937" stroke-width="3"/><polygon points="1200,238 1194,223 1206,223" fill="#1f2937"/><rect x="1060" y="240" width="280" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1200" y="278" text-anchor="middle" font-size="24">d054752c…</text><text x="750" y="340" text-anchor="middle" font-size="22" fill="#b91c1c">khối 1 và khối 3 cho cùng bản mã: lộ cấu trúc</text><text x="60" y="395" text-anchor="start" font-size="24" fill="#059669" font-weight="bold">chế độ bộ đếm</text><rect x="160" y="410" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="300" y="447" text-anchor="middle" font-size="22">hàm khối(N001, 0)</text><line x1="300" y1="470" x2="300" y2="503" stroke="#1f2937" stroke-width="3"/><polygon points="300,503 294,488 306,488" fill="#1f2937"/><rect x="160" y="505" width="280" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="300" y="542" text-anchor="middle" font-size="21">dòng khoá f2b0b039…</text><line x1="300" y1="565" x2="300" y2="598" stroke="#1f2937" stroke-width="3"/><polygon points="300,598 294,583 306,583" fill="#1f2937"/><text x="316" y="590" text-anchor="start" font-size="20">⊕ TRA 100K</text><rect x="160" y="600" width="280" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="300" y="638" text-anchor="middle" font-size="24">a6e2f119…</text><rect x="610" y="410" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="447" text-anchor="middle" font-size="22">hàm khối(N001, 1)</text><line x1="750" y1="470" x2="750" y2="503" stroke="#1f2937" stroke-width="3"/><polygon points="750,503 744,488 756,488" fill="#1f2937"/><rect x="610" y="505" width="280" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="750" y="542" text-anchor="middle" font-size="21">dòng khoá 255f07ca…</text><line x1="750" y1="565" x2="750" y2="598" stroke="#1f2937" stroke-width="3"/><polygon points="750,598 744,583 756,583" fill="#1f2937"/><text x="766" y="590" text-anchor="start" font-size="20">⊕ CHO  LAN</text><rect x="610" y="600" width="280" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="750" y="638" text-anchor="middle" font-size="24">661748ea…</text><rect x="1060" y="410" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1200" y="447" text-anchor="middle" font-size="22">hàm khối(N001, 2)</text><line x1="1200" y1="470" x2="1200" y2="503" stroke="#1f2937" stroke-width="3"/><polygon points="1200,503 1194,488 1206,488" fill="#1f2937"/><rect x="1060" y="505" width="280" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="1200" y="542" text-anchor="middle" font-size="21">dòng khoá ea261f45…</text><line x1="1200" y1="565" x2="1200" y2="598" stroke="#1f2937" stroke-width="3"/><polygon points="1200,598 1194,583 1206,583" fill="#1f2937"/><text x="1216" y="590" text-anchor="start" font-size="20">⊕ TRA 100K</text><rect x="1060" y="600" width="280" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1200" y="638" text-anchor="middle" font-size="24">be745e65…</text><text x="750" y="700" text-anchor="middle" font-size="22" fill="#059669">số thứ tự khối khác nhau → dòng khoá khác → bản mã khác</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình trên là mã từng khối độc lập, mỗi khối đi thẳng qua hàm khối với cùng khoá. Khối một và khối ba giống nhau nên ra cùng một bản mã, tô đỏ, cấu trúc bị lộ. Hình dưới là chế độ bộ đếm, hàm khối nhận số dùng một lần cùng số thứ tự khối, tạo ra một dòng khoá, rồi cộng loại trừ với bản rõ. Số thứ tự khác nhau nên dòng khoá khác nhau, và bản mã khác nhau dù bản rõ trùng."

  - id: example
    kind: example
    title: "Ba khối, hai chế độ"
    checks:
      - "[x.hex()[:8] for x in alg.ecb_encrypt(b'khoa-bi-mat', [b'TRA 100K', b'CHO  LAN', b'TRA 100K'])] == ['d054752c', '8210f1d9', 'd054752c']"
      - "[x.hex()[:8] for x in alg.ctr_like(b'khoa-bi-mat', b'N001', [b'TRA 100K', b'CHO  LAN', b'TRA 100K'])] == ['a6e2f119', '661748ea', 'be745e65']"
    steps:
      - show: |
          <p><b>Bước 1 — mã từng khối độc lập:</b></p>
          <table class="t"><tr><th>khối bản rõ</th><th>bản mã</th></tr>
          <tr><td><code>TRA 100K</code></td><td><code>d054752c…</code></td></tr>
          <tr><td><code>CHO  LAN</code></td><td><code>8210f1d9…</code></td></tr>
          <tr><td><code>TRA 100K</code></td><td><code class="red">d054752c…</code></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước một, mã ba khối bằng cách mã từng khối độc lập. Khối một trả 100 nghìn cho ra một bản mã. Khối hai cho ra một bản mã khác. Khối ba giống hệt khối một, và cho ra đúng bản mã của khối một."
      - show: |
          <p><b>Bước 2 — người xem trộm so bản mã:</b> khối 1 = khối 3 → biết ngay “khối 1 và khối 3 giống nhau”, không cần khoá.</p>
          <p class="note">Hàm khối minh hoạ, không phải mật mã thật — nhưng hiện tượng giống hệt với mọi hàm khối tất định thật.</p>
        focus: [1, 1, 2]
        say: "Bước hai, đặt mình vào chỗ người xem trộm và so các bản mã. Khối một trùng khối ba, nên người đó biết ngay hai khối này giống nhau mà không cần khoá. Đây là hàm khối minh hoạ, không phải mật mã thật, nhưng hiện tượng giống hệt với mọi hàm khối tất định thật."
      - clear: true
        show: |
          <p><b>Bước 3 — chế độ bộ đếm</b>, số dùng một lần <code>N001</code>:</p>
          <table class="t"><tr><th>khối bản rõ</th><th>hàm khối nhận</th><th>bản mã</th></tr>
          <tr><td><code>TRA 100K</code></td><td><code>N001</code>, khối 0</td><td><code>a6e2f119…</code></td></tr>
          <tr><td><code>CHO  LAN</code></td><td><code>N001</code>, khối 1</td><td><code>661748ea…</code></td></tr>
          <tr><td><code>TRA 100K</code></td><td><code>N001</code>, khối 2</td><td><code class="green">be745e65…</code> — khác khối đầu</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, mã lại ba khối đó bằng chế độ bộ đếm với số dùng một lần N 001. Khối đầu, hàm khối nhận số dùng một lần và số thứ tự 0. Khối hai nhận số thứ tự 1. Khối ba nhận số thứ tự 2, nên dù bản rõ giống khối đầu, bản mã vẫn khác."
      - show: |
          <p><b>Bước 4 — giải mã:</b> cộng loại trừ bản mã với <b>cùng</b> dòng khoá: (<i>p</i> ⊕ <i>k</i>) ⊕ <i>k</i> = <i>p</i>. Máy chạy lại chế độ bộ đếm lên ba bản mã → đúng <code>TRA 100K</code>, <code>CHO  LAN</code>, <code>TRA 100K</code>.</p>
        focus: [1, 1]
        say: "Bước bốn, người nhận có khoá giải mã bằng cách cộng loại trừ bản mã với cùng dòng khoá, vì cộng loại trừ hai lần thì quay về chỗ cũ. Máy chạy lại chế độ bộ đếm lên ba bản mã, và được đúng ba khối bản rõ ban đầu."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "__import__('hashlib').sha256(b'khoa-bi-mat' + b'TRA 100K').hexdigest()[:8] == 'd054752c' == alg.ecb_encrypt(b'khoa-bi-mat', [b'TRA 100K'])[0].hex()[:8]"
      - "0x54 ^ 0xf2 == 0xa6 and 0x54 ^ 0xea == 0xbe and alg.ctr_like(b'khoa-bi-mat', b'N001', alg.ctr_like(b'khoa-bi-mat', b'N001', [b'TRA 100K', b'CHO  LAN', b'TRA 100K'])) == [b'TRA 100K', b'CHO  LAN', b'TRA 100K']"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>khối 1 bản mã <code>d054752c…</code></td><td>tự băm khoá ghép khối bằng thư viện băm, lấy 8 byte đầu</td><td><code>d054752c</code> ✓</td></tr>
          <tr><td>byte đầu chế độ bộ đếm, khối 1</td><td>chữ T (<code>54</code>) ⊕ byte đầu dòng khoá (<code>f2</code>)</td><td><code>a6</code> ✓</td></tr>
          <tr><td>byte đầu chế độ bộ đếm, khối 3</td><td>chữ T (<code>54</code>) ⊕ byte đầu dòng khoá khối 3 (<code>ea</code>)</td><td><code>be</code> ✓ — khác <code>a6</code></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Tự băm khoá ghép với khối một bằng thư viện băm và lấy 8 byte đầu, ta được đúng bản mã của khối một. Byte đầu của chế độ bộ đếm, khối một, là mã chữ T cộng loại trừ byte đầu của dòng khoá, tính tay ra a 6, khớp máy. Khối ba cũng bắt đầu bằng chữ T, nhưng dòng khoá khác, nên byte đầu ra b e, khác a 6."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, từ người mới tới người đã đi làm"
    checks:
      - "len(set(range(1, 1001)) & set(range(1, 601))) == 600 and alg.ctr_like(b'khoa-1', b'N001', [b'TRA 100K']) != alg.ctr_like(b'khoa-2', b'N001', [b'TRA 100K'])"
      - "(lambda c1, c2: bytes(i ^ j for i, j in zip(c1, c2)) == bytes(i ^ j for i, j in zip(b'LUONG 9M', b'LUONG 5M')))(alg.ctr_like(b'khoa-bi-mat', b'N777', [b'LUONG 9M'])[0], alg.ctr_like(b'khoa-bi-mat', b'N777', [b'LUONG 5M'])[0])"
      - "ord('9') ^ 0x0c == ord('5') and bin(0x0c).count('1') == 2 and (lambda c: alg.ctr_like(b'khoa-bi-mat', b'N777', [c[:6] + bytes([c[6] ^ 0x0c]) + c[7:]])[0])(alg.ctr_like(b'khoa-bi-mat', b'N777', [b'LUONG 9M'])[0]) == b'LUONG 5M'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng lại số dùng một lần với cùng khoá <b class="red">(lộ bản rõ)</b>
          <br><span class="note">Hai bản mã cùng khoá, cùng số dùng một lần: cộng loại trừ hai bản mã ra đúng cộng loại trừ hai bản rõ — phần dòng khoá triệt tiêu. Biết một bản rõ là đọc được bản kia. Sinh số dùng một lần bằng bộ đếm hoặc ngẫu nhiên đủ dài.</span></div>
        say: "Lỗi thứ nhất, dùng lại số dùng một lần với cùng khoá. Hai bản mã cùng khoá và cùng số dùng một lần thì cộng loại trừ hai bản mã ra đúng cộng loại trừ hai bản rõ, vì phần dòng khoá triệt tiêu. Biết một bản rõ là đọc được bản kia, nên hãy sinh số dùng một lần bằng bộ đếm, hoặc ngẫu nhiên đủ dài."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mã hoá mà không xác thực <b class="red">(bản mã bị sửa)</b>
          <br><span class="note">Với chế độ bộ đếm, lật bit nào ở bản mã là lật đúng bit đó ở bản rõ: cộng loại trừ byte thứ bảy với <code>0c</code> (lật 2 bit) biến “9” thành “5” mà người nhận không biết. Dùng <b>mã hoá có xác thực</b> (như chế độ GCM): bản mã bị sửa thì giải mã báo lỗi.
          <br>Với GCM, lặp số dùng một lần còn cho kẻ xấu giả được tin hợp lệ. Số ngẫu nhiên 96 bit: không quá $2^{32}$ tin cho mỗi khoá (NIST SP 800-38D).</span></div>
        say: "Lỗi thứ hai, mã hoá mà không xác thực. Với chế độ bộ đếm, lật bit nào ở bản mã là lật đúng bit đó ở bản rõ, chẳng hạn lật 2 bit của một byte biến chữ số 9 thành 5, mà người nhận không biết. Hãy dùng mã hoá có xác thực, bản mã bị sửa thì giải mã sẽ báo lỗi. Với mã hoá có xác thực, dùng lại số dùng một lần còn tệ hơn, vì kẻ xấu giả được cả tin hợp lệ. Nếu số dùng một lần là số ngẫu nhiên dài 96 bit, mỗi khoá chỉ nên dùng cho tối đa 2 mũ 32 tin."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tự ghép thuật toán, tự chọn chế độ <b class="red">(dễ sai)</b>
          <br><span class="note">Dùng giao diện cấp cao của thư viện đã được kiểm định (mã hoá có xác thực, tự sinh số dùng một lần). Khoá sinh bằng bộ sinh số ngẫu nhiên an toàn, không lấy từ mật khẩu một cách trực tiếp.</span></div>
        say: "Lỗi thứ ba, tự ghép thuật toán và tự chọn chế độ. Hãy dùng giao diện cấp cao của thư viện đã được kiểm định, có mã hoá có xác thực và tự sinh số dùng một lần. Khoá phải sinh bằng bộ sinh số ngẫu nhiên an toàn, không lấy trực tiếp từ mật khẩu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Bộ đếm số dùng một lần chỉ nằm trong bộ nhớ <b class="red">(khởi động lại là lặp)</b>
          <br><span class="note">Dịch vụ đếm 1, 2, 3… cho mỗi tin; khởi động lại thì bộ đếm về 1 trong khi khoá vẫn như cũ. Người làm nghề lưu bộ đếm bền vững, hoặc đổi khoá mỗi lần khởi động, hoặc để thư viện tự sinh số dùng một lần.</span></div>
          <table class="t"><tr><th>giai đoạn</th><th>số dùng một lần</th><th>trùng với trước</th></tr>
          <tr><td>trước khi khởi động lại</td><td>1 tới 1000</td><td>—</td></tr>
          <tr><td>sau khởi động lại, gửi 600 tin, khoá cũ</td><td>1 tới 600</td><td class="red">$\hl{600}$ số trùng</td></tr>
          <tr><td>sau khởi động lại, khoá mới</td><td>1 tới 600</td><td class="green">0 cặp cùng khoá</td></tr></table>
        focus: [1, 1, 1, 2, "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là bộ đếm số dùng một lần chỉ nằm trong bộ nhớ. Dịch vụ đếm một, hai, ba cho mỗi tin, và khi khởi động lại thì bộ đếm về 1 trong khi khoá vẫn như cũ. Người làm nghề lưu bộ đếm bền vững, hoặc đổi khoá mỗi lần khởi động, hoặc để thư viện tự sinh số dùng một lần. Bảng cho thấy trước khi khởi động lại đã dùng các số từ 1 tới 1000. Sau đó gửi 600 tin với khoá cũ thì cả 600 số đều trùng, mỗi cặp lộ cộng loại trừ của hai bản rõ. Đổi sang khoá mới thì không còn cặp nào dùng lại số với cùng khoá."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "bytes(i ^ j for i, j in zip(b'LUONG 9M', b'LUONG 5M')).hex() == '0000000000000c00'"
      - "0x39 ^ 0x0c == 0x35 == ord('5') and ord('9') == 0x39"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hai tin “LUONG 9M” và “LUONG 5M” bị mã bằng cùng khoá, cùng số dùng một lần. Kẻ xem trộm tính cộng loại trừ hai bản mã: biết được gì?</td></tr>
          <tr><td>2</td><td>Bảng điểm mã bằng chế độ mã từng khối độc lập, mỗi dòng một khối. Kẻ xem trộm biết được gì dù không có khoá?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai tin lương 9 triệu và lương 5 triệu bị mã bằng cùng khoá và cùng số dùng một lần. Kẻ xem trộm tính cộng loại trừ hai bản mã thì biết được gì? Câu hai, bảng điểm mã bằng chế độ mã từng khối độc lập, mỗi dòng một khối. Kẻ xem trộm biết được gì dù không có khoá? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Dòng khoá triệt tiêu → được đúng cộng loại trừ hai bản rõ:</p>
          <table class="t"><tr><th>vị trí</th><th>tin 1</th><th>tin 2</th><th>⊕</th></tr>
          <tr><td>1 tới 6</td><td><code>LUONG </code></td><td><code>LUONG </code></td><td><code>00</code> cả 6 byte</td></tr>
          <tr><td>7</td><td>9 (<code>39</code>)</td><td>5 (<code>35</code>)</td><td class="red"><code>0c</code></td></tr>
          <tr><td>8</td><td><code>M</code></td><td><code>M</code></td><td><code>00</code></td></tr></table>
        focus: [1, 2, "2.3"]
        say: "Đáp án câu một, kẻ xem trộm có đúng cộng loại trừ của hai bản rõ. 6 byte đầu bằng 0 vì hai tin giống nhau ở đó, chỉ khác ở byte thứ bảy, nên lộ ra hai tin chỉ khác một chữ số. Byte thứ bảy là mã chữ 9 cộng loại trừ mã chữ 5, khác 0."
      - show: |
          <p>Nếu kẻ xem trộm biết tin 1 là <code>LUONG 9M</code>: <code>39</code> ⊕ <code>0c</code> = <code>35</code> = chữ 5 → đọc được tin 2.</p>
          <p>② Những dòng <b>giống nhau</b> (ví dụ cùng điểm) — đủ để đoán phân bố, so người này với người kia.</p>
        focus: [1, 1, 2]
        say: "Bước tiếp theo cho thấy vì sao nguy hiểm. Nếu kẻ xem trộm biết tin thứ nhất là lương 9 triệu, cộng loại trừ mã chữ 9 với byte vừa tìm ra đúng mã chữ 5, nên đọc được tin thứ hai. Câu hai, kẻ xem trộm biết những dòng nào giống nhau, chẳng hạn cùng điểm, đủ để đoán phân bố và so người này với người kia."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
