source: "curriculum/sec.yaml L11; audit/sec/verify_sec.py L11; H. Shacham và cộng sự, On the Effectiveness of Address-Space Randomization, ACM CCS (2004); Microsoft Security Response Center, “A proactive approach to more secure code” (2019) — khoảng 70% lỗ hổng được vá là lỗi an toàn bộ nhớ; CISA/NSA, The Case for Memory Safe Roadmaps (2023); CSA bài 1, OSY bài 9"
assumes: [arith, power, frac]
# Quy ước: mức KHÁI NIỆM để hiểu vì sao cần các lớp bảo vệ, không mô tả cách khai thác. Ngẫu nhiên hoá địa chỉ với b bit entropy: số lần đoán vét
#   trung bình = 2^b / 2 KHI khởi động lại giữ nguyên bố trí (tiến trình con sao chép từ tiến trình cha — trường hợp Shacham 2004: đoán không lặp lại).
#   Nếu mỗi lần khởi động lại bố trí mới thì các lần đoán độc lập, xác suất 1/2^b → trung bình 2^b lần (verify_sec.py kiểm cả hai bằng Monte Carlo).
objectives:
  - "Giải thích tràn bộ đệm ở mức khái niệm"
  - "Mô tả ngẫu nhiên hoá địa chỉ, vùng nhớ không thực thi, chim hoàng yến"
  - "Hiểu vì sao ngôn ngữ an toàn bộ nhớ là giải pháp gốc"
