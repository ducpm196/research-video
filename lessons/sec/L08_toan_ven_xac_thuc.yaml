id: L08
course: SEC
series: "SEC · An toàn thông tin"
title: "Bài 8 — Toàn vẹn và xác thực thông điệp"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sec.yaml L08; audit/sec/verify_sec.py L08; RFC 2104 (HMAC) và vector kiểm thử RFC 4231; FIPS 180-4 (SHA-256); Python docs, hmac.compare_digest; ESY bài 7 (mã kiểm tổng chống lỗi ngẫu nhiên)"
assumes: [arith]
# Quy ước: mã kiểm tổng CRC-32 (zlib), băm SHA-256 (hashlib), mã xác thực thông điệp HMAC-SHA256 (hmac) — đều thư viện chuẩn; hiện 16 ký tự hex đầu
#   (CRC-32: 8 ký tự). Khoá ví dụ “khoa-chung” chỉ để minh hoạ. HMAC chỉ trên màn hình; lời đọc “mã xác thực thông điệp”.
objectives:
  - "Phân biệt mã kiểm tổng, hàm băm, mã xác thực thông điệp, chữ ký số"
  - "Dùng mã xác thực thông điệp có khoá"
  - "So sánh mã bằng phép so thời gian hằng"
asr_reviewed:
  - {sentence: "Kẻ xấu không sửa gì, chỉ gửi lại y nguyên một tin cũ kèm mã cũ, và mã vẫn đúng.", reason: "ASR chép “Kẻ xấu không sửa gì, chỉ gửi lại yên nguyên một tim cũ kè mã cũ, và mã vẫn đúng.” (0.85): lệch âm/thanh thuần Việt: i/yên, tin/tim, kèm/kè — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sửa 100 thành 900, rồi tính lại mã kiểm"
    checks:
      - "format(__import__('zlib').crc32(b'chuyen 900'), '08x') == 'af8dde0e'"
    steps:
      - show: |
          <p>Lệnh <code>chuyen 100</code> được gửi kèm một mã kiểm tổng để phát hiện lỗi truyền. Kẻ đứng giữa sửa thành <code>chuyen 900</code>, rồi <b>tự tính lại</b> mã kiểm tổng cho khớp — ai cũng tính được, vì không cần khoá. Máy chủ kiểm: khớp. Tiền đi.</p>
          <div class="box key">Hôm nay: <b>toàn vẹn</b> và <b>xác thực thông điệp</b> — chống sửa có chủ đích, không chỉ lỗi ngẫu nhiên.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, lệnh chuyển 100 được gửi kèm một mã kiểm tổng để phát hiện lỗi truyền. Kẻ đứng giữa sửa thành chuyển 900, rồi tự tính lại mã kiểm tổng cho khớp, ai cũng tính được vì không cần khoá. Máy chủ kiểm thấy khớp, và tiền đi. Hôm nay ta học toàn vẹn và xác thực thông điệp, chống sửa có chủ đích, không chỉ chống lỗi ngẫu nhiên."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hàm băm, mã kiểm tổng, khoá chung"
    checks:
      - "__import__('hashlib').sha256(b'chuyen 100').hexdigest()[:8] == '05b1707c' and __import__('hashlib').sha256(b'chuyen 900').hexdigest()[:8] == 'c7012834' and len(__import__('hashlib').sha256(b'chuyen 100').hexdigest()) == 64"
      - "32 // 4 == 8 and len(format(__import__('zlib').crc32(b'chuyen 100'), '08x')) == 8"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>
          <tr><td><b>hàm băm</b>: từ chuỗi bất kỳ ra chuỗi độ dài cố định, không tính ngược được</td><td>SHA-256 ra 64 ký tự hệ mười sáu; <code>chuyen 100</code> → <code>05b1707c…</code>, <code>chuyen 900</code> → <code>c7012834…</code></td></tr>
          <tr><td><b>mã kiểm tổng</b>: công thức công khai, không có khoá</td><td>CRC-32 ra 32 bit = 8 ký tự hệ mười sáu</td></tr>
          <tr><td><b>khoá chung</b>: hai bên giữ cùng một khoá bí mật</td><td>ngân hàng và máy chủ thanh toán cùng giữ <code>khoa-chung</code></td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn ba điều bài này sẽ dùng. Như ở bài 1, hàm băm tính từ chuỗi bất kỳ ra một chuỗi độ dài cố định, không tính ngược được, hàm băm phổ biến nhất ra 64 ký tự hệ mười sáu. Đổi chuyển 100 thành chuyển 900, mã băm đổi hẳn ngay từ ký tự đầu. Ở khoá Hệ thống nhúng và thời gian thực, mã kiểm tổng là một công thức công khai không có khoá, loại 32 bit viết bằng 8 ký tự hệ mười sáu. Như ở bài 7, khoá chung là khoá bí mật mà hai bên cùng giữ."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn loại “dấu kiểm”"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>cần khoá?</th><th>chống được</th></tr>
          <tr><td><b>mã kiểm tổng</b> (CRC)</td><td>không</td><td>lỗi truyền ngẫu nhiên — <b>không</b> chống được sửa cố ý</td></tr>
          <tr><td><b>hàm băm</b> (SHA-256)</td><td>không</td><td>phát hiện tệp bị đổi, nếu chính mã băm đến qua kênh tin cậy</td></tr>
          <tr><td><b>mã xác thực thông điệp</b> (HMAC)</td><td>khoá <b>chung</b> hai bên</td><td>sửa cố ý: không có khoá thì không tạo được mã đúng</td></tr>
          <tr><td><b>chữ ký số</b></td><td>khoá bí mật ký, khoá công khai kiểm</td><td>sửa cố ý, và chứng minh <b>ai</b> ký (không chối bỏ được)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng so bốn loại dấu kiểm. Mã kiểm tổng không cần khoá, chỉ chống lỗi truyền ngẫu nhiên, không chống được sửa cố ý. Hàm băm không cần khoá, phát hiện tệp bị đổi, nếu chính mã băm đến qua một kênh tin cậy. Mã xác thực thông điệp dùng khoá chung của hai bên, chống được sửa cố ý vì không có khoá thì không tạo được mã đúng. Chữ ký số dùng khoá bí mật để ký và khoá công khai để kiểm, chống sửa cố ý, và còn chứng minh được ai đã ký."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ai tự tính được dấu kiểm?"
    checks:
      - "format(__import__('zlib').crc32(b'chuyen 100'), '08x') == 'a19e8fb6' and format(__import__('zlib').crc32(b'chuyen 900'), '08x') == 'af8dde0e'"
      - "alg.hmac_tag(b'khoa-chung', b'chuyen 100')[:8] == '06c6f7f2' and alg.hmac_tag(b'khoa-chung', b'chuyen 900')[:8] == 'bfa8cd7e'"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><g fill="#1f2937"><text x="60" y="38" text-anchor="start" font-size="24" fill="#b91c1c" font-weight="bold">mã kiểm tổng, không khoá</text><rect x="60" y="55" width="330" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="225" y="99" text-anchor="middle" font-size="24">chuyen 100</text><text x="225" y="131" text-anchor="middle" font-size="22" fill="#4b5563">kèm a19e8fb6</text><line x1="390" y1="105" x2="583" y2="105" stroke="#1f2937" stroke-width="3"/><polygon points="583,105 568,111 568,99" fill="#1f2937"/><rect x="585" y="55" width="330" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="750" y="99" text-anchor="middle" font-size="22">kẻ giữa sửa thành 900</text><text x="750" y="131" text-anchor="middle" font-size="22" fill="#4b5563">tự tính lại af8dde0e</text><line x1="915" y1="105" x2="1108" y2="105" stroke="#1f2937" stroke-width="3"/><polygon points="1108,105 1093,111 1093,99" fill="#1f2937"/><rect x="1110" y="55" width="330" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1275" y="99" text-anchor="middle" font-size="22">máy chủ tính: af8dde0e</text><text x="1275" y="131" text-anchor="middle" font-size="22" fill="#4b5563">khớp → tiền đi</text><text x="60" y="238" text-anchor="start" font-size="24" fill="#059669" font-weight="bold">mã xác thực, khoá chung</text><rect x="60" y="255" width="330" height="100" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="225" y="299" text-anchor="middle" font-size="24">chuyen 100 + khoá</text><text x="225" y="331" text-anchor="middle" font-size="22" fill="#4b5563">kèm 06c6f7f2…</text><line x1="390" y1="305" x2="583" y2="305" stroke="#1f2937" stroke-width="3"/><polygon points="583,305 568,311 568,299" fill="#1f2937"/><rect x="585" y="255" width="330" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="750" y="299" text-anchor="middle" font-size="22">kẻ giữa sửa thành 900</text><text x="750" y="331" text-anchor="middle" font-size="22" fill="#4b5563">không có khoá</text><line x1="915" y1="305" x2="1108" y2="305" stroke="#1f2937" stroke-width="3"/><polygon points="1108,305 1093,311 1093,299" fill="#1f2937"/><rect x="1110" y="255" width="330" height="100" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1275" y="299" text-anchor="middle" font-size="22">máy chủ tính: bfa8cd7e…</text><text x="1275" y="331" text-anchor="middle" font-size="22" fill="#4b5563">không khớp → từ chối</text><text x="750" y="410" text-anchor="middle" font-size="22" fill="#059669">khoá chỉ nằm ở hai đầu: kẻ ở giữa không tạo được mã đúng cho tin đã sửa</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình trên là mã kiểm tổng, kẻ đứng giữa sửa 100 thành 900 rồi tự tính lại mã kiểm tổng, vì công thức công khai. Máy chủ tính lại cũng ra đúng số đó, thấy khớp, và tiền đi. Hình dưới là mã xác thực thông điệp, khoá chỉ nằm ở hai đầu, nên kẻ ở giữa sửa tin mà không tạo được mã mới. Máy chủ tính bằng khoá ra một mã khác, không khớp, và từ chối."

  - id: example
    kind: example
    title: "Ba dấu kiểm cho cùng một lệnh"
    checks:
      - "format(__import__('zlib').crc32(b'chuyen 100'), '08x') == 'a19e8fb6' and alg.hmac_tag(b'khoa-chung', b'chuyen 100') == '06c6f7f2f943b79e'"
      - "alg.hmac_tag(b'khoa-chung', b'chuyen 900') == 'bfa8cd7e9747cb9d' and alg.hmac_tag(b'khoa-khac', b'chuyen 100') == '8b59fe333ac89816'"
    steps:
      - show: |
          <p><b>Bước 1 — mã kiểm tổng của lệnh gốc:</b></p>
          <table class="t"><tr><th>lệnh</th><th>mã kiểm tổng</th></tr>
          <tr><td><code>chuyen 100</code></td><td><code>a19e8fb6</code></td></tr></table>
        focus: [1, "2.2"]
        say: "Bước một, tính mã kiểm tổng cho lệnh chuyển 100. Ai cũng tính được con số này, vì công thức công khai và không có khoá."
      - show: |
          <p><b>Bước 2 — kẻ xấu sửa và tính lại:</b></p>
          <table class="t"><tr><th>lệnh</th><th>mã kiểm tổng</th><th>máy chủ</th></tr>
          <tr><td><code>chuyen 900</code></td><td><code>af8dde0e</code> — kẻ xấu tự tính</td><td class="red">tính lại cũng ra <code>af8dde0e</code>: khớp, nhận</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước hai, kẻ xấu sửa thành chuyển 900 và tự tính mã kiểm tổng mới. Máy chủ tính lại cũng ra đúng số đó, thấy khớp, và nhận lệnh. Mã kiểm tổng không chống được việc kẻ xấu cố ý sửa nội dung."
      - clear: true
        show: |
          <p><b>Bước 3 — mã xác thực với khoá chung:</b></p>
          <table class="t"><tr><th>lệnh</th><th>mã xác thực, khoá chung</th></tr>
          <tr><td><code>chuyen 100</code></td><td><code>06c6f7f2f943b79e</code></td></tr>
          <tr><td><code>chuyen 900</code></td><td><code>bfa8cd7e9747cb9d</code> — <b>chỉ</b> người có khoá tính được</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, thay bằng mã xác thực thông điệp với khoá chung. Lệnh chuyển 100 có một mã xác thực. Với lệnh chuyển 900, mã xác thực mới chỉ người có khoá chung mới tính được."
      - show: |
          <p><b>Bước 4 — kẻ xấu không có khoá:</b> thử một khoá sai cho <code>chuyen 900</code> → <code>7f24fe7f2d36a911</code> ≠ <code>bfa8cd7e…</code>; khoá sai cho chính <code>chuyen 100</code> cũng ra mã khác: <code>8b59fe333ac89816</code>. Máy chủ so, không khớp, <b class="green">từ chối</b>.</p>
        focus: [1, 1]
        say: "Bước bốn, kẻ xấu không có khoá, thử một khoá sai cho lệnh chuyển 900 thì ra một mã khác hẳn mã đúng, và khoá sai cho chính lệnh chuyển 100 cũng ra mã khác. Kẻ xấu không có khoá chỉ tạo ra được những mã khác, chẳng hạn dùng sai khoá, nên máy chủ so thấy không khớp và từ chối."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda k, h: h(bytes(x ^ 0x5c for x in k) + h(bytes(x ^ 0x36 for x in k) + b'chuyen 100').digest()).hexdigest()[:16])(b'khoa-chung'.ljust(64, b'\\0'), __import__('hashlib').sha256) == '06c6f7f2f943b79e' == alg.hmac_tag(b'khoa-chung', b'chuyen 100')"
      - "format(__import__('binascii').crc32(b'chuyen 100') & 0xFFFFFFFF, '08x') == 'a19e8fb6' and sum(x == y for x, y in zip('06c6f7f2f943b79e', 'bfa8cd7e9747cb9d')) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>mã xác thực <code>06c6f7f2…</code></td><td>tự cài theo định nghĩa chuẩn: trộn khoá với hai hằng số, băm hai lớp lồng nhau</td><td>trùng ✓</td></tr>
          <tr><td>mã kiểm tổng <code>a19e8fb6</code></td><td>tính bằng một thư viện khác</td><td>trùng ✓</td></tr>
          <tr><td>đổi 100 thành 900 thì mã đổi hẳn</td><td>đếm vị trí trùng giữa hai mã xác thực 16 ký tự</td><td>chỉ $\hl{2}$ trên 16, như đoán bừa ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Tự cài mã xác thực theo định nghĩa chuẩn, trộn khoá với hai hằng số rồi băm hai lớp lồng nhau, ta được đúng mã của thư viện. Tính mã kiểm tổng bằng một thư viện khác cũng ra cùng số. Đếm vị trí trùng giữa mã của lệnh 100 và lệnh 900, chỉ có 2 trên 16 vị trí, cỡ như hai chuỗi đoán bừa."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, từ người mới tới người đã đi làm"
    checks:
      - "alg.hmac_tag(b'khoa-chung', b'chuyen 100|so 1')[:8] == 'e1fe2343' and alg.hmac_tag(b'khoa-chung', b'chuyen 100|so 1') != alg.hmac_tag(b'khoa-chung', b'chuyen 100|so 2')"
      - "(lambda seen, msgs: sum(100 for m in msgs if not (m in seen or seen.add(m))))(set(), ['so 1'] * 3) == 100 and 3 * 100 == 300"
      - "__import__('hmac').compare_digest(alg.hmac_tag(b'khoa-chung', b'chuyen 100'), '06c6f7f2f943b79e') and not __import__('hmac').compare_digest('06c6f7f2f943b79e', '06c6f7f2f943b79f')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ mã hoá là đã bảo đảm toàn vẹn <b class="red">(sửa được mà không biết)</b>
          <br><span class="note">Bài 7: với chế độ bộ đếm, lật bit bản mã lật đúng bit bản rõ. Cần xác thực — mã hoá có xác thực, hoặc mã xác thực thông điệp đặt <b>sau</b> khi mã hoá.</span></div>
        say: "Lỗi thứ nhất, nghĩ mã hoá là đã bảo đảm toàn vẹn. Như ở bài 7, với chế độ bộ đếm, lật bit bản mã là lật đúng bit bản rõ. Cần có xác thực, dùng mã hoá có xác thực, hoặc mã xác thực thông điệp đặt sau khi mã hoá."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> So mã bằng phép so chuỗi thường <b class="red">(lộ qua thời gian)</b>
          <br><span class="note">Phép so thường dừng ở ký tự sai đầu tiên: đo thời gian trả lời có thể đoán dần từng ký tự. Dùng phép so <b>thời gian hằng</b> (<code>hmac.compare_digest</code>).</span></div>
        say: "Lỗi thứ hai, so mã bằng phép so chuỗi thường. Phép so thường dừng ở ký tự sai đầu tiên, nên đo thời gian trả lời có thể đoán dần từng ký tự. Hãy dùng phép so có thời gian hằng, có sẵn trong thư viện chuẩn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tự chế mã xác thực bằng “băm(khoá ghép tin)” <b class="red">(kéo dài được)</b>
          <br><span class="note">Với nhiều hàm băm, biết băm(khoá ghép tin) là tính được băm(khoá ghép tin ghép phần thêm) mà không cần khoá. Dùng đúng cấu trúc chuẩn (HMAC), có trong thư viện.</span></div>
        say: "Lỗi thứ ba, tự chế mã xác thực bằng cách băm khoá ghép với tin. Với nhiều hàm băm, biết giá trị đó là tính được băm của khoá ghép tin ghép thêm phần mới, mà không cần khoá. Hãy dùng đúng cấu trúc chuẩn, có sẵn trong thư viện."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Mã xác thực đúng nhưng không chống <b>gửi lại</b> <b class="red">(tin cũ vẫn hợp lệ)</b>
          <br><span class="note">Kẻ xấu không sửa gì, chỉ gửi lại y nguyên một tin cũ kèm mã cũ: mã vẫn đúng. Người làm nghề đưa số thứ tự hoặc thời điểm vào <b>trong</b> phần được xác thực, và máy chủ từ chối số đã dùng.</span></div>
          <table class="t"><tr><th>lần nhận</th><th>tin (mã <code>e1fe2343…</code>)</th><th>chỉ kiểm mã</th><th>kiểm mã + số chưa dùng</th></tr>
          <tr><td>1</td><td><code>chuyen 100|so 1</code></td><td>chuyển</td><td>chuyển</td></tr>
          <tr><td>2, 3 (gửi lại)</td><td><code>chuyen 100|so 1</code></td><td class="red">chuyển thêm 2 lần</td><td class="green">từ chối: số 1 đã dùng</td></tr>
          <tr><td>tổng tiền đi</td><td></td><td class="red">$3 \times 100 = 300$</td><td class="green">100</td></tr></table>
        focus: [1, 1, 1, 2, "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, là mã xác thực đúng nhưng không chống gửi lại. Kẻ xấu không sửa gì, chỉ gửi lại y nguyên một tin cũ kèm mã cũ, và mã vẫn đúng. Người làm nghề đưa số thứ tự hoặc thời điểm vào trong phần được xác thực, và máy chủ từ chối số đã dùng. Bảng cho thấy lần nhận đầu, cả hai cách đều chuyển tiền. Kẻ xấu gửi lại thêm 2 lần, máy chủ chỉ kiểm mã thì chuyển thêm 2 lần, còn máy chủ kiểm số thứ tự thì từ chối. Tổng tiền đi là 300 so với đúng 100."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tệp cài đặt tải từ một trang gương, kèm mã băm SHA-256 đăng trên <b>cùng</b> trang gương đó. Mã băm có bảo vệ được bạn khỏi trang gương bị chiếm không?</td></tr>
          <tr><td>2</td><td>Hai dịch vụ của cùng một công ty cần chống sửa tin nhắn giữa chúng; không cần chứng minh với bên thứ ba. Chọn loại dấu kiểm nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tệp cài đặt tải từ một trang gương, kèm mã băm đăng trên cùng trang gương đó. Mã băm có bảo vệ được bạn khi trang gương bị chiếm không? Câu hai, hai dịch vụ của cùng một công ty cần chống sửa tin nhắn giữa chúng, và không cần chứng minh với bên thứ ba. Chọn loại dấu kiểm nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>thứ cần kiểm</th><th>ai kiểm soát</th></tr>
          <tr><td>tệp cài đặt</td><td>trang gương</td></tr>
          <tr><td>mã băm để so</td><td class="red">cũng trang gương</td></tr></table>
          <p>① <b>Không</b>: kẻ chiếm trang gương thay cả tệp lẫn mã băm, và tính lại mã băm cho khớp — hàm băm không cần khoá.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, hỏi trước hết ai kiểm soát từng thứ. Tệp cài đặt nằm trên trang gương. Mã băm để so cũng nằm trên chính trang gương đó. Vì vậy câu trả lời là không, vì kẻ chiếm trang gương thay được cả tệp lẫn mã băm, và hàm băm không cần khoá nên ai cũng tính lại được."
      - show: |
          <p>Cách đúng: lấy mã băm hoặc <b>chữ ký</b> từ kênh tin cậy khác (trang chính thức, khoá công khai của nhà phát hành).</p>
          <p>② Hai bên cùng một công ty, giữ được khoá chung, không cần chứng minh với người ngoài → <b>mã xác thực thông điệp</b>: nhanh, đủ chống sửa; chữ ký số chỉ cần khi phải chứng minh ai ký với người ngoài.</p>
        focus: [1, 2, 2]
        say: "Cách đúng là lấy mã băm hoặc chữ ký đến từ một kênh tin cậy khác, như trang chính thức hay khoá công khai của nhà phát hành. Câu hai, hai bên thuộc cùng một công ty, giữ được khoá chung, và không cần chứng minh với người ngoài. Nên chọn mã xác thực thông điệp với khoá chung, nhanh và đủ chống sửa, còn chữ ký số chỉ cần khi phải chứng minh ai ký với người ngoài."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mã kiểm tổng: lỗi ngẫu nhiên</span><span class="a">→</span>
          <span class="n">băm: cần kênh tin cậy cho mã băm</span><span class="a">→</span>
          <span class="n">mã xác thực: khoá chung, chống sửa</span><span class="a">→</span>
          <span class="n">chữ ký: chống sửa và chứng minh ai ký</span></div>
        say: "Tổng kết lại, mã kiểm tổng chỉ chống lỗi ngẫu nhiên, hàm băm cần kênh tin cậy cho mã băm. Mã xác thực thông điệp dùng khoá chung để chống sửa, còn chữ ký số chống sửa đồng thời chứng minh ai ký."
      - show: |
          <div class="box key"><b>Tư duy:</b> một dấu kiểm chỉ chống được kẻ <b>không thể tạo ra nó</b>. Hãy hỏi: kẻ xấu có tự tính được dấu kiểm này không?</div>
        say: "Điều cần mang theo, một dấu kiểm chỉ chống được kẻ không thể tạo ra nó. Hãy hỏi kẻ xấu có tự tính được dấu kiểm này không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>chứng chỉ</b>, chuỗi tin cậy và giao thức bảo mật của web trong thực tế.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học chứng chỉ, chuỗi tin cậy, và giao thức bảo mật của web trong thực tế. Hẹn gặp bạn ở bài tiếp theo."
