- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">biết, có, là</span><span class="a">→</span>

      <span class="n">mã một lần: bí mật chung + khoảng thời gian</span><span class="a">→</span>

      <span class="n">khoá sau vài lần sai</span><span class="a">→</span>

      <span class="n">khoá gắn tên miền chống trang giả; khôi phục mạnh ngang đăng nhập</span></div>

      '
    say: Tổng kết lại, ba loại yếu tố là thứ bạn biết, thứ bạn có, thứ bạn là. Mã một lần tính từ bí mật chung và khoảng thời gian, cần khoá sau vài lần sai. Khoá gắn tên miền chống được trang giả, và quy trình khôi phục phải mạnh ngang đăng nhập. Xác thực hai yếu tố giúp chặn phần lớn các cuộc tấn công tự động dùng mật khẩu bị lộ từ trước. Khoá phần cứng gắn tên miền kết hợp bộ mã khôi phục ngoại tuyến an toàn là lá chắn tin cậy cho mọi tài khoản quan trọng.
  - show: '<div class="box key"><b>Tư duy:</b> hai yếu tố chỉ có giá trị khi kẻ xấu <b>không lấy được cả hai bằng cùng một cách</b>.</div>

      '
