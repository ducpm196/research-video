  - 10 * 5 == 50 and 1 - (1 - 5 / 10 ** 6) ** 10 <= 50 / 10 ** 6
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Máy chủ cho thử 5 lần mỗi khoảng, kẻ xấu thử trong 10 khoảng liên tiếp: xác suất trúng tối đa khoảng bao nhiêu?</td></tr>

      <tr><td>2</td><td>Mật khẩu và mã một lần cùng được lưu trong một ứng dụng trên cùng máy tính bị nhiễm mã độc. Còn là hai yếu tố độc lập không?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, máy chủ cho thử 5 lần mỗi khoảng, kẻ xấu thử trong 10 khoảng liên tiếp, xác suất trúng tối đa khoảng bao nhiêu? Câu hai, mật khẩu và mã một lần cùng được lưu trong một ứng dụng trên cùng một máy tính bị nhiễm mã độc. Hai yếu tố đó còn độc lập không? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Mỗi khoảng: 5 mã khác nhau → trúng với xác suất $\frac{5}{10^6}$. Mười khoảng: cộng lại nhiều nhất $10 \cdot \frac{5}{10^6} = \frac{50}{10^6}$.</p>

      <p>$\frac{50}{10^6} = \hl{5 \cdot 10^{-5}}$, tức 5 phần trăm nghìn: nhỏ, nhưng vẫn nên khoá sau vài khoảng sai liên tiếp.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một, trong mỗi khoảng kẻ xấu thử 5 mã khác nhau, nên trúng với xác suất 5 phần triệu. Mười khoảng cộng lại được nhiều nhất 10 nhân 5 phần triệu, bằng 50 phần triệu. Đó là 5 phần trăm nghìn, nhỏ nhưng vẫn nên khoá sau vài khoảng sai liên tiếp. Thực hiện trọn vẹn quy trình trích bốn byte động và chia lấy dư sáu chữ số từ chuỗi băm khớp chuẩn kiểm thử.
  - show: '<table class="t"><tr><th>câu hỏi</th><th>trả lời</th></tr>

      <tr><td>kẻ xấu cần mấy việc khác nhau để có cả hai yếu tố?</td><td>1: chiếm cái máy đó</td></tr>

      <tr><td>còn độc lập không?</td><td>$\hl{\text{không}}$ → “thứ bạn có” nên nằm trên thiết bị riêng</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Câu hai, hỏi kẻ xấu cần mấy việc khác nhau để có cả hai yếu tố. Chỉ một việc, là chiếm cái máy đó. Vì vậy hai yếu tố không còn độc lập, và yếu tố thứ bạn có nên nằm trên một thiết bị riêng. Đánh giá lý do vì sao mã sáu chữ số vẫn có thể bị đánh cắp qua trang lừa đảo trung gian trong khi khoá gắn tên miền thì không.
