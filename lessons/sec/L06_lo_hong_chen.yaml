- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">dữ liệu bị hiểu thành mã</span><span class="a">→</span>

      <span class="n">truy vấn, lệnh: tham số hoá</span><span class="a">→</span>

      <span class="n">trang web: mã hoá đầu ra đúng ngữ cảnh</span><span class="a">→</span>

      <span class="n">không lọc danh sách, không tin dữ liệu đã lưu</span></div>

      '
    say: Tổng kết lại, lỗ hổng chèn là khi dữ liệu bị hiểu thành mã. Với truy vấn và lệnh, dùng tham số hoá. Với trang web, mã hoá đầu ra đúng ngữ cảnh. Đừng lọc theo danh sách, và đừng tin dữ liệu đã lưu. Tách rạch ròi khung mã thực thi khỏi dữ liệu người dùng là quy tắc vàng giải quyết vĩnh viễn mọi lỗ hổng chèn. Tham số hoá truy vấn và tách biệt hoàn toàn dữ liệu với mã lệnh là phương pháp triệt tận gốc họ lỗ hổng chèn mã.
  - show: '<div class="box key"><b>Tư duy:</b> đừng hỏi “chuỗi này có nguy hiểm không” — hãy dùng cách mà <b>chuỗi nào cũng chỉ là dữ liệu</b>.</div>

      '
    say: Điều cần mang theo, đừng hỏi chuỗi này có nguy hiểm không, hãy dùng cách mà chuỗi nào cũng chỉ là dữ liệu. Luôn kết hợp truy vấn tham số hoá, danh sách cho phép cho tên trường động và mã hoá theo ngữ cảnh hiển thị.
  - clear: true
    show: '<p class="note">Bài sau (bài 7): <b>mã hoá đối xứng dùng đúng</b> — chế độ và số dùng một lần.</p>

      '
