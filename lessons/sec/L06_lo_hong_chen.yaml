scenes:
- id: hook
  kind: hook
  title: Ô tìm kiếm trả về mọi tài khoản
  checks:
  - alg.sql_concat_vs_param("x' OR '1'='1")[1:] == (2, 0)
  steps:
  - show: '<p>Ô tìm người dùng ghép thẳng chữ người gõ vào câu truy vấn. Ai đó gõ một chuỗi có dấu nháy và một điều kiện luôn đúng — và kết quả trả về <b>mọi</b> tài khoản, thay vì không ai.</p>

      <div class="box key">Hôm nay: <b>lỗ hổng chèn</b> — khi <b>dữ liệu</b> của người dùng bị hiểu thành <b>mã</b>, và cách tách hai thứ đó ra.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, ô tìm người dùng ghép thẳng chữ người gõ vào câu truy vấn. Ai đó gõ một chuỗi có dấu nháy và một điều kiện luôn đúng, và kết quả trả về mọi tài khoản thay vì không ai. Hôm nay ta học lỗ hổng chèn, khi dữ liệu của người dùng bị hiểu thành mã, và cách tách hai thứ đó ra. Chỉ gõ vài ký tự nháy đơn và chữ hoặc vào ô tìm kiếm bỗng biến thành lệnh xoá sạch toàn bộ bảng dữ liệu khách hàng. Tách biệt hoàn toàn phần khung câu lệnh biên dịch sẵn với phần dữ liệu tham số người dùng triệt tiêu tận gốc mọi lỗ hổng chèn mã.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chuỗi, dấu nháy, truy vấn lọc, thẻ trang web'
  checks:
  - '''xin'' + ''chao'' == ''xinchao'' and alg.sql_concat_vs_param(''alice'')[2] == 1'
  steps:
  - show: '<table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ</th></tr>

      <tr><td>chuỗi nằm giữa hai dấu nháy</td><td><code>''alice''</code>: dấu nháy đánh dấu chỗ chuỗi bắt đầu và kết thúc</td></tr>

      <tr><td>ghép chuỗi bằng dấu cộng</td><td><code>''xin'' + ''chao''</code> → <code>''xinchao''</code></td></tr>

      <tr><td>cơ sở dữ liệu lưu dữ liệu thành <b>bảng</b>, mỗi dòng một người; <b>truy vấn lọc</b> là câu lệnh hỏi bảng: <code>SELECT name FROM users WHERE name = ''alice''</code> nghĩa là “lấy tên của những dòng có tên đúng bằng alice”</td><td>bảng có 2 người <code>alice</code>, <code>bob</code>; lấy người tên là <code>alice</code> → $\hl{1}$ dòng</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Trước hết, ta cần hiểu ba điều bài này sẽ dùng. Trong mã, chuỗi nằm giữa hai dấu nháy, dấu nháy đánh dấu chỗ chuỗi bắt đầu và kết thúc. Dấu cộng ghép hai chuỗi, xin cộng chào thành xin chào viết liền. Cơ sở dữ liệu lưu dữ liệu thành bảng, mỗi dòng một người, và truy vấn lọc là một câu lệnh hỏi bảng, như lấy những dòng có tên đúng bằng một cái tên cho trước. Bảng có 2 người, lọc theo đúng một cái tên thì được 1 dòng. Lỗ hổng chèn xuất hiện bất cứ khi nào chuỗi văn bản người dùng nhập được ghép thẳng vào mã lệnh chạy ở tầng xử lý.
  - show: '<p>Trang web: trình duyệt đọc <code>&lt;b&gt;An&lt;/b&gt;</code> là một <b>thẻ</b> in đậm và hiện ra chữ <b>An</b>. Dấu nhỏ hơn và lớn hơn là ký tự đặc biệt mở, đóng thẻ.</p>

      '
    say: Điều thứ tư là trang web, trình duyệt đọc một chữ An nằm trong thẻ in đậm là lệnh in đậm, và hiện ra chữ An đậm. Dấu nhỏ hơn và dấu lớn hơn là ký tự đặc biệt dùng để mở và đóng thẻ. Trong trình duyệt, lỗ hổng chèn mã kịch bản xảy ra khi in thẳng chuỗi chưa mã hoá ký tự điều khiển vào cây giao diện.
- id: sym
  kind: symbol
  title: 'Giải mã: một mẫu, nhiều nơi'
  steps:
  - show: '<p><b>Mẫu chung</b>: chương trình ghép chuỗi người dùng vào một ngôn ngữ khác (truy vấn, lệnh hệ thống, trang web), rồi đưa cho bộ thông dịch của ngôn ngữ đó. Ký tự đặc biệt trong dữ liệu làm đổi <b>cấu trúc</b> câu lệnh.</p>

      <table class="t"><tr><th>nơi chèn</th><th>cách phòng thủ đúng</th></tr>

      <tr><td>truy vấn cơ sở dữ liệu</td><td>câu lệnh <b>tham số hoá</b>: dữ liệu gửi riêng, không bao giờ thành mã</td></tr>

      <tr><td>lệnh hệ thống</td><td>gọi chương trình với danh sách đối số, không qua trình thông dịch lệnh</td></tr>

      <tr><td>trang web (mã kịch bản)</td><td><b>mã hoá đầu ra</b> theo ngữ cảnh: ký tự đặc biệt thành <b>thực thể</b> (cách viết thay chỉ để hiển thị, ví dụ <code>&amp;lt;</code> là dấu nhỏ hơn), hiển thị như chữ</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.4'
    - '2.4'
    say: Mẫu chung là chương trình ghép chuỗi của người dùng vào một ngôn ngữ khác như truy vấn, lệnh hệ thống hay trang web, rồi đưa cho bộ thông dịch của ngôn ngữ đó. Ký tự đặc biệt trong dữ liệu làm đổi cấu trúc của câu lệnh. Bảng cho cách phòng thủ đúng ở mỗi nơi. Với truy vấn, dùng câu lệnh tham số hoá, dữ liệu được gửi riêng và không bao giờ thành mã. Với lệnh hệ thống, gọi chương trình với một danh sách đối số, không qua trình thông dịch lệnh. Với trang web, mã hoá đầu ra theo ngữ cảnh, biến ký tự đặc biệt thành thực thể để hiển thị như chữ. Thực thể là một cách viết thay chỉ dùng để hiển thị, ví dụ dấu nhỏ hơn được viết bằng bốn ký tự riêng. Truy vấn tham số hoá gửi khung câu lệnh tách rời khỏi biến giá trị để bộ máy luôn hiểu đó chỉ là chuỗi văn bản tĩnh.
