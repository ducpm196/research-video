# Quy ước: Heartbleed chỉ dạy ở mức khái niệm phòng thủ — điều kiện kiểm đúng (độ dài khai báo ≤ độ dài thật nhận), vá, thay khoá;
#   KHÔNG có cách dựng yêu cầu khai thác. Không nêu tên người tìm ra lỗi hay người viết mã. Mọi sự kiện và con số có nguồn ghi trong
#   audit/sec/sources_L15.md; con số khác là phép tính lại (checks) hoặc ghi “số minh hoạ”. Tỉ lệ trang tải qua HTTPS lấy theo [A19]
#   (bài báo trích đo đạc của một trình duyệt lớn). Lời đọc không nói TLS, CA, ACME, ARI, Chrome, Firefox, Alexa: nói “giao thức bảo mật
#   của web”, “tổ chức cấp chứng chỉ”, “giao thức cấp chứng chỉ tự động”, “thông tin gia hạn do tổ chức cấp gợi ý”, “một trình duyệt lớn”,
#   “một triệu trang phổ biến nhất”. Probe p2 (audit/sec/probes/p2_hanh_trinh.md): Heartbleed ≤ 1/8, OpenSSL ≤ 6/8, Let's Encrypt ≤ 2/8,
#   HTTPS tốt nhất 7/8 nhưng đối chứng 5/8 → KHÔNG đọc bốn tên này; chỉ hiện trên màn hình. Lời đọc nói “một thư viện mã hoá rất phổ
#   biến”, “một tổ chức cấp chứng chỉ mới”, “HTTP có mã hoá” (HTTP: probe NET p1 8/8).
objectives:
  - "Kể lại hành trình đưa HTTPS thành mặc định qua bốn chặng 2014, 2015, 2019, 2025–2028, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt: cỡ vùng nhớ lộ ra, số ngày lỗi tồn tại, tỉ lệ thay khoá thật sự, nhịp gia hạn theo vòng đời chứng chỉ"
  - "Chọn cách quản lý chứng chỉ phù hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Điểm nghẽn nằm ở một thông điệp nhịp tim có trường độ dài 2 byte, mà bản cài đặt thiếu kiểm biên.", reason: "ASR chép “điểm ngãn nằm ở một thông điệp nhịp tim có trường độ dài hai vai mà bản cài đặt thiếu kiễn biên.” (0.864): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: nghẽn/ngãn, kiểm/kiễn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, trường độ dài 2 byte là 2 nhân 8, bằng 16 bit, nên có 2 mũ 16 giá trị, tức 65 nghìn 536 byte, chia 1024 được 64 KB.", reason: "ASR chép “Bước 1, trường độ dài 2 bai là 2 x 8, bằng 16 bit, nền có 2 mũ 16 giá trị, tức 65536 bai, chi 1.024 được 64 kilobai.” (0.872): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; lệch âm/thanh thuần Việt: nhân/x, nên/nền, chia (trong “byte chia” → “bai chi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở bài 11, đọc quá biên một vùng nhớ làm lộ ô bên cạnh, mảng 16 byte mà đọc 20 byte là lộ 4 byte kề bên.", reason: "ASR chép “Ở bài 11, Đọc Quá Biên một vùng nhớ làm lộ ô bên cạnh, mảng 16 bài mà đọc 20 bài là lộ 4 bài kề bên.” (0.9): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mỗi byte có 256 giá trị, nên hai byte có 256 nhân 256, bằng 65 nghìn 536.", reason: "ASR chép “Mỗi bài có 256 giá trị, nên hai bài có 256 nhân 256 vàng 65.536.” (0.914): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bằng/vàng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bốn năm sau, 72 tới 95 phần trăm lượt tải trang đã dùng HTTP có mã hoá.", reason: "ASR chép “Bốn năm sau, 72 tới 95% lượt tại trang đã dùng Http có mã hóa.” (0.952): lệch âm/thanh thuần Việt: tải/tại — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì vậy máy chủ có thể trả về phần bộ nhớ nằm sau dữ liệu thật, tối đa khoảng 64 KB.", reason: "ASR chép “Vì vậy máy chủ có thể trả về phần bộ nhớ nằm sau dữ liệu thật, tối đa khoảng 64 kilobytes.” (0.957): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Năm 2014, một chỗ thiếu kiểm biên làm lộ tới 64 KB bộ nhớ, việc vá thì nhanh nhưng thay khoá thì chậm.", reason: "ASR chép “Năm 2014, một chỗ thiếu kiểm biên làm lộ tới 64 kilobyte bộ nhớ, việc vá thì nhanh nhưng thay khóa thì chậm.” (0.967): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Điều cần mang theo, an toàn ở quy mô cả web không đến từ việc dặn mọi người cẩn thận hơn, mà từ việc làm cho cách an toàn trở thành cách dễ nhất và tự động.", reason: "ASR chép “Điều cần mang theo, an toàn ở quy mô cả oét không đến từ việc dặn mọi người cẩn thận hơn mà từ việc làm cho cách an toàn trở thành cách dễ nhất và tự động.” (0.973): web đọc thô (probe NET p2: 8/8), lần này ASR viết sai — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Năm 2015, 55 tới 70% lượt tải trang còn chưa mã hoá"
    checks:
      - "2019 - 2015 == 4"
      - "90 // 2 == 45"
    steps:
      - show: |
          <p>Năm 2015, <b>55–70%</b> lượt tải trang trên một trình duyệt lớn vẫn dùng HTTP <b>không mã hoá</b>. Bốn năm sau, <b>72–95%</b> lượt tải trang đã qua HTTPS (bài báo năm 2019).</p>
          <p>Giữa hai mốc đó: một lỗ hổng làm lộ bộ nhớ của rất nhiều máy chủ (2014), và một tổ chức cấp chứng chỉ <b>miễn phí, tự động</b> (cuối 2015). Tới năm 2028, vòng đời chứng chỉ của tổ chức ấy giảm một nửa, từ 90 còn <b>45 ngày</b>.</p>
          <div class="box key">Hôm nay: đi lại hành trình ấy qua bốn chặng — ở mỗi quy mô, điểm nghẽn là gì và chuyên gia đã xử lý ra sao.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, năm 2015, theo đo đạc của một trình duyệt lớn, 55 tới 70 phần trăm lượt tải trang vẫn dùng HTTP không mã hoá. Bốn năm sau, 72 tới 95 phần trăm lượt tải trang đã dùng HTTP có mã hoá. Giữa hai mốc đó là một lỗ hổng làm lộ bộ nhớ của rất nhiều máy chủ năm 2014, và một tổ chức cấp chứng chỉ miễn phí, tự động ra đời cuối năm 2015. Tới năm 2028, vòng đời chứng chỉ của tổ chức ấy giảm một nửa, từ 90 còn 45 ngày. Hôm nay ta đi lại hành trình ấy qua bốn chặng, xem ở mỗi quy mô điểm nghẽn là gì, và chuyên gia đã xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "16 + 4 == 20 and 20 > 16"
      - "2 ** 16 == 65536"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 9</td><td><b>chứng chỉ</b> gắn khoá công khai với tên miền, có chữ ký của tổ chức cấp; lộ khoá bí mật thì kẻ khác giả được máy chủ</td><td>sửa tên miền sau khi ký → chữ ký sai</td></tr>
          <tr><td>bài 11</td><td>đọc hay ghi <b>quá biên</b> một vùng nhớ làm lộ hoặc hỏng ô bên cạnh</td><td>mảng 16 byte, đọc 20 byte → lộ 4 byte kề bên</td></tr>
          <tr><td>bài 14</td><td>ứng phó: chuẩn bị, phát hiện, khoanh vùng, loại bỏ, phục hồi, rút kinh nghiệm</td><td>vá xong vẫn phải thay thứ có thể đã lộ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 9, chứng chỉ gắn khoá công khai với tên miền, có chữ ký của tổ chức cấp, nên lộ khoá bí mật thì kẻ khác giả được máy chủ. Ở bài 11, đọc quá biên một vùng nhớ làm lộ ô bên cạnh, mảng 16 byte mà đọc 20 byte là lộ 4 byte kề bên. Ở bài 14, ứng phó sự cố gồm chuẩn bị, phát hiện, khoanh vùng, loại bỏ, phục hồi và rút kinh nghiệm, vá xong vẫn phải thay thứ có thể đã lộ."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>vòng đời chứng chỉ</b></td><td>số ngày chứng chỉ còn hiệu lực kể từ khi cấp</td></tr>
          <tr><td><b>thu hồi</b></td><td>báo rằng một chứng chỉ chưa hết hạn không còn đáng tin, ví dụ vì lộ khoá</td></tr>
          <tr><td><b>gia hạn tự động</b></td><td>một chương trình trên máy chủ tự xin chứng chỉ mới trước khi chứng chỉ cũ hết hạn</td></tr>
          <tr><td><b>kiểm biên</b></td><td>so độ dài dữ liệu được khai báo với độ dài thật nhận được trước khi dùng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Vòng đời chứng chỉ là số ngày chứng chỉ còn hiệu lực kể từ khi cấp. Thu hồi là báo rằng một chứng chỉ chưa hết hạn không còn đáng tin, ví dụ vì lộ khoá. Gia hạn tự động là một chương trình trên máy chủ tự xin chứng chỉ mới trước khi chứng chỉ cũ hết hạn. Kiểm biên là so độ dài dữ liệu được khai báo với độ dài thật nhận được, trước khi dùng nó."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="210" cy="150" r="15" fill="#dc2626"/><text x="210" y="108" font-weight="bold">4/2014</text><text x="210" y="200">lỗ hổng làm lộ bộ nhớ</text><text x="210" y="232">vá, thay khoá chậm</text>
          <circle cx="630" cy="150" r="15" fill="#2a78d6"/><text x="630" y="108" font-weight="bold">12/2015</text><text x="630" y="200">chứng chỉ miễn phí, tự động</text><text x="630" y="232">vòng đời 90 ngày</text>
          <circle cx="1050" cy="150" r="15" fill="#7c3aed"/><text x="1050" y="108" font-weight="bold">2019</text><text x="1050" y="200">538 triệu chứng chỉ</text><text x="1050" y="232">72–95% lượt tải qua HTTPS</text>
          <circle cx="1470" cy="150" r="15" fill="#059669"/><text x="1470" y="108" font-weight="bold">2025 → 2028</text><text x="1470" y="200">90 → 64 → 45 ngày</text><text x="1470" y="232">gia hạn theo gợi ý</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khủng hoảng → khai sinh → quy mô cả web → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với bốn chặng. Tháng 4 năm 2014, một lỗ hổng làm lộ bộ nhớ của rất nhiều máy chủ, và việc thay khoá diễn ra chậm. Tháng 12 năm 2015, chứng chỉ miễn phí, tự động ra đời với vòng đời 90 ngày, và tới năm 2019 đã cấp 538 triệu chứng chỉ. Từ 2025 tới 2028, vòng đời giảm dần từ 90 xuống 64 rồi 45 ngày."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2014 — khủng hoảng: Heartbleed"
    stage: {year: "2014", scale: "ước tính 24–55% máy chủ HTTPS trong một triệu trang phổ biến nhất bị ảnh hưởng lúc đầu", source: "[O14] [D14] §1, §2.2, §2.3", practice: "kiểm biên: độ dài khai báo phải không lớn hơn độ dài thật nhận; vá ngay; sau khi vá phải thay chứng chỉ VÀ khoá bí mật"}
    checks:
      - "2 * 8 == 16 and 2 ** 16 == 65536 and 65536 // 1024 == 64"
      - "(__import__('datetime').date(2014, 4, 7) - __import__('datetime').date(2012, 3, 14)).days == 754"
      - "1000 * 10 // 100 == 100 and 100 * 14 // 100 == 14 and 100 - 14 == 86 and 86 / 1000 == 0.086"
    steps:
      - show: |
          <p><b>Quy mô:</b> ngày 7/4/2014, dự án OpenSSL công bố lỗi; nhóm đo đạc năm 2014 ước tính <b>24–55%</b> máy chủ HTTPS trong một triệu trang phổ biến nhất bị ảnh hưởng lúc đầu.</p>
          <p><b>Điểm nghẽn:</b> một thông điệp “nhịp tim” có trường độ dài <b>2 byte</b>; bản cài đặt <b>thiếu kiểm biên</b>, nên có thể trả về phần bộ nhớ nằm sau dữ liệu thật — tối đa khoảng 64 KB.</p>
          <p><b>Cách xử lý:</b> bản vá thêm kiểm biên, <b>bỏ</b> thông điệp nếu độ dài khai báo lớn hơn dữ liệu thật nhận được.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng một, ngày 7 tháng 4 năm 2014, nhóm phát triển một thư viện mã hoá rất phổ biến công bố một lỗ hổng, có tên ghi trên màn hình. Nhóm đo đạc năm 2014 ước tính 24 tới 55 phần trăm máy chủ HTTP có mã hoá trong một triệu trang phổ biến nhất bị ảnh hưởng lúc đầu. Điểm nghẽn nằm ở một thông điệp nhịp tim có trường độ dài 2 byte, mà bản cài đặt thiếu kiểm biên. Vì vậy máy chủ có thể trả về phần bộ nhớ nằm sau dữ liệu thật, tối đa khoảng 64 KB. Bản vá thêm kiểm biên, bỏ thông điệp nếu độ dài khai báo lớn hơn dữ liệu thật nhận được."
      - clear: true
        show: |
          <p><b>Tính lại hai con số</b> của chặng này:</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. trường độ dài 2 byte</td><td>$2 \times 8 = 16$ bit → $2^{16}$ giá trị</td><td>65 536 byte = $65\,536 / 1024 = \hl{64}$ KB</td></tr>
          <tr><td>2. lỗi nằm trong bản phát hành từ 14/3/2012 tới ngày công bố 7/4/2014</td><td>đếm ngày bằng lịch</td><td>$\hl{754}$ ngày</td></tr></table>
          <p class="note">Bài học phòng thủ: mọi trường độ dài đến từ bên ngoài phải được <b>so với dữ liệu thật</b> trước khi dùng — như phép kiểm biên ở bài 11.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Tính lại hai con số của chặng này. Bước một, trường độ dài 2 byte là 2 nhân 8, bằng 16 bit, nên có 2 mũ 16 giá trị, tức 65 nghìn 536 byte, chia 1024 được 64 KB. Bước hai, lỗi nằm trong bản phát hành từ ngày 14 tháng 3 năm 2012 tới ngày công bố 7 tháng 4 năm 2014, đếm bằng lịch được 754 ngày. Bài học phòng thủ là mọi trường độ dài đến từ bên ngoài phải được so với dữ liệu thật trước khi dùng, như phép kiểm biên ở bài 11."
      - clear: true
        show: |
          <p><b>Điểm nghẽn thứ hai — thay chứng chỉ:</b> khoá bí mật có thể đã lộ, nên vá thôi chưa đủ. Nhóm đo đạc ghi: chỉ <b>10%</b> trang còn lỗi sau 48 giờ đã thay chứng chỉ trong tháng tiếp theo, và <b>14%</b> trong số đó vẫn giữ khoá bí mật cũ.</p>
          <table class="t"><tr><th>bước (1000 trang là số minh hoạ)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>3. đã thay chứng chỉ</td><td>10% của 1000</td><td>100 trang</td></tr>
          <tr><td>4. thay nhưng giữ khoá cũ: không được bảo vệ thêm</td><td>14% của 100</td><td>14 trang</td></tr>
          <tr><td>5. thật sự đổi khoá</td><td>$100 - 14 = 86$ trên 1000</td><td>$\hl{8{,}6\%}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Điểm nghẽn thứ hai là thay chứng chỉ, vì khoá bí mật có thể đã lộ nên vá thôi chưa đủ. Nhóm đo đạc ghi rằng chỉ 10 phần trăm trang còn lỗi sau 48 giờ đã thay chứng chỉ trong tháng tiếp theo, và 14 phần trăm trong số đó vẫn giữ khoá bí mật cũ. Lấy 1000 trang làm số minh hoạ, bước ba, 10 phần trăm là 100 trang đã thay chứng chỉ. Bước bốn, 14 phần trăm của 100 là 14 trang giữ khoá cũ, nên không được bảo vệ thêm. Bước năm, chỉ 86 trên 1000, tức 8 phẩy 6 phần trăm, thật sự đổi khoá."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2015 — khai sinh: chứng chỉ miễn phí, tự động, 90 ngày"
    stage: {year: "2015", scale: "55–70% lượt tải trang chưa mã hoá; chứng chỉ 1 năm giá trung bình 178 USD; khoảng 20% chứng chỉ từng bị quên gia hạn", source: "[A19] §1, §2, §2.1; [L15]", practice: "tự động hoá trọn quy trình xin, xác minh, cấp, gia hạn; vòng đời ngắn 90 ngày; gia hạn ở ngày 60"}
    checks:
      - "100 * 178 == 17800"
      - "90 - 60 == 30 and round(60 / 90, 4) == round(2 / 3, 4) and 365 // 60 == 6"
    steps:
      - show: |
          <p><b>Điểm nghẽn</b> (bài báo năm 2019 nhìn lại): để có chứng chỉ, người vận hành phải dùng phần mềm tạo khoá khó hiểu, làm tay các bước chứng minh quyền với tên miền, rồi <b>trả tiền</b>. Năm 2015, chứng chỉ 1 năm cho một tên miền giá trung bình <b>178 USD</b>; trước đó khoảng <b>20%</b> chứng chỉ từng bị quên gia hạn.</p>
          <p><b>Cách xử lý:</b> tháng 12/2015, Let's Encrypt ra đời: <b>miễn phí</b> và <b>tự động hoàn toàn</b> — không có đường làm tay, không có ngoại lệ. Vòng đời chứng chỉ chỉ <b>90 ngày</b>.</p>
        focus: [1, 1, 1, 1, 2, 2]
        say: "Ở chặng hai, bài báo năm 2019 nhìn lại cách xin chứng chỉ trước đó. Người vận hành phải dùng phần mềm tạo khoá khó hiểu, làm tay các bước chứng minh quyền với tên miền, rồi trả tiền. Năm 2015, chứng chỉ 1 năm cho một tên miền có giá trung bình 178 đô la. Trước đó, khoảng 20 phần trăm chứng chỉ từng bị quên gia hạn. Tháng 12 năm 2015, một tổ chức cấp chứng chỉ mới ra đời, miễn phí và tự động hoàn toàn, không có đường làm tay, không có ngoại lệ. Vòng đời chứng chỉ chỉ 90 ngày."
      - clear: true
        show: |
          <p>Vì sao 90 ngày? Thông báo năm 2015 nêu hai lý do: <b>giới hạn thiệt hại</b> khi lộ khoá hay cấp nhầm, và <b>ép tự động hoá</b>. Họ khuyên gia hạn <b>mỗi 60 ngày</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. chi phí cũ cho 100 tên miền (số minh hoạ)</td><td>$100 \times 178$</td><td>17 800 USD mỗi năm</td></tr>
          <tr><td>2. gia hạn ở ngày 60 của chứng chỉ 90 ngày</td><td>$90 - 60$</td><td>còn $\hlg{30}$ ngày dự phòng nếu lần gia hạn hỏng</td></tr>
          <tr><td>3. ngày 60 nằm ở đâu trong vòng đời</td><td>$\frac{60}{90}$</td><td>đúng $\frac{2}{3}$ vòng đời</td></tr>
          <tr><td>4. số lần gia hạn mỗi năm</td><td>365 chia 60</td><td>khoảng 6 lần — không ai muốn làm tay</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Vì sao lại là 90 ngày? Thông báo năm 2015 nêu hai lý do, giới hạn thiệt hại khi lộ khoá hay cấp nhầm, và ép mọi người tự động hoá. Họ khuyên gia hạn mỗi 60 ngày. Bước một, nếu theo giá cũ, 100 tên miền tốn 17 nghìn 800 đô la mỗi năm. Bước hai, gia hạn ở ngày 60 của chứng chỉ 90 ngày còn 30 ngày dự phòng nếu lần gia hạn hỏng. Bước ba, 60 chia 90 đúng bằng hai phần ba vòng đời. Bước bốn, 365 chia 60 là khoảng 6 lần mỗi năm, không ai muốn làm tay."

  # ───────────────────────── 7. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2019 — quy mô cả web: 538 triệu chứng chỉ"
    stage: {year: "2019", scale: "538 triệu chứng chỉ cho 223 triệu tên miền (1/2019); hơn 1 triệu chứng chỉ mỗi ngày lúc cao điểm", source: "[A19] tóm tắt, §1, §5.2, §7.5, §8.1", practice: "một đường cấp duy nhất, không can thiệp tay; tự động gia hạn trước hạn; tự động là điều kiện để miễn phí và miễn phí làm tự động thành thiết thực"}
    checks:
      - "round(538 / 223, 2) == 2.41"
      - "24 * 60 * 60 == 86400 and round(1000000 / 86400, 1) == 11.6"
      - "64 + 19 + 16 == 99 and round(100 - 2.9, 1) == 97.1"
    steps:
      - show: |
          <table class="t"><tr><th>quy mô (bài báo năm 2019)</th><th>con số</th></tr>
          <tr><td>chứng chỉ đã cấp tới tháng 1/2019</td><td>hơn <b>538 triệu</b>, cho <b>223 triệu</b> tên miền</td></tr>
          <tr><td>lúc cao điểm</td><td>hơn <b>1 triệu</b> chứng chỉ mỗi ngày</td></tr>
          <tr><td>lượt tải trang qua HTTPS (đo của một trình duyệt lớn)</td><td>khoảng gấp đôi, lên <b>72–95%</b></td></tr></table>
          <p><b>Thực hành:</b> hệ thống có <b>một đường cấp duy nhất</b>, không có lối cho người vận hành cấp tay hay làm ngoại lệ. Nhóm viết: tự động là điều kiện để miễn phí, và miễn phí làm tự động trở nên thiết thực.</p>
        focus: ["1.2", "1.3", "1.4", 2, 2]
        say: "Ở chặng ba, bài báo năm 2019 ghi rằng tới tháng 1 năm 2019 đã có hơn 538 triệu chứng chỉ được cấp cho 223 triệu tên miền. Lúc cao điểm, hệ thống cấp hơn 1 triệu chứng chỉ mỗi ngày. Theo đo đạc của một trình duyệt lớn, tỉ lệ lượt tải trang qua HTTP có mã hoá khoảng gấp đôi, lên 72 tới 95 phần trăm. Hệ thống chỉ có một đường cấp duy nhất, không có lối cho người vận hành cấp tay hay làm ngoại lệ. Nhóm viết rằng tự động là điều kiện để miễn phí, và miễn phí làm tự động trở nên thiết thực."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. chứng chỉ trên mỗi tên miền</td><td>$538 / 223$</td><td>$\approx 2{,}41$ — một tên miền đã được cấp lại vài lần</td></tr>
          <tr><td>2. tốc độ lúc cao điểm</td><td>1 000 000 chia $24 \times 60 \times 60 = 86\,400$ giây</td><td>$\approx \hlg{11{,}6}$ chứng chỉ mỗi giây</td></tr>
          <tr><td>3. gia hạn: cuối (30 ngày chót) / giữa / đầu vòng đời</td><td>$64\% + 16\% + 19\%$</td><td>99%, phần còn lại do làm tròn</td></tr>
          <tr><td>4. gia hạn sau khi chứng chỉ cũ đã hết hạn</td><td>chỉ 2,9%</td><td>$100 - 2{,}9 = \hlg{97{,}1\%}$ gia hạn kịp</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Tính lại bốn con số. Bước một, 538 chia 223 được khoảng 2 phẩy 41 chứng chỉ trên mỗi tên miền, nghĩa là một tên miền đã được cấp lại vài lần. Bước hai, 1 triệu chứng chỉ một ngày chia cho 86 nghìn 400 giây, khoảng 11 phẩy 6 chứng chỉ mỗi giây. Bước ba, 64 phần trăm lần gia hạn rơi vào 30 ngày chót, 16 và 19 phần trăm rơi vào giữa và đầu vòng đời, cộng lại 99. Bước bốn, chỉ 2 phẩy 9 phần trăm lần gia hạn xảy ra sau khi chứng chỉ cũ đã hết hạn, nên 97 phẩy 1 phần trăm gia hạn kịp."

  # ───────────────────────── 8. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2025 tới 2028 — ổn định và tiếp tục phát triển: 90 → 45 ngày"
    stage: {year: "2025 → 2028", scale: "cả ngành theo quy định chung của các tổ chức cấp và trình duyệt; vòng đời 90 → 64 (2/2027) → 45 ngày (2/2028)", source: "[L25]", practice: "giảm dần theo từng đợt có báo trước; cho người dùng chọn thời điểm; gia hạn ở khoảng 2/3 vòng đời hoặc theo gợi ý của tổ chức cấp; giám sát cảnh báo khi không gia hạn; không làm tay"}
    checks:
      - "90 // 2 == 45 and round(64 * 2 / 3, 1) == 42.7 and 45 * 2 // 3 == 30"
      - "60 > 45 and 60 - 45 == 15"
      - "365 // 60 == 6 and 365 // 30 == 12 and 12 // 6 == 2"
      - "30 * 24 == 720 and 720 // 7 > 100"
    steps:
      - show: |
          <table class="t"><tr><th>thông báo 2/12/2025</th><th>thay đổi</th></tr>
          <tr><td>lý do</td><td>cả ngành phải theo quy định chung; vòng đời ngắn <b>giới hạn phạm vi khi bị lộ</b>, làm việc thu hồi hiệu quả hơn</td></tr>
          <tr><td>13/5/2026</td><td>chứng chỉ 45 ngày cho ai <b>tự chọn</b> thử trước</td></tr>
          <tr><td>10/2/2027</td><td>mặc định còn <b>64 ngày</b>; giữ kết quả xác minh tên miền 10 ngày (trước là 30)</td></tr>
          <tr><td>16/2/2028</td><td>mặc định còn <b>45 ngày</b>; giữ kết quả xác minh <b>7 giờ</b></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Chặng bốn là ổn định và tiếp tục phát triển. Thông báo ngày 2 tháng 12 năm 2025 cho biết cả ngành phải theo một quy định chung, vì vòng đời ngắn giới hạn phạm vi khi bị lộ và làm việc thu hồi hiệu quả hơn. Từ tháng 5 năm 2026, ai muốn có thể tự chọn chứng chỉ 45 ngày để thử trước. Từ tháng 2 năm 2027, mặc định còn 64 ngày, và kết quả xác minh tên miền chỉ được giữ 10 ngày thay vì 30. Từ tháng 2 năm 2028, mặc định còn 45 ngày, và kết quả xác minh chỉ giữ 7 giờ."
      - clear: true
        show: |
          <p>Thông báo cũng ghi: gia hạn cứng mỗi 60 ngày <b>sẽ không còn đủ</b>; chấp nhận được là gia hạn ở khoảng <b>hai phần ba</b> vòng đời; không khuyên làm tay; nên có <b>giám sát</b> để cảnh báo khi chưa gia hạn.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. lịch cứng 60 ngày với chứng chỉ 45 ngày</td><td>$60 - 45$</td><td>trang hỏng <b class="red">15 ngày</b> mỗi chu kỳ</td></tr>
          <tr><td>2. hai phần ba của 45 ngày</td><td>$45 \times \frac{2}{3}$</td><td>gia hạn ở ngày $\hlg{30}$</td></tr>
          <tr><td>3. hai phần ba của 64 ngày</td><td>$64 \times \frac{2}{3}$</td><td>$\approx 42{,}7$ — ngày khác nhau theo từng vòng đời</td></tr>
          <tr><td>4. số lần gia hạn mỗi năm</td><td>365 chia 60 so với 365 chia 30</td><td>6 lên 12: <b>gấp đôi</b></td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Thông báo cũng ghi rằng gia hạn cứng mỗi 60 ngày sẽ không còn đủ, còn gia hạn ở khoảng hai phần ba vòng đời là chấp nhận được. Họ không khuyên làm tay, và khuyên có giám sát để cảnh báo khi chưa gia hạn. Bước một, lịch cứng 60 ngày với chứng chỉ 45 ngày làm trang hỏng 15 ngày mỗi chu kỳ. Bước hai, hai phần ba của 45 ngày là gia hạn ở ngày 30. Bước ba, hai phần ba của 64 ngày khoảng 42 phẩy 7, nên ngày gia hạn phải tính theo từng vòng đời. Bước bốn, số lần gia hạn mỗi năm tăng từ 6 lên 12, tức gấp đôi."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm ba con số của hành trình bằng đường khác"
    checks:
      - "256 * 256 == 65536"
      - "(__import__('datetime').date(2013, 3, 14) - __import__('datetime').date(2012, 3, 14)).days == 365 and (__import__('datetime').date(2014, 3, 14) - __import__('datetime').date(2013, 3, 14)).days == 365 and 365 + 365 + 24 == 754"
      - "30 + 15 == 45 and 2 * 15 == 30"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>65 536 byte</td><td>mỗi byte có 256 giá trị, hai byte: $256 \times 256 = 65\,536$ ✓</td></tr>
          <tr><td>754 ngày</td><td>14/3/2012 → 14/3/2013: 365 ngày; → 14/3/2014: 365 ngày; → 7/4/2014: 24 ngày; cộng $365 + 365 + 24 = 754$ ✓</td></tr>
          <tr><td>ngày 30 của chứng chỉ 45 ngày</td><td>chia 45 ngày làm 3 phần, mỗi phần 15; gia hạn hết phần thứ hai: $2 \times 15 = 30$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Ta kiểm lại ba con số theo đường khác. Mỗi byte có 256 giá trị, nên hai byte có 256 nhân 256, bằng 65 nghìn 536. Với 754 ngày, từ 14 tháng 3 năm 2012 tới cùng ngày năm 2013 là 365 ngày, tới năm 2014 thêm 365 ngày. Từ 14 tháng 3 tới 7 tháng 4 thêm 24 ngày, cộng lại 754. Với chứng chỉ 45 ngày, chia làm 3 phần mỗi phần 15, gia hạn khi hết phần thứ hai là ngày 30."

  # ───────────────────────── 10. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "100 - 14 == 86 and 20 > 2.9"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Vá xong lỗ hổng là xong”</td><td>khoá bí mật có thể đã lộ; 14% trang thay chứng chỉ mà giữ khoá cũ thì không được bảo vệ thêm</td><td>vá, rồi tạo khoá mới, cấp chứng chỉ mới, thu hồi chứng chỉ cũ</td></tr>
          <tr><td><b class="red">2.</b> “Đặt lịch nhắc rồi gia hạn tay là đủ”</td><td>trước năm 2015 khoảng 20% chứng chỉ từng bị quên gia hạn; với 45 ngày, làm tay 12 lần một năm</td><td>gia hạn tự động và giám sát cảnh báo</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ vá xong lỗ hổng là xong. Khoá bí mật có thể đã lộ, nên 14 phần trăm trang thay chứng chỉ mà vẫn giữ khoá cũ không được bảo vệ thêm. Bài học sai thứ hai là nghĩ đặt lịch nhắc rồi gia hạn tay là đủ. Trước năm 2015, khoảng 20 phần trăm chứng chỉ từng bị quên gia hạn, và với chứng chỉ 45 ngày thì phải làm tay 12 lần mỗi năm."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Chứng chỉ càng dài hạn càng an toàn, đỡ việc”</td><td>khoá bị lộ còn dùng được tới hết hạn; thu hồi không phải lúc nào cũng được kiểm</td><td>vòng đời ngắn cộng tự động hoá</td></tr>
          <tr><td><b class="red">4.</b> Gõ cứng “gia hạn mỗi 60 ngày” vào hệ thống</td><td>đúng với 90 ngày, sai với 45 ngày: hỏng 15 ngày mỗi chu kỳ</td><td>tính theo vòng đời thật, hoặc theo gợi ý gia hạn của tổ chức cấp</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ chứng chỉ càng dài hạn càng an toàn và đỡ việc. Khoá bị lộ vẫn dùng được tới khi chứng chỉ hết hạn, và thu hồi không phải lúc nào cũng được kiểm. Bài học sai thứ tư là gõ cứng gia hạn mỗi 60 ngày vào hệ thống. Cách đó đúng với 90 ngày nhưng sai với 45 ngày, làm trang hỏng 15 ngày mỗi chu kỳ, nên hãy tính theo vòng đời thật."

  # ───────────────────────── 11. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "20 * 178 == 3560 and 20 * (365 // 60) == 120"
      - "45 - 30 == 15 and 15 > 7"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Công ty có <b>20 tên miền</b>, đang mua chứng chỉ 1 năm và gia hạn tay. Chuyển sang chứng chỉ miễn phí 90 ngày, gia hạn tự động?</td></tr>
          <tr><td>2</td><td>Năm 2028, chứng chỉ còn 45 ngày. Bạn đặt gia hạn ở ngày 30. Có cần thêm gì nữa?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với các số minh hoạ. Câu một, công ty có 20 tên miền, đang mua chứng chỉ 1 năm và gia hạn tay. Có nên chuyển sang chứng chỉ miễn phí 90 ngày, gia hạn tự động? Câu hai, năm 2028 chứng chỉ chỉ còn 45 ngày, và bạn đặt gia hạn ở ngày 30. Bạn có cần thêm gì nữa không? Dừng video và viết ra giấy."
        pause: 20
      - show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chuyển sang tự động, 90 ngày</td><td>theo giá trung bình năm 2015 đỡ $20 \times 178 = 3560$ USD mỗi năm; không còn quên gia hạn tay</td><td>khoảng $20 \times 6 = 120$ lần gia hạn mỗi năm, phải tin vào máy và giám sát nó</td></tr>
          <tr><td>giữ mua chứng chỉ 1 năm</td><td>quen quy trình</td><td>20 lần làm tay mỗi năm; cả ngành đang rút ngắn vòng đời chứng chỉ</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: thiết bị nào không chạy được chương trình gia hạn tự động thì phải có quy trình riêng và cảnh báo trước hạn — nhưng đó là ngoại lệ, không phải mặc định.</p>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Đáp án câu một là một đánh đổi. Chuyển sang tự động thì theo giá trung bình năm 2015 đỡ được 3560 đô la mỗi năm, và không còn quên gia hạn tay. Đổi lại, có khoảng 120 lần gia hạn mỗi năm mà bạn phải giám sát. Giữ cách cũ thì quen quy trình, nhưng phải làm tay 20 lần mỗi năm, và vòng đời chứng chỉ của cả ngành đang ngắn dần. Thiết bị nào không chạy được chương trình gia hạn tự động thì cần quy trình riêng và cảnh báo trước hạn, như một ngoại lệ."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: thêm gì</th><th>vì sao</th></tr>
          <tr><td>giám sát: cảnh báo khi chứng chỉ còn dưới 7 ngày (số minh hoạ)</td><td>gia hạn ở ngày 30 để lại $45 - 30 = 15$ ngày; nếu lần gia hạn hỏng mà không ai biết, 15 ngày trôi qua rất nhanh</td></tr>
          <tr><td>dùng gợi ý gia hạn của tổ chức cấp nếu chương trình hỗ trợ</td><td>giúp chương trình biết khi nào cần gia hạn, không phải tự đoán</td></tr>
          <tr><td>thử gia hạn ở môi trường thử trước mỗi đợt đổi vòng đời</td><td>đổi được báo trước nhiều tháng, có môi trường thử khoảng một tháng trước</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu hai, đặt ngày 30 là đúng nhưng chưa đủ. Gia hạn ở ngày 30 để lại 15 ngày, nên hãy thêm giám sát cảnh báo khi chứng chỉ còn dưới 7 ngày, một số minh hoạ, phòng khi lần gia hạn hỏng mà không ai biết. Nếu chương trình hỗ trợ, hãy dùng gợi ý gia hạn của tổ chức cấp, để chương trình biết khi nào cần gia hạn thay vì tự đoán. Cuối cùng, thử gia hạn ở môi trường thử trước mỗi đợt đổi vòng đời."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2014: thiếu kiểm biên, lộ tới 64 KB; vá nhanh, thay khoá chậm</span><span class="a">→</span>
          <span class="n">2015: miễn phí, tự động, 90 ngày</span><span class="a">→</span>
          <span class="n">2019: 538 triệu chứng chỉ, 72–95% qua HTTPS</span><span class="a">→</span>
          <span class="n">2025–2028: 45 ngày, gia hạn theo vòng đời, có giám sát</span></div>
        say: "Tổng kết lại hành trình. Năm 2014, một chỗ thiếu kiểm biên làm lộ tới 64 KB bộ nhớ, việc vá thì nhanh nhưng thay khoá thì chậm. Năm 2015, chứng chỉ miễn phí, tự động với vòng đời 90 ngày gỡ điểm nghẽn chi phí và làm tay. Năm 2019, 538 triệu chứng chỉ đã được cấp, và 72 tới 95 phần trăm lượt tải trang đã có mã hoá. Từ 2025 tới 2028, vòng đời xuống 45 ngày, gia hạn phải theo vòng đời và có giám sát."
      - show: |
          <div class="box key"><b>Tư duy:</b> an toàn ở quy mô cả web không đến từ việc dặn mọi người “cẩn thận hơn”, mà từ việc làm cho cách an toàn trở thành cách <b>dễ nhất và tự động</b>. Trước khi chọn, hỏi: nếu lần gia hạn hay thay khoá hỏng, ai biết, và sau bao lâu?</div>
        say: "Điều cần mang theo, an toàn ở quy mô cả web không đến từ việc dặn mọi người cẩn thận hơn, mà từ việc làm cho cách an toàn trở thành cách dễ nhất và tự động. Trước khi chọn, hãy hỏi, nếu lần gia hạn hay thay khoá hỏng, ai sẽ biết, và sau bao lâu?"
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá SEC. Bạn đã đi từ tư duy kẻ tấn công tới cách cả web chuyển sang mã hoá mặc định.</p>
        say: "Đây là bài cuối của khoá an toàn thông tin. Bạn đã đi từ tư duy kẻ tấn công tới cách cả web chuyển sang mã hoá mặc định. Cảm ơn bạn đã theo học."
