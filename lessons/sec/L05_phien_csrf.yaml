- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">trình duyệt tự kèm cookie</span><span class="a">→</span>

      <span class="n">cờ cùng trang + mã chống giả mạo</span><span class="a">→</span>

      <span class="n">thay đổi dữ liệu không dùng GET</span><span class="a">→</span>

      <span class="n">kiểm ở máy chủ, phiên có hạn</span></div>

      '
    say: Tổng kết lại, trình duyệt tự kèm cookie trong mọi yêu cầu, nên cần cờ cùng trang và mã chống giả mạo. Thao tác thay đổi dữ liệu không dùng phương thức lấy, mọi kiểm tra làm ở máy chủ, và phiên phải có hạn. Không bao giờ chỉ dựa vào bánh quy phiên làm chứng từ duy nhất thực thi giao dịch nhạy cảm từ phía trình duyệt. Sinh lại mã phiên ngay sau đăng nhập, cài đặt ba cờ bảo mật bánh quy cùng thẻ chống giả mạo yêu cầu chặn trọn lỗ hổng.
  - show: '<div class="box key"><b>Tư duy:</b> trình duyệt làm việc thay người dùng một cách trung thành — kể cả khi yêu cầu đến từ một trang người dùng không hề tin.</div>

      '
    say: Điều cần mang theo, trình duyệt làm việc thay người dùng một cách trung thành, kể cả khi yêu cầu đến từ một trang mà người dùng không hề tin. Luôn kết hợp mã hoá đường truyền, chống đọc từ mã kịch bản, hạn chế gửi chéo trang và thẻ chống giả mạo.
  - clear: true
    show: '<p class="note">Bài sau (bài 6): <b>lỗ hổng chèn</b> — truy vấn, lệnh, mã kịch bản trên trang.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 6, ta học các lỗ hổng chèn, vào truy vấn, vào lệnh, và mã kịch bản trên trang. Hẹn gặp bạn ở bài tiếp theo.
