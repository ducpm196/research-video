id: L26
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 26 — Phân tích phân biệt tuyến tính (LDA) — tiêu chí Fisher"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "DC23#Ch5; tex#L410 (LDA: “chiếu dữ liệu tối đa khoảng cách giữa các lớp”); AUDIT A23, T16"
assumes: [cdot, sub, vec, mat, transpose, inverse, implies, approx, lambda, Sigma_mat, normal, power, sqrt, geq]
# Quy ước ký hiệu: tâm hai lớp m₁, m₂ (vector, in đậm); độ trải trong lớp S_w (ma trận, in đậm, chỉ số w = within — giải thích bằng lời);
#   hướng chiếu w là vector (in đậm) — KHÔNG phải trọng số của bài 18–25 (nói ở notation_note); tỉ số Fisher J(w).
#   Ví dụ: hai lớp cùng hiệp phương sai diag(9; 0,25), tâm (0; 0) và (3; 1) — đúng dữ liệu kiểm T16 của AUDIT; số trên màn hình
#   tính theo phân phối thật (lý thuyết), phép thử dùng 400 + 400 mẫu.
# Lời đọc: “Fisher” đọc “Phi-sơ” (CHƯA probe → kiểm ASR toàn bài, B51); LDA chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (bóng trên một hướng), bài 14 (phân phối chuẩn, quy tắc diện tích), bài 15 (ma trận
#   hiệp phương sai, phương sai theo hướng u là uᵀΣu), bài 16 (PCA chọn hướng trải rộng nhất, không nhìn nhãn).
# Sửa nguồn (AUDIT A23): tối đa TỈ SỐ (khoảng cách hai tâm sau khi chiếu)² / (độ trải trong lớp), không chỉ khoảng cách giữa các lớp.
objectives:
  - "Hiểu vì sao chỉ kéo xa hai tâm là chưa đủ"
  - "Đọc và tính tỉ số Fisher cho một hướng chiếu"
  - "Tìm hướng tốt nhất w ∝ S_w⁻¹(m₂ − m₁) cho hai lớp"
  - "Phân biệt LDA (có nhãn) với PCA (không nhãn)"
  - "Biết giới hạn: tối đa C − 1 chiều, cần S_w khả nghịch"
asr_reviewed:
  - {sentence: "Câu hai, vì S w là ma trận chéo, nhân với nghịch đảo của nó là chia từng chiều cho độ trải.", reason: "ASR chép “Câu 2, vì fvk là ma trận chéo, nhận với nghiệt đạo của nó là chia từng chiều cho độ trải.” (0.791): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: nhân/nhận, nghịch đảo/nghiệt đạo — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì S w là ma trận chéo với hai số 9 và 0 phẩy 25, w chuyển vị nhân S w nhân w chỉ là 9 nhân 3 bình phương, cộng 0 phẩy 25 nhân 1 bình phương.", reason: "ASR chép “Vì fvkp là ma trận chéo với 2 số 9 và 0,25. Vkp chuyển vị nhân fvkp nhân vkp chỉ là 9 nhân 3 bình phương, cộng 0,25 nhân 1 bình phương.” (0.878): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vậy J bằng 64 chia 8, bằng 8, gấp đôi hướng ngang.", reason: "ASR chép “Vậy dì bằng 64 chia 8, bằng 8, gấp đôi hướng ngang.” (0.929): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - sentence: "Hướng tốt nhất tỉ lệ với nghịch đảo của S w nhân hiệu hai tâm."
    reason: "S w đọc tên chữ cái “ét vê kép”, ASR chép “SVCAP”; nghịch→nghiệp lẫn vần — các từ khác khớp"
  - sentence: "Lấy đạo hàm của J theo w và cho bằng 0, với hai lớp ta rút gọn được, hướng tốt nhất tỉ lệ với nghịch đảo của S w nhân hiệu hai tâm."
    reason: "J, w đọc tên chữ cái (chép “di”, “V-cap”); nghịch→nghiệt lẫn vần"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chiếu theo đường nối hai tâm — vẫn chồng lấn nhiều"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="500" height="340" viewBox="0 0 500 340">
            <ellipse cx="220" cy="260" rx="180" ry="60" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="3"/>
            <ellipse cx="310" cy="200" rx="180" ry="60" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="3"/>
            <circle cx="220" cy="260" r="7" fill="#2563eb"/><circle cx="310" cy="200" r="7" fill="#d97706"/>
            <line x1="220" y1="260" x2="310" y2="200" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/>
            <line x1="470" y1="330" x2="470" y2="30" stroke="#059669" stroke-width="5"/>
            <g font-size="22"><text x="150" y="80" fill="#dc2626">nối hai tâm</text><text x="460" y="25" text-anchor="end" fill="#059669">hướng tốt hơn</text></g>
          </svg></div>
          <div class="col"><p>Hai lớp trải <b>rất rộng</b> theo chiều ngang, <b>hẹp</b> theo chiều dọc. Tâm lệch nhau $(3;\ 1)$.</p>
          <p>Chiếu theo đường nối hai tâm (đỏ): hai lớp chồng lấn, đoán sai <b class="red">khoảng 29%</b>.</p>
          <p>Chiếu gần như theo chiều dọc (xanh lá): đoán sai chỉ <b>khoảng 13%</b>.</p></div></div>
        say: "Chào bạn, hai lớp này trải rất rộng theo chiều ngang nhưng hẹp theo chiều dọc. Nếu chiếu theo đường nối hai tâm, hai lớp chồng lấn và đoán sai khoảng 29 phần trăm. Chiếu gần như theo chiều dọc, chỉ sai khoảng 13 phần trăm."
      - show: |
          <div class="box key">Kéo xa hai tâm là chưa đủ — phải so với <b>độ trải của mỗi lớp</b>. Hôm nay: phân tích phân biệt tuyến tính (LDA) và tiêu chí Fisher.</div>
          <p class="note">Hay gặp cách ghi gọn “tối đa khoảng cách giữa các lớp” — thiếu nửa sau của tiêu chí.</p>
        focus: [1, 1, 2]
        say: "Vậy kéo xa hai tâm là chưa đủ, mà phải so với độ trải của mỗi lớp. Hôm nay ta học phân tích phân biệt tuyến tính và tiêu chí Fisher. Lưu ý, nhiều bảng tóm tắt chỉ ghi nửa đầu của tiêu chí này."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: bóng, phương sai theo hướng, PCA"
    steps:
      - show: |
          <p>Bài 1, 16: bóng của điểm $\mathbf{x}$ trên hướng $\mathbf{w}$ là $\mathbf{w}^T\mathbf{x}$.</p>
          <p>Bài 15: phương sai của các bóng là $\mathbf{w}^T\mathbf{\Sigma}\mathbf{w}$ ($\mathbf{\Sigma}$: ma trận hiệp phương sai).</p>
          <p>Bài 16: PCA chọn hướng bóng trải rộng nhất — <b>không nhìn nhãn</b>.</p>
        focus: [1, 2, 3]
        say: "Nhắc lại bài 1 và bài 16, bóng của điểm x trên hướng w là w chuyển vị nhân x. Theo bài 15, phương sai của các bóng là w chuyển vị nhân ma trận hiệp phương sai nhân w. Và theo bài 16, phân tích thành phần chính chọn hướng trải rộng nhất, mà không nhìn nhãn."

  # ───────────────────────── 3. TIÊU CHÍ FISHER ─────────────────────────
  - id: sym_fisher
    kind: symbol
    title: "Giải mã: tỉ số Fisher J(w)"
    checks:
      - "(lambda S, d: [round(float((np.array(w) @ d)**2/(np.array(w) @ S @ np.array(w))), 2) for w in ([1, 0.], [3, 1.], [0, 1.], [1/3, 4.])] == [1.0, 1.23, 4.0, 5.0])(np.diag([9, 0.25]), np.array([3, 1.]))"
    steps:
      - show: |
          <div class="box key">$J(\mathbf{w}) = \dfrac{\big(\mathbf{w}^T(\mathbf{m}_2 - \mathbf{m}_1)\big)^2}{\mathbf{w}^T\mathbf{S}_w\mathbf{w}}$ &nbsp; = $\dfrac{(\text{khoảng cách hai tâm sau khi chiếu})^2}{\text{độ trải trong lớp sau khi chiếu}}$</div>
          <p>$\mathbf{m}_1$, $\mathbf{m}_2$: tâm hai lớp; &nbsp; $\mathbf{S}_w$: ma trận độ trải <b>trong</b> lớp (cộng hiệp phương sai của các lớp). Ở đây $\mathbf{S}_w = \begin{bmatrix} 9 & 0 \\ 0 & 0{,}25 \end{bmatrix}$, &nbsp; $\mathbf{m}_2 - \mathbf{m}_1 = (3;\ 1)$.</p>
        introduces: [fisher_J]
        focus: [1, 1, "2.5"]
        say: "Tỉ số Fisher có tử số là bình phương khoảng cách hai tâm sau khi chiếu, và mẫu số là độ trải trong mỗi lớp sau khi chiếu, tính bằng ma trận S w. Ta muốn tử lớn mà mẫu nhỏ. Ở đây độ trải ngang là 9, độ trải dọc chỉ 0 phẩy 25."
      - show: |
          <table class="t"><tr><th>hướng $\mathbf{w}$</th><th>(1; 0) ngang</th><th>(3; 1) nối hai tâm</th><th>(0; 1) dọc</th><th>$(\frac{1}{3};\ 4)$</th></tr>
          <tr><td>$J(\mathbf{w})$</td><td>1</td><td>1,23</td><td>4</td><td>$\hlg{5}$</td></tr></table>
          <p class="note">Hướng nối hai tâm có tử số lớn nhất nhưng mẫu số rất lớn (độ trải ngang 9). Hướng gần dọc có tử nhỏ hơn nhưng mẫu nhỏ hơn nhiều.</p>
          <p class="note">Chữ $\mathbf{w}$ ở đây là <b>hướng chiếu</b>, không phải trọng số của các bài 18–25; chỉ số $w$ của $\mathbf{S}_w$ là chữ đầu của “within” (trong).</p>
        notation_note: true
        focus: ["1.1", 2, 1, 1, 3]
        say: "Thay số cho bốn hướng. Hướng nối hai tâm chỉ được 1 phẩy 23, vì mẫu số rất lớn. Hướng dọc được 4. Hướng một phần ba và 4 được 5, cao nhất. Lưu ý chữ w ở đây là hướng chiếu, không phải trọng số của các bài trước."

  - id: hand_J
    kind: example
    title: "Ví dụ: tính tỉ số Fisher từng bước cho hai hướng"
    checks:
      - "(lambda S, d, w: (float(w @ d), float((w @ d)**2), float(w @ S @ w), round(float((w @ d)**2/(w @ S @ w)), 2)) == (10.0, 100.0, 81.25, 1.23))(np.diag([9, 0.25]), np.array([3, 1.]), np.array([3, 1.]))"
      - "(lambda S, d, w: (round(float(w @ d), 9), round(float((w @ d)**2), 9), round(float(w @ S @ w), 9), round(float((w @ d)**2/(w @ S @ w)), 9)) == (5.0, 25.0, 5.0, 5.0))(np.diag([9, 0.25]), np.array([3, 1.]), np.array([1/3, 4.]))"
      - "Rational(100, 1)/Rational(8125, 100) == Rational(16, 13) and round(16/13, 2) == 1.23"
    steps:
      - show: |
          <p><b>Bước 1 — tử số</b>, hướng nối hai tâm $\mathbf{w} = (3;\ 1)$, &nbsp; $\mathbf{m}_2 - \mathbf{m}_1 = (3;\ 1)$:</p>
          $$\mathbf{w}^T(\mathbf{m}_2 - \mathbf{m}_1) = 3\cdot 3 + 1\cdot 1 = 10, \qquad 10^2 = \hlo{100}$$
        focus: [1, 2, 2]
        say: "Bước một, tính tử số cho hướng nối hai tâm, w bằng 3 và 1, hiệu hai tâm cũng bằng 3 và 1. Tích vô hướng là 3 nhân 3 cộng 1 nhân 1, bằng 10. Bình phương lên, tử số bằng 100."
      - show: |
          <p><b>Bước 2 — mẫu số.</b> $\mathbf{S}_w$ là ma trận chéo $9$ và $0{,}25$, nên $\mathbf{w}^T\mathbf{S}_w\mathbf{w}$ chỉ cần nhân từng chiều:</p>
          $$\mathbf{w}^T\mathbf{S}_w\mathbf{w} = 9\cdot 3^2 + 0{,}25\cdot 1^2 = 81 + 0{,}25 = \hlo{81{,}25}$$
        focus: [1, 2, 2]
        say: "Bước hai, tính mẫu số. Vì S w là ma trận chéo với hai số 9 và 0 phẩy 25, w chuyển vị nhân S w nhân w chỉ là 9 nhân 3 bình phương, cộng 0 phẩy 25 nhân 1 bình phương. Kết quả là 81 cộng 0 phẩy 25, bằng 81 phẩy 25, rất lớn vì hướng này đi gần theo chiều ngang trải rộng."
      - show: |
          <p><b>Bước 3 — chia.</b></p>
          $$J(3;\ 1) = \frac{100}{81{,}25} = \frac{16}{13} \approx \hlo{1{,}23}$$
        focus: [1, 2]
        say: "Bước ba, chia tử cho mẫu, 100 chia 81 phẩy 25, bằng 16 phần 13. Kết quả xấp xỉ 1 phẩy 23, đúng con số trong bảng."
      - clear: true
        show: |
          <p><b>Bước 4 — làm lại cho hướng</b> $\mathbf{w} = (\frac{1}{3};\ 4)$:</p>
          <table class="t"><tr><th>phần</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>tử số</td><td>$\left(\frac{1}{3}\cdot 3 + 4\cdot 1\right)^2 = 5^2$</td><td>25</td></tr>
          <tr><td>mẫu số</td><td>$9\cdot\frac{1}{9} + 0{,}25\cdot 16 = 1 + 4$</td><td>5</td></tr>
          <tr><td>$J$</td><td>$\frac{25}{5}$</td><td>$\hlg{5}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, làm lại cho hướng một phần ba và 4. Tử số là một phần ba nhân 3 cộng 4 nhân 1, bằng 5, bình phương lên được 25. Mẫu số là 9 nhân một phần chín, cộng 0 phẩy 25 nhân 16, tức 1 cộng 4, bằng 5. Vậy J bằng 25 chia 5, bằng 5, gấp hơn bốn lần hướng nối hai tâm."

