        say: "Hình vẽ bóng của hai lớp trên hai hướng, cùng một thước đo, mỗi đường cong là phân bố bóng của một lớp. Hàng trên chiếu theo hướng nối hai tâm, hai tâm cách nhau 3 phẩy 16, xa hơn, nhưng mỗi lớp trải tới 2 phẩy 85, nên hai đường cong dẹt và chồng lên nhau gần hết. Hàng dưới chiếu theo hướng của phân tích phân biệt tuyến tính, hai tâm chỉ cách 1 phẩy 25, nhưng mỗi lớp chỉ trải 0 phẩy 56, nên hai đỉnh nhọn và tách nhau rõ. Tỉ số Fisher đo đúng điều mắt thấy, khoảng cách chia độ trải, rồi bình phương, được 1 phẩy 23 so với 5."

  # ───────────────────────── 4. NGHIỆM ─────────────────────────
  - id: solution
    kind: formula
    title: "Hướng tốt nhất: chia hiệu hai tâm cho độ trải trong lớp"
    checks:
      - "(lambda S, d: np.allclose(np.linalg.solve(S, d), [1/3, 4]) and abs(float(d @ np.linalg.solve(S, d)) - 5) < 1e-12)(np.diag([9, 0.25]), np.array([3, 1.]))"
      - "(lambda S, d: all(float((w @ d)**2/(w @ S @ w)) <= 5 + 1e-9 for w in [np.array([math.cos(t), math.sin(t)]) for t in np.linspace(0, math.pi, 1801)]))(np.diag([9, 0.25]), np.array([3, 1.]))"
    steps:
      - show: |
          <p>Lấy đạo hàm của $J$ theo $\mathbf{w}$, cho bằng 0 (bài 6, 8). Với hai lớp, rút gọn được:</p>
          <div class="box key">$\text{hướng tốt nhất}\ \mathbf{w}\ \ \text{tỉ lệ với}\ \ \mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1)$</div>
          <p><b>Làm thử ngay</b>: $\ \mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1) = \left(\frac{3}{9};\ \frac{1}{0{,}25}\right) = \hlg{\left(\frac{1}{3};\ 4\right)}$ — đúng hướng có $J = 5$ ở bảng trên.</p>
        focus: [[1, 2], 3]
        say: "Lấy đạo hàm của J theo w và cho bằng 0, với hai lớp ta rút gọn được, hướng tốt nhất tỉ lệ với nghịch đảo của S w nhân hiệu hai tâm. Làm thử ngay, chia 3 cho 9 và chia 1 cho 0 phẩy 25, được một phần ba và 4, đúng hướng có J bằng 5."
      - show: |
          <p class="note">Ý nghĩa: nhân với $\mathbf{S}_w^{-1}$ là <b>chia</b> mỗi chiều cho độ trải của nó — chiều trải rộng (ngang, 9) bị giảm vai trò, chiều hẹp (dọc, 0,25) được tăng vai trò. Giống “khoảng cách theo độ trải” của bài 15.</p>
          <p class="note">Tổng quát: $\mathbf{S}_b\mathbf{w} = \lambda\mathbf{S}_w\mathbf{w}$ với $\mathbf{S}_b = (\mathbf{m}_2 - \mathbf{m}_1)(\mathbf{m}_2 - \mathbf{m}_1)^T$ — một bài toán trị riêng (bài 5); $\lambda$ lớn nhất chính là $J$ lớn nhất.</p>
        focus: [1, 2]
        say: "Ý nghĩa là nhân với nghịch đảo của S w chia mỗi chiều cho độ trải của nó, giống khoảng cách theo độ trải của bài 15. Tổng quát, đây là một bài toán trị riêng như bài 5, và trị riêng lớn nhất chính là tỉ số Fisher lớn nhất."

  # ───────────────────────── 5. SO SÁNH VỚI PCA ─────────────────────────
  - id: vs_pca
    kind: example
    title: "Ví dụ: LDA và PCA chọn hai hướng khác nhau"
    checks:
      - "(lambda S, d, P: (lambda v: round(float((v @ d)**2/(v @ S @ v)), 2) == 1.05 and round(P(-math.sqrt((v @ d)**2/(v @ S @ v))/2), 3) == 0.304)(np.linalg.eigh(S + 0.25*np.outer(d, d))[1][:, -1]))(np.diag([9, 0.25]), np.array([3, 1.]), lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
      - "(lambda P: [round(P(-math.sqrt(j)/2), 3) for j in (5, 16/13)] == [0.132, 0.29])(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
    steps:
      - show: |
          <table class="t"><tr><th>phương pháp</th><th>dùng nhãn?</th><th>hướng chọn</th><th>$J$</th><th>đoán sai (lý thuyết)</th></tr>
          <tr><td>PCA (bài 16)</td><td>không</td><td>gần ngang (trải rộng nhất)</td><td>1,05</td><td>30,4%</td></tr>
          <tr><td>nối hai tâm</td><td>có (chỉ tâm)</td><td>(3; 1)</td><td>1,23</td><td>29,0%</td></tr>
          <tr><td><b>LDA</b></td><td>có (tâm + độ trải)</td><td>$(\frac{1}{3};\ 4)$, gần dọc</td><td>5</td><td>$\hlg{13{,}2\%}$</td></tr></table>
          <p class="note">Đoán sai khi cắt ở giữa hai tâm sau khi chiếu, tính theo phân phối chuẩn (bài 14).</p>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "So sánh ba cách. Phân tích thành phần chính không nhìn nhãn, chọn hướng gần ngang vì trải rộng nhất, và đoán sai 30 phẩy 4 phần trăm. Nối hai tâm sai 29 phần trăm. Phân tích phân biệt tuyến tính dùng cả tâm và độ trải, chỉ sai 13 phẩy 2 phần trăm."

  # ───────────────────────── 6. NHIỀU LỚP ─────────────────────────
  - id: multi
    kind: concept
    title: "Nhiều lớp và các giới hạn"
    steps:
      - show: |
          <p>Với $C$ lớp: $\mathbf{S}_b$ gom độ lệch của $C$ tâm so với tâm chung; hạng của $\mathbf{S}_b$ tối đa $C - 1$ (bài 3) → LDA cho <b>tối đa $C - 1$ hướng</b>. Hai lớp: 1 hướng; 10 lớp chữ số: tối đa 9 hướng.</p>
          <p class="note">Cần $\mathbf{S}_w$ khả nghịch. Khi số đặc trưng lớn hơn số mẫu, $\mathbf{S}_w$ suy biến — cộng thêm $\varepsilon\mathbf{I}$ như phạt L2 của bài 19, hoặc giảm chiều bằng PCA trước.</p>
        introduces: [epsilon, identity]
        focus: [1, 1, 2]
        say: "Với C lớp, ma trận giữa các lớp gom độ lệch của C tâm so với tâm chung, nên hạng của nó tối đa là C trừ 1, như khái niệm hạng ở bài 3. Vì vậy phân tích phân biệt tuyến tính cho tối đa C trừ 1 hướng. Nó cũng cần S w khả nghịch, nếu không thì cộng thêm một ma trận nhỏ như bài 19."

  # ───────────────────────── 7. KIỂM BẰNG MÔ PHỎNG ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: 800 điểm mô phỏng"
    checks:
      - "(lambda X1, X2: (lambda m1, m2, Sw: (lambda ov: (round(ov(np.linalg.solve(Sw, m2 - m1)), 3), round(ov(m2 - m1), 3)) == (0.122, 0.28))(lambda w: float((((X1 @ w) > w @ (m1 + m2)/2).mean() + ((X2 @ w) < w @ (m1 + m2)/2).mean())/2)))(X1.mean(0), X2.mean(0), np.cov(X1.T, bias=True)*400 + np.cov(X2.T, bias=True)*400))(*(lambda rng: (rng.multivariate_normal([0, 0], np.diag([9, 0.25]), 400), rng.multivariate_normal([3, 1], np.diag([9, 0.25]), 400)))(np.random.default_rng(0)))"
    steps:
      - show: |
          <p>Máy sinh 400 điểm mỗi lớp theo đúng hai phân phối trên, tính tâm và $\mathbf{S}_w$ <b>từ dữ liệu</b>, chiếu, cắt ở giữa:</p>
          <table class="t"><tr><th>hướng</th><th>đoán sai (mô phỏng)</th><th>lý thuyết</th></tr>
          <tr><td>LDA $\mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1)$</td><td>$\hlg{12{,}2\%}$</td><td>13,2%</td></tr>
          <tr><td>nối hai tâm</td><td>28,0%</td><td>29,0%</td></tr></table>
        focus: [1, 2]
        say: "Phép thử, ta cho máy sinh 400 điểm mỗi lớp, tính tâm và độ trải từ dữ liệu, rồi chiếu và cắt ở giữa. Hướng của tiêu chí Fisher đoán sai 12 phẩy 2 phần trăm, hướng nối hai tâm sai 28 phần trăm, gần với lý thuyết, vì dữ liệu hữu hạn nên lệch một chút."

  # ───────────────────────── 8. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "LDA trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>ở đâu</th><th>LDA làm gì</th></tr>
          <tr><td>trước khi phân loại</td><td>giảm chiều <b>có giám sát</b>; nhận dạng khuôn mặt (“Fisherfaces”)</td></tr>
          <tr><td><b>Bài 27</b>: phân loại theo các điểm gần nhất</td><td>chiếu bằng LDA trước giúp khoảng cách có ý nghĩa hơn</td></tr></table>
        forward_ref: true
        say: "Phân tích phân biệt tuyến tính được dùng để giảm chiều có giám sát trước khi phân loại, ví dụ trong nhận dạng khuôn mặt. Ở bài 27, ta học một bộ phân loại dựa vào khoảng cách tới các điểm gần nhất, và chiếu trước giúp khoảng cách có ý nghĩa hơn."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ tối đa khoảng cách giữa hai tâm <b class="red">(thiếu)</b>
          <br><span class="note">Bỏ quên mẫu số: hướng nối hai tâm có thể chồng lấn nhiều (29,0% so với 13,2%).</span></div>
        say: "Lỗi thứ nhất, chỉ tối đa khoảng cách giữa hai tâm, bỏ quên mẫu số. Hướng nối hai tâm có thể chồng lấn nhiều, sai 29 phần trăm so với 13 phẩy 2."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhầm LDA với PCA <b class="red">(sai)</b>
          <br><span class="note">PCA không dùng nhãn, giữ hướng trải rộng nhất — có thể chính là hướng hai lớp chồng lên nhau.</span></div>
        say: "Lỗi thứ hai, nhầm với phân tích thành phần chính. Cách đó không dùng nhãn, giữ hướng trải rộng nhất, mà đó có thể chính là hướng hai lớp chồng lên nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đòi nhiều hơn $C - 1$ hướng, hoặc dùng khi $\mathbf{S}_w$ suy biến <b class="red">(sai)</b>
          <br><span class="note">Hai lớp chỉ cho một hướng. Khi đặc trưng nhiều hơn mẫu, phải thêm $\varepsilon\mathbf{I}$ hoặc giảm chiều trước.</span></div>
        say: "Lỗi thứ ba, đòi nhiều hơn C trừ 1 hướng, hoặc dùng khi S w không khả nghịch. Hai lớp chỉ cho một hướng. Khi đặc trưng nhiều hơn mẫu, phải thêm một ma trận nhỏ hoặc giảm chiều trước."

  # ───────────────────────── 10. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda S, d: np.allclose(np.linalg.solve(S, d), [1, 2]) and abs(float(d @ np.linalg.solve(S, d)) - 8) < 1e-12 and (lambda w: float((w @ d)**2/(w @ S @ w)))(np.array([1, 2.])) == 8.0)(np.diag([4, 1.]), np.array([4, 2.]))"
      - "(lambda S, d, w: round(float((w @ d)**2/(w @ S @ w)), 1) == 4.0)(np.diag([4, 1.]), np.array([4, 2.]), np.array([1, 0.]))"
      - "(1*4 + 0*2)**2 == 16 and 4*1**2 + 1*0**2 == 4 and (1*4 + 2*2)**2 == 64 and 4*1**2 + 1*2**2 == 8 and Rational(4**2, 4) + Rational(2**2, 1) == 8"
    steps:
      - show: |
          <p>Hai lớp: $\mathbf{S}_w = \begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}$, &nbsp; $\mathbf{m}_2 - \mathbf{m}_1 = (4;\ 2)$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $J$ cho hướng $(1;\ 0)$.</td></tr>
          <tr><td>2</td><td>Tìm hướng LDA $\mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1)$.</td></tr>
          <tr><td>3</td><td>Tính $J$ của hướng đó.</td></tr></table>
        focus: [[1, 2], 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình về hai lớp có độ trải 4 và 1, hiệu hai tâm là 4 và 2. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① Hướng $\mathbf{w} = (1;\ 0)$, làm như Bước 1–3 của ví dụ:</p>
          $$\text{tử} = (1\cdot 4 + 0\cdot 2)^2 = 16, \qquad \text{mẫu} = 4\cdot 1^2 + 1\cdot 0^2 = 4, \qquad J = \frac{16}{4} = \hlg{4}$$
        focus: [1, 2, 2]
        say: "Câu một, ta làm như ba bước đầu của ví dụ. Tử số là 1 nhân 4 cộng 0 nhân 2, bình phương lên, bằng 16, còn mẫu số là 4 nhân 1 bình phương, bằng 4. Vậy J bằng 16 chia 4, bằng 4."
      - clear: true
        show: |
          <p>② $\mathbf{S}_w = \begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}$ chéo, $\mathbf{m}_2 - \mathbf{m}_1 = (4;\ 2)$: nghịch đảo là chia từng chiều cho độ trải của nó:</p>
          $$\mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1) = \left(\frac{4}{4};\ \frac{2}{1}\right) = (\hlg{1;\ 2})$$
        focus: [1, 2]
        say: "Câu hai, vì S w là ma trận chéo, nhân với nghịch đảo của nó là chia từng chiều cho độ trải. Chia 4 cho 4 và 2 cho 1, ta được hướng 1 và 2."
      - clear: true
        show: |
          <p>③ Hướng $\mathbf{w} = (1;\ 2)$:</p>
          <table class="t"><tr><th>phần</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>tử số</td><td>$(1\cdot 4 + 2\cdot 2)^2 = 8^2$</td><td>64</td></tr>
          <tr><td>mẫu số</td><td>$4\cdot 1^2 + 1\cdot 2^2 = 4 + 4$</td><td>8</td></tr>
          <tr><td>$J$</td><td>$\frac{64}{8}$</td><td>$\hlg{8}$</td></tr>
          <tr><td>kiểm đường khác</td><td>$(\mathbf{m}_2 - \mathbf{m}_1)^T\mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1) = \frac{4^2}{4} + \frac{2^2}{1}$</td><td>$4 + 4 = 8$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Câu ba, với hướng 1 và 2. Tử số là 1 nhân 4 cộng 2 nhân 2, bằng 8, bình phương lên được 64. Mẫu số là 4 nhân 1 cộng 1 nhân 4, bằng 8. Vậy J bằng 64 chia 8, bằng 8, gấp đôi hướng ngang. Kiểm bằng đường khác, hiệu hai tâm chia độ trải từng chiều rồi nhân lại, 16 chia 4 cộng 4 chia 1, cũng bằng 8."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chiếu lên một hướng</span><span class="a">→</span>
          <span class="n">$J$ = (khoảng cách tâm)² / độ trải trong lớp</span><span class="a">→</span>
          <span class="n">$\mathbf{w}$ tốt nhất tỉ lệ $\mathbf{S}_w^{-1}(\mathbf{m}_2 - \mathbf{m}_1)$</span><span class="a">→</span>
          <span class="n">tối đa $C - 1$ hướng; khác PCA</span></div>
        say: "Tổng kết chuỗi logic. Chiếu dữ liệu lên một hướng. Tỉ số Fisher bằng bình phương khoảng cách hai tâm chia độ trải trong lớp. Hướng tốt nhất tỉ lệ với nghịch đảo của S w nhân hiệu hai tâm. Có tối đa C trừ 1 hướng, và khác phân tích thành phần chính vì có dùng nhãn."
      - show: |
          <div class="box key"><b>Tư duy:</b> “xa nhau” chỉ có ý nghĩa khi so với “mỗi nhóm tự trải rộng bao nhiêu”.</div>
        say: "Điều cần mang theo, xa nhau chỉ có ý nghĩa khi so với mỗi nhóm tự trải rộng bao nhiêu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 27): <b>K láng giềng gần nhất</b> (KNN) — học lười, khoảng cách L1, L2, chọn K.</p>
        forward_ref: true
        say: "Ở bài sau, bài 27, ta học phương pháp K láng giềng gần nhất, một cách phân loại không cần huấn luyện, chỉ dựa vào khoảng cách. Hẹn gặp bạn ở bài tiếp theo."
