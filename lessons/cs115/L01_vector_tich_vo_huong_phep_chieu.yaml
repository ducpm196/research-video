scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao AI cần vector và phép chiếu?"
    steps:
      - show: |
          <p class="big">Máy tính không “nhìn” thấy ngôi nhà, bức ảnh hay câu văn.</p>
          <p>Nó chỉ thấy <b class="blue">một danh sách các con số</b>.</p>
        focus: [0, 1, 1, 2]
        say: "Chào bạn, trước khi học bất kỳ công thức nào, mình hỏi một câu. Máy tính có thật sự nhìn thấy ngôi nhà, bức ảnh hay câu văn không? Câu trả lời là không. Máy tính chỉ thấy một danh sách các con số."
      - show: |
          <div class="box key">Ngôi nhà = (diện tích 60 m², 2 phòng ngủ, cách trung tâm 4 km)
          <br>→ ghi gọn thành danh sách: <b class="big">6, 2, 4</b> &nbsp;<span class="note">(diện tích tính theo chục m²)</span></div>
        say: "Ví dụ một ngôi nhà rộng 60 mét vuông, có 2 phòng ngủ, cách trung tâm 4 cây số. Nếu tính diện tích theo đơn vị chục mét vuông, ta ghi gọn ngôi nhà thành danh sách 6, 2, 4. Danh sách số như vậy gọi là một vector."
      - show: |
          <p>Bài hôm nay trả lời 3 câu hỏi:</p>
          <ol><li>Hai danh sách số “giống hướng nhau” bao nhiêu? → <b>tích vô hướng</b></li>
          <li>Một danh sách số “dài” bao nhiêu? → <b>độ dài</b></li>
          <li>Phần nào của y nằm theo hướng u? → <b>phép chiếu</b></li></ol>
        focus: [1, "2.1", "2.2", "2.3", 0]
        say: "Hôm nay mình trả lời ba câu hỏi. Một, hai vector giống hướng nhau đến mức nào. Hai, một vector dài bao nhiêu. Ba, phần nào của vector y nằm theo hướng của vector u. Ba câu hỏi này là nền móng cho rất nhiều thứ về sau, ví dụ cách máy tính nén dữ liệu, hay cách dự đoán giá nhà từ dữ liệu."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh các phép tính sẽ dùng"
    checks:
      - "2**2 == 4 and (-2)**2 == 4"
      - "sqrt(25) == 5"
      - "Rational(10, 5) == 2"
      - "2*3 == 6 and (-2)*2 == -4"
    steps:
      - show: |
          <table class="t"><tr><th>Phép tính</th><th>Ví dụ</th><th>Đọc là</th></tr>
          <tr><td>Bình phương</td><td>$2^2 = 4,\ \ (-2)^2 = 4$</td><td>hai mũ hai bằng bốn</td></tr>
          <tr><td>Căn bậc hai</td><td>$\sqrt{25} = 5$</td><td>căn của 25 bằng 5</td></tr>
          <tr><td>Phân số</td><td>$\frac{10}{5} = 2$</td><td>10 chia 5 bằng 2</td></tr>
          <tr><td>Nhân với số âm</td><td>$(-2)\times 2 = -4$</td><td>âm hai nhân hai bằng âm bốn</td></tr></table>
        say: "Bài này chỉ cần vài phép tính phổ thông. Bình phương, ví dụ hai mũ hai bằng bốn, và âm hai mũ hai cũng bằng bốn, vì âm nhân âm ra dương. Căn bậc hai là phép ngược của bình phương, căn của 25 bằng 5. Phân số là phép chia, 10 chia 5 bằng 2. Và nhân với số âm thì kết quả đổi dấu."
      - show: |
          <div class="box key">Hai cách viết phép nhân: &nbsp; $2 \times 3 \;=\; 2 \cdot 3 \;=\; 6$
          <br><span class="note">Dấu chấm nằm <b>giữa dòng</b> “·” cũng là dấu nhân. Từ đây bài dùng “·” để khỏi nhầm × với chữ x.</span></div>
        introduces: [cdot]
        notation_note: true
        say: "Một ký hiệu nhỏ nhưng hay làm người mới bối rối. Dấu chấm nằm giữa dòng cũng là dấu nhân, hai chấm ba vẫn bằng sáu. Từ đây mình dùng dấu chấm này, vì dấu nhân chéo trông rất giống chữ x."

  # ───────────────────────── 3. KÝ HIỆU VECTOR ─────────────────────────
  - id: sym_vec
    kind: symbol
    title: "Giải mã ký hiệu: vector và thành phần"
    checks:
      - "Matrix([6,2,4])[0] == 6 and Matrix([6,2,4])[2] == 4"
      - "Matrix([6,2,4]) != Matrix([2,6,4])"
    steps:
      - show: |
          <div class="row"><div class="col">
          $$\mathbf{y} = \begin{bmatrix} 6 \\ 2 \\ 4 \end{bmatrix}$$</div>
          <div class="col"><ul><li>Chữ <b>thường, in đậm</b> = một vector</li>
          <li>Viết <b>dọc</b> (vector cột) là quy ước mặc định</li></ul></div></div>
        introduces: [vec]
        say: "Ký hiệu đầu tiên. Một chữ cái thường, in đậm, như chữ y đậm này, nghĩa là một vector, tức là một danh sách số. Theo quy ước, ta viết danh sách đó theo chiều dọc, gọi là vector cột."
      - show: |
          <p>Thành phần thứ $i$ viết bằng <b>chỉ số dưới</b>:
          $\ y_1 = \hlb{6},\ \ y_2 = \hlb{2},\ \ y_3 = \hlb{4}$</p>
          <p class="note">Chữ thường, KHÔNG in đậm, có chỉ số dưới = một con số đơn lẻ trong vector.</p>
        introduces: [sub]
        focus: [1, 1, 2]
        say: "Muốn nói tới từng con số bên trong, ta gắn một chỉ số nhỏ ở dưới chân. y một bằng 6, y hai bằng 2, y ba bằng 4. Để ý, y một không in đậm, vì nó chỉ là một con số, không phải cả danh sách."
      - show: |
          <div class="box warn">Thứ tự quan trọng: danh sách 6, 2, 4 và danh sách 2, 6, 4 là <b>hai ngôi nhà khác nhau</b>.</div>
        say: "Lưu ý quan trọng. Thứ tự trong vector có ý nghĩa. Danh sách 6, 2, 4 và danh sách 2, 6, 4 là hai ngôi nhà hoàn toàn khác nhau, vì vị trí thứ nhất luôn là diện tích, vị trí thứ hai luôn là số phòng ngủ."
      - clear: true
        show: |
          <div class="row"><div class="col">
          <svg width="520" height="360" viewBox="0 0 520 360">
            <defs><marker id="ah1" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="22" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2563eb"/></marker></defs>
            <line x1="40" y1="320" x2="500" y2="320" stroke="#9ca3af" stroke-width="2"/>
            <line x1="40" y1="320" x2="40" y2="20" stroke="#9ca3af" stroke-width="2"/>
            <line x1="40" y1="320" x2="370" y2="100" stroke="#2563eb" stroke-width="6" marker-end="url(#ah1)"/>
            <line x1="380" y1="320" x2="380" y2="100" stroke="#9ca3af" stroke-dasharray="8 8" stroke-width="2"/>
            <line x1="40" y1="100" x2="380" y2="100" stroke="#9ca3af" stroke-dasharray="8 8" stroke-width="2"/>
            <text x="200" y="350" font-size="28" fill="#374151">đi ngang 3</text>
            <text x="395" y="220" font-size="28" fill="#374151">lên 2</text>
            <text x="110" y="170" font-size="34" fill="#2563eb" font-weight="700">(3, 2)</text>
          </svg></div>
          <div class="col"><p>Vector 2 số = <b>một mũi tên</b> từ gốc toạ độ.</p>
          <p class="note">Có hướng và có độ dài. Đó là lý do ta nói “cùng hướng”, “vuông góc”.</p></div></div>
        say: "Vì sao gọi là vector mà không gọi là danh sách? Với hai con số, ví dụ 3 và 2, ta vẽ được một mũi tên. Xuất phát từ gốc, đi ngang 3 ô, rồi đi lên 2 ô. Mũi tên có hướng và có độ dài, nên ta mới nói được hai vector cùng hướng hay vuông góc nhau."
      - clear: true
        show: |
          $$\mathbf{y} \in \mathbb{R}^3$$
          <ul><li>$\mathbb{R}$: tập <b>tất cả số thực</b> (số nguyên, phân số, số thập phân, số âm…)</li>
          <li>$\mathbb{R}^3$: tập tất cả danh sách gồm <b>3</b> số thực</li>
          <li>$\in$: đọc là <b>“thuộc”</b></li></ul>
        introduces: [reals, in]
        focus: [1, "2.1", "2.2", "2.3", 1]
        say: "Tiếp theo là dòng ký hiệu này. Chữ R có nét kép là tập hợp tất cả số thực. R mũ 3 là tập hợp mọi danh sách gồm đúng 3 số thực. Còn ký hiệu giống chữ e cong ở giữa đọc là thuộc. Cả dòng đọc là y thuộc R mũ 3, nghĩa là y là một danh sách 3 số thực."
      - show: |
          $$\mathbf{x} = \begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_D \end{bmatrix} \in \mathbb{R}^D$$
          <p class="note">Dấu “⋮” hay “…” = cứ thế tiếp tục. $D$ = số chiều = số con số trong danh sách. Ảnh 28×28 điểm ảnh có $D = 784$.</p>
        introduces: [dots]
        focus: [1, 1, 2, 2, 2]
        say: "Trong sách, bạn sẽ thường gặp dạng tổng quát. Vector x gồm x một, x hai, các dấu chấm, cho tới x D. Dấu ba chấm nghĩa là cứ thế tiếp tục. D là số chiều, tức là có bao nhiêu con số trong danh sách. Một ảnh đen trắng 28 nhân 28 điểm ảnh chính là một vector 784 chiều."

  # ───────────────────────── 4. CHUYỂN VỊ ─────────────────────────
  - id: sym_T
    kind: symbol
    title: "Giải mã ký hiệu: chữ T nhỏ — phép chuyển vị"
    steps:
      - show: |
          $$\mathbf{y} = \begin{bmatrix} 6 \\ 2 \\ 4 \end{bmatrix} \quad\xrightarrow{\ \text{chuyển vị}\ }\quad \mathbf{y}^T = \begin{bmatrix} 6 & 2 & 4 \end{bmatrix}$$
        introduces: [transpose]
        say: "Chữ T nhỏ đặt phía trên bên phải gọi là chuyển vị. Nó chỉ làm một việc, xoay vector cột nằm dọc thành vector hàng nằm ngang. Các con số giữ nguyên, thứ tự giữ nguyên."
      - show: |
          <div class="box key">Ghi nhớ: $\mathbf{y}$ là <b>cột</b> (dọc), $\mathbf{y}^T$ là <b>hàng</b> (ngang).
          <br>Lát nữa: <b>hàng nhân cột</b> ra <b>một con số</b>.</div>
        say: "Đọc là y chuyển vị. Tại sao cần xoay? Vì lát nữa ta sẽ đặt một hàng nhân với một cột, và phép hàng nhân cột cho ra đúng một con số. Đó chính là tích vô hướng."
      - show: |
          <p>Viết gọn trên một dòng: $\ \mathbf{y} = (6, 2, 4)^T$</p>
          <p class="note">Đọc: “y là vector cột 6, 2, 4”. Chữ $T$ nhắc rằng thực chất đây là <b>cột</b>, chỉ viết ngang cho đỡ tốn chỗ. Từ đây bài viết vector theo cách này.</p>
        focus: [1, 2, 2]
        say: "Viết cột thì tốn chỗ, nên sách hay viết vector nằm ngang trong ngoặc tròn, rồi thêm chữ T ở cuối. Chữ T nhắc rằng thực chất đây là một cột, chỉ là viết ngang cho gọn. Từ đây trở đi, bài này viết vector theo đúng cách đó."

  # ───────────────────────── 5. PHÉP TOÁN VECTOR ─────────────────────────
  - id: ops
    kind: concept
    title: "Nhân vector với một số, cộng và trừ vector"
    checks:
      - "2*Matrix([1,2,0]) == Matrix([2,4,0])"
      - "-1*Matrix([2,1]) == Matrix([-2,-1]) and 2*Matrix([2,1]) == Matrix([4,2])"
      - "Matrix([2,1]) + Matrix([-1,2]) == Matrix([1,3])"
      - "Matrix([1,3]) - Matrix([2,1]) == Matrix([-1,2])"
    steps:
      - show: |
          <p><b>Nhân với một số</b> = nhân con số đó vào <b>từng</b> thành phần:</p>
          $$2\,(1, 2, 0)^T = (2\cdot 1,\ 2\cdot 2,\ 2\cdot 0)^T = (2, 4, 0)^T$$
        focus: [0, 1, 1, 2]
        say: "Trước khi học tích vô hướng, ta cần ba phép tính với vector. Thứ nhất, nhân vector với một con số. Cách làm là nhân con số đó vào từng thành phần. Hai nhân vector 1, 2, 0 được vector 2, 4, 0."
      - show: |
          <div class="row"><div class="col">
          <svg width="560" height="300" viewBox="0 0 560 300">
            <defs>
              <marker id="oB" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#2563eb"/></marker>
              <marker id="oG" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#059669"/></marker>
              <marker id="oR" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#e11d48"/></marker>
            </defs>
            <line x1="60" y1="270" x2="540" y2="30" stroke="#cbd5e1" stroke-width="3"/>
            <line x1="260" y1="170" x2="460" y2="70" stroke="#059669" stroke-width="10" marker-end="url(#oG)"/>
            <line x1="260" y1="170" x2="360" y2="120" stroke="#2563eb" stroke-width="5" marker-end="url(#oB)"/>
            <line x1="260" y1="170" x2="160" y2="220" stroke="#e11d48" stroke-width="5" marker-end="url(#oR)"/>
            <circle cx="260" cy="170" r="6" fill="#111827"/>
            <text x="330" y="160" font-size="28" fill="#2563eb" font-weight="700">u</text>
            <text x="440" y="120" font-size="28" fill="#059669" font-weight="700">2u</text>
            <text x="140" y="260" font-size="28" fill="#e11d48" font-weight="700">−u</text>
          </svg></div>
          <div class="col"><p>$c = 2$: dài gấp đôi; &nbsp; $c = -1$: <b>quay ngược</b></p>
          <div class="box key">Mọi vector nằm trên đường thẳng chứa $\mathbf{u}$ đều viết được là $c\,\mathbf{u}$.</div></div></div>
        say: "Về hình ảnh, nhân với một số chỉ kéo dài, thu ngắn, hoặc quay ngược mũi tên. Nhân 2 thì dài gấp đôi, nhân âm 1 thì quay ngược lại. Nhưng mũi tên luôn nằm trên cùng một đường thẳng. Ngược lại, mọi vector nằm trên đường thẳng chứa u đều viết được là c nhân u, với c là một con số nào đó. Hãy nhớ câu này, lát nữa ta dùng ngay."
      - clear: true
        show: |
          <div class="row"><div class="col">
          <svg width="460" height="360" viewBox="0 0 360 360">
            <defs>
              <marker id="pB" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#2563eb"/></marker>
              <marker id="pG" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#6b7280"/></marker>
              <marker id="pR" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#e11d48"/></marker>
            </defs>
            <line x1="80" y1="320" x2="200" y2="260" stroke="#2563eb" stroke-width="5" marker-end="url(#pB)"/>
            <line x1="200" y1="260" x2="140" y2="140" stroke="#6b7280" stroke-width="5" marker-end="url(#pG)"/>
            <line x1="80" y1="320" x2="140" y2="140" stroke="#e11d48" stroke-width="5" marker-end="url(#pR)"/>
            <text x="150" y="320" font-size="26" fill="#2563eb" font-weight="700">a = (2, 1)ᵀ</text>
            <text x="190" y="190" font-size="26" fill="#6b7280" font-weight="700">b = (−1, 2)ᵀ</text>
            <text x="20" y="130" font-size="26" fill="#e11d48" font-weight="700">a + b = (1, 3)ᵀ</text>
          </svg></div>
          <div class="col"><p><b>Cộng</b> = cộng từng vị trí:</p>
          $$(2, 1)^T + (-1, 2)^T = (2 - 1,\ 1 + 2)^T = (1, 3)^T$$
          <p class="note">Hình: đi theo $\mathbf{a}$, rồi đi tiếp $\mathbf{b}$ (nối đuôi) → tới đầu $\mathbf{a}+\mathbf{b}$.</p></div></div>
        say: "Thứ hai, cộng hai vector. Cách làm là cộng từng vị trí. 2 cộng âm 1 bằng 1, 1 cộng 2 bằng 3, được vector 1, 3. Về hình ảnh, ta đi theo mũi tên a, rồi từ đầu mũi tên a đi tiếp theo mũi tên b. Điểm đến cuối cùng chính là đầu của a cộng b."
      - show: |
          <p><b>Trừ</b> = trừ từng vị trí. &nbsp; Nếu $\ \mathbf{a} + \mathbf{b} = \mathbf{y}\ $ thì $\ \mathbf{b} = \mathbf{y} - \mathbf{a}$:</p>
          $$(1, 3)^T - (2, 1)^T = (1 - 2,\ 3 - 1)^T = (-1, 2)^T = \mathbf{b}\ \checkmark$$
        focus: [1, 1, 1, 2, 1]
        say: "Thứ ba, trừ hai vector, cũng làm từng vị trí. Và quy tắc chuyển vế quen thuộc vẫn đúng với vector. Nếu a cộng b bằng y, thì b bằng y trừ a. Thử với số, 1, 3 trừ 2, 1 được âm 1, 2, đúng bằng b. Quy tắc chuyển vế này là chìa khoá để hiểu công thức phép chiếu."

  # ───────────────────────── 6. DẤU TỔNG ─────────────────────────
  - id: sym_sum
    kind: symbol
    title: "Giải mã ký hiệu: dấu tổng Σ — “máy cộng dồn”"
    checks:
      - "sum(i for i in range(1, 4)) == 6"
      - "sum(v**2 for v in [6,2,4]) == 56"
    steps:
      - show: |
          $$\sum_{i=1}^{3} i \;=\; \underbrace{1}_{i=1} + \underbrace{2}_{i=2} + \underbrace{3}_{i=3} \;=\; 6$$
        introduces: [sum]
        say: "Ký hiệu chữ Sigma hoa này làm nhiều bạn sợ nhất, nhưng nó chỉ là một cái máy cộng dồn. Đọc là tổng, khi i chạy từ 1 đến 3, của i. Ta lần lượt thay i bằng 1, rồi 2, rồi 3, và cộng tất cả lại, được 6."
      - show: |
          <table class="t"><tr><th>Vị trí</th><th>Ý nghĩa</th></tr>
          <tr><td>dưới: $i=1$</td><td>biến đếm bắt đầu từ 1</td></tr>
          <tr><td>trên: $3$</td><td>dừng ở 3</td></tr>
          <tr><td>bên phải</td><td>thứ cần cộng, viết theo $i$</td></tr></table>
        say: "Cách đọc một dấu tổng luôn gồm ba chỗ. Phía dưới cho biết biến đếm bắt đầu từ đâu. Phía trên cho biết dừng ở đâu. Bên phải là thứ cần cộng, viết theo biến đếm i."
      - show: |
          $$\sum_{i=1}^{3} y_i^2 = 6^2 + 2^2 + 4^2 = 36 + 4 + 16 = 56$$
          <p class="note">$y_i^2$ nghĩa là $(y_i)^2$: lấy thành phần thứ $i$ rồi bình phương.</p>
        focus: [1, 2, 1, 1]
        say: "Thử với vector y bằng 6, 2, 4. Ở bên phải là y i bình phương, nghĩa là lấy thành phần thứ i rồi bình phương nó. Cộng dồn lại, 6 bình phương cộng 2 bình phương cộng 4 bình phương, tức là 36 cộng 4 cộng 16, bằng 56. Con số 56 này lát nữa ta sẽ dùng lại."

  # ───────────────────────── 7. TÍCH VÔ HƯỚNG ─────────────────────────
  - id: dot
    kind: concept
    title: "Tích vô hướng (dot product): nhân từng cặp rồi cộng"
    checks:
      - "Matrix([1,2]).dot(Matrix([3,4])) == 11"
      - "Matrix([1,2]).dot(Matrix([2,-1])) == 0"
      - "Matrix([1,2]).dot(Matrix([-1,-2])) == -5"
      - "(Matrix([1,2]).T * Matrix([3,4])).shape == (1, 1)"
      - "sp.acos(Matrix([1,2]).dot(Matrix([3,4]))/(Matrix([1,2]).norm()*Matrix([3,4]).norm())) < sp.pi/2"
      - "sp.acos(Matrix([1,2]).dot(Matrix([-1,-2]))/(Matrix([1,2]).norm()*Matrix([-1,-2]).norm())) > sp.pi/2"
    steps:
      - show: |
          $$\mathbf{u}^T\mathbf{v} = \sum_{i=1}^{D} u_i\, v_i = u_1 v_1 + u_2 v_2 + \dots + u_D v_D$$
          <p class="note">Hai số viết sát nhau như $u_1 v_1$ nghĩa là <b>nhân</b> với nhau.</p>
        focus: [1, 1, 2, 1]
        say: "Bây giờ ta ghép các ký hiệu lại. u chuyển vị nhân v bằng tổng của u i nhân v i. Hai chữ viết sát nhau, không có dấu gì ở giữa, nghĩa là nhân với nhau. Nói bằng lời, lấy hai vector cùng số chiều, nhân từng cặp số ở cùng vị trí, rồi cộng tất cả lại."
      - show: |
          $$\begin{bmatrix} \hlb{1} & \hlo{2} \end{bmatrix} \begin{bmatrix} \hlb{3} \\ \hlo{4} \end{bmatrix} = \hlb{1\cdot 3} + \hlo{2 \cdot 4} = 3 + 8 = \hl{11}$$
        say: "Ví dụ u bằng 1, 2 và v bằng 3, 4. Một nhân ba bằng 3. Hai nhân bốn bằng 8. Cộng lại được 11. Hãy để ý, kết quả là một con số duy nhất, không phải một vector. Vì vậy mới gọi là tích vô hướng."
      - clear: true
        show: |
          <table class="t"><tr><th>Dấu của $\mathbf{u}^T\mathbf{v}$</th><th>Góc giữa hai vector</th><th>Ví dụ với $\mathbf{u}=(1,2)^T$</th></tr>
          <tr><td class="green">dương</td><td>góc nhọn (nhỏ hơn 90°)</td><td>$\mathbf{v}=(3,4)^T$: $\;3 + 8 = 11$</td></tr>
          <tr><td class="blue">bằng 0</td><td><b>vuông góc</b> (đúng 90°), ký hiệu $\mathbf{u}\perp\mathbf{v}$</td><td>$\mathbf{v}=(2,-1)^T$: $\;2-2=0$</td></tr>
          <tr><td class="red">âm</td><td>góc tù (lớn hơn 90°)</td><td>$\mathbf{v}=(-1,-2)^T$: $\;-1-4=-5$</td></tr></table>
          <p class="note">Áp dụng cho hai vector khác vector không (vector toàn số 0).</p>
        introduces: [perp]
        focus: ["1.1", "1.2", "1.4", "1.3", "1.3", 2]
        say: "Con số đó cho ta biết gì về góc giữa hai mũi tên? Nếu tích vô hướng dương, góc giữa chúng nhọn, nhỏ hơn 90 độ. Nếu nó âm, góc tù, lớn hơn 90 độ. Còn nếu nó bằng đúng 0, hai vector vuông góc với nhau. Ký hiệu vuông góc trông như chữ T lộn ngược. Ba nhận xét này dành cho hai vector khác vector không, tức là không phải toàn số 0."
      - show: |
          <div class="box ok">Quy tắc vàng của cả bài: &nbsp; $\mathbf{z} \perp \mathbf{u} \iff \mathbf{z}^T\mathbf{u} = 0$</div>
        introduces: [iff]
        say: "Hãy ghi nhớ quy tắc vàng này. z vuông góc với u khi và chỉ khi z chuyển vị nhân u bằng 0. Mũi tên hai chiều đọc là khi và chỉ khi, nghĩa là hai điều này luôn đi cùng nhau. Toàn bộ phần sau của bài được xây từ quy tắc này."

  # ───────────────────────── 8. ĐỘ DÀI ─────────────────────────
  - id: norm
    kind: concept
    title: "Độ dài vector: định lý Pytago"
    checks:
      - "Matrix([3,4]).norm() == 5"
      - "Matrix([1,2,0]).norm() == sqrt(5) and Matrix([1,2,0]).norm()**2 == 5"
      - "Matrix([1,2,0]).dot(Matrix([1,2,0])) == Matrix([1,2,0]).norm()**2"
    steps:
      - show: |
          $$\|\mathbf{x}\| = \sqrt{\sum_{i=1}^{D} x_i^2}$$
          <p>Ví dụ: $\ \|(3, 4)^T\| = \sqrt{3^2 + 4^2} = \sqrt{25} = 5$</p>
        introduces: [norm]
        focus: [1, 1, 1, 2]
        say: "Hai vạch đứng kép bao quanh x là độ dài của vector x. Công thức là căn của tổng các bình phương. Đây chính là định lý Pytago. Mũi tên đi ngang 3, đi lên 4 thì dài căn của 9 cộng 16, bằng căn 25, bằng 5."
      - show: |
          <div class="box key">Trong sách bạn sẽ gặp: $\ \|\mathbf{x}\|_2\ $ — chỉ số <b>2 ở dưới</b> = “chuẩn L2”, tức đúng loại độ dài này.
          <br>Bài này chỉ dùng loại này, nên viết gọn: $\ \|\mathbf{x}\|_2 = \|\mathbf{x}\|$.</div>
        notation_note: true
        say: "Ở nhiều sách, bạn sẽ thấy thêm một số 2 nhỏ ở dưới, góc phải của hai vạch kép. Số 2 ở dưới đó chỉ là tên gọi, nghĩa là chuẩn L2, tức loại độ dài dùng bình phương như ta vừa tính. Bài này chỉ dùng đúng loại này, nên mình bỏ số 2 ở dưới đi cho gọn."
      - clear: true
        show: |
          <p><b>Mũ 2 ở trên</b> = bình phương độ dài: $\ \|\mathbf{u}\|^2 = \|\mathbf{u}\| \cdot \|\mathbf{u}\|$</p>
          <div class="box key">Mẹo then chốt: &nbsp; $\|\mathbf{u}\|^2 = \mathbf{u}^T\mathbf{u}$
          <br><span class="note">Vì bình phương “xoá” dấu căn: độ dài bình phương = tổng các bình phương = $\mathbf{u}$ nhân vô hướng với chính nó.</span></div>
        focus: [1, 2, "2.1", "2.2"]
        say: "Còn số 2 nhỏ ở phía trên là mũ hai, nghĩa là bình phương độ dài. Và đây là mẹo then chốt. Độ dài bình phương của u đúng bằng u chuyển vị nhân u. Lý do là bình phương xoá mất dấu căn, chỉ còn tổng các bình phương, mà đó chính là u nhân vô hướng với chính nó."
      - show: |
          <p>Với $\mathbf{u} = (1, 2, 0)^T$: &nbsp; $\|\mathbf{u}\| = \sqrt{1 + 4 + 0} = \sqrt{5}$, &nbsp; $\|\mathbf{u}\|^2 = 5 = \mathbf{u}^T\mathbf{u}\ \checkmark$</p>
        say: "Thử với u bằng 1, 2, 0. Độ dài của u là căn 5. Độ dài bình phương là 5. Và u chuyển vị nhân u bằng 1 cộng 4 cộng 0, cũng bằng 5, đúng như mẹo vừa nói."

  # ───────────────────────── 9. TRỰC GIÁC PHÉP CHIẾU ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phép chiếu = cái bóng lúc giữa trưa"
    checks:
      - "Matrix([1,3]).dot(Matrix([4,2])) == 10 and Matrix([4,2]).dot(Matrix([4,2])) == 20"
      - "Rational(10,20)*Matrix([4,2]) == Matrix([2,1])"
      - "(Matrix([1,3]) - Matrix([2,1])).dot(Matrix([4,2])) == 0"
      - "Matrix([2,1]) + Matrix([-1,2]) == Matrix([1,3])"
    steps:
      - show: |
          <div class="row"><div class="col">
          <svg width="575" height="470" viewBox="0 0 440 360">
            <defs>
              <marker id="aB" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#2563eb"/></marker>
              <marker id="aR" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#e11d48"/></marker>
              <marker id="aG" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#059669"/></marker>
            </defs>
            <line x1="50" y1="335" x2="410" y2="155" stroke="#cbd5e1" stroke-width="3"/>
            <line x1="80" y1="320" x2="320" y2="200" stroke="#2563eb" stroke-width="5" marker-end="url(#aB)"/>
            <line x1="80" y1="320" x2="140" y2="140" stroke="#e11d48" stroke-width="5" marker-end="url(#aR)"/>
            <line x1="80" y1="320" x2="200" y2="260" stroke="#059669" stroke-width="7" marker-end="url(#aG)"/>
            <line x1="200" y1="260" x2="140" y2="140" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/>
            <polyline points="216.1,251.95 208.05,235.85 191.95,243.9" fill="none" stroke="#6b7280" stroke-width="2.5"/>
            <text x="300" y="185" font-size="30" fill="#2563eb" font-weight="700">u</text>
            <text x="92" y="150" font-size="30" fill="#e11d48" font-weight="700">y</text>
            <text x="120" y="320" font-size="26" fill="#059669" font-weight="700">bóng</text>
            <text x="180" y="190" font-size="30" fill="#6b7280" font-weight="700">z</text>
          </svg></div>
          <div class="col"><p><b class="red">y</b>: vector cần chiếu</p><p><b class="blue">u</b>: hướng của “mặt đất”</p>
          <p><b class="green">bóng</b>: phần của y nằm theo hướng u</p><p><b>z</b>: phần còn lại, <b>vuông góc</b> với u</p></div></div>
        say: "Giờ đến ý chính của bài. Tưởng tượng giữa trưa, mặt trời chiếu thẳng từ trên xuống. Cây gậy y màu đỏ in một cái bóng xuống mặt đất, mặt đất chạy theo hướng u màu xanh. Cái bóng màu lục chính là hình chiếu của y lên u."
      - show: |
          <div class="box key">$$\mathbf{y} \;=\; \underbrace{\text{bóng}}_{\text{nằm trên đường } \mathbf{u}} \;+\; \underbrace{\mathbf{z}}_{\perp\ \mathbf{u}}$$
          Trong hình: $\ (2, 1)^T + (-1, 2)^T = (1, 3)^T = \mathbf{y}\ \checkmark$</div>
        say: "Nhìn hình, vector y được tách làm hai mảnh nối đuôi nhau. Đi theo cái bóng, rồi đi tiếp đoạn nét đứt z, ta tới đúng đầu của y. Đó chính là phép cộng vector vừa học, y bằng bóng cộng z. Với số trong hình, bóng là 2, 1, z là âm 1, 2, cộng lại được 1, 3, đúng bằng y."
      - clear: true
        show: |
          <p>Cái bóng là điểm trên đường thẳng $\mathbf{u}$ <b>gần $\mathbf{y}$ nhất</b> (đường vuông góc là đường ngắn nhất).</p>
          <p class="note">Vì sao AI quan tâm? “Gần nhất” = <b>sai số nhỏ nhất</b>. Về sau, nhiều thuật toán AI — như dự đoán giá nhà, hay nén dữ liệu — đều quy về việc tìm cái bóng gần nhất.</p>
        focus: [1, 2, 2, 2]
        say: "Cái bóng còn là điểm trên đường thẳng u gần y nhất, vì từ một điểm tới một đường thẳng, đường vuông góc là đường ngắn nhất. Vì sao AI quan tâm? Vì gần nhất nghĩa là sai số nhỏ nhất. Về sau, nhiều thuật toán AI, như dự đoán giá nhà hay nén dữ liệu, về bản chất đều là đi tìm cái bóng gần nhất."

  # ───────────────────────── 10. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Tự suy ra công thức — từng bước có lý do"
    checks:
      - "(lambda c, y, u: sp.solve(sp.Eq(((y - c*u).T*u)[0], 0), c) == [2])(sp.Symbol('c'), Matrix([6,2,4]), Matrix([1,2,0]))"
      - "(lambda c: sp.expand(((Matrix([6,2,4]) - c*Matrix([1,2,0])).T*Matrix([1,2,0]))[0]) == 10 - 5*c)(sp.Symbol('c'))"
      - "(lambda c: sp.expand(Matrix([6,2,4]).dot(Matrix([1,2,0])) - c*Matrix([1,2,0]).dot(Matrix([1,2,0]))) == 10 - 5*c)(sp.Symbol('c'))"
      - "(lambda c: Matrix([6,2,4]) - c*Matrix([1,2,0]) == Matrix([6-c, 2-2*c, 4]))(sp.Symbol('c'))"
      - "Rational(Matrix([6,2,4]).dot(Matrix([2,4,0])), Matrix([2,4,0]).dot(Matrix([2,4,0])))*Matrix([2,4,0]) == Matrix([2,4,0])"
    steps:
      - show: |
          <p><b>Bước 1.</b> Bóng nằm trên đường thẳng chứa $\mathbf{u}$, nên bóng $= \hlo{c}\,\mathbf{u}$ với một con số $\hlo{c}$ chưa biết.</p>
        say: "Bây giờ ta tự suy ra công thức, bước nào cũng có lý do. Bước một, cái bóng nằm trên đường thẳng chứa u. Nhớ lại câu đã học, mọi vector trên đường thẳng đó đều viết được là c nhân u. Nên bóng bằng c nhân u, với c là con số ta đang đi tìm."
      - show: |
          <p><b>Bước 2.</b> Hai mảnh nối đuôi: $\ \mathbf{y} = \hlo{c}\,\mathbf{u} + \mathbf{z} \implies$ chuyển vế: $\ \mathbf{z} = \mathbf{y} - \hlo{c}\,\mathbf{u}$</p>
        introduces: [implies]
        say: "Bước hai, theo hình, y bằng cái bóng cộng z, tức là y bằng c nhân u cộng z. Chuyển c nhân u sang vế bên kia, giống hệt chuyển vế với số, ta được z bằng y trừ c nhân u. Đây chính là lý do của công thức z bằng y trừ c u. Mũi tên kép ở giữa đọc là suy ra."
      - show: |
          <p><b>Bước 3.</b> Quy tắc vàng: $$\mathbf{z}\perp\mathbf{u} \implies \mathbf{z}^T\mathbf{u} = 0 \implies (\mathbf{y} - \hlo{c}\,\mathbf{u})^T\mathbf{u} = 0$$</p>
        say: "Bước ba, theo quy tắc vàng, z vuông góc với u nên z chuyển vị nhân u bằng 0. Thay z bằng y trừ c u vừa tìm ở bước hai, ta được một phương trình chỉ còn một ẩn là c."
      - clear: true
        show: |
          <p><b>Bước 4.</b> Phá ngoặc — tích vô hướng tách được như phép nhân số:</p>
          <div class="box key">$(\mathbf{a} - \mathbf{b})^T\mathbf{u} = \mathbf{a}^T\mathbf{u} - \mathbf{b}^T\mathbf{u}$ &nbsp;&nbsp;và&nbsp;&nbsp; $(\hlo{c}\,\mathbf{u})^T\mathbf{u} = \hlo{c}\,(\mathbf{u}^T\mathbf{u})$</div>
          $$\mathbf{y}^T\mathbf{u} - \hlo{c}\,\mathbf{u}^T\mathbf{u} = 0$$
        focus: [1, "2.1", "2.2", 3]
        say: "Bước bốn là phá dấu ngoặc. Vì tích vô hướng chỉ là nhân từng cặp rồi cộng, nên nó tách được qua dấu trừ, giống như phân phối với số. Còn con số c nhân vào mọi thành phần, nên đưa được ra ngoài. Kết quả là y chuyển vị nhân u, trừ c nhân u chuyển vị nhân u, bằng 0."
      - show: |
          <p><b>Bước 5.</b> Chuyển vế rồi chia: $\ \hlo{c}\,\mathbf{u}^T\mathbf{u} = \mathbf{y}^T\mathbf{u} \implies \hlo{c} = \dfrac{\mathbf{y}^T\mathbf{u}}{\mathbf{u}^T\mathbf{u}}$ &nbsp; (cần $\mathbf{u} \neq \mathbf{0}$)</p>
        introduces: [zero_vec]
        say: "Bước năm, chuyển vế, rồi chia hai vế cho u chuyển vị nhân u. Phép chia này được phép vì u khác vector không, tức là u không phải toàn số 0, nên u chuyển vị nhân u lớn hơn 0. Ta có c bằng y chuyển vị nhân u, chia cho u chuyển vị nhân u."
      - clear: true
        show: |
          <p><b>Làm thử ngay bằng số:</b> $\ \mathbf{y} = (6, 2, 4)^T,\ \mathbf{u} = (1, 2, 0)^T$</p>
          <p>$\mathbf{z} = \mathbf{y} - \hlo{c}\,\mathbf{u} = (6 - \hlo{c},\ 2 - 2\hlo{c},\ 4)^T$</p>
          <p>$\mathbf{z}^T\mathbf{u} = (6 - \hlo{c})\cdot 1 + (2 - 2\hlo{c})\cdot 2 + 4 \cdot 0 = 10 - 5\hlo{c}$</p>
          <p>$10 - 5\hlo{c} = 0 \implies \hlo{c} = 2$ &nbsp;&nbsp; <span class="green">Công thức: $\ \dfrac{10}{5} = 2\ \checkmark$ — hai cách khớp nhau</span></p>
        focus: ["1.2", 2, 3, "4.1", "4.2", "4.2"]
        say: "Để thấy rõ hơn, mình làm thử ngay bằng số, với y bằng 6, 2, 4 và u bằng 1, 2, 0. Theo bước hai, z bằng y trừ c u, tức là 6 trừ c, 2 trừ 2c, và 4. Nhân vô hướng z với u, ta được 10 trừ 5c. Cho bằng 0 theo quy tắc vàng, suy ra c bằng 2. Dùng công thức vừa suy ra, 10 chia 5 cũng bằng 2. Như vậy, hai cách cho cùng một kết quả."
      - clear: true
        show: |
          $$\proj_{\mathbf{u}}\mathbf{y} = \hlo{c}\,\mathbf{u} = \frac{\hlb{\mathbf{y}^T\mathbf{u}}}{\hl{\mathbf{u}^T\mathbf{u}}}\,\mathbf{u} = \frac{\hlb{\mathbf{y}^T\mathbf{u}}}{\hl{\|\mathbf{u}\|^2}}\,\mathbf{u}$$
          <p class="note">Đọc: “hình chiếu của y lên u”. Vector nhỏ <b>dưới chân chữ proj</b> là “mặt đất” được chiếu lên.</p>
        introduces: [proj]
        focus: [1, 1, 2, 1, 1]
        say: "Ghép lại, ta có công thức hình chiếu của y lên u. Chữ proj là viết tắt của projection, nghĩa là phép chiếu. Chữ u nhỏ dưới chân nó cho biết ta chiếu lên u. Hình chiếu bằng c nhân u, với c là phân số y chuyển vị nhân u, trên u chuyển vị nhân u. Theo mẹo then chốt, mẫu số cũng chính là độ dài của u bình phương."
      - show: |
          <ul><li><span class="blue">Tử số</span>: y đi theo hướng u “bao nhiêu”</li>
          <li><span class="red">Mẫu số</span>: chia lại để kết quả <b>không phụ thuộc</b> u dài hay ngắn.</li></ul>
          <p>Thử chiếu lên $2\mathbf{u} = (2, 4, 0)^T$: $\ \hlo{c} = \dfrac{20}{20} = 1$, bóng $= 1 \cdot (2, 4, 0)^T$ — y hệt.</p>
        focus: [0, "1.1", "1.2", 2, 2]
        say: "Ý nghĩa từng phần. Tử số đo xem y đi theo hướng u nhiều hay ít. Mẫu số chia lại để kết quả không phụ thuộc vào việc ta chọn u dài hay ngắn. Thử chiếu lên vector dài gấp đôi, 2u, bằng 2, 4, 0. Khi đó c bằng 20 chia 20 bằng 1, và cái bóng vẫn là 2, 4, 0, y hệt như trước."

  # ───────────────────────── 11. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ từng bước: chiếu y = (6, 2, 4)ᵀ lên u = (1, 2, 0)ᵀ"
    checks:
      - "Matrix([6,2,4]).dot(Matrix([1,2,0])) == 10"
      - "Matrix([1,2,0]).dot(Matrix([1,2,0])) == 5"
      - "Rational(10,5)*Matrix([1,2,0]) == Matrix([2,4,0])"
      - "Matrix([6,2,4]) - Matrix([2,4,0]) == Matrix([4,-2,4])"
    steps:
      - show: |
          <p>Đề: $\ \mathbf{y} = (6, 2, 4)^T,\ \ \mathbf{u} = (1, 2, 0)^T$. Tìm $\proj_{\mathbf{u}}\mathbf{y}$ và $\mathbf{z}$.</p>
        say: "Giờ làm trọn ví dụ chính của bài theo đúng quy trình chuẩn. y bằng 6, 2, 4. u bằng 1, 2, 0. Tìm hình chiếu của y lên u, và phần còn lại z. Ta đi đúng bốn bước, mỗi bước một phép tính nhỏ."
      - show: |
          <p><b>①</b> Tử số: $$\mathbf{y}^T\mathbf{u} = 6\cdot 1 + 2\cdot 2 + 4\cdot 0 = 6 + 4 + 0 = \hlb{10}$$</p>
        say: "Bước một, tính tử số. Nhân từng cặp rồi cộng. 6 nhân 1 bằng 6. 2 nhân 2 bằng 4. 4 nhân 0 bằng 0. Cộng lại được 10."
      - show: |
          <p><b>②</b> Mẫu số: $\ \mathbf{u}^T\mathbf{u} = 1^2 + 2^2 + 0^2 = \hl{5}$</p>
        say: "Bước hai, tính mẫu số. u chuyển vị nhân u bằng 1 bình phương cộng 2 bình phương cộng 0 bình phương, bằng 5."
      - show: |
          <p><b>③</b> Hệ số: $\ \hlo{c} = \dfrac{\hlb{10}}{\hl{5}} = \hlo{2}$</p>
        say: "Bước ba, hệ số c bằng 10 chia 5, bằng 2."
      - show: |
          <p><b>④</b> Hình chiếu: $$\proj_{\mathbf{u}}\mathbf{y} = \hlo{2}\,(1, 2, 0)^T = \hlg{(2, 4, 0)^T}$$</p>
        say: "Bước bốn, nhân 2 vào từng thành phần của u, đúng như phép nhân vector với một số. 2 nhân 1, 2 nhân 2, 2 nhân 0. Hình chiếu là vector 2, 4, 0."
      - show: |
          <p>Phần còn lại: $\ \mathbf{z} = \mathbf{y} - \proj_{\mathbf{u}}\mathbf{y} = (6-2,\ 2-4,\ 4-0)^T = (4, -2, 4)^T$</p>
        say: "Cuối cùng tính phần còn lại z, bằng y trừ hình chiếu, trừ từng vị trí. 6 trừ 2 bằng 4. 2 trừ 4 bằng âm 2. 4 trừ 0 bằng 4. Vậy z bằng 4, âm 2, 4."

  # ───────────────────────── 12. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Hai phép thử để tự biết mình làm đúng"
    checks:
      - "Matrix([4,-2,4]).dot(Matrix([1,2,0])) == 0"
      - "Matrix([6,2,4]).dot(Matrix([6,2,4])) == 56"
      - "Matrix([2,4,0]).dot(Matrix([2,4,0])) == 20 and Matrix([4,-2,4]).dot(Matrix([4,-2,4])) == 36"
      - "(lambda a, b: (a + b).dot(a + b) == a.dot(a) + b.dot(b) + 2 * a.dot(b))(Matrix([2,4,0]), Matrix([4,-2,4]))"
    steps:
      - show: |
          <p><b>Phép thử 1 — vuông góc:</b></p>
          $$\mathbf{z}^T\mathbf{u} = 4\cdot 1 + (-2)\cdot 2 + 4\cdot 0 = 4 - 4 + 0 = \hlg{0}\ \checkmark$$
        focus: [0, 1, 2, 2, 2, 2, 2, 2]
        say: "Một người học giỏi không đợi thầy chấm, mà tự kiểm tra. Phép thử một. Theo quy tắc vàng, z phải vuông góc với u, nên z chuyển vị nhân u phải bằng 0. 4 nhân 1 bằng 4. Âm 2 nhân 2 bằng âm 4. 4 nhân 0 bằng 0. Tổng bằng 0. Đúng là vuông góc."
      - show: |
          <p><b>Phép thử 2 — Pytago:</b> $\ \|\mathbf{y}\|^2 = \|\proj_{\mathbf{u}}\mathbf{y}\|^2 + \|\mathbf{z}\|^2$</p>
          $$56 = (4 + 16 + 0) + (16 + 4 + 16) = 20 + 36\ \checkmark$$
          <p class="note">Đây cũng là lý do của quy tắc vàng: $\|\mathbf{a}+\mathbf{b}\|^2 = \|\mathbf{a}\|^2 + \|\mathbf{b}\|^2 + 2\,\mathbf{a}^T\mathbf{b}$, nên Pytago đúng khi và chỉ khi $\mathbf{a}^T\mathbf{b} = 0$.</p>
        focus: [1, 2, 2, 2, 2, 3]
        say: "Phép thử hai dùng Pytago, vì bóng và z vuông góc nên cùng với y tạo thành một tam giác vuông. Độ dài bình phương của y là 56, con số ta đã tính ở phần dấu tổng. Bóng có độ dài bình phương 20, z có độ dài bình phương 36. 20 cộng 36 bằng 56. Khớp hoàn toàn. Đây cũng là lý do của quy tắc vàng, vì độ dài bình phương của tổng hai vector luôn có thêm hai lần tích vô hướng, nên Pytago chỉ đúng khi tích vô hướng bằng 0."

  # ───────────────────────── 13. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(float(10/sqrt(5)) - 4.47) < 0.01"
      - "sp.simplify((Matrix([6,2,4]) - 10/sqrt(5)*Matrix([1,2,0])).dot(Matrix([1,2,0]))) != 0"
      - "Matrix([6*1, 2*2, 4*0]) == Matrix([6,4,0])"
      - "Rational(10,56)*Matrix([6,2,4]) != Matrix([2,4,0])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chia cho $\|\mathbf{u}\| = \sqrt 5$ thay vì $\|\mathbf{u}\|^2 = 5$: $\ \hlo{c} = \frac{10}{\sqrt 5} \approx 4{,}47$ thay vì $2$ <b class="red">(sai)</b>
          <br><span class="note">Phép thử vuông góc sẽ báo sai ngay: $\mathbf{z}^T\mathbf{u} \neq 0$.</span></div>
        say: "Lỗi thứ nhất, hay gặp nhất. Chia cho độ dài của u, là căn 5, thay vì độ dài bình phương, là 5. Khi đó c xấp xỉ 4 phẩy 47 thay vì 2, cái bóng bị phóng to sai. May mắn là phép thử vuông góc sẽ báo sai ngay, vì z chuyển vị nhân u không còn bằng 0."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhân từng cặp nhưng <b>quên cộng</b>: viết $\mathbf{y}^T\mathbf{u} = (6, 4, 0)^T$ <b class="red">(sai)</b>
          <br><span class="note">Tích vô hướng luôn là <b>một con số</b>:</span>$$6\cdot 1 + 2\cdot 2 + 4\cdot 0 = 6 + 4 + 0 = 10$$</div>
        say: "Lỗi thứ hai. Nhân từng cặp xong rồi quên cộng, nên viết tích vô hướng thành một vector 6, 4, 0. Nhớ rằng tích vô hướng luôn ra đúng một con số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đảo vai trò: tính $\proj_{\mathbf{y}}\mathbf{u}$ (chiếu u lên y) <b class="red">(sai)</b> thay vì $\proj_{\mathbf{u}}\mathbf{y}$.
          <br><span class="note">Mẫu số luôn là vector <b>dưới chân chữ proj</b> nhân với chính nó.</span></div>
        say: "Lỗi thứ ba. Đảo vai trò, chiếu u lên y thay vì chiếu y lên u. Hai kết quả này khác nhau hoàn toàn. Mẹo nhớ, vector viết nhỏ dưới chân chữ proj là mặt đất, và mẫu số luôn là mặt đất nhân vô hướng với chính nó."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Không kiểm tra lại. <span class="note">Luôn chạy 2 phép thử: $\mathbf{z}^T\mathbf{u}=0$ và Pytago.</span></div>
        say: "Lỗi thứ tư là bỏ qua bước kiểm tra. Hai phép thử chỉ tốn ba mươi giây, nhưng bắt được gần như mọi lỗi tính toán ở trên."

  # ───────────────────────── 14. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chiếu y = (3, 1)ᵀ lên u = (1, 1)ᵀ"
    checks:
      - "Matrix([3,1]).dot(Matrix([1,1])) == 4 and Matrix([1,1]).dot(Matrix([1,1])) == 2"
      - "Rational(4,2)*Matrix([1,1]) == Matrix([2,2])"
      - "(Matrix([3,1]) - Matrix([2,2])) == Matrix([1,-1]) and Matrix([1,-1]).dot(Matrix([1,1])) == 0"
      - "Matrix([3,1]).dot(Matrix([3,1])) == 10 and Matrix([2,2]).dot(Matrix([2,2])) == 8 and Matrix([1,-1]).dot(Matrix([1,-1])) == 2"
    steps:
      - show: |
          <p class="big">$\mathbf{y} = (3, 1)^T,\quad \mathbf{u} = (1, 1)^T$</p>
          <p>Tìm $\proj_{\mathbf{u}}\mathbf{y}$, tìm $\mathbf{z}$, và chạy 2 phép thử.</p>
        focus: [0, 1, 2, 0]
        say: "Đến lượt bạn. Cho y bằng 3, 1 và u bằng 1, 1. Hãy tìm hình chiếu của y lên u, tìm phần còn lại z, rồi chạy hai phép thử. Bạn hãy dừng video, lấy giấy bút ra làm."
        pause: 8
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th></tr>
          <tr><td>① tử số</td><td>$\mathbf{y}^T\mathbf{u} = 3 + 1 = 4$</td></tr>
          <tr><td>② mẫu số</td><td>$\mathbf{u}^T\mathbf{u} = 1 + 1 = 2$</td></tr>
          <tr><td>③ hệ số</td><td>$\hlo{c} = 4/2 = 2$</td></tr>
          <tr><td>④ hình chiếu</td><td>$\proj_{\mathbf{u}}\mathbf{y} = 2\,(1, 1)^T = \hlg{(2, 2)^T}$</td></tr>
          <tr><td>phần còn lại</td><td>$\mathbf{z} = (3-2,\ 1-2)^T = (1, -1)^T$</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Đáp án như sau, tử số bằng 3 cộng 1 bằng 4. Mẫu số bằng 1 cộng 1 bằng 2. Hệ số c bằng 2. Hình chiếu là 2, 2. Phần còn lại z bằng 1, âm 1."
      - show: |
          <p>Thử 1: $\ \mathbf{z}^T\mathbf{u} = 1 - 1 = 0\ \checkmark$ &nbsp;&nbsp; Thử 2: $\ \|\mathbf{y}\|^2 = 10 = 8 + 2\ \checkmark$</p>
        say: "Phép thử một, z chuyển vị nhân u bằng 1 trừ 1 bằng 0, đúng. Phép thử hai, độ dài bình phương của y là 10, bằng 8 cộng 2. Nếu bạn ra đúng cả hai, chúc mừng, bạn đã nắm được bài."

  # ───────────────────────── 15. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">Vector = danh sách số</span><span class="a">→</span>
          <span class="n">$\mathbf{u}^T\mathbf{v}$: nhân cặp rồi cộng</span><span class="a">→</span>
          <span class="n">$\|\mathbf{u}\|^2 = \mathbf{u}^T\mathbf{u}$</span><span class="a">→</span>
          <span class="n">vuông góc $\iff$ tích $= 0$</span><span class="a">→</span>
          <span class="n">$\mathbf{z} = \mathbf{y} - c\,\mathbf{u}$</span><span class="a">→</span>
          <span class="n">$c = \dfrac{\mathbf{y}^T\mathbf{u}}{\mathbf{u}^T\mathbf{u}}$</span><span class="a">→</span>
          <span class="n">2 phép thử</span></div>
        say: "Tổng kết chuỗi logic của bài. Vector là danh sách số. Tích vô hướng là nhân từng cặp rồi cộng. Độ dài bình phương là vector nhân vô hướng với chính nó. Vuông góc khi và chỉ khi tích vô hướng bằng 0. Phần còn lại z bằng y trừ c u. Từ đó suy ra hệ số c. Và cuối cùng là hai phép thử."
      - show: |
          <div class="box key"><b>Tư duy:</b> Đừng học thuộc công thức. Hãy nhớ <b>một điều kiện</b> ($\mathbf{z}^T\mathbf{u}=0$) — công thức tự suy ra được.</div>
        say: "Điều quan trọng nhất cần mang theo là cách tư duy. Đừng học thuộc công thức. Hãy nhớ một điều kiện, phần còn lại phải vuông góc. Từ điều kiện đó, bạn luôn tự suy lại được công thức, kể cả khi quên."
      - show: |
          <p class="note">Các bài sau dùng lại đúng ý này. <b>Bài 4</b> (Gram-Schmidt): biến một bộ vector thành các vector vuông góc nhau bằng cách lặp lại “trừ đi cái bóng”. <b>Bài 16</b> (PCA, một cách nén dữ liệu): chọn hướng mà dữ liệu có bóng dài nhất. <b>Bài 18</b> (hồi quy tuyến tính, dự đoán một con số như giá nhà): bóng của y lên không gian dữ liệu.</p>
        say: "Ở các bài sau, bạn sẽ gặp lại cái bóng này rất nhiều lần. Ở bài 4, ta biến một bộ vector thành các vector vuông góc nhau, chỉ bằng cách lặp lại việc trừ đi cái bóng. Ở bài 16, một cách nén dữ liệu tên là PCA đi tìm hướng mà dữ liệu có bóng dài nhất. Ở bài 18, cách dự đoán giá nhà gọi là hồi quy tuyến tính cũng dựa trên cái bóng. Hẹn gặp bạn ở bài tiếp theo."
