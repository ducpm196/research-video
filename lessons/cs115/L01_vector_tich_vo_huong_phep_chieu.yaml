rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L158-L187 (Từ điển ký hiệu ĐSTT + Phép chiếu trực giao)"
assumes: []
# Quy ước ký hiệu của bài (lint kiểm tính nhất quán, xem tools/registry/symbols.yaml#consistency):
#   độ dài: ‖x‖ (không chỉ số dưới; ‖x‖₂ chỉ xuất hiện ở step notation_note), chuyển vị: ^T,
#   vector viết ngang có ^T sau khi đã học chuyển vị, phép nhân hai số: · (× chỉ ở step notation_note).
objectives:
  - "Nói thành lời các ký hiệu: x in đậm, x một, R mũ D, thuộc, chuyển vị, dấu tổng Sigma, độ dài ‖u‖, ‖u‖ bình phương"
  - "Cộng, trừ vector và nhân vector với một số bằng tay"
  - "Tự tính tích vô hướng và độ dài của vector 3 chiều"
  - "Tự suy ra công thức hình chiếu từ điều kiện vuông góc, giải thích được vì sao z = y − c·u"
  - "Tính hình chiếu của y lên u và tự kiểm tra kết quả bằng 2 phép thử"
# Câu bị CẢ HAI mô hình ASR (small + medium) gắn cờ nhưng đã xem xét. Chỉ ghi những câu mà khác biệt hoàn toàn do
# ASR viết phiên âm TÊN CHỮ CÁI (x → “ít”, z → “giết/giác”, c → “xe”, “u i” → “ui”). Câu thuộc cặp âm dễ lẫn
# (hai/hay, vuông/vùng, một/mục…) KHÔNG ghi ở đây: chờ người nghe xác nhận (asr_report.md).
  - "Đếm được số phép nhân khi so mọi cặp ảnh, và thấy vì sao nó tăng theo bình phương số ảnh"
af2: true
covers:
