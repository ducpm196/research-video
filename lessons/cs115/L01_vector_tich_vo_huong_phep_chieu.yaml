          <tr><td>100 000</td><td>4 999 950 000</td><td>3 919 960 800 000</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"]]
        say: "Một ảnh đen trắng 28 nhân 28 điểm ảnh là vector 784 chiều, nên một tích vô hướng cần 784 phép nhân. So mọi cặp trong N ảnh cần N nhân N trừ 1, chia 2 cặp. Với 10 ảnh có 45 cặp, với một nghìn ảnh có gần nửa triệu cặp, với một trăm nghìn ảnh có gần năm tỉ cặp, số minh hoạ."
      - clear: true
        show: |
          <p>Máy làm <b>1 tỉ</b> phép nhân mỗi giây (số minh hoạ):</p>
          <table class="t"><tr><th>số ảnh $N$</th><th>thời gian</th></tr>
