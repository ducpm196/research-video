  - id: pitfalls
    kind: pitfall
    title: "2 lỗi người mới hay mắc"
    checks:
      - "abs(float(10/sqrt(5)) - 4.47) < 0.01"
      - "sp.simplify((Matrix([6,2,4]) - 10/sqrt(5)*Matrix([1,2,0])).dot(Matrix([1,2,0]))) != 0"
      - "Matrix([6*1, 2*2, 4*0]) == Matrix([6,4,0])"
      - "Rational(10,56)*Matrix([6,2,4]) != Matrix([2,4,0])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chia cho $\|\mathbf{u}\| = \sqrt 5$ thay vì $\|\mathbf{u}\|^2 = 5$: $\ \hlo{c} = \frac{10}{\sqrt 5} \approx 4{,}47$ thay vì $2$ <b class="red">(sai)</b>
          <br><span class="note">Phép thử vuông góc sẽ báo sai ngay: $\mathbf{z}^T\mathbf{u} \neq 0$.</span></div>
        say: "Lỗi thứ nhất, hay gặp nhất: chia cho độ dài của u, là căn 5, thay vì độ dài bình phương, là 5. Khi đó c xấp xỉ 4 phẩy 47 thay vì 2. May là phép thử vuông góc báo sai ngay."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Đảo vai trò: tính $\proj_{\mathbf{y}}\mathbf{u}$ (chiếu u lên y) <b class="red">(sai)</b> thay vì $\proj_{\mathbf{u}}\mathbf{y}$.
          <br><span class="note">Mẫu số luôn là vector <b>dưới chân chữ proj</b> nhân với chính nó.</span></div>
        say: "Lỗi thứ hai: đảo vai trò, chiếu u lên y thay vì chiếu y lên u, hai kết quả khác hẳn nhau. Mẹo nhớ: mẫu số luôn là vector dưới chân chữ proj nhân vô hướng với chính nó."

  # ───────────────────────── 14. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chiếu y = (3, 1)ᵀ lên u = (1, 1)ᵀ"
    checks:
      - "Matrix([3,1]).dot(Matrix([1,1])) == 4 and Matrix([1,1]).dot(Matrix([1,1])) == 2"
      - "Rational(4,2)*Matrix([1,1]) == Matrix([2,2])"
      - "(Matrix([3,1]) - Matrix([2,2])) == Matrix([1,-1]) and Matrix([1,-1]).dot(Matrix([1,1])) == 0"
      - "Matrix([3,1]).dot(Matrix([3,1])) == 10 and Matrix([2,2]).dot(Matrix([2,2])) == 8 and Matrix([1,-1]).dot(Matrix([1,-1])) == 2"
    steps:
      - show: |
          <p class="big">$\mathbf{y} = (3, 1)^T,\quad \mathbf{u} = (1, 1)^T$</p>
          <p>Tìm $\proj_{\mathbf{u}}\mathbf{y}$, tìm $\mathbf{z}$, và chạy 2 phép thử.</p>
        focus: [0, 1, 2, 0]
        say: "Đến lượt bạn. Cho y bằng 3, 1 và u bằng 1, 1. Hãy tìm hình chiếu của y lên u, tìm phần còn lại z, rồi chạy hai phép thử. Dừng video, lấy giấy bút ra làm."
        pause: 60
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th></tr>
          <tr><td>① tử số</td><td>$\mathbf{y}^T\mathbf{u} = 3 + 1 = 4$</td></tr>
          <tr><td>② mẫu số</td><td>$\mathbf{u}^T\mathbf{u} = 1 + 1 = 2$</td></tr>
          <tr><td>③ hệ số</td><td>$\hlo{c} = 4/2 = 2$</td></tr>
          <tr><td>④ hình chiếu</td><td>$\proj_{\mathbf{u}}\mathbf{y} = 2\,(1, 1)^T = \hlg{(2, 2)^T}$</td></tr>
          <tr><td>phần còn lại</td><td>$\mathbf{z} = (3-2,\ 1-2)^T = (1, -1)^T$</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Đáp án như sau, tử số bằng 3 cộng 1 bằng 4. Mẫu số bằng 1 cộng 1 bằng 2. Hệ số c bằng 2. Hình chiếu là 2, 2. Phần còn lại z bằng 1, âm 1."
      - show: |
          <p>Thử 1: $\ \mathbf{z}^T\mathbf{u} = 1 - 1 = 0\ \checkmark$ &nbsp;&nbsp; Thử 2: $\ \|\mathbf{y}\|^2 = 10 = 8 + 2\ \checkmark$</p>
        say: "Phép thử một, z chuyển vị nhân u bằng 1 trừ 1 bằng 0. Phép thử hai, độ dài bình phương của y là 10, bằng 8 cộng 2. Đúng cả hai là bạn nắm bài."

  # ───────────────────────── 15. TỔNG KẾT ─────────────────────────
  - id: practice
    kind: practice
    lab: labs/CS115/L01
    title: "Tự làm: chiếu vector bằng Python"
    checks:
      - "(lambda y, u: (sum(a*b for a, b in zip(y, u)), sum(a*a for a in u)))([7, 4, 1], [2, 0, 1]) == (15, 5)"
      - "[3*x for x in (2, 0, 1)] == [6, 0, 3] and [a - b for a, b in zip((7, 4, 1), (6, 0, 3))] == [1, 4, -2]"
      - "1*2 + 4*0 + (-2)*1 == 0 and 7*7 + 4*4 + 1 == 66 and 36 + 0 + 9 == 45 and 1 + 16 + 4 == 21 and 45 + 21 == 66"
      - "Fraction(2*4 + 3*1, 4*4 + 1*1) == Fraction(11, 17) and [Fraction(11, 17)*x for x in (4, 1)] == [Fraction(44, 17), Fraction(11, 17)]"
    steps:
      - clear: true
        show: |
          <table class="t"><tr><th>đọc trước: việc</th><th>làm thế nào</th><th>gõ trong Git Bash</th></tr><tr><td>tạo tệp</td><td>mở trình soạn văn bản (Notepad, VS Code…), gõ chương trình, lưu thành tệp tên <code>chieu.py</code> (đuôi <code>.py</code>) trong thư mục gốc của bộ khoá, nơi có thư mục <code>labs</code></td><td>—</td></tr><tr><td>chạy</td><td>mở Git Bash ở thư mục đó; các dòng <code>print</code> hiện ngay bên dưới lệnh</td><td><code>python chieu.py</code></td></tr><tr><td>chấm</td><td><code>bash</code> chạy tệp chấm <code>labs/cham.sh</code> với khoá, mã bài, tên tệp; in <b>ĐÚNG</b> khi mọi dòng trùng kết quả mong đợi, nếu không thì chỉ ra dòng khác</td><td><code>bash labs/cham.sh CS115 L01 chieu.py</code></td></tr></table><p class="note"><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn Open Git Bash here.</p><p class="note"><b>kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python chieu.py</code> và so với kết quả mong đợi.</p>
        focus: [["1.2", 2, 3], "1.3", "1.4"]
        say: "Một, tạo tệp: gõ chương trình trong trình soạn văn bản, lưu vào thư mục gốc của bộ khoá. Hai, chạy tệp: mở cửa sổ dòng lệnh ở thư mục đó, gõ lệnh trên màn hình, kết quả in ngay bên dưới. Ba, chấm bài: lệnh ở hàng cuối chạy tệp chấm, rồi in chữ ĐÚNG khi mọi dòng trùng."
      - clear: true
        show: |
          <table class="t"><tr><th>đọc trước: viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def dot(u, v):</code></td><td>định nghĩa hàm tên <code>dot</code> có hai <b>tham số</b> u và v (hai ô nhận dữ liệu); các dòng thụt vào là thân hàm; <code>return</code> đưa kết quả ra chỗ gọi hàm</td><td><code>return 15</code> thì <code>dot(y, u)</code> cho 15</td></tr><tr><td><code>u = [2, 0, 1]</code></td><td>danh sách: các số trong ngoặc vuông; <code>u[0]</code> là phần tử đầu, vì vị trí đếm từ 0</td><td><code>u[0]</code> là 2, <code>u[2]</code> là 1</td></tr><tr><td><code>Fraction(15, 5)</code></td><td>phân số chính xác: chia hết thì in số nguyên, không chia hết thì in phân số; cần <code>from fractions import Fraction</code></td><td><code>Fraction(15, 5)</code> in <code>3</code>; <code>Fraction(11, 17)</code> in <code>11/17</code></td></tr><tr><td><code>15 // 5</code></td><td>hai dấu gạch chéo là chia lấy phần nguyên; một dấu gạch chéo cho số thập phân</td><td><code>15 // 5</code> là 3, còn <code>15 / 5</code> là <code>3.0</code> (bị chấm sai)</td></tr></table>
        focus: ["1.1", "1.2", "1.3", "1.4", "1.5"]
        say: "Đọc trước bốn mẩu mã sẽ dùng trong chương trình. Dòng này định nghĩa hàm có hai tham số u và v, tức hai ô nhận dữ liệu; lệnh trả về đưa kết quả ra. Danh sách là các số trong ngoặc vuông, và u ngoặc vuông 0 là phần tử đầu, vì vị trí đếm từ không. Hàm phân số cho kết quả chính xác: chia hết thì in số nguyên, không chia hết thì in phân số như 11 gạch chéo 17. Hai dấu gạch chéo là chia lấy phần nguyên, còn một dấu gạch chéo cho số thập phân, và bị chấm sai."
      - clear: true
        show: |
          <table class="t"><tr><th>đọc trước (tiếp): viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code style="white-space:nowrap">sum(a * b for a, b in zip(u, v))</code></td><td>tổng các tích a nhân b của từng cặp (a, b) ghép từ u và v</td><td>u = [2, 0, 1], v = [7, 4, 1]: 14 + 0 + 1 = 15</td></tr><tr><td><code>[c * x for x in u]</code></td><td>danh sách mới: mỗi phần tử x của u nhân c</td><td>c = 3, u = [2, 0, 1] cho <code>[6, 0, 3]</code></td></tr><tr><td><code>", ".join(str(x) for x in hc)</code></td><td>đổi mỗi số thành chữ bằng <code>str</code>, rồi nối bằng dấu phẩy và một dấu cách</td><td><code>[6, 0, 3]</code> thành <code>6, 0, 3</code></td></tr><tr><td><code style="white-space:nowrap">print(f"Pytago: {a} = {b} + {c}")</code></td><td>f-string: giá trị trong ngoặc nhọn chèn vào chữ</td><td>a = 66, b = 45, c = 21 in <code>Pytago: 66 = 45 + 21</code></td></tr></table>
        say: "Còn vài mẩu mã nữa, đọc kỹ ở bảng."
      - clear: true
        show: |
          <p><b>Đề</b> (số minh hoạ). Viết <code>chieu.py</code> có hàm <code>dot(u, v)</code>, rồi chiếu $\mathbf{y} = (7, 4, 1)^T$ lên $\mathbf{u} = (2, 0, 1)^T$.</p>
          <table class="t"><tr><th>in ra</th><th>nội dung</th></tr>
          <tr><td>7 dòng</td><td>tử số, mẫu số, $c$, hình chiếu, $\mathbf{z}$, $\mathbf{z}^T\mathbf{u}$, Pytago; $c$ phải in <code>3</code>, không phải <code>3.0</code> (dùng <code>Fraction</code> hoặc <code>//</code>)</td></tr>
          <tr><td>2 dòng</td><td>chiếu $(2, 3)^T$ lên $(4, 1)^T$: $c$ là phân số (dùng <code>Fraction</code>)</td></tr></table>
          <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L01/de.md</code> — mở tệp đó ra đọc.</p>
        focus: [0, "2.2", "2.3", 0]
        say: "Bây giờ tới phần bạn tự làm, với số liệu mới trên màn hình. Viết hàm tích vô hướng rồi chiếu y bằng 7, 4, 1 lên u bằng 2, 0, 1, in bảy dòng gồm cả hai phép thử. Sau đó chiếu một cặp khác mà hệ số c là phân số. Dừng video và tự làm."
        pause: 240
      - clear: true
        show: |
          <p><b>Kết quả mong đợi</b></p><div class="code"><div>tu so: 15</div><div>mau so: 5</div><div>c = 3</div><div>hinh chieu: [6, 0, 3]</div><div>phan con lai z: [1, 4, -2]</div><div>z.u = 0</div><div>Pytago: 66 = 45 + 21</div><div>c = 11/17</div><div>hinh chieu: [44/17, 11/17]</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L01 chieu.py</code> — in <b>ĐÚNG</b> khi trùng.</p>
        focus: [0, 0]
        say: "Đây là kết quả mong đợi. Chạy chương trình của bạn rồi so từng dòng, hoặc chấm bằng lệnh ở chân màn hình."
      - show: |
          <div class="box key"><b>Nếu kẹt:</b> <code>dot</code> nhân từng cặp cùng vị trí rồi cộng. Hệ số $c$ = <code>Fraction(dot(y, u), dot(u, u))</code>. Hình chiếu = $c$ nhân từng thành phần của $\mathbf{u}$; $\mathbf{z}$ = $\mathbf{y}$ trừ hình chiếu từng vị trí.</div>
        say: "Nếu kẹt, nhớ rằng tích vô hướng là nhân từng cặp rồi cộng. Hệ số c bằng tử số chia mẫu số, và nên dùng phân số chính xác. Hình chiếu là c nhân từng thành phần của u, còn z là y trừ hình chiếu."

  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">Vector = danh sách số</span><span class="a">→</span>
          <span class="n">$\mathbf{u}^T\mathbf{v}$: nhân cặp rồi cộng</span><span class="a">→</span>
          <span class="n">$\|\mathbf{u}\|^2 = \mathbf{u}^T\mathbf{u}$</span><span class="a">→</span>
          <span class="n">vuông góc $\iff$ tích $= 0$</span><span class="a">→</span>
          <span class="n">$\mathbf{z} = \mathbf{y} - c\,\mathbf{u}$</span><span class="a">→</span>
          <span class="n">$c = \dfrac{\mathbf{y}^T\mathbf{u}}{\mathbf{u}^T\mathbf{u}}$</span><span class="a">→</span>
          <span class="n">2 phép thử</span></div>
        say: "Tổng kết: vector là danh sách số, tích vô hướng là nhân từng cặp rồi cộng, độ dài bình phương là tích vô hướng với chính nó, vuông góc khi tích bằng 0. Từ đó z bằng y trừ c u, suy ra c, rồi chạy hai phép thử."
