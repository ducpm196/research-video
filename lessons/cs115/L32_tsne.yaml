id: L32
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 32 — t-SNE: trực quan hoá dữ liệu nhiều chiều bằng xác suất láng giềng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "NGOÀI mọi nguồn môn học (0 kết quả trên 13 PDF + tex) — thêm theo yêu cầu người dùng; CITED: van der Maaten & Hinton, “Visualizing Data using t-SNE”, JMLR 9 (2008) 2579–2605 (truy cập 2026-10-24, no revision given)"
assumes: [cdot, sub, sub2, vec, norm, sum, exp, log, approx, geq, given, power, prob, neq, sigma]
# Quy ước ký hiệu: điểm gốc xᵢ (nhiều chiều), điểm vẽ yᵢ (2 chiều); độ giống ở không gian gốc p_{j|i} (xác suất i chọn j làm láng giềng);
#   ở không gian vẽ qᵢⱼ; độ lệch KL(P ‖ Q) — dấu ‖ ở đây KHÔNG phải độ dài (nói ở notation_note); ln như bài 12.
# Lời đọc: “t-SNE” đọc “tê ét en e” (tên chữ cái); “perplexity” nói “độ bối rối”; KL nói “độ lệch giữa hai phân phối”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 9 (gradient descent), bài 12 (e mũ, ln), bài 14 (hình chuông), bài 16 (PCA: chiếu
#   tuyến tính), bài 20 (softmax: chia cho tổng; entropy; entropy chéo), bài 27 (láng giềng gần nhất).
objectives:
  - "Hiểu mục tiêu: vẽ dữ liệu nhiều chiều lên mặt phẳng mà giữ láng giềng gần"
  - "Tính xác suất láng giềng p bằng hình chuông chia cho tổng"
  - "Hiểu độ bối rối là “số láng giềng hiệu dụng”"
  - "Biết vì sao dùng phân phối t đuôi dày ở không gian vẽ, và độ lệch KL"
  - "Đọc hình t-SNE đúng cách: chỉ tin quan hệ láng giềng gần"
asr_reviewed:
  - {sentence: "Bước bốn, tính entropy bằng cách cộng ba số hạng âm p nhân lôgarit p, được khoảng 0 phẩy 545.", reason: "ASR chép “Bước 4, tính entropy bằng cách cộng 3 số hạng ấm tê nhân logarithmê được khoảng 0,545.” (0.8): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: âm (trong “âm p” → “ấm t”), lôgarit (trong “lôgarit p” → “logarithmê”), không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, chia từng số cho tổng, đúng như softmax của bài 20.", reason: "ASR chép “Bước ba, chia từng số cho tổng đúng như sắp mát của bài 20.” (0.897): “softmax” đọc “sóp-mác” theo lexicon_vi.yaml (tốt nhất 3/8, B44 OPEN), ASR chép “sắp mát” — tên tiếng Anh khó, cần người nghe — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lấy e mũ lôgarit của 2 thì được đúng 2.", reason: "ASR chép “Lấy e-mũ Logatrix của 2 thì được đúng 2.” (0.9): lệch âm/thanh thuần Việt: lôgarit/logatrix — NOT_VERIFIED bằng tai người"}
  - sentence: "Ở không gian gốc, xác suất điểm i chọn điểm j làm láng giềng được tính bằng hình chuông của khoảng cách, rồi chia cho tổng như bài 20."
    reason: "i, j đọc tên chữ cái, ASR chép “y”, “gì”; câu còn lại khớp"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nhìn 784 chiều trên một tờ giấy"
    steps:
      - show: |
          <p class="big">Ảnh chữ số viết tay có 784 chiều (bài 16). Muốn <b>nhìn</b> xem các chữ số có tự gom nhóm không, phải vẽ xuống 2 chiều.</p>
          <p>PCA (bài 16) chiếu tuyến tính lên 2 hướng trải rộng nhất — các nhóm thường <b>chồng lên nhau</b>.</p>
          <div class="box key">t-SNE (van der Maaten &amp; Hinton, 2008): đặt các điểm lên mặt phẳng sao cho ai là <b>láng giềng gần</b> ở 784 chiều thì vẫn gần nhau trên hình.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ảnh chữ số viết tay có 784 chiều. Muốn nhìn xem các chữ số có tự gom nhóm không, ta phải vẽ xuống hai chiều. Phép chiếu tuyến tính của bài 16 thường làm các nhóm chồng lên nhau. Phương pháp tê ét en e đặt các điểm sao cho láng giềng gần vẫn gần nhau."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: hình chuông, chia cho tổng, entropy"
    checks:
      - "[round(math.exp(-d*d/2), 3) for d in (0, 1, 2, 3)] == [1.0, 0.607, 0.135, 0.011]"
    steps:
      - show: |
          <p>Bài 14: hình chuông $e^{-d^2/(2\sigma^2)}$ — lớn khi $d$ nhỏ, giảm rất nhanh khi $d$ lớn.</p>
          <p>Bài 20: chia mỗi số cho tổng để được các xác suất cộng lại bằng 1 (như softmax); entropy $H = -\sum p\ln p$ (độ bất ngờ trung bình của $P$); entropy chéo $-\sum p\ln q$ (độ bất ngờ khi dữ liệu theo $P$ mà ta đoán theo $Q$).</p>
          <table class="t"><tr><th>khoảng cách $d$ (với $\sigma = 1$)</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>$e^{-d^2/2}$</td><td>1</td><td>0,607</td><td>0,135</td><td>0,011</td></tr></table>
        focus: [1, 2, 2, 2, 3]
        say: "Nhắc lại bài 14, hình chuông lớn khi khoảng cách nhỏ và giảm rất nhanh khi khoảng cách lớn. Nhắc lại bài 20, chia mỗi số cho tổng để được các xác suất cộng lại bằng 1. Entropy đo độ bất ngờ trung bình của một phân phối P. Còn entropy chéo, tức âm tổng p nhân lôgarit q, đo độ bất ngờ khi dữ liệu theo P mà ta lại đoán theo Q. Bảng cho thấy với xích ma bằng 1, hình chuông bằng 1 ở khoảng cách 0, còn 0 phẩy 135 ở khoảng cách 2, và chỉ 0 phẩy 011 ở khoảng cách 3."

  # ───────────────────────── 3. XÁC SUẤT LÁNG GIỀNG ─────────────────────────
  - id: sym_p
    kind: symbol
    title: "Giải mã: p — xác suất chọn láng giềng ở không gian gốc"
    checks:
      - "(lambda w: [round(float(v), 4) for v in w] == [0.6065, 0.1353, 0.0111] and [round(float(v), 3) for v in w/w.sum()] == [0.806, 0.18, 0.015])(np.exp(-np.array([1, 4, 9])/2))"
    steps:
      - show: |
          <div class="box key">$p_{j\mid i} = \dfrac{e^{-\lVert\mathbf{x}_i - \mathbf{x}_j\rVert^2/(2\sigma_i^2)}}{\sum_{k \neq i} e^{-\lVert\mathbf{x}_i - \mathbf{x}_k\rVert^2/(2\sigma_i^2)}}$ &nbsp; — “nếu $i$ chọn một láng giềng theo hình chuông, xác suất chọn $j$”</div>
          <p><b>Làm thử ngay</b>: điểm $i$ có ba điểm khác với khoảng cách bình phương 1, 4, 9; $\sigma_i = 1$:</p>
          <p>$e^{-0{,}5} \approx 0{,}607$, $e^{-2} \approx 0{,}135$, $e^{-4{,}5} \approx 0{,}011$ → chia cho tổng: $\ p \approx (\hlg{0{,}806};\ 0{,}180;\ 0{,}015)$</p>
        introduces: [p_cond]
        focus: [1, [2, 3], "3.4"]
        say: "Ở không gian gốc, xác suất điểm i chọn điểm j làm láng giềng được tính bằng hình chuông của khoảng cách, rồi chia cho tổng như bài 20. Làm thử ngay, với ba điểm có khoảng cách bình phương 1, 4 và 9, ta được xác suất 0 phẩy 806, 0 phẩy 18 và 0 phẩy 015. Điểm gần nhất chiếm gần hết."

  # ───────────────────────── 4. ĐỘ BỐI RỐI ─────────────────────────
  - id: perplexity
    kind: concept
    title: "Độ bối rối: số láng giềng hiệu dụng"
    checks:
      - "(lambda p: round(math.exp(-float((p*np.log(p)).sum())), 2) == 1.72)((lambda w: w/w.sum())(np.exp(-np.array([1, 4, 9])/2)))"
      - "round(math.exp(-sum(0.25*math.log(0.25) for _ in range(4))), 6) == 4.0"
    steps:
      - show: |
          <div class="box key">Độ bối rối (perplexity) $= e^{H}$, với $H$ là entropy của $p_{\cdot\mid i}$ — xấp xỉ “số láng giềng mà $i$ thật sự để ý”</div>
          <p>Ví dụ trên: $H \approx 0{,}545$ → độ bối rối $\approx \hlg{1{,}72}$ (gần như chỉ 1–2 láng giềng). &nbsp; Chia đều cho 4 điểm: $e^{\ln 4} = 4$.</p>
          <p class="note">Người dùng chọn độ bối rối (thường 5 đến 50); máy tự chọn $\sigma_i$ cho từng điểm để đạt đúng số đó — vùng dày dữ liệu có $\sigma_i$ nhỏ, vùng thưa có $\sigma_i$ lớn.</p>
        focus: [1, ["2.1", "2.2"], "2.3", 3]
        say: "Độ bối rối bằng e mũ entropy, xấp xỉ bằng số láng giềng mà điểm i thật sự quan tâm tới. Ví dụ trên chỉ khoảng 1 phẩy 72, gần như một hai láng giềng. Chia đều cho 4 điểm thì độ bối rối bằng 4. Người dùng chọn con số này, và máy tự chọn độ rộng xích ma cho từng điểm."

  - id: p_hand
    kind: example
    title: "Làm tay từng bước: xác suất láng giềng và độ bối rối"
    checks:
      - "[round(math.exp(-v/2), 4) for v in (1, 4, 9)] == [0.6065, 0.1353, 0.0111] and round(0.6065 + 0.1353 + 0.0111, 4) == 0.7529"
      - "[round(v/0.7529, 3) for v in (0.6065, 0.1353, 0.0111)] == [0.806, 0.18, 0.015]"
      - "(lambda p: [round(float(v), 4) for v in -p*np.log(p)] == [0.1742, 0.3085, 0.0622] and round(float(-(p*np.log(p)).sum()), 3) == 0.545)((lambda w: w/w.sum())(np.exp(-np.array([1, 4, 9])/2)))"
      - "round(math.exp(0.545), 2) == 1.72 and round(0.1742 + 0.3085 + 0.0622, 3) == 0.545"
    steps:
      - show: |
          <p><b>Bước 1 — hình chuông của từng khoảng cách</b> (khoảng cách bình phương 1, 4, 9; $\sigma_i = 1$, nên chia 2):</p>
          $$e^{-\frac{1}{2}} \approx 0{,}6065 \qquad e^{-\frac{4}{2}} \approx 0{,}1353 \qquad e^{-\frac{9}{2}} \approx 0{,}0111$$
        focus: [1, 2]
        say: "Bước một, tính hình chuông cho từng điểm, với xích ma bằng 1 nên chia khoảng cách bình phương cho 2. Ba số mũ là âm 0 phẩy 5, âm 2 và âm 4 phẩy 5, cho 0 phẩy 6065, 0 phẩy 1353 và 0 phẩy 0111."
      - show: |
          <p><b>Bước 2 — cộng lại</b> để có mẫu số:</p>
          $$0{,}6065 + 0{,}1353 + 0{,}0111 = 0{,}7529$$
        focus: [1, 2]
        say: "Bước hai, cộng ba số đó lại để có mẫu số chung. Tổng bằng 0 phẩy 7529, chưa bằng 1, nên ba số này chưa phải xác suất."
      - show: |
          <p><b>Bước 3 — chia cho tổng</b> (như softmax của bài 20):</p>
          $$p = \left(\frac{0{,}6065}{0{,}7529};\ \frac{0{,}1353}{0{,}7529};\ \frac{0{,}0111}{0{,}7529}\right) \approx (\hlg{0{,}806};\ 0{,}180;\ 0{,}015)$$
        focus: [1, 2]
        say: "Bước ba, chia từng số cho tổng, đúng như softmax của bài 20. Được 0 phẩy 806, 0 phẩy 18 và 0 phẩy 015, ba số này cộng lại bằng 1."
      - show: |
          <p><b>Bước 4 — entropy rồi độ bối rối:</b> từng số hạng $-p\ln p$ là 0,1742; 0,3085; 0,0622.</p>
          $$H \approx 0{,}1742 + 0{,}3085 + 0{,}0622 = 0{,}545 \qquad e^{0{,}545} \approx \hlg{1{,}72}$$
        focus: [1, 2]
        say: "Bước bốn, tính entropy bằng cách cộng ba số hạng âm p nhân lôgarit p, được khoảng 0 phẩy 545. Lấy e mũ con số đó, độ bối rối xấp xỉ 1 phẩy 72, nghĩa là điểm i chỉ thật sự để ý chưa tới hai láng giềng."

  # ───────────────────────── 5. KHÔNG GIAN VẼ ─────────────────────────
  - id: sym_q
    kind: formula
    title: "Ở mặt phẳng: phân phối t đuôi dày"
    checks:
      - "[round(math.exp(-d*d/2), 3) for d in (1, 2, 3)] == [0.607, 0.135, 0.011] and [round(1/(1 + d*d), 3) for d in (1, 2, 3)] == [0.5, 0.2, 0.1]"
      - "(lambda X: (lambda W: (lambda C: (lambda P: abs(float(P.sum()) - 1) < 1e-12 and np.allclose(P, P.T))((C + C.T)/(2*len(X))))(W/W.sum(1, keepdims=True)))(np.where(np.eye(len(X), dtype=bool), 0, np.exp(-((X[:, None] - X[None])**2).sum(2)/2))))(np.random.default_rng(0).normal(size=(6, 3)))"
    steps:
      - show: |
          <div class="box key">$q_{ij}$ tỉ lệ với $\ \dfrac{1}{1 + \lVert\mathbf{y}_i - \mathbf{y}_j\rVert^2}$ &nbsp; (phân phối t của Student, chia cho tổng mọi cặp)</div>
          <p class="note">Ở không gian gốc cũng ghép thành xác suất trên <b>cặp</b>: $p_{ij} = \dfrac{p_{j\mid i} + p_{i\mid j}}{2N}$ ($N$ = số điểm).</p>
          <table class="t"><tr><th>khoảng cách $d$</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>hình chuông $e^{-d^2/2}$</td><td>0,607</td><td>0,135</td><td>0,011</td></tr>
          <tr><td>đuôi dày $\frac{1}{1 + d^2}$</td><td>0,5</td><td>0,2</td><td>$\hlg{0{,}1}$</td></tr></table>
          <p class="note">Mặt phẳng chật hơn 784 chiều rất nhiều (“dồn cục”). Đuôi dày cho phép các điểm <b>không</b> láng giềng nằm xa nhau trên hình mà không bị phạt nặng — các cụm tách ra rõ hơn.</p>
        introduces: [q_ij]
        focus: [1, 2, 3, 4]
        say: "Ở mặt phẳng, độ giống được tính bằng một chia cho một cộng khoảng cách bình phương, gọi là phân phối t. Ở không gian gốc, xác suất của một cặp là trung bình hai chiều chọn nhau, chia cho số điểm. So với hình chuông, nó giảm chậm hơn nhiều, ở khoảng cách 3 vẫn còn 0 phẩy 1 thay vì 0 phẩy 011. Vì mặt phẳng chật hơn rất nhiều, đuôi dày cho phép các điểm không láng giềng nằm xa nhau, nên các cụm tách rõ hơn."

  - id: tail_pic
    kind: intuition
    title: "Nhìn thấy vì sao đuôi dày đẩy các cụm ra xa"
    checks:
      - "round(math.sqrt(1/math.exp(-2) - 1), 2) == 2.53 and round(1/(1 + 2.53**2), 3) == 0.135 and round(math.exp(-2), 3) == 0.135"
      - "round(1/(1 + 9), 1) == 0.1 and round(math.exp(-4.5), 3) == 0.011"
    steps:
