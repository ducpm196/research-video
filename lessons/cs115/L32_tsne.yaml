  # ───────────────────────── 6. ĐỘ LỆCH KL ─────────────────────────
  - id: kl
    kind: formula
    title: "Mục tiêu: làm Q giống P — độ lệch KL"
    checks:
      - "(lambda P, Q: (round(float((P*np.log(P/Q)).sum()), 3), round(float((Q*np.log(Q/P)).sum()), 3), round(float(-(P*np.log(Q)).sum() + (P*np.log(P)).sum()), 3)) == (0.368, 0.511, 0.368))(np.array([0.9, 0.1]), np.array([0.5, 0.5]))"
    steps:
      - show: |
          <div class="box key">$\operatorname{KL}(P \,\|\, Q) = \sum p\ln\dfrac{p}{q}$ &nbsp; = entropy chéo của $P$ với $Q$ $-$ entropy của $P$ (bài 20) &nbsp; $\ge 0$, bằng 0 khi $Q = P$</div>
          <p><b>Làm thử ngay</b>: $P = (0{,}9;\ 0{,}1)$, $Q = (0{,}5;\ 0{,}5)$: $\ \operatorname{KL}(P\|Q) \approx \hlg{0{,}368}$, &nbsp; nhưng $\operatorname{KL}(Q\|P) \approx 0{,}511$ — <b>không đối xứng</b>.</p>
          <p class="note">t-SNE dời các điểm $\mathbf{y}_i$ bằng gradient descent (bài 9) để $\operatorname{KL}(P\|Q)$ nhỏ nhất. Phạt nặng nhất khi $p$ lớn mà $q$ nhỏ: láng giềng gần bị vẽ xa.</p>
          <p class="note">Dấu $\|$ trong $\operatorname{KL}(P\|Q)$ chỉ là dấu ngăn hai phân phối, <b>không</b> phải độ dài vector.</p>
        notation_note: true
        introduces: [kl]
        focus: ["1.1", "1.6", 2]
        say: "Mục tiêu là làm phân phối ở mặt phẳng giống phân phối gốc, đo bằng độ lệch giữa hai phân phối, bằng entropy chéo trừ entropy như bài 20. Nó luôn không âm, và bằng 0 khi hai phân phối trùng nhau. Làm thử ngay, đổi chiều cho 0 phẩy 368 và 0 phẩy 511, nên nó không đối xứng."

  # ───────────────────────── 7. ĐỌC HÌNH ĐÚNG ─────────────────────────
  - id: reading
    kind: example
    title: "Đọc hình t-SNE: cái gì tin được, cái gì không"
    steps:
      - show: |
          <table class="t"><tr><th>trên hình t-SNE</th><th>tin được?</th></tr>
          <tr><td>hai điểm nằm sát nhau</td><td>✔ thường là láng giềng thật</td></tr>
          <tr><td>khoảng cách <b>giữa</b> hai cụm</td><td><b class="red">không</b> mang ý nghĩa</td></tr>
          <tr><td><b>kích thước</b> một cụm</td><td><b class="red">không</b> (σᵢ tự co giãn theo mật độ)</td></tr>
          <tr><td>điểm mới chưa có lúc chạy</td><td>không đặt được — phải chạy lại</td></tr></table>
          <p class="note">Kết quả đổi theo độ bối rối và khởi tạo: chạy vài lần, vài giá trị độ bối rối trước khi kết luận. Chỉ dùng để <b>nhìn</b>, không dùng làm đặc trưng cho mô hình khác.</p>
        focus: [1, "1.2", ["1.3", "1.4"], "1.5", 2]
        say: "Đọc hình đúng cách. Hai điểm nằm sát nhau thường là láng giềng thật. Nhưng khoảng cách giữa hai cụm và kích thước một cụm không mang ý nghĩa, vì độ rộng xích ma tự co giãn theo mật độ. Điểm mới cũng không đặt được nếu không chạy lại. Vì vậy chỉ dùng phương pháp này để nhìn."

  # ───────────────────────── 8. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: độ lệch KL luôn không âm"
    checks:
      - "(lambda rng: min(float((a*np.log(a/b)).sum()) for a, b in ((rng.dirichlet(np.ones(5)), rng.dirichlet(np.ones(5))) for _ in range(10000))) > 0)(np.random.default_rng(0))"
      - "(lambda P: abs(float((P*np.log(P/P)).sum())) < 1e-15)(np.array([0.2, 0.3, 0.5]))"
      - "round(0.9*math.log(1.8), 3) == 0.529 and round(0.1*math.log(0.2), 3) == -0.161 and round(-(0.9*math.log(0.5) + 0.1*math.log(0.5)), 3) == 0.693 and round(-(0.9*math.log(0.9) + 0.1*math.log(0.1)), 3) == 0.325 and round(0.693 - 0.325, 3) == 0.368 and round(0.529 - 0.161, 3) == 0.368"
    steps:
      - show: |
          <p>Máy bốc ngẫu nhiên 10 000 cặp phân phối 5 giá trị, tính $\operatorname{KL}(P\|Q)$: nhỏ nhất vẫn <b>dương</b> ✓; &nbsp; $\operatorname{KL}(P\|P) = 0$ ✓</p>
        say: "Phép thử, vì muốn chắc độ lệch này không bao giờ âm, máy bốc ngẫu nhiên mười nghìn cặp phân phối và tính độ lệch. Giá trị nhỏ nhất vẫn dương, và độ lệch của một phân phối với chính nó bằng 0."
      - show: |
          <p>Kiểm số 0,368 bằng hai đường, $P = (0{,}9;\ 0{,}1)$, $Q = (0{,}5;\ 0{,}5)$:</p>
          <table class="t"><tr><th>đường</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>cộng thẳng $\sum p\ln\frac{p}{q}$</td><td>$0{,}9\ln 1{,}8 + 0{,}1\ln 0{,}2 \approx 0{,}529 - 0{,}161$</td><td>0,368</td></tr>
          <tr><td>entropy chéo − entropy (bài 20)</td><td>$\ln 2 - 0{,}325 \approx 0{,}693 - 0{,}325$</td><td>0,368 ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm lại số 0 phẩy 368 của ví dụ bằng hai đường khác nhau. Cộng thẳng từng số hạng, 0 phẩy 9 nhân lôgarit của 1 phẩy 8 được 0 phẩy 529, cộng 0 phẩy 1 nhân lôgarit của 0 phẩy 2 là âm 0 phẩy 161, ra 0 phẩy 368. Theo cách của bài 20, entropy chéo bằng lôgarit của 2, xấp xỉ 0 phẩy 693, trừ entropy của P là 0 phẩy 325, cũng ra 0 phẩy 368."

  # ───────────────────────── 9. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Trực quan hoá trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>dùng để</th><th>nhìn thấy gì</th></tr>
          <tr><td>nhìn các vector đặc trưng mà mạng nơ-ron học được</td><td>cùng loại có gom nhóm không</td></tr>
          <tr><td>kiểm tra dữ liệu</td><td>nhãn sai thường nằm lạc giữa cụm khác</td></tr>
          <tr><td><b>bài 40</b> (mở rộng): UMAP — cùng họ</td><td>theo thí nghiệm của các tác giả: nhanh hơn, giữ cấu trúc toàn cục tốt hơn</td></tr></table>
        forward_ref: true
        focus: [["1.2", "1.3"], "1.4"]
        say: "Phương pháp này dùng để nhìn các vector đặc trưng mà mạng nơ-ron học được, và kiểm tra dữ liệu, vì nhãn sai thường nằm lạc giữa cụm khác. Ở bài mở rộng 40, ta học một phương pháp cùng họ, theo các tác giả thì nhanh hơn và giữ cấu trúc toàn cục tốt hơn."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Kết luận “cụm A gần cụm B hơn cụm C” từ hình <b class="red">(sai)</b>
          <br><span class="note">Khoảng cách giữa các cụm không được giữ — chỉ láng giềng gần được giữ.</span></div>
        say: "Lỗi thứ nhất, kết luận cụm này gần cụm kia hơn từ hình vẽ. Khoảng cách giữa các cụm không được giữ, chỉ láng giềng gần được giữ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chạy một lần với một độ bối rối rồi kết luận <b class="red">(dễ sai)</b>
          <br><span class="note">Hình đổi theo độ bối rối và khởi tạo — thử nhiều lần.</span></div>
        say: "Lỗi thứ hai, chạy một lần với một độ bối rối rồi kết luận. Hình đổi theo độ bối rối và khởi tạo, nên phải thử nhiều lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng toạ độ 2 chiều của t-SNE làm đặc trưng để huấn luyện mô hình <b class="red">(sai)</b>
          <br><span class="note">Không có công thức cho điểm mới, và toạ độ thay đổi mỗi lần chạy. Muốn giảm chiều làm đặc trưng: dùng PCA (bài 16).</span></div>
        say: "Lỗi thứ ba, dùng toạ độ hai chiều làm đặc trưng để huấn luyện mô hình khác. Không có công thức cho điểm mới, và toạ độ thay đổi mỗi lần chạy. Muốn giảm chiều làm đặc trưng, hãy dùng phân tích thành phần chính của bài 16."

  # ───────────────────────── 11. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda w: [round(float(v), 3) for v in w/w.sum()] == [0.5, 0.5])(np.exp(-np.array([4, 4])/2))"
      - "round(1/(1 + 4), 2) == 0.2 and round(math.exp(-4/2), 3) == 0.135"
      - "round(math.exp(math.log(2)), 6) == 2.0"
      - "round(-(0.5*math.log(0.5)*2), 3) == 0.693 and round(math.exp(-2)/(2*math.exp(-2)), 3) == 0.5 and Rational(1, 1 + 4) == Rational(1, 5)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Điểm $i$ có hai điểm khác cùng khoảng cách bình phương 4. Tính $p_{j\mid i}$.</td></tr>
          <tr><td>2</td><td>Ở khoảng cách 2: hình chuông $e^{-d^2/2}$ và đuôi dày $\frac{1}{1 + d^2}$ bằng bao nhiêu?</td></tr>
          <tr><td>3</td><td>Phân phối (0,5; 0,5) có độ bối rối bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một tính xác suất láng giềng. Câu hai so sánh hai đuôi. Câu ba tính độ bối rối. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Hai hình chuông bằng nhau, $e^{-\frac{4}{2}} = e^{-2} \approx 0{,}135$ mỗi điểm, nên khi chia cho tổng:</p>
          $$p_{j\mid i} = \frac{0{,}135}{0{,}135 + 0{,}135} = \hlg{0{,}5}$$
          <p>② $d = 2$: $\ e^{-\frac{4}{2}} \approx \hlg{0{,}135}$; &nbsp; $\frac{1}{1 + 4} = \frac{1}{5} = \hlg{0{,}2}$ — đuôi dày lớn hơn</p>
        focus: [1, 2, 3]
        say: "Đáp án câu một, hai điểm cách đều nên hai hình chuông bằng nhau, đều khoảng 0 phẩy 135. Chia cho tổng, mỗi điểm có xác suất 0 phẩy 135 chia 0 phẩy 27, đúng một nửa. Câu hai, ở khoảng cách 2, hình chuông cho 0 phẩy 135, còn đuôi dày cho 1 chia 5, bằng 0 phẩy 2, lớn hơn."
      - show: |
          $$H = -(0{,}5\ln 0{,}5 + 0{,}5\ln 0{,}5) = \ln 2 \approx 0{,}693 \qquad e^{H} = e^{\ln 2} = \hlg{2}$$
          <p>③ Độ bối rối 2 = hai láng giềng hiệu dụng — khớp với việc chia đều cho đúng 2 điểm.</p>
        focus: [1, 1, 2]
        say: "Câu ba, entropy của phân phối chia đôi bằng lôgarit của 2, xấp xỉ 0 phẩy 693. Lấy e mũ lôgarit của 2 thì được đúng 2. Độ bối rối bằng 2 nghĩa là hai láng giềng hiệu dụng, khớp với việc chia đều cho hai điểm."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
