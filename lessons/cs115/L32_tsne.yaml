">1</text><text x="108" y="337" text-anchor="end">0</text></g><g font-size="21"><text x="633" y="62" fill="#ea580c">cam: hình chuông, dùng ở không gian gốc</text><text x="633" y="94" fill="#2563eb">xanh: đuôi dày, dùng trên mặt phẳng</text><text x="633" y="126" fill="#1f2937">cùng độ giống 0,135: chuông ở d = 2, đuôi dày ở d ≈ 2,53</text><text x="633" y="158" fill="#1f2937">ở d = 3: đuôi dày còn 0,1, chuông chỉ 0,011</text></g></svg>
