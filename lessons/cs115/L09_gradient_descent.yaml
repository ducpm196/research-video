  - clear: true
    show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>eta=0.1: [10.0, 5.2, 3.28, 2.512, 2.2048]</div><div>eta=0.4: [10.0, -9.2, 17.68, -19.952]</div><div>phan ky: True</div><div>GD 1 buoc: 100000000 phep; SGD 1 buoc: 10000 phep; buoc SGD moi epoch: 10000</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L09 gd.py</code> — in <b>ĐÚNG</b> khi trùng.</p>

      '
    focus:
    - 0
    - 0
    say: Đây là kết quả mong đợi. Chạy chương trình của bạn rồi so từng dòng, hoặc chấm bằng lệnh ở chân màn hình.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi bước, $w$ mới bằng $w$ cũ trừ $\eta$ nhân $6(w - 2)$. Khoảng cách tới đáy nhân với $|1 - 6\eta|$ mỗi bước: $\eta = 0{,}1$ cho $0{,}4$ nên giảm dần; $\eta = 0{,}4$ cho $-1{,}4$ nên đổi dấu và lớn dần.</div>

      '
    say: Nếu kẹt, mỗi bước lấy vị trí cũ trừ eta nhân đạo hàm. Khoảng cách tới đáy được nhân với giá trị tuyệt đối của một trừ 6 eta. Với eta bằng 0,1 hệ số là 0,4 nên giảm dần, còn với 0,4 hệ số là âm 1,4 nên lớn dần.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">không giải được $\nabla f = \mathbf{0}$</span><span class="a">→</span>

      <span class="n">đi ngược gradient: $\mathbf{w}_k - \eta\,\nabla f$</span><span class="a">→</span>

      <span class="n">chọn $\eta$: hệ số $1 - 2\eta$</span><span class="a">→</span>

      <span class="n">nhiều dữ liệu: SGD</span><span class="a">→</span>

      <span class="n">giữ đà: Momentum; co giãn bước: Adam</span></div>

      '
    say: Khi không giải được phương trình gradient bằng 0, ta đi ngược gradient từng bước. Tốc độ học quyết định đi nhanh, dao động hay phân kỳ. Khi dữ liệu quá nhiều, ta dùng SGD, mỗi bước chỉ nhìn một mẫu hay một lô nhỏ. Muốn giữ đà thì dùng Momentum, muốn tự co giãn bước thì dùng Adam.
  - show: '<div class="box key"><b>Tư duy:</b> sau mỗi bước, hãy hỏi “sai số có giảm không?”. Không giảm thì nghi $\eta$ trước tiên.</div>

      '
    say: Điều cần mang theo, sau mỗi bước hãy hỏi sai số có giảm không. Nếu không giảm, hãy nghi tốc độ học trước.
  - clear: true
    show: '<p class="note">Bài sau (bài 10): <b>tối ưu thích nghi</b> — Nesterov, Adagrad, RMSprop, Adadelta, và nhìn lại Adam: mỗi trọng số một tốc độ học riêng.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 10, ta học các cách tối ưu thích nghi, nơi mỗi trọng số có tốc độ học riêng, và nhìn lại Adam kỹ hơn. Hẹn gặp bạn ở bài tiếp theo.
