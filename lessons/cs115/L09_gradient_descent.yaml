  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>gd.py</code> cho $f(w) = 3(w - 2)^2$, đạo hàm $6(w - 2)$, xuất phát $w = 10{,}0$:</p>

      <table class="t"><tr><th>in ra</th><th>nội dung</th></tr>

      <tr><td>$\eta = 0{,}1$</td><td>$w$ từ bước 0 đến bước 4</td></tr>

      <tr><td>$\eta = 0{,}4$</td><td>$w$ từ bước 0 đến bước 3, rồi có phân kỳ không</td></tr>

