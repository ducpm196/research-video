      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L09/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    say: Bây giờ tới phần bạn tự làm, với hàm mới trên màn hình. Chạy Gradient Descent với eta bằng 0,1 và in các vị trí. Làm lại với eta bằng 0,4 và xem có phân kỳ không. Rồi tính chi phí một bước cả lô và một bước SGD. Dừng video và tự làm.
