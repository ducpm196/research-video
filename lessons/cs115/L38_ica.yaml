id: L38
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 38 (mở rộng) — Phân tích thành phần độc lập (ICA): tách các nguồn bị trộn lẫn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "0 kết quả trong nguồn môn học; CITED: Hyvärinen & Oja, “Independent component analysis: algorithms and applications”, Neural Networks 13(4–5) (2000) 411–430 (truy cập 2026-10-25, bản PDF itb.biologie.hu-berlin.de, inc.ucsd.edu; no revision given)"
assumes: [cdot, sub, vec, mat, inverse, transpose, expect, cov, Sigma_mat, normal, approx, power, sqrt, theta, identity]
# Quy ước ký hiệu: nguồn s (vector, các thành phần độc lập), ma trận trộn A, tín hiệu đo x = A·s; ước lượng nguồn y = W·x;
#   độ nhọn (kurtosis) của biến đã chuẩn hoá: E[y⁴] − 3 (bằng 0 với phân phối chuẩn).
# Ví dụ: 2 nguồn phân phối đều (trung bình 0, phương sai 1), A = [[1; 1], [0,5; 2]], 5000 mẫu (seed 0).
# Lời đọc: ICA chỉ hiện trên màn hình — nói “phân tích thành phần độc lập”; “kurtosis” nói “độ nhọn”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 13 (độc lập), bài 15 (hiệp phương sai bằng 0 chưa phải độc lập — ví dụ X và X²),
#   bài 14 (phân phối chuẩn), bài 16 (PCA; chuẩn hoá theo trục chính).
objectives:
  - "Hiểu bài toán “tiệc cocktail”: tín hiệu đo là hỗn hợp tuyến tính của các nguồn độc lập"
  - "Phân biệt không tương quan (PCA) và độc lập (ICA)"
  - "Làm trắng dữ liệu rồi xoay để các thành phần “ít chuẩn” nhất"
  - "Biết giới hạn: nguồn không được là phân phối chuẩn; không xác định thứ tự, tỉ lệ, dấu"
asr_reviewed:
  - {sentence: "Câu một, nhân từng hàng của A với s, được 0 và âm 1 phẩy 5.", reason: "ASR chép “Câu 1, nhân từng hàng của AVS được 0 và âm 1,5.” (0.867): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: với (trong “a với s” → “avs”) — NOT_VERIFIED bằng tai người"}
  - sentence: "Lý do là đổi chỗ hai nguồn cùng hai cột của A, hay nhân một nguồn với 2 và chia cột tương ứng cho 2, hỗn hợp vẫn y như cũ."
    reason: "“của A” bị ASR gộp thành “qua” (tên chữ cái A đứng sau “của”); phần còn lại khớp"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai người nói cùng lúc, hai micro — tách lại từng giọng?"
    steps:
      - show: |
          <p class="big">Bữa tiệc: hai người nói cùng lúc, hai micro đặt ở hai chỗ. Mỗi micro thu một <b>hỗn hợp</b> của cả hai giọng.</p>
          <div class="box key">$\mathbf{x} = \mathbf{A}\mathbf{s}$: &nbsp; $\mathbf{s}$ = hai giọng gốc (độc lập), $\mathbf{A}$ = cách trộn (không biết), $\mathbf{x}$ = hai bản ghi. Phân tích thành phần độc lập (ICA) tìm lại $\mathbf{s}$ chỉ từ $\mathbf{x}$.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, trong một bữa tiệc, hai người nói cùng lúc và hai máy thu âm đặt ở hai chỗ. Mỗi máy thu âm thu một hỗn hợp của cả hai giọng. Phân tích thành phần độc lập tìm lại từng giọng gốc, chỉ từ hai bản ghi, mà không biết cách trộn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: không tương quan chưa phải độc lập"
    steps:
      - show: |
          <p>Bài 15: $\operatorname{Cov} = 0$ nghĩa là không có xu hướng đường thẳng — nhưng chưa chắc độc lập (ví dụ $X$ bằng −1, 0, 1 và $Y = X^2$).</p>
          <p>Bài 16: PCA tìm các trục để dữ liệu <b>không tương quan</b>. Bài 13: độc lập nghĩa là biết cái này không cho thêm thông tin gì về cái kia — mạnh hơn nhiều.</p>
        focus: [1, 2, 2]
        say: "Nhắc lại bài 15, hiệp phương sai bằng 0 chỉ nghĩa là không có xu hướng đường thẳng, chưa chắc độc lập, như ví dụ X và X bình phương. Phân tích thành phần chính chỉ làm các trục không tương quan. Còn độc lập, như bài 13, mạnh hơn nhiều."

  # ───────────────────────── 3. ĐỘ NHỌN ─────────────────────────
  - id: sym_kurt
    kind: symbol
    title: "Giải mã: độ nhọn E[y⁴] − 3 — đo “khác chuẩn” bao nhiêu"
    checks:
      - "(lambda S: round(float(np.mean(S[0]**4) - 3), 2) == -1.18)(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
      - "(lambda u: sp.integrate(u**4/(2*sp.sqrt(3)), (u, -sp.sqrt(3), sp.sqrt(3))) - 3 == -Rational(6, 5))(sp.Symbol('u'))"
    steps:
      - show: |
          <div class="box key">Với $y$ có trung bình 0, phương sai 1: &nbsp; độ nhọn $= \mathbb{E}[y^4] - 3$ &nbsp; — bằng <b>0</b> với phân phối chuẩn (bài 14)</div>
          <p>Phân phối đều (trung bình 0, phương sai 1): lý thuyết $-1{,}2$; 5000 mẫu: $\hlg{-1{,}18}$. Giọng nói thật: độ nhọn dương (nhiều lúc im, thỉnh thoảng to).</p>
          <p class="note">Ý chính (định lý giới hạn trung tâm): <b>trộn</b> nhiều nguồn độc lập làm tín hiệu <b>giống chuẩn hơn</b>. Vậy tìm hướng làm $y$ <b>ít chuẩn nhất</b> sẽ tìm ra một nguồn gốc.</p>
        focus: [1, 2, 3]
        say: "Độ nhọn của một biến đã chuẩn hoá là kỳ vọng của mũ bốn trừ 3, bằng 0 với phân phối chuẩn của bài 14. Phân phối đều có độ nhọn âm 1 phẩy 2. Ý chính là trộn nhiều nguồn độc lập làm tín hiệu giống chuẩn hơn, nên hướng ít chuẩn nhất sẽ chỉ ra một nguồn gốc."

  - id: mix_pic
    kind: intuition
    title: "Nhìn phép trộn và phép gỡ trộn trên mặt phẳng"
    checks:
      - "(lambda A: (lambda Q: np.allclose(Q @ Q.T, np.eye(2)) and round(math.degrees(math.atan2(-Q[1, 0], Q[0, 0])), 1) == 9.5)((lambda ev, E: E @ np.diag(ev**-0.5) @ E.T @ A)(*np.linalg.eigh(A @ A.T))))(np.array([[1, 1], [0.5, 2.]]))"
      - "np.allclose(np.array([[1, 1], [0.5, 2.]]) @ np.array([math.sqrt(3), math.sqrt(3)]), [2*math.sqrt(3), 2.5*math.sqrt(3)])"
    steps:
      - show: |
          <svg width="1250" height="490" viewBox="0 0 1250 490"><defs><marker id="arI38" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><line x1="20" y1="215" x2="380" y2="215" stroke="#9ca3af" stroke-width="1.5"/><line x1="200" y1="25" x2="200" y2="405" stroke="#9ca3af" stroke-width="1.5"/><line x1="445" y1="215" x2="805" y2="215" stroke="#9ca3af" stroke-width="1.5"/><line x1="625" y1="25" x2="625" y2="405" stroke="#9ca3af" stroke-width="1.5"/><line x1="870" y1="215" x2="1230" y2="215" stroke="#9ca3af" stroke-width="1.5"/><line x1="1050" y1="25" x2="1050" y2="405" stroke="#9ca3af" stroke-width="1.5"/><polygon points="269,146 269,284 131,284 131,146" fill="#dbeafe" stroke="#2563eb" stroke-width="3" fill-opacity="0.6"/><polygon points="764,42 625,319 486,388 625,111" fill="#fde68a" stroke="#d97706" stroke-width="3" fill-opacity="0.6"/><polygon points="1130,158 1107,295 970,272 993,135" fill="#bbf7d0" stroke="#059669" stroke-width="3" fill-opacity="0.6"/><g stroke="#1f2937" stroke-width="3"><line x1="330" y1="120" x2="480" y2="120" marker-end="url(#arI38)"/><line x1="770" y1="120" x2="910" y2="120" marker-end="url(#arI38)"/></g><g font-size="22" text-anchor="middle" fill="#1f2937"><text x="405" y="105">trộn bằng A</text><text x="840" y="105">làm trắng</text></g><g font-size="22" text-anchor="middle"><text x="200" y="440" fill="#2563eb">nguồn s: hình vuông</text><text x="625" y="440" fill="#d97706">hai micro x = A s: hình bình hành</text><text x="1050" y="440" fill="#059669">vuông lại, chỉ lệch góc ≈ 9,5°</text><text x="625" y="478" fill="#1f2937">bước cuối: xoay ngược góc đó cho cạnh hình vuông thẳng với trục — tách xong</text></g></svg>
        say: "Hình này vẽ toàn bộ dữ liệu lên mặt phẳng, mỗi trục là một tín hiệu. Hai nguồn phân phối đều, độc lập, phủ kín một hình vuông màu xanh. Phép trộn A kéo hình vuông thành hình bình hành màu vàng, hai máy thu âm không còn độc lập nữa. Bước làm trắng kéo nó về lại một hình vuông, nhưng còn lệch một góc khoảng 9 phẩy 5 độ. Bước cuối chỉ cần xoay ngược góc đó cho các cạnh thẳng với trục, và hai nguồn được tách ra."

  # ───────────────────────── 4. THUẬT TOÁN ─────────────────────────
  - id: algorithm
    kind: formula
    title: "Hai bước: làm trắng bằng PCA, rồi xoay"
    checks:
      - "(lambda S: (lambda X: (lambda Xc: (lambda ev, E: np.allclose((E @ np.diag(ev**-0.5) @ E.T @ Xc) @ (E @ np.diag(ev**-0.5) @ E.T @ Xc).T/5000, np.eye(2)))(*np.linalg.eigh(Xc @ Xc.T/5000)))(X - X.mean(1, keepdims=True)))(np.array([[1, 1], [0.5, 2.]]) @ S))(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
    steps:
      - show: |
          <p>① <b>Làm trắng</b> (bài 16): trừ trung bình, xoay theo trục chính, chia mỗi trục cho độ lệch chuẩn của nó → ma trận hiệp phương sai thành $\mathbf{I}$ (không tương quan, phương sai 1).</p>
          <p>② Sau khi làm trắng, nguồn gốc chỉ còn cách một <b>phép xoay</b>. Thử các góc $\theta$, chọn góc làm hai thành phần có tổng $|$độ nhọn$|$ lớn nhất.</p>
          <p class="note">Bước ① là PCA; bước ② là phần PCA không làm được — vì sau làm trắng, mọi góc xoay đều cho hiệp phương sai $\mathbf{I}$.</p>
        focus: [0, 1, 2]
        say: "Thuật toán có hai bước. Bước một làm trắng bằng phân tích thành phần chính của bài 16, xoay theo trục chính rồi chia cho độ lệch chuẩn, nên ma trận hiệp phương sai thành ma trận đơn vị. Bước hai, nguồn gốc chỉ còn cách một phép xoay, ta thử các góc và chọn góc ít chuẩn nhất."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ: tách hai nguồn đều bị trộn"
    checks:
      - "(lambda S: (lambda X: (lambda Xc: (lambda Z: (lambda Y: [round(abs(float(np.corrcoef(Y[i], S[i])[0, 1])), 3) for i in range(2)] == [1.0, 1.0])(max(((lambda R: R @ Z)(np.array([[math.cos(t), -math.sin(t)], [math.sin(t), math.cos(t)]])) for t in np.linspace(0, math.pi/2, 901)), key=lambda Y: abs(np.mean(Y[0]**4) - 3) + abs(np.mean(Y[1]**4) - 3))))((lambda ev, E: E @ np.diag(ev**-0.5) @ E.T @ Xc)(*np.linalg.eigh(Xc @ Xc.T/5000))))(X - X.mean(1, keepdims=True)))(np.array([[1, 1], [0.5, 2.]]) @ S))(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
      - "(lambda S: [round(float(np.corrcoef((np.array([[1, 1], [0.5, 2.]]) @ S)[0], S[i])[0, 1]), 3) for i in range(2)] == [0.704, 0.699])(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
    steps:
      - show: |
          <p>Hai nguồn đều, độc lập, 5000 mẫu; trộn bằng $\mathbf{A} = \begin{bmatrix} 1 & 1 \\ 0{,}5 & 2 \end{bmatrix}$.</p>
          <table class="t"><tr><th></th><th>độ lớn tương quan với nguồn 1</th><th>với nguồn 2</th></tr>
          <tr><td>micro 1 (hỗn hợp)</td><td>0,704</td><td>0,699</td></tr>
          <tr><td>thành phần tìm được 1</td><td>$\hlg{1{,}000}$</td><td>≈ 0</td></tr>
          <tr><td>thành phần tìm được 2</td><td>≈ 0</td><td>$\hlg{1{,}000}$</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"]]
        say: "Ví dụ hai nguồn phân phối đều, độc lập, trộn bằng ma trận A trên màn hình. Máy thu thứ nhất tương quan khoảng 0 phẩy 7 với cả hai nguồn, tức là trộn đều. Sau khi làm trắng và xoay, hai thành phần tìm được tương quan đúng 1 với từng nguồn."
      - show: |
          <p class="note">Kết quả có thể ra đúng nguồn nhưng <b>khác thứ tự, khác tỉ lệ, đổi dấu</b> — vì $\mathbf{A}\mathbf{s}$ không đổi nếu đổi chỗ hai nguồn (và hai cột của $\mathbf{A}$), hay nhân một nguồn với 2 và chia cột tương ứng cho 2.</p>
        say: "Lưu ý, kết quả có thể ra đúng nguồn nhưng khác thứ tự, khác tỉ lệ hoặc đổi dấu. Lý do là đổi chỗ hai nguồn cùng hai cột của A, hay nhân một nguồn với 2 và chia cột tương ứng cho 2, hỗn hợp vẫn y như cũ."

  - id: hand_mix
    kind: example
    title: "Làm tay: vì sao micro trộn đều và giống chuẩn hơn"
    checks:
      - "(np.array([[1, 1], [0.5, 2.]]) @ np.array([[1, 1], [0.5, 2.]]).T).tolist() == [[2.0, 2.5], [2.5, 4.25]]"
      - "round(1/math.sqrt(2), 3) == 0.707"
      - "(lambda u: (lambda m4: m4 == Rational(9, 5) and m4 + 6*1*1 + m4 == Rational(48, 5))(sp.integrate(u**4/(2*sp.sqrt(3)), (u, -sp.sqrt(3), sp.sqrt(3)))))(sp.Symbol('u'))"
      - "Rational(48, 5)/2**2 - 3 == Rational(-3, 5) and (lambda S: (lambda x: abs(float(np.mean(x**4) - 3) - (-0.6)) < 0.05 and round(float(np.mean(x**4) - 3), 2) == -0.64)((S[0] + S[1] - (S[0] + S[1]).mean())/(S[0] + S[1]).std()))(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
    steps:
      - show: |
          <p><b>Bước 1.</b> Hai nguồn độc lập, mỗi nguồn phương sai 1, nên hiệp phương sai của hai micro là:</p>
          $$\operatorname{Cov}(\mathbf{x}) = \mathbf{A}\mathbf{A}^T = \begin{bmatrix} 1 & 1 \\ 0{,}5 & 2 \end{bmatrix}\begin{bmatrix} 1 & 0{,}5 \\ 1 & 2 \end{bmatrix} = \begin{bmatrix} 2 & 2{,}5 \\ 2{,}5 & 4{,}25 \end{bmatrix}$$
        focus: [1, 2]
        say: "Bước một, hai nguồn độc lập, mỗi nguồn có phương sai 1, nên ma trận hiệp phương sai của hai máy thu âm bằng A nhân A chuyển vị. Nhân ra, máy thu âm 1 có phương sai 2, máy thu âm 2 có phương sai 4 phẩy 25, và hai máy thu âm có hiệp phương sai 2 phẩy 5."
      - show: |
          <p><b>Bước 2.</b> Micro 1 là $x_1 = s_1 + s_2$, nên $\operatorname{Cov}(x_1, s_1) = 1$. Chia cho hai độ lệch chuẩn $\sqrt{2}$ và 1:</p>
          $$\text{tương quan}(x_1, s_1) = \frac{1}{\sqrt{2}\cdot 1} \approx \hlg{0{,}707} = \text{tương quan}(x_1, s_2)$$
          <p class="note">Khớp với 0,704 và 0,699 đo trên 5000 mẫu ở bảng trên.</p>
        focus: [1, 2, 3]
        say: "Bước hai, máy thu âm 1 bằng nguồn 1 cộng nguồn 2, nên hiệp phương sai của nó với nguồn 1 bằng 1. Chia cho hai độ lệch chuẩn, căn 2 và 1, được tương quan xấp xỉ 0 phẩy 707, và với nguồn 2 cũng vậy. Con số lý thuyết này khớp với 0 phẩy 704 và 0 phẩy 699 đo trên 5000 mẫu."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Khai triển $(s_1 + s_2)^4$; các số hạng có mũ lẻ có kỳ vọng 0 (vì nguồn độc lập, trung bình 0). Dùng $\mathbb{E}[s^4] = -1{,}2 + 3 = 1{,}8$:</p>
          $$\mathbb{E}[x_1^4] = \mathbb{E}[s_1^4] + 6\,\mathbb{E}[s_1^2]\,\mathbb{E}[s_2^2] + \mathbb{E}[s_2^4] = 1{,}8 + 6 + 1{,}8 = 9{,}6$$
        focus: [1, 1, 2]
        say: "Bước ba, ta khai triển tổng mũ bốn. Các số hạng có mũ lẻ có kỳ vọng bằng 0, vì hai nguồn độc lập và trung bình bằng 0. Còn lại 1 phẩy 8, cộng 6, cộng 1 phẩy 8, bằng 9 phẩy 6, trong đó 1 phẩy 8 là độ nhọn âm 1 phẩy 2 cộng 3."
      - show: |
          <p><b>Bước 4.</b> Chuẩn hoá: chia cho bình phương phương sai, $2^2 = 4$, rồi trừ 3:</p>
          $$\text{độ nhọn}(x_1) = \frac{9{,}6}{4} - 3 = \hlo{-0{,}6} \qquad (\text{nguồn: } -1{,}2;\ \ \text{chuẩn: } 0)$$
          <p class="note">Trộn hai nguồn làm độ nhọn giảm một nửa về phía 0: micro “giống chuẩn hơn” nguồn. 5000 mẫu cho ≈ −0,64.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, chuẩn hoá bằng cách chia cho bình phương phương sai, tức là 4, rồi trừ 3, được âm 0 phẩy 6. Nguồn có độ nhọn âm 1 phẩy 2, còn máy thu âm chỉ còn một nửa, gần phân phối chuẩn hơn. Đó chính là lý do tìm hướng ít chuẩn nhất sẽ gỡ được phép trộn."

  # ───────────────────────── 6. NGUỒN CHUẨN THẤT BẠI ─────────────────────────
  - id: gaussian
    kind: concept
    title: "Vì sao nguồn không được là phân phối chuẩn"
    checks:
      - "(lambda G: [round(float(np.mean(g**4) - 3), 2) for g in G] == [-0.15, 0.05])(np.random.default_rng(0).normal(size=(2, 5000)))"
    steps:
      - show: |
          <p>Hai nguồn chuẩn độc lập, phương sai 1: mật độ chung hình <b>tròn</b> (bài 15 với $\mathbf{\Sigma} = \mathbf{I}$). Xoay bất kỳ góc nào vẫn là hai nguồn chuẩn độc lập — không có góc nào “đúng” hơn.</p>
          <p>Hai nguồn chuẩn, 5000 mẫu: độ nhọn $-0{,}15$ và $0{,}05$ — chỉ là dao động ngẫu nhiên quanh 0, nhỏ so với $-1{,}18$ của phân phối đều. Mọi góc xoay đều cho độ nhọn gần 0, không có gì để tìm.</p>
          <div class="box key">Phân tích thành phần độc lập cần nguồn <b>không</b> chuẩn — tối đa một nguồn được phép chuẩn.</div>
        focus: [0, 1, 3]
        say: "Vì sao nguồn không được là phân phối chuẩn? Hai nguồn chuẩn độc lập có mật độ chung hình tròn, nên xoay góc nào cũng vẫn là hai nguồn chuẩn độc lập, không có góc nào đúng hơn. Vì vậy cần nguồn không chuẩn, và tối đa chỉ một nguồn được phép chuẩn."

  # ───────────────────────── 7. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: sau làm trắng, hiệp phương sai đúng bằng I"
    checks:
      - "(lambda S: np.allclose(np.cov(np.array([[1, 1], [0.5, 2.]]) @ S, bias=True), [[2, 2.5], [2.5, 4.25]], atol=0.1))(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
      - "(lambda S: (lambda X: (lambda Xc: (lambda ev, E: np.allclose(np.cov(E @ np.diag(ev**-0.5) @ E.T @ Xc, bias=True), np.eye(2)))(*np.linalg.eigh(Xc @ Xc.T/5000)))(X - X.mean(1, keepdims=True)))(np.array([[1, 1], [0.5, 2.]]) @ S))(np.random.default_rng(0).uniform(-math.sqrt(3), math.sqrt(3), (2, 5000)))"
    steps:
      - show: |
          <table class="t"><tr><th>máy đo lại trên 5000 mẫu</th><th>kết quả</th></tr>
          <tr><td>hiệp phương sai sau làm trắng</td><td>đúng $\mathbf{I}$ $\checkmark$</td></tr>
          <tr><td>hiệp phương sai của hai micro</td><td>≈ $\begin{bmatrix} 2 & 2{,}5 \\ 2{,}5 & 4{,}25 \end{bmatrix}$ như bước 1 $\checkmark$</td></tr></table>
          <p>Vậy mọi khác biệt còn lại chỉ nằm ở <b>phép xoay</b> — chính phần độ nhọn tìm ra trong ví dụ.</p>
        focus: ["1.2", 2, "1.3"]
        say: "Phép thử, sau bước làm trắng, máy tính lại ma trận hiệp phương sai và được đúng ma trận đơn vị. Vậy mọi khác biệt còn lại chỉ nằm ở phép xoay, chính phần mà độ nhọn tìm ra trong ví dụ. Máy cũng đo hiệp phương sai của hai máy thu âm trên 5000 mẫu, nên ta được gần đúng ma trận đã nhân tay ở bước một."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "(lambda u: (lambda m4: (m4 - 3, 16*m4 - 3, 16*m4/16 - 3, 16*m4) == (Rational(-6, 5), Rational(129, 5), Rational(-6, 5), Rational(144, 5)))(sp.integrate(u**4/(2*sp.sqrt(3)), (u, -sp.sqrt(3), sp.sqrt(3)))))(sp.Symbol('u'))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ PCA đã tách được nguồn <b class="red">(sai)</b>
          <br><span class="note">PCA chỉ làm không tương quan; còn sai một phép xoay.</span></div>
        say: "Lỗi thứ nhất, nghĩ phân tích thành phần chính đã tách được nguồn. Nó chỉ làm các thành phần không tương quan, và còn sai một phép xoay."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc thứ tự, độ lớn, dấu của thành phần như của nguồn gốc <b class="red">(sai)</b>
          <br><span class="note">Ba thứ này không xác định được — so bằng hình dạng tín hiệu.</span></div>
        say: "Lỗi thứ hai, đọc thứ tự, độ lớn hay dấu của thành phần như của nguồn gốc. Ba thứ này không xác định được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng khi nguồn gần như chuẩn, hoặc số micro ít hơn số nguồn <b class="red">(không tách được)</b>
          <br><span class="note">Cần nguồn không chuẩn và đủ số tín hiệu đo.</span></div>
        say: "Lỗi thứ ba, dùng khi nguồn gần như chuẩn, hoặc khi số máy thu âm ít hơn số nguồn. Khi đó không tách được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tự viết hàm độ nhọn mà <b>quên chuẩn hoá</b> phương sai về 1 <b class="red">(chọn nhầm hướng)</b></div>
          <table class="t"><tr><th>tín hiệu</th><th>$\mathbb{E}[y^4] - 3$ (quên chuẩn hoá)</th><th>$\frac{\mathbb{E}[y^4]}{(\text{phương sai})^2} - 3$</th></tr>
          <tr><td>nguồn đều $s$, phương sai 1</td><td>$1{,}8 - 3 = -1{,}2$</td><td>$-1{,}2$</td></tr>
          <tr><td>$y = 2s$, phương sai 4</td><td>$16\cdot 1{,}8 - 3 = \hlo{25{,}8}$</td><td>$\frac{28{,}8}{16} - 3 = -1{,}2$</td></tr></table>
          <p class="note">Cùng một hình dạng phân phối, chỉ đổi thang đo. Không chuẩn hoá thì thuật toán chọn hướng có phương sai lớn — lại thành PCA.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tự viết hàm độ nhọn mà quên chuẩn hoá phương sai về 1. Với nguồn đều có phương sai 1, hai cách cho cùng âm 1 phẩy 2. Nhưng nhân tín hiệu với 2, cách quên chuẩn hoá cho 25 phẩy 8, trông rất khác chuẩn, dù hình dạng phân phối không đổi. Khi đó thuật toán chỉ chọn hướng có phương sai lớn, tức là quay lại phân tích thành phần chính."

  # ───────────────────────── 9. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "Matrix([[1, 1], [Rational(1, 2), 2]])*Matrix([1, -1]) == Matrix([0, Rational(-3, 2)])"
      - "Matrix([[1, 1], [Rational(1, 2), 2]]).inv()*Matrix([0, Rational(-3, 2)]) == Matrix([1, -1])"
      - "Matrix([[1, 1], [Rational(1, 2), 2]]).det() == Rational(3, 2) and Matrix([[1, 1], [Rational(1, 2), 2]]).inv() == Rational(2, 3)*Matrix([[2, -1], [Rational(-1, 2), 1]]) and (lambda y: sp.integrate(y**4*sp.exp(-y**2/2)/sp.sqrt(2*sp.pi), (y, -sp.oo, sp.oo)))(sp.Symbol('y')) == 3 and Matrix([[1, 1, 1], [1, 2, 3]]).rank() == 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\mathbf{s} = (1;\ -1)$, $\mathbf{A}$ như ví dụ. Tính $\mathbf{x}$.</td></tr>
          <tr><td>2</td><td>Nếu biết $\mathbf{A}$, lấy lại $\mathbf{s}$ bằng cách nào? Làm thử với $\mathbf{x}$ của câu 1.</td></tr>
          <tr><td>3</td><td>Độ nhọn của phân phối chuẩn bằng bao nhiêu?</td></tr>
          <tr><td>4</td><td>Ba người nói cùng lúc, chỉ đặt được hai micro. Có nên chạy phân tích thành phần độc lập để tách ba giọng?</td></tr></table>
        focus: [0, "1.5", 0]
        say: "Bây giờ đến lượt bạn, với bốn câu trên màn hình. Câu cuối là một quyết định, có nên tách ba giọng bằng hai máy thu âm hay không. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\mathbf{x} = (1\cdot 1 + 1\cdot(-1);\ \ 0{,}5\cdot 1 + 2\cdot(-1)) = (\hlg{0;\ -1{,}5})$</p>
          $$\text{②}\ \ \det\mathbf{A} = 1\cdot 2 - 1\cdot 0{,}5 = 1{,}5, \quad \mathbf{A}^{-1}\mathbf{x} = \frac{1}{1{,}5}\begin{bmatrix} 2 & -1 \\ -0{,}5 & 1 \end{bmatrix}\begin{bmatrix} 0 \\ -1{,}5 \end{bmatrix} = \begin{bmatrix} 1 \\ -1 \end{bmatrix} \checkmark$$
        introduces: [det]
        focus: [1, 2, 2, 2]
        say: "Câu một, nhân từng hàng của A với s, được 0 và âm 1 phẩy 5. Câu hai, nếu biết A thì nhân với ma trận nghịch đảo của A, như bài 2. Định thức bằng 1 phẩy 5, và nhân ra được đúng 1, âm 1, khớp với s của câu một. Nhưng cái khó của bài toán là ta không biết A."
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước</th><th>đáp số</th></tr>
          <tr><td>③</td><td>phân phối chuẩn: $\mathbb{E}[y^4] = 3$, nên $3 - 3$</td><td>$\hlg{0}$</td></tr>
          <tr><td>④</td><td>3 nguồn, 2 micro: $\mathbf{A}$ có 2 hàng, 3 cột, không có nghịch đảo; mỗi thời điểm chỉ có 2 phương trình cho 3 ẩn</td><td>$\hlo{\text{không nên}}$ — đặt thêm ít nhất 1 micro</td></tr></table>
        focus: ["1.2", "1.3", "1.3"]
        say: "Câu ba, phân phối chuẩn có kỳ vọng mũ bốn bằng 3, nên độ nhọn bằng 3 trừ 3, bằng 0. Câu bốn, ba nguồn mà chỉ hai máy thu âm thì ma trận trộn có hai hàng, ba cột, không có nghịch đảo, mỗi lúc chỉ có hai phương trình cho ba ẩn. Vậy không nên chạy như thế, hãy đặt thêm ít nhất một máy thu âm."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$\mathbf{x} = \mathbf{A}\mathbf{s}$, nguồn độc lập</span><span class="a">→</span>
          <span class="n">làm trắng (PCA): không tương quan</span><span class="a">→</span>
          <span class="n">xoay: ít chuẩn nhất (độ nhọn)</span><span class="a">→</span>
          <span class="n">cần nguồn không chuẩn; mất thứ tự, tỉ lệ, dấu</span></div>
        say: "Tổng kết chuỗi logic. Tín hiệu đo là hỗn hợp tuyến tính của các nguồn độc lập. Làm trắng bằng phân tích thành phần chính, rồi xoay để các thành phần ít chuẩn nhất. Cần nguồn không chuẩn, và không biết được thứ tự, tỉ lệ, dấu."
      - show: |
          <div class="box key"><b>Tư duy:</b> “trộn làm mọi thứ giống chuẩn hơn” — nên muốn gỡ trộn, hãy tìm hướng bất thường nhất.</div>
        say: "Điều cần mang theo, trộn làm mọi thứ giống phân phối chuẩn hơn, nên muốn gỡ trộn, hãy tìm hướng bất thường nhất."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 39): <b>học tăng cường</b> — quá trình quyết định Markov, phương trình Bellman và Q-learning.</p>
        forward_ref: true
        say: "Ở bài sau, bài 39, ta học học tăng cường, cách một tác tử học hành động tốt nhất qua phần thưởng. Hẹn gặp bạn ở bài tiếp theo."
