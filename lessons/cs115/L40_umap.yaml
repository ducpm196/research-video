  kind: intuition
  title: 'Nhìn thấy cơ chế: đồ thị láng giềng, rồi kéo và đẩy'
  checks:
  - '[round(math.exp(-(d - 1)), 3) for d in (1, 1.5, 3)] == [1.0, 0.607, 0.135]'
  steps:
  - show: |
      <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arG40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arR40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><text x="330" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">không gian gốc: đồ thị k = 3 láng giềng của i</text><line x1="130" y1="210" x2="230" y2="120" stroke="#2563eb" stroke-width="12"/><line x1="130" y1="210" x2="280" y2="280" stroke="#2563eb" stroke-width="7"/><line x1="130" y1="210" x2="430" y2="210" stroke="#2563eb" stroke-width="2"/><circle cx="130" cy="210" r="24" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="130" y="218" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">i</text><circle cx="230" cy="120" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="230" y="128" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">a</text><circle cx="280" cy="280" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="280" y="288" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">b</text><circle cx="430" cy="210" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="430" y="218" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">c</text><circle cx="580" cy="150" r="24" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="580" y="158" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">m</text><g font-size="20" fill="#2563eb"><text x="80" y="150">w = 1</text><text x="120" y="290">w = 0,607</text><text x="290" y="240">w = 0,135</text></g><text x="580" y="110" font-size="20" text-anchor="middle" fill="#6b7280">m: không có cạnh</text><text x="330" y="395" font-size="20" text-anchor="middle" fill="#374151">cạnh dày hơn biểu thị hai điểm gần chắc là láng giềng</text><line x1="700" y1="60" x2="700" y2="400" stroke="#d1d5db" stroke-width="3"/><text x="1090" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">mặt phẳng: dời điểm để giảm sai số</text><circle cx="900" cy="210" r="24" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="900" y="218" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">i</text><circle cx="1120" cy="120" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1120" y="128" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">a</text><circle cx="1140" cy="290" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1140" y="298" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">b</text><circle cx="1070" cy="220" r="24" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1070" y="228" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">m</text><line x1="1096" y1="128" x2="960" y2="180" stroke="#15803d" stroke-width="4" marker-end="url(#arG40)"/><line x1="1116" y1="282" x2="970" y2="245" stroke="#15803d" stroke-width="4" marker-end="url(#arG40)"/><line x1="1094" y1="220" x2="1300" y2="220" stroke="#b91c1c" stroke-width="4" marker-end="url(#arR40)"/><g font-size="20"><text x="1160" y="128" fill="#15803d">vế đầu kéo lại (w lớn)</text><text x="1180" y="205" fill="#b91c1c">vế sau đẩy ra (w = 0)</text><text x="1060" y="345" fill="#15803d">kéo lại</text></g><text x="1090" y="395" font-size="20" text-anchor="middle" fill="#374151">dừng khi độ giống v trên hình gần bằng w của đồ thị</text></svg></div>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bên trái là không gian gốc, điểm i nối với ba láng giềng gần nhất a, b, c, độ dày cạnh là trọng số vừa tính, 1, 0 phẩy 607 và 0 phẩy 135. Điểm m ở xa hơn nên không có cạnh nào, trọng số bằng 0. Bên phải là mặt phẳng, các điểm được đặt tuỳ ý lúc đầu, rồi được dời dần. Láng giềng có trọng số lớn bị mũi tên xanh kéo lại gần i, còn m bị mũi tên đỏ đẩy ra xa, cho tới khi độ giống trên hình gần bằng trọng số của đồ thị.
- id: loss
  kind: formula
  title: 'Tìm toạ độ: entropy chéo nhị phân trên từng cạnh'
  checks:
  - '(lambda bce: [round(bce(0.8, v), 4) for v in (0.5, 0.8, 0.95)] == [0.6931, 0.5004, 0.6402])(lambda w, v: -(w*math.log(v) + (1 - w)*math.log(1 - v)))'
  steps:
  - show: |
      <p>Ở mặt phẳng, độ giống $v_{ij}$ giảm theo khoảng cách (đuôi dày, giống bài 32). Dời các điểm (gradient descent) để làm nhỏ:</p>
      <div class="box key">$\sum_{\text{cặp } ij} -\Big[w_{ij}\ln v_{ij} + (1 - w_{ij})\ln(1 - v_{ij})\Big]$ &nbsp; — vế đầu <b>kéo</b> láng giềng lại gần, vế sau <b>đẩy</b> các điểm không phải láng giềng ra xa</div>
      <p>Một cạnh $w = 0{,}8$: $\ v = 0{,}5 \to 0{,}693$; &nbsp; $v = 0{,}8 \to \hlg{0{,}500}$ (nhỏ nhất); &nbsp; $v = 0{,}95 \to 0{,}640$</p>
    focus:
    - 1
    - - 1
      - 2
    - 2
    - 3
    say: Ở mặt phẳng, độ giống giảm theo khoảng cách. Ta dời các điểm bằng gradient descent để làm nhỏ entropy chéo nhị phân của bài 20 trên từng cặp. Vế đầu kéo láng giềng lại gần, vế sau đẩy các điểm không phải láng giềng ra xa. Thay số, sai số nhỏ nhất khi v bằng đúng w.
- id: hand_w
  kind: example
  title: 'Làm tay từng bước: từ khoảng cách tới sai số của một cạnh'
  checks:
  - '[d - 2 for d in (2, 2.5, 4)] == [0, 0.5, 2] and [round(math.exp(-(d - 2)), 3) for d in (2, 2.5, 4)] == [1.0, 0.607, 0.135]'
  - round(0.607 + 0.4 - 0.607*0.4, 4) == 0.7642 and round(0.607*0.4, 4) == 0.2428
  - '(lambda bce: [round(bce(0.7642, v), 3) for v in (0.5, 0.7642, 0.95)] == [0.693, 0.546, 0.746])(lambda w, v: -(w*math.log(v) + (1 - w)*math.log(1 - v)))'
  steps:
  - show: |
      <p>Điểm $i$ có 3 láng giềng ở khoảng cách 2; 2,5; 4, $\sigma_i = 1$.</p>
      <p><b>Bước 1 — trừ $\rho_i$</b>: láng giềng gần nhất cách 2, nên $\rho_i = 2$.</p>
      $$d - \rho_i:\quad 2 - 2 = 0,\qquad 2{,}5 - 2 = 0{,}5,\qquad 4 - 2 = 2$$
    focus:
    - 1
    - 2
    - 3
    say: Làm tay một ví dụ mới, điểm i có ba láng giềng ở khoảng cách 2, 2 phẩy 5 và 4, với xích ma bằng 1. Bước một, láng giềng gần nhất cách 2, nên rô bằng 2, và ta trừ 2 khỏi mỗi khoảng cách. Được 0, 0 phẩy 5 và 2.
  - show: |
      <p><b>Bước 2 — lấy $e$ mũ âm</b> (bảng ôn nền):</p>
      $$w_{j\mid i}:\quad e^{0} = \hlg{1},\qquad e^{-0{,}5} \approx 0{,}607,\qquad e^{-2} \approx 0{,}135$$
    focus:
    - 1
    - 2
    say: Bước hai, lấy e mũ âm của ba số đó, tra bảng của phần ôn nền. Được 1, 0 phẩy 607 và 0 phẩy 135, và láng giềng gần nhất luôn có trọng số 1 vì đã trừ đúng khoảng cách của nó.
  - clear: true
    show: |
      <p><b>Bước 3 — gộp hai chiều</b>: láng giềng thứ hai nhìn lại $i$ với trọng số 0,4. Dùng “hoặc”:</p>
      $$0{,}607 + 0{,}4 - 0{,}607\cdot 0{,}4 = 1{,}007 - 0{,}2428 = \hlg{0{,}7642}$$
      <p class="note">Nếu gộp bằng “và” (chỉ lấy tích) thì chỉ còn 0,2428: cạnh gần như mất, dù $i$ khá chắc đó là láng giềng.</p>
    focus:
    - 1
    - 2
    - 3
    say: Bước ba, gộp hai chiều, vì láng giềng thứ hai nhìn lại i chỉ với trọng số 0 phẩy 4. Theo phép hoặc, tổng là 1 phẩy 007, trừ tích 0 phẩy 2428, được 0 phẩy 7642. Nếu lấy phép và, tức là chỉ lấy tích, cạnh chỉ còn 0 phẩy 2428, gần như mất.
  - show: |
      <p><b>Bước 4 — sai số của cạnh này</b> ($w = 0{,}7642$) theo độ giống $v$ trên mặt phẳng:</p>
      <table class="t"><tr><th>$v$</th><th>0,5</th><th>0,7642</th><th>0,95</th></tr>
      <tr><td>sai số</td><td>0,693</td><td>$\hlg{0{,}546}$</td><td>0,746</td></tr></table>
    focus:
    - 1
    - '2.2'
    - '2.2'
    say: Bước bốn, thay trọng số 0 phẩy 7642 vào entropy chéo nhị phân, với ba độ giống v khác nhau trên mặt phẳng. Đặt v bằng 0 phẩy 5 thì sai số 0 phẩy 693, đặt quá gần với v bằng 0 phẩy 95 thì sai số 0 phẩy 746. Nhỏ nhất là 0 phẩy 546, khi v bằng đúng w.
- id: compare
  kind: example
  title: So sánh với t-SNE
  steps:
  - show: |
      <table class="t"><tr><th></th><th>t-SNE (bài 32)</th><th>UMAP</th></tr>
      <tr><td>độ giống gốc</td><td>xác suất, chia tổng mọi điểm</td><td>trọng số cạnh trên đồ thị $k$ láng giềng</td></tr>
      <tr><td>hàm sai số</td><td>độ lệch KL</td><td>entropy chéo nhị phân (có vế đẩy ra)</td></tr>
      <tr><td>tham số chính</td><td>độ bối rối</td><td>số láng giềng $k$, khoảng cách tối thiểu (hai điểm trên hình được đặt gần nhau tới mức nào — nhỏ thì cụm chụm chặt)</td></tr>
      <tr><td>điểm mới</td><td>phải chạy lại</td><td>có thể đặt điểm mới (theo cài đặt của thư viện)</td></tr></table>
      <p class="note">“Nhanh hơn, giữ cấu trúc toàn cục tốt hơn” là kết quả <b>thực nghiệm</b> trong bài báo, không phải định lý. Như t-SNE: khoảng cách giữa các cụm trên hình không nhất thiết có nghĩa; kết quả đổi theo $k$ và khởi tạo.</p>
    focus:
    - - '1.2'
      - '1.3'
    - 2
    - 2
    say: So với phương pháp của bài 32, phương pháp này dùng trọng số cạnh trên đồ thị thay vì xác suất chia tổng, và dùng entropy chéo nhị phân có vế đẩy ra. Nhận định nó nhanh hơn và giữ cấu trúc toàn cục tốt hơn là kết quả thực nghiệm, không phải định lý. Khoảng cách giữa các cụm vẫn không nhất thiết có nghĩa.
  - clear: true
    show: |
      <table class="t"><tr><th>quy mô dữ liệu</th><th>tính mọi cặp $O(N^2)$</th><th>đồ thị $k$ láng giềng UMAP</th></tr>
      <tr><td>$N = 1\,000$ điểm</td><td>$10^6$ cặp (~1 ms)</td><td>~15 000 cạnh</td></tr>
      <tr><td>$N = 1\,000\,000$ điểm</td><td>$10^{12}$ cặp (tràn bộ nhớ)</td><td>dựng láng giềng gần đúng, giảm bậc gần tuyến tính nhưng không giữ khoảng cách toàn cục</td></tr></table>
    focus:
    - 1
    say: Ở hai mức quy mô, một nghìn điểm dễ dàng tính mọi cặp, còn một triệu điểm buộc phải dựng đồ thị láng giềng gần đúng để tránh tràn bộ nhớ.
- id: verify
  kind: check
  title: 'Phép thử: entropy chéo nhị phân nhỏ nhất đúng tại v = w'
  checks:
  - '(lambda g: [round(g(0.8, v), 3) for v in (0.5, 0.8, 0.95)] == [-1.2, 0.0, 3.158])(lambda w, v: -w/v + (1 - w)/(1 - v))'
  - '(lambda bce, g: abs(float(sp.diff(bce, sp.Symbol(''v'')).subs({''w'': 0.8, ''v'': 0.5})) - g) < 1e-12)(-(sp.Symbol(''w'')*sp.log(sp.Symbol(''v'')) + (1 - sp.Symbol(''w''))*sp.log(1 - sp.Symbol(''v''))), -1.2)'
  - '(lambda g: all(abs(float(g[int(np.argmin([-(w*math.log(v) + (1 - w)*math.log(1 - v)) for v in g]))]) - w) < 1e-3 for w in (0.2, 0.5, 0.8)))(np.arange(0.001, 0.999, 0.001))'
  steps:
  - show: |
      <p>Máy dò $v$ từ 0,001 đến 0,998 cho $w = 0{,}2$; $0{,}5$; $0{,}8$: sai số nhỏ nhất đúng tại $v = w$ $\checkmark$ — nên khi tối ưu xong, độ giống trên hình bám theo trọng số của đồ thị gốc.</p>
    say: Phép thử, máy dò mọi giá trị v cho ba giá trị w khác nhau, và sai số nhỏ nhất luôn đúng tại v bằng w. Nghĩa là khi tối ưu xong, độ giống trên hình bám theo trọng số của đồ thị gốc.
  - show: |
      <p>Đường khác, không dò: độ dốc của sai số theo $v$ là</p>
      $$-\frac{w}{v} + \frac{1 - w}{1 - v}$$
      <table class="t"><tr><th>$w = 0{,}8$</th><th>$v = 0{,}5$</th><th>$v = 0{,}8$</th><th>$v = 0{,}95$</th></tr>
      <tr><td>độ dốc</td><td>$-1{,}6 + 0{,}4 = -1{,}2$</td><td>$-1 + 1 = \hlg{0}$</td><td>$\approx -0{,}842 + 4 = 3{,}158$</td></tr></table>
    focus:
    - 1
    - 2
    - '3.2'
    - '3.2'
    say: Kiểm bằng đường khác, không dò mà tính độ dốc của sai số theo v, bằng âm w chia v cộng 1 trừ w chia 1 trừ v. Lấy w bằng 0 phẩy 8. Ở v bằng 0 phẩy 5 độ dốc âm, nên tăng v thì sai số còn giảm, ở v bằng 0 phẩy 95 độ dốc dương. Độ dốc bằng 0 đúng tại v bằng 0 phẩy 8, tức là v bằng w, khớp kết quả máy dò.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: |
      <div class="box warn"><b>Lỗi 1.</b> Coi nhận định “tốt hơn t-SNE” là luôn đúng <b class="red">(sai)</b>
      <br><span class="note">Đó là kết quả thực nghiệm; với dữ liệu khác có thể khác — thử cả hai.</span></div>
    say: Lỗi thứ nhất, coi nhận định tốt hơn là luôn đúng. Đó là kết quả thực nghiệm, với dữ liệu khác có thể khác, nên hãy thử cả hai.
  - show: |
      <div class="box warn"><b>Lỗi 2.</b> Đọc khoảng cách giữa các cụm, kích thước cụm <b class="red">(dễ sai)</b>
      <br><span class="note">Giống bài 32: chỉ tin quan hệ láng giềng gần.</span></div>
    say: Lỗi thứ hai, đọc khoảng cách giữa các cụm hay kích thước cụm. Giống bài 32, chỉ tin quan hệ láng giềng gần.
  - clear: true
    show: |
      <div class="box warn"><b>Lỗi 3.</b> Một lần chạy, một giá trị $k$ <b class="red">(dễ sai)</b>
      <br><span class="note">$k$ nhỏ nhấn cấu trúc cục bộ (láng giềng gần), $k$ lớn nhấn cấu trúc toàn cục (các cụm nằm ra sao so với nhau) — thử vài giá trị.</span></div>
    say: Lỗi thứ ba, chỉ chạy một lần với một giá trị k. K nhỏ nhấn cấu trúc cục bộ, tức láng giềng gần, k lớn nhấn cấu trúc toàn cục, tức các cụm nằm ra sao so với nhau, nên hãy thử vài giá trị.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(math.exp(-(2 - 1)/1), 3) == 0.368 and round(0.5 + 0.5 - 0.25, 2) == 0.75
  - round(1/math.e, 3) == 0.368 and 1 - 0.5*0.5 == 0.75
  steps:
  - show: |
      <table class="t"><tr><th>câu</th><th>đề</th></tr>
      <tr><td>1</td><td>$\rho_i = 1$, $\sigma_i = 1$, láng giềng ở khoảng cách 2: trọng số?</td></tr>
      <tr><td>2</td><td>$w_{j\mid i} = 0{,}5$, $w_{i\mid j} = 0{,}5$: trọng số đối xứng?</td></tr></table>
    say: Bây giờ đến lượt bạn, với hai câu trên màn hình. Hãy dừng video và làm ra giấy.
    pause: 8
  - show: |
      <p>① Trừ $\rho_i$: $\ 2 - 1 = 1$; chia $\sigma_i = 1$ vẫn là 1; lấy $e$ mũ âm:</p>
      $$w = \frac{1}{e} \approx \hlg{0{,}368}$$
    focus:
    - 1
    - 2
    say: Câu một, trừ rô bằng 1 khỏi khoảng cách 2 được 1, chia cho xích ma bằng 1 vẫn là 1. Lấy e mũ âm 1, tức là 1 chia e, xấp xỉ 0 phẩy 368, đúng ô thứ ba của bảng ôn nền.
  - show: |
      <p>② Phép “hoặc”: tổng $0{,}5 + 0{,}5 = 1$, trừ tích $0{,}5\cdot 0{,}5 = 0{,}25$:</p>
      $$w_{ij} = 1 - 0{,}25 = \hlg{0{,}75}$$
      <p class="note">Kiểm đường khác: xác suất <b>không</b> chiều nào thấy $= 0{,}5\cdot 0{,}5 = 0{,}25$, nên $1 - 0{,}25 = 0{,}75$ ✓</p>
    focus:
    - 1
    - 2
    - 3
    say: Câu hai, theo phép hoặc, tổng hai trọng số bằng 1, trừ tích 0 phẩy 25, được 0 phẩy 75. Kiểm bằng đường khác, xác suất không chiều nào thấy cạnh là 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Vậy 1 trừ 0 phẩy 25 cũng bằng 0 phẩy 75.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/CS115/L40
  steps:
  - show: '<table class=''t''><tr><th>Thực hành CS115:L40</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/CS115/L40/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>UMAP: trọng số đối xứng hoá đồ thị 1 láng giềng gần nhất (1-NN)</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>w_near_01=... w_cross_12=...<br/>keeps_cluster=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh CS115 L40 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>'
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (2 dòng)</b></p><div class="code"><div>w_near_01=1.00 w_cross_12=0.0200</div><div>keeps_cluster=1</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>lambda x, y: ...</code></td><td>Hàm viết gọn nhận nhiều đối số trực tiếp trên một dòng</td></tr><tr><td><code>&lt; / &lt;= / &gt; / &gt;=</code></td><td>So sánh hai vế, kiểm tra rỗng bằng <code>is None</code> hoặc kẹp khoảng trả về Đúng/Sai</td></tr><tr><td><code>int(x)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.2f}, {:.4f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>'
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo để bạn tự đối chiếu cách viết.
    clear: true
  - show: '<p><b>Lời giải tham khảo CS115:L40 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>sym = lambda a, b: a + b - a * b</div><div>w_near = sym(1.0, 1.0)</div><div>w_cross = sym(0.02, 0.0)</div><div>print(f"w_near_01={w_near:.2f} w_cross_12={w_cross:.4f}")</div><div>print(f"keeps_cluster={int(w_near &gt; 10 * w_cross)}")</div></div>'
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">đồ thị $k$ láng giềng</span><span class="a">→</span>
      <span class="n">trọng số cạnh, gộp kiểu “hoặc”</span><span class="a">→</span>
      <span class="n">entropy chéo nhị phân: kéo và đẩy</span><span class="a">→</span>
      <span class="n">nhận định thực nghiệm, không phải định lý</span></div>
    say: Tổng kết chuỗi logic. Để vẽ hàng triệu điểm mà không tính toàn bộ mọi cặp khoảng cách, thuật toán mở đầu bằng đồ thị k láng giềng gần nhất. Khoảng cách cạnh được chuẩn hoá riêng theo mật độ cục bộ quanh từng điểm. Hai trọng số có hướng trên mỗi cạnh được hợp nhất bằng phép hội xác suất mềm đối xứng để đảm bảo cả hai phía đều công nhận quan hệ hàng xóm. Ở chiều thấp, hàm entropy chéo nhị phân kết hợp lấy mẫu ngẫu nhiên cặp xa tạo ra hai lực kéo điểm cùng cạnh lại gần và đẩy cụm rời ra xa một cách tiết kiệm. Cuối cùng hãy luôn giữ thái độ khoa học khi đọc biểu đồ thực nghiệm. Hãy thử nhiều hạt giống ngẫu nhiên khác nhau và nhớ rằng tốc độ nhanh không đảm bảo tính đúng cho khoảng cách giữa các cụm xa. Từ bản vẽ hai chiều thu được, hãy luôn đối chiếu lại cấu trúc lân cận trên dữ liệu gốc nhiều chiều trước khi ra kết luận. Kết hợp trực quan hoá nhanh cùng chỉ số định lượng sẽ giúp phân tích khách quan và chính xác hơn. Đặc biệt hãy thử đổi số láng giềng k từ mười lăm lên năm mươi để quan sát sự dịch chuyển giữa cấu trúc chi tiết nhỏ và toàn cảnh rộng. Nếu hai vùng giữ nguyên ranh giới phân tách qua nhiều mức k khác nhau, bạn mới có cơ sở vững chắc để báo cáo kết quả. Kết hợp cả trực quan nhanh lẫn thước đo định lượng trên không gian gốc sẽ giữ cho phân tích của bạn vừa rõ ràng vừa khách quan. Tương tự phương pháp tê ét en e của bài 32, hãy chỉnh số láng giềng k hợp lý. Mức k phù hợp giúp cân bằng chi tiết cục bộ và cấu trúc chung. Đừng quên phân biệt rành mạch điều có chứng minh giải tích với kết quả đo thực nghiệm trên vài tập dữ liệu mẫu. Luôn đọc lại biểu đồ dưới nhiều góc độ và ưu tiên độ tin cậy trên lân cận gần thay vì tin vào khoảng cách giữa hai đám mây ở xa nhau. Thói quen kiểm chứng hai chiều này sẽ giữ cho mọi trực quan hoá của bạn luôn trung thực. Kết hợp đồng thời chỉ số định lượng trên không gian gốc và bản đồ hai chiều giúp báo cáo phân tích đứng vững.
  - show: |
      <div class="box key"><b>Tư duy:</b> phân biệt điều đã chứng minh với điều tác giả quan sát được — cả hai đều có giá trị, nhưng khác nhau.</div>
      <p class="note"><b>Hai mức quy mô:</b> Từ ví dụ 1 000 điểm tới tập 1 triệu điểm: dùng đồ thị láng giềng xấp xỉ và cập nhật theo cạnh tránh bùng nổ toàn bộ cặp, nhưng vẫn không nên đo khoảng cách giữa hai cụm xa.</p>
    say: Điều cần mang theo, hãy phân biệt điều đã chứng minh với điều tác giả quan sát được, cả hai đều có giá trị nhưng khác nhau. Ở hai mức quy mô, từ một nghìn điểm tới một triệu điểm, cập nhật theo cạnh láng giềng giúp tránh bùng nổ toàn bộ cặp nhưng không giữ được khoảng cách giữa cụm xa.
    focus:
    - 1
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 41): <b>cơ chế attention</b> và Transformer.</p>
    forward_ref: true
    say: Ở bài sau, bài 41, ta học cơ chế chú ý và kiến trúc mạng xây dựng trên nó. Hẹn gặp bạn ở bài tiếp theo.
