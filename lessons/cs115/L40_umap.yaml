id: L40
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 40 (mở rộng) — UMAP: giảm chiều bằng đồ thị láng giềng (so với t-SNE)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "0 kết quả trong nguồn môn học; CITED: McInnes, Healy & Melville, “UMAP: Uniform Manifold Approximation and Projection for Dimension Reduction”, arXiv:1802.03426 (2018) (truy cập 2026-10-24, no revision given)"
assumes: [cdot, sub, sub2, exp, log, approx, geq, sum, prob, norm]
# Quy ước ký hiệu: trọng số cạnh ở không gian gốc wᵢⱼ (0 đến 1 — “độ chắc có cạnh”), ở không gian vẽ vᵢⱼ; ρᵢ = khoảng cách tới láng
#   giềng gần nhất của i; hàm sai số là entropy chéo nhị phân (bài 20) trên từng cạnh.
# Phát biểu “nhanh hơn, giữ cấu trúc toàn cục tốt hơn t-SNE” là NHẬN ĐỊNH của bài báo (thực nghiệm), không phải định lý — nói đúng vậy.
# Lời đọc: UMAP chỉ hiện trên màn hình — nói “phương pháp này”, “u máp” (tên chữ) KHÔNG đọc.
# Nối bài trước (nói lại khi dùng, luật 17): bài 13 (xác suất A hoặc B), bài 20 (entropy chéo nhị phân), bài 27 (k láng giềng gần
#   nhất), bài 32 (t-SNE: giữ láng giềng gần; khoảng cách giữa cụm không có nghĩa).
objectives:
  - "Hiểu ba bước: đồ thị k láng giềng, trọng số cạnh, tìm toạ độ giữ đồ thị"
  - "Tính trọng số cạnh và phép “đối xứng hoá” bằng xác suất “A hoặc B”"
  - "Thấy hàm sai số là entropy chéo nhị phân trên từng cạnh"
  - "So sánh với t-SNE và đọc kết quả đúng cách"
asr_reviewed:
  - {sentence: "Nhỏ nhất là 0 phẩy 546, khi v bằng đúng w.", reason: "ASR chép “Nhỏ nhất là 0,546 khi V bằng đúng V két.” (0.867): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; chữ w đọc “vê kép” (luật chung), ASR viết tách chữ; lệch âm/thanh thuần Việt: không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Độ dốc bằng 0 đúng tại v bằng 0 phẩy 8, tức là v bằng w, khớp kết quả máy dò.", reason: "ASR chép “Độ dốc bằng không đúng tại v bằng 0,8, tức là v bằng v két, khớp kết quả máy dò.” (0.955): chữ w đọc “vê kép” (luật chung), ASR viết tách chữ — NOT_VERIFIED bằng tai người"}
  - sentence: "Thay số, sai số nhỏ nhất khi v bằng đúng w."
    reason: "v, w đọc tên chữ cái (“vê”, “vê kép”), ASR chép “về”, “về kết”"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng mục tiêu với t-SNE, một con đường khác"
    steps:
      - show: |
          <p class="big">Bài 32: t-SNE vẽ dữ liệu nhiều chiều lên mặt phẳng, giữ láng giềng gần. Với hàng triệu điểm, nó chậm.</p>
          <div class="box key">UMAP (McInnes và cộng sự, 2018): dựng <b>đồ thị láng giềng</b>, rồi tìm toạ độ 2 chiều sao cho đồ thị gần như giữ nguyên. Theo bài báo của các tác giả: nhanh hơn và giữ cấu trúc toàn cục tốt hơn t-SNE trên các thí nghiệm của họ.</div>
        focus: [1, 2, 2]
        say: "Chào bạn, ở bài 32, ta vẽ dữ liệu nhiều chiều lên mặt phẳng mà giữ láng giềng gần, nhưng với hàng triệu điểm thì chậm. Phương pháp hôm nay dựng một đồ thị láng giềng, rồi tìm toạ độ hai chiều giữ gần nguyên đồ thị đó. Các tác giả báo cáo nó nhanh hơn trên thí nghiệm của họ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: láng giềng gần, entropy chéo nhị phân"
    checks:
      - "[round(math.exp(-x), 3) for x in (0, 0.5, 1, 2)] == [1.0, 0.607, 0.368, 0.135]"
      - "round(0.6 + 0.5 - 0.6*0.5, 9) == 0.8 and round(1 - (1 - 0.6)*(1 - 0.5), 9) == 0.8"
    steps:
      - show: |
          <p>Bài 27: tìm $k$ điểm gần nhất của mỗi điểm. Bài 13: $P(A \text{ hoặc } B) = P(A) + P(B) - P(A \text{ và } B)$; độc lập thì “và” = tích.</p>
          <p>Bài 20: entropy chéo nhị phân $\ -\big[w\ln v + (1 - w)\ln(1 - v)\big]$ — nhỏ nhất khi $v = w$.</p>
        focus: [1, "1.2", 2]
        say: "Nhắc lại bài 27, tìm k điểm gần nhất của mỗi điểm. Bài 13, xác suất A hoặc B bằng tổng trừ phần chung, và khi độc lập phần chung là tích. Bài 20, entropy chéo nhị phân nhỏ nhất khi dự đoán bằng đúng nhãn."
      - show: |
          <table class="t"><tr><th>$x$</th><th>0</th><th>0,5</th><th>1</th><th>2</th></tr>
          <tr><td>$e^{-x}$</td><td>1</td><td>0,607</td><td>0,368</td><td>0,135</td></tr></table>
          <p>Làm thử “hoặc” với hai sự kiện độc lập, $P(A) = 0{,}6$, $P(B) = 0{,}5$:</p>
          $$0{,}6 + 0{,}5 - 0{,}6\cdot 0{,}5 = 1{,}1 - 0{,}3 = 0{,}8$$
        focus: [0, 1, 2, 3]
        say: "Hai phép tính sẽ dùng suốt bài. Bảng cho e mũ âm x, bằng 1 khi x bằng 0, rồi giảm dần còn 0 phẩy 607, 0 phẩy 368 và 0 phẩy 135. Làm thử phép hoặc với hai sự kiện độc lập có xác suất 0 phẩy 6 và 0 phẩy 5. Tổng là 1 phẩy 1, trừ phần chung 0 phẩy 3, được 0 phẩy 8."

  # ───────────────────────── 3. TRỌNG SỐ CẠNH ─────────────────────────
  - id: sym_w
    kind: symbol
    title: "Giải mã: trọng số cạnh w — “độ chắc” hai điểm là láng giềng"
    checks:
      - "[round(math.exp(-(d - 1.0)/1.0), 3) for d in (1.0, 1.5, 3.0)] == [1.0, 0.607, 0.135]"
      - "round(0.607 + 0.5 - 0.607*0.5, 4) == 0.8035"
    steps:
      - show: |
          <div class="box key">$w_{j\mid i} = e^{-(d_{ij} - \rho_i)/\sigma_i}$ với $j$ trong $k$ láng giềng của $i$; &nbsp; $\rho_i$ = khoảng cách tới láng giềng <b>gần nhất</b> (nên láng giềng gần nhất luôn có trọng số 1); &nbsp; $\sigma_i$ = độ rộng, chọn tự động cho từng điểm như bài 32</div>
          <p class="note">Ở đây $\rho_i$ là một khoảng cách (khác hệ số tương quan của bài 15), $\sigma_i$ là độ rộng (khác độ lệch chuẩn).</p>
          <p><b>Làm thử ngay</b>: khoảng cách 1; 1,5; 3, $\rho_i = 1$, $\sigma_i = 1$: $\ w = (1;\ \hlg{0{,}607};\ 0{,}135)$</p>
          <p>Đối xứng hoá (“cạnh tồn tại nếu $i$ thấy $j$ <b>hoặc</b> $j$ thấy $i$”, bài 13): $\ w_{ij} = a + b - a\cdot b$; &nbsp; $a = 0{,}607$, $b = 0{,}5$ → $\hlg{0{,}8035}$</p>
        introduces: [given, rho, sigma]
        focus: [1, 3, 4]
        say: "Mỗi cạnh có trọng số từ 0 đến 1, như độ chắc hai điểm là láng giềng, bằng e mũ âm khoảng cách đã trừ khoảng cách tới láng giềng gần nhất. Làm thử ngay, ba láng giềng có trọng số 1, 0 phẩy 607 và 0 phẩy 135. Rồi gộp hai chiều theo kiểu A hoặc B của bài 13, được 0 phẩy 8035."

  - id: graph_pic
    kind: intuition
    title: "Nhìn thấy cơ chế: đồ thị láng giềng, rồi kéo và đẩy"
    checks:
      - "[round(math.exp(-(d - 1)), 3) for d in (1, 1.5, 3)] == [1.0, 0.607, 0.135]"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arG40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arR40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><text x="330" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">không gian gốc: đồ thị k = 3 láng giềng của i</text><line x1="130" y1="210" x2="230" y2="120" stroke="#2563eb" stroke-width="12"/><line x1="130" y1="210" x2="280" y2="280" stroke="#2563eb" stroke-width="7"/><line x1="130" y1="210" x2="430" y2="210" stroke="#2563eb" stroke-width="2"/><circle cx="130" cy="210" r="24" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="130" y="218" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">i</text><circle cx="230" cy="120" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="230" y="128" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">a</text><circle cx="280" cy="280" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="280" y="288" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">b</text><circle cx="430" cy="210" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="430" y="218" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">c</text><circle cx="580" cy="150" r="24" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="580" y="158" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">m</text><g font-size="20" fill="#2563eb"><text x="80" y="150">w = 1</text><text x="120" y="290">w = 0,607</text><text x="290" y="240">w = 0,135</text></g><text x="580" y="110" font-size="20" text-anchor="middle" fill="#6b7280">m: không có cạnh</text><text x="330" y="395" font-size="20" text-anchor="middle" fill="#374151">cạnh càng dày, hai điểm càng chắc là láng giềng</text><line x1="700" y1="60" x2="700" y2="400" stroke="#d1d5db" stroke-width="3"/><text x="1090" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">mặt phẳng: dời điểm để giảm sai số</text><circle cx="900" cy="210" r="24" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="900" y="218" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">i</text><circle cx="1120" cy="120" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1120" y="128" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">a</text><circle cx="1140" cy="290" r="24" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1140" y="298" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">b</text><circle cx="1070" cy="220" r="24" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1070" y="228" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">m</text><line x1="1096" y1="128" x2="960" y2="180" stroke="#15803d" stroke-width="4" marker-end="url(#arG40)"/><line x1="1116" y1="282" x2="970" y2="245" stroke="#15803d" stroke-width="4" marker-end="url(#arG40)"/><line x1="1094" y1="220" x2="1300" y2="220" stroke="#b91c1c" stroke-width="4" marker-end="url(#arR40)"/><g font-size="20"><text x="1160" y="128" fill="#15803d">vế đầu kéo lại (w lớn)</text><text x="1180" y="205" fill="#b91c1c">vế sau đẩy ra (w = 0)</text><text x="1060" y="345" fill="#15803d">kéo lại</text></g><text x="1090" y="395" font-size="20" text-anchor="middle" fill="#374151">dừng khi độ giống v trên hình gần bằng w của đồ thị</text></svg></div>
        focus: [0, 0, 0, 0]
        say: "Bên trái là không gian gốc, điểm i nối với ba láng giềng gần nhất a, b, c, độ dày cạnh là trọng số vừa tính, 1, 0 phẩy 607 và 0 phẩy 135. Điểm m ở xa hơn nên không có cạnh nào, trọng số bằng 0. Bên phải là mặt phẳng, các điểm được đặt tuỳ ý lúc đầu, rồi được dời dần. Láng giềng có trọng số lớn bị mũi tên xanh kéo lại gần i, còn m bị mũi tên đỏ đẩy ra xa, cho tới khi độ giống trên hình gần bằng trọng số của đồ thị."

  # ───────────────────────── 4. HÀM SAI SỐ ─────────────────────────
  - id: loss
    kind: formula
    title: "Tìm toạ độ: entropy chéo nhị phân trên từng cạnh"
    checks:
      - "(lambda bce: [round(bce(0.8, v), 4) for v in (0.5, 0.8, 0.95)] == [0.6931, 0.5004, 0.6402])(lambda w, v: -(w*math.log(v) + (1 - w)*math.log(1 - v)))"
    steps:
      - show: |
          <p>Ở mặt phẳng, độ giống $v_{ij}$ giảm theo khoảng cách (đuôi dày, giống bài 32). Dời các điểm (gradient descent) để làm nhỏ:</p>
          <div class="box key">$\sum_{\text{cặp } ij} -\Big[w_{ij}\ln v_{ij} + (1 - w_{ij})\ln(1 - v_{ij})\Big]$ &nbsp; — vế đầu <b>kéo</b> láng giềng lại gần, vế sau <b>đẩy</b> các điểm không phải láng giềng ra xa</div>
          <p>Một cạnh $w = 0{,}8$: $\ v = 0{,}5 \to 0{,}693$; &nbsp; $v = 0{,}8 \to \hlg{0{,}500}$ (nhỏ nhất); &nbsp; $v = 0{,}95 \to 0{,}640$</p>
        focus: [1, [1, 2], 2, 3]
        say: "Ở mặt phẳng, độ giống giảm theo khoảng cách. Ta dời các điểm bằng gradient descent để làm nhỏ entropy chéo nhị phân của bài 20 trên từng cặp. Vế đầu kéo láng giềng lại gần, vế sau đẩy các điểm không phải láng giềng ra xa. Thay số, sai số nhỏ nhất khi v bằng đúng w."

  - id: hand_w
    kind: example
    title: "Làm tay từng bước: từ khoảng cách tới sai số của một cạnh"
    checks:
      - "[d - 2 for d in (2, 2.5, 4)] == [0, 0.5, 2] and [round(math.exp(-(d - 2)), 3) for d in (2, 2.5, 4)] == [1.0, 0.607, 0.135]"
      - "round(0.607 + 0.4 - 0.607*0.4, 4) == 0.7642 and round(0.607*0.4, 4) == 0.2428"
      - "(lambda bce: [round(bce(0.7642, v), 3) for v in (0.5, 0.7642, 0.95)] == [0.693, 0.546, 0.746])(lambda w, v: -(w*math.log(v) + (1 - w)*math.log(1 - v)))"
    steps:
      - show: |
          <p>Điểm $i$ có 3 láng giềng ở khoảng cách 2; 2,5; 4, $\sigma_i = 1$.</p>
          <p><b>Bước 1 — trừ $\rho_i$</b>: láng giềng gần nhất cách 2, nên $\rho_i = 2$.</p>
          $$d - \rho_i:\quad 2 - 2 = 0,\qquad 2{,}5 - 2 = 0{,}5,\qquad 4 - 2 = 2$$
        focus: [1, 2, 3]
        say: "Làm tay một ví dụ mới, điểm i có ba láng giềng ở khoảng cách 2, 2 phẩy 5 và 4, với xích ma bằng 1. Bước một, láng giềng gần nhất cách 2, nên rô bằng 2, và ta trừ 2 khỏi mỗi khoảng cách. Được 0, 0 phẩy 5 và 2."
      - show: |
          <p><b>Bước 2 — lấy $e$ mũ âm</b> (bảng ôn nền):</p>
          $$w_{j\mid i}:\quad e^{0} = \hlg{1},\qquad e^{-0{,}5} \approx 0{,}607,\qquad e^{-2} \approx 0{,}135$$
        focus: [1, 2]
        say: "Bước hai, lấy e mũ âm của ba số đó, tra bảng của phần ôn nền. Được 1, 0 phẩy 607 và 0 phẩy 135, và láng giềng gần nhất luôn có trọng số 1 vì đã trừ đúng khoảng cách của nó."
      - clear: true
        show: |
          <p><b>Bước 3 — gộp hai chiều</b>: láng giềng thứ hai nhìn lại $i$ với trọng số 0,4. Dùng “hoặc”:</p>
          $$0{,}607 + 0{,}4 - 0{,}607\cdot 0{,}4 = 1{,}007 - 0{,}2428 = \hlg{0{,}7642}$$
          <p class="note">Nếu gộp bằng “và” (chỉ lấy tích) thì chỉ còn 0,2428: cạnh gần như mất, dù $i$ khá chắc đó là láng giềng.</p>
        focus: [1, 2, 3]
        say: "Bước ba, gộp hai chiều, vì láng giềng thứ hai nhìn lại i chỉ với trọng số 0 phẩy 4. Theo phép hoặc, tổng là 1 phẩy 007, trừ tích 0 phẩy 2428, được 0 phẩy 7642. Nếu lấy phép và, tức là chỉ lấy tích, cạnh chỉ còn 0 phẩy 2428, gần như mất."
      - show: |
          <p><b>Bước 4 — sai số của cạnh này</b> ($w = 0{,}7642$) theo độ giống $v$ trên mặt phẳng:</p>
          <table class="t"><tr><th>$v$</th><th>0,5</th><th>0,7642</th><th>0,95</th></tr>
          <tr><td>sai số</td><td>0,693</td><td>$\hlg{0{,}546}$</td><td>0,746</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước bốn, thay trọng số 0 phẩy 7642 vào entropy chéo nhị phân, với ba độ giống v khác nhau trên mặt phẳng. Đặt v bằng 0 phẩy 5 thì sai số 0 phẩy 693, đặt quá gần với v bằng 0 phẩy 95 thì sai số 0 phẩy 746. Nhỏ nhất là 0 phẩy 546, khi v bằng đúng w."

  # ───────────────────────── 5. SO VỚI t-SNE ─────────────────────────
  - id: compare
    kind: example
    title: "So sánh với t-SNE"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>t-SNE (bài 32)</th><th>UMAP</th></tr>
          <tr><td>độ giống gốc</td><td>xác suất, chia tổng mọi điểm</td><td>trọng số cạnh trên đồ thị $k$ láng giềng</td></tr>
          <tr><td>hàm sai số</td><td>độ lệch KL</td><td>entropy chéo nhị phân (có vế đẩy ra)</td></tr>
          <tr><td>tham số chính</td><td>độ bối rối</td><td>số láng giềng $k$, khoảng cách tối thiểu (hai điểm trên hình được đặt gần nhau tới mức nào — nhỏ thì cụm chụm chặt)</td></tr>
          <tr><td>điểm mới</td><td>phải chạy lại</td><td>có thể đặt điểm mới (theo cài đặt của thư viện)</td></tr></table>
          <p class="note">“Nhanh hơn, giữ cấu trúc toàn cục tốt hơn” là kết quả <b>thực nghiệm</b> trong bài báo, không phải định lý. Như t-SNE: khoảng cách giữa các cụm trên hình không nhất thiết có nghĩa; kết quả đổi theo $k$ và khởi tạo.</p>
        focus: [["1.2", "1.3"], 2, 2]
        say: "So với phương pháp của bài 32, phương pháp này dùng trọng số cạnh trên đồ thị thay vì xác suất chia tổng, và dùng entropy chéo nhị phân có vế đẩy ra. Nhận định nó nhanh hơn và giữ cấu trúc toàn cục tốt hơn là kết quả thực nghiệm, không phải định lý. Khoảng cách giữa các cụm vẫn không nhất thiết có nghĩa."

  # ───────────────────────── 6. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: entropy chéo nhị phân nhỏ nhất đúng tại v = w"
    checks:
      - "(lambda g: [round(g(0.8, v), 3) for v in (0.5, 0.8, 0.95)] == [-1.2, 0.0, 3.158])(lambda w, v: -w/v + (1 - w)/(1 - v))"
      - "(lambda bce, g: abs(float(sp.diff(bce, sp.Symbol('v')).subs({'w': 0.8, 'v': 0.5})) - g) < 1e-12)(-(sp.Symbol('w')*sp.log(sp.Symbol('v')) + (1 - sp.Symbol('w'))*sp.log(1 - sp.Symbol('v'))), -1.2)"
      - "(lambda g: all(abs(float(g[int(np.argmin([-(w*math.log(v) + (1 - w)*math.log(1 - v)) for v in g]))]) - w) < 1e-3 for w in (0.2, 0.5, 0.8)))(np.arange(0.001, 0.999, 0.001))"
    steps:
      - show: |
          <p>Máy dò $v$ từ 0,001 đến 0,998 cho $w = 0{,}2$; $0{,}5$; $0{,}8$: sai số nhỏ nhất đúng tại $v = w$ $\checkmark$ — nên khi tối ưu xong, độ giống trên hình bám theo trọng số của đồ thị gốc.</p>
        say: "Phép thử, máy dò mọi giá trị v cho ba giá trị w khác nhau, và sai số nhỏ nhất luôn đúng tại v bằng w. Nghĩa là khi tối ưu xong, độ giống trên hình bám theo trọng số của đồ thị gốc."
      - show: |
          <p>Đường khác, không dò: độ dốc của sai số theo $v$ là</p>
          $$-\frac{w}{v} + \frac{1 - w}{1 - v}$$
          <table class="t"><tr><th>$w = 0{,}8$</th><th>$v = 0{,}5$</th><th>$v = 0{,}8$</th><th>$v = 0{,}95$</th></tr>
          <tr><td>độ dốc</td><td>$-1{,}6 + 0{,}4 = -1{,}2$</td><td>$-1 + 1 = \hlg{0}$</td><td>$\approx -0{,}842 + 4 = 3{,}158$</td></tr></table>
        focus: [1, 2, "3.2", "3.2"]
        say: "Kiểm bằng đường khác, không dò mà tính độ dốc của sai số theo v, bằng âm w chia v cộng 1 trừ w chia 1 trừ v. Lấy w bằng 0 phẩy 8. Ở v bằng 0 phẩy 5 độ dốc âm, nên tăng v thì sai số còn giảm, ở v bằng 0 phẩy 95 độ dốc dương. Độ dốc bằng 0 đúng tại v bằng 0 phẩy 8, tức là v bằng w, khớp kết quả máy dò."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi nhận định “tốt hơn t-SNE” là luôn đúng <b class="red">(sai)</b>
          <br><span class="note">Đó là kết quả thực nghiệm; với dữ liệu khác có thể khác — thử cả hai.</span></div>
        say: "Lỗi thứ nhất, coi nhận định tốt hơn là luôn đúng. Đó là kết quả thực nghiệm, với dữ liệu khác có thể khác, nên hãy thử cả hai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc khoảng cách giữa các cụm, kích thước cụm <b class="red">(dễ sai)</b>
          <br><span class="note">Giống bài 32: chỉ tin quan hệ láng giềng gần.</span></div>
        say: "Lỗi thứ hai, đọc khoảng cách giữa các cụm hay kích thước cụm. Giống bài 32, chỉ tin quan hệ láng giềng gần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Một lần chạy, một giá trị $k$ <b class="red">(dễ sai)</b>
          <br><span class="note">$k$ nhỏ nhấn cấu trúc cục bộ (láng giềng gần), $k$ lớn nhấn cấu trúc toàn cục (các cụm nằm ra sao so với nhau) — thử vài giá trị.</span></div>
        say: "Lỗi thứ ba, chỉ chạy một lần với một giá trị k. K nhỏ nhấn cấu trúc cục bộ, tức láng giềng gần, k lớn nhấn cấu trúc toàn cục, tức các cụm nằm ra sao so với nhau, nên hãy thử vài giá trị."

  # ───────────────────────── 8. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(math.exp(-(2 - 1)/1), 3) == 0.368 and round(0.5 + 0.5 - 0.25, 2) == 0.75"
      - "round(1/math.e, 3) == 0.368 and 1 - 0.5*0.5 == 0.75"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\rho_i = 1$, $\sigma_i = 1$, láng giềng ở khoảng cách 2: trọng số?</td></tr>
          <tr><td>2</td><td>$w_{j\mid i} = 0{,}5$, $w_{i\mid j} = 0{,}5$: trọng số đối xứng?</td></tr></table>
        say: "Bây giờ đến lượt bạn, với hai câu trên màn hình. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① Trừ $\rho_i$: $\ 2 - 1 = 1$; chia $\sigma_i = 1$ vẫn là 1; lấy $e$ mũ âm:</p>
          $$w = \frac{1}{e} \approx \hlg{0{,}368}$$
        focus: [1, 2]
        say: "Câu một, trừ rô bằng 1 khỏi khoảng cách 2 được 1, chia cho xích ma bằng 1 vẫn là 1. Lấy e mũ âm 1, tức là 1 chia e, xấp xỉ 0 phẩy 368, đúng ô thứ ba của bảng ôn nền."
      - show: |
          <p>② Phép “hoặc”: tổng $0{,}5 + 0{,}5 = 1$, trừ tích $0{,}5\cdot 0{,}5 = 0{,}25$:</p>
          $$w_{ij} = 1 - 0{,}25 = \hlg{0{,}75}$$
          <p class="note">Kiểm đường khác: xác suất <b>không</b> chiều nào thấy $= 0{,}5\cdot 0{,}5 = 0{,}25$, nên $1 - 0{,}25 = 0{,}75$ ✓</p>
        focus: [1, 2, 3]
        say: "Câu hai, theo phép hoặc, tổng hai trọng số bằng 1, trừ tích 0 phẩy 25, được 0 phẩy 75. Kiểm bằng đường khác, xác suất không chiều nào thấy cạnh là 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Vậy 1 trừ 0 phẩy 25 cũng bằng 0 phẩy 75."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đồ thị $k$ láng giềng</span><span class="a">→</span>
          <span class="n">trọng số cạnh, gộp kiểu “hoặc”</span><span class="a">→</span>
          <span class="n">entropy chéo nhị phân: kéo và đẩy</span><span class="a">→</span>
          <span class="n">nhận định thực nghiệm, không phải định lý</span></div>
        say: "Tổng kết chuỗi logic. Đầu tiên dựng đồ thị nối mỗi điểm với các láng giềng gần nhất, gán trọng số cho từng cạnh, rồi gộp hai chiều theo kiểu hoặc. Tìm toạ độ bằng entropy chéo nhị phân, vừa kéo vừa đẩy. Và nhớ các nhận định so sánh là thực nghiệm, không phải định lý."
      - show: |
          <div class="box key"><b>Tư duy:</b> phân biệt điều đã chứng minh với điều tác giả quan sát được — cả hai đều có giá trị, nhưng khác nhau.</div>
        say: "Điều cần mang theo, hãy phân biệt điều đã chứng minh với điều tác giả quan sát được, cả hai đều có giá trị nhưng khác nhau."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 41): <b>cơ chế attention</b> và Transformer.</p>
        forward_ref: true
        say: "Ở bài sau, bài 41, ta học cơ chế chú ý và kiến trúc mạng xây dựng trên nó. Hẹn gặp bạn ở bài tiếp theo."
