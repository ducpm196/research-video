  - clear: true
    show: '<table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def f(x, y):</code></td><td>hàm f có hai <b>tham số</b> x, y và <code>return</code> một danh sách ba số: ba đầu ra; <code>x**2</code> là x mũ 2 (hai dấu sao liền nhau là lũy thừa)</td><td><code>return [x * y, x**2 - y, x + y**2]</code></td></tr><tr><td><code>J = [[3, 2], [4, -1], [1, 6]]</code></td><td>danh sách lồng: mỗi hàng là một danh sách; <code>J[2][1]</code> là hàng chỉ số 2, cột chỉ số 1 (đếm từ 0)</td><td><code>J[0]</code> là <code>[3, 2]</code>; <code>J[2][1]</code> là 6</td></tr><tr><td><code>for i in range(3):</code></td><td><code>range(3)</code> cho 0, 1, 2; vòng lặp chạy với từng số i đó</td><td>i = 0 chạy một lượt, rồi 1, rồi 2</td></tr><tr><td><code>round(0.09000000000000008, 4)</code></td><td>làm tròn đến 4 chữ số sau dấu thập phân, bỏ sai số nhỏ của máy</td><td><code>round(0.09000000000000008, 4)</code> là <code>0.09</code></td></tr></table>

      '
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: 'Đọc trước bốn mẩu mã sẽ dùng trong chương trình. Dòng này định nghĩa hàm có hai tham số, và lệnh trả về đưa ra một danh sách gồm ba số. Danh sách lồng nhau: hai chỉ số liền nhau chọn hàng rồi cột, và đều đếm từ không. Vòng lặp này chạy với i bằng 0, 1 rồi 2, tức đi qua ba hàng của ma trận. Hàm làm tròn giữ bốn chữ số thập phân, để bỏ sai số nhỏ của máy.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước (tiếp): cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>x**2</code></td><td>hai dấu sao liền nhau là lũy thừa: x**2 là x mũ 2</td><td><code>3**2</code> là 9</td></tr><tr><td><code style="white-space:nowrap">[round(J[i][0] * b[0] + J[i][1] * b[1], 4) for i in range(3)]</code></td><td>danh sách mới: với i = 0, 1, 2 lấy hàng i của J nhân bước b, làm tròn 4 chữ số</td><td>J = [[3, 2], [4, -1], [1, 6]], b = [0.1, -0.1] cho <code>[0.1, 0.5, -0.5]</code></td></tr><tr><td><code>sum(J_ngoai[i] * J[i][j] for i in range(3))</code></td><td>tổng các tích: hàng ngoài nhân cột j của J</td><td>J_ngoai = [12, 11, 1], j = 0: 36 + 44 + 1 = 81</td></tr></table>

      '
    say: Còn vài mẩu mã nữa, đọc kỹ ở bảng.
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>jac.py</code> cho hàm $\mathbf{f}(x, y) = (xy,\ x^2 - y,\ x + y^2)$ tại $(2, 3)$, hai đầu vào, ba đầu ra:</p>

      <table class="t"><tr><th>in ra</th><th>cách làm</th></tr>

      <tr><td>$J$</td><td>mỗi hàng một đầu ra, mỗi cột một đầu vào</td></tr>

