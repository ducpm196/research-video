id: L07
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 7 — Ma trận Jacobian, ma trận Hessian & quy tắc chuỗi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L132-L134 (lỗi nhầm Jacobian/Hessian), L224-L225 (định nghĩa J, H_f), L230-L246 (hai ma trận tổng quát), L272-L274 (Hessian của ví dụ cực trị), L150 + L357 (Upstream × Local)"
assumes: [vec, mat, sub, sub2, dim, transpose, cdot, implies, dots, zero_vec, prime, partial, nabla, approx]
# Quy ước ký hiệu của bài (lint kiểm, xem tools/registry/symbols.yaml):
#   hàm nhiều đầu ra: f in đậm = (f_1, f_2)^T như tài liệu dòng 224; Jacobian: J in đậm (sym_jac), cỡ E × D viết \sz{E}{D}
#   như bài 2 (hàng = đầu ra, cột = đầu vào); đạo hàm cấp 2 một biến: f'' (hai dấu phẩy, sym_hess);
#   nhiều biến: ∂²f/∂x∂y nghĩa là đạo hàm theo y TRƯỚC rồi theo x — viết rõ là ∂/∂x(∂f/∂y) khi giới thiệu;
#   Hessian: H_f in đậm (sym_hess), cỡ D × D. Quy tắc chuỗi nhiều biến: J có chỉ số chữ “ngoài” / “trong”, không dùng
#   thêm tên chữ cái. Bước nhỏ: h (như bài 6). Nhân hai số: ·.
#   Tên hàm: f (Jacobian: in đậm, Hessian: thường — luôn có dòng “Đang có” sau mỗi lần xoá bảng), k (hàm ngoài trong
#   quy tắc chuỗi), q (bài tự làm). Không dùng g, p, L (L đọc “lờ”/“eo”, chưa kiểm ASR).
# Điểm bổ sung so với nguồn (audit, T20a–f):
#   A3 (dòng 225, 240): Hessian chỉ đối xứng khi các đạo hàm cấp 2 liên tục — phản ví dụ T20d (−1 và 1), phân cảnh symm.
#   A13 (dòng 150, 357): với vector, “Upstream × Local” là NHÂN MA TRẬN các Jacobian, ngoài trước trong sau (T20f) — chain_mat, lỗi 3.
#   Dòng 132–134 (nhầm Jacobian/Hessian) — lỗi 1. Hessian = Jacobian của gradient (T20c) — meaning_h.
#   Tài liệu dùng chữ “đối xứng” ở dòng 240 mà không nói điều kiện; dòng 272 chỉ ghi ∂²f/∂x∂y (không ghi ∂²f/∂y∂x) vì đã ngầm đối xứng.
# Phép nhân ma trận có tính kết hợp (A B) C = A (B C): bài 2 chưa dạy → dạy và thử bằng số ở chain_mat trước khi dùng.
# Phát âm: “Jacobian” → “Gia-cô-biên” (L05 jh_probe.py); “Hessian”: nút thắt B12, chọn bằng h_probe.py (xem REVIEW_L06.md).
objectives:
  - "Lập ma trận Jacobian của hàm nhiều đầu ra: hàng là đầu ra, cột là đầu vào; dùng nó để xấp xỉ"
  - "Tính đạo hàm cấp 2 và ma trận Hessian; đọc dấu đạo hàm cấp 2 là độ cong"
  - "Nêu đúng điều kiện để Hessian đối xứng"
  - "Dùng quy tắc chuỗi một biến và dạng ma trận (nhân Jacobian, ngoài trước trong sau), kiểm bằng số"
  - "Phân biệt Jacobian với Hessian; nhận ra 4 lỗi thường gặp"
