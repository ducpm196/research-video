scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một mũi tên gradient là chưa đủ"
    steps:
      - show: |
          <p class="big">Bài 6: gradient $\nabla f$ — mũi tên chỉ hướng dốc lên nhất.</p>
          <p>Nhưng gradient chỉ dành cho hàm có <b>một</b> đầu ra (một con số, ví dụ sai số).</p>
        say: "Chào bạn, gradient ở bài 6 chỉ hướng dốc lên nhất, nhưng nó chỉ dành cho hàm có một đầu ra, như một con số sai số."
      - show: |
          <div class="box key">Trong mạng nơ-ron, mỗi <b>lớp</b> nhận vào một vector và trả ra <b>một vector</b>. Rồi lớp sau lại nhận đầu ra của lớp trước: <b>hàm lồng trong hàm</b>.</div>
        say: "Trong mạng nơ-ron, mỗi lớp nhận một vector và trả ra một vector, rồi lớp sau nhận đầu ra của lớp trước, tức là hàm lồng trong hàm."
      - clear: true
        show: |
          <p>Bài hôm nay trả lời 3 câu hỏi:</p>
          <table class="t"><tr><th>câu hỏi</th><th>công cụ</th></tr>
          <tr><td>Hàm có nhiều đầu ra thì “độ dốc” là gì?</td><td><b>ma trận Jacobian</b></td></tr>
          <tr><td>Đứng ở đáy hay ở đỉnh, nhìn độ dốc chưa đủ — cần biết <b>độ cong</b></td><td><b>ma trận Hessian</b></td></tr>
          <tr><td>Hàm lồng trong hàm thì đạo hàm thế nào?</td><td><b>quy tắc chuỗi</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Hôm nay mình trả lời ba câu hỏi. Hàm nhiều đầu ra thì độ dốc là gì, đó là ma trận Jacobian. Muốn biết đứng ở đáy hay ở đỉnh thì cần độ cong, đó là ma trận Hessian. Và hàm lồng trong hàm thì dùng quy tắc chuỗi."
      - show: |
          <p class="note">Vì sao AI cần? Bài 22 (lan truyền ngược — cách tính gradient cho mạng nơ-ron nhiều lớp) chính là quy tắc chuỗi lặp nhiều lần. Bài 8 (tìm đáy và đỉnh của một hàm) dùng Hessian.</p>
        say: "Ở bài 22, cách tính gradient cho mạng nơ-ron nhiều lớp, gọi là lan truyền ngược, chính là quy tắc chuỗi lặp nhiều lần. Còn bài 8 dùng Hessian để tìm đáy và đỉnh của một hàm."
        forward_ref: true

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: đạo hàm riêng, gradient, cỡ ma trận, nhân ma trận"
    checks:
      - "(lambda x, y: sp.diff(x**2 + 3*x*y, x) == 2*x + 3*y and sp.diff(x**2 + 3*x*y, y) == 3*x)(*sp.symbols('x y'))"
      - "Matrix([[1, 2], [3, 4]]) * Matrix([5, 6]) == Matrix([17, 39]) and 1*5 + 2*6 == 17 and 3*5 + 4*6 == 39"
      - "Matrix([[1, 2, 0], [3, 1, 4]]).shape == (2, 3)"
    steps:
      - show: |
          <p>Từ bài 6: &nbsp; $f(x, y) = x^2 + 3xy$, &nbsp; giữ $y$ đứng yên: $\ \dfrac{\partial f}{\partial x} = 2x + 3y$; &nbsp; giữ $x$ đứng yên: $\ \dfrac{\partial f}{\partial y} = 3x$</p>
          <p>Gradient: $\ \nabla f = (2x + 3y,\ 3x)^T$</p>
        say: "Ôn nhanh bài 6, với hàm x bình phương cộng 3 x y, đạo hàm riêng theo x là 2 x cộng 3 y, theo y là 3 x, ghép lại là gradient."
      - show: |
          <p>Từ bài 2: ma trận cỡ $\sz{2}{3}$ có 2 hàng, 3 cột (nói số hàng trước). &nbsp; Nhân ma trận với vector: <b>hàng nhân cột</b>:</p>
          $$\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}\begin{bmatrix} 5 \\ 6 \end{bmatrix} = \begin{bmatrix} 1\cdot 5 + 2\cdot 6 \\ 3\cdot 5 + 4\cdot 6 \end{bmatrix} = \begin{bmatrix} 17 \\ 39 \end{bmatrix}$$
        focus: [1, 2, 2]
        say: "Từ bài 2, ma trận cỡ 2 nhân 3 có 2 hàng, 3 cột, nói số hàng trước. Nhân ma trận với vector là lấy từng hàng nhân với cột. Hàng đầu cho 5 cộng 12 bằng 17, hàng sau cho 15 cộng 24 bằng 39."
      - show: |
          <p class="note">Từ bài 6, phép xấp xỉ với bước nhỏ $h$: $\ f(x + h) \approx f(x) + f'(x)\cdot h$. Hôm nay ta mở rộng nó cho hàm nhiều đầu ra.</p>
        say: "Và phép xấp xỉ của bài 6, f của x cộng h xấp xỉ f của x cộng đạo hàm nhân h, hôm nay sẽ được mở rộng."

  # ───────────────────────── 3. JACOBIAN ─────────────────────────
  - id: sym_jac
    kind: symbol
    title: "Giải mã: ma trận Jacobian J — bảng đạo hàm cấp 1 của hàm nhiều đầu ra"
    checks:
      - "(lambda x, y: (x**2*y).subs({x: 1, y: 2}) == 2 and (5*x + y**2).subs({x: 1, y: 2}) == 9)(*sp.symbols('x y'))"
      - "(lambda x, y: Matrix([x**2*y, 5*x + y**2]).jacobian([x, y]) == Matrix([[2*x*y, x**2], [5, 2*y]]))(*sp.symbols('x y'))"
      - "(lambda x, y: Matrix([[2*x*y, x**2], [5, 2*y]]).subs({x: 1, y: 2}) == Matrix([[4, 1], [5, 4]]))(*sp.symbols('x y'))"
    steps:
      - show: |
          <p>Hàm có <b>2 đầu vào</b> $x, y$ và <b>2 đầu ra</b>, viết thành một vector (chữ $\mathbf{f}$ in đậm):</p>
          $$\mathbf{f}(x, y) = \begin{bmatrix} f_1 \\ f_2 \end{bmatrix} = \begin{bmatrix} x^2 y \\ 5x + y^2 \end{bmatrix}, \qquad \mathbf{f}(1, 2) = \begin{bmatrix} 1\cdot 2 \\ 5 + 4 \end{bmatrix} = \begin{bmatrix} 2 \\ 9 \end{bmatrix}$$
        focus: [1, 2, 2, 2]
        say: "Xét một hàm có 2 đầu vào x, y và 2 đầu ra, viết thành vector f in đậm. Đầu ra thứ nhất, f một, bằng x bình phương nhân y. Đầu ra thứ hai, f hai, bằng 5 x cộng y bình phương. Tại điểm 1, 2, ta được 2 và 9."
      - show: |
          <p>Mỗi đầu ra là một hàm một đầu ra quen thuộc, nên có đạo hàm riêng theo từng biến (giữ biến kia đứng yên):</p>
          <p>$f_1 = x^2 y$: &nbsp; $\dfrac{\partial f_1}{\partial x} = 2xy, \quad \dfrac{\partial f_1}{\partial y} = x^2$ &nbsp;&nbsp;&nbsp; $f_2 = 5x + y^2$: &nbsp; $\dfrac{\partial f_2}{\partial x} = 5, \quad \dfrac{\partial f_2}{\partial y} = 2y$</p>
        focus: [1, ["2.1", "2.2"], ["2.3", "2.4"]]
        say: "Mỗi đầu ra là một hàm quen thuộc, nên có đạo hàm riêng. Với f một, theo x được 2 x y, theo y được x bình phương. Với f hai, theo x được 5, theo y được 2 y."
      - clear: true
        show: |
          <div class="box key"><b>Ma trận Jacobian</b>: xếp các đạo hàm riêng thành bảng — <b>mỗi hàng là một đầu ra, mỗi cột là một đầu vào</b>:
          $$\mathbf{J} = \begin{bmatrix} \dfrac{\partial f_1}{\partial x} & \dfrac{\partial f_1}{\partial y} \\[14pt] \dfrac{\partial f_2}{\partial x} & \dfrac{\partial f_2}{\partial y} \end{bmatrix} = \begin{bmatrix} 2xy & x^2 \\ 5 & 2y \end{bmatrix}$$</div>
        introduces: [jacobian]
        say: "Xếp bốn đạo hàm riêng thành một bảng, mỗi hàng là một đầu ra, mỗi cột là một đầu vào, ta được ma trận Jacobian, ký hiệu chữ J in đậm."
      - show: |
          <p><b>Làm thử tại $(1, 2)$</b>: &nbsp; $\mathbf{J} = \begin{bmatrix} 2\cdot 1\cdot 2 & 1^2 \\ 5 & 2\cdot 2 \end{bmatrix} = \begin{bmatrix} \hlo{4} & \hlo{1} \\ \hlo{5} & \hlo{4} \end{bmatrix}$</p>
          <p class="note">Hàng 1 chính là gradient của $f_1$ viết nằm ngang: $\ (\nabla f_1)^T = (4,\ 1)$.</p>
        focus: [1, 2]
        say: "Làm thử tại điểm 1, 2, thay số, hàng trên là 4, 1, hàng dưới là 5, 4. Để ý, hàng trên chính là gradient của f một, viết nằm ngang."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \mathbf{J}$ = bảng đạo hàm riêng, hàng = đầu ra, cột = đầu vào.</p>
          <p>Tổng quát: hàm có $D$ đầu vào, $E$ đầu ra $\implies$ $\mathbf{J}$ có cỡ $\sz{E}{D}$: $E$ hàng, $D$ cột.</p>
          $$\mathbf{J} = \begin{bmatrix} \dfrac{\partial f_1}{\partial x_1} & \dots & \dfrac{\partial f_1}{\partial x_D} \\[8pt] \vdots & & \vdots \\[8pt] \dfrac{\partial f_E}{\partial x_1} & \dots & \dfrac{\partial f_E}{\partial x_D} \end{bmatrix}$$
        say: "Tổng quát, hàm có D đầu vào và E đầu ra thì Jacobian có E hàng, D cột."
      - show: |
          <p class="note">Trường hợp riêng: chỉ <b>một</b> đầu ra ($E = 1$) $\implies$ $\mathbf{J}$ có một hàng $= (\nabla f)^T$. Gradient là Jacobian của hàm một đầu ra, dựng đứng.</p>
        say: "Nếu chỉ có một đầu ra, Jacobian chỉ có một hàng, chính là gradient viết nằm ngang."

  # ───────────────────────── 4. JACOBIAN CHO BIẾT GÌ ─────────────────────────
  - id: meaning_j
    kind: intuition
    title: "Jacobian cho biết gì: xấp xỉ bằng một phép nhân ma trận"
    checks:
      - "Matrix([[4, 1], [5, 4]]) * Matrix([Rational(1,10), Rational(1,10)]) == Matrix([Rational(5,10), Rational(9,10)])"
      - "Rational(11,10)**2 * Rational(21,10) == Rational(2541,1000) and 5*Rational(11,10) + Rational(21,10)**2 == Rational(991,100)"
      - "Rational(2541,1000) - 2 == Rational(541,1000) and Rational(991,100) - 9 == Rational(91,100)"
      - "(lambda x, y: Matrix([x + 2*y, 3*x - y]).jacobian([x, y]) == Matrix([[1, 2], [3, -1]]))(*sp.symbols('x y'))"
    steps:
      - show: |
          <p>Bài 6: $\ f(x + h) \approx f(x) + f'(x)\cdot h$. &nbsp; Với nhiều đầu vào, nhiều đầu ra: <b>đạo hàm thành $\mathbf{J}$, phép nhân thành nhân ma trận</b>:</p>
          $$\mathbf{f}(\text{điểm} + \mathbf{h}) \approx \mathbf{f}(\text{điểm}) + \mathbf{J}\,\mathbf{h}$$
          <p class="note">Vì hàng $i$ của $\mathbf{J}\mathbf{h}$ $= (\nabla f_i)^T\mathbf{h}$ — đúng công thức bài 6 cho từng đầu ra $f_i$.</p>
        focus: ["1.1", 2, 3]
        say: "Nhớ lại phép xấp xỉ đã học ở bài 6, f của x cộng h xấp xỉ f của x cộng đạo hàm nhân h. Với nhiều đầu ra, đạo hàm thay bằng Jacobian, phép nhân thay bằng nhân ma trận với bước h. Lý do là mỗi hàng của phép nhân đúng là công thức bài 6 cho từng đầu ra."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \mathbf{f} = (x^2 y,\ 5x + y^2)^T$, $\ \mathbf{f}(1, 2) = (2, 9)^T$, $\ \mathbf{J}(1, 2) = \begin{bmatrix} 4 & 1 \\ 5 & 4 \end{bmatrix}$</p>
          <p><b>Làm thử</b>: cho $x$ và $y$ cùng tăng $0{,}1$, tức $\ \mathbf{h} = (0{,}1;\ 0{,}1)^T$.</p>
          <p>Dự đoán: $\ \mathbf{J}\mathbf{h} = \begin{bmatrix} 4\cdot 0{,}1 + 1\cdot 0{,}1 \\ 5\cdot 0{,}1 + 4\cdot 0{,}1 \end{bmatrix} = \begin{bmatrix} 0{,}5 \\ 0{,}9 \end{bmatrix}$</p>
        focus: [1, 2, 3]
        say: "Làm thử với hàm vừa rồi tại điểm 1, 2. Cho x và y cùng tăng 0 phẩy 1. Dự đoán bằng Jacobian nhân bước, hàng trên được 0 phẩy 5, hàng dưới được 0 phẩy 9."
      - show: |
          <p>Thật, với $x = 1{,}1$ và $y = 2{,}1$:</p><p>$f_1 = 1{,}21\cdot 2{,}1 = 2{,}541$ — tăng $0{,}541$ (dự đoán $0{,}5$) $\ \checkmark$</p><p>$f_2 = 5{,}5 + 4{,}41 = 9{,}91$ — tăng $0{,}91$ (dự đoán $0{,}9$) $\ \checkmark$</p>
        focus: [2, 3, [2, 3]]
        say: "Tính thật, f một thành 2 phẩy 541, tăng 0 phẩy 541. f hai thành 9 phẩy 91, tăng 0 phẩy 91. Rất sát dự đoán, đúng như phép xấp xỉ."
      - clear: true
        show: |
          <p><b>Hàm tuyến tính</b> (chỉ nhân với số rồi cộng): $\ \mathbf{f}(x, y) = (x + 2y,\ 3x - y)^T$</p>
          $$\mathbf{J} = \begin{bmatrix} 1 & 2 \\ 3 & -1 \end{bmatrix} \ \text{ ở mọi điểm} \qquad\text{và}\qquad \mathbf{f} = \begin{bmatrix} 1 & 2 \\ 3 & -1 \end{bmatrix}\begin{bmatrix} x \\ y \end{bmatrix}$$
          <div class="box key">Jacobian của hàm “nhân với ma trận $\mathbf{A}$” chính là $\mathbf{A}$. Hàm cong thì Jacobian là ma trận <b>xấp xỉ nó tại chỗ</b>.</div>
        focus: [[1, 2], 3]
        say: "Đặc biệt, với hàm tuyến tính x cộng 2 y và 3 x trừ y, Jacobian là ma trận 1, 2, 3, âm 1 ở mọi điểm, đúng bằng ma trận nhân vào. Hàm cong thì Jacobian là ma trận xấp xỉ nó tại chỗ."

  # ───────────────────────── 5. ĐẠO HÀM CẤP 2 & HESSIAN ─────────────────────────
  - id: sym_hess
    kind: symbol
    title: "Giải mã: đạo hàm cấp 2 và ma trận Hessian"
    checks:
      - "(lambda x: sp.diff(x**3, x) == 3*x**2 and sp.diff(x**3, x, 2) == 6*x)(sp.Symbol('x'))"
      - "(lambda x, y: sp.diff(x**3 + 2*x*y**2, x) == 3*x**2 + 2*y**2 and sp.diff(x**3 + 2*x*y**2, y) == 4*x*y)(*sp.symbols('x y'))"
      - "(lambda x, y: sp.diff(3*x**2 + 2*y**2, x) == 6*x and sp.diff(3*x**2 + 2*y**2, y) == 4*y and sp.diff(4*x*y, x) == 4*y and sp.diff(4*x*y, y) == 4*x)(*sp.symbols('x y'))"
      - "(lambda x, y: sp.hessian(x**3 + 2*x*y**2, (x, y)) == Matrix([[6*x, 4*y], [4*y, 4*x]]) and sp.hessian(x**3 + 2*x*y**2, (x, y)).subs({x: 1, y: 2}) == Matrix([[6, 8], [8, 4]]))(*sp.symbols('x y'))"
    steps:
      - show: |
          <p><b>Đạo hàm cấp 2</b> = đạo hàm của đạo hàm. Với $f(x) = x^3$:</p>
          $$f'(x) = 3x^2, \qquad f''(x) = (3x^2)' = 6x$$
          <p class="note">Hai dấu phẩy trên: đạo hàm <b>hai lần</b>. Nó đo xem <b>độ dốc thay đổi nhanh thế nào</b>.</p>
        focus: [1, 2, 3]
        say: "Đạo hàm cấp 2 là đạo hàm của đạo hàm. Với x mũ 3, đạo hàm là 3 x bình phương, lấy đạo hàm thêm lần nữa được 6 x. Hai dấu phẩy nghĩa là đạo hàm hai lần, nó đo độ dốc thay đổi nhanh thế nào."
      - clear: true
        show: |
          <p>Hàm hai biến: $\ f(x, y) = x^3 + 2xy^2$ &nbsp; (bài 6: giữ biến kia đứng yên)</p>
          <p>$\dfrac{\partial f}{\partial x} = 3x^2 + 2y^2, \qquad \dfrac{\partial f}{\partial y} = 4xy$</p>
          <p class="note">Mỗi đạo hàm riêng lại là một hàm của $x, y$ — nên lại lấy đạo hàm riêng được, theo $x$ hoặc theo $y$: có $2\cdot 2 = 4$ đạo hàm cấp 2.</p>
        focus: [1, 2, 3]
        say: "Sang hàm hai biến, x mũ 3 cộng 2 x y bình phương. Đạo hàm riêng theo x là 3 x bình phương cộng 2 y bình phương, theo y là 4 x y. Mỗi cái lại là một hàm, nên lại đạo hàm theo x hoặc theo y được, tổng cộng 4 cái."
      - show: |
          <div class="box key"><b>Đạo hàm riêng cấp 2</b>: viết $\ \dfrac{\partial^2 f}{\partial x\,\partial y} = \dfrac{\partial}{\partial x}\!\left(\dfrac{\partial f}{\partial y}\right)$ — lấy theo $y$ trước, rồi theo $x$.<br>$\dfrac{\partial^2 f}{\partial x^2}$: lấy theo $x$ hai lần.</div>
          <p class="note">Số 2 trên $\partial$ không phải lũy thừa: nó đếm số lần lấy đạo hàm.</p>
        introduces: [second_partial]
        focus: [[1, 2], "1.2"]
        say: "Ký hiệu đạo hàm riêng cấp 2 có số 2 trên chữ d cong, nghĩa là lấy đạo hàm hai lần, không phải bình phương. Dưới mẫu ghi x rồi y, nghĩa là lấy theo y trước, rồi theo x."
      - clear: true
        show: |
          <p class="note">Đang có: $\ f = x^3 + 2xy^2$, $\ \dfrac{\partial f}{\partial x} = 3x^2 + 2y^2$, $\ \dfrac{\partial f}{\partial y} = 4xy$</p>
          <p>Từ $\dfrac{\partial f}{\partial x} = 3x^2 + 2y^2$: &nbsp; $\dfrac{\partial^2 f}{\partial x^2} = 6x, \qquad \dfrac{\partial^2 f}{\partial y\,\partial x} = 4y$</p><p>Từ $\dfrac{\partial f}{\partial y} = 4xy$: &nbsp; $\dfrac{\partial^2 f}{\partial x\,\partial y} = 4y, \qquad \dfrac{\partial^2 f}{\partial y^2} = 4x$</p>
        focus: [1, "2.2", "2.2", "3.2", "3.2"]
        say: "Tính cả bốn. Theo x hai lần được 6 x. Đạo hàm 3 x bình phương cộng 2 y bình phương theo y được 4 y. Đạo hàm 4 x y theo x cũng được 4 y. Theo y hai lần được 4 x."
      - show: |
          <div class="box key"><b>Ma trận Hessian</b> $\mathbf{H}_f$: xếp các đạo hàm cấp 2 thành bảng $\sz{D}{D}$ (ô hàng $i$, cột $j$: $H_{ij} = \dfrac{\partial^2 f}{\partial x_i\,\partial x_j}$):
          $$\mathbf{H}_f = \begin{bmatrix} \dfrac{\partial^2 f}{\partial x^2} & \dfrac{\partial^2 f}{\partial x\,\partial y} \\[14pt] \dfrac{\partial^2 f}{\partial y\,\partial x} & \dfrac{\partial^2 f}{\partial y^2} \end{bmatrix} = \begin{bmatrix} 6x & 4y \\ 4y & 4x \end{bmatrix}, \qquad \mathbf{H}_f(1, 2) = \begin{bmatrix} \hlo{6} & \hlo{8} \\ \hlo{8} & \hlo{4} \end{bmatrix}$$</div>
        introduces: [hessian]
        say: "Xếp bốn đạo hàm cấp 2 thành bảng vuông, ta được ma trận Hessian, ký hiệu H in đậm, chỉ số f. Hàm có bao nhiêu biến thì Hessian có bấy nhiêu hàng và bấy nhiêu cột. Tại điểm 1, 2, thay số được 6, 8, 8, 4."

  # ───────────────────────── 6. HESSIAN CHO BIẾT GÌ ─────────────────────────
  - id: meaning_h
    kind: intuition
    title: "Đạo hàm cấp 2 cho biết gì: độ cong"
    checks:
      - "(lambda x: sp.diff(x**2, x, 2) == 2 and sp.diff(-x**2, x, 2) == -2 and sp.diff(x**3, x, 2).subs(x, 0) == 0)(sp.Symbol('x'))"
      - "Rational(11,10)**3 == Rational(1331,1000) and 1 + 3*Rational(1,10) == Rational(13,10) and Rational(13,10) + Rational(1,2)*6*Rational(1,100) == Rational(133,100)"
      - "(lambda x, h: sp.expand((x + h)**2) == x**2 + 2*x*h + Rational(1,2)*2*h**2)(*sp.symbols('x h'))"
      - "(lambda x, y: Matrix([3*x**2 + 2*y**2, 4*x*y]).jacobian([x, y]) == sp.hessian(x**3 + 2*x*y**2, (x, y)))(*sp.symbols('x y'))"
    steps:
      - show: |
          <table class="t"><tr><th>Hàm</th><th>Đạo hàm cấp 2</th><th>Hình dạng tại $x = 0$</th></tr>
          <tr><td>$x^2$</td><td>$2 > 0$</td><td>cong <b>lên</b> như cái chén: <b>đáy</b></td></tr>
          <tr><td>$-x^2$</td><td>$-2 < 0$</td><td>cong <b>xuống</b> như cái mũ: <b>đỉnh</b></td></tr>
          <tr><td>$x^3$</td><td>$6x = 0$ tại $x = 0$</td><td>chưa biết — phải xét thêm</td></tr></table>
        say: "Dấu của đạo hàm cấp 2 cho biết độ cong. x bình phương có đạo hàm cấp 2 bằng 2, dương, cong lên như cái chén, nên 0 là đáy. Trừ x bình phương cho âm 2, cong xuống như cái mũ, là đỉnh. Còn x mũ 3, tại 0 nó bằng 0, chưa kết luận được."
      - clear: true
        show: |
          <p>Phép xấp xỉ <b>chính xác hơn</b> nhờ đạo hàm cấp 2:</p>
          $$f(x + h) \approx f(x) + f'(x)\cdot h + \frac{1}{2}\,f''(x)\cdot h^2$$
          <p class="note">Vì sao có $\frac{1}{2}$? Thử $f = x^2$: $\ f'' = 2$, nên $\ \frac{1}{2}\cdot 2\cdot h^2 = h^2$ — đúng phần còn thiếu trong $(x + h)^2 = x^2 + 2xh + h^2$.</p>
        focus: [[1, 2], 3]
        say: "Đạo hàm cấp 2 còn làm phép xấp xỉ chính xác hơn, cộng thêm một nửa đạo hàm cấp 2 nhân h bình phương. Thử với x bình phương thì phần thêm đúng bằng h bình phương còn thiếu, nên mới có một nửa."
      - show: |
          <p><b>Làm thử</b>: $f = x^3$, $\ x = 1$, $\ h = 0{,}1$: &nbsp; thật $\ 1{,}1^3 = 1{,}331$</p>
          <p>chỉ cấp 1: $\ 1 + 3\cdot 0{,}1 = 1{,}3$; &nbsp; thêm cấp 2: $\ 1{,}3 + \frac{1}{2}\cdot 6\cdot 0{,}01 = \hlg{1{,}33}$ — sát hơn $\checkmark$</p>
        focus: [1, "1.5", "2.1", "2.2"]
        say: "Thử với x mũ 3 tại 1, bước 0 phẩy 1. Giá trị thật là 1 phẩy 331. Chỉ dùng cấp 1 được 1 phẩy 3. Thêm cấp 2 được 1 phẩy 33, sát hơn hẳn."
      - clear: true
        show: |
          <div class="box key">Hessian = <b>Jacobian của gradient</b>: &nbsp; gradient $\ \nabla f = (3x^2 + 2y^2,\ 4xy)^T$ là hàm 2 đầu ra; lập Jacobian của nó (hàng = đầu ra, cột = biến) ra đúng $\begin{bmatrix} 6x & 4y \\ 4y & 4x \end{bmatrix} = \mathbf{H}_f$.</div>
          <p class="note">Hessian đo xem <b>mũi tên gradient thay đổi</b> thế nào khi ta bước đi. Nhờ đó Hessian cho biết quanh một điểm, mặt đất cong lên hay cong xuống.</p>
        focus: [1, 2]
        say: "Quan trọng, Hessian là Jacobian của gradient, vì gradient là hàm hai đầu ra, lập Jacobian của nó ra đúng Hessian. Nhờ vậy, Hessian cho biết quanh một điểm, mặt đất cong lên hay cong xuống."

  # ───────────────────────── 7. ĐỐI XỨNG — KHI NÀO ─────────────────────────
  - id: symm
    kind: concept
    title: "Hessian đối xứng — nhưng có điều kiện"
    checks:
      - "(lambda x, y: sp.diff(x**3 + 2*x*y**2, x, y) == sp.diff(x**3 + 2*x*y**2, y, x) == 4*y)(*sp.symbols('x y'))"
      - "(lambda x, y: sp.hessian(x**2 + y**2 - x*y + x - y, (x, y)) == sp.hessian(x**2 + y**2 - x*y + x - y, (x, y)).T)(*sp.symbols('x y'))"
      - "(lambda x, y: sp.simplify(sp.limit(sp.diff(x*y*(x**2 - y**2)/(x**2 + y**2), x), x, 0)) == -y and sp.simplify(sp.limit(sp.diff(x*y*(x**2 - y**2)/(x**2 + y**2), y), y, 0)) == x)(*sp.symbols('x y', real=True))"
    steps:
      - show: |
          <p>Ở ví dụ vừa rồi, hai ô chéo phụ bằng nhau:</p>
          $$\frac{\partial^2 f}{\partial x\,\partial y} = \frac{\partial^2 f}{\partial y\,\partial x} = 4y$$
          <p>Thứ tự lấy đạo hàm không quan trọng, và $\mathbf{H}_f$ <b>đối xứng</b>: $\ \mathbf{H}_f^T = \mathbf{H}_f$.</p>
        focus: [[1, 2], 3]
        say: "Ở ví dụ vừa rồi, lấy theo x rồi y hay theo y rồi x đều ra 4 y. Nên Hessian đối xứng qua đường chéo, chuyển vị của nó bằng chính nó."
      - show: |
          <div class="box warn"><b>Điều kiện</b> (hay bị bỏ qua): Hessian chỉ chắc chắn đối xứng khi các đạo hàm cấp 2 <b>liên tục</b> — tức không có chỗ “gãy”, “nhảy”.</div>
          <p class="note">Có hàm “gãy” tại gốc toạ độ, ví dụ $\ \dfrac{xy\,(x^2 - y^2)}{x^2 + y^2}$, mà hai thứ tự lấy đạo hàm tại $(0, 0)$ cho $-1$ và $1$ — khác nhau (kiểm bằng máy, audit T20d).</p>
        focus: [0, 1, 2]
        say: "Nhưng có một điều kiện hay bị bỏ qua. Hessian chỉ chắc chắn đối xứng khi các đạo hàm cấp 2 liên tục, không gãy, không nhảy. Có hàm gãy tại gốc toạ độ mà hai thứ tự cho âm 1 và 1, khác nhau."
      - show: |
          <p class="note">Các hàm hay gặp như đa thức, sai số bình phương đều trơn, nên Hessian của chúng đối xứng. Một số hàm về sau có chỗ gãy (ví dụ $|x|$ tại $0$): tại chỗ gãy không có Hessian. Bài 5: ma trận đối xứng có trị riêng thực, tức các hệ số kéo giãn của nó đều là số thực thông thường.</p>
        say: "Các hàm hay gặp như đa thức hay sai số bình phương đều trơn, nên Hessian đối xứng. Một số hàm về sau có chỗ gãy, ví dụ giá trị tuyệt đối của x tại 0, và tại chỗ gãy thì không có Hessian. Theo bài 5, ma trận đối xứng có trị riêng thực, tức các hệ số kéo giãn của nó đều là số thực thông thường."

  # ───────────────────────── 8. QUY TẮC CHUỖI MỘT BIẾN ─────────────────────────
  - id: chain1
    kind: formula
    title: "Quy tắc chuỗi: đạo hàm của hàm lồng trong hàm"
    checks:
      - "(lambda x: sp.expand((3*x + 1)**2) == 9*x**2 + 6*x + 1 and sp.diff(9*x**2 + 6*x + 1, x) == 18*x + 6)(sp.Symbol('x'))"
      - "(lambda x: sp.diff((3*x + 1)**2, x) == 2*(3*x + 1)*3 and (2*(3*x + 1)*3).subs(x, 1) == 24 and (18*x + 6).subs(x, 1) == 24)(sp.Symbol('x'))"
      - "Rational(403,100)**2 - 16 == Rational(2409,10000) and 24*Rational(1,100) == Rational(24,100)"
    steps:
      - show: |
          <p>Hàm lồng: $\ (3x + 1)^2$. &nbsp; Bên <b>trong</b>: $\ a = 3x + 1$; &nbsp; bên <b>ngoài</b>: bình phương $a^2$.</p>
          <p>Đi một bước nhỏ $h$ theo $x$:</p><p>&nbsp;&nbsp; $a$ tăng $\approx 3\cdot h$ &nbsp; (vì đạo hàm của $3x + 1$ là $3$)</p><p>&nbsp;&nbsp; rồi $a^2$ tăng $\approx 2a\cdot(3h)$ &nbsp; (vì đạo hàm của $a^2$ là $2a$)</p>
        focus: ["1.1", 1, [3, 4]]
        say: "Xét hàm lồng 3 x cộng 1, tất cả bình phương. Bên trong là a bằng 3 x cộng 1, bên ngoài là bình phương. Đi bước nhỏ h, theo phép xấp xỉ thì a tăng 3 h, rồi a bình phương tăng 2 a nhân 3 h."
      - show: |
          <div class="box key"><b>Quy tắc chuỗi</b>: đạo hàm của hàm lồng = (đạo hàm hàm ngoài, tính tại bên trong) $\cdot$ (đạo hàm hàm trong)
          $$\big((3x + 1)^2\big)' = 2(3x + 1)\cdot 3$$</div>
        say: "Chia mức tăng cho bước h, ta được quy tắc chuỗi như sau. Đạo hàm của hàm lồng bằng đạo hàm hàm ngoài, tính tại bên trong, nhân với đạo hàm hàm trong. Ở đây là 2 nhân 3 x cộng 1, rồi nhân 3."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \big((3x + 1)^2\big)' = 2(3x + 1)\cdot 3$</p>
          <p><b>Làm thử ngay</b> tại $x = 1$: quy tắc cho $\ 2\cdot 4\cdot 3 = \hlo{24}$.</p>
          <p>Kiểm bằng phá ngoặc: $\ (3x + 1)^2 = 9x^2 + 6x + 1$; đạo hàm theo bảng bài 6 là $\ 18x + 6$,</p><p>tại $x = 1$: $\ 18 + 6 = 24\ \checkmark$</p>
        focus: [2, [3, 4]]
        say: "Làm thử ngay tại x bằng 1, quy tắc cho 2 nhân 4 nhân 3, bằng 24. Kiểm bằng cách khác, phá ngoặc được 9 x bình phương cộng 6 x cộng 1, đạo hàm theo bảng bài 6 là 18 x cộng 6, thay x bằng 1 cũng được 24."
      - show: |
          <p>Kiểm bằng bước nhỏ $h = 0{,}01$ (tại $x = 1$, hàm bằng $16$):</p>$$\text{thật: } (3\cdot 1{,}01 + 1)^2 - 16 = 4{,}03^2 - 16 = 0{,}2409, \qquad \text{dự đoán: } 24\cdot 0{,}01 = 0{,}24\ \checkmark$$
        say: "Kiểm thêm bằng bước nhỏ 0 phẩy 01, mức tăng thật là 0 phẩy 2409, còn theo phép xấp xỉ thì dự đoán là 24 nhân 0 phẩy 01, bằng 0 phẩy 24, khớp."

  # ───────────────────────── 9. QUY TẮC CHUỖI DẠNG MA TRẬN ─────────────────────────
  - id: chain_mat
    kind: formula
    title: "Quy tắc chuỗi nhiều biến: nhân các Jacobian"
    checks:
      - "(lambda A, B, C: (A*B)*C == A*(B*C))(Matrix([[1, 2]]), Matrix([[0, 1], [3, 1]]), Matrix([1, 2]))"
      - "Matrix([[1, 2]])*Matrix([[0, 1], [3, 1]]) == Matrix([[6, 3]]) and Matrix([[0, 1], [3, 1]])*Matrix([1, 2]) == Matrix([2, 5]) and 6*1 + 3*2 == 12 and 1*2 + 2*5 == 12"
      - "(lambda x, y, a, b: Matrix([a**2 + b]).jacobian([a, b]) == Matrix([[2*a, 1]]) and Matrix([x + y, x*y]).jacobian([x, y]) == Matrix([[1, 1], [y, x]]))(*sp.symbols('x y a b'))"
      - "Matrix([[6, 1]]) * Matrix([[1, 1], [2, 1]]) == Matrix([[8, 7]])"
      - "(lambda x, y: sp.diff((x + y)**2 + x*y, x).subs({x: 1, y: 2}) == 8 and sp.diff((x + y)**2 + x*y, y).subs({x: 1, y: 2}) == 7)(*sp.symbols('x y'))"
      - "(lambda x, y: ((x + y)**2 + x*y).subs({x: 1, y: 2}) == 11 and (x + y).subs({x: 1, y: 2}) == 3 and (x*y).subs({x: 1, y: 2}) == 2 and 3**2 + 2 == 11)(*sp.symbols('x y'))"
    steps:
      - show: |
          <p><b>Chuẩn bị</b> — nhân ba ma trận: nhân hai cái đầu trước, hay hai cái sau trước, đều ra cùng kết quả (tính kết hợp):</p>
          $$\Big(\begin{bmatrix} 1 & 2 \end{bmatrix}\begin{bmatrix} 0 & 1 \\ 3 & 1 \end{bmatrix}\Big)\begin{bmatrix} 1 \\ 2 \end{bmatrix} = \begin{bmatrix} 6 & 3 \end{bmatrix}\begin{bmatrix} 1 \\ 2 \end{bmatrix} = 12, \qquad \begin{bmatrix} 1 & 2 \end{bmatrix}\Big(\begin{bmatrix} 0 & 1 \\ 3 & 1 \end{bmatrix}\begin{bmatrix} 1 \\ 2 \end{bmatrix}\Big) = \begin{bmatrix} 1 & 2 \end{bmatrix}\begin{bmatrix} 2 \\ 5 \end{bmatrix} = 12$$
          <p class="note">Được đổi chỗ <b>ngoặc</b>, nhưng không được đổi <b>thứ tự</b> các ma trận (bài 2).</p>
        focus: [[1, 2], 3]
        say: "Chuẩn bị một điều mới, nhân ba ma trận thì nhân hai cái đầu trước hay hai cái sau trước đều ra 12. Được đổi chỗ ngoặc, nhưng theo bài 2, không được đổi thứ tự."
      - clear: true
        show: |
          <p>Hàm lồng nhiều biến: bên trong $\ a = x + y,\ \ b = xy$; &nbsp; bên ngoài $\ k(a, b) = a^2 + b$.</p>
          <p>Bước nhỏ $\mathbf{h}$ theo $(x, y)$: &nbsp; $(a, b)$ thay đổi $\approx \mathbf{J}_{\text{trong}}\,\mathbf{h}$, &nbsp; rồi:</p>$$k \text{ thay đổi} \approx \mathbf{J}_{\text{ngoài}}\big(\mathbf{J}_{\text{trong}}\,\mathbf{h}\big) = \big(\mathbf{J}_{\text{ngoài}}\,\mathbf{J}_{\text{trong}}\big)\,\mathbf{h}$$
        focus: [1, 2, 3]
        say: "Xét hàm lồng, bên trong a bằng x cộng y, b bằng x y, bên ngoài k bằng a bình phương cộng b. Theo phép xấp xỉ, a, b thay đổi Jacobian trong nhân h, rồi k thay đổi Jacobian ngoài nhân tiếp. Nhờ tính kết hợp, đó là tích hai Jacobian nhân h."
      - show: |
          <div class="box key"><b>Quy tắc chuỗi dạng ma trận</b>: $\ \mathbf{J}_{\text{hàm lồng}} = \mathbf{J}_{\text{ngoài}}\cdot\mathbf{J}_{\text{trong}}$ &nbsp; — nhân ma trận, <b>ngoài trước, trong sau</b>.</div>
        say: "Vậy theo phép xấp xỉ, Jacobian của hàm lồng bằng Jacobian ngoài nhân Jacobian trong. Đây là nhân ma trận, ngoài viết trước, trong viết sau."
      - clear: true
        show: |
          <svg width="1400" height="420" viewBox="0 0 1400 420"><defs><marker id="c7B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="c7O" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="30" y="60" width="220" height="110" rx="16" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="140" y="105" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">đầu vào</text><text x="140" y="145" font-size="24" text-anchor="middle" fill="#1f2937">(x, y) = (1, 2)</text><rect x="560" y="60" width="220" height="110" rx="16" fill="#fef9c3" stroke="#1f2937" stroke-width="3"/><text x="670" y="105" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">giữa</text><text x="670" y="145" font-size="24" text-anchor="middle" fill="#1f2937">(a, b) = (3, 2)</text><rect x="1090" y="60" width="220" height="110" rx="16" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1200" y="105" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">đầu ra</text><text x="1200" y="145" font-size="24" text-anchor="middle" fill="#1f2937">k = 11</text><g stroke="#2563eb" stroke-width="4" fill="none"><line x1="255" y1="115" x2="552" y2="115" marker-end="url(#c7B)"/><line x1="785" y1="115" x2="1082" y2="115" marker-end="url(#c7B)"/></g><g font-size="24" text-anchor="middle" fill="#2563eb"><text x="405" y="45">trong: a = x + y, b = xy</text><text x="935" y="45">ngoài: k = a² + b</text></g><g font-size="24" text-anchor="middle" fill="#ea580c"><text x="405" y="215">J trong = [1 1 ; 2 1]</text><text x="935" y="215">J ngoài = [6 1]</text></g><path d="M1200,250 C1100,330 300,330 140,250" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#c7O)"/><text x="700" y="390" font-size="26" font-weight="bold" text-anchor="middle" fill="#ea580c">đạo hàm cả đường: [6 1] nhân J trong = [8 7]</text></svg>
        say: "Hình vẽ đường đi của dữ liệu tại điểm 1, 2. Đi xuôi theo mũi tên xanh, x và y vào hàm trong, ra a bằng 3 và b bằng 2. Rồi a, b vào hàm ngoài, ra k bằng 9 cộng 2, tức là 11. Mỗi chặng có một ma trận Jacobian riêng, ghi màu cam dưới mũi tên của chặng đó. Đạo hàm của cả đường đi là tích các Jacobian, ngoài viết trước, trong viết sau, giống như nhân các độ dốc dọc đường đi."
      - clear: true
        show: |
          <p class="note">Đang có: $\ a = x + y,\ b = xy,\ k = a^2 + b$, &nbsp; $\mathbf{J}_{\text{hàm lồng}} = \mathbf{J}_{\text{ngoài}}\cdot\mathbf{J}_{\text{trong}}$</p>
          <p>$\mathbf{J}_{\text{ngoài}} = \begin{bmatrix} 2a & 1 \end{bmatrix}$ ($\sz{1}{2}$), &nbsp; $\mathbf{J}_{\text{trong}} = \begin{bmatrix} 1 & 1 \\ y & x \end{bmatrix}$ ($\sz{2}{2}$)</p>
          <p><b>Làm thử tại $(1, 2)$</b>: $\ a = 3,\ b = 2$: &nbsp; $\begin{bmatrix} 6 & 1 \end{bmatrix}\begin{bmatrix} 1 & 1 \\ 2 & 1 \end{bmatrix} = \begin{bmatrix} 6 + 2 & 6 + 1 \end{bmatrix} = \begin{bmatrix} \hlo{8} & \hlo{7} \end{bmatrix}$</p>
        focus: [1, "2.1", "2.3", "3.2", "3.3"]
        say: "Tính cụ thể. Ma trận Jacobian ngoài là 2 a, 1, cỡ 1 nhân 2. Ma trận Jacobian trong là 1, 1, y, x, cỡ 2 nhân 2. Thử tại điểm 1, 2, thay vào thì a bằng 3, b bằng 2. Nhân hai ma trận được 8 và 7."
      - show: |
          <p>Kiểm bằng cách thay thẳng: $\ k = (x + y)^2 + xy$; tại $(1, 2)$:</p>
          <p>$\dfrac{\partial k}{\partial x} = 2(x + y) + y = 8, \qquad \dfrac{\partial k}{\partial y} = 2(x + y) + x = 7\ \checkmark$</p>
          <p class="note">Cỡ khớp: $(\sz{1}{2})\cdot(\sz{2}{2}) \to \sz{1}{2}$ — một đầu ra, hai đầu vào.</p>
        focus: [1, 2, 3]
        say: "Kiểm bằng cách thay thẳng, k bằng x cộng y bình phương cộng x y. Theo quy tắc chuỗi một biến, đạo hàm riêng theo x là 8, theo y là 7, khớp. Cỡ cũng khớp, một hàng, hai cột."

  # ───────────────────────── 10. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ: Hessian của hàm bài 6, và một “lớp nơ-ron” nhỏ"
    checks:
      - "(lambda x, y: sp.hessian(x**2 + y**2 - x*y + x - y, (x, y)) == Matrix([[2, -1], [-1, 2]]))(*sp.symbols('x y'))"
      - "(lambda x, y: sp.diff(2*x - y + 1, x) == 2 and sp.diff(2*x - y + 1, y) == -1 and sp.diff(2*y - x - 1, x) == -1 and sp.diff(2*y - x - 1, y) == 2)(*sp.symbols('x y'))"
      - "Matrix([[1, 2], [3, -1]]) * Matrix([1, 1]) == Matrix([3, 2])"
      - "Matrix([[2*3, 2*2]]) * Matrix([[1, 2], [3, -1]]) == Matrix([[18, 8]])"
      - "(lambda x, y: sp.diff((x + 2*y)**2 + (3*x - y)**2, x).subs({x: 1, y: 1}) == 18 and sp.diff((x + 2*y)**2 + (3*x - y)**2, y).subs({x: 1, y: 1}) == 8)(*sp.symbols('x y'))"
    steps:
      - show: |
          <p><b>Phần 1</b> (hàm ví dụ chính của bài 6): $\ f(x, y) = x^2 + y^2 - xy + x - y$</p><p>Bài 6 đã có: $\ \nabla f = (2x - y + 1,\ 2y - x - 1)^T$</p>
          <p>Đạo hàm tiếp: $\ 2x - y + 1$ theo $x$ được $2$, theo $y$ được $-1$;<br>$2y - x - 1$ theo $x$ được $-1$, theo $y$ được $2$</p>
        focus: [0, 1, 2, 3]
        say: "Giờ làm ví dụ. Phần một là hàm ví dụ chính của bài 6, x bình phương cộng y bình phương trừ x y cộng x trừ y. Ở bài 6, ta đã tính gradient của hàm này, gồm hai thành phần 2 x trừ y cộng 1, và 2 y trừ x trừ 1. Lấy đạo hàm tiếp từng thành phần, ta được 2, âm 1, âm 1, và 2."
      - show: |
          $$\mathbf{H}_f = \begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix} \ \text{ ở mọi điểm — đối xứng } \checkmark$$
          <p class="note">Hessian là hằng số vì $f$ chỉ có bậc 2. Ở bài 6 ta đã tìm được điểm dừng $\left(-\dfrac{1}{3}, \dfrac{1}{3}\right)$; ma trận này sẽ cho biết đó là đáy hay đỉnh.</p>
        focus: [1, 2, "2.2"]
        say: "Vậy Hessian là 2, âm 1, âm 1, 2 ở mọi điểm, và nó đối xứng. Nó là hằng số vì hàm chỉ có bậc 2. Ma trận này sẽ cho biết điểm dừng tìm được ở bài 6, âm một phần ba, một phần ba, là đáy hay đỉnh."
      - clear: true
        show: |
          <p><b>Phần 2 — một “lớp nơ-ron” nhỏ</b>:</p><p>bên trong: $\ (a, b)^T = \mathbf{W}(x, y)^T$ với $\ \mathbf{W} = \begin{bmatrix} 1 & 2 \\ 3 & -1 \end{bmatrix}$; &nbsp; bên ngoài là sai số: $\ k = a^2 + b^2$</p>
          <p>Tại $(x, y) = (1, 1)$: $\ (a, b) = (1 + 2,\ 3 - 1) = (3, 2)$</p>
        focus: [1, "2.1", "2.3", 3]
        say: "Phần hai là một lớp nơ-ron nhỏ. Bên trong, nhân vector x, y với ma trận 1, 2, 3, âm 1, ta được a và b. Bên ngoài là sai số, a bình phương cộng b bình phương. Tại điểm 1, 1, a bằng 3, b bằng 2."
      - show: |
          <p>$\mathbf{J}_{\text{trong}} = \mathbf{W}$ (hàm nhân ma trận), &nbsp; $\mathbf{J}_{\text{ngoài}} = \begin{bmatrix} 2a & 2b \end{bmatrix} = \begin{bmatrix} 6 & 4 \end{bmatrix}$</p>
          $$\begin{bmatrix} 6 & 4 \end{bmatrix}\begin{bmatrix} 1 & 2 \\ 3 & -1 \end{bmatrix} = \begin{bmatrix} 6 + 12 & 12 - 4 \end{bmatrix} = \begin{bmatrix} \hlo{18} & \hlo{8} \end{bmatrix}$$
          <p class="note">Kiểm thay thẳng: $\ k = (x + 2y)^2 + (3x - y)^2$, đạo hàm riêng tại $(1, 1)$ là $18$ và $8\ \checkmark$</p>
        focus: ["1.1", "1.2", 2, 3]
        say: "Jacobian trong chính là ma trận đó, vì đây là hàm nhân ma trận. Ma trận Jacobian ngoài là 2 a, 2 b, bằng 6, 4. Theo quy tắc chuỗi, nhân hai ma trận được 18 và 8. Thay thẳng rồi đạo hàm cũng ra 18 và 8."

  # ───────────────────────── 11. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: bước nhỏ cho Hessian, và kiểm cỡ"
    checks:
      - "(lambda x, y: Matrix([3*x**2 + 2*y**2, 4*x*y]).subs({x: 1, y: 2}) == Matrix([11, 8]) and Matrix([3*x**2 + 2*y**2, 4*x*y]).subs({x: Rational(11,10), y: 2}) == Matrix([Rational(1163,100), Rational(88,10)]))(*sp.symbols('x y'))"
      - "Matrix([Rational(1163,100), Rational(88,10)]) - Matrix([11, 8]) == Matrix([Rational(63,100), Rational(8,10)]) and Rational(1,10)*Matrix([6, 8]) == Matrix([Rational(6,10), Rational(8,10)])"
    steps:
      - show: |
          <p class="note">Đang có: $\ f = x^3 + 2xy^2$, $\ \nabla f = (3x^2 + 2y^2,\ 4xy)^T$, $\ \mathbf{H}_f(1, 2) = \begin{bmatrix} 6 & 8 \\ 8 & 4 \end{bmatrix}$</p>
          <p><b>Phép thử 1</b> — Hessian là Jacobian của gradient, nên cho $x$ tăng $0{,}1$ thì gradient thay đổi xấp xỉ $0{,}1$ nhân cột 1 của $\mathbf{H}_f$:</p>$$0{,}1\cdot(6, 8)^T = (0{,}6;\ 0{,}8)^T$$
        focus: [0, [2, 3]]
        say: "Tự kiểm tra như mọi bài. Phép thử một, vì Hessian là Jacobian của gradient, nên cho x tăng 0 phẩy 1 thì gradient phải thay đổi khoảng 0 phẩy 1 nhân cột đầu của Hessian, tức 0 phẩy 6 và 0 phẩy 8."
      - show: |
          <p>Thật: gradient tại $(1, 2)$ là $(11, 8)^T$; tại $x = 1{,}1$, $y = 2$ là $(11{,}63;\ 8{,}8)^T$ — thay đổi $(0{,}63;\ 0{,}8)^T\ \checkmark$</p>
        say: "Tính thật, gradient tại 1, 2 là 11 và 8. Khi x bằng 1 phẩy 1, nó là 11 phẩy 63 và 8 phẩy 8. Thay đổi 0 phẩy 63 và 0 phẩy 8, khớp dự đoán."
      - clear: true
        show: |
          <p><b>Phép thử 2</b> — kiểm cỡ trước khi tính:</p>
          <table class="t"><tr><th>Thứ</th><th>Cỡ</th></tr>
          <tr><td>Jacobian: $E$ đầu ra, $D$ đầu vào</td><td>$\sz{E}{D}$</td></tr>
          <tr><td>Hessian của hàm $D$ biến, một đầu ra</td><td>$\sz{D}{D}$, đối xứng</td></tr>
          <tr><td>$\mathbf{J}_{\text{ngoài}}\cdot\mathbf{J}_{\text{trong}}$</td><td>hai số ở giữa phải bằng nhau</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Phép thử hai, kiểm cỡ trước khi tính. Jacobian có số hàng bằng số đầu ra, số cột bằng số đầu vào. Hessian có số hàng bằng số cột, và đối xứng. Còn khi nhân hai Jacobian, theo bài 2, hai số ở giữa phải bằng nhau."

  # ───────────────────────── 12. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Jacobian, Hessian, quy tắc chuỗi sẽ dùng ở đâu"
    steps:
      - show: |
          <div class="box key"><b>Lan truyền ngược</b> (bài 22 — cách tính gradient cho mạng nơ-ron nhiều lớp): “đạo hàm gửi về = đạo hàm từ phía sau $\times$ đạo hàm tại chỗ” — chính là quy tắc chuỗi.</div>
          <p class="note">Với vector, phép “$\times$” đó là <b>nhân ma trận các Jacobian</b>, không phải nhân từng ô.</p>
        focus: [1, 2]
        say: "Ở bài 22, khi tính gradient cho mạng nơ-ron nhiều lớp, đạo hàm gửi về bằng đạo hàm từ phía sau nhân đạo hàm tại chỗ, chính là quy tắc chuỗi. Với vector, đó là nhân ma trận các Jacobian, không phải nhân từng ô."
        forward_ref: true
      - show: |
          <table class="t"><tr><th>bài</th><th>dùng thế nào</th></tr>
          <tr><td><b>Bài 8</b></td><td>tại điểm dừng, xét trị riêng của Hessian để biết đó là đáy, đỉnh, hay <b>yên ngựa</b> (lên theo hướng này, xuống theo hướng kia)</td></tr>
          <tr><td><b>Bài 11</b></td><td>phương pháp Newton dùng thêm độ cong (Hessian) để bước nhanh hơn Gradient Descent; Levenberg-Marquardt xấp xỉ Hessian bằng $\mathbf{J}^T\mathbf{J}$ khi sai số là tổng bình phương</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Ở bài 8, ta xét trị riêng của Hessian tại điểm dừng để biết đó là đáy, đỉnh, hay yên ngựa, tức chỗ lên theo hướng này nhưng xuống theo hướng kia. Ở bài 11, có những phương pháp dùng thêm độ cong để bước nhanh hơn, và một cách xấp xỉ Hessian bằng Jacobian khi sai số là tổng các bình phương."
        forward_ref: true

  # ───────────────────────── 13. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda x: sp.diff((3*x + 1)**2, x) != 2*(3*x + 1) and sp.diff((3*x + 1)**2, x).subs(x, 1) == 24 and (2*(3*x + 1)).subs(x, 1) == 8)(sp.Symbol('x'))"
      - "Matrix([[4, 1], [5, 4]]).T == Matrix([[4, 5], [1, 4]]) and Matrix([[4, 5], [1, 4]]) * Matrix([Rational(1,10), 0]) == Matrix([Rational(4,10), Rational(1,10)]) and 5*Rational(11,10) + 4 - 9 == Rational(1,2) and 5*Rational(1,10) == Rational(1,2)"
      - "Matrix([[1, 1], [2, 1]]).shape == (2, 2) and Matrix([[6, 1]]).shape == (1, 2)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1</b> (hay gặp nhất): coi Jacobian là đạo hàm cấp 2, hoặc Hessian là ma trận của hàm nhiều đầu ra <b class="red">(sai)</b>
          <br><span class="note">Jacobian: đạo hàm <b>cấp 1</b> của hàm <b>nhiều đầu ra</b> ($\sz{E}{D}$). Hessian: đạo hàm <b>cấp 2</b> của hàm <b>một đầu ra</b> ($\sz{D}{D}$). Nối với nhau: Hessian = Jacobian của gradient.</span></div>
        say: "Lỗi thứ nhất, cũng là lỗi hay gặp nhất, là nhầm Jacobian với Hessian. Jacobian là đạo hàm cấp 1 của hàm nhiều đầu ra. Hessian là đạo hàm cấp 2 của hàm một đầu ra. Liên hệ giữa hai ma trận này là, Hessian chính là Jacobian của gradient."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên nhân đạo hàm của hàm trong: $\ \big((3x + 1)^2\big)' = 2(3x + 1)$ <b class="red">(sai)</b> — thiếu $\cdot 3$
          <br><span class="note">Tại $x = 1$ cách sai cho $8$, đúng là $24$. Phép thử bước nhỏ ($0{,}2409 \approx 24\cdot 0{,}01$) bắt được.</span></div>
        say: "Lỗi thứ hai, quên nhân đạo hàm của hàm trong, ghi đạo hàm của 3 x cộng 1 bình phương là 2 nhân 3 x cộng 1. Thiếu nhân 3. Tại x bằng 1, cách sai cho 8, đúng là 24, và phép thử bước nhỏ bắt được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đổi thứ tự, viết $\ \mathbf{J}_{\text{trong}}\cdot\mathbf{J}_{\text{ngoài}}$, hoặc nhân từng ô <b class="red">(sai)</b>
          <br><span class="note">Ví dụ chuỗi: $\ (\sz{2}{2})\cdot(\sz{1}{2})$ — hai số ở giữa $2 \ne 1$, không nhân được. Kiểm cỡ là bắt được ngay.</span></div>
        say: "Lỗi thứ ba, đổi thứ tự thành Jacobian trong nhân Jacobian ngoài, hoặc nhân từng ô. Ở ví dụ, cỡ 2 nhân 2 nhân với cỡ 1 nhân 2 thì hai số ở giữa không bằng nhau, nên không nhân được."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Xếp Jacobian ngược hàng với cột <b class="red">(sai)</b>
          <br><span class="note">Với $\mathbf{f} = (x^2 y,\ 5x + y^2)^T$ tại $(1, 2)$, bản đảo là $\begin{bmatrix} 4 & 5 \\ 1 & 4 \end{bmatrix}$. Cho $x$ tăng $0{,}1$, giữ $y = 2$, $f_2$ tăng bao nhiêu?</span>
          <table class="t"><tr><th>bản đảo dự đoán</th><th>thật</th><th>bản đúng dự đoán</th></tr>
          <tr><td>$1\cdot 0{,}1 = 0{,}1$</td><td>$5\cdot 1{,}1 + 4 - 9 = 0{,}5$</td><td>$5\cdot 0{,}1 = 0{,}5\ \checkmark$</td></tr></table>
          <span class="note">Nhớ: <b>hàng = đầu ra</b>.</span></div>
        say: "Lỗi thứ tư, xếp Jacobian ngược hàng với cột. Khi x tăng 0 phẩy 1, bản đảo dự đoán f hai tăng 0 phẩy 1, nhưng thật nó tăng 0 phẩy 5, đúng như bản xếp đúng. Hãy nhớ, mỗi hàng là một đầu ra."

  # ───────────────────────── 14. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda x, y: Matrix([x**2 + y, x*y]).jacobian([x, y]).subs({x: 2, y: 1}) == Matrix([[4, 1], [1, 2]]))(*sp.symbols('x y'))"
      - "(lambda x, y: sp.hessian(x**2*y, (x, y)) == Matrix([[2*y, 2*x], [2*x, 0]]) and sp.hessian(x**2*y, (x, y)).subs({x: 2, y: 1}) == Matrix([[2, 4], [4, 0]]))(*sp.symbols('x y'))"
      - "(lambda x: sp.diff((x**2 + 1)**3, x) == 3*(x**2 + 1)**2*2*x and sp.diff((x**2 + 1)**3, x).subs(x, 1) == 24)(sp.Symbol('x'))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\mathbf{f}(x, y) = (x^2 + y,\ xy)^T$: lập $\mathbf{J}$ tại $(2, 1)$.</td></tr>
          <tr><td>2</td><td>$q(x, y) = x^2 y$: lập $\mathbf{H}_q$ tại $(2, 1)$. Có đối xứng không?</td></tr>
          <tr><td>3</td><td>Đạo hàm của $(x^2 + 1)^3$ tại $x = 1$.</td></tr></table>
        say: "Đến lượt bạn, có ba câu. Một, lập Jacobian của hàm x bình phương cộng y và x y tại điểm 2, 1. Hai, lập Hessian của x bình phương nhân y tại 2, 1. Ba, tính đạo hàm của x bình phương cộng 1, mũ 3, tại x bằng 1. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\ \mathbf{J} = \begin{bmatrix} 2x & 1 \\ y & x \end{bmatrix} = \begin{bmatrix} \hlo{4} & \hlo{1} \\ \hlo{1} & \hlo{2} \end{bmatrix}$ &nbsp; (hàng 1: $x^2 + y$, hàng 2: $xy$)</p>
          <p>② $\ \dfrac{\partial q}{\partial x} = 2xy,\ \dfrac{\partial q}{\partial y} = x^2$ &nbsp; $\implies$ &nbsp; $\mathbf{H}_q = \begin{bmatrix} 2y & 2x \\ 2x & 0 \end{bmatrix} = \begin{bmatrix} \hlo{2} & \hlo{4} \\ \hlo{4} & \hlo{0} \end{bmatrix}$ — đối xứng $\checkmark$</p>
        focus: [1, 2]
        say: "Đáp án câu một, hàng đầu là 2 x và 1, hàng sau là y và x, tại 2, 1 được 4, 1, 1, 2. Câu hai, gradient là 2 x y và x bình phương, đạo hàm tiếp ta được ma trận Hessian là 2, 4, 4, 0, đối xứng."
      - show: |
          <p>③ Trong: $\ a = x^2 + 1$ (đạo hàm $2x$); &nbsp; ngoài: $\ a^3$ (đạo hàm $3a^2$)</p><p>Quy tắc chuỗi: $\ 3(x^2 + 1)^2\cdot 2x$, tại $x = 1$: $\ 3\cdot 4\cdot 2 = \hlg{24}$</p>
        focus: [1, 2, 0]
        say: "Câu ba, hàm trong là x bình phương cộng 1, hàm ngoài là mũ 3. Theo quy tắc chuỗi, 3 nhân bình phương bên trong, nhân 2 x, tại 1 được 3 nhân 4 nhân 2, bằng 24. Nếu bạn ra đúng, chúc mừng bạn."

