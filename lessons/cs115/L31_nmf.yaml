    say: Gợi ý cài đặt bài số 31 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 2 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (2 dòng)</b></p><div class="code"><div>step1 B=[1.2222, 1.1111] err=0.3951</div><div>step2 B=[1.2737, 1.0638] err=0.3122</div></div>
    say: Màn hình hiện 2 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">$\mathbf{X} \approx \mathbf{A}\mathbf{B}$, mọi số $\ge 0$</span><span class="a">→</span>

      <span class="n">chỉ cộng các phần: dễ đọc</span><span class="a">→</span>

      <span class="n">quy tắc nhân: giữ không âm, $E$ không tăng</span><span class="a">→</span>

      <span class="n">không duy nhất, cực tiểu địa phương</span></div>

      '
    say: Tổng kết chuỗi logic. Với dữ liệu không âm như tần suất từ hay cường độ sáng ảnh, ta xấp xỉ ma trận gốc thành tích A nhân B. Mọi phần tử của cả hai ma trận thừa số đều giữ lớn hơn hoặc bằng không. Ma trận hệ số A và ma trận phần B giữ vai trò cân xứng trong bài toán tái tạo dữ liệu gốc.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="chain"><span class="n">$\mathbf{X} \approx \mathbf{A}\mathbf{B}$, mọi số $\ge 0$</span><span class="a">→</span>

      <span class="n">chỉ cộng các phần: dễ đọc</span><span class="a">→</span>

      <span class="n">quy tắc nhân: giữ không âm, $E$ không tăng</span><span class="a">→</span>

      <span class="n">không duy nhất, cực tiểu địa phương</span></div>

      '
    say: Thuật toán cập nhật bằng phép nhân bảo toàn dấu không âm tự động qua từng bước và đảm bảo hàm mất mát tái tạo không bao giờ tăng. Hãy lưu ý nghiệm phân rã không duy nhất vì luôn nhân hai ma trận bằng hai hệ số nghịch đảo nhau được. Lời giải còn phụ thuộc mạnh vào điểm khởi tạo ban đầu. Khi phân tích hàng vạn bài viết hoặc bảng đánh giá thưa, chọn hạng phân rã nhỏ giúp ép mô hình gom từ đồng nghĩa thành chủ đề cô đọng. Khi đó ta rất dễ đặt tên từng nhóm nội dung. Bạn cũng có thể chấm điểm mức đóng góp của từng từ khoá trên mỗi hàng để lọc ra năm tới mười từ đại diện rõ nhất cho từng chủ đề. Điều này biến kết quả toán học thành báo cáo phân tích rất dễ giải thích với người làm kinh doanh. Hãy luôn chạy thuật toán với nhiều hạt giống khởi tạo khác nhau rồi đối chiếu sai số tái tạo cùng độ ổn định của các chủ đề thu được trước khi chốt kết quả. Thêm một lượng phạt điều chuẩn nhẹ trên các ma trận hệ số còn giúp mỗi mẫu chỉ dùng đúng vài thành phần nổi bật nhất để biểu diễn gọn gàng. Mỗi bước nhân đều giữ bảng thừa số không âm và làm sai số giảm đều cho tới khi hội tụ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.7'
    - '1.7'
  - show: '<div class="box key"><b>Tư duy:</b> một ràng buộc đơn giản (không âm) có thể biến các con số khó hiểu thành những “phần” có ý nghĩa.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ ma trận 4×4 minh hoạ tới 10 000 văn bản × 5 000 từ ở hạng K = 50: giữ mọi số không âm tốn O(nDK) mỗi vòng nhưng tách được từng chủ đề dễ đọc.</p>

      '
    say: Điều cần mang theo, một ràng buộc đơn giản như không âm có thể biến các con số khó hiểu thành những phần có ý nghĩa. Chính sự mộc mạc của ràng buộc dấu dương đã mở ra một hướng phân tích đặc trưng dễ diễn giải cho nhiều ngành.
    focus:
    - 1
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 32): <b>t-SNE</b> — trực quan hoá dữ liệu nhiều chiều bằng xác suất láng giềng.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 32, ta học cách vẽ dữ liệu nhiều chiều lên mặt phẳng, giữ các láng giềng gần nhau bằng xác suất. Hẹn gặp bạn ở bài tiếp theo.
