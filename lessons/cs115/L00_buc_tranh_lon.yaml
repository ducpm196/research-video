- id: check
  kind: check
  title: 'Tự kiểm: thay thẳng w = 3,36 vào hai nhà'
  checks:
  - Rational(336, 100)*6 == Rational(2016, 100) and (Rational(2016, 100) - 20)**2 == Rational(256, 10000)
  - Rational(336, 100)*5 == Rational(168, 10) and (Rational(168, 10) - 17)**2 == Rational(4, 100)
  - Rational(256, 10000) + Rational(4, 100) == Rational(656, 10000) and round(0.0656, 3) == 0.066 and round(float(Rational(4, 61)), 3) == 0.066
  - Rational(656, 10000) < Rational(16, 100) and Rational(656, 10000) < Rational(29, 100) and Rational(656, 10000) > 0
  steps:
  - show: '<p><b>Bước 1.</b> Nhà A (6, 2, 4), giá thật 20, với $w = 3{,}36$:</p>

      $$\hat{y} = 3{,}36 \cdot 6 + 4 - 4 = 20{,}16, \qquad (20{,}16 - 20)^2 = 0{,}16^2 = 0{,}0256$$

      '
    focus:
    - 1
    - 2
    say: Ta kiểm con số 0,066 bằng cách thay thẳng w bằng 3,36 vào từng nhà. Bước một, nhà A có giá đoán 3,36 nhân 6, bằng 20,16, lệch 0,16 so với giá thật, bình phương lên được 0,0256.
  - show: '<p><b>Bước 2.</b> Nhà B (5, 1, 2), giá thật 17:</p>

      $$\hat{y} = 3{,}36 \cdot 5 + 2 - 2 = 16{,}8, \qquad (16{,}8 - 17)^2 = (-0{,}2)^2 = 0{,}04$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, thay w vào nhà B, giá đoán là 3,36 nhân 5, bằng 16,8. Vì nhà B bị đoán thấp hơn giá thật 0,2, bình phương lên được 0,04.
  - show: '<p><b>Bước 3.</b> Cộng hai nhà:</p>

      $$0{,}0256 + 0{,}04 = 0{,}0656 \approx \hlg{0{,}066} \ \checkmark$$

      '
    focus:
    - 1
    - 2
    say: Bước ba, theo định nghĩa sai số tổng, ta cộng hai sai số bình phương, được 0,0656, làm tròn là 0,066. Con số này khớp với đáy bát mà ta đọc trên hình.
  - show: '<table class="t"><tr><th>$w$</th><th>sai số tổng</th><th>so với đáy 0,066</th></tr>

      <tr><td>3,3</td><td>0,29</td><td>lớn hơn</td></tr>

      <tr><td>3,36</td><td>$\hlg{0{,}066}$</td><td>chính là đáy</td></tr>

      <tr><td>3,4</td><td>0,16</td><td>lớn hơn</td></tr></table>

      '
    focus:
    - 0
    - - '1.2'
      - '1.4'
    - 0
    - 0
    say: Bước bốn, đặt kết quả cạnh hai dòng của bảng cũ. Ở w bằng 3,3 tổng là 0,29, ở w bằng 3,4 là 0,16, đều lớn hơn 0,066. Vì hai bên đều cao hơn và đường cong có dạng cái bát, đáy nằm giữa hai giá trị đó. Còn đáy lớn hơn 0 vì không có w nào chiều được cả hai nhà.
- id: quymo
  kind: example
  title: Khi mô hình có nhiều trọng số, cách thử mò gãy
  checks:
  - '[100**k * 1000 for k in (1, 2, 3, 10)] == [10**5, 10**7, 10**9, 10**23]'
  - '[x / 10**9 for x in (10**5, 10**7, 10**9)] == [0.0001, 0.01, 1.0]'
  - 10**23 // 10**9 == 10**14 and round(10**14 / (365.25 * 86400) / 10**6, 2) == 3.17
  steps:
  - show: '<p>Hôm nay chỉ có <b>1</b> trọng số $w$. Mỗi trọng số thử <b>100</b> giá trị, có <b>1 000</b> ngôi nhà. Một <b>phép tính</b> = tính giá đoán và sai số của một nhà, một lần.</p>

      <table class="t"><tr><th>số trọng số</th><th>số lần thử $100^k$</th><th>phép tính (× 1 000 nhà)</th></tr>

      <tr><td>1</td><td>100</td><td>100 000</td></tr>

      <tr><td>2</td><td>10 000</td><td>10 triệu</td></tr>

      <tr><td>3</td><td>1 triệu</td><td>1 tỉ</td></tr>

      <tr><td>10</td><td>$10^{20}$</td><td>$10^{23}$</td></tr></table>

      '
    focus:
    - 0
    - 1
    - - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
    say: Hôm nay mô hình chỉ có một trọng số, nên thử mò từng giá trị còn được. Giả sử mỗi trọng số thử một trăm giá trị, có một nghìn ngôi nhà, và một phép tính là tính giá đoán cùng sai số của một nhà, số minh hoạ. Một trọng số cần một trăm nghìn phép tính, hai trọng số cần mười triệu. Ba trọng số cần một tỉ, còn mười trọng số cần một trăm nghìn tỉ tỉ phép tính.
  - clear: true
    show: '<p>Máy làm <b>1 tỉ</b> phép tính mỗi giây (số minh hoạ):</p>

      <table class="t"><tr><th>số trọng số</th><th>thời gian thử mò</th></tr>

      <tr><td>1</td><td>0,0001 giây</td></tr>

      <tr><td>2</td><td>0,01 giây</td></tr>

      <tr><td>3</td><td>1 giây</td></tr>

      <tr><td>10</td><td>$10^{14}$ giây ≈ <b>3 triệu năm</b></td></tr></table>

      <div class="box key">Mô hình thật có hàng triệu trọng số → phải biết <b>hướng đi</b> thay vì mò.</div>

      '
    forward_ref: true
    focus:
    - 1
    - - '2.2'
      - '2.4'
    - '2.5'
    - 3
    say: Giả sử máy làm một tỉ phép tính mỗi giây, số minh hoạ. Một trọng số mất một phần mười nghìn giây, ba trọng số mất đúng một giây. Nhưng mười trọng số mất khoảng ba triệu năm, nên cách mò gãy. Mô hình thật có hàng triệu trọng số, nên cần biết ngay hướng tăng hay giảm, và đó là việc của đạo hàm, công cụ đo độ dốc, từ bài sáu.
  - show: <p><b>Chạy thử Python — dự đoán tuyến tính và bình phương sai số:</b></p><div class="code"><div>err = [(w*2 - 5)**2 for w in (2, 3, 4)]</div><div>print(err, min(err))</div></div>
    say: Đoạn Python thử ba giá trị trọng số và chọn sai số bình phương nhỏ nhất.
    clear: true
    focus: null
- id: in_ai_map
  kind: mindset
  title: Mỗi phần toán của khoá học phục vụ bước nào?
  steps:
  - show: '<table class="t"><tr><th>Bước</th><th>Hôm nay làm bằng</th><th>Khoá học dạy cách làm tổng quát</th></tr>

      <tr><td>① Biểu diễn</td><td>danh sách 6, 2, 4</td><td>Bài 1–5: danh sách số (vector), bảng số (ma trận), hệ phương trình; bài 16: nén dữ liệu (giữ ít số hơn mà vẫn đủ ý)</td></tr>

      <tr><td>④ Tự sửa</td><td>thử $w$ = 3; 3,5; 4</td><td>Bài 6–11: đo độ dốc để biết nên tăng hay giảm, và tăng bao nhiêu</td></tr></table>

      '
    forward_ref: true
    say: Bài 1 đến bài 5 dạy làm việc với danh sách số, bảng số và hệ phương trình, đều phục vụ bước biểu diễn. Bài 16 dạy nén dữ liệu, tức giữ ít số hơn mà vẫn đủ ý. Bài 6 đến bài 11 dạy cách đo độ dốc của sai số, để biết nên tăng hay giảm w, và tăng bao nhiêu, thay vì thử mò như hôm nay.
  - show: '<table class="t"><tr><th>Bước</th><th>Khoá học dạy</th></tr>

      <tr><td>② Dự đoán</td><td>Bài 12–15 và 17: hàm mũ (đại lượng tăng rất nhanh), lôgarit (phép ngược của hàm mũ), xác suất (khả năng xảy ra, từ 0 đến 1), để đoán kèm mức độ chắc chắn (“80% là ảnh mèo”)</td></tr>

      <tr><td>③ Đo sai số</td><td>Bài 18–21: các mô hình đầu tiên, cách đo sai số và cách chấm điểm một mô hình; bài 44 (học ngay sau bài 21): điểm số dao động bao nhiêu, khi nào mô hình tốt hơn thật</td></tr>

      <tr><td>Cả 4 bước</td><td>Bài 22–32: mạng nơ-ron (nhiều phép tính nối tiếp, mỗi phép có trọng số chỉnh được), các mô hình khác, công cụ toán đi kèm, cách vẽ dữ liệu nhiều chiều; bài 33: tổng ôn; bài 34–43: mở rộng tuỳ chọn; bài 45: tình huống chuyên gia — hành trình của Adam, một cách tự sửa trọng số phổ biến; bài 46: nghịch đảo ma trận (học ngay sau bài 2)</td></tr></table>

      '
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    forward_ref: true
    say: Bài 12 đến bài 15, và bài 17, học hàm mũ, tức đại lượng tăng rất nhanh, lôgarit là phép ngược của nó, và xác suất. Chúng giúp đoán kèm mức độ chắc chắn, ví dụ 80 phần trăm là ảnh con mèo. Bài 18 đến bài 21 học các mô hình đầu tiên và cách chấm điểm một mô hình, còn bài 44 nên học ngay sau bài 21. Bài 22 đến bài 32 là mạng nơ-ron, tức nhiều phép tính nối tiếp mà mỗi phép có trọng số chỉnh được, cùng các mô hình khác. Bài 45 là tình huống chuyên gia về Adam, một cách tự sửa trọng số phổ biến, và bài 46 bổ sung nghịch đảo ma trận, nên học ngay sau bài 2.
    clear: true
  - clear: true
    show: '<div class="box key">Gặp ký hiệu lạ ở bài nào, hãy hỏi: <b>“nó đang phục vụ bước nào trong 4 bước?”</b></div>

      '
    say: Mỗi khi gặp một ký hiệu lạ, hãy tự hỏi nó đang phục vụ bước nào trong bốn bước. Khi học một phần toán mới, hãy quay lại tự hỏi câu này.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - 3 + (-3) == 0
  - '(lambda w: sp.minimum((w*6 - 20)**2 + (w*5 - 17)**2, w) > 0)(sp.Symbol(''w'', real=True))'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ rằng học tốt là làm sai số bằng 0 <b class="red">(sai)</b>

      <br><span class="note">Với nhiều dữ liệu, thường không thể. Nếu sai số trên dữ liệu đã học bằng 0, đó thường là <b>dấu hiệu nghi</b> mô hình học thuộc lòng, đoán nhà mới sẽ kém.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ rằng học tốt là làm sai số bằng 0. Với nhiều dữ liệu thì thường không thể. Nếu sai số trên chính các nhà đã học bằng 0, đó thường là dấu hiệu nghi mô hình học thuộc lòng, gặp nhà mới sẽ đoán kém.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Cộng thẳng sai số mà không bình phương <b class="red">(sai)</b>

      <br><span class="note">Dư 3 và thiếu 3 triệt tiêu thành 0. Bình phương trước rồi mới cộng.</span></div>

      $$3 + (-3) = 0 \qquad \text{nhưng} \qquad 3^2 + (-3)^2 = 18$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Lỗi thứ hai, cộng thẳng các sai số mà không bình phương. Đoán dư 3 và đoán thiếu 3 sẽ triệt tiêu nhau thành 0, che mất lỗi. Phải bình phương trước rồi mới cộng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nhầm $\hat{y}$ với $y$ <b class="red">(sai)</b>

      <br><span class="note">$y$ là giá <b>thật</b> (có sẵn trong dữ liệu), $\hat{y}$ là giá <b>đoán</b> (mô hình tính ra). Khoá này viết sai số là $\hat{y} - y$ (có sách viết ngược lại; bình phương lên thì như nhau).</span></div>

      '
    say: Lỗi thứ ba, nhầm y mũ với y. Chữ y là giá thật, còn y mũ là giá đoán do mô hình tính ra. Khoá này viết sai số là giá đoán trừ giá thật. Có sách viết ngược lại, nhưng bình phương lên thì như nhau.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 3*4 + 2*3 - 1*1 == 17 and (17 - 15)**2 == 4
  - Rational(5, 2)*4 + 2*3 - 1*1 == 15 and (15 - 15)**2 == 0
  steps:
  - show: '<p>Nhà C: 40 m², 3 phòng ngủ, cách trung tâm 1 km → <b>4, 3, 1</b>; giá thật $y = 15$.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Với $w = 3$, tính $\hat{y}$ và sai số bình phương.</td></tr>

      <tr><td>2</td><td>Theo quy tắc tự sửa, nên tăng hay giảm $w$? Thử $w = 2{,}5$.</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn với nhà C, có diện tích 40 mét vuông, 3 phòng ngủ, cách trung tâm 1 cây số, giá thật 15 trăm triệu. Câu một, với w bằng 3, tính giá đoán và sai số bình phương. Câu hai, nên tăng hay giảm w, rồi thử w bằng 2,5. Hãy dừng video và làm ra giấy.
    pause: 60
  - show: '<p>① $\ \hat{y} = 3 \cdot 4 + 2 \cdot 3 - 1 \cdot 1 = 12 + 6 - 1 = 17$; &nbsp; $(17 - 15)^2 = \hl{4}$</p>

