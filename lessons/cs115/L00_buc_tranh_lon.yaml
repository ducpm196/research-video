3,2</text><text x="500" y="405" text-anchor="middle">3,3</text><text x="850" y="405" text-anchor="middle">3,4</text><text x="1200" y="405" text-anchor="middle">3,5</text><text x="480" y="345" text-anchor="end">w = 3,3: tổng 0,29</text><text x="1222" y="180">w = 3,5: tổng 1,25</text><text x="880" y="390">w = 3,4: tổng 0,16</text><text x="712" y="250" text-anchor="middle" fill="#15803d" font-weight="bold">đáy ≈ 0,066 tại w ≈ 3,36</text><text x="170" y="345" fill="#b91c1c">sai số = 0</text></g></svg></div>
