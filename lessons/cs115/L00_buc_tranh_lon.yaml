id: L00
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 0 — Bức tranh lớn: AI học như thế nào"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L105-L119 (Lời nói đầu: sơ đồ tư duy 4 bước)"
assumes: []
# Bài mở đầu, đứng TRƯỚC mọi bài khác: chỉ dùng số học phổ thông (cộng, trừ, nhân, bình phương, số thập phân).
# Không dùng vector in đậm, chỉ số dưới, hàm số f(x): các ký hiệu đó được dạy từ bài 1 và bài 6.
# Quy ước ký hiệu: giá thật y, giá dự đoán ŷ (\hat{y}), trọng số w (chữ thường, không in đậm), nhân hai số: ·.
# Sửa lỗi nguồn A7 (tex dòng 116 viết “sai số giảm dần về 0”): mục tiêu là sai số NHỎ NHẤT; ví dụ hai ngôi nhà cho
#   thấy không có w nào làm sai số bằng 0 (sai số nhỏ nhất 4/61 > 0, kiểm bằng sympy ở scene two_houses).
# Mọi lần nhắc bài sau (người học chưa học) chỉ ở hook, in_ai_map, recap và giải thích bằng lời thường (luật 17).
objectives:
  - "Kể được 4 bước của một mô hình AI tự học: biểu diễn, dự đoán, đo sai số, tự sửa"
  - "Biến một ngôi nhà thành danh sách số, và nói được vì sao thứ tự các số quan trọng"
  - "Tự tính giá dự đoán ŷ từ trọng số w, và sai số bình phương so với giá thật y"
  - "Giải thích vì sao bình phương sai số, và vì sao mục tiêu là sai số nhỏ nhất chứ không phải bằng 0"
  - "Chỉnh thử trọng số theo quy tắc: sai số giảm thì đi tiếp, tăng thì quay lại"
asr_reviewed:
  - {sentence: "Quy tắc tự sửa chính là lần theo sườn bát để đi xuống đáy.", reason: "ASR chép “Quy tắc tự sự chính là lần theo sường bác để đi xuống đáy.” (0.786): lệch âm/thanh thuần Việt: sửa/sự, sườn bát/sường bác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy tính tự học đoán giá nhà như thế nào?"
    steps:
      - show: |
          <p class="big">Một ứng dụng nhìn thông tin ngôi nhà rồi <b class="blue">đoán giá</b>.</p>
          <p>Không ai viết sẵn công thức cho nó. Nó <b>tự học</b> từ các ngôi nhà đã bán.</p>
        focus: [0, 1, 2]
        say: "Chào bạn, đây là bài mở đầu của khoá học. Hãy tưởng tượng một ứng dụng nhìn thông tin một ngôi nhà rồi đoán giá. Không ai viết sẵn công thức cho nó, nó tự học từ những ngôi nhà đã bán."
      - show: |
          <div class="chain"><span class="n">① Biểu diễn: đổi thành số</span><span class="a">→</span>
          <span class="n">② Dự đoán</span><span class="a">→</span>
          <span class="n">③ Đo sai số</span><span class="a">→</span>
          <span class="n">④ Tự sửa</span></div>
          <p class="note">Hôm nay đi hết 4 bước bằng các phép tính phổ thông. Chưa cần công thức khó.</p>
        focus: [1, "1.1", "1.3", "1.5", "1.7", 2]
        say: "Mọi mô hình tự học đều đi qua bốn bước. Một, đổi dữ liệu thành số. Hai, dùng các con số đó để dự đoán. Ba, đo xem dự đoán sai bao nhiêu. Bốn, tự sửa để lần sau sai ít hơn. Hôm nay ta đi hết bốn bước, chỉ bằng phép tính phổ thông."
      - show: |
          <p>Sau bài này bạn sẽ biết <b>mỗi phần toán của khoá học dùng vào bước nào</b>.</p>
        say: "Mục tiêu của bài này là khi học bất kỳ phần toán nào về sau, bạn đều biết nó phục vụ bước nào trong bốn bước. Nhờ vậy, ký hiệu dù lạ đến đâu cũng có chỗ để bám vào."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Các phép tính sẽ dùng hôm nay"
    checks:
      - "Rational(7, 2) * 6 == 21"
      - "18 - 20 == -2 and (-2)**2 == 4"
      - "3**2 == 9 and (-3)**2 == 9"
    steps:
      - show: |
          <div class="box key">Hai cách viết phép nhân: &nbsp; $2 \times 3 \;=\; 2 \cdot 3 \;=\; 6$
          <br><span class="note">Dấu chấm nằm <b>giữa dòng</b> “·” cũng là dấu nhân. Từ đây dùng “·” để khỏi nhầm dấu × với chữ x.</span></div>
        introduces: [cdot]
        notation_note: true
        say: "Trước hết, một ký hiệu nhỏ. Dấu chấm nằm giữa dòng cũng là dấu nhân, hai chấm ba vẫn bằng sáu. Từ đây mình dùng dấu chấm này, vì dấu nhân chéo trông rất giống chữ x."
      - show: |
          <table class="t"><tr><th>Phép tính</th><th>Ví dụ</th><th>Đọc là</th></tr>
          <tr><td>Nhân số thập phân</td><td>$3{,}5 \cdot 6 = 21$</td><td>ba phẩy năm nhân sáu bằng hai mốt</td></tr>
          <tr><td>Trừ ra số âm</td><td>$18 - 20 = -2$</td><td>mười tám trừ hai mươi bằng âm hai</td></tr>
          <tr><td>Bình phương</td><td>$3^2 = 9,\ \ (-3)^2 = 9$</td><td>ba bình phương bằng chín</td></tr></table>
        say: "Ngoài ra chỉ cần ba phép tính. Nhân số thập phân, ví dụ 3,5 nhân 6 bằng 21. Phép trừ có thể ra số âm, 18 trừ 20 bằng âm 2. Và bình phương, tức là nhân một số với chính nó, 3 bình phương bằng 9."
      - show: |
          <div class="box key">Bình phương của số âm là số <b>dương</b>: $(-3)^2 = (-3) \cdot (-3) = 9$.</div>
        say: "Để ý một điều sẽ dùng nhiều lần hôm nay. Bình phương của số âm vẫn ra số dương, vì âm nhân âm ra dương, nên âm 3 bình phương cũng bằng 9."

  # ───────────────────────── 3. BƯỚC 1: BIỂU DIỄN ─────────────────────────
  - id: represent
    kind: concept
    title: "Bước ①: đổi mọi thứ thành danh sách số"
    steps:
      - show: |
          <div class="box key">Ngôi nhà A = (diện tích 60 m², 2 phòng ngủ, cách trung tâm 4 km)
          <br>→ ghi gọn: <b class="big">6, 2, 4</b> &nbsp;<span class="note">(diện tích tính theo chục m²)</span></div>
        say: "Bước một là biểu diễn. Máy tính không nhìn thấy ngôi nhà, nó chỉ làm việc với con số. Ngôi nhà A có diện tích 60 mét vuông, 2 phòng ngủ, cách trung tâm 4 cây số. Tính diện tích theo chục mét vuông, ta ghi gọn thành 6, 2, 4."
      - show: |
          <table class="t"><tr><th>dữ liệu</th><th>đổi thành số</th></tr>
          <tr><td><b>Ảnh</b> đen trắng</td><td>mỗi điểm ảnh là một số độ sáng, từ 0 (đen) đến 255 (trắng)</td></tr>
          <tr><td><b>Câu văn</b></td><td>đếm mỗi từ xuất hiện bao nhiêu lần, được một danh sách số</td></tr></table>
        say: "Mọi loại dữ liệu đều đổi được thành số. Một bức ảnh đen trắng là danh sách độ sáng của từng điểm ảnh, từ 0 là đen đến 255 là trắng. Một câu văn có thể đổi thành danh sách đếm xem mỗi từ xuất hiện bao nhiêu lần."
      - show: |
          <div class="box warn">Thứ tự quan trọng: 6, 2, 4 và 2, 6, 4 là <b>hai ngôi nhà khác nhau</b>.</div>
          <p class="note">Danh sách số có thứ tự như vậy gọi là <b>vector</b>.</p>
        focus: [1, 1, 2]
        say: "Lưu ý, thứ tự trong danh sách có ý nghĩa. Vị trí đầu luôn là diện tích, vị trí thứ hai luôn là số phòng ngủ, nên 6, 2, 4 và 2, 6, 4 là hai ngôi nhà khác nhau. Danh sách số có thứ tự như vậy có một cái tên, gọi là vector."

  # ───────────────────────── 4. KÝ HIỆU ─────────────────────────
  - id: sym_hat
    kind: symbol
    title: "Giải mã ký hiệu: y, ŷ và trọng số w"
    steps:
      - show: |
          <div class="row"><div class="col">$$y = 20$$<p class="note">giá <b>thật</b> của nhà A: 20 trăm triệu đồng (2 tỉ)</p></div>
          <div class="col">$$\hat{y}$$<p class="note">giá <b>dự đoán</b> do mô hình tính ra</p></div></div>
        introduces: [hat]
        say: "Giờ đến ký hiệu đầu tiên của khoá học. Chữ y là giá thật, nhà A đã bán với giá 20 trăm triệu đồng, tức là 2 tỉ. Chữ y có thêm dấu mũ nhỏ phía trên đọc là y mũ, là giá do mô hình dự đoán."
      - show: |
          <div class="box warn">$\hat{y}$ (y có dấu mũ) <b>khác</b> $y^2$ (y bình phương). Dấu mũ chỉ là một cái nhãn: “đây là giá đoán”.</div>
        say: "Đừng nhầm, y mũ ở đây là y có một dấu mũ nhỏ đội trên đầu, không phải lũy thừa. Dấu mũ chỉ là cái nhãn dán lên, để nhắc rằng đây là giá đoán, chưa chắc đã đúng."
      - show: |
          <div class="box key">$w$ = <b>trọng số</b>: con số mô hình <b>được phép tự chỉnh</b>.
          <br><span class="note">“Học” nghĩa là: tìm giá trị $w$ sao cho $\hat{y}$ gần $y$.</span></div>
        say: "Ký hiệu thứ ba là chữ w thường, gọi là trọng số. Đây là con số mà mô hình được phép tự chỉnh. Học, theo nghĩa của máy, chính là đi tìm giá trị w sao cho giá đoán gần với giá thật."

  # ───────────────────────── 5. BƯỚC 2: DỰ ĐOÁN ─────────────────────────
  - id: predict
    kind: example
    title: "Bước ②: dự đoán giá nhà A"
    checks:
      - "3*6 + 2*2 - 1*4 == 18"
      - "18 + 4 - 4 == 18"
    steps:
      - show: |
          $$\hat{y} = \hlb{w} \cdot \text{diện tích} \;+\; 2 \cdot \text{số phòng} \;-\; 1 \cdot \text{khoảng cách}$$
          <ul><li>mỗi chục m² cộng thêm $w$ trăm triệu</li><li>mỗi phòng ngủ cộng thêm 2 trăm triệu</li>
          <li>mỗi km xa trung tâm trừ đi 1 trăm triệu</li></ul>
        focus: [1, 1, 2]
        say: "Bước hai là dự đoán. Mô hình đơn giản nhất nhân mỗi con số với một trọng số rồi cộng lại. Mỗi chục mét vuông cộng thêm w trăm triệu, mỗi phòng ngủ cộng 2 trăm triệu, mỗi cây số xa trung tâm trừ đi 1 trăm triệu."
      - show: |
          <p class="note">Để dễ theo dõi, hôm nay giữ cố định hai số 2 và 1, chỉ cho mô hình chỉnh <b>một</b> trọng số $w$.</p>
        say: "Mô hình thật được chỉnh mọi trọng số. Nhưng để dễ theo dõi, hôm nay ta giữ cố định hai số 2 và 1, chỉ cho mô hình chỉnh một trọng số là w, đứng trước diện tích."
      - show: |
          <p>Lần đoán đầu, mô hình thử $w = 3$. Thay số nhà A (6, 2, 4):</p>
          $$\hat{y} = 3 \cdot 6 + 2 \cdot 2 - 1 \cdot 4 = 18 + 4 - 4 = \hlb{18}$$
        focus: [1, 2, 2]
        say: "Lần đầu, mô hình thử w bằng 3. Thay các số của nhà A vào, 3 nhân 6 bằng 18, cộng 2 nhân 2 bằng 4, rồi trừ 1 nhân 4 bằng 4. Vậy giá đoán là 18 trăm triệu."

  # ───────────────────────── 6. BƯỚC 3: ĐO SAI SỐ ─────────────────────────
  - id: error
    kind: concept
    title: "Bước ③: đo xem đoán sai bao nhiêu"
    checks:
      - "18 - 20 == -2"
      - "3 + (-3) == 0 and 3**2 + (-3)**2 == 18"
      - "(18 - 20)**2 == 4"
    steps:
      - show: |
          $$\text{sai số} = \hat{y} - y = 18 - 20 = \hl{-2}$$
          <p class="note">Dấu âm nghĩa là đoán <b>thấp hơn</b> giá thật 2 trăm triệu.</p>
        focus: [0, 1, 2]
        say: "Bước ba là đo sai số. Lấy giá đoán trừ giá thật, 18 trừ 20 bằng âm 2. Dấu âm cho biết mô hình đoán thấp hơn giá thật 2 trăm triệu."
      - show: |
          <div class="box warn">Hai nhà, một nhà đoán dư 3, một nhà đoán thiếu 3: &nbsp; $3 + (-3) = 0$ → trông như “không sai”!
          <br>Bình phương trước rồi mới cộng: $\ 3^2 + (-3)^2 = 9 + 9 = 18$ → thấy rõ là sai.</div>
        say: "Vì sao không cộng thẳng sai số của nhiều nhà? Giả sử một nhà đoán dư 3, nhà kia đoán thiếu 3, cộng lại bằng 0, trông như không sai gì cả. Bình phương trước thì cả hai thành 9, cộng lại 18, thấy rõ là đang sai."
      - show: |
          $$\text{sai số bình phương} = (\hat{y} - y)^2 = (-2)^2 = \hl{4}$$
          <p class="note">Tên tiếng Anh: <b>loss</b> (hàm mất mát). Số càng nhỏ, đoán càng tốt.</p>
        focus: [1, 1, 2, 2]
        say: "Vì vậy ta đo bằng sai số bình phương. Với nhà A, âm 2 bình phương bằng 4. Con số đo độ sai này có tên gọi là hàm mất mát. Số càng nhỏ thì đoán càng tốt."

  # ───────────────────────── 7. BƯỚC 4: TỰ SỬA ─────────────────────────
  - id: learn
    kind: example
    title: "Bước ④: tự sửa trọng số w"
    checks:
      - "Rational(7, 2)*6 + 2*2 - 1*4 == 21 and (21 - 20)**2 == 1"
      - "4*6 + 2*2 - 1*4 == 24 and (24 - 20)**2 == 16"
      - "1 < 4 and 16 > 4"
    steps:
      - show: |
          <p>Đoán thấp → thử <b>tăng</b> $w$ một chút, từ 3 lên 3,5:</p>
          $$\hat{y} = 3{,}5 \cdot 6 + 4 - 4 = 21, \qquad (21 - 20)^2 = \hlg{1}$$
        focus: [0, 1, 2, 2]
        say: "Bước bốn là tự sửa. Mô hình đoán thấp, nên hợp lý là thử tăng w một chút, từ 3 lên 3,5. Khi đó giá đoán bằng 3,5 nhân 6 là 21, cộng 4 trừ 4, vẫn là 21. Sai số bình phương bằng 1, nhỏ hơn 4, vậy là đã tốt hơn."
      - show: |
          <p>Tăng tiếp lên $w = 4$:</p>
          $$\hat{y} = 4 \cdot 6 + 4 - 4 = 24, \qquad (24 - 20)^2 = \hl{16}$$
          <p class="note">Sai số tăng vọt → đã đi <b>quá đà</b>.</p>
        focus: [1, 2, 3]
        say: "Thử tăng tiếp lên 4. Giá đoán thành 24, sai số bình phương bằng 16, tăng vọt. Như vậy ta đã đi quá đà, vượt qua chỗ tốt nhất."
      - clear: true
        show: |
          <p>Nhà A, giá thật $y = 20$:</p>
          <table class="t"><tr><th>$w$</th><th>$\hat{y}$</th><th>sai số bình phương</th></tr>
          <tr><td>3</td><td>18</td><td>4</td></tr><tr><td>3,5</td><td>21</td><td>$\hlg{1}$</td></tr><tr><td>4</td><td>24</td><td>16</td></tr></table>
          <div class="box key">Quy tắc tự sửa: nhích $w$ một chút. Sai số <b>giảm</b> → đi tiếp hướng đó. Sai số <b>tăng</b> → quay lại, bước nhỏ hơn.</div>
        focus: [2, 3, 3, 3, 0]
        say: "Đặt ba lần thử cạnh nhau, ta rút ra quy tắc tự sửa. Nhích w một chút rồi xem sai số. Nếu sai số giảm thì đi tiếp theo hướng đó. Nếu sai số tăng thì quay lại và bước nhỏ hơn. Máy tính làm đi làm lại việc này rất nhiều lần."

  # ───────────────────────── 8. HAI NGÔI NHÀ ─────────────────────────
  - id: two_houses
    kind: example
    title: "Nhiều ngôi nhà: sai số nhỏ nhất, không phải bằng 0"
    checks:
      - "3*6 + 4 - 4 == 18 and 3*5 + 2*1 - 1*2 == 15"
      - "(lambda w: (w*6 + 4 - 4 - 20)**2 + (w*5 + 2 - 2 - 17)**2)(3) == 8"
      - "(lambda w: (w*6 + 4 - 4 - 20)**2 + (w*5 + 2 - 2 - 17)**2)(Rational(33, 10)) == Rational(29, 100)"
      - "(lambda w: (w*6 + 4 - 4 - 20)**2 + (w*5 + 2 - 2 - 17)**2)(Rational(34, 10)) == Rational(16, 100)"
      - "(lambda w: (w*6 + 4 - 4 - 20)**2 + (w*5 + 2 - 2 - 17)**2)(Rational(35, 10)) == Rational(125, 100)"
      - "sp.solve(sp.Symbol('w')*6 - 20) == [Rational(10, 3)] and sp.solve(sp.Symbol('w')*5 - 17) == [Rational(17, 5)]"
      - "(lambda w: sp.minimum((w*6 - 20)**2 + (w*5 - 17)**2, w) == Rational(4, 61))(sp.Symbol('w', real=True))"
      # từng ô của bảng: (nhà A, nhà B) tại w = 3,3; 3,4; 3,5
      - "[((w*6 - 20)**2, (w*5 - 17)**2) for w in (Rational(33, 10), Rational(34, 10), Rational(35, 10))] == [(Rational(4, 100), Rational(25, 100)), (Rational(16, 100), 0), (1, Rational(25, 100))]"
      # làm tròn trên màn hình: 10/3 ≈ 3,33; w tốt nhất 205/61 ≈ 3,36; sai số nhỏ nhất 4/61 ≈ 0,066
      - "round(float(Rational(10, 3)), 2) == 3.33 and round(float(Rational(205, 61)), 2) == 3.36 and round(float(Rational(4, 61)), 3) == 0.066"
      - "(lambda w: sp.solve(sp.diff((w*6 - 20)**2 + (w*5 - 17)**2, w), w) == [Rational(205, 61)])(sp.Symbol('w'))"
    steps:
      - show: |
          <p>Thêm nhà B: 50 m², 1 phòng ngủ, cách trung tâm 2 km → <b>5, 1, 2</b>; giá thật $y = 17$.</p>
          <p>Với $w = 3$: &nbsp; $\hat{y} = 3 \cdot 5 + 2 \cdot 1 - 1 \cdot 2 = 15$</p>
        focus: [0, 1, 2]
        say: "Thực tế, mô hình học từ rất nhiều ngôi nhà cùng lúc. Thêm nhà B, rộng 50 mét vuông, 1 phòng ngủ, cách trung tâm 2 cây số, giá thật 17 trăm triệu. Với w bằng 3, giá đoán của nhà B là 15 cộng 2 trừ 2, bằng 15."
      - show: |
          <p><b>Sai số tổng</b> = sai số bình phương nhà A + sai số bình phương nhà B</p>
          <table class="t"><tr><th>$w$</th><th>nhà A</th><th>nhà B</th><th>sai số tổng</th></tr>
          <tr><td>3</td><td>$(18 - 20)^2 = 4$</td><td>$(15 - 17)^2 = 4$</td><td>8</td></tr>
          <tr><td>3,3</td><td>0,04</td><td>0,25</td><td>0,29</td></tr>
          <tr><td>3,4</td><td>0,16</td><td>0</td><td>$\hlg{0{,}16}$</td></tr>
          <tr><td>3,5</td><td>1</td><td>0,25</td><td>1,25</td></tr></table>
        focus: [1, "2.2", "2.4"]
        say: "Bây giờ sai số tổng là sai số bình phương của nhà A cộng của nhà B. Với w bằng 3, mỗi nhà sai 2, bình phương được 4, tổng là 8. Thử thêm vài giá trị, w bằng 3,4 cho tổng nhỏ nhất trong bảng, 0,16."
      - clear: true
        show: |
          <ul><li>Nhà A đoán đúng khi $6 \cdot w = 20$, tức $w \approx 3{,}33$</li>
          <li>Nhà B đoán đúng khi $5 \cdot w = 17$, tức $w = 3{,}4$</li></ul>
          <div class="box key">Không có $w$ nào đúng cả hai nhà cùng lúc → sai số tổng <b>không thể bằng 0</b>. Nhỏ nhất là khoảng $\hlg{0{,}066}$, tại $w \approx 3{,}36$.</div>
        focus: [0, "1.1", "1.2", 2]
        say: "Vì sao không ra 0? Nhà A chỉ đoán đúng khi 6 nhân w bằng 20, tức w khoảng 3,33. Nhà B lại cần 5 nhân w bằng 17, tức w bằng 3,4. Không có w nào chiều được cả hai, nên sai số tổng không thể bằng 0."
      - show: |
          <div class="box key"><b>Mục tiêu của việc học: làm sai số tổng NHỎ NHẤT</b>, không phải làm nó bằng 0.
          <br><span class="note">Hay gặp cách nói “sai số giảm dần về 0”: chưa chính xác — ở đây sai số nhỏ nhất vẫn còn ≈ 0,066.</span></div>
        say: "Sai số tổng nhỏ nhất là khoảng 0,066, tại w khoảng 3,36. Đây là điểm quan trọng nhất hôm nay. Mục tiêu của việc học là làm sai số tổng nhỏ nhất có thể, không phải làm nó bằng 0. Bạn có thể nghe cách nói sai số giảm dần về 0. Nói vậy chưa chính xác, vì ở đây sai số tổng nhỏ nhất vẫn còn khoảng 0,066."

