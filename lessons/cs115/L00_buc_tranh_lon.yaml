  # ───────────────────────── 8c. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: thay thẳng w = 3,36 vào hai nhà"
    checks:
      - "Rational(336, 100)*6 == Rational(2016, 100) and (Rational(2016, 100) - 20)**2 == Rational(256, 10000)"
      - "Rational(336, 100)*5 == Rational(168, 10) and (Rational(168, 10) - 17)**2 == Rational(4, 100)"
      - "Rational(256, 10000) + Rational(4, 100) == Rational(656, 10000) and round(0.0656, 3) == 0.066 and round(float(Rational(4, 61)), 3) == 0.066"
      - "Rational(656, 10000) < Rational(16, 100) and Rational(656, 10000) < Rational(29, 100) and Rational(656, 10000) > 0"
    steps:
      - show: |
          <p><b>Bước 1.</b> Nhà A (6, 2, 4), giá thật 20, với $w = 3{,}36$:</p>
          $$\hat{y} = 3{,}36 \cdot 6 + 4 - 4 = 20{,}16, \qquad (20{,}16 - 20)^2 = 0{,}16^2 = 0{,}0256$$
        focus: [1, 2]
        say: "Ta kiểm con số 0,066 bằng một đường khác, thay thẳng w bằng 3,36 vào từng nhà rồi tự cộng. Bước một, nhà A có giá đoán 3,36 nhân 6, bằng 20,16, lệch 0,16 so với giá thật, bình phương lên được 0,0256."
      - show: |
          <p><b>Bước 2.</b> Nhà B (5, 1, 2), giá thật 17:</p>
          $$\hat{y} = 3{,}36 \cdot 5 + 2 - 2 = 16{,}8, \qquad (16{,}8 - 17)^2 = (-0{,}2)^2 = 0{,}04$$
        focus: [1, 2]
        say: "Bước hai, thay w vào nhà B, giá đoán là 3,36 nhân 5, bằng 16,8. Vì nhà B bị đoán thấp hơn giá thật 0,2, bình phương lên được 0,04."
      - show: |
          <p><b>Bước 3.</b> Cộng hai nhà:</p>
          $$0{,}0256 + 0{,}04 = 0{,}0656 \approx \hlg{0{,}066} \ \checkmark$$
        focus: [1, 2]
        say: "Bước ba, theo định nghĩa sai số tổng, ta cộng hai sai số bình phương, được 0,0656, làm tròn là 0,066. Con số này khớp với đáy bát mà ta đọc trên hình."
      - show: |
          <table class="t"><tr><th>$w$</th><th>sai số tổng</th><th>so với đáy 0,066</th></tr>
          <tr><td>3,3</td><td>0,29</td><td>lớn hơn</td></tr>
          <tr><td>3,36</td><td>$\hlg{0{,}066}$</td><td>chính là đáy</td></tr>
          <tr><td>3,4</td><td>0,16</td><td>lớn hơn</td></tr></table>
        focus: [0, ["1.2", "1.4"], 0]
        say: "Bước bốn, đặt kết quả cạnh hai dòng của bảng cũ. Ở w bằng 3,3 sai số tổng là 0,29, ở w bằng 3,4 là 0,16, cả hai đều lớn hơn 0,066. Vì cả hai bên đều cao hơn, đáy nằm giữa hai giá trị đó, và đáy lớn hơn 0, đúng như hình cái bát cho thấy."

  # ───────────────────────── 9. BẢN ĐỒ KHOÁ HỌC ─────────────────────────
  - id: in_ai_map
    kind: mindset
    title: "Mỗi phần toán của khoá học phục vụ bước nào?"
    steps:
      - show: |
          <table class="t"><tr><th>Bước</th><th>Hôm nay làm bằng</th><th>Khoá học dạy cách làm tổng quát</th></tr>
          <tr><td>① Biểu diễn</td><td>danh sách 6, 2, 4</td><td>Bài 1–5: danh sách số (vector), bảng số (ma trận), hệ phương trình; bài 16: nén dữ liệu</td></tr>
          <tr><td>④ Tự sửa</td><td>thử $w$ = 3; 3,5; 4</td><td>Bài 6–11: đo độ dốc để biết nên tăng hay giảm, và tăng bao nhiêu</td></tr></table>
        forward_ref: true
        say: "Giờ ta đặt khoá học lên bản đồ bốn bước. Bài 1 đến bài 5 dạy cách làm việc với danh sách số, bảng số và hệ phương trình, còn bài 16 dạy cách nén dữ liệu, đều phục vụ bước biểu diễn. Bài 6 đến bài 11 dạy cách đo độ dốc của sai số, để biết nên tăng hay giảm w, và tăng bao nhiêu, thay vì thử mò như hôm nay."
      - show: |
          <table class="t"><tr><th>Bước</th><th>Khoá học dạy</th></tr>
          <tr><td>② Dự đoán</td><td>Bài 12–15 và 17: hàm mũ, lôgarit, xác suất, để đoán kèm mức độ chắc chắn (“80% là ảnh mèo”)</td></tr>
          <tr><td>③ Đo sai số</td><td>Bài 18–21: các mô hình đầu tiên, cách đo sai số và cách chấm điểm một mô hình; bài 44 (học ngay sau bài 21): điểm số dao động bao nhiêu, khi nào mô hình tốt hơn thật</td></tr>
          <tr><td>Cả 4 bước</td><td>Bài 22–32: mạng nơ-ron, các mô hình khác, công cụ toán đi kèm, cách vẽ dữ liệu nhiều chiều; bài 33: tổng ôn; bài 34–43: mở rộng tuỳ chọn; bài 45: tình huống chuyên gia — hành trình của bộ tối ưu Adam</td></tr></table>
        forward_ref: true
        say: "Bài 12 đến bài 15, và bài 17, học hàm mũ và xác suất, để đoán kèm mức độ chắc chắn, ví dụ 80 phần trăm là ảnh con mèo. Bài 18 đến bài 21 học các mô hình đầu tiên, cách đo sai số, và cách chấm điểm một mô hình. Bài 44 nên học ngay sau bài 21, để biết điểm số dao động bao nhiêu, và khi nào một mô hình tốt hơn thật. Bài 22 đến bài 32 là mạng nơ-ron, các mô hình khác, và cách vẽ dữ liệu nhiều chiều lên giấy. Bài 33 là tổng ôn, còn bài 34 đến bài 43 là phần mở rộng, học thêm nếu bạn muốn. Cuối cùng, bài 45 là một tình huống chuyên gia, đi lại hành trình của bộ tối ưu Adam theo dòng thời gian."
      - clear: true
        show: |
          <div class="box key">Gặp ký hiệu lạ ở bài nào, hãy hỏi: <b>“nó đang phục vụ bước nào trong 4 bước?”</b></div>
        say: "Mỗi khi gặp một ký hiệu lạ, hãy tự hỏi nó đang phục vụ bước nào trong bốn bước. Bạn không cần nhớ bảng này ngay. Khi học một phần toán mới, hãy quay lại tự hỏi câu này."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "3 + (-3) == 0"
      - "(lambda w: sp.minimum((w*6 - 20)**2 + (w*5 - 17)**2, w) > 0)(sp.Symbol('w', real=True))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ rằng học tốt là làm sai số bằng 0 <b class="red">(sai)</b>
          <br><span class="note">Với nhiều dữ liệu, thường không thể. Nếu sai số trên dữ liệu đã học bằng 0, đó thường là <b>dấu hiệu nghi</b> mô hình học thuộc lòng, đoán nhà mới sẽ kém.</span></div>
        say: "Lỗi thứ nhất, nghĩ rằng học tốt là làm sai số bằng 0. Với nhiều dữ liệu thì thường không thể. Nếu sai số trên chính các nhà đã học bằng 0, đó thường là dấu hiệu nghi mô hình học thuộc lòng, gặp nhà mới sẽ đoán kém."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cộng thẳng sai số mà không bình phương <b class="red">(sai)</b>
          <br><span class="note">Dư 3 và thiếu 3 triệt tiêu thành 0. Bình phương trước rồi mới cộng.</span></div>
          $$3 + (-3) = 0 \qquad \text{nhưng} \qquad 3^2 + (-3)^2 = 18$$
        focus: [1, 2, 2]
        say: "Lỗi thứ hai, cộng thẳng các sai số mà không bình phương. Đoán dư 3 và đoán thiếu 3 sẽ triệt tiêu nhau thành 0, che mất lỗi. Phải bình phương trước rồi mới cộng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đổi thứ tự các số trong danh sách <b class="red">(sai)</b>
          <br><span class="note">6, 2, 4 và 2, 6, 4 là hai ngôi nhà khác nhau: mỗi vị trí có một ý nghĩa cố định.</span></div>
        say: "Lỗi thứ ba, đổi thứ tự các số trong danh sách. Mỗi vị trí có một ý nghĩa cố định, nên 6, 2, 4 và 2, 6, 4 là hai ngôi nhà khác nhau."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhầm $\hat{y}$ với $y$ <b class="red">(sai)</b>
          <br><span class="note">$y$ là giá <b>thật</b> (có sẵn trong dữ liệu), $\hat{y}$ là giá <b>đoán</b> (mô hình tính ra). Sai số luôn là $\hat{y} - y$.</span></div>
        say: "Lỗi thứ tư, nhầm y mũ với y. Chữ y là giá thật, có sẵn trong dữ liệu. Y mũ là giá đoán, do mô hình tính ra. Sai số luôn là giá đoán trừ giá thật."

  # ───────────────────────── 11. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "3*4 + 2*3 - 1*1 == 17 and (17 - 15)**2 == 4"
      - "Rational(5, 2)*4 + 2*3 - 1*1 == 15 and (15 - 15)**2 == 0"
    steps:
      - show: |
          <p>Nhà C: 40 m², 3 phòng ngủ, cách trung tâm 1 km → <b>4, 3, 1</b>; giá thật $y = 15$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Với $w = 3$, tính $\hat{y}$ và sai số bình phương.</td></tr>
          <tr><td>2</td><td>Theo quy tắc tự sửa, nên tăng hay giảm $w$? Thử $w = 2{,}5$.</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn với nhà C, có diện tích 40 mét vuông, 3 phòng ngủ, cách trung tâm 1 cây số, giá thật 15 trăm triệu. Câu một, với w bằng 3, tính giá đoán và sai số bình phương. Câu hai, nên tăng hay giảm w, rồi thử w bằng 2,5. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\ \hat{y} = 3 \cdot 4 + 2 \cdot 3 - 1 \cdot 1 = 12 + 6 - 1 = 17$; &nbsp; $(17 - 15)^2 = \hl{4}$</p>
          <p>② Đoán <b>dư</b> 2 → <b>giảm</b> $w$. &nbsp; $\hat{y} = 2{,}5 \cdot 4 + 6 - 1 = 15$; &nbsp; $(15 - 15)^2 = \hlg{0}$</p>
        focus: [1, 2, ["2.4", "2.5"]]
        say: "Đáp án câu một, giá đoán bằng 12 cộng 6 trừ 1, bằng 17, sai số bình phương bằng 4. Câu hai, mô hình đoán dư 2, nên giảm w. Với w bằng 2,5, giá đoán bằng 10 cộng 6 trừ 1, đúng bằng 15, sai số bằng 0."
      - show: |
          <p class="note">Một nhà thì có thể đoán đúng hoàn toàn. Học cùng lúc nhiều nhà thì thường không: nhớ ví dụ nhà A và nhà B.</p>
        say: "Để ý, với chỉ một nhà thì có thể đoán đúng hoàn toàn. Nhưng khi học cùng lúc nhiều nhà, như nhà A và nhà B ở trên, thì thường không, và mục tiêu là sai số tổng nhỏ nhất."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">① nhà → 6, 2, 4</span><span class="a">→</span>
          <span class="n">② $\hat{y} = w \cdot 6 + 2 \cdot 2 - 1 \cdot 4$</span><span class="a">→</span>
          <span class="n">③ $(\hat{y} - y)^2$</span><span class="a">→</span>
          <span class="n">④ chỉnh $w$ cho sai số nhỏ nhất</span></div>
        say: "Tổng kết chuỗi logic. Một, đổi ngôi nhà thành danh sách số. Hai, nhân với trọng số rồi cộng lại để được giá đoán y mũ. Ba, đo sai số bình phương so với giá thật. Bốn, chỉnh trọng số cho sai số tổng nhỏ nhất, rồi lặp lại."
      - show: |
          <div class="box key"><b>Tư duy:</b> AI không “hiểu” ngôi nhà. Nó chỉ <b>đoán, đo sai, rồi sửa</b>, lặp lại rất nhiều lần. Toàn bộ khoá học là toán để làm 4 bước đó cho tốt.</div>
        say: "Điều cần mang theo, AI không hiểu ngôi nhà theo cách con người hiểu. Nó chỉ đoán, đo xem sai bao nhiêu, rồi sửa, lặp lại rất nhiều lần. Toàn bộ khoá học này là phần toán để làm bốn bước đó cho tốt."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>vector</b> — gọi tên chính xác danh sách số 6, 2, 4; đo hai danh sách giống nhau đến đâu (<b>tích vô hướng</b>) và một danh sách dài bao nhiêu (<b>độ dài</b>).</p>
        forward_ref: true
        say: "Bài tiếp theo là bài 1, học về vector, tức là danh sách số như 6, 2, 4, cách đo hai danh sách giống nhau đến đâu, và một danh sách dài bao nhiêu. Hẹn gặp bạn ở bài 1."
