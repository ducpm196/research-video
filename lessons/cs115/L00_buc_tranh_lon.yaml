  - show: '<div class="box key"><b>Nếu kẹt:</b> giá đoán của một nhà là $w \cdot \text{diện tích} + 2 \cdot \text{phòng} - 1 \cdot \text{khoảng cách}$. Nhà đoán đúng khi giá đoán bằng giá thật, nên $w = (\text{giá thật} - 2 \cdot \text{phòng} + \text{khoảng cách}) / \text{diện tích}$. Không có $w$ chung cho cả hai nhà, nên tổng nhỏ nhất vẫn lớn hơn 0.</div>

