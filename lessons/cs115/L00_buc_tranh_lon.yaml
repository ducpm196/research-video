    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>thu_w.py</code>: với mô hình giá đoán $= w \cdot \text{diện tích} + 2 \cdot \text{phòng} - 1 \cdot \text{khoảng cách}$ và hai nhà mới, thử $w = 2, 3, 4, 5$.</p>

      <table class="t"><tr><th>nhà</th><th>diện tích</th><th>phòng</th><th>khoảng cách</th><th>giá thật</th></tr>

