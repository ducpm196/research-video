- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">trượt bộ lọc: nhân từng ô, cộng</span><span class="a">→</span>

      <span class="n">kích thước $\frac{N - k + 2P}{S} + 1$</span><span class="a">→</span>

      <span class="n">dùng chung bộ lọc: ít tham số</span><span class="a">→</span>

      <span class="n">là phép tuyến tính: ma trận thưa</span><span class="a">→</span>

