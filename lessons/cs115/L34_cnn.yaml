objectives:
- Tính phép tích chập (tương quan chéo) bằng tay trên ảnh nhỏ
- Tính kích thước đầu ra theo kích thước ảnh, bộ lọc, đệm, bước nhảy
- 'Hiểu chia sẻ trọng số: số tham số không phụ thuộc kích thước ảnh'
- Thấy tích chập là phép tuyến tính — nhân với một ma trận thưa
- Biết lớp gộp (pooling) và cấu trúc một mạng tích chập
