  - show: <p><b>Chạy thử Python — tính kích thước bản đồ đặc trưng và số tham số tích chập:</b></p><div class="code"><div>out = (28 - 5 + 2*2)//2 + 1; params = (5*5*3 + 1)*8</div><div>print(out, params)</div></div>
