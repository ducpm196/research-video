id: L27
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 27 — K láng giềng gần nhất (KNN): học lười, khoảng cách L1/L2, chọn K"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L165–L166, L405 (KNN: khoảng cách Euclid/L1, “ngưu tầm ngưu”: bầu chọn theo K láng giềng); AG24#KNN (huấn luyện O(1), dự đoán O(N); L1, L2); AG25#KNN; AUDIT A14"
assumes: [cdot, sub, vec, norm, sum, sqrt, approx, power, geq]
# Quy ước ký hiệu: khoảng cách L2 (Euclid) viết d₂(x, z) = ‖x − z‖ (bài 1); khoảng cách L1 (Manhattan) viết d₁(x, z) = Σ|xⱼ − zⱼ|
#   (KHÔNG viết ‖·‖₁ để khỏi lẫn hai kiểu viết độ dài — luật nhất quán); K hoa = số láng giềng.
# Lời đọc: “L1”, “L2” theo lexicon (L một, L hai); “Euclid” → Ơ-clít (lexicon); “Manhattan” → Man-hát-tần (lexicon); KNN chỉ hiện
#   trên màn hình, lời đọc “K láng giềng gần nhất”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (độ dài vector, khoảng cách = độ dài hiệu), bài 19 (kiểm định chéo, quá khớp,
#   chưa khớp), bài 16 (chuẩn hoá đặc trưng khác đơn vị).
# Sửa nguồn (AUDIT A14): KNN không có hàm sai số, không có bước huấn luyện — chỉ lưu dữ liệu.
objectives:
  - "Tính khoảng cách L1 và L2, thấy chúng có thể chọn láng giềng khác nhau"
  - "Chạy thuật toán K láng giềng gần nhất bằng tay"
  - "Hiểu “học lười”: không huấn luyện, dự đoán tốn công"
  - "Chọn K bằng kiểm định chéo; K nhỏ quá khớp, K lớn chưa khớp"
  - "Biết vì sao phải chuẩn hoá thang đo trước khi đo khoảng cách"
asr_reviewed:
  - sentence: "Theo L một, P cách 3, Q cách 4, nên P gần hơn."
    reason: "P, Q đọc tên chữ cái (“pê”, “quy”), ASR chép “T”, “quỷ”; L một chép “L1” — đúng"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ngưu tầm ngưu: đoán nhãn bằng hàng xóm"
    steps:
      - show: |
          <p class="big">“Ngưu tầm ngưu, mã tầm mã”: muốn biết một điểm mới thuộc lớp nào, hãy nhìn các điểm <b>gần nó nhất</b>.</p>
          <div class="box key">Không cần học trọng số, không cần hàm sai số: chỉ cần <b>lưu dữ liệu</b> và một cách đo <b>khoảng cách</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, phương pháp hôm nay tóm gọn trong câu ngưu tầm ngưu, mã tầm mã. Muốn biết một điểm mới thuộc lớp nào, hãy nhìn các điểm gần nó nhất. Không cần học trọng số, không cần hàm sai số, chỉ cần lưu dữ liệu và một cách đo khoảng cách."

  - id: prereq
    kind: prereq
    title: "Ôn nền: hiệu, độ dài, giá trị tuyệt đối, chuẩn hoá"
    checks:
      - "(lambda d: (d.tolist(), float(np.linalg.norm(d))) == ([3.0, 4.0], 5.0))(np.array([4, 6.]) - np.array([1, 2.]))"
      - "abs(-3) == 3 and abs(3) == 3 and (lambda c: (float(c.mean()), float(c.std()), ((c - c.mean())/c.std()).tolist()) == (170.0, 10.0, [-1.0, 1.0]))(np.array([160, 180.]))"
    steps:
      - show: |
          <table class="t"><tr><th>phép toán</th><th>ví dụ</th><th>kết quả</th></tr>
          <tr><td>hiệu hai vector (bài 1): trừ từng thành phần</td><td>$(4;\ 6) - (1;\ 2)$</td><td>$(3;\ 4)$</td></tr>
          <tr><td>độ dài (bài 1)</td><td>$\sqrt{3^2 + 4^2} = \sqrt{25}$</td><td>5</td></tr>
          <tr><td>giá trị tuyệt đối: bỏ dấu âm</td><td>$|-3|$ và $|3|$</td><td>3 và 3</td></tr>
          <tr><td>chuẩn hoá một cột (bài 16): trừ trung bình, chia độ lệch chuẩn</td><td>160 và 180 cm: trung bình 170, độ lệch chuẩn 10</td><td>−1 và 1</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Trước hết, ôn bốn phép tính sẽ dùng trong bài. Theo bài 1, hiệu của hai vector 4, 6 và 1, 2 là trừ từng thành phần, được 3 và 4. Độ dài của hiệu này là căn của 3 bình phương cộng 4 bình phương, tức căn 25, bằng 5. Giá trị tuyệt đối bỏ dấu âm, nên trị tuyệt đối của âm 3 cũng bằng 3. Theo bài 16, chuẩn hoá một cột là trừ trung bình rồi chia độ lệch chuẩn, nên chiều cao 160 và 180 xăng-ti-mét, với trung bình 170 và độ lệch chuẩn 10, thành âm 1 và 1."

  # ───────────────────────── 2. KHOẢNG CÁCH ─────────────────────────
  - id: sym_dist
    kind: symbol
    title: "Giải mã: khoảng cách L2 (Euclid) và L1 (Manhattan)"
    checks:
      - "(lambda x, z: (sum(abs(a - b) for a, b in zip(x, z)), math.sqrt(sum((a - b)**2 for a, b in zip(x, z)))) == (7, 5.0))((1, 2), (4, 6))"
    steps:
      - show: |
          <div class="box key">$d_2(\mathbf{x}, \mathbf{z}) = \lVert\mathbf{x} - \mathbf{z}\rVert = \sqrt{\sum_{j}(x_j - z_j)^2}$ &nbsp; (L2, Euclid — đường chim bay, bài 1)</div>
          <div class="box key">$d_1(\mathbf{x}, \mathbf{z}) = \sum_{j}|x_j - z_j|$ &nbsp; (L1, Manhattan — đi theo ô bàn cờ)</div>
          <p><b>Làm thử ngay</b>: $\mathbf{x} = (1;\ 2)$, $\mathbf{z} = (4;\ 6)$: &nbsp; $d_2 = \sqrt{9 + 16} = \hlg{5}$, &nbsp; $d_1 = 3 + 4 = \hlg{7}$</p>
        introduces: [dist]
        focus: [0, 1, 2, 3]
        say: "Có hai cách đo khoảng cách hay dùng. Khoảng cách L hai là độ dài của hiệu hai vector như bài 1, tức đường chim bay. Khoảng cách L một cộng các độ lệch tuyệt đối, như đi theo các ô bàn cờ. Làm thử ngay, hai điểm này cách nhau 5 theo L hai và 7 theo L một."

  # ───────────────────────── 3. THUẬT TOÁN ─────────────────────────
  - id: algorithm
    kind: concept
    title: "Thuật toán: lưu, đo, bầu"
    steps:
      - show: |
          <ol><li><b>“Huấn luyện”</b>: chỉ lưu $N$ điểm dữ liệu và nhãn của chúng.</li>
          <li><b>Dự đoán</b> điểm mới $\mathbf{q}$: đo khoảng cách tới cả $N$ điểm; lấy $K$ điểm gần nhất.</li>
          <li><b>Bầu</b>: nhãn nhiều phiếu nhất trong $K$ láng giềng (hồi quy thì lấy trung bình).</li></ol>
          <p class="note">Gọi là <b>học lười</b>: huấn luyện tốn gần như 0 công, dự đoán tốn công tỉ lệ với $N$. Ngược với logistic, mạng nơ-ron: học lâu, đoán nhanh. Không có hàm sai số nào được tối ưu.</p>
        focus: [1, "1.1", "1.2", "1.3", 2]
        say: "Thuật toán có ba bước. Huấn luyện chỉ là lưu dữ liệu. Khi dự đoán một điểm mới, đo khoảng cách tới tất cả các điểm và lấy K điểm gần nhất. Rồi bầu chọn theo đa số. Vì huấn luyện gần như không tốn công còn dự đoán thì tốn, nó được gọi là học lười."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ: K = 1 và K = 3 cho hai đáp án khác nhau"
    checks:
      - "(lambda X, y, q: (lambda o: (y[o[0]], int(y[o[:3]].sum()), int(y[o[:5]].sum())))(np.argsort(np.linalg.norm(X - q, axis=1))))(np.array([[1, 1], [2, 1], [1, 2], [5, 5], [4, 4], [5, 4], [4, 5], [6, 6.]]), np.array([0, 0, 0, 0, 1, 1, 1, 1]), np.array([4.8, 4.8])) == (0, 2, 4)"
      - "(lambda X, q: [round(float(v), 2) for v in sorted(np.linalg.norm(X - q, axis=1))[:3]])(np.array([[1, 1], [2, 1], [1, 2], [5, 5], [4, 4], [5, 4], [4, 5], [6, 6.]]), np.array([4.8, 4.8])) == [0.28, 0.82, 0.82]"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="520" height="520" viewBox="0 0 380 380">
            <line x1="30" y1="350" x2="370" y2="350" stroke="#9ca3af" stroke-width="2"/><line x1="40" y1="20" x2="40" y2="360" stroke="#9ca3af" stroke-width="2"/>
            <circle cx="88" cy="302" r="10" fill="#2563eb"/><circle cx="136" cy="302" r="10" fill="#2563eb"/><circle cx="88" cy="254" r="10" fill="#2563eb"/>
            <circle cx="280" cy="110" r="10" fill="#2563eb"/>
            <rect x="222" y="148" width="20" height="20" fill="#d97706"/><rect x="270" y="148" width="20" height="20" fill="#d97706"/>
            <rect x="222" y="100" width="20" height="20" fill="#d97706"/><rect x="318" y="52" width="20" height="20" fill="#d97706"/>
            <path d="M 260 120 L 280 120 M 270 110 L 270 130" stroke="#111827" stroke-width="4"/>
            <circle cx="270" cy="120" r="44" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
            <g font-size="20"><text x="322" y="140" fill="#2563eb">nhiễu</text><text x="236" y="212" fill="#059669">K = 3</text></g>
          </svg></div>
          <div class="col"><p><span style="color:#2563eb">●</span> lớp A &nbsp; <span style="color:#d97706">■</span> lớp B. Điểm mới $\mathbf{q} = (4{,}8;\ 4{,}8)$ (dấu +).</p>
          <p>Láng giềng gần nhất: điểm A “lạc” $(5;\ 5)$, cách 0,28 → <b>K = 1</b> đoán <b>A</b>.</p>
          <p>3 gần nhất: A (0,28), B (0,82), B (0,82) → <b>K = 3</b> đoán <b>B</b>; &nbsp; K = 5: 4 phiếu B.</p></div></div>
        say: "Ví dụ, lớp A ở góc dưới, lớp B ở góc trên, và có một điểm A lạc vào giữa lớp B. Điểm mới có láng giềng gần nhất chính là điểm lạc đó, nên với K bằng 1, ta đoán A. Với K bằng 3, có hai phiếu B, nên ta đoán B, hợp lý hơn."
      - show: |
          <p class="note">K = 1 bám theo cả điểm nhiễu — giống <b>quá khớp</b> (bài 19). K lớn hơn làm mượt, bớt bị một điểm lẻ chi phối.</p>
        say: "Với K bằng 1, ta bám theo cả điểm nhiễu, giống hiện tượng quá khớp của bài 19. K lớn hơn làm mượt, bớt bị một điểm lẻ chi phối."

  # ───────────────────────── 5. CHỌN K ─────────────────────────
  - id: choose_k
    kind: concept
    title: "Chọn K bằng kiểm định chéo"
    checks:
      - "(lambda X, y: (lambda D: [round(float(((y[np.argsort(D, axis=1)[:, :K]].mean(1) > 0.5) != y).mean()), 3) for K in (1, 3, 7, 15, 51)])(np.where(np.eye(200, dtype=bool), np.inf, np.linalg.norm(X[:, None] - X[None], axis=2))))(*(lambda rng: (np.vstack([rng.normal([0, 0], 1.2, (100, 2)), rng.normal([2, 2], 1.2, (100, 2))]), np.r_[np.zeros(100), np.ones(100)]))(np.random.default_rng(0))) == [0.235, 0.185, 0.17, 0.14, 0.145]"
    steps:
      - show: |
          <p>200 điểm mô phỏng (hai lớp chồng lấn). Kiểm định “bỏ ra một”: mỗi điểm được đoán bằng các điểm còn lại (bài 19):</p>
          <table class="t"><tr><th>K</th><th>1</th><th>3</th><th>7</th><th>15</th><th>51</th></tr>
          <tr><td>tỉ lệ đoán sai</td><td>23,5%</td><td>18,5%</td><td>17,0%</td><td>$\hlg{14{,}0\%}$</td><td>14,5%</td></tr></table>
          <p class="note">K quá nhỏ: quá khớp nhiễu. K quá lớn: mọi điểm bị bầu theo lớp đông hơn trên cả một vùng rộng — chưa khớp. K lẻ tránh hoà phiếu khi có 2 lớp.</p>
        focus: [1, 2, 3, 3]
        say: "Với 200 điểm mô phỏng, ta đoán mỗi điểm bằng các điểm còn lại, một dạng kiểm định chéo của bài 19. K bằng 1 sai 23 phẩy 5 phần trăm, K bằng 15 chỉ sai 14 phần trăm. K quá nhỏ thì quá khớp nhiễu, K quá lớn thì chưa khớp. Chọn K lẻ để tránh hoà phiếu."

  # ───────────────────────── 6. L1 HAY L2 ─────────────────────────
  - id: l1_vs_l2
    kind: formula
    title: "L1 và L2 có thể chọn láng giềng khác nhau"
    checks:
      - "(abs(3) + abs(0), abs(2) + abs(2)) == (3, 4) and (math.sqrt(9), round(math.sqrt(8), 2)) == (3.0, 2.83)"
    steps:
      - show: |
          <p>Điểm mới $\mathbf{q} = (0;\ 0)$, hai ứng viên $P = (3;\ 0)$, $Q = (2;\ 2)$:</p>
          <table class="t"><tr><th></th><th>$P$</th><th>$Q$</th><th>gần hơn</th></tr>
          <tr><td>$d_1$ (L1)</td><td>3</td><td>4</td><td>$\hlg{P}$</td></tr>
          <tr><td>$d_2$ (L2)</td><td>3</td><td>$\sqrt{8} \approx 2{,}83$</td><td>$\hlg{Q}$</td></tr></table>
          <p class="note">Theo L2, đi chéo được lợi; theo L1, mỗi chiều cộng riêng. Cách đo khoảng cách là một <b>siêu tham số</b>, chọn bằng kiểm định như K.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Thay số với điểm mới ở gốc toạ độ. Theo L một, P cách 3, Q cách 4, nên P gần hơn. Theo L hai, P cách 3, Q cách căn 8, xấp xỉ 2 phẩy 83, nên Q gần hơn. Vì vậy cách đo khoảng cách cũng là một siêu tham số, chọn bằng kiểm định như K."

  # ───────────────────────── 7. CHUẨN HOÁ ─────────────────────────
  - id: scaling
    kind: example
    title: "Ví dụ: đổi đơn vị là đổi láng giềng"
    checks:
      - "(lambda P, q: [round(float(v), 2) for v in np.linalg.norm(P - q, axis=1)])(np.array([[1.60, 60], [1.80, 61], [1.62, 75.]]), np.array([1.61, 61])) == [1.0, 0.19, 14.0]"
      - "(lambda P, q: [round(float(v), 2) for v in np.linalg.norm(P - q, axis=1)])(np.array([[160, 60], [180, 61], [162, 75.]]), np.array([161, 61])) == [1.41, 19.0, 14.04]"
    steps:
      - show: |
          <p>Người mới cao 1,61 m, nặng 61 kg. Ba người đã biết: A (1,60 m; 60 kg), B (1,80 m; 61 kg), C (1,62 m; 75 kg).</p>
          <table class="t"><tr><th>đo chiều cao bằng</th><th>tới A</th><th>tới B</th><th>tới C</th><th>gần nhất</th></tr>
          <tr><td>mét</td><td>1,00</td><td>$\hlo{0{,}19}$</td><td>14,00</td><td>B (cao hơn 19 cm!)</td></tr>
          <tr><td>xăng-ti-mét</td><td>$\hlg{1{,}41}$</td><td>19,00</td><td>14,04</td><td>A</td></tr></table>
          <div class="box key">Đặc trưng có số to lấn át khoảng cách. Chuẩn hoá mỗi cột (trừ trung bình, chia độ lệch chuẩn) trước khi dùng K láng giềng gần nhất.</div>
        focus: [1, "2.2", "2.3", 3]
        say: "Ví dụ người mới cao 1 mét 61, nặng 61 ký. Đo chiều cao bằng mét, chênh lệch chiều cao gần như biến mất, nên B gần nhất dù cao hơn 19 xăng-ti-mét. Đổi sang xăng-ti-mét, A lại gần nhất. Vì vậy phải chuẩn hoá mỗi cột trước khi đo khoảng cách."

  # ───────────────────────── 8. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: tính lại khoảng cách bằng hai cách"
    checks:
      - "(lambda X, q: np.allclose(np.linalg.norm(X - q, axis=1), np.sqrt(((X - q)**2).sum(1))) and np.allclose(np.abs(X - q).sum(1), [7.6, 6.6, 6.6, 0.4, 1.6, 1.0, 1.0, 2.4]))(np.array([[1, 1], [2, 1], [1, 2], [5, 5], [4, 4], [5, 4], [4, 5], [6, 6.]]), np.array([4.8, 4.8]))"
    steps:
      - show: |
          <table class="t"><tr><th>cách tính (ví dụ 8 điểm)</th><th>gần nhất</th><th>hai điểm tiếp theo</th><th>kết luận</th></tr>
          <tr><td>$d_2$ bằng hàm độ dài của thư viện</td><td>A lạc $(5;\ 5)$: 0,28</td><td>B: 0,82; 0,82</td><td>K = 1 → A; K = 3 → B</td></tr>
          <tr><td>$d_2$ bằng căn của tổng bình phương</td><td colspan="3">trùng từng số $\checkmark$</td></tr>
          <tr><td>$d_1$ (cộng độ lệch tuyệt đối)</td><td>A lạc $(5;\ 5)$: 0,4</td><td>B: 1,0; 1,0</td><td>không đổi $\checkmark$</td></tr></table>
        focus: [["1.2", "1.3"], "1.4"]
        say: "Phép thử, ta tính khoảng cách L hai bằng hàm của thư viện và bằng công thức, hai cách trùng nhau. Đổi sang khoảng cách L một, thứ tự láng giềng trong ví dụ vẫn vậy, nên kết luận với K bằng 1 và K bằng 3 không đổi."

  # ───────────────────────── 9. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Láng giềng gần nhất trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>ở đâu</th><th>dùng khoảng cách thế nào</th></tr>
          <tr><td>tìm sản phẩm, ảnh, văn bản “giống nhất”</td><td>tìm kiếm theo vector đặc trưng</td></tr>
          <tr><td><b>Bài 29</b>: phân cụm K-Means</td><td>khoảng cách tới các tâm</td></tr>
          <tr><td><b>Bài 32</b>: vẽ dữ liệu nhiều chiều</td><td>láng giềng gần vẫn gần nhau</td></tr></table>
        forward_ref: true
        say: "Ý tưởng láng giềng gần nhất được dùng để tìm sản phẩm, ảnh, văn bản giống nhất. Ở bài 29, phân cụm cũng dựa vào khoảng cách tới các tâm. Ở bài 32, ta vẽ dữ liệu nhiều chiều sao cho láng giềng gần vẫn gần nhau."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không chuẩn hoá thang đo <b class="red">(sai)</b>
          <br><span class="note">Đổi mét sang xăng-ti-mét là đổi láng giềng gần nhất.</span></div>
        say: "Lỗi thứ nhất, không chuẩn hoá thang đo. Như ví dụ, chỉ đổi mét sang xăng-ti-mét là đổi láng giềng gần nhất."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn K theo sai số trên chính dữ liệu đã lưu <b class="red">(sai)</b>
          <br><span class="note">Với K = 1, mỗi điểm là láng giềng của chính nó → sai số 0, luôn chọn K = 1. Phải bỏ điểm đó ra khi đoán (kiểm định).</span></div>
        say: "Lỗi thứ hai, chọn K theo sai số trên chính dữ liệu đã lưu. Với K bằng 1, mỗi điểm là láng giềng của chính nó, nên sai số luôn bằng 0. Phải bỏ điểm đó ra khi đoán, đúng như kiểm định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng với rất nhiều đặc trưng mà không giảm chiều <b class="red">(dễ sai)</b>
          <br><span class="note">Khi số chiều rất lớn, khoảng cách từ một điểm tới mọi điểm khác gần như bằng nhau — “gần nhất” mất ý nghĩa. Giảm chiều trước (bài 16, 26).</span></div>
        say: "Lỗi thứ ba, dùng với rất nhiều đặc trưng mà không giảm chiều. Khi số chiều rất lớn, khoảng cách tới mọi điểm gần như bằng nhau, nên gần nhất mất ý nghĩa. Hãy giảm chiều trước, bằng phân tích thành phần chính của bài 16 hoặc phân tích phân biệt tuyến tính của bài 26."

  # ───────────────────────── 11. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda x, z: (sum(abs(a - b) for a, b in zip(x, z)), math.sqrt(sum((a - b)**2 for a, b in zip(x, z)))) == (14, 10.0))((0, 0), (6, 8))"
      - "sorted([('A', 1), ('B', 2), ('B', 3), ('A', 4), ('B', 5)], key=lambda t: t[1])[:3] == [('A', 1), ('B', 2), ('B', 3)]"
      - "(lambda nb: [__import__('collections').Counter(l for l, _ in sorted(nb, key=lambda t: t[1])[:K]).most_common(1)[0] for K in (1, 3)] == [('A', 1), ('B', 2)])([('A', 1), ('B', 2), ('B', 3), ('A', 4), ('B', 5)])"
      - "6**2 + 8**2 == 100 and math.sqrt(100) == 10 and abs(6) + abs(8) == 14"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Khoảng cách L1 và L2 giữa $(0;\ 0)$ và $(6;\ 8)$?</td></tr>
          <tr><td>2</td><td>5 láng giềng có nhãn và khoảng cách: A (1), B (2), B (3), A (4), B (5). K = 1 đoán gì? K = 3 đoán gì?</td></tr>
          <tr><td>3</td><td>Vì sao gọi là “học lười”?</td></tr></table>
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một tính hai khoảng cách. Câu hai bầu chọn với K bằng 1 và K bằng 3. Câu ba giải thích tên gọi học lười. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① Hiệu là $(6;\ 8)$, rồi đo theo hai cách:</p>
          $$d_1 = |6| + |8| = \hlg{14}, \qquad d_2 = \sqrt{6^2 + 8^2} = \sqrt{36 + 64} = \sqrt{100} = \hlg{10}$$
        focus: [1, 2, 2]
        say: "Câu một, hiệu của hai điểm là 6 và 8. Khoảng cách L một cộng hai độ lệch tuyệt đối, 6 cộng 8, bằng 14. Khoảng cách L hai là căn của 36 cộng 64, tức căn 100, bằng 10, ngắn hơn vì được đi chéo."
      - clear: true
        show: |
          <p>② Xếp láng giềng theo khoảng cách, lấy K cái đầu, đếm phiếu:</p>
          <table class="t"><tr><th>K</th><th>láng giềng được lấy</th><th>phiếu</th><th>đoán</th></tr>
          <tr><td>1</td><td>A (1)</td><td>A: 1</td><td>$\hlg{\text{A}}$</td></tr>
          <tr><td>3</td><td>A (1), B (2), B (3)</td><td>A: 1, B: 2</td><td>$\hlg{\text{B}}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Câu hai, ta xếp láng giềng theo khoảng cách rồi lấy K cái đầu. Với K bằng 1, chỉ lấy A ở khoảng cách 1, nên đoán A. Với K bằng 3, lấy A, B và B, đếm được một phiếu A và hai phiếu B, nên đoán B."
      - show: |
          <p>③ So công sức của hai giai đoạn, với $N$ điểm đã lưu:</p>
          <table class="t"><tr><th>giai đoạn</th><th>K láng giềng gần nhất làm gì</th></tr>
          <tr><td>huấn luyện</td><td>chỉ lưu dữ liệu — gần như không tốn công</td></tr>
          <tr><td>dự đoán mỗi điểm</td><td>đo $N$ khoảng cách, xếp, bầu — tốn công tỉ lệ với $N$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Câu ba, ta so công sức của hai giai đoạn. Lúc huấn luyện, nó không học gì, chỉ lưu dữ liệu. Rồi nó dồn hết công sức sang lúc dự đoán, mỗi điểm mới phải đo khoảng cách tới cả N điểm, nên gọi là học lười."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lưu dữ liệu (học lười)</span><span class="a">→</span>
          <span class="n">đo khoảng cách L1 hoặc L2</span><span class="a">→</span>
          <span class="n">K gần nhất bầu chọn</span><span class="a">→</span>
          <span class="n">chọn K, cách đo bằng kiểm định</span><span class="a">→</span>
          <span class="n">chuẩn hoá thang đo trước</span></div>
        say: "Tổng kết chuỗi logic. Lưu dữ liệu, đo khoảng cách L một hoặc L hai, để K láng giềng gần nhất bầu chọn. Chọn K và cách đo bằng kiểm định, và nhớ chuẩn hoá thang đo trước."
      - show: |
          <div class="box key"><b>Tư duy:</b> mô hình đơn giản nhất là “giống ai thì theo người đó” — nhưng “giống” phụ thuộc hoàn toàn vào cách ta đo khoảng cách.</div>
        say: "Điều cần mang theo, mô hình đơn giản nhất là giống ai thì theo người đó, nhưng giống hay không phụ thuộc hoàn toàn vào cách ta đo khoảng cách."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 28): <b>cây quyết định</b> và rừng ngẫu nhiên — chia dữ liệu bằng những câu hỏi có/không, đo bằng entropy và chỉ số Gini.</p>
        forward_ref: true
        say: "Ở bài sau, bài 28, ta học cây quyết định và rừng ngẫu nhiên, chia dữ liệu bằng những câu hỏi có hoặc không. Hẹn gặp bạn ở bài tiếp theo."
