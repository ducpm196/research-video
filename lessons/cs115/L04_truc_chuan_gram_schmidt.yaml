  - "Tự suy ra bước Gram-Schmidt từ điều kiện vuông góc của bài 1; chạy Gram-Schmidt bằng tay cho 2 và 3 vector"
  - "Tự kiểm tra kết quả bằng hai phép thử (từng cặp vuông góc, Q chuyển vị nhân Q bằng I) và nhận ra 4 lỗi thường gặp"
