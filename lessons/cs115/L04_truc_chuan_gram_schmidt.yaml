scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao cần hệ trục vuông góc?"
    checks:
      - "Rational(7,5)*Matrix([3,4]) + Rational(2,5)*Matrix([2,11]) == Matrix([5,10])"
      - "Matrix.hstack(Matrix([3,4]), Matrix([2,11])).solve(Matrix([5,10])) == Matrix([Rational(7,5), Rational(2,5)])"
    steps:
      - show: |
          <p class="big">Toạ độ $(5, 10)^T$ = đi <b>5</b> bước theo trục ngang, rồi <b>10</b> bước theo trục đứng.</p>
          <p class="note">Hai trục vuông góc, mỗi bước dài 1: đọc toạ độ ra ngay.</p>
        focus: [1, 2]
        say: "Chào bạn, khi viết vector 5, 10, ta ngầm hiểu là đi 5 bước theo trục ngang, rồi 10 bước theo trục đứng. Hai trục đó vuông góc với nhau, và mỗi bước dài đúng 1, nên đọc toạ độ ra ngay."
      - show: |
          <div class="box warn">Nếu hai “trục” <b>xiên</b> nhau: $\ \mathbf{x}_1 = (3, 4)^T,\ \ \mathbf{x}_2 = (2, 11)^T$
          $$(5, 10)^T = \frac{7}{5}\,\mathbf{x}_1 + \frac{2}{5}\,\mathbf{x}_2$$
          <span class="note">Muốn ra hai số $\frac{7}{5}$ và $\frac{2}{5}$ phải <b>giải một hệ phương trình</b> (khử dần từng ẩn, như bài 3).</span></div>
        say: "Nhưng nếu hai trục của ta xiên nhau, ví dụ x một bằng 3, 4 và x hai bằng 2, 11, thì sao? Muốn biết phải đi bao nhiêu bước theo mỗi trục để tới 5, 10, ta phải giải một hệ hai phương trình. Khử dần từng ẩn như bài 3, ta được hai số lẻ là bảy phần năm, hai phần năm."
      - show: |
          <p>Bài hôm nay trả lời 3 câu hỏi:</p>
          <ol><li>Thế nào là một bộ trục tốt? → <b>cơ sở trực giao, trực chuẩn</b></li>
          <li>Vì sao trục trực chuẩn giúp tính nhanh? → <b>toạ độ = một tích vô hướng</b></li>
          <li>Biến trục xiên thành trục vuông góc thế nào? → <b>Gram-Schmidt</b></li></ol>
        focus: [1, "2.1", "2.2", "2.3"]
        say: "Hôm nay mình trả lời ba câu hỏi. Một, thế nào là một bộ trục tốt. Hai, vì sao trục vuông góc và dài 1 giúp tính toạ độ chỉ bằng một tích vô hướng. Ba, làm sao biến một bộ trục xiên thành bộ trục vuông góc, đó là tiến trình Gram-Schmidt."
      - clear: true
        show: |
          <p class="note">Chuỗi của AI: <b>Biểu diễn</b> → Dự đoán → Sai số → Tối ưu. Hôm nay ở bước Biểu diễn: chọn hệ trục tốt để mô tả dữ liệu.</p>
          <p class="note">Công cụ duy nhất cần: <b>cái bóng</b> của bài 1 và <b>phép nhân ma trận</b> của bài 2.</p>
        focus: [1, 2]
        say: "Với AI, hôm nay ta ở bước biểu diễn, tức là chọn một hệ trục tốt để mô tả dữ liệu. Tin vui là bạn chỉ cần hai công cụ đã có, cái bóng của bài 1 và phép nhân ma trận của bài 2."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: cái bóng, độ dài, chia vector cho một số"
    checks:
      - "Rational(Matrix([6,2,4]).dot(Matrix([1,2,0])), Matrix([1,2,0]).dot(Matrix([1,2,0])))*Matrix([1,2,0]) == Matrix([2,4,0])"
      - "Matrix([6,2,4]) - Matrix([2,4,0]) == Matrix([4,-2,4]) and Matrix([4,-2,4]).dot(Matrix([1,2,0])) == 0"
      - "Matrix([3,4]).norm() == 5 and 3**2 + 4**2 == 25 and sqrt(25) == 5"
      - "Rational(1,5)*Matrix([3,4]) == Matrix([Rational(3,5), Rational(4,5)])"
    steps:
      - show: |
          $$\proj_{\mathbf{u}}\mathbf{y} = \frac{\mathbf{y}^T\mathbf{u}}{\mathbf{u}^T\mathbf{u}}\,\mathbf{u}, \qquad \mathbf{z} = \mathbf{y} - \proj_{\mathbf{u}}\mathbf{y} \ \perp\ \mathbf{u}$$
          <p class="note">Bài 1: $\mathbf{y} = (6, 2, 4)^T,\ \mathbf{u} = (1, 2, 0)^T \implies$ bóng $= \frac{10}{5}\,\mathbf{u} = (2, 4, 0)^T$, &nbsp; $\mathbf{z} = (4, -2, 4)^T$, &nbsp; $\mathbf{z}^T\mathbf{u} = 4 - 4 + 0 = 0$</p>
        focus: [0, 1, 1, 2]
        say: "Ôn lại công cụ chính của bài 1, cái bóng. Hình chiếu của y lên u bằng y chuyển vị nhân u, chia cho u chuyển vị nhân u, rồi nhân với u. Phần còn lại z bằng y trừ cái bóng, và luôn vuông góc với u. Với số của bài 1, bóng là 2, 4, 0, còn z bằng 4, âm 2, 4."
      - show: |
          <p>Độ dài: $\ \|(3, 4)^T\| = \sqrt{3^2 + 4^2} = \sqrt{25} = 5$</p>
          <p>Chia vector cho một số = nhân với nghịch đảo của số đó: $\ \dfrac{(3, 4)^T}{5} = \dfrac{1}{5}\,(3, 4)^T = \left(\dfrac{3}{5}, \dfrac{4}{5}\right)^T$</p>
        focus: [0, 1, 2, 2]
        say: "Thêm hai phép tính nhỏ. Độ dài của vector 3, 4 bằng căn của 9 cộng 16, tức căn 25, bằng 5. Còn chia một vector cho một số, nghĩa là nhân vector với một phần số đó, tức chia từng thành phần. 3, 4 chia 5 được ba phần năm, bốn phần năm."

  # ───────────────────────── 3. KÝ HIỆU: TỔ HỢP, BỘ VECTOR, CƠ SỞ ─────────────────────────
  - id: sym_basis
    kind: symbol
    title: "Giải mã: tổ hợp tuyến tính, bộ vector {…}, cơ sở"
    checks:
      - "2*Matrix([3,4]) + 1*Matrix([2,11]) == Matrix([8,19])"
      - "5*Matrix([1,0]) + 10*Matrix([0,1]) == Matrix([5,10])"
      - "Matrix([2,4]) == 2*Matrix([1,2]) and Matrix.hstack(Matrix([1,2]), Matrix([2,4])).rank() == 1"
      - "Matrix.hstack(Matrix([3,4]), Matrix([2,11])).det() == 25"
    steps:
      - show: |
          <p><b>Tổ hợp tuyến tính</b> = nhân mỗi vector với một số, rồi cộng lại:</p>
          $$2\,\mathbf{x}_1 + 1\,\mathbf{x}_2 = 2\,(3, 4)^T + (2, 11)^T = (8, 19)^T$$
        focus: [1, 1, 2]
        say: "Từ đầu tiên cần biết là tổ hợp tuyến tính. Nghe đáng sợ, nhưng chỉ là nhân mỗi vector với một con số, rồi cộng lại. Ví dụ 2 nhân x một cộng 1 nhân x hai, bằng 6, 8 cộng 2, 11, tức là 8, 19."
      - show: |
          $$\{\mathbf{x}_1, \mathbf{x}_2\}$$
          <p>Ngoặc <b>móc nhọn</b> = gom các vector thành <b>một bộ</b>.</p>
          <p class="note">Gram-Schmidt xử lý bộ vector theo đúng thứ tự viết: $\mathbf{x}_1$ trước, $\mathbf{x}_2$ sau.</p>
        introduces: [set]
        focus: [1, 1, 2, 3]
        say: "Ký hiệu mới đầu tiên là cặp ngoặc móc nhọn. Đọc là bộ x một, x hai. Nó gom các vector lại thành một bộ. Lát nữa, Gram-Schmidt sẽ xử lý bộ này theo đúng thứ tự viết, x một trước, x hai sau."
      - clear: true
        show: |
          <div class="box key"><b>Cơ sở</b> của $\mathbb{R}^2$ = bộ vector mà <b>mọi</b> vector của $\mathbb{R}^2$ đều viết được thành tổ hợp của chúng, theo <b>đúng một cách</b>.</div>
          <p>Bộ quen thuộc: $\ \mathbf{e}_1 = (1, 0)^T,\ \mathbf{e}_2 = (0, 1)^T$: &nbsp; $(5, 10)^T = 5\,\mathbf{e}_1 + 10\,\mathbf{e}_2$</p>
          <p class="note">Bộ xiên $\{\mathbf{x}_1, \mathbf{x}_2\}$ ở đầu bài cũng là một cơ sở: $(5, 10)^T = \frac{7}{5}\,\mathbf{x}_1 + \frac{2}{5}\,\mathbf{x}_2$.</p>
        focus: [1, 1, "2.1", 3]
        say: "Giờ đến khái niệm cơ sở. Một bộ vector là cơ sở của R hai nếu mọi vector của R hai đều viết được thành tổ hợp của bộ đó, và chỉ theo đúng một cách. Bộ quen thuộc nhất là e một bằng 1, 0 và e hai bằng 0, 1. Bộ xiên ở đầu bài cũng là một cơ sở."
      - show: |
          <div class="box warn"><b>Không</b> phải cơ sở: $\ \{(1, 2)^T,\ (2, 4)^T\}$ vì $(2, 4)^T = 2\,(1, 2)^T$ — cùng nằm trên một đường thẳng.
          <br><span class="note">Vector này là bội của vector kia → <b>không độc lập tuyến tính</b>; tổ hợp của chúng không bao giờ ra được $(1, 0)^T$.</span></div>
          <p class="note">Trong $\mathbb{R}^2$ mọi cơ sở có đúng 2 vector; trong $\mathbb{R}^3$, đúng 3 vector.</p>
        focus: ["1.2", "1.4", 2]
        say: "Ngược lại, bộ 1, 2 và 2, 4 không phải cơ sở, vì vector sau gấp đôi vector trước, cả hai nằm trên một đường thẳng. Khi một vector là tổ hợp của các vector còn lại, ta nói bộ đó không độc lập tuyến tính. Cần nhớ thêm, mọi cơ sở của R hai có đúng 2 vector, của R ba có đúng 3."

  # ───────────────────────── 4. TRỰC GIAO, TRỰC CHUẨN ─────────────────────────
  - id: orthonormal
    kind: concept
    title: "Trực giao, vector đơn vị, trực chuẩn"
    checks:
      - "Matrix([3,4]).dot(Matrix([-4,3])) == 0 and 3*(-4) + 4*3 == 0"
      - "Matrix([3,4])/5 == Matrix([Rational(3,5), Rational(4,5)]) and (Matrix([3,4])/5).dot(Matrix([3,4])/5) == 1"
      - "Rational(9,25) + Rational(16,25) == 1"
      - "Matrix([-4,3])/5 == Matrix([Rational(-4,5), Rational(3,5)]) and (Matrix([-4,3])/5).norm() == 1 and (Matrix([3,4])/5).dot(Matrix([-4,3])/5) == 0"
    steps:
      - show: |
          <p>Bộ <b>trực giao</b>: mọi cặp vector <b>khác nhau</b> đều vuông góc (tích vô hướng $= 0$).</p>
          $$\mathbf{v}_1 = (3, 4)^T,\ \ \mathbf{v}_2 = (-4, 3)^T: \qquad \mathbf{v}_1^T\mathbf{v}_2 = 3\cdot(-4) + 4\cdot 3 = 0\ \checkmark$$
        focus: [1, 2, 2]
        say: "Một bộ vector gọi là trực giao nếu mọi cặp vector khác nhau trong bộ đều vuông góc, tức là tích vô hướng bằng 0. Ví dụ v một bằng 3, 4 và v hai bằng âm 4, 3. Tích vô hướng bằng âm 12 cộng 12, bằng 0, nên hai vector vuông góc."
      - show: |
          <p><b>Vector đơn vị</b> = vector có độ dài 1. <b>Chuẩn hoá</b> = chia cho độ dài của chính nó:</p>
          $$\mathbf{u}_1 = \frac{\mathbf{v}_1}{\|\mathbf{v}_1\|} = \frac{(3, 4)^T}{5} = \left(\frac{3}{5}, \frac{4}{5}\right)^T, \qquad \|\mathbf{u}_1\|^2 = \frac{9}{25} + \frac{16}{25} = 1\ \checkmark$$
          <p class="note">Nhân với số dương $\frac{1}{5}$ chỉ thu ngắn mũi tên, <b>không đổi hướng</b> (bài 1).</p>
        focus: [1, 1, 2, 2]
        say: "Vector có độ dài bằng 1 gọi là vector đơn vị. Muốn có vector đơn vị, ta chia vector cho độ dài của nó, gọi là chuẩn hoá. v một dài 5, nên u một bằng ba phần năm, bốn phần năm. Thử lại, độ dài bình phương bằng chín phần hai lăm cộng mười sáu phần hai lăm, bằng 1."
      - show: |
          <div class="box key">Bộ <b>trực chuẩn</b> = trực giao <b>và</b> mọi vector dài 1:
          $$\mathbf{u}_1 = \left(\frac{3}{5}, \frac{4}{5}\right)^T,\ \ \mathbf{u}_2 = \frac{\mathbf{v}_2}{5} = \left(-\frac{4}{5}, \frac{3}{5}\right)^T: \qquad \mathbf{u}_i^T\mathbf{u}_j = \begin{cases} 1 & \text{nếu } i = j \\ 0 & \text{nếu } i \neq j \end{cases}$$</div>
        say: "Một bộ vừa trực giao, vừa có mọi vector dài 1, gọi là bộ trực chuẩn. Chia v hai cho 5, ta được u hai bằng âm bốn phần năm, ba phần năm. Tóm gọn, u i chuyển vị nhân u j bằng 1 khi i bằng j, và bằng 0 khi i khác j."
      - clear: true
        show: |
          <p class="note">Nhiều sách viết: $\ \mathbf{u}_i = \dfrac{\mathbf{v}_i}{\|\mathbf{v}_i\|_2}$ — số 2 ở dưới là “chuẩn L2”, chính là độ dài ta dùng: $\ \|\mathbf{v}_i\|_2 = \|\mathbf{v}_i\|$.</p>
        notation_note: true
        say: "Nhiều sách viết công thức chuẩn hoá có thêm số 2 nhỏ ở dưới hai vạch kép. Như bài 1 đã nói, số 2 đó chỉ là tên chuẩn L2, đúng độ dài ta đang dùng, nên bài này bỏ số 2."

  # ───────────────────────── 5. VÌ SAO CẦN TRỰC CHUẨN ─────────────────────────
  - id: coords
    kind: intuition
    title: "Phần thưởng: toạ độ = một tích vô hướng"
    checks:
      - "(lambda c1, c2: sp.expand(((c1*Matrix([3,4])/5 + c2*Matrix([-4,3])/5).T*(Matrix([3,4])/5))[0]) == c1)(*sp.symbols('c1 c2'))"
      - "Matrix([5,10]).dot(Matrix([3,4])/5) == 11 and 5*Rational(3,5) + 10*Rational(4,5) == 11"
      - "Matrix([5,10]).dot(Matrix([-4,3])/5) == 2 and 5*Rational(-4,5) + 10*Rational(3,5) == 2"
      - "11*Matrix([3,4])/5 + 2*Matrix([-4,3])/5 == Matrix([5,10])"
      - "Rational(33,5) - Rational(8,5) == 5 and Rational(44,5) + Rational(6,5) == 10"
    steps:
      - show: |
          <p>Muốn tìm $\hlo{c_1}, \hlo{c_2}$ trong $\ \mathbf{y} = \hlo{c_1}\,\mathbf{u}_1 + \hlo{c_2}\,\mathbf{u}_2$. Nhân vô hướng hai vế với $\mathbf{u}_1$, phá ngoặc như bài 1:</p>
          $$\mathbf{y}^T\mathbf{u}_1 = \hlo{c_1}\,\underbrace{\mathbf{u}_1^T\mathbf{u}_1}_{=\,1} + \hlo{c_2}\,\underbrace{\mathbf{u}_2^T\mathbf{u}_1}_{=\,0} = \hlo{c_1}$$
        focus: [0, "1.2", 1, 2]
        say: "Giờ là phần thưởng. Giả sử y bằng c một nhân u một cộng c hai nhân u hai, và ta cần tìm c một, c hai. Nhân vô hướng cả hai vế với u một, rồi phá ngoặc như bài 1. Vì u một nhân u một bằng 1, còn u hai nhân u một bằng 0, nên chỉ còn lại c một."
      - show: |
          <div class="box key">Với cơ sở trực chuẩn: &nbsp; $\hlo{c_1} = \mathbf{y}^T\mathbf{u}_1, \quad \hlo{c_2} = \mathbf{y}^T\mathbf{u}_2$ &nbsp; — không cần giải hệ phương trình.</div>
        say: "Vậy với cơ sở trực chuẩn, mỗi toạ độ chỉ là một tích vô hướng, c một bằng y nhân u một, c hai bằng y nhân u hai. Không cần giải hệ phương trình nào cả."
      - clear: true
        show: |
          <p>Làm thử với $\ \mathbf{y} = (5, 10)^T,\ \ \mathbf{u}_1 = \left(\frac{3}{5}, \frac{4}{5}\right)^T,\ \ \mathbf{u}_2 = \left(-\frac{4}{5}, \frac{3}{5}\right)^T$:</p>
          $$\hlo{c_1} = 5\cdot\frac{3}{5} + 10\cdot\frac{4}{5} = 3 + 8 = \hlg{11}, \qquad \hlo{c_2} = 5\cdot\left(-\frac{4}{5}\right) + 10\cdot\frac{3}{5} = -4 + 6 = \hlg{2}$$
          <p>Thử lại: $\ \hlg{11}\,\mathbf{u}_1 + \hlg{2}\,\mathbf{u}_2 = \left(\frac{33}{5} - \frac{8}{5},\ \frac{44}{5} + \frac{6}{5}\right)^T = (5, 10)^T\ \checkmark$</p>
        focus: [1, 2, 2, 3]
        say: "Làm thử với y bằng 5, 10 và hai vector u vừa tìm. c một bằng 5 nhân ba phần năm cộng 10 nhân bốn phần năm, tức 3 cộng 8, bằng 11. c hai bằng âm 4 cộng 6, bằng 2. Thử lại, 11 u một cộng 2 u hai đúng bằng 5, 10."
      - show: |
          <p class="note">Mỗi mảnh $\hlo{c_i}\,\mathbf{u}_i$ chính là <b>cái bóng</b> của $\mathbf{y}$ trên $\mathbf{u}_i$ (mẫu số $\mathbf{u}_i^T\mathbf{u}_i = 1$). So với bộ xiên: phải giải hệ để ra $\frac{7}{5}, \frac{2}{5}$.</p>
          <div class="box key">Câu hỏi còn lại: có bộ xiên $\{\mathbf{x}_1, \mathbf{x}_2\}$ trong tay, làm sao <b>tạo ra</b> bộ trực chuẩn?</div>
        focus: [1, 2]
        say: "Để ý, mỗi mảnh c i nhân u i chính là cái bóng của y trên u i, vì mẫu số u i nhân u i bằng 1. Câu hỏi còn lại là, nếu trong tay chỉ có một bộ xiên, làm sao tạo ra một bộ trực chuẩn?"

  # ───────────────────────── 6. GRAM-SCHMIDT CHO 2 VECTOR ─────────────────────────
  - id: gs2
    kind: formula
    title: "Gram-Schmidt cho 2 vector — tự suy ra từ cái bóng"
    checks:
      - "(lambda c: sp.solve(sp.Eq((Matrix([2,11]) - c*Matrix([3,4])).dot(Matrix([3,4])), 0), c) == [2])(sp.Symbol('c'))"
      - "Matrix([2,11]).dot(Matrix([3,4])) == 50 and 2*3 + 11*4 == 50 and Matrix([3,4]).dot(Matrix([3,4])) == 25"
      - "Rational(50,25) == 2 and Matrix([2,11]) - 2*Matrix([3,4]) == Matrix([-4,3]) and Matrix([-4,3]).dot(Matrix([3,4])) == 0"
      - "2*Matrix([3,4]) == Matrix([6,8]) and Matrix([-4,3]).norm() == 5"
      - "Matrix([-4,3]) + 2*Matrix([3,4]) == Matrix([2,11])"
    steps:
      - show: |
          <p>Đầu vào: bộ xiên $\ \{\mathbf{x}_1, \mathbf{x}_2\}$. &nbsp; Đầu ra: $\{\mathbf{v}_1, \mathbf{v}_2\}$ vuông góc, rồi $\{\mathbf{u}_1, \mathbf{u}_2\}$ trực chuẩn.</p>
          <p><b>Bước 1.</b> Giữ nguyên vector đầu tiên: $\ \mathbf{v}_1 = \mathbf{x}_1$.</p>
        focus: [0, 1, 1, 2]
        say: "Đây là tiến trình Gram-Schmidt. Đầu vào là bộ xiên x một, x hai. Ta muốn tạo ra hai vector vuông góc v một, v hai, rồi chuẩn hoá thành u một, u hai. Bước một, cần một hướng xuất phát, nên ta giữ nguyên vector đầu tiên, v một bằng x một."
      - show: |
          <div class="row"><div class="col">
          <svg width="520" height="500" viewBox="0 0 480 470">
            <defs>
              <marker id="gB" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#2563eb"/></marker>
              <marker id="gR" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#e11d48"/></marker>
              <marker id="gG" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#059669"/></marker>
              <marker id="gO" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#ea580c"/></marker>
            </defs>
            <line x1="170" y1="460" x2="440" y2="100" stroke="#cbd5e1" stroke-width="3"/>
            <line x1="200" y1="420" x2="380" y2="180" stroke="#059669" stroke-width="9" marker-end="url(#gG)"/>
            <line x1="200" y1="420" x2="290" y2="300" stroke="#2563eb" stroke-width="5" marker-end="url(#gB)"/>
            <line x1="200" y1="420" x2="260" y2="90" stroke="#e11d48" stroke-width="5" marker-end="url(#gR)"/>
            <line x1="380" y1="180" x2="260" y2="90" stroke="#ea580c" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#gO)"/>
            <polyline points="370.4,192.8 357.6,183.2 367.2,170.4" fill="none" stroke="#6b7280" stroke-width="2.5"/>
            <text x="300" y="345" font-size="30" fill="#2563eb" font-weight="700">x₁ = v₁</text>
            <text x="190" y="120" font-size="30" fill="#e11d48" font-weight="700">x₂</text>
            <text x="395" y="225" font-size="26" fill="#059669" font-weight="700">bóng</text>
            <text x="335" y="112" font-size="30" fill="#ea580c" font-weight="700">v₂</text>
          </svg></div>
          <div class="col"><p><b>Bước 2.</b> Trừ đi cái bóng của $\mathbf{x}_2$ trên $\mathbf{v}_1$:</p>
          $$\mathbf{v}_2 = \mathbf{x}_2 - \hlo{c}\,\mathbf{v}_1$$
          <p class="note">Phần còn lại (cam, nét đứt) vuông góc với $\mathbf{v}_1$ — đúng như $\mathbf{z}$ của bài 1.</p></div></div>
        say: "Bước hai, nhìn hình. x hai màu đỏ in một cái bóng màu lục lên đường thẳng chứa v một. Theo bài 1, phần còn lại, mũi tên cam nét đứt, vuông góc với v một. Vì vậy ta lấy v hai bằng x hai trừ c nhân v một, đúng như z bằng y trừ c u."
      - clear: true
        show: |
          <p class="note">Bước 1–2: $\ \mathbf{v}_1 = \mathbf{x}_1, \quad \mathbf{v}_2 = \mathbf{x}_2 - \hlo{c}\,\mathbf{v}_1$</p>
          <p><b>Bước 3.</b> Vì $\mathbf{v}_2 \perp \mathbf{v}_1$: $\ (\mathbf{x}_2 - \hlo{c}\,\mathbf{v}_1)^T\mathbf{v}_1 = 0 \implies \hlo{c} = \dfrac{\mathbf{x}_2^T\mathbf{v}_1}{\mathbf{v}_1^T\mathbf{v}_1}$, &nbsp; tức là $\ \mathbf{v}_2 = \mathbf{x}_2 - \proj_{\mathbf{v}_1}\mathbf{x}_2$</p>
        focus: ["2.3", "2.3", "2.4"]
        say: "Bước ba, vì v hai phải vuông góc với v một, nên tích vô hướng của chúng bằng 0. Phá ngoặc rồi chia, giống hệt bài 1, ta được c bằng x hai nhân v một, chia cho v một nhân v một. Nghĩa là v hai bằng x hai trừ đi hình chiếu của x hai lên v một."
      - clear: true
        show: |
          <p><b>Làm thử ngay:</b> $\ \mathbf{x}_1 = (3, 4)^T,\ \ \mathbf{x}_2 = (2, 11)^T$</p>
          $$\mathbf{v}_1 = (3, 4)^T, \qquad \hlo{c} = \dfrac{\hlb{2\cdot 3 + 11\cdot 4}}{\hl{3^2 + 4^2}} = \dfrac{\hlb{50}}{\hl{25}} = \hlo{2}$$
          <p>$\mathbf{v}_2 = (2, 11)^T - \hlo{2}\,(3, 4)^T = (2 - 6,\ 11 - 8)^T = \hlg{(-4, 3)^T}$</p>
          <p>Kiểm tra: $\ \mathbf{v}_2^T\mathbf{v}_1 = -12 + 12 = 0\ \checkmark$</p>
        focus: [1, 2, 2, 3, 4]
        say: "Làm thử ngay với x một bằng 3, 4 và x hai bằng 2, 11. Theo bước một, v một bằng 3, 4. Thay số vào công thức, tử số bằng 6 cộng 44, bằng 50, mẫu số bằng 25, nên c bằng 2. Vậy v hai bằng 2 trừ 6, 11 trừ 8, tức âm 4, 3. Kiểm tra, tích vô hướng bằng 0."
      - show: |
          <p><b>Bước 4.</b> Chuẩn hoá — chia mỗi vector cho độ dài của nó, $\|\mathbf{v}_1\| = \|\mathbf{v}_2\| = 5$:</p>
          <p>$\mathbf{u}_1 = \dfrac{\mathbf{v}_1}{5} = \left(\dfrac{3}{5}, \dfrac{4}{5}\right)^T, \qquad \mathbf{u}_2 = \dfrac{\mathbf{v}_2}{5} = \left(-\dfrac{4}{5}, \dfrac{3}{5}\right)^T$ &nbsp; <span class="green">— đúng bộ trực chuẩn lúc nãy</span></p>
        focus: [1, 1, 2]
        say: "Bước bốn, chuẩn hoá. Theo định nghĩa, ta chia mỗi vector cho độ dài của nó, cả hai đều dài 5. Ta được u một bằng ba phần năm, bốn phần năm, và u hai bằng âm bốn phần năm, ba phần năm, chính là bộ trực chuẩn ta dùng lúc nãy."
      - show: |
          <p class="note">Vì sao vẫn là cơ sở của cùng $\mathbb{R}^2$? Chuyển vế bước 2: $\ \mathbf{x}_2 = \mathbf{v}_2 + 2\,\mathbf{v}_1 = (-4 + 6,\ 3 + 8)^T = (2, 11)^T$ — vector cũ vẫn là tổ hợp của vector mới, không mất hướng nào.</p>
        say: "Còn một câu hỏi, bộ mới có thay được bộ cũ không? Có, vì chuyển vế bước hai, ta được x hai bằng v hai cộng 2 v một. Vậy vector cũ vẫn là tổ hợp của vector mới, không có hướng nào bị mất."

  # ───────────────────────── 7. GRAM-SCHMIDT TỔNG QUÁT ─────────────────────────
  - id: gsk
    kind: formula
    title: "Vector thứ ba trở đi: trừ đi MỌI cái bóng"
    checks:
      - "(lambda x3, v1, v2: sp.expand((x3 - x3.dot(v1)/v1.dot(v1)*v1 - x3.dot(v2)/v2.dot(v2)*v2).dot(v1)) == 0)(Matrix(sp.symbols('a b c')), Matrix([1,2,2]), Matrix([2,1,-2]))"
      - "(lambda x3, v1, v2: sp.expand((x3 - x3.dot(v1)/v1.dot(v1)*v1 - x3.dot(v2)/v2.dot(v2)*v2).dot(v2)) == 0)(Matrix(sp.symbols('a b c')), Matrix([1,2,2]), Matrix([2,1,-2]))"
      - "Matrix([1,2,2]).dot(Matrix([2,1,-2])) == 0"
    steps:
      - show: |
          <p><b>Vector thứ ba:</b> trừ đi cái bóng trên <b>từng</b> hướng đã có:</p>
          $$\mathbf{v}_3 = \mathbf{x}_3 - \proj_{\mathbf{v}_1}\mathbf{x}_3 - \proj_{\mathbf{v}_2}\mathbf{x}_3 = \mathbf{x}_3 - \hlo{c_1}\,\mathbf{v}_1 - \hlo{c_2}\,\mathbf{v}_2, \qquad \hlo{c_1} = \frac{\mathbf{x}_3^T\mathbf{v}_1}{\mathbf{v}_1^T\mathbf{v}_1},\ \ \hlo{c_2} = \frac{\mathbf{x}_3^T\mathbf{v}_2}{\mathbf{v}_2^T\mathbf{v}_2}$$
        focus: [1, 2, 2]
        say: "Với vector thứ ba, ý tưởng y hệt. v ba phải vuông góc với cả v một lẫn v hai, nên ta lấy x ba trừ đi cái bóng của nó trên v một, rồi trừ tiếp cái bóng trên v hai. Mỗi hệ số c tính theo đúng công thức cái bóng của bài 1, tức tích vô hướng chia cho độ dài bình phương."
      - show: |
          <p><b>Vì sao $\mathbf{v}_3 \perp \mathbf{v}_1$?</b> Nhân vô hướng với $\mathbf{v}_1$, phá ngoặc:</p>
          $$\mathbf{v}_3^T\mathbf{v}_1 = \mathbf{x}_3^T\mathbf{v}_1 - \underbrace{\hlo{c_1}\,\mathbf{v}_1^T\mathbf{v}_1}_{=\ \mathbf{x}_3^T\mathbf{v}_1} - \hlo{c_2}\,\underbrace{\mathbf{v}_2^T\mathbf{v}_1}_{=\,0} = 0$$
          <p class="note">Mấu chốt: $\mathbf{v}_2^T\mathbf{v}_1 = 0$ vì $\mathbf{v}_1, \mathbf{v}_2$ đã vuông góc. Tương tự cho $\mathbf{v}_3 \perp \mathbf{v}_2$.</p>
        focus: [1, 2, 2, "3.1", "3.3"]
        say: "Vì sao v ba vuông góc với v một? Nhân vô hướng v ba với v một rồi phá ngoặc. Theo cách chọn c một, số hạng thứ hai đúng bằng x ba nhân v một, nên triệt tiêu số hạng đầu. Số hạng cuối bằng 0, vì v hai và v một đã vuông góc. Tương tự cho v hai."
      - clear: true
        show: |
          <div class="box key">Tổng quát, với $k = 2, 3, \dots, p$:
          $$\mathbf{v}_1 = \mathbf{x}_1, \qquad \mathbf{v}_k = \mathbf{x}_k - \sum_{j=1}^{k-1} \frac{\hlb{\mathbf{x}_k^T\mathbf{v}_j}}{\hl{\|\mathbf{v}_j\|^2}}\,\mathbf{v}_j, \qquad \mathbf{u}_i = \frac{\mathbf{v}_i}{\|\mathbf{v}_i\|}$$</div>
          <p class="note">$\sum_{j=1}^{k-1}$: cộng dồn cái bóng trên <b>mọi</b> $\mathbf{v}_j$ đứng trước $\mathbf{v}_k$. Mẫu số $\|\mathbf{v}_j\|^2 = \mathbf{v}_j^T\mathbf{v}_j$ (bài 1).</p>
        focus: [1, 2, 2]
        say: "Đây là công thức tổng quát, với k chạy từ 2 đến p. Theo bài 1, dấu tổng là cái máy cộng dồn, ở đây nó cộng dồn cái bóng của x k trên mọi v j đứng trước, j chạy từ 1 đến k trừ 1. Mẫu số là độ dài bình phương của v j."
      - show: |
          <p class="note">Nhiều sách viết tích vô hướng bằng ngoặc nhọn: $\ \langle \mathbf{x}_k, \mathbf{v}_j \rangle = \mathbf{x}_k^T\mathbf{v}_j$ — hai cách viết, một nghĩa.</p>
        notation_note: true
        introduces: [dotprod]
        say: "Nhiều sách viết tích vô hướng ở tử số bằng cặp ngoặc nhọn, đọc là tích vô hướng của x k và v j. Nghĩa là nó chính là x k chuyển vị nhân v j, chỉ là hai cách viết của cùng một phép tính."

  # ───────────────────────── 8. VÍ DỤ 3 CHIỀU ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ từng bước: Gram-Schmidt cho 3 vector trong ℝ³"
    checks:
      - "Matrix([1,2,2]).dot(Matrix([1,2,2])) == 9 and 1 + 4 + 4 == 9"
      - "Matrix([3,3,0]).dot(Matrix([1,2,2])) == 9 and 3 + 6 + 0 == 9 and Matrix([3,3,0]) - Matrix([1,2,2]) == Matrix([2,1,-2])"
      - "Matrix([2,1,-2]).dot(Matrix([1,2,2])) == 0 and 2 + 2 - 4 == 0"
      - "Matrix([6,3,3]).dot(Matrix([1,2,2])) == 18 and 6 + 6 + 6 == 18 and Rational(18,9) == 2"
      - "Matrix([6,3,3]).dot(Matrix([2,1,-2])) == 9 and 12 + 3 - 6 == 9 and Matrix([2,1,-2]).dot(Matrix([2,1,-2])) == 9 and 4 + 1 + 4 == 9"
      - "Matrix([6,3,3]) - 2*Matrix([1,2,2]) - 1*Matrix([2,1,-2]) == Matrix([2,-2,1]) and (6-2-2, 3-4-1, 3-4+2) == (2,-2,1)"
      - "all(v.norm() == 3 for v in (Matrix([1,2,2]), Matrix([2,1,-2]), Matrix([2,-2,1])))"
    steps:
      - show: |
          <p>Đề: $\ \mathbf{x}_1 = (1, 2, 2)^T,\ \ \mathbf{x}_2 = (3, 3, 0)^T,\ \ \mathbf{x}_3 = (6, 3, 3)^T$. Tìm bộ trực chuẩn $\{\mathbf{u}_1, \mathbf{u}_2, \mathbf{u}_3\}$.</p>
          <p><b>①</b> $\mathbf{v}_1 = \mathbf{x}_1 = (1, 2, 2)^T, \qquad \|\mathbf{v}_1\|^2 = 1 + 4 + 4 = \hl{9}$</p>
        focus: [1, 2, 2]
        say: "Giờ làm một ví dụ trọn vẹn trong R ba, với ba vector x một bằng 1, 2, 2, x hai bằng 3, 3, 0, và x ba bằng 6, 3, 3. Bước một, giữ nguyên v một bằng x một. Độ dài bình phương của v một bằng 1 cộng 4 cộng 4, bằng 9."
      - show: |
          <p><b>②</b> $$\mathbf{x}_2^T\mathbf{v}_1 = 3 + 6 + 0 = \hlb{9}, \quad \hlo{c} = \dfrac{\hlb{9}}{\hl{9}} = \hlo{1}, \quad \mathbf{v}_2 = (3, 3, 0)^T - (1, 2, 2)^T = \hlg{(2, 1, -2)^T}$$</p>
          <p class="note">Thử nhanh: $\ \mathbf{v}_2^T\mathbf{v}_1 = 2 + 2 - 4 = 0\ \checkmark$</p>
        focus: [1, 1, 1, 2]
        say: "Bước hai, x hai nhân v một bằng 3 cộng 6 cộng 0, bằng 9. Chia cho 9 được c bằng 1. Vậy v hai bằng 3, 3, 0 trừ 1, 2, 2, tức là 2, 1, âm 2. Thử nhanh, v hai nhân v một bằng 2 cộng 2 trừ 4, bằng 0."
      - clear: true
        show: |
          <p class="note">Đã có: $\ \mathbf{v}_1 = (1, 2, 2)^T,\ \ \mathbf{v}_2 = (2, 1, -2)^T$ &nbsp; (đều có độ dài bình phương $9$), &nbsp; $\mathbf{x}_3 = (6, 3, 3)^T$</p>
          <p><b>③</b> $\hlo{c_1} = \dfrac{\mathbf{x}_3^T\mathbf{v}_1}{9} = \dfrac{6 + 6 + 6}{9} = \hlo{2}, \qquad \hlo{c_2} = \dfrac{\mathbf{x}_3^T\mathbf{v}_2}{9} = \dfrac{12 + 3 - 6}{9} = \hlo{1}$</p>
        focus: [2, 2, 2, 2]
        say: "Bước ba, tính hai cái bóng của x ba. x ba nhân v một bằng 6 cộng 6 cộng 6, bằng 18, chia 9 được c một bằng 2. x ba nhân v hai bằng 12 cộng 3 trừ 6, bằng 9. Độ dài bình phương của v hai cũng là 9, nên c hai bằng 1."
      - show: |
          $$\mathbf{v}_3 = (6, 3, 3)^T - \hlo{2}\,(1, 2, 2)^T - \hlo{1}\,(2, 1, -2)^T = (6 - 2 - 2,\ 3 - 4 - 1,\ 3 - 4 + 2)^T = \hlg{(2, -2, 1)^T}$$
        say: "Trừ cả hai cái bóng, v ba bằng 6, 3, 3, trừ 2 nhân 1, 2, 2, trừ 1 nhân 2, 1, âm 2. Tính từng vị trí, được 2, âm 2, 1."
      - clear: true
        show: |
          <p><b>④</b> Chuẩn hoá: $\ \|\mathbf{v}_1\| = \|\mathbf{v}_2\| = \|\mathbf{v}_3\| = \sqrt{9} = 3$</p>
          $$\mathbf{u}_1 = \frac{1}{3}\,(1, 2, 2)^T, \qquad \mathbf{u}_2 = \frac{1}{3}\,(2, 1, -2)^T, \qquad \mathbf{u}_3 = \frac{1}{3}\,(2, -2, 1)^T$$
        focus: [1, 1, 2]
        say: "Bước bốn, chuẩn hoá. Ba vector v đều có độ dài bình phương bằng 9, nên đều dài căn 9, bằng 3. Chia mỗi vector cho 3, ta được bộ trực chuẩn u một, u hai, u ba."

  # ───────────────────────── 9. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: từng cặp vuông góc, và Qᵀ Q = I"
    checks:
      - "Matrix([1,2,2]).dot(Matrix([2,-2,1])) == 0 and 2 - 4 + 2 == 0 and Matrix([2,1,-2]).dot(Matrix([2,-2,1])) == 0 and 4 - 2 - 2 == 0"
      - "Matrix([[Rational(3,5), Rational(-4,5)], [Rational(4,5), Rational(3,5)]]) == Matrix.hstack(Matrix([3,4])/5, Matrix([-4,3])/5)"
      - "(lambda Q: Q.T*Q == sp.eye(2) and Q*Q.T == sp.eye(2) and Q.inv() == Q.T)(Matrix([[Rational(3,5), Rational(-4,5)], [Rational(4,5), Rational(3,5)]]))"
      - "Rational(9,25) + Rational(16,25) == 1 and Rational(-12,25) + Rational(12,25) == 0"
      - "Rational(1,5)*Matrix([[3,-4],[4,3]]) == Matrix.hstack(Matrix([3,4])/5, Matrix([-4,3])/5) and (Rational(1,5)*Matrix([[3,-4],[4,3]])).T*(Rational(1,5)*Matrix([[3,-4],[4,3]])) == Rational(1,25)*Matrix([[9+16, -12+12], [-12+12, 16+9]])"
      - "Matrix([[Rational(3,5), Rational(4,5)], [Rational(-4,5), Rational(3,5)]])*Matrix([5,10]) == Matrix([11,2])"
      - "(lambda Q: Q.T*Q == sp.eye(3))(Matrix.hstack(Matrix([1,2,2]), Matrix([2,1,-2]), Matrix([2,-2,1]))/3)"
    steps:
      - show: |
          <p><b>Phép thử 1 — từng cặp vuông góc</b> (theo định nghĩa trực giao):</p>
          <p>$\mathbf{v}_1^T\mathbf{v}_2 = 0$ (đã thử), &nbsp; $\mathbf{v}_1^T\mathbf{v}_3 = 2 - 4 + 2 = 0\ \checkmark$, &nbsp; $\mathbf{v}_2^T\mathbf{v}_3 = 4 - 2 - 2 = 0\ \checkmark$</p>
        focus: [0, 1, "2.2", "2.3"]
        say: "Như mọi bài, ta tự kiểm tra. Phép thử một, theo định nghĩa trực giao, mọi cặp phải vuông góc. v một nhân v ba bằng 2 trừ 4 cộng 2, bằng 0. v hai nhân v ba bằng 4 trừ 2 trừ 2, bằng 0, đạt cả hai."
      - clear: true
        show: |
          <p><b>Phép thử 2 — xếp các $\mathbf{u}$ thành cột của ma trận $\mathbf{Q}$</b> (ví dụ $\mathbb{R}^2$: $\mathbf{u}_1 = (\frac{3}{5}, \frac{4}{5})^T,\ \mathbf{u}_2 = (-\frac{4}{5}, \frac{3}{5})^T$):</p>
          $$\mathbf{Q} = \begin{bmatrix} \mathbf{u}_1 & \mathbf{u}_2 \end{bmatrix} = \frac{1}{5}\begin{bmatrix} 3 & -4 \\ 4 & 3 \end{bmatrix}, \qquad \mathbf{Q}^T\mathbf{Q} = \begin{bmatrix} \mathbf{u}_1^T\mathbf{u}_1 & \mathbf{u}_1^T\mathbf{u}_2 \\ \mathbf{u}_2^T\mathbf{u}_1 & \mathbf{u}_2^T\mathbf{u}_2 \end{bmatrix}$$
          <p class="note">Vì chuyển vị biến cột $\mathbf{u}_i$ thành hàng $i$ của $\mathbf{Q}^T$, nên ô hàng $i$, cột $j$ = hàng nhân cột = $\mathbf{u}_i^T\mathbf{u}_j$.</p>
        focus: [1, 2, 3]
        say: "Phép thử hai gọn hơn. Xếp các vector u thành các cột của một ma trận Q, ví dụ với hai vector u của R hai. Vì chuyển vị biến cột u i thành hàng i của Q chuyển vị, nên ô hàng i, cột j của Q chuyển vị nhân Q chính là u i nhân u j."
      - show: |
          $$\mathbf{Q}^T\mathbf{Q} = \frac{1}{25}\begin{bmatrix} 9 + 16 & -12 + 12 \\ -12 + 12 & 16 + 9 \end{bmatrix} =\begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix} = \mathbf{I}_2\ \checkmark$$
          <div class="box key">Bộ $p$ cột trực chuẩn $\iff \mathbf{Q}^T\mathbf{Q} = \mathbf{I}_p$ &nbsp; (số 1 trên đường chéo = dài 1, số 0 ngoài đường chéo = vuông góc)</div>
        focus: [1, 1, 1, 2, 2]
        say: "Thay số, hai ô trên đường chéo bằng chín phần hai lăm cộng mười sáu phần hai lăm, bằng 1. Hai ô còn lại bằng 0. Vậy Q chuyển vị nhân Q bằng I hai. Tổng quát, Q có p cột trực chuẩn khi và chỉ khi Q chuyển vị nhân Q bằng I p. Nên một phép nhân kiểm tra được cả độ dài lẫn vuông góc."
      - clear: true
        show: |
          <p>$\mathbf{Q}$ <b>vuông</b>, cột trực chuẩn: tính thêm được $\ \mathbf{Q}\mathbf{Q}^T = \mathbf{I}_2$, nên theo định nghĩa nghịch đảo ở bài 2 (ma trận nhân vào thì ra $\mathbf{I}$):</p>
          <div class="box key">$$\mathbf{Q}^{-1} = \mathbf{Q}^T$$</div>
          <p class="note">Nghịch đảo có sẵn, chỉ cần chuyển vị. Dùng ngay: $\ \mathbf{Q}^T(5, 10)^T = (\hlg{11}, \hlg{2})^T$ — đúng toạ độ $\hlo{c_1}, \hlo{c_2}$ lúc nãy. Với 3 vector ở ví dụ, $\mathbf{Q}^T\mathbf{Q} = \mathbf{I}_3$ cũng đúng.</p>
        focus: [1, 1, 2, 3]
        say: "Với Q vuông, nhân theo thứ tự ngược lại, Q nhân Q chuyển vị, cũng ra I hai. Theo bài 2, nghịch đảo là ma trận nhân vào thì ra ma trận đơn vị. Q chuyển vị làm đúng việc đó, nên Q nghịch đảo chính là Q chuyển vị. Và Q chuyển vị nhân 5, 10 cho ra 11, 2, đúng hai toạ độ lúc nãy."
      - show: |
          <p class="note">Tên gọi dễ nhầm: sách gọi $\mathbf{Q}$ như vậy là <b>ma trận trực giao</b>, dù các cột của nó <b>trực chuẩn</b> (dài 1).</p>
        say: "Lưu ý tên gọi dễ nhầm, vì sách gọi ma trận Q này là ma trận trực giao, dù các cột của nó còn dài đúng 1."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "Matrix([[3,-4],[4,3]]).T*Matrix([[3,-4],[4,3]]) == Matrix([[25,0],[0,25]]) and Matrix([[25,0],[0,25]]) != sp.eye(2)"
      - "Rational(Matrix([6,3,3]).dot(Matrix([3,3,0])), Matrix([3,3,0]).dot(Matrix([3,3,0]))) == Rational(3,2) and 18 + 9 + 0 == 27"
      - "(lambda w: w == Matrix([Rational(-1,2), Rational(-11,2), -1]) and w.dot(Matrix([2,1,-2])) == Rational(-9,2))(Matrix([6,3,3]) - 2*Matrix([1,2,2]) - Rational(3,2)*Matrix([3,3,0]))"
      - "Matrix([2,11]) - 10*Matrix([3,4]) == Matrix([-28,-29]) and Matrix([-28,-29]).dot(Matrix([3,4])) == -200 and Rational(50,5) == 10"
      - "Matrix([6,8]) == 2*Matrix([3,4]) and Matrix([6,8]) - Rational(Matrix([6,8]).dot(Matrix([3,4])), 25)*Matrix([3,4]) == Matrix([0,0])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1</b> (hay gặp nhất). Dừng ở $\{\mathbf{v}_1, \mathbf{v}_2\}$, <b>quên chuẩn hoá</b> <b class="red">(sai)</b>:
          $$\mathbf{V} = \begin{bmatrix} 3 & -4 \\ 4 & 3 \end{bmatrix}, \qquad \mathbf{V}^T\mathbf{V} = \begin{bmatrix} 25 & 0 \\ 0 & 25 \end{bmatrix} \neq \mathbf{I}_2$$
          <br><span class="note">Bộ này mới <b>trực giao</b>, chưa <b>trực chuẩn</b>. Phép thử 2 bắt được: đường chéo phải là 1.</span></div>
        say: "Lỗi thứ nhất, cũng là lỗi hay gặp nhất, là tính xong các vector v rồi dừng, quên chuẩn hoá. Khi đó V chuyển vị nhân V có số 25 trên đường chéo, không phải ma trận đơn vị. Bộ này mới trực giao, chưa trực chuẩn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chiếu lên $\mathbf{x}_2$ thay vì $\mathbf{v}_2$: $\ \hlo{c_2} = \dfrac{\mathbf{x}_3^T\mathbf{x}_2}{\mathbf{x}_2^T\mathbf{x}_2} = \dfrac{27}{18} = \dfrac{3}{2}$, ra $\ \mathbf{v}_3 = \left(-\dfrac{1}{2}, -\dfrac{11}{2}, -1\right)^T$ <b class="red">(sai)</b>
          <br><span class="note">Phép thử 1 bắt được: $\ \mathbf{v}_3^T\mathbf{v}_2 = -\dfrac{9}{2} \neq 0$. Luôn chiếu lên các $\mathbf{v}$ đã vuông góc.</span></div>
        say: "Lỗi thứ hai, khi tính v ba lại chiếu lên x hai, thay vì v hai. Ở ví dụ, hệ số thành ba phần hai, và v ba không còn vuông góc với v hai. Phép thử một bắt được ngay."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chiếu mà chia cho $\|\mathbf{v}_1\| = 5$ thay vì $\|\mathbf{v}_1\|^2 = 25$: $\ \hlo{c} = \dfrac{50}{5} = 10$, ra $\ \mathbf{v}_2 = (-28, -29)^T$ <b class="red">(sai)</b>, &nbsp; $\mathbf{v}_2^T\mathbf{v}_1 = -200 \neq 0$
          <br><span class="note">Mẹo nhớ: <b>chiếu</b> chia cho độ dài <b>bình phương</b>; <b>chuẩn hoá</b> chia cho độ dài.</span></div>
        say: "Lỗi thứ ba, lẫn hai phép chia. Khi chiếu lại chia cho độ dài 5, thay vì độ dài bình phương 25, nên c thành 10, và v hai không vuông góc với v một. Mẹo nhớ, phép chiếu chia cho độ dài bình phương, còn chuẩn hoá chỉ chia cho độ dài."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đầu vào <b>không độc lập tuyến tính</b>, chuẩn hoá phải chia cho 0 <b class="red">(sai)</b>:
          $$\mathbf{x}_2 = (6, 8)^T = 2\,\mathbf{x}_1 \implies \mathbf{v}_2 = (6, 8)^T - \frac{50}{25}\,(3, 4)^T = \mathbf{0}$$
          <br><span class="note">Gặp $\mathbf{v}_k = \mathbf{0}$ nghĩa là $\mathbf{x}_k$ không thêm hướng mới: bỏ nó đi. Công thức tổng quát ngầm giả sử các vector đầu vào là một cơ sở.</span></div>
        say: "Lỗi thứ tư, đưa vào một bộ không độc lập tuyến tính, ví dụ x hai bằng 6, 8, gấp đôi x một. Khi đó v hai ra vector không, và bước chuẩn hoá phải chia cho 0. Gặp v k bằng vector không, nghĩa là x k không thêm hướng mới, nên bỏ nó đi."

  # ───────────────────────── 11. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: Gram-Schmidt cho x₁ = (1, 1)ᵀ, x₂ = (3, 1)ᵀ"
    checks:
      - "Matrix([3,1]).dot(Matrix([1,1])) == 4 and Matrix([1,1]).dot(Matrix([1,1])) == 2 and Rational(4,2) == 2"
      - "Matrix([3,1]) - 2*Matrix([1,1]) == Matrix([1,-1]) and Matrix([1,-1]).dot(Matrix([1,1])) == 0"
      - "Matrix([1,1]).norm() == sqrt(2) and Matrix([1,-1]).norm() == sqrt(2)"
      - "(Matrix([1,1])/sqrt(2)).dot(Matrix([1,1])/sqrt(2)) == 1 and Rational(1,2) + Rational(1,2) == 1"
    steps:
      - show: |
          <p class="big">$\mathbf{x}_1 = (1, 1)^T,\quad \mathbf{x}_2 = (3, 1)^T$</p>
          <p>Chạy Gram-Schmidt, chuẩn hoá, rồi chạy phép thử.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, cho x một bằng 1, 1 và x hai bằng 3, 1. Hãy chạy Gram-Schmidt để ra hai vector vuông góc, chuẩn hoá chúng, rồi chạy phép thử. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\mathbf{v}_1 = (1, 1)^T$, &nbsp; $\hlo{c} = \dfrac{3 + 1}{1 + 1} = \hlo{2}$, &nbsp; $\mathbf{v}_2 = (3 - 2,\ 1 - 2)^T = \hlg{(1, -1)^T}$, &nbsp; thử: $1 - 1 = 0\ \checkmark$</p>
        say: "Đáp án như sau, v một bằng 1, 1. Hệ số c bằng 3 cộng 1, chia cho 1 cộng 1, bằng 2. Vậy v hai bằng 3 trừ 2, 1 trừ 2, tức là 1, âm 1. Thử, tích vô hướng bằng 1 trừ 1, bằng 0."
      - show: |
          <p>② $\|\mathbf{v}_1\| = \|\mathbf{v}_2\| = \sqrt{2}$: &nbsp; $\mathbf{u}_1 = \dfrac{1}{\sqrt{2}}\,(1, 1)^T, \quad \mathbf{u}_2 = \dfrac{1}{\sqrt{2}}\,(1, -1)^T$</p>
          <p>Thử: $\ \|\mathbf{u}_1\|^2 = \dfrac{1}{2} + \dfrac{1}{2} = 1\ \checkmark$</p>
        focus: ["1.1", 2, 0]
        say: "Chuẩn hoá, cả hai vector đều dài căn 2, nên chia mỗi vector cho căn 2. Thử, độ dài bình phương của u một bằng một phần hai cộng một phần hai, bằng 1. Ra đúng là bạn đã nắm được Gram-Schmidt."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">Cơ sở: mọi vector viết được đúng một cách</span><span class="a">→</span>
          <span class="n">Trực chuẩn: $\mathbf{u}_i^T\mathbf{u}_j = 0$ hoặc $1$</span><span class="a">→</span>
          <span class="n">toạ độ $= \mathbf{y}^T\mathbf{u}_i$</span><span class="a">→</span>
          <span class="n">$\mathbf{v}_k = \mathbf{x}_k -$ mọi cái bóng</span><span class="a">→</span>
          <span class="n">$\mathbf{u}_i = \mathbf{v}_i / \|\mathbf{v}_i\|$</span><span class="a">→</span>
          <span class="n">$\mathbf{Q}^T\mathbf{Q} = \mathbf{I}_p$</span></div>
        say: "Tổng kết chuỗi logic. Cơ sở là bộ vector mà mọi vector viết được thành tổ hợp theo đúng một cách. Với cơ sở trực chuẩn, toạ độ chỉ là tích vô hướng. Gram-Schmidt tạo ra bộ đó, trừ đi mọi cái bóng, rồi chia độ dài. Và phép thử là Q chuyển vị nhân Q bằng I."
      - show: |
          <div class="box key"><b>Tư duy:</b> Gram-Schmidt không phải công thức mới để học thuộc. Nó là <b>“trừ đi cái bóng”</b> của bài 1, lặp lại cho từng vector, rồi chia độ dài. Điều kiện cần nhớ: <b>mỗi $\mathbf{v}$ mới vuông góc với mọi $\mathbf{v}$ trước nó</b>.</div>
        say: "Điều cần mang theo là cách tư duy. Gram-Schmidt không phải công thức mới. Nó chỉ là việc trừ đi cái bóng của bài 1, lặp lại cho từng vector. Điều kiện duy nhất là mỗi vector mới vuông góc với mọi vector trước nó."
      - clear: true
        show: |
          <p class="note">Gặp lại ở bài 16 (SVD — cách tách một ma trận thành tích của ba ma trận đơn giản): hai ma trận $\mathbf{U}, \mathbf{V}$ trong đó đều là loại $\mathbf{Q}$ có $\mathbf{Q}^T\mathbf{Q} = \mathbf{I}_p$.</p>
          <p class="note">Bài sau: <b>trị riêng &amp; vector riêng</b> — những hướng mà một ma trận chỉ kéo giãn, vẫn nằm trên cùng đường thẳng.</p>
        focus: [1, 2, 0]
        say: "Bạn sẽ gặp lại loại ma trận Q này ở bài 16, khi học SVD, một cách tách một ma trận thành tích của ba ma trận đơn giản. Bài sau học trị riêng và vector riêng, những hướng mà một ma trận chỉ kéo giãn. Hẹn gặp bạn ở bài tiếp theo."
        forward_ref: true
