id: L36
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 36 (mở rộng) — Boosting: AdaBoost & gradient boosting (so với rừng ngẫu nhiên)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "0 kết quả trong nguồn môn học; CITED: Freund & Schapire, J. Computer and System Sciences 55(1) (1997) 119–139, doi:10.1006/jcss.1997.1504 (truy cập 2026-10-24, no revision given); CITED: J. H. Friedman, “Greedy function approximation: A gradient boosting machine”, Annals of Statistics 29(5) (2001) 1189–1232 (gradient boosting: khớp gradient âm, hệ số co η)"
assumes: [cdot, sub, sum, log, exp, approx, geq, neq, eta, hat, partial, power, vec]
# Quy ước ký hiệu: mô hình yếu thứ m là hₘ (ví dụ cây một tầng); trọng số mẫu wᵢ (không in đậm — khác vector trọng số bài 18–25);
#   sai số có trọng số ε (ép-xi-lôn — ở bài 20, 23 là số rất nhỏ; nói ở notation_note); trọng số mô hình αₘ; tốc độ học η như bài 9.
# Lời đọc: “AdaBoost” đọc “A-đa-bút” (CHƯA probe → ASR toàn bài, B55); “boosting” nói “tăng cường”; “gradient” theo lexicon.
# Nối bài trước (nói lại khi dùng, luật 17): bài 9 (đi ngược gradient), bài 12 (ln, e mũ), bài 18 (phần dư y − ŷ, MSE), bài 19 (chọn
#   số vòng bằng kiểm định), bài 28 (cây quyết định, rừng ngẫu nhiên: nhiều cây độc lập bầu chọn).
objectives:
  - "Hiểu ý tưởng tăng cường: ghép nối tiếp các mô hình yếu, mô hình sau sửa lỗi mô hình trước"
  - "Tính trọng số mô hình và cập nhật trọng số mẫu của AdaBoost"
  - "Thấy gradient boosting là gradient descent trong “không gian hàm”: cây mới khớp phần dư"
  - "So sánh với rừng ngẫu nhiên; biết chọn số vòng bằng kiểm định"
