scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nhiều người học kém, nối tiếp nhau sửa sai"
    steps:
      - show: |
          <p class="big">Rừng ngẫu nhiên (bài 28): nhiều cây <b>độc lập</b>, bầu chọn. Tăng cường (boosting): các mô hình yếu học <b>nối tiếp</b> — mô hình sau tập trung vào chỗ mô hình trước làm sai.</p>
          <div class="box key">Hôm nay: AdaBoost (Freund &amp; Schapire, 1997) — tăng trọng số mẫu bị sai; và gradient boosting — mỗi cây mới khớp phần còn thiếu.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, rừng ngẫu nhiên ở bài 28 trồng nhiều cây độc lập rồi bầu chọn. Phương pháp tăng cường thì khác, các mô hình yếu học nối tiếp nhau, mô hình sau tập trung vào chỗ mô hình trước làm sai. Hôm nay ta học hai cách, AdaBoost và tăng cường theo gradient."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: phần dư và đi ngược gradient"
    steps:
      - show: |
          <p>Bài 18: phần dư $r = y - \hat{y}$ — còn thiếu bao nhiêu để đúng. Bài 9: muốn giảm sai số, đi một bước ngược hướng gradient, nhân tốc độ học $\eta$.</p>
          $$y = 10,\ \ \hat{y} = 4: \qquad r = 10 - 4 = 6$$
          <p>Bài 28: cây một tầng (một câu hỏi) là mô hình rất yếu — chỉ hơn đoán bừa một chút.</p>
        focus: ["1.1", 2, 1, 3]
        say: "Nhắc lại bài 18, phần dư là nhãn trừ dự đoán, còn thiếu bao nhiêu để đúng. Ví dụ nhãn 10 mà đoán 4 thì phần dư bằng 6. Bài 9, muốn giảm sai số thì đi một bước ngược hướng gradient. Bài 28, cây một tầng chỉ hỏi một câu, là mô hình rất yếu."

  # ───────────────────────── 3. ADABOOST ─────────────────────────
  - id: sym_ada
    kind: symbol
    title: "Giải mã: AdaBoost — α = ½·ln((1 − ε)/ε)"
    checks:
      - "round(0.5*math.log((1 - 0.2)/0.2), 4) == round(math.log(2), 4) and 0.5*math.log((1 - 0.5)/0.5) == 0 and 0.5*math.log((1 - 0.6)/0.6) < 0"
    steps:
      - show: |
          <p>Mỗi mẫu có trọng số $w_i$ (ban đầu bằng nhau). Mô hình yếu $h_m$ có sai số có trọng số $\varepsilon$ = tổng trọng số các mẫu nó đoán sai.</p>
          <div class="box key">Trọng số của mô hình: $\ \alpha_m = \dfrac{1}{2}\ln\dfrac{1 - \varepsilon}{\varepsilon}$ &nbsp; — dương khi $\varepsilon < \frac{1}{2}$, bằng 0 khi $\varepsilon = \frac{1}{2}$ (đoán bừa)</div>
          <p>Ví dụ $\varepsilon = 0{,}2$: $\ \alpha = \frac{1}{2}\ln 4 = \ln 2 \approx \hlg{0{,}693}$</p>
          <p class="note">$\varepsilon$ ở đây là sai số có trọng số, không phải “số rất nhỏ” của bài 20, 23. Chữ $\alpha$ cũng khác nhân tử của bài 24, 25.</p>
        introduces: [epsilon, alpha]
        notation_note: true
        focus: ["1.1", 1, 2, 3]
        say: "Mỗi mẫu có một trọng số, ban đầu bằng nhau. Mô hình yếu có sai số ép-xi-lôn bằng tổng trọng số các mẫu nó đoán sai. Trọng số của mô hình là một nửa lôgarit của 1 trừ ép-xi-lôn chia ép-xi-lôn, dương khi sai số dưới một nửa. Ví dụ sai số 0 phẩy 2 cho an-pha bằng lôgarit của 2."

  # ───────────────────────── 4. CẬP NHẬT TRỌNG SỐ MẪU ─────────────────────────
  - id: reweight
    kind: example
    title: "Ví dụ: mẫu bị sai được tăng trọng số"
    checks:
      - "(lambda a: (round(math.exp(a), 6), round(math.exp(-a), 6)))(math.log(2)) == (2.0, 0.5) and (lambda wr, wc: (round(wr/(2*wr + 8*wc), 4), round(wc/(2*wr + 8*wc), 4), round(2*wr/(2*wr + 8*wc), 4)))(0.1*2, 0.1*0.5) == (0.25, 0.0625, 0.5)"
    steps:
      - show: |
          <p>10 mẫu, mỗi mẫu $w_i = 0{,}1$; mô hình đầu sai 2 mẫu → $\varepsilon = 0{,}2$, $\alpha = \ln 2$.</p>
          <p>Cập nhật: mẫu sai nhân $e^{\alpha} = 2$, mẫu đúng nhân $e^{-\alpha} = 0{,}5$, rồi chia tổng cho cộng lại bằng 1:</p>
          <table class="t"><tr><th></th><th>trước</th><th>sau</th></tr>
          <tr><td>mỗi mẫu bị sai (2 mẫu)</td><td>0,1</td><td>$\hlg{0{,}25}$</td></tr>
          <tr><td>mỗi mẫu đúng (8 mẫu)</td><td>0,1</td><td>0,0625</td></tr></table>
          <p class="note">Tổng trọng số các mẫu bị sai thành đúng $0{,}5$: với mô hình cũ, dữ liệu mới giống như đoán bừa — mô hình tiếp theo buộc phải học điều khác.</p>
        focus: [1, 2, "3.2", 4]
        say: "Ví dụ 10 mẫu, mô hình đầu sai 2 mẫu. Mẫu sai được nhân trọng số với 2, mẫu đúng nhân với một nửa, rồi chia cho tổng. Mỗi mẫu sai tăng lên 0 phẩy 25. Tổng trọng số các mẫu sai thành đúng một nửa, nên mô hình tiếp theo buộc phải học điều khác."
      - show: |
          <div class="box key">Dự đoán cuối: $\ \operatorname{sign}\Big(\sum_m \alpha_m h_m(\mathbf{x})\Big)$ — bầu chọn <b>có trọng số</b>, mô hình tốt được nói to hơn (nhãn $\pm 1$ như bài 25).</div>
        introduces: [sign_fn]
        say: "Dự đoán cuối cùng là bầu chọn có trọng số, mô hình tốt hơn được nói to hơn, rồi lấy dấu, với nhãn âm 1 và 1 như bài 25."

  # ───────────────────────── 5. GRADIENT BOOSTING ─────────────────────────
  - id: gradboost
    kind: formula
    title: "Gradient boosting: mỗi cây mới khớp phần dư"
    checks:
      - "(lambda y, yh: sp.diff(Rational(1, 2)*(y - yh)**2, yh) == -(y - yh) and sp.expand(sp.diff((y - yh)**2, yh) + 2*(y - yh)) == 0)(*sp.symbols('y yh'))"
    steps:
      - show: |
          <p>Sai số $\ \frac{1}{2}(y - \hat{y})^2$; đạo hàm theo dự đoán: $\ \dfrac{\partial}{\partial\hat{y}}\Big[\frac{1}{2}(y - \hat{y})^2\Big] = -(y - \hat{y})$</p>
          <div class="box key">Gradient âm = phần dư $\ r = y - \hat{y}$ &nbsp; ⟹ &nbsp; mỗi vòng: khớp một cây vào phần dư, rồi $\ \hat{y} \leftarrow \hat{y} + \eta\cdot\text{cây}$</div>
          <p class="note">Đây là gradient descent của bài 9, nhưng bước đi là <b>cả một hàm</b> (một cây) thay vì một vector tham số. Với sai số $(y - \hat{y})^2$ thì gradient âm là $2(y - \hat{y})$ — tỉ lệ với phần dư, hệ số 2 gộp vào $\eta$.</p>
        introduces: [assign]
        focus: [1, "2.1", "2.2", 3]
        say: "Với sai số một nửa bình phương, đạo hàm theo dự đoán bằng âm phần dư. Vì vậy đi ngược gradient nghĩa là cộng thêm phần dư. Mỗi vòng, ta khớp một cây vào phần dư, rồi cộng cây đó nhân tốc độ học vào dự đoán. Đó là gradient descent của bài 9, nhưng mỗi bước là cả một hàm."

  - id: stair_pic
    kind: intuition
    title: "Nhìn hai vòng tăng cường: bậc thang tiến về dữ liệu"
    checks:
      - "(lambda y: (y - y.mean()).tolist())(np.array([1, 2, 3, 10.])) == [-3.0, -2.0, -1.0, 6.0]"
    steps:
      - show: |
          <svg width="1200" height="470" viewBox="0 0 1200 470"><line x1="100" y1="390" x2="1100" y2="390" stroke="#1f2937" stroke-width="2"/><text x="150" y="420" font-size="22" text-anchor="middle" fill="#1f2937">x = 1</text><text x="410" y="420" font-size="22" text-anchor="middle" fill="#1f2937">x = 2</text><text x="670" y="420" font-size="22" text-anchor="middle" fill="#1f2937">x = 3</text><text x="930" y="420" font-size="22" text-anchor="middle" fill="#1f2937">x = 4</text><line x1="800" y1="60" x2="800" y2="390" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/><text x="800" y="45" font-size="22" text-anchor="middle" fill="#6b7280">cây hỏi: x ≤ 3 ?</text><line x1="150" y1="360" x2="150" y2="270" stroke="#b91c1c" stroke-width="3"/><line x1="410" y1="330" x2="410" y2="270" stroke="#b91c1c" stroke-width="3"/><line x1="670" y1="300" x2="670" y2="270" stroke="#b91c1c" stroke-width="3"/><line x1="930" y1="90" x2="930" y2="270" stroke="#b91c1c" stroke-width="3"/><g font-size="22" fill="#b91c1c" text-anchor="end"><text x="140" y="348">−3</text><text x="400" y="292">−2</text><text x="660" y="292">−1</text><text x="920" y="232">+6</text></g><line x1="100" y1="270" x2="1060" y2="270" stroke="#6b7280" stroke-width="4" stroke-dasharray="14 8"/><path d="M100,300 H800 V180 H1060" fill="none" stroke="#d97706" stroke-width="4"/><path d="M100,315.0 H800 V135.0 H1060" fill="none" stroke="#059669" stroke-width="4"/><g font-size="22"><text x="1070" y="277" fill="#6b7280">vòng 0</text><text x="1070" y="187" fill="#d97706">vòng 1</text><text x="1070" y="142.0" fill="#059669">vòng 2</text></g><circle cx="150" cy="360" r="11" fill="#2563eb"/><circle cx="410" cy="330" r="11" fill="#2563eb"/><circle cx="670" cy="300" r="11" fill="#2563eb"/><circle cx="930" cy="90" r="11" fill="#2563eb"/><text x="600" y="458" font-size="22" text-anchor="middle" fill="#1f2937">mỗi vòng cộng một nửa cây khớp phần dư: bậc thang tiến dần về các điểm xanh</text></svg>
        say: "Hình này cho thấy tăng cường theo gradient làm gì với bốn điểm xanh, có nhãn 1, 2, 3 và 10. Vòng 0 đoán cùng một số là trung bình 4, nên các đoạn đỏ là phần dư âm 3, âm 2, âm 1 và cộng 6. Cây một tầng chỉ hỏi một câu, x có nhỏ hơn hoặc bằng 3 không, nên nó vẽ được một bậc thang hai nấc. Sau vòng 1, đường cam đã nhích về phía các điểm. Sau vòng 2, đường lục còn gần hơn nữa, vì mỗi vòng chỉ cộng một nửa phần còn thiếu."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: gb_example
    kind: example
    title: "Ví dụ: hai vòng gradient boosting"
    checks:
      - "(-3 - 2 - 1)/3 == -2 and 4 + 0.5*(-2) == 3 and 4 + 0.5*6 == 7 and (2**2 + 1**2 + 0**2 + 3**2)/4 == 3.5 and (-2 - 1 + 0)/3 == -1 and 3 - 0.5 == 2.5 and 7 + 1.5 == 8.5 and (1.5**2 + 0.5**2 + 0.5**2 + 1.5**2)/4 == 1.25"
      - "(lambda x, y: (lambda f0: (lambda f1: (lambda f2: (float(f0), f1.tolist(), f2.tolist(), float(np.mean((y - f0)**2)), float(np.mean((y - f1)**2)), float(np.mean((y - f2)**2))))(f1 + 0.5*np.where(x <= 3, (y - f1)[x <= 3].mean(), (y - f1)[x > 3].mean())))(f0 + 0.5*np.where(x <= 3, (y - f0)[x <= 3].mean(), (y - f0)[x > 3].mean())))(y.mean()))(np.array([1, 2, 3, 4.]), np.array([1, 2, 3, 10.])) == (4.0, [3.0, 3.0, 3.0, 7.0], [2.5, 2.5, 2.5, 8.5], 12.5, 3.5, 1.25)"
    steps:
      - show: |
          <p>$x = 1, 2, 3, 4$; $y = 1, 2, 3, 10$. Bắt đầu $\hat{y} = $ trung bình $= 4$; phần dư $(-3;\ -2;\ -1;\ 6)$.</p>
          <table class="t"><tr><th>vòng</th><th>cây một tầng (hỏi $x \le 3$?) khớp phần dư</th><th>$\hat{y}$ ($\eta = 0{,}5$)</th><th>MSE</th></tr>
          <tr><td>0</td><td>—</td><td>4; 4; 4; 4</td><td>12,5</td></tr>
          <tr><td>1</td><td>trái: −2, phải: 6</td><td>3; 3; 3; 7</td><td>3,5</td></tr>
          <tr><td>2</td><td>trái: −1, phải: 3</td><td>2,5; 2,5; 2,5; 8,5</td><td>$\hlg{1{,}25}$</td></tr></table>
        focus: [["1.1", "1.2"], ["1.3", "1.4"], "2.3", ["2.3", "2.4"]]
        say: "Ví dụ bốn điểm với nhãn 1, 2, 3 và 10. Bắt đầu bằng trung bình 4. Cây một tầng hỏi x có nhỏ hơn hoặc bằng 3 không, khớp phần dư bằng trung bình mỗi nhánh. Cộng một nửa cây vào, sai số giảm từ 12 phẩy 5 xuống 3 phẩy 5, rồi 1 phẩy 25."
      - clear: true
        show: |
          <p><b>Bước 1.</b> Cây vòng 1 khớp phần dư $(-3;\ -2;\ -1;\ 6)$ bằng trung bình mỗi nhánh:</p>
          $$\text{trái} = \frac{-3 - 2 - 1}{3} = -2, \qquad \text{phải} = \frac{6}{1} = 6$$
        focus: [1, 2, 2]
        say: "Bước một, cây vòng 1 khớp phần dư âm 3, âm 2, âm 1 và 6. Nhánh trái gồm ba điểm đầu, trung bình là âm 6 chia 3, bằng âm 2. Nhánh phải chỉ có điểm cuối, nên bằng 6."
      - show: |
          <p><b>Bước 2.</b> Cộng một nửa cây vào dự đoán, rồi tính lại sai số trung bình:</p>
          $$\hat{y} = 4 + 0{,}5\cdot(-2) = 3, \quad 4 + 0{,}5\cdot 6 = 7; \qquad \text{MSE} = \frac{2^2 + 1^2 + 0^2 + 3^2}{4} = \frac{14}{4} = \hlg{3{,}5}$$
        focus: [1, 2, 2]
        say: "Bước hai, cộng một nửa cây vào dự đoán. Ba điểm bên trái thành 4 cộng một nửa của âm 2, bằng 3, điểm bên phải thành 4 cộng 3, bằng 7. Phần dư mới là âm 2, âm 1, 0 và 3, bình phương cộng lại được 14, chia 4 bằng 3 phẩy 5."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Vòng 2 lặp lại với phần dư $(-2;\ -1;\ 0;\ 3)$: trái $\frac{-3}{3} = -1$, phải 3.</p>
          $$\hat{y} = 3 - 0{,}5 = 2{,}5, \quad 7 + 1{,}5 = 8{,}5; \qquad \text{MSE} = \frac{1{,}5^2 + 0{,}5^2 + 0{,}5^2 + 1{,}5^2}{4} = \frac{5}{4} = \hlg{1{,}25}$$
        focus: [1, 2, 2]
        say: "Bước ba, vòng 2 lặp lại với phần dư âm 2, âm 1, 0 và 3. Nhánh trái có trung bình âm 1, nhánh phải là 3, nên dự đoán thành 2 phẩy 5 và 8 phẩy 5. Bình phương phần dư cộng lại được 5, chia 4 bằng 1 phẩy 25, khớp với dòng cuối của bảng."

  # ───────────────────────── 7. SO VỚI RỪNG ─────────────────────────
  - id: vs_forest
    kind: concept
    title: "Tăng cường và rừng ngẫu nhiên"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>rừng ngẫu nhiên (bài 28)</th><th>tăng cường</th></tr>
          <tr><td>các cây</td><td>độc lập, có thể học song song</td><td>nối tiếp, cây sau sửa cây trước</td></tr>
          <tr><td>mỗi cây</td><td>sâu (ít sai lệch, dao động nhiều)</td><td>nông (rất yếu)</td></tr>
          <tr><td>gộp</td><td>trung bình / bầu chọn đều</td><td>tổng có trọng số</td></tr>
          <tr><td>chủ yếu giảm</td><td>dao động (phương sai)</td><td>sai lệch</td></tr></table>
          <p class="note">Tăng cường nhiều vòng có thể <b>quá khớp</b>: chọn số vòng và $\eta$ bằng tập kiểm định (bài 19).</p>
        focus: [1, 1, 1, 2]
        say: "Bây giờ ta so sánh tăng cường với rừng ngẫu nhiên của bài 28. Rừng ngẫu nhiên trồng các cây sâu, độc lập, rồi lấy trung bình, chủ yếu giảm dao động. Tăng cường trồng các cây nông, nối tiếp, cây sau sửa cây trước, chủ yếu giảm sai lệch. Tăng cường quá nhiều vòng có thể quá khớp, nên chọn số vòng bằng kiểm định."

  # ───────────────────────── 8. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: 50 vòng, sai số huấn luyện không tăng"
    checks:
      - "(lambda x, y: (lambda errs: all(errs[i + 1] <= errs[i] for i in range(49)) and round(errs[-1], 6) == 0.5)(__import__('functools').reduce(lambda acc, _: (lambda f: (f + 0.5*np.where(x <= 3, (y - f)[x <= 3].mean(), (y - f)[x > 3].mean()), acc[1] + [float(np.mean((y - f)**2))]))(acc[0]), range(50), (np.full(4, y.mean()), []))[1]))(np.array([1, 2, 3, 4.]), np.array([1, 2, 3, 10.]))"
    steps:
      - show: |
          <p>Chạy 50 vòng: MSE huấn luyện <b>không bao giờ tăng</b> và dừng ở $\hlg{0{,}5}$ $\checkmark$ — giới hạn của cây chỉ hỏi “$x \le 3$?”: nhánh trái luôn đoán cùng một số cho 1, 2, 3, tốt nhất là 2:</p>
          $$\text{MSE} = \frac{(1 - 2)^2 + (2 - 2)^2 + (3 - 2)^2 + 0^2}{4} = \frac{1 + 0 + 1}{4} = 0{,}5$$
          <p class="note">Muốn giảm tiếp phải cho cây hỏi câu khác (sâu hơn). Nhưng sai số huấn luyện nhỏ không có nghĩa mô hình tốt — dừng theo tập kiểm định.</p>
        focus: [1, [1, 2]]
        say: "Phép thử, ta chạy 50 vòng, và sai số huấn luyện không bao giờ tăng, dừng ở 0 phẩy 5. Đó là giới hạn của cây chỉ hỏi một câu, vì nhánh trái phải đoán cùng một số cho ba điểm 1, 2, 3."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "[round((math.exp(math.log(2))/math.exp(-math.log(2)))**k) for k in (0, 1, 2, 3, 5)] == [1, 4, 16, 64, 1024]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chạy rất nhiều vòng mà không theo dõi tập kiểm định <b class="red">(quá khớp)</b>
          <br><span class="note">Dừng khi sai số kiểm định ngừng giảm.</span></div>
        say: "Lỗi thứ nhất, chạy rất nhiều vòng mà không theo dõi tập kiểm định, dẫn tới quá khớp. Hãy dừng khi sai số kiểm định ngừng giảm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng mô hình yếu có sai số trên một nửa <b class="red">(sai)</b>
          <br><span class="note">Khi đó $\alpha < 0$: mô hình tệ hơn đoán bừa — AdaBoost cần mỗi mô hình yếu tốt hơn đoán bừa một chút.</span></div>
        say: "Lỗi thứ hai, dùng mô hình yếu có sai số trên một nửa. Khi đó an-pha âm, vì mô hình tệ hơn đoán bừa."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tốc độ học $\eta$ quá lớn <b class="red">(kém tổng quát)</b>
          <br><span class="note">Như bài 9: bước nhỏ hơn, nhiều vòng hơn thường cho kết quả tốt hơn trên dữ liệu mới.</span></div>
        say: "Lỗi thứ ba, tốc độ học quá lớn. Như bài 9, bước nhỏ hơn với nhiều vòng hơn thường cho kết quả tốt hơn trên dữ liệu mới."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chạy AdaBoost trên dữ liệu có <b>nhãn gán nhầm</b> mà không xem trọng số mẫu <b class="red">(mô hình chạy theo nhiễu)</b></div>
          <table class="t"><tr><th>sau số vòng</th><th>0</th><th>1</th><th>2</th><th>3</th><th>5</th></tr>
          <tr><td>trọng số mẫu nhãn nhầm ÷ mẫu luôn đúng ($\alpha = \ln 2$ mỗi vòng)</td><td>1</td><td>4</td><td>16</td><td>64</td><td>$\hlo{1024}$</td></tr></table>
          <p class="note">Mỗi vòng mẫu nhãn nhầm nhân 2, mẫu đúng nhân 0,5 — tỉ lệ nhân 4. Chuyên gia in ra các mẫu có trọng số lớn bất thường: thường đó là nhãn sai cần sửa.</p>
        focus: [1, "2.2", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, chạy AdaBoost trên dữ liệu có nhãn gán nhầm mà không xem trọng số mẫu. Mẫu có nhãn nhầm thì mô hình nào cũng đoán sai, nên mỗi vòng nó được nhân 2, còn mẫu luôn đúng nhân 0 phẩy 5, tỉ lệ giữa hai mẫu tăng gấp 4. Sau 5 vòng, mẫu nhãn nhầm nặng gấp 1024 lần, và các mô hình sau chỉ lo đoán cho đúng nó. Vì vậy chuyên gia in ra những mẫu có trọng số lớn bất thường, thường đó là nhãn sai cần sửa."

  # ───────────────────────── 10. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(0.5*math.log((1 - 0.1)/0.1), 3) == 1.099"
      - "(lambda y, f: (y - f).tolist())(np.array([5, 7.]), np.array([6, 6.])) == [-1.0, 1.0]"
      - "round((1 - 0.1)/0.1, 9) == 9 and round(0.5*math.log(0.4/0.6), 3) == -0.203 and round(1 - 0.6, 9) == 0.4 and round(0.5*math.log(0.6/0.4), 3) == 0.203"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mô hình yếu có $\varepsilon = 0{,}1$. Tính $\alpha$.</td></tr>
          <tr><td>2</td><td>$y = (5;\ 7)$, dự đoán hiện tại $(6;\ 6)$. Cây tiếp theo khớp vào gì?</td></tr>
          <tr><td>3</td><td>Khác biệt chính giữa tăng cường và rừng ngẫu nhiên?</td></tr>
          <tr><td>4</td><td>Một mô hình yếu có $\varepsilon = 0{,}6$. Dùng nguyên như vậy, hay làm gì với nó?</td></tr></table>
        focus: [0, "1.5", 0]
        say: "Bây giờ đến lượt bạn, với bốn câu trên màn hình. Câu cuối là một quyết định, xử lý thế nào với một mô hình sai quá một nửa. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <table class="t"><tr><th>câu</th><th>từng bước</th><th>đáp số</th></tr>
          <tr><td>①</td><td>$\frac{1 - 0{,}1}{0{,}1} = 9$; &nbsp; $\frac{1}{2}\ln 9 = \ln 3$</td><td>$\hlg{1{,}099}$</td></tr>
          <tr><td>②</td><td>phần dư $5 - 6$ và $7 - 6$</td><td>$(\hlg{-1;\ 1})$</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Câu một, 1 trừ 0 phẩy 1, chia 0 phẩy 1, bằng 9. Một nửa lôgarit của 9 bằng lôgarit của 3, vì 9 là 3 bình phương, xấp xỉ 1 phẩy 099. Câu hai, cây tiếp theo khớp phần dư, 5 trừ 6 bằng âm 1, 7 trừ 6 bằng 1."
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>từng bước</th><th>đáp số</th></tr>
          <tr><td>③</td><td>tăng cường: nối tiếp sửa sai, giảm sai lệch; rừng: độc lập lấy trung bình, giảm dao động</td><td>—</td></tr>
          <tr><td>④</td><td>$\frac{1}{2}\ln\frac{0{,}4}{0{,}6} \approx -0{,}203 < 0$; đảo ngược dự đoán thì $\varepsilon = 1 - 0{,}6 = 0{,}4$</td><td>đảo ngược, $\alpha \approx \hlg{0{,}203}$</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.3"]
        say: "Câu ba, tăng cường học nối tiếp để sửa sai, còn rừng ngẫu nhiên học độc lập rồi lấy trung bình. Câu bốn, sai số 0 phẩy 6 cho an-pha xấp xỉ âm 0 phẩy 203, tức là mô hình tệ hơn đoán bừa. Nếu đảo ngược mọi dự đoán của nó, sai số thành 1 trừ 0 phẩy 6, bằng 0 phẩy 4. Khi đó an-pha thành dương 0 phẩy 203, nên mô hình lại có ích."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mô hình yếu nối tiếp</span><span class="a">→</span>
          <span class="n">AdaBoost: $\alpha = \frac{1}{2}\ln\frac{1 - \varepsilon}{\varepsilon}$, tăng trọng số mẫu sai</span><span class="a">→</span>
          <span class="n">gradient boosting: cây khớp phần dư</span><span class="a">→</span>
          <span class="n">dừng theo kiểm định</span></div>
        say: "Tổng kết chuỗi logic. Tăng cường ghép nối tiếp nhiều mô hình yếu lại với nhau. AdaBoost tính trọng số mô hình từ sai số và tăng trọng số các mẫu bị sai. Tăng cường theo gradient khớp mỗi cây mới vào phần dư. Và dừng theo tập kiểm định."
      - show: |
          <div class="box key"><b>Tư duy:</b> nhiều bước nhỏ, mỗi bước sửa đúng chỗ còn sai, có thể biến những mô hình rất yếu thành một mô hình mạnh.</div>
        say: "Điều cần mang theo, nhiều bước nhỏ, mỗi bước sửa đúng chỗ còn sai, có thể biến những mô hình rất yếu thành một mô hình mạnh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 37): <b>mạng tự mã hoá</b> (autoencoder) — nén phi tuyến bằng mạng nơ-ron, so với PCA.</p>
        forward_ref: true
        say: "Ở bài sau, bài 37, ta học mạng tự mã hoá, nén dữ liệu phi tuyến bằng mạng nơ-ron, so với phân tích thành phần chính. Hẹn gặp bạn ở bài tiếp theo."
