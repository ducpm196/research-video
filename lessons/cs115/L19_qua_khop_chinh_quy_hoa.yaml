source: "DC23#Ch3, Ch4; tex#L165–L166 (quá khớp), L406 (SVM có số hạng L2); ML24#Overfitting (đa thức bậc cao, tập huấn luyện/kiểm tra); NN#Dropout; AUDIT A9, T18"
assumes: [cdot, sub, vec, mat, transpose, inverse, implies, sum, hat, lambda, identity, det, dim, approx, neq, power, geq, dots, norm, zero_vec, prime, log]
# Quy ước ký hiệu: λ (lam-đa) ở bài này là ĐỘ MẠNH CỦA PHẠT — khác trị riêng λ của bài 5, 15, 16 (nói ở notation_note);
#   phạt viết bằng tổng: λ·Σ wⱼ² (L2) và λ·Σ |wⱼ| (L1), chỉ số j chạy từ 1 — KHÔNG phạt b = w₀; ma trận phạt viết \mathbf{I}'
#   (ma trận đơn vị có số 0 ở góc trên trái) — giải thích trong bài; tài liệu viết ‖w‖₂², ‖w‖₁ — nói ở notation_note.
# Dữ liệu: 6 điểm huấn luyện x = 0…5, y = 2x + 1 + nhiễu (0,5; −0,5; 0,3; −0,4; 0,6; −0,3); 5 điểm kiểm định x = 0,5…4,5,
#   nhiễu (0,2; −0,3; 0,1; 0,3; −0,2). Mọi số trên màn hình được máy tính lại trong `checks`.
# Lời đọc: “Ridge”, “Lasso”, “cross-validation” chỉ hiện trên màn hình; nói “phạt L2”, “phạt L1”, “kiểm định chéo”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 18 (MSE, phương trình chuẩn, hồi quy đa thức, cột trùng làm XᵀX không khả nghịch),
#   bài 17 (MAP = MLE cộng log tiên nghiệm), bài 2 (định thức, nghịch đảo).
objectives:
  - "Nhận ra quá khớp: sai số huấn luyện nhỏ nhưng sai số trên dữ liệu mới lớn"
  - "Chia dữ liệu huấn luyện / kiểm định / kiểm tra và biết dùng mỗi phần để làm gì"
  - "Viết hàm mục tiêu có phạt L2, giải bằng phương trình chuẩn mới, thấy vì sao luôn khả nghịch"
  - "Phân biệt phạt L2 (co nhỏ) và phạt L1 (đẩy về đúng 0)"
  - "Chọn độ mạnh phạt bằng kiểm định chéo K phần"
