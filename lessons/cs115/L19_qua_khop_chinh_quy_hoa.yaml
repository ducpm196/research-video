      - "(lambda x, y: np.allclose(np.vander(x, 6, increasing=True) @ np.linalg.solve(np.vander(x, 6, increasing=True), y), y))(np.arange(6.), 2*np.arange(6.) + 1 + np.array([0.5, -0.5, 0.3, -0.4, 0.6, -0.3]))"
    steps:
      - show: |
