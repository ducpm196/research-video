  - sentence: "Vì vậy ta chia dữ liệu làm ba phần, phần huấn luyện để học w, phần kiểm định để chọn mô hình, và phần kiểm tra để chấm điểm cuối, chỉ dùng một lần."
    reason: "tên chữ w (vê kép) → “vk” (tên chữ cái); “dữ liệu” → “giữ liệu” (cặp d/gi giọng Bắc) — INFERRED ASR"
  - sentence: "Phép thử, ta giải phương trình chuẩn mới, rồi giải theo một cách khác bằng thư viện, và hai cách cho cùng một w."
    reason: "tên chữ w (vê kép) → “v kết” (tên chữ cái); độ khớp 0,96 — INFERRED ASR"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đường cong đi qua mọi điểm — nhưng đoán sai điểm mới"
