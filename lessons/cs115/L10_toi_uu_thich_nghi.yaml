# Quy ước ký hiệu (giữ đúng bài 9): bước lặp w_k; tốc độ học η; hệ số giữ lại β (bài báo Adadelta gọi là ρ — chỉ nói bằng lời,
#   không dùng thêm chữ mới); gradient tại bước k: g_k; trung bình trượt bình phương gradient: s_k (như bài 9); tổng bình
#   phương gradient của Adagrad: G_k (chữ hoa, không in đậm — không phải ma trận); số rất nhỏ ε; nhân hai số: ·.
#   Với hai trọng số x, y: mọi phép trên g², √, chia đều làm RIÊNG cho từng trọng số (nói rõ ở sym_adagrad).
# Nối bài trước (nói lại khi dùng, luật 17): bài 9 (w_{k+1} = w_k − η ∇f(w_k); với (w − 3)² khoảng cách nhân (1 − 2η) mỗi bước;
#   Momentum v_{k+1} = βv_k + η∇f(w_k); trung bình trượt; Adam), bài 6 (đạo hàm riêng: giữ biến kia đứng yên), bài 5 (độ cong).
# Sửa nguồn: A18 (Adam “phổ biến nhất” là nhận định).
