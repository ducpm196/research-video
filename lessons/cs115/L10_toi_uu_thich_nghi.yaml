source: "DC23 Chương 3 (Momentum, Nesterov, Adagrad, RMSprop, Adadelta, Adam); tex#L285-L286; CITED: Sutskever, Martens, Dahl & Hinton, ICML 2013 (dạng Nesterov theo động lượng); Duchi, Hazan & Singer, JMLR 12 (2011) 2121–2159 (Adagrad); Tieleman & Hinton 2012, bài giảng 6, Coursera Neural Networks for Machine Learning (RMSprop — chưa từng đăng thành bài báo); Zeiler, arXiv:1212.5701 (2012) (Adadelta)"
