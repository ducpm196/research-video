objectives:
- Giải thích bằng ví dụ thung lũng dẹt x² + 25y² vì sao một tốc độ học chung không hợp cho mọi trọng số
- Tính tay một bước Nesterov và so với Momentum
- Viết và tính tay Adagrad, RMSprop; giải thích vì sao bước của Adagrad nhỏ dần mãi còn RMSprop thì không
- Nói được Adadelta bỏ tốc độ học thế nào và cái giá phải trả (bước đầu phụ thuộc ε)
- Nhận ra Adam = Momentum + RMSprop + hiệu chỉnh độ lệch
- Đếm được số giá trị bộ tối ưu phải lưu cho mỗi trọng số (SGD, Momentum, RMSprop, Adam), và thấy cái giá bộ nhớ của việc thích nghi khi số trọng số tăng
