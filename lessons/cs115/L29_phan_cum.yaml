id: L29
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 29 — Phân cụm: K-Means, phân cụm phân cấp & phân cụm phổ (ma trận Laplacian)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "DC23#Ch5; AG25#Clustering; tex#L408 (K-Means: “Inertia (Tổng khoảng cách)”, lặp gán điểm và tính lại tâm); AUDIT A24, T17"
assumes: [cdot, sub, vec, mat, norm, sum, lambda, approx, power, geq, transpose, implies]
# Quy ước ký hiệu: tâm cụm cₖ (vector, in đậm); điểm xᵢ thuộc cụm k(i); tổng bình phương khoảng cách J (A24 — tài liệu dòng 408 viết
#   “tổng khoảng cách”, thiếu “bình phương”); ma trận trọng số đồ thị W, ma trận bậc D (đường chéo), ma trận Laplacian L = D − W
#   (chữ L in đậm — khác L khả năng của bài 12, 17 và ℒ của bài 24; nói ở notation_note).
# Lời đọc: “K-Means” đọc “K trung bình”; “Laplacian” đọc “Láp-la-xi-an” (CHƯA probe → ASR toàn bài, B54).
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (khoảng cách = độ dài hiệu), bài 5 (vector riêng, trị riêng), bài 13 (trung bình),
#   bài 27 (K láng giềng gần nhất — chữ K khác nghĩa).
objectives:
  - "Viết mục tiêu của K-Means là tổng bình phương khoảng cách và hiểu vì sao tâm là trung bình"
  - "Chạy K-Means bằng tay và thấy mục tiêu giảm sau mỗi bước"
  - "Biết K-Means chỉ tới cực tiểu địa phương, phụ thuộc khởi tạo, cần chọn K trước"
  - "Hiểu phân cụm phân cấp bằng cách gộp dần"
  - "Thấy vector riêng của ma trận Laplacian tách được các cụm (phân cụm phổ)"
asr_reviewed:
  - {sentence: "Gán lại lần nữa thì không điểm nào đổi cụm, và thuật toán dừng.", reason: "ASR chép “Gán lại lần nữa thì không điểm nào đổi cùng và thuật bán dưng.” (0.786): lệch âm/thanh thuần Việt: cụm/cùng, toán dừng/bán dưng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ma trận Laplacian của bốn điểm ví dụ được viết ra đầy đủ, đường chéo là bậc của mỗi điểm, các ô khác là trọng số mang dấu trừ.", reason: "ASR chép “Ma trận lắp la xiang của 4 điểm ví dụ được viết ra đầy đủ, đường chéo là bật của mỗi điểm, các ô khác là trọng số mang dấu trư.” (0.867): lệch âm/thanh thuần Việt: bậc/bật, trừ/trư; “Laplacian” đọc “Láp-la-xi-an” theo lexicon_vi.yaml, ASR chép cùng dáng âm “lắp la xiang” — NOT_VERIFIED bằng tai người"}
  - sentence: "Hãy chạy nhiều lần và giữ J nhỏ nhất."
    reason: "J đọc tên chữ cái “gi”, ASR chép “duy”"
  - sentence: "Mục tiêu của K trung bình là J, tổng bình phương khoảng cách từ mỗi điểm tới tâm cụm của nó."
    reason: "J đọc “gi”, ASR chép “gì” (đổi cả câu thành câu hỏi); K chép “ca” — tên chữ cái"
  - sentence: "Phân cụm phổ dùng các vector riêng của ma trận Laplacian dựng từ đồ thị."
    reason: "Laplacian đọc “Láp-la-xi-an”, ASR chép “Lắp La Siang” — gần đúng âm; cụm→cụng lẫn thanh"
  - sentence: "Ma trận Laplacian được định nghĩa bằng ma trận bậc trừ ma trận trọng số."
    reason: "Laplacian chép “lắp la xiang” — gần đúng âm; bậc→bật"
  - sentence: "Trị riêng 0 luôn có, vì mọi hàng của ma trận Laplacian cộng lại bằng 0."
    reason: "Laplacian chép “Lắp La Sian” — gần đúng âm"
  - sentence: "Câu hai tính tổng bình phương khoảng cách J."
    reason: "J đọc tên chữ cái “gi”, ASR chép “gì”"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dữ liệu không có nhãn — tự tìm nhóm"
    steps:
      - show: |
          <p class="big">Một cửa hàng có hàng nghìn khách, <b>không ai dán nhãn</b> “khách sinh viên”, “khách văn phòng”… Máy có tự tìm ra các nhóm không?</p>
          <div class="box key">Phân cụm: gom các điểm <b>gần nhau</b> thành một nhóm. Hôm nay: K-Means, phân cụm phân cấp và phân cụm phổ.</div>
        focus: [1, 1, 2, 2]
        say: "Chào bạn, một cửa hàng có hàng nghìn khách, và không ai dán nhãn khách sinh viên hay khách văn phòng. Máy có tự tìm ra các nhóm không? Đó là phân cụm, gom các điểm gần nhau thành một nhóm. Hôm nay ta học ba cách, K trung bình, phân cụm phân cấp và phân cụm phổ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: khoảng cách, trung bình, vector riêng"
    steps:
      - show: |
          <p>Bài 1: khoảng cách $\lVert\mathbf{x} - \mathbf{z}\rVert$ = độ dài của hiệu. Bài 13: trung bình = tổng chia số phần tử.</p>
          <p>Bài 5: $\mathbf{A}\mathbf{v} = \lambda\mathbf{v}$ — vector riêng $\mathbf{v}$, trị riêng $\lambda$.</p>
          <p class="note">Chữ K ở đây là <b>số cụm</b>; ở bài 27 (K láng giềng gần nhất), K là <b>số láng giềng</b> — hai thuật toán khác hẳn.</p>
        notation_note: true
        focus: [1, 2, 3]
        say: "Nhắc lại bài 1, khoảng cách là độ dài của hiệu hai vector, và bài 13, trung bình là tổng chia số phần tử. Bài 5, vector riêng là vector mà ma trận chỉ kéo giãn. Lưu ý chữ K ở đây là số cụm, còn ở bài 27, K là số láng giềng, hai thuật toán khác hẳn."

  # ───────────────────────── 3. MỤC TIÊU ─────────────────────────
  - id: sym_inertia
    kind: symbol
    title: "Giải mã: J — tổng bình phương khoảng cách tới tâm"
    checks:
      - "(lambda x: (Rational(sum(x), 3), sum((v - Rational(11, 3))**2 for v in x), sum(abs(v - 1) for v in x), sum(abs(v - Rational(11, 3)) for v in x)) == (Rational(11, 3), Rational(182, 3), 10, Rational(38, 3)))([0, 1, 10])"
      - "(lambda c: sp.solve(sp.diff(sum((v - c)**2 for v in (0, 1, 10)), c), c) == [Rational(11, 3)])(sp.Symbol('c'))"
    steps:
      - show: |
          <div class="box key">$J = \sum_{i}\lVert\mathbf{x}_i - \mathbf{c}_{k(i)}\rVert^2$ &nbsp; — tổng <b>bình phương</b> khoảng cách từ mỗi điểm tới tâm cụm của nó (inertia)</div>
          <p>Một cụm 0, 1, 10: tâm làm $J$ nhỏ nhất là <b>trung bình</b> $\frac{11}{3} \approx 3{,}67$ (đạo hàm bằng 0, bài 8).</p>
          <p class="note">Hay gặp cách ghi thiếu “tổng khoảng cách”: nếu tổng khoảng cách <b>không</b> bình phương thì tâm tốt nhất là số đứng giữa 1, không phải trung bình (tổng 10 so với 12,67).</p>
        focus: [1, 2, 3]
        say: "Mục tiêu của K trung bình là J, tổng bình phương khoảng cách từ mỗi điểm tới tâm cụm của nó. Với một cụm gồm 0, 1 và 10, lấy đạo hàm bằng 0 như bài 8, tâm tốt nhất là trung bình, 11 phần 3. Lưu ý, nhiều nơi ghi thiếu chữ bình phương, mà thiếu nó thì tâm tốt nhất lại là số đứng giữa."

  - id: km_pic
    kind: intuition
    title: "Nhìn thấy K-Means: điểm đổi màu, tâm dời chỗ"
    checks:
      - "Rational(2 + 3 + 10 + 11 + 12, 5) == Rational(38, 5) and float(Rational(38, 5)) == 7.6"
      - "3 - 1 == 2 and round(7.6 - 3, 1) == 4.6 and Rational(1 + 2 + 3, 3) == 2 and Rational(10 + 11 + 12, 3) == 11"
    steps:
      - show: |
