scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chỗ bằng phẳng là đáy, đỉnh, hay yên ngựa?"
    steps:
      - show: |
          <p class="big">Huấn luyện AI = tìm bộ trọng số làm sai số <b>nhỏ nhất</b>.</p>
          <p>Bài 6: tại chỗ thấp nhất, mặt đất <b>bằng phẳng</b> — gradient bằng vector không.</p>
        focus: [1, 2]
        say: "Chào bạn, huấn luyện AI là tìm bộ trọng số làm sai số nhỏ nhất. Ở bài 6, ta thấy tại chỗ thấp nhất, mặt đất bằng phẳng, nghĩa là gradient bằng vector không."
      - show: |
          <div class="box warn">Nhưng chỗ bằng phẳng chưa chắc là đáy: đỉnh núi cũng bằng phẳng, và <b>yên ngựa</b> (lên theo hướng này, xuống theo hướng kia) cũng bằng phẳng.</div>
        say: "Nhưng chỗ bằng phẳng chưa chắc là đáy. Đỉnh núi cũng bằng phẳng, và cái yên ngựa, đi dọc thì lên, đi ngang thì xuống, cũng bằng phẳng ở giữa."
      - clear: true
        show: |
          <p>Bài hôm nay trả lời 3 câu hỏi:</p>
          <ol><li>Tìm các chỗ bằng phẳng thế nào? → <b>điểm dừng</b></li>
          <li>Phân biệt đáy, đỉnh, yên ngựa thế nào? → <b>độ cong</b> (Hessian của bài 7, trị riêng của bài 5)</li>
          <li>Có cách tính nhanh không? → <b>tiêu chuẩn định thức con</b> (sách còn gọi là tiêu chuẩn Sylvester)</li></ol>
        focus: [1, "2.1", "2.2", "2.3"]
        say: "Hôm nay mình trả lời ba câu hỏi. Tìm các chỗ bằng phẳng thế nào. Phân biệt đáy, đỉnh và yên ngựa thế nào, nhờ độ cong. Và có cách tính nhanh không, đó là tiêu chuẩn định thức con."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: gradient, đạo hàm cấp 2, Hessian, trị riêng"
    checks:
      - "(lambda x: sp.diff(x**3, x) == 3*x**2 and sp.diff(x**3, x, 2) == 6*x)(sp.Symbol('x'))"
      - "(lambda x, y: sp.hessian(x**2 + y**2 - x*y + x - y, (x, y)) == Matrix([[2, -1], [-1, 2]]))(*sp.symbols('x y'))"
      - "sorted(Matrix([[2, -1], [-1, 2]]).eigenvals()) == [1, 3] and 1*3 == Matrix([[2, -1], [-1, 2]]).det() and 1 + 3 == 2 + 2"
    steps:
      - show: |
          <p><b>Bài 6</b> — gradient $\nabla f$: mũi tên chỉ hướng dốc lên nhất. Chỗ bằng phẳng: $\ \nabla f = \mathbf{0}$.</p>
          <p><b>Bài 7</b> — đạo hàm cấp 2 = đạo hàm của đạo hàm, đo <b>độ cong</b>: $\ (x^3)' = 3x^2,\ \ (x^3)'' = 6x$. &nbsp; Và phép xấp xỉ:</p>
          $$f(x + h) \approx f(x) + f'(x)\cdot h + \frac{1}{2}\,f''(x)\cdot h^2$$
        focus: [0, 1, [2, 3]]
        say: "Trước hết, ôn nhanh vài điều đã học. Ở bài 6, gradient là mũi tên chỉ hướng dốc lên nhất, và chỗ bằng phẳng là chỗ gradient bằng vector không. Ở bài 7, đạo hàm cấp 2 là đạo hàm của đạo hàm, đo độ cong, và nó giúp xấp xỉ chính xác hơn."
      - show: |
          <p><b>Bài 7</b> — ma trận Hessian $\mathbf{H}_f$ = bảng các đạo hàm cấp 2 = Jacobian của gradient. Ví dụ chính của bài 6: $\ f = x^2 + y^2 - xy + x - y$ có $\ \mathbf{H}_f = \begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$.</p>
        say: "Cũng ở bài 7, ma trận Hessian là bảng các đạo hàm cấp 2, và chính là Jacobian của gradient. Hàm ví dụ chính của bài 6 có Hessian là 2, âm 1, âm 1, 2."
      - show: |
          <p><b>Bài 5</b> — trị riêng $\lambda$: $\ \mathbf{H}\mathbf{v} = \lambda\,\mathbf{v}$ với $\mathbf{v} \neq \mathbf{0}$: ma trận chỉ <b>kéo giãn</b> hướng $\mathbf{v}$ theo hệ số $\lambda$.</p>
          <p class="note">Ma trận trên có trị riêng $1$ và $3$: tích $1\cdot 3 = 3$ = định thức, tổng $1 + 3 = 4$ = tổng đường chéo. Ma trận đối xứng: các vector riêng <b>vuông góc</b> nhau.</p>
        focus: [1, 2, 2]
        say: "Ở bài 5, trị riêng lam-đa là hệ số mà ma trận kéo giãn một hướng đặc biệt v. Ma trận trên có trị riêng 1 và 3, tích bằng định thức, tổng bằng tổng đường chéo. Và ma trận đối xứng có các vector riêng vuông góc nhau."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym_star
    kind: symbol
    title: "Giải mã: x* — điểm dừng, cực tiểu, cực đại"
    checks:
      - "(lambda x: sp.solve(sp.diff(x**2 - 4*x + 5, x), x) == [2] and (x**2 - 4*x + 5).subs(x, 2) == 1)(sp.Symbol('x'))"
    steps:
      - show: |
          <p>Dấu sao trên: $\ \mathbf{x}^*$ (đọc “x sao”) = <b>điểm đang xét</b>. Không phải phép nhân.</p>
          <div class="box key"><b>Điểm dừng</b>: $\ \nabla f(\mathbf{x}^*) = \mathbf{0}$ — mặt đất bằng phẳng theo mọi hướng tại $\mathbf{x}^*$.</div>
        introduces: [star]
        focus: [1, 1, 2]
        say: "Ký hiệu mới, chữ x với dấu sao phía trên, đọc là x sao, chỉ điểm đang xét. Dấu sao ở đây không phải phép nhân. Điểm dừng là điểm mà gradient bằng vector không, tức mặt đất bằng phẳng theo mọi hướng."
      - show: |
          <table class="t"><tr><th>Tên</th><th>Nghĩa</th></tr>
          <tr><td><b>cực tiểu địa phương</b> (đáy)</td><td>$f(\mathbf{x}^*) \le f(\mathbf{x})$ với mọi $\mathbf{x}$ <b>gần</b> $\mathbf{x}^*$</td></tr>
          <tr><td><b>cực đại địa phương</b> (đỉnh)</td><td>$f(\mathbf{x}^*) \ge f(\mathbf{x})$ với mọi $\mathbf{x}$ gần $\mathbf{x}^*$</td></tr>
          <tr><td><b>cực tiểu toàn cục</b></td><td>$f(\mathbf{x}^*) \le f(\mathbf{x})$ với <b>mọi</b> $\mathbf{x}$</td></tr>
          <tr><td><b>yên ngựa</b></td><td>điểm dừng, nhưng có hướng đi lên và có hướng đi xuống</td></tr></table>
        say: "Đáy gọi là cực tiểu địa phương, nghĩa là f tại x sao không lớn hơn f tại mọi điểm gần đó. Đỉnh là cực đại địa phương. Nếu thấp nhất trên toàn bộ, ta gọi là cực tiểu toàn cục. Còn yên ngựa có hướng lên và có hướng xuống."
      - clear: true
        show: |
          <p><b>Làm thử</b> (một biến): $\ f(x) = x^2 - 4x + 5$. &nbsp; Đạo hàm theo bảng bài 6: $\ f'(x) = 2x - 4$.</p>
          <p>Điểm dừng: $\ 2x - 4 = 0 \implies x^* = 2$, &nbsp; $f(2) = 4 - 8 + 5 = 1$.</p>
        focus: ["1.2", "1.3", 2]
        say: "Làm thử với hàm một biến, x bình phương trừ 4 x cộng 5. Theo bảng đạo hàm của bài 6, đạo hàm là 2 x trừ 4. Cho nó bằng 0, chuyển vế được x sao bằng 2, và f tại 2 bằng 1."

  # ───────────────────────── 4. MỘT BIẾN ─────────────────────────
  - id: onevar
    kind: formula
    title: "Một biến: dấu của đạo hàm cấp 2"
    checks:
      - "(lambda h: sp.expand((2 + h)**2 - 4*(2 + h) + 5) == 1 + h**2)(sp.Symbol('h'))"
      - "Rational(21,10)**2 - 4*Rational(21,10) + 5 == Rational(101,100)"
      - "(lambda x: [sp.diff(e, x, 2).subs(x, 0) for e in (x**4, -x**4, x**3)] == [0, 0, 0] and [sp.diff(e, x).subs(x, 0) for e in (x**4, -x**4, x**3)] == [0, 0, 0])(sp.Symbol('x'))"
      - "Rational(1,10)**4 > 0 and -Rational(1,10)**4 < 0 and Rational(1,10)**3 > 0 and (-Rational(1,10))**3 < 0"
    steps:
      - show: |
          <p>Tại điểm dừng, $f'(x^*) = 0$, nên phép xấp xỉ của bài 7 chỉ còn:</p>
          $$f(x^* + h) \approx f(x^*) + \frac{1}{2}\,f''(x^*)\cdot h^2$$
          <p class="note">Vì $h^2 > 0$ với mọi $h \neq 0$, nên đi sang trái hay sang phải, $f$ thay đổi <b>cùng dấu</b> với $f''(x^*)$.</p>
        focus: [[1, 2], 3]
        say: "Tại điểm dừng, đạo hàm bằng 0, nên trong phép xấp xỉ của bài 7, số hạng giữa biến mất. Vì h bình phương luôn dương, nên đi sang trái hay sang phải, f thay đổi cùng dấu với đạo hàm cấp 2."
      - show: |
          <p><b>Làm thử ngay</b>: $\ f = x^2 - 4x + 5$, $\ f'' = 2$, $\ x^* = 2$: &nbsp; $f(2 + h) \approx 1 + \frac{1}{2}\cdot 2\cdot h^2 = 1 + h^2$.</p>
          <p>Với $h = 0{,}1$: $\ f(2{,}1) = 4{,}41 - 8{,}4 + 5 = 1{,}01 = 1 + 0{,}01\ \checkmark$ &nbsp; — cao hơn đáy.</p>
        focus: [1, 2]
        say: "Làm thử ngay với hàm vừa rồi, đạo hàm cấp 2 bằng 2, thay vào được f gần 2 bằng 1 cộng h bình phương. Với h bằng 0 phẩy 1, f bằng 1 phẩy 01, cao hơn 1, đúng là đáy."
      - clear: true
        show: |
          <table class="t"><tr><th>Tại điểm dừng</th><th>Kết luận</th><th>Ví dụ</th></tr>
          <tr><td>$f''(x^*) > 0$</td><td>cong lên → <b>đáy</b></td><td>$x^2 - 4x + 5$ tại $2$</td></tr>
          <tr><td>$f''(x^*) < 0$</td><td>cong xuống → <b>đỉnh</b></td><td>$-x^2$ tại $0$</td></tr>
          <tr><td>$f''(x^*) = 0$</td><td><b>chưa kết luận được</b></td><td>xem dưới</td></tr></table>
        say: "Vậy theo phép xấp xỉ, đạo hàm cấp 2 dương thì cong lên, là đáy. Âm thì cong xuống, là đỉnh. Còn nếu nó bằng 0, ta chưa kết luận được gì."
      - show: |
          <div class="box warn">Ba hàm cùng có $f'(0) = 0$ và $f''(0) = 0$, nhưng: &nbsp; $x^4$ là <b>đáy</b> ($0{,}1^4 > 0$), &nbsp; $-x^4$ là <b>đỉnh</b>, &nbsp; $x^3$ <b>không là gì cả</b> (bên phải dương, bên trái âm).</div>
        say: "Vì sao chưa kết luận được? Ba hàm x mũ 4, trừ x mũ 4 và x mũ 3 đều có đạo hàm và đạo hàm cấp 2 bằng 0 tại 0. Nhưng cái đầu là đáy, cái thứ hai là đỉnh, cái thứ ba không phải cả hai."

  # ───────────────────────── 5. NHIỀU BIẾN: ĐỘ CONG THEO HƯỚNG ─────────────────────────
  - id: direction
    kind: formula
    title: "Nhiều biến: đi theo từng hướng, độ cong là uᵀHu"
    checks:
      - "(lambda t, x, y: sp.diff((x**2 + y**2 - x*y + x - y).subs({x: -Rational(1,3) + t, y: Rational(1,3)}), t, 2) == 2)(*sp.symbols('t x y'))"
      - "(Matrix([1, 0]).T * Matrix([[2, -1], [-1, 2]]) * Matrix([1, 0]))[0] == 2"
      - "(lambda t, x, y: sp.diff((x**2 + y**2 - x*y + x - y).subs({x: -Rational(1,3) + t/sp.sqrt(2), y: Rational(1,3) + t/sp.sqrt(2)}), t, 2) == 1)(*sp.symbols('t x y'))"
      - "sp.simplify((Matrix([1, 1]).T * Matrix([[2, -1], [-1, 2]]) * Matrix([1, 1]))[0] / 2) == 1"
    steps:
      - show: |
          <p>Đứng ở điểm dừng $\mathbf{x}^*$, đi theo hướng $\mathbf{u}$ ($\|\mathbf{u}\| = 1$) một đoạn $t$. Độ cao là hàm <b>một biến</b>:</p>$$k(t) = f(\mathbf{x}^* + t\,\mathbf{u})$$
          <p>Theo quy tắc chuỗi (bài 7: ngoài là $f$, trong là $\mathbf{x}^* + t\mathbf{u}$ có Jacobian $\mathbf{u}$):</p>$$k'(t) = \big(\nabla f(\mathbf{x}^* + t\mathbf{u})\big)^T\mathbf{u}, \qquad \text{nên } k'(0) = 0 \text{ vì } \nabla f(\mathbf{x}^*) = \mathbf{0}$$
        focus: [1, 2, [3, 4]]
        say: "Với nhiều biến, ta đứng ở điểm dừng rồi đi theo một hướng u dài 1 một đoạn t. Độ cao lúc đó là hàm một biến k của t. Theo quy tắc chuỗi của bài 7, đạo hàm của k là tích vô hướng của gradient với u, nên tại t bằng 0 nó bằng 0."
      - show: |
          <p>Lấy đạo hàm thêm lần nữa: theo bài 7, gradient đổi theo Jacobian của nó là $\mathbf{H}_f$, nên theo quy tắc chuỗi gradient thay đổi $\mathbf{H}_f\mathbf{u}$ mỗi đơn vị $t$:</p>
          $$k''(0) = \mathbf{u}^T\mathbf{H}_f\,\mathbf{u} \qquad \text{(độ cong theo hướng } \mathbf{u}\text{)}$$
        focus: [1, [1, 2], 2]
        say: "Lấy đạo hàm thêm lần nữa. Theo bài 7, Hessian là Jacobian của gradient, nên theo quy tắc chuỗi, đạo hàm cấp 2 của k tại 0 bằng u chuyển vị nhân Hessian nhân u. Đó là độ cong khi đi theo hướng u."
      - clear: true
        show: |
          <p class="note">Đang có: $\ k''(0) = \mathbf{u}^T\mathbf{H}_f\,\mathbf{u}$. &nbsp; Ví dụ chính của bài 6: $\ f = x^2 + y^2 - xy + x - y$, $\ \mathbf{H}_f = \begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$</p>
          <p><b>Làm thử ngay</b>, $\mathbf{u} = (1, 0)^T$: $\ \mathbf{u}^T\mathbf{H}_f\mathbf{u} = 2$ (ô góc trên trái).</p><p>Thay thẳng ($y$ cố định, $x$ đổi theo $t$): $\ k''(t) = 2\ \checkmark$</p>
          <p>$\mathbf{u} = \dfrac{(1, 1)^T}{\sqrt{2}}$: $\ \mathbf{u}^T\mathbf{H}_f\mathbf{u} = \dfrac{2 - 1 - 1 + 2}{2} = 1$; thay thẳng cũng được $\ k'' = 1\ \checkmark$</p>
        focus: [1, [2, 3], 4]
        say: "Làm thử ngay với hàm ví dụ chính của bài 6. Đi dọc trục x, công thức cho 2, đúng ô góc trên trái, và thay thẳng cũng ra 2. Đi theo hướng chéo 1, 1 chia căn 2, công thức cho 1, thay thẳng cũng ra 1."
      - show: |
          <div class="box key">Tại điểm dừng $\mathbf{x}^*$:
          <ul><li>$\mathbf{u}^T\mathbf{H}_f\mathbf{u} > 0$ với <b>mọi</b> hướng → cong lên mọi phía → <b>đáy</b> ($\mathbf{H}_f$ “xác định dương”)</li>
          <li>$\mathbf{u}^T\mathbf{H}_f\mathbf{u} < 0$ với mọi hướng → <b>đỉnh</b> (“xác định âm”)</li>
          <li>có hướng dương, có hướng âm → <b>yên ngựa</b> (“không xác định”)</li></ul></div>
        say: "Vậy theo phép thử một biến cho từng hướng, nếu độ cong dương theo mọi hướng thì là đáy, ta nói Hessian xác định dương. Âm theo mọi hướng là đỉnh. Có hướng dương, có hướng âm là yên ngựa."

  # ───────────────────────── 6. TRỊ RIÊNG ─────────────────────────
  - id: eig
    kind: formula
    title: "Không cần thử mọi hướng: nhìn trị riêng"
    checks:
      - "(lambda q1, q2: q1.dot(q2) == 0 and q1.norm() == 1 and q2.norm() == 1 and Matrix([[2,-1],[-1,2]])*q1 == 1*q1 and Matrix([[2,-1],[-1,2]])*q2 == 3*q2)(Matrix([1, 1])/sp.sqrt(2), Matrix([1, -1])/sp.sqrt(2))"
      - "(lambda a, b, l1, l2: sp.expand((a*Matrix([1,0]) + b*Matrix([0,1])).T * Matrix([[l1, 0], [0, l2]]) * (a*Matrix([1,0]) + b*Matrix([0,1])))[0] == l1*a**2 + l2*b**2)(*sp.symbols('a b l1 l2'))"
      - "(lambda u, q1, q2: sp.simplify(u.dot(q1)) == 1/sp.sqrt(2) and sp.simplify(u.dot(q2)) == 1/sp.sqrt(2) and sp.simplify(1*Rational(1,2) + 3*Rational(1,2)) == 2)(Matrix([1, 0]), Matrix([1, 1])/sp.sqrt(2), Matrix([1, -1])/sp.sqrt(2))"
    steps:
      - show: |
          <p>$\mathbf{H}_f$ đối xứng (bài 7) nên có hai vector riêng $\mathbf{q}_1, \mathbf{q}_2$ <b>vuông góc</b>, chuẩn hoá cho dài 1 (bài 5, bài 4), với trị riêng $\lambda_1, \lambda_2$.</p>
          <p>Theo bài 4, mọi hướng $\mathbf{u}$ viết được thành $\ \mathbf{u} = a\,\mathbf{q}_1 + b\,\mathbf{q}_2$, với $\ a = \mathbf{u}^T\mathbf{q}_1,\ b = \mathbf{u}^T\mathbf{q}_2$, &nbsp; $a^2 + b^2 = 1$ (Pytago).</p>
        focus: [0, 1, 2]
        say: "Thử mọi hướng thì quá nhiều. Hessian đối xứng, nên theo bài 5 nó có hai vector riêng vuông góc, ta chia cho độ dài để chúng dài 1 như bài 4. Theo bài 4, mọi hướng u là a lần vector thứ nhất cộng b lần vector thứ hai, với a bình phương cộng b bình phương bằng 1."
      - show: |
          <p>Vì $\ \mathbf{H}_f\mathbf{q}_1 = \lambda_1\mathbf{q}_1,\ \mathbf{H}_f\mathbf{q}_2 = \lambda_2\mathbf{q}_2$, &nbsp; và $\ \mathbf{q}_1^T\mathbf{q}_2 = 0,\ \mathbf{q}_1^T\mathbf{q}_1 = \mathbf{q}_2^T\mathbf{q}_2 = 1$:</p>
          $$\mathbf{u}^T\mathbf{H}_f\,\mathbf{u} = \lambda_1 a^2 + \lambda_2 b^2$$
        focus: ["1.1", "1.2", 2]
        say: "Nhân Hessian vào, theo định nghĩa trị riêng, mỗi vector riêng chỉ bị kéo giãn. Rồi nhân vô hướng với u, các tích chéo bằng 0 vì hai vector vuông góc. Kết quả, độ cong theo hướng u bằng lam-đa một nhân a bình phương cộng lam-đa hai nhân b bình phương."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \mathbf{u}^T\mathbf{H}_f\mathbf{u} = \lambda_1 a^2 + \lambda_2 b^2$, $\ a^2 + b^2 = 1$</p>
          <p><b>Làm thử ngay</b>: $\mathbf{H}_f = \begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$, $\ \lambda_1 = 1$ với $\mathbf{q}_1 = \dfrac{(1, 1)^T}{\sqrt{2}}$, $\ \lambda_2 = 3$ với $\mathbf{q}_2 = \dfrac{(1, -1)^T}{\sqrt{2}}$.</p>
          <p>$\mathbf{u} = (1, 0)^T$: $\ a = b = \dfrac{1}{\sqrt{2}}$, &nbsp; $1\cdot\dfrac{1}{2} + 3\cdot\dfrac{1}{2} = 2\ \checkmark$ &nbsp; (khớp phép thử dọc trục $x$)</p>
        focus: [2, 3]
        say: "Làm thử ngay với ví dụ, trị riêng là 1 và 3. Đi dọc trục x thì a và b đều bằng 1 chia căn 2, thay vào được 1 nhân một nửa cộng 3 nhân một nửa, bằng 2, khớp với phép thử lúc nãy."
      - show: |
          <table class="t"><tr><th>Trị riêng của $\mathbf{H}_f$ tại $\mathbf{x}^*$</th><th>Vì</th><th>Kết luận</th></tr>
          <tr><td>tất cả $> 0$</td><td>$\lambda_1 a^2 + \lambda_2 b^2 > 0$ mọi hướng</td><td><b>đáy</b></td></tr>
          <tr><td>tất cả $< 0$</td><td>$< 0$ mọi hướng</td><td><b>đỉnh</b></td></tr>
          <tr><td>có dương, có âm</td><td>đi theo $\mathbf{q}_1$ và $\mathbf{q}_2$ khác dấu</td><td><b>yên ngựa</b></td></tr>
          <tr><td>có trị riêng $= 0$</td><td>có hướng độ cong bằng 0</td><td><b>chưa kết luận</b></td></tr></table>
        say: "Từ công thức này, trị riêng dương hết thì dương theo mọi hướng, là đáy. Âm hết là đỉnh. Có dương có âm thì đi theo hai vector riêng cho hai dấu khác nhau, là yên ngựa. Còn có trị riêng bằng 0 thì chưa kết luận được."

  # ───────────────────────── 7. YÊN NGỰA & CHƯA KẾT LUẬN ─────────────────────────
  - id: saddle
    kind: intuition
    title: "Yên ngựa, và khi nào phép thử im lặng"
    checks:
      - "(lambda x, y: sp.hessian(x**2 - y**2, (x, y)) == Matrix([[2, 0], [0, -2]]) and Matrix([sp.diff(x**2 - y**2, v) for v in (x, y)]).subs({x: 0, y: 0}) == Matrix([0, 0]))(*sp.symbols('x y'))"
      - "Rational(1,10)**2 - 0 == Rational(1,100) and 0 - Rational(1,10)**2 == -Rational(1,100)"
      - "(lambda x, y: sp.hessian(x**4 + y**4, (x, y)).subs({x: 0, y: 0}) == sp.zeros(2, 2) and sp.hessian(x**4 - y**4, (x, y)).subs({x: 0, y: 0}) == sp.zeros(2, 2))(*sp.symbols('x y'))"
      - "Rational(1,10)**4 > 0 and -(Rational(1,10)**4) < 0"
      - "(lambda x, y: sp.diff((x**2 - y**2).subs(y, 0), x, 2) == 2 and sp.diff((x**2 - y**2).subs(x, 0), y, 2) == -2 and set(Matrix([[2, 0], [0, -2]]).eigenvals()) == {2, -2})(*sp.symbols('x y'))"
    steps:
      - show: |
          <p>$f(x, y) = x^2 - y^2$: &nbsp; $\nabla f = (2x,\ -2y)^T = \mathbf{0}$ tại $(0, 0)$, &nbsp; $\mathbf{H}_f = \begin{bmatrix} 2 & 0 \\ 0 & -2 \end{bmatrix}$, trị riêng $2$ và $-2$.</p>
          <p>Dọc trục $x$: $\ f(0{,}1;\ 0) = 0{,}01 > 0$ — đi lên.</p><p>Dọc trục $y$: $\ f(0;\ 0{,}1) = -0{,}01 < 0$ — đi xuống. &nbsp; → <b>yên ngựa</b> $\checkmark$</p>
        focus: ["1.1", "1.4", [2, 3]]
        say: "Ví dụ yên ngựa, f bằng x bình phương trừ y bình phương. Gradient bằng 0 tại gốc, Hessian có trị riêng 2 và âm 2. Thử bằng số, đi dọc trục x thì f tăng lên 0 phẩy 01, đi dọc trục y thì giảm còn âm 0 phẩy 01, đúng là yên ngựa."
      - clear: true
        show: |
          <svg width="1100" height="475" viewBox="0 0 1100 475"><line x1="50" y1="200" x2="470" y2="200" stroke="#9ca3af" stroke-width="2"/><polyline fill="none" stroke="#059669" stroke-width="5" points="60,20 70,38 80,54 90,70 100,85 110,99 120,112 130,124 140,135 150,146 160,155 170,164 180,171 190,178 200,184 210,189 220,193 230,196 240,198 250,200 260,200 270,200 280,198 290,196 300,193 310,189 320,184 330,178 340,171 350,164 360,155 370,146 380,135 390,124 400,112 410,99 420,85 430,70 440,54 450,38 460,20"/><circle cx="260" cy="200" r="9" fill="#e11d48"/><text x="260" y="240" font-size="22" text-anchor="middle" fill="#e11d48">(0, 0)</text><text x="260" y="425" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">đi dọc trục x: f = x²</text><text x="260" y="458" font-size="24" text-anchor="middle" fill="#1f2937">cong lên, độ cong 2</text><line x1="630" y1="200" x2="1050" y2="200" stroke="#9ca3af" stroke-width="2"/><polyline fill="none" stroke="#b91c1c" stroke-width="5" points="640,380 650,362 660,346 670,330 680,315 690,301 700,288 710,276 720,265 730,254 740,245 750,236 760,229 770,222 780,216 790,211 800,207 810,204 820,202 830,200 840,200 850,200 860,202 870,204 880,207 890,211 900,216 910,222 920,229 930,236 940,245 950,254 960,265 970,276 980,288 990,301 1000,315 1010,330 1020,346 1030,362 1040,380"/><circle cx="840" cy="200" r="9" fill="#e11d48"/><text x="840" y="175" font-size="22" text-anchor="middle" fill="#e11d48">(0, 0)</text><text x="840" y="425" font-size="26" font-weight="bold" text-anchor="middle" fill="#b91c1c">đi dọc trục y: f = −y²</text><text x="840" y="458" font-size="24" text-anchor="middle" fill="#1f2937">cong xuống, độ cong −2</text></svg>
        say: "Hình cắt mặt yên ngựa theo hai hướng, cùng đi qua điểm dừng ở gốc. Cắt dọc trục x, giữ y bằng 0, ta được đường x bình phương, cong lên như cái chén. Cắt dọc trục y, giữ x bằng 0, ta được đường trừ y bình phương, cong xuống như cái mũ. Hai độ cong 2 và âm 2 chính là hai trị riêng của Hessian. Một hướng cong lên, một hướng cong xuống, nên gốc không phải đáy, cũng không phải đỉnh."
      - clear: true
        show: |
          <div class="box warn"><b>Khi phép thử im lặng</b> (hay bị bỏ qua): ba hàm đều có điểm dừng $(0, 0)$ và $\mathbf{H}_f(0, 0) = \begin{bmatrix} 0 & 0 \\ 0 & 0 \end{bmatrix}$ (mọi trị riêng $= 0$):
          <br>$x^4 + y^4$ là <b>đáy</b> (luôn $\ge 0$); &nbsp; $-(x^4 + y^4)$ là <b>đỉnh</b>; &nbsp; $x^4 - y^4$ là <b>yên ngựa</b></div>
        say: "Giờ đến trường hợp hay bị bỏ qua. Ba hàm x mũ 4 cộng y mũ 4, số đối của nó, và x mũ 4 trừ y mũ 4, đều có Hessian bằng 0 tại gốc. Nhưng hàm đầu là đáy, hàm thứ hai là đỉnh, hàm thứ ba là yên ngựa."
      - show: |
          <p class="note">Cùng một Hessian, ba kết luận khác nhau → có trị riêng bằng 0 thì phải xét thêm (ví dụ thử giá trị quanh điểm đó). Không được vội nói “yên ngựa”.</p>
        say: "Cùng một Hessian mà ba kết luận khác nhau, nên khi có trị riêng bằng 0, phải xét thêm, ví dụ thử giá trị quanh điểm đó. Không được vội nói là yên ngựa."

  # ───────────────────────── 8. TIÊU CHUẨN ĐỊNH THỨC CON 2×2 ─────────────────────────
  - id: sylv2
    kind: formula
    title: "Tính nhanh: tiêu chuẩn định thức con (Sylvester) cho 2 biến"
    checks:
      - "(lambda a, b, c: Matrix([[a, b], [b, c]]).det() == a*c - b**2 and Matrix([[a, b], [b, c]]).trace() == a + c)(*sp.symbols('a b c'))"
      - "(lambda a, b, c, l: sp.expand(Matrix([[a - l, b], [b, c - l]]).det()) == sp.expand(l**2 - (a + c)*l + (a*c - b**2)))(*sp.symbols('a b c l'))"
      - "Matrix([[2, -1], [-1, 2]])[0, 0] == 2 and Matrix([[2, -1], [-1, 2]]).det() == 3 and sorted(Matrix([[2, -1], [-1, 2]]).eigenvals()) == [1, 3]"
      - "Matrix([[-2, 1], [1, -3]])[0, 0] == -2 and Matrix([[-2, 1], [1, -3]]).det() == 5 and all(e < 0 for e in Matrix([[-2, 1], [1, -3]]).eigenvals())"
    steps:
      - show: |
          <p>Hessian 2 biến, đối xứng: $\ \mathbf{H} = \begin{bmatrix} a & b \\ b & c \end{bmatrix}$. &nbsp; <b>Định thức con góc trên bên trái</b>:</p>
          $$\Delta_1 = a \ \text{(ô đầu)}, \qquad \Delta_2 = \det\mathbf{H} = ac - b^2 \ \text{(cả ma trận, theo bài 2)}$$
        focus: [0, "1.1", 2, 2]
        say: "Có cách tính nhanh hơn trị riêng. Viết Hessian hai biến là a, b, b, c. Định thức con thứ nhất là ô góc trên bên trái, bằng a. Định thức con thứ hai là định thức của cả ma trận, theo bài 2 là a nhân c trừ b bình phương."
      - show: |
          <p>Theo bài 5: $\ \lambda_1\lambda_2 = \Delta_2$ (tích trị riêng = định thức), &nbsp; $\lambda_1 + \lambda_2 = a + c$ (tổng đường chéo).</p>
          <ul><li>$\Delta_2 > 0 \implies$ hai trị riêng <b>cùng dấu</b>; và $ac > b^2 \ge 0 \implies a, c$ cùng dấu.</li>
          <li>Nếu thêm $\Delta_1 = a > 0 \implies c > 0 \implies \lambda_1 + \lambda_2 > 0 \implies$ cả hai dương $\implies$ <b>đáy</b>.</li>
          <li>Nếu $\Delta_1 = a < 0 \implies$ cả hai âm $\implies$ <b>đỉnh</b>.</li></ul>
        focus: [0, 1, "2.1", "2.2", "2.3"]
        say: "Vì sao dùng được? Theo bài 5, tích hai trị riêng bằng định thức, tổng bằng a cộng c. Định thức dương thì hai trị riêng cùng dấu, và a, c cùng dấu. Thêm a dương thì c dương, tổng dương, nên cả hai trị riêng dương, là đáy. Nếu a âm thì cả hai âm, là đỉnh."
      - clear: true
        show: |
          <table class="t"><tr><th>Điều kiện (2 biến)</th><th>Kết luận</th></tr>
          <tr><td>$\Delta_1 > 0,\ \Delta_2 > 0$</td><td><b>đáy</b> (xác định dương)</td></tr>
          <tr><td>$\Delta_1 < 0,\ \Delta_2 > 0$ &nbsp; (đan dấu)</td><td><b>đỉnh</b> (xác định âm)</td></tr>
          <tr><td>$\Delta_2 < 0$</td><td>hai trị riêng trái dấu → <b>yên ngựa</b></td></tr>
          <tr><td>$\Delta_2 = 0$</td><td>có trị riêng $0$ → <b>chưa kết luận</b></td></tr></table>
        say: "Theo lập luận vừa rồi, gom lại thành bảng. Hai định thức con đều dương là đáy. Cái thứ nhất âm, cái thứ hai dương, gọi là đan dấu, là đỉnh. Định thức âm thì hai trị riêng trái dấu, là yên ngựa. Định thức bằng 0 thì chưa kết luận."
      - show: |
          <p><b>Làm thử ngay</b>: $\begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$: $\ \Delta_1 = 2 > 0,\ \Delta_2 = 4 - 1 = 3 > 0$ → đáy; &nbsp; trị riêng $1, 3$ đều dương $\checkmark$</p>
          <p>$\begin{bmatrix} -2 & 1 \\ 1 & -3 \end{bmatrix}$: $\ \Delta_1 = -2 < 0,\ \Delta_2 = 6 - 1 = 5 > 0$ → đỉnh; &nbsp; trị riêng $\dfrac{-5 + \sqrt{5}}{2}$ và $\dfrac{-5 - \sqrt{5}}{2}$ đều âm $\checkmark$</p>
        focus: [1, 1, 2]
        say: "Làm thử ngay. Ma trận 2, âm 1, âm 1, 2 có hai định thức con là 2 và 3, đều dương, nên là đáy, khớp hai trị riêng dương 1 và 3. Ma trận âm 2, 1, 1, âm 3 có âm 2 và 5, đan dấu, nên là đỉnh, và tính thật thì hai trị riêng đều âm."

  # ───────────────────────── 9. 3 BIẾN ─────────────────────────
  - id: sylv3
    kind: formula
    title: "Ba biến: thêm định thức con thứ ba (định thức 3×3)"
    checks:
      - "Matrix([[2, 1, 0], [1, 2, 0], [0, 0, 2]]).det() == 6 and 2*2*2 + 1*0*0 + 0*1*0 - 0*2*0 - 1*1*2 - 2*0*0 == 6"
      - "Matrix([[2, 1], [1, 2]]).det() == 3 and all(e > 0 for e in Matrix([[2, 1, 0], [1, 2, 0], [0, 0, 2]]).eigenvals())"
      - "(lambda x, y, z: sp.hessian(x**2 + y**2 + z**2 + x*y, (x, y, z)) == Matrix([[2, 1, 0], [1, 2, 0], [0, 0, 2]]))(*sp.symbols('x y z'))"
      - "(lambda M: [M[:1, :1].det(), M[:2, :2].det(), M.det()] == [-2, 5, -10] and all(e < 0 for e in M.eigenvals()))(Matrix([[-2, 1, 0], [1, -3, 0], [0, 0, -2]]))"
      - "(lambda x, y: (lambda H: H[0, 0] == 0 and H.det() == 0)(sp.hessian(x**4 + y**4, (x, y)).subs({x: 0, y: 0})))(*sp.symbols('x y'))"
    steps:
      - show: |
          <p><b>Định thức 3×3</b> (quy tắc Sarrus): chép lại 2 cột đầu sang bên phải, rồi cộng 3 tích theo đường chéo <b class='green'>đi xuống</b>, trừ 3 tích theo đường chéo <b class='red'>đi lên</b>:</p>
          $$\begin{matrix} \hlg{2} & 1 & 0 & \color{gray}{2} & \color{gray}{1} \\ 1 & \hlg{2} & 0 & \color{gray}{1} & \color{gray}{2} \\ 0 & 0 & \hlg{2} & \color{gray}{0} & \color{gray}{0} \end{matrix} \qquad \text{xuống: } 2\cdot 2\cdot 2,\ \ 1\cdot 0\cdot 0,\ \ 0\cdot 1\cdot 0 \qquad \text{lên: } 0\cdot 2\cdot 0,\ \ 2\cdot 0\cdot 0,\ \ 1\cdot 1\cdot 2$$
          $$\det\begin{bmatrix} 2 & 1 & 0 \\ 1 & 2 & 0 \\ 0 & 0 & 2 \end{bmatrix} = (2\cdot 2\cdot 2 + 1\cdot 0\cdot 0 + 0\cdot 1\cdot 0) - (0\cdot 2\cdot 0 + 2\cdot 0\cdot 0 + 1\cdot 1\cdot 2) = 8 - 2 = 6$$
        focus: [1, 2, 3]
        say: "Với ba biến, ta dùng thêm định thức con thứ ba, là định thức ba nhân ba. Theo quy tắc chéo, chép lại hai cột đầu bên phải, cộng ba tích theo đường chéo đi xuống, trừ ba tích theo đường chéo đi lên. Ở đây được 8 trừ 2, bằng 6."
      - show: |
          <p>Ma trận trên là Hessian của $\ f = x^2 + y^2 + z^2 + xy$:</p>$$\Delta_1 = 2, \qquad \Delta_2 = \det\begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix} = 3, \qquad \Delta_3 = 6 \qquad \text{— dương hết → đáy}$$
        focus: [1, 2]
        say: "Ma trận này là Hessian của x bình phương cộng y bình phương cộng z bình phương cộng x y. Ba định thức con là 2, 3 và 6, dương hết, nên theo tiêu chuẩn định thức con, đây là đáy."
      - clear: true
        show: |
          <p class="note">Đang có: $\Delta_1, \Delta_2, \Delta_3$ đều dương thì là đáy; đan dấu âm, dương, âm thì là đỉnh (chiều ngược lại không luôn đúng: $x^4 + y^4$ là đáy dù mọi $\Delta = 0$).</p>
          <p class="note">Đỉnh: đan dấu $\ \Delta_1 < 0,\ \Delta_2 > 0,\ \Delta_3 < 0$. Ví dụ: $\ \begin{bmatrix} -2 & 1 & 0 \\ 1 & -3 & 0 \\ 0 & 0 & -2 \end{bmatrix}$ có $\ -2,\ 5,\ -10$ → đỉnh (kiểm bằng máy: ba trị riêng đều âm).</p>
          <div class="box warn">Tiêu chuẩn này chỉ dùng cho ma trận <b>đối xứng</b>, và chỉ kết luận được khi các định thức con <b>khác 0</b> (xác định <b>chặt</b>). Có định thức con bằng 0 → xét trị riêng, hoặc xét thêm như phần trên.</div>
        focus: [2, 3, 3]
        say: "Còn đan dấu âm, dương, âm thì là đỉnh, như ma trận ví dụ này với âm 2, 5, âm 10. Lưu ý, tiêu chuẩn này chỉ dùng cho ma trận đối xứng, và chỉ kết luận được khi các định thức con khác 0, vì lập luận lúc nãy cần định thức dương thật sự. Có cái bằng 0 thì phải xét trị riêng, hoặc xét thêm như phần trước."

  # ───────────────────────── 10. VÍ DỤ CỦA TÀI LIỆU ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ chính của bài 6: f = x² + y² − xy + x − y"
    checks:
      - "(lambda x, y: sp.solve([2*x - y + 1, 2*y - x - 1], [x, y]) == {x: -Rational(1,3), y: Rational(1,3)})(*sp.symbols('x y'))"
      - "2*(-Rational(1,3)) + 1 == Rational(1,3) and -(-Rational(1,3)) + 2*Rational(1,3) == 1"
      - "(lambda x, y: (x**2 + y**2 - x*y + x - y).subs({x: -Rational(1,3), y: Rational(1,3)}) == -Rational(1,3))(*sp.symbols('x y'))"
      - "Rational(1,9) + Rational(1,9) + Rational(1,9) - Rational(1,3) - Rational(1,3) == -Rational(1,3)"
      - "(lambda x, y, h1, h2: sp.expand((x**2 + y**2 - x*y + x - y).subs({x: -Rational(1,3) + h1, y: Rational(1,3) + h2}) - (-Rational(1,3)) - Rational(1,2)*(Matrix([h1, h2]).T*Matrix([[2,-1],[-1,2]])*Matrix([h1, h2]))[0]) == 0)(*sp.symbols('x y h1 h2'))"
    steps:
      - show: |
          <p>Đề: tìm cực trị của $\ f(x, y) = x^2 + y^2 - xy + x - y$.</p>
          <p><b>①</b> Bài 6 đã tính: $\ \nabla f = (2x - y + 1,\ 2y - x - 1)^T$. Điểm dừng: cho bằng $\mathbf{0}$, chuyển vế:</p>
          $$2x - y = -1, \qquad -x + 2y = 1$$
        focus: [1, "2.2", 3]
        say: "Giờ giải trọn hàm ví dụ chính của bài 6. Bước một, ở bài 6 ta đã tính gradient, gồm 2 x trừ y cộng 1, và 2 y trừ x trừ 1. Cho cả hai bằng 0 rồi chuyển vế, ta được hai phương trình."
      - show: |
          <p>Phương trình đầu cho $\ y = 2x + 1$; thay vào phương trình sau:</p>$$-x + 2(2x + 1) = 1 \implies 3x = -1 \implies x^* = -\dfrac{1}{3}, \qquad y^* = 2\cdot\left(-\dfrac{1}{3}\right) + 1 = \dfrac{1}{3}$$
          <p class="note">Điểm dừng duy nhất: $\left(-\dfrac{1}{3}, \dfrac{1}{3}\right)$.</p>
        focus: [1, [2, 3]]
        say: "Từ phương trình đầu, chuyển vế được y bằng 2 x cộng 1. Thay vào phương trình sau, được 3 x bằng âm 1, nên x sao bằng âm một phần ba, và y sao bằng một phần ba."
      - clear: true
        show: |
          <p class="note">Đang có: $\ f = x^2 + y^2 - xy + x - y$, điểm dừng $\ \mathbf{x}^* = \left(-\dfrac{1}{3}, \dfrac{1}{3}\right)$</p>
          <p><b>②</b> Hessian (bài 7): $\ \mathbf{H}_f = \begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$ ở mọi điểm. &nbsp; <b>③</b> $\Delta_1 = 2 > 0,\ \ \Delta_2 = 3 > 0$ → <b>đáy</b>.</p>
          <p><b>④</b> Giá trị, thay $x = -\dfrac{1}{3},\ y = \dfrac{1}{3}$: &nbsp; $x^2 = \dfrac{1}{9},\ \ y^2 = \dfrac{1}{9},\ \ -xy = \dfrac{1}{9},\ \ x = -\dfrac{1}{3},\ \ -y = -\dfrac{1}{3}$</p>$$f(\mathbf{x}^*) = \dfrac{3}{9} - \dfrac{2}{3} = \hlg{-\dfrac{1}{3}}$$
        focus: ["2.2", "2.4", 3, 4]
        say: "Bước hai, Hessian là 2, âm 1, âm 1, 2 ở mọi điểm. Bước ba, hai định thức con là 2 và 3, đều dương, nên đó là đáy. Bước bốn, thay vào f, ba số hạng đầu mỗi cái bằng một phần chín, hai số hạng sau mỗi cái bằng âm một phần ba. Cộng lại được âm một phần ba, là giá trị nhỏ nhất của hàm."
      - show: |
          <div class="box key"><b>Mạnh hơn cực tiểu địa phương</b>: $f$ chỉ có bậc 2, nên phép xấp xỉ bậc 2 đúng <b>tuyệt đối</b>: $\ f(\mathbf{x}^* + \mathbf{h}) = -\dfrac{1}{3} + \dfrac{1}{2}\,\mathbf{h}^T\mathbf{H}_f\mathbf{h}$ với <b>mọi</b> $\mathbf{h}$ (kiểm bằng máy).
          <br>Vì $\mathbf{H}_f$ xác định dương nên mọi điểm khác đều cao hơn → <b>cực tiểu toàn cục</b>.</div>
        say: "Ta còn kết luận được nhiều hơn một cực tiểu địa phương, vốn chỉ thấp nhất trong vùng gần đó. Hàm này chỉ có bậc 2, nên phép xấp xỉ bậc 2 đúng tuyệt đối với mọi bước h, không riêng bước nhỏ. Vì Hessian xác định dương, mọi điểm khác đều cao hơn, nên đây là cực tiểu toàn cục."

  # ───────────────────────── 11. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: bước nhỏ quanh đáy, và hai cách phải khớp nhau"
    checks:
      - "(lambda F: F(-Rational(1,3) + Rational(1,10), Rational(1,3)) == -Rational(1,3) + Rational(1,100) and F(-Rational(1,3) + Rational(1,10), Rational(1,3) + Rational(1,10)) == -Rational(1,3) + Rational(1,100))(lambda x, y: x**2 + y**2 - x*y + x - y)"
      - "Rational(1,2)*(Matrix([Rational(1,10), 0]).T*Matrix([[2,-1],[-1,2]])*Matrix([Rational(1,10), 0]))[0] == Rational(1,100) and Rational(1,2)*(Matrix([Rational(1,10), Rational(1,10)]).T*Matrix([[2,-1],[-1,2]])*Matrix([Rational(1,10), Rational(1,10)]))[0] == Rational(1,100)"
      - "(lambda F: F(-Rational(1,3) + Rational(1,10), Rational(1,3) - Rational(1,10)) == -Rational(1,3) + Rational(3,100))(lambda x, y: x**2 + y**2 - x*y + x - y)"
    steps:
      - show: |
          <p class="note">Đang có: $\ f(\mathbf{x}^*) = -\dfrac{1}{3}$, $\ f(\mathbf{x}^* + \mathbf{h}) = -\dfrac{1}{3} + \dfrac{1}{2}\,\mathbf{h}^T\mathbf{H}_f\mathbf{h}$</p>
          <p><b>Phép thử 1 — bước nhỏ quanh đáy phải cao hơn</b>:</p>
          <table class="t"><tr><th>$\mathbf{h}$</th><th>$\frac{1}{2}\mathbf{h}^T\mathbf{H}_f\mathbf{h}$</th><th>$f$ tính thẳng</th></tr>
          <tr><td>$(0{,}1;\ 0)^T$</td><td>$0{,}01$</td><td>$-\frac{1}{3} + 0{,}01\ \checkmark$</td></tr>
          <tr><td>$(0{,}1;\ 0{,}1)^T$</td><td>$0{,}01$</td><td>$-\frac{1}{3} + 0{,}01\ \checkmark$</td></tr>
          <tr><td>$(0{,}1;\ -0{,}1)^T$</td><td>$0{,}03$</td><td>$-\frac{1}{3} + 0{,}03\ \checkmark$</td></tr></table>
        focus: [0, 2, 3, "3.4"]
        say: "Tự kiểm tra như mọi bài. Phép thử một, theo công thức, bước nhỏ quanh đáy phải cao hơn. Ba bước thử đều cho f lớn hơn âm một phần ba, và tính thẳng khớp đúng công thức. Hướng 0 phẩy 1, âm 0 phẩy 1 tăng nhiều nhất, vì đó là hướng trị riêng 3."
      - clear: true
        show: |
          <p><b>Phép thử 2 — hai cách phải khớp</b>:</p>
          <table class="t"><tr><th>cách</th><th>các số</th><th>kết luận</th></tr>
          <tr><td>trị riêng</td><td>$1, 3$ (đều dương)</td><td><b>đáy</b></td></tr>
          <tr><td>định thức con</td><td>$2, 3$ (đều dương)</td><td><b>đáy</b> $\checkmark$</td></tr></table>
          <p class="note">Nếu hai cách cho kết luận khác nhau → đã tính sai Hessian, định thức, hoặc trị riêng.</p>
        focus: [1, 2, 3]
        say: "Phép thử hai, hai cách phải khớp nhau. Theo trị riêng 1 và 3, và theo định thức con 2 và 3, cả hai đều nói là đáy. Nếu hai cách khác nhau thì đã tính sai ở đâu đó."

  # ───────────────────────── 12. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Cực trị trong học máy"
    steps:
      - show: |
          <div class="box key">Bài 18 (dự đoán giá nhà bằng mô hình tuyến tính): hàm sai số bình phương có Hessian <b>không đổi</b>, giống ví dụ hôm nay. Khi không có đặc trưng nào là tổ hợp tuyến tính của các đặc trưng khác (hạng đầy đủ, bài 3), Hessian xác định dương → <b>chỉ có một đáy</b>, tìm được trực tiếp.</div>
        forward_ref: true
        say: "Trong học máy, ở bài 18, cách dự đoán giá nhà bằng mô hình tuyến tính có hàm sai số giống ví dụ hôm nay, Hessian không đổi. Khi không có đặc trưng nào là tổ hợp tuyến tính của các đặc trưng khác, tức hạng đầy đủ như bài 3, Hessian xác định dương, nên chỉ có một đáy, và tìm được trực tiếp."
      - show: |
          <table class="t"><tr><th>bài</th><th>dùng điểm dừng thế nào</th></tr>
          <tr><td><b>Bài 9</b> (Gradient Descent, xuống núi từng bước)</td><td>dừng khi gradient gần bằng 0 — tức tại một <b>điểm dừng</b>, có thể là đáy hay yên ngựa</td></tr>
          <tr><td><b>Bài 11</b> (phương pháp Newton)</td><td>dùng chính Hessian để bước nhanh về điểm dừng (hàm bậc 2 thì tới đúng chỗ chỉ sau một bước)</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3"]
        say: "Ở bài 9, thuật toán xuống núi từng bước dừng lại khi gradient gần bằng 0, tức tại một điểm dừng, và hôm nay ta biết điểm đó chưa chắc là đáy. Ở bài 11, có phương pháp dùng chính Hessian để bước nhanh về điểm dừng, và với hàm bậc 2 thì nó tới đúng chỗ chỉ sau một bước."

  # ───────────────────────── 13. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "Matrix([[-2, 0], [0, -3]]).det() == 6 and all(e < 0 for e in Matrix([[-2, 0], [0, -3]]).eigenvals())"
      - "(lambda x: sp.diff(x**3, x).subs(x, 0) == 0 and Rational(1,10)**3 > 0 and (-Rational(1,10))**3 < 0)(sp.Symbol('x'))"
      - "(lambda x, y: sp.hessian(x**4 + y**4, (x, y)).subs({x: 0, y: 0}) == sp.zeros(2, 2))(*sp.symbols('x y'))"
      - "Matrix([[0, 0], [0, -1]])[0, 0] == 0 and Matrix([[0, 0], [0, -1]]).det() == 0 and -1 in Matrix([[0, 0], [0, -1]]).eigenvals()"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1</b> (hay gặp nhất): chỉ nhìn định thức của cả ma trận <b class="red">(sai)</b>
          <br><span class="note">Ma trận chỉ có số $-2, -3$ trên đường chéo (các ô khác bằng 0) có định thức $(-2)\cdot(-3) = 6 > 0$, nhưng định thức con thứ nhất $\Delta_1 = -2$ là số âm; trị riêng $-2, -3$ → <b>đỉnh</b>, không phải đáy. Phải xét <b>mọi</b> định thức con.</span>
          $$\det = (-2)\cdot(-3) = 6 > 0 \qquad\text{nhưng}\qquad \Delta_1 = -2 < 0$$</div>
        say: "Lỗi thứ nhất, cũng là lỗi hay gặp nhất, là chỉ nhìn định thức của cả ma trận. Ma trận âm 2, âm 3 trên đường chéo có định thức 6, dương, nhưng định thức con thứ nhất âm, và đó là đỉnh chứ không phải đáy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Thấy gradient bằng $\mathbf{0}$ là kết luận ngay “cực trị” <b class="red">(sai)</b>
          <br><span class="note">$x^3$ tại $0$, và $x^2 - y^2$ tại $(0, 0)$: điểm dừng nhưng không phải đáy cũng không phải đỉnh.</span></div>
        say: "Lỗi thứ hai, thấy gradient bằng 0 là kết luận ngay có cực trị. Sai, vì x mũ 3 tại 0, hay x bình phương trừ y bình phương tại gốc, đều là điểm dừng nhưng không phải đáy hay đỉnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3</b>: “không thoả tiêu chuẩn → yên ngựa” <b class="red">(sai)</b>
          <br><span class="note">$x^4 + y^4$: Hessian tại $(0, 0)$ bằng 0, không thoả tiêu chuẩn nào, nhưng là <b>đáy</b>. Chỉ khi có trị riêng dương <b>và</b> trị riêng âm mới là yên ngựa.</span></div>
        say: "Lỗi thứ ba, nghĩ rằng không thoả tiêu chuẩn thì là yên ngựa. Sai, vì x mũ 4 cộng y mũ 4 có Hessian bằng 0 tại gốc, không thoả gì cả, nhưng lại là đáy. Chỉ khi có cả trị riêng dương và âm mới là yên ngựa."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng bản “lớn hơn hoặc bằng 0” của tiêu chuẩn <b class="red">(sai)</b>
          <br><span class="note">Ma trận chỉ có số $0, -1$ trên đường chéo (các ô khác bằng 0): $\ \Delta_1 = 0,\ \Delta_2 = 0$ đều $\ge 0$, nhưng có trị riêng $-1$ (cong xuống theo trục $y$). Tiêu chuẩn chỉ dùng khi định thức con <b>khác 0</b>.</span></div>
        say: "Lỗi thứ tư, nghĩ rằng các định thức con lớn hơn hoặc bằng 0 thì vẫn là đáy. Ma trận 0, 0, 0, âm 1 có hai định thức con đều bằng 0, nhưng có trị riêng âm 1, cong xuống theo trục y. Tiêu chuẩn chỉ dùng khi chúng khác 0."

  # ───────────────────────── 14. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda x, y: sp.solve([2*x + 4*y, 4*x + 2*y], [x, y]) == {x: 0, y: 0} and sp.hessian(x**2 + 4*x*y + y**2, (x, y)) == Matrix([[2, 4], [4, 2]]))(*sp.symbols('x y'))"
      - "Matrix([[2, 4], [4, 2]]).det() == -12 and (lambda t: sp.expand((t)**2 + 4*t*(-t) + (-t)**2) == -2*t**2)(sp.Symbol('t'))"
      - "(lambda x, y: sp.solve([-2*x + 4, -4*y], [x, y]) == {x: 2, y: 0} and sp.hessian(-x**2 - 2*y**2 + 4*x, (x, y)) == Matrix([[-2, 0], [0, -4]]) and (-x**2 - 2*y**2 + 4*x).subs({x: 2, y: 0}) == 4)(*sp.symbols('x y'))"
      - "Matrix([[-2, 0], [0, -4]]).det() == 8"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$q(x, y) = x^2 + 4xy + y^2$: tìm điểm dừng và phân loại.</td></tr>
          <tr><td>2</td><td>$r(x, y) = -x^2 - 2y^2 + 4x$: tìm điểm dừng, phân loại, và giá trị tại đó.</td></tr></table>
        say: "Đến lượt bạn, có hai câu. Một, với q bằng x bình phương cộng 4 x y cộng y bình phương, tìm điểm dừng và phân loại. Hai, với hàm thứ hai bằng trừ x bình phương trừ 2 y bình phương cộng 4 x, làm tương tự và tính giá trị. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\ \nabla q = (2x + 4y,\ 4x + 2y)^T = \mathbf{0}$: phương trình đầu cho $x = -2y$; thay vào: $-6y = 0$.</p><p>→ điểm dừng duy nhất $(0, 0)$.</p>
          <p>$\mathbf{H}_q = \begin{bmatrix} 2 & 4 \\ 4 & 2 \end{bmatrix}$, $\ \Delta_2 = 4 - 16 = \hl{-12} < 0$ → <b>yên ngựa</b>. Thử: dọc trục $x$, $q = t^2$ đi lên; theo hướng $(1, -1)$, $q = -2t^2$ đi xuống $\checkmark$</p>
        focus: [[1, 2], ["3.1", "3.2"], 3]
        say: "Đáp án câu một, gradient bằng 0 cho điểm dừng duy nhất là gốc. Hessian là 2, 4, 4, 2, định thức bằng 4 trừ 16, âm 12, nên là yên ngựa. Thử lại, dọc trục x thì đi lên, theo hướng 1, âm 1 thì đi xuống."
      - show: |
          <p>② $\ \nabla r = (-2x + 4,\ -4y)^T = \mathbf{0}$ → $(2, 0)$. &nbsp; $\mathbf{H}_r = \begin{bmatrix} -2 & 0 \\ 0 & -4 \end{bmatrix}$: $\ \Delta_1 = -2 < 0,\ \Delta_2 = 8 > 0$ (đan dấu) → <b>đỉnh</b>, &nbsp; $r(2, 0) = -4 + 8 = \hlg{4}$.</p>
        say: "Câu hai, gradient bằng 0 cho điểm 2, 0. Hessian có định thức con âm 2 và 8, đan dấu, nên là đỉnh, và giá trị tại đó bằng âm 4 cộng 8, bằng 4. Nếu bạn ra đúng, chúc mừng bạn."

