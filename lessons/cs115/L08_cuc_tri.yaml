id: L08
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 8 — Tìm cực trị: điểm dừng, độ cong & tiêu chuẩn định thức con"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L140-L142 (lỗi bỏ qua định thức con), L226 + L249 (x*, điểm dừng), L250-L262 (bảng xét dấu), L264-L279 (ví dụ cực trị)"
assumes: [vec, mat, sub, transpose, cdot, implies, iff, dots, zero_vec, norm, prime, partial, nabla, hessian, second_partial, det, lambda, identity, approx, sqrt]
# Quy ước ký hiệu của bài (lint kiểm, xem tools/registry/symbols.yaml):
#   điểm đang xét: x* (chữ in đậm khi là vector), đọc “x sao” (sym_star); Hessian: H_f in đậm như bài 7, viết gọn H khi
#   chỉ có một hàm; hướng đi: vector đơn vị u (‖u‖ = 1) như bài 6; định thức con góc trên bên trái: Δ₁, Δ₂, Δ₃ (sym_minor).
#   Ma trận đối xứng 2×2 tổng quát viết [[a, b], [b, c]] (không dùng chữ d: ASR L06 nghe “dây”).
#   Lời đọc KHÔNG đọc tên “Sylvester” và chữ “Δ” (chưa kiểm phát âm bằng ASR): nói “tiêu chuẩn định thức con”,
#   “định thức con thứ nhất / thứ hai”; bảng vẫn ghi tên Sylvester như tài liệu.
# Điểm bổ sung so với nguồn (audit, T5, T6, T21):
#   A1 (dòng 260): “không thoả tiêu chuẩn → yên ngựa” SAI — có trị riêng 0 thì chưa kết luận (x⁴ + y⁴: H = 0 nhưng là đáy) — phân cảnh zero, lỗi 2.
#   A2 (dòng 142, 258): tiêu chuẩn định thức con chỉ cho xác định CHẶT, ma trận đối xứng; bản “≥ 0” sai ([[0,0],[0,−1]]) — lỗi 4.
#   A4 (dòng 277): ví dụ là cực tiểu TOÀN CỤC, f* = −1/3 (Hessian hằng, xác định dương) — example.
#   Dòng 140: chỉ nhìn định thức toàn phần là sai (det > 0 vẫn có thể là đỉnh) — lỗi 1.
#   Với 2×2: det < 0 ⇒ yên ngựa là ĐÚNG (hai trị riêng trái dấu); dòng 260 sai ở chỗ gộp cả trường hợp có trị riêng 0.
# Kiến thức dùng lại (nói lại khi dùng, luật 17): bài 4 (toạ độ theo cơ sở trực chuẩn, Pytago), bài 5 (trị riêng, tích = định
#   thức, tổng = tổng đường chéo, ma trận đối xứng có vector riêng vuông góc), bài 6 (gradient, ∇f = 0 là chỗ bằng phẳng),
#   bài 7 (đạo hàm cấp 2, xấp xỉ bậc 2, Hessian = Jacobian của gradient, quy tắc chuỗi). Định thức 3×3 dạy mới ở sylv3.
objectives:
  - "Tìm điểm dừng bằng cách giải gradient bằng vector không"
  - "Dùng dấu đạo hàm cấp 2 (một biến) và dấu độ cong theo mọi hướng (nhiều biến) để phân loại đáy, đỉnh, yên ngựa"
  - "Suy ra phép thử bằng trị riêng và tiêu chuẩn định thức con 2×2 từ những gì đã học; tính định thức 3×3"
  - "Nhận ra khi nào phép thử CHƯA kết luận được (có trị riêng bằng 0)"
  - "Giải trọn ví dụ chính của bài 6 và chứng minh đó là điểm thấp nhất trên toàn mặt phẳng"
