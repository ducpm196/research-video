scenes:
- id: hook
  kind: hook
  title: Vì sao AI cần ma trận?
  steps:
  - show: '<p class="big">Bài 1: một ngôi nhà = một vector, ví dụ $(6, 2, 4)^T$.</p>

      <p>Nhưng dữ liệu thật có <b>hàng nghìn</b> ngôi nhà.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Chào bạn, mỗi ngôi nhà được ghi thành một vector, ví dụ 6, 2, 4, gồm diện tích, số phòng ngủ và khoảng cách tới trung tâm. Nhưng dữ liệu thật có hàng nghìn ngôi nhà. Ta cất chúng ở đâu cho gọn?
  - show: '<table class="t"><tr><th></th><th>Diện tích (chục m²)</th><th>Phòng ngủ</th><th>Cách trung tâm (km)</th></tr>

      <tr><td>Nhà 1</td><td>6</td><td>2</td><td>4</td></tr>

      <tr><td>Nhà 2</td><td>5</td><td>1</td><td>2</td></tr></table>

      <p>Xếp các ngôi nhà thành <b>một bảng số</b> → gọi là <b class="blue">ma trận</b>.</p>

      '
    focus:
    - 0
    - - '1.2'
      - '1.3'
    - 2
    say: Câu trả lời là xếp chúng thành một bảng. Mỗi hàng là một ngôi nhà, mỗi cột là một đặc trưng. Một bảng số như vậy gọi là ma trận.
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: hàng nhân cột, và giải phương trình với số'
  checks:
  - Matrix([[1,2]])*Matrix([3,4]) == Matrix([[11]])
  - Rational(1,2)*2 == 1 and Rational(1,2)*6 == 3 and 2*3 == 6
  - 1*5 == 5
  steps:
  - show: '$$\begin{bmatrix} \hlb{1} & \hlb{2} \end{bmatrix}\begin{bmatrix} \hlb{3} \\ \hlb{4} \end{bmatrix} = 1\cdot 3 + 2\cdot 4 = 11$$

      <p class="note">Bài 1: một <b>hàng</b> nhân một <b>cột</b> (cùng số phần tử) = nhân từng cặp rồi cộng → ra <b>một con số</b>.</p>

      '
    focus:
    - 0
    - 2
    - 1
    say: Trước tiên, ôn lại một phép tính của bài 1. Một hàng nhân một cột, có cùng số phần tử, là nhân từng cặp rồi cộng. Một nhân ba cộng hai nhân bốn bằng 11.
- id: sym_mat
  kind: symbol
  title: 'Giải mã ký hiệu: ma trận, kích thước, phần tử'
  checks:
  - Matrix([[6,2,4],[5,1,2]]).shape == (2, 3)
  - 2*3 == 6 and len(Matrix([[6,2,4],[5,1,2]])) == 6
  - Matrix([[6,2,4],[5,1,2]])[0,1] == 2 and Matrix([[6,2,4],[5,1,2]])[1,0] == 5 and Matrix([[6,2,4],[5,1,2]])[0,2] == 4
  - Matrix([6,2,4]).shape == (3, 1)
  steps:
  - show: '<div class="row"><div class="col">

      $$\mathbf{X} = \begin{bmatrix} 6 & 2 & 4 \\ 5 & 1 & 2 \end{bmatrix}$$</div>

      <div class="col"><ul><li>Chữ <b>hoa, in đậm</b> = một ma trận</li>

      <li><b>Hàng</b> nằm ngang, <b>cột</b> đứng dọc</li></ul></div></div>

      '
    introduces:
    - mat
    say: Ký hiệu đầu tiên. Bài 1 dùng chữ thường in đậm cho vector. Còn chữ cái hoa, in đậm, như chữ X đậm này, nghĩa là một ma trận. Hàng là các dòng nằm ngang, cột là các dòng đứng dọc.
  - show: '$$\mathbf{X} \in \mathbb{R}^{\sz{2}{3}}$$

      <p>$\sz{2}{3}$ đọc là “2 nhân 3” = <b>2 hàng, 3 cột</b> <span class="note">(luôn nói số hàng trước)</span></p>

      <p class="note">Dấu × ở đây chỉ <b>kích thước</b>, không phải phép tính. Phép nhân hai số vẫn dùng dấu chấm giữa dòng như bài 1.</p>

      '
    introduces:
    - dim
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Dòng này đọc là X thuộc R mũ 2 nhân 3. Nghĩa là X là một bảng số có 2 hàng và 3 cột, luôn nói số hàng trước, số cột sau. Dấu nhân chéo ở đây chỉ kích thước, không phải phép tính. Còn phép nhân hai số vẫn dùng dấu chấm giữa dòng.
  - clear: true
    show: '<p>Số ở <b>hàng $i$, cột $j$</b> viết là $x_{ij}$:</p>

      $$\mathbf{X} = \begin{bmatrix} 6 & \hlb{2} & \hlo{4} \\ \hlg{5} & 1 & 2 \end{bmatrix}: \qquad x_{12} = \hlb{2}, \qquad x_{21} = \hlg{5}, \qquad x_{13} = \hlo{4}$$

      <p class="note">$x_{12}$ đọc là “x một hai”: hàng 1, cột 2, <b>không phải</b> “x mười hai”. Chữ thường, không in đậm, vì đó là <b>một con số</b>.</p>

      '
    introduces:
    - sub2
    focus:
    - 1
    - 2
    - 2
    - 3
    say: Muốn chỉ một con số trong bảng, ta gắn hai chỉ số nhỏ ở dưới chân, số thứ nhất là hàng, số thứ hai là cột. x một hai là số ở hàng 1, cột 2, bằng 2. x hai một là số ở hàng 2, cột 1, bằng 5. Để ý, x một hai không phải x mười hai.
- id: transpose
  kind: concept
  title: 'Chuyển vị ma trận: hàng thành cột'
  checks:
  - Matrix([[6,2,4],[5,1,2]]).T == Matrix([[6,5],[2,1],[4,2]])
  - Matrix([[6,2,4],[5,1,2]]).T.shape == (3, 2)
  - Matrix([[6,2,4],[5,1,2]]).T[1,0] == Matrix([[6,2,4],[5,1,2]])[0,1] == 2
  - Matrix([[6,2,4],[5,1,2]]).T.T == Matrix([[6,2,4],[5,1,2]])
  steps:
  - show: '$$\mathbf{X} = \begin{bmatrix} \hlb{6} & \hlb{2} & \hlb{4} \\ 5 & 1 & 2 \end{bmatrix} \quad\xrightarrow{\ \text{chuyển vị}\ }\quad \mathbf{X}^T = \begin{bmatrix} \hlb{6} & 5 \\ \hlb{2} & 1 \\ \hlb{4} & 2 \end{bmatrix}$$

      '
    say: Ở bài 1, chữ T nhỏ xoay một vector cột thành vector hàng. Với ma trận, chữ T làm đúng việc đó. Hàng 1 của X, là 6, 2, 4, trở thành cột 1 của X chuyển vị.
  - show: '<ul><li>Kích thước đổi chỗ: $\ \mathbf{X} \in \mathbb{R}^{\sz{2}{3}} \implies \mathbf{X}^T \in \mathbb{R}^{\sz{3}{2}}$</li>

      <li>Hàng 2, cột 1 của $\mathbf{X}^T$ chính là $x_{12} = 2$ (đổi chỗ hai chỉ số)</li>

      <li>Chuyển vị hai lần thì về như cũ: $\ (\mathbf{X}^T)^T = \mathbf{X}$</li></ul>

      '
    say: 'Vì hàng biến thành cột, nên kích thước cũng đổi chỗ: X có 2 hàng 3 cột thì X chuyển vị có 3 hàng 2 cột.'
- id: matvec
  kind: concept
  title: 'Ma trận nhân vector: mỗi hàng nhân với vector'
  checks:
  - Matrix([[6,2,4],[5,1,2]])*Matrix([2,1,-1]) == Matrix([10,9])
  - 6*2 + 2*1 + 4*(-1) == 10 and 5*2 + 1*1 + 2*(-1) == 9
  - (Matrix([[6,2,4],[5,1,2]])*Matrix([2,1,-1])).shape == (2, 1)
  steps:
  - show: '$$\text{giá} = \hlb{2}\cdot\text{diện tích} + \hlb{1}\cdot\text{phòng ngủ} + (\hlb{-1})\cdot\text{khoảng cách}$$

      <p>Gom 3 trọng số thành vector: $\ \mathbf{w} = (2, 1, -1)^T$ &nbsp;<span class="note">(giá tính theo trăm triệu đồng)</span></p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Giả sử một mô hình dự đoán giá nhà như sau, tính theo trăm triệu đồng. Mỗi chục mét vuông cộng 2, mỗi phòng ngủ cộng 1, và mỗi cây số xa trung tâm thì trừ 1. Ba con số 2, 1, âm 1 gọi là trọng số, gom lại thành vector w.
  - show: '$$\mathbf{X}\mathbf{w} = \begin{bmatrix} \hlb{6} & \hlb{2} & \hlb{4} \\ 5 & 1 & 2 \end{bmatrix}\begin{bmatrix} 2 \\ 1 \\ -1 \end{bmatrix} = \begin{bmatrix} \hlb{6\cdot 2 + 2\cdot 1 + 4\cdot(-1)} \\ 5\cdot 2 + 1\cdot 1 + 2\cdot(-1) \end{bmatrix} = \begin{bmatrix} \hlg{10} \\ \hlg{9} \end{bmatrix}$$

      '
    say: Ma trận X nhân vector w, viết sát nhau là X w. Lấy từng hàng của X nhân với w. Hàng 1, 6 nhân 2, cộng 2 nhân 1, cộng 4 nhân âm 1, bằng 10. Hàng 2, 5 nhân 2, cộng 1 nhân 1, cộng 2 nhân âm 1, bằng 9.
  - clear: true
    show: '<p><b>Phép thử kích thước:</b> số cột của $\mathbf{X}$ phải bằng số phần tử của $\mathbf{w}$.</p>

      $$\underbrace{\mathbf{X}}_{\sz{2}{\hlb{3}}}\ \underbrace{\mathbf{w}}_{\sz{\hlb{3}}{1}} \;=\; \underbrace{\mathbf{X}\mathbf{w}}_{\sz{2}{1}}$$

      <p class="note">Hai số <b>ở trong</b> phải bằng nhau (3 và 3); hai số <b>ở ngoài</b> cho kích thước kết quả.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: 'Phép nhân này chỉ làm được khi số cột của X bằng số phần tử của w. Viết kích thước cạnh nhau, 2 nhân 3, rồi 3 nhân 1: hai số ở trong phải bằng nhau. Hai số ở ngoài cho kích thước kết quả, 2 nhân 1.'
- id: matmul
  kind: example
  title: 'Nhân hai ma trận: hàng của A nhân cột của B'
  checks:
  - Matrix([[1,2],[0,1]])*Matrix([[3,1],[1,2]]) == Matrix([[5,5],[1,2]])
  - 1*3 + 2*1 == 5 and 1*1 + 2*2 == 5 and 0*3 + 1*1 == 1 and 0*1 + 1*2 == 2
  - Matrix([[3,1],[1,2]])*Matrix([1,1]) == Matrix([4,3]) and Matrix([[1,2],[0,1]])*Matrix([4,3]) == Matrix([10,3])
  - Matrix([[5,5],[1,2]])*Matrix([1,1]) == Matrix([10,3])
  - Matrix([[3,1],[1,2]])*Matrix([[1,2],[0,1]]) == Matrix([[3,7],[1,4]]) and Matrix([[3,7],[1,4]]) != Matrix([[5,5],[1,2]])
  steps:
  - show: '<p>Số ở <b>hàng $i$, cột $j$</b> của $\mathbf{A}\mathbf{B}$ = <b>hàng $i$ của $\mathbf{A}$</b> nhân <b>cột $j$ của $\mathbf{B}$</b>.</p>

      $$\mathbf{A} = \begin{bmatrix} 1 & 2 \\ 0 & 1 \end{bmatrix}, \qquad \mathbf{B} = \begin{bmatrix} 3 & 1 \\ 1 & 2 \end{bmatrix}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Bây giờ nhân hai ma trận với nhau. Quy tắc chỉ có một câu. Số ở hàng i, cột j của A B bằng hàng i của A nhân với cột j của B, theo kiểu hàng nhân cột. Ta thử với hai ma trận 2 nhân 2 này.
  - clear: true
    show: '<div><svg width="1500" height="390" viewBox="0 0 1500 390"><text x="240" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">A</text><rect x="120" y="75" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="180" y="147" font-size="40" text-anchor="middle" fill="#1f2937">1</text><rect x="240" y="75" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="300" y="147" font-size="40" text-anchor="middle" fill="#1f2937">2</text><rect x="120" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="180" y="267" font-size="40" text-anchor="middle" fill="#1f2937">0</text><rect x="240" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="300" y="267" font-size="40" text-anchor="middle" fill="#1f2937">1</text><text x="640" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">B</text><rect x="520" y="75" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="580" y="147" font-size="40" text-anchor="middle" fill="#1f2937">3</text><rect x="640" y="75" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="700" y="147" font-size="40" text-anchor="middle" fill="#1f2937">1</text><rect x="520" y="195" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="580" y="267" font-size="40" text-anchor="middle" fill="#1f2937">1</text><rect x="640" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="700" y="267" font-size="40" text-anchor="middle" fill="#1f2937">2</text><text x="880" y="210" font-size="48" text-anchor="middle" fill="#1f2937">=</text><text x="1100" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">AB</text><rect x="980" y="75" width="120" height="120" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="1040" y="147" font-size="40" text-anchor="middle" fill="#1f2937">5</text><rect x="1100" y="75" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1160" y="147" font-size="40" text-anchor="middle" fill="#1f2937">?</text><rect x="980" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1040" y="267" font-size="40" text-anchor="middle" fill="#1f2937">?</text><rect x="1100" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1160" y="267" font-size="40" text-anchor="middle" fill="#1f2937">?</text><g font-size="26" fill="#1f2937"><text x="120" y="365">hàng 1 của A: (1, 2)</text><text x="520" y="365">cột 1 của B: (3, 1)</text><text x="980" y="365" fill="#15803d">1 nhân 3 + 2 nhân 1 = 5</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình này cho thấy một ô của kết quả được làm ra thế nào. Hàng 1 của A và cột 1 của B được tô xanh, cho ra đúng một ô của A B, ô màu lục ở hàng 1, cột 1. Nhân từng cặp rồi cộng, 1 nhân 3 cộng 2 nhân 1, được 5. Ba ô dấu hỏi còn lại làm cùng cách.
  - show: '<p>Hàng 1, cột 2: $\ 1\cdot 1 + 2\cdot 2 = \hlg{5}$</p>

      '
    say: Hàng 1 của A nhân cột 2 của B, tức là 1, 2 nhân với 1, 2, được 1 cộng 4, bằng 5.
  - show: '<p>Hàng 2, cột 1: $\ 0\cdot 3 + 1\cdot 1 = \hlg{1}$ &nbsp;&nbsp; Hàng 2, cột 2: $\ 0\cdot 1 + 1\cdot 2 = \hlg{2}$</p>

      '
    say: Hàng 2 của A là 0, 1, nhân với cột 1 của B được 1, nhân với cột 2 được 2.
  - show: '$$\mathbf{A}\mathbf{B} = \begin{bmatrix} \hlg{5} & \hlg{5} \\ \hlg{1} & \hlg{2} \end{bmatrix}$$

      '
    say: Ghép bốn số lại, A B là ma trận có hàng trên 5, 5, và hàng dưới 1, 2.
  - clear: true
    show: '<p><b>Phép thử kích thước</b> vẫn y hệt:</p>

      $$\underbrace{\mathbf{A}}_{\sz{m}{\hlb{n}}}\ \underbrace{\mathbf{B}}_{\sz{\hlb{n}}{p}} \;=\; \underbrace{\mathbf{A}\mathbf{B}}_{\sz{m}{p}}$$

      <p class="note">Số ở trong bằng nhau, số ở ngoài là kích thước kết quả. Ma trận nhân vector là trường hợp $\mathbf{B}$ chỉ có 1 cột.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 3
    say: Phép thử kích thước vẫn y hệt. A có M hàng, N cột. B phải có đúng N hàng, để mỗi hàng của A dài bằng mỗi cột của B. Kết quả có M hàng, P cột. Thực ra, ma trận nhân vector chỉ là trường hợp B có đúng 1 cột.
  - clear: true
    show: '<p><b>Nhân lần lượt hay gộp trước đều như nhau:</b> $\ (\mathbf{A}\mathbf{B})\,\mathbf{x} = \mathbf{A}\,(\mathbf{B}\mathbf{x})$</p>

      <p>Với $\ \mathbf{A} = \begin{bmatrix} 1 & 2 \\ 0 & 1 \end{bmatrix},\ \ \mathbf{B} = \begin{bmatrix} 3 & 1 \\ 1 & 2 \end{bmatrix},\ \ \mathbf{A}\mathbf{B} = \begin{bmatrix} 5 & 5 \\ 1 & 2 \end{bmatrix}\ $ ở trên, thử $\ \mathbf{x} = (1, 1)^T$:</p>

      <p>$\mathbf{B}\mathbf{x} = (3 + 1,\ 1 + 2)^T = (4, 3)^T$, &nbsp; $\mathbf{A}\,(4, 3)^T = (4 + 6,\ 3)^T = (10, 3)^T$</p>

      <p>$(\mathbf{A}\mathbf{B})\,\mathbf{x} = (5 + 5,\ 1 + 2)^T = (10, 3)^T\ \checkmark$</p>

      '
    focus:
    - 0
    - 1
    - 2
    - 3
    - 4
    say: Thêm một tính chất ta sẽ cần ở phần nghịch đảo. Khi nhân ba thứ liên tiếp, nhân hai cái đầu trước hay hai cái sau trước đều cho cùng kết quả. Thử với A, B ở trên và x bằng 1, 1. B x bằng 4, 3, rồi A nhân 4, 3 bằng 10, 3. Còn A B nhân x cũng bằng 10, 3, khớp nhau.
  - clear: true
    show: '<div class="box warn">Đổi thứ tự thường cho <b>kết quả khác</b>:

      $$\mathbf{B}\mathbf{A} = \begin{bmatrix} 3 & 7 \\ 1 & 4 \end{bmatrix} \;\neq\; \mathbf{A}\mathbf{B} = \begin{bmatrix} 5 & 5 \\ 1 & 2 \end{bmatrix}$$</div>

      '
    say: Nhưng khác với nhân hai số, đổi thứ tự hai ma trận thường cho kết quả khác. B A có hàng trên 3, 7 và hàng dưới 1, 4, không bằng A B.
  - show: '<p><b>Chạy thử Python — kiểm chứng tích hai ma trận phụ thuộc thứ tự:</b></p><div class="code"><div>mul = lambda A, B: [[sum(A[i][k]*B[k][j] for k in range(2)) for j in range(2)] for i in range(2)]</div><div>A, B = [[1, 2], [0, 1]], [[1, 0], [3, 1]]</div><div>print(mul(A, B), mul(B, A))</div></div>'
    say: Chạy thử Python xác nhận nhân A B khác hẳn B A trên cùng cặp ma trận.
    clear: true
    focus: null
- id: identity
  kind: symbol
  title: 'Giải mã ký hiệu: ma trận đơn vị — “số 1” của ma trận'
  checks:
  - sp.eye(2) == Matrix([[1,0],[0,1]]) and sp.eye(3) == Matrix([[1,0,0],[0,1,0],[0,0,1]])
  - sp.eye(2)*Matrix([3,5]) == Matrix([3,5]) and 1*3 + 0*5 == 3 and 0*3 + 1*5 == 5
  - Matrix([[1,2],[0,1]])*sp.eye(2) == Matrix([[1,2],[0,1]]) and sp.eye(2)*Matrix([[1,2],[0,1]]) == Matrix([[1,2],[0,1]])
  - 3*sp.eye(2) == Matrix([[3,0],[0,3]])
  steps:
  - show: '$$\mathbf{I}_2 = \begin{bmatrix} \hlg{1} & 0 \\ 0 & \hlg{1} \end{bmatrix}, \qquad \mathbf{I}_3 = \begin{bmatrix} \hlg{1} & 0 & 0 \\ 0 & \hlg{1} & 0 \\ 0 & 0 & \hlg{1} \end{bmatrix}$$

      <ul><li>Số 1 trên <b>đường chéo chính</b> (góc trên bên trái → góc dưới bên phải), số 0 ở mọi chỗ khác</li>

      <li>Số nhỏ dưới chân là kích thước: $\mathbf{I}_2$ cỡ $\sz{2}{2}$, $\mathbf{I}_3$ cỡ $\sz{3}{3}$</li>

      <li>Số hàng bằng số cột: <b>ma trận vuông</b></li></ul>

      '
    introduces:
    - identity
    focus:
    - 1
    - '2.1'
    - '2.2'
    - '2.3'
    say: Chữ I hoa in đậm là ma trận đơn vị. Nó có số 1 nằm trên đường chéo chính, tức là đường đi từ góc trên bên trái xuống góc dưới bên phải, và số 0 ở mọi chỗ khác. Số nhỏ dưới chân cho biết kích thước, I hai là 2 nhân 2. Ma trận có số hàng bằng số cột như vậy gọi là ma trận vuông.
  - clear: true
    show: '$$\mathbf{I}_2\,(3, 5)^T = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 3 \\ 5 \end{bmatrix} = \begin{bmatrix} 1\cdot 3 + 0\cdot 5 \\ 0\cdot 3 + 1\cdot 5 \end{bmatrix} = \begin{bmatrix} 3 \\ 5 \end{bmatrix}$$

      '
    say: 'Vì sao gọi nó là số 1 của ma trận? Nhân I hai với vector 3, 5: hàng 1 là 1 nhân 3 cộng 0 nhân 5, bằng 3; hàng 2 là 0 nhân 3 cộng 1 nhân 5, bằng 5. Vector giữ nguyên, như 1 nhân 5 vẫn bằng 5.'
- id: inverse
  kind: formula
  title: 'Ma trận nghịch đảo: “chia” cho một ma trận — từng bước có lý do'
  checks:
  - Rational(2)**-1 == Rational(1,2) and Rational(1,2)*2 == 1
  - Matrix([[1,-1],[-1,2]])*Matrix([[2,1],[1,1]]) == sp.eye(2) and Matrix([[2,1],[1,1]])*Matrix([[1,-1],[-1,2]]) == sp.eye(2)
  - 1*2 + (-1)*1 == 1 and 1*1 + (-1)*1 == 0 and (-1)*2 + 2*1 == 0 and (-1)*1 + 2*1 == 1
  - '(lambda a, b, c, d: sp.expand(Matrix([[d,-b],[-c,a]])*Matrix([[a,b],[c,d]]) - (a*d - b*c)*sp.eye(2)) == sp.zeros(2, 2))(*sp.symbols(''a b c d''))'
  - '(lambda a, b, c, d: sp.simplify(Matrix([[a,b],[c,d]]).inv() - Matrix([[d,-b],[-c,a]])/(a*d - b*c)) == sp.zeros(2, 2))(*sp.symbols(''a b c d''))'
  - 2*1 - 1*1 == 1 and Matrix([[2,1],[1,1]]).inv() == Matrix([[1,-1],[-1,2]])
  steps:
  - show: '<p>Với số: $\ 2^{-1} = \dfrac{1}{2}$, &nbsp; vì $\ 2^{-1}\cdot 2 = 1$</p>

      <p class="note">Mũ $-1$, đọc là “mũ trừ một” = <b>nghịch đảo</b>: thứ nhân vào để ra 1.</p>

      '
    introduces:
    - inverse
    focus:
    - 0
    - 1
    - 1
    - 2
    say: Nhớ lại phương trình 2 nhân w bằng 6. Ta giải bằng cách nhân với số nghịch đảo của 2, là một phần hai. Trong toán, số nghịch đảo của 2 còn được viết là 2 mũ trừ một. Mũ trừ một nghĩa là thứ nhân vào để ra 1.
  - show: '<div class="box key">Ma trận nghịch đảo của $\mathbf{M}$, viết $\mathbf{M}^{-1}$, là ma trận thoả:

      $$\mathbf{M}^{-1}\mathbf{M} = \mathbf{M}\,\mathbf{M}^{-1} = \mathbf{I}_2$$</div>

      '
    say: Với ma trận cũng vậy. Ma trận nghịch đảo của M, viết là M mũ trừ một, đọc là M nghịch đảo, là ma trận mà nhân với M thì ra ma trận đơn vị, tức là số 1 của ma trận. Nhân bên trái hay bên phải đều phải ra I hai.
  - clear: true
    show: '<p><b>Giải</b> $\ \mathbf{M}\hlo{\mathbf{w}} = \mathbf{b}\ $ (biết $\mathbf{M}$ và $\mathbf{b}$, tìm $\hlo{\mathbf{w}}$):</p>

      <p><b>Bước 1.</b> Nhân <b>bên trái</b> cả hai vế với $\mathbf{M}^{-1}$: $\ \mathbf{M}^{-1}(\mathbf{M}\hlo{\mathbf{w}}) = \mathbf{M}^{-1}\mathbf{b}$</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Giờ dùng nó để giải phương trình M nhân w bằng b, với M và b đã biết, còn w là vector cần tìm. Bước một, nhân cả hai vế với M nghịch đảo. Phải nhân cùng một phía là bên trái, vì đổi thứ tự thì kết quả khác.
  - show: '<p><b>Bước 2.</b> Gộp hai cái đầu trước: $\ (\mathbf{M}^{-1}\mathbf{M})\,\hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b}$</p>

      '
    say: Bước hai, theo tính chất vừa học, nhân hai cái đầu trước cũng được, nên ta gộp M nghịch đảo với M lại.
  - show: '<p><b>Bước 3.</b> Thay $\mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$: $\ \mathbf{I}_2\,\hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b} \implies \hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b}$</p>

      '
    say: Bước ba, theo định nghĩa, M nghịch đảo nhân M bằng I hai. Mà I hai nhân w vẫn là w, nên suy ra w bằng M nghịch đảo nhân b. Giống hệt w bằng 2 mũ trừ một nhân 6 ở phương trình với số.
  - clear: true
    show: '<p><b>Tìm $\mathbf{M}^{-1}$ cho ma trận $\sz{2}{2}$.</b> Thử với $\ \mathbf{M} = \begin{bmatrix} \hlb{2} & 1 \\ 1 & \hlb{1} \end{bmatrix}$:

      <b>đổi chỗ</b> hai số trên đường chéo chính, <b>đổi dấu</b> hai số còn lại:</p>

      $$\mathbf{N} = \begin{bmatrix} \hlb{1} & -1 \\ -1 & \hlb{2} \end{bmatrix}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Còn lại câu hỏi, tìm M nghịch đảo thế nào? Với ma trận 2 nhân 2, ta làm theo một mẹo mà phép nhân kiểm tra được ngay. Lấy M có hàng trên 2, 1, hàng dưới 1, 1. Đổi chỗ hai số trên đường chéo chính, rồi đổi dấu hai số còn lại. Ta được ma trận N, hàng trên 1, âm 1, hàng dưới âm 1, 2.
  - show: '$$\mathbf{N}\mathbf{M} = \begin{bmatrix} 1\cdot 2 + (-1)\cdot 1 & 1\cdot 1 + (-1)\cdot 1 \\ (-1)\cdot 2 + 2\cdot 1 & (-1)\cdot 1 + 2\cdot 1 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix} = \mathbf{I}_2\ \checkmark$$

      '
    say: Kiểm tra theo định nghĩa, nhân N với M, hàng nhân cột. Ta được hàng trên 1, 0, hàng dưới 0, 1, đúng bằng I hai. Vậy với ma trận này, N chính là M nghịch đảo.
  - show: '<p>$\mathbf{M} = \begin{bmatrix} a & b \\ c & d \end{bmatrix}$, &nbsp; $\mathbf{N} = \begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$ (theo mẹo)</p>

      $$\mathbf{N}\mathbf{M} = \begin{bmatrix} da - bc & db - bd \\ -ca + ac & -cb + ad \end{bmatrix} = (ad - bc)\,\mathbf{I}_2$$

      <div class="box key">Chia cho $ad - bc$ (cần $\neq 0$, gọi là <b>định thức</b> của $\mathbf{M}$): &nbsp; $\mathbf{M}^{-1} = \dfrac{1}{ad - bc}\begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$. Với $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$ lúc nãy: $\ 2 \cdot 1 - 1 \cdot 1 = 1$, nên $\mathbf{M}^{-1} = \mathbf{N}$.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Viết M tổng quát có hàng trên a, b và hàng dưới c, d, còn N theo mẹo. Nhân N với M, hai số ngoài đường chéo bằng 0, hai số trên đường chéo đều bằng a d trừ b c. Nên N M bằng a d trừ b c, nhân I hai. Muốn ra đúng I hai, ta chia N cho a d trừ b c, gọi là định thức của M, và chỉ chia được khi nó khác 0. Với M ở trên, định thức bằng 1, nên M nghịch đảo đúng bằng N.
    clear: true
  - show: '$$\mathbf{w} = \mathbf{M}^{-1}\mathbf{b} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}\begin{bmatrix} 5 \\ 3 \end{bmatrix} = \begin{bmatrix} 1 \cdot 5 - 1 \cdot 3 \\ -1 \cdot 5 + 2 \cdot 3 \end{bmatrix} = \begin{bmatrix} 2 \\ 1 \end{bmatrix}$$

      '
    say: Thử giải bằng số. Vì w bằng M nghịch đảo nhân b, với M như trên và b bằng 5, 3. Hàng một của w là 1 nhân 5 cộng âm 1 nhân 3, bằng 2. Hàng hai là âm 1 nhân 5 cộng 2 nhân 3, bằng 1. Vậy w bằng 2, 1.
    clear: true
- id: verify
  kind: check
  title: Phép thử để tự biết mình làm đúng
  checks:
  - Matrix([[1,-1],[-1,2]])*Matrix([[2,1],[1,1]]) == sp.eye(2)
  - Matrix([[2,1],[1,1]])*Matrix([2,1]) == Matrix([5,3]) and 2*2 + 1*1 == 5 and 1*2 + 1*1 == 3
  - (Matrix([[2,1],[1,1]])*Matrix([2,1])).shape == (2, 1)
  steps:
  - show: '<p><b>Phép thử 1 — nhân lại phải ra $\mathbf{I}_2$:</b></p>

      $$\mathbf{M}^{-1}\mathbf{M} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix} = \begin{bmatrix} 2 - 1 & 1 - 1 \\ -2 + 2 & -1 + 2 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}\ \checkmark$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Như ở bài 1, ta luôn tự kiểm tra. Phép thử một, theo định nghĩa, M nghịch đảo nhân M phải bằng I hai. Nhân hàng với cột, ta được hàng trên 1, 0, hàng dưới 0, 1, đúng là ma trận đơn vị.
- id: singular
  kind: concept
  title: Khi nào KHÔNG có nghịch đảo?
  checks:
  - 1*4 - 2*2 == 0 and Matrix([[1,2],[2,4]]).det() == 0
  - Matrix([[1,2],[2,4]]).row(1) == 2*Matrix([[1,2],[2,4]]).row(0)
  - Matrix([[1,2],[2,4]])*Matrix([3,0]) == Matrix([3,6]) and Matrix([[1,2],[2,4]])*Matrix([1,1]) == Matrix([3,6])
  - Matrix([[1,2],[2,4]]).rank() < 2
  steps:
  - show: '$$\mathbf{S} = \begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}: \qquad ad - bc = 1\cdot 4 - 2\cdot 2 = \hl{0}$$

      <p class="note">Hàng 2 gấp đôi hàng 1 → hai phương trình thực chất chỉ là <b>một</b>.</p>

      '
    focus:
    - 0
    - 1
    - 1
    - 2
    say: Không phải ma trận nào cũng có nghịch đảo. Xét ma trận S, hàng trên 1, 2, hàng dưới 2, 4. Định thức bằng 1 nhân 4 trừ 2 nhân 2, bằng 0, nên công thức phải chia cho 0. Để ý hàng 2 gấp đôi hàng 1, nên hai phương trình thực chất chỉ là một.
  - show: '<p>Hai vector <b>khác nhau</b> cho <b>cùng</b> kết quả: $\ \mathbf{S}\,(3, 0)^T = (3, 6)^T, \quad \mathbf{S}\,(1, 1)^T = (3, 6)^T$</p>

      <div class="box warn">Từ $(3, 6)^T$ không thể biết ngược lại ta bắt đầu từ vector nào → <b>không có</b> $\mathbf{S}^{-1}$.</div>

      '
    focus:
    - '1.3'
    - '1.3'
    - 2
    - 2
    say: Thử nhân S với vector 3, 0, được 3, 6. Nhân S với vector 1, 1, cũng được 3, 6. Hai đầu vào khác nhau cho cùng một kết quả, nên từ 3, 6 không thể biết ngược lại ta đã bắt đầu từ đâu. Vì vậy S không có nghịch đảo.
  - show: '<p>Ma trận có nghịch đảo gọi là <b>khả nghịch</b>. Chỉ ma trận <b>vuông</b> mới có thể có nghịch đảo theo nghĩa này.</p>

      '
    say: Ma trận có nghịch đảo gọi là ma trận khả nghịch, và chỉ ma trận vuông mới có thể có nghịch đảo theo nghĩa của bài này.
- id: quymo
  kind: example
  title: 'Khi ma trận lớn dần: số phép nhân tăng theo lập phương'
  checks:
  - '[n**3 for n in (10, 100, 1000, 10000)] == [10**3, 10**6, 10**9, 10**12]'
  - '[n*n*8 for n in (10, 100, 1000, 10000)] == [800, 80000, 8*10**6, 8*10**8]'
  - 10**12 // 10**9 == 1000 and round(1000/60) == 17 and 10**3/10**9 == 1e-06
  steps:
  - show: '<p>Nhân hai ma trận vuông $n \times n$: có $n^2$ ô kết quả, mỗi ô là một hàng nhân một cột dài $n$, tức $n$ phép nhân. Tổng cộng $n^3$ phép nhân. Mỗi số chiếm 8 byte (số minh hoạ; một byte là một ô nhớ nhỏ, đủ chứa một số nguyên từ 0 đến 255).</p>

      <table class="t"><tr><th>$n$</th><th>phép nhân $n^3$</th><th>bộ nhớ một ma trận</th></tr>

      <tr><td>10</td><td>1 000</td><td>800 byte</td></tr>

      <tr><td>100</td><td>1 triệu</td><td>80 nghìn byte</td></tr>

      <tr><td>1 000</td><td>1 tỉ</td><td>8 triệu byte</td></tr>

      <tr><td>10 000</td><td>1 000 tỉ</td><td>800 triệu byte</td></tr></table>

      '
    focus:
    - 1
    - 1
    - - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
    say: Nhân hai ma trận vuông cỡ n nhân n có n bình phương ô kết quả. Mỗi ô là một hàng nhân một cột dài n, tức n phép nhân, nên tổng cộng là n lập phương phép nhân. Với n bằng 10 là một nghìn phép nhân, với 100 là một triệu. Với n bằng một nghìn là một tỉ, và với mười nghìn là một nghìn tỉ phép nhân, còn bộ nhớ chỉ tăng theo n bình phương.
  - clear: true
    show: '<p>Máy làm <b>1 tỉ</b> phép nhân mỗi giây (số minh hoạ):</p>

      <table class="t"><tr><th>$n$</th><th>thời gian</th></tr>

      <tr><td>10</td><td>0,000001 giây</td></tr>

      <tr><td>100</td><td>0,001 giây</td></tr>

      <tr><td>1 000</td><td>1 giây</td></tr>

      <tr><td>10 000</td><td>1 000 giây ≈ <b>17 phút</b></td></tr></table>

      <div class="box key">$n$ tăng ×10 → thời gian ×1 000, bộ nhớ ×100.</div>

      '
    focus:
    - - '2.4'
      - '2.5'
    - 3
    - 3
    say: Với máy làm một tỉ phép nhân mỗi giây, số minh hoạ, n bằng một nghìn mất đúng một giây, còn n bằng mười nghìn mất khoảng mười bảy phút. Mỗi lần n tăng mười lần, thời gian tăng một nghìn lần còn bộ nhớ tăng một trăm lần. Vì vậy ma trận rất lớn cần phần cứng chuyên dụng, và ta tránh phép nhân thừa.
- id: pitfalls
  kind: pitfall
  title: Lỗi người mới hay mắc khi nhân ma trận
  checks:
  - Matrix([[1,2],[0,1]]).multiply_elementwise(Matrix([[3,1],[1,2]])) == Matrix([[3,2],[0,2]]) and Matrix([[3,2],[0,2]]) != Matrix([[5,5],[1,2]])
  - Matrix([[Rational(1,2),1],[1,1]])*Matrix([[2,1],[1,1]]) == Matrix([[2,Rational(3,2)],[3,2]]) and Matrix([[2,Rational(3,2)],[3,2]]) != sp.eye(2)
