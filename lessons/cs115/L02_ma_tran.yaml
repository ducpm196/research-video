id: L02
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 2 — Ma trận: nhân ma trận, ma trận đơn vị, chuyển vị, nghịch đảo"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L163 (ma trận M×N), L167 (ma trận đơn vị I_N), L342 (nghiệm đóng (XᵀX)⁻¹Xᵀy)"
assumes: [vec, sub, reals, in, transpose, cdot, implies]
# Quy ước ký hiệu của bài (lint kiểm, xem tools/registry/symbols.yaml):
#   ma trận: chữ hoa in đậm; kích thước: \sz{M}{N} (đọc “M nhân N” = M hàng, N cột; KHÔNG gõ \times);
#   phần tử: x_{ij} (hàng i, cột j); chuyển vị: ^T; nhân hai số: ·; nhân ma trận: viết sát nhau (AB);
#   ma trận đơn vị luôn có chỉ số kích thước (I_2, I_N); nghịch đảo: ^{-1}; vector viết ngang có ^T.
# Lưu ý từ curriculum (fix): công thức (XᵀX)⁻¹ chỉ dùng được khi XᵀX khả nghịch (audit A9).
objectives:
  - "Đọc thành lời: ma trận X in đậm, X thuộc R mũ 2 nhân 3, x một hai, X chuyển vị, I hai, M mũ trừ một"
  - "Nhân ma trận với vector và nhân hai ma trận bằng tay; kiểm tra kích thước trước khi nhân"
  - "Giải thích vì sao AB thường khác BA và vì sao phải nhân hai vế cùng một phía"
  - "Tự suy ra w = M⁻¹b từ điều kiện M⁻¹M = I, tìm nghịch đảo ma trận 2×2 và kiểm tra bằng phép nhân lại"
  - "Nhận biết ma trận không có nghịch đảo (định thức ad − bc = 0) và đọc được công thức nghiệm hồi quy tuyến tính"
# Câu cả small và medium nghe khác ở TỪ RỦI RO (chữ cái / từ do lexicon sinh ra), đã xem xét bằng đối chứng 2026-10-22:
# viết hẳn tên chữ cái (“a dê trừ bê xê”, “bê ích”, “cột gi”, “vê kép”) thì ASR vẫn nghe sai y hệt (“AG trừ BC”,
# “V x”, “cục di”, “v kết”) → TTS đọc đúng tên chữ cái, ASR viết sai. “S” và “ét” cho audio dài bằng nhau tới mili giây.
# KHÔNG ghi ở đây: câu có “một → mục”, “rộng → đồng”, “âm” bị mất — chờ người nghe (out/L02/asr_report.md).
asr_reviewed:
  - {sentence: "Số ở hàng i, cột j của A B bằng hàng i của A nhân với cột j của B, theo kiểu hàng nhân cột.", reason: "j → “di”: đối chứng “cột gi” cũng nghe “cục di”"}
  - {sentence: "A có M hàng, N cột.", reason: "chữ A đầu câu ASR viết “À”; tên chữ cái"}
  - {sentence: "B x bằng 4, 3, rồi A nhân 4, 3 bằng 10, 3.", reason: "B → “V”: đối chứng “Bê ích” cũng nghe “V x”"}
  - {sentence: "Tương tự, nhân bất kỳ ma trận A cỡ 2 nhân 2 với I hai, bên trái hay bên phải, đều được lại chính A.", reason: "“chính A” ASR viết “chính nha” (nối âm n + a); “I hai” → “y2” là tên chữ cái"}
  - {sentence: "Giống hệt w bằng 2 mũ trừ một nhân 6 ở phương trình với số.", reason: "vê kép → “v két”: đối chứng viết hẳn “vê kép” cũng nghe “v kết”"}
  - {sentence: "Nhân hàng với cột, hai số ngoài đường chéo bằng 0, vì b d trừ b d bằng 0, và a c trừ a c cũng bằng 0.", reason: "b d → “BG”: đối chứng “a dê trừ bê xê” cũng nghe “AG trừ BC”"}
  - {sentence: "Hai số trên đường chéo đều bằng a d trừ b c.", reason: "a d → “A-B”: cùng đối chứng “a dê”"}
