objectives:
- 'Nói thành lời: ma trận X in đậm, X thuộc R mũ 2 nhân 3, x một hai, X chuyển vị, I hai, M mũ trừ một'
- Nhân ma trận với vector và nhân hai ma trận bằng tay; kiểm tra kích thước trước khi nhân
- Nói được vì sao AB thường khác BA và vì sao phải nhân hai vế cùng một phía
- Tự suy ra w = M⁻¹b từ điều kiện M⁻¹M = I, tìm nghịch đảo ma trận 2×2 và kiểm tra bằng phép nhân lại
- Nhận biết ma trận không có nghịch đảo (định thức ad − bc = 0)
- Đếm được số phép nhân khi nhân hai ma trận cỡ n nhân n, và thấy vì sao thời gian tăng ×1000 khi n tăng ×10
