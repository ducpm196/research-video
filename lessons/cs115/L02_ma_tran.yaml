    say: Đáp án câu một, A B có hàng trên 4, 1 và hàng dưới 6, 3, còn B A có hàng trên 2, 1 và hàng dưới 4, 5, nên chúng khác nhau. Câu hai, hai số ở trong đều là 3 nên A B nhân được và có cỡ 2 nhân 4.
  - show: '<p>② (tiếp) $BA$: hai số ở trong là $4$ và $2$, <b>khác nhau</b> nên không nhân được.</p>

      '
    say: Còn B A thì hai số ở trong là 4 và 2, khác nhau, nên không nhân được. Vậy đổi thứ tự không chỉ đổi kết quả, mà có khi còn làm phép nhân không tồn tại.
- id: practice
  kind: practice
  lab: labs/CS115/L02
  title: 'Tự làm: nhân ma trận và giải M w = b bằng Python'
  checks:
  - Matrix([[2, 0], [1, 3]]) * Matrix([[1, 4], [2, 5]]) == Matrix([[2, 8], [7, 19]]) and Matrix([[1, 4], [2, 5]]) * Matrix([[2, 0], [1, 3]]) == Matrix([[6, 12], [9, 15]])
  - Matrix([[3, 1], [5, 2]]).det() == 1 and Matrix([[3, 1], [5, 2]]).inv() == Matrix([[2, -1], [-5, 3]])
