  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>$A = \begin{bmatrix} 2 & 1 \\ 0 & 3 \end{bmatrix}$, $B = \begin{bmatrix} 1 & 0 \\ 2 & 1 \end{bmatrix}$. Tính $AB$ và $BA$.</td></tr>

      <tr><td>2</td><td>$A$ cỡ $\sz{2}{3}$, $B$ cỡ $\sz{3}{4}$. $AB$ cỡ gì? $BA$ nhân được không?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Đến lượt bạn, với hai câu trên màn hình. Câu một, tính A B và B A cho hai ma trận hai nhân hai. Câu hai, A cỡ 2 nhân 3, B cỡ 3 nhân 4, hỏi A B cỡ gì và B A có nhân được không. Hãy dừng video và làm ra giấy.
