scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao AI cần ma trận?"
    steps:
      - show: |
          <p class="big">Bài 1: một ngôi nhà = một vector, ví dụ $(6, 2, 4)^T$.</p>
          <p>Nhưng dữ liệu thật có <b>hàng nghìn</b> ngôi nhà.</p>
        focus: [1, 2, 2]
        say: "Chào bạn, ở bài trước, mỗi ngôi nhà được ghi thành một vector, ví dụ 6, 2, 4, gồm diện tích, số phòng ngủ và khoảng cách tới trung tâm. Nhưng dữ liệu thật có hàng nghìn ngôi nhà. Ta cất chúng ở đâu cho gọn?"
      - show: |
          <table class="t"><tr><th></th><th>Diện tích (chục m²)</th><th>Phòng ngủ</th><th>Cách trung tâm (km)</th></tr>
          <tr><td>Nhà 1</td><td>6</td><td>2</td><td>4</td></tr>
          <tr><td>Nhà 2</td><td>5</td><td>1</td><td>2</td></tr></table>
          <p>Xếp các ngôi nhà thành <b>một bảng số</b> → gọi là <b class="blue">ma trận</b>.</p>
        focus: [0, ["1.2", "1.3"], 2]
        say: "Câu trả lời là xếp chúng thành một bảng. Mỗi hàng là một ngôi nhà, mỗi cột là một đặc trưng. Một bảng số như vậy gọi là ma trận."
      - clear: true
        show: |
          <p>Bài hôm nay trả lời 4 câu hỏi:</p>
          <ol><li>Tính giá dự đoán cho <b>mọi</b> ngôi nhà cùng lúc thế nào? → <b>nhân ma trận</b></li>
          <li>Đâu là “số 1” của ma trận? → <b>ma trận đơn vị</b></li>
          <li>Đổi hàng thành cột thế nào? → <b>chuyển vị</b></li>
          <li>“Chia” cho một ma trận để giải phương trình thế nào? → <b>nghịch đảo</b></li></ol>
        focus: [1, "2.1", "2.2", "2.3", "2.4"]
        say: "Hôm nay mình trả lời bốn câu hỏi. Một, làm sao tính giá dự đoán cho mọi ngôi nhà cùng một lúc. Hai, đâu là con số 1 của thế giới ma trận. Ba, làm sao đổi hàng thành cột. Bốn, làm sao chia cho một ma trận để giải phương trình."
      - clear: true
        show: |
          <p class="note">Chuỗi của AI: <b>Biểu diễn</b> → <b>Dự đoán</b> → Sai số → Tối ưu. Ma trận có mặt ở mọi bước; hôm nay bắt đầu từ hai bước đầu. Cuối bài: tự đọc được công thức nghiệm của <b>hồi quy tuyến tính</b> — cách dự đoán giá nhà từ dữ liệu.</p>
        say: "Trong chuỗi biểu diễn, dự đoán, sai số, tối ưu của AI, ma trận có mặt ở mọi bước, và hôm nay ta bắt đầu từ hai bước đầu. Cuối bài, bạn sẽ tự đọc được công thức nghiệm của hồi quy tuyến tính, tức cách dự đoán giá nhà từ dữ liệu. Công thức đó trông rất đáng sợ nhưng chỉ ghép từ bốn ý của bài này."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: hàng nhân cột, và giải phương trình với số"
    checks:
      - "Matrix([[1,2]])*Matrix([3,4]) == Matrix([[11]])"
      - "Rational(1,2)*2 == 1 and Rational(1,2)*6 == 3 and 2*3 == 6"
      - "1*5 == 5"
    steps:
      - show: |
          $$\begin{bmatrix} \hlb{1} & \hlb{2} \end{bmatrix}\begin{bmatrix} \hlb{3} \\ \hlb{4} \end{bmatrix} = 1\cdot 3 + 2\cdot 4 = 11$$
          <p class="note">Bài 1: một <b>hàng</b> nhân một <b>cột</b> (cùng số phần tử) = nhân từng cặp rồi cộng → ra <b>một con số</b>.</p>
        focus: [0, 2, 1, 2]
        say: "Trước tiên, ôn lại một phép tính của bài 1. Một hàng nhân một cột, có cùng số phần tử, là nhân từng cặp rồi cộng. Một nhân ba cộng hai nhân bốn bằng 11. Đây là viên gạch duy nhất để xây toàn bộ phép nhân ma trận."
      - show: |
          <p>Giải $\ 2\cdot \hlo{w} = 6\ $ với $\hlo{w}$ là một <b>con số</b> chưa biết:</p>
          $$\frac{1}{2}\cdot 2\cdot \hlo{w} = \frac{1}{2}\cdot 6 \implies 1\cdot \hlo{w} = 3 \implies \hlo{w} = 3$$
        focus: [1, 2, 2, 2]
        say: "Thứ hai, giải phương trình 2 nhân w bằng 6, với w là một con số chưa biết. Ta nhân cả hai vế với một phần hai. Vì một phần hai nhân 2 bằng 1, vế trái chỉ còn 1 nhân w, tức là w. Vậy w bằng 3."
      - show: |
          <div class="box key">Hai ý sẽ dùng lại:
          <br>① $\frac{1}{2}$ là số <b>nghịch đảo</b> của 2, vì $\frac{1}{2}\cdot 2 = 1$.
          <br>② Số 1 không làm thay đổi gì: $1\cdot 5 = 5$.</div>
        say: "Hãy giữ lại hai ý nhỏ. Một phần hai gọi là số nghịch đảo của 2, vì nhân với 2 thì ra 1. Và số 1 không làm thay đổi gì, 1 nhân 5 vẫn bằng 5. Hôm nay, ma trận cũng sẽ có đúng hai thứ như vậy."

  # ───────────────────────── 3. KÝ HIỆU MA TRẬN ─────────────────────────
  - id: sym_mat
    kind: symbol
    title: "Giải mã ký hiệu: ma trận, kích thước, phần tử"
    checks:
      - "Matrix([[6,2,4],[5,1,2]]).shape == (2, 3)"
      - "2*3 == 6 and len(Matrix([[6,2,4],[5,1,2]])) == 6"
      - "Matrix([[6,2,4],[5,1,2]])[0,1] == 2 and Matrix([[6,2,4],[5,1,2]])[1,0] == 5 and Matrix([[6,2,4],[5,1,2]])[0,2] == 4"
      - "Matrix([6,2,4]).shape == (3, 1)"
    steps:
      - show: |
          <div class="row"><div class="col">
          $$\mathbf{X} = \begin{bmatrix} 6 & 2 & 4 \\ 5 & 1 & 2 \end{bmatrix}$$</div>
          <div class="col"><ul><li>Chữ <b>hoa, in đậm</b> = một ma trận</li>
          <li><b>Hàng</b> nằm ngang, <b>cột</b> đứng dọc</li></ul></div></div>
        introduces: [mat]
        say: "Ký hiệu đầu tiên. Bài 1 dùng chữ thường in đậm cho vector. Còn chữ cái hoa, in đậm, như chữ X đậm này, nghĩa là một ma trận. Hàng là các dòng nằm ngang, cột là các dòng đứng dọc."
      - show: |
          $$\mathbf{X} \in \mathbb{R}^{\sz{2}{3}}$$
          <p>$\sz{2}{3}$ đọc là “2 nhân 3” = <b>2 hàng, 3 cột</b> <span class="note">(luôn nói số hàng trước)</span></p>
          <p class="note">Dấu × ở đây chỉ <b>kích thước</b>, không phải phép tính. Phép nhân hai số vẫn dùng dấu chấm giữa dòng như bài 1.</p>
        introduces: [dim]
        focus: [1, 2, 3, 3]
        say: "Dòng này đọc là X thuộc R mũ 2 nhân 3. Nghĩa là X là một bảng số có 2 hàng và 3 cột, luôn nói số hàng trước, số cột sau. Dấu nhân chéo ở đây chỉ kích thước, không phải phép tính. Còn phép nhân hai số, bài vẫn dùng dấu chấm giữa dòng như bài 1."
      - clear: true
        show: |
          <p>Số ở <b>hàng $i$, cột $j$</b> viết là $x_{ij}$:</p>
          $$\mathbf{X} = \begin{bmatrix} 6 & \hlb{2} & \hlo{4} \\ \hlg{5} & 1 & 2 \end{bmatrix}: \qquad x_{12} = \hlb{2}, \qquad x_{21} = \hlg{5}, \qquad x_{13} = \hlo{4}$$
          <p class="note">$x_{12}$ đọc là “x một hai”: hàng 1, cột 2, <b>không phải</b> “x mười hai”. Chữ thường, không in đậm, vì đó là <b>một con số</b>.</p>
        introduces: [sub2]
        focus: [1, 2, 2, 2, 3]
        say: "Muốn chỉ một con số trong bảng, ta gắn hai chỉ số nhỏ ở dưới chân, số thứ nhất là hàng, số thứ hai là cột. x một hai là số ở hàng 1, cột 2, bằng 2. x hai một là số ở hàng 2, cột 1, bằng 5. Còn x một ba bằng 4. Để ý, x một hai không phải x mười hai."
      - show: |
          <div class="box key">Vector cột của bài 1 là một ma trận <b>chỉ có 1 cột</b>: &nbsp; $(6, 2, 4)^T \in \mathbb{R}^{\sz{3}{1}}$</div>
        say: "Một điều thú vị, vector cột ở bài 1 thực chất cũng là một ma trận, chỉ có đúng 1 cột. Vector 6, 2, 4 có kích thước 3 nhân 1, tức là 3 hàng, 1 cột. Nên mọi thứ ta học về ma trận hôm nay cũng dùng được cho vector."

  # ───────────────────────── 4. CHUYỂN VỊ ─────────────────────────
  - id: transpose
    kind: concept
    title: "Chuyển vị ma trận: hàng thành cột"
    checks:
      - "Matrix([[6,2,4],[5,1,2]]).T == Matrix([[6,5],[2,1],[4,2]])"
      - "Matrix([[6,2,4],[5,1,2]]).T.shape == (3, 2)"
      - "Matrix([[6,2,4],[5,1,2]]).T[1,0] == Matrix([[6,2,4],[5,1,2]])[0,1] == 2"
      - "Matrix([[6,2,4],[5,1,2]]).T.T == Matrix([[6,2,4],[5,1,2]])"
    steps:
      - show: |
          $$\mathbf{X} = \begin{bmatrix} \hlb{6} & \hlb{2} & \hlb{4} \\ 5 & 1 & 2 \end{bmatrix} \quad\xrightarrow{\ \text{chuyển vị}\ }\quad \mathbf{X}^T = \begin{bmatrix} \hlb{6} & 5 \\ \hlb{2} & 1 \\ \hlb{4} & 2 \end{bmatrix}$$
        say: "Ở bài 1, chữ T nhỏ xoay một vector cột thành vector hàng. Với ma trận, chữ T làm đúng việc đó. Hàng 1 của X, là 6, 2, 4, trở thành cột 1 của X chuyển vị. Hàng 2 trở thành cột 2."
      - show: |
          <ul><li>Kích thước đổi chỗ: $\ \mathbf{X} \in \mathbb{R}^{\sz{2}{3}} \implies \mathbf{X}^T \in \mathbb{R}^{\sz{3}{2}}$</li>
          <li>Hàng 2, cột 1 của $\mathbf{X}^T$ chính là $x_{12} = 2$ (đổi chỗ hai chỉ số)</li>
          <li>Chuyển vị hai lần thì về như cũ: $\ (\mathbf{X}^T)^T = \mathbf{X}$</li></ul>
        say: "Vì hàng biến thành cột, nên kích thước cũng đổi chỗ. X có 2 hàng 3 cột, thì X chuyển vị có 3 hàng 2 cột. Số ở hàng 2, cột 1 của X chuyển vị chính là x một hai, bằng 2. Và chuyển vị hai lần thì quay về ma trận ban đầu."

  # ───────────────────────── 5. MA TRẬN NHÂN VECTOR ─────────────────────────
  - id: matvec
    kind: concept
    title: "Ma trận nhân vector: mỗi hàng nhân với vector"
    checks:
      - "Matrix([[6,2,4],[5,1,2]])*Matrix([2,1,-1]) == Matrix([10,9])"
      - "6*2 + 2*1 + 4*(-1) == 10 and 5*2 + 1*1 + 2*(-1) == 9"
      - "(Matrix([[6,2,4],[5,1,2]])*Matrix([2,1,-1])).shape == (2, 1)"
    steps:
      - show: |
          $$\text{giá} = \hlb{2}\cdot\text{diện tích} + \hlb{1}\cdot\text{phòng ngủ} + (\hlb{-1})\cdot\text{khoảng cách}$$
          <p>Gom 3 trọng số thành vector: $\ \mathbf{w} = (2, 1, -1)^T$ &nbsp;<span class="note">(giá tính theo trăm triệu đồng)</span></p>
        focus: [1, 1, 2]
        say: "Giả sử một mô hình đơn giản dự đoán giá nhà như sau, tính theo đơn vị trăm triệu đồng. Mỗi chục mét vuông cộng 2, mỗi phòng ngủ cộng 1, và mỗi cây số xa trung tâm thì trừ 1. Ba con số 2, 1, âm 1 gọi là trọng số, gom lại thành vector w."
      - show: |
          $$\mathbf{X}\mathbf{w} = \begin{bmatrix} \hlb{6} & \hlb{2} & \hlb{4} \\ 5 & 1 & 2 \end{bmatrix}\begin{bmatrix} 2 \\ 1 \\ -1 \end{bmatrix} = \begin{bmatrix} \hlb{6\cdot 2 + 2\cdot 1 + 4\cdot(-1)} \\ 5\cdot 2 + 1\cdot 1 + 2\cdot(-1) \end{bmatrix} = \begin{bmatrix} \hlg{10} \\ \hlg{9} \end{bmatrix}$$
        say: "Ma trận X nhân vector w, viết sát nhau là X w. Cách làm là lấy từng hàng của X nhân với w, theo kiểu hàng nhân cột vừa ôn. Hàng 1, 6 nhân 2, cộng 2 nhân 1, cộng 4 nhân âm 1, bằng 10. Hàng 2, 5 nhân 2, cộng 1 nhân 1, cộng 2 nhân âm 1, bằng 9."
      - show: |
          <div class="box key">Một phép nhân $\mathbf{X}\mathbf{w}$ = giá dự đoán của <b>mọi</b> ngôi nhà: &nbsp; nhà 1 → $\hlg{10}$, nhà 2 → $\hlg{9}$</div>
        say: "Vậy chỉ một phép nhân ma trận cho ra giá dự đoán của mọi ngôi nhà cùng lúc. Nhà 1 được dự đoán 10 trăm triệu, tức là 1 tỉ đồng, nhà 2 được 9 trăm triệu đồng. Với một nghìn ngôi nhà, công thức vẫn chỉ là X nhân w."
      - clear: true
        show: |
          <p><b>Phép thử kích thước:</b> số cột của $\mathbf{X}$ phải bằng số phần tử của $\mathbf{w}$.</p>
          $$\underbrace{\mathbf{X}}_{\sz{2}{\hlb{3}}}\ \underbrace{\mathbf{w}}_{\sz{\hlb{3}}{1}} \;=\; \underbrace{\mathbf{X}\mathbf{w}}_{\sz{2}{1}}$$
          <p class="note">Hai số <b>ở trong</b> phải bằng nhau (3 và 3); hai số <b>ở ngoài</b> cho kích thước kết quả.</p>
        focus: [1, 2, 3, 3]
        say: "Phép nhân này chỉ làm được khi mỗi hàng của X dài bằng w, tức là số cột của X bằng số phần tử của w. Viết kích thước cạnh nhau, 2 nhân 3, rồi 3 nhân 1. Hai số ở trong phải bằng nhau. Hai số ở ngoài cho kích thước kết quả, 2 nhân 1."

  # ───────────────────────── 6. NHÂN HAI MA TRẬN ─────────────────────────
  - id: matmul
    kind: concept
    title: "Nhân hai ma trận: hàng của A nhân cột của B"
    checks:
      - "Matrix([[1,2],[0,1]])*Matrix([[3,1],[1,2]]) == Matrix([[5,5],[1,2]])"
      - "1*3 + 2*1 == 5 and 1*1 + 2*2 == 5 and 0*3 + 1*1 == 1 and 0*1 + 1*2 == 2"
      - "Matrix([[3,1],[1,2]])*Matrix([1,1]) == Matrix([4,3]) and Matrix([[1,2],[0,1]])*Matrix([4,3]) == Matrix([10,3])"
      - "Matrix([[5,5],[1,2]])*Matrix([1,1]) == Matrix([10,3])"
      - "Matrix([[3,1],[1,2]])*Matrix([[1,2],[0,1]]) == Matrix([[3,7],[1,4]]) and Matrix([[3,7],[1,4]]) != Matrix([[5,5],[1,2]])"
    steps:
      - show: |
          <p>Số ở <b>hàng $i$, cột $j$</b> của $\mathbf{A}\mathbf{B}$ = <b>hàng $i$ của $\mathbf{A}$</b> nhân <b>cột $j$ của $\mathbf{B}$</b>.</p>
          $$\mathbf{A} = \begin{bmatrix} 1 & 2 \\ 0 & 1 \end{bmatrix}, \qquad \mathbf{B} = \begin{bmatrix} 3 & 1 \\ 1 & 2 \end{bmatrix}$$
        focus: [1, 1, 1, 2]
        say: "Bây giờ nhân hai ma trận với nhau. Quy tắc chỉ có một câu. Số ở hàng i, cột j của A B bằng hàng i của A nhân với cột j của B, theo kiểu hàng nhân cột. Ta thử với hai ma trận 2 nhân 2 này."
      - clear: true
        show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><text x="240" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">A</text><rect x="120" y="75" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="180" y="147" font-size="40" text-anchor="middle" fill="#1f2937">1</text><rect x="240" y="75" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="300" y="147" font-size="40" text-anchor="middle" fill="#1f2937">2</text><rect x="120" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="180" y="267" font-size="40" text-anchor="middle" fill="#1f2937">0</text><rect x="240" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="300" y="267" font-size="40" text-anchor="middle" fill="#1f2937">1</text><text x="640" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">B</text><rect x="520" y="75" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="580" y="147" font-size="40" text-anchor="middle" fill="#1f2937">3</text><rect x="640" y="75" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="700" y="147" font-size="40" text-anchor="middle" fill="#1f2937">1</text><rect x="520" y="195" width="120" height="120" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="580" y="267" font-size="40" text-anchor="middle" fill="#1f2937">1</text><rect x="640" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="700" y="267" font-size="40" text-anchor="middle" fill="#1f2937">2</text><text x="880" y="210" font-size="48" text-anchor="middle" fill="#1f2937">=</text><text x="1100" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">AB</text><rect x="980" y="75" width="120" height="120" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="1040" y="147" font-size="40" text-anchor="middle" fill="#1f2937">5</text><rect x="1100" y="75" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1160" y="147" font-size="40" text-anchor="middle" fill="#1f2937">?</text><rect x="980" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1040" y="267" font-size="40" text-anchor="middle" fill="#1f2937">?</text><rect x="1100" y="195" width="120" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1160" y="267" font-size="40" text-anchor="middle" fill="#1f2937">?</text><g font-size="26" fill="#1f2937"><text x="120" y="365">hàng 1 của A: (1, 2)</text><text x="520" y="365">cột 1 của B: (3, 1)</text><text x="980" y="365" fill="#15803d">1 nhân 3 + 2 nhân 1 = 5</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy một ô của kết quả được làm ra thế nào. Hàng 1 của A được tô xanh, cột 1 của B cũng tô xanh, và cặp hàng, cột này cho ra đúng một ô của A B, ô tô màu lục ở hàng 1, cột 1. Ta đặt hai dãy số cạnh nhau, nhân từng cặp rồi cộng, 1 nhân 3 cộng 2 nhân 1, được 5. Ba ô dấu hỏi còn lại làm cùng một cách, mỗi ô dùng một hàng của A và một cột của B."
      - clear: true
        show: |
          $$\begin{bmatrix} \hlb{1} & \hlb{2} \\ 0 & 1 \end{bmatrix}\begin{bmatrix} \hlb{3} & 1 \\ \hlb{1} & 2 \end{bmatrix}: \quad \text{hàng 1, cột 1} = 1\cdot 3 + 2\cdot 1 = \hlg{5}$$
        say: "Hàng 1 của A là 1, 2. Cột 1 của B là 3, 1. Nhân từng cặp rồi cộng, 1 nhân 3 cộng 2 nhân 1, bằng 5. Đó là số ở hàng 1, cột 1 của kết quả."
      - show: |
          <p>Hàng 1, cột 2: $\ 1\cdot 1 + 2\cdot 2 = \hlg{5}$</p>
        say: "Tiếp theo, hàng 1 của A nhân cột 2 của B, tức là 1, 2 nhân với 1, 2. Được 1 cộng 4, bằng 5."
      - show: |
          <p>Hàng 2, cột 1: $\ 0\cdot 3 + 1\cdot 1 = \hlg{1}$ &nbsp;&nbsp; Hàng 2, cột 2: $\ 0\cdot 1 + 1\cdot 2 = \hlg{2}$</p>
        say: "Làm tương tự với hàng 2 của A, là 0, 1. Nhân với cột 1 của B được 1, nhân với cột 2 của B được 2."
      - show: |
          $$\mathbf{A}\mathbf{B} = \begin{bmatrix} \hlg{5} & \hlg{5} \\ \hlg{1} & \hlg{2} \end{bmatrix}$$
        say: "Ghép bốn số lại, A B là ma trận có hàng trên 5, 5, và hàng dưới 1, 2."
      - clear: true
        show: |
          <p><b>Phép thử kích thước</b> vẫn y hệt:</p>
          $$\underbrace{\mathbf{A}}_{\sz{M}{\hlb{N}}}\ \underbrace{\mathbf{B}}_{\sz{\hlb{N}}{P}} \;=\; \underbrace{\mathbf{A}\mathbf{B}}_{\sz{M}{P}}$$
          <p class="note">Số ở trong bằng nhau, số ở ngoài là kích thước kết quả. Ma trận nhân vector là trường hợp $\mathbf{B}$ chỉ có 1 cột.</p>
        focus: [1, 2, 2, 2, 3]
        say: "Phép thử kích thước vẫn y hệt. A có M hàng, N cột. B phải có đúng N hàng, để mỗi hàng của A dài bằng mỗi cột của B. Kết quả có M hàng, P cột. Thực ra, ma trận nhân vector chỉ là trường hợp B có đúng 1 cột."
      - clear: true
        show: |
          <p><b>Nhân lần lượt hay gộp trước đều như nhau:</b> $\ (\mathbf{A}\mathbf{B})\,\mathbf{x} = \mathbf{A}\,(\mathbf{B}\mathbf{x})$</p>
          <p>Với $\ \mathbf{A} = \begin{bmatrix} 1 & 2 \\ 0 & 1 \end{bmatrix},\ \ \mathbf{B} = \begin{bmatrix} 3 & 1 \\ 1 & 2 \end{bmatrix},\ \ \mathbf{A}\mathbf{B} = \begin{bmatrix} 5 & 5 \\ 1 & 2 \end{bmatrix}\ $ ở trên, thử $\ \mathbf{x} = (1, 1)^T$:</p>
          <p>$\mathbf{B}\mathbf{x} = (3 + 1,\ 1 + 2)^T = (4, 3)^T$, &nbsp; $\mathbf{A}\,(4, 3)^T = (4 + 6,\ 3)^T = (10, 3)^T$</p>
          <p>$(\mathbf{A}\mathbf{B})\,\mathbf{x} = (5 + 5,\ 1 + 2)^T = (10, 3)^T\ \checkmark$</p>
        focus: [0, 1, 2, 3, 4]
        say: "Thêm một tính chất ta sẽ cần ở phần nghịch đảo. Khi nhân ba thứ liên tiếp, nhân hai cái đầu trước hay hai cái sau trước đều cho cùng kết quả. Thử với A, B ở trên và x bằng 1, 1. B x bằng 4, 3, rồi A nhân 4, 3 bằng 10, 3. Còn A B nhân x cũng bằng 10, 3, khớp nhau."
      - clear: true
        show: |
          <div class="box warn">Đổi thứ tự thường cho <b>kết quả khác</b>:
          $$\mathbf{B}\mathbf{A} = \begin{bmatrix} 3 & 7 \\ 1 & 4 \end{bmatrix} \;\neq\; \mathbf{A}\mathbf{B} = \begin{bmatrix} 5 & 5 \\ 1 & 2 \end{bmatrix}$$</div>
        say: "Nhưng cẩn thận, khác với nhân hai số, đổi thứ tự hai ma trận thường cho kết quả khác. B A có hàng trên 3, 7 và hàng dưới 1, 4, không bằng A B. Vì thế với ma trận, thứ tự nhân luôn quan trọng."

  # ───────────────────────── 7. MA TRẬN ĐƠN VỊ ─────────────────────────
  - id: identity
    kind: symbol
    title: "Giải mã ký hiệu: ma trận đơn vị — “số 1” của ma trận"
    checks:
      - "sp.eye(2) == Matrix([[1,0],[0,1]]) and sp.eye(3) == Matrix([[1,0,0],[0,1,0],[0,0,1]])"
      - "sp.eye(2)*Matrix([3,5]) == Matrix([3,5]) and 1*3 + 0*5 == 3 and 0*3 + 1*5 == 5"
      - "Matrix([[1,2],[0,1]])*sp.eye(2) == Matrix([[1,2],[0,1]]) and sp.eye(2)*Matrix([[1,2],[0,1]]) == Matrix([[1,2],[0,1]])"
      - "3*sp.eye(2) == Matrix([[3,0],[0,3]])"
    steps:
      - show: |
          $$\mathbf{I}_2 = \begin{bmatrix} \hlg{1} & 0 \\ 0 & \hlg{1} \end{bmatrix}, \qquad \mathbf{I}_3 = \begin{bmatrix} \hlg{1} & 0 & 0 \\ 0 & \hlg{1} & 0 \\ 0 & 0 & \hlg{1} \end{bmatrix}$$
          <ul><li>Số 1 trên <b>đường chéo chính</b> (góc trên bên trái → góc dưới bên phải), số 0 ở mọi chỗ khác</li>
          <li>Số nhỏ dưới chân là kích thước: $\mathbf{I}_2$ cỡ $\sz{2}{2}$, $\mathbf{I}_3$ cỡ $\sz{3}{3}$</li>
          <li>Số hàng bằng số cột: <b>ma trận vuông</b></li></ul>
        introduces: [identity]
        focus: [1, "2.1", "2.2", "2.3"]
        say: "Chữ I hoa in đậm là ma trận đơn vị. Nó có số 1 nằm trên đường chéo chính, tức là đường đi từ góc trên bên trái xuống góc dưới bên phải, và số 0 ở mọi chỗ khác. Số nhỏ dưới chân cho biết kích thước, I hai là 2 nhân 2, I ba là 3 nhân 3. Ma trận có số hàng bằng số cột như vậy gọi là ma trận vuông."
      - clear: true
        show: |
          $$\mathbf{I}_2\,(3, 5)^T = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 3 \\ 5 \end{bmatrix} = \begin{bmatrix} 1\cdot 3 + 0\cdot 5 \\ 0\cdot 3 + 1\cdot 5 \end{bmatrix} = \begin{bmatrix} 3 \\ 5 \end{bmatrix}$$
        say: "Vì sao gọi nó là số 1 của ma trận? Thử nhân I hai với vector 3, 5. Hàng 1 là 1 nhân 3 cộng 0 nhân 5, bằng 3. Hàng 2 là 0 nhân 3 cộng 1 nhân 5, bằng 5. Vector giữ nguyên, giống như 1 nhân 5 vẫn bằng 5."
      - show: |
          <div class="box key">$\mathbf{A}\,\mathbf{I}_2 = \mathbf{I}_2\,\mathbf{A} = \mathbf{A}$ &nbsp; với mọi ma trận $\mathbf{A}$ cỡ $\sz{2}{2}$
          <br><span class="note">Thử với $\mathbf{A}$ lúc nãy: nhân $\mathbf{I}_2$ bên trái hay bên phải đều ra lại $\mathbf{A}$.</span></div>
        say: "Tương tự, nhân bất kỳ ma trận A cỡ 2 nhân 2 với I hai, bên trái hay bên phải, đều được lại chính A. Bạn có thể tự thử với ma trận A lúc nãy. I hai là một trường hợp đặc biệt, đổi thứ tự mà kết quả vẫn không đổi."
      - clear: true
        show: |
          <p><b>Nhân ma trận với một số</b> = nhân số đó vào <b>từng</b> phần tử, giống vector ở bài 1:</p>
          $$3\,\mathbf{I}_2 = \begin{bmatrix} 3\cdot 1 & 3\cdot 0 \\ 3\cdot 0 & 3\cdot 1 \end{bmatrix} = \begin{bmatrix} 3 & 0 \\ 0 & 3 \end{bmatrix}$$
        focus: [1, 2, 0]
        say: "Cuối cùng, nhân ma trận với một con số thì giống hệt nhân vector với một số ở bài 1, nhân con số đó vào từng phần tử. 3 nhân I hai cho ma trận có số 3 trên đường chéo, số 0 ở chỗ khác. Lát nữa ta cần đúng phép tính này."

  # ───────────────────────── 8. NGHỊCH ĐẢO ─────────────────────────
  - id: inverse
    kind: formula
    title: "Ma trận nghịch đảo: “chia” cho một ma trận — từng bước có lý do"
    checks:
      - "Rational(2)**-1 == Rational(1,2) and Rational(1,2)*2 == 1"
      - "Matrix([[1,-1],[-1,2]])*Matrix([[2,1],[1,1]]) == sp.eye(2) and Matrix([[2,1],[1,1]])*Matrix([[1,-1],[-1,2]]) == sp.eye(2)"
      - "1*2 + (-1)*1 == 1 and 1*1 + (-1)*1 == 0 and (-1)*2 + 2*1 == 0 and (-1)*1 + 2*1 == 1"
      - "(lambda a, b, c, d: sp.expand(Matrix([[d,-b],[-c,a]])*Matrix([[a,b],[c,d]]) - (a*d - b*c)*sp.eye(2)) == sp.zeros(2, 2))(*sp.symbols('a b c d'))"
      - "(lambda a, b, c, d: sp.simplify(Matrix([[a,b],[c,d]]).inv() - Matrix([[d,-b],[-c,a]])/(a*d - b*c)) == sp.zeros(2, 2))(*sp.symbols('a b c d'))"
      - "2*1 - 1*1 == 1 and Matrix([[2,1],[1,1]]).inv() == Matrix([[1,-1],[-1,2]])"
    steps:
      - show: |
          <p>Với số: $\ 2^{-1} = \dfrac{1}{2}$, &nbsp; vì $\ 2^{-1}\cdot 2 = 1$</p>
          <p class="note">Mũ $-1$, đọc là “mũ trừ một” = <b>nghịch đảo</b>: thứ nhân vào để ra 1.</p>
        introduces: [inverse]
        focus: [0, 1, 1, 2]
        say: "Nhớ lại phương trình 2 nhân w bằng 6. Ta giải bằng cách nhân với số nghịch đảo của 2, là một phần hai. Trong toán, số nghịch đảo của 2 còn được viết là 2 mũ trừ một. Mũ trừ một nghĩa là thứ nhân vào để ra 1."
      - show: |
          <div class="box key">Ma trận nghịch đảo của $\mathbf{M}$, viết $\mathbf{M}^{-1}$, là ma trận thoả:
          $$\mathbf{M}^{-1}\mathbf{M} = \mathbf{M}\,\mathbf{M}^{-1} = \mathbf{I}_2$$</div>
        say: "Với ma trận cũng vậy. Ma trận nghịch đảo của M, viết là M mũ trừ một, đọc là M nghịch đảo, là ma trận mà nhân với M thì ra ma trận đơn vị, tức là số 1 của ma trận. Nhân bên trái hay bên phải đều phải ra I hai."
      - clear: true
        show: |
          <p><b>Giải</b> $\ \mathbf{M}\hlo{\mathbf{w}} = \mathbf{b}\ $ (biết $\mathbf{M}$ và $\mathbf{b}$, tìm $\hlo{\mathbf{w}}$):</p>
          <p><b>Bước 1.</b> Nhân <b>bên trái</b> cả hai vế với $\mathbf{M}^{-1}$: $\ \mathbf{M}^{-1}(\mathbf{M}\hlo{\mathbf{w}}) = \mathbf{M}^{-1}\mathbf{b}$</p>
        focus: [1, 2, 2]
        say: "Giờ dùng nó để giải phương trình M nhân w bằng b, với M và b đã biết, còn w là vector cần tìm. Bước một, nhân cả hai vế với M nghịch đảo. Phải nhân cùng một phía là bên trái, vì đổi thứ tự thì kết quả khác."
      - show: |
          <p><b>Bước 2.</b> Gộp hai cái đầu trước: $\ (\mathbf{M}^{-1}\mathbf{M})\,\hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b}$</p>
        say: "Bước hai, theo tính chất vừa học, nhân hai cái đầu trước cũng được, nên ta gộp M nghịch đảo với M lại."
      - show: |
          <p><b>Bước 3.</b> Thay $\mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$: $\ \mathbf{I}_2\,\hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b} \implies \hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b}$</p>
        say: "Bước ba, theo định nghĩa, M nghịch đảo nhân M bằng I hai. Mà I hai nhân w vẫn là w, nên suy ra w bằng M nghịch đảo nhân b. Giống hệt w bằng 2 mũ trừ một nhân 6 ở phương trình với số."
      - clear: true
        show: |
          <p><b>Tìm $\mathbf{M}^{-1}$ cho ma trận $\sz{2}{2}$.</b> Thử với $\ \mathbf{M} = \begin{bmatrix} \hlb{2} & 1 \\ 1 & \hlb{1} \end{bmatrix}$:
          <b>đổi chỗ</b> hai số trên đường chéo chính, <b>đổi dấu</b> hai số còn lại:</p>
          $$\mathbf{N} = \begin{bmatrix} \hlb{1} & -1 \\ -1 & \hlb{2} \end{bmatrix}$$
        focus: [1, 1, 1, 2, 2]
        say: "Còn lại câu hỏi, tìm M nghịch đảo thế nào? Với ma trận 2 nhân 2, ta làm theo một mẹo, lát nữa sẽ chứng minh vì sao đúng. Lấy M có hàng trên 2, 1, hàng dưới 1, 1. Đổi chỗ hai số trên đường chéo chính, rồi đổi dấu hai số còn lại. Ta được ma trận N, hàng trên 1, âm 1, hàng dưới âm 1, 2."
      - show: |
          $$\mathbf{N}\mathbf{M} = \begin{bmatrix} 1\cdot 2 + (-1)\cdot 1 & 1\cdot 1 + (-1)\cdot 1 \\ (-1)\cdot 2 + 2\cdot 1 & (-1)\cdot 1 + 2\cdot 1 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix} = \mathbf{I}_2\ \checkmark$$
        say: "Kiểm tra theo định nghĩa, nhân N với M, hàng nhân cột. Ta được hàng trên 1, 0, hàng dưới 0, 1, đúng bằng I hai. Vậy với ma trận này, N chính là M nghịch đảo."
      - clear: true
        show: |
          <p><b>Vì sao mẹo đúng?</b> Với $\ \mathbf{M} = \begin{bmatrix} a & b \\ c & d \end{bmatrix}$ và $\ \mathbf{N} = \begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$:</p>
          $$\mathbf{N}\mathbf{M} = \begin{bmatrix} da - bc & db - bd \\ -ca + ac & -cb + ad \end{bmatrix} = \begin{bmatrix} ad - bc & 0 \\ 0 & ad - bc \end{bmatrix} = (ad - bc)\,\mathbf{I}_2$$
        focus: [1, 1, 2, 2, 2]
        say: "Vì sao mẹo này luôn đúng? Viết M tổng quát với bốn chữ a, b, c, d, và N theo đúng mẹo. Nhân hàng với cột, hai số ngoài đường chéo bằng 0, vì b d trừ b d bằng 0, và a c trừ a c cũng bằng 0. Hai số trên đường chéo đều bằng a d trừ b c. Nên N nhân M bằng a d trừ b c, nhân I hai."
      - show: |
          <div class="box key">Chia cho $ad - bc$ (cần $ad - bc \neq 0$): &nbsp; $\mathbf{M}^{-1} = \dfrac{1}{ad - bc}\begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$</div>
          <p class="note">Con số $ad - bc$ gọi là <b>định thức</b> của $\mathbf{M}$. Với $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$ lúc nãy: $\ 2\cdot 1 - 1\cdot 1 = 1$, nên $\mathbf{M}^{-1} = \mathbf{N}$.</p>
        focus: [1, "1.2", 2, 2]
        say: "Muốn ra đúng I hai, ta chia N cho con số a d trừ b c, vì con số có thể đưa ra ngoài phép nhân, như ở bài 1. Phép chia này chỉ làm được khi a d trừ b c khác 0. Con số đó có tên là định thức của M. Với ma trận M bằng 2, 1, 1, 1 lúc nãy, 2 nhân 1 trừ 1 nhân 1 bằng 1, nên M nghịch đảo đúng bằng N."

  # ───────────────────────── 9. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ từng bước: tìm trọng số w từ giá nhà"
    checks:
      - "Matrix([[2,1],[1,1]])*Matrix([2,1]) == Matrix([5,3])"
      - "2*1 - 1*1 == 1"
      - "Matrix([[2,1],[1,1]]).inv() == Matrix([[1,-1],[-1,2]])"
      - "Matrix([[1,-1],[-1,2]])*Matrix([5,3]) == Matrix([2,1]) and 1*5 + (-1)*3 == 2 and (-1)*5 + 2*3 == 1"
    steps:
      - show: |
          <p>Đề: hai căn hộ, mỗi hàng là (diện tích, phòng ngủ); giá đã biết. Tìm trọng số $\hlo{\mathbf{w}} = (\hlo{w_1}, \hlo{w_2})^T$.</p>
          $$\begin{cases} 2\hlo{w_1} + 1\hlo{w_2} = 5 \\ 1\hlo{w_1} + 1\hlo{w_2} = 3 \end{cases} \quad\text{viết gọn:}\quad \underbrace{\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}}_{\mathbf{M}} \hlo{\mathbf{w}} = \underbrace{\begin{bmatrix} 5 \\ 3 \end{bmatrix}}_{\mathbf{b}}$$
        focus: [1, 1, 1, 2]
        say: "Giờ làm một ví dụ trọn vẹn, theo chiều ngược lại với lúc đầu, biết giá rồi đi tìm trọng số. Căn hộ thứ nhất rộng 2 chục mét vuông, 1 phòng ngủ, giá 5 trăm triệu. Căn thứ hai rộng 1 chục mét vuông, 1 phòng ngủ, giá 3 trăm triệu. Viết thành hệ hai phương trình, rồi viết gọn thành M nhân w bằng b."
      - show: |
          <p><b>①</b> Định thức: $\ ad - bc = 2\cdot 1 - 1\cdot 1 = \hlb{1} \neq 0$ → có nghịch đảo</p>
        say: "Bước một, kiểm tra định thức. a d trừ b c bằng 2 nhân 1 trừ 1 nhân 1, bằng 1, khác 0, nên M có nghịch đảo."
      - show: |
          <p><b>②</b> Nghịch đảo: $\ \mathbf{M}^{-1} = \dfrac{1}{\hlb{1}}\begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}$</p>
        say: "Bước hai, đổi chỗ, đổi dấu, rồi chia cho định thức là 1. M nghịch đảo có hàng trên 1, âm 1, hàng dưới âm 1, 2."
      - clear: true
        show: |
          <p><b>③</b> Nghiệm: $$\hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b} = \begin{bmatrix} 1\cdot 5 + (-1)\cdot 3 \\ (-1)\cdot 5 + 2\cdot 3 \end{bmatrix} = \hlg{\begin{bmatrix} 2 \\ 1 \end{bmatrix}}$$</p>
        say: "Bước ba, w bằng M nghịch đảo nhân b. Hàng 1, 1 nhân 5 cộng âm 1 nhân 3, bằng 2. Hàng 2, âm 1 nhân 5 cộng 2 nhân 3, bằng 1. Vậy w bằng 2, 1."
      - show: |
          <div class="box ok">Mỗi chục m² đáng $\hlg{2}$ trăm triệu, mỗi phòng ngủ đáng $\hlg{1}$ trăm triệu.</div>
        say: "Nghĩa là mỗi chục mét vuông đáng 2 trăm triệu, mỗi phòng ngủ đáng 1 trăm triệu. Đây chính là ý tưởng của hồi quy tuyến tính, học trọng số từ dữ liệu."

  # ───────────────────────── 10. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử để tự biết mình làm đúng"
    checks:
      - "Matrix([[1,-1],[-1,2]])*Matrix([[2,1],[1,1]]) == sp.eye(2)"
      - "Matrix([[2,1],[1,1]])*Matrix([2,1]) == Matrix([5,3]) and 2*2 + 1*1 == 5 and 1*2 + 1*1 == 3"
      - "(Matrix([[2,1],[1,1]])*Matrix([2,1])).shape == (2, 1)"
    steps:
      - show: |
          <p><b>Phép thử 1 — nhân lại phải ra $\mathbf{I}_2$:</b></p>
          $$\mathbf{M}^{-1}\mathbf{M} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix} = \begin{bmatrix} 2 - 1 & 1 - 1 \\ -2 + 2 & -1 + 2 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}\ \checkmark$$
        focus: [1, 2, 2]
        say: "Như ở bài 1, ta luôn tự kiểm tra. Phép thử một, theo định nghĩa, M nghịch đảo nhân M phải bằng I hai. Nhân hàng với cột, ta được hàng trên 1, 0, hàng dưới 0, 1, đúng là ma trận đơn vị."
      - show: |
          <p><b>Phép thử 2 — thay ngược vào đề:</b> $\ \mathbf{M}\hlg{\mathbf{w}} = \begin{bmatrix} 2\cdot 2 + 1\cdot 1 \\ 1\cdot 2 + 1\cdot 1 \end{bmatrix} = \begin{bmatrix} 5 \\ 3 \end{bmatrix} = \mathbf{b}\ \checkmark$</p>
        say: "Phép thử hai, thay w bằng 2, 1 ngược vào đề. Hàng 1, 2 nhân 2 cộng 1 nhân 1 bằng 5. Hàng 2, 1 nhân 2 cộng 1 nhân 1 bằng 3. Đúng bằng giá đã cho, nên nghiệm đúng."
      - show: |
          <p class="note">Phép thử 3, làm trong đầu — <b>kích thước</b>: $\sz{2}{2}$ nhân $\sz{2}{1}$ ra $\sz{2}{1}$, đúng cỡ của $\mathbf{w}$.</p>
        say: "Và luôn có thêm phép thử kích thước, làm ngay trong đầu, theo quy tắc số ở trong bằng nhau. Ma trận 2 nhân 2 nhân với vector 2 nhân 1 ra kích thước 2 nhân 1, đúng cỡ của w."

  # ───────────────────────── 11. KHÔNG CÓ NGHỊCH ĐẢO ─────────────────────────
  - id: singular
    kind: concept
    title: "Khi nào KHÔNG có nghịch đảo?"
    checks:
      - "1*4 - 2*2 == 0 and Matrix([[1,2],[2,4]]).det() == 0"
      - "Matrix([[1,2],[2,4]]).row(1) == 2*Matrix([[1,2],[2,4]]).row(0)"
      - "Matrix([[1,2],[2,4]])*Matrix([3,0]) == Matrix([3,6]) and Matrix([[1,2],[2,4]])*Matrix([1,1]) == Matrix([3,6])"
      - "Matrix([[1,2],[2,4]]).rank() < 2"
    steps:
      - show: |
          $$\mathbf{S} = \begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}: \qquad ad - bc = 1\cdot 4 - 2\cdot 2 = \hl{0}$$
          <p class="note">Hàng 2 gấp đôi hàng 1 → hai phương trình thực chất chỉ là <b>một</b>.</p>
        focus: [0, 1, 1, 2]
        say: "Không phải ma trận nào cũng có nghịch đảo. Xét ma trận S, hàng trên 1, 2, hàng dưới 2, 4. Định thức bằng 1 nhân 4 trừ 2 nhân 2, bằng 0, nên công thức phải chia cho 0. Để ý hàng 2 gấp đôi hàng 1, nên hai phương trình thực chất chỉ là một."
      - show: |
          <p>Hai vector <b>khác nhau</b> cho <b>cùng</b> kết quả: $\ \mathbf{S}\,(3, 0)^T = (3, 6)^T, \quad \mathbf{S}\,(1, 1)^T = (3, 6)^T$</p>
          <div class="box warn">Từ $(3, 6)^T$ không thể biết ngược lại ta bắt đầu từ vector nào → <b>không có</b> $\mathbf{S}^{-1}$.</div>
        focus: ["1.3", "1.3", 2, 2]
        say: "Thử nhân S với vector 3, 0, được 3, 6. Nhân S với vector 1, 1, cũng được 3, 6. Hai đầu vào khác nhau cho cùng một kết quả, nên từ 3, 6 không thể biết ngược lại ta đã bắt đầu từ đâu. Vì vậy S không có nghịch đảo."
      - show: |
          <p>Ma trận có nghịch đảo gọi là <b>khả nghịch</b>. Chỉ ma trận <b>vuông</b> mới có thể có nghịch đảo theo nghĩa này.</p>
        say: "Ma trận có nghịch đảo thì ta gọi là ma trận khả nghịch. Và chỉ ma trận vuông, có số hàng bằng số cột, mới có thể có nghịch đảo theo nghĩa của bài này."

  # ───────────────────────── 12. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "Matrix([[1,2],[0,1]]).multiply_elementwise(Matrix([[3,1],[1,2]])) == Matrix([[3,2],[0,2]]) and Matrix([[3,2],[0,2]]) != Matrix([[5,5],[1,2]])"
      - "Matrix([[Rational(1,2),1],[1,1]])*Matrix([[2,1],[1,1]]) == Matrix([[2,Rational(3,2)],[3,2]]) and Matrix([[2,Rational(3,2)],[3,2]]) != sp.eye(2)"
      - "Matrix([5,3]).shape == (2, 1) and Matrix([[1,-1],[-1,2]]).shape == (2, 2) and Matrix([5,3]).shape[1] != Matrix([[1,-1],[-1,2]]).shape[0]"
      - "1*4 - 2*2 == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nhân từng ô với ô: $\ \begin{bmatrix} 1\cdot 3 & 2\cdot 1 \\ 0\cdot 1 & 1\cdot 2 \end{bmatrix} = \begin{bmatrix} 3 & 2 \\ 0 & 2 \end{bmatrix}$ <b class="red">(sai)</b>, đúng là $\begin{bmatrix} 5 & 5 \\ 1 & 2 \end{bmatrix}$
          <br><span class="note">Dấu hiệu: mỗi ô của $\mathbf{A}\mathbf{B}$ là hàng nhân cột, nên với ma trận $\sz{2}{2}$ mỗi ô là <b>tổng của hai tích</b>.</span></div>
        say: "Lỗi thứ nhất, nhân từng ô của A với ô cùng vị trí của B. Cách đó cho 3, 2, 0, 2, trong khi kết quả đúng là 5, 5, 1, 2. Dấu hiệu nhận ra, mỗi ô của tích là hàng nhân cột, nên với ma trận 2 nhân 2, mỗi ô là tổng của hai tích."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghịch đảo từng phần tử: với $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$, viết $\ \mathbf{M}^{-1} = \begin{bmatrix} \dfrac{1}{2} & 1 \\ 1 & 1 \end{bmatrix}$ <b class="red">(sai)</b>
          <br><span class="note">Phép thử 1 bắt được ngay: nhân lại với $\mathbf{M}$ thì</span>$$\begin{bmatrix} \dfrac{1}{2} & 1 \\ 1 & 1 \end{bmatrix}\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix} = \begin{bmatrix} 2 & \dfrac{3}{2} \\ 3 & 2 \end{bmatrix} \neq \mathbf{I}_2$$</div>
        say: "Lỗi thứ hai, tưởng nghịch đảo là lấy một chia cho từng số. Với M bằng 2, 1, 1, 1, cách đó cho một phần hai, 1, 1, 1. Phép thử nhân lại bắt được ngay, vì kết quả không phải ma trận đơn vị."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Viết $\ \hlo{\mathbf{w}} = \mathbf{b}\,\mathbf{M}^{-1}$ <b class="red">(sai)</b>: nhân sai phía.
          <br><span class="note">Phép thử kích thước bắt được: $\sz{2}{\hl{1}}$ nhân $\sz{\hl{2}}{2}$, số ở trong 1 khác 2 nên không nhân được.</span></div>
        say: "Lỗi thứ ba, viết w bằng b nhân M nghịch đảo, tức là nhân sai phía. Phép thử kích thước bắt được lỗi này. b cỡ 2 nhân 1, M nghịch đảo cỡ 2 nhân 2, hai số ở trong là 1 và 2, không bằng nhau, nên không nhân được."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng công thức khi $ad - bc = 0$ <b class="red">(sai)</b>: chia cho 0.
          <br><span class="note">Luôn tính định thức <b>trước</b> (bước ① của ví dụ).</span></div>
        say: "Lỗi thứ tư, quên kiểm tra định thức, rồi chia cho 0 như với ma trận S. Vì vậy trong ví dụ, bước một luôn là tính định thức trước."

  # ───────────────────────── 13. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: giải M w = b"
    checks:
      - "4*1 - 2*1 == 2"
      - "Matrix([[4,2],[1,1]]).inv() == Rational(1,2)*Matrix([[1,-2],[-1,4]])"
      - "Matrix([[1,-2],[-1,4]])*Matrix([6,2]) == Matrix([2,2]) and 1*6 + (-2)*2 == 2 and (-1)*6 + 4*2 == 2 and Rational(1,2)*Matrix([2,2]) == Matrix([1,1])"
      - "Matrix([[4,2],[1,1]])*Matrix([1,1]) == Matrix([6,2])"
    steps:
      - show: |
          <p class="big">$\mathbf{M} = \begin{bmatrix} 4 & 2 \\ 1 & 1 \end{bmatrix}, \quad \mathbf{b} = (6, 2)^T$</p>
          <p>Tìm $\mathbf{M}^{-1}$, giải $\ \mathbf{M}\hlo{\mathbf{w}} = \mathbf{b}$, rồi chạy phép thử thay ngược.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, cho M có hàng trên 4, 2, hàng dưới 1, 1, và b bằng 6, 2. Hãy tìm M nghịch đảo, giải M nhân w bằng b, rồi chạy phép thử thay ngược. Bạn hãy dừng video, lấy giấy bút ra làm."
        pause: 8
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th></tr>
          <tr><td>① định thức</td><td>$ad - bc = 4\cdot 1 - 2\cdot 1 = 2$</td></tr>
          <tr><td>② nghịch đảo</td><td>$\mathbf{M}^{-1} = \dfrac{1}{2}\begin{bmatrix} 1 & -2 \\ -1 & 4 \end{bmatrix}$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Đáp án như sau, định thức bằng 4 nhân 1 trừ 2 nhân 1, bằng 2. Đổi chỗ, đổi dấu, rồi chia cho 2, M nghịch đảo bằng một phần hai nhân ma trận có hàng trên 1, âm 2, hàng dưới âm 1, 4."
      - clear: true
        show: |
          <p>③ $$\hlo{\mathbf{w}} = \dfrac{1}{2}\begin{bmatrix} 1\cdot 6 + (-2)\cdot 2 \\ (-1)\cdot 6 + 4\cdot 2 \end{bmatrix} = \dfrac{1}{2}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \hlg{\begin{bmatrix} 1 \\ 1 \end{bmatrix}}$$</p>
        say: "Nhân với b. Hàng 1, 6 trừ 4 bằng 2. Hàng 2, âm 6 cộng 8 bằng 2. Chia cho 2, được w bằng 1, 1."
      - show: |
          <p>Thử: $\ \mathbf{M}\hlg{\mathbf{w}} = (4 + 2,\ 1 + 1)^T = (6, 2)^T = \mathbf{b}\ \checkmark$</p>
        say: "Thử lại, M nhân 1, 1 bằng 4 cộng 2, và 1 cộng 1, tức là 6, 2, đúng bằng b. Nếu bạn ra đúng, chúc mừng, bạn đã nắm được phép nghịch đảo."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    checks:
      - "(lambda X: (X.T*X).shape == (3, 3) and (X.T*Matrix([1,2,3,4])).shape == (3, 1))(Matrix(4, 3, list(range(12))))"
      - "(lambda X: (X.T*X).det() == 0)(Matrix([[6,6,4],[5,5,2],[8,8,7]]))"
      - "(lambda X, y: (X.T*X).inv()*X.T*y == Matrix([2,1]))(Matrix([[2,1],[1,1]]), Matrix([5,3]))"
      - "(lambda Q: Q.T*Q == sp.eye(2) and Q.inv() == Q.T)(Matrix([[0,-1],[1,0]]))"
    steps:
      - show: |
          <div class="chain"><span class="n">Ma trận = bảng số $\sz{M}{N}$</span><span class="a">→</span>
          <span class="n">$\mathbf{X}^T$: hàng thành cột</span><span class="a">→</span>
          <span class="n">$\mathbf{A}\mathbf{B}$: hàng nhân cột, số trong bằng nhau</span><span class="a">→</span>
          <span class="n">$\mathbf{I}_2$: “số 1”</span><span class="a">→</span>
          <span class="n">$\mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$</span><span class="a">→</span>
          <span class="n">$\mathbf{w} = \mathbf{M}^{-1}\mathbf{b}$</span><span class="a">→</span>
          <span class="n">phép thử</span></div>
        say: "Tổng kết chuỗi logic. Ma trận là bảng số, nói số hàng trước, số cột sau. Chuyển vị đổi hàng thành cột. Nhân ma trận là hàng nhân cột, hai số ở trong phải bằng nhau, và thứ tự nhân quan trọng. Ma trận đơn vị là số 1. Nghịch đảo là thứ nhân vào để ra số 1, nhờ nó ta giải được M nhân w bằng b."
      - clear: true
        show: |
          <p>Giờ bạn đọc được công thức nghiệm của <b>hồi quy tuyến tính</b> (bài 18 sẽ học: dự đoán giá nhà từ các đặc trưng của nó):</p>
          $$\hlo{\mathbf{w}} = (\mathbf{X}^T\mathbf{X})^{-1}\,\mathbf{X}^T\mathbf{y}$$
          <p class="note">$\mathbf{X} \in \mathbb{R}^{\sz{N}{D}}$: $N$ ngôi nhà, $D$ đặc trưng. &nbsp; $\mathbf{y} \in \mathbb{R}^{\sz{N}{1}}$: giá thật của $N$ ngôi nhà.</p>
          <p class="note">$\mathbf{X}^T\mathbf{X}$ cỡ $\sz{D}{D}$ (vuông), $\ \mathbf{X}^T\mathbf{y}$ cỡ $\sz{D}{1}$, nên $\hlo{\mathbf{w}}$ cỡ $\sz{D}{1}\ \checkmark$</p>
        focus: [0, 2, 3, 2, 4]
        say: "Và đây là phần thưởng. Công thức nghiệm của hồi quy tuyến tính trông rất đáng sợ, nhưng giờ bạn đọc được từng ký hiệu. X là bảng dữ liệu của N ngôi nhà, mỗi nhà D đặc trưng, còn y là giá thật của N ngôi nhà đó. Công thức lấy X chuyển vị nhân X, lấy nghịch đảo, rồi nhân với X chuyển vị nhân y. Thử kích thước, X chuyển vị nhân X là ma trận vuông D nhân D, và w có đúng D trọng số."
        forward_ref: true
      - show: |
          <div class="box warn">Công thức chỉ dùng được khi $\mathbf{X}^T\mathbf{X}$ <b>khả nghịch</b>. Ví dụ: hai cột của $\mathbf{X}$ giống hệt nhau thì không.</div>
        say: "Một lưu ý quan trọng, công thức này chỉ dùng được khi X chuyển vị nhân X khả nghịch. Ví dụ, nếu hai cột của X giống hệt nhau, thì X chuyển vị nhân X không có nghịch đảo."
      - clear: true
        show: |
          <div class="box key"><b>Tư duy:</b> Đừng học thuộc công thức nghịch đảo. Hãy nhớ <b>một điều kiện</b> $\ \mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$: từ đó suy ra cách giải, và tự kiểm tra mọi đáp án.</div>
        say: "Điều quan trọng nhất cần mang theo là cách tư duy. Đừng học thuộc công thức. Hãy nhớ một điều kiện, nghịch đảo nhân với ma trận phải ra ma trận đơn vị. Từ điều kiện đó, bạn suy ra cách giải phương trình, và tự kiểm tra được mọi đáp án."
      - show: |
          <p class="note">Bài sau (bài 3): <b>hệ phương trình tuyến tính</b> — giải nhiều phương trình cùng lúc bằng cách khử dần từng ẩn, và biết khi nào có đúng một nghiệm, vô nghiệm hay vô số nghiệm. Ma trận vuông có nghịch đảo ứng với trường hợp <b>đúng một nghiệm</b>.</p>
        say: "Ở bài sau, bài 3, ta học cách giải nhiều phương trình cùng lúc, bằng cách khử dần từng ẩn số. Ta cũng biết khi nào hệ có đúng một nghiệm, khi nào vô nghiệm, và khi nào có vô số nghiệm. Trường hợp ma trận vuông có nghịch đảo, như ví dụ giá nhà hôm nay, chính là trường hợp hệ phương trình có đúng một nghiệm. Hẹn gặp bạn ở bài tiếp theo."
        forward_ref: true
