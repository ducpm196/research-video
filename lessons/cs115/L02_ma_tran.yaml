      <br><span class="note">Dấu hiệu: mỗi ô của $\mathbf{A}\mathbf{B}$ là hàng nhân cột, nên với ma trận $\sz{2}{2}$ mỗi ô là <b>tổng của hai tích</b>.</span></div>

      '
    say: 'Lỗi thường gặp: nhân từng ô của A với ô cùng vị trí của B, cho 3, 2, 0, 2, trong khi đúng là 5, 5, 1, 2. Mỗi ô của tích là hàng nhân cột, nên với ma trận 2 nhân 2, mỗi ô là tổng của hai tích.'
- id: quiz
