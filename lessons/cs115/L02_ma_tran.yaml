  steps:
  - clear: true
    show: '<table class="t"><tr><th>đọc trước: việc</th><th>làm thế nào</th><th>gõ trong Git Bash</th></tr><tr><td>tạo tệp</td><td>mở trình soạn văn bản (Notepad, VS Code…), gõ chương trình, lưu thành tệp tên <code>matran.py</code> (đuôi <code>.py</code>) trong thư mục gốc của bộ khoá, nơi có thư mục <code>labs</code></td><td>—</td></tr><tr><td>chạy</td><td>mở Git Bash ở thư mục đó; các dòng <code>print</code> hiện ngay bên dưới lệnh</td><td><code>python matran.py</code></td></tr><tr><td>chấm</td><td><code>bash</code> chạy tệp chấm <code>labs/cham.sh</code> với khoá, mã bài, tên tệp; in <b>ĐÚNG</b> khi mọi dòng trùng kết quả mong đợi, nếu không thì chỉ ra dòng khác</td><td><code>bash labs/cham.sh CS115 L02 matran.py</code></td></tr></table><p class="note"><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn Open Git Bash here.</p><p class="note"><b>kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python matran.py</code> và so với kết quả mong đợi.</p>

      '
    focus:
    - - '1.2'
      - 2
      - 3
    - '1.3'
    - '1.4'
    say: 'Một, tạo tệp: gõ chương trình trong trình soạn văn bản, lưu vào thư mục gốc của bộ khoá. Hai, chạy tệp: mở cửa sổ dòng lệnh ở thư mục đó, gõ lệnh trên màn hình, kết quả in ngay bên dưới. Ba, chấm bài: lệnh ở hàng cuối chạy tệp chấm, rồi in chữ ĐÚNG khi mọi dòng trùng.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def nhan(A, B):</code></td><td>định nghĩa hàm <code>nhan</code> có hai <b>tham số</b> A và B (hai ma trận đưa vào); thân hàm thụt vào; <code>return</code> đưa kết quả ra</td><td><code>nhan(A, B)</code> trả về ma trận tích</td></tr><tr><td><code>A = [[2, 0], [1, 3]]</code></td><td>danh sách lồng: mỗi cặp ngoặc vuông bên trong là một hàng; <code>A[1][0]</code> là hàng chỉ số 1, cột chỉ số 0 (đếm từ 0)</td><td><code>A[0]</code> là <code>[2, 0]</code>; <code>A[1][0]</code> là 1</td></tr><tr><td><code>Fraction(1, 2)</code></td><td>phân số chính xác, tử 1, mẫu 2; in từng số bằng <code>str</code> cho dạng <code>1/2</code></td><td><code>str(Fraction(2, 4))</code> là <code>''1/2''</code></td></tr><tr><td><code>nhan(A, B) != nhan(B, A)</code></td><td>dấu chấm than và dấu bằng liền nhau là <b>khác</b>; phép so sánh cho ra đúng hoặc sai</td><td><code>1 != 2</code> cho <code>True</code> (đúng)</td></tr></table>

      '
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: 'Đọc trước bốn mẩu mã sẽ dùng trong chương trình. Dòng này định nghĩa hàm có hai tham số A và B, tức hai ma trận đưa vào; lệnh trả về đưa kết quả ra. Danh sách lồng nhau: mỗi cặp ngoặc vuông bên trong là một hàng, và hai chỉ số liền nhau chọn hàng rồi cột, đếm từ không. Hàm phân số nhận tử và mẫu, tự rút gọn, và in ra dạng tử gạch chéo mẫu. Dấu chấm than liền dấu bằng nghĩa là khác nhau, và phép so sánh cho ra đúng hoặc sai.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước (tiếp): cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code style="white-space:nowrap">sum(A[i][k] * B[k][j] for k in range(2))</code></td><td>ô hàng i, cột j của tích: cộng A[i][k] nhân B[k][j] với k = 0 rồi 1</td><td>i = 0, j = 1: 2 nhân 4 cộng 0 nhân 5 bằng 8</td></tr><tr><td><code>", ".join(str(x) for x in hang)</code></td><td>đổi mỗi số thành chữ bằng <code>str</code>, rồi nối bằng dấu phẩy và một dấu cách</td><td><code>[2, 8]</code> thành <code>2, 8</code></td></tr><tr><td><code>if dt == 0:</code></td><td>nếu định thức bằng 0 thì làm các dòng thụt vào; <code>==</code> là so sánh bằng</td><td>dt = 1: không vào</td></tr></table>

      '
    say: Còn vài mẩu mã nữa, đọc kỹ ở bảng.
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>matran.py</code> có hàm <code>nhan(A, B)</code> và làm hai việc:</p>

      <table class="t"><tr><th>việc</th><th>số liệu</th></tr>

      <tr><td>① $AB$ và $BA$</td><td>$A = \begin{bmatrix} 2 & 0 \\ 1 & 3 \end{bmatrix}$, $B = \begin{bmatrix} 1 & 4 \\ 2 & 5 \end{bmatrix}$</td></tr>

      <tr><td>② định thức, $M^{-1}$, $\mathbf{w}$, kiểm lại</td><td>$M = \begin{bmatrix} 3 & 1 \\ 5 & 2 \end{bmatrix}$, $\mathbf{b} = (13, 22)^T$</td></tr></table>

      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L02/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ tới phần bạn tự làm, với số liệu mới trên màn hình. Viết hàm nhân hai ma trận rồi in A B và B A để thấy chúng khác nhau. Giải M w bằng b qua nghịch đảo và kiểm lại bằng phép nhân. Dừng video và tự làm.
    pause: 300
  - clear: true
    show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>AB = [[2, 8], [7, 19]]</div><div>BA = [[6, 12], [9, 15]]</div><div>AB khac BA: True</div><div>dinh thuc M: 1</div><div>M nghich dao: [[2, -1], [-5, 3]]</div><div>w = [4, 1]</div><div>M.w = [13, 22]</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L02 matran.py</code> — in <b>ĐÚNG</b> khi trùng.</p>

      '
    focus:
    - 0
    - 0
    say: Đây là kết quả mong đợi. Chạy chương trình của bạn rồi so từng dòng, hoặc chấm bằng lệnh ở chân màn hình.
  - show: '<div class="box key"><b>Nếu kẹt:</b> ô hàng $i$, cột $j$ của $AB$ = hàng $i$ của $A$ nhân cột $j$ của $B$. $M^{-1}$: đổi chỗ $a$ và $d$, đổi dấu $b$ và $c$, chia cho $ad - bc$. $\mathbf{w} = M^{-1}\mathbf{b}$: nhân ma trận bên trái.</div>

      '
    say: Nếu kẹt, nhớ ô của tích là hàng của A nhân cột của B. Nghịch đảo hai nhân hai là đổi chỗ, đổi dấu rồi chia cho định thức. Còn w bằng M nghịch đảo nhân b, nhân ở bên trái.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  checks:
  - '(lambda X: (X.T*X).shape == (3, 3) and (X.T*Matrix([1,2,3,4])).shape == (3, 1))(Matrix(4, 3, list(range(12))))'
  - '(lambda X: (X.T*X).det() == 0)(Matrix([[6,6,4],[5,5,2],[8,8,7]]))'
  - '(lambda X, y: (X.T*X).inv()*X.T*y == Matrix([2,1]))(Matrix([[2,1],[1,1]]), Matrix([5,3]))'
  - '(lambda Q: Q.T*Q == sp.eye(2) and Q.inv() == Q.T)(Matrix([[0,-1],[1,0]]))'
  steps:
  - show: '<div class="chain"><span class="n">Ma trận = bảng số $\sz{m}{n}$</span><span class="a">→</span>

      <span class="n">$\mathbf{X}^T$: hàng thành cột</span><span class="a">→</span>

      <span class="n">$\mathbf{A}\mathbf{B}$: hàng nhân cột, số trong bằng nhau</span><span class="a">→</span>

      <span class="n">$\mathbf{I}_2$: “số 1”</span><span class="a">→</span>

      <span class="n">$\mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$</span><span class="a">→</span>

      <span class="n">$\mathbf{w} = \mathbf{M}^{-1}\mathbf{b}$ (cần định thức khác 0)</span><span class="a">→</span>

      <span class="n">$(\mathbf{X}^T\mathbf{X})^{-1}$ cần $\mathbf{X}^T\mathbf{X}$ khả nghịch</span><span class="a">→</span>

      <span class="n">phép thử</span></div>

      '
    say: Tổng kết chuỗi logic. Ma trận là bảng số, chuyển vị đổi hàng thành cột. Nhân ma trận là hàng nhân cột, hai số ở trong phải bằng nhau, và thứ tự nhân quan trọng. Ma trận đơn vị là số 1, nghịch đảo là thứ nhân vào để ra số 1, nhờ nó ta giải được M nhân w bằng b, miễn là định thức khác 0. Với dữ liệu X, nghịch đảo của X chuyển vị nhân X cũng chỉ có khi ma trận đó khả nghịch.
