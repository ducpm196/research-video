  - show: '<p>① $AB = \begin{bmatrix} 4 & 1 \\ 6 & 3 \end{bmatrix}$ và $BA = \begin{bmatrix} 2 & 1 \\ 4 & 5 \end{bmatrix}$: <b>khác nhau</b>.</p>

      <p>② Hai số ở trong là 3 và 3, nên $AB$ nhân được, cỡ $\sz{2}{4}$.</p>

