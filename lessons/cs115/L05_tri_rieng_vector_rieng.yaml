      <tr><td>vector riêng, kiểm $M\mathbf{v} = \lambda\mathbf{v}$</td><td>$\mathbf{v} = (b, \lambda - a)$ rút gọn bằng <code>math.gcd</code></td></tr>

      <tr><td>$R$</td><td>delta âm: không có trị riêng thực</td></tr></table>

      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L05/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - - '2.2'
      - '2.3'
    - '2.4'
    - '2.5'
    - 0
    say: Bây giờ tới phần bạn tự làm, với ma trận M mới trên màn hình. In định thức và vết, tức tổng hai số trên đường chéo, rồi giải phương trình bậc hai để ra hai trị riêng. Với mỗi trị riêng, tìm vector riêng và kiểm M nhân v bằng lambda nhân v. Cuối cùng thử ma trận xoay R, mà biệt thức âm nên không có trị riêng thực. Dừng video và tự làm.
    pause: 300
  - clear: true
    show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>dinh thuc: 6</div><div>vet: 7</div><div>tri rieng: [1, 6]</div><div>vector rieng cho 1: [1, -2]</div><div>M.v = lambda.v (lambda=1): True</div><div>vector rieng cho 6: [2, 1]</div><div>M.v = lambda.v (lambda=6): True</div><div>ma tran xoay: khong co tri rieng thuc</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L05 rieng.py</code> — in <b>ĐÚNG</b> khi trùng.</p>

      '
    focus:
    - 0
    - 0
    say: Đây là kết quả mong đợi. Chạy chương trình của bạn rồi so từng dòng, hoặc chấm bằng lệnh ở chân màn hình.
  - clear: true
    show: '<div class="box key"><b>Nếu kẹt:</b> trị riêng nhỏ là $(\text{vết} - \sqrt{\text{delta}})/2$, lớn là $(\text{vết} + \sqrt{\text{delta}})/2$, với delta là vết bình phương trừ 4 lần định thức. Vector riêng từ hàng một của $(M - \lambda I)\mathbf{v} = \mathbf{0}$: $(a - \lambda)x + by = 0$ cho $\mathbf{v} = (b, \lambda - a)$. Delta âm thì phương trình bậc hai vô nghiệm thực. Nếu $(b, \lambda - a) = (0, 0)$ thì dùng $(\lambda - d, c)$; đề này $b = 2 \neq 0$.</div>

      '
    say: Nếu kẹt, hai trị riêng là vết trừ hoặc cộng căn biệt thức, rồi chia 2, với biệt thức bằng vết bình phương trừ 4 lần định thức. Vector riêng đọc ra từ hàng một của phương trình A trừ lambda I nhân v bằng không.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">$\mathbf{A}\mathbf{v} = \lambda\,\mathbf{v},\ \mathbf{v} \neq \mathbf{0}$</span><span class="a">→</span>

      <span class="n">$(\mathbf{A} - \lambda\,\mathbf{I}_2)\,\mathbf{v} = \mathbf{0}$</span><span class="a">→</span>

      <span class="n">không có nghịch đảo</span><span class="a">→</span>

      <span class="n">$\det(\mathbf{A} - \lambda\,\mathbf{I}_2) = 0$ → $\lambda$</span><span class="a">→</span>

      <span class="n">giải tìm $\mathbf{v}$</span><span class="a">→</span>

      <span class="n">thử $\mathbf{A}\mathbf{v} = \lambda\,\mathbf{v}$</span></div>

      '
    say: Từ định nghĩa A v bằng lambda v với v khác 0, chuyển vế được A trừ lambda I hai nhân v bằng không. Ma trận đó không thể có nghịch đảo, nên định thức bằng 0, cho ta trị riêng. Rồi giải tìm v, và thử lại.
  - show: '<div class="box key"><b>Tư duy:</b> vector riêng là <b>hướng mà ma trận chỉ kéo giãn</b>, trị riêng là <b>hệ số kéo giãn</b>. Tìm $\lambda$ trước, rồi mới tìm $\mathbf{v}$; luôn thử lại bằng $\mathbf{A}\mathbf{v} = \lambda\,\mathbf{v}$.</div>

      '
    say: Điều quan trọng nhất cần mang theo, vector riêng là hướng mà ma trận chỉ kéo giãn, còn trị riêng là hệ số kéo giãn. Luôn tìm lambda trước, rồi mới tìm v, và luôn thử lại bằng A v bằng lambda v.
