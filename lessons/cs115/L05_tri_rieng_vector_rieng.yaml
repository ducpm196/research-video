  - Matrix([[5, 2], [2, 2]]) * Matrix([1, -2]) == 1*Matrix([1, -2]) and Matrix([[5, 2], [2, 2]]) * Matrix([2, 1]) == 6*Matrix([2, 1])
  - 'Matrix([[0, -2], [2, 0]]).eigenvals() == {2*S(''I''): 1, -2*S(''I''): 1} and 0**2 - 4*4 < 0'
  steps:
  - clear: true
    show: '<table class="t"><tr><th>đọc trước: việc</th><th>làm thế nào</th><th>gõ trong Git Bash</th></tr><tr><td>tạo tệp</td><td>mở trình soạn văn bản (Notepad, VS Code…), gõ chương trình, lưu thành tệp tên <code>rieng.py</code> (đuôi <code>.py</code>) trong thư mục gốc của bộ khoá, nơi có thư mục <code>labs</code></td><td>—</td></tr><tr><td>chạy</td><td>mở Git Bash ở thư mục đó; các dòng <code>print</code> hiện ngay bên dưới lệnh</td><td><code>python rieng.py</code></td></tr><tr><td>chấm</td><td><code>bash</code> chạy tệp chấm <code>labs/cham.sh</code> với khoá, mã bài, tên tệp; in <b>ĐÚNG</b> khi mọi dòng trùng kết quả mong đợi, nếu không thì chỉ ra dòng khác</td><td><code>bash labs/cham.sh CS115 L05 rieng.py</code></td></tr></table><p class="note"><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn Open Git Bash here.</p><p class="note"><b>kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python rieng.py</code> và so với kết quả mong đợi.</p>

      '
    focus:
    - - '1.2'
      - 2
      - 3
    - '1.3'
    - '1.4'
    say: 'Một, tạo tệp: gõ chương trình trong trình soạn văn bản, lưu vào thư mục gốc của bộ khoá. Hai, chạy tệp: mở cửa sổ dòng lệnh ở thư mục đó, gõ lệnh trên màn hình, kết quả in ngay bên dưới. Ba, chấm bài: lệnh ở hàng cuối chạy tệp chấm, rồi in chữ ĐÚNG khi mọi dòng trùng.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>a, b, c, d = 5, 2, 2, 2</code></td><td>gán nhiều biến một lúc; ma trận <code>[[a, b], [c, d]]</code> là danh sách lồng hai hàng</td><td><code>M = [[a, b], [c, d]]</code> rồi <code>M[0][1]</code> là b</td></tr><tr><td><code>math.gcd(4, -6)</code></td><td>ước chung lớn nhất của hai số; <code>import math</code> (ở đầu tệp) nạp thư viện toán, rồi dùng <code>math.gcd</code>, <code>math.isqrt</code>, <code>math.sqrt</code></td><td><code>math.gcd(4, -6)</code> là 2; chia cả hai số cho 2 được <code>(2, -3)</code></td></tr><tr><td><code>delta = vet * vet - 4 * dt</code></td><td><b>biệt thức</b> delta của phương trình bậc hai: vết (tổng hai số trên đường chéo) bình phương trừ 4 lần định thức; delta âm thì không có nghiệm thực</td><td>vet = 7, dt = 6: delta = 49 − 24 = 25</td></tr><tr><td><code style="white-space:nowrap">(vet - math.isqrt(25)) // 2</code></td><td>căn nguyên của 25 là 5 (chính xác khi số là chính phương); hai dấu gạch chéo là chia lấy phần nguyên</td><td><code>(7 - 5) // 2</code> là 1</td></tr></table>

      '
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: 'Đọc trước bốn mẩu mã sẽ dùng trong chương trình. Gán nhiều biến một lúc: dòng này đặt bốn số của ma trận vào bốn tên a, b, c, d. Hàm ước chung lớn nhất cho số lớn nhất chia hết cả hai số, để rút gọn vector riêng. Biệt thức của phương trình bậc hai bằng vết bình phương trừ 4 lần định thức, và khi âm thì không có nghiệm thực. Hàm căn nguyên cho căn làm tròn xuống, chính xác khi số là chính phương, còn hai dấu gạch chéo là chia lấy phần nguyên.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước (tiếp): cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>print(f"vector rieng cho {lam}: {v}")</code></td><td>f-string: giá trị trong ngoặc nhọn chèn vào chữ</td><td>lam = 1, v = [1, -2] in <code>vector rieng cho 1: [1, -2]</code></td></tr><tr><td><code>for lam in [1, 6]:</code></td><td>với mỗi trị riêng lần lượt, làm các dòng thụt vào</td><td>lam = 1 một lượt, rồi lam = 6</td></tr><tr><td><code>if delta &lt; 0:</code></td><td>nếu đúng thì làm nhánh <code>if</code>; ngược lại làm nhánh <code>else</code></td><td>delta = −16 &lt; 0: không có trị riêng thực</td></tr></table>

      '
    say: Còn vài mẩu mã nữa, đọc kỹ ở bảng.
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>rieng.py</code> cho $M = \begin{bmatrix} 5 & 2 \\ 2 & 2 \end{bmatrix}$ rồi cho ma trận xoay $R = \begin{bmatrix} 0 & -2 \\ 2 & 0 \end{bmatrix}$:</p>

      <table class="t"><tr><th>in ra</th><th>cách làm</th></tr>

      <tr><td>định thức, vết</td><td>$ad - bc$ và $a + d$ (vết = tổng hai số trên đường chéo)</td></tr>

