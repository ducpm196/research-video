id: L05
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 5 — Trị riêng & vector riêng: hướng mà ma trận chỉ kéo giãn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L205-L207 (SVD: vector riêng của AAᵀ, AᵀA), L213 (PCA: K vector riêng của S), L256-L260 (dấu trị riêng của Hessian)"
assumes: [vec, sub, reals, in, transpose, cdot, implies, iff, zero_vec, mat, dim, identity, inverse, sqrt]
# Quy ước ký hiệu của bài (lint kiểm, xem tools/registry/symbols.yaml):
#   ma trận: chữ hoa in đậm (A, B, C, R, S); ma trận đơn vị luôn có chỉ số: I₂; định thức: det (giới thiệu ở prereq);
#   trị riêng: λ (λ₁, λ₂); vector riêng: v (v₁ ứng với λ₁, v₂ ứng với λ₂); vector chưa biết: v = (x, y)ᵀ với x, y là
#   hai SỐ (chữ thường không in đậm); nhân hai số: ·; vector viết ngang có ^T; kích thước: \sz{M}{N}.
# Điểm bổ sung so với nguồn (audit A21): nguồn DÙNG trị riêng/vector riêng (dòng 205, 207, 213, 256–260) mà không
#   định nghĩa; thiếu điều kiện v ≠ 0 (T14a); bảng dòng 256–260 ngầm cần trị riêng thực, đúng với Hessian đối xứng
#   nhưng ma trận quay không có trị riêng thực (T14b); hai tên “giá trị riêng” (213) và “trị riêng” (256).
#   Nhắc A1 (λ = 0 thì phép thử Hessian chưa kết luận) ở phân cảnh AI.
# Phát âm “lambda”: lexicon → “lam-đa”. Đối chứng 2026-10-23 (scratchpad lambda_probe.py): audio “lambda” và
#   “lam đa” dài bằng nhau (3,264 s); ASR hay nghe “lam” thành “năm” (l/n), xem vi_text.LETTER_HEARD.
objectives:
  - "Đọc thành lời: A nhân v bằng lambda nhân v; định thức của A trừ lambda I hai bằng 0; lambda một, v một"
  - "Giải thích bằng hình: vector riêng là hướng mà ma trận chỉ kéo giãn (hoặc lật ngược), không xoay"
  - "Tự suy ra phương trình định thức của A trừ lambda I hai bằng 0 từ định nghĩa và bài 2 (nghịch đảo, định thức)"
  - "Tìm trị riêng và vector riêng của ma trận 2 nhân 2 bằng tay"
  - "Tự kiểm tra bằng A v = lambda v và bằng tổng, tích các trị riêng; nhận ra 4 lỗi thường gặp"
# Câu cả small và medium nghe khác ở TỪ RỦI RO, đã xem xét bằng đối chứng 2026-10-23 (scratchpad l04_probe.py,
# medium nghe lại): câu viết hẳn “vê”, “ét” cho medium chép y hệt bản chữ cái thô (“bv … v”, “x”) → TTS đọc tên chữ
