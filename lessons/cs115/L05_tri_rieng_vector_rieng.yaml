scenes:
- id: hook
  kind: hook
  title: Có hướng nào ma trận không xoay?
  checks:
  - Matrix([[2,1],[1,2]])*Matrix([1,0]) == Matrix([2,1])
  - Matrix([[2,1],[1,2]])*Matrix([1,1]) == Matrix([3,3]) and Matrix([3,3]) == 3*Matrix([1,1])
  steps:
  - show: '$$\mathbf{A} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}, \qquad \mathbf{A}\,(1, 0)^T = (2\cdot 1 + 1\cdot 0,\ 1\cdot 1 + 2\cdot 0)^T = \hl{(2, 1)^T}$$

      <p class="note">Nhân ma trận với vector → vector mới, thường đã bị <b>xoay</b> sang hướng khác.</p>

      '
    focus:
    - 2
    - 1
    - - 1
      - 2
    say: Chào bạn, nhân một ma trận với một vector thì được một vector mới. Lấy ma trận A có hàng trên 2, 1, hàng dưới 1, 2. Nhân A với vector 1, 0, ta được 2, 1, một vector đã bị xoay sang hướng khác.
  - clear: true
    show: "<div class=\"row\"><div class=\"col\">\n<svg width=\"520\" height=\"455\" viewBox=\"0 0 480 420\">\n  <defs>\n    <marker id=\"hK\" markerUnits=\"userSpaceOnUse\" markerWidth=\"20\" markerHeight=\"20\" refX=\"17\" refY=\"10\" orient=\"auto\"><path d=\"M0,0 L20,10 L0,20 z\" fill=\"#6b7280\"/></marker>\n    <marker id=\"hR\" markerUnits=\"userSpaceOnUse\" markerWidth=\"20\" markerHeight=\"20\" refX=\"17\" refY=\"10\" orient=\"auto\"><path d=\"M0,0 L20,10 L0,20 z\" fill=\"#e11d48\"/></marker>\n    <marker id=\"hB\" markerUnits=\"userSpaceOnUse\" markerWidth=\"20\" markerHeight=\"20\" refX=\"17\" refY=\"10\" orient=\"auto\"><path d=\"M0,0 L20,10 L0,20 z\" fill=\"#2563eb\"/></marker>\n    <marker id=\"hG\" markerUnits=\"userSpaceOnUse\" markerWidth=\"20\" markerHeight=\"20\" refX=\"17\" refY=\"10\" orient=\"auto\"><path d=\"M0,0 L20,10 L0,20 z\" fill=\"#059669\"/></marker>\n  </defs>\n  <line x1=\"40\" y1=\"410\" x2=\"410\" y2=\"40\" stroke=\"#cbd5e1\" stroke-width=\"3\" stroke-dasharray=\"10 8\"/>\n  <line x1=\"120\" y1=\"330\" x2=\"330\" y2=\"120\" stroke=\"#059669\" stroke-width=\"10\" marker-end=\"url(#hG)\"/>\n  <line x1=\"120\" y1=\"330\" x2=\"190\" y2=\"260\" stroke=\"#2563eb\" stroke-width=\"5\" marker-end=\"url(#hB)\"/>\n  <line x1=\"120\" y1=\"330\" x2=\"190\" y2=\"330\" stroke=\"#6b7280\" stroke-width=\"5\" marker-end=\"url(#hK)\"/>\n  <line x1=\"120\" y1=\"330\" x2=\"260\" y2=\"260\" stroke=\"#e11d48\" stroke-width=\"5\" marker-end=\"url(#hR)\"/>\n  <text x=\"150\" y=\"372\" font-size=\"26\" fill=\"#6b7280\" font-weight=\"700\">(1, 0)</text>\n  <text x=\"270\" y=\"300\" font-size=\"26\" fill=\"#e11d48\" font-weight=\"700\">(2, 1)</text>\n  <text x=\"60\" y=\"245\" font-size=\"26\" fill=\"#2563eb\" font-weight=\"700\">(1, 1)</text>\n  <text x=\"345\" y=\"170\" font-size=\"26\" fill=\"#059669\" font-weight=\"700\">(3, 3)</text>\n</svg></div>\n<div class=\"col\"><p class=\"note\">$\\mathbf{A} = \\begin{bmatrix} 2 & 1 \\\\ 1 & 2 \\end{bmatrix}$; xám: $(1, 0)^T$, đỏ: $\\mathbf{A}\\,(1, 0)^T$ — đã bị xoay.</p>\n<p>Nhưng: $\\ \\mathbf{A}\\,\\hlb{(1, 1)^T} = (2 + 1,\\ 1 + 2)^T = \\hlg{(3, 3)^T} = 3\\,\\hlb{(1, 1)^T}$</p>\n<p class=\"note\">Mũi tên lục vẫn nằm trên <b>cùng đường thẳng</b> (nét đứt) với mũi tên xanh, chỉ dài gấp 3: ma trận <b>chỉ kéo giãn</b> hướng này.</p></div></div>\n"
    say: Nhưng nhân A với vector 1, 1 thì được 3, 3, đúng bằng 3 lần vector cũ. Trên hình, mũi tên lục vẫn nằm trên đường nét đứt chứa mũi tên xanh, chỉ dài gấp 3. Ma trận chỉ kéo giãn hướng này, không xoay nó.
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: hàng nhân cột, trừ ma trận, định thức'
  checks:
  - Matrix([[2,1],[1,2]])*Matrix([1,1]) == Matrix([2*1+1*1, 1*1+2*1])
  - 3*sp.eye(2) == Matrix([[3,0],[0,3]]) and sp.eye(2)*Matrix([5,7]) == Matrix([5,7])
  - Matrix([[2,1],[1,2]]) - 3*sp.eye(2) == Matrix([[-1,1],[1,-1]])
  - Matrix([[1,2],[2,4]]).det() == 0 and 1*4 - 2*2 == 0 and Matrix([[1,2],[2,4]])*Matrix([2,-1]) == Matrix([0,0])
  steps:
  - show: '<p>Nhân ma trận với vector — <b>hàng nhân cột</b> (bài 2): $\ \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}\begin{bmatrix} 1 \\ 1 \end{bmatrix} = \begin{bmatrix} 2\cdot 1 + 1\cdot 1 \\ 1\cdot 1 + 2\cdot 1 \end{bmatrix}$</p>

      <p>Ma trận đơn vị: $\ \mathbf{I}_2\,\mathbf{v} = \mathbf{v}$, &nbsp; và $\ 3\,\mathbf{I}_2 = \begin{bmatrix} 3 & 0 \\ 0 & 3 \end{bmatrix}$</p>

      <p class="note">Quy ước: $(a, b)^T$ là vector cột; “với số thực” = chỉ dùng số thực; $\implies$ đọc là “suy ra”.</p>

      '
    focus:
    - 0
    - 1
    - 2
    - 3
    say: 'Ôn lại ba công cụ về ma trận đã học ở bài 2. Một, nhân ma trận với vector theo kiểu hàng nhân cột. Hai, I hai nhân với vector nào cũng được lại chính vector đó, còn 3 nhân I hai là ma trận có số 3 trên đường chéo, số 0 ở chỗ khác. Nhắc ba quy ước: a, b trong ngoặc rồi chữ T nhỏ là vector cột, số thực là mọi số trên trục số, và mũi tên kép đọc là suy ra.'
  - show: '<p><b>Trừ hai ma trận cùng cỡ</b> = trừ từng ô cùng vị trí, giống trừ vector ở bài 1:</p>

      $$\mathbf{A} - 3\,\mathbf{I}_2 = \begin{bmatrix} 2 - 3 & 1 - 0 \\ 1 - 0 & 2 - 3 \end{bmatrix} = \begin{bmatrix} -1 & 1 \\ 1 & -1 \end{bmatrix}$$

      <p class="note">Chỉ hai ô trên đường chéo bị trừ 3, vì $3\,\mathbf{I}_2$ có số 0 ở ngoài đường chéo.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: 'Thêm một phép tính nhỏ: trừ hai ma trận cùng cỡ thì trừ từng ô cùng vị trí. A trừ 3 I hai cho âm 1, 1, 1, âm 1. Để ý, chỉ hai ô trên đường chéo bị trừ 3, vì 3 I hai có số 0 ở ngoài đường chéo.'
  - clear: true
    show: '<p><b>Định thức</b> của ma trận $\sz{2}{2}$, viết là $\det$:</p>

      $$\det\begin{bmatrix} a & b \\ c & d \end{bmatrix} = ad - bc$$

      <p class="note">Bài 2: định thức <b>khác 0</b> → có nghịch đảo. Định thức <b>bằng 0</b> → không có nghịch đảo.</p>

      '
    introduces:
    - det
    focus:
    - 1
    - 2
    - 3
    say: Công cụ thứ ba là định thức, con số a d trừ b c của bài 2. Từ bài này ta viết gọn bằng chữ viết tắt như trên màn hình, đọc là định thức của ma trận. Định thức khác 0 thì ma trận có nghịch đảo, bằng 0 thì không.
- id: sym_eigen
  kind: symbol
  title: 'Giải mã: λ, A v = λ v, vector riêng, trị riêng'
  checks:
  - Matrix([[2,1],[1,2]])*Matrix([1,1]) == 3*Matrix([1,1])
  - Matrix([[2,1],[1,2]])*Matrix([1,-1]) == Matrix([2-1, 1-2]) and Matrix([1,-1]) == 1*Matrix([1,-1])
  - '(lambda l: Matrix([[2,1],[1,2]])*sp.zeros(2,1) == l*sp.zeros(2,1))(sp.Symbol(''l''))'
  steps:
  - show: '$$\lambda$$

      <p>Chữ Hy Lạp <b>lambda</b>: chỉ là <b>tên của một con số</b>, giống chữ $c$ trong cái bóng của bài 1.</p>

      '
    introduces:
    - lambda
    focus:
    - 1
    - 2
    say: Ký hiệu mới đầu tiên là chữ Hy Lạp này, đọc là lambda. Đừng sợ, nó chỉ là tên của một con số, giống chữ c trong cái bóng của bài 1.
  - show: '<div class="box key">Nếu có vector $\mathbf{v} \neq \mathbf{0}$ và số $\lambda$ sao cho

      $$\mathbf{A}\mathbf{v} = \lambda\,\mathbf{v}$$

      thì $\mathbf{v}$ là một <b>vector riêng</b> của $\mathbf{A}$, và $\lambda$ là <b>trị riêng</b> ứng với $\mathbf{v}$.</div>

      '
    say: Giờ là định nghĩa chính. Nếu có một vector v khác vector không, và một số lambda, sao cho A nhân v bằng lambda nhân v, thì v gọi là một vector riêng của A, còn lambda là trị riêng ứng với v.
  - show: '<p class="note">Bằng lời: nhân với $\mathbf{A}$ cũng chỉ như nhân với <b>một con số</b> $\lambda$ — mũi tên giữ nguyên đường thẳng, dài gấp $\lambda$ lần.</p>

      '
    say: Nói bằng lời, với riêng vector v này, nhân với cả ma trận A cũng chỉ như nhân với một con số lambda. Mũi tên vẫn nằm trên đường thẳng cũ, chỉ dài gấp lambda lần.
  - clear: true
    show: '<p class="note">Ma trận ở đầu bài: $\ \mathbf{A} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$</p>

      <p>Ở đầu bài: $\ \mathbf{A}\,(1, 1)^T = \hlo{3}\,(1, 1)^T$ → $(1, 1)^T$ là vector riêng, trị riêng $\lambda = \hlo{3}$.</p>

      <p>Thêm một vector: $\ \mathbf{A}\,(1, -1)^T = (2 - 1,\ 1 - 2)^T = (1, -1)^T = \hlo{1}\,(1, -1)^T$ → trị riêng $\lambda = \hlo{1}$.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - '3.2'
    say: Áp dụng ngay với ma trận A ở đầu bài. A nhân 1, 1 bằng 3 nhân 1, 1, nên 1, 1 là vector riêng, với trị riêng bằng 3. Thử thêm vector 1, âm 1, A nhân nó bằng 2 trừ 1, 1 trừ 2, tức là chính 1, âm 1. Vậy trị riêng là 1.
  - show: '<div class="box warn">Vì sao bắt buộc $\mathbf{v} \neq \mathbf{0}$? $$\mathbf{A}\,\mathbf{0} = \mathbf{0} = \lambda\,\mathbf{0}$$ đúng với <b>mọi</b> số $\lambda$ → không cho biết gì cả.</div>

      '
    say: Vì sao v phải khác vector không? Vì A nhân vector không và lambda nhân vector không đều ra vector không, với mọi lambda, nên đẳng thức đó không cho ta biết gì.
- id: meaning
  kind: intuition
  title: λ cho biết gì? Và không phải ma trận nào cũng có
  checks:
  - Matrix([[2,1],[1,2]])*Matrix([2,2]) == Matrix([6,6]) and Matrix([6,6]) == 3*Matrix([2,2])
  - '(lambda c, l, v: sp.expand(c*(l*v) - l*(c*v)) == sp.zeros(2,1))(sp.Symbol(''c''), sp.Symbol(''l''), Matrix(sp.symbols(''p r'')))'
  - Matrix([[0,-1],[1,0]])*Matrix([1,0]) == Matrix([0,1]) and Matrix([[0,-1],[1,0]])*Matrix([0,1]) == Matrix([-1,0])
  - '(lambda v: ((3*v).norm(), (Rational(1, 2)*v).norm(), (-1*v).norm()) == (3*v.norm(), v.norm()/2, v.norm()) and (-1*v).dot(v) < 0 and (1060 - 760, 810 - 760, 760 - 660) == (3*100, 100//2, 100))(Matrix([1, 1]))'
  steps:
  - show: '<table class="t"><tr><th>Trị riêng</th><th>Mũi tên $\mathbf{v}$ sau khi nhân với $\mathbf{A}$</th></tr>

      <tr><td>$\lambda > 1$</td><td>dài ra (cùng chiều)</td></tr>

      <tr><td>$0 < \lambda < 1$</td><td>ngắn lại (cùng chiều)</td></tr>

      <tr><td>$\lambda < 0$</td><td><b>lật ngược chiều</b>, vẫn trên cùng đường thẳng</td></tr>

      <tr><td>$\lambda = 0$</td><td>bị ép thành vector không</td></tr></table>

      <p class="note">Ví dụ $\lambda = 0$: $\ \begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}\begin{bmatrix} 2 \\ -1 \end{bmatrix} = \begin{bmatrix} 1\cdot 2 + 2\cdot(-1) \\ 2\cdot 2 + 4\cdot(-1) \end{bmatrix} = \begin{bmatrix} 0 \\ 0 \end{bmatrix}$</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    say: Con số lambda cho biết mũi tên bị làm gì. Lambda lớn hơn 1 thì mũi tên dài ra. Nằm giữa 0 và 1 thì ngắn lại. Lambda âm thì mũi tên bị lật ngược chiều, nhưng vẫn trên đường thẳng cũ. Lambda bằng 0 thì bị ép thành vector không.
  - clear: true
    show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="e5K" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#6b7280"/></marker><marker id="e5G" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#059669"/></marker><marker id="e5B" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#2563eb"/></marker><marker id="e5R" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#e11d48"/></marker></defs><line x1="440" y1="70" x2="1180" y2="70" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/><line x1="760" y1="70" x2="860" y2="70" stroke="#6b7280" stroke-width="7" marker-end="url(#e5K)"/><circle cx="760" cy="70" r="7" fill="#1f2937"/><text x="40" y="79" font-size="26" fill="#6b7280" font-weight="700">v ban đầu</text><line x1="440" y1="160" x2="1180" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/><line x1="760" y1="160" x2="1060" y2="160" stroke="#059669" stroke-width="7" marker-end="url(#e5G)"/><circle cx="760" cy="160" r="7" fill="#1f2937"/><text x="40" y="169" font-size="26" fill="#059669" font-weight="700">trị riêng 3: dài gấp 3</text><line x1="440" y1="250" x2="1180" y2="250" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/><line x1="760" y1="250" x2="810" y2="250" stroke="#2563eb" stroke-width="7" marker-end="url(#e5B)"/><circle cx="760" cy="250" r="7" fill="#1f2937"/><text x="40" y="259" font-size="26" fill="#2563eb" font-weight="700">trị riêng 0,5: còn một nửa</text><line x1="440" y1="340" x2="1180" y2="340" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/><line x1="760" y1="340" x2="660" y2="340" stroke="#e11d48" stroke-width="7" marker-end="url(#e5R)"/><circle cx="760" cy="340" r="7" fill="#1f2937"/><text x="40" y="349" font-size="26" fill="#e11d48" font-weight="700">trị riêng âm 1: lật ngược</text><text x="1200" y="390" font-size="24" fill="#6b7280" text-anchor="end">cùng một đường thẳng, chỉ đổi độ dài và chiều</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình này vẽ một vector riêng v, rồi kết quả khi ma trận có trị riêng 3, 0,5 hoặc âm 1 tác động lên nó. Mọi mũi tên đều nằm trên cùng một đường nét đứt. Trị riêng 3 kéo mũi tên dài gấp 3, trị riêng 0,5 thu nó còn một nửa. Trị riêng âm 1 giữ nguyên độ dài nhưng lật mũi tên.
  - clear: true
    show: '<p>Ma trận quay một góc vuông: $\ \mathbf{R} = \begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$: &nbsp; $\mathbf{R}\,(1, 0)^T = (0, 1)^T, \quad \mathbf{R}\,(0, 1)^T = (-1, 0)^T$</p>

      <div class="box warn">$\mathbf{R}$ xoay <b>mọi</b> mũi tên đi một góc vuông → không mũi tên nào giữ được đường thẳng → $\mathbf{R}$ <b>không có</b> vector riêng (với số thực).</div>

      '
    focus:
    - 0
    - 1
    - 2
    say: Nhưng không phải ma trận nào cũng có vector riêng. Ma trận R với hàng trên 0, âm 1, hàng dưới 1, 0, xoay mọi mũi tên đi một góc vuông. Không mũi tên nào giữ được đường thẳng cũ, nên R không có vector riêng nào với số thực.
- id: derive
  kind: formula
  title: 'Tìm λ không cần đoán: định thức của A − λI bằng 0'
  checks:
  - '(lambda l, v: sp.expand(l*sp.eye(2)*v - l*v) == sp.zeros(2,1))(sp.Symbol(''l''), Matrix(sp.symbols(''p r'')))'
  - '(lambda l, v: sp.expand((Matrix([[2,1],[1,2]]) - l*sp.eye(2))*v - (Matrix([[2,1],[1,2]])*v - l*v)) == sp.zeros(2,1))(sp.Symbol(''l''), Matrix(sp.symbols(''p r'')))'
  - '(lambda a, b, c, d, l: sp.expand((Matrix([[a,b],[c,d]]) - l*sp.eye(2)).det() - ((a-l)*(d-l) - b*c)) == 0)(*sp.symbols(''a b c d l''))'
  - '(lambda l: sp.expand((2-l)*(2-l) - 1*1) == l**2 - 4*l + 3 and sp.expand((l-1)*(l-3)) == l**2 - 4*l + 3 and sp.expand((Matrix([[2,1],[1,2]]) - l*sp.eye(2)).det()) == l**2 - 4*l + 3)(sp.Symbol(''l''))'
  - sp.solve(sp.Symbol('l')**2 - 4*sp.Symbol('l') + 3) == [1, 3]
  steps:
  - show: '<p><b>Bước 1.</b> Chuyển vế: $\ \mathbf{A}\mathbf{v} = \lambda\,\mathbf{v} \implies \mathbf{A}\mathbf{v} - \lambda\,\mathbf{v} = \mathbf{0}$</p>

      '
    say: Giờ ta tự suy ra cách tìm lambda. Bước một, chuyển vế lambda v sang trái, ta được A v trừ lambda v bằng vector không.
  - show: '<p><b>Bước 2.</b> Thay $\ \lambda\,\mathbf{v} = \lambda\,\mathbf{I}_2\,\mathbf{v}\ $ (vì $\mathbf{I}_2\mathbf{v} = \mathbf{v}$), rồi đặt $\mathbf{v}$ ra ngoài, bên phải:</p>

      $$\mathbf{A}\mathbf{v} - \lambda\,\mathbf{I}_2\,\mathbf{v} = \mathbf{0} \implies (\mathbf{A} - \hlo{\lambda\,\mathbf{I}_2})\,\mathbf{v} = \mathbf{0}$$

      <p class="note">Phải có $\mathbf{I}_2$: ma trận trừ một con số thì không có nghĩa, ma trận trừ ma trận thì có.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước hai, vì I hai nhân v bằng v, nên ta thay lambda v bằng lambda I hai nhân v. Cả hai số hạng đều có v bên phải, nên đặt v ra ngoài. Phải có I hai, vì ma trận trừ một con số không có nghĩa, còn ma trận trừ ma trận thì có.
  - clear: true
    show: '<p class="note">Đang có: $\ (\mathbf{A} - \lambda\,\mathbf{I}_2)\,\mathbf{v} = \mathbf{0}$, &nbsp; với $\mathbf{v} \neq \mathbf{0}$.</p>

      <p><b>Bước 3.</b> Giả sử $\mathbf{A} - \lambda\,\mathbf{I}_2$ có nghịch đảo. Nhân bên trái hai vế với nghịch đảo đó:</p>

      $$\mathbf{v} = (\mathbf{A} - \lambda\,\mathbf{I}_2)^{-1}\,\mathbf{0} = \mathbf{0} \quad \text{— trái với } \mathbf{v} \neq \mathbf{0}$$

      <p>Vậy $\mathbf{A} - \lambda\,\mathbf{I}_2$ <b>không có</b> nghịch đảo, nên theo bài 2 định thức của nó bằng 0.</p>

      '
    focus:
    - 0
    - 2
    - 3
    - 4
    say: Bước ba là bước quan trọng nhất. Giả sử ma trận A trừ lambda I hai có nghịch đảo. Nhân bên trái hai vế với nghịch đảo đó, như bài 2, ta được v bằng vector không, trái với điều kiện v khác 0. Vậy ma trận đó không có nghịch đảo, nên theo bài 2, định thức của nó bằng 0.
  - show: '<div class="box key">Trị riêng là nghiệm của phương trình: $$\det(\mathbf{A} - \lambda\,\mathbf{I}_2) = 0$$</div>

      <p class="note">Khớp với ví dụ $\lambda = 0$ ở trên: $\begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}$ có định thức $1\cdot 4 - 2\cdot 2 = 0$, và nó biến $(2, -1)^T$ khác 0 thành vector không.</p>

      '
    focus:
    - 1
    - 1
    say: Đây là kết quả chính, suy ra từ bước ba. Nghĩa là trị riêng là nghiệm của phương trình định thức của A trừ lambda I hai bằng 0.
  - clear: true
    show: '<p>Với $\sz{2}{2}$: $\ \mathbf{A} - \lambda\,\mathbf{I}_2 = \begin{bmatrix} a - \hlo{\lambda} & b \\ c & d - \hlo{\lambda} \end{bmatrix}$, nên

      $$\det(\mathbf{A} - \lambda\,\mathbf{I}_2) = (a - \lambda)(d - \lambda) - bc = 0$$</p>

      <p class="note">Một phương trình bậc hai, ẩn là $\lambda$ → nhiều nhất <b>hai</b> trị riêng.</p>

      '
    focus:
    - '1.2'
    - '1.3'
    - 2
    say: Với ma trận 2 nhân 2 có bốn số a, b, c, d, ta chỉ trừ lambda ở hai ô trên đường chéo. Thay vào công thức a d trừ b c, ta được a trừ lambda nhân d trừ lambda, trừ b c, bằng 0. Đây là phương trình bậc hai ẩn lambda, nên có nhiều nhất hai trị riêng.
  - clear: true
    show: '<p><b>Làm thử ngay</b> với $\ \mathbf{A} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$:</p>

      $$\det(\mathbf{A} - \lambda\,\mathbf{I}_2) = (2 - \lambda)(2 - \lambda) - 1\cdot 1 = \lambda^2 - 4\lambda + 3 = (\lambda - 1)(\lambda - 3) = 0$$

      <p>Hai số có tổng $4$ và tích $3$ là $1$ và $3$, nên viết được thành tích. Tích bằng 0 thì một thừa số bằng 0: $\ \hlo{\lambda = 1}\ $ hoặc $\ \hlo{\lambda = 3}$ — đúng hai số ở phần định nghĩa.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Làm thử ngay với ma trận A. Thay số, ta được 2 trừ lambda nhân 2 trừ lambda, trừ 1. Phá ngoặc ra lambda bình phương trừ 4 lambda cộng 3. Hai số có tổng bằng 4 và tích bằng 3 là 1 và 3, nên viết lại được thành lambda trừ 1 nhân lambda trừ 3. Tích bằng 0 nên lambda bằng 1 hoặc 3.
- id: find_v
  kind: formula
  title: 'Có λ rồi, tìm v: giải (A − λI) v = 0'
  checks:
  - Matrix([[2,1],[1,2]]) - 3*sp.eye(2) == Matrix([[-1,1],[1,-1]])
  - '(lambda x, y: Matrix([[-1,1],[1,-1]])*Matrix([x,y]) == Matrix([-x+y, x-y]))(*sp.symbols(''x y''))'
  - Matrix([[-1,1],[1,-1]])*Matrix([1,1]) == Matrix([0,0])
  - Matrix([[2,1],[1,2]]) - 1*sp.eye(2) == Matrix([[1,1],[1,1]]) and Matrix([[1,1],[1,1]])*Matrix([1,-1]) == Matrix([0,0])
  - '(lambda a, b, c, d, l: sp.expand((a-l)*(d-l) - b*c - (l**2 - (a+d)*l + (a*d - b*c))) == 0)(*sp.symbols(''a b c d l''))'
  - '(lambda l, l1, l2: sp.expand((l-l1)*(l-l2) - (l**2 - (l1+l2)*l + l1*l2)) == 0)(*sp.symbols(''l l1 l2''))'
  - 1 + 3 == 2 + 2 and 1*3 == 2*2 - 1*1
  steps:
  - show: '<p class="note">Đang có: $\ \mathbf{A} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}, \quad \lambda_1 = 3,\ \ \lambda_2 = 1$</p>

      <p>$\hlo{\lambda_1 = 3}$: &nbsp; $\mathbf{A} - 3\,\mathbf{I}_2 = \begin{bmatrix} -1 & 1 \\ 1 & -1 \end{bmatrix}$. Đặt $\ \mathbf{v} = (x, y)^T$ ($x, y$ là hai số chưa biết):</p>

      $$\begin{bmatrix} -1 & 1 \\ 1 & -1 \end{bmatrix}\begin{bmatrix} x \\ y \end{bmatrix} = \begin{bmatrix} -x + y \\ x - y \end{bmatrix} = \begin{bmatrix} 0 \\ 0 \end{bmatrix} \implies y = x$$

      '
    focus:
    - 0
    - '2.1'
    - '2.3'
    - 3
    say: Có trị riêng rồi, ta tìm vector riêng bằng cách giải A trừ lambda I hai, nhân v, bằng vector không. Gọi lambda một bằng 3. Đặt v bằng x, y. Nhân hàng với cột, ta được âm x cộng y bằng 0, và x trừ y bằng 0, nên y bằng x.
  - show: '<p>Chọn $x = 1$: &nbsp; $\hlg{\mathbf{v}_1 = (1, 1)^T}$. &nbsp; Hai phương trình thực chất là <b>một</b> — điều này luôn xảy ra, vì định thức bằng 0.</p>

      '
    say: Hai phương trình thực chất chỉ là một, và điều này luôn xảy ra, vì định thức bằng 0. Nên ta được tự chọn một số, chọn x bằng 1, ra vector riêng v một bằng 1, 1, đúng vector ở đầu bài.
  - show: '<p>$\hlo{\lambda_2 = 1}$: &nbsp; $\mathbf{A} - \mathbf{I}_2 = \begin{bmatrix} 1 & 1 \\ 1 & 1 \end{bmatrix}$: &nbsp; $x + y = 0 \implies y = -x$, chọn $x = 1$: &nbsp; $\hlg{\mathbf{v}_2 = (1, -1)^T}$</p>

      '
    say: Với lambda hai bằng 1, ma trận A trừ I hai có bốn số 1. Cả hai hàng cho cùng phương trình x cộng y bằng 0, nên y bằng âm x. Chọn x bằng 1, ra v hai bằng 1, âm 1.
  - clear: true
    show: '<div class="box key"><b>Công thức 3 bước</b> cho ma trận $\sz{2}{2}$:

      <ol><li>Giải $\ \det(\mathbf{A} - \lambda\,\mathbf{I}_2) = 0\ $ → các trị riêng $\lambda_1, \lambda_2$.</li>

      <li>Với từng $\lambda$: giải $\ (\mathbf{A} - \lambda\,\mathbf{I}_2)\,\mathbf{v} = \mathbf{0}$, chọn một $\mathbf{v} \neq \mathbf{0}$.</li>

      <li>Thử lại: $\ \mathbf{A}\mathbf{v} = \lambda\,\mathbf{v}$.</li></ol></div>

      '
    say: Gom lại thành ba bước, theo thứ tự vừa làm. Bước một, giải phương trình định thức để ra các trị riêng. Bước hai, với từng trị riêng, giải A trừ lambda I hai nhân v bằng không, chọn một v khác 0. Bước ba, thử lại A v bằng lambda v.
  - show: '<p><b>Phép thử nhanh</b> cho $\lambda$ — phá ngoặc hai cách viết của cùng một biểu thức, rồi so hệ số:</p>

      $$(a - \lambda)(d - \lambda) - bc = \lambda^2 - (a + d)\lambda + (ad - bc), \qquad (\lambda - \lambda_1)(\lambda - \lambda_2) = \lambda^2 - (\lambda_1 + \lambda_2)\lambda + \lambda_1\lambda_2$$

      <div class="box ok">$\lambda_1 + \lambda_2 = a + d \quad$ (tổng đường chéo), $\qquad \lambda_1\cdot\lambda_2 = ad - bc \quad$ (định thức)</div>

      '
    focus:
    - 1
    - 2
    - 3
    say: Thêm một phép thử nhanh. Phá ngoặc phương trình định thức, rồi so với dạng lambda trừ lambda một, nhân lambda trừ lambda hai. Hai cách viết là cùng một biểu thức, nên tổng hai trị riêng bằng tổng đường chéo, tích bằng định thức.
- id: example
  kind: example
  title: 'Ví dụ từng bước: B = [[4, 1], [2, 3]]'
  checks:
  - '(lambda l: sp.expand((4-l)*(3-l) - 1*2) == l**2 - 7*l + 10 and sp.expand((4-l)*(3-l)) == 12 - 7*l + l**2)(sp.Symbol(''l''))'
  - '(lambda l: sp.expand((l-2)*(l-5)) == l**2 - 7*l + 10 and sp.expand((Matrix([[4,1],[2,3]]) - l*sp.eye(2)).det()) == l**2 - 7*l + 10)(sp.Symbol(''l''))'
  - sorted(Matrix([[4,1],[2,3]]).eigenvals()) == [2, 5] and 5 + 2 == 4 + 3 and 5*2 == 4*3 - 1*2
  - Matrix([[4,1],[2,3]]) - 5*sp.eye(2) == Matrix([[-1,1],[2,-2]]) and Matrix([[-1,1],[2,-2]])*Matrix([1,1]) == Matrix([0,0])
  - Matrix([[4,1],[2,3]]) - 2*sp.eye(2) == Matrix([[2,1],[2,1]]) and Matrix([[2,1],[2,1]])*Matrix([1,-2]) == Matrix([0,0])
  steps:
  - show: '<p>Đề: tìm trị riêng và vector riêng của $\ \mathbf{B} = \begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}$.</p>

      <p><b>①</b> $$\det(\mathbf{B} - \lambda\,\mathbf{I}_2) = (4 - \lambda)(3 - \lambda) - 1\cdot 2 = 12 - 7\lambda + \lambda^2 - 2 = \lambda^2 - 7\lambda + 10$$</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Giờ làm ví dụ với ma trận B, hàng trên 4, 1, hàng dưới 2, 3. Bước một, theo công thức, định thức bằng 4 trừ lambda nhân 3 trừ lambda, trừ 1 nhân 2. Phá ngoặc, ta được lambda bình phương trừ 7 lambda cộng 10.
  - show: '<p><b>②</b> $$\lambda^2 - 7\lambda + 10 = (\lambda - 2)(\lambda - 5) = 0 \implies \hlo{\lambda_1 = 5},\ \ \hlo{\lambda_2 = 2}$$</p>

      <p class="note">Hai số có tổng $7$, tích $10$ là $2$ và $5$. &nbsp; Thử nhanh: $\ 5 + 2 = 7 = 4 + 3\ \checkmark, \quad 5\cdot 2 = 10 = 4\cdot 3 - 1\cdot 2\ \checkmark$</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước hai, hai số có tổng bằng 7 và tích bằng 10 là 2 và 5, nên phân tích thành lambda trừ 2 nhân lambda trừ 5. Tích bằng 0, nên lambda một bằng 5, lambda hai bằng 2. Thử nhanh, 5 cộng 2 bằng 7, đúng tổng đường chéo. 5 nhân 2 bằng 10, đúng định thức 12 trừ 2.
  - clear: true
    show: '<p class="note">Đã có: $\ \mathbf{B} = \begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}, \quad \lambda_1 = 5,\ \ \lambda_2 = 2$</p>

      <p><b>③</b> $\hlo{\lambda_1 = 5}$: &nbsp; $\mathbf{B} - 5\,\mathbf{I}_2 = \begin{bmatrix} -1 & 1 \\ 2 & -2 \end{bmatrix}$: &nbsp; $-x + y = 0,\ \ 2x - 2y = 0 \implies y = x$, &nbsp; $\hlg{\mathbf{v}_1 = (1, 1)^T}$</p>

      '
    focus:
    - '2.3'
    - '2.4'
    - '2.5'
    say: Bước ba, với lambda một bằng 5, trừ 5 ở hai ô đường chéo, ta được âm 1, 1, 2, âm 2. Hai phương trình là âm x cộng y bằng 0, và 2 x trừ 2 y bằng 0, thực chất là một, nên y bằng x. Chọn v một bằng 1, 1.
  - show: '<p><b>④</b> $\hlo{\lambda_2 = 2}$: &nbsp; $\mathbf{B} - 2\,\mathbf{I}_2 = \begin{bmatrix} 2 & 1 \\ 2 & 1 \end{bmatrix}$: &nbsp; $2x + y = 0 \implies y = -2x$, &nbsp; chọn $x = 1$: &nbsp; $\hlg{\mathbf{v}_2 = (1, -2)^T}$</p>

      '
    say: Bước bốn, với lambda hai bằng 2, ta được hai hàng giống nhau, 2, 1. Phương trình 2 x cộng y bằng 0, nên y bằng âm 2 x. Chọn x bằng 1, ra v hai bằng 1, âm 2.
  - show: <p><b>Chạy thử Python — kiểm đẳng thức trị riêng A v = lambda v:</b></p><div class="code"><div>A, v, lam = [[5, 2], [2, 2]], [2, 1], 6</div><div>Av = [sum(row[j]*v[j] for j in range(2)) for row in A]</div><div>print(Av == [lam*x for x in v])</div></div>
    say: Chạy Python nhân ma trận với vector riêng để kiểm lại tỉ lệ kéo giãn đúng bằng trị riêng.
    clear: true
    focus: null
- id: verify
  kind: check
  title: 'Phép thử: B v = λ v'
  checks:
  - Matrix([[4,1],[2,3]])*Matrix([1,1]) == Matrix([4+1, 2+3]) and Matrix([5,5]) == 5*Matrix([1,1])
  - Matrix([[4,1],[2,3]])*Matrix([1,-2]) == Matrix([4-2, 2-6]) and Matrix([2,-4]) == 2*Matrix([1,-2])
  - Matrix([1,1]).dot(Matrix([1,-2])) == -1 and 1 - 2 == -1
  - Matrix([[2,1],[1,2]]).T == Matrix([[2,1],[1,2]]) and Matrix([1,1]).dot(Matrix([1,-1])) == 0 and Matrix([[4,1],[2,3]]).T != Matrix([[4,1],[2,3]])
  - '(lambda Q: Q.T*Q == sp.eye(2))(Matrix([[1,1],[1,-1]])/sqrt(2)) and Matrix([1,1]).norm() == sqrt(2)'
  steps:
  - show: '<p><b>Phép thử 1 — theo định nghĩa</b>, $\mathbf{B}\mathbf{v} = \lambda\,\mathbf{v}$, với $\ \mathbf{B} = \begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}$:</p>

      $$\mathbf{B}\,(1, 1)^T = (4 + 1,\ 2 + 3)^T = (5, 5)^T = \hlo{5}\,(1, 1)^T\ \checkmark$$

      $$\mathbf{B}\,(1, -2)^T = (4 - 2,\ 2 - 6)^T = (2, -4)^T = \hlo{2}\,(1, -2)^T\ \checkmark$$

      '
    focus:
    - '1.2'
    - 2
    - 3
    - 0
    say: Phép thử một, theo định nghĩa, B nhân v phải bằng lambda nhân v. B nhân 1, 1 bằng 5, 5, đúng 5 lần. B nhân 1, âm 2 bằng 2, âm 4, đúng 2 lần. Đạt cả hai.
- id: quymo
  kind: example
  title: 'Khi ma trận lớn: tìm vector riêng bằng cách nhân lặp'
  checks:
  - '[list(Matrix([[4, 1], [2, 3]])**k * Matrix([1, 0])) for k in (1, 2, 3, 4)] == [[4, 2], [18, 14], [86, 78], [422, 406]]'
  - '[min(k for k in range(1, 5000) if r**k < 1e-6) for r in (0.4, 0.9, 0.99)] == [16, 132, 1375]'
  - '[k*10**6 for k in (16, 132, 1375)] == [16000000, 132000000, 1375000000] and round(1375*10**6/10**9, 1) == 1.4'
  steps:
  - show: '<p>Ma trận lớn: không giải phương trình định thức nữa, mà <b>nhân lặp</b>. Lấy $B = \begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}$, bắt đầu từ $(1, 0)^T$, nhân với $B$ nhiều lần:</p>

      <table class="t"><tr><th>số lần nhân</th><th>vector</th><th>tỉ số hai thành phần</th></tr>

      <tr><td>1</td><td>(4, 2)</td><td>2</td></tr>

      <tr><td>2</td><td>(18, 14)</td><td>1,29</td></tr>

      <tr><td>3</td><td>(86, 78)</td><td>1,10</td></tr>

      <tr><td>4</td><td>(422, 406)</td><td>1,04</td></tr></table>

      <div class="box key">Hướng dần về $(1, 1)^T$: vector riêng của trị riêng lớn nhất, 5 — khi có trị riêng trội (lớn nhất về giá trị tuyệt đối) và vector xuất phát có thành phần theo hướng đó.</div>

      '
    focus:
    - 1
    - - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
    - 3
    say: 'Với ma trận rất lớn, giải phương trình định thức không còn đi nổi, nên máy dùng cách nhân lặp: chọn một vector bất kỳ rồi nhân với ma trận nhiều lần. Với B, vector 1, 0 thành 4, 2, rồi 18, 14, rồi 86, 78, và 422, 406, tỉ số hai thành phần giảm dần về 1. Vector nghiêng dần về hướng 1, 1, vector riêng của trị riêng lớn nhất là 5, miễn là có một trị riêng trội và vector xuất phát có thành phần theo hướng đó.'
  - clear: true
    show: '<p>Phần lệch còn lại sau $k$ lần nhân cỡ $c \cdot r^k$, với $r$ = trị riêng thứ hai chia trị riêng lớn nhất, $c$ = hằng số tuỳ vector xuất phát (ở đây lấy $c = 1$). Cần $r^k < 10^{-6}$. Ma trận 1 000 hàng, 1 000 cột: mỗi lần nhân tốn $10^6$ phép nhân; máy làm $10^9$ phép nhân mỗi giây (số minh hoạ).</p>

      <table class="t"><tr><th>$r$</th><th>số lần nhân $k$</th><th>phép nhân</th></tr>

      <tr><td>0,4 (như $B$)</td><td>16</td><td>16 triệu</td></tr>

      <tr><td>0,9</td><td>132</td><td>132 triệu</td></tr>

      <tr><td>0,99</td><td>1 375</td><td>1 375 triệu ≈ 1,4 giây</td></tr></table>

      '
    focus:
    - 1
    - 1
    - - '2.2'
      - '2.3'
    - '2.4'
    - '2.4'
    - '2.4'
    say: Phần lệch còn lại cỡ một hằng số nhân r mũ k, ta lấy hằng số bằng 1. Số lần nhân cần tuỳ vào tỉ số giữa trị riêng thứ hai và trị riêng lớn nhất. Tỉ số 0,4 như ở B cần 16 lần nhân, tỉ số 0,9 cần 132 lần. Tỉ số 0,99 cần 1375 lần để phần lệch nhỏ hơn một phần triệu. Mỗi lần với ma trận một nghìn hàng, một nghìn cột tốn một triệu phép nhân, nên tổng gần một tỉ bốn phép. Nếu máy làm một tỉ phép mỗi giây, số minh hoạ, đó là chừng 1 phẩy 4 giây.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - '(lambda l: sp.expand((2-l)*(2-l) - (1-l)*(1-l)) == 3 - 2*l and sp.solve(3 - 2*l, l) == [Rational(3,2)])(sp.Symbol(''l''))'
  - Matrix([[2,1],[1,2]])*Matrix([1,1]) != Rational(3,2)*Matrix([1,1]) and Rational(3,2) not in Matrix([[2,1],[1,2]]).eigenvals()
  - 4*3 == 12 and 12 != 10 and 4 + 3 == 7
  - sorted(Matrix([[4,1],[0,3]]).eigenvals()) == [3, 4] and sorted(Matrix([[4,0],[2,3]]).eigenvals()) == [3, 4]
  - Matrix([[4,1],[2,3]])*Matrix([-1,-1]) == 5*Matrix([-1,-1]) and Matrix([[4,1],[2,3]])*Matrix([-1,2]) == 2*Matrix([-1,2])
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Trả lời “$\mathbf{v} = \mathbf{0}$ là vector riêng” <b class="red">(sai)</b>

      <br><span class="note">$\mathbf{A}\,\mathbf{0} = \lambda\,\mathbf{0}$ đúng với mọi $\lambda$. Định nghĩa đòi $\mathbf{v} \neq \mathbf{0}$; nghiệm $x = y = 0$ luôn có, không phải đáp án.</span></div>

      '
    say: Lỗi thứ nhất, khi giải hệ phương trình, lấy luôn nghiệm x bằng y bằng 0 làm vector riêng. Nghiệm đó luôn có, với mọi lambda, nên không phải đáp án. Định nghĩa bắt buộc v khác vector không.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Với $\mathbf{A} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$, trừ $\lambda$ vào <b>mọi</b> ô: $$\begin{bmatrix} 2 - \lambda & 1 - \lambda \\ 1 - \lambda & 2 - \lambda \end{bmatrix}$$ <b class="red">(sai)</b> → định thức $= 3 - 2\lambda$, ra $\lambda = \dfrac{3}{2}$

      <br><span class="note">Phép thử 1 bắt được: không có $\mathbf{v} \neq \mathbf{0}$ nào thoả $\mathbf{A}\mathbf{v} = \dfrac{3}{2}\,\mathbf{v}$. Nhớ: $\lambda\,\mathbf{I}_2$ chỉ có $\lambda$ trên <b>đường chéo</b>.</span></div>

      '
    say: Lỗi thứ hai, trừ lambda vào cả bốn ô. Với ma trận A, cách đó cho định thức bằng 3 trừ 2 lambda, ra lambda bằng ba phần hai, sai. Lambda I hai chỉ có lambda trên đường chéo, nên chỉ trừ ở hai ô đó.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Đọc trị riêng từ đường chéo: “$\mathbf{B} = \begin{bmatrix} \hl{4} & 1 \\ 2 & \hl{3} \end{bmatrix}$ có trị riêng $4$ và $3$” <b class="red">(sai)</b> — đúng là $5$ và $2$.

      <br><span class="note">Phép thử tích bắt được: $4\cdot 3 = 12 \neq 10 = \det\mathbf{B}$. Chỉ đọc được từ đường chéo khi mọi ô ở <b>một phía</b> của đường chéo (phía trên hoặc phía dưới) đều bằng 0.</span></div>

      '
    say: Lỗi thứ ba, nhìn đường chéo rồi nói ngay B có trị riêng 4 và 3. Đúng ra là 5 và 2. Phép thử tích bắt được, vì 4 nhân 3 bằng 12, khác định thức 10.
- id: quiz
  kind: quiz
  title: 'Đến lượt bạn: C = [[1, 2], [3, 2]]'
  checks:
  - '(lambda l: sp.expand((1-l)*(2-l) - 2*3) == l**2 - 3*l - 4 and sp.expand((l-4)*(l+1)) == l**2 - 3*l - 4)(sp.Symbol(''l''))'
  - sorted(Matrix([[1,2],[3,2]]).eigenvals()) == [-1, 4] and 4 + (-1) == 1 + 2 and 4*(-1) == 1*2 - 2*3
  - Matrix([[1,2],[3,2]]) - 4*sp.eye(2) == Matrix([[-3,2],[3,-2]]) and Matrix([[-3,2],[3,-2]])*Matrix([2,3]) == Matrix([0,0])
  - Matrix([[1,2],[3,2]])*Matrix([2,3]) == Matrix([2+6, 6+6]) and Matrix([8,12]) == 4*Matrix([2,3])
  - Matrix([[1,2],[3,2]]) + sp.eye(2) == Matrix([[2,2],[3,3]]) and Matrix([[1,2],[3,2]])*Matrix([1,-1]) == Matrix([1-2, 3-2]) and Matrix([-1,1]) == -1*Matrix([1,-1])
  steps:
  - show: '<p class="big">$\mathbf{C} = \begin{bmatrix} 1 & 2 \\ 3 & 2 \end{bmatrix}$</p>

      <p>Tìm hai trị riêng, hai vector riêng, rồi chạy cả hai phép thử.</p>

      '
    focus:
    - 1
    - 2
    - 0
    say: Đến lượt bạn, cho ma trận C có hàng trên 1, 2, hàng dưới 3, 2. Hãy tìm hai trị riêng, hai vector riêng, rồi chạy cả hai phép thử. Bạn hãy dừng video, lấy giấy bút ra làm.
    pause: 60
  - show: '<p>① $$(1 - \lambda)(2 - \lambda) - 2\cdot 3 = \lambda^2 - 3\lambda - 4 = (\lambda - 4)(\lambda + 1) = 0 \implies \hlo{\lambda_1 = 4},\ \hlo{\lambda_2 = -1}$$</p>

      <p class="note">Thử: $\ 4 + (-1) = 3 = 1 + 2\ \checkmark, \quad 4\cdot(-1) = -4 = 2 - 6\ \checkmark$</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án như sau, định thức bằng 1 trừ lambda nhân 2 trừ lambda, trừ 6, tức lambda bình phương trừ 3 lambda trừ 4. Hai số có tổng bằng 3, tích bằng âm 4 là 4 và âm 1, nên hai trị riêng là 4 và âm 1. Thử, tổng bằng 3, tích bằng âm 4, đều khớp.
  - show: '<p>② $\hlo{\lambda_1 = 4}$: $\ -3x + 2y = 0$ → $\hlg{\mathbf{v}_1 = (2, 3)^T}$, &nbsp; thử: $\ \mathbf{C}\,(2, 3)^T = (8, 12)^T = 4\,(2, 3)^T\ \checkmark$</p>

      <p>③ $\hlo{\lambda_2 = -1}$: $\ 2x + 2y = 0$ → $\hlg{\mathbf{v}_2 = (1, -1)^T}$, &nbsp; thử: $\ \mathbf{C}\,(1, -1)^T = (-1, 1)^T = -1\cdot(1, -1)^T\ \checkmark$</p>

      '
    focus:
    - 1
    - 2
    - '2.4'
    say: Với lambda bằng 4, phương trình âm 3 x cộng 2 y bằng 0 cho v một bằng 2, 3. Với lambda bằng âm 1, phương trình 2 x cộng 2 y bằng 0 cho v hai bằng 1, âm 1. Trị riêng âm nên C lật ngược mũi tên này.
