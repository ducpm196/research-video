- 'Nói thành lời: A nhân v bằng lambda nhân v; định thức của A trừ lambda I hai bằng 0; lambda một, v một'
- 'Nói bằng hình: vector riêng là hướng mà ma trận chỉ kéo giãn (hoặc lật ngược), không xoay'
- Tự suy ra phương trình định thức của A trừ lambda I hai bằng 0 từ định nghĩa và bài 2 (nghịch đảo, định thức)
