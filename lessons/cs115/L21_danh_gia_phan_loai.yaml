- id: in_ai
  kind: concept
  title: Đánh giá mô hình trong thực tế
  steps:
  - show: '<table class="t"><tr><th>tình huống</th><th>cách làm</th></tr>

      <tr><td>nhiều lớp</td><td>lập ma trận nhầm lẫn $K\times K$, tính độ chuẩn xác, độ phủ cho từng lớp rồi lấy trung bình đều các lớp, hoặc cộng dồn TP, FP, FN của mọi lớp rồi mới tính — hai cách cho số khác nhau khi lớp lệch</td></tr>

      <tr><td>mọi ngưỡng cùng lúc</td><td>sách còn hay nêu <b>đường cong ROC</b>: vẽ độ phủ theo tỉ lệ báo nhầm $\frac{\text{FP}}{\text{FP} + \text{TN}}$ khi dời ngưỡng từ 1 về 0; <b>AUC</b> là diện tích dưới đường cong đó, từ 0 tới 1 — càng gần 1 càng tốt, 0,5 là ngang đoán bừa</td></tr>

      <tr><td><b>Bài 28</b></td><td>cây quyết định — đọc ma trận nhầm lẫn để xem cây hay nhầm lớp nào</td></tr></table>

      '
    forward_ref: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    say: Với nhiều lớp, ta lập ma trận nhầm lẫn K hàng, K cột, rồi tính chỉ số cho từng lớp. Sách còn hay nhắc đường cong vẽ độ phủ theo tỉ lệ báo nhầm khi dời ngưỡng, gom mọi ngưỡng vào một hình, tên viết tắt hiện trên màn hình. Diện tích dưới đường cong đó nằm từ 0 tới 1, càng gần 1 càng tốt, còn 0 phẩy 5 thì chỉ ngang đoán bừa. Ở bài 28, ta dùng ma trận nhầm lẫn để xem cây quyết định hay nhầm lớp nào.
- id: quymo
  kind: example
  title: 'Khi bệnh hiếm dần: tỉ lệ đúng đánh lừa hơn, và cần tập kiểm tra lớn hơn'
  checks:
  - '[round(100*(1 - p), 2) for p in (0.01, 0.001, 0.0001)] == [99.0, 99.9, 99.99]'
  - '[round(math.sqrt(0.9*0.1/k), 4) for k in (10, 100, 1000)] == [0.0949, 0.03, 0.0095] and [k*100 for k in (10, 100, 1000)] == [1000, 10000, 100000]'
  steps:
  - show: '<p>Mô hình lười luôn đoán không bệnh (số minh hoạ):</p>

      <table class="t"><tr><th>tỉ lệ bệnh</th><th>tỉ lệ đúng</th><th>độ phủ</th></tr>

      <tr><td>1%</td><td>99%</td><td>0</td></tr>

      <tr><td>0,1%</td><td>99,9%</td><td>0</td></tr>

      <tr><td>0,01%</td><td>99,99%</td><td>0</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - - '2.3'
      - '2.4'
    say: Mô hình lười luôn đoán không bệnh. Khi bệnh có tỉ lệ 1 phần trăm, nó đúng 99 phần trăm. Khi bệnh hiếm hơn mười lần, nó đúng 99 phẩy 9 phần trăm, hiếm hơn một trăm lần thì đúng 99 phẩy 99 phần trăm, nhưng độ phủ luôn bằng 0.
  - clear: true
    show: '<p>Độ phủ cũng chỉ là ước lượng từ các ca thật dương trong tập kiểm tra. Độ phủ thật khoảng $0{,}9$; bệnh chiếm 1% (số minh hoạ). Sai số chuẩn = độ lệch chuẩn của ước lượng, ở đây $\sqrt{p(1 - p)/k}$ với $p = 0{,}9$:</p>

      <table class="t"><tr><th>số ca thật dương $k$</th><th>sai số chuẩn $\sqrt{0{,}9 \cdot 0{,}1 / k}$</th><th>cỡ tập kiểm tra</th></tr>

      <tr><td>10</td><td>0,095</td><td>1 000 người</td></tr>

      <tr><td>100</td><td>0,030</td><td>10 000 người</td></tr>

      <tr><td>1 000</td><td>0,0095</td><td>100 000 người</td></tr></table>

      '
    focus:
    - 1
    - - '2.2'
      - '2.4'
    - '2.3'
    say: Độ phủ cũng chỉ là ước lượng từ các ca thật dương trong tập kiểm tra. Với độ phủ thật khoảng 0 phẩy 9, sai số chuẩn là 0 phẩy 095 nếu chỉ có 10 ca và 0 phẩy 0095 nếu có một nghìn ca. Khi bệnh chỉ chiếm 1 phần trăm, muốn có 100 ca thật dương phải kiểm tra 10 nghìn người.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Chỉ báo cáo tỉ lệ đúng khi các lớp lệch nhau <b class="red">(sai)</b>

      <br><span class="note">Mô hình lười đúng 99% mà không tìm ra ai. Luôn kèm ma trận nhầm lẫn, độ chuẩn xác, độ phủ.</span></div>

      '
    say: Lỗi thứ nhất, chỉ báo cáo tỉ lệ đúng khi các lớp lệch nhau. Mô hình lười đúng 99 phần trăm mà không tìm ra ai. Hãy luôn kèm ma trận nhầm lẫn, độ chuẩn xác và độ phủ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Nhầm độ chuẩn xác với độ phủ <b class="red">(sai)</b>

      <br><span class="note">Đúng như lỗi đảo chiều điều kiện ở bài 13: $P(\text{bệnh} \mid \text{báo dương}) \neq P(\text{báo dương} \mid \text{bệnh})$.</span></div>

      '
    introduces:
    - neq
    say: Lỗi thứ hai, nhầm lẫn giữa độ chuẩn xác và độ phủ của mô hình. Đó chính là lỗi đảo chiều điều kiện ở bài 13, vì xác suất có bệnh khi báo dương khác xác suất báo dương khi có bệnh.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Đo trên tập huấn luyện, hoặc chọn ngưỡng trên tập kiểm tra <b class="red">(sai)</b>

      <br><span class="note">Như bài 19: chọn ngưỡng trên tập kiểm định — một phần dữ liệu để riêng nữa, chỉ dùng để chọn ngưỡng và chỉnh mô hình; tập kiểm tra chỉ để chấm điểm cuối.</span></div>

      '
    say: Lỗi thứ ba, đo trên tập huấn luyện, hoặc chọn ngưỡng trên tập kiểm tra. Như bài 19, ngưỡng được chọn trên tập kiểm định, tức một phần dữ liệu để riêng nữa, chỉ dùng để chọn ngưỡng và chỉnh mô hình. Còn tập kiểm tra chỉ để chấm điểm cuối.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - Rational(40 + 50, 100) == Rational(9, 10) and Rational(40, 40 + 5) == Rational(8, 9) and Rational(40, 40 + 5) == Rational(8, 9)
  - '(lambda P, R: 2*P*R/(P + R))(Rational(8, 9), Rational(8, 9)) == Rational(8, 9) and round(8/9, 3) == 0.889'
  steps:
  - show: '<p>Kiểm tra 100 mẫu: TP = 40, FP = 5, FN = 5, TN = 50.</p>

      <table class="t"><tr><th>câu</th><th>yêu cầu</th></tr>

      <tr><td>1</td><td>Tính tỉ lệ đúng.</td></tr>

      <tr><td>2</td><td>Tính độ chuẩn xác và độ phủ.</td></tr>

      <tr><td>3</td><td>Tính F1.</td></tr></table>

      '
    focus:
    - 0
    - 1
    - 2
    - 0
    say: Bây giờ đến lượt bạn. Một mô hình được kiểm tra trên 100 mẫu, với bốn ô trên màn hình. Hãy tính tỉ lệ đúng, độ chuẩn xác, độ phủ và điểm F một. Hãy dừng video và làm ra giấy.
    pause: 60
  - clear: true
    show: '<p>① Số ca đúng là TP + TN:</p>

      $$\text{tỉ lệ đúng} = \frac{40 + 50}{100} = \frac{90}{100} = \hlg{0{,}9}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một, số ca đúng là thật dương cộng thật âm, 40 cộng 50 bằng 90. Chia cho 100 mẫu, tỉ lệ đúng bằng 0 phẩy 9.
  - show: '<p>② Mẫu số khác nhau: FP cho độ chuẩn xác, FN cho độ phủ — ở đây cả hai đều bằng 5:</p>

      $$\text{độ chuẩn xác} = \frac{40}{40 + 5} = \frac{8}{9} \approx \hlg{0{,}889} \qquad \text{độ phủ} = \frac{40}{40 + 5} = \frac{8}{9} \approx \hlg{0{,}889}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Câu hai, độ chuẩn xác lấy mẫu số là thật dương cộng dương giả, còn độ phủ lấy thật dương cộng âm giả, và ở đây cả hai cùng bằng 5. Vì thế hai chỉ số đều bằng 40 chia 45, tức tám phần chín. Giá trị là xấp xỉ 0 phẩy 889.
  - show: '<p>③ Thay vào công thức F1:</p>

      $$\text{F1} = \frac{2\cdot\frac{8}{9}\cdot\frac{8}{9}}{\frac{8}{9} + \frac{8}{9}} = \frac{8}{9} \approx \hlg{0{,}889}$$

      '
    focus:
    - 1
    - 2
    say: Câu ba, thay vào công thức, tử số là 2 nhân tám phần chín nhân tám phần chín, mẫu số là hai lần tám phần chín. Rút gọn còn đúng tám phần chín, nên khi hai chỉ số bằng nhau, điểm F một cũng bằng chính số đó.
- id: practice
  kind: practice
  lab: labs/CS115/L21
  title: 'Tự làm: ma trận nhầm lẫn và các chỉ số từ hai danh sách'
  checks:
  - '(lambda t, d: (sum(1 for a, b in zip(t, d) if a == 1 and b == 1), sum(1 for a, b in zip(t, d) if a == 0 and b == 1), sum(1 for a, b in zip(t, d) if a == 1 and b == 0), sum(1 for a, b in zip(t, d) if a == 0 and b == 0)))([1]*5 + [0]*15, [1, 1, 1, 1, 0] + [1, 1, 1] + [0]*12) == (4, 3, 1, 12)'
  - '[Fraction(16, 20), Fraction(4, 7), Fraction(4, 5), 2*Fraction(4, 7)*Fraction(4, 5)/(Fraction(4, 7) + Fraction(4, 5))] == [Fraction(4, 5), Fraction(4, 7), Fraction(4, 5), Fraction(2, 3)]'
  - Fraction(15, 20) == Fraction(3, 4) and (Fraction(4, 7) + Fraction(4, 5))/2 == Fraction(24, 35) and Fraction(24, 35) > Fraction(2, 3)
  steps:
  - show: '<p><b>Đọc trước khi làm.</b> Phần tự làm là một chương trình Python viết trong tệp <code>danhgia.py</code>. Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <i>Open Git Bash here</i>, gõ <code>python danhgia.py</code> rồi Enter: Python chạy từng dòng. Dòng đầu tệp <code>from fractions import Fraction</code> cho dùng phân số chính xác.</p>

      <table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr>

      <tr><td><code>that = [1, 0]</code></td><td>đặt tên <code>that</code> cho một danh sách các số trong ngoặc vuông</td><td><code>that</code> là nhãn thật, 1 = có, 0 = không</td></tr>

      <tr><td><code>[1] * 5</code></td><td>lặp danh sách 5 lần</td><td>ra <code>[1, 1, 1, 1, 1]</code></td></tr>

      <tr><td><code>[1, 0] + [0]</code></td><td>dấu cộng nối hai danh sách thành một</td><td>ra <code>[1, 0, 0]</code></td></tr>

      <tr><td><code>Fraction(4, 5)</code></td><td>phân số $\frac{4}{5}$, tính đúng, không làm tròn</td><td>in ra <code>4/5</code></td></tr></table>

      '
    focus:
    - 1
    - - 1
      - '2.2'
    - - 1
      - '2.3'
    - - 1
      - '2.4'
    - - 1
      - '2.5'
    say: 'Phần tự làm là một chương trình trong một tệp: bạn mở cửa sổ dòng lệnh đi kèm Git và gõ lệnh chạy kèm tên tệp. Dòng này đặt tên cho một danh sách các số trong ngoặc vuông, ở đề đó là nhãn thật, một là có, không là không. Một trong ngoặc vuông nhân 5 là lặp danh sách 5 lần, ra năm số 1. Dấu cộng giữa hai danh sách nối chúng thành một danh sách dài hơn, ví dụ 1, 0 nối 0 ra 1, 0, 0. Đây là phân số bốn phần năm, máy tính đúng, không làm tròn, và in ra là 4 gạch chéo 5.'
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>danhgia.py</code> với hai danh sách (1 = có, 0 = không):</p>

      <div class="code"><div>that = [1] * 5 + [0] * 15</div><div>doan = [1, 1, 1, 1, 0] + [1, 1, 1] + [0] * 12</div></div>

      <p>Đếm TP, FP, FN, TN; tính tỉ lệ đúng, độ chuẩn xác, độ phủ, F1 bằng <code>Fraction</code>; thử mô hình lười luôn đoán 0; so F1 với trung bình cộng.</p>

      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L21/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Bây giờ tới phần bạn tự làm, với hai danh sách mới trên màn hình. Đếm bốn ô của ma trận nhầm lẫn. Tính tỉ lệ đúng, độ chuẩn xác, độ phủ và F1 bằng phân số, rồi thử mô hình lười và so F1 với trung bình cộng. Dừng video và tự làm.
    pause: 300
  - clear: true
    show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>TP=4 FP=3 FN=1 TN=12</div><div>ti le dung: 4/5</div><div>do chuan xac: 4/7</div><div>do phu: 4/5</div><div>F1: 2/3</div><div>mo hinh luoi (luon bao 0): ti le dung 3/4, do phu 0</div><div>trung binh cong cua hai chi so: 24/35</div></div><p class="note" style="color:#374151;font-size:0.8em">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L21 danhgia.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>CS115 L21 danhgia.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi. <b>Kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python tệp.py</code> và so với kết quả mong đợi.</p>

      '
    focus:
    - 0
    - 0
    - 3
    - 3
    say: 'Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
  - clear: true
    show: '<div class="box key"><b>Nếu kẹt:</b> TP: thật 1 và đoán 1; FP: thật 0 nhưng đoán 1; FN: thật 1 nhưng đoán 0; TN: thật 0 và đoán&nbsp;0. Độ chuẩn xác $= TP / (TP + FP)$, độ phủ $= TP / (TP + FN)$, F1 $= 2PR / (P + R)$.</div>

      '
    say: Nếu kẹt, mỗi ô đếm theo cặp thật và đoán. Độ chuẩn xác chia cho tổng cột đoán dương, còn độ phủ chia cho tổng hàng thật dương. F1 là trung bình điều hoà của hai chỉ số đó.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">ma trận nhầm lẫn: TP, FP, FN, TN</span><span class="a">→</span>

      <span class="n">độ chuẩn xác $= P(\text{bệnh} \mid \text{báo dương})$</span><span class="a">→</span>

      <span class="n">độ phủ $= P(\text{báo dương} \mid \text{bệnh})$</span><span class="a">→</span>

      <span class="n">dời ngưỡng: đổi chiều nhau</span><span class="a">→</span>

      <span class="n">F1: điều hoà</span></div>

      '
    say: Tổng kết chuỗi logic. Ma trận nhầm lẫn có bốn ô. Độ chuẩn xác và độ phủ là hai xác suất có điều kiện theo hai chiều ngược nhau. Dời ngưỡng làm chúng đổi chiều nhau, và điểm F một gộp chúng bằng trung bình điều hoà.
  - show: '<div class="box key"><b>Tư duy:</b> trước khi tin một con số “đúng 99%”, hãy hỏi: các lớp có lệch không, và cái giá của báo nhầm, bỏ sót là gì?</div>

      '
    say: Điều cần mang theo, trước khi tin một con số đúng 99 phần trăm, hãy hỏi các lớp có lệch không, và cái giá của báo nhầm và bỏ sót là gì.
  - clear: true
    show: '<p class="note">Bài sau (bài 44): <b>thống kê suy luận, khoảng tin cậy và so sánh hai mô hình</b> (bài 22 mở đầu phần học sâu ở Chặng 9).</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 44, ta học thống kê suy luận, khoảng tin cậy và so sánh hai mô hình. Còn bài 22 về đồ thị tính toán sẽ mở đầu phần học sâu ở chặng chín. Hẹn gặp bạn ở bài tiếp theo.
