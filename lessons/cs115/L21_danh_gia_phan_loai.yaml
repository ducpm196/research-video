objectives:
- Lập ma trận nhầm lẫn từ dự đoán và nhãn thật
- Tính tỉ lệ đúng, độ chuẩn xác, độ phủ, F1 và đọc độ chuẩn xác, độ phủ như hai xác suất có điều kiện ngược chiều
- Biết vì sao tỉ lệ đúng đánh lừa khi các lớp lệch nhau
- Thấy độ chuẩn xác và độ phủ đổi chiều nhau khi dời ngưỡng
- Hiểu vì sao F1 dùng trung bình điều hoà
- Đo được tỉ lệ đúng của mô hình lười khi bệnh hiếm dần, và tính cỡ tập kiểm tra cần để đo độ phủ đủ chắc
