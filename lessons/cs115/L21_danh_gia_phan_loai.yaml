id: L21
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 21 — Đánh giá mô hình phân loại: ma trận nhầm lẫn, accuracy, precision, recall, F1"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "ML24#Evaluation (văn bản trích dòng 34: Confusion matrix, Accuracy, Precision, Recall, F-score; dòng 36: ROC, AUC — chỉ nêu tên)"
assumes: [cdot, prob, given, approx, geq]
# Quy ước: TP, FP, FN, TN viết chữ in hoa (thật dương, dương giả, âm giả, thật âm); tên Việt đọc trong lời: tỉ lệ đúng (accuracy),
#   độ chuẩn xác (precision), độ phủ (recall), điểm F một (F1). Tên tiếng Anh chỉ hiện trên màn hình.
# Ví dụ chính: dùng lại bài xét nghiệm của bài 13 trên 1000 người (9 thật dương, 1 âm giả, 99 dương giả, 891 thật âm).
# Nối bài trước (nói lại khi dùng, luật 17): bài 13 (xác suất có điều kiện, bài xét nghiệm, đảo chiều điều kiện), bài 19 (đo trên dữ liệu
#   chưa thấy — tập kiểm tra), bài 20 (logistic cho xác suất ŷ; đoán dương khi ŷ ≥ ngưỡng 0,5).
objectives:
  - "Lập ma trận nhầm lẫn từ dự đoán và nhãn thật"
  - "Tính tỉ lệ đúng, độ chuẩn xác, độ phủ, F1 và đọc chúng như xác suất có điều kiện"
  - "Biết vì sao tỉ lệ đúng đánh lừa khi các lớp lệch nhau"
  - "Thấy độ chuẩn xác và độ phủ đổi chiều nhau khi dời ngưỡng"
  - "Hiểu vì sao F1 dùng trung bình điều hoà"
asr_reviewed:
  - sentence: "Các chỉ số khớp với bài 13, nghĩa là độ chuẩn xác chính là xác suất hậu nghiệm ta đã tính bằng định lý Bayes."
    reason: "Bayes đọc “Bay-ét” theo lexicon, ASR chép “Bayet” (đúng âm); chỉ→trị, độ→đồ lẫn phụ âm đầu/thanh — câu dài, ngữ cảnh rõ"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mô hình “lười” đúng 99% — nhưng vô dụng"
    checks:
      - "Rational(990, 1000) == Rational(99, 100) and Rational(9 + 891, 1000) == Rational(9, 10)"
    steps:
      - show: |
          <p class="big">Bệnh hiếm ở bài 13: 10 người bệnh trong 1000 người.</p>
          <p>Mô hình “lười”: <b>luôn</b> nói “không bệnh” &nbsp; → &nbsp; đúng $\frac{990}{1000} = \hlo{99\%}$</p>
          <p>Máy xét nghiệm của bài 13 &nbsp; → &nbsp; đúng $\frac{9 + 891}{1000} = 90\%$</p>
        focus: [1, 2, 3, 0]
        say: "Chào bạn, quay lại bệnh hiếm ở bài 13, có 10 người bệnh trong 1000 người. Một mô hình lười luôn nói không bệnh, và đúng 99 phần trăm. Máy xét nghiệm của bài 13 chỉ đúng 90 phần trăm. Vậy mô hình lười tốt hơn?"
      - show: |
          <div class="box key">Mô hình lười không bao giờ tìm ra người bệnh nào! Một con số “tỉ lệ đúng” là không đủ. Hôm nay: <b>ma trận nhầm lẫn</b> và các chỉ số đo đúng điều ta cần.</div>
        say: "Không, vì mô hình lười không bao giờ tìm ra người bệnh nào. Một con số tỉ lệ đúng là không đủ. Hôm nay ta học ma trận nhầm lẫn, và các chỉ số đo đúng điều ta cần."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: xác suất có điều kiện và ngưỡng của logistic"
    steps:
      - show: |
          <p>Bài 13: $P(A \mid B)$ = xác suất của A khi biết B — chỉ đếm trong phần B. Đảo chiều thì khác hẳn: $P(\text{dương} \mid \text{bệnh}) = 0{,}9$ nhưng $P(\text{bệnh} \mid \text{dương}) \approx 0{,}083$.</p>
          <p>Bài 20: logistic cho xác suất $\hat{y}$; đoán “dương” khi $\hat{y} \ge$ ngưỡng (thường 0,5). Bài 19: luôn đo trên tập <b>kiểm tra</b>.</p>
        introduces: [hat]
        focus: [1, 2, 2]
        say: "Nhắc lại bài 13, xác suất của A khi biết B chỉ đếm trong phần B, và đảo chiều điều kiện cho kết quả khác hẳn. Nhắc lại bài 20, mô hình logistic đoán dương khi xác suất vượt một ngưỡng, thường là 0 phẩy 5. Và theo bài 19, ta luôn đo trên tập kiểm tra."

  # ───────────────────────── 3. MA TRẬN NHẦM LẪN ─────────────────────────
  - id: sym_cm
    kind: symbol
    title: "Giải mã: ma trận nhầm lẫn TP, FP, FN, TN"
    checks:
      - "9 + 1 == 10 and 99 + 891 == 990 and 9 + 99 + 1 + 891 == 1000"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>máy báo <b>dương</b></th><th>máy báo <b>âm</b></th></tr>
          <tr><td>thật sự <b>bệnh</b></td><td>TP = $\hlg{9}$ (thật dương)</td><td>FN = 1 (âm giả — bỏ sót)</td></tr>
          <tr><td>thật sự <b>khoẻ</b></td><td>FP = $\hlo{99}$ (dương giả — báo nhầm)</td><td>TN = 891 (thật âm)</td></tr></table>
          <p class="note">Chữ thứ hai (P/N) là điều máy <b>báo</b>; chữ đầu (T/F) cho biết máy báo <b>đúng</b> hay <b>sai</b>.</p>
        focus: [1, 1, "1.2", "1.2", "1.3", "1.3"]
        say: "Ma trận nhầm lẫn chia 1000 người thành bốn ô. Hàng là sự thật, cột là điều máy báo. Có 9 người bệnh được báo dương, gọi là thật dương. 1 người bệnh bị bỏ sót, gọi là âm giả. 99 người khoẻ bị báo nhầm, gọi là dương giả. 891 người còn lại là thật âm."

  - id: cm_pic
    kind: intuition
    title: "Nhìn thấy hai chỉ số: cùng tử số, khác mẫu số"
    checks:
      - "9 + 99 == 108 and 9 + 1 == 10 and 1000 - 108 - 1 == 891 and Rational(9, 108) == Rational(1, 12) and round(9/108, 3) == 0.083 and Rational(9, 9 + 1) == Rational(9, 10)"
      - "Rational(0, 10) == 0 and Rational(990, 1000) == Rational(99, 100)"
    steps:
      - show: |
          <svg width="1000" height="330" viewBox="0 0 1000 330"><g font-size="22" fill="#1f2937"><text x="60" y="45">máy báo dương: 108 người</text><rect x="60" y="58" width="63" height="50" fill="#86efac" stroke="#1f2937" stroke-width="2"/><rect x="123" y="58" width="693" height="50" fill="#fdba74" stroke="#1f2937" stroke-width="2"/><text x="92" y="91" text-anchor="middle" font-weight="bold">9</text><text x="470" y="91" text-anchor="middle">FP = 99 người khoẻ bị báo nhầm</text><text x="143" y="145" fill="#b45309">độ chuẩn xác = 9 / 108 ≈ 0,083</text><text x="143" y="195">thật sự bệnh: 10 người</text><rect x="60" y="208" width="63" height="50" fill="#86efac" stroke="#1f2937" stroke-width="2"/><rect x="123" y="208" width="7" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="92" y="241" text-anchor="middle" font-weight="bold">9</text><text x="150" y="241">FN = 1 bỏ sót</text><text x="350" y="241" fill="#047857">độ phủ = 9 / 10 = 0,9</text><rect x="54" y="52" width="69" height="212" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="60" y="300" fill="#059669">khung đứt: TP = 9 nằm trong cả hai thanh</text><text x="60" y="325" fill="#6b7280">891 người thật âm (TN) không nằm trong thanh nào</text></g></svg>
        say: "Hình này vẽ lại ma trận nhầm lẫn thành hai thanh, mỗi người chiếm một đoạn dài bằng nhau. Thanh trên là 108 người máy báo dương, gồm 9 người bệnh thật và 99 người khoẻ bị báo nhầm. Thanh dưới là 10 người bệnh thật, gồm cùng 9 người đó và 1 người bị bỏ sót. Phần chung trong khung đứt là thật dương, nó là tử số của cả hai chỉ số. Độ chuẩn xác chia 9 cho thanh trên dài 108, còn độ phủ chia 9 cho thanh dưới dài 10, nên hai con số khác nhau xa đến vậy."
      - show: |
          <p>Làm thử với mô hình “lười” (luôn báo âm): thanh trên <b>trống</b>.</p>
          <table class="t"><tr><th>mô hình</th><th>báo dương</th><th>TP</th><th>độ chuẩn xác</th><th>độ phủ</th></tr>
          <tr><td>máy xét nghiệm</td><td>108</td><td>9</td><td>$\frac{9}{108} \approx 0{,}083$</td><td>$\frac{9}{10} = 0{,}9$</td></tr>
          <tr><td>mô hình lười</td><td>0</td><td>0</td><td>không tính được ($\frac{0}{0}$)</td><td>$\frac{0}{10} = \hlo{0}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Làm thử với mô hình lười luôn báo âm, thanh trên của nó trống trơn. Máy xét nghiệm có độ chuẩn xác 0 phẩy 083 và độ phủ 0 phẩy 9. Mô hình lười không báo dương ai, nên độ chuẩn xác là 0 chia 0, không tính được, còn độ phủ bằng 0 chia 10, tức bằng 0. Thanh dưới vẫn dài 10 người, nhưng không người nào trong đó được tìm ra."

  # ───────────────────────── 4. CÁC CHỈ SỐ ─────────────────────────
  - id: metrics
    kind: formula
    title: "Bốn chỉ số: mỗi cái là một xác suất có điều kiện"
    checks:
      - "Rational(9 + 891, 1000) == Rational(9, 10) and Rational(9, 9 + 99) == Rational(1, 12) and Rational(9, 9 + 1) == Rational(9, 10)"
      - "(lambda P, R: 2*P*R/(P + R))(Rational(1, 12), Rational(9, 10)) == Rational(9, 59) and round(9/59, 3) == 0.153"
    steps:
      - show: |
          <table class="t"><tr><th>chỉ số</th><th>công thức</th><th>nghĩa (bài 13)</th><th>xét nghiệm</th></tr>
          <tr><td>tỉ lệ đúng (accuracy)</td><td>$\frac{\text{TP} + \text{TN}}{\text{tất cả}}$</td><td>đúng bao nhiêu phần</td><td>0,9</td></tr>
          <tr><td>độ chuẩn xác (precision)</td><td>$\frac{\text{TP}}{\text{TP} + \text{FP}}$</td><td>$P(\text{bệnh} \mid \text{báo dương})$</td><td>$\hlo{\frac{9}{108} \approx 0{,}083}$</td></tr>
          <tr><td>độ phủ (recall)</td><td>$\frac{\text{TP}}{\text{TP} + \text{FN}}$</td><td>$P(\text{báo dương} \mid \text{bệnh})$</td><td>$\hlg{\frac{9}{10} = 0{,}9}$</td></tr></table>
        say: "Tỉ lệ đúng là số ca đúng chia tổng số. Độ chuẩn xác chỉ đếm trong những ca máy báo dương, nên chính là xác suất có bệnh khi báo dương của bài 13, bằng 0 phẩy 083. Độ phủ đảo chiều, đếm trong những người bệnh thật, bằng 0 phẩy 9."
      - show: |
          <div class="box key">$\text{F1} = \dfrac{2\cdot\text{P}\cdot\text{R}}{\text{P} + \text{R}}$ &nbsp; (P = độ chuẩn xác, R = độ phủ) &nbsp; — xét nghiệm: $\ \dfrac{2\cdot\frac{1}{12}\cdot 0{,}9}{\frac{1}{12} + 0{,}9} = \dfrac{9}{59} \approx \hlg{0{,}153}$</div>
          <p class="note">Mô hình lười: TP = 0, nên độ phủ = 0 và F1 = 0 — lộ ngay là vô dụng, dù tỉ lệ đúng 99%.</p>
        focus: ["1.1", "1.2", 2]
        say: "Điểm F một gộp hai chỉ số bằng công thức trên màn hình. Thay số, máy xét nghiệm có điểm F một khoảng 0 phẩy 153, khá thấp vì độ chuẩn xác thấp. Còn mô hình lười không có thật dương nào, nên độ phủ và điểm F một đều bằng 0, lộ ngay là vô dụng."

  # ───────────────────────── 5. DỜI NGƯỠNG ─────────────────────────
  - id: threshold
    kind: example
    title: "Ví dụ: dời ngưỡng, độ chuẩn xác và độ phủ đổi chiều nhau"
    checks:
      - "(lambda sc: [(Rational(sum(1 for s, y in sc if s >= t and y == 1), sum(1 for s, y in sc if s >= t)), Rational(sum(1 for s, y in sc if s >= t and y == 1), 5)) for t in (0.7, 0.5, 0.3)] == [(Rational(2, 3), Rational(2, 5)), (Rational(3, 5), Rational(3, 5)), (Rational(4, 7), Rational(4, 5))])([(0.95, 1), (0.85, 1), (0.75, 0), (0.65, 1), (0.55, 0), (0.45, 1), (0.35, 0), (0.25, 0), (0.15, 1), (0.05, 0)])"
      - "(lambda sc: (sum(1 for s, y in sc if s >= 0.5), sum(1 for s, y in sc if s >= 0.5 and y == 1), sum(1 for s, y in sc if s >= 0.5 and y == 0), sum(1 for s, y in sc if s < 0.5 and y == 1)) == (5, 3, 2, 2))([(0.95, 1), (0.85, 1), (0.75, 0), (0.65, 1), (0.55, 0), (0.45, 1), (0.35, 0), (0.25, 0), (0.15, 1), (0.05, 0)])"
      - "Rational(3, 3 + 2) == Rational(3, 5) and (lambda P, R: 2*P*R/(P + R))(Rational(3, 5), Rational(3, 5)) == Rational(3, 5) and 2*Rational(3, 5)*Rational(3, 5) == Rational(72, 100) and Rational(72, 100) / Rational(12, 10) == Rational(3, 5)"
    steps:
      - show: |
          <p>10 thư, logistic cho xác suất là thư rác (5 thư rác thật, đánh dấu ✔):</p>
          <p>0,95 ✔ &nbsp; 0,85 ✔ &nbsp; 0,75 &nbsp; 0,65 ✔ &nbsp; 0,55 &nbsp; 0,45 ✔ &nbsp; 0,35 &nbsp; 0,25 &nbsp; 0,15 ✔ &nbsp; 0,05</p>
          <table class="t"><tr><th>ngưỡng</th><th>báo rác</th><th>độ chuẩn xác</th><th>độ phủ</th></tr>
          <tr><td>0,7</td><td>3 thư</td><td>$\frac{2}{3} \approx 0{,}67$</td><td>$\frac{2}{5} = 0{,}4$</td></tr>
          <tr><td>0,5</td><td>5 thư</td><td>$\frac{3}{5} = 0{,}6$</td><td>$\frac{3}{5} = 0{,}6$</td></tr>
          <tr><td>0,3</td><td>7 thư</td><td>$\frac{4}{7} \approx 0{,}57$</td><td>$\frac{4}{5} = 0{,}8$</td></tr></table>
        focus: [[1, 2], "3.2", "3.4"]
        say: "Mười thư, mô hình logistic cho xác suất là thư rác, trong đó có 5 thư rác thật. Nâng ngưỡng lên 0 phẩy 7, máy chỉ báo những thư rất chắc, nên độ chuẩn xác tăng lên 0 phẩy 67, nhưng độ phủ giảm còn 0 phẩy 4. Hạ ngưỡng xuống 0 phẩy 3 thì ngược lại."
      - clear: true
        show: |
          <p><b>Bước 1.</b> Tính tay ở ngưỡng 0,5 — báo “rác” khi xác suất $\ge 0{,}5$:</p>
          <table class="t"><tr><th>xác suất</th><td>0,95</td><td>0,85</td><td>0,75</td><td>0,65</td><td>0,55</td><td>0,45</td><td>0,35</td><td>0,25</td><td>0,15</td><td>0,05</td></tr>
          <tr><th>rác thật</th><td>✔</td><td>✔</td><td></td><td>✔</td><td></td><td>✔</td><td></td><td></td><td>✔</td><td></td></tr>
          <tr><th>báo rác</th><td>có</td><td>có</td><td>có</td><td>có</td><td>có</td><td></td><td></td><td></td><td></td><td></td></tr></table>
        focus: [1, "2.3", "2.2"]
        say: "Bây giờ làm tay từng bước ở ngưỡng 0 phẩy 5, máy báo thư rác khi xác suất từ 0 phẩy 5 trở lên. Đọc hàng cuối, có đúng 5 thư được báo rác, từ 0 phẩy 95 đến 0 phẩy 55. Hàng giữa đánh dấu 5 thư rác thật."
      - show: |
          <p><b>Bước 2.</b> Trong 5 thư báo rác, 3 thư có dấu ✔: TP = 3, FP = 2.</p>
          $$\text{độ chuẩn xác} = \frac{\text{TP}}{\text{TP} + \text{FP}} = \frac{3}{3 + 2} = \hlg{0{,}6}$$
        focus: [1, 2]
        say: "Bước hai, trong 5 thư báo rác, có 3 thư mang dấu rác thật là 0 phẩy 95, 0 phẩy 85 và 0 phẩy 65, nên thật dương bằng 3, dương giả bằng 2. Độ chuẩn xác bằng 3 chia 3 cộng 2, tức 0 phẩy 6."
      - clear: true
        show: |
          <p><b>Bước 3.</b> 5 thư rác thật, máy bắt được 3, bỏ sót 0,45 và 0,15: FN = 2.</p>
          $$\text{độ phủ} = \frac{\text{TP}}{\text{TP} + \text{FN}} = \frac{3}{3 + 2} = \hlg{0{,}6}$$
        focus: [1, 2]
        say: "Bước ba, đếm theo chiều kia, có 5 thư rác thật, máy bắt được 3 và bỏ sót hai thư 0 phẩy 45 và 0 phẩy 15, nên âm giả bằng 2. Độ phủ bằng 3 chia 3 cộng 2, cũng bằng 0 phẩy 6."
      - show: |
          <p><b>Bước 4.</b> Gộp hai chỉ số bằng F1:</p>
          $$\text{F1} = \frac{2\cdot 0{,}6\cdot 0{,}6}{0{,}6 + 0{,}6} = \frac{0{,}72}{1{,}2} = \hlg{0{,}6}$$
        focus: [1, 2]
        say: "Bước bốn, gộp hai chỉ số bằng điểm F một, 2 nhân 0 phẩy 6 nhân 0 phẩy 6 được 0 phẩy 72, chia cho 1 phẩy 2, bằng 0 phẩy 6. Khi hai chỉ số bằng nhau, điểm F một bằng đúng con số đó."
      - show: |
          <div class="box key">Nâng ngưỡng: ít báo nhầm hơn (độ chuẩn xác thường ↑, nhưng không bắt buộc) nhưng bỏ sót nhiều hơn (độ phủ ↓). Không có ngưỡng nào tốt cho mọi bài toán.</div>
          <p class="note">Lọc thư rác: báo nhầm thư quan trọng rất tệ → ưu tiên độ chuẩn xác. Sàng lọc bệnh: bỏ sót người bệnh rất tệ → ưu tiên độ phủ.</p>
        focus: [1, 1, 2, 2]
        say: "Vậy nâng ngưỡng thì ít báo nhầm hơn nhưng bỏ sót nhiều hơn. Chọn ngưỡng tuỳ bài toán. Lọc thư rác thì sợ báo nhầm thư quan trọng, nên ưu tiên độ chuẩn xác. Sàng lọc bệnh thì sợ bỏ sót người bệnh, nên ưu tiên độ phủ."

  # ───────────────────────── 6. VÌ SAO TRUNG BÌNH ĐIỀU HOÀ ─────────────────────────
  - id: harmonic
    kind: concept
    title: "Vì sao F1 dùng trung bình điều hoà"
    checks:
      - "round((1 + 0.02)/2, 2) == 0.51 and round(2*1*0.02/(1 + 0.02), 3) == 0.039"
    steps:
      - show: |
          <p>Mô hình chỉ báo đúng 1 thư rác chắc chắn nhất trong 50 thư rác: độ chuẩn xác = 1, độ phủ = 0,02.</p>
          <table class="t"><tr><th>cách gộp</th><th>kết quả</th></tr>
          <tr><td>trung bình cộng $\frac{\text{P} + \text{R}}{2}$</td><td>0,51 — trông “tạm được”</td></tr>
          <tr><td>F1 (trung bình điều hoà)</td><td>$\frac{2\cdot 1\cdot 0{,}02}{1{,}02} \approx \hlo{0{,}039}$ — đúng là tệ</td></tr></table>
          <p class="note">Trung bình điều hoà bị kéo về phía số <b>nhỏ hơn</b>: muốn F1 cao, cả hai chỉ số đều phải cao.</p>
        focus: [0, 1, "2.2", "2.3"]
        say: "Vì sao không lấy trung bình cộng? Một mô hình chỉ báo đúng 1 thư rác chắc chắn nhất trong 50 thư rác có độ chuẩn xác bằng 1, độ phủ 0 phẩy 02. Trung bình cộng là 0 phẩy 51, nhìn qua thì có vẻ tạm ổn. Điểm F một chỉ 0 phẩy 039, vì nó bị kéo về phía số nhỏ hơn."

  # ───────────────────────── 7. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: đếm lại từ danh sách 1000 người"
    checks:
      - "(lambda y, p: (sum(a and b for a, b in zip(y, p)), sum((not a) and b for a, b in zip(y, p)), sum(a and not b for a, b in zip(y, p)), sum((not a) and (not b) for a, b in zip(y, p))) == (9, 99, 1, 891))([1]*10 + [0]*990, [1]*9 + [0] + [1]*99 + [0]*891)"
    steps:
      - show: |
          <table class="t"><tr><th>máy đếm lại danh sách 1000 người</th><th>kết quả</th></tr>
          <tr><td>TP, FP, FN, TN</td><td>9, 99, 1, 891 $\checkmark$</td></tr>
          <tr><td>tỉ lệ đúng; độ chuẩn xác; độ phủ; F1</td><td>0,9; $\frac{1}{12}$; 0,9; $\frac{9}{59}$ — khớp với bài 13 $\checkmark$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Phép thử, vì đếm tay dễ nhầm ô, ta cho máy lập danh sách 1000 người rồi đếm lại từng ô, được đúng 9, 99, 1 và 891. Các chỉ số khớp với bài 13, nghĩa là độ chuẩn xác chính là xác suất hậu nghiệm ta đã tính bằng định lý Bayes."

  # ───────────────────────── 8. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Đánh giá mô hình trong thực tế"
    steps:
      - show: |
          <table class="t"><tr><th>tình huống</th><th>cách làm</th></tr>
          <tr><td>nhiều lớp</td><td>lập ma trận nhầm lẫn $K\times K$, tính độ chuẩn xác, độ phủ cho từng lớp rồi lấy trung bình đều các lớp, hoặc cộng dồn TP, FP, FN của mọi lớp rồi mới tính — hai cách cho số khác nhau khi lớp lệch</td></tr>
          <tr><td>mọi ngưỡng cùng lúc</td><td>sách còn hay nêu đường cong ROC và diện tích AUC: vẽ độ phủ theo tỉ lệ báo nhầm $\frac{\text{FP}}{\text{FP} + \text{TN}}$ khi dời ngưỡng từ 1 về 0</td></tr>
          <tr><td><b>Bài 28</b></td><td>cây quyết định — đọc ma trận nhầm lẫn để xem cây hay nhầm lớp nào</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3", "1.4"]
        say: "Với nhiều lớp, ta lập ma trận nhầm lẫn K hàng, K cột, rồi tính chỉ số cho từng lớp. Sách còn hay nhắc đường cong vẽ độ phủ theo tỉ lệ báo nhầm khi dời ngưỡng, gom mọi ngưỡng vào một hình. Ở bài 28, ta dùng ma trận nhầm lẫn để xem cây quyết định hay nhầm lớp nào."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ báo cáo tỉ lệ đúng khi các lớp lệch nhau <b class="red">(sai)</b>
          <br><span class="note">Mô hình lười đúng 99% mà không tìm ra ai. Luôn kèm ma trận nhầm lẫn, độ chuẩn xác, độ phủ.</span></div>
        say: "Lỗi thứ nhất, chỉ báo cáo tỉ lệ đúng khi các lớp lệch nhau. Mô hình lười đúng 99 phần trăm mà không tìm ra ai. Hãy luôn kèm ma trận nhầm lẫn, độ chuẩn xác và độ phủ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhầm độ chuẩn xác với độ phủ <b class="red">(sai)</b>
          <br><span class="note">Đúng như lỗi đảo chiều điều kiện ở bài 13: $P(\text{bệnh} \mid \text{báo dương}) \neq P(\text{báo dương} \mid \text{bệnh})$.</span></div>
        introduces: [neq]
        say: "Lỗi thứ hai, nhầm lẫn giữa độ chuẩn xác và độ phủ của mô hình. Đó chính là lỗi đảo chiều điều kiện ở bài 13, vì xác suất có bệnh khi báo dương khác xác suất báo dương khi có bệnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đo trên tập huấn luyện, hoặc chọn ngưỡng trên tập kiểm tra <b class="red">(sai)</b>
          <br><span class="note">Như bài 19: chọn ngưỡng trên tập kiểm định; tập kiểm tra chỉ để chấm điểm cuối.</span></div>
        say: "Lỗi thứ ba, đo trên tập huấn luyện, hoặc chọn ngưỡng trên tập kiểm tra. Như bài 19, ngưỡng được chọn trên tập kiểm định, còn tập kiểm tra chỉ để chấm điểm cuối."

  # ───────────────────────── 10. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "Rational(40 + 50, 100) == Rational(9, 10) and Rational(40, 40 + 5) == Rational(8, 9) and Rational(40, 40 + 5) == Rational(8, 9)"
      - "(lambda P, R: 2*P*R/(P + R))(Rational(8, 9), Rational(8, 9)) == Rational(8, 9) and round(8/9, 3) == 0.889"
    steps:
      - show: |
          <p>Kiểm tra 100 mẫu: TP = 40, FP = 5, FN = 5, TN = 50.</p>
          <table class="t"><tr><th>câu</th><th>yêu cầu</th></tr>
          <tr><td>1</td><td>Tính tỉ lệ đúng.</td></tr>
          <tr><td>2</td><td>Tính độ chuẩn xác và độ phủ.</td></tr>
          <tr><td>3</td><td>Tính F1.</td></tr></table>
        focus: [0, 1, 2, 0]
        say: "Bây giờ đến lượt bạn. Một mô hình được kiểm tra trên 100 mẫu, với bốn ô trên màn hình. Hãy tính tỉ lệ đúng, độ chuẩn xác, độ phủ và điểm F một. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Số ca đúng là TP + TN:</p>
          $$\text{tỉ lệ đúng} = \frac{40 + 50}{100} = \frac{90}{100} = \hlg{0{,}9}$$
        focus: [1, 2]
        say: "Đáp án câu một, số ca đúng là thật dương cộng thật âm, 40 cộng 50 bằng 90. Chia cho 100 mẫu, tỉ lệ đúng bằng 0 phẩy 9."
      - show: |
          <p>② Mẫu số khác nhau: FP cho độ chuẩn xác, FN cho độ phủ — ở đây cả hai đều bằng 5:</p>
          $$\text{độ chuẩn xác} = \frac{40}{40 + 5} = \frac{8}{9} \approx \hlg{0{,}889} \qquad \text{độ phủ} = \frac{40}{40 + 5} = \frac{8}{9} \approx \hlg{0{,}889}$$
        focus: [1, 2, 2]
        say: "Câu hai, độ chuẩn xác lấy mẫu số là thật dương cộng dương giả, còn độ phủ lấy thật dương cộng âm giả, và ở đây cả hai cùng bằng 5. Vì thế hai chỉ số đều bằng 40 chia 45, tức tám phần chín. Giá trị là xấp xỉ 0 phẩy 889."
      - show: |
          <p>③ Thay vào công thức F1:</p>
          $$\text{F1} = \frac{2\cdot\frac{8}{9}\cdot\frac{8}{9}}{\frac{8}{9} + \frac{8}{9}} = \frac{8}{9} \approx \hlg{0{,}889}$$
        focus: [1, 2]
        say: "Câu ba, thay vào công thức, tử số là 2 nhân tám phần chín nhân tám phần chín, mẫu số là hai lần tám phần chín. Rút gọn còn đúng tám phần chín, nên khi hai chỉ số bằng nhau, điểm F một cũng bằng chính số đó."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ma trận nhầm lẫn: TP, FP, FN, TN</span><span class="a">→</span>
          <span class="n">độ chuẩn xác $= P(\text{bệnh} \mid \text{báo dương})$</span><span class="a">→</span>
          <span class="n">độ phủ $= P(\text{báo dương} \mid \text{bệnh})$</span><span class="a">→</span>
          <span class="n">dời ngưỡng: đổi chiều nhau</span><span class="a">→</span>
          <span class="n">F1: điều hoà</span></div>
        say: "Tổng kết chuỗi logic. Ma trận nhầm lẫn có bốn ô. Độ chuẩn xác và độ phủ là hai xác suất có điều kiện theo hai chiều ngược nhau. Dời ngưỡng làm chúng đổi chiều nhau, và điểm F một gộp chúng bằng trung bình điều hoà."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi tin một con số “đúng 99%”, hãy hỏi: các lớp có lệch không, và cái giá của báo nhầm, bỏ sót là gì?</div>
        say: "Điều cần mang theo, trước khi tin một con số đúng 99 phần trăm, hãy hỏi các lớp có lệch không, và cái giá của báo nhầm và bỏ sót là gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 22): <b>đồ thị tính toán và lan truyền ngược</b> — cách máy tính gradient cho mô hình có hàng triệu tham số.</p>
        forward_ref: true
        say: "Ở bài sau, bài 22, ta học đồ thị tính toán và lan truyền ngược, cách máy tính gradient cho mô hình có hàng triệu tham số. Hẹn gặp bạn ở bài tiếp theo."
