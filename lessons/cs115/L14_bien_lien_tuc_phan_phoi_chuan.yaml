scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Xác suất cao đúng 170 cm là bao nhiêu?"
    steps:
      - show: |
          <p class="big">Chọn ngẫu nhiên một người. Xác suất người đó cao <b>đúng</b> 170 cm — không lệch dù một phần triệu milimét?</p>
          <p>Đáp án: <b class="red">0</b> — vì có vô số chiều cao khả dĩ, mỗi giá trị riêng lẻ chỉ chiếm “một phần vô cùng nhỏ”.</p>
        focus: [0, 1, 2]
        say: "Chào bạn, hãy thử một câu hỏi lạ. Chọn ngẫu nhiên một người, xác suất người đó cao đúng 170 xăng ti mét, không lệch dù một phần triệu mi li mét, là bao nhiêu? Đáp án là 0, vì có vô số chiều cao khả dĩ."
      - show: |
          <div class="box key">Nhưng “cao từ 165 đến 175 cm” thì có xác suất hẳn hoi. &nbsp; → Với số đo liên tục, ta hỏi xác suất của một <b>khoảng</b>.</div>
        say: "Nhưng câu hỏi cao từ 165 đến 175 xăng ti mét thì có xác suất hẳn hoi. Hôm nay ta học cách tính xác suất cho số đo liên tục, và đường cong hình chuông nổi tiếng nhất của thống kê."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: bảng phân phối của bài 13"
    checks:
      - "sum([Rational(1, 6)]*6) == 1 and sum(Rational(k, 6) for k in range(1, 7)) == Rational(7, 2)"
    steps:
      - show: |
          <p>Bài 13, biến <b>rời rạc</b> (đếm được giá trị, như xúc xắc): mỗi giá trị có một xác suất, <b>tổng bằng 1</b>.</p>
          $$\mathbb{E}[X] = \sum_{x} x\cdot P(X = x) \quad \text{(trung bình dài hạn)}$$
          $$\operatorname{Var}(X) = \mathbb{E}\big[(X - \mu)^2\big], \quad \mu = \mathbb{E}[X], \quad \sigma = \sqrt{\operatorname{Var}(X)}$$
        focus: [1, 2, 3]
        say: "Nhắc lại bài 13, với biến rời rạc như xúc xắc, mỗi giá trị có một xác suất và tổng các xác suất bằng 1. Kỳ vọng là tổng của giá trị nhân xác suất. Phương sai là trung bình bình phương khoảng cách tới kỳ vọng muy, còn xích ma là căn của phương sai."

  # ───────────────────────── 3. HÀM MẬT ĐỘ ─────────────────────────
  - id: density
    kind: concept
    title: "Từ biểu đồ cột đến hàm mật độ"
    checks:
      - "Rational(1, 2) * (Rational(3, 2) - Rational(1, 2)) == Rational(1, 2) and Rational(1, 2) * 2 == 1"
      - "2 * Rational(1, 2) == 1 and 2 * (Rational(3, 10) - Rational(1, 10)) == Rational(2, 5)"
    steps:
      - show: |
          <p>Chia trục chiều cao thành các cột. Vẽ sao cho <b>diện tích</b> mỗi cột = xác suất rơi vào cột đó. Cột càng hẹp, đỉnh các cột càng gần một <b>đường cong</b> $f(x)$ — hàm mật độ.</p>
          <div class="box key">Xác suất $X$ nằm giữa $a$ và $b$ = <b>diện tích dưới</b> $f$ từ $a$ đến $b$. &nbsp; Toàn bộ diện tích = 1; &nbsp; $f(x) \ge 0$.</div>
        focus: [1, 1, 2]
        say: "Chia trục chiều cao thành nhiều cột, vẽ sao cho diện tích mỗi cột bằng xác suất rơi vào cột đó. Cột càng hẹp, đỉnh các cột càng gần một đường cong, gọi là hàm mật độ. Xác suất của một khoảng là diện tích dưới đường cong, và toàn bộ diện tích bằng 1."
      - show: |
          <div class="row"><div class="col"><svg width="588" height="350" viewBox="0 0 420 250">
            <line x1="30" y1="210" x2="400" y2="210" stroke="#9ca3af" stroke-width="2"/>
            <line x1="40" y1="20" x2="40" y2="220" stroke="#9ca3af" stroke-width="2"/>
            <rect x="40" y="160" width="300" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
            <rect x="115" y="160" width="150" height="50" fill="#059669" fill-opacity="0.45"/>
            <text x="350" y="168" font-size="22" fill="#2563eb">0,5</text>
            <text x="32" y="240" font-size="22">0</text><text x="105" y="240" font-size="22">0,5</text>
            <text x="250" y="240" font-size="22">1,5</text><text x="333" y="240" font-size="22">2</text>
          </svg></div>
          <div class="col"><p>Đều trên đoạn 0 đến 2: $f(x) = 0{,}5$ (rộng 2, cao 0,5, diện tích 1).</p>
          <p>Xác suất giữa 0,5 và 1,5 = rộng 1 nhân cao 0,5 = $\hlg{0{,}5}$</p>
          <p class="note">Đều trên 0 đến 0,5: $f(x) = 2$ — <b>mật độ lớn hơn 1</b> vẫn hợp lệ, vì xác suất là diện tích, không phải độ cao.</p></div></div>
        say: "Ví dụ đơn giản nhất, đều trên đoạn từ 0 đến 2. Mật độ bằng 0 phẩy 5, vì rộng 2 nhân cao 0 phẩy 5 bằng 1. Xác suất giữa 0 phẩy 5 và 1 phẩy 5 là diện tích phần tô xanh, bằng 0 phẩy 5. Còn đều trên đoạn ngắn hơn thì mật độ có thể lớn hơn 1."

  # ───────────────────────── 4. KÝ HIỆU TÍCH PHÂN ─────────────────────────
  - id: sym_int
    kind: symbol
    title: "Giải mã: dấu tích phân — diện tích dưới đường cong"
    checks:
      - "(lambda x: sp.integrate(2*x, (x, 0, Rational(1, 2))) == Rational(1, 4) and sp.integrate(2*x, (x, 0, 1)) == 1)(sp.Symbol('x'))"
      - "[round(sum(2*(i*0.5/n)*(0.5/n) for i in range(n)), 4) for n in (4, 10, 100)] == [0.1875, 0.225, 0.2475] and math.floor(sum(2*(i*0.5/1000)*(0.5/1000) for i in range(1000)) * 10000) == 2497"
      # 1000 cột: tổng chính xác là 0,25·999/1000 = 0,24975 (hiện đủ 5 chữ số, không cắt thành 0,2497)
      - "sum(2*(i*Rational(1, 2000))*Rational(1, 2000) for i in range(1000)) == Rational(24975, 100000)"
    steps:
      - show: |
          <div class="box key">$\int_{a}^{b} f(x)\, dx$ &nbsp; đọc là “tích phân từ a đến b của f”: <b>diện tích dưới</b> đường $f$ từ $a$ đến $b$.</div>
          <p>Nó là giới hạn của <b>tổng các cột hẹp</b> bề rộng $h$: &nbsp; $\int_{a}^{b} f(x)\, dx \approx \sum f(x_i)\cdot h$ &nbsp; (chữ $dx$ nhắc “bề rộng rất nhỏ”).</p>
        introduces: [integral]
        focus: ["1.1", 1, 2]
        say: "Ký hiệu mới, hình chữ S kéo dài, đọc là tích phân từ a đến b của f. Nó chính là diện tích dưới đường f từ a đến b. Hãy hiểu nó như tổng của rất nhiều cột hẹp, mỗi cột cao f và rộng h, giống dấu xích ma của bài 1."
      - show: |
          <p>Ví dụ $f(x) = 2x$ trên đoạn 0 đến 1 (diện tích tam giác $= \frac{1}{2}\cdot 1\cdot 2 = 1$). &nbsp; Xác suất $X$ nhỏ hơn 0,5:</p>
          <table class="t"><tr><th>số cột</th><th>4</th><th>10</th><th>100</th><th>1000</th><th>chính xác</th></tr>
          <tr><td>tổng diện tích cột</td><td>0,1875</td><td>0,225</td><td>0,2475</td><td>0,24975</td><td>$\hlg{0{,}25}$</td></tr></table>
          <p class="note">Chính xác: tam giác rộng 0,5, cao $f(0{,}5) = 1$, diện tích $\frac{1}{2}\cdot 0{,}5\cdot 1 = 0{,}25$.</p>
        focus: [1, [1, 3], 2]
        say: "Ví dụ mật độ 2 x trên đoạn từ 0 đến 1. Xác suất X nhỏ hơn 0 phẩy 5 là diện tích một tam giác, bằng 0 phẩy 25. Tính bằng 4 cột được 0 phẩy 1875, 1000 cột được 0 phẩy 24975, càng nhiều cột càng gần đáp án."
      - show: |
          <p class="note">Sau này bạn còn gặp tích phân theo <b>tham số</b> của mô hình: cũng đọc như trên — “cộng dồn” qua mọi giá trị có thể của tham số.</p>
        notation_note: true
        say: "Sau này, bạn còn gặp tích phân theo tham số của mô hình, thay vì theo x. Cách hiểu vẫn như vậy, đó là cộng dồn qua mọi giá trị có thể của tham số."

  # ───────────────────────── 5. KỲ VỌNG LIÊN TỤC ─────────────────────────
  - id: expect_cont
    kind: formula
    title: "Kỳ vọng và phương sai: tổng thành tích phân"
    checks:
      - "(lambda x: sp.integrate(x*2*x, (x, 0, 1)) == Rational(2, 3) and sp.integrate(x**2*2*x, (x, 0, 1)) == Rational(1, 2))(sp.Symbol('x'))"
      - "Rational(1, 2) - Rational(2, 3)**2 == Rational(1, 18) and round(1/18, 4) == 0.0556"
    steps:
      - show: |
          <p>Thay “xác suất của từng giá trị” bằng “mật độ nhân bề rộng nhỏ”, và thay tổng bằng tích phân:</p>
          <div class="box key">$\mathbb{E}[X] = \int x\cdot f(x)\, dx$, &nbsp;&nbsp; $\operatorname{Var}(X) = \mathbb{E}\big[(X - \mu)^2\big] = \mathbb{E}[X^2] - \mu^2$ &nbsp; (như bài 13)</div>
        focus: [[1, "2.1"], "2.2"]
        say: "Kỳ vọng của biến liên tục tính giống bài 13, chỉ thay xác suất từng giá trị bằng mật độ nhân bề rộng nhỏ, và thay tổng bằng tích phân. Phương sai vẫn là kỳ vọng của X bình phương trừ muy bình phương."
      - show: |
          <p><b>Làm thử ngay</b> với $f(x) = 2x$ trên 0 đến 1: &nbsp; $\mathbb{E}[X] = \frac{2}{3} \approx 0{,}667$, &nbsp; $\mathbb{E}[X^2] = \frac{1}{2}$</p>
          <p>$$\operatorname{Var}(X) = \frac{1}{2} - \left(\frac{2}{3}\right)^2 = \hlg{\frac{1}{18}} \approx 0{,}0556$$</p>
          <p class="note">Kỳ vọng lệch về phía 1, vì mật độ $2x$ cao hơn ở bên phải.</p>
        focus: [1, ["1.3", 3], 2]
        say: "Làm thử ngay với mật độ 2 x. Kỳ vọng bằng hai phần ba, lệch về phía 1 vì mật độ cao hơn ở bên phải. Thay vào công thức, phương sai bằng một nửa trừ bốn phần chín, tức một phần mười tám."

  # ───────────────────────── 6. PHÂN PHỐI CHUẨN ─────────────────────────
  - id: sym_normal
    kind: symbol
    title: "Giải mã: phân phối chuẩn N(μ, σ²) — đường cong hình chuông"
    checks:
      - "abs(1/math.sqrt(2*math.pi*49) - 0.057) < 0.0005 and abs(math.exp(-0.5)/math.sqrt(2*math.pi*49) - 0.0346) < 0.0001"
      - "(lambda x, m, s: sp.simplify(sp.integrate(sp.exp(-(x - m)**2/(2*s**2))/sp.sqrt(2*sp.pi*s**2), (x, -sp.oo, sp.oo))) == 1)(sp.Symbol('x', real=True), sp.Symbol('m', real=True), sp.Symbol('s', positive=True))"
    steps:
      - show: |
          <div class="box key">$X$ có phân phối $\mathcal{N}(\mu, \sigma^2)$ (đọc “phân phối chuẩn muy, xích ma bình phương”) khi mật độ là
          $\ f(x) = \dfrac{1}{\sqrt{2\pi\sigma^2}}\cdot e^{-\frac{(x - \mu)^2}{2\sigma^2}}$</div>
          <p>Số mũ (viết to cho dễ đọc): $\ -\dfrac{(x - \mu)^2}{2\sigma^2}$</p>
          <p class="note">Tham số thứ hai là <b>phương sai</b> $\sigma^2$: giả sử chiều cao người $\mathcal{N}(170, 49)$ (số minh hoạ), nghĩa là $\mu = 170$ cm, $\sigma = 7$ cm.</p>
        introduces: [normal, pi]
        focus: [1, 3, 3]
        say: "Ký hiệu chữ N hoa uốn cong là phân phối chuẩn, với hai tham số, muy và xích ma bình phương. Chú ý tham số thứ hai là phương sai, không phải độ lệch chuẩn. Ví dụ minh hoạ, giả sử chiều cao người có muy bằng 170, phương sai 49, nghĩa là xích ma bằng 7."
      - clear: true
        show: |
          <p class="note">Đang có: $\ f(x) = \dfrac{1}{\sqrt{2\pi\sigma^2}}\cdot e^{-\frac{(x - \mu)^2}{2\sigma^2}}$, &nbsp; chiều cao $\mathcal{N}(170, 49)$</p>
          <div class="row"><div class="col"><svg width="644" height="378" viewBox="0 0 460 270">
            <line x1="20" y1="230" x2="440" y2="230" stroke="#9ca3af" stroke-width="2"/>
            <polygon fill="#059669" fill-opacity="0.35" points="165,230 165,151 175,138 185,127 195,117 205,108 215,102 225,99 235,99 245,102 255,108 265,117 275,127 285,138 295,151 295,230"/>
            <polyline fill="none" stroke="#2563eb" stroke-width="5" points="35,229 45,228 55,227 65,225 75,222 85,219 95,215 105,209 115,203 125,194 135,185 145,174 155,163 165,151 175,138 185,127 195,117 205,108 215,102 225,99 235,99 245,102 255,108 265,117 275,127 285,138 295,151 305,163 315,174 325,185 335,194 345,203 355,209 365,215 375,219 385,222 395,225 405,227 415,228 425,229"/>
            <line x1="230" y1="90" x2="230" y2="230" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 6"/>
            <text x="212" y="258" font-size="22" fill="#dc2626">170</text>
            <text x="142" y="258" font-size="22">163</text><text x="282" y="258" font-size="22">177</text>
            <text x="200" y="200" font-size="24" fill="#065f46">68%</text>
          </svg></div>
          <div class="col"><p>① Đỉnh tại $\mu$ (vì $(x - \mu)^2 = 0$ ở đó), đối xứng hai bên.</p>
          <p>② $e^{\text{số âm}}$ luôn dương và nhỏ dần khi $x$ xa $\mu$ (bài 12).</p>
          <p>③ $\frac{1}{\sqrt{2\pi\sigma^2}}$ làm tổng diện tích bằng đúng 1. &nbsp; Tại đỉnh: $f(170) \approx 0{,}057$.</p></div></div>
        focus: [1, "2.2", "2.2", 1]
        say: "Đọc công thức từng phần. Đỉnh nằm tại muy, vì ở đó bình phương khoảng cách bằng 0, và đồ thị đối xứng hai bên. Theo bài 12, e mũ một số âm luôn dương và nhỏ dần khi x đi xa muy. Hằng số phía trước làm tổng diện tích bằng đúng 1."
      - clear: true
        show: |
          <p class="note">Sách hay viết $\exp\left(-\frac{(x - \mu)^2}{2\sigma^2}\right)$: theo bài 12, $\exp(\text{số mũ})$ chính là $e^{\text{số mũ}}$. Phân phối này còn gọi là phân phối Gaussian, và sách hay viết mật độ là $p(x)$ — bài này viết $f(x)$ để khỏi lẫn với xác suất $P(A)$ của bài 13.</p>
        notation_note: true
        say: "Sách hay viết phần hàm mũ bằng ba chữ cái. Như bài 12 đã nói, đó chính là e mũ, viết gọn khi số mũ dài. Phân phối này còn có tên khác theo tên một nhà toán học, và sách hay viết mật độ bằng chữ p thường, còn bài này dùng chữ f để khỏi lẫn với xác suất."

  # ───────────────────────── 7. QUY TẮC 68–95–99,7 ─────────────────────────
  - id: rule689599
    kind: example
    title: "Quy tắc 68 – 95 – 99,7 và chuẩn hoá z"
    checks:
      - "(lambda P: [round(P(k) - P(-k), 4) for k in (1, 2, 3)] == [0.6827, 0.9545, 0.9973])(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
      - "170 - 7 == 163 and 170 + 7 == 177 and 170 - 14 == 156 and 170 + 14 == 184 and (184 - 170)/7 == 2 and 170 - 21 == 149 and 170 + 21 == 191"
      - "(lambda P: round(1 - P(2), 4) == 0.0228)(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
      - "(184 - 170) == 14 and 14/7 == 2 and round(100 - 95.45, 2) == 4.55 and round((100 - 95.45)/2, 1) == 2.3"
      - "(163 - 170)/7 == -1 and round(100 - 68.27, 2) == 31.73 and round((100 - 68.27)/2, 1) == 15.9 and (lambda P: round(P(-1)*100, 1) == 15.9)(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
    steps:
      - show: |
          <p><b>Bước 1.</b> Đọc khoảng theo số lần $\sigma$ ($\mu = 170$, $\sigma = 7$):</p>
          <table class="t"><tr><th>khoảng</th><th>$\mu \pm \sigma$</th><th>$\mu \pm 2\sigma$</th><th>$\mu \pm 3\sigma$</th></tr>
          <tr><td>xác suất (diện tích)</td><td>68,27%</td><td>95,45%</td><td>99,73%</td></tr>
          <tr><td>chiều cao $\mathcal{N}(170, 49)$</td><td>163 – 177</td><td>156 – 184</td><td>149 – 191</td></tr></table>
        focus: [2, "2.3"]
        say: "Với mọi phân phối chuẩn, khoảng muy cộng trừ một xích ma chứa khoảng 68 phần trăm diện tích, hai xích ma chứa 95 phần trăm, ba xích ma chứa 99 phẩy 7 phần trăm. Với chiều cao trong ví dụ này, 68 phần trăm người cao từ 163 đến 177."
      - clear: true
        show: |
          <div class="box key">Chuẩn hoá: $\ z = \dfrac{x - \mu}{\sigma}$ &nbsp; = “cách tâm bao nhiêu lần $\sigma$”. &nbsp; $z$ có phân phối $\mathcal{N}(0, 1)$.</div>
          <p><b>Bước 2.</b> Cao 184 cm: $$z = \dfrac{184 - 170}{7} = \dfrac{14}{7} = 2$$</p>
        focus: [1, 2]
        say: "Chuẩn hoá nghĩa là đo một giá trị cách tâm bao nhiêu lần xích ma. Bước hai, người cao 184 có z bằng 184 trừ 170, chia 7, tức 14 chia 7, bằng 2."
      - show: |
          <p><b>Bước 3.</b> Phần nằm <b>ngoài</b> $\mu \pm 2\sigma$, chia đều hai phía vì đường chuông đối xứng:</p>
          $$\frac{100\% - 95{,}45\%}{2} = \frac{4{,}55\%}{2} \approx \hlg{2{,}3\%} \ \text{ người cao hơn 184 cm}$$
        focus: [1, 2, 2]
        say: "Bước ba, phần nằm ngoài khoảng hai xích ma chiếm 100 trừ 95 phẩy 45, tức 4 phẩy 55 phần trăm. Vì đường chuông đối xứng, phần này chia đều cho hai phía. Vậy chỉ khoảng 2 phẩy 3 phần trăm người cao hơn 184."
      - clear: true
        show: |
          <p><b>Bước 4.</b> Cao 163 cm, thấp hơn tâm đúng một $\sigma$: $$z = \dfrac{163 - 170}{7} = \dfrac{-7}{7} = -1$$</p>
          $$\text{thấp hơn 163 cm: } \ \frac{100\% - 68{,}27\%}{2} = \frac{31{,}73\%}{2} \approx \hlg{15{,}9\%}$$
        focus: [1, 2]
        say: "Bước bốn, người cao 163 có z bằng âm 7 chia 7, bằng âm 1, nghĩa là thấp hơn tâm đúng một xích ma, dấu âm chỉ phía bên trái. Phần ngoài khoảng một xích ma là 31 phẩy 73 phần trăm, chia đôi được khoảng 15 phẩy 9 phần trăm người thấp hơn 163."

  # ───────────────────────── 8. KIỂM BẰNG MÔ PHỎNG ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: máy sinh 100 nghìn chiều cao"
    checks:
      - "(lambda r: round(float(np.mean(abs(r - 170) < 7)), 3) == 0.684 and round(float(np.mean(abs(r - 170) < 14)), 3) == 0.955 and round(float(r.mean()), 2) == 169.99 and round(float(r.std()), 2) == 7.0)(np.random.default_rng(0).normal(170, 7, 100000))"
    steps:
      - show: |
          <p>Máy sinh 100 000 chiều cao theo $\mathcal{N}(170, 49)$ rồi đếm:</p>
          <table class="t"><tr><th></th><th>trung bình</th><th>độ lệch chuẩn</th><th>trong 163 – 177</th><th>trong 156 – 184</th></tr>
          <tr><td>mô phỏng</td><td>169,99</td><td>7,00</td><td>$\hlg{68{,}4\%}$</td><td>$\hlg{95{,}5\%}$</td></tr>
          <tr><td>lý thuyết</td><td>170</td><td>7</td><td>68,27%</td><td>95,45%</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Phép thử, ta cho máy sinh 100 nghìn chiều cao theo phân phối chuẩn này rồi đếm. Trung bình là 169 phẩy 99, độ lệch chuẩn là 7. Số người trong khoảng một xích ma là 68 phẩy 4 phần trăm, khớp với lý thuyết vì diện tích chính là xác suất."

  # ───────────────────────── 9. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Phân phối chuẩn trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>gặp lại ở đâu</th></tr>
          <tr><td><b>Bài 15</b></td><td>phân phối chuẩn cho dữ liệu nhiều chiều (vector), độ rộng thành một ma trận</td></tr>
          <tr><td><b>Bài 17</b></td><td>tìm $\mu$ hợp lý nhất từ dữ liệu — kết quả là trung bình cộng</td></tr>
          <tr><td><b>Bài 20</b></td><td>chữ $\sigma$ được dùng cho một hàm khác (hàm hình chữ S) — <b>không</b> phải độ lệch chuẩn</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3", "1.4"]
        say: "Ở bài 15, ta mở rộng phân phối chuẩn cho dữ liệu nhiều chiều. Ở bài 17, ta tìm muy hợp lý nhất từ dữ liệu, và đáp án là trung bình cộng. Lưu ý ở bài 20, chữ xích ma được dùng cho một hàm hình chữ S, không phải độ lệch chuẩn."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(1/(0.1*math.sqrt(2*math.pi)) - 3.989) < 0.001"
      - "math.sqrt(49) == 7 and 49 != 7"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ $f(x)$ là xác suất, nên phải $\le 1$ <b class="red">(sai)</b>
          <br><span class="note">$\mathcal{N}(0;\ 0{,}01)$, tức $\sigma = 0{,}1$, có đỉnh $$f(0) = \frac{1}{0{,}1\cdot\sqrt{2\pi}} \approx 3{,}989 > 1$$ Chỉ <b>diện tích</b> mới là xác suất.</span></div>
        say: "Lỗi thứ nhất, nghĩ rằng mật độ là xác suất nên không vượt quá 1. Phân phối chuẩn với xích ma bằng 0 phẩy 1 có đỉnh xấp xỉ 3 phẩy 989. Chỉ diện tích mới là xác suất."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ xác suất tại đúng một điểm là $f(a)$ <b class="red">(sai)</b>
          <br><span class="note">Với biến liên tục, xác suất tại đúng một điểm bằng 0 (cột rộng 0 có diện tích 0).</span></div>
        say: "Lỗi thứ hai, nghĩ rằng xác suất tại đúng một điểm a bằng mật độ tại a. Với biến liên tục, xác suất tại một điểm bằng 0, vì cột có bề rộng 0 thì diện tích bằng 0."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đọc $\mathcal{N}(170, 49)$ thành “$\sigma = 49$” <b class="red">(sai)</b>
          <br><span class="note">Tham số thứ hai là phương sai $\sigma^2 = 49$, nên $\sigma = 7$. Thư viện lập trình lại thường nhận $\sigma$ — đọc kỹ hướng dẫn của thư viện.</span></div>
        say: "Lỗi thứ ba, đọc tham số thứ hai là độ lệch chuẩn. Trong ký hiệu này nó là phương sai, nên 49 nghĩa là xích ma bằng 7. Nhiều thư viện lập trình lại nhận xích ma, nên hãy đọc kỹ hướng dẫn của thư viện."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhầm $\sigma$ độ lệch chuẩn với $\sigma$ của hàm sigmoid <b class="red">(hai thứ khác nhau)</b>
          <br><span class="note">Sách dùng cùng chữ cho cả hai. Xem chữ đứng ở đâu: trong $\mathcal{N}(\mu, \sigma^2)$ là độ lệch chuẩn.</span></div>
        say: "Lỗi thứ tư, nhầm hai nghĩa của chữ xích ma. Sách dùng cùng chữ này cho độ lệch chuẩn, và cho một hàm hình chữ S dùng trong bài toán phân loại. Hãy xem chữ đứng ở đâu, trong phân phối chuẩn nó là độ lệch chuẩn."

  # ───────────────────────── 11. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "Rational(1, 4) * 4 == 1 and Rational(1, 4) * (3 - 1) == Rational(1, 2)"
      - "(130 - 100)/15 == 2 and (lambda P: round(P(1) - P(-1), 2) == 0.68)(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
      - "Rational(2, 4) == Rational(1, 2) and math.sqrt(225) == 15 and (85 - 100, 115 - 100) == (-15, 15) and 30/15 == 2"
      - "(lambda P: round((1 - P(2))*100, 1) == 2.3)(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$X$ đều trên đoạn 0 đến 4. Mật độ $f(x)$ bằng bao nhiêu? Xác suất $X$ nằm giữa 1 và 3?</td></tr>
          <tr><td>2</td><td>Điểm thi $\mathcal{N}(100, 225)$. Bao nhiêu phần trăm nằm giữa 85 và 115?</td></tr>
          <tr><td>3</td><td>Ở câu 2, điểm 130 có $z$ bằng bao nhiêu?</td></tr></table>
        focus: [0, "1.2", ["1.3", "1.4"], 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một về phân phối đều. Câu hai và câu ba về điểm thi có phân phối chuẩn, với muy bằng 100 và phương sai 225. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p><b>Câu 1.</b> Toàn bộ diện tích bằng 1: rộng 4 nhân cao $f$ bằng 1, nên $f(x) = \frac{1}{4}$.</p>
          $$P(1 \le X \le 3) = \text{rộng } 2 \cdot \text{cao } \frac{1}{4} = \hlg{0{,}5}$$
          <p class="note">Kiểm cách khác: đoạn 1 đến 3 dài bằng nửa đoạn 0 đến 4, mật độ đều nên xác suất là một nửa $\checkmark$</p>
        focus: [1, 2, 3]
        say: "Đáp án câu một, toàn bộ diện tích phải bằng 1, mà hình chữ nhật rộng 4, nên chiều cao là một phần tư. Xác suất giữa 1 và 3 là diện tích một hình chữ nhật rộng 2, cao một phần tư, bằng 0 phẩy 5. Kiểm cách khác, đoạn từ 1 đến 3 dài bằng nửa đoạn từ 0 đến 4, mật độ đều nên xác suất đúng là một nửa."
      - clear: true
        show: |
          <p><b>Câu 2.</b> Tham số thứ hai là phương sai: $\ \sigma = \sqrt{225} = 15$.</p>
          <table class="t"><tr><th>mốc</th><th>85</th><th>115</th></tr><tr><td>cách tâm 100</td><td>$-15 = -\sigma$</td><td>$+15 = +\sigma$</td></tr></table>
          <p>Vậy 85 đến 115 là $\mu \pm \sigma$ → $\hlg{\approx 68\%}$</p>
        focus: [1, 2, 3]
        say: "Câu hai, tham số thứ hai là phương sai, nên xích ma bằng căn của 225, bằng 15. Mốc 85 cách tâm âm 15, mốc 115 cách tâm cộng 15, tức đúng một xích ma mỗi phía. Vậy đó là khoảng muy cộng trừ một xích ma, chứa khoảng 68 phần trăm."
      - show: |
          <p><b>Câu 3.</b> $$z = \dfrac{130 - 100}{15} = \dfrac{30}{15} = \hlg{2}$$</p>
          <p class="note">Như bước 3 của ví dụ chiều cao: chỉ khoảng 2,3% thí sinh đạt trên 130.</p>
        focus: [1, 2]
        say: "Câu ba, z bằng 130 trừ 100, chia 15, tức 30 chia 15, bằng 2. Giống bước ba của ví dụ chiều cao, chỉ khoảng 2 phẩy 3 phần trăm thí sinh đạt trên 130 điểm."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">liên tục: xác suất 1 điểm = 0</span><span class="a">→</span>
          <span class="n">mật độ $f$: xác suất = diện tích</span><span class="a">→</span>
          <span class="n">$\int$ = tổng các cột hẹp</span><span class="a">→</span>
          <span class="n">$\mathcal{N}(\mu, \sigma^2)$: tâm $\mu$, rộng $\sigma$</span><span class="a">→</span>
          <span class="n">68 – 95 – 99,7; &nbsp; $z = \frac{x - \mu}{\sigma}$</span></div>
        say: "Tổng kết chuỗi logic. Với biến liên tục, xác suất tại một điểm bằng 0. Hàm mật độ cho xác suất bằng diện tích, tính bằng tích phân, tức tổng các cột hẹp. Phân phối chuẩn có tâm muy, độ rộng xích ma, và quy tắc 68, 95, 99 phẩy 7."
      - show: |
          <div class="box key"><b>Tư duy:</b> với số đo liên tục, đừng hỏi “đúng bằng bao nhiêu” — hãy hỏi “nằm trong khoảng nào”, và đo khoảng cách bằng số lần $\sigma$.</div>
        say: "Điều cần mang theo, với số đo liên tục, đừng hỏi đúng bằng bao nhiêu, hãy hỏi nằm trong khoảng nào, và đo khoảng cách bằng số lần xích ma."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 15): <b>phân phối chuẩn nhiều chiều</b> và ma trận hiệp phương sai — khi mỗi dữ liệu là một vector.</p>
        forward_ref: true
        say: "Ở bài sau, bài 15, ta học phân phối chuẩn nhiều chiều và ma trận hiệp phương sai, khi mỗi dữ liệu là một vector như chiều cao và cân nặng. Hẹn gặp bạn ở bài tiếp theo."
