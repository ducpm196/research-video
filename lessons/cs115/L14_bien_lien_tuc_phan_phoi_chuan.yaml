  - show: <p><b>Chạy thử Python — xác nhận quy tắc một độ lệch chuẩn bằng math.erf:</b></p><div class="code"><div>import math</div><div>print(round(math.erf(1 / math.sqrt(2)), 4))</div></div>
    say: Đoạn Python dùng hàm sai số chuẩn tính xác suất nằm trong khoảng một độ lệch chuẩn.
    clear: true
    focus: null
- id: in_ai
  kind: concept
  title: Phân phối chuẩn trong học máy
  steps:
  - show: '<table class="t"><tr><th>bài</th><th>gặp lại ở đâu</th></tr>

      <tr><td><b>Bài 15</b></td><td>phân phối chuẩn cho dữ liệu nhiều chiều (vector), độ rộng thành một ma trận</td></tr>

      <tr><td><b>Bài 17</b></td><td>tìm $\mu$ hợp lý nhất từ dữ liệu — kết quả là trung bình cộng</td></tr>

      <tr><td><b>Bài 20</b></td><td>chữ $\sigma$ được dùng cho một hàm khác (hàm hình chữ S) — <b>không</b> phải độ lệch chuẩn</td></tr></table>

      '
    forward_ref: true
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Ở bài 15, ta mở rộng phân phối chuẩn cho dữ liệu nhiều chiều. Ở bài 17, ta tìm muy hợp lý nhất từ dữ liệu, và đáp án là trung bình cộng. Lưu ý ở bài 20, chữ xích ma được dùng cho một hàm hình chữ S, không phải độ lệch chuẩn.
- id: quymo
  kind: example
  title: 'Khi tính diện tích bằng cột hẹp: thêm cột thì chính xác, thêm biến thì gãy'
  checks:
  - '[round(sum(math.exp(-(-1 + (i + 0.5)*(2/k))**2/2)/math.sqrt(2*math.pi)*(2/k) for i in range(k)), 4) for k in (2, 10, 100)] == [0.7041, 0.6835, 0.6827]'
  - '[round(abs(sum(math.exp(-(-1 + (i + 0.5)*(2/k))**2/2)/math.sqrt(2*math.pi)*(2/k) for i in range(k)) - math.erf(1/math.sqrt(2))), 6) for k in (2, 10, 100)] == [0.021441, 0.000808, 8e-06]'
  - '[100**d for d in (1, 2, 3, 10)] == [100, 10**4, 10**6, 10**20] and round(10**20/10**9/(365.25*86400)) == 3169'
  steps:
  - show: '<p>Diện tích dưới đường chuông từ $-1$ đến $1$ bằng $k$ cột hẹp, chiều cao lấy ở giữa mỗi cột. Giá trị đúng: $0{,}6827$.</p>

      <table class="t"><tr><th>số cột $k$</th><th>tổng diện tích</th><th>lệch</th></tr>

      <tr><td>2</td><td>0,7041</td><td>0,0214</td></tr>

      <tr><td>10</td><td>0,6835</td><td>0,0008</td></tr>

      <tr><td>100</td><td>0,6827</td><td>0,000008</td></tr></table>

      <div class="box key">Thêm ×10 cột → lệch giảm khoảng ÷100.</div>

      '
    focus:
    - 1
    - '2.2'
    - - '2.3'
      - '2.4'
    - 3
    say: Ta tính diện tích dưới đường chuông từ âm 1 đến 1 bằng k cột hẹp, chiều cao lấy ở giữa mỗi cột. Với 2 cột được 0 phẩy 7041, lệch 0 phẩy 02 so với giá trị đúng 0 phẩy 6827. Với 10 cột lệch dưới một phần nghìn, với 100 cột lệch chỉ tám phần triệu. Thêm mười lần số cột thì sai lệch giảm khoảng một trăm lần.
  - clear: true
    show: '<p>Với $d$ biến, mỗi trục chia 100 cột: lưới có $100^d$ ô. Máy làm <b>1 tỉ</b> ô mỗi giây (số minh hoạ):</p>

      <table class="t"><tr><th>số biến $d$</th><th>số ô $100^d$</th><th>thời gian</th></tr>

      <tr><td>1</td><td>100</td><td>0,0000001 giây</td></tr>

      <tr><td>2</td><td>10 000</td><td>0,00001 giây</td></tr>

      <tr><td>3</td><td>1 triệu</td><td>0,001 giây</td></tr>

      <tr><td>10</td><td>$10^{20}$</td><td>≈ <b>3 170 năm</b></td></tr></table>

      <div class="box key">Dữ liệu nhiều chiều: không tính diện tích bằng lưới.</div>

      '
    focus:
    - 1
    - - '2.2'
      - '2.3'
      - '2.4'
    - '2.5'
    - 3
    say: Với d biến, nếu mỗi trục chia 100 cột thì lưới có 100 mũ d ô. Với 1, 2 và 3 biến, lưới có 100, mười nghìn và một triệu ô, máy tính xong gần như tức thì. Với 10 biến, lưới có một trăm tỉ tỉ ô, mất khoảng ba nghìn năm. Vì vậy dữ liệu nhiều chiều không thể tính diện tích bằng lưới.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  checks:
  - abs(1/(0.1*math.sqrt(2*math.pi)) - 3.989) < 0.001
  - math.sqrt(49) == 7 and 49 != 7
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ $f(x)$ là xác suất, nên phải $\le 1$ <b class="red">(sai)</b>

      <br><span class="note">$\mathcal{N}(0;\ 0{,}01)$, tức $\sigma = 0{,}1$, có đỉnh $$f(0) = \frac{1}{0{,}1\cdot\sqrt{2\pi}} \approx 3{,}989 > 1$$ Chỉ <b>diện tích</b> mới là xác suất.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ rằng mật độ là xác suất nên không vượt quá 1. Phân phối chuẩn với xích ma bằng 0 phẩy 1 có đỉnh xấp xỉ 3 phẩy 989. Chỉ diện tích mới là xác suất.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Nghĩ xác suất tại đúng một điểm là $f(a)$ <b class="red">(sai)</b>

      <br><span class="note">Với biến liên tục, xác suất tại đúng một điểm bằng 0 (cột rộng 0 có diện tích 0).</span></div>

      '
    say: Lỗi thứ hai, nghĩ rằng xác suất tại đúng một điểm a bằng mật độ tại a. Với biến liên tục, xác suất tại một điểm bằng 0, vì cột có bề rộng 0 thì diện tích bằng 0.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Đọc $\mathcal{N}(170, 49)$ thành “$\sigma = 49$” <b class="red">(sai)</b>

      <br><span class="note">Tham số thứ hai là phương sai $\sigma^2 = 49$, nên $\sigma = 7$. Thư viện lập trình lại thường nhận $\sigma$ — đọc kỹ hướng dẫn của thư viện.</span></div>

      '
    say: Lỗi thứ ba, đọc tham số thứ hai là độ lệch chuẩn. Trong ký hiệu này nó là phương sai, nên 49 nghĩa là xích ma bằng 7. Nhiều thư viện lập trình lại nhận xích ma, nên hãy đọc kỹ hướng dẫn của thư viện.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Nhầm $\sigma$ độ lệch chuẩn với $\sigma$ của hàm sigmoid <b class="red">(hai thứ khác nhau)</b>

      <br><span class="note">Sách dùng cùng chữ cho cả hai. Xem chữ đứng ở đâu: trong $\mathcal{N}(\mu, \sigma^2)$ là độ lệch chuẩn.</span></div>

      '
    say: Lỗi thứ tư, nhầm hai nghĩa của chữ xích ma. Sách dùng cùng chữ này cho độ lệch chuẩn, và cho một hàm hình chữ S dùng trong bài toán phân loại. Hãy xem chữ đứng ở đâu, trong phân phối chuẩn nó là độ lệch chuẩn.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - Rational(1, 4) * 4 == 1 and Rational(1, 4) * (3 - 1) == Rational(1, 2)
  - '(130 - 100)/15 == 2 and (lambda P: round(P(1) - P(-1), 2) == 0.68)(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))'
  - Rational(2, 4) == Rational(1, 2) and math.sqrt(225) == 15 and (85 - 100, 115 - 100) == (-15, 15) and 30/15 == 2
  - '(lambda P: round((1 - P(2))*100, 1) == 2.3)(lambda z: 0.5*(1 + math.erf(z/math.sqrt(2))))'
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>$X$ đều trên đoạn 0 đến 4. Mật độ $f(x)$ bằng bao nhiêu? Xác suất $X$ nằm giữa 1 và 3?</td></tr>

      <tr><td>2</td><td>Điểm thi $\mathcal{N}(100, 225)$. Bao nhiêu phần trăm nằm giữa 85 và 115?</td></tr>

      <tr><td>3</td><td>Ở câu 2, điểm 130 có $z$ bằng bao nhiêu?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - - '1.3'
      - '1.4'
    - 0
    say: Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một về phân phối đều. Câu hai và câu ba về điểm thi có phân phối chuẩn, với muy bằng 100 và phương sai 225. Hãy dừng video và làm ra giấy.
    pause: 60
  - show: '<p><b>Câu 1.</b> Toàn bộ diện tích bằng 1: rộng 4 nhân cao $f$ bằng 1, nên $f(x) = \frac{1}{4}$.</p>

      $$P(1 \le X \le 3) = \text{rộng } 2 \cdot \text{cao } \frac{1}{4} = \hlg{0{,}5}$$

      <p class="note">Kiểm cách khác: đoạn 1 đến 3 dài bằng nửa đoạn 0 đến 4, mật độ đều nên xác suất là một nửa $\checkmark$</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Đáp án câu một, toàn bộ diện tích phải bằng 1, mà hình chữ nhật rộng 4, nên chiều cao là một phần tư. Xác suất giữa 1 và 3 là diện tích một hình chữ nhật rộng 2, cao một phần tư, bằng 0 phẩy 5. Kiểm cách khác, đoạn từ 1 đến 3 dài bằng nửa đoạn từ 0 đến 4, mật độ đều nên xác suất đúng là một nửa.
  - clear: true
    show: '<p><b>Câu 2.</b> Tham số thứ hai là phương sai: $\ \sigma = \sqrt{225} = 15$.</p>

      <table class="t"><tr><th>mốc</th><th>85</th><th>115</th></tr><tr><td>cách tâm 100</td><td>$-15 = -\sigma$</td><td>$+15 = +\sigma$</td></tr></table>

      <p>Vậy 85 đến 115 là $\mu \pm \sigma$ → $\hlg{\approx 68\%}$</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Câu hai, tham số thứ hai là phương sai, nên xích ma bằng căn của 225, bằng 15. Mốc 85 cách tâm âm 15, mốc 115 cách tâm cộng 15, tức đúng một xích ma mỗi phía. Vậy đó là khoảng muy cộng trừ một xích ma, chứa khoảng 68 phần trăm.
  - show: '<p><b>Câu 3.</b> $$z = \dfrac{130 - 100}{15} = \dfrac{30}{15} = \hlg{2}$$</p>

      <p class="note">Như bước 3 của ví dụ chiều cao: chỉ khoảng 2,3% thí sinh đạt trên 130.</p>

      '
    focus:
    - 1
    - 2
    say: Câu ba, z bằng 130 trừ 100, chia 15, tức 30 chia 15, bằng 2. Giống bước ba của ví dụ chiều cao, chỉ khoảng 2 phẩy 3 phần trăm thí sinh đạt trên 130 điểm.
- id: practice
  kind: practice
  lab: labs/CS115/L14
  title: 'Tự làm: chuẩn hoá z và diện tích bằng tổng các cột hẹp'
  checks:
  - '[(58 - 50)/math.sqrt(64), (34 - 50)/math.sqrt(64)] == [1.0, -2.0]'
  - '[round(sum(math.exp(-(-1 + (i + 0.5)*(2/k))**2/2)/math.sqrt(2*math.pi)*(2/k) for i in range(k)), 4) for k in (10, 100)] == [0.6835, 0.6827] and round(math.erf(1/math.sqrt(2)), 4) == 0.6827'
  - round(math.erf(2/math.sqrt(2)), 4) == 0.9545 and round(1/(0.1*math.sqrt(2*math.pi)), 4) == 3.9894
  steps:
  - show: '<p><b>Đọc trước khi làm.</b> Phần tự làm là một chương trình Python viết trong tệp <code>chuan.py</code>. Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <i>Open Git Bash here</i>, gõ <code>python chuan.py</code> rồi Enter: Python chạy từng dòng. Dòng đầu tệp, <code>import math</code>, cho dùng các hàm toán có sẵn; số thập phân trong mã viết bằng dấu chấm: <code>0.2</code> là 0,2.</p>

      <table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr>

      <tr><td style="white-space:nowrap"><code>math.erf(z / math.sqrt(2))</code></td><td><code>erf</code> là hàm sai số: với $Z$ chuẩn tắc ($= \mathcal{N}(0, 1)$, độ lệch chuẩn 1), $P(-z \le Z \le z) = \mathrm{erf}(z/\sqrt{2})$; chia $\sqrt{2}$ vì <code>erf</code> ứng với $e^{-t^2}$, tức độ lệch chuẩn $1/\sqrt{2}$</td><td>$z = 1$ cho 0,6827</td></tr>

      <tr><td><code>abs(x - mu)</code></td><td>giá trị tuyệt đối: khoảng cách từ $x$ tới tâm, không mang dấu</td><td>$|42 - 50| = 8$</td></tr>

      <tr><td><code>-1 + (i + 0.5) * h</code></td><td>điểm giữa cột thứ $i$ (đếm $i$ từ 0), mỗi cột rộng $h$</td><td>$h = 0{,}2$, $i = 0$ cho $-0{,}9$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - - 1
      - '2.2'
    - - 1
      - '2.3'
    - - 1
      - '2.4'
    say: Phần tự làm là viết một chương trình trong một tệp, tên tệp hiện trên màn hình. Bạn mở cửa sổ dòng lệnh đi kèm Git, đi tới thư mục có tệp, gõ lệnh chạy kèm tên tệp, rồi máy chạy từng dòng. Dòng đầu tệp cho phép dùng các hàm toán có sẵn, và trong mã số thập phân viết bằng dấu chấm thay dấu phẩy. Hàm có tên viết tắt ở bảng nhận z chia căn 2, trả về xác suất chuẩn tắc nằm giữa âm z và z, ví dụ z bằng 1 cho 0 phẩy 6827. Hàm giá trị tuyệt đối cho khoảng cách không mang dấu, ví dụ số 42 cách tâm 50 một đoạn bằng 8. Biểu thức này là điểm giữa của cột thứ i, đếm i từ 0 và mỗi cột rộng h, ví dụ h bằng 0 phẩy 2 và i bằng 0 cho âm 0 phẩy 9.
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>chuan.py</code>: chiều cao tuân theo phân phối chuẩn, tâm 50, phương sai 64.</p>

      <table class="t"><tr><th>việc</th><th>cách làm</th></tr>

      <tr><td>$\sigma$, $z(58)$, $z(34)$</td><td>$z = (x - \mu)/\sigma$</td></tr>

      <tr><td>$P(42 < X < 58)$</td><td>$z$ từ $-1$ đến $1$: tổng 10 cột và 100 cột, cao ở giữa; so với <code>math.erf</code></td></tr>

      <tr><td>quy tắc hai xích ma</td><td>$P(|X - \mu| < 2\sigma)$ bằng <code>math.erf</code></td></tr>

      <tr><td>mật độ lớn hơn 1</td><td>$\sigma = 0{,}1$: mật độ tại tâm</td></tr></table>

      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L14/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - 0
    say: Bây giờ tới phần bạn tự làm, với chiều cao có tâm 50 và phương sai 64. Tính độ lệch chuẩn và chuẩn hoá hai giá trị. Tính xác suất từ 42 đến 58 bằng tổng 10 cột và 100 cột rồi so với giá trị chính xác. Kiểm quy tắc hai xích ma. Cuối cùng chỉ ra mật độ có thể lớn hơn 1. Dừng video và tự làm.
    pause: 360
  - clear: true
    show: '<p><b>Kết quả mong đợi</b> (nửa đầu)</p><div class="code"><div>sigma: 8.0</div><div>z(58): 1.0</div><div>z(34): -2.0</div><div>xap xi 10 cot: 0.6835</div><div>xap xi 100 cot: 0.6827</div></div>

      '
    focus:
    - 0
    - 0
    say: Đây là kết quả mong đợi, nửa đầu gồm độ lệch chuẩn, hai giá trị z và hai phép xấp xỉ. Bạn chạy chương trình của mình rồi so từng dòng.
  - clear: true
    show: '<p><b>Kết quả mong đợi</b> (nửa sau)</p><div class="code"><div>chinh xac: 0.6827</div><div>2 sigma: 0.9545</div><div>mat do tai tam (sigma=0.1): 3.9894</div><div>lon hon 1: True</div></div><p class="note" style="color:#374151;font-size:0.8em">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L14 chuan.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>CS115 L14 chuan.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi. <b>Kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python tệp.py</code> và so với kết quả mong đợi.</p>

      '
    focus:
    - 0
    - 3
    - 3
    say: 'Nửa sau gồm giá trị chính xác, quy tắc hai xích ma và mật độ tại tâm. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi cột có đáy $h = 2/k$ và cao bằng mật độ chuẩn tắc tại điểm giữa $z = -1 + (i + 0{,}5)h$; diện tích cột = cao nhân đáy. Mật độ chuẩn tắc tại $z$ là $e^{-z^2/2}/\sqrt{2\pi}$. Mật độ tại tâm của phân phối chuẩn là $1/(\sigma\sqrt{2\pi})$.</div>

      '
    say: Nếu kẹt, mỗi cột có đáy bằng 2 chia k, và chiều cao là mật độ tại điểm giữa cột. Diện tích một cột bằng chiều cao nhân đáy. Mật độ tại tâm bằng một chia xích ma nhân căn của hai pi.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">liên tục: xác suất 1 điểm = 0</span><span class="a">→</span>

      <span class="n">mật độ $f$: xác suất = diện tích</span><span class="a">→</span>

      <span class="n">$\int$ = tổng các cột hẹp</span><span class="a">→</span>

      <span class="n">$\mathcal{N}(\mu, \sigma^2)$: tâm $\mu$, rộng $\sigma$</span><span class="a">→</span>

      <span class="n">68 – 95 – 99,7; &nbsp; $z = \frac{x - \mu}{\sigma}$</span></div>

      '
    say: Tổng kết chuỗi logic. Với biến liên tục, xác suất tại một điểm bằng 0. Hàm mật độ cho xác suất bằng diện tích, tính bằng tích phân, tức tổng các cột hẹp. Phân phối chuẩn có tâm muy, độ rộng xích ma, và quy tắc 68, 95, 99 phẩy 7.
  - show: '<div class="box key"><b>Tư duy:</b> với số đo liên tục, đừng hỏi “đúng bằng bao nhiêu” — hãy hỏi “nằm trong khoảng nào”, và đo khoảng cách bằng số lần $\sigma$.</div>

      '
    say: Điều cần mang theo, với số đo liên tục, đừng hỏi đúng bằng bao nhiêu, hãy hỏi nằm trong khoảng nào, và đo khoảng cách bằng số lần xích ma.
  - clear: true
    show: '<p class="note">Bài sau (bài 15): <b>phân phối chuẩn nhiều chiều</b> và ma trận hiệp phương sai — khi mỗi dữ liệu là một vector.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 15, ta học phân phối chuẩn nhiều chiều và ma trận hiệp phương sai, khi mỗi dữ liệu là một vector như chiều cao và cân nặng. Hẹn gặp bạn ở bài tiếp theo.
