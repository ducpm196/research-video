id: L14
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 14 — Biến ngẫu nhiên liên tục, hàm mật độ & phân phối chuẩn một chiều"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L297–L300 (kỳ vọng, phương sai, N(μ, σ²) với exp), L317 (tích phân trong suy luận Bayes); PR25 (PMF vs PDF, Univariate Normal: 2 tham số μ và σ² > 0)"
assumes: [cdot, sub, sum, prob, expect, var, mu, sigma, exp]
# Quy ước ký hiệu: hàm mật độ f(x) (không viết p(x) — dễ lẫn với P(…) của bài 13); tích phân \int_{a}^{b} f(x)\,dx đọc là “diện tích
#   dưới f từ a đến b”; bề rộng cột nhỏ là h (như bước nhỏ h của bài 6, KHÔNG dùng Δ — Δ đã dành cho định thức);
#   hàm mũ viết e^{…} (exp chỉ nói trong step notation_note, như bài 12); phân phối chuẩn \mathcal{N}(\mu, \sigma^2): tham số thứ hai là
#   PHƯƠNG SAI σ², không phải σ.
# Lời đọc: KHÔNG đọc “Gauss”/“Gaussian” (chưa probe ASR) — nói “phân phối chuẩn”, “hình chuông”; tên chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 13 (bảng phân phối, tổng xác suất bằng 1, kỳ vọng = tổng giá trị nhân xác suất,
#   phương sai = trung bình bình phương khoảng cách tới μ, độ lệch chuẩn σ = căn phương sai); bài 12 (e mũ âm một số: luôn dương,
#   càng âm càng gần 0); bài 6 (bước nhỏ h).
# Sửa nguồn (curriculum fix): xác suất = diện tích dưới mật độ; mật độ có thể > 1; A11: σ ở đây là độ lệch chuẩn, khác σ của hàm sigmoid (bài 20).
objectives:
  - "Hiểu vì sao với biến liên tục, xác suất tại đúng một điểm bằng 0"
  - "Đọc hàm mật độ: xác suất là diện tích dưới đường cong, mật độ có thể lớn hơn 1"
  - "Đọc ký hiệu tích phân như diện tích, tính gần đúng bằng tổng các cột hẹp"
  - "Đọc công thức phân phối chuẩn: μ là tâm, σ là độ rộng; dùng quy tắc 68–95–99,7"
  - "Chuẩn hoá một giá trị bằng z = (x − μ)/σ"
