id: L18
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 18 — Hồi quy tuyến tính, hàm MSE & nghiệm đóng (normal equation)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L336–L342 (ŷ = wᵀx + b, MSE, w* = (XᵀX)⁻¹Xᵀy); ML24#Polynomial-regression (f(x; w) = wᵀφ(x)); R05 (gradient descent cho hồi quy); AUDIT A9"
assumes: [cdot, sub, vec, mat, transpose, inverse, implies, norm, nabla, partial, jacobian, hat, sum, aug, star, dots, approx, power, det, dim]
# Quy ước ký hiệu (AUDIT A9): mỗi HÀNG của X là một mẫu; cột đầu của X toàn số 1 để gộp b vào w: w = (b; w₁; …) — tài liệu dòng 337
#   viết b riêng nhưng dòng 339 chỉ có w; hàm sai số viết \operatorname{MSE}(\mathbf{w}) (tài liệu dòng 339 viết L(w) — chữ L ở bài 12, 17
#   là khả năng, nên bài này không dùng L); độ dài viết ‖·‖ không chỉ số dưới (tài liệu viết ‖·‖₂² — nói ở notation_note);
#   nghiệm tốt nhất \mathbf{w}^* (dấu sao: điểm tối ưu, như bài 8).
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (độ dài bình phương = tích vô hướng với chính nó), bài 2 (nhân ma trận, chuyển vị,
#   nghịch đảo 2×2 bằng ad − bc), bài 3 (khử Gauss, hạng), bài 6 (gradient), bài 7 (Jacobian, quy tắc chuỗi), bài 8 (cực tiểu:
#   gradient bằng 0), bài 9 (gradient descent), bài 17 (sai số chuẩn → bình phương nhỏ nhất).
# Sửa nguồn (curriculum fix): gộp b bằng cột 1; công thức có nghịch đảo cần XᵀX khả nghịch, nhưng phương trình chuẩn luôn có nghiệm;
#   gradient suy ra bằng quy tắc chuỗi; giải phương trình chuẩn bằng khử Gauss; hồi quy đa thức vẫn tuyến tính theo w.
objectives:
  - "Viết mô hình tuyến tính dạng ma trận, gộp hệ số tự do b bằng cột số 1"
  - "Hiểu hàm sai số MSE và vì sao dùng bình phương"
  - "Suy ra gradient của MSE bằng quy tắc chuỗi và Jacobian"
  - "Lập và giải phương trình chuẩn XᵀXw = Xᵀy bằng khử Gauss"
  - "Biết khi nào công thức có nghịch đảo dùng được; mở rộng sang hồi quy đa thức"
asr_reviewed:
  - {sentence: "Ma trận X có ba cột, cột số 1, cột x, và cột x bình phương.", reason: "ASR chép “ma trận ít có 3 cục, cục số 1, cục ít và cục ít bình phương.” (0.75): lệch âm/thanh thuần Việt: cột cột/cục cục, cột/cục, cột/cục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì thế ta dùng lại đúng phương trình chuẩn, chỉ đổi các cột của X.", reason: "ASR chép “Vì thế ta dùng lại đúng phương trình chuẩn, chỉ đổi các cột cuối.” (0.897): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: của (trong “của x” → “cuối”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mô hình vẫn là tổng các cột nhân trọng số, tức là tuyến tính theo w.", reason: "ASR chép “Mô hình vẫn là tổng các cột nhân trọng số, tức là tuyến tính theo v kết.” (0.941): chữ w đọc “vê kép” (luật chung), ASR viết tách chữ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kẻ một đường thẳng “vừa nhất” qua 4 điểm"
    steps:
      - show: |
          <p class="big">4 căn phòng: diện tích (chục m²) 1, 2, 3, 4 — tiền thuê (triệu) 2, 3, 5, 6.</p>
          <div class="box key">Không đường thẳng nào đi qua cả 4 điểm. Đường nào “vừa nhất”? Và tìm nó bằng <b>một công thức</b>, không cần dò?</div>
        focus: [1, 2, 2]
        say: "Chào bạn, có 4 căn phòng với diện tích 1, 2, 3, 4 chục mét vuông, và tiền thuê 2, 3, 5, 6 triệu. Không đường thẳng nào đi qua cả 4 điểm. Vậy đường nào vừa nhất, và có tìm được bằng một công thức không?"
      - show: |
          <p class="note">Hôm nay: mô hình tuyến tính → hàm sai số MSE → gradient → phương trình chuẩn (giải bằng khử Gauss) → đường $\hat{y} = 1{,}4x + 0{,}5$.</p>
        say: "Hôm nay ta học hồi quy tuyến tính. Ta viết mô hình, đo sai số, lấy gradient, rồi giải một hệ phương trình để ra đáp án, đường thẳng 1 phẩy 4 x cộng 0 phẩy 5."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: độ dài bình phương, gradient, quy tắc chuỗi"
    checks:
      - "(lambda b, w1: [sp.diff(2 - (b + 1*w1), v) for v in (b, w1)] == [-1, -1])(*sp.symbols('b w1'))"
    steps:
      - show: |
          <p>Bài 1: $\lVert\mathbf{r}\rVert^2 = \mathbf{r}^T\mathbf{r} = r_1^2 + r_2^2 + \dots$ (tổng bình phương các thành phần).</p>
          <p>Bài 6, 8: gradient $\nabla f$ gom các đạo hàm riêng; ở điểm cực tiểu, $\nabla f = \mathbf{0}$.</p>
          <p>Bài 7: quy tắc chuỗi — gradient của hàm lồng = (gradient hàm ngoài) nhân (ma trận Jacobian của hàm trong).</p>
        introduces: [zero_vec]
        focus: [1, 2, 3]
        say: "Nhắc lại bài 1, độ dài bình phương của vector r bằng r chuyển vị nhân r, tức tổng bình phương các thành phần. Theo bài 6 và bài 8, ở điểm cực tiểu thì gradient bằng vector không. Theo bài 7, đạo hàm hàm lồng bằng đạo hàm hàm ngoài nhân ma trận Jacobian của hàm trong."
      - show: |
          <p>Nhắc lại từ đầu: khi một hàm cho ra nhiều con số, <b>ma trận Jacobian</b> gom mọi đạo hàm riêng của nó — hàng $i$ là đạo hàm của đầu ra thứ $i$ theo từng biến.</p>
          $$r_1 = 2 - (b + 1\cdot w_1): \qquad \frac{\partial r_1}{\partial b} = -1, \quad \frac{\partial r_1}{\partial w_1} = -1 \quad \implies \text{hàng đầu của Jacobian} = (-1;\ -1)$$
        focus: [1, 2, 2]
        say: "Nhắc lại từ đầu, khi một hàm cho ra nhiều con số, ma trận Jacobian gom mọi đạo hàm riêng của nó, hàng thứ i là đạo hàm của đầu ra thứ i theo từng biến. Ví dụ r một bằng 2 trừ b trừ 1 nhân w một. Đạo hàm theo b bằng âm 1, đạo hàm theo w một cũng bằng âm 1, nên hàng đầu của Jacobian là âm 1, âm 1."

  # ───────────────────────── 3. MÔ HÌNH ─────────────────────────
  - id: model
    kind: symbol
    title: "Giải mã: ŷ = Xw — gộp b vào w bằng cột số 1"
    checks:
      - "Matrix([[1, 1], [1, 2], [1, 3], [1, 4]])*Matrix([Rational(1, 2), Rational(7, 5)]) == Matrix([Rational(19, 10), Rational(33, 10), Rational(47, 10), Rational(61, 10)])"
    steps:
      - show: |
          <p>Một mẫu: $\hat{y} = w_1 x + b$ (nhiều đặc trưng: $\hat{y} = \mathbf{w}^T\mathbf{x} + b$). Thêm số 1 vào đầu mỗi mẫu:</p>
          $$\hat{y} = b\cdot 1 + w_1\cdot x$$
          <div class="box key">$\hat{\mathbf{y}} = \mathbf{X}\mathbf{w}$, &nbsp; $\mathbf{X} = \begin{bmatrix} 1 & 1 \\ 1 & 2 \\ 1 & 3 \\ 1 & 4 \end{bmatrix}$ (mỗi hàng một căn phòng, cột đầu toàn số 1), &nbsp; $\mathbf{w} = \begin{bmatrix} b \\ w_1 \end{bmatrix}$</div>
        focus: ["1.1", 2, 3]
        say: "Với một căn phòng, dự đoán bằng w một nhân x cộng b. Mẹo là thêm số 1 vào đầu mỗi mẫu, vì b nhân 1 vẫn là b. Khi đó cả 4 dự đoán gom thành một phép nhân ma trận, X nhân w, với cột đầu của X toàn số 1."
      - show: |
          <p>Ví dụ $\mathbf{w} = (0{,}5;\ 1{,}4)$: &nbsp; $\hat{\mathbf{y}} = \mathbf{X}\mathbf{w} = (1{,}9;\ 3{,}3;\ 4{,}7;\ 6{,}1)$ &nbsp; so với $\mathbf{y} = (2;\ 3;\ 5;\ 6)$</p>
        say: "Ví dụ với b bằng 0 phẩy 5 và w một bằng 1 phẩy 4. Phép nhân ma trận cho bốn dự đoán 1 phẩy 9, 3 phẩy 3, 4 phẩy 7 và 6 phẩy 1, khá gần giá thật."

  # ───────────────────────── 4. MSE ─────────────────────────
  - id: mse
    kind: concept
    title: "Hàm sai số MSE: trung bình bình phương sai lệch"
    checks:
      - "(lambda r: sum(v**2 for v in r) / 4)([Rational(1, 10), -Rational(3, 10), Rational(3, 10), -Rational(1, 10)]) == Rational(1, 20)"
      - "(lambda r: Rational(sum(v**2 for v in r), 4))([2 - 1, 3 - 2, 5 - 3, 6 - 4]) == Rational(5, 2)"
    steps:
      - show: |
          <div class="box key">$\operatorname{MSE}(\mathbf{w}) = \dfrac{1}{N}\lVert\mathbf{y} - \mathbf{X}\mathbf{w}\rVert^2 = \dfrac{1}{N}\sum_{i}(y_i - \hat{y}_i)^2$</div>
          <table class="t"><tr><th>$\mathbf{w} = (b;\ w_1)$</th><th>sai lệch $\mathbf{y} - \hat{\mathbf{y}}$</th><th>MSE</th></tr>
          <tr><td>(0; 1)</td><td>1; 1; 2; 2</td><td>2,5</td></tr>
          <tr><td>(0,5; 1,4)</td><td>0,1; −0,3; 0,3; −0,1</td><td>$\hlg{0{,}05}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Hàm sai số trung bình bình phương lấy sai lệch của từng mẫu, bình phương lên, rồi lấy trung bình. Với đường y bằng x, sai số là 2 phẩy 5. Với đường 1 phẩy 4 x cộng 0 phẩy 5, sai số chỉ còn 0 phẩy 05."
      - show: |
          <p class="note">Vì sao bình phương? Sai lệch âm và dương không triệt tiêu nhau; hàm trơn, lấy đạo hàm được; và bài 17: nếu các sai lệch độc lập, cùng một phân phối chuẩn tâm 0 thì cực tiểu MSE chính là ước lượng hợp lý cực đại.</p>
          <p class="note">Sách hay viết $L(\mathbf{w})$ và $\lVert\cdot\rVert_2^2$: đó là MSE và độ dài bình phương ở đây. Chữ L ở bài 12, 17 là khả năng, nên bài này viết MSE.</p>
        notation_note: true
        focus: [1, 1, 1]
        say: "Vì sao bình phương? Sai lệch âm và dương không triệt tiêu nhau, và hàm trơn nên lấy đạo hàm được. Thêm nữa, theo bài 17, nếu các sai lệch độc lập và cùng một phân phối chuẩn tâm 0 thì làm nhỏ sai số này chính là ước lượng hợp lý cực đại."

  - id: resid_pic
    kind: intuition
    title: "Nhìn thấy sai số: các đoạn đỏ dọc"
    checks:
      - "[y - (Rational(7, 5)*x + Rational(1, 2)) for x, y in [(1, 2), (2, 3), (3, 5), (4, 6)]] == [Rational(1, 10), -Rational(3, 10), Rational(3, 10), -Rational(1, 10)]"
      - "(lambda r: [v**2 for v in r] == [Rational(1, 100), Rational(9, 100), Rational(9, 100), Rational(1, 100)] and sum(v**2 for v in r) == Rational(1, 5) and sum(v**2 for v in r)/4 == Rational(1, 20))([Rational(1, 10), -Rational(3, 10), Rational(3, 10), -Rational(1, 10)])"
      - "[Rational(7, 5)*x + Rational(1, 2) for x in (1, 2, 3, 4)] == [Rational(19, 10), Rational(33, 10), Rational(47, 10), Rational(61, 10)]"
    steps:
      - show: |
          <svg width="1000" height="450" viewBox="0 0 1000 450"><line x1="120" y1="410" x2="920" y2="410" stroke="#9ca3af" stroke-width="2"/><line x1="140" y1="410" x2="140" y2="20" stroke="#9ca3af" stroke-width="2"/><line x1="191" y1="393.5" x2="888" y2="168.0" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/><line x1="191" y1="359.4" x2="888" y2="43.7" stroke="#059669" stroke-width="4"/><line x1="310" y1="300.0" x2="310" y2="305.5" stroke="#b91c1c" stroke-width="5"/><circle cx="310" cy="300.0" r="9" fill="#2563eb"/><text x="294" y="290" font-size="22" text-anchor="end" fill="#b91c1c">+0,1</text><line x1="480" y1="245.0" x2="480" y2="228.5" stroke="#b91c1c" stroke-width="5"/><circle cx="480" cy="245.0" r="9" fill="#2563eb"/><text x="496" y="242" font-size="22" text-anchor="start" fill="#b91c1c">−0,3</text><line x1="650" y1="135.0" x2="650" y2="151.5" stroke="#b91c1c" stroke-width="5"/><circle cx="650" cy="135.0" r="9" fill="#2563eb"/><text x="634" y="140" font-size="22" text-anchor="end" fill="#b91c1c">+0,3</text><line x1="820" y1="80.0" x2="820" y2="74.5" stroke="#b91c1c" stroke-width="5"/><circle cx="820" cy="80.0" r="9" fill="#2563eb"/><text x="836" y="94" font-size="22" text-anchor="start" fill="#b91c1c">−0,1</text><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="310" y="440">1</text><text x="480" y="440">2</text><text x="650" y="440">3</text><text x="820" y="440">4</text></g><g font-size="22" fill="#1f2937" text-anchor="end"><text x="128" y="308">2</text><text x="128" y="198">4</text><text x="128" y="88">6</text></g><text x="905" y="398" font-size="22" text-anchor="end" fill="#1f2937">diện tích x</text><text x="170" y="40" font-size="22" fill="#059669">đường liền: ŷ = 1,4x + 0,5 (MSE 0,05)</text><text x="170" y="70" font-size="22" fill="#6b7280">đường đứt: ŷ = x (MSE 2,5)</text><text x="170" y="100" font-size="22" fill="#b91c1c">đoạn đỏ: sai lệch y − ŷ</text></svg>
        say: "Hình này đặt 4 căn phòng thành 4 chấm xanh dương, trục ngang là diện tích, trục dọc là tiền thuê. Đường liền màu lục là dự đoán 1 phẩy 4 x cộng 0 phẩy 5, đường đứt màu xám là dự đoán y bằng x. Mỗi đoạn đỏ dọc nối giá thật với giá dự đoán, độ dài của nó chính là sai lệch của căn phòng đó. Hàm sai số chỉ làm một việc, bình phương bốn đoạn đỏ rồi lấy trung bình, nên đường nào có các đoạn đỏ ngắn hơn thì vừa hơn."
      - clear: true
        show: |
          <table class="t"><tr><th>căn</th><th>$y$</th><th>$\hat{y}$</th><th>$y - \hat{y}$</th><th>$(y - \hat{y})^2$</th></tr>
          <tr><td>1</td><td>2</td><td>1,9</td><td>0,1</td><td>0,01</td></tr>
          <tr><td>2</td><td>3</td><td>3,3</td><td>−0,3</td><td>0,09</td></tr>
          <tr><td>3</td><td>5</td><td>4,7</td><td>0,3</td><td>0,09</td></tr>
          <tr><td>4</td><td>6</td><td>6,1</td><td>−0,1</td><td>0,01</td></tr></table>
          $$\operatorname{MSE} = \frac{0{,}01 + 0{,}09 + 0{,}09 + 0{,}01}{4} = \frac{0{,}2}{4} = \hlg{0{,}05}$$
        focus: [1, 1, 2]
        say: "Làm thử bằng số với đường màu lục. Bốn đoạn đỏ dài 0 phẩy 1, 0 phẩy 3, 0 phẩy 3 và 0 phẩy 1, dấu âm chỉ nói chấm nằm dưới đường. Bình phương lên được 0 phẩy 01, 0 phẩy 09, 0 phẩy 09, 0 phẩy 01, cộng lại 0 phẩy 2, chia 4 được 0 phẩy 05, khớp với sai số 0 phẩy 05 của đường này."

  # ───────────────────────── 5. GRADIENT ─────────────────────────
  - id: gradient
    kind: formula
    title: "Gradient của MSE bằng quy tắc chuỗi"
    checks:
      - "(lambda w0, w1: [sp.diff(sum((yy - (w0 + w1*xx))**2 for xx, yy in zip([1, 2, 3, 4], [2, 3, 5, 6]))/4, v) for v in (w0, w1)] == [sp.expand(e) for e in (-Rational(2, 4)*(Matrix([[1, 1], [1, 2], [1, 3], [1, 4]]).T*(Matrix([2, 3, 5, 6]) - Matrix([[1, 1], [1, 2], [1, 3], [1, 4]])*Matrix([w0, w1]))))])(*sp.symbols('w0 w1'))"
      - "(-Rational(2, 4)*Matrix([[1, 1], [1, 2], [1, 3], [1, 4]]).T*Matrix([2, 3, 5, 6])) == Matrix([-8, -Rational(47, 2)])"
    steps:
      - show: |
          <p>Đặt $\mathbf{r} = \mathbf{y} - \mathbf{X}\mathbf{w}$ (hàm trong), $\ \operatorname{MSE} = \frac{1}{N}\mathbf{r}^T\mathbf{r}$ (hàm ngoài).</p>
          <p>Gradient hàm ngoài theo $\mathbf{r}$: $\frac{2}{N}\mathbf{r}^T$. &nbsp; Jacobian của $\mathbf{r}$ theo $\mathbf{w}$: $-\mathbf{X}$ (vì $\mathbf{y}$ không chứa $\mathbf{w}$).</p>
          $$\nabla\operatorname{MSE}(\mathbf{w}) = -\frac{2}{N}\mathbf{X}^T(\mathbf{y} - \mathbf{X}\mathbf{w})$$
        focus: ["1.1", "1.2", "2.5", 3]
        say: "Đặt r là sai lệch, hàm trong. Sai số bằng r chuyển vị nhân r chia N, hàm ngoài, có đạo hàm là hai phần N nhân r. Jacobian của r theo w là âm X, vì y không chứa w. Theo quy tắc chuỗi của bài 7, nhân hai phần lại, ta được gradient trên màn hình."
      - show: |
          <p><b>Làm thử ngay</b> tại $\mathbf{w} = \mathbf{0}$: $\ -\frac{2}{4}\mathbf{X}^T\mathbf{y} = -\frac{1}{2}\begin{bmatrix} 16 \\ 47 \end{bmatrix} = \begin{bmatrix} -8 \\ -23{,}5 \end{bmatrix}$ — âm, nên tăng $b$ và $w_1$ thì sai số giảm.</p>
          <p class="note">Máy kiểm: lấy đạo hàm riêng từng biến của tổng 4 bình phương cho đúng cùng kết quả.</p>
        focus: ["1.2", "1.3", "1.3"]
        say: "Làm thử ngay tại w bằng vector không. X chuyển vị nhân y bằng 16 và 47, nên gradient bằng âm 8 và âm 23 phẩy 5. Gradient âm nghĩa là tăng b và w một thì sai số giảm, đúng như trực giác."

  # ───────────────────────── 6. PHƯƠNG TRÌNH CHUẨN ─────────────────────────
  - id: normal_eq
    kind: formula
    title: "Phương trình chuẩn — một hệ phương trình tuyến tính"
    checks:
      - "Matrix([[1, 1], [1, 2], [1, 3], [1, 4]]).T*Matrix([[1, 1], [1, 2], [1, 3], [1, 4]]) == Matrix([[4, 10], [10, 30]]) and Matrix([[1, 1], [1, 2], [1, 3], [1, 4]]).T*Matrix([2, 3, 5, 6]) == Matrix([16, 47])"
      - "Matrix([[4, 10], [10, 30]]).solve(Matrix([16, 47])) == Matrix([Rational(1, 2), Rational(7, 5)]) and 47 - Rational(5, 2)*16 == 7 and 30 - Rational(5, 2)*10 == 5"
    steps:
      - show: |
          <p>Cực tiểu: gradient bằng $\mathbf{0}$ (bài 8; MSE là hàm lồi nên điểm dừng nào cũng là cực tiểu, bài 11) $\implies \mathbf{X}^T(\mathbf{y} - \mathbf{X}\mathbf{w}) = \mathbf{0}$, chuyển vế:</p>
          $$\mathbf{X}^T\mathbf{X}\,\mathbf{w} = \mathbf{X}^T\mathbf{y}$$
          <p class="note"><b>Phương trình chuẩn</b>: một hệ phương trình tuyến tính (bài 3).</p>
          <p>Ở đây: $\ \mathbf{X}^T\mathbf{X} = \begin{bmatrix} 4 & 10 \\ 10 & 30 \end{bmatrix}$, &nbsp; $\mathbf{X}^T\mathbf{y} = \begin{bmatrix} 16 \\ 47 \end{bmatrix}$</p>
        focus: [1, 2, [3, 4]]
        say: "Theo bài 8, ở cực tiểu thì gradient bằng không, và vì sai số này là hàm lồi như bài 11, chỗ nào gradient bằng không cũng là cực tiểu. Bỏ hằng số phía trước rồi chuyển vế, ta được phương trình chuẩn, X chuyển vị X nhân w bằng X chuyển vị y. Đây chỉ là một hệ phương trình tuyến tính như bài 3."
      - show: |
          <p>Khử Gauss (bài 3): $\ \left[\begin{array}{cc|c} 4 & 10 & 16 \\ 10 & 30 & 47 \end{array}\right] \xrightarrow{\text{hàng 2} - 2{,}5\cdot\text{hàng 1}} \left[\begin{array}{cc|c} 4 & 10 & 16 \\ 0 & 5 & 7 \end{array}\right]$</p>
          <p>$5w_1 = 7 \implies w_1 = 1{,}4$; &nbsp; $4b + 10\cdot 1{,}4 = 16 \implies b = 0{,}5$ &nbsp; ⟹ &nbsp; $\hat{y} = \hlg{1{,}4x + 0{,}5}$</p>
        focus: [1, [1, "2.1"], "2.2", "2.3"]
        say: "Giải bằng phép khử của bài 3, tức là trừ một bội của hàng này khỏi hàng kia để tạo số 0. Lấy hàng hai trừ 2 phẩy 5 lần hàng một, được 5 w một bằng 7, nên w một bằng 1 phẩy 4. Thay ngược lên hàng một, b bằng 0 phẩy 5. Đó là đường thẳng vừa nhất."

  # ───────────────────────── 7. NGHIỆM ĐÓNG ─────────────────────────
  - id: closed_form
    kind: formula
    title: "Nghiệm đóng và khi nào dùng được"
    checks:
      - "Matrix([[4, 10], [10, 30]]).det() == 20 and Matrix([[4, 10], [10, 30]]).inv()*Matrix([16, 47]) == Matrix([Rational(1, 2), Rational(7, 5)])"
      - "(lambda D: (D.T*D).det() == 0 and (D.T*D).rank() == 2)(Matrix([[1, 1, 1], [1, 2, 2], [1, 3, 3], [1, 4, 4]]))"
    steps:
      - show: |
          <p>Nếu $\mathbf{X}^T\mathbf{X}$ <b>khả nghịch</b>, nhân hai vế với nghịch đảo (bài 2):</p>
          $$\mathbf{w}^* = (\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$$
          <p>Ở đây $\det = 4\cdot 30 - 10\cdot 10 = 20 \neq 0$, nghịch đảo tồn tại và cho cùng $(0{,}5;\ 1{,}4)$.</p>
        introduces: [neq]
        focus: [1, 2, 3]
        say: "Nếu X chuyển vị X khả nghịch, tức có một ma trận nghịch đảo nhân vào cho ra ma trận đơn vị, ta nhân hai vế với nghịch đảo đó. Kết quả là công thức nghiệm đóng như trên bảng. Ở đây định thức bằng 4 nhân 30 trừ 10 nhân 10, bằng 20, khác 0, nên công thức cho cùng đáp án."
      - show: |
          <p class="note">Khi nào <b>không</b> khả nghịch? Hai cột trùng nhau, ví dụ cùng diện tích ghi hai lần: $\mathbf{X}^T\mathbf{X}$ cỡ $\sz{3}{3}$ nhưng hạng chỉ 2, $\det = 0$.</p>
          <p class="note">Phương trình chuẩn <b>vẫn có nghiệm</b> (vô số nghiệm), chỉ công thức có nghịch đảo là hỏng.</p>
        focus: [1, 1, "1.4", 2, 2]
        say: "Khi nào không khả nghịch? Ví dụ hai cột trùng nhau, như ghi diện tích hai lần. Khi đó hạng nhỏ hơn số cột và định thức bằng 0. Dù vậy, phương trình chuẩn vẫn luôn có nghiệm, vì luôn có một đường làm sai số nhỏ nhất, và ở đây có vô số nghiệm như thế. Chỉ công thức có nghịch đảo là hỏng."

  # ───────────────────────── 8. HỒI QUY ĐA THỨC ─────────────────────────
  - id: poly
    kind: example
    title: "Ví dụ: hồi quy đa thức vẫn là tuyến tính theo w"
    checks:
      - "(lambda P, y: (P.T*P).solve(P.T*y) == Matrix([0, 0, 1]))(Matrix([[1, -1, 1], [1, 0, 0], [1, 1, 1], [1, 2, 4]]), Matrix([1, 0, 1, 4]))"
      - "(lambda P: P.T*P == Matrix([[4, 2, 6], [2, 6, 8], [6, 8, 18]]))(Matrix([[1, -1, 1], [1, 0, 0], [1, 1, 1], [1, 2, 4]]))"
      - "[sum(x**k for x in (-1, 0, 1, 2)) for k in (1, 2, 3, 4)] == [2, 6, 8, 18]"
      - "(lambda P, y: P.T*y == Matrix([6, 8, 18]) and [sum(y), sum(a*b for a, b in zip((-1, 0, 1, 2), y)), sum(a*a*b for a, b in zip((-1, 0, 1, 2), y))] == [6, 8, 18])(Matrix([[1, -1, 1], [1, 0, 0], [1, 1, 1], [1, 2, 4]]), Matrix([1, 0, 1, 4]))"
      - "Matrix([[4, 2, 6], [2, 6, 8], [6, 8, 18]])*Matrix([0, 0, 1]) == Matrix([6, 8, 18]) and Matrix([[4, 2, 6], [2, 6, 8], [6, 8, 18]]).det() == 80"
      - "Matrix([[1, -1, 1], [1, 0, 0], [1, 1, 1], [1, 2, 4]])*Matrix([0, 0, 1]) == Matrix([1, 0, 1, 4])"
    steps:
      - show: |
          <p>Dữ liệu cong: $x = -1, 0, 1, 2$; &nbsp; $y = 1, 0, 1, 4$. Dùng các cột $1,\ x,\ x^2$ (sách hay viết $f(x;\mathbf{w}) = \mathbf{w}^T\phi(x)$):</p>
          $$\mathbf{X} = \begin{bmatrix} 1 & -1 & 1 \\ 1 & 0 & 0 \\ 1 & 1 & 1 \\ 1 & 2 & 4 \end{bmatrix}, \qquad \mathbf{y} = \begin{bmatrix} 1 \\ 0 \\ 1 \\ 4 \end{bmatrix}$$
        introduces: [phi]
        focus: [1, "1.3", 2]
        say: "Với dữ liệu cong, x bằng âm 1, 0, 1, 2 và y bằng 1, 0, 1, 4, ta thêm cột x bình phương. Sách hay viết mô hình này với chữ phi, nghĩa là các cột ta tự chọn từ x. Ma trận X có ba cột, cột số 1, cột x, và cột x bình phương."
      - show: |
          <p><b>Bước 1.</b> Mỗi ô của $\mathbf{X}^T\mathbf{X}$ là tổng tích của hai cột:</p>
          $$\mathbf{X}^T\mathbf{X} = \begin{bmatrix} 4 & \sum x & \sum x^2 \\ \sum x & \sum x^2 & \sum x^3 \\ \sum x^2 & \sum x^3 & \sum x^4 \end{bmatrix} = \begin{bmatrix} 4 & 2 & 6 \\ 2 & 6 & 8 \\ 6 & 8 & 18 \end{bmatrix}$$
        focus: [1, 2, 2]
        say: "Bước một, mỗi ô của X chuyển vị X là tổng tích của hai cột. Góc trên là số mẫu, 4, rồi tổng x bằng 2, tổng x bình phương bằng 6. Tổng x mũ 3 bằng âm 1 cộng 1 cộng 8, bằng 8, và tổng x mũ 4 bằng 18."
      - clear: true
        show: |
          <p><b>Bước 2.</b> Mỗi ô của $\mathbf{X}^T\mathbf{y}$ là tổng tích một cột với $\mathbf{y}$ (dữ liệu $x = -1, 0, 1, 2$; $y = 1, 0, 1, 4$):</p>
          $$\mathbf{X}^T\mathbf{y} = \begin{bmatrix} \sum y \\ \sum x y \\ \sum x^2 y \end{bmatrix} = \begin{bmatrix} 1 + 0 + 1 + 4 \\ -1 + 0 + 1 + 8 \\ 1 + 0 + 1 + 16 \end{bmatrix} = \begin{bmatrix} 6 \\ 8 \\ 18 \end{bmatrix}$$
        focus: [1, 2]
        say: "Bước hai, mỗi ô của X chuyển vị y là tổng tích một cột với y. Ta được tổng y bằng 6, tổng x nhân y bằng 8, và tổng x bình phương nhân y bằng 18."
      - show: |
          <p><b>Bước 3.</b> Cột thứ ba của $\mathbf{X}^T\mathbf{X}$ trùng với $\mathbf{X}^T\mathbf{y}$, nên thử $\mathbf{w} = (0;\ 0;\ 1)$:</p>
          $$\begin{bmatrix} 4 & 2 & 6 \\ 2 & 6 & 8 \\ 6 & 8 & 18 \end{bmatrix}\begin{bmatrix} 0 \\ 0 \\ 1 \end{bmatrix} = \begin{bmatrix} 6 \\ 8 \\ 18 \end{bmatrix} \ \checkmark \qquad \det = 80 \neq 0$$
        focus: [1, 2, 2]
        say: "Bước ba, thay vì khử ba ẩn, ta để ý cột thứ ba của X chuyển vị X trùng với X chuyển vị y. Vậy w bằng 0, 0, 1 thoả phương trình chuẩn, vì nhân ma trận với vector này chỉ lấy ra cột thứ ba. Định thức bằng 80, khác 0, nên đây là nghiệm duy nhất."
      - clear: true
        show: |
          <p><b>Bước 4.</b> $\hat{y} = \hlg{x^2}$ tại $x = -1, 0, 1, 2$ cho $1, 0, 1, 4$ — trùng cả 4 giá trị $y = 1, 0, 1, 4$, sai số bằng 0.</p>
          <div class="box key">Đường cong theo $x$, nhưng vẫn <b>tuyến tính theo</b> $\mathbf{w}$ — cùng công thức, chỉ đổi các cột của $\mathbf{X}$.</div>
        focus: [1, 2, 2]
        say: "Bước bốn, đường y bằng x bình phương cho 1, 0, 1, 4, trùng đúng cả 4 giá trị y. Mô hình vẫn là tổng các cột nhân trọng số, tức là tuyến tính theo w. Vì thế ta dùng lại đúng phương trình chuẩn, chỉ đổi các cột của X."

  # ───────────────────────── 9. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: thư viện và gradient descent cho cùng đáp án"
    checks:
      - "(lambda X, y: np.allclose(np.linalg.lstsq(X, y, rcond=None)[0], [0.5, 1.4]))(np.c_[np.ones(4), [1, 2, 3, 4.]], np.array([2, 3, 5, 6.]))"
      - "(lambda X, y: (lambda w: np.allclose(w, [0.5, 1.4], atol=1e-6))(__import__('functools').reduce(lambda w, _: w + 0.05*(2/4)*X.T@(y - X@w), range(2000), np.zeros(2))))(np.c_[np.ones(4), [1, 2, 3, 4.]], np.array([2, 3, 5, 6.]))"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác</th><th>kết quả $(b;\ w_1)$</th></tr>
          <tr><td>① hàm bình phương nhỏ nhất của numpy (<code>np.linalg.lstsq</code>)</td><td>$(0{,}5;\ 1{,}4)$ $\checkmark$</td></tr>
          <tr><td>② gradient descent (bài 9), tốc độ học 0,05, 2000 bước từ $\mathbf{w} = \mathbf{0}$</td><td>$(0{,}5;\ 1{,}4)$ $\checkmark$</td></tr></table>
          <p class="note">Khi số đặc trưng rất lớn, giải hệ tốn kém — người ta dùng gradient descent (bài 9) với chính gradient vừa tìm.</p>
        focus: [0, "1.2", "1.3"]
        say: "Phép thử, vì có nhiều cách giải nên ta so cả hai. Hàm bình phương nhỏ nhất của thư viện cho 0 phẩy 5 và 1 phẩy 4. Gradient descent của bài 9, chạy 2000 bước với gradient vừa tìm, cũng dừng đúng ở đó."

  # ───────────────────────── 10. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Hồi quy tuyến tính trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>ở đâu</th><th>dùng thế nào</th></tr>
          <tr><td>thực tế</td><td>dự đoán giá nhà, doanh thu, nhiệt độ: một con số từ nhiều đặc trưng</td></tr>
          <tr><td><b>Bài 19</b></td><td>đa thức bậc cao khớp quá sát dữ liệu huấn luyện — cần phạt độ lớn của $\mathbf{w}$</td></tr>
          <tr><td><b>Bài 20</b></td><td>đổi đầu ra thành xác suất để phân loại, và đổi hàm sai số</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3", "1.4"]
        say: "Hồi quy tuyến tính dùng để dự đoán giá nhà, doanh thu, nhiệt độ. Ở bài 19, ta thấy đa thức bậc cao có thể khớp quá sát dữ liệu, và cần phạt độ lớn của w. Ở bài 20, ta đổi đầu ra thành xác suất để phân loại."

  # ───────────────────────── 11. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "Rational(sum(a * b for a, b in zip([1, 2, 3, 4], [2, 3, 5, 6])), sum(a * a for a in [1, 2, 3, 4])) == Rational(47, 30) and round(47/30, 3) == 1.567 and round(sum((yy - 47/30*xx)**2 for xx, yy in zip([1, 2, 3, 4], [2, 3, 5, 6]))/4, 4) == 0.0917"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên cột số 1 (bỏ $b$) <b class="red">(sai)</b>
          <br><span class="note">Đường bị ép đi qua gốc toạ độ: $w_1 \approx 1{,}567$, MSE $\approx 0{,}0917$ — gần gấp đôi 0,05.</span></div>
        say: "Lỗi thứ nhất, quên cột số 1. Đường thẳng bị ép đi qua gốc toạ độ, và sai số tăng lên 0 phẩy 0917, gần gấp đôi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng công thức có nghịch đảo khi $\mathbf{X}^T\mathbf{X}$ không khả nghịch <b class="red">(sai)</b>
          <br><span class="note">Cột trùng nhau làm $\det = 0$. Kiểm tra hạng và bỏ cột trùng trước khi dùng công thức.</span></div>
        say: "Lỗi thứ hai, dùng công thức có nghịch đảo khi ma trận không khả nghịch, ví dụ khi có cột trùng nhau. Hãy kiểm tra hạng của ma trận, và bỏ đi các cột trùng nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tính nghịch đảo thật rồi mới nhân <b class="red">(chậm, kém chính xác)</b>
          <br><span class="note">Trong máy tính, hãy <b>giải hệ</b> $\mathbf{X}^T\mathbf{X}\mathbf{w} = \mathbf{X}^T\mathbf{y}$ (khử Gauss, hàm giải hệ) thay vì lập $(\mathbf{X}^T\mathbf{X})^{-1}$ — như bài 3 đã đếm: nghịch đảo tốn công hơn khử.</span></div>
        say: "Lỗi thứ ba, tính nghịch đảo thật rồi mới nhân. Như bài 3 đã cho thấy, tìm nghịch đảo tốn công hơn phép khử, nên trong máy tính hãy giải hệ phương trình trực tiếp."

  # ───────────────────────── 12. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda X: X.T*X == Matrix([[3, 3], [3, 5]]) and X.T*Matrix([1, 3, 5]) == Matrix([9, 13]) and (X.T*X).solve(X.T*Matrix([1, 3, 5])) == Matrix([1, 2]))(Matrix([[1, 0], [1, 1], [1, 2]]))"
      - "sum((yy - xx)**2 for xx, yy in zip([1, 2, 3, 4], [2, 3, 5, 6])) / 4 == 2.5"
      - "[0 + 1 + 2, 0 + 1 + 4, 1 + 3 + 5, 0*1 + 1*3 + 2*5] == [3, 5, 9, 13] and 13 - 9 == 4 and 5 - 3 == 2 and 3*1 + 3*2 == 9"
      - "[2*x + 1 for x in (0, 1, 2)] == [1, 3, 5] and Rational(5, 2) / Rational(1, 20) == 50"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ba điểm $(0; 1)$, $(1; 3)$, $(2; 5)$. Viết $\mathbf{X}$ (có cột số 1) và tính $\mathbf{X}^T\mathbf{X}$, $\mathbf{X}^T\mathbf{y}$.</td></tr>
          <tr><td>2</td><td>Giải phương trình chuẩn của câu 1.</td></tr>
          <tr><td>3</td><td>Với 4 căn phòng ở đầu bài, MSE của đường $\hat{y} = x$ là bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một lập ma trận. Câu hai giải phương trình chuẩn. Câu ba tính sai số của một đường thẳng. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Cột số 1 và cột $x = 0, 1, 2$; &nbsp; $\mathbf{y} = (1;\ 3;\ 5)$:</p>
          $$\mathbf{X} = \begin{bmatrix} 1 & 0 \\ 1 & 1 \\ 1 & 2 \end{bmatrix}, \quad \mathbf{X}^T\mathbf{X} = \begin{bmatrix} 3 & 0 + 1 + 2 \\ 0 + 1 + 2 & 0 + 1 + 4 \end{bmatrix} = \hlg{\begin{bmatrix} 3 & 3 \\ 3 & 5 \end{bmatrix}}$$
          $$\mathbf{X}^T\mathbf{y} = \begin{bmatrix} 1 + 3 + 5 \\ 0 + 3 + 10 \end{bmatrix} = \hlg{\begin{bmatrix} 9 \\ 13 \end{bmatrix}}$$
        focus: [1, 2, 3]
        say: "Đáp án câu một, X có cột số 1 và cột x là 0, 1, 2. X chuyển vị X có góc trên là số mẫu 3, hai ô còn lại của hàng đầu và cột đầu là tổng x bằng 3, góc dưới là tổng x bình phương bằng 5. X chuyển vị y gồm tổng y bằng 9, và tổng x nhân y, 0 cộng 3 cộng 10, bằng 13."
      - show: |
          <p>② Khử Gauss, lấy hàng 2 trừ hàng 1:</p>
          $$\left[\begin{array}{cc|c} 3 & 3 & 9 \\ 3 & 5 & 13 \end{array}\right] \xrightarrow{\text{hàng 2} - \text{hàng 1}} \left[\begin{array}{cc|c} 3 & 3 & 9 \\ 0 & 2 & 4 \end{array}\right]$$
          <p>$2w_1 = 4 \implies w_1 = \hlg{2}$; &nbsp; $3b + 3\cdot 2 = 9 \implies b = \hlg{1}$ &nbsp; → &nbsp; $\hat{y} = 2x + 1$ cho đúng 1, 3, 5.</p>
        focus: [[1, 2], "3.1", "3.2", "3.3"]
        say: "Câu hai, khử bằng cách lấy hàng hai trừ hàng một, được 2 w một bằng 4. Vậy w một bằng 2. Thay ngược lên hàng một, 3 b cộng 6 bằng 9, nên b bằng 1. Đường 2 x cộng 1 cho đúng 1, 3, 5, đi qua cả ba điểm."
      - clear: true
        show: |
          <p>③ Đường $\hat{y} = x$ trên 4 căn phòng, sai lệch $2 - 1,\ 3 - 2,\ 5 - 3,\ 6 - 4$:</p>
          $$\operatorname{MSE} = \frac{1^2 + 1^2 + 2^2 + 2^2}{4} = \frac{10}{4} = \hlg{2{,}5}$$
          <p class="note">Gấp 50 lần sai số 0,05 của đường $1{,}4x + 0{,}5$ — trong hình, đường đứt nằm xa các chấm hơn hẳn.</p>
        focus: [1, 2, 3]
