id: L30
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 30 — Mô hình hỗn hợp Gauss (GMM) & thuật toán EM"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "DC23#Ch5 (GMM, EM)"
assumes: [cdot, sub, sub2, sum, prod, mu, sigma, normal, exp, log, pi, sqrt, approx, implies, prob, given, power, geq]
# Quy ước ký hiệu: một chiều cho dễ nhìn; K cụm, cụm k có trọng số trộn wₖ (KHÔNG dùng πₖ như nhiều sách — π đã là 3,14 trong công
#   thức mật độ; KHÔNG in đậm — khác vector trọng số của bài 18–25; nói ở notation_note), trung bình μₖ, phương sai σₖ²; mật độ chuẩn
#   của cụm k viết fₖ(x) (như f(x) của bài 14); độ “thuộc về” rᵢₖ (responsibility) — xác suất điểm i thuộc cụm k khi đã thấy xᵢ.
# Dữ liệu: x = 1, 2, 3, 8, 9, 10; khởi tạo μ = (2; 6), σ² = (4; 4), w = (0,5; 0,5). Mọi số được tính lại trong `checks`.
# Lời đọc: “Gauss” KHÔNG đọc (chưa probe) — nói “hỗn hợp nhiều phân phối chuẩn”; EM đọc “thuật toán kỳ vọng – cực đại hoá”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 13 (định lý Bayes), bài 14 (mật độ chuẩn một chiều), bài 15 (elip nhiều chiều),
#   bài 17 (MLE: cực đại tổng ln khả năng; MLE của μ là trung bình), bài 24 (Lagrange cho tổng bằng 1), bài 29 (K-Means).
# Sửa nguồn (curriculum fix): EM không làm giảm log-likelihood nhưng chỉ tới cực trị địa phương; khả năng có thể tăng vô hạn khi một
#   thành phần co về một điểm — cần chặn dưới phương sai.
objectives:
  - "Hiểu mô hình hỗn hợp: chọn cụm theo trọng số rồi sinh điểm từ phân phối chuẩn của cụm"
  - "Tính độ thuộc về bằng định lý Bayes (bước E)"
  - "Cập nhật trọng số, trung bình, phương sai bằng trung bình có trọng số (bước M)"
  - "Thấy log-likelihood không giảm qua các vòng, và nối với K-Means"
  - "Biết bẫy phương sai co về 0"
asr_reviewed:
  - sentence: "Bài 13, định lý Bayes đảo chiều điều kiện."
    reason: "Bayes đọc “Bay-ét” (nút thắt B41 PARTIAL, probe 3/8), ASR chép “bay S”; chiều→chiêu lẫn thanh"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một điểm nằm giữa hai cụm thuộc về cụm nào?"
    steps:
      - show: |
          <p class="big">K-Means (bài 29) bắt mỗi điểm thuộc <b>đúng một</b> cụm. Nhưng điểm nằm giữa hai cụm thì sao?</p>
          <div class="box key">Mô hình hỗn hợp phân phối chuẩn (GMM): mỗi điểm thuộc mỗi cụm với một <b>xác suất</b>; mỗi cụm là một hình chuông (elip) có độ rộng riêng. Học bằng thuật toán EM.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, K trung bình ở bài 29 bắt mỗi điểm thuộc đúng một cụm. Nhưng một điểm nằm giữa hai cụm thì sao? Mô hình hỗn hợp nhiều phân phối chuẩn cho mỗi điểm thuộc mỗi cụm với một xác suất, và học bằng thuật toán kỳ vọng, cực đại hoá."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: mật độ chuẩn, Bayes, MLE"
    steps:
      - show: |
          <p>Bài 14: mật độ chuẩn $\ f(x) = \dfrac{1}{\sqrt{2\pi\sigma^2}}\cdot e^{-\frac{(x - \mu)^2}{2\sigma^2}}$.</p>
          <p>Bài 13: Bayes $\ P(A \mid B) = \dfrac{P(B \mid A)\cdot P(A)}{P(B)}$. &nbsp; Bài 17: MLE cực đại tổng $\ln$ khả năng; MLE của $\mu$ là trung bình cộng.</p>
        focus: [1, "2.1", 2]
        say: "Nhắc lại bài 14, công thức mật độ chuẩn với tâm muy và độ rộng xích ma. Bài 13, định lý Bayes đảo chiều điều kiện. Và bài 17, ước lượng hợp lý cực đại làm lớn tổng lôgarit khả năng, và với phân phối chuẩn thì cho trung bình cộng."

  # ───────────────────────── 3. MÔ HÌNH ─────────────────────────
  - id: model
    kind: symbol
    title: "Giải mã: mật độ hỗn hợp — tổng có trọng số các hình chuông"
    checks:
      - "(lambda X: (lambda f: Rational(1, 2) + Rational(1, 2) == 1 and sp.integrate(f(X, 2, 4), (X, -sp.oo, sp.oo)) == 1 and sp.integrate(f(X, 6, 4), (X, -sp.oo, sp.oo)) == 1)(lambda x, m, v: sp.exp(-(x - m)**2/(2*v))/sp.sqrt(2*sp.pi*v)))(sp.Symbol('x', real=True))"
    steps:
      - show: |
          <div class="box key">$g(x) = \sum_{k = 1}^{K} w_k\cdot f_k(x)$, &nbsp; $f_k$: mật độ chuẩn tâm $\mu_k$, phương sai $\sigma_k^2$; &nbsp; $w_k \ge 0$, $\sum_k w_k = 1$</div>
          <p>Cách sinh dữ liệu: ① chọn cụm $k$ với xác suất $w_k$ (phân phối phân loại, bài 13); ② sinh $x$ từ hình chuông của cụm đó.</p>
          <p class="note">$w_k$ ở đây là <b>trọng số trộn</b> (một con số), không phải vector trọng số của các bài 18–25. Nhiều sách viết $\pi_k$; bài này tránh vì $\pi$ đã có trong công thức mật độ.</p>
        notation_note: true
        focus: [1, 2]
        say: "Mật độ hỗn hợp là tổng có trọng số của K hình chuông, mỗi hình chuông có tâm và độ rộng riêng, và các trọng số không âm, cộng lại bằng 1. Hiểu theo cách sinh dữ liệu, ta chọn một cụm theo trọng số, rồi sinh điểm từ hình chuông của cụm đó."

  - id: mix_pic
    kind: intuition
    title: "Nhìn thấy bước E: hai hình chuông tranh nhau từng điểm"
    checks:
      - "(lambda N: round(N(3, 2, 4), 3) == 0.176 and round(N(3, 6, 4), 3) == 0.065 and round(N(3, 2, 4)/(N(3, 2, 4) + N(3, 6, 4)), 3) == 0.731)(lambda x, m, v: math.exp(-(x - m)**2/(2*v))/math.sqrt(2*math.pi*v))"
