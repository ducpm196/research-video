        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, lấy trọng số bằng 1. Với gradient nhỏ, bộ Adam kéo 0 phẩy 0001 mỗi bước, bộ Adam tách rời chỉ 0 phẩy 00001, yếu hơn 10 lần. Với gradient lớn thì ngược lại, bộ Adam tách rời mạnh hơn 10 lần. Được là mọi trọng số co cùng tỉ lệ, mất là số 0 phẩy 01 cũ đổi nghĩa, nên phải dò lại lam-đa."
      - clear: true
