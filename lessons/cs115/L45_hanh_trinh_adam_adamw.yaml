  # ───────────────────────── 14. TỰ LÀM ─────────────────────────
  - id: practice
    kind: practice
    lab: labs/CS115/L45
    title: "Tự làm: ba bước Adam và độ kéo về 0 của phạt L2"
    checks:
      - "(lambda b1, b2, g, k: ((1 - b1**k) * g / (1 - b1**k)) / sp.sqrt((1 - b2**k) * g**2 / (1 - b2**k)))(Rational(9, 10), Rational(999, 1000), 10, 3) == 1"
      - "(lambda f: [f(g) for g in (10.0, 0.1)] == [[0.001, 0.001, 0.001]] * 2)(lambda g: [round(0.001 * (m / (1 - 0.9 ** k)) / math.sqrt(s / (1 - 0.999 ** k)), 6) for k, (m, s) in enumerate(list(__import__('itertools').accumulate(range(3), lambda a, _: (0.9 * a[0] + 0.1 * g, 0.999 * a[1] + 0.001 * g * g), initial=(0.0, 0.0)))[1:], 1)])"
      - "abs(0.001 * 0.0001 * 1 / 10 - 1e-08) < 1e-20 and abs(0.001 * 0.0001 * 1 / 0.1 - 1e-06) < 1e-18 and abs(0.001 * 0.0001 * 1 - 1e-07) < 1e-20"
      - "round(1e-06 / 1e-08) == 100 and round(1e-07 / 1e-07) == 1"
    steps:
      - show: |
          <p><b>Đọc trước khi làm.</b> Phần tự làm là một chương trình Python viết trong tệp <code>adam.py</code>. Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <i>Open Git Bash here</i>, gõ <code>python adam.py</code> rồi Enter: Python chạy từng dòng. Dòng đầu tệp <code>import math</code> cho dùng các hàm toán có sẵn như căn bậc hai.</p>
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>[0.001, 0.001, 0.001]</code></td><td>danh sách ba số trong ngoặc vuông: độ dài ba bước liên tiếp</td><td>mỗi bước dài $0{,}001$</td></tr>
          <tr><td><code>1.0e-08</code></td><td>$1{,}0\cdot 10^{-8}$ (chữ e ở đây là “nhân 10 mũ”)</td><td><code>1.0e-07</code> là $10^{-7}$</td></tr></table>
        focus: [1, [1, "2.2"], [1, "2.3"]]
        say: "Phần tự làm là một chương trình trong một tệp: bạn mở cửa sổ dòng lệnh đi kèm Git và gõ lệnh chạy kèm tên tệp. Danh sách ba số trong ngoặc vuông là độ dài ba bước liên tiếp, ở đây mỗi bước dài 0 phẩy 001. Chữ e trong số này nghĩa là nhân mười mũ, nên 1.0e-08 là 1 nhân 10 mũ âm 8."
      - clear: true
        show: |
          <p><b>Đề</b> (số minh hoạ). Viết <code>adam.py</code>: hai trọng số A và B cùng bằng 1; $\eta = 0{,}001$, $\beta_1 = 0{,}9$, $\beta_2 = 0{,}999$, $\lambda = 0{,}0001$. Gradient của hàm mất mát luôn là 10 tại A và 0,1 tại B.</p>
          <table class="t"><tr><th>in ra</th><th>cách làm</th></tr>
          <tr><td>3 bước Adam cho A và B</td><td>$m$, $s$, hiệu chỉnh độ lệch, bước $= \eta\,\hat{m} / \sqrt{\hat{s}}$</td></tr>
          <tr><td>căn của $\hat{s}$</td><td>sau bước 3, làm tròn 4 chữ số</td></tr>
