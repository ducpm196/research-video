        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Tính lại ba con số. Bước một, đếm ngày từ 14 tháng 11 năm 2017 tới 8 tháng 8 năm 2019 được 632 ngày, chưa tới 2 năm. Bước hai, 15 phần trăm tương đối nghĩa là nếu lỗi là 10 phần trăm, một số minh hoạ, thì còn 10 nhân 0 phẩy 85, bằng 8 phẩy 5 phần trăm. Bước ba, với lỗi 4 phần trăm thì còn 3 phẩy 4 phần trăm, chỉ giảm 0 phẩy 6 điểm. Thực hành là đưa cách sửa có chứng minh vào thư viện. Điều kiện là 15 phần trăm chỉ là kết quả trên hai bộ ảnh của bài báo, với mô hình của bạn phải đo lại."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, từ 2019 tới nay — ổn định: một tham số, hai nghĩa"
    stage: {year: "2019 → nay", scale: "mã hiện hành của PyTorch: Adam weight_decay mặc định 0 và là phạt L2; AdamW weight_decay mặc định 0,01, trừ γλθ mỗi bước; Adam có cờ decoupled_weight_decay và amsgrad (mặc định tắt)", source: "[PT] [RK18] [LH19]", practice: "đọc tài liệu xem weight_decay là phạt L2 hay suy giảm tách rời; chỉnh lại λ khi đổi bộ tối ưu; bật biến thể khi có lý do"}
    checks:
      - "round((1 - 0.001 * 0.01) ** 10000, 3) == 0.905 and 0.001 * 0.01 == 1e-05"
      - "round(0.001 * 0.01 * 1 / 0.1, 6) == 0.0001 and round(0.0001 / 1e-05) == 10"
    steps:
      - show: |
          <table class="t"><tr><th>mã hiện hành của thư viện (đọc 2026)</th><th>nghĩa</th></tr>
          <tr><td><code>Adam(weight_decay=0)</code> — mô tả trong mã ghi “weight decay (L2 penalty)”</td><td>mặc định 0; bật lên là <b>phạt L2</b>, đi qua phép chia</td></tr>
          <tr><td><code>AdamW(weight_decay=0.01)</code></td><td>mặc định 0,01; <b>suy giảm tách rời</b>: mỗi bước trừ $\eta \lambda w$</td></tr>
          <tr><td><code>Adam(decoupled_weight_decay=True)</code></td><td>tương đương AdamW</td></tr>
          <tr><td><code>amsgrad=False</code></td><td>biến thể năm 2018 có sẵn, <b>mặc định tắt</b></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ở chặng năm, mã hiện hành của thư viện cho thấy tham số suy giảm mang hai nghĩa. Ở bộ Adam, tham số này mặc định bằng 0, và mô tả đi kèm ghi rõ đó là phạt L2, đi qua phép chia. Ở bộ Adam tách rời, mặc định là 0 phẩy 01, và mỗi bước trừ eta nhân lam-đa nhân w, đúng kiểu tách rời. Bộ Adam còn có một cờ để chuyển sang tách rời, khi đó tương đương bộ Adam tách rời. Biến thể nhớ giá trị lớn nhất của năm 2018 cũng có sẵn, nhưng mặc định tắt."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mỗi bước, trọng số còn lại</td><td>$1 - \eta \lambda = 1 - 0{,}001 \cdot 0{,}01$</td><td>$0{,}99999$</td></tr>
          <tr><td>Bước 2. sau 10&nbsp;000 bước (số minh hoạ), nếu gradient bằng 0</td><td>$0{,}99999^{10000}$</td><td>$\approx \hl{0{,}905}$: co khoảng 9,5%</td></tr>
          <tr><td>Bước 3. cùng số 0,01 nhưng đặt vào bộ Adam (phạt L2), trọng số có $\sqrt{\hat{s}} = 0{,}1$</td><td>$0{,}001 \cdot \frac{0{,}01 \cdot 1}{0{,}1}$</td><td>$0{,}0001$ mỗi bước — gấp 10 lần $0{,}00001$</td></tr></table>
          <p class="note">Thực hành: đổi bộ tối ưu thì <b>chỉnh lại</b> độ mạnh suy giảm, không chép nguyên số. Điều kiện: chỉ áp dụng khi tham số đó thật sự được bật (khác 0).</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Tính thử với bộ Adam tách rời mặc định và eta bằng 0 phẩy 001. Bước một, mỗi bước trọng số còn lại 1 trừ eta nhân lam-đa, bằng 0 phẩy 99999. Bước hai, sau 10 nghìn bước, một số minh hoạ, nếu gradient bằng 0 thì trọng số còn khoảng 0 phẩy 905, tức co khoảng 9 phẩy 5 phần trăm. Bước ba, đặt cùng số 0 phẩy 01 vào bộ Adam, nó thành phạt L2, và trọng số có căn của s mũ bằng 0 phẩy 1 bị trừ 0 phẩy 0001 mỗi bước, gấp 10 lần. Vì vậy, đổi bộ tối ưu thì phải chỉnh lại độ mạnh suy giảm, không chép nguyên số. Điều kiện là tham số đó thật sự được bật, tức khác 0."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình bằng đường khác"
    checks:
      - "round(1 - __import__('math').exp(-1000 * 0.0010005), 3) == 0.632"
      - "(__import__('datetime').date(2018, 11, 14) - __import__('datetime').date(2017, 11, 14)).days == 365 and (__import__('datetime').date(2019, 8, 8) - __import__('datetime').date(2018, 11, 14)).days == 267 and 365 + 267 == 632"
      - "round(__import__('math').exp(-0.1), 3) == 0.905"
      - "round(-1 / 8.21 ** 0.5, 2) == -0.35 and 3 / 8.21 ** 0.5 > 1"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>0,632 sau 1000 bước</td><td>$0{,}999^{1000}$ gần với $\frac{1}{e} \approx 0{,}368$; $1 - 0{,}368 = 0{,}632$ ✓</td></tr>
          <tr><td>632 ngày</td><td>14/11/2017 tới 14/11/2018 là 365 ngày; tới 8/8/2019 thêm 267 ngày; $365 + 267 = 632$ ✓</td></tr>
          <tr><td>0,905 sau 10&nbsp;000 bước</td><td>co $0{,}001\%$ mỗi bước, $10\,000$ bước co tổng cộng cỡ $0{,}1$; $\frac{1}{e^{0{,}1}} \approx 0{,}905$ ✓</td></tr>
          <tr><td>$-0{,}35$ mỗi chu kỳ</td><td>giữ $s = 8{,}21$: bước lớn $\frac{3}{2{,}87} > 1$, hai bước nhỏ cộng $\frac{2}{2{,}87} < 1$, chênh $\frac{1}{2{,}87} \approx 0{,}35$ về phía $-1$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Số 0 phẩy 999 mũ 1000 gần với 1 chia e, khoảng 0 phẩy 368, nên 1 trừ nó là 0 phẩy 632. Đếm ngày theo năm, từ 14 tháng 11 năm 2017 tới cùng ngày năm 2018 là 365 ngày, thêm 267 ngày tới 8 tháng 8 năm 2019, cộng lại 632 ngày. Mỗi bước co một phần trăm nghìn, 10 nghìn bước co tổng cộng cỡ 0 phẩy 1, và 1 chia e mũ 0 phẩy 1 khoảng 0 phẩy 905. Cuối cùng, khi s giữ ở 8 phẩy 21, bước lớn dài hơn tổng hai bước nhỏ đúng 1 chia 2 phẩy 87, khoảng 0 phẩy 35 về phía âm 1."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Adam không tới nghiệm tốt là do người chạy chỉnh tham số kém”</td><td>ví dụ năm 2018 chỉ ra nguyên nhân nằm ở trung bình trượt, ngay cả với bài toán lồi một chiều</td><td>nghi ngờ thuật toán, thử biến thể, đo lại — không đổ lỗi người chạy</td></tr>
          <tr><td><b class="red">2.</b> “Tham số suy giảm ở thư viện nào cũng nghĩa như nhau”</td><td>bộ Adam: phạt L2 qua phép chia; bộ AdamW: tách rời; cùng số 0,01 có thể kéo mạnh gấp 10 lần</td><td>đọc mô tả của tham số, chỉnh lại khi đổi bộ tối ưu</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ Adam không tới nghiệm tốt là do người chạy chỉnh tham số kém. Ví dụ năm 2018 chỉ ra nguyên nhân nằm ở trung bình trượt, ngay cả với một bài toán lồi một chiều, nên hãy nghi ngờ thuật toán và đo lại thay vì đổ lỗi người chạy. Bài học sai thứ hai, hay gặp ở người đã đi làm, là nghĩ tham số suy giảm ở đâu cũng nghĩa như nhau. Ở bộ Adam nó là phạt L2 qua phép chia, ở bộ Adam tách rời nó đi thẳng, và cùng số 0 phẩy 01 có thể kéo mạnh gấp 10 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “AdamW luôn giảm lỗi 15%”</td><td>15% là kết quả trên hai bộ ảnh của bài báo; lỗi 4% thì 15% tương đối chỉ còn 0,6 điểm</td><td>đo trên tập kiểm tra của chính mình</td></tr>
          <tr><td><b class="red">4.</b> “Đã có biến thể sửa lỗi hội tụ thì cứ bật lên mặc định”</td><td>thư viện vẫn để nó <b>tắt</b>; bài báo chỉ ghi biến thể “thường” tốt hơn trên thí nghiệm của họ</td><td>bật khi thấy dấu hiệu, như gradient lớn hiếm gặp bị quên</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ bộ Adam tách rời luôn giảm lỗi 15 phần trăm. Đó là kết quả trên hai bộ ảnh của bài báo. Với lỗi 4 phần trăm thì 15 phần trăm tương đối chỉ còn 0 phẩy 6 điểm, nên hãy đo trên tập kiểm tra của chính mình. Bài học sai thứ tư là nghĩ đã có biến thể sửa lỗi hội tụ thì cứ bật lên mặc định. Thư viện vẫn để nó tắt, và bài báo chỉ ghi biến thể thường tốt hơn trên thí nghiệm của họ, nên chỉ bật khi thấy dấu hiệu, như gradient lớn hiếm gặp bị quên."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ chọn thế nào cho mô hình của mình?"
    checks:
      - "round(1 / (1 - 0.9)) == 10 and round(1 / (1 - 0.999)) == 1000"
      - "round(0.9 ** 100, 5) == 3e-05 and round(0.999 ** 100, 3) == 0.905"
      - "round(0.001 * 0.01 / 0.1, 6) == 0.0001 and round(0.001 * 0.01 / 10, 8) == 1e-06 and round(0.001 * 0.01, 6) == 1e-05"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>đang dùng bộ Adam với tham số suy giảm 0,01, $\eta = 0{,}001$. Đồng nghiệp đề nghị đổi sang AdamW, giữ nguyên số 0,01. Đổi thế nào?</td></tr>
          <tr><td>2</td><td>dữ liệu có loại mẫu hiếm: khoảng 100 bước mới có một gradient rất lớn. Chọn $\beta_2 = 0{,}9$ hay $0{,}999$?</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với các số minh hoạ. Câu một, bạn đang dùng bộ Adam với tham số suy giảm 0 phẩy 01 và eta bằng 0 phẩy 001. Đồng nghiệp đề nghị đổi sang bộ Adam tách rời mà giữ nguyên số 0 phẩy 01, vậy đổi thế nào? Câu hai, dữ liệu có loại mẫu hiếm, khoảng 100 bước mới có một gradient rất lớn, vậy chọn bê-ta hai bằng 0 phẩy 9 hay 0 phẩy 999? Dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: trọng số $w = 1$</th><th>bộ Adam, phạt L2: $\eta \cdot \frac{0{,}01}{\sqrt{\hat{s}}}$</th><th>AdamW: $\eta \cdot 0{,}01$</th></tr>
          <tr><td>gradient nhỏ, $\sqrt{\hat{s}} = 0{,}1$</td><td>$0{,}0001$</td><td>$0{,}00001$ — yếu hơn 10 lần</td></tr>
          <tr><td>gradient lớn, $\sqrt{\hat{s}} = 10$</td><td>$0{,}000001$</td><td>$0{,}00001$ — mạnh hơn 10 lần</td></tr></table>
          <p class="note">Được: mọi trọng số co cùng tỉ lệ. Mất: số 0,01 cũ không còn cùng nghĩa — phải dò lại $\lambda$ và đo trên tập kiểm tra. Điều kiện giữ bộ Adam: mô hình đang tốt, không có thời gian dò lại.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu một, lấy trọng số bằng 1. Với trọng số có gradient nhỏ, bộ Adam kéo 0 phẩy 0001 mỗi bước, còn bộ Adam tách rời chỉ kéo 0 phẩy 00001, yếu hơn 10 lần. Với trọng số có gradient lớn thì ngược lại, bộ Adam tách rời kéo mạnh hơn 10 lần. Được là mọi trọng số co cùng tỉ lệ, mất là số 0 phẩy 01 cũ không còn cùng nghĩa, nên phải dò lại lam-đa và đo trên tập kiểm tra. Chỉ nên giữ bộ Adam khi mô hình đang tốt và không có thời gian dò lại."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2</th><th>trí nhớ cỡ $\frac{1}{1 - \beta_2}$ bước</th><th>gradient lớn còn lại sau 100 bước</th></tr>
          <tr><td>$\beta_2 = 0{,}9$</td><td>10 bước</td><td>$0{,}9^{100} \approx 0{,}00003$ — gần như quên hẳn</td></tr>
          <tr><td>$\beta_2 = 0{,}999$</td><td>1000 bước</td><td>$0{,}999^{100} \approx \hlg{0{,}905}$ — vẫn nhớ</td></tr></table>
          <p class="note">Chọn 0,999 (đúng mặc định năm 2015, và bài báo năm 2018 cũng khuyên $\beta_2$ lớn). Được: gradient hiếm không bị quên. Mất: phản ứng chậm khi độ lớn gradient đổi thật. Điều kiện đổi: vẫn thấy trôi sai hướng — thử bật biến thể nhớ giá trị lớn nhất.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu hai, trí nhớ của trung bình trượt cỡ 1 chia 1 trừ bê-ta hai bước. Với 0 phẩy 9 là khoảng 10 bước, sau 100 bước gradient lớn chỉ còn 0 phẩy 9 mũ 100, khoảng 0 phẩy 00003, gần như quên hẳn. Với 0 phẩy 999 là khoảng 1000 bước, sau 100 bước vẫn còn khoảng 0 phẩy 905. Nên chọn 0 phẩy 999, đúng mặc định năm 2015 và đúng lời khuyên của bài báo năm 2018, đổi lại phản ứng chậm hơn khi độ lớn gradient đổi thật. Nếu vẫn thấy trôi sai hướng, hãy thử bật biến thể nhớ giá trị lớn nhất."

