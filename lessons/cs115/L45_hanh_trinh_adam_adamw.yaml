#   gradient 2, trọng số 1, λ = 0,0001 và 0,01, √ŝ = 10 và 0,1, η = 0,5 trong mô phỏng, 10 000 bước, lỗi 10% là SỐ MINH HOẠ.
#   Lời đọc không nói “AMSGrad”, “PyTorch”, “ICLR”, “weight decay”, “CIFAR”: nói “biến thể nhớ giá trị lớn nhất”, “thư viện học sâu phổ
#   biến”, “hội nghị học biểu diễn”, “suy giảm trọng số”, “hai bộ ảnh”. AdamW nói “(bộ) Adam tách rời”: probe p1 “A-đam đáp-bờ-liu”
#   8/8 nhưng CS115 là khoá mặc định, không có lexicon phủ thêm, và không được sửa lexicon chung → tên chỉ trên màn hình.
