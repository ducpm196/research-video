  - "Tính lại hiệu chỉnh độ lệch, độ co của trọng số khi phạt L2 đi qua phép chia của Adam, và bước trung bình của ví dụ không hội tụ"
  - "Chọn bộ tối ưu và tham số suy giảm trọng số hợp với mô hình của mình, kèm điều kiện đổi lựa chọn"
