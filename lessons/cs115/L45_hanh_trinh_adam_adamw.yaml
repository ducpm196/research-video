scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một số hạng đặt sai chỗ, và một bộ tối ưu đi về điểm tệ nhất"
    checks:
      - "round(10 * (1 - 0.15), 1) == 8.5"
    steps:
      - show: |
          <p>Năm 2015, <b>Adam</b> được đăng ở hội nghị với giá trị mặc định $\eta = 0{,}001$, $\beta_1 = 0{,}9$, $\beta_2 = 0{,}999$ và trở thành lựa chọn quen thuộc.</p>
          <p>Năm 2018, một bài báo chỉ ra một bài toán lồi (đồ thị cong lên như cái bát) một chiều mà Adam đi về đúng <b>điểm tệ nhất</b> trong khoảng từ −1 tới 1.</p>
          <p>Năm 2019, chỉ cần dời số hạng suy giảm trọng số ra khỏi phép chia của Adam, lỗi trên tập kiểm tra giảm khoảng <b>15% tương đối</b> trên hai bộ ảnh.</p>
          <div class="box key">Hôm nay: năm chặng từ 2014 tới nay — mỗi chặng một điểm nghẽn, một cách xử lý, và điều kiện để thực hành đó đúng.</div>
        focus: [1, 2, 3, 4]
        say: "Chào bạn, năm 2015 bộ tối ưu Adam được đăng ở hội nghị với ba giá trị mặc định, và thành lựa chọn quen thuộc. Năm 2018, một bài báo chỉ ra một bài toán lồi mà Adam đi về đúng điểm tệ nhất. Năm 2019, chỉ cần dời số hạng suy giảm ra khỏi phép chia, lỗi kiểm tra giảm khoảng 15 phần trăm tương đối trên hai bộ ảnh. Hôm nay là năm chặng từ 2014 tới nay."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bài 9 và bài 19"
    checks:
      - "Rational(9, 10) * 0 + Rational(1, 10) * 10 == 1 and 1 / (1 - Rational(9, 10)) == 10"
      - "(lambda g: (Rational(1, 10) * g / (1 - Rational(9, 10))) / sp.sqrt(Rational(1, 1000) * g ** 2 / (1 - Rational(999, 1000))))(100) == 1"
      - "Rational(5, 10) - Rational(1, 10) * 2 * Rational(1, 10) * Rational(5, 10) == Rational(49, 100)"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 9</td><td><b>trung bình trượt</b>: giữ $\beta$ phần cũ, lấy $1 - \beta$ phần mới, rồi chia cho $1 - \beta^k$ để sửa độ lệch về 0</td><td>$\beta = 0{,}9$, gradient luôn 10: $m_1 = 1$, chia $0{,}1$ được đúng 10</td></tr>
          <tr><td>bài 9</td><td><b>Adam</b>: $w_{k+1} = w_k - \eta\,\frac{\hat{m}_k}{\sqrt{\hat{s}_k} + \varepsilon}$, với $\varepsilon$ là hằng số rất nhỏ, cộng vào mẫu số để không chia cho 0; $\hat{m}$ là trung bình trượt của gradient, $\hat{s}$ của bình phương gradient (dấu nón ^ trên đầu = đã hiệu chỉnh độ lệch)</td><td>bước đầu dài khoảng $\eta$, dù gradient là 100 hay 0,01</td></tr>
          <tr><td>bài 19</td><td><b>phạt L2</b> (cách đặt của bài này): thêm $\frac{\lambda}{2} w^2$ vào hàm mất mát, nên gradient có thêm $\lambda w$, kéo $w$ về 0</td><td>$w = 0{,}5$, $\lambda = 2$, bước $\eta = 0{,}1$: trừ thêm $0{,}1 \cdot 2 \cdot 0{,}5 = 0{,}1$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Bài 9, trung bình trượt giữ bê-ta phần cũ, lấy 1 trừ bê-ta phần mới, rồi chia cho 1 trừ bê-ta mũ k để sửa độ lệch. Cũng ở bài 9, Adam chia m hiệu chỉnh cho căn của s hiệu chỉnh, nên bước đầu dài khoảng ê-ta. Dấu nón trên đầu m và s nghĩa là đã hiệu chỉnh. Bài 19, phạt L2 thêm một số hạng tỉ lệ với w vào gradient, ở đây ta viết nó là lam-đa nhân w. Ví dụ w bằng 0 phẩy 5, lam-đa 2, bước 0 phẩy 1: trừ thêm 0 phẩy 1."
      - show: |
          <p class="note">Ở bài này, $\lambda$ vẫn là <b>độ mạnh của phạt</b> như bài 19 (không phải trị riêng). Bài báo năm 2015 viết tốc độ học bằng một chữ cái khác và trung bình bình phương là $v$; ta giữ cách viết $\eta$ và $s$ của bài 9. Bài 19 viết phạt $\lambda w^2$ cho mỗi hệ số (không có $\frac{1}{2}$), nên hai cách đặt $\lambda$ chỉ lệch nhau hệ số 2.</p>
        notation_note: true
        say: "Ở bài này, lam-đa vẫn là độ mạnh của phạt, không phải trị riêng, nhưng bài 19 viết phạt không có hệ số một nửa, nên hai cách đặt chỉ lệch hệ số 2. Ta giữ cách viết ê-ta và s của bài 9, dù các bài báo viết khác."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>phạt L2 trong gradient</b></td><td>cộng $\lambda w$ vào gradient, rồi để bộ tối ưu xử lý cả tổng</td></tr>
          <tr><td><b>suy giảm trọng số tách rời</b></td><td>trừ thẳng một phần nhỏ của $w$ ở mỗi bước, <b>không</b> đi qua phép chia của Adam</td></tr>
          <tr><td><b>hội tụ</b></td><td>chạy đủ nhiều bước giúp điểm tìm được tiến sát điểm tốt nhất</td></tr>
          <tr><td><b>trí nhớ dài</b></td><td>không để một gradient lớn hiếm gặp bị quên quá nhanh</td></tr></table>
          <p class="note">Tên trên màn hình ↔ cách gọi trong lời: Adam = bộ tối ưu của bài 9 (Adam); AdamW = Adam với suy giảm trọng số tách rời (bộ Adam tách rời); AMSGrad = biến thể nhớ giá trị lớn nhất; PyTorch, <code>weight_decay</code> = một thư viện học sâu phổ biến và tham số suy giảm của nó.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Phạt L2 trong gradient là cộng lam-đa nhân w vào gradient, rồi để bộ tối ưu xử lý cả tổng. Suy giảm trọng số tách rời là trừ thẳng một phần nhỏ của w ở mỗi bước, không đi qua phép chia. Hội tụ là chạy đủ nhiều bước giúp điểm tìm được tiến sát điểm tốt nhất. Trí nhớ dài là không để một gradient lớn hiếm gặp bị quên quá nhanh."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="330" viewBox="0 0 1700 330">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2014 → 2015</text><text x="160" y="200">Adam ra đời</text><text x="160" y="232">ba giá trị mặc định</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2017</text><text x="500" y="200">phạt L2 ≠ suy giảm</text><text x="500" y="232">trọng số tách rời</text>
          <circle cx="850" cy="150" r="15" fill="#e11d48"/><text x="850" y="108" font-weight="bold">2018</text><text x="850" y="200">ví dụ không hội tụ</text><text x="850" y="232">cần trí nhớ dài</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2019</text><text x="1200" y="200">đăng hội nghị</text><text x="1200" y="232">thư viện có AdamW</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2019 → nay</text><text x="1540" y="200">hai nghĩa của</text><text x="1540" y="232">một tham số</text>
          </g>
          <text x="850" y="305" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → dùng rộng rãi lộ điểm yếu → sửa có chứng minh → ổn định trong thư viện → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2014 và 2015, Adam ra đời với ba giá trị mặc định. Năm 2017 và 2018, hai điểm yếu lộ ra. Năm 2019, cách sửa có sẵn trong thư viện, và một tham số mang hai nghĩa."

  # ───────────────────────── 5. CƠ CHẾ ─────────────────────────
  - id: paths
    kind: concept
    title: "Hai đường đi của số hạng suy giảm"
    checks:
      - "0.001 * 0.0001 * 1 / 10 == 1e-08 and abs(0.001 * 0.0001 * 1 / 0.1 - 1e-06) < 1e-18"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="30" y="40" width="260" height="80" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="160" y="75">gradient của</text><text x="160" y="105">hàm mất mát</text>
          <rect x="30" y="200" width="260" height="80" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="3"/><text x="160" y="235">số hạng suy giảm</text><text x="160" y="265">lam-đa nhân w</text>
          <rect x="560" y="40" width="380" height="80" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="750" y="75">chia cho căn của s hiệu chỉnh</text><text x="750" y="105">(lớn với gradient lớn)</text>
          <rect x="1180" y="120" width="290" height="80" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1325" y="155">bước cập nhật</text><text x="1325" y="185">của w</text>
          </g>
          <line x1="290" y1="80" x2="555" y2="80" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="290" y1="225" x2="555" y2="110" stroke="#e11d48" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
          <line x1="940" y1="80" x2="1175" y2="140" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="290" y1="255" x2="1175" y2="180" stroke="#059669" stroke-width="3" marker-end="url(#ah)"/>
          <g font-size="22" text-anchor="middle">
          <text x="565" y="200" fill="#e11d48">① phạt L2: đi qua phép chia</text>
          <text x="760" y="268" fill="#059669">② tách rời: đi thẳng tới bước cập nhật</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế chung của cả bài. Gradient của hàm mất mát luôn đi qua phép chia cho căn của s hiệu chỉnh, lớn ở trọng số có gradient lớn. Với phạt L2, đường màu đỏ, số hạng suy giảm bị cộng vào gradient nên cũng bị chia. Với suy giảm tách rời, đường màu lục, số hạng đi thẳng tới bước cập nhật."
      - show: |
          <div class="box key">Hệ quả: với phạt L2, trọng số có gradient lớn bị kéo về 0 <b>ít hơn</b>; với suy giảm tách rời, mọi trọng số bị kéo về 0 <b>cùng một tỉ lệ</b>.</div>
        say: "Hệ quả là với phạt L2, trọng số có gradient lớn thì bị kéo về 0 ít hơn. Với suy giảm tách rời, mọi trọng số bị kéo về 0 cùng một tỉ lệ."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2014 tới 2015 — khai sinh: Adam và ba giá trị mặc định"
    stage: {year: "2014 → 2015", scale: "arXiv 22/12/2014, đăng ICLR 2015; mặc định η = 0,001, β₁ = 0,9, β₂ = 0,999, ε = 10⁻⁸; bước hiệu dụng xấp xỉ bị chặn bởi η, không đổi khi nhân gradient với một hằng số", source: "[KB15]", practice: "dùng giá trị mặc định làm điểm xuất phát; hiệu chỉnh độ lệch vì trung bình bắt đầu từ 0; độ dài bước tự co giãn theo gradient của từng trọng số"}
    checks:
      - "round(1 - 0.999 ** 1000, 3) == 0.632 and round(1 - 0.999 ** 5000, 4) == 0.9933"
      - "(lambda c: (Rational(1, 10) * 2 * c / Rational(1, 10)) / sp.sqrt(Rational(1, 1000) * (2 * c) ** 2 / Rational(1, 1000)))(100) == 1"
    steps:
      - show: |
          <p><b>Quy mô:</b> bài báo đăng lên kho bài báo mở ngày 22/12/2014, đăng ở hội nghị học biểu diễn năm 2015. Mục tiêu ghi trong bài: bài toán lớn về dữ liệu và số tham số, gradient có nhiễu.</p>
          <table class="t"><tr><th>điều bài báo năm 2015 ghi</th><th>nghĩa cho người dùng</th></tr>
          <tr><td>mặc định tốt cho các bài toán đã thử: $\eta = 0{,}001$, $\beta_1 = 0{,}9$, $\beta_2 = 0{,}999$, $\varepsilon = 10^{-8}$ (rất nhỏ, cộng vào mẫu số để không chia cho 0)</td><td>có điểm xuất phát, ít phải dò</td></tr>
          <tr><td>bước hiệu dụng <b>xấp xỉ bị chặn</b> bởi $\eta$</td><td>biết trước mỗi bước đi xa cỡ nào</td></tr>
          <tr><td>bước <b>không đổi</b> khi nhân mọi gradient với cùng một số</td><td>không cần chuẩn hoá thang đo gradient</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, bài báo về Adam lên kho bài báo mở ngày 22 tháng 12 năm 2014, rồi được đăng ở hội nghị học biểu diễn năm 2015. Bài báo ghi các giá trị mặc định tốt cho những bài toán đã thử, nên người dùng có điểm xuất phát. Bước hiệu dụng xấp xỉ bị chặn bởi ê-ta, nên ta biết trước mỗi bước đi xa cỡ nào. Bước không đổi khi nhân mọi gradient với cùng một số, nên không cần chuẩn hoá thang đo gradient."
      - clear: true
        show: |
          <p>Làm thử bước đầu với gradient $g_1 = 2$ (số minh hoạ), rồi nhân gradient lên 100 lần:</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. trung bình trượt</td><td>$m_1 = 0{,}1 \cdot 2 = 0{,}2$; &nbsp; $s_1 = 0{,}001 \cdot 4 = 0{,}004$</td><td>lệch về 0</td></tr>
          <tr><td>Bước 2. hiệu chỉnh</td><td>$\hat{m}_1 = 0{,}2 / 0{,}1 = 2$; &nbsp; $\hat{s}_1 = 0{,}004 / 0{,}001 = 4$</td><td>$\frac{\hat{m}_1}{\sqrt{\hat{s}_1}} = \frac{2}{2} = \hlg{1}$</td></tr>
          <tr><td>Bước 3. gradient gấp 100 lần, bằng 200</td><td>$\hat{m}_1 = 200$, $\hat{s}_1 = 40\,000$</td><td>$\frac{200}{200} = \hlg{1}$, bước vẫn dài $\eta$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Làm thử bước đầu với gradient bằng 2, số minh hoạ. Bước một, m một bằng 0 phẩy 2, s một bằng 0 phẩy 004, cả hai lệch về 0. Bước hai, hiệu chỉnh cho m hiệu chỉnh bằng 2 và s hiệu chỉnh bằng 4, nên tỉ số là 2 chia căn 4, bằng 1. Bước ba, gradient gấp 100 lần thành 200, tỉ số vẫn bằng 1, nên bước vẫn dài ê-ta."
      - clear: true
        show: |
          <table class="t"><tr><th>hiệu chỉnh của $\hat{s}$ còn tác dụng bao lâu? ($\beta_2 = 0{,}999$)</th><th>$1 - \beta_2^k$</th></tr>
          <tr><td>$k = 1000$ bước</td><td>$1 - 0{,}999^{1000} \approx \hl{0{,}632}$: vẫn chia cho số nhỏ hơn 1 rõ rệt</td></tr>
          <tr><td>$k = 5000$ bước</td><td>$1 - 0{,}999^{5000} \approx 0{,}9933$: gần như không còn chia</td></tr></table>
          <p class="note">Thực hành: giữ hiệu chỉnh độ lệch — bài báo ghi rằng thiếu nó, khi $\beta_2$ gần 1, các bước đầu sẽ dài hơn nhiều. Điều kiện: mặc định chỉ là điểm xuất phát “cho các bài toán đã thử”, không phải lời hứa cho mọi mô hình.</p>
        focus: [1, ['1.2', '1.3'], 2, 2]
        say: "Hiệu chỉnh của s còn tác dụng bao lâu? Sau 1000 bước, 1 trừ 0 phẩy 999 mũ 1000 chỉ khoảng 0 phẩy 632, vẫn còn chia rõ; phải tới khoảng 5000 bước mới lên 0 phẩy 9933. Thực hành là giữ hiệu chỉnh độ lệch, vì thiếu nó các bước đầu sẽ dài hơn nhiều. Mặc định chỉ là điểm xuất phát, không phải lời hứa cho mọi mô hình."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2017 — phạt L2 không phải là suy giảm trọng số"
    stage: {year: "2017", scale: "arXiv 14/11/2017; với gradient thường, phạt L2 và suy giảm trọng số tương đương khi λ(L2) = λ/η; với Adam thì không; thư viện thường cài phạt L2 nhưng gọi là suy giảm trọng số", source: "[LH19]", practice: "tách số hạng suy giảm khỏi phép chia thích nghi; hiểu đúng tham số mình đang chỉnh"}
    checks:
      - "abs(0.1 * 0.01 * 1 - 0.001 * 1) < 1e-15 and abs(0.001 / 0.1 - 0.01) < 1e-15"
      - "abs(0.001 * 0.0001 * 1 / 10 - 1e-08) < 1e-20 and abs(0.001 * 0.0001 * 1 / 0.1 - 1e-06) < 1e-18 and round((1e-06) / (1e-08)) == 100 and abs(0.001 * 0.0001 * 1 - 1e-07) < 1e-20"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> trên nhiều bộ ảnh, Adam cho kết quả kém hơn gradient thường có <b>động lượng</b> (bước đi theo trung bình trượt của các gradient trước, như viên bi lăn có đà). Bài báo đăng ngày 14/11/2017 chỉ ra một lý do: các thư viện cài <b>phạt L2</b> nhưng gọi nó là <b>suy giảm trọng số</b>.</p>
          <table class="t"><tr><th>với gradient thường (không chia)</th><th>với Adam (có chia)</th></tr>
          <tr><td>phạt L2 độ mạnh $\lambda_{\text{L2}}$ <b>tương đương</b> suy giảm $\lambda$ khi $\lambda_{\text{L2}} = \frac{\lambda}{\eta}$</td><td><b>không tương đương</b>: số hạng phạt bị chia cùng gradient, trọng số có gradient lớn bị kéo về 0 ít hơn</td></tr></table>
        focus: [1, 1, "2.2", "2.2"]
        say: "Ở chặng hai, điểm nghẽn là trên nhiều bộ ảnh, Adam kém hơn gradient thường có động lượng, tức bước đi theo trung bình trượt các gradient trước, như viên bi lăn có đà. Bài báo ngày 14 tháng 11 năm 2017 chỉ ra: các thư viện cài phạt L2 nhưng gọi nó là suy giảm trọng số. Với gradient thường, hai cách tương đương khi lam-đa L hai bằng lam-đa chia ê-ta. Với Adam thì không, vì số hạng phạt bị chia cùng gradient."
      - clear: true
        show: |
          <p>Kiểm phần tương đương với gradient thường: $\eta = 0{,}1$, $\lambda = 0{,}001$, $w = 1$ (số minh hoạ).</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. độ mạnh L2 cần dùng</td><td>$\lambda_{\text{L2}} = \frac{0{,}001}{0{,}1}$</td><td>$0{,}01$</td></tr>
          <tr><td>Bước 2. phạt L2 trừ đi</td><td>$\eta \cdot \lambda_{\text{L2}} \cdot w = 0{,}1 \cdot 0{,}01 \cdot 1$</td><td>$\hlg{0{,}001}$</td></tr>
          <tr><td>Bước 3. suy giảm trừ đi</td><td>$\lambda \cdot w = 0{,}001 \cdot 1$</td><td>$\hlg{0{,}001}$ — bằng nhau</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm phần tương đương với gradient thường: ê-ta 0 phẩy 1, lam-đa 0 phẩy 001, w bằng 1, số minh hoạ. Bước một, lam-đa L hai cần dùng là 0 phẩy 001 chia 0 phẩy 1, bằng 0 phẩy 01. Bước hai, phạt L2 trừ đi ê-ta nhân lam-đa L hai nhân w, bằng 0 phẩy 001. Bước ba, suy giảm trừ đi lam-đa nhân w, cũng bằng 0 phẩy 001: hai cách bằng nhau."
      - clear: true
        show: |
          <p>Bây giờ với Adam: hai trọng số cùng $w = 1$, $\eta = 0{,}001$, $\lambda = 0{,}0001$; trọng số A có $\sqrt{\hat{s}} = 10$ (gradient lớn), B có $\sqrt{\hat{s}} = 0{,}1$ (số minh hoạ).</p>
          <table class="t"><tr><th></th><th>phạt L2: $\eta \cdot \frac{\lambda w}{\sqrt{\hat{s}}}$</th><th>tách rời: $\eta \cdot \lambda w$</th></tr>
          <tr><td>A, gradient lớn</td><td>$0{,}001 \cdot \frac{0{,}0001}{10} = 10^{-8}$</td><td>$0{,}001 \cdot 0{,}0001 = 10^{-7}$</td></tr>
          <tr><td>B, gradient nhỏ</td><td>$0{,}001 \cdot \frac{0{,}0001}{0{,}1} = 10^{-6}$</td><td>$0{,}001 \cdot 0{,}0001 = 10^{-7}$</td></tr>
          <tr><td>B chia A</td><td>$\hl{100}$ lần</td><td>1 lần — cùng tỉ lệ</td></tr></table>
          <p class="note">Thực hành: tách suy giảm khỏi phép chia (AdamW). Điều kiện: chỉ có ý nghĩa với bộ tối ưu <b>có chia thích nghi</b>; với gradient thường hai cách là một.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bây giờ với Adam: hai trọng số cùng bằng 1, ê-ta 0 phẩy 001, lam-đa 0 phẩy 0001. Trọng số A có căn của s hiệu chỉnh bằng 10 vì gradient lớn, trọng số B có căn bằng 0 phẩy 1. Với phạt L2, A bị kéo 10 mũ âm 8, B bị kéo 10 mũ âm 6, chênh nhau 100 lần. Với suy giảm tách rời, cả hai cùng bị kéo 10 mũ âm 7. Thực hành là tách suy giảm khỏi phép chia, khi bộ tối ưu có chia thích nghi."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2018 — một ví dụ Adam không hội tụ"
    stage: {year: "2018", scale: "f_t(x) = Cx khi t chia 3 dư 1, −x ở hai bước còn lại, C > 2, x trong [−1, 1]; β₁ = 0, β₂ = 1/(1 + C²); Adam đi về x = +1, điểm tệ nhất", source: "[RK18]", practice: "nghi ngờ trung bình trượt khi gradient lớn hiếm gặp; biến thể giữ giá trị lớn nhất của s; β₂ lớn"}
    checks:
      - "(vc := 8.199 / 0.999) and round(vc, 3) == 8.207 and round(0.1 * vc + 0.9, 3) == 1.721 and round(0.1 * (0.1 * vc + 0.9) + 0.9, 3) == 1.072"
      - "round(-3 / (8.199 / 0.999) ** 0.5 + 1 / (0.1 * 8.199 / 0.999 + 0.9) ** 0.5 + 1 / (0.1 * (0.1 * 8.199 / 0.999 + 0.9) + 0.9) ** 0.5, 2) == 0.68"
      - "round((-3 + 1 + 1) / (8.199 / 0.999) ** 0.5, 2) == -0.35 and 3 - 1 - 1 == 1 and 1 / (1 + 3 ** 2) == 0.1"
      - "(sim := lambda ams: [(st := {'x': 0.0, 'v': 0.0, 'vh': 0.0})] and [(g := (3 if t % 3 == 1 else -1), st.update(v=0.1 * st['v'] + 0.9 * g * g), st.update(vh=max(st['vh'], st['v'])), st.update(x=max(-1.0, min(1.0, st['x'] - 0.5 / t ** 0.5 * g / (st['vh'] if ams else st['v']) ** 0.5)))) for t in range(1, 3001)] and st['x']) and sim(False) == 1.0 and sim(True) < -0.99"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> một số bài toán thực tế, Adam không tới được nghiệm tốt. Bài báo ở hội nghị năm 2018 dựng một ví dụ lồi (đồ thị cong lên như cái bát) một chiều, $x$ nằm trong khoảng $[-1, 1]$, $C = 3$:</p>
          <table class="t"><tr><th>bước thứ $t$</th><th>hàm</th><th>gradient</th></tr>
          <tr><td>$t$ chia 3 dư 1</td><td>$3x$</td><td>$3$ — lớn, hiếm (một lần trong ba bước)</td></tr>
          <tr><td>hai bước còn lại</td><td>$-x$</td><td>$-1$ — nhỏ, thường gặp</td></tr></table>
          <p>Mỗi chu kỳ ba bước, tổng gradient $= 3 - 1 - 1 = +1 > 0$, nên điểm tốt nhất là $x = -1$. Bài báo chọn $\beta_1 = 0$ và $\beta_2 = \frac{1}{1 + C^2} = 0{,}1$.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Ở chặng ba, điểm nghẽn là Adam không tới được nghiệm tốt trong một số bài toán thực tế. Bài báo năm 2018 dựng một ví dụ lồi một chiều, x nằm từ âm 1 tới 1, với C bằng 3. Cứ ba bước, một bước có gradient 3, lớn nhưng hiếm; hai bước còn lại có gradient âm 1, nhỏ nhưng thường gặp. Mỗi chu kỳ tổng gradient là 1, dương, nên điểm tốt nhất là x bằng âm 1; bài báo chọn bê-ta hai bằng 0 phẩy 1."
      - clear: true
        show: |
          <p>Khi đã chạy lâu, $s$ lặp lại theo chu kỳ (làm tròn; cách tính tay ở dưới bảng):</p>
          <table class="t"><tr><th>bước trong chu kỳ</th><th>$s$ sau bước</th><th>$\frac{g}{\sqrt{s}}$</th></tr>
          <tr><td>Bước 1. gradient 3</td><td>$\approx 8{,}21$</td><td>$3 / \sqrt{8{,}21} \approx 1{,}05$ về phía $-1$</td></tr>
          <tr><td>Bước 2. gradient $-1$</td><td>$\approx 1{,}72$</td><td>$1 / \sqrt{1{,}72} \approx 0{,}76$ về phía $+1$</td></tr>
          <tr><td>Bước 3. gradient $-1$</td><td>$\approx 1{,}07$</td><td>$1 / \sqrt{1{,}07} \approx 0{,}97$ về phía $+1$</td></tr>
          <tr><td>Tổng một chu kỳ</td><td></td><td>$-1{,}05 + 0{,}76 + 0{,}97 \approx \hl{+0{,}68}$ → trôi về $+1$</td></tr></table>
          <p class="note">Tính tay: $s_{\text{mới}} = 0{,}1\,s_{\text{cũ}} + 0{,}9\,g^2$ (vì $\beta_2 = 0{,}1$); trong chu kỳ lặp, $s_1 = 0{,}1 s_3 + 8{,}1$, $s_2 = 0{,}1 s_1 + 0{,}9$, $s_3 = 0{,}1 s_2 + 0{,}9$, nên $s_1 = 8{,}199 / 0{,}999 \approx 8{,}21$.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Khi đã chạy lâu, s lặp lại theo chu kỳ; máy tính ra các giá trị làm tròn. Bước một, gradient 3, s lên khoảng 8 phẩy 21, nên bước chỉ còn 1 phẩy 05 về phía âm 1. Bước hai, s còn khoảng 1 phẩy 72, bước dài 0 phẩy 76 về phía 1. Bước ba, s còn khoảng 1 phẩy 07, bước dài 0 phẩy 97 về phía 1. Cộng cả chu kỳ, x trôi khoảng 0 phẩy 68 về phía 1, tức về điểm tệ nhất."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý của bài báo</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>biến thể nhớ giá trị lớn nhất (AMSGrad): dùng $s$ lớn nhất từng gặp</td><td>$s$ giữ $\approx 8{,}21$: $\frac{-3 + 1 + 1}{\sqrt{8{,}21}}$</td><td>$\approx \hlg{-0{,}35}$ mỗi chu kỳ → về $-1$</td></tr>
          <tr><td>mô phỏng 3000 bước, $\eta_t = 0{,}5 / \sqrt{t}$ (số minh hoạ)</td><td>Adam / biến thể</td><td>$x = +1$ / $x \approx -0{,}99$</td></tr></table>
          <p class="note">Thực hành: khi gradient lớn hiếm gặp mang thông tin quan trọng, đừng để trung bình trượt quên nó quá nhanh — dùng trí nhớ dài hoặc $\beta_2$ lớn. Điều kiện: ví dụ này cần $\beta_2$ nhỏ; với $\beta_2$ lớn hơn, bài báo vẫn dựng được ví dụ khác.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Cách xử lý của bài báo là biến thể nhớ giá trị lớn nhất của s từng gặp. Giữ s ở khoảng 8 phẩy 21, mỗi chu kỳ đi 3 trừ 1 trừ 1 chia căn 8 phẩy 21, khoảng âm 0 phẩy 35, về đúng âm 1. Mô phỏng 3000 bước cho Adam dừng ở 1, còn biến thể dừng gần âm 1. Thực hành là khi gradient lớn hiếm gặp quan trọng, đừng để trung bình trượt quên nó quá nhanh."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2019 — được đăng và có sẵn trong thư viện"
    stage: {year: "2019", scale: "AdamW đăng ICLR 2019; PyTorch 1.2 ngày 8/8/2019 thêm optim.AdamW; lỗi kiểm tra giảm 15% tương đối với tốc độ học mặc định 0,001 trên CIFAR-10 và ImageNet32x32", source: "[LH19] [PT19]", practice: "đưa cách sửa vào thư viện để mọi người dùng được; đo trên tập kiểm tra trước khi tin; chỉ khái quát trong phạm vi đã thử"}
    checks:
      - "(__import__('datetime').date(2019, 8, 8) - __import__('datetime').date(2017, 11, 14)).days == 632"
      - "round(10 * (1 - 0.15), 1) == 8.5 and round(4 * (1 - 0.15), 1) == 3.4"
    steps:
      - show: |
