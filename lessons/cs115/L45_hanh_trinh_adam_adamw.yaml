  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Adam không tới nghiệm tốt là do người chạy chỉnh tham số kém”</td><td>ví dụ năm 2018 chỉ ra nguyên nhân nằm ở trung bình trượt, ngay cả với bài toán lồi một chiều</td><td>nghi ngờ thuật toán, thử biến thể, đo lại — không đổ lỗi người chạy</td></tr>
          <tr><td><b class="red">2.</b> “Tham số suy giảm ở thư viện nào cũng nghĩa như nhau”</td><td>bộ Adam: phạt L2 qua phép chia; bộ AdamW: tách rời; cùng số 0,01 có thể kéo mạnh gấp 10 lần</td><td>đọc mô tả của tham số, chỉnh lại khi đổi bộ tối ưu</td></tr>
          <tr><td><b class="red">3.</b> “AdamW luôn giảm lỗi 15%”</td><td>15% là kết quả trên hai bộ ảnh của bài báo; lỗi 4% thì 15% tương đối chỉ còn 0,6 điểm</td><td>đo trên tập kiểm tra của chính mình</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Ba bài học sai hay gặp. Một, nghĩ Adam không tới nghiệm tốt là do người chạy chỉnh sai, trong khi ví dụ năm 2018 cho thấy lỗi nằm ở thuật toán. Hai, nghĩ tham số suy giảm ở đâu cũng nghĩa như nhau. Ở bộ Adam nó đi qua phép chia, ở bộ Adam tách rời nó đi thẳng, nên cùng số 0 phẩy 01 kéo mạnh gấp 10 lần. Ba, nghĩ bộ Adam tách rời luôn giảm lỗi 15 phần trăm, trong khi đó chỉ là kết quả trên hai bộ ảnh; hãy đo trên tập kiểm tra của mình."

