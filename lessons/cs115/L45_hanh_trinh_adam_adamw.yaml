        say: "Đến lượt bạn ra quyết định, với số minh hoạ. Câu một, bạn dùng bộ Adam với suy giảm 0 phẩy 01 và ê-ta 0 phẩy 001; đồng nghiệp muốn đổi sang bộ Adam tách rời, giữ số 0 phẩy 01. Đổi thế nào? Câu hai, khoảng 100 bước mới có một gradient rất lớn; chọn bê-ta hai bằng 0 phẩy 9 hay 0 phẩy 999? Dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: trọng số $w = 1$</th><th>bộ Adam, phạt L2: $\eta \cdot \frac{0{,}01}{\sqrt{\hat{s}}}$</th><th>AdamW: $\eta \cdot 0{,}01$</th></tr>
          <tr><td>gradient nhỏ, $\sqrt{\hat{s}} = 0{,}1$</td><td>$0{,}0001$</td><td>$0{,}00001$ — yếu hơn 10 lần</td></tr>
          <tr><td>gradient lớn, $\sqrt{\hat{s}} = 10$</td><td>$0{,}000001$</td><td>$0{,}00001$ — mạnh hơn 10 lần</td></tr></table>
