          <tr><td>Bước 1. từ bản đăng đầu tới thư viện</td><td>đếm ngày từ 14/11/2017 tới 8/8/2019</td><td>$\hlb{632}$ ngày, chưa tới 2 năm</td></tr>
          <tr><td>Bước 2. “15% tương đối” nghĩa là gì</td><td>lỗi 10% (số minh hoạ) nhân $(1 - 0{,}15)$</td><td>$\hlg{8{,}5\%}$, giảm 1,5 điểm phần trăm</td></tr>
          <tr><td>Bước 3. cùng 15% với lỗi 4% (số minh hoạ)</td><td>$4 \cdot 0{,}85$</td><td>$3{,}4\%$, chỉ giảm 0,6 điểm</td></tr></table>
