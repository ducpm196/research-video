assumes: [cdot, sub, vec, transpose, implies, norm, sum, alpha, lambda, phi, exp, geq, neq, approx, mat, sqrt, power, log, sub2]
# Quy ước ký hiệu: nhãn yᵢ ∈ {−1; +1} viết “y bằng âm 1 hoặc 1” (KHÁC bài 20 dùng 0/1 — nói ở notation_note); điểm số f(x) = wᵀx + b;
#   lề (margin) = 2/‖w‖; nhân tử αᵢ ≥ 0 như bài 24; hàm nhân (kernel) k(x, z); phạt L2 viết λ‖w‖² như bài 19.
# Lời đọc: nói tên Việt “máy vector hỗ trợ”, “hàm mất mát bản lề”, “hàm nhân”; tên tiếng Anh chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (khoảng cách, tích vô hướng, độ dài), bài 19 (phạt L2), bài 20 (logistic, ranh giới
#   là đường thẳng), bài 24 (KKT: α ≥ 0, điều kiện bù α·h = 0), bài 15 (ma trận đối xứng xác định dương ⇔ trị riêng dương).
# Sửa nguồn (curriculum fix): lề = 2/‖w‖ sau khi chuẩn hoá y(wᵀx + b) ≥ 1; lề mềm = hinge + L2 (tex dòng 406); kernel phải cho ma trận
#   Gram nửa xác định dương.
