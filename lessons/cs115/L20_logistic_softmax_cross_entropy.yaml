      - show: |
          <svg width="1000" height="420" viewBox="0 0 1000 420"><line x1="80" y1="370" x2="920" y2="370" stroke="#9ca3af" stroke-width="2"/><line x1="80" y1="70" x2="920" y2="70" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 6"/><line x1="80" y1="220.0" x2="920" y2="220.0" stroke="#d97706" stroke-width="3" stroke-dasharray="12 8"/><polyline fill="none" stroke="#2563eb" stroke-width="4" points="80,369.3 87,369.2 94,369.1 101,369.0 108,368.9 115,368.8 122,368.7 129,368.5 136,368.4 143,368.2 150,368.0 157,367.8 164,367.6 171,367.3 178,367.0 185,366.7 192,366.4 199,366.0 206,365.6 213,365.1 220,364.6 227,364.0 234,363.4 241,362.8 248,362.0 255,361.2 262,360.3 269,359.3 276,358.3 283,357.1 290,355.8 297,354.4 304,352.8 311,351.1 318,349.3 325,347.2 332,345.0 339,342.7 346,340.1 353,337.3 360,334.2 367,331.0 374,327.4 381,323.7 388,319.6 395,315.3 402,310.7 409,305.8 416,300.6 423,295.1 430,289.3 437,283.3 444,277.0 451,270.5 458,263.7 465,256.7 472,249.6 479,242.3 486,235.0 493,227.5 500,220.0 507,212.5 514,205.0 521,197.7 528,190.4 535,183.3 542,176.3 549,169.5 556,163.0 563,156.7 570,150.7 577,144.9 584,139.4 591,134.2 598,129.3 605,124.7 612,120.4 619,116.3 626,112.6 633,109.0 640,105.8 647,102.7 654,99.9 661,97.3 668,95.0 675,92.8 682,90.7 689,88.9 696,87.2 703,85.6 710,84.2 717,82.9 724,81.7 731,80.7 738,79.7 745,78.8 752,78.0 759,77.2 766,76.6 773,76.0 780,75.4 787,74.9 794,74.4 801,74.0 808,73.6 815,73.3 822,73.0 829,72.7 836,72.4 843,72.2 850,72.0 857,71.8 864,71.6 871,71.5 878,71.3 885,71.2 892,71.1 899,71.0 906,70.9 913,70.8 920,70.7"/><circle cx="360" cy="334.2" r="10" fill="#059669"/><circle cx="500" cy="220.0" r="10" fill="#059669"/><circle cx="640" cy="105.8" r="10" fill="#059669"/><circle cx="150" cy="368.0" r="10" fill="#b91c1c"/><g font-size="22"><text x="345" y="310" text-anchor="end" fill="#059669">1 giờ: z = −2, ŷ = 0,119</text><text x="520" y="250" fill="#059669">2 giờ: z = 0, ŷ = 0,5</text><text x="660" y="140" fill="#059669">3 giờ: z = 2, ŷ = 0,881</text><text x="90" y="262" fill="#b91c1c">z = −5: đường gần như phẳng</text><text x="910" y="208" text-anchor="end" fill="#d97706">ngưỡng 0,5</text><text x="70" y="378" text-anchor="end" fill="#1f2937">0</text><text x="70" y="78" text-anchor="end" fill="#1f2937">1</text><text x="935" y="378" fill="#1f2937">z</text><text x="220" y="400" text-anchor="middle" fill="#1f2937">−4</text><text x="360" y="400" text-anchor="middle" fill="#1f2937">−2</text><text x="500" y="400" text-anchor="middle" fill="#1f2937">0</text><text x="640" y="400" text-anchor="middle" fill="#1f2937">2</text><text x="780" y="400" text-anchor="middle" fill="#1f2937">4</text></g></svg>
        say: "Hình này vẽ hàm sigmoid, trục ngang là điểm số z, trục dọc là xác suất. Ba chấm lục là ba bạn ôn 1, 2 và 3 giờ, với z bằng âm 2, 0 và 2, cho xác suất đỗ 0 phẩy 119, 0 phẩy 5 và 0 phẩy 881. Đường đứt màu cam là ngưỡng 0 phẩy 5, chấm nào nằm trên thì mô hình đoán đỗ. Ở hai đầu, đường cong gần như nằm ngang, ví dụ chấm đỏ tại z bằng âm 5, nên đổi z một chút thì xác suất gần như không đổi."
