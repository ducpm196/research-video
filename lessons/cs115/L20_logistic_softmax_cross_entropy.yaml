# Quy ước ký hiệu: hàm sigmoid viết \sigma(z) — chữ σ ở bài 13–15 là độ lệch chuẩn (A11, nói ở notation_note);
#   điểm số z = wᵀx + b; đầu ra ŷ = σ(z) = P(y = 1 | x); nhãn y ∈ {0, 1} viết “y bằng 0 hoặc 1”; softmax viết pₖ (xác suất lớp k)
#   từ điểm sₖ; ln (tài liệu dòng 347 viết log — bài 12: log trong học máy là ln); hàm sai số viết BCE và CE (tài liệu viết L(w) —
#   chữ L ở bài 12, 17 là khả năng).
# Lời đọc: sigmoid, softmax, entropy, logistic — cách viết theo probe scratchpad l20_probe.py (B43–B46; REVIEW_L20.md).
# Nối bài trước (nói lại khi dùng, luật 17): bài 12 (e mũ luôn dương; ln; đạo hàm của ln là 1 chia x; quy tắc chuỗi), bài 13 (Bernoulli,
#   phân phối phân loại), bài 17 (MLE: cực đại khả năng = cực tiểu âm tổng ln), bài 18 (z = wᵀx + b, MSE), bài 11 (hàm lồi:
#   cực tiểu địa phương là toàn cục).
# Sửa nguồn (AUDIT A5): cross-entropy chỉ cho hàm lồi khi mô hình TUYẾN TÍNH theo w (logistic/softmax); mạng nơ-ron vẫn không lồi.
#   Định nghĩa entropy H(p) = −Σ p ln p (curriculum fix: bài 28 và 32 dùng lại).
objectives:
  - "Dùng hàm sigmoid biến điểm số thành xác suất cho phân loại hai lớp"
  - "Suy ra hàm sai số BCE từ ước lượng hợp lý cực đại của phân phối Bernoulli"
  - "Tính gradient gọn ŷ − y bằng quy tắc chuỗi"
  - "Giải thích vì sao không dùng MSE cho phân loại (và giới hạn của phát biểu “lồi”)"
  - "Dùng softmax và cross-entropy cho nhiều lớp; hiểu entropy"
