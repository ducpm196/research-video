  # ───────────────────────── 5. BCE TỪ MLE ─────────────────────────
  - id: bce
    kind: formula
    title: "Hàm sai số BCE suy ra từ MLE"
    checks:
      - "round(-math.log(0.9), 3) == 0.105 and round(-math.log(0.1), 3) == 2.303"
      - "(lambda t, y: sp.simplify(sp.log(t**y*(1 - t)**(1 - y)) - (y*sp.log(t) + (1 - y)*sp.log(1 - t))) == 0 or sp.expand_log(sp.log(t**y*(1 - t)**(1 - y)), force=True) == y*sp.log(t) + (1 - y)*sp.log(1 - t))(sp.Symbol('t', positive=True), sp.Symbol('y'))"
    steps:
      - show: |
          <p>Một mẫu theo phân phối Bernoulli (bài 13): $\ P(y \mid \mathbf{x}) = \hat{y}^{\,y}\cdot(1 - \hat{y})^{1 - y}$ &nbsp; (thay $y = 1$ được $\hat{y}$; thay $y = 0$ được $1 - \hat{y}$).</p>
          <p>MLE (bài 17): cực tiểu âm trung bình $\ln$ của khả năng:</p>
          $$\operatorname{BCE} = -\frac{1}{N}\sum_{i = 1}^{N}\Big[y_i\ln\hat{y}_i + (1 - y_i)\ln(1 - \hat{y}_i)\Big]$$
        focus: ["1.1", ["1.2", "1.4"], [2, 3]]
        say: "Theo bài 13, một mẫu theo phân phối Bernoulli có khả năng y mũ bằng xác suất dự đoán mũ y, nhân 1 trừ nó mũ 1 trừ y. Thay y bằng 1 hay 0 sẽ thấy đúng. Theo bài 17, lấy âm trung bình lôgarit, ta được hàm sai số entropy chéo nhị phân."
      - show: |
          <p><b>Làm thử ngay</b> với một mẫu $y = 1$: &nbsp; đoán $\hat{y} = 0{,}9$: sai số $-\ln 0{,}9 \approx \hlg{0{,}105}$; &nbsp; đoán $\hat{y} = 0{,}1$: sai số $-\ln 0{,}1 \approx \hlo{2{,}303}$</p>
          <p class="note">Đoán sai mà còn tự tin bị phạt rất nặng: $-\ln \hat{y}$ lớn dần không giới hạn khi $\hat{y}$ tiến về 0.</p>
          <p class="note">Sách hay viết $L(\mathbf{w})$ và $\log$: đó là BCE và $\ln$ trong bài này (bài 12: log trong học máy là ln).</p>
        notation_note: true
        focus: ["1.2", "1.4", "1.6", 2]
        say: "Làm thử ngay với một mẫu có nhãn 1. Đoán 0 phẩy 9 thì sai số chỉ 0 phẩy 105. Đoán 0 phẩy 1 thì sai số tới 2 phẩy 303. Vì lôgarit của một số gần 0 rất âm, đoán sai mà còn tự tin bị phạt rất nặng."

  # ───────────────────────── 6. GRADIENT ─────────────────────────
  - id: gradient
    kind: formula
    title: "Gradient gọn bất ngờ: ŷ − y"
    checks:
      - "(lambda z, y: sp.simplify(sp.diff(-(y*sp.log(1/(1 + sp.exp(-z))) + (1 - y)*sp.log(1 - 1/(1 + sp.exp(-z)))), z) - (1/(1 + sp.exp(-z)) - y)) == 0)(sp.Symbol('z'), sp.Symbol('y'))"
      - "(lambda z, y: sp.simplify((-y/(1/(1 + sp.exp(-z))) + (1 - y)/(1 - 1/(1 + sp.exp(-z))))*(1/(1 + sp.exp(-z)))*(1 - 1/(1 + sp.exp(-z))) - (1/(1 + sp.exp(-z)) - y)) == 0)(sp.Symbol('z'), sp.Symbol('y'))"
    steps:
      - show: |
          <p>Một mẫu, quy tắc chuỗi theo $z$: $\ \dfrac{\partial\,\text{BCE}}{\partial \hat{y}} = -\dfrac{y}{\hat{y}} + \dfrac{1 - y}{1 - \hat{y}}$, &nbsp; $\dfrac{\partial \hat{y}}{\partial z} = \hat{y}(1 - \hat{y})$. Nhân lại: $\ \Big(-\dfrac{y}{\hat{y}} + \dfrac{1 - y}{1 - \hat{y}}\Big)\hat{y}(1 - \hat{y}) = -y(1 - \hat{y}) + (1 - y)\hat{y}$</p>
          <div class="box key">Rút gọn: $\\dfrac{\partial\,\text{BCE}}{\partial z} = \hat{y} - y$ &nbsp; ⟹ &nbsp; $\nabla_{\mathbf{w}}\text{BCE} = \dfrac{1}{N}\sum_{i}(\hat{y}_i - y_i)\,\mathbf{x}_i$</div>
        introduces: [partial, nabla]
        focus: [1, ["1.2", "1.3"], "1.4", "2.1", "2.2"]
        say: "Lấy đạo hàm theo z bằng quy tắc chuỗi. Đạo hàm theo dự đoán nhân với đạo hàm của sigmoid. Nhân hai thừa số lại, mỗi phân số giản ước với một thừa số. Còn lại âm y nhân 1 trừ dự đoán, cộng 1 trừ y nhân dự đoán, rút gọn được đúng xác suất dự đoán trừ đi nhãn thật. Gradient theo w là trung bình của sai lệch nhân vector đặc trưng, giống hệt dạng của hồi quy tuyến tính."
      - show: |
          <p class="note">Ký hiệu $\partial$ và $\nabla$: đạo hàm riêng và gradient như bài 6. Sai lệch càng lớn, bước sửa càng lớn — đúng điều ta muốn.</p>
        say: "Các ký hiệu ở đây là đạo hàm riêng và gradient như bài 6. Dạng gọn này có nghĩa là sai lệch càng lớn, bước sửa càng lớn, đúng điều ta muốn."

  # ───────────────────────── 7. VÌ SAO KHÔNG MSE ─────────────────────────
  - id: why_not_mse
    kind: example
    title: "Ví dụ: vì sao không dùng MSE cho phân loại"
    checks:
      - "(lambda yh: round(yh, 4) == 0.0067 and round(2*(yh - 1)*yh*(1 - yh), 4) == -0.0132 and round(yh - 1, 3) == -0.993)(1/(1 + math.exp(5)))"
      - "round(math.exp(5), 1) == 148.4 and round(1 + math.exp(5), 1) == 149.4 and (lambda yh: round(yh*(1 - yh), 4) == 0.0066 and round(2*(yh - 1), 3) == -1.987)(1/(1 + math.exp(5)))"
      - "(lambda yh: round((yh - 1) / (2*(yh - 1)*yh*(1 - yh))) == 75)(1/(1 + math.exp(5)))"
      - "(lambda w: [round(float(sp.diff((1/(1 + sp.exp(-w)) - 1)**2, w, 2).subs(w, v)), 3) for v in (-2, 0)] == [-0.119, 0.125] and all(float(sp.diff(-sp.log(1/(1 + sp.exp(-w))), w, 2).subs(w, v)) > 0 for v in (-3, 0, 3)))(sp.Symbol('w'))"
    steps:
      - show: |
          <p><b>Bước 1.</b> Nhãn $y = 1$, mô hình đang sai nặng với $z = -5$:</p>
          $$\hat{y} = \sigma(-5) = \frac{1}{1 + e^{5}} \approx \frac{1}{149{,}4} \approx \hlo{0{,}0067}$$
        focus: [1, 2, 2]
        say: "Bước một, nhãn thật bằng 1 nhưng mô hình có điểm số z bằng âm 5, sai nặng. E mũ 5 khoảng 148 phẩy 4, cộng 1 được 149 phẩy 4. Vậy dự đoán chỉ khoảng 0 phẩy 0067, gần như chắc chắn trượt."
      - show: |
          <p><b>Bước 2 — sai số bình phương.</b> Quy tắc chuỗi có thêm thừa số độ dốc của sigmoid:</p>
          $$2(\hat{y} - 1)\cdot\hat{y}(1 - \hat{y}) \approx (-1{,}987)\cdot 0{,}0066 \approx \hlo{-0{,}013}$$
        focus: [1, 2, 2]
        say: "Bước hai, với sai số bình phương, quy tắc chuỗi nhân đạo hàm theo dự đoán với độ dốc của sigmoid. Thừa số đầu là 2 nhân dự đoán trừ 1, khoảng âm 1 phẩy 987. Thừa số sau chính là độ dốc 0 phẩy 0066 ở chỗ phẳng, nên tích chỉ còn khoảng âm 0 phẩy 013."
      - show: |
          <p><b>Bước 3 — entropy chéo.</b> Độ dốc của sigmoid đã bị rút gọn mất:</p>
          $$\hat{y} - y \approx 0{,}0067 - 1 = \hlg{-0{,}993}$$
          <p class="note">Mạnh hơn khoảng 75 lần so với Bước 2.</p>
        focus: [1, 2, 3]
        say: "Bước ba, với entropy chéo, độ dốc của sigmoid đã bị rút gọn mất trong công thức gọn. Đạo hàm chỉ còn dự đoán trừ nhãn, 0 phẩy 0067 trừ 1, bằng âm 0 phẩy 993. Con số này mạnh hơn khoảng 75 lần so với bước hai."
      - clear: true
        show: |
          <p><b>Bước 4 — so sánh.</b> Nhãn $y = 1$, mô hình đang sai nặng: $z = -5$, $\hat{y} \approx 0{,}0067$. Đạo hàm theo $z$:</p>
          <table class="t"><tr><th>hàm sai số</th><th>đạo hàm theo $z$</th><th>bước sửa</th></tr>
          <tr><td>MSE $(\hat{y} - y)^2$</td><td>$2(\hat{y} - y)\cdot\hat{y}(1 - \hat{y}) \approx -0{,}013$</td><td>gần như <b class="red">đứng yên</b></td></tr>
          <tr><td>BCE</td><td>$\hat{y} - y \approx -0{,}993$</td><td>sửa <b>mạnh</b></td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Ví dụ nhãn bằng 1 mà mô hình đang dự đoán 0 phẩy 0067, sai nặng. Với sai số bình phương, đạo hàm có thêm thừa số của sigmoid gần bằng 0, nên chỉ còn âm 0 phẩy 013, gần như đứng yên. Với entropy chéo, đạo hàm là âm 0 phẩy 993, sửa mạnh."
      - show: |
          <p>Thêm nữa: với một mẫu ($x = 1$, $b = 0$ nên $z = w$; nhãn $y = 1$), MSE ghép sigmoid có đạo hàm bậc hai <b>âm</b> ở $w = -2$ (≈ −0,119) — <b>không lồi</b>; BCE ghép sigmoid có đạo hàm bậc hai luôn dương — <b>lồi</b> (bài 11).</p>
          <p class="note">Giới hạn: BCE cho hàm lồi khi mô hình <b>tuyến tính theo</b> $\mathbf{w}$ như logistic. Với mạng nơ-ron nhiều lớp, sai số vẫn <b>không lồi</b> dù dùng BCE. Câu hay gặp “BCE đảm bảo địa hình lồi” là nói quá.</p>
        focus: [1, 2, 2]
        say: "Thêm nữa, ghép sai số bình phương với sigmoid cho đồ thị không lồi, có chỗ đạo hàm bậc hai âm, còn entropy chéo cho đồ thị lồi như bài 11. Nhưng cẩn thận, điều đó chỉ đúng khi mô hình tuyến tính theo w. Với mạng nơ-ron nhiều lớp, sai số vẫn không lồi."

  # ───────────────────────── 8. SOFTMAX ─────────────────────────
  - id: softmax
    kind: formula
    title: "Softmax: nhiều lớp, các xác suất cộng lại bằng 1"
    checks:
      - "(lambda e: [round(v/sum(e), 3) for v in e] == [0.665, 0.245, 0.09])([math.exp(2), math.exp(1), math.exp(0)])"
      - "round(-math.log(math.exp(2)/(math.exp(2) + math.exp(1) + 1)), 3) == 0.408"
    steps:
      - show: |
          <p>$C$ lớp: mỗi lớp $k$ có điểm $s_k = \mathbf{w}_k^T\mathbf{x} + b_k$. Biến thành phân phối phân loại (bài 13):</p>
          <div class="box key">$p_k = \dfrac{e^{s_k}}{\sum_{j = 1}^{C} e^{s_j}}$ &nbsp; — mọi $p_k > 0$ và $\sum_k p_k = 1$</div>
          <p>Ví dụ $s = (2;\ 1;\ 0)$ cho mèo, chó, chim: &nbsp; $p \approx (\hlg{0{,}665};\ 0{,}245;\ 0{,}090)$</p>
        focus: ["1.3", 2, 3]
        say: "Với nhiều lớp, mỗi lớp có một điểm số. Hàm softmax, tức hàm chuẩn hoá mũ, lấy e mũ mỗi điểm rồi chia cho tổng, nên mọi xác suất dương và cộng lại bằng 1, đúng một phân phối phân loại như bài 13. Ví dụ điểm 2, 1, 0 cho xác suất 0 phẩy 665, 0 phẩy 245 và 0 phẩy 09."
      - show: |
          <p>Hàm sai số cross-entropy (MLE của phân phối phân loại, bài 17): $\ \operatorname{CE} = -\ln p_{\text{lớp đúng}}$</p>
          <p><b>Làm thử ngay</b>: lớp đúng là mèo: $\ -\ln 0{,}665 \approx \hlg{0{,}408}$. &nbsp; Gradient theo điểm số: $\ p_k - [k \text{ là lớp đúng}]$ — cùng dạng “dự đoán trừ nhãn”.</p>
          <p class="note">Với 2 lớp, softmax trở về đúng sigmoid và CE trở về BCE.</p>
        focus: [1, "2.2", "2.3"]
        say: "Hàm sai số chỉ lấy âm lôgarit của xác suất lớp đúng, vì đó là ước lượng hợp lý cực đại của bài 17. Làm thử ngay, nếu lớp đúng là mèo, sai số bằng 0 phẩy 408. Gradient lại có dạng dự đoán trừ nhãn."

  # ───────────────────────── 9. ENTROPY ─────────────────────────
  - id: entropy
    kind: concept
    title: "Entropy: đo độ “bất ngờ” của một phân phối"
    checks:
      - "abs(math.log(2) - 0.693) < 0.001 and round(-(0.9*math.log(0.9) + 0.1*math.log(0.1)), 3) == 0.325"
      - "(lambda p, q: -sum(a*math.log(b) for a, b in zip(p, q)) >= -sum(a*math.log(a) for a in p))([0.9, 0.1], [0.5, 0.5])"
    steps:
      - show: |
          <div class="box key">Cross-entropy của phân phối thật $p$ với dự đoán $q$: $\ -\sum_{k} p_k\ln q_k$ (nhãn chỉ có lớp đúng bằng 1 thì còn $-\ln q_{\text{lớp đúng}}$, đúng CE ở trên). &nbsp; Entropy: $\ H(p) = -\sum_{k} p_k\ln p_k$ &nbsp; — cross-entropy của $p$ với chính nó.</div>
          <table class="t"><tr><th>phân phối</th><th>(0,5; 0,5)</th><th>(0,9; 0,1)</th><th>(1; 0)</th></tr>
          <tr><td>$H$</td><td>$\ln 2 \approx 0{,}693$</td><td>0,325</td><td>0</td></tr></table>
          <p class="note">Càng chắc chắn, entropy càng nhỏ. Cross-entropy của $p$ với một dự đoán $q$ bất kỳ luôn $\ge H(p)$; bằng nhau khi $q = p$.</p>
        focus: [1, 2, "3.3"]
        say: "Entropy chéo tổng quát là âm tổng của xác suất thật nhân lôgarit xác suất dự đoán, và entropy là entropy chéo của một phân phối với chính nó, đo độ bất ngờ trung bình. Đồng xu cân đối có entropy lôgarit của 2, tức 0 phẩy 693, đồng xu 0 phẩy 9 có 0 phẩy 325, còn kết quả chắc chắn có entropy bằng 0. Entropy chéo với một dự đoán bất kỳ không bao giờ nhỏ hơn entropy."

  # ───────────────────────── 10. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: đạo hàm bằng bước nhỏ khớp với ŷ − y"
    checks:
      - "(lambda f, z, h: round((f(z + h) - f(z - h))/(2*h), 4) == round(1/(1 + math.exp(-z)) - 1, 4))(lambda z: -math.log(1/(1 + math.exp(-z))), 0.7, 1e-5)"
      - "(lambda s: abs(sum(s) - 1) < 1e-12 and all(v > 0 for v in s))([math.exp(v)/sum(math.exp(u) for u in (2, 1, 0)) for v in (2, 1, 0)])"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>đường khác</th><th>công thức</th></tr>
          <tr><td>① đạo hàm tại $z = 0{,}7$, $y = 1$</td><td>bước nhỏ $h = 0{,}00001$ (bài 6): $\approx -0{,}3318$</td><td>$\sigma(0{,}7) - 1 \approx -0{,}3318$ $\checkmark$</td></tr>
          <tr><td>② softmax của $(2;\ 1;\ 0)$</td><td>ba xác suất đều dương</td><td>tổng đúng bằng 1 $\checkmark$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Phép thử, vì rút gọn tay dễ nhầm, ta tính đạo hàm bằng bước nhỏ như bài 6, tại z bằng 0 phẩy 7, được âm 0 phẩy 3318, khớp với công thức dự đoán trừ nhãn. Hàm chuẩn hoá mũ cho ba xác suất đều dương, và tổng của chúng đúng bằng 1."

  # ───────────────────────── 11. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Sigmoid, softmax, cross-entropy trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>gặp lại</th></tr>
          <tr><td><b>Bài 21</b></td><td>đo chất lượng mô hình phân loại (độ chính xác, độ bao phủ…)</td></tr>
          <tr><td><b>Bài 22</b></td><td>lan truyền ngược dùng đúng gradient “dự đoán trừ nhãn” ở lớp cuối</td></tr>
          <tr><td><b>Bài 23</b></td><td>lớp cuối của mạng nơ-ron phân loại thường là softmax + cross-entropy</td></tr>
          <tr><td><b>Bài 28, 32</b></td><td>entropy dùng để chọn câu hỏi trong cây quyết định và để so hai phân phối</td></tr></table>
        forward_ref: true
        focus: ["1.2", ["1.3", "1.4"], "1.5"]
        say: "Ở bài 21, ta đo chất lượng của mô hình phân loại. Ở bài 22 và 23, mạng nơ-ron dùng hàm chuẩn hoá mũ ở lớp cuối và gradient dự đoán trừ nhãn. Ở bài 28 và 32, entropy được dùng để chọn câu hỏi trong cây quyết định và để so sánh hai phân phối."

  # ───────────────────────── 12. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "(lambda s: np.allclose(np.exp(s - s.max())/np.exp(s - s.max()).sum(), [0.66524096, 0.24472847, 0.09003057]))(np.array([1000., 999., 998.]))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng MSE cho bài toán phân loại <b class="red">(sai)</b>
          <br><span class="note">Gradient gần 0 khi sai nặng, và đồ thị sai số không lồi — dùng cross-entropy.</span></div>
        say: "Lỗi thứ nhất, dùng sai số bình phương cho bài toán phân loại. Gradient gần bằng 0 khi mô hình sai nặng, và đồ thị sai số không lồi. Vì vậy, với bài toán phân loại hãy dùng entropy chéo."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy $\ln 0$ khi mô hình dự đoán đúng 0 hoặc 1 <b class="red">(lỗi số)</b>
          <br><span class="note">Thư viện kẹp $\hat{y}$ vào $[\varepsilon;\ 1 - \varepsilon]$ với một số rất nhỏ $\varepsilon$, hoặc tính thẳng từ $z$.</span></div>
        introduces: [epsilon]
        say: "Lỗi thứ hai, lấy lôgarit của 0 khi mô hình dự đoán đúng 0 hoặc đúng 1. Thư viện kẹp dự đoán cách 0 và 1 một số rất nhỏ, hoặc tính thẳng từ điểm số z."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tính softmax thẳng với điểm số lớn <b class="red">(tràn số)</b>
          <br><span class="note">$e^{1000}$ vượt quá số lớn nhất máy lưu được. Trừ điểm lớn nhất trước: $s = (1000;\ 999;\ 998)$ → $(0;\ -1;\ -2)$, kết quả không đổi: $(0{,}665;\ 0{,}245;\ 0{,}090)$.</span></div>
        say: "Lỗi thứ ba, tính hàm chuẩn hoá mũ thẳng với điểm số lớn như 1000, vì e mũ 1000 vượt quá số lớn nhất máy lưu được. Hãy trừ điểm lớn nhất trước. Kết quả không đổi, vì cả tử và mẫu cùng chia cho một số."

  # ───────────────────────── 13. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "1/(1 + math.exp(0)) == 0.5 and round(-math.log(0.8), 3) == 0.223"
      - "(lambda e: [v/sum(e) for v in e] == [0.5, 0.5])([math.exp(3), math.exp(3)]) and round(0.7 - 1, 1) == -0.3"
      - "math.exp(0) == 1 and round(1 - 0.2, 1) == 0.8"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $\sigma(0)$.</td></tr>
          <tr><td>2</td><td>Nhãn $y = 0$, mô hình đoán $\hat{y} = 0{,}2$. Tính BCE của mẫu này.</td></tr>
          <tr><td>3</td><td>Hai lớp có điểm bằng nhau $s = (3;\ 3)$: softmax cho gì? Với $y = 1$, $\hat{y} = 0{,}7$: đạo hàm BCE theo $z$?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một tính giá trị của hàm sigmoid tại điểm 0. Câu hai tính sai số của một mẫu. Câu ba về hàm chuẩn hoá mũ khi hai điểm bằng nhau, và về gradient. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① $e^{0} = 1$:</p>
          $$\sigma(0) = \frac{1}{1 + e^{0}} = \frac{1}{1 + 1} = \hlg{0{,}5}$$
          <p>② $y = 0$ nên số hạng đầu bằng 0:</p>
          $$\operatorname{BCE} = -\big[0\cdot\ln 0{,}2 + 1\cdot\ln(1 - 0{,}2)\big] = -\ln 0{,}8 \approx \hlg{0{,}223}$$
        focus: [[1, 2], [1, 2], [3, 4], 4]
        say: "Câu một, sigmoid của 0 bằng một nửa. Lý do là e mũ 0 bằng 1, nên ta được 1 chia cho 1 cộng 1, đúng ngưỡng ở giữa. Câu hai, nhãn bằng 0 nên số hạng đầu biến mất, chỉ còn âm lôgarit của 1 trừ 0 phẩy 2, tức của 0 phẩy 8. Kết quả xấp xỉ 0 phẩy 223, khá nhỏ, vì mô hình đoán gần đúng."
      - show: |
          <p>③ Hai điểm bằng nhau nên hai tử số bằng nhau; gradient là dự đoán trừ nhãn:</p>
          $$p = \left(\frac{e^{3}}{e^{3} + e^{3}};\ \frac{e^{3}}{e^{3} + e^{3}}\right) = (\hlg{0{,}5;\ 0{,}5}) \qquad \frac{\partial\,\text{BCE}}{\partial z} = 0{,}7 - 1 = \hlg{-0{,}3}$$
        focus: [1, 2, 2]
        say: "Câu ba, hai điểm bằng nhau nên hai tử số bằng nhau, mỗi lớp được một nửa, dù điểm là 3 hay số nào khác. Gradient theo z là dự đoán trừ nhãn, 0 phẩy 7 trừ 1, bằng âm 0 phẩy 3. Dấu âm nghĩa là gradient descent sẽ tăng z, đẩy dự đoán lên gần 1 hơn."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">sigmoid / softmax: điểm số → xác suất</span><span class="a">→</span>
          <span class="n">MLE ⟹ cross-entropy</span><span class="a">→</span>
          <span class="n">gradient = dự đoán − nhãn</span><span class="a">→</span>
          <span class="n">không dùng MSE; lồi chỉ khi tuyến tính theo $\mathbf{w}$</span></div>
        say: "Tổng kết chuỗi logic. Sigmoid và hàm chuẩn hoá mũ biến điểm số thành xác suất. Ước lượng hợp lý cực đại cho ta hàm entropy chéo. Gradient luôn có dạng xác suất dự đoán trừ đi nhãn thật. Không dùng sai số bình phương cho phân loại, và nhớ rằng tính lồi chỉ đúng với mô hình tuyến tính theo w."
      - show: |
          <div class="box key"><b>Tư duy:</b> chọn hàm sai số từ <b>mô hình xác suất</b> của dữ liệu (MLE), không chọn theo thói quen.</div>
        say: "Điều cần mang theo, hãy chọn hàm sai số từ mô hình xác suất của dữ liệu, không chọn theo thói quen."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 21): <b>đánh giá mô hình phân loại</b> — ma trận nhầm lẫn, accuracy, precision, recall, F1.</p>
        forward_ref: true
        say: "Ở bài sau, bài 21, ta học cách đánh giá mô hình phân loại bằng ma trận nhầm lẫn và các chỉ số đo độ đúng. Hẹn gặp bạn ở bài tiếp theo."
