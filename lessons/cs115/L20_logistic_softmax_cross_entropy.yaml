scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dự đoán “đỗ hay trượt” bằng một đường thẳng?"
    steps:
      - show: |
          <p class="big">Đoán xác suất đỗ từ số giờ ôn. Hồi quy tuyến tính (bài 18) cho: $\hat{y} = 0{,}3x - 0{,}4$.</p>
          <p>Ôn 1 giờ: $\hat{y} = \hlo{-0{,}1}$; &nbsp; ôn 6 giờ: $\hat{y} = \hlo{1{,}4}$ &nbsp; — xác suất âm, xác suất lớn hơn 1?!</p>
        focus: [1, 2, 2]
        say: "Chào bạn, hãy đoán xác suất thi đỗ từ số giờ ôn bài. Nếu dùng đường thẳng của bài 18, ôn 1 giờ được âm 0 phẩy 1, ôn 6 giờ được 1 phẩy 4. Xác suất âm, và xác suất lớn hơn 1, đều vô nghĩa."
      - show: |
          <div class="box key">Cần một hàm ép mọi con số vào khoảng 0 đến 1, và một hàm sai số phù hợp với xác suất. Hôm nay: sigmoid, cross-entropy, softmax.</div>
        say: "Ta cần một hàm ép mọi con số vào khoảng từ 0 đến 1, và một hàm sai số phù hợp với xác suất. Hôm nay ta học hàm sigmoid, hàm sai số entropy chéo, và hàm softmax cho nhiều lớp."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: e mũ, ln và MLE"
    checks:
      - "(lambda x: sp.diff(sp.log(x), x) == 1/x)(sp.Symbol('x', positive=True))"
    steps:
      - show: |
          <p>Bài 12: $e^{z} > 0$ với mọi $z$; &nbsp; $(\ln u)' = \frac{1}{u}$; &nbsp; quy tắc chuỗi: đạo hàm hàm lồng = (đạo hàm ngoài) nhân (đạo hàm trong).</p>
          <p>Bài 17: MLE chọn tham số làm khả năng lớn nhất = làm <b>âm tổng ln</b> nhỏ nhất. Đồng xu Bernoulli: $P(y = 1) = \theta$, $P(y = 0) = 1 - \theta$.</p>
        introduces: [theta]
        focus: [1, 2, 2]
        say: "Nhắc lại bài 12, e mũ z luôn dương, và đạo hàm của lôgarit u là 1 chia u. Nhắc lại bài 17, ước lượng hợp lý cực đại làm âm tổng lôgarit nhỏ nhất. Với đồng xu, ra 1 với xác suất thê ta, ra 0 với xác suất 1 trừ thê ta."

  # ───────────────────────── 3. SIGMOID ─────────────────────────
  - id: sym_sigmoid
    kind: symbol
    title: "Giải mã: hàm sigmoid σ(z) — ép mọi số vào (0; 1)"
    checks:
      - "[round(1/(1 + math.exp(-z)), 3) for z in (-2, 0, 2)] == [0.119, 0.5, 0.881]"
      - "(lambda z: sp.simplify(sp.diff(1/(1 + sp.exp(-z)), z) - (1/(1 + sp.exp(-z)))*(1 - 1/(1 + sp.exp(-z)))) == 0)(sp.Symbol('z'))"
    steps:
      - show: |
          <div class="box key">$\sigma(z) = \dfrac{1}{1 + e^{-z}}$</div>
          <table class="t"><tr><th>$z$</th><th>−2</th><th>0</th><th>2</th><th>rất lớn</th><th>rất âm</th></tr>
          <tr><td>$\sigma(z)$</td><td>0,119</td><td>0,5</td><td>0,881</td><td>gần 1</td><td>gần 0</td></tr></table>
          <p class="note">Vì $e^{-z} > 0$ nên mẫu số $> 1$: luôn có $0 < \sigma(z) < 1$. Đạo hàm gọn: $\ \sigma'(z) = \sigma(z)\cdot\big(1 - \sigma(z)\big)$.</p>
        introduces: [sigma]
        focus: [1, ["3.1", "3.3"], 2, "3.4"]
        say: "Ký hiệu xích ma của z là hàm sigmoid, bằng 1 chia cho 1 cộng e mũ âm z. Vì e mũ luôn dương, mẫu số lớn hơn 1, nên kết quả luôn nằm giữa 0 và 1. Tại 0 nó bằng một nửa. Đạo hàm của nó có dạng gọn, xích ma nhân 1 trừ xích ma."
      - show: |
          <p class="note">Ở bài 13–15, $\sigma$ là <b>độ lệch chuẩn</b>. Trong bài này, $\sigma(\cdot)$ có ngoặc theo sau là <b>hàm sigmoid</b> — cùng chữ, khác nghĩa (sách dùng cả hai).</p>
        notation_note: true
        say: "Lưu ý, ở các bài 13 đến 15, xích ma là độ lệch chuẩn. Trong bài này, xích ma có ngoặc theo sau là hàm sigmoid, cùng chữ nhưng khác nghĩa."

  # ───────────────────────── 4. MÔ HÌNH LOGISTIC ─────────────────────────
  - id: logistic
    kind: concept
    title: "Hồi quy logistic: xác suất thuộc lớp 1"
    checks:
      - "[round(1/(1 + math.exp(-(2*x - 4))), 3) for x in (1, 2, 3)] == [0.119, 0.5, 0.881]"
    steps:
      - show: |
          <div class="box key">$z = \mathbf{w}^T\mathbf{x} + b$ (như bài 18), &nbsp; $\hat{y} = \sigma(z) = P(y = 1 \mid \mathbf{x})$</div>
          <p>Ví dụ $w = 2$, $b = -4$, $x$ = số giờ ôn:</p>
          <table class="t"><tr><th>$x$ (giờ)</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>$z = 2x - 4$</td><td>−2</td><td>0</td><td>2</td></tr>
          <tr><td>$\hat{y}$ = xác suất đỗ</td><td>0,119</td><td>0,5</td><td>0,881</td></tr></table>
          <p class="note">Đoán “đỗ” khi $\hat{y} \ge 0{,}5$, tức khi $z \ge 0$: ranh giới là $2x - 4 = 0$ — vẫn là một đường thẳng (mặt phẳng) trong không gian đặc trưng.</p>
        focus: [1, [2, 3], 4]
        say: "Mô hình logistic tính điểm số z giống bài 18, rồi đưa qua hàm sigmoid để được xác suất thuộc lớp 1. Ví dụ với w bằng 2 và b bằng âm 4, ôn 1 giờ có xác suất đỗ 0 phẩy 119, ôn 3 giờ có 0 phẩy 881. Ranh giới quyết định vẫn là một đường thẳng."

  - id: sig_pic
    kind: intuition
    title: "Nhìn đường sigmoid: ép điểm số thành xác suất"
    checks:
      - "[round(1/(1 + math.exp(-z)), 3) for z in (-2, 0, 2)] == [0.119, 0.5, 0.881] and round(1/(1 + math.exp(5)), 4) == 0.0067"
      - "(lambda s: [round(s(z)*(1 - s(z)), 4) for z in (-5, -2, 0, 2)] == [0.0066, 0.105, 0.25, 0.105])(lambda z: 1/(1 + math.exp(-z)))"
