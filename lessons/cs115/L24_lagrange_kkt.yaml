source: "PR25#Categorical-ML (nhân tử Lagrange cho ràng buộc tổng = 1); SYLLABUS_CS115.md N2, §6 (thêm vì SVM dạng đối ngẫu và NMF cần)"
assumes: [cdot, sub, vec, implies, nabla, partial, log, lambda, theta, geq, neq, approx, star, power]
# Quy ước ký hiệu: ràng buộc đẳng thức g(x) = 0 dùng nhân tử λ (lam-đa — ở bài 5, 15, 16 là trị riêng, ở bài 19 là độ mạnh phạt:
#   nói ở notation_note); ràng buộc bất đẳng thức h(x) ≤ 0 dùng nhân tử α (an-pha — SVM ở bài 25 dùng đúng chữ này; KHÔNG dùng μ vì μ
#   là trung bình); hàm Lagrange viết \mathcal{L} (chữ L uốn cong — khác L khả năng của bài 12, 17).
# Lời đọc: “Lagrange” đọc “La-grăng” (chính tả phiên âm Việt thông dụng — CHƯA probe → kiểm bằng ASR toàn bài, B50); “KKT” đọc
#   “ca ca tê”; “Slater” chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 6 (gradient vuông góc với đường mức, chỉ hướng tăng nhanh nhất), bài 8 (cực trị không
#   ràng buộc: gradient bằng 0), bài 11 (hàm lồi), bài 17 (MLE phân phối phân loại giải bằng cách thế).
# Sửa nguồn (curriculum fix): KKT là điều kiện cần chỉ khi ràng buộc đủ tốt (ví dụ điều kiện Slater); với bài toán lồi thì KKT cũng đủ.
