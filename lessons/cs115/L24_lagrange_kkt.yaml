  - "Lập hàm Lagrange và giải hệ đạo hàm bằng 0"
  - "Giải lại MLE phân phối phân loại bằng nhân tử Lagrange"
  - "Đọc bốn điều kiện KKT cho ràng buộc bất đẳng thức, nhất là điều kiện bù"
  - "Biết khi nào KKT là điều kiện cần, khi nào là đủ"
