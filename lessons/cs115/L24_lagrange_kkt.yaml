scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Rào một mảnh vườn: diện tích lớn nhất với lượng rào cố định"
    checks:
      - "max(x*(10 - x) for x in [i/10 for i in range(101)]) == 25.0"
    steps:
      - show: |
          <p class="big">Có 20 m rào. Rào một mảnh vườn hình chữ nhật cạnh $x$, $y$ sao cho diện tích $x\cdot y$ <b>lớn nhất</b>.</p>
          <p>Ràng buộc: $\ 2x + 2y = 20$, tức $\ x + y = 10$. Không được chọn $x$, $y$ tuỳ ý.</p>
        focus: [1, ["1.3", "2.2"], 2]
        say: "Chào bạn, có 20 mét rào để rào một mảnh vườn hình chữ nhật. Ta muốn diện tích x nhân y lớn nhất, nhưng có ràng buộc, x cộng y phải bằng 10. Không được chọn x và y tuỳ ý."
      - show: |
          <div class="box key">Bài 8 tìm cực trị khi biến tự do (gradient bằng 0). Hôm nay: tìm cực trị khi biến bị <b>ràng buộc</b> — nhân tử Lagrange và điều kiện KKT.</div>
        say: "Ở bài 8, ta tìm cực trị khi các biến tự do, bằng cách cho gradient bằng 0. Hôm nay ta tìm cực trị khi các biến bị ràng buộc, bằng nhân tử Lagrange và điều kiện KKT."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: gradient và đường mức"
    steps:
      - show: |
          <p>Bài 6: gradient $\nabla f$ chỉ hướng $f$ tăng nhanh nhất, và <b>vuông góc</b> với đường mức $f = $ hằng số.</p>
          <p>Bài 8: không ràng buộc thì cực trị có $\nabla f = \mathbf{0}$. Bài 17: MLE phân loại có ràng buộc $\theta_1 + \theta_2 + \theta_3 = 1$, đã giải bằng cách thế.</p>
        introduces: [zero_vec]
        focus: [1, "2.1", "2.2"]
        say: "Nhắc lại bài 6, gradient chỉ hướng hàm tăng nhanh nhất, và vuông góc với đường mức, nơi hàm bằng hằng số. Nhắc lại bài 8, không có ràng buộc thì ở cực trị gradient bằng không. Và ở bài 17, ta đã gặp một ràng buộc, tổng ba xác suất bằng 1, giải bằng cách thế."

  # ───────────────────────── 3. Ý TƯỞNG HÌNH HỌC ─────────────────────────
  - id: geometry
    kind: intuition
    title: "Tại điểm tốt nhất, đường mức tiếp xúc với ràng buộc"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="420" height="420" viewBox="0 0 380 380">
            <line x1="40" y1="340" x2="360" y2="340" stroke="#9ca3af" stroke-width="2"/><line x1="40" y1="20" x2="40" y2="350" stroke="#9ca3af" stroke-width="2"/>
            <polyline fill="none" stroke="#93c5fd" stroke-width="3" points="59,40 66,123 73,170 80,201 88,222 95,237 102,249 109,259 116,266 124,273 131,278 138,283 145,287 152,290 160,293 167,296 174,298 181,300 189,302 196,304 203,305 210,307 217,308 225,310 232,311 239,312 246,313 253,314 261,315 268,315 275,316 282,317 290,317 297,318 304,319 311,319 318,320 326,320 333,321 340,321"/>
            <polyline fill="none" stroke="#2563eb" stroke-width="4" points="92,40 98,73 105,99 111,120 118,138 124,154 130,167 137,178 143,188 149,197 156,205 162,212 168,218 175,224 181,229 187,234 194,238 200,242 207,246 213,250 219,253 226,256 232,259 238,261 245,264 251,266 257,268 264,270 270,272 276,274 283,276 289,277 296,279 302,280 308,282 315,283 321,284 327,286 334,287 340,288"/>
            <polyline fill="none" stroke="#93c5fd" stroke-width="3" points="142,40 147,54 152,67 157,79 162,90 167,100 173,109 178,117 183,125 188,133 193,140 198,146 203,152 208,158 213,163 218,168 223,173 228,177 233,182 239,186 244,190 249,193 254,197 259,200 264,203 269,206 274,209 279,212 284,215 289,217 294,220 299,222 304,224 310,226 315,228 320,231 325,232 330,234 335,236 340,238"/>
            <line x1="40" y1="90" x2="290" y2="340" stroke="#dc2626" stroke-width="4"/>
            <circle cx="165" cy="215" r="8" fill="#059669"/>
            <g font-size="20"><text x="180" y="210" fill="#059669">(5; 5)</text><text x="232" y="368" fill="#dc2626">x + y = 10</text>
            <text x="300" y="270" fill="#2563eb">xy = 25</text><text x="300" y="315" fill="#60a5fa">9</text><text x="300" y="215" fill="#60a5fa">49</text></g>
          </svg></div>
          <div class="col"><p>Đường xanh: đường mức $xy = 9, 25, 49$. Đường đỏ: ràng buộc $x + y = 10$.</p>
          <p>Đi dọc đường đỏ, diện tích lớn nhất khi đường đỏ vừa <b>chạm</b> (tiếp xúc) một đường mức: tại $(5; 5)$, $xy = 25$.</p>
          <p class="note">Tại đó hai đường có chung tiếp tuyến, nên hai gradient (vuông góc với chúng, bài 6) <b>cùng phương</b>.</p></div></div>
        say: "Các đường xanh là đường mức của diện tích, x nhân y bằng 9, 25 và 49. Đường đỏ là ràng buộc. Đi dọc đường đỏ, diện tích lớn nhất khi đường đỏ vừa chạm một đường mức, tại điểm 5 và 5. Ở đó hai đường có chung tiếp tuyến, nên theo bài 6, hai gradient cùng phương."

  # ───────────────────────── 4. NHÂN TỬ LAGRANGE ─────────────────────────
  - id: sym_lagrange
    kind: symbol
    title: "Giải mã: hàm Lagrange và nhân tử λ"
    checks:
      - "(lambda x, y, l: sp.solve([sp.diff(x*y - l*(x + y - 10), v) for v in (x, y, l)], [x, y, l], dict=True) == [{x: 5, y: 5, l: 5}])(*sp.symbols('x y l'))"
    steps:
      - show: |
          $$\nabla f = \lambda\,\nabla g \qquad\implies\qquad \mathcal{L}(\mathbf{x}, \lambda) = f(\mathbf{x}) - \lambda\,g(\mathbf{x}),\ \ \text{mọi đạo hàm riêng của}\ \mathcal{L}\ \text{bằng 0}$$
          <p>$\lambda$ (lam-đa) gọi là <b>nhân tử Lagrange</b>. Đạo hàm theo $\lambda$ bằng 0 chính là ràng buộc $g(\mathbf{x}) = 0$.</p>
        introduces: [lagr]
        focus: [1, 1, 2]
        say: "Hai gradient cùng phương nghĩa là gradient của f bằng lam-đa nhân gradient của g. Gói lại thành hàm Lagrange, chữ L uốn cong, bằng f trừ lam-đa nhân g, rồi cho mọi đạo hàm riêng bằng 0. Đạo hàm theo lam-đa bằng 0 chính là ràng buộc."
      - show: |
          <p>Vườn: $\ \mathcal{L} = xy - \lambda(x + y - 10)$</p>
          $$\frac{\partial\mathcal{L}}{\partial x} = y - \lambda = 0, \qquad \frac{\partial\mathcal{L}}{\partial y} = x - \lambda = 0, \qquad \frac{\partial\mathcal{L}}{\partial \lambda} = -(x + y - 10) = 0$$
          <p>⟹ &nbsp; $x = y = \lambda = \hlg{5}$, diện tích 25</p>
        focus: [2, 3]
        say: "Với mảnh vườn, hai đạo hàm đầu cho y bằng lam-đa và x bằng lam-đa, nên x bằng y. Thay vào ràng buộc x cộng y bằng 10, ta được x bằng y bằng 5, diện tích 25, đúng như hình."
      - show: |
          <p class="note">Ở bài 5, 15, 16, $\lambda$ là trị riêng; ở bài 19 là độ mạnh phạt; ở bài này là nhân tử Lagrange — cùng chữ, khác nghĩa. $\mathcal{L}$ uốn cong cũng khác chữ L (khả năng) của bài 12, 17.</p>
        notation_note: true
        say: "Lưu ý ký hiệu. Chữ lam-đa đã là trị riêng ở bài 5, là độ mạnh phạt ở bài 19, và ở đây là nhân tử. Chữ L uốn cong cũng khác chữ L chỉ khả năng ở bài 12 và 17."

  # ───────────────────────── 5. Ý NGHĨA CỦA λ ─────────────────────────
  - id: meaning
    kind: concept
    title: "λ đo giá của ràng buộc"
    checks:
      - "5.5*5.5 - 25 == 5.25 and round(5.25, 2) == 5.25"
    steps:
      - show: |
          <p>Thêm 2 m rào (ràng buộc thành $x + y = 11$): tốt nhất $5{,}5\cdot 5{,}5 = 30{,}25$ — tăng $5{,}25 \approx \lambda = 5$.</p>
          <div class="box key">$\lambda$ = mục tiêu tăng thêm bao nhiêu khi nới ràng buộc một đơn vị — “giá” của ràng buộc.</div>
        focus: [0, 1, 2]
        say: "Nhân tử lam-đa có ý nghĩa. Nới ràng buộc thêm một đơn vị, x cộng y bằng 11, diện tích tốt nhất thành 30 phẩy 25, tăng 5 phẩy 25, xấp xỉ lam-đa bằng 5. Vì vậy lam-đa là giá của ràng buộc."

  # ───────────────────────── 6. MLE PHÂN LOẠI ─────────────────────────
  - id: categorical
    kind: example
    title: "Ví dụ: MLE phân phối phân loại bằng Lagrange"
    checks:
      - "(lambda t, l: [sp.solve(sp.diff(n*sp.log(t) - l*t, t), t) for n in (5, 3, 2)] == [[5/l], [3/l], [2/l]])(sp.Symbol('t', positive=True), sp.Symbol('l', positive=True))"
      - "sp.solve(sp.Rational(5 + 3 + 2, 1)/sp.Symbol('l') - 1, sp.Symbol('l')) == [10] and [Rational(n, 10) for n in (5, 3, 2)] == [Rational(1, 2), Rational(3, 10), Rational(1, 5)]"
      - "(lambda a, b, c, l: sp.solve([sp.diff(5*sp.log(a) + 3*sp.log(b) + 2*sp.log(c) - l*(a + b + c - 1), v) for v in (a, b, c, l)], [a, b, c, l], dict=True))(*sp.symbols('a b c l', positive=True)) == [{sp.Symbol('a', positive=True): Rational(1, 2), sp.Symbol('b', positive=True): Rational(3, 10), sp.Symbol('c', positive=True): Rational(1, 5), sp.Symbol('l', positive=True): 10}]"
    steps:
      - show: |
          <p><b>Bước 1 — lập hàm Lagrange.</b> Bài 17: 5 mèo, 3 chó, 2 chim. Cực đại lôgarit khả năng với ràng buộc tổng ba xác suất bằng 1:</p>
          $$\mathcal{L} = 5\ln\theta_1 + 3\ln\theta_2 + 2\ln\theta_3 - \lambda(\theta_1 + \theta_2 + \theta_3 - 1)$$
        focus: [1, 2, 2]
        say: "Bước một, quay lại ví dụ 10 ảnh của bài 17, gồm 5 mèo, 3 chó và 2 chim. Mục tiêu là 5 lốc thê ta một, cộng 3 lốc thê ta hai, cộng 2 lốc thê ta ba, với ràng buộc ba xác suất cộng lại bằng 1. Ta gộp chúng thành hàm Lagrange, trừ đi lam-đa nhân với tổng ba thê ta trừ 1."
      - show: |
          <p><b>Bước 2 — đạo hàm theo từng $\theta_k$ bằng 0.</b> Đạo hàm của $n_k\ln\theta_k$ là $\frac{n_k}{\theta_k}$ (bài 12):</p>
          <table class="t"><tr><th>lớp</th><th>đạo hàm bằng 0</th><th>suy ra</th></tr>
          <tr><td>mèo, $n_1 = 5$</td><td>$\frac{5}{\theta_1} - \lambda = 0$</td><td>$\theta_1 = \frac{5}{\lambda}$</td></tr>
          <tr><td>chó, $n_2 = 3$</td><td>$\frac{3}{\theta_2} - \lambda = 0$</td><td>$\theta_2 = \frac{3}{\lambda}$</td></tr>
          <tr><td>chim, $n_3 = 2$</td><td>$\frac{2}{\theta_3} - \lambda = 0$</td><td>$\theta_3 = \frac{2}{\lambda}$</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"]]
        say: "Bước hai, theo bài 12, đạo hàm của n nhân lốc thê ta là n chia thê ta, nên mỗi phương trình có dạng số lần đếm chia thê ta, trừ lam-đa, bằng 0. Với mèo, ta được thê ta một bằng 5 chia lam-đa. Tương tự, thê ta hai bằng 3 chia lam-đa, thê ta ba bằng 2 chia lam-đa."
      - clear: true
        show: |
          <p><b>Bước 3 — dùng ràng buộc</b> (đạo hàm theo $\lambda$ bằng 0):</p>
          $$\frac{5}{\lambda} + \frac{3}{\lambda} + \frac{2}{\lambda} = 1 \implies \lambda = 5 + 3 + 2 = 10 \implies \theta = (\hlg{0{,}5;\ 0{,}3;\ 0{,}2})$$
          <p class="note">Đúng như cách thế ở bài 17, nhưng gọn và đối xứng hơn: $\lambda$ chính là tổng số mẫu.</p>
        focus: [1, 2, 3]
        say: "Bước ba, đạo hàm theo lam-đa bằng 0 trả lại ràng buộc, nên 5 chia lam-đa, cộng 3 chia lam-đa, cộng 2 chia lam-đa phải bằng 1. Vậy lam-đa bằng 10, và các xác suất là 0 phẩy 5, 0 phẩy 3, 0 phẩy 2. Kết quả đúng như cách thế ở bài 17, nhưng gọn hơn, và lam-đa chính là tổng số mẫu."

  # ───────────────────────── 7. KKT ─────────────────────────
  - id: kkt
    kind: formula
    title: "Ràng buộc bất đẳng thức: bốn điều kiện KKT"
    checks:
      - "2*(1 - 3) + 4*1 == 0 and 4 >= 0 and 4*(1 - 1) == 0"
      - "2*(3 - 3) + 0*1 == 0 and 3 - 5 <= 0 and 0*(3 - 5) == 0"
    steps:
      - show: |
          <p>Cực tiểu $f(\mathbf{x})$ với ràng buộc $h(\mathbf{x}) \le 0$, nhân tử $\alpha$ (an-pha). Điều kiện KKT tại điểm tốt nhất:</p>
          <table class="t"><tr><td>① dừng</td><td>$\nabla f + \alpha\nabla h = \mathbf{0}$</td></tr>
          <tr><td>② thoả ràng buộc</td><td>$h(\mathbf{x}) \le 0$</td></tr>
          <tr><td>③ nhân tử không âm</td><td>$\alpha \ge 0$</td></tr>
          <tr><td>④ bù</td><td>$\alpha\cdot h(\mathbf{x}) = 0$: hoặc ràng buộc “chạm” ($h = 0$), hoặc $\alpha = 0$</td></tr></table>
        introduces: [alpha]
        focus: [1, "2.1", "2.2", "2.3", "2.4"]
        say: "Với ràng buộc dạng nhỏ hơn hoặc bằng 0, ta dùng nhân tử an-pha và bốn điều kiện KKT. Một là điều kiện dừng, gradient của hàm gộp bằng 0. Hai, điểm phải thoả ràng buộc. Ba, an-pha không âm. Bốn, điều kiện bù, an-pha nhân h bằng 0, nghĩa là hoặc ràng buộc đang chạm, hoặc an-pha bằng 0."
      - show: |
          <p><b>Làm thử ngay</b>: cực tiểu $(x - 3)^2$ &nbsp; ($\nabla f = 2(x - 3)$)</p>
          <table class="t"><tr><th>ràng buộc</th><th>nghiệm</th><th>kiểm KKT</th></tr>
          <tr><td>$x \le 1$ ($h = x - 1$)</td><td>$x = 1$ — chạm biên</td><td>$2(1 - 3) + \alpha = 0 \implies \alpha = \hlg{4} \ge 0$; $\ \alpha\cdot 0 = 0$ ✓</td></tr>
          <tr><td>$x \le 5$ ($h = x - 5$)</td><td>$x = 3$ — nằm trong</td><td>$\alpha = \hlg{0}$; $\ h = -2 < 0$; $\ 0\cdot(-2) = 0$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Làm thử ngay với hàm x trừ 3 bình phương. Nếu ràng buộc là x nhỏ hơn hoặc bằng 1, nghiệm nằm ngay biên x bằng 1, thay vào điều kiện dừng được an-pha bằng 4, không âm. Nếu ràng buộc là x nhỏ hơn hoặc bằng 5, nghiệm x bằng 3 nằm bên trong, nên an-pha bằng 0."

  # ───────────────────────── 8. KHI NÀO KKT ĐÚNG ─────────────────────────
  - id: when
    kind: concept
    title: "KKT là điều kiện cần — khi ràng buộc đủ tốt"
    checks:
      - "(lambda x: sp.diff(x**2, x).subs(x, 0) == 0 and sp.diff(x, x) == 1)(sp.Symbol('x'))"
    steps:
      - show: |
          <p>Phản ví dụ: cực tiểu $f = x$ với ràng buộc $x^2 \le 0$. Chỉ có $x = 0$ thoả, nên đó là nghiệm. Nhưng tại đó $\nabla f = 1$, $\nabla h = 2x = 0$:</p>
          $$\nabla f + \alpha\nabla h = 1 + \alpha\cdot 0 = 1 \neq 0 \quad \text{với mọi}\ \alpha$$
          <div class="box key">KKT là điều kiện <b>cần</b> khi ràng buộc “đủ tốt” (ví dụ điều kiện Slater: có một điểm thoả <b>chặt</b> mọi ràng buộc bất đẳng thức lồi). Với bài toán <b>lồi</b> (bài 11), KKT còn là điều kiện <b>đủ</b>.</div>
        focus: [0, [1, 2], 3]
        say: "Cẩn thận, điều kiện KKT không phải lúc nào cũng đúng. Phản ví dụ, cực tiểu x với ràng buộc x bình phương không dương, chỉ x bằng 0 thoả, nhưng không có an-pha nào thoả điều kiện dừng. Nó là điều kiện cần khi ràng buộc đủ tốt, và với bài toán lồi thì nó còn là điều kiện đủ."

  # ───────────────────────── 9. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: dò trực tiếp trên ràng buộc"
    checks:
      - "(lambda g: (round(float(g[int(np.argmax(g*(10 - g)))]), 2), round(float(np.max(g*(10 - g))), 2)) == (5.0, 25.0))(np.linspace(0, 10, 100001))"
      - "(lambda g: round(float(g[int(np.argmin((g - 3)**2))]), 3) == 1.0)(np.linspace(-5, 1, 600001))"
      - "(lambda ll: round(ll(0.5, 0.3, 0.2), 3) == -10.297 and round(ll(0.4, 0.4, 0.2), 3) == -10.549 and round(ll(0.6, 0.2, 0.2), 3) == -10.601)(lambda a, b, c: 5*math.log(a) + 3*math.log(b) + 2*math.log(c))"
      - "(lambda ll: max((ll(a/100, b/100, (100 - a - b)/100), a, b) for a in range(1, 99) for b in range(1, 100 - a))[1:] == (50, 30))(lambda a, b, c: 5*math.log(a) + 3*math.log(b) + 2*math.log(c))"
    steps:
      - show: |
          <table class="t"><tr><th>bài toán</th><th>máy dò trực tiếp</th><th>kết quả</th></tr>
          <tr><td>① vườn, đi dọc $y = 10 - x$</td><td>thử 100 001 giá trị $x$</td><td>lớn nhất $25$ tại $x = 5{,}00$ $\checkmark$</td></tr>
          <tr><td>② $(x - 3)^2$ với $x \le 1$</td><td>thử $x$ từ −5 đến 1</td><td>nhỏ nhất tại $x = 1{,}000$ $\checkmark$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Phép thử, vì giải hệ bằng tay dễ nhầm, máy đi dọc ràng buộc và thử một trăm nghìn giá trị x, diện tích lớn nhất bằng 25 tại x bằng 5. Với ví dụ bất đẳng thức, cực tiểu nằm đúng tại biên x bằng 1."
      - show: |
          <p>③ Ví dụ mèo, chó, chim: thử vài bộ xác suất khác <b>cũng cộng bằng 1</b>, tính $5\ln\theta_1 + 3\ln\theta_2 + 2\ln\theta_3$:</p>
          <table class="t"><tr><th>$(\theta_1;\ \theta_2;\ \theta_3)$</th><th>lôgarit khả năng</th></tr>
          <tr><td>$(0{,}5;\ 0{,}3;\ 0{,}2)$ — nghiệm Lagrange</td><td>$\hlg{-10{,}297}$</td></tr>
          <tr><td>$(0{,}4;\ 0{,}4;\ 0{,}2)$</td><td>$-10{,}549$</td></tr>
          <tr><td>$(0{,}6;\ 0{,}2;\ 0{,}2)$</td><td>$-10{,}601$</td></tr></table>
          <p class="note">Máy dò mọi bộ có bước 0,01: lớn nhất đúng tại $(0{,}5;\ 0{,}3;\ 0{,}2)$ $\checkmark$</p>
        focus: [1, "2.2", ["2.3", "2.4"], 3]
        say: "Kiểm ví dụ mèo, chó, chim bằng đường khác, không giải hệ mà thử thẳng vài bộ xác suất cũng cộng bằng 1. Nghiệm Lagrange cho lôgarit khả năng âm 10 phẩy 297. Hai bộ khác cho âm 10 phẩy 549 và âm 10 phẩy 601, đều nhỏ hơn, nên nghiệm Lagrange thắng cả hai. Máy còn dò mọi bộ với bước 0 phẩy 01, và giá trị lớn nhất nằm đúng tại 0 phẩy 5, 0 phẩy 3, 0 phẩy 2."

  # ───────────────────────── 10. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Lagrange và KKT trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>ở đâu</th><th>ràng buộc</th><th>công cụ</th></tr>
          <tr><td><b>Bài 25</b>: phân loại lề lớn nhất</td><td>bất đẳng thức, mỗi điểm một ràng buộc</td><td>KKT — điều kiện bù làm hầu hết $\alpha_i = 0$, chỉ vài điểm sát biên có $\alpha_i > 0$</td></tr>
          <tr><td><b>Bài 30</b>: trộn các cụm</td><td>trọng số trộn cộng lại bằng 1</td><td>Lagrange như ví dụ 3 lớp</td></tr>
          <tr><td><b>Bài 31</b>: phân rã ma trận</td><td>mọi phần tử không âm</td><td>KKT</td></tr></table>
        forward_ref: true
        say: "Ở bài 25, mô hình phân loại lề lớn nhất được giải bằng các điều kiện KKT, và điều kiện bù làm hầu hết các an-pha bằng 0, chỉ vài điểm sát biên là khác 0. Ở bài 30, các trọng số trộn phải cộng lại bằng 1. Ở bài 31, ta phân rã ma trận với ràng buộc không âm."

  # ───────────────────────── 11. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên phương trình ràng buộc <b class="red">(sai)</b>
          <br><span class="note">Chỉ giải $y - \lambda = 0$, $x - \lambda = 0$ thì có vô số nghiệm; phải thêm $x + y = 10$ (đạo hàm theo $\lambda$).</span></div>
        say: "Lỗi thứ nhất, quên phương trình ràng buộc. Chỉ có hai phương trình đầu thì có vô số nghiệm, phải thêm ràng buộc, chính là đạo hàm theo lam-đa bằng 0."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cho nhân tử của ràng buộc bất đẳng thức mang dấu tuỳ ý <b class="red">(sai)</b>
          <br><span class="note">Với dạng $h \le 0$ và cực tiểu, phải có $\alpha \ge 0$. Đẳng thức thì $\lambda$ mang dấu gì cũng được.</span></div>
        say: "Lỗi thứ hai, cho nhân tử của ràng buộc bất đẳng thức mang dấu tuỳ ý. Với dạng nhỏ hơn hoặc bằng 0 và bài toán cực tiểu, an-pha phải không âm. Chỉ với đẳng thức, lam-đa mới mang dấu gì cũng được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi mọi nghiệm của hệ là cực trị cần tìm <b class="red">(sai)</b>
          <br><span class="note">Hệ đạo hàm bằng 0 chỉ cho <b>ứng viên</b> (có thể là lớn nhất, nhỏ nhất, hoặc không phải cả hai) — so sánh giá trị, hoặc dùng tính lồi.</span></div>
        say: "Lỗi thứ ba, coi mọi nghiệm của hệ là cực trị cần tìm. Hệ chỉ cho các ứng viên, có thể là lớn nhất, nhỏ nhất, hoặc không phải cả hai. Hãy so sánh giá trị, hoặc dùng tính lồi."

  # ───────────────────────── 12. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda x, y, l: sp.solve([sp.diff(x*y - l*(x + 2*y - 8), v) for v in (x, y, l)], [x, y, l], dict=True) == [{x: 4, y: 2, l: 2}])(*sp.symbols('x y l'))"
      - "2*(3 - 3) == 0 and 3 - 4 < 0 and 3 - 4 == -1 and 2*(3 - 3) + 0*1 == 0"
      - "4*2 == 8 and 6*1 == 6 and 6 + 2*1 == 8 and 4 + 2*2 == 8 and 2*2 + 2*2 == 8"
      - "[Rational(n, 4) for n in (1, 1, 2)] == [Rational(1, 4), Rational(1, 4), Rational(1, 2)]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cực đại $xy$ với $x + 2y = 8$. Tìm $x$, $y$, $\lambda$.</td></tr>
          <tr><td>2</td><td>Cực tiểu $(x - 3)^2$ với $x \le 4$. Nghiệm và $\alpha$?</td></tr>
          <tr><td>3</td><td>Đếm được 1, 1, 2 ở ba lớp. MLE của $(\theta_1, \theta_2, \theta_3)$ và $\lambda$?</td></tr></table>
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một dùng nhân tử. Câu hai dùng điều kiện KKT. Câu ba là ước lượng hợp lý cực đại cho phân phối phân loại. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\ \mathcal{L} = xy - \lambda(x + 2y - 8)$</p>
          <table class="t"><tr><th>phương trình</th><th>suy ra</th></tr>
          <tr><td>$\frac{\partial\mathcal{L}}{\partial x} = y - \lambda = 0$</td><td>$y = \lambda$</td></tr>
          <tr><td>$\frac{\partial\mathcal{L}}{\partial y} = x - 2\lambda = 0$</td><td>$x = 2\lambda$</td></tr>
          <tr><td>ràng buộc $x + 2y = 8$</td><td>$2\lambda + 2\lambda = 8$: $\ \lambda = \hlg{2}$, $x = \hlg{4}$, $y = \hlg{2}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Câu một, ta lập hàm Lagrange, x nhân y trừ lam-đa nhân với x cộng 2 y trừ 8. Đạo hàm theo x cho y bằng lam-đa. Đạo hàm theo y cho x bằng hai lam-đa. Thay vào ràng buộc, 2 lam-đa cộng 2 lam-đa bằng 8, nên lam-đa bằng 2, x bằng 4, y bằng 2. Kiểm nhanh, diện tích 4 nhân 2 bằng 8, còn điểm 6 và 1 cũng nằm trên ràng buộc nhưng chỉ cho 6."
      - clear: true
        show: |
          <p>② Bỏ ràng buộc thì đáy ở $x = 3$; điểm này thoả $x \le 4$, nên ràng buộc không chạm:</p>
          $$h(3) = 3 - 4 = -1 < 0 \implies \alpha = \hlg{0}, \qquad 2(3 - 3) + 0\cdot 1 = 0 \ \checkmark$$
        focus: [1, 2, 2]
        say: "Câu hai, nếu bỏ ràng buộc thì hàm x trừ 3 bình phương có đáy tại x bằng 3. Điểm này thoả x nhỏ hơn hoặc bằng 4, và h bằng 3 trừ 4, bằng âm 1, nhỏ hơn 0, nên ràng buộc không chạm. Theo điều kiện bù, an-pha phải bằng 0, và điều kiện dừng 2 nhân 3 trừ 3, cộng 0, đúng bằng 0."
      - show: |
          <p>③ Như ví dụ mèo, chó, chim: $\theta_k = \frac{n_k}{\lambda}$ và $\lambda$ = tổng số đếm.</p>
          $$\lambda = 1 + 1 + 2 = \hlg{4}, \qquad \theta = \Big(\frac{1}{4};\ \frac{1}{4};\ \frac{2}{4}\Big) = (\hlg{0{,}25;\ 0{,}25;\ 0{,}5})$$
        focus: [1, 2, 2]
        say: "Câu ba, giống ví dụ mèo, chó, chim, mỗi thê ta bằng số lần đếm chia lam-đa, và lam-đa bằng tổng số đếm. Vậy lam-đa bằng 1 cộng 1 cộng 2, bằng 4. Các xác suất là 1 phần 4, 1 phần 4 và 2 phần 4, tức 0 phẩy 25, 0 phẩy 25 và 0 phẩy 5."

  # ───────────────────────── 13. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đường mức tiếp xúc ràng buộc</span><span class="a">→</span>
          <span class="n">$\nabla f = \lambda\nabla g$</span><span class="a">→</span>
          <span class="n">$\mathcal{L} = f - \lambda g$, đạo hàm bằng 0</span><span class="a">→</span>
          <span class="n">bất đẳng thức: KKT, $\alpha \ge 0$, điều kiện bù</span><span class="a">→</span>
          <span class="n">lồi: KKT đủ</span></div>
        say: "Tổng kết chuỗi logic. Tại điểm tốt nhất, đường mức tiếp xúc ràng buộc, nên hai gradient cùng phương. Gói lại thành hàm Lagrange và cho đạo hàm bằng 0. Với bất đẳng thức, dùng bốn điều kiện KKT, an-pha không âm và điều kiện bù. Với bài toán lồi, chúng là đủ."
      - show: |
          <div class="box key"><b>Tư duy:</b> ràng buộc có “giá” — nhân tử cho biết nới ràng buộc một chút thì được lợi bao nhiêu.</div>
        say: "Điều cần mang theo, ràng buộc có giá, và nhân tử cho biết nới ràng buộc một chút thì được lợi bao nhiêu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 25): <b>Support Vector Machine</b> — lề lớn nhất, hinge loss và kernel.</p>
        forward_ref: true
        say: "Ở bài sau, bài 25, ta học mô hình phân loại tìm đường ranh giới có lề lớn nhất, dùng chính các điều kiện vừa học. Hẹn gặp bạn ở bài tiếp theo."
