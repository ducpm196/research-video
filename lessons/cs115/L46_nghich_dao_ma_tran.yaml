          <p><b>Kết quả mong đợi</b></p><div class="code"><div>dinh thuc M: 1</div><div>M nghich dao: [[3, -2], [-7, 5]]</div><div>w: [1, 2]</div><div>M.w: [9, 13]</div><div>t=1/100: dinh thuc 1/100, nghich dao lon nhat 101, w doi [-1/10, 1/10]</div><div>t=1/10000: dinh thuc 1/10000, nghich dao lon nhat 10001, w doi [-10, 10]</div></div>
        focus: [0, 0]
        say: "Đây là kết quả mong đợi, nửa đầu gồm giải M w bằng b và hai ma trận gần suy biến. Bạn chạy chương trình của mình rồi so từng dòng."
      - clear: true
        show: |
          <div class="code"><div>hoi quy: w = [2/3, 1]</div><div>hai cot giong nhau: dinh thuc X^T X = 0</div></div><p class="note" style="color:#374151;font-size:0.8em">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L46 nghichdao.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>CS115 L46 nghichdao.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi. <b>Kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python tệp.py</code> và so với kết quả mong đợi.</p>
        focus: [0, 2, 2]
        say: "Nửa sau gồm công thức hồi quy và trường hợp hai cột giống nhau. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác."
      - show: |
          <div class="box key"><b>Nếu kẹt:</b> nghịch đảo hai nhân hai: đổi chỗ $a$ và $d$, đổi dấu $b$ và $c$, chia $ad - bc$. $\mathbf{w}$ = nghịch đảo nhân $\mathbf{b}$ (nhân bên trái). Với hồi quy: tạo $X^TX$ và $X^T\mathbf{y}$ trước, rồi nghịch đảo của $X^TX$ nhân $X^T\mathbf{y}$.</div>
        say: "Nếu kẹt, nghịch đảo hai nhân hai là đổi chỗ, đổi dấu rồi chia cho định thức. Nghiệm w bằng nghịch đảo nhân b, nhân ở bên trái. Với hồi quy, tạo hai ma trận X chuyển vị nhân X và X chuyển vị nhân y trước, rồi mới nhân nghịch đảo."

  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    checks:
      - "(lambda X: (X.T*X).shape == (3, 3) and (X.T*Matrix([1,2,3,4])).shape == (3, 1))(Matrix(4, 3, list(range(12))))"
      - "(lambda X: (X.T*X).det() == 0)(Matrix([[6,6,4],[5,5,2],[8,8,7]]))"
      - "(lambda X, y: (X.T*X).inv()*X.T*y == Matrix([2,1]))(Matrix([[2,1],[1,1]]), Matrix([5,3]))"
      - "(lambda Q: Q.T*Q == sp.eye(2) and Q.inv() == Q.T)(Matrix([[0,-1],[1,0]]))"
    steps:
      - show: |
          <div class="chain"><span class="n">$\mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$</span><span class="a">→</span>
          <span class="n">đổi chỗ, đổi dấu, chia $ad - bc$</span><span class="a">→</span>
          <span class="n">$\mathbf{w} = \mathbf{M}^{-1}\mathbf{b}$</span><span class="a">→</span>
          <span class="n">hai phép thử</span><span class="a">→</span>
          <span class="n">định thức gần 0: nghiệm nhạy</span></div>
        say: "Tổng kết chuỗi logic. Nghịch đảo của M là thứ nhân vào M để ra ma trận đơn vị. Với ma trận hai nhân hai, ta đổi chỗ, đổi dấu rồi chia cho định thức, và mẹo này luôn đúng khi định thức khác 0. Nhờ nghịch đảo ta giải được M nhân w bằng b, và nhớ luôn thử lại bằng hai phép thử. Khi định thức gần 0, nghiệm rất nhạy với sai số nhỏ."
      - clear: true
        show: |
          <p>Giờ bạn đọc được công thức nghiệm của <b>hồi quy tuyến tính</b> (sẽ học kỹ ở bài 18): dự đoán giá nhà bằng cách nhân mỗi <b>đặc trưng</b> của nhà (diện tích, số phòng…) với một <b>trọng số</b> rồi cộng lại; $\mathbf{w}$ gom các trọng số.</p>
          $$\hlo{\mathbf{w}} = (\mathbf{X}^T\mathbf{X})^{-1}\,\mathbf{X}^T\mathbf{y}$$
          <p class="note">$\mathbf{X} \in \mathbb{R}^{\sz{N}{D}}$: $N$ ngôi nhà, $D$ đặc trưng ($\in$ đọc là “thuộc”, $\mathbb{R}$ là tập các số thực). &nbsp; $\mathbf{y} \in \mathbb{R}^{\sz{N}{1}}$: giá thật của $N$ ngôi nhà.</p>
          <p class="note">$\mathbf{X}^T\mathbf{X}$ cỡ $\sz{D}{D}$ (vuông), $\ \mathbf{X}^T\mathbf{y}$ cỡ $\sz{D}{1}$, nên $\hlo{\mathbf{w}}$ cỡ $\sz{D}{1}\ \checkmark$</p>
        focus: [0, 1, 2, 3, 3, 2, 4]
        say: "Và đây là phần thưởng. Hồi quy tuyến tính, sẽ học kỹ ở bài 18, dự đoán giá nhà bằng cách nhân từng đặc trưng của nhà, như diện tích hay số phòng, với một trọng số rồi cộng lại. Công thức nghiệm của hồi quy tuyến tính trông rất đáng sợ, nhưng giờ bạn đọc được từng ký hiệu. X là bảng dữ liệu của N ngôi nhà, mỗi nhà D đặc trưng, còn y là giá thật của N ngôi nhà đó. Ký hiệu thuộc và chữ R hoa nghĩa là bảng gồm toàn số thực, N hàng, D cột. Công thức lấy X chuyển vị nhân X, lấy nghịch đảo, rồi nhân với X chuyển vị nhân y. Thử kích thước, X chuyển vị nhân X là ma trận vuông D nhân D, và w có đúng D trọng số."
        forward_ref: true
      - show: |
          <div class="box warn">Công thức chỉ dùng được khi $\mathbf{X}^T\mathbf{X}$ <b>khả nghịch</b>. Ví dụ: hai cột của $\mathbf{X}$ giống hệt nhau thì không.</div>
        say: "Một lưu ý quan trọng, công thức này chỉ dùng được khi X chuyển vị nhân X khả nghịch. Ví dụ, nếu hai cột của X giống hệt nhau, thì X chuyển vị nhân X không có nghịch đảo."
