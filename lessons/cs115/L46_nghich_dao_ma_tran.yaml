# Bài nối tiếp phần nghịch đảo của bài 2 (bài 2 chỉ dạy định nghĩa, mẹo 2×2, giải M w = b, hạng suy biến S); bài này dạy vì sao mẹo đúng,
# ví dụ trọn vẹn, ma trận gần suy biến (nghiệm nhạy), và công thức nghiệm hồi quy (XᵀX)⁻¹Xᵀy.
# Quy ước ký hiệu: như bài 2 (ma trận chữ hoa in đậm; kích thước \sz{M}{N}; ma trận đơn vị I_2; nghịch đảo ^{-1}).
objectives:
  - "Chứng minh mẹo nghịch đảo ma trận 2 nhân 2 luôn đúng và nêu điều kiện định thức khác 0"
  - "Giải M w = b bằng nghịch đảo, rồi kiểm lại bằng hai phép thử"
  - "Đo được ma trận gần suy biến làm nghịch đảo và nghiệm phình to khi định thức tiến về 0"
  - "Đọc công thức nghiệm hồi quy w = (XᵀX)⁻¹Xᵀy, tự tính một ví dụ nhỏ và nêu khi nào nó dùng được"
