  # ───────────────────────── 1. HOOK ─────────────────────────

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────

  # ───────────────────────── 3. KÝ HIỆU MA TRẬN ─────────────────────────

  # ───────────────────────── 4. CHUYỂN VỊ ─────────────────────────

