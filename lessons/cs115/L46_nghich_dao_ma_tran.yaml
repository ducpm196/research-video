  # ───────────────────────── 8. NGHỊCH ĐẢO ─────────────────────────
  - id: hook
    kind: hook
    title: "Mẹo nghịch đảo đúng vì sao, và gãy ở đâu?"
    steps:
      - show: |
          <p class="big">Bài 2: <b>đổi chỗ, đổi dấu, chia định thức</b> cho ra nghịch đảo của ma trận hai nhân hai.</p>
          <table class="t"><tr><th>Hôm nay</th></tr>
          <tr><td>① Vì sao mẹo luôn đúng?</td></tr>
          <tr><td>② Định thức rất gần 0 thì sao?</td></tr>
          <tr><td>③ Nghịch đảo nằm ở đâu trong công thức hồi quy?</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Chào bạn, ở bài 2 ta có một mẹo tìm nghịch đảo ma trận hai nhân hai, là đổi chỗ, đổi dấu rồi chia cho định thức. Hôm nay ta trả lời ba câu hỏi. Một, vì sao mẹo ấy luôn đúng. Hai, điều gì xảy ra khi định thức rất gần 0. Ba, nghịch đảo nằm ở đâu trong công thức hồi quy tuyến tính."

  - id: prereq
    kind: prereq
    title: "Ôn nhanh: nghịch đảo của M là gì"
    checks:
      - "Matrix([[1, -1], [-1, 2]]) * Matrix([[2, 1], [1, 1]]) == sp.eye(2)"
    steps:
      - show: |
          <p>Nghịch đảo của $\mathbf{M}$ là ma trận nhân vào $\mathbf{M}$ để ra ma trận đơn vị $\mathbf{I}_2$:</p>
          $$\mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix},\quad \mathbf{M}^{-1} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}$$
          <p class="note">Chuyển vị $\mathbf{X}^T$: đổi hàng thành cột. Ma trận đơn vị $\mathbf{I}_2$: số 1 trên đường chéo, số 0 chỗ khác.</p>
        focus: [1, 2, 2, 3]
        say: "Nhắc lại từ bài 2, nghịch đảo của M là ma trận nhân vào M để ra ma trận đơn vị I hai. Với M có hàng trên 2, 1 và hàng dưới 1, 1, mẹo đổi chỗ, đổi dấu cho N có hàng trên 1, âm 1 và hàng dưới âm 1, 2. Chuyển vị là đổi hàng thành cột, còn ma trận đơn vị I hai là ma trận có số 1 trên đường chéo, số 0 chỗ khác, nhân vào đâu cũng giữ nguyên. Ta sẽ dùng lại đúng ma trận M này suốt bài hôm nay."

  - id: inverse
    kind: formula
    title: "Vì sao mẹo nghịch đảo hai nhân hai luôn đúng, và vai trò của định thức"
    checks:
      - "Rational(2)**-1 == Rational(1,2) and Rational(1,2)*2 == 1"
      - "Matrix([[1,-1],[-1,2]])*Matrix([[2,1],[1,1]]) == sp.eye(2) and Matrix([[2,1],[1,1]])*Matrix([[1,-1],[-1,2]]) == sp.eye(2)"
      - "1*2 + (-1)*1 == 1 and 1*1 + (-1)*1 == 0 and (-1)*2 + 2*1 == 0 and (-1)*1 + 2*1 == 1"
      - "(lambda a, b, c, d: sp.expand(Matrix([[d,-b],[-c,a]])*Matrix([[a,b],[c,d]]) - (a*d - b*c)*sp.eye(2)) == sp.zeros(2, 2))(*sp.symbols('a b c d'))"
      - "(lambda a, b, c, d: sp.simplify(Matrix([[a,b],[c,d]]).inv() - Matrix([[d,-b],[-c,a]])/(a*d - b*c)) == sp.zeros(2, 2))(*sp.symbols('a b c d'))"
      - "2*1 - 1*1 == 1 and Matrix([[2,1],[1,1]]).inv() == Matrix([[1,-1],[-1,2]])"
    steps:
      - clear: true
        show: |
          <p><b>Vì sao mẹo đúng?</b> Với $\ \mathbf{M} = \begin{bmatrix} a & b \\ c & d \end{bmatrix}$ và $\ \mathbf{N} = \begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$:</p>
          $$\mathbf{N}\mathbf{M} = \begin{bmatrix} da - bc & db - bd \\ -ca + ac & -cb + ad \end{bmatrix} = \begin{bmatrix} ad - bc & 0 \\ 0 & ad - bc \end{bmatrix} = (ad - bc)\,\mathbf{I}_2$$
        focus: [1, 1, 2, 2, 2]
        say: "Vì sao mẹo này luôn đúng? Viết M tổng quát với bốn chữ a, b, c, d, và N theo đúng mẹo. Nhân hàng với cột, hai số ngoài đường chéo bằng 0, vì b d trừ b d bằng 0, và a c trừ a c cũng bằng 0. Hai số trên đường chéo đều bằng a d trừ b c. Nên N nhân M bằng a d trừ b c, nhân I hai."
      - show: |
          <div class="box key">Chia cho $ad - bc$ (cần $ad - bc \neq 0$): &nbsp; $\mathbf{M}^{-1} = \dfrac{1}{ad - bc}\begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$</div>
          <p class="note">Con số $ad - bc$ gọi là <b>định thức</b> của $\mathbf{M}$. Với $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$ lúc nãy: $\ 2\cdot 1 - 1\cdot 1 = 1$, nên $\mathbf{M}^{-1} = \mathbf{N}$.</p>
        focus: [1, "1.2", 2, 2]
        say: "Muốn ra đúng I hai, ta chia N cho con số a d trừ b c, vì con số có thể đưa ra ngoài phép nhân, như ở bài 1. Phép chia này chỉ làm được khi a d trừ b c khác 0. Con số đó có tên là định thức của M. Với ma trận M bằng 2, 1, 1, 1 lúc nãy, 2 nhân 1 trừ 1 nhân 1 bằng 1, nên M nghịch đảo đúng bằng N."

  # ───────────────────────── 9. VÍ DỤ ─────────────────────────
  - id: sym_det
    kind: symbol
    title: "Giải mã ký hiệu: định thức det M = ad − bc"
    checks:
      - "2*1 - 1*1 == 1 and Matrix([[2, 1], [1, 1]]).det() == 1"
      - "Matrix([[1, 1], [1, Rational(6, 5)]]).det() == Rational(1, 5)"
    steps:
      - show: |
          $$\det \mathbf{M} = ad - bc \qquad \text{với} \quad \mathbf{M} = \begin{bmatrix} a & b \\ c & d \end{bmatrix}$$
          <p class="note">Chữ $\det$ đọc là “định thức”. Với $\mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$: $\ \det \mathbf{M} = 2 \cdot 1 - 1 \cdot 1 = 1$.</p>
        introduces: [det]
        focus: [1, 2]
        say: "Ký hiệu đê, e, tê, đọc là định thức, là con số a d trừ b c của ma trận hai nhân hai. Với M có hàng trên 2, 1 và hàng dưới 1, 1, định thức bằng 2 nhân 1 trừ 1 nhân 1, tức là 1."

  - id: det_area
    kind: intuition
    title: "Định thức là diện tích: gần 0 nghĩa là hình bị ép bẹp"
    checks:
      - "Matrix([[2, 1], [1, 1]]).det() == 1 and Matrix([[1, 1], [1, Rational(6, 5)]]).det() == Rational(1, 5)"
    steps:
      - show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><polygon points="150,330 350,230 450,130 250,230" fill="#bfe3c4" stroke="#2e7d32" stroke-width="4"/><line x1="150" y1="330" x2="350" y2="230" stroke="#c62828" stroke-width="6"/><line x1="150" y1="330" x2="250" y2="230" stroke="#1565c0" stroke-width="6"/><text x="370" y="290" font-size="28" fill="#c62828">cột 1 = (2, 1)</text><text x="10" y="205" font-size="28" fill="#1565c0">cột 2 = (1, 1)</text><text x="150" y="375" font-size="34" font-weight="bold">diện tích = 1: bình thường</text><polygon points="850,330 950,230 1050,110 950,210" fill="#f6c9c9" stroke="#c62828" stroke-width="4"/><line x1="850" y1="330" x2="950" y2="230" stroke="#c62828" stroke-width="6"/><line x1="850" y1="330" x2="950" y2="210" stroke="#1565c0" stroke-width="6"/><text x="1060" y="130" font-size="28" fill="#c62828">cột 1 = (1, 1)</text><text x="1060" y="185" font-size="28" fill="#1565c0">cột 2 = (1; 1,2)</text><text x="850" y="375" font-size="34" font-weight="bold">diện tích = 0,2: bị ép bẹp</text></svg></div>
        say: "Định thức có nghĩa hình học là diện tích hình bình hành dựng từ hai cột của ma trận, lấy giá trị tuyệt đối. Với ma trận M của ta, hai cột là 2, 1 và 1, 1, và hình bình hành có diện tích 1. Với ma trận gần suy biến, hai cột gần như song song, hình bị ép bẹp và diện tích chỉ còn 0 phẩy 2, nên chia cho nó làm mọi thứ phình to."

  - id: example
    kind: example
    title: "Ví dụ từng bước: tìm trọng số w từ giá nhà"
    checks:
      - "Matrix([[2,1],[1,1]])*Matrix([2,1]) == Matrix([5,3])"
      - "2*1 - 1*1 == 1"
      - "Matrix([[2,1],[1,1]]).inv() == Matrix([[1,-1],[-1,2]])"
      - "Matrix([[1,-1],[-1,2]])*Matrix([5,3]) == Matrix([2,1]) and 1*5 + (-1)*3 == 2 and (-1)*5 + 2*3 == 1"
    steps:
      - show: |
          <p>Đề: hai căn hộ, mỗi hàng là (diện tích, phòng ngủ); giá đã biết. Tìm trọng số $\hlo{\mathbf{w}} = (\hlo{w_1}, \hlo{w_2})^T$.</p>
          $$\begin{cases} 2\hlo{w_1} + 1\hlo{w_2} = 5 \\ 1\hlo{w_1} + 1\hlo{w_2} = 3 \end{cases} \quad\text{viết gọn:}\quad \underbrace{\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}}_{\mathbf{M}} \hlo{\mathbf{w}} = \underbrace{\begin{bmatrix} 5 \\ 3 \end{bmatrix}}_{\mathbf{b}}$$
        focus: [1, 1, 1, 2]
        say: "Giờ làm một ví dụ trọn vẹn, biết giá rồi đi tìm trọng số. Căn hộ thứ nhất rộng 2 chục mét vuông, 1 phòng ngủ, giá 5 trăm triệu. Căn thứ hai rộng 1 chục mét vuông, 1 phòng ngủ, giá 3 trăm triệu. Viết thành hệ hai phương trình, rồi viết gọn thành M nhân w bằng b."
      - show: |
          <p><b>①</b> Định thức: $\ ad - bc = 2\cdot 1 - 1\cdot 1 = \hlb{1} \neq 0$ → có nghịch đảo</p>
        say: "Bước một, kiểm tra định thức. a d trừ b c bằng 2 nhân 1 trừ 1 nhân 1, bằng 1, khác 0, nên M có nghịch đảo."
      - show: |
          <p><b>②</b> Nghịch đảo: $\ \mathbf{M}^{-1} = \dfrac{1}{\hlb{1}}\begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}$</p>
        say: "Bước hai, đổi chỗ, đổi dấu, rồi chia cho định thức là 1. M nghịch đảo có hàng trên 1, âm 1, hàng dưới âm 1, 2."
      - clear: true
        show: |
          <p><b>③</b> Nghiệm: $$\hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b} = \begin{bmatrix} 1\cdot 5 + (-1)\cdot 3 \\ (-1)\cdot 5 + 2\cdot 3 \end{bmatrix} = \hlg{\begin{bmatrix} 2 \\ 1 \end{bmatrix}}$$</p>
        say: "Bước ba, w bằng M nghịch đảo nhân b. Hàng 1, 1 nhân 5 cộng âm 1 nhân 3, bằng 2. Hàng 2, âm 1 nhân 5 cộng 2 nhân 3, bằng 1. Vậy w bằng 2, 1."
      - show: |
          <div class="box ok">Mỗi chục m² đáng $\hlg{2}$ trăm triệu, mỗi phòng ngủ đáng $\hlg{1}$ trăm triệu.</div>
        say: "Nghĩa là mỗi chục mét vuông đáng 2 trăm triệu, mỗi phòng ngủ đáng 1 trăm triệu. Đây chính là ý tưởng của hồi quy tuyến tính, học trọng số từ dữ liệu."

  # ───────────────────────── 10. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử để tự biết mình làm đúng"
    checks:
      - "Matrix([[1,-1],[-1,2]])*Matrix([[2,1],[1,1]]) == sp.eye(2)"
      - "Matrix([[2,1],[1,1]])*Matrix([2,1]) == Matrix([5,3]) and 2*2 + 1*1 == 5 and 1*2 + 1*1 == 3"
      - "(Matrix([[2,1],[1,1]])*Matrix([2,1])).shape == (2, 1)"
    steps:
      - show: |
          <p><b>Phép thử 1 — nhân lại phải ra $\mathbf{I}_2$:</b></p>
          $$\mathbf{M}^{-1}\mathbf{M} = \begin{bmatrix} 1 & -1 \\ -1 & 2 \end{bmatrix}\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix} = \begin{bmatrix} 2 - 1 & 1 - 1 \\ -2 + 2 & -1 + 2 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}\ \checkmark$$
        focus: [1, 2, 2]
        say: "Như ở bài 1, ta luôn tự kiểm tra. Phép thử một, theo định nghĩa, M nghịch đảo nhân M phải bằng I hai. Nhân hàng với cột, ta được hàng trên 1, 0, hàng dưới 0, 1, đúng là ma trận đơn vị."
      - show: |
          <p><b>Phép thử 2 — thay ngược vào đề:</b> $\ \mathbf{M}\hlg{\mathbf{w}} = \begin{bmatrix} 2\cdot 2 + 1\cdot 1 \\ 1\cdot 2 + 1\cdot 1 \end{bmatrix} = \begin{bmatrix} 5 \\ 3 \end{bmatrix} = \mathbf{b}\ \checkmark$</p>
        say: "Phép thử hai, thay w bằng 2, 1 ngược vào đề. Hàng 1, 2 nhân 2 cộng 1 nhân 1 bằng 5. Hàng 2, 1 nhân 2 cộng 1 nhân 1 bằng 3. Đúng bằng giá đã cho, nên nghiệm đúng."

  # ───────────────────────── 11. KHÔNG CÓ NGHỊCH ĐẢO ─────────────────────────

  # ───────────────────────── 12. LỖI THƯỜNG GẶP ─────────────────────────

  - id: quymo
    kind: example
    title: "Khi định thức tiến về 0: nghịch đảo phình to, nghiệm nhảy mạnh"
    checks:
      - "[(1 + t)/t for t in (Fraction(1, 10), Fraction(1, 100), Fraction(1, 10000))] == [11, 101, 10001]"
      - "[Fraction(1, 1000)/t for t in (Fraction(1, 10), Fraction(1, 100), Fraction(1, 10000))] == [Fraction(1, 100), Fraction(1, 10), 10]"
      - "np.linalg.det(np.array([[1.0, 1.0], [1.0, 1.0 + 1e-16]])) == 0.0 and 1.0 + 1e-16 == 1.0"
      - "Matrix([[1, 1], [1, 1 + Rational(1, 100)]]).inv() == Matrix([[101, -100], [-100, 100]])"
    steps:
      - show: |
          <p>Ma trận $\begin{bmatrix} 1 & 1 \\ 1 & 1 + t \end{bmatrix}$ có định thức đúng bằng $t$. Vế phải đổi thêm $0{,}001$ ở phần tử thứ hai (số minh hoạ):</p>
          <table class="t"><tr><th>$t$</th><th>số lớn nhất của nghịch đảo</th><th>nghiệm $\mathbf{w}$ đổi</th></tr>
          <tr><td>0,1</td><td>11</td><td>0,01</td></tr>
          <tr><td>0,01</td><td>101</td><td>0,1</td></tr>
          <tr><td>0,0001</td><td>10 001</td><td><b>10</b></td></tr>
          <tr><td>$10^{-16}$</td><td colspan="2">số thực thông dụng chỉ lưu khoảng 16 chữ số: máy coi $1 + t = 1$, định thức 0, hết nghịch đảo</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Xét ma trận có hàng trên 1, 1 và hàng dưới 1, 1 cộng t, với t là một số rất nhỏ, thì định thức của nó đúng bằng t. Với t bằng 0 phẩy 1, số lớn nhất trong ma trận nghịch đảo là 11, và nếu vế phải đổi 0 phẩy 001 thì nghiệm đổi 0 phẩy 01. Với t bằng 0 phẩy 01 con số lớn nhất là 101 và nghiệm đổi 0 phẩy 1. Với t bằng một phần mười nghìn, nghiệm đổi tới 10, gấp mười nghìn lần thay đổi ban đầu. Với t bằng mười mũ âm mười sáu, kiểu số thực thông dụng chỉ lưu khoảng 16 chữ số nên máy coi một cộng t bằng một, định thức thành 0 và không còn nghịch đảo."
      - clear: true
        show: |
          <div class="box key">Định thức gần 0 → nghịch đảo phình to → sai số nhỏ ở $\mathbf{b}$ thành sai số lớn ở $\mathbf{w}$. Cách giữ ổn định: kiểm định thức trước, hoặc cộng một số nhỏ vào đường chéo — kỹ thuật gọi là phạt L2, sẽ học ở bài 19.</div>
        say: "Khi định thức gần 0, nghịch đảo phình to, nên một sai số nhỏ ở vế phải thành sai số rất lớn ở nghiệm. Cách giữ ổn định là kiểm định thức trước, hoặc cộng một số nhỏ vào đường chéo, kỹ thuật gọi là phạt L2, sẽ học ở bài 19."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "Matrix([[1,2],[0,1]]).multiply_elementwise(Matrix([[3,1],[1,2]])) == Matrix([[3,2],[0,2]]) and Matrix([[3,2],[0,2]]) != Matrix([[5,5],[1,2]])"
      - "Matrix([[Rational(1,2),1],[1,1]])*Matrix([[2,1],[1,1]]) == Matrix([[2,Rational(3,2)],[3,2]]) and Matrix([[2,Rational(3,2)],[3,2]]) != sp.eye(2)"
      - "Matrix([5,3]).shape == (2, 1) and Matrix([[1,-1],[-1,2]]).shape == (2, 2) and Matrix([5,3]).shape[1] != Matrix([[1,-1],[-1,2]]).shape[0]"
      - "1*4 - 2*2 == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghịch đảo từng phần tử: với $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$, viết $\ \mathbf{M}^{-1} = \begin{bmatrix} \dfrac{1}{2} & 1 \\ 1 & 1 \end{bmatrix}$ <b class="red">(sai)</b>
          <br><span class="note">Phép thử 1 bắt được ngay: nhân lại với $\mathbf{M}$ thì</span>$$\begin{bmatrix} \dfrac{1}{2} & 1 \\ 1 & 1 \end{bmatrix}\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix} = \begin{bmatrix} 2 & \dfrac{3}{2} \\ 3 & 2 \end{bmatrix} \neq \mathbf{I}_2$$</div>
        say: "Lỗi thứ nhất, tưởng nghịch đảo là lấy một chia cho từng số. Với M bằng 2, 1, 1, 1, cách đó cho một phần hai, 1, 1, 1. Phép thử nhân lại bắt được ngay, vì kết quả không phải ma trận đơn vị."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Viết $\ \hlo{\mathbf{w}} = \mathbf{b}\,\mathbf{M}^{-1}$ <b class="red">(sai)</b>: nhân sai phía.
          <br><span class="note">Phép thử kích thước bắt được: $\sz{2}{\hl{1}}$ nhân $\sz{\hl{2}}{2}$, số ở trong 1 khác 2 nên không nhân được.</span></div>
        say: "Lỗi thứ hai, viết w bằng b nhân M nghịch đảo, tức là nhân sai phía. Phép thử kích thước bắt được lỗi này. b cỡ 2 nhân 1, M nghịch đảo cỡ 2 nhân 2, hai số ở trong là 1 và 2, không bằng nhau, nên không nhân được."
      - show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng công thức khi $ad - bc = 0$ <b class="red">(sai)</b>: chia cho 0.
          <br><span class="note">Luôn tính định thức <b>trước</b> (bước ① của ví dụ).</span></div>
        say: "Lỗi thứ ba, quên kiểm tra định thức, rồi chia cho 0 khi định thức bằng không. Vì vậy trong ví dụ, bước một luôn là tính định thức trước."

  # ───────────────────────── 13. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: giải M w = b"
    checks:
      - "4*1 - 2*1 == 2"
      - "Matrix([[4,2],[1,1]]).inv() == Rational(1,2)*Matrix([[1,-2],[-1,4]])"
      - "Matrix([[1,-2],[-1,4]])*Matrix([6,2]) == Matrix([2,2]) and 1*6 + (-2)*2 == 2 and (-1)*6 + 4*2 == 2 and Rational(1,2)*Matrix([2,2]) == Matrix([1,1])"
      - "Matrix([[4,2],[1,1]])*Matrix([1,1]) == Matrix([6,2])"
    steps:
      - show: |
          <p class="big">$\mathbf{M} = \begin{bmatrix} 4 & 2 \\ 1 & 1 \end{bmatrix}, \quad \mathbf{b} = (6, 2)^T$</p>
          <p>Tìm $\mathbf{M}^{-1}$, giải $\ \mathbf{M}\hlo{\mathbf{w}} = \mathbf{b}$, rồi chạy phép thử thay ngược.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, cho M có hàng trên 4, 2, hàng dưới 1, 1, và b bằng 6, 2. Hãy tìm M nghịch đảo, giải M nhân w bằng b, rồi chạy phép thử thay ngược. Bạn hãy dừng video, lấy giấy bút ra làm."
        pause: 60
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th></tr>
          <tr><td>① định thức</td><td>$ad - bc = 4\cdot 1 - 2\cdot 1 = 2$</td></tr>
          <tr><td>② nghịch đảo</td><td>$\mathbf{M}^{-1} = \dfrac{1}{2}\begin{bmatrix} 1 & -2 \\ -1 & 4 \end{bmatrix}$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Đáp án như sau, định thức bằng 4 nhân 1 trừ 2 nhân 1, bằng 2. Đổi chỗ, đổi dấu, rồi chia cho 2, M nghịch đảo bằng một phần hai nhân ma trận có hàng trên 1, âm 2, hàng dưới âm 1, 4."
      - clear: true
        show: |
          <p>③ $$\hlo{\mathbf{w}} = \dfrac{1}{2}\begin{bmatrix} 1\cdot 6 + (-2)\cdot 2 \\ (-1)\cdot 6 + 4\cdot 2 \end{bmatrix} = \dfrac{1}{2}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \hlg{\begin{bmatrix} 1 \\ 1 \end{bmatrix}}$$</p>
        say: "Nhân với b. Hàng 1, 6 trừ 4 bằng 2. Hàng 2, âm 6 cộng 8 bằng 2. Chia cho 2, được w bằng 1, 1."
      - show: |
          <p>Thử: $\ \mathbf{M}\hlg{\mathbf{w}} = (4 + 2,\ 1 + 1)^T = (6, 2)^T = \mathbf{b}\ \checkmark$</p>
        say: "Thử lại, M nhân 1, 1 bằng 4 cộng 2, và 1 cộng 1, tức là 6, 2, đúng bằng b. Nếu bạn ra đúng, chúc mừng, bạn đã nắm được phép nghịch đảo."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────

