          <tr><td>công thức hồi quy $(X^TX)^{-1}X^T\mathbf{y}$</td><td>$X = \begin{bmatrix} 1 & 1 \\ 1 & 2 \\ 1 & 3 \end{bmatrix}$, $\mathbf{y} = (2, 2, 4)^T$</td></tr>
