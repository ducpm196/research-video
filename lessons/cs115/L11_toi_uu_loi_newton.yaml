id: L11
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 11 — Tối ưu lồi & phương pháp Newton, ba cách thay thế khi Hessian quá đắt"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "DC23 Chương 3 (giới thiệu tối ưu lồi; phương pháp Newton); NN#Advanced-algorithms (Newton H⁻¹g, quasi-Newton, conjugate gradient, Levenberg-Marquardt H ≈ JᵀJ); tex#L138 (A5); CITED: Hestenes & Stiefel, J. Res. NBS 49 (1952) 409–436 (gradient liên hợp); Broyden, Fletcher, Goldfarb, Shanno (1970) (BFGS); Levenberg, Q. Appl. Math. 2 (1944) 164–168; Marquardt, J. SIAM 11 (1963) 431–441"
assumes: [vec, sub, cdot, implies, nabla, partial, prime, sqrt, zero_vec, dots, transpose, eta, mat, identity, inverse, hessian, jacobian, star]
# Quy ước ký hiệu (giữ đúng bài 7–10): bước lặp w_k; Hessian H_f in đậm (bài 7); hướng Newton d_k in đậm (vector);
#   hệ số giảm chấn của LM viết c (KHÔNG dùng μ — đã là “trung bình” ở bài 15 — cũng không dùng λ — đã là trị riêng ở bài 5);
#   phần dư r in đậm; t (0 ≤ t ≤ 1) là tỉ lệ trộn hai điểm trong định nghĩa hàm lồi; nhân hai số: ·.
# Lời đọc: “Newton” → lexicon “Niu-tơn” (B34 PARTIAL); tên Levenberg-Marquardt, BFGS, Gauss-Newton KHÔNG đọc (probe thất bại /
#   chưa probe) — chỉ hiện trên màn hình; lời đọc dùng tên mô tả “bình phương tối thiểu có giảm chấn” (damped least squares, CITED).
# Nối bài trước (nói lại khi dùng, luật 17): bài 3 (giải hệ bằng phép khử), bài 5 (trị riêng), bài 7 (Hessian, xấp xỉ bậc 2),
#   bài 8 (trị riêng dương → đáy; hàm x² + y² − xy + x − y đáy (−1/3, 1/3)), bài 9 (Gradient Descent), bài 10 (thung lũng x² + 25y²).
# Sửa nguồn: A5 (tex dòng 138: Cross-Entropy “đảm bảo địa hình lồi” chỉ đúng với mô hình tuyến tính theo w); A4 (đáy của ví dụ bài 8 là toàn cục).
objectives:
  - "Kiểm một hàm có lồi không bằng dây cung và bằng đạo hàm cấp 2 (hay trị riêng Hessian)"
  - "Giải thích vì sao với hàm lồi, đáy địa phương cũng là đáy toàn cục"
  - "Suy ra bước Newton từ phép xấp xỉ bậc 2 và tính tay 1–2 bước"
  - "Giải bước Newton nhiều chiều bằng hệ phương trình, không tính nghịch đảo"
  - "Nêu ba rủi ro của Newton và ý tưởng của quasi-Newton, gradient liên hợp, Levenberg-Marquardt"
