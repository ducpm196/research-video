scenes:
- id: hook
  kind: hook
  title: Một bước tới thẳng đáy?
  steps:
  - show: '<p class="big">Bài 10: thung lũng $x^2 + 25y^2$ — chia gradient cho <b>đúng độ cong</b> mỗi hướng thì một bước tới đáy.</p>

      '
    say: Chào bạn, cuối bài 10 có một hứa hẹn. Ở thung lũng x bình phương cộng 25 y bình phương, nếu chia gradient cho đúng độ cong của từng hướng, ta tới đáy chỉ trong một bước. Hôm nay ta xem cách làm điều đó.
  - show: '<table class="t"><tr><th>câu hỏi</th><th>trả lời</th></tr>

      <tr><td>Khi nào chắc chắn <b>không có đáy giả</b>?</td><td>hàm <b>lồi</b></td></tr>

      <tr><td>Dùng độ cong để bước thông minh hơn</td><td>phương pháp <b>Newton</b></td></tr>

      <tr><td>Khi Hessian quá đắt</td><td>ba ý tưởng thay thế</td></tr></table>

      <p class="note">Với AI: vẫn là bước ④ <b>tự sửa</b> của bài 0.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Hôm nay có ba câu hỏi. Một, khi nào chắc chắn không có đáy giả, nghĩa là mọi đáy đều thấp nhất, đó là khi hàm lồi. Hai, dùng độ cong để bước thông minh hơn, đó là phương pháp Newton. Ba, khi tính độ cong quá đắt thì làm gì.
- id: prereq
  kind: prereq
  title: 'Ôn bài 7, 8: độ cong và Hessian'
  checks:
  - '(lambda w: sp.diff((w - 3)**2, w, 2))(sp.Symbol(''w'')) == 2'
  - sorted(Matrix([[2,-1],[-1,2]]).eigenvals().keys()) == [1, 3]
  steps:
  - show: '<p>Bài 7: xấp xỉ bậc 2 quanh $w$: $\ f(w + h) \approx f(w) + f''(w)\, h + \frac{1}{2} f''''(w)\, h^2$</p>

      <p class="note">$f''''$ (đạo hàm cấp 2) đo <b>độ cong</b>; nhiều biến thì thành ma trận Hessian $\mathbf{H}_f$.</p>

      '
    focus:
    - 0
    - '1.2'
    - 2
    say: Ôn lại bài 7, nơi ta xấp xỉ hàm số bằng một parabol. F của w cộng h xấp xỉ f của w, cộng đạo hàm nhân h, cộng một nửa đạo hàm cấp 2 nhân h bình phương. Đạo hàm cấp 2 đo độ cong, và với nhiều biến nó thành ma trận Hessian.
  - show: '<p>Bài 8: Hessian có mọi trị riêng <b>dương</b> tại điểm dừng → đó là <b>đáy</b>. Ví dụ $\ \mathbf{H}_f = \begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$, trị riêng $1$ và $3$.</p>

      '
    say: Còn ở bài 8, ta học rằng nếu mọi trị riêng của Hessian tại điểm dừng đều dương, thì đó là một đáy. Ví dụ ma trận 2, âm 1, âm 1, 2 có trị riêng là 1 và 3, đều dương.
- id: convex
  kind: concept
  title: 'Hàm lồi: dây cung luôn nằm trên đồ thị'
  checks:
  - '(lambda f: f(3) == 0 and (f(0) + f(6))/2 == 9)(lambda w: (w - 3)**2)'
  - '(lambda f: f(0) == 0 and (f(-1) + f(1))/2 == -1)(lambda w: w**4 - 2*w**2)'
  steps:
  - show: "<div class=\"row\"><div class=\"col\"><svg width=\"420\" height=\"260\" viewBox=\"0 0 420 260\">\n  <line x1=\"20\" y1=\"230\" x2=\"400\" y2=\"230\" stroke=\"#9ca3af\" stroke-width=\"2\"/>\n  <path d=\"M 30 20 Q 210 440 390 20\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"5\"/>\n  <line x1=\"60\" y1=\"84\" x2=\"360\" y2=\"84\" stroke=\"#059669\" stroke-width=\"4\" stroke-dasharray=\"12 8\"/>\n  <text x=\"150\" y=\"50\" font-size=\"24\" fill=\"#059669\">dây cung ở trên</text>\n</svg><p class=\"note\"><b>Lồi</b>: $(w - 3)^2$</p></div>\n<div class=\"col\"><svg width=\"420\" height=\"290\" viewBox=\"0 0 420 290\">\n  <path d=\"M 30 30 C 52 169, 75 200, 98 200 C 116 200, 135 178, 154 161 C 172 143, 191 130, 210 130 C 229 130, 248 143, 266 161 C 285 178, 304 200, 322 200 C 345 200, 368 169, 390 30\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\n  <line x1=\"98\" y1=\"200\" x2=\"322\" y2=\"200\" stroke=\"#e11d48\" stroke-width=\"4\" stroke-dasharray=\"12 8\"/>\n  <text x=\"60\" y=\"280\" font-size=\"24\" fill=\"#e11d48\">dây cung ở dưới chỗ nhô giữa</text>\n</svg><p class=\"note\"><b>Không lồi</b>: $w^4 - 2w^2$ (hai đáy)</p></div></div>\n"
    say: Hàm lồi là hàm có đồ thị không chỗ nào cong xuống, như cái bát. Nối hai điểm bất kỳ trên đồ thị bằng một đoạn thẳng, gọi là dây cung, thì dây cung luôn nằm trên hoặc chạm đồ thị. Hàm có hai đáy như hình bên phải thì không lồi, vì dây cung nối hai đáy nằm dưới chỗ nhô lên ở giữa.
  - show: '<p>Làm thử ở điểm giữa:</p>

      <ul><li>$(w - 3)^2$ giữa $w = 0$ và $w = 6$: giữa đồ thị $f(3) = 0$ $\le$ giữa dây cung $\frac{9 + 9}{2} = 9$ ✓ lồi</li>

      <li>$w^4 - 2w^2$ giữa $w = -1$ và $w = 1$: $f(0) = 0$ $>$ $\frac{-1 + (-1)}{2} = -1$ → <b class="red">không lồi</b></li></ul>

      '
    focus:
    - 1
    - '2.1'
    - '2.2'
    say: Làm thử bằng số ở điểm giữa. Với w trừ 3 bình phương, giữa 0 và 6, đồ thị ở độ cao 0, còn dây cung ở độ cao 9, đồ thị thấp hơn, đúng là lồi. Với w mũ 4 trừ 2 w bình phương, giữa âm 1 và 1, đồ thị ở 0, cao hơn dây cung ở âm 1, nên không lồi.
- id: sym_convex
  kind: symbol
  title: 'Giải mã: định nghĩa hàm lồi và phép thử bằng đạo hàm cấp 2'
  checks:
  - '(lambda w: sp.expand(sp.diff(w**4 - 2*w**2, w, 2) - (12*w**2 - 4)))(sp.Symbol(''w'')) == 0'
  - 12*0**2 - 4 == -4
  - all(e > 0 for e in Matrix([[2,-1],[-1,2]]).eigenvals())
  steps:
  - show: '<div class="box key">Với mọi $a, b$ và mọi $t$ với $0 \le t \le 1$:

      $$f\big(t\,a + (1 - t)\,b\big) \;\le\; t\, f(a) + (1 - t)\, f(b)$$

      <span class="note">$t\,a + (1 - t)\,b$: một điểm nằm giữa $a$ và $b$ ($t = \frac{1}{2}$ là điểm giữa). Vế phải: độ cao của dây cung tại đó.</span></div>

      '
    say: Chữ t là một số từ 0 đến 1, cho biết ta đứng ở đâu giữa a và b, với t bằng một nửa là điểm giữa. Vế trái là độ cao của đồ thị tại đó, vế phải là độ cao của dây cung. Hàm lồi khi vế trái không bao giờ lớn hơn vế phải.
  - show: '<div class="box key"><b>Phép thử nhanh</b> (hàm có đạo hàm cấp 2): &nbsp; lồi $\iff f''''(w) \ge 0$ với <b>mọi</b> $w$. &nbsp; Nhiều biến: mọi trị riêng của $\mathbf{H}_f$ không âm, <b>ở mọi điểm</b>.</div>

      <p>$(w - 3)^2$: $f'''' = 2 \ge 0$ ✓. &nbsp; $w^4 - 2w^2$: $f'''' = 12w^2 - 4$, tại $w = 0$ bằng $\hl{-4}$ → không lồi. &nbsp; Bài 8: Hessian không đổi, trị riêng $1, 3$ → lồi.</p>

      '
    introduces:
    - iff
    focus:
    - 0
    - '1.2'
    - - '2.4'
      - '2.6'
    - '2.7'
    say: Có một phép thử nhanh hơn. Hàm lồi khi và chỉ khi, viết bằng mũi tên hai chiều, đạo hàm cấp 2 không âm ở mọi điểm, hay mọi trị riêng của Hessian không âm ở mọi điểm. Với hàm có hai đáy, đạo hàm cấp 2 tại 0 bằng âm 4, nên không lồi. Còn hàm của bài 8 có Hessian không đổi, trị riêng dương, nên lồi.
- id: convex_global
  kind: concept
  title: Vì sao hàm lồi chỉ có một mức đáy
  checks:
  - '(lambda w: [round(float(r), 2) for r in sorted(sp.Poly(4*w**3 - 4*w + 1, w).nroots()) if abs(sp.im(r)) < 1e-12])(sp.Symbol(''w'')) == [-1.11, 0.27, 0.84]'
  - '(lambda f: round(float(f(-1.1072)), 2) == -2.06 and round(float(f(0.8376)), 2) == -0.07)(lambda w: w**4 - 2*w**2 + w)'
  - '(lambda w0: (lambda xs: abs(xs[-1] - 0.8376) < 0.001)(((w := w0),) and [(w := w - 0.05*(4*w**3 - 4*w + 1)) for _ in range(200)]))(1.0)'
  steps:
  - show: '<div class="box key">Hàm lồi: <b>mọi đáy địa phương đều là đáy toàn cục</b> (thấp nhất trên cả miền).</div>

      <p class="note">Lý do: giả sử có một điểm khác thấp hơn. Dây cung nối đáy tới điểm đó đi xuống, và đồ thị nằm dưới dây cung — nên ngay cạnh đáy đã có chỗ thấp hơn, trái với “đáy địa phương”.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Tính chất quan trọng nhất của hàm lồi là mọi đáy địa phương đều là đáy toàn cục. Lý do như sau. Nếu có một điểm khác thấp hơn, dây cung từ đáy tới điểm đó đi xuống, và đồ thị nằm dưới dây cung, nên ngay cạnh đáy đã có chỗ thấp hơn. Điều đó trái với việc nó là đáy.
  - show: '<p><b>Không lồi thì có thể mắc kẹt</b>: $\ f(w) = w^4 - 2w^2 + w$</p>

      <table class="t"><tr><th>đáy</th><th>$w$</th><th>$f$</th></tr>

      <tr><td>địa phương</td><td>$\approx 0{,}84$</td><td>$\approx -0{,}07$</td></tr>

      <tr><td>toàn cục</td><td>$\approx -1{,}11$</td><td>$\approx \hlg{-2{,}06}$</td></tr></table>

      <p class="note">Gradient Descent ($\eta = 0{,}05$, 200 bước) xuất phát từ $w = 1$ dừng ở $\hl{0{,}84}$ — không bao giờ thấy đáy sâu hơn bên trái.</p>

      '
    focus:
    - - 1
      - 2
    - 3
    say: Còn với hàm không lồi, như w mũ 4 trừ 2 w bình phương cộng w, có một đáy nông ở khoảng 0 phẩy 84, và một đáy sâu hơn nhiều ở khoảng âm 1 phẩy 11. Chạy Gradient Descent từ w bằng 1, máy tính dừng ở đáy nông, không bao giờ thấy đáy sâu bên trái.
  - show: '<p class="note">Bài 8: hàm $x^2 + y^2 - xy + x - y$ lồi → đáy $\left(-\frac{1}{3}, \frac{1}{3}\right)$, $f = -\frac{1}{3}$ là đáy <b>toàn cục</b>, không chỉ địa phương.</p>

      '
    say: Hàm ở bài 8 có Hessian với trị riêng dương nên lồi, vì vậy đáy âm một phần ba, một phần ba là đáy toàn cục.
- id: newton_1d
  kind: formula
  title: 'Phương pháp Newton: nhảy tới đáy của parabol xấp xỉ'
  checks:
  - '(lambda w, h, a, b: sp.solve(sp.diff(a*h + b*h**2/2, h), h))(*sp.symbols(''w h''), *sp.symbols(''a b'', positive=True)) == [-sp.Symbol(''a'', positive=True)/sp.Symbol(''b'', positive=True)]'
  - 0 - (2*(0 - 3))/2 == 3
  - 1 - Rational(3, 5) == Rational(2, 5) and Rational(2,5) - (Rational(4,5) + Rational(8,125))/(2 + Rational(12,25)) == Rational(8, 155)
  - '(lambda xs: abs(xs[0] - 0.4) < 1e-12 and abs(xs[1] - 0.0516129) < 1e-6 and abs(xs[2] - 0.000136944) < 1e-8 and abs(xs[3] - 2.6e-12) < 1e-13)(((w := 1.0),) and [(w := w - (2*w + w**3)/(2 + 3*w**2)) for _ in range(4)])'
  - '(lambda xs: [len(f''{v:.20f}''.split(''.'')[1]) - len(f''{v:.20f}''.split(''.'')[1].lstrip(''0'')) for v in xs[1:]] == [1, 3, 11])(((w := 1.0),) and [(w := w - (2*w + w**3)/(2 + 3*w**2)) for _ in range(4)])'
  - '(lambda xs: [round(x, 3) for x in xs[:3]] == [0.25, 0.121, 0.06])(((w := 1.0),) and [(w := w - 0.25*(2*w + w**3)) for _ in range(4)])'
  steps:
  - show: '<p><b>Bước 1.</b> Thay $f$ bằng parabol xấp xỉ của bài 7: $\ q(h) = f(w) + f''(w)\, h + \frac{1}{2} f''''(w)\, h^2$</p>

      <p><b>Bước 2.</b> Đáy của parabol: cho đạo hàm theo $h$ bằng 0 ($\implies$ đọc là “suy ra”): $\ f''(w) + f''''(w)\, h = 0 \implies h = -\dfrac{f''(w)}{f''''(w)}$</p>

      <div class="box key"><b>Newton</b>: $\quad w_{k+1} = w_k - \dfrac{f''(w_k)}{f''''(w_k)}$ &nbsp; (cần $f''''(w_k) > 0$)</div>

      '
    focus:
    - '1.3'
    - 2
    say: Ý tưởng của Newton là thay hàm bằng parabol xấp xỉ của bài 7, rồi nhảy thẳng tới đáy của parabol đó. Vì ở đáy đạo hàm bằng 0, nên ta đạo hàm theo h và cho bằng 0, suy ra bằng chuyển vế h bằng âm đạo hàm chia cho đạo hàm cấp 2.
  - show: '<p><b>Làm thử</b> $f = (w - 3)^2$ từ $w_0 = 0$: $\ w_1 = 0 - \dfrac{2\cdot(0 - 3)}{2} = \hlg{3}$ — <b>một bước</b> tới đáy (hàm đúng là parabol).</p>

      <p class="note">So với bài 9: Gradient Descent cần nhiều bước, mỗi bước giảm một nửa khoảng cách.</p>

      '
    focus:
    - 1
    - '1.4'
    - 2
    say: Làm thử với hàm w trừ 3 bình phương từ w bằng 0. Đạo hàm bằng âm 6, đạo hàm cấp 2 bằng 2, nên w một bằng 0 cộng 3, bằng 3, tới đáy chỉ trong một bước. Lý do là hàm này đúng là một parabol, nên phép xấp xỉ không sai chút nào.
  - clear: true
    show: '<p>Hàm không phải parabol: $\ f = w^2 + \frac{1}{4}w^4$, $\ f'' = 2w + w^3$, $\ f'''' = 2 + 3w^2$, đáy tại $0$, từ $w_0 = 1$:</p>

      <table class="t"><tr><th>bước</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>

      <tr><td>Newton</td><td>0,4</td><td>0,052</td><td>0,00014</td><td>$\hlg{0{,}0000000000026}$</td></tr>

      <tr><td>Gradient Descent ($\eta = 0{,}25$)</td><td>0,25</td><td>0,121</td><td>0,060</td><td>0,030</td></tr></table>

      <p class="note">Số chữ số 0 sau dấu phẩy của Newton: 1 → 3 → 11, <b>tăng vọt</b>; Gradient Descent mỗi bước chỉ giảm một nửa.</p>

      '
    focus:
    - 1
    - '2.2'
    - - 3
      - '2.3'
    say: Với một hàm không phải parabol, Newton cần vài bước, vì parabol chỉ xấp xỉ hàm, nhưng rất nhanh. Từ 1, nó đi tới 0 phẩy 4, rồi 0 phẩy 052, rồi 0 phẩy 00014. Số chữ số 0 sau dấu phẩy tăng vọt, từ 1 lên 3, rồi 11, còn Gradient Descent mỗi bước chỉ giảm một nửa.
- id: newton_nd
  kind: example
  title: 'Newton nhiều chiều: giải một hệ phương trình'
  checks:
  - Matrix([[2,0],[0,50]]).LUsolve(-Matrix([2,50])) == Matrix([-1,-1])
  - Matrix([[2,-1],[-1,2]]).LUsolve(-Matrix([1,-1])) == Matrix([Rational(-1,3), Rational(1,3)])
  - '(lambda x, y: (x**2 + y**2 - x*y + x - y).subs({x: Rational(-1,3), y: Rational(1,3)}))(*sp.symbols(''x y'')) == Rational(-1,3)'
  - 2*Rational(-1,3) - Rational(1,3) == -1 and -Rational(-1,3) + 2*Rational(1,3) == 1
  steps:
  - show: '<div class="box key">Chia cho $f''''$ thành <b>giải hệ</b>: $\quad \mathbf{H}_f\,\mathbf{d}_k = -\nabla f(\mathbf{w}_k), \qquad \mathbf{w}_{k+1} = \mathbf{w}_k + \mathbf{d}_k$</div>

      <p class="note">$\mathbf{d}_k$: hướng Newton. Giải bằng phép khử của bài 3, không cần tính $\mathbf{H}_f^{-1}$.</p>

      '
    focus:
    - 1
    - '1.3'
    - 2
    say: Với nhiều biến, phép chia cho đạo hàm cấp 2 trở thành giải một hệ phương trình. Hessian nhân với hướng Newton d bằng gradient đổi dấu. Ta giải hệ đó bằng phép khử của bài 3, không cần tính ma trận nghịch đảo.
  - show: '<p><b>Thung lũng bài 10</b>, từ $(1, 1)$: $\ \mathbf{H}_f = \begin{bmatrix} 2 & 0 \\ 0 & 50 \end{bmatrix}$, $\ \nabla f = (2, 50)^T$ → $\ \mathbf{d} = (-1, -1)^T$ → tới $\hlg{(0, 0)}$ trong một bước.</p>

      '
    say: Với thung lũng dẹt của bài 10, từ điểm 1, 1, Hessian có 2 và 50 trên đường chéo, gradient là 2 và 50. Giải hệ được hướng âm 1, âm 1, và ta tới thẳng đáy 0, 0 trong một bước.
  - show: '<p><b>Hàm bài 8</b>, từ $(0, 0)$: $\ \nabla f = (1, -1)^T$. Giải $\ \begin{cases} 2d_1 - d_2 = -1 \\ -d_1 + 2d_2 = 1 \end{cases}$ → $\ \mathbf{d} = \left(-\frac{1}{3}, \frac{1}{3}\right)^T$</p>

      <p>→ tới $\hlg{\left(-\frac{1}{3}, \frac{1}{3}\right)}$, đúng đáy, <b>một bước</b> (bài 9: Gradient Descent cần nhiều bước nhảy qua lại).</p>

      '
    focus:
    - '1.3'
    - - '1.4'
      - '1.5'
    - 2
    say: Với hàm của bài 8 từ gốc, gradient là 1, âm 1. Giải hệ hai phương trình bằng phép khử, ta được hướng âm một phần ba, một phần ba. Một bước là tới đúng đáy, trong khi ở bài 9, Gradient Descent cần nhiều bước nhảy qua lại.
  - show: '<p><b>Chạy thử Python — giải các bước Newton 1 chiều tới nghiệm trong nháy mắt:</b></p><div class="code"><div>x = 2.0</div><div>for _ in range(4): x -= (x*x - 2) / (2*x)</div><div>print(round(x, 6))</div></div>'
    say: Chạy Python chỉ sau bốn bước Newton đã tìm được căn hai chính xác tới sáu chữ số.
    clear: true
    focus: null
- id: verify
  kind: check
  title: 'Phép thử: gradient tại điểm mới phải bằng 0'
  checks:
  - '(lambda x, y: (2*x - y + 1, 2*y - x - 1))(Rational(-1,3), Rational(1,3)) == (0, 0)'
  steps:
  - show: '$$\nabla f\left(-\frac{1}{3}, \frac{1}{3}\right) = \left(2\cdot\left(-\frac{1}{3}\right) - \frac{1}{3} + 1,\ \ 2\cdot\frac{1}{3} + \frac{1}{3} - 1\right)^T = (0, 0)^T\ \checkmark$$

      '
    say: Phép thử, thay điểm mới vào gradient. Thành phần đầu bằng âm hai phần ba trừ một phần ba cộng 1, bằng 0. Thành phần sau bằng hai phần ba cộng một phần ba trừ 1, cũng bằng 0. Vậy đúng là điểm dừng, và vì hàm lồi nên đó là đáy toàn cục.
- id: risks
  kind: concept
  title: Newton không phải lúc nào cũng an toàn
  checks:
  - Matrix([[2,0],[0,-2]]).LUsolve(-Matrix([2,-2])) == Matrix([-1,-1])
  - '(lambda x, y: ((x**2 - y**2).subs({x: 1, y: 1}), (x**2 - y**2).subs({x: 0, y: 0})))(*sp.symbols(''x y'')) == (0, 0)'
  - 1 - (-2*1)/(-2) == 0
  - (10**6)**2 == 10**12 and (10**6)**2 * 8 / 10**12 == 8
  steps:
  - show: '<div class="box warn"><b>Rủi ro 1</b>: Hessian <b>không</b> xác định dương (xác định dương = mọi trị riêng dương, nhớ từ bài 8) → Newton có thể đi tới yên ngựa hay đỉnh.

      <br><span class="note">$x^2 - y^2$ từ $(1, 1)$: $\ \mathbf{H}_f = \begin{bmatrix} 2 & 0 \\ 0 & -2 \end{bmatrix}$, $\ \mathbf{d} = (-1, -1)^T$ → nhảy thẳng vào <b>yên ngựa</b> $(0, 0)$. &nbsp; $-w^2$ từ $w = 1$: tới $w = 0$ là <b>đỉnh</b>.</span></div>

      '
    say: Phương pháp Newton có ba điểm yếu cần biết. Thứ nhất, nếu Hessian không xác định dương, Newton có thể đi tới yên ngựa hay đỉnh. Với hàm x bình phương trừ y bình phương từ điểm 1, 1, nó nhảy thẳng vào yên ngựa ở gốc. Vì nó chỉ tìm chỗ bằng phẳng của parabol, không phân biệt đáy hay đỉnh.
  - show: '<div class="box warn"><b>Rủi ro 2</b>: Hessian <b>suy biến</b> (hạng thiếu, bài 3) → hệ không có đúng một nghiệm. Hessian của mạng nơ-ron có thể rơi vào trường hợp này.</div>

      <div class="box warn"><b>Rủi ro 3</b>: quá đắt. $10^6$ trọng số → Hessian có $10^{12}$ ô; 8 byte (8 đơn vị nhớ nhỏ) mỗi ô → khoảng 8 000 tỉ byte (8 TB) bộ nhớ.</div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Thứ hai, nếu Hessian suy biến, tức hạng bị thiếu như bài 3, hệ không có đúng một nghiệm. Thứ ba là chi phí tính toán quá lớn, vì một triệu trọng số cho Hessian một nghìn tỉ ô. Mỗi ô chiếm 8 đơn vị nhớ nhỏ, nên tổng cộng cỡ 8 nghìn tỉ đơn vị, con số trên màn hình, vượt xa bộ nhớ của một máy tính thông thường.
- id: alternatives
  kind: concept
  title: 'Khi Hessian quá đắt: quasi-Newton, gradient liên hợp, Levenberg-Marquardt'
  checks:
  - '(lambda t: sp.expand((1 - 2*t)**2 + 25*(1 - 50*t)**2 - (26 - 2504*t + Rational(125008, 2)*t**2)) == 0 and sp.solve(sp.diff((1 - 2*t)**2 + 25*(1 - 50*t)**2, t), t) == [Rational(2504, 125008)])(sp.Symbol(''t''))'
  - '(lambda J, r, c, d1, d2: (lambda d: sp.simplify(Matrix([sp.diff(sp.Rational(1, 2)*(r + J*d).dot(r + J*d) + sp.Rational(1, 2)*c*d.dot(d), v) for v in (d1, d2)]) - ((J.T*J + c*sp.eye(2))*d + J.T*r)) == sp.zeros(2, 1))(Matrix([d1, d2])))(Matrix([[1, 2], [3, 4]]), Matrix([1, 1]), 3, *sp.symbols(''d1 d2''))'
  - '(lambda A: (lambda x1: x1 == Matrix([Rational(7500,7813), Rational(-12,7813)]))(Matrix([1,1]) + ((Matrix([-2,-50]).T*Matrix([-2,-50]))[0]/(Matrix([-2,-50]).T*A*Matrix([-2,-50]))[0])*Matrix([-2,-50])))(Matrix([[2,0],[0,50]]))'
  - '(lambda A, g: (g.T*g)[0] == 2504 and (g.T*A*g)[0] == 125008 and Rational(2504, 125008) == Rational(313, 15626) and (Matrix([-2,-50]).T*A*(Matrix([0,0]) - Matrix([Rational(7500,7813), Rational(-12,7813)])))[0] == 0)(Matrix([[2,0],[0,50]]), Matrix([2,50]))'
  - '(lambda a, c: sp.simplify(sp.hessian(sum((a*xi + c - yi)**2 for xi, yi in ((0,1),(1,3),(2,7)))/2, (a, c)) - (Matrix([[0,1],[1,1],[2,1]]).T*Matrix([[0,1],[1,1],[2,1]]))) == sp.zeros(2, 2))(*sp.symbols(''a c''))'
  - '(lambda J, r: (lambda d: abs(d[0]*10**4 - 3.5) < 0.01 and abs(d[1]*10**4 - 0.5) < 0.01)(np.linalg.solve(J.T@J + 1e4*np.eye(2), -J.T@r)))(np.array([[0.,1],[1,1],[2,1]]), np.array([1.,0.5,-2.]))'
  steps:
  - show: '<table class="t"><tr><th>Ý tưởng</th><th>Thay Hessian bằng gì</th></tr>

      <tr><td><b>Quasi-Newton</b> (vd. BFGS: một cách xấp xỉ Hessian)</td><td>một <b>ước lượng</b> dựng dần từ độ thay đổi của gradient — chỉ cần gradient</td></tr>

      <tr><td><b>Gradient liên hợp</b></td><td>đi lần lượt theo các hướng “không phá” nhau; với hàm bậc 2 có Hessian xác định dương và $n$ biến tới đáy sau tối đa $n$ bước (nếu tính không làm tròn)</td></tr>

      <tr><td><b>Levenberg-Marquardt</b></td><td>hàm sai số dạng một nửa tổng bình phương: $\ \mathbf{H}_f \approx \mathbf{J}^T\mathbf{J}$ (Jacobian của phần dư)</td></tr></table>

      '
    say: Khi Hessian quá đắt, có ba ý tưởng thay thế. Nhóm tựa Newton dựng dần một ước lượng của Hessian từ độ thay đổi của gradient. Gradient liên hợp đi lần lượt theo các hướng không phá nhau. Và phương pháp bình phương tối thiểu có giảm chấn thay Hessian bằng J chuyển vị nhân J.
  - clear: true
    show: '<p><b>Gradient liên hợp</b> trên thung lũng bài 10 ($A = \begin{bmatrix} 2 & 0 \\ 0 & 50 \end{bmatrix}$) từ $(1, 1)$: bước đầu đi theo hướng $-g$, với $g$ là gradient $(2, 50)$, một đoạn $t$. Vì $f(\mathbf{w} - t\,g) = f(\mathbf{w}) - t\,g^Tg + \frac{1}{2}t^2\,g^TAg$, đạo hàm theo $t$ bằng 0 cho $t = \dfrac{g^Tg}{g^T A g} = \dfrac{2504}{125008}$ (đoạn làm $f$ thấp nhất dọc theo hướng đó).</p>

      '
    say: Làm thử gradient liên hợp trên thung lũng dẹt. Bước đầu đi theo hướng ngược gradient, một đoạn t. Hàm tại điểm mới bằng hàm cũ, trừ t nhân gradient nhân chính nó, cộng một nửa t bình phương nhân gradient nhân Hessian nhân gradient. Cho đạo hàm theo t bằng 0, ta được t bằng gradient nhân chính nó, chia cho gradient nhân Hessian nhân gradient, ở đây là 2504 chia 125008.
  - show: '<p>Bước 1 tới $\left(\frac{7500}{7813}, -\frac{12}{7813}\right) \approx (0{,}96;\ -0{,}0015)$, bước 2 tới đúng $\hlg{(0, 0)}$ — 2 biến, 2 bước. Hai hướng “không phá nhau” (liên hợp) khi $d_1^T A\, d_2 = 0$.</p>

      '
    say: Bước một đã đưa hướng y về gần 0, còn bước hai tới đúng đáy, vì hai hướng liên hợp, tức hướng sau không phá kết quả của hướng trước.
  - clear: true
    show: '<div class="box key"><b>Levenberg-Marquardt</b> (còn gọi là <b>bình phương tối thiểu có giảm chấn</b>): $\ (\mathbf{J}^T\mathbf{J} + c\,\mathbf{I})\,\mathbf{d} = -\mathbf{J}^T\mathbf{r}$, &nbsp; $c > 0$

      <br><span class="note">$\mathbf{r}$: phần dư (dự đoán − thật). $c$ nhỏ → gần Newton cho tổng bình phương; $c$ lớn → bước nhỏ theo hướng $-\mathbf{J}^T\mathbf{r}$ (chính là hướng Gradient Descent).

      <br><span class="note">Suy ra: phần dư mới $\mathbf{r}(\mathbf{w} + \mathbf{d}) \approx \mathbf{r} + \mathbf{J}\mathbf{d}$; đạo hàm của $\frac{1}{2}(\mathbf{r} + \mathbf{J}\mathbf{d})^T(\mathbf{r} + \mathbf{J}\mathbf{d}) + \frac{1}{2}c\,\mathbf{d}^T\mathbf{d}$ theo $\mathbf{d}$ là $\mathbf{J}^T(\mathbf{r} + \mathbf{J}\mathbf{d}) + c\,\mathbf{d}$; cho bằng $\mathbf{0}$ thì ra hệ trên. (Dùng: đạo hàm của $\frac{1}{2}\mathbf{d}^T\mathbf{A}\mathbf{d}$ theo $\mathbf{d}$ là $\mathbf{A}\mathbf{d}$ khi $\mathbf{A}$ đối xứng; ở đây $\mathbf{A} = \mathbf{J}^T\mathbf{J} + c\,\mathbf{I}$.)</span></div>

      <p class="note">$\mathbf{H}_f = \mathbf{J}^T\mathbf{J}$ <b>đúng hẳn</b> khi phần dư tuyến tính theo trọng số (máy đã kiểm, với hàm sai số = một nửa tổng bình phương phần dư; không có một nửa thì Hessian gấp đôi, bước $\mathbf{d}$ không đổi); phi tuyến thì chỉ xấp xỉ.</p>

      '
    focus:
    - '1.3'
    - '1.5'
    - '1.5'
    - '1.5'
    - '1.5'
    - 2
    say: 'Phương pháp bình phương tối thiểu có giảm chấn giải một hệ, J chuyển vị J cộng c nhân I, nhân d bằng âm J chuyển vị nhân phần dư. Hệ số c nhỏ thì nó gần Newton, c lớn thì nó bước nhỏ theo đúng hướng Gradient Descent. Lý do: phần dư mới xấp xỉ bằng r cộng J d. Đạo hàm của nửa tổng bình phương, cộng nửa c d bình phương, theo d là J chuyển vị nhân r cộng J d, cộng c d. Cho bằng 0 thì ra hệ trên. Phép xấp xỉ Hessian đúng hẳn khi phần dư tuyến tính theo trọng số, với hàm sai số là một nửa tổng bình phương phần dư.'
- id: in_ai
  kind: concept
  title: Lồi và không lồi trong học máy
  steps:
  - show: '<table class="t"><tr><th>bài</th><th>lồi hay không</th></tr>

      <tr><td><b>Bài 18</b> (hồi quy tuyến tính)</td><td>sai số bình phương là hàm <b>lồi</b> theo trọng số; một bước Newton cho đúng nghiệm “phương trình chuẩn” (hệ phương trình cho nghiệm của hồi quy tuyến tính)</td></tr>

      <tr><td><b>Bài 20</b>, <b>bài 23</b></td><td>logistic với Cross-Entropy lồi khi mô hình <b>tuyến tính</b> theo trọng số; mạng nơ-ron nhiều lớp thì <b>không lồi</b></td></tr></table>

      '
    forward_ref: true
    focus:
    - '1.2'
    - '1.3'
    say: Ở bài 18, cách dự đoán giá nhà bằng mô hình tuyến tính có sai số bình phương là hàm lồi, và một bước Newton cho đúng nghiệm. Ở bài 20 và 23, hàm sai số kiểu mới lồi khi mô hình tuyến tính, nhưng mạng nơ-ron nhiều lớp thì không.
- id: quymo
  kind: example
  title: 'Khi số biến tăng: Newton và Gradient Descent, ai thắng?'
  checks:
  - '[(n**3 - n)//3 for n in (2, 1000, 10**6)] == [2, 333333000, 333333333333000000]'
  - '[173*4, 6908*10**6, 6908*10**12] == [692, 6908000000, 6908000000000000]'
  - '[min(k for k in range(1, 10**5) if ((c - 1)/(c + 1))**k < 1e-6) for c in (25, 1000)] == [173, 6908]'
  - round(333333333333000000/10**9/(365.25*86400), 1) == 10.6 and round(6908*10**12/10**9/86400) == 80 and round(333333000/10**9, 2) == 0.33
  - 'Matrix([[2, 0], [0, 50]]).eigenvals() == {2: 1, 50: 1} and 50 // 2 == 25'
  steps:
  - show: '<p>Hàm bậc hai <b>dày đặc</b> (Hessian có gần hết các ô khác 0), $n$ biến: một lần tính gradient tốn $n^2$ phép nhân; một bước Newton (giải hệ) tốn cỡ $\dfrac{n^3 - n}{3}$. Gradient Descent (tốc độ học $\eta$ tốt nhất, chạy đến khi sai số còn $10^{-6}$) cần số bước tuỳ <b>độ dẹt</b> = trị riêng lớn nhất chia nhỏ nhất của Hessian (thung lũng bài 10: $50 / 2 = 25$). Số minh hoạ.</p>

      <table class="t"><tr><th>$n$, độ dẹt</th><th>Newton, 1 bước</th><th>Gradient Descent, đủ bước</th></tr>

      <tr><td>2, độ dẹt 25</td><td>2</td><td>173 bước × 4 = 692</td></tr>

      <tr><td>1 000, độ dẹt 1 000</td><td>333 triệu</td><td>6 908 bước × $10^6$ = 6,9 tỉ</td></tr>

      <tr><td>1 000 000, độ dẹt 1 000</td><td>333 triệu tỉ</td><td>6 908 bước × $10^{12}$ = 6,9 triệu tỉ</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    say: Hàm bậc hai dày đặc là hàm có Hessian gần hết các ô khác 0. Một lần tính gradient tốn n bình phương phép nhân, một bước Newton giải hệ tốn cỡ n lập phương chia 3. Gradient Descent dùng tốc độ học tốt nhất, chạy đến khi sai số còn một phần triệu. Số bước phụ thuộc độ dẹt, tức tỉ số trị riêng lớn nhất và nhỏ nhất của Hessian. Thung lũng bài 10 có độ dẹt 25, nên cần 173 bước, tốn 692 phép nhân, so với 2 phép của Newton. Với một nghìn biến và độ dẹt một nghìn, Newton tốn 333 triệu phép, còn Gradient Descent tốn 6,9 tỉ phép. Với một triệu biến, Newton tốn 333 triệu tỉ phép, còn Gradient Descent tốn 6,9 triệu tỉ phép.
  - clear: true
    show: '<p>Máy làm <b>1 tỉ</b> phép nhân mỗi giây (số minh hoạ):</p>

      <table class="t"><tr><th>$n$, độ dẹt</th><th>Newton</th><th>Gradient Descent</th></tr>

      <tr><td>1 000, 1 000</td><td>0,33 giây</td><td>6,9 giây</td></tr>

      <tr><td>1 000 000, 1 000</td><td>≈ <b>10,6 năm</b></td><td>≈ <b>80 ngày</b></td></tr></table>

      <div class="box key">Số biến nhỏ, hàm rất dẹt: Newton thắng. Số biến cực lớn: chỉ cách dùng gradient đi nổi.</div>

      '
    focus:
    - '2.2'
    - '2.3'
    - 3
    say: Với máy làm một tỉ phép nhân mỗi giây, số minh hoạ, ở một nghìn biến Newton mất một phần ba giây còn Gradient Descent mất gần bảy giây. Ở một triệu biến, Newton mất khoảng mười năm rưỡi, còn Gradient Descent mất khoảng tám mươi ngày. Vậy Newton thắng khi số biến nhỏ và hàm rất dẹt, còn với số biến cực lớn chỉ dùng được gradient.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ Newton luôn đi xuống <b class="red">(sai)</b>

      <br><span class="note">Nó đi tới chỗ phẳng của parabol xấp xỉ: Hessian không xác định dương thì có thể là yên ngựa hay đỉnh.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ rằng Newton luôn đi xuống, trong khi nó chỉ đi tới chỗ phẳng của parabol xấp xỉ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tính $\mathbf{H}_f^{-1}$ rồi nhân <b class="red">(không nên)</b>

      <br><span class="note">Giải hệ bằng phép khử (bài 3): rẻ hơn, và vẫn chạy được khi cần xử lý trường hợp đặc biệt.</span>

      $$\mathbf{H}_f\,\mathbf{d} = -\nabla f$$</div>

      '
    say: Lỗi thứ hai, tính ma trận nghịch đảo của Hessian rồi nhân. Hãy giải hệ phương trình bằng phép khử của bài 3, vì cách đó rẻ hơn.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> “Hàm lồi thì Gradient Descent luôn tới đáy, $\eta$ nào cũng được” <b class="red">(sai)</b>

      <br><span class="note">Bài 9: với $(w - 3)^2$, $\eta = 1{,}1$ vẫn phân kỳ. Lồi chỉ đảm bảo không có đáy giả, không đảm bảo bước đúng.</span></div>

      '
    say: Lỗi thứ ba, nghĩ rằng hàm lồi thì Gradient Descent luôn tới đáy với eta nào cũng được. Ở bài 9, hàm w trừ 3 bình phương là lồi, nhưng eta bằng 1 phẩy 1 vẫn phân kỳ. Lồi chỉ đảm bảo không có đáy giả.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Câu hay gặp: Cross-Entropy (một hàm sai số dùng cho bài toán phân loại, sẽ học sau) “đảm bảo địa hình lồi” <b class="red">(thiếu điều kiện)</b>

      <br><span class="note">Chỉ đúng khi mô hình tuyến tính theo trọng số (như mô hình logistic, một mô hình phân loại sẽ học sau). Mạng nhiều lớp dùng Cross-Entropy vẫn không lồi.</span></div>

      '
    say: Lỗi thứ tư, tin câu hay gặp rằng một loại hàm sai số dùng cho bài toán phân loại, sẽ học sau, đảm bảo địa hình lồi. Điều đó chỉ đúng khi mô hình tuyến tính theo trọng số, còn mạng nơ-ron nhiều lớp vẫn không lồi.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 2 - Rational(2*2 + 2**3, 2 + 3*2**2) == Rational(8, 7) and 2*2 + 2**3 == 12 and 2 + 3*2**2 == 14
  - '(lambda w: sp.diff(w**4 - 2*w**2, w, 2).subs(w, 0))(sp.Symbol(''w'')) == -4'
  - '(lambda w: sp.diff(w**4 - 2*w**2, w) == 4*w**3 - 4*w and sp.diff(w**2 + w**4/4, w) == 2*w + w**3 and sp.diff(w**2 + w**4/4, w, 2) == 2 + 3*w**2)(sp.Symbol(''w'')) and 2 - Rational(12, 14) == 2 - Rational(6, 7) == Rational(8, 7)'
  - '(lambda g: g(0) == 0 and (g(-1) + g(1))/2 == -1 and g(0) > (g(-1) + g(1))/2)(lambda w: w**4 - 2*w**2)'
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>$f = w^2 + \frac{1}{4}w^4$: làm một bước Newton từ $w_0 = 2$.</td></tr>

      <tr><td>2</td><td>$g(w) = w^4 - 2w^2$ có lồi không? Dùng phép thử đạo hàm cấp 2.</td></tr></table>

      '
    say: Bây giờ đến lượt bạn, với hai câu. Câu một, với hàm w bình phương cộng một phần tư w mũ 4, làm một bước Newton từ w bằng 2. Câu hai, hàm w mũ 4 trừ 2 w bình phương có lồi không? Hãy dừng video và làm ra giấy.
    pause: 60
  - show: '<p>① $f'' = 2w + w^3$, $\ f'''' = 2 + 3w^2$. Tại $w_0 = 2$:</p>

      $$f''(2) = 4 + 8 = 12, \qquad f''''(2) = 2 + 12 = 14$$

      <p>$w_1 = 2 - \frac{12}{14} = 2 - \frac{6}{7} = \hlg{\frac{8}{7}} \approx 1{,}14$</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Câu một, đạo hàm là 2 w cộng w mũ 3, đạo hàm cấp 2 là 2 cộng 3 w bình phương. Tại 2, đạo hàm bằng 4 cộng 8, bằng 12, còn đạo hàm cấp 2 bằng 2 cộng 12, bằng 14. Theo công thức Newton, w một bằng 2 trừ 12 phần 14, bằng tám phần bảy.
  - clear: true
    show: '<p>② $g'' = 4w^3 - 4w$, $\ g'''' = 12w^2 - 4$:</p>

      $$g''''(0) = 12\cdot 0 - 4 = -4 < 0$$

      <p>→ có chỗ cong xuống → <b>không lồi</b> (nó có hai đáy). Kiểm bằng dây cung: $\ g(0) = 0 > \dfrac{g(-1) + g(1)}{2} = -1\ \checkmark$</p>

      '
    focus:
    - 1
    - 2
    say: Câu hai, lấy đạo hàm hai lần, được 12 w bình phương trừ 4. Tại 0, nó bằng âm 4, âm, nên hàm cong xuống ở đó và không lồi, đúng như hình nó có hai đáy.
- id: practice
  kind: practice
  lab: labs/CS115/L11
  title: 'Tự làm: một bước Newton so với ba bước Gradient Descent'
  checks:
  - Matrix([[4, 1], [1, 3]]).det() == 11 and Matrix([[4, 1], [1, 3]]).solve(Matrix([1, 2])) == Matrix([Rational(1, 11), Rational(7, 11)])
  - Matrix([[4, 1], [1, 3]]) * Matrix([Rational(1, 11), Rational(7, 11)]) - Matrix([1, 2]) == Matrix([0, 0])
  - '(lambda g: (lambda w: [round(w[0], 4), round(w[1], 4)])(g(g(g((0.0, 0.0))))))(lambda w: (w[0] - 0.2*(4*w[0] + w[1] - 1), w[1] - 0.2*(w[0] + 3*w[1] - 2))) == [0.128, 0.576]'
  - '[round(4*0.128 + 0.576 - 1, 4), round(0.128 + 3*0.576 - 2, 4)] == [0.088, -0.144]'
  steps:
  - clear: true
    show: '<table class="t"><tr><th>đọc trước: việc</th><th>làm thế nào</th><th>gõ trong Git Bash</th></tr><tr><td>tạo tệp</td><td>mở trình soạn văn bản (Notepad, VS Code…), gõ chương trình, lưu thành tệp tên <code>newton.py</code> (đuôi <code>.py</code>) trong thư mục gốc của bộ khoá, nơi có thư mục <code>labs</code></td><td>—</td></tr><tr><td>chạy</td><td>mở Git Bash ở thư mục đó; các dòng <code>print</code> hiện ngay bên dưới lệnh</td><td><code>python newton.py</code></td></tr><tr><td>chấm</td><td><code>bash</code> chạy tệp chấm <code>labs/cham.sh</code> với khoá, mã bài, tên tệp; in <b>ĐÚNG</b> khi mọi dòng trùng kết quả mong đợi, nếu không thì chỉ ra dòng khác</td><td><code>bash labs/cham.sh CS115 L11 newton.py</code></td></tr></table><p class="note"><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn Open Git Bash here.</p><p class="note"><b>kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python newton.py</code> và so với kết quả mong đợi.</p>

      '
    focus:
    - - '1.2'
      - 2
      - 3
    - '1.3'
    - '1.4'
    say: 'Một, tạo tệp: gõ chương trình trong trình soạn văn bản, lưu vào thư mục gốc của bộ khoá. Hai, chạy tệp: mở cửa sổ dòng lệnh ở thư mục đó, gõ lệnh trên màn hình, kết quả in ngay bên dưới. Ba, chấm bài: lệnh ở hàng cuối chạy tệp chấm, rồi in chữ ĐÚNG khi mọi dòng trùng.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>A = [[4, 1], [1, 3]]</code></td><td>danh sách lồng: mỗi hàng là một danh sách; <code>A[0][1]</code> là hàng chỉ số 0, cột chỉ số 1 (đếm từ 0)</td><td><code>A[1]</code> là <code>[1, 3]</code>; <code>A[0][1]</code> là 1</td></tr><tr><td><code>w = [w[0] - 0.2 * g[0], w[1] - 0.2 * g[1]]</code></td><td>tạo một danh sách mới từ danh sách cũ: mỗi toạ độ trừ 0.2 lần gradient của nó</td><td>w = [0, 0], g = [-1, -2] cho <code>[0.2, 0.4]</code></td></tr><tr><td><code>Fraction(1, 11)</code></td><td>phân số chính xác; in <code>1/11</code>; cần <code>from fractions import Fraction</code></td><td><code>Fraction(7, 11)</code> in <code>7/11</code></td></tr><tr><td><code>g = [4 * w[0] + w[1] - 1, w[0] + 3 * w[1] - 2]</code></td><td>gradient là A nhân w trừ b: mỗi phần tử là một hàng của A nhân w, trừ phần tử tương ứng của b</td><td>w = [0, 0] cho <code>g = [-1, -2]</code></td></tr></table>

      '
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: 'Đọc trước bốn mẩu mã sẽ dùng trong chương trình. Danh sách lồng nhau: hai chỉ số liền nhau chọn hàng rồi cột, và đều đếm từ không. Dòng này tạo danh sách mới từ danh sách cũ, mỗi toạ độ trừ 0,2 nhân gradient của nó. Hàm phân số giữ nghiệm chính xác như một phần mười một, không làm tròn. Gradient là A nhân w trừ b, nên mỗi phần tử là một hàng của A nhân w rồi trừ phần tử của b.'
  - clear: true
    show: '<table class="t"><tr><th>đọc trước (tiếp): cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>[round(x, 4) for x in w]</code></td><td>danh sách mới: mỗi x của w làm tròn 4 chữ số</td><td><code>[0.12800000000000003, 0.576]</code> thành <code>[0.128, 0.576]</code></td></tr><tr><td><code>print(f"Newton 1 buoc: w = [{w0}, {w1}]")</code></td><td>f-string: giá trị trong ngoặc nhọn chèn vào chữ</td><td>w0 = 1/11, w1 = 7/11 in <code>Newton 1 buoc: w = [1/11, 7/11]</code></td></tr><tr><td><code>if a &gt; 0 and det &gt; 0:</code></td><td>nếu cả hai điều kiện đều đúng thì làm các dòng thụt vào</td><td>a = 4, det = 11: cả hai đúng, hàm lồi</td></tr><tr><td><code>"[" + ", ".join(str(x) for x in g) + "]"</code></td><td>in list Fraction: <code>Fraction(0, 1)</code> in ra <code>0</code> qua <code>int(x)</code> hoặc <code>str(x)</code>, nối bằng <code>", ".join(…)</code></td><td>g = [Fraction(0, 1), Fraction(0, 1)] in <code>[0, 0]</code></td></tr></table>

      '
    say: Còn vài mẩu mã nữa, đọc kỹ ở bảng.
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>newton.py</code> cho $f(\mathbf{w}) = \frac{1}{2}\mathbf{w}^T A \mathbf{w} - \mathbf{b}^T\mathbf{w}$ với $A = \begin{bmatrix} 4 & 1 \\ 1 & 3 \end{bmatrix}$, $\mathbf{b} = (1, 2)^T$, xuất phát $(0, 0)$. Gradient là $A\mathbf{w} - \mathbf{b}$, Hessian là $A$.</p>

      <table class="t"><tr><th>in ra</th><th>cách làm</th></tr>

      <tr><td>hàm lồi?</td><td>$4 > 0$ và định thức $> 0$</td></tr>

      <tr><td>một bước Newton</td><td>giải $A\mathbf{p} = $ gradient, trừ $\mathbf{p}$; phân số đúng</td></tr>

      <tr><td>ba bước Gradient Descent</td><td>$\eta = 0{,}2$; in vị trí và gradient</td></tr></table>

      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L11/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    say: Bây giờ tới phần bạn tự làm, với hàm bậc hai mới trên màn hình. Kiểm hàm lồi bằng định thức con. Chạy một bước Newton và dùng phân số để gradient ra đúng không. Rồi chạy ba bước Gradient Descent với eta bằng 0,2 và so gradient còn lại. Dừng video và tự làm.
    pause: 300
  - clear: true
    show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>ham loi: True</div><div>Newton 1 buoc: w = [1/11, 7/11]</div><div>gradient sau Newton: [0, 0]</div><div>GD eta=0.2 sau 3 buoc: [0.128, 0.576]</div><div>gradient sau GD: [0.088, -0.144]</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L11 newton.py</code> — in <b>ĐÚNG</b> khi trùng.</p>

      '
    focus:
    - 0
    - 0
    say: Đây là kết quả mong đợi. Chạy chương trình của bạn rồi so từng dòng, hoặc chấm bằng lệnh ở chân màn hình.
  - show: '<div class="box key"><b>Nếu kẹt:</b> gradient tại $(0, 0)$ là $-\mathbf{b}$. Bước Newton: giải $A\mathbf{p} = $ gradient bằng nghịch đảo hai nhân hai (đổi chỗ, đổi dấu, chia định thức), rồi điểm mới $= $ điểm cũ trừ $\mathbf{p}$. Với hàm bậc hai, một bước là tới đáy, nên gradient bằng 0 đúng.</div>

      '
    say: Nếu kẹt, gradient tại gốc là âm b. Bước Newton giải A nhân p bằng gradient rồi lấy điểm cũ trừ p. Với hàm bậc hai, một bước là tới đáy, nên gradient mới bằng không đúng.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">lồi: dây cung ở trên, $f'''' \ge 0$</span><span class="a">→</span>

      <span class="n">đáy địa phương = đáy toàn cục</span><span class="a">→</span>

      <span class="n">Newton: nhảy tới đáy parabol, giải $\mathbf{H}_f\mathbf{d} = -\nabla f$</span><span class="a">→</span>

      <span class="n">rủi ro: yên ngựa, suy biến, quá đắt</span><span class="a">→</span>

      <span class="n">thay thế: tựa Newton, gradient liên hợp, giảm chấn</span></div>

      '
    say: Hàm lồi có dây cung nằm trên đồ thị, và mọi đáy địa phương là đáy toàn cục. Newton nhảy tới đáy của parabol xấp xỉ bằng cách giải một hệ phương trình. Nó có ba rủi ro, nên khi Hessian quá đắt, ta dùng một trong ba ý tưởng thay thế.
