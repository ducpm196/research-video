- Dùng dây cung và đạo hàm cấp 2 (hay trị riêng Hessian) để biết một hàm có lồi không
- Nói được vì sao với hàm lồi, đáy địa phương cũng là đáy toàn cục
- Suy ra bước Newton từ phép xấp xỉ bậc 2 và tính tay 1–2 bước
- Giải bước Newton nhiều chiều bằng hệ phương trình, không tính nghịch đảo
- Nêu ba rủi ro của Newton và ý tưởng của quasi-Newton, gradient liên hợp, Levenberg-Marquardt
- Đếm được số phép nhân của một bước Newton và của Gradient Descent khi số biến tăng, và thấy khi nào mỗi cách thắng
