  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi cột, tìm một hàng có số khác 0 để làm số trụ (đổi chỗ hàng nếu cần), rồi trừ bội của hàng trụ khỏi các hàng dưới. Hạng = số hàng khác 0 còn lại. Hạng $A$ nhỏ hơn hạng ma trận mở rộng → vô nghiệm; hai hạng bằng nhau và bằng số ẩn → một nghiệm; bằng nhau nhưng nhỏ hơn số ẩn → vô số nghiệm.</div>

