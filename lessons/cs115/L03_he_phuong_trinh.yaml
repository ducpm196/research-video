    say: Đọc trước bốn mẩu mã sẽ dùng trong chương trình. Mỗi hàng của ma trận mở rộng là một danh sách nằm trong danh sách lớn, và số cuối mỗi hàng là vế phải. Gán hai biến một lúc nghĩa là lấy cả hai giá trị bên phải rồi mới cất sang trái, nên dòng này đổi chỗ hai hàng. Hàm tạo dãy số cho các số từ 1 đến 2, dừng trước số 3, và vòng lặp chạy với từng số đó. Phân số không sai số, nên ba lần một phần ba đúng bằng 1, còn số thập phân có thể lệch nhẹ.
  - clear: true
    show: '<table class="t"><tr><th>đọc trước (tiếp): cú pháp</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>print(f"he {k}: hang A={ra}")</code></td><td>f-string: giá trị trong ngoặc nhọn chèn vào chữ</td><td>k = 1, ra = 3 in <code>he 1: hang A=3</code></td></tr><tr><td><code>if ra &lt; rm: … elif … else:</code></td><td>thử lần lượt từng điều kiện, nhánh đúng đầu tiên được làm; <code>else</code> là mọi trường hợp còn lại; ra = hạng A, rm = hạng ma trận mở rộng</td><td>ra = 2, rm = 3: nhánh đầu, vô nghiệm</td></tr><tr><td><code>[a - k * b for a, b in zip(M[i], M[r])]</code></td><td>hàng mới: lấy từng cặp (a, b) của hai hàng, tính a − k nhân b</td><td>[2, 1] − 2 nhân [1, 1] cho <code>[0, -1]</code></td></tr></table>

