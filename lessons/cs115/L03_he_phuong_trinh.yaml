- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">hệ → $[\,\mathbf{A}\ |\ \mathbf{b}\,]$</span><span class="a">→</span>

      <span class="n">3 phép biến đổi hàng (nghiệm không đổi)</span><span class="a">→</span>

      <span class="n">dạng bậc thang</span><span class="a">→</span>

      <span class="n">đọc: $0 = $ số khác 0? ẩn tuỳ ý?</span><span class="a">→</span>

      <span class="n">thế ngược + thay lại</span></div>

      '
    say: Tổng kết chuỗi logic. Viết hệ thành ma trận mở rộng. Dùng ba phép biến đổi hàng, vốn không làm đổi nghiệm, để đưa về dạng bậc thang. Đọc hàng cuối để biết một nghiệm, vô nghiệm hay vô số nghiệm. Rồi thế ngược và thay lại để kiểm tra.
  - show: '<div class="box key"><b>Tư duy:</b> đừng học thuộc công thức nghiệm. Nhớ một điều: <b>dưới mỗi số trụ phải toàn số 0</b>. Hạng = số số trụ cho biết hệ thật sự có bao nhiêu phương trình “mới”.</div>

      '
    say: Điều cần mang theo, đừng học thuộc công thức nghiệm, hãy nhớ dưới mỗi số trụ phải toàn số 0. Và hạng, tức số số trụ, cho biết hệ thật sự có bao nhiêu phương trình mang thông tin mới.
  - clear: true
    show: '<p class="note">Bài sau (bài 4): <b>cơ sở trực chuẩn & Gram-Schmidt</b> — khi các trục vuông góc và dài 1, toạ độ chỉ là một tích vô hướng, khỏi phải giải hệ như hôm nay.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 4, ta học cách chọn các trục vuông góc nhau và dài đúng 1. Với những trục như vậy, tìm toạ độ chỉ cần một tích vô hướng, không phải giải hệ. Hẹn gặp bạn ở bài tiếp theo.
