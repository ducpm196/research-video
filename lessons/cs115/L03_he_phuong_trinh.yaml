objectives:
- Chuyển một hệ phương trình tuyến tính thành A x = b và thành ma trận mở rộng [A | b]
- 'Giải hệ 3 ẩn bằng phép khử: đưa về dạng bậc thang rồi thế ngược, và tự kiểm tra bằng cách thay lại'
- Nói được vì sao ba phép biến đổi hàng không làm thay đổi tập nghiệm
- Nhận ra từ dạng bậc thang hệ có một nghiệm, vô nghiệm hay vô số nghiệm
- Tính hạng của ma trận và dùng hạng để biết hệ có nghiệm hay không; nối hạng với ma trận khả nghịch của bài 2
- Đếm được số phép nhân của phép khử và của cách khai triển định thức khi số ẩn tăng, và thấy cách nào gãy
