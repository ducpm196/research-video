id: L03
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 3 — Hệ phương trình tuyến tính: phép khử, hạng ma trận & khi nào có nghiệm"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "LA24 (slide 2024_02 Linear Algebra Review: Systems of Linear Equations, Solving, Algorithms, Basis and Rank, Linear Mappings); BT1 bài III (giải hệ PTTT)"
assumes: [vec, sub, reals, in, transpose, cdot, implies, mat, dim, sub2, identity, inverse]
# Quy ước ký hiệu của bài (lint kiểm, xem tools/registry/symbols.yaml):
#   ẩn số: x, y, z (chữ thường, tô cam khi đang tìm); ma trận hệ số: A in đậm; vế phải: b in đậm; nhân hai số: ·;
#   ma trận mở rộng: [A | b] viết bằng array có vạch đứng (sym aug); hạng: rank(A), đọc “hạng của A” (sym rank, notation_note);
#   phép biến đổi hàng viết bằng chữ (“hàng 2 − 2 lần hàng 1”), không dùng ký hiệu R₂ ← … ; số trụ tô xanh.
# Lời đọc KHÔNG nói tên “Gauss” (từ ngoại chưa probe ASR) — tên chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 2 (viết hệ thành M w = b; w = M⁻¹b; định thức ad − bc; ma trận S = [[1,2],[2,4]]
#   không khả nghịch vì S(3,0)ᵀ = S(1,1)ᵀ = (3,6)ᵀ). Ví dụ khởi động dùng lại đúng hệ của bài 2: 2x + y = 5, x + y = 3 → (2, 1).
objectives:
  - "Viết một hệ phương trình tuyến tính thành A x = b và thành ma trận mở rộng [A | b]"
  - "Giải hệ 3 ẩn bằng phép khử: đưa về dạng bậc thang rồi thế ngược, và tự kiểm tra bằng cách thay lại"
  - "Giải thích vì sao ba phép biến đổi hàng không làm thay đổi tập nghiệm"
  - "Đọc ra từ dạng bậc thang hệ có một nghiệm, vô nghiệm hay vô số nghiệm"
  - "Tính hạng của ma trận và dùng hạng để biết hệ có nghiệm hay không; nối hạng với ma trận khả nghịch của bài 2"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba ẩn, ba phương trình: nghịch đảo 2×2 không còn đủ"
    steps:
      - show: |
          <p class="big">Bài 2 giải được hệ <b>2 ẩn</b> bằng mẹo nghịch đảo 2×2.</p>
          <p>Nhưng dữ liệu thật có 3, 10, hay 1000 đặc trưng → 3, 10, 1000 ẩn số.</p>
        focus: [1, 2, 1]
        say: "Chào bạn, ở bài 2 ta giải hệ hai phương trình, hai ẩn, bằng một mẹo tìm ma trận nghịch đảo cỡ 2 nhân 2. Nhưng dữ liệu thật có ba, mười, hay cả nghìn đặc trưng, tức là chừng ấy ẩn số. Mẹo đó không dùng được nữa."
      - show: |
          <p>Hôm nay trả lời 3 câu hỏi:</p>
          <table class="t"><tr><th>câu hỏi</th><th>công cụ</th></tr>
          <tr><td>Giải hệ <b>bao nhiêu ẩn cũng được</b> thế nào?</td><td><b>phép khử</b> (khử Gauss)</td></tr>
          <tr><td>Khi nào hệ có <b>một</b> nghiệm, <b>không có</b> nghiệm, hay <b>vô số</b> nghiệm?</td><td>đọc hàng cuối sau khi khử</td></tr>
          <tr><td>Con số nào cho biết điều đó?</td><td><b>hạng</b> của ma trận</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Hôm nay mình trả lời ba câu hỏi. Một, giải hệ có bao nhiêu ẩn cũng được bằng cách nào, câu trả lời là phép khử. Hai, khi nào hệ có một nghiệm, không có nghiệm, hay vô số nghiệm. Ba, con số nào cho biết điều đó, gọi là hạng."
      - show: |
          <p class="note">Với AI: hôm nay ở bước <b>biểu diễn</b>. Tìm trọng số của mô hình thường quy về đúng việc này — giải một hệ phương trình.</p>
        say: "Với AI, hôm nay ta vẫn ở bước biểu diễn, làm việc với bảng số. Nhiều lúc, tìm trọng số của một mô hình quy về đúng việc giải một hệ phương trình, như ví dụ giá nhà của bài 2."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn bài 2 và hai phép tính trên phương trình"
    checks:
      - "Matrix([[2,1],[1,1]])*Matrix([2,1]) == Matrix([5,3])"
      - "Matrix([[2,1],[1,1]]).inv()*Matrix([5,3]) == Matrix([2,1])"
      - "(5 - 3 == 2) and (2*2 + 1 == 5) and (2 + 1 == 3)"
      - "3*(1 + 2) == 3*3 and 3 + 3 == 6"
    steps:
      - show: |
          <p>Bài 2: hệ $$\begin{cases} 2\hlo{x} + \hlo{y} = 5 \\ \hlo{x} + \hlo{y} = 3 \end{cases}$$ viết gọn là $\ \mathbf{M}\hlo{\mathbf{w}} = \mathbf{b}$, với $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix},\ \mathbf{b} = \begin{bmatrix} 5 \\ 3 \end{bmatrix}$</p>
          <p class="note">Nghiệm: $\ \hlo{\mathbf{w}} = \mathbf{M}^{-1}\mathbf{b} = (2, 1)^T$, tức $x = 2,\ y = 1$.</p>
        focus: [0, 1, 2]
        say: "Ôn lại bài 2, nơi ta viết một hệ phương trình thành phép nhân ma trận với vector. Hệ hai x cộng y bằng 5, và x cộng y bằng 3, được viết gọn thành ma trận M nhân vector ẩn w bằng vector b. Nhân hai vế với M nghịch đảo, ta được nghiệm x bằng 2, y bằng 1."
      - show: |
          <div class="box key">Hai việc luôn được phép làm với các phương trình:
          <br>① Nhân cả hai vế với cùng một số <b>khác 0</b>: $\ x + 2 = 3 \implies 3\cdot(x + 2) = 3\cdot 3$
          <br>② Cộng hai phương trình vế theo vế: nếu $\ P = Q\ $ và $\ R = T\ $ thì $\ P + R = Q + T$</div>
        say: "Hôm nay chỉ cần thêm hai việc quen thuộc. Một, nhân cả hai vế với cùng một số khác 0, phương trình vẫn đúng. Hai, nếu P bằng Q và R bằng T, thì cộng vế theo vế, P cộng R vẫn bằng Q cộng T, vì ta cộng những thứ bằng nhau."
      - show: |
          <p class="note">Vì sao phải <b>khác 0</b>? Nhân với 0 thì mọi phương trình thành $\ 0 = 0$ — mất hết thông tin.</p>
        say: "Vì sao phải khác 0? Vì nhân với 0 thì phương trình nào cũng biến thành 0 bằng 0, và ta mất hết thông tin."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym_aug
    kind: symbol
    title: "Giải mã ký hiệu: A x = b và ma trận mở rộng [A | b]"
    checks:
      - "Matrix([[1,1,1],[2,3,1],[3,1,2]]).shape == (3, 3) and Matrix([6,11,11]).shape == (3, 1)"
      - "Matrix([[1,1,1],[2,3,1],[3,1,2]]).row_join(Matrix([6,11,11])).shape == (3, 4)"
    steps:
      - show: |
          $$\begin{cases} \hlo{x} + \hlo{y} + \hlo{z} = 6 \\ 2\hlo{x} + 3\hlo{y} + \hlo{z} = 11 \\ 3\hlo{x} + \hlo{y} + 2\hlo{z} = 11 \end{cases}
          \quad\iff\quad
          \underbrace{\begin{bmatrix} 1 & 1 & 1 \\ 2 & 3 & 1 \\ 3 & 1 & 2 \end{bmatrix}}_{\mathbf{A}} \underbrace{\begin{bmatrix} \hlo{x} \\ \hlo{y} \\ \hlo{z} \end{bmatrix}}_{\hlo{\mathbf{x}}} = \underbrace{\begin{bmatrix} 6 \\ 11 \\ 11 \end{bmatrix}}_{\mathbf{b}}$$
        introduces: [iff]
        say: "Đây là hệ ba phương trình, ba ẩn x, y, z, sẽ theo ta cả bài. Giống bài 2, ta gom các hệ số thành ma trận A, các ẩn thành vector x, vế phải thành vector b, và viết gọn là A nhân x bằng b. Mũi tên hai chiều nghĩa là hai cách viết nói cùng một điều."
      - show: |
          <div class="box key">Phép khử chỉ đụng tới <b>các con số</b>, nên ghép A và b thành <b>ma trận mở rộng</b>:
          $$[\,\mathbf{A}\ |\ \mathbf{b}\,] = \left[\begin{array}{ccc|c} 1 & 1 & 1 & 6 \\ 2 & 3 & 1 & 11 \\ 3 & 1 & 2 & 11 \end{array}\right]$$
          <span class="note">Vạch đứng = dấu “bằng”: bên trái là hệ số của x, y, z; bên phải là vế phải. Mỗi <b>hàng</b> là một phương trình.</span></div>
        introduces: [aug]
        say: "Khi giải, ta chỉ làm việc với các con số, nên ghép A và b thành một bảng, gọi là ma trận mở rộng. Vạch đứng ở giữa đóng vai dấu bằng. Bên trái là hệ số của x, y, z, bên phải là vế phải, và mỗi hàng là một phương trình."
      - show: |
          <p class="note">Cỡ: $\mathbf{A}$ là $\sz{3}{3}$, $\mathbf{b}$ là $\sz{3}{1}$, nên $[\,\mathbf{A}\ |\ \mathbf{b}\,]$ là $\sz{3}{4}$ — thêm đúng một cột.</p>
        say: "Kích thước, A có 3 hàng 3 cột, b có 3 hàng 1 cột, nên ma trận mở rộng có 3 hàng 4 cột, chỉ thêm đúng một cột."

  # ───────────────────────── 4. BA PHÉP BIẾN ĐỔI HÀNG ─────────────────────────
  - id: rowops
    kind: concept
    title: "Ba phép biến đổi hàng không làm đổi nghiệm"
    checks:
      - "Matrix([[2,1,5]]) - Matrix([[1,1,3]]) == Matrix([[1,0,2]])"
      - "(2*2 + 1 == 5) and (2 + 1 == 3) and (2 + 0*1 == 2)"
    steps:
      - show: |
          <ol><li><b>Đổi chỗ</b> hai hàng (viết hai phương trình theo thứ tự khác).</li>
          <li><b>Nhân</b> một hàng với một số <b>khác 0</b>.</li>
          <li><b>Cộng</b> vào một hàng một bội của hàng khác (vd. hàng 2 − 2 lần hàng 1).</li></ol>
        say: "Phép khử chỉ dùng ba thao tác trên hàng. Một, đổi chỗ hai hàng. Hai, nhân một hàng với một số khác 0. Ba, cộng vào một hàng một bội của hàng khác, ví dụ lấy hàng 2 trừ 2 lần hàng 1."
      - show: |
          <div class="box key">Vì sao nghiệm <b>không đổi</b>? Nghiệm cũ thoả mọi phương trình cũ, nên thoả phương trình mới (theo ① ② ở phần ôn). Và mỗi thao tác đều <b>làm ngược lại được</b> (cộng lại đúng bội đó), nên nghiệm mới cũng là nghiệm cũ.</div>
        say: "Vì sao nghiệm không đổi? Theo hai việc vừa ôn, nghiệm cũ thoả các phương trình cũ, nên cũng thoả phương trình mới. Ngược lại, mỗi thao tác đều làm ngược lại được, ví dụ cộng trả lại đúng bội vừa trừ, nên nghiệm mới cũng là nghiệm cũ."
      - show: |
          <p><b>Làm thử ngay</b> với hệ của bài 2: hàng 1 − hàng 2:</p>
          $$(2\hlo{x} + \hlo{y}) - (\hlo{x} + \hlo{y}) = 5 - 3 \implies \hlo{x} = \hlg{2}, \quad \text{thay vào } \hlo{x} + \hlo{y} = 3: \ \hlo{y} = \hlg{1}$$
          <p class="note">Đúng nghiệm $(2, 1)$ như bài 2 — mà không cần tìm nghịch đảo.</p>
        focus: [1, 2, 2, 3]
        say: "Làm thử ngay với hệ hai ẩn của bài 2, hai x cộng y bằng 5 và x cộng y bằng 3. Lấy phương trình 1 trừ phương trình 2, chữ y bị khử mất, còn lại x bằng 2. Thay vào x cộng y bằng 3, được y bằng 1. Đúng nghiệm của bài 2, mà không cần tìm nghịch đảo."

  # ───────────────────────── 5. PHÉP KHỬ ─────────────────────────
  - id: gauss
    kind: example
    title: "Phép khử từng bước (khử Gauss): đưa về dạng bậc thang"
    checks:
      - "Matrix([[2,3,1,11]]) - 2*Matrix([[1,1,1,6]]) == Matrix([[0,1,-1,-1]])"
      - "Matrix([[3,1,2,11]]) - 3*Matrix([[1,1,1,6]]) == Matrix([[0,-2,-1,-7]])"
      - "Matrix([[0,-2,-1,-7]]) + 2*Matrix([[0,1,-1,-1]]) == Matrix([[0,0,-3,-9]])"
      - "11 - 2*6 == -1 and 11 - 3*6 == -7 and -7 + 2*(-1) == -9"
    steps:
      - show: |
          <p><b>Bước 1.</b> Dùng hàng 1 (số trụ $\hlb{1}$) khử $x$ ở hàng 2, hàng 3:</p>
          $$\left[\begin{array}{ccc|c} \hlb{1} & 1 & 1 & 6 \\ 2 & 3 & 1 & 11 \\ 3 & 1 & 2 & 11 \end{array}\right]
          \xrightarrow[\text{hàng 3} - 3\cdot\text{hàng 1}]{\text{hàng 2} - 2\cdot\text{hàng 1}}
          \left[\begin{array}{ccc|c} 1 & 1 & 1 & 6 \\ 0 & 1 & -1 & -1 \\ 0 & -2 & -1 & -7 \end{array}\right]$$
        focus: [1, 2, 2]
        say: "Bước một, con số đầu tiên của hàng 1 là 1, gọi là số trụ. Vì hàng 2 bắt đầu bằng 2, nên lấy hàng 2 trừ 2 lần hàng 1, cả vế phải, 11 trừ 12 bằng âm 1. Tương tự lấy hàng 3 trừ 3 lần hàng 1, được 0, âm 2, âm 1, âm 7."
      - show: |
          <p><b>Bước 2.</b> Dùng hàng 2 (số trụ $\hlb{1}$) khử $y$ ở hàng 3: &nbsp; hàng 3 + 2 lần hàng 2</p>
          $$\left[\begin{array}{ccc|c} \hlb{1} & 1 & 1 & 6 \\ 0 & \hlb{1} & -1 & -1 \\ 0 & 0 & \hlb{-3} & -9 \end{array}\right]$$
          <p class="note">Dạng <b>bậc thang</b>: số trụ của mỗi hàng nằm bên phải số trụ của hàng trên; dưới số trụ toàn số 0.</p>
        focus: [1, 2, 3]
        say: "Bước hai, hàng 2 có số trụ 1 ở cột y. Hàng 3 có âm 2 ở cột đó, nên cộng vào hàng 3 hai lần hàng 2, được 0, 0, âm 3, âm 9. Bảng giờ có dạng bậc thang, mỗi hàng bắt đầu muộn hơn hàng trên một bước."
      - clear: true
        show: |
          <p><b>Bước 3. Thế ngược</b> từ hàng cuối lên, với dạng bậc thang vừa được: $\ \left[\begin{array}{ccc|c} 1 & 1 & 1 & 6 \\ 0 & 1 & -1 & -1 \\ 0 & 0 & -3 & -9 \end{array}\right]$</p>
          <p>hàng 3: $\ -3\hlo{z} = -9 \implies \hlo{z} = \hlg{3}$ &nbsp; (chia hai vế cho $-3$)</p>
          <p>hàng 2: $\ \hlo{y} - \hlo{z} = -1 \implies \hlo{y} = -1 + 3 = \hlg{2}$ &nbsp; (chuyển vế, thay $z = 3$)</p>
          <p>hàng 1: $\ \hlo{x} + \hlo{y} + \hlo{z} = 6 \implies \hlo{x} = 6 - 2 - 3 = \hlg{1}$</p>
        focus: ["1.2", 2, 3, 4]
        say: "Bước ba, thế ngược từ dưới lên. Hàng 3 nghĩa là âm 3 z bằng âm 9, chia hai vế cho âm 3 được z bằng 3. Hàng 2 là y trừ z bằng âm 1, chuyển vế và thay z bằng 3, được y bằng 2. Hàng 1 cho x bằng 6 trừ 2 trừ 3, bằng 1."
      - show: |
          <div class="box key">Một điều kiện cần nhớ: <b>dưới mỗi số trụ phải toàn số 0</b>. Từ đó tự suy ra cần trừ bao nhiêu lần hàng trên: lấy số cần khử chia cho số trụ.</div>
        say: "Điều duy nhất cần nhớ là dưới mỗi số trụ phải toàn số 0. Từ đó tự suy ra cần trừ bao nhiêu lần hàng trên, bằng cách lấy số cần khử chia cho số trụ, như 2 chia 1 và 3 chia 1 ở bước một."

  # ───────────────────────── 6. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: thay ngược vào cả ba phương trình"
    checks:
      - "Matrix([[1,1,1],[2,3,1],[3,1,2]])*Matrix([1,2,3]) == Matrix([6,11,11])"
      - "1 + 2 + 3 == 6 and 2*1 + 3*2 + 3 == 11 and 3*1 + 2 + 2*3 == 11"
    steps:
      - show: |
          $$\begin{aligned} 1 + 2 + 3 &= 6\ \checkmark \\ 2\cdot 1 + 3\cdot 2 + 3 &= 11\ \checkmark \\ 3\cdot 1 + 2 + 2\cdot 3 &= 11\ \checkmark \end{aligned}$$
        say: "Như mọi bài trước, ta luôn tự kiểm tra. Thay x bằng 1, y bằng 2, z bằng 3 vào hệ ban đầu. Phương trình một, 1 cộng 2 cộng 3 bằng 6. Phương trình hai, 2 cộng 6 cộng 3 bằng 11. Phương trình ba, 3 cộng 2 cộng 6 bằng 11. Cả ba đều đúng."
      - show: |
          <p class="note">Phải thay vào hệ <b>ban đầu</b>, không phải hệ đã khử: nếu lỡ tính sai ở một bước khử, hệ đã khử cũng sai theo.</p>
        say: "Lưu ý phải thay vào hệ ban đầu, không phải hệ đã khử, vì nếu lỡ tính sai ở một bước khử thì hệ đã khử cũng sai theo, và phép thử sẽ không bắt được lỗi."

  # ───────────────────────── 7. BA TRƯỜNG HỢP ─────────────────────────
  - id: cases
    kind: concept
    title: "Một nghiệm, vô nghiệm, vô số nghiệm — đọc ra từ dạng bậc thang"
    checks:
      - "sp.solve([2*sp.Symbol('x') + sp.Symbol('y') - 5, sp.Symbol('x') + sp.Symbol('y') - 3]) == {sp.Symbol('x'): 2, sp.Symbol('y'): 1}"
      - "Matrix([[2,4,7]]) - 2*Matrix([[1,2,3]]) == Matrix([[0,0,1]])"
      - "Matrix([[2,4,6]]) - 2*Matrix([[1,2,3]]) == Matrix([[0,0,0]])"
      - "3 + 2*0 == 3 and 1 + 2*1 == 3 and Matrix([[1,2],[2,4]])*Matrix([3,0]) == Matrix([3,6]) and Matrix([[1,2],[2,4]])*Matrix([1,1]) == Matrix([3,6])"
      - "(lambda t: sp.expand((3 - 2*t) + 2*t) == 3)(sp.Symbol('t'))"
      - "Rational(1,2)*3 == Rational(3,2) and Rational(1,2)*Rational(7,2) == Rational(7,4)"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="400" height="250" viewBox="0 0 400 250">
            <line x1="40" y1="200" x2="380" y2="200" stroke="#9ca3af" stroke-width="2"/><line x1="40" y1="200" x2="40" y2="10" stroke="#9ca3af" stroke-width="2"/>
            <line x1="65" y1="0" x2="165" y2="200" stroke="#2563eb" stroke-width="5"/>
            <line x1="40" y1="50" x2="190" y2="200" stroke="#d97706" stroke-width="5"/>
            <circle cx="140" cy="150" r="10" fill="#059669"/>
            <text x="160" y="140" font-size="26" fill="#059669">(2, 1)</text>
          </svg><p class="note"><b>Một nghiệm</b>: hai đường cắt nhau</p></div>
          <div class="col"><svg width="400" height="250" viewBox="0 0 400 250">
            <line x1="40" y1="200" x2="380" y2="200" stroke="#9ca3af" stroke-width="2"/><line x1="40" y1="200" x2="40" y2="10" stroke="#9ca3af" stroke-width="2"/>
            <line x1="40" y1="125" x2="190" y2="200" stroke="#2563eb" stroke-width="5"/>
            <line x1="40" y1="112.5" x2="215" y2="200" stroke="#d97706" stroke-width="5"/>
          </svg><p class="note"><b>Vô nghiệm</b>: hai đường song song</p></div>
          <div class="col"><svg width="400" height="250" viewBox="0 0 400 250">
            <line x1="40" y1="200" x2="380" y2="200" stroke="#9ca3af" stroke-width="2"/><line x1="40" y1="200" x2="40" y2="10" stroke="#9ca3af" stroke-width="2"/>
            <line x1="40" y1="125" x2="190" y2="200" stroke="#2563eb" stroke-width="10"/>
            <line x1="40" y1="125" x2="190" y2="200" stroke="#d97706" stroke-width="4" stroke-dasharray="14 10"/>
          </svg><p class="note"><b>Vô số nghiệm</b>: hai đường trùng nhau</p></div></div>
        say: "Với hai ẩn, mỗi phương trình là một đường thẳng, và nghiệm là điểm chung. Hai đường có thể cắt nhau tại đúng một điểm, có thể song song và không có điểm chung, hoặc trùng nhau và có vô số điểm chung."
      - clear: true
        show: |
          <p><b>Vô nghiệm</b>: $\ \begin{cases} \hlo{x} + 2\hlo{y} = 3 \\ 2\hlo{x} + 4\hlo{y} = 7 \end{cases}$ &nbsp; hàng 2 − 2 lần hàng 1:
          $\ \left[\begin{array}{cc|c} 1 & 2 & 3 \\ 0 & 0 & \hl{1} \end{array}\right]$</p>
          <div class="box warn">Hàng cuối nghĩa là $\ 0\cdot x + 0\cdot y = 1$, tức $\ 0 = 1$: <b>không thể</b> → hệ <b>vô nghiệm</b>.</div>
        focus: [1, 1, 2]
        say: "Xét hệ x cộng 2 y bằng 3, và 2 x cộng 4 y bằng 7. Lấy hàng 2 trừ 2 lần hàng 1, vế trái thành 0, 0, còn vế phải là 7 trừ 6 bằng 1. Hàng đó nói 0 bằng 1, điều không thể, nên hệ vô nghiệm."
      - show: |
          <p><b>Vô số nghiệm</b>: $\ \begin{cases} \hlo{x} + 2\hlo{y} = 3 \\ 2\hlo{x} + 4\hlo{y} = 6 \end{cases}$ &nbsp; hàng 2 − 2 lần hàng 1:
          $\ \left[\begin{array}{cc|c} 1 & 2 & 3 \\ 0 & 0 & 0 \end{array}\right]$ </p><p>Hàng cuối là $\ 0 = 0$: luôn đúng, không cho thêm thông tin.</p>
          <p>Còn một phương trình cho hai ẩn: chọn $\ \hlo{y} = t\ $ tuỳ ý, thì $\ \hlo{x} = 3 - 2t$. &nbsp; $t = 0$: $(3, 0)$; &nbsp; $t = 1$: $(1, 1)$.</p>
        focus: ["1.2", 2, 3, 3]
        say: "Đổi vế phải thành 6. Giờ hàng cuối là 0 bằng 0, luôn đúng, không cho thêm thông tin. Còn một phương trình cho hai ẩn, nên chọn y bằng một số t tuỳ ý, thì x bằng 3 trừ 2 t. Mỗi giá trị của t cho một nghiệm."
      - show: |
          <p class="note">Nhớ bài 2: ma trận $\ \mathbf{S} = \begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}$ biến cả $(3, 0)^T$ lẫn $(1, 1)^T$ thành $(3, 6)^T$ — chính là hai nghiệm $t = 0$ và $t = 1$ ở đây.</p>
        say: "Với t bằng 0 được nghiệm 3, 0, với t bằng 1 được 1, 1. Nhớ lại bài 2, ma trận S với hàng 1, 2 và 2, 4 biến cả hai vector này thành cùng kết quả 3, 6. Đó chính là hai nghiệm ta vừa tìm được."

  # ───────────────────────── 8. HẠNG ─────────────────────────
  - id: sym_rank
    kind: symbol
    title: "Giải mã ký hiệu: hạng của ma trận, rank(A)"
    checks:
      - "Matrix([[1,1,1],[2,3,1],[3,1,2]]).rank() == 3"
      - "Matrix([[1,2],[2,4]]).rank() == 1 and Matrix([[1,2,3],[2,4,6]]).rank() == 1 and Matrix([[1,2,3],[2,4,7]]).rank() == 2"
      - "Matrix([[2,1],[1,1]]).rank() == 2 and 2*1 - 1*1 == 1 and 1*4 - 2*2 == 0"
    steps:
      - show: |
          <div class="box key"><b>Hạng</b> của ma trận = số hàng <b>khác 0</b> còn lại sau khi khử về dạng bậc thang = <b>số số trụ</b>.</div>
          $$\operatorname{rank}(\mathbf{A}) = 3 \quad (\text{ví dụ chính: 3 số trụ } 1,\ 1,\ -3)$$
        introduces: [rank]
        notation_note: true
        focus: [0, 1, 2, 2]
        say: "Giờ đến khái niệm hạng. Hạng của một ma trận là số hàng khác 0 còn lại sau khi khử về dạng bậc thang, cũng là số số trụ. Sách viết bằng chữ tiếng Anh như trên bảng, ta đọc là hạng của ma trận A. Ví dụ chính có ba số trụ, nên hạng bằng 3."
      - show: |
          <p>Kết quả không phụ thuộc thứ tự khử. Ví dụ ở trên:</p>
          <ul><li>$\mathbf{S} = \begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}$: sau khử còn 1 hàng khác 0 → $\operatorname{rank}(\mathbf{S}) = 1$</li>
          <li>Hệ vô nghiệm: $\operatorname{rank}(\mathbf{S}) = 1$ nhưng $\operatorname{rank}[\,\mathbf{S}\ |\ \mathbf{b}\,] = \hl{2}$ (hàng $0\ 0\ |\ 1$ khác 0)</li></ul>
        focus: [1, "2.1", "2.2"]
        say: "Khử theo thứ tự nào cũng ra cùng hạng. Ma trận S của bài 2, sau khi khử chỉ còn một hàng khác 0, nên hạng bằng 1. Ở hệ vô nghiệm, riêng S có hạng 1, nhưng ma trận mở rộng có hạng 2, vì hàng 0, 0, 1 khác 0."
      - clear: true
        show: |
          <div class="box key"><b>Quy tắc</b> cho hệ $\ \mathbf{A}\hlo{\mathbf{x}} = \mathbf{b}\ $ với $n$ ẩn:
          <table class="t"><tr><th>so sánh hai hạng</th><th>kết luận</th></tr>
          <tr><td>$\operatorname{rank}(\mathbf{A}) < \operatorname{rank}[\,\mathbf{A}\ |\ \mathbf{b}\,]$</td><td><b>vô nghiệm</b> (xuất hiện hàng $0 = $ số khác 0)</td></tr>
          <tr><td>bằng nhau và $= n$</td><td><b>đúng một nghiệm</b></td></tr>
          <tr><td>bằng nhau và $< n$</td><td><b>vô số nghiệm</b>, có $\ n - \operatorname{rank}(\mathbf{A})\ $ ẩn chọn tuỳ ý</td></tr></table></div>
        say: "Từ đó có quy tắc cho hệ A x bằng b với n ẩn. Nếu hạng của A nhỏ hơn hạng của ma trận mở rộng, thì có hàng 0 bằng một số khác 0, nên vô nghiệm. Nếu hai hạng bằng nhau và bằng n, có đúng một nghiệm. Bằng nhau mà nhỏ hơn n thì vô số nghiệm."
      - show: |
          <p class="note">Kiểm lại: ví dụ chính hạng 3 = 3 ẩn → một nghiệm ✓. Hệ $x + 2y = 3,\ 2x + 4y = 6$: hạng 1 = 1 &lt; 2 ẩn → vô số nghiệm, $2 - 1 = 1$ ẩn tuỳ ý ($y = t$) ✓.</p>
        say: "Kiểm lại với các ví dụ đã làm. Ví dụ chính có hạng 3 bằng số ẩn, nên có một nghiệm. Hệ có vế phải 3 và 6 có hai hạng đều bằng 1, nhỏ hơn 2 ẩn, nên vô số nghiệm, với đúng một ẩn chọn tuỳ ý, là y bằng t."

  # ───────────────────────── 9. NỐI VỚI BÀI 2 ─────────────────────────
  - id: link_inverse
    kind: concept
    title: "Hạng và ma trận khả nghịch của bài 2"
    checks:
      - "Matrix([[2,1],[1,1]]).rank() == 2 and Matrix([[2,1],[1,1]]).det() == 1"
      - "Matrix([[1,2],[2,4]]).rank() == 1 and Matrix([[1,2],[2,4]]).det() == 0"
      - "(lambda x, y: sp.expand(Matrix([[1,2],[2,4]])*Matrix([x, y]) - (x + 2*y)*Matrix([1, 2])) == sp.zeros(2, 1))(*sp.symbols('x y'))"
    steps:
      - show: |
          <div class="box key">Ma trận vuông $\sz{n}{n}$: &nbsp; <b>khả nghịch</b> $\iff \operatorname{rank}(\mathbf{A}) = n \iff \mathbf{A}\hlo{\mathbf{x}} = \mathbf{b}$ có <b>đúng một</b> nghiệm với mọi $\mathbf{b}$</div>
          <p>Với $\sz{2}{2}$: $\ \mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$: định thức $2\cdot 1 - 1\cdot 1 = 1 \neq 0$, hạng 2. &nbsp; $\mathbf{S}$: định thức $1\cdot 4 - 2\cdot 2 = 0$, hạng 1.</p>
        focus: [0, 1, 2, 2]
        say: "Giờ nối với ma trận nghịch đảo của bài 2, thứ nhân vào thì ra ma trận đơn vị. Ma trận vuông n hàng n cột khả nghịch khi và chỉ khi hạng của nó bằng n, cũng là khi hệ có đúng một nghiệm với mọi vế phải. Ma trận M của bài 2 có định thức là a d trừ b c bằng 1, khác 0, và hạng 2. Ma trận S có định thức 0, và hạng chỉ 1."
      - show: |
          <p><b>Nhìn $\mathbf{A}\mathbf{x}$ như một phép biến đổi</b> (ánh xạ tuyến tính): đưa vector $\mathbf{x}$ vào, ra vector $\mathbf{A}\mathbf{x}$.</p>
          $$\mathbf{S}\begin{bmatrix} x \\ y \end{bmatrix} = \begin{bmatrix} x + 2y \\ 2x + 4y \end{bmatrix} = (x + 2y)\begin{bmatrix} 1 \\ 2 \end{bmatrix}$$
          <p class="note">Mọi kết quả đều nằm trên <b>một đường thẳng</b> (bội của $(1, 2)^T$) → hạng 1 = số chiều của tập kết quả. $\mathbf{M}$ thì phủ kín cả mặt phẳng → hạng 2.</p>
        focus: [0, 1, 2, 3]
        say: "Có một cách nhìn khác. Coi phép nhân với ma trận như một cỗ máy, đưa vector x vào thì ra vector A nhân x. Với S, kết quả luôn bằng x cộng 2 y nhân với vector 1, 2, vì ta đặt được thừa số chung ra ngoài. Nên mọi kết quả nằm trên một đường thẳng, và hạng 1 chính là số chiều đó."

  # ───────────────────────── 10. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Hệ phương trình trong học máy"
    steps:
      - show: |
          <div class="box key"><b>Bài 18</b> (hồi quy tuyến tính — học trọng số dự đoán giá nhà từ nhiều căn): trọng số tốt nhất là nghiệm của một hệ phương trình $$\mathbf{X}^T\mathbf{X}\,\hlo{\mathbf{w}} = \mathbf{X}^T\mathbf{y}$$ giải bằng <b>phép khử</b>, không cần tìm nghịch đảo.</div>
        forward_ref: true
        say: "Ở bài 18, ta học cách tìm trọng số dự đoán giá nhà từ rất nhiều căn hộ. Trọng số tốt nhất hoá ra là nghiệm của một hệ phương trình có dạng như trên bảng, và máy tính giải nó bằng chính phép khử hôm nay."
      - show: |
          <p class="note">Bài 2 đã cảnh báo: công thức $(\mathbf{X}^T\mathbf{X})^{-1}$ chỉ dùng được khi $\mathbf{X}^T\mathbf{X}$ khả nghịch. Hôm nay ta biết khi nào: khi <b>hạng đầy đủ</b>. Nếu hai cột của $\mathbf{X}$ giống hệt nhau thì hạng bị thiếu.</p>
        say: "Bài 2 đã cảnh báo rằng công thức có ma trận nghịch đảo chỉ dùng được khi ma trận đó khả nghịch. Hôm nay ta biết khi nào, đó là khi hạng đầy đủ. Ví dụ hai cột dữ liệu giống hệt nhau thì hạng bị thiếu."

  # ───────────────────────── 11. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "Matrix([[0,-2,-1,-7]]) + 2*Matrix([[0,1,-1,11]]) == Matrix([[0,0,-3,15]])"
      - "sp.solve([sp.Symbol('x') + sp.Symbol('y') + sp.Symbol('z') - 6, sp.Symbol('y') - sp.Symbol('z') - 11, -3*sp.Symbol('z') - 15]) == {sp.Symbol('x'): 5, sp.Symbol('y'): 6, sp.Symbol('z'): -5}"
      - "2*5 + 3*6 + (-5) == 23 and 23 != 11"
      - "sp.solve([sp.Symbol('y') - 1, sp.Symbol('x') + sp.Symbol('y') - 3]) == {sp.Symbol('x'): 2, sp.Symbol('y'): 1}"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ biến đổi vế trái, <b>quên vế phải</b> <b class="red">(sai)</b>
          <br><span class="note">Ở bước 1, nếu giữ nguyên 11 thay vì $11 - 12 = -1$, cuối cùng ra $(5, 6, -5)$. Thay vào phương trình 2 thì phép thử bắt được ngay:</span>$$2\cdot 5 + 3\cdot 6 - 5 = 23 \neq 11$$<span class="note">Ma trận mở rộng giúp không quên cột cuối.</span></div>
        say: "Lỗi thứ nhất, chỉ biến đổi vế trái mà quên vế phải. Ở bước một, nếu giữ nguyên 11 thay vì 11 trừ 12, ta sẽ ra 5, 6, âm 5. Thay vào phương trình hai được 23, không phải 11, nên phép thử bắt được ngay."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chia cho số trụ bằng 0 <b class="red">(sai)</b>
          <br><span class="note">$\ 0\cdot x + y = 1,\ \ x + y = 3$: hàng 1 không dùng làm trụ được. <b>Đổi chỗ</b> hai hàng (thao tác ①) rồi khử: $x = 2,\ y = 1$.</span></div>
        say: "Lỗi thứ hai, cố chia cho một số trụ bằng 0. Nếu hàng đầu có hệ số của x bằng 0, như 0 x cộng y bằng 1, thì không dùng nó làm trụ được. Hãy đổi chỗ hai hàng, rồi khử như bình thường, được x bằng 2, y bằng 1."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Thấy hàng $\ 0 = 0\ $ rồi kết luận “vô nghiệm” <b class="red">(sai)</b>
          <br><span class="note">$0 = 0$ luôn đúng → có ẩn chọn tuỳ ý → <b>vô số nghiệm</b>. Chỉ hàng kiểu $\ 0 = $ số khác 0 mới là vô nghiệm.</span></div>
        say: "Lỗi thứ ba, thấy một hàng 0 bằng 0 rồi kết luận vô nghiệm. Sai, vì 0 bằng 0 luôn đúng, nó chỉ cho biết có ẩn được chọn tuỳ ý, tức vô số nghiệm. Chỉ hàng kiểu 0 bằng một số khác 0 mới là vô nghiệm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Luôn giải bằng cách tìm $\mathbf{A}^{-1}$ rồi nhân <b class="red">(không nên)</b>
          <br><span class="note">Tìm nghịch đảo tốn công hơn khử trực tiếp, và không làm được khi $\mathbf{A}$ không vuông hoặc không khả nghịch — trong khi phép khử vẫn chỉ ra hệ vô nghiệm hay vô số nghiệm.</span></div>
        say: "Lỗi thứ tư, lúc nào cũng tìm ma trận nghịch đảo rồi nhân. Cách đó tốn công hơn khử trực tiếp, và bó tay khi ma trận không vuông hoặc không khả nghịch. Phép khử thì vẫn chỉ ra được hệ vô nghiệm hay vô số nghiệm."

  # ───────────────────────── 12. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "Matrix([[2,1,-1,2]]) - 2*Matrix([[1,-1,1,4]]) == Matrix([[0,3,-3,-6]])"
      - "Matrix([[1,2,2,10]]) - Matrix([[1,-1,1,4]]) == Matrix([[0,3,1,6]])"
      - "Matrix([[0,3,1,6]]) - Matrix([[0,3,-3,-6]]) == Matrix([[0,0,4,12]])"
      - "Matrix([[1,-1,1],[2,1,-1],[1,2,2]])*Matrix([2,1,3]) == Matrix([4,2,10])"
      - "(lambda c: Matrix([[2,3,4,c]]) - 2*Matrix([[1,1,1,1]]) - (Matrix([[1,2,3,2]]) - Matrix([[1,1,1,1]])) == Matrix([[0,0,0,c-3]]))(sp.Symbol('c'))"
      - "Matrix([[1,1,1],[1,2,3],[2,3,4]]).rank() == 2 and Matrix([[1,1,1,1],[1,2,3,2],[2,3,4,4]]).rank() == 3"
      - "Matrix([[1,1,1,1],[1,2,3,2],[2,3,4,3]]).rank() == 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Giải bằng phép khử: $\ \begin{cases} \hlo{x} - \hlo{y} + \hlo{z} = 4 \\ 2\hlo{x} + \hlo{y} - \hlo{z} = 2 \\ \hlo{x} + 2\hlo{y} + 2\hlo{z} = 10 \end{cases}$ &nbsp; rồi tự kiểm tra.</td></tr>
          <tr><td>2</td><td>Hệ $\ x + y + z = 1,\ \ x + 2y + 3z = 2,\ \ 2x + 3y + 4z = 4$: một nghiệm, vô nghiệm hay vô số nghiệm? Hạng bằng bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Đến lượt bạn, có hai câu. Câu một, giải hệ ba phương trình trên bảng bằng phép khử, rồi tự kiểm tra. Câu hai, hệ thứ hai có một nghiệm, vô nghiệm, hay vô số nghiệm, và hạng bằng bao nhiêu? Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① hàng 2 − 2 lần hàng 1 → $(0, 3, -3 \,|\, {-6})$; &nbsp; hàng 3 − hàng 1 → $(0, 3, 1 \,|\, 6)$; &nbsp; hàng 3 − hàng 2 → $(0, 0, 4 \,|\, 12)$</p>
          <p>Thế ngược: $\hlo{z} = \hlg{3}$; $\ 3y - 9 = -6 \Rightarrow \hlo{y} = \hlg{1}$; $\ x = 4 + 1 - 3 = \hlg{2}$. &nbsp; Thử: $2 - 1 + 3 = 4,\ 4 + 1 - 3 = 2,\ 2 + 2 + 6 = 10\ \checkmark$</p>
        focus: [0, 1, 2, 2]
        say: "Đáp án câu một. Lấy hàng 2 trừ 2 lần hàng 1, hàng 3 trừ hàng 1, rồi hàng 3 trừ hàng 2, ta được 4 z bằng 12, nên z bằng 3. Thế ngược được y bằng 1 và x bằng 2. Thay lại, cả ba phương trình đều đúng."
      - clear: true
        show: |
          <p>② Hệ $\ x + y + z = 1,\ \ x + 2y + 3z = 2,\ \ 2x + 3y + 4z = 4$:</p>
          <p>hàng 2 − hàng 1, hàng 3 − 2 lần hàng 1, rồi trừ tiếp hàng 2: hàng cuối là $\ (0, 0, 0 \,|\, \hl{1})$, tức $0 = 1$ → <b>vô nghiệm</b>.</p>
          <p class="note">$\operatorname{rank}(\mathbf{A}) = 2 < \operatorname{rank}[\,\mathbf{A}\ |\ \mathbf{b}\,] = 3$. Nếu vế phải cuối là 3 thay vì 4, hàng cuối là $0 = 0$ → vô số nghiệm.</p>
        focus: [2, "3.1", "3.2"]
        say: "Câu hai, sau khi khử, hàng cuối là 0, 0, 0 và vế phải bằng 1, tức 0 bằng 1, nên hệ vô nghiệm. Hạng của A bằng 2, hạng của ma trận mở rộng bằng 3. Nếu vế phải cuối là 3 thay vì 4, hệ sẽ có vô số nghiệm."

