        say: "Hình này cho thấy tiên nghiệm và dữ liệu gặp nhau thế nào. Đường xám đứt nét là tiên nghiệm thê ta nhân 1 trừ thê ta, cao nhất ở 0 phẩy 5. Đường xanh dương là khả năng của 3 ngửa, thê ta mũ 3, càng sang phải càng cao, nên đỉnh nằm ở mép bằng 1. Nhân hai đường với nhau tại từng điểm, ta được đường xanh lục là hậu nghiệm, đỉnh của nó lùi về 0 phẩy 8. Mỗi đường được vẽ co giãn cho đỉnh cao bằng nhau, để dễ so chỗ đỉnh."
      - show: |
          <p>Làm thử: tích $\theta^3\cdot\theta(1 - \theta) = \theta^4(1 - \theta)$ tại vài điểm gần đỉnh:</p>
          <table class="t"><tr><th>$\theta$</th><th>0,7</th><th>0,8</th><th>0,9</th><th>1</th></tr>
          <tr><td>$\theta^4(1 - \theta)$</td><td>0,07203</td><td>$\hlg{0{,}08192}$</td><td>0,06561</td><td>0</td></tr></table>
        focus: [1, "2.2", "2.2", "2.2"]
        say: "Làm thử bằng số, tích hai đường là thê ta mũ 4 nhân 1 trừ thê ta. Tại 0 phẩy 8, tích bằng 0 phẩy 08192, lớn hơn cả hai bên 0 phẩy 7 và 0 phẩy 9. Tại mép bằng 1, tiên nghiệm bằng 0, nên tích cũng bằng 0, dù khả năng ở đó lớn nhất. Vì thế tiên nghiệm kéo đỉnh khỏi mép, về 0 phẩy 8."

  # ───────────────────────── 7. DỮ LIỆU NHIỀU ─────────────────────────
  - id: more_data
    kind: concept
    title: "Dữ liệu càng nhiều, tiên nghiệm càng ít ảnh hưởng"
    checks:
      - "Rational(3, 3) == 1 and Rational(3 + 1, 3 + 2) == Rational(4, 5) and Rational(300, 400) == Rational(3, 4) and Rational(300 + 1, 400 + 2) == Rational(301, 402) and round(301/402, 4) == 0.7488"
    steps:
      - show: |
          <table class="t"><tr><th>dữ liệu</th><th>MLE $= \frac{k}{n}$</th><th>MAP $= \frac{k + 1}{n + 2}$</th></tr>
          <tr><td>3 ngửa / 3 lần</td><td>1</td><td>0,8</td></tr>
          <tr><td>300 ngửa / 400 lần</td><td>0,75</td><td>0,7488</td></tr></table>
          <p class="note">Ít dữ liệu: tiên nghiệm kéo kết quả về hợp lý. Nhiều dữ liệu: hai cách gần như trùng nhau. Tiên nghiệm <b>đều</b> (mọi $\theta$ như nhau) cho MAP = MLE.</p>
        focus: ["1.2", "1.3", 2]
        say: "Với 3 ngửa trong 3 lần, hai cách cho 1 và 0 phẩy 8. Với 300 ngửa trong 400 lần, chúng cho 0 phẩy 75 và 0 phẩy 7488, gần như trùng nhau. Vậy ít dữ liệu thì tiên nghiệm giúp nhiều, còn nhiều dữ liệu thì dữ liệu tự nói."

  # ───────────────────────── 8. PHÂN PHỐI PHÂN LOẠI ─────────────────────────
  - id: categorical
    kind: example
    title: "Ví dụ: phân phối phân loại 3 lớp — đếm rồi chia"
    checks:
      - "(lambda a, b: sp.solve([sp.diff(5*sp.log(a) + 3*sp.log(b) + 2*sp.log(1 - a - b), v) for v in (a, b)], [a, b], dict=True))(*sp.symbols('a b', positive=True)) == [{sp.Symbol('a', positive=True): Rational(1, 2), sp.Symbol('b', positive=True): Rational(3, 10)}]"
      - "[Rational(n + 1, 10 + 3) for n in (5, 3, 2)] == [Rational(6, 13), Rational(4, 13), Rational(3, 13)] and [round((n + 1)/13, 3) for n in (5, 3, 2)] == [0.462, 0.308, 0.231]"
    steps:
      - show: |
          <p>10 ảnh: 5 mèo, 3 chó, 2 chim. Tham số $\theta_1, \theta_2, \theta_3$ với ràng buộc <b>tổng bằng 1</b> — thế $\theta_3 = 1 - \theta_1 - \theta_2$:</p>
          $$\ln P = 5\ln\theta_1 + 3\ln\theta_2 + 2\ln(1 - \theta_1 - \theta_2)$$
          <p>Hai đạo hàm riêng (bài 6) bằng 0: $\ \dfrac{5}{\theta_1} = \dfrac{2}{\theta_3}$, $\ \dfrac{3}{\theta_2} = \dfrac{2}{\theta_3}$</p>
          <div class="box key">$\implies \hat{\theta}_{\text{MLE}} = \left(\frac{5}{10}, \frac{3}{10}, \frac{2}{10}\right) = (\hlg{0{,}5;\ 0{,}3;\ 0{,}2})$ — đếm rồi chia</div>
        focus: [1, [1, 2], [3, 4]]
        say: "Ví dụ 10 ảnh gồm 5 mèo, 3 chó và 2 chim. Vì ba xác suất phải có tổng bằng 1, ta thế thê ta ba bằng 1 trừ hai cái kia. Cho hai đạo hàm riêng bằng 0, ta được mỗi xác suất tỉ lệ với số lần đếm, tức 0 phẩy 5, 0 phẩy 3 và 0 phẩy 2."
      - show: |
          <p class="note">MAP với tiên nghiệm “thêm 1 lần mỗi lớp” (sách tiếng Anh gọi là prior Dirichlet): $\ \left(\frac{6}{13}, \frac{4}{13}, \frac{3}{13}\right) \approx (0{,}462;\ 0{,}308;\ 0{,}231)$ — lớp chưa từng gặp vẫn có xác suất khác 0.</p>
        say: "Với tiên nghiệm cộng thêm 1 lần đếm cho mỗi lớp, ta được 6 phần 13, 4 phần 13 và 3 phần 13. Nhờ vậy, một lớp chưa từng gặp vẫn có xác suất khác 0."

  # ───────────────────────── 9. BAYES ĐẦY ĐỦ ─────────────────────────
  - id: bayesian
    kind: concept
    title: "Cách tiếp cận Bayes: giữ cả phân phối"
    checks:
      - "(lambda t: sp.integrate(4*t**3, (t, 0, 1)) == 1 and sp.integrate(t*4*t**3, (t, 0, 1)) == Rational(4, 5))(sp.Symbol('t'))"
    steps:
      - show: |
          <p>Không chọn một $\theta$ duy nhất, mà giữ cả hậu nghiệm $P(\theta \mid \mathcal{D})$. Dự đoán = <b>trung bình</b> dự đoán của mọi $\theta$, có trọng số hậu nghiệm (tích phân như bài 14):</p>
          $$P(\text{ngửa tiếp} \mid \mathcal{D}) = \int_{0}^{1} \theta\cdot P(\theta \mid \mathcal{D})\, d\theta$$
          <p>Tiên nghiệm đều, 3 ngửa / 3 lần: hậu nghiệm tỉ lệ với $\theta^3$; diện tích dưới $\theta^3$ là $\frac{1}{4}$ (bài 14: dưới $x^k$ từ 0 đến 1 là $\frac{1}{k + 1}$), nhân 4 cho diện tích bằng 1: hậu nghiệm $= 4\theta^3$ &nbsp; ⟶ &nbsp; $\int_{0}^{1}\theta\cdot 4\theta^3\, d\theta = 4\cdot\frac{1}{5} = \hlg{\frac{4}{5}}$</p>
        focus: [1, 2, 3, 3]
        say: "Cách tiếp cận Bayes không chọn một thê ta duy nhất, mà giữ cả hậu nghiệm. Dự đoán là trung bình dự đoán của mọi thê ta, có trọng số hậu nghiệm, tính bằng tích phân như bài 14. Với tiên nghiệm đều và 3 ngửa, hậu nghiệm là 4 thê ta mũ 3, vì theo quy tắc diện tích của bài 14, phần dưới thê ta mũ 3 bằng một phần tư. Dự đoán ngửa lần tiếp là 4 nhân một phần năm, tức 4 phần 5."
      - show: |
          <p class="note">Khi dữ liệu ít, cách Bayes cho dự đoán <b>ôn hoà</b> hơn và biết mình chưa chắc; MLE/MAP chỉ giữ một điểm nên có thể quá tự tin. Đổi lại, tích phân thường khó tính.</p>
        say: "Khi ít dữ liệu, cách Bayes cho dự đoán ôn hoà hơn, vì nó biết mình chưa chắc chắn, còn hai cách chọn một điểm có thể quá tự tin. Đổi lại, tích phân thường khó tính."

  # ───────────────────────── 10. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: dò tìm bằng máy"
    checks:
      - "(lambda g: round(float(g[int(np.argmax([-sum((x - m)**2 for x in (165, 170, 178)) for m in g]))]), 2) == 171.0)(np.arange(160, 180.0001, 0.01))"
      - "(lambda g: round(float(g[int(np.argmax([4*math.log(t) + math.log(1 - t) for t in g]))]), 3) == 0.8)(np.arange(0.001, 0.9995, 0.001))"
    steps:
      - show: |
          <table class="t"><tr><th>máy dò</th><th>lưới thử</th><th>lớn nhất tại</th></tr>
          <tr><td>$\ln L(\mu)$, ba chiều cao</td><td>$\mu$ từ 160 đến 180, bước 0,01</td><td>$\mu = \hlg{171{,}00}$ $\checkmark$</td></tr>
          <tr><td>hậu nghiệm, 3 ngửa + tiên nghiệm</td><td>$\theta$ từ 0,001 đến 0,999</td><td>$\theta = \hlg{0{,}800}$ $\checkmark$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Phép thử, vì tính tay dễ nhầm, ta cho máy dò mọi giá trị muy từ 160 đến 180, và thấy khả năng lớn nhất tại đúng 171. Khi dò mọi giá trị của thê ta, hậu nghiệm lớn nhất tại đúng 0 phẩy 8, khớp với cách giải bằng đạo hàm."

  # ───────────────────────── 11. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Ba cách ước lượng trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>gặp lại</th></tr>
          <tr><td><b>Bài 18</b></td><td>giả sử sai số có phân phối chuẩn, MLE thành “bình phương nhỏ nhất” — hàm sai số của hồi quy tuyến tính</td></tr>
          <tr><td><b>Bài 19</b></td><td>thêm tiên nghiệm “tham số nên nhỏ” — MAP thành hồi quy có phạt độ lớn tham số</td></tr>
          <tr><td><b>Bài 20</b></td><td>MLE cho phân phối phân loại thành hàm sai số dùng cho bài toán phân loại</td></tr>
          <tr><td><b>Bài 24</b></td><td>giải lại ví dụ 3 lớp bằng một công cụ chuyên cho ràng buộc “tổng bằng 1”</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Ở bài 18, nếu sai số có phân phối chuẩn, ước lượng hợp lý cực đại thành bình phương nhỏ nhất. Ở bài 19, thêm tiên nghiệm tham số nên nhỏ, ta được hồi quy có phạt. Ở bài 20, ước lượng cho phân phối phân loại thành hàm sai số của bài toán phân loại. Ở bài 24, ta giải lại ví dụ ba lớp bằng một công cụ chuyên cho ràng buộc."

  # ───────────────────────── 12. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "(lambda t: sp.integrate(t**3, (t, 0, 1)) == Rational(1, 4))(sp.Symbol('t'))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin MLE khi có rất ít dữ liệu <b class="red">(dễ sai)</b>
          <br><span class="note">3 ngửa / 3 lần cho $\hat{\theta} = 1$: “không bao giờ sấp”. Thêm tiên nghiệm hoặc thu thêm dữ liệu.</span></div>
        say: "Lỗi thứ nhất, tin ước lượng hợp lý cực đại khi có rất ít dữ liệu. Ba ngửa trong ba lần cho kết luận không bao giờ ra sấp. Hãy thêm tiên nghiệm hoặc thu thêm dữ liệu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Coi khả năng $P(\mathcal{D} \mid \theta)$ là phân phối của $\theta$ <b class="red">(sai)</b>
          <br><span class="note">Theo $\theta$, nó không cần có diện tích bằng 1: $\int_{0}^{1}\theta^3\, d\theta = \frac{1}{4}$. Muốn có phân phối của $\theta$ phải dùng Bayes.</span></div>
        say: "Lỗi thứ hai, coi khả năng của dữ liệu là phân phối của thê ta. Xét theo thê ta, nó không cần có diện tích bằng 1, ví dụ thê ta mũ 3 có diện tích một phần tư. Muốn có phân phối của thê ta, phải dùng định lý Bayes."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhân các xác suất khi dữ liệu <b>không độc lập</b> <b class="red">(sai)</b>
          <br><span class="note">Tích $\prod P(x_i \mid \theta)$ chỉ đúng với dữ liệu i.i.d. Ví dụ đo một người 10 lần không phải 10 người khác nhau.</span></div>
        introduces: [prod]
        say: "Lỗi thứ ba là lấy tích của các xác suất khi dữ liệu không độc lập. Dấu pi hoa nghĩa là nhân tất cả lại, và nó chỉ đúng khi dữ liệu độc lập. Ví dụ đo một người 10 lần không giống đo 10 người khác nhau."

  # ───────────────────────── 13. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda t: sp.solve(sp.diff(7*sp.log(t) + 3*sp.log(1 - t), t), t))(sp.Symbol('t', positive=True)) == [Rational(7, 10)] and (lambda t: sp.solve(sp.diff(8*sp.log(t) + 4*sp.log(1 - t), t), t))(sp.Symbol('t', positive=True)) == [Rational(2, 3)]"
      - "(2 + 4 + 9) / 3 == 5 and 2 + 4 + 9 == 15"
      - "Rational(7 + 1, 10 + 2) == Rational(8, 12) and round(8/12, 3) == 0.667 and 2 + 6 + 2 == 10"
      - "[Rational(n, 10) for n in (2, 6, 2)] == [Rational(1, 5), Rational(3, 5), Rational(1, 5)]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>7 ngửa trong 10 lần. Tính MLE, và MAP với tiên nghiệm “thêm 1 ngửa, 1 sấp”.</td></tr>
          <tr><td>2</td><td>Dữ liệu 2, 4, 9 từ phân phối chuẩn. MLE của $\mu$?</td></tr>
          <tr><td>3</td><td>Phân loại 3 lớp, đếm được 2, 6, 2. MLE của $(\theta_1, \theta_2, \theta_3)$?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một về đồng xu với hai cách ước lượng. Câu hai về phân phối chuẩn. Câu ba về phân phối phân loại. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① 7 ngửa, 3 sấp. MLE là tỉ lệ ngửa; MAP cộng thêm 1 ngửa, 1 sấp giả vờ:</p>
          $$\hat{\theta}_{\text{MLE}} = \frac{7}{10} = \hlg{0{,}7}$$
          $$\hat{\theta}_{\text{MAP}} = \frac{7 + 1}{10 + 2} = \frac{8}{12} = \hlg{\frac{2}{3}} \approx 0{,}667$$
        focus: [1, 2, 3]
        say: "Đáp án câu một, đồng xu có 7 ngửa và 3 sấp trong 10 lần. Ước lượng hợp lý cực đại là tỉ lệ ngửa, 7 chia 10, bằng 0 phẩy 7. Tiên nghiệm cộng thêm 1 ngửa và 1 sấp, nên hậu nghiệm cực đại là 8 chia 12, tức hai phần ba, khoảng 0 phẩy 667."
      - show: |
          <p>② Ước lượng của $\mu$ là trung bình cộng:</p>
          $$\hat{\mu} = \frac{2 + 4 + 9}{3} = \frac{15}{3} = \hlg{5}$$
          <p>③ Đếm rồi chia cho tổng số lần là 10:</p>
          $$\left(\frac{2}{10}, \frac{6}{10}, \frac{2}{10}\right) = (\hlg{0{,}2;\ 0{,}6;\ 0{,}2})$$
        focus: [[1, 2], [3, 4]]
        say: "Câu hai, ước lượng của muy là trung bình cộng, 2 cộng 4 cộng 9 bằng 15, chia cho 3 được 5. Câu ba, đếm rồi chia cho tổng số 10 lần, được 0 phẩy 2, 0 phẩy 6 và 0 phẩy 2."

