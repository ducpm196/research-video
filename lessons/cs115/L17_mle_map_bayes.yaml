scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tung 3 lần đều ngửa: đồng xu không bao giờ ra sấp?"
    steps:
      - show: |
          <p class="big">Tung một đồng xu lạ 3 lần: <b>ngửa, ngửa, ngửa</b>.</p>
          <p>Cách “tin hoàn toàn vào dữ liệu” kết luận: đồng xu <b class="red">không bao giờ</b> ra sấp?!</p>
          $$\text{xác suất ngửa} = \frac{3}{3} = 1$$
        focus: [1, [2, 3]]
        say: "Chào bạn, hãy tung một đồng xu lạ 3 lần, cả 3 lần đều ngửa. Nếu tin hoàn toàn vào dữ liệu, ta kết luận xác suất ngửa bằng 3 phần 3, tức là 1, đồng xu không bao giờ ra sấp."
      - show: |
          <div class="box key">Hôm nay: ba cách chọn tham số từ dữ liệu — tin dữ liệu (MLE), dữ liệu cộng niềm tin ban đầu (MAP), và giữ cả phân phối (Bayes).</div>
        say: "Nghe quá tự tin, phải không? Hôm nay ta học ba cách chọn tham số từ dữ liệu. Một là tin hoàn toàn vào dữ liệu, hai là kết hợp dữ liệu với niềm tin ban đầu, ba là giữ lại cả một phân phối."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: đồng xu bài 12 và định lý Bayes bài 13"
    checks:
      - "(lambda p: sp.solve(sp.diff(3*sp.log(p) + sp.log(1 - p), p), p))(sp.Symbol('p', positive=True)) == [Rational(3, 4)]"
      - "Rational(9, 10)*Rational(1, 100)/Rational(108, 1000) == Rational(1, 12) and round(1/12, 3) == 0.083 and Rational(9 + 99, 1000) == Rational(108, 1000)"
      - "9/10 == 0.9 and 1000 - 10 == 990 and Rational(99, 990) == Rational(1, 10) and round(100/12) == 8"
    steps:
      - show: |
          <p>Bài 12: 3 ngửa, 1 sấp — khả năng $L = p\cdot p\cdot p\cdot(1 - p)$; lấy $\ln$: $3\ln p + \ln(1 - p)$; đạo hàm bằng 0 (bài 8) cho $p = \frac{3}{4}$.</p>
          <p>Bài 13: định lý Bayes — tiên nghiệm $P(A)$, hậu nghiệm $P(A \mid B)$:</p>
          $$P(A \mid B) = \frac{P(B \mid A)\cdot P(A)}{P(B)}$$
        focus: [1, [2, 3]]
        say: "Nhắc lại bài 12, với 3 ngửa 1 sấp, ta lấy lôgarit của khả năng, cho đạo hàm bằng 0, và được p bằng ba phần tư. Còn ở bài 13, định lý Bayes tính hậu nghiệm từ tiên nghiệm và khả năng của dữ liệu."
      - clear: true
        show: |
          <p>Làm thử với bài xét nghiệm của bài 13: 1000 người, 10 người bệnh. Máy báo dương đúng 9 trong 10 người bệnh ($0{,}9$) và báo nhầm 99 trong 990 người khoẻ, nên có $9 + 99 = 108$ người báo dương ($0{,}108$).</p>
          <p><b>Tiên nghiệm</b> $P(\text{bệnh}) = 0{,}01$ là niềm tin <b>trước</b> khi xét nghiệm; <b>hậu nghiệm</b> là niềm tin <b>sau</b> khi thấy kết quả:</p>
          $$P(\text{bệnh} \mid \text{dương}) = \frac{0{,}9\cdot 0{,}01}{0{,}108} = \frac{1}{12} \approx \hlg{0{,}083}$$
        focus: [1, 1, 2, 3, 3]
        say: "Làm thử bằng bài xét nghiệm của bài 13, có 1000 người, trong đó 10 người bệnh. Máy báo dương đúng 9 trong 10 người bệnh, tức 0 phẩy 9, và báo nhầm 99 trong 990 người khoẻ, nên có 108 người được báo dương. Tiên nghiệm 0 phẩy 01 là niềm tin trước khi xét nghiệm, còn hậu nghiệm là niềm tin sau khi đã thấy kết quả. Tử số là 0 phẩy 9 nhân 0 phẩy 01, mẫu số là 0 phẩy 108. Kết quả là một phần mười hai, khoảng 0 phẩy 083, tức chỉ khoảng 8 phần trăm người báo dương thật sự bị bệnh."

  # ───────────────────────── 3. KÝ HIỆU THAM SỐ, DỮ LIỆU, KHẢ NĂNG ─────────────────────────
  - id: sym_lik
    kind: symbol
    title: "Giải mã: θ, dữ liệu D và hàm khả năng"
    checks:
      - "(lambda t: sp.expand(t*t*(1 - t) - t**2*(1 - t)) == 0)(sp.Symbol('t'))"
    steps:
      - show: |
          <p>$\theta$ (đọc “thê ta”): <b>tham số</b> của mô hình, ví dụ xác suất ra ngửa. &nbsp; $\mathcal{D} = (x_1, x_2, \dots, x_N)$: <b>dữ liệu</b> gồm $N$ quan sát.</p>
          <div class="box key">Khả năng: $\ P(\mathcal{D} \mid \theta) = P(x_1 \mid \theta)\cdot P(x_2 \mid \theta)\cdots P(x_N \mid \theta)$ &nbsp; — nhân được <b>vì các quan sát độc lập</b> (bài 13).</div>
        introduces: [theta, data]
        focus: ["1.1", "1.3", 2]
        say: "Ký hiệu thê ta là tham số của mô hình, ví dụ xác suất ra ngửa. Chữ D uốn cong là dữ liệu gồm N quan sát. Khả năng của dữ liệu khi biết thê ta bằng tích khả năng của từng quan sát, vì theo bài 13, các biến cố độc lập thì xác suất cùng xảy ra bằng tích."
      - show: |
          <p>Ví dụ: ngửa, ngửa, sấp &nbsp; ⟶ &nbsp; $P(\mathcal{D} \mid \theta) = \theta\cdot\theta\cdot(1 - \theta)$</p>
          <p class="note">Giả thiết “các quan sát <b>độc lập, cùng một phân phối</b>” (viết tắt i.i.d.) thường được dùng mà không nói ra. Thiếu nó thì không được nhân như trên.</p>
          <p class="note">Ở bài 16, $\theta$ là một góc nghiêng. Trong bài này, $\theta$ là tham số — cùng chữ, khác nghĩa. Sách hay viết $\theta$ in đậm vì mô hình thường có cả một bộ tham số; ở đây chỉ có một số nên viết thường.</p>
        notation_note: true
        focus: [1, 2, 3]
        say: "Ví dụ ngửa, ngửa, sấp cho khả năng thê ta nhân thê ta nhân 1 trừ thê ta. Giả thiết các quan sát độc lập và cùng một phân phối thường được dùng mà không nói ra. Lưu ý, ở bài 16 chữ thê ta là một góc, còn ở đây nó là tham số."

  # ───────────────────────── 4. MLE ─────────────────────────
  - id: mle
    kind: formula
    title: "MLE: chọn θ làm dữ liệu dễ xảy ra nhất"
    checks:
      - "(lambda t, k, n: sp.solve(sp.diff(k*sp.log(t) + (n - k)*sp.log(1 - t), t), t))(sp.Symbol('t', positive=True), sp.Symbol('k', positive=True), sp.Symbol('n', positive=True)) == [sp.Symbol('k', positive=True)/sp.Symbol('n', positive=True)]"
      - "(lambda t: sp.diff(3*sp.log(t), t) == 3/t)(sp.Symbol('t', positive=True))"
    steps:
      - show: |
          $$\hat{\theta}_{\text{MLE}} = \operatorname{arg\,max}_{\theta}\ P(\mathcal{D} \mid \theta) = \operatorname{arg\,max}_{\theta} \sum_{i = 1}^{N} \ln P(x_i \mid \theta)$$
          <p>$\operatorname{arg\,max}_{\theta}$ đọc là “giá trị $\theta$ làm biểu thức lớn nhất”. Lấy $\ln$ không đổi chỗ lớn nhất, vì $\ln$ luôn tăng (bài 12), và biến tích thành tổng.</p>
        introduces: [argmin]
        focus: [1, "2.1", 2]
        say: "Ước lượng hợp lý cực đại chọn thê ta làm khả năng của dữ liệu lớn nhất. Ký hiệu trên màn hình đọc là giá trị thê ta làm biểu thức lớn nhất. Theo bài 12, lấy lôgarit không đổi chỗ lớn nhất vì lôgarit luôn tăng, và nó biến tích thành tổng."
      - show: |
          <p>Đồng xu, $k$ ngửa trong $n$ lần: $\ \ln P(\mathcal{D} \mid \theta) = k\ln\theta + (n - k)\ln(1 - \theta)$</p>
          <p>Đạo hàm bằng 0: $\ \dfrac{k}{\theta} - \dfrac{n - k}{1 - \theta} = 0 \implies \hat{\theta}_{\text{MLE}} = \hlg{\dfrac{k}{n}}$ &nbsp; (tỉ lệ ngửa)</p>
          <p class="note">Với 3 ngửa trong 3 lần: $\ln P = 3\ln\theta$ luôn tăng, nên lớn nhất ở mép $\theta = 1$ — đúng con số quá tự tin ở đầu bài.</p>
        focus: [[1, 2], 3]
        say: "Với đồng xu có k ngửa trong n lần, cho đạo hàm bằng 0, rồi quy đồng và chuyển vế, ta được thê ta mũ bằng k chia n, tức tỉ lệ ngửa. Với 3 ngửa trong 3 lần, biểu thức luôn tăng nên lớn nhất ở mép bằng 1, đúng con số quá tự tin ở đầu bài."

  # ───────────────────────── 5. MLE PHÂN PHỐI CHUẨN ─────────────────────────
  - id: mle_normal
    kind: example
    title: "Ví dụ: MLE của μ trong phân phối chuẩn là trung bình cộng"
    checks:
      - "(lambda m, s: sp.solve(sp.diff(-sum((x - m)**2 for x in (165, 170, 178))/(2*s**2), m), m))(sp.Symbol('m'), sp.Symbol('s', positive=True)) == [171]"
      - "sum((x - 171)**2 for x in (165, 170, 178)) == 86 and (165 + 170 + 178) / 3 == 171"
      - "(lambda m, s, N: sp.simplify(sp.diff(-N/2*sp.log(2*sp.pi*s**2) - sp.Symbol('Q', positive=True)/(2*s**2), m)) == 0)(sp.Symbol('m'), sp.Symbol('s', positive=True), sp.Symbol('N', positive=True))"
    steps:
      - show: |
          <p>Dữ liệu chiều cao (cm): 165, 170, 178, giả sử từ $\mathcal{N}(\mu, \sigma^2)$ (bài 14). Lấy $\ln$ của tích các mật độ:</p>
          $$\ln L(\mu) = -\frac{N}{2}\ln(2\pi\sigma^2) - \frac{1}{2\sigma^2}\sum_{i = 1}^{N}(x_i - \mu)^2$$
        focus: [1, 2]
        say: "Ví dụ ba chiều cao 165, 170 và 178, giả sử lấy từ phân phối chuẩn của bài 14. Lấy lôgarit của tích các mật độ, ta được một hằng số trừ tổng bình phương độ lệch chia hai xích ma bình phương, như trên bảng."
      - show: |
          <p>Phần đầu không chứa $\mu$. Đạo hàm theo $\mu$ bằng 0: $\ \dfrac{1}{\sigma^2}\sum_{i}(x_i - \mu) = 0 \implies \hat{\mu}_{\text{MLE}} = \dfrac{1}{N}\sum_{i} x_i$</p>
          <div class="box key">Ví dụ: $\ \hat{\mu} = \dfrac{165 + 170 + 178}{3} = \hlg{171}$ cm — trung bình cộng.</div>
          <p class="note">Cực đại $\ln L$ cũng là cực tiểu $\sum (x_i - \mu)^2$ (vì dấu trừ phía trước): <b>bình phương nhỏ nhất</b>.</p>
        focus: [[1, 2], 3]
        say: "Phần đầu không chứa muy, nên khi lấy đạo hàm theo muy rồi cho bằng 0, ta được muy mũ bằng trung bình cộng, ở đây là 171. Để ý, vì có dấu trừ phía trước, làm lớn khả năng chính là làm nhỏ tổng bình phương độ lệch."

  # ───────────────────────── 6. MAP ─────────────────────────
  - id: map
    kind: formula
    title: "MAP: thêm niềm tin ban đầu bằng định lý Bayes"
    checks:
      - "(lambda t: sp.solve(sp.diff(4*sp.log(t) + sp.log(1 - t), t), t))(sp.Symbol('t', positive=True)) == [Rational(4, 5)]"
      - "(lambda t: sp.integrate(6*t*(1 - t), (t, 0, 1)) == 1)(sp.Symbol('t'))"
    steps:
      - show: |
          <p>Theo Bayes (bài 13): $\ P(\theta \mid \mathcal{D}) = \dfrac{P(\mathcal{D} \mid \theta)\cdot P(\theta)}{P(\mathcal{D})}$. &nbsp; $P(\mathcal{D})$ <b>không chứa</b> $\theta$, nên bỏ đi không đổi chỗ lớn nhất:</p>
          $$\hat{\theta}_{\text{MAP}} = \operatorname{arg\,max}_{\theta}\ \Big[\sum_{i = 1}^{N}\ln P(x_i \mid \theta) + \ln P(\theta)\Big]$$
        focus: [2, "1.1", "1.2", 2]
        say: "Ước lượng hậu nghiệm cực đại chọn thê ta làm hậu nghiệm lớn nhất. Theo định lý Bayes, hậu nghiệm bằng khả năng nhân tiên nghiệm chia xác suất của dữ liệu. Mẫu số không chứa thê ta, nên bỏ đi không đổi chỗ lớn nhất. Lấy lôgarit, ta cộng thêm lôgarit của tiên nghiệm."
      - show: |
          <p>Tiên nghiệm “đồng xu chắc gần cân đối”: $P(\theta)$ tỉ lệ với $\theta\cdot(1 - \theta)$ — giống như <b>đã thấy thêm 1 ngửa, 1 sấp</b>.</p>
          <p>3 ngửa / 3 lần: $\ 3\ln\theta + \big[\ln\theta + \ln(1 - \theta)\big]$, đạo hàm bằng 0: $\ \dfrac{4}{\theta} - \dfrac{1}{1 - \theta} = 0 \implies \hat{\theta}_{\text{MAP}} = \hlg{\dfrac{4}{5} = 0{,}8}$</p>
        focus: [1, 2]
        say: "Chọn tiên nghiệm cho rằng đồng xu chắc gần cân đối, tỉ lệ với thê ta nhân 1 trừ thê ta, giống như đã thấy thêm 1 ngửa và 1 sấp. Thay vào và cho đạo hàm bằng 0, với 3 ngửa trong 3 lần, ta được 4 phần 5, tức 0 phẩy 8, hợp lý hơn nhiều so với 1."

  - id: map_pic
    kind: intuition
    title: "Nhìn thấy MAP: nhân hai đường cong"
    checks:
      - "(lambda t: sp.expand(t**3*t*(1 - t) - t**4*(1 - t)) == 0)(sp.Symbol('t'))"
      - "(lambda t: sp.solve(sp.diff(t*(1 - t), t), t) == [Rational(1, 2)] and sp.solve(sp.diff(t**4*(1 - t), t), t) == [0, Rational(4, 5)])(sp.Symbol('t'))"
      - "(lambda t: (t**4*(1 - t)).subs(t, 1) == 0 and (t*(1 - t)).subs(t, 1) == 0 and (t**3).subs(t, 1) == 1)(sp.Symbol('t'))"
      - "[Rational(t, 10)**4*(1 - Rational(t, 10)) for t in (7, 8, 9, 10)] == [Rational(7203, 100000), Rational(8192, 100000), Rational(6561, 100000), 0]"
    steps:
      - show: |
