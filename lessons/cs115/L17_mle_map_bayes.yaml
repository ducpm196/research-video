id: L17
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 17 — Ước lượng tham số: MLE, MAP, Bayes"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L305–L330 (MLE, MAP, Bayesian Inference; MLE của μ trong phân phối chuẩn); PR25 (MLE cần dữ liệu độc lập; Categorical ML; MAP với prior Dirichlet = số đếm giả; ML/MAP quá tự tin khi ít dữ liệu); AUDIT A8"
assumes: [cdot, sub, prime, implies, hat, prob, given, sum, log, exp, mu, sigma, normal, pi, sqrt, integral, partial, approx, dots]
# Quy ước ký hiệu: tham số viết \theta (chữ thường, KHÔNG in đậm — bài này chỉ có tham số là số; ở bài 16 \theta là góc — nói ở
#   notation_note); dữ liệu \mathcal{D} = (x_1, …, x_N); ước lượng có mũ: \hat{\theta}; lôgarit viết \ln (tài liệu dòng 311, 314 viết \log —
#   bài 12 đã nói log trong học máy là ln); argmax viết \operatorname{arg\,max}.
#   Prior dùng trong bài: P(θ) tỉ lệ với θ(1 − θ) (“giả vờ đã thấy thêm 1 ngửa, 1 sấp”); đây là trường hợp 2 lớp của prior Dirichlet (PR25).
# Lời đọc: “Bayes” → lexicon Bay-ét (B41 PARTIAL); không đọc MLE/MAP thành chữ cái — nói “ước lượng hợp lý cực đại”, “ước lượng hậu nghiệm cực đại”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 6 (đạo hàm, đạo hàm riêng), bài 8 (cực đại: đạo hàm bằng 0), bài 12 (ln biến tích thành
#   tổng; đồng xu 3 ngửa 1 sấp cho p = 3/4), bài 13 (độc lập: P(A và B) = P(A)·P(B); định lý Bayes; tiên nghiệm, hậu nghiệm;
#   phân phối phân loại), bài 14 (mật độ chuẩn; tích phân = diện tích).
# Sửa nguồn (AUDIT A8): dạng tổng log của MLE cần dữ liệu độc lập cùng phân phối (i.i.d.); MAP bỏ được P(D) vì không phụ thuộc θ.
objectives:
  - "Viết hàm khả năng của dữ liệu độc lập và biết vì sao lấy ln"
  - "Tìm ước lượng hợp lý cực đại (MLE) cho đồng xu, phân phối chuẩn, phân phối phân loại"
  - "Hiểu MAP = MLE cộng thêm tiên nghiệm, vì sao bỏ được P(D)"
  - "Thấy MLE quá tự tin khi ít dữ liệu và tiên nghiệm sửa điều đó"
  - "Phân biệt MLE, MAP với cách tiếp cận Bayes giữ cả phân phối"
