id: L33
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 33 — Tổng ôn: bảng thuật toán & 3 câu hỏi vàng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L392–L421 (bảng hệ thống thuật toán; 3 câu hỏi vàng); AUDIT A14 (KNN không có hàm sai số), A23 (LDA: tỉ số), A24 (K-Means: tổng bình phương)"
assumes: [cdot, sub, vec, mat, transpose, norm, sum, sigma, Sigma_mat, lambda, theta, log, hat, nabla, approx]
# Bài tổng ôn: mỗi mục nhắc lại bài gốc kèm nội dung (luật 17). Bảng thuật toán của tài liệu (dòng 392–405) được SỬA 3 chỗ theo AUDIT:
#   KNN không có hàm sai số; K-Means là tổng BÌNH PHƯƠNG khoảng cách; LDA tối đa TỈ SỐ (khoảng cách tâm)² / độ trải trong lớp.
# Mọi con số nhắc lại được tính lại trong `checks` (cùng số với bài gốc).
objectives:
  - "Nhìn lại toàn bộ thuật toán qua ba câu hỏi: biểu diễn, mất mát, tối ưu"
  - "Đọc bảng tổng hợp thuật toán và biết ba chỗ hay bị ghi sai"
  - "Phân biệt các ký hiệu cùng hình khác nghĩa trong cả khoá học"
  - "Tự áp ba câu hỏi vàng cho một mô hình mới"
asr_reviewed:
  - sentence: "Câu ba, tối ưu, tìm tham số bằng giải đóng, gradient descent, thuật toán lặp, hay không cần học."
    reason: "lẫn vần/thanh ưu→yêu, thuật→thuộc, lặp→lập (đều gặp ở các bài trước); “gradient descent” khớp — cần người nghe"
  - sentence: "Xích ma thường là độ lệch chuẩn, giá trị kỳ dị, hoặc hàm sigmoid."
    reason: "“xích” chép “sít”, xích-moi chép “sít moi” — nút thắt sigmoid PARTIAL"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hơn mười thuật toán — một khung duy nhất"
    steps:
      - show: |
          <p class="big">Từ bài 18 đến bài 32 ta đã gặp hồi quy, logistic, softmax, láng giềng gần nhất, SVM, cây quyết định, K-Means, PCA, LDA, hỗn hợp phân phối chuẩn, NMF, t-SNE…</p>
          <div class="box key">Có <b>3 câu hỏi vàng</b> để hiểu và giảng lại bất kỳ mô hình nào: <b>biểu diễn</b> — <b>mất mát</b> — <b>tối ưu</b>.</div>
        focus: [1, 2, 0]
        say: "Chào bạn, từ bài 18 đến bài 32 ta đã gặp hơn mười thuật toán. Có ba câu hỏi vàng giúp hiểu và giảng lại bất kỳ mô hình nào, đó là biểu diễn, mất mát và tối ưu. Bài tổng ôn này dùng ba câu hỏi đó để nhìn lại các bài đã học."

  - id: prereq
    kind: prereq
    title: "Ôn nền: ba con số sẽ dùng lại"
    checks:
      - "[round(1.4*x + 0.5, 1) for x in (1, 2, 3, 4)] == [1.9, 3.3, 4.7, 6.1] and round(sum((1.4*x + 0.5 - y)**2 for x, y in zip((1, 2, 3, 4), (2, 3, 5, 6)))/4, 4) == 0.05"
      - "round(-math.log(0.9), 3) == 0.105 and Rational(0 + 1 + 10, 3) == Rational(11, 3)"
    steps:
      - show: |
          <table class="t"><tr><th>đã học</th><th>nhắc lại</th><th>làm thử bằng số</th></tr>
          <tr><td>bài 18: sai số bình phương trung bình (MSE)</td><td>trung bình của (dự đoán − giá thật)²</td><td>4 căn phòng, đường $1{,}4x + 0{,}5$: sai lệch $-0{,}1;\ 0{,}3;\ -0{,}3;\ 0{,}1$ → $\frac{0{,}01 + 0{,}09 + 0{,}09 + 0{,}01}{4} = 0{,}05$</td></tr>
          <tr><td>bài 20: entropy chéo</td><td>$-\ln$(xác suất đoán cho đáp án đúng)</td><td>đoán đúng 0,9 → $-\ln 0{,}9 \approx 0{,}105$</td></tr>
          <tr><td>bài 13: trung bình</td><td>tổng chia số phần tử</td><td>0, 1, 10 → $\frac{11}{3}$</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Trước khi tổng ôn, ta nhắc lại ba con số sẽ dùng lại nhiều lần. Ở bài 18, đường thẳng 1 phẩy 4 x cộng 0 phẩy 5 qua bốn căn phòng lệch 0 phẩy 1, 0 phẩy 3, 0 phẩy 3 và 0 phẩy 1. Bình phương rồi lấy trung bình, sai số bình phương trung bình bằng 0 phẩy 05. Ở bài 20, đoán đúng với xác suất 0 phẩy 9 thì entropy chéo bằng âm lôgarit của 0 phẩy 9, khoảng 0 phẩy 105. Ở bài 13, trung bình của 0, 1 và 10 là 11 phần 3."

  # ───────────────────────── 2. BA CÂU HỎI ─────────────────────────
  - id: questions
    kind: concept
    title: "Ba câu hỏi vàng"
    checks:
      - "round(1.4*2 + 0.5, 1) == 3.3 and round((3.3 - 3)**2, 2) == 0.09"
    steps:
      - show: |
          <ol><li><b>Biểu diễn</b>: dữ liệu vào là vector hay ma trận nào? (bài 1, 2: mỗi mẫu một vector, cả tập một ma trận)</li>
          <li><b>Mất mát</b>: đo sai bằng hàm nào, và vì sao? (bài 17: thường suy ra từ ước lượng hợp lý cực đại)</li>
          <li><b>Tối ưu</b>: tìm tham số bằng cách nào? (giải đóng như bài 18, gradient descent bài 9, EM bài 30, hoặc không cần học như bài 27)</li></ol>
        say: "Câu một, biểu diễn, dữ liệu là vector hay ma trận nào, như bài 1 và 2. Câu hai, mất mát, đo sai bằng hàm nào và vì sao, thường suy ra từ ước lượng hợp lý cực đại của bài 17. Câu ba, tối ưu, tìm tham số bằng giải đóng, gradient descent, thuật toán lặp, hay không cần học."
      - clear: true
        show: |
          <svg width="1520" height="320" viewBox="0 0 1520 320"><defs><marker id="arQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g fill="#1f2937"><rect x="20" y="50" width="440" height="140" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="2.5"/><text x="240" y="88" font-size="23" font-weight="bold" text-anchor="middle">① biểu diễn</text><text x="240" y="128" font-size="21" text-anchor="middle">căn phòng 2: x = 2</text><text x="240" y="164" font-size="21" text-anchor="middle">giá thật y = 3</text><rect x="540" y="50" width="440" height="140" rx="14" fill="#fef3c7" stroke="#1f2937" stroke-width="2.5"/><text x="760" y="88" font-size="23" font-weight="bold" text-anchor="middle">mô hình (tham số w, b)</text><text x="760" y="128" font-size="21" text-anchor="middle">dự đoán = w × x + b</text><text x="760" y="164" font-size="21" text-anchor="middle">= 1,4 × 2 + 0,5 = 3,3</text><rect x="1060" y="50" width="440" height="140" rx="14" fill="#fee2e2" stroke="#1f2937" stroke-width="2.5"/><text x="1280" y="88" font-size="23" font-weight="bold" text-anchor="middle">② mất mát</text><text x="1280" y="128" font-size="21" text-anchor="middle">(3,3 − 3)² = 0,09</text><text x="1280" y="164" font-size="21" text-anchor="middle">trung bình 4 phòng: 0,05</text></g><g stroke="#1f2937" stroke-width="3" fill="none"><line x1="462" y1="120" x2="536" y2="120" marker-end="url(#arQ)"/><line x1="982" y1="120" x2="1056" y2="120" marker-end="url(#arQ)"/><path d="M1280,192 C1280,265 760,265 760,196" stroke="#059669" stroke-dasharray="12 8" marker-end="url(#arQ)"/></g><text x="1020" y="300" font-size="22" text-anchor="middle" fill="#047857">③ tối ưu: chỉnh w, b để mất mát nhỏ nhất → w = 1,4; b = 0,5</text></svg>
        focus: [0, 0, 0, 0]
        say: "Hình cho thấy ba câu hỏi nối với nhau thành một vòng, lấy ví dụ căn phòng thứ hai của bài 18. Biểu diễn biến căn phòng thành con số x bằng 2, kèm giá thật y bằng 3. Mô hình dùng tham số w và b để dự đoán 3 phẩy 3, và mất mát đo độ lệch, bình phương được 0 phẩy 09. Mũi tên xanh quay ngược là tối ưu, chỉnh w và b sao cho mất mát trung bình của cả bốn phòng nhỏ nhất, và kết quả là w bằng 1 phẩy 4, b bằng 0 phẩy 5."

  # ───────────────────────── 3. BẢNG THUẬT TOÁN ─────────────────────────
  - id: table
    kind: example
    title: "Bảng tổng hợp thuật toán (và 3 chỗ hay bị ghi sai)"
    checks:
      - "Rational(sum((y - (Rational(1, 2) + Rational(7, 5)*x))**2 for x, y in zip([1, 2, 3, 4], [2, 3, 5, 6])), 4) == Rational(1, 20) and round(-math.log(0.9), 3) == 0.105"
      - "(lambda x: (Rational(sum(x), 3), sum(abs(v - 1) for v in x)))([0, 1, 10]) == (Rational(11, 3), 10)"
    steps:
      - show: |
          <table class="t"><tr><th>thuật toán (bài)</th><th>học</th><th>mất mát / độ đo</th><th>tối ưu</th></tr>
          <tr><td>hồi quy tuyến tính (18)</td><td>có nhãn</td><td>MSE</td><td>phương trình chuẩn / GD</td></tr>
          <tr><td>logistic, softmax (20)</td><td>có nhãn</td><td>entropy chéo</td><td>GD (lồi khi tuyến tính theo $\mathbf{w}$)</td></tr>
          <tr><td>SVM (25)</td><td>có nhãn</td><td>bản lề + phạt L2</td><td>tối ưu lồi, KKT (24)</td></tr>
          <tr><td>cây, rừng (28)</td><td>có nhãn</td><td>entropy / Gini</td><td>chọn câu hỏi tham lam</td></tr>
          <tr><td>KNN (27)</td><td>có nhãn</td><td><b>không có</b> hàm mất mát</td><td>không học — chỉ lưu</td></tr>
          <tr><td>K-Means (29)</td><td>không nhãn</td><td>tổng <b>bình phương</b> khoảng cách</td><td>lặp gán – lấy trung bình</td></tr>
          <tr><td>PCA / SVD (16)</td><td>không nhãn</td><td>phương sai giữ lại</td><td>vector riêng / SVD</td></tr>
          <tr><td>LDA (26)</td><td>có nhãn</td><td><b>tỉ số</b> Fisher</td><td>trị riêng</td></tr></table>
        say: "Đây là bảng tổng hợp các thuật toán, đã sửa ba chỗ mà bảng tóm tắt ở nhiều nơi hay ghi sai. Láng giềng gần nhất không có hàm mất mát nào, nó chỉ lưu dữ liệu. K trung bình làm nhỏ tổng bình phương khoảng cách, không phải tổng khoảng cách. Và phân tích phân biệt tuyến tính tối đa một tỉ số, không chỉ khoảng cách giữa các lớp."
      - show: |
          <p class="note">Nhắc lại bằng số: hồi quy 4 căn phòng (bài 18) có MSE 0,05; một mẫu đoán đúng 0,9 có entropy chéo $-\ln 0{,}9 \approx 0{,}105$ (bài 20); cụm 0, 1, 10 có tâm trung bình $\frac{11}{3}$ cho tổng bình phương, còn tổng khoảng cách nhỏ nhất (bằng 10) lại ở số đứng giữa 1 (bài 29).</p>
        say: "Nhắc lại bằng số, hồi quy bốn căn phòng ở bài 18 có sai số 0 phẩy 05. Một mẫu đoán đúng 0 phẩy 9 có entropy chéo 0 phẩy 105 như bài 20. Và cụm 0, 1, 10 ở bài 29 cho thấy vì sao chữ bình phương quan trọng."

  - id: apply_lin
    kind: example
    title: "Làm mẫu từng bước: ba câu hỏi cho hồi quy bốn căn phòng"
    checks:
      - "1 + 2 + 3 + 4 == 10 and 1 + 4 + 9 + 16 == 30 and 2 + 3 + 5 + 6 == 16 and 1*2 + 2*3 + 3*5 + 4*6 == 47"
      - "sp.solve([4*sp.Symbol('b') + 10*sp.Symbol('w') - 16, 10*sp.Symbol('b') + 30*sp.Symbol('w') - 47], [sp.Symbol('b'), sp.Symbol('w')]) == {sp.Symbol('b'): Rational(1, 2), sp.Symbol('w'): Rational(7, 5)}"
      - "Rational(47, 1) - Rational(40, 1) == 7 and Rational(7, 5) == Rational(14, 10) and (16 - 10*Rational(7, 5))/4 == Rational(1, 2) and 30 - 25 == 5"
      - "[Rational(7, 5)*x + Rational(1, 2) - y for x, y in zip((1, 2, 3, 4), (2, 3, 5, 6))] == [Rational(-1, 10), Rational(3, 10), Rational(-3, 10), Rational(1, 10)]"
    steps:
      - show: |
          <p><b>Bước 1 — biểu diễn:</b> 4 căn phòng, mỗi phòng một số $x$ và giá thật $y$; dự đoán $\hat{y} = w\cdot x + b$.</p>
          <table class="t"><tr><th>phòng</th><th>1</th><th>2</th><th>3</th><th>4</th><th>tổng</th></tr>
          <tr><td>$x$</td><td>1</td><td>2</td><td>3</td><td>4</td><td>10</td></tr>
          <tr><td>$y$</td><td>2</td><td>3</td><td>5</td><td>6</td><td>16</td></tr>
          <tr><td>$x^2$</td><td>1</td><td>4</td><td>9</td><td>16</td><td>30</td></tr>
          <tr><td>$x\cdot y$</td><td>2</td><td>6</td><td>15</td><td>24</td><td>47</td></tr></table>
        focus: [1, "2.2", "2.3", ["2.4", "2.5"]]
        say: "Bây giờ áp ba câu hỏi cho hồi quy bốn căn phòng, mỗi bước một phép tính. Bước một là biểu diễn, mỗi phòng có một con số x và giá thật y, dự đoán bằng w nhân x cộng b. Cộng các cột, tổng của x là 10, tổng của y là 16. Tổng x bình phương là 30, và tổng x nhân y là 47."
      - show: |
          <p><b>Bước 2 — mất mát và tối ưu:</b> đặt đạo hàm của tổng bình phương theo $b$ và $w$ bằng 0, được phương trình chuẩn (bài 18):</p>
          $$\begin{cases} 4b + 10w = 16 \\ 10b + 30w = 47 \end{cases}$$
        focus: [1, 2]
        say: "Bước hai, mất mát là tổng bình phương sai lệch, và tối ưu bằng cách đặt đạo hàm theo b và theo w bằng 0, như bài 18. Thay các tổng vừa tính, ta được hệ hai phương trình trên màn hình, chính là phương trình chuẩn."
      - clear: true
        show: |
          <p>Hệ phương trình chuẩn: &nbsp; $4b + 10w = 16$ &nbsp; và &nbsp; $10b + 30w = 47$.</p>
          <p><b>Bước 3 — giải hệ:</b> nhân phương trình đầu với 2,5 rồi trừ khỏi phương trình sau để khử $b$:</p>
          $$(10b + 30w) - (10b + 25w) = 47 - 40 \;\Rightarrow\; 5w = 7 \;\Rightarrow\; w = \hlg{1{,}4} \qquad b = \frac{16 - 10\cdot 1{,}4}{4} = \hlg{0{,}5}$$
        introduces: [implies]
        focus: [[1, 2], 3, 3]
        say: "Bước ba, giải hệ, nhân phương trình đầu với 2 phẩy 5 thành 10 b cộng 25 w bằng 40, rồi trừ khỏi phương trình sau để khử b. Còn lại 5 w bằng 7, nên w bằng 1 phẩy 4. Thay ngược vào phương trình đầu, b bằng 16 trừ 14, chia 4, bằng 0 phẩy 5, đúng đường thẳng của bài 18."
      - clear: true
        show: |
          <p><b>Bước 4 — sai lệch từng phòng</b> (giá thật 2, 3, 5, 6): dự đoán trừ giá thật, với $\hat{y} = 1{,}4x + 0{,}5$:</p>
          <table class="t"><tr><th>phòng</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>$\hat{y}$</td><td>1,9</td><td>3,3</td><td>4,7</td><td>6,1</td></tr>
          <tr><td>$\hat{y} - y$</td><td>−0,1</td><td>0,3</td><td>−0,3</td><td>0,1</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước bốn, tính dự đoán của từng phòng, được 1 phẩy 9, 3 phẩy 3, 4 phẩy 7 và 6 phẩy 1. Trừ giá thật, sai lệch là âm 0 phẩy 1, 0 phẩy 3, âm 0 phẩy 3 và 0 phẩy 1. Bình phương và lấy trung bình, ta lại được 0 phẩy 05 như phần ôn nền."

  - id: verify
    kind: check
    title: "Tự kiểm bằng đường khác: gradient bằng 0, và chữ “bình phương”"
    checks:
      - "Rational(-1, 10) + Rational(3, 10) - Rational(3, 10) + Rational(1, 10) == 0 and 1*Rational(-1, 10) + 2*Rational(3, 10) + 3*Rational(-3, 10) + 4*Rational(1, 10) == 0"
      - "(lambda x, c: (sum((v - c)**2 for v in x), sum(abs(v - c) for v in x)))([0, 1, 10], Rational(11, 3)) == (Rational(182, 3), Rational(38, 3)) and (lambda x: (sum((v - 1)**2 for v in x), sum(abs(v - 1) for v in x)))([0, 1, 10]) == (82, 10) and round(182/3, 2) == 60.67 and round(38/3, 2) == 12.67"
    steps:
      - show: |
          <p>Không giải lại hệ — chỉ kiểm điều kiện “đạo hàm bằng 0” từ bảng sai lệch $-0{,}1;\ 0{,}3;\ -0{,}3;\ 0{,}1$:</p>
          $$\sum(\hat{y} - y) = -0{,}1 + 0{,}3 - 0{,}3 + 0{,}1 = 0 \qquad \sum x\,(\hat{y} - y) = -0{,}1 + 0{,}6 - 0{,}9 + 0{,}4 = 0\ \checkmark$$
        focus: [1, 2, 2]
        say: "Kiểm bằng đường khác, không giải lại hệ mà chỉ xem điều kiện đạo hàm bằng 0 có đúng không. Tổng các sai lệch bằng 0. Tổng x nhân sai lệch là âm 0 phẩy 1 cộng 0 phẩy 6 trừ 0 phẩy 9 cộng 0 phẩy 4, cũng bằng 0, nên w và b vừa tìm đúng là điểm đáy."
      - show: |
          <p>Chữ “bình phương” của K-Means (bài 29) đổi hẳn đáp án — cụm 0, 1, 10:</p>
          <table class="t"><tr><th>tâm đặt ở</th><th>tổng bình phương khoảng cách</th><th>tổng khoảng cách</th></tr>
          <tr><td>trung bình $\frac{11}{3}$</td><td>$\hlg{60{,}67}$ (nhỏ nhất)</td><td>12,67</td></tr>
          <tr><td>số đứng giữa 1</td><td>82</td><td>$\hlg{10}$ (nhỏ nhất)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chỗ sửa thứ hai trong bảng cũng kiểm được bằng số, với cụm 0, 1, 10 của bài 29. Đặt tâm ở trung bình 11 phần 3 thì tổng bình phương khoảng cách là 60 phẩy 67, nhỏ hơn 82 khi đặt ở số đứng giữa. Nhưng nếu bỏ chữ bình phương, tổng khoảng cách lại nhỏ nhất ở số đứng giữa, bằng 10, nên thiếu một chữ là đổi cả thuật toán."

  # ───────────────────────── 4. KÝ HIỆU CÙNG HÌNH ─────────────────────────
  - id: symbols
    kind: symbol
    title: "Giải mã lần cuối: các chữ cùng hình, khác nghĩa"
    steps:
      - show: |
          <table class="t"><tr><th>chữ</th><th>các nghĩa trong khoá học</th></tr>
          <tr><td>$\sum$ và $\mathbf{\Sigma}$</td><td>dấu tổng (bài 1); ma trận hiệp phương sai (bài 15); ma trận giá trị kỳ dị (bài 16)</td></tr>
          <tr><td>$\sigma$</td><td>độ lệch chuẩn (bài 13–15); giá trị kỳ dị (bài 16); hàm sigmoid $\sigma(z)$ (bài 20)</td></tr>
          <tr><td>$\lambda$</td><td>trị riêng (bài 5); độ mạnh phạt (bài 19); nhân tử Lagrange (bài 24)</td></tr>
          <tr><td>$\theta$</td><td>góc (bài 16); tham số (bài 17)</td></tr>
          <tr><td>L</td><td>khả năng (bài 12, 17); $\mathcal{L}$ hàm Lagrange (bài 24); $\mathbf{L}$ ma trận Laplacian (bài 29)</td></tr></table>
          <p class="note">Quy tắc: luôn hỏi “chữ này đứng ở đâu, cạnh cái gì” trước khi đọc nghĩa.</p>
        introduces: [lagr, laplacian]
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Giải mã lần cuối các chữ cùng hình khác nghĩa. Xích ma hoa là dấu tổng, ma trận hiệp phương sai, hoặc ma trận giá trị kỳ dị. Xích ma thường là độ lệch chuẩn, giá trị kỳ dị, hoặc hàm sigmoid. Lam-đa là trị riêng, độ mạnh phạt, hoặc nhân tử. Hãy luôn xem chữ đứng ở đâu trước khi đọc nghĩa."

  # ───────────────────────── 5. ÁP DỤNG ─────────────────────────
  - id: apply
    kind: concept
    title: "Áp ba câu hỏi cho một mô hình: logistic"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>logistic (bài 20)</th></tr>
          <tr><td>① biểu diễn</td><td>mỗi mẫu một vector $\mathbf{x}$; tham số $\mathbf{w}$, $b$; điểm số $z = \mathbf{w}^T\mathbf{x} + b$</td></tr>
          <tr><td>② mất mát</td><td>entropy chéo nhị phân — từ MLE của phân phối Bernoulli (bài 13, 17)</td></tr>
          <tr><td>③ tối ưu</td><td>gradient descent (bài 9) với gradient $\frac{1}{N}\sum(\hat{y}_i - y_i)\mathbf{x}_i$ — lấy bằng quy tắc chuỗi (bài 7, 22)</td></tr></table>
        say: "Áp thử ba câu hỏi cho mô hình logistic của bài 20. Biểu diễn, mỗi mẫu là một vector và điểm số là tổng có trọng số. Mất mát, entropy chéo nhị phân, suy ra từ ước lượng hợp lý cực đại cho phân phối Bernoulli. Tối ưu, gradient descent với gradient dự đoán trừ nhãn."

  # ───────────────────────── 6. CHUỖI KIẾN THỨC ─────────────────────────
  - id: map
    kind: concept
    title: "Bản đồ khoá học: toán nào nuôi thuật toán nào"
    steps:
      - show: |
          <div class="chain"><span class="n">đại số tuyến tính (1–5): vector, ma trận, hệ phương trình, trị riêng</span><span class="a">→</span>
          <span class="n">giải tích, tối ưu (6–12): gradient, quy tắc chuỗi, GD, lồi, e mũ, ln</span><span class="a">→</span>
          <span class="n">xác suất (13–17): Bayes, phân phối chuẩn, MLE, MAP</span><span class="a">→</span>
          <span class="n">mô hình (18–32)</span></div>
        say: "Bản đồ khoá học có bốn tầng. Đại số tuyến tính cho cách biểu diễn. Giải tích và tối ưu cho cách tìm tham số. Xác suất cho lý do chọn hàm mất mát. Và cả ba gặp nhau trong các mô hình từ bài 18 đến bài 32."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi tổng kết"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin bảng tóm tắt mà không kiểm định nghĩa <b class="red">(dễ sai)</b>
          <br><span class="note">Nhiều bảng tóm tắt thiếu đúng 3 chỗ: KNN, K-Means, LDA.</span></div>
        say: "Lỗi thứ nhất, tin ngay vào bảng tóm tắt mà không kiểm lại định nghĩa. Nhiều bảng tóm tắt thiếu đúng ba chỗ như ta vừa sửa."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn mô hình hay siêu tham số bằng sai số huấn luyện <b class="red">(sai)</b>
          <br><span class="note">Luôn dùng tập kiểm định; tập kiểm tra chỉ chấm điểm cuối (bài 19, 21).</span></div>
        say: "Lỗi thứ hai, chọn mô hình hay siêu tham số bằng sai số huấn luyện. Luôn dùng tập kiểm định, còn tập kiểm tra chỉ để chấm điểm cuối, như bài 19 và 21."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ “dùng entropy chéo thì luôn hội tụ toàn cục” <b class="red">(sai)</b>
          <br><span class="note">Chỉ lồi khi mô hình tuyến tính theo $\mathbf{w}$; mạng nhiều lớp không lồi (bài 20, 23).</span></div>
        say: "Lỗi thứ ba, nghĩ rằng dùng entropy chéo thì luôn tìm được nghiệm tốt nhất. Điều đó chỉ đúng khi mô hình tuyến tính theo w, còn mạng nhiều lớp thì không lồi, như bài 20 và 23."

  # ───────────────────────── 8. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda c: sp.solve(sp.diff(sum((v - c)**2 for v in (0, 1, 10)), c), c) == [Rational(11, 3)])(sp.Symbol('c'))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Thuật toán nào <b>không</b> có hàm mất mát?</td></tr>
          <tr><td>2</td><td>K-Means làm nhỏ đại lượng gì? Vì sao tâm là trung bình?</td></tr>
          <tr><td>3</td><td>Áp 3 câu hỏi vàng cho hồi quy tuyến tính.</td></tr></table>
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình, ôn lại cả khoá học. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① K láng giềng gần nhất (chỉ lưu dữ liệu)</p>
          <p>② tổng bình phương khoảng cách $J(c) = \sum_i (x_i - c)^2$; đạo hàm bằng 0:</p>
          $$-2\sum_i (x_i - c) = 0 \;\Rightarrow\; c = \Big(\sum_i x_i\Big) / N \quad (\text{0, 1, 10: } c = 11/3)$$
        focus: [1, 2, 3]
        say: "Đáp án câu một, K láng giềng gần nhất, vì nó chỉ lưu dữ liệu. Câu hai, K trung bình làm nhỏ tổng bình phương khoảng cách tới tâm. Đặt đạo hàm theo tâm bằng 0, ta được tâm bằng tổng chia số điểm, chính là trung bình, như 11 phần 3 của cụm 0, 1, 10."
      - show: |
          <table class="t"><tr><th>③ câu hỏi</th><th>hồi quy tuyến tính</th></tr>
          <tr><td>biểu diễn</td><td>$\hat{\mathbf{y}} = \mathbf{X}\mathbf{w}$ (thêm cột số 1 cho $b$)</td></tr>
          <tr><td>mất mát</td><td>MSE — từ MLE với sai số chuẩn (bài 17)</td></tr>
          <tr><td>tối ưu</td><td>phương trình chuẩn $\mathbf{X}^T\mathbf{X}\mathbf{w} = \mathbf{X}^T\mathbf{y}$ (bốn căn phòng: $w = 1{,}4$, $b = 0{,}5$) hoặc GD</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Câu ba, biểu diễn bằng X nhân w, mất mát là trung bình bình phương sai số, và tối ưu bằng phương trình chuẩn hoặc gradient descent. Mất mát này suy ra từ ước lượng hợp lý cực đại khi sai số có phân phối chuẩn. Với bốn căn phòng, phương trình chuẩn cho w bằng 1 phẩy 4 và b bằng 0 phẩy 5, như ta vừa giải."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">biểu diễn: vector, ma trận</span><span class="a">→</span>
          <span class="n">mất mát: từ mô hình xác suất</span><span class="a">→</span>
          <span class="n">tối ưu: giải đóng, gradient, lặp</span><span class="a">→</span>
          <span class="n">kiểm định trên dữ liệu chưa thấy</span></div>
        say: "Tổng kết cả khoá học. Biểu diễn dữ liệu bằng vector và ma trận. Chọn hàm mất mát từ mô hình xác suất. Tối ưu bằng giải đóng, gradient hoặc thuật toán lặp. Và luôn kiểm định trên dữ liệu chưa thấy."
      - show: |
          <div class="box key"><b>Tư duy:</b> mọi mô hình học máy đều trả lời ba câu hỏi — nắm được ba câu đó, bạn có thể tự học thuật toán mới.</div>
        say: "Điều cần mang theo, mọi mô hình học máy đều trả lời ba câu hỏi, và nắm được ba câu đó, bạn có thể tự học bất kỳ thuật toán mới nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 34, mở rộng tuỳ chọn): <b>phép tích chập</b> và mạng nơ-ron tích chập (CNN) cho ảnh.</p>
          <p class="note">Chưa học bài 44 (thống kê: điểm số dao động bao nhiêu, so sánh hai mô hình)? Hãy học nó trước phần mở rộng.</p>
        focus: [2, 1, 0]
        forward_ref: true
        say: "Phần chính của khoá học kết thúc ở đây, cùng với bài 44 về thống kê, nên nếu chưa học bài đó thì hãy học trước phần mở rộng. Ở bài sau, bài 34, phần mở rộng tuỳ chọn, ta học phép tích chập và mạng nơ-ron tích chập cho ảnh. Hẹn gặp bạn ở bài tiếp theo."
