          <div class="col"><p>Cả 4 bạn nằm trên <b>cùng một elip</b> (màu xanh lá): cùng khoảng cách theo độ trải.</p>
          <p>Đường tròn nét đứt (khoảng cách thẳng) bỏ qua xu hướng “giỏi Toán thì giỏi Lý”.</p></div></div>
        say: "Trên hình, cả 4 bạn nằm trên cùng một elip màu xanh lá, nghĩa là cùng khoảng cách theo độ trải. Elip dài theo hướng chéo, vì hai môn thường cùng cao, cùng thấp. Đường tròn nét đứt của khoảng cách thẳng thì bỏ qua xu hướng đó."

  # ───────────────────────── 7. TRỤC ELIP = VECTOR RIÊNG ─────────────────────────
  - id: eigen
    kind: concept
    title: "Trục của elip là vector riêng của Σ"
    checks:
      - "(lambda S: S*Matrix([1, 1]) == 4*Matrix([1, 1]) and S*Matrix([1, -1]) == 1*Matrix([1, -1]))(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]))"
      - "math.sqrt(4) == 2 and math.sqrt(1) == 1 and 4*1 == 4"
    steps:
      - show: |
          <p>Bài 5: vector riêng là hướng mà ma trận chỉ <b>kéo giãn</b>, trị riêng $\lambda$ là hệ số kéo giãn.</p>
          <p>$$\mathbf{\Sigma}\begin{bmatrix} 1 \\ 1 \end{bmatrix} = \begin{bmatrix} 4 \\ 4 \end{bmatrix} = 4\cdot\begin{bmatrix} 1 \\ 1 \end{bmatrix} \qquad \mathbf{\Sigma}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = \begin{bmatrix} 1 \\ -1 \end{bmatrix} = 1\cdot\begin{bmatrix} 1 \\ -1 \end{bmatrix}$$</p>
          <div class="box key">Trục dài của elip theo vector riêng $(1; 1)$, độ lệch chuẩn dọc trục là $\sqrt{\lambda} = \sqrt{4} = 2$; &nbsp; trục ngắn theo $(1; -1)$, độ lệch chuẩn $\sqrt{1} = 1$.</div>
        focus: [1, 2, ["3.1", "3.2"]]
        say: "Nhắc lại bài 5, vector riêng là hướng mà ma trận chỉ kéo giãn, còn trị riêng là hệ số kéo giãn. Xích ma hoa nhân vector 1, 1 được 4 lần chính nó, nhân vector 1, âm 1 được đúng nó. Vì vậy trục dài của elip theo hướng 1, 1, với độ lệch chuẩn bằng căn 4, bằng 2."
      - show: |
          <p class="note">Phương sai dọc mỗi trục chính là trị riêng: 4 và 1. Tích hai trị riêng $= 4 = \det(\mathbf{\Sigma})$.</p>
        say: "Phương sai dọc mỗi trục chính là trị riêng tương ứng, 4 và 1, và tích hai trị riêng bằng 4, đúng bằng định thức. Trục có trị riêng lớn nhất là hướng dữ liệu trải rộng nhất."

  # ───────────────────────── 8. ĐIỀU KIỆN CỦA Σ ─────────────────────────
  - id: spd
    kind: formula
    title: "Vì sao Σ phải đối xứng và xác định dương"
    checks:
      - "Matrix([[1, 1], [1, 1]]).det() == 0 and sorted(Matrix([[1, 1], [1, 1]]).eigenvals().keys()) == [0, 2]"
      - "all(v > 0 for v in Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).eigenvals().keys())"
      - "(lambda a, b: sp.expand((Matrix([[a, b]])*Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]])*Matrix([a, b]))[0] - 2*(a + b)**2 - Rational(1, 2)*(a - b)**2) == 0)(*sp.symbols('a b'))"
    steps:
      - show: |
          <p>Phương sai theo bất kỳ hướng nào luôn $\ge 0$; công thức mật độ cần nó <b>dương</b>. Với $\mathbf{\Sigma}$ đối xứng, điều đó tương đương: mọi trị riêng $> 0$ — gọi là <b>xác định dương</b>.</p>
          <p class="note">Khi đó $\det(\mathbf{\Sigma})$ = tích các trị riêng $> 0$, nên có $\mathbf{\Sigma}^{-1}$ và có $\sqrt{\det(\mathbf{\Sigma})}$ — công thức mật độ dùng được.</p>
        focus: [1, 1, 2]
        say: "Theo định nghĩa, phương sai theo bất kỳ hướng nào cũng không thể âm, và để công thức dùng được thì phải dương. Với ma trận đối xứng, điều đó nghĩa là mọi trị riêng dương, gọi là xác định dương. Khi đó định thức dương, nên có ma trận nghịch đảo."
      - show: |
          <p>Phản ví dụ: điểm Lý luôn <b>bằng đúng</b> điểm Toán ($\rho = 1$): $\ \mathbf{\Sigma} = \begin{bmatrix} 1 & 1 \\ 1 & 1 \end{bmatrix}$, &nbsp; </p>
          <p>$\det = 1 - 1 = 0$, &nbsp; trị riêng 2 và $\hlo{0}$</p>
          <p class="note">Dữ liệu nằm hẳn trên một đường thẳng: theo hướng $(1; -1)$ không có độ trải nào → không có $\mathbf{\Sigma}^{-1}$, công thức mật độ hỏng.</p>
        focus: [[1, 2], 3]
        say: "Phản ví dụ, nếu điểm Lý luôn bằng đúng điểm Toán, thay vào ta được định thức bằng 0 và một trị riêng bằng 0. Dữ liệu nằm hẳn trên một đường thẳng, theo hướng vuông góc không có độ trải, nên không có nghịch đảo và công thức hỏng."

  # ───────────────────────── 9. KIỂM BẰNG MÔ PHỎNG ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: máy sinh 100 nghìn học sinh"
    checks:
      - "(lambda r: np.round(np.cov(r.T, bias=True), 2).tolist() == [[2.5, 1.51], [1.51, 2.52]] and np.round(r.mean(0), 2).tolist() == [6.0, 6.0])(np.random.default_rng(0).multivariate_normal([6, 6], [[2.5, 1.5], [1.5, 2.5]], 100000))"
    steps:
      - show: |
          <p>Máy sinh 100 000 cặp điểm theo $\mathcal{N}(\boldsymbol{\mu}, \mathbf{\Sigma})$ với $\boldsymbol{\mu} = (6; 6)$, rồi tính lại từ dữ liệu:</p>
          <table class="t"><tr><th></th><th>trung bình</th><th>ma trận hiệp phương sai</th></tr>
          <tr><td>mô phỏng</td><td>(6,00; 6,00)</td><td>$\begin{bmatrix} 2{,}50 & 1{,}51 \\ 1{,}51 & 2{,}52 \end{bmatrix}$</td></tr>
          <tr><td>đặt vào</td><td>(6; 6)</td><td>$\begin{bmatrix} 2{,}5 & 1{,}5 \\ 1{,}5 & 2{,}5 \end{bmatrix}\ \checkmark$</td></tr></table>
        focus: [1, "2.2"]
        say: "Phép thử, máy sinh 100 nghìn cặp điểm theo phân phối này, rồi tính lại trung bình và ma trận hiệp phương sai từ dữ liệu. Kết quả 2 phẩy 50, 1 phẩy 51 và 2 phẩy 52 khớp với ma trận đặt vào, vì dữ liệu càng nhiều thì ước lượng càng sát."

  # ───────────────────────── 10. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Ma trận hiệp phương sai trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>gặp lại $\mathbf{\Sigma}$ ở đâu</th></tr>
          <tr><td><b>Bài 16</b></td><td>tìm trục dài nhất của đám dữ liệu (vector riêng của $\mathbf{\Sigma}$) để nén dữ liệu. Ở đó có một ma trận khác cũng viết bằng chữ Sigma — khác nghĩa</td></tr>
          <tr><td><b>Bài 26</b></td><td>tìm hướng tách hai lớp, so với độ trải của từng lớp</td></tr>
          <tr><td><b>Bài 30</b></td><td>mô tả dữ liệu bằng nhiều elip chuẩn chồng lên nhau</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3", "1.4"]
        say: "Ở bài 16, ta tìm trục dài nhất của đám dữ liệu để nén dữ liệu, và gặp một ma trận khác cũng viết bằng chữ xích ma nhưng khác nghĩa. Ở bài 26, ta tìm hướng tách hai lớp. Ở bài 30, ta mô tả dữ liệu bằng nhiều elip chồng lên nhau."

  # ───────────────────────── 11. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "(lambda X: sum(x**3 for x in X)/3 - (sum(X)/3)*(sum(x**2 for x in X)/3))([-1, 0, 1]) == 0 and Rational(1, 3) != Rational(1, 3)*Rational(2, 3)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> $\operatorname{Cov}(X, Y) = 0$ nên $X$, $Y$ độc lập <b class="red">(sai)</b>
          <br><span class="note">$X$ bằng $-1$, $0$, $1$ khả năng như nhau, $Y = X^2$: $\operatorname{Cov} = 0$ nhưng biết $X$ là biết hẳn $Y$. Hiệp phương sai chỉ đo xu hướng <b>đường thẳng</b>.</span></div>
        say: "Lỗi thứ nhất, nghĩ rằng hiệp phương sai bằng 0 thì hai biến độc lập. Lấy X bằng âm 1, 0 hoặc 1, và Y bằng X bình phương. Hiệp phương sai bằng 0, nhưng biết X là biết hẳn Y. Hiệp phương sai chỉ đo xu hướng đường thẳng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng khoảng cách thẳng để tìm điểm bất thường khi các biến tương quan <b class="red">(dễ sai)</b>
          <br><span class="note">An cách xa hơn Bình theo đường thẳng, nhưng hai bạn bình thường như nhau theo độ trải.</span></div>
        say: "Lỗi thứ hai, dùng khoảng cách thẳng để tìm điểm bất thường khi các biến tương quan với nhau. Như ví dụ, An cách xa hơn theo đường thẳng, nhưng theo độ trải thì hai bạn bình thường như nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhầm $\mathbf{\Sigma}$ (ma trận hiệp phương sai) với $\sum$ (dấu tổng) <b class="red">(sai)</b>
          <br><span class="note">Xem chữ đứng ở đâu: $\mathbf{\Sigma}$ in đậm đứng như một ma trận ($\mathbf{\Sigma}^{-1}$, $\det(\mathbf{\Sigma})$); $\sum$ luôn có các số hạng cộng phía sau.</span></div>
        say: "Lỗi thứ ba, nhầm ma trận hiệp phương sai với dấu tổng, vì cùng chữ xích ma hoa. Hãy xem chữ đứng ở đâu. Ma trận thì có nghịch đảo và định thức, còn dấu tổng luôn có các số hạng cộng phía sau."

  # ───────────────────────── 12. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda X, Y: Rational(sum((x - 2)*(y - 4) for x, y in zip(X, Y)), 3))([1, 2, 3], [2, 4, 6]) == Rational(4, 3) and Rational(4, 3) / sp.sqrt(Rational(2, 3)*Rational(8, 3)) == 1"
      - "Matrix([[4, 0], [0, 1]]).eigenvals() == {4: 1, 1: 1} and math.sqrt(4) == 2"
      - "Matrix([[3, 1], [1, 3]]).det() == 8"
      - "(lambda X, Y: (Rational(sum((x - 2)**2 for x in X), 3), Rational(sum((y - 4)**2 for y in Y), 3)))([1, 2, 3], [2, 4, 6]) == (Rational(2, 3), Rational(8, 3)) and sp.sqrt(Rational(2, 3)*Rational(8, 3)) == Rational(4, 3)"
      - "Matrix([[4, 0], [0, 1]])*Matrix([1, 0]) == 4*Matrix([1, 0]) and Matrix([[4, 0], [0, 1]])*Matrix([0, 1]) == Matrix([0, 1])"
      - "Matrix([[3, 1], [1, 3]])*Matrix([1, 1]) == 4*Matrix([1, 1]) and Matrix([[3, 1], [1, 3]])*Matrix([1, -1]) == 2*Matrix([1, -1]) and 4*2 == Matrix([[3, 1], [1, 3]]).det()"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ba điểm dữ liệu $(1; 2)$, $(2; 4)$, $(3; 6)$. Tính $\operatorname{Cov}(X, Y)$ và $\rho$.</td></tr>
          <tr><td>2</td><td>$\mathbf{\Sigma} = \begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}$. Elip dài theo hướng nào? Độ lệch chuẩn dọc trục dài?</td></tr>
          <tr><td>3</td><td>Tính $\det(\mathbf{\Sigma})$ với $\mathbf{\Sigma} = \begin{bmatrix} 3 & 1 \\ 1 & 3 \end{bmatrix}$.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một tính hiệp phương sai và rô của ba điểm. Câu hai đọc hình dạng elip từ ma trận. Câu ba tính một định thức. Hãy dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Câu 1.</b> Trung bình $(2; 4)$; lập bảng độ lệch như ví dụ 4 bạn:</p>
          <table class="t"><tr><th>$x$</th><th>$y$</th><th>$x - 2$</th><th>$y - 4$</th><th>tích</th></tr>
          <tr><td>1</td><td>2</td><td>−1</td><td>−2</td><td>2</td></tr><tr><td>2</td><td>4</td><td>0</td><td>0</td><td>0</td></tr><tr><td>3</td><td>6</td><td>1</td><td>2</td><td>2</td></tr></table>
          $$\operatorname{Cov} = \frac{2 + 0 + 2}{3} = \hlg{\frac{4}{3}}, \quad \sigma_X^2 = \frac{1 + 0 + 1}{3} = \frac{2}{3}, \quad \sigma_Y^2 = \frac{4 + 0 + 4}{3} = \frac{8}{3}, \quad \rho = \frac{4/3}{\sqrt{\frac{2}{3}\cdot\frac{8}{3}}} = \frac{4/3}{4/3} = \hlg{1}$$
        focus: [1, 2, 3, 3]
        say: "Đáp án câu một, trung bình của hai cột là 2 và 4. Lập bảng độ lệch như ví dụ 4 bạn, ba tích là 2, 0 và 2, nên hiệp phương sai bằng 4 chia 3. Phương sai của X là hai phần ba, của Y là tám phần ba, căn của tích hai số này là bốn phần ba. Vậy rô bằng 1, đúng vì ba điểm nằm trên đường thẳng y bằng 2 x."
      - clear: true
        show: |
          <p><b>Câu 2.</b> Thử hai hướng trục:</p>
          $$\begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 1 \\ 0 \end{bmatrix} = 4\cdot\begin{bmatrix} 1 \\ 0 \end{bmatrix}, \qquad \begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 0 \\ 1 \end{bmatrix} = 1\cdot\begin{bmatrix} 0 \\ 1 \end{bmatrix}$$
          <p>Trị riêng lớn là 4, theo trục <b>ngang</b> → trục dài; độ lệch chuẩn $\sqrt{4} = \hlg{2}$ (trục ngắn: $\sqrt{1} = 1$).</p>
        focus: [1, 2, 3]
        say: "Câu hai, thử hai hướng trục. Ma trận nhân vector 1, 0 được 4 lần chính nó, nhân vector 0, 1 được đúng nó, nên hai trị riêng là 4 và 1. Trị riêng lớn hơn ứng với trục ngang, nên elip dài theo trục ngang, với độ lệch chuẩn căn 4, bằng 2."
      - show: |
          <p><b>Câu 3.</b> $$\det\begin{bmatrix} 3 & 1 \\ 1 & 3 \end{bmatrix} = 3\cdot 3 - 1\cdot 1 = \hlg{8}$$</p>
          <p class="note">Kiểm bằng trị riêng: $\mathbf{\Sigma}(1; 1) = (4; 4)$ → 4; &nbsp; $\mathbf{\Sigma}(1; -1) = (2; -2)$ → 2; &nbsp; tích $4\cdot 2 = 8\ \checkmark$</p>
        focus: [1, 2, 2]
        say: "Câu ba, định thức bằng 3 nhân 3 trừ 1 nhân 1, tức 9 trừ 1, bằng 8. Kiểm bằng đường khác, ma trận nhân vector 1, 1 được 4 lần nó, nhân vector 1, âm 1 được 2 lần nó. Tích hai trị riêng là 4 nhân 2, bằng 8, khớp với định thức."

  # ───────────────────────── 13. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$\operatorname{Cov}$: hai biến cùng tăng, giảm</span><span class="a">→</span>
          <span class="n">$\mathbf{\Sigma}$: phương sai và hiệp phương sai, đối xứng</span><span class="a">→</span>
          <span class="n">mật độ: chia $\sigma^2$ thành nhân $\mathbf{\Sigma}^{-1}$</span><span class="a">→</span>
          <span class="n">elip; trục = vector riêng, độ lệch chuẩn dọc trục = $\sqrt{\lambda}$</span></div>
        say: "Tổng kết chuỗi logic. Hiệp phương sai đo hai biến cùng tăng hay ngược nhau. Ma trận hiệp phương sai gom phương sai và hiệp phương sai, và luôn đối xứng. Mật độ nhiều chiều thay phép chia cho phương sai bằng ma trận nghịch đảo, và có hình elip theo các vector riêng."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi các biến đi cùng nhau, hãy đo khoảng cách <b>theo độ trải của dữ liệu</b>, không phải bằng thước thẳng.</div>
        say: "Điều cần mang theo, khi các biến đi cùng nhau, hãy đo khoảng cách theo độ trải của dữ liệu, không phải bằng thước thẳng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 16): <b>SVD và PCA</b> — nén dữ liệu bằng cách giữ lại các trục dài nhất.</p>
        forward_ref: true
        say: "Ở bài sau, bài 16, ta học phân rã giá trị kỳ dị và phân tích thành phần chính, để nén dữ liệu bằng cách giữ lại các trục dài nhất. Hẹn gặp bạn ở bài tiếp theo."
