id: L15
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 15 — Phân phối chuẩn nhiều chiều & ma trận hiệp phương sai"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L299 (Σ = E[(X − μ)(X − μ)ᵀ]), L301 (mật độ chuẩn nhiều chiều với |Σ|, Σ⁻¹); PR25 (Covariance and Correlation, Gaussian Random Vector)"
assumes: [cdot, sub, vec, mat, transpose, inverse, det, lambda, prob, expect, var, mu, sigma, exp, pi, normal, sum]
# Quy ước ký hiệu: hiệp phương sai \operatorname{Cov}(X, Y); hệ số tương quan \rho; ma trận hiệp phương sai \mathbf{\Sigma} (in đậm);
#   vector trung bình \boldsymbol{\mu}; định thức viết \det(\mathbf{\Sigma}) (tài liệu dòng 301 viết |Σ| — nói ở notation_note);
#   chia cho N (số điểm dữ liệu), cùng quy ước với kỳ vọng của bài 13; cách chia N − 1 chỉ nêu trong ghi chú.
# Lời đọc: KHÔNG đọc “Mahalanobis”, “Gaussian” (chưa probe ASR) — nói “khoảng cách theo độ trải”, “phân phối chuẩn”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (vector), bài 2 (chuyển vị, nghịch đảo, định thức ad − bc), bài 5 (vector riêng:
#   hướng ma trận chỉ kéo giãn, trị riêng: hệ số kéo giãn), bài 13 (kỳ vọng, phương sai), bài 14 (phân phối chuẩn một chiều, z).
# Sửa nguồn (curriculum fix): A11 — Σ (hiệp phương sai) khác ∑ (dấu tổng) và khác Σ của SVD bài 16; Σ phải đối xứng, xác định dương
#   để có Σ⁻¹ và det Σ > 0.
objectives:
  - "Tính hiệp phương sai và hệ số tương quan của hai biến từ dữ liệu"
  - "Lập ma trận hiệp phương sai và đọc được ý nghĩa từng phần tử"
  - "Đọc công thức mật độ chuẩn nhiều chiều, thấy nó mở rộng công thức một chiều"
  - "Dùng khoảng cách theo độ trải; nối trục elip với vector riêng của Σ"
  - "Biết vì sao Σ phải đối xứng và xác định dương"
asr_reviewed:   # ASR-checked, CHƯA nghe bằng tai — cần người nghe (REVIEW_L15.md)
  - sentence: "Câu hai đọc hình dạng elip từ ma trận."
    reason: "“elip” → “elit” (phụ âm cuối p/t); 3 câu khác cùng từ được chép “elipse/ellipse” (bí danh) — INFERRED ASR, cần người nghe"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai học sinh: ai “lạ” hơn?"
    steps:
      - show: |
          <p class="big">Lớp có trung bình điểm Toán 6, điểm Lý 6. &nbsp; Bạn An: (8; 8). &nbsp; Bạn Bình: (7; 5).</p>
          <p>Đo khoảng cách thẳng tới (6; 6): &nbsp; An cách 2,83, &nbsp; Bình cách 1,41. &nbsp; → An “lạ” hơn?</p>
          <div class="box key">Nhưng trong lớp này, ai giỏi Toán thường giỏi Lý. Điểm (8; 8) đi <b>đúng</b> xu hướng; (7; 5) đi <b>ngược</b> xu hướng — khoảng cách thẳng chưa nói hết.</div>
        focus: [0, 1, 1, 2]
        say: "Chào bạn, một câu hỏi. Lớp có trung bình điểm Toán 6 và điểm Lý 6. Bạn An được 8 và 8, bạn Bình được 7 và 5. Đo khoảng cách thẳng tới điểm trung bình, An cách 2 phẩy 83, Bình chỉ cách 1 phẩy 41, vậy An lạ hơn?"
      - show: |
          <p class="note">Hôm nay: hiệp phương sai (hai biến đi cùng nhau thế nào) → ma trận hiệp phương sai → phân phối chuẩn nhiều chiều.</p>
        say: "Nhưng trong lớp này, ai giỏi Toán thường giỏi Lý, nên 8 và 8 đi đúng xu hướng, còn 7 và 5 đi ngược xu hướng, vì thế khoảng cách thẳng chưa nói hết. Hôm nay ta học cách đo điều đó, bằng hiệp phương sai và phân phối chuẩn nhiều chiều."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: phân phối chuẩn một chiều của bài 14"
    steps:
      - show: |
          <p>Bài 14: $\mathcal{N}(\mu, \sigma^2)$ có mật độ $\ f(x) = \dfrac{1}{\sqrt{2\pi\sigma^2}}\cdot e^{-\frac{1}{2}\left(\frac{x - \mu}{\sigma}\right)^2}$</p>
          <p class="note">Số mũ chứa $z^2$ với $z = \frac{x - \mu}{\sigma}$: khoảng cách tới tâm, <b>đo bằng số lần</b> $\sigma$. Bài 13: $\sigma^2 = \operatorname{Var}(X) = \mathbb{E}\big[(X - \mu)^2\big]$.</p>
        focus: [[1, 2], 2]
        say: "Nhắc lại bài 14, mật độ chuẩn một chiều có số mũ là âm một nửa nhân z bình phương, với z là khoảng cách tới tâm, đo bằng số lần xích ma. Và theo bài 13, phương sai là trung bình bình phương khoảng cách tới kỳ vọng."

  # ───────────────────────── 3. HIỆP PHƯƠNG SAI ─────────────────────────
  - id: sym_cov
    kind: symbol
    title: "Giải mã: Cov(X, Y) — hai biến đi cùng nhau thế nào"
    checks:
      - "(lambda X, Y: (sum(X)/4, sum(Y)/4))([8, 4, 7, 5], [8, 4, 5, 7]) == (6, 6)"
      - "(lambda X, Y: sum((x - 6)*(y - 6) for x, y in zip(X, Y)) / 4)([8, 4, 7, 5], [8, 4, 5, 7]) == 1.5"
      - "(lambda X: sum((x - 6)**2 for x in X) / 4)([8, 4, 7, 5]) == 2.5 and 1.5 / math.sqrt(2.5*2.5) == 0.6"
    steps:
      - show: |
          <div class="box key">$\operatorname{Cov}(X, Y) = \mathbb{E}\big[(X - \mu_X)\cdot(Y - \mu_Y)\big]$ &nbsp; đọc là “hiệp phương sai của X và Y”</div>
          <table class="t"><tr><th>bạn</th><th>Toán $x$</th><th>Lý $y$</th><th>$x - 6$</th><th>$y - 6$</th><th>tích</th></tr>
          <tr><td>An</td><td>8</td><td>8</td><td>2</td><td>2</td><td>4</td></tr>
          <tr><td>Cường</td><td>4</td><td>4</td><td>−2</td><td>−2</td><td>4</td></tr>
          <tr><td>Bình</td><td>7</td><td>5</td><td>1</td><td>−1</td><td>−1</td></tr>
          <tr><td>Dũng</td><td>5</td><td>7</td><td>−1</td><td>1</td><td>−1</td></tr></table>
          <p>$\operatorname{Cov} = \frac{4 + 4 - 1 - 1}{4} = \hlg{1{,}5}$ &nbsp; (dương: hai điểm thường cùng cao, cùng thấp)</p>
        introduces: [cov]
        focus: [1, 2, 3]
        say: "Ký hiệu mới, hiệp phương sai của X và Y, là kỳ vọng của tích hai độ lệch. Với lớp 4 bạn, trung bình mỗi môn đều là 6. Nhân độ lệch Toán với độ lệch Lý của từng bạn, rồi lấy trung bình, được 1 phẩy 5, một số dương."
      - clear: true
        show: |
          <p>Dấu của $\operatorname{Cov}$: &nbsp; <b>dương</b> — cùng tăng; &nbsp; <b>âm</b> — cái này tăng thì cái kia giảm; &nbsp; gần <b>0</b> — không có xu hướng thẳng.</p>
          <div class="box key">Hệ số tương quan $\ \rho = \dfrac{\operatorname{Cov}(X, Y)}{\sigma_X\cdot\sigma_Y}$ (đọc “rô”), luôn nằm giữa $-1$ và $1$. &nbsp; Ở đây $\ \rho = \frac{1{,}5}{\sqrt{2{,}5}\cdot\sqrt{2{,}5}} = \hlg{0{,}6}$</div>
        introduces: [rho]
        focus: [1, 2, "2.4"]
        say: "Hiệp phương sai dương nghĩa là hai biến thường cùng tăng, âm nghĩa là cái này tăng thì cái kia giảm. Chia cho tích hai độ lệch chuẩn được hệ số tương quan, đọc là rô, luôn nằm giữa âm 1 và 1. Ở đây phương sai mỗi môn là 2 phẩy 5, nên rô bằng 0 phẩy 6."

  # ───────────────────────── 4. MA TRẬN HIỆP PHƯƠNG SAI ─────────────────────────
  - id: sym_Sigma
    kind: symbol
    title: "Giải mã: ma trận hiệp phương sai Σ"
    checks:
      - "(lambda d: d*d.T)(Matrix([2, 2])) == Matrix([[4, 4], [4, 4]]) and (lambda d: d*d.T)(Matrix([1, -1])) == Matrix([[1, -1], [-1, 1]])"
      - "(lambda ds: sum((d*d.T for d in ds), sp.zeros(2, 2)) / 4)([Matrix([2, 2]), Matrix([-2, -2]), Matrix([1, -1]), Matrix([-1, 1])]) == Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]])"
    steps:
      - show: |
          <div class="box key">$$\mathbf{\Sigma} = \begin{bmatrix} \operatorname{Var}(X) & \operatorname{Cov}(X, Y) \\ \operatorname{Cov}(Y, X) & \operatorname{Var}(Y) \end{bmatrix} = \begin{bmatrix} 2{,}5 & 1{,}5 \\ 1{,}5 & 2{,}5 \end{bmatrix}$$</div>
          <p>Đường chéo: phương sai từng biến. Ngoài đường chéo: hiệp phương sai. $\operatorname{Cov}(X, Y) = \operatorname{Cov}(Y, X)$, nên $\mathbf{\Sigma}$ <b>đối xứng</b>: $\mathbf{\Sigma}^T = \mathbf{\Sigma}$.</p>
        introduces: [Sigma_mat]
        focus: [1, 2, 2]
        say: "Gom tất cả vào một ma trận, gọi là ma trận hiệp phương sai, ký hiệu xích ma hoa in đậm. Đường chéo chứa phương sai từng biến, ngoài đường chéo là hiệp phương sai. Vì đổi chỗ X và Y không làm đổi tích, ma trận này đối xứng."
      - show: |
          <p>Cách viết gọn: $\ \mathbf{\Sigma} = \mathbb{E}\big[(\mathbf{x} - \boldsymbol{\mu})(\mathbf{x} - \boldsymbol{\mu})^T\big]$ — cột nhân hàng ra một ma trận. Với An, $\mathbf{x} - \boldsymbol{\mu} = \begin{bmatrix} 2 \\ 2 \end{bmatrix}$:</p>
          <p>$\begin{bmatrix} 2 \\ 2 \end{bmatrix}\begin{bmatrix} 2 & 2 \end{bmatrix} = \begin{bmatrix} 4 & 4 \\ 4 & 4 \end{bmatrix}$ &nbsp; → &nbsp; lấy trung bình 4 ma trận như vậy (4 bạn) được đúng $\mathbf{\Sigma}$ ở trên.</p>
        focus: ["1.1", ["1.2", "2.1"], 2]
        say: "Cách viết gọn của ma trận này là một vector cột nhân với chính nó chuyển vị, theo phép nhân ma trận của bài 2. Với An, vector lệch là 2 và 2, tích là ma trận toàn số 4. Lấy trung bình 4 ma trận như vậy, ta được đúng ma trận ở trên."
      - show: |
          <p class="note">Hai chữ Sigma hoa khác nghĩa: &nbsp; $\mathbf{\Sigma}$ in đậm = ma trận hiệp phương sai; &nbsp; $\sum$ = dấu tổng (bài 1), ví dụ với $N$ điểm dữ liệu:</p>
          <p class="note">$\mathbf{\Sigma} = \frac{1}{N}\sum_{i} (\mathbf{x}_i - \boldsymbol{\mu})(\mathbf{x}_i - \boldsymbol{\mu})^T$. Có sách chia $N - 1$ thay cho $N$: khi $\boldsymbol{\mu}$ cũng tính từ chính dữ liệu, chia $N$ cho kết quả trung bình hơi nhỏ hơn thật, chia $N - 1$ sửa điều đó. $N$ lớn thì hai cách gần như nhau.</p>
        notation_note: true
        focus: [0, 1, 2, 2, 2]
        say: "Cẩn thận, cùng một chữ xích ma hoa. Bản in đậm là ma trận hiệp phương sai, còn dấu tổng của bài 1 có hình dáng khác hẳn. Công thức tính từ dữ liệu dùng cả hai. Có sách chia cho N trừ 1 thay vì N, để bù việc trung bình cũng được tính từ chính dữ liệu đó. Khi N lớn, hai cách gần như nhau."

  # ───────────────────────── 5. MẬT ĐỘ NHIỀU CHIỀU ─────────────────────────
  - id: density
    kind: formula
    title: "Mật độ chuẩn nhiều chiều"
    checks:
      - "Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).det() == 4 and Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).inv() == Matrix([[Rational(5, 8), -Rational(3, 8)], [-Rational(3, 8), Rational(5, 8)]])"
      - "abs(1/(2*math.pi*math.sqrt(4)) - 0.0796) < 0.0001"
      - "(lambda s: Matrix([[s**2]]).inv()[0] == 1/s**2)(sp.Symbol('s', positive=True))"
    steps:
      - show: |
          <div class="box key">$$f(\mathbf{x}) = \dfrac{1}{(2\pi)^{D/2}\cdot\sqrt{\det(\mathbf{\Sigma})}}\cdot e^{-\frac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^T\mathbf{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu})}$$ ($D$ = số chiều)</div>
          <p>Số mũ (viết to cho dễ đọc): $\ -\dfrac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^T\mathbf{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu})$</p>
          <p>So với một chiều: $\ \left(\frac{x - \mu}{\sigma}\right)^2 = (x - \mu)\cdot\frac{1}{\sigma^2}\cdot(x - \mu)$ &nbsp; → &nbsp; chia cho $\sigma^2$ thành nhân với $\mathbf{\Sigma}^{-1}$.</p>
        focus: [1, 3, "3.3"]
        say: "Đây là mật độ chuẩn nhiều chiều, với D là số chiều. Nó mở rộng đúng công thức một chiều, vì z bình phương chính là độ lệch nhân một chia xích ma bình phương nhân độ lệch. Thay phép chia cho phương sai bằng phép nhân với ma trận nghịch đảo của xích ma hoa."
      - clear: true
        show: |
          <p>Hằng số phía trước làm tổng “thể tích” dưới mặt cong bằng 1. Với $D = 1$, $\mathbf{\Sigma} = [\sigma^2]$: công thức trở về đúng bài 14.</p>
          <p><b>Làm thử ngay</b> với lớp học: $\det(\mathbf{\Sigma}) = 2{,}5\cdot 2{,}5 - 1{,}5\cdot 1{,}5 = 4$; &nbsp; $\mathbf{\Sigma}^{-1} = \frac{1}{4}\begin{bmatrix} 2{,}5 & -1{,}5 \\ -1{,}5 & 2{,}5 \end{bmatrix}$ (bài 2)</p>
          <p>Đỉnh tại $\boldsymbol{\mu}$: $\ f = \frac{1}{2\pi\cdot 2} \approx 0{,}0796$</p>
        focus: [1, 2]
        say: "Hằng số phía trước làm tổng thể tích dưới mặt cong bằng 1, và khi chỉ có một chiều, công thức trở về đúng bài 14. Làm thử ngay, theo bài 2, định thức bằng a d trừ b c, tức 4, và ma trận nghịch đảo là một phần tư nhân ma trận đổi chỗ, đổi dấu."
      - show: |
          <p class="note">Sách hay viết định thức là $|\mathbf{\Sigma}|$ (hai vạch đứng) và viết $\exp(\text{số mũ})$: đó là $\det(\mathbf{\Sigma})$ và $e^{\text{số mũ}}$ trong bài này.</p>
        notation_note: true
        say: "Sách hay viết định thức bằng hai vạch đứng bao quanh xích ma hoa, và viết hàm mũ bằng ba chữ cái. Đó vẫn là định thức và e mũ, nghĩa là cùng một thứ như trong bài này."

  # ───────────────────────── 6. KHOẢNG CÁCH THEO ĐỘ TRẢI ─────────────────────────
  - id: mahal
    kind: example
    title: "Ví dụ: An và Bình bình thường như nhau"
    checks:
      - "(lambda Si: [(Matrix(d).T*Si*Matrix(d))[0] for d in ([2, 2], [1, -1], [-2, -2], [-1, 1])] == [2, 2, 2, 2])(Matrix([[Rational(5, 8), -Rational(3, 8)], [-Rational(3, 8), Rational(5, 8)]]))"
      - "round(math.sqrt(8), 2) == 2.83 and round(math.sqrt(2), 2) == 1.41"
      - "abs(math.exp(-1)/(4*math.pi) - 0.0293) < 0.0001"
      - "(lambda Si: Si*Matrix([2, 2]) == Matrix([Rational(1, 2), Rational(1, 2)]) and Matrix([[2, 2]])*Si*Matrix([2, 2]) == Matrix([2]) and Rational(5, 2)*2 - Rational(3, 2)*2 == 2)(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).inv())"
      - "(lambda Si: Si*Matrix([1, -1]) == Matrix([1, -1]) and Matrix([[1, -1]])*Si*Matrix([1, -1]) == Matrix([2]) and Rational(5, 2) + Rational(3, 2) == 4)(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).inv())"
    steps:
      - show: |
          <p>Phần trong số mũ, $(\mathbf{x} - \boldsymbol{\mu})^T\mathbf{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu})$, là <b>bình phương khoảng cách theo độ trải</b> (Mahalanobis):</p>
          <p>An: $\begin{bmatrix} 2 & 2 \end{bmatrix}\mathbf{\Sigma}^{-1}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \hlg{2}$ &nbsp;&nbsp; Bình: $\begin{bmatrix} 1 & -1 \end{bmatrix}\mathbf{\Sigma}^{-1}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = \hlg{2}$</p>
          <p class="note">Bằng nhau! Hai bạn có cùng mật độ $f = 0{,}0796\cdot e^{-1} \approx 0{,}0293$ — bình thường như nhau.</p>
        focus: [1, 2, 3]
        say: "Phần nằm trong số mũ là bình phương của khoảng cách theo độ trải. Thay số, với An được 2, với Bình cũng được 2. Hai bạn có cùng mật độ, nghĩa là bình thường như nhau, dù khoảng cách thẳng của An gấp đôi."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \mathbf{\Sigma}^{-1} = \frac{1}{4}\begin{bmatrix} 2{,}5 & -1{,}5 \\ -1{,}5 & 2{,}5 \end{bmatrix}$. &nbsp; <b>Bước 1 — An</b>, độ lệch $(2; 2)$:</p>
          $$\mathbf{\Sigma}^{-1}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 2{,}5\cdot 2 - 1{,}5\cdot 2 \\ -1{,}5\cdot 2 + 2{,}5\cdot 2 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \begin{bmatrix} 0{,}5 \\ 0{,}5 \end{bmatrix}$$
          $$\begin{bmatrix} 2 & 2 \end{bmatrix}\begin{bmatrix} 0{,}5 \\ 0{,}5 \end{bmatrix} = 2\cdot 0{,}5 + 2\cdot 0{,}5 = \hlg{2}$$
        focus: [1, 2, 3]
        say: "Bây giờ tính từng bước, bắt đầu với An, có độ lệch 2 và 2. Nhân ma trận nghịch đảo với vector lệch theo quy tắc hàng nhân cột, mỗi hàng cho 2, chia 4 được 0 phẩy 5 và 0 phẩy 5. Cuối cùng nhân hàng 2, 2 với cột vừa được, ta có 1 cộng 1, bằng 2."
      - show: |
          <p><b>Bước 2 — Bình</b>, độ lệch $(1; -1)$:</p>
          $$\mathbf{\Sigma}^{-1}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 2{,}5 + 1{,}5 \\ -1{,}5 - 2{,}5 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 4 \\ -4 \end{bmatrix} = \begin{bmatrix} 1 \\ -1 \end{bmatrix}$$
          $$\begin{bmatrix} 1 & -1 \end{bmatrix}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = 1\cdot 1 + (-1)\cdot(-1) = \hlg{2}$$
        focus: [1, 2, 3]
        say: "Bước hai làm cho Bình, có độ lệch 1 và âm 1. Hàng đầu cho 2 phẩy 5 cộng 1 phẩy 5, bằng 4, hàng sau cho âm 4, chia 4 được 1 và âm 1. Nhân hàng 1, âm 1 với cột đó được 1 cộng 1, cũng bằng 2, nên hai bạn bình thường như nhau."
      - clear: true
        show: |
          <div class="row"><div class="col"><svg width="528" height="480" viewBox="0 0 440 400">
            <line x1="40" y1="380" x2="420" y2="380" stroke="#9ca3af" stroke-width="2"/>
            <line x1="60" y1="20" x2="60" y2="390" stroke="#9ca3af" stroke-width="2"/>
            <circle cx="220" cy="220" r="113" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="8 8"/>
            <ellipse cx="220" cy="220" rx="113" ry="57" transform="rotate(-45 220 220)" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="4"/>
            <circle cx="220" cy="220" r="7" fill="#dc2626"/>
            <circle cx="300" cy="140" r="9" fill="#2563eb"/><circle cx="140" cy="300" r="9" fill="#2563eb"/>
            <circle cx="260" cy="260" r="9" fill="#d97706"/><circle cx="180" cy="180" r="9" fill="#d97706"/>
            <text x="310" y="132" font-size="24" fill="#2563eb">An</text>
            <text x="272" y="284" font-size="24" fill="#d97706">Bình</text>
            <text x="228" y="214" font-size="22" fill="#dc2626">(6; 6)</text>
            <text x="380" y="372" font-size="22">Toán</text><text x="68" y="40" font-size="22">Lý</text>
