  - clear: true
    show: '<div class="box key"><b>Nếu kẹt:</b> độ lệch = giá trị trừ trung bình. $\operatorname{Var}$ = trung bình của độ lệch bình phương; $\operatorname{Cov}$ = trung bình của tích độ lệch $x$ nhân độ lệch $y$. Nghịch đảo hai nhân hai: đổi chỗ hai số trên đường chéo, đổi dấu hai số kia, chia định thức. Khoảng cách theo độ trải bình phương $= \mathbf{d}^T \Sigma^{-1} \mathbf{d}$.</div>

      '
