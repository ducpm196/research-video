scenes:
- id: hook
  kind: hook
  title: 'Hai học sinh: ai “lạ” hơn?'
  steps:
  - show: '<p class="big">Lớp có trung bình điểm Toán 6, điểm Lý 6. &nbsp; Bạn An: (8; 8). &nbsp; Bạn Bình: (7; 5).</p>

      <p>Đo khoảng cách thẳng tới (6; 6): &nbsp; An cách 2,83, &nbsp; Bình cách 1,41. &nbsp; → An “lạ” hơn?</p>

      <div class="box key">Nhưng trong lớp này, ai giỏi Toán thường giỏi Lý. Điểm (8; 8) đi <b>đúng</b> xu hướng; (7; 5) đi <b>ngược</b> xu hướng — khoảng cách thẳng chưa nói hết.</div>

      '
    focus:
    - 0
    - 1
    - 1
    - 2
    say: Chào bạn, một câu hỏi. Lớp có trung bình điểm Toán 6 và điểm Lý 6. Bạn An được 8 và 8, bạn Bình được 7 và 5. Đo khoảng cách thẳng tới điểm trung bình, An cách 2 phẩy 83, Bình chỉ cách 1 phẩy 41, vậy An lạ hơn?
  - show: '<p class="note">Hôm nay: hiệp phương sai (hai biến đi cùng nhau thế nào) → ma trận hiệp phương sai → phân phối chuẩn nhiều chiều.</p>

      '
    say: Nhưng trong lớp này, ai giỏi Toán thường giỏi Lý, nên 8 và 8 đi đúng xu hướng, còn 7 và 5 đi ngược xu hướng, vì thế khoảng cách thẳng chưa nói hết. Hôm nay ta học cách đo điều đó, bằng hiệp phương sai và phân phối chuẩn nhiều chiều.
- id: prereq
  kind: prereq
  title: 'Ôn nền: phân phối chuẩn một chiều của bài 14'
  steps:
  - show: '<p>Bài 14: $\mathcal{N}(\mu, \sigma^2)$ có mật độ $\ f(x) = \dfrac{1}{\sqrt{2\pi\sigma^2}}\cdot e^{-\frac{1}{2}\left(\frac{x - \mu}{\sigma}\right)^2}$</p>

      <p class="note">Số mũ chứa $z^2$ với $z = \frac{x - \mu}{\sigma}$: khoảng cách tới tâm, <b>đo bằng số lần</b> $\sigma$. Bài 13: $\sigma^2 = \operatorname{Var}(X) = \mathbb{E}\big[(X - \mu)^2\big]$.</p>

      '
    focus:
    - - 1
      - 2
    - 2
    say: Nhắc lại bài 14, mật độ chuẩn một chiều có số mũ là âm một nửa nhân z bình phương, với z là khoảng cách tới tâm, đo bằng số lần xích ma. Và theo bài 13, phương sai là trung bình bình phương khoảng cách tới kỳ vọng.
- id: sym_cov
  kind: symbol
  title: 'Giải mã: Cov(X, Y) — hai biến đi cùng nhau thế nào'
  checks:
  - '(lambda X, Y: (sum(X)/4, sum(Y)/4))([8, 4, 7, 5], [8, 4, 5, 7]) == (6, 6)'
  - '(lambda X, Y: sum((x - 6)*(y - 6) for x, y in zip(X, Y)) / 4)([8, 4, 7, 5], [8, 4, 5, 7]) == 1.5'
  - '(lambda X: sum((x - 6)**2 for x in X) / 4)([8, 4, 7, 5]) == 2.5 and 1.5 / math.sqrt(2.5*2.5) == 0.6'
  steps:
  - show: '<div class="box key">$\operatorname{Cov}(X, Y) = \mathbb{E}\big[(X - \mu_X)\cdot(Y - \mu_Y)\big]$ &nbsp; đọc là “hiệp phương sai của X và Y”</div>

      <table class="t"><tr><th>bạn</th><th>Toán $x$</th><th>Lý $y$</th><th>$x - 6$</th><th>$y - 6$</th><th>tích</th></tr>

      <tr><td>An</td><td>8</td><td>8</td><td>2</td><td>2</td><td>4</td></tr>

      <tr><td>Cường</td><td>4</td><td>4</td><td>−2</td><td>−2</td><td>4</td></tr>

      <tr><td>Bình</td><td>7</td><td>5</td><td>1</td><td>−1</td><td>−1</td></tr>

      <tr><td>Dũng</td><td>5</td><td>7</td><td>−1</td><td>1</td><td>−1</td></tr></table>

      <p>$\operatorname{Cov} = \frac{4 + 4 - 1 - 1}{4} = \hlg{1{,}5}$ &nbsp; (dương: hai điểm thường cùng cao, cùng thấp)</p>

      '
    introduces:
    - cov
    focus:
    - 1
    - 2
    - 3
    say: Ký hiệu mới, hiệp phương sai của X và Y, là kỳ vọng của tích hai độ lệch. Với lớp 4 bạn, trung bình mỗi môn đều là 6. Nhân độ lệch Toán với độ lệch Lý của từng bạn, rồi lấy trung bình, được 1 phẩy 5, một số dương.
  - clear: true
    show: '<p>Dấu của $\operatorname{Cov}$: &nbsp; <b>dương</b> — cùng tăng; &nbsp; <b>âm</b> — cái này tăng thì cái kia giảm; &nbsp; gần <b>0</b> — không có xu hướng thẳng.</p>

      <div class="box key">Hệ số tương quan $\ \rho = \dfrac{\operatorname{Cov}(X, Y)}{\sigma_X\cdot\sigma_Y}$ (đọc “rô”), luôn nằm giữa $-1$ và $1$. &nbsp; Ở đây $\ \rho = \frac{1{,}5}{\sqrt{2{,}5}\cdot\sqrt{2{,}5}} = \hlg{0{,}6}$</div>

      '
    introduces:
    - rho
    focus:
    - 1
    - 2
    - '2.4'
    say: Hiệp phương sai dương nghĩa là hai biến thường cùng tăng, âm nghĩa là cái này tăng thì cái kia giảm. Chia cho tích hai độ lệch chuẩn được hệ số tương quan, đọc là rô, luôn nằm giữa âm 1 và 1. Ở đây phương sai mỗi môn là 2 phẩy 5, nên rô bằng 0 phẩy 6.
- id: sym_Sigma
  kind: symbol
  title: 'Giải mã: ma trận hiệp phương sai Σ'
  checks:
  - '(lambda d: d*d.T)(Matrix([2, 2])) == Matrix([[4, 4], [4, 4]]) and (lambda d: d*d.T)(Matrix([1, -1])) == Matrix([[1, -1], [-1, 1]])'
  - '(lambda ds: sum((d*d.T for d in ds), sp.zeros(2, 2)) / 4)([Matrix([2, 2]), Matrix([-2, -2]), Matrix([1, -1]), Matrix([-1, 1])]) == Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]])'
  steps:
  - show: '<div class="box key">$$\mathbf{\Sigma} = \begin{bmatrix} \operatorname{Var}(X) & \operatorname{Cov}(X, Y) \\ \operatorname{Cov}(Y, X) & \operatorname{Var}(Y) \end{bmatrix} = \begin{bmatrix} 2{,}5 & 1{,}5 \\ 1{,}5 & 2{,}5 \end{bmatrix}$$</div>

      <p>Đường chéo: phương sai từng biến. Ngoài đường chéo: hiệp phương sai. $\operatorname{Cov}(X, Y) = \operatorname{Cov}(Y, X)$, nên $\mathbf{\Sigma}$ <b>đối xứng</b>: $\mathbf{\Sigma}^T = \mathbf{\Sigma}$ (chữ $T$ trên đầu: chuyển vị, đổi hàng thành cột).</p>

      '
    introduces:
    - Sigma_mat
    focus:
    - 1
    - 2
    - 2
    say: Gom tất cả vào một ma trận, gọi là ma trận hiệp phương sai, ký hiệu xích ma hoa in đậm. Đường chéo chứa phương sai từng biến, ngoài đường chéo là hiệp phương sai. Vì đổi chỗ X và Y không làm đổi tích, ma trận này đối xứng, nghĩa là chuyển vị của nó, tức đổi hàng thành cột, vẫn là chính nó.
  - clear: true
    show: '<p>Cách viết gọn (chữ in đậm $\mathbf{x}$, $\boldsymbol{\mu}$ là vector): $\ \mathbf{\Sigma} = \mathbb{E}\big[(\mathbf{x} - \boldsymbol{\mu})(\mathbf{x} - \boldsymbol{\mu})^T\big]$ — cột nhân hàng ra một ma trận. Với An, $\mathbf{x} - \boldsymbol{\mu} = \begin{bmatrix} 2 \\ 2 \end{bmatrix}$:</p>

      <p>$\begin{bmatrix} 2 \\ 2 \end{bmatrix}\begin{bmatrix} 2 & 2 \end{bmatrix} = \begin{bmatrix} 4 & 4 \\ 4 & 4 \end{bmatrix}$ &nbsp; → &nbsp; lấy trung bình 4 ma trận như vậy (4 bạn) được đúng $\mathbf{\Sigma}$ ở trên.</p>

      '
    focus:
    - '1.1'
    - - '1.2'
      - '2.1'
    - 2
    say: 'Cách viết gọn dùng chữ in đậm cho vector: ma trận này là một vector cột nhân với chính nó chuyển vị, theo phép nhân ma trận của bài 2. Với An, vector lệch là 2 và 2, tích là ma trận toàn số 4. Lấy trung bình 4 ma trận như vậy, ta được đúng ma trận ở trên.'
  - clear: true
    show: '<p class="note">Hai chữ Sigma hoa khác nghĩa: &nbsp; $\mathbf{\Sigma}$ in đậm = ma trận hiệp phương sai; &nbsp; $\sum$ = dấu tổng (bài 1), ví dụ với $N$ điểm dữ liệu:</p>

      <p class="note">$\mathbf{\Sigma} = \frac{1}{N}\sum_{i} (\mathbf{x}_i - \boldsymbol{\mu})(\mathbf{x}_i - \boldsymbol{\mu})^T$. Có sách chia $N - 1$ thay cho $N$: khi $\boldsymbol{\mu}$ cũng tính từ chính dữ liệu, chia $N$ cho kết quả trung bình hơi nhỏ hơn thật, chia $N - 1$ sửa điều đó. $N$ lớn thì hai cách gần như nhau.</p>

      '
    notation_note: true
    focus:
    - 0
    - 1
    - 2
    - 2
    - 2
    say: Cẩn thận, cùng một chữ xích ma hoa. Bản in đậm là ma trận hiệp phương sai, còn dấu tổng của bài 1 có hình dáng khác hẳn. Công thức tính từ dữ liệu dùng cả hai. Có sách chia cho N trừ 1 thay vì N, để bù việc trung bình cũng được tính từ chính dữ liệu đó. Khi N lớn, hai cách gần như nhau.
- id: density
  kind: formula
  title: Mật độ chuẩn nhiều chiều
  checks:
  - Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).det() == 4 and Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).inv() == Matrix([[Rational(5, 8), -Rational(3, 8)], [-Rational(3, 8), Rational(5, 8)]])
  - abs(1/(2*math.pi*math.sqrt(4)) - 0.0796) < 0.0001
  - '(lambda s: Matrix([[s**2]]).inv()[0] == 1/s**2)(sp.Symbol(''s'', positive=True))'
  steps:
  - show: '<div class="box key">$$f(\mathbf{x}) = \dfrac{1}{(2\pi)^{D/2}\cdot\sqrt{\det(\mathbf{\Sigma})}}\cdot e^{-\frac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^T\mathbf{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu})}$$ ($D$ = số chiều)</div>

      <p>Số mũ (viết to cho dễ đọc): $\ -\dfrac{1}{2}(\mathbf{x} - \boldsymbol{\mu})^T\mathbf{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu})$</p>

      <p>So với một chiều: $\ \left(\frac{x - \mu}{\sigma}\right)^2 = (x - \mu)\cdot\frac{1}{\sigma^2}\cdot(x - \mu)$ &nbsp; → &nbsp; chia cho $\sigma^2$ thành nhân với $\mathbf{\Sigma}^{-1}$.</p>

      '
    focus:
    - 1
    - 3
    - '3.3'
    say: Đây là mật độ chuẩn nhiều chiều, với D là số chiều. Nó mở rộng đúng công thức một chiều, vì z bình phương chính là độ lệch nhân một chia xích ma bình phương nhân độ lệch. Thay phép chia cho phương sai bằng phép nhân với ma trận nghịch đảo của xích ma hoa.
  - clear: true
    show: '<p>Hằng số phía trước làm tổng “thể tích” dưới mặt cong bằng 1. Với $D = 1$, $\mathbf{\Sigma} = [\sigma^2]$: công thức trở về đúng bài 14.</p>

      <p><b>Làm thử ngay</b> với lớp học: $\det(\mathbf{\Sigma}) = 2{,}5\cdot 2{,}5 - 1{,}5\cdot 1{,}5 = 4$; &nbsp; $\mathbf{\Sigma}^{-1} = \frac{1}{4}\begin{bmatrix} 2{,}5 & -1{,}5 \\ -1{,}5 & 2{,}5 \end{bmatrix}$ (bài 2)</p>

      <p>Đỉnh tại $\boldsymbol{\mu}$: $\ f = \frac{1}{2\pi\cdot 2} \approx 0{,}0796$</p>

      '
    focus:
    - 1
    - 2
    say: Hằng số phía trước làm tổng thể tích dưới mặt cong bằng 1, và khi chỉ có một chiều, công thức trở về đúng bài 14. Làm thử ngay, theo bài 2, định thức bằng a d trừ b c, tức 4, và ma trận nghịch đảo là một phần tư nhân ma trận đổi chỗ, đổi dấu.
  - show: '<p class="note">Sách hay viết định thức là $|\mathbf{\Sigma}|$ (hai vạch đứng) và viết $\exp(\text{số mũ})$: đó là $\det(\mathbf{\Sigma})$ và $e^{\text{số mũ}}$ trong bài này.</p>

      '
    notation_note: true
    say: Sách hay viết định thức bằng hai vạch đứng bao quanh xích ma hoa, và viết hàm mũ bằng ba chữ cái. Đó vẫn là định thức và e mũ, nghĩa là cùng một thứ như trong bài này.
- id: mahal
  kind: example
  title: 'Ví dụ: An và Bình bình thường như nhau'
  checks:
  - '(lambda Si: [(Matrix(d).T*Si*Matrix(d))[0] for d in ([2, 2], [1, -1], [-2, -2], [-1, 1])] == [2, 2, 2, 2])(Matrix([[Rational(5, 8), -Rational(3, 8)], [-Rational(3, 8), Rational(5, 8)]]))'
  - round(math.sqrt(8), 2) == 2.83 and round(math.sqrt(2), 2) == 1.41
  - abs(math.exp(-1)/(4*math.pi) - 0.0293) < 0.0001
  - '(lambda Si: Si*Matrix([2, 2]) == Matrix([Rational(1, 2), Rational(1, 2)]) and Matrix([[2, 2]])*Si*Matrix([2, 2]) == Matrix([2]) and Rational(5, 2)*2 - Rational(3, 2)*2 == 2)(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).inv())'
  - '(lambda Si: Si*Matrix([1, -1]) == Matrix([1, -1]) and Matrix([[1, -1]])*Si*Matrix([1, -1]) == Matrix([2]) and Rational(5, 2) + Rational(3, 2) == 4)(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).inv())'
  steps:
  - show: '<p>Phần trong số mũ, $(\mathbf{x} - \boldsymbol{\mu})^T\mathbf{\Sigma}^{-1}(\mathbf{x} - \boldsymbol{\mu})$, là <b>bình phương khoảng cách theo độ trải</b> (Mahalanobis):</p>

      <p>An: $\begin{bmatrix} 2 & 2 \end{bmatrix}\mathbf{\Sigma}^{-1}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \hlg{2}$ &nbsp;&nbsp; Bình: $\begin{bmatrix} 1 & -1 \end{bmatrix}\mathbf{\Sigma}^{-1}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = \hlg{2}$</p>

      <p class="note">Bằng nhau! Hai bạn có cùng mật độ $f = 0{,}0796\cdot e^{-1} \approx 0{,}0293$ — bình thường như nhau.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Phần nằm trong số mũ là bình phương của khoảng cách theo độ trải. Thay số, với An được 2, với Bình cũng được 2. Hai bạn có cùng mật độ, nghĩa là bình thường như nhau, dù khoảng cách thẳng của An gấp đôi.
  - clear: true
    show: '<p class="note">Đang có: $\ \mathbf{\Sigma}^{-1} = \frac{1}{4}\begin{bmatrix} 2{,}5 & -1{,}5 \\ -1{,}5 & 2{,}5 \end{bmatrix}$. &nbsp; <b>Bước 1 — An</b>, độ lệch $(2; 2)$:</p>

      $$\mathbf{\Sigma}^{-1}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 2{,}5\cdot 2 - 1{,}5\cdot 2 \\ -1{,}5\cdot 2 + 2{,}5\cdot 2 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 2 \\ 2 \end{bmatrix} = \begin{bmatrix} 0{,}5 \\ 0{,}5 \end{bmatrix}$$

      $$\begin{bmatrix} 2 & 2 \end{bmatrix}\begin{bmatrix} 0{,}5 \\ 0{,}5 \end{bmatrix} = 2\cdot 0{,}5 + 2\cdot 0{,}5 = \hlg{2}$$

      '
    focus:
    - 1
    - 2
    - 3
    say: Bây giờ tính từng bước, bắt đầu với An, có độ lệch 2 và 2. Nhân ma trận nghịch đảo với vector lệch theo quy tắc hàng nhân cột, mỗi hàng cho 2, chia 4 được 0 phẩy 5 và 0 phẩy 5. Cuối cùng nhân hàng 2, 2 với cột vừa được, ta có 1 cộng 1, bằng 2.
  - show: '<p><b>Bước 2 — Bình</b>, độ lệch $(1; -1)$:</p>

      $$\mathbf{\Sigma}^{-1}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 2{,}5 + 1{,}5 \\ -1{,}5 - 2{,}5 \end{bmatrix} = \frac{1}{4}\begin{bmatrix} 4 \\ -4 \end{bmatrix} = \begin{bmatrix} 1 \\ -1 \end{bmatrix}$$

      $$\begin{bmatrix} 1 & -1 \end{bmatrix}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = 1\cdot 1 + (-1)\cdot(-1) = \hlg{2}$$

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước hai làm cho Bình, có độ lệch 1 và âm 1. Hàng đầu cho 2 phẩy 5 cộng 1 phẩy 5, bằng 4, hàng sau cho âm 4, chia 4 được 1 và âm 1. Nhân hàng 1, âm 1 với cột đó được 1 cộng 1, cũng bằng 2, nên hai bạn bình thường như nhau.
  - clear: true
    show: "<div class=\"row\"><div class=\"col\"><svg width=\"528\" height=\"480\" viewBox=\"0 0 440 400\">\n  <line x1=\"40\" y1=\"380\" x2=\"420\" y2=\"380\" stroke=\"#9ca3af\" stroke-width=\"2\"/>\n  <line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"390\" stroke=\"#9ca3af\" stroke-width=\"2\"/>\n  <circle cx=\"220\" cy=\"220\" r=\"113\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/>\n  <ellipse cx=\"220\" cy=\"220\" rx=\"113\" ry=\"57\" transform=\"rotate(-45 220 220)\" fill=\"#059669\" fill-opacity=\"0.15\" stroke=\"#059669\" stroke-width=\"4\"/>\n  <circle cx=\"220\" cy=\"220\" r=\"7\" fill=\"#dc2626\"/>\n  <circle cx=\"300\" cy=\"140\" r=\"9\" fill=\"#2563eb\"/><circle cx=\"140\" cy=\"300\" r=\"9\" fill=\"#2563eb\"/>\n  <circle cx=\"260\" cy=\"260\" r=\"9\" fill=\"#d97706\"/><circle cx=\"180\" cy=\"180\" r=\"9\" fill=\"#d97706\"/>\n  <text x=\"310\" y=\"132\" font-size=\"24\" fill=\"#2563eb\">An</text>\n  <text x=\"278\" y=\"294\" font-size=\"24\" fill=\"#d97706\">Bình</text>\n  <text x=\"228\" y=\"214\" font-size=\"22\" fill=\"#dc2626\">(6; 6)</text>\n  <text x=\"380\" y=\"372\" font-size=\"22\">Toán</text><text x=\"68\" y=\"40\" font-size=\"22\">Lý</text>\n</svg></div>\n<div class=\"col\"><p>Cả 4 bạn nằm trên <b>cùng một elip</b> (màu xanh lá): cùng khoảng cách theo độ trải.</p>\n<p>Đường tròn nét đứt (khoảng cách thẳng) bỏ qua xu hướng “giỏi Toán thì giỏi Lý”.</p></div></div>\n"
    say: Trên hình, cả 4 bạn nằm trên cùng một elip, tức một đường hình bầu dục màu xanh lá, nghĩa là cùng khoảng cách theo độ trải. Elip dài theo hướng chéo, vì hai môn thường cùng cao, cùng thấp. Đường tròn nét đứt của khoảng cách thẳng thì bỏ qua xu hướng đó.
- id: eigen
  kind: concept
  title: Trục của elip là vector riêng của Σ
  checks:
  - '(lambda S: S*Matrix([1, 1]) == 4*Matrix([1, 1]) and S*Matrix([1, -1]) == 1*Matrix([1, -1]))(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]))'
  - math.sqrt(4) == 2 and math.sqrt(1) == 1 and 4*1 == 4
  steps:
  - show: '<p>Bài 5: vector riêng là hướng mà ma trận chỉ <b>kéo giãn</b>, trị riêng $\lambda$ là hệ số kéo giãn.</p>

      <p>$$\mathbf{\Sigma}\begin{bmatrix} 1 \\ 1 \end{bmatrix} = \begin{bmatrix} 4 \\ 4 \end{bmatrix} = 4\cdot\begin{bmatrix} 1 \\ 1 \end{bmatrix} \qquad \mathbf{\Sigma}\begin{bmatrix} 1 \\ -1 \end{bmatrix} = \begin{bmatrix} 1 \\ -1 \end{bmatrix} = 1\cdot\begin{bmatrix} 1 \\ -1 \end{bmatrix}$$</p>

      <div class="box key">Trục dài của elip theo vector riêng $(1; 1)$, độ lệch chuẩn dọc trục là $\sqrt{\lambda} = \sqrt{4} = 2$; &nbsp; trục ngắn theo $(1; -1)$, độ lệch chuẩn $\sqrt{1} = 1$.</div>

      '
    focus:
    - 1
    - 2
    - - '3.1'
      - '3.2'
    say: Nhắc lại bài 5, vector riêng là hướng mà ma trận chỉ kéo giãn, còn trị riêng là hệ số kéo giãn. Xích ma hoa nhân vector 1, 1 được 4 lần chính nó, nhân vector 1, âm 1 được đúng nó. Vì vậy trục dài của elip theo hướng 1, 1, với độ lệch chuẩn bằng căn 4, bằng 2.
  - show: '<p class="note">Phương sai dọc mỗi trục (= độ trải của dữ liệu khi chỉ nhìn dọc hướng đó: thả mỗi điểm vuông góc xuống đường theo hướng ấy rồi tính phương sai các chân thả) chính là trị riêng: 4 và 1. Tích hai trị riêng $= 4 = \det(\mathbf{\Sigma})$.</p>

      '
    say: Phương sai dọc mỗi trục chính là trị riêng tương ứng, 4 và 1, và tích hai trị riêng bằng 4, đúng bằng định thức. Trục có trị riêng lớn nhất là hướng dữ liệu trải rộng nhất.
- id: spd
  kind: formula
  title: Vì sao Σ phải đối xứng và xác định dương
  checks:
  - Matrix([[1, 1], [1, 1]]).det() == 0 and sorted(Matrix([[1, 1], [1, 1]]).eigenvals().keys()) == [0, 2]
  - all(v > 0 for v in Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]).eigenvals().keys())
  - '(lambda a, b: sp.expand((Matrix([[a, b]])*Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]])*Matrix([a, b]))[0] - 2*(a + b)**2 - Rational(1, 2)*(a - b)**2) == 0)(*sp.symbols(''a b''))'
  steps:
  - show: '<p>Phương sai theo một hướng (= độ trải của dữ liệu khi chỉ nhìn dọc hướng đó, tính trên các chân thả vuông góc) luôn $\ge 0$, với bất kỳ hướng nào; công thức mật độ cần nó <b>dương</b>. Với $\mathbf{\Sigma}$ đối xứng, điều đó tương đương: mọi trị riêng $> 0$ — gọi là <b>xác định dương</b>.</p>

      <p class="note">Khi đó $\det(\mathbf{\Sigma})$ = tích các trị riêng $> 0$, nên có $\mathbf{\Sigma}^{-1}$ và có $\sqrt{\det(\mathbf{\Sigma})}$ — công thức mật độ dùng được.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Theo định nghĩa, phương sai theo bất kỳ hướng nào cũng không thể âm, và để công thức dùng được thì phải dương. Với ma trận đối xứng, điều đó nghĩa là mọi trị riêng dương, gọi là xác định dương. Khi đó định thức dương, nên có ma trận nghịch đảo.
  - show: '<p>Phản ví dụ: điểm Lý luôn <b>bằng đúng</b> điểm Toán ($\rho = 1$): $\ \mathbf{\Sigma} = \begin{bmatrix} 1 & 1 \\ 1 & 1 \end{bmatrix}$, &nbsp; </p>

      <p>$\det = 1 - 1 = 0$, &nbsp; trị riêng 2 và $\hlo{0}$</p>

      <p class="note">Dữ liệu nằm hẳn trên một đường thẳng: theo hướng $(1; -1)$ không có độ trải nào → không có $\mathbf{\Sigma}^{-1}$, công thức mật độ hỏng.</p>

      '
    focus:
    - - 1
      - 2
    - 3
    say: Phản ví dụ, nếu điểm Lý luôn bằng đúng điểm Toán, thay vào ta được định thức bằng 0 và một trị riêng bằng 0. Dữ liệu nằm hẳn trên một đường thẳng, theo hướng vuông góc không có độ trải, nên không có nghịch đảo và công thức hỏng.
- id: verify
  kind: check
  title: 'Phép thử: máy sinh 100 nghìn học sinh'
  checks:
  - '(lambda r: np.round(np.cov(r.T, bias=True), 2).tolist() == [[2.5, 1.51], [1.51, 2.52]] and np.round(r.mean(0), 2).tolist() == [6.0, 6.0])(np.random.default_rng(0).multivariate_normal([6, 6], [[2.5, 1.5], [1.5, 2.5]], 100000))'
  steps:
  - show: '<p>Máy sinh 100 000 cặp điểm theo $\mathcal{N}(\boldsymbol{\mu}, \mathbf{\Sigma})$ với $\boldsymbol{\mu} = (6; 6)$, rồi tính lại từ dữ liệu:</p>

      <table class="t"><tr><th></th><th>trung bình</th><th>ma trận hiệp phương sai</th></tr>

      <tr><td>mô phỏng</td><td>(6,00; 6,00)</td><td>$\begin{bmatrix} 2{,}50 & 1{,}51 \\ 1{,}51 & 2{,}52 \end{bmatrix}$</td></tr>

      <tr><td>đặt vào</td><td>(6; 6)</td><td>$\begin{bmatrix} 2{,}5 & 1{,}5 \\ 1{,}5 & 2{,}5 \end{bmatrix}\ \checkmark$</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    say: Phép thử, máy sinh 100 nghìn cặp điểm theo phân phối này, rồi tính lại trung bình và ma trận hiệp phương sai từ dữ liệu. Kết quả 2 phẩy 50, 1 phẩy 51 và 2 phẩy 52 khớp với ma trận đặt vào, vì dữ liệu càng nhiều thì ước lượng càng sát.
  - show: <p><b>Chạy thử Python — tính phương sai và hiệp phương sai hai biến mẫu:</b></p><div class="code"><div>x, y = [1,2,4,5], [2,1,5,4]</div><div>print(sum((a-3)*(b-3) for a,b in zip(x,y)) / 4)</div></div>
    say: Chạy Python tính trực tiếp hiệp phương sai dương khi hai biến có xu hướng tăng cùng nhau.
    clear: true
    focus: null
- id: in_ai
  kind: concept
  title: Ma trận hiệp phương sai trong học máy
  steps:
  - show: '<table class="t"><tr><th>bài</th><th>gặp lại $\mathbf{\Sigma}$ ở đâu</th></tr>

      <tr><td><b>Bài 16</b></td><td>tìm trục dài nhất của đám dữ liệu (vector riêng của $\mathbf{\Sigma}$) để nén dữ liệu. Ở đó có một ma trận khác cũng viết bằng chữ Sigma — khác nghĩa</td></tr>

      <tr><td><b>Bài 26</b></td><td>tìm hướng tách hai lớp, so với độ trải của từng lớp</td></tr>

      <tr><td><b>Bài 30</b></td><td>mô tả dữ liệu bằng nhiều elip chuẩn chồng lên nhau</td></tr></table>

      '
    forward_ref: true
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Ở bài 16, ta tìm trục dài nhất của đám dữ liệu để nén dữ liệu, và gặp một ma trận khác cũng viết bằng chữ xích ma nhưng khác nghĩa. Ở bài 26, ta tìm hướng tách hai lớp. Ở bài 30, ta mô tả dữ liệu bằng nhiều elip chồng lên nhau.
- id: quymo
  kind: example
  title: 'Khi số chiều tăng: ma trận Σ phình ra và đòi nhiều mẫu hơn'
  checks:
  - '[d*(d+1)//2 for d in (2, 10, 784, 10000)] == [3, 55, 307720, 50005000] and [d + 1 for d in (2, 10, 784, 10000)] == [3, 11, 785, 10001]'
  - '(lambda r: [np.linalg.matrix_rank(np.cov(r.standard_normal((n, 10)).T, bias=True)) for n in (5, 11)])(np.random.default_rng(3)) == [4, 10]'
  steps:
  - show: '<p>Dữ liệu $D$ chiều: $\Sigma$ là bảng $D \times D$ đối xứng, nên cần ước lượng $\dfrac{D(D+1)}{2}$ số (số minh hoạ).</p>

      <table class="t"><tr><th>số chiều $D$</th><th>số cần ước lượng</th><th>số mẫu tối thiểu $D + 1$</th></tr>

      <tr><td>2</td><td>3</td><td>3</td></tr>

      <tr><td>10</td><td>55</td><td>11</td></tr>

      <tr><td>784 (ảnh 28 nhân 28)</td><td>307 720</td><td>785</td></tr>

      <tr><td>10 000</td><td>50 005 000</td><td>10 001</td></tr></table>

      <div class="box key">Muốn $\Sigma$ ước lượng ra có nghịch đảo: cần ít nhất $D + 1$ mẫu.</div>

      '
    focus:
    - 1
    - - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
    - 3
    say: Ma trận hiệp phương sai của dữ liệu D chiều là bảng D nhân D đối xứng, nên có D nhân, mở ngoặc, D cộng 1, đóng ngoặc, chia 2 số cần ước lượng. Với 2 chiều là 3 số, với 10 chiều là 55 số. Với ảnh 784 chiều là hơn 307 nghìn số, với mười nghìn chiều là hơn 50 triệu số. Muốn ma trận ước lượng ra có nghịch đảo, cần ít nhất D cộng 1 mẫu.
  - clear: true
    show: '<p>Thử bằng máy với dữ liệu ngẫu nhiên 10 chiều:</p>

      <table class="t"><tr><th>số mẫu</th><th>hạng của $\Sigma$</th><th>nghịch đảo được?</th></tr>

      <tr><td>5</td><td>4</td><td>không (định thức 0)</td></tr>

      <tr><td>11</td><td>10</td><td>được</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Thử bằng máy với dữ liệu ngẫu nhiên 10 chiều. Với 5 mẫu, ma trận hiệp phương sai chỉ có hạng 4, tức chỉ 4 hàng khác 0 sau khi khử như ở bài 3, nên định thức bằng 0 và không có nghịch đảo. Với 11 mẫu, hạng là 10 và nghịch đảo được, vì vậy số mẫu phải nhiều hơn số chiều.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - '(lambda X: sum(x**3 for x in X)/3 - (sum(X)/3)*(sum(x**2 for x in X)/3))([-1, 0, 1]) == 0 and Rational(1, 3) != Rational(1, 3)*Rational(2, 3)'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> $\operatorname{Cov}(X, Y) = 0$ nên $X$, $Y$ độc lập <b class="red">(sai)</b>

      <br><span class="note">$X$ bằng $-1$, $0$, $1$ khả năng như nhau, $Y = X^2$: $\operatorname{Cov} = 0$ nhưng biết $X$ là biết hẳn $Y$. Hiệp phương sai chỉ đo xu hướng <b>đường thẳng</b>.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ rằng hiệp phương sai bằng 0 thì hai biến độc lập. Lấy X bằng âm 1, 0 hoặc 1, và Y bằng X bình phương. Hiệp phương sai bằng 0, nhưng biết X là biết hẳn Y. Hiệp phương sai chỉ đo xu hướng đường thẳng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng khoảng cách thẳng để tìm điểm bất thường khi các biến tương quan <b class="red">(dễ sai)</b>

      <br><span class="note">An cách xa hơn Bình theo đường thẳng, nhưng hai bạn bình thường như nhau theo độ trải.</span></div>

      '
    say: Lỗi thứ hai, dùng khoảng cách thẳng để tìm điểm bất thường khi các biến tương quan với nhau. Như ví dụ, An cách xa hơn theo đường thẳng, nhưng theo độ trải thì hai bạn bình thường như nhau.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nhầm $\mathbf{\Sigma}$ (ma trận hiệp phương sai) với $\sum$ (dấu tổng) <b class="red">(sai)</b>

      <br><span class="note">Xem chữ đứng ở đâu: $\mathbf{\Sigma}$ in đậm đứng như một ma trận ($\mathbf{\Sigma}^{-1}$, $\det(\mathbf{\Sigma})$); $\sum$ luôn có các số hạng cộng phía sau.</span></div>

      '
    say: Lỗi thứ ba, nhầm ma trận hiệp phương sai với dấu tổng, vì cùng chữ xích ma hoa. Hãy xem chữ đứng ở đâu. Ma trận thì có nghịch đảo và định thức, còn dấu tổng luôn có các số hạng cộng phía sau.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '(lambda X, Y: Rational(sum((x - 2)*(y - 4) for x, y in zip(X, Y)), 3))([1, 2, 3], [2, 4, 6]) == Rational(4, 3) and Rational(4, 3) / sp.sqrt(Rational(2, 3)*Rational(8, 3)) == 1'
  - 'Matrix([[4, 0], [0, 1]]).eigenvals() == {4: 1, 1: 1} and math.sqrt(4) == 2'
  - Matrix([[3, 1], [1, 3]]).det() == 8
  - '(lambda X, Y: (Rational(sum((x - 2)**2 for x in X), 3), Rational(sum((y - 4)**2 for y in Y), 3)))([1, 2, 3], [2, 4, 6]) == (Rational(2, 3), Rational(8, 3)) and sp.sqrt(Rational(2, 3)*Rational(8, 3)) == Rational(4, 3)'
  - Matrix([[4, 0], [0, 1]])*Matrix([1, 0]) == 4*Matrix([1, 0]) and Matrix([[4, 0], [0, 1]])*Matrix([0, 1]) == Matrix([0, 1])
  - Matrix([[3, 1], [1, 3]])*Matrix([1, 1]) == 4*Matrix([1, 1]) and Matrix([[3, 1], [1, 3]])*Matrix([1, -1]) == 2*Matrix([1, -1]) and 4*2 == Matrix([[3, 1], [1, 3]]).det()
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Ba điểm dữ liệu $(1; 2)$, $(2; 4)$, $(3; 6)$. Tính $\operatorname{Cov}(X, Y)$ và $\rho$.</td></tr>

      <tr><td>2</td><td>$\mathbf{\Sigma} = \begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}$. Elip dài theo hướng nào? Độ lệch chuẩn dọc trục dài?</td></tr>

      <tr><td>3</td><td>Tính $\det(\mathbf{\Sigma})$ với $\mathbf{\Sigma} = \begin{bmatrix} 3 & 1 \\ 1 & 3 \end{bmatrix}$.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    say: Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một tính hiệp phương sai và rô của ba điểm. Câu hai đọc hình dạng elip từ ma trận. Câu ba tính một định thức. Hãy dừng video và làm ra giấy.
    pause: 45
  - clear: true
    show: '<p><b>Câu 1.</b> Trung bình $(2; 4)$; lập bảng độ lệch như ví dụ 4 bạn:</p>

      <table class="t"><tr><th>$x$</th><th>$y$</th><th>$x - 2$</th><th>$y - 4$</th><th>tích</th></tr>

      <tr><td>1</td><td>2</td><td>−1</td><td>−2</td><td>2</td></tr><tr><td>2</td><td>4</td><td>0</td><td>0</td><td>0</td></tr><tr><td>3</td><td>6</td><td>1</td><td>2</td><td>2</td></tr></table>

      $$\operatorname{Cov} = \frac{2 + 0 + 2}{3} = \hlg{\frac{4}{3}}, \quad \sigma_X^2 = \frac{1 + 0 + 1}{3} = \frac{2}{3}, \quad \sigma_Y^2 = \frac{4 + 0 + 4}{3} = \frac{8}{3}, \quad \rho = \frac{4/3}{\sqrt{\frac{2}{3}\cdot\frac{8}{3}}} = \frac{4/3}{4/3} = \hlg{1}$$

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Đáp án câu một, trung bình của hai cột là 2 và 4. Lập bảng độ lệch như ví dụ 4 bạn, ba tích là 2, 0 và 2, nên hiệp phương sai bằng 4 chia 3. Phương sai của X là hai phần ba, của Y là tám phần ba, căn của tích hai số này là bốn phần ba. Vậy rô bằng 1, đúng vì ba điểm nằm trên đường thẳng y bằng 2 x.
  - clear: true
    show: '<p><b>Câu 2.</b> Thử hai hướng trục:</p>

      $$\begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 1 \\ 0 \end{bmatrix} = 4\cdot\begin{bmatrix} 1 \\ 0 \end{bmatrix}, \qquad \begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 0 \\ 1 \end{bmatrix} = 1\cdot\begin{bmatrix} 0 \\ 1 \end{bmatrix}$$

      <p>Trị riêng lớn là 4, theo trục <b>ngang</b> → trục dài; độ lệch chuẩn $\sqrt{4} = \hlg{2}$ (trục ngắn: $\sqrt{1} = 1$).</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Câu hai, thử hai hướng trục. Ma trận nhân vector 1, 0 được 4 lần chính nó, nhân vector 0, 1 được đúng nó, nên hai trị riêng là 4 và 1. Trị riêng lớn hơn ứng với trục ngang, nên elip dài theo trục ngang, với độ lệch chuẩn căn 4, bằng 2.
  - show: '<p><b>Câu 3.</b> $$\det\begin{bmatrix} 3 & 1 \\ 1 & 3 \end{bmatrix} = 3\cdot 3 - 1\cdot 1 = \hlg{8}$$</p>

      <p class="note">Kiểm bằng trị riêng: $\mathbf{\Sigma}(1; 1) = (4; 4)$ → 4; &nbsp; $\mathbf{\Sigma}(1; -1) = (2; -2)$ → 2; &nbsp; tích $4\cdot 2 = 8\ \checkmark$</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Câu ba, định thức bằng 3 nhân 3 trừ 1 nhân 1, tức 9 trừ 1, bằng 8. Kiểm bằng đường khác, ma trận nhân vector 1, 1 được 4 lần nó, nhân vector 1, âm 1 được 2 lần nó. Tích hai trị riêng là 4 nhân 2, bằng 8, khớp với định thức.
