    reason: "B41: “Bay-ét” → small/medium chép “bay ếc / bay S / bay x / bay ác” (phụ âm cuối t nghe thành ch/x) — cùng kiểu ở probe l13_probe.py (3/8); INFERRED ASR nghe nhầm âm cuối, cần người nghe; “suất” → “suốt”"
