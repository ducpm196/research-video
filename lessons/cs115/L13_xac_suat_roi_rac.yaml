      <table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr>

      <tr><td><code>0.2794</code></td><td>0,2794: số thập phân trong mã dùng dấu chấm</td><td><code>1.1</code> là 1,1</td></tr>

      <tr><td><code>10000</code></td><td>10 000: trong mã không có dấu cách giữa các nhóm chữ số</td><td><code>2000</code> là 2 000</td></tr>

      <tr><td><code>10000 * 2 // 100</code></td><td>nhân rồi <b>chia lấy phần nguyên</b> (bỏ phần lẻ)</td><td>người bệnh: 200</td></tr></table>

