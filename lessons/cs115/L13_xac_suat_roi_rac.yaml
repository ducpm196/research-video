    focus:
    - 1
    - - 1
      - '2.2'
    - - 1
      - '2.3'
    - - 1
      - '2.4'
    say: 'Phần tự làm là một chương trình trong một tệp: bạn mở cửa sổ dòng lệnh đi kèm Git và gõ lệnh chạy kèm tên tệp. Trong mã, số thập phân viết bằng dấu chấm, nên 0.2794 là 0 phẩy 2794. Số lớn viết liền, không cách nhóm chữ số: 10000 là mười nghìn. Hai dấu chia liền nhau là chia lấy phần nguyên, ví dụ 10000 nhân 2 chia 100 ra 200.'
  - clear: true
    show: '<p><b>Đề</b> (số minh hoạ). Viết <code>bayes.py</code>. Bệnh 2%, máy bắt đúng 95% người bệnh, báo nhầm 5% người khoẻ:</p>

      <table class="t"><tr><th>việc</th><th>cách làm</th></tr>

      <tr><td>đếm trên 10 000 người</td><td>số bệnh, báo đúng, báo nhầm</td></tr>

      <tr><td>xác suất thật khi dương tính</td><td>bằng đếm và bằng công thức Bayes; thêm tiên nghiệm 0,2%</td></tr>

      <tr><td>$X$ nhận 0, 1, 2 với xác suất 0,2; 0,5; 0,3</td><td>kỳ vọng, phương sai, độ lệch chuẩn</td></tr></table>

      <p class="note">Đề đầy đủ và quy tắc định dạng nằm trong tệp <code>labs/CS115/L13/de.md</code> — mở tệp đó ra đọc.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    say: Bây giờ tới phần bạn tự làm, với một bệnh và một chiếc máy mới trên màn hình. Đếm trên mười nghìn người rồi tính xác suất thật khi dương tính. Tính lại bằng công thức Bayes, rồi thử với tiên nghiệm hiếm hơn mười lần. Cuối cùng tính kỳ vọng, phương sai và độ lệch chuẩn của một biến ngẫu nhiên. Dừng video và tự làm.
    pause: 240
  - clear: true
    show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>dem 10000 nguoi: benh 200, bao dung 190, bao nham 490</div><div>xac suat that khi duong tinh (dem): 0.2794</div><div>xac suat that khi duong tinh (Bayes): 0.2794</div><div>tien nghiem 0.2%: 0.0367</div><div>ky vong: 1.1</div><div>phuong sai: 0.49</div><div>do lech chuan: 0.7</div></div><p class="note" style="color:#374151;font-size:0.8em">Chấm bằng Git Bash: <code>bash labs/cham.sh CS115 L13 bayes.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>CS115 L13 bayes.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi. <b>Kho</b> = thư mục chứa mã nguồn khoá học bạn được giao (có thư mục <code>labs</code>); chưa có kho thì chỉ chạy <code>python tệp.py</code> và so với kết quả mong đợi.</p>

      '
    focus:
    - 0
    - 0
    - 3
    - 3
    say: 'Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
  - clear: true
    show: '<div class="box key"><b>Nếu kẹt:</b> xác suất thật khi dương tính = báo đúng chia (báo đúng cộng báo nhầm). Bayes: tử số là $P(\text{dương} \mid \text{bệnh}) \cdot P(\text{bệnh})$, mẫu số là tử số cộng $P(\text{dương} \mid \text{khoẻ}) \cdot P(\text{khoẻ})$. Phương sai $= E[X^2] - (E[X])^2$.</div>

      '
    say: Nếu kẹt, xác suất thật khi dương tính bằng số báo đúng chia cho tổng báo đúng và báo nhầm. Công thức Bayes cho cùng con số. Phương sai bằng kỳ vọng của bình phương trừ bình phương của kỳ vọng.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">$P(A)$: đếm</span><span class="a">→</span>

      <span class="n">$P(A \mid B)$: thu hẹp về $B$</span><span class="a">→</span>

      <span class="n">Bayes: đảo chiều điều kiện</span><span class="a">→</span>

      <span class="n">$\mathbb{E}[X]$: trung bình dài hạn</span><span class="a">→</span>

      <span class="n">$\operatorname{Var}(X)$: độ trải</span></div>

      '
    say: Tổng kết chuỗi logic. Xác suất tính bằng cách đếm. Xác suất có điều kiện thu hẹp thế giới về B. Công thức trên màn hình giúp đảo chiều điều kiện. Kỳ vọng là trung bình dài hạn, còn phương sai đo độ trải quanh kỳ vọng.
  - show: '<div class="box key"><b>Tư duy:</b> trước khi tin một kết quả “dương tính”, hãy hỏi: <b>tiên nghiệm</b> là bao nhiêu? Bằng chứng mạnh vẫn có thể thua một tiên nghiệm rất nhỏ.</div>

      '
    say: Điều cần mang theo, trước khi tin một kết quả dương tính, hãy hỏi tiên nghiệm là bao nhiêu. Bằng chứng mạnh vẫn có thể thua một tiên nghiệm rất nhỏ.
  - clear: true
    show: '<p class="note">Bài sau (bài 14): <b>biến ngẫu nhiên liên tục, hàm mật độ</b> và phân phối chuẩn một chiều — khi $X$ nhận mọi giá trị trên một đoạn.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 14, ta học biến ngẫu nhiên liên tục và hàm mật độ, khi X có thể nhận mọi giá trị trên một đoạn, như chiều cao hay cân nặng. Hẹn gặp bạn ở bài tiếp theo.
