  - round(190/(190 + 490), 4) == 0.2794 and round(0.95*0.02/(0.95*0.02 + 0.05*0.98), 4) == 0.2794 and round(0.95*0.002/(0.95*0.002 + 0.05*0.998), 4) == 0.0367
