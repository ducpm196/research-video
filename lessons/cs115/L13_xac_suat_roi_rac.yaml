id: L13
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 13 — Xác suất rời rạc: có điều kiện, định lý Bayes, kỳ vọng, phương sai"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L296–L298 (P(A|B), kỳ vọng, phương sai), L313 (MAP dùng Bayes mà không phát biểu); PR25 (PMF, tính chất kỳ vọng/phương sai, phân phối phân loại)"
assumes: [cdot, neq, sub]
# Quy ước ký hiệu: P(A) cho xác suất; P(A \mid B) cho có điều kiện; A \cap B = “A và B cùng xảy ra”; biến cố bù viết bằng chữ
#   P(\text{không } A) (không dùng gạch trên hay chữ c mũ); kỳ vọng \mathbb{E}[X] (ngoặc vuông); phương sai \operatorname{Var}(X);
#   μ = E[X] (tài liệu dòng 298 dùng μ mà không nói μ là gì); xác suất của phân phối Bernoulli là p (như đồng xu bài 12).
# Lời đọc: “Bayes”, “Bernoulli” — cách đọc theo probe scratchpad l13_probe.py (B41, B42; xem REVIEW_L13.md §2).
#   Không đọc: categorical, prior, posterior — chỉ hiện trên màn hình; nói bằng tên Việt (phân phối phân loại, tiên nghiệm, hậu nghiệm).
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (dấu Σ = cộng tất cả các số hạng), bài 12 (đồng xu, p là xác suất ra ngửa).
# Sửa nguồn: tài liệu dòng 298 viết Var(X) = E[(X − μ)²] mà không định nghĩa μ → nói μ = E[X]; dòng 313 dùng định lý Bayes (MAP) mà
#   không phát biểu → bài này phát biểu và chứng minh từ quy tắc nhân.
objectives:
  - "Tính xác suất bằng cách đếm, dùng quy tắc phần bù"
  - "Đọc và tính xác suất có điều kiện; nhận biết hai biến cố độc lập"
  - "Phát biểu, chứng minh và dùng định lý Bayes (bài toán xét nghiệm)"
  - "Tính kỳ vọng, phương sai, độ lệch chuẩn của biến ngẫu nhiên rời rạc"
  - "Nhận ra phân phối Bernoulli và phân phối phân loại trong học máy"
