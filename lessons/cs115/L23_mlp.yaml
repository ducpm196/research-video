scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bài toán XOR: không đường thẳng nào tách được"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="360" height="320" viewBox="0 0 360 320">
            <line x1="40" y1="280" x2="330" y2="280" stroke="#9ca3af" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="300" stroke="#9ca3af" stroke-width="2"/>
            <circle cx="80" cy="260" r="16" fill="#2563eb"/><circle cx="280" cy="60" r="16" fill="#2563eb"/>
            <rect x="64" y="44" width="32" height="32" fill="#d97706"/><rect x="264" y="244" width="32" height="32" fill="#d97706"/>
            <g font-size="20"><text x="72" y="306">0</text><text x="272" y="306">1</text><text x="34" y="266">0</text><text x="34" y="66">1</text>
            <text x="300" y="300">x₁</text><text x="30" y="30">x₂</text></g>
          </svg></div>
          <div class="col"><p><span style="color:#2563eb">●</span> nhãn 0: (0; 0), (1; 1) &nbsp; <span style="color:#d97706">■</span> nhãn 1: (0; 1), (1; 0)</p>
          <p>Logistic (bài 20) có ranh giới là <b>một đường thẳng</b> — không đường thẳng nào tách được hai màu.</p></div></div>
        say: "Chào bạn, đây là bài toán hoặc loại trừ, có tên viết tắt trên màn hình. Hai điểm xanh có nhãn 0, hai điểm cam có nhãn 1, nằm chéo nhau. Mô hình logistic của bài 20 có ranh giới là một đường thẳng, và không đường thẳng nào tách được hai màu này."
      - show: |
          <div class="box key">Ghép <b>hai lớp</b> nơ-ron với một hàm phi tuyến ở giữa thì giải được. Hôm nay: mạng nhiều lớp, hàm kích hoạt, cách khởi tạo, và các mẹo huấn luyện.</div>
        say: "Nhưng ghép hai lớp nơ-ron với một hàm phi tuyến ở giữa thì giải được. Hôm nay ta học mạng nhiều lớp, hàm kích hoạt, cách khởi tạo, và các mẹo giúp huấn luyện tốt."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: một nơ-ron và lan truyền ngược"
    steps:
      - show: |
          <p>Bài 20: một nơ-ron $\ \hat{y} = \sigma(\mathbf{w}^T\mathbf{x} + b)$, với $\sigma'(z) = \sigma(z)\cdot\big(1 - \sigma(z)\big)$.</p>
          <p>Bài 22: lượt lùi qua mỗi cổng: gửi xuống $=$ đổ về $\cdot$ cục bộ; qua lớp tuyến tính thì nhân với ma trận chuyển vị.</p>
        focus: [1, 2]
        say: "Nhắc lại bài 20, một nơ-ron tính tổng có trọng số rồi đưa qua sigmoid, với đạo hàm sigmoid nhân 1 trừ sigmoid. Nhắc lại bài 22, lượt lùi qua mỗi cổng nhân gradient đổ về với gradient cục bộ."

  # ───────────────────────── 3. MẠNG HAI LỚP ─────────────────────────
  - id: mlp
    kind: symbol
    title: "Giải mã: mạng hai lớp h = f(W₁x + b₁)"
    checks:
      - "(lambda X: (np.maximum(0, X @ np.array([[1, 1], [1, 1.]]).T + np.array([0, -1.])) @ np.array([1, -2.])).tolist() == [0.0, 1.0, 1.0, 0.0])(np.array([[0, 0], [0, 1], [1, 0], [1, 1.]]))"
    steps:
      - show: |
          <div class="box key">$\mathbf{h} = f(\mathbf{W}_1\mathbf{x} + \mathbf{b}_1)$ (lớp ẩn), &nbsp;&nbsp; $\hat{y} = \mathbf{w}_2^T\mathbf{h} + b_2$ (lớp ra) &nbsp; — $f$ là <b>hàm kích hoạt</b>, áp dụng cho từng thành phần</div>
          <p>Hàm kích hoạt ReLU: $\ \operatorname{ReLU}(z) = \max(0, z)$ — giữ số dương, cắt số âm về 0.</p>
        introduces: [relu]
        focus: [1, 2]
        say: "Mạng hai lớp tính lớp ẩn h bằng hàm kích hoạt f áp lên W một nhân x cộng b một, rồi lớp ra tính tổng có trọng số của h. Hàm kích hoạt hay dùng nhất là ReLU, giữ nguyên số dương và cắt số âm về 0."
      - show: |
          <p>Giải XOR bằng tay: $\ h_1 = \operatorname{ReLU}(x_1 + x_2)$, &nbsp; $h_2 = \operatorname{ReLU}(x_1 + x_2 - 1)$, &nbsp; $\hat{y} = h_1 - 2h_2$</p>
          <table class="t"><tr><th>$(x_1; x_2)$</th><th>(0; 0)</th><th>(0; 1)</th><th>(1; 0)</th><th>(1; 1)</th></tr>
          <tr><td>$h_1$, $h_2$</td><td>0, 0</td><td>1, 0</td><td>1, 0</td><td>2, 1</td></tr>
          <tr><td>$\hat{y}$</td><td>$\hlg{0}$</td><td>$\hlg{1}$</td><td>$\hlg{1}$</td><td>$2 - 2 = \hlg{0}$</td></tr></table>
        focus: [1, ["1.1", "1.2"], ["1.3", "2.3"]]
        say: "Giải bài toán này bằng tay với hai nơ-ron ẩn. Nơ-ron thứ nhất đếm số đầu vào bằng 1, nơ-ron thứ hai chỉ bật khi cả hai bằng 1. Lấy nơ-ron thứ nhất trừ hai lần nơ-ron thứ hai, ta được đúng 0, 1, 1, 0."

  - id: xor_pic
    kind: intuition
    title: "Lớp ẩn làm gì: dời các điểm tới chỗ một đường thẳng tách được"
    checks:
      - "(lambda X: [tuple(np.maximum(0, X @ np.array([[1, 1], [1, 1.]]).T + np.array([0, -1.]))[i].tolist()) for i in range(4)] == [(0.0, 0.0), (1.0, 0.0), (1.0, 0.0), (2.0, 1.0)])(np.array([[0, 0], [0, 1], [1, 0], [1, 1.]]))"
      - "[h1 - 2*h2 > 0.5 for h1, h2 in ((0, 0), (1, 0), (2, 1))] == [False, True, False]"
    steps:
      - show: |
          <svg width="1200" height="420" viewBox="0 0 1200 420"><defs><marker id="ar23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g stroke="#9ca3af" stroke-width="2"><line x1="60" y1="340" x2="360" y2="340"/><line x1="80" y1="360" x2="80" y2="90"/><line x1="660" y1="340" x2="1180" y2="340"/><line x1="680" y1="360" x2="680" y2="110"/></g><circle cx="80" cy="340" r="16" fill="#2563eb"/><circle cx="300" cy="120" r="16" fill="#2563eb"/><rect x="64" y="104" width="32" height="32" fill="#d97706"/><rect x="284" y="324" width="32" height="32" fill="#d97706"/><circle cx="680" cy="340" r="16" fill="#2563eb"/><rect x="864" y="324" width="32" height="32" fill="#d97706"/><circle cx="1080" cy="140" r="16" fill="#2563eb"/><line x1="760" y1="350" x2="1180" y2="140" stroke="#059669" stroke-width="4" stroke-dasharray="14 8"/><line x1="400" y1="230" x2="570" y2="230" stroke="#1f2937" stroke-width="3" marker-end="url(#ar23)"/><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="200" y="50">đầu vào: hai màu chéo nhau</text><text x="930" y="50">lớp ẩn: tách được bằng đường thẳng</text><text x="485" y="210">lớp ẩn ReLU</text><text x="330" y="372">x₁</text><text x="55" y="100">x₂</text><text x="1165" y="372">h₁</text><text x="655" y="120">h₂</text><text x="680" y="395">(0; 0)</text><text x="880" y="395">(0; 1) và (1; 0) → (1; 0)</text><text x="1080" y="105">(1; 1) → (2; 1)</text></g><text x="1000" y="200" font-size="22" text-anchor="end" fill="#059669">h₁ − 2h₂ = 0,5</text></svg>
        say: "Hình bên trái là bốn điểm của bài toán hoặc loại trừ, hai màu nằm chéo nhau nên không đường thẳng nào tách được. Lớp ẩn ReLU của lời giải vừa rồi dời mỗi điểm tới một chỗ mới, với toạ độ là h một và h hai. Điểm 0, 0 đứng yên, hai điểm cam cùng rơi vào điểm 1, 0, còn điểm 1, 1 đi tới điểm 2, 1. Ở chỗ mới, đường thẳng h một trừ 2 h hai bằng 0 phẩy 5 tách gọn hai màu. Vậy lớp ẩn không tự tách, nó bẻ lại không gian để lớp ra chỉ cần một đường thẳng."

  # ───────────────────────── 4. VÌ SAO CẦN PHI TUYẾN ─────────────────────────
  - id: why_nonlinear
    kind: formula
    title: "Vì sao cần hàm kích hoạt phi tuyến"
    checks:
      - "(lambda W1, W2, x: W2*(W1*x) == (W2*W1)*x)(Matrix([[1, 2], [3, 4]]), Matrix([[1, -1]]), Matrix(sp.symbols('x1 x2')))"
    steps:
      - show: |
          <p>Bỏ $f$ (hay $f(z) = z$): $\ \hat{y} = \mathbf{w}_2^T(\mathbf{W}_1\mathbf{x} + \mathbf{b}_1) + b_2 = (\mathbf{w}_2^T\mathbf{W}_1)\,\mathbf{x} + (\mathbf{w}_2^T\mathbf{b}_1 + b_2)$</p>
          <div class="box key">Vẫn chỉ là <b>một</b> mô hình tuyến tính, vì tích hai ma trận là một ma trận (bài 2). Chồng bao nhiêu lớp tuyến tính cũng vậy.</div>
        focus: [1, 2, 2]
        say: "Nếu bỏ hàm kích hoạt, nhân phân phối ra, ta được một ma trận nhân x cộng một hằng số. Vì tích hai ma trận vẫn là một ma trận, như bài 2, mạng lại chỉ là một mô hình tuyến tính. Chồng bao nhiêu lớp tuyến tính cũng vậy, nên phải có hàm phi tuyến."

  # ───────────────────────── 5. HÀM KÍCH HOẠT ─────────────────────────
  - id: activations
    kind: concept
    title: "Ba hàm kích hoạt và đạo hàm của chúng"
    checks:
      - "(lambda z: sp.diff(sp.tanh(z), z).subs(z, 0) == 1 and sp.simplify(sp.diff(1/(1 + sp.exp(-z)), z).subs(z, 0)) == Rational(1, 4))(sp.Symbol('z'))"
      - "0.25**10 < 1e-6 and round(0.25**10*1e7, 2) == 9.54"
    steps:
      - show: |
          <table class="t"><tr><th>hàm</th><th>khoảng giá trị</th><th>đạo hàm lớn nhất</th><th>khi $|z|$ lớn</th></tr>
          <tr><td>sigmoid $\sigma(z)$</td><td>(0; 1)</td><td>0,25 (tại 0)</td><td>đạo hàm gần 0 — <b>bão hoà</b></td></tr>
          <tr><td>$\tanh(z)$</td><td>(−1; 1)</td><td>1 (tại 0)</td><td>bão hoà</td></tr>
          <tr><td>$\operatorname{ReLU}(z)$</td><td>từ 0 trở lên</td><td>1 khi $z > 0$</td><td>0 khi $z < 0$</td></tr></table>
        introduces: [tanh]
        say: "So sánh ba hàm kích hoạt qua đạo hàm. Sigmoid có đạo hàm lớn nhất chỉ 0 phẩy 25. Hàm tanh nằm giữa âm 1 và 1, đạo hàm lớn nhất bằng 1. Cả hai đều bão hoà, tức đạo hàm gần 0 khi z lớn. ReLU có đạo hàm bằng 1 khi z dương, bằng 0 khi z âm."
      - show: |
          <p><b>Triệt tiêu gradient</b>: lượt lùi qua 10 lớp sigmoid nhân 10 lần một số $\le 0{,}25$: $\ 0{,}25^{10} \approx 0{,}00000095$ — các lớp đầu gần như không học.</p>
          <p class="note"><b>Nơ-ron chết</b>: ReLU có $z < 0$ với mọi mẫu thì đạo hàm luôn 0, không bao giờ cập nhật. Cách sửa: Leaky ReLU $\max(0{,}01z, z)$.</p>
        focus: ["1.3", 1, 2]
        say: "Vì lượt lùi nhân các đạo hàm với nhau, qua 10 lớp sigmoid, gradient bị nhân 10 lần một số không quá 0 phẩy 25, còn khoảng một phần triệu. Các lớp đầu gần như không học, gọi là triệt tiêu gradient. Còn ReLU có thể chết, nếu z luôn âm thì không bao giờ được cập nhật."

  # ───────────────────────── 6. KHỞI TẠO ─────────────────────────
  - id: init
    kind: example
    title: "Ví dụ: khởi tạo trọng số quyết định mạng có học được không"
    checks:
      - "(lambda run: [round(run(s), 3) for s in (0.01, 1.0, math.sqrt(1/100))] == [0.0, 0.957, 0.232])(lambda std: (lambda rng: float(__import__('functools').reduce(lambda h, _: np.tanh(h @ (rng.standard_normal((100, 100))*std)), range(10), rng.standard_normal((1000, 100))).std()))(np.random.default_rng(0)))"
    steps:
      - show: |
          <p><b>Đừng</b> khởi tạo mọi trọng số bằng nhau: các nơ-ron ẩn tính giống hệt nhau, nhận gradient giống hệt nhau, và mãi mãi giống nhau.</p>
          <p>Máy thử 10 lớp tanh, mỗi lớp 100 nơ-ron, trọng số ngẫu nhiên với độ lệch chuẩn khác nhau, đo độ trải của lớp cuối:</p>
          <table class="t"><tr><th>độ lệch chuẩn khởi tạo</th><th>0,01</th><th>1</th><th>$\sqrt{1/100} = 0{,}1$ (Xavier)</th></tr>
          <tr><td>độ trải lớp cuối</td><td>≈ 0 — tín hiệu tắt</td><td>0,957 — 78% bão hoà</td><td>$\hlg{0{,}232}$ — vừa phải</td></tr></table>
        focus: [1, 2, 3, 3, 3]
        say: "Đừng khởi tạo mọi trọng số bằng nhau, vì khi đó các nơ-ron ẩn tính giống hệt nhau và mãi giống nhau. Máy thử mười lớp tanh. Trọng số quá nhỏ làm tín hiệu tắt về 0. Còn trọng số quá lớn làm tới 78 phần trăm nơ-ron rơi vào vùng bão hoà. Cách khởi tạo Xavier giữ tín hiệu vừa phải."
      - show: |
          <p>Khởi tạo Xavier ($n_{\text{vào}}$ = số đầu vào của nơ-ron) — giữ phương sai tín hiệu gần như không đổi qua các lớp:</p>
          $$\text{độ lệch chuẩn} = \sqrt{\frac{1}{n_{\text{vào}}}}$$
          <p class="note">Với ReLU người ta dùng $\sqrt{2/n_{\text{vào}}}$ (vì ReLU cắt mất một nửa).</p>
        focus: [[1, 2], 3]
        say: "Khởi tạo Xavier chọn độ lệch chuẩn bằng căn của 1 chia số đầu vào, để phương sai tín hiệu gần như không đổi qua các lớp. Với ReLU, người ta nhân thêm 2, vì ReLU cắt mất một nửa."

  # ───────────────────────── 7. CHUẨN HOÁ THEO LÔ & TẮT NGẪU NHIÊN ─────────────────────────
  - id: batchnorm
    kind: formula
    title: "Chuẩn hoá theo lô và tắt ngẫu nhiên"
    checks:
      - "(lambda b: (float(b.mean()), round(float(b.var()), 4), [round(float(v), 3) for v in (b - b.mean())/np.sqrt(b.var() + 1e-5)]) == (4.0, 2.6667, [-1.225, 0.0, 1.225]))(np.array([2, 4, 6.]))"
    steps:
      - show: |
          <p>Chuẩn hoá theo lô (Batch normalization): với mỗi đặc trưng, trong một lô mẫu, trừ trung bình rồi chia độ lệch chuẩn (bài 13):</p>
          $$\hat{x} = \frac{x - \mu_{\text{lô}}}{\sqrt{\sigma^2_{\text{lô}} + \varepsilon}}, \qquad \text{rồi}\ \ \gamma\cdot\hat{x} + \beta \ \ (\gamma,\ \beta\ \text{được học})$$
          <p><b>Làm thử ngay</b>: lô $(2;\ 4;\ 6)$: $\mu = 4$, $\sigma^2 = \frac{8}{3} \approx 2{,}667$ → $(\hlg{-1{,}225;\ 0;\ 1{,}225})$</p>
        introduces: [gamma, beta]
        focus: [[1, 2], 3]
        say: "Chuẩn hoá theo lô lấy mỗi đặc trưng trong một lô mẫu, trừ trung bình rồi chia độ lệch chuẩn như bài 13, sau đó nhân và cộng hai tham số được học. Làm thử ngay, lô 2, 4, 6 có trung bình 4, nên được âm 1 phẩy 225, 0 và 1 phẩy 225."
      - show: |
          <p class="note">Lúc <b>dự đoán</b>, có thể chỉ có một mẫu: dùng trung bình, phương sai đã tích lũy trong lúc học, <b>không</b> dùng của lô hiện tại.</p>
          <p class="note">Tắt ngẫu nhiên (dropout): khi học, mỗi nơ-ron bị tắt với xác suất $p$ — mạng không dựa dẫm vào vài nơ-ron, một cách chống quá khớp (bài 19). Khi dự đoán thì không tắt.</p>
        focus: [1, 2, 2]
        say: "Lúc dự đoán, có thể chỉ có một mẫu, nên ta dùng trung bình và phương sai đã tích lũy khi học, không dùng của lô hiện tại. Một mẹo khác là tắt ngẫu nhiên mỗi nơ-ron với xác suất p khi học, để chống quá khớp như bài 19. Khi dự đoán thì không tắt."

  # ───────────────────────── 8. KHÔNG LỒI ─────────────────────────
  - id: nonconvex
    kind: concept
    title: "Sai số của mạng nhiều lớp không lồi"
    checks:
      - "(lambda X, y, net: (np.mean((net(np.array([0, -1.]), np.array([1, -2.])) - y)**2), np.mean((net(np.array([-1, 0.]), np.array([-2, 1.])) - y)**2), np.mean((net(np.array([-0.5, -0.5]), np.array([-0.5, -0.5])) - y)**2)) == (0.0, 0.0, 1.6875))(np.array([[0, 0], [0, 1], [1, 0], [1, 1.]]), np.array([0, 1, 1, 0.]), lambda b1, w2: np.maximum(0, np.array([[0, 0], [0, 1], [1, 0], [1, 1.]]) @ np.array([[1, 1], [1, 1.]]).T + b1) @ w2)"
    steps:
      - show: |
          <table class="t"><tr><th>bộ trọng số</th><th>MSE</th></tr>
          <tr><td>A: lời giải XOR</td><td>0</td></tr>
          <tr><td>B: hoán đổi hai nơ-ron ẩn của A (đổi chỗ $b_1$ và trọng số ra)</td><td>0</td></tr>
          <tr><td><b>trung điểm</b> của A và B</td><td>$\hlo{1{,}6875}$ — lớn hơn trung bình hai đầu (bằng 0)</td></tr></table>
          <div class="box key">Hàm lồi (bài 11) thì giá trị ở trung điểm không vượt trung bình hai đầu → sai số của MLP <b>không lồi</b>, kể cả khi dùng cross-entropy.</div>
        focus: ["1.3", "1.4", 2]
        say: "Hoán đổi hai nơ-ron ẩn của lời giải của bài toán hoặc loại trừ, ta được một mạng khác cũng có sai số bằng 0. Nhưng lấy trung điểm của hai bộ trọng số, sai số lên tới 1 phẩy 6875. Theo bài 11, hàm lồi không thể như vậy, nên sai số của mạng nhiều lớp không lồi, dù dùng hàm sai số nào."

  # ───────────────────────── 9. SIÊU THAM SỐ ─────────────────────────
  - id: hyper
    kind: concept
    title: "Siêu tham số: những thứ ta chọn, máy không học"
    checks:
      - "784*100 + 100 + 100*10 + 10 == 79510"
      - "[round(10**e, 5) for e in (-4, -3, -2, -1)] == [0.0001, 0.001, 0.01, 0.1]"
    steps:
      - show: |
          <p>Số lớp, số nơ-ron mỗi lớp, tốc độ học $\eta$, kích thước lô, số lượt (epoch), độ mạnh phạt $\lambda$, xác suất tắt $p$ — chọn bằng tập kiểm định (bài 19).</p>
          <p>Kinh nghiệm thực hành: thử tốc độ học theo <b>thang log</b>: 0,0001; 0,001; 0,01; 0,1 — không thử 0,1; 0,2; 0,3.</p>
          <p class="note">Mạng 784 → 100 → 10 có $784\cdot 100 + 100 + 100\cdot 10 + 10 = 79\,510$ tham số (trọng số và hệ số tự do).</p>
        focus: [1, 1, 2]
        say: "Siêu tham số là những thứ ta chọn, máy không học, như số lớp, số nơ-ron, tốc độ học, kích thước lô, số lượt học và độ mạnh phạt. Ta chọn chúng bằng tập kiểm định như bài 19. Tốc độ học nên thử theo thang lôgarit, mỗi lần gấp 10."

  - id: count
    kind: example
    title: "Ví dụ: đếm tham số của mạng 784 → 100 → 10 từng lớp"
    checks:
      - "784*100 == 78400 and 78400 + 100 == 78500"
      - "100*10 == 1000 and 1000 + 10 == 1010 and 78500 + 1010 == 79510"
    steps:
      - show: |
          <p><b>Bước 1 — lớp ẩn.</b> Ma trận $\mathbf{W}_1$ có 100 hàng (mỗi nơ-ron ẩn một hàng), 784 cột (mỗi điểm ảnh một cột); thêm 100 hệ số tự do $\mathbf{b}_1$.</p>
          <table class="t"><tr><th>phần</th><th>số tham số</th></tr>
          <tr><td>$\mathbf{W}_1$</td><td>$784\cdot 100 = 78\,400$</td></tr>
          <tr><td>$\mathbf{b}_1$</td><td>100</td></tr>
          <tr><td>cộng</td><td>$\hlg{78\,500}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước một, đếm lớp ẩn, bắt đầu từ ma trận W một. Ma trận này có 100 hàng, mỗi nơ-ron ẩn một hàng, và 784 cột, mỗi điểm ảnh một cột, nên có 784 nhân 100, bằng 78 nghìn 400 trọng số. Thêm 100 hệ số tự do, mỗi nơ-ron ẩn một số. Cộng lại, lớp ẩn có 78 nghìn 500 tham số."
      - show: |
          <p><b>Bước 2 — lớp ra.</b> 10 nơ-ron ra, mỗi nơ-ron nhận 100 đầu vào từ lớp ẩn.</p>
          <table class="t"><tr><th>phần</th><th>số tham số</th></tr>
          <tr><td>$\mathbf{W}_2$</td><td>$100\cdot 10 = 1000$</td></tr>
          <tr><td>$\mathbf{b}_2$</td><td>10</td></tr>
          <tr><td>cả mạng</td><td>$78\,500 + 1010 = \hlg{79\,510}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước hai, đếm lớp ra, gồm 10 nơ-ron ra, mỗi nơ-ron nhận 100 đầu vào, nên có 100 nhân 10, bằng 1000 trọng số. Thêm 10 hệ số tự do, lớp ra có 1010 tham số. Cả mạng có 78 nghìn 500 cộng 1010, bằng 79 nghìn 510 tham số, khớp với con số ở cảnh trước. Gần như mọi tham số nằm ở lớp đầu, vì ảnh đầu vào có nhiều điểm ảnh."

  # ───────────────────────── 10. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: gradient của mạng bằng lan truyền ngược khớp bước nhỏ"
    checks:
      - "(lambda X, y: (lambda L, g: round(g, 4) == -0.1 and round((L(1 + 1e-5) - L(1 - 1e-5))/2e-5, 4) == -0.1)(lambda a: np.mean((np.maximum(0, X @ np.array([[a, 1], [1, 1.]]).T + np.array([0.1, -0.9])) @ np.array([1, -2.]) - y)**2), (lambda z1: np.mean(2*(np.maximum(0, z1) @ np.array([1, -2.]) - y) * 1 * (z1[:, 0] > 0) * X[:, 0]))(X @ np.array([[1, 1], [1, 1.]]).T + np.array([0.1, -0.9]))))(np.array([[0, 0], [0, 1], [1, 0], [1, 1.]]), np.array([0, 1, 1, 0.]))"
      - "(lambda X, y: (lambda L, g: abs(g - (L(1 + 1e-5) - L(1 - 1e-5))/2e-5) < 1e-6)(lambda a: np.mean((np.maximum(0, X @ np.array([[a, 1], [1, 1.]]).T + np.array([0.1, -0.9])) @ np.array([1, -2.]) - y)**2), (lambda z1: np.mean(2*(np.maximum(0, z1) @ np.array([1, -2.]) - y) * 1 * (z1[:, 0] > 0) * X[:, 0]))(X @ np.array([[1, 1], [1, 1.]]).T + np.array([0.1, -0.9]))))(np.array([[0, 0], [0, 1], [1, 0], [1, 1.]]), np.array([0, 1, 1, 0.]))"
    steps:
      - show: |
          <p>Lấy mạng XOR, dời nhẹ hệ số tự do (để không có $z = 0$ đúng điểm gãy của ReLU). Tính đạo hàm của MSE theo một trọng số lớp ẩn:</p>
          <p>① bằng lan truyền ngược (bài 22): gửi xuống qua lớp ra, qua ReLU (nhân 1 hoặc 0), qua cổng nhân<br>② bằng bước nhỏ $h = 0{,}00001$ (bài 6)</p>
          <table class="t"><tr><th>cách</th><th>đạo hàm theo trọng số đó</th></tr>
          <tr><td>① lan truyền ngược</td><td>$-0{,}1$</td></tr>
          <tr><td>② bước nhỏ</td><td>$-0{,}1000$ — lệch dưới $0{,}000001$ $\checkmark$</td></tr></table>
        focus: [1, [2, "3.2"], "3.3"]
        say: "Phép thử, ta lấy mạng vừa giải bài toán hoặc loại trừ và dời nhẹ hệ số tự do, để tránh điểm gãy của ReLU. Tính đạo hàm của sai số theo một trọng số lớp ẩn bằng lan truyền ngược của bài 22, rồi bằng bước nhỏ của bài 6. Cả hai cách đều cho âm 0 phẩy 1, lệch nhau dưới một phần triệu."

  # ───────────────────────── 11. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Mạng nhiều lớp trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>ở đâu</th><th>dùng mạng nhiều lớp thế nào</th></tr>
          <tr><td>lớp ra</td><td>phân loại: softmax + cross-entropy (bài 20); hồi quy: tuyến tính + MSE (bài 18)</td></tr>
          <tr><td><b>Bài 34–35</b> (mở rộng)</td><td>mạng tích chập cho ảnh, mạng hồi tiếp cho chuỗi — cùng ý tưởng nhiều lớp, cùng lan truyền ngược</td></tr>
          <tr><td><b>Bài 37</b> (mở rộng)</td><td>mạng tự mã hoá — mạng nhiều lớp học cách nén dữ liệu</td></tr></table>
        forward_ref: true
        say: "Lớp ra của mạng phân loại thường là hàm chuẩn hoá mũ với entropy chéo như bài 20, còn mạng hồi quy dùng lớp ra tuyến tính như bài 18. Các bài mở rộng 34 và 35 dùng cùng ý tưởng nhiều lớp cho ảnh và cho chuỗi, và bài 37 dùng nó để nén dữ liệu."

  # ───────────────────────── 12. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chồng nhiều lớp mà không có hàm kích hoạt <b class="red">(vô ích)</b>
          <br><span class="note">Tích các ma trận vẫn là một ma trận — mạng vẫn tuyến tính, vẫn không giải được XOR.</span></div>
        say: "Lỗi thứ nhất, chồng nhiều lớp mà không có hàm kích hoạt. Tích các ma trận vẫn là một ma trận, nên mạng vẫn tuyến tính và vẫn không giải được bài toán hoặc loại trừ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Khởi tạo tất cả trọng số bằng 0 <b class="red">(sai)</b>
          <br><span class="note">Mọi nơ-ron ẩn giống hệt nhau mãi mãi. Dùng khởi tạo ngẫu nhiên kiểu Xavier.</span></div>
        say: "Lỗi thứ hai, khởi tạo tất cả trọng số bằng 0. Mọi nơ-ron ẩn sẽ giống hệt nhau mãi mãi. Hãy dùng khởi tạo ngẫu nhiên kiểu Xavier."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lúc dự đoán vẫn chuẩn hoá theo lô hiện tại, hoặc vẫn tắt ngẫu nhiên <b class="red">(sai)</b>
          <br><span class="note">Dự đoán phải dùng thống kê đã tích lũy và không tắt nơ-ron nào — các thư viện có chế độ “học” và chế độ “dự đoán” riêng.</span></div>
        say: "Lỗi thứ ba, lúc dự đoán vẫn chuẩn hoá theo lô hiện tại, hoặc vẫn tắt ngẫu nhiên. Khi dự đoán phải dùng thống kê đã tích lũy và không tắt nơ-ron nào. Các thư viện có chế độ học và chế độ dự đoán riêng."

  # ───────────────────────── 13. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[max(0, v) for v in (-3, 0, 2.5)] == [0, 0, 2.5]"
      - "4*5 + 5 + 5*3 + 3 == 43 and 4*5 + 5 == 25 and 5*3 + 3 == 18 and 25 + 18 == 43"
      - "Rational(1 + 3, 2) == 2 and Rational((1 - 2)**2 + (3 - 2)**2, 2) == 1 and np.mean([-1, 1]) == 0 and np.var([-1, 1]) == 1"
      - "(lambda b: [round(float(v), 3) for v in (b - b.mean())/np.sqrt(b.var() + 1e-5)])(np.array([1, 3.])) == [-1.0, 1.0]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $\operatorname{ReLU}(-3)$, $\operatorname{ReLU}(0)$, $\operatorname{ReLU}(2{,}5)$.</td></tr>
          <tr><td>2</td><td>Mạng 4 → 5 → 3 có bao nhiêu tham số (kể cả hệ số tự do)?</td></tr>
          <tr><td>3</td><td>Chuẩn hoá theo lô cho lô $(1;\ 3)$ (bỏ qua $\varepsilon$, $\gamma = 1$, $\beta = 0$).</td></tr></table>
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một tính ReLU. Câu hai đếm số tham số. Câu ba chuẩn hoá một lô hai mẫu. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① ReLU giữ số dương, cắt số âm về 0:</p>
          <table class="t"><tr><th>$z$</th><th>−3</th><th>0</th><th>2,5</th></tr>
          <tr><td>$\max(0, z)$</td><td>0</td><td>0</td><td>$\hlg{2{,}5}$</td></tr></table>
        focus: [2, 2]
        say: "Câu một, ReLU cho 0, 0 và 2 phẩy 5. Số âm 3 bị cắt về 0, số 0 giữ nguyên là 0, còn 2 phẩy 5 là số dương nên giữ nguyên."
      - clear: true
        show: |
          <p>② Đếm từng lớp như ví dụ 784 → 100 → 10:</p>
          <table class="t"><tr><th>lớp</th><th>trọng số</th><th>hệ số tự do</th><th>cộng</th></tr>
          <tr><td>ẩn (4 → 5)</td><td>$4\cdot 5 = 20$</td><td>5</td><td>25</td></tr>
          <tr><td>ra (5 → 3)</td><td>$5\cdot 3 = 15$</td><td>3</td><td>18</td></tr>
          <tr><td>cả mạng</td><td></td><td></td><td>$25 + 18 = \hlg{43}$</td></tr></table>
        focus: [2, "2.2", "2.3", "2.4"]
        say: "Câu hai, ta đếm từng lớp như ví dụ vừa rồi. Lớp ẩn có 4 nhân 5 bằng 20 trọng số và 5 hệ số tự do, cộng là 25. Lớp ra có 5 nhân 3 bằng 15 trọng số và 3 hệ số tự do, cộng là 18. Cả mạng có 25 cộng 18, bằng 43 tham số."
      - clear: true
        show: |
          <p>③ Lô $(1;\ 3)$: trung bình, phương sai, rồi chuẩn hoá từng số:</p>
          $$\mu = \frac{1 + 3}{2} = 2, \qquad \sigma^2 = \frac{(1 - 2)^2 + (3 - 2)^2}{2} = 1$$
          $$\hat{x} = \frac{1 - 2}{\sqrt{1}} = \hlg{-1}, \qquad \hat{x} = \frac{3 - 2}{\sqrt{1}} = \hlg{1}$$
        focus: [1, 2, 3]
        say: "Câu ba, trung bình của lô là 1 cộng 3, chia 2, bằng 2, còn phương sai là trung bình của hai bình phương độ lệch, bằng 1. Chuẩn hoá, số 1 thành 1 trừ 2, chia căn của 1, bằng âm 1, còn số 3 thành 1. Kết quả có trung bình 0 và phương sai 1, đúng như chuẩn hoá theo lô mong muốn."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nhiều lớp + phi tuyến: giải được XOR</span><span class="a">→</span>
          <span class="n">ReLU: tránh bão hoà</span><span class="a">→</span>
          <span class="n">khởi tạo Xavier: giữ phương sai</span><span class="a">→</span>
          <span class="n">chuẩn hoá theo lô, tắt ngẫu nhiên</span><span class="a">→</span>
