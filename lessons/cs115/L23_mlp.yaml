  - "So sánh sigmoid, tanh, ReLU qua đạo hàm: triệt tiêu gradient, nơ-ron chết"
  - "Biết vì sao không khởi tạo các trọng số bằng nhau và ý tưởng khởi tạo Xavier"
  - "Hiểu chuẩn hoá theo lô, tắt ngẫu nhiên và cách chọn siêu tham số"
