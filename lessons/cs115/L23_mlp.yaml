source: "DC23#Ch4; NN#Activation-functions (sigmoid, tanh, ReLU, Leaky ReLU, “dead ReLU”), Weight-initialization (Xavier), Batch-normalization, Dropout, Hyperparameter (lấy mẫu theo thang log); AUDIT A5"
assumes: [cdot, sub, vec, mat, transpose, implies, sigma, exp, max_fn, partial, approx, sqrt, epsilon, var, mu, power, neq, hat, prime, eta, lambda]
# Quy ước ký hiệu: lớp ẩn h = f(W₁x + b₁) với f là hàm kích hoạt; ReLU(z) = max(0; z) viết \max(0, z); tanh viết \tanh (đăng ký mới);
#   chuẩn hoá theo lô dùng μ, σ² của lô (như bài 13) và số rất nhỏ ε (như bài 9, 20).
# Lời đọc: ReLU, tanh, Xavier — cách viết theo probe (B47–B49, REVIEW_L23.md); “Batch normalization” đọc “chuẩn hoá theo lô”;
#   “dropout” đọc “tắt ngẫu nhiên”; “perceptron” chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 18 (mô hình tuyến tính), bài 19 (quá khớp, phạt, chọn bằng kiểm định), bài 20 (sigmoid,
#   σ′ = σ(1 − σ)), bài 22 (lan truyền ngược: gửi xuống = đổ về nhân cục bộ), bài 11 (hàm lồi), bài 13 (trung bình, phương sai).
# Sửa nguồn: AUDIT A5 — sai số của MLP không lồi kể cả dùng cross-entropy (chứng minh bằng hai bộ trọng số hoán đổi).
