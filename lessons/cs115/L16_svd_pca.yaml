        say: "Bóng càng trải rộng thì càng ít thông tin bị mất khi ta chỉ giữ lại cái bóng. Hướng 135 độ có bóng hẹp nhất, và nó vuông góc với hướng thứ nhất, gọi là thành phần chính thứ hai."

  # ───────────────────────── 4. VÌ SAO LÀ VECTOR RIÊNG ─────────────────────────
  - id: proof
    kind: formula
    title: "Vì sao hướng tốt nhất là vector riêng lớn nhất"
    checks:
      - "(lambda a, b: sp.expand(((a*Matrix([1, 1])/sp.sqrt(2) + b*Matrix([1, -1])/sp.sqrt(2)).T*Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]])*(a*Matrix([1, 1])/sp.sqrt(2) + b*Matrix([1, -1])/sp.sqrt(2)))[0] - 4*a**2 - b**2) == 0)(*sp.symbols('a b'))"
      - "(lambda S: max(S.eigenvals().keys()) == 4)(Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]))"
      - "(lambda D: sum((Matrix([d])*Matrix([1, 0]))[0]**2 for d in D)/4 == Rational(5, 2) and sum((Matrix(d)*Matrix([d]) for d in D), sp.zeros(2, 2))/4 == Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]))([(2, 2), (-2, -2), (1, -1), (-1, 1)])"
    steps:
      - show: |
          <p>Bóng của vector lệch $\mathbf{d}_n$ trên $\mathbf{u}$ là $\mathbf{u}^T\mathbf{d}_n$; các bóng có trung bình 0, nên phương sai của bóng là trung bình bình phương của chúng:</p>
          $$\frac{1}{N}\sum_{n}(\mathbf{u}^T\mathbf{d}_n)(\mathbf{d}_n^T\mathbf{u}) = \mathbf{u}^T\Big(\frac{1}{N}\sum_{n}\mathbf{d}_n\mathbf{d}_n^T\Big)\mathbf{u} = \mathbf{u}^T\mathbf{S}\mathbf{u}$$
          <p class="note">Thử với $\mathbf{u} = (1; 0)$: $\ \mathbf{u}^T\mathbf{S}\mathbf{u} = S_{11} = 2{,}5$ — đúng phương sai ở góc 0° trong bảng.</p>
        focus: [1, 1, 2, 3]
        say: "Trước hết, vì sao phương sai của bóng lại có dạng gọn như vậy? Bóng của mỗi vector lệch là tích vô hướng của nó với u, các bóng có trung bình bằng 0, nên phương sai là trung bình bình phương các bóng. Viết mỗi bình phương thành u chuyển vị d nhân d chuyển vị u, rồi gom phần ở giữa lại, ta được đúng ma trận hiệp phương sai S, nên phương sai bằng u chuyển vị S u. Thử với hướng nằm ngang, kết quả là ô góc trên bên trái, 2 phẩy 5, khớp với góc 0 độ trong bảng."
      - show: |
          <p>Phương sai của bóng trên $\mathbf{u}$ là $\ \mathbf{u}^T\mathbf{S}\mathbf{u}$ ($\mathbf{S}$ = ma trận hiệp phương sai). Viết $\mathbf{u}$ theo hai vector riêng <b>trực chuẩn</b> (bài 4): $\ \mathbf{u} = a\cdot\mathbf{v}_1 + b\cdot\mathbf{v}_2$, $\ a^2 + b^2 = 1$.</p>
          <div class="box key">$$\mathbf{u}^T\mathbf{S}\mathbf{u} = 4a^2 + 1\cdot b^2 \le 4\cdot(a^2 + b^2) = 4$$ — lớn nhất khi $a = 1$, tức $\mathbf{u} = \mathbf{v}_1$</div>
        focus: [0, "1.2", ["1.6", "1.7"], "2.1"]
        say: "Vì sao lại là vector riêng? Phương sai của bóng trên u bằng u chuyển vị nhân S nhân u. Theo bài 4, viết u theo hai vector riêng trực chuẩn, với a bình phương cộng b bình phương bằng 1. Thay vào, phương sai bằng 4 a bình phương cộng b bình phương, không vượt quá 4."
      - show: |
          <p class="note">Tổng quát: hướng có bóng trải rộng nhất là vector riêng ứng với trị riêng <b>lớn nhất</b> của $\mathbf{S}$, và phương sai giữ được đúng bằng trị riêng đó.</p>
        say: "Nên phương sai lớn nhất khi a bằng 1, tức u trùng vector riêng thứ nhất. Tổng quát, hướng có bóng rộng nhất là vector riêng ứng với trị riêng lớn nhất, và phương sai giữ được đúng bằng trị riêng đó."

  # ───────────────────────── 5. KÝ HIỆU SVD ─────────────────────────
  - id: sym_svd
    kind: symbol
    title: "Giải mã: A = U Σ Vᵀ — phân rã giá trị kỳ dị"
    checks:
      - "(lambda Xc, U, V: U*sp.diag(4, 2)*V.T == Xc and U.T*U == sp.eye(2) and V.T*V == sp.eye(2))(Matrix([[2, 2], [-2, -2], [1, -1], [-1, 1]]), Matrix([[1, 0], [-1, 0], [0, 1], [0, -1]])/sp.sqrt(2), Matrix([[1, 1], [1, -1]])/sp.sqrt(2))"
      - "sorted(sp.sqrt(v) for v in (Matrix([[2, 2], [-2, -2], [1, -1], [-1, 1]]).T*Matrix([[2, 2], [-2, -2], [1, -1], [-1, 1]])).eigenvals().keys()) == [2, 4]"
    steps:
      - show: |
          <div class="box key">Mọi ma trận $\mathbf{A}$ viết được thành $\ \mathbf{A} = \mathbf{U}\mathbf{\Sigma}\mathbf{V}^T$: &nbsp; $\mathbf{U}$, $\mathbf{V}$ có các cột trực chuẩn (xoay), &nbsp; $\mathbf{\Sigma}$ đường chéo chứa <b>giá trị kỳ dị</b> $\sigma_1 \ge \sigma_2 \ge \dots \ge 0$ (kéo giãn).</div>
          <p>Cột của $\mathbf{V}$ là vector riêng của $\mathbf{A}^T\mathbf{A}$; &nbsp; $\sigma_i^2$ là trị riêng của $\mathbf{A}^T\mathbf{A}$.</p>
        introduces: [dots]
        focus: ["1.2", 1, "1.7"]
        say: "Ký hiệu mới, A bằng U nhân xích ma hoa nhân V chuyển vị, đọc là phân rã giá trị kỳ dị. Mọi ma trận đều tách được thành ba phần, xoay, kéo giãn, rồi xoay. Ma trận ở giữa có đường chéo chứa các giá trị kỳ dị, xếp từ lớn đến nhỏ, không âm."
      - show: |
          <p>Lớp học, $\mathbf{X}_c$ (4 hàng là 4 vector lệch, kích thước $\sz{4}{2}$):</p>
          <p>$$\begin{bmatrix} 2 & 2 \\ -2 & -2 \\ 1 & -1 \\ -1 & 1 \end{bmatrix} = \underbrace{\frac{1}{\sqrt{2}}\begin{bmatrix} 1 & 0 \\ -1 & 0 \\ 0 & 1 \\ 0 & -1 \end{bmatrix}}_{\mathbf{U}}\ \underbrace{\begin{bmatrix} 4 & 0 \\ 0 & 2 \end{bmatrix}}_{\mathbf{\Sigma}}\ \underbrace{\frac{1}{\sqrt{2}}\begin{bmatrix} 1 & 1 \\ 1 & -1 \end{bmatrix}}_{\mathbf{V}^T}$$</p>
        focus: [2, 2]
        say: "Với dữ liệu lớp học đã trừ trung bình, máy tách được như trên màn hình. Hai giá trị kỳ dị là 4 và 2, và hai cột của V chính là hai hướng 1, 1 và 1, âm 1 mà ta vừa tìm được bằng cái bóng."
      - show: |
          <p class="note">Ở bài 15, $\mathbf{\Sigma}$ in đậm là ma trận hiệp phương sai. Trong bài này $\mathbf{\Sigma}$ là ma trận giá trị kỳ dị; hiệp phương sai viết $\mathbf{S}$. Có sách gọi $\sigma_i$ là “giá trị đơn lẻ” — thuật ngữ thông dụng là <b>giá trị kỳ dị</b> (singular value).</p>
        notation_note: true
        say: "Cẩn thận về ký hiệu. Ở bài 15, xích ma hoa in đậm là ma trận hiệp phương sai, còn trong bài này nó là ma trận giá trị kỳ dị, và hiệp phương sai được viết bằng chữ S. Có sách gọi các số này là giá trị đơn lẻ, còn tên thông dụng là giá trị kỳ dị."

  # ───────────────────────── 6. NỐI SVD VỚI PCA ─────────────────────────
  - id: link
    kind: formula
    title: "PCA chính là SVD của dữ liệu đã trừ trung bình"
    checks:
      - "Matrix([[2, 2], [-2, -2], [1, -1], [-1, 1]]).T*Matrix([[2, 2], [-2, -2], [1, -1], [-1, 1]])/4 == Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]])"
      - "Rational(4**2, 4) == 4 and Rational(2**2, 4) == 1"
      - "Rational(16, 3)/(Rational(16, 3) + Rational(4, 3)) == Rational(4, 5) and round(16/3, 2) == 5.33 and round(4/3, 2) == 1.33"
    steps:
      - show: |
          <p>$\mathbf{S} = \frac{1}{N}\mathbf{X}_c^T\mathbf{X}_c$ (bài 15). Thay $\mathbf{X}_c = \mathbf{U}\mathbf{\Sigma}\mathbf{V}^T$, vì $\mathbf{U}^T\mathbf{U} = \mathbf{I}$:</p>
          <div class="box key">$$\mathbf{S} = \frac{1}{N}\mathbf{V}\mathbf{\Sigma}^2\mathbf{V}^T$$ $\implies$ trục chính = cột của $\mathbf{V}$, &nbsp; $\lambda_i = \dfrac{\sigma_i^2}{N}$</div>
        introduces: [identity]
        focus: ["1.1", 2]
        say: "Ma trận hiệp phương sai bằng một phần N nhân X c chuyển vị nhân X c, như cách tính ở bài 15. Thay phân rã vào, vì U chuyển vị nhân U bằng ma trận đơn vị, ta được trục chính là cột của V, và trị riêng bằng giá trị kỳ dị bình phương chia N."
      - clear: true
        show: |
          <p><b>Làm thử ngay</b>: $$\lambda_1 = \frac{4^2}{4} = 4, \qquad \lambda_2 = \frac{2^2}{4} = 1$$ — khớp trị riêng ở bài 15 $\checkmark$</p>
          <p class="note">Máy tính thường dùng SVD trực tiếp trên $\mathbf{X}_c$ (chính xác hơn so với lập $\mathbf{S}$ rồi tìm trị riêng). Tóm gọn: “PCA là SVD trên dữ liệu đã trừ trung bình”.</p>
          <p class="note">Có sách và thư viện chia $N - 1$ thay cho $N$ (như ghi chú ở bài 15): khi đó $\lambda_i = \frac{\sigma_i^2}{N - 1}$, ví dụ $\frac{16}{3} \approx 5{,}33$ và $\frac{4}{3} \approx 1{,}33$ — các trục chính và tỉ lệ $\frac{\lambda_1}{\lambda_1 + \lambda_2} = 80\%$ <b>không đổi</b>.</p>
        focus: [1, 2, 3, 3]
        say: "Làm thử ngay, 4 bình phương chia 4 bằng 4, và 2 bình phương chia 4 bằng 1, khớp với trị riêng ở bài 15. Đó là lý do người ta nói phân tích thành phần chính chính là phân rã giá trị kỳ dị trên dữ liệu đã trừ trung bình. Có sách và thư viện chia cho N trừ 1 thay vì N, khi đó hai trị riêng thành 16 phần 3 và 4 phần 3. Nhưng các trục chính không đổi, và tỉ lệ phương sai giữ lại vẫn là 80 phần trăm."

  # ───────────────────────── 7. NÉN VÀ KHÔI PHỤC ─────────────────────────
  - id: compress
    kind: example
    title: "Ví dụ: nén lớp học từ 2 chiều xuống 1 chiều"
    checks:
      - "(lambda v: [round(float((Matrix([d]) * v)[0]), 2) for d in ([2, 2], [-2, -2], [1, -1], [-1, 1])] == [2.83, -2.83, 0.0, 0.0])(Matrix([1, 1])/sp.sqrt(2))"
      - "(lambda v: [list(Matrix([6, 6]) + (Matrix([d]) * v)[0]*v) for d in ([2, 2], [-2, -2], [1, -1], [-1, 1])] == [[8, 8], [4, 4], [6, 6], [6, 6]])(Matrix([1, 1])/sp.sqrt(2))"
      - "Rational(4, 4 + 1) == Rational(4, 5) and 4*2 == 8 and 1*(4 + 2) == 6"
      - "(Matrix([[2, 2]])*Matrix([1, 1])/sp.sqrt(2))[0] == 2*sp.sqrt(2) and round(2*math.sqrt(2), 2) == 2.83 and (Matrix([[1, -1]])*Matrix([1, 1]))[0] == 0"
      - "Matrix([6, 6]) + 2*sp.sqrt(2)*Matrix([1, 1])/sp.sqrt(2) == Matrix([8, 8]) and Matrix([7, 5]) - Matrix([6, 6]) == Matrix([1, -1]) and Matrix([1, -1]).norm() == sp.sqrt(2) and round(math.sqrt(2), 2) == 1.41"
    steps:
      - show: |
          <p><b>Bước 1 — bóng.</b> Bóng = tích vô hướng của vector lệch với $\mathbf{v}_1 = \frac{1}{\sqrt{2}}(1; 1)$:</p>
          $$\text{An: } \frac{2\cdot 1 + 2\cdot 1}{\sqrt{2}} = \frac{4}{\sqrt{2}} = 2\sqrt{2} \approx 2{,}83 \qquad \text{Bình: } \frac{1\cdot 1 + (-1)\cdot 1}{\sqrt{2}} = \frac{0}{\sqrt{2}} = 0$$
        focus: [1, 2, 2]
        say: "Bước một, tính bóng của từng bạn trên hướng thứ nhất, bằng tích vô hướng của vector lệch với v một. Với An, 2 nhân 1 cộng 2 nhân 1 bằng 4, chia căn 2 được 2 căn 2, xấp xỉ 2 phẩy 83. Với Bình, 1 trừ 1 bằng 0, nên bóng của Bình bằng 0."
      - show: |
          <p><b>Bước 2.</b> Giữ $K = 1$ thành phần: mỗi bạn chỉ còn <b>một số</b> = độ dài bóng trên $\mathbf{v}_1 = \frac{1}{\sqrt{2}}(1; 1)$:</p>
          <table class="t"><tr><th>bạn</th><th>An (8; 8)</th><th>Cường (4; 4)</th><th>Bình (7; 5)</th><th>Dũng (5; 7)</th></tr>
          <tr><td>bóng (1 số)</td><td>2,83</td><td>−2,83</td><td>0</td><td>0</td></tr>
          <tr><td>khôi phục: trung bình + bóng $\cdot\ \mathbf{v}_1$</td><td>(8; 8) ✓</td><td>(4; 4) ✓</td><td>$\hlo{(6; 6)}$</td><td>$\hlo{(6; 6)}$</td></tr></table>
        focus: [1, "2.3"]
        say: "Giữ một thành phần, mỗi bạn chỉ còn một con số, là độ dài cái bóng trên hướng thứ nhất. Khôi phục bằng trung bình cộng bóng nhân hướng, An và Cường được trả lại đúng, còn Bình và Dũng bị kéo về 6 và 6, vì phần lệch của họ nằm trên hướng bị bỏ."
      - clear: true
        show: |
          <p><b>Bước 3 — khôi phục.</b> An: $$(6; 6) + 2\sqrt{2}\cdot\frac{1}{\sqrt{2}}(1; 1) = (6; 6) + (2; 2) = (8; 8)\ \checkmark$$</p>
          <p>Bình: khôi phục được $(6; 6)$; phần bị mất $= (7; 5) - (6; 6) = (1; -1)$, dài $\sqrt{2} \approx 1{,}41$ — nằm đúng trên hướng thứ hai đã bỏ.</p>
        focus: [1, 2, 2]
        say: "Bước ba, khôi phục An, lấy trung bình 6 và 6 cộng bóng 2 căn 2 nhân hướng một chia căn 2 nhân 1, 1, tức cộng thêm 2 và 2, được lại đúng 8 và 8. Với Bình, khôi phục chỉ được 6 và 6. Phần bị mất là 1 và âm 1, dài căn 2, xấp xỉ 1 phẩy 41, nằm đúng trên hướng thứ hai đã bỏ."
      - show: |
          <div class="box key">Phương sai giữ lại $= \dfrac{\lambda_1}{\lambda_1 + \lambda_2} = \dfrac{4}{5} = \hlg{80\%}$</div>
          <p>Số cần lưu: $N\cdot D = 4\cdot 2 = 8$ &nbsp; → &nbsp; $K\cdot(N + D) = 1\cdot(4 + 2) = 6$ (các bóng + hướng; chưa kể $D$ số của vector trung bình). Với 1000 ảnh, $D = 784$, $K = 50$: $\ 50\cdot 1784 = 89\,200$.</p>
        focus: [1, ["2.1", "2.2"], "2.5"]
        say: "Tỉ lệ phương sai giữ lại bằng trị riêng thứ nhất chia tổng hai trị riêng, tức 4 phần 5, bằng 80 phần trăm. Thay vì N nhân D số, ta lưu K nhân N cộng D số, gồm các bóng và các hướng, chưa kể D số của vector trung bình. Với ảnh, đó là 89 nghìn 200 số như ở đầu bài."

  # ───────────────────────── 8. HẠNG ─────────────────────────
  - id: rank_sv
    kind: concept
    title: "Hạng = số giá trị kỳ dị khác 0"
    checks:
      - "(lambda R: R.rank() == 1 and sorted(sp.sqrt(v) for v in (R.T*R).eigenvals().keys()) == [0, 2*sp.sqrt(5)])(Matrix([[1, 1], [-1, -1], [2, 2], [-2, -2]]))"
      - "round(2*math.sqrt(5), 2) == 4.47"
    steps:
      - show: |
          <p>Bài 3: hạng là số hàng khác 0 còn lại sau khi khử — số “hướng độc lập thật sự”.</p>
          <p>Dữ liệu nằm hẳn trên một đường: $(1; 1)$, $(-1; -1)$, $(2; 2)$, $(-2; -2)$ </p>
          <p>→ &nbsp; giá trị kỳ dị $\approx 4{,}47$ và $\hlo{0}$, &nbsp; hạng $= 1$.</p>
          <div class="box key">Hạng của ma trận = số giá trị kỳ dị khác 0. Giá trị kỳ dị bằng 0 ⟹ bỏ hướng đó <b>không mất gì</b>.</div>
        focus: [1, [2, 3], 4]
        say: "Nhắc lại bài 3, hạng là số hàng khác 0 còn lại sau khi khử, tức số hướng độc lập thật sự. Nếu dữ liệu nằm hẳn trên một đường, giá trị kỳ dị thứ hai bằng 0, và hạng bằng 1. Bỏ hướng có giá trị kỳ dị bằng 0 thì không mất gì cả."

  # ───────────────────────── 9. KIỂM BẰNG MÁY ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: thư viện numpy cho cùng kết quả"
    checks:
      - "(lambda s: [round(float(x), 6) for x in s] == [4.0, 2.0])(np.linalg.svd(np.array([[8, 8], [4, 4], [7, 5], [5, 7.]]) - np.array([6, 6.]), compute_uv=False))"
      - "(lambda Vt: abs(abs(Vt[0][0]) - 1/math.sqrt(2)) < 1e-12 and abs(Vt[0][0] - Vt[0][1]) < 1e-12)(np.linalg.svd(np.array([[8, 8], [4, 4], [7, 5], [5, 7.]]) - np.array([6, 6.]))[2])"
    steps:
      - show: |
          <p>Gọi <code>np.linalg.svd</code> trên dữ liệu đã trừ trung bình: giá trị kỳ dị <b>4,000000</b> và <b>2,000000</b>; hàng đầu của $\mathbf{V}^T$ là $\pm(0{,}7071;\ 0{,}7071)$ $= \pm\frac{1}{\sqrt{2}}(1; 1)\ \checkmark$</p>
          <p class="note">Dấu $\pm$: vector riêng đổi dấu vẫn là vector riêng — thư viện có thể trả về $-\mathbf{v}_1$; hướng (đường thẳng) không đổi.</p>
        focus: [1, 1, 2]
        say: "Phép thử bằng thư viện máy tính, vì tính tay dễ nhầm. Ta được hai giá trị kỳ dị 4 và 2, và hướng thứ nhất là 0 phẩy 7071, 0 phẩy 7071, đúng như tính tay. Thư viện có thể trả về vector đổi dấu, nhưng đường thẳng thì vẫn vậy."

  # ───────────────────────── 10. TRONG AI ─────────────────────────
  - id: in_ai
