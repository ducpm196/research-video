id: L16
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 16 — SVD & PCA: nén dữ liệu bằng cái bóng dài nhất"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "tex#L144–L146 (PCA và SVD), L200–L214 (A = UΣVᵀ, các bước PCA với S = XᵀX/N); LA24#Dimension-Reduction; AUDIT A6, A15"
assumes: [cdot, sub, sub2, sum, vec, mat, transpose, dim, norm, rank, lambda, mu, var, Sigma_mat, sigma, approx, sqrt, implies]
# Quy ước ký hiệu (AUDIT A6): ma trận dữ liệu X kích thước N × D (mỗi HÀNG là một mẫu, N mẫu, D đặc trưng); dữ liệu đã trừ trung bình
#   viết \mathbf{X}_c; ma trận hiệp phương sai viết \mathbf{S} = \frac{1}{N}\mathbf{X}_c^T\mathbf{X}_c (như tài liệu dòng 212 — KHÔNG dùng
#   Σ cho hiệp phương sai trong bài này, vì Σ ở đây là ma trận giá trị kỳ dị; bài 15 dùng Σ cho hiệp phương sai — nói ở notation_note);
#   giá trị kỳ dị σ₁ ≥ σ₂ (AUDIT A15: tài liệu dòng 206 viết “giá trị đơn lẻ”); trị riêng của S là λ, và λᵢ = σᵢ²/N; chia N (như bài 13, 15).
# Lời đọc: nói tên Việt “phân rã giá trị kỳ dị”, “phân tích thành phần chính”; chữ tắt SVD/PCA chỉ hiện trên màn hình.
# Nối bài trước (nói lại khi dùng, luật 17): bài 1 (phép chiếu = cái bóng, tích vô hướng với vector độ dài 1), bài 3 (hạng = số hàng
#   khác 0 sau khi khử), bài 4 (bộ vector trực chuẩn), bài 5 (vector riêng, trị riêng), bài 15 (ma trận hiệp phương sai, elip,
#   phương sai dọc trục = trị riêng).
# Dữ liệu: dùng lại lớp 4 bạn của bài 15 — (8; 8), (4; 4), (7; 5), (5; 7), trung bình (6; 6), hiệp phương sai [[2,5; 1,5],[1,5; 2,5]].
objectives:
  - "Hiểu PCA là tìm hướng có “cái bóng” trải rộng nhất"
  - "Chứng minh hướng đó là vector riêng có trị riêng lớn nhất của ma trận hiệp phương sai"
  - "Đọc được A = UΣVᵀ và quan hệ λ = σ²/N giữa SVD và PCA"
  - "Nén dữ liệu từ D xuống K chiều, tính được tỉ lệ phương sai giữ lại và số lượng số cần lưu"
  - "Nhớ bước bắt buộc: trừ trung bình trước khi làm PCA"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lưu 1000 ảnh, mỗi ảnh 784 con số"
    checks:
      - "1000*784 == 784000 and 50*(1000 + 784) == 89200 and round(89200/784000*100, 1) == 11.4"
    steps:
      - show: |
          <p class="big">1000 ảnh chữ số viết tay, mỗi ảnh $28\cdot 28 = 784$ điểm ảnh → <b>784 000</b> con số.</p>
          <div class="box key">Giữ lại 50 “hướng quan trọng nhất”: chỉ cần khoảng <b>89 200</b> con số (11,4%) mà ảnh vẫn nhận ra được.</div>
        focus: [1, 2]
        say: "Chào bạn, hãy hình dung 1000 ảnh chữ số viết tay, mỗi ảnh 784 điểm ảnh, tổng cộng 784 nghìn con số. Nếu chỉ giữ lại 50 hướng quan trọng nhất, ta cần khoảng 89 nghìn 200 con số, tức 11 phẩy 4 phần trăm, mà ảnh vẫn nhận ra được."
      - show: |
          <p class="note">Hôm nay: tìm “hướng quan trọng nhất” bằng cái bóng dài nhất — phân tích thành phần chính (PCA), và công cụ tính nó — phân rã giá trị kỳ dị (SVD).</p>
        say: "Hôm nay ta học cách tìm các hướng quan trọng nhất đó bằng ý tưởng cái bóng dài nhất, gọi là phân tích thành phần chính. Công cụ để tính nó gọi là phân rã giá trị kỳ dị."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: cái bóng, vector riêng và lớp học của bài 15"
    checks:
      - "(lambda u: (Matrix([[8 - 6, 8 - 6]])*u)[0] == 2*sp.sqrt(2) and (u.T*u)[0] == 1)(Matrix([1, 1])/sp.sqrt(2))"
      - "(lambda D, S: sum(x*x for x, y in D)/Rational(4) == Rational(5, 2) and sum(x*y for x, y in D)/Rational(4) == Rational(3, 2) and S*Matrix([1, 1]) == Matrix([4, 4]) and S*Matrix([1, -1]) == Matrix([1, -1]))([(2, 2), (-2, -2), (1, -1), (-1, 1)], Matrix([[Rational(5, 2), Rational(3, 2)], [Rational(3, 2), Rational(5, 2)]]))"
    steps:
      - show: |
          <p>Bài 1: với $\mathbf{u}$ dài 1 ($\lVert\mathbf{u}\rVert = 1$), tích vô hướng $\mathbf{u}^T\mathbf{d}$ là độ dài <b>cái bóng</b> của $\mathbf{d}$ trên đường thẳng theo $\mathbf{u}$.</p>
          <p>Bài 15: lớp 4 bạn (8; 8), (4; 4), (7; 5), (5; 7), trung bình (6; 6), ma trận hiệp phương sai $\begin{bmatrix} 2{,}5 & 1{,}5 \\ 1{,}5 & 2{,}5 \end{bmatrix}$, vector riêng $(1; 1)$ với $\lambda = 4$ và $(1; -1)$ với $\lambda = 1$.</p>
        focus: [1, 2]
        say: "Nhắc lại bài 1, với vector u có độ dài 1, tích vô hướng của u với vector d là độ dài cái bóng của d trên đường thẳng theo u. Và ở bài 15, lớp 4 bạn có trung bình 6 và 6, với vector riêng 1, 1 ứng với trị riêng 4."
      - clear: true
        show: |
          <p>Nhắc lại từ đầu: <b>ma trận hiệp phương sai</b> $\mathbf{S}$ có ô chéo là <b>phương sai</b> từng đặc trưng (trung bình bình phương độ lệch), ô ngoài chéo là <b>hiệp phương sai</b> (trung bình tích hai độ lệch). Độ lệch của 4 bạn: $(2; 2)$, $(-2; -2)$, $(1; -1)$, $(-1; 1)$.</p>
          $$S_{11} = \frac{2^2 + 2^2 + 1^2 + 1^2}{4} = 2{,}5 \qquad S_{12} = \frac{2\cdot 2 + (-2)(-2) + 1\cdot(-1) + (-1)\cdot 1}{4} = 1{,}5$$
          <p><b>Vector riêng</b> là hướng mà ma trận chỉ kéo giãn, không xoay: $\ \mathbf{S}\cdot(1; 1) = (4; 4) = 4\cdot(1; 1)$, nên trị riêng là $\lambda = 4$; tương tự $\mathbf{S}\cdot(1; -1) = 1\cdot(1; -1)$.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Nhắc lại từ đầu, ô trên đường chéo của ma trận hiệp phương sai là phương sai của từng đặc trưng, tức trung bình bình phương độ lệch. Ô ngoài đường chéo là hiệp phương sai, tức trung bình của tích hai độ lệch. Với lớp học, 4 cộng 4 cộng 1 cộng 1 bằng 10, chia 4 được 2 phẩy 5, còn 4 cộng 4 trừ 1 trừ 1 bằng 6, chia 4 được 1 phẩy 5. Vector riêng là hướng mà ma trận chỉ kéo giãn chứ không xoay, ví dụ S nhân 1, 1 bằng 4, 4, tức gấp 4 lần, nên trị riêng bằng 4. Tương tự, hướng 1, âm 1 được giữ nguyên, nên có trị riêng bằng 1."

  # ───────────────────────── 3. CÁI BÓNG DÀI NHẤT ─────────────────────────
  - id: shadow
    kind: intuition
    title: "Chiếu lên hướng nào thì bóng trải rộng nhất?"
