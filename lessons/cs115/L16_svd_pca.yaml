          <tr><td>2</td><td>$N = 9$ mẫu, giá trị kỳ dị lớn nhất $\sigma_1 = 6$. Phương sai dọc trục chính?</td></tr>
          <tr><td>3</td><td>$N = 100$, $D = 10$, giữ $K = 2$. Cần lưu bao nhiêu số (bóng + hướng), so với ban đầu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu trên màn hình. Câu một về tỉ lệ phương sai giữ lại. Câu hai đổi giá trị kỳ dị thành phương sai. Câu ba đếm số con số cần lưu. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p><b>Câu 1.</b> Tổng phương sai $= 6 + 3 + 1 = 10$.</p>
          $$\text{giữ 1: } \frac{6}{10} = \hlg{60\%} \qquad \text{giữ 2: } \frac{6 + 3}{10} = \hlg{90\%} \qquad \text{mất: } \frac{1}{10} = 10\%$$
        focus: [1, 2, 2]
        say: "Đáp án câu một, tổng phương sai bằng tổng các trị riêng, 6 cộng 3 cộng 1 bằng 10. Giữ một thành phần được 6 chia 10, bằng 60 phần trăm, giữ hai thành phần được 9 chia 10, bằng 90 phần trăm. Phần mất đi chỉ còn 1 chia 10, tức 10 phần trăm."
      - clear: true
        show: |
          <p><b>Câu 2.</b> Dùng công thức nối SVD với PCA, $\lambda_i = \frac{\sigma_i^2}{N}$:</p>
          $$\lambda_1 = \frac{6^2}{9} = \frac{36}{9} = \hlg{4} \quad (\text{không phải } 6)$$
        focus: [1, 2, 2]
        say: "Câu hai, dùng công thức nối hai bên, trị riêng bằng giá trị kỳ dị bình phương chia N. Vậy 6 bình phương bằng 36, chia 9 được 4. Đáp án là 4, không phải 6, đúng như lỗi thứ hai đã cảnh báo."
      - show: |
          <p><b>Câu 3.</b> Đếm từng phần:</p>
          <table class="t"><tr><th>phần</th><th>số con số</th></tr>
          <tr><td>ban đầu $N\cdot D$</td><td>$100\cdot 10 = 1000$</td></tr>
          <tr><td>bóng $N\cdot K$</td><td>$100\cdot 2 = 200$</td></tr>
          <tr><td>hướng $D\cdot K$</td><td>$10\cdot 2 = 20$</td></tr>
          <tr><td>sau nén $K\cdot(N + D)$</td><td>$2\cdot 110 = \hlg{220}$, tức 22%</td></tr></table>
        focus: [0, "2.2", ["2.3", "2.4"], "2.5"]
        say: "Câu ba, đếm từng phần. Ban đầu có 100 nhân 10, bằng 1000 số. Sau khi nén, mỗi mẫu còn 2 bóng, tức 200 số, cộng 2 hướng, mỗi hướng 10 số, tức 20 số. Tổng cộng 220 số, đúng bằng 2 nhân 110, chỉ bằng 22 phần trăm ban đầu."

  # ───────────────────────── 13. TỔNG KẾT ─────────────────────────
  - id: recap
