"#2563eb"/><text x="910" y="370" font-size="24" fill="#2563eb">Cường</text><circle cx="1155" cy="285" r="10" fill="#2563eb"/><text x="1071" y="321" font-size="24" fill="#2563eb">Bình</text><circle cx="1045" cy="175" r="10" fill="#2563eb"/><text x="1059" y="161" font-size="24" fill="#2563eb">Dũng</text><line x1="1045.0" y1="175.0" x2="1155.0" y2="285.0" stroke="#ea580c" stroke-width="12" stroke-opacity="0.45"/><circle cx="1100.0" cy="230.0" r="7" fill="#ea580c"/><circle cx="1100.0" cy="230.0" r="7" fill="#ea580c"/><circle cx="1155.0" cy="285.0" r="7" fill="#ea580c"/><circle cx="1045.0" cy="175.0" r="7" fill="#ea580c"/><text x="1100" y="480" font-size="26" text-anchor="middle" fill="#ea580c" font-weight="700">hướng 135°: bóng hẹp, phương sai 1</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này đặt trung bình 6 và 6 ở giữa, rồi thả bóng của bốn bạn xuống hai đường thẳng. Bên trái, đường nghiêng 45 độ, An và Cường nằm sẵn trên đường, còn Bình và Dũng rơi xuống đúng tâm, nên các bóng trải dài từ âm 2 phẩy 83 đến 2 phẩy 83. Bên phải, đường nghiêng 135 độ, chỉ Bình và Dũng nằm trên đường, các bóng chỉ trải từ âm 1 phẩy 41 đến 1 phẩy 41. Dải màu đậm cho thấy bóng bên trái dài gấp đôi, nên giữ bóng bên trái thì mất ít thông tin hơn."
      - show: |
