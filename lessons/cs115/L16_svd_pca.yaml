  # ───────────────────────── 11. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "(lambda Y: (Y.T*Y/4) == Matrix([[Rational(201, 2), 0], [0, 2]]))(Matrix([[10, 2], [10, -2], [11, 0], [9, 0]]))"
      - "(lambda Y: (lambda C: C*Matrix([0, 1]) == 2*Matrix([0, 1]) and C == Matrix([[Rational(1, 2), 0], [0, 2]]))((Y - sp.ones(4, 1)*Matrix([[10, 0]])).T*(Y - sp.ones(4, 1)*Matrix([[10, 0]]))/4))(Matrix([[10, 2], [10, -2], [11, 0], [9, 0]]))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên trừ trung bình <b class="red">(sai)</b>
          <br><span class="note">Dữ liệu (10; 2), (10; −2), (11; 0), (9; 0): trừ trung bình (10; 0) thì trục chính là <b>dọc</b> (phương sai 2 so với 0,5). Không trừ: trục chính thành <b>ngang</b> — chỉ về phía trung bình, sai hẳn.</span></div>
        say: "Lỗi thứ nhất, quên trừ trung bình. Với bốn điểm trên màn hình, trừ trung bình thì trục chính là trục dọc, phương sai 2 so với 0 phẩy 5. Không trừ thì trục chính thành trục ngang, chỉ về phía trung bình, sai hẳn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy giá trị kỳ dị làm phương sai <b class="red">(sai)</b>
          <br><span class="note">Phương sai dọc trục là $\lambda_i = \frac{\sigma_i^2}{N}$: lớp học có $\sigma_2 = 2$ nhưng phương sai dọc trục thứ hai chỉ là $\frac{2^2}{4} = 1$. ($\sigma_1 = 4$ và $\lambda_1 = \frac{16}{4} = 4$ trùng nhau chỉ là tình cờ.)</span></div>
        say: "Lỗi thứ hai, lấy giá trị kỳ dị làm phương sai. Theo công thức nối hai bên, phương sai bằng giá trị kỳ dị bình phương chia N. Với lớp học, giá trị kỳ dị thứ hai là 2, nhưng phương sai chỉ bằng 1."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Các đặc trưng khác đơn vị mà không chuẩn hoá <b class="red">(dễ sai)</b>
          <br><span class="note">Chiều cao tính bằng cm (phương sai hàng chục) cạnh thu nhập tính bằng triệu (phương sai hàng nghìn): thành phần chính bị đặc trưng có số to chiếm hết. Thường chia mỗi cột cho độ lệch chuẩn của nó trước.</span></div>
        say: "Lỗi thứ ba, ghép các đặc trưng khác đơn vị mà không chuẩn hoá. Đặc trưng có con số to sẽ chiếm hết thành phần chính. Vì vậy người ta thường chia mỗi cột cho độ lệch chuẩn của nó trước."

  # ───────────────────────── 12. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
