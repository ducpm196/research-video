      - "(lambda D, f: [round(f(D, t), 3) for t in (0, 45, 90, 135)] == [2.5, 4.0, 2.5, 1.0])([(2, 2), (-2, -2), (1, -1), (-1, 1)], lambda D, t: sum((x*math.cos(math.radians(t)) + y*math.sin(math.radians(t)))**2 for x, y in D)/4)"
      # hình: bóng trên (1; 1)/căn 2 là ±2,83 và 0, 0; trên (1; -1)/căn 2 là 0, 0 và ±1,41 — dải bóng dài gấp đôi
      - "(lambda D: (sorted(round((x + y)/math.sqrt(2), 2) for x, y in D), sorted(round((x - y)/math.sqrt(2), 2) for x, y in D)) == ([-2.83, 0.0, 0.0, 2.83], [-1.41, 0.0, 0.0, 1.41]))([(2, 2), (-2, -2), (1, -1), (-1, 1)])"
      - "(2*2*math.sqrt(2)) / (2*math.sqrt(2)) == 2"
    steps:
      - show: |
          <p>Trừ trung bình: các vector lệch $(2; 2)$, $(-2; -2)$, $(1; -1)$, $(-1; 1)$. Chiếu lên đường thẳng nghiêng góc $\theta$, đo <b>phương sai của các bóng</b>:</p>
          <table class="t"><tr><th>góc nghiêng</th><th>0°</th><th>45°</th><th>90°</th><th>135°</th></tr>
          <tr><td>phương sai của bóng</td><td>2,5</td><td>$\hlg{4}$</td><td>2,5</td><td>1</td></tr></table>
          <div class="box key">Hướng 45° — tức vector $(1; 1)$ — giữ được độ trải lớn nhất. Đó là <b>thành phần chính thứ nhất</b>.</div>
        introduces: [theta]
        focus: [1, 1, 2, 3]
        say: "Trừ trung bình, ta có bốn vector lệch. Chiếu chúng lên một đường thẳng nghiêng góc thê ta, rồi đo phương sai của các cái bóng. Nằm ngang được 2 phẩy 5, nghiêng 45 độ được 4, lớn nhất. Hướng đó gọi là thành phần chính thứ nhất."
      - clear: true
        show: |
