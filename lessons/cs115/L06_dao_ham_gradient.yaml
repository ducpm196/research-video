objectives:
- 'Nói thành lời: f phẩy của x; đạo hàm riêng của f theo x; nabla f (vector gradient)'
- Nói được cách thu đạo hàm của x bình phương từ độ dốc của hai điểm rất gần nhau, và kiểm tra bằng số
- Tính đạo hàm riêng bằng cách giữ các biến khác cố định, rồi ghép thành vector gradient
- Suy ra vì sao gradient chỉ hướng tăng nhanh nhất (bằng cái bóng và Pytago của bài 1), nêu đủ điều kiện
- Tự kiểm tra gradient bằng bước nhỏ; nhận ra 3 lỗi thường gặp
- Đếm được số phép nhân khi kiểm gradient bằng bước nhỏ và khi dùng công thức, và thấy vì sao kiểm bằng bước nhỏ gãy khi có nhiều biến
