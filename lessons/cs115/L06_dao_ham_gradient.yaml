id: L06
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 6 — Đạo hàm, đạo hàm riêng & vector gradient: hướng dốc lên nhất"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "CS115_Toan_cho_Khoa_hoc_May_tinh_Full.tex#L223 (định nghĩa ∇f, “chỉ hướng tăng nhanh nhất”), L266-L270 (ví dụ ∇f của x² + y² − xy + x − y), L117 + L283 (Gradient Descent)"
assumes: [vec, sub, reals, in, transpose, cdot, implies, iff, dots, norm, proj, perp, zero_vec, sqrt]
# Quy ước ký hiệu của bài (lint kiểm, xem tools/registry/symbols.yaml):
#   hàm một biến: f(x); đạo hàm: f′(x) (giới thiệu ở sym_deriv); đạo hàm riêng: ∂f/∂x (sym_partial); gradient: ∇f
#   (sym_grad), là vector CỘT viết ngang có ^T như bài 1; vector đơn vị chỉ hướng: u, ‖u‖ = 1; nhân hai số: ·;
#   số thập phân viết dấu phẩy kiểu Việt (0{,}1, đọc “0 phẩy 1”); khi có số thập phân thì nói “x tăng 0,1”,
#   không viết cặp toạ độ có dấu phẩy thập phân (tránh (1,1, 2)).
#   Tên hàm: f (bài chính), k = 3x + 4y (trực giác), q (bài tự làm); không dùng g (ASR nghe “ghi”, “dê”) và p
#   (lint hiểu p( là xác suất).
# Điểm bổ sung so với nguồn (audit A22, T15a–f): dòng 223 định nghĩa ∇f bằng các đạo hàm riêng nhưng tài liệu
#   KHÔNG định nghĩa đạo hàm / đạo hàm riêng; “chỉ hướng tăng nhanh nhất” cần f khả vi (T15e) và ∇f ≠ 0 (T15d),
#   hướng được so trong các vector đơn vị, tốc độ = ‖∇f‖ (T15b–c), và chỉ đúng TẠI CHỖ (T15f: −∇f không chỉ thẳng
#   về đáy). Dòng 223 viết [ … ]^T, dòng 269 viết ( … , … ) không có ^T: cùng một vector. A7 (dòng 117: “sai số
#   giảm dần về 0”) được sửa ở hook và in_ai: “nhỏ nhất có thể”.
# Phát âm (đối chứng 2026-10-23, scratchpad l05_probe*.py): “nabla” đọc thô ra “náp-la” → lexicon “na-bla”;
#   f đọc “ép”, h đọc “hát” (vi_text.LETTER_HEARD); “f phẩy” đọc đúng (bản “f phải” cho medium nghe khác) nhưng ASR
#   hay chép “phẩy” thành “phải” → hạn chế số câu có “phẩy”. “gradient” → “grê-đi-ần” (grad_probe.py, 6/6 cả hai mô hình);
#   “Jacobian” → “Gia-cô-biên” (jh_probe.py). “Hessian” chưa chọn được cách viết → lời đọc L05 không nhắc tên này (việc của L06).
# ASR 2026-10-23T22:36:36Z: 158 câu, gắn cờ 0. Các câu có “phẩy” (đạo hàm, số thập phân) nằm ở mục tham khảo cho người nghe.
objectives:
  - "Đọc thành lời: f phẩy của x; đạo hàm riêng của f theo x; nabla f (vector gradient)"
  - "Tính đạo hàm của x bình phương từ độ dốc của hai điểm rất gần nhau, và kiểm tra bằng số"
  - "Tính đạo hàm riêng bằng cách giữ các biến khác cố định, rồi ghép thành vector gradient"
  - "Suy ra vì sao gradient chỉ hướng tăng nhanh nhất (bằng cái bóng và Pytago của bài 1), nêu đủ điều kiện"
  - "Tự kiểm tra gradient bằng bước nhỏ; nhận ra 4 lỗi thường gặp"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Xuống núi trong sương mù"
    steps:
      - show: |
          <p class="big">Máy học “tự sửa lỗi” thế nào?</p>
          <p>Mô hình có các <b>trọng số</b>; mỗi bộ trọng số cho một <b>sai số</b>. Huấn luyện = chỉnh trọng số để sai số <b>nhỏ nhất có thể</b>.</p>
          <p class="note">Hay gặp cách nói “sai số giảm dần về 0”. Chính xác hơn: nhỏ nhất có thể — sai số huấn luyện bằng 0 có thể là dấu hiệu học vẹt (quá khớp).</p>
        focus: [1, 2, [2, 3]]
        say: "Chào bạn, máy học tự sửa lỗi thế nào? Mỗi bộ trọng số của mô hình cho ra một sai số. Huấn luyện là chỉnh trọng số để sai số nhỏ nhất có thể, chứ thường không về đúng 0."
      - show: |
          <div class="box key">Hình dung: bạn đứng trên sườn núi trong <b>sương mù</b>, không thấy chân núi. Bạn chỉ cảm nhận được <b>độ dốc ngay dưới chân</b>. Muốn xuống: bước theo hướng <b>dốc xuống nhất</b>, từng bước nhỏ.</div>
        say: "Hình dung bạn đứng trên sườn núi trong sương mù, chỉ cảm nhận được độ dốc ngay dưới chân. Muốn xuống núi, bạn bước theo hướng dốc xuống nhất, từng bước nhỏ."
      - clear: true
        show: |
          <p>Bài hôm nay trả lời 3 câu hỏi:</p>
          <table class="t"><tr><th>câu hỏi</th><th>công cụ</th></tr>
          <tr><td>Độ dốc của một hàm số tại một điểm tính thế nào?</td><td><b>đạo hàm</b></td></tr>
          <tr><td>Hàm có nhiều biến thì dốc theo từng trục ra sao?</td><td><b>đạo hàm riêng</b></td></tr>
          <tr><td>Hướng nào dốc lên nhất, và vì sao?</td><td><b>vector gradient</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Hôm nay mình trả lời ba câu hỏi. Độ dốc của một hàm tại một điểm tính thế nào. Hàm nhiều biến thì dốc theo từng trục ra sao. Và hướng nào dốc lên nhất, vì sao."
      - show: |
          <p class="note">Vì sao AI cần? Thuật toán <b>Gradient Descent</b> (bài 9) chính là “xuống núi trong sương mù”. Bài 8 (tìm điểm thấp nhất, cao nhất của một hàm) và bài 22 (lan truyền ngược — cách tính gradient thật nhanh cho mạng nơ-ron, loại mô hình AI gồm nhiều lớp phép tính) đều xây trên bài này.</p>
        say: "Thuật toán Gradient Descent ở bài 9 chính là chuyện xuống núi này. Bài 8 tìm điểm thấp nhất và cao nhất của một hàm. Bài 22 học cách tính gradient thật nhanh cho mạng nơ-ron, loại mô hình AI gồm nhiều lớp phép tính. Cả hai đều xây trên bài hôm nay."
        forward_ref: true

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: hàm số, độ dốc của đoạn thẳng, phá ngoặc"
    checks:
      - "(lambda x: (x**2).subs(x, 3) == 9 and (x**2).subs(x, 2) == 4)(sp.Symbol('x'))"
      - "Rational(9 - 4, 3 - 2) == 5"
      - "(lambda h: sp.expand((3 + h)**2) == 9 + 6*h + h**2 and (3 + 1)**2 == 9 + 6 + 1)(sp.Symbol('h'))"
      - "Matrix([3,4]).dot(Matrix([1,0])) == 3 and Matrix([3,4]).norm() == 5 and sqrt(9 + 16) == 5"
    steps:
      - show: |
          <p><b>Hàm số</b> = một cái máy: cho vào số $x$, trả ra số $f(x)$.</p>
          <p>Ví dụ: $\ f(x) = x^2$: &nbsp; $f(3) = 9, \quad f(2) = 4$</p>
        focus: [0, 1, 2]
        say: "Trước hết, ôn nhanh vài thứ sẽ dùng. Hàm số giống một cái máy, cho vào số x, trả ra số f của x. Với hàm x bình phương, f của 3 bằng 9, f của 2 bằng 4."
      - show: |
          <p><b>Độ dốc của đoạn thẳng</b> = độ tăng chia độ chạy. Từ điểm $(2, 4)$ đến điểm $(3, 9)$:</p>
          $$\text{độ dốc} = \frac{9 - 4}{3 - 2} = \frac{5}{1} = 5$$
        focus: [1, 2]
        say: "Độ dốc của đoạn thẳng bằng độ tăng chia độ chạy. Từ điểm 2, 4 đến điểm 3, 9, độ cao tăng 5, chạy ngang 1, nên độ dốc bằng 5."
      - show: |
          <p><b>Phá ngoặc</b> (hằng đẳng thức bình phương của tổng), với $h$ là một số:</p>
          $$(3 + h)^2 = 9 + 6h + h^2 \qquad \text{thử } h = 1:\ \ 4^2 = 16 = 9 + 6 + 1\ \checkmark$$
        focus: [[1, 2], 2]
        say: "Phá ngoặc theo hằng đẳng thức, 3 cộng h, tất cả bình phương, bằng 9 cộng 6 h cộng h bình phương. Thử h bằng 1, 16 bằng 9 cộng 6 cộng 1, đúng."
      - clear: true
        show: |
          <p>Từ bài 1: &nbsp; $\mathbf{a} = (3, 4)^T$, &nbsp; $\mathbf{a}^T(1, 0)^T = 3\cdot 1 + 4\cdot 0 = 3$, &nbsp; $\|\mathbf{a}\| = \sqrt{9 + 16} = 5$</p>
          <p class="note">Tích vô hướng: nhân từng cặp rồi cộng. Độ dài: Pytago.</p>
        focus: [2, "1.2", "1.3"]
        say: "Từ bài 1, tích vô hướng là nhân từng cặp rồi cộng. Vector a bằng 3, 4 nhân vô hướng với 1, 0 được 3. Theo Pytago, độ dài của a là căn 25, bằng 5."

  # ───────────────────────── 3. ĐẠO HÀM ─────────────────────────
  - id: sym_deriv
    kind: symbol
    title: "Giải mã: đạo hàm f′(x) — độ dốc tại một điểm"
    checks:
      - "(lambda h: sp.simplify(((3 + h)**2 - 9)/h - (6 + h)) == 0 and sp.expand((3 + h)**2 - 9) == 6*h + h**2)(sp.Symbol('h'))"
      - "((3 + 1)**2 - 9)/1 == 7 and sp.nsimplify(((3 + Rational(1,10))**2 - 9)/Rational(1,10)) == Rational(61,10) and ((3 + Rational(1,100))**2 - 9)/Rational(1,100) == Rational(601,100)"
      - "(lambda h: sp.limit(((3 + h)**2 - 9)/h, h, 0) == 6)(sp.Symbol('h'))"
      - "(lambda x, h: sp.simplify(((x + h)**2 - x**2)/h - (2*x + h)) == 0 and sp.diff(x**2, x) == 2*x and (2*x).subs(x, 3) == 6)(*sp.symbols('x h'))"
    steps:
      - show: |
          <p>Đường cong không thẳng, nên độ dốc thay đổi theo từng chỗ. Ý tưởng: lấy <b>hai điểm rất gần nhau</b>, $x$ và $x + h$ ($h$ là một số nhỏ, khác 0):</p>
          $$\text{độ dốc} \approx \frac{f(x + h) - f(x)}{h}$$
        focus: [1, [1, 2]]
        say: "Đường cong không thẳng, nên độ dốc đổi theo từng chỗ. Ý tưởng là lấy hai điểm rất gần nhau, x và x cộng h, với h nhỏ khác 0, rồi tính độ tăng chia độ chạy h."
      - show: |
          <p>Với $f(x) = x^2$ tại $x = 3$, thay $(3 + h)^2 = 9 + 6h + h^2$:</p>
          $$\frac{(3 + h)^2 - 9}{h} = \frac{6h + h^2}{h} = 6 + h$$
        focus: ["1.3", 2]
        say: "Với x bình phương tại 3, thay phần phá ngoặc vào tử số, còn 6 h cộng h bình phương. Chia cho h, vì h khác 0, ta được 6 cộng h."
      - show: |
          <table class="t"><tr><th>$h$</th><th>$1$</th><th>$0{,}1$</th><th>$0{,}01$</th><th>rất nhỏ</th></tr>
          <tr><td>độ dốc $6 + h$</td><td>$7$</td><td>$6{,}1$</td><td>$6{,}01$</td><td>gần $6$</td></tr></table>
        say: "Bây giờ cho h nhỏ dần, h bằng 1 thì độ dốc là 7, h bằng 0 phẩy 1 thì 6 phẩy 1, h bằng 0 phẩy 01 thì 6 phẩy 01. Độ dốc càng sát con số 6."
      - clear: true
        show: |
          <div class="box key">Con số mà độ dốc tiến sát khi $h$ nhỏ dần về 0 gọi là <b>đạo hàm</b> của $f$ tại $x$, viết $\ f'(x)$. &nbsp; Ở đây: $\ f'(3) = 6$.</div>
          <p class="note">Ở bài 1, dấu phẩy trên chỉ để đặt tên vector khác. Từ bài này, dấu phẩy trên đặt sau <b>tên hàm</b> nghĩa là đạo hàm.</p>
        introduces: [prime]
        focus: ["1.5", "1.6", 2]
        say: "Con số mà độ dốc tiến sát khi h nhỏ dần về 0 gọi là đạo hàm, viết f với dấu phẩy nhỏ phía trên, đọc là f phẩy của x. Ở đây, đạo hàm tại 3 bằng 6. Bài 1 dùng dấu phẩy trên để đặt tên, còn sau tên hàm thì nó là đạo hàm."
      - show: |
          <p>Làm với $x$ bất kỳ: $\ \dfrac{(x + h)^2 - x^2}{h} = \dfrac{2xh + h^2}{h} = 2x + h$, &nbsp; nên $\ \hlg{f'(x) = 2x}$.</p>
          <p class="note">Thử lại: $\ x = 3$ cho $2\cdot 3 = 6\ \checkmark$ — khớp bảng.</p>
        focus: [1, 2]
        say: "Làm y hệt với x bất kỳ, ta được 2 x cộng h, nên đạo hàm của x bình phương là 2 x. Thử lại, 2 nhân 3 bằng 6, khớp với bảng."

  # ───────────────────────── 4. ĐẠO HÀM CHO BIẾT GÌ ─────────────────────────
  - id: meaning_d
    kind: intuition
    title: "Đạo hàm cho biết gì: dốc lên, dốc xuống, và phép xấp xỉ"
    checks:
      - "(lambda x: (2*x).subs(x, 3) == 6 and (2*x).subs(x, -1) == -2 and (2*x).subs(x, 0) == 0)(sp.Symbol('x'))"
      - "Rational(31,10)**2 == Rational(961,100) and 9 + 6*Rational(1,10) == Rational(96,10) and Rational(961,100) - Rational(96,100)*10 == Rational(1,100)"
    steps:
      - show: |
          <div class="row"><div class="col">
          <svg width="520" height="455" viewBox="0 0 480 420">
            <polyline fill="none" stroke="#2563eb" stroke-width="5" points="40,368 53,363 66,357 79,350 92,343 105,336 118,328 131,320 144,312 157,303 170,294 183,285 196,275 209,265 222,254 235,244 248,232 261,221 274,209 287,196 300,183 313,170 326,157 339,143 352,129 365,114 378,99 391,84 404,68 417,52 430,35 443,19"/>
            <line x1="235" y1="244" x2="365" y2="114" stroke="#6b7280" stroke-width="4" stroke-dasharray="12 8"/>
            <line x1="105" y1="355" x2="417" y2="88" stroke="#059669" stroke-width="5"/>
            <circle cx="235" cy="244" r="9" fill="#e11d48"/>
            <circle cx="365" cy="114" r="8" fill="#6b7280"/>
            <text x="250" y="275" font-size="26" fill="#e11d48" font-weight="700">(3, 9)</text>
            <text x="230" y="110" font-size="26" fill="#6b7280" font-weight="700">(4, 16)</text>
            <text x="250" y="345" font-size="26" fill="#059669" font-weight="700">tiếp tuyến: dốc 6</text>
            <text x="60" y="60" font-size="26" fill="#2563eb" font-weight="700">đường cong x²</text>
          </svg></div>
          <div class="col"><p>Nét đứt xám: nối $(3, 9)$ với $(4, 16)$, độ dốc $7$ (bảng, $h = 1$).</p>
          <p>Đường lục: <b>tiếp tuyến</b> tại $(3, 9)$ — chỉ chạm đường cong tại đó, độ dốc $f'(3) = 6$.</p></div></div>
        say: "Trên hình, nét đứt xám nối điểm 3, 9 với điểm 4, 16, có độ dốc 7, ứng với h bằng 1. Đường lục chỉ chạm đường cong tại 3, 9, gọi là tiếp tuyến, có độ dốc bằng đạo hàm, là 6."
      - clear: true
        show: |
          <table class="t"><tr><th>Đạo hàm</th><th>Ví dụ với $f(x) = x^2$, $\ f'(x) = 2x$</th><th>Nghĩa</th></tr>
          <tr><td>dương</td><td>$f'(3) = 6$</td><td>đi sang phải thì $f$ <b>tăng</b></td></tr>
          <tr><td>âm</td><td>$f'(-1) = -2$</td><td>đi sang phải thì $f$ <b>giảm</b></td></tr>
          <tr><td>bằng 0</td><td>$f'(0) = 0$</td><td>chỗ <b>bằng phẳng</b> (ở đây là đáy)</td></tr></table>
        say: "Dấu của đạo hàm cho biết đi lên hay đi xuống. Tại 3, đạo hàm bằng 6, dương, nên f tăng. Tại âm 1, nó bằng âm 2, nên f giảm. Tại 0, nó bằng 0, chỗ bằng phẳng, ở đây là đáy."
      - show: |
          <div class="box ok"><b>Phép xấp xỉ</b> (dùng lại ở phần gradient): với $h$ nhỏ, $\ \dfrac{f(x + h) - f(x)}{h} \approx f'(x)$, nhân hai vế với $h$:
          $$f(x + h) \approx f(x) + f'(x)\cdot h$$</div>
        say: "Theo định nghĩa, khi h nhỏ thì độ tăng chia h xấp xỉ đạo hàm. Nhân hai vế với h, ta được f của x cộng h xấp xỉ f của x cộng đạo hàm nhân h."
      - show: |
          <p>Làm thử: $\ x = 3,\ h = 0{,}1$: &nbsp; thật: $\ 3{,}1^2 = 9{,}61$; &nbsp; xấp xỉ: $\ 9 + 6\cdot 0{,}1 = 9{,}6$ — lệch chỉ $0{,}01$.</p>
        say: "Thử với x bằng 3, h bằng 0 phẩy 1. Giá trị thật là 9 phẩy 61, phép xấp xỉ cho 9 phẩy 6, chỉ lệch 0 phẩy 01."

  # ───────────────────────── 5. QUY TẮC TÍNH NHANH ─────────────────────────
  - id: rules
    kind: concept
    title: "Bảng tính nhanh đạo hàm"
    checks:
      - "(lambda x: sp.diff(7 + 0*x, x) == 0 and sp.diff(x, x) == 1 and sp.diff(x**2, x) == 2*x)(sp.Symbol('x'))"
      - "(lambda x: sp.diff(5*x**2, x) == 10*x and sp.diff(x**2 + 3*x, x) == 2*x + 3)(sp.Symbol('x'))"
      - "(lambda h: (1**2 + 3*1) == 4 and sp.expand(((1 + h)**2 + 3*(1 + h) - 4)/h) == 5 + h and 2*1 + 3 == 5)(sp.Symbol('h'))"
    steps:
      - show: |
          <table class="t"><tr><th>Hàm</th><th>Đạo hàm</th><th>Vì sao</th></tr>
          <tr><td>hằng số, vd $7$</td><td>$0$</td><td>đường nằm ngang, không dốc</td></tr>
          <tr><td>$x$</td><td>$1$</td><td>đường thẳng dốc 1</td></tr>
          <tr><td>$x^2$</td><td>$2x$</td><td>vừa suy ra</td></tr></table>
        say: "Để khỏi tính lại từ đầu, ta dùng bảng tính nhanh. Hằng số có đạo hàm 0, vì đường nằm ngang. Hàm x có đạo hàm 1. x bình phương có đạo hàm 2 x, như vừa suy ra."
      - show: |
          <p><b>Hai quy tắc ghép</b>:</p>
          <p>Nhân với hằng số: $\ (5x^2)' = 5\cdot 2x = 10x$ &nbsp; (cả đường cong cao gấp 5 thì dốc gấp 5)</p>
          <p>Tổng: $\ (x^2 + 3x)' = 2x + 3$ &nbsp; (độ tăng của tổng = tổng các độ tăng)</p>
        focus: [2, 3]
        say: "Có thêm hai quy tắc ghép, thứ nhất, đạo hàm của 5 x bình phương bằng 5 nhân 2 x, vì đường cao gấp 5 thì dốc gấp 5. Và đạo hàm của một tổng bằng tổng các đạo hàm."
      - show: |
          <p>Thử quy tắc tổng tại $x = 1$ (tại đó $x^2 + 3x = 1 + 3 = 4$):</p>
          $$\text{định nghĩa: } \frac{(1 + h)^2 + 3(1 + h) - 4}{h} = 5 + h \ \text{ (gần 5)}, \qquad \text{quy tắc: } 2\cdot 1 + 3 = 5\ \checkmark$$
        focus: [1, 2, 2]
        say: "Thử quy tắc tổng tại x bằng 1. Theo định nghĩa, tỉ số bằng 5 cộng h, tiến sát 5. Theo quy tắc, 2 cộng 3 cũng bằng 5, khớp."

  # ───────────────────────── 6. ĐẠO HÀM RIÊNG ─────────────────────────
  - id: sym_partial
    kind: symbol
    title: "Giải mã: đạo hàm riêng ∂f/∂x — giữ y đứng yên"
    checks:
      - "(lambda x, y: (x**2 + 3*x*y).subs({x: 1, y: 2}) == 7)(*sp.symbols('x y'))"
      - "(lambda x, y: sp.diff(x**2 + 3*x*y, x) == 2*x + 3*y and sp.diff(x**2 + 3*x*y, y) == 3*x)(*sp.symbols('x y'))"
      - "2*1 + 3*2 == 8 and 3*1 == 3"
      - "(lambda h: sp.expand((1 + h)**2 + 3*(1 + h)*2 - 7) == 8*h + h**2)(sp.Symbol('h'))"
    steps:
      - show: |
          <p>Hàm <b>hai biến</b>: cho vào hai số $x, y$, trả ra một số. Ví dụ:</p>
          $$f(x, y) = x^2 + 3xy, \qquad f(1, 2) = 1 + 3\cdot 1\cdot 2 = 7$$
          <p class="note">Hình dung: $f(x, y)$ là <b>độ cao mặt đất</b> tại vị trí $(x, y)$ trên bản đồ.</p>
        focus: [1, 2, 3]
        say: "Giờ sang hàm hai biến, ví dụ f của x, y bằng x bình phương cộng 3 x y. Tại điểm 1, 2, f bằng 1 cộng 6, bằng 7. Hãy hình dung f là độ cao mặt đất tại vị trí x, y."
      - show: |
          <div class="box key"><b>Đạo hàm riêng theo $x$</b>: giữ $y$ đứng yên (coi như một con số), rồi đạo hàm theo $x$ như bình thường.
          $$\frac{\partial f}{\partial x}$$</div>
        introduces: [partial]
        say: "Đạo hàm riêng theo x nghĩa là giữ y đứng yên, coi như một con số, rồi đạo hàm theo x như thường. Ký hiệu dùng chữ d cong, đọc là đạo hàm riêng của hàm f theo x. Nó là độ dốc khi đi dọc trục x."
      - show: |
          <p class="note">Chữ $\partial$ là chữ d viết cong: báo hiệu “còn biến khác đang được giữ đứng yên”.</p>
          <p>Nghĩa trên bản đồ: $\dfrac{\partial f}{\partial x}$ = độ dốc khi đi dọc trục $x$; &nbsp; $\dfrac{\partial f}{\partial y}$ = độ dốc khi đi dọc trục $y$.</p>
        focus: [1, "2.3"]
        say: "Chữ d cong báo hiệu còn biến khác đang được giữ đứng yên. Tương tự, đạo hàm riêng theo y là độ dốc khi đi dọc trục y."
      - clear: true
        show: |
          <p class="note">Đang có: $\ f(x, y) = x^2 + 3xy$</p>
          <p>Theo $x$ ($y$ đứng yên): $\ x^2 \to 2x$; &nbsp; $3xy = (3y)\cdot x \to 3y$ &nbsp; (vì $3y$ là hằng số nhân với $x$)</p>
          $$\frac{\partial f}{\partial x} = 2x + 3y$$
        focus: [2, "2.3", "2.4", 3]
        say: "Theo x, giữ y đứng yên. x bình phương cho 2 x. Còn 3 x y là 3 y nhân với x, mà 3 y là hằng số, nên theo luật nhân hằng số nó cho 3 y. Vậy ta được 2 x cộng 3 y."
      - show: |
          <p>Theo $y$ ($x$ đứng yên): $\ x^2 \to 0$ (hằng số); &nbsp; $3xy = (3x)\cdot y \to 3x$</p>
          $$\frac{\partial f}{\partial y} = 3x$$
        focus: [1, "1.3", ["1.4", 2]]
        say: "Theo y, giữ x đứng yên. x bình phương là hằng số, nên cho 0. Còn 3 x y là 3 x nhân với y, nên cho 3 x."
      - clear: true
        show: |
          <p class="note">Đang có: $\ f(x, y) = x^2 + 3xy, \quad \dfrac{\partial f}{\partial x} = 2x + 3y, \quad \dfrac{\partial f}{\partial y} = 3x$</p>
          <p><b>Làm thử tại $(1, 2)$</b>: $\ \dfrac{\partial f}{\partial x} = 2 + 6 = \hlo{8}, \qquad \dfrac{\partial f}{\partial y} = \hlo{3}$</p>
          <p>Kiểm bằng định nghĩa (giữ $y = 2$): $\ \dfrac{f(1 + h, 2) - f(1, 2)}{h} = \dfrac{8h + h^2}{h} = 8 + h$, gần $8\ \checkmark$</p>
        focus: [2, 3]
        say: "Làm thử tại điểm 1, 2, thay số được 8 và 3. Kiểm bằng định nghĩa, giữ y bằng 2 và cho x tăng h, tỉ số bằng 8 cộng h, tiến sát 8, khớp."
      - show: |
          <p class="note">Ghi chú cách viết: với hàm <b>một</b> biến, sách khác viết $f'(x)$ là $\dfrac{df}{dx}$ (chữ d thẳng) — cùng một nghĩa. Khi có <b>nhiều</b> biến, dùng chữ $\partial$ cong như bài này.</p>
        notation_note: true
        say: "Ghi chú cách viết, với hàm một biến, sách khác viết đạo hàm là d f trên d x, chữ d thẳng, cùng một nghĩa. Có nhiều biến thì dùng chữ d cong."

  # ───────────────────────── 7. GRADIENT ─────────────────────────
  - id: sym_grad
    kind: symbol
    title: "Giải mã: ∇f — gom các đạo hàm riêng thành một vector"
    checks:
      - "(lambda x, y: Matrix([sp.diff(x**2 + 3*x*y, x), sp.diff(x**2 + 3*x*y, y)]).subs({x: 1, y: 2}) == Matrix([8, 3]))(*sp.symbols('x y'))"
    steps:
      - show: |
          <div class="box key"><b>Vector gradient</b>: xếp các đạo hàm riêng thành một vector
          $$\nabla f = \left(\frac{\partial f}{\partial x},\ \frac{\partial f}{\partial y}\right)^T$$</div>
        introduces: [nabla]
        say: "Giờ xếp các đạo hàm riêng thành một vector, ta được vector gradient của f. Ký hiệu là tam giác ngược, đọc là nabla. Thành phần đầu là đạo hàm riêng theo x, thành phần sau theo y."
      - show: |
          <p>Với $\ f(x, y) = x^2 + 3xy$: &nbsp; $\nabla f = (2x + 3y,\ 3x)^T$; &nbsp; tại $(1, 2)$: $\ \nabla f = \hlo{(8, 3)^T}$</p>
          <p class="note">Gradient là một <b>vector</b> (mũi tên trên bản đồ), không phải một con số. Mỗi điểm có một mũi tên riêng.</p>
        focus: ["1.4", 2]
        say: "Với hàm vừa rồi, tại điểm 1, 2, gradient là vector 8, 3. Gradient là một mũi tên trên bản đồ, không phải một con số, và mỗi điểm có một mũi tên riêng."
      - show: |
          <p>Hàm có $D$ biến $\ \mathbf{x} = (x_1, \dots, x_D)^T$ — gradient có $D$ thành phần:</p>
          $$\nabla f(\mathbf{x}) = \left(\frac{\partial f}{\partial x_1}, \dots, \frac{\partial f}{\partial x_D}\right)^T$$
          <p class="note">Sách có chỗ viết ngoặc vuông, có chỗ viết ngoặc tròn không có chữ T: cùng một vector.</p>
        focus: [[1, 2], 3]
        say: "Hàm có bao nhiêu biến thì gradient có bấy nhiêu thành phần. Sách có chỗ viết ngoặc vuông, có chỗ viết ngoặc tròn, nhưng là cùng một vector."

  # ───────────────────────── 8. TRỰC GIÁC: HƯỚNG NÀO DỐC NHẤT ─────────────────────────
  - id: meaning_g
    kind: intuition
    title: "Thử mọi hướng với mặt dốc k = 3x + 4y"
    checks:
      - "(lambda x, y: sp.diff(3*x + 4*y, x) == 3 and sp.diff(3*x + 4*y, y) == 4)(*sp.symbols('x y'))"
      - "(lambda x, y, a, b: sp.expand((3*(x + a) + 4*(y + b)) - (3*x + 4*y)) == 3*a + 4*b)(*sp.symbols('x y a b'))"
      - "all(Matrix(v).norm() == 1 for v in [[1,0],[0,1],[Rational(3,5),Rational(4,5)],[-Rational(3,5),-Rational(4,5)],[Rational(4,5),-Rational(3,5)]])"
      - "[Matrix([3,4]).dot(Matrix(v)) for v in [[1,0],[0,1],[Rational(3,5),Rational(4,5)],[-Rational(3,5),-Rational(4,5)],[Rational(4,5),-Rational(3,5)]]] == [3, 4, 5, -5, 0]"
      - "Rational(9,5) + Rational(16,5) == 5 and Rational(12,5) - Rational(12,5) == 0 and Matrix([3,4])/Matrix([3,4]).norm() == Matrix([Rational(3,5),Rational(4,5)])"
    steps:
      - show: |
          <p>Mặt dốc phẳng: $\ k(x, y) = 3x + 4y$, &nbsp; $\dfrac{\partial k}{\partial x} = 3, \ \dfrac{\partial k}{\partial y} = 4$, &nbsp; nên $\ \nabla k = (3, 4)^T$ ở mọi điểm.</p>
          <p>Đi <b>1 đơn vị</b> theo hướng $\ \mathbf{u} = (u_1, u_2)^T$, $\ \|\mathbf{u}\| = 1$: &nbsp; $k$ tăng thêm $\ 3u_1 + 4u_2 = (\nabla k)^T\mathbf{u}$</p>
        focus: [1, 2]
        say: "Để thấy gradient chỉ đi đâu, xét mặt dốc phẳng k bằng 3 x cộng 4 y, gradient là 3, 4 ở mọi điểm. Đi 1 đơn vị theo hướng u dài 1, thay vào rồi phá ngoặc, k tăng 3 u một cộng 4 u hai, chính là tích vô hướng của gradient với u."
      - clear: true
        show: |
          <div class="row"><div class="col">
          <svg width="520" height="455" viewBox="0 0 480 420">
            <defs>
              <marker id="gK" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#6b7280"/></marker>
              <marker id="gG" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#059669"/></marker>
              <marker id="gR" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#e11d48"/></marker>
              <marker id="gB" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#2563eb"/></marker>
            </defs>
            <line x1="48" y1="86" x2="432" y2="374" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/>
            <line x1="240" y1="230" x2="390" y2="230" stroke="#6b7280" stroke-width="5" marker-end="url(#gK)"/>
            <line x1="240" y1="230" x2="240" y2="80" stroke="#6b7280" stroke-width="5" marker-end="url(#gK)"/>
            <line x1="240" y1="230" x2="330" y2="110" stroke="#059669" stroke-width="7" marker-end="url(#gG)"/>
            <line x1="240" y1="230" x2="150" y2="350" stroke="#e11d48" stroke-width="5" marker-end="url(#gR)"/>
            <line x1="240" y1="230" x2="360" y2="320" stroke="#2563eb" stroke-width="5" marker-end="url(#gB)"/>
            <text x="398" y="222" font-size="28" fill="#6b7280" font-weight="700">+3</text>
            <text x="200" y="70" font-size="28" fill="#6b7280" font-weight="700">+4</text>
            <text x="340" y="104" font-size="30" fill="#059669" font-weight="700">+5</text>
            <text x="100" y="385" font-size="30" fill="#e11d48" font-weight="700">−5</text>
            <text x="372" y="312" font-size="30" fill="#2563eb" font-weight="700">0</text>
          </svg></div>
          <div class="col"><p class="note">$k = 3x + 4y$, $\ \nabla k = (3, 4)^T$. Năm hướng, mỗi hướng dài 1:</p>
          <table class="t"><tr><th>$\mathbf{u}$</th><th>$k$ tăng</th></tr>
          <tr><td>$(1, 0)^T$</td><td>$3$</td></tr>
          <tr><td>$(0, 1)^T$</td><td>$4$</td></tr>
          <tr><td>$\left(\dfrac{3}{5}, \dfrac{4}{5}\right)^T$</td><td>$\dfrac{9}{5} + \dfrac{16}{5} = \hlg{5}$</td></tr>
          <tr><td>$\left(-\dfrac{3}{5}, -\dfrac{4}{5}\right)^T$</td><td>$\hl{-5}$</td></tr>
          <tr><td>$\left(\dfrac{4}{5}, -\dfrac{3}{5}\right)^T$</td><td>$\dfrac{12}{5} - \dfrac{12}{5} = \hlb{0}$</td></tr></table></div></div>
        say: "Thử năm hướng dài 1. Dọc trục x, k tăng 3. Dọc trục y, tăng 4. Theo hướng 3 phần 5, 4 phần 5, tăng 5, nhiều nhất. Hướng ngược lại giảm 5. Hướng 4 phần 5, âm 3 phần 5 thì không đổi."
      - clear: true
        show: |
          <p class="note">Đang có: $\ k = 3x + 4y$, $\ \nabla k = (3, 4)^T$, $\ \|\nabla k\| = \sqrt{9 + 16} = 5$. Bảng: tăng nhiều nhất $5$ theo $\left(\dfrac{3}{5}, \dfrac{4}{5}\right)^T$, giảm $5$ theo hướng ngược lại, không đổi theo $\left(\dfrac{4}{5}, -\dfrac{3}{5}\right)^T$.</p>
          <div class="box key">Mũi tên lục $\left(\dfrac{3}{5}, \dfrac{4}{5}\right)^T = \dfrac{\nabla k}{\|\nabla k\|}$ <b>cùng hướng gradient</b> và cho mức tăng lớn nhất $\ 5 = \|\nabla k\|$. Ngược hướng: giảm nhanh nhất. Vuông góc với gradient: không đổi.</div>
        focus: [2, 1]
        say: "Hướng tăng nhiều nhất chính là gradient chia cho độ dài 5 của nó, tức cùng hướng gradient, và mức tăng lớn nhất bằng độ dài đó. Ngược lại thì giảm nhanh nhất, còn đi vuông góc thì độ cao không đổi."

  # ───────────────────────── 9. SUY RA ─────────────────────────
  - id: derive
    kind: formula
    title: "Vì sao luôn là hướng gradient? Cái bóng của bài 1"
    checks:
      - "(lambda h, u1, u2, fx, fy: sp.expand(fx*h*u1 + fy*h*u2 - h*(Matrix([fx, fy]).T*Matrix([u1, u2]))[0]) == 0)(*sp.symbols('h u1 u2 fx fy'))"
      - "Rational(11,10)**2 + 3*Rational(11,10)*2 == Rational(781,100) and Rational(781,100) - 7 == Rational(81,100) and Rational(1,10)*8 == Rational(8,10)"
      - "(lambda g: all(Matrix(u).norm() == 1 and g.norm()**2 == (g.dot(Matrix(u)))**2 + (g - g.dot(Matrix(u))*Matrix(u)).norm()**2 and (g - g.dot(Matrix(u))*Matrix(u)).dot(Matrix(u)) == 0 for u in [[1,0],[0,1],[Rational(3,5),Rational(4,5)],[Rational(4,5),-Rational(3,5)]]))(Matrix([8,3]))"
      - "max(Matrix([8,3]).dot(Matrix([sp.cos(Rational(k,100)), sp.sin(Rational(k,100))])).evalf() for k in range(0, 629)) <= Matrix([8,3]).norm().evalf() + 1e-12"
      - "Matrix([3,4]).norm() == 5"
    steps:
      - show: |
          <p><b>Bước 1.</b> Từ điểm $(x, y)$ đi một bước nhỏ $h$ theo hướng $\mathbf{u}$ ($\|\mathbf{u}\| = 1$): $x$ tăng $h u_1$, $y$ tăng $h u_2$. Theo phép xấp xỉ $f(x + h) \approx f(x) + f'(x)\cdot h$, áp cho từng biến:</p>
          $$f \text{ thay đổi} \approx \frac{\partial f}{\partial x}\cdot h u_1 + \frac{\partial f}{\partial y}\cdot h u_2 = h\,(\nabla f)^T\mathbf{u}$$
        focus: [0, 1, 2]
        say: "Giờ suy ra lý do cho hàm bất kỳ. Bước một, đi bước nhỏ h theo hướng u, thì x tăng h u một, y tăng h u hai. Theo phép xấp xỉ, áp cho từng biến, f thay đổi xấp xỉ h nhân tích vô hướng của gradient với u."
      - show: |
          <p><b>Làm thử ngay</b>: $\ f = x^2 + 3xy$ tại $(1, 2)$, $\ \nabla f = (8, 3)^T$; cho $x$ tăng $0{,}1$, giữ $y = 2$ (tức $\mathbf{u} = (1, 0)^T$):</p>
          <p>thật: $\ 1{,}1^2 + 3\cdot 1{,}1\cdot 2 - 7 = 1{,}21 + 6{,}6 - 7 = 0{,}81$; &nbsp; dự đoán: $\ 0{,}1\cdot 8 = 0{,}8\ \checkmark$</p>
        focus: [1, "2.1", "2.2"]
        say: "Thử với hàm vừa rồi tại điểm 1, 2, gradient là 8, 3. Cho x tăng 0 phẩy 1, f tăng thật 0 phẩy 81. Theo phép xấp xỉ, dự đoán là 0 phẩy 1 nhân 8, bằng 0 phẩy 8, rất gần."
      - clear: true
        show: |
          <p class="note">Đang có: với bước nhỏ $h$, $\ f$ thay đổi $\approx h\,(\nabla f)^T\mathbf{u}$. Cần: chọn $\mathbf{u}$ (dài 1) để $\ (\nabla f)^T\mathbf{u}$ lớn nhất.</p>
          <p><b>Bước 2.</b> Theo bài 1, vì $\mathbf{u}^T\mathbf{u} = 1$, cái bóng của $\nabla f$ lên $\mathbf{u}$ là $\ \proj_{\mathbf{u}}\nabla f = \big((\nabla f)^T\mathbf{u}\big)\,\mathbf{u}$, có độ dài bình phương $\ \big((\nabla f)^T\mathbf{u}\big)^2$. Phần còn lại $\mathbf{z}$ vuông góc với $\mathbf{u}$.</p>
        focus: [1, "2.5", "2.7"]
        say: "Cần chọn u để tích vô hướng đó lớn nhất. Bước hai, theo bài 1, vì u chuyển vị nhân u bằng 1, nên bóng của gradient lên u là tích vô hướng đó nhân u. Phần còn lại, z, vuông góc với u."
      - show: |
          <p><b>Bước 3.</b> Theo Pytago (phép thử 2 của bài 1): $\ \|\nabla f\|^2 = \big((\nabla f)^T\mathbf{u}\big)^2 + \|\mathbf{z}\|^2 \ \ge\ \big((\nabla f)^T\mathbf{u}\big)^2$</p>
          $$\implies (\nabla f)^T\mathbf{u} \le \|\nabla f\|, \quad \text{bằng nhau khi } \mathbf{z} = \mathbf{0}\text{, tức } \mathbf{u} \text{ cùng hướng } \nabla f$$
        focus: [1, 2, 2]
        say: "Bước ba, theo Pytago, độ dài bình phương của gradient bằng bình phương cái bóng cộng z bình phương. Vì z bình phương không âm, nên bóng không dài hơn gradient. Dấu bằng chỉ khi z bằng không, tức u cùng hướng với gradient."
      - clear: true
        show: |
          <div class="box key"><b>Kết luận</b> (tại một điểm, $\nabla f \neq \mathbf{0}$):
          <ul><li>Hướng tăng nhanh nhất: $\ \mathbf{u} = \dfrac{\nabla f}{\|\nabla f\|}$, &nbsp; tốc độ tăng $= \|\nabla f\|$</li>
          <li>Hướng giảm nhanh nhất: $\ -\nabla f$</li>
          <li>Hướng vuông góc với $\nabla f$: $f$ gần như không đổi</li></ul></div>
          <p class="note">Khớp mặt dốc $k$: $\ \|(3, 4)^T\| = 5$ = mức tăng lớn nhất trong bảng $\checkmark$</p>
        focus: [1, 2]
        say: "Theo bước ba, tại điểm có gradient khác 0, hướng tăng nhanh nhất là gradient chia độ dài của nó, tốc độ tăng bằng độ dài gradient, còn ngược gradient là giảm nhanh nhất. Điều này khớp với bảng lúc nãy, nơi mức tăng lớn nhất là 5."
      - clear: true
        show: |
          <div class="box warn"><b>Điều kiện</b> (hay bị bỏ qua):
          <ol><li>$f$ phải <b>trơn</b> (khả vi) tại điểm đó — Bước 1 cần phép xấp xỉ.</li>
          <li>$\nabla f \neq \mathbf{0}$. Nếu $\nabla f = \mathbf{0}$ thì mọi hướng có tốc độ 0: không có hướng nào “dốc nhất” — chỗ bằng phẳng theo mọi hướng như vậy gọi là <b>điểm dừng</b>.</li>
          <li>Chỉ đúng <b>tại chỗ</b>: đi xa, gradient đổi.</li></ol></div>
        say: "Kết luận này cần ba điều kiện, hay bị bỏ qua. Một, hàm phải trơn, vì bước một cần phép xấp xỉ. Hai, gradient khác không, nếu bằng không thì mọi hướng đều phẳng, đó là điểm dừng. Ba, chỉ đúng tại chỗ."

  # ───────────────────────── 10. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ví dụ chính: f = x² + y² − xy + x − y"
    checks:
      - "(lambda x, y: sp.diff(x**2 + y**2 - x*y + x - y, x) == 2*x - y + 1 and sp.diff(x**2 + y**2 - x*y + x - y, y) == 2*y - x - 1)(*sp.symbols('x y'))"
      - "Matrix([2*0 - 0 + 1, 2*0 - 0 - 1]) == Matrix([1, -1]) and Matrix([1,-1]).norm() == sqrt(2)"
      - "(lambda x, y: (2*x - y + 1).subs({x: -Rational(1,3), y: Rational(1,3)}) == 0 and (2*y - x - 1).subs({x: -Rational(1,3), y: Rational(1,3)}) == 0)(*sp.symbols('x y'))"
      - "2*(-Rational(1,3)) - Rational(1,3) + 1 == 0 and 2*Rational(1,3) + Rational(1,3) - 1 == 0"
    steps:
      - show: |
          <p>Đề: $\ f(x, y) = x^2 + y^2 - xy + x - y$. Tìm $\nabla f$, rồi xét tại $(0, 0)$.</p>
          <p><b>①</b> Theo $x$, giữ $y$ đứng yên: &nbsp; $x^2 \to 2x$, &nbsp; $y^2 \to 0$, &nbsp; $-xy = (-y)\cdot x \to -y$, &nbsp; $x \to 1$, &nbsp; $-y \to 0$</p>
          $$\frac{\partial f}{\partial x} = 2x - y + 1$$
        focus: [1, 2, 2]
        say: "Giờ làm ví dụ chính của bài, f bằng x bình phương cộng y bình phương trừ x y cộng x trừ y. Bước một, theo x, giữ y đứng yên. Theo bảng, x bình phương cho 2 x, y bình phương cho 0, trừ x y cho âm y, x cho 1, trừ y cho 0."
      - show: |
          <p><b>②</b> Theo $y$, giữ $x$ đứng yên: &nbsp; $0 + 2y - x + 0 - 1$, &nbsp; nên $\ \dfrac{\partial f}{\partial y} = 2y - x - 1$</p>
          <div class="box ok">$$\nabla f = (2x - y + 1,\ 2y - x - 1)^T$$</div>
        focus: [1, 2]
        say: "Bước hai, theo y, làm tương tự, ta được 2 y trừ x trừ 1. Ghép hai kết quả lại, ta được gradient như trên bảng."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \nabla f = (2x - y + 1,\ 2y - x - 1)^T$</p>
          <p><b>③</b> Tại $(0, 0)$: thay $x = y = 0$, $\ \nabla f = \hlo{(1, -1)^T}$, &nbsp; $\|\nabla f\| = \sqrt{1 + 1} = \sqrt{2}$</p>
          <p>Tăng nhanh nhất: theo $\ \dfrac{(1, -1)^T}{\sqrt{2}}$, tốc độ $\sqrt{2}$. &nbsp; Giảm nhanh nhất: theo $\ \hlg{-\nabla f = (-1, 1)^T}$.</p>
        focus: [2, 3]
        say: "Bước ba, tại điểm 0, 0, thay số, gradient là 1, âm 1, dài căn 2. Vậy f tăng nhanh nhất theo hướng 1, âm 1, tốc độ căn 2, và giảm nhanh nhất theo hướng âm 1, 1."
      - show: |
          <p><b>④</b> Tại $\left(-\dfrac{1}{3}, \dfrac{1}{3}\right)$: $\ 2\cdot\left(-\dfrac{1}{3}\right) - \dfrac{1}{3} + 1 = 0, \quad 2\cdot\dfrac{1}{3} + \dfrac{1}{3} - 1 = 0$, &nbsp; nên $\ \nabla f = \mathbf{0}$</p>
          <p class="note">Gradient bằng vector không: <b>điểm dừng</b>, không có hướng dốc nhất. Gradient bằng 0 mới chỉ nói chỗ này <b>bằng phẳng</b>; nó là đáy hay đỉnh thì phải xét thêm.</p>
        focus: [1, 2, 2]
        say: "Bước bốn, tại điểm âm một phần ba, một phần ba, thay số, cả hai thành phần bằng 0. Đây là điểm dừng, không có hướng dốc nhất. Gradient bằng 0 mới chỉ nói chỗ này bằng phẳng, còn nó là đáy hay đỉnh thì phải xét thêm."

  # ───────────────────────── 11. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: bước nhỏ, và đi ngược gradient phải giảm"
    checks:
      - "(lambda x, y: (x**2 + y**2 - x*y + x - y).subs({x: 0, y: 0}) == 0)(*sp.symbols('x y'))"
      - "(lambda F: F(Rational(1,10), 0) == Rational(11,100) and F(0, Rational(1,10)) == -Rational(9,100))(lambda x, y: x**2 + y**2 - x*y + x - y)"
      - "Rational(1,10)*1 == Rational(10,100) and Rational(1,10)*(-1) == -Rational(10,100)"
      - "(lambda F: F(-Rational(1,10), Rational(1,10)) == -Rational(17,100) and F(Rational(1,10), -Rational(1,10)) == Rational(23,100))(lambda x, y: x**2 + y**2 - x*y + x - y)"
      - "Rational(1,100) + Rational(1,100) + Rational(1,100) - Rational(1,10) - Rational(1,10) == -Rational(17,100) and Rational(3,100) + Rational(2,10) == Rational(23,100)"
    steps:
      - show: |
          <p class="note">Đang có: $\ f(x, y) = x^2 + y^2 - xy + x - y$, &nbsp; $f(0, 0) = 0$, &nbsp; $\nabla f(0, 0) = (1, -1)^T$</p>
          <p><b>Phép thử 1 — bước nhỏ theo trục</b> ($h = 0{,}1$, dự đoán $\approx h\cdot$ đạo hàm riêng):</p>
          <table class="t"><tr><th>bước nhỏ</th><th>$f$ thật</th><th>dự đoán</th></tr>
          <tr><td>$x$ tăng $0{,}1$</td><td>$0{,}01 + 0{,}1 = 0{,}11$</td><td>$0{,}1\cdot 1 = 0{,}1\ \checkmark$</td></tr>
          <tr><td>$y$ tăng $0{,}1$</td><td>$0{,}01 - 0{,}1 = -0{,}09$</td><td>$0{,}1\cdot(-1) = -0{,}1\ \checkmark$</td></tr></table>
        focus: [1, 2, "3.2", "3.3"]
        say: "Tự kiểm tra như mọi bài. Phép thử một, đi bước 0 phẩy 1 theo từng trục rồi so với dự đoán. Cho x tăng, f thành 0 phẩy 11, dự đoán 0 phẩy 1. Cho y tăng, f thành âm 0 phẩy 09, dự đoán âm 0 phẩy 1, đều rất sát."
      - show: |
          <p class="note">Lệch nhỏ cỡ $h^2 = 0{,}01$ là bình thường (phép xấp xỉ). Nếu lệch cả dấu hay gấp đôi → gradient tính sai.</p>
        say: "Lệch cỡ 0 phẩy 01 là bình thường, vì đây là phép xấp xỉ. Nếu sai cả dấu hoặc lệch gấp đôi, thì gradient đã tính sai."
      - clear: true
        show: |
          <p class="note">Đang có: $\ f(x, y) = x^2 + y^2 - xy + x - y$, &nbsp; $f(0, 0) = 0$, &nbsp; $-\nabla f(0, 0) = (-1, 1)^T$</p>
          <p><b>Phép thử 2 — đi ngược gradient thì $f$ phải giảm</b>: $x$ giảm $0{,}1$, $y$ tăng $0{,}1$:</p>
          <p>$f = 0{,}01 + 0{,}01 + 0{,}01 - 0{,}1 - 0{,}1 = \hlg{-0{,}17} < 0\ \checkmark$</p>
          <p>Còn đi <b>theo</b> gradient ($x$ tăng, $y$ giảm $0{,}1$): $\ f = 0{,}03 + 0{,}2 = \hl{0{,}23} > 0$ — tăng.</p>
        focus: [2, [2, 3], 4]
        say: "Phép thử hai, đi ngược gradient thì f phải giảm. Cho x giảm 0 phẩy 1, y tăng 0 phẩy 1, f bằng âm 0 phẩy 17, đạt. Còn đi theo gradient thì f tăng lên 0 phẩy 23."

  # ───────────────────────── 12. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Gradient sẽ dùng ở đâu trong khoá học"
    steps:
      - show: |
          <div class="box key"><b>Gradient Descent</b> (bài 9): lặp lại
          <br>điểm mới $=$ điểm cũ $-$ (bước nhỏ) $\cdot\ \nabla(\text{sai số})$</div>
          <p class="note">Đi ngược gradient từng bước nhỏ, vì kết luận chỉ đúng tại chỗ. Mục tiêu: sai số nhỏ nhất có thể, không phải về 0.</p>
        focus: [1, 2]
        say: "Thuật toán Gradient Descent ở bài 9 lặp lại một việc, điểm mới bằng điểm cũ trừ một bước nhỏ nhân gradient của sai số. Phải đi từng bước nhỏ, vì kết luận chỉ đúng tại chỗ."
        forward_ref: true
      - show: |
          <table class="t"><tr><th>bài</th><th>dùng đạo hàm riêng thế nào</th></tr>
          <tr><td><b>Bài 7</b></td><td>hàm có nhiều đầu ra thì xếp các đạo hàm riêng thành một bảng (ma trận Jacobian); lấy đạo hàm thêm lần nữa để đo độ cong (ma trận Hessian)</td></tr>
          <tr><td><b>Bài 8</b></td><td>tìm các điểm dừng ($\nabla f = \mathbf{0}$), rồi dùng trị riêng (hệ số kéo giãn của bài 5) để biết đó là đáy hay đỉnh</td></tr>
          <tr><td><b>Bài 22</b></td><td>lan truyền ngược — cách tính gradient thật nhanh cho mạng nơ-ron (mô hình AI gồm nhiều lớp phép tính)</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Ở bài 7, hàm có nhiều đầu ra thì xếp các đạo hàm riêng thành một bảng, gọi là ma trận Jacobian, và đo độ cong bằng ma trận Hessian. Ở bài 8, ta tìm các điểm có gradient bằng không, rồi dùng trị riêng, hệ số kéo giãn của bài 5, để biết đó là đáy hay đỉnh. Ở bài 22, cách tính gradient thật nhanh cho mạng nơ-ron gọi là lan truyền ngược."
        forward_ref: true

  # ───────────────────────── 13. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda x, y: sp.diff(x**2 + y**2, x) == 2*x and sp.diff(x**2 + y**2, x) != 2*x + 2*y)(*sp.symbols('x y'))"
      - "Rational(11,10)**2 + 1 == Rational(221,100) and Rational(221,100) - 2 == Rational(21,100) and Rational(1,10)*2 == Rational(2,10) and Rational(1,10)*(2 + 2) == Rational(4,10)"
      - "(lambda x, y: sp.expand((2*x - y + 1) + (2*y - x - 1)) == x + y)(*sp.symbols('x y'))"
      - "(lambda F: F(Rational(1,10), -Rational(1,10)) == Rational(23,100) and F(-Rational(1,10), Rational(1,10)) == -Rational(17,100))(lambda x, y: x**2 + y**2 - x*y + x - y)"
      - "(lambda x, y: Matrix([sp.diff(x**2 + 4*y**2, x), sp.diff(x**2 + 4*y**2, y)]).subs({x: 2, y: 1}) == Matrix([4, 8]))(*sp.symbols('x y')) and Matrix([[-4, -2], [-8, -1]]).det() != 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> $\ \dfrac{\partial}{\partial x}\left(x^2 + y^2\right) = 2x + 2y$ <b class="red">(sai)</b> — đúng là $2x$
          <br><span class="note">Giữ $y$ đứng yên thì $y^2$ là hằng số, đạo hàm bằng 0. Phép thử bước nhỏ bắt được — tại $(1, 1)$, cho $x$ tăng $0{,}1$:</span>
          $$1{,}1^2 + 1^2 - 2 = 0{,}21 \approx 0{,}1\cdot 2 \quad \text{(đúng } 2x = 2\text{)}, \qquad \text{không gần } 0{,}1\cdot 4$$</div>
        say: "Lỗi thứ nhất, đạo hàm riêng theo x của x bình phương cộng y bình phương ra 2 x cộng 2 y. Sai, vì giữ y đứng yên thì y bình phương là hằng số. Phép thử bước nhỏ tại 1, 1 cho mức tăng 0 phẩy 21, khớp 2, không khớp 4."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cộng các đạo hàm riêng thành một số: “gradient $= (2x - y + 1) + (2y - x - 1) = x + y$” <b class="red">(sai)</b>
          <br><span class="note">Gradient là <b>vector</b>: mỗi thành phần đứng riêng một chỗ. Một con số không chỉ được hướng.</span></div>
        say: "Lỗi thứ hai, cộng hai đạo hàm riêng thành một số. Sai, vì gradient là vector, mỗi thành phần đứng riêng một chỗ, và một con số không chỉ được hướng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Muốn giảm sai số mà đi <b>theo</b> $\nabla f$ <b class="red">(sai)</b>
          <br><span class="note">Với $f = x^2 + y^2 - xy + x - y$ của ví dụ, từ $(0, 0)$ đi theo gradient: $f$ tăng lên $0{,}23$. Phải đi theo $-\nabla f$: $f$ giảm còn $-0{,}17$. Phép thử 2 bắt được.</span></div>
        say: "Lỗi thứ ba, muốn giảm sai số mà đi theo gradient. Với ví dụ, đi theo gradient làm f tăng lên 0 phẩy 23, còn đi ngược mới giảm. Phép thử hai bắt được lỗi này."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tưởng $-\nabla f$ chỉ <b>thẳng vào</b> điểm thấp nhất <b class="red">(hiểu sai)</b>
          <br><span class="note">Hàm $x^2 + 4y^2$ thấp nhất tại $(0, 0)$. Tại $(2, 1)$: $\ \nabla(x^2 + 4y^2) = (2x, 8y)^T = (4, 8)^T$, ngược lại là $(-4, -8)^T$, còn hướng về đáy là $(-2, -1)^T$ — <b>không</b> cùng hướng. Gradient chỉ là hướng dốc nhất <b>tại chỗ</b>, nên phải đi từng bước nhỏ rồi tính lại.</span></div>
        say: "Lỗi thứ tư, tưởng ngược gradient chỉ thẳng vào đáy. Với hàm x bình phương cộng 4 y bình phương, tại điểm 2, 1, ngược gradient là âm 4, âm 8, còn hướng về đáy là âm 2, âm 1, không cùng hướng. Nên phải đi từng bước nhỏ."

  # ───────────────────────── 14. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: q = x² + y² tại (3, 4)"
    checks:
      - "(lambda x, y: Matrix([sp.diff(x**2 + y**2, x), sp.diff(x**2 + y**2, y)]).subs({x: 3, y: 4}) == Matrix([6, 8]))(*sp.symbols('x y'))"
      - "Matrix([6,8]).norm() == 10 and sqrt(36 + 64) == 10 and Matrix([6,8])/10 == Matrix([Rational(3,5), Rational(4,5)])"
      - "Matrix([0,0]) - Matrix([3,4]) == Matrix([-3,-4]) and Matrix([-6,-8]) == 2*Matrix([-3,-4])"
    steps:
      - show: |
          <p class="big">$q(x, y) = x^2 + y^2$, &nbsp; tại điểm $(3, 4)$</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $\nabla q$.</td></tr>
          <tr><td>2</td><td>Hướng tăng nhanh nhất và tốc độ tăng?</td></tr>
          <tr><td>3</td><td>Đi hướng nào để $q$ giảm nhanh nhất? Hướng đó có chỉ thẳng về đáy $(0, 0)$ không?</td></tr></table>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, cho q bằng x bình phương cộng y bình phương, tại điểm 3, 4. Hãy tính gradient, hướng và tốc độ tăng nhanh nhất, và xem hướng giảm nhanh nhất có chỉ thẳng về đáy không. Bạn hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① $\ \dfrac{\partial q}{\partial x} = 2x = 6, \quad \dfrac{\partial q}{\partial y} = 2y = 8$, &nbsp; nên $\ \hlo{\nabla q = (6, 8)^T}$</p>
          <p>② $\ \|\nabla q\| = \sqrt{36 + 64} = 10$: tăng nhanh nhất theo $\ \dfrac{(6, 8)^T}{10} = \left(\dfrac{3}{5}, \dfrac{4}{5}\right)^T$, tốc độ $\hlg{10}$</p>
        focus: [1, 2]
        say: "Đáp án, đạo hàm riêng là 2 x bằng 6, và 2 y bằng 8, nên gradient là 6, 8, dài căn của 36 cộng 64, bằng 10. Vậy q tăng nhanh nhất theo hướng 3 phần 5, 4 phần 5, tốc độ 10."
      - clear: true
        show: |
          <p>③ Giảm nhanh nhất: $\ -\nabla q = (-6, -8)^T = 2\,(-3, -4)^T$; hướng về đáy: $\ (0, 0) - (3, 4) = (-3, -4)^T$ — <b>cùng hướng</b>.</p>
          <p class="note">Ở đây trùng vì các đường đồng mức là đường tròn; với $x^2 + 4y^2$ (lỗi 4) thì không trùng.</p>
        focus: [1, 2, 0]
        say: "Hướng giảm nhanh nhất là âm 6, âm 8, bằng 2 lần âm 3, âm 4, đúng hướng về đáy. Ở đây trùng vì hàm tròn đều, còn với hàm của lỗi thứ tư thì không. Nếu bạn ra đúng, chúc mừng bạn."

  # ───────────────────────── 15. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">độ dốc = tăng / chạy</span><span class="a">→</span>
          <span class="n">$h$ nhỏ dần: $f'(x)$</span><span class="a">→</span>
          <span class="n">giữ biến khác: $\dfrac{\partial f}{\partial x}$</span><span class="a">→</span>
          <span class="n">gom lại: $\nabla f$</span><span class="a">→</span>
          <span class="n">bóng + Pytago: $(\nabla f)^T\mathbf{u} \le \|\nabla f\|$</span><span class="a">→</span>
          <span class="n">tăng nhanh nhất theo $\nabla f$, giảm theo $-\nabla f$</span></div>
        say: "Tổng kết chuỗi logic. Độ dốc là độ tăng chia độ chạy. Cho h nhỏ dần được đạo hàm. Giữ các biến khác đứng yên được đạo hàm riêng. Gom lại được gradient, và nhờ cái bóng với Pytago, nó chỉ hướng tăng nhanh nhất."
      - show: |
          <div class="box key"><b>Tư duy:</b> đạo hàm là <b>độ dốc</b>; gradient là <b>mũi tên chỉ hướng dốc lên nhất</b>, dài bằng độ dốc đó. Muốn giảm, đi <b>ngược</b> nó, từng bước nhỏ, và luôn thử lại bằng bước nhỏ.</div>
        say: "Điều cần mang theo, đạo hàm là độ dốc, gradient là mũi tên chỉ hướng dốc lên nhất, dài bằng độ dốc đó. Muốn giảm thì đi ngược nó, từng bước nhỏ."
      - clear: true
        show: |
          <p class="note">Gặp lại ở bài 8 (tìm đáy và đỉnh), bài 9 (Gradient Descent — xuống núi từng bước) và bài 22 (lan truyền ngược trong mạng nơ-ron).</p>
          <p class="note">Bài sau: <b>ma trận Jacobian và ma trận Hessian</b> (và quy tắc chuỗi) — đạo hàm của hàm nhiều đầu ra, và đạo hàm cấp 2.</p>
