- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">độ dốc = tăng / chạy</span><span class="a">→</span>

      <span class="n">$h$ nhỏ dần: $f''(x)$</span><span class="a">→</span>

      <span class="n">giữ biến khác: $\dfrac{\partial f}{\partial x}$</span><span class="a">→</span>

      <span class="n">gom lại: $\nabla f$</span><span class="a">→</span>

      <span class="n">bóng + Pytago: $(\nabla f)^T\mathbf{u} \le \|\nabla f\|$</span><span class="a">→</span>

      <span class="n">tăng nhanh nhất theo $\nabla f$, giảm theo $-\nabla f$</span></div>

      '
    say: Độ dốc là độ tăng chia độ chạy. Cho h nhỏ dần được đạo hàm. Giữ các biến khác đứng yên được đạo hàm riêng. Gom lại được gradient, và nhờ cái bóng với Pytago, nó chỉ hướng tăng nhanh nhất.
  - show: '<div class="box key"><b>Tư duy:</b> đạo hàm là <b>độ dốc</b>; gradient là <b>mũi tên chỉ hướng dốc lên nhất</b>, dài bằng độ dốc đó. Muốn giảm, đi <b>ngược</b> nó, từng bước nhỏ, và luôn thử lại bằng bước nhỏ.</div>

      '
    say: Điều cần mang theo, đạo hàm là độ dốc, gradient là mũi tên chỉ hướng dốc lên nhất, dài bằng độ dốc đó. Muốn giảm thì đi ngược nó, từng bước nhỏ.
