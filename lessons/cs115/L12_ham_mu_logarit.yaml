# Quy ước ký hiệu: e^{x} cho hàm mũ (exp(x) chỉ nói trong step notation_note); \ln cho lôgarit tự nhiên (log của tài liệu chỉ nói trong
#   step notation_note); xác suất đồng xu viết p (KHÔNG viết p(…) — dễ lẫn với ký hiệu xác suất P(…) của bài 13); khả năng của dữ liệu: L.
# Lời đọc: “lôgarit” (chính tả SGK; lexicon logarit → lôgarit; B20 PARTIAL — probe l12_probe.py: medium 3/4, small 0/4).
#   Không đọc: numpy, sigmoid, likelihood, Euler — chỉ hiện trên màn hình hoặc dùng tên mô tả.
# Nối bài trước (nói lại khi dùng, luật 17): bài 6 (đạo hàm = độ dốc; bảng: hằng số → 0, x → 1, x² → 2x; nhân hằng số; tổng),
#   bài 7 (quy tắc chuỗi: đạo hàm hàm ngoài tính tại bên trong nhân đạo hàm hàm trong), bài 8 (cực trị: đạo hàm bằng 0).
# Sửa nguồn: tài liệu dòng 311, 314, 348 viết log không ghi cơ số — trong học máy đó là ln (cơ số e); nói rõ ở notation_note.
