scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy tính nhân 400 con số nhỏ"
    checks:
      - "0.1**400 == 0.0 and 0.1**300 > 0 and 5e-324 > 0 and 5e-324 / 2 == 0.0"
      - "(lambda d: len(d) - len(d.lstrip('0')) == 323)(format(5e-324, '.330f').split('.')[1]) and str(Rational(1, 10**400)) == '1/1' + '0'*400"
      - "abs(400*math.log(0.1) + 921.034) < 0.001"
    steps:
      - show: |
          <p class="big">Nhân 400 xác suất, mỗi cái bằng $0{,}1$: &nbsp; máy tính trả về <b class="red">0</b> — sai, vì kết quả thật khác 0.</p>
          <p class="note">Số dương nhỏ nhất máy tính lưu được (kiểu số thực thông dụng) có 323 chữ số 0 sau dấu phẩy; tích này có tới 399 chữ số 0.</p>
        focus: [0, 1, 2]
        say: "Chào bạn, hãy thử một phép tính. Nhân 400 xác suất, mỗi cái bằng 0 phẩy 1, máy tính trả về 0. Kết quả đó sai, vì tích thật không bằng 0, chỉ là quá nhỏ để máy lưu."
      - show: |
          <p>Cách sửa của học máy: dùng <b>lôgarit</b> để đổi phép <b>nhân</b> thành phép <b>cộng</b>: &nbsp; 400 lần cộng $(-2{,}3026)$ $= \hlg{-921{,}03}$ — máy lưu dễ dàng.</p>
        say: "Học máy sửa lỗi này bằng một hàm tên là lôgarit, đổi phép nhân thành phép cộng. Cộng 400 lần âm 2 phẩy 3026 được âm 921 phẩy 03, máy lưu dễ dàng. Hôm nay ta học hàm mũ, lôgarit và đạo hàm của chúng."

  # ───────────────────────── 2. ÔN NỀN: LŨY THỪA ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: lũy thừa và ba quy tắc"
    checks:
      - "2**3 == 8 and 2**3 * 2**2 == 2**5 == 32"
      - "(2**5) // (2**2) == 2**3 and Rational(1, 2**3) == Rational(1, 8) and 2**0 == 1"
      - "(2**3)**2 == 2**6 == 64"
    steps:
      - show: |
          <p>$2^3 = 2\cdot 2\cdot 2 = 8$: &nbsp; số mũ đếm <b>có bao nhiêu thừa số</b>.</p>
          <div class="box key">① $\ 2^3\cdot 2^2 = 2^5$ &nbsp; (3 thừa số rồi thêm 2 thừa số)</div>
        focus: [0, 1, 2]
        say: "Trước hết, ta ôn lại lũy thừa, tức là phép nhân một số với chính nó nhiều lần. 2 mũ 3 bằng 2 nhân 2 nhân 2, bằng 8, nên số mũ đếm có bao nhiêu thừa số. Vì vậy 2 mũ 3 nhân 2 mũ 2 bằng 2 mũ 5, vì ta có 3 thừa số rồi thêm 2 thừa số."
      - show: |
          <div class="box key">② $$(2^3)^2 = 2^6$$ (hai nhóm, mỗi nhóm 3)</div>
          <div class="box key">③ $\ 2^0 = 1$ &nbsp; và &nbsp; $2^{-3} = \dfrac{1}{2^3} = \dfrac{1}{8}$ &nbsp; (để quy tắc ① vẫn đúng: $2^3\cdot 2^{-3} = 2^0 = 1$)</div>
          <p class="note">Số mũ không nguyên ($2^{0{,}5}$, …) máy tính vẫn tính được, và ba quy tắc vẫn giữ nguyên.</p>
        focus: [1, 2]
        say: "Còn 2 mũ 3 tất cả mũ 2 bằng 2 mũ 6, vì có hai nhóm, mỗi nhóm 3 thừa số. Thêm nữa, 2 mũ 0 bằng 1, và 2 mũ âm 3 bằng 1 phần 8, để quy tắc cộng số mũ vẫn đúng."

  # ───────────────────────── 3. SỐ e ─────────────────────────
  - id: number_e
    kind: concept
    title: "Số e ≈ 2,718 đến từ đâu: lãi kép"
    checks:
      - "[round((1 + 1/n)**n, 4) for n in (1, 2, 12, 365)] == [2.0, 2.25, 2.613, 2.7146]"
      - "abs((1 + 1/10**6)**(10**6) - 2.71828) < 1e-5 and abs(math.e - 2.71828) < 1e-5"
    steps:
      - show: |
          <p>Gửi 1 đồng, lãi 100% một năm, nhưng chia thành $n$ kỳ, mỗi kỳ lãi $\frac{1}{n}$ và lãi nhập vào gốc:</p>
          <table class="t"><tr><th>số kỳ $n$</th><th>1</th><th>2</th><th>12</th><th>365</th><th>1 triệu</th></tr>
          <tr><td>cuối năm có $\left(1 + \frac{1}{n}\right)^n$</td><td>2</td><td>2,25</td><td>2,6130</td><td>2,7146</td><td>$\hlg{2{,}71828}$</td></tr></table>
        focus: [0, 1, "2.2"]
        say: "Số e đến từ lãi kép. Gửi 1 đồng, lãi 100 phần trăm một năm, nhưng chia thành n kỳ, và lãi mỗi kỳ được nhập vào gốc. Một kỳ được 2 đồng, 12 kỳ được 2 phẩy 613, một triệu kỳ được 2 phẩy 71828."
      - show: |
          <div class="box key">Chia càng nhiều kỳ, số tiền <b>vẫn tăng nhưng không vượt quá</b> một số, và tiến dần tới nó: &nbsp; $e \approx 2{,}71828$</div>
        say: "Chia càng nhiều kỳ, số tiền vẫn tăng nhưng không vượt quá một con số, và tiến dần tới nó, gọi là số e, xấp xỉ 2 phẩy 71828. Nó là một hằng số giống như số pi."

  # ───────────────────────── 4. KÝ HIỆU e^x ─────────────────────────
  - id: sym_exp
    kind: symbol
    title: "Giải mã: hàm mũ — số e mũ x"
    checks:
      - "math.exp(0) == 1 and abs(math.exp(1) - 2.718) < 0.001 and abs(math.exp(2) - 7.389) < 0.001 and abs(math.exp(-1) - 0.368) < 0.001"
      - "abs(math.exp(2)*math.exp(3) - math.exp(5)) < 1e-9"
      - "all(math.exp(x) > 0 for x in range(-50, 50))"
    steps:
      - show: |
          <div class="box key">$e^{x}$ đọc là “e mũ x”: lũy thừa với cơ số $e \approx 2{,}718$.</div>
          <table class="t"><tr><th>$x$</th><th>$-1$</th><th>$0$</th><th>$1$</th><th>$2$</th></tr>
          <tr><td>$e^{x}$</td><td>0,368</td><td>1</td><td>2,718</td><td>7,389</td></tr></table>
        introduces: [exp]
        focus: [1, 2]
        say: "Ký hiệu đầu tiên, e mũ x, là lũy thừa với cơ số e. Theo các quy tắc vừa ôn, e mũ 0 bằng 1, e mũ 1 bằng e, e mũ 2 xấp xỉ 7 phẩy 389, còn e mũ âm 1 bằng 1 chia e, xấp xỉ 0 phẩy 368."
      - show: |
          <p>Ba điều cần nhớ: &nbsp; ① $e^{x} > 0$ với mọi $x$ &nbsp; ② luôn tăng &nbsp; ③ $e^{a}\cdot e^{b} = e^{a + b}$ (quy tắc ① của lũy thừa)</p>
        say: "Có ba điều cần nhớ về e mũ x. Một, giá trị của nó luôn dương. Hai, đồ thị của nó luôn đi lên. Ba, e mũ a nhân e mũ b bằng e mũ a cộng b, đúng như quy tắc cộng số mũ."
      - show: |
          <p class="note">Sách hay viết $\exp(\text{số mũ})$: đó chính là $e^{\text{số mũ}}$, chỉ là cách viết gọn khi số mũ dài. Ví dụ $\exp(-2) = e^{-2}$.</p>
        notation_note: true
        say: "Trong sách, bạn sẽ hay gặp một cách viết bằng ba chữ cái như trên màn hình. Đó chính là e mũ, chỉ là cách viết gọn khi số mũ quá dài."

  # ───────────────────────── 5. KÝ HIỆU ln ─────────────────────────
  - id: sym_ln
    kind: symbol
    title: "Giải mã: lôgarit tự nhiên ln — hỏi “e mũ mấy?”"
    checks:
      - "math.log(1) == 0 and math.log(math.e) == 1 and abs(math.log(math.exp(3)) - 3) < 1e-12"
      - "abs(math.log(7.389) - 2) < 0.001 and abs(math.log(0.5) + 0.693) < 0.001"
    steps:
      - show: |
          <div class="box key">$\ln y$ = số mũ $x$ sao cho $e^{x} = y$. &nbsp; “$\ln$” đọc là <b>lôgarit tự nhiên</b>.</div>
          <p>$\ln 1 = 0$ (vì $e^{0} = 1$), &nbsp; $\ln e = 1$, &nbsp; $\ln 7{,}389 \approx 2$ (vì $e^{2} \approx 7{,}389$), &nbsp; $\ln 0{,}5 \approx -0{,}693$</p>
        introduces: [log]
        focus: ["1.1", ["2.1", "2.2"], ["2.4", "2.5"]]
        say: "Ký hiệu thứ hai trên màn hình đọc là lôgarit tự nhiên của y, trả lời câu hỏi, e mũ mấy thì bằng y. Ví dụ lôgarit tự nhiên của 1 bằng 0, vì e mũ 0 bằng 1. Lôgarit tự nhiên của 7 phẩy 389 xấp xỉ 2."
      - show: |
          <div class="row"><div class="col"><svg width="400" height="390" viewBox="0 0 400 390">
            <line x1="20" y1="230" x2="380" y2="230" stroke="#9ca3af" stroke-width="2"/>
            <line x1="160" y1="20" x2="160" y2="380" stroke="#9ca3af" stroke-width="2"/>
            <line x1="20" y1="370" x2="370" y2="20" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/>
            <polyline fill="none" stroke="#2563eb" stroke-width="5" points="20,229 34,229 48,229 62,228 76,227 90,225 104,223 118,219 132,214 146,207 160,195 174,178 188,152 199,125 206,102 212,73 216,57 220,38 223,18"/>
            <polyline fill="none" stroke="#059669" stroke-width="5" points="161,367 162,335 164,311 165,296 167,286 170,272 174,262 178,254 184,242 195,230 212,216 230,206 248,198 265,192 300,181 335,174 370,167"/>
            <circle cx="160" cy="195" r="7" fill="#2563eb"/><circle cx="195" cy="230" r="7" fill="#059669"/>
            <text x="228" y="60" font-size="26" fill="#2563eb">e mũ x</text>
            <text x="280" y="160" font-size="26" fill="#059669">ln x</text>
            <text x="60" y="185" font-size="22" fill="#2563eb">(0; 1)</text>
            <text x="205" y="262" font-size="22" fill="#059669">(1; 0)</text>
          </svg></div>
          <div class="col"><p>Hai đồ thị đối xứng qua đường chéo nét đứt: lôgarit <b>làm ngược</b> hàm mũ.</p>
          <p>$\ln$ chỉ xác định với số <b>dương</b> ($e^{x}$ không bao giờ $\le 0$); &nbsp; $\ln$ cũng <b>luôn tăng</b>.</p></div></div>
        say: "Trên hình, đồ thị lôgarit là đồ thị hàm mũ lật qua đường chéo, vì nó làm ngược hàm mũ. Vì e mũ x luôn dương, lôgarit chỉ xác định với số dương. Và giống hàm mũ, nó luôn tăng."

  # ───────────────────────── 6. TÍNH CHẤT ─────────────────────────
  - id: ln_rules
    kind: formula
    title: "Lôgarit biến nhân thành cộng"
    checks:
      - "abs(math.log(2) + math.log(3) - math.log(6)) < 1e-12 and round(math.log(2), 3) == 0.693 and round(math.log(3), 3) == 1.099 and round(math.log(6), 3) == 1.792"
      - "abs(math.log(8) - 3*math.log(2)) < 1e-12 and round(3*math.log(2), 3) == 2.079"
      - "abs(math.log(6/2) - (math.log(6) - math.log(2))) < 1e-12"
    steps:
      - show: |
          <p>Đặt $a = e^{p}$, $b = e^{q}$ (tức $p = \ln a$, $q = \ln b$). Theo quy tắc ① của lũy thừa: $\ a\cdot b = e^{p}\cdot e^{q} = e^{p + q}$</p>
          <div class="box key">$$\implies \ \ln(a\cdot b) = p + q = \ln a + \ln b$$</div>
        focus: [0, ["1.1", "1.2"], ["1.5", 2]]
        say: "Vì sao lôgarit biến nhân thành cộng? Đặt a bằng e mũ p, b bằng e mũ q. Theo quy tắc cộng số mũ, a nhân b bằng e mũ p cộng q, nên lôgarit tự nhiên của a nhân b bằng p cộng q."
      - show: |
          <div class="box key">Hệ quả: &nbsp; $\ln\dfrac{a}{b} = \ln a - \ln b$, &nbsp;&nbsp; $\ln(a^{k}) = k\cdot\ln a$ &nbsp; (với $a, b > 0$)</div>
        say: "Từ đó suy ra hai hệ quả. Lôgarit của a chia b bằng lôgarit của a trừ lôgarit của b. Lôgarit của a mũ k bằng k nhân lôgarit của a, vì a mũ k là k thừa số a nhân với nhau."
      - clear: true
        show: |
          <p class="note">Đang có: $\ \ln(a\cdot b) = \ln a + \ln b$, &nbsp; $\ln(a^{k}) = k\cdot\ln a$</p>
          <p><b>Làm thử ngay</b>: $\ \ln 2 + \ln 3 \approx 0{,}693 + 1{,}099 = 1{,}792 \approx \ln 6\ \checkmark$</p>
          <p>$\ln 8 = \ln(2^3) = 3\cdot\ln 2 \approx 3\cdot 0{,}693 = \hlg{2{,}079}$</p>
        focus: [1, 2, 3]
        say: "Làm thử ngay bằng số, theo quy tắc vừa có. Lôgarit của 2 cộng lôgarit của 3 bằng 0 phẩy 693 cộng 1 phẩy 099, bằng 1 phẩy 792, đúng bằng lôgarit của 6. Còn lôgarit của 8 bằng 3 nhân lôgarit của 2, xấp xỉ 2 phẩy 079."
      - show: |
          <p class="note">Sách có chỗ viết $\log$, có chỗ viết $\ln$. Trong học máy, $\log$ không ghi cơ số <b>thường là</b> $\ln$, cơ số $e$ (thư viện numpy: <code>np.log</code> cũng là $\ln$); chỗ nào dùng cơ số khác, như cơ số 2, sách sẽ ghi rõ. Khác với nút log <b>cơ số 10</b> của máy tính bỏ túi (cho 100 ra 2).</p>
        notation_note: true
        say: "Lưu ý về cách viết. Sách có chỗ viết tắt bằng ba chữ cái, có chỗ bằng hai chữ cái như ta vừa học. Theo quy ước thường gặp của học máy, cả hai đều là lôgarit tự nhiên, cơ số e, còn chỗ nào dùng cơ số khác thì sách sẽ ghi rõ. Nó khác với nút cơ số 10 trên máy tính bỏ túi."

  # ───────────────────────── 6b. HÌNH: THƯỚC LÔGARIT ─────────────────────────
  - id: ruler
    kind: intuition
    title: "Hình dung: thước lôgarit — nhân ở trên, cộng ở dưới"
    checks:
      - "[round(math.log(v), 3) for v in (1, 2, 4, 8, 16)] == [0, 0.693, 1.386, 2.079, 2.773]"
      - "[150 + round(400*math.log(v)) for v in (1, 2, 4, 8, 16)] == [150, 427, 705, 982, 1259]"
      - "abs(math.log(2) + math.log(8) - math.log(16)) < 1e-12 and 2*8 == 16 and (2, 8, 16) == (2**1, 2**3, 2**4) and 1 + 3 == 4"
    steps:
      - show: |
          <div><svg width="1460" height="380" viewBox="0 0 1460 380"><defs><marker id="l12a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2563eb"/></marker><marker id="l12b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#059669"/></marker></defs><line x1="130" y1="130" x2="1300" y2="130" stroke="#2563eb" stroke-width="4"/><line x1="130" y1="270" x2="1300" y2="270" stroke="#059669" stroke-width="4"/><text x="1320" y="139" font-size="26" fill="#2563eb" font-weight="700">số a</text><text x="1320" y="279" font-size="26" fill="#059669" font-weight="700">ln a</text><line x1="150" y1="140" x2="150" y2="260" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><circle cx="150" cy="130" r="8" fill="#2563eb"/><circle cx="150" cy="270" r="8" fill="#059669"/><text x="150" y="175" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="700">1</text><text x="162" y="252" font-size="24" text-anchor="start" fill="#1f2937">0</text><line x1="427" y1="140" x2="427" y2="260" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><circle cx="427" cy="130" r="8" fill="#2563eb"/><circle cx="427" cy="270" r="8" fill="#059669"/><text x="427" y="175" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="700">2</text><text x="439" y="252" font-size="24" text-anchor="start" fill="#1f2937">0,693</text><line x1="705" y1="140" x2="705" y2="260" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><circle cx="705" cy="130" r="8" fill="#2563eb"/><circle cx="705" cy="270" r="8" fill="#059669"/><text x="705" y="175" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="700">4</text><text x="717" y="252" font-size="24" text-anchor="start" fill="#1f2937">1,386</text><line x1="982" y1="140" x2="982" y2="260" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><circle cx="982" cy="130" r="8" fill="#2563eb"/><circle cx="982" cy="270" r="8" fill="#059669"/><text x="982" y="175" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="700">8</text><text x="994" y="252" font-size="24" text-anchor="start" fill="#1f2937">2,079</text><line x1="1259" y1="140" x2="1259" y2="260" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/><circle cx="1259" cy="130" r="8" fill="#2563eb"/><circle cx="1259" cy="270" r="8" fill="#059669"/><text x="1259" y="175" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="700">16</text><text x="1271" y="252" font-size="24" text-anchor="start" fill="#1f2937">2,773</text><path d="M160,118 Q288,50 415,116" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#l12a)"/><text x="288" y="62" font-size="22" text-anchor="middle" fill="#2563eb">nhân 2</text><path d="M160,284 Q288,352 415,286" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#l12b)"/><text x="288" y="350" font-size="22" text-anchor="middle" fill="#059669">cộng 0,693</text><path d="M437,118 Q566,50 693,116" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#l12a)"/><text x="566" y="62" font-size="22" text-anchor="middle" fill="#2563eb">nhân 2</text><path d="M437,284 Q566,352 693,286" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#l12b)"/><text x="566" y="350" font-size="22" text-anchor="middle" fill="#059669">cộng 0,693</text><path d="M715,118 Q843,50 970,116" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#l12a)"/><text x="843" y="62" font-size="22" text-anchor="middle" fill="#2563eb">nhân 2</text><path d="M715,284 Q843,352 970,286" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#l12b)"/><text x="843" y="350" font-size="22" text-anchor="middle" fill="#059669">cộng 0,693</text><path d="M992,118 Q1120,50 1247,116" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#l12a)"/><text x="1120" y="62" font-size="22" text-anchor="middle" fill="#2563eb">nhân 2</text><path d="M992,284 Q1120,352 1247,286" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#l12b)"/><text x="1120" y="350" font-size="22" text-anchor="middle" fill="#059669">cộng 0,693</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này đặt hai cái thước song song, mỗi chấm ở thước trên là một số a, chấm ngay dưới nó là lôgarit tự nhiên của a. Ở thước trên, mỗi lần đi sang phải ta nhân thêm 2, từ 1 lên 2, lên 4, lên 8, rồi lên 16. Ở thước dưới, cũng bước đó chỉ là cộng thêm 0 phẩy 693, tức lôgarit tự nhiên của 2. Các chấm cách đều nhau, vì nhân với 2 luôn ứng với cùng một đoạn cộng."
      - show: |
          $$2\cdot 8 = 16 \qquad \ln 2 + \ln 8 = \ln 16 \qquad (\text{1 bước} + \text{3 bước} = \text{4 bước})$$
          <p class="note">Đọc trên hình: từ 2 nhảy thêm 3 bước “nhân 2” là tới 16; ở thước dưới đó là 3 bước “cộng 0,693”.</p>
        focus: [1, 1, 2]
        say: "Làm thử trên hình, 2 nhân 8 bằng 16 ở thước trên, thì ở thước dưới lôgarit của 2 cộng lôgarit của 8 bằng lôgarit của 16. Đếm bước cho thấy vì sao, chấm 2 cách chấm 1 một bước, chấm 8 cách chấm 1 ba bước, cộng lại là bốn bước, đúng chỗ của chấm 16. Từ chấm 2, nhảy thêm ba bước nhân 2 thì tới 16, còn ở thước dưới đó là ba bước cộng 0 phẩy 693."

  # ───────────────────────── 7. ĐẠO HÀM ─────────────────────────
  - id: derivatives
    kind: formula
    title: "Đạo hàm: eˣ giữ nguyên, ln x thành 1 chia x"
    checks:
      - "[round((math.exp(h) - 1)/h, 4) for h in (0.1, 0.01, 0.001)] == [1.0517, 1.005, 1.0005]"
      - "[round((2**h - 1)/h, 4) for h in (0.1, 0.01, 0.001)] == [0.7177, 0.6956, 0.6934] and round(math.log(2), 4) == 0.6931"
      - "abs((math.exp(1.001) - math.exp(1))/0.001 - 2.7196) < 1e-4"
      - "(lambda x: sp.diff(sp.log(x), x) == 1/x and sp.simplify(sp.diff(sp.exp(sp.log(x)), x)) == 1)(sp.Symbol('x', positive=True))"
      - "abs((math.log(2.001) - math.log(2))/0.001 - 0.4999) < 1e-4"
    steps:
      - show: |
          <p>Độ dốc của $e^{x}$ (bài 6: thay đổi chia cho bước nhỏ $h$): &nbsp; $\dfrac{e^{x + h} - e^{x}}{h} = e^{x}\cdot\dfrac{e^{h} - 1}{h}$ &nbsp; (vì $e^{x + h} = e^{x}\cdot e^{h}$)</p>
          <table class="t"><tr><th>$h$</th><th>0,1</th><th>0,01</th><th>0,001</th></tr>
          <tr><td>$\frac{e^{h} - 1}{h}$</td><td>1,0517</td><td>1,0050</td><td>$\hlg{1{,}0005}$</td></tr>
          <tr><td>cơ số 2: $\frac{2^{h} - 1}{h}$</td><td>0,7177</td><td>0,6956</td><td>0,6934</td></tr></table>
        focus: ["1.3", "1.3", "2.2"]
        say: "Nhắc lại bài 6, đạo hàm là độ dốc, bằng phần thay đổi chia cho bước nhỏ h. Vì e mũ x cộng h bằng e mũ x nhân e mũ h, độ dốc bằng e mũ x nhân một thừa số. Với cơ số e, thừa số này tiến tới đúng 1."
      - show: |
          <div class="box key">$(e^{x})' = e^{x}$ &nbsp; — đó là lý do chọn cơ số $e$: với cơ số 2, thừa số là $\approx 0{,}693$, không gọn.</div>
          <p class="note">Kiểm tại $x = 1$, $h = 0{,}001$: $\ \frac{e^{1{,}001} - e}{0{,}001} \approx 2{,}7196 \approx e\ \checkmark$</p>
        focus: ["1.1", "1.3", 2]
        say: "Vậy đạo hàm của e mũ x chính là e mũ x, giữ nguyên. Đó là lý do toán học chọn cơ số e, vì với cơ số 2, thừa số là 0 phẩy 693, không gọn. Kiểm tại x bằng 1, độ dốc xấp xỉ 2 phẩy 7196, gần bằng e."
      - clear: true
        show: |
          <p>Đạo hàm của $\ln x$ ($x > 0$): bắt đầu từ $\ e^{\ln x} = x$ (định nghĩa của $\ln$). Lấy đạo hàm hai vế, vế trái theo <b>quy tắc chuỗi</b> bài 7:</p>
          $$e^{\ln x}\cdot(\ln x)' = 1 \implies x\cdot(\ln x)' = 1$$
          <div class="box key">$(\ln x)' = \dfrac{1}{x}$</div>
        focus: ["1.3", 2, [1, 2]]
        say: "Còn lôgarit, ta bắt đầu từ định nghĩa, e mũ lôgarit của x bằng x. Lấy đạo hàm hai vế. Theo quy tắc chuỗi ở bài 7, vế trái bằng hàm ngoài tính tại bên trong, tức là x, nhân với đạo hàm của lôgarit, còn vế phải bằng 1."
      - show: |
          <p class="note">Chuyển vế (chia hai vế cho $x$) được $(\ln x)' = \frac{1}{x}$. Tại $x = 2$, độ dốc tính bằng bước nhỏ: $\ \frac{\ln 2{,}001 - \ln 2}{0{,}001} \approx 0{,}4999 \approx \frac{1}{2}\ \checkmark$</p>
        say: "Chia hai vế cho x, nên ta được đạo hàm của lôgarit tự nhiên bằng 1 chia x. Kiểm tại x bằng 2, độ dốc tính bằng bước nhỏ là 0 phẩy 4999, khớp với một nửa."

  # ───────────────────────── 8. QUY TẮC CHUỖI ─────────────────────────
  - id: chain
    kind: example
    title: "Hàm lồng: e mũ 3x, e mũ âm x bình phương chia 2"
    checks:
      - "(lambda x: sp.diff(sp.exp(3*x), x) == 3*sp.exp(3*x) and (3*sp.exp(3*x)).subs(x, 0) == 3)(sp.Symbol('x'))"
      - "(lambda x: sp.simplify(sp.diff(sp.exp(-x**2/2), x) + x*sp.exp(-x**2/2)) == 0 and (-x*sp.exp(-x**2/2)).subs(x, 0) == 0)(sp.Symbol('x'))"
      - "(lambda x: sp.simplify(sp.diff(sp.log(1 - x), x) + 1/(1 - x)) == 0)(sp.Symbol('x'))"
    steps:
      - show: |
          <p>Bài 7: đạo hàm hàm lồng = (đạo hàm hàm ngoài, tính tại bên trong) $\cdot$ (đạo hàm hàm trong).</p>
          <p>① $\ (e^{3x})' = e^{3x}\cdot 3 = 3e^{3x}$ &nbsp; (ngoài: $e^{\text{trong}}$ giữ nguyên; trong: $3x$ có đạo hàm $3$). Tại $x = 0$: $\hlg{3}$</p>
        focus: [1, 2]
        say: "Nhắc lại quy tắc chuỗi của bài 7, đạo hàm hàm lồng bằng đạo hàm hàm ngoài tính tại bên trong, nhân đạo hàm hàm trong. Với e mũ 3 x, hàm ngoài giữ nguyên, hàm trong có đạo hàm 3, nên kết quả là 3 nhân e mũ 3 x."
      - show: |
          <p>② $$\left(e^{-x^2/2}\right)' = e^{-x^2/2}\cdot(-x)$$ (trong: $-\frac{x^2}{2}$, đạo hàm theo bảng bài 6 là $-\frac{2x}{2} = -x$)</p>
          <p>③ $\ \big(\ln(1 - x)\big)' = \dfrac{1}{1 - x}\cdot(-1) = -\dfrac{1}{1 - x}$ &nbsp; (với $x < 1$)</p>
        focus: [1, 2]
        say: "Với e mũ âm x bình phương chia 2, hàm trong có đạo hàm âm x, vì theo bảng bài 6, x bình phương có đạo hàm 2 x. Với lôgarit của 1 trừ x, hàm trong có đạo hàm âm 1, nên kết quả là âm 1 chia cho 1 trừ x."

  # ───────────────────────── 9. VÍ DỤ ĐỒNG XU ─────────────────────────
  - id: coin
    kind: example
    title: "Ví dụ: đồng xu 3 ngửa 1 sấp — tìm p bằng lôgarit"
    checks:
      - "(lambda p: sp.solve(sp.diff(3*sp.log(p) + sp.log(1 - p), p), p))(sp.Symbol('p', positive=True)) == [Rational(3, 4)]"
      - "(lambda L: [round(L(v), 4) for v in (0.7, 0.75, 0.8)] == [0.1029, 0.1055, 0.1024])(lambda p: p**3*(1 - p))"
      - "(lambda L: [round(math.log(L(v)), 3) for v in (0.7, 0.75, 0.8)] == [-2.274, -2.249, -2.279])(lambda p: p**3*(1 - p))"
      - "3*(1 - Rational(3,4)) == Rational(3,4)"
    steps:
      - show: |
          <p>Tung 4 lần: <b>ngửa, ngửa, ngửa, sấp</b>. Gọi $p$ là xác suất ra ngửa. Khả năng gặp đúng dãy này: $\ L = p\cdot p\cdot p\cdot(1 - p)$</p>
          <p>Lấy $\ln$: $\ \ln L = 3\ln p + \ln(1 - p)$ &nbsp; (tích thành tổng, mũ 3 thành nhân 3)</p>
        focus: [0, 1, "1.2", "1.3", 2]
        say: "Một ví dụ. Tung đồng xu 4 lần, được ba lần ngửa rồi một lần sấp. Gọi p là xác suất để đồng xu ra mặt ngửa. Khả năng gặp đúng dãy này là p nhân p nhân p nhân 1 trừ p. Lấy lôgarit, tích thành tổng."
      - show: |
          <p>Đỉnh: đạo hàm bằng 0 (bài 8): $\ \dfrac{3}{p} - \dfrac{1}{1 - p} = 0 \implies 3(1 - p) = p \implies p = \hlg{\frac{3}{4}}$</p>
          <p class="note">Hợp lý: 3 trên 4 lần là ngửa.</p>
        focus: [1, 1, 1]
        say: "Theo bài 8, ở đỉnh thì đạo hàm bằng 0. Đạo hàm của 3 lôgarit p là 3 chia p, còn của lôgarit 1 trừ p là âm 1 chia 1 trừ p. Quy đồng rồi chuyển vế, được p bằng ba phần tư, đúng tỉ lệ ngửa."
      - clear: true
        show: |
          <table class="t"><tr><th>$p$</th><th>0,7</th><th>0,75</th><th>0,8</th></tr>
          <tr><td>$L$</td><td>0,1029</td><td>$\hlg{0{,}1055}$</td><td>0,1024</td></tr>
          <tr><td>$\ln L$</td><td>−2,274</td><td>$\hlg{-2{,}249}$</td><td>−2,279</td></tr></table>
          <p class="note">Vì $\ln$ luôn tăng, $L$ lớn nhất ở đâu thì $\ln L$ lớn nhất ở đó — lấy $\ln$ không làm đổi đáp án.</p>
        focus: [1, ["1.2", "1.3"], 2]
        say: "Ta kiểm lại bằng một bảng số. Cả khả năng L và lôgarit của nó đều lớn nhất tại p bằng 0 phẩy 75. Lý do là lôgarit luôn tăng, nên L lớn nhất ở đâu thì lôgarit của L lớn nhất ở đó."

  # ───────────────────────── 10. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Phép thử: cộng lôgarit rồi đổi ngược bằng hàm mũ"
    checks:
      - "abs(math.log(0.9) + math.log(0.8) + math.log(0.7) + 0.6852) < 1e-4 and abs(math.exp(-0.6852) - 0.504) < 1e-4 and abs(0.9*0.8*0.7 - 0.504) < 1e-12"
    steps:
      - show: |
          <p>$\ln 0{,}9 + \ln 0{,}8 + \ln 0{,}7 \approx -0{,}6852$ &nbsp; → &nbsp; $e^{-0{,}6852} \approx 0{,}504 = 0{,}9\cdot 0{,}8\cdot 0{,}7\ \checkmark$</p>
        say: "Phép thử, vì hàm mũ làm ngược lôgarit, ta cộng lôgarit của 0 phẩy 9, 0 phẩy 8 và 0 phẩy 7, được âm 0 phẩy 6852. Đổi ngược bằng hàm mũ, e mũ âm 0 phẩy 6852 bằng 0 phẩy 504, đúng bằng tích ba số. Vậy cộng lôgarit không làm mất thông tin."

  # ───────────────────────── 11. TRONG AI ─────────────────────────
  - id: in_ai
    kind: concept
    title: "Hàm mũ và lôgarit trong học máy"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>gặp lại $e$ và $\ln$ ở đâu</th></tr>
          <tr><td><b>Bài 14</b></td><td>phân phối chuẩn có $e^{-x^2/2}$ — hình quả chuông</td></tr>
          <tr><td><b>Bài 17</b></td><td>tìm tham số bằng cách cộng $\ln$ của các xác suất (như ví dụ đồng xu, nhưng với rất nhiều dữ liệu)</td></tr>
          <tr><td><b>Bài 20</b></td><td>hàm sigmoid $\dfrac{1}{1 + e^{-z}}$ và hàm sai số Cross-Entropy dùng $e$ và $\ln$</td></tr></table>
        forward_ref: true
        focus: ["1.2", "1.3", "1.4"]
        say: "Ở bài 14, đường cong hình quả chuông chứa e mũ âm x bình phương chia 2. Ở bài 17, ta tìm tham số bằng cách cộng lôgarit của nhiều xác suất, như ví dụ đồng xu. Ở bài 20, một hàm hình chữ S và một hàm sai số đều dùng e và lôgarit."

  # ───────────────────────── 12. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(math.log(1 + 1) - 0.693) < 0.001 and math.log(1) + math.log(1) == 0"
      - "(lambda x: sp.diff(sp.exp(3*x), x) != sp.exp(3*x))(sp.Symbol('x'))"
      - "abs(math.log(4)**2 - 1.922) < 0.001 and abs(math.log(4**2) - 2.773) < 0.001"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> $\ln(a + b) = \ln a + \ln b$ <b class="red">(sai)</b>
          <br><span class="note">Lôgarit biến <b>tích</b> thành tổng, không phải tổng thành tổng: $\ln(1 + 1) \approx 0{,}693$, còn $\ln 1 + \ln 1 = 0$.</span></div>
        say: "Lỗi thứ nhất, nghĩ rằng lôgarit của a cộng b bằng tổng hai lôgarit. Lôgarit chỉ biến tích thành tổng. Ví dụ lôgarit của 1 cộng 1 xấp xỉ 0 phẩy 693, còn tổng hai lôgarit của 1 bằng 0."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy $\ln 0$ hay $\ln$ của số âm <b class="red">(không xác định)</b>
          <br><span class="note">Trong học máy, dự đoán xác suất bằng 0 làm $\ln$ hỏng; thư viện thường cộng thêm một số rất nhỏ trước khi lấy $\ln$.</span></div>
        say: "Lỗi thứ hai, lấy lôgarit của 0 hay của số âm. Điều đó không xác định. Trong học máy, khi mô hình dự đoán xác suất bằng 0, thư viện thường cộng thêm một số rất nhỏ trước khi lấy lôgarit."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> $(e^{3x})' = e^{3x}$ <b class="red">(sai — quên quy tắc chuỗi)</b>
          <br><span class="note">Đúng là $3e^{3x}$: nhân thêm đạo hàm của hàm trong $3x$.</span></div>
        say: "Lỗi thứ ba, quên quy tắc chuỗi, nghĩ rằng đạo hàm của e mũ 3 x vẫn là e mũ 3 x. Đúng ra phải nhân thêm đạo hàm của hàm trong, nên kết quả là 3 nhân e mũ 3 x."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> $(\ln x)^2 = \ln(x^2)$ <b class="red">(sai)</b>
          <br><span class="note">$\ln(x^2) = 2\ln x$. Với $x = 4$: $$(\ln 4)^2 \approx 1{,}922 \quad\text{còn}\quad \ln 16 \approx 2{,}773$$</span></div>
        say: "Lỗi thứ tư, nhầm bình phương của lôgarit với lôgarit của bình phương. Lôgarit của x bình phương bằng 2 nhân lôgarit của x. Với x bằng 4, hai số là 1 phẩy 922 và 2 phẩy 773, khác nhau."

  # ───────────────────────── 13. TỰ KIỂM TRA ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(math.log(9) - 2*math.log(3)) < 1e-12 and round(2*1.099, 3) == 2.198"
      - "(lambda x: sp.diff(sp.log(x**2), x) == 2/x and (2/x).subs(x, 4) == Rational(1, 2))(sp.Symbol('x', positive=True))"
      - "(lambda x: sp.diff(sp.exp(-2*x), x) == -2*sp.exp(-2*x) and (-2*sp.exp(-2*x)).subs(x, 0) == -2)(sp.Symbol('x'))"
      - "round(1.099 + 1.099, 3) == 2.198 and abs(math.log(3) + math.log(3) - math.log(9)) < 1e-12"
      - "(lambda x: sp.simplify((1/x**2)*2*x - 2/x) == 0 and Rational(2, 4) == Rational(1, 2))(sp.Symbol('x', positive=True))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Biết $\ln 3 \approx 1{,}099$. Tính $\ln 9$.</td></tr>
          <tr><td>2</td><td>Tính đạo hàm của $\ln(x^2)$ tại $x = 4$.</td></tr>
          <tr><td>3</td><td>Tính đạo hàm của $e^{-2x}$ tại $x = 0$.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với ba câu. Một, biết lôgarit của 3, tính lôgarit của 9. Hai, đạo hàm của lôgarit x bình phương tại x bằng 4. Ba, đạo hàm của e mũ âm 2 x tại 0. Hãy dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p><b>Câu 1.</b> Bước 1: viết $9 = 3^2$. &nbsp; Bước 2: lôgarit đưa số mũ ra trước.</p>
          $$\ln 9 = \ln(3^2) = 2\cdot\ln 3 \approx 2\cdot 1{,}099 = \hlg{2{,}198}$$
          <p class="note">Kiểm bằng đường khác: $\ln 9 = \ln 3 + \ln 3 \approx 1{,}099 + 1{,}099 = 2{,}198\ \checkmark$ (tích $3\cdot 3$ thành tổng).</p>
        focus: [1, 2, 3]
        say: "Đáp án câu một, trước hết viết 9 thành 3 bình phương, rồi đưa số mũ 2 ra trước lôgarit. Vậy lôgarit của 9 bằng 2 nhân 1 phẩy 099, bằng 2 phẩy 198. Kiểm bằng đường khác, 9 là 3 nhân 3, nên lôgarit của 9 cũng bằng 1 phẩy 099 cộng 1 phẩy 099, cùng ra 2 phẩy 198."
      - clear: true
        show: |
          <p><b>Câu 2.</b> Với $x > 0$: $\ \ln(x^2) = 2\ln x$, nên đạo hàm là $2\cdot\frac{1}{x} = \frac{2}{x}$; tại $x = 4$: $\ \frac{2}{4} = \hlg{\frac{1}{2}}$</p>
          $$\text{quy tắc chuỗi: } \ \frac{1}{x^2}\cdot 2x = \frac{2}{x} \ \checkmark$$
        focus: [1, 1, 2]
        say: "Câu hai, với x dương, lôgarit của x bình phương bằng 2 nhân lôgarit của x. Vì thế đạo hàm là 2 nhân 1 chia x, tức 2 chia x, và tại x bằng 4 được 2 chia 4, bằng một nửa. Làm theo quy tắc chuỗi cũng ra như vậy, vì 1 chia x bình phương, nhân với đạo hàm 2 x của hàm trong, bằng 2 chia x."
      - show: |
          <p><b>Câu 3.</b> Hàm ngoài $e^{\text{trong}}$ giữ nguyên; hàm trong $-2x$ có đạo hàm $-2$:</p>
          $$\left(e^{-2x}\right)' = e^{-2x}\cdot(-2), \qquad \text{tại } x = 0:\ \ e^{0}\cdot(-2) = 1\cdot(-2) = \hlg{-2}$$
        focus: [1, 2]
        say: "Câu ba, hàm ngoài là e mũ một số, đạo hàm giữ nguyên, còn hàm trong là âm 2 x, có đạo hàm âm 2. Nhân lại được e mũ âm 2 x nhân âm 2, và tại x bằng 0 thì e mũ 0 bằng 1, nên đạo hàm bằng âm 2."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lũy thừa: cộng số mũ</span><span class="a">→</span>
          <span class="n">số $e \approx 2{,}718$, hàm $e^{x}$</span><span class="a">→</span>
          <span class="n">$\ln$ làm ngược, chỉ cho số dương</span><span class="a">→</span>
          <span class="n">$\ln$ biến tích thành tổng</span><span class="a">→</span>
          <span class="n">$(e^{x})' = e^{x}$, $(\ln x)' = \frac{1}{x}$</span></div>
        say: "Tổng kết chuỗi logic. Lũy thừa cộng số mũ khi nhân. Từ đó có số e và hàm e mũ x. Lôgarit làm ngược hàm mũ, chỉ cho số dương, và biến tích thành tổng. Đạo hàm của e mũ x vẫn là chính nó, còn đạo hàm của lôgarit là 1 chia cho x."
      - show: |
          <div class="box key"><b>Tư duy:</b> gặp tích của nhiều xác suất, hãy lấy $\ln$ — tích thành tổng, số không bị làm tròn về 0, và chỗ lớn nhất không đổi.</div>
        say: "Điều cần mang theo, khi gặp tích của nhiều xác suất, hãy lấy lôgarit. Tích thành tổng, số không bị làm tròn về 0, và chỗ lớn nhất không đổi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>xác suất rời rạc</b> — xác suất có điều kiện, định lý Bayes, kỳ vọng, phương sai.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta học xác suất rời rạc, gồm xác suất có điều kiện, kỳ vọng và phương sai, nền móng cho mọi mô hình dự đoán. Hẹn gặp bạn ở bài tiếp theo."
