id: L42
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 42 (mở rộng) — Mô hình sinh (1): Variational Autoencoder & GAN"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "0 kết quả trong nguồn môn học; CITED: Kingma & Welling, “Auto-Encoding Variational Bayes”, arXiv:1312.6114 (2013); Goodfellow et al., “Generative Adversarial Nets”, arXiv:1406.2661 (2014) (truy cập 2026-10-24, no revision given)"
assumes: [cdot, sub, mu, sigma, normal, exp, log, approx, given, prob, kl, sqrt, pi, geq, max_fn, hat, epsilon, norm, partial, star]
# Quy ước ký hiệu: dữ liệu x, mã ẩn z; bộ mã hoá cho q(z|x) = N(μ, σ²); tiên nghiệm p(z) = N(0, 1); bộ giải mã cho p(x|z);
#   ELBO = E_q[ln p(x|z)] − KL(q ‖ p(z)); bộ sinh G, bộ phân biệt D (xác suất “thật”) — chữ D ở đây KHÔNG phải dữ liệu 𝒟 của bài 17.
# Ví dụ số: mô hình tuyến tính một chiều p(z) = N(0, 1), p(x|z) = N(z, 1) → p(x) = N(0, 2), hậu nghiệm thật N(x/2, 1/2).
# Lời đọc: VAE, GAN, ELBO chỉ hiện trên màn hình — nói “mạng tự mã hoá biến phân”, “mạng đối kháng”, “cận dưới”.
# Nối bài trước (nói lại khi dùng, luật 17): bài 14 (phân phối chuẩn), bài 17 (MLE: cực đại ln khả năng; hậu nghiệm), bài 20 (entropy
#   chéo nhị phân; phân loại thật/giả), bài 22 (lan truyền ngược cần đạo hàm), bài 32 (độ lệch KL ≥ 0), bài 37 (mạng tự mã hoá).
objectives:
  - "Hiểu mô hình sinh: học phân phối của dữ liệu để tạo mẫu mới"
  - "Đọc cận dưới ELBO và công thức KL giữa hai phân phối chuẩn"
  - "Hiểu mẹo tham số hoá lại z = μ + σ·ε"
  - "Hiểu trò chơi của GAN và bộ phân biệt tốt nhất D* = p_data/(p_data + p_g)"
asr_reviewed:
  - {sentence: "Công thức Bayes cho hậu nghiệm có tâm x chia 2, phương sai một nửa, tức tâm 0 phẩy 5 khi x bằng 1.", reason: "ASR chép “Công thức bay x cho hậu nghiệm có tâm ích chi 2, phương sai 1 nữa, tức tâm 0,5 khi ích bằng 1.” (0.88): Bayes đọc “Bay-ét” theo lexicon chung (probe 3/8, NOT_VERIFIED), ASR viết “bay X/S”; lệch âm/thanh thuần Việt: chia/chi, nửa/nữa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, thay vào công thức độ lệch, cả hai đều có phương sai 1, và lôgarit của 1 bằng 0.", reason: "ASR chép “Câu một, thay vào công thức độ lệch, cả hai đều có phương sai một và logatic của một bằng không.” (0.952): lệch âm/thanh thuần Việt: lôgarit/logatic — NOT_VERIFIED bằng tai người"}
  - sentence: "Nhắc lại bài 17, ước lượng hợp lý cực đại làm lớn lôgarit khả năng của dữ liệu."
    reason: "“lôgarit” chính tả SGK, ASR chép “logatrix” (đã ghi ở L12); phần còn lại khớp"
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ nhận dạng ảnh đến vẽ ra ảnh mới"
    steps:
      - show: |
          <p class="big">Mô hình phân loại trả lời “ảnh này là gì?”. Mô hình <b>sinh</b> làm điều khó hơn: <b>tạo ra</b> ảnh mới trông như thật.</p>
          <div class="box key">Hai ý tưởng (2013–2014): <b>VAE</b> — mạng tự mã hoá (bài 37) có xác suất, rút mã ngẫu nhiên rồi giải mã; <b>GAN</b> — hai mạng thi đấu: một bên làm giả, một bên bắt giả.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, mô hình phân loại trả lời ảnh này là gì. Mô hình sinh làm việc khó hơn, tạo ra ảnh mới trông như thật. Hôm nay ta học hai ý tưởng, mạng tự mã hoá biến phân, nối tiếp bài 37, và mạng đối kháng, trong đó hai mạng thi đấu với nhau."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: MLE, độ lệch KL, mạng tự mã hoá"
    checks:
      - "round(0.9*math.log(0.9/0.5) + 0.1*math.log(0.1/0.5), 3) == 0.368 and 0.9*math.log(1) + 0.1*math.log(1) == 0 and math.sqrt(9) == 3"
    steps:
      - show: |
          <p>Bài 17: cực đại $\ln p(x)$ trên dữ liệu (MLE). Bài 32: độ lệch $\operatorname{KL}(P \| Q) \ge 0$, bằng 0 khi hai phân phối trùng nhau.</p>
          <p>Bài 37: mạng tự mã hoá nén $x$ thành mã $z$ rồi giải mã — nhưng mã của nó không có phân phối rõ ràng để <b>rút</b> mã mới.</p>
        focus: ["1.1", "1.2", 2]
        say: "Nhắc lại bài 17, ước lượng hợp lý cực đại làm lớn lôgarit khả năng của dữ liệu. Bài 32, độ lệch giữa hai phân phối luôn không âm. Bài 37, mạng tự mã hoá nén dữ liệu thành mã, nhưng mã đó không có phân phối rõ ràng để rút mã mới."
      - show: |
          <table class="t"><tr><th>làm thử</th><th>kết quả</th></tr>
          <tr><td>độ lệch KL của $(0{,}9;\ 0{,}1)$ so với $(0{,}5;\ 0{,}5)$ (bài 32)</td><td>$\approx 0{,}368$</td></tr>
          <tr><td>độ lệch KL của một phân phối với chính nó</td><td>$0$</td></tr>
          <tr><td>$\mathcal{N}(2, 9)$: tâm, độ lệch chuẩn (bài 14)</td><td>tâm 2, độ lệch chuẩn $\sqrt{9} = 3$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Làm thử từng điều bằng số. Ở bài 32, độ lệch của phân phối 0 phẩy 9 và 0 phẩy 1 so với phân phối đều là khoảng 0 phẩy 368. Độ lệch của một phân phối với chính nó bằng 0, nhỏ nhất có thể. Và theo bài 14, phân phối chuẩn có tâm 2, phương sai 9 thì có độ lệch chuẩn bằng căn 9, bằng 3."

  # ───────────────────────── 3. ELBO ─────────────────────────
  - id: sym_elbo
    kind: symbol
    title: "Giải mã: ELBO — cận dưới của ln p(x)"
    checks:
      - "(lambda z, m, s: sp.simplify(sp.integrate((sp.exp(-(z - m)**2/(2*s**2))/sp.sqrt(2*sp.pi*s**2))*(sp.log(sp.exp(-(z - m)**2/(2*s**2))/sp.sqrt(2*sp.pi*s**2)) - sp.log(sp.exp(-z**2/2)/sp.sqrt(2*sp.pi))).expand(force=True), (z, -sp.oo, sp.oo)) - Rational(1, 2)*(s**2 + m**2 - 1 - sp.log(s**2))) == 0)(sp.Symbol('z', real=True), sp.Symbol('m', real=True), sp.Symbol('s', positive=True))"
    steps:
      - show: |
          <div class="box key">$\ln p(x) \ \ge\ \underbrace{\mathbb{E}_{q}\big[\ln p(x \mid z)\big]}_{\text{giải mã tốt}} - \underbrace{\operatorname{KL}\big(q(z \mid x)\,\|\,p(z)\big)}_{\text{mã gần } \mathcal{N}(0, 1)}$ &nbsp; (ELBO)</div>
          <p>Với $q = \mathcal{N}(\mu, \sigma^2)$, $p(z) = \mathcal{N}(0, 1)$: $\ \operatorname{KL} = \frac{1}{2}\big(\sigma^2 + \mu^2 - 1 - \ln\sigma^2\big)$ (máy kiểm bằng tích phân).</p>
          <p class="note">Vế phải là “cận dưới”: làm nó lớn thì hoặc $\ln p(x)$ được đẩy lên, hoặc cận sát hơn ($q$ gần hậu nghiệm hơn). Vế KL buộc mã của mọi ảnh nằm quanh $\mathcal{N}(0, 1)$ — nên sau này rút $z$ từ $\mathcal{N}(0, 1)$ rồi giải mã là ra ảnh mới.</p>
        introduces: [expect]
        focus: [1, 1, 2, 3]
        say: "Mạng tự mã hoá biến phân làm lớn một cận dưới của lôgarit khả năng, gồm hai phần. Phần đầu đo giải mã tốt. Phần sau là độ lệch giữa phân phối mã và phân phối chuẩn tắc, có công thức gọn trên màn hình. Vế này buộc mã nằm quanh phân phối chuẩn, nên sau này rút mã từ đó là ra ảnh mới."

