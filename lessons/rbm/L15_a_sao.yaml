  - {sentence: "Từ ô hàng 1 cột 0 tới ô hàng 1 cột 3, chênh hàng là 0, chênh cột là 3, cộng lại là 3.", reason: "ASR chép “Từ ô hàng một cục không tới ô hàng một cục ba, trên hàng là không, trên cục là ba, cộng lại là ba.” (0.792): lệch âm/thanh thuần Việt: cột/cục, cột/cục, chênh/trên, chênh cột/trên cục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở S, f chỉ bằng 3, vì khoảng cách Manhattan không biết có tường chắn, nó lạc quan hơn sự thật.", reason: "ASR chép “Ở S, F chỉ bằng 3, vì khoảng cách mang hát tầng không biết có tường trắng, nó lạc quan hơn sự thật.” (0.87): Manhattan đọc “Man-hát-tần” theo lexicon chung, ASR viết “mang hát tân/tầng”; lệch âm/thanh thuần Việt: chắn/trắng — NOT_VERIFIED bằng tai người"}
  - {sentence: "A sao luôn ưu tiên ô có f nhỏ, nên nó bám theo những ô có cột cao đúng bằng đường dài thật.", reason: "ASR chép “À sao luôn ưu tiên ô có ép nhỏ nên nó bám theo những ô có cực cao đúng bằng đường dài thật.” (0.913): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: cột/cực — NOT_VERIFIED bằng tai người"}
