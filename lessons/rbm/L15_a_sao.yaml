source: "curriculum/rbm.yaml L15; audit/rbm/verify_rbm.py L15; P. E. Hart, N. J. Nilsson, B. Raphael (1968); S. Russell, P. Norvig, Artificial Intelligence: A Modern Approach (2021), mục 3.5"
assumes: [arith, sub, geq, implies]
# Quy ước: lưới ô vuông, đi 4 hướng, mỗi bước giá 1; ô (hàng, cột) đếm từ 0; S = xuất phát, Đ = đích.
#   g(n): giá tốt nhất TÌM ĐƯỢC tới ô n (như d[v] của Dijkstra, CS112 bài 24); h(n): ước lượng còn lại; f(n) = g(n) + h(n).
#   Hoà f thì chọn ô có g lớn hơn (gần đích hơn), rồi theo (hàng, cột). Mọi số do alg.astar_grid và alg.bfs_grid tính.
objectives:
  - "Chạy A* với ước lượng Manhattan"
  - "Giải thích điều kiện ước lượng không vượt quá giá thật"
  - "Thấy A* mở ít ô hơn Dijkstra"
