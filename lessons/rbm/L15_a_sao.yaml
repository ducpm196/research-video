  - {sentence: "Đáp án câu một, ô này cách S đúng một bước nên g bằng 1.", reason: "ASR chép “Đáp án câu 1, o này cách x đúng 1 bước nên dê bằng 1.” (0.933): “ô” (ô lưới) ASR viết chữ “O” — NOT_VERIFIED bằng tai người"}
