  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một bước với x′ = −x, h = 0,1"
    checks:
      - "[round(k, 5) for k in alg.rk4_stages(lambda t, x: -x, 1.0, 0.1)] == [-1.0, -0.95, -0.9525, -0.90475]"
      - "round(alg.rk4_ode(lambda t, x: -x, 1.0, 0.1, 1)[-1], 7) == 0.9048375 and round(math.exp(-0.1), 7) == 0.9048374"
      - "abs(alg.rk4_ode(lambda t, x: -x, 1.0, 0.1, 1)[-1] - math.exp(-0.1)) < 1e-7"
      - "round(-1 - 2 * 0.95 - 2 * 0.9525 - 0.90475, 5) == -5.70975"
      - "round(1 + 0.05 * -1, 9) == 0.95 and round(1 + 0.05 * -0.95, 9) == 0.9525 and round(1 + 0.1 * -0.9525, 9) == 0.90475"
    steps:
      - show: |
          <p><b>Bước 1 —</b> đầu bước $x = 1$, $h = 0{,}1$: $k_1 = f(1) = -1$.</p>
        say: "Bước một, bắt đầu từ x bằng 1 với h bằng 0 phẩy 1, độ dốc đầu tiên k 1 bằng âm 1, giống hệt Euler."
      - show: |
          <p><b>Bước 2 —</b> đi nửa bước ($0{,}05$) theo $k_1$:</p>
          $$1 + 0{,}05 \cdot (-1) = 0{,}95 \Rightarrow k_2 = -0{,}95$$
        introduces: [implies]
        focus: [1, 2]
        say: "Bước hai, đi nửa bước, tức 0 phẩy 05, theo k 1. Ta tới 0 phẩy 95, nên độ dốc ở đó là k 2 bằng âm 0 phẩy 95."
      - show: |
          <p><b>Bước 3 —</b> quay về đầu bước, đi nửa bước theo $k_2$: $1 + 0{,}05 \cdot (-0{,}95) = 0{,}9525$, nên $k_3 = -0{,}9525$.</p>
        say: "Bước ba, quay về đầu bước rồi đi nửa bước theo k 2, ta tới 0 phẩy 9525, nên k 3 bằng âm 0 phẩy 9525."
      - show: |
          <p><b>Bước 4 —</b> đi cả bước theo $k_3$:</p>
          $$1 + 0{,}1 \cdot (-0{,}9525) = 0{,}90475 \Rightarrow k_4 = -0{,}90475$$
        focus: [1, 2]
        say: "Bước bốn, đi cả bước theo k 3 từ đầu bước. Ta tới 0 phẩy 90475, nên k 4 bằng âm 0 phẩy 90475."
      - clear: true
        show: |
          <p><b>Bước 5 —</b> trộn với trọng số 1, 2, 2, 1:</p>
          $$x_{\text{mới}} = 1 + \dfrac{0{,}1}{6}(-1 - 1{,}9 - 1{,}905 - 0{,}90475) = 1 - \dfrac{0{,}1 \cdot 5{,}70975}{6} = \hl{0{,}9048375}$$
        focus: [1, 2]
        say: "Bước năm, thay vào công thức với trọng số 1, 2, 2, 1. Tổng có trọng số là âm 5 phẩy 70975, nhân 0 phẩy 1 rồi chia 6, lấy 1 trừ đi, ta được 0 phẩy 9048375."
      - show: |
          <p><b>Bước 6 —</b> so sánh: nghiệm đúng $e^{-0{,}1} \approx 0{,}9048374$: sai số dưới $10^{-7}$. Euler cùng bước cho $0{,}9$, sai gần $0{,}005$.</p>
        say: "Bước sáu, so với nghiệm đúng là e mũ âm 0 phẩy 1, xấp xỉ 0 phẩy 9048374, sai số dưới một phần mười triệu. Euler cùng bước cho 0 phẩy 9, sai gần 0 phẩy 005."

  - id: check
    kind: check
    title: "Tự kiểm: một hệ số nhân, và đi ngược về"
    checks:
      - "round(1 - 0.1 + 0.1 ** 2 / 2 - 0.1 ** 3 / 6 + 0.1 ** 4 / 24, 7) == 0.9048375"
      - "round(0.1 ** 3 / 6, 7) == 0.0001667 and round(0.1 ** 4 / 24, 7) == 0.0000042"
      - "round(1 + 0.1 + 0.1 ** 2 / 2 + 0.1 ** 3 / 6 + 0.1 ** 4 / 24, 7) == 1.1051708 and round(0.9048375 * 1.1051708, 7) == 1.0"
      - "abs(alg.rk4_ode(lambda t, x: -x, alg.rk4_ode(lambda t, x: -x, 1.0, 0.1, 1)[-1], -0.1, 1)[-1] - 1) < 1e-7"
    steps:
      - show: |
          <p>Đường thứ nhất: với $x' = -x$, cả bước RK4 là <b>nhân $x$ với một hệ số</b> $1 + z + \frac{z^2}{2} + \frac{z^3}{6} + \frac{z^4}{24}$, $z = h \cdot (-1) = -0{,}1$ (thay bốn độ dốc dạng chữ vào là ra).</p>
          <table class="t"><tr><th>$1$</th><th>$z$</th><th>$\frac{z^2}{2}$</th><th>$\frac{z^3}{6}$</th><th>$\frac{z^4}{24}$</th><th>tổng</th></tr>
          <tr><td>1</td><td>−0,1</td><td>0,005</td><td>−0,0001667</td><td>0,0000042</td><td>0,9048375 ✓</td></tr></table>
        focus: [1, 1, 1, "2.2"]
        say: "Làm sao kiểm 0 phẩy 9048375 mà không tính lại bốn độ dốc? Với x phẩy bằng âm x, mọi độ dốc đều tỉ lệ với x, nên cả bước RK4 chỉ là nhân x với một hệ số cố định. Hệ số đó là 1 cộng z cộng z bình phương chia 2, cộng z lập phương chia 6, cộng z mũ 4 chia 24, với z bằng âm 0 phẩy 1. Cộng năm số hạng trong bảng, ta được đúng 0 phẩy 9048375."
      - show: |
          <p>Đường thứ hai: <b>đi ngược</b> một bước, $h = -0{,}1$ (tức $z = +0{,}1$), phải về lại gần 1.</p>
          <table class="t"><tr><th>hệ số đi ngược</th><th>nhân với $0{,}9048375$</th></tr>
          <tr><td>$1 + 0{,}1 + 0{,}005 + 0{,}0001667 + 0{,}0000042 \approx 1{,}1051708$</td><td>$\approx 1{,}0000000$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.2"]
        say: "Đường thứ hai, chạy ngược một bước với h bằng âm 0 phẩy 1, tức z bằng dương 0 phẩy 1. Khi đó ta phải về lại điểm xuất phát, vì đi tới rồi đi lùi cùng một khoảng thời gian. Hệ số lúc này xấp xỉ 1 phẩy 1051708. Nhân với 0 phẩy 9048375, ta được 1 tới bảy chữ số sau dấu phẩy, đúng điểm xuất phát."

  # ───────────────────────── 4. SO SÁNH ─────────────────────────
  - id: compare
    kind: concept
    title: "Bậc 4: giảm h một nửa, sai số chia 16"
    checks:
      - "['%.1e' % abs(alg.rk4_ode(lambda t, x: -x, 1.0, h, round(1 / h))[-1] - math.exp(-1)) for h in (0.2, 0.1, 0.05)] == ['5.8e-06', '3.3e-07', '2.0e-08']"
      - "15 < abs(alg.rk4_ode(lambda t, x: -x, 1.0, 0.2, 5)[-1] - math.exp(-1)) / abs(alg.rk4_ode(lambda t, x: -x, 1.0, 0.1, 10)[-1] - math.exp(-1)) < 18"
      - "round(abs(alg.euler_ode(lambda t, x: -x, 1.0, 0.025, 40)[-1] - math.exp(-1)), 4) == 0.0046"
    steps:
      - show: |
          <table class="t"><tr><th>bước $h$</th><th>sai số RK4 tại $t = 1$</th></tr>
          <tr><td>0,2</td><td>$5{,}8 \cdot 10^{-6}$</td></tr>
          <tr><td>0,1</td><td>$3{,}3 \cdot 10^{-7}$</td></tr>
          <tr><td>0,05</td><td>$2{,}0 \cdot 10^{-8}$</td></tr></table>
          <p>Mỗi lần giảm $h$ một nửa, sai số chia khoảng 16 $= 2^4$: sai số tỉ lệ với $h^4$, nên gọi là <b>bậc 4</b>.</p>
          <div class="box key">Cùng công sức 40 lần tính $f$: Euler 40 bước, sai số $0{,}0046$; RK4 10 bước, sai số $3{,}3 \cdot 10^{-7}$ — nhỏ hơn hơn mười nghìn lần.</div>
        focus: [1, "1.2", "1.4", 2, 3, 3]
        say: "Bảng này chạy RK4 cho cả đoạn tới t bằng 1 với ba bước. Với h bằng 0 phẩy 2, sai số cỡ 6 phần triệu. Với h bằng 0 phẩy 05, sai số chỉ còn cỡ 2 phần trăm triệu. Mỗi lần giảm h một nửa, sai số chia khoảng 16, tức 2 mũ 4, nên ta nói sai số tỉ lệ với h mũ 4, và gọi là phương pháp bậc 4. So cùng công sức, 40 lần tính f, Euler chạy 40 bước, sai số 0 phẩy 0046. RK4 chạy 10 bước, sai số chỉ 3 phẩy 3 nhân 10 mũ âm 7, nhỏ hơn hơn mười nghìn lần."

  # ───────────────────────── 5. HỆ CỨNG ─────────────────────────
  - id: stiff
    kind: concept
    title: "Bậc cao không cứu được bước quá lớn"
    checks:
      - "abs((1 - 5 + 25 / 2 - 125 / 6 + 625 / 24) - 13.708333333333) < 1e-9"
      - "[round(v, 1) for v in alg.rk4_ode(lambda t, x: -50 * x, 1.0, 0.1, 3)] == [1.0, 13.7, 187.9, 2576.0]"
      - "round(alg.rk4_ode(lambda t, x: -50 * x, 1.0, 0.05, 1)[-1], 3) == 0.648"
      - "round(math.exp(-5), 4) == 0.0067"
      - "all(abs(alg.rk4_ode(lambda t, x: l * x, 1.0, h, 1)[-1] - sum((h * l) ** k / math.factorial(k) for k in range(5))) < 1e-12 for l in (-1, -50, 2) for h in (0.1, 0.05))"
    steps:
      - show: |
          <p>Hệ <b>cứng</b>: có phần thay đổi rất nhanh, như $x' = -50x$. Sau mỗi $0{,}1$ giây, nghiệm đúng bị nhân với $e^{-5} \approx 0{,}0067$.</p>
          <p>Với $x' = \lambda x$, một bước RK4 nhân $x$ với $1 + z + \frac{z^2}{2} + \frac{z^3}{6} + \frac{z^4}{24}$, $z = h\lambda$ (thay bốn độ dốc vào là ra). $h = 0{,}1$: $z = -5$, hệ số $1 - 5 + \frac{25}{2} - \frac{125}{6} + \frac{625}{24} \approx 13{,}7$. Sau 3 bước $x \approx 2576$ — phân kỳ.</p>
          <p>Giảm $h = 0{,}05$: mỗi bước nhân $\approx 0{,}648$ — ổn định trở lại.</p>
          <div class="box warn">Bậc cao giúp khi $h$ đã đủ nhỏ để ổn định. Nó không thay được việc chọn $h$ đủ nhỏ so với phần nhanh nhất của hệ.</div>
        focus: [1, 1, 2, 2, 2, 2, 3, 4, 4]
        say: "Một hệ gọi là cứng khi có phần thay đổi rất nhanh, như x phẩy bằng âm 50 x. Sau mỗi 0 phẩy 1 giây, nghiệm đúng bị nhân với e mũ âm 5, xấp xỉ 0 phẩy 0067. Với hệ x phẩy bằng lambda x, thay bốn độ dốc vào công thức, ta thấy mỗi bước RK4 nhân x với một hệ số cố định. Hệ số đó là 1 cộng z cộng z bình phương chia 2, cộng z lập phương chia 6, cộng z mũ 4 chia 24, với z bằng h nhân lambda. Ở đây h bằng 0 phẩy 1 nên z bằng âm 5, và hệ số bằng khoảng 13 phẩy 7. Sau 3 bước, x đã lên khoảng 2576, tức phân kỳ. Giảm h còn 0 phẩy 05, mỗi bước nhân khoảng 0 phẩy 648, ổn định trở lại. Vậy bậc cao chỉ giúp khi bước đã đủ nhỏ để ổn định. Nó không thay được việc chọn h đủ nhỏ so với phần nhanh nhất của hệ."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(-(1 - 0.1 * 1) - (-0.9)) < 1e-12 and abs(-(1 - 0.05) - (-0.95)) < 1e-12"
      - "abs((1 + 1 + 1 + 1) / 4 - 1) < 1e-12 and (1 + 2 + 2 + 1) == 6"
      - "round(1 + 0.1 * sum(alg.rk4_stages(lambda t, x: -x, 1.0, 0.1)) / 4, 7) == 0.9048188 and round(abs(1 + 0.1 * sum(alg.rk4_stages(lambda t, x: -x, 1.0, 0.1)) / 4 - math.exp(-0.1)), 6) == 0.000019"
      - "abs(1 + 0.1 * sum(alg.rk4_stages(lambda t, x: -x, 1.0, 0.1)) / 4 - math.exp(-0.1)) > 100 * abs(alg.rk4_ode(lambda t, x: -x, 1.0, 0.1, 1)[-1] - math.exp(-0.1))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đi cả bước khi tính $k_2$ <b class="red">(sai)</b>
          <br><span class="note">$k_2$ dùng $x + \frac{h}{2}k_1$, nửa bước. Dùng $x + h k_1$ là đọc độ dốc sai chỗ.</span></div>
        say: "Lỗi thứ nhất, đi cả bước khi tính k 2. K 2 phải dùng x cộng h chia 2 nhân k 1, tức nửa bước. Đi cả bước là đọc độ dốc sai chỗ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy trung bình cộng bốn độ dốc <b class="red">(sai)</b>
          <br><span class="note">Trọng số là $1, 2, 2, 1$ chia 6, không phải chia đều cho 4.</span></div>
          <table class="t"><tr><th>$x' = -x$, $h = 0{,}1$</th><th>kết quả</th><th>sai số</th></tr>
          <tr><td>trọng số 1, 2, 2, 1 chia 6</td><td>0,9048375</td><td>dưới $10^{-7}$</td></tr>
          <tr><td>chia đều cho 4</td><td>0,9048188</td><td>$\approx 0{,}000019$</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, lấy trung bình cộng đều bốn độ dốc. Trọng số đúng là 1, 2, 2, 1, chia cho 6, không phải chia đều cho 4. Thử ngay ví dụ vừa rồi, chia đều cho 4 ra 0 phẩy 9048188, sai gần hai phần trăm nghìn, lớn hơn cách đúng cả trăm lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên thời gian khi $f$ phụ thuộc $t$ <b class="red">(sai)</b>
          <br><span class="note">Với $x' = f(t, x)$: $k_2$, $k_3$ đọc ở $t + \frac{h}{2}$, còn $k_4$ đọc ở $t + h$.</span></div>
        say: "Lỗi thứ ba, quên thời gian khi f phụ thuộc vào t. Khi đó k 2 và k 3 phải đọc ở t cộng nửa bước, còn k 4 đọc ở t cộng cả bước."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin bậc cao thay cho kiểm ổn định <b class="red">(sai)</b>
          <br><span class="note">Hệ cứng với $h$ lớn vẫn phân kỳ, dù dùng RK4.</span></div>
        say: "Lỗi thứ tư, tin rằng bậc cao thay được việc kiểm ổn định. Hệ cứng với bước lớn vẫn phân kỳ, dù ta dùng RK4."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.rk4_stages(lambda t, x: x, 1.0, 1.0) == (1.0, 1.5, 1.75, 2.75)"
      - "round(alg.rk4_ode(lambda t, x: x, 1.0, 1.0, 1)[-1], 4) == 2.7083 and round(math.e, 4) == 2.7183"
      - "alg.euler_ode(lambda t, x: x, 1.0, 1.0, 1)[-1] == 2.0"
      - "1 + 2 * 1.5 + 2 * 1.75 + 2.75 == 10.25 and round(1 + 10.25 / 6, 4) == 2.7083 and round(math.e - 2.7083, 2) == 0.01 and round(math.e - 2, 2) == 0.72"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$x' = x$, $x(0) = 1$, một bước RK4 với $h = 1$. Tính $k_1$ tới $k_4$ và $x(1)$. So với $e \approx 2{,}7183$ và với Euler.</td></tr>
          <tr><td>2</td><td>Nếu giảm $h$ một nửa, sai số RK4 nhỏ đi khoảng bao nhiêu lần?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với x phẩy bằng x và x tại 0 bằng 1, chạy một bước RK4 với h bằng 1. Tính bốn độ dốc và x tại 1, rồi so với số e xấp xỉ 2 phẩy 7183 và với Euler. Câu hai, nếu giảm h một nửa thì sai số RK4 nhỏ đi khoảng bao nhiêu lần? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>độ dốc</th><th>đi thử tới</th><th>giá trị</th></tr>
          <tr><td>$k_1$</td><td>đầu bước: 1</td><td>1</td></tr>
          <tr><td>$k_2$</td><td>$1 + 0{,}5 \cdot 1 = 1{,}5$</td><td>1,5</td></tr>
          <tr><td>$k_3$</td><td>$1 + 0{,}5 \cdot 1{,}5 = 1{,}75$</td><td>1,75</td></tr>
          <tr><td>$k_4$</td><td>$1 + 1 \cdot 1{,}75 = 2{,}75$</td><td>2,75</td></tr></table>
        focus: [1, ["1.2", "1.3", "1.4", "1.5"]]
        say: "Đáp án câu một, vì x phẩy bằng x nên độ dốc ở đâu cũng bằng chính giá trị ở đó. Đáp số là k 1 bằng 1, k 2 bằng 1 phẩy 5, k 3 bằng 1 phẩy 75, k 4 bằng 2 phẩy 75."
      - show: |
          <p>$x(1) \approx 1 + \dfrac{1 + 3 + 3{,}5 + 2{,}75}{6} = 1 + \dfrac{10{,}25}{6} = \hl{2{,}7083}$. Sai $0{,}01$; Euler cho $2$, sai $0{,}72$.</p>
        say: "Thay vào, tổng có trọng số là 10 phẩy 25, chia 6 rồi cộng 1, x tại 1 xấp xỉ 2 phẩy 7083, chỉ sai khoảng 0 phẩy 01 dù bước rất lớn. Euler cùng bước cho 2, sai tới 0 phẩy 72."
      - show: |
          <p>② Bậc 4: sai số tỉ lệ $h^4$, giảm $h$ một nửa thì sai số chia $2^4 = \hl{16}$ lần.</p>
        say: "Câu hai, vì là bậc 4 nên sai số tỉ lệ với h mũ 4, và giảm h một nửa thì sai số nhỏ đi khoảng 2 mũ 4, tức 16 lần."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bốn độ dốc trong bước</span><span class="a">→</span>
          <span class="n">trọng số $1, 2, 2, 1$ chia 6</span><span class="a">→</span>
          <span class="n">sai số tỉ lệ $h^4$</span><span class="a">→</span>
          <span class="n">vẫn phải chọn $h$ đủ nhỏ để ổn định</span></div>
        say: "Tổng kết lại, RK4 đọc bốn độ dốc trong một bước, lấy trọng số 1, 2, 2, 1 rồi chia 6. Sai số tỉ lệ với h mũ 4, nhưng ta vẫn phải chọn h đủ nhỏ để ổn định."
      - show: |
          <div class="box key"><b>Tư duy:</b> so phương pháp theo <b>cùng công sức</b>, không theo cùng số bước. RK4 tốn gấp 4 mỗi bước nhưng thắng xa khi cần độ chính xác cao.</div>
        say: "Điều cần mang theo, hãy so các phương pháp theo cùng công sức, không theo cùng số bước. RK4 tốn gấp 4 lần mỗi bước, nhưng thắng xa khi cần độ chính xác cao."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>hệ tuyến tính</b> nhiều biến $\mathbf{x}' = \mathbf{A}\mathbf{x}$ — trị riêng quyết định ổn định.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học hệ tuyến tính nhiều biến, x phẩy bằng A nhân x, và xem trị riêng quyết định hệ ổn định hay không. Hẹn gặp bạn ở bài tiếp theo."
