,250.2 606.0,251.7 612.2,253.2 618.4,254.7 624.6,256.1 630.8,257.5 637.0,259.0 643.2,260.4 649.4,261.7 655.6,263.1 661.8,264.5 668.0,265.8 674.2,267.2 680.4,268.5 686.6,269.8 692.8,271.1 699.0,272.4 705.2,273.6 711.4,274.9 717.6,276.1 723.8,277.4 730.0,278.6" fill="none" stroke="#9ca3af" stroke-width="4"/><line x1="110.0" y1="70.0" x2="420.0" y2="235.0" stroke="#2a78d6" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#r1)"/><line x1="110.0" y1="70.0" x2="420.0" y2="152.5" stroke="#eb6834" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#r2)"/><line x1="110.0" y1="70.0" x2="730.0" y2="317.5" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#r3)"/><line x1="66.6" y1="46.9" x2="153.4" y2="93.1" stroke="#1f2937" stroke-width="6"/><line x1="376.6" y1="223.4" x2="463.4" y2="246.6" stroke="#1f2937" stroke-width="6"/><line x1="376.6" y1="135.2" x2="463.4" y2="169.8" stroke="#1f2937" stroke-width="6"/><line x1="686.6" y1="311.7" x2="773.4" y2="323.3" stroke="#1f2937" stroke-width="6"/><circle cx="110.0" cy="70.0" r="7" fill="#1f2937"/><circle cx="420.0" cy="235.0" r="7" fill="#2a78d6"/><circle cx="420.0" cy="152.5" r="7" fill="#eb6834"/><circle cx="730.0" cy="317.5" r="7" fill="#7c3aed"/><circle cx="730.0" cy="276.2" r="10" fill="#15803d"/><text x="748" y="270" font-size="23" text-anchor="start" fill="#15803d" font-weight="bold">RK4: 0,375</text><text x="748" y="298" font-size="21" text-anchor="start" fill="#4b5563">(đúng: 0,368)</text><circle cx="730.0" cy="400.0" r="8" fill="#b91c1c"/><text x="746" y="388" font-size="22" text-anchor="start" fill="#b91c1c" font-weight="bold">Euler: 0</text><text x="132" y="58" font-size="22" text-anchor="start" fill="#1f2937" font-weight="bold">k1 = −1</text><text x="406" y="269" font-size="22" text-anchor="end" fill="#2a78d6" font-weight="bold">k2 = −0,5</text><text x="436" y="138" font-size="22" text-anchor="start" fill="#eb6834" font-weight="bold">k3 = −0,75</text><text x="748" y="344" font-size="2