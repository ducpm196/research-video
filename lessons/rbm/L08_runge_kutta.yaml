  - {sentence: "Công thức là x mới bằng x cộng h nhân f của x.", reason: "ASR chép “Công thức là ít mới bằng ít cộng hát nhân ép cuối.” (0.88): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: của (trong “của x” → “cuối”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đi cả bước là đọc độ dốc sai chỗ.", reason: "đọc → “độc”, dốc → “chốc”: nhầm thanh và phụ âm đầu của ASR ở câu 8 từ (≥ 0,7); “độ dốc” chép đúng ở các câu khác của L08 — NOT_VERIFIED bằng tai người"}
  - {sentence: "K 2 có được khi đi nửa bước theo k 1, rồi đọc độ dốc ở giữa bước.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bảng này chạy RK4 cho cả đoạn tới t bằng 1 với ba bước.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Đứng ở x, với bước h, ta đọc bốn độ dốc.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "K 1 là độ dốc ở đầu bước, giống hệt Euler.", reason: "Euler đọc “Ơ-le” (probe p1_ten 8/8); ASR chép “ơ le/ở Lê/ở lè”, cùng âm hoặc lệch thanh"}
  - {sentence: "Với hệ x phẩy bằng lambda x, thay bốn độ dốc vào công thức, ta thấy mỗi bước RK4 nhân x với một hệ số cố định.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Euler cùng bước cho 2, sai tới 0 phẩy 72.", reason: "Euler đọc “Ơ-le” (probe p1_ten 8/8); ASR chép “ơ le/ở Lê/ở lè”, cùng âm hoặc lệch thanh"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Euler quá đắt"
    steps:
      - show: |
          <p>Bài 7: Euler sai số tỉ lệ với $h$. Muốn sai số $10^{-6}$ cho bài $x' = -x$ tới $t = 1$, cần cỡ <b>hai trăm nghìn</b> bước.</p>
          <p>Lý do: Euler chỉ đọc độ dốc ở <b>đầu</b> bước, trong khi độ dốc thay đổi suốt bước.</p>
          <div class="box key">Hôm nay: <b>Runge–Kutta bậc 4</b> — đọc bốn độ dốc trong mỗi bước, lấy trung bình có trọng số.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ở bài 7 ta thấy sai số của Euler tỉ lệ với h. Muốn sai số cỡ một phần triệu cho bài x phẩy bằng âm x tới t bằng 1, ta cần cỡ hai trăm nghìn bước. Lý do là Euler chỉ đọc độ dốc ở đầu bước, trong khi độ dốc thay đổi suốt cả bước. Hôm nay ta học phương pháp RK4, mang tên hai nhà toán học trên màn hình, đọc bốn độ dốc trong mỗi bước rồi lấy trung bình có trọng số."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: một bước Euler và trung bình có trọng số"
    checks:
      - "alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 1) == [1.0, 0.9] and round(1 + 0.1 * (-1), 9) == 0.9"
      - "(0 * 1 + 3 * 2 + 3 * 2 + 12 * 1) / 6 == 4 and (0 + 3 + 3 + 12) / 4 == 4.5 and 1 + 2 + 2 + 1 == 6"
    steps:
      - show: |
          <p>Nhắc bài 7 — một bước Euler: đứng ở $x$, đọc độ dốc $f(x)$, đi thẳng một bước $h$.</p>
          <p>$$x_{\text{mới}} = x + h \cdot f(x)$$</p>
          <p class="note">Ví dụ $x' = -x$, $x = 1$, $h = 0{,}1$: độ dốc $-1$, nên $x_{\text{mới}} = 1 + 0{,}1 \cdot (-1) = 0{,}9$.</p>
        focus: [1, 2, 3]
        say: "Trước khi vào bài, ta nhắc lại phương pháp Euler của bài 7, đứng ở x, đọc độ dốc f của x, rồi đi thẳng một bước h theo độ dốc đó. Công thức là x mới bằng x cộng h nhân f của x. Ví dụ với x phẩy bằng âm x, đứng ở 1 với bước 0 phẩy 1, độ dốc là âm 1, nên x mới bằng 1 cộng 0 phẩy 1 nhân âm 1, bằng 0 phẩy 9."
      - show: |
          <p><b>Trung bình có trọng số:</b> số nào quan trọng hơn thì được đếm nhiều lần hơn, rồi chia cho tổng trọng số.</p>
          <table class="t"><tr><th>bốn số</th><th>cách lấy trung bình</th><th>kết quả</th></tr>
          <tr><td rowspan="2">0, 3, 3, 12</td><td>đều nhau: $\frac{0 + 3 + 3 + 12}{4}$</td><td>4,5</td></tr>
          <tr><td>trọng số 1, 2, 2, 1: $\frac{0 + 2 \cdot 3 + 2 \cdot 3 + 12}{1 + 2 + 2 + 1}$</td><td>$\frac{24}{6} = 4$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Điều thứ hai là trung bình có trọng số, số nào quan trọng hơn thì được đếm nhiều lần hơn, rồi chia cho tổng các trọng số. Với bốn số 0, 3, 3, 12, trung bình đều là 18 chia 4, bằng 4 phẩy 5. Nếu hai số giữa được đếm hai lần, ta có 0 cộng 6 cộng 6 cộng 12, bằng 24. Tổng trọng số là 1 cộng 2 cộng 2 cộng 1, bằng 6, nên trung bình có trọng số là 24 chia 6, bằng 4, khác với trung bình đều."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bốn độ dốc k₁ … k₄"
    checks:
      - "abs(math.exp(-1) - alg.euler_ode(lambda t, x: -x, 1.0, 1 / 100000, 100000)[-1]) > 1.5e-6"
      - "abs(math.exp(-1) - alg.euler_ode(lambda t, x: -x, 1.0, 1 / 192000, 192000)[-1]) < 1.1e-6"
    steps:
      - show: |
          <p>Đứng ở $x$, bước $h$:</p>
          <p>$k_1 = f(x)$ — độ dốc đầu bước (như Euler)</p>
          <p>$k_2 = f\!\left(x + \frac{h}{2}k_1\right)$ — đi nửa bước theo $k_1$, đọc độ dốc giữa bước</p>
          <p>$k_3 = f\!\left(x + \frac{h}{2}k_2\right)$ — đi nửa bước theo $k_2$, đọc lại độ dốc giữa bước</p>
          <p>$k_4 = f(x + h\,k_3)$ — đi cả bước theo $k_3$, đọc độ dốc cuối bước</p>
        focus: [1, 2, 3, 4, 5]
        say: "Đứng ở x, với bước h, ta đọc bốn độ dốc. K 1 là độ dốc ở đầu bước, giống hệt Euler. K 2 có được khi đi nửa bước theo k 1, rồi đọc độ dốc ở giữa bước. K 3 đi nửa bước theo k 2, đọc lại độ dốc ở giữa bước cho chính xác hơn. K 4 đi cả bước theo k 3, đọc độ dốc ở cuối bước."
      - show: |
          <p>Bước mới lấy trung bình có trọng số $1, 2, 2, 1$:</p>
          <p>$x_{\text{mới}} = x + \dfrac{h}{6}\left(k_1 + 2k_2 + 2k_3 + k_4\right)$</p>
          <div class="box key">Hai độ dốc giữa bước nặng gấp đôi, tổng trọng số $1 + 2 + 2 + 1 = 6$, nên chia 6. Đây là cùng ý với quy tắc Simpson khi tính tích phân.</div>
        focus: [1, 2, 3, 3]
        say: "Bước mới lấy trung bình có trọng số 1, 2, 2, 1 của bốn độ dốc, nhân với h. Hai độ dốc ở giữa bước được tính nặng gấp đôi. Tổng các trọng số là 6, nên ta chia cho 6. Đây cũng là ý tưởng của cách tính gần đúng tích phân bằng những đoạn cong bậc hai."

  - id: intuition
    kind: intuition
    title: "Hình dung: ba lần đi thăm dò trước khi bước thật"
    checks:
      - "alg.rk4_stages(lambda t, x: -x, 1.0, 1.0) == (-1.0, -0.5, -0.75, -0.25)"
      - "alg.rk4_ode(lambda t, x: -x, 1.0, 1.0, 1)[-1] == 0.375 and alg.euler_ode(lambda t, x: -x, 1.0, 1.0, 1)[-1] == 0.0 and round(math.exp(-1), 3) == 0.368"
      - "1 + 1.0 / 6 * (-1 - 2 * 0.5 - 2 * 0.75 - 0.25) == 0.375"
    steps:
      - show: |
