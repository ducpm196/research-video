# Quy ước như bài 7: x' = f(x), bước h, x_k ≈ x(k·h). Bốn độ dốc k_1..k_4 (chữ k thường + chỉ số; k ở bài này KHÔNG phải
#   số thứ tự bước — số thứ tự bước viết bằng lời “bước sau”). Mọi số do alg.rk4_stages / rk4_ode / euler_ode tính.
objectives:
  - "Cài đặt một bước Runge–Kutta bậc 4"
  - "So sai số với Euler cùng bước và cùng công sức"
  - "Biết bậc cao không cứu được bước quá lớn với hệ cứng"
