          <p><b>Bước 1 —</b> $\mathbf{R}(90^\circ) = \begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$, nên $\mathbf{R}(90^\circ)(1, 0)^T = (0, 1)^T$.</p>
        focus: [1, 2, 2]
        say: "Bước một, ta thử trước với góc 90 độ cho dễ thấy. Cos 90 độ bằng 0 và sin 90 độ bằng 1, nên ma trận là 0, âm 1 ở hàng trên và 1, 0 ở hàng dưới. Nhân với điểm 1, 0, ta lấy đúng cột thứ nhất, được 0, 1, tức trục ngang quay thành trục đứng."
      - clear: true
        show: |
          <div><svg width="620" height="420" viewBox="0 0 620 420"><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1f2937"/></marker><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2a78d6"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#eb6834"/></marker></defs><line x1="70.0" y1="300.0" x2="430.0" y2="300.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><line x1="150.0" y1="360.0" x2="150.0" y2="40.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><text x="424.0" y="330.0" font-size="22" fill="#6b7280" text-anchor="middle" stroke="#fffbeb" stroke-width="6" paint-order="stroke">x</text><text x="128.0" y="54.0" font-size="22" fill="#6b7280" text-anchor="middle" stroke="#fffbeb" stroke-width="6" paint-order="stroke">y</text><line x1="250.0" y1="306.0" x2="250.0" y2="294.0" stroke="#6b7280" stroke-width="2"/><text x="250.0" y="330.0" font-size="19" fill="#6b7280" text-anchor="middle" stroke="#fffbeb" stroke-width="6" paint-order="stroke">1</text><line x1="350.0" y1="306.0" x2="350.0" y2="294.0" stroke="#6b7280" stroke-width="2"/><text x="350.0" y="330.0" font-size="19" fill="#6b7280" text-anchor="middle" stroke="#fffbeb" stroke-width="6" paint-order="stroke">2</text><line x1="144.0" y1="200.0" x2="156.0" y2="200.0" stroke="#6b7280" stroke-width="2"/><text x="132.0" y="207.0" font-size="19" fill="#6b7280" text-anchor="end" stroke="#fffbeb" stroke-width="6" paint-order="stroke">1</text><line x1="144.0" y1="100.0" x2="156.0" y2="100.0" stroke="#6b7280" stroke-width="2"/><text x="132.0" y="107.0" font-size="19" fill="#6b7280" text-anchor="end" stroke="#fffbeb" stroke-width="6" paint-order="stroke">2</text><line x1="150.0" y1="300.0" x2="350.0" y2="200.0" stroke="#2a78d6" stroke-width="4" marker-end="url(#ab)"/><line x1="150.0" y1="300.0" x2="273.2" y2="113.4" stroke="#eb6834" stroke-width="4" stroke-dasharray="12 7" marker-end="url(#ao)"/><polyline points="229.0,257.0 226.5,252.6 223.7,248.3 220.6,244.2 217.3,240.3 213.8,236.6 210.1,233.0 206.3,229.7 202.2,226.7" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/><text x="255.0" y="218.0" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">30°</text><text x="360.0" y="208.0" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">(2, 1)</text><text x="285.2" y="103.4" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">(1,232; 1,866)</text><circle cx="350.0" cy="200.0" r="7" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="273.2" cy="113.4" r="7" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/></svg></div>
          <p><b>Bước 2 —</b> $\mathbf{R}(30^\circ)(2, 1)^T = 2 \cdot (0{,}866;\ 0{,}5)^T + 1 \cdot (-0{,}5;\ 0{,}866)^T$</p>
        focus: [1, 2]
        say: "Bước hai, bây giờ quay điểm 2, 1 đi 30 độ. Theo cách đọc theo cột, ta lấy 2 lần cột thứ nhất cộng 1 lần cột thứ hai."
      - show: |
          <p><b>Bước 3 —</b> cộng từng toạ độ: $(1{,}732 - 0{,}5;\ 1 + 0{,}866)^T = \hl{(1{,}232;\ 1{,}866)^T}$</p>
        say: "Bước ba, cộng từng toạ độ, 2 nhân 0 phẩy 866 là 1 phẩy 732, trừ đi 0 phẩy 5 thì được 1 phẩy 232. Toạ độ thứ hai là 1 cộng 0 phẩy 866, bằng 1 phẩy 866."
      - show: |
          <p class="note"><b>Bước 4 —</b> độ dài giữ nguyên: $1{,}232^2 + 1{,}866^2 \approx 1{,}518 + 3{,}482 = 5$, đúng bằng $2^2 + 1^2 = 5$, nên cả hai điểm cách gốc $\sqrt{5} \approx 2{,}236$.</p>
        say: "Bước bốn, kiểm độ dài, 1 phẩy 232 bình phương xấp xỉ 1 phẩy 518, 1 phẩy 866 bình phương xấp xỉ 3 phẩy 482, cộng lại được 5. Điểm ban đầu có 2 bình phương cộng 1 bình phương cũng bằng 5, nên cả hai điểm đều cách gốc căn 5, xấp xỉ 2 phẩy 236, phép quay không làm dài hay ngắn mũi tên."

  - id: check
    kind: check
    title: "Tự kiểm: tính theo hàng, rồi quay ngược về"
    checks:
      - "round(2 * 0.866 - 1 * 0.5, 3) == 1.232 and round(2 * 0.5 + 1 * 0.866, 3) == 1.866"
      - "[round(v, 3) for v in alg.rot2(-30) @ [1.232, 1.866]] == [2.0, 1.0]"
      - "round(0.866 * 1.232 + 0.5 * 1.866, 3) == 2.0 and round(-0.5 * 1.232 + 0.866 * 1.866, 3) == 1.0"
      - "np.allclose(alg.rot2(-30), [[0.8660254, 0.5], [-0.5, 0.8660254]])"
    steps:
      - show: |
          <p>Đường thứ nhất: nhân <b>theo hàng</b> thay vì theo cột.</p>
          <table class="t"><tr><th>hàng của $\mathbf{R}(30^\circ)$</th><th>nhân với $(2, 1)^T$</th><th>kết quả</th></tr>
          <tr><td>$(0{,}866;\ -0{,}5)$</td><td>$2 \cdot 0{,}866 - 1 \cdot 0{,}5$</td><td>$1{,}232$ ✓</td></tr>
          <tr><td>$(0{,}5;\ 0{,}866)$</td><td>$2 \cdot 0{,}5 + 1 \cdot 0{,}866$</td><td>$1{,}866$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Làm sao biết kết quả 1 phẩy 232 và 1 phẩy 866 là đúng? Đường thứ nhất, ta nhân theo hàng thay vì theo cột, như đã ôn ở đầu bài. Hàng trên là 0 phẩy 866 và âm 0 phẩy 5, nhân với 2, 1 được 1 phẩy 732 trừ 0 phẩy 5, bằng 1 phẩy 232. Hàng dưới là 0 phẩy 5 và 0 phẩy 866, cho 1 cộng 0 phẩy 866, bằng 1 phẩy 866, khớp với cách theo cột."
      - show: |
          <p>Đường thứ hai: quay tiếp $-30^\circ$ phải về chỗ cũ. Thay $\theta = -30^\circ$: $\cos(-30^\circ) = 0{,}866$, $\sin(-30^\circ) = -0{,}5$.</p>
          <table class="t"><tr><th>hàng của $\mathbf{R}(-30^\circ)$</th><th>nhân với $(1{,}232;\ 1{,}866)^T$</th><th>kết quả</th></tr>
          <tr><td>$(0{,}866;\ 0{,}5)$</td><td>$0{,}866 \cdot 1{,}232 + 0{,}5 \cdot 1{,}866$</td><td>$\approx 2{,}000$ ✓</td></tr>
          <tr><td>$(-0{,}5;\ 0{,}866)$</td><td>$-0{,}5 \cdot 1{,}232 + 0{,}866 \cdot 1{,}866$</td><td>$\approx 1{,}000$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 2]
        say: "Đường thứ hai, quay thêm âm 30 độ thì điểm phải trở về đúng chỗ cũ. Thay theta bằng âm 30 độ, cos vẫn là 0 phẩy 866, còn sin đổi dấu thành âm 0 phẩy 5. Hàng trên của ma trận mới nhân với điểm vừa tìm được cho xấp xỉ 2. Hàng dưới cho xấp xỉ 1. Ta về lại đúng điểm 2, 1, nên phép quay 30 độ ở trên đã tính đúng."

  # ───────────────────────── 4. TÍNH CHẤT ─────────────────────────
  - id: props
    kind: concept
    title: "Hai dấu hiệu của một phép quay"
    checks:
      - "all(np.allclose(alg.rot2(t).T @ alg.rot2(t), np.eye(2)) for t in range(360))"
      - "all(abs(np.linalg.det(alg.rot2(t)) - 1) < 1e-12 for t in range(360))"
      - "np.allclose(alg.rot2(30).T, alg.rot2(-30))"
      - "abs(np.linalg.det(np.array([[1, 0], [0, -1]])) + 1) < 1e-12 and np.allclose(np.array([[1, 0], [0, -1]]).T @ np.array([[1, 0], [0, -1]]), np.eye(2))"
    steps:
      - show: |
          <p>① $\mathbf{R}^T\mathbf{R} = \mathbf{I}_2$: mỗi cột dài 1 và hai cột vuông góc, vì $\cos^2\theta + \sin^2\theta = 1$ và $\cos\theta\cdot(-\sin\theta) + \sin\theta\cdot\cos\theta = 0$.</p>
          <p>② $\det \mathbf{R} = \cos^2\theta + \sin^2\theta = 1$: không lật hình như gương.</p>
          <div class="box key">Từ ①: $\mathbf{R}^{-1} = \mathbf{R}^T = \mathbf{R}(-\theta)$ — quay ngược chỉ cần chuyển vị.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Mọi ma trận quay có hai dấu hiệu. Một, R chuyển vị nhân R bằng ma trận đơn vị, vì mỗi cột dài 1 và hai cột vuông góc với nhau. Hai, định thức của R bằng cos bình phương cộng sin bình phương, tức bằng 1, nghĩa là hình không bị lật như qua gương. Từ dấu hiệu một suy ra nghịch đảo của R chính là chuyển vị của nó. Đó cũng là phép quay góc âm theta, quay ngược lại."
      - show: |
          <p>Thử bằng số với $\theta = 30^\circ$: $0{,}866^2 + 0{,}5^2 = 0{,}75 + 0{,}25 = 1$.</p>
          <p>Gương $\begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}$ cũng có $\mathbf{M}^T\mathbf{M} = \mathbf{I}_2$ nhưng $\det = -1$: nó lật trục đứng, <b>không</b> phải phép quay.</p>
        focus: [1, 2, 2]
        say: "Làm thử ngay bằng số với 30 độ, 0 phẩy 75 cộng 0 phẩy 25 bằng 1. Chú ý, ma trận gương 1, 0, 0, âm 1 cũng có hai cột dài 1 và vuông góc. Nhưng định thức của nó bằng âm 1, nó lật trục đứng, nên không phải một phép quay."

  # ───────────────────────── 5. ĐỔI KHUNG ─────────────────────────
  - id: frames
    kind: concept
    title: "Đổi khung toạ độ: trả lời câu hỏi mở đầu"
    checks:
      - "[round(v, 3) for v in alg.rot2(30) @ [2, 1]] == [1.232, 1.866]"
      - "np.allclose(alg.rot2(30).T @ (alg.rot2(30) @ [2, 1]), [2, 1])"
    steps:
      - show: |
          <p>Khung W: bản đồ. Khung B: gắn trên robot, trục ngang chỉ phía trước, trục đứng chỉ bên trái. B quay $30^\circ$ so với W.</p>
          <p>Vật có toạ độ trong B là $\mathbf{p}_B = (2, 1)^T$. Đi 2 theo trục trước và 1 theo trục trái, mà hai trục đó chính là hai cột của $\mathbf{R}(30^\circ)$:</p>
          <p>$$\mathbf{p}_W = \mathbf{R}(30^\circ)\,\mathbf{p}_B = \hl{(1{,}232;\ 1{,}866)^T}$$</p>
          <p>Chiều ngược lại: $\mathbf{p}_B = \mathbf{R}^T \mathbf{p}_W$.</p>
        focus: [1, 1, 2, 2, 3, 4]
        say: "Quay lại câu hỏi mở đầu. Khung W là bản đồ, khung B gắn trên robot, trục ngang chỉ phía trước, trục đứng chỉ bên trái, và B quay 30 độ so với W. Vật có toạ độ trong khung B là 2, 1. Đi 2 theo trục phía trước, 1 theo trục bên trái, mà hai trục này chính là hai cột của R 30 độ. Vậy trên bản đồ, vật ở 1 phẩy 232 và 1 phẩy 866, đúng phép tính vừa làm. Chiều ngược lại, từ bản đồ về khung robot, ta nhân với R chuyển vị."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "np.allclose(alg.rot2(30).T @ [2, 1], alg.rot2(-30) @ [2, 1]) and not np.allclose(alg.rot2(30).T @ [2, 1], alg.rot2(30) @ [2, 1])"
      - "abs(math.cos(30) - 0.154) < 0.001 and round(math.cos(math.radians(30)), 3) == 0.866"
      - "np.allclose(alg.rot2(-30), [[math.cos(math.radians(30)), math.sin(math.radians(30))], [-math.sin(math.radians(30)), math.cos(math.radians(30))]])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi “quay điểm” và “quay hệ trục” là một <b class="red">(sai)</b>
          <br><span class="note">Giữ điểm đứng yên mà quay hệ trục đi $\theta$ thì toạ độ mới của điểm là $\mathbf{R}^T\mathbf{p}$, tức quay điểm đi $-\theta$. Hai việc ngược nhau.</span></div>
        say: "Lỗi thứ nhất, coi quay một điểm và quay hệ trục là một việc. Giữ điểm đứng yên mà quay hệ trục đi theta thì toạ độ mới của điểm là R chuyển vị nhân p, tức như quay điểm đi âm theta. Hai việc này ngược nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Máy tính để chế độ radian khi nhập độ <b class="red">(sai)</b>
          <br><span class="note">$\cos(30)$ theo radian $\approx 0{,}154$, không phải $0{,}866$. Kiểm chế độ góc trước khi tính.</span></div>
          <table class="t"><tr><th>máy để chế độ</th><th>bấm cos 30 ra</th></tr><tr><td>độ</td><td>0,866</td></tr><tr><td>radian</td><td>0,154</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, máy tính để chế độ radian mà ta nhập số đo bằng độ. Cos của 30 radian xấp xỉ 0 phẩy 154, không phải 0 phẩy 866, nên luôn kiểm chế độ góc trước khi tính."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đặt dấu trừ sai chỗ <b class="red">(sai)</b>
          <br><span class="note">Đặt $-\sin\theta$ ở hàng dưới là quay <b>cùng</b> chiều kim đồng hồ, tức $\mathbf{R}(-\theta)$. Nhớ: cột 1 là $(\cos\theta, \sin\theta)^T$.</span></div>
        say: "Lỗi thứ ba, đặt dấu trừ sai chỗ. Đặt âm sin theta ở hàng dưới thì thành quay cùng chiều kim đồng hồ, tức R của âm theta. Cách nhớ, cột thứ nhất luôn là cos theta, sin theta, chính là trục ngang sau khi quay."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Chỉ kiểm $\mathbf{R}^T\mathbf{R} = \mathbf{I}_2$ <b class="red">(thiếu)</b>
          <br><span class="note">Gương cũng thoả điều này. Phải kiểm thêm $\det \mathbf{R} = 1$.</span></div>
        say: "Lỗi thứ tư, chỉ kiểm R chuyển vị nhân R bằng ma trận đơn vị. Ma trận gương cũng thoả điều đó, nên phải kiểm thêm định thức bằng 1."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "np.allclose(alg.rot2(90) @ [3, 1], [-1, 3])"
      - "np.allclose(alg.rot2(90).T @ [0, 2], [2, 0])"
      - "3 ** 2 + 1 ** 2 == 10 and (-1) ** 2 + 3 ** 2 == 10 and np.allclose(alg.rot2(90)[:, 0], [0, 1]) and np.allclose(alg.rot2(90)[:, 1], [-1, 0])"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $\mathbf{R}(90^\circ)(3, 1)^T$.</td></tr>
          <tr><td>2</td><td>Robot quay mặt $90^\circ$ so với bản đồ, đứng ở gốc. Một vật ở $(0, 2)^T$ trên bản đồ. Trong khung robot, vật ở đâu: phía trước hay bên trái?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tính R 90 độ nhân với điểm 3, 1. Câu hai, robot đứng ở gốc, quay mặt 90 độ so với bản đồ, và có một vật ở 0, 2 trên bản đồ. Trong khung robot, vật ở phía trước hay bên trái? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $3 \cdot (0, 1)^T + 1 \cdot (-1, 0)^T = (0 - 1;\ 3 + 0)^T = \hl{(-1, 3)^T}$.</p>
          <p class="note">Kiểm độ dài: $3^2 + 1^2 = 10$ và $(-1)^2 + 3^2 = 10$ ✓</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, cột thứ nhất của R 90 độ là 0, 1, cột thứ hai là âm 1, 0. Lấy 3 lần cột thứ nhất cộng 1 lần cột thứ hai, được âm 1, 3. Kiểm nhanh bằng độ dài, 3 bình phương cộng 1 bình phương bằng 10, và âm 1 bình phương cộng 3 bình phương cũng bằng 10."
      - show: |
          <p>② $\mathbf{p}_B = \mathbf{R}(90^\circ)^T (0, 2)^T = \begin{bmatrix} 0 & 1 \\ -1 & 0 \end{bmatrix} (0, 2)^T = \hl{(2, 0)^T}$: vật ở <b>2 m phía trước</b>.</p>
          <p class="note">Kiểm: robot quay mặt về phía trục đứng của bản đồ, và vật nằm đúng trên trục đó.</p>
        focus: [1, 1, 1, 2]
        say: "Câu hai, từ bản đồ về khung robot ta nhân với R chuyển vị, ma trận có hàng trên là 0, 1 và hàng dưới là âm 1, 0. Hàng trên nhân với 0, 2 được 2, hàng dưới nhân với 0, 2 được 0, nên toạ độ trong khung robot là 2, 0. Vậy vật ở 2 mét ngay phía trước. Kiểm lại, robot quay mặt về phía trục đứng của bản đồ, và vật nằm đúng trên trục đó."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ảnh của hai trục</span><span class="a">→</span>
          <span class="n">hai cột của $\mathbf{R}(	heta)$</span><span class="a">→</span>
          <span class="n">$\mathbf{R}^T\mathbf{R} = \mathbf{I}_2$, $\det \mathbf{R} = 1$</span><span class="a">→</span>
          <span class="n">$\mathbf{p}_W = \mathbf{R}\,\mathbf{p}_B$, $\mathbf{p}_B = \mathbf{R}^T\mathbf{p}_W$</span></div>
        say: "Tổng kết lại, ảnh của hai trục sau khi quay là hai cột của ma trận quay. Ma trận quay có R chuyển vị nhân R bằng ma trận đơn vị và định thức bằng 1. Đổi từ khung robot sang bản đồ thì nhân R, chiều ngược lại thì nhân R chuyển vị."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi con số toạ độ chỉ có nghĩa khi biết nó thuộc khung nào. Luôn ghi khung bằng chỉ số dưới.</div>
        say: "Điều cần mang theo, một toạ độ chỉ có nghĩa khi ta biết nó thuộc khung nào. Hãy luôn ghi tên khung bằng chỉ số dưới."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>phép quay 3D</b>, góc Euler và khoá gimbal.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta lên không gian ba chiều với phép quay 3D, ghép các phép quay quanh từng trục, và hiện tượng khoá gimbal. Hẹn gặp bạn ở bài tiếp theo."
