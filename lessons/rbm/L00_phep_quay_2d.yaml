scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Robot thấy vật ở đâu?"
    steps:
      - show: |
          <p>Camera trên robot báo: vật ở <b>2 m phía trước, 1 m bên trái</b> robot.</p>
          <p>Robot đang quay mặt lệch 30 độ so với trục ngang của bản đồ.</p>
          <div class="box key">Hỏi: trên bản đồ, vật nằm ở toạ độ nào? Hôm nay: <b>ma trận quay</b> trả lời câu này.</div>
        focus: [1, 2, 3, 3]
        say: "Chào bạn, camera gắn trên một robot báo rằng có một vật ở 2 mét phía trước và 1 mét bên trái robot. Nhưng robot đang quay mặt lệch 30 độ so với trục ngang của bản đồ. Vậy trên bản đồ, vật nằm ở toạ độ nào? Hôm nay ta học ma trận quay, công cụ trả lời đúng câu hỏi này."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: nhân ma trận với vector, độ dài một mũi tên"
    checks:
      - "list(np.array([[1, 2], [3, 4]]) @ [1, 2]) == [5, 11]"
      - "1 * 1 + 2 * 2 == 5 and 3 * 1 + 4 * 2 == 11 and [1 * 1 + 2 * 2, 1 * 3 + 2 * 4] == [5, 11]"
      - "math.sqrt(3 ** 2 + 4 ** 2) == 5 and round(math.sqrt(2 ** 2 + 1 ** 2), 3) == 2.236"
    steps:
      - show: |
          <p>Nhân ma trận với vector, ví dụ $\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}(1, 2)^T$, làm được theo hai cách:</p>
          <table class="t"><tr><th>cách</th><th>làm</th><th>kết quả</th></tr>
          <tr><td>theo hàng</td><td>$1 \cdot 1 + 2 \cdot 2 = 5$; $3 \cdot 1 + 4 \cdot 2 = 11$</td><td>$(5, 11)^T$</td></tr>
          <tr><td>theo cột</td><td>$1 \cdot (1, 3)^T + 2 \cdot (2, 4)^T = (1 + 4;\ 3 + 8)^T$</td><td>$(5, 11)^T$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 2]
        say: "Trước khi vào bài, ta ôn hai điều sẽ dùng liên tục, cả hai đã học ở khoá Toán cho khoa học máy tính. Điều thứ nhất, nhân ma trận 1, 2, 3, 4 với vector 1, 2 có hai cách làm. Theo hàng, lấy hàng trên nhân với vector, 1 nhân 1 cộng 2 nhân 2 bằng 5, hàng dưới cho 3 cộng 8 bằng 11. Theo cột, lấy 1 lần cột thứ nhất cộng 2 lần cột thứ hai, tức 1, 3 cộng 2, 4 nhân đôi, cũng được 5, 11. Hai cách luôn cho cùng một kết quả, và lát nữa cách theo cột sẽ giải thích vì sao ma trận quay có dạng như vậy."
      - show: |
          <p>Độ dài mũi tên từ gốc tới điểm $(x, y)^T$ theo định lý Pythagoras: $\sqrt{x^2 + y^2}$.</p>
          <table class="t"><tr><th>điểm</th><th>độ dài</th></tr>
          <tr><td>$(3, 4)^T$</td><td>$\sqrt{9 + 16} = \sqrt{25} = 5$</td></tr>
          <tr><td>$(2, 1)^T$</td><td>$\sqrt{4 + 1} = \sqrt{5} \approx 2{,}236$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai, độ dài của mũi tên từ gốc tới điểm x, y bằng căn của x bình phương cộng y bình phương, theo định lý về cạnh huyền của tam giác vuông. Ví dụ điểm 3, 4 có độ dài căn của 9 cộng 16, tức căn 25, bằng 5. Điểm 2, 1 có độ dài căn 5, xấp xỉ 2 phẩy 236, con số này sẽ gặp lại ngay trong ví dụ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: độ, sin và ma trận quay"
    checks:
      - "abs(alg.rot2(30)[0][0] - 3 ** 0.5 / 2) < 1e-12 and abs(alg.rot2(30)[1][0] - 0.5) < 1e-12"
      - "all(abs(v) < 1e-12 for v in (alg.rot2(90) @ [1, 0] - np.array([0, 1])))"
      - "all(abs(v) < 1e-12 for v in (alg.rot2(90) @ [0, 1] - np.array([-1, 0])))"
    steps:
      - show: |
          <p>Góc đo bằng <b>độ</b>: $90^\circ$ là một phần tư vòng, $360^\circ$ là một vòng. Chiều dương là <b>ngược chiều kim đồng hồ</b>.</p>
          <p>Mũi tên dài 1 hợp với trục ngang góc $\theta$ có đầu mút tại $(\cos\theta, \sin\theta)$: $\cos$ là bóng trên trục ngang, $\sin$ là bóng trên trục đứng.</p>
          <p class="note">Ví dụ: $\cos 30^\circ \approx 0{,}866$, $\sin 30^\circ = 0{,}5$; $\cos 90^\circ = 0$, $\sin 90^\circ = 1$.</p>
        introduces: [deg, sin, cos, theta]
        focus: [1, 1, 2, 2, 3]
        say: "Trước hết, góc đo bằng độ, 90 độ là một phần tư vòng, 360 độ là một vòng. Chiều dương là chiều ngược kim đồng hồ. Một mũi tên dài 1 hợp với trục ngang góc theta thì đầu mút của nó nằm tại cos theta, sin theta. Cos là bóng của mũi tên trên trục ngang, sin là bóng trên trục đứng. Ví dụ cos 30 độ xấp xỉ 0 phẩy 866, sin 30 độ bằng 0 phẩy 5."
      - show: |
          <p>Quay trục ngang $(1, 0)^T$ đi góc $\theta$ được $(\cos\theta, \sin\theta)^T$. Quay trục đứng $(0, 1)^T$ được $(-\sin\theta, \cos\theta)^T$.</p>
          <p>Đặt hai kết quả đó làm hai <b>cột</b>:</p>
          <p>$\mathbf{R}(\theta) = \begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{bmatrix}$</p>
          <div class="box key">Cột 1 = trục ngang sau khi quay; cột 2 = trục đứng sau khi quay.</div>
        focus: [1, 1, 2, 3, 4]
        say: "Bây giờ quay trục ngang, mũi tên 1, 0, đi góc theta, ta được cos theta, sin theta. Quay trục đứng, mũi tên 0, 1, cũng góc đó, ta được âm sin theta, cos theta. Ta đặt hai kết quả này làm hai cột của một ma trận. Đó là ma trận quay R của theta. Cột thứ nhất là trục ngang sau khi quay, cột thứ hai là trục đứng sau khi quay."
      - clear: true
        show: |
          <p>Vì sao đặt thành cột? Theo phép nhân ma trận với vector (khoá CS115):</p>
          <p>$\mathbf{R}\,(x, y)^T = x \cdot (\text{cột } 1) + y \cdot (\text{cột } 2)$</p>
          <p>Điểm $(x, y)^T$ là “đi $x$ theo trục ngang, $y$ theo trục đứng”. Quay cả hai trục thì đi đúng như thế trên hai trục mới.</p>
        focus: [1, 2, 3, 3]
        say: "Vì sao lại đặt hai toạ độ này thành các cột của ma trận? Theo phép nhân ma trận với vector đã học, R nhân x, y bằng x lần cột 1 cộng y lần cột 2. Điểm x, y nghĩa là đi x bước theo trục ngang, rồi y bước theo trục đứng. Quay cả hai trục rồi đi đúng những bước đó trên hai trục mới, ta được điểm sau khi quay."

  - id: intuition
    kind: intuition
    title: "Hình dung: quay hai trục rồi đi theo toạ độ cũ"
    checks:
      - "np.allclose(alg.rot2(30)[:, 0], [math.cos(math.radians(30)), 0.5]) and [round(v, 3) for v in alg.rot2(30)[:, 0]] == [0.866, 0.5]"
      - "[round(v, 3) for v in alg.rot2(30)[:, 1]] == [-0.5, 0.866]"
      - "np.allclose(2 * alg.rot2(30)[:, 0] + 1 * alg.rot2(30)[:, 1], alg.rot2(30) @ [2, 1])"
    steps:
      - show: |
          <div><svg width="1240" height="450" viewBox="0 0 1240 450"><defs><marker id="qk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="qb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="qo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="qg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><line x1="82.0" y1="400.0" x2="670.0" y2="400.0" stroke="#6b7280" stroke-width="2" marker-end="url(#qk)"/><line x1="250.0" y1="421.0" x2="250.0" y2="57.0" stroke="#6b7280" stroke-width="2" marker-end="url(#qk)"/><line x1="250.0" y1="400.0" x2="638.0" y2="176.0" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/><line x1="250.0" y1="400.0" x2="162.5" y2="248.4" stroke="#fdba74" stroke-width="2" stroke-dasharray="8 6"/><line x1="250.0" y1="400.0" x2="371.2" y2="330.0" stroke="#2a78d6" stroke-width="5" marker-end="url(#qb)"/><line x1="250.0" y1="400.0" x2="180.0" y2="278.8" stroke="#eb6834" stroke-width="5" marker-end="url(#qo)"/><line x1="371.2" y1="330.0" x2="492.5" y2="260.0" stroke="#2a78d6" stroke-width="5" marker-end="url(#qb)"/><line x1="492.5" y1="260.0" x2="422.5" y2="138.8" stroke="#eb6834" stroke-width="5" marker-end="url(#qo)"/><circle cx="422.5" cy="138.8" r="9" fill="#15803d"/><text x="438" y="129" font-size="24" text-anchor="start" fill="#15803d" font-weight="bold">(1,232; 1,866)</text><text x="381" y="364" font-size="22" text-anchor="start" fill="#2a78d6" font-weight="bold">cột 1</text><text x="168" y="283" font-size="22" text-anchor="end" fill="#eb6834" font-weight="bold">cột 2</text><text x="506" y="288" font-size="22" text-anchor="start" fill="#2a78d6">sau 2 bước</text><text x="306" y="392" font-size="22" text-anchor="start" fill="#1f2937">30°</text><text x="660" y="430" font-size="22" text-anchor="end" fill="#6b7280">x</text><text x="236" y="78" font-size="22" text-anchor="end" fill="#6b7280">y</text><text x="760" y="70" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold">Hai cột của R(30°) là hai trục mới:</text><text x="760" y="120" font-size="24" text-anchor="start" fill="#2a78d6">cột 1 = trục trước = (0,866; 0,5)</text><text x="760" y="170" font-size="24" text-anchor="start" fill="#eb6834">cột 2 = trục trái = (−0,5; 0,866)</text><text x="760" y="240" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold">Điểm (2, 1) nghĩa là:</text><text x="760" y="290" font-size="24" text-anchor="start" fill="#2a78d6">đi 2 bước dọc cột 1 (xanh),</text><text x="760" y="340" font-size="24" text-anchor="start" fill="#eb6834">rồi 1 bước dọc cột 2 (cam).</text><text x="760" y="410" font-size="24" text-anchor="start" fill="#15803d" font-weight="bold">Tới điểm xanh lá = R(30°) nhân (2, 1).</text></svg></div>
        focus: [1, 1, 1, 1, 1, 1]
        say: "Hình này cho thấy ma trận quay làm gì với một điểm. Hai mũi tên đậm ở gốc là hai cột của R 30 độ. Mũi tên xanh là trục ngang đã quay 30 độ, tức trục phía trước của robot, còn mũi tên cam là trục đứng đã quay, tức trục bên trái. Điểm 2, 1 có nghĩa là đi 2 bước dọc mũi tên xanh, rồi 1 bước dọc mũi tên cam. Đi như vậy trên hai trục mới, ta tới điểm màu xanh lá, chính là kết quả của R 30 độ nhân với 2, 1. Lát nữa ta sẽ tính ra điểm đó là 1 phẩy 232 và 1 phẩy 866."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Quay 90° và quay 30°"
    checks:
      - "np.allclose(alg.rot2(90), [[0, -1], [1, 0]])"
      - "np.allclose(alg.rot2(30) @ [2, 1], [3 ** 0.5 - 0.5, 1 + 3 ** 0.5 / 2])"
      - "[round(v, 3) for v in alg.rot2(30) @ [2, 1]] == [1.232, 1.866]"
      - "abs(np.linalg.norm(alg.rot2(30) @ [2, 1]) - 5 ** 0.5) < 1e-12"
      - "round(1.232 ** 2, 3) == 1.518 and round(1.866 ** 2, 3) == 3.482 and round(1.518 + 3.482, 9) == 5 and 2 ** 2 + 1 ** 2 == 5"
      - "round(2 * 0.866, 3) == 1.732 and round(1.732 - 0.5, 3) == 1.232 and round(1 + 0.866, 3) == 1.866"
    steps:
      - show: |
