scenes:
- id: hook
  kind: hook
  title: Robot thấy vật ở đâu?
  steps:
  - show: '<p>Camera trên robot báo: vật ở <b>2 m phía trước, 1 m bên trái</b> robot.</p>

      <p>Robot đứng ngay gốc bản đồ, quay mặt lệch 30 độ ngược chiều kim đồng hồ so với trục ngang của bản đồ.</p>

      <div class="box key">Hỏi: trên bản đồ, vật nằm ở toạ độ nào? Hôm nay: <b>ma trận quay</b> trả lời câu này.</div>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Chào bạn, camera gắn trên một robot báo rằng có một vật ở 2 mét phía trước và 1 mét bên trái robot. Nhưng robot đứng ngay gốc bản đồ và đang quay mặt lệch 30 độ ngược chiều kim đồng hồ so với trục ngang của bản đồ. Vậy trên bản đồ, vật nằm ở toạ độ nào? Hôm nay ta học ma trận quay, công cụ trả lời đúng câu hỏi này.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: nhân ma trận với vector, độ dài một mũi tên'
  checks:
  - list(np.array([[1, 2], [3, 4]]) @ [1, 2]) == [5, 11]
  - 1 * 1 + 2 * 2 == 5 and 3 * 1 + 4 * 2 == 11 and [1 * 1 + 2 * 2, 1 * 3 + 2 * 4] == [5, 11]
  - math.sqrt(3 ** 2 + 4 ** 2) == 5 and round(math.sqrt(2 ** 2 + 1 ** 2), 3) == 2.236
  - np.dot([1, 2], [-2, 1]) == 0 and np.dot([1, 2], [1, 2]) == 5 and 1 * (-2) + 2 * 1 == 0
  - np.array([[1, 2], [3, 4]]).T.tolist() == [[1, 3], [2, 4]] and list(np.eye(2) @ [5, 11]) == [5, 11]
  - round(np.linalg.det([[1, 2], [3, 4]]), 9) == -2 and 1 * 4 - 2 * 3 == -2 and np.allclose(np.linalg.inv([[1, 2], [3, 4]]) @ np.array([[1, 2], [3, 4]]), np.eye(2))
  steps:
  - show: '<p><b>Ma trận</b>: bảng số xếp theo hàng và cột. <b>Vector</b> $(x, y)^T$: hai số dựng thành một cột (dấu $^T$), như toạ độ đầu một mũi tên. Nhân ma trận với vector, ví dụ $\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}(1, 2)^T$, làm được theo hai cách:</p>

      <table class="t"><tr><th>cách</th><th>làm</th><th>kết quả</th></tr>

      <tr><td>theo hàng</td><td>$1 \cdot 1 + 2 \cdot 2 = 5$; $3 \cdot 1 + 4 \cdot 2 = 11$</td><td>$(5, 11)^T$</td></tr>

      <tr><td>theo cột</td><td>$1 \cdot (1, 3)^T + 2 \cdot (2, 4)^T = (1 + 4;\ 3 + 8)^T$</td><td>$(5, 11)^T$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    - 2
    say: Trước hết, ma trận là một bảng số xếp theo hàng và cột, còn vector là hai số dựng thành một cột. Dấu mũ T chỉ phép chuyển vị lật hàng thành cột, như toạ độ đầu một mũi tên. Điều thứ nhất, nhân ma trận 1, 2, 3, 4 với vector 1, 2 có hai cách làm. Theo hàng, lấy hàng trên nhân với vector, 1 nhân 1 cộng 2 nhân 2 bằng 5, hàng dưới cho 3 cộng 8 bằng 11. Theo cột, lấy 1 lần cột thứ nhất cộng 2 lần cột thứ hai, tức 1, 3 cộng 2, 4 nhân đôi, cũng được 5, 11. Hai cách luôn cho cùng một kết quả, và lát nữa cách theo cột sẽ giải thích vì sao ma trận quay có dạng như vậy.
  - show: '<p>Độ dài mũi tên từ gốc tới điểm $(x, y)^T$ theo định lý Pythagoras: $\sqrt{x^2 + y^2}$.</p>

      <table class="t"><tr><th>điểm</th><th>độ dài</th></tr>

      <tr><td>$(3, 4)^T$</td><td>$\sqrt{9 + 16} = \sqrt{25} = 5$</td></tr>

      <tr><td>$(2, 1)^T$</td><td>$\sqrt{4 + 1} = \sqrt{5} \approx 2{,}236$</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Điều thứ hai, độ dài của mũi tên từ gốc tới điểm x, y bằng căn của x bình phương cộng y bình phương, theo định lý về cạnh huyền của tam giác vuông. Ví dụ điểm 3, 4 có độ dài căn của 9 cộng 16, tức căn 25, bằng 5. Điểm 2, 1 có độ dài căn 5, xấp xỉ 2 phẩy 236, con số này sẽ gặp lại ngay trong ví dụ.
  - clear: true
    show: '<p><b>Tích vô hướng</b> của hai mũi tên: nhân từng cặp toạ độ rồi cộng. Bằng 0 nghĩa là hai mũi tên <b>vuông góc</b>.</p>

      <table class="t"><tr><th>hai mũi tên</th><th>tích vô hướng</th><th>nghĩa</th></tr>

      <tr><td>$(1, 2)^T$ và $(-2, 1)^T$</td><td>$1 \cdot (-2) + 2 \cdot 1 = 0$</td><td>vuông góc</td></tr>

      <tr><td>$(1, 2)^T$ với chính nó</td><td>$1 \cdot 1 + 2 \cdot 2 = 5$</td><td>bằng độ dài bình phương</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    say: Điều thứ ba là tích vô hướng của hai mũi tên, ta nhân từng cặp toạ độ rồi cộng lại. Tích vô hướng bằng 0 nghĩa là hai mũi tên vuông góc với nhau. Ví dụ 1, 2 và âm 2, 1 cho 1 nhân âm 2 cộng 2 nhân 1, bằng 0, nên chúng vuông góc. Còn tích vô hướng của 1, 2 với chính nó là 1 cộng 4, bằng 5, đúng bằng độ dài bình phương.
  - clear: true
    show: '<p>Bốn từ về ma trận, minh hoạ với $\mathbf{M} = \begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}$:</p>

      <table class="t"><tr><th>từ</th><th>nghĩa</th><th>với $\mathbf{M}$</th></tr>

      <tr><td>chuyển vị $\mathbf{M}^T$</td><td>đổi hàng thành cột</td><td>$\begin{bmatrix} 1 & 3 \\ 2 & 4 \end{bmatrix}$</td></tr>

      <tr><td>ma trận đơn vị $\mathbf{I}_2$</td><td>1 trên đường chéo, 0 ở chỗ khác: nhân vào không đổi gì</td><td>$\mathbf{I}_2(5, 11)^T = (5, 11)^T$</td></tr>

      <tr><td>định thức $\det$</td><td>$\det \begin{bmatrix} a & b \\ c & d \end{bmatrix} = ad - bc$</td><td>$1 \cdot 4 - 2 \cdot 3 = -2$</td></tr>

      <tr><td>nghịch đảo $\mathbf{M}^{-1}$</td><td>làm ngược lại $\mathbf{M}$: $\mathbf{M}^{-1}\mathbf{M} = \mathbf{I}_2$</td><td>có vì $\det \ne 0$</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    say: Điều thứ tư là bốn từ về ma trận, minh hoạ với ma trận M có hàng trên 1, 2 và hàng dưới 3, 4. Chuyển vị của M là đổi hàng thành cột, nên hàng trên của nó là 1, 3 và hàng dưới là 2, 4. Ma trận đơn vị có số 1 trên đường chéo và số 0 ở mọi chỗ khác, nhân nó với vector nào thì vector đó giữ nguyên. Định thức của ma trận hai nhân hai bằng a nhân d trừ b nhân c, với M là 1 nhân 4 trừ 2 nhân 3, bằng âm 2. Nghịch đảo của M là ma trận làm ngược lại việc M đã làm, nhân nó với M thì được ma trận đơn vị, và nó chỉ có khi định thức khác 0.
- id: sym
  kind: symbol
  title: 'Giải mã: độ, sin và ma trận quay'
  checks:
  - abs(alg.rot2(30)[0][0] - 3 ** 0.5 / 2) < 1e-12 and abs(alg.rot2(30)[1][0] - 0.5) < 1e-12
  - all(abs(v) < 1e-12 for v in (alg.rot2(90) @ [1, 0] - np.array([0, 1])))
  - all(abs(v) < 1e-12 for v in (alg.rot2(90) @ [0, 1] - np.array([-1, 0])))
  steps:
  - show: '<p>Góc đo bằng <b>độ</b>: $90^\circ$ là một phần tư vòng, $360^\circ$ là một vòng. Chiều dương là <b>ngược chiều kim đồng hồ</b>.</p>

      <p>Mũi tên dài 1 hợp với trục ngang góc $\theta$ có đầu mút tại $(\cos\theta, \sin\theta)$: $\cos$ là bóng trên trục ngang, $\sin$ là bóng trên trục đứng.</p>

      <p class="note">Ví dụ: $\cos 30^\circ \approx 0{,}866$, $\sin 30^\circ = 0{,}5$; $\cos 90^\circ = 0$, $\sin 90^\circ = 1$.</p>

      '
    introduces:
    - deg
    - sin
    - cos
    - theta
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Trước hết, góc đo bằng độ, 90 độ là một phần tư vòng, 360 độ là một vòng. Chiều dương là chiều ngược kim đồng hồ. Một mũi tên dài 1 hợp với trục ngang góc theta thì đầu mút của nó nằm tại cos theta, sin theta. Cos là bóng của mũi tên trên trục ngang, sin là bóng trên trục đứng. Ví dụ cos 30 độ xấp xỉ 0 phẩy 866, sin 30 độ bằng 0 phẩy 5.
  - show: '<p>Quay trục ngang $(1, 0)^T$ đi góc $\theta$ được $(\cos\theta, \sin\theta)^T$. Quay trục đứng $(0, 1)^T$ được $(-\sin\theta, \cos\theta)^T$.</p>

      <p>Đặt hai kết quả đó làm hai <b>cột</b>:</p>

      <p>$\mathbf{R}(\theta) = \begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{bmatrix}$</p>

      <div class="box key">Cột 1 = trục ngang sau khi quay; cột 2 = trục đứng sau khi quay.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    say: Bây giờ quay trục ngang, mũi tên 1, 0, đi góc theta, ta được cos theta, sin theta. Quay trục đứng, mũi tên 0, 1, cũng góc đó, ta được âm sin theta, cos theta. Ta đặt hai kết quả này làm hai cột của một ma trận. Đó là ma trận quay R của theta. Cột thứ nhất là trục ngang sau khi quay, cột thứ hai là trục đứng sau khi quay.
  - clear: true
    show: '<p>Vì sao đặt thành cột? Theo cách nhân ma trận với vector theo cột ở phần chuẩn bị:</p>

      <p>$\mathbf{R}\,(x, y)^T = x \cdot (\text{cột } 1) + y \cdot (\text{cột } 2)$</p>

      <p>Điểm $(x, y)^T$ là “đi $x$ theo trục ngang, $y$ theo trục đứng”. Quay cả hai trục thì đi đúng như thế trên hai trục mới.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Vì sao lại đặt hai toạ độ này thành các cột của ma trận? Theo cách nhân theo cột ở phần chuẩn bị, R nhân x, y bằng x lần cột 1 cộng y lần cột 2. Điểm x, y nghĩa là đi x bước theo trục ngang, rồi y bước theo trục đứng. Quay cả hai trục rồi đi đúng những bước đó trên hai trục mới, ta được điểm sau khi quay.
