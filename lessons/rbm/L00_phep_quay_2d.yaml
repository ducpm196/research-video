50.0" y2="200.0" stroke="#2a78d6" stroke-width="4" marker-end="url(#ab)"/><line x1="150.0" y1="300.0" x2="273.2" y2="113.4" stroke="#eb6834" stroke-width="4" stroke-dasharray="12 7" marker-end="url(#ao)"/><polyline points="229.0,257.0 226.5,252.6 223.7,248.3 220.6,244.2 217.3,240.3 213.8,236.6 210.1,233.0 206.3,229.7 202.2,226.7" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/><text x="255.0" y="218.0" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">30°</text><text x="360.0" y="208.0" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">(2, 1)</text><text x="285.2" y="103.4" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">(1,232; 1,866)</text><circle cx="350.0" cy="200.0" r="7" fill="#2a78d6" stroke="#fffbeb" stroke-width="2"/><circle cx="273.2" cy="113.4" r="7" fill="#eb6834" stroke="#fffbeb" stroke-width="2"/></svg></div>

