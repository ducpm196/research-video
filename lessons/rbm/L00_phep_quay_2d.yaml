  - show: '<p><b>Bước 3 —</b> cộng từng toạ độ: $(1{,}732 - 0{,}5;\ 1 + 0{,}866)^T = \hl{(1{,}232;\ 1{,}866)^T}$</p>

      '
    say: Bước ba, cộng từng toạ độ, 2 nhân 0 phẩy 866 là 1 phẩy 732, trừ đi 0 phẩy 5 thì được 1 phẩy 232. Toạ độ thứ hai là 1 cộng 0 phẩy 866, bằng 1 phẩy 866.
  - show: '<p class="note"><b>Bước 4 —</b> độ dài giữ nguyên: $1{,}232^2 + 1{,}866^2 \approx 1{,}518 + 3{,}482 = 5$, đúng bằng $2^2 + 1^2 = 5$, nên cả hai điểm cách gốc $\sqrt{5} \approx 2{,}236$.</p>

      '
    say: Bước bốn, kiểm độ dài, 1 phẩy 232 bình phương xấp xỉ 1 phẩy 518, 1 phẩy 866 bình phương xấp xỉ 3 phẩy 482, cộng lại được 5. Điểm ban đầu có 2 bình phương cộng 1 bình phương cũng bằng 5, nên cả hai điểm đều cách gốc căn 5, xấp xỉ 2 phẩy 236, phép quay không làm dài hay ngắn mũi tên.
  - show: <p><b>Chạy thử bằng Python — quay vector (2, 0) đi 60 độ và kiểm tính trực giao:</b></p><div class="code"><div>import math</div><div>t = math.radians(60.0); c, s = math.cos(t), math.sin(t)</div><div>print(round(c*2 - s*0, 3), round(s*2 + c*0, 3), round(c*c + s*s, 3))</div></div>
    say: Đoạn Python tính trực tiếp toạ độ sau phép quay sáu mươi độ và kiểm chứng tổng bình phương cos cộng sin bằng một.
