# Quy ước: R(θ) là ma trận quay NGƯỢC chiều kim đồng hồ; góc ghi bằng độ (30°); điểm/vector viết (x, y)^T như CS115 bài 2;
#   số thập phân dùng dấu phẩy (0{,}866). Khung W là khung thế giới, khung B là khung gắn trên robot (chỉ số dưới W, B).
#   Mọi con số do alg.rot2 tính; R^T R = I và det R = 1 kiểm cho θ = 0..359.
objectives:
  - "Viết ma trận quay 2D và đọc được vì sao các cột của nó là ảnh của hai trục"
  - "Kiểm RᵀR = I và det R = 1"
  - "Phân biệt quay một điểm với đổi khung toạ độ"
