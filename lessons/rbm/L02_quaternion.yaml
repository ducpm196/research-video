# Quy ước: quaternion q = (w, x, y, z) = w + x·i + y·j + z·k, phần số w đứng TRƯỚC; vector v ↔ quaternion (0, v);
#   quay v bằng q: q·(0, v)·q^{-1}; với q đơn vị, q^{-1} = (w, −x, −y, −z). Tích quaternion viết sát (q_2 q_1),
#   áp dụng từ phải sang trái như ma trận. Mọi số do alg.qmul/qaxis/qrot tính.
objectives:
  - "Nhân hai quaternion theo bảng i, j, k"
  - "Viết quaternion của phép quay góc θ quanh trục u và quay một vector bằng nó"
  - "Biết q và −q cùng là một phép quay"
