id: L12
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 12 — Lọc Kalman một chiều"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L12; audit/rbm/verify_rbm.py L12; R. E. Kalman (1960); S. Thrun, W. Burgard, D. Fox, Probabilistic Robotics (2005), mục 3.2"
assumes: [arith, cdot, sub, hat, var, normal, mu, sigma, frac, approx, power, implies]
# Quy ước: ước lượng \hat{x} với phương sai P (độ bất định); phép đo z với phương sai R; chuyển động u với nhiễu phương sai Q;
#   hệ số Kalman K = P/(P + R) là trọng số của PHÉP ĐO. Dấu “⁻” (dự đoán) viết bằng chữ “trước khi đo” để tránh ký hiệu mới.
#   Nhiễu dự đoán và nhiễu đo độc lập, phân phối chuẩn (CS115 bài 14). Mọi số do alg.kalman1d_update tính;
#   công thức trọng số rút ra bằng sympy (cực tiểu phương sai), kiểm Monte Carlo trong audit/rbm/verify_rbm.py.
objectives:
  - "Kết hợp dự đoán và phép đo theo phương sai"
  - "Giải thích hệ số Kalman như trọng số tối ưu"
  - "Chạy vòng dự đoán – cập nhật một chiều"
asr_reviewed:
  - {sentence: "Hệ số Kalman K bằng P chia P cộng R là trọng số tối ưu cho phép đo, và phương sai mới nhỏ hơn cả hai.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bước dự đoán làm P tăng, bước đo làm P giảm.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai nguồn tin, đều không chắc"
    steps:
      - show: |
          <p>Robot đi trên hành lang. Đếm vòng bánh xe cho dự đoán vị trí nhưng sai số cộng dồn. Cảm biến khoảng cách cho phép đo nhưng mỗi lần nhiễu một ít.</p>
          <p>Tin hẳn bên nào cũng dở. Trung bình cộng thì bỏ qua việc bên nào đáng tin hơn.</p>
          <div class="box key">Hôm nay: <b>lọc Kalman</b> — trộn hai nguồn với trọng số theo độ tin cậy, được ước lượng tốt hơn cả hai.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một robot đi trên hành lang. Đếm vòng bánh xe cho ta dự đoán vị trí, nhưng sai số cộng dồn theo thời gian. Cảm biến khoảng cách cho một phép đo, nhưng mỗi lần lại nhiễu một ít. Tin hẳn một bên thì dở, còn lấy trung bình cộng thì bỏ qua việc bên nào đáng tin hơn. Hôm nay ta học lọc Kalman, trộn hai nguồn với trọng số theo độ tin cậy, để được ước lượng tốt hơn cả hai."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trung bình có trọng số, phương sai khi nhân và cộng"
    checks:
      - "round(0.8 * 10 + 0.2 * 20, 6) == 12 and round(0.5 * 10 + 0.5 * 20, 6) == 15"
      - "round(0.5 ** 2 * 1, 6) == 0.25 and round(0.25 + 0.25, 6) == 0.5 and round(2 ** 2 * 1, 6) == 4"
      - "abs(np.var(0.5 * np.random.default_rng(2).normal(0, 1, 200000)) - 0.25) < 0.01"
    steps:
      - show: |
          <p>Trung bình có trọng số của hai số: trọng số cộng lại bằng 1, kết quả nằm giữa, gần số có trọng số lớn hơn.</p>
          <table class="t"><tr><th>trọng số</th><th>trộn 10 và 20</th><th>kết quả</th></tr>
          <tr><td>0,5 và 0,5</td><td>$0{,}5 \cdot 10 + 0{,}5 \cdot 20$</td><td>15, đúng giữa</td></tr>
          <tr><td>0,8 và 0,2</td><td>$0{,}8 \cdot 10 + 0{,}2 \cdot 20$</td><td>12, gần 10</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Trước khi vào bài, ta ôn hai điều về trộn số. Điều thứ nhất là trung bình có trọng số, hai trọng số cộng lại bằng 1, và kết quả luôn nằm giữa hai số, gần số có trọng số lớn hơn. Trộn 10 và 20 với trọng số 0 phẩy 5 và 0 phẩy 5 thì được 15, đúng chính giữa. Với trọng số 0 phẩy 8 và 0 phẩy 2 thì được 8 cộng 4, bằng 12, gần 10 hơn."
      - show: |
          <p>Phương sai (khoá Toán cho khoa học máy tính) đo độ phân tán. Hai luật sẽ dùng:</p>
          <table class="t"><tr><th>luật</th><th>ví dụ: $X$, $Y$ độc lập, mỗi cái phương sai 1</th></tr>
          <tr><td>nhân với số $c$ thì phương sai nhân $c^2$</td><td>$0{,}5X$ có phương sai $0{,}5^2 \cdot 1 = 0{,}25$; $\ 2X$ có phương sai $4$</td></tr>
          <tr><td>cộng hai nguồn độc lập thì cộng phương sai</td><td>$0{,}5X + 0{,}5Y$ có phương sai $0{,}25 + 0{,}25 = 0{,}5$</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.3"]
        say: "Điều thứ hai là phương sai, đã học ở khoá Toán cho khoa học máy tính, đo độ phân tán của một đại lượng ngẫu nhiên. Luật thứ nhất, nhân đại lượng với một số c thì phương sai nhân với c bình phương. Ví dụ X có phương sai 1 thì nửa X có phương sai 0 phẩy 25, còn 2 X có phương sai 4. Luật thứ hai, cộng hai nguồn độc lập thì phương sai cộng lại. Vậy nửa X cộng nửa Y có phương sai 0 phẩy 25 cộng 0 phẩy 25, bằng 0 phẩy 5, nhỏ hơn phương sai của từng nguồn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: x̂, P, z, R"
    steps:
      - show: |
          <p>$\hat{x}$: ước lượng vị trí hiện tại; $P$: phương sai của nó — càng lớn càng không chắc.</p>
          <p>$z$: phép đo mới; $R$: phương sai nhiễu đo.</p>
          <p>Coi mỗi nguồn là một phân phối chuẩn (CS115): $\mathcal{N}(\hat{x}, P)$ và $\mathcal{N}(z, R)$.</p>
          <div class="box key">Phương sai là thước đo <b>độ không chắc</b>. Bên nào phương sai nhỏ hơn thì đáng tin hơn.</div>
        focus: [1, 2, 3, 4]
        say: "Ta gọi x mũ là ước lượng vị trí hiện tại, và P là phương sai của nó, P càng lớn thì càng không chắc. Z là phép đo mới, còn R là phương sai của nhiễu đo. Coi mỗi nguồn là một phân phối chuẩn, một cái tâm ở x mũ với phương sai P, một cái tâm ở z với phương sai R. Phương sai là thước đo độ không chắc chắn, bên nào phương sai nhỏ hơn thì đáng tin hơn."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Trọng số tối ưu = hệ số Kalman"
    checks:
      - "all(abs(min(w * w * P + (1 - w) ** 2 * R for w in [k / 10000 for k in range(10001)]) - P * R / (P + R)) < 1e-6 for P, R in ((1, 1), (1, 4), (2, 0.5)))"
      - "all(abs((1 - P / (P + R)) * P - P * R / (P + R)) < 1e-12 for P, R in ((1, 1), (1, 4), (2, 0.5)))"
    steps:
      - show: |
          <p>Trộn: $\hat{x}_{\text{mới}} = (1 - K)\,\hat{x} + K z$. Vì hai nhiễu độc lập, phương sai của tổng có trọng số là:</p>
          <p>$(1 - K)^2 P + K^2 R$</p>
          <p>Đạo hàm theo $K$ bằng 0 (CS115: cực tiểu): $-2(1 - K)P + 2KR = 0$, nên</p>
          <p>$K = \dfrac{P}{P + R}$, $\quad P_{\text{mới}} = (1 - K)\,P = \dfrac{PR}{P + R}$</p>
          <div class="box key">Viết lại: $\hat{x}_{\text{mới}} = \hat{x} + K(z - \hat{x})$ — dịch ước lượng về phía phép đo một phần $K$ của độ lệch.</div>
        focus: [1, 2, 3, 4, 4, 5]
        say: "Ta trộn hai nguồn, lấy 1 trừ K phần ước lượng cộng K phần phép đo. Vì hai nhiễu độc lập, phương sai của tổng có trọng số bằng 1 trừ K bình phương nhân P, cộng K bình phương nhân R. Muốn phương sai nhỏ nhất, ta cho đạo hàm theo K bằng 0, rồi chuyển vế, được K bằng P chia P cộng R. Thay ngược lại, phương sai mới bằng 1 trừ K nhân P, tức P R chia P cộng R. Con số này luôn nhỏ hơn cả P lẫn R. Viết gọn lại, ước lượng mới bằng ước lượng cũ cộng K nhân độ lệch z trừ x mũ, tức dịch về phía phép đo một phần K."

  - id: intuition
    kind: intuition
    title: "Hình dung: phép đo kéo ước lượng một phần K"
    checks:
      - "[round(1 / (1 + R), 6) for R in (1, 4)] == [0.5, 0.2] and [round(R / (1 + R), 6) for R in (1, 4)] == [0.5, 0.8]"
      - "round(math.sqrt(0.5), 3) == 0.707 and round(math.sqrt(0.8), 3) == 0.894"
    steps:
      - show: |
          <div><svg width="1140" height="440" viewBox="0 0 1140 440"><text x="30" y="40" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold">R = 1: K = 0,5, kết quả ở 0,5 (nửa đường), phương sai 0,5</text><line x1="200.0" y1="80" x2="640.0" y2="80" stroke="#2a78d6" stroke-width="10" stroke-linecap="round" opacity="0.45"/><circle cx="420.0" cy="80" r="9" fill="#2a78d6"/><text x="30" y="88" font-size="22" text-anchor="start" fill="#2a78d6" font-weight="bold">dự đoán</text><line x1="420.0" y1="118" x2="860.0" y2="118" stroke="#eb6834" stroke-width="10" stroke-linecap="round" opacity="0.45"/><circle cx="640.0" cy="118" r="9" fill="#eb6834"/><text x="30" y="126" font-size="22" text-anchor="start" fill="#eb6834" font-weight="bold">phép đo</text><line x1="374.4" y1="156" x2="685.6" y2="156" stroke="#15803d" stroke-width="10" stroke-linecap="round" opacity="0.45"/><circle cx="530.0" cy="156" r="9" fill="#15803d"/><text x="30" y="164" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">kết quả</text><line x1="420" y1="62" x2="420" y2="180" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="640" y1="62" x2="640" y2="180" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><text x="30" y="250" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold">R = 4: K = 0,2, kết quả ở 0,2 (một phần năm đường), phương sai 0,8</text><line x1="200.0" y1="290" x2="640.0" y2="290" stroke="#2a78d6" stroke-width="10" stroke-linecap="round" opacity="0.45"/><circle cx="420.0" cy="290" r="9" fill="#2a78d6"/><text x="30" y="298" font-size="22" text-anchor="start" fill="#2a78d6" font-weight="bold">dự đoán</text><line x1="200.0" y1="328" x2="1080.0" y2="328" stroke="#eb6834" stroke-width="10" stroke-linecap="round" opacity="0.45"/><circle cx="640.0" cy="328" r="9" fill="#eb6834"/><text x="30" y="336" font-size="22" text-anchor="start" fill="#eb6834" font-weight="bold">phép đo</text><line x1="267.2" y1="366" x2="660.8" y2="366" stroke="#15803d" stroke-width="10" stroke-linecap="round" opacity="0.45"/><circle cx="464.0" cy="366" r="9" fill="#15803d"/><text x="30" y="374" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">kết quả</text><line x1="420" y1="272" x2="420" y2="390" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="640" y1="272" x2="640" y2="390" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><text x="420" y="420" font-size="22" text-anchor="middle" fill="#6b7280">0</text><text x="640" y="420" font-size="22" text-anchor="middle" fill="#6b7280">1</text><text x="1110" y="420" font-size="20" text-anchor="end" fill="#6b7280">thanh mờ: độ không chắc</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này cho thấy bước cập nhật làm gì. Chấm xanh là dự đoán ở 0, chấm cam là phép đo ở 1, mỗi thanh mờ dài theo độ không chắc của nguồn đó. Hàng trên, hai nguồn tin như nhau, nên K bằng 0 phẩy 5 và kết quả màu xanh lá nằm đúng nửa đường. Hàng dưới, phép đo kém hơn với R bằng 4, nên K chỉ bằng 0 phẩy 2 và kết quả chỉ nhích một phần năm đường. Ở cả hai hàng, thanh của kết quả ngắn hơn thanh dự đoán, tức độ không chắc giảm đi."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Dự đoán 0, đo 1"
    checks:
      - "alg.kalman1d_update(0, 1, 1, 1) == (0.5, 0.5, 0.5)"
      - "tuple(round(v, 6) for v in alg.kalman1d_update(0, 1, 1, 4)) == (0.2, 0.2, 0.8)"
      - "abs(np.var(0.5 * np.random.default_rng(0).normal(0, 1, 200000) + 0.5 * np.random.default_rng(1).normal(0, 1, 200000)) - 0.5) < 0.01"
    steps:
      - show: |
          <p>$\hat{x} = 0$, $P = 1$; $z = 1$, $R = 1$ — hai nguồn tin như nhau.</p>
