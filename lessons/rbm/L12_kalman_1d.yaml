int-order="stroke">kết hợp 0,5, phương sai 0,5</text></svg></div>
        focus: [1, 2, 2, 3, 3]
        say: "Làm thử với dự đoán 0, phương sai 1, và phép đo 1, cũng phương sai 1, tức hai nguồn tin như nhau. K bằng 1 chia 2, tức 0 phẩy 5. Ước lượng mới bằng 0 cộng 0 phẩy 5 nhân 1, bằng 0 phẩy 5, và phương sai mới bằng 0 phẩy 5. Trên hình, đường đen là kết quả, nằm giữa hai đường kia và hẹp hơn cả hai. Máy cũng thử bằng hai trăm nghìn mẫu ngẫu nhiên, và phương sai của trung bình ra đúng 0 phẩy 5."
      - clear: true
        show: |
          <p>Cảm biến kém hơn, $R = 4$. <b>Bước 1 —</b> $K = \dfrac{P}{P + R} = \dfrac{1}{1 + 4} = \hl{0{,}2}$.</p>
        say: "Bây giờ cảm biến kém hơn, R bằng 4, ta làm lại từng bước. Bước một, K bằng P chia P cộng R, tức 1 chia 5, bằng 0 phẩy 2."
      - show: |
          <p><b>Bước 2 —</b> $\hat{x}_{\text{mới}} = \hat{x} + K(z - \hat{x}) = 0 + 0{,}2 \cdot (1 - 0) = \hl{0{,}2}$.</p>
        say: "Bước hai, độ lệch giữa phép đo và dự đoán là 1 trừ 0, bằng 1, nên ước lượng mới bằng 0 cộng 0 phẩy 2 nhân 1, tức 0 phẩy 2."
      - show: |
          <p><b>Bước 3 —</b> $P_{\text{mới}} = (1 - K)\,P = 0{,}8 \cdot 1 = \hl{0{,}8}$.</p>
          <p class="note">Phép đo kém thì chỉ kéo ước lượng đi một chút, và độ không chắc giảm ít.</p>
        focus: [1, 2]
        say: "Bước ba, phương sai mới bằng 1 trừ 0 phẩy 2, nhân với 1, tức 0 phẩy 8. Phép đo kém thì chỉ kéo ước lượng đi một chút, và độ không chắc chắn giảm ít."

  - id: check
    kind: check
    title: "Tự kiểm: công thức khác, rồi thử từng trọng số"
    checks:
      - "round(1 * 4 / (1 + 4), 6) == 0.8 and round((1 - 0.2) * 0 + 0.2 * 1, 6) == 0.2"
      - "[round((1 - w) ** 2 * 1 + w ** 2 * 4, 6) for w in (0.1, 0.2, 0.3)] == [0.85, 0.8, 0.85]"
      - "min(range(0, 101), key=lambda k: (1 - k / 100) ** 2 + (k / 100) ** 2 * 4) == 20"
    steps:
      - show: |
          <p>Đường thứ nhất: hai dạng khác của cùng công thức, với $P = 1$, $R = 4$, $K = 0{,}2$.</p>
          <table class="t"><tr><th>đại lượng</th><th>dạng khác</th><th>kết quả</th></tr>
          <tr><td>$P_{\text{mới}}$</td><td>$\dfrac{PR}{P + R} = \dfrac{1 \cdot 4}{5}$</td><td>$0{,}8$ ✓</td></tr>
          <tr><td>$\hat{x}_{\text{mới}}$</td><td>$(1 - K)\hat{x} + Kz = 0{,}8 \cdot 0 + 0{,}2 \cdot 1$</td><td>$0{,}2$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Làm sao biết 0 phẩy 2 và 0 phẩy 8 là đúng? Đường thứ nhất, thay số vào dạng khác của công thức, phương sai mới bằng P nhân R chia P cộng R, tức 4 chia 5, bằng 0 phẩy 8. Ước lượng mới viết dạng trung bình có trọng số, 0 phẩy 8 nhân 0 cộng 0 phẩy 2 nhân 1, cũng bằng 0 phẩy 2."
      - show: |
          <p>Đường thứ hai: không dùng đạo hàm, thử thẳng vài trọng số $w$ cho phép đo trong phương sai $(1 - w)^2 \cdot 1 + w^2 \cdot 4$.</p>
          <table class="t"><tr><th>$w$</th><th>phương sai</th></tr>
          <tr><td>0,1</td><td>$0{,}81 + 0{,}04 = 0{,}85$</td></tr>
          <tr><td>0,2</td><td>$0{,}64 + 0{,}16 = \hl{0{,}80}$ nhỏ nhất</td></tr>
          <tr><td>0,3</td><td>$0{,}49 + 0{,}36 = 0{,}85$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 2]
        say: "Đường thứ hai, bỏ đạo hàm đi, ta thử thẳng vài trọng số trong công thức phương sai của tổng có trọng số. Với trọng số 0 phẩy 1, phương sai là 0 phẩy 81 cộng 0 phẩy 04, bằng 0 phẩy 85. Với 0 phẩy 2, được 0 phẩy 64 cộng 0 phẩy 16, bằng 0 phẩy 8. Với 0 phẩy 3, lại lên 0 phẩy 85. Vì phương sai nhỏ nhất ở 0 phẩy 2, trọng số tốt nhất đúng là 0 phẩy 2, và máy thử hết 101 trọng số từ 0 đến 1 cũng cho kết quả này."

  # ───────────────────────── 5. VÒNG LẶP ─────────────────────────
  - id: cycle
    kind: concept
    title: "Vòng dự đoán – cập nhật"
    checks:
      - "(0 + 1, 1 + 1) == (1, 2)"
      - "alg.kalman1d_update(1, 2, 1.5, 2) == (0.5, 1.25, 1.0)"
    steps:
      - show: |
          <p><b>Dự đoán</b>: robot đi thêm $u$, nhiễu chuyển động phương sai $Q$: $\quad \hat{x} \leftarrow \hat{x} + u$, $\quad P \leftarrow P + Q$ — độ không chắc <b>tăng</b>.</p>
          <p><b>Cập nhật</b>: có phép đo $z$, dùng $K$ như trên — độ không chắc <b>giảm</b>.</p>
          <table class="t"><tr><th>thử</th><th>$\hat{x}$</th><th>$P$</th></tr><tr><td>bắt đầu</td><td>0</td><td>1</td></tr><tr><td>dự đoán: đi $u = 1$, $Q = 1$</td><td>1</td><td>2</td></tr><tr><td>đo $z = 1{,}5$, $R = 2$, $K = 0{,}5$</td><td>$\hl{1{,}25}$</td><td>$\hl{1}$</td></tr></table>
        introduces: [assign]
        focus: [1, 1, 1, 2, 3, 3]
        say: "Lọc Kalman chạy thành vòng hai bước. Bước dự đoán, robot đi thêm u, với nhiễu chuyển động phương sai Q, nên ước lượng được thay bằng giá trị cũ cộng u, và P tăng thêm Q. Mũi tên trên bảng nghĩa là thay bằng giá trị mới, và ở bước này độ không chắc tăng lên. Bước cập nhật, khi có phép đo z, ta dùng K như trên, và độ không chắc giảm xuống. Thử ngay, bắt đầu từ 0 với phương sai 1, đi thêm 1 với Q bằng 1, ta được dự đoán 1 với phương sai 2. Đo được 1 phẩy 5 với R bằng 2, K bằng 0 phẩy 5, nên ước lượng mới là 1 phẩy 25 với phương sai 1."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(1 / (1 + 2) - 0.333) < 0.001 and abs(1 / (1 + 4) - 0.2) < 1e-12"
      - "round(alg.kalman1d_update(0, 1, 1, 2)[1], 2) == 0.33 and round(alg.kalman1d_update(0, 1, 1, 4)[1], 6) == 0.2"
      - "alg.kalman1d_update(0, 1, 1, 0)[1] == 1 and alg.kalman1d_update(0, 1, 1, 0)[2] == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng độ lệch chuẩn thay cho phương sai <b class="red">(sai)</b>
          <br><span class="note">$P = 1$, độ lệch chuẩn đo $2$: $K$ đúng là $\frac{1}{1 + 4} = 0{,}2$, không phải $\frac{1}{1 + 2} \approx 0{,}33$.</span></div>
          <table class="t"><tr><th>đưa vào $R$</th><th>$K$</th><th>ước lượng mới (dự đoán 0, đo 1)</th></tr><tr><td>2 (sai)</td><td>$\approx 0{,}33$</td><td>$\approx 0{,}33$</td></tr><tr><td>$2^2 = 4$ (đúng)</td><td>$0{,}2$</td><td>$0{,}2$</td></tr></table>
        focus: [1, 2, 2]
        say: "Lỗi thứ nhất, dùng độ lệch chuẩn thay cho phương sai. Nếu P bằng 1 và độ lệch chuẩn của phép đo bằng 2, thì R là 4, K đúng là 0 phẩy 2, không phải 1 chia 3. Bảng cho thấy cách sai làm ước lượng nhảy tới khoảng 0 phẩy 33, tin cảm biến nhiều hơn mức nó đáng được tin."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên tăng $P$ ở bước dự đoán <b class="red">(sai)</b>
          <br><span class="note">Không cộng $Q$ thì $P$ chỉ giảm mãi, bộ lọc tin dự đoán tuyệt đối và bỏ qua phép đo mới.</span></div>
        say: "Lỗi thứ hai, quên tăng P ở bước dự đoán. Không cộng Q thì P chỉ giảm mãi, bộ lọc trở nên tin dự đoán tuyệt đối và bỏ qua mọi phép đo mới."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ $R = 0$ là an toàn <b class="red">(sai)</b>
          <br><span class="note">$R = 0$ cho $K = 1$, $P_{\text{mới}} = 0$: tin phép đo tuyệt đối, kể cả khi cảm biến hỏng.</span></div>
        say: "Lỗi thứ ba, nghĩ đặt R bằng 0 là an toàn. R bằng 0 cho K bằng 1 và phương sai mới bằng 0, tức tin phép đo tuyệt đối, kể cả khi cảm biến hỏng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng nguyên công thức cho hệ phi tuyến <b class="red">(sai)</b>
          <br><span class="note">Kalman tối ưu khi chuyển động và phép đo tuyến tính, nhiễu chuẩn. Hệ phi tuyến cần bản mở rộng, tuyến tính hoá quanh ước lượng bằng Jacobian.</span></div>
        say: "Lỗi thứ tư, dùng nguyên công thức cho hệ phi tuyến. Lọc Kalman chỉ tối ưu khi chuyển động và phép đo tuyến tính, nhiễu phân phối chuẩn. Hệ phi tuyến cần bản mở rộng, tuyến tính hoá quanh ước lượng bằng Jacobian."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.kalman1d_update(10, 4, 12, 4) == (0.5, 11.0, 2.0)"
      - "tuple(round(v, 6) for v in alg.kalman1d_update(10, 4, 12, 1)) == (0.8, 11.6, 0.8)"
      - "12 - 10 == 2 and round((1 - 0.5) * 4, 6) == 2 and round(4 * 1 / (4 + 1), 6) == 0.8 and round(0.2 * 4, 6) == 0.8"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\hat{x} = 10$, $P = 4$; đo $z = 12$, $R = 4$. Tính $K$, $\hat{x}_{\text{mới}}$, $P_{\text{mới}}$.</td></tr>
          <tr><td>2</td><td>Cảm biến tốt hơn, $R = 1$: làm lại.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ước lượng 10 với phương sai 4, đo được 12 với R bằng 4, tính K, ước lượng mới và phương sai mới. Câu hai, cảm biến tốt hơn với R bằng 1, làm lại. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $K = \dfrac{4}{4 + 4} = 0{,}5$; độ lệch $z - \hat{x} = 12 - 10 = 2$.</p>
          <p>$\hat{x} = 10 + 0{,}5 \cdot 2 = \hl{11}$; $P = (1 - 0{,}5) \cdot 4 = \hl{2}$.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, K bằng 4 chia 4 cộng 4, tức 0 phẩy 5. Độ lệch giữa phép đo và ước lượng là 12 trừ 10, bằng 2. Vậy ước lượng mới bằng 10 cộng nửa của 2, tức 11, và phương sai bằng nửa của 4, tức 2."
      - show: |
          <p>② $K = \dfrac{4}{4 + 1} = 0{,}8$; $\hat{x} = 10 + 0{,}8 \cdot 2 = \hl{11{,}6}$; $P = 0{,}2 \cdot 4 = \hl{0{,}8}$.</p>
          <p class="note">Kiểm: $\dfrac{PR}{P + R} = \dfrac{4 \cdot 1}{5} = 0{,}8$ ✓ — nhỏ hơn cả $P = 4$ lẫn $R = 1$.</p>
        focus: [1, 1, 2]
        say: "Câu hai, K bằng 4 chia 5, tức 0 phẩy 8, nên ước lượng mới bằng 10 cộng 0 phẩy 8 nhân 2, bằng 11 phẩy 6, gần phép đo hơn. Phương sai còn 0 phẩy 2 nhân 4, bằng 0 phẩy 8. Kiểm bằng dạng P nhân R chia P cộng R, 4 chia 5 cũng bằng 0 phẩy 8, nhỏ hơn cả hai nguồn."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
