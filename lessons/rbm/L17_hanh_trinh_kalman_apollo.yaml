scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tám người, một máy IBM 704, và một con tàu tới Mặt Trăng"
    checks:
      - "1983 - 1960 == 23"
    steps:
      - show: |
          <p>Năm 1960, một nhóm chỉ <b>8 người</b> ở trung tâm Ames của NASA phải tìm cách dẫn đường cho tàu <b>Apollo</b> bay vòng quanh Mặt Trăng.</p>
          <p>Máy mô phỏng là chiếc <b>IBM 704</b>. Lần chạy đầu tiên mất <b>hơn một giờ</b> — và cho kết quả đáng thất vọng.</p>
          <p>Năm 1983, một số chuyên đề ghi nhận bộ lọc ấy được dùng để dự đoán <b>đàn gia súc ở Pháp</b>, dò lỗi thiết bị đo trong nhà máy điện hạt nhân, điều khiển nhà máy điện.</p>
          <div class="box key">Hôm nay: bốn chặng từ 1960 tới 1985 — mỗi quy mô làm lộ ra điểm nghẽn nào, chuyên gia xử lý ra sao, và thực hành nào còn đúng cho robot của bạn.</div>
        focus: [1, 2, 3, 4]
        say: "Chào bạn, năm 1960, một nhóm nghiên cứu chỉ có 8 người ở một trung tâm của NASA phải tìm cách dẫn đường cho tàu Apollo bay vòng quanh Mặt Trăng. Máy mô phỏng của họ là chiếc IBM 704, và lần chạy đầu tiên mất hơn một giờ, rồi cho kết quả đáng thất vọng. 23 năm sau, các chuyên đề ghi nhận bộ lọc ấy dùng để dự đoán đàn gia súc ở Pháp, dò lỗi thiết bị đo trong nhà máy điện hạt nhân, và điều khiển nhà máy điện. Hôm nay ta đi qua bốn chặng tới năm 1985, xem mỗi quy mô làm lộ ra điểm nghẽn nào, chuyên gia xử lý ra sao, và điều gì còn đúng cho robot của bạn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "1 / (1 + 4) == 0.2 and round((1 - 0.2) * 1, 10) == 0.8"
      - "1 + 0.5 == 1.5"
      - "np.allclose(np.array([[1, 1], [0, 1]]) @ np.eye(2) @ np.array([[1, 0], [1, 1]]), [[2, 1], [1, 1]])"
      - "round(1.1 ** 2 - 1, 2) == 0.21 and 2 * 1 * 0.1 == 0.2"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 12</td><td>bước đo: $K = \frac{P}{P + R}$, phương sai mới $(1 - K)P$</td><td>$P = 1$, $R = 4$: $K = 0{,}2$, phương sai mới $\hlg{0{,}8}$</td></tr>
          <tr><td>bài 12</td><td>bước dự đoán: $P$ tăng thêm $Q$</td><td>$P = 1$, $Q = 0{,}5$: $P = 1{,}5$</td></tr>
          <tr><td>bài 13</td><td>nhiều chiều: $\mathbf{P}$ là ma trận, phải <b>đối xứng</b></td><td>sau một bước dự đoán: $\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}$</td></tr>
          <tr><td>bài 6</td><td>đạo hàm (Jacobian) cho biết đầu ra đổi bao nhiêu khi đầu vào nhích một chút</td><td>$x^2$ tại 1: nhích 0,1 thì tăng ≈ 2 nhân 0,1 = 0,2 (thật: 0,21)</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 12, bước đo dùng hệ số K bằng P chia P cộng R, rồi phương sai mới bằng 1 trừ K, nhân P. Ví dụ P bằng 1, R bằng 4 thì K bằng 0 phẩy 2, và phương sai mới là 0 phẩy 8. Cũng ở bài 12, bước dự đoán làm P tăng thêm Q, từ 1 lên 1 phẩy 5 khi Q bằng 0 phẩy 5. Ở bài 13, khi có nhiều chiều, P là một ma trận hiệp phương sai và phải đối xứng, ví dụ ma trận 2, 1, 1, 1 sau một bước dự đoán. Ở bài 6, Jacobian, tức đạo hàm, cho biết đầu ra đổi bao nhiêu khi đầu vào nhích một chút. Hàm x bình phương tại 1 có đạo hàm 2, nên nhích 0 phẩy 1 thì tăng khoảng 0 phẩy 2, so với thật là 0 phẩy 21."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>cập nhật theo thời gian</b></td><td>bước dự đoán: đẩy ước lượng tới thời điểm mới, $P$ tăng thêm $Q$</td></tr>
          <tr><td><b>cập nhật theo phép đo</b></td><td>bước đo: chỉ chạy khi có phép đo, $P$ giảm</td></tr>
          <tr><td><b>lọc Kalman mở rộng</b></td><td>cho hệ phi tuyến: tuyến tính hoá quanh <b>ước lượng hiện tại</b></td></tr>
          <tr><td><b>phân kỳ</b></td><td>ước lượng trôi xa giá trị thật, trong khi $P$ vẫn báo “rất chắc”</td></tr>
          <tr><td><b>nhiễu giả</b></td><td>cố ý cộng thêm $Q$ để bộ lọc không quá tự tin</td></tr>
          <tr><td><b>độ dài từ</b>; <b>dạng căn bậc hai</b></td><td>số bit máy dành cho một số; lưu “căn” của $P$ (một chiều: độ lệch chuẩn) thay cho $P$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng bảy thuật ngữ. Cập nhật theo thời gian là bước dự đoán, đẩy ước lượng tới thời điểm mới, và P tăng thêm Q. Cập nhật theo phép đo chỉ chạy khi có phép đo, và làm P giảm. Lọc Kalman mở rộng dùng cho hệ phi tuyến, bằng cách tuyến tính hoá quanh ước lượng hiện tại. Phân kỳ là khi ước lượng trôi xa giá trị thật, mà P vẫn báo rất chắc. Nhiễu giả là cố ý cộng thêm Q để bộ lọc không quá tự tin. Độ dài từ là số bit máy tính dành cho một con số, còn dạng căn bậc hai lưu căn của P, ở một chiều chính là độ lệch chuẩn, thay cho P."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: timeline
    kind: intuition
    title: "Bốn chặng trên một trục thời gian"
    steps:
      - show: |
