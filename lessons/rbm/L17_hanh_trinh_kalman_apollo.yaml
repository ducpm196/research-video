# Quy ước (như bài 12–13): \hat{x} ước lượng, P phương sai (hay ma trận hiệp phương sai), R phương sai nhiễu đo, Q phương sai nhiễu quá
#   trình cộng ở bước dự đoán, K = P/(P + R) trọng số của phép đo. Ma trận viết chữ hoa in đậm như bài 13.
#   “Cập nhật theo thời gian” = time update (dự đoán); “cập nhật theo phép đo” = measurement update; “lọc Kalman mở rộng” = extended
#   Kalman filter; “nhiễu giả” = pseudonoise; “dạng căn bậc hai” = square-root formulation; “độ dài từ” = word length.
