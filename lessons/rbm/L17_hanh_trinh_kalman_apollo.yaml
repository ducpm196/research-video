          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với bốn chặng. Chặng đầu là lúc khai sinh, khi nhóm 8 người mô phỏng dẫn đường cho tàu Apollo. Chặng hai, bộ lọc gặp dữ liệu thật, lộ ra phân kỳ và lỗi làm tròn. Chặng ba, bộ lọc lên máy bay, chạy thời gian thực trên máy tính 24 bit. Chặng cuối, các công thức ổn định trở nên nhanh hơn, và bộ lọc lan sang công nghiệp."

  # ───────────────────────── 5. CƠ CHẾ ─────────────────────────
  - id: loop_mech
    kind: concept
    title: "Cơ chế chung: vòng hai bước và hai cách hỏng"
    checks:
      - "1 / (1 + 0.5 * 4) == 1 / 3"
    steps:
      - show: |
          <div><svg width="1600" height="360" viewBox="0 0 1600 360">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
