          <circle cx="630" cy="150" r="15" fill="#2a78d6"/><text x="630" y="108" font-weight="bold">1961 → 1964</text><text x="630" y="200">dữ liệu thật</text><text x="630" y="232">phân kỳ, làm tròn</text>
