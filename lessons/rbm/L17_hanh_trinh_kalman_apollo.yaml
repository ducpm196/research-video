          <rect x="760" y="220" width="800" height="110" rx="10" fill="#fde8e8" stroke="#e11d48" stroke-width="3"/><text x="1160" y="264">hỏng 2: làm tròn trên máy từ ngắn</text><text x="1160" y="300">P mất đối xứng, có thể thành âm</text>
          </g>
          <line x1="200" y1="150" x2="200" y2="214" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="300" y1="220" x2="300" y2="156" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="460" y1="95" x2="754" y2="95" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
          <line x1="460" y1="275" x2="754" y2="275" stroke="#e11d48" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế xuyên suốt cả bài. Bên trái là vòng hai bước, cập nhật theo thời gian chạy mọi lúc và làm P tăng, cập nhật theo phép đo chỉ chạy khi có phép đo và làm P giảm. Bên phải là hai cách hỏng mà lịch sử đã gặp, thứ nhất là mô hình thiếu Q làm P co về 0, nên bộ lọc bỏ qua phép đo. Thứ hai là làm tròn trên máy có độ dài từ ngắn, làm P mất đối xứng, thậm chí thành âm."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 1960 tới 1961 — khai sinh: dẫn đường Apollo trên máy IBM 704"
    stage: {year: "1960 → 1961", scale: "nhóm 8 người ở Ames (NASA); máy mô phỏng IBM 704, tự viết chương trình nhân ma trận; phép đo quang học thưa, không đều; một lần chạy mô phỏng hơn 1 giờ; 18 phương trình vi phân bậc hai cho ma trận chuyển", source: "[MS85]", practice: "tách cập nhật theo thời gian và theo phép đo để nhận phép đo vào lúc bất kỳ; tuyến tính hoá quanh ước lượng hiện tại; xử lý tuần tự thay vì gom lô — đúng khi phi tuyến vừa phải và ước lượng đã gần giá trị thật"}
    checks:
      - "1 + 0.5 * 1 == 1.5 and 1.5 / (1.5 + 1) == 0.6"
      - "1 + 0.5 * 4 == 3 and 3 / (3 + 1) == 0.75"
      - "1 + 2 * (3 - 1) == 5 and 9 - 5 == 4"
      - "round(2.8 ** 2 + 2 * 2.8 * (3 - 2.8), 2) == 8.96 and round(9 - 8.96, 2) == 0.04"
      - "sum(range(1, 101)) == 5050 and 6 + 6 * 6 == 42"
      - "6 * 1 * 6 + 6 ** 3 == 252 and 1 * 6 * 6 + 6 * 1 * 6 == 72 and 2 * 18 == 6 * 6"
    steps:
      - show: |
          <p><b>Quy mô:</b> nhóm phân tích động lực học ở Ames chỉ có <b>8 người</b>. Máy mô phỏng IBM 704 không có sẵn chương trình nhân ma trận, nên phải tự viết.</p>
          <table class="t"><tr><th>điểm nghẽn</th><th>vì sao</th></tr>
          <tr><td>phi hành gia đo góc tới Trái Đất, Mặt Trăng bằng kính quang học: phép đo <b>thưa, không đều</b></td><td>công thức năm 1960 đòi phép đo liên tục, cách đều suốt chuyến bay</td></tr>
          <tr><td>bình phương tối thiểu có trọng số, lặp lại nhiều lần</td><td>quá nặng cho máy tính trên tàu thời đó, và cả cho máy IBM 704</td></tr>
          <tr><td>quỹ đạo tới Mặt Trăng là <b>phi tuyến</b></td><td>lý thuyết năm 1960 dành cho hệ tuyến tính</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, nhóm phân tích động lực học ở một trung tâm nghiên cứu của NASA chỉ có 8 người. Máy IBM 704 không có sẵn chương trình nhân ma trận, nên họ phải tự viết. Điểm nghẽn thứ nhất là phép đo góc bằng kính quang học thưa và không đều, còn công thức năm 1960 đòi phép đo liên tục, cách đều. Điểm nghẽn thứ hai là bình phương tối thiểu lặp lại quá nặng cho máy tính trên tàu. Điểm nghẽn thứ ba là quỹ đạo tới Mặt Trăng phi tuyến, còn lý thuyết năm 1960 dành cho hệ tuyến tính."
      - clear: true
        show: |
          <p><b>Cách xử lý 1:</b> tách công thức thành hai phần rời — <b>cập nhật theo thời gian</b> và <b>cập nhật theo phép đo</b>. Nhóm viết lại: nhìn lại thì “gần như hiển nhiên”, nhưng lúc đó là bước tiến lớn.</p>
          <table class="t"><tr><th>bước ($P = 1$, $R = 1$, $Q = 0{,}5$ mỗi giờ — số minh hoạ)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. phép đo đến sau 1 giờ</td><td>$P = 1 + 0{,}5 = 1{,}5$; $K = \frac{1{,}5}{2{,}5}$</td><td>$K = \hlb{0{,}6}$</td></tr>
          <tr><td>Bước 2. phép đo đến sau 4 giờ</td><td>$P = 1 + 0{,}5 \cdot 4 = 3$; $K = \frac{3}{4}$</td><td>$K = \hlg{0{,}75}$</td></tr></table>
          <p class="note">Khoảng chờ dài thì $P$ lớn hơn, nên phép đo đến muộn được tin nhiều hơn — tự động, không cần lịch đo cách đều.</p>
        focus: [1, 1, 2, "2.2", "2.3", 3]
        say: "Cách xử lý thứ nhất là tách công thức thành hai phần rời, cập nhật theo thời gian và cập nhật theo phép đo. Nhìn lại thì việc này gần như hiển nhiên, nhưng lúc đó là một bước tiến lớn. Làm thử với P bằng 1, R bằng 1, và Q bằng 0 phẩy 5 mỗi giờ, đều là số minh hoạ. Bước một, phép đo đến sau 1 giờ, P thành 1 phẩy 5, nên K bằng 1 phẩy 5 chia 2 phẩy 5, tức 0 phẩy 6. Bước hai, phép đo đến sau 4 giờ, P thành 3, nên K bằng 3 chia 4, tức 0 phẩy 75. Khoảng chờ càng dài thì phép đo đến muộn càng được tin nhiều, tự động, không cần lịch đo cách đều."
      - clear: true
        show: |
          <p><b>Cách xử lý 2:</b> tuyến tính hoá quanh <b>ước lượng hiện tại</b>, không quanh quỹ đạo định sẵn, vì “tính trung bình” ước lượng gần giá trị thật hơn. Đó là <b>lọc Kalman mở rộng</b>.</p>
          <table class="t"><tr><th>bước (phép đo $h(x) = x^2$, $x$ thật bằng 3 — số minh hoạ)</th><th>xấp xỉ theo đạo hàm</th><th>dự đoán tại 3 (thật: 9)</th></tr>
          <tr><td>Bước 3. quanh quỹ đạo định sẵn $x = 1$</td><td>$1 + 2 \cdot 1 \cdot (3 - 1)$</td><td>5, sai $\hl{4}$</td></tr>
          <tr><td>Bước 4. quanh ước lượng hiện tại $x = 2{,}8$</td><td>$2{,}8^2 + 2 \cdot 2{,}8 \cdot 0{,}2$</td><td>8,96, sai $\hlg{0{,}04}$</td></tr></table>
          <p class="note">Một lần nhập nhầm điều kiện đầu: quỹ đạo thật vẫn quanh Trái Đất, còn ước lượng xuất phát như đang bay tới Mặt Trăng. Bộ lọc vọt lố khá lớn lúc đầu, rồi hội tụ về gần quỹ đạo thật.</p>
        focus: [1, 1, "2.2", "2.3", 3, 3]
        say: "Cách xử lý thứ hai là tuyến tính hoá quanh ước lượng hiện tại, thay vì quanh quỹ đạo định sẵn, vì tính trung bình thì ước lượng gần giá trị thật hơn. Đó chính là lọc Kalman mở rộng. Bước ba, lấy phép đo x bình phương với x thật bằng 3, một số minh hoạ, xấp xỉ quanh x bằng 1 thì dự đoán 5, sai tới 4. Bước bốn, xấp xỉ quanh ước lượng 2 phẩy 8 thì dự đoán 8 phẩy 96, chỉ sai 0 phẩy 04. Có lần nhóm nhập nhầm, quỹ đạo thật vẫn quanh Trái Đất còn ước lượng như đang bay tới Mặt Trăng. Bộ lọc vọt lố lúc đầu, rồi vẫn hội tụ về gần quỹ đạo thật."
      - clear: true
        show: |
          <p><b>Kết quả, đầu năm 1961:</b> độ chính xác ngang bình phương tối thiểu có trọng số, nhưng giảm <b>rất mạnh</b> nhu cầu bộ nhớ và tốc độ máy trên tàu.</p>
          <table class="t"><tr><th>bước (100 phép đo, 6 trạng thái: vị trí và vận tốc — số minh hoạ)</th><th>gom lô, tính lại từ đầu</th><th>tuần tự kiểu Kalman</th></tr>
          <tr><td>Bước 5. số lần xử lý một phép đo</td><td>$1 + 2 + \dots + 100 = 5050$</td><td>$\hlg{100}$</td></tr>
          <tr><td>Bước 6. phải giữ trong bộ nhớ</td><td>cả 100 phép đo</td><td>$\hat{x}$ và $\mathbf{P}$: $6 + 36 = \hlg{42}$ số</td></tr>
          <tr><td>Bước 7. thứ tự nhân ở bước đo: $(\mathbf{K}\mathbf{H})\mathbf{P}$ hay $\mathbf{K}(\mathbf{H}\mathbf{P})$</td><td>$(\mathbf{K}\mathbf{H})\mathbf{P}$: $36 + 216 = 252$ phép nhân</td><td>$\mathbf{K}(\mathbf{H}\mathbf{P})$: $36 + 36 = 72$ phép nhân (mỗi lần đo một số)</td></tr></table>
          <p class="note">Nhóm <b>may mắn</b> đã chọn $(\mathbf{K}\mathbf{H})\mathbf{P}$, cách tốn hơn nhưng hoá ra <b>ổn định số hơn</b>, nên không gặp lỗi làm tròn rõ rệt; nếu chọn cách kia, có thể đã phải dùng số độ chính xác kép (mỗi số lưu gấp đôi số chữ số), chạy chậm hơn nhiều.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.4", 3, 3]
        introduces: [dots]
        say: "Đầu năm 1961, mô phỏng cho độ chính xác ngang bình phương tối thiểu, nhưng giảm rất mạnh nhu cầu bộ nhớ và tốc độ máy. Lấy 100 phép đo và 6 trạng thái, đều là số minh hoạ. Bước năm, gom lô và tính lại từ đầu mỗi lần có phép đo mới thì xử lý tổng cộng 5050 lần, còn cách tuần tự chỉ 100 lần. Bước sáu, cách tuần tự chỉ giữ ước lượng và ma trận P, tức 42 con số. Bước bảy, ở bước đo có hai thứ tự nhân ba ma trận, một cách tốn 252 phép nhân, cách kia chỉ 72. Nhóm may mắn đã chọn cách tốn hơn, và hoá ra nó ổn định số hơn. Nếu chọn cách kia, có thể họ đã phải dùng số độ chính xác kép, tức mỗi số lưu gấp đôi số chữ số, vốn chạy chậm hơn nhiều."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 1961 tới 1964 — dữ liệu thật: phân kỳ và lỗi làm tròn"
    stage: {year: "1961 → 1964", scale: "lần đầu xử lý số đo thật (tầng trên Agena, Lockheed, 1961, dữ liệu theo dõi từ nhiều trạm mặt đất); nghiên cứu Apollo 1962–1964 về độ dài từ ngắn của máy tính bay; bản ghi nhớ Honeywell 8/7/1964", source: "[MS85]", practice: "luôn cộng nhiễu quá trình (nhiễu giả) dù mô hình có vẻ đủ; giữ P đối xứng (chỉ tính nửa trên, hoặc lấy trung bình hai ô lệch); dùng dạng Joseph; loại phép đo có phần dư vượt 3 lần độ lệch chuẩn — đúng khi P không quá lạc quan"}
    checks:
      - "round(1 / (1 + 99), 2) == 0.01 and round(0.01 / 1.01, 4) == 0.0099 and round(100 * 0.0099) == 1"
      - "abs(1 / 2 - 0.5) < 1e-12 and abs(1 / 10 - 0.1) < 1e-12"
      - "round(1.1 / 2.1, 3) == 0.524 and round((0.1 + (0.01 + 0.4) ** 0.5) / 2 / (1 + (0.1 + (0.01 + 0.4) ** 0.5) / 2), 2) == 0.27"
      - "(1.0004 + 0.9996) / 2 == 1.0 and 6 * 7 // 2 == 21 and 36 - 21 == 15"
      - "round((1 - 0.3) * 1, 2) == 0.7 and round(0.7 ** 2 * 1 + 0.3 ** 2 * 4, 2) == 0.85 and round(0.8 ** 2 + 0.2 ** 2 * 4, 2) == 0.8"
      - "3 + 1 == 4 and 4 ** 0.5 == 2 and 3 * 2 == 6 and 5 < 6 < 7"
    steps:
      - show: |
          <p><b>Quy mô mới:</b> năm 1961, bộ lọc lần đầu chạy trên <b>số đo thật</b>: dữ liệu theo dõi từ nhiều trạm mặt đất của tầng trên một tên lửa. Từ 1962 tới 1964, nhóm Apollo nghiên cứu ảnh hưởng của <b>độ dài từ ngắn</b> trên máy tính bay.</p>
          <p><b>Điểm nghẽn:</b> năm 1961 mô phỏng chưa gặp vấn đề nào do làm tròn hay do mô hình sai; về sau nhiều nhóm báo bộ lọc <b>mất ổn định</b>. Hiện tượng “phân kỳ” được thấy lần đầu trong chính các nghiên cứu này.</p>
          <table class="t"><tr><th>bước ($Q = 0$, $P = 1$, $R = 1$ — số minh hoạ)</th><th>$P$ sau các phép đo</th><th>$K$ của phép đo kế tiếp</th></tr>
          <tr><td>Bước 1. sau 1 phép đo</td><td>$\frac{1}{2} = 0{,}5$</td><td>$\frac{0{,}5}{1{,}5} \approx 0{,}33$</td></tr>
          <tr><td>Bước 2. sau 99 phép đo</td><td>$\frac{1}{100} = 0{,}01$</td><td>$\frac{0{,}01}{1{,}01} \approx \hl{0{,}0099}$</td></tr></table>
        focus: [1, 2, "3.2", "3.3", 0]
        say: "Ở chặng hai, năm 1961, bộ lọc lần đầu chạy trên số đo thật, từ nhiều trạm mặt đất theo dõi tầng trên của một tên lửa. Từ giữa 1962 tới giữa 1964, trong các nghiên cứu tiếp theo cho Apollo, hiện tượng phân kỳ được thấy lần đầu. Bước một, lấy Q bằng 0, P bằng 1, R bằng 1, đều là số minh hoạ, sau một phép đo P còn 0 phẩy 5. Bước hai, sau 99 phép đo P chỉ còn 0 phẩy 01, nên K của phép đo kế tiếp chỉ khoảng 0 phẩy 0099. Phần dư 1 mét chỉ kéo ước lượng đi chừng 1 xăng-ti-mét, tức bộ lọc gần như bỏ qua phép đo."
      - clear: true
        show: |
          <p>Nhóm ghi lại: sau một loạt phép đo rất chính xác, $P$ “nhỏ” tới mức phép đo mới <b>bị bỏ qua</b>, và ước lượng trôi khỏi giá trị thật. Gốc rễ là <b>mô hình sai</b>. Cách chữa hiệu quả: cộng <b>nhiễu giả</b> ở bước dự đoán.</p>
          <table class="t"><tr><th>bước (cùng ví dụ, thêm $Q = 0{,}1$ — số minh hoạ)</th><th>$P + Q$</th><th>$K$</th></tr>
          <tr><td>Bước 3. phép đo đầu</td><td>1,1</td><td>$\frac{1{,}1}{2{,}1} \approx 0{,}524$</td></tr>
          <tr><td>Bước 4. sau nhiều phép đo, $K$ dừng lại</td><td>$\approx 0{,}370$</td><td>$\approx \hlg{0{,}27}$, không về 0</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Nhóm ghi lại rằng sau một loạt phép đo rất chính xác, P nhỏ tới mức phép đo mới bị bỏ qua, và ước lượng trôi khỏi giá trị thật. Gốc rễ là mô hình sai, vì vật thật không chạy đúng như mô hình. Cách chữa hiệu quả là cộng nhiễu giả ở bước dự đoán. Bước ba, cùng ví dụ nhưng thêm Q bằng 0 phẩy 1, ở phép đo đầu K bằng 1 phẩy 1 chia 2 phẩy 1, khoảng 0 phẩy 524. Bước bốn, sau nhiều phép đo, K dừng lại ở khoảng 0 phẩy 27, không bao giờ về 0, nên bộ lọc vẫn nghe phép đo."
      - clear: true
        show: |
          <p><b>Lỗi làm tròn:</b> $\mathbf{P}$ tính ra mất đối xứng, có khi có trị riêng âm. Các cách vá được ghi lại:</p>
          <table class="t"><tr><th>bước</th><th>cách vá</th><th>con số</th></tr>
          <tr><td>Bước 5. lấy trung bình hai ô ngoài đường chéo</td><td>$\begin{bmatrix} 2 & 1{,}0004 \\ 0{,}9996 & 1 \end{bmatrix}$ (số minh hoạ)</td><td>$\frac{1{,}0004 + 0{,}9996}{2} = \hlg{1}$</td></tr>
          <tr><td>Bước 6. chỉ tính đường chéo và nửa trên (bản ghi nhớ năm 1964)</td><td>6 trạng thái</td><td>21 ô thay vì 36, bớt 15</td></tr>
          <tr><td>Bước 7. dạng Joseph: $(1 - K)^2 P + K^2 R$, đúng với <b>mọi</b> $K$</td><td>$P = 1$, $R = 4$, $K$ lệch thành 0,3</td><td>dạng ngắn báo 0,7; Joseph báo $\hl{0{,}85}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Lỗi làm tròn làm ma trận P mất đối xứng, có khi còn có trị riêng âm, và nhóm ghi lại nhiều cách vá. Bước năm, lấy trung bình hai ô ngoài đường chéo, 1 phẩy 0004 và 0 phẩy 9996, đều là số minh hoạ, được đúng 1. Bước sáu, một bản ghi nhớ năm 1964 khuyên chỉ tính đường chéo và nửa trên, với 6 trạng thái là 21 ô thay vì 36. Bước bảy là dạng đầy đủ, 1 trừ K bình phương nhân P, cộng K bình phương nhân R, đúng với mọi K. Nếu K bị lệch thành 0 phẩy 3, dạng ngắn báo phương sai 0 phẩy 7, quá lạc quan, còn dạng đầy đủ báo đúng 0 phẩy 85."
      - clear: true
        show: |
          <p><b>Số đo thật có số hỏng.</b> Năm 1961, khi xử lý số đo của tầng trên tên lửa, nhóm loại một phép đo nếu phần dư vượt <b>3 lần độ lệch chuẩn</b> mà chính bộ lọc tính ra.</p>
          <table class="t"><tr><th>bước ($P = 3$, $R = 1$ — số minh hoạ)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 8. phương sai của phần dư</td><td>$P + R = 3 + 1$</td><td>4, độ lệch chuẩn $\sqrt{4} = 2$</td></tr>
          <tr><td>Bước 9. ngưỡng</td><td>$3 \cdot 2$</td><td>$\hlb{6}$</td></tr>
          <tr><td>Bước 10. phần dư 5 và 7</td><td>5 &lt; 6 &lt; 7</td><td>giữ 5, <b>loại</b> 7</td></tr></table>
          <p class="note">Nghiên cứu Apollo cũng kết luận: radar mặt đất nhìn chung tốt hơn đo trên tàu, kết quả này ủng hộ quyết định cuối cùng đặt dẫn đường chính ở mặt đất, trên tàu là hệ dự phòng.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Số đo thật có số hỏng, nên năm 1961 nhóm loại một phép đo nếu phần dư vượt 3 lần độ lệch chuẩn mà chính bộ lọc tính ra. Bước tám, với P bằng 3 và R bằng 1, số minh hoạ, phương sai của phần dư là 4, nên độ lệch chuẩn là căn của 4, bằng 2. Bước chín, ngưỡng là 3 nhân 2, bằng 6. Bước mười, phần dư 5 được giữ, còn phần dư 7 bị loại. Nghiên cứu Apollo cũng kết luận ra-đa mặt đất nhìn chung tốt hơn, nên dẫn đường chính đặt ở mặt đất, còn hệ trên tàu là dự phòng."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 1966 tới 1972 — thời gian thực trên máy bay: dạng căn bậc hai"
    stage: {year: "1966 → 1972", scale: "1966: lọc Kalman được ghi vào yêu cầu hệ dẫn đường máy bay C-5A, ứng dụng thời gian thực đầu tiên trên máy bay; 1968: phương pháp căn bậc hai cho máy tính số phẩy tĩnh; 1/1972: bay thử RAINPAL trên Convair CV-340 (44 000 lb), máy XDS-920 từ 24 bit, bộ nhớ 32K", source: "[MS85]", practice: "trên máy từ ngắn, không có độ chính xác kép: lưu và truyền P dưới dạng căn bậc hai thay vì vá tình thế; thử bay với hệ đo độc lập chính xác để đối chiếu"}
    checks:
      - "round((1 * 4 / (1 + 4)) ** 0.5, 3) == 0.894 and round(0.894 ** 2, 2) == 0.8"
      - "2 ** 24 == 16777216 and round(1e6 / 2 ** 24, 4) == 0.0596 and 1e6 / 0.01 == 1e8 > 2 ** 24"
      - "round(1000 / 2 ** 24, 7) == 0.0000596 and 1000 / 0.1 == 1e4 < 2 ** 24 and 0.1 / (1000 / 2 ** 24) > 1600"
      - "round(44000 * 0.45359237 / 1000) == 20"
      - "3 < 7"
    steps:
      - show: |
          <p><b>Quy mô:</b> tới năm 1966, ưu điểm của bộ lọc đã được công nhận rộng rãi, và lọc Kalman được <b>ghi vào yêu cầu</b> của hệ dẫn đường một máy bay vận tải quân sự — theo hiểu biết của hai tác giả, đó là ứng dụng <b>thời gian thực đầu tiên</b> trên máy bay.</p>
          <table class="t"><tr><th>điểm nghẽn của thế giới thật</th></tr>
          <tr><td>chọn đúng những trạng thái sai số cần ước lượng</td></tr>
          <tr><td>máy tính nhỏ, <b>độ dài từ có hạn</b>, tính bằng số phẩy tĩnh</td></tr>
          <tr><td>toàn bộ phép tính phải xong trong khung thời gian của máy nhỏ</td></tr></table>
          <p class="note">Hệ này vẫn dùng dạng chuẩn kèm các cách vá tình thế, và chính nó cho thấy cần dạng căn bậc hai cho máy nhỏ; đầu năm 1968, một phương pháp như thế cho máy tính phẩy tĩnh nhỏ được phát triển. Dạng căn bậc hai đầu tiên (Potter) được làm cho hệ Apollo, nhưng chưa xử lý được nhiễu quá trình.</p>
        focus: [1, 1, 2, 3, 3, 3]
        say: "Ở chặng ba, tới năm 1966 ưu điểm của bộ lọc đã được công nhận rộng rãi, và lọc Kalman được ghi vào yêu cầu của hệ dẫn đường một máy bay vận tải quân sự. Theo hiểu biết của hai tác giả, đó là ứng dụng thời gian thực đầu tiên trên máy bay. Ba điểm nghẽn là chọn đúng trạng thái sai số, máy tính nhỏ có độ dài từ hạn chế và tính bằng số phẩy tĩnh, và mọi phép tính phải xong kịp trong khung thời gian. Hệ này vẫn dùng dạng chuẩn kèm cách vá tình thế, và chính nó cho thấy cần dạng căn bậc hai cho máy nhỏ. Đầu năm 1968, một phương pháp như thế cho máy tính phẩy tĩnh nhỏ được phát triển. Dạng căn bậc hai đầu tiên đã dùng cho Apollo từ trước, nhưng chưa xử lý được nhiễu quá trình."
      - clear: true
        show: |
          <p><b>Ý tưởng:</b> lưu $s = \sqrt{P}$ (một chiều: <b>độ lệch chuẩn</b>) thay cho $P$, rồi cập nhật thẳng $s$. Dạng căn bậc hai cần <b>ít độ chính xác hơn</b> để giữ bộ lọc ổn định.</p>
          <table class="t"><tr><th>bước (số của bài 12: $P = 1$, $R = 4$)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. căn của phương sai</td><td>$s = \sqrt{1}$</td><td>1</td></tr>
          <tr><td>Bước 2. cập nhật thẳng $s$</td><td>$s \cdot \sqrt{\frac{R}{P + R}} = \sqrt{0{,}8}$</td><td>$\approx \hlb{0{,}894}$</td></tr>
          <tr><td>Bước 3. bình phương lại để kiểm</td><td>$0{,}894^2$</td><td>$\approx \hlg{0{,}8}$ — đúng như bài 12</td></tr></table>
          <p class="note">Bình phương của một số thực không bao giờ âm, nên $P = s^2$ không thể thành âm, dù làm tròn thế nào.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Ý tưởng là lưu s bằng căn của P, ở một chiều chính là độ lệch chuẩn, thay cho P, rồi cập nhật thẳng s. Theo hai tác giả, dạng căn bậc hai cần ít độ chính xác hơn để giữ bộ lọc ổn định. Bước một, với số của bài 12, P bằng 1 nên s bằng 1. Bước hai, cập nhật thẳng s, nhân với căn của R chia P cộng R, được căn của 0 phẩy 8, khoảng 0 phẩy 894. Bước ba, bình phương lại được khoảng 0 phẩy 8, đúng như bài 12. Bình phương của một số thực không bao giờ âm, nên P bằng s bình phương không thể thành âm, dù làm tròn thế nào."
      - clear: true
        show: |
          <p>Vì sao “ít độ chính xác hơn”? Máy từ <b>24 bit</b> phân biệt được $2^{24} = 16\,777\,216$ mức. Số phẩy tĩnh dùng <b>một</b> thang chung cho mọi số (số minh hoạ: độ lệch chuẩn 0,1 m và 1000 m).</p>
          <table class="t"><tr><th>bước</th><th>lưu phương sai</th><th>lưu độ lệch chuẩn</th></tr>
          <tr><td>Bước 4. số lớn nhất phải chứa</td><td>$1000^2 = 1\,000\,000$</td><td>1000</td></tr>
          <tr><td>Bước 5. một nấc của thang 24 bit</td><td>$\frac{10^6}{2^{24}} \approx 0{,}0596$</td><td>$\frac{1000}{2^{24}} \approx 0{,}0000596$</td></tr>
          <tr><td>Bước 6. số nhỏ nhất phải giữ</td><td>$0{,}1^2 = 0{,}01$: <b>nhỏ hơn một nấc</b>, thành 0</td><td>0,1: bằng hơn 1600 nấc</td></tr></table>
          <p class="note">Căn bậc hai thu tỉ số lớn nhất trên nhỏ nhất từ $10^8$ (vượt 16,8 triệu mức) xuống $10^4$ (vừa thừa).</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Vì sao dạng căn bậc hai cần ít độ chính xác hơn? Máy có độ dài từ 24 bit chỉ phân biệt được 2 mũ 24, khoảng 16 triệu 8 trăm nghìn mức, và số phẩy tĩnh dùng một thang chung cho mọi số. Bước bốn, lấy độ lệch chuẩn 0 phẩy 1 mét và 1000 mét, số minh hoạ, lưu phương sai thì số lớn nhất là một triệu. Bước năm, một nấc của thang khi đó khoảng 0 phẩy 06, còn lưu độ lệch chuẩn thì một nấc chỉ khoảng 6 phần trăm nghìn. Bước sáu, phương sai nhỏ 0 phẩy 01 nhỏ hơn một nấc, nên bị làm tròn thành 0, còn độ lệch chuẩn 0 phẩy 1 vẫn bằng hơn 1600 nấc. Căn bậc hai thu tỉ số lớn nhất trên nhỏ nhất từ 10 mũ 8 xuống 10 mũ 4, nằm gọn trong thang 24 bit."
      - clear: true
        show: |
          <p><b>Bay thử, tháng 1/1972</b> (dự án RAINPAL): máy bay Convair CV-340 nặng 44&nbsp;000 lb (≈ 20 tấn) khi cất cánh; máy tính XDS-920, từ <b>24 bit</b>, bộ nhớ <b>32K</b>; bộ lọc căn bậc hai đầy đủ, kể cả nhiễu quá trình.</p>
          <table class="t"><tr><th>điều ghi lại</th><th>ý nghĩa</th></tr>
          <tr><td>“chạy hoàn hảo” sau khi gỡ lỗi sớm</td><td>khi phần mềm có lỗi, bộ lọc căn bậc hai được coi là <b>trên mọi nghi ngờ</b>; dạng chuẩn thì luôn bị nghi vì hay phân kỳ</td></tr>
          <tr><td><b>3</b> phép đo khoảng cách, so với <b>7</b> máy kinh vĩ của trường bắn</td><td>ước lượng mượt hơn, độ chính xác cùng cỡ</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Tháng 1 năm 1972, bộ lọc căn bậc hai đầy đủ, kể cả nhiễu quá trình, được bay thử lần đầu trên một máy bay nặng khoảng 20 tấn, với máy tính 24 bit. Bộ lọc chạy hoàn hảo sau khi gỡ lỗi sớm, tới mức khi phần mềm có lỗi, người ta coi nó là trên mọi nghi ngờ. Còn dạng chuẩn thì luôn bị nghi, vì hay phân kỳ hoặc sinh ra trị riêng âm. Chỉ với 3 phép đo khoảng cách, so với 7 máy kinh vĩ của trường bắn, ước lượng lúc hạ cánh mượt hơn và có độ chính xác cùng cỡ."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 1973 tới 1985 — ổn định và tiếp tục: lan sang công nghiệp"
    stage: {year: "1973 → 1985", scale: "1973: thuật toán căn bậc hai của Carlson gần bằng tốc độ dạng chuẩn; thuật toán căn bậc hai dẫn đường cho Mariner 10 (sao Kim–sao Thuỷ); 1975: phân tích U-D của Bierman, chỉ tốn hơn dạng chuẩn một chút, không cần khai căn; 1983: số chuyên đề IEEE về ứng dụng công nghiệp", source: "[MS85]", practice: "người có kinh nghiệm bỏ cách vá tình thế, chọn thuật toán có điều kiện số tốt; trên máy lớn, độ chính xác kép có thể đủ cho lỗi số nhưng không chữa mô hình sai"}
    checks:
      - "np.allclose(np.array([[1, 1], [0, 1]]) @ np.diag([1, 1]) @ np.array([[1, 1], [0, 1]]).T, [[2, 1], [1, 1]])"
      - "1 * 1 * 1 + 1 == 2 and 1 * 1 == 1 and 2 * 3 // 2 == 3"
      - "1985 - 1960 == 25"
    steps:
      - show: |
          <p><b>Điểm nghẽn mới:</b> dạng căn bậc hai được chấp nhận <b>khá chậm</b> — thuật toán đầu chạy chậm hơn dạng chuẩn, trông quá phức tạp, tốn bộ nhớ và thời gian.</p>
          <table class="t"><tr><th>năm</th><th>bước tiến (ghi trên màn hình: tên thuật toán)</th></tr>
          <tr><td>1973</td><td>thuật toán Carlson: giữ ma trận căn ở dạng tam giác, với số trạng thái vừa phải thì <b>gần bằng tốc độ</b> dạng chuẩn</td></tr>
          <tr><td>1973</td><td>phép tính dẫn đường cho tàu Mariner 10 bay qua sao Kim và sao Thuỷ dùng thuật toán căn bậc hai (Dyer–McReynolds, 1969)</td></tr>
          <tr><td>1975</td><td>phân tích U-D (Bierman): chỉ tốn hơn dạng chuẩn <b>một chút</b>, và <b>không cần khai căn</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, điểm nghẽn mới là dạng căn bậc hai được chấp nhận khá chậm, có lẽ vì thuật toán đầu chạy chậm, trông phức tạp và tốn bộ nhớ. Năm 1973, một thuật toán mới giữ ma trận căn ở dạng tam giác, và với số trạng thái vừa phải thì gần bằng tốc độ dạng chuẩn. Cũng năm 1973, phép tính dẫn đường cho một tàu thăm dò bay qua sao Kim và sao Thuỷ đã dùng thuật toán căn bậc hai. Năm 1975, phép phân tích U D chỉ tốn hơn dạng chuẩn một chút, và không cần khai căn."
      - clear: true
        show: |
          <p>Phân tích U-D viết $\mathbf{P} = \mathbf{U}\mathbf{D}\mathbf{U}^T$: $\mathbf{U}$ tam giác trên, đường chéo bằng 1; $\mathbf{D}$ chéo, chứa các số <b>không âm</b>. Thử với ma trận dự đoán của bài 13:</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. chọn hai thừa số</td><td>$\mathbf{U} = \begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$, $\mathbf{D} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}$</td><td>chỉ lưu 3 số: 1 ô của $\mathbf{U}$, 2 ô của $\mathbf{D}$</td></tr>
          <tr><td>Bước 2. nhân ra</td><td>$\mathbf{U}\mathbf{D}\mathbf{U}^T = \begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 1 & 0 \\ 1 & 1 \end{bmatrix}$</td><td>$\hlg{\begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix}}$ — đúng ma trận của bài 13</td></tr></table>
          <p class="note">Bộ lọc chỉ cập nhật $\mathbf{U}$ và $\mathbf{D}$. Chừng nào các số trong $\mathbf{D}$ không âm, $\mathbf{P}$ ghép lại luôn đối xứng và không có phương sai âm.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Phân tích U D viết P bằng U nhân D nhân U chuyển vị. Trong đó U là ma trận tam giác trên có đường chéo bằng 1, còn D là ma trận chéo chứa các số không âm. Bước một, với ma trận dự đoán 2, 1, 1, 1 của bài 13, ta chọn U có ô trên phải bằng 1, và D là ma trận đơn vị, chỉ cần lưu 3 con số. Bước hai, vì D là ma trận đơn vị, ta chỉ cần nhân U với U chuyển vị, và được đúng ma trận 2, 1, 1, 1. Bộ lọc chỉ cập nhật U và D, nên chừng nào các số trong D không âm, P ghép lại luôn đối xứng và không có phương sai âm."
      - clear: true
        show: |
          <table class="t"><tr><th>số chuyên đề năm 1983 về ứng dụng lọc Kalman (tạp chí điều khiển tự động của IEEE)</th></tr>
          <tr><td>quỹ đạo tàu vũ trụ, theo dõi bằng radar, dẫn đường, chuyển động tàu thuỷ</td></tr>
          <tr><td>dự đoán đàn gia súc ở Pháp; đo phóng xạ tự nhiên khi thăm dò giếng dầu khí; đo lưu lượng tức thời</td></tr>
          <tr><td>ước lượng đại lượng không đo được trong dây chuyền công nghiệp; dò lỗi thiết bị đo nhà máy hạt nhân; điều khiển nhà máy điện</td></tr></table>
          <div class="box key">Kết luận năm 1985 của hai tác giả: người có kinh nghiệm đang <b>bỏ cách vá tình thế</b> để chọn thuật toán có điều kiện số tốt hơn. Trên máy lớn, số độ chính xác kép có thể chữa lỗi số, nhưng <b>mô hình sai</b> thì vẫn còn.</div>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Năm 1983, một số chuyên đề của tạp chí điều khiển tự động gom các ứng dụng thật khác nhau. Có quỹ đạo tàu vũ trụ, theo dõi bằng ra-đa, dẫn đường và chuyển động tàu thuỷ. Có dự đoán đàn gia súc ở Pháp, và đo phóng xạ khi thăm dò giếng dầu khí. Có cả dây chuyền công nghiệp, dò lỗi thiết bị đo nhà máy hạt nhân, và điều khiển nhà máy điện. Năm 1985, hai tác giả kết luận người có kinh nghiệm đang bỏ cách vá tình thế, để chọn thuật toán có điều kiện số tốt hơn. Trên máy lớn, số độ chính xác kép có thể chữa lỗi số, nhưng mô hình sai thì vẫn còn đó."

  # ───────────────────────── 10. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình theo đường khác"
    checks:
      - "3 * 1 / (3 + 1) == 0.75 and (1 - 0.75) * 3 == 0.75"
      - "100 * 101 // 2 == 5050"
      - "round(0.49 * 1 + 0.09 * 4, 2) == 0.85"
      - "7 ** 2 == 49 > 9 * 4 == 36 > 25 == 5 ** 2"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>$K = 0{,}75$ (chặng 1)</td><td>phương sai mới tính hai cách: $\frac{P R}{P + R} = \frac{3}{4}$, và $(1 - K)P = 0{,}25 \cdot 3$ — cùng bằng 0,75 ✓</td></tr>
          <tr><td>5050 lần (chặng 1)</td><td>ghép cặp đầu với cuối: $1 + 100 = 2 + 99 = \dots = 101$, có 50 cặp: $50 \cdot 101 = 5050$ ✓</td></tr>
          <tr><td>0,85 (chặng 2)</td><td>như phép thử thẳng ở bài 12: trọng số 0,3 cho $0{,}49 \cdot 1 + 0{,}09 \cdot 4 = 0{,}85$ ✓</td></tr>
          <tr><td>loại phần dư 7 (chặng 2)</td><td>so bình phương, khỏi khai căn: $7^2 = 49 > 9 \cdot 4 = 36$, còn $5^2 = 25 < 36$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Với K bằng 0 phẩy 75, phương sai mới theo P nhân R chia P cộng R là 3 phần 4, và theo 1 trừ K nhân P cũng vậy. Với 5050 lần, ghép số đầu với số cuối, mỗi cặp có tổng 101, có 50 cặp, nên tổng là 5050. Với 0 phẩy 85, phép thử thẳng như ở bài 12 với trọng số 0 phẩy 3 cho 0 phẩy 49 cộng 0 phẩy 36, đúng 0 phẩy 85. Với phần dư 7, so bình phương cho khỏi khai căn, 49 lớn hơn 9 nhân 4 là 36, còn 25 thì nhỏ hơn."

  # ───────────────────────── 11. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lần chạy đầu sai thì phương pháp sai”</td><td>khoảng 1960 tới 1961, lần chạy đầu đáng thất vọng chỉ vì gọi một chương trình con sai cách; lần thứ hai chạy tốt</td><td>kiểm mã bằng bài thử nhỏ đã biết đáp án trước khi kết luận về phương pháp</td></tr>
          <tr><td><b class="red">2.</b> “Mô phỏng chạy tốt là bộ lọc đã ổn” (lỗi của người đã đi làm)</td><td>năm 1961 mô phỏng chưa gặp vấn đề nào do làm tròn hay do mô hình sai; phân kỳ chỉ lộ ra với dữ liệu thật và máy từ ngắn</td><td>thử với số đo thật, đúng độ dài từ của máy đích, chạy thật lâu</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên, ở mức con người. Bài học sai thứ nhất là nghĩ lần chạy đầu sai thì phương pháp sai. Khoảng 1960 tới 1961, lần chạy đầu đáng thất vọng chỉ vì gọi một chương trình con sai cách, và lần thứ hai chạy tốt. Bài học sai thứ hai hay gặp ở người đã đi làm, là nghĩ mô phỏng chạy tốt thì bộ lọc đã ổn, trong khi phân kỳ chỉ lộ ra với dữ liệu thật và máy từ ngắn. Hãy thử với số đo thật, đúng độ dài từ của máy đích, và chạy thật lâu."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Máy mạnh hơn, số chính xác hơn là hết phân kỳ”</td><td>độ chính xác kép chữa lỗi làm tròn, nhưng $P$ co về 0 vì <b>mô hình sai</b> thì vẫn còn: chặng 2, $K \approx 0{,}0099$</td><td>giữ $Q$ đủ lớn cho phần mô hình không nắm được</td></tr>
          <tr><td><b class="red">4.</b> “NASA làm thế nào, mình chép y thế”</td><td>mỗi lựa chọn có điều kiện: Apollo đặt dẫn đường chính ở <b>mặt đất</b>; máy bay năm 1972 cần căn bậc hai vì từ 24 bit, phẩy tĩnh</td><td>hỏi máy của mình có bao nhiêu bit, đo lúc nào, sai số chênh nhau bao nhiêu lần</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Hai bài học sai tiếp theo ở mức hệ thống. Bài học sai thứ ba là nghĩ máy mạnh hơn, số chính xác hơn thì hết phân kỳ. Độ chính xác kép chữa được lỗi làm tròn, nhưng P co về 0 vì mô hình sai thì vẫn còn, như K khoảng 0 phẩy 0099 ở chặng hai. Bài học sai thứ tư là chép y cách làm của cơ quan vũ trụ. Thật ra chính Apollo đặt dẫn đường chính ở mặt đất, còn máy bay năm 1972 cần căn bậc hai vì máy từ 24 bit, phẩy tĩnh. Hãy hỏi máy của mình có bao nhiêu bit, đo lúc nào, và các sai số chênh nhau bao nhiêu lần."

  # ───────────────────────── 12. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì với robot của mình?"
    checks:
      - "8 * 3600 == 28800"
      - "(0.02 ** 2, 20 ** 2) == (0.0004, 400) and round(400 / 0.0004) == 10 ** 6 < 2 ** 24 and round(2 ** 24 / 10 ** 6, 1) == 16.8"
      - "(0.002 ** 2, 20 ** 2) == (0.000004, 400) and round(400 / 0.000004) == 10 ** 8 > 2 ** 24"
      - "12 + 4 == 16 and 16 ** 0.5 == 4 and 3 * 4 == 12 and 9 < 12 < 15"
      - "0 + 4 == 4 and 4 ** 0.5 == 2 and 3 * 2 == 6 and 9 > 6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>robot giao hàng trong khuôn viên: vi điều khiển chỉ có số thực 32 bit (24 bit phần định trị), 4 trạng thái, định vị vệ tinh mỗi giây, chạy 8 giờ (số minh hoạ)</th></tr>
          <tr><td>1</td><td>độ lệch chuẩn nhỏ nhất 0,02 m, lớn nhất 20 m. Dạng chuẩn có giữ đối xứng, hay chuyển sang U-D?</td></tr>
          <tr><td>2</td><td>phép đo vị trí có phần dư 9 m, phương sai phần dư $P + R = 12 + 4$. Giữ hay loại? Nếu ai đó đặt $P = 0$ thì sao?</td></tr></table>
        focus: [1, 1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định cho một robot giao hàng trong khuôn viên, đều là số minh hoạ. Vi điều khiển chỉ có số thực 32 bit, bộ lọc có 4 trạng thái, định vị vệ tinh mỗi giây, và robot chạy 8 giờ. Câu một, độ lệch chuẩn nhỏ nhất 0 phẩy 02 mét, lớn nhất 20 mét, vậy bạn dùng dạng chuẩn có giữ đối xứng, hay chuyển sang U D? Câu hai, phép đo vị trí có phần dư 9 mét, phương sai phần dư là 12 cộng 4, vậy giữ hay loại, và nếu ai đó đặt P bằng 0 thì sao? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <p>8 giờ là $8 \cdot 3600 = 28\,800$ lần cập nhật. Tỉ số phương sai: $\frac{20^2}{0{,}02^2} = \frac{400}{0{,}0004} = 10^6$, còn dưới $2^{24} \approx 16{,}8 \cdot 10^6$ khoảng <b>17 lần</b>.</p>
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>dạng chuẩn + nửa trên + Joseph + $Q$ dương</td><td>mã ngắn, dễ đọc, dễ gỡ lỗi</td><td>chỉ dư khoảng 17 lần; phải theo dõi $P$ trong cả 28&nbsp;800 bước</td></tr>
          <tr><td>U-D</td><td>$\mathbf{P}$ luôn đối xứng, không âm; chỉ tốn hơn một chút</td><td>mã khó viết, khó đọc hơn</td></tr></table>
          <p class="note">Điều kiện đổi: nếu độ lệch chuẩn nhỏ nhất là 0,002 m, tỉ số thành $10^8$, vượt $2^{24}$ — khi đó chọn dạng căn bậc hai (như máy bay năm 1972) hoặc U-D. So tỉ số phương sai với $2^{24}$ chỉ là quy tắc thô do bài này suy ra, không phải của McGee và Schmidt (1985).</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Đáp án câu một, 8 giờ là 8 nhân 3600, tức 28 nghìn 800 lần cập nhật. Tỉ số phương sai là 400 chia 0 phẩy 0004, bằng một triệu, thấp hơn 2 mũ 24 khoảng 17 lần. Dạng chuẩn có giữ nửa trên, dạng đầy đủ và Q dương cho mã ngắn, dễ gỡ lỗi, nhưng chỉ dư khoảng 17 lần, nên phải theo dõi P suốt các bước. Dạng U D giữ P luôn đối xứng, không âm, chỉ tốn hơn một chút, đổi lại mã khó viết hơn. Nếu độ lệch chuẩn nhỏ nhất là 0 phẩy 002 mét, tỉ số thành 10 mũ 8, vượt 2 mũ 24, khi đó nên chọn dạng căn bậc hai như máy bay năm 1972, hoặc dạng U D."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: bước</th><th>phép tính</th><th>kết luận</th></tr>
          <tr><td>Bước 1. $P$ đúng: phương sai phần dư $12 + 4 = 16$</td><td>độ lệch chuẩn 4, ngưỡng $3 \cdot 4 = 12$</td><td>9 &lt; 12: <b>giữ</b> phép đo</td></tr>
          <tr><td>Bước 2. ai đó đặt $P = 0$: chỉ còn $R = 4$</td><td>độ lệch chuẩn 2, ngưỡng $3 \cdot 2 = 6$</td><td>9 &gt; 6: <b class="red">loại nhầm</b> một phép đo tốt</td></tr></table>
          <p class="note">Như hai tác giả ghi: $P$ quá lạc quan thì phép đo bên ngoài bị coi nhẹ. Ngưỡng loại số hỏng chỉ đúng khi $P$ trung thực; nếu thấy bộ lọc loại liên tục nhiều phép đo, hãy nghi $P$ và $Q$ trước, đừng nghi cảm biến.</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Đáp án câu hai, nếu P đúng thì phương sai phần dư là 16, độ lệch chuẩn là 4, ngưỡng là 12, và 9 nhỏ hơn 12 nên giữ phép đo. Nếu ai đó đặt P bằng 0, chỉ còn R bằng 4, độ lệch chuẩn 2, ngưỡng 6, và phép đo tốt bị loại nhầm. Như hai tác giả ghi, P quá lạc quan thì phép đo bên ngoài bị coi nhẹ. Thấy bộ lọc loại liên tục nhiều phép đo, hãy nghi P và Q trước, đừng vội nghi cảm biến."

  # ───────────────────────── 13. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">1960–1961: tách hai bước, tuyến tính hoá quanh ước lượng</span><span class="a">→</span>
          <span class="n">1961–1964: nhiễu giả, giữ đối xứng, loại số hỏng</span><span class="a">→</span>
          <span class="n">1966–1972: căn bậc hai trên máy 24 bit</span><span class="a">→</span>
          <span class="n">1973–1985: U-D nhanh, lan sang công nghiệp</span></div>
        say: "Tổng kết lại hành trình. Lúc khai sinh, bộ lọc ra đời nhờ tách hai bước và tuyến tính hoá quanh ước lượng. Khi gặp dữ liệu thật, nó cần nhiễu giả, giữ đối xứng và loại số hỏng. Trên máy bay với máy tính 24 bit, nó cần dạng căn bậc hai. Rồi dạng U D nhanh gần bằng dạng chuẩn, và bộ lọc lan sang công nghiệp."
      - show: |
          <div class="box key"><b>Tư duy:</b> công thức đúng trên giấy chưa đủ. Hỏi ba câu: mô hình bỏ sót gì, máy có bao nhiêu bit, và số đo nào có thể hỏng — rồi tính thử bằng số của chính robot mình.</div>
        say: "Điều cần mang theo, công thức đúng trên giấy chưa đủ. Hãy hỏi ba câu, mô hình bỏ sót gì, máy có bao nhiêu bit, số đo nào có thể hỏng, rồi tính thử bằng số của chính robot mình."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá Toán cho robot. Từ phép quay, động học, phương trình vi phân, điều khiển, lọc Kalman, lấy mẫu, lập kế hoạch đường đi và hiệu chuẩn, bạn đã đi tới cách các chuyên gia đưa một công thức toán lên máy thật suốt 25 năm.</p>
        say: "Đây là bài cuối của khoá Toán cho robot. Bạn đã đi từ phép quay, động học, phương trình vi phân và điều khiển, tới lọc Kalman, lấy mẫu, lập kế hoạch đường đi và hiệu chuẩn. Và cuối cùng là cách các chuyên gia đưa một công thức toán lên máy thật suốt 25 năm. Cảm ơn bạn đã theo học đến cuối."
