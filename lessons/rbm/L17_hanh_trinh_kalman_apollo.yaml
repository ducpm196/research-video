#   ghi “(số minh hoạ)”: 100 phép đo; Q = 0,5 mỗi giờ, khoảng 1 giờ / 4 giờ; h(x) = x², x thật 3, ước lượng 2,8; Q = 0,1; P = 3, R = 1,
#   phần dư 5 và 7; ô lệch 1,0004 / 0,9996; độ lệch chuẩn 0,1 m và 1000 m; robot của câu đố.
#   Lời đọc không nêu tên người; tên chương trình chỉ trên màn hình (Agena, C-5A, RAINPAL, Mariner 10, Potter, Householder, Carlson, U-D):
