  - id: check
    kind: check
    title: "Tự kiểm: tính 0,9 mũ 10 bằng bình phương, và 1 chia e"
    checks:
      - "round(0.81 ** 2, 4) == 0.6561 and round(0.6561 ** 2, 4) == 0.4305 and round(0.43046721 * 0.81, 4) == 0.3487"
      - "round(0.9 ** 8, 8) == 0.43046721 and round(0.9 ** 10, 4) == 0.3487"
      - "round(1 / 2.71828, 4) == 0.3679 and round(0.3679 - 0.3487, 4) == 0.0192"
    steps:
      - show: |
          <p>Đường khác cho $0{,}9^{10}$: không lặp 10 bước mà <b>bình phương liên tiếp</b>.</p>
          <table class="t"><tr><th>lũy thừa</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>$0{,}9^2$</td><td>$0{,}9 \cdot 0{,}9$</td><td>0,81</td></tr>
          <tr><td>$0{,}9^4$</td><td>$0{,}81 \cdot 0{,}81$</td><td>0,6561</td></tr>
          <tr><td>$0{,}9^8$</td><td>$0{,}6561 \cdot 0{,}6561$</td><td>$\approx 0{,}4305$</td></tr>
          <tr><td>$0{,}9^{10}$</td><td>$0{,}9^8 \cdot 0{,}9^2 = 0{,}43047 \cdot 0{,}81$</td><td>$\approx 0{,}3487$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Làm sao biết 0 phẩy 3487 là đúng mà không phải lặp lại 10 bước? Ta tính 0 phẩy 9 mũ 10 theo đường khác, bình phương liên tiếp. Bình phương 0 phẩy 9 được 0 phẩy 81, bình phương tiếp được 0 phẩy 6561, tức 0 phẩy 9 mũ 4. Bình phương lần nữa được khoảng 0 phẩy 4305, tức mũ 8. Nhân thêm 0 phẩy 81 để lên mũ 10, ta được 0 phẩy 3487, khớp với kết quả lặp từng bước."
      - show: |
          <p>Nghiệm đúng cũng kiểm lại được: $e^{-1} = \frac{1}{e} \approx \frac{1}{2{,}71828} \approx 0{,}3679$; hiệu $0{,}3679 - 0{,}3487 = 0{,}0192$ ✓</p>
        say: "Nghiệm đúng cũng kiểm lại được, vì e mũ âm 1 là 1 chia e, tức 1 chia 2 phẩy 71828, xấp xỉ 0 phẩy 3679. Hiệu của hai số là 0 phẩy 0192, đúng sai số đã tìm."

  # ───────────────────────── 5. SAI SỐ ─────────────────────────
  - id: error
    kind: concept
    title: "Giảm h một nửa, sai số giảm một nửa"
    checks:
      - "[round(math.exp(-1) - alg.euler_ode(lambda t, x: -x, 1.0, h, round(1 / h))[-1], 4) for h in (0.1, 0.05, 0.025)] == [0.0192, 0.0094, 0.0046]"
      - "[round(alg.euler_ode(lambda t, x: -x, 1.0, h, round(1 / h))[-1], 4) for h in (0.1, 0.05, 0.025)] == [0.3487, 0.3585, 0.3632]"
    steps:
      - show: |
          <table class="t"><tr><th>bước $h$</th><th>số bước</th><th>$x$ tại $t = 1$</th><th>sai số</th></tr>
          <tr><td>0,1</td><td>10</td><td>0,3487</td><td>0,0192</td></tr>
          <tr><td>0,05</td><td>20</td><td>0,3585</td><td>0,0094</td></tr>
          <tr><td>0,025</td><td>40</td><td>0,3632</td><td>0,0046</td></tr></table>
          <div class="box key">Sai số toàn cục tỉ lệ với $h$: Euler là phương pháp <b>bậc 1</b>. Muốn thêm một chữ số chính xác, phải tốn gấp 10 lần số bước.</div>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng này chạy lại cùng bài toán với ba bước khác nhau. Với h bằng 0 phẩy 1, sai số là 0 phẩy 0192. Giảm h còn 0 phẩy 05, sai số còn 0 phẩy 0094. Giảm tiếp còn 0 phẩy 025, sai số còn 0 phẩy 0046, mỗi lần giảm khoảng một nửa. Ta nói sai số toàn cục tỉ lệ với h, và Euler là phương pháp bậc 1. Hệ quả là muốn thêm một chữ số chính xác, ta phải tốn gấp 10 lần số bước."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "[round(v, 4) for v in alg.euler_ode(lambda t, x: -x, 1.0, 2.5, 3)] == [1.0, -1.5, 2.25, -3.375]"
      - "round(math.exp(-2.5), 3) == 0.082 and round(math.exp(-5), 4) == 0.0067 and round(math.exp(-7.5), 5) == 0.00055"
      - "abs(1 - 0.9 ** 10 - (1 - 0.3487)) < 1e-4"
      - "round(alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 1)[-1] - math.exp(-0.1), 4) == -0.0048"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chọn $h$ quá lớn <b class="red">(sai)</b>
          <br><span class="note">$h = 2{,}5$: mỗi bước nhân $1 - 2{,}5 = -1{,}5$, được $1;\ -1{,}5;\ 2{,}25;\ -3{,}375$ — dao động và lớn dần, trong khi nghiệm đúng giảm về 0.</span></div>
          <table class="t"><tr><th>$t$</th><th>0</th><th>2,5</th><th>5</th><th>7,5</th></tr>
          <tr><td>Euler, $h = 2{,}5$</td><td>1</td><td>−1,5</td><td>2,25</td><td>−3,375</td></tr>
          <tr><td>nghiệm đúng</td><td>1</td><td>0,082</td><td>0,0067</td><td>0,00055</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, chọn h quá lớn. Với h bằng 2 phẩy 5, mỗi bước nhân với âm 1 phẩy 5, nên dãy số dao động và lớn dần, trong khi nghiệm đúng giảm êm về 0."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy sai số một bước làm sai số cuối <b class="red">(sai)</b>
          <br><span class="note">Một bước $h = 0{,}1$ chỉ lệch khoảng $0{,}0048$, nhưng 10 bước cộng dồn thành $0{,}0192$.</span></div>
        say: "Lỗi thứ hai, lấy sai số của một bước làm sai số cuối cùng. Một bước với h bằng 0 phẩy 1 chỉ lệch khoảng 0 phẩy 0048, nhưng 10 bước cộng dồn thành 0 phẩy 0192."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên điều kiện đầu <b class="red">(thiếu)</b>
          <br><span class="note">Cùng một quy tắc $x' = -x$ có vô số lời giải, mỗi giá trị $x(0)$ cho một lời giải. Euler phải bắt đầu từ đúng $x(0)$.</span></div>
        say: "Lỗi thứ ba, quên điều kiện đầu. Cùng một quy tắc x phẩy bằng âm x có vô số lời giải, mỗi giá trị ban đầu cho một lời giải, nên Euler phải bắt đầu từ đúng giá trị đó."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lẫn $h$ với thời gian kết thúc <b class="red">(sai)</b>
          <br><span class="note">Tới $t = 1$ với $h = 0{,}1$ cần $1 / 0{,}1 = 10$ bước. Số bước $= T / h$.</span></div>
        say: "Lỗi thứ tư, lẫn bước h với thời gian kết thúc. Muốn tới t bằng 1 với h bằng 0 phẩy 1 thì cần 1 chia 0 phẩy 1, bằng 10 bước. Số bước luôn bằng thời gian chia cho h."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.euler_ode(lambda t, x: 2 - x, 0.0, 0.5, 2) == [0.0, 1.0, 1.5]"
      - "round(2 * (1 - math.exp(-1)), 4) == 1.2642"
      - "abs((2 - 0) - 2) < 1e-12"
      - "[round(v, 3) for v in alg.euler_ode(lambda t, x: 2 - x, 0.0, 0.25, 4)] == [0.0, 0.5, 0.875, 1.156, 1.367] and round(alg.euler_ode(lambda t, x: 2 - x, 0.0, 0.25, 4)[-1], 4) == 1.3672"
      - "round(alg.euler_ode(lambda t, x: 2 - x, 0.0, 0.25, 4)[-1] - 2 * (1 - math.exp(-1)), 2) == 0.10 and round(1.5 - 2 * (1 - math.exp(-1)), 2) == 0.24"
    steps:
      - show: |
          <p>Động cơ tăng tốc về tốc độ 2: $x' = 2 - x$, $x(0) = 0$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chạy Euler với $h = 0{,}5$, hai bước. Được $x$ tại $t = 1$ bằng bao nhiêu?</td></tr>
          <tr><td>2</td><td>Nghiệm đúng tại $t = 1$ là $2(1 - e^{-1}) \approx 1{,}2642$. Nếu dùng $h = 0{,}25$, sai số chừng bao nhiêu?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Một động cơ tăng tốc về tốc độ 2, theo quy tắc x phẩy bằng 2 trừ x, bắt đầu từ 0. Câu một, chạy Euler với h bằng 0 phẩy 5, hai bước, x tại t bằng 1 là bao nhiêu? Câu hai, nghiệm đúng tại t bằng 1 xấp xỉ 1 phẩy 2642, nếu dùng h bằng 0 phẩy 25 thì sai số chừng bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước 1: độ dốc $2 - 0 = 2$, $x_1 = 0 + 0{,}5 \cdot 2 = 1$.</p>
          <p>Bước 2: độ dốc $2 - 1 = 1$, $x_2 = 1 + 0{,}5 \cdot 1 = \hl{1{,}5}$. Sai số $1{,}5 - 1{,}2642 \approx 0{,}24$.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, bước đầu độ dốc là 2 trừ 0, bằng 2, nên x 1 bằng 0 cộng 0 phẩy 5 nhân 2, bằng 1. Bước hai, độ dốc là 2 trừ 1, bằng 1, nên x 2 bằng 1 cộng 0 phẩy 5 nhân 1, bằng 1 phẩy 5. So với nghiệm đúng 1 phẩy 2642, sai số khoảng 0 phẩy 24."
      - show: |
          <p>② Euler bậc 1: giảm $h$ một nửa thì sai số chừng một nửa, khoảng $0{,}12$.</p>
          <table class="t"><tr><th>chạy thật $h = 0{,}25$</th><th>$x_1$</th><th>$x_2$</th><th>$x_3$</th><th>$x_4$</th></tr>
          <tr><td>mỗi bước $x + 0{,}25 \cdot (2 - x)$</td><td>0,5</td><td>0,875</td><td>1,156</td><td>1,3672</td></tr></table>
          <p class="note">Sai số thật $1{,}3672 - 1{,}2642 \approx 0{,}10$ — cùng cỡ với ước lượng $0{,}12$. Ở đây Euler đi quá <b>lên</b>: độ dốc đầu bước lớn hơn độ dốc trung bình khi $x$ đang tăng chậm dần.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Câu hai, Euler là phương pháp bậc 1, nên giảm h một nửa thì sai số cũng chừng một nửa, khoảng 0 phẩy 12. Đó là cách ước lượng nhanh trong đầu. Chạy thật bốn bước với h bằng 0 phẩy 25, ta được 0 phẩy 5, 0 phẩy 875, 1 phẩy 156, rồi 1 phẩy 3672. Sai số thật khoảng 0 phẩy 10, cùng cỡ với ước lượng. Lần này Euler đi quá lên, vì khi x tăng chậm dần, độ dốc ở đầu bước lớn hơn độ dốc trung bình."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quy tắc $x' = f(x)$ + điều kiện đầu</span><span class="a">→</span>
          <span class="n">$x_{k+1} = x_k + h f(x_k)$</span><span class="a">→</span>
          <span class="n">sai số tỉ lệ với $h$</span><span class="a">→</span>
          <span class="n">$h$ quá lớn: dao động, phân kỳ</span></div>
        say: "Tổng kết lại, một phương trình vi phân là quy tắc thay đổi, cộng với điều kiện đầu. Phương pháp Euler đi từng bước theo độ dốc hiện tại. Sai số tỉ lệ với h, và nếu h quá lớn thì lời giải dao động và phân kỳ."
      - show: |
          <div class="box key"><b>Tư duy:</b> mô phỏng là xấp xỉ. Luôn chạy lại với bước nhỏ hơn: nếu kết quả đổi đáng kể, bước cũ chưa đủ nhỏ.</div>
        say: "Điều cần mang theo, mô phỏng luôn là xấp xỉ. Hãy chạy lại với bước nhỏ hơn, nếu kết quả đổi đáng kể thì bước cũ chưa đủ nhỏ."
      - clear: true
        show: |
