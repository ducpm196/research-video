id: L07
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 7 — Phương trình vi phân và phương pháp Euler"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L07; audit/rbm/verify_rbm.py L07; L. Euler (1768); R. L. Burden, J. D. Faires, Numerical Analysis (2011), mục 5.2"
assumes: [arith, cdot, sub, prime, exp, inverse, frac, approx, power, implies, dots]
# Quy ước: t là thời gian, x(t) là trạng thái, x' = dx/dt (dấu phẩy trên, CS115 bài 6); bước thời gian h (KHÔNG viết Δt —
#   \Delta trong sổ chung là định thức); x_k ≈ x(k·h). Nghiệm đúng của x' = −x, x(0) = 1 là e^{-t} (CS115 bài 12).
#   Mọi số do alg.euler_ode tính; sai số đối chiếu math.exp.
objectives:
  - "Đọc phương trình vi phân x′ = f(x) như quy tắc “tốc độ thay đổi phụ thuộc trạng thái hiện tại”"
  - "Giải gần đúng bằng phương pháp Euler"
  - "Ước lượng sai số: giảm h một nửa thì sai số giảm khoảng một nửa"
asr_reviewed:
  - {sentence: "Ở bài sau, bài 8, ta học phương pháp RK4, một phương pháp bậc 4 dùng bốn độ dốc trong mỗi bước, chính xác hơn Euler rất nhiều với cùng một bước.", reason: "Euler đọc “Ơ-le” (probe p1_ten 8/8); ASR chép “ơ le/ở Lê/ở lè”, cùng âm hoặc lệch thanh"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Biết tốc độ thay đổi, tìm cả quỹ đạo"
    steps:
      - show: |
          <p>Một bánh xe tự do quay chậm dần do ma sát: quay càng nhanh thì chậm đi càng nhanh. Ta biết <b>quy tắc thay đổi</b>, chưa biết tốc độ ở từng thời điểm.</p>
          <div class="box key">Hôm nay: <b>phương trình vi phân</b> — viết quy tắc đó thành toán — và <b>phương pháp Euler</b> để máy tính lần ra lời giải từng bước nhỏ.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một bánh xe quay tự do sẽ chậm dần vì ma sát, và nó quay càng nhanh thì chậm đi càng nhanh. Ta biết quy tắc thay đổi, nhưng chưa biết tốc độ ở từng thời điểm. Hôm nay ta học phương trình vi phân, cách viết quy tắc đó thành toán, và phương pháp Euler, để máy tính lần ra lời giải bằng từng bước nhỏ."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tốc độ thay đổi, lũy thừa và số e"
    checks:
      - "(5 - 3) / 0.5 == 4 and 3 + 0.5 * 4 == 5"
      - "round(0.9 ** 2, 9) == 0.81 and round(0.9 ** 3, 9) == 0.729"
      - "round(math.e, 3) == 2.718 and round(1 / 2.718, 4) == 0.3679 and round(math.exp(-1), 4) == 0.3679"
    steps:
      - show: |
          <p>Một xe ở vị trí 3 m lúc $t = 0$ và 5 m lúc $t = 0{,}5$ giây.</p>
          <table class="t"><tr><th>hỏi</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>tốc độ thay đổi (độ dốc)</td><td>$\frac{5 - 3}{0{,}5}$</td><td>4 m mỗi giây</td></tr>
          <tr><td>ngược lại: biết vị trí 3 và tốc độ 4, sau 0,5 giây ở đâu?</td><td>$3 + 0{,}5 \cdot 4$</td><td>5 m</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3"]
        say: "Trước khi vào bài, ta ôn hai điều sẽ dùng. Một xe ở vị trí 3 mét lúc bắt đầu và 5 mét sau 0 phẩy 5 giây. Vì thế tốc độ thay đổi của vị trí, còn gọi là độ dốc, bằng 5 trừ 3 chia 0 phẩy 5, tức 4 mét mỗi giây. Đi ngược lại, nếu biết xe đang ở 3 mét và đang chạy 4 mét mỗi giây, thì sau 0 phẩy 5 giây nó ở khoảng 3 cộng 0 phẩy 5 nhân 4, bằng 5 mét. Phép đoán vị trí mới bằng vị trí cũ cộng thời gian nhân tốc độ chính là toàn bộ ý tưởng của phương pháp hôm nay."
      - show: |
          <p>Lũy thừa là nhân lặp lại; số $e \approx 2{,}718$ (khoá Toán cho khoa học máy tính) và $e^{-1}$ nghĩa là $\frac{1}{e}$.</p>
          <table class="t"><tr><th>biểu thức</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>$0{,}9^2$</td><td>$0{,}9 \cdot 0{,}9$</td><td>0,81</td></tr>
          <tr><td>$0{,}9^3$</td><td>$0{,}81 \cdot 0{,}9$</td><td>0,729</td></tr>
          <tr><td>$e^{-1}$</td><td>$\frac{1}{2{,}718}$</td><td>$\approx 0{,}3679$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Điều thứ hai, lũy thừa là nhân lặp lại, và số e xấp xỉ 2 phẩy 718, đã gặp ở khoá Toán cho khoa học máy tính. Ví dụ 0 phẩy 9 bình phương là 0 phẩy 9 nhân 0 phẩy 9, bằng 0 phẩy 81. Nhân thêm một lần 0 phẩy 9 nữa, được 0 phẩy 9 mũ 3, bằng 0 phẩy 729. Còn e mũ âm 1 nghĩa là 1 chia e, tức 1 chia 2 phẩy 718, xấp xỉ 0 phẩy 3679."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: x′ = f(x)"
    checks:
      - "all(abs((math.exp(-(t + 1e-7)) - math.exp(-t)) / 1e-7 + math.exp(-t)) < 1e-6 for t in (0, 0.5, 1, 2))"
    steps:
      - show: |
          <p>$x(t)$: trạng thái ở thời điểm $t$ (tốc độ bánh xe). $x'$: tốc độ thay đổi của $x$ theo thời gian.</p>
          <p>Phương trình vi phân: $x' = f(x)$ — quy tắc cho biết $x$ đổi nhanh thế nào khi đang ở giá trị $x$.</p>
          <p>Bánh xe: $x' = -x$. Quay nhanh gấp đôi thì chậm đi nhanh gấp đôi. Kèm <b>điều kiện đầu</b> $x(0) = 1$.</p>
          <div class="box">Nghiệm đúng: $x(t) = e^{-t}$, vì đạo hàm của $e^{-t}$ là $-e^{-t}$, đúng bằng $-x$. Tại $t = 1$: $e^{-1} \approx 0{,}3679$.</div>
        focus: [1, 2, 3, 3, 4, 4]
        say: "Ta gọi x của t là trạng thái ở thời điểm t, ở đây là tốc độ bánh xe, còn x phẩy là tốc độ thay đổi của x theo thời gian. Một phương trình vi phân như x phẩy bằng f của x là quy tắc cho biết x đổi nhanh thế nào khi đang ở giá trị x. Với bánh xe, x phẩy bằng âm x, tức quay nhanh gấp đôi thì chậm đi nhanh gấp đôi. Kèm theo là điều kiện đầu, x tại 0 bằng 1. Bài này có nghiệm đúng là e mũ âm t, vì đạo hàm của e mũ âm t bằng âm e mũ âm t, đúng bằng âm x. Tại t bằng 1, nghiệm đúng xấp xỉ 0 phẩy 3679."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Phương pháp Euler: đi theo tiếp tuyến"
    steps:
      - show: |
          <p>Theo định nghĩa đạo hàm, với bước nhỏ $h$: $x(t + h) \approx x(t) + h \cdot x'(t)$.</p>
          <p>Thay $x' = f(x)$ và viết $x_k \approx x(k h)$:</p>
          <p>$x_{k+1} = x_k + h \cdot f(x_k)$</p>
          <div class="box key">Mỗi bước: đứng ở $x_k$, đọc độ dốc $f(x_k)$, đi thẳng theo độ dốc đó trong thời gian $h$.</div>
        focus: [1, 2, 3, 4]
        say: "Theo định nghĩa đạo hàm, với một bước nhỏ h, x tại t cộng h xấp xỉ x tại t cộng h nhân x phẩy tại t. Thay x phẩy bằng f của x, và gọi x k là giá trị gần đúng ở thời điểm k nhân h. Ta được công thức Euler, x k cộng 1 bằng x k cộng h nhân f của x k. Nghĩa là ở mỗi bước, ta đứng ở x k, đọc độ dốc, rồi đi thẳng theo độ dốc đó trong khoảng thời gian h."

  - id: intuition
    kind: intuition
    title: "Hình dung: đi theo tiếp tuyến, từng bước một"
    checks:
      - "[round(v, 4) for v in alg.euler_ode(lambda t, x: -x, 1.0, 0.5, 2)] == [1.0, 0.5, 0.25]"
      - "round(math.exp(-0.5), 4) == 0.6065 and round(math.exp(-0.5) - 0.5, 2) == 0.11 and round(math.exp(-1), 4) == 0.3679"
    steps:
      - show: |
          <div><svg width="1280" height="430" viewBox="0 0 1280 430"><defs><marker id="ek" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><line x1="110.0" y1="390.0" x2="770.8" y2="390.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ek)"/><line x1="110.0" y1="390.0" x2="110.0" y2="31.6" stroke="#6b7280" stroke-width="2" marker-end="url(#ek)"/><polyline points="110.0,70.0 115.6,73.2 121.2,76.3 126.8,79.5 132.4,82.5 138.0,85.6 143.6,88.6 149.2,91.6 154.8,94.6 160.4,97.5 166.0,100.5 171.6,103.3 177.2,106.2 182.8,109.0 188.4,111.8 194.0,114.6 199.6,117.3 205.2,120.0 210.8,122.7 216.4,125.4 222.0,128.0 227.6,130.6 233.2,133.2 238.8,135.7 244.4,138.3 250.0,140.8 255.6,143.3 261.2,145.7 266.8,148.1 272.4,150.6 278.0,152.9 283.6,155.3 289.2,157.6 294.8,159.9 300.4,162.2 306.0,164.5 311.6,166.7 317.2,169.0 322.8,171.2 328.4,173.3 334.0,175.5 339.6,177.6 345.2,179.7 350.8,181.8 356.4,183.9 362.0,186.0 367.6,188.0 373.2,190.0 378.8,192.0 384.4,194.0 390.0,195.9 395.6,197.8 401.2,199.8 406.8,201.6 412.4,203.5 418.0,205.4 423.6,207.2 429.2,209.0 434.8,210.8 440.4,212.6 446.0,214.4 451.6,216.1 457.2,217.9 462.8,219.6 468.4,221.3 474.0,222.9 479.6,224.6 485.2,226.3 490.8,227.9 496.4,229.5 502.0,231.1 507.6,232.7 513.2,234.2 518.8,235.8 524.4,237.3 530.0,238.8 535.6,240.3 541.2,241.8 546.8,243.3 552.4,244.8 558.0,246.2 563.6,247.6 569.2,249.1 574.8,250.5 580.4,251.9 586.0,253.2 591.6,254.6 597.2,255.9 602.8,257.3 608.4,258.6 614.0,259.9 619.6,261.2 625.2,262.5 630.8,263.7 636.4,265.0 642.0,266.2 647.6,267.5 653.2,268.7 658.8,269.9 664.4,271.1 670.0,272.3 675.6,273.4 681.2,274.6 686.8,275.8 692.4,276.9 698.0,278.0 703.6,279.1 709.2,280.2 714.8,281.3 720.4,282.4 726.0,283.5" fill="none" stroke="#9ca3af" stroke-width="4"/><line x1="110.0" y1="70.0" x2="390.0" y2="230.0" stroke="#2a78d6" stroke-width="5" marker-end="url(#eb)"/><line x1="390.0" y1="230.0" x2="670.0" y2="310.0" stroke="#2a78d6" stroke-width="5" marker-end="url(#eb)"/><circle cx="110.0" cy="70.0" r="8" fill="#2a78d6"/><circle cx="390.0" cy="230.0" r="8" fill="#2a78d6"/><circle cx="670.0" cy="310.0" r="8" fill="#2a78d6"/><circle cx="390.0" cy="195.9" r="8" fill="#6b7280"/><line x1="404.0" y1="195.9" x2="404.0" y2="230.0" stroke="#b91c1c" stroke-width="3"/><circle cx="670.0" cy="272.3" r="8" fill="#6b7280"/><line x1="684.0" y1="272.3" x2="684.0" y2="310.0" stroke="#b91c1c" stroke-width="3"/><text x="390" y="420" font-size="22" text-anchor="middle" fill="#6b7280">0,5</text><text x="670" y="420" font-size="22" text-anchor="middle" fill="#6b7280">1</text><text x="760" y="378" font-size="22" text-anchor="middle" fill="#6b7280">t</text><text x="96" y="78" font-size="22" text-anchor="end" fill="#6b7280">1</text><text x="124" y="44" font-size="22" text-anchor="start" fill="#6b7280">x</text><text x="420" y="182" font-size="22" text-anchor="start" fill="#4b5563">đúng: 0,6065</text><text x="374" y="268" font-size="22" text-anchor="end" fill="#2a78d6" font-weight="bold">Euler: 0,5 (lệch 0,11)</text><text x="696" y="260" font-size="22" text-anchor="start" fill="#4b5563">đúng: 0,3679</text><text x="696" y="340" font-size="22" text-anchor="start" fill="#2a78d6" font-weight="bold">Euler: 0,25</text><text x="223" y="128" font-size="22" text-anchor="start" fill="#2a78d6">độ dốc −1</text><text x="492" y="302" font-size="22" text-anchor="middle" fill="#2a78d6">độ dốc −0,5</text><text x="900" y="70" font-size="23" text-anchor="start" fill="#1f2937" font-weight="bold">x phẩy = −x, bước h = 0,5</text><text x="900" y="130" font-size="23" text-anchor="start" fill="#1f2937">1. Đứng ở điểm xanh hiện tại.</text><text x="900" y="174" font-size="23" text-anchor="start" fill="#1f2937">2. Đọc độ dốc tại đó: −x.</text><text x="900" y="218" font-size="23" text-anchor="start" fill="#1f2937">3. Đi thẳng theo độ dốc ấy</text><text x="900" y="262" font-size="23" text-anchor="start" fill="#1f2937">    trong thời gian h.</text><text x="900" y="322" font-size="23" text-anchor="start" fill="#4b5563">Đường xám: nghiệm đúng.</text><text x="900" y="366" font-size="23" text-anchor="start" fill="#b91c1c">Vạch đỏ: phần lệch, cộng dồn</text><text x="900" y="410" font-size="23" text-anchor="start" fill="#b91c1c">qua từng bước.</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này phóng to cơ chế của Euler với một bước lớn h bằng 0 phẩy 5 cho dễ thấy. Bắt đầu ở x bằng 1, độ dốc tại đó là âm 1, nên ta đi thẳng theo đường dốc ấy trong 0 phẩy 5 giây, tới 0 phẩy 5. Nghiệm đúng tại 0 phẩy 5 là 0 phẩy 6065, nên một bước đã lệch khoảng 0 phẩy 11, vạch đỏ thứ nhất. Từ điểm mới, độ dốc chỉ còn âm 0 phẩy 5, ta đi tiếp và tới 0 phẩy 25, trong khi nghiệm đúng là 0 phẩy 3679. Mỗi bước dùng độ dốc ở đầu bước, nên các phần lệch cứ thế cộng dồn."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "x′ = −x, x(0) = 1, h = 0,1"
    checks:
      - "[round(v, 4) for v in alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 3)] == [1.0, 0.9, 0.81, 0.729]"
      - "all(abs(v - 0.9 ** k) < 1e-12 for k, v in enumerate(alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 10)))"
      - "round(alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 10)[-1], 4) == 0.3487 and round(math.exp(-1), 4) == 0.3679"
      - "round(math.exp(-1) - alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 10)[-1], 4) == 0.0192"
      - "round(0.9 - 0.09, 9) == 0.81 and round(0.81 - 0.081, 9) == 0.729"
    steps:
      - show: |
          <p><b>Bước 1 —</b> độ dốc tại $x_0 = 1$ là $-1$:</p>
          $$x_1 = 1 + 0{,}1 \cdot (-1) = 0{,}9$$
        focus: [1, 2]
        say: "Làm thử với h bằng 0 phẩy 1, bắt đầu từ x 0 bằng 1. Bước một, độ dốc tại đó là âm 1, nên x 1 bằng 1 cộng 0 phẩy 1 nhân âm 1, bằng 0 phẩy 9."
      - show: |
          <p><b>Bước 2 —</b> độ dốc mới là $-0{,}9$: $x_2 = 0{,}9 + 0{,}1 \cdot (-0{,}9) = 0{,}9 - 0{,}09 = 0{,}81$.</p>
        say: "Bước hai, đứng ở 0 phẩy 9 thì độ dốc là âm 0 phẩy 9, nên x 2 bằng 0 phẩy 9 trừ 0 phẩy 09, bằng 0 phẩy 81."
      - show: |
          <p><b>Bước 3 —</b> $x_3 = 0{,}81 - 0{,}081 = 0{,}729$. Mỗi bước là $x_k + h \cdot (-x_k) = (1 - h)\,x_k$: <b>nhân với 0,9</b>.</p>
        say: "Bước ba, x 3 bằng 0 phẩy 81 trừ 0 phẩy 081, bằng 0 phẩy 729. Ta thấy mỗi bước đều lấy x k trừ đi h lần x k, tức nhân x k với 1 trừ h, bằng 0 phẩy 9."
      - show: |
          <p><b>Bước 4 —</b> sau 10 bước (tới $t = 1$): $x = 0{,}9^{10} \approx \hl{0{,}3487}$. So với nghiệm đúng $0{,}3679$: sai số $\approx 0{,}0192$.</p>
        say: "Bước bốn, vì mỗi bước nhân với 0 phẩy 9, nên sau 10 bước, tới t bằng 1, ta được 0 phẩy 9 mũ 10, xấp xỉ 0 phẩy 3487. So với nghiệm đúng 0 phẩy 3679, sai số khoảng 0 phẩy 0192."
      - clear: true
        show: |
