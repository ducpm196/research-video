 205.6,334.2 204.8,331.1 203.9,328.0 202.8,325.0 201.6,322.1 200.1,319.2" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/><text x="224.8" y="333.6" font-size="21" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">θ₁ = 30°</text><line x1="289.8" y1="265.2" x2="352.4" y2="229.0" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/><polyline points="330.7,239.6 328.8,236.9 326.7,234.2 324.5,231.7 322.0,229.4 319.5,227.2 316.7,225.2 313.9,223.4 310.9,221.8 307.8,220.5 304.7,219.3 301.4,218.4 298.1,217.7 294.8,217.2 291.4,217.0" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/><text x="347.8" y="261.2" font-size="21" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">θ₂ = 60°</text><text x="303.8" y="98.3" font-size="22" fill="#1f2937" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">(0,866; 1,5)</text><text x="303.8" y="289.2" font-size="20" fill="#6b7280" text-anchor="start" stroke="#fffbeb" stroke-width="6" paint-order="stroke">khuỷu</text><text x="215.6" y="291.4" font-size="20" fill="#6b7280" text-anchor="end" stroke="#fffbeb" stroke-width="6" paint-order="stroke">L₁ = 1</text><text x="275.8" y="184.8" font-size="20" fill="#6b7280" text-anchor="end" stroke="#fffbeb" stroke-width="6" paint-order="stroke">L₂ = 1</text></svg></div>
          <p><b>Bước 1 —</b> khuỷu: $(\cos 30^\circ, \sin 30^\circ) = (0{,}866;\ 0{,}5)$.</p>
        focus: [1, 2]
        say: "Thử với hai khâu dài 1, theta 1 bằng 30 độ và theta 2 bằng 60 độ. Bước một, khuỷu ở cos 30 độ, sin 30 độ, tức 0 phẩy 866 và 0 phẩy 5, vì khâu 1 dài 1."
      - show: |
          <p><b>Bước 2 —</b> hướng khâu 2: $\theta_1 + \theta_2 = 30^\circ + 60^\circ = 90^\circ$.</p>
        say: "Bước hai, khâu 2 hợp với trục x góc theta 1 cộng theta 2, tức 30 cộng 60, bằng 90 độ, nghĩa là khâu 2 dựng thẳng đứng."
      - clear: true
        show: |
          <p class="note">Khuỷu $(0{,}866;\ 0{,}5)$; khâu 2 hướng $90^\circ$.</p>
          <p><b>Bước 3 —</b> đoạn khâu 2: $(1 \cdot \cos 90^\circ,\ 1 \cdot \sin 90^\circ) = (0;\ 1)$ — đi thẳng lên 1.</p>
        say: "Bước ba, đoạn khâu 2 dài 1 theo hướng 90 độ là cos 90 độ, sin 90 độ, tức 0 và 1, đi thẳng lên một đơn vị."
      - show: |
          <p><b>Bước 4 —</b> đầu tay = khuỷu + đoạn khâu 2: $(0{,}866 + 0;\ 0{,}5 + 1) = \hl{(0{,}866;\ 1{,}5)}$.</p>
        say: "Bước bốn, đầu tay là khuỷu cộng đoạn khâu 2, cộng từng toạ độ được 0 phẩy 866 và 1 phẩy 5."

  - id: check
    kind: check
    title: "Tự kiểm: chạy chuỗi ma trận của bài 3"
    checks:
      - "np.allclose(alg.homog2(0, 1, 0) @ [0, 0, 1], [1, 0, 1]) and np.allclose(alg.homog2(60, 0, 0) @ [1, 0, 1], [0.5, 3 ** 0.5 / 2, 1])"
      - "np.allclose(alg.homog2(0, 1, 0) @ [0.5, 3 ** 0.5 / 2, 1], [1.5, 3 ** 0.5 / 2, 1])"
      - "np.allclose(alg.homog2(30, 0, 0) @ [1.5, 3 ** 0.5 / 2, 1], [3 ** 0.5 / 2, 1.5, 1])"
      - "round(0.866 * 1.5 - 0.5 * 0.866, 3) == 0.866 and round(0.5 * 1.5 + 0.866 * 0.866, 2) == 1.5"
    steps:
      - show: |
          <p>Đường khác: áp $\mathbf{R}(30^\circ)\,\mathbf{D}(1)\,\mathbf{R}(60^\circ)\,\mathbf{D}(1)$ lên gốc $(0, 0, 1)^T$, <b>từ phải sang trái</b>.</p>
          <table class="t"><tr><th>làm</th><th>điểm sau bước đó</th></tr>
          <tr><td>$\mathbf{D}(1)$: dời 1 dọc trục $x$</td><td>$(1;\ 0)$</td></tr>
          <tr><td>$\mathbf{R}(60^\circ)$: quay quanh gốc</td><td>$(0{,}5;\ 0{,}866)$</td></tr>
          <tr><td>$\mathbf{D}(1)$: dời 1</td><td>$(1{,}5;\ 0{,}866)$</td></tr>
          <tr><td>$\mathbf{R}(30^\circ)$: quay quanh gốc</td><td>$(0{,}866 \cdot 1{,}5 - 0{,}5 \cdot 0{,}866;\ 0{,}5 \cdot 1{,}5 + 0{,}866 \cdot 0{,}866) \approx \hl{(0{,}866;\ 1{,}5)}$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.5"]
        say: "Để tự kiểm, ta đi đường khác, dùng chuỗi ma trận thuần nhất ở bài 3 và áp nó lên gốc từ phải sang trái. Dời 1 dọc trục x, gốc tới 1, 0. Quay 60 độ quanh gốc, điểm tới 0 phẩy 5 và 0 phẩy 866. Dời thêm 1, ta được 1 phẩy 5 và 0 phẩy 866. Cuối cùng quay 30 độ, theo cách nhân hàng của bài 0, ra xấp xỉ 0 phẩy 866 và 1 phẩy 5. Kết quả khớp với cách cộng hai đoạn, nên phép tính đúng."

  # ───────────────────────── 5. KHOẢNG CÁCH ─────────────────────────
  - id: reach
    kind: concept
    title: "Đầu tay cách gốc bao xa?"
    checks:
      - "all(abs(math.hypot(*alg.fk2(2, 1, a, b)[1]) - math.sqrt(4 + 1 + 4 * math.cos(math.radians(b)))) < 1e-9 for a in range(0, 360, 20) for b in range(-180, 180, 20))"
      - "abs(math.hypot(*alg.fk2(1, 1, 30, 60)[1]) - 3 ** 0.5) < 1e-12 and abs(0.75 + 2.25 - 3) < 1e-12"
      - "all(abs(math.cos(math.radians(180 - t)) + math.cos(math.radians(t))) < 1e-12 for t in range(-180, 181, 15)) and abs(1 + 1 - 2 * math.cos(math.radians(120)) - 3) < 1e-12"
    steps:
      - show: |
          <p>Tam giác gốc – khuỷu – đầu tay có hai cạnh $L_1$, $L_2$, góc giữa chúng là $180^\circ - \theta_2$.</p>
          <p class="note"><b>Định lý cos</b>: hai cạnh $a$, $b$ kẹp góc $C$ thì cạnh thứ ba $c$ có $c^2 = a^2 + b^2 - 2ab\cos C$ (góc vuông: $\cos C = 0$, ra Pythagoras). Ở đây $\cos(180^\circ - \theta_2) = -\cos\theta_2$, nên:</p>
          <p>$$r^2 = L_1^2 + L_2^2 + 2L_1L_2\cos\theta_2$$</p>
          <p>Thử: $\theta_2 = 60^\circ$: $r^2 = 1 + 1 + 1 = 3$, $r = \sqrt{3} \approx 1{,}732$; khớp với $0{,}866^2 + 1{,}5^2 = 0{,}75 + 2{,}25 = 3$.</p>
          <div class="box key">$r$ chỉ phụ thuộc $\theta_2$: $\theta_1$ chỉ xoay cả tay quanh gốc. Lớn nhất $L_1 + L_2$ khi $\theta_2 = 0^\circ$, nhỏ nhất $\lvert L_1 - L_2 \rvert$ khi $\theta_2 = 180^\circ$.</div>
        introduces: [absval]
        focus: [1, 1, 2, 2, 2, 3, 4, 5, 5]
        say: "Đầu tay cách gốc bao xa? Tam giác gốc, khuỷu, đầu tay có hai cạnh L 1 và L 2, và góc giữa chúng là 180 độ trừ theta 2. Định lý cos nói rằng tam giác có hai cạnh a và b kẹp góc C thì cạnh thứ ba bình phương bằng a bình phương cộng b bình phương trừ 2 a b cos C. Khi góc C vuông, cos C bằng 0, ta được đúng định lý về cạnh huyền của tam giác vuông. Ở đây cos của 180 độ trừ theta 2 bằng âm cos theta 2, vì mũi tên lật sang phía bên kia thì bóng trên trục ngang đổi dấu. Theo định lý cos, r bình phương bằng L 1 bình phương cộng L 2 bình phương cộng 2 L 1 L 2 cos theta 2. Làm thử ngay, với theta 2 bằng 60 độ, r bình phương bằng 3, khớp với 0 phẩy 75 cộng 2 phẩy 25 từ toạ độ vừa tính. Khoảng cách chỉ phụ thuộc theta 2, còn theta 1 chỉ xoay cả tay quanh gốc. R lớn nhất bằng L 1 cộng L 2 khi tay duỗi thẳng, nhỏ nhất bằng trị tuyệt đối của L 1 trừ L 2 khi tay gập hẳn."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "not np.allclose(alg.fk2(1, 1, 30, 60)[1], (math.cos(math.radians(30)) + math.cos(math.radians(60)), math.sin(math.radians(30)) + math.sin(math.radians(60))))"
      - "[round(v, 3) for v in (math.cos(math.radians(30)) + math.cos(math.radians(60)), math.sin(math.radians(30)) + math.sin(math.radians(60)))] == [1.366, 1.366]"
      - "not np.allclose(alg.homog2(30, 0, 0) @ alg.homog2(0, 1, 0) @ [0, 0, 1], alg.homog2(0, 1, 0) @ alg.homog2(30, 0, 0) @ [0, 0, 1])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi $\theta_2$ là góc so với trục $x$ <b class="red">(sai)</b>
          <br><span class="note">Dùng $\cos\theta_2$ thay cho $\cos(\theta_1 + \theta_2)$ cho đầu tay ở $(1{,}366;\ 1{,}366)$, sai so với $(0{,}866;\ 1{,}5)$.</span></div>
          <table class="t"><tr><th>khâu 2 dùng góc</th><th>đầu tay</th></tr>
          <tr><td>$\theta_1 + \theta_2 = 90^\circ$ (đúng)</td><td>$(0{,}866 + 0;\ 0{,}5 + 1) = (0{,}866;\ 1{,}5)$</td></tr>
          <tr><td>$\theta_2 = 60^\circ$ (sai)</td><td>$(0{,}866 + 0{,}5;\ 0{,}5 + 0{,}866) = (1{,}366;\ 1{,}366)$</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, coi theta 2 là góc so với trục x. Dùng cos theta 2 thay cho cos của theta 1 cộng theta 2 sẽ cho đầu tay ở 1 phẩy 366, 1 phẩy 366, sai so với 0 phẩy 866, 1 phẩy 5."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đổi thứ tự quay và dời trong chuỗi <b class="red">(sai)</b>
          <br><span class="note">Quay $\theta_1$ rồi mới dời $L_1$ thì khâu 1 nằm ngang, đầu khâu không quay theo.</span></div>
        say: "Lỗi thứ hai, đổi thứ tự quay và dời trong chuỗi ma trận. Nếu quay theta 1 trước rồi mới dời L 1, khâu 1 vẫn nằm ngang, đầu khâu không quay theo."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đưa độ vào hàm cần radian <b class="red">(sai)</b>
          <br><span class="note">Hầu hết thư viện lập trình tính $\cos$, $\sin$ theo radian: đổi $30^\circ$ thành $30 \cdot \pi / 180$ trước.</span></div>
        say: "Lỗi thứ ba, đưa số đo độ vào hàm cần radian. Hầu hết thư viện lập trình tính cos và sin theo radian, nên phải đổi 30 độ thành 30 nhân pi chia 180 trước."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ $\theta_1$ làm đổi khoảng cách tới gốc <b class="red">(sai)</b>
          <br><span class="note">Muốn với xa hay gần là việc của $\theta_2$; $\theta_1$ chỉ chọn hướng.</span></div>
        say: "Lỗi thứ tư, nghĩ theta 1 làm đổi khoảng cách từ gốc tới đầu tay. Với xa hay gần là việc của theta 2, còn theta 1 chỉ chọn hướng."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "np.allclose(alg.fk2(1, 1, 90, -90)[1], (1, 1)) and np.allclose(alg.fk2(1, 1, 90, -90)[0], (0, 1))"
      - "all(abs(math.hypot(*alg.fk2(2, 1, a, 180)[1]) - 1) < 1e-9 for a in range(0, 360, 30))"
      - "round(2 ** 2 + 1 ** 2 + 2 * 2 * 1 * math.cos(math.radians(180)), 9) == 1 and 4 + 1 - 4 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$L_1 = L_2 = 1$, $\theta_1 = 90^\circ$, $\theta_2 = -90^\circ$: khuỷu và đầu tay ở đâu?</td></tr>
          <tr><td>2</td><td>$L_1 = 2$, $L_2 = 1$, $\theta_2 = 180^\circ$: đầu tay cách gốc bao xa, với mọi $\theta_1$?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai khâu dài 1, theta 1 bằng 90 độ và theta 2 bằng âm 90 độ, khuỷu và đầu tay ở đâu? Câu hai, khâu 1 dài 2, khâu 2 dài 1, theta 2 bằng 180 độ, đầu tay cách gốc bao xa, với mọi theta 1? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Khuỷu: $(\cos 90^\circ, \sin 90^\circ) = (0, 1)$. Khâu 2 hợp trục $x$ góc $90^\circ - 90^\circ = 0^\circ$, đoạn khâu 2 là $(1, 0)$: đầu tay $(0 + 1;\ 1 + 0) = \hl{(1, 1)}$.</p>
        say: "Đáp án câu một, khuỷu ở cos 90 độ, sin 90 độ, tức 0, 1. Khâu 2 hợp với trục x góc 90 trừ 90, bằng 0 độ, nên đoạn khâu 2 là 1, 0. Cộng lại, đầu tay ở 1, 1."
      - show: |
          <p>② Theo định lý cos: $r^2 = 2^2 + 1^2 + 2 \cdot 2 \cdot 1 \cdot \cos 180^\circ = 4 + 1 - 4 = 1$, nên $r = \hl{1} = \lvert L_1 - L_2 \rvert$, với mọi $\theta_1$.</p>
        say: "Câu hai, thay vào định lý cos, r bình phương bằng 4 cộng 1 cộng 4 nhân cos 180 độ, mà cos 180 độ bằng âm 1, nên r bình phương bằng 1. Vậy khoảng cách bằng 1, đúng bằng 2 trừ 1 vì tay gập hẳn, dù theta 1 là bao nhiêu."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">góc khớp $\theta_1$, $\theta_2$</span><span class="a">→</span>
          <span class="n">khâu 2 hướng $\theta_1 + \theta_2$</span><span class="a">→</span>
          <span class="n">cộng hai đoạn = đầu tay</span><span class="a">→</span>
          <span class="n">$r$ chỉ phụ thuộc $\theta_2$</span></div>
        say: "Tổng kết lại, từ hai góc khớp, khâu 2 có hướng theta 1 cộng theta 2. Cộng hai đoạn thẳng lại là ra đầu tay, và khoảng cách tới gốc chỉ phụ thuộc theta 2."
      - show: |
          <div class="box key"><b>Tư duy:</b> động học thuận luôn có đúng một đáp án, tính thẳng được. Chiều ngược lại mới khó.</div>
        say: "Điều cần mang theo, động học thuận luôn có đúng một đáp án, và tính thẳng được. Chiều ngược lại mới là chỗ khó."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>động học ngược</b> — cho trước vị trí đầu tay, tìm góc khớp; có khi hai nghiệm, có khi vô nghiệm.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học động học ngược, cho trước vị trí đầu tay rồi tìm góc khớp, khi thì có hai nghiệm, khi thì vô nghiệm. Hẹn gặp bạn ở bài tiếp theo."
