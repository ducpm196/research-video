id: L04
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 4 — Động học thuận của tay máy hai khâu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L04; audit/rbm/verify_rbm.py L04; J. J. Craig, Introduction to Robotics (2005), chương 3; K. M. Lynch, F. C. Park, Modern Robotics (2017), mục 4.1"
assumes: [arith, cdot, vec, mat, sub, frame2, transpose, cos, sin, theta, deg, sqrt, approx, power, implies]
# Quy ước: tay máy phẳng, khớp 1 ở gốc; L_1, L_2 là độ dài khâu; θ_1 đo từ trục x tới khâu 1; θ_2 là góc của khâu 2 ĐO TỪ
#   PHẦN KÉO DÀI của khâu 1 (góc tương đối) — khâu 2 hợp với trục x góc θ_1 + θ_2. Mọi số do alg.fk2 tính, đối chiếu chuỗi
#   ma trận thuần nhất của bài 3 (alg.homog2) và định lý cos.
objectives:
  - "Tính vị trí khuỷu và đầu tay từ hai góc khớp"
  - "Viết động học thuận như một chuỗi ma trận thuần nhất"
  - "Tính khoảng cách đầu tay tới gốc, chuẩn bị cho vùng với tới"
asr_reviewed:
  - {sentence: "Nếu quay theta 1 trước rồi mới dời L 1, khâu 1 vẫn nằm ngang, đầu khâu không quay theo.", reason: "ASR chép “Nếu quay Teta một trước trồi mới dời L1, khâu 1 vẫn nằm ngang, đầu khâu không quay theo.” (0.9): “theta” đọc theo luật lexicon (lexicon_vi.RBM.yaml: “tê-ta”), ASR viết “teta”; lệch âm/thanh thuần Việt: rồi/trồi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở đây cos của 180 độ trừ theta 2 bằng âm cos theta 2, vì mũi tên lật sang phía bên kia thì bóng trên trục ngang đổi dấu.", reason: "ASR chép “Ở đây cô xin của 180 độ trừ teta 2 bằng âm cô xin teta 2 vì mũi tên lật sang phía bên kia thì bóng trên trục ngang đổ dấu.” (0.886): tê-ta theo lexicon RBM/ROB, ASR viết “theta/teta”; lệch âm/thanh thuần Việt: đổi/đổ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đầu tay là hai khâu nối đuôi nhau, nên hoành độ của nó bằng tổng hai đoạn đậm dưới trục x, L 1 cos theta 1 cộng L 2 cos của theta 1 cộng theta 2.", reason: "ASR chép “Đầu tay là hai khâu nối đuôi nhau, nên hoành độ của nó bằng tổng hai đoạn đậm dưới trục x L1 cos Teta 1 cộng L2 cos Teta 1 cộng Teta2.” (0.901): “theta” đọc “tê-ta” theo lexicon_vi.RBM.yaml (probe p2 7/8), ASR viết “teta/TETA” — đúng âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, đoạn khâu 2 dài 1 theo hướng 90 độ là cos 90 độ, sin 90 độ, tức 0 và 1, đi thẳng lên một đơn vị.", reason: "ASR chép “Bước 3, đoạn khâu 2 dài 1 theo hướng 90 độ là cô sinh 90 độ, sinh 90 độ, tức 0 và 1, đi thẳng lên một đơn vị.” (0.938): sin đọc thô, ASR viết “sinh” (gần âm) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ ba, đưa số đo độ vào hàm cần radian.", reason: "radian đọc thô (lexicon RBM p1: thô 8/8); ASR chép “ra đi ăn / ra đi an”: cùng ba âm tiết"}
  - {sentence: "Theo định lý cos, r bình phương bằng L 1 bình phương cộng L 2 bình phương cộng 2 L 1 L 2 cos theta 2.", reason: "cos đọc “cô-sin” (lexicon RBM, probe p2: bản chép “cô xin / cosin / cosine” đúng âm), sin đọc thô (foreign_ok, “sinh” cùng âm); hàm hiện trên màn hình"}
  - {sentence: "Tam giác gốc, khuỷu, đầu tay có hai cạnh L 1 và L 2, và góc giữa chúng là 180 độ trừ theta 2.", reason: "theta đọc “tê-ta” (lexicon RBM p2 7/8); ASR chép “Teta / tê ta”: cùng âm"}
  - {sentence: "Cộng hai đoạn lại, ta được x bằng L 1 cos theta 1 cộng L 2 cos của theta 1 cộng theta 2.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Đầu tay thì từ khuỷu đi tiếp L 2 theo hướng theta 1 cộng theta 2.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Khuỷu tay nằm ở cuối khâu 1, tức đi L 1 theo hướng theta 1, nên toạ độ là L 1 cos theta 1 và L 1 sin theta 1.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Với xa hay gần là việc của theta 2, còn theta 1 chỉ chọn hướng.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Tổng kết lại, từ hai góc khớp, khâu 2 có hướng theta 1 cộng theta 2.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Thử với hai khâu dài 1, theta 1 bằng 30 độ và theta 2 bằng 60 độ.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Hầu hết thư viện lập trình tính cos và sin theo radian, nên phải đổi 30 độ thành 30 nhân pi chia 180 trước.", reason: "sin đọc thô “sin” (foreign_ok trong lexicon_vi.RBM.yaml); ASR chép “sinh” — cùng âm, chỉ khác âm cuối n/nh mà tiếng Việt không phân biệt ở âm tiết này; hàm sin hiện trên màn hình"}
  - {sentence: "Làm thử ngay, với theta 2 bằng 60 độ, r bình phương bằng 3, khớp với 0 phẩy 75 cộng 2 phẩy 25 từ toạ độ vừa tính.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Theta 2 là góc của khâu 2, đo từ phần kéo dài của khâu 1, tức là góc tương đối.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Động cơ biết góc, ta cần vị trí"
    steps:
      - show: |
          <p>Mỗi khớp của tay máy có một động cơ và một cảm biến góc. Cái ta quan tâm lại là <b>đầu tay</b>: kẹp đang ở đâu?</p>
          <div class="box key">Hôm nay: <b>động học thuận</b> — từ các góc khớp tính ra vị trí đầu tay, cho tay máy phẳng hai khâu.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, mỗi khớp của một tay máy có một động cơ và một cảm biến đo góc. Nhưng điều ta thật sự quan tâm là đầu tay, tức cái kẹp đang ở đâu. Hôm nay ta học động học thuận, tính vị trí đầu tay từ các góc khớp, cho tay máy phẳng có hai khâu."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đi một đoạn theo một hướng, rồi nối đuôi"
    checks:
      - "[round(math.cos(math.radians(a)), 3) for a in (0, 30, 60, 90)] == [1, 0.866, 0.5, 0] and [round(math.sin(math.radians(a)), 3) for a in (0, 30, 60, 90)] == [0, 0.5, 0.866, 1]"
      - "round(2 * math.cos(math.radians(30)), 3) == 1.732 and round(2 * math.sin(math.radians(30)), 3) == 1.0"
      - "np.allclose(np.round([2 * math.cos(math.radians(30)), 2 * math.sin(math.radians(30))], 3) + np.array([0, 1]), [1.732, 2])"
    steps:
      - show: |
          <table class="t"><tr><th>góc</th><th>$0^\circ$</th><th>$30^\circ$</th><th>$60^\circ$</th><th>$90^\circ$</th></tr>
          <tr><td>cos</td><td>1</td><td>0,866</td><td>0,5</td><td>0</td></tr>
          <tr><td>sin</td><td>0</td><td>0,5</td><td>0,866</td><td>1</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn lại bảng giá trị sẽ dùng, theo bài 0, cos và sin là bóng của mũi tên dài 1 trên hai trục. Cos của 0, 30, 60, 90 độ lần lượt là 1, 0 phẩy 866, 0 phẩy 5 và 0. Sin thì ngược lại, 0, 0 phẩy 5, 0 phẩy 866 và 1."
      - show: |
          <p>Đi một đoạn dài $L$ theo hướng góc $\theta$: tới $(L\cos\theta,\ L\sin\theta)$. Nối đuôi hai đoạn: cộng toạ độ.</p>
          <table class="t"><tr><th>đoạn</th><th>tính</th><th>toạ độ</th></tr>
          <tr><td>dài 2, hướng $30^\circ$</td><td>$(2 \cdot 0{,}866;\ 2 \cdot 0{,}5)$</td><td>$(1{,}732;\ 1)$</td></tr>
          <tr><td>nối thêm dài 1, hướng $90^\circ$</td><td>$(1{,}732 + 0;\ 1 + 1)$</td><td>$(1{,}732;\ 2)$</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Điều thứ hai, đi một đoạn dài L theo hướng góc theta thì ta tới điểm L cos theta, L sin theta. Muốn nối đuôi hai đoạn, ta chỉ việc cộng toạ độ. Ví dụ đi 2 đơn vị theo hướng 30 độ, ta tới 1 phẩy 732 và 1. Đi tiếp 1 đơn vị thẳng lên, hướng 90 độ, ta cộng thêm 0 và 1, tới 1 phẩy 732 và 2, đúng cách tay máy cộng hai khâu lại."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: độ dài khâu và hai góc khớp"
    steps:
      - show: |
          <p>$L_1$, $L_2$: độ dài khâu 1 (từ gốc tới khuỷu) và khâu 2 (từ khuỷu tới đầu tay).</p>
          <p>$\theta_1$: góc từ trục $x$ tới khâu 1.</p>
          <p>$\theta_2$: góc của khâu 2 đo từ <b>phần kéo dài</b> của khâu 1 — góc <b>tương đối</b>, đúng với cảm biến ở khớp 2.</p>
          <div class="box key">Vì vậy khâu 2 hợp với trục $x$ góc $\theta_1 + \theta_2$.</div>
        focus: [1, 2, 3, 3, 4]
        say: "Ta ký hiệu L 1 và L 2 là độ dài khâu 1, từ gốc tới khuỷu, và khâu 2, từ khuỷu tới đầu tay. Theta 1 là góc từ trục x tới khâu 1. Theta 2 là góc của khâu 2, đo từ phần kéo dài của khâu 1, tức là góc tương đối. Đó đúng là con số mà cảm biến ở khớp 2 đọc được. Vì vậy, khâu 2 hợp với trục x một góc theta 1 cộng theta 2."

  - id: intuition
    kind: intuition
    title: "Hình dung: hai khâu nối đuôi, góc thứ hai đo tương đối"
    steps:
      - show: |
          <div><svg width="1300" height="480" viewBox="0 0 1300 480"><defs><marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><line x1="94.0" y1="400.0" x2="657.5" y2="400.0" stroke="#6b7280" stroke-width="2" marker-end="url(#fk)"/><line x1="140.0" y1="423.0" x2="140.0" y2="55.0" stroke="#6b7280" stroke-width="2" marker-end="url(#fk)"/><line x1="140.0" y1="400.0" x2="348.5" y2="302.8" stroke="#2a78d6" stroke-width="7"/><line x1="348.5" y1="302.8" x2="427.1" y2="86.7" stroke="#eb6834" stroke-width="7"/><line x1="348.5" y1="302.8" x2="463.1" y2="249.3" stroke="#2a78d6" stroke-width="2" stroke-dasharray="8 6"/><circle cx="140.0" cy="400.0" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="348.5" cy="302.8" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="427.1" cy="86.7" r="9" fill="#15803d"/><polyline points="210.0,400.0 210.0,397.6 209.8,395.1 209.6,392.7 209.3,390.3 208.9,387.8 208.5,385.4 207.9,383.1 207.3,380.7 206.6,378.4 205.8,376.1 204.9,373.8 203.9,371.5" fill="none" stroke="#2a78d6" stroke-width="2.5"/><polyline points="402.8,277.4 401.9,275.6 400.9,273.7 399.9,271.9 398.8,270.1 397.6,268.4 396.4,266.7 395.1,265.0 393.7,263.4 392.3,261.9 390.9,260.4 389.4,258.9 387.8,257.5 386.2,256.2 384.6,254.9 382.9,253.6 381.1,252.5 379.4,251.4 377.5,250.3 375.7,249.3 373.8,248.4 371.9,247.6 370.0,246.8" fill="none" stroke="#eb6834" stroke-width="2.5"/><text x="218" y="392" font-size="24" text-anchor="start" fill="#2a78d6" font-weight="bold">θ₁</text><text x="400" y="241" font-size="24" text-anchor="start" fill="#eb6834" font-weight="bold">θ₂</text><text x="471" y="253" font-size="20" text-anchor="start" fill="#2a78d6">khâu 1 kéo dài</text><text x="336" y="337" font-size="22" text-anchor="end" fill="#1f2937">khuỷu</text><text x="443" y="83" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">đầu tay</text><text x="236" y="337" font-size="24" text-anchor="end" fill="#2a78d6" font-weight="bold">L₁</text><text x="374" y="195" font-size="24" text-anchor="end" fill="#eb6834" font-weight="bold">L₂</text><line x1="140.0" y1="432.2" x2="348.5" y2="432.2" stroke="#2a78d6" stroke-width="5"/><text x="244" y="462" font-size="20" text-anchor="middle" fill="#2a78d6" font-weight="bold">L₁ cos θ₁</text><line x1="348.5" y1="432.2" x2="427.1" y2="432.2" stroke="#eb6834" stroke-width="5"/><text x="388" y="462" font-size="20" text-anchor="middle" fill="#eb6834" font-weight="bold">L₂ cos(θ₁ + θ₂)</text><line x1="348.5" y1="302.8" x2="348.5" y2="432.2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="427.1" y1="86.7" x2="427.1" y2="432.2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 5"/><text x="720" y="90" font-size="24" text-anchor="start" fill="#2a78d6" font-weight="bold">Khâu 1: đi L₁ theo hướng θ₁</text><text x="720" y="142" font-size="24" text-anchor="start" fill="#eb6834" font-weight="bold">Khâu 2: đo θ₂ từ phần kéo dài của khâu 1,</text><text x="720" y="194" font-size="24" text-anchor="start" fill="#eb6834" font-weight="bold">nên hướng thật của khâu 2 là θ₁ + θ₂</text><text x="720" y="262" font-size="24" text-anchor="start" fill="#15803d" font-weight="bold">Đầu tay = khâu 1 nối đuôi khâu 2:</text><text x="720" y="314" font-size="24" text-anchor="start" fill="#1f2937">x = L₁ cos θ₁ + L₂ cos(θ₁ + θ₂)</text><text x="720" y="366" font-size="24" text-anchor="start" fill="#6b7280">(hai đoạn đậm dưới trục x)</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này vẽ một tay máy hai khâu ở tư thế bất kỳ. Khâu 1 màu xanh đi từ gốc tới khuỷu theo hướng theta 1. Góc theta 2 không đo từ trục x mà đo từ đường nét đứt, là phần kéo dài của khâu 1, nên khâu 2 màu cam có hướng thật là theta 1 cộng theta 2. Đầu tay là hai khâu nối đuôi nhau, nên hoành độ của nó bằng tổng hai đoạn đậm dưới trục x, L 1 cos theta 1 cộng L 2 cos của theta 1 cộng theta 2."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Công thức động học thuận"
    checks:
      - "all(np.allclose(alg.fk2(1.3, 0.7, a, b)[1], (alg.homog2(a, 0, 0) @ alg.homog2(0, 1.3, 0) @ alg.homog2(b, 0, 0) @ alg.homog2(0, 0.7, 0) @ [0, 0, 1])[:2]) for a in range(-180, 180, 30) for b in range(-180, 180, 30))"
    steps:
      - show: |
          <p>Khuỷu: đi $L_1$ theo hướng $\theta_1$ (bài 0):</p>
          <p>$(x_k, y_k) = (L_1\cos\theta_1,\ L_1\sin\theta_1)$</p>
          <p>Đầu tay: từ khuỷu đi tiếp $L_2$ theo hướng $\theta_1 + \theta_2$:</p>
          <p>$x = L_1\cos\theta_1 + L_2\cos(\theta_1 + \theta_2)$, $\quad y = L_1\sin\theta_1 + L_2\sin(\theta_1 + \theta_2)$</p>
        focus: [1, 2, 3, 4]
        say: "Khuỷu tay nằm ở cuối khâu 1, tức đi L 1 theo hướng theta 1, nên toạ độ là L 1 cos theta 1 và L 1 sin theta 1. Đầu tay thì từ khuỷu đi tiếp L 2 theo hướng theta 1 cộng theta 2. Cộng hai đoạn lại, ta được x bằng L 1 cos theta 1 cộng L 2 cos của theta 1 cộng theta 2. Y cũng vậy, chỉ thay cos bằng sin."
      - show: |
          <p>Cùng kết quả bằng chuỗi ma trận của bài 3, đọc từ phải sang trái:</p>
          <p>$\mathbf{T}_{0E} = \mathbf{R}(\theta_1)\,\mathbf{D}(L_1)\,\mathbf{R}(\theta_2)\,\mathbf{D}(L_2)$</p>
          <p class="note">$\mathbf{R}$: quay tại khớp; $\mathbf{D}(L)$: dời $L$ dọc khâu. Đầu tay là $\mathbf{T}_{0E}(0, 0, 1)^T$. Máy đã so hai cách cho 144 cặp góc: trùng nhau.</p>
        focus: [1, 2, 3, 3]
        say: "Ta cũng ra cùng kết quả bằng chuỗi ma trận thuần nhất ở bài 3, ghép quay và dời thành một ma trận. Theo đúng thứ tự trên tay máy, ta nhân quay ở khớp 1, dời L 1 dọc khâu, quay ở khớp 2, rồi dời L 2. Áp chuỗi đó lên gốc toạ độ, ta được vị trí đầu tay. Máy đã so hai cách cho 144 cặp góc, và chúng trùng nhau."

