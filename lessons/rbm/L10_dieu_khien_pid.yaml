  # ───────────────────────── 5. THÊM D ─────────────────────────
  - id: addd
    kind: concept
    title: "Khâu D và cái giá của P lớn"
    checks:
      - "np.allclose(sorted(np.roots([1, 0, 4]), key=lambda z: z.imag), [-2j, 2j])"
      - "np.allclose(sorted(np.roots([1, 2, 4]), key=lambda z: z.imag), [-1 - 3 ** 0.5 * 1j, -1 + 3 ** 0.5 * 1j])"
      - "round(max(np.roots([1, 3, 3, 1 + 4]).real), 2) == -0.21 and round(max(np.roots([1, 3, 3, 1 + 10]).real), 2) == 0.08 and abs(max(np.roots([1, 3, 3, 1 + 8]).real)) < 1e-9"
      - "max(np.linalg.eigvals(np.array([[-1, 0, -4], [1, -1, 0], [0, 1, -1]])).real) < 0 and max(np.linalg.eigvals(np.array([[-1, 0, -10], [1, -1, 0], [0, 1, -1]])).real) > 0"
    steps:
      - show: |
          <p>Đối tượng là một khối lượng: $p'' = u$ (lực đổi gia tốc). Chỉ khâu P, $u = K(r - p)$. Trạng thái $(p, v)$: $p' = v$, $v' = K(r - p)$; phần không chứa $r$ có $\mathbf{A} = \begin{bmatrix} 0 & 1 \\ -K & 0 \end{bmatrix}$; tìm trị riêng như bài 9 (định thức $ad - bc$ của $\mathbf{A}$ trừ $\lambda$ trên đường chéo bằng 0): $\lambda \cdot \lambda + K = \lambda^2 + K = 0$.</p>
          <p>$K = 4$: $\lambda = \pm 2i$, phần thực 0 — <b>dao động mãi</b> quanh đích (bài 9).</p>
          <p>Thêm khâu D, $u = K(r - p) - K_d\,p'$: hàng dưới của $\mathbf{A}$ thành $(-K,\ -K_d)$, nên $\lambda^2 + K_d\lambda + K = 0$. Với $K_d = 2$: $\lambda^2 + 2\lambda + 4 = 0$, $\lambda = -1 \pm \sqrt{3}\,i$ — <b>tắt dần</b>.</p>
          <div class="box warn">Tăng $K$ quá tay cũng nguy hiểm: với đối tượng gồm ba tầng trễ nối tiếp (mỗi tầng đuổi theo đầu vào của nó như $x' = -x + \text{vào}$), trị riêng thoả $(\lambda + 1)^3 + K = 0$: $K = 4$ còn ổn định (phần thực lớn nhất $\approx -0{,}21$), ngưỡng là $K = 8$, $K = 10$ có phần thực $\approx +0{,}08$ — <b>mất ổn định</b>.</div>
        focus: [1, 1, 1, 2, 3, 3, 4, 4]
        say: "Bây giờ đối tượng là một khối lượng, p hai phẩy bằng u, vì lực làm đổi gia tốc. Chỉ dùng khâu P, đặt trạng thái là vị trí và vận tốc, ma trận A có hàng trên 0, 1 và hàng dưới âm K, 0. Tìm trị riêng như bài 9, trừ lambda trên đường chéo rồi cho định thức bằng 0, ta được lambda bình phương cộng K bằng 0. Với K bằng 4, trị riêng là cộng trừ 2 i, phần thực bằng 0, nên khối dao động mãi quanh đích, như ở bài 9. Thêm khâu D, hàng dưới của A thành âm K, âm K d, được lambda bình phương cộng K d lambda cộng K, với K d bằng 2 thì trị riêng âm 1 cộng trừ căn 3 i. Cuối cùng, tăng K quá tay cũng nguy hiểm. Với một đối tượng có ba tầng trễ nối tiếp, mỗi tầng chậm rãi đuổi theo đầu vào của nó, K bằng 4 còn ổn định. Ngưỡng là K bằng 8, và K bằng 10 đã có trị riêng phần thực dương, tức mất ổn định."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "all(alg.pid_sim(k)[1] > 0.04 for k in (1, 4, 9, 19))"
      - "[round(alg.pid_sim(k)[1], 6) for k in (1, 4, 9, 19)] == [0.5, 0.2, 0.1, 0.05]"
      - "alg.pid_sim(-0.5)[1] > alg.pid_sim(0)[1]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Mong khâu P đưa sai lệch về 0 <b class="red">(sai)</b>
          <br><span class="note">Với đối tượng tự chậm dần, P luôn để lại $\frac{1}{1 + K}$. Cần khâu I.</span></div>
          <table class="t"><tr><th>$K$</th><th>1</th><th>4</th><th>9</th><th>19</th></tr><tr><td>sai lệch còn lại $\frac{1}{1 + K}$</td><td>0,5</td><td>0,2</td><td>0,1</td><td>0,05</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, mong khâu P đưa sai lệch về đúng 0. Với đối tượng tự chậm dần, khâu P luôn để lại sai lệch 1 chia 1 cộng K, nên cần thêm khâu I."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cứ tăng $K$ cho nhanh <b class="red">(sai)</b>
          <br><span class="note">Với đối tượng từ ba tầng trễ trở lên, $K$ lớn gây dao động rồi mất ổn định (ví dụ trên: quá ngưỡng $K = 8$).</span></div>
        say: "Lỗi thứ hai, cứ tăng K cho hệ chạy nhanh hơn. Với đối tượng có từ ba tầng trễ trở lên, K lớn gây dao động, rồi mất ổn định, như ví dụ vượt ngưỡng K bằng 8 ở trên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Để tích phân tích lũy khi động cơ đã chạy hết công suất <b class="red">(sai)</b>
          <br><span class="note">Lực thật bị chặn, nhưng tích phân vẫn lớn mãi; khi tới đích hệ vọt lố rất xa. Phải ngừng tích phân lúc bị chặn.</span></div>
        say: "Lỗi thứ ba, để tích phân tiếp tục tích lũy khi động cơ đã chạy hết công suất. Lực thật bị chặn, nhưng tích phân vẫn lớn mãi, nên khi tới đích hệ vọt lố rất xa. Phải ngừng tích phân trong lúc lực bị chặn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Sai dấu phản hồi <b class="red">(sai)</b>
          <br><span class="note">Sai lệch phải là $r - x$. Đảo dấu thì lực đẩy ra xa đích, sai lệch lớn hơn cả khi không điều khiển.</span></div>
        say: "Lỗi thứ tư, sai dấu phản hồi. Sai lệch phải là r trừ x. Nếu đảo dấu, lực sẽ đẩy ra xa đích, và sai lệch còn lớn hơn cả khi không điều khiển."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(alg.pid_sim(9)[1] - 0.1) < 1e-6 and abs(alg.pid_sim(19)[1] - 0.05) < 1e-6"
      - "np.allclose(sorted(np.roots([1, 0, 9]), key=lambda z: z.imag), [-3j, 3j]) and np.allclose(np.roots([1, 6, 9]), [-3, -3], atol=1e-6)"
      - "round(1 / 0.05, 9) == 20 and 6 ** 2 - 4 * 9 == 0 and (3j) ** 2 == -9 and round(1 / (1 + 9), 9) == 0.1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đối tượng $x' = -x + u$, chỉ khâu P. Với $K = 9$, sai lệch còn bao nhiêu? Cần $K$ bao nhiêu để sai lệch $0{,}05$?</td></tr>
          <tr><td>2</td><td>Khối lượng $p'' = u$, $K = 9$. Chỉ P thì sao? Với $K_d = 6$ thì trị riêng là gì?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với đối tượng bậc nhất và chỉ khâu P, K bằng 9 thì sai lệch còn bao nhiêu? Và cần K bằng bao nhiêu để sai lệch còn 0 phẩy 05? Câu hai, với khối lượng và K bằng 9, chỉ dùng P thì sao? Thêm K d bằng 6 thì trị riêng là gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $\dfrac{1}{1 + 9} = \hl{0{,}1}$.</p>
          <p>Cần $\dfrac{1}{1 + K} = 0{,}05 \Rightarrow 1 + K = \dfrac{1}{0{,}05} = 20 \Rightarrow K = \hl{19}$. Kiểm: $\frac{1}{20} = 0{,}05$ ✓</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, sai lệch bằng 1 chia 10, tức 0 phẩy 1. Muốn còn 0 phẩy 05 thì 1 cộng K phải bằng 20, tức K bằng 19. Kiểm lại, 1 chia 20 đúng bằng 0 phẩy 05."
      - show: |
          <p>② Chỉ P: $\lambda^2 + 9 = 0$, $\lambda = \pm 3i$ (vì $(3i)^2 = -9$), phần thực 0 — dao động mãi.</p>
        say: "Câu hai, chỉ dùng P thì phương trình là lambda bình phương cộng 9 bằng 0. Vì 3 i bình phương bằng âm 9, trị riêng là cộng trừ 3 i, phần thực bằng 0, nên khối dao động mãi."
      - show: |
          <p>Với $K_d = 6$: $b^2 - 4c = 36 - 36 = 0$, nên $\lambda^2 + 6\lambda + 9 = (\lambda + 3)^2$, trị riêng kép $\hl{-3}$ — về đích nhanh, không dao động.</p>
        say: "Thêm K d bằng 6, số trong căn bằng 36 trừ 36, bằng 0, nên hai nghiệm trùng nhau. Phương trình thành lambda cộng 3 bình phương, trị riêng kép âm 3, nên khối về đích nhanh mà không dao động."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">sai lệch $e = r - x$</span><span class="a">→</span>
          <span class="n">P: còn $\frac{1}{1 + K}$</span><span class="a">→</span>
          <span class="n">I: xoá sai lệch</span><span class="a">→</span>
          <span class="n">D: hãm dao động; $K$ lớn quá: mất ổn định</span></div>
        say: "Tổng kết lại, phản hồi dùng sai lệch giữa đích và giá trị đo. Khâu P còn để lại sai lệch 1 chia 1 cộng K. Khâu I xoá sai lệch đó. Khâu D hãm dao động, và hệ số P quá lớn có thể làm hệ mất ổn định."
      - show: |
          <div class="box key"><b>Tư duy:</b> điều khiển là thay đổi trị riêng của hệ. Mỗi lần chỉnh hệ số, hãy hỏi trị riêng đi về đâu.</div>
        say: "Điều cần mang theo, điều khiển thực chất là thay đổi trị riêng của hệ. Mỗi lần chỉnh một hệ số, hãy hỏi trị riêng đi về đâu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>rời rạc hoá</b> và ổn định số — bộ điều khiển chạy trên máy tính theo từng bước thời gian.</p>
        forward_ref: true
