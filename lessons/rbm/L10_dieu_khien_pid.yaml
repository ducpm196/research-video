  - {sentence: "Thêm K d bằng 6 thì trị riêng là gì?", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Bây giờ đối tượng là một khối lượng, p hai phẩy bằng u, vì lực làm đổi gia tốc.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đo, so, sửa"
    steps:
      - show: |
          <p>Muốn động cơ quay đúng tốc độ 1. Cấp một mức điện cố định thì tải nặng lên là chậm lại, và không ai sửa.</p>
          <p><b>Phản hồi</b>: đo tốc độ thật, so với đích, lấy sai lệch để chỉnh lực đẩy — liên tục.</p>
          <div class="box key">Hôm nay: điều khiển phản hồi và bộ điều khiển <b>PID</b> — ba cách dùng sai lệch: tỉ lệ, tích phân, đạo hàm.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ta muốn một động cơ quay đúng tốc độ 1. Nếu chỉ cấp một mức điện cố định, khi tải nặng lên động cơ sẽ chậm lại, và không ai sửa cả. Cách làm của phản hồi là đo tốc độ thật, so với đích, rồi lấy sai lệch để chỉnh lực đẩy, liên tục không ngừng. Hôm nay ta học điều khiển phản hồi và bộ điều khiển PID, ba cách dùng sai lệch là tỉ lệ, tích phân và đạo hàm."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trạng thái đứng yên, cộng dồn, nghiệm bậc hai"
    checks:
      - "round(alg.euler_ode(lambda t, x: -x + 3, 0.0, 0.01, 2000)[-1], 6) == 3.0 and -3 + 3 == 0"
      - "0.2 * 5 == 1.0 and round(sum(0.2 * 0.5 for _ in range(10)), 9) == 1.0"
      - "2 ** 2 - 4 * 4 == -12 and np.allclose(sorted(np.roots([1, 2, 4]), key=lambda z: z.imag), [-1 - 3 ** 0.5 * 1j, -1 + 3 ** 0.5 * 1j]) and abs(math.sqrt(12) - 2 * math.sqrt(3)) < 1e-12"
    steps:
      - show: |
          <p><b>Đứng yên</b> nghĩa là không còn thay đổi: $x' = 0$. Ví dụ $x' = -x + 3$:</p>
          $$0 = -x + 3 \Rightarrow x_{\text{yên}} = 3$$
          <p class="note">Thử lại: tại $x = 3$, $x' = -3 + 3 = 0$ — đúng là đứng yên. Mô phỏng Euler của bài 7 từ $x = 0$ cũng dừng ở 3.</p>
        introduces: [implies]
        focus: [1, 2, 3, 3]
        say: "Trước khi vào bài, ta ôn ba điều sẽ dùng. Thứ nhất, một hệ đứng yên khi không còn thay đổi, tức x phẩy bằng 0, nên muốn tìm điểm đứng yên ta chỉ việc đặt x phẩy bằng 0 rồi giải. Ví dụ x phẩy bằng âm x cộng 3, đặt bằng 0 thì x bằng 3. Thử lại tại x bằng 3, x phẩy bằng âm 3 cộng 3, đúng bằng 0, và mô phỏng Euler từ 0 cũng dừng ở 3."
      - show: |
          <p><b>Tích phân theo thời gian</b> = cộng dồn: chia thời gian thành khúc nhỏ, cộng (giá trị × độ dài khúc).</p>
          <table class="t"><tr><th>sai lệch giữ nguyên</th><th>trong</th><th>cộng dồn</th></tr>
          <tr><td>0,2</td><td>5 giây</td><td>$0{,}2 \cdot 5 = 1$</td></tr>
          <tr><td>0,2</td><td>10 khúc, mỗi khúc 0,5 giây</td><td>$10 \cdot (0{,}2 \cdot 0{,}5) = 1$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Thứ hai, tích phân theo thời gian là phép cộng dồn, ta chia thời gian thành nhiều khúc nhỏ rồi cộng giá trị nhân độ dài từng khúc. Một sai lệch 0 phẩy 2 giữ nguyên trong 5 giây cộng dồn được 0 phẩy 2 nhân 5, bằng 1. Chia 5 giây đó thành 10 khúc, mỗi khúc 0 phẩy 5 giây, cộng 10 lần 0 phẩy 1 cũng được 1."
      - clear: true
        show: |
          <p><b>Nghiệm bậc hai</b> $\lambda^2 + b\lambda + c = 0$: $\lambda = \frac{-b \pm \sqrt{b^2 - 4c}}{2}$; nếu $b^2 - 4c < 0$ thì nghiệm phức (bài 9).</p>
          $$\lambda^2 + 2\lambda + 4:\quad b^2 - 4c = 4 - 16 = -12,\quad \lambda = \frac{-2 \pm 2\sqrt{3}\,i}{2} = -1 \pm \sqrt{3}\,i$$
        focus: [1, 1, 2]
        say: "Thứ ba, nghiệm của phương trình bậc hai lambda bình phương cộng b lambda cộng c bằng 0 là âm b cộng trừ căn của b bình phương trừ 4 c, tất cả chia 2. Nếu số trong căn âm thì nghiệm là số phức, như đã gặp ở bài 9. Ví dụ lambda bình phương cộng 2 lambda cộng 4 có b bình phương trừ 4 c bằng 4 trừ 16, bằng âm 12, nên nghiệm là âm 1 cộng trừ căn 3 i."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: e, u và ba khâu"
    steps:
      - show: |
          <p>Đối tượng (động cơ): $x' = -x + u$ — tự chậm dần như bài 7, cộng lực đẩy $u$ ta cấp vào.</p>
          <p>Sai lệch: $e = r - x$, với $r$ là đích (chữ $e$ ở đây là sai lệch, không phải số $e \approx 2{,}718$). $\int e\,dt$: cộng dồn $e$ nhân từng khoảng thời gian nhỏ, tức diện tích dưới đường sai lệch.</p>
          <p>$u = \underbrace{K e}_{\text{P: tỉ lệ}} + \underbrace{K_i \int e\,dt}_{\text{I: tích phân}} + \underbrace{K_d\, e'}_{\text{D: đạo hàm}}$</p>
          <div class="box key">P đẩy theo sai lệch <b>hiện tại</b>; I đẩy theo sai lệch <b>tích lũy</b> từ trước tới nay; D đẩy theo việc sai lệch đang <b>đổi nhanh</b> thế nào.</div>
        focus: [1, 1, 2, 2, 3, 4, 4]
        say: "Đối tượng ở đây là động cơ, x phẩy bằng âm x cộng u. Nó tự chậm dần như ở bài 7, cộng thêm lực đẩy u ta cấp vào. Sai lệch e bằng đích r trừ x, chữ e ở đây là sai lệch chứ không phải số e xấp xỉ 2 phẩy 718. Tích phân của e là tổng dồn của e nhân từng khoảng thời gian nhỏ, tức diện tích dưới đường sai lệch. Bộ PID cấp u bằng tổng ba khâu, K nhân e, K i nhân tích phân của e, và K d nhân đạo hàm của e. Khâu P đẩy theo sai lệch hiện tại, khâu I đẩy theo sai lệch tích lũy từ trước tới nay. Khâu D đẩy theo việc sai lệch đang thay đổi nhanh thế nào."

  - id: intuition
    kind: intuition
    title: "Hình dung: vòng đo – so – sửa"
    checks:
      - "round(alg.pid_sim(4)[0], 6) == 0.8 and round(4 * (1 - alg.pid_sim(4)[0]), 6) == 0.8"
      - "round(-0.8 + 4 * 0.2, 9) == 0"
    steps:
      - show: |
          <div><svg width="1200" height="430" viewBox="0 0 1200 430"><defs><marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><text x="60" y="158" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold">đích r = 1</text><line x1="190" y1="150" x2="262" y2="150" stroke="#1f2937" stroke-width="3" marker-end="url(#fk)"/><circle cx="285" cy="150" r="22" fill="#fffbeb" stroke="#1f2937" stroke-width="3"/><text x="285" y="159" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="bold">−</text><text x="256" y="194" font-size="20" text-anchor="end" fill="#6b7280">trừ</text><line x1="307" y1="150" x2="400" y2="150" stroke="#1f2937" stroke-width="3" marker-end="url(#fk)"/><text x="352" y="136" font-size="23" text-anchor="middle" fill="#b91c1c" font-weight="bold">e = 0,2</text><rect x="402" y="95" width="260" height="110" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="532" y="142" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">bộ điều khiển</text><text x="532" y="174" font-size="24" text-anchor="middle" fill="#1f2937">u = K nhân e, K = 4</text><line x1="662" y1="150" x2="752" y2="150" stroke="#1f2937" stroke-width="3" marker-end="url(#fk)"/><text x="707" y="136" font-size="23" text-anchor="middle" fill="#2a78d6" font-weight="bold">u = 0,8</text><rect x="754" y="95" width="240" height="110" rx="10" fill="#ffedd5" stroke="#1f2937" stroke-width="3"/><text x="874" y="142" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">động cơ</text><text x="874" y="174" font-size="24" text-anchor="middle" fill="#1f2937">x phẩy = −x + u</text><line x1="994" y1="150" x2="1130" y2="150" stroke="#1f2937" stroke-width="3" marker-end="url(#fk)"/><text x="1070" y="136" font-size="23" text-anchor="middle" fill="#15803d" font-weight="bold">x = 0,8</text><polyline points="1080,150 1080,300 285,300 285,174" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#fk)"/><text x="660" y="290" font-size="22" text-anchor="middle" fill="#15803d">đo x rồi đưa về so với đích (phản hồi)</text><text x="60" y="370" font-size="23" text-anchor="start" fill="#1f2937">Lúc đứng yên: lực đẩy u = 4 nhân 0,2 = 0,8 vừa đủ bù phần tự chậm −x = −0,8, nên x phẩy = 0.</text><text x="60" y="410" font-size="23" text-anchor="start" fill="#b91c1c" font-weight="bold">Nếu sai lệch e về 0 thì u = 0, động cơ lại chậm đi: khâu P cần sai lệch để còn lực đẩy.</text></svg></div>
        focus: [1, 1, 1, 1, 1, 1, 1]
        say: "Hình này vẽ vòng phản hồi, trái tim của điều khiển phản hồi. Đích r bằng 1 đi vào bộ trừ, bộ trừ lấy đích trừ giá trị đo x để ra sai lệch e. Bộ điều khiển biến sai lệch thành lực đẩy u, và động cơ nhận lực đẩy đó. Tốc độ x đo được lại quay về bộ trừ, nên vòng cứ chạy liên tục. Với khâu P và K bằng 4, vòng đứng yên khi x bằng 0 phẩy 8 và sai lệch bằng 0 phẩy 2. Lúc đó lực đẩy 4 nhân 0 phẩy 2 bằng 0 phẩy 8, vừa đủ bù phần tự chậm âm 0 phẩy 8. Nếu sai lệch về 0 thì lực đẩy cũng về 0, động cơ lại chậm đi, vì thế khâu P luôn để lại một chút sai lệch."

  # ───────────────────────── 3. CHỈ P ─────────────────────────
  - id: ponly
    kind: example
    title: "Chỉ khâu P: còn sai lệch 1/(1 + K)"
    checks:
      - "round(alg.pid_sim(4)[0], 6) == 0.8 and round(alg.pid_sim(4)[1], 6) == 0.2"
      - "round(4 / (1 + 4), 6) == 0.8 and round(1 / (1 + 4), 6) == 0.2"
      - "all(abs(alg.pid_sim(k)[1] - 1 / (1 + k)) < 1e-6 for k in (1, 4, 9, 19))"
    steps:
      - show: |
          <p><b>Bước 1 —</b> thay $u = K(r - x)$ rồi phá ngoặc, gom các số hạng có $x$:</p>
          $$x' = -x + K(r - x) = -(1 + K)x + K r$$
        focus: [1, 2]
        say: "Bước một, chỉ dùng khâu P, thay u bằng K nhân r trừ x rồi phá ngoặc. Ta được x phẩy bằng âm của 1 cộng K, nhân x, rồi cộng K r."
      - show: |
          <p><b>Bước 2 —</b> khi đã yên, $x' = 0$, chuyển vế: $(1 + K)x = K r$.</p>
        say: "Bước hai, như phần ôn đầu bài, khi hệ đã đứng yên thì x phẩy bằng 0, chuyển vế ta được 1 cộng K nhân x bằng K r."
      - show: |
          <p><b>Bước 3 —</b> chia hai vế cho $1 + K$:</p>
          $$x_{\text{yên}} = \dfrac{K}{1 + K} r, \quad \text{sai lệch còn lại} = r - x_{\text{yên}} = \dfrac{1}{1 + K} r$$
        focus: [1, 2]
        say: "Bước ba, chia hai vế cho 1 cộng K. Vậy x lúc yên bằng K chia 1 cộng K, nhân r, và sai lệch còn lại, gọi là sai số xác lập, là 1 chia 1 cộng K."
      - show: |
          <p><b>Bước 4 —</b> thử $K = 4$, $r = 1$: $x_{\text{yên}} = \frac{4}{5} = 0{,}8$, sai lệch $\frac{1}{5} = \hl{0{,}2}$. Mô phỏng cho đúng số đó.</p>
        say: "Bước bốn, thử với K bằng 4 và đích bằng 1, 4 chia 5 bằng 0 phẩy 8, nên x dừng ở 0 phẩy 8 và còn sai 0 phẩy 2. Mô phỏng trên máy cũng cho đúng con số đó."
      - show: |
          <p>Vì sao không về đúng 1? Muốn giữ $x = 1$ cần lực đẩy $u = 1$ để bù phần tự chậm. Nhưng chỉ khâu P thì $u = K e$: <b>có lực chỉ khi còn sai lệch</b>.</p>
          <p class="note">Tăng $K$ thì sai lệch nhỏ đi nhưng không bao giờ bằng 0. Trị riêng $-(1 + K)$ cũng âm hơn: hệ về nhanh hơn.</p>
        focus: [1, 1, 2, 2]
        say: "Vì sao x không về đúng 1? Muốn giữ x bằng 1, ta cần lực đẩy u bằng 1 để bù phần động cơ tự chậm. Nhưng với khâu P, u bằng K nhân e, tức chỉ có lực khi còn sai lệch. Tăng K thì sai lệch nhỏ đi nhưng không bao giờ bằng 0, đồng thời trị riêng, bằng âm của 1 cộng K, càng âm hơn, nên hệ về nhanh hơn."

  - id: check
    kind: check
    title: "Tự kiểm: thế ngược, thử hai bên điểm 0,8"
    checks:
      - "round(-0.8 + 4 * (1 - 0.8), 9) == 0 and round(-0.9 + 4 * (1 - 0.9), 9) == -0.5 and round(-0.7 + 4 * (1 - 0.7), 9) == 0.5"
      - "round(4 * (1 - 0.9), 9) == 0.4 and round(4 * (1 - 0.7), 9) == 1.2 and round(4 * (1 - 0.8), 9) == 0.8"
      - "all(abs(alg.pid_sim(4, h=h)[0] - 0.8) < 1e-6 for h in (0.001, 0.0005))"
    steps:
      - show: |
          <p>Không dùng công thức, thế thẳng vào $x' = -x + 4(1 - x)$ ở ba vị trí:</p>
          <table class="t"><tr><th>$x$</th><th>sai lệch $e$</th><th>lực $u = 4e$</th><th>$x' = -x + u$</th><th>xu hướng</th></tr>
          <tr><td>0,7</td><td>0,3</td><td>1,2</td><td>$+0{,}5$</td><td>tăng lên</td></tr>
          <tr><td>0,8</td><td>0,2</td><td>0,8</td><td>$0$</td><td>đứng yên ✓</td></tr>
          <tr><td>0,9</td><td>0,1</td><td>0,4</td><td>$-0{,}5$</td><td>giảm xuống</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 2]
        say: "Kiểm bằng đường khác, ta không dùng công thức mà thế thẳng ba vị trí vào phương trình. Ở x bằng 0 phẩy 7, sai lệch 0 phẩy 3, lực đẩy 1 phẩy 2, nên x phẩy bằng dương 0 phẩy 5, x còn tăng lên. Ở x bằng 0 phẩy 8, lực đẩy 0 phẩy 8 vừa bù phần tự chậm, x phẩy bằng 0, đúng là đứng yên. Ở x bằng 0 phẩy 9, lực đẩy chỉ 0 phẩy 4, x phẩy bằng âm 0 phẩy 5, nên x tụt về. Cả hai phía đều bị kéo về 0 phẩy 8, khớp với công thức và với mô phỏng."

  # ───────────────────────── 4. THÊM I ─────────────────────────
  - id: addi
    kind: concept
    title: "Thêm khâu I: sai lệch về 0"
    checks:
      - "abs(alg.pid_sim(4, ki=4)[1]) < 1e-6"
      - "abs(alg.pid_sim(4, ki=4, h=0.0005)[0] - alg.pid_sim(4, ki=4)[0]) < 1e-6"
    steps:
      - show: |
