- id: intuition
  kind: intuition
  title: 'Đường đi lớp proxy: Lời gọi ngoài vs Lời gọi nội bộ (self-invocation)'
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="25" y="25" width="165" height="75" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="107.5" y="57" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">Controller</text><text
      x="107.5" y="81" font-size="13" text-anchor="middle" fill="#475569">Gọi từ bên ngoài</text><line x1="190" y1="62" x2="245"
      y2="62" stroke="#475569" stroke-width="2"/><polygon points="245,62 237,57 237,67" fill="#475569"/><rect x="245" y="25"
      width="215" height="75" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="352.5" y="57" font-size="16"
      font-weight="700" text-anchor="middle" fill="#1e293b">Proxy 1 (REQUIRED)</text><text x="352.5" y="81" font-size="13"
      text-anchor="middle" fill="#475569">Mở TX 1 (Kết nối 1)</text><line x1="460" y1="62" x2="515" y2="62" stroke="#475569"
      stroke-width="2"/><polygon points="515,62 507,57 507,67" fill="#475569"/><rect x="515" y="25" width="415" height="75"
      rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="722.5" y="57" font-size="16" font-weight="700" text-anchor="middle"
      fill="#1e293b">Proxy 2: AuditLogService (REQUIRES_NEW)</text><text x="722.5" y="81" font-size="13" text-anchor="middle"
      fill="#475569">Mở TX 2 (Kết nối 2) → Commit độc lập khi TX 1 rollback</text><rect x="245" y="122" width="685" height="68"
      rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="587.5" y="152" font-size="16" font-weight="700" text-anchor="middle"
      fill="#991b1b">Bẫy self-invocation: this.record(...) trong cùng class</text><text x="587.5" y="176" font-size="13" text-anchor="middle"
      fill="#475569">Bỏ qua Proxy 2 → chạy chung TX 1 → bị rollback theo giao dịch chính!</text></svg></div>'
    say: Quan sát sơ đồ hoạt động của hai tầng dịch vụ qua lớp bọc pờ-rốc-xi. Bộ điều khiển bên ngoài gọi vào dịch vụ chuyển
      khoản nên yêu cầu đi đúng qua lớp bọc mở giao dịch số một trên kết nối đầu tiên. Khi dịch vụ chuyển khoản gọi sang
      dịch vụ nhật ký nằm ở một lớp riêng biệt, lời gọi lại đi qua một lớp bọc thứ hai.
    clear: true
  - show: ''
    say: Nhờ đánh dấu tạo phiên độc lập, kết nối số hai chốt xong bản ghi kiểm toán ngay lập tức bất chấp giao dịch chính
      quay lui sau đó. Nhờ đường dẫn đi qua hai lớp vỏ độc lập của hai lớp dịch vụ riêng biệt, kết nối thứ hai không phụ
      thuộc số phận phiên cha. Trạng thái đóng hay quay lui của mỗi phiên được điều phối rành mạch đúng theo chú thích gắn
      trên từng phương thức.
- id: formula
  kind: formula
  title: Số kết nối đồng thời và quy tắc ngoại lệ hoàn tác mặc định
  checks:
  - alg.spb_tx_connections(50, True) == (2, 100)
  - 500 * 2 == 1000
  steps:
  - show: <div class='box key'><p><b>Hai con số cần nhớ khi thiết kế giao dịch lồng nhau:</b></p><p>1. Một luồng gọi <code>REQUIRED
      → REQUIRES_NEW</code> giữ đồng thời <b>2 kết nối JDBC</b> cùng lúc (kết nối cha chờ kết nối con xong mới tiếp tục).</p><p>2.
      Với bể HikariCP mặc định <b>10 kết nối</b>, chỉ cần <b>10 luồng</b> cùng mở giao dịch con lồng nhau là cả 10 kết nối
      cha đều bận, gây <b>bế tắc bể kết nối (connection pool deadlock)</b>!</p></div>
    say: Phép tính đơn giản này giải thích một lỗi treo hệ thống rất hay gặp trên thực tế. Khi phiên cha giữ một kết nối mà
      chưa trả lại và xin thêm kết nối cho phiên con thì mỗi luồng chiếm hai chỗ. Vì bể tối đa mười kết nối, nếu mười luồng
      cùng chạy tới điểm đó thì phiên con chờ mãi không nhận được kết nối. Đây là nguyên nhân chính khiến hệ thống treo cứng
      dưới tải cao dù số lượng máy khách đồng thời mới chỉ bằng đúng cỡ bể kết nối. Do đó, bất cứ khi nào dùng mức tạo phiên
      độc lập, hãy tính nhẩm gấp đôi nhu cầu kết nối hoặc cân nhắc tách xử lý bất đồng bộ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Mã thật: TransferService tiêm hàm dựng + AuditLogService độc lập'
  checks:
  - 500_000 - 150_000 == 350_000
  steps:
  - show: <p><b>1. Dịch vụ nhật ký mở phiên riêng bằng REQUIRES_NEW</b></p><div class="code"><div>@Service</div><div>public
      class AuditLogService {</div><div>  private final AuditEntryRepo repo;</div><div>  public AuditLogService(AuditEntryRepo
      repo) { this.repo = repo; }</div><div>  @Transactional(propagation = Propagation.REQUIRES_NEW)</div><div>  public void
      record(String msg) {</div><div>    repo.save(new AuditEntry(msg));</div><div>  }</div><div>}</div></div>
    say: Đoạn mã đầu tiên cài đặt dịch vụ nhật ký trong một lớp riêng biệt hoàn toàn với dịch vụ chuyển khoản. Nhờ tách sang
      lớp riêng và tiêm phụ thuộc qua hàm dựng, mọi lời gọi tới phương thức ghi nhật ký đều đi qua lớp bọc pờ-rốc-xi. Khi
      hàm chạy xong, giao dịch con tự động chốt xuống bảng ngay lập tức mà không chờ kết quả của hàm gọi nó. Lưu ý phương
      thức ghi nhật ký dùng đúng mức lan truyền tạo phiên mới để cam kết độc lập với luồng chuyển tiền chính. Cấu trúc chỉ
      một hàm dựng với tham số bắt buộc bảo đảm dịch vụ không bao giờ khởi tạo trong trạng thái thiếu kho lưu trữ.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>2. Dịch vụ chuyển khoản tiêm hàm dựng và hoàn tác ngoại lệ kiểm tra</b></p><div class="code"><div>@Service
      public class TransferService {</div><div>  private final AccountRepo accounts; private final AuditLogService audit;</div><div>  public
      TransferService(AccountRepo a, AuditLogService au) { accounts=a; audit=au; }</div><div>  @Transactional(rollbackFor
      = InsufficientFundsException.class)</div><div>  public void transfer(String from, String to, long amt) throws InsufficientFundsException
      {</div><div>    if (from.equals(to) || amt &lt;= 0) throw new IllegalArgumentException("Tham so loi");</div><div>    Account
      src = accounts.findById(from).orElseThrow();</div><div>    Account dst = accounts.findById(to).orElseThrow();</div><div>    src.setBalance(src.getBalance()
      - amt);</div><div>    audit.record("TRY " + from + "-&gt;" + to + ":" + amt);</div><div>    if (src.getBalance() &lt;
      0) throw new InsufficientFundsException("Khong du so du");</div><div>    dst.setBalance(dst.getBalance() + amt);</div><div>  }</div></div>
    say: Tiếp theo là dịch vụ chuyển khoản với hai trường kho dữ liệu và nhật ký đều là biến bất biến nhận từ hàm dựng. Ta
      cố ý trừ tạm số dư rồi ghi nhật ký trước khi ném ngoại lệ kiểm tra thiếu tiền để thử thách ranh giới hoàn tác. Nhờ khai
      báo rõ thuộc tính hoàn tác cho lớp ngoại lệ kiểm tra này, số dư tài khoản nguồn được khôi phục nguyên vẹn trong khi
      dòng nhật ký vừa ghi vẫn tồn tại. Bên cạnh điều kiện kiểm tra số dư, hàm cũng kiểm tra tự chuyển cùng một mã tài khoản
      từ gửi sang nhận để từ chối ngay đầu vào. Nếu phát hiện tài khoản nguồn trùng với tài khoản đích hoặc số tiền không
      dương, hàm ném ngoại lệ tham số bất hợp lệ sạch sẽ.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật trên Boot 4.1.3 + JPA: ngoại lệ kiểm tra hoàn tác sạch, nhật ký còn nguyên'
  checks:
  - 500_000 + 200_000 == 700_000
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL02Test qua ./mvnw -B verify</b></p><div class="code"><div>// Seed: A = 500_000, B
      = 200_000</div><div>// 1) transfer("A", "B", 150_000) → A = 350_000, B = 350_000, audits = 1</div><div>// 2) transfer("A",
      "B", 900_000) → ném InsufficientFundsException</div><div>//    Sau hoàn tác: A = 500_000, B = 200_000 (bảo toàn 700_000),
      audits = 1</div><div>[INFO] Tests run: 4, Failures: 0, Errors: 0, Total time: 14.580 s</div><div>ĐÚNG — PASS /d/research-video/labs/SPB/L02
      (du_an maven)</div></div>'
    say: Màn hình xác nhận đầu ra thật từ bốn ca kiểm thử tích hợp cơ sở dữ liệu khi chạy lệnh dựng kiểm. Ở ca đầu tiên hợp
      lệ, tổng tiền hai tài khoản vẫn bảo toàn đúng bảy trăm nghìn đồng vì tiền trừ bằng tiền cộng. Ở ca vượt số dư, số dư
      quay lui nguyên vẹn nhờ thuộc tính hoàn tác, còn bản ghi kiểm toán vẫn lưu lại nhờ phiên độc lập. Ca kiểm thứ ba xác
      nhận kịch bản từ chối khi tài khoản gửi trùng tài khoản nhận mà không chạm vào bảng số dư. Ca kiểm thứ tư bảo đảm tổng
      tiền toàn bộ hai tài khoản sau hàng loạt giao dịch đạt và hỏng vẫn bằng đúng vốn khởi tạo ban đầu.
    focus:
