objectives:
- Cấu trúc tầng dịch vụ tiêm phụ thuộc qua hàm dựng bất biến thay vì tiêm thẳng lên trường
- Chọn mức lan truyền REQUIRED và REQUIRES_NEW cùng thuộc tính rollbackFor cho ngoại lệ kiểm tra
- Đo số kết nối bể giữ đồng thời khi giao dịch lồng nhau ở 5, 50 và 500 luồng
scenes:
- id: hook
  kind: hook
  title: 'Chuyển tiền thất bại nhưng nhật ký kiểm toán biến mất cùng lệnh hoàn tác: vì sao?'
  checks:
  - alg.spb_tx_connections(1, True) == (2, 2)
  steps:
  - show: <div class='box key'><p>Trong hệ thống ngân hàng, mọi lệnh chuyển khoản thất bại vì thiếu số dư phải <b>hoàn tác
      số dư</b> nhưng <b>nhật ký tra soát vẫn phải còn trong cơ sở dữ liệu</b> để điều tra.</p><p>Mặc định của Spring chỉ
      hoàn tác khi gặp ngoại lệ chưa kiểm tra và huỷ sạch cả các thao tác ghi bên trong nếu dùng chung một giao dịch.</p></div>
    say: Chào bạn đến với bài hai của khoá Spring Boot thực chiến. Một lỗi kinh điển ở tầng dịch vụ là hệ thống hoàn tác số
      dư tài khoản nhưng làm mất luôn bản ghi nhật ký tra soát sự cố. Ngược lại, nhiều ứng dụng ném ngoại lệ kiểm tra vì thiếu
      số dư nhưng giao dịch lại không tự hoàn tác, dẫn tới trừ nhầm tiền khách hàng. Hôm nay ta học cách cấu trúc tầng dịch
      vụ bất biến và điều khiển chính xác ranh giới giao dịch hoàn tác. Hiểu đúng ranh giới giao dịch và cơ chế lớp vỏ trung
      gian giúp bạn ngăn chặn cả mất dấu kiểm toán lẫn rò rỉ tiền thật. Mọi tình huống đều được kiểm chứng qua chạy thật tầng
      dịch vụ trên cơ sở dữ liệu ngay trong bài học.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: giao dịch ACID và cơ chế lớp bọc proxy trong Spring'
  steps:
  - show: <table class='t'><tr><th>khái niệm nền</th><th>cơ chế trong Spring</th></tr><tr><td>Tính nguyên tử giao dịch</td><td>Hoặc
      chốt cả khối lệnh, hoặc quay lui nguyên trạng ban đầu</td></tr><tr><td>Lớp bọc <code>proxy</code></td><td>Chặn lời gọi
      từ ngoài đậu vào phương thức để mở/đóng giao dịch</td></tr><tr><td>Bể kết nối cơ sở dữ liệu</td><td>Số lượng kết nối
      vật lý giới hạn cần trả lại sớm sau mỗi lượt</td></tr></table>
    say: Hãy ôn nhanh ba khái niệm nền giúp bạn đọc hiểu toàn bộ hành vi giao dịch trong Spring. Tính nguyên tử bảo đảm mọi
      thay đổi trong một khối công việc hoặc lưu trọn vẹn hoặc quay lui sạch sẽ. Spring không sửa mã nguồn của bạn mà bọc
      quanh đối tượng dịch vụ một lớp vỏ trung gian gọi là pờ-rốc-xi để mở phiên trước khi hàm chạy và chốt sau khi hàm kết
      thúc. Vì bể kết nối có kích thước giới hạn nên mỗi giao dịch giữ kết nối càng ngắn càng an toàn. Vì lớp vỏ trung gian
      chỉ bọc bên ngoài hạt đậu dịch vụ, mọi lời gọi từ bên ngoài mới đi qua bộ mở đóng giao dịch. Hiểu đúng vai trò của lớp
      bọc và bể kết nối là chìa khoá giải mã mọi hành vi kỳ lạ khi chạy giao dịch lồng nhau.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Hai kiểu tiêm phụ thuộc và các tham số điều khiển giao dịch
  steps:
  - show: '<table class=''t''><tr><th>cấu trúc / tham số</th><th>hành vi đúng chuẩn sản xuất</th></tr><tr><td>Tiêm qua hàm
      dựng (<code>final</code> field)</td><td>Khoá bất biến phụ thuộc, dễ khởi tạo trong kiểm thử đơn vị không cần Spring</td></tr><tr><td><code>Propagation.REQUIRED</code></td><td>Mặc
      định: tham gia giao dịch đang mở sẵn, chỉ giữ đúng 1 kết nối</td></tr><tr><td><code>Propagation.REQUIRES_NEW</code></td><td>Treo
      giao dịch ngoài, mở giao dịch mới và lấy thêm 1 kết nối độc lập</td></tr><tr><td><code>rollbackFor = Exception.class</code></td><td>Bắt
      buộc hoàn tác cả với ngoại lệ kiểm tra (checked exception)</td></tr></table>'
    say: Bảng này giải thích hai quy tắc thiết kế và hai thuộc tính giao dịch cốt lõi. Thứ nhất, luôn tiêm phụ thuộc qua hàm
      dựng với trường bất biến để tránh lỗi con trỏ rỗng và dễ tách ra kiểm thử độc lập. Thứ hai, mức mặc định tham gia luôn
      giao dịch cha nên chỉ giữ một kết nối duy nhất. Thứ ba, mức tạo mới độc lập tạm treo phiên cha để mở một phiên riêng,
      nhờ đó nhật ký kiểm toán không bị cuốn trôi khi giao dịch chính quay lui. Thứ tư, khai báo thuộc tính hoàn tác rõ ràng
      giúp cả ngoại lệ kiểm tra cũng kích hoạt quay lui an toàn. Việc chọn tham số lan truyền phù hợp luôn phải cân bằng giữa
      nhu cầu tách phiên độc lập và giới hạn số kết nối vật lý. Ghi rõ danh sách ngoại lệ kiểm tra cần hoàn tác biến quy ước
      ngầm thành hợp đồng rõ ràng ngay trên chữ ký hàm.
    focus:
