      (2 kết nối/luồng)</th></tr><tr><td><b>5 luồng</b></td><td>Giữ tối đa 5 kết nối</td><td>Giữ tối đa <b>10 kết nối</b>
      (vừa chạm ngưỡng bể mặc định)</td></tr><tr><td><b>50 luồng</b></td><td>Giữ 50 kết nối (hoặc xếp hàng đều)</td><td>Đòi
      tới <b>100 kết nối</b> nếu không tách giao dịch ngoài</td></tr><tr><td><b>500 luồng</b></td><td>500 kết nối</td><td>Đòi
      <b>1 000 kết nối</b> → nghẽn nặng nếu gọi lồng giữa giờ cao điểm</td></tr></table>
    say: Bảng quy mô cho thấy rõ cái giá phải trả của việc lạm dụng giao dịch con lồng nhau ở mức năm, năm mươi và năm trăm
      luồng. Với chỉ năm luồng hệ thống giữ mười kết nối chạm ngưỡng bể mặc định, còn ở năm mươi luồng nhu cầu vọt lên một trăm kết nối. Khi
      tăng lên năm trăm luồng đồng thời, tổng nhu cầu vọt lên một nghìn kết nối nếu phiên cha vẫn ôm chặt kết nối cũ. Do đó
      ở quy mô lớn, ta nên ghi nhật ký bất đồng bộ hoặc đẩy ra sau khi giao dịch chính đã kết thúc thay vì mở hai kết nối
      song song. Ngoài việc tốn gấp đôi kết nối, thời gian giữ kết nối của phiên cha cũng kéo dài hơn vì phải chờ phiên con
      ghi xong xuống đĩa. Với hệ thống lớn hơn nữa, mô hình bảng chờ xuất tin kết hợp hàng đợi bất đồng bộ sẽ giải phóng hẳn
      nút thắt hai kết nối đồng thời.
    focus:
