- id: pitfalls
  kind: pitfall
  title: Ba lỗi giao dịch gây rò rỉ tiền hoặc treo hệ thống
  steps:
  - show: <table class='t'><tr><th>lỗi kỹ thuật thường gặp ở tầng dịch vụ</th></tr><tr><td><div class='box warn'><b>Lỗi 1
      — Quên <code>rollbackFor</code> khi ném checked exception:</b> Spring chỉ tự hoàn tác cho <code>RuntimeException</code>
      và <code>Error</code>, làm số dư trừ dở vẫn bị commit!<br><b>Lỗi 2 — Tự gọi phương thức trong cùng lớp (<code>this.record(...)</code>):</b>
      Lời gọi đi thẳng bỏ qua lớp proxy, khiến <code>REQUIRES_NEW</code> hoàn toàn vô tác dụng.<br><b>Lỗi 3 — Dùng tiêm trường
      (<code>@Autowired</code> trên field):</b> Giấu phụ thuộc, không tạo được biến <code>final</code> và khó viết test đơn
      vị thuần.</div></td></tr></table>
    say: Ba lỗi trên bảng đều là những lỗi nghiêm trọng đã từng gây sự cố ngoài đời thực. Quên khai báo hoàn tác cho ngoại
      lệ kiểm tra làm phần tiền vừa trừ ở tài khoản nguồn vẫn bị chốt xuống đĩa dù tài khoản đích chưa hề được cộng. Gọi chéo
      hai hàm nằm trong cùng một lớp khiến lớp bọc không chặn được, nên mọi cấu hình mở phiên mới đều mất hiệu lực. Cuối cùng,
      tiêm phụ thuộc thẳng lên trường che giấu độ phình của lớp và làm khó bước kiểm thử không dùng khung. Hãy bỏ thói quen
      gắn chú thích tiêm trực tiếp lên biến thành viên vì chỉ một hàm dựng tường minh đã đủ giúp Spring tự động tiêm sạch.
      Tách lớp nhỏ theo đúng trách nhiệm nghiệp vụ còn giúp mã nguồn sáng sủa và dễ viết kiểm thử độc lập hơn nhiều.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh lan truyền và hoàn tác giao dịch
  checks:
  - alg.spb_tx_connections(10, True) == (2, 20)
  steps:
  - show: <ol><li>Nếu đặt phương thức <code>record()</code> đánh dấu <code>REQUIRES_NEW</code> ngay bên trong lớp <code>TransferService</code>
      rồi gọi <code>this.record()</code>, nhật ký có được giữ lại khi giao dịch chính quay lui không?</li><li>Tại sao ngoại
      lệ kiểm tra kế thừa <code>Exception</code> cần ghi rõ <code>rollbackFor</code>?</li></ol>
    say: Hãy tự kiểm hiểu hai câu hỏi tình huống quen gặp khi phỏng vấn Spring. Câu một, nếu đặt hàm ghi nhật ký tạo phiên
      mới trong cùng lớp và gọi nội bộ, bản ghi có sống sót khi giao dịch chính hoàn tác không? Câu hai, vì sao ta phải khai
      báo thêm thuộc tính hoàn tác cho ngoại lệ kiểm tra? Bấm tạm dừng và trả lời. Đây là hai câu hỏi kinh điển kiểm tra xem
      bạn có hiểu bản chất hoạt động của lớp vỏ giao dịch Spring hay không.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <b>Không.</b> Lời gọi <code>this.record()</code> đi
      thẳng không qua proxy của Spring nên chạy chung giao dịch với hàm gọi và bị cuốn trôi khi hoàn tác.</p></td></tr></table>
    say: 'Đáp án câu một: không sống sót vì lời gọi nội bộ đi xuyên thẳng không qua lớp vỏ trung gian, nên vẫn chạy chung
      trong giao dịch gốc. Cách sửa triệt để là tách hàm ghi nhật ký sang một lớp dịch vụ riêng biệt rồi tiêm qua hàm dựng.
      Khi đó, mọi lời gọi đều đi qua lớp vỏ trung gian của dịch vụ kia và mở đúng phiên giao dịch độc lập.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Vì theo quy ước mặc định của Spring, khung chỉ tự hoàn
      tác cho ngoại lệ chưa kiểm tra (<code>RuntimeException</code>) và bỏ qua checked exception trừ khi khai báo <code>rollbackFor</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: quy ước mặc định của khung chỉ quay lui với ngoại lệ thời gian chạy, nên ngoại lệ kiểm tra đòi hỏi
      phải chỉ rõ tên lớp hoàn tác. Trong nghiệp vụ ngân hàng, các ngoại lệ kiểm tra như thiếu số dư thường gắn kèm hoàn tác
      rõ ràng ngay trên chú thích giao dịch. Nhờ vậy bất kỳ nhánh thất bại nghiệp vụ nào cũng trả lại toàn bộ thay đổi dở
      dang về trạng thái an toàn ban đầu.'
    clear: true
