- id: quymo
  kind: example
  title: Thời gian bộ kiểm thử ở 10, 200 và 2 000 ca đơn vị so tích hợp
  checks:
  - alg.spb_test_pyramid_ms(10, 1) == 2050
  - alg.spb_test_pyramid_ms(200, 1) == 3000
  - alg.spb_test_pyramid_ms(2000, 5) == 20000
  steps:
  - show: <table class='t'><tr><th>quy mô bộ kiểm thử</th><th>chỉ viết Unit Test (5 ms/ca) + ít IT</th><th>viết toàn bộ bằng
      @SpringBootTest nặng (~2 s/ca)</th></tr><tr><td><b>10 ca đơn vị</b> + 1 IT</td><td>~2,05 giây</td><td>~20 giây (nếu
      tạo nhiều ngữ cảnh khác nhau)</td></tr><tr><td><b>200 ca đơn vị</b> + 1 IT</td><td><b>~3,0 giây</b></td><td>~6–7 phút
      mỗi lần kiểm cục bộ</td></tr><tr><td><b>2 000 ca đơn vị</b> + 5 IT</td><td><b>~20 giây</b> cho toàn dự án</td><td>Hơn
      1 giờ — lập trình viên bỏ chạy test trước khi commit!</td></tr></table>
    say: Bảng quy mô cho thấy lý do mọi dự án lớn phải giữ chặt hình tháp kiểm thử ở các mốc mười, hai trăm và hai nghìn ca.
      Khi chạy hai trăm ca đơn vị kèm một lớp tích hợp nhỏ, phản hồi chỉ mất ba giây. Với hai nghìn ca nghiệp vụ, chạy đơn
