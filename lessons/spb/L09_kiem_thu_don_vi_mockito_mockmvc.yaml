scenes:
- id: hook
  kind: hook
  title: Mỗi thay đổi nhỏ phải đợi 45 giây bật Postgres, Redis và Kafka?
  checks:
  - alg.spb_test_pyramid_ms(100, 0) < alg.spb_test_pyramid_ms(0, 5)
  steps:
  - show: '<div class=''box key''><p>Nếu bạn chỉ dùng <code>@SpringBootTest</code> gắn cả ba container thật cho mọi phép thử
      logic cộng trừ đơn giản, bộ kiểm thử sớm phình lên hàng chục phút và khiến cả đội ngại chạy test trước khi gửi mã.</p><p>Giải
      pháp chuẩn: <b>Tháp kiểm thử (Test Pyramid)</b> gồm hàng trăm bài <b>JUnit 5 + Mockito</b> chạy trong vài mili-giây
      và lát cắt <b><code>@WebMvcTest</code> + <code>@MockitoBean</code></b> cho tầng HTTP.</p></div>'
    say: Chào bạn đến với bài chín của khoá Spring Boot thực chiến. Một bộ kiểm thử chạy quá chậm thường bị lập trình viên
      bỏ qua không chạy trên máy cá nhân trước khi đẩy mã lên kho. Thay vì việc nhỏ nào cũng bật container nặng, kỹ sư chia
      tháp kiểm thử từ tầng đơn vị cô lập chạy nháy mắt lên tới lát cắt web. Bài hôm nay hướng dẫn bạn cài đặt nhuần nhuyễn
      JUnit năm, Mockito và bộ kiểm MockMvc mới của Spring Boot bốn chấm một. Một tháp kiểm thử cân đối đặt phần lớn ca kiểm
      logic vào kiểm thử đơn vị siêu nhanh chạy tức thì trong máy ảo Java. Lớp điều khiển web chỉ cần kiểm thử lát cắt để
      xác minh chuyển đổi JSON và mã lỗi mà không kéo theo cơ sở dữ liệu.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: kiểm thử đơn vị cô lập và lát cắt Spring Boot'
  steps:
  - show: <table class='t'><tr><th>loại bài kiểm thử</th><th>những gì được khởi chạy</th></tr><tr><td>Đơn vị thuần (Unit Test)</td><td>Chỉ
      chạy 1 lớp Java thuần, mọi phụ thuộc thay bằng đối tượng giả <code>@Mock</code></td></tr><tr><td>Lát cắt web (<code>@WebMvcTest</code>)</td><td>Chỉ
      khởi tạo bộ điều khiển, JSON, Validation và bảo mật; không mở DB</td></tr><tr><td>Toàn cụm (<code>@SpringBootTest</code>)</td><td>Nạp
      trọn ứng dụng thật và các container thật ở bước chốt tích hợp</td></tr></table>
    say: Hãy ôn ngắn gọn ba tầng của tháp kiểm thử trong một dự án Spring Boot hiện đại. Ở đáy tháp, bài kiểm đơn vị chỉ tạo
      duy nhất một lớp nghiệp vụ trong bộ nhớ RAM và thay toàn bộ cổng kết nối ngoài bằng các đối tượng giả lập điều khiển
      được. Lên giữa tháp, lát cắt web chỉ dựng riêng tầng điều khiển, kiểm dữ liệu vào và bộ chuyển đổi JSON nên chạy rất
      nhẹ. Đỉnh tháp mới là lúc nối toàn bộ ứng dụng với cơ sở dữ liệu và container thật. Việc thay phụ thuộc bằng đối tượng
      giả lập giúp kiểm thử cô lập không phụ thuộc mạng, ổ đĩa hay trạng thái môi trường bên ngoài. Mỗi lớp trong tháp kiểm
      thử phụ trách một rủi ro riêng biệt nhằm tránh lặp lại thử nghiệm cồng kềnh cùng một hành vi.
    focus:
