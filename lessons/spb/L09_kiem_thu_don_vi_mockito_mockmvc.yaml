  title: Ba sai lầm làm bộ kiểm thử giả xanh hoặc gãy trên Spring Boot 4
  steps:
  - show: <table class='t'><tr><th>bẫy kiểm thử đơn vị và MockMvc hay gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1
      — Dùng lại <code>@MockBean</code> của Boot 3 trên Spring Boot 4.1:</b> Không biên dịch được! Phải chuyển sang <code>org.springframework.test.context.bean.override.mockito.MockitoBean</code>.<br><b>Lỗi
      2 — Viết test phụ thuộc chi tiết giả lập quá mức (stub mọi hàm nội bộ) mà bỏ qua test tích hợp thật:</b> Test vẫn xanh
      dù câu SQL hoặc cấu hình Security đã hỏng!<br><b>Lỗi 3 — Dùng <code>@WebMvcTest</code> sai gói nhập khẩu:</b> Trên Boot
      4 nằm ở <code>org.springframework.boot.webmvc.test.autoconfigure.WebMvcTest</code>.</div></td></tr></table>
    say: Ba lỗi trên bảng đều rất thực tế khi chuyển dự án sang Spring Boot đời bốn và khi thiết kế ca kiểm. Hai lỗi đầu và
      cuối là nhầm tên gói và chú thích mới của Boot bốn khiến mã kiểm thử không biên dịch nổi. Lỗi ở giữa tinh vi hơn là
      lạm dụng giả lập tràn lan khiến bài kiểm tự đánh lừa khi câu truy vấn SQL hay cấu hình bảo mật thật đã hỏng. Khi nâng
      cấp các dự án Boot ba lên Boot bốn, việc tìm thay thế toàn bộ chú thích giả lập hạt đậu cũ là thao tác đầu tiên cần
      làm. Ngoài ra hãy giữ mỗi ca kiểm thử đơn vị tập trung xác minh một hành vi rõ ràng để dễ đọc hiểu khi bảo trì về sau.
