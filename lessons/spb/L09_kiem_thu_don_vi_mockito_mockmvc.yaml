- id: intuition
  kind: intuition
  title: Tách biệt kiểm thử hành vi và kiểm thử hợp đồng HTTP không cần DB
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="30" y="35" width="415" height="145" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="237.5" y="70" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">1.
      Unit Test (MockitoExtension, ~5 ms/ca)</text><text x="237.5" y="102" font-size="14" text-anchor="middle" fill="#475569">Mock
      AccountGateway &amp; AlertPort</text><text x="237.5" y="128" font-size="14" text-anchor="middle" fill="#475569">Kiểm
      thiếu số dư → never().debit(...)</text><text x="237.5" y="154" font-size="14" text-anchor="middle" fill="#475569">Kiểm
      InOrder: balanceOf → debit → credit → sent</text><rect x="495" y="35" width="435" height="145" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="712.5" y="70" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">2.
      Web Slice (@WebMvcTest + MockMvc, ~0,8 s)</text><text x="712.5" y="102" font-size="14" text-anchor="middle" fill="#475569">@MockitoBean
      UnitTransferService</text><text x="712.5" y="128" font-size="14" text-anchor="middle" fill="#475569">Kiểm @Valid từ
      chối JSON sai → HTTP 400</text><text x="712.5" y="154" font-size="14" text-anchor="middle" fill="#475569">Kiểm hợp lệ
      → HTTP 201 và cấu trúc JSON</text></svg></div>'
    say: Quan sát hai tầng kiểm thử nằm bên cạnh nhau nhưng không đụng vào bất kỳ cơ sở dữ liệu nào. Bên trái là kiểm thử đơn
      vị chạy hoàn toàn trong máy ảo Java không nạp khung Spring nên mỗi ca chỉ mất vài mi-li-giây. Tại đây ta kiểm định
      chặt thứ tự gọi hàm và nhánh ngoại lệ thiếu tiền.
    clear: true
  - show: ''
    say: Bên phải là lát cắt web thử khả năng giải mã JSON, kiểm ràng buộc đầu vào và định dạng mã trạng thái HTTP trả về.
      Bằng cách tách rõ ranh giới giữa logic nghiệp vụ thuần túy và lớp biên giao tiếp web, bạn phát hiện lỗi sai ngay khi
      đang gõ mã. Các kiểm thử đơn vị chạy dưới một giây khuyến khích lập trình viên chạy kiểm tra liên tục trước mỗi bước
      thay đổi nhỏ.
- id: formula
  kind: formula
  title: Nguyên tắc kiểm thử dựa trên hành vi và chi phí tháp kiểm thử
  checks:
  - alg.spb_test_pyramid_ms(200, 1) == 3000
  steps:
  - show: <div class='box key'><p><b>Mô hình tính tổng thời gian phản hồi bộ kiểm:</b> $T = N_{\text{unit}} \cdot 5\text{
      ms} + N_{\text{IT}} \cdot 2000\text{ ms}$.</p><p>Với <b>200 ca đơn vị</b> (1 000 ms) + <b>1 lát cắt/tích hợp nhẹ</b>
      (2 000 ms), toàn bộ phản hồi hoàn tất đúng <b>3 000 ms (3 giây)</b>.</p><p><b>Kỷ luật đặt giả lập:</b> chỉ mock ranh
      giới giao tiếp ngoài (Port/Gateway); không viết giả lập cho những quy tắc SQL thật cần cơ sở dữ liệu kiểm ở tầng tích
      hợp.</p></div>
    say: Công thức cộng thời gian giúp ta nhìn ngay được lợi thế tốc độ của hình tháp kiểm thử chuẩn. Hai trăm ca đơn vị chạy
      năm mi-li-giây một ca chỉ tốn một giây, cộng thêm hai giây cho phần khung web vẫn giữ tổng thời gian dưới ba giây. Ta
      cũng luôn nhớ chỉ giả lập ở cổng giao tiếp ranh giới vì những câu SQL thật hay cấu hình bảo mật cần được kiểm chứng
      thật ở tầng tích hợp. Khi chi phí chờ bộ kiểm giảm từ vài phút xuống vài giây, chu trình sửa lỗi và kiểm chứng của cả
      nhóm tăng tốc gấp nhiều lần. Tuy nhiên tuyệt đối không thay thế mọi kiểm thử tích hợp bằng giả lập vì chỉ thùng chứa
      thật mới bắt được lỗi câu lệnh SQL.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
    introduces:
    - cdot
- id: example
  kind: example
  title: 'Mã thật: Mockito InOrder / never() và @WebMvcTest dùng @MockitoBean'
  checks:
  - 500_000 > 100_000
  steps:
  - show: <p><b>1. Unit test kiểm tra thiếu số dư và thứ tự InOrder</b></p><div class="code"><div>@ExtendWith(MockitoExtension.class)
      class UnitTransferServiceTest {</div><div>  @Mock AccountGateway accounts; @Mock AlertPort alerts; @InjectMocks UnitTransferService
      service;</div><div>  @Test void insufficientNeverDebits() {</div><div>    when(accounts.balanceOf("A")).thenReturn(50_000L);</div><div>    assertThrows(IllegalStateException.class,
      () -&gt; service.execute("A", "B", 200_000L));</div><div>    verify(accounts, never()).debit("A", 200_000L);</div><div>  }</div><div>  @Test
      void strictOrder() {</div><div>    when(accounts.balanceOf("A")).thenReturn(500_000L); service.execute("A", "B", 100_000L);</div><div>    InOrder
      o = inOrder(accounts, alerts);</div><div>    o.verify(accounts).balanceOf("A"); o.verify(accounts).debit("A", 100_000L);</div><div>    o.verify(accounts).credit("B",
      100_000L); o.verify(alerts).sent("A", "B", 100_000L);</div><div>} }</div></div>
    say: Xem hai ca kiểm thử ngắn gọn nhưng chặt chẽ bằng Mockito trên màn hình. Ca đầu giả lập số dư năm mươi nghìn đồng
      khi lệnh đòi rút hai trăm nghìn, khẳng định hàm ném ngoại lệ mà không trừ tiền hay gửi tin. Ca thứ hai bắt buộc trình
      kiểm tra thứ tự thực thi xác nhận bước kiểm số dư chạy trước bước trừ nguồn, cộng đích rồi mới gửi thông báo. Bộ kiểm
      dịch vụ chứng minh không cần khởi tạo khung Spring vẫn thử nghiệm chặt chẽ từng nhánh ngoại lệ và trình tự gọi cổng.
      Nếu bất kỳ bước nào gọi sai thứ tự như gửi thông báo trước khi cộng tài khoản đích thì kiểm thử thứ tự lập tức báo hỏng.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>2. Lát cắt @WebMvcTest với @MockitoBean (chuẩn Spring Boot 4)</b></p><div class="code"><div>@WebMvcTest(UnitTransferController.class)</div><div>class
      UnitTransferWebTest {</div><div>  @Autowired MockMvc mvc;</div><div>  @MockitoBean UnitTransferService service;</div><div>  @Test
      void returns201AndRejectsInvalid400() throws Exception {</div><div>    when(service.execute("A", "B", 50_000L)).thenReturn("OK:A-&gt;B:50000");</div><div>    mvc.perform(post("/api/v1/unit-transfers").contentType(APPLICATION_JSON)</div><div>      .content("{\"fromId\":\"A\",\"toId\":\"B\",\"amount\":50000}"))</div><div>      .andExpect(status().isCreated()).andExpect(jsonPath("$.receipt").value("OK:A-&gt;B:50000"));</div><div>    mvc.perform(post("/api/v1/unit-transfers").contentType(APPLICATION_JSON)</div><div>      .content("{\"fromId\":\"\",\"toId\":\"B\",\"amount\":-5}"))</div><div>      .andExpect(status().isBadRequest());</div><div>  }</div><div>}</div></div>
    say: Sang lớp kiểm thử tầng web bên dưới, ta chỉ nạp đúng một bộ điều khiển mục tiêu và thay thế dịch vụ lõi bằng hạt
      đậu giả lập MockitoBean mới của Boot bốn. Nhờ vậy bộ kiểm MockMvc chạy xong trong nháy mắt để kiểm chứng cả kịch bản
      hai trăm linh một hợp lệ lẫn kịch bản bốn trăm khi thiếu tài khoản hoặc số tiền âm. Lớp điều khiển chuyển khoản đơn
      vị chỉ giữ phụ thuộc dịch vụ tối thiểu để mở đầu cuối tạo giao dịch, kẹp kiểm dữ liệu đầu vào hợp lệ. Khi kiểm bằng
      MockMvc, khung web tự động kích hoạt bộ giải mã JSON và kiểm tra hợp lệ hệt như khi chạy ứng dụng hoàn chỉnh.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật Boot 4.1.3: Mockito + @WebMvcTest đều xanh tốc độ cao'
  checks:
  - alg.spb_test_pyramid_ms(2, 2) == 4010
  steps:
  - show: '<p><b>Kết quả chạy thật bộ kiểm KiemL09UnitTest và KiemL09WebTest</b></p><div class="code"><div>// KiemL09UnitTest
      (MockitoExtension):</div><div>//   - insufficientBalanceNeverDebitsOrAlerts() → PASS</div><div>//   - happyPathVerifiesStrictOrder()
      → PASS</div><div>// KiemL09WebTest (@WebMvcTest + @MockitoBean):</div><div>//   - webSliceReturns201FromMockService()
      → PASS</div><div>//   - invalidPayloadRejectedAtWebSlice() → PASS</div><div>KiemL09UnitTest: 2 ca, 0 hỏng | KiemL09WebTest:
      2 ca, 0 hỏng</div></div>'
    say: Kết quả chạy thật bộ kiểm nghiệm thu xác nhận cả phần đơn vị dịch vụ lẫn hợp đồng HTTP trên MockMvc đều xanh sạch.
      Hai ca đơn vị bắt được đúng hành vi không trừ tiền khi thiếu số dư và kiểm chặt thứ tự gọi hàm vì đã ghép bộ kiểm InOrder.
      Hai ca lát cắt web khẳng định chức năng kiểm dữ liệu vào và mã phản hồi JSON chạy chuẩn mà không cần bật bất kỳ cơ sở
      dữ liệu nào. Thời gian chạy cả hai lớp kiểm thử đơn vị và lát cắt web chỉ tính bằng vài giây ngắn ngủi thay vì hàng
      chục giây chờ Docker. Bốn kịch bản đạt chuẩn chứng tỏ hợp đồng điều khiển và quy tắc nghiệp vụ cốt lõi đều tách bạch
      sạch sẽ.
