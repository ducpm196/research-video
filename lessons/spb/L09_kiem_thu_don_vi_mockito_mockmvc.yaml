- id: sym
  kind: symbol
  title: Bộ công cụ JUnit 5, Mockito và đổi mới @MockitoBean trên Boot 4
  steps:
  - show: '<table class=''t''><tr><th>chú thích / hàm xác minh</th><th>vai trò trong kiểm thử cô lập</th></tr><tr><td><code>@Mock</code>
      + <code>@InjectMocks</code></td><td>Tạo giả lập cổng phụ thuộc và tự tiêm vào hàm dựng dịch vụ</td></tr><tr><td><code>verify(...,
      never())</code></td><td>Chứng minh một hàm nguy hiểm (như trừ tiền) tuyệt đối không bị gọi</td></tr><tr><td><code>InOrder
      ord = inOrder(...)</code></td><td>Kiểm soát đúng thứ tự thực thi: đọc số dư → trừ tiền → cộng tiền → báo tin</td></tr><tr><td><code>@WebMvcTest</code>
      + <code>@MockitoBean</code></td><td>Gói mới Boot 4 thay thế <code>@MockBean</code> đã bỏ từ Spring Boot 3.4/4.0</td></tr></table>'
    say: Bảng này giải thích bốn công cụ chính bạn sẽ viết hằng ngày khi kiểm thử dịch vụ Spring Boot bốn. Hai chú thích đầu
      giúp tạo giả lập tự động và tiêm thẳng vào hàm dựng của lớp cần kiểm mà không cần bật khung Spring. Hàm xác minh không
      bao giờ được gọi cực kỳ quan trọng trong tài chính vì giúp khẳng định khi thiếu tiền thì tuyệt đối không phát sinh lệnh
      trừ tiền. Cuối cùng, trên Boot đời bốn, lớp điều khiển web thử nghiệm dùng chú thích MockitoBean mới thay thế hoàn toàn
      cho tên cũ đã bị loại bỏ. Đặc biệt chú ý sự thay đổi tên chú thích giả lập trong hệ sinh thái Boot bốn giúp mã kiểm
      thử web giữ sạch cảnh báo lỗi thời. Bộ kiểm tra thứ tự thực thi biến những cam kết tuần tự nhạy cảm trong giao dịch
      tiền tệ thành bài kiểm tự động lặp lại được.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.4'
    - '1.1'
    - '1.4'
