- id: sym
  kind: symbol
  title: Cấu trúc Dockerfile nhiều tầng và các cờ JVM trong container
  steps:
  - show: <table class='t'><tr><th>chỉ thị / cờ vận hành</th><th>tác dụng khi đưa lên Kubernetes / Docker</th></tr><tr><td><code>FROM
      ...jdk-alpine AS builder</code> → <code>FROM ...jre-alpine</code></td><td>Chỉ chép tệp <code>app.jar</code> sang ảnh
      JRE sạch, bỏ mã nguồn và <code>.m2</code></td></tr><tr><td><code>adduser</code> + <code>USER app</code></td><td>Không
      chạy tiến trình Java bằng quyền tối cao <code>root</code> (bảo mật container)</td></tr><tr><td><code>-XX:MaxRAMPercentage=75.0</code></td><td>Giới
      hạn vùng Heap ở 75% RAM container (ví dụ 384 MiB trên khung 512 MiB)</td></tr><tr><td><code>-XX:+ExitOnOutOfMemoryError</code></td><td>Thoát
      sạch ngay khi tràn Heap để điều phối viên khởi động lại kịp thời</td></tr></table>
    say: Bảng này tổng hợp bốn thiết lập bắt buộc trên ảnh container Spring Boot ngoài đời thực. Kỹ thuật đóng gói nhiều tầng
      tách hẳn giai đoạn biên dịch JDK ra khỏi ảnh chạy JRE cuối cùng chỉ mang theo duy nhất gói chương trình đã đóng. Luôn
      tạo người dùng không có quyền quản trị tối cao để giảm thiểu thiệt hại nếu ứng dụng bị chiếm quyền. Hai cờ bộ nhớ giúp
      máy ảo JVM chừa đủ hai mươi lăm phần trăm bộ nhớ container cho các vùng ngoài Heap và thoát dứt khoát khi gặp tràn bộ
      nhớ thay vì treo lơ lửng. Loại bỏ các công cụ biên dịch khỏi ảnh sản xuất khiến kẻ xấu khó tải mã độc hay biên dịch
      thêm công cụ ngay bên trong container. Nhờ cờ thoát ngay khi cạn bộ nhớ vùng Heap, bộ điều phối biết chính xác trạng
      thái hỏng để khởi động bản sao mới sạch sẽ.
