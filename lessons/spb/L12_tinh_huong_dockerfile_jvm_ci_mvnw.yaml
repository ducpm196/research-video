    say: Quan sát dây chuyền đóng gói hoàn chỉnh từ kho mã nguồn ra tới ảnh chạy sản xuất gọn nhẹ. Khi mã được đẩy lên, máy
      chủ tích hợp chạy toàn bộ bộ kiểm đơn vị và tích hợp trước khi cho phép đóng ảnh. Ở tầng dựng thứ nhất dùng JDK để
      tải thư viện theo lớp đệm trước rồi mới biên dịch ra tệp chương trình duy nhất.
