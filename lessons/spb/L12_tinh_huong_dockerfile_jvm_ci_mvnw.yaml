      trì. Phương án ảnh siêu nhỏ hay biên dịch bản địa giảm kích thước và thời gian bật hơn nữa nhưng kéo dài thời gian biên
      dịch trên máy chủ tích hợp. Trong thực tế triển khai nhiều dịch vụ vi mô, chuẩn hoá một tệp đóng gói hai tầng JRE kèm
      người dùng thường là cân bằng tối ưu nhất. Cách tiếp cận này vừa nhẹ gọn khi kéo ảnh triển khai hàng loạt vừa giữ nguyên
