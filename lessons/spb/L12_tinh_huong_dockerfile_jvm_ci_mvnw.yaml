  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>2 048 × 0,75 = <b>1 536 MiB</b></code> (để dành
      512 MiB cho Metaspace, luồng và hệ thống).</p></td></tr></table>
    say: 'Đáp án câu một: lấy hai nghìn không trăm bốn mươi tám nhân bảy mươi lăm phần trăm bằng một nghìn năm trăm ba mươi
      sáu mê-bi-bai cho vùng Heap. Nhờ dùng tỉ lệ phần trăm thay cho giá trị cố định, cùng một ảnh container có thể chạy linh
      hoạt từ môi trường thử nghiệm tới sản xuất. Phần năm trăm mười hai mê-bi-bai dự phòng còn lại bảo vệ đủ chỗ cho không
      gian siêu dữ liệu lớp và các luồng xử lý mạng.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Để tận dụng lớp đệm cache Docker cho tầng thư viện Maven;
      khi chỉ sửa mã nguồn Java, các tầng trước không phải tải lại.</p></td></tr></table>
    say: 'Đáp án câu hai: nhằm giữ lại tầng đệm thư viện của Docker mỗi khi lập trình viên chỉ chỉnh sửa tệp mã nguồn mà không
      đổi phụ thuộc. Sắp xếp các lớp ít thay đổi lên trên và lớp mã nguồn thay đổi thường xuyên xuống dưới là nguyên tắc vàng
      khi viết tệp đóng gói. Nhờ vậy tốc độ dựng ảnh trên máy cá nhân và máy chủ tích hợp được rút ngắn đáng kể.'
