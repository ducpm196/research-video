  kind: quiz
  title: Kiểm tra nhanh đóng gói Docker nhiều tầng và JVM trong container
  checks:
  - alg.spb_jvm_heap_mib(2048, 75.0) == 1536.0
  steps:
  - show: <ol><li>Một container Spring Boot được cấp giới hạn RAM <b>2 048 MiB</b> với cờ <code>-XX:MaxRAMPercentage=75.0</code>.
      Vùng Heap tối đa được phép dùng là bao nhiêu MiB?</li><li>Trong <code>Dockerfile</code> nhiều tầng, vì sao ta nên <code>COPY
      pom.xml</code> và tải phụ thuộc trước khi <code>COPY src src</code>?</li></ol>
    say: Hãy tự kiểm nhanh hai câu hỏi thực chiến trước bài thực hành tổng kết. Câu một, một thùng chứa có giới hạn bộ nhớ
      hai nghìn không trăm bốn mươi tám mê-bi-bai chạy cờ phần trăm RAM tối đa bảy mươi lăm thì vùng Heap tối đa là bao nhiêu?
      Câu hai, tại sao trong tệp đóng gói nhiều tầng ta chép tệp cấu hình phụ thuộc trước rồi mới chép mã nguồn? Bấm tạm dừng
      và trả lời. Hai câu hỏi cuối khoá giúp bạn củng cố công thức chia ngân sách bộ nhớ và mẹo tối ưu tầng đệm ảnh Docker.
