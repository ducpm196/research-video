- id: example
  kind: example
  title: 'Tệp thật: Dockerfile nhiều tầng và GitHub Actions CI chạy ./mvnw -B verify'
  checks:
  - 850 - 260 == 590
  steps:
  - show: <p><b>1. Dockerfile nhiều tầng tách builder JDK và runtime JRE non-root</b></p><div class="code"><div>FROM eclipse-temurin:21-jdk-alpine
      AS builder</div><div>WORKDIR /app</div><div>COPY mvnw pom.xml ./</div><div>COPY .mvn .mvn</div><div>RUN chmod +x mvnw
      &amp;&amp; ./mvnw -B dependency:go-offline</div><div>COPY src src</div><div>RUN ./mvnw -B package -DskipTests</div><div>FROM
      eclipse-temurin:21-jre-alpine</div><div>WORKDIR /app</div><div>RUN addgroup -S app &amp;&amp; adduser -S app -G app</div><div>USER
      app</div><div>COPY --from=builder /app/target/*.jar app.jar</div><div>ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75.0",
      "-XX:+ExitOnOutOfMemoryError", "-jar", "app.jar"]</div></div>
    say: Hãy đọc từng lớp trong tệp đóng gói chuẩn này vì thứ tự các dòng quyết định tốc độ xây dựng lại ảnh. Ta chép tệp
      phụ thuộc tải trước khi chép mã nguồn vì như thế khi sửa Java mà không đổi phụ thuộc thì Docker dùng lại tầng đệm sẵn.
      Sang tầng thứ hai trên nền JRE nhẹ, ta tạo tài khoản người dùng thường, chuyển sang quyền hạn thấp rồi mới khởi chạy
      cùng cờ giới hạn phần trăm RAM. Chú ý tham số chạy chế độ không tương tác trên đường ống dựng giúp giảm bớt nhật ký
      tiến độ rườm rà khi chạy tự động. Việc chỉ sao chép duy nhất tệp chương trình đã đóng từ tầng dựng giữ cho ảnh chạy
      cuối cùng cực kỳ tinh gọn và dễ kiểm soát.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>2. Cấu hình đường ống CI (.github/workflows/ci.yml) + đầu cuối runtime</b></p><div class="code"><div>name:
      spb-ci</div><div>on: [push]</div><div>jobs:</div><div>  verify:</div><div>    runs-on: ubuntu-latest</div><div>    steps:</div><div>      -
      uses: actions/checkout@v4</div><div>      - uses: actions/setup-java@v4</div><div>        with: { distribution: temurin,
      java-version: ''21'', cache: maven }</div><div>      - run: ./mvnw -B verify</div></div>'
    say: Tệp cấu hình tích hợp liên tục bên dưới nối thẳng kho mã nguồn vào bước kiểm tra tự động mỗi khi có thay đổi mới.
      Công cụ dựng thiết lập đúng phiên bản Java hai mươi mốt kèm bộ đệm Maven và thực thi lệnh dựng kiểm toàn bộ bao gồm
      cả các bài kiểm thử thùng chứa. Cũng nhớ khai báo bật bộ đệm thư viện Maven trong cấu hình hành động để các lượt chạy
      đường ống tiếp theo hoàn thành nhanh chóng. Đầu cuối thông số chạy trả về ngưỡng bộ nhớ thực đo giúp giám sát và kiểm
      chứng trực tiếp giá trị JVM vừa thiết lập.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
