- id: prereq
  kind: prereq
  title: 'Ôn nhanh: ảnh container nhiều lớp, JRE vs JDK và đường ống CI'
  steps:
  - show: <table class='t'><tr><th>khái niệm triển khai</th><th>khác biệt thực tế</th></tr><tr><td><b>JDK</b> vs <b>JRE</b></td><td>JDK
      có trình biên dịch javac (~300+ MB); môi trường chạy chỉ cần JRE</td></tr><tr><td><b>Bộ nhớ container cgroup</b></td><td>Container
      512 MiB gồm cả Heap, Metaspace, stack luồng và native OS</td></tr><tr><td><b>Đường ống CI</b> (<code>./mvnw -B verify</code>)</td><td>Tự
      chạy kiểm thử đơn vị và tích hợp trên mọi lần đẩy mã mới</td></tr></table>
    say: Hãy điểm lại ngắn gọn ba khái niệm hạ tầng cốt lõi trước khi thiết kế cấu hình phát hành chuẩn. Bộ phát triển JDK
      chứa trình biên dịch chỉ cần lúc dựng, còn khi chạy thật chỉ cần môi trường thực thi JRE gọn nhẹ hơn nhiều. Bộ nhớ cấp
      cho một thùng chứa Docker phải đủ chia cho cả vùng Heap lẫn bộ nhớ ngăn xếp luồng và siêu dữ liệu ngoài Heap. Đường
      ống tích hợp liên tục là chốt gác tự động buộc mọi thay đổi đều phải vượt qua lệnh dựng kiểm trước khi ra ảnh mới. Trong
      hệ thống điều phối container, tiến trình chính luôn chịu sự giám sát chặt của giới hạn giới hạn tài nguyên do nhân hệ
      điều hành chuẩn áp đặt. Nếu kích thước máy ảo vượt trần chỉ một mê-ga-bai, nhân hệ điều hành sẽ chấm dứt container lập
      tức mà không chờ thu gom rác.
