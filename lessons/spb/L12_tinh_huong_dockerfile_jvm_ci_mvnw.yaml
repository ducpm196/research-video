scenes:
- id: hook
  kind: hook
  title: Ảnh cả JDK 850 MB làm container 512 MiB bị giết vì hết RAM?
  checks:
  - alg.spb_jvm_heap_mib(512, 75.0) == 384.0
  steps:
  - show: '<div class=''box key''><p>Rất nhiều đội đóng gói toàn bộ bộ phát triển JDK, thư mục <code>.m2</code> và mã nguồn
      thô vào một ảnh Docker nặng hơn <b>850 MB</b> rồi chạy trần <code>java -jar app.jar</code> bên trong container giới
      hạn 512 MiB RAM.</p><p>Kết quả: máy chạy chậm vì tải ảnh lớn, phơi bày công cụ biên dịch trong sản xuất và bùng lỗi
      <code>OOMKilled</code> khi tải tăng. Bài tình huống chuyên gia này khoá gọn toàn bộ chuỗi bằng <b>Dockerfile nhiều tầng
      + JRE + MaxRAMPercentage + CI tự động</b>.</p></div>'
    say: Chào bạn đến với bài mười hai, bài tình huống chuyên gia tổng kết toàn bộ khoá Spring Boot thực chiến. Sau khi hoàn
      chỉnh dịch vụ chuyển khoản từ HTTP qua cơ sở dữ liệu, bộ đệm và sự kiện, chặng cuối cùng là đóng gói phát hành tự động.
      Nếu đóng gói thiếu chuẩn xác, ảnh container vừa cồng kềnh tốn băng thông lại dễ bị hệ điều hành giết đột ngột do vượt
      trần bộ nhớ. Hôm nay ta thiết kế tệp đóng gói nhiều tầng chuẩn mực, cấu hình máy ảo JVM hiểu đúng giới hạn RAM và dựng
      đường ống kiểm thử tự động. Đóng gói đúng cách không chỉ giúp tiết kiệm hàng trăm mê-ga-bai băng thông truyền tải mà
      còn thu hẹp tối đa bề mặt tấn công. Kết hợp tinh chỉnh phần trăm RAM và đường ống kiểm chứng tự động hoàn tất chu trình
      kỹ nghệ phần mềm chuyên nghiệp.
    focus:
