      RAM. Giai đoạn chạy đường ống kiểm thử đóng vai trò cánh cổng thép ngăn mọi bản lỗi lọt vào bước đóng ảnh container.
      Sự tách biệt rạch ròi giữa tầng dựng JDK và tầng chạy JRE gọn nhẹ giảm tới gần bảy mươi phần trăm kích thước tệp
      phát hành.
- id: formula
  kind: formula
  title: Cách tính ngân sách bộ nhớ JVM an toàn trong container cgroup
  checks:
  - alg.spb_jvm_heap_mib(512, 75.0) == 384.0
  - alg.spb_jvm_heap_mib(1024, 75.0) == 768.0
  - 512 - 384 == 128
  steps:
  - show: '<div class=''box key''><p><b>Ngân sách RAM trong container $M$ MiB với <code>-XX:MaxRAMPercentage=75.0</code>:</b></p><p>1.
      Vùng Heap tối đa: $H_{\max} = M \times 0,75$. Ở container <b>512 MiB</b> → Heap = <b>384 MiB</b>; ở <b>1 024 MiB</b>
      → Heap = <b>768 MiB</b>.</p><p>2. Phần 25% còn lại (<b>128 MiB</b> với khung 512 MiB) dành cho Metaspace, stack của
      các luồng Tomcat và bộ đệm ngoài Heap, tránh chạm trần cgroup gây <code>OOMKilled</code>.</p></div>'
    say: Công thức tính phần trăm RAM giải thích vì sao ta không bao giờ gán toàn bộ trăm phần trăm bộ nhớ container cho vùng
      Heap. Trên một thùng chứa năm trăm mười hai mê-bi-bai, bảy mươi lăm phần trăm tương ứng ba trăm tám mươi bốn mê-bi-bai
      cho vùng chứa đối tượng Java. Một trăm hai mươi tám mê-bi-bai còn lại là khoảng đệm an toàn cho bộ nhớ siêu dữ liệu
      lớp, ngăn xếp các luồng xử lý web và phần đệm trực tiếp của hệ điều hành. Khi mở rộng giới hạn bộ nhớ container lên
      mức lớn hơn, tỉ lệ bảy mươi lăm phần trăm tự động co giãn theo mà không cần sửa lại câu lệnh. Khoảng đệm hai mươi lăm
      phần trăm còn lại đóng vai trò van an toàn tránh chết đột ngột khi tải lưu lượng web tăng đỉnh điểm.
    focus:
