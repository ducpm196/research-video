  steps:
  - show: <table class='t'><tr><th>lỗi vận hành container Java hay gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 — Chép
      toàn bộ <code>COPY . .</code> trước khi chạy <code>dependency:go-offline</code>:</b> Mỗi lần sửa 1 dòng Java đều phá
      cache tầng Maven và tải lại từ đầu.<br><b>Lỗi 2 — Đặt cố định <code>-Xmx512m</code> bên trong container giới hạn 512
      MiB:</b> Không còn chỗ cho Metaspace và thread stack nên Linux OOM Killer giết container tức thì.<br><b>Lỗi 3 — Dùng
      nhãn <code>-XX:MaxRAMPercentage=75.0</code> nhưng chạy dưới quyền <code>USER root</code>:</b> Rủi ro leo thang đặc quyền
      nếu ứng dụng có lỗ hổng.</div></td></tr></table>
    say: Ba lỗi trên bảng đều thường xuyên gây sự cố trên môi trường chạy đám mây thực tế. Đặt lệnh chép toàn bộ mã nguồn
      lên trước bước tải thư viện khiến Docker phải tải lại hàng trăm gói phụ thuộc sau mỗi dòng sửa mã nhỏ. Đặt cứng vùng
      Heap bằng đúng giới hạn RAM của container bỏ quên phần bộ nhớ ngoài Heap nên nhân hệ điều hành sẽ giết tiến trình ngay
      lúc tăng tải. Cuối cùng, chạy ứng dụng bằng quyền quản trị gốc bên trong container đi ngược nguyên tắc tối thiểu đặc
      quyền. Cũng tránh bỏ quên câu lệnh cấp quyền thực thi cho tệp bao bọc Maven trên hệ điều hành chuẩn để không phát sinh
      lỗi từ chối truy cập trên CI. Kiểm tra trước các cờ máy ảo và người dùng không phải quản trị giúp dịch vụ vận hành bền
      bỉ trên mọi cụm cụm điều phối.
