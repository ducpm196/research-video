    say: Khi bộ dựng báo thành công cùng với dịch vụ container Docker đang bật, máy bạn đã đủ điều kiện cho cả chuỗi thực
      hành ngân hàng. Thứ tự chạy tuần tự này giúp cô lập lỗi ngay tại từng công đoạn thay vì dồn hết sang bước triển khai
      cuối. Bạn có thể kiểm tra từng mắt xích từ trình biên dịch, tệp bao bọc tới bộ chứa ngay trên dòng lệnh chuẩn.
- id: formula
  kind: formula
  title: Nguyên tắc ghim phiên bản tái lập (D-11 / VERSIONS.md)
  checks:
  - 2027 - 2026 >= 1
  - 1 + 12 == 13
  steps:
  - show: <div class='box key'><p>Tại sao chọn <b>Spring Boot 4.1.3</b> và <b>Docker digest cố định</b>?</p><p>1. Nhánh <code>4.1.x</code>
      có hạn hỗ trợ mã nguồn mở tới <code>2027-07-31</code> và đã qua bản vá <code>4.1.3</code> (ổn định hơn bản <code>.0</code>
      mới tinh).</p><p>2. Mọi bài <code>L00 → L12</code> kế thừa cùng một gốc gói <code>vn.nganhang.chuyenkhoan</code> và
      ghim ảnh Docker bằng <code>@sha256:...</code> trong <code>labs/SPB/VERSIONS.md</code>.</p></div>
    say: Hai nguyên tắc ghim phiên bản giúp bài thực hành của bạn chạy lại y nguyên sau nhiều tháng. Nguyên tắc thứ nhất là
      chọn nhánh có thời gian hỗ trợ dài và đã có bản vá lỗi thay vì chạy theo bản chấm không vừa phát hành. Nguyên tắc thứ
      hai là cố định chính xác phiên bản ảnh Docker bằng mã băm sáu mươi bốn ký tự để tránh bất ngờ khi kho lưu trữ công cộng
      thay đổi ngầm bên dưới. Ghim mã băm giúp loại bỏ hoàn toàn rủi ro một bản cập nhật ngầm từ kho ảnh làm hỏng bộ kiểm
      thử đang xanh. Nhánh bốn chấm một chấm ba còn đủ thời hạn bảo trì dài hạn nên thích hợp cho các hệ thống ngân hàng vận
      hành nhiều năm.
    focus:
    - 0
