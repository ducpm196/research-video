- id: example
  kind: example
  title: Cấu trúc pom.xml và mã nguồn nền Spring Boot 4.1.3
  checks:
  - 4 + 1 + 3 == 8
  steps:
  - show: <p><b>Cấu hình <code>pom.xml</code> tối giản chuẩn Boot 4.1.3</b></p><div class="code"><div>&lt;parent&gt;</div><div>  &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;</div><div>  &lt;artifactId&gt;spring-boot-starter-parent&lt;/artifactId&gt;</div><div>  &lt;version&gt;4.1.3&lt;/version&gt;</div><div>&lt;/parent&gt;</div><div>&lt;properties&gt;&lt;java.version&gt;21&lt;/java.version&gt;&lt;/properties&gt;</div><div>&lt;dependencies&gt;</div><div>  &lt;dependency&gt;&lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;</div><div>    &lt;artifactId&gt;spring-boot-starter-webmvc&lt;/artifactId&gt;&lt;/dependency&gt;</div><div>  &lt;dependency&gt;&lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;</div><div>    &lt;artifactId&gt;spring-boot-starter-webmvc-test&lt;/artifactId&gt;&lt;scope&gt;test&lt;/scope&gt;&lt;/dependency&gt;</div><div>&lt;/dependencies&gt;</div></div>
    say: Hãy đọc kỹ tệp cấu hình dự án trên màn hình vì đây là điểm khác biệt lớn nhất của Spring Boot đời bốn. Phần khai
      báo cha cố định phiên bản bốn chấm một chấm ba để tự quản lý hàng trăm thư viện đi kèm. Ở phần phụ thuộc bên dưới, gói
      web không còn là tên ngắn cũ mà chia rõ thành bộ chạy web thực tế và bộ kiểm thử đi kèm dành riêng cho giai đoạn kiểm
      tra. Trong cấu trúc cây thư mục dự án, tệp cấu hình Maven nằm ở thư mục gốc cùng tệp bao bọc và thư mục cấu hình ẩn.
      Mã nguồn ứng dụng nằm trong thư mục Java chính theo gói ngân hàng chuyển khoản, còn bài kiểm thử đặt song song ở nhánh
      kiểm thử.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>Lớp khởi động và đầu cuối kiểm tra sức khoẻ dịch vụ</b></p><div class="code"><div>package vn.nganhang.chuyenkhoan;</div><div>@SpringBootApplication</div><div>public
      class ChuyenKhoanApplication {</div><div>  public static void main(String[] args) {</div><div>    SpringApplication.run(ChuyenKhoanApplication.class,
      args);</div><div>  }</div><div>}</div><div>@RestController</div><div>public class HealthController {</div><div>  @GetMapping("/api/v1/health")</div><div>  public
      Map&lt;String, String&gt; health() {</div><div>    return Map.of("status", "UP", "service", "chuyen-khoan", "boot",
      "4.1.3");</div><div>  }</div><div>}</div></div>
    say: Cùng với tệp cấu hình là hai lớp Java ngắn gọn tạo nên ứng dụng web đầu tiên chạy được. Lớp chính kích hoạt cơ chế
      tự động lắp ráp toàn bộ khung ứng dụng và in dòng nhật ký báo khởi động thành công. Lớp điều khiển bên dưới mở sẵn một đường dẫn nhận yêu
      cầu đọc và trả thẳng đối tượng JSON báo trạng thái sẵn sàng của dịch vụ chuyển khoản. Chú thích ứng dụng ở lớp chính
      tự động quét các lớp cùng gói con để đăng ký thành phần điều khiển vào bộ chứa. Việc trả về bản đồ cặp khoá và giá trị
      đơn giản ở đầu cuối sức khoẻ giúp bộ cân bằng tải kiểm tra tình trạng sống nhanh chóng.
    focus:
    - 1
    - 2
