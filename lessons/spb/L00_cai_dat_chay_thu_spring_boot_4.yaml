scenes:
- id: hook
  kind: hook
  title: Vì sao cùng một dự án Spring Boot mà máy bạn không chạy được?
  checks:
  - 21 + 4 >= 21
  steps:
  - show: '<div class=''box key''><p>Trong các dự án doanh nghiệp thật, hai lỗi làm kỹ sư mới kẹt cả ngày đầu tiên là <b>lệch
      phiên bản JDK/Maven giữa các máy</b> và <b>dùng nhầm tên gói phụ thuộc của Spring Boot 3 trên Boot 4</b>.</p><p>Bài
      mở đầu cài đặt môi trường chuẩn: <b>JDK 21.0.13 + Maven Wrapper 3.10.1 + Spring Boot 4.1.3 + Docker 28.3.2</b> chạy
      sạch qua <code>./mvnw -B verify</code>.</p></div>'
    say: Chào bạn đến với khoá Spring Boot thực chiến với PostgreSQL, Redis và Kafka. Khác với những bài mô phỏng trước đây,
      toàn bộ mười ba bài trong khoá sẽ xây dựng cùng một dịch vụ chuyển khoản chạy thật trên máy bạn. Ngày đầu tiên nhận
      dự án, rất nhiều kỹ sư mới mất hàng giờ chỉ vì máy thiếu bộ công cụ dựng chuẩn hoặc lệch phiên bản Java giữa đồng đội
      với nhau. Bài học này hướng dẫn bạn kiểm tra đủ ba công cụ nền, dựng khung dự án Boot bốn chấm một chấm ba và cho dịch
      vụ chạy thử thành công. Thay vì học từng mảnh rời rạc, bạn sẽ thấy cấu hình Maven, cơ sở dữ liệu thật và kiểm thử gắn
      kết chặt chẽ với nhau. Mỗi công cụ đều được ghim phiên bản cố định ngay từ bài mở đầu để kết quả chạy hôm nay lặp lại
      chính xác sau nhiều tháng.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: dịch vụ Web, container và công cụ dựng Maven Wrapper'
  steps:
  - show: <table class='t'><tr><th>khái niệm đã biết</th><th>vai trò trong dịch vụ thật</th></tr><tr><td>Dịch vụ web nhận
      yêu cầu HTTP</td><td>Lắng nghe cổng mạng và trả JSON trạng thái hoạt động</td></tr><tr><td>Bộ công cụ Maven Wrapper</td><td>Tự
      tải đúng phiên bản công cụ dựng ghim trong kho mã</td></tr><tr><td>Bộ chứa container biệt lập</td><td>Chạy cơ sở dữ
      liệu và bộ đệm thật giống hệt sản xuất</td></tr></table>
    say: Trước khi bắt tay vào mã thật, ta điểm lại ngắn gọn ba khái niệm nền bạn đã làm quen. Một dịch vụ web nhận yêu cầu
      qua giao thức HTTP rồi phản hồi dữ liệu cấu trúc JSON. Công cụ bộ bao bọc Maven nằm sẵn trong thư mục dự án giúp mọi
      máy đều chạy đúng một phiên bản bộ dựng duy nhất mà không cần cài thủ công bên ngoài. Cuối cùng, nền tảng Docker tạo
      môi trường biệt lập để lát nữa ta bật các hệ quản trị dữ liệu thật như sản xuất. Cách tổ chức này tách biệt rõ lớp tiếp
      nhận mạng ở bên ngoài với lớp nghiệp vụ và dữ liệu bên dưới. Nhờ giữ nguyên cấu trúc thư mục chuẩn Maven gồm mã nguồn
      chính và mã kiểm thử, mọi công cụ tích hợp đều nhận diện tự động.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Khác biệt cốt lõi từ Spring Boot 2 sang 3 và 4.1.3
  steps:
  - show: '<table class=''t''><tr><th>phiên bản Spring Boot</th><th>JDK &amp; gói không gian tên</th><th>starter web &amp;
      kiểm thử chính</th></tr><tr><td><b>Boot 2.x</b> (hết hỗ trợ)</td><td>JDK 8–17, gói <code>javax.*</code></td><td><code>spring-boot-starter-web</code>
      + <code>RestTemplate</code></td></tr><tr><td><b>Boot 3.x</b> (3.5 hết 2026-06)</td><td>JDK 17+, đổi sang <code>jakarta.*</code></td><td>Vẫn dùng <code>-starter-web</code>, thêm AOT</td></tr><tr><td><b>Boot 4.1.3</b> (khoá này)</td><td>JDK 17–25 (chọn <b>21
      LTS</b>), <code>jakarta.*</code></td><td>Tách gọn: <code>spring-boot-starter-webmvc</code> và <code>-webmvc-test</code>; <code>@MockBean</code> → <code>@MockitoBean</code></td></tr></table>'
    say: Bảng này giải thích vì sao dự án Spring Boot bốn chấm một chấm ba nhìn hơi khác hướng dẫn cũ trên mạng. Ở đời hai
      cũ, toàn bộ thư viện dùng tiền tố gói cũ và hỗ trợ Java tám. Từ đời ba, nền tảng chuyển sang tiền tố tiêu chuẩn mới
      và đòi Java mười bảy trở lên. Sang đời bốn hiện nay, bộ khởi tạo web tách nhỏ gọn hơn thành mô hình điều khiển hiển
      thị để giảm phụ thuộc dư thừa. Sự tách gọn này cũng thay thế chú thích giả lập cũ sang tên mới là MockitoBean ngay trong
      bảng đối chiếu. Nhờ hiểu rõ cột mốc giữa ba thế hệ, bạn tránh được hàng giờ sửa lỗi biên dịch khi đọc hướng dẫn cũ trên
      mạng.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
