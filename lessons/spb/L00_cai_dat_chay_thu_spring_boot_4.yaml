    clear: true
- id: check
  kind: check
  title: 'Kiểm chứng môi trường thật: JDK 21, Maven Wrapper, Docker và ./mvnw -B verify'
  checks:
  - 28 >= 24
  steps:
  - show: '<p><b>Kết quả kiểm tra phiên bản công cụ trên máy thật (<code>2026-11-24</code>)</b></p><div class="code"><div>$
      java -version</div><div>openjdk version "21.0.13" 2026-10-20 LTS</div><div>$ docker version --format "{{.Server.Version}}"</div><div>28.3.2</div><div>$
      docker run --rm hello-world</div><div>Hello from Docker!</div><div>$ bash labs/cham.sh SPB L00</div><div>[INFO] Tests
      run: 3, Failures: 0, Errors: 0, Skipped: 0</div><div>KiemL00Test: 3 ca, 0 hỏng</div><div>ĐÚNG — PASS /d/research-video/labs/SPB/L00
      (du_an maven)</div></div>'
    say: Màn hình ghi nguyên văn đầu ra khi chạy thật toàn bộ lệnh kiểm tra môi trường và bộ dựng dự án chuẩn. Phiên bản Java
      hai mươi mốt và Docker hai mươi tám chấm ba đều đạt chuẩn vì vượt xa ngưỡng tối thiểu để chạy ổn định. Lệnh dựng chạy
      qua ba ca kiểm thử của dịch vụ sức khoẻ không sót lỗi nào và báo đạt chuẩn. Thời gian dựng kiểm sau khi có sẵn bộ đệm
      thư viện chỉ mất vài giây ngắn ngủi trên cấu hình máy cá nhân phổ thông. Tác vụ chạy container thử nghiệm chào thế giới
      cũng xác nhận quyền gọi trình điều phối container từ dòng lệnh đã thông suốt.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
- id: quymo
  kind: example
  title: Thời gian dựng lần đầu so với lần chạy đệm ở 1, 50 và 500 lớp
  checks:
  - 14 * 4 < 120
  - 500 > 50
  steps:
  - show: <table class='t'><tr><th>cỡ mã nguồn (số lớp Java)</th><th>lần dựng đầu (tải ~/.m2)</th><th>lần dựng sau (dùng bộ
      nhớ đệm)</th></tr><tr><td><b>1 lớp</b> (khung L00)</td><td>~25–45 s (phụ thuộc mạng tải jar)</td><td><b>~4–8 s</b> (biên
      dịch + 3 ca test)</td></tr><tr><td><b>50 lớp</b> (dịch vụ hoàn chỉnh)</td><td>~35–55 s (chỉ tải phụ thuộc 1 lần)</td><td><b>~8–14
      s</b> (biên dịch tăng dần)</td></tr><tr><td><b>500 lớp</b> (dịch vụ lớn nhiều mô-đun)</td><td>~60–90 s (tải toàn bộ
      BOM)</td><td><b>~18–30 s</b> (nếu bật đệm bộ dựng CI)</td></tr></table>
    say: Bảng quy mô cho thấy lý do lần dựng đầu tiên bao giờ cũng chậm hơn hẳn những lần chạy kế tiếp. Ở lần chạy đầu tiên
      khi thư mục đệm trên máy còn trống, bộ dựng phải tải toàn bộ các gói phụ thuộc từ kho lưu trữ công cộng về ổ cứng. Từ
      lần thứ hai trở đi khi thư mục đệm đã có sẵn, dự án chỉ biên dịch lại các tệp mã thay đổi nên chạy xong trong vài giây.
