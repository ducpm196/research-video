objectives:
- Lưu đơn chuyển khoản cùng bản ghi Outbox trong một giao dịch cơ sở dữ liệu trước khi phát lên Kafka
- Cấu hình thử lại không chặn với lùi hàm mũ và chuyển bản tin hỏng sang chủ đề DLT bằng RetryableTopic
- Phân biệt cơ chế giữ nhật ký đọc lại của Kafka với mô hình xoá sau xác nhận của RabbitMQ và ActiveMQ JMS
- Đo độ trễ hàng đợi khi tỉ lệ lỗi độc tố tăng từ 0,1% lên 10% ở 1 000, 100 000 và 1 000 000 thông điệp
scenes:
- id: hook
  kind: hook
  title: Gửi Kafka khi giao dịch hoàn tác, hay kẹt tin lỗi làm tắc hàng đợi?
  checks:
  - len(['PENDING', 'SENT', 'DLT']) == 3
  steps:
  - show: '<div class=''box key''><p>Hai lỗi chí tử khi dùng hàng đợi sự kiện: (1) gọi <code>kafka.send(...)</code> ngay bên
      trong giao dịch DB chưa chốt nên khi DB quay lui vẫn bắn sự kiện ma ra ngoài; (2) một bản tin JSON hỏng cứ ném lỗi lặp
      vô tận chặn đứng toàn bộ phân vùng Kafka!</p><p>Giải pháp thật: <b>Transactional Outbox + <code>@RetryableTopic</code>
      + DLT</b> trên Kafka 3.9.0.</p></div>'
    say: Chào bạn đến với bài sáu của khoá Spring Boot thực chiến. Sau khi làm chủ PostgreSQL và Redis, hôm nay ta nối dịch
      vụ với hàng đợi sự kiện Kafka chạy thật trên Docker. Lỗi thường gặp là gửi tin ra mạng khi giao dịch chưa chốt, hoặc
      để một bản tin hỏng làm đứng cả luồng sự kiện phía sau. Bài này hướng dẫn cách cài mẫu Outbox chống mất và thừa tin
      cùng cơ chế đẩy bản tin độc tố sang hàng thư chết. Giữ sự nhất quán giữa thay đổi trong cơ sở dữ liệu và thông điệp
      gửi sang hàng đợi là bài toán cốt lõi của kiến trúc sự kiện. Nếu xử lý thiếu chặt chẽ, một lỗi định dạng đơn lẻ có thể
      làm tắc nghẽn dây chuyền thanh toán của cả ngân hàng.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: chủ đề phân vùng Kafka, nhóm đọc và ngữ nghĩa tối thiểu một lần'
  steps:
  - show: <table class='t'><tr><th>khái niệm hàng đợi nền</th><th>hành vi khi vận hành thật</th></tr><tr><td>Chủ đề và phân
      vùng Kafka</td><td>Nhật ký nối đuôi theo thứ tự lệch vị trí bất biến</td></tr><tr><td>Nhóm tiếp nhận (Consumer Group)</td><td>Mỗi
      phân vùng giao cho một máy đọc nối tiếp nhau</td></tr><tr><td>Giao tối thiểu một lần</td><td>Tin chưa xác nhận sẽ được
      đọc lại nên hàm nhận cần lũy đẳng</td></tr></table>
    say: Hãy ôn ngắn gọn ba nguyên tắc của hệ thống hướng sự kiện trước khi vào mã thật. Kafka lưu bản tin thành nhật ký nối
      đuôi chia theo từng phân vùng và đánh số vị trí tăng dần không xoá ngay sau khi đọc. Một nhóm tiếp nhận phân công mỗi
      phân vùng cho một tiến trình xử lý tuần tự từ đầu tới cuối. Vì tin có thể được giao lặp lại khi đứt mạng nên dịch vụ
      nhận phải cài sẵn cơ chế khử trùng. Mỗi nhóm đọc giữ vị trí lệch riêng biệt nên việc đọc sự kiện của nhóm kế toán không
      ảnh hưởng tới nhóm cảnh báo. Hiểu rõ mô hình nhật ký bất biến này giúp ta tận dụng tối đa cơ chế tách kênh thử lại không
      chặn phía sau.
