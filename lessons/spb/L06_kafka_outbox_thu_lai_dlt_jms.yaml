    say: Quan sát toàn bộ hành trình một sự kiện chuyển khoản đi qua bốn chặng bảo vệ từ trái sang phải. Ở chặng một, ứng
      dụng lưu bản ghi sự kiện vào bảng Outbox nằm ngay trong cùng giao dịch với lệnh chuyển tiền để bảo đảm có tiền thay
      đổi thì mới có tin. Chặng hai tiến trình phát hành đọc bảng Outbox đẩy sang chủ đề Kafka chính.
