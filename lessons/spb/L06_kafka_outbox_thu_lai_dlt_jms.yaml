      sau ba lần thất bại. Nhờ chia nhỏ hành trình thành bốn bước tách biệt, phần phát sự kiện không bị phụ thuộc thời
      gian xử lý tức thời của bên nhận. Hàng thư chết cuối đường ống biến mọi bản tin lỗi nặng thành dữ liệu điều tra gọn
      gàng thay vì làm treo toàn hệ thống.
- id: formula
  kind: formula
  title: Lý do không được gọi send() trực tiếp trong giao dịch và cơ chế lùi hàm mũ
  checks:
  - 100 + 200 + 400 == 700
  steps:
  - show: <div class='box key'><p><b>Hai quy tắc chống mất tin và chống nghẽn hàng đợi:</b></p><p>1. <b>Cam kết nguyên tử
      qua bảng Outbox:</b> Không thể chốt hai pha giữa DB và Kafka trong một khối lệnh; lưu vào bảng DB bảo đảm <i>rollback
      = 0 bản ghi Outbox</i>.</p><p>2. <b>Thử lại không chặn kèm lùi hàm mũ:</b> Nếu chờ 100 ms → 200 ms → 400 ms bằng chủ
      đề phụ <code>-retry</code> (kèm <code>multiplier = 2</code>; bài lab L06 dùng <code>attempts = "3", delay = 100</code> ms cố định để Testcontainers chạy nhanh), luồng chính <code>transfer.events</code> không bị nghẽn chờ.</p></div>
    say: Hai quy tắc này giúp hệ thống phân tán giữ đồng bộ dù mạng hay tiến trình có thể sập bất cứ lúc nào. Cơ sở dữ liệu
      và Kafka là hai hệ thống độc lập nên ta chỉ dựa vào tính nguyên tử ngay bên trong PostgreSQL để tạo bảng Outbox đáng
      tin cậy. Khi gặp lỗi xử lý ở đầu nhận, chuyển tin lỗi sang các chủ đề phụ chờ theo cấp số nhân giúp những tin sạch phía
      sau tiếp tục trôi qua ngay lập tức. Thời gian chờ lùi theo cấp số nhân một trăm, hai trăm rồi bốn trăm mi-li-giây cho
      phép lỗi mạng thoáng qua tự phục hồi sạch sẽ. Đồng thời luồng chính không phải dừng chờ nên độ trễ xử lý các sự kiện
      hợp lệ vẫn giữ ở mức ổn định rất thấp.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Mã thật: OrderOutboxService + Consumer với @RetryableTopic'
  checks:
  - 100 + 200 == 300
  steps:
  - show: '<p><b>1. Lưu bảng Outbox trong giao dịch rồi phát lên Kafka</b></p><div class="code"><div>@Transactional</div><div>public
      void createTransferOrder(String payload, boolean fail) {</div><div>  outbox.save(new OutboxEvent(payload));</div><div>  if
      (fail) throw new IllegalStateException("Hoan tac");</div><div>}</div><div>@Transactional</div><div>public int publishPending()
      {</div><div>  var pending = outbox.findByStatusOrderByIdAsc("PENDING");</div><div>  for (var ev : pending) { kafka.send("transfer.events",
      ev.getPayload()); ev.markSent(); }</div><div>  return pending.size();</div><div>}</div></div>'
    say: Đoạn mã đầu tiên cho thấy cách tách khâu ghi nhận sự kiện và khâu phát tin ra mạng làm hai bước rõ ràng. Khi hàm
      tạo đơn chuyển khoản gặp lỗi giữa chừng và hoàn tác, bản ghi chờ phát trong bảng Outbox tự động bị huỷ theo nên không
      có tin ma lọt ra ngoài. Khi giao dịch thành công, hàm phát hành mới gửi tin sang Kafka và đánh dấu trạng thái đã gửi.
      Thực thể sự kiện Outbox lưu nội dung chuỗi sự kiện kèm cột trạng thái khởi tạo đang chờ phát và thời điểm tạo bản ghi.
      Tiến trình phát hành quét các dòng đang chờ theo thứ tự mã tăng dần để bảo toàn trình tự trước sau của chuỗi giao dịch.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>2. Người nhận dùng @RetryableTopic (Spring Kafka 4.x BackOff) và @DltHandler</b></p><div class="code"><div>@RetryableTopic(attempts
      = "3", backOff = @BackOff(delay = 100), dltTopicSuffix = "-dlt")</div><div>@KafkaListener(topics = "transfer.events",
      groupId = "chuyenkhoan-l06")</div><div>public void onMessage(String msg) {</div><div>  if (msg.startsWith("POISON:"))
      throw new IllegalArgumentException("Doc to");</div><div>  processed.add(msg);</div><div>}</div><div>@DltHandler</div><div>public
      void onDlt(String msg) { dltReceived.add(msg); }</div></div>
    say: Phía bộ phận tiếp nhận chỉ cần gắn đúng hai chú thích để kích hoạt thử lại ba lần và rẽ nhánh sang hàng thư chết.
      Lưu ý trong Spring Boot bốn, chú thích khoảng lùi dùng chữ B và chữ O viết hoa trong gói mới của Kafka. Những bản tin
      độc tố gây ngoại lệ cả ba lần sẽ được đẩy tự động vào hàm xử lý hàng thư chết mà không làm kẹt các bản tin hợp lệ khác.
      Lưu ý thuộc tính hậu tố hàng thư chết gắn thêm đuôi chuẩn vào cuối tên chủ đề giúp đội vận hành theo dõi tập trung dễ
      dàng. Mỗi bản tin độc tố sau khi đi hết ba lượt thử vẫn giữ nguyên ngữ cảnh gốc để kỹ sư kiểm tra và phát lại sau khi
      vá lỗi.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật trên Kafka 3.9.0 Testcontainers: hoàn tác Outbox, tin sạch và DLT'
  checks:
  - 1_000_000 - 1 == 999_999
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL06Test trên Apache Kafka 3.9.0</b></p><div class="code"><div>Container apache/kafka:3.9.0@sha256:fbc7d7...
      started in PT3.79s</div><div>// 1) createTransferOrder("TX-ROLLED", true) → outbox.count() không tăng</div><div>// 2)
      publishPending() "TX-VALID-100" → processed chứa "TX-VALID-100", PENDING = 0</div><div>// 3) publishPending() "POISON:bad-json"
      → sau 3 lần thử, vào transfer.events-dlt</div><div>[INFO] Tests run: 3, Failures: 0, Errors: 0, Total time: 25.114 s</div><div>ĐÚNG
      — PASS /d/research-video/labs/SPB/L06 (du_an maven)</div></div>'
    say: Kết quả chạy kiểm thử thật trên thùng chứa Kafka ba chấm chín xác nhận trọn vẹn cả ba kịch bản kiểm chứng. Vì đã
      ghi bảng Outbox trong cùng giao dịch cơ sở dữ liệu, lệnh hoàn tác đầu tiên không sinh sự kiện thừa nào. Bản tin hợp
      lệ đi trọn chủ đề chính, còn bản tin độc tố sau ba lần thử lại rơi đúng vào hàng thư chết DLT do cấu hình tách luồng.
      Bộ đếm bản tin đã nhận và danh sách bản tin nằm ở hàng thư chết xác minh trọn vẹn đường đi của cả hai loại thông điệp.
      Ba kịch bản tự động trên Kafka ba chấm chín chạy khép kín trong khoảng hai mươi lăm giây kể cả thời gian bật thùng chứa.
    focus:
    - 1
    - 2
