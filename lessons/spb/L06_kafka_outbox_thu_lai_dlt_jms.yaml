- id: sym
  kind: symbol
  title: So sánh Kafka với RabbitMQ và ActiveMQ (JMS) kèm chú thích thử lại
  steps:
  - show: <table class='t'><tr><th>hệ thống nhắn tin</th><th>mô hình lưu trữ &amp; đọc</th><th>trường hợp ngân hàng phù hợp</th></tr><tr><td><b>Apache
      Kafka 3.9</b></td><td>Nhật ký phân vùng giữ theo thời hạn; nhiều nhóm đọc lại độc lập</td><td>Luồng bút toán, kiểm toán,
      nạp dữ liệu lớn tốc độ cao</td></tr><tr><td><b>RabbitMQ</b> (AMQP)</td><td>Đẩy tin theo hàng đợi thông minh; xoá ngay
      sau khi nhận ACK</td><td>Định tuyến tác vụ phức tạp, trả lời yêu cầu ngắn hạn</td></tr><tr><td><b>ActiveMQ</b> (chuẩn
      <b>JMS</b>)</td><td>Hàng đợi/chủ đề theo chuẩn giao diện Java doanh nghiệp</td><td>Kết nối hệ thống lõi Java thế hệ
      cũ còn dùng JMS</td></tr></table>
    say: Bảng này giúp bạn phân biệt rõ ba công nghệ nhắn tin hay xuất hiện trong đề tuyển dụng ngân hàng. Kafka lưu nhật
      ký bền vững theo thời gian giữ lại cho phép nhiều hệ thống con tự đọc lại dòng sự kiện theo tốc độ riêng. RabbitMQ hoạt
      động như người đưa thư định tuyến linh hoạt qua các khoá trao đổi và xoá tin ngay khi người nhận báo xong. Còn ActiveMQ
      cài đặt tiêu chuẩn JMS cổ điển của Java thường gặp khi tích hợp với những phân hệ lõi lâu đời. Bảng đối chiếu giúp bạn
      chọn đúng công cụ theo bài toán phát trực tuyến tốc độ cao hay định tuyến tác vụ truyền thống. Khi gặp hệ thống lõi
      lâu đời chỉ giao tiếp qua chuẩn thông điệp Java doanh nghiệp, bộ điều hợp JMS đóng vai trò cầu nối chuẩn.
    focus:
