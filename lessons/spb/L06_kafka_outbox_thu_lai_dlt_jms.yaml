- id: pitfalls
  kind: pitfall
  title: Ba lỗi hay gặp khi tích hợp Kafka Outbox và RetryableTopic
  steps:
  - show: <table class='t'><tr><th>lỗi kỹ thuật hay gặp với Kafka</th></tr><tr><td><div class='box warn'><b>Lỗi 1 — Gọi <code>kafka.send(...)</code>
      ngay giữa hàm <code>@Transactional</code>:</b> Giao dịch hoàn tác vì lỗi ở bước cuối nhưng sự kiện Kafka đã phát đi
      rồi!<br><b>Lỗi 2 — Chặn <code>Thread.sleep</code> trong listener khi xử lý lỗi:</b> Giữ quá <code>max.poll.interval.ms</code>
      làm Kafka tưởng consumer chết và tái cân bằng phân vùng liên tục.<br><b>Lỗi 3 — Dùng Testcontainers Kafka 3.9 mà thiếu
      <code>KAFKA_LISTENERS</code>:</b> Lỗi <code>advertised.listeners cannot use 0.0.0.0</code> lúc khởi động container.</div></td></tr></table>
    say: Ba lỗi trên bảng đều là bẫy thực tế khi đưa Kafka vào dịch vụ Java. Gửi tin trực tiếp trước khi chốt giao dịch tạo
      ra sự kiện ma khi giao dịch quay lui sau đó. Ngủ chờ quá lâu ngay trong luồng tiếp nhận vượt ngưỡng kiểm tra nhịp tim
      khiến cả nhóm phân vùng bị xáo trộn phân chia lại liên tục. Còn với phiên bản Kafka ba chấm chín trên môi trường kiểm
      thử container, ta nhớ ghi tường minh danh sách cổng lắng nghe không chứa địa chỉ không chấm không. Nhớ rằng trên hàng
      đợi thử lại không chặn, thứ tự giữa tin lỗi và tin sạch mới hơn có thể hoán đổi nên đầu nhận cần thiết kế lũy đẳng.
      Kiểm chứng trước cấu hình cổng lắng nghe trên thùng chứa giúp bộ kiểm thử chạy ổn định trên mọi môi trường tích hợp.
