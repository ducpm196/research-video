- id: quymo
  kind: example
  title: Độ trễ hàng đợi khi tỉ lệ lỗi độc tố tăng từ 0,1% lên 10% ở 3 cỡ tải
  checks:
  - 1_000_000 * 10 // 100 == 100_000
  - 1000 * 1 // 1000 == 1
  steps:
  - show: <table class='t'><tr><th>số thông điệp / tỉ lệ lỗi</th><th>thử lại chặn luồng chính (500 ms × 3)</th><th>@RetryableTopic
      + DLT tách kênh</th></tr><tr><td><b>1 000 tin</b> (lỗi 0,1% = 1 tin)</td><td>Tắc nhẹ ~1,5 giây trên phân vùng dính lỗi</td><td>Luồng
      chính thông suốt <b>0 ms tắc</b>; 1 tin sang DLT</td></tr><tr><td><b>100 000 tin</b> (lỗi 1% = 1 000 tin)</td><td>Nghẽn
      tích lũy hơn <b>25 phút</b> nếu chung phân vùng</td><td>Tin sạch xử lý ngay; 1 000 tin cách ly gọn ở DLT</td></tr><tr><td><b>1
      000 000 tin</b> (lỗi 10% = 100 000 tin)</td><td>Sập toàn bộ pipeline tiêu thụ</td><td>Chủ đề <code>-retry</code> gánh
      thay; cảnh báo khẩn khi DLT tăng vọt</td></tr></table>
    say: Bảng quy mô cho thấy tác động khủng khiếp của bản tin lỗi nếu không tách kênh thử lại ở mức một nghìn, một trăm nghìn
      và một triệu thông điệp. Ở một nghìn tin với tỉ lệ một phần nghìn chỉ có một tin lỗi nhưng vẫn làm khựng phân vùng nếu
