      buộc phải làm trong <code>@BeforeEach</code> là gì?</li></ol>
    say: Hãy tự kiểm nhanh hai câu hỏi cốt lõi trước khi thực hành. Câu một, tại sao khi gắn mã băm SHA hai trăm năm mươi
      sáu lên tên ảnh Docker ta nên khai báo rõ thuộc tính tên kết nối dịch vụ? Câu hai, nếu dùng chung một cụm thùng chứa
      cho nhiều ca kiểm thử khác nhau, ta bắt buộc phải làm gì trong hàm chuẩn bị trước mỗi ca? Bấm tạm dừng và trả lời. Hai
      câu hỏi này kiểm tra kinh nghiệm xử lý thực tế khi ghim phiên bản ảnh và chia sẻ thùng chứa giữa nhiều ca thử.
