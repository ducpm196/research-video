objectives:
- Cấu hình Testcontainers với ServiceConnection ghim digest PostgreSQL, Redis và Kafka thật
- Viết ca kiểm xuyên suốt từ API HTTP tới bảng bút toán PostgreSQL, xoá đệm Redis và bản tin Kafka
- Đo chi phí thời gian khởi tạo container dùng chung giữa 1, 10 và 50 lớp kiểm thử tích hợp
scenes:
- id: hook
  kind: hook
  title: Test đơn vị xanh 100% nhưng chạy thật vẫn sập vì lệch DB hay Kafka?
  checks:
  - alg.spb_tc_startup_s(10, 6, True) < alg.spb_tc_startup_s(10, 6, False)
  steps:
  - show: <div class='box key'><p>Cơ sở dữ liệu bộ nhớ H2 không hiểu cú pháp khoá hàng thật của PostgreSQL, còn giả lập không
      bắt được lỗi mất đồng bộ khi xoá đệm Redis hoặc phát bản tin Kafka.</p><p>Bài này nối trọn cả <b>PostgreSQL 17 + Redis
      8 + Apache Kafka 3.9</b> bằng <b>Testcontainers + ServiceConnection</b> trong một ca kiểm tích hợp đầu cuối thật.</p></div>
    say: Chào bạn đến với bài mười của khoá Spring Boot thực chiến. Dùng cơ sở dữ liệu giả trong bộ nhớ hay giả lập hàm gửi
      tin rất nhanh, nhưng dễ sót lỗi khoá hàng thật và lỗi di trú. Hôm nay ta lên đỉnh tháp kiểm thử, bật cả ba thùng chứa
      PostgreSQL, Redis và Kafka thật bằng Testcontainers ngay từ mã kiểm Java. Chỉ trong một luồng thử nghiệm tự động, ta
      chứng minh yêu cầu web đi trọn từ sổ cái xuống bộ đệm và hàng đợi. Chỉ khi chạy xuyên suốt qua PostgreSQL, Redis và
      Kafka thật, bạn mới bắt được những lỗi tích hợp ẩn sau các giả lập. Testcontainers giúp tự động hoá toàn bộ hạ tầng
      phức tạp đó ngay bên trong bộ kiểm thử tiêu chuẩn của dự án.
