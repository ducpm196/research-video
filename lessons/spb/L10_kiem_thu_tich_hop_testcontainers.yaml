- id: prereq
  kind: prereq
  title: 'Ôn nhanh: ba thành phần hạ tầng đã dùng và nhu cầu kiểm thông luồng'
  steps:
  - show: <table class='t'><tr><th>hạ tầng đã học riêng lẻ</th><th>vai trò khi chạy ghép toàn luồng</th></tr><tr><td>PostgreSQL
      17 + Flyway</td><td>Kiểm tra cấu trúc SQL thật, chốt hai dòng bút toán kép tổng bằng 0</td></tr><tr><td>Redis 8 bộ đệm
      số dư</td><td>Bảo đảm sau khi chuyển tiền xong khoá cũ bị xoá sạch để đọc lại giá trị mới</td></tr><tr><td>Kafka 3.9
      hàng đợi sự kiện</td><td>Xác nhận sự kiện phát đúng lên chủ đề thật và người nhận đọc thành công</td></tr></table>
    say: Hãy nhìn lại ba mảnh ghép hạ tầng ta đã thử nghiệm rời từng bài từ đầu khoá tới giờ. PostgreSQL chịu trách nhiệm
      lưu trữ bền vững và bảo toàn bất biến tổng sổ cái bằng không. Redis giữ số dư đệm trên bộ nhớ và phải bị vô hiệu hoá
      ngay sau mỗi giao dịch hoàn tất. Kafka truyền thông điệp bất đồng bộ sang các hệ thống kế toán và cảnh báo phía sau.
      Mục tiêu của bài kiểm tích hợp toàn luồng là chứng minh ba mắt xích rời rạc phối hợp trơn tru như một dây chuyền thống
      nhất. Bất kỳ sai lệch nhỏ nào về tên chủ đề, cách xoá khoá đệm hay di trú bảng đều bị phơi bày ngay trong bài kiểm này.
