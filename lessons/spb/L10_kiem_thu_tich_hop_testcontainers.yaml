    say: Theo dõi đường đi xuyên suốt bốn thành phần trong một kịch bản kiểm thử toàn luồng. Trước khi chuyển khoản, ta làm
      ấm bộ đệm tài khoản một triệu đồng trong Redis để tạo tình huống có đệm cũ sẵn. Sau lệnh HTTP chuyển hai trăm năm
      mươi nghìn, hệ thống ghi sổ cái PostgreSQL, xoá sạch đệm Redis và phát sự kiện sang người nhận Kafka.
