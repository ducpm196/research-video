- id: sym
  kind: symbol
  title: Bộ chú thích @Testcontainers và @ServiceConnection trên Boot 4.1
  steps:
  - show: <table class='t'><tr><th>công cụ Testcontainers</th><th>công dụng chính xác</th></tr><tr><td><code>@ServiceConnection</code></td><td>Tự
      động điền chuỗi JDBC, địa chỉ Redis và Kafka vào Spring mà không cần <code>@DynamicPropertySource</code></td></tr><tr><td><code>@ServiceConnection(name
      = "postgres")</code></td><td>Ghi rõ tên kết nối khi dùng <code>DockerImageName</code> ghim digest <code>@sha256:...</code></td></tr><tr><td>Lớp
      cha singleton <code>static { PG.start(); ... }</code></td><td>Bật cụm container duy nhất 1 lần dùng chung cho mọi lớp
      test</td></tr></table>
    say: Bảng này giải thích ba quy tắc giúp cấu hình kiểm thử container vừa gọn vừa nhanh trên Spring Boot bốn chấm một.
      Chú thích kết nối dịch vụ tự động bơm địa chỉ động của container vào cấu hình ứng dụng mà không cần viết tay các hàm
      nối chuỗi rườm rà. Khi ghim mã băm ảnh cố định, ta luôn truyền thêm tên dịch vụ tường minh vào chú thích để tránh lỗi
      suy diễn tên ảnh. Đặt khởi chạy tĩnh trong một lớp cha dùng chung giúp cả bộ kiểm không phải bật lại Docker nhiều lần.
      Chú thích kết nối dịch vụ thế hệ mới loại bỏ hàng chục dòng cấu hình thuộc tính động rườm rà trong các bài kiểm cũ.
      Tái sử dụng một cụm thùng chứa tĩnh duy nhất là bí quyết giữ cho bộ kiểm thử toàn cụm chạy nhanh trên cả máy cá nhân
      và CI.
