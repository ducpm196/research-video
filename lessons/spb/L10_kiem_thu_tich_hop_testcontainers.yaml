- id: formula
  kind: formula
  title: Nguyên tắc ghim digest cố định và mẫu Singleton Container
  checks:
  - alg.spb_tc_startup_s(10, 6, True) == 6
  - alg.spb_tc_startup_s(10, 6, False) == 60
  steps:
  - show: '<div class=''box key''><p><b>Chi phí khởi tạo cụm 3 container (~6–7 giây mỗi lượt):</b></p><p>1. Nếu dùng <code>@Container</code>
      bật mới riêng cho từng lớp test trong <b>50 lớp</b>: tốn <code>50 × 6 = 300 giây (5 phút)</code> chỉ để chờ khởi động
      container rỗng.</p><p>2. Với lớp cha <b>Singleton Container</b> khởi động 1 lần trong khối <code>static {}</code>: toàn
      bộ 50 lớp chỉ tốn đúng <b>6 giây</b> dùng chung, chỉ cần xoá sạch dữ liệu bảng và <code>flushDb()</code> trong <code>@BeforeEach</code>.</p></div>'
    say: Hai con số trên màn hình lý giải vì sao mẫu dùng chung container lại quan trọng tới vậy. Một cụm ba dịch vụ tốn khoảng
      sáu giây khởi động, nếu năm mươi lớp kiểm thử nào cũng bật lại từ đầu thì mất năm phút vô ích. Ngược lại khi dùng một
      lớp cha khởi tạo tĩnh duy nhất rồi dọn sạch bảng trước mỗi ca kiểm thử, cả năm mươi lớp chỉ trả chi phí khởi động đúng
      một lần đầu tiên. Thời gian khởi động một cụm container tuy nhỏ với từng bài nhưng sẽ cộng dồn thành nút thắt lớn khi
      đội ngũ có hàng trăm kiểm thử. Do đó thiết kế lớp cơ sở dùng chung kết hợp tái sử dụng ngữ cảnh ứng dụng Spring là chuẩn
      mực hàng đầu trong dự án doanh nghiệp.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Mã thật: FullStackBaseTest ghim 3 digest và @ServiceConnection'
  checks:
  - 1_000_000 - 250_000 == 750_000
  steps:
  - show: <p><b>1. Lớp cha Singleton khởi động 3 container ghim đúng digest</b></p><div class="code"><div>public abstract
      class FullStackBaseTest {</div><div>  @ServiceConnection(name = "postgres")</div><div>  static final PostgreSQLContainer
      PG = new PostgreSQLContainer(</div><div>    DockerImageName.parse("postgres:17-alpine@sha256:d3244e...")</div><div>      .asCompatibleSubstituteFor("postgres"));</div><div>  @ServiceConnection(name
      = "redis")</div><div>  static final GenericContainer&lt;?&gt; REDIS = new GenericContainer&lt;&gt;(</div><div>    DockerImageName.parse("redis:8@sha256:1f8829...")).withExposedPorts(6379);</div><div>  @ServiceConnection(name
      = "kafka")</div><div>  static final KafkaContainer KAFKA = new KafkaContainer(</div><div>    DockerImageName.parse("apache/kafka:3.9.0@sha256:fbc7d7...")</div><div>      .asCompatibleSubstituteFor("apache/kafka"))</div><div>    .withEnv("KAFKA_LISTENERS",
      "PLAINTEXT://:9092,BROKER://:9093,CONTROLLER://:9094");</div><div>  static { PG.start(); REDIS.start(); KAFKA.start();
      }</div><div>}</div></div>
    say: Nhìn trọn lớp nền dùng chung điều phối ba hệ thống dữ liệu thật trong Java. Cả ba ảnh đều ghim chặt bằng mã băm cố
      định từ hồ sơ phiên bản và khai báo tường minh tên kết nối dịch vụ. Lưu ý thùng chứa Kafka ba chấm chín có gắn biến
      môi trường cổng lắng nghe không dùng địa chỉ không chấm không để vượt qua bước kiểm tra khởi chạy chặt chẽ. Mỗi hình
      ảnh container đều gọi qua lớp phân tích chuỗi ảnh để giữ chính xác phiên bản kèm mã băm sáu mươi bốn ký tự. Việc khai
      báo cùng một lớp cơ sở cho các kiểm thử liên quan giữ cho ngữ cảnh ứng dụng không bị khởi động lại vô ích.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>2. Hàm chuyển khoản xuyên suốt Postgres → xoá Redis → gửi Kafka</b></p><div class="code"><div>@Transactional</div><div>public
      void transfer(String fromId, String toId, long amount) {</div><div>  Account a = accounts.findById(fromId).orElseThrow();</div><div>  Account
      b = accounts.findById(toId).orElseThrow();</div><div>  a.setBalance(a.getBalance() - amount); b.setBalance(b.getBalance()
      + amount);</div><div>  journals.save(new JournalEntry(fromId, -amount));</div><div>  journals.save(new JournalEntry(toId,
      +amount));</div><div>  redis.delete("bal:" + fromId); redis.delete("bal:" + toId);</div><div>  kafka.send("bank.full.events",
      fromId + "-&gt;" + toId + ":" + amount);</div><div>}</div></div>
    say: Phía dịch vụ, một giao dịch chuyển khoản duy nhất chạm đủ cả ba hệ thống thật. Sau khi cập nhật tài khoản và lưu
      cân bằng hai dòng bút toán vào PostgreSQL, mã xoá ngay cả hai khoá đệm trong Redis và phát thông điệp thông báo sang
      Kafka. Nếu chỉ xoá khoá đệm tài khoản nguồn mà quên tài khoản đích, ứng dụng khách kiểm tra số dư người nhận sẽ đọc
      phải con số cũ. Vì vậy cần xoá đồng thời cả hai khoá tài khoản nguồn lẫn đích ngay sau khi hoàn tất ghi sổ bút toán
      kép.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật cả 3 container: HTTP 201 → Postgres Σ=0 → Redis 750k → Kafka event'
  checks:
  - 750_000 + 750_000 == 1_500_000
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL10Test với 3 container sống đồng thời</b></p><div class="code"><div>Container postgres:17-alpine
      started in PT2.43s</div><div>Container apache/kafka:3.9.0 started in PT3.79s</div><div>Container redis:8 started in
      PT0.69s</div><div>// POST /api/v1/full-transfers {"fromId":"TK1","toId":"TK2","amount":250000} → HTTP 201</div><div>//
      cachedBalance("TK1") = 750_000, cachedBalance("TK2") = 750_000, journals.net() = 0</div><div>// Kafka consumer nhận
      được "TK1-&gt;TK2:250000"</div><div>[INFO] Tests run: 2, Failures: 0, Errors: 0, Total time: 32.721 s</div><div>ĐÚNG
      — PASS /d/research-video/labs/SPB/L10 (du_an maven)</div></div>'
    say: Đầu ra kiểm thử thật ghi nhận thời gian khởi động cực nhanh của ba thùng chứa trên Docker. PostgreSQL mất khoảng
      hai phẩy bốn giây, Kafka gần ba phẩy tám giây và Redis chưa tới một giây. Sau lệnh chuyển hai trăm năm mươi nghìn, bộ
      đệm về bảy trăm năm mươi nghìn vì khoá cũ bị xoá, tổng sổ bằng không và Kafka nhận đủ tin. Thời gian chờ đọc tin trên
      Kafka cần một khoảng thăm dò ngắn hợp lý vì người nhận chạy bất đồng bộ ở luồng nền. Khi cả ba công cụ báo xanh trên
      thùng chứa thật, bạn có mức độ tin cậy gần như tuyệt đối trước khi đóng gói phát hành.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Chi phí khởi tạo container dùng chung giữa 1, 10 và 50 lớp kiểm thử
  checks:
  - alg.spb_tc_startup_s(50, 6, True) == 6
  - alg.spb_tc_startup_s(50, 6, False) == 300
  steps:
  - show: <table class='t'><tr><th>số lớp kiểm thử tích hợp</th><th>khởi động lại mỗi lớp (~6 s/lớp)</th><th>Singleton Container
      + Flyway</th></tr><tr><td><b>1 lớp</b> (như KiemL10Test)</td><td>~6 giây</td><td><b>~6 giây</b> (tương đương)</td></tr><tr><td><b>10
      lớp</b></td><td>~60 giây chờ bật Docker</td><td><b>~6 giây</b> + thời gian test thật</td></tr><tr><td><b>50 lớp</b></td><td><b>300
      giây (5 phút)</b> + ngốn RAM</td><td><b>~6 giây</b> nhờ tái dùng 1 cụm + giữ 1 Spring context</td></tr></table>
    say: Bảng quy mô cho thấy khoản tiết kiệm rõ rệt khi dùng chung một cụm container qua các mốc một, mười và năm mươi lớp
      kiểm thử. Ở một lớp duy nhất thì hai cách tốn gần bằng nhau. Nhưng sang mười và năm mươi lớp, mô hình khởi động lại
      từng lớp làm tốn tới năm phút chỉ cho việc dựng máy chứa rỗng và gây quá tải bộ nhớ RAM máy tính. Khi ghép chung lớp
      cha và giữ nguyên cấu hình ứng dụng để dùng chung ngữ cảnh Spring, cả năm mươi lớp vẫn chỉ khởi động đúng một cụm duy
      nhất. Ở quy mô năm mươi lớp kiểm thử, tiết kiệm gần năm phút mỗi lượt chạy giúp tăng đáng kể nhịp độ tích hợp mã nguồn
      mỗi ngày. Cùng lúc đó, dung lượng bộ nhớ RAM máy trạm kiểm thử cũng không bị phình vì nhiều cụm container mở trùng lặp.
    focus:
