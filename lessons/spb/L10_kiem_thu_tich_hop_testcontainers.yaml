  kind: pitfall
  title: Ba lỗi kỹ thuật khiến Testcontainers hỏng hoặc chạy cực chậm
  steps:
  - show: <table class='t'><tr><th>bẫy Testcontainers thực tế cần tránh</th></tr><tr><td><div class='box warn'><b>Lỗi 1 —
      Dùng cơ sở dữ liệu H2 giả làm PostgreSQL trong test cuối:</b> H2 bỏ qua sự khác biệt về khoá hàng và hàm SQL riêng của
      PostgreSQL.<br><b>Lỗi 2 — Không dọn sạch bảng DB và Redis <code>flushDb()</code> trong <code>@BeforeEach</code> khi
      dùng Singleton Container:</b> Ca test trước để lại dữ liệu rác làm ca sau gãy ngẫu nhiên!<br><b>Lỗi 3 — Dùng nhãn ảnh
      chung chung như <code>postgres:latest</code>:</b> Máy chạy hôm nay qua nhưng vài tháng sau ảnh cập nhật làm hỏng hành
      vi.</div></td></tr></table>
    say: Ba lỗi trên bảng là những cạm bẫy phổ biến khi đưa kiểm thử thùng chứa vào đường ống tự động. Dùng cơ sở dữ liệu
      bộ nhớ H2 thay thế ở bước nghiệm thu cuối khiến lỗi cú pháp khoá hàng thật lọt ra ngoài môi trường chạy chính. Nếu bật
      dùng chung thùng chứa giữa nhiều ca kiểm mà quên xoá dữ liệu và xả đệm Redis, các ca sau dễ dính trạng thái rác từ ca
      trước. Cuối cùng, luôn ghim mã băm ảnh cố định thay cho thẻ mới nhất để giữ kết quả tái lập. Cũng cần tránh việc tự
      ý thay đổi cấu hình ứng dụng ở vài lớp kiểm thử nhỏ vì làm Spring tạo thêm ngữ cảnh trùng tốn RAM. Hãy dọn sạch dữ liệu
      cả bảng PostgreSQL lẫn khoá Redis ở đầu mỗi lượt chạy thay vì tạo mới toàn bộ máy chứa.
