    say: 'Đáp án câu hai: bắt buộc dọn sạch dữ liệu bảng cơ sở dữ liệu và xả sạch khoá đệm Redis trước mỗi ca kiểm để bảo
      đảm tính độc lập hoàn toàn. Xoá sạch dữ liệu bảng và bộ đệm trước mỗi ca chạy là thói quen bắt buộc khi chia sẻ thùng
      chứa giữa nhiều lớp kiểm thử. Đừng quên xoá sạch theo đúng trình tự ràng buộc khoá ngoại từ bảng bút toán con rồi mới
