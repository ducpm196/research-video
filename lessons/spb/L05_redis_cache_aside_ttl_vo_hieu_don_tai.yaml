    say: Quan sát sơ đồ điều phối hai mươi luồng cùng lúc đòi đọc một khoá số dư vừa hết hạn. Thay vì để cả hai mươi luồng
      cùng ập xuống cơ sở dữ liệu, tất cả đều thử xin khoá phân tán qua lệnh đặt chỉ khi chưa tồn tại trong năm giây. Duy
      nhất một luồng thắng cuộc đi hỏi cơ sở dữ liệu đúng một lần, nạp kết quả kèm hạn sống vào Redis rồi nhả khoá an
      toàn.
    clear: true
  - show: ''
    say: Mười chín luồng còn lại chờ một nhịp ngắn vài chục mi-li-giây rồi đọc lại giá trị mới vừa xuất hiện ngay trên RAM.
      Bản chất của cơ chế một luồng đi hỏi này là đánh đổi vài chục mi-li-giây chờ nhẹ để cứu sống toàn bộ tầng cơ sở dữ
      liệu. Thay vì cả hai mươi luồng cùng thực hiện câu truy vấn giống hệt nhau, chỉ một luồng làm việc nặng và chia sẻ
      kết quả qua RAM.
- id: formula
  kind: formula
  title: Kiểm tra kép (double-check) và giải phóng khoá đúng chủ sở hữu
  checks:
  - 30 + 5 == 35
  steps:
  - show: <div class='box key'><p><b>Hai chi tiết sống còn khi dùng khoá phân tán trên Redis:</b></p><p>1. <b>Kiểm tra kép
      sau khi thắng khoá:</b> Luồng thứ 2 vừa chờ xong vẫn phải gọi lại <code>redis.opsForValue().get(key)</code> trước khi
      chạm DB, tránh tải lặp khi luồng trước vừa ghi xong và nhả khoá.</p><p>2. <b>Gắn mã ngẫu nhiên token khi mở khoá:</b>
      Chỉ xoá <code>lockKey</code> nếu giá trị trong Redis vẫn đúng là <code>token</code> của mình, tránh xoá nhầm khoá của
      luồng khác khi hết <code>EX 5</code>.</p></div>
    say: Hai chi tiết kỹ thuật này quyết định việc khoá phân tán của bạn có chạy sạch dưới tải cao hay không. Sau khi giành
      được khoá, luồng vẫn đọc lại bộ đệm thêm một lượt nữa vì luồng trước có thể vừa nạp xong giá trị mới. Khi giải phóng
      khoá, ta so khớp mã ngẫu nhiên để không bao giờ xoá nhầm khoá mà một luồng mới vừa xin được. Nếu chỉ dùng lệnh xoá khoá
      trần không kiểm tra mã sở hữu, luồng xử lý chậm có thể vô tình xoá mất khoá mới của luồng khác. Sự kết hợp kiểm tra
      kép kết hợp mã sở hữu duy nhất khiến khoá phân tán trên Redis trở nên tin cậy và an toàn tuyệt đối.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Cài đặt BalanceCacheService với StringRedisTemplate và SET NX EX
  checks:
  - 500_000 + 200_000 == 700_000
  steps:
  - show: <p><b>1. Đọc đệm kèm khoá chống dồn tải và TTL có jitter</b></p><div class="code"><div>String cached = redis.opsForValue().get(key);</div><div>if
      (cached != null) return Long.parseLong(cached);</div><div>String lockKey = "lock:bal:" + accId, token = UUID.randomUUID().toString();</div><div>if
      (Boolean.TRUE.equals(redis.opsForValue().setIfAbsent(lockKey, token, Duration.ofSeconds(5)))) {</div><div>  try {</div><div>    String
      again = redis.opsForValue().get(key);</div><div>    if (again != null) return Long.parseLong(again);</div><div>    long
      bal = loadFromDb(accId);</div><div>    long ttl = 30L + ThreadLocalRandom.current().nextInt(6);</div><div>    redis.opsForValue().set(key,
      String.valueOf(bal), Duration.ofSeconds(ttl));</div><div>    return bal;</div><div>  } finally { if (token.equals(redis.opsForValue().get(lockKey)))
      redis.delete(lockKey); }</div><div>}</div></div>
    say: Hãy theo dõi từng dòng của hàm đọc bộ đệm có bảo vệ chống dồn tải trên màn hình. Nếu khoá tồn tại sẵn trên Redis
      thì hàm chuyển sang số nguyên và trả về ngay lập tức. Khi trượt đệm, luồng xin khoá năm giây với chuỗi ngẫu nhiên, kiểm
      tra kép rồi mới đọc cơ sở dữ liệu và nạp đệm ba mươi tới ba mươi lăm giây. Ở nhánh trượt khoá khi luồng khác đang giữ
      khoá đọc dữ liệu, luồng hiện tại thực hiện vòng chờ ngắn hai mươi lăm mi-li-giây rồi thử đọc lại đệm. Nếu sau một vài
      nhịp chờ vẫn chưa có giá trị hoặc hết khoá, luồng kiểm tra lại bộ đệm rồi mới dự phòng đọc từ cơ sở dữ liệu.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>2. Cập nhật DB xong lập tức vô hiệu hoá khoá Redis</b></p><div class="code"><div>@Transactional</div><div>public
      void deposit(String accId, long delta) {</div><div>  Account a = accounts.findById(accId).orElseThrow();</div><div>  a.setBalance(a.getBalance()
      + delta);</div><div>  accounts.saveAndFlush(a);</div><div>  redis.delete("bal:" + accId);</div><div>}</div></div>
    say: Còn ở chiều cập nhật số dư nạp thêm tiền, hàm cộng thẳng vào bản ghi cơ sở dữ liệu và đẩy xuống ngay bằng lệnh lưu
      xả. Ngay sau đó, ta xoá khoá tương ứng trong Redis để lần đọc kế tiếp buộc phải lấy lại số dư mới nhất vừa ghi xong.
      Gọi lệnh lưu xả trước khi xoá khoá Redis bảo đảm thay đổi số dư đã thực sự nằm gọn trong phiên cơ sở dữ liệu đang xử
      lý. Giả sử số dư ban đầu năm trăm nghìn cộng thêm hai trăm nghìn, lần đọc sau không thấy đệm nên nạp đúng bảy trăm nghìn vừa cập nhật.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật trên Redis 8 Testcontainers: Cache Hit, Eviction và 20 luồng Stampede'
  checks:
  - 20 - 1 == 19
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL05Test trên container redis:8</b></p><div class="code"><div>Container redis:8@sha256:1f8829...
      started in PT0.69s</div><div>// 1) Cache Hit: đọc TK1 2 lần liên tiếp → dbReads == 1</div><div>// 2) Write Eviction:
      đọc 500_000 → nạp 200_000 → đọc lại trả ngay 700_000</div><div>// 3) Stampede: 20 luồng đồng loạt đợi CountDownLatch
      rồi gọi getBalance("TK1"):</div><div>//    20/20 trả đúng 500_000, số lần gọi DB giảm còn &lt;= 2 (thay vì 20)</div><div>[INFO]
      Tests run: 4, Failures: 0, Errors: 0</div><div>KiemL05Test: 3 ca, 0 hỏng</div></div>'
    say: Kết quả kiểm thử trên container Redis tám thật xác nhận cả ba kịch bản vận hành trọng yếu đều chạy chính xác. Đọc
      liên tiếp hai lần chỉ chạm xuống cơ sở dữ liệu đúng một lần đầu tiên rồi trúng đệm hoàn toàn ở lần sau. Sau lệnh nạp
      thêm hai trăm nghìn đồng, lần đọc tiếp theo trả ngay con số bảy trăm nghìn nhờ khoá cũ đã bị xoá sạch. Khi thả hai mươi
      luồng cùng lúc vào khoá rỗng, số lượt gọi xuống cơ sở dữ liệu bị chặn gọn còn tối đa hai lần nhờ khoá chống dồn tải.
      Ngoài kiểm chứng trúng đệm và nạp lại sau ghi, bộ đếm số lượt đọc cơ sở dữ liệu xác nhận giảm ít nhất mười lần dưới
      tải đồng thời. Trong điều kiện thực tế có độ trễ mạng ngắn, tối đa chỉ một tới hai luồng chạm cơ sở dữ liệu thay vì
      cả hai mươi luồng.
    focus:
    - 1
    - 2
