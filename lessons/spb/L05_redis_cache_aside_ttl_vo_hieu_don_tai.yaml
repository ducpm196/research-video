    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: lệnh Redis chuỗi đơn giản, hạn sống TTL và SET NX'
  steps:
  - show: <table class='t'><tr><th>lệnh Redis cơ bản</th><th>ý nghĩa thực thi</th></tr><tr><td><code>GET bal:TK1</code> /
      <code>SET ... EX 30</code></td><td>Đọc hoặc ghi chuỗi kèm tự động hết hạn sau 30 giây</td></tr><tr><td><code>DEL bal:TK1</code></td><td>Xoá
      khoá đệm cũ ngay khi số dư gốc thay đổi</td></tr><tr><td><code>SET lock:bal:TK1 tok NX EX 5</code></td><td>Chỉ đặt được
      nếu khoá chưa tồn tại (<code>NX</code>), tự huỷ sau 5 giây</td></tr></table>
    say: Hãy ôn lại ngắn gọn ba thao tác cốt lõi trên kho lưu trữ RAM Redis trước khi ghép vào ứng dụng Java. Lệnh đọc và
      ghi chuỗi luôn cần đi kèm thời gian hết hạn để bộ nhớ RAM không bị phình vô tận theo năm tháng. Lệnh xoá khoá giúp dọn
      sạch giá trị cũ mỗi khi giao dịch thay đổi số dư thật dưới đĩa. Cuối cùng, cờ đặt chỉ khi chưa tồn tại kèm thời gian
      sống là phép toán nguyên tử giúp bầu đúng một luồng đi đọc lại cơ sở dữ liệu. Khác với bộ nhớ cục bộ trong từng máy
      chủ Java, Redis chia sẻ một trạng thái nhất quán chung cho toàn bộ cụm ứng dụng. Lệnh đặt có điều kiện kèm thời gian
      tự huỷ bảo đảm ngay cả khi tiến trình thắng khoá bị treo đột ngột thì hệ thống vẫn tự phục hồi.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Mẫu cache-aside, TTL ngẫu nhiên nhẹ và vô hiệu hoá khi ghi
  steps:
  - show: <table class='t'><tr><th>kỹ thuật đệm</th><th>tác dụng bảo vệ hệ thống</th></tr><tr><td><b>Cache-Aside</b> (Đọc
      đệm trước)</td><td>Trúng đệm trả ngay; trượt mới đọc DB rồi nạp vào Redis</td></tr><tr><td><b>Write-Invalidate</b> (Cập
      nhật DB rồi <code>DEL</code>)</td><td>An toàn hơn ghi đè Redis khi có nhiều luồng cập nhật đồng thời</td></tr><tr><td><b>TTL
      + jitter</b> (ví dụ <code>30 + rand(0..5)</code> s)</td><td>Tránh hàng triệu khoá cùng hết hạn vào đúng một giây</td></tr><tr><td><b>Single-flight
      <code>SET NX EX</code></b></td><td>Chỉ đúng 1 luồng giữ khoá đi hỏi DB, các luồng còn lại chờ đọc đệm mới</td></tr></table>
    say: Bảng này tổng hợp bốn nguyên tắc chuẩn khi vận hành bộ đệm trong hệ thống ngân hàng. Ở chiều đọc, ứng dụng kiểm tra
      Redis trước và chỉ đọc xuống cơ sở dữ liệu khi bị trượt đệm. Ở chiều ghi, ta cập nhật cơ sở dữ liệu xong rồi xoá khoá
      đệm thay vì ghi đè song song, nhờ đó tránh làm sai số dư trên RAM. Thêm vài giây ngẫu nhiên vào hạn sống ngăn bão hết
      hạn hàng loạt, còn khoá phân tán giữ chỉ một luồng làm mới khoá. Chiến lược cập nhật đĩa rồi xoá khoá đệm đơn giản mà
      an toàn hơn nhiều so với cố gắng đồng bộ ghi đè hai nơi. Khi kết hợp độ lệch thời gian hết hạn và khoá đơn luồng, hệ
      thống đứng vững cả khi tải tăng đột biến hàng chục lần.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.4'
    - '1.2'
    - '1.4'
