      TTL.<br><b>Lỗi 2 — Đặt cố định cùng một TTL (ví dụ <code>3600 s</code>) cho hàng trăm nghìn khoá lúc làm ấm:</b> Đúng
      1 giờ sau cả trăm nghìn khoá hết hạn cùng một giây gây bão tải (cache avalanche).<br><b>Lỗi 3 — Dùng chung khoá phân
      tán nhưng không có nhánh chờ/đọc lại:</b> 19 luồng trượt khoá chạy thẳng xuống DB luôn thì khoá trở nên vô nghĩa!</div></td></tr></table>
    say: Ba lỗi trên bảng xảy ra rất phổ biến khi nhóm phát triển mới đưa Redis vào ứng dụng. Lỗi thứ nhất là sửa số dư dưới
      đĩa mà quên lệnh xoá khoá đệm, khiến giao diện vẫn hiển thị số dư cũ gây hoang mang cho người dùng. Lỗi thứ hai là gán
      đúng một hạn sống giống hệt nhau cho toàn bộ tập dữ liệu lớn làm tất cả cùng biến mất vào cùng một thời điểm. Lỗi thứ
      ba là xin khoá trượt nhưng quên cho các luồng thua cuộc chờ một nhịp đọc lại đệm mà để chúng đi thẳng xuống cơ sở dữ
      liệu. Cũng cần cẩn trọng đặt thời gian khoá giữ quyền làm mới vừa đủ lâu hơn thời gian truy vấn thật nhưng ngắn hơn
      ngưỡng chờ của khách. Khi mọi nhánh đọc ghi đều được bọc kiểm thử tự động trên thùng chứa Redis thật, lỗi sai số dư
