scenes:
- id: hook
  kind: hook
  title: 'Khoá số dư nóng vừa hết hạn: 10 000 yêu cầu đồng thời đánh sập DB?'
  checks:
  - 10_000 / 1 == 10_000
  steps:
  - show: <div class='box key'><p>Khi gắn bộ đệm Redis, đọc số dư nhanh gấp hàng chục lần nhờ trúng đệm trên RAM. Nhưng ngay
      khoảnh khắc khoá hết hạn (<code>TTL = 0</code>), hàng nghìn luồng cùng thấy trượt đệm và đồng loạt lao xuống PostgreSQL
      tạo hiệu ứng <b>đập vỡ đệm (cache stampede)</b>.</p><p>Bài này kết hợp <b>cache-aside + xoá đệm sau ghi + TTL lệch pha
      + khoá phân tán <code>SET NX EX</code></b> trên Redis 8 thật.</p></div>
    say: Chào bạn đến với bài năm của khoá Spring Boot thực chiến. Sau khi làm chủ ghi sổ an toàn trên PostgreSQL, bài toán
      hiệu năng tiếp theo nằm ở luồng đọc số dư có tần suất rất cao. Bộ đệm Redis giảm tải hàng chục lần, nhưng nếu thiếu
      lớp chống dồn tải khi khoá nóng hết hạn thì hàng vạn yêu cầu sẽ đánh sập lõi dữ liệu. Hôm nay ta cài đặt trọn vẹn chu
      trình đọc ghi bộ đệm trên container Redis tám thật. Trong giờ cao điểm thanh toán, tần suất đọc số dư thường cao gấp
      hàng chục lần tần suất chuyển tiền thật. Do đó hiểu rõ vòng đời khoá đệm và cơ chế chống bão trượt đệm là kỹ năng bắt
      buộc ở mọi hệ thống lớn.
