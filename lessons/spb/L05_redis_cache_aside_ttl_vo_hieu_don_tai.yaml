- id: quymo
  kind: example
  title: Truy vấn lọt xuống DB ở 100, 10 000 và 100 000 yêu cầu đồng thời
  checks:
  - 100_000 / 1 == 100_000
  steps:
  - show: <table class='t'><tr><th>lưu lượng đồng loạt vào khoá hết hạn</th><th>không chống dồn tải</th><th>có khoá SET NX
      EX + kiểm kép</th></tr><tr><td><b>100 yêu cầu</b></td><td>Tới 100 câu SQL xuống PostgreSQL</td><td><b>1 câu SQL</b>
      (giảm 99%)</td></tr><tr><td><b>10 000 yêu cầu</b></td><td>10 000 câu SQL gây nghẽn bể kết nối</td><td><b>1 câu SQL</b>
      + bản sao chờ ngắn</td></tr><tr><td><b>100 000 yêu cầu</b></td><td>Sập dây chuyền DB (100 000 truy vấn)</td><td><b>1 câu SQL</b> (bảo vệ DB); tải cao cần thêm <b>khoá đệm nóng mãi / L1 cục bộ</b></td></tr></table>
    say: Bảng quy mô so sánh lượng truy vấn đánh thẳng xuống cơ sở dữ liệu ở ba mức một trăm, mười nghìn và một trăm nghìn
      yêu cầu đồng thời. Khi không có lớp chống dồn tải, toàn bộ lưu lượng đổ dồn xuống cơ sở dữ liệu cùng một khoảnh khắc
      làm cạn sạch bể kết nối. Nhờ cơ chế bầu duy nhất một luồng đi nạp lại bộ đệm, dù lưu lượng chạm mốc mười nghìn yêu cầu
      thì cơ sở dữ liệu chỉ phải trả lời đúng một câu truy vấn. Lên tới một trăm nghìn yêu cầu trên một khoá cực nóng, kỹ
      sư thường kết hợp thêm bộ đệm tầng một ngắn hạn trong bộ nhớ máy chủ ứng dụng. Ở quy mô mười nghìn tới một trăm nghìn
      yêu cầu trên cùng một tài khoản quá nóng, ngay cả băng thông Redis đơn lẻ cũng có thể căng thẳng. Lúc đó tầng bộ đệm
      cục bộ ngắn hạn vài trăm mi-li-giây ngay trong RAM ứng dụng đóng vai trò lá chắn đầu tiên cho Redis.
