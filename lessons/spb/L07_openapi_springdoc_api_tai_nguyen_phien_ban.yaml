- id: intuition
  kind: intuition
  title: Tại sao phân trang con trỏ thắng OFFSET và làm sao mở rộng v1 sang v2 không gãy
  steps:
  - show: <div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="30" y="30" width="420" height="72" rx="10" fill="#fee2e2"
      stroke="#dc2626" stroke-width="2"/><text x="240.0" y="60" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">OFFSET
      99 980 (đếm bỏ tuần tự)</text><text x="240.0" y="84" font-size="14" text-anchor="middle" fill="#475569">Đọc rồi vứt
      99 980 dòng + trùng dòng nếu có tin chèn mới</text><rect x="30" y="118" width="420" height="72" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="240.0" y="148" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">Keyset
      Cursor (WHERE id &gt; 5 LIMIT 3)</text><text x="240.0" y="172" font-size="14" text-anchor="middle" fill="#475569">Trả
      thẳng ID 6, 7, 8 và nextCursor=8 ổn định O(log N)</text><rect x="490" y="38" width="440" height="142" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="710.0" y="75" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">Code
      Java → /v3/api-docs (nguồn duy nhất)</text><text x="710.0" y="106" font-size="14" text-anchor="middle" fill="#475569">/api/v1/transfers
      (giữ nguyên tương thích cũ)</text><text x="710.0" y="132" font-size="14" text-anchor="middle" fill="#475569">/api/v2/transfers
      (thêm channel tuỳ chọn, mặc định MOBILE)</text><text x="710.0" y="158" font-size="14" text-anchor="middle" fill="#475569">Đổi
      trường bắt buộc chỉ làm ở đường dẫn mới</text></svg></div>
    say: Quan sát hai nguyên tắc lớn được ghép trên sơ đồ màn hình. Phía bên trái, thay vì bắt cơ sở dữ liệu đếm rồi vứt bỏ
      hàng vạn dòng, điều kiện lớn hơn con trỏ nhảy thẳng trên cây chỉ mục. Phía bên phải, mã nguồn Java tự phát sinh đặc
      tả OpenAPI và luôn đặt giá trị mặc định cho trường mới để máy khách cũ chạy bình thường.
    clear: true
  - show: ''
    say: Ở cách làm cũ dùng vị trí trang đếm bỏ qua, cơ sở dữ liệu phải đếm tuần tự cả triệu dòng đầu tiên trước khi vứt bỏ
      chúng. Ngược lại, truy vấn theo con trỏ tận dụng ngay cây chỉ mục khoá chính nên trang thứ một triệu nhanh hệt trang
      đầu tiên.
- id: formula
  kind: formula
  title: Công thức lát cắt phân trang con trỏ và quy tắc tương thích lược đồ
  checks:
  - 5 + 3 == 8
  steps:
  - show: '<div class=''box key''><p><b>Kỹ thuật lấy <code>limit + 1</code> phần tử để tính <code>hasMore</code> không cần
      <code>SELECT COUNT(*)</code>:</b></p><p>Truy vấn <code>id &gt; cursor</code> lấy tối đa <code>limit + 1</code> dòng.
      Nếu đọc được nhiều hơn <code>limit</code> dòng thì đặt <code>hasMore = true</code>, cắt trả đúng <code>limit</code>
      dòng đầu, và đặt <code>nextCursor = items.last().id</code>.</p><p>Ví dụ với <code>cursor = 5, limit = 3</code> trong
      bảng 50 dòng: lấy 4 dòng <code>6, 7, 8, 9</code> → trả về <code>[6, 7, 8]</code>, <code>nextCursor = 8</code>, <code>hasMore
      = true</code>.</p></div>'
    say: Mẹo lấy dư đúng một phần tử giúp ta loại bỏ hoàn toàn câu truy vấn đếm tổng số dòng vốn rất chậm trên bảng lớn. Khi
      gọi phân trang từ con trỏ năm với giới hạn ba phần tử, ta đọc tối đa bốn phần tử là sáu, bảy, tám và chín. Vì thấy thừa
      phần tử thứ chín, dịch vụ biết chắc chắn vẫn còn trang sau nên trả về ba phần tử đầu kèm con trỏ tiếp theo là tám. Nhờ
      mẹo truy vấn dư đúng một phần tử, giao diện biết chính xác nút chuyển trang kế tiếp có bật hay tắt mà không tốn câu
      đếm. Khi danh sách trả về ít hơn hoặc bằng giới hạn kích thước trang, cờ còn trang tiếp theo gán ngay giá trị sai gọn
      gàng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Mã thật: springdoc OpenAPI + phân trang con trỏ + v2 tương thích ngược'
  checks:
  - 6 + 7 + 8 == 21
  steps:
  - show: '<p><b>1. Đầu cuối GET phân trang con trỏ với chú thích OpenAPI</b></p><div class="code"><div>@GetMapping("/api/v1/transfers")</div><div>@Operation(summary
      = "Phan trang con tro theo ID tang dan")</div><div>@ApiResponse(responseCode = "200", description = "Danh sach giao
      dich sau con tro")</div><div>public CursorPage listByCursor(</div><div>    @RequestParam(name = "cursor", defaultValue
      = "0") long cursor,</div><div>    @RequestParam(name = "limit", defaultValue = "5") int limit) {</div><div>  int safe
      = Math.max(1, Math.min(limit, 20));</div><div>  var slice = STORE.stream().filter(t -&gt; t.id() &gt; cursor).limit(safe
      + 1L).toList();</div><div>  boolean more = slice.size() &gt; safe;</div><div>  var page = more ? slice.subList(0, safe)
      : slice;</div><div>  return new CursorPage(page, page.isEmpty() ? null : page.getLast().id(), more);</div><div>}</div></div>'
    say: Hãy đọc kỹ đoạn mã cài đặt đầu cuối đọc danh sách theo con trỏ có gắn sẵn chú thích OpenAPI. Trước hết ta kẹp tham
      số giới hạn vào khoảng một tới hai mươi để tránh người gọi yêu cầu một lần cả triệu dòng. Sau đó, luồng lọc mục lớn
      hơn con trỏ và lấy dư một phần tử để kiểm tra trang kế tiếp rồi trả về con trỏ cuối. Chú thích đặc tả phản hồi liệt
      kê rõ mã thành công hai trăm cùng mô tả ngắn gọn để đội đối tác đọc hiểu tức thì. Phần thân kết quả trả kèm danh sách
      mục, con trỏ kế tiếp lấy từ phần tử cuối cùng và cờ báo còn dữ liệu.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>2. Nâng cấp v2 giữ trường mới tuỳ chọn (không gãy máy khách v1)</b></p><div class="code"><div>public record
      CreateV2(String fromAccount, String toAccount, long amount, String channel) {}</div><div>@PostMapping("/api/v2/transfers")</div><div>@ResponseStatus(HttpStatus.CREATED)</div><div>@Operation(summary
      = "Tao giao dich v2 giu tuong thich nguoc truong channel tuy chon")</div><div>@ApiResponse(responseCode = "201", description
      = "Tao giao dich thanh cong")</div><div>@ApiResponse(responseCode = "400", description = "Du lieu dau vao khong hop
      le (ProblemDetail)")</div><div>public Map&lt;String, Object&gt; createV2(@RequestBody CreateV2 req) {</div><div>  String
      ch = (req.channel() == null || req.channel().isBlank()) ? "MOBILE" : req.channel();</div><div>  return Map.of("status",
      "ACCEPTED", "amount", req.amount(), "channel", ch);</div><div>}</div></div>'
    say: Còn ở đầu cuối phiên bản hai bên dưới, ta bổ sung trường kênh giao dịch mới nhưng vẫn giữ cơ chế mặc định cho dữ
      liệu cũ. Nếu đối tác chưa kịp cập nhật nên chỉ gửi ba trường truyền thống và bỏ trống tên kênh, dịch vụ tự gán mặc định
      là di động thay vì báo lỗi thiếu trường. Cách nhận trường mới ở dạng tuỳ chọn giúp cả ứng dụng di động phát hành từ
      sáu tháng trước vẫn tạo chuyển khoản bình thường. Trong trường hợp bắt buộc thay đổi kiểu dữ liệu hoặc cắt bỏ trường
      cũ, đường dẫn phiên bản hai tách riêng bảo vệ toàn bộ người dùng cũ.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật Boot 4.1.3 + springdoc 3.2.1: kiểm /v3/api-docs và keyset cursor'
  checks:
  - 8 - 5 == 3
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL07Test qua ./mvnw -B verify</b></p><div class="code"><div>// 1) GET /v3/api-docs →
      200 OK | openapi: "3.1.0", có /api/v1/transfers &amp; /api/v2/transfers</div><div>// 2) GET /api/v1/transfers?cursor=5&amp;limit=3
      → items=[6,7,8], nextCursor=8, hasMore=true</div><div>// 3) POST /api/v2/transfers không gửi trường channel → 201 Created,
      channel="MOBILE"</div><div>[INFO] Tests run: 3, Failures: 0, Errors: 0, Total time: 11.757 s</div><div>ĐÚNG — PASS /d/research-video/labs/SPB/L07
      (du_an maven)</div></div>'
    say: Đầu ra chạy thật của ba ca kiểm thử xác nhận thư viện sinh đặc tả hoạt động trọn vẹn trên Spring Boot bốn chấm một
      chấm ba. Đường dẫn sinh đặc tả trả về đúng chuẩn OpenAPI ba chấm một chứa đầy đủ cả hai phiên bản đường dẫn. Phép thử
      con trỏ trả đúng sáu, bảy, tám vì đã lọc dấu lớn hơn chặt chẽ, còn bản hai tự điền giá trị mặc định. Bốn dòng kiểm thử
      xác nhận phân trang không lặp lại phần tử năm ở ranh giới và cờ còn tiếp theo bật đúng lúc còn dữ liệu sau. Cả đường
      dẫn phiên bản một lẫn phiên bản hai đều xuất hiện đầy đủ trong bản đặc tả API OpenAPI sinh ra từ mã nguồn thật.
    focus:
