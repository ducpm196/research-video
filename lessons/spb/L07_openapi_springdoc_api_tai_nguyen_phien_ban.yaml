- id: sym
  kind: symbol
  title: Bộ chú thích OpenAPI 3, phân trang con trỏ và phiên bản hoá
  steps:
  - show: <table class='t'><tr><th>kỹ thuật / chú thích</th><th>ý nghĩa thực hành</th></tr><tr><td><code>springdoc-openapi
      3.2.1</code></td><td>Tương thích Spring Boot 4.1.x, mở đầu cuối <code>/v3/api-docs</code></td></tr><tr><td><code>@Tag</code>,
      <code>@Operation</code>, <code>@ApiResponse</code></td><td>Gắn mô tả nghiệp vụ và mã trạng thái ngay trên lớp điều khiển</td></tr><tr><td><code>id
      &gt; cursor LIMIT k</code></td><td>Phân trang con trỏ đi thẳng chỉ mục thay vì đếm bỏ bằng <code>OFFSET</code></td></tr><tr><td>Tương
      thích ngược ở <code>v2</code></td><td>Trường mới như <code>channel</code> phải cho phép null với giá trị mặc định</td></tr></table>
    say: Bảng này giải thích bốn mảnh ghép thực chiến khi mở API ra cho nhiều đối tác ngân hàng. Phiên bản thư viện sinh đặc
      tả ba chấm hai chấm một tương thích trực tiếp với Spring Boot bốn chấm một. Ba chú thích đặc tả gắn cạnh hàm điều khiển
      biến ngay mã nguồn thành bản đặc tả JSON chuẩn OpenAPI ba. Kết hợp truy vấn lớn hơn con trỏ và mặc định hoá trường mở
      rộng ở phiên bản mới giúp mọi hệ thống đối tác vừa tra cứu nhanh vừa không gãy kết nối. Cổng đặc tả chuẩn JSON ba chấm
      một còn tự động dựng giao diện thử nghiệm tương tác giúp kiểm thử nhanh từng đầu cuối. Kết hợp điều kiện lọc lớn hơn
      con trỏ bảo đảm thời gian truy vấn ổn định ngay cả khi sổ bút toán phình to hàng chục triệu dòng.
