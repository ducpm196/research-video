- id: quymo
  kind: example
  title: Chi phí sửa đổi hợp đồng API khi số đối tác tích hợp là 1, 10 và 100
  checks:
  - max(1, min(100, 20)) == 20
  steps:
  - show: '<table class=''t''><tr><th>số đối tác dùng chung API</th><th>thay đổi phá vỡ (đổi tên/bắt buộc mới)</th><th>mở
      rộng tương thích ngược (trường tuỳ chọn / v2)</th></tr><tr><td><b>1 đối tác</b> (nội bộ cùng đội)</td><td>Nhờ sửa ngay
      được trong ngày</td><td>Không cần điều phối ghép lịch phát hành</td></tr><tr><td><b>10 đối tác</b> (web, app, ví, merchant)</td><td>Ít
      nhất vài app cũ vỡ khi chờ bản cập nhật cửa hàng</td><td><b>0 giờ gián đoạn</b>: máy khách cũ vẫn chạy v1 bình thường</td></tr><tr><td><b>100
      đối tác</b> (Open Banking)</td><td>Bất khả thi ép mọi bên đổi trong 1 đêm</td><td>Công bố <code>/api/v2</code> + hạn
      ngừng <code>Sunset</code> rõ trên OpenAPI</td></tr></table>'
    say: Bảng quy mô lý giải vì sao tính tương thích ngược là kỷ luật bắt buộc khi số đối tác tăng từ một lên mười và một
      trăm. Khi mới có một đội nội bộ gọi API, ta có thể bàn nhau sửa đồng bộ ngay. Nhưng khi hàng trăm đối tác và ứng dụng
      người dùng đang chạy bản cũ, bất kỳ thay đổi bắt buộc nào trên hợp đồng cũng gây gãy hàng loạt. Giải pháp chuẩn là luôn
      giữ trường mới ở dạng tuỳ chọn hoặc mở đường dẫn phiên bản hai kèm lịch chuyển đổi. Với hàng trăm đối tác ví điện tử
      và ngân hàng liên kết, một thay đổi thiếu tương thích ngược đủ làm tê liệt kênh thanh toán giờ cao điểm. Duy trì song
      song hai phiên bản đường dẫn kèm chính sách ngưng hỗ trợ rõ ràng là kỷ luật tiêu chuẩn của các nền tảng tài chính.
