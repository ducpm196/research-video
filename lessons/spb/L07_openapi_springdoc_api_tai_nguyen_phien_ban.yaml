- id: quiz
  kind: quiz
  title: Kiểm tra nhanh OpenAPI và phân trang con trỏ
  checks:
  - 20 + 1 == 21
  steps:
  - show: <ol><li>Để biết có trang kế tiếp (<code>hasMore</code>) trong phân trang con trỏ kích thước <code>limit = 20</code>
      mà không chạy thêm <code>SELECT COUNT(*)</code>, ta truy vấn tối đa bao nhiêu dòng?</li><li>Muốn thêm trường <code>channel</code>
      vào yêu cầu tạo chuyển khoản mà không làm lỗi máy khách v1 đang chạy, ta phải đặt ràng buộc của trường mới thế nào?</li></ol>
    say: Hãy tự kiểm nhanh hai câu hỏi thực chiến trước phần cài đặt. Câu một, nếu muốn biết còn trang tiếp theo hay không
      ở kích thước hai mươi dòng mà không chạy câu đếm tổng bảng, ta cần truy vấn tối đa bao nhiêu dòng? Câu hai, khi bổ sung
      trường kênh giao dịch mới để giữ tương thích ngược cho đối tác cũ, trường này có được phép bắt buộc có mặt không? Bấm
      tạm dừng và trả lời. Hai câu hỏi này kiểm tra kỹ năng thiết kế phân trang hiệu năng cao và chiến lược tiến hoá hợp đồng
      API an toàn.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Truy vấn <b><code>limit + 1 = 21</code> dòng</b>; nếu
      nhận được 21 dòng thì <code>hasMore = true</code> và chỉ cắt trả 20 dòng đầu.</p></td></tr></table>
    say: 'Đáp án câu một: luôn truy vấn dư một phần tử là hai mươi mốt dòng rồi cắt bỏ phần tử cuối nếu thấy đủ số dư đó.
      Cách lọc lớn hơn chặt chẽ theo mã định danh giữ tốc độ đọc ổn định dù bảng chứa hàng triệu dòng giao dịch. Việc đọc
      dư một phần tử tránh hoàn toàn phép đếm toàn bảng vốn gây chậm dây chuyền khi bảng giao dịch có hàng triệu dòng.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Để <code>channel</code> là <b>tuỳ chọn (nullable)</b>
      kèm giá trị mặc định, hoặc chuyển thay đổi bắt buộc sang đường dẫn phiên bản mới <code>/api/v2/...</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: giữ trường mới ở dạng không bắt buộc và điền giá trị mặc định nếu vắng mặt, hoặc tách hẳn sang đường
      dẫn phiên bản hai. Giữ mọi trường bổ sung ở dạng không bắt buộc là quy tắc vàng bảo vệ ứng dụng di động đang chạy bản
      cũ. Đưa ra thông báo lộ trình ngừng bản cũ tối thiểu vài tháng trước khi tắt hẳn đường dẫn phiên bản một.'
    clear: true
