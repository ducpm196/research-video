objectives:
- Tích hợp springdoc-openapi sinh đặc tả chuẩn OpenAPI 3 và chú thích mã phản hồi cho mọi đầu cuối
- Áp dụng thiết kế API hướng tài nguyên danh từ, phân trang con trỏ và chiến lược phiên bản URI v1/v2 giữ tương thích ngược
- Kiểm tính tương thích ngược giữa hai phiên bản lược đồ khi mở rộng ở 1, 10 và 100 đối tác tích hợp
scenes:
- id: hook
  kind: hook
  title: Đặc tả lạc hậu so với mã nguồn và sửa 1 trường làm sập đối tác?
  checks:
  - len([6, 7, 8]) == 3
  steps:
  - show: <div class='box key'><p>Nếu đặc tả API viết tay bằng văn bản rời rạc, chỉ sau hai tuần sửa mã là đặc tả và dịch
      vụ chạy thật lệch nhau hoàn toàn. Còn nếu bạn tuỳ tiện đổi tên trường hay bắt buộc thêm tham số mới trên đường dẫn cũ,
      hàng chục đối tác đang tích hợp sẽ lỗi ngay lập tức.</p><p>Bài này tích hợp <b>springdoc 3.2.1</b> sinh <code>/v3/api-docs</code>
      trực tiếp từ mã Java kết hợp <b>phân trang con trỏ</b> và <b>nâng cấp v1/v2 an toàn</b>.</p></div>
    say: Chào bạn đến với bài bảy của khoá Spring Boot thực chiến. Một nguyên nhân gây chậm trễ lớn khi nhiều đội cùng làm
      việc là đặc tả giao diện API không khớp với mã nguồn thật. Khi lịch sử dài trăm nghìn dòng hoặc cần thêm tính năng mới,
      thiết kế hợp đồng dữ liệu cẩu thả dễ làm sập ứng dụng máy khách. Hôm nay ta sinh đặc tả OpenAPI tự động từ mã nguồn,
      phân trang theo con trỏ và giữ tương thích ngược khi lên phiên bản mới. Một bản đặc tả API OpenAPI sinh tự động trực
      tiếp từ chú thích Java sẽ luôn phản ánh trung thực từng trường dữ liệu đang chạy. Đồng thời, thiết kế phân trang và
      nâng cấp phiên bản chuẩn giúp mọi đối tác mở rộng dữ liệu mượt mà không cần gián đoạn.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: tài nguyên danh từ, OpenAPI 3 và đường dẫn đặc tả JSON'
  steps:
  - show: <table class='t'><tr><th>quy ước REST thực chiến</th><th>cách đặt chuẩn</th></tr><tr><td>Đường dẫn là danh từ số
      nhiều</td><td><code>GET /api/v1/transfers</code>, không dùng động từ <code>/getTransfers</code></td></tr><tr><td>Đặc
      tả OpenAPI 3 sinh từ mã</td><td>Xuất tự động ở <code>/v3/api-docs</code> qua chú thích Java</td></tr><tr><td>Chiến lược
      nâng cấp an toàn</td><td>Thêm trường tuỳ chọn hoặc tách tiền tố <code>/api/v2/...</code></td></tr></table>
    say: Trước khi cài thư viện mới, ta điểm lại ngắn gọn ba nguyên tắc thiết kế giao diện lập trình chuẩn. Mọi đường dẫn
      tài nguyên đều đặt bằng danh từ số nhiều để phương thức HTTP đóng vai trò hành động. Đặc tả OpenAPI được sinh thẳng
      từ các chú thích cạnh hàm điều khiển nhằm bảo đảm đặc tả luôn sống cùng mã nguồn. Cuối cùng, mọi mở rộng hợp đồng dữ
      liệu phải giữ nguyên khả năng tương thích cho các phiên bản máy khách cũ. Dùng đúng phương thức HTTP đọc và tạo giúp
      tường lửa, bộ đệm trung gian và công cụ kiểm toán phân tích chính xác lưu lượng. Khi nâng cấp sang phiên bản mới mà
      vẫn giữ nguyên đường dẫn cũ, bạn cho phép từng đối tác nâng cấp theo lộ trình riêng.
    focus:
    - 0
    - '1.2'
