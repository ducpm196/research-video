- id: pitfalls
  kind: pitfall
  title: Ba lỗi thiết kế API làm hỏng tích hợp của đối tác
  steps:
  - show: <table class='t'><tr><th>lỗi thiết kế API ngân hàng hay gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 — Phân
      trang con trỏ dùng điều kiện <code>id &gt;= cursor</code> thay vì <code>id &gt; cursor</code>:</b> Lặp lại phần tử cuối
      trang trước ở đầu trang sau.<br><b>Lỗi 2 — Đặt tên đường dẫn bằng động từ như <code>POST /createNewTransfer</code> hoặc
      <code>GET /deleteAccount</code>:</b> Vi phạm quy ước REST, dễ dính cache GET nhầm.<br><b>Lỗi 3 — Dùng phiên bản springdoc
      2.x cũ cho Spring Boot 4:</b> Xung đột gói web gây lỗi không mở được <code>/v3/api-docs</code>.</div></td></tr></table>
    say: Ba lỗi trên bảng thường xuyên gây sự cố ở các hệ thống ngân hàng mở API cho bên thứ ba. Dùng dấu lớn hơn hoặc bằng
      trong truy vấn con trỏ làm trùng lặp phần tử nối giữa hai trang liên tiếp. Đặt động từ làm đường dẫn thay cho danh từ
      phá vỡ ngữ nghĩa bộ đệm và quyền hạn chuẩn của giao thức web. Còn đưa nhầm phiên bản công cụ sinh đặc tả cũ đời hai
      vào Spring Boot bốn sẽ gây lỗi biên dịch ngay khi khởi động. Cần rà soát kỹ phiên bản thư viện sinh bản đặc tả API mỗi
      khi nâng cấp Spring Boot để không kéo theo bản phụ thuộc lỗi thời. Ngoài ra đừng quên trả luôn giá trị con trỏ kế tiếp
      bằng rỗng khi đã tới cuối tập dữ liệu để máy khách dừng gọi tiếp.
