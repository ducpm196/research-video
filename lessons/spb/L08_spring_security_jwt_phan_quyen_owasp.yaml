- id: quymo
  kind: example
  title: Tỉ lệ chặn tại cửa bảo mật ở 10, 1 000 và 100 000 yêu cầu
  checks:
  - 100_000 - 95_000 == 5_000
  steps:
  - show: <table class='t'><tr><th>lưu lượng dò quyền (95% tấn công + 5% hợp lệ)</th><th>chi phí tại cửa FilterChain</th><th>tài
      nguyên lõi nghiệp vụ tiết kiệm</th></tr><tr><td><b>10 yêu cầu</b> (làm tròn 9,5/0,5 → 9 sai + 1 đúng)</td><td>Chặn 9 lượt trên RAM (&lt;
      0,2 ms)</td><td>Chỉ 1 yêu cầu chạm DB tài khoản</td></tr><tr><td><b>1 000 yêu cầu</b> (950 sai + 50 đúng)</td><td>950
      lượt dừng ngay ở 401/403 (0 SQL)</td><td>Tiết kiệm 950 phiên giao dịch DB</td></tr><tr><td><b>100 000 yêu cầu</b> (95
      000 dò quét)</td><td>Tỉ lệ chặn hợp lệ đạt <b>100% mã sai</b> trên RAM</td><td>Tránh kẹt ổ khoá DB; cần ghép <b>rate
      limit ở Gateway/Redis</b></td></tr></table>
    say: Bảng quy mô cho thấy lợi ích bảo vệ lõi dữ liệu khi cửa bảo mật lọc sạch lưu lượng tấn công ở ba mức mười, một nghìn
      và trăm nghìn. Giả sử chín mươi lăm phần trăm lưu lượng là dò quét trái phép, cả chín mươi lăm nghìn lượt xấu bị chặn
      trên bộ nhớ trước khi chạm cơ sở dữ liệu. Ở quy mô trăm nghìn lượt dò quét mỗi giây, lớp ứng dụng thường ghép thêm bộ
      đếm giới hạn tốc độ và Redis để giảm tải xác minh. Ở tải một nghìn và trăm nghìn lượt dò quét mỗi giây, xác minh mật
      mã tại RAM giúp tầng cơ sở dữ liệu hoàn toàn không chịu áp lực. Kết hợp thêm giới hạn tốc độ theo địa chỉ và thu hồi
      thẻ bị lộ trên Redis sẽ bảo vệ cổng API trước các đợt tấn công tự động.
