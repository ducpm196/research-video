- id: pitfalls
  kind: pitfall
  title: Ba lỗ hổng bảo mật hay sót trên Spring Security
  steps:
  - show: <table class='t'><tr><th>sai lầm bảo mật chết người ở backend Java</th></tr><tr><td><div class='box warn'><b>Lỗi
      1 — Để nguyên CSRF nhưng lại chặn nhầm API không dùng cookie phiên, hoặc tắt bừa cả trên web form:</b> Phải phân rõ
      API phi trạng thái qua Header hay phiên Cookie.<br><b>Lỗi 2 — Chỉ kiểm <code>hasRole("TELLER")</code> ở URL mà quên
      kiểm sở hữu tài khoản trong hàm xử lý:</b> Sót hoàn toàn lỗ hổng BOLA.<br><b>Lỗi 3 — Quên gọi <code>SecurityContextHolder.clearContext()</code>
      khi chữ ký sai:</b> Có nguy cơ sót danh tính cũ nếu luồng tái sử dụng không sạch.</div></td></tr></table>
    say: Ba lỗi trên bảng đều từng xuất hiện trong các đợt đánh giá an toàn thông tin thực tế. Lạm dụng tắt tính năng bảo
      vệ mù quáng hoặc bỏ qua phân biệt nguồn xác thực qua tiêu đề và bánh quy sẽ gây hổng hoặc chặn nhầm người dùng thật.
      Chỉ kiểm tra vai trò chung chung trên đường dẫn mà bỏ quên bước đối chiếu chủ sở hữu tài nguyên để hở toàn bộ dữ liệu
      giữa các tài khoản cùng quyền. Cuối cùng, luôn xoá sạch ngữ cảnh bảo mật mỗi khi bắt được thẻ hỏng để không bao giờ
      rò rỉ phiên giữa các yêu cầu nối tiếp. Không dùng khoá bí mật ngắn hơn hai trăm năm mươi sáu bít cho thuật toán băm
      đối xứng vì rất dễ bị dò tìm bằng phần cứng mạnh. Luôn gắn kiểm thử riêng cho từng vai trò lẫn ca chuyển chéo tài khoản
      trong mỗi lần bổ sung đầu cuối mới.
