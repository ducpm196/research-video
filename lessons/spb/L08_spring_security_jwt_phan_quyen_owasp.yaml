      quyền truy cập ngay trước khi chạm dữ liệu đóng kín lỗ hổng đánh tráo mã tài khoản của người khác. Khi người dùng làm
      mới lại thẻ hợp lệ và gửi kèm tiêu đề chuẩn thì yêu cầu sẽ vượt qua bộ lọc cửa vào.'
