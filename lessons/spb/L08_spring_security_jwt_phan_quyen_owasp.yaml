scenes:
- id: hook
  kind: hook
  title: Đăng nhập xong vẫn đổi mã TK nguồn để rút trộm tiền người khác?
  checks:
  - 256 // 8 == 32
  steps:
  - show: '<div class=''box key''><p>Rất nhiều ứng dụng kiểm tra xong chữ ký thẻ truy cập ở cổng ngoài (<i>Authentication</i>)
      rồi tin tưởng tuyệt đối vào thân yêu cầu bên trong: người dùng <b>An</b> cầm thẻ hợp lệ nhưng sửa <code>fromAccount</code>
      thành <b>TK-BINH</b> vẫn chuyển được tiền của người khác!</p><p>Đó là lỗ hổng số 1 bảng OWASP API: <b>BOLA</b> (Broken
      Object Level Authorization) mà Spring Security phải chặn kèm kiểm quyền sở hữu.</p></div>'
    say: Chào bạn đến với bài tám của khoá Spring Boot thực chiến. Nhiều kỹ sư cho rằng chỉ cần gắn Spring Security kiểm tra
      thẻ hợp lệ ở ngoài cổng là dịch vụ đã an toàn tuyệt đối. Thực tế kẻ xấu có thể đăng nhập chính tài khoản hợp lệ của
      họ rồi tự đổi mã tài khoản nguồn trong gói tin để rút tiền người khác. Bài học hôm nay cài đặt chuỗi bảo mật phi trạng
      thái phân biệt rõ xác thực, phân quyền vai trò và chặn đứng truy cập chéo. Xác thực danh tính chỉ trả lời câu hỏi bạn
      là ai, còn uỷ quyền mới quyết định bạn có quyền chạm vào tài khoản cụ thể nào. Khép kín cả chuỗi lọc phi trạng thái
      và kiểm tra chủ sở hữu tại tầng nghiệp vụ mới chặn được tấn công đánh tráo mã nguồn.
    focus:
