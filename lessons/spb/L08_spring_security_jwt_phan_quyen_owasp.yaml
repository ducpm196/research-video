- id: sym
  kind: symbol
  title: Năm lỗ hổng OWASP backend Java và cách phòng chống bằng Security
  steps:
  - show: <table class='t'><tr><th>lỗ hổng OWASP phổ biến</th><th>biểu hiện sai</th><th>biện pháp chặn chuẩn Spring</th></tr><tr><td><b>1.
      BOLA (API1)</b></td><td>Chỉ kiểm vai trò, không kiểm chủ tài khoản</td><td>So <code>owner.equals(auth.getName())</code>
      ở tầng xử lý</td></tr><tr><td><b>2. Broken Auth (API2)</b></td><td>Tin payload trước khi kiểm chữ ký hay quên <code>exp</code></td><td>Kiểm
      chữ ký thời gian hằng <code>MessageDigest.isEqual</code> + kiểm <code>exp</code></td></tr><tr><td><b>3. BOPLA / Mass
      Assignment</b></td><td>Nhận thẳng thực thể DB có trường nhạy cảm</td><td>Dùng <code>record</code> DTO tối giản chỉ đúng
      trường cần thiết</td></tr><tr><td><b>4. Security Misconfiguration</b></td><td>Trả stack trace chi tiết hoặc mở rộng
      <code>permitAll()</code></td><td>Chính sách mặc định <code>denyAll()</code> + ẩn dấu vết lỗi</td></tr><tr><td><b>5.
      Injection (SQLi)</b></td><td>Cộng chuỗi SQL bằng tay trong truy vấn</td><td>Luôn dùng tham số ràng buộc <code>:id</code>
      trong JPA / JDBC</td></tr></table>
    say: Bảng này tổng hợp năm lỗ hổng OWASP phổ biến nhất trên hệ thống backend Java cùng cách bịt kín tương ứng. Hai lỗ
      hổng đứng đầu là cho phép truy cập chéo đối tượng người khác và xác thực thẻ sơ sài bỏ qua thời hạn hay sai chữ ký.
      Ba lỗ hổng tiếp theo là lọt trường nhạy cảm vì thiếu DTO, lộ chi tiết lỗi hệ thống và ghép chuỗi SQL thủ công. Trong
      năm rủi ro hàng đầu, lỗ hổng truy cập chéo đối tượng luôn đứng vị trí số một vì bộ lọc đường dẫn tự động không kiểm
      giúp ta. Kết hợp DTO tối giản, tắt dấu vết lỗi thô và câu lệnh tham số hoá sẽ khép kín nốt ba rủi ro phổ biến còn lại.
