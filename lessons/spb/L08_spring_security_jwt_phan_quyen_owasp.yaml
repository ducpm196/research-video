- id: formula
  kind: formula
  title: Nguyên tắc xác minh thẻ thời gian hằng và mặc định từ chối denyAll
  checks:
  - 256 // 8 == 32
  steps:
  - show: <div class='box key'><p><b>Hai kỷ luật mật mã và cấu hình trong Spring Security:</b></p><p>1. <b>So sánh chữ ký
      theo thời gian hằng:</b> dùng <code>MessageDigest.isEqual(expected, got)</code> (khoá HMAC-SHA256 dài tối thiểu <b>256
      bit = 32 byte</b>), tuyệt đối không dùng <code>String.equals</code> dễ rò rỉ độ trễ theo từng ký tự.</p><p>2. <b>Nguyên
      tắc chặn mặc định:</b> dòng cuối cùng của <code>authorizeHttpRequests</code> luôn là <code>.anyRequest().denyAll()</code>
      thay cho <code>authenticated()</code> hay <code>permitAll()</code>.</p></div>
    say: Hai quy tắc này bảo vệ dịch vụ ngay cả khi sau này nhóm phát triển thêm nhiều đường dẫn mới. Khi so sánh chữ ký mật
      mã ở cửa vào, hàm so sánh từng byte theo thời gian không đổi ngăn kẻ xấu đo thời gian để đoán chữ ký. Cấu hình phân
      quyền luôn chốt bằng lệnh từ chối mọi đường dẫn chưa khai báo buộc người viết phải mở quyền rõ ràng. Hàm so sánh chữ
      ký cố định thời gian duyệt hết mọi phần tử byte nên kẻ tấn công không thể suy đoán từng ký tự mã băm. Lệnh khoá mặc
      định mọi đường dẫn chưa khai báo là rào chắn cuối cùng chống quên cấu hình bảo mật cho API mới thêm.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Mã thật: JwtAuthFilter, SecurityFilterChain và chặn BOLA tại Controller'
  checks:
  - 1000 - 950 == 50
  steps:
  - show: <p><b>1. Cấu hình SecurityFilterChain phi trạng thái</b></p><div class="code"><div>@Bean SecurityFilterChain chain(HttpSecurity
      http, JwtAuthFilter f) {</div><div>  return http.csrf(c -&gt; c.disable())</div><div>    .sessionManagement(s -&gt;
      s.sessionCreationPolicy(STATELESS))</div><div>    .exceptionHandling(e -&gt; e.authenticationEntryPoint(</div><div>      new
      HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED)))</div><div>    .authorizeHttpRequests(reg -&gt; reg</div><div>      .requestMatchers(POST,
      "/api/v1/transfers").hasRole("TELLER")</div><div>      .anyRequest().denyAll())</div><div>    .addFilterBefore(f, UsernamePasswordAuthenticationFilter.class)</div><div>    .build();</div><div>}</div></div>
    say: Đoạn mã thứ nhất thiết lập trọn vẹn chuỗi bộ lọc bảo mật phi trạng thái của Spring Security. Ta tắt lưu phiên máy
      chủ, trả mã bốn trăm linh một khi thiếu danh tính và buộc yêu cầu chuyển khoản mang vai trò giao dịch viên. Bộ lọc kiểm
      thẻ của riêng ta được chèn đứng ngay trước bộ lọc tên người dùng mật khẩu chuẩn. Phía sau cấu hình chuỗi lọc bảo mật,
      lớp dịch vụ thẻ tách phần tải dữ liệu, giải mã chữ ký thuật toán băm và đối chiếu hạn dùng. Đồng thời lớp lọc chạy đúng
      một lần mỗi yêu cầu tự động đọc tiêu đề uỷ quyền, xác minh qua dịch vụ thẻ rồi xoá sạch ngữ cảnh khi sai.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>2. Xác thực chữ ký HMAC (JwtService) và lọc mỗi yêu cầu (JwtAuthFilter)</b></p><div class="code"><div>String expSig = hmac(parts[0] + "." + parts[1]); // HmacSHA256</div><div>if (!MessageDigest.isEqual(expSig.getBytes(), parts[2].getBytes())) throw ...;</div><div>if (Instant.now().getEpochSecond() &gt; exp) throw new IllegalArgumentException("Expired");</div><div>// JwtAuthFilter (OncePerRequestFilter): gắn quyền "ROLE_" + c.role()</div><div>try { var c = jwt.verify(auth.substring(7)); setAuth(c); }</div><div>catch (Exception e) { SecurityContextHolder.clearContext(); }</div></div>'
    say: Đoạn mã thứ hai cài đặt dịch vụ xác thực chữ ký và bộ lọc chạy một lần mỗi yêu cầu. Dịch vụ tách ba phần của thẻ, tính lại chữ ký HmacSHA256, so khớp từng byte theo thời gian không đổi rồi đối chiếu hạn dùng. Nếu hợp lệ bộ lọc gắn danh tính kèm tiền tố ROLE vào ngữ cảnh; nếu sai thì xoá sạch ngữ cảnh để tránh rò rỉ.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>3. Chặn BOLA ngay tại đầu cuối xử lý nghiệp vụ</b></p><div class="code"><div>@PostMapping("/api/v1/transfers")</div><div>public
      ResponseEntity&lt;?&gt; transfer(@RequestBody Cmd cmd,</div><div>    Authentication auth) {</div><div>  String owner
      = OWNERS.get(cmd.fromAccount());</div><div>  if (owner == null || !owner.equals(auth.getName())) {</div><div>    return
      ResponseEntity.status(HttpStatus.FORBIDDEN)</div><div>      .body(Map.of("error", "Khong co quyen tren tai khoan nguon"));</div><div>  }</div><div>  return
      ResponseEntity.status(HttpStatus.CREATED)</div><div>    .body(Map.of("status", "ACCEPTED", "amount", cmd.amount()));</div><div>}</div></div>
    say: Tiếp theo ở lớp điều khiển chuyển khoản, hệ thống đối chiếu trực tiếp tên chủ sở hữu của tài khoản nguồn với danh
      tính rút ra từ thẻ đã xác thực. Nếu giao dịch viên An mang thẻ hợp lệ nhưng cố chuyển tiền từ tài khoản của Bình, máy
      chủ trả ngay mã bốn trăm linh ba từ chối mà không để lộ dấu vết nội bộ nào. Nhờ ngữ cảnh bảo mật đã được bộ lọc gắn
      tên chủ thẻ tin cậy, lớp điều khiển đối chiếu trực tiếp tên đó với chủ tài khoản nguồn. Điều này chặn tuyệt đối tình
      huống một giao dịch viên hợp lệ tự ý chuyển tiền từ tài khoản của đồng nghiệp hay khách hàng.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy Boot 4.1.3 Security: 401 thẻ sai, 403 BOLA và 201 chính chủ'
  checks:
  - 10 - 9 == 1
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL08Test qua ./mvnw -B verify</b></p><div class="code"><div>// 1) Không gửi thẻ / sửa
      1 ký tự chữ ký / thẻ quá hạn exp → HTTP 401 Unauthorized</div><div>// 2) Thẻ vai trò VIEWER gọi POST /api/v1/transfers
      → HTTP 403 Forbidden</div><div>// 3) Thẻ TELLER "an" gọi chuyển từ "TK-BINH" (BOLA) → HTTP 403 Forbidden</div><div>//
      4) Thẻ TELLER "an" gọi chuyển từ "TK-AN" → HTTP 201 Created {"status":"ACCEPTED"}</div><div>[INFO] Tests run: 4, Failures:
      0, Errors: 0</div><div>ĐÚNG — PASS /d/research-video/labs/SPB/L08 (du_an maven)</div></div>'
    say: Đầu ra chạy thật của bốn ca kiểm thử bảo mật xác nhận từng chốt chặn đều hành xử chính xác từng mã lỗi. Thiếu thẻ,
      thẻ bị sửa chữ ký hay thẻ hết hạn đều bị chặn ngay ở đầu vào với mã bốn trăm linh một vì ngữ cảnh bảo mật đã xoá sạch.
      Người dùng mang thẻ người xem hoặc gọi chéo sang tài khoản người khác đều nhận mã bốn trăm linh ba từ chối tuyệt đối.
      Bốn ca kiểm thử chạy trực tiếp qua chuỗi bộ lọc Spring Security thật chứ không bỏ qua tầng bảo vệ bằng giả lập lỏng
      lẻo. Mọi đường dẫn ngoài danh sách cho phép hoặc thiếu chữ ký hợp lệ đều nhận mã từ chối chuẩn trước khi chạm vào nghiệp
      vụ.
    focus:
