- id: prereq
  kind: prereq
  title: 'Ôn nhanh: phân biệt mã 401, mã 403 và chuỗi bộ lọc Servlet'
  steps:
  - show: <table class='t'><tr><th>khái niệm bảo mật web</th><th>ý nghĩa chính xác</th></tr><tr><td><b>401 Unauthorized</b>
      (Chưa xác thực)</td><td>Thiếu thẻ, sai chữ ký hoặc thẻ đã quá hạn sử dụng</td></tr><tr><td><b>403 Forbidden</b> (Không
      đủ quyền)</td><td>Đã biết danh tính nhưng vai trò hay chủ sở hữu không được phép</td></tr><tr><td>Phi trạng thái (Stateless)</td><td>Không
      lưu phiên trên RAM; mỗi yêu cầu tự mang theo thẻ đã ký</td></tr></table>
    say: Hãy ôn ngắn gọn ba khái niệm bảo mật nền tảng để không nhầm lẫn hai mã lỗi rất hay bị đảo cho nhau. Mã bốn trăm linh
      một có nghĩa hệ thống chưa xác minh được danh tính vì người gọi thiếu thẻ, làm giả chữ ký hoặc đưa thẻ quá hạn. Ngược
      lại, mã bốn trăm linh ba nghĩa là thẻ hợp lệ nhưng vai trò của người đó không đủ quyền hoặc đang nhòm ngó tài sản của
      người khác. Toàn bộ xác thực chạy phi trạng thái để máy chủ không phải đồng bộ bộ nhớ phiên. Phân tách rạch ròi mã lỗi
      xác thực và phân quyền giúp phía khách biết ngay phải làm mới thẻ hay báo không đủ quyền truy cập. Nhờ không giữ trạng
      thái phiên trên bộ nhớ máy chủ, mọi bản sao dịch vụ chuyển khoản có thể xử lý bất kỳ yêu cầu nào.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.4'
