assumes: []
objectives:
- Viết tệp di trú lược đồ Flyway V1 chạy trên PostgreSQL 17 thật kèm chỉ mục khoá chính và khoá ngoại
- Đo số câu SQL phát sinh của vấn đề 1+N khi đọc danh sách tài khoản và sửa bằng EntityGraph/JOIN FETCH
- Tính tổng lượt khứ hồi mạng giữa ứng dụng và PostgreSQL ở 10, 1 000 và 100 000 tài khoản
scenes:
- id: hook
  kind: hook
  title: Chỉ một màn hình danh sách tài khoản mà bắn tới 21 câu SQL sang PostgreSQL?
  checks:
  - alg.spb_n_plus_one(20) == (21, 1)
  steps:
  - show: <div class='box key'><p>Khi bạn đọc danh sách <b>20 tài khoản</b> bằng hàm có sẵn rồi duyệt lấy nhật ký của từng
      tài khoản, trình ánh xạ quan hệ có thể phát sinh âm thầm tới <b>21 câu SQL</b> (1 câu lấy danh sách + 20 câu đọc con)!</p><p>Khi
      dữ liệu lên tới 10 000 tài khoản, dịch vụ bỗng treo cứng vì hàng chục nghìn vòng khứ hồi mạng tới PostgreSQL.</p></div>
    say: Chào bạn đến với bài ba của khoá Spring Boot thực chiến. Từ bài này trở đi, dự án rời bỏ bộ nhớ tạm để chạy trên
      cơ sở dữ liệu PostgreSQL thật bật tự động qua Docker. Nhiều hệ thống chạy mượt với vài tài khoản thử nhưng đổ sập khi
      ra thật chỉ vì lỗi truy vấn một cộng N ẩn sau mã gọi hàm. Hôm nay ta quản lý cấu trúc bảng chuẩn bằng di trú Flyway
      và đo số câu SQL thật để dập tắt tận gốc lỗi một cộng N. Nếu chỉ dùng cơ sở dữ liệu thử nghiệm trên bộ nhớ, nhiều lỗi
      cấu trúc bảng và truy vấn chậm sẽ ẩn mình tới ngày vận hành thật. Sử dụng container PostgreSQL thật giúp bạn bắt tận
      tay từng câu truy vấn thừa ngay trên máy cá nhân.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: ánh xạ bảng sang đối tượng JPA và khoá ngoại PostgreSQL'
  steps:
  - show: <table class='t'><tr><th>khái niệm nền</th><th>cơ chế khi chạy thật với JPA</th></tr><tr><td>Ánh xạ thực thể JPA</td><td>Gắn
      mỗi hàng bảng <code>accounts</code> với một đối tượng Java</td></tr><tr><td>Quan hệ một–nhiều (1–N)</td><td>Một tài
      khoản sở hữu danh sách bút toán ở bảng con</td></tr><tr><td>Kiểm tra cấu trúc bảng</td><td>Khoá <code>ddl-auto=validate</code>
      để không cho ứng dụng tự sửa bảng</td></tr></table>
    say: Trước khi đếm câu SQL thật, ta điểm lại nhanh ba nguyên tắc làm việc với tầng lưu trữ quan hệ. Một bảng trong cơ
      sở dữ liệu được ánh xạ sang một lớp thực thể và các dòng bút toán con trỏ về tài khoản cha qua khoá ngoại. Trên hệ thống
      thật, ta tuyệt đối tắt chế độ tự động sửa bảng của thư viện ánh xạ mà buộc nó kiểm tra khớp cấu trúc sẵn có. Nhờ vậy,
      mọi thay đổi bảng đều có lịch sử rõ ràng trước khi ứng dụng khởi động. Thực thể tài khoản giữ danh sách bút toán con
      kèm khai báo ánh xạ ngược về khoá ngoại giúp duyệt hai chiều thuận tiện. Mỗi thay đổi bảng đều đi qua tệp phiên bản
      đánh số rõ ràng để môi trường thử nghiệm và sản xuất hoàn toàn đồng nhất.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Ba mảnh ghép PostgreSQL 17, Flyway và cách tải dữ liệu quan hệ
  steps:
  - show: <table class='t'><tr><th>thành phần / chú thích</th><th>vai trò khi chạy PostgreSQL 17 thật</th></tr><tr><td><code>V1__init.sql</code>
      (Flyway)</td><td>Quản lý phiên bản lược đồ SQL theo thứ tự tăng dần không sửa ngược</td></tr><tr><td><code>FetchType.LAZY</code>
      (mặc định hợp lý)</td><td>Chỉ tải danh sách con khi đụng tới, nhưng gây <b>1+N</b> nếu lặp mà không gộp</td></tr><tr><td><code>LEFT
      JOIN FETCH</code> / <code>@EntityGraph</code></td><td>Nối bảng tải trọn cha và con chỉ trong <b>đúng 1 câu SQL</b></td></tr></table>
    say: Bảng này giải thích ba công cụ giúp tầng dữ liệu vừa an toàn vừa nhanh. Thứ nhất, các tệp di trú đánh số phiên bản
      từ V1 trở đi chạy theo đúng trình tự ngay khi ứng dụng khởi động trên PostgreSQL. Thứ hai, chế độ tải lười giữ nhẹ bộ
      nhớ khi chỉ cần đọc thông tin cha, nhưng nếu vòng lặp lại đọc thêm trường con thì phát sinh ngay N câu truy vấn lẻ.
      Thứ ba, câu lệnh tải gộp một lượt hoặc chú thích biểu đồ thực thể cho phép gom toàn bộ về đúng một lần hỏi cơ sở dữ
      liệu. Đặt chế độ tải lười ở lớp thực thể làm mặc định an toàn vì không phải màn hình nào cũng cần đọc toàn bộ lịch sử
      bút toán. Khi thực sự cần danh sách con cho màn hình tổng hợp, câu lệnh tải gộp sẽ hợp nhất dữ liệu ngay trong một truy
      vấn duy nhất.
    focus:
