- id: pitfalls
  kind: pitfall
  title: Ba lỗi hay gặp với Flyway, Hibernate và tải dữ liệu quan hệ
  steps:
  - show: <table class='t'><tr><th>lỗi phổ biến khi dùng JPA + Flyway</th></tr><tr><td><div class='box warn'><b>Lỗi 1 — Sửa
      trực tiếp tệp <code>V1__init.sql</code> đã chạy trên môi trường khác:</b> Flyway báo lệch mã băm checksum và từ chối
      khởi động! Thay đổi mới phải tạo tệp <code>V2__...sql</code>.<br><b>Lỗi 2 — Dùng <code>FetchType.EAGER</code> để chữa
      cháy N+1:</b> Làm mọi truy vấn đơn giản đều kéo theo bảng con dù không cần dùng tới.<br><b>Lỗi 3 — Kết hợp <code>JOIN
      FETCH</code> một-nhiều cùng phân trang <code>Pageable</code>:</b> Hibernate cảnh báo <code>HHH90003004</code> và tải
      hết cả bảng lên RAM để cắt trang!</div></td></tr></table>
    say: 'Ba cái bẫy trên bảng đều khiến ứng dụng gặp lỗi khi lên môi trường sản xuất. Thứ nhất, tuyệt đối không sửa ngược
      tệp di trú V1 sau khi đã áp dụng mà phải luôn thêm tệp V2 mới vì Flyway kiểm tra dấu băm từng tệp. Thứ hai, không chuyển
