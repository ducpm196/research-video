- id: intuition
  kind: intuition
  title: 'Hình dung khứ hồi mạng: 1 + 20 chuyến xe lẻ so với 1 chuyến gộp'
  steps:
  - show: <div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="35" y="25" width="390" height="72" rx="10" fill="#fee2e2"
      stroke="#dc2626" stroke-width="2"/><text x="230.0" y="56" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">Tải
      lười trong vòng lặp (1 + N)</text><text x="230.0" y="80" font-size="14" text-anchor="middle" fill="#475569">1 SELECT
      accounts + 20 SELECT entries = 21 khứ hồi</text><rect x="35" y="115" width="390" height="72" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="230.0" y="146" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">JOIN
      FETCH / @EntityGraph</text><text x="230.0" y="170" font-size="14" text-anchor="middle" fill="#475569">1 SELECT LEFT
      JOIN duy nhất = 1 khứ hồi</text><line x1="425" y1="61" x2="540" y2="95" stroke="#dc2626" stroke-width="2"/><line x1="425"
      y1="151" x2="540" y2="115" stroke="#16a34a" stroke-width="2"/><rect x="540" y="50" width="375" height="108" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="727.5" y="92" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">PostgreSQL 17 Container</text><text x="727.5" y="122" font-size="15" text-anchor="middle" fill="#475569">Kiểm
      đếm bằng Hibernate Statistics</text></svg></div>
    say: Hãy tưởng tượng sự khác biệt giữa hai đường trên sơ đồ như hai cách chở hàng. Ở đường đỏ bên trên, ứng dụng lấy hai
      mươi tài khoản về trước rồi mở từng tài khoản đi hỏi lại PostgreSQL, thành ra tốn hai mươi mốt chuyến. Ở đường xanh
      bên dưới, một câu lệnh nối bảng duy nhất gom trọn cả tài khoản lẫn bút toán trong đúng một chuyến khứ hồi.
    clear: true
  - show: ''
    say: Mỗi chuyến khứ hồi qua mạng nội bộ đều mang theo chi phí đóng mở gói tin và chờ lập lịch của bộ xử lý truy vấn. Do
      đó rút hai mươi mốt chuyến xuống còn một chuyến duy nhất làm giảm đáng kể độ trễ đuôi của toàn bộ dịch vụ.
- id: formula
  kind: formula
  title: Công thức số lần hỏi cơ sở dữ liệu theo kích thước danh sách N
  checks:
  - alg.spb_n_plus_one(20) == (21, 1)
  - alg.spb_n_plus_one(1000) == (1001, 1)
  steps:
  - show: <div class='box key'><p>Với $N$ tài khoản cần đọc kèm danh sách bút toán con:</p><p>Tải lười lặp tuần tự phát sinh
      đúng <b>$1 + N$</b> câu lệnh SQL (20 tài khoản = <b>21 câu</b>; 1 000 tài khoản = <b>1 001 câu</b>).</p><p>Dùng <code>SELECT
      DISTINCT a FROM Account a LEFT JOIN FETCH a.entries</code> rút gọn cố định còn <b>1 câu</b> duy nhất bất kể $N$.</p></div>
    say: Công thức toán học của lỗi một cộng N rất dễ nhớ và tỉ lệ thuận trực tiếp với số lượng bản ghi. Với hai mươi tài
      khoản cần hai mươi mốt truy vấn, còn với một nghìn tài khoản thì số lượt đi về nhảy vọt lên một nghìn không trăm lẻ
      một. Khi thay bằng câu truy vấn nối tải gộp, tổng số chuyến khứ hồi mạng giảm xuống hằng số một không đổi theo N. Mức
      tiết kiệm mạng tăng theo cấp số nhân mỗi khi kích thước trang hoặc số tài khoản hiển thị đồng loạt tăng lên. Lưu ý từ
      khoá lọc trùng bảo đảm tập kết quả trả về không nhân bản lặp lại đối tượng cha khi tài khoản có nhiều dòng bút toán.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Tệp di trú Flyway khởi tạo bảng và truy vấn tải gộp JPA
  checks:
  - 1 + 20 == 21
  steps:
  - show: <p><b>1. Tệp di trú <code>src/main/resources/db/migration/V1__init.sql</code></b></p><div class="code"><div>CREATE
      TABLE accounts (</div><div>  id VARCHAR(32) PRIMARY KEY,</div><div>  owner_name VARCHAR(120) NOT NULL,</div><div>  balance
      BIGINT NOT NULL</div><div>);</div><div>CREATE TABLE journal_entries (</div><div>  id BIGINT GENERATED BY DEFAULT AS
      IDENTITY PRIMARY KEY,</div><div>  account_id VARCHAR(32) NOT NULL REFERENCES accounts(id),</div><div>  delta BIGINT
      NOT NULL</div><div>);</div><div>CREATE INDEX idx_journal_account ON journal_entries(account_id);</div></div>
    say: Nhìn vào tệp SQL tạo bảng đặt trong thư mục di trú chuẩn của Flyway. Ta tạo khoá chính cho bảng tài khoản, ràng buộc
      khoá ngoại cho bảng bút toán con và gắn thêm một chỉ mục ngay trên cột khoá ngoại đó. Vì PostgreSQL không tự đánh chỉ
      mục cho cột khoá ngoại ở bảng con, câu lệnh tạo chỉ mục này rất quan trọng giúp phép nối bảng không phải quét toàn bộ
      bảng bút toán. Chỉ mục trên cột khoá ngoại giúp công cụ lập lịch cơ sở dữ liệu tra nhanh các bút toán của từng tài khoản
      khi nối bảng. Cột mã định danh tự tăng ở bảng bút toán và ràng buộc không trống bảo vệ tính toàn vẹn tham chiếu ngay
      từ tầng lưu trữ.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: <p><b>2. Kho dữ liệu JPA bổ sung truy vấn tải gộp kèm sắp xếp</b></p><div class="code"><div>public interface AccountRepository
      extends JpaRepository&lt;Account, String&gt; {</div><div>  @Query("SELECT DISTINCT a FROM Account a LEFT JOIN FETCH
      a.entries ORDER BY a.id")</div><div>  List&lt;Account&gt; findAllWithEntries();</div><div>}</div><div>// application.properties:</div><div>//
      spring.jpa.hibernate.ddl-auto=validate</div><div>// spring.jpa.properties.hibernate.generate_statistics=true</div></div>
    say: Bên phía lớp kho dữ liệu Java, ta giữ nguyên tải lười ở thực thể nhưng khai báo thêm một truy vấn đặt tên rõ dùng
      lệnh nối tải gộp. Đồng thời trong tệp cấu hình, ta khoá kiểm tra cấu trúc ở mức xác thực và bật bộ đếm thống kê câu
      lệnh chuẩn bị sẵn. Nhờ bộ đếm này, bài kiểm thử tự động có thể khẳng định chính xác có bao nhiêu câu SQL thực sự đi
      qua mạng. Nhớ rằng trên lớp thực thể tài khoản, mối quan hệ một nhiều giữ chế độ tải lười làm mặc định gọn nhẹ. Khi
      chạy kiểm thử tích hợp với Testcontainers, mọi bài kiểm kế thừa lớp cơ sở bật container PostgreSQL dùng chung cho tốc
      độ cao.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật trên PostgreSQL 17 Testcontainers: 21 SQL vs 1 SQL'
  checks:
  - 21 - 1 == 20
  steps:
  - show: '<p><b>Kết quả đo thống kê SQL thật trên PostgreSQL 17-alpine</b></p><div class="code"><div>Container postgres:17-alpine@sha256:d3244e...
      started in PT2.43s</div><div>// 20 accounts + 20 journal_entries, chạy trên PostgreSQL 17 qua Flyway:</div><div>// accounts.findAll()
      + getEntries().size() → PrepareStatementCount &gt;= 21</div><div>// accounts.findAllWithEntries() → PrepareStatementCount
      == 1</div><div>[INFO] Tests run: 4, Failures: 0, Errors: 0, Total time: ~20 s</div><div>KiemL03Test: 3 ca, 0 hỏng</div></div>'
    say: Kết quả chạy thật trên container PostgreSQL mười bảy chứng minh chính xác lý thuyết vừa phân tích. Container cơ sở
      dữ liệu khởi động xong trong khoảng hai phẩy bốn giây và Flyway chạy sạch tệp di trú V1 ngay lúc bật ứng dụng. Trên
      tập hai mươi tài khoản, đọc lười tốn hai mươi mốt câu lệnh, còn tải gộp chỉ gửi đúng một truy vấn vì đã nối bảng ngay
      ở máy chủ. Chênh lệch giữa hai mươi mốt câu lệnh và đúng một câu lệnh được khẳng định bằng bộ đếm chuẩn của thư viện
      ánh xạ. Điều này chứng minh không cần phải sửa cấu trúc tải lười mặc định mà vẫn giải quyết dứt điểm nút thắt truy vấn.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Tổng lượt khứ hồi mạng ở 10, 1 000 và 100 000 tài khoản
  checks:
  - alg.spb_n_plus_one(10) == (11, 1)
  - alg.spb_n_plus_one(1000) == (1001, 1)
  - alg.spb_n_plus_one(100_000) == (100_001, 1)
  steps:
  - show: <table class='t'><tr><th>số tài khoản cần đọc</th><th>lỗi 1+N (1 + N khứ hồi mạng)</th><th>JOIN FETCH (cố định)</th></tr><tr><td><b>10
      tài khoản</b></td><td>11 khứ hồi (~2 ms — dễ bỏ sót!)</td><td><b>1 khứ hồi</b></td></tr><tr><td><b>1 000 tài khoản</b></td><td>1
      001 khứ hồi (~150–400 ms trễ mạng LAN)</td><td><b>1 khứ hồi</b></td></tr><tr><td><b>100 000 tài khoản</b></td><td>100
      001 khứ hồi (<b>15–40 giây</b>, sập timeout)</td><td>Cần kết hợp <b>phân trang khoá con trỏ</b> theo lô</td></tr></table>
    say: Nhìn bảng quy mô để thấy vì sao lỗi một cộng N rất khó phát hiện lúc phát triển nhưng lại chết người khi vận hành.
      Ở mười tài khoản thử nghiệm, mười một vòng hỏi đáp trên máy cá nhân chỉ tốn vài mi-li-giây nên không ai để ý. Lên tới
      một nghìn tài khoản, một nghìn không trăm lẻ một vòng qua mạng nội bộ làm phản hồi chậm vài trăm mi-li-giây. Tới quy
      mô một trăm nghìn tài khoản, hơn một trăm nghìn vòng khứ hồi gây nghẽn toàn bộ kênh nối nên ta buộc phải vừa tải gộp
      vừa phân trang theo lô nhỏ. Mười một câu lệnh ở mẫu thử nhỏ trông vô hại nhưng chính nó che giấu quả bom hẹn giờ khi
      dữ liệu thật tăng gấp nghìn lần. Kết hợp tải gộp cùng phân trang theo khoá con trỏ giữ kích thước mỗi lô trả về nhỏ
      gọn và thời gian phản hồi ổn định.
