source: curriculum/spb.yaml L04; labs/SPB/L04 (chạy thật ./mvnw -B verify trên PostgreSQL 17 Testcontainers)
assumes: []
objectives:
- Cài đặt giao dịch bút toán kép hai dòng nợ có có tổng đại số bằng không trong một lần chốt
- Chọn khoá bi quan PESSIMISTIC_WRITE theo thứ tự mã tăng dần so với khoá lạc quan dùng cột Version
- Chặn trừ tiền hai lần bằng bảng Idempotency-Key có ràng buộc UNIQUE trên PostgreSQL
- Đo số giao dịch thất bại do xung đột khoá lạc quan khi tỉ lệ tranh chấp tăng 2, 20 và 200 luồng
scenes:
- id: hook
  kind: hook
  title: 'Hai luồng chuyển ngược chiều và gửi lặp yêu cầu: giữ đúng sổ thế nào?'
  checks:
  - alg.spb_double_entry_sum([-300_000, 300_000]) == 0
  steps:
  - show: '<div class=''box key''><p>Trong hệ thống chuyển khoản thật, ba rủi ro xảy ra cùng một lúc: <b>trừ tiền hai lần</b>
      khi mạng thử lại, <b>sai lệch số dư</b> khi hai luồng đọc rồi ghi đè nhau, và <b>bế tắc cơ sở dữ liệu</b> khi A chuyển
      sang B đồng thời B chuyển sang A.</p><p>Giải pháp chuẩn trên PostgreSQL: <b>bút toán kép + khoá bi quan sắp xếp ID +
      bảng Idempotency-Key</b>.</p></div>'
    say: Chào bạn đến với bài bốn của khoá Spring Boot thực chiến. Khi nhiều khách hàng cùng bấm chuyển tiền đồng thời hoặc
      khi mạng di động gửi lặp cùng một lệnh thanh toán, lỗi cập nhật đè nhau và trừ tiền hai lần xảy ra ngay lập tức. Tệ
      hơn nữa, nếu hai giao dịch ngược chiều khoá hai hàng tài khoản theo thứ tự trái ngược nhau, cơ sở dữ liệu rơi vào trạng
      thái bế tắc đứng im. Hôm nay ta cài đặt đầy đủ sổ cái hai dòng nợ có, khoá chống bế tắc theo thứ tự tăng dần và bảng
      khử trùng trên PostgreSQL thật. Chỉ cần một lỗ hổng tranh chấp đồng thời, hệ thống chuyển khoản có thể tự tạo ra tiền
      ảo hoặc thất thoát vốn thật. Ba chốt bảo vệ trong bài học này phối hợp khép kín ngay trong một giao dịch trên cơ sở
      dữ liệu PostgreSQL.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: nguyên lý bút toán kép và khoá khử trùng lũy đẳng'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm kế toán / phân tán</th><th>áp dụng vào cơ sở dữ liệu</th></tr><tr><td>Bút
      toán kép (Double-entry)</td><td>Mỗi giao dịch luôn sinh ít nhất hai dòng: ghi nợ âm và ghi có dương, tổng luôn bằng
      0</td></tr><tr><td>Tính lũy đẳng (Idempotency)</td><td>Cùng một khoá yêu cầu gửi lại N lần chỉ làm biến đổi trạng thái
      sổ đúng 1 lần</td></tr><tr><td>Khoá hàng SQL</td><td>Ngăn giao dịch khác sửa đổi hàng đang tính toán tới khi chốt hoặc
      hoàn tác</td></tr></table>'
    say: Hãy điểm lại ngắn gọn ba nguyên lý nền bạn đã biết trước khi viết vào mã Java thật. Nguyên lý bút toán kép đòi hỏi
      mỗi đồng trừ ở tài khoản nguồn phải có một dòng dương tương ứng ở tài khoản đích để tổng toàn bộ sổ luôn bằng không.
      Tính lũy đẳng bảo đảm dù ứng dụng khách có gửi lặp một yêu cầu tới mười lần thì kết quả vẫn hệt như chạy một lần. Cuối
      cùng, cơ chế khoá hàng buộc các luồng chạy cùng thời điểm phải xếp hàng tuần tự tại điểm tranh chấp. Trong kiểm toán
      ngân hàng, mọi chỉnh sửa đều ghi thành dòng bút toán mới chứ tuyệt đối không xoá hay sửa lén dòng cũ. Khi ghép cùng
      khoá khử trùng lưu bền dưới đĩa, yêu cầu thử lại do rớt mạng chỉ nhận lại kết quả đã chốt an toàn.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Khoá bi quan (pessimistic write) so với khoá lạc quan (@Version)
  steps:
  - show: <table class='t'><tr><th>chiến lược khoá</th><th>câu lệnh SQL thật</th><th>khi nào chọn</th></tr><tr><td><b>Khoá
      bi quan</b> (<code>PESSIMISTIC_WRITE</code>)</td><td><code>SELECT ... FOR UPDATE</code> giữ khoá hàng tới khi chốt</td><td>Tranh
      chấp ghi cao trên cùng tài khoản nóng (chuyển khoản)</td></tr><tr><td><b>Khoá lạc quan</b> (<code>@Version</code>)</td><td><code>UPDATE
      ... SET version = v + 1 WHERE version = v</code></td><td>Đọc nhiều ghi ít; lỗi ném <code>OptimisticLockException</code>
      để thử lại</td></tr><tr><td><b>Khử trùng bền</b> (<code>idempotency_keys</code>)</td><td><code>idem_key VARCHAR(64)
      PRIMARY KEY</code> trên PostgreSQL</td><td>Mọi API thanh toán chấp nhận mạng thử lại tự động</td></tr></table>
    say: Bảng này đối chiếu hai chiến lược khoá tranh chấp và bảng khoá khử trùng trên PostgreSQL. Khoá bi quan chèn câu lệnh
      chọn để cập nhật ngay lúc đọc, bắt luồng sau chờ luồng trước chốt xong nên không ghi đè mất tiền. Còn khoá lạc quan
      dùng cột phiên bản nên rất nhẹ khi ít đụng độ, nhưng sẽ ném ngoại lệ nếu hai luồng cùng sửa một hàng. Bảng khoá lũy
      đẳng có ràng buộc duy nhất luôn là lớp bảo vệ bắt buộc cho mọi lệnh tạo giao dịch. Khoá bi quan giữ chặt hàng dữ liệu
      ngay từ lúc đọc nên thích hợp cho các tài khoản ví tổng có tần suất ghi dày đặc. Cột phiên bản dùng cho khoá lạc quan
      đi kèm sẵn trên bảng giúp bạn linh hoạt chọn chiến lược khi mức tranh chấp thay đổi.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.1'
    - '1.2'
    clear: true
- id: intuition
  kind: intuition
  title: 'Cách phá vỡ bế tắc hai luồng ngược chiều: luôn khoá ID nhỏ trước ID lớn'
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="30" y="30" width="390" height="72" rx="10" fill="#fee2e2"
      stroke="#dc2626" stroke-width="2"/><text x="225.0" y="60" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">Khoá
      không theo thứ tự → BẾ TẮC</text><text x="225.0" y="84" font-size="14" text-anchor="middle" fill="#475569">Luồng 1:
      giữ TK1 đợi TK2 | Luồng 2: giữ TK2 đợi TK1</text><rect x="30" y="118" width="390" height="72" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="225.0" y="148" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">Sắp
      xếp ID tăng dần → AN TOÀN</text><text x="225.0" y="172" font-size="14" text-anchor="middle" fill="#475569">Cả hai luồng
      đều xin khoá TK1 trước, TK2 sau</text><rect x="465" y="42" width="465" height="132" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="2"/><text x="697.5" y="78" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">Bút toán
      kép &amp; Khử trùng trong 1 TX</text><text x="697.5" y="108" font-size="14" text-anchor="middle" fill="#475569">1. Kiểm
      bảng idempotency_keys → có sẵn trả txId cũ</text><text x="697.5" y="133" font-size="14" text-anchor="middle" fill="#475569">2.
      Khoá min(from, to) rồi max(from, to)</text><text x="697.5" y="158" font-size="14" text-anchor="middle" fill="#475569">3.
      Lưu 2 dòng journal (-amt, +amt) và lưu idem_key</text></svg></div>'
    say: Quan sát cơ chế triệt tiêu hoàn toàn chu trình chờ nhau gây bế tắc trên sơ đồ bên trái. Nếu luồng một khoá tài khoản
      một đợi hai còn luồng hai làm ngược lại, cả hai đứng chờ nhau vĩnh viễn tới khi bị huỷ một bên. Quy tắc vàng là so
      sánh thứ tự chữ cái của hai mã tài khoản và buộc mọi luồng luôn xin khoá mã nhỏ trước rồi mới xin mã lớn.
    clear: true
  - show: ''
    say: Kết hợp kiểm bảng khử trùng và ghi hai dòng âm dương trong cùng giao dịch giúp toàn sổ luôn khớp tuyệt đối. Bằng
      cách sắp xếp cố định thứ tự xin khoá, đồ thị phụ thuộc giữa các giao dịch không bao giờ khép thành vòng tròn kín. Dù
      có hàng chục luồng giao dịch đối đầu cùng lúc, luồng nắm giữ mã nhỏ hơn luôn chốt xong và nhả đường cho luồng kế
      tiếp.
- id: formula
  kind: formula
  title: Bất biến bảo toàn tổng bằng 0 và quy tắc xếp thứ tự khoá
  checks:
  - alg.spb_double_entry_sum([-300_000, 300_000, -150_000, 150_000]) == 0
  steps:
  - show: '<div class=''box key''><p><b>Bất biến sổ cái bút toán kép cho mọi giao dịch $k$ chuyển số tiền $a_k > 0$:</b></p><p>Mỗi
      lệnh ghi đúng 2 dòng <code>(-a_k)</code> và <code>(+a_k)</code> nên $\sum_{\text{toàn sổ}} \text{amount} = 0$ ở mọi
      thời điểm.</p><p>Với ví dụ chuyển <b>300 000</b> gửi lặp 2 lần cùng một <code>Idempotency-Key</code>: số dư chỉ trừ
      <b>1 lần</b> (1 000 000 → 700 000), phản hồi trả lại cùng một <code>txId</code> và bảng bút toán chỉ có đúng <b>2 dòng</b>
      có tổng <code>-300 000 + 300 000 = 0</code>.</p></div>'
    say: Bất biến đại số của bút toán kép đóng vai trò thước đo liêm chính cho toàn hệ thống tài chính. Bất kể có bao nhiêu
      nghìn lượt chuyển tiền chạy qua trong ngày, tổng cộng toàn bộ cột số tiền trên bảng bút toán phải luôn bằng không. Vì
      kiểm tra khoá lũy đẳng từ đầu, yêu cầu chuyển ba trăm nghìn gửi lặp chỉ trừ tiền một lần và trả lại đúng mã giao dịch
      cũ. Tổng đại số bằng không trở thành bài kiểm chứng toán học đơn giản nhưng cực mạnh cho mọi bộ kiểm thử tự động. Ngoài
      việc bảo toàn tổng số dư, mã giao dịch trả lại ở lần gọi trùng phải khớp từng ký tự với giao dịch gốc ban đầu.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.1'
    - '1.3'
    clear: true
    introduces:
    - sub
    - sum
- id: example
  kind: example
  title: Cài đặt khoá bi quan sắp xếp thứ tự, bút toán kép và bảng Idempotency-Key
  checks:
  - 1_000_000 - 300_000 == 700_000
  steps:
  - show: <p><b>1. Kho dữ liệu với khoá bi quan và lược đồ Flyway</b></p><div class="code"><div>public interface AccountRepo
      extends JpaRepository&lt;Account, String&gt; {</div><div>  @Lock(LockModeType.PESSIMISTIC_WRITE)</div><div>  @Query("SELECT
      a FROM Account a WHERE a.id = :id")</div><div>  Optional&lt;Account&gt; findForUpdate(@Param("id") String id);</div><div>}</div><div>//
      V1__ledger.sql:</div><div>// accounts(id PK, balance BIGINT, version BIGINT)</div><div>// idempotency_keys(idem_key
      VARCHAR(64) PK, tx_id, amount)</div></div>
    say: Hãy xem cách khai báo khoá bi quan gọn gàng ngay trong giao diện kho dữ liệu JPA. Chú thích khoá ghi bi quan khiến
      Hibernate phát câu truy vấn kèm mệnh đề chờ cập nhật xuống PostgreSQL. Bảng tài khoản cũng giữ sẵn cột phiên bản hỗ
      trợ khoá lạc quan, song hành với bảng khoá khử trùng có ràng buộc duy nhất. Chú ý mệnh đề chọn để cập nhật chỉ phát
      huy đúng hiệu lực khi chạy bên trong một giao dịch đang mở của Spring. Bảng khoá khử trùng cũng lưu lại mã giao dịch
      và số tiền để sẵn sàng trả lời ngay nếu máy khách gọi lại.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>2. Dịch vụ Idempotency-Key, khoá thứ tự ID và bút toán kép</b></p><div class="code"><div>@Transactional</div><div>public
      String transfer(String k, String from, String to, long amt) {</div><div>  var old = idems.findById(k);</div><div>  if
      (old.isPresent()) return old.get().getTxId();</div><div>  String a = from.compareTo(to) &lt;= 0 ? from : to;</div><div>  String
      b = a.equals(from) ? to : from;</div><div>  Account x = accounts.findForUpdate(a).orElseThrow();</div><div>  Account
      y = accounts.findForUpdate(b).orElseThrow();</div><div>  Account src = from.equals(a) ? x : y, dst = from.equals(a)
      ? y : x;</div><div>  if (src.getBalance() &lt; amt || amt &lt;= 0) throw new IllegalStateException();</div><div>  src.setBalance(src.getBalance()-amt);
      dst.setBalance(dst.getBalance()+amt);</div><div>  journals.save(new JournalEntry(txId, from, -amt));</div><div>  journals.save(new
      JournalEntry(txId, to, +amt));</div><div>  idems.save(new IdempotencyRecord(k, txId, amt)); return txId;</div><div>}</div></div>'
    say: Nhìn trọn quy trình xử lý trong một giao dịch duy nhất ở tầng dịch vụ. Bước một tra ngay khoá lũy đẳng xem yêu cầu
      này đã thực hiện trước đó hay chưa để hoàn trả kết quả cũ. Bước hai chọn mã nhỏ hơn khoá trước rồi mới khoá mã lớn hơn
      nhằm loại bỏ mọi khả năng kẹt chéo hai chiều. Bước ba mới kiểm tra số dư, cập nhật tài khoản, lưu hai dòng âm dương
      vào sổ bút toán và lưu khoá khử trùng cùng một lúc. Để ý cách so sánh thứ tự chữ cái của hai mã tài khoản nhằm ánh xạ
      đúng vào hai đối tượng nguồn và đích sau khi đã khoá. Khi giao dịch chốt thành công, mã giao dịch duy nhất vừa tạo được
      lưu vào cả bảng bút toán lẫn bảng khử trùng cùng lúc.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật PostgreSQL 17: phát lại Idempotency-Key và 10 luồng ngược chiều'
  checks:
  - 1_000_000 + 1_000_000 == 2_000_000
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL04Test trên PostgreSQL 17 Testcontainers</b></p><div class="code"><div>// Seed: TK1
      = 1_000_000, TK2 = 1_000_000</div><div>// 1) Gửi lặp 2 lần idemKey="k-dup-1" chuyển 300_000:</div><div>//    tx1 ==
      tx2, TK1 = 700_000, TK2 = 1_300_000, SUM(journal) = 0 (2 dòng)</div><div>// 2) 10 luồng ngược chiều (5 TK1→TK2, 5 TK2→TK1)
      chạy đồng thời trên 4 luồng:</div><div>//    0 deadlock, TK1 = 1_000_000, TK2 = 1_000_000, SUM(journal) = 0</div><div>[INFO]
      Tests run: 4, Failures: 0, Errors: 0</div><div>KiemL04Test: 3 ca, 0 hỏng</div></div>'
    say: Kết quả chạy kiểm thử thật trên PostgreSQL mười bảy chứng minh cả ba lớp bảo vệ đều hoạt động hoàn hảo. Khi gọi hai
      lần liên tiếp cùng một khoá khử trùng, hệ thống trả về đúng một mã giao dịch vì khoá chính đã ngăn lưu trùng. Trong
      kịch bản mười luồng chuyển tiền ngược chiều trên bốn luồng xử lý, không có bế tắc nào và tổng tiền giữ nguyên hai triệu
      đồng. Ngoài ra ca kiểm thứ ba cũng xác nhận cột phiên bản tăng lên một ngay sau một giao dịch cập nhật thành công. Mọi kiểm tra trên cơ sở dữ liệu thật cho thấy không có bất kỳ ngoại lệ bế tắc hay mất đồng bộ nào phát sinh.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Tỉ lệ xung đột khoá lạc quan và lựa chọn chiến lược ở 2, 20 và 200 luồng
  checks:
  - 2 * 1 // 2 == 1 and 20 * 19 // 2 == 190 and 200 * 199 // 2 == 19900
  - 200 > 20 and 20 > 2
  steps:
