  title: Ba sai lầm làm thủng sổ cái và bế tắc giao dịch
  steps:
  - show: <table class='t'><tr><th>lỗi kỹ thuật nghiêm trọng ở sổ cái ngân hàng</th></tr><tr><td><div class='box warn'><b>Lỗi
