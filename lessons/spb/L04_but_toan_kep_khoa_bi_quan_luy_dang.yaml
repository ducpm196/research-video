id: L04
course: SPB
series: SPB · Spring Boot thực chiến với PostgreSQL, Redis và Kafka
title: Bài 4 — Sổ cái bút toán kép, khoá bi quan, khoá lạc quan và Idempotency-Key
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
af2: true
