      trên PostgreSQL.<br><b>Lỗi 2 — Kiểm tra khoá khử trùng chỉ bằng HashMap trong bộ nhớ RAM:</b> Khởi động lại dịch vụ
      hoặc chạy nhiều bản sao container sẽ làm mất sạch khoá.<br><b>Lỗi 3 — Chỉ kiểm idempotency bằng câu SELECT rồi INSERT
      trên ứng dụng không có ràng buộc UNIQUE:</b> Hai luồng song song đều thấy trống và cùng trừ tiền!</div></td></tr></table>
    say: Ba lỗi trên bảng là nguyên nhân hàng đầu dẫn tới thâm hụt tiền hoặc treo giao dịch ở hệ thống thật. Thứ nhất, khoá
      theo vai trò gửi rồi nhận thay vì so sánh mã sẽ mở cửa cho bế tắc ngay khi có giao dịch hai chiều. Thứ hai, lưu tập
      khoá khử trùng trên bộ nhớ cục bộ khiến cụm gồm nhiều máy chủ chạy không thấy nhau. Thứ ba, nếu không có ràng buộc duy
      nhất ngay ở tầng PostgreSQL thì hai yêu cầu bắn vào đúng cùng một phần nghìn giây sẽ cùng vượt qua bước kiểm tra đọc.
      Đừng bao giờ tách bước kiểm khoá khử trùng và bước lưu giao dịch ra làm hai phiên tách rời vì dễ bị chèn giữa chừng.
