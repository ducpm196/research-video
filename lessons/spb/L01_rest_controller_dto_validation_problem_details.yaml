- id: pitfalls
  kind: pitfall
  title: Ba lỗi hay gặp khi viết RestController và xử lý lỗi
  steps:
  - show: <table class='t'><tr><th>lỗi kỹ thuật thường gặp ở tầng web</th></tr><tr><td><div class='box warn'><b>Lỗi 1 — Khai
      báo ràng buộc trong DTO nhưng quên chữ <code>@Valid</code> ở tham số <code>@RequestBody</code>:</b> Yêu cầu <code>amount
      = 0</code> vẫn lọt thẳng qua trả HTTP 201!<br><b>Lỗi 2 — Dùng thực thể JPA làm DTO đầu vào:</b> Kẻ xấu gửi thêm trường
      nhạy cảm dẫn đến ghi đè dữ liệu không phép.<br><b>Lỗi 3 — Tự ghép chuỗi JSON lỗi hoặc lộ stack trace hệ thống:</b> Làm
      lộ cấu trúc thư viện nội bộ (rủi ro bảo mật OWASP).</div></td></tr></table>
    say: Ba cái bẫy trên bảng xuất hiện thường xuyên trong mã của người mới chuyển từ bài tập nhỏ sang dự án thật. Quên một
      từ khoá kiểm hợp lệ ngay trước tham số khiến toàn bộ ràng buộc khai báo trong bản ghi trở thành vô nghĩa và cho số tiền
      âm đi qua cổng. Đưa thẳng thực thể bảng ra nhận dữ liệu bên ngoài hay in dấu vết ngăn xếp ra phản hồi đều mở đường cho
      lỗ hổng bảo mật. Ngoài ra, đừng bao giờ trả chuỗi lỗi tự chế khác nhau ở từng hàm điều khiển vì sẽ làm vỡ bộ giải mã
      chung phía ứng dụng di động. Hãy luôn kiểm tra phạm vi gói thư viện kiểm định trong cấu hình dựng để chú thích hợp lệ
      thực sự được kích hoạt.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tầng Web và RFC 9457
  checks:
  - 400 != 201
  - 200 + 1 == 201
  steps:
  - show: '<ol><li>Một yêu cầu gửi <code>amount: -500</code> vào <code>POST /api/v1/transfers</code> nhưng bạn quên đặt <code>@Valid</code>
      trước <code>@RequestBody</code>. Hệ thống sẽ trả về mã trạng thái nào?</li><li>Đầu ra chuẩn RFC 9457 dùng kiểu nội dung
      (Content-Type) gì và có những trường cơ bản nào?</li></ol>'
    say: Trước khi sang phần tự làm, hãy tự trả lời nhanh hai câu hỏi kiểm hiểu. Câu một, nếu bản ghi DTO đã khai báo số dương
      nhưng hàm điều khiển quên chữ kiểm hợp lệ ở tham số, yêu cầu âm năm trăm sẽ nhận mã trạng thái nào? Câu hai, tiêu đề
      loại nội dung và các trường cơ bản của chuẩn báo lỗi RFC chín bốn năm bảy là gì? Bấm tạm dừng và trả lời. Hãy nhớ lại
      cơ chế hoạt động của chú thích kích hoạt kiểm định và tên loại nội dung chuẩn quốc tế.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Trả nhầm <code>201 Created</code> (lọt dữ liệu bẩn)
      vì Bean Validation chỉ chạy khi có <code>@Valid</code> tại tham số đầu cuối.</p></td></tr></table>
    say: 'Đáp án câu một: hàm vẫn chạy bình thường và trả nhầm mã hai trăm linh một vì thiếu công tắc kích hoạt kiểm tra.
      Nhờ tách biệt ngay từ tầng vào, mọi lỗi định dạng đều trả về đồng nhất giúp máy khách xử lý chính xác. Vì vậy, bài kiểm
      thử từ chối dữ liệu bẩn là bước bắt buộc cho mọi đầu cuối POST mới viết.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Kiểu nội dung <code>application/problem+json</code>
      với các trường chuẩn <code>type, title, status, detail</code> (và thuộc tính mở rộng như <code>errors</code>).</p></td></tr></table>
    say: 'Đáp án câu hai: phản hồi dùng loại nội dung lỗi chuẩn JSON kèm bốn trường tiêu chuẩn là loại, tiêu đề, mã trạng
      thái và chi tiết. Nhờ chuẩn hoá bốn trường lỗi cơ bản, đội giao diện dễ dàng hiển thị cảnh báo đúng ngay bên dưới ô
      nhập liệu. Ngoài bốn trường gốc, chuẩn này cho phép gắn thêm danh sách lỗi từng trường làm thuộc tính mở rộng hợp lệ.'
    clear: true
- id: practice
  kind: practice
  title: Cài đặt đầu cuối tạo chuyển khoản và xử lý lỗi RFC 9457
  lab: labs/SPB/L01
  steps:
  - show: <div class='box key'><p><b>Thực hành bài L01 (<code>labs/SPB/L01/de.md</code>):</b> tạo <code>TransferRequest(fromAccount,
      toAccount, amount)</code> kiểm <code>@NotBlank</code> và <code>@Positive</code>; mở <code>POST /api/v1/transfers</code>
      trả <code>201</code> với <code>TransferResponse</code>; thêm <code>@RestControllerAdvice</code> trả <code>ProblemDetail</code>
      HTTP 400 (kèm trường <code>errors</code>), rồi chấm:</p><p><code>bash labs/cham.sh SPB L01 duong_dan/du_an_cua_ban</code></p></div>
    say: Hãy mở tệp đề bài L01 để cài đặt trọn vẹn ba thành phần bản ghi bất biến, bộ điều khiển và bộ xử lý lỗi tập trung.
      Chú ý kiểm đủ bốn kịch bản gồm yêu cầu hợp lệ, số tiền bằng không, số tiền âm và tài khoản rỗng. Bấm tạm dừng và tự
      hoàn thành trước khi xem kết quả chấm. Hãy bảo đảm lớp bản ghi phản hồi trả đủ ba trường mã giao dịch, trạng thái và
      số tiền như đầu cuối yêu cầu. Đặt chú thích tư vấn điều khiển trên lớp xử lý ngoại lệ để gom mọi lỗi nhập liệu về đúng
      một khuôn chuẩn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
    pause: 30
  - show: '<p><b>Kết quả chấm bộ kiểm KiemL01Test (4 kịch bản thật qua MockMvc)</b></p><div class="code"><div>KiemL01Test:
      4 ca, 0 hỏng</div></div>'
    say: Màn hình hiển thị kết quả nghiệm thu bốn ca kiểm thử của bài một với không ca hỏng. Khi cả bốn ca từ hợp lệ đến các
      trường sai đều trả đúng mã và khuôn lỗi chuẩn, trình chấm mới báo đạt. Mỗi kịch bản lỗi đều được kiểm tra đồng thời
      cả mã trạng thái HTTP, tiêu đề nội dung lẫn mảng chi tiết trường sai.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L01:</b> (1) nhớ thêm starter <code>spring-boot-starter-validation</code>
      (và <code>-validation-test</code>) vào <code>pom.xml</code>; (2) gắn đủ <code>@Valid</code> trước <code>@RequestBody</code>;
      (3) dùng <code>ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, ...)</code> trong <code>@RestControllerAdvice</code>.</p></div>'
    say: Nếu bài nộp còn trả mã hai trăm linh một cho yêu cầu lỗi hoặc thiếu trường mảng chi tiết, hãy rà lại ba gợi ý trên
      màn hình. Bảo đảm đã khai báo phụ thuộc kiểm định vào cấu hình dựng và gắn đủ chú thích kích hoạt tại tham số thân yêu
      cầu. Lưu ý đường dẫn định danh loại lỗi phải hợp lệ cú pháp địa chỉ định danh để không phát sinh ngoại lệ phân tích
      khi tạo đối tượng chi tiết lỗi.
    focus:
    - 0
    - 1
    - 1
    clear: true
- id: recap
  kind: recap
  title: Tổng kết tầng Web an toàn với Bean Validation và Problem Details
  steps:
  - show: <div class='chain'><span class='n'>DTO record + @NotBlank/@Positive</span><span class='a'>→</span><span class='n'>@Valid
      chặn ở cửa</span><span class='a'>→</span><span class='n'>RFC 9457 ProblemDetail</span></div>
    say: Bạn đã nắm cách thiết kế cửa vào an toàn và nhất quán cho API ngân hàng bằng DTO bất biến và chuẩn lỗi quốc tế. Mọi
      dữ liệu bẩn đều được chặn gọn trước khi đi sâu vào tầng nghiệp vụ và lưu trữ. Cửa vào API vững chắc này chính là hàng
      rào bảo vệ đầu tiên cho mọi thao tác nghiệp vụ phía sau.
    focus:
    - '1.1'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Bài sau (bài 2):</b> Tầng dịch vụ, tiêm phụ thuộc qua hàm dựng và @Transactional (lan truyền,
      cô lập, hoàn tác)</div>
    say: Bài tiếp theo ta chuyển xuống tầng dịch vụ để nắm cơ chế tiêm phụ thuộc và quản lý giao dịch hoàn tác khi gặp lỗi
      nghiệp vụ. Hẹn gặp bạn ở bài sau. Nắm chắc khuôn báo lỗi chuẩn và lớp truyền tải bất biến sẽ giúp mọi đầu cuối ở các
      bước sau sạch và an toàn hơn. Việc chuẩn hoá ngay từ đầu cũng giúp các bài thực hành sau về giao dịch, bảo mật và kiểm
      thử tự động kế thừa một hợp đồng API sạch sẽ, đồng bộ.
    clear: true
    forward_ref: true
