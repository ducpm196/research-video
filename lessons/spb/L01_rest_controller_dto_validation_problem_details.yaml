      points="625,145 618,138 615,147" fill="#dc2626"/><rect x="625" y="110" width="300" height="72" rx="10" fill="#fee2e2"
      stroke="#dc2626" stroke-width="2"/><text x="775.0" y="142" font-size="17" font-weight="700" text-anchor="middle" fill="#1e293b">Vi
      phạm → 400 ProblemDetail</text><text x="775.0" y="165" font-size="14" text-anchor="middle" fill="#475569">@RestControllerAdvice
      trả JSON chuẩn</text></svg></div>
    say: Quan sát nhánh rẽ hai đường trên màn hình. Mọi chuỗi JSON đi tới đều được khung web chuyển thành bản ghi DTO rồi đưa
      ngay qua bộ kiểm ràng buộc. Nếu mọi trường đều đạt, luồng mới đi tiếp xuống tầng dịch vụ và trả mã hai trăm linh
      một.
    clear: true
  - show: ''
    say: Nếu phát hiện dù chỉ một lỗi nhỏ, nhánh đỏ bên dưới cắt ngang ngay để trả mã bốn trăm mà không chạm cơ sở dữ liệu.
      Nhờ lớp lọc sớm này, những yêu cầu sai lệch cấu trúc không bao giờ chiếm dụng kết nối tới cơ sở dữ liệu đắt đỏ. Mỗi
      nhánh kết quả đều mang mã trạng thái HTTP tường minh giúp hệ thống giám sát đo chính xác tỉ lệ lỗi người dùng.
- id: formula
  kind: formula
  title: Nguyên tắc một nơi bắt lỗi duy nhất (RFC 9457) và cô lập thực thể DB
  checks:
  - 400 < 500
  steps:
  - show: <div class='box key'><p><b>Hai quy tắc kiến trúc tầng web ngân hàng:</b></p><p>1. <b>Tách riêng DTO khỏi thực thể
      DB:</b> DTO chỉ chứa đúng trường giao tiếp (<code>fromAccount, toAccount, amount</code>); cấm gắn thực thể bảng lên
      <code>@RequestBody</code> tránh lỗ hổng gán thừa trường (Mass Assignment).</p><p>2. <b>Một <code>@RestControllerAdvice</code>
      xử lý tập trung:</b> gom mọi lỗi <code>MethodArgumentNotValidException</code> về <code>ProblemDetail</code> với <code>status=400</code>
      và danh sách <code>errors</code> rõ ràng.</p></div>
    say: Hai quy tắc kiến trúc trên màn hình giữ cho API vừa an toàn vừa sạch mã nguồn. Không bao giờ dùng trực tiếp thực
      thể cơ sở dữ liệu làm đầu vào HTTP vì người dùng xấu có thể chèn thêm trường nhạy cảm như trạng thái duyệt hay số dư
      giả. Thay vào đó, bản ghi truyền tải chỉ khai báo đúng ba trường cho phép và giao hết việc kiểm lỗi về một bộ tư vấn
      toàn cục trả đúng khuôn RFC chín bốn năm bảy. Giả sử kẻ xấu gửi thêm trường số dư hay quyền quản trị vào JSON, lớp bản
      ghi riêng sẽ bỏ qua hoàn toàn vì không khai báo. Trong khi đó, bộ xử lý tập trung giữ nguyên định dạng lỗi duy nhất
      dù sau này hệ thống mở rộng thêm hàng chục bộ điều khiển.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Cài đặt DTO record, TransferController và ApiExceptionHandler
  checks:
  - 250_000 > 0
  steps:
  - show: <p><b>1. Record DTO kèm chú thích ràng buộc (Bean Validation)</b></p><div class="code"><div>public record TransferRequest(</div><div>  @NotBlank(message
      = "thieu tai khoan nguon") String fromAccount,</div><div>  @NotBlank(message = "thieu tai khoan dich") String toAccount,</div><div>  @Positive(message
      = "so tien phai lon hon 0") long amount</div><div>) {}</div><div>@PostMapping("/api/v1/transfers")</div><div>@ResponseStatus(HttpStatus.CREATED)</div><div>public
      TransferResponse create(@Valid @RequestBody TransferRequest req) {</div><div>  return new TransferResponse("TX-1234",
      "ACCEPTED", req.amount());</div><div>}</div></div>
    say: Nhìn đoạn mã ngắn gọn tạo nên cổng tiếp nhận dữ liệu an toàn. Ba trường tài khoản nguồn, tài khoản đích và số tiền
      nằm gọn trong một dòng khai báo bản ghi bất biến. Khi gắn chú thích kiểm hợp lệ trước thân yêu cầu, khung điều khiển
      trả ngay mã hai trăm linh một mà không cần rẽ nhánh thủ công. Ngoài bản ghi yêu cầu đầu vào, ta tạo thêm bản ghi phản
      hồi chứa mã giao dịch, trạng thái chấp nhận và số tiền hợp lệ. Vì mọi trường đều bất biến ngay sau lúc khởi tạo, tầng
      dịch vụ yên tâm đọc dùng mà không sợ luồng khác vô tình sửa đổi.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>2. Bộ xử lý ngoại lệ trả ProblemDetail chuẩn RFC 9457</b></p><div class="code"><div>@RestControllerAdvice</div><div>public
      class ApiExceptionHandler {</div><div>  @ExceptionHandler(MethodArgumentNotValidException.class)</div><div>  public
      ProblemDetail handleInvalid(MethodArgumentNotValidException ex) {</div><div>    ProblemDetail pd = ProblemDetail.forStatusAndDetail(</div><div>      HttpStatus.BAD_REQUEST,
      "Du lieu dau vao khong hop le");</div><div>    pd.setTitle("Validation Error");</div><div>    pd.setType(URI.create("https://nganhang.vn/errors/validation"));</div><div>    var
      errs = ex.getBindingResult().getFieldErrors().stream()</div><div>      .map(fe -&gt; fe.getField() + ": " + fe.getDefaultMessage()).toList();</div><div>    pd.setProperty("errors",
      errs);</div><div>    return pd;</div><div>  }</div><div>}</div></div>'
    say: Phần xử lý lỗi dùng chung nằm trọn trong một lớp riêng biệt. Ngay khi bộ kiểm tự động phát hiện trường sai, ngoại
      lệ ràng buộc được chuyển thẳng vào đây để trích xuất từng cặp tên trường kèm thông điệp chi tiết. Kết quả trả về mang
      loại nội dung chuẩn quốc tế giúp ứng dụng máy khách hiển thị chính xác lỗi ngay tại ô nhập liệu. Trong hàm xử lý ngoại
      lệ, ta đặt rõ mã trạng thái yêu cầu xấu, tiêu đề dễ đọc và đường dẫn định danh loại lỗi. Thuộc tính mở rộng danh sách
      lỗi đi kèm từng cặp tên trường và thông điệp rõ ràng giúp lập trình viên khách gỡ lỗi nhanh chóng.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật trên Boot 4.1.3 MockMvc: ca 201 hợp lệ vs 400 ProblemDetail'
  checks:
  - 201 != 400
  steps:
  - show: '<p><b>Kết quả chạy thật bộ kiểm KiemL01Test qua ./mvnw -B verify</b></p><div class="code"><div>// POST /api/v1/transfers
      {"fromAccount":"TK01","toAccount":"TK02","amount":250000}</div><div>→ HTTP 201 Created | {"txId":"TX-...","status":"ACCEPTED","amount":250000}</div><div>//
      POST /api/v1/transfers {"fromAccount":"TK01","toAccount":"TK02","amount":0}</div><div>→ HTTP 400 Bad Request | Content-Type:
      application/problem+json</div><div>{"type":"https://nganhang.vn/errors/validation","title":"Validation Error",</div><div>
      "status":400,"errors":["amount: so tien phai lon hon 0"]}</div><div>[INFO] Tests run: 4, Failures: 0, Errors: 0, Total
      time: 10.756 s</div><div>ĐÚNG — PASS /d/research-video/labs/SPB/L01 (du_an maven)</div></div>'
    say: Đầu ra kiểm thử thật trên máy ảo cho thấy rõ hai trường hợp đối lập khi chạy bộ kiểm nghiệm thu. Yêu cầu hợp lệ hai
      trăm năm mươi nghìn đồng nhận mã hai trăm linh một vì mọi ràng buộc dữ liệu đều đạt. Còn yêu cầu số tiền bằng không
      bị chặn lại với mã bốn trăm, loại nội dung chuẩn và danh sách lỗi chỉ rõ trường sai. Quan sát cả tiêu đề loại nội dung
      trong phản hồi lỗi mang đúng chuỗi chuẩn ứng dụng vấn đề JSON thay vì JSON thường. Bốn ca kiểm thử còn quét cả số tiền
      âm và tài khoản nguồn để trắng nhằm bảo đảm không sót nhánh biên nào.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Chi phí tiết kiệm khi chặn lỗi sớm ở tầng Web qua 3 mức lưu lượng
  checks:
  - 1_000_000 * 5 / 100 == 50_000
  steps:
  - show: <table class='t'><tr><th>lưu lượng đến (5% yêu cầu bẩn)</th><th>chặn ngay ở tầng Web (@Valid)</th><th>để lọt xuống
      DB mới báo lỗi</th></tr><tr><td><b>100 yêu cầu</b> (5 lỗi)</td><td>0 truy vấn DB; tải ~12 KB, 100 lượt đọc JSON</td><td>Tốn
      5 vòng khứ hồi khoá kết nối DB</td></tr><tr><td><b>10 000 yêu cầu</b> (500 lỗi)</td><td>Chặn 500 gói trên RAM (&lt;
      1 ms/gói; ~1,2 MB, 10 000 lượt JSON)</td><td>500 phiên DB thừa làm cạn nhanh bể kết nối</td></tr><tr><td><b>1 000 000 yêu cầu</b> (50 000 lỗi)</td><td>Tiết
      kiệm <b>50 000</b> lượt DB (~120 MB, 1 triệu lượt JSON)</td><td>Nguy cơ tắc hàng đợi DB trong giờ cao điểm</td></tr></table>
    say: Bảng quy mô lý giải vì sao việc chặn dữ liệu bẩn ngay ở lớp điều khiển lại sống còn dưới tải cao. Với giả định năm
      phần trăm yêu cầu từ thiết bị di động bị lỗi định dạng, ở một triệu yêu cầu sẽ có tới năm mươi nghìn gói tin hỏng. Nếu
      chặn từ ranh giới HTTP trên bộ nhớ, toàn bộ năm mươi nghìn gói đó bị loại trong chưa tới một mi-li-giây mà không mở
      bất kỳ kết nối cơ sở dữ liệu nào. Ở cả ba mốc một trăm, mười nghìn và một triệu yêu cầu, kích thước tải và số lượt phân tích JSON tăng tuyến tính nhưng lượt đọc ghi đĩa bằng không. Băng thông mạng nội bộ tới tầng cơ sở dữ liệu cũng nhờ đó luôn thông
      thoáng phục vụ các giao dịch hợp lệ.
    focus:
