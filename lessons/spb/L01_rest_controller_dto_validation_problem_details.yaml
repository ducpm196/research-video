objectives:
- Thiết kế bộ điều khiển REST với record DTO bất biến và kiểm ràng buộc bằng Bean Validation
- Trả lỗi chuẩn RFC 9457 Problem Details với mã trạng thái HTTP và trường chi tiết nhất quán
- So sánh kích thước tải và số lần phân tích khi dữ liệu lỗi bị chặn sớm ở tầng vào ở 100, 10 000 và 1 000 000 yêu cầu
scenes:
- id: hook
  kind: hook
  title: 'Khách gửi số tiền âm: trả lỗi kiểu nào để mọi đội đều hiểu?'
  checks:
  - 201 != 400
  steps:
  - show: <div class='box key'><p>Trong API ngân hàng thật, mỗi đội có thể tự chế một kiểu JSON lỗi khác nhau (<code>{err:...}</code>,
      <code>{msg:...}</code>, <code>{code:99}</code>) khiến ứng dụng di động phải viết hàng chục bộ rẽ nhánh vá víu.</p><p>Chuẩn
      công nghiệp <b>RFC 9457 Problem Details</b> (<code>application/problem+json</code>) hợp nhất mọi lỗi HTTP về một khuôn
      <code>type, title, status, detail</code> tích hợp sẵn trong Spring Boot 4.</p></div>
    say: Chào bạn đến với bài một của khoá Spring Boot thực chiến. Một cổng thanh toán nhận dữ liệu thô từ bên ngoài luôn
      phải đối mặt với những gói tin thiếu trường hoặc sai kiểu. Nếu mỗi đầu cuối tự bịa thông báo lỗi hoặc để lọt dữ liệu
      bẩn vào tầng lưu trữ, hệ thống sẽ khó tích hợp. Hôm nay ta cài đặt bộ điều khiển REST tiếp nhận bản ghi DTO bất biến
      và báo lỗi chuẩn RFC chín bốn năm bảy. Thiết kế chuẩn ngay từ cửa vào giúp mọi dịch vụ phía sau nhận dữ liệu sạch và
      giảm hẳn công sức viết bản đặc tả API. Toàn bộ quy trình chặn lỗi đều chạy bằng bộ kiểm thử giả lập tốc độ cao ngay
      trên tầng web.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: đầu cuối REST, mã trạng thái HTTP và DTO'
  steps:
  - show: <table class='t'><tr><th>thành phần tầng giao tiếp</th><th>ý nghĩa thực hành</th></tr><tr><td><code>POST /api/v1/transfers</code></td><td>Tạo
      mới tài nguyên lệnh chuyển khoản, thành công trả <code>201 Created</code></td></tr><tr><td><code>record</code> Java
      21</td><td>Lớp chứa dữ liệu bất biến ngắn gọn không cần hàm dựng rườm rà</td></tr><tr><td>Mã <code>400 Bad Request</code></td><td>Từ
      chối yêu cầu sai cú pháp hoặc vi phạm ràng buộc ngay tại cửa vào</td></tr></table>
    say: Hãy ôn nhanh ba quy ước nền của giao tiếp web theo phong cách tài nguyên trước khi viết mã mới. Khi tạo một giao
      dịch chuyển khoản mới qua phương thức POST, mã phản hồi chuẩn là hai trăm linh một thay vì hai trăm chung chung. Từ
      Java mười sáu và hai mươi mốt, từ khoá khai báo bản ghi bất biến giúp ta định nghĩa gọn dữ liệu vào mà không lo bị sửa
      ngầm trên đường xử lý. Nếu đầu vào sai, cổng phải trả ngay mã bốn trăm thay vì mở giao dịch cơ sở dữ liệu. Tách biệt
      mã hai trăm linh một cho tạo mới và bốn trăm cho lỗi giúp ứng dụng khách phân loại phản hồi ngay mà không cần đọc thân
      tin. Bản ghi bất biến còn có sẵn các hàm so sánh và sinh chuỗi tự động nên mã nguồn ngắn gọn và dễ bảo trì hơn.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.3'
