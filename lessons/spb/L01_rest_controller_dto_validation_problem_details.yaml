      x1="240" y1="100" x2="310" y2="100" stroke="#475569" stroke-width="2"/><polygon points="310,100 302,95 302,105" fill="#475569"/><rect
      x="310" y="55" width="215" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="417.5" y="95"
