- id: sym
  kind: symbol
  title: Bộ chú thích kiểm dữ liệu vào và khuôn RFC 9457 ProblemDetail
  steps:
  - show: <table class='t'><tr><th>chú thích &amp; trường chuẩn</th><th>tác dụng kiểm tra ở tầng vào</th></tr><tr><td><code>@NotBlank</code>
      &amp; <code>@Positive</code></td><td>Bắt chuỗi rỗng/khoảng trắng và chặn số tiền nhỏ hơn hoặc bằng 0</td></tr><tr><td><code>@Valid</code>
      trên <code>@RequestBody</code></td><td>Kích hoạt kiểm ràng buộc trước khi thân hàm điều khiển được gọi</td></tr><tr><td><code>ProblemDetail</code>
      (<code>application/problem+json</code>)</td><td>Đóng gói chuẩn <code>type, title, status, detail</code> + trường mở
      rộng <code>errors</code></td></tr></table>
    say: Bảng này mô tả ba chốt kỹ thuật giữ sạch cửa vào của ứng dụng web. Hai chú thích ràng buộc gắn trực tiếp lên từng
      trường của bản ghi để tuyên bố điều kiện hợp lệ. Chú thích kiểm hợp lệ đặt cạnh tham số thân yêu cầu là công tắc kích
      hoạt quy trình chấm trước khi đi vào hàm xử lý. Khi có trường vi phạm, bộ xử lý ngoại lệ dùng chung đóng gói thành đối
      tượng chi tiết lỗi đúng chuẩn loại nội dung quốc tế. Tên trường trong mảng lỗi khớp đúng tên trường trên bản ghi để
      đội giao diện ánh xạ trực tiếp tới từng ô nhập. Sự kết hợp ba thành phần này tạo nên hàng rào kiểm định thống nhất cho
      toàn bộ các đầu cuối trong dịch vụ.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
