assumes: []
objectives:
- Bổ sung bộ lọc gắn mã tương quan MDC vào nhật ký cấu trúc JSON xuyên qua đầu cuối HTTP
- Bật Spring Boot Actuator và chỉ số Prometheus đếm tỉ lệ chuyển khoản thành công và bị từ chối
- Tính số chuỗi thời gian sinh ra khi gắn nhãn đúng quy tắc ở 1, 1 000 và 100 000 giao dịch
scenes:
- id: hook
  kind: hook
  title: 'Sự cố lúc 2 giờ sáng: log thiếu mã theo dõi, hoặc Prometheus hết RAM!'
  checks:
  - alg.spb_prom_series(4, 3, 1) == (12, 12)
  steps:
  - show: '<div class=''box key''><p>Khi dịch vụ chuyển khoản nhận hàng trăm yêu cầu song song, nhật ký văn bản trơn không
      mang mã theo dõi khiến kỹ sư không thể xâu chuỗi một giao dịch từ lúc vào HTTP tới lúc chạm DB. Ngược lại, nếu gắn bừa
      <code>txId</code> làm nhãn chỉ số Prometheus, cơ sở dữ liệu giám sát sẽ nổ tung thành hàng trăm nghìn chuỗi thời gian.</p><p>Bài
      này cài đủ bộ quan sát trên Boot 4.1: <b>ECS JSON Log + MDC <code>X-Correlation-Id</code> + OpenTelemetry + Actuator/Prometheus</b>.</p></div>'
    say: Chào bạn đến với bài mười một của khoá Spring Boot thực chiến. Khi xảy ra sự cố trên môi trường sản xuất lúc nửa
      đêm, điều đáng sợ nhất là phải đi tìm nguyên nhân giữa hàng triệu dòng nhật ký không có mã theo dõi chung. Cùng lúc
      đó, rất nhiều người mới lại phạm sai lầm chết người là đưa mã giao dịch hay mã khách hàng làm nhãn chỉ số giám sát khiến
      máy chủ Prometheus cạn sạch bộ nhớ. Bài hôm nay hướng dẫn bạn cài nhật ký cấu trúc JSON, bộ lọc mã tương quan và xuất
      chỉ số Prometheus an toàn. Trong môi trường phân tán, nhật ký cấu trúc JSON và chỉ số đo đạc nhãn thấp là đôi mắt giúp
      kỹ sư chẩn đoán sự cố tức thì. Ngược lại, gắn sai giá trị biến thiên cao vào nhãn chỉ số có thể tự biến hệ thống giám
      sát thành nguyên nhân gây sập dịch vụ.
    focus:
    - 0
    - '1.1'
    - '1.1'
    - '1.2'
    - '1.1'
    - '1.2'
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn nhanh: ba trụ cột quan sát gồm Log, Metrics và Traces'
  steps:
  - show: <table class='t'><tr><th>trụ cột quan sát</th><th>câu hỏi trả lời khi vận hành</th></tr><tr><td><b>Logs</b> (Nhật
      ký JSON có cấu trúc)</td><td>Ghi chi tiết sự kiện từng bước theo định dạng ECS để máy gom log phân tích</td></tr><tr><td><b>Metrics</b>
      (Chỉ số Prometheus)</td><td>Đếm tốc độ giao dịch, tỉ lệ lỗi và độ trễ phân vị gọn nhẹ</td></tr><tr><td><b>Traces</b>
      (OpenTelemetry / MDC)</td><td>Theo dấu một yêu cầu xuyên suốt các bộ lọc và dịch vụ con</td></tr></table>
    say: 'Hãy ôn ngắn gọn ba trụ cột giúp ta nhìn thấu mọi hoạt động bên trong dịch vụ chuyển khoản. Nhật ký có cấu trúc JSON
      giúp công cụ thu thập đọc thẳng từng trường như mức độ nghiêm trọng hay mã theo dõi mà không cần tách chuỗi vất vả.
      Chỉ số đo lường tổng hợp số đếm và thời gian xử lý để vẽ biểu đồ cảnh báo tức thời. Còn vết theo dõi kết hợp mã tương
      quan nối liền toàn bộ bước chạy của cùng một yêu cầu. Ba trụ cột nhật ký, chỉ số và vết theo dõi bổ trợ lẫn nhau: chỉ
      số báo động sụt giảm còn nhật ký chỉ rõ dòng giao dịch lỗi. Sử dụng chuẩn định dạng nhật ký đàn hồi sẵn có trong Boot
      bốn giúp loại bỏ hoàn toàn việc cấu hình mẫu chuỗi phức tạp.'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.2'
    - '1.4'
    clear: true
- id: sym
  kind: symbol
  title: Bộ ba Actuator, Micrometer Metrics (Boot 4.1) và cấu hình Prometheus
  steps:
  - show: <table class='t'><tr><th>thành phần trên Spring Boot 4.1</th><th>công dụng bắt buộc</th></tr><tr><td><code>spring-boot-starter-micrometer-metrics</code></td><td>Mô-đun
      mới Boot 4 kích hoạt đầu cuối quét <code>/actuator/prometheus</code></td></tr><tr><td><code>logging.structured.format.console=ecs</code></td><td>Xuất
      log JSON chuẩn Elastic Common Schema tự động gộp cả <code>MDC</code></td></tr><tr><td><code>MDC.put("correlationId",
      id)</code></td><td>Gắn mã theo dõi cho toàn bộ dòng log trong luồng rồi xoá ở <code>finally</code></td></tr><tr><td>Nhãn
      thấp (<code>status="ok"</code>)</td><td>Giữ số chuỗi thời gian nhỏ cố định, tuyệt đối không gắn ID duy nhất</td></tr></table>
    say: Bảng này ghi lại một điểm cập nhật rất quan trọng trên Spring Boot đời bốn chấm một chấm ba. Vì Boot bốn tách nhỏ
      từng nhóm tính năng, bạn cần khai báo thêm bộ khởi tạo đo lường Micrometer bên cạnh Actuator thì đường dẫn Prometheus
      mới tự mở. Chỉ với một dòng cấu hình định dạng nhật ký JSON tích hợp sẵn, mọi giá trị đặt vào từ điển MDC của luồng
      hiện tại tự động xuất hiện trong từng bản ghi JSON. Và luôn nhớ chỉ dùng những nhãn có tập giá trị nhỏ cố định như trạng
      thái thành công hay từ chối. Tách riêng mô-đun đo lường Micrometer trên Boot bốn yêu cầu kỹ sư kiểm tra kỹ danh sách
      phụ thuộc khi dựng mới dự án. Khi ghép cùng bộ đếm chuẩn và cấu trúc nhật ký thống nhất, hệ thống sẵn sàng kết nối ngay
      vào hệ sinh thái giám sát doanh nghiệp.
