- id: example
  kind: example
  title: 'Mã thật: CorrelationFilter dọn MDC + MeterRegistry nhãn thấp + ECS JSON'
  checks:
  - alg.spb_prom_series(4, 3, 10) == (12, 120)
  steps:
  - show: <p><b>1. Bộ lọc OncePerRequestFilter gắn và dọn sạch X-Correlation-Id</b></p><div class="code"><div>String cid =
      req.getHeader("X-Correlation-Id");</div><div>if (cid == null || cid.isBlank()) cid = UUID.randomUUID().toString();</div><div>MDC.put("correlationId",
      cid);</div><div>res.setHeader("X-Correlation-Id", cid);</div><div>try { chain.doFilter(req, res); }</div><div>finally
      { MDC.remove("correlationId"); }</div></div>
    say: Đoạn mã bộ lọc ngắn gọn đảm nhận toàn bộ nhiệm vụ theo dấu yêu cầu qua tiêu đề HTTP chuẩn. Sau khi ưu tiên nhận lại
      mã từ yêu cầu đến hoặc tự sinh mã mới, ta nạp vào từ điển luồng và gán ngay lên tiêu đề phản hồi. Khối kết thúc đặt
      ở cuối bảo đảm dù hàm bên trong có ném ngoại lệ sập thì mã cũ vẫn luôn được dọn sạch khỏi luồng. Cơ chế bảo vệ dùng
      khối thử và kết thúc là mẫu chuẩn bắt buộc trên mọi bộ lọc liên quan đến biến cục bộ của luồng. Ngoài việc in ra nhật
      ký, bộ lọc còn bảo tồn mã tương quan nếu hệ thống cổng vào đã tạo và gắn sẵn trước khi chuyển tiếp.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
  - show: '<p><b>2. Đếm chỉ số Prometheus nhãn thấp + cấu hình ECS JSON Log</b></p><div class="code"><div>String status =
      amount &gt; 0 ? "ok" : "rejected";</div><div>meters.counter("bank_transfers", "status", status).increment();</div><div>log.info("transfer_processed
      status={} amount={}", status, amount);</div><div>// application.properties:</div><div>// management.endpoints.web.exposure.include=health,metrics,prometheus</div><div>//
      logging.structured.format.console=ecs</div></div>'
    say: Ở lớp điều khiển bên dưới, bộ đếm chỉ số chỉ gắn một nhãn trạng thái nhận hai giá trị cố định chứ không hề đưa mã
      tương quan vào nhãn. Trong khi đó, dòng nhật ký chuẩn cấu trúc JSON lại tự động in kèm cả mã tương quan lẫn tải chi
      tiết phục vụ tra cứu từng giao dịch đơn lẻ. Trong hệ thống tài chính, tách rõ chiều đo tổng hợp ở bộ đếm và chi tiết
      từng giao dịch ở nhật ký giúp kiểm soát hoàn toàn chi phí lưu trữ. Dù khối lượng giao dịch tăng hàng trăm lần, số chuỗi
      thời gian trên Prometheus vẫn đứng yên như ban đầu.
    focus:
    - 1
    - 2
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Chạy thật Boot 4.1.3 Actuator: log JSON ECS, MDC sạch và /actuator/prometheus'
  checks:
  - alg.spb_prom_series(4, 3, 100) == (12, 1200)
  steps:
  - show: '<p><b>Kết quả chạy thật KiemL11Test qua ./mvnw -B verify</b></p><div class="code"><div>// Log ECS console: {"@timestamp":"...","log":{"level":"INFO",...},"ecs":{"version":"8.11"}}</div><div>//
      1) POST ?amount=50000 kèm X-Correlation-Id: cid-9988 → phản hồi trả đúng cid-9988, MDC null</div><div>// 2) POST thiếu
      header → tự sinh X-Correlation-Id mới trong header phản hồi</div><div>// 3) GET /actuator/prometheus → HTTP 200 chứa
      "bank_transfers_total{status=\"ok\"}"</div><div>//    và KHÔNG chứa "correlationId="</div><div>KiemL11Test: 3 ca, 0
      hỏng</div></div>'
    say: Đầu ra chạy kiểm thử thật xác nhận cả nhật ký JSON lẫn đầu cuối thu thập chỉ số đều vận hành trơn tru trên Spring
      Boot bốn chấm một. Tệp nhật ký xuất thẳng định dạng JSON chuẩn tích hợp giúp công cụ phân tích đọc ngay trường mã tương
      quan. Sau yêu cầu, kiểm tra thấy luồng trống sạch vì bộ lọc đã dọn đúng lúc, còn đường dẫn Prometheus mở sẵn bộ đếm
      chuẩn. Đầu cuối Prometheus trả về định dạng văn bản chuẩn chứa tên bộ đếm kèm tập nhãn trạng thái hợp lệ và từ chối
      gọn gọn. Kiểm chứng cũng xác nhận sau khi kết thúc yêu cầu HTTP, giá trị mã tương quan trong từ điển luồng trở về rỗng
      hoàn toàn.
    focus:
    - 1
    - 2
    - 2
    - 1
    - 2
    clear: true
- id: quymo
  kind: example
  title: Số chuỗi thời gian phát sinh ở 1, 1 000 và 100 000 giao dịch khi chọn nhãn
  checks:
  - alg.spb_prom_series(4, 3, 1000) == (12, 12000)
  - alg.spb_prom_series(4, 3, 100_000) == (12, 1_200_000)
  steps:
  - show: <table class='t'><tr><th>số lượng giao dịch chạy qua</th><th>nhãn thấp chuẩn (4 đầu cuối × 3 trạng thái)</th><th>gắn
      nhầm txId / correlationId vào nhãn</th></tr><tr><td><b>1 giao dịch</b></td><td>12 chuỗi thời gian</td><td>12 chuỗi (chưa
      thấy lỗi lúc viết!)</td></tr><tr><td><b>1 000 giao dịch</b></td><td>Vẫn đúng <b>12 chuỗi</b></td><td>Nhảy lên <b>12
      000 chuỗi</b> (chậm trễ khi vẽ đồ thị)</td></tr><tr><td><b>100 000 giao dịch</b></td><td>Vẫn cố định <b>12 chuỗi</b>
      (&lt; 10 KB RAM)</td><td><b>1 200 000 chuỗi</b> → nổ RAM Prometheus trong ít phút</td></tr></table>
    say: Bảng quy mô cho thấy rõ vì sao sai lầm chọn nhãn chỉ số luôn trốn kỹ lúc thử một hai giao dịch đơn lẻ rồi mới bùng
      nổ khi ra sản xuất. Với chỉ một giao dịch thử nghiệm, gắn mã giao dịch vào nhãn vẫn chỉ cho mười hai chuỗi nên không
      ai nhận ra vấn đề. Nhưng tới một trăm nghìn giao dịch, thiết kế chuẩn giữ đúng mười hai chuỗi dưới mười ki-lô-bai, còn
