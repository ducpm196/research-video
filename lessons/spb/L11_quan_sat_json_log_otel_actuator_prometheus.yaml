- id: intuition
  kind: intuition
  title: 'Vòng đời một yêu cầu qua CorrelationFilter: gắn ở đầu vào, xoá sạch ở finally'
  steps:
  - show: <div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="25" y="45" width="210" height="95" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="130.0" y="85" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">1.
      CorrelationFilter</text><text x="130.0" y="112" font-size="14" text-anchor="middle" fill="#475569">Đọc/sinh X-Correlation-Id</text><line
      x1="235" y1="92" x2="295" y2="92" stroke="#475569" stroke-width="2"/><polygon points="295,92 287,87 287,97" fill="#475569"/><rect
      x="295" y="45" width="225" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="407.5" y="85"
      font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">2. MDC + ECS JSON Log</text><text x="407.5" y="112"
      font-size="14" text-anchor="middle" fill="#475569">Ghi log JSON kèm correlationId</text><line x1="520" y1="92" x2="585"
      y2="92" stroke="#475569" stroke-width="2"/><polygon points="585,92 577,87 577,97" fill="#475569"/><rect x="585" y="45"
      width="345" height="95" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="757.5" y="85" font-size="16"
      font-weight="700" text-anchor="middle" fill="#1e293b">3. Prometheus + MDC.remove()</text><text x="757.5" y="112" font-size="14"
      text-anchor="middle" fill="#475569">Tăng bank_transfers{status} — Dọn sạch luồng</text></svg></div>
    say: Quan sát vòng đời xử lý một yêu cầu đi qua bộ lọc mã tương quan trên màn hình. Ở bước vào, nếu máy khách chưa gửi
      sẵn tiêu đề mã tương quan thì bộ lọc tự sinh một mã ngẫu nhiên mới và trả ngược lại trên tiêu đề phản hồi. Mã đó nằm
      trong từ điển luồng MDC giúp mọi dòng nhật ký sinh ra ở tầng điều khiển hay dịch vụ đều tự động đính kèm cùng một
      mã.
    clear: true
  - show: ''
    say: Trước khi trả luồng về bể tái sử dụng, khối kết thúc bắt buộc phải xoá mã khỏi từ điển luồng để yêu cầu sau không kế
      thừa nhầm mã cũ. Bằng cách trả luôn mã tương quan về tiêu đề phản hồi HTTP, người dùng hoặc nhóm hỗ trợ kỹ thuật dễ
      dàng cung cấp mã khi báo lỗi. Nhờ dọn sạch bản đồ chẩn đoán luồng ngay khi ra khỏi bộ lọc, máy chủ không bao giờ
      trộn nhầm dấu vết giữa hai khách hàng.
- id: formula
  kind: formula
  title: Cách tính số chuỗi thời gian (Cardinality) trên Prometheus
  checks:
  - alg.spb_prom_series(4, 3, 1) == (12, 12)
  - alg.spb_prom_series(4, 3, 100_000) == (12, 1_200_000)
  steps:
  - show: '<div class=''box key''><p><b>Công thức tổng chuỗi thời gian:</b> $S = \prod |\text{tập giá trị nhãn}|$.</p><p>Với
      4 đầu cuối × 3 trạng thái (<code>ok, rejected, err</code>): tổng số chỉ có <b>12 chuỗi</b> ổn định bất kể xử lý bao
      nhiêu triệu giao dịch.</p><p>Nếu lỡ gắn thêm 100 000 giá trị <code>txId</code> vào nhãn: số chuỗi nổ vọt thành $12 \times
      100\,000 = \mathbf{1\,200\,000\text{ chuỗi}}$, làm tràn RAM thu thập chỉ số ngay lập tức!</p></div>'
    say: Công thức tính tích kích thước các tập nhãn chỉ ra cái bẫy lớn nhất khi dùng Prometheus. Số lượng chuỗi thời gian
      trong bộ nhớ bằng tích các giá trị nhãn khác nhau nhân lại vì mỗi tổ hợp tạo một chuỗi riêng. Nếu chỉ giữ bốn đầu cuối
      nhân với ba trạng thái cơ bản, bạn chỉ tốn vỏn vẹn mười hai chuỗi dù hệ thống chạy suốt nhiều năm. Ngược lại nếu đưa
      mã giao dịch vào nhãn trên trăm nghìn giao dịch, tổng số chuỗi vọt lên một triệu hai trăm nghìn gây tràn bộ nhớ ngay.
      Độ bùng nổ tổ hợp chuỗi thời gian chính là lý do các công cụ thu thập chỉ số nghiêm cấm nhãn mang giá trị tự do không
      chặn trên. Giữ tập giá trị nhãn đếm được dưới vài chục phần tử bảo vệ dung lượng RAM máy chủ giám sát chạy bền bỉ quanh
      năm.
    focus:
