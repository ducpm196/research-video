      Luồng Tomcat tái sử dụng giữ lại mã cũ, làm log của hai khách hàng khác nhau bị trộn chung!<br><b>Lỗi 3 — Chỉ thêm <code>-starter-actuator</code>
      mà quên <code>-starter-micrometer-metrics</code> trên Boot 4:</b> Đường dẫn <code>/actuator/prometheus</code> trả về
      lỗi 404.</div></td></tr></table>
    say: Ba lỗi trên bảng đều là bẫy thực tế khi triển khai công cụ quan sát cho hệ thống chạy thật. Gắn định danh từng khách
      hàng hay từng lệnh chuyển vào nhãn chỉ số làm tràn bộ nhớ lưu trữ chuỗi thời gian. Quên xoá từ điển luồng trong khối
      hoàn tất làm luồng xử lý của Tomcat mang nhầm mã theo dõi sang giao dịch tiếp theo. Cuối cùng, thiếu bộ khởi tạo đo
