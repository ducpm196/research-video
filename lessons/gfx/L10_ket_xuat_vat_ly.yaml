  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Công thức xấp xỉ bậc năm của phản xạ theo góc và cân bằng năng lượng"
    checks:
      - "alg.gfx_schlick_fresnel(1.0, 0.04) == 0.04"
      - "round(alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.07"
      - "alg.gfx_schlick_fresnel(0.0, 0.04) == 1.0"
    steps:
      - show: |
          <p><b>Bước 1 — công thức xấp xỉ phản xạ bậc năm (Schlick, 1994).</b> Phương trình quang học chính xác rất cồng kềnh, nên trong đồ hoạ thời gian thực ta nội suy từ $F_0$ (tại $\cos\theta = 1$) lên $1$ (tại $\cos\theta = 0$) bằng lũy thừa bậc năm:</p>
          $$F(\theta) = F_0 + (1 - F_0)(1 - \cos\theta)^5$$
          <p class="note">Vì sao là mũ $5$? Vì $(1 - \cos\theta)^5$ giữ giá trị rất gần $0$ trên suốt khoảng góc nhìn từ 0° đến 45°, rồi mới vọt nhanh lên $1$ khi nhìn sượt gần 90° — khớp sát đường cong quang học thật mà chỉ tốn vài phép nhân!</p>
        focus: [1, 2, 2, 3, 3]
        say: "Bước một, ta thiết lập công thức xấp xỉ bậc năm để tính nhanh tỉ lệ phản xạ theo góc nhìn trên bộ xử lý đồ hoạ. Thay vì dùng công thức quang học chính xác nhưng cồng kềnh, ta nội suy từ F không lên 1. Biểu thức là F bằng F không cộng 1 trừ F không nhân với 1 trừ cosin góc tới mũ 5. Sở dĩ dùng lũy thừa bậc 5 là vì biểu thức 1 trừ cosin mũ 5 giữ giá trị rất nhỏ ở các góc nhìn gần thẳng đứng. Chỉ khi góc nhìn nghiêng sượt gần 90 độ làm cosin tiến về 0 thì hàm số mới tăng vọt lên 1, bám sát đường cong quang học thực tế."
      - show: |
          <p><b>Bước 2 — ràng buộc bảo toàn năng lượng giữa phản xạ gương và khuếch tán:</b></p>
          $$k_{\text{gương}}(\theta) = F(\theta), \qquad k_{\text{khuếch tán}}(\theta) = (1 - m)\,\big(1 - F(\theta)\big)$$
          <p class="note">Trong đó $m \in \{0, 1\}$ là hệ số kim loại: với phi kim ($m = 0$) thì $k_{\text{gương}} + k_{\text{khuếch tán}} = 1$; với kim loại ($m = 1$) thì $k_{\text{khuếch tán}} = 0$.</p>
        focus: [1, 2, 3]
        say: "Bước hai, vì tổng năng lượng không thể vượt quá 1 nên ta ràng buộc thành phần phản xạ gương và thành phần khuếch tán theo F. Tại mọi góc nhìn, hệ số phản xạ gương bằng đúng F, nên hệ số dành cho khuếch tán chỉ còn 1 trừ m nhân với 1 trừ F. Nhờ đó với chất phi kim có m bằng 0 thì tổng hai tỉ lệ luôn bằng 1, còn với kim loại có m bằng 1 thì phần khuếch tán triệt tiêu về 0."
      - clear: true
        show: |
          <p><b>Bước 3 — độ nhám vi bề mặt $r \in [0, 1]$ phân phối lại năng lượng trong đốm sáng:</b></p>
          <p>• Bề mặt nhẵn ($r \to 0$): các mặt gương vi mô cùng hướng theo pháp tuyến $\mathbf{n} \implies$ đốm sáng <b>hẹp và cực gắt</b>.<br>• Bề mặt nhám ($r \to 1$): các mặt gương vi mô lệch hướng ngẫu nhiên $\implies$ đốm sáng <b>trải rộng nhưng mờ dịu</b> để tổng năng lượng phản xạ không đổi.</p>
        focus: [1, 2, 2]
        say: "Bước ba, mô hình vi bề mặt giải thích vai trò của độ nhám đối với hình dạng đốm sáng bóng. Khi bề mặt nhẵn bóng, các mặt gương vi mô xếp thẳng hàng nên phản xạ tập trung vào một đốm rất nhỏ và sáng chói. Khi bề mặt nhám hơn, các mặt gương vi mô lệch hướng làm ánh sáng phản xạ tán rộng ra xung quanh, khiến đỉnh đốm sáng tự động hạ thấp xuống để bảo toàn tổng năng lượng."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính tay: phản xạ trên mặt nhựa (F0 = 0,04) ở ba góc nhìn 0°, 60°, 90°"
    checks:
      - "alg.gfx_schlick_fresnel(1.0, 0.04) == 0.04"
      - "round(alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.07"
      - "alg.gfx_schlick_fresnel(0.0, 0.04) == 1.0"
      - "round(1.0 - alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.93"
    steps:
      - show: |
          <p><b>Phép tính 1 — tại góc nhìn thẳng đứng 0° ($\cos\theta = 1$) và góc sượt 90° ($\cos\theta = 0$) với $F_0 = 0{,}04$:</b></p>
          $$F_{\text{thẳng}} = 0{,}04 + (1 - 0{,}04)(1 - 1)^5 = 0{,}04 + 0{,}96 \cdot 0 = \hlg{0{,}04} \;\implies\; 1 - F = 0{,}96$$
          $$F_{\text{sượt}} = 0{,}04 + (1 - 0{,}04)(1 - 0)^5 = 0{,}04 + 0{,}96 \cdot 1 = \hlg{1{,}00} \;\implies\; 1 - F = 0{,}00$$
        focus: [1, 2, 3]
        say: "Ta tính cụ thể cho bề mặt nhựa có F không bằng 0 phẩy 04 ở hai góc đầu mút. Tại góc nhìn thẳng đứng 0 độ có cosin bằng 1, số hạng 1 trừ 1 mũ 5 bằng 0 nên F bằng đúng 0 phẩy 04, để lại 0 phẩy 96 năng lượng cho phần khuếch tán. Tại góc nhìn sượt ngang 90 độ có cosin bằng 0, số hạng 1 trừ 0 mũ 5 bằng 1 nên F bằng 0 phẩy 04 cộng 0 phẩy 96 bằng 1, tức phản xạ gương hoàn toàn."
      - clear: true
        show: |
          <p><b>Phép tính 2 — tại góc nghiêng 60° ($\cos\theta = 0{,}5$) với $F_0 = 0{,}04$:</b></p>
          <p>Ta có $1 - \cos\theta = 0{,}5 \implies (1 - \cos\theta)^5 = 0{,}5^5 = \frac{1}{32} = 0{,}03125$. Thay vào công thức:</p>
          $$F_{60} = 0{,}04 + (1 - 0{,}04) \cdot 0{,}03125 = 0{,}04 + 0{,}96 \cdot 0{,}03125 = 0{,}04 + 0{,}03 = \hlg{0{,}07}$$
          <p class="note">Ở góc nghiêng 60°, phản xạ gương tăng lên $7\%$, và phần khuếch tán còn lại tối đa là $1 - 0{,}07 = \hlb{0{,}93}$ ($93\%$).</p>
        focus: [1, 2, 3, 4]
        say: "Phép tính thứ hai xét tại góc nghiêng 60 độ nơi cosin bằng 0 phẩy 5. Hiệu 1 trừ 0 phẩy 5 bằng 0 phẩy 5, nâng lên lũy thừa bậc 5 bằng 1 phần 32 tức 0 phẩy 03125. Nhân 0 phẩy 96 với 0 phẩy 03125 được đúng 0 phẩy 03, cộng với 0 phẩy 04 ban đầu cho ra F bằng 0 phẩy 07. Như vậy tại góc 60 độ, 7 phần trăm năng lượng phản xạ như gương và 93 phần trăm còn lại đi vào thành phần khuếch tán."
      - show: |
          <p><b>Bảng tổng hợp ngân sách năng lượng theo góc nhìn ($F_0 = 0{,}04$):</b></p>
          <table class="t"><tr><th>góc nhìn $\theta$</th><th>$\cos\theta$</th><th>$(1 - \cos\theta)^5$</th><th>phản xạ gương $F(\theta)$</th><th>khuếch tán tối đa $1 - F(\theta)$</th></tr>
          <tr><td>0° (nhìn thẳng)</td><td>$1{,}0$</td><td>$0$</td><td>$\hlg{0{,}04 \;(4\%)}$</td><td>$0{,}96 \;(96\%)$</td></tr>
          <tr><td>60° (nhìn nghiêng)</td><td>$0{,}5$</td><td>$0{,}03125$</td><td>$\hlg{0{,}07 \;(7\%)}$</td><td>$\hlb{0{,}93 \;(93\%)}$</td></tr>
          <tr><td>90° (nhìn sượt)</td><td>$0{,}0$</td><td>$1$</td><td>$\hlg{1{,}00 \;(100\%)}$</td><td>$0{,}00 \;(0\%)$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bảng tổng hợp tại ba mốc góc 0 độ, 60 độ và 90 độ cho thấy rõ quy luật bù trừ năng lượng. Khi nhìn thẳng, phản xạ gương là 4 phần trăm và khuếch tán là 96 phần trăm. Khi nghiêng 60 độ, phản xạ gương tăng lên 7 phần trăm còn khuếch tán giảm xuống 93 phần trăm. Khi nhìn sượt 90 độ, phản xạ gương chiếm trọn 100 phần trăm và khuếch tán giảm về 0."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: biến đổi tương đương phần bù và kiểm tra góc rất sượt"
    checks:
      - "round(1.0 - alg.gfx_schlick_fresnel(0.5, 0.04), 5) == round((1.0 - 0.04) * (1.0 - (1.0 - 0.5) ** 5), 5)"
      - "round(alg.gfx_schlick_fresnel(0.2, 0.04), 4) == 0.3546 and round(math.degrees(math.acos(0.2)), 1) == 78.5"
    steps:
      - show: |
          <p><b>Đường khác 1 — tính trực tiếp phần năng lượng khúc xạ $1 - F(\theta)$ từ công thức đại số:</b></p>
          $$1 - F(\theta) = 1 - \Big(F_0 + (1 - F_0)(1 - \cos\theta)^5\Big) = (1 - F_0)\,\Big(1 - (1 - \cos\theta)^5\Big)$$
          <p class="note">Tại $\cos\theta = 0{,}5$: $1 - F = 0{,}96 \cdot \left(1 - \frac{1}{32}\right) = 0{,}96 \cdot \frac{31}{32} = 0{,}03 \cdot 31 = \hlg{0{,}93}$ ✓ (khớp chính xác mà không cần tính $F$ trước!).</p>
        focus: [1, 2, 3]
        say: "Ta tự kiểm tra bằng đường đại số thứ nhất là rút gọn trực tiếp biểu thức 1 trừ F. Đặt nhân tử chung 1 trừ F không ra ngoài, phần năng lượng đi vào trong vật liệu bằng 1 trừ F không nhân với 1 trừ đi 1 trừ cosin mũ 5. Thay cosin bằng 0 phẩy 5, ta lấy 0 phẩy 96 nhân với 31 phần 32, rút gọn 0 phẩy 96 chia 32 bằng 0 phẩy 03 rồi nhân 31 ra ngay 0 phẩy 93."
      - show: |
          <p><b>Đường khác 2 — kiểm tra độ tăng vọt ở góc sượt ($\cos\theta = 0{,}2$, tức khoảng 78,5°):</b></p>
          $$(1 - 0{,}2)^5 = 0{,}8^5 = 0{,}32768 \implies F = 0{,}04 + 0{,}96 \cdot 0{,}32768 \approx \hlb{0{,}3546 \;(35{,}5\%)}$$
          <p class="note">Từ 0° đến 60° phản xạ chỉ tăng thêm $3\%$, nhưng từ 60° đến 78,5° phản xạ nhảy vọt từ $7\%$ lên $35{,}5\%$!</p>
        focus: [1, 2, 3]
        say: "Đường kiểm tra thứ hai là thử tại góc nhìn khá sượt có cosin bằng 0 phẩy 2, tương ứng khoảng 78 phẩy 5 độ. Vì 1 trừ 0 phẩy 2 bằng 0 phẩy 8, nâng lên mũ 5 được 0 phẩy 32768, nên hệ số phản xạ vọt lên tới 0 phẩy 3546 tức hơn 35 phần trăm. Điều này khẳng định tính chất phi tuyến mạnh: phản xạ giữ mức thấp ở góc nhìn thông thường nhưng tăng vọt ở rìa vật thể."

  # ───────────────────────── 8. LỖI HAY GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những lỗi hay gặp khi thiết lập vật liệu dựa trên vật lý"
    checks:
      - "0.9 + 0.5 == 1.4 and 1.4 > 1.0"
      - "round(((1.3 - 1) / (1.3 + 1)) ** 2, 2) == 0.02 and round(((1.7 - 1) / (1.7 + 1)) ** 2, 2) == 0.07"
      - "round(alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.07"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cộng thêm ánh sáng phản xạ gương mà quên nhân hệ số khuếch tán với $(1 - F)$ <b class="red">(vi phạm bảo toàn năng lượng, viền vật thể phát sáng giả)</b>
          <br><span class="note">Ở rìa vật thể ($\cos\theta \to 0$), $F \to 1$. Nếu không giảm phần khuếch tán theo $(1 - F)$, rìa vật thể vừa có $100\%$ phản xạ gương vừa giữ nguyên màu khuếch tán $\implies$ tổng năng lượng vượt xa $100\%$!</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất là cộng thêm thành phần phản xạ theo góc nhìn nhưng lại quên nhân thành phần khuếch tán với 1 trừ F. Ở sát rìa vật thể nơi F tiến tới 1, việc giữ nguyên màu khuếch tán khiến rìa vừa phản xạ 100 phần trăm vừa phát màu khuếch tán, làm viền sáng rực giả tạo."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gán màu khuếch tán khác 0 cho kim loại nguyên chất, hoặc gán $F_0$ quá cao ($0{,}3..0{,}5$) cho nhựa/gỗ <b class="red">(vật liệu trông như nhựa mạ giả kim)</b>
          <br><span class="note">Hầu hết chất phi kim thông thường có chiết suất $n \in [1{,}3;\; 1{,}7] \implies F_0$ nằm trong khoảng hẹp $0{,}02..0{,}07$ (chuẩn mặc định là $0{,}04$). Ngược lại, kim loại sạch phải có khuếch tán bằng $0$.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là thiết lập thông số lai tạp phi vật lý, chẳng hạn cho kim loại có thêm màu khuếch tán hoặc đặt F không của nhựa lên tới 0 phẩy 3. Trong tự nhiên, hầu hết phi kim đều có F không nằm sát quanh mức 0 phẩy 04, còn kim loại sạch có khuếch tán bằng 0; đặt sai quy tắc này làm vật liệu trông giả tạo."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Quên rằng hiệu ứng phản xạ tăng ở góc sượt phụ thuộc vào cả <b>độ nhám bề mặt</b> <b class="red">(tường bê tông thô ráp vẫn sáng bóng ở rìa!)</b>
          <br><span class="note">Công thức $F(\theta) \to 1$ ở $\cos\theta \to 0$ áp dụng cho mặt phẳng nhẵn hoặc từng mặt gương vi mô. Trên bề mặt rất nhám (như đất sét, bê tông), nhiều mặt vi mô bị che khuất ở góc sượt nên vành sáng rìa phải được làm dịu đi theo độ nhám.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba của người đã đi làm là áp dụng nguyên xi công thức phản xạ tiến về 1 ở góc sượt cho cả những bề mặt cực kỳ thô nhám như bê tông hay vải thô. Trên bề mặt nhám, các mặt gương vi mô che khuất lẫn nhau ở góc nhìn sượt, nên khi tính chiếu sáng môi trường cần làm dịu độ chói ở rìa theo độ nhám."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính phản xạ trên mặt nước, vàng kim loại và kiểm tra năng lượng"
    checks:
      - "round(((1.33 - 1) / (1.33 + 1)) ** 2, 4) == 0.0201"
      - "round(alg.gfx_schlick_fresnel(0.5, 0.8), 5) == 0.80625"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Nước có chiết suất $n \approx 1{,}33$. Hãy tính hệ số phản xạ ở góc nhìn thẳng đứng $F_0 = \left(\frac{n - 1}{n + 1}\right)^2$ (làm tròn 2 chữ số thập phân).</td></tr>
          <tr><td>2</td><td>Một bề mặt kim loại vàng có $F_0 = 0{,}80$ ở một kênh màu (số minh hoạ). Tính tỉ lệ phản xạ tại góc nhìn 60° ($\cos\theta = 0{,}5$, biết $0{,}5^5 = 0{,}03125$) và cho biết tỉ lệ tán xạ khuếch tán của vàng bằng bao nhiêu.</td></tr>
          <tr><td>3</td><td>Một hoạ sĩ 3D muốn làm mặt bàn gỗ trông bóng rõ hơn khi nhìn từ mọi góc nên tăng thẳng $F_0$ của gỗ từ $0{,}04$ lên $0{,}50$. Cách làm đó gây ra sai lệch thị giác gì, và nên chỉnh thông số nào mới đúng?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự giải ba câu hỏi. Câu một, nước có chiết suất xấp xỉ 1 phẩy 33, hãy tính hệ số phản xạ cơ sở F không khi nhìn thẳng đứng. Câu hai, kim loại vàng có F không bằng 0 phẩy 80 ở một kênh màu, hãy tính tỉ lệ phản xạ tại góc 60 độ và cho biết tỉ lệ khuếch tán của vàng bằng bao nhiêu. Câu ba, nếu muốn mặt bàn gỗ bóng rõ hơn mà lại tăng F không từ 0 phẩy 04 lên 0 phẩy 50 thì sẽ bị lỗi gì, và nên chỉnh thông số nào mới đúng? Hãy dừng video và suy nghĩ."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> Thay $n = 1{,}33$: $F_0 = \left(\frac{1{,}33 - 1}{1{,}33 + 1}\right)^2 = \left(\frac{0{,}33}{2{,}33}\right)^2 \approx (0{,}1416)^2 \approx \hlg{0{,}02}$ ($2\%$ phản xạ khi nhìn thẳng xuống mặt nước).</p>
          <p><b>Đáp án câu 2.</b> Tại $\cos\theta = 0{,}5$: $F = 0{,}80 + (1 - 0{,}80)\cdot 0{,}03125 = 0{,}80 + 0{,}00625 = \hlg{0{,}80625}$ ($\approx 80{,}6\%$). Vì vàng là <b>kim loại</b> nên ánh sáng khúc xạ bị hấp thụ hết $\implies$ <b>tỉ lệ khuếch tán bằng $0$</b>.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, lấy 0 phẩy 33 chia 2 phẩy 33 rồi bình phương lên được F không xấp xỉ 0 phẩy 02, tức 2 phần trăm phản xạ khi nhìn thẳng. Đáp án câu hai, với vàng có F không bằng 0 phẩy 80, tại góc 60 độ hệ số phản xạ bằng 0 phẩy 80 cộng 0 phẩy 20 nhân 0 phẩy 03125 bằng 0 phẩy 80625. Vì vàng là kim loại dẫn điện nên phần ánh sáng khúc xạ vào trong bị hấp thụ hoàn toàn, do đó tỉ lệ khuếch tán bằng 0."
      - show: |
          <table class="t"><tr><th>cách chỉnh (câu 3)</th><th>hệ quả thị giác</th></tr>
