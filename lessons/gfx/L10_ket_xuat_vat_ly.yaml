scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao mặt hồ nhìn thẳng thì thấy đáy, nhìn sượt ngang lại biến thành gương?"
    checks:
      - "alg.gfx_schlick_fresnel(1.0, 0.04) == 0.04"
      - "round(alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.07"
      - "alg.gfx_schlick_fresnel(0.0, 0.04) == 1.0"
    steps:
      - show: |
          <p>Ở bài 6, mô hình chiếu sáng kinh nghiệm cộng độc lập màu khuếch tán với đốm sáng bóng mà không kiểm soát tổng năng lượng, làm vật liệu nhựa đôi khi sáng chói như tự phát quang. Ngoài đời thực, khi nhìn thẳng xuống mặt nước, nó chỉ phản xạ vài phần trăm (nước khoảng <b>$2\%$</b>, nhựa hay thuỷ tinh khoảng <b>$4\%$</b>); nhưng khi cúi thấp nhìn sượt ngang, mặt nước phản chiếu bầu trời gần như <b>$100\%$</b>!</p>
          <div class="box key">Hôm nay: làm chủ <b>kết xuất dựa trên vật lý</b> — tính tỉ lệ phản xạ gương từ <b>$0{,}04$</b> (nhìn thẳng) lên <b>$0{,}07$</b> (nghiêng 60°) tới <b>$1{,}00$</b> (nhìn sượt), và trừ phần đó khỏi ánh sáng khuếch tán để <b>bảo toàn năng lượng</b>!</div>
        focus: [1, 1, 1, 2, 2]
        say: "Chào bạn, ở bài 6, mô hình kinh nghiệm cộng rời rạc màu khuếch tán với đốm sáng bóng nên vật liệu đôi khi sáng quá mức tự nhiên. Ngoài đời thực, nhìn thẳng xuống mặt nước chỉ phản xạ khoảng 2 phần trăm, còn nhựa hay thuỷ tinh khoảng 4 phần trăm. Nhưng khi nhìn sượt ngang, mặt nước phản xạ gần 100 phần trăm. Hôm nay ta học kết xuất dựa trên vật lý, tính tỉ lệ phản xạ tăng từ 0 phẩy 04 ở góc thẳng lên 0 phẩy 07 ở góc 60 độ và đạt 1 ở góc sượt. Đồng thời ta lấy 1 trừ đi phần phản xạ gương để giới hạn phần khuếch tán nhằm bảo toàn năng lượng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: mô hình bài 6, không gian tuyến tính bài 8 và chiết suất"
    checks:
      - "round(((1.5 - 1) / (1.5 + 1)) ** 2, 4) == 0.04"
      - "0.5 ** 5 == 0.03125"
    steps:
      - show: |
          <p><b>① Hạn chế của mô hình kinh nghiệm</b> (bài 6): cộng trực tiếp hệ số khuếch tán $k_d$ và hệ số phản xạ bóng $k_s$ cố định ở mọi góc nhìn; nếu đặt $k_d + k_s > 1$, bề mặt phản xạ nhiều năng lượng hơn cả lượng ánh sáng chiếu vào!</p>
          <p><b>② Cộng trừ năng lượng trong không gian tuyến tính</b> (bài 8): mọi tỉ lệ phân chia năng lượng phản xạ và khúc xạ đều phải tính trên cường độ sáng tuyến tính.</p>
        focus: [1, 1, 1, 2]
        say: "Trước hết ta ôn lại ba điểm nối từ các bài trước. Thứ nhất, ở bài 6, mô hình chiếu sáng kinh nghiệm giữ cố định hệ số khuếch tán và hệ số bóng ở mọi góc nhìn. Nếu người thiết kế chọn tổng hai hệ số lớn hơn 1, bề mặt sẽ trả ra nhiều ánh sáng hơn cả nguồn chiếu tới, vi phạm định luật vật lý. Thứ hai, theo bài 8, mọi phép cân bằng năng lượng này đều phải thực hiện trong không gian ánh sáng tuyến tính."
      - clear: true
        show: |
          <p><b>③ Chiết suất và hệ số phản xạ thẳng góc:</b> <b>chiết suất</b> $n$ của một vật liệu là tốc độ ánh sáng trong chân không chia cho tốc độ ánh sáng trong vật liệu đó (nước khoảng $1{,}33$, thuỷ tinh khoảng $1{,}5$). Khi chạm mặt phân cách, một phần ánh sáng phản xạ lại, phần còn lại <b>khúc xạ</b>, tức đi xuyên vào trong vật và đổi hướng. Ở góc nhìn thẳng đứng ($\theta = 0$), tỉ lệ phản xạ $F_0$ của bề mặt phẳng giữa không khí ($n_1 = 1$) và môi trường chiết suất $n$ là:</p>
          $$F_0 = \left(\frac{n - 1}{n + 1}\right)^2 \implies \text{với thuỷ tinh / nhựa } n = 1{,}5:\;\; F_0 = \left(\frac{0{,}5}{2{,}5}\right)^2 = 0{,}2^2 = \hlg{0{,}04}$$
        focus: [1, 1, 1, 2, 2]
        say: "Thứ ba là chiết suất, tức tốc độ ánh sáng trong chân không chia cho tốc độ ánh sáng trong vật liệu, với nước khoảng 1 phẩy 33 và thuỷ tinh khoảng 1 phẩy 5. Khi chạm mặt phân cách, một phần ánh sáng phản xạ lại, phần còn lại khúc xạ, tức đi xuyên vào trong vật và đổi hướng. Công thức quang học tính hệ số phản xạ cơ sở F không khi nhìn vuông góc vào mặt phân cách giữa không khí và vật liệu có chiết suất n. Tỉ lệ F không bằng bình phương của hiệu n trừ 1 chia cho tổng n cộng 1. Thay chiết suất của thuỷ tinh hoặc nhựa là 1 phẩy 5, ta có 0 phẩy 5 chia 2 phẩy 5 bằng 0 phẩy 2, bình phương lên được 0 phẩy 04."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: góc nhìn, hệ số phản xạ cơ sở và độ nhám vi bề mặt"
    checks:
      - "round(alg.gfx_schlick_fresnel(0.5, 0.04), 5) == 0.07000"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu / thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td>$\theta,\; \cos\theta \in [0, 1]$</td><td>góc giữa hướng nhìn (hoặc vector nửa đường) với pháp tuyến bề mặt; nhìn thẳng có $\cos\theta = 1$, nhìn sượt ngang có $\cos\theta = 0$</td></tr>
          <tr><td>$F_0 \in [0, 1]$</td><td>tỉ lệ năng lượng phản xạ gương ở góc nhìn thẳng đứng ($\theta = 0$); phi kim thường có $F_0 \approx 0{,}04$</td></tr>
          <tr><td>$F(\theta) \in [F_0, 1]$</td><td>tỉ lệ năng lượng phản xạ gương tại góc $\theta$ (hiệu ứng <b>Fresnel</b> — tăng dần lên $1$ khi $\cos\theta \to 0$)</td></tr>
          <tr><td>$1 - F(\theta)$</td><td>phần năng lượng còn lại đi vào bên trong vật liệu (bị hấp thụ hoàn toàn ở kim loại, hoặc tán xạ thành màu khuếch tán ở phi kim)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã bốn ký hiệu cốt lõi của bài học. Góc giữa hướng nhìn và pháp tuyến có giá trị cosin chạy từ 1 khi nhìn thẳng đứng xuống 0 khi nhìn sượt sát mặt phẳng. Ký hiệu F không là tỉ lệ phản xạ gương ở góc nhìn thẳng, với các chất phi kim như nước, nhựa hay gỗ thì F không chỉ vài phần trăm, thường lấy 0 phẩy 04. Hàm F theo góc nhìn biểu diễn tỉ lệ phản xạ gương tăng dần từ F không lên tới 1 khi góc nhìn tiến tới 90 độ. Phần năng lượng còn lại bằng 1 trừ F sẽ đi vào trong bề mặt để tạo nên màu khuếch tán."

