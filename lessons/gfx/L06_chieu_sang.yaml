scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao tính ánh sáng làm khối cầu căng tròn thay vì hình tròn dẹt?"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
    steps:
      - show: |
          <p>Khi ta vẽ một khối cầu 3D lên màn hình mà chưa tính ánh sáng, mọi mảnh đều có chung một mã màu: mắt chỉ thấy một <b>hình tròn phẳng dẹt</b> như tờ giấy cắt!</p>
          <div class="box key">Chỉ khi tính toán ánh sáng trên từng mảnh — kết hợp <b>khuếch tán theo cô-sin</b> ($\mathbf{n} \cdot \mathbf{l} = 0{,}8$) và <b>bóng sáng</b> ($0{,}95^{32} \approx 0{,}194$) — khối cầu mới hiện rõ chiều sâu, độ căng tròn và chất liệu bóng loáng.</div>
        focus: [1, 2]
        say: "Khi vẽ một khối cầu không tính ánh sáng, mọi mảnh đều cùng một màu khiến nó phẳng dẹt như bìa giấy. Bài học hôm nay giúp bạn hiểu công thức kết hợp ánh sáng khuếch tán và điểm bóng sáng để tạo nên chiều sâu sống động."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tích vô hướng hai vector ở bài 1 và toạ độ trọng tâm ở bài 4"
    checks:
      - "0 * 0 + 0 * 0.6 + 1 * 0.8 == 0.8"
      - "0.6 ** 2 + 0.8 ** 2 == 1.0"
    steps:
      - show: |
          <p><b>① Tích vô hướng hai vector đơn vị</b> (bài 1): góc $\theta$ giữa hai hướng đo bằng tích vô hướng:</p>
          $$\mathbf{a} \cdot \mathbf{b} = \|\mathbf{a}\| \, \|\mathbf{b}\| \cos\theta = \cos\theta \quad (\text{khi } \|\mathbf{a}\| = \|\mathbf{b}\| = 1)$$
          <p class="note">Khi hai hướng trùng nhau thì $\cos\theta = 1$ (sáng nhất); khi vuông góc thì $\cos\theta = 0$ (tắt hẳn); khi quay lưng vào nhau thì $\cos\theta < 0$.</p>
        focus: [1, 2]
        say: "Trước hết ta ôn lại tích vô hướng giữa hai vector đơn vị từ bài 1. Khi hai vector cùng hướng, tích bằng 1; khi chúng vuông góc, tích bằng 0; còn khi quay lưng, tích nhận giá trị âm."
      - show: |
          <p><b>② Nội suy thuộc tính qua tam giác</b> (bài 4): toạ độ trọng tâm nội suy vector pháp tuyến từ ba đỉnh đến từng mảnh:</p>
          $$\mathbf{n}_{\text{mảnh}} = w_0\,\mathbf{n}_0 + w_1\,\mathbf{n}_1 + w_2\,\mathbf{n}_2$$
          <p class="note">Cảnh báo quan trọng: tổng các vector đơn vị <b>chưa chắc là vector đơn vị</b>, nên bắt buộc phải chuẩn hoá lại ở từng mảnh!</p>
        focus: [1, 2]
        say: "Thứ hai, ở bài 4 ta đã học cách dùng toạ độ trọng tâm để nội suy vector pháp tuyến từ ba đỉnh tới từng mảnh. Tuy nhiên, phép cộng nội suy sẽ làm giảm độ dài của vector, nên ta bắt buộc phải chuẩn hoá lại."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: pháp tuyến n, hướng sáng l, hướng nhìn v và vector nửa đường h"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$\mathbf{n}$</td><td><b>vector pháp tuyến đơn vị</b>: hướng vuông góc với bề mặt tại điểm đang xét ($\|\mathbf{n}\| = 1$)</td></tr>
          <tr><td>$\mathbf{l}$</td><td><b>vector hướng sáng đơn vị</b>: hướng chỉ từ điểm bề mặt về phía nguồn sáng ($\|\mathbf{l}\| = 1$)</td></tr>
          <tr><td>$\mathbf{v}$</td><td><b>vector hướng nhìn đơn vị</b>: hướng chỉ từ điểm bề mặt về phía mắt camera ($\|\mathbf{v}\| = 1$)</td></tr>
          <tr><td>$\mathbf{h}$</td><td><b>vector nửa đường đơn vị</b>: $\mathbf{h} = \frac{\mathbf{l} + \mathbf{v}}{\|\mathbf{l} + \mathbf{v}\|}$ (nằm chính giữa $\mathbf{l}$ và $\mathbf{v}$)</td></tr>
          <tr><td>$s$</td><td><b>số mũ bóng sáng</b>: xác định độ nhọn của điểm bóng (vật liệu càng bóng, $s$ càng lớn)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã các ký hiệu chiếu sáng. Vector n là pháp tuyến vuông góc với mặt phẳng. Vector l hướng về nguồn sáng, còn vector v hướng về mắt nhìn. Vector h là hướng nửa đường nằm chính giữa hướng sáng và hướng nhìn. Tham số s là số mũ quyết định độ thu gọn của điểm bóng sáng."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình cơ chế: ba thành phần chiếu sáng — môi trường, khuếch tán và bóng sáng"
    checks:
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
      - "round(alg.gfx_blinn_spec(0.95, 128), 4) == 0.0014"
    steps:
      - show: |
          <div><svg width="1440" height="420" viewBox="0 0 1440 420">
          <rect x="50" y="30" width="410" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <text x="255" y="70" font-size="22" font-weight="bold" fill="#334155" text-anchor="middle">1. Ánh sáng môi trường</text>
          <circle cx="255" cy="200" r="100" fill="#64748b"/>
          <text x="255" y="340" font-size="18" fill="#475569" text-anchor="middle">Chiếu đều mọi hướng, không đổi</text>

          <rect x="515" y="30" width="410" height="360" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
          <text x="720" y="70" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2. Khuếch tán cô-sin</text>
          <circle cx="720" cy="200" r="100" fill="url(#diffuseGrad)"/>
          <defs><radialGradient id="diffuseGrad" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1e3a8a"/></radialGradient></defs>
          <text x="720" y="340" font-size="18" fill="#1d4ed8" text-anchor="middle">Tỉ lệ với tích vô hướng n và l</text>

          <rect x="980" y="30" width="410" height="360" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
          <text x="1185" y="70" font-size="22" font-weight="bold" fill="#a16207" text-anchor="middle">3. Bóng sáng nửa đường</text>
          <circle cx="1185" cy="200" r="100" fill="#1e293b"/>
          <ellipse cx="1150" cy="165" rx="20" ry="14" fill="#ffffff"/>
          <text x="1185" y="340" font-size="18" fill="#a16207" text-anchor="middle">Lũy thừa số mũ s tạo đốm chói</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ minh hoạ tách bạch ba thành phần ánh sáng cơ bản. Thành phần môi trường rải đều khắp không gian giúp mặt tối không bị đen kịt. Thành phần khuếch tán biến thiên theo góc chiếu làm nổi bật khối cong. Thành phần bóng sáng tạo nên vệt phản chiếu sắc gọn theo hướng mắt nhìn."

  # ───────────────────────── 5. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Công thức chiếu sáng: tổng hợp môi trường, khuếch tán Lambert và bóng sáng Blinn"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
    steps:
      - show: |
          <p><b>Bước 1 — Thành phần khuếch tán theo định luật Lambert:</b></p>
          $$I_{\text{diffuse}} = k_d \cdot \max(0, \mathbf{n} \cdot \mathbf{l})$$
          <p class="note">Vì ánh sáng tán xạ đều ra mọi hướng theo định luật cô-sin, nên cường độ tỉ lệ thuận với tích $\mathbf{n} \cdot \mathbf{l}$. Dùng hàm $\max(0, \cdot)$ để triệt tiêu ánh sáng khi nguồn sáng nằm ở lưng mặt phẳng.</p>
        focus: [1, 2]
        say: "Bước một, theo định luật cô-sin, cường độ khuếch tán tỉ lệ thuận với tích vô hướng của pháp tuyến n và hướng sáng l. Do ánh sáng không xuyên qua lưng bề mặt, ta dùng hàm lấy số lớn hơn với 0 để gạt bỏ phần giá trị âm."
      - show: |
          <p><b>Bước 2 — Thành phần phản xạ bóng sáng theo mô hình Blinn–Phong:</b></p>
          $$I_{\text{specular}} = k_s \cdot \max(0, \mathbf{n} \cdot \mathbf{h})^s \quad \text{với } \mathbf{h} = \frac{\mathbf{l} + \mathbf{v}}{\|\mathbf{l} + \mathbf{v}\|}$$
          <p class="note">Thay vì tính vector phản xạ phức tạp, ta theo phương pháp dùng vector nửa đường $\mathbf{h}$. Khi $\mathbf{n}$ gần $\mathbf{h}$, lũy thừa bậc $s$ co cụm vệt sáng thành đốm nhỏ rực rỡ.</p>
        focus: [1, 2]
        say: "Bước hai, thay vì tính vector phản xạ tốn kém, ta dùng vector nửa đường h. Nhờ số mũ s nằm ở lũy thừa, chỉ những điểm có pháp tuyến gần sát với hướng nửa đường mới tạo ra điểm chói sáng."
      - clear: true
        show: |
          <p><b>Bước 3 — Tổng hợp toàn bộ ánh sáng cục bộ trên một mảnh:</b></p>
          $$I = I_{\text{ambient}} + I_{\text{diffuse}} + I_{\text{specular}} = k_a \, I_a + k_d \, I_l \, \max(0, \mathbf{n} \cdot \mathbf{l}) + k_s \, I_l \, \max(0, \mathbf{n} \cdot \mathbf{h})^s$$
          <p class="note">Vì mỗi mảnh trên màn hình nhận cả ba thành phần ánh sáng, nên ta cộng gộp ba giá trị lại để ra màu sắc cuối cùng của điểm ảnh.</p>
        focus: [1, 2]
        say: "Bước ba, vì mỗi mảnh nhận đồng thời cả ba nguồn sáng, nên ta cộng gộp thành phần môi trường, khuếch tán và bóng sáng lại với nhau. Kết quả tổng hợp này được tính độc lập trên từng mảnh sau khi raster hoá lưới tam giác."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính tay: độ sáng khuếch tán và so sánh kích thước điểm bóng s = 32 với s = 128"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
      - "round(alg.gfx_blinn_spec(0.95, 128), 4) == 0.0014"
      - "round(0.194 / 0.0014, 1) == 138.6"
    steps:
      - show: |
          <p><b>Phép tính 1 — Tính độ sáng khuếch tán:</b> Cho $\mathbf{n} = (0, 0, 1)$ và hướng sáng $\mathbf{l} = (0; 0{,}6; 0{,}8)$:</p>
          $$\mathbf{n} \cdot \mathbf{l} = 0 \cdot 0 + 0 \cdot 0{,}6 + 1 \cdot 0{,}8 = \hlg{0{,}8}$$
          <p class="note">Vì $0{,}8 > 0$ nên bề mặt nhận được $80\%$ cường độ ánh sáng chiếu tới.</p>
        focus: [1, 2]
        say: "Phép tính thứ nhất, cho pháp tuyến hướng thẳng lên trục z và hướng sáng lệch nhẹ với toạ độ 0, 0 phẩy 6 và 0 phẩy 8. Nhân vô hướng hai vector, ta thu được kết quả bằng 0 phẩy 8, tức bề mặt nhận 80 phần trăm ánh sáng tới."
      - clear: true
        show: |
          <p><b>Phép tính 2 — So sánh điểm bóng sáng với $\mathbf{n} \cdot \mathbf{h} = 0{,}95$:</b></p>
          <p>• Khi bề mặt hơi mờ, chọn số mũ $s = 32$:</p>
          $$I_{\text{spec}} = 0{,}95^{32} \approx \hlb{0{,}194} \quad (\approx 19{,}4\%)$$
          <p>• Khi bề mặt kim loại bóng loáng, chọn số mũ $s = 128$:</p>
          $$I_{\text{spec}} = 0{,}95^{128} \approx \hlo{0{,}0014} \quad (\text{nhỏ hơn } 0{,}194 \text{ tới } \approx 139 \text{ lần!})$$
        focus: [1, [2, 3], [4, 5]]
        say: "Phép tính thứ hai, xét một điểm có cô-sin lệch nhẹ giữa pháp tuyến và vector nửa đường bằng 0 phẩy 95. Với chất liệu hơi mờ có s bằng 32, giá trị bóng sáng là 0 phẩy 194. Nhưng khi tăng s lên 128 cho chất liệu bóng loáng, giá trị này tụt xuống chỉ còn 0 phẩy 0014, tức giảm gần 139 lần."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: tia sáng chiếu từ sau lưng và trường hợp bóng sáng cực đại"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, -0.8)) == 0.0"
      - "alg.gfx_blinn_spec(1.0, 32) == 1.0"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Tia sáng chiếu từ phía sau bề mặt:</b> Cho $\mathbf{l} = (0; 0{,}6; -0{,}8)$:</p>
          $$\mathbf{n} \cdot \mathbf{l} = 1 \cdot (-0{,}8) = -0{,}8 \implies \max(0, -0{,}8) = \hlg{0}$$
          <p class="note">Vì nguồn sáng nằm khuất sau mặt phẳng nên cường độ khuếch tán tự động về $0$, không làm mặt bị âm màu.</p>
        focus: [1, 2]
        say: "Để tự kiểm tra tính đúng đắn, ta xét tia sáng chiếu từ sau lưng với thành phần z bằng trừ 0 phẩy 8. Vì tích vô hướng cho ra số âm, nên hàm lấy số lớn hơn lập tức ép về 0 giúp mặt sau không bị tối đen sai quy luật."
      - show: |
          <p><b>Kiểm tra 2 — Phản xạ hoàn hảo tại tâm điểm chói:</b> Khi $\mathbf{n} = \mathbf{h}$:</p>
          $$\mathbf{n} \cdot \mathbf{h} = 1 \implies 1^s = \hlg{1{,}0} \quad (\text{đạt cực đại với mọi } s)$$
          <p class="note">Thay toạ độ trùng khít vào công thức, ta thấy kết quả luôn đạt cực đại bằng $1$ bất kể số mũ $s$.</p>
        focus: [1, 2]
        say: "Ở trường hợp thứ hai, khi hướng nhìn và hướng sáng thẳng góc phản xạ thì vector n trùng với vector h. Thay số vào công thức, ta có tích vô hướng bằng 1 và 1 mũ s luôn bằng 1, cho độ sáng cực đại đúng như mong đợi."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Ba lỗi kinh điển khi tính ánh sáng trên mảnh"
    checks:
      - "round(0.707 ** 2 + 0.707 ** 2, 2) == 1.0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Quên chuẩn hoá lại vector pháp tuyến sau khi nội suy mảnh <b class="red">(vector bị co ngắn làm mặt bị tối hoặc méo điểm bóng)</b></div>
          <p class="note">Nội suy hai vector đơn vị làm độ dài ở giữa tam giác bị tụt xuống $\approx 0{,}707$. Nếu không gọi hàm chuẩn hoá trong bộ tô mảnh, độ sáng sẽ biến đổi phụ thuộc vào kích thước đa giác.</p>
        focus: [1, 2]
        say: "Lỗi phổ biến nhất của người làm đồ hoạ là quên chuẩn hoá lại vector pháp tuyến trong bộ tô mảnh. Do phép nội suy làm co ngắn vector ở giữa tam giác, nếu không chuẩn hoá lại thì mặt vật thể sẽ bị tối màu cục bộ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ quên hàm $\max(0, \mathbf{n} \cdot \mathbf{l})$ khiến tích vô hướng âm triệt tiêu ánh sáng môi trường <b class="red">(làm mặt sau tối đen bất thường)</b></div>
          <p class="note">Khi tính toán véc tơ, nếu để giá trị âm lọt vào phép cộng màu thì điểm ảnh sẽ bị đen thủng bất thường.</p>
        focus: [1, 2]
        say: "Lỗi thứ hai là bỏ sót hàm chặn số âm khiến tích vô hướng nhận giá trị âm khi nguồn sáng ở sau lưng. Vì giá trị âm này trừ bớt vào ánh sáng môi trường, nên nó sẽ tạo ra các vùng đen thủng vô lý trên vật thể."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính độ sáng khuếch tán và so sánh số mũ s"
    checks:
      - "round(alg.gfx_lambert((0, 0, 1), (0.6, 0.0, 0.8)), 1) == 0.8"
      - "round(alg.gfx_blinn_spec(0.90, 32), 3) == 0.034"
      - "round(alg.gfx_blinn_spec(0.90, 8), 3) == 0.430"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Cho pháp tuyến $\mathbf{n} = (0, 0, 1)$ và hướng sáng $\mathbf{l} = (0{,}6; 0; 0{,}8)$. Hãy tính cường độ khuếch tán $I_d$.</td></tr>
          <tr><td>2</td><td>Tại điểm có $\mathbf{n} \cdot \mathbf{h} = 0{,}90$, hãy tính thành phần bóng sáng $I_s$ khi $s = 8$ và khi $s = 32$. Giá trị nào tạo đốm sáng nhỏ hơn?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm hai bài tập nhỏ. Câu một, tính cường độ khuếch tán khi hướng sáng có toạ độ 0 phẩy 6, 0 và 0 phẩy 8. Câu hai, tính bóng sáng khi cô-sin bằng 0 phẩy 90 với hai số mũ 8 và 32. Hãy dừng video và tính toán."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 — Tính cường độ khuếch tán:</b> Nhân vô hướng giữa $\mathbf{n}$ và $\mathbf{l}$:</p>
          $$I_d = \max(0, \mathbf{n} \cdot \mathbf{l}) = \max(0, 0 \cdot 0{,}6 + 0 \cdot 0 + 1 \cdot 0{,}8) = \max(0, 0{,}8) = \hlg{0{,}8}$$
          <p class="note">Vì tích vô hướng dương bằng $0{,}8$ nên cường độ khuếch tán đạt $80\%$ mức tối đa.</p>
        focus: [1, 2]
        say: "Đáp án câu một, ta lấy tích vô hướng giữa hai véc tơ và thu được 0 phẩy 8. Do con số này dương nên cường độ khuếch tán đạt 80 phần trăm mức tối đa."
      - show: |
          <p><b>Đáp án câu 2 — Tính thành phần bóng sáng:</b> Lấy lũy thừa bậc $s$ của $0{,}90$:</p>
          $$s = 8 \implies 0{,}90^8 \approx \hlb{0{,}430}; \qquad s = 32 \implies 0{,}90^{32} \approx \hlg{0{,}034}$$
          <p class="note">Số mũ $s = 32$ làm cường độ tụt nhanh hơn $12$ lần, giúp đốm bóng <b>thu nhỏ và sắc cạnh hơn</b>.</p>
        focus: [1, 2]
        say: "Đáp án câu hai, với số mũ 8 giá trị bóng sáng là 0 phẩy 430, còn với số mũ 32 giá trị tụt xuống 0 phẩy 034. Số mũ 32 làm điểm chói thu nhỏ và sắc nét hơn nhiều."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic chiếu sáng cục bộ & cầu nối sang bài kết cấu"
    steps:
      - show: |
          <div class="chain"><span class="n">Môi trường $k_a I_a$ (đều khắp)</span><span class="a">+</span>
          <span class="n">Khuếch tán $k_d \max(0, \mathbf{n}\cdot\mathbf{l})$</span><span class="a">+</span>
          <span class="n">Bóng sáng $k_s (\mathbf{n}\cdot\mathbf{h})^s$</span><span class="a">→</span>
          <span class="n">Chuẩn hoá vector mảnh</span></div>
        focus: [1, 1]
        say: "Tổng kết bài học, mô hình chiếu sáng cục bộ là tổng hợp của ba thành phần: môi trường, khuếch tán và bóng sáng. Điểm cốt lõi là luôn chuẩn hoá lại vector pháp tuyến trên từng mảnh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>kết cấu và lấy mẫu: nội suy song tuyến, mipmap, răng cưa</b>. Ta sẽ học cách thay hằng số màu $k_d$ bằng một bức ảnh thực tế dán lên bề mặt 3D!</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài 7 tới, ta sẽ học về kết cấu bề mặt để thay thế các hệ số màu đơn điệu bằng những bức tranh chi tiết dán lên mô hình 3D. Hẹn gặp bạn ở video tiếp theo."
