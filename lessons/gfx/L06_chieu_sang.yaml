  # ───────────────────────── 5. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Công thức chiếu sáng: tổng hợp môi trường, khuếch tán Lambert và bóng sáng Blinn"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
    steps:
      - show: |
          <p><b>Bước 1 — Thành phần khuếch tán theo định luật Lambert:</b></p>
          $$I_{\text{diffuse}} = k_d \, I_l \, \max(0, \mathbf{n} \cdot \mathbf{l})$$
          <p class="note">Chùm sáng chiếu xiên trải ra trên diện tích lớn hơn, nên mỗi đơn vị diện tích chỉ nhận một phần năng lượng bằng cô-sin góc tới, tức $\mathbf{n} \cdot \mathbf{l}$. Bề mặt khuếch tán lại hắt đều ra mọi hướng, nên kết quả không phụ thuộc hướng nhìn. Dùng hàm $\max(0, \cdot)$ để triệt tiêu ánh sáng khi nguồn sáng nằm ở lưng mặt phẳng.</p>
        focus: [1, 2, 2, 2]
        say: "Bước một, theo định luật cô-sin, cường độ khuếch tán tỉ lệ thuận với tích vô hướng của pháp tuyến n và hướng sáng l. Lý do là chùm sáng chiếu xiên trải ra trên diện tích lớn hơn, nên mỗi đơn vị diện tích chỉ nhận một phần năng lượng bằng cô-sin góc tới. Bề mặt khuếch tán hắt đều ra mọi hướng, nên kết quả không phụ thuộc hướng nhìn. Do ánh sáng không xuyên qua lưng bề mặt, ta dùng hàm lấy số lớn hơn với 0 để gạt bỏ phần giá trị âm."
      - show: |
          <p><b>Bước 2 — Thành phần phản xạ bóng sáng theo mô hình Blinn–Phong:</b></p>
          $$I_{\text{specular}} = k_s \, I_l \, \max(0, \mathbf{n} \cdot \mathbf{h})^s \quad \text{với } \mathbf{h} = \frac{\mathbf{l} + \mathbf{v}}{\|\mathbf{l} + \mathbf{v}\|}$$
          <p class="note">Thay vì tính vector phản xạ phức tạp, ta theo phương pháp dùng vector nửa đường $\mathbf{h}$. Khi $\mathbf{n}$ gần $\mathbf{h}$, lũy thừa bậc $s$ co cụm vệt sáng thành đốm nhỏ rực rỡ.</p>
        focus: [1, 2]
        say: "Bước hai, thay vì tính vector phản xạ tốn kém, ta dùng vector nửa đường h. Nhờ số mũ s nằm ở lũy thừa, chỉ những điểm có pháp tuyến gần sát với hướng nửa đường mới tạo ra điểm chói sáng."
      - clear: true
        show: |
          <p><b>Bước 3 — Tổng hợp toàn bộ ánh sáng cục bộ trên một mảnh:</b></p>
          $$I = I_{\text{ambient}} + I_{\text{diffuse}} + I_{\text{specular}} = k_a \, I_a + k_d \, I_l \, \max(0, \mathbf{n} \cdot \mathbf{l}) + k_s \, I_l \, \max(0, \mathbf{n} \cdot \mathbf{h})^s$$
          <p class="note">Vì mỗi mảnh trên màn hình nhận cả ba thành phần ánh sáng, nên ta cộng gộp ba giá trị lại để ra màu sắc cuối cùng của điểm ảnh.</p>
        focus: [1, 2]
        say: "Bước ba, vì mỗi mảnh nhận đồng thời cả ba thành phần ánh sáng, nên ta cộng gộp thành phần môi trường, khuếch tán và bóng sáng lại với nhau. Kết quả tổng hợp này được tính riêng cho từng mảnh, sau khi các tam giác đã được phủ lên lưới điểm ảnh."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính tay: độ sáng khuếch tán và so sánh kích thước điểm bóng s = 32 với s = 128"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
      - "round(alg.gfx_blinn_spec(0.95, 128), 4) == 0.0014"
      - "round(0.95 ** 32 / 0.95 ** 128) == 138"
    steps:
      - show: |
          <p><b>Phép tính 1 — Tính độ sáng khuếch tán:</b> Cho $\mathbf{n} = (0, 0, 1)$ và hướng sáng $\mathbf{l} = (0; 0{,}6; 0{,}8)$:</p>
          $$\mathbf{n} \cdot \mathbf{l} = 0 \cdot 0 + 0 \cdot 0{,}6 + 1 \cdot 0{,}8 = \hlg{0{,}8}$$
          <p class="note">Vì $0{,}8 > 0$ nên bề mặt nhận được $80\%$ cường độ ánh sáng chiếu tới.</p>
        focus: [1, 2]
        say: "Phép tính thứ nhất, cho pháp tuyến hướng thẳng lên trục z và hướng sáng lệch nhẹ với toạ độ 0, 0 phẩy 6 và 0 phẩy 8. Nhân vô hướng hai vector, ta thu được kết quả bằng 0 phẩy 8, tức bề mặt nhận 80 phần trăm ánh sáng tới."
      - clear: true
        show: |
          <p><b>Phép tính 2 — So sánh điểm bóng sáng với $\mathbf{n} \cdot \mathbf{h} = 0{,}95$</b> (lấy $k_s = I_l = 1$):</p>
          <p>• Khi bề mặt hơi mờ, chọn số mũ $s = 32$:</p>
          $$I_{\text{specular}} = 0{,}95^{32} \approx \hlb{0{,}194} \quad (\approx 19{,}4\%)$$
          <p>• Khi bề mặt kim loại bóng loáng, chọn số mũ $s = 128$:</p>
          $$I_{\text{specular}} = 0{,}95^{128} \approx \hlo{0{,}0014} \quad (\text{nhỏ hơn } 0{,}194 \text{ tới } \approx 138 \text{ lần!})$$
        focus: [1, [2, 3], [4, 5]]
        say: "Phép tính thứ hai, xét một điểm có cô-sin lệch nhẹ giữa pháp tuyến và vector nửa đường bằng 0 phẩy 95. Với chất liệu hơi mờ có s bằng 32, giá trị bóng sáng là 0 phẩy 194. Nhưng khi tăng s lên 128 cho chất liệu bóng loáng, giá trị này tụt xuống chỉ còn 0 phẩy 0014, tức giảm khoảng 138 lần."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: tia sáng chiếu từ sau lưng và trường hợp bóng sáng cực đại"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, -0.8)) == 0.0"
      - "alg.gfx_blinn_spec(1.0, 32) == 1.0"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Tia sáng chiếu từ phía sau bề mặt:</b> Cho $\mathbf{l} = (0; 0{,}6; -0{,}8)$:</p>
          $$\mathbf{n} \cdot \mathbf{l} = 1 \cdot (-0{,}8) = -0{,}8 \implies \max(0, -0{,}8) = \hlg{0}$$
          <p class="note">Vì nguồn sáng nằm khuất sau mặt phẳng nên cường độ khuếch tán tự động về $0$, không làm mặt bị âm màu.</p>
        focus: [1, 2]
        say: "Để tự kiểm tra tính đúng đắn, ta xét tia sáng chiếu từ sau lưng với thành phần z bằng trừ 0 phẩy 8. Vì tích vô hướng cho ra số âm, nên hàm lấy số lớn hơn ép phần khuếch tán về 0 thay vì để số âm trừ bớt ánh sáng môi trường."
      - show: |
          <p><b>Kiểm tra 2 — Phản xạ hoàn hảo tại tâm điểm chói:</b> Khi $\mathbf{n} = \mathbf{h}$:</p>
          $$\mathbf{n} \cdot \mathbf{h} = 1 \implies 1^s = \hlg{1{,}0} \quad (\text{đạt cực đại với mọi } s)$$
          <p class="note">Thay toạ độ trùng khít vào công thức, ta thấy kết quả luôn đạt cực đại bằng $1$ bất kể số mũ $s$.</p>
        focus: [1, 2]
        say: "Ở trường hợp thứ hai, khi hướng nhìn đúng bằng hướng phản xạ gương của hướng sáng qua pháp tuyến thì vector n trùng với vector h. Thay số vào công thức, ta có tích vô hướng bằng 1 và 1 mũ s luôn bằng 1, cho độ sáng cực đại đúng như mong đợi."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Hai lỗi kinh điển khi tính ánh sáng trên mảnh"
    checks:
      - "round((0.5 ** 2 + 0.5 ** 2) ** 0.5, 3) == 0.707"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Quên chuẩn hoá lại vector pháp tuyến sau khi nội suy mảnh <b class="red">(vector bị co ngắn làm mặt bị tối hoặc méo điểm bóng)</b></div>
          <p class="note">Ví dụ hai pháp tuyến đỉnh lệch nhau $90°$, $(1, 0)$ và $(0, 1)$: điểm giữa nội suy ra $(0{,}5;\ 0{,}5)$, độ dài chỉ còn $\approx 0{,}707$. Nếu không gọi hàm chuẩn hoá trong <b>bộ tô mảnh</b> (chương trình nhỏ chạy cho từng mảnh để tính màu của nó), độ sáng sẽ phụ thuộc vào độ lệch giữa các pháp tuyến đỉnh (tam giác càng lớn trên mặt cong thì lệch càng nhiều).</p>
        focus: [1, 2, 2]
        say: "Lỗi phổ biến nhất của người làm đồ hoạ là quên chuẩn hoá lại vector pháp tuyến trong bộ tô mảnh, tức chương trình nhỏ chạy cho từng mảnh để tính màu của nó. Ví dụ hai pháp tuyến đỉnh lệch nhau 90 độ thì điểm giữa nội suy chỉ dài khoảng 0 phẩy 707. Do phép nội suy làm co ngắn vector ở giữa tam giác, nếu không chuẩn hoá lại thì mặt vật thể sẽ bị tối màu cục bộ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ quên hàm $\max(0, \mathbf{n} \cdot \mathbf{l})$ khiến tích vô hướng âm triệt tiêu ánh sáng môi trường <b class="red">(làm mặt sau tối đen bất thường)</b></div>
          <p class="note">Khi tính toán véc tơ, nếu để giá trị âm lọt vào phép cộng màu thì điểm ảnh sẽ bị đen thủng bất thường.</p>
        focus: [1, 2]
        say: "Lỗi thứ hai là bỏ sót hàm chặn số âm khiến tích vô hướng nhận giá trị âm khi nguồn sáng ở sau lưng. Vì giá trị âm này trừ bớt vào ánh sáng môi trường, nên nó sẽ tạo ra các vùng đen thủng vô lý trên vật thể."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính độ sáng khuếch tán và so sánh số mũ s"
    checks:
      - "round(alg.gfx_lambert((0, 0, 1), (0.6, 0.0, 0.8)), 1) == 0.8"
      - "round(alg.gfx_blinn_spec(0.90, 32), 3) == 0.034"
      - "round(alg.gfx_blinn_spec(0.90, 8), 3) == 0.430"
      - "round(0.9 ** 8 / 0.9 ** 32, 1) == 12.5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Cho pháp tuyến $\mathbf{n} = (0, 0, 1)$ và hướng sáng $\mathbf{l} = (0{,}6; 0; 0{,}8)$. Lấy $k_d = I_l = 1$, hãy tính cường độ khuếch tán $I_{\text{diffuse}}$.</td></tr>
          <tr><td>2</td><td>Tại điểm có $\mathbf{n} \cdot \mathbf{h} = 0{,}90$, lấy $k_s = I_l = 1$, hãy tính thành phần bóng sáng $I_{\text{specular}}$ khi $s = 8$ và khi $s = 32$. Giá trị nào tạo đốm sáng nhỏ hơn?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm hai bài tập nhỏ. Câu một, lấy hệ số vật liệu và cường độ nguồn sáng đều bằng 1, tính cường độ khuếch tán khi hướng sáng có toạ độ 0 phẩy 6, 0 và 0 phẩy 8. Câu hai, cũng lấy hai hệ số đó bằng 1, tính bóng sáng khi cô-sin bằng 0 phẩy 90 với hai số mũ 8 và 32. Hãy dừng video và tính toán."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 — Tính cường độ khuếch tán:</b> Nhân vô hướng giữa $\mathbf{n}$ và $\mathbf{l}$:</p>
          $$I_{\text{diffuse}} = 1 \cdot 1 \cdot \max(0, \mathbf{n} \cdot \mathbf{l}) = \max(0, 0 \cdot 0{,}6 + 0 \cdot 0 + 1 \cdot 0{,}8) = \max(0, 0{,}8) = \hlg{0{,}8}$$
          <p class="note">Vì tích vô hướng dương bằng $0{,}8$ nên cường độ khuếch tán đạt $80\%$ mức tối đa.</p>
        focus: [1, 2]
        say: "Đáp án câu một, ta lấy tích vô hướng giữa hai véc tơ và thu được 0 phẩy 8. Do con số này dương nên cường độ khuếch tán đạt 80 phần trăm mức tối đa."
      - show: |
          <p><b>Đáp án câu 2 — Tính thành phần bóng sáng:</b> Lấy lũy thừa bậc $s$ của $0{,}90$:</p>
          $$s = 8 \implies 0{,}90^8 \approx \hlb{0{,}430}; \qquad s = 32 \implies 0{,}90^{32} \approx \hlg{0{,}034}$$
          <p class="note">Với $s = 32$ cường độ nhỏ hơn khoảng $12{,}5$ lần so với $s = 8$ ($0{,}9^{-24} \approx 12{,}5$), giúp đốm bóng <b>thu nhỏ và sắc cạnh hơn</b>.</p>
        focus: [1, 2]
        say: "Đáp án câu hai, với số mũ 8 giá trị bóng sáng là 0 phẩy 430, còn với số mũ 32 giá trị tụt xuống 0 phẩy 034. Số mũ 32 làm điểm chói thu nhỏ và sắc nét hơn nhiều."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic chiếu sáng cục bộ & cầu nối sang bài kết cấu"
    steps:
      - show: |
          <div class="chain"><span class="n">Môi trường $k_a I_a$ (đều khắp)</span><span class="a">+</span>
          <span class="n">Khuếch tán $k_d I_l \max(0, \mathbf{n}\cdot\mathbf{l})$</span><span class="a">+</span>
          <span class="n">Bóng sáng $k_s I_l \max(0, \mathbf{n}\cdot\mathbf{h})^s$</span><span class="a">→</span>
          <span class="n">Chuẩn hoá vector mảnh</span></div>
        focus: [1, 1]
        say: "Tổng kết bài học, mô hình chiếu sáng cục bộ là tổng hợp của ba thành phần: môi trường, khuếch tán và bóng sáng. Điểm cốt lõi là luôn chuẩn hoá lại vector pháp tuyến trên từng mảnh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>kết cấu và lấy mẫu: nội suy song tuyến, mipmap, răng cưa</b>. Ta sẽ học cách thay hằng số màu $k_d$ bằng một bức ảnh thực tế dán lên bề mặt 3D!</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài 7 tới, ta sẽ học về kết cấu bề mặt để thay thế các hệ số màu đơn điệu bằng những bức tranh chi tiết dán lên mô hình 3D. Hẹn gặp bạn ở video tiếp theo."
