scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao tính ánh sáng làm khối cầu căng tròn thay vì hình tròn dẹt?"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
    steps:
      - show: |
          <p>Khi ta vẽ một khối cầu 3D lên màn hình mà chưa tính ánh sáng, mọi <b>mảnh</b> (điểm ảnh ứng viên sinh ra khi phủ một tam giác lên lưới điểm ảnh của màn hình) đều có chung một mã màu: mắt chỉ thấy một <b>hình tròn phẳng dẹt</b> như tờ giấy cắt!</p>
          <div class="box key">Chỉ khi tính toán ánh sáng trên từng mảnh — kết hợp <b>khuếch tán theo cô-sin</b> ($\mathbf{n} \cdot \mathbf{l} = 0{,}8$) và <b>bóng sáng</b> ($0{,}95^{32} \approx 0{,}194$) — khối cầu mới hiện rõ chiều sâu, độ căng tròn và chất liệu bóng loáng.</div>
        focus: [1, 1, 2]
        say: "Khi vẽ một khối cầu không tính ánh sáng, mọi mảnh đều cùng một màu khiến nó phẳng dẹt như bìa giấy. Mảnh là một điểm ảnh ứng viên, sinh ra khi ta phủ một tam giác lên lưới điểm ảnh của màn hình. Bài học hôm nay giúp bạn hiểu công thức kết hợp ánh sáng khuếch tán và điểm bóng sáng để tạo nên chiều sâu sống động."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tích vô hướng hai vector ở bài 1 và toạ độ trọng tâm ở bài 4"
    checks:
      - "0 * 0 + 0 * 0.6 + 1 * 0.8 == 0.8"
      - "0.6 ** 2 + 0.8 ** 2 == 1.0"
      - "round(math.degrees(math.acos(0.8)), 1) == 36.9"
      - "round(math.hypot(0.5, 0.5), 3) == 0.707"
    steps:
      - show: |
          <p><b>① Tích vô hướng:</b> tổng các tích từng cặp thành phần, $\mathbf{a} \cdot \mathbf{b} = a_x b_x + a_y b_y + a_z b_z$. Vector <b>đơn vị</b> là vector có độ dài $\|\mathbf{a}\| = \sqrt{a_x^2 + a_y^2 + a_z^2} = 1$. Với hai vector đơn vị, tích vô hướng đúng bằng cô-sin của góc $\theta$ giữa chúng:</p>
          $$\mathbf{a} \cdot \mathbf{b} = \|\mathbf{a}\| \, \|\mathbf{b}\| \cos\theta = \cos\theta \quad (\text{khi } \|\mathbf{a}\| = \|\mathbf{b}\| = 1)$$
          <p class="note">Ví dụ $(0, 0, 1) \cdot (0;\ 0{,}6;\ 0{,}8) = 0 + 0 + 0{,}8 = 0{,}8$; vì $\sqrt{0{,}6^2 + 0{,}8^2} = 1$ nên $\cos\theta = 0{,}8$, tức $\theta \approx 36{,}9°$. Hai hướng trùng nhau thì $\cos\theta = 1$ (sáng nhất); vuông góc thì $\cos\theta = 0$ (tắt hẳn); quay lưng vào nhau thì $\cos\theta < 0$.</p>
        introduces: [sqrt]
        focus: [1, 2, 3, 3]
        say: "Trước hết, nhắc lại từ đầu tích vô hướng của hai vector, tức tổng các tích của từng cặp thành phần x, y và z. Vector đơn vị là vector có độ dài bằng 1, và với hai vector đơn vị thì tích vô hướng đúng bằng cô-sin của góc giữa chúng. Ví dụ vector 0, 0, 1 nhân vô hướng với vector 0, 0 phẩy 6, 0 phẩy 8 được 0 phẩy 8, nên góc giữa hai hướng có cô-sin 0 phẩy 8, khoảng 36 phẩy 9 độ. Khi hai vector cùng hướng, tích bằng 1; khi chúng vuông góc, tích bằng 0; còn khi quay lưng, tích nhận giá trị âm."
      - show: |
          <p><b>② Nội suy pháp tuyến qua tam giác</b> (bài 4): toạ độ trọng tâm $(\alpha, \beta, \gamma)$ là ba trọng số không âm có tổng bằng $1$, cho biết mảnh nằm gần đỉnh nào; ta dùng chúng để trộn pháp tuyến của ba đỉnh $\mathbf{a}, \mathbf{b}, \mathbf{c}$:</p>
          $$\mathbf{n}_{\text{mảnh}} = \alpha\,\mathbf{n}_a + \beta\,\mathbf{n}_b + \gamma\,\mathbf{n}_c$$
          <p class="note">Cảnh báo quan trọng: tổng có trọng số của các vector đơn vị <b>chưa chắc là vector đơn vị</b> (khi các pháp tuyến lệch hướng nhau nó ngắn hơn $1$), nên bắt buộc phải chuẩn hoá lại ở từng mảnh!</p>
        introduces: [alpha, beta, gamma]
        focus: [1, [2, 3]]
        say: "Thứ hai, ở bài 4 ta dùng toạ độ trọng tâm, tức ba trọng số an-pha, bê-ta, gam-ma không âm có tổng bằng 1, để trộn giá trị của ba đỉnh tại từng mảnh. Ở đây ta trộn pháp tuyến của ba đỉnh, nhưng khi các pháp tuyến lệch hướng nhau thì vector trộn ngắn hơn 1, nên ta bắt buộc phải chuẩn hoá lại."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: pháp tuyến n, hướng sáng l, hướng nhìn v và vector nửa đường h"
    checks:
      - "alg.gfx_lambert((0, 0, 1), (0, 0.6, 0.8)) == 0.8"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$\mathbf{n}$</td><td><b>vector pháp tuyến đơn vị</b>: hướng vuông góc với bề mặt tại điểm đang xét ($\|\mathbf{n}\| = 1$)</td></tr>
          <tr><td>$\mathbf{l}$</td><td><b>vector hướng sáng đơn vị</b>: hướng chỉ từ điểm bề mặt về phía nguồn sáng ($\|\mathbf{l}\| = 1$)</td></tr>
          <tr><td>$\mathbf{v}$</td><td><b>vector hướng nhìn đơn vị</b>: hướng chỉ từ điểm bề mặt về phía mắt camera ($\|\mathbf{v}\| = 1$)</td></tr>
          <tr><td>$\mathbf{h}$</td><td><b>vector nửa đường đơn vị</b>: $\mathbf{h} = \frac{\mathbf{l} + \mathbf{v}}{\|\mathbf{l} + \mathbf{v}\|}$ (nằm chính giữa $\mathbf{l}$ và $\mathbf{v}$)</td></tr>
          <tr><td>$s$</td><td><b>số mũ bóng sáng</b>: xác định độ nhọn của điểm bóng (vật liệu càng bóng, $s$ càng lớn)</td></tr>
          <tr><td>$k_a,\ k_d,\ k_s$; $I_a,\ I_l$</td><td><b>hệ số vật liệu</b> từ $0$ đến $1$: tỉ lệ ánh sáng môi trường, khuếch tán, bóng sáng mà mặt hắt lại; $I_a$, $I_l$ là cường độ ánh sáng môi trường và của nguồn sáng</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6", "1.6"]
        say: "Bảng giải mã các ký hiệu chiếu sáng. Vector n là pháp tuyến vuông góc với mặt phẳng. Vector l hướng về nguồn sáng, còn vector v hướng về mắt nhìn. Vector h là hướng nửa đường nằm chính giữa hướng sáng và hướng nhìn. Tham số s là số mũ quyết định độ thu gọn của điểm bóng sáng. Ba hệ số k a, k d và k s từ 0 đến 1 là tỉ lệ ánh sáng môi trường, khuếch tán và bóng sáng mà vật liệu hắt lại. Còn I a và I l lần lượt là cường độ của ánh sáng môi trường và của nguồn sáng."

