  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức ngân sách khung hình và lưu lượng điểm ảnh"
    checks:
      - "alg.gfx_frame_budget_ms(60) == 1000.0 / 60"
      - "alg.gfx_pixels_per_sec(100, 100, 10) == 100_000"
    steps:
      - show: |
          <p><b>Bước 1 — Ngân sách thời gian một khung $T$:</b> trong một giây ($1000\text{ ms}$) máy phải vẽ xong $F$ khung hình, nên mỗi khung chỉ được dùng tối đa:</p>
          $$T = \frac{1000}{F}\ \text{ms}$$
          <p class="note">Làm thử với $F = 50$ khung mỗi giây: $T = \frac{1000}{50} = 20\text{ ms}$.</p>
        focus: [1, 2, 3]
        say: "Bước một, ta suy ra ngân sách thời gian cho một khung hình. Vì một giây có 1000 mi-li-giây và được chia đều cho F khung hình, nên thời gian tối đa của mỗi khung là T bằng 1000 chia F mi-li-giây. Làm thử với 50 khung mỗi giây, ta lấy 1000 chia 50 được đúng 20 mi-li-giây."
      - show: |
          <p><b>Bước 2 — Số điểm ảnh xuất ra mỗi giây $P$:</b> mỗi khung có $W \cdot H$ điểm ảnh, và mỗi giây có $F$ khung, nên tổng số điểm ảnh mỗi giây là:</p>
          $$P = W \cdot H \cdot F$$
          <p class="note">Làm thử với khung nhỏ 100 × 100 ở $10$ khung mỗi giây: $P = 100 \cdot 100 \cdot 10 = 100\,000$ điểm ảnh mỗi giây.</p>
        focus: [1, 2, 3]
        say: "Bước hai, ta tính lưu lượng điểm ảnh cần xuất trong một giây. Mỗi khung hình là một lưới có W nhân H điểm ảnh, và mỗi giây máy xuất F khung như thế, nên tổng số điểm ảnh mỗi giây bằng W nhân H nhân F. Làm thử với khung nhỏ 100 nhân 100 ở 10 khung mỗi giây, tích ba số này bằng 100 nghìn điểm ảnh mỗi giây."

  # ───────────────────────── 6. VÍ DỤ BẰNG SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Tính cho màn hình 1920 × 1080 ở 60 và 120 khung mỗi giây"
    checks:
      - "1920 * 1080 == 2_073_600"
      - "alg.gfx_pixels_per_sec(1920, 1080, 60) == 124_416_000"
      - "round(alg.gfx_frame_budget_ms(60), 2) == 16.67"
      - "round(alg.gfx_frame_budget_ms(120), 2) == 8.33"
    steps:
      - show: |
          <p>Xét độ phân giải tiêu chuẩn $W = 1920$, $H = 1080$.</p>
          <p><b>Bước 1 — Số điểm ảnh trong một khung:</b></p>
          $$N = 1920 \cdot 1080 = \hlb{2\,073\,600}\ \text{điểm ảnh}$$
        focus: [1, 3]
        say: "Bây giờ ta tính cụ thể cho màn hình rộng 1920 và cao 1080 điểm ảnh. Bước một, vì khung hình là lưới chữ nhật nên ta nhân 1920 với 1080, được 2 triệu 73 nghìn 600 điểm ảnh."
      - show: |
          <p><b>Bước 2 — Lưu lượng điểm ảnh ở $F = 60$ khung mỗi giây:</b></p>
          $$P = 2\,073\,600 \cdot 60 = \hl{124\,416\,000}\ \text{điểm ảnh mỗi giây}$$
        focus: [1, 2]
        say: "Bước hai, ở tốc độ 60 khung mỗi giây, ta lấy 2 triệu 73 nghìn 600 nhân với 60. Kết quả cho thấy mỗi giây đường ống phải xuất ra đúng 124 triệu 416 nghìn điểm ảnh."
      - show: |
          <p><b>Bước 3 — Ngân sách thời gian một khung ở $F = 60$ và $F = 120$:</b></p>
          $$T_a = \frac{1000}{60} \approx \hlg{16{,}67}\ \text{ms}, \qquad T_b = \frac{1000}{120} \approx \hlo{8{,}33}\ \text{ms}$$
        focus: [1, 2, 2]
        say: "Bước ba, ta tính ngân sách thời gian cho hai mức tốc độ khung hình. Ở 60 khung mỗi giây, lấy 1000 chia 60 cho ngân sách xấp xỉ 16 phẩy 67 mi-li-giây mỗi khung. Khi tăng lên 120 khung mỗi giây, ngân sách bị cắt đôi, chỉ còn xấp xỉ 8 phẩy 33 mi-li-giây cho toàn bộ năm tầng."

  # ───────────────────────── 7. TỰ KIỂM BẰNG ĐƯỜNG KHÁC ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm lại qua thời gian trung bình của một điểm ảnh"
    checks:
      - "abs((1000.0 / 60) / (1920 * 1080) * 124_416_000 - 1000.0) < 1e-9"
      - "round(1e9 / 124_416_000, 2) == 8.04"
      - "alg.gfx_frame_budget_ms(60) / alg.gfx_frame_budget_ms(120) == 2.0"
    steps:
      - show: |
          <p><b>Đường khác 1 — Tính thời gian dành cho một điểm ảnh:</b> một giây có $10^9$ na-nô-giây, chia cho $124\,416\,000$ điểm ảnh:</p>
          $$\frac{10^9}{124\,416\,000} \approx 8{,}04\ \text{na-nô-giây mỗi điểm ảnh}$$
          <p>Nhân ngược lại cho một khung $2\,073\,600$ điểm ảnh: $2\,073\,600 \cdot 8{,}04\text{ ns} \approx 16\,670\,000\text{ ns} = 16{,}67\text{ ms}$ ✓.</p>
        focus: [1, 2, 3]
        say: "Ta kiểm tra lại bằng một con đường độc lập, vì tổng thời gian một khung phải bằng thời gian một điểm ảnh nhân với số điểm ảnh. Lấy một tỉ na-nô-giây trong một giây chia cho 124 triệu 416 nghìn điểm ảnh, ta được xấp xỉ 8 phẩy 04 na-nô-giây cho mỗi điểm ảnh. Nhân ngược con số này với 2 triệu 73 nghìn 600 điểm ảnh của một khung, ta thu lại đúng 16 phẩy 67 mi-li-giây."
      - show: |
          <p><b>Đường khác 2 — Kiểm tỉ lệ nghịch:</b></p>
          $$\frac{T_a}{T_b} = \frac{120}{60} = 2 \implies T_b = \frac{16{,}67}{2} \approx 8{,}33\text{ ms}\ \checkmark$$
        introduces: [implies]
        focus: [1, 2]
        say: "Cách kiểm thứ hai là đối chiếu tỉ lệ nghịch, với mũi tên đôi đọc là suy ra. Vì số khung mỗi giây tăng gấp đôi từ 60 lên 120, nên ngân sách mỗi khung phải giảm đúng một nửa từ 16 phẩy 67 xuống 8 phẩy 33 mi-li-giây."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi đọc thông số và chẩn đoán đường ống"
    checks:
      - "round(1000 / 16.67) == 60 and round(1000 / 33.33) == 30"
      - "1920 * 1080 * 3 == 6_220_800"
      - "20 - 10 == 10 and round(20 - 16.67, 2) == 3.33"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Chỉ nhìn số khung trung bình mỗi giây mà bỏ qua khung trễ <b class="red">(17 ms nhảy thành 34 ms trên màn hình)</b>
          <br><span class="note">Khi màn hình quét đều mỗi $16{,}67\text{ ms}$, một khung trễ tới $17\text{ ms}$ đã lỡ nhịp quét và phải chờ tới mốc $33{,}33\text{ ms}$, làm hình đứng yên gấp đôi thời gian. Phép thử: luôn đo thời gian từng khung (ms), không chỉ lấy trung bình.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi đầu tiên và phổ biến nhất ở người đi làm là chỉ nhìn tốc độ khung trung bình mà bỏ qua thời gian của từng khung. Khi màn hình quét đều mỗi 16 phẩy 67 mi-li-giây, một khung trễ sang 17 mi-li-giây sẽ lỡ nhịp quét và làm ảnh cũ giữ nguyên gần 34 mi-li-giây. Vì vậy hãy luôn đo thời gian từng khung bằng mi-li-giây thay vì chỉ nhìn con số trung bình."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tưởng mỗi điểm ảnh chỉ được tô đúng một lần <b class="red">(quên hiện tượng tô đè)</b></div>
          $$N_{\text{mảnh}} = 2\,073\,600 \cdot 3 = 6\,220\,800\ \text{mảnh}$$
        focus: [1, 2, 2]
        say: "Lỗi thứ hai là tưởng màn hình có 2 triệu điểm ảnh thì tầng tô mảnh cũng chỉ chạy 2 triệu lần. Trong cảnh có nhiều vật che nhau, ba tam giác cùng phủ lên một ô sẽ sinh ra ba mảnh ở cùng vị trí đó, khiến số mảnh phải tô vọt lên hơn 6 triệu. Do đó ta phải phân biệt rõ số mảnh đi qua tầng tô với số điểm ảnh của màn hình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tối ưu nhầm tầng không phải nút cổ chai <b class="red">(giảm một nửa số đỉnh nhưng thời gian khung không đổi)</b>
          <br><span class="note">Nếu tầng xử lý đỉnh chỉ mất $2\text{ ms}$ còn tầng tô mảnh mất $15\text{ ms}$, giảm số đỉnh không làm khung hình nhanh hơn vì dây chuyền đang bị chặn ở tầng tô mảnh. Phép thử: đo thời gian riêng của từng tầng trước khi sửa.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ ba là tối ưu nhầm vào tầng không phải nút cổ chai của đường ống. Nếu tầng xử lý đỉnh chỉ tốn 2 mi-li-giây còn tầng tô mảnh tốn tới 15 mi-li-giây, việc cắt giảm số đỉnh trong mô hình sẽ không làm thời gian khung giảm đi. Hãy luôn đo xem tầng nào đang chiếm phần lớn ngân sách trước khi tối ưu."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Trừ trực tiếp số khung mỗi giây để đo chi phí <b class="red">(tốc độ khung hình không cộng tuyến tính)</b></div>
          <table class="t"><tr><th>thay đổi tốc độ</th><th>hiệu số khung/giây</th><th>chi phí thời gian thật</th></tr>
          <tr><td>$100 \to 50$ khung/giây</td><td>giảm $50$</td><td>$20 - 10 = 10{,}00\text{ ms}$</td></tr>
          <tr><td>$60 \to 50$ khung/giây</td><td>giảm $10$</td><td>$20 - 16{,}67 = 3{,}33\text{ ms}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi thứ tư là lấy số khung mỗi giây trừ trực tiếp cho nhau để đo chi phí của một hiệu ứng. Giảm từ 100 xuống 50 khung mỗi giây là tốn thêm 10 mi-li-giây, nặng gấp ba lần so với giảm từ 60 xuống 50 khung mỗi giây vốn chỉ tốn thêm 3 phẩy 33 mi-li-giây. Mọi phép cộng trừ chi phí giữa các tầng đều phải thực hiện trên đơn vị mi-li-giây."

  # ───────────────────────── 9. TỰ LÀM (QUIZ) ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính ngân sách thực tế ảo và tìm nút cổ chai"
    checks:
      - "round(alg.gfx_frame_budget_ms(90), 2) == 11.11"
      - "alg.gfx_pixels_per_sec(2160, 2160, 90) * 2 == 839_808_000"
      - "2 + 12 + 3 == 17 and 17 > 16.67 and 2 + 6 + 3 == 11"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>nội dung câu hỏi</th></tr>
          <tr><td>1</td><td>Một kính thực tế ảo cần xuất <b>90 khung mỗi giây</b> để người đeo không bị chóng mặt. Ngân sách thời gian một khung $T$ là bao nhiêu mi-li-giây?</td></tr>
          <tr><td>2</td><td>Kính đó có hai màn hình cho hai mắt, mỗi mắt <b>2160 × 2160</b> điểm ảnh ở 90 khung mỗi giây. Tổng số điểm ảnh phải xuất mỗi giây cho cả hai mắt là bao nhiêu?</td></tr>
          <tr><td>3</td><td>Một cảnh ở mục tiêu 60 khung mỗi giây ($16{,}67\text{ ms}$) có thời gian ba chặng: xử lý đỉnh $2\text{ ms}$, tô mảnh $12\text{ ms}$, ghép ảnh $3\text{ ms}$ (chạy nối tiếp tốn $17\text{ ms}$). Bạn cần giảm ở tầng nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự kiểm tra. Câu một, một kính thực tế ảo cần xuất 90 khung mỗi giây, hỏi ngân sách thời gian cho mỗi khung là bao nhiêu mi-li-giây? Câu hai, mỗi mắt có độ phân giải 2160 nhân 2160 ở 90 khung mỗi giây, hỏi cả hai mắt cần xuất bao nhiêu điểm ảnh mỗi giây? Câu ba, một khung tốn 2 mi-li-giây xử lý đỉnh, 12 mi-li-giây tô mảnh và 3 mi-li-giây ghép ảnh, bạn phải tối ưu tầng nào để đạt 60 khung mỗi giây? Hãy dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1:</b> chia một giây ($1000\text{ ms}$) cho $90$ khung:</p>
          $$T = \frac{1000}{90} \approx \hlg{11{,}11}\ \text{ms mỗi khung}$$
          <p><b>Đáp án câu 2:</b> một mắt có $2160 \cdot 2160 = 4\,665\,600$ điểm ảnh; hai mắt ở $90$ khung mỗi giây cần:</p>
          $$P = 2 \cdot 4\,665\,600 \cdot 90 = \hlb{839\,808\,000}\ \text{điểm ảnh mỗi giây}$$
        focus: [1, 2, 4]
        say: "Ta cùng đối chiếu đáp án câu một và câu hai. Với 90 khung mỗi giây, lấy 1000 chia 90 ta được ngân sách xấp xỉ 11 phẩy 11 mi-li-giây cho mỗi khung hình. Ở câu hai, mỗi mắt có 4 triệu 665 nghìn 600 điểm ảnh, nên nhân hai mắt và nhân 90 khung mỗi giây ra tới 839 triệu 808 nghìn điểm ảnh mỗi giây."
      - show: |
          <p><b>Đáp án câu 3:</b> tổng thời gian $2 + 12 + 3 = 17\text{ ms} \gt 16{,}67\text{ ms}$ (vượt ngân sách).</p>
          <table class="t"><tr><th>lựa chọn can thiệp</th><th>kết quả</th><th>đánh giá</th></tr>
          <tr><td>Cắt nửa số đỉnh của mô hình</td><td>tầng đỉnh giảm tối đa $1\text{ ms}$, còn $16\text{ ms}$ sát ngưỡng</td><td>không giải quyết gốc rễ vì đỉnh chỉ chiếm $2\text{ ms}$</td></tr>
          <tr><td>Giảm chi phí tầng <b>tô mảnh</b> (đơn giản hoá chiếu sáng, giảm tô đè)</td><td>tô mảnh từ $12\text{ ms}$ xuống $6\text{ ms}$ → tổng còn $11\text{ ms}$</td><td><b>đúng nút cổ chai</b>, dư khoảng an toàn cho khung hình</td></tr></table>
        introduces: [ltgt]
        focus: [1, "2.2", "2.3"]
        say: "Ở câu ba, tổng thời gian ba chặng là 17 mi-li-giây, lớn hơn ngân sách 16 phẩy 67 mi-li-giây. Nếu chỉ cắt bớt số đỉnh thì tối đa cũng chỉ tiết kiệm được khoảng 1 mi-li-giây vì tầng đỉnh vốn rất nhẹ. Quyết định đúng là giảm chi phí ở tầng tô mảnh đang chiếm 12 mi-li-giây để đưa tổng thời gian khung về mức an toàn."

  # ───────────────────────── 10. TỔNG KẾT & BẢN ĐỒ KHOÁ HỌC ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic, tư duy đo đạc và bản đồ toàn khoá học"
    steps:
      - show: |
          <div class="chain"><span class="n">Đỉnh 3D</span><span class="a">→</span>
          <span class="n">Ghép nguyên thuỷ &amp; cắt</span><span class="a">→</span>
          <span class="n">Raster hoá thành mảnh</span><span class="a">→</span>
          <span class="n">Tô mảnh &amp; so độ sâu</span><span class="a">→</span>
          <span class="n">Điểm ảnh trong $T = \frac{1000}{F}\text{ ms}$</span></div>
          <div class="box key"><b>Tư duy cốt lõi:</b> luôn quy đổi mục tiêu tốc độ ra <b>ngân sách mi-li-giây của từng khung</b> và tìm đúng tầng đang làm nghẽn đường ống trước khi tối ưu.</div>
        focus: [1, 2]
        say: "Tổng kết lại, đường ống kết xuất biến các đỉnh ba chiều thành nguyên thuỷ, raster hoá thành các mảnh, rồi tô màu và kiểm tra độ sâu để xuất ra điểm ảnh. Tư duy quan trọng nhất cần mang theo là luôn quy đổi mục tiêu hiển thị ra số mi-li-giây của từng khung hình và đo xem tầng nào đang giữ vai trò nút cổ chai."
      - clear: true
        show: |
          <table class="t"><tr><th>chặng</th><th style="white-space:nowrap">các bài</th><th>câu hỏi giải quyết trong đường ống</th></tr>
          <tr><td>Hình học &amp; chiếu</td><td style="white-space:nowrap">bài 1–3</td><td>đổi toạ độ bằng ma trận thuần nhất; chiếu phối cảnh chia cho w; cắt tam giác và đổi sang toạ độ điểm ảnh</td></tr>
          <tr><td>Raster &amp; độ sâu</td><td style="white-space:nowrap">bài 4–5</td><td>kiểm điểm ảnh trong tam giác bằng hàm cạnh, nội suy trọng tâm; bộ đệm độ sâu và hiện tượng giành điểm ảnh</td></tr>
          <tr><td>Chiếu sáng, kết cấu, màu</td><td style="white-space:nowrap">bài 6–8</td><td>chiếu sáng cục bộ; lấy mẫu kết cấu và bộ ảnh thu nhỏ sẵn; không gian màu tuyến tính và hiệu chỉnh gamma</td></tr>
          <tr><td>Dò tia &amp; vật lý</td><td style="white-space:nowrap">bài 9–10</td><td>giao tia với mặt cầu, bóng đổ; kết xuất dựa trên vật lý và bảo toàn năng lượng</td></tr>
          <tr><td>Hiệu năng &amp; thực chiến</td><td style="white-space:nowrap">bài 11–13</td><td>tô đè, mức chi tiết; chẩn đoán lỗi độ sâu cảnh lớn; hành trình chiếu sáng từ năm 1975 tới thời gian thực</td></tr></table>
          <p class="note">Bài sau (bài 1): <b>Biến đổi mô hình và góc nhìn bằng toạ độ thuần nhất</b> — ghép phép quay và phép tịnh tiến vào một ma trận duy nhất.</p>
        forward_ref: true
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2]
        say: "Bảng trên là bản đồ của toàn bộ khoá học đi dọc theo chính đường ống vừa học. Bài 1 đến bài 3 giải quyết phần hình học, gồm biến đổi toạ độ thuần nhất, chiếu phối cảnh chia cho w, cùng bước cắt và đổi sang khung nhìn điểm ảnh. Bài 4 đến bài 5 đi vào tầng raster hoá bằng hàm cạnh, toạ độ trọng tâm và bộ đệm độ sâu. Bài 6 đến bài 8 giải quyết phần tô mảnh gồm chiếu sáng cục bộ, lấy mẫu kết cấu và hiệu chỉnh gamma trong không gian màu tuyến tính. Bài 9 đến bài 10 mở rộng sang dò tia và kết xuất dựa trên vật lý bảo toàn năng lượng. Cuối cùng, bài 11 đến bài 13 bàn về hiệu năng tô đè, chẩn đoán bộ đệm độ sâu trong cảnh lớn và hành trình chiếu sáng từ năm 1975 tới nay. Ở bài sau, bài 1, ta bắt đầu với biến đổi mô hình và góc nhìn bằng toạ độ thuần nhất."
