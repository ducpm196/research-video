scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Trung bình vẫn 60 khung mỗi giây, sao người chơi vẫn thấy giật?"
    checks:
      - "alg.gfx_pixels_per_sec(1920, 1080, 60) == 124_416_000"
      - "round(alg.gfx_frame_budget_ms(60), 2) == 16.67"
      - "59 * 16 + 56 == 1000"
    steps:
      - show: |
          <p>Một trò chơi chạy ở màn hình <b>1920 × 1080</b> với tốc độ <b>60 khung mỗi giây</b>, tức mỗi giây máy phải tính và tô <b>124&nbsp;416&nbsp;000 điểm ảnh</b>.</p>
          <p>Đồng hồ báo trung bình đúng 60 khung mỗi giây, nhưng cứ mỗi giây hình lại khựng một nhịp: 59 khung đầu mất <b>16 ms</b>, riêng khung thứ 60 vọt lên <b>56 ms</b>.</p>
          <div class="box key">Hôm nay: một cảnh ba chiều đi qua những tầng nào để thành điểm ảnh? Mỗi khung hình có bao nhiêu mi-li-giây? Và vì sao phải đo thời gian từng khung?</div>
        focus: [1, 2, 3]
        say: "Chào bạn, một trò chơi chạy trên màn hình 1920 nhân 1080 ở tốc độ 60 khung mỗi giây, nên mỗi giây máy phải xuất hơn 124 triệu điểm ảnh. Đồng hồ vẫn báo trung bình 60 khung mỗi giây, nhưng người xem lại thấy hình khựng rõ rệt vì một khung bị trễ tới 56 mi-li-giây. Hôm nay ta tìm hiểu các tầng của đường ống kết xuất, cách tính ngân sách một khung hình, và lý do phải đo thời gian từng khung."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều nền tảng trước khi vào đường ống"
    checks:
      - "1920 * 1080 == 2_073_600"
      - "1000 / 50 == 20.0"
      - "max(2, 5, 3) == 5 and 1000 / 5 == 200.0"
    steps:
      - show: |
          <p><b>① Lưới điểm ảnh trên màn hình:</b> màn hình có $W$ cột và $H$ hàng thì chứa $W \cdot H$ điểm ảnh, với dấu chấm giữa là phép nhân.</p>
          $$1920 \cdot 1080 = 2\,073\,600 \text{ điểm ảnh trên một khung}$$
        introduces: [cdot]
        focus: [1, 2]
        say: "Điều thứ nhất là lưới điểm ảnh trên màn hình, với dấu chấm ở giữa dòng ký hiệu cho phép nhân hai số. Một màn hình có W cột và H hàng sẽ chứa W nhân H điểm ảnh, nên khung 1920 nhân 1080 có đúng 2 triệu 73 nghìn 600 điểm ảnh."
      - show: |
          <p><b>② Đổi giữa giây và mi-li-giây:</b> một giây bằng $1000$ mi-li-giây (viết tắt là ms). Nếu một giây chia đều cho $F$ khung hình thì mỗi khung có:</p>
          $$T = \frac{1000}{F} \text{ ms}$$
        focus: [1, 2]
        say: "Điều thứ hai là đổi đơn vị thời gian, trong đó một giây bằng đúng 1000 mi-li-giây. Nếu một giây chia đều cho F khung hình thì thời gian dành cho mỗi khung là 1000 chia F mi-li-giây, ví dụ 50 khung mỗi giây ứng với 20 mi-li-giây."
      - show: |
          <p><b>③ Dây chuyền nhiều tầng</b> (khoá Hệ thống máy tính): khi nhiều công đoạn nối tiếp nhau, tốc độ chung bị quyết định bởi <b>tầng chậm nhất</b>.</p>
          $$T_{\text{dây chuyền}} = \max(2,\ 5,\ 3) = 5\text{ ms}$$
        introduces: [sub, max_fn]
        focus: [1, 2]
        say: "Điều thứ ba là nguyên lý dây chuyền ở khoá Hệ thống máy tính, khi các công đoạn nối tiếp nhau thì thông lượng chung bị chặn bởi tầng chậm nhất. Với chỉ số dưới ghi tên đại lượng và ký hiệu lấy số lớn nhất, ba tầng mất 2, 5 và 3 mi-li-giây thì cứ 5 mi-li-giây dây chuyền mới xuất xong một khung."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã ký hiệu: W, H, F, T và tốc độ điểm ảnh P"
    checks:
