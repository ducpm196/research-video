      - "alg.gfx_pixels_per_sec(1920, 1080, 60) == 1920 * 1080 * 60"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>ý nghĩa</th><th>đơn vị</th></tr>
          <tr><td>$W,\ H$</td><td>chiều rộng (số cột) và chiều cao (số hàng) của khung hình</td><td>điểm ảnh</td></tr>
          <tr><td>$F$</td><td>tốc độ khung hình: số khung xuất ra trong một giây</td><td>khung / giây</td></tr>
          <tr><td>$T$</td><td>ngân sách thời gian tối đa cho một khung hình</td><td>mi-li-giây (ms)</td></tr>
          <tr><td>$P$</td><td>tổng số điểm ảnh cần xuất trong một giây</td><td>điểm ảnh / giây</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng trên giải mã năm ký hiệu sẽ dùng xuyên suốt bài học hôm nay. W và H là chiều rộng và chiều cao của khung hình tính theo điểm ảnh. F là số khung hình xuất ra trong một giây. T là ngân sách thời gian tối đa cho một khung tính bằng mi-li-giây. Còn P là tổng số điểm ảnh mà máy phải xuất ra trong mỗi giây."
      - clear: true
        show: |
          <p><b>Ba khái niệm hình học trong đường ống:</b></p>
          <table class="t"><tr><th>đơn vị</th><th>bản chất trong đường ống</th></tr>
          <tr><td><b>Đỉnh</b></td><td>một điểm trong không gian ba chiều kèm toạ độ, màu hoặc hướng pháp tuyến</td></tr>
          <tr><td><b>Nguyên thuỷ</b></td><td>hình cơ bản ghép từ các đỉnh, phổ biến nhất là tam giác</td></tr>
          <tr><td><b>Mảnh</b></td><td>một ứng viên điểm ảnh sinh ra khi tam giác phủ lên một ô của lưới màn hình</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bên cạnh các con số, ta cần phân biệt ba đơn vị dữ liệu đi qua đường ống. Đỉnh là một điểm trong không gian ba chiều mang theo toạ độ và thuộc tính. Nguyên thuỷ là hình cơ bản ghép từ các đỉnh, phổ biến nhất là hình tam giác. Còn mảnh là ứng viên điểm ảnh sinh ra khi tam giác phủ lên một ô màn hình, trước khi kiểm tra che khuất."

