scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai mặt cách nhau 4 mm ở xa 100 m lại nhấp nháy giành nhau từng điểm ảnh"
    checks:
      - "abs(alg.gfx_depth_step(100.0, 0.1, 1000.0, 24) * 1000.0 - 5.96) < 0.05"
      - "abs(alg.gfx_depth_step(100.0, 1.0, 1000.0, 24) * 1000.0 - 0.595) < 0.05"
      - "2 ** 24 == 16777216"
    steps:
      - show: |
          <p>Sau khi nội suy độ sâu cho từng điểm ảnh ở bài 4, giả sử ta gắn một tấm biển quảng cáo cách bức tường đúng <b>4 mm</b> và đứng nhìn từ khoảng cách <b>100 m</b>. Dù bộ đệm độ sâu <b>24 bit</b> có tới $2^{24} = 16\,777\,216$ mức chia, tấm biển vẫn nhấp nháy vỡ sọc liên tục với bức tường phía sau!</p>
          <table class="t"><tr><th>cấu hình mặt phẳng gần $n$ (với $f = 1000\text{ m},\ 24\text{ bit}$)</th><th>số mức $2^{24}$</th><th>bước độ sâu nhỏ nhất tại $z = 100\text{ m}$</th><th>biển cách tường $4\text{ mm}$</th></tr>
          <tr><td><b>$n = 0{,}1\text{ m}$ (đặt quá sát camera)</b></td><td>16&nbsp;777&nbsp;216</td><td><b class="red">$\approx 6\text{ mm}$ ($5{,}96\text{ mm}$)</b></td><td><b class="red">giành điểm ảnh!</b></td></tr>
          <tr><td><b>$n = 1\text{ m}$ (đẩy ra xa gấp $10$ lần)</b></td><td>16&nbsp;777&nbsp;216</td><td><b class="green">$\approx 0{,}6\text{ mm}$ ($0{,}60\text{ mm}$)</b></td><td><b class="green">tách bạch rõ (tốt gấp 10)</b></td></tr></table>
          <div class="box key">Hôm nay: vì sao bước độ sâu nhỏ nhất (sai số) của bộ đệm tỉ lệ với $z^2 / n$, và làm sao tính ngay khoảng cách nhỏ nhất phân biệt được?</div>
        focus: [1, "2.2", "2.2", "2.3", 3]
        say: "Chào bạn, sau khi nội suy độ sâu ở bài 4, giả sử ta treo một tấm biển cách bức tường 4 mi-li-mét và nhìn từ xa 100 mét. Bộ đệm 24 bit có hơn 16 triệu mức chia, nhưng mặt phẳng gần đang đặt ở 0 phẩy 1 mét và mặt phẳng xa ở 1000 mét. Khi đó ở xa 100 mét, hai mặt cách nhau dưới 6 mi-li-mét vẫn bị giành điểm ảnh. Ngược lại, chỉ cần đẩy mặt phẳng gần lên 1 mét thì bước phân biệt giảm xuống 0 phẩy 6 mi-li-mét, tốt gấp 10 lần. Hôm nay ta tìm hiểu nguyên nhân toán học của hiện tượng này."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại lượng tử hoá b bit và phép chia phối cảnh cho z"
    checks:
      - "2 ** 24 == 16777216"
      - "1.0 / 0.1 == 10.0 and 1.0 / 100.0 == 0.01"
    steps:
      - show: |
          <p><b>① Lượng tử hoá đoạn $[0, 1]$ bằng số nguyên $b\text{ bit}$:</b> bộ đệm độ sâu $b = 24\text{ bit}$ chia đều đoạn $[0, 1]$ thành $2^{24}$ bậc rời rạc:</p>
          $$2^{24} = 16\,777\,216 \text{ mức}, \qquad \text{độ cao mỗi bậc chuẩn hoá} = \frac{1}{2^{24}}$$
          <p class="note">Hai bề mặt có độ sâu chuẩn hoá chênh nhau ít hơn $1 / 2^b$ sẽ bị làm tròn vào <b>cùng một số nguyên</b>; máy không còn biết mặt nào gần hơn nên hai mặt thay nhau thắng ở từng điểm ảnh và nhấp nháy — gọi là <b>giành điểm ảnh</b>.</p>
        focus: [1, 2, 3, 3]
        say: "Điều thứ nhất là lượng tử hoá, tức làm tròn một số thực trong đoạn từ 0 đến 1 về một trong hữu hạn mức nguyên lưu bằng b bit. Với bộ đệm 24 bit, đoạn từ 0 đến 1 được chia đều thành 2 mũ 24, tức 16 triệu 777 nghìn 216 bậc bằng nhau. Nếu hai bề mặt sau khi quy đổi về đoạn 0, 1 có chênh lệch nhỏ hơn một phần hai mũ 24, cả hai sẽ bị làm tròn về cùng một số nguyên. Khi đó máy không biết mặt nào gần hơn, nên hai mặt thay nhau thắng ở từng điểm ảnh và nhấp nháy, gọi là giành điểm ảnh."
      - show: |
          <p><b>② Phép chia phối cảnh biến độ sâu thành nghịch đảo $1/z$:</b> ở bài 2 và bài 3, mọi toạ độ sau khi chiếu đều chia cho $w = z$. Vì vậy độ sâu chuẩn hoá $d(z)$ lưu trên màn hình có dạng tuyến tính theo $1/z$:</p>
          $$d(z) = A - \frac{B}{z}$$
        focus: [1, 2]
        say: "Điều thứ hai từ bài 2 và bài 3 là phép chia phối cảnh chia mọi toạ độ cho độ sâu z. Nhờ có dạng hằng số A trừ hằng số B chia z, giá trị độ sâu chuẩn hoá d biến thiên tuyến tính theo toạ độ điểm ảnh trên màn hình để phần cứng nội suy cực nhanh."

