      - "abs(alg.gfx_depth_step(100.0, 1.0, 1000.0, 24) * 1000.0 - 0.595) < 0.01"
      - "abs(alg.gfx_depth_step(100.0, 0.1, 200.0, 24) * 1000.0 - 5.957) < 0.01"
      - "round((alg.gfx_depth_step(100.0, 0.1, 1000.0, 24) - alg.gfx_depth_step(100.0, 0.1, 200.0, 24)) * 1000.0, 4) == 0.0024 and round(alg.gfx_depth_step(100.0, 0.1, 1000.0, 24) * 1000.0, 4) == 5.9599 and round(alg.gfx_depth_step(100.0, 0.1, 200.0, 24) * 1000.0, 4) == 5.9575"
    steps:
      - show: |
          <p>Xét bộ đệm $b = 24\text{ bit} \implies 2^{24} = 16\,777\,216$ mức, mặt phẳng xa $f = 1000\text{ m}$, vật ở $z = 100\text{ m} \implies z^2 = 10\,000\text{ m}^2$.</p>
          <p><b>Bước 1 — Thay mặt phẳng gần $n = 0{,}1\text{ m}$ vào công thức nên ta có:</b></p>
          $$s_z = \frac{100^2 \cdot (1000 - 0{,}1)}{1000 \cdot 0{,}1 \cdot 2^{24}} = \frac{10\,000 \cdot 999{,}9}{100 \cdot 16\,777\,216} \approx 0{,}00596\text{ m} \approx \hl{6\text{ mm}}$$
          <p class="note">Hai mặt ở $z = 100\text{ m}$ cách nhau dưới $\approx 6\text{ mm}$ sẽ rơi vào cùng một mức số nguyên và gây ra hiện tượng giành điểm ảnh.</p>
        focus: [1, 3, 3, 4]
        say: "Ta thay số cho bộ đệm 24 bit có 16 triệu 777 nghìn 216 mức, mặt phẳng xa 1000 mét và vật ở khoảng cách 100 mét. Bước một, xét mặt phẳng gần n bằng 0 phẩy 1 mét. Ta lấy 10 nghìn nhân 999 phẩy 9 chia cho tích của 100 với 2 mũ 24, được 0 phẩy 00596 mét, tức xấp xỉ 6 mi-li-mét. Do đó ở khoảng cách 100 mét, hai mặt cách nhau dưới 6 mi-li-mét sẽ bị giành điểm ảnh."
      - show: |
          <p><b>Bước 2 — Đẩy mặt phẳng gần lên $n = 1\text{ m}$ (giữ nguyên $f = 1000\text{ m}$) nên mẫu số tăng 10 lần:</b></p>
          $$s_z = \frac{100^2 \cdot (1000 - 1)}{1000 \cdot 1 \cdot 2^{24}} = \frac{10\,000 \cdot 999}{1000 \cdot 16\,777\,216} \approx 0{,}000595\text{ m} \approx \hlg{0{,}6\text{ mm}}$$
          <p class="note">Độ chính xác đạt $\approx 0{,}6\text{ mm}$, <b>tốt gấp 10 lần</b> so với khi để $n = 0{,}1\text{ m}$!</p>
        focus: [1, 2, 3]
        say: "Bước hai, ta đẩy mặt phẳng gần từ 0 phẩy 1 mét lên 1 mét và giữ nguyên mặt phẳng xa ở 1000 mét. Thay n bằng 1 vào công thức, mẫu số tăng gấp 10 lần nên bước độ sâu nhỏ nhất giảm xuống còn 0 phẩy 000595 mét, tức xấp xỉ 0 phẩy 6 mi-li-mét. Độ phân giải tốt gấp 10 lần giúp hai mặt cách nhau vài mi-li-mét hiển thị tách bạch hoàn toàn."
      - clear: true
        show: |
          <p><b>Bước 3 — Đối chiếu nếu giữ $n = 0{,}1\text{ m}$ mà kéo mặt phẳng xa từ $f = 1000\text{ m}$ về $f = 200\text{ m}$:</b></p>
          $$s_z = \frac{100^2 \cdot (200 - 0{,}1)}{200 \cdot 0{,}1 \cdot 2^{24}} = \frac{10\,000 \cdot 199{,}9}{20 \cdot 16\,777\,216} \approx 0{,}005957\text{ m} \approx \hl{5{,}96\text{ mm}}$$
          <p class="note">Kéo mặt phẳng xa giảm đi $5$ lần chỉ cải thiện khoảng $0{,}0024\text{ mm}$ (từ $5{,}9599$ xuống $5{,}9575\text{ mm}$) — hầu như không có tác dụng vì $(f - n)/f \approx 1$!</p>
        focus: [1, 2, 3]
        say: "Bước ba, giả sử ta giữ nguyên mặt phẳng gần 0 phẩy 1 mét nhưng kéo mặt phẳng xa từ 1000 mét giảm 5 lần về 200 mét. Thay vào công thức, bước độ sâu vẫn bằng 5 phẩy 957 mi-li-mét, tức hầu như vẫn bằng 6 mi-li-mét như cũ. Con số này chứng minh vì sao kéo mặt phẳng xa vào gần không giải quyết được lỗi giành điểm ảnh."

  # ───────────────────────── 7. TỰ KIỂM BẰNG ĐƯỜNG KHÁC ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm lại trực tiếp bằng hiệu hàm độ sâu chuẩn hoá d(z)"
    checks:
      - "abs((alg.gfx_depth_norm(100.00596, 0.1, 1000.0) - alg.gfx_depth_norm(100.0, 0.1, 1000.0)) * (2 ** 24) - 1.0) < 0.01"
      - "abs((alg.gfx_depth_norm(100.000595, 1.0, 1000.0) - alg.gfx_depth_norm(100.0, 1.0, 1000.0)) * (2 ** 24) - 1.0) < 0.01"
    steps:
      - show: |
          <p><b>Đường khác — Thay trực tiếp hai vị trí cách nhau $s_z$ vào hàm $d(z)$ nên kiểm được số bậc chênh lệch:</b></p>
          <p>• Vì khi $n = 0{,}1\text{ m}$, lấy $z_1 = 100\text{ m}$ và $z_2 = 100{,}00596\text{ m}$ (cách nhau $5{,}96\text{ mm}$) nên:</p>
          $$\left(d(100{,}00596) - d(100)\right) \cdot 2^{24} \approx 1{,}00 \text{ bậc lượng tử}\ \checkmark$$
          <p>• Vì khi $n = 1\text{ m}$, lấy $z_1 = 100\text{ m}$ và $z_2 = 100{,}000595\text{ m}$ (cách nhau $0{,}595\text{ mm}$) nên:</p>
          $$\left(d(100{,}000595) - d(100)\right) \cdot 2^{24} \approx 1{,}00 \text{ bậc lượng tử}\ \checkmark$$
        focus: [1, 3, 5]
        say: "Ta kiểm tra lại mà không dùng công thức đạo hàm bằng cách thay trực tiếp toạ độ vào hàm độ sâu chuẩn hoá rồi nhân với 2 mũ 24. Do đó, với n bằng 0 phẩy 1 mét, hai điểm ở 100 mét và 100 phẩy 00596 mét cho hiệu nhân 2 mũ 24 bằng đúng 1 bậc lượng tử. Tương tự, với n bằng 1 mét, hai điểm cách nhau 0 phẩy 595 mi-li-mét cũng cho đúng 1 bậc lượng tử, khớp hoàn toàn với công thức bước độ sâu."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi làm việc với bộ đệm độ sâu"
    checks:
      - "alg.gfx_depth_step(100.0, 0.001, 1000.0, 24) * 1000.0 > 590.0"
      - "alg.gfx_depth_step(10.0, 0.1, 1000.0, 16) * 1000.0 > 15.0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Đặt mặt phẳng gần $n$ cực nhỏ ($n = 0{,}001\text{ m}$) vì sợ cắt mất vật gần <b class="red">(bước độ sâu tỉ lệ với $z^2 / n$ nên toàn bộ bit dồn sát camera)</b></div>
          <p class="note">Nếu đặt $n = 0{,}001\text{ m}$ với bộ đệm $24\text{ bit}$, ở $z = 100\text{ m}$ bước độ sâu vọt lên $s_z \approx 596\text{ mm}$ ($\approx 0{,}6\text{ m}$!) làm hai bức tường cách nhau cả nửa mét vẫn nhấp nháy đè nhau.</p>
        focus: [1, 2, 2]
        say: "Lỗi đầu tiên của người đi làm là đặt mặt phẳng gần bằng một phần nghìn mét vì sợ cắt mất vật ở sát ống kính. Do bước độ sâu tỉ lệ với z bình phương chia n, việc đặt n nhỏ như vậy làm bước độ sâu ở 100 mét vọt lên tới gần 60 xăng-ti-mét. Khi đó hai bức tường cách nhau cả nửa mét vẫn bị nhấp nháy giành điểm ảnh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đặt hai đa giác đồng phẳng trùng khít toạ độ <b class="red">(vạch kẻ đường, vết đạn dán thẳng lên mặt tường luôn bị giành điểm ảnh)</b>
          <br><span class="note">Khi hai mặt có $z$ bằng nhau tuyệt đối, sai số làm tròn dấu phẩy động khi nội suy làm chúng thắng thua ngẫu nhiên theo góc camera; cần cộng độ dịch độ sâu hoặc tách lưới.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là đặt các tấm đề-can hoặc vạch sơn đường nằm trùng khít trên cùng một mặt phẳng với mặt đường. Khi hai tam giác có cùng độ sâu thực, sai số làm tròn khi nội suy sẽ làm chúng trồi sụt ngẫu nhiên, nên ta phải dùng lệnh dịch độ sâu hoặc tách riêng hình học."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng bộ đệm độ sâu $16\text{ bit}$ (65&nbsp;536 mức) cho cảnh rộng ngoài trời <b class="red">(kém $24\text{ bit}$ tới $256$ lần)</b></div>
          $$b = 16,\ n = 0{,}1\text{ m},\ z = 10\text{ m} \implies s_z \approx \frac{100}{0{,}1 \cdot 65\,536} \approx 0{,}0153\text{ m} = 15{,}3\text{ mm}$$
        focus: [1, 2]
        say: "Lỗi thứ ba là chọn bộ đệm độ sâu 16 bit chỉ có 65 nghìn 536 mức cho các cảnh ngoài trời. Kém bộ đệm 24 bit đúng 256 lần, ngay ở khoảng cách 10 mét với mặt phẳng gần 0 phẩy 1 mét, bước độ sâu của bộ đệm 16 bit đã thô tới hơn 15 mi-li-mét."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Bật ghi bộ đệm độ sâu khi vẽ các mặt kính bán trong suốt theo thứ tự tuỳ ý <b class="red">(kính vẽ trước chặn mất vật vẽ sau)</b>
          <br><span class="note">Bộ đệm độ sâu chỉ lưu một giá trị gần nhất; với vật bán trong suốt, phải vẽ hết vật đục trước, tắt ghi độ sâu (vẫn giữ phép so độ sâu) rồi vẽ các lớp trong suốt từ xa về gần.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư là giữ nguyên chế độ ghi đè bộ đệm độ sâu khi vẽ các vật bán trong suốt như cửa kính hay khói. Nếu tấm kính ở gần được vẽ trước và ghi độ sâu của nó vào bộ đệm, các vật nằm phía sau kính vẽ sau sẽ bị loại bỏ hoàn toàn thay vì nhìn xuyên qua được."

  # ───────────────────────── 9. TỰ LÀM (QUIZ) ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính độ sâu chuẩn hoá và kiểm tra giành điểm ảnh"
    checks:
      - "abs(alg.gfx_depth_norm(0.5, 0.1, 1000.0) - 0.80008) < 1e-4"
      - "abs(alg.gfx_depth_step(50.0, 0.1, 1000.0, 24) * 1000.0 - 1.49) < 0.01"
      - "abs(alg.gfx_depth_step(200.0, 0.5, 1000.0, 24) * 1000.0 - 4.766) < 0.01"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>nội dung câu hỏi</th></tr>
          <tr><td>1</td><td>Với $n = 0{,}1\text{ m}$ và $f = 1000\text{ m}$, tại khoảng cách $z = 0{,}5\text{ m}$, độ sâu chuẩn hoá $d(0{,}5)$ bằng bao nhiêu (tức bao nhiêu phần trăm số mức đã dùng trong $0{,}5\text{ m}$ đầu)?</td></tr>
          <tr><td>2</td><td>Với bộ đệm $24\text{ bit},\ n = 0{,}1\text{ m},\ f = 1000\text{ m}$, khi lại gần còn $z = 50\text{ m}$ (giảm một nửa so với $100\text{ m}$), bước độ sâu nhỏ nhất $s_z$ bằng bao nhiêu mi-li-mét?</td></tr>
          <tr><td>3</td><td>Ở khoảng cách $z = 200\text{ m}$ với bộ đệm $24\text{ bit},\ f = 1000\text{ m}$ và mặt phẳng gần $n = 0{,}5\text{ m}$, hai tấm biển cách nhau $10\text{ mm}$ có bị giành điểm ảnh không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự giải ba câu hỏi. Câu một, với mặt phẳng gần 0 phẩy 1 mét và mặt phẳng xa 1000 mét, tại khoảng cách z bằng 0 phẩy 5 mét thì độ sâu chuẩn hoá bằng bao nhiêu? Câu hai, vẫn với bộ đệm 24 bit đó nhưng tại khoảng cách 50 mét, bước độ sâu nhỏ nhất bằng bao nhiêu mi-li-mét? Câu ba, ở khoảng cách 200 mét với mặt phẳng gần bằng 0 phẩy 5 mét, hai tấm biển cách nhau 10 mi-li-mét có bị giành điểm ảnh không? Hãy dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 (tại $z = 0{,}5\text{ m}$):</b></p>
          $$d(0{,}5) = \frac{1000 \cdot (0{,}5 - 0{,}1)}{0{,}5 \cdot (1000 - 0{,}1)} = \frac{400}{499{,}95} \approx \hlg{0{,}8001} \quad (\text{đã dùng } 80{,}01\% \text{ bộ đệm trong } 0{,}5\text{ m đầu!})$$
          <p><b>Đáp án câu 2 (tại $z = 50\text{ m}$, khoảng cách giảm $2$ lần nên $z^2$ giảm $4$ lần):</b></p>
          $$s_z = \frac{50^2 \cdot 999{,}9}{1000 \cdot 0{,}1 \cdot 2^{24}} = \frac{2500 \cdot 999{,}9}{100 \cdot 16\,777\,216} \approx \hlb{1{,}49\text{ mm}} \quad (\text{mịn hơn } 4 \text{ lần so với } 5{,}96\text{ mm})$$
        focus: [1, 2, 2, 4]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Ở câu một, thay z bằng 0 phẩy 5 mét vào công thức, ta được 400 chia 499 phẩy 95 xấp xỉ 0 phẩy 8001. Như vậy hơn 80 phần trăm toàn bộ mức độ sâu đã bị dùng hết ngay trong nửa mét đầu tiên. Ở câu hai, khi khoảng cách giảm một nửa xuống 50 mét thì z bình phương giảm 4 lần, nên bước độ sâu nhỏ nhất giảm 4 lần còn 1 phẩy 49 mi-li-mét."
      - show: |
          <p><b>Đáp án câu 3 (tại $z = 200\text{ m}$ với $n = 0{,}5\text{ m}$):</b></p>
          $$s_z = \frac{200^2 \cdot (1000 - 0{,}5)}{1000 \cdot 0{,}5 \cdot 2^{24}} = \frac{40\,000 \cdot 999{,}5}{500 \cdot 16\,777\,216} \approx \hlo{4{,}77\text{ mm}}$$
          <p class="note">Vì khoảng cách giữa hai tấm biển là $10\text{ mm} \gt 4{,}77\text{ mm}$ (cách nhau hơn $2$ bậc lượng tử), chúng <b>không</b> bị giành điểm ảnh.</p>
        focus: [2, 3]
        say: "Ở câu ba, thay z bằng 200 mét và n bằng 0 phẩy 5 mét vào công thức, ta tính được bước độ sâu nhỏ nhất bằng 4 phẩy 77 mi-li-mét. Vì hai tấm biển cách nhau 10 mi-li-mét, lớn hơn gấp đôi một bậc lượng tử 4 phẩy 77 mi-li-mét, nên chúng không bị giành điểm ảnh."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cấu hình bộ đệm độ sâu"
    steps:
      - show: |
          <div class="chain"><span class="n">Chia phối cảnh $1/z$</span><span class="a">→</span>
          <span class="n">$d(z) = \frac{f(z - n)}{z(f - n)}$</span><span class="a">→</span>
          <span class="n">Bit dồn sát $n$</span><span class="a">→</span>
          <span class="n">Bước $s_z \approx \frac{z^2}{n \cdot 2^b}$</span><span class="a">→</span>
          <span class="n">Đẩy $n$ ra xa để chống giành điểm ảnh</span></div>
          <div class="box key"><b>Tư duy cốt lõi:</b> bước độ sâu nhỏ nhất (sai số) của bộ đệm tỉ lệ với $z^2 / n$. Đẩy mặt phẳng gần $n$ từ $0{,}1\text{ m}$ lên $1\text{ m}$ làm bước phân biệt ở $100\text{ m}$ giảm từ $\approx 6\text{ mm}$ xuống $\approx 0{,}6\text{ mm}$ (tốt gấp $10$ lần), trong khi kéo mặt phẳng xa $f$ vào gần hầu như không có tác dụng.</div>
        focus: [1, 2, 2]
        say: "Tổng kết lại, vì độ sâu chuẩn hoá biến thiên theo nghịch đảo một phần z, phần lớn số bit của bộ đệm bị dồn vào vùng sát ống kính. Điều đó làm bước phân giải ở xa phình to theo z bình phương chia n. Khi gặp hiện tượng giành điểm ảnh ở xa, giải pháp hiệu quả nhất là đẩy mặt phẳng cắt gần n ra xa tối đa có thể."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>Chiếu sáng cục bộ: khuếch tán Lambert và phản xạ Blinn–Phong</b> — sau khi biết điểm ảnh nào hiện ra trước camera, làm sao tính độ sáng khuếch tán và điểm bóng sáng trên bề mặt đó?</p>
        forward_ref: true
        focus: [1, 1]
        say: "Ở bài sau, bài 6, chúng ta đã biết chính xác bề mặt nào hiện ra tại từng điểm ảnh. Tiếp theo ta sẽ tính màu ánh sáng phản xạ từ bề mặt đó bằng mô hình khuếch tán theo cô-sin góc tới và phản xạ bóng sáng của Bùi Tường Phong."
