  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức độ sâu chuẩn hoá d(z) và bước độ sâu nhỏ nhất"
    checks:
      - "alg.gfx_depth_norm(0.1, 0.1, 1000.0) == 0.0"
      - "alg.gfx_depth_norm(1000.0, 0.1, 1000.0) == 1.0"
      - "abs(alg.gfx_depth_step(100.0, 0.1, 1000.0, 24) - (100.0 ** 2 * 999.9) / (1000.0 * 0.1 * (2 ** 24))) < 1e-12"
    steps:
      - show: |
          <p><b>Bước 1 — Thay hai điều kiện biên $d(n) = 0$ và $d(f) = 1$ vào $d(z) = A - B/z$ nên tìm được:</b></p>
          $$d(z) = \frac{f \cdot (z - n)}{z \cdot (f - n)} = \frac{f}{f - n} - \frac{f \cdot n}{f - n} \cdot \frac{1}{z}$$
          <p class="note">Kiểm tra: vì tại $z = n$ tử số bằng $0$ nên $d(n) = 0$; tại $z = f$ tử số bằng mẫu số nên $d(f) = 1$.</p>
        focus: [1, 2, 3]
        say: "Bước một, thay hai điều kiện biên d tại n bằng 0 và d tại f bằng 1 vào biểu thức, ta giải được hai hằng số A và B của hàm độ sâu chuẩn hoá. Kết quả suy ra là d của z bằng f nhân mở ngoặc z trừ n đóng ngoặc, chia cho z nhân mở ngoặc f trừ n đóng ngoặc. Tách biểu thức này ra, ta thấy z chỉ nằm ở mẫu số dưới dạng một phần z."
      - show: |
          <p><b>Bước 2 — Tính bước độ sâu thực $s_z$ ứng với $1$ bậc lượng tử $1 / 2^b$:</b></p>
          <p>Vì đạo hàm của $d(z)$ theo $z$ bằng $\frac{f \cdot n}{z^2 \cdot (f - n)}$, thay độ chênh chuẩn hoá bằng $\frac{1}{2^b}$ nên ta rút ra bước độ sâu nhỏ nhất phân biệt được:</p>
          $$s_z = \frac{z^2 \cdot (f - n)}{f \cdot n \cdot 2^b} \approx \frac{z^2}{n \cdot 2^b} \quad (\text{khi } f \text{ lớn hơn } n \text{ rất nhiều})$$
          <div class="box key"><b>Quy luật cốt lõi:</b> độ phân giải độ sâu tỉ lệ với $z^2 / n$ — đi xa gấp $10$ lần làm bước $s_z$ thô ra gấp $100$ lần, còn đẩy $n$ tăng gấp $10$ lần giúp $s_z$ mịn hơn gấp $10$ lần!</div>
        focus: [2, 3, 3, 4]
        say: "Bước hai, đạo hàm của hàm d theo z bằng f nhân n chia cho z bình phương nhân hiệu f trừ n. Cho độ biến thiên chuẩn hoá bằng một phần hai mũ b, ta suy ra công thức bước độ sâu nhỏ nhất s z. Nó bằng z bình phương nhân hiệu f trừ n, chia cho tích của f, n và hai mũ b. Khi f lớn hơn n rất nhiều thì tỉ số f trừ n trên f xấp xỉ 1, nên bước độ sâu tỉ lệ với z bình phương chia n."

