  # ───────────────────────── 5. CHẶNG 1 (1975) ─────────────────────────
  - id: stage1
    kind: example
    title: "Năm 1975 — Khai sinh: mô hình kinh nghiệm Bùi Tường Phong và Blinn"
    stage:
      year: "1975"
      scale: "Ảnh tĩnh kết xuất trên máy tính nghiên cứu, bề mặt ghép từ đa giác phẳng"
      source: "[PH75] [BL77]"
      practice: "Nội suy vector pháp tuyến qua tam giác và dùng vector nửa đường để tránh tính vector phản xạ"
    checks:
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
      - "round(alg.gfx_blinn_spec(0.95, 128), 4) == 0.0014"
    steps:
      - show: |
          <p><b>Bối cảnh 1975:</b> Máy tính thuở sơ khai chỉ đủ sức tô phẳng hoặc nội suy màu tại đỉnh; các vật thể tròn trông như bị vát góc và đốm bóng sáng bị méo mó.</p>
          <p><b>Đột phá từ Bùi Tường Phong (1975) và Blinn (1977):</b></p>
          <p>• <b>Nội suy pháp tuyến [PH75]:</b> thay vì nội suy màu, ta nội suy vector pháp tuyến $\mathbf{n}$ qua từng mảnh để bề mặt cong mượt mà.<br>• <b>Vector nửa đường [BL77]:</b> thay vì tính vector phản xạ đắt đỏ, dùng $\mathbf{h} = \frac{\mathbf{l} + \mathbf{v}}{\|\mathbf{l} + \mathbf{v}\|}$ để tính bóng sáng $(\mathbf{n}\cdot\mathbf{h})^s$.</p>
          <p><b>Con số tính lại với $\mathbf{n}\cdot\mathbf{h} = 0{,}95$:</b></p>
          $$s = 32 \implies 0{,}95^{32} \approx \hlb{0{,}194}; \qquad s = 128 \implies 0{,}95^{128} \approx \hlg{0{,}0014}$$
          <p class="note"><b>Điểm nghẽn 1975:</b> Chiếu sáng cục bộ thuần tuý không biết vật khác có che khuất hay phản chiếu hay không; bóng tối đen đặc và thiếu tính chân thực.</p>
        focus: [1, 2, 3, 4]
        say: "Năm 1975, nhà khoa học Bùi Tường Phong đề xuất giải pháp nội suy vector pháp tuyến qua bề mặt đa giác. Đến năm 1977, cải tiến dùng vector nửa đường giúp tính bóng sáng cực nhanh. Khi lệch nhẹ ở mức 0 phẩy 95, số mũ 32 cho giá trị 0 phẩy 194, nhưng số mũ 128 thu gọn đốm sáng xuống còn 0 phẩy 0014. Tuy nhiên, điểm nghẽn là mô hình cục bộ hoàn toàn không biết tới bóng đổ."

  # ───────────────────────── 6. CHẶNG 2 (1980) ─────────────────────────
  - id: stage2
    kind: example
    title: "Năm 1980 — Tăng trưởng: dò tia đệ quy Whitted và phương trình kết xuất Kajiya"
    stage:
      year: "1980"
      scale: "Kết xuất ngoại tuyến chất lượng cao cho phim ảnh"
      source: "[WH80] [KA86]"
      practice: "Giải bài toán truyền sáng toàn cục bằng cây tia đệ quy và lấy mẫu ngẫu nhiên"
    checks:
      - "10 ** 2 == 100"
      - "round(1 / (100 ** 0.5), 1) == 0.1"
    steps:
      - show: |
          <p><b>Đột phá 1980–1986:</b> Chuyển từ chiếu sáng cục bộ sang <b>chiếu sáng toàn cục</b>:</p>
          <p>• <b>Dò tia Whitted [WH80]:</b> bắn tia từ mắt tới vật, rồi đệ quy bắn tiếp tia phản xạ, tia khúc xạ và tia bóng đổ về nguồn sáng (chỉ tính nảy bật kiểu gương và bóng đổ).<br>• <b>Phương trình kết xuất Kajiya [KA86]:</b> viết một phương trình tích phân — ánh sáng rời một điểm bằng ánh sáng tự phát cộng tổng ánh sáng phản xạ từ mọi bề mặt khác — bao quát được nhiều thuật toán kết xuất đã biết, và giải bằng lấy mẫu ngẫu nhiên (dò đường).</p>
          <p><b>Quy luật hội tụ ngẫu nhiên:</b> sai số giảm theo tỉ lệ nghịch căn bậc hai số tia $1/\sqrt{N}$:</p>
          $$\text{Muốn giảm nhiễu hạt đi } 10\text{ lần} \implies \text{phải tăng số tia gấp } 10^2 = \hlg{100\text{ lần!}}$$
          <p class="note"><b>Điểm nghẽn 1986:</b> Dò hàng nghìn tia mỗi điểm ảnh quá nặng, hoàn toàn bất khả thi cho đồ hoạ thời gian thực thời bấy giờ.</p>
        focus: [1, 2, 3, 4]
        say: "Giai đoạn 1980 đến 1986 ghi dấu sự ra đời của kỹ thuật dò tia đệ quy và phương trình truyền sáng tổng quát. Ánh sáng được mô phỏng nảy bật kiểu gương giữa các đồ vật để tạo ra bóng đổ chân thực, còn nảy bật khuếch tán phải chờ phương trình tổng quát. Do sai số giảm theo nghịch đảo căn bậc hai, muốn giảm nhiễu hạt 10 lần ta phải tăng số tia lên gấp 100 lần. Điểm nghẽn là khối lượng tính toán quá lớn đối với các máy tính thời đó."

  # ───────────────────────── 7. CHẶNG 3 (1994) ─────────────────────────
  - id: stage3
    kind: example
    title: "Năm 1994 — Quy mô lớn: xấp xỉ Schlick và nguyên lý bảo toàn năng lượng"
    stage:
      year: "1994"
      scale: "Kết xuất cần công thức phản xạ đủ rẻ để tính cho từng điểm ảnh"
      source: "[SC94]"
      practice: "Thay thế phương trình điện từ phức tạp bằng xấp xỉ lũy thừa bậc 5 siêu nhẹ"
    checks:
      - "round(((1.5 - 1) / (1.5 + 1)) ** 2, 2) == 0.04"
      - "round(alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.07"
      - "round(1.0 - 0.07, 2) == 0.93"
    steps:
      - show: |
          <p><b>Điểm nghẽn 1994:</b> Các công thức phản xạ vật lý chính xác đòi hỏi hàm lượng giác và căn bậc hai phức tạp, quá tốn kém khi phải tính cho từng điểm ảnh.</p>
          <p><b>Công thức xấp xỉ lũy thừa bậc 5 của Schlick [SC94]:</b></p>
          $$F(\theta) = F_0 + (1 - F_0)(1 - \cos\theta)^5, \qquad F_0 = \left(\frac{n - 1}{n + 1}\right)^2$$
          <p>Với chất điện môi thông dụng có chiết suất $n = 1{,}5$ (nhựa, thuỷ tinh):</p>
          $$F_0 = \left(\frac{1{,}5 - 1}{1{,}5 + 1}\right)^2 = \left(\frac{0{,}5}{2{,}5}\right)^2 = 0{,}2^2 = \hlg{0{,}04}$$
          <p>Tại góc chiếu nghiêng có $\cos\theta = 0{,}5$:</p>
          $$F = 0{,}04 + 0{,}96 \cdot (1 - 0{,}5)^5 = 0{,}04 + 0{,}96 \cdot 0{,}03125 \approx \hlb{0{,}07}$$
          <p class="note"><b>Bảo toàn năng lượng:</b> phần năng lượng còn lại cho khuếch tán là $1 - F = 1 - 0{,}07 = \hlg{0{,}93}$.</p>
        focus: [1, 2, 3, 4]
        say: "Năm 1994, mô hình xấp xỉ lũy thừa bậc 5 ra đời đã tháo gỡ nút thắt hiệu năng. Với chất liệu phi kim có chiết suất 1 phẩy 5, hệ số phản xạ nhìn thẳng chỉ là 0 phẩy 04. Khi nhìn nghiêng ở góc có cô-sin bằng 0 phẩy 5, hệ số phản xạ tăng lên 0 phẩy 07. Nguyên lý bảo toàn năng lượng giới hạn phần khuếch tán chỉ nhận tối đa 93 phần trăm năng lượng còn lại."

  # ───────────────────────── 8. CHẶNG 4 (2012) ─────────────────────────
  - id: stage4
    kind: example
    title: "Năm 2012 — Ổn định và tiến hoá: chuẩn hoá vật lý thời gian thực từ Disney và UE4"
    stage:
      year: "2012"
      scale: "Phim hoạt hình kết xuất ngoại tuyến (Disney 2012) và công cụ làm trò chơi thời gian thực (UE4 2013)"
      source: "[BU12] [KA13]"
      practice: "Chuẩn hoá bộ tham số vật liệu và bình phương độ nhám để phân bổ độ bóng tự nhiên"
    checks:
      - "0.5 ** 2 == 0.25"
      - "round(1.0 - alg.gfx_schlick_fresnel(0.5, 0.04), 2) == 0.93"
    steps:
      - introduces: [alpha]
        show: |
          <p><b>Điểm nghẽn 2012:</b> Mỗi nghệ sĩ chỉnh hàng chục tham số kinh nghiệm tuỳ ý; khi chuyển vật thể từ cảnh nắng sang cảnh đêm thì vật liệu trông sai và phải chỉnh lại bằng tay.</p>
          <p><b>Chuẩn hoá vật liệu từ xưởng phim Disney [BU12] và công cụ thời gian thực [KA13]:</b></p>
          <p>• <b>Màu gốc:</b> là màu khuếch tán với phi kim, và là màu phản xạ gương $F_0$ với kim loại.<br>• <b>Độ kim loại:</b> phân biệt rõ phi kim ($F_0 = 0{,}04$) và kim loại thuần tuý ($F_0$ lấy từ màu gốc).<br>• <b>Bình phương độ nhám</b> (đề xuất trong [BU12], được [KA13] dùng lại): đổi độ nhám cảm nhận $r \in [0, 1]$ thành tham số $\alpha = r^2$.</p>
          <p><b>Ví dụ số:</b> Khi kéo thanh trượt độ nhám tới mức giữa $r = 0{,}5$:</p>
          $$\alpha = 0{,}5^2 = \hlg{0{,}25}$$
          <p class="note">Phép bình phương giúp mắt người cảm nhận độ bóng thay đổi tuyến tính và êm ái hơn khi điều chỉnh.</p>
        focus: [1, 2, 3, 4]
        say: "Năm 2012 và 2013, một xưởng phim hoạt hình rồi một công cụ làm trò chơi lớn đã chuẩn hoá bộ tham số vật liệu dựa trên vật lý. Ba thông số chính là màu gốc, độ kim loại và độ nhám cảm nhận, trong đó màu gốc là màu khuếch tán với phi kim và là màu phản xạ gương với kim loại. Việc lấy bình phương độ nhám giúp giá trị 0 phẩy 5 đổi thành 0 phẩy 25, tạo cảm giác chuyển đổi mượt mà. Nhờ đó, vật liệu trông nhất quán hơn khi đổi điều kiện chiếu sáng."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: kiểm chứng các con số cốt lõi của hành trình chiếu sáng"
    checks:
      - "round(alg.gfx_blinn_spec(0.95, 32), 3) == 0.194"
      - "10 ** 2 == 100"
      - "round(((1.5 - 1) / (1.5 + 1)) ** 2, 2) == 0.04"
      - "0.5 ** 2 == 0.25"
    steps:
      - show: |
          <p><b>Kiểm tra 1 — Kiểm chứng mô hình kinh nghiệm và quy luật giảm nhiễu:</b></p>
          <table class="t"><tr><th>mốc năm</th><th>phép tính kiểm chứng</th><th>kết quả</th></tr>
          <tr><td>1977</td><td>Bóng sáng lũy thừa: $0{,}95^{32}$</td><td>$\hlg{0{,}194}\ \checkmark$</td></tr>
          <tr><td>1986</td><td>Giảm nhiễu hạt $10\times$: cần $10^2$ tia</td><td>$\hlg{100\text{ lần số tia}}\ \checkmark$</td></tr></table>
        focus: [1, 2, 2]
        say: "Để tự kiểm tra tính nhất quán số học, ta tính lại các đại lượng của hai chặng đầu. Lũy thừa bóng sáng bậc 32 cho kết quả 0 phẩy 194. Và theo định luật hội tụ ngẫu nhiên, giảm nhiễu 10 lần bắt buộc phải tăng số tia lên 100 lần."
      - show: |
          <p><b>Kiểm tra 2 — Kiểm chứng phản xạ vật lý và tham số độ nhám:</b></p>
          <table class="t"><tr><th>mốc năm</th><th>công thức áp dụng</th><th>kết quả kiểm chứng</th></tr>
          <tr><td>1994</td><td>Chiết suất $n = 1{,}5 \implies F_0 = (0{,}5/2{,}5)^2$</td><td>$\hlg{0{,}04}\ \checkmark$</td></tr>
          <tr><td>2013</td><td>Độ nhám cảm nhận $r = 0{,}5 \implies \alpha = r^2$</td><td>$\hlg{0{,}25}\ \checkmark$</td></tr></table>
        focus: [1, 2]
        say: "Ở phép kiểm tra thứ hai, ta thay chiết suất 1 phẩy 5 vào công thức và thu được đúng 0 phẩy 04. Đồng thời, độ nhám cảm nhận 0 phẩy 5 bình phương lên bằng đúng 0 phẩy 25, khớp hoàn toàn với lý thuyết."

  # ───────────────────────── 10. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Hai hiểu lầm tai hại khi áp dụng mô hình chiếu sáng"
    checks:
      - "round(1.0 - 0.07, 2) == 0.93"
    steps:
      - show: |
          <div class="box warn"><b>Hiểu lầm 1.</b> Trộn các hệ số màu kinh nghiệm tuỳ ý vào công thức vật lý <b class="red">(làm vi phạm bảo toàn năng lượng!)</b></div>
          $$F + (1 - F) = 0{,}07 + 0{,}93 = 1{,}00 \quad (\text{bảo toàn năng lượng tuyệt đối})$$
          <p class="note">Nhiều người quen tay cộng màu phản xạ tuỳ thích khiến vật thể phát sáng rực rỡ hơn cả nguồn sáng chiếu vào. Trong đồ hoạ chuẩn, tổng phản xạ và khuếch tán không bao giờ được vượt quá $1{,}0$.</p>
        focus: [1, 2]
        say: "Hiểu lầm thứ nhất là tuỳ tiện cộng thêm màu bóng sáng rực rỡ mà không trừ bớt phần khuếch tán. Sai lầm này phá vỡ định luật bảo toàn năng lượng và làm vật thể phát sáng vô lý khi đổi góc nhìn."
      - show: |
          <div class="box warn"><b>Hiểu lầm 2.</b> Nghĩ rằng muốn có bóng đổ và phản chiếu đẹp thì phải bỏ hẳn raster hoá, dò tia toàn bộ khung hình <b class="red">(thường quá tốn với ngân sách thời gian thực)</b></div>
          <table class="t"><tr><th>công đoạn</th><th>phương pháp tối ưu</th><th>chi phí thời gian</th></tr>
          <tr><td>Hình học chính</td><td>Raster hoá tam giác</td><td>vài mi-li-giây</td></tr>
          <tr><td>Bóng đổ & phản chiếu</td><td>Dò tia có chọn lọc</td><td>trong ngân sách</td></tr></table>
        focus: [1, 2]
        say: "Hiểu lầm thứ hai là nghĩ rằng muốn có bóng đổ và phản chiếu đẹp thì phải bỏ hẳn raster hoá, dò tia toàn bộ khung hình. Tại thời điểm biên soạn, phần lớn trò chơi vẫn raster hoá hình học chính và chỉ dùng dò tia có chọn lọc cho bóng đổ và phản chiếu."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chọn mô hình chiếu sáng theo ngân sách khung hình dự án"
    checks:
      - "round(1000 / 60, 2) == 16.67"
      - "round(1000 / 30, 2) == 33.33"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Một trò chơi nhắm tới tốc độ 60 khung mỗi giây trên điện thoại di động có ngân sách toàn khung là $16{,}67\text{ ms}$. Bạn nên dùng mô hình chiếu sáng Blinn–Phong kinh nghiệm hay mô hình vật lý đầy đủ?</td></tr>
          <tr><td>2</td><td>Một dự án phim hoạt hình kết xuất ngoại tuyến cho phép tính toán 2 giờ cho một khung hình. Bạn sẽ chọn phương pháp chiếu sáng nào và vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự luyện tập hai câu hỏi. Câu một, với trò chơi di động 60 khung mỗi giây có ngân sách 16 phẩy 67 mi-li-giây, bạn nên chọn mô hình nào? Câu hai, với dự án phim kết xuất ngoại tuyến 2 giờ một khung, bạn sẽ chọn phương pháp nào? Dừng video và suy nghĩ."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 — Chọn mô hình cho thiết bị di động:</b></p>
          <div class="box key"><b>Chọn mô hình kinh nghiệm Blinn–Phong hoặc vật lý tối giản:</b> Trên điện thoại di động, băng thông bộ nhớ và năng lượng pin bị giới hạn nghiêm ngặt. Mô hình nửa đường chỉ tốn vài phép tính đơn giản trên mỗi mảnh, giúp dễ giữ ổn định <b>$60\text{ fps}$</b> ($16{,}67\text{ ms}$).</div>
        focus: [1, 1]
        say: "Đáp án câu một, với thiết bị di động ta nên ưu tiên mô hình nửa đường hoặc vật lý tối giản. Các phép tính gọn nhẹ giúp tiết kiệm pin và dễ giữ khung hình mượt mà ở mức 60 khung hình một giây."
      - show: |
          <p><b>Đáp án câu 2 — Chọn phương pháp cho phim ảnh:</b></p>
          <div class="box key"><b>Chọn phương pháp dò tia toàn cục kết hợp lấy mẫu ngẫu nhiên:</b> Khi không bị bó hẹp thời gian thực, bắn hàng nghìn tia mỗi điểm ảnh giúp nghiệm của phương trình truyền sáng hội tụ tới mức nhiễu hạt khó thấy, cho chất lượng hình ảnh cao nhất trong ngân sách thời gian.</div>
        focus: [1, 1]
        say: "Đáp án câu hai, với phim hoạt hình ngoại tuyến ta chọn phương pháp dò tia toàn cục. Bắn hàng nghìn tia sáng mỗi điểm ảnh giúp nghiệm của phương trình truyền sáng hội tụ tới mức nhiễu hạt khó thấy, cho chất lượng cao nhất trong ngân sách thời gian."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic toàn bộ khoá học Đồ hoạ máy tính"
    steps:
      - show: |
          <div class="chain"><span class="n">Đường ống, biến đổi & chiếu phối cảnh (Bài 0–2)</span><span class="a">→</span>
          <span class="n">Cắt khung nhìn, raster hoá & độ sâu (Bài 3–5)</span><span class="a">→</span>
          <span class="n">Chiếu sáng, kết cấu & màu (Bài 6–8)</span><span class="a">→</span>
          <span class="n">Dò tia, vật lý & hiệu năng (Bài 9–12)</span><span class="a">→</span>
          <span class="n">Hành trình vật lý (Bài 13)</span></div>
        focus: [1, 1]
        say: "Tổng kết toàn bộ khoá học Đồ hoạ máy tính, chúng ta đã đi từ các phép biến đổi toạ độ tới mô hình vật lý. Mỗi thuật toán là sự kết hợp hoàn hảo giữa toán học, vật lý và kỹ thuật phần cứng."
      - clear: true
        show: |
          <div class="box key"><b>Tư duy chuyên gia mang theo:</b> Đồ hoạ máy tính không phải là vẽ tranh tĩnh vật, mà là nghệ thuật làm chủ từng phép toán số học trong ngân sách 16 mi-li-giây để tái hiện thế giới. Chúc mừng bạn đã hoàn thành khoá học!</div>
        focus: [1, 1]
        say: "Tư duy lớn nhất bạn cần mang theo là nghệ thuật tối ưu từng phép toán trong ngân sách 16 mi-li-giây để kiến tạo nên thế giới ảo. Chúc mừng bạn đã hoàn thành xuất sắc toàn bộ khoá học Đồ hoạ máy tính!"
