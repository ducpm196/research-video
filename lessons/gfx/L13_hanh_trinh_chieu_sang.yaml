          <tr><td><b>Chiếu sáng toàn cục</b></td><td>Tính toán cả ánh sáng nảy bật nhiều lần giữa các bề mặt và bóng đổ che khuất</td></tr>
          <tr><td><b>Bảo toàn năng lượng</b></td><td>Tổng năng lượng khuếch tán và phản xạ không bao giờ được vượt quá ánh sáng chiếu tới</td></tr>
          <tr><td><b>Vật liệu dựa trên vật lý</b></td><td>Bộ tham số chuẩn hoá giữ cho vật liệu trông nhất quán khi đổi môi trường ánh sáng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
