        focus: ["1.2", "1.5", 2, 2]
        say: "Chào bạn, năm 1975, mô hình chiếu sáng kinh nghiệm ra đời với vài phép nhân cô-sin đơn sơ trên các máy tính cổ. Đến năm 2013, đồ hoạ thời gian thực đã đưa các quy luật vật lý của ánh sáng vào công cụ làm trò chơi. Hôm nay ta đi lại gần 40 năm lịch sử đó. Ta xem mỗi chặng công nghệ đã giải quyết điểm nghẽn nào và rút ra những bài học thiết kế sâu sắc."

