    steps:
      - show: |
          <table class="t"><tr><th>chặng lịch sử</th><th>mô hình chiếu sáng</th><th>đặc trưng then chốt</th></tr>
          <tr><td>1975–1977</td><td>Kinh nghiệm: Bùi Tường Phong [PH75] & Blinn [BL77]</td><td>Nội suy pháp tuyến, bóng sáng lũy thừa $(\mathbf{n}\cdot\mathbf{h})^s$</td></tr>
