          <tr><td>$v_{00}, v_{10}, v_{01}, v_{11}$</td><td>bốn giá trị màu ở bốn góc của một ô lưới kết cấu: dưới–trái, dưới–phải, trên–trái, trên–phải</td></tr>
          <tr><td>$(u, v) \in [0, 1]^2$</td><td>phần lẻ của toạ độ mẫu bên trong ô bốn điểm kết cấu ($u$ ngang, $v$ dọc)</td></tr>
          <tr><td><b>mipmap</b> (bộ ảnh thu nhỏ sẵn)</td><td>chuỗi ảnh kết cấu đã lọc trước, mỗi mức sau giảm một nửa chiều rộng và một nửa chiều cao</td></tr></table>
        introduces: [in]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã bốn thuật ngữ và ký hiệu của bài. Điểm kết cấu là một ô màu trên bức ảnh gốc, phân biệt với điểm ảnh trên màn hình. Bốn giá trị v không không, v một không, v không một, v một một là màu ở bốn góc của một ô lưới kết cấu. Cặp u, v thuộc đoạn từ 0 tới 1 là phần toạ độ lẻ bên trong ô đó theo chiều ngang và chiều dọc. Còn bộ ảnh thu nhỏ sẵn là chuỗi ảnh đã được tính trung bình trước, mỗi mức sau giảm một nửa mỗi chiều."

