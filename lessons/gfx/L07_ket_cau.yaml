scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đến gần thì vỡ ô vuông, lùi ra xa thì mặt đường lấp lánh"
    checks:
      - "alg.gfx_bilinear(10, 20, 30, 40, 0.5, 0.5) == 25.0"
      - "alg.gfx_mipmap_stats(1024)[0] == 11 and round(alg.gfx_mipmap_stats(1024)[2], 4) == 0.3333"
    steps:
      - show: |
          <p>Bạn dán một bức ảnh gạch lát 1024 × 1024 lên mặt đường 3D. Khi camera lại gần, mặt gạch hiện thành <b>từng ô vuông sắc cạnh</b>. Khi camera nhìn ra xa, mặt đường <b>nhấp nháy sọc lạ</b> mỗi khi nhân vật bước đi.</p>
          <div class="box key">Hôm nay: làm sao nội suy mượt giữa bốn điểm kết cấu (như 10, 20, 30, 40 cho ra <b>25</b> ở giữa ô)? Và vì sao chuẩn bị sẵn <b>11 mức</b> ảnh thu nhỏ chỉ tốn thêm <b>$\frac{1}{3}$ bộ nhớ</b> nhưng giảm hẳn hiện tượng lấp lánh ở xa?</div>
        focus: [1, 1, 1, 2, 2]
        say: "Chào bạn, giả sử bạn dán một bức ảnh gạch lát 1024 nhân 1024 lên mặt đường ba chiều. Khi camera lại sát gần, mặt gạch lộ ra thành từng ô vuông sắc cạnh rất thô. Khi camera nhìn ra xa, mặt đường lại nhấp nháy những sọc lạ mỗi khi nhân vật bước đi. Hôm nay ta học cách nội suy mượt giữa bốn điểm kết cấu như 10, 20, 30, 40 để ra 25 ở giữa ô. Đồng thời ta tính xem vì sao chuẩn bị sẵn 11 mức ảnh thu nhỏ chỉ tốn thêm một phần ba bộ nhớ nhưng giảm hẳn cảnh lấp lánh."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: nội suy một chiều, định lý lấy mẫu và cấp số nhân"
    checks:
      - "(1 - 0.5) * 10 + 0.5 * 20 == 15.0 and (1 - 0.25) * 10 + 0.25 * 20 == 12.5"
      - "sum((1 / 4) ** k for k in range(1, 11)) < 1 / 3 and round(sum((1 / 4) ** k for k in range(1, 11)), 5) == 0.33333"
      - "[[0, 200][i % 2] for i in range(0, 20, 2)] == [0] * 10 == [0 for i in range(0, 20, 2)] and 1 / 2 == 0.5 and 2 * 0.5 == 1 and 0.5 < 1"
      - "4 <= 2 * 3 and [[0, 200][i % 2] for i in range(0, 20, 2)] == [0] * 10 and [[0, 200][i % 2] for i in range(1, 20, 2)] == [200] * 10 and (0 + 200) / 2 == 100"
      - "round(sum((1 / 4) ** k for k in range(1, 40)), 9) == round((1 / 4) / (1 - 1 / 4), 9) == round(1 / 3, 9)"
    steps:
      - show: |
          <p><b>① Nội suy tuyến tính một chiều</b> (đã dùng khi nội suy thuộc tính ở bài 4): giữa hai đầu $a$ và $b$ với tỉ lệ $t \in [0, 1]$, giá trị tại $t$ là $(1 - t) \cdot a + t \cdot b$.</p>
          <p class="note">Ví dụ giữa $10$ và $20$: tại chính giữa $t = 0{,}5$ cho $(1 - 0{,}5) \cdot 10 + 0{,}5 \cdot 20 = 15$; tại $t = 0{,}25$ cho $0{,}75 \cdot 10 + 0{,}25 \cdot 20 = 12{,}5$.</p>
        focus: [1, 2, 2]
        say: "Trước hết ta ôn lại ba công cụ nền tảng sẽ dùng trong bài. Công cụ thứ nhất là nội suy tuyến tính một chiều như khi nội suy trên tam giác ở bài 4. Giá trị tại tỉ lệ t bằng 1 trừ t nhân a cộng t nhân b, nên giữa 10 và 20 tại chính giữa là 15, còn tại một phần tư là 12 phẩy 5."
      - show: |
          <p><b>② Định lý lấy mẫu:</b> <b>lấy mẫu</b> là chỉ đọc giá trị của một tín hiệu tại những vị trí cách đều nhau. Định lý nói: muốn các mẫu mô tả đúng tín hiệu, <b>tần số lấy mẫu</b> (số mẫu trên một đơn vị) phải <b>lớn hơn gấp đôi</b> tần số cao nhất của tín hiệu (số lần nó lặp lại trên một đơn vị). Vì sao? Lấy mẫu quá thưa thì hai tín hiệu khác nhau cho ra <b>cùng một dãy mẫu</b>:</p>
          $$\underbrace{0,\ 200,\ 0,\ 200,\ 0,\ 200,\ \dots}_{\text{sọc lặp mỗi 2 điểm kết cấu}} \;\xrightarrow{\text{mẫu ở vị trí } 0,\ 2,\ 4,\ \dots}\; 0,\ 0,\ 0,\ \dots \;=\; \text{mẫu của mặt đen phẳng } 0,\ 0,\ 0,\ 0,\ \dots$$
          <p class="note">Sọc lặp lại $0{,}5$ lần trên mỗi điểm kết cấu, nên cần hơn $2 \cdot 0{,}5 = 1$ mẫu trên mỗi điểm kết cấu; ở đây chỉ có $0{,}5$ mẫu. Kết quả: sọc nhanh “đội lốt” một mặt phẳng màu đen (hoặc trắng $200$ khi camera dịch 1 ô), thay vì màu xám trung bình $100$. Hiện tượng tín hiệu nhanh đội lốt tín hiệu chậm này gọi là <b>răng cưa</b> hay tần số giả.</p>
        clear: true
        introduces: [dots]
        focus: [1, 1, 1, 2, 3, 3]
        say: "Công cụ thứ hai là định lý lấy mẫu, trong đó lấy mẫu nghĩa là chỉ đọc giá trị của tín hiệu tại những vị trí cách đều nhau. Định lý nói rằng số mẫu trên một đơn vị phải lớn hơn gấp đôi số lần tín hiệu lặp lại nhanh nhất trên một đơn vị. Lý do là khi lấy mẫu quá thưa, hai tín hiệu khác nhau cho ra cùng một dãy mẫu nên máy không phân biệt được. Ví dụ sọc đen trắng 0, 200 lặp lại mỗi 2 điểm kết cấu, nếu chỉ lấy mẫu ở vị trí 0, 2, 4 thì mọi mẫu đều bằng 0, giống hệt một mặt đen phẳng. Sọc lặp 0 phẩy 5 lần trên mỗi điểm kết cấu nên cần hơn 1 mẫu trên mỗi điểm, mà ở đây chỉ có 0 phẩy 5 mẫu. Khi camera dịch một ô, mọi mẫu lại đều bằng 200, nên mặt đường nhấp nháy đen trắng thay vì xám 100, và hiện tượng này gọi là răng cưa hay tần số giả."
      - show: |
          <p><b>③ Tổng cấp số nhân lùi:</b> dãy mà mỗi số hạng sau bằng $q$ lần số hạng trước ($0 \lt q \lt 1$) có tổng tiến về $\frac{a}{1 - q}$, với $a$ là số hạng đầu. Mỗi bước giảm diện tích đi 4 lần thì $a = \frac{1}{4}$, $q = \frac{1}{4}$:</p>
          $$\frac{1}{4} + \frac{1}{16} + \frac{1}{64} + \dots \approx \frac{1/4}{1 - 1/4} = \frac{1}{3}$$
        clear: true
        focus: [1, 1, 2]
        say: "Công cụ thứ ba là cấp số nhân lùi, tức dãy mà mỗi số hạng sau bằng q lần số hạng trước với q nhỏ hơn 1. Tổng của dãy tiến về số hạng đầu chia cho 1 trừ q. Khi mỗi bước giảm diện tích 4 lần, tổng một phần tư cộng một phần mười sáu cộng một phần sáu mươi tư mãi sẽ tiến về một phần tư chia ba phần tư, tức một phần ba."

