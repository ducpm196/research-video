# Quy ước: toạ độ kết cấu chuẩn hoá (u, v) ∈ [0, 1]² hoặc toạ độ lẻ trong một ô giữa bốn điểm kết cấu góc ô (v00, v10, v01, v11).
#   Tên mipmap, Nyquist, Williams chỉ hiện trên màn hình; lời đọc nói “tháp ảnh thu nhỏ sẵn” / “bộ ảnh thu nhỏ sẵn”, “định lý lấy mẫu”.
