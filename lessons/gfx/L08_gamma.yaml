scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Trộn một nửa đen với một nửa trắng: vì sao 128 lại tối sẫm còn 188 mới đúng?"
    checks:
      - "alg.gfx_srgb_blend_byte(0, 255, 0.5) == (128, 188)"
      - "round(alg.gfx_srgb_to_linear(128 / 255), 3) == 0.216"
    steps:
      - show: |
          <p>Bạn trộn đều 50% điểm ảnh đen ($0$) với 50% điểm ảnh trắng ($255$) bằng cách lấy trung bình cộng $\frac{0 + 255}{2} \approx 128$. Nhưng khi hiển thị lên màn hình, vùng biên trộn lại <b>tối sẫm bất thường</b>, chỉ phát ra <b>$21{,}6\%$</b> năng lượng ánh sáng trắng!</p>
          <div class="box key">Hôm nay: vì sao các tệp ảnh 8 bit phải nén theo đường cong <b>gamma</b>? Và vì sao muốn có đúng $50\%$ năng lượng ánh sáng vật lý, ta phải tính trong <b>không gian tuyến tính</b> để thu được mức byte <b>$188$</b> thay vì $128$?</div>
        focus: [1, 1, 2, 2]
        say: "Chào bạn, giả sử bạn trộn đều 50 phần trăm điểm ảnh đen 0 với 50 phần trăm điểm ảnh trắng 255 bằng cách lấy trung bình cộng ra xấp xỉ 128. Nhưng khi hiển thị lên màn hình, vùng biên trộn lại bị tối sẫm bất thường vì chỉ phát ra 21 phẩy 6 phần trăm năng lượng ánh sáng trắng. Hôm nay ta tìm hiểu vì sao tệp ảnh 8 bit phải nén theo đường cong gamma. Đồng thời ta tính xem vì sao muốn có đúng 50 phần trăm năng lượng ánh sáng vật lý thì phải tính trong không gian tuyến tính để ra mức byte 188 thay vì 128."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: cộng năng lượng ánh sáng, lượng tử hoá 8 bit và hàm lũy thừa"
    checks:
      - "2 ** 8 == 256 and round(0.5 ** 2.2, 4) == 0.2176 and round(0.5 ** (1 / 2.2), 4) == 0.7297"
    steps:
      - show: |
          <p><b>① Chiếu sáng và nội suy đều là phép cộng năng lượng vật lý</b> (bài 6 và bài 7): khi hai nguồn sáng cùng chiếu vào mặt phẳng, hoặc khi một điểm ảnh phủ nửa ô đen nửa ô trắng, <b>số lượng hạt ánh sáng</b> đến mắt bằng tổng tuyến tính của từng phần.</p>
          <p><b>② Lượng tử hoá 8 bit mỗi kênh:</b> mỗi kênh màu nguyên lưu một số từ $0$ đến $255$ (tổng cộng $2^8 = 256$ mức rời rạc).</p>
        focus: [1, 1, 2]
        say: "Trước hết ta ôn lại ba kiến thức nền tảng từ các bài trước. Thứ nhất, ở bài 6 và bài 7, khi hai nguồn sáng chiếu vào bề mặt hoặc khi điểm ảnh phủ hai ô màu, năng lượng hạt ánh sáng đến mắt là tổng tuyến tính. Thứ hai, mỗi kênh màu trong tệp ảnh 8 bit lưu một số nguyên từ 0 đến 255, tức chỉ có 256 mức rời rạc."
      - show: |
          <p><b>③ Hàm lũy thừa và hàm ngược trên đoạn $[0, 1]$:</b> với số mũ $p > 1$ (ví dụ $p \approx 2{,}2$), đường cong $x = c^p$ võng xuống dưới đường chéo, còn hàm ngược $c = x^{1/p}$ vồng lên trên:</p>
          <p class="note">Tại $c = 0{,}5$: lũy thừa $0{,}5^{2{,}2} \approx 0{,}218$ (nhỏ hơn một nửa rất nhiều); ngược lại muốn $x = 0{,}5$ thì $0{,}5^{1/2{,}2} \approx 0{,}730$.</p>
        focus: [1, 1, 2]
        say: "Thứ ba là tính chất của hàm lũy thừa trên đoạn từ 0 tới 1 với số mũ gamma lớn hơn 1, chẳng hạn xấp xỉ 2 phẩy 2. Đường cong c mũ 2 phẩy 2 võng sâu xuống dưới, làm giá trị 0 phẩy 5 bị ép xuống chỉ còn xấp xỉ 0 phẩy 218. Ngược lại, hàm căn bậc 2 phẩy 2 của 0 phẩy 5 lại vồng lên tới xấp xỉ 0 phẩy 73."

