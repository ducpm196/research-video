  - id: formula
    kind: formula
    title: "Công thức chuyển đổi chuẩn hai đoạn và quy trình trộn màu tuyến tính"
    checks:
      - "round(alg.gfx_srgb_to_linear(0.04045), 6) == 0.003131"
      - "round(alg.gfx_linear_to_srgb(0.0031308), 5) == 0.04045"
      - "alg.gfx_srgb_blend_byte(0, 255, 0.5) == (128, 188)"
    steps:
      - show: |
          <p><b>Bước 1 — giải mã từ không gian màn hình sang cường độ sáng tuyến tính $x$:</b> chuẩn quốc tế ghép một đoạn thẳng nhỏ sát gốc với hàm lũy thừa mũ $2{,}4$ (tạo hiệu ứng tổng thể tương đương $\gamma \approx 2{,}2$):</p>
          $$x = \begin{cases} \dfrac{c}{12{,}92}, & c \le 0{,}04045 \\[8pt] \left(\dfrac{c + 0{,}055}{1{,}055}\right)^{2{,}4}, & c > 0{,}04045 \end{cases}$$
          <p class="note">Đoạn thẳng $c / 12{,}92$ ở vùng rất tối giúp hàm ngược (mã hoá) có độ dốc hữu hạn tại $0$; nếu chỉ dùng một hàm lũy thừa thì hàm ngược dốc đứng ở $0$, gây nhiễu số học khi đổi chiều.</p>
        focus: [1, 1, 2, 3]
        say: "Bước một, ta viết công thức chuẩn để giải mã từ giá trị chuẩn hoá c sang cường độ sáng tuyến tính x. Thay vì dùng một hàm lũy thừa đơn lẻ mà hàm ngược của nó dốc đứng tại điểm 0, chuẩn quốc tế ghép hai nhánh liên tục. Với c nhỏ hơn hoặc bằng 0 phẩy 04045 ở sát mức đen, x bằng c chia cho 12 phẩy 92. Với c lớn hơn ngưỡng đó, x bằng c cộng 0 phẩy 055 tất cả chia 1 phẩy 055 rồi lấy lũy thừa mũ 2 phẩy 4."
      - clear: true
        show: |
          <p><b>Bước 2 — mã hoá ngược từ cường độ sáng tuyến tính $x$ về không gian màn hình $c$:</b> lấy hàm ngược trên từng nhánh, rồi nhân $255$ và làm tròn để lưu thành byte:</p>
          $$c = \begin{cases} 12{,}92\,x, & x \le 0{,}0031308 \\[8pt] 1{,}055\,x^{1/2{,}4} - 0{,}055, & x > 0{,}0031308 \end{cases}, \qquad B = \operatorname{round}(255\,c)$$
        focus: [1, 2, 2]
        say: "Bước hai, sau khi đã cộng ánh sáng xong trong không gian tuyến tính, ta giải ngược từng nhánh để mã hoá x về lại giá trị c. Vì nhánh nhỏ là phép chia nên hàm ngược với x dưới 0 phẩy 0031308 là nhân x với 12 phẩy 92. Với x lớn hơn ngưỡng đó, ta lấy x mũ 1 phần 2 phẩy 4, nhân 1 phẩy 055 trừ 0 phẩy 055, rồi nhân 255 làm tròn ra byte B."
      - clear: true
        show: |
          <p><b>Bước 3 — công thức trộn hai màu $B_1, B_2$ theo tỉ lệ $t \in [0, 1]$:</b></p>
          $$x_1 = f_{\text{giải mã}}\!\left(\frac{B_1}{255}\right), \quad x_2 = f_{\text{giải mã}}\!\left(\frac{B_2}{255}\right)$$
          $$x_{\text{trộn}} = (1 - t)\,x_1 + t\,x_2 \implies B_{\text{đúng}} = \operatorname{round}\!\Big(255\,f_{\text{mã hoá}}(x_{\text{trộn}})\Big)$$
        introduces: [implies]
        focus: [1, 2, 2]
        say: "Bước ba, ta đóng gói quy trình trộn hai byte màu B một và B hai theo trọng số pha trộn. Đầu tiên phải giải mã từng byte riêng lẻ sang cường độ tuyến tính x một và x hai. Sau đó lấy tổ hợp tuyến tính trong không gian vật lý, rồi mới đưa kết quả qua hàm mã hoá ngược và nhân 255 để nhận được byte màu chính xác."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính tay: vì sao trộn 0 và 255 ra 188, còn byte 128 chỉ đạt 21,6%?"
    checks:
      - "round(128 / 255, 4) == 0.5020"
      - "round(alg.gfx_srgb_to_linear(128 / 255), 4) == 0.2159"
      - "round(alg.gfx_linear_to_srgb(0.5), 4) == 0.7354"
      - "round(alg.gfx_linear_to_srgb(0.5) * 255) == 188"
      - "alg.gfx_srgb_blend_byte(0, 255, 0.5) == (128, 188)"
    steps:
      - show: |
          <p><b>Phép tính 1 — kiểm tra năng lượng thực sự của byte trung bình ngây thơ $B = 128$:</b></p>
          <p>Chuẩn hoá: $c = \frac{128}{255} \approx 0{,}5020 > 0{,}04045$. Thay vào nhánh lũy thừa mũ $2{,}4$:</p>
          $$x(128) = \left(\frac{0{,}5020 + 0{,}055}{1{,}055}\right)^{2{,}4} = \left(\frac{0{,}5570}{1{,}055}\right)^{2{,}4} \approx 0{,}5280^{2{,}4} \approx \hlo{0{,}2159 \approx 21{,}6\%}$$
          <p class="note">Trộn ngây thơ ra byte $128$ làm mất hơn một nửa năng lượng sáng lẽ ra phải có ($21{,}6\%$ thay vì $50\%$).</p>
        focus: [1, [2, 3], 4]
        say: "Ta thực hiện phép tính thứ nhất để xem mức byte trung bình ngây thơ 128 thực sự phát ra bao nhiêu ánh sáng. Chia 128 cho 255 được c xấp xỉ 0 phẩy 502, lớn hơn ngưỡng chuyển nhánh nên ta thay vào công thức lũy thừa mũ 2 phẩy 4. Cộng 0 phẩy 055 rồi chia cho 1 phẩy 055 được 0 phẩy 528, nâng lên lũy thừa 2 phẩy 4 chỉ còn 0 phẩy 2159, tức 21 phẩy 6 phần trăm ánh sáng trắng."
      - clear: true
        show: |
          <p><b>Phép tính 2 — trộn đúng $50\%$ đen ($B_1 = 0$) và $50\%$ trắng ($B_2 = 255$) trong không gian tuyến tính:</b></p>
          <p>Giải mã hai đầu mút: $x_1 = 0{,}0$ và $x_2 = 1{,}0$. Trung bình năng lượng tuyến tính là $x_{\text{trộn}} = 0{,}5 \cdot 0{,}0 + 0{,}5 \cdot 1{,}0 = \hlg{0{,}5000}$.</p>
          <p>Mã hoá ngược $x = 0{,}5 > 0{,}0031308$ về không gian màn hình:</p>
          $$c = 1{,}055 \cdot (0{,}5)^{1/2{,}4} - 0{,}055 \approx 1{,}055 \cdot 0{,}7492 - 0{,}055 \approx 0{,}7354 \implies B_{\text{đúng}} = \operatorname{round}(255 \cdot 0{,}7354) = \hlg{188}$$
        focus: [1, 2, 3, 4]
        say: "Phép tính thứ hai trộn đúng 50 phần trăm đen và 50 phần trăm trắng trong không gian tuyến tính. Hai đầu mút 0 và 255 khi giải mã vẫn là 0 và 1, nên trung bình năng lượng tuyến tính bằng đúng 0 phẩy 5. Thay x bằng 0 phẩy 5 vào công thức mã hoá ngược, 0 phẩy 5 mũ 1 phần 2 phẩy 4 nhân 1 phẩy 055 trừ 0 phẩy 055 ra c xấp xỉ 0 phẩy 7354. Nhân với 255 được 187 phẩy 5, làm tròn ra đúng byte 188."
      - clear: true
        show: |
          <p><b>Bảng đối chiếu 5 mốc byte tiêu biểu:</b></p>
          <table class="t"><tr><th>mức byte $B$</th><th>chuẩn hoá $c = B/255$</th><th>cường độ tuyến tính $x$</th><th>ý nghĩa vật lý</th></tr>
          <tr><td>$0$</td><td>$0{,}0000$</td><td>$0{,}0000 \;(0{,}0\%)$</td><td>Đen tuyệt đối trùng nhau</td></tr>
          <tr><td>$64$</td><td>$0{,}2510$</td><td>$0{,}0513 \;(5{,}1\%)$</td><td>Một phần tư dải byte mới đạt $5{,}1\%$ năng lượng sáng</td></tr>
          <tr><td>$128$</td><td>$0{,}5020$</td><td>$\hlo{0{,}2159 \;(21{,}6\%)}$</td><td>Giữa dải byte nhưng năng lượng chưa tới một phần tư</td></tr>
          <tr><td>$188$</td><td>$0{,}7373$</td><td>$\hlg{0{,}5029 \;(50{,}3\%)}$</td><td>Mức nguyên 8 bit gần nhất với đúng $50\%$ năng lượng sáng</td></tr>
          <tr><td>$255$</td><td>$1{,}0000$</td><td>$1{,}0000 \;(100{,}0\%)$</td><td>Trắng cực đại trùng nhau</td></tr></table>
        focus: [1, "2.3", "2.4"]
        say: "Bảng tổng hợp năm mốc byte cho thấy toàn cảnh sự chênh lệch. Tại byte 64 tức một phần tư dải số nguyên, năng lượng sáng mới đạt 5 phẩy 1 phần trăm. Tại byte 128 giữa dải nguyên, năng lượng sáng chỉ đạt 21 phẩy 6 phần trăm, còn muốn đạt một nửa năng lượng sáng thực tế thì phải lên tới byte 188."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đối chiếu với xấp xỉ mũ 2,2 và kiểm tra hai chiều"
    checks:
      - "round((128 / 255) ** 2.2, 3) == 0.220"
      - "round((0.5 ** (1 / 2.2)) * 255) == 186"
      - "round(alg.gfx_srgb_to_linear(188 / 255), 3) == 0.503"
    steps:
      - show: |
          <p><b>Đường khác 1 — ước lượng nhẩm bằng lũy thừa đơn giản $\gamma = 2{,}2$:</b></p>
          $$x_{\text{xấp xỉ}}(128) = \left(\frac{128}{255}\right)^{2{,}2} \approx 0{,}502^{2{,}2} \approx 0{,}220 \quad (\text{sát với kết quả chuẩn } 0{,}216)$$
          $$B_{\text{xấp xỉ}}(x = 0{,}5) = \operatorname{round}\!\left(255 \cdot 0{,}5^{1/2{,}2}\right) = \operatorname{round}(255 \cdot 0{,}730) = 186 \quad (\text{sát với } 188)$$
        focus: [1, 2, 3]
        say: "Ta kiểm tra lại bằng đường khác thứ nhất là công thức ước lượng nhẩm với số mũ đơn giản 2 phẩy 2. Lấy 128 chia 255 rồi mũ 2 phẩy 2 ra 0 phẩy 220, rất sát với con số chuẩn 0 phẩy 216. Theo chiều ngược lại, lấy 0 phẩy 5 mũ 1 phần 2 phẩy 2 rồi nhân 255 ra 186, chỉ lệch 2 đơn vị so với kết quả chuẩn 188."
      - show: |
          <p><b>Đường khác 2 — thế ngược byte $B = 188$ vào hàm giải mã chuẩn:</b></p>
          $$c = \frac{188}{255} \approx 0{,}7373 \implies x(188) = \left(\frac{0{,}7373 + 0{,}055}{1{,}055}\right)^{2{,}4} \approx 0{,}5029 \checkmark$$
          <p class="note">Sai số $0{,}5029 - 0{,}5000 = 0{,}0029$ chỉ do làm tròn $187{,}52$ thành số nguyên $188$.</p>
        focus: [1, 2, 3]
        say: "Đường kiểm tra thứ hai là lấy chính con số nguyên 188 thay ngược vào hàm giải mã chuẩn hai đoạn. Vì tỉ số 188 chia 255 bằng 0 phẩy 7373, nên sau khi qua công thức mũ 2 phẩy 4 ta thu được cường độ tuyến tính 0 phẩy 5029. Kết quả này khớp với mốc 0 phẩy 5 trong giới hạn làm tròn số nguyên."

  # ───────────────────────── 8. LỖI HAY GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những lỗi hay gặp khi thiết lập đường ống màu tuyến tính"
    checks:
      - "alg.gfx_srgb_blend_byte(0, 255, 0.5) == (128, 188)"
      - "round(alg.gfx_srgb_to_linear(0.5), 4) == 0.2140 and 2 * 0.5 - 1 == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tạo bộ ảnh thu nhỏ sẵn hoặc nội suy song tuyến (bài 7) trực tiếp trên byte chưa giải mã <b class="red">(cảnh ở xa bị sẫm màu)</b>
          <br><span class="note">Mỗi mức thu nhỏ lấy trung bình bốn ô con; nếu tính trung bình các ô sáng tối xen kẽ ngay trên byte màn hình thì mỗi mức sau lại bị kéo tụt độ sáng xuống giống hệt lỗi $128$ thay vì $188$.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất là tạo bộ ảnh thu nhỏ sẵn hoặc lọc song tuyến ở bài 7 trực tiếp trên các byte màu chưa giải mã. Do mỗi mức thu nhỏ lấy trung bình bốn ô con, việc cộng trực tiếp trên byte sẽ kéo độ sáng từ 188 xuống 128, làm vật thể ở xa bị sẫm tối."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tính công thức chiếu sáng bài 6 trực tiếp trên màu chưa giải mã <b class="red">(bóng đổ gắt và sai lệch độ bão hoà màu)</b>
          <br><span class="note">Khi cosin góc tới giảm một nửa ($\cos\theta = 0{,}5$), nhân $0{,}5$ vào giá trị đã nén gamma tương đương làm giảm năng lượng vật lý xuống hơn bốn lần ($0{,}5^{2{,}2} \approx 0{,}218$)!</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là tính công thức chiếu sáng ở bài 6 trực tiếp trên màu kết cấu chưa giải mã. Khi cosin góc tới bằng 0 phẩy 5, nhân thẳng 0 phẩy 5 vào giá trị đã nén gamma làm năng lượng hiển thị sụt giảm hơn bốn lần, khiến bóng đổ bị gắt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Bật giải mã gamma tự động cho cả <b>bản đồ pháp tuyến, độ nhám hoặc độ sâu</b> <b class="red">(méo hoàn toàn hướng vector!)</b>
          <br><span class="note"><b>Bản đồ pháp tuyến</b> là ảnh lưu hướng pháp tuyến của từng điểm, mỗi kênh màu $c$ mã hoá một toạ độ $2c - 1$; <b>bản đồ độ nhám</b> lưu con số từ $0$ (láng bóng) đến $1$ (sần mờ) cho từng điểm. Trong bản đồ pháp tuyến, giá trị $0{,}5$ biểu diễn toạ độ $2 \cdot 0{,}5 - 1 = 0$ của vector. Nếu bị giải mã nhầm sang $0{,}214$, mọi pháp tuyến trên mặt phẳng đều bị bẻ nghiêng lệch hướng! Chỉ giải mã gamma cho kết cấu mang màu sắc thị giác.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ ba của người đã đi làm là bật cờ giải mã gamma cho tất cả mọi tệp ảnh trong dự án, kể cả bản đồ pháp tuyến hay bản đồ độ nhám. Bản đồ pháp tuyến là ảnh lưu hướng pháp tuyến của từng điểm, còn bản đồ độ nhám lưu mức sần hay láng của từng điểm. Những tệp này lưu dữ liệu hình học thuần số học vốn đã tuyến tính, ví dụ giá trị 0 phẩy 5 biểu diễn đúng toạ độ 0 của vector pháp tuyến. Nếu bị giải mã nhầm thành 0 phẩy 214, toàn bộ hướng pháp tuyến trên bề mặt sẽ bị bẻ cong sai lệch."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính năng lượng tuyến tính, trộn theo tỉ lệ và phân loại kết cấu"
    checks:
      - "round(alg.gfx_srgb_to_linear(192 / 255), 3) == 0.527"
      - "alg.gfx_srgb_blend_byte(0, 255, 0.25) == (64, 137)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Một điểm ảnh có giá trị byte $B = 192$ (tức $c = 192 / 255 \approx 0{,}7529$). Hãy tính cường độ ánh sáng tuyến tính $x$ theo công thức chuẩn (làm tròn 3 chữ số thập phân).</td></tr>
          <tr><td>2</td><td>Trộn $75\%$ màu đen ($B_1 = 0$) với $25\%$ màu trắng ($B_2 = 255$), tức $t = 0{,}25$. Tính byte trộn ngây thơ và byte trộn đúng trong không gian tuyến tính.</td></tr>
          <tr><td>3</td><td>Trong một vật liệu 3D có hai tệp ảnh: (A) ảnh màu gỗ chụp từ máy ảnh, và (B) bản đồ độ nhám bề mặt do phần mềm xuất ra. Tệp nào phải bật giải mã gamma khi đọc vào bộ xử lý đồ hoạ?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự giải ba câu hỏi. Câu một, một điểm ảnh có mức byte bằng 192, hãy tính cường độ ánh sáng tuyến tính x theo công thức chuẩn. Câu hai, trộn 75 phần trăm màu đen 0 với 25 phần trăm màu trắng 255, hãy tìm mức byte trộn ngây thơ và mức byte trộn đúng theo không gian tuyến tính. Câu ba, giữa ảnh màu gỗ và bản đồ độ nhám bề mặt, tệp nào phải bật giải mã gamma khi đọc? Hãy dừng video và tính thử."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> Chuẩn hoá $c = \frac{192}{255} \approx 0{,}7529 > 0{,}04045$. Cường độ tuyến tính là:</p>
          $$x = \left(\frac{0{,}7529 + 0{,}055}{1{,}055}\right)^{2{,}4} \approx (0{,}7658)^{2{,}4} \approx \hlg{0{,}527} \;\; (52{,}7\% \text{ ánh sáng trắng})$$
          <p><b>Đáp án câu 2.</b> Trộn ngây thơ: $\operatorname{round}(0{,}25 \cdot 255) = \hlo{64}$. Trộn đúng: $x_{\text{trộn}} = 0{,}25 \implies c = 1{,}055 \cdot (0{,}25)^{1/2{,}4} - 0{,}055 \approx 0{,}5371 \implies B_{\text{đúng}} = \operatorname{round}(255 \cdot 0{,}5371) = \hlg{137}$.</p>
        focus: [[1, 2], 3, 3]
        say: "Đáp án câu một, lấy 192 chia 255 được 0 phẩy 7529, cộng 0 phẩy 055 chia 1 phẩy 055 rồi lấy mũ 2 phẩy 4 ra cường độ tuyến tính xấp xỉ 0 phẩy 527. Đáp án câu hai, trộn ngây thơ một phần tư của 255 ra byte 64. Nếu tính đúng với cường độ tuyến tính 0 phẩy 25, mã hoá ngược cho c bằng 0 phẩy 5371, nhân 255 làm tròn ra byte 137."
      - show: |
          <table class="t"><tr><th>tệp kết cấu (câu 3)</th><th>cấu hình khi đọc</th><th>giải thích</th></tr>
          <tr><td>(A) Ảnh màu gỗ (màu sắc thị giác)</td><td><b>Bật giải mã gamma</b> về tuyến tính</td><td>Ảnh màu 8 bit thường được lưu theo đường cong nén màn hình; phải giải mã về tuyến tính trước khi lọc và nhân ánh sáng</td></tr>
          <tr><td>(B) Bản đồ độ nhám bề mặt (dữ liệu số học)</td><td><b>Giữ nguyên tuyến tính</b> (tắt giải mã)</td><td>Con số $0{,}5$ là tham số vật lý trực tiếp; giải mã gamma sẽ làm sai lệch thông số độ nhám của vật liệu</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Đáp án câu ba, tệp A là ảnh màu gỗ đã được nén gamma khi lưu tệp, nên bắt buộc bật giải mã về tuyến tính trước khi lọc và tính chiếu sáng. Ngược lại, tệp B là bản đồ độ nhám chứa tham số vật lý thuần số học, nên phải giữ nguyên tuyến tính và tắt giải mã gamma."

