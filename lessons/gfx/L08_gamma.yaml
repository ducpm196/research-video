# Quy ước: c ∈ [0, 1] là giá trị chuẩn hoá trong không gian mã hoá màn hình (sRGB), x ∈ [0, 1] là cường độ sáng vật lý trong không gian tuyến tính.
#   Tên sRGB, IEC, Gritz chỉ hiện trên màn hình; lời đọc nói “không gian màu chuẩn của màn hình” / “không gian mã hoá gamma” và “không gian tuyến tính”.
objectives:
