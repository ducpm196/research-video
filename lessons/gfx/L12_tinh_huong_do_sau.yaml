scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao vật ở xa 1 km bị nhấp nháy đè lên nhau khi nhìn qua camera?"
    checks:
      - "round(alg.gfx_depth_step(1000, 0.01, 10000, 24), 2) == 5.96"
      - "round(alg.gfx_depth_step(1000, 0.5, 10000, 24), 2) == 0.12"
    steps:
      - show: |
          <p>Đội của bạn đang dựng một cảnh thế giới mở rộng lớn: mặt cắt xa đặt ở $f = 10\,000\text{ m}$ ($10\text{ km}$), còn mặt cắt gần đặt ở $n = 0{,}01\text{ m}$ ($1\text{ cm}$) trên bộ đệm độ sâu $24\text{ bit}$. Khi camera nhìn dãy nhà ở cách $z = 1\,000\text{ m}$, những bức tường cách nhau cả mét cứ <b>nhấp nháy rách nát</b> mỗi khi xoay góc nhìn!</p>
          <div class="box key">Hôm nay: chẩn đoán bằng con số — vì sao ở $z = 1\,000\text{ m}$, một bước lượng tử độ sâu lại phình to tới <b>$5{,}96\text{ m}$</b>? Vì sao sửa mặt cắt xa $f$ là vô ích, còn đẩy mặt cắt gần $n$ lên $0{,}5\text{ m}$ lại thu nhỏ bước nhảy xuống <b>$0{,}12\text{ m}$</b>?</div>
        focus: [1, 1, 1, 2, 2]
        say: "Chào bạn, giả sử bạn đang phát triển một cảnh thế giới mở có tầm nhìn xa 10 nghìn mét. Ta đặt mặt cắt gần ở 0 phẩy 01 mét trên bộ đệm độ sâu 24 bit. Khi nhìn dãy nhà cách 1 nghìn mét, các bức tường cách nhau cả mét lại nhấp nháy đè lên nhau dữ dội. Hôm nay ta đóng vai kỹ sư chẩn đoán: tính xem vì sao tại khoảng cách 1 nghìn mét, bước lượng tử độ sâu lại phình to tới 5 phẩy 96 mét. Đồng thời ta chứng minh vì sao chỉnh mặt cắt xa là vô ích, còn đẩy mặt cắt gần lên 0 phẩy 5 mét lại thu nhỏ bước nhảy xuống 0 phẩy 12 mét."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: độ sâu chuẩn hoá phi tuyến 1/z bài 5 và chi phí lượt vẽ bài 11"
    checks:
      - "2 ** 24 == 16777216"
      - "round(alg.gfx_depth_norm(0.02, 0.01, 10000), 4) == 0.5000"
    steps:
      - show: |
          <p><b>① Đường cong độ sâu phi tuyến</b> (bài 5): phép chiếu phối cảnh ánh xạ khoảng cách $z \in [n, f]$ sang giá trị bộ đệm $z_n \in [0, 1]$ theo quy luật nghịch đảo $1/z$:</p>
          $$z_n(z) = \frac{f\,(z - n)}{z\,(f - n)} = \frac{f}{f - n}\left(1 - \frac{n}{z}\right)$$
          <p class="note">Với $n = 0{,}01\text{ m}$ và $f = 10\,000\text{ m}$: ngay tại $z = 2n = 0{,}02\text{ m}$ ($2\text{ cm}$), giá trị $z_n$ đã vọt lên $0{,}5000$ — tức <b>một nửa trong tổng số $2^{24} = 16\,777\,216$ mức lượng tử</b> bị tiêu sạch trong $1\text{ cm}$ đầu tiên trước ống kính!</p>
        focus: [1, 2, 3, 3]
        say: "Trước hết ta ôn lại hai cơ chế từ bài 5 và bài 11. Thứ nhất, ở bài 5, độ sâu chuẩn hoá biến thiên theo nghịch đảo 1 phần z để giữ tính tuyến tính khi nội suy trên màn hình. Hệ quả là tại khoảng cách bằng 2 lần mặt cắt gần, tức chỉ 2 xăng-ti-mét trước ống kính, độ sâu chuẩn hoá đã vọt lên 0 phẩy 5. Điều đó có nghĩa là một nửa trong tổng số hơn 16 triệu mức lượng tử của bộ đệm 24 bit đã bị tiêu sạch chỉ trong 1 xăng-ti-mét đầu tiên."
      - show: |
          <p><b>② Chi phí băng thông và lệnh vẽ</b> (bài 11): mọi giải pháp sửa lỗi độ sâu đều phải đặt lên bàn cân hiệu năng:</p>
          <p>• Tăng kích thước bộ đệm độ sâu từ $24\text{ bit}$ lên $32\text{ bit}$ có thể làm tăng băng thông đọc/ghi độ sâu.<br>• Vẽ cảnh làm hai lượt riêng biệt (gần và xa) làm <b>tăng số lệnh vẽ</b> trên bộ xử lý trung tâm: vật nằm vắt qua ranh giới hai vùng phải vẽ ở cả hai lượt.</p>
        focus: [1, 2, 2]
        say: "Thứ hai, theo bài 11, mọi phương án kỹ thuật đều có cái giá về hiệu năng thời gian thực. Nếu mở rộng bộ đệm lên 32 bit thì có thể tốn thêm băng thông bộ nhớ. Còn nếu chia thành hai lượt vẽ gần và xa, số lệnh vẽ tăng lên vì vật nằm vắt qua ranh giới phải vẽ ở cả hai lượt."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bước lượng tử độ sâu và điều kiện xảy ra tranh chấp độ sâu"
    checks:
      - "round(alg.gfx_depth_step(1000, 0.01, 10000, 24), 4) == 5.9605"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$n,\; f,\; z$</td><td>khoảng cách mặt cắt gần $n$, mặt cắt xa $f$, và khoảng cách thực $z \in [n, f]$ từ camera (mét)</td></tr>
          <tr><td>$b,\; 2^b$</td><td>số bit của bộ đệm độ sâu nguyên (thường $b = 24 \implies 2^{24} =$ 16&nbsp;777&nbsp;216 mức)</td></tr>
          <tr><td>$s_z(z)$</td><td><b>bước lượng tử độ sâu</b> tại khoảng cách $z$: khoảng cách vật lý nhỏ nhất (mét) để hai bề mặt có mã số khác nhau</td></tr>
          <tr><td>$d_{\text{vật}} < s_z(z)$</td><td>điều kiện nổ ra <b>tranh chấp độ sâu</b> (còn gọi là giành điểm ảnh): hai mặt cách nhau $d_{\text{vật}}$ bị gán cùng một số nguyên nên nhấp nháy</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã bốn ký hiệu chẩn đoán của tình huống. Ba đại lượng n, f và z lần lượt là khoảng cách mặt cắt gần, mặt cắt xa và khoảng cách thực từ camera tính bằng mét. Số nguyên b là độ rộng bit của bộ đệm độ sâu, với 24 bit ta có 16 triệu 777 nghìn 216 mức rời rạc. Bước lượng tử độ sâu s z tại khoảng cách z là khoảng cách vật lý tối thiểu để hai bề mặt nhận được hai mã số nguyên khác nhau. Khi khoảng cách thực giữa hai bức tường nhỏ hơn bước lượng tử này, chúng bị gán cùng một mã độ sâu và gây ra lỗi nhấp nháy."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình cơ chế: dồn vạch chia ở sát mắt làm vùng 1000 m mất sạch vạch chia"
    checks:
      - "round(alg.gfx_depth_step(1000, 0.01, 10000, 24), 2) == 5.96"
      - "round(alg.gfx_depth_step(1000, 0.5, 10000, 24), 2) == 0.12"
