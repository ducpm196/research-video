scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hàng triệu ô điểm ảnh, làm sao biết ô nào nằm trong tam giác?"
    checks:
      - "alg.gfx_barycentric((1, 1), (0, 0), (4, 0), (0, 4)) == (0.5, 0.25, 0.25)"
      - "alg.gfx_barycentric((3, 3), (0, 0), (4, 0), (0, 4)) == (-0.5, 0.75, 0.75)"
      - "alg.gfx_barycentric((2, 2), (0, 0), (4, 0), (0, 4)) == (0.0, 0.5, 0.5)"
    steps:
      - show: |
          <p>Sau phép biến đổi khung nhìn ở bài 3, một tam giác có ba đỉnh tại <b>(0, 0)</b>, <b>(4, 0)</b> và <b>(0, 4)</b> trên lưới điểm ảnh. Máy cần quyết định thật nhanh: điểm <b>(1, 1)</b> có được tô không, còn điểm <b>(3, 3)</b> thì sao?</p>
          <p>Khó hơn nữa, điểm <b>(2, 2)</b> nằm đúng trên đường chéo chung của hai tam giác ghép thành hình vuông — nếu cả hai cùng tô thì bị đè hai lần, nếu cả hai cùng bỏ thì thủng một vệt trắng.</p>
          <div class="box key">Hôm nay: hàm cạnh kiểm trong–ngoài thế nào? Toạ độ trọng tâm là gì? Và quy tắc trên–trái xử lý cạnh chung ra sao?</div>
        focus: [1, 2, 3]
        say: "Chào bạn, sau bước đổi khung nhìn ở bài 3, giả sử một tam giác có ba đỉnh tại 0, 0, tại 4, 0 và tại 0, 4 trên lưới màn hình. Phần cứng cần biết nhanh điểm 1, 1 nằm bên trong còn điểm 3, 3 nằm bên ngoài, đồng thời xử lý điểm 2, 2 trên cạnh chung của hai tam giác. Hôm nay ta học cách kiểm tra điểm trong tam giác bằng hàm cạnh, tính toạ độ trọng tâm để nội suy, và áp dụng quy tắc cạnh trên trái."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại diện tích tam giác, hàm cạnh có dấu và hộp bao chữ nhật"
    checks:
      - "0.5 * (4 * 4 - 0 * 0) == 8.0"
      - "(1 - 0) * (0 - 0) - (1 - 0) * (4 - 0) == -4"
      - "min(0, 4, 0) == 0 and max(0, 4, 0) == 4"
      - "(4 - 0) * (1 - 0) - (0 - 0) * (1 - 0) == 4 and (4 - 0) * (-1 - 0) - (0 - 0) * (1 - 0) == -4"
    steps:
      - show: |
          <p><b>① Diện tích tam giác vuông:</b> tam giác có ba đỉnh $\mathbf{a} = (0, 0),\ \mathbf{b} = (4, 0),\ \mathbf{c} = (0, 4)$ có hai cạnh góc vuông dài $4$ và $4$, nên diện tích là:</p>
          $$S = \frac{1}{2} \cdot 4 \cdot 4 = 8$$
        focus: [1, 2]
        say: "Điều thứ nhất là diện tích của một tam giác vuông trên mặt phẳng toạ độ. Với ba đỉnh tại 0, 0, tại 4, 0 và tại 0, 4, hai cạnh góc vuông đều dài 4 nên diện tích bằng một nửa của 4 nhân 4, tức bằng 8."
      - clear: true
        show: |
          <p><b>② Hàm cạnh có hướng cho biết điểm nằm bên trái hay bên phải cạnh:</b> đi từ đỉnh $(x_0, y_0)$ tới $(x_1, y_1)$, biểu thức tuyến tính tại điểm $\mathbf{p}(x, y)$ là:</p>
          $$E(x, y) = (x_1 - x_0)(y - y_0) - (y_1 - y_0)(x - x_0)$$
          <p class="note">Nếu $\mathbf{p}$ nằm bên trái cạnh có hướng (ngược chiều kim đồng hồ) thì $E \gt 0$; trên cạnh thì $E = 0$; bên phải thì $E \lt 0$.</p>
          <p class="note">Ví dụ cạnh đi từ $(0, 0)$ tới $(4, 0)$: điểm $(1, 1)$ cho $E = 4 \cdot 1 - 0 \cdot 1 = 4 \gt 0$ (bên trái, tức phía trên cạnh); điểm $(1, -1)$ cho $E = 4 \cdot (-1) - 0 = -4 \lt 0$ (bên phải).</p>
        focus: [1, 2, 3, 4]
        say: "Điều thứ hai là hàm cạnh E, một biểu thức bậc nhất tính từ hai đỉnh của cạnh và toạ độ điểm p, cho biết p nằm ở phía nào của cạnh. Công thức lấy hiệu x của hai đỉnh nhân hiệu y của điểm, rồi trừ hiệu y của hai đỉnh nhân hiệu x của điểm. Khi đi dọc cạnh theo chiều ngược kim đồng hồ, điểm bên trái cho E lớn hơn 0, điểm trên cạnh cho E bằng 0, và điểm bên phải cho E nhỏ hơn 0. Ví dụ cạnh từ 0, 0 tới 4, 0, điểm 1, 1 cho E bằng 4 nên nằm bên trái, còn điểm 1, âm 1 cho E bằng âm 4 nên nằm bên phải."
      - show: |
          <p><b>③ Hộp bao chữ nhật:</b> thay vì quét cả màn hình, tầng raster hoá chỉ xét các ô có $x$ từ $\min(x_a, x_b, x_c)$ đến $\max(x_a, x_b, x_c)$ và $y$ tương tự.</p>
        introduces: [min_fn, max_fn]
        focus: [1, 1]
        say: "Điều thứ ba là hộp bao chữ nhật quanh tam giác, dùng giá trị nhỏ nhất và giá trị lớn nhất của toạ độ ba đỉnh. Nhờ hộp bao này, phần cứng chỉ cần kiểm tra các điểm ảnh nằm trong khung chữ nhật từ 0 đến 4 thay vì quét toàn bộ màn hình."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba hàm cạnh và bộ ba toạ độ trọng tâm (an-pha, bê-ta, gam-ma)"
    checks:
      - "alg.gfx_barycentric((1, 1), (0, 0), (4, 0), (0, 4)) == (0.5, 0.25, 0.25)"
      - "0.5 + 0.25 + 0.25 == 1.0"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đối diện đỉnh nào</th><th>ý nghĩa hình học với điểm $\mathbf{p}$</th></tr>
          <tr><td>$E_1,\ \alpha$</td><td>đối diện đỉnh $\mathbf{a}$ (cạnh $\mathbf{b} \to \mathbf{c}$)</td><td>$\alpha = \frac{S_1}{S}$: trọng số của đỉnh $\mathbf{a}$</td></tr>
          <tr><td>$E_2,\ \beta$</td><td>đối diện đỉnh $\mathbf{b}$ (cạnh $\mathbf{c} \to \mathbf{a}$)</td><td>$\beta = \frac{S_2}{S}$: trọng số của đỉnh $\mathbf{b}$</td></tr>
          <tr><td>$E_3,\ \gamma$</td><td>đối diện đỉnh $\mathbf{c}$ (cạnh $\mathbf{a} \to \mathbf{b}$)</td><td>$\gamma = \frac{S_3}{S}$: trọng số của đỉnh $\mathbf{c}$</td></tr></table>
        introduces: [alpha, beta, gamma]
        focus: ["1.2", "1.3", "1.4"]
        say: "Bảng trên giải mã ba hàm cạnh và ba chữ Hy Lạp an-pha, bê-ta, gam-ma gọi là toạ độ trọng tâm của điểm p. Trọng số an-pha gắn với đỉnh a bằng tỉ số diện tích có dấu của tam giác con S một đối diện đỉnh a trên diện tích tam giác lớn S. Tương tự, bê-ta bằng S hai chia S gắn với đỉnh b, và gam-ma bằng S ba chia S gắn với đỉnh c."
      - clear: true
        show: |
          <p>Ba toạ độ trọng tâm $(\alpha, \beta, \gamma)$ luôn có tổng bằng $1$ và cho phép biểu diễn vị trí cũng như nội suy mọi thuộc tính $V$ (màu, độ sâu) từ ba đỉnh:</p>
          $$\alpha + \beta + \gamma = 1, \qquad \mathbf{p} = \alpha\mathbf{a} + \beta\mathbf{b} + \gamma\mathbf{c}, \qquad V_p = \alpha V_a + \beta V_b + \gamma V_c$$
          <p class="note">Điểm $\mathbf{p}$ nằm trong (hoặc trên biên) tam giác khi và chỉ khi $\alpha \ge 0,\ \beta \ge 0$ và $\gamma \ge 0$.</p>
          <p class="note">Trọng số tính trên màn hình dùng thẳng được cho độ sâu chuẩn hoá; còn màu hay toạ độ kết cấu gắn với bề mặt ba chiều thì cần thêm hiệu chỉnh phối cảnh theo $\frac{1}{z}$ như bài 2.</p>
        focus: [1, 2, 3, 4, 4]
        say: "Vì tổng diện tích có dấu của ba tam giác con luôn bằng đúng diện tích tam giác lớn, nên tổng an-pha cộng bê-ta cộng gam-ma luôn bằng 1. Ta dùng chính bộ ba trọng số này để pha trộn màu sắc hoặc độ sâu từ ba đỉnh theo công thức an-pha nhân V a cộng bê-ta nhân V b cộng gam-ma nhân V c. Điểm p nằm trong tam giác khi và chỉ khi cả ba trọng số đều không âm. Lưu ý, trọng số tính trên màn hình dùng thẳng được cho độ sâu chuẩn hoá. Còn màu hay toạ độ kết cấu gắn với bề mặt thì cần thêm hiệu chỉnh phối cảnh theo 1 chia z như bài 2."

