  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra ba hàm cạnh và bước nhảy hằng số giữa hai điểm ảnh"
    checks:
      - "16 - 4 * 1 - 4 * 1 == 8"
      - "4 * 1 == 4 and 4 * 1 == 4"
      - "(8 / 16, 4 / 16, 4 / 16) == alg.gfx_barycentric((1, 1), (0, 0), (4, 0), (0, 4))"
    steps:
      - show: |
          <p><b>Bước 1 — Viết tường minh ba hàm cạnh cho tam giác $\mathbf{a}(0, 0),\ \mathbf{b}(4, 0),\ \mathbf{c}(0, 4)$:</b></p>
          <p>Hai lần diện tích tam giác lớn là $2S = 4 \cdot 4 = 16$. Ba hàm cạnh tại điểm $(x, y)$ là:</p>
          $$E_1(x, y) = 16 - 4x - 4y, \qquad E_2(x, y) = 4x, \qquad E_3(x, y) = 4y$$
        focus: [1, 2, 3]
        say: "Bước một, ta lập ba hàm cạnh cho tam giác có đỉnh tại 0, 0, tại 4, 0 và tại 0, 4. Hai lần diện tích tam giác lớn bằng 4 nhân 4 bằng 16. Thay toạ độ các đỉnh vào công thức, ta được E một bằng 16 trừ 4 x trừ 4 y, E hai bằng 4 x, và E ba bằng 4 y."
      - show: |
          <p><b>Bước 2 — Suy ra toạ độ trọng tâm bằng cách chia cho $2S = 16$:</b></p>
          $$\alpha = \frac{E_1(x, y)}{16} = 1 - \frac{x + y}{4}, \qquad \beta = \frac{E_2(x, y)}{16} = \frac{x}{4}, \qquad \gamma = \frac{E_3(x, y)}{16} = \frac{y}{4}$$
          <p class="note">Vì hàm cạnh có dạng $A \cdot x + B \cdot y + C$, khi dịch sang điểm ảnh kế bên ($x + 1$) phần cứng chỉ tốn <b>một phép cộng</b> thêm $A$!</p>
        focus: [2, 3]
        say: "Bước hai, vì mỗi hàm cạnh bằng đúng hai lần diện tích tam giác con tương ứng, ta chia cả ba hàm cạnh cho 16 để thu được an-pha, bê-ta và gam-ma. Do hàm cạnh có dạng bậc nhất theo x và y, khi dịch sang điểm ảnh kế bên theo chiều ngang, phần cứng chỉ cần cộng thêm hệ số A mà không phải nhân lại."

  # ───────────────────────── 6. VÍ DỤ BẰNG SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Kiểm điểm (1, 1) và (3, 3), rồi nội suy độ sâu tại (1, 1)"
    checks:
      - "alg.gfx_barycentric((1, 1), (0, 0), (4, 0), (0, 4)) == (0.5, 0.25, 0.25)"
      - "0.5 + 0.25 + 0.25 == 1.0"
      - "alg.gfx_barycentric((3, 3), (0, 0), (4, 0), (0, 4)) == (-0.5, 0.75, 0.75)"
      - "0.5 * 2.0 + 0.25 * 4.0 + 0.25 * 6.0 == 3.5"
    steps:
      - show: |
          <p>Xét tam giác $\mathbf{a}(0, 0),\ \mathbf{b}(4, 0),\ \mathbf{c}(0, 4)$.</p>
          <p><b>Bước 1 — Tính toạ độ trọng tâm cho điểm $\mathbf{p}_1 = (1, 1)$:</b></p>
          $$\alpha = 1 - \frac{1 + 1}{4} = \hlg{0{,}5}, \qquad \beta = \frac{1}{4} = \hlg{0{,}25}, \qquad \gamma = \frac{1}{4} = \hlg{0{,}25}$$
          <p class="note">Tổng $0{,}5 + 0{,}25 + 0{,}25 = 1$, cả ba đều dương $\implies \mathbf{p}_1(1, 1)$ nằm <b>bên trong</b> tam giác.</p>
        focus: [1, 2, 3, 4]
        say: "Ta thay số cụ thể cho tam giác 0, 0, 4, 0 và 0, 4. Bước một, xét điểm p một tại 1, 1. Thay x bằng 1 và y bằng 1 vào công thức, ta được an-pha bằng 0 phẩy 5, bê-ta bằng 0 phẩy 25 và gam-ma bằng 0 phẩy 25. Tổng của ba số đúng bằng 1 và cả ba đều dương, nên điểm 1, 1 nằm bên trong tam giác."
      - show: |
          <p><b>Bước 2 — Tính toạ độ trọng tâm cho điểm $\mathbf{p}_2 = (3, 3)$:</b></p>
          $$\alpha = 1 - \frac{3 + 3}{4} = \hl{-0{,}5}, \qquad \beta = \frac{3}{4} = 0{,}75, \qquad \gamma = \frac{3}{4} = 0{,}75$$
          <p class="note">Tổng vẫn bằng $-0{,}5 + 0{,}75 + 0{,}75 = 1$, nhưng $\alpha = -0{,}5 \lt 0 \implies \mathbf{p}_2(3, 3)$ nằm <b>bên ngoài</b> tam giác.</p>
        focus: [1, 2, 3]
        say: "Bước hai, xét điểm p hai tại toạ độ 3, 3. Thay x bằng 3 và y bằng 3 vào, ta được an-pha bằng âm 0 phẩy 5, bê-ta bằng 0 phẩy 75 và gam-ma bằng 0 phẩy 75. Dù tổng ba số vẫn bằng 1, trọng số an-pha mang dấu âm chứng tỏ điểm 3, 3 đã vượt ra ngoài cạnh b c và không thuộc tam giác."
      - clear: true
        show: |
          <p><b>Bước 3 — Nội suy thuộc tính tại điểm $\mathbf{p}_1(1, 1)$:</b></p>
          <p>Giả sử ba đỉnh có giá trị thuộc tính $V_a = 2,\ V_b = 4,\ V_c = 6$. Tại $\mathbf{p}_1(1, 1)$ với $(\alpha, \beta, \gamma) = (0{,}5;\ 0{,}25;\ 0{,}25)$:</p>
          $$V_p = 0{,}5 \cdot 2 + 0{,}25 \cdot 4 + 0{,}25 \cdot 6 = 1 + 1 + 1{,}5 = \hlb{3{,}5}$$
        focus: [1, 2, 3]
        say: "Bước ba, ta dùng bộ trọng số 0 phẩy 5, 0 phẩy 25, 0 phẩy 25 vừa tìm được để nội suy thuộc tính tại điểm 1, 1. Với ba đỉnh mang giá trị lần lượt là 2, 4 và 6, ta lấy 0 phẩy 5 nhân 2 cộng 0 phẩy 25 nhân 4 cộng 0 phẩy 25 nhân 6. Cộng ba tích 1, 1 và 1 phẩy 5 lại, ta thu được giá trị nội suy bằng 3 phẩy 5."

  # ───────────────────────── 7. TỰ KIỂM BẰNG ĐƯỜNG KHÁC ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm lại bằng tổ hợp toạ độ đỉnh và cộng diện tích ba tam giác con"
    checks:
      - "(0.5 * 0 + 0.25 * 4 + 0.25 * 0, 0.5 * 0 + 0.25 * 0 + 0.25 * 4) == (1.0, 1.0)"
      - "(-0.5 * 0 + 0.75 * 4 + 0.75 * 0, -0.5 * 0 + 0.75 * 0 + 0.75 * 4) == (3.0, 3.0)"
      - "4.0 + 2.0 + 2.0 == 8.0"
    steps:
      - show: |
          <p><b>Đường khác 1 — Nhân ngược trọng tâm với toạ độ ba đỉnh để khôi phục điểm $\mathbf{p}$:</b></p>
          $$\alpha\mathbf{a} + \beta\mathbf{b} + \gamma\mathbf{c} = 0{,}5 \cdot (0, 0) + 0{,}25 \cdot (4, 0) + 0{,}25 \cdot (0, 4) = (1, 0) + (0, 1) = (1, 1)\ \checkmark$$
        focus: [1, 2]
        say: "Ta kiểm tra lại bằng cách nhân ngược các trọng số với toạ độ của ba đỉnh a, b, c. Vì 0 phẩy 5 nhân đỉnh 0, 0 cộng 0 phẩy 25 nhân đỉnh 4, 0 cộng 0 phẩy 25 nhân đỉnh 0, 4 bằng đúng điểm 1, 1, bộ trọng số vừa tính hoàn toàn chính xác."
      - show: |
          <p><b>Đường khác 2 — Tính diện tích hình học của ba tam giác con quanh điểm $(1, 1)$:</b></p>
          <p>• Tam giác $pab$ có đáy $4$, chiều cao $y = 1 \implies S_3 = \frac{1}{2} \cdot 4 \cdot 1 = 2 \implies \gamma = \frac{2}{8} = 0{,}25$ ✓.<br>
          • Tam giác $pca$ có đáy $4$, chiều cao $x = 1 \implies S_2 = \frac{1}{2} \cdot 4 \cdot 1 = 2 \implies \beta = \frac{2}{8} = 0{,}25$ ✓.<br>
          • Phần còn lại $S_1 = 8 - 2 - 2 = 4 \implies \alpha = \frac{4}{8} = 0{,}5$ ✓.</p>
        focus: [1, 2, 2, 2]
        say: "Cách kiểm thứ hai là tính diện tích từng tam giác con bằng công thức đáy nhân chiều cao chia đôi. Tam giác p a b có đáy 4 và chiều cao 1 nên diện tích bằng 2, chia cho tổng diện tích 8 ra gam-ma bằng 0 phẩy 25. Tam giác p c a cũng có đáy 4 và chiều cao 1 nên diện tích bằng 2 và bê-ta bằng 0 phẩy 25. Phần diện tích còn lại của tam giác p b c là 8 trừ 2 trừ 2 bằng 4, chia 8 ra đúng an-pha bằng 0 phẩy 5."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi raster hoá tam giác"
    checks:
      - "alg.gfx_barycentric((2, 2), (0, 0), (4, 0), (0, 4)) == (0.0, 0.5, 0.5)"
      - "(-16 == -(4 * 4)) and (16 == 4 * 4)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Dùng điều kiện $E \ge 0$ cho mọi cạnh mà thiếu quy tắc trên–trái <b class="red">(điểm ảnh trên cạnh chung bị tô đè hai lần)</b></div>
          <table class="t"><tr><th>loại cạnh (khi đi ngược chiều kim đồng hồ)</th><th>định nghĩa</th><th>khi $E = 0$ (nằm đúng trên cạnh)</th></tr>
          <tr><td><b>Cạnh trên</b></td><td>cạnh nằm ngang và ở phía trên tam giác</td><td>được nhận (vẽ)</td></tr>
          <tr><td><b>Cạnh trái</b></td><td>cạnh đi xuống theo chiều ngược kim đồng hồ</td><td>được nhận (vẽ)</td></tr>
          <tr><td>Cạnh phải hoặc cạnh dưới</td><td>cạnh đi lên hoặc nằm ngang ở đáy</td><td><b>bỏ qua</b> (nhường cho tam giác kề bên)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi đầu tiên của người đi làm là dùng dấu lớn hơn hoặc bằng 0 cho cả ba cạnh của mọi tam giác. Khi đó điểm ảnh nằm ngay trên cạnh chung có hàm cạnh bằng 0 sẽ bị cả hai tam giác kề nhau nhận vẽ, gây chớp nháy hoặc đè màu. Vì vậy phần cứng dùng quy tắc trên trái: khi E bằng 0, chỉ nhận nếu đó là cạnh ngang phía trên hoặc cạnh bên trái đi xuống."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Ngược thứ tự đỉnh theo chiều kim đồng hồ <b class="red">(ba hàm cạnh đổi dấu âm làm tam giác biến mất)</b>
          <br><span class="note">Nếu khai báo đỉnh theo thứ tự $\mathbf{a} \to \mathbf{c} \to \mathbf{b}$ (cùng chiều kim đồng hồ), diện tích có dấu thành $-16$ và mọi điểm bên trong đều có $E \lt 0$. Khi bật chế độ loại mặt sau (tắt sẵn trong một số giao diện lập trình, như OpenGL), phần cứng dùng đúng dấu này để bỏ mặt quay lưng về phía camera.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là khai báo thứ tự ba đỉnh ngược chiều quy ước khiến hàm cạnh đổi dấu. Khi đỉnh xếp theo chiều kim đồng hồ, diện tích có dấu thành âm và mọi điểm bên trong đều có E âm. Nếu chế độ loại mặt sau đang bật, phần cứng coi đó là mặt sau và bỏ qua, nên tam giác biến mất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Kiểm tra tại góc ô thay vì tâm điểm ảnh $(i + 0{,}5,\ j + 0{,}5)$ <b class="red">(hình tam giác bị lệch nửa điểm ảnh)</b></div>
          $$(x_{\text{tâm}},\ y_{\text{tâm}}) = (i + 0{,}5,\ j + 0{,}5)$$
        focus: [1, 2]
        say: "Lỗi thứ ba là lấy toạ độ nguyên của góc ô thay vì tâm của ô điểm ảnh khi tính hàm cạnh. Mỗi ô thứ i, j có tâm nằm tại i cộng 0 phẩy 5 và j cộng 0 phẩy 5, nên tính hàm cạnh tại tâm ô mới tránh được độ lệch nửa điểm ảnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tam giác suy biến có ba đỉnh thẳng hàng <b class="red">(diện tích $S = 0$ gây chia cho $0$ khi tính trọng tâm)</b>
          <br><span class="note">Khi ba đỉnh nằm trên một đường thẳng thì $2S = 0$, tam giác không có diện tích nên phải bị loại bỏ ngay trước khi chia tìm $(\alpha, \beta, \gamma)$.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ tư là quên kiểm tra tam giác suy biến có ba đỉnh thẳng hàng trước khi chia cho diện tích. Khi ba đỉnh thẳng hàng thì diện tích tam giác bằng 0 và không chứa tâm điểm ảnh nào, nên cần kiểm tra diện tích khác 0 trước khi tính toạ độ trọng tâm."

  # ───────────────────────── 9. TỰ LÀM (QUIZ) ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: tính toạ độ trọng tâm và nội suy màu"
    checks:
      - "alg.gfx_barycentric((2, 1), (0, 0), (4, 0), (0, 4)) == (0.25, 0.5, 0.25)"
      - "alg.gfx_barycentric((2, 2), (0, 0), (4, 0), (0, 4)) == (0.0, 0.5, 0.5)"
      - "0.25 * 100 + 0.5 * 200 + 0.25 * 60 == 140.0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>nội dung câu hỏi</th></tr>
          <tr><td>1</td><td>Vẫn với tam giác $\mathbf{a}(0, 0),\ \mathbf{b}(4, 0),\ \mathbf{c}(0, 4)$, hãy tính toạ độ trọng tâm $(\alpha, \beta, \gamma)$ của điểm $\mathbf{p} = (2, 1)$. Điểm này nằm trong hay ngoài tam giác?</td></tr>
          <tr><td>2</td><td>Nếu độ sáng tại ba đỉnh là $I_a = 100,\ I_b = 200,\ I_c = 60$, độ sáng nội suy tại điểm $\mathbf{p} = (2, 1)$ bằng bao nhiêu?</td></tr>
          <tr><td>3</td><td>Tại điểm $\mathbf{q} = (2, 2)$, bộ toạ độ trọng tâm $(\alpha, \beta, \gamma)$ bằng bao nhiêu và vì sao biết ngay điểm đó nằm trên cạnh $\mathbf{b}\mathbf{c}$?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự giải ba câu hỏi. Câu một, với tam giác 0, 0, 4, 0 và 0, 4, hãy tính toạ độ trọng tâm an-pha, bê-ta, gam-ma của điểm 2, 1. Câu hai, nếu độ sáng ba đỉnh là 100, 200 và 60 thì độ sáng nội suy tại điểm 2, 1 bằng bao nhiêu? Câu ba, tại điểm 2, 2 thì toạ độ trọng tâm bằng bao nhiêu và vì sao biết nó nằm trên cạnh b c? Hãy dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1 (tại điểm $(2, 1)$):</b></p>
          $$\alpha = 1 - \frac{2 + 1}{4} = \hlg{0{,}25}, \qquad \beta = \frac{2}{4} = \hlg{0{,}5}, \qquad \gamma = \frac{1}{4} = \hlg{0{,}25}$$
          <p>Cả ba đều dương và có tổng bằng $1 \implies (2, 1)$ nằm <b>bên trong</b> tam giác.</p>
          <p><b>Đáp án câu 2 (nội suy độ sáng tại $(2, 1)$):</b></p>
          $$I_p = 0{,}25 \cdot 100 + 0{,}5 \cdot 200 + 0{,}25 \cdot 60 = 25 + 100 + 15 = \hlb{140}$$
        focus: [1, 2, 5]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Thay x bằng 2 và y bằng 1 vào công thức, ta được bộ trọng số 0 phẩy 25, 0 phẩy 5 và 0 phẩy 25 đều dương, nên điểm 2, 1 nằm bên trong tam giác. Ở câu hai, lấy 0 phẩy 25 nhân 100 cộng 0 phẩy 5 nhân 200 cộng 0 phẩy 25 nhân 60, ta được 25 cộng 100 cộng 15 bằng 140."
      - show: |
          <p><b>Đáp án câu 3 (tại điểm $\mathbf{q} = (2, 2)$):</b></p>
          $$(\alpha,\ \beta,\ \gamma) = \left(1 - \frac{2 + 2}{4},\ \frac{2}{4},\ \frac{2}{4}\right) = \hlo{(0;\ 0{,}5;\ 0{,}5)}$$
          <p class="note">Vì $\alpha = 0$ (diện tích tam giác con đối diện đỉnh $\mathbf{a}$ bằng $0$) còn $\beta = 0{,}5 \gt 0,\ \gamma = 0{,}5 \gt 0$, điểm $(2, 2)$ nằm ngay chính giữa cạnh $\mathbf{b}\mathbf{c}$.</p>
        focus: [2, 3]
        say: "Ở câu ba, tại điểm 2, 2 ta tính được bộ trọng số là 0, 0 phẩy 5 và 0 phẩy 5. Vì an-pha bằng 0 còn bê-ta và gam-ma đều bằng 0 phẩy 5, diện tích tam giác con đối diện đỉnh a bằng 0 nên điểm 2, 2 nằm chính giữa cạnh b c."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy raster hoá tam giác"
    steps:
      - show: |
          <div class="chain"><span class="n">Hộp bao chữ nhật</span><span class="a">→</span>
          <span class="n">Ba hàm cạnh tuyến tính</span><span class="a">→</span>
          <span class="n">Cùng không âm (+ quy tắc trên–trái)</span><span class="a">→</span>
          <span class="n">Trọng tâm $(\alpha, \beta, \gamma)$</span><span class="a">→</span>
          <span class="n">Nội suy màu &amp; độ sâu</span></div>
          <div class="box key"><b>Tư duy cốt lõi:</b> hàm cạnh biến bài toán hình học “điểm nằm trong tam giác” thành ba phép cộng tuyến tính chạy song song cho từng ô điểm ảnh, đồng thời cho luôn bộ trọng số $(\alpha, \beta, \gamma)$ để nội suy.</div>
        focus: [1, 2]
        say: "Tổng kết lại, tầng raster hoá giới hạn vùng quét bằng hộp bao, tính ba hàm cạnh tuyến tính cho từng tâm điểm ảnh, và dùng quy tắc trên trái để xử lý cạnh chung. Chia ba hàm cạnh cho hai lần diện tích tam giác cho ta ngay bộ toạ độ trọng tâm an-pha, bê-ta, gam-ma để nội suy mọi thuộc tính từ ba đỉnh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>Bộ đệm độ sâu: độ chính xác không đều và hiện tượng giành điểm ảnh</b> — khi hai tam giác cùng phủ lên một điểm ảnh, làm sao biết mặt nào che mặt nào và vì sao hai mặt ở xa dễ bị nhấp nháy?</p>
        forward_ref: true
        focus: [1]
        say: "Ở bài sau, bài 5, ta sẽ tìm hiểu bộ đệm độ sâu để giải quyết bài toán che khuất giữa các tam giác và lý giải hiện tượng giành điểm ảnh."
