scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Làm sao biết một vật che khuất nguồn sáng hay phản chiếu vật khác?"
    checks:
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 0, 1), (0, 0, 5), 1) == (4.0, [4.0, 6.0])"
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 1, 0), (0, 0, 5), 1) == (-96.0, [])"
    steps:
      - show: |
          <p>Ở bài 4 đến bài 6, đường ống raster hoá vẽ từng tam giác độc lập nên không tự biết một quả cầu có <b>chặn ánh sáng</b> đổ bóng lên mặt sàn hay <b>phản chiếu</b> quả cầu bên cạnh hay không.</p>
          <div class="box key">Hôm nay: đảo ngược chiều suy nghĩ bằng <b>dò tia</b> — bắn một tia từ gốc $(0,0,0)$ dọc hướng $(0,0,1)$ vào mặt cầu tâm $(0,0,5)$ bán kính $1$ để tìm hai nghiệm $t = 4$ và $t = 6$, chọn điểm chạm gần nhất <b>$t = 4$</b>, rồi bắn tiếp tia bóng đổ và tia phản xạ!</div>
        focus: [1, 2, 2]
        say: "Chào bạn, ở bài 4 đến bài 6, đường ống raster hoá xét từng tam giác độc lập nên không tự biết vật này có đổ bóng hay phản chiếu vật kia không. Hôm nay ta học kỹ thuật dò tia, bắn một tia từ gốc toạ độ dọc trục z vào mặt cầu tâm 0, 0, 5 bán kính 1. Ta sẽ giải phương trình bậc hai ra hai nghiệm t bằng 4 và t bằng 6, chọn điểm chạm gần nhất t bằng 4, rồi bắn tiếp tia bóng đổ và tia phản xạ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tích vô hướng, bình phương độ dài vector và phương trình bậc hai"
    checks:
      - "sum(x * x for x in (0, 0, -5)) == 25"
      - "(-10) ** 2 - 4 * 1 * 24 == 4"
    steps:
      - show: |
          <p><b>① Tích vô hướng và bình phương độ dài</b> (bài 1 và bài 6): với hai vector $\vec{u}, \vec{v}$, tích vô hướng $\vec{u} \cdot \vec{v} = u_x v_x + u_y v_y + u_z v_z$ có tính phân phối, và bình phương độ dài chính là tích vô hướng của vector với chính nó:</p>
          $$\|\vec{u}\|^2 = \vec{u} \cdot \vec{u}, \qquad \|\vec{u} + t\,\vec{v}\|^2 = (\vec{v}\cdot\vec{v})\,t^2 + 2(\vec{u}\cdot\vec{v})\,t + (\vec{u}\cdot\vec{u})$$
        focus: [1, 1, 2]
        say: "Trước hết ta ôn lại hai công cụ toán học nền tảng. Công cụ thứ nhất từ bài 1 và bài 6 là tích vô hướng của một vector với chính nó bằng đúng bình phương độ dài của vector đó. Do tích vô hướng có tính phân phối như phép nhân đa thức, bình phương độ dài của tổng u cộng t nhân v khai triển ra thành một tam thức bậc hai theo biến số t."
      - show: |
          <p><b>② Phương trình bậc hai</b> (khoá Giải tích và đại số, phần phương trình bậc hai): phương trình $a\,t^2 + b\,t + c = 0$ ($a \neq 0$) có biệt thức $\Delta = b^2 - 4ac$:</p>
          <p class="note">Nếu $\Delta < 0$: vô nghiệm thực (tia trượt ra ngoài). Nếu $\Delta \ge 0$: có nghiệm $t = \frac{-b \pm \sqrt{\Delta}}{2a}$.</p>
        introduces: [neq]
        focus: [1, 2, 2]
        say: "Công cụ thứ hai từ khoá Giải tích và đại số là công thức nghiệm của phương trình bậc hai a nhân t bình phương cộng b nhân t cộng c bằng 0. Ta tính biệt thức bằng b bình phương trừ 4 lần a nhân c. Nếu biệt thức âm thì phương trình vô nghiệm thực nên tia trượt ra ngoài, còn nếu biệt thức không âm thì có nghiệm bằng trừ b cộng trừ căn biệt thức chia 2 lần a."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: phương trình tia, mặt cầu và ba loại tia trong cảnh"
    checks:
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 0, 1), (0, 0, 5), 1)[1][0] == 4.0"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$\vec{p}(t) = \vec{o} + t\,\vec{d} \;\; (t > 0)$</td><td>phương trình tham số của tia xuất phát từ gốc $\vec{o}$, đi theo hướng $\vec{d}$ với khoảng tham số dương $t$</td></tr>
          <tr><td>$\vec{c},\; r$</td><td>tâm $\vec{c}$ và bán kính $r > 0$ của mặt cầu: điểm $\vec{p}$ nằm trên mặt cầu khi $\|\vec{p} - \vec{c}\|^2 = r^2$</td></tr>
          <tr><td>$\mathbf{n} = \frac{\vec{p} - \vec{c}}{r}$</td><td>vector pháp tuyến đơn vị hướng ra ngoài mặt cầu tại điểm chạm $\vec{p}$</td></tr>
          <tr><td><b>tia chính, tia bóng đổ, tia phản xạ</b></td><td>tia từ mắt qua điểm ảnh; tia từ điểm chạm hướng tới đèn; tia bật ngược như gương theo góc phản xạ bằng góc tới</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giải mã bốn nhóm ký hiệu và khái niệm của bài học. Một tia sáng xuất phát từ điểm gốc o đi theo vector hướng d được viết là p theo t bằng o cộng t nhân d với tham số t dương. Mặt cầu có tâm c và bán kính r gồm mọi điểm p cách tâm một khoảng bằng r. Tại điểm chạm p trên mặt cầu, pháp tuyến đơn vị hướng ra ngoài bằng hiệu p trừ c chia cho r. Trong thuật toán dò tia đệ quy, từ điểm chạm của tia chính ta bắn thêm tia bóng đổ tới đèn và tia phản xạ gương vào cảnh."

