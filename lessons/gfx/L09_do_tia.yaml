  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra phương trình bậc hai giao tia với cầu, tia bóng đổ và tia phản xạ"
    checks:
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 0, 1), (0, 0, 5), 1) == (4.0, [4.0, 6.0])"
      - "tuple(d - 2 * (0 * (-1) + 0 * 0 + 1 * 0) * n for d, n in zip((0, 0, 1), (-1, 0, 0))) == (0, 0, 1)"
    steps:
      - show: |
          <p><b>Bước 1 — thay phương trình tia vào phương trình mặt cầu.</b> Đặt vector nối từ tâm cầu tới gốc tia là $\vec{m} = \vec{o} - \vec{c}$. Thay $\vec{p}(t) = \vec{o} + t\,\vec{d}$ vào $\|\vec{p}(t) - \vec{c}\|^2 = r^2$:</p>
          $$\|\vec{m} + t\,\vec{d}\|^2 = r^2 \iff (\vec{d}\cdot\vec{d})\,t^2 + 2(\vec{m}\cdot\vec{d})\,t + (\vec{m}\cdot\vec{m} - r^2) = 0$$
          <p class="note">Đây là phương trình bậc hai $a\,t^2 + b\,t + c_0 = 0$ với $a = \vec{d}\cdot\vec{d}$, $b = 2(\vec{m}\cdot\vec{d})$, $c_0 = \vec{m}\cdot\vec{m} - r^2$.</p>
        introduces: [iff]
        focus: [1, 1, 2, 3]
        say: "Bước một, ta suy ra phương trình tìm giao điểm giữa tia và mặt cầu. Đặt vector phụ m bằng gốc tia o trừ tâm cầu c, rồi thay phương trình tia vào điều kiện khoảng cách tới tâm bằng bán kính r. Khai triển bình phương độ dài của m cộng t nhân d, ta thu được phương trình bậc hai theo ẩn t. Trong đó a bằng tích vô hướng của d với d, b bằng 2 lần tích vô hướng của m với d, và c không bằng m nhân vô hướng m trừ r bình phương."
      - show: |
          <p><b>Bước 2 — biện luận nghiệm theo biệt thức $\Delta = b^2 - 4a c_0$:</b></p>
          <p>• Nếu $\Delta < 0$: tia không cắt mặt cầu.<br>• Nếu $\Delta \ge 0$: giải $t_1 \le t_2 = \frac{-b \pm \sqrt{\Delta}}{2a}$, rồi chọn <b>nghiệm dương nhỏ nhất</b> $t > 0$ (vì $t < 0$ nằm phía sau lưng camera, còn $t_2$ lớn hơn nằm ở mặt khuất phía sau).</p>
        focus: [1, 2, 2]
        say: "Bước hai, ta tính biệt thức bằng b bình phương trừ 4 lần a nhân hằng số tự do để biện luận. Vì biệt thức âm ứng với phương trình vô nghiệm nên tia đi trượt ra ngoài mặt cầu. Khi biệt thức không âm, ta giải hai nghiệm rồi chọn nghiệm dương nhỏ nhất vì nghiệm âm nằm sau lưng camera còn nghiệm lớn hơn là điểm xuyên ra ở mặt sau."
      - clear: true
        introduces: [epsilon]
        show: |
          <p><b>Bước 3 — bắn tia thứ cấp từ điểm chạm $\vec{p} = \vec{o} + t\,\vec{d}$ với pháp tuyến đơn vị $\mathbf{n}$:</b></p>
          <p>• <b>Gốc tia thứ cấp dịch nhẹ</b> $\vec{p}_{\varepsilon} = \vec{p} + \varepsilon\,\mathbf{n}$ (với $\varepsilon \approx 10^{-4}$) để không tự va vào chính mặt vừa chạm.<br>• <b>Tia bóng đổ:</b> bắn từ $\vec{p}_{\varepsilon}$ hướng tới đèn; nếu cắt vật cản trước khi tới đèn thì điểm $\vec{p}$ nằm trong bóng tối.<br>• <b>Hướng tia phản xạ gương</b> của tia tới đơn vị $\mathbf{d}$:</p>
          $$\vec{r} = \mathbf{d} - 2(\mathbf{d}\cdot\mathbf{n})\,\mathbf{n}$$
        focus: [1, 2, 3]
        say: "Bước ba, từ điểm chạm p với pháp tuyến đơn vị n, ta sinh các tia thứ cấp theo mô hình dò tia đệ quy. Trước khi bắn, ta dịch gốc tia ra ngoài một khoảng nhỏ dọc theo pháp tuyến để tia không tự cắt lại chính bề mặt vừa chạm. Tia bóng đổ bắn về phía đèn để tìm vật cản, còn tia phản xạ gương đi theo hướng d trừ 2 lần tích vô hướng của d và n nhân với n."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính tay: tia cắt mặt cầu tại t = 4, tia trượt và vector phản xạ"
    checks:
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 0, 1), (0, 0, 5), 1) == (4.0, [4.0, 6.0])"
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 1, 0), (0, 0, 5), 1) == (-96.0, [])"
      - "tuple(round(d - 2 * (-0.6 * 0 + (-0.8) * 1 + 0 * 0) * n, 2) for d, n in zip((-0.6, -0.8, 0.0), (0.0, 1.0, 0.0))) == (-0.6, 0.8, 0.0)"
    steps:
      - show: |
          <p><b>Phép tính 1 — tia từ $\vec{o} = (0,0,0)$ hướng $\vec{d} = (0,0,1)$ bắn vào mặt cầu tâm $\vec{c} = (0,0,5)$, bán kính $r = 1$:</b></p>
          <p>Vector phụ $\vec{m} = \vec{o} - \vec{c} = (0, 0, -5)$. Tính ba hệ số bậc hai:</p>
          $$a = \vec{d}\cdot\vec{d} = 1, \qquad b = 2(\vec{m}\cdot\vec{d}) = 2(0 + 0 - 5) = -10, \qquad c_0 = \vec{m}\cdot\vec{m} - r^2 = 25 - 1 = 24$$
          $$\Delta = (-10)^2 - 4\cdot 1\cdot 24 = 100 - 96 = \hlg{4 > 0} \implies t = \frac{10 \pm \sqrt{4}}{2} = \frac{10 \pm 2}{2} \in \{\hlg{4},\; 6\}$$
          <p class="note">Chọn nghiệm dương nhỏ nhất $t = 4 \implies$ điểm chạm gần nhất là $\vec{p}(4) = (0, 0, 4)$, pháp tuyến $\mathbf{n} = \frac{(0,0,4) - (0,0,5)}{1} = (0, 0, -1)$.</p>
        focus: [1, [2, 3], 4, 5]
        say: "Ta làm phép tính thứ nhất với tia xuất phát từ gốc 0, 0, 0 đi theo hướng 0, 0, 1 vào mặt cầu tâm 0, 0, 5 bán kính 1. Hiệu gốc tia trừ tâm cầu cho vector m bằng 0, 0, trừ 5, nên hệ số a bằng 1, hệ số b bằng trừ 10, và hằng số tự do bằng 25 trừ 1 bằng 24. Biệt thức bằng 100 trừ 96 bằng 4 dương, giải ra hai nghiệm là 10 trừ 2 chia 2 bằng 4 và 10 cộng 2 chia 2 bằng 6. Ta chọn nghiệm dương nhỏ nhất t bằng 4, suy ra điểm chạm gần nhất tại 0, 0, 4 và pháp tuyến hướng ngược về gốc là 0, 0, trừ 1."
      - clear: true
        show: |
          <p><b>Phép tính 2 — đổi hướng tia sang $\vec{d} = (0, 1, 0)$ (nhìn thẳng lên trời) với cùng mặt cầu:</b></p>
          $$a = 1, \qquad b = 2\,\big((0, 0, -5)\cdot(0, 1, 0)\big) = 0, \qquad c_0 = 24$$
          $$\Delta = 0^2 - 4\cdot 1\cdot 24 = \hlo{-96 < 0} \implies \text{vô nghiệm (tia không cắt mặt cầu)}$$
        focus: [1, 2, 3]
        say: "Phép tính thứ hai giữ nguyên gốc tia và mặt cầu nhưng đổi hướng tia sang 0, 1, 0 tức nhìn thẳng lên trục y. Khi đó tích vô hướng giữa m và d bằng 0 nên hệ số b bằng 0, còn a vẫn bằng 1 và hằng số tự do bằng 24. Biệt thức bằng 0 trừ 96 bằng âm 96 nhỏ hơn 0, chứng tỏ tia đi trượt hoàn toàn khỏi mặt cầu."
      - show: |
          <p><b>Phép tính 3 — hướng phản xạ gương:</b> giả sử tia tới đơn vị $\mathbf{d} = (-0{,}6;\; -0{,}8;\; 0)$ đập vào mặt sàn có pháp tuyến $\mathbf{n} = (0, 1, 0)$:</p>
          $$\mathbf{d}\cdot\mathbf{n} = -0{,}8 \implies \vec{r} = (-0{,}6;\; -0{,}8;\; 0) - 2(-0{,}8)(0, 1, 0) = \hlg{(-0{,}6;\; 0{,}8;\; 0)}$$
          <p class="note">Thành phần ngang $-0{,}6$ giữ nguyên, còn thành phần vuông góc với mặt sàn đảo dấu từ $-0{,}8$ thành $+0{,}8$!</p>
        focus: [1, 2, 3]
        say: "Phép tính thứ ba tìm hướng tia phản xạ khi tia tới đơn vị trừ 0 phẩy 6, trừ 0 phẩy 8, 0 đập xuống mặt sàn có pháp tuyến 0, 1, 0. Tích vô hướng của tia tới với pháp tuyến bằng trừ 0 phẩy 8, nên trừ 2 lần tích đó bằng cộng 1 phẩy 6. Cộng vào thành phần y, ta được vector phản xạ là trừ 0 phẩy 6, dương 0 phẩy 8, 0, tức giữ nguyên chiều ngang và đảo ngược chiều dọc."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: thế ngược điểm chạm vào mặt cầu và kiểm tra góc phản xạ"
    checks:
      - "sum((p - c) ** 2 for p, c in zip((0, 0, 4), (0, 0, 5))) == 1 ** 2"
      - "sum((p - c) ** 2 for p, c in zip((0, 0, 6), (0, 0, 5))) == 1 ** 2"
      - "round((-0.6) ** 2 + 0.8 ** 2, 6) == 1.0"
    steps:
      - show: |
          <p><b>Đường khác 1 — thế trực tiếp toạ độ hai giao điểm vào phương trình mặt cầu $\|\vec{p} - \vec{c}\|^2 = r^2$:</b></p>
          $$\text{Tại } t = 4:\; \vec{p}(4) = (0, 0, 4) \implies \|(0,0,4) - (0,0,5)\|^2 = 0^2 + 0^2 + (-1)^2 = 1 = r^2 \checkmark$$
          $$\text{Tại } t = 6:\; \vec{p}(6) = (0, 0, 6) \implies \|(0,0,6) - (0,0,5)\|^2 = 0^2 + 0^2 + 1^2 = 1 = r^2 \checkmark$$
        focus: [1, 2, 3]
        say: "Ta kiểm tra lại bằng đường khác thứ nhất là thay trực tiếp hai điểm chạm vào phương trình hình học của mặt cầu. Tại t bằng 4, điểm 0, 0, 4 cách tâm 0, 0, 5 đúng một khoảng bằng 1 bằng bán kính. Tại t bằng 6, điểm 0, 0, 6 ở mặt sau cũng cách tâm đúng bằng 1, khớp hoàn toàn với hình vẽ dọc trục z."
      - show: |
          <p><b>Đường khác 2 — kiểm tra độ dài và tích vô hướng của tia phản xạ $\vec{r} = (-0{,}6;\; 0{,}8;\; 0)$:</b></p>
          $$\|\vec{r}\|^2 = (-0{,}6)^2 + 0{,}8^2 + 0^2 = 0{,}36 + 0{,}64 = 1 \checkmark, \qquad \vec{r}\cdot\mathbf{n} = +0{,}8 = -(\mathbf{d}\cdot\mathbf{n}) \checkmark$$
          <p class="note">Tia phản xạ giữ nguyên độ dài đơn vị bằng $1$ và tạo với pháp tuyến góc bằng đúng góc tới.</p>
        focus: [1, 2, 3]
        say: "Đường kiểm tra thứ hai là tính độ dài và góc của vector phản xạ vừa tìm được. Vì bình phương của trừ 0 phẩy 6 cộng bình phương của 0 phẩy 8 bằng 0 phẩy 36 cộng 0 phẩy 64 bằng đúng 1, nên tia phản xạ giữ nguyên độ dài đơn vị. Đồng thời tích vô hướng của tia phản xạ với pháp tuyến bằng dương 0 phẩy 8, đối dấu chính xác với tích vô hướng của tia tới."

  # ───────────────────────── 8. LỖI HAY GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những lỗi hay gặp khi lập trình dò tia"
    checks:
      - "alg.gfx_ray_sphere((0, 0, 4.0001), (0, 0, -1), (0, 0, 5), 1)[1][1] == 0.0001"
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 0, 1), (0, 0, 0), 2) == (16.0, [-2.0, 2.0])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bắn tia bóng đổ ngay từ điểm chạm $\vec{p}$ mà không dịch gốc theo pháp tuyến <b class="red">(hiện tượng mụn bóng đổ lốm đốm)</b>
          <br><span class="note">Do làm tròn dấu phẩy động, điểm $\vec{p}$ tính ra có thể nằm hơi tụt vào trong mặt cầu một lượng $10^{-4}$. Khi bắn tia bóng đổ với điều kiện $t > 0$, tia cắt ngay chính mặt cầu đó tại $t = 0{,}0001$ và tự kết luận điểm đó bị che tối! Phải dịch gốc $\vec{p} + \varepsilon\,\mathbf{n}$ (hoặc yêu cầu $t > \varepsilon$).</span></div>
        focus: [1, 1, 1]
        say: "Lỗi kinh điển thứ nhất là bắn tia bóng đổ xuất phát ngay từ toạ độ điểm chạm p mà không dịch gốc. Do sai số làm tròn dấu phẩy động, điểm p vừa tính có thể nằm lọt vào bên trong mặt cầu một lượng rất nhỏ. Khi đó tia bóng đổ vừa phóng ra đã cắt ngay chính bề mặt của nó tại một nghiệm t dương cực nhỏ, làm cả bề mặt bị lốm đốm những vệt đen tự che bóng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy nghiệm $t_1 = \frac{-b - \sqrt{\Delta}}{2a}$ mà quên kiểm tra $t > 0$ <b class="red">(vật ở sau lưng camera hiện lên phía trước!)</b>
          <br><span class="note">Nếu camera đang ở bên trong mặt cầu (ví dụ tâm $(0,0,0)$ bán kính $2$ cho $t_1 = -2, t_2 = +2$) hoặc mặt cầu ở sau lưng camera ($t_1 < t_2 < 0$), phải bỏ mọi nghiệm âm và chọn nghiệm dương nhỏ nhất.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là luôn lấy nghiệm nhỏ hơn trừ b trừ căn biệt thức chia 2 lần a mà quên kiểm tra điều kiện t dương. Khi camera nằm trong mặt cầu hoặc mặt cầu ở sau lưng camera, nghiệm nhỏ hơn sẽ âm; nếu không lọc bỏ nghiệm âm thì vật ở sau lưng sẽ bị vẽ đè lên phía trước."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Bắn tia bóng đổ đi xuyên qua cả phía sau nguồn sáng điểm <b class="red">(vật ở sau lưng đèn lại tạo bóng đổ!)</b>
          <br><span class="note">Nếu nguồn sáng điểm cách điểm chạm một khoảng $L_{\text{đèn}}$, tia bóng đổ chỉ được tính là bị che khuất khi có vật cản ở khoảng $\varepsilon < t < L_{\text{đèn}}$. Mọi giao điểm có $t > L_{\text{đèn}}$ nằm phía sau bóng đèn nên không thể chắn sáng.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba của người đã đi làm là chỉ kiểm tra xem tia bóng đổ có cắt vật nào với t dương hay không mà quên giới hạn khoảng cách tới bóng đèn. Nếu một bức tường nằm ở phía sau bóng đèn ứng với t lớn hơn khoảng cách tới đèn, bức tường đó không hề chắn ánh sáng chiếu tới điểm đang xét."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: giải giao điểm tia–cầu và xét bóng đổ"
    checks:
      - "alg.gfx_ray_sphere((0, 0, 0), (0, 0, 1), (0, 0, 6), 2) == (16.0, [4.0, 8.0])"
      - "alg.gfx_ray_sphere((0, 0, 4), (0, 1, 0), (0, 3, 4), 1) == (4.0, [2.0, 4.0])"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề bài</th></tr>
          <tr><td>1</td><td>Tia xuất phát từ $\vec{o} = (0,0,0)$ theo hướng $\vec{d} = (0,0,1)$ bắn vào mặt cầu tâm $\vec{c} = (0,0,6)$ bán kính $r = 2$. Tính biệt thức $\Delta$, hai nghiệm $t_1, t_2$ và toạ độ điểm chạm gần nhất.</td></tr>
          <tr><td>2</td><td>Từ điểm chạm $\vec{p} = (0, 0, 4)$, ta bắn tia bóng đổ theo hướng $\vec{d}_{\text{sáng}} = (0, 1, 0)$ tới nguồn sáng đặt tại $(0, 10, 4)$ (khoảng cách $L_{\text{đèn}} = 10$). Giữa đường có một quả cầu nhỏ tâm $(0, 3, 4)$ bán kính $1$. Điểm $\vec{p}$ có bị che tối không?</td></tr>
          <tr><td>3</td><td>Vì sao trong phương trình $\vec{p}(t) = \vec{o} + t\,\vec{d}$, việc chuẩn hoá $\|\vec{d}\| = 1$ ngay từ đầu giúp đơn giản hoá phép giải phương trình bậc hai và kiểm tra khoảng cách đèn?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự giải ba câu hỏi. Câu một, tia xuất phát từ gốc 0, 0, 0 hướng 0, 0, 1 bắn vào mặt cầu tâm 0, 0, 6 bán kính 2; hãy tìm biệt thức, hai nghiệm và điểm chạm gần nhất. Câu hai, từ điểm 0, 0, 4 bắn tia bóng đổ theo hướng 0, 1, 0 tới đèn ở khoảng cách 10, gặp quả cầu tâm 0, 3, 4 bán kính 1 thì có bị che tối không? Câu ba, vì sao chuẩn hoá vector hướng d về độ dài 1 giúp đơn giản hoá phép tính? Hãy dừng video và giải thử."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1.</b> $\vec{m} = (0, 0, -6) \implies a = 1,\; b = 2(-6) = -12,\; c_0 = 36 - 2^2 = 32$. Biệt thức và nghiệm:</p>
          $$\Delta = (-12)^2 - 4\cdot 1\cdot 32 = 144 - 128 = \hlg{16}, \qquad t = \frac{12 \pm 4}{2} \in \{\hlg{4},\; 8\} \implies \vec{p}_{\text{gần nhất}} = \hlg{(0, 0, 4)}$$
          <p><b>Đáp án câu 2.</b> Tia bóng đổ cắt quả cầu tâm $(0, 3, 4)$ bán kính $1$ tại $t_1 = 2$ và $t_2 = 4$. Vì $0 < t_1 = 2 < L_{\text{đèn}} = 10$, quả cầu chắn giữa điểm $\vec{p}$ và đèn $\implies$ <b>điểm $\vec{p}$ nằm trong bóng tối</b>.</p>
        focus: [[1, 2], 3, 3]
        say: "Đáp án câu một, vector m bằng 0, 0, trừ 6 nên a bằng 1, b bằng trừ 12 và hằng số tự do bằng 36 trừ 4 bằng 32. Biệt thức bằng 144 trừ 128 bằng 16, cho hai nghiệm t bằng 4 và t bằng 8, nên điểm chạm gần nhất là 0, 0, 4. Đáp án câu hai, tia bóng đổ cắt quả cầu chắn đường tại t bằng 2, dương và nhỏ hơn khoảng cách đèn là 10, nên điểm đó nằm trong bóng tối."
      - show: |
          <table class="t"><tr><th>lợi ích khi chuẩn hoá $\|\vec{d}\| = 1$ (câu 3)</th><th>ý nghĩa tính toán</th></tr>
          <tr><td>Hệ số bậc cao nhất $a = \vec{d}\cdot\vec{d} = 1$</td><td>Mẫu số $2a$ chỉ còn là $2$, tiết kiệm phép nhân và phép chia ở mọi phép thử giao điểm</td></tr>
          <tr><td>Tham số $t$ bằng đúng <b>khoảng cách hình học</b> (mét)</td><td>So sánh trực tiếp $t < L_{\text{đèn}}$ và dùng chung một hằng số dịch $\varepsilon$ ổn định trên toàn cảnh</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Đáp án câu ba, khi chuẩn hoá vector hướng d về độ dài đơn vị bằng 1 thì hệ số a luôn bằng 1, giúp mẫu số 2 lần a chỉ còn là 2. Quan trọng hơn, tham số t lúc này đo đúng khoảng cách hình học thực tế, giúp ta so sánh trực tiếp với khoảng cách tới đèn và dùng hằng số dịch gốc thống nhất."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bắn tia $\vec{p}(t) = \vec{o} + t\,\vec{d}$ từ mắt</span><span class="a">→</span>
          <span class="n">giải bậc hai tìm $t > 0$ nhỏ nhất</span><span class="a">→</span>
          <span class="n">dịch gốc $\vec{p} + \varepsilon\,\mathbf{n}$ chống tự cắt</span><span class="a">→</span>
          <span class="n">bắn đệ quy tia bóng đổ &amp; tia phản xạ gương</span></div>
        say: "Tổng kết chuỗi logic của bài, thuật toán dò tia bắn tia tham số p theo t bằng o cộng t nhân d từ camera qua từng điểm ảnh. Ta giải phương trình bậc hai với mặt cầu và chọn nghiệm dương nhỏ nhất để tìm bề mặt gần mắt nhất. Từ điểm chạm đã dịch nhẹ dọc pháp tuyến để chống tự cắt, ta tiếp tục bắn tia bóng đổ tới đèn và tia phản xạ gương đệ quy."
      - show: |
          <div class="box key"><b>Tư duy:</b> raster hoá trả lời câu hỏi <i>“tam giác này phủ lên điểm ảnh nào?”</i>, còn dò tia trả lời câu hỏi <i>“điểm ảnh này nhìn thấy gì theo đường đi của tia sáng?”</i> — nhờ đó bóng đổ và phản xạ trở thành cùng một bài toán tìm giao điểm!</div>
        say: "Tư duy cốt lõi cần mang theo là raster hoá hỏi tam giác này phủ lên điểm ảnh nào, còn dò tia hỏi tia sáng từ điểm ảnh này chạm vào đâu. Nhờ quy mọi câu hỏi hiển thị, bóng đổ và phản xạ về cùng một phép tìm giao điểm của tia, ta mô phỏng được các hiệu ứng quang học toàn cục."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>kết xuất dựa trên vật lý — bảo toàn năng lượng và hiệu ứng phản xạ theo góc nhìn</b>. Khi tia sáng chạm vào bề mặt nhựa, nước hay kim loại, bao nhiêu phần trăm phản xạ như gương và bao nhiêu phần trăm tán xạ khuếch tán?</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học về kết xuất dựa trên vật lý, tìm hiểu quy luật bảo toàn năng lượng và công thức phản xạ tăng mạnh ở góc nhìn nghiêng. Ta sẽ tính xem khi tia sáng chạm vào mặt nước hay kim loại thì bao nhiêu phần trăm phản xạ gương và bao nhiêu phần trăm khuếch tán. Hẹn gặp bạn ở bài tiếp theo."
