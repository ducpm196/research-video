  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức cắt biên thuần nhất và công thức khung nhìn"
    checks:
      - "(2 - 1) / ((2 - 1) - (2 - 3)) == 0.5"
      - "alg.gfx_ndc_to_pixel(0.5, 1920) == (0.5 + 1) / 2 * 1920"
    steps:
      - show: |
          <p><b>Bước 1 — Suy ra tham số cắt $t$ tại mặt biên $x = w$:</b></p>
          <p>Điểm $\mathbf{P}_t = \mathbf{A} + t(\mathbf{B} - \mathbf{A})$ chạm biên phải khi $x_t = w_t$, tức $w_t - x_t = 0$. Đặt khoảng cách tới biên là $d = w - x$:</p>
          $$d_A + t \cdot (d_B - d_A) = 0 \implies t = \frac{d_A}{d_A - d_B}$$
        focus: [1, 2, 3]
        say: "Bước một, ta suy ra công thức tìm giao điểm cắt trên biên phải x bằng w. Gọi hiệu w trừ x là khoảng cách có dấu tới biên, điểm trong có d A dương và điểm ngoài có d B âm. Vì tại điểm cắt hiệu này bằng 0, ta giải phương trình tuyến tính được tỉ lệ t bằng d A chia cho hiệu d A trừ d B."
      - show: |
          <p><b>Bước 2 — Suy ra phép biến đổi khung nhìn từ $[-1, 1]$ sang $[0, W]$:</b></p>
          <p>Đầu tiên đổi $x_c \in [-1, 1]$ sang tỉ lệ $\frac{x_c + 1}{2} \in [0, 1]$, rồi nhân với bề rộng $W$ điểm ảnh của khung hình:</p>
          $$x_p = \frac{x_c + 1}{2} \cdot W, \qquad y_p = \frac{y_c + 1}{2} \cdot H$$
        focus: [1, 2, 3]
        say: "Bước hai, sau khi đã cắt xong và chia cho w, ta đổi toạ độ thiết bị chuẩn hoá x c từ đoạn âm 1, 1 sang toạ độ điểm ảnh x p. Vì biểu thức x c cộng 1 tất cả chia 2 trải đều từ 0 đến 1, nên ta nhân tiếp với chiều rộng W để ra cột điểm ảnh x p. Tương tự theo chiều dọc, ta lấy y c cộng 1 chia 2 rồi nhân với chiều cao H để ra y p."

  # ───────────────────────── 6. VÍ DỤ BẰNG SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Đổi toạ độ chuẩn hoá sang khung 1920 điểm ảnh và cắt một đoạn thẳng"
    checks:
      - "alg.gfx_ndc_to_pixel(0.5, 1920) == 1440.0"
      - "alg.gfx_ndc_to_pixel(-1.0, 1920) == 0.0"
      - "alg.gfx_ndc_to_pixel(1.0, 1920) == 1920.0"
      - "(4 - 2) / ((4 - 2) - (4 - 6)) == 0.5"
    steps:
      - show: |
          <p>Xét khung hình có bề rộng $W = 1920$ điểm ảnh.</p>
          <p><b>Bước 1 — Đổi điểm $x_c = 0{,}5$ sang chỉ số điểm ảnh:</b></p>
          $$x_p = \frac{0{,}5 + 1}{2} \cdot 1920 = 0{,}75 \cdot 1920 = \hlg{1440}$$
        focus: [1, 2, 3]
        say: "Ta thực hiện ví dụ số trên khung hình rộng 1920 điểm ảnh. Bước một, với x c bằng 0 phẩy 5, ta lấy 0 phẩy 5 cộng 1 chia 2 được 0 phẩy 75, tức điểm nằm ở vị trí ba phần tư từ mép trái. Nhân 0 phẩy 75 với 1920, ta được cột điểm ảnh 1440."
      - show: |
          <p><b>Bước 2 — Kiểm tra hai mép trái $x_c = -1$ và mép phải $x_c = +1$:</b></p>
          $$x_{p,\text{trái}} = \frac{-1 + 1}{2} \cdot 1920 = \hlb{0}, \qquad x_{p,\text{phải}} = \frac{1 + 1}{2} \cdot 1920 = \hlb{1920}$$
        focus: [1, 2, 2]
        say: "Bước hai, ta thay hai đầu mút của đoạn chuẩn hoá vào công thức. Tại mép trái x c bằng âm 1, tử số âm 1 cộng 1 bằng 0 nên x p bằng 0. Tại mép phải x c bằng dương 1, tỉ lệ bằng 2 chia 2 tức bằng 1, nhân với 1920 ra đúng 1920 ở mép phải khung hình."
      - clear: true
        show: |
          <p><b>Bước 3 — Cắt đoạn thẳng tràn qua biên phải $x = w$:</b></p>
          <p>Cho đỉnh $\mathbf{A} = (2, 0, 0, 4)$ ở trong ($x_A = 2 \le w_A = 4 \implies d_A = 4 - 2 = 2$) và đỉnh $\mathbf{B} = (6, 0, 0, 4)$ ở ngoài ($x_B = 6 \gt w_B = 4 \implies d_B = 4 - 6 = -2$):</p>
          $$t = \frac{d_A}{d_A - d_B} = \frac{2}{2 - (-2)} = 0{,}5 \implies \mathbf{P} = \mathbf{A} + 0{,}5(\mathbf{B} - \mathbf{A}) = \hlo{(4,\ 0,\ 0,\ 4)}$$
          <p class="note">Chia đỉnh mới $\mathbf{P}$ cho $w = 4$ được $x_c = \frac{4}{4} = 1$, rơi đúng vào mép phải $1920$!</p>
        focus: [1, 2, 3, 4]
        say: "Bước ba, ta cắt đoạn thẳng nối đỉnh A là 2, 0, 0, 4 ở trong khung với đỉnh B là 6, 0, 0, 4 tràn ra ngoài biên phải. Hiệu w trừ x tại A là 4 trừ 2 bằng dương 2, còn tại B là 4 trừ 6 bằng âm 2. Thay vào công thức tỉ lệ t bằng 2 chia cho 2 trừ âm 2, ta được t bằng 0 phẩy 5, tức điểm cắt P là 4, 0, 0, 4. Khi chia P cho w bằng 4, ta được x c bằng 1, rơi khít vào mép phải 1920."

  # ───────────────────────── 7. TỰ KIỂM BẰNG ĐƯỜNG KHÁC ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm lại bằng công thức đổi ngược từ điểm ảnh về [-1, 1]"
    checks:
      - "2 * (1440 / 1920) - 1 == 0.5"
      - "2 * (0 / 1920) - 1 == -1.0"
      - "2 * (1920 / 1920) - 1 == 1.0"
      - "960 + 0.5 * (1920 / 2) == 1440.0"
    steps:
      - show: |
          <p><b>Đường khác 1 — Giải ngược công thức từ $x_p = 1440$ về lại $x_c$:</b></p>
          $$x_p = \frac{x_c + 1}{2} \cdot W \implies x_c = \frac{2 \cdot x_p}{W} - 1 = \frac{2 \cdot 1440}{1920} - 1 = 1{,}5 - 1 = 0{,}5\ \checkmark$$
        focus: [1, 2, 2]
        say: "Ta kiểm tra lại bằng cách giải ngược từ chỉ số điểm ảnh 1440 về lại toạ độ thiết bị chuẩn hoá. Chuyển vế công thức khung nhìn, ta có x c bằng 2 lần x p chia W rồi trừ 1. Thay 2 nhân 1440 chia 1920 được 1 phẩy 5, trừ đi 1 ra đúng 0 phẩy 5 như ban đầu."
      - show: |
          <p><b>Đường khác 2 — Tính từ tâm màn hình cộng thêm độ lệch:</b></p>
          <p>Tâm màn hình ($x_c = 0$) nằm ở $\frac{1920}{2} = 960$, mỗi đơn vị chuẩn hoá dài $960$ điểm ảnh, nên $x_c = +0{,}5$ nằm ở:</p>
          $$x_p = 960 + 0{,}5 \cdot 960 = 960 + 480 = 1440\ \checkmark$$
        focus: [1, 2, 3]
        say: "Cách kiểm thứ hai là xuất phát từ tâm màn hình tại cột 960. Vì nửa khung bên phải từ 0 đến 1 dài 960 điểm ảnh, nên đi sang phải một nửa đoạn đó tức 480 điểm ảnh. Cộng 960 với 480 ta được đúng cột 1440, khớp hoàn toàn với công thức chuẩn."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp khi cắt khung nhìn và đổi sang điểm ảnh"
    checks:
      - "1.0 / (-2.0) == -0.5 and 1.0 / 2.0 == 0.5"
      - "0.5 * 1920 == 960.0 and alg.gfx_ndc_to_pixel(0.5, 1920) == 1440.0"
      - "(1 - 0.5) * 1080 == 540.0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Chia cho $w$ trước rồi mới cắt trong $[-1, 1]$ <b class="red">(điểm sau camera có $w \lt 0$ làm tam giác lộn ngược qua màn hình)</b></div>
          <table class="t"><tr><th>đỉnh của cạnh bên phải ($x = +1$)</th><th>giá trị $w$</th><th>nếu chia $\frac{x}{w}$ trước khi cắt</th></tr>
          <tr><td>Đỉnh trước camera</td><td>$w = +2 \gt 0$</td><td>$x_c = \frac{+1}{+2} = +0{,}5$ (bên phải, đúng)</td></tr>
          <tr><td>Đỉnh trôi ra sau camera</td><td>$w = -2 \lt 0$</td><td>$x_c = \frac{+1}{-2} = -0{,}5$ (lật sang bên trái, <b>sai!</b>)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi nghiêm trọng nhất là chia cho w trước rồi mới kiểm tra điều kiện nằm trong đoạn âm 1 đến 1. Một đỉnh bên phải có x bằng dương 1 nhưng ở sau camera với w bằng âm 2, khi chia x cho w sẽ biến thành âm 0 phẩy 5 ở bên trái. Vì vậy bắt buộc phải cắt bỏ phần có w âm trước khi thực hiện phép chia cho w."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên cộng $1$ chia $2$ mà lấy thẳng $x_c \cdot W$ <b class="red">(nửa trái màn hình có chỉ số điểm ảnh âm)</b>
          <br><span class="note">Nếu lấy $0{,}5 \cdot 1920 = 960$ thì điểm $x_c = 0{,}5$ bị đặt nhầm vào tâm màn hình, còn $x_c = -0{,}5$ thành $-960$ nằm ngoài mảng bộ đệm. Phép thử: luôn kiểm tra $x_c = 0$ phải ra $\frac{W}{2}$.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là quên bước cộng 1 chia 2 mà lấy thẳng toạ độ chuẩn hoá nhân với chiều rộng W. Khi đó điểm x c bằng 0 bị đặt về cột 0 ở mép trái thay vì tâm 960, còn toàn bộ nửa trái màn hình có x c âm lại sinh ra chỉ số điểm ảnh âm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tưởng cắt một tam giác luôn chỉ ra một tam giác <b class="red">(cắt mất 1 góc của tam giác tạo thành hình tứ giác, phải tách thành 2 tam giác)</b>
          <br><span class="note">Khi 1 đỉnh nằm ngoài biên và 2 đỉnh nằm trong biên, đường cắt tạo ra 2 đỉnh mới, biến phần còn lại thành tứ giác (4 đỉnh) nên tầng ghép nguyên thuỷ phải nối lại thành 2 tam giác.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là cấp phát bộ nhớ cố định vì tưởng một tam giác sau khi cắt vẫn chỉ là một tam giác. Khi một đỉnh tràn ra ngoài biên còn hai đỉnh nằm trong, đường cắt tạo ra hai giao điểm mới làm phần còn lại thành tứ giác bốn đỉnh, phải chia thành hai tam giác."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên lật trục dọc $y$ khi bộ đệm ảnh đếm hàng từ trên xuống <b class="red">(hình ảnh bị lộn đầu xuống đất)</b></div>
          $$y_p = \frac{1 - y_c}{2} \cdot H \quad (\text{khi hàng } 0 \text{ ở mép trên})$$
        focus: [1, 2]
        say: "Lỗi thứ tư là quên đổi chiều trục y khi ghi vào bộ đệm ảnh có hàng 0 nằm ở mép trên cùng. Trong toạ độ chuẩn hoá thì y c bằng dương 1 là mép trên, nên nếu màn hình đếm hàng từ trên xuống, ta phải dùng 1 trừ y c tất cả chia 2 nhân H."

  # ───────────────────────── 9. TỰ LÀM (QUIZ) ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: đổi toạ độ khung nhìn và cắt tại mặt phẳng gần"
    checks:
      - "alg.gfx_ndc_to_pixel(-0.25, 1280) == 480.0"
      - "2 * (320 / 1280) - 1 == -0.5"
      - "(3 - 1) / (3 - (-1)) == 0.5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>nội dung câu hỏi</th></tr>
          <tr><td>1</td><td>Trên màn hình rộng $W = 1280$ điểm ảnh, điểm có toạ độ thiết bị chuẩn hoá $x_c = -0{,}25$ nằm ở cột điểm ảnh $x_p$ nào?</td></tr>
          <tr><td>2</td><td>Vẫn trên màn hình rộng $W = 1280$, một điểm ảnh ở cột $x_p = 320$ ứng với toạ độ thiết bị chuẩn hoá $x_c$ bằng bao nhiêu?</td></tr>
          <tr><td>3</td><td>Mặt phẳng cắt gần đặt tại $w_{\text{gần}} = 1$. Một đoạn thẳng nối đỉnh $\mathbf{A}$ có $w_A = 3$ (trước camera) với đỉnh $\mathbf{B}$ có $w_B = -1$ (sau lưng camera). Tìm tham số nội suy $t \in [0, 1]$ tại điểm cắt nơi $w_t = 1$.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm ba câu hỏi. Câu một, trên khung hình rộng 1280 điểm ảnh, toạ độ chuẩn hoá âm 0 phẩy 25 đổi ra cột điểm ảnh nào? Câu hai, cột điểm ảnh 320 trên khung 1280 ứng với toạ độ chuẩn hoá bằng bao nhiêu? Câu ba, mặt gần đặt tại w bằng 1, đoạn nối đỉnh A có w bằng 3 với đỉnh B có w bằng âm 1 bị cắt tại tỉ lệ t bằng bao nhiêu? Hãy dừng video và tính ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Đáp án câu 1:</b> thay $x_c = -0{,}25$ và $W = 1280$:</p>
          $$x_p = \frac{-0{,}25 + 1}{2} \cdot 1280 = 0{,}375 \cdot 1280 = \hlg{480}$$
          <p><b>Đáp án câu 2:</b> đổi ngược từ $x_p = 320$ về đoạn $[-1, 1]$:</p>
          $$x_c = \frac{2 \cdot 320}{1280} - 1 = 0{,}5 - 1 = \hlb{-0{,}5}$$
        focus: [1, 2, 4]
        say: "Ta cùng kiểm tra đáp án câu một và câu hai. Ở câu một, lấy âm 0 phẩy 25 cộng 1 chia 2 được 0 phẩy 375, nhân với 1280 ra cột điểm ảnh 480. Ở câu hai, cột 320 bằng một phần tư của 1280, nhân 2 rồi trừ 1 cho toạ độ chuẩn hoá bằng âm 0 phẩy 5."
      - show: |
          <p><b>Đáp án câu 3:</b> giải phương trình $w_t = w_A + t \cdot (w_B - w_A) = 1$:</p>
          $$3 + t \cdot (-1 - 3) = 1 \implies 3 - 4t = 1 \implies t = \frac{2}{4} = \hlo{0{,}5}$$
          <p class="note">Nhờ cắt tại $t = 0{,}5$ trước khi chia, phần từ $t = 0{,}5$ đến $t = 1$ (có $w \lt 1$ và đi ra sau camera) bị loại bỏ an toàn.</p>
        focus: [2, 3]
        say: "Ở câu ba, ta giải phương trình nội suy cho thành phần w: 3 cộng t nhân hiệu âm 1 trừ 3 bằng 1, tức 3 trừ 4 t bằng 1, suy ra t bằng 0 phẩy 5. Nhờ cắt ngay tại chính giữa đoạn trước khi chia cho w, toàn bộ nửa đoạn đi ra sau lưng camera được loại bỏ hoàn toàn."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cắt khung nhìn"
    steps:
      - show: |
          <div class="chain"><span class="n">Không gian cắt $(x, y, z, w)$</span><span class="a">→</span>
          <span class="n">Cắt theo $-w \le x \le w,\ w \gt 0$</span><span class="a">→</span>
          <span class="n">Chia cho $w \to x_c \in [-1, 1]$</span><span class="a">→</span>
          <span class="n">Khung nhìn $x_p = \frac{x_c + 1}{2} \cdot W$</span></div>
          <div class="box key"><b>Tư duy cốt lõi:</b> luôn <b>cắt trong không gian thuần nhất trước khi chia cho $w$</b> để không bao giờ chia cho $w \le 0$; sau khi chia, đoạn $[-1, 1]$ là cầu nối độc lập với mọi độ phân giải màn hình.</div>
        focus: [1, 2]
        say: "Tổng kết lại, sau ma trận chiếu ta phải cắt nguyên thuỷ theo điều kiện x nằm từ âm w đến w với w dương, rồi mới chia cho w để về đoạn âm 1 đến 1. Cuối cùng, phép biến đổi khung nhìn cộng 1 chia 2 rồi nhân W sẽ ánh xạ đoạn chuẩn hoá đó sang chỉ số điểm ảnh của màn hình."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>Raster hoá tam giác: hàm cạnh và toạ độ trọng tâm</b> — khi ba đỉnh đã có toạ độ điểm ảnh trên màn hình, làm sao biết những ô điểm ảnh nào nằm bên trong tam giác?</p>
        forward_ref: true
        focus: [1]
        say: "Ở bài sau, bài 4, khi các đỉnh của tam giác đã có toạ độ điểm ảnh trên màn hình, ta sẽ học thuật toán raster hoá tam giác bằng hàm cạnh và toạ độ trọng tâm."
