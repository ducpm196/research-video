scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bức tường thò ra sau lưng camera, sao lại lộn ngược ngang qua màn hình?"
    checks:
      - "alg.gfx_persp_project(1, 0, 2, 1.0)[0] == 0.5"
      - "alg.gfx_persp_project(1, 0, -2, 1.0)[0] == -0.5"
      - "alg.gfx_ndc_to_pixel(0.5, 1920) == 1440.0"
    steps:
      - show: |
          <p>Người chơi đi dọc một bức tường bên phải ($x = +1$). Một đỉnh của bức tường ở phía trước camera ($w = +2$) chiếu ra vị trí bên phải $+0{,}5$, tức cột điểm ảnh <b>1440</b> trên màn hình rộng <b>1920</b>.</p>
          <p>Nhưng đỉnh kia của bức tường đã trôi ra <b>sau lưng camera</b> ($w = -2$). Nếu lấy $x = +1$ chia thẳng cho $w = -2$, nó biến thành <b>$-0{,}5$</b> ở tận bên trái màn hình, làm cả tam giác lộn ngược chắn ngang tầm mắt!</p>
          <div class="box key">Hôm nay: cắt tam giác ở đâu và bằng điều kiện nào? Toạ độ thiết bị chuẩn hoá $[-1, 1]$ là gì? Và đổi sang cột điểm ảnh ra sao?</div>
        focus: [1, 2, 3]
        say: "Chào bạn, trên bức tường bên phải có x bằng dương 1, đỉnh trước mặt camera với w bằng dương 2 chiếu ra vị trí dương 0 phẩy 5, tức cột điểm ảnh 1440. Nhưng đỉnh kia đã trôi ra sau camera nên w bằng âm 2, nếu chia thẳng cho âm 2 thì nó nhảy sang âm 0 phẩy 5 ở bên trái và làm tam giác lộn ngược. Hôm nay ta học vì sao phải cắt trước khi chia cho w, ý nghĩa toạ độ thiết bị chuẩn hoá, và phép đổi sang khung nhìn điểm ảnh."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại phép chia cho w, bất đẳng thức khi nhân số âm và ánh xạ đoạn"
    checks:
      - "(2.0 / 4.0 == 0.5) and (-2.0 <= 2.0 <= 4.0)"
      - "(1.0 / (-2.0) == -0.5) and (-0.5 <= 1.0)"
      - "((-1 + 1) / 2 == 0.0) and ((0 + 1) / 2 == 0.5) and ((1 + 1) / 2 == 1.0)"
    steps:
      - show: |
          <p><b>① Phép chia cho $w$</b> (bài 2): sau ma trận chiếu, điểm có bộ bốn số $(x, y, z, w)$ với $w$ tỉ lệ với độ sâu trước camera, rồi chia cho $w$ để ra toạ độ chuẩn hoá:</p>
          $$x_c = \frac{x}{w}, \qquad y_c = \frac{y}{w}$$
        focus: [1, 2]
        say: "Điều thứ nhất là phép chia cho w đã học ở bài 2, sau khi nhân ma trận chiếu thì mỗi đỉnh có bốn thành phần x, y, z, w với w mang dấu của độ sâu. Khi chia x và y cho w, ta thu được toạ độ đã chuẩn hoá trên mặt ảnh."
      - show: |
          <p><b>② Chia cho số âm làm đảo dấu:</b> khi điểm ở trước camera ($w \gt 0$), điều kiện nằm trong khung nhìn $-1 \le \frac{x}{w} \le 1$ tương đương với:</p>
          $$-w \le x \le w \quad (\text{với } w \gt 0)$$
          <p class="note">Nếu $w \lt 0$ (điểm ở sau lưng camera) mà vẫn chia cho $w$, dấu của $\frac{x}{w}$ bị lật ngược từ dương sang âm.</p>
        focus: [1, 2, 3]
        say: "Điều thứ hai là tính chất của phép chia cho số âm. Khi điểm nằm trước camera tức w lớn hơn 0, điều kiện thương số x chia w nằm giữa âm 1 và 1 tương đương với x nằm giữa âm w và dương w. Ngược lại nếu w nhỏ hơn 0 mà ta đem chia trước, dấu của toạ độ sẽ bị lật ngược."
      - show: |
          <p><b>③ Đổi đoạn $[-1, 1]$ sang đoạn $[0, 1]$:</b> đoạn $[-1, 1]$ có độ dài bằng $2$. Cộng thêm $1$ để dời mốc $-1$ về $0$, rồi chia cho $2$:</p>
          $$u = \frac{x_c + 1}{2} \implies \text{khi } x_c = -1 \to 0;\quad x_c = 0 \to 0{,}5;\quad x_c = 1 \to 1$$
        focus: [1, 2]
        say: "Điều thứ ba là cách co giãn và dời đoạn từ âm 1 đến 1 sang đoạn từ 0 đến 1. Vì đoạn từ âm 1 đến 1 dài 2 đơn vị, ta lấy toạ độ cộng thêm 1 để mốc âm 1 về 0, rồi chia 2 để mốc dương 1 về 1."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: không gian cắt, toạ độ thiết bị chuẩn hoá và toạ độ điểm ảnh"
    checks:
      - "alg.gfx_ndc_to_pixel(-1, 1920) == 0.0"
      - "alg.gfx_ndc_to_pixel(0, 1920) == 960.0"
      - "alg.gfx_ndc_to_pixel(1, 1920) == 1920.0"
    steps:
      - show: |
          <table class="t"><tr><th>tên gọi &amp; ký hiệu</th><th>miền giá trị trong khung nhìn</th><th>ý nghĩa trong đường ống</th></tr>
          <tr><td><b>Toạ độ không gian cắt</b> $(x, y, z, w)$</td><td>$-w \le x \le w,\ -w \le y \le w,\ w \gt 0$</td><td>ngay sau ma trận chiếu, <b>trước</b> khi chia cho $w$</td></tr>
          <tr><td><b>Toạ độ thiết bị chuẩn hoá</b> $(x_c, y_c)$</td><td>$x_c \in [-1, 1],\ y_c \in [-1, 1]$</td><td>ngay <b>sau</b> khi chia $(x, y)$ cho $w$; độc lập với độ phân giải màn hình</td></tr>
          <tr><td><b>Toạ độ khung nhìn</b> $(x_p, y_p)$</td><td>$x_p \in [0, W],\ y_p \in [0, H]$</td><td>vị trí tính bằng điểm ảnh trên màn hình rộng $W$, cao $H$</td></tr></table>
        introduces: [in]
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bảng trên giải mã ba hệ toạ độ liên tiếp nhau cùng ký hiệu thuộc đoạn. Thứ nhất là toạ độ không gian cắt x, y, z, w trước khi chia cho w, nơi điểm hợp lệ có w dương và x, y nằm từ âm w đến w. Thứ hai là toạ độ thiết bị chuẩn hoá x c và y c thuộc đoạn từ âm 1 đến 1 sau khi đã chia cho w. Thứ ba là toạ độ khung nhìn x p và y p thuộc đoạn từ 0 đến W và từ 0 đến H tính bằng điểm ảnh."
      - clear: true
        show: |
          <p>Khi một cạnh tam giác nối điểm $\mathbf{A}$ ở trong khung nhìn với điểm $\mathbf{B}$ ở ngoài khung nhìn, điểm cắt $\mathbf{P}_t$ trên mặt biên được tìm bằng tham số nội suy $t \in [0, 1]$:</p>
          $$\mathbf{P}_t = \mathbf{A} + t \cdot (\mathbf{B} - \mathbf{A})$$
          <p class="note">Giải phương trình tại biên (ví dụ $x_t = w_t$ ở biên phải, hoặc $w_t = w_{\text{gần}}$ ở mặt phẳng gần) để tìm $t$, rồi thay $t$ vào tính toạ độ đỉnh mới.</p>
        focus: [1, 2, 3]
        say: "Khi một cạnh nối đỉnh A ở trong khung nhìn với đỉnh B tràn ra ngoài biên, tầng cắt phải tìm đúng giao điểm của cạnh đó với mặt biên. Mọi điểm trên đoạn nối A và B đều viết được dưới dạng A cộng t nhân hiệu B trừ A, với t từ 0 đến 1. Ta chỉ cần giải phương trình tại mặt biên như x bằng w để tìm tỉ lệ t rồi thay vào tính đỉnh mới."

