# Quy ước: biểu thức x₀ op₀ x₁ op₁ … xₙ, chỉ số TỪ 0, DP[i][j] = giá trị lớn nhất của đoạn từ xᵢ đến xⱼ; nhân chuỗi ma trận
#   A₁ … Aₙ, Aᵢ cỡ p₍ᵢ₋₁₎ × pᵢ, chỉ số TỪ 1, m[i][j] = số phép nhân ít nhất cho đoạn Aᵢ … Aⱼ (giống báo cáo BTL). Mỗi ví dụ
#   ghi rõ chỉ số bắt đầu từ đâu. k = vị trí cắt (phép tính / phép nhân thực hiện CUỐI CÙNG). Nhân hai số: ·
# Sửa bản thảo (AUDIT_CS112 §2): C24b hai bài toán KHÁC nhau cùng khuôn DP theo đoạn; công thức chỉ-lấy-max đúng khi mọi số ≥ 0
#   và chỉ có + và × (phản ví dụ 1 − 1 − 1 − 1); bỏ quy định “bắt buộc chỉ số 1-based” (không kiểm được, tự mâu thuẫn).
# Nối bài trước (luật 17): bài 18 — quy hoạch động: bài con gối nhau, cấu trúc con tối ưu, lập bảng đúng thứ tự; bài 13 — sắp
#   xếp trước; bài 0 — đếm số phần tử của đoạn từ i đến j là j − i + 1.
