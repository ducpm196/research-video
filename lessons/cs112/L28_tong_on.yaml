          <tr><td>9. định lý thợ ở trường hợp 3 quên điều kiện $a\,f(n/b) \le c\,f(n)$ với một hằng $c < 1$, hay ép khe hở như $n\log n$</td><td>tỉ số phải hơn hẳn một lũy thừa</td></tr>
