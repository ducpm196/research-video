  # ───────────────────────── 4. VÍ DỤ TỔNG HỢP ─────────────────────────
  - id: example
    kind: example
    title: "Một ví dụ đi qua nhiều bài"
    checks:
      - "(lambda T: [T(T, 2**k) for k in range(5)] == [2**k * k for k in range(5)] == [0, 2, 8, 24, 64])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + n)"
      - "2*0 + 2 == 2 == 2*1 and 2*2 + 4 == 8 == 4*2 and 2*8 + 8 == 24 == 8*3 and math.log(2, 2) == 1"
    steps:
      - show: |
          <p>Mã giả của ví dụ có ba cách viết cần đọc trước:</p>
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>if n == 1: return</code></td><td>hai dấu bằng liền nhau là <b>so sánh</b>, cho đúng hoặc sai; <code>return</code> thoát khỏi hàm ngay, nên đoạn một phần tử không làm gì</td><td>n = 1: thoát; n = 8: đi tiếp</td></tr>
          <tr><td><code>for i = 1..n: làm 1 bước</code></td><td><b>vòng lặp</b>: i chạy từ 1 tới n, mỗi lượt một bước, tổng n bước</td><td>n = 8: 8 bước</td></tr>
          <tr><td><code>f(nửa trái, n/2)</code></td><td>hàm f tự gọi lại chính nó (<b>đệ quy</b>) trên nửa mảng, cỡ n/2</td><td>n = 8: hai lời gọi cỡ 4</td></tr></table>
        focus: ["2.2", "2.3", "2.4"]
        say: "Mã giả của ví dụ dùng ba cách viết: hai dấu bằng liền nhau là phép so sánh cho đúng hoặc sai, còn lệnh trả về thoát khỏi hàm ngay. Vòng lặp cho i chạy từ 1 tới n, mỗi lượt làm một bước, nên tổng cộng n bước. Hàm tự gọi lại chính nó cho mỗi nửa, cỡ n chia 2, đó là đệ quy."
      - clear: true
        show: |
          <div class="code"><div>f(A, n):</div><div>    <span class="kw">if</span> n == 1: <span class="kw">return</span></div><div>    <span class="kw">for</span> i = 1..n: làm 1 bước         <span class="cm">(n bước)</span></div><div>    f(nửa trái, n/2);  f(nửa phải, n/2)   <span class="cm">(cả hai đều chạy)</span></div></div>
          <p><b>Bước 1</b> — đếm theo nhánh: $a = 2$, $b = 2$, $f(n) = n$ → $T(n) = 2T(n/2) + n$, $T(1) = 0$.</p>
        focus: [0, ["1.3", "1.4"], 2]
        say: "Một ví dụ đi qua nhiều bài. Hàm này làm n bước, rồi gọi đệ quy cả hai nửa. Bước một, đếm theo nhánh như bài 10, a bằng 2, b bằng 2, f của n bằng n."
      - show: |
          <p><b>Bước 2</b> — định lý thợ: phần lá $n^{\log_2 2} = n^1 = n$, đúng bằng $f(n)$:</p>
          $$f(n) = n = n^{\log_2 2} \implies \text{trường hợp 2} \implies T(n) \in \Theta(n\log_2 n)$$
        introduces: [in]
        focus: [1, 2, 2]
        say: "Bước hai, tra định lý thợ của bài 12, vì lôgarit cơ số 2 của 2 bằng 1, phần lá bằng n mũ 1, tức n. Phần lá bằng đúng f, nên rơi vào trường hợp hai. Ký hiệu chữ e cách điệu đọc là thuộc, T của n thuộc lớp Theta của n lôgarit n."
      - clear: true
        show: |
          <p><b>Bước 3</b> — kiểm bằng số, tính xuôi từ $T(1) = 0$:</p>
          <table class="t"><tr><th>$n$</th><th>$T(n) = 2T(n/2) + n$</th><th>$n\log_2 n$</th></tr>
          <tr><td>2</td><td>$2 \cdot 0 + 2 = 2$</td><td>$2 \cdot 1 = 2$</td></tr>
          <tr><td>4</td><td>$2 \cdot 2 + 4 = 8$</td><td>$4 \cdot 2 = 8$</td></tr>
          <tr><td>8</td><td>$2 \cdot 8 + 8 = \hlg{24}$</td><td>$8 \cdot 3 = 24$</td></tr></table>
        focus: [1]
        say: "Bước ba, kiểm bằng số từ T của 1 bằng 0: T của 2 bằng 2, T của 4 bằng 8, T của 8 bằng 24, khớp hết."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  # ───────────────────────── 7b. QUY MÔ ─────────────────────────
  - id: scale
    kind: example
    title: "Cùng một việc, hai cách: n log n và mọi cặp, khi n lớn dần"
    checks:
      - "(lambda m: [m['f_steps'](2 ** k) for k in (10, 14, 17)] == [k * 2 ** k for k in (10, 14, 17)] == [10240, 229376, 2228224] and m['pair_steps_loop'](1024) == 1024 * 1023 // 2 == 523776)(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
      - "[n * (n - 1) // 2 for n in (2 ** 14, 2 ** 17)] == [134209536, 8589869056] and round(8589869056 / 10 ** 9, 1) == 8.6 and round(2228224 / 10 ** 9 * 1000, 1) == 2.2 and round(8589869056 / 2228224) == 3855"
    steps:
      - show: |
          <p>Số bước của hàm ví dụ ở trên (làm $n$ bước rồi gọi hai nửa) và của vòng lặp đôi xét mọi cặp $(i, j)$ với $i < j$:</p>
          <table class="t"><tr><th>$n$</th><th>hàm ví dụ</th><th>mọi cặp $\frac{n(n-1)}{2}$</th></tr>
          <tr><td>1024</td><td>10240 (đếm thật)</td><td>523776 (đếm thật)</td></tr>
          <tr><td>16384</td><td>229376 (đếm thật)</td><td>134209536 (công thức)</td></tr>
          <tr><td>131072</td><td>2228224 (đếm thật)</td><td>8589869056 (công thức)</td></tr></table>
          <div class="box warn">Ở $10^{9}$ bước mỗi giây <span class="note">(số minh hoạ)</span>: $n = 131072$ cần khoảng <b>2 mili giây</b> cho hàm ví dụ, nhưng khoảng <b>8,6 giây</b> cho vòng lặp đôi, chậm hơn khoảng 3855 lần. Vòng lặp đôi dễ viết nhất, và gãy đầu tiên khi $n$ lớn: <b>chọn công cụ theo bậc tăng, không theo độ dễ viết</b>.</div>
        focus: [1, "2.2", "2.2", "2.4", 3, 3]
        say: "Giờ ta xem cả khoá gom lại khi n lớn dần. Hàm ví dụ trên tốn đúng n lôgarit cơ số 2 của n bước, đếm thật được 10240 với n bằng 1024. Vòng lặp đôi, tức hai vòng lặp lồng nhau xét mọi cặp, tốn n nhân n trừ 1 chia 2, đã là 523776 ở cùng cỡ. Với n bằng 131072, hàm ví dụ cần khoảng hai triệu bước, vòng lặp đôi cần gần chín tỉ. Nếu máy làm một tỉ bước mỗi giây, một giả định minh hoạ, đó là hai phần nghìn giây so với gần chín giây. Vòng lặp đôi dễ viết nhất mà gãy đầu tiên, nên chọn công cụ theo bậc tăng, không theo độ dễ viết."
  - id: verify
    kind: check
    title: "Thói quen tự kiểm cho mọi dạng bài"
    checks:
      - "(lambda cnt: cnt(cnt, 8) == 24 == 2*8 + 8 == 3*8 == 8 + 2*4 + 4*2)(lambda f, n: 0 if n == 1 else n + 2 * f(f, n // 2))"
    steps:
      - show: |
          <table class="t"><tr><th>thói quen</th><th>làm gì</th></tr>
          <tr><td>1</td><td><b>Đếm tay với $n$ nhỏ</b> trước khi viết công thức.</td></tr>
          <tr><td>2</td><td><b>Thay số ngược</b> vào hệ thức, vào ràng buộc, vào định nghĩa.</td></tr>
          <tr><td>3</td><td><b>So với vét cạn</b> trên dữ liệu nhỏ khi có thể.</td></tr>
          <tr><td>4</td><td>Với tiệm cận: <b>lấy giới hạn tỉ số</b>, đừng tin vài giá trị đầu.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bốn thói quen tự kiểm dùng được cho mọi dạng bài. Một, đếm tay với n nhỏ trước khi viết công thức. Hai, thay số ngược vào hệ thức, vào ràng buộc, vào định nghĩa. Ba, so với vét cạn trên dữ liệu nhỏ khi có thể. Bốn, với tiệm cận thì lấy giới hạn của tỉ số, đừng tin vài giá trị đầu."
      - clear: true
        show: |
          <p>Áp dụng cho ví dụ $T(n) = 2T(n/2) + n$, ba đường độc lập phải cho cùng một số ở $n = 8$:</p>
          <table class="t"><tr><th>đường</th><th>cách tính</th><th>$T(8)$</th></tr>
          <tr><td>tính xuôi hệ thức</td><td>$2 \cdot 8 + 8$</td><td>24</td></tr>
          <tr><td>cộng theo tầng của cây</td><td>3 tầng, mỗi tầng 8</td><td>24</td></tr>
          <tr><td>đếm thẳng mọi vòng lặp khi chạy</td><td>$8 + 2 \cdot 4 + 4 \cdot 2$</td><td>24</td></tr></table>
          <p class="note">Ba số trùng nhau là một bằng chứng; chỉ một đường thì chưa đủ.</p>
