scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai mươi tám bài, sáu nhóm dạng bài"
    steps:
      - show: |
          <table class="t"><tr><th>nhóm</th><th>công cụ chính</th></tr>
          <tr><td>① đếm và tiệm cận</td><td>đếm số bước, tổng Sigma, O, Ω, Θ, giới hạn tỉ số</td></tr>
          <tr><td>② hệ thức truy hồi</td><td>thế ngược, hàm sinh, đổi biến, định lý thợ, quy nạp</td></tr>
          <tr><td>③ chiến lược thiết kế</td><td>chia, giảm, biến đổi để trị; quay lui; nhánh cận; tham lam</td></tr>
          <tr><td>④ quy hoạch động</td><td>bảng một chiều, bảng hai chiều, bảng theo đoạn</td></tr>
          <tr><td>⑤ quy hoạch tuyến tính</td><td>vẽ miền, thử đỉnh, đơn hình</td></tr>
          <tr><td>⑥ sắp xếp, đồ thị, độ khó</td><td>cây quyết định; nới cạnh; tính chất lát cắt, hợp–tìm; quy dẫn</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", ["1.5", "1.6"], "1.7"]
        say: "Chào bạn, đây là bài tổng ôn của khoá, nơi ta xếp hai mươi tám bài vào sáu nhóm. Nhóm một là đếm và tiệm cận. Nhóm hai là hệ thức truy hồi, với thế ngược, hàm sinh, đổi biến, định lý thợ và quy nạp. Nhóm ba là các chiến lược thiết kế, từ chia để trị tới quay lui, nhánh cận và tham lam. Nhóm bốn là quy hoạch động, còn nhóm năm là quy hoạch tuyến tính. Nhóm sáu là sắp xếp, đồ thị và độ khó của bài toán, với cây quyết định, phép nới cạnh, tính chất lát cắt và phép quy dẫn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: lôgarit và ba trường hợp của định lý thợ"
    checks:
      - "2**3 == 8 and math.log2(8) == 3 and 3**1 == 3 and math.log(3, 3) == 1"
      - "(lambda n: sp.limit(1 / n, n, sp.oo) == 0 and sp.simplify(n / n) == 1 and sp.limit(n**2 / n, n, sp.oo) == sp.oo and 2 * (n / 2)**2 == n**2 / 2)(sp.Symbol('n', positive=True))"
      - "(lambda T: [T(T, 2**k) for k in range(1, 6)] == [2**k - 1 for k in range(1, 6)])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 1)"
    steps:
      - show: |
          <p>Lôgarit trả lời câu hỏi “mũ mấy?”: $\ 2^3 = 8 \implies \log_2 8 = 3$; $\ 3^1 = 3 \implies \log_3 3 = 1$.</p>
          <p>Định lý thợ cho $T(n) = a\,T(n/b) + f(n)$: so $f(n)$ với <b>phần lá</b> $n^{\log_b a}$. Với $a = b = 2$, phần lá là $n^{\log_2 2} = n$:</p>
          <table class="t"><tr><th>hệ thức</th><th>$f(n)$ so với $n$</th><th>trường hợp</th><th>kết quả</th></tr>
          <tr><td>$2T(n/2) + 1$</td><td>nhỏ hơn hẳn một lũy thừa</td><td>1</td><td>$\Theta(n)$</td></tr>
          <tr><td>$2T(n/2) + n$</td><td>bằng nhau</td><td>2</td><td>$\Theta(n\log_2 n)$</td></tr>
          <tr><td>$2T(n/2) + n^2$</td><td>lớn hơn hẳn, và $2(n/2)^2 = \frac{1}{2}n^2$ đều đặn</td><td>3</td><td>$\Theta(n^2)$</td></tr></table>
        introduces: [implies, frac]
        focus: [0, 1, 2, "3.2", "3.3", "3.4", "3.4"]
        say: "Trước khi ôn cả khoá, nhắc lại hai công cụ dùng nhiều nhất. Lôgarit trả lời câu hỏi mũ mấy, 2 mũ 3 bằng 8 nên lôgarit cơ số 2 của 8 bằng 3, và 3 mũ 1 bằng 3 nên lôgarit cơ số 3 của 3 bằng 1. Định lý thợ so phần việc mỗi tầng f của n với phần lá, n mũ lôgarit cơ số b của a, với a bằng b bằng 2 thì phần lá chính là n. Nếu f bằng 1, nhỏ hơn hẳn một lũy thừa, đó là trường hợp một, Theta của n. Nếu f bằng n, bằng phần lá, đó là trường hợp hai, Theta của n lôgarit n. Nếu f bằng n bình phương, lớn hơn hẳn phần lá, đó là trường hợp ba, Theta của n bình phương. Điều kiện đều đặn cũng thoả, vì 2 nhân n chia 2 bình phương chỉ bằng một nửa n bình phương."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Bảng ký hiệu của cả khoá"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th></tr>
          <tr><td>$\lfloor x \rfloor,\ \lceil x \rceil$</td><td>làm tròn xuống, lên</td><td>số nguyên lớn nhất $\le x$; nhỏ nhất $\ge x$</td></tr>
          <tr><td>$O,\ \Omega,\ \Theta$</td><td>O lớn, Omega lớn, Theta lớn</td><td>chặn trên, chặn dưới, kẹp — có $\exists\, c, n_0$ và $\forall n \ge n_0$</td></tr>
          <tr><td>$T(n)$</td><td>T của n</td><td>số bước với kích thước $n$</td></tr>
          <tr><td>$\text{DP}[i][j]$</td><td>ô bảng</td><td>đáp số của bài con (đoạn, tiền tố…)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Ôn nhanh các ký hiệu của khoá. Hai ký hiệu móc là làm tròn xuống và làm tròn lên. Ba ký hiệu tiệm cận là chặn trên, chặn dưới và kẹp, luôn đi kèm tồn tại hằng số c, ngưỡng, và với mọi n từ ngưỡng trở đi. T của n là số bước với kích thước n. Ô của bảng quy hoạch động lưu đáp số của một bài con."

  # ───────────────────────── 3. BẢN ĐỒ HỆ THỨC ─────────────────────────
  - id: map_rec
    kind: concept
    title: "Gặp hệ thức nào, dùng công cụ nào"
    steps:
      - show: |
          <table class="t"><tr><th>dạng hệ thức</th><th>công cụ</th></tr>
          <tr><td>$T(n) = a\,T(n-1) + \dots$ (giảm 1)</td><td>thế ngược (bài 8) hoặc hàm sinh (bài 9)</td></tr>
          <tr><td>$a\,T(n/b) + f(n)$, $a$, $b$ hằng số</td><td>định lý thợ (bài 12) — kiểm khe hở, điều kiện đều đặn</td></tr>
          <tr><td>có $\sqrt{n}$ trong hệ số hay kích thước</td><td>đổi biến $n = 2^m$ (bài 11)</td></tr>
          <tr><td>cần chứng minh chặn trên</td><td>quy nạp, phần dư $R(n) \le 0$ (bài 10)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bản đồ cho hệ thức truy hồi như sau. Hệ thức giảm 1 thì thế ngược như bài Tháp Hà Nội, hoặc dùng hàm sinh gói cả dãy vào một biểu thức. Dạng a nhân T của n chia b với a, b hằng số thì tra định lý thợ, nhớ kiểm khe hở và điều kiện đều đặn. Có căn n trong hệ số hay kích thước thì đổi biến, đặt n bằng 2 mũ m. Cần chứng minh một chặn trên thì quy nạp, với phần dư không dương."

  - id: map_opt
    kind: concept
    title: "Gặp bài tối ưu nào, dùng chiến lược nào"
    steps:
      - show: |
          <table class="t"><tr><th>đặc điểm bài toán</th><th>chiến lược</th></tr>
          <tr><td>có lập luận đổi chỗ chứng minh được</td><td>tham lam (cái túi phân số, xếp lịch)</td></tr>
          <tr><td>bài con gối nhau, cấu trúc con tối ưu</td><td>quy hoạch động (đổi tiền, đặt ngoặc, dãy con)</td></tr>
          <tr><td>phải liệt kê mọi cấu hình</td><td>quay lui, có cắt tỉa</td></tr>
          <tr><td>tối ưu tổ hợp, có cận dưới tốt</td><td>nhánh cận (người du lịch)</td></tr>
          <tr><td>mục tiêu và ràng buộc tuyến tính</td><td>quy hoạch tuyến tính, đơn hình</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bản đồ cho bài tối ưu như sau. Nếu chứng minh được bằng lập luận đổi chỗ thì dùng tham lam, như cái túi phân số hay xếp lịch. Nếu có bài con gối nhau và cấu trúc con tối ưu thì dùng quy hoạch động. Nếu phải liệt kê mọi cấu hình thì quay lui có cắt tỉa. Bài tối ưu tổ hợp có một cận dưới tốt thì dùng nhánh cận. Còn khi mục tiêu và ràng buộc đều tuyến tính thì dùng quy hoạch tuyến tính và đơn hình."

  - id: intuition
    kind: intuition
    title: "Hình dung: cây đệ quy, mỗi tầng tốn đúng n bước"
    checks:
      - "[sum([8 // 2**L] * 2**L) for L in range(3)] == [8, 8, 8] and 4 + 4 == 8 and 4 * 2 == 8 and 3 * 8 == 24 and 8 * math.log2(8) == 24"
    steps:
      - show: |
          <svg width="1040" height="330" viewBox="0 0 1040 330"><line x1="378" y1="62" x2="202" y2="98" stroke="#9ca3af" stroke-width="3"/><line x1="378" y1="62" x2="554" y2="98" stroke="#9ca3af" stroke-width="3"/><line x1="202" y1="142" x2="114" y2="178" stroke="#9ca3af" stroke-width="3"/><line x1="202" y1="142" x2="290" y2="178" stroke="#9ca3af" stroke-width="3"/><line x1="554" y1="142" x2="466" y2="178" stroke="#9ca3af" stroke-width="3"/><line x1="554" y1="142" x2="642" y2="178" stroke="#9ca3af" stroke-width="3"/><line x1="114" y1="222" x2="70" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="114" y1="222" x2="158" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="290" y1="222" x2="246" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="290" y1="222" x2="334" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="466" y1="222" x2="422" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="466" y1="222" x2="510" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="642" y1="222" x2="598" y2="258" stroke="#9ca3af" stroke-width="3"/><line x1="642" y1="222" x2="686" y2="258" stroke="#9ca3af" stroke-width="3"/><rect x="323" y="18" width="110" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="378" y="49" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">8</text><rect x="152" y="98" width="100" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="202" y="129" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">4</text><rect x="504" y="98" width="100" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="554" y="129" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">4</text><rect x="74" y="178" width="80" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="114" y="209" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">2</text><rect x="250" y="178" width="80" height="44" rx="8" fill="#ef