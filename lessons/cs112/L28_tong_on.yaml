          <tr><td>① đếm và tiệm cận</td><td>hỏi số bước theo $n$, kí hiệu $O, \Omega, \Theta$, so bậc tăng tỉ số</td></tr>
          <tr><td>② hệ thức truy hồi</td><td>biểu thức $T(n)$ gọi lại kích thước nhỏ hơn ($n-1$, $n/b$, $\sqrt{n}$)</td></tr>
          <tr><td>③ chiến lược thiết kế</td><td>chia/giảm bài toán, thử mọi nhánh, hay chọn cục bộ ở mỗi bước</td></tr>
