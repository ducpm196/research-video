          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$2^{n+1}$ và $2^n$ có cùng bậc không? Còn $2^{2n}$?</td></tr>
          <tr><td>2</td><td>$T(n) = 3\,T(n/3) + 1$, $\ T(1) = 0$: tra định lý thợ.</td></tr>
          <tr><td>3</td><td>Mệnh giá 1, 4, 5, đổi 8: tham lam được mấy đồng? Tối ưu mấy đồng?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Đến lượt bạn với ba câu tổng hợp. Một, 2 mũ với số mũ là n cộng một và 2 mũ n có cùng bậc không, còn 2 mũ 2n thì sao? Hai, tra định lý thợ cho 3 nhân T của n chia 3, cộng 1. Ba, với mệnh giá 1, 4, 5, đổi 8 thì tham lam được mấy đồng, tối ưu mấy đồng? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① Chia hai hàm, xem tỉ số:</p>
          $$\frac{2^{n+1}}{2^n} = 2 \ \ (\text{hằng số}) \implies \text{cùng bậc}; \qquad \frac{2^{2n}}{2^n} = \frac{4^n}{2^n} = 2^n \to \infty \implies \text{không cùng bậc}$$
        introduces: [infty]
        focus: [1, 2, 2]
        say: "Câu một, tỉ số 2 mũ với số mũ là n cộng một, chia 2 mũ n, bằng 2, hằng số, nên cùng bậc, còn 2 mũ 2n bằng 4 mũ n thì tăng nhanh hẳn. Thật vậy, chia 2 mũ 2n cho 2 mũ n được 2 mũ n, tiến tới vô cùng, ký hiệu số tám nằm ngang. Một tỉ số tiến tới vô cùng nghĩa là hai hàm không cùng bậc."
      - show: |
          <p>② $a = 3$, $b = 3$, phần lá $n^{\log_3 3} = n$, còn $f(n) = 1 = O(n^{1 - \varepsilon})$ → trường hợp 1 → $\hlg{\Theta(n)}$. Thử bằng số:</p>
          <table class="t"><tr><th>$n$</th><th>3</th><th>9</th><th>27</th></tr>
          <tr><td>$T(n) = 3T(n/3) + 1$</td><td>$3 \cdot 0 + 1 = 1$</td><td>$3 \cdot 1 + 1 = 4$</td><td>$3 \cdot 4 + 1 = 13$</td></tr>
          <tr><td>$\frac{n - 1}{2}$</td><td>1</td><td>4</td><td>13</td></tr></table>
          <p class="note">$\varepsilon$ (đọc: ép-xi-lon) là một số dương nhỏ tuỳ ý, ví dụ $0{,}1$: khi đó $n^{1-\varepsilon} = n^{0{,}9}$.</p>
        focus: [1, 3, 1, "2.2", "2.3"]
        say: "Câu hai, phần lá là n, lớn hơn f bằng 1 một lũy thừa, nên trường hợp một, Theta của n. Ở đây ép-xi-lon là một số dương nhỏ tuỳ ý, ví dụ 0 phẩy 1. Thử T của 27 bằng 13. Tính xuôi từ T của 1 bằng 0, ta được 1, 4, rồi 13. Cả ba số đều bằng n trừ 1 chia 2, đúng là tăng tuyến tính theo n."
      - clear: true
        show: |
          <p>③ Đổi 8 với mệnh giá 1, 4, 5. Tham lam: $5 + 1 + 1 + 1$ → 4 đồng. Quy hoạch động: $d[a] = 1 + \min(d[a - 1], d[a - 4], d[a - 5])$:</p>
          <table class="t"><tr><th>$a$</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr>
          <tr><th>$d[a]$</th><td>0</td><td>1</td><td>2</td><td>3</td><td>1</td><td>1</td><td>2</td><td>3</td><td>$\hlg{2}$</td></tr></table>
          <p class="note">$d[8] = 1 + \min(d[7], d[4], d[3]) = 1 + \min(3, 1, 3) = 2$: hai đồng 4.</p>
        introduces: [min_fn]
        focus: [1, 1, 3]
        say: "Câu ba, tham lam lấy 5 rồi ba đồng 1, tổng 4 đồng, còn quy hoạch động tìm ra hai đồng 4. Ô d của a, số đồng ít nhất để đổi a, bằng 1 cộng số nhỏ nhất trong ba ô lùi lại 1, 4 và 5. Riêng ô 8 bằng 1 cộng số nhỏ nhất của 3, 1 và 3, tức 2, ứng với hai đồng 4."

