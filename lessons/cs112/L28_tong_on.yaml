ill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="686" y="289" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><text x="770" y="49" font-size="26" font-weight="700" fill="#15803d">tầng 0: 8 bước</text><text x="770" y="129" font-size="26" font-weight="700" fill="#15803d">tầng 1: 4 + 4 = 8</text><text x="770" y="209" font-size="26" font-weight="700" fill="#15803d">tầng 2: 4 lần 2 = 8</text><text x="770" y="289" font-size="26" font-weight="700" fill="#6b7280">8 lá: mỗi lá 0</text></svg>
          <p>3 tầng có việc, mỗi tầng 8 bước: $\ 3 \cdot 8 = 24 = 8\log_2 8$. Tổng quát: $\log_2 n$ tầng, mỗi tầng $n$ bước.</p>
        focus: [1, 1, 1, 1, 2, 2]
        say: "Trước khi giải ví dụ, hãy nhìn cây đệ quy của hàm làm n bước rồi gọi hai nửa, với n bằng 8. Ở gốc, tức tầng 0, hàm làm 8 bước, rồi tách thành hai lời gọi kích thước 4. Ở tầng 1 có hai hộp, mỗi hộp 4 bước, cộng lại vẫn là 8. Tầng 2 có bốn hộp kích thước 2, lại cộng thành 8, còn tám lá kích thước 1 không tốn bước nào. Vậy có 3 tầng có việc, mỗi tầng 8 bước, tổng 24, đúng bằng 8 nhân lôgarit cơ số 2 của 8. Tổng quát, cây có lôgarit cơ số 2 của n tầng, mỗi tầng n bước, nên ra n lôgarit n."

  # ───────────────────────── 4. VÍ DỤ TỔNG HỢP ─────────────────────────
  - id: example
    kind: example
    title: "Một ví dụ đi qua nhiều bài"
    checks:
      - "(lambda T: [T(T, 2**k) for k in range(5)] == [2**k * k for k in range(5)] == [0, 2, 8, 24, 64])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + n)"
      - "2*0 + 2 == 2 == 2*1 and 2*2 + 4 == 8 == 4*2 and 2*8 + 8 == 24 == 8*3 and math.log(2, 2) == 1"
    steps:
      - show: |
          <div class="code"><div>f(A, n):</div><div>    <span class="kw">if</span> n == 1: <span class="kw">return</span></div><div>    <span class="kw">for</span> i = 1..n: làm 1 bước         <span class="cm">// n bước</span></div><div>    f(nửa trái, n/2);  f(nửa phải, n/2)   <span class="cm">// cả hai đều chạy</span></div></div>
          <p><b>Bước 1</b> — đếm theo nhánh: $a = 2$, $b = 2$, $f(n) = n$ → $T(n) = 2T(n/2) + n$, $T(1) = 0$.</p>
        focus: [0, ["1.3", "1.4"], 2]
        say: "Một ví dụ đi qua nhiều bài. Hàm này làm n bước, rồi gọi đệ quy cả hai nửa, cả hai lời gọi đều chạy. Bước một, đếm theo nhánh như bài 10, a bằng 2, b bằng 2, f của n bằng n."
      - show: |
          <p><b>Bước 2</b> — định lý thợ: phần lá $n^{\log_2 2} = n^1 = n$, đúng bằng $f(n)$:</p>
          $$f(n) = n = n^{\log_2 2} \implies \text{trường hợp 2} \implies T(n) \in \Theta(n\log_2 n)$$
        introduces: [in]
        focus: [1, 2, 2]
        say: "Bước hai, tra định lý thợ của bài 12, vì lôgarit cơ số 2 của 2 bằng 1, phần lá bằng n mũ 1, tức n. Phần lá bằng đúng f, nên rơi vào trường hợp hai. Ký hiệu chữ e cách điệu đọc là thuộc, T của n thuộc lớp Theta của n lôgarit n."
      - clear: true
        show: |
          <p><b>Bước 3</b> — kiểm bằng số, tính xuôi từ $T(1) = 0$:</p>
          <table class="t"><tr><th>$n$</th><th>$T(n) = 2T(n/2) + n$</th><th>$n\log_2 n$</th></tr>
          <tr><td>2</td><td>$2 \cdot 0 + 2 = 2$</td><td>$2 \cdot 1 = 2$</td></tr>
          <tr><td>4</td><td>$2 \cdot 2 + 4 = 8$</td><td>$4 \cdot 2 = 8$</td></tr>
          <tr><td>8</td><td>$2 \cdot 8 + 8 = \hlg{24}$</td><td>$8 \cdot 3 = 24$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, kiểm bằng số, tính xuôi từ T của 1 bằng 0. T của 2 bằng 2 nhân 0 cộng 2, bằng 2, khớp 2 nhân 1. T của 4 bằng 2 nhân 2 cộng 4, bằng 8, khớp 4 nhân 2. T của 8 bằng 2 nhân 8 cộng 8, bằng 24, khớp 8 nhân 3, đúng 8 nhân lôgarit cơ số 2 của 8."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Thói quen tự kiểm cho mọi dạng bài"
    checks:
      - "(lambda cnt: cnt(cnt, 8) == 24 == 2*8 + 8 == 3*8 == 8 + 2*4 + 4*2)(lambda f, n: 0 if n == 1 else n + 2 * f(f, n // 2))"
    steps:
      - show: |
          <table class="t"><tr><th>thói quen</th><th>làm gì</th></tr>
          <tr><td>1</td><td><b>Đếm tay với $n$ nhỏ</b> trước khi viết công thức.</td></tr>
          <tr><td>2</td><td><b>Thay số ngược</b> vào hệ thức, vào ràng buộc, vào định nghĩa.</td></tr>
          <tr><td>3</td><td><b>So với vét cạn</b> trên dữ liệu nhỏ khi có thể.</td></tr>
          <tr><td>4</td><td>Với tiệm cận: <b>lấy giới hạn tỉ số</b>, đừng tin vài giá trị đầu.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bốn thói quen tự kiểm dùng được cho mọi dạng bài, vì mỗi cái bắt một kiểu sai khác nhau. Một, đếm tay với n nhỏ trước khi viết công thức. Hai, thay số ngược vào hệ thức, vào ràng buộc, vào định nghĩa. Ba, so với vét cạn trên dữ liệu nhỏ khi có thể. Bốn, với tiệm cận thì lấy giới hạn của tỉ số, đừng tin vài giá trị đầu."
      - clear: true
        show: |
          <p>Áp dụng cho ví dụ $T(n) = 2T(n/2) + n$, ba đường độc lập phải cho cùng một số ở $n = 8$:</p>
          <table class="t"><tr><th>đường</th><th>cách tính</th><th>$T(8)$</th></tr>
          <tr><td>tính xuôi hệ thức</td><td>$2 \cdot 8 + 8$</td><td>24</td></tr>
          <tr><td>cộng theo tầng của cây</td><td>3 tầng, mỗi tầng 8</td><td>24</td></tr>
          <tr><td>đếm thẳng mọi vòng lặp khi chạy</td><td>$8 + 2 \cdot 4 + 4 \cdot 2$</td><td>24</td></tr></table>
          <p class="note">Ba số trùng nhau là một bằng chứng; chỉ một đường thì chưa đủ.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.4", 3]
        say: "Áp dụng cho ví dụ vừa rồi, ba đường độc lập phải cho cùng một con số ở n bằng 8. Đường thứ nhất là tính xuôi hệ thức, 2 nhân 8 cộng 8, bằng 24. Đường thứ hai là cộng theo tầng của cây đệ quy, 3 tầng, mỗi tầng 8 bước, cũng là 24. Đường thứ ba là đếm thẳng mọi vòng lặp khi chạy, lời gọi gốc chạy 8 vòng. Hai lời gọi kích thước 4 chạy mỗi lời 4 vòng, bốn lời gọi kích thước 2 chạy mỗi lời 2 vòng, tổng lại 24. Ba con số trùng nhau là một bằng chứng, còn chỉ một đường thì chưa đủ."

  # ───────────────────────── 6. BẪY ─────────────────────────
  - id: traps
    kind: pitfall
    title: "Mười chín bẫy đã gặp, mỗi bẫy một phép thử"
    checks:
      - "(4 + 32 + 4) // 4 == 10 and 2**(2*3) == 4**3 and 1 - ((1 - 1) - 1) == 2"
      - "alg.qs_count(range(1, 7)) == 6 * 5 // 2 == 15 and 3 + 3 == 6 and 3 + 5 == 8 and alg.dijkstra({'S': {'A': 2, 'B': 3}, 'A': {}, 'B': {'A': -2}}, 'S')[0]['A'] == 2"
    steps:
      - show: |
          <table class="t"><tr><th>bẫy</th><th>phép thử</th></tr>
          <tr><td>1. vòng lặp so sánh $n$ lần (thật ra $n + 1$)</td><td>thử $n = 0$</td></tr>
          <tr><td>2. quên đoạn rỗng khi đếm từ $n - y$ đến $y$</td><td>thấy số lần âm → đoạn rỗng</td></tr>
          <tr><td>3. định nghĩa tiệm cận thiếu “tồn tại $c$, $n_0$”, “với mọi $n \ge n_0$”</td><td>đọc to đủ hai vế lời hứa</td></tr>
          <tr><td>4. coi $2^{2n}$ cùng bậc $2^n$</td><td>đổi thành $4^n$ rồi chia</td></tr>
          <tr><td>5. đọc nhầm lôgarit mũ 10 hai kiểu</td><td>viết ngoặc rõ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Giờ là mười chín bẫy đã gặp, mỗi bẫy kèm một phép thử. Bẫy một, nói vòng lặp so sánh n lần, thật ra là n cộng 1, thử với n bằng 0. Bẫy hai, quên đoạn rỗng khi đếm, thấy số lần âm là biết đoạn rỗng. Bẫy ba, viết định nghĩa tiệm cận thiếu phần tồn tại hay phần với mọi, hãy đọc to đủ cả hai vế của lời hứa. Bẫy bốn, coi 2 mũ 2n cùng bậc với 2 mũ n, hãy đổi thành 4 mũ n rồi chia. Bẫy năm, đọc nhầm hai cách viết lôgarit mũ 10, hãy viết ngoặc rõ ràng."
      - clear: true
        show: |
          <table class="t"><tr><th>bẫy</th><th>phép thử</th></tr>
          <tr><td>6. thế ngược dừng ở $i = n$, dùng $T(0)$ đề không cho</td><td>dừng ở điều kiện đầu đã cho</td></tr>
          <tr><td>7. đếm số dòng gọi đệ quy thay vì số lời gọi thực sự chạy</td><td>đọc theo nhánh nếu, ngược lại</td></tr>
          <tr><td>8. quy nạp có phần dư dương vẫn kết luận</td><td>kiểm $R(n) \le 0$; dư dương thì làm mạnh giả thiết</td></tr>
          <tr><td>9. định lý thợ quên $c < 1$, hay ép khe hở như $n\log n$</td><td>tỉ số phải hơn hẳn một lũy thừa</td></tr>
          <tr><td>10. quay lui quên trả lại đánh dấu</td><td>đếm số nghiệm với $n$ nhỏ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Tiếp theo là năm cái bẫy nữa. Bẫy sáu, thế ngược tới i bằng n rồi dùng T của 0 mà đề không cho, phải dừng đúng ở điều kiện đầu. Bẫy bảy, đếm số dòng gọi đệ quy thay vì số lời gọi thực sự chạy, hãy đọc theo từng nhánh. Bẫy tám, quy nạp có phần dư dương mà vẫn kết luận, phải kiểm phần dư không dương, hoặc làm mạnh giả thiết. Bẫy chín, dùng định lý thợ mà quên c nhỏ hơn 1, hay ép một hệ thức rơi vào khe hở. Bẫy mười, quay lui quên trả lại đánh dấu, hãy đếm số nghiệm với n nhỏ."
      - clear: true
        show: |
          <table class="t"><tr><th>bẫy</th><th>phép thử</th></tr>
          <tr><td>11. nhánh cận lấy min cột trên ma trận gốc</td><td>cận dưới không được vượt một chu trình đã biết</td></tr>
          <tr><td>12. tham lam không chứng minh (cái túi 0/1, đổi tiền 1, 3, 4)</td><td>tìm phản ví dụ nhỏ, so vét cạn</td></tr>
          <tr><td>13. bảng theo đoạn điền theo hàng</td><td>ô cần dùng đã có chưa?</td></tr>
          <tr><td>14. đặt ngoặc chỉ lấy max khi có phép trừ</td><td>$1 - 1 - 1 - 1$: max thật là 2</td></tr>
          <tr><td>15. quy hoạch tuyến tính lấy giao điểm với trục làm đỉnh, quên $x \ge 0$</td><td>thay đỉnh vào mọi ràng buộc</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Sau đó là năm cái bẫy tiếp theo. Bẫy mười một, nhánh cận lấy số nhỏ nhất của cột trên ma trận gốc, phép thử là cận dưới không được vượt chi phí một chu trình đã biết. Bẫy mười hai, dùng tham lam không chứng minh, hãy tìm phản ví dụ nhỏ và so với vét cạn. Bẫy mười ba, điền bảng theo đoạn theo từng hàng, hãy hỏi ô cần dùng đã có chưa. Bẫy mười bốn, đặt ngoặc chỉ lấy giá trị lớn nhất khi có phép trừ, thử với 1 trừ 1 trừ 1 trừ 1. Bẫy mười lăm, trong quy hoạch tuyến tính lấy giao điểm với trục làm đỉnh hay quên điều kiện không âm, hãy thay mỗi đỉnh vào mọi ràng buộc."
      - clear: true
        show: |
          <table class="t"><tr><th>bẫy</th><th>phép thử</th></tr>
          <tr><td>16. “sắp xếp nhanh luôn $n\log_2 n$”</td><td>thử mảng đã sắp: $n = 6$ tốn 15 so sánh</td></tr>
          <tr><td>17. chốt đỉnh gần nhất khi có cạnh âm</td><td>tìm cạnh âm trước khi chọn thuật toán</td></tr>
          <tr><td>18. coi cây khung nhỏ nhất là cây đường đi ngắn nhất</td><td>tam giác 3, 3, 5: tổng 6 khác 8</td></tr>
          <tr><td>19. quy dẫn ngược chiều; hiểu NP là “không đa thức”</td><td>viết rõ: bài đã biết khó quy dẫn <b>về</b> bài mới</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Cuối cùng là bốn cái bẫy của phần sắp xếp, đồ thị và độ khó. Bẫy mười sáu, nói sắp xếp nhanh luôn tốn n lôgarit n, hãy thử mảng đã sắp, sáu phần tử tốn tới 15 phép so sánh. Bẫy mười bảy, dùng thuật toán chốt đỉnh gần nhất khi có cạnh âm, hãy tìm cạnh âm trước khi chọn thuật toán. Bẫy mười tám, coi cây khung nhỏ nhất là cây đường đi ngắn nhất, thử tam giác 3, 3, 5 thấy tổng 6 khác 8. Bẫy mười chín, quy dẫn ngược chiều hay hiểu NP là không đa thức, hãy viết rõ bài đã biết khó quy dẫn về bài mới."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: ba câu tổng hợp"
    checks:
      - "sp.simplify(2**(sp.Symbol('n') + 1) / 2**sp.Symbol('n')) == 2"
      - "(lambda U: [U(U, 3**k) for k in range(5)] == [(3**k - 1)//2 for k in range(5)])(lambda f, n: 0 if n == 1 else 3*f(f, n//3) + 1)"
      - "__import__('functools').reduce(lambda d, a: d + [1 + min(d[a - c] for c in (1, 4, 5) if c <= a)], range(1, 9), [0])[8] == 2 and 8 // 5 + (8 % 5) // 4 + (8 % 5) % 4 == 4"
      - "__import__('functools').reduce(lambda d, a: d + [1 + min(d[a - c] for c in (1, 4, 5) if c <= a)], range(1, 9), [0]) == [0, 1, 2, 3, 1, 1, 2, 3, 2] and 1 + min(3, 1, 3) == 2"
      - "3*0 + 1 == 1 and 3*1 + 1 == 4 and 3*4 + 1 == 13 and [(n - 1) // 2 for n in (3, 9, 27)] == [1, 4, 13] and 2**(2*5) // 2**5 == 2**5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$2^{n+1}$ và $2^n$ có cùng bậc không? Còn $2^{2n}$?</td></tr>
          <tr><td>2</td><td>$T(n) = 3\,T(n/3) + 1$, $\ T(1) = 0$: tra định lý thợ.</td></tr>
          <tr><td>3</td><td>Mệnh giá 1, 4, 5, đổi 8: tham lam được mấy đồng? Tối ưu mấy đồng?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Đến lượt bạn với ba câu tổng hợp. Một, 2 mũ n cộng 1 và 2 mũ n có cùng bậc không, còn 2 mũ 2n thì sao? Hai, tra định lý thợ cho 3 nhân T của n chia 3, cộng 1. Ba, với mệnh giá 1, 4, 5, đổi 8 thì tham lam được mấy đồng, tối ưu mấy đồng? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① Chia hai hàm, xem tỉ số:</p>
          $$\frac{2^{n+1}}{2^n} = 2 \ \ (\text{hằng số}) \implies \text{cùng bậc}; \qquad \frac{2^{2n}}{2^n} = \frac{4^n}{2^n} = 2^n \to \infty \implies \text{không cùng bậc}$$
        introduces: [infty]
        focus: [1, 2, 2]
        say: "Câu một, tỉ số 2 mũ n cộng 1 chia 2 mũ n bằng 2, hằng số, nên cùng bậc, còn 2 mũ 2n bằng 4 mũ n thì tăng nhanh hẳn. Thật vậy, chia 2 mũ 2n cho 2 mũ n được 2 mũ n, tiến tới vô cùng, ký hiệu số tám nằm ngang. Một tỉ số tiến tới vô cùng nghĩa là hai hàm không cùng bậc."
      - show: |
          <p>② $a = 3$, $b = 3$, phần lá $n^{\log_3 3} = n$, còn $f(n) = 1 = O(n^{1 - \varepsilon})$ → trường hợp 1 → $\hlg{\Theta(n)}$. Thử bằng số:</p>
          <table class="t"><tr><th>$n$</th><th>3</th><th>9</th><th>27</th></tr>
          <tr><td>$T(n) = 3T(n/3) + 1$</td><td>$3 \cdot 0 + 1 = 1$</td><td>$3 \cdot 1 + 1 = 4$</td><td>$3 \cdot 4 + 1 = 13$</td></tr>
          <tr><td>$\frac{n - 1}{2}$</td><td>1</td><td>4</td><td>13</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Câu hai, phần lá là n, lớn hơn f bằng 1 một lũy thừa, nên trường hợp một, Theta của n, thử T của 27 bằng 13. Ở đây a bằng b bằng 3, nên phần lá là n mũ lôgarit cơ số 3 của 3, tức n mũ 1. Tính xuôi từ T của 1 bằng 0, ta được 1, 4, rồi 13. Cả ba số đều bằng n trừ 1 chia 2, đúng là tăng tuyến tính theo n."
      - clear: true
        show: |
          <p>③ Đổi 8 với mệnh giá 1, 4, 5. Tham lam: $5 + 1 + 1 + 1$ → 4 đồng. Quy hoạch động: $d[a] = 1 + \min(d[a - 1], d[a - 4], d[a - 5])$:</p>
          <table class="t"><tr><th>$a$</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr>
          <tr><th>$d[a]$</th><td>0</td><td>1</td><td>2</td><td>3</td><td>1</td><td>1</td><td>2</td><td>3</td><td>$\hlg{2}$</td></tr></table>
          <p class="note">$d[8] = 1 + \min(d[7], d[4], d[3]) = 1 + \min(3, 1, 3) = 2$: hai đồng 4.</p>
        introduces: [min_fn]
        focus: [1, 1, "2.2", 3]
        say: "Câu ba, tham lam lấy 5 rồi ba đồng 1, tổng 4 đồng, còn quy hoạch động tìm ra hai đồng 4. Bảng quy hoạch động lưu d của a, số đồng ít nhất để đổi a, bằng 1 cộng số nhỏ nhất trong ba ô lùi lại 1, 4 và 5. Điền từ 0 tới 8 được 0, 1, 2, 3, 1, 1, 2, 3, 2. Riêng ô 8 bằng 1 cộng số nhỏ nhất của 3, 1 và 3, tức 2, ứng với hai đồng 4."

