#   Không nêu thang điểm, thời lượng hay quy định phòng thi (nguồn không kiểm được).
objectives:
  - "Mô tả sáu nhóm dạng bài (đếm và tiệm cận, hệ thức truy hồi, chiến lược thiết kế, quy hoạch động, quy hoạch tuyến tính, sắp xếp – đồ thị – độ khó) và dấu hiệu để xếp một bài vào nhóm"
  - "Chọn đúng công cụ cho từng dạng hệ thức truy hồi"
  - "Nêu mười chín bẫy đã gặp và phép thử bắt từng bẫy"
  - "Đếm số bước của hai cách làm cùng một việc khi n tăng từ 1024 tới 131072 và chọn công cụ theo bậc tăng"
  - "Viết chương trình kiểm ba hệ thức truy hồi bằng tỉ số với hàm chuẩn chọn từ định lý thợ, và kiểm bẫy tham lam"
