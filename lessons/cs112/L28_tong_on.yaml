scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai mươi tám bài, sáu nhóm dạng bài"
    steps:
      - show: |
          <table class="t"><tr><th>nhóm</th><th>công cụ chính</th></tr>
          <tr><td>① đếm và tiệm cận</td><td>đếm số bước, tổng Sigma (cộng lại nhiều số hạng), O, Ω, Θ, giới hạn tỉ số</td></tr>
          <tr><td>② hệ thức truy hồi</td><td>thế ngược, hàm sinh, đổi biến, định lý thợ, quy nạp</td></tr>
          <tr><td>③ chiến lược thiết kế</td><td>chia, giảm, biến đổi để trị; quay lui; nhánh cận; tham lam</td></tr>
          <tr><td>④ quy hoạch động</td><td>bảng một chiều, bảng hai chiều, bảng theo đoạn</td></tr>
          <tr><td>⑤ quy hoạch tuyến tính</td><td>vẽ miền, thử đỉnh, đơn hình</td></tr>
          <tr><td>⑥ sắp xếp, đồ thị, độ khó</td><td>cây quyết định; nới cạnh; tính chất lát cắt, hợp–tìm; quy dẫn</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", ["1.5", "1.6"], "1.7"]
        say: "Chào bạn, đây là bài tổng ôn, nơi ta xếp hai mươi tám bài vào sáu nhóm. Nhóm một là đếm và tiệm cận. Nhóm hai là các hệ thức truy hồi và cách giải chúng. Nhóm ba là các chiến lược thiết kế, từ chia để trị tới tham lam. Nhóm bốn là quy hoạch động, còn nhóm năm là quy hoạch tuyến tính. Nhóm sáu là sắp xếp, đồ thị và độ khó của bài toán, với cây quyết định và phép quy dẫn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: lôgarit, định lý thợ và bốn từ của bài 8 tới bài 14"
    checks:
      - "2**3 == 8 and math.log2(8) == 3 and 3**1 == 3 and math.log(3, 3) == 1"
      - "all(n - 1 == (lambda f: f(f, n))(lambda f, k: 0 if k == 1 else f(f, k - 1) + 1) for n in range(1, 30)) and all(abs(2 * (n / 2) * math.log2(n / 2) + n - n * math.log2(n) - (n - 1 * n)) < 1e-9 for n in (8, 16, 64, 1024))"
      - "(lambda n: sp.limit(1 / n, n, sp.oo) == 0 and sp.simplify(n / n) == 1 and sp.limit(n**2 / n, n, sp.oo) == sp.oo and 2 * (n / 2)**2 == n**2 / 2)(sp.Symbol('n', positive=True))"
      - "(lambda T: [T(T, 2**k) for k in range(1, 6)] == [2**k - 1 for k in range(1, 6)])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 1)"
    steps:
      - show: |
          <p>Lôgarit trả lời câu hỏi “mũ mấy?”: $\ 2^3 = 8 \implies \log_2 8 = 3$; $\ 3^1 = 3 \implies \log_3 3 = 1$.</p>
          <p>Định lý thợ cho $T(n) = a\,T(n/b) + f(n)$: so $f(n)$ với <b>phần lá</b> $n^{\log_b a}$. Với $a = b = 2$, phần lá là $n^{\log_2 2} = n$:</p>
          <table class="t"><tr><th>hệ thức</th><th>$f(n)$ so với $n$</th><th>trường hợp</th><th>kết quả</th></tr>
          <tr><td>$2T(n/2) + 1$</td><td>nhỏ hơn hẳn một lũy thừa</td><td>1</td><td>$\Theta(n)$</td></tr>
          <tr><td>$2T(n/2) + n$</td><td>bằng nhau</td><td>2</td><td>$\Theta(n\log_2 n)$</td></tr>
          <tr><td>$2T(n/2) + n^2$</td><td>lớn hơn hẳn, và $2(n/2)^2 = \frac{1}{2}n^2$ đều đặn</td><td>3</td><td>$\Theta(n^2)$</td></tr></table>
        introduces: [implies, frac]
        focus: [0, 1, 2, "3.2", "3.3", "3.4"]
        say: "Trước khi ôn cả khoá, nhắc lại hai công cụ dùng nhiều nhất. Lôgarit trả lời câu hỏi mũ mấy, 2 mũ 3 bằng 8 nên lôgarit cơ số 2 của 8 bằng 3. Định lý thợ so phần việc mỗi tầng f của n với phần lá, n mũ lôgarit cơ số b của a, với a bằng b bằng 2 thì phần lá chính là n. Nếu f bằng 1, nhỏ hơn hẳn một lũy thừa, đó là trường hợp một, Theta của n. Nếu f bằng n, bằng phần lá, đó là trường hợp hai, Theta của n lôgarit n. Nếu f bằng n bình phương, lớn hơn hẳn phần lá, đó là trường hợp ba, Theta của n bình phương."

      - clear: true
        show: |
          <table class="t"><tr><th>từ</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td><b>thế ngược</b> (bài 8)</td><td>thay $T(n)$ bằng vế phải, lặp lại tới điều kiện đầu</td><td>$T(n) = T(n-1) + 1$, $T(1) = 0$ cho $T(n) = n - 1$</td></tr>
          <tr><td><b>quy nạp</b> (bài 10)</td><td>thế giả thiết vào hệ thức; <b>phần dư</b> $R(n)$ = vế phải mới trừ đích, phải $\le 0$</td><td>$T(n) = 2T(n/2) + n \le c\,n\log_2 n$: $R(n) = n - c\,n \le 0$ khi $c \ge 1$</td></tr>
          <tr><td><b>khe hở</b> (bài 12)</td><td>$f$ chỉ hơn phần lá một hệ số lôgarit, không hơn hẳn một lũy thừa</td><td>$f = n\log_2 n$ so với phần lá $n$</td></tr>
          <tr><td><b>quay lui</b> (bài 14)</td><td>đánh dấu khi đi tới, phải bỏ đánh dấu khi quay về</td><td>quên bỏ: liệt kê hoán vị chỉ ra 1 nghiệm thay vì $n!$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Các bẫy dưới đây dùng bốn từ của các bài trước. Thế ngược ở bài 8 là thay T của n bằng vế phải, lặp lại tới điều kiện đầu. Quy nạp ở bài 10 là thế giả thiết vào hệ thức, phần dư phải không dương. Khe hở ở bài 12 là f chỉ hơn phần lá một hệ số lôgarit, nên ba trường hợp không dùng được. Quay lui ở bài 14 đánh dấu khi đi tới và phải bỏ đánh dấu khi quay về."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Bảng ký hiệu của cả khoá"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th></tr>
          <tr><td>$\lfloor x \rfloor,\ \lceil x \rceil$</td><td>làm tròn xuống, lên</td><td>số nguyên lớn nhất $\le x$; nhỏ nhất $\ge x$</td></tr>
          <tr><td>$O,\ \Omega,\ \Theta$</td><td>O lớn, Omega lớn, Theta lớn</td><td>chặn trên, chặn dưới, kẹp — có $\exists\, c, n_0$ và $\forall n \ge n_0$</td></tr>
          <tr><td>$T(n)$</td><td>T của n</td><td>số bước với kích thước $n$</td></tr>
          <tr><td>$\text{DP}[i][j]$</td><td>ô bảng</td><td>đáp số của bài con (đoạn, phần đầu…)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Ôn nhanh các ký hiệu của khoá. Hai ký hiệu móc là làm tròn xuống và làm tròn lên. Ba ký hiệu tiệm cận là chặn trên, chặn dưới và kẹp, luôn đi kèm tồn tại hằng số c, ngưỡng, và với mọi n từ ngưỡng trở đi. T của n là số bước với kích thước n. Ô của bảng quy hoạch động lưu đáp số của một bài con."

  # ───────────────────────── 3. BẢN ĐỒ HỆ THỨC ─────────────────────────
  - id: map_rec
    kind: formula
    title: "Gặp hệ thức nào, dùng công cụ nào"
    steps:
      - show: |
          <table class="t"><tr><th>dạng hệ thức</th><th>công cụ</th></tr>
          <tr><td>$T(n) = a\,T(n-1) + \dots$ (giảm 1)</td><td>thế ngược (bài 8) hoặc hàm sinh (bài 9)</td></tr>
          <tr><td>$a\,T(n/b) + f(n)$, $a$, $b$ hằng số</td><td>định lý thợ (bài 12) — kiểm khe hở, điều kiện đều đặn</td></tr>
          <tr><td>có $\sqrt{n}$ trong hệ số hay kích thước</td><td>đổi biến $n = 2^m$ (bài 11)</td></tr>
          <tr><td>cần chứng minh chặn trên</td><td>quy nạp, phần dư $R(n) \le 0$ (bài 10)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bản đồ cho hệ thức truy hồi như sau. Hệ thức giảm 1 thì thế ngược, hoặc dùng hàm sinh gói cả dãy vào một biểu thức. Dạng a nhân T của n chia b với a, b hằng số thì tra định lý thợ, nhớ kiểm khe hở và điều kiện đều đặn. Có căn n trong hệ số hay kích thước thì đổi biến, đặt n bằng 2 mũ m. Cần chứng minh một chặn trên thì quy nạp, với phần dư không dương."

  - id: map_opt
