        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Tiếp theo là năm bẫy nữa. Bẫy mười một, nhánh cận lấy số nhỏ nhất của cột trên ma trận gốc, cận dưới không được vượt chi phí một chu trình đã biết. Bẫy mười hai, dùng tham lam không chứng minh, hãy tìm phản ví dụ nhỏ và so với vét cạn. Bẫy mười ba, điền bảng theo đoạn theo từng hàng, hãy hỏi ô cần dùng đã có chưa. Bẫy mười bốn, đặt ngoặc chỉ lấy giá trị lớn nhất khi có phép trừ, thử với 1 trừ 1 trừ 1 trừ 1. Bẫy mười lăm, trong quy hoạch tuyến tính lấy giao điểm với trục làm đỉnh hay quên điều kiện không âm, hãy thay mỗi đỉnh vào mọi ràng buộc."
