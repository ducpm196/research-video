course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 12 — Chia để trị & định lý thợ (Master theorem)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L12 (bản thảo); audit/cs112/verify_cs112.py C18, C18b, C18c; phát biểu ba trường hợp theo Cormen, Leiserson, Rivest, Stein, Introduction to Algorithms, mục 4.5"
assumes: [cdot, sub, dots, log, bigO, bigOmega, bigTheta, in]
# Quy ước: hệ thức T(n) = a·T(n/b) + f(n) với a ≥ 1, b > 1 là HẰNG SỐ (b không cần nguyên); n^(log_b a) đọc “n mũ lôgarit cơ số b
#   của a”; ε (ép-xi-lôn) là một số dương nhỏ cố định; chỉ xét n là lũy thừa của b khi tính bảng số.
# Sửa bản thảo (AUDIT_CS112 §2, C18): trường hợp 3 cần a·f(n/b) ≤ c·f(n) với c < 1; b là hằng số thực > 1; có khe hở giữa các
#   trường hợp (2T(n/2) + n log n không thuộc trường hợp nào, nghiệm Θ(n log² n)).
# Nối bài trước (luật 17): bài 0 — a^(log_b n) = n^(log_b a); bài 10 — hệ số a là số lời gọi thực sự chạy, tìm kiếm nhị phân
#   T(n) = T(n/2) + 1 ra lôgarit, tìm max chia đôi T(n) = 2T(n/2) + 1 ra n − 1; bài 11 — các công thức này cần a là hằng số.
objectives:
  - "Nhận ra ba bước chia, trị, kết hợp và viết hệ thức a·T(n/b) + f(n) cho một thuật toán chia để trị"
  - "So f(n) với n^(log_b a) để chọn đúng một trong ba trường hợp của định lý thợ"
  - "Kiểm điều kiện đều đặn ở trường hợp 3 và nhận ra hệ thức rơi vào khe hở"
asr_reviewed:
  - {sentence: "Tỉ số tiến về hằng số 2, nên đáp án đúng bậc.", reason: "tỉ/tỷ là chính tả; hằng/hàng, bậc/bật là cặp ASR nhầm lặp lại ở nhiều câu (mục tham khảo)"}
  - {sentence: "Trường hợp một, lá thắng, khi f nhỏ hơn hẳn n mũ lôgarit cơ số b của a, nhỏ hơn cả một lũy thừa, nghiệm là Theta của n mũ lôgarit cơ số b của a.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Tầng lá nằm ở độ sâu lôgarit cơ số b của n, theo đẳng thức vừa ôn, số lá bằng n mũ lôgarit cơ số b của a.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
  - {sentence: "Hơn kém nhau chỉ một thừa số lôgarit thì không đủ.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
  - {sentence: "Lỗi thứ nhất, ép hệ thức 2 nhân T của n chia 2, cộng n lôgarit n, vào trường hợp ba hay hai.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
  - {sentence: "Câu một, phần lá là n bình phương, lớn hơn f một lũy thừa, nên trường hợp một, Theta của n bình phương.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Câu hai, phần lá bằng n, bằng f, nên trường hợp hai, Theta của n lôgarit n.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
  - {sentence: "Trường hợp ba, gốc thắng, khi f lớn hơn hẳn một lũy thừa, nghiệm là Theta của f.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Nên n mũ lôgarit bằng n mũ 0, tức 1, và theo trường hợp hai, nghiệm là Theta của lôgarit n.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một công thức tra cho cả họ hệ thức"
    steps:
      - show: |
          <table class="t"><tr><th>thuật toán</th><th>hệ thức</th></tr>
          <tr><td>tìm kiếm nhị phân (bài 10)</td><td>$T(n) = T(n/2) + 1$</td></tr>
          <tr><td>tìm max chia đôi (bài 10)</td><td>$T(n) = 2T(n/2) + 1$</td></tr>
          <tr><td>sắp xếp trộn</td><td>$T(n) = 2T(n/2) + n$</td></tr></table>
          <p>Cùng dạng $\ a\,T(n/b) + f(n)$. Thay vì thế ngược từng bài: <b>một công thức tra</b>.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Chào bạn, nhìn bảng này. Tìm kiếm nhị phân ở bài 10 có hệ thức T của n chia 2, cộng 1. Tìm số lớn nhất bằng chia đôi, cũng ở bài 10, có hai lời gọi nửa kích thước, cộng 1. Sắp xếp trộn, học hôm nay, có hai lời gọi nửa kích thước, cộng n. Tất cả cùng dạng a nhân T của n chia b, cộng f của n, nên thay vì thế ngược từng bài, ta sẽ có một công thức để tra."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn bài 0: đổi chỗ cơ số và số mũ"
    checks:
      - "4**int(math.log2(8)) == 8**int(math.log2(4)) == 64 and abs(math.log(8, 2) - 3) < 1e-12"
    steps:
      - show: |
          <p>Bài 0: $\ a^{\log_b n} = n^{\log_b a}$. &nbsp; Thử $a = 4, b = 2, n = 8$: $\ 4^{3} = 64 = 8^{2}$ ✓</p>
          <p class="note">Ta sẽ dùng để đếm <b>số lá</b> của cây đệ quy: $a^{\log_b n} = n^{\log_b a}$.</p>
        focus: [1, 1, 2]
        say: "Ôn đẳng thức của bài 0, a mũ lôgarit cơ số b của n bằng n mũ lôgarit cơ số b của a. Thử với a bằng 4, b bằng 2, n bằng 8, hai vế đều bằng 64. Lát nữa ta dùng nó để đếm số lá của cây đệ quy."

  # ───────────────────────── 2b. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: n mũ lôgarit cơ số b của a, và số mũ ép-xi-lôn"
    checks:
      - "math.log(2, 2) == 1 and math.log(8, 2) == 3 and math.log(1, 2) == 0 and round(1024**0.1, 2) == 2.0"
    steps:
      - show: |
          <p>$n^{\log_b a}$: số lá của cây đệ quy. &nbsp; $a = 2, b = 2$: $n^{1} = n$; &nbsp; $a = 8, b = 2$: $n^{3}$; &nbsp; $a = 1$: $n^{0} = 1$.</p>
          <p>$\varepsilon$ (ép-xi-lôn): một số dương cố định, có thể rất nhỏ, như $0{,}1$. &nbsp; $n^{0{,}1}$ tăng chậm nhưng vẫn là một <b>lũy thừa</b> ($1024^{0{,}1} = 2$).</p>
        introduces: [epsilon]
        focus: [1, 1, 1, 2, 2]
        say: "Hai ký hiệu cần đọc. Đại lượng n mũ lôgarit cơ số b của a sẽ là số lá của cây đệ quy. Ví dụ a bằng 2, b bằng 2 cho n mũ 1, a bằng 8, b bằng 2 cho n mũ 3, còn a bằng 1 cho n mũ 0, tức 1. Chữ ép-xi-lôn là một số dương cố định, có thể rất nhỏ như 0 phẩy 1. Khi đó n mũ 0 phẩy 1 tăng chậm, nhưng vẫn là một lũy thừa của n, ví dụ 1024 mũ 0 phẩy 1 bằng 2."

  # ───────────────────────── 3. CHIA ĐỂ TRỊ ─────────────────────────
  - id: dc
    kind: concept
    title: "Chia để trị: chia, trị, kết hợp — ví dụ sắp xếp trộn"
    checks:
      - "sorted([5, 2, 4, 7]) == [2, 4, 5, 7] and sorted([1, 3, 2, 6]) == [1, 2, 3, 6] and sorted([5, 2, 4, 7, 1, 3, 2, 6]) == [1, 2, 2, 3, 4, 5, 6, 7]"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>làm gì</th></tr>
          <tr><td><b>Chia</b></td><td>tách bài toán thành $a$ bài con, mỗi bài kích thước $n/b$</td></tr>
          <tr><td><b>Trị</b></td><td>giải các bài con bằng đệ quy</td></tr>
          <tr><td><b>Kết hợp</b></td><td>ghép lời giải con, tốn $f(n)$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Chiến lược chia để trị gồm ba bước. Chia, tách bài toán thành a bài con, mỗi bài kích thước n chia b. Trị, giải các bài con bằng đệ quy. Kết hợp, ghép các lời giải con lại, tốn f của n bước."
      - show: |
          <p><b>Sắp xếp trộn</b> $[5, 2, 4, 7, 1, 3, 2, 6]$: chia đôi → sắp xếp hai nửa $[2, 4, 5, 7]$ và $[1, 2, 3, 6]$ → <b>trộn</b> bằng cách so hai phần tử đầu, lấy số nhỏ hơn → $[1, 2, 2, 3, 4, 5, 6, 7]$.</p>
          <div class="box key">Trộn hai nửa tổng $n$ phần tử tốn $\Theta(n)$ → $\ T(n) = 2\,T(n/2) + n$: &nbsp; $a = 2,\ b = 2,\ f(n) = n$.</div>
        focus: [1, 1, 2]
        say: "Ví dụ, sắp xếp trộn chia mảng làm đôi, sắp xếp mỗi nửa bằng đệ quy, rồi trộn hai nửa bằng cách liên tục so hai phần tử đầu và lấy số nhỏ hơn. Với tám số này, hai nửa đã sắp là 2, 4, 5, 7 và 1, 2, 3, 6, trộn lại được dãy tăng. Việc trộn tốn Theta của n, nên hệ thức là 2 nhân T của n chia 2, cộng n."

  # ───────────────────────── 4. CÂY ĐỆ QUY ─────────────────────────
  - id: tree
    kind: intuition
    title: "Cây đệ quy: gốc tốn f(n), lá có n mũ lôgarit cơ số b của a cái"
    checks:
      - "[8**i * (8 // 2**i)**2 for i in range(3)] + [8**3] == [64, 128, 256, 512] and 8 * 16 == 128"
      - "[2**i * (8 // 2**i) for i in range(3)] + [8] == [8, 8, 8, 8]"
      - "[2**i * (8 // 2**i)**2 for i in range(3)] + [8] == [64, 32, 16, 8] and 2 * 16 == 32"
      - "all(2**i * (2**10 // 2**i) == 2**10 for i in range(11)) and 2**10 * 10 == 10240"
    steps:
      - show: |
          <table class="t"><tr><th>tầng</th><th>số bài con</th><th>kích thước</th><th>chi phí cả tầng</th></tr>
          <tr><td>0 (gốc)</td><td>1</td><td>$n$</td><td>$f(n)$</td></tr>
          <tr><td>$i$</td><td>$a^i$</td><td>$n/b^i$</td><td>$a^i\,f(n/b^i)$</td></tr>
          <tr><td>cuối (lá)</td><td>$a^{\log_b n} = n^{\log_b a}$</td><td>1</td><td>$\Theta(n^{\log_b a})$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta vẽ cây đệ quy rồi xét từng tầng một. Tầng gốc có một bài toán kích thước n, tốn f của n. Tầng i có a mũ i bài con, mỗi bài kích thước n chia b mũ i. Tầng lá nằm ở độ sâu lôgarit cơ số b của n, theo đẳng thức vừa ôn, số lá bằng n mũ lôgarit cơ số b của a."
      - show: |
          <div class="box key">Câu hỏi then chốt: <b>gốc</b> $f(n)$ hay <b>lá</b> $n^{\log_b a}$ nặng hơn?</div>
          <p>Sắp xếp trộn: $n^{\log_2 2} = n$, và $f(n) = n$: mỗi tầng tốn đúng $n$, có $\log_2 n$ tầng → $n\log_2 n$. Thử $n = 1024$: $10\,240$ ✓</p>
        focus: [1, 2, 2]
        say: "Câu hỏi then chốt là phần gốc f của n hay phần lá n mũ lôgarit cơ số b của a nặng hơn. Với sắp xếp trộn, cả hai đều là n, mỗi tầng tốn đúng n, và có lôgarit cơ số 2 của n tầng. Vậy tổng là n nhân lôgarit của n, với n bằng 1024 là 10240."
      - clear: true
        show: |
          <p>Chi phí từng tầng với $n = 8$, $T(1) = 1$ (mỗi hình tự co theo cột dài nhất của nó):</p>
          <div><svg width="1230" height="330" viewBox="0 0 1230 330"><text x="200" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">8T(n/2) + n²</text><text x="85" y="87" font-size="20" text-anchor="end" fill="#374151">tầng 0</text><rect x="95" y="66" width="29" height="30" rx="4" fill="#b91c1c" opacity="0.75"/><text x="132" y="89" font-size="21" fill="#1f2937">64</text><text x="85" y="142" font-size="20" text-anchor="end" fill="#374151">tầng 1</text><rect x="95" y="121" width="58" height="30" rx="4" fill="#b91c1c" opacity="0.75"/><text x="161" y="144" font-size="21" fill="#1f2937">128</text><text x="85" y="197" font-size="20" text-anchor="end" fill="#374151">tầng 2</text><rect x="95" y="176" width="115" height="30" rx="4" fill="#b91c1c" opacity="0.75"/><text x="218" y="199" font-size="21" fill="#1f2937">256</text><text x="85" y="252" font-size="20" text-anchor="end" fill="#374151">lá</text><rect x="95" y="231" width="230" height="30" rx="4" fill="#b91c1c" opacity="0.75"/><text x="333" y="254" font-size="21" fill="#1f2937">512</text><text x="200" y="300" font-size="21" font-weight="bold" text-anchor="middle" fill="#b91c1c">tăng dần → lá thắng</text><text x="610" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">2T(n/2) + n</text><text x="495" y="87" font-size="20" text-anchor="end" fill="#374151">tầng 0</text><rect x="505" y="66" width="230" height="30" rx="4" fill="#2563eb" opacity="0.75"/><text x="743" y="89" font-size="21" fill="#1f2937">8</text><text x="495" y="142" font-size="20" text-anchor="end" fill="#374151">tầng 1</text><rect x="505" y="121" width="230" height="30" rx="4" fill="#2563eb" opacity="0.75"/><text x="743" y="144" font-size="21" fill="#1f2937">8</text><text x="495" y="197" font-size="20" text-anchor="end" fill="#374151">tầng 2</text><rect x="505" y="176" width="230" height="30" rx="4" fill="#2563eb" opacity="0.75"/><text x="743" y="199" font-size="21" fill="#1f2937">8</text><text x="495" y="252" font-size="20" text-anchor="end" fill="#374151">lá</text><rect x="505" y="231" width="230" height="30" rx="4" fill="#2563eb" opacity="0.75"/><text x="743" y="254" font-size="21" fill="#1f2937">8</text><text x="610" y="300" font-size="21" font-weight="bold" text-anchor="middle" fill="#2563eb">đều nhau → cân bằng</text><text x="1020" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">2T(n/2) + n²</text><text x="905" y="87" font-size="20" text-anchor="end" fill="#374151">tầng 0</text><rect x="915" y="66" width="230" height="30" rx="4" fill="#15803d" opacity="0.75"/><text x="1153" y="89" font-size="21" fill="#1f2937">64</text><text x="905" y="142" font-size="20" text-anchor="end" fill="#374151">tầng 1</text><rect x="915" y="121" width="115" height="30" rx="4" fill="#15803d" opacity="0.75"/><text x="1038" y="144" font-size="21" fill="#1f2937">32</text><text x="905" y="197" font-size="20" text-anchor="end" fill="#374151">tầng 2</text><rect x="915" y="176" width="58" height="30" rx="4" fill="#15803d" opacity="0.75"/><text x="981" y="199" font-size="21" fill="#1f2937">16</text><text x="905" y="252" font-size="20" text-anchor="end" fill="#374151">lá</text><rect x="915" y="231" width="29" height="30" rx="4" fill="#15803d" opacity="0.75"/><text x="952" y="254" font-size="21" fill="#1f2937">8</text><text x="1020" y="300" font-size="21" font-weight="bold" text-anchor="middle" fill="#15803d">giảm dần → gốc thắng</text></svg></div>
        focus: [2, 2, 2, 2, 2, 2]
        say: "Hình này cho thấy ba hình dạng có thể xảy ra, với n bằng 8 và mỗi lá tốn 1. Hệ thức 8 nhân T của n chia 2, cộng n bình phương, có tầng gốc tốn 64, tầng một tốn 8 lần 16, bằng 128, rồi 256, và 512 lá. Chi phí tăng dần xuống dưới, tầng lá nặng nhất. Sắp xếp trộn có mọi tầng tốn đúng 8, chi phí trải đều, nên tổng bằng chi phí một tầng nhân số tầng. Hệ thức 2 nhân T của n chia 2, cộng n bình phương, có 64, rồi 2 lần 16, bằng 32, rồi 16, rồi 8, chi phí giảm dần và tầng gốc nặng nhất. Định lý thợ chính là cách đọc nhanh hình dạng này mà không cần vẽ cây."

  # ───────────────────────── 5. ĐỊNH LÝ ─────────────────────────
  - id: master
    kind: formula
    title: "Định lý thợ: ba trường hợp"
    checks:
      - "(lambda T: all(T(T, 2**k) == 2**k * k for k in range(1, 20)))(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + n)"
    steps:
      - show: |
          <p>$T(n) = a\,T(n/b) + f(n)$, &nbsp; $a \ge 1$, $b > 1$ là <b>hằng số</b>. So $f(n)$ với $n^{\log_b a}$:</p>
          <table class="t"><tr><th>trường hợp</th><th>điều kiện</th><th>kết luận</th></tr>
          <tr><td>1: lá thắng</td><td>$f(n) \in O\big(n^{\log_b a - \varepsilon}\big)$ với một $\varepsilon > 0$</td><td>$\Theta\big(n^{\log_b a}\big)$</td></tr>
          <tr><td>2: cân bằng</td><td>$f(n) \in \Theta\big(n^{\log_b a}\big)$</td><td>$\Theta\big(n^{\log_b a}\log n\big)$</td></tr>
          <tr><td>3: gốc thắng</td><td>$f(n) \in \Omega\big(n^{\log_b a + \varepsilon}\big)$ <b>và</b> $a\,f(n/b) \le c\,f(n)$ với một $c < 1$</td><td>$\Theta\big(f(n)\big)$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.4"]
        say: "Định lý thợ so sánh phần gốc với phần lá, vì tổng chi phí do phần nặng hơn quyết định. Nó áp dụng cho hệ thức dạng này, với a, b là hằng số, a từ 1 trở lên, b lớn hơn 1. Trường hợp một, lá thắng, khi f nhỏ hơn hẳn n mũ lôgarit cơ số b của a, nhỏ hơn cả một lũy thừa, nghiệm là Theta của n mũ lôgarit cơ số b của a. Trường hợp hai, cân bằng, khi f cùng bậc với nó, nghiệm thêm một thừa số lôgarit. Trường hợp ba, gốc thắng, khi f lớn hơn hẳn một lũy thừa, nghiệm là Theta của f. Riêng trường hợp ba còn cần điều kiện đều đặn, a nhân f của n chia b không vượt quá c nhân f của n, với một hằng số c nhỏ hơn 1."
      - show: |
          <p class="note">“Hơn hẳn một lũy thừa” nghĩa là tỉ số giữa hai bên phải lớn ít nhất như $n^\varepsilon$, ví dụ $n^{0{,}1}$ — hơn kém một thừa số lôgarit thì <b>không đủ</b>.</p>
        say: "Chú ý chữ hơn hẳn một lũy thừa, nghĩa là tỉ số giữa hai bên phải lớn ít nhất như n mũ ép-xi-lôn, ví dụ n mũ 0 phẩy 1. Hơn kém nhau chỉ một thừa số lôgarit thì không đủ."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: examples
    kind: example
    title: "Bốn ví dụ tra định lý"
    checks:
      - "(lambda T: all(T(T, 2**k) == 2 * 8**k - 4**k for k in range(0, 15)))(lambda f, n: 1 if n == 1 else 8*f(f, n//2) + n*n)"
      - "(lambda T: all(T(T, 2**k) == 2 * 4**k - 2 * 2**k for k in range(0, 15)))(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + n*n)"
      - "(lambda n: sp.simplify(2 * (n/2)**2 - Rational(1, 2) * n**2) == 0)(sp.Symbol('n', positive=True))"
      - "abs(math.log(1, Rational(3, 2)) - 0) < 1e-12 and math.log(8, 2) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>hệ thức</th><th>$n^{\log_b a}$</th><th>so với $f(n)$</th><th>kết quả</th></tr>
          <tr><td>$2T(n/2) + n$</td><td>$n$</td><td>bằng → TH2</td><td>$\Theta(n \log n)$</td></tr>
          <tr><td>$T(n/2) + 1$</td><td>$n^0 = 1$</td><td>bằng → TH2</td><td>$\Theta(\log n)$</td></tr>
          <tr><td>$8T(n/2) + n^2$</td><td>$n^3$</td><td>$n^2 = n^{3-1}$ → TH1</td><td>$\Theta(n^3)$</td></tr>
          <tr><td>$2T(n/2) + n^2$</td><td>$n$</td><td>$n^2 = n^{1+1}$ → TH3</td><td>$\Theta(n^2)$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bây giờ ta áp dụng định lý cho bốn ví dụ. Sắp xếp trộn có n mũ lôgarit cơ số 2 của 2 bằng n, bằng f, nên rơi vào trường hợp hai, Theta của n lôgarit n. Tìm kiếm nhị phân có n mũ 0 bằng 1, bằng f, cũng trường hợp hai, Theta của lôgarit n. Hệ thức 8 nhân T của n chia 2, cộng n bình phương, có lá n mũ 3, lớn hơn f một lũy thừa, nên trường hợp một, Theta của n mũ 3. Còn 2 nhân T của n chia 2, cộng n bình phương, có gốc thắng một lũy thừa, nên trường hợp ba, Theta của n bình phương."
      - show: |
          <p>Kiểm điều kiện đều đặn cho ví dụ cuối: $\ a\,f(n/b) = 2\Big(\dfrac{n}{2}\Big)^2 = \dfrac{1}{2}\,n^2 \le c\,n^2$ với $c = \dfrac{1}{2} < 1$ ✓</p>
          <p class="note">Bảng số: $8T(n/2) + n^2$, $T(1) = 1$ cho đúng $2n^3 - n^2$; &nbsp; $2T(n/2) + n^2$, $T(1) = 0$ cho đúng $2n^2 - 2n$ — khớp $\Theta(n^3)$ và $\Theta(n^2)$.</p>
        focus: [1, 2, 2]
        say: "Với ví dụ cuối, phải kiểm điều kiện đều đặn. Hai nhân bình phương của n chia 2 bằng một nửa n bình phương, nên chọn c bằng một phần hai, nhỏ hơn 1, điều kiện thoả. Tính bằng máy, hai hệ thức cuối cho đúng 2n mũ 3 trừ n bình phương và 2n bình phương trừ 2n, khớp với kết quả tra."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tỉ số với đáp án phải tiến về hằng số"
    checks:
      - "(lambda T: [round(T(T, 2**k) / 8**k, 4) for k in (1, 2, 3, 10)] == [1.5, 1.75, 1.875, 1.999])(lambda f, n: 1 if n == 1 else 8*f(f, n//2) + n*n)"
      - "(lambda T: [T(T, n) for n in (2, 4, 8)] == [12, 112, 960] and 8 * 112 + 64 == 960 == 64 + 128 + 256 + 512)(lambda f, n: 1 if n == 1 else 8*f(f, n//2) + n*n)"
      - "(lambda T: [T(T, n) for n in (2, 4, 8)] == [4, 12, 32] and 2 * 12 + 8 == 32 == 8 + 8 + 8 + 8)(lambda f, n: 1 if n == 1 else 2*f(f, n//2) + n)"
      - "(lambda T: [T(T, n) for n in (2, 4, 8)] == [6, 28, 120] and 2 * 28 + 64 == 120 == 64 + 32 + 16 + 8)(lambda f, n: 1 if n == 1 else 2*f(f, n//2) + n*n)"
    steps:
      - show: |
          <p><b>Phép thử</b>: tính $T(n)$ bằng máy cho $n = 2, 4, 8, 1024$ rồi chia cho đáp án tra được. Với $8T(n/2) + n^2$:</p>
          <table class="t"><tr><th>$n$</th><th>2</th><th>4</th><th>8</th><th>1024</th></tr><tr><td>$T(n)/n^3$</td><td>1,5</td><td>1,75</td><td>1,875</td><td>1,999</td></tr></table>
          <p>Tiến về hằng số 2 ✓</p>
        focus: [1, 2, 3]
        say: "Phép thử là tính T của n bằng máy với vài giá trị n rồi chia cho đáp án tra được. Với hệ thức 8 nhân T của n chia 2, cộng n bình phương, tỉ số với n mũ 3 là 1 phẩy 5, rồi 1 phẩy 75, rồi 1 phẩy 875. Tỉ số tiến về hằng số 2, nên đáp án đúng bậc."
      - clear: true
        show: |
          <p><b>Phép thử 2</b> — cộng các cột của hình ba dạng, so với tính thẳng hệ thức ($n = 8$, $T(1) = 1$):</p>
          <table class="t"><tr><th>hệ thức</th><th>cộng theo tầng</th><th>tính thẳng: $T(2), T(4), T(8)$</th></tr>
          <tr><td>$8T(n/2) + n^2$</td><td>$64 + 128 + 256 + 512 = 960$</td><td>$12,\ 112,\ 8 \cdot 112 + 64 = 960$ ✓</td></tr>
          <tr><td>$2T(n/2) + n$</td><td>$8 + 8 + 8 + 8 = 32$</td><td>$4,\ 12,\ 2 \cdot 12 + 8 = 32$ ✓</td></tr>
          <tr><td>$2T(n/2) + n^2$</td><td>$64 + 32 + 16 + 8 = 120$</td><td>$6,\ 28,\ 2 \cdot 28 + 64 = 120$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Phép thử thứ hai đi đường khác, cộng các cột của hình ba dạng rồi so với kết quả tính thẳng từ hệ thức, với n bằng 8. Hệ thức lá thắng cộng theo tầng được 960, tính thẳng qua T của 2 bằng 12 và T của 4 bằng 112 cũng ra 8 nhân 112 cộng 64, bằng 960. Sắp xếp trộn cộng được 32, tính thẳng qua 4 và 12 cũng ra 32. Hệ thức gốc thắng cộng được 120, tính thẳng qua 6 và 28 cũng ra 120."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda g: all(abs(g(g, 2**k) - 2**k * k * (k + 1) / 2) < 1e-6 for k in range(1, 20)))(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + n * math.log2(n))"
      - "(lambda T: [T(T, 3**k / 2**k) for k in (0,)] == [0])(lambda f, n: 0 if n <= 1 else f(f, n * 2 / 3) + 1) and round(math.log(1) / math.log(1.5), 6) == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Ép $T(n) = 2T(n/2) + n\log n$ vào trường hợp 3 (hay 2) <b class="red">(sai)</b>
          <br><span class="note">$f(n)/n = \log n$: lớn hơn $n$, nhưng <b>không</b> lớn hơn một lũy thừa $n^\varepsilon$ → rơi vào <b>khe hở</b>. Tính đúng bằng thế ngược: $n\log_2 n\,(\log_2 n + 1)/2 \in \Theta(n\log^2 n)$.</span></div>
        say: "Lỗi thứ nhất, ép hệ thức 2 nhân T của n chia 2, cộng n lôgarit n, vào trường hợp ba hay hai. Tỉ số f chia n bằng lôgarit n, lớn hơn nhưng không lớn hơn một lũy thừa, nên hệ thức rơi vào khe hở giữa các trường hợp. Thế ngược cho Theta của n nhân bình phương lôgarit n."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng định lý cho $T(n) = T(n-1) + 1$ hay $\sqrt{n}\,T(\sqrt{n}) + n$ <b class="red">(sai)</b>
          <br><span class="note">Giảm 1 không phải chia cho hằng số $b$; $\sqrt{n}$ không phải hằng số $a$. Phải thế ngược hoặc đổi biến (bài 8, bài 11).</span></div>
        say: "Lỗi thứ hai, dùng định lý cho hệ thức giảm 1, hay hệ thức có căn n làm hệ số. Giảm đi 1 không phải chia cho một hằng số b, còn căn n không phải hằng số a. Khi đó phải thế ngược như bài 8, hoặc đổi biến như bài 11, tức đặt n bằng 2 mũ m."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ở trường hợp 3, quên điều kiện đều đặn (hay viết $c \le 1$) <b class="red">(sai)</b>
          <br><span class="note">Phải tìm được $c$ <b>nhỏ hơn hẳn</b> 1. Với các $f$ là đa thức thì luôn thoả, nhưng định lý đòi phải kiểm.</span></div>
        say: "Lỗi thứ ba, ở trường hợp ba quên điều kiện đều đặn, hoặc viết c nhỏ hơn hoặc bằng 1. Phải tìm được c nhỏ hơn hẳn 1. Với f là đa thức thì điều kiện luôn thoả, nhưng định lý vẫn đòi phải kiểm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ $b$ phải là số nguyên <b class="red">(sai)</b>
          $$T(n) = T(2n/3) + 1:\quad b = 3/2,\ a = 1,\ n^{\log_{3/2} 1} = n^0 = 1 \ \to\ \text{TH2} \ \to\ \Theta(\log n)$$</div>
        say: "Lỗi thứ tư, nghĩ b phải là số nguyên. Với T của n bằng T của hai phần ba n, cộng 1, ta có b bằng 3 phần 2 và a bằng 1. Nên n mũ lôgarit bằng n mũ 0, tức 1, và theo trường hợp hai, nghiệm là Theta của lôgarit n."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda T: [round(T(T, 2**k) / 4**k, 3) for k in (5, 10)] == [0.969, 0.999])(lambda f, n: 0 if n == 1 else 4*f(f, n//2) + n)"
      - "(lambda T: all(T(T, 3**k) == 3**k * k for k in range(1, 12)))(lambda f, n: 0 if n == 1 else 3*f(f, n//3) + n)"
      - "(lambda T: all(T(T, 2**k) == 2 * 2**k - 2 for k in range(1, 20)) and T(T, 1024) == 2046)(lambda f, n: 0 if n == 1 else f(f, n//2) + n)"
      - "(lambda T: T(T, 27) == 27 * 3 == 81 and math.log(27, 3) - 3 < 1e-12)(lambda f, n: 0 if n == 1 else 3*f(f, n//3) + n)"
    steps:
      - show: |
          <p>Tra định lý thợ (nêu trường hợp và kết quả):</p>
          <table class="t"><tr><th>câu</th><th>hệ thức</th></tr><tr><td>1</td><td>$T(n) = 4T(n/2) + n$</td></tr><tr><td>2</td><td>$T(n) = 3T(n/3) + n$</td></tr><tr><td>3</td><td>$T(n) = T(n/2) + n$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Đến lượt bạn, tra định lý thợ cho ba hệ thức, nêu trường hợp và kết quả. Một, 4 nhân T của n chia 2, cộng n. Hai, 3 nhân T của n chia 3, cộng n. Ba, T của n chia 2, cộng n. Dừng video và làm ra giấy."
        pause: 8
      - show: |
          $$\text{①}\quad n^{\log_2 4} = n^2,\quad f(n) = n = n^{2-1} \ \to\ \text{TH1} \ \to\ \hlg{\Theta(n^2)}$$
          <p class="note">Máy: $T(1) = 0$, $\ T(n)/n^2 = 0{,}969$ ở $n = 32$ và $0{,}999$ ở $n = 1024$ — tiến về hằng số ✓</p>
        focus: [1, 2, 2]
        say: "Câu một, phần lá là n bình phương, lớn hơn f một lũy thừa, nên trường hợp một, Theta của n bình phương. Thử bằng máy với T của 1 bằng 0, tỉ số T của n chia n bình phương là 0 phẩy 969 ở n bằng 32. Tới n bằng 1024 nó là 0 phẩy 999, tiến về một hằng số."
      - clear: true
        show: |
          $$\text{②}\quad n^{\log_3 3} = n^1 = n = f(n) \ \to\ \text{TH2} \ \to\ \hlg{\Theta(n\log n)}$$
          <p class="note">Máy: $T(1) = 0$ cho đúng $T(3^k) = 3^k \cdot k$, ví dụ $T(27) = 27 \cdot 3 = 81$ ✓</p>
        focus: [1, 2]
        say: "Câu hai, phần lá bằng n, bằng f, nên trường hợp hai, Theta của n lôgarit n. Máy cho đúng T của 3 mũ k bằng 3 mũ k nhân k, ví dụ T của 27 bằng 27 nhân 3, bằng 81, và 3 chính là lôgarit cơ số 3 của 27."
      - clear: true
        show: |
          $$\text{③}\quad n^{\log_2 1} = 1,\quad f(n) = n = n^{0+1},\quad 1 \cdot f(n/2) = \frac{1}{2}\,n \le c\,n \text{ với } c = \frac{1}{2} \ \to\ \text{TH3} \ \to\ \hlg{\Theta(n)}$$
          <p class="note">Máy: $T(1) = 0$ cho đúng $T(n) = 2n - 2$, ví dụ $T(1024) = 2046$ ✓</p>
        focus: [1, 1, 2]
        say: "Câu ba, phần lá bằng 1, f bằng n lớn hơn một lũy thừa. Điều kiện đều đặn thoả vì a nhân f của n chia 2 bằng một nửa n, chọn c bằng một phần hai, nên trường hợp ba, Theta của n. Máy cho đúng 2n trừ 2, ví dụ T của 1024 bằng 2046."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chia, trị, kết hợp</span><span class="a">→</span>
          <span class="n">$a\,T(n/b) + f(n)$, $a$, $b$ hằng số</span><span class="a">→</span>
          <span class="n">so $f(n)$ với $n^{\log_b a}$</span><span class="a">→</span>
          <span class="n">lá thắng, cân bằng, gốc thắng</span><span class="a">→</span>
          <span class="n">khe hở: thế ngược</span></div>
        say: "Tổng kết chuỗi logic. Chia để trị gồm chia, trị và kết hợp, cho hệ thức a nhân T của n chia b, cộng f của n, với a và b là hằng số. So f với n mũ lôgarit cơ số b của a để biết lá thắng, cân bằng, hay gốc thắng. Rơi vào khe hở thì quay về thế ngược."
      - show: |
          <div class="box key"><b>Tư duy:</b> định lý là phím tắt của cây đệ quy — luôn hỏi “gốc hay lá nặng hơn, và hơn bao nhiêu?”.</div>
        say: "Điều cần mang theo, định lý thợ chỉ là phím tắt của cây đệ quy, nên luôn hỏi phần gốc hay phần lá nặng hơn, và nặng hơn bao nhiêu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>giảm để trị và biến đổi để trị</b> — mỗi bước chỉ còn <b>một</b> bài con nhỏ hơn (sắp xếp chèn, tìm kiếm nhị phân), hoặc sắp xếp trước rồi mới giải.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta học giảm để trị, mỗi bước chỉ còn một bài con nhỏ hơn, như sắp xếp chèn, và biến đổi để trị, như sắp xếp dữ liệu trước rồi mới giải. Hẹn gặp bạn ở bài tiếp theo."
