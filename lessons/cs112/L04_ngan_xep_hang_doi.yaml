id: L04
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 4 — Ngăn xếp & hàng đợi: vào sau ra trước, vào trước ra trước, và ngăn xếp lời gọi hàm"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L02 (bản thảo)"
assumes: [cdot, bigTheta]
# Quy ước: tên thao tác tiếng Anh (push, pop, top, enqueue, dequeue) chỉ hiện trên màn hình; lời đọc dùng “đẩy vào”, “lấy ra”,
#   “xem đỉnh”, “xếp vào hàng”, “lấy khỏi hàng”. Chia lấy dư viết a \bmod m. Chỉ số mảng đếm từ 0 (bài 3).
# Nối bài trước (luật 17): bài 3 — mảng đọc A[i] tốn Θ(1); chèn vào đầu mảng phải dời n phần tử, Θ(n); danh sách liên kết chèn đầu Θ(1).
#   bài 2 — giai thừa n! = 1·2·…·n.
objectives:
  - "Mô phỏng tay các thao tác đẩy vào, lấy ra của ngăn xếp và xếp vào, lấy khỏi hàng đợi"
  - "Dùng phép chia lấy dư để cài hàng đợi vòng trên mảng, mỗi thao tác Θ(1)"
  - "Kiểm tra một dãy ngoặc có hợp lệ không bằng ngăn xếp"
  - "Vẽ ngăn xếp lời gọi hàm của một hàm đệ quy và giải thích tràn ngăn xếp"
asr_reviewed:
  - {sentence: "Gặp ngoặc mở thì đẩy vào ngăn xếp.", reason: "ngoặc/ngoặt, xếp/xét: nhầm âm cuối c/t, p/t của ASR"}
  - {sentence: "Còn danh sách liên kết thì chèn và xoá ở đầu chỉ tốn Theta của 1.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Trên mảng, đọc và ghi ở cuối tốn Theta của 1, nhưng chèn hay xoá ở đầu phải dời n phần tử, tốn Theta của n.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hoàn tác và hàng chờ máy in"
    steps:
      - show: |
          <p class="big">Bấm “hoàn tác” ba lần: việc <b>làm sau cùng</b> được huỷ trước.</p>
          <p class="big">Gửi ba tệp tới máy in: tệp <b>gửi trước</b> được in trước.</p>
        focus: [1, 2, 0]
        say: "Chào bạn, khi bấm nút hoàn tác ba lần, việc làm sau cùng được huỷ trước tiên. Còn khi gửi ba tệp tới máy in, tệp gửi trước được in trước. Hai hành vi ngược nhau này là hai cấu trúc dữ liệu hôm nay."
      - show: |
          <ul><li><b>Ngăn xếp</b> (stack): vào sau, ra trước.</li><li><b>Hàng đợi</b> (queue): vào trước, ra trước.</li>
          <li>Và câu hỏi: máy tính nhớ <b>quay về đâu</b> sau khi một hàm gọi hàm khác?</li></ul>
        focus: ["1.1", "1.2", "1.3"]
        say: "Ngăn xếp là cấu trúc vào sau thì ra trước. Hàng đợi là cấu trúc vào trước thì ra trước. Và ta sẽ thấy ngăn xếp trả lời một câu hỏi lớn, máy tính nhớ quay về đâu sau khi một hàm gọi một hàm khác."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn bài 3: chi phí trên mảng và danh sách liên kết"
    steps:
      - show: |
          <p>Bài 3: mảng đọc và ghi ở <b>cuối</b> tốn $\Theta(1)$, nhưng chèn hay xoá ở <b>đầu</b> phải dời $n$ phần tử, $\Theta(n)$.</p>
          <p>Danh sách liên kết: chèn, xoá ở <b>đầu</b> chỉ $\Theta(1)$.</p>
        focus: [1, 1, 2, 0]
        say: "Ôn lại bài 3 về chi phí trên mảng và danh sách liên kết. Trên mảng, đọc và ghi ở cuối tốn Theta của 1, nhưng chèn hay xoá ở đầu phải dời n phần tử, tốn Theta của n. Còn danh sách liên kết thì chèn và xoá ở đầu chỉ tốn Theta của 1. Ta sẽ chọn đúng đầu để mọi thao tác hôm nay đều rẻ."

  # ───────────────────────── 3. NGĂN XẾP ─────────────────────────
  - id: stack
    kind: symbol
    title: "Ngăn xếp: chỉ thao tác ở đỉnh"
    checks:
      - "(lambda st: (st.append(3), st.append(5), st.append(7), st.pop(), st[-1], st))([])[3:] == (7, 5, [3, 5])"
    steps:
      - show: |
          <table class="t"><tr><th>thao tác</th><th>ý nghĩa</th><th>chi phí</th></tr>
          <tr><td><code>push(x)</code></td><td>đẩy $x$ lên đỉnh</td><td>$\Theta(1)$</td></tr>
          <tr><td><code>pop()</code></td><td>lấy phần tử ở đỉnh ra</td><td>$\Theta(1)$</td></tr>
          <tr><td><code>top()</code></td><td>xem phần tử ở đỉnh, không lấy ra</td><td>$\Theta(1)$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ngăn xếp giống một chồng đĩa, chỉ đụng được vào cái trên cùng, gọi là đỉnh. Thao tác đẩy vào đặt một phần tử lên đỉnh. Thao tác lấy ra lấy phần tử ở đỉnh đi. Thao tác xem đỉnh cho biết phần tử ở đỉnh mà không lấy ra."
      - show: |
          <p>Đẩy vào 3, 5, 7 rồi lấy ra một lần:</p>
          <p>$[\,3\,] \to [\,3, 5\,] \to [\,3, 5, \hlo{7}\,] \xrightarrow{\text{pop}} \hlg{7}$, còn $[\,3, \hlo{5}\,]$; đỉnh bây giờ là 5.</p>
          <p class="note">Cài trên mảng: đỉnh là <b>cuối mảng</b> → mọi thao tác $\Theta(1)$ (thêm cuối mảng động là $\Theta(1)$ khấu hao, bài 3).</p>
        focus: [1, 2, 3]
        say: "Thử đẩy vào 3, rồi 5, rồi 7, sau đó lấy ra một lần. Phần tử ra là 7, vì nó vào sau cùng, và đỉnh bây giờ là 5. Nếu cài trên mảng, ta cho đỉnh là cuối mảng, nên theo bài 3, mọi thao tác chỉ tốn Theta của 1."

  # ───────────────────────── 4. HÀNG ĐỢI ─────────────────────────
  - id: queue
    kind: symbol
    title: "Hàng đợi: vào ở cuối, ra ở đầu"
    checks:
      - "(lambda q: (q.append(3), q.append(5), q.append(7), q.pop(0), q))([])[3:] == (3, [5, 7])"
      - "(4 + 1) % 5 == 0 and (0 + 1) % 5 == 1"
    steps:
      - show: |
          <p><code>enqueue(x)</code>: xếp $x$ vào <b>cuối</b> hàng; &nbsp; <code>dequeue()</code>: lấy phần tử ở <b>đầu</b> hàng ra.</p>
          <table class="t"><tr><th>thao tác</th><th>enqueue 3</th><th>enqueue 5</th><th>enqueue 7</th><th>dequeue</th></tr>
          <tr><td>hàng (đầu bên trái)</td><td>[3]</td><td>[3, 5]</td><td>[3, 5, 7]</td><td>ra $\hlg{3}$, còn [5, 7]</td></tr></table>
        focus: [1, 1, 2]
        say: "Hàng đợi giống hàng người mua vé. Thao tác xếp vào hàng đặt phần tử ở cuối, còn thao tác lấy khỏi hàng lấy phần tử ở đầu. Xếp vào 3, 5, 7 rồi lấy ra một lần, phần tử ra là 3, vì nó vào trước."
      - show: |
          <div class="box warn">Cài ngây thơ trên mảng: lấy ở đầu phải dời mọi phần tử → $\Theta(n)$ mỗi lần.</div>
          <p>Cách hay: <b>không dời</b>, chỉ dịch hai chỉ số <code>front</code> (đầu) và <code>rear</code> (cuối), và cho chúng <b>quay vòng</b>.</p>
        focus: [1, 2]
        say: "Nếu cài ngây thơ trên mảng, mỗi lần lấy ở đầu phải dời mọi phần tử, tốn Theta của n. Cách hay hơn là không dời gì cả, chỉ dịch hai chỉ số, chỉ số đầu hàng và chỉ số cuối hàng, và cho chúng quay vòng khi chạm cuối mảng."
      - show: |
          <p>$a \bmod m$: <b>số dư</b> khi chia $a$ cho $m$. &nbsp; $5 \bmod 5 = 0$, &nbsp; $7 \bmod 5 = 2$.</p>
          <div class="box key">Hàng đợi vòng, mảng có <code>MAX</code> ô: &nbsp; $\text{rear} \leftarrow (\text{rear} + 1) \bmod \text{MAX}$</div>
          <p>$\text{MAX} = 5$, rear đang là 4 (ô cuối): ô tiếp theo là $(4 + 1) \bmod 5 = \hlg{0}$ — quay về ô đầu.</p>
        introduces: [mod, assign]
        focus: [1, 2, 2, 3]
        say: "Để quay vòng ta dùng phép chia lấy dư, a chia lấy dư cho m là số dư khi chia a cho m, ví dụ 7 chia lấy dư cho 5 bằng 2. Mỗi lần xếp vào, chỉ số cuối được thay bằng chỉ số cuối cộng 1, chia lấy dư cho số ô. Mũi tên trái đọc là thay bằng. Với 5 ô, nếu chỉ số cuối đang là 4, ô tiếp theo là 4 cộng 1 chia lấy dư cho 5, bằng 0, tức quay về ô đầu."

  - id: ring
    kind: intuition
    title: "Hình dung hàng đợi vòng: hai chỉ số chạy vòng quanh mảng"
    checks:
      - "(4 + 1) % 5 == 0 and [(3 + k) % 5 for k in range(3)] == [3, 4, 0]"
    steps:
      - show: |
          <svg width="1300" height="380" viewBox="0 0 1300 380"><defs><marker id="arQ4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="200" y="110" width="150" height="90" rx="10" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="275" y="168" font-size="36" font-weight="bold" text-anchor="middle" fill="#1f2937">11</text><text x="275" y="236" font-size="26" text-anchor="middle" fill="#6b7280">ô 0</text><rect x="370" y="110" width="150" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="445" y="236" font-size="26" text-anchor="middle" fill="#6b7280">ô 1</text><rect x="540" y="110" width="150" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="615" y="236" font-size="26" text-anchor="middle" fill="#6b7280">ô 2</text><rect x="710" y="110" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="785" y="168" font-size="36" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><text x="785" y="236" font-size="26" text-anchor="middle" fill="#6b7280">ô 3</text><rect x="880" y="110" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="955" y="168" font-size="36" font-weight="bold" text-anchor="middle" fill="#1f2937">9</text><text x="955" y="236" font-size="26" text-anchor="middle" fill="#6b7280">ô 4</text><text x="785" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#d97706">front (đầu)</text><line x1="785" y1="52" x2="785" y2="104" stroke="#d97706" stroke-width="4" marker-end="url(#arQ4)"/><text x="275" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#059669">rear (cuối)</text><line x1="275" y1="52" x2="275" y2="104" stroke="#059669" stroke-width="4" marker-end="url(#arQ4)"/><path d="M955,252 C955,330 275,330 275,258" fill="none" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arQ4)"/><text x="615" y="362" font-size="26" text-anchor="middle" fill="#1f2937">hết mảng thì quay vòng: (4 + 1) mod 5 = 0</text><text x="1080" y="150" font-size="26" fill="#6b7280">đọc từ front:</text><text x="1080" y="186" font-size="26" fill="#6b7280">7, 9, 11</text></svg>
        focus: [0, 0, 0, 0]
        say: "Hình vẽ một hàng đợi vòng có 5 ô, đang chứa 7 ở ô 3 và 9 ở ô 4, chỉ số đầu hàng trỏ vào ô 3. Khi xếp thêm 11, chỉ số cuối đang ở ô 4, ô cuối của mảng, nên nó quay vòng về 4 cộng 1 chia lấy dư cho 5, tức ô 0. Không phần tử nào bị dời, chỉ có hai mũi tên chạy vòng quanh mảng. Đọc từ chỉ số đầu theo chiều quay vòng, hàng là 7, 9, 11, đúng thứ tự vào."

  # ───────────────────────── 5. VÍ DỤ: NGOẶC ─────────────────────────
  - id: brackets
    kind: example
    title: "Kiểm tra dãy ngoặc hợp lệ bằng ngăn xếp"
    checks:
      - "(lambda chk: [chk('([]{})'), chk('(]'), chk('(()')] == [True, False, False])(lambda s: (lambda st: all((st.append(c) or True) if c in '([{' else (bool(st) and st.pop() == {')': '(', ']': '[', '}': '{'}[c]) for c in s) and not st)([]))"
    steps:
      - show: |
          <p>Quy tắc: gặp ngoặc <b>mở</b> → đẩy vào. Gặp ngoặc <b>đóng</b> → lấy đỉnh ra, phải là ngoặc mở <b>cùng loại</b>. Hết dãy → ngăn xếp phải <b>rỗng</b>.</p>
          <table class="t"><tr><th>đọc</th><th><code>(</code></th><th><code>[</code></th><th><code>]</code></th><th><code>{</code></th><th><code>}</code></th><th><code>)</code></th></tr>
          <tr><td>ngăn xếp</td><td>(</td><td>( [</td><td>(</td><td>( {</td><td>(</td><td><i>rỗng</i> ✓</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.2"]
        say: "Một ứng dụng kinh điển là kiểm tra dãy ngoặc. Gặp ngoặc mở thì đẩy vào ngăn xếp. Gặp ngoặc đóng thì lấy đỉnh ra, và nó phải là ngoặc mở cùng loại. Với dãy ngoặc tròn, vuông, đóng vuông, nhọn, đóng nhọn, đóng tròn, mỗi ngoặc đóng đều gặp đúng ngoặc mở của nó. Hết dãy, ngăn xếp rỗng, nên dãy hợp lệ."
      - show: |
          <p><code>(]</code>: gặp <code>]</code> nhưng đỉnh là <code>(</code> → <b class="red">sai loại</b>. &nbsp; <code>(()</code>: hết dãy còn một <code>(</code> → <b class="red">chưa đóng</b>.</p>
          <p class="note">Mỗi ký tự: một lần đẩy hoặc một lần lấy, $\Theta(1)$ → cả dãy dài $n$: $\Theta(n)$.</p>
        focus: [1, 1, 2]
        say: "Hai dãy sai. Dãy tròn mở rồi vuông đóng sai vì khác loại, còn dãy mở, mở, đóng sai vì hết dãy vẫn còn một ngoặc chưa đóng. Mỗi ký tự chỉ cần một thao tác Theta của 1, nên cả dãy dài n tốn Theta của n."

  # ───────────────────────── 6. NGĂN XẾP LỜI GỌI ─────────────────────────
  - id: callstack
    kind: concept
    title: "Ngăn xếp lời gọi hàm: đệ quy chạy thế nào"
    checks:
      - "(lambda f: f(f, 3))(lambda f, n: 1 if n == 1 else n * f(f, n - 1)) == 6 == math.factorial(3)"
    steps:
      - show: |
          <div class="code"><div><span class="kw">int</span> fact(<span class="kw">int</span> n) {</div><div>    <span class="kw">if</span> (n == 1) <span class="kw">return</span> 1;        <span class="cm">// điều kiện dừng</span></div><div>    <span class="kw">return</span> n * fact(n - 1);</div><div>}</div></div>
        focus: [0, "1.2", "1.3"]
        say: "Xét hàm tính giai thừa bằng đệ quy, tức là hàm tự gọi lại chính nó. Nếu n bằng 1 thì trả về 1, đó là điều kiện dừng. Ngược lại, trả về n nhân với giai thừa của n trừ 1."
      - clear: true
        show: |
          <p class="note">$\text{fact}(n) = n \cdot \text{fact}(n - 1)$, &nbsp; $\text{fact}(1) = 1$</p>
          <table class="t"><tr><th>bước</th><th>ngăn xếp lời gọi (đỉnh bên phải)</th></tr>
          <tr><td>gọi</td><td>fact(3)</td></tr>
          <tr><td>gọi</td><td>fact(3) &nbsp; fact(2)</td></tr>
          <tr><td>gọi</td><td>fact(3) &nbsp; fact(2) &nbsp; <b>fact(1)</b> → trả 1</td></tr>
          <tr><td>trả về</td><td>fact(3) &nbsp; <b>fact(2)</b> → $2 \cdot 1 = 2$</td></tr>
          <tr><td>trả về</td><td><b>fact(3)</b> → $3 \cdot 2 = \hlg{6}$</td></tr></table>
        focus: [2, ["2.2", "2.3"], "2.4", ["2.5", "2.6"]]
        say: "Mỗi lời gọi hàm được cấp một khung nhớ, chứa tham số và chỗ quay về, đặt lên đỉnh một ngăn xếp. Giai thừa của 3 gọi giai thừa của 2, rồi giai thừa của 2 gọi giai thừa của 1. Giai thừa của 1 gặp điều kiện dừng, trả về 1 và bị lấy ra khỏi đỉnh. Lần lượt, giai thừa của 2 trả về 2, giai thừa của 3 trả về 6."
      - show: |
          <div class="box key">Khung gọi sau cùng trả về trước tiên — đúng kiểu <b>vào sau, ra trước</b>. Độ sâu đệ quy $n$ cần $n$ khung nhớ.</div>
        say: "Khung được gọi sau cùng trả về trước tiên, đúng kiểu vào sau ra trước, nên máy tính dùng ngăn xếp để nhớ đường quay về. Đệ quy sâu n tầng thì cần n khung nhớ cùng lúc."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đếm số lần đẩy và lấy"
    checks:
      - "len('([]{})') == 6 and '([]{})'.count('(') + '([]{})'.count('[') + '([]{})'.count('{') == 3"
      - "(lambda s: (lambda st, out: [(st.append(c), out.append(('đẩy', len(st)))) if c in '([{' else (st.pop(), out.append(('lấy', len(st)))) for c in s] and out)([], []))('([]{})') == [('đẩy', 1), ('đẩy', 2), ('lấy', 1), ('đẩy', 2), ('lấy', 1), ('lấy', 0)]"
      - "1 * 2 * 3 == 6 and (lambda f: f(f, 3))(lambda f, n: 1 if n == 1 else n * f(f, n - 1)) == 6"
    steps:
      - show: |
          <p><b>Phép thử</b>: với dãy ngoặc hợp lệ, số lần đẩy = số lần lấy = số ngoặc mở. &nbsp; <code>([]{})</code>: 6 ký tự, 3 lần đẩy, 3 lần lấy ✓</p>
          <table class="t"><tr><th>đọc</th><th><code>(</code></th><th><code>[</code></th><th><code>]</code></th><th><code>{</code></th><th><code>}</code></th><th><code>)</code></th></tr>
          <tr><td>thao tác</td><td>đẩy</td><td>đẩy</td><td>lấy</td><td>đẩy</td><td>lấy</td><td>lấy</td></tr>
          <tr><td>số phần tử sau đó</td><td>1</td><td>2</td><td>1</td><td>2</td><td>1</td><td>0</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Phép thử đầu tiên dành cho dãy ngoặc hợp lệ. Vì mỗi ngoặc mở được đẩy vào một lần và lấy ra một lần, số lần đẩy bằng số lần lấy và bằng số ngoặc mở. Ví dụ dãy sáu ký tự có ba lần đẩy và ba lần lấy. Đếm lại theo từng ký tự, số phần tử đi 1, 2, 1, 2, 1 rồi về 0, nên ngăn xếp rỗng ở cuối."
      - show: |
          <p><b>Phép thử 2</b>: với hàm đệ quy, số khung tối đa trên ngăn xếp = độ sâu lời gọi. &nbsp; <code>fact(3)</code>: 3 khung ✓</p>
          <table class="t"><tr><th>cách tính</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>đệ quy, theo ngăn xếp lời gọi</td><td>$1$, rồi $2 \cdot 1$, rồi $3 \cdot 2$</td><td>6</td></tr>
          <tr><td>nhân thẳng, không đệ quy</td><td>$1 \cdot 2 \cdot 3$</td><td>6 ✓</td></tr></table>
        focus: [1, 1, "2.3"]
        say: "Phép thử thứ hai, với hàm đệ quy, số khung nhiều nhất trên ngăn xếp bằng độ sâu lời gọi. Vì vậy giai thừa của 3 cần ba khung, đúng như bảng ngăn xếp lời gọi. Kiểm kết quả bằng đường khác, nhân thẳng 1 nhân 2 nhân 3 cũng được 6, khớp với kết quả đệ quy."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda f: f(f, 3, 0))(lambda f, n, d: d if d > 50 else f(f, n - 1, d + 1)) == 51"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy ra khi ngăn xếp (hay hàng đợi) <b>rỗng</b> <b class="red">(sai)</b>
          <br><span class="note">Luôn kiểm tra rỗng trước. Ở bài kiểm tra ngoặc, dãy <code>)</code> làm lộ ngay lỗi này.</span></div>
        say: "Lỗi thứ nhất, lấy ra khi ngăn xếp hay hàng đợi đang rỗng. Luôn kiểm tra rỗng trước. Ở bài kiểm tra ngoặc, chỉ một dấu đóng ngoặc là đủ làm lộ lỗi này."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hàng đợi vòng: không phân biệt <b>đầy</b> với <b>rỗng</b> <b class="red">(sai)</b>
          <br><span class="note">Nếu dùng hết <code>MAX</code> ô, cả lúc đầy lẫn lúc rỗng đều có front = rear. Cách sửa: giữ thêm biến đếm số phần tử, hoặc luôn chừa trống một ô.</span></div>
        say: "Lỗi thứ hai, ở hàng đợi vòng, không phân biệt được đầy và rỗng. Nếu dùng hết mọi ô, cả lúc đầy lẫn lúc rỗng, hai chỉ số đầu và cuối đều trùng nhau. Cách sửa là giữ thêm một biến đếm số phần tử, hoặc luôn chừa trống một ô."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đệ quy thiếu điều kiện dừng <b class="red">(sai)</b>
          <br><span class="note">Mỗi lời gọi thêm một khung; không bao giờ trả về thì ngăn xếp lời gọi đầy → chương trình chết với lỗi <b>tràn ngăn xếp</b> (stack overflow).</span></div>
        say: "Lỗi thứ ba, viết đệ quy thiếu điều kiện dừng. Mỗi lời gọi lại thêm một khung nhớ, không bao giờ trả về, nên ngăn xếp lời gọi đầy và chương trình chết với lỗi tràn ngăn xếp."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhầm hàng đợi với hàng đợi hai đầu, hay với hàng đợi ưu tiên <b class="red">(sai)</b>
          </div>
          <table class="t"><tr><th>cấu trúc</th><th>lấy ra phần tử nào</th></tr>
          <tr><td>ngăn xếp</td><td>mới vào nhất</td></tr>
          <tr><td>hàng đợi</td><td>vào sớm nhất</td></tr>
          <tr><td>hàng đợi hai đầu (deque)</td><td>ở <b>cả hai đầu</b></td></tr>
          <tr><td>hàng đợi ưu tiên</td><td>có <b>ưu tiên cao nhất</b>, không theo thứ tự vào</td></tr></table>
        focus: [1, "2.4", "2.5"]
        say: "Lỗi thứ tư, nhầm hàng đợi thường với hai biến thể. Hàng đợi hai đầu cho thêm và lấy ở cả hai đầu. Còn hàng đợi ưu tiên luôn lấy phần tử có độ ưu tiên cao nhất, không theo thứ tự vào."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda toks: (lambda st: [st.append(int(t)) if t.isdigit() else st.append((lambda b, a: a + b if t == '+' else a * b)(st.pop(), st.pop())) for t in toks] and st)([]))('3 4 + 2 *'.split()) == [14]"
      - "(3 + 1) % 4 == 0 and (0 + 1) % 4 == 1"
      - "3 + 4 == 7 and 7 * 2 == 14 == (3 + 4) * 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính biểu thức viết ngược (hậu tố) <code>3 4 + 2 *</code> bằng ngăn xếp: gặp số thì đẩy vào; gặp phép tính thì lấy hai số ra, tính, đẩy kết quả vào.</td></tr>
          <tr><td>2</td><td>Hàng đợi vòng 4 ô, rear đang là 3. Xếp thêm hai phần tử: rear lần lượt bằng bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tính biểu thức viết ngược 3, 4, cộng, 2, nhân, bằng ngăn xếp, gặp số thì đẩy vào, gặp phép tính thì lấy hai số ra, tính rồi đẩy kết quả vào. Câu hai, hàng đợi vòng 4 ô, chỉ số cuối đang là 3, xếp thêm hai phần tử thì chỉ số cuối lần lượt bằng bao nhiêu? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Theo từng ký hiệu (đỉnh bên phải):</p>
          <table class="t"><tr><th>đọc</th><th>3</th><th>4</th><th>+</th><th>2</th><th>*</th></tr>
          <tr><td>ngăn xếp</td><td>[3]</td><td>[3, 4]</td><td>[7]</td><td>[7, 2]</td><td>[$\hlg{14}$]</td></tr></table>
          <p class="note">Kiểm: $(3 + 4) \cdot 2 = 14$ ✓</p>
        focus: [1, "2.2", "2.2", "2.2", 3]
        say: "Câu một, ta đọc từng ký hiệu và ghi lại ngăn xếp. Đẩy 3 rồi đẩy 4, ngăn xếp có hai số. Gặp dấu cộng thì lấy ra hai số, 3 cộng 4 được 7, rồi đẩy 7 vào. Đẩy tiếp 2, gặp dấu nhân thì lấy 7 và 2 ra, được 14. Kiểm lại, đó chính là 3 cộng 4, rồi nhân 2, bằng 14."
      - show: |
          <p>② Mỗi lần xếp vào: $\text{rear} \leftarrow (\text{rear} + 1) \bmod 4$</p>
          $$(3 + 1) \bmod 4 = \hlg{0}, \qquad (0 + 1) \bmod 4 = \hlg{1}$$
        focus: [1, 2, 2]
        say: "Câu hai, mỗi lần xếp vào, chỉ số cuối được thay bằng chỉ số cuối cộng 1, chia lấy dư cho 4. Lần đầu, 3 cộng 1 chia lấy dư cho 4 bằng 0, tức quay về ô đầu. Lần sau, 0 cộng 1 chia lấy dư cho 4 bằng 1."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ngăn xếp: vào sau ra trước, thao tác ở đỉnh</span><span class="a">→</span>
          <span class="n">hàng đợi: vào trước ra trước, vòng bằng chia lấy dư</span><span class="a">→</span>
          <span class="n">mọi thao tác $\Theta(1)$</span><span class="a">→</span>
          <span class="n">ngăn xếp lời gọi: nhớ đường quay về của đệ quy</span></div>
        say: "Tổng kết chuỗi logic. Ngăn xếp vào sau ra trước, mọi thao tác ở đỉnh. Hàng đợi vào trước ra trước, và quay vòng được nhờ phép chia lấy dư. Cả hai có mọi thao tác Theta của 1. Và máy tính dùng ngăn xếp lời gọi để nhớ đường quay về của đệ quy."
      - show: |
          <div class="box key"><b>Tư duy:</b> hỏi “phần tử nào cần ra <b>trước</b>?” — mới nhất thì dùng ngăn xếp, cũ nhất thì dùng hàng đợi.</div>
        say: "Điều cần mang theo, hãy hỏi phần tử nào cần ra trước. Nếu là phần tử mới nhất thì dùng ngăn xếp, nếu là phần tử cũ nhất thì dùng hàng đợi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>cây nhị phân, cây tìm kiếm nhị phân và cây AVL</b> — các nút có hai nhánh, đi theo đệ quy, và tìm kiếm nhanh khi cây cân bằng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học cây nhị phân, cây tìm kiếm nhị phân và cây tự cân bằng AVL. Ở đó mỗi nút có hai nhánh, ta duyệt cây bằng đệ quy, và tìm kiếm rất nhanh khi cây cân bằng. Hẹn gặp bạn ở bài tiếp theo."
