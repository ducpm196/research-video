  - {sentence: "Chữ v i là đơn giá, tức giá trị trên mỗi ki-lô-gam, bằng p i chia w i, ba món có đơn giá 1 phẩy 389, 1 phẩy 6 và 1 phẩy 5.", reason: "w đọc “vê kép”, ASR chép “v”; chữ w hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Túi 20 kg, ba món hàng, lấy được một phần"
    steps:
      - show: |
          <table class="t"><tr><th>món</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>nặng $w_i$ (kg)</td><td>18</td><td>15</td><td>10</td></tr>
          <tr><td>giá trị $p_i$</td><td>25</td><td>24</td><td>15</td></tr></table>
          <p>Túi chứa tối đa <b>20 kg</b>. Hàng dạng bột: được lấy <b>một phần</b> mỗi món. Lấy thế nào để tổng giá trị lớn nhất?</p>
        focus: [1, 2, 2]
        say: "Chào bạn, ta có ba món hàng, nặng 18, 15 và 10 ki-lô-gam, giá trị 25, 24 và 15. Túi chỉ chứa tối đa 20 ki-lô-gam, nhưng hàng dạng bột nên được lấy một phần của mỗi món. Hỏi lấy thế nào để tổng giá trị lớn nhất?"
      - show: |
          <div class="box key"><b>Tham lam</b>: mỗi bước chọn ngay thứ <b>có lợi nhất lúc đó</b>, không quay lại sửa. Đơn giản và nhanh — nhưng chỉ đúng với một số bài toán. Hôm nay: khi nào đúng, và vì sao.</div>
        say: "Chiến lược tham lam là mỗi bước chọn ngay thứ có lợi nhất lúc đó, không bao giờ quay lại sửa. Nó đơn giản và nhanh, nhưng chỉ đúng với một số bài toán, và hôm nay ta tìm hiểu khi nào đúng và vì sao."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: chia để ra đơn giá, nhân để ra giá trị, sắp xếp giảm dần"
    checks:
      - "Rational(24, 15) == Rational(8, 5) and round(25 / 18, 3) == 1.389 and Rational(5, 10) * 15 == Rational(15, 2)"
      - "sorted([25 / 18, 1.6, 1.5], reverse=True) == [1.6, 1.5, 25 / 18]"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>ví dụ số</th></tr>
          <tr><td>chia giá trị cho khối lượng → giá trên 1 kg</td><td>$24 : 15 = 1{,}6$; &nbsp; $25 : 18 \approx 1{,}389$</td></tr>
          <tr><td>lấy một phần của món: phần = số kg lấy : số kg của món</td><td>$5 : 10 = 0{,}5$, &nbsp; giá trị $0{,}5 \cdot 15 = 7{,}5$</td></tr>
          <tr><td>sắp giảm dần (bài 12: sắp xếp trộn, $\Theta(n\log n)$)</td><td>$1{,}389;\ 1{,}6;\ 1{,}5 \ \to\ 1{,}6;\ 1{,}5;\ 1{,}389$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bài này chỉ cần ba phép tính quen thuộc. Chia giá trị cho khối lượng ra giá trên mỗi ki-lô-gam, ví dụ 24 chia 15 bằng 1 phẩy 6, còn 25 chia 18 khoảng 1 phẩy 389. Lấy một phần của món thì phần đó bằng số ki-lô-gam lấy chia số ki-lô-gam của món, lấy 5 trong 10 là 0 phẩy 5, giá trị được 0 phẩy 5 nhân 15, bằng 7 phẩy 5. Cuối cùng, sắp giảm dần, như sắp xếp trộn ở bài 12 tốn Theta của n lôgarit n, ba số này xếp thành 1 phẩy 6, 1 phẩy 5, rồi 1 phẩy 389."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: phần lấy, đơn giá và mô hình"
    checks:
      - "[round(p / w, 3) for p, w in ((25, 18), (24, 15), (15, 10))] == [1.389, 1.6, 1.5]"
    steps:
      - show: |
          <p>$x_i \in [0, 1]$: phần của món $i$ được lấy — 0 là không lấy, 1 là lấy cả món, $0{,}5$ là lấy một nửa.</p>
          <p>$v_i = \dfrac{p_i}{w_i}$: <b>đơn giá</b>, giá trị trên mỗi kg: $\ v = (1{,}389;\ 1{,}6;\ 1{,}5)$.</p>
          <div class="box key">Tìm $x_1, \dots, x_n$ để $\ \displaystyle\sum p_i\,x_i$ lớn nhất, với $\ \displaystyle\sum w_i\,x_i \le M$.</div>
        focus: [1, 2, 3]
        say: "Chữ x i là phần của món i được lấy, nằm trong đoạn từ 0 đến 1, 0 là không lấy, 1 là lấy cả món, 0 phẩy 5 là lấy một nửa. Chữ v i là đơn giá, tức giá trị trên mỗi ki-lô-gam, bằng p i chia w i, ba món có đơn giá 1 phẩy 389, 1 phẩy 6 và 1 phẩy 5. Bài toán là chọn các x để tổng giá trị lớn nhất, trong khi tổng khối lượng lấy không vượt quá M."

  # ───────────────────────── 3. QUY TẮC ─────────────────────────
  - id: rule
    kind: concept
    title: "Quy tắc tham lam: đơn giá cao lấy trước"
    steps:
      - show: |
          <div class="code"><div>sắp xếp các món theo v giảm dần;  Rem = M</div><div><span class="kw">for</span> mỗi món i theo thứ tự đó:</div><div>    <span class="kw">if</span> w[i] &lt;= Rem: x[i] = 1;  Rem = Rem - w[i]</div><div>    <span class="kw">else</span>: x[i] = Rem / w[i];  Rem = 0;  <span class="kw">break</span></div></div>
          <p class="note">Chi phí: sắp xếp $\Theta(n\log n)$ + một vòng $\Theta(n)$ → $\Theta(n\log n)$.</p>
        focus: ["1.1", "1.3", "1.4", 2]
        say: "Quy tắc tham lam là sắp các món theo đơn giá giảm dần, đặt phần còn trống bằng M. Duyệt lần lượt, nếu món còn vừa thì lấy cả món và trừ khối lượng của nó. Nếu không vừa, lấy đúng phần còn trống chia khối lượng của món, rồi dừng vì túi đã đầy. Chi phí do việc sắp xếp quyết định, Theta của n lôgarit n."

  # ───────────────────────── 3b. HÌNH ─────────────────────────
  - id: picture
    kind: intuition
    title: "Mỗi món là một cột: rộng bằng số kg, cao bằng đơn giá"
    checks:
      - "15 * Rational(8, 5) == 24 and 5 * Rational(3, 2) == Rational(15, 2) and 18 * Rational(25, 18) == 25 and 15 + 5 == 20 and 24 + Rational(15, 2) == Rational(63, 2)"
    steps:
      - show: |
          <div><svg width="1200" height="400" viewBox="0 0 1200 400"><rect x="60" y="170" width="375" height="160" fill="#2563eb" opacity="0.85"/><text x="247.5" y="204" font-size="20" text-anchor="middle" fill="#ffffff">món 2</text><text x="247.5" y="232" font-size="20" text-anchor="middle" fill="#ffffff">15 kg, đơn giá 1,6</text><text x="247.5" y="260" font-size="20" text-anchor="middle" fill="#ffffff">= 24</text><rect x="435" y="180" width="125" height="150" fill="#0d9488" opacity="0.85"/><rect x="560" y="180" width="125" height="150" fill="#0d9488" opacity="0.25"/><text x="497.5" y="214" font-size="19" text-anchor="middle" fill="#ffffff">món 3</text><text x="497.5" y="242" font-size="19" text-anchor="middle" fill="#ffffff">5 kg</text><text x="497.5" y="270" font-size="19" text-anchor="middle" fill="#ffffff">= 7,5</text><text x="622.5" y="214" font-size="19" text-anchor="middle" fill="#134e4a">5 kg</text><text x="622.5" y="242" font-size="19" text-anchor="middle" fill="#134e4a">bỏ lại</text><rect x="685" y="191" width="450" height="139" fill="#9333ea" opacity="0.25"/><text x="910.0" y="225" font-size="20" text-anchor="middle" fill="#581c87">món 1</text><text x="910.0" y="253" font-size="20" text-anchor="middle" fill="#581c87">18 kg, đơn giá 1,389</text><text x="910.0" y="281" font-size="20" text-anchor="middle" fill="#581c87">không lấy</text><line x1="60" y1="330" x2="1135" y2="330" stroke="#1f2937" stroke-width="3"/><rect x="56" y="130" width="508" height="214" fill="none" stroke="#15803d" stroke-width="4" stroke-dasharray="12 8"/><text x="310.0" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#15803d">túi 20 kg: diện tích bên trong = 24 + 7,5 = 31,5</text><text x="60" y="372" font-size="20" fill="#374151">bề rộng = số kg, chiều cao = đơn giá, diện tích = giá trị; xếp cột cao trước</text></svg></div>
        say: "Hãy vẽ mỗi món thành một cột, bề rộng là số ki-lô-gam, chiều cao là đơn giá, nên diện tích cột chính là giá trị của món. Món 2 rộng 15, cao 1 phẩy 6, diện tích 24. Xếp các cột từ cao xuống thấp rồi đặt khung túi rộng 20 ki-lô-gam từ bên trái. Phần diện tích lọt trong khung là giá trị ta lấy được, gồm cả cột món 2 và nửa trái của cột món 3, tổng 31 phẩy 5. Muốn diện tích trong một khung rộng cố định lớn nhất, đương nhiên phải lấp khung bằng các cột cao nhất trước, đó chính là quy tắc tham lam."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chạy tay với túi 20 kg"
    checks:
      - "sorted(range(3), key=lambda i: -Rational((25, 24, 15)[i], (18, 15, 10)[i])) == [1, 2, 0]"
      - "20 - 15 == 5 and Rational(5, 10) == Rational(1, 2) and 24 + Rational(1, 2) * 15 == Rational(63, 2)"
    steps:
      - show: |
          <p><b>Bước 1</b> — thứ tự đơn giá: món 2 ($1{,}6$) → món 3 ($1{,}5$) → món 1 ($1{,}389$).</p>
          <table class="t"><tr><th>món</th><th>còn trống trước</th><th>lấy</th><th>giá trị thêm</th></tr>
          <tr><td>2</td><td>20</td><td>cả món: $x_2 = 1$</td><td>24</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước một, sắp theo đơn giá, thứ tự là món 2, rồi món 3, rồi món 1. Món 2 nặng 15, mà túi còn trống 20, nên vừa. Ta lấy cả món, đặt x 2 bằng 1, được 24."
      - show: |
          <table class="t"><tr><th>món</th><th>còn trống trước</th><th>lấy</th><th>giá trị thêm</th></tr>
          <tr><td>3</td><td>$20 - 15 = 5$</td><td>$x_3 = 5/10 = 0{,}5$</td><td>$0{,}5 \cdot 15 = 7{,}5$</td></tr></table>
          <p><b>Bước 2</b>: món 3 nặng 10 &gt; 5 nên không vừa → lấy đúng phần còn trống, túi đầy.</p>
        focus: [1, 2, 1]
        say: "Bước hai, sau món 2 túi còn trống 20 trừ 15, bằng 5 ki-lô-gam. Món 3 nặng 10, lớn hơn 5, nên không vừa, ta lấy đúng phần còn trống. Phần đó là 5 chia 10, bằng 0 phẩy 5, được 0 phẩy 5 nhân 15, bằng 7 phẩy 5."
      - show: |
          <p><b>Bước 3</b>: túi đã đầy → món 1: $x_1 = 0$.</p>
          <div class="box ok">$x = (0;\ 1;\ 0{,}5)$, &nbsp; tổng giá trị $= 24 + 7{,}5 = \hlg{31{,}5}$</div>
        focus: [1, 2]
        say: "Bước ba, túi đã đầy nên món 1 không lấy, x 1 bằng 0. Tổng giá trị là 24 cộng 7 phẩy 5, bằng 31 phẩy 5."

  # ───────────────────────── 5. VÌ SAO ĐÚNG ─────────────────────────
  - id: proof
    kind: formula
    title: "Vì sao tham lam theo đơn giá là tối ưu: lập luận đổi chỗ"
    checks:
      - "round(1.6 - 25 / 18, 3) == 0.211 and round(1.5 - 25 / 18, 3) == 0.111"
    steps:
      - show: |
          <p>Giả sử một cách lấy nào đó bỏ trống 1 kg của món đơn giá <b>cao</b> $v_a$ nhưng lại lấy 1 kg của món đơn giá <b>thấp</b> $v_b$ ($v_a > v_b$).</p>
          <p>Đổi 1 kg đó sang món $a$: khối lượng không đổi, giá trị tăng $\ v_a - v_b > 0$.</p>
          <p>Ví dụ: bỏ 1 kg món 1, thêm 1 kg món 3: tăng $1{,}5 - 1{,}389 \approx 0{,}111$.</p>
        focus: [0, 1, 2, 3]
        say: "Vì sao đúng? Giả sử một cách lấy nào đó còn bỏ dở món có đơn giá cao, trong khi lại lấy một ki-lô-gam của món có đơn giá thấp hơn. Đổi ki-lô-gam đó sang món đơn giá cao, khối lượng không đổi mà giá trị tăng thêm hiệu hai đơn giá, một số dương. Ví dụ bỏ 1 ki-lô-gam món 1 để lấy thêm 1 ki-lô-gam món 3, giá trị tăng khoảng 0 phẩy 111."
      - show: |
          <div class="box key">Cứ đổi như vậy cho tới khi không còn cặp nào đổi được — đó chính là cách lấy theo đơn giá giảm dần. Mỗi lần đổi không làm giảm giá trị ⟹ tham lam <b>tối ưu</b>.</div>
          <p class="note">Lập luận chỉ chạy được vì được lấy <b>từng kg</b>. Nếu món phải lấy nguyên khối, không đổi được 1 kg — đó là lý do cái túi 0/1 khác hẳn.</p>
        focus: [1, 1, 2, 2]
        say: "Cứ đổi như vậy cho tới khi không còn cặp nào đổi được, ta thu được đúng cách lấy theo đơn giá giảm dần. Mỗi lần đổi không làm giảm giá trị, nên cách tham lam là tối ưu. Lưu ý, lập luận chỉ chạy được vì ta lấy được từng ki-lô-gam. Nếu món phải lấy nguyên khối thì không đổi lẻ được, đó là lý do cái túi 0 1 khác hẳn."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đủ khối lượng, và thua mọi cách tham lam khác"
    checks:
      - "15 + Rational(1, 2) * 10 + 18 * 0 == 20"
      - "20 - 18 == 2 and 10 + 10 == 20"
      - "25 + 2 * Rational(24, 15) == Rational(141, 5) and 15 + 24 * Rational(10, 15) == 31 and Rational(141, 5) < Rational(63, 2) and 31 < Rational(63, 2)"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: ba món nặng tổng 43 kg &gt; 20 kg, nên túi phải đầy đúng:</p>
          $$15 \cdot 1 + 10 \cdot 0{,}5 + 18 \cdot 0 = 20 \ ✓$$
        focus: [1, 2]
        say: "Phép thử đầu tiên kiểm khối lượng, vì ba món nặng tổng cộng 43 ki-lô-gam, hơn sức chứa, nên cách lấy tối ưu phải lấp đầy đúng túi. Lấy 15 nhân 1, cộng 10 nhân 0 phẩy 5, cộng 18 nhân 0, được đúng 20 ki-lô-gam."
      - show: |
          <p><b>Phép thử 2</b>: so với tham lam theo tiêu chí khác:</p>
          <table class="t"><tr><th>tiêu chí</th><th>lấy</th><th>giá trị</th></tr>
          <tr><td>giá trị cao trước</td><td>cả món 1 (18 kg), rồi 2 kg món 2</td><td>$25 + 2 \cdot 1{,}6 = 28{,}2$</td></tr>
          <tr><td>nhẹ trước</td><td>cả món 3 (10 kg), rồi 10 kg món 2</td><td>$15 + 10 \cdot 1{,}6 = 31$</td></tr>
          <tr><td>đơn giá cao trước</td><td>như trên</td><td>$\hlg{31{,}5}$</td></tr></table>
        focus: [1, 0, "2.2", "2.3", "2.4"]
        say: "Phép thử thứ hai, thử tham lam theo tiêu chí khác, vì nếu tiêu chí nào khác thắng thì ta đã sai. Mỗi cách đều chạy đủ tới khi túi đầy. Lấy món giá trị cao trước, cả món 1 nặng 18, rồi 2 ki-lô-gam món 2, chỉ được 28 phẩy 2. Lấy món nhẹ trước, cả món 3 rồi 10 ki-lô-gam món 2, được 31. Cả hai đều kém 31 phẩy 5 của đơn giá."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "[p // w for p, w in ((60, 10), (100, 20), (120, 30))] == [6, 5, 4] and 60 + 100 == 160 and 100 + 120 == 220 and 20 + 30 == 50"
      - "(lambda W, w, p: (lambda greedy, opt: (greedy, opt) == (160, 220))(sum(p[i] for i in [0, 1]), max(sum(p[i] for i in S) for r in range(4) for S in __import__('itertools').combinations(range(3), r) if sum(w[i] for i in S) <= W)))(50, (10, 20, 30), (60, 100, 120))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng tham lam theo đơn giá cho cái túi <b>0/1</b> (lấy nguyên món hoặc không) <b class="red">(sai)</b>
          <table class="t"><tr><th>túi 50 kg</th><th>món 1</th><th>món 2</th><th>món 3</th></tr><tr><td>nặng / giá trị / đơn giá</td><td>10 / 60 / 6</td><td>20 / 100 / 5</td><td>30 / 120 / 4</td></tr></table>
          <span class="note">Tham lam lấy món 1, 2: <b>160</b>; tối ưu lấy món 2, 3: <b>220</b>. Cái túi 0/1 cần một chiến lược khác.</span></div>
        say: "Lỗi thứ nhất, dùng tham lam theo đơn giá cho cái túi 0 1, tức mỗi món phải lấy nguyên hoặc không lấy. Với túi 50 ki-lô-gam và ba món nặng 10, 20, 30, giá trị 60, 100, 120, tham lam lấy món 1 và món 2 được 160, trong khi lấy món 2 và món 3 được tới 220. Cái túi 0 1 cần một chiến lược khác, tính lời giải cho mọi sức chứa nhỏ hơn rồi ghép lại."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Xếp theo giá trị cao nhất, hay theo nhẹ nhất <b class="red">(sai)</b>
          <br><span class="note">Ví dụ trên: 28,2 và 31, đều kém 31,5. Tiêu chí đúng là <b>đơn giá</b>.</span></div>
        say: "Lỗi thứ hai, xếp theo giá trị cao nhất, hay theo khối lượng nhẹ nhất. Ở ví dụ, hai cách đó chỉ được 28 phẩy 2 và 31. Tiêu chí đúng là đơn giá."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Món cuối không vừa thì bỏ qua (hoặc lấy $x_i > 1$) <b class="red">(sai)</b>
          <br><span class="note">Phải lấy đúng phần $\text{Rem}/w_i$ để túi đầy. Bỏ qua món 3 ở ví dụ chỉ còn 24.</span></div>
        say: "Lỗi thứ ba, món cuối không vừa thì bỏ qua luôn, hoặc ghi phần lấy lớn hơn 1. Phải lấy đúng phần còn trống chia khối lượng món, để túi đầy. Bỏ qua món 3 ở ví dụ chỉ còn được 24."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ tham lam “cứ chọn cái lợi nhất” là luôn đúng <b class="red">(sai)</b>
          <br><span class="note">Mỗi bài toán tham lam cần một <b>chứng minh</b> (như lập luận đổi chỗ) hoặc một phép kiểm với vét cạn trên dữ liệu nhỏ.</span></div>
        say: "Lỗi thứ tư, nghĩ cứ chọn cái lợi nhất là luôn đúng. Mỗi bài toán tham lam cần một chứng minh, như lập luận đổi chỗ, hoặc ít nhất một phép kiểm với vét cạn trên dữ liệu nhỏ."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[Rational(p, w) for p, w in ((10, 5), (12, 4), (9, 6))] == [2, 3, Rational(3, 2)] and 12 + 10 + Rational(1, 6) * 9 == Rational(47, 2)"
      - "10 - 4 == 6 and 6 - 5 == 1 and Rational(1, 6) * 9 == Rational(3, 2) and 4 + 5 + Rational(1, 6) * 6 == 10"
    steps:
      - show: |
          <p>Túi $M = 10$ kg, cái túi phân số. Tìm $x$ và tổng giá trị lớn nhất.</p>
          <table class="t"><tr><th>món</th><th>1</th><th>2</th><th>3</th></tr><tr><td>nặng $w_i$</td><td>5</td><td>4</td><td>6</td></tr><tr><td>giá trị $p_i$</td><td>10</td><td>12</td><td>9</td></tr></table>
        focus: [[1, 2], 1, 0]
        say: "Đến lượt bạn, túi 10 ki-lô-gam, ba món nặng 5, 4, 6, giá trị 10, 12, 9, được lấy một phần mỗi món. Tìm phần lấy và tổng giá trị lớn nhất. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b> — đơn giá: $\ 10 : 5 = 2$, $\ 12 : 4 = 3$, $\ 9 : 6 = 1{,}5$ → thứ tự món 2, món 1, món 3.</p>
          <table class="t"><tr><th>món</th><th>còn trống trước</th><th>lấy</th><th>giá trị thêm</th></tr>
          <tr><td>2</td><td>10</td><td>cả món</td><td>12</td></tr>
          <tr><td>1</td><td>$10 - 4 = 6$</td><td>cả món</td><td>10</td></tr>
          <tr><td>3</td><td>$6 - 5 = 1$</td><td>$x_3 = 1/6$</td><td>$\frac{1}{6} \cdot 9 = 1{,}5$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án, bước một, đơn giá là 10 chia 5 bằng 2, 12 chia 4 bằng 3, 9 chia 6 bằng 1 phẩy 5, nên thứ tự là món 2, món 1, món 3. Món 2 nặng 4 vừa túi 10, lấy cả, được 12. Còn trống 6, món 1 nặng 5 vừa, lấy cả, được 10. Còn trống 1, món 3 nặng 6 không vừa, lấy một phần sáu, được 1 phẩy 5."
      - show: |
          $$x = \Big(1;\ 1;\ \frac{1}{6}\Big), \qquad 12 + 10 + 1{,}5 = \hlg{23{,}5}$$
          <p class="note">Kiểm khối lượng: $4 + 5 + \frac{1}{6} \cdot 6 = 10$ ✓ — túi đầy đúng.</p>
        focus: [1, 2]
        say: "Bước hai, cộng lại, tổng giá trị là 12 cộng 10 cộng 1 phẩy 5, bằng 23 phẩy 5. Kiểm khối lượng, 4 cộng 5 cộng một phần sáu của 6, bằng đúng 10, túi đầy."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đơn giá $v_i = p_i / w_i$</span><span class="a">→</span>
          <span class="n">sắp giảm dần</span><span class="a">→</span>
          <span class="n">lấy cả món khi vừa, phần lẻ ở món cuối</span><span class="a">→</span>
          <span class="n">đúng nhờ lập luận đổi chỗ</span><span class="a">→</span>
          <span class="n">0/1: tham lam sai</span></div>
        say: "Tổng kết chuỗi logic. Tính đơn giá, sắp giảm dần, lấy cả món khi còn vừa và lấy phần lẻ ở món cuối. Cách này đúng nhờ lập luận đổi chỗ, nhưng sai với cái túi 0 1."
      - show: |
          <div class="box key"><b>Tư duy:</b> tham lam đúng khi đổi một lựa chọn “kém” lấy lựa chọn “tốt” <b>không bao giờ làm hại</b>. Không chứng minh được điều đó thì đừng tin.</div>
        say: "Điều cần mang theo, tham lam đúng khi việc đổi một lựa chọn kém lấy lựa chọn tốt không bao giờ làm hại. Không chứng minh được điều đó thì đừng tin."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 17): <b>tham lam (2)</b> — xếp lịch hội trường: chọn sự kiện kết thúc sớm nhất, và vì sao các tiêu chí nghe hợp lý khác lại sai.</p>
        forward_ref: true
        say: "Ở bài sau, bài 17, ta học tham lam thứ hai, xếp lịch hội trường, chọn sự kiện kết thúc sớm nhất, và xem vì sao các tiêu chí nghe hợp lý khác lại sai. Hẹn gặp bạn ở bài tiếp theo."
