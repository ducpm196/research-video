# Quy ước: M = sức chứa túi (kg); món i nặng wᵢ, giá trị pᵢ; xᵢ ∈ [0, 1] = phần của món i được lấy; vᵢ = pᵢ/wᵢ = đơn giá
#   (giá trị mỗi kg); “Rem” = sức chứa còn lại; số thập phân dùng dấu phẩy.
# Sửa bản thảo (AUDIT_CS112 §2, C22b): chỉ cái túi PHÂN SỐ mới đúng với tham lam theo đơn giá; cái túi 0/1 phản ví dụ 160 < 220.
# Nối bài trước (luật 17): bài 15 — nhánh cận thử nhiều nhánh có tỉa; bài 12 — sắp xếp trộn tốn Θ(n log n); bài 1 — Θ.
objectives:
  - "Lập mô hình cái túi phân số với xᵢ trong đoạn từ 0 đến 1"
  - "Áp dụng quy tắc tham lam theo đơn giá giảm dần và tính đúng phần lấy của món cuối"
  - "Giải thích vì sao tham lam theo đơn giá là tối ưu (lập luận đổi chỗ) và vì sao nó sai với cái túi 0/1"
