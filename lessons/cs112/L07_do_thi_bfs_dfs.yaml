id: L07
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 7 — Đồ thị: ma trận kề, danh sách kề, duyệt theo chiều rộng (BFS) và chiều sâu (DFS)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L05 (bản thảo)"
assumes: [cdot, bigTheta]
# Quy ước: đồ thị vô hướng G = (V, E); |V| = số đỉnh (gọi n), |E| = số cạnh (gọi m); láng giềng xét theo thứ tự chữ cái;
#   BFS, DFS chỉ hiện trên màn hình, lời đọc nói “duyệt theo chiều rộng”, “duyệt theo chiều sâu”.
# Sửa bản thảo: sắp xếp tô-pô bằng DFS chỉ cho đồ thị CÓ HƯỚNG và KHÔNG CHU TRÌNH (bản thảo không nêu điều kiện).
# Nối bài trước (luật 17): bài 4 — hàng đợi vào trước ra trước, ngăn xếp vào sau ra trước, đệ quy chạy trên ngăn xếp lời gọi;
#   bài 3 — danh sách liên kết; bài 5 — ngoặc nhọn là một tập hợp.
objectives:
  - "Lưu một đồ thị bằng ma trận kề và danh sách kề, và so sánh bộ nhớ Θ(n²) với Θ(n + m)"
  - "Chạy tay duyệt theo chiều rộng bằng hàng đợi và đọc ra số chặng ít nhất từ đỉnh xuất phát"
  - "Chạy tay duyệt theo chiều sâu bằng đệ quy"
  - "Giải thích vì sao phải đánh dấu đỉnh đã thăm và vì sao cả hai cách duyệt tốn Θ(n + m)"
asr_reviewed:
  - {sentence: "Muốn ra đúng thứ tự A, B, D, C, E, F như bản đệ quy, hãy đẩy láng giềng theo thứ tự ngược chữ cái.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Lỗi thứ nhất, quên đánh dấu đỉnh đã thăm.", reason: "lỗi/lội, quên/quen, đỉnh/định: nhầm thanh trên câu ngắn — NOT_VERIFIED, cần người nghe"}
  - {sentence: "Duyệt theo chiều sâu dùng đệ quy và quay lui.", reason: "sâu/xấu (s/x), đệ quy/để quý: nhầm phụ âm đầu, thanh của ASR"}
  - {sentence: "Đồ thị gồm đỉnh và cạnh, lưu bằng ma trận kề tốn Theta của n bình phương hoặc danh sách kề tốn Theta của n cộng m.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Cách thứ nhất là ma trận kề, một bảng n nhân n ô, ô ở hàng u cột v bằng 1 nếu có cạnh giữa u và v.", reason: "“ô” (ô của bảng/mảng) ASR chép “O/Âu”, cùng âm; chữ “ô” có trên màn hình"}
  - {sentence: "Lấy C ra, D đã được đánh dấu nên bỏ qua.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Nhờ đánh dấu, cả hai tốn Theta của n cộng m.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Ở đây có sáu đỉnh từ A đến F, và sáu cạnh.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Từ A tới B, từ D tới E, đều có khoảng cách 2.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Nhưng liệt kê láng giềng thì ma trận phải quét cả hàng n ô.", reason: "“ô” (ô của bảng/mảng) ASR chép “O/Âu”, cùng âm; chữ “ô” có trên màn hình"}
  - {sentence: "Khi đó đỉnh D bị xếp vào hai lần, một lần từ B và một lần từ C.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Cộng lại, chi phí là Theta của n cộng m, ở ví dụ là 6 cộng 12, bằng 18 bước.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bay từ A đến F qua ít chặng nhất"
    steps:
      - show: |
          <svg style="overflow:visible" width="880" height="300" viewBox="0 0 880 300"><line x1="60" y1="150" x2="250" y2="50" stroke="#6b7280" stroke-width="4"/><line x1="60" y1="150" x2="250" y2="250" stroke="#6b7280" stroke-width="4"/><line x1="250" y1="50" x2="440" y2="150" stroke="#6b7280" stroke-width="4"/><line x1="250" y1="250" x2="440" y2="150" stroke="#6b7280" stroke-width="4"/><line x1="440" y1="150" x2="630" y2="150" stroke="#6b7280" stroke-width="4"/><line x1="630" y1="150" x2="820" y2="150" stroke="#6b7280" stroke-width="4"/><circle cx="60" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="60" y="161" font-size="30" text-anchor="middle">A</text><circle cx="250" cy="50" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="250" y="61" font-size="30" text-anchor="middle">B</text><circle cx="250" cy="250" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="250" y="261" font-size="30" text-anchor="middle">C</text><circle cx="440" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="440" y="161" font-size="30" text-anchor="middle">D</text><circle cx="630" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="630" y="161" font-size="30" text-anchor="middle">E</text><circle cx="820" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="820" y="161" font-size="30" text-anchor="middle">F</text></svg>
          <p>Sáu thành phố, sáu đường bay hai chiều. Từ A tới F đi qua <b>ít chặng nhất</b> là bao nhiêu? Có những thành phố nào tới được?</p>
        focus: [1, 2, 2, 0]
        say: "Chào bạn, đây là bản đồ đường bay giữa sáu thành phố, mỗi đường bay đi được hai chiều. Từ A tới F thì đi qua ít chặng nhất là bao nhiêu? Và từ A tới được những thành phố nào? Hôm nay ta học cách lưu bản đồ này trong máy và hai cách đi khắp nó."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: hàng đợi, ngăn xếp và duyệt danh sách"
    checks:
      - "(lambda q: (q.append('A'), q.append('B'), q.append('C'), q.pop(0)))([])[3] == 'A'"
      - "(lambda s: (s.append('A'), s.append('B'), s.append('C'), s.pop()))([])[3] == 'C'"
    steps:
      - show: |
          <table class="t"><tr><th>ôn lại</th><th>ví dụ</th></tr>
          <tr><td>Bài 4: hàng đợi, vào trước ra trước</td><td>xếp vào A, B, C → lấy ra được A</td></tr>
          <tr><td>Bài 4: ngăn xếp, vào sau ra trước; đệ quy chạy trên ngăn xếp lời gọi</td><td>đẩy vào A, B, C → lấy ra được C</td></tr>
          <tr><td>Bài 3: đi hết danh sách liên kết $k$ phần tử tốn $k$ bước</td><td>danh sách 3 nút: 3 bước</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn ba điều sẽ dùng. Ở bài 4, hàng đợi vào trước ra trước, xếp vào A, B, C thì lấy ra được A trước. Cũng ở bài 4, ngăn xếp vào sau ra trước, đẩy vào A, B, C thì lấy ra được C, và đệ quy chạy trên chính ngăn xếp lời gọi. Ở bài 3, đi hết một danh sách liên kết k phần tử tốn k bước, ví dụ danh sách ba nút tốn ba bước."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: đỉnh, cạnh, số đỉnh, số cạnh"
    checks:
      - "len('ABCDEF') == 6 and len([('A','B'),('A','C'),('B','D'),('C','D'),('D','E'),('E','F')]) == 6"
    steps:
      - show: |
          <p>Đồ thị $G = (V, E)$: $V$ là tập <b>đỉnh</b> (thành phố), $E$ là tập <b>cạnh</b> (đường bay nối hai đỉnh).</p>
          <p>$V = \{A, B, C, D, E, F\}$; &nbsp; $E = \{AB, AC, BD, CD, DE, EF\}$.</p>
          <p>$|V|$: <b>số đỉnh</b> (ở đây 6, gọi là $n$); &nbsp; $|E|$: <b>số cạnh</b> (ở đây 6, gọi là $m$).</p>
        introduces: [card, set]
        focus: [1, 2, 3, 3]
        say: "Một đồ thị gồm hai tập, chữ V là tập đỉnh, tức các thành phố, chữ E là tập cạnh, tức các đường bay, mỗi cạnh nối hai đỉnh. Ở đây có sáu đỉnh từ A đến F, và sáu cạnh. Chữ V kẹp giữa hai vạch đứng là số đỉnh, gọi là n, chữ E kẹp giữa hai vạch đứng là số cạnh, gọi là m. Ở đây hai vạch đứng nghĩa là đếm số phần tử, không phải trị tuyệt đối."

  # ───────────────────────── 3. HAI CÁCH LƯU ─────────────────────────
  - id: store
    kind: concept
    title: "Hai cách lưu: ma trận kề và danh sách kề"
    checks:
      - "6 * 6 == 36 and 2 * 6 == 12"
      - "1000 * 1000 == 10**6 and 1000 + 2 * 3000 == 7000"
    steps:
      - show: |
          <div class="row"><div><p><b>Ma trận kề</b> ($n \cdot n$ ô; 1 = có cạnh)</p>
          <table class="t"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr>
          <tr><th>A</th><td>0</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td></tr>
          <tr><th>B</th><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td></tr>
          <tr><th>D</th><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td></tr></table>
          <p class="note">(chỉ hiện 3 hàng trong 6)</p></div>
          <div class="col"><p><b>Danh sách kề</b> (mỗi đỉnh một danh sách láng giềng)</p>
          <p>A: B, C &nbsp; B: A, D &nbsp; C: A, D</p><p>D: B, C, E &nbsp; E: D, F &nbsp; F: E</p></div></div>
        focus: ["1.1", "1.2"]
        say: "Cách thứ nhất là ma trận kề, một bảng n nhân n ô, ô ở hàng u cột v bằng 1 nếu có cạnh giữa u và v. Cách thứ hai là danh sách kề, mỗi đỉnh giữ một danh sách các láng giềng của nó, thường là danh sách liên kết như bài 3."
      - show: |
          <table class="t"><tr><th></th><th>ma trận kề</th><th>danh sách kề</th></tr>
          <tr><td>bộ nhớ</td><td>$\Theta(n^2)$</td><td>$\Theta(n + m)$</td></tr>
          <tr><td>có cạnh $uv$ không?</td><td>$\Theta(1)$</td><td>duyệt danh sách của $u$</td></tr>
          <tr><td>liệt kê láng giềng của $u$</td><td>$\Theta(n)$</td><td>số láng giềng của $u$</td></tr></table>
          <p class="note">Ví dụ: 1000 đỉnh, 3000 cạnh: ma trận cần $10^6$ ô, danh sách chỉ khoảng $1000 + 2 \cdot 3000 = 7000$ mục.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Bây giờ ta so sánh hai cách lưu đồ thị. Ma trận tốn bộ nhớ Theta của n bình phương, danh sách chỉ tốn Theta của n cộng m. Hỏi có cạnh giữa u và v không, ma trận trả lời ngay, còn danh sách phải duyệt các láng giềng của u. Nhưng liệt kê láng giềng thì ma trận phải quét cả hàng n ô. Với 1000 đỉnh và 3000 cạnh, ma trận cần một triệu ô, danh sách chỉ khoảng 7000 mục."

  # ───────────────────────── 4. BFS ─────────────────────────
  - id: bfs
    kind: example
    title: "Duyệt theo chiều rộng: loang dần bằng hàng đợi"
    checks:
      - "(lambda adj: (lambda d, q: [[(d.__setitem__(w, d[u] + 1), q.append(w)) for w in adj[u] if w not in d] for u in q] and d)({'A': 0}, ['A']))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == {'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 3, 'F': 4}"
    steps:
      - show: |
          <div class="code"><div>đánh dấu s, d[s] = 0, xếp s vào hàng đợi</div><div><span class="kw">while</span> hàng đợi còn phần tử:</div><div>    u = lấy khỏi hàng đợi</div><div>    <span class="kw">for</span> mỗi láng giềng w của u <span class="kw">chưa đánh dấu</span>:</div><div>        đánh dấu w, d[w] = d[u] + 1, xếp w vào hàng đợi</div></div>
        focus: ["1.1", "1.3", ["1.4", "1.5"], "1.5"]
        say: "Duyệt theo chiều rộng bắt đầu từ đỉnh s, đánh dấu nó, đặt khoảng cách bằng 0, rồi xếp vào hàng đợi. Mỗi vòng, lấy một đỉnh u ra khỏi hàng đợi. Với mỗi láng giềng w chưa đánh dấu, ta đánh dấu w, đặt khoảng cách của w bằng khoảng cách của u cộng 1, rồi xếp w vào hàng đợi. Hàng đợi vào trước ra trước nên các đỉnh được thăm theo từng lớp, gần trước, xa sau."
      - clear: true
        show: |
          <table class="t"><tr><th>lấy ra</th><th>láng giềng mới</th><th>hàng đợi sau bước</th></tr>
          <tr><td>A (d = 0)</td><td>B, C: d = 1</td><td>B, C</td></tr>
          <tr><td>B</td><td>D: d = 2</td><td>C, D</td></tr>
          <tr><td>C</td><td>D đã đánh dấu → bỏ qua</td><td>D</td></tr>
          <tr><td>D</td><td>E: d = 3</td><td>E</td></tr>
          <tr><td>E</td><td>F: d = 4</td><td>F</td></tr></table>
          <p>A → F ít nhất $\hlg{4}$ chặng: A, B, D, E, F.</p>
        focus: [0, "1.2", "1.3", "1.4", ["1.5", "1.6"], 2]
        say: "Chạy từ A. Lấy A ra, hai láng giềng B và C được đánh dấu với khoảng cách 1. Lấy B ra, D được đánh dấu với khoảng cách 2. Lấy C ra, D đã được đánh dấu nên bỏ qua. Tiếp theo E có khoảng cách 3, rồi F có khoảng cách 4. Vậy từ A tới F cần ít nhất 4 chặng, ví dụ đi qua B, D, E."

  - id: layers
    kind: intuition
    title: "Hình dung: chiều rộng loang ra theo từng lớp"
    checks:
      - "(lambda adj: (lambda d, q: [[(d.__setitem__(w, d[u] + 1), q.append(w)) for w in adj[u] if w not in d] for u in q] and q)({'A': 0}, ['A']))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == ['A', 'B', 'C', 'D', 'E', 'F']"
    steps:
      - show: |
          <svg width="1240" height="400" viewBox="0 0 1240 400"><rect x="35" y="45" width="190" height="270" rx="16" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="8 6"/><text x="130" y="34" font-size="26" text-anchor="middle" fill="#059669">lớp 0: d = 0</text><rect x="275" y="45" width="190" height="270" rx="16" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/><text x="370" y="34" font-size="26" text-anchor="middle" fill="#2563eb">lớp 1: d = 1</text><rect x="515" y="45" width="190" height="270" rx="16" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/><text x="610" y="34" font-size="26" text-anchor="middle" fill="#d97706">lớp 2: d = 2</text><rect x="755" y="45" width="190" height="270" rx="16" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/><text x="850" y="34" font-size="26" text-anchor="middle" fill="#7c3aed">lớp 3: d = 3</text><rect x="995" y="45" width="190" height="270" rx="16" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6"/><text x="1090" y="34" font-size="26" text-anchor="middle" fill="#b91c1c">lớp 4: d = 4</text><line x1="130" y1="180" x2="370" y2="95" stroke="#6b7280" stroke-width="3"/><line x1="130" y1="180" x2="370" y2="265" stroke="#6b7280" stroke-width="3"/><line x1="370" y1="95" x2="610" y2="180" stroke="#6b7280" stroke-width="3"/><line x1="370" y1="265" x2="610" y2="180" stroke="#6b7280" stroke-width="3"/><line x1="610" y1="180" x2="850" y2="180" stroke="#6b7280" stroke-width="3"/><line x1="850" y1="180" x2="1090" y2="180" stroke="#6b7280" stroke-width="3"/><circle cx="130" cy="180" r="36" fill="#ffffff" stroke="#059669" stroke-width="4"/><text x="130" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">A</text><circle cx="370" cy="95" r="36" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><text x="370" y="106" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">B</text><circle cx="370" cy="265" r="36" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><text x="370" y="276" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">C</text><circle cx="610" cy="180" r="36" fill="#ffffff" stroke="#d97706" stroke-width="4"/><text x="610" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">D</text><circle cx="850" cy="180" r="36" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/><text x="850" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">E</text><circle cx="1090" cy="180" r="36" fill="#ffffff" stroke="#b91c1c" stroke-width="4"/><text x="1090" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">F</text><text x="620" y="370" font-size="26" text-anchor="middle" fill="#1f2937">thứ tự lấy ra khỏi hàng đợi: A, B, C, D, E, F — lớp gần xong mới tới lớp xa</text></svg>
        focus: [0, 0, 0, 0]
        say: "Vẽ lại bản đồ theo khoảng cách từ A, ta thấy duyệt theo chiều rộng loang ra như vết dầu, từng lớp một. Lớp 0 chỉ có A, lớp 1 gồm B và C, lớp 2 là D, rồi E, rồi F. Vì hàng đợi vào trước ra trước, mọi đỉnh của một lớp được lấy ra xong rồi mới tới lớp sau. Đó chính là lý do số lớp của một đỉnh bằng số chặng ít nhất để tới nó."

  # ───────────────────────── 5. DFS ─────────────────────────
  - id: dfs
    kind: concept
    title: "Duyệt theo chiều sâu: đi tới ngõ cụt rồi quay lui"
    checks:
      - "(lambda adj: (lambda seen: (lambda f: f(f, 'A') or seen)(lambda f, u: seen.append(u) or [f(f, w) for w in adj[u] if w not in seen] and None))([]))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == ['A', 'B', 'D', 'C', 'E', 'F']"
    steps:
      - show: |
          <div class="code"><div>DFS(u):</div><div>    đánh dấu u</div><div>    <span class="kw">for</span> mỗi láng giềng w của u <span class="kw">chưa đánh dấu</span>:</div><div>        DFS(w)</div></div>
          <p>Từ A: &nbsp; A → B → D → C (ngõ cụt, quay về D) → E → F &nbsp; ⟹ thứ tự thăm $\ \hlg{A, B, D, C, E, F}$</p>
        focus: [1, 1, 2, 2]
        say: "Duyệt theo chiều sâu viết gọn bằng đệ quy. Đánh dấu u, rồi với mỗi láng giềng chưa đánh dấu, gọi đệ quy đi sâu vào đó. Từ A, ta đi B, rồi D, rồi C, tới đây mọi láng giềng của C đã thăm nên quay lui về D. Từ D đi tiếp E rồi F, nên thứ tự thăm là A, B, D, C, E, F."
      - show: |
          <div class="box key">Đệ quy chạy trên ngăn xếp lời gọi (bài 4): “quay lui” chính là một khung nhớ được lấy ra khỏi đỉnh ngăn xếp.</div>
          <p class="note">Ứng dụng: kiểm tra đồ thị có chu trình không, đếm số vùng liên thông, và sắp xếp tô-pô — xếp thứ tự công việc — chỉ dành cho đồ thị <b>có hướng, không chu trình</b>.</p>
        focus: [1, 2, 2]
        say: "Theo bài 4, đệ quy chạy trên ngăn xếp lời gọi, nên mỗi lần quay lui chính là một khung nhớ được lấy ra khỏi đỉnh ngăn xếp. Duyệt theo chiều sâu dùng để kiểm tra chu trình, đếm số vùng liên thông, và sắp xếp tô-pô, tức xếp thứ tự các công việc. Lưu ý, sắp xếp tô-pô chỉ có nghĩa với đồ thị có hướng và không có chu trình."

  # ───────────────────────── 6. CHI PHÍ ─────────────────────────
  - id: cost
    kind: formula
    title: "Vì sao cả hai cách duyệt tốn Θ(n + m)"
    checks:
      - "6 + 2 * 6 == 18 and sum(len(x) for x in ('BC', 'AD', 'AD', 'BCE', 'DF', 'E')) == 2 * 6"
    steps:
      - show: |
          <p>Nhờ đánh dấu, mỗi đỉnh vào hàng đợi (hay được gọi đệ quy) <b>đúng một lần</b> → $n$ lần.</p>
          <p>Mỗi cạnh $uv$ được nhìn tối đa 2 lần (từ $u$ và từ $v$) → tổng độ dài các danh sách kề $= 2m$.</p>
          $$\text{tổng} = \Theta(n + 2m) = \Theta(n + m) \quad (\text{ví dụ: } 6 + 2 \cdot 6 = 18 \text{ bước})$$
        focus: [1, 2, 3]
        say: "Vì có đánh dấu, mỗi đỉnh chỉ vào hàng đợi, hay chỉ được gọi đệ quy, đúng một lần, tức n lần. Mỗi cạnh được nhìn tối đa hai lần, một lần từ mỗi đầu, nên tổng độ dài các danh sách kề bằng 2m. Cộng lại, chi phí là Theta của n cộng m, ở ví dụ là 6 cộng 12, bằng 18 bước."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: hai đầu mỗi cạnh lệch khoảng cách tối đa 1"
    checks:
      - "(lambda d: all(abs(d[a] - d[b]) <= 1 for a, b in [('A','B'),('A','C'),('B','D'),('C','D'),('D','E'),('E','F')]))({'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 3, 'F': 4})"
      - "(lambda d: [abs(d[a] - d[b]) for a, b in [('A','B'),('A','C'),('B','D'),('C','D'),('D','E'),('E','F')]] == [1] * 6)({'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 3, 'F': 4})"
      - "(lambda adj: (lambda f: sorted(f(f, ['A'])))(lambda f, path: [path] if path[-1] == 'F' else [q for w in adj[path[-1]] if w not in path for q in f(f, path + [w])]))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == [['A', 'B', 'D', 'E', 'F'], ['A', 'C', 'D', 'E', 'F']]"
    steps:
      - show: |
          <p><b>Phép thử</b> cho kết quả duyệt theo chiều rộng: với <b>mọi cạnh</b> $uv$, hai khoảng cách $d[u]$, $d[v]$ lệch nhau tối đa 1.</p>
          <table class="t"><tr><th>cạnh</th><th>AB</th><th>AC</th><th>BD</th><th>CD</th><th>DE</th><th>EF</th></tr>
          <tr><td>$d$ hai đầu</td><td>0, 1</td><td>0, 1</td><td>1, 2</td><td>1, 2</td><td>2, 3</td><td>3, 4</td></tr>
          <tr><td>lệch</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1 ✓</td></tr></table>
        focus: [1, 1, [2]]
        say: "Phép thử cho kết quả duyệt theo chiều rộng là, với mọi cạnh, khoảng cách của hai đầu lệch nhau tối đa 1. Lý do là nếu lệch hơn 1, đầu xa hơn đã có đường ngắn hơn đi qua cạnh đó. Ở ví dụ, sáu cạnh đều thoả."
      - show: |
          <p>Kiểm “ít nhất 4 chặng” bằng <b>đường khác</b>: liệt kê mọi đường đi từ A tới F không lặp đỉnh.</p>
          <table class="t"><tr><th>đường đi</th><th>số chặng</th></tr>
          <tr><td>A, B, D, E, F</td><td>4</td></tr>
          <tr><td>A, C, D, E, F</td><td>4</td></tr></table>
          <p>Chỉ có 2 đường, ngắn nhất $\hlg{4}$ chặng — khớp với $d[F] = 4$ ✓</p>
        focus: [1, ["2.2", "2.3"], 3]
        say: "Kiểm kết luận ít nhất 4 chặng bằng đường khác, ta liệt kê mọi đường đi từ A tới F không lặp đỉnh. Vì mọi đường tới F đều phải qua cạnh E F, và tới E phải qua D, nên chỉ còn chọn đi qua B hay qua C, được hai đường, mỗi đường 4 chặng. Vậy đường ngắn nhất có 4 chặng, khớp với khoảng cách của F mà duyệt theo chiều rộng tính ra."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "10**6 * 10**6 == 10**12"
      - "(lambda adj: __import__('functools').reduce(lambda st, _: (lambda u, rest: (st[0] | {u}, rest + [w for w in adj[u] if w not in st[0] | {u}], st[2] + [rest + [w for w in adj[u] if w not in st[0] | {u}]]))(st[1][0], st[1][1:]), range(3), (set(), ['A'], []))[2])({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == [['B', 'C'], ['C', 'D'], ['D', 'D']]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên đánh dấu đỉnh đã thăm <b class="red">(sai)</b>
          <br><span class="note">Đồ thị có chu trình A, B, D, C, A: không đánh dấu thì vòng mãi không dừng.</span></div>
        say: "Lỗi thứ nhất, quên đánh dấu đỉnh đã thăm. Đồ thị ví dụ có vòng A, B, D, C rồi về A, nên nếu không đánh dấu, thuật toán sẽ đi vòng mãi không dừng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đánh dấu lúc <b>lấy ra</b> khỏi hàng đợi thay vì lúc <b>xếp vào</b> <b class="red">(sai)</b>
          <br><span class="note">D sẽ được xếp vào hai lần (từ B và từ C). Hàng đợi phình tới cỡ $m$ phần tử thay vì $n$; không bỏ qua bản lặp khi lấy ra thì một đỉnh bị xử lý nhiều lần.</span></div>
          <table class="t"><tr><th>lấy ra (rồi mới đánh dấu)</th><th>hàng đợi sau bước</th></tr>
          <tr><td>A</td><td>B, C</td></tr>
          <tr><td>B</td><td>C, D</td></tr>
          <tr><td>C</td><td>D, <b class="red">D</b></td></tr></table>
        focus: [1, "2.4", 1]
        say: "Lỗi thứ hai, đánh dấu lúc lấy đỉnh ra khỏi hàng đợi thay vì lúc xếp vào. Khi đó đỉnh D bị xếp vào hai lần, một lần từ B và một lần từ C. Trên đồ thị dày, hàng đợi phình tới cỡ m phần tử thay vì n, và nếu không bỏ qua bản lặp khi lấy ra, một đỉnh bị xử lý nhiều lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng ma trận kề cho đồ thị <b>thưa</b> <b class="red">(sai)</b>
          <br><span class="note">Một triệu đỉnh, vài triệu cạnh: ma trận cần $10^{12}$ ô — không máy nào chứa nổi. Danh sách kề chỉ cần vài triệu mục.</span></div>
        say: "Lỗi thứ ba, dùng ma trận kề cho đồ thị thưa, tức có rất ít cạnh so với n bình phương. Một triệu đỉnh thì ma trận cần một nghìn tỉ ô, không máy nào chứa nổi, trong khi danh sách kề chỉ cần vài triệu mục."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng duyệt theo chiều rộng để tìm đường ngắn nhất khi các cạnh có <b>độ dài khác nhau</b> <b class="red">(sai)</b>
          <br><span class="note">Chiều rộng chỉ đếm <b>số chặng</b>. Đường 4 chặng ngắn có thể tốt hơn đường 2 chặng rất dài — khi đó cần thuật toán khác.</span></div>
        say: "Lỗi thứ tư, dùng duyệt theo chiều rộng để tìm đường ngắn nhất khi các cạnh có độ dài khác nhau. Cách này chỉ đếm số chặng, mà bốn chặng ngắn có thể tốt hơn hai chặng rất dài, khi đó phải dùng một thuật toán khác."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda adj: (lambda d, q, log: [[(d.__setitem__(w, d[u] + 1), q.append(w)) for w in adj[u] if w not in d] + [log.append(q[q.index(u) + 1:])] for u in q] and log)({'C': 0}, ['C'], []))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'})[:5] == [['A', 'D'], ['D', 'B'], ['B', 'E'], ['E'], ['F']]"
      - "(lambda d: all(abs(d[a] - d[b]) == 1 for a, b in [('A','B'),('A','C'),('B','D'),('C','D'),('D','E'),('E','F')]))({'C': 0, 'A': 1, 'D': 1, 'B': 2, 'E': 2, 'F': 3})"
      - "(lambda adj: (lambda d, q: [[(d.__setitem__(w, d[u] + 1), q.append(w)) for w in adj[u] if w not in d] for u in q] and d)({'C': 0}, ['C']))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == {'C': 0, 'A': 1, 'D': 1, 'B': 2, 'E': 2, 'F': 3}"
    steps:
      - show: |
          <svg style="overflow:visible" width="880" height="300" viewBox="0 0 880 300"><line x1="60" y1="150" x2="250" y2="50" stroke="#6b7280" stroke-width="4"/><line x1="60" y1="150" x2="250" y2="250" stroke="#6b7280" stroke-width="4"/><line x1="250" y1="50" x2="440" y2="150" stroke="#6b7280" stroke-width="4"/><line x1="250" y1="250" x2="440" y2="150" stroke="#6b7280" stroke-width="4"/><line x1="440" y1="150" x2="630" y2="150" stroke="#6b7280" stroke-width="4"/><line x1="630" y1="150" x2="820" y2="150" stroke="#6b7280" stroke-width="4"/><circle cx="60" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="60" y="161" font-size="30" text-anchor="middle">A</text><circle cx="250" cy="50" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="250" y="61" font-size="30" text-anchor="middle">B</text><circle cx="250" cy="250" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="250" y="261" font-size="30" text-anchor="middle">C</text><circle cx="440" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="440" y="161" font-size="30" text-anchor="middle">D</text><circle cx="630" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="630" y="161" font-size="30" text-anchor="middle">E</text><circle cx="820" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="820" y="161" font-size="30" text-anchor="middle">F</text></svg>
          <p>Duyệt theo chiều rộng từ <b>C</b> (láng giềng theo thứ tự chữ cái). Khoảng cách tới từng đỉnh là bao nhiêu?</p>
        focus: [1, 2, 2, 0]
        say: "Đến lượt bạn, trên cùng bản đồ này. Hãy duyệt theo chiều rộng bắt đầu từ C, xét láng giềng theo thứ tự chữ cái. Khoảng cách từ C tới từng đỉnh là bao nhiêu? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <table class="t"><tr><th>lấy ra</th><th>láng giềng mới</th><th>hàng đợi sau bước</th></tr>
          <tr><td>C (d = 0)</td><td>A, D: d = 1</td><td>A, D</td></tr>
          <tr><td>A</td><td>B: d = 2 (C đã đánh dấu)</td><td>D, B</td></tr>
          <tr><td>D</td><td>E: d = 2 (B, C đã đánh dấu)</td><td>B, E</td></tr>
          <tr><td>B</td><td>không có</td><td>E</td></tr>
          <tr><td>E</td><td>F: d = 3</td><td>F</td></tr></table>
        focus: ["1.2", "1.3", "1.4", ["1.5", "1.6"]]
        say: "Làm từng bước như ví dụ, bắt đầu với C có khoảng cách 0, lấy C ra thì hai láng giềng A và D được đánh dấu với khoảng cách 1. Lấy A ra, láng giềng mới chỉ có B, vì C đã được đánh dấu, nên B có khoảng cách 2. Lấy D ra, B và C đã đánh dấu, chỉ còn E mới, nên E có khoảng cách 2. Lấy B ra không thêm gì, rồi lấy E ra thì F có khoảng cách 3."
      - show: |
          <p>C: 0 → A, D: 1 → B (qua A), E (qua D): 2 → F: 3. &nbsp; Kết quả: $\ \hlg{C{:}0,\ A{:}1,\ D{:}1,\ B{:}2,\ E{:}2,\ F{:}3}$</p>
        say: "Từ C, hai láng giềng A và D có khoảng cách 1. Từ A tới B, từ D tới E, đều có khoảng cách 2. Cuối cùng F có khoảng cách 3. Kiểm nhanh bằng phép thử ở trên, sáu cạnh đều có hai đầu lệch nhau đúng 1, nên kết quả hợp lệ."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    checks:
      - "(lambda adj: (lambda seen, st, out: [(seen.add(u), out.append(u), st.extend(w for w in reversed(adj[u]) if w not in seen)) for _ in range(30) if st for u in [st.pop()] if u not in seen] and out)(set(), ['A'], []))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == ['A', 'B', 'D', 'C', 'E', 'F']"
      - "(lambda adj: (lambda seen, st, out: [(seen.add(u), out.append(u), st.extend(w for w in adj[u] if w not in seen)) for _ in range(30) if st for u in [st.pop()] if u not in seen] and out)(set(), ['A'], []))({'A': 'BC', 'B': 'AD', 'C': 'AD', 'D': 'BCE', 'E': 'DF', 'F': 'E'}) == ['A', 'C', 'D', 'E', 'F', 'B']"
    steps:
      - show: |
          <div class="chain"><span class="n">đồ thị: đỉnh và cạnh</span><span class="a">→</span>
          <span class="n">lưu: ma trận $\Theta(n^2)$ hay danh sách $\Theta(n + m)$</span><span class="a">→</span>
          <span class="n">chiều rộng: hàng đợi, số chặng ít nhất</span><span class="a">→</span>
          <span class="n">chiều sâu: đệ quy, quay lui</span><span class="a">→</span>
          <span class="n">đánh dấu ⟹ $\Theta(n + m)$</span></div>
        say: "Tổng kết chuỗi logic. Đồ thị gồm đỉnh và cạnh, lưu bằng ma trận kề tốn Theta của n bình phương hoặc danh sách kề tốn Theta của n cộng m. Duyệt theo chiều rộng dùng hàng đợi và cho số chặng ít nhất. Duyệt theo chiều sâu dùng đệ quy và quay lui. Nhờ đánh dấu, cả hai tốn Theta của n cộng m."
      - show: |
          <div class="box key"><b>Tư duy:</b> cấu trúc phụ quyết định thuật toán — đổi hàng đợi thành ngăn xếp, và đánh dấu lúc <b>lấy ra</b> thay vì lúc xếp vào, là đổi chiều rộng thành chiều sâu.</div>
          <p class="note">Đẩy láng giềng theo thứ tự chữ cái thì đỉnh vào sau được lấy ra trước, nên từ A ta được A, C, D, E, F, B: vẫn là đi sâu, chỉ xét láng giềng theo thứ tự ngược. Muốn ra đúng A, B, D, C, E, F như bản đệ quy, hãy đẩy theo thứ tự ngược chữ cái.</p>
        focus: [1, 1, 2, 2]
        say: "Điều cần mang theo, cấu trúc phụ quyết định thuật toán. Đổi hàng đợi thành ngăn xếp, và đánh dấu đỉnh lúc lấy ra thay vì lúc xếp vào, là chiều rộng đã thành chiều sâu. Lưu ý, đẩy láng giềng theo thứ tự chữ cái thì từ A ta được A, C, D, E, F, B, vẫn là đi sâu, chỉ là xét láng giềng theo thứ tự ngược. Muốn ra đúng thứ tự A, B, D, C, E, F như bản đệ quy, hãy đẩy láng giềng theo thứ tự ngược chữ cái."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>hệ thức truy hồi và phương pháp thế ngược</b> — đếm số bước của một hàm đệ quy, qua bài toán Tháp Hà Nội.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học hệ thức truy hồi và phương pháp thế ngược, cách đếm số bước của một hàm đệ quy, qua bài toán Tháp Hà Nội. Hẹn gặp bạn ở bài tiếp theo."
