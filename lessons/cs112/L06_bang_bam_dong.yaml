scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tra cứu tức thì và luôn lấy được việc gấp nhất"
    steps:
      - show: |
          <p class="big">① Tra mã số sinh viên → họ tên, gần như <b>tức thì</b>, kể cả khi có một triệu sinh viên.</p>
          <p class="big">② Phòng cấp cứu: luôn gọi người <b>nặng nhất</b> trước, dù người đó đến sau.</p>
        focus: [0, 1, 2]
        say: "Chào bạn, hôm nay có hai bài toán. Một, tra mã số sinh viên để ra họ tên gần như tức thì, kể cả khi có một triệu sinh viên. Hai, ở phòng cấp cứu, luôn gọi người bệnh nặng nhất trước, dù người đó đến sau."
      - show: |
          <div class="box key">① → <b>bảng băm</b> (tra cứu trung bình $\Theta(1)$). &nbsp; ② → <b>đống nhị phân</b>, cài đặt của hàng đợi ưu tiên (lấy phần tử lớn nhất $\Theta(\log n)$).</div>
        say: "Bài toán một dùng bảng băm, tra cứu trung bình chỉ tốn Theta của 1. Bài toán hai dùng đống nhị phân, cách cài hàng đợi ưu tiên đã nhắc ở bài 4, lấy phần tử lớn nhất trong Theta của lôgarit của n."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: chia lấy dư, đọc ô mảng, chiều cao cây hoàn chỉnh"
    checks:
      - "7 % 5 == 2 and 22 % 7 == 1 and 22 == 3 * 7 + 1"
      - "math.floor(math.log2(6)) == 2 and math.floor(math.log2(15)) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>ôn lại</th><th>ví dụ số</th></tr>
          <tr><td>Bài 4: $a \bmod m$ là số dư khi chia $a$ cho $m$</td><td>$7 \bmod 5 = 2$, &nbsp; $22 \bmod 7 = 1$ (vì $22 = 3 \cdot 7 + 1$)</td></tr>
          <tr><td>Bài 3: đọc ô thứ $i$ của mảng tốn $\Theta(1)$</td><td>địa chỉ $=$ Base $+ i \cdot s$, một phép nhân, một phép cộng</td></tr>
          <tr><td>Bài 5: cây hoàn chỉnh $n$ nút cao $\lfloor \log_2 n \rfloor$</td><td>$n = 6$: cao 2; &nbsp; $n = 15$: cao 3</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn ba điều sẽ dùng. Ở bài 4, a chia lấy dư cho m là số dư khi chia a cho m, ví dụ 22 chia lấy dư cho 7 bằng 1, vì 22 bằng 3 nhân 7 cộng 1. Ở bài 3, đọc ô thứ i của mảng chỉ tốn Theta của 1. Ở bài 5, cây hoàn chỉnh n nút cao làm tròn xuống của lôgarit cơ số 2 của n, ví dụ 15 nút cao 3."

  # ───────────────────────── 2. BẢNG BĂM ─────────────────────────
  - id: hash
    kind: concept
    title: "Hàm băm: biến khoá thành chỉ số ô"
    checks:
      - "[k % 7 for k in (10, 22, 31, 4, 15)] == [3, 1, 3, 4, 1]"
    steps:
      - show: |
          <div class="box key">Bảng có $m$ ô. Hàm băm: $\ h(k) = k \bmod m$ — khoá $k$ được cất ở ô số $h(k)$.</div>
          <p>$m = 7$: &nbsp; $h(10) = 3,\ h(22) = 1,\ h(31) = 3,\ h(4) = 4,\ h(15) = 1$</p>
          <p class="note">Vì đọc ô thứ $i$ của mảng tốn $\Theta(1)$ (bài 3), tính $h(k)$ xong là biết ngay chỗ cần tìm.</p>
        focus: [1, 1, 2, 3]
        say: "Ý tưởng của bảng băm là biến khoá thành chỉ số ô. Bảng có m ô, hàm băm h của k bằng k chia lấy dư cho m, và khoá k được cất ở ô số h của k. Với m bằng 7, các khoá 10, 22, 31, 4, 15 lần lượt vào ô 3, 1, 3, 4, 1. Vì đọc một ô của mảng tốn Theta của 1, tính xong hàm băm là biết ngay chỗ cần tìm."
      - show: |
          <div class="box warn"><b>Đụng độ</b>: hai khoá khác nhau cùng một ô — 10 và 31 cùng ô 3; 22 và 15 cùng ô 1.</div>
        say: "Nhưng có chuyện, 10 và 31 cùng rơi vào ô 3, còn 22 và 15 cùng rơi vào ô 1. Hai khoá khác nhau cùng một ô gọi là đụng độ, và có hai cách xử lý."

  - id: chain_pic
    kind: intuition
    title: "Hình dung: mỗi khoá đi thẳng tới ô của nó"
    checks:
      - "[k % 7 for k in (10, 22, 31, 4, 15)] == [3, 1, 3, 4, 1] and [15, 22].index(22) + 1 == 2"
    steps:
      - show: |
          <svg width="1300" height="470" viewBox="0 0 1300 470"><defs><marker id="arH6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="24" fill="#6b7280" text-anchor="middle"><text x="90" y="30">khoá k</text><text x="330" y="30">ô = k mod 7</text><text x="560" y="30">ô</text><text x="800" y="30">danh sách của ô</text></g><rect x="40" y="60" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="90" y="94" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">10</text><line x1="142" y1="85" x2="514" y2="249" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arH6)"/><rect x="40" y="140" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="90" y="174" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">22</text><line x1="142" y1="165" x2="514" y2="133" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arH6)"/><rect x="40" y="220" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="90" y="254" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">31</text><line x1="142" y1="245" x2="514" y2="249" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arH6)"/><rect x="40" y="300" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="90" y="334" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><line x1="142" y1="325" x2="514" y2="307" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arH6)"/><rect x="40" y="380" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="90" y="414" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">15</text><line x1="142" y1="405" x2="514" y2="133" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arH6)"/><rect x="520" y="50" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="84" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="520" y="108" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="142" font-size="26" text-anchor="middle" fill="#1f2937">1</text><line x1="600" y1="133" x2="654" y2="133" stroke="#1f2937" stroke-width="3" marker-end="url(#arH6)"/><rect x="660" y="111" width="90" height="44" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="705" y="142" font-size="26" text-anchor="middle" fill="#065f46">15</text><line x1="750" y1="133" x2="804" y2="133" stroke="#1f2937" stroke-width="3" marker-end="url(#arH6)"/><rect x="810" y="111" width="90" height="44" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="855" y="142" font-size="26" text-anchor="middle" fill="#065f46">22</text><rect x="520" y="166" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="200" font-size="26" text-anchor="middle" fill="#1f2937">2</text><rect x="520" y="224" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="258" font-size="26" text-anchor="middle" fill="#1f2937">3</text><line x1="600" y1="249" x2="654" y2="249" stroke="#1f2937" stroke-width="3" marker-end="url(#arH6)"/><rect x="660" y="227" width="90" height="44" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="705" y="258" font-size="26" text-anchor="middle" fill="#065f46">31</text><line x1="750" y1="249" x2="804" y2="249" stroke="#1f2937" stroke-width="3" marker-end="url(#arH6)"/><rect x="810" y="227" width="90" height="44" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="855" y="258" font-size="26" text-anchor="middle" fill="#065f46">10</text><rect x="520" y="282" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="316" font-size="26" text-anchor="middle" fill="#1f2937">4</text><line x1="600" y1="307" x2="654" y2="307" stroke="#1f2937" stroke-width="3" marker-end="url(#arH6)"/><rect x="660" y="285" width="90" height="44" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="705" y="316" font-size="26" text-anchor="middle" fill="#065f46">4</text><rect x="520" y="340" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="374" font-size="26" text-anchor="middle" fill="#1f2937">5</text><rect x="520" y="398" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="432" font-size="26" text-anchor="middle" fill="#1f2937">6</text><g font-size="24" fill="#1f2937"><text x="940" y="135">ô 1: hai khoá đụng độ</text><text x="940" y="251">ô 3: hai khoá đụng độ</text><text x="940" y="380" fill="#6b7280">khoá vào sau đứng đầu</text><text x="940" y="420" fill="#6b7280">tìm 22: ô 1, đi qua 2 nút</text></g></svg>
