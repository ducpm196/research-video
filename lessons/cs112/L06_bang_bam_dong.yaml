# Quy ước: chỉ số mảng đếm từ 0 (bài 3); con của ô i là 2i + 1 và 2i + 2, cha của ô j là ⌊(j − 1)/2⌋ (kiểu đếm từ 1 chỉ nêu ở
#   bước notation_note); hàm băm h(k) = k mod m; hệ số tải viết n/m (không dùng chữ Hy Lạp); đống ở bài này là đống LỚN NHẤT.
# Nối bài trước (luật 17): bài 3 — đọc A[i] tốn Θ(1), danh sách liên kết chèn đầu Θ(1); bài 4 — a mod m là số dư, hàng đợi ưu tiên
#   lấy phần tử ưu tiên cao nhất; bài 5 — cây hoàn chỉnh n nút cao ⌊log₂ n⌋.
objectives:
  - "Tính vị trí băm bằng chia lấy dư và xử lý đụng độ bằng danh sách móc nối hoặc dò tuyến tính"
  - "Phân biệt chi phí trung bình Θ(1) và chi phí tệ nhất Θ(n) của bảng băm"
  - "Lưu một đống trong mảng, đọc ra cha và con bằng công thức chỉ số"
  - "Thực hiện chèn, lấy phần tử lớn nhất, dựng đống, và giải thích vì sao dựng đống tốn Θ(n)"
