/text><line x1="600" y1="307" x2="654" y2="307" stroke="#1f2937" stroke-width="3" marker-end="url(#arH6)"/><rect x="660" y="285" width="90" height="44" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="705" y="316" font-size="26" text-anchor="middle" fill="#065f46">4</text><rect x="520" y="340" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="374" font-size="26" text-anchor="middle" fill="#1f2937">5</text><rect x="520" y="398" width="80" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="560" y="432" font-size="26" text-anchor="middle" fill="#1f2937">6</text><g font-size="24" fill="#1f2937"><text x="940" y="135">ô 1: hai khoá đụng độ</text><text x="940" y="251">ô 3: hai khoá đụng độ</text><text x="940" y="380" fill="#6b7280">khoá vào sau đứng đầu</text><text x="940" y="420" fill="#6b7280">tìm 22: ô 1, đi qua 2 nút</text></g></svg>
        focus: [0, 0, 0, 0]
        say: "Hình cho thấy dữ liệu đi đâu trong bảng băm móc nối. Mỗi khoá bên trái chỉ cần một phép chia lấy dư cho 7 là đi thẳng tới ô của nó, không phải dò qua các ô khác. Hai khoá 22 và 15 cùng tới ô 1, còn 10 và 31 cùng tới ô 3, nên mỗi ô đó giữ một danh sách hai nút. Muốn tìm 22, ta tính 22 chia lấy dư cho 7 bằng 1, rồi đi dọc danh sách của ô 1, gặp 22 ở nút thứ hai."

  - id: collide
    kind: example
    title: "Hai cách xử lý đụng độ"
    checks:
      - "(lambda T: [T.__setitem__(k % 7, T[k % 7] + [k]) for k in (10, 22, 31, 4, 15)] and T)([[] for _ in range(7)]) == [[], [22, 15], [], [10, 31], [4], [], []]"
      - "(lambda T: [T.__setitem__(k % 7, [k] + T[k % 7]) for k in (10, 22, 31, 4, 15)] and T)([[] for _ in range(7)]) == [[], [15, 22], [], [31, 10], [4], [], []]"
      - "(lambda f: f(f, [None] * 7, [10, 22, 31, 4, 15]))(lambda f, T, ks: T if not ks else f(f, (lambda i: T[:i] + [ks[0]] + T[i + 1:])(next((ks[0] % 7 + d) % 7 for d in range(7) if T[(ks[0] % 7 + d) % 7] is None)), ks[1:])) == [None, 22, 15, 10, 31, 4, None]"
    steps:
      - show: |
          <p><b>① Móc nối</b> (chaining): mỗi ô là một danh sách liên kết, khoá mới chèn vào đầu danh sách của ô đó ($\Theta(1)$, bài 3).</p>
          <table class="t"><tr><th>ô</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
          <tr><th>danh sách</th><td></td><td>15 → 22</td><td></td><td>31 → 10</td><td>4</td><td></td><td></td></tr></table>
        focus: [1, 1, 2]
        say: "Cách một, móc nối. Mỗi ô giữ một danh sách liên kết, khoá mới được chèn vào đầu danh sách của ô đó, rẻ như bài 3 đã học. Ô 1 chứa 22 và 15, trong đó 15 vào sau nên đứng đầu, còn ô 3 chứa 10 và 31, với 31 đứng đầu."
      - show: |
          <p><b>② Dò tuyến tính</b> (linear probing): ô $h(k)$ đã có người thì thử ô kế tiếp $(h(k) + 1) \bmod m$, rồi tiếp nữa…</p>
          <table class="t"><tr><th>ô</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
          <tr><th>khoá</th><td></td><td>22</td><td>15</td><td>10</td><td>31</td><td>4</td><td></td></tr></table>
          <p class="note">31: ô 3 bận → ô 4. &nbsp; 4: ô 4 bận → ô 5. &nbsp; 15: ô 1 bận → ô 2. Tìm 4: thử ô 4 (31), rồi ô 5 → thấy sau 2 lần.</p>
        focus: [1, 2, 3, 3]
        say: "Cách hai, dò tuyến tính. Nếu ô h của k đã có khoá khác, thử ô kế tiếp, cộng 1 rồi chia lấy dư cho m để quay vòng. Số 31 gặp ô 3 bận nên vào ô 4, rồi số 4 gặp ô 4 bận nên vào ô 5, và 15 vào ô 2. Tìm số 4, ta thử ô 4 thấy 31, thử tiếp ô 5 thì thấy, sau hai lần."
      - clear: true
        show: |
          <div class="box key">Trung bình (khoá rải đều, bảng không quá đầy, $n/m$ nhỏ): tìm, chèn $\Theta(1)$. &nbsp; <b>Tệ nhất</b>: mọi khoá cùng một ô → $\Theta(n)$.</div>
          <p class="note">Ví dụ tệ: $m = 7$ và các khoá 7, 14, 21, 28 đều cho $h(k) = 0$.</p>
        focus: [1, 2]
        say: "Khi khoá rải đều và bảng không quá đầy, tức tỉ số n chia m nhỏ, tìm và chèn trung bình tốn Theta của 1. Nhưng trường hợp tệ nhất, mọi khoá cùng rơi vào một ô, ví dụ m bằng 7 với các khoá 7, 14, 21, 28, đều cho số dư 0, và việc tìm tốn Theta của n."

  # ───────────────────────── 3. ĐỐNG ─────────────────────────
  - id: heap
    kind: symbol
    title: "Đống lớn nhất: cây hoàn chỉnh cất trong mảng"
    checks:
      - "(lambda a: all(a[(q - 1) // 2] >= a[q] for q in range(1, len(a))))([9, 7, 8, 3, 5, 6])"
      - "[2*1 + 1, 2*1 + 2] == [3, 4] and (4 - 1) // 2 == 1 and [2*0 + 1, 2*0 + 2] == [1, 2]"
    steps:
      - show: |
          <svg style="overflow:visible" width="560" height="255" viewBox="0 0 560 255"><line x1="328" y1="45" x2="136" y2="125" stroke="#6b7280" stroke-width="3"/><line x1="136" y1="125" x2="40" y2="205" stroke="#6b7280" stroke-width="3"/><line x1="136" y1="125" x2="232" y2="205" stroke="#6b7280" stroke-width="3"/><line x1="328" y1="45" x2="520" y2="125" stroke="#6b7280" stroke-width="3"/><line x1="520" y1="125" x2="424" y2="205" stroke="#6b7280" stroke-width="3"/><circle cx="328" cy="45" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="328" y="56" font-size="30" text-anchor="middle">9</text><text x="366" y="53" font-size="22" fill="#d97706">[0]</text><circle cx="136" cy="125" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="136" y="136" font-size="30" text-anchor="middle">7</text><text x="174" y="133" font-size="22" fill="#d97706">[1]</text><circle cx="40" cy="205" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="40" y="216" font-size="30" text-anchor="middle">3</text><text x="78" y="213" font-size="22" fill="#d97706">[3]</text><circle cx="232" cy="205" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="232" y="216" font-size="30" text-anchor="middle">5</text><text x="270" y="213" font-size="22" fill="#d97706">[4]</text><circle cx="520" cy="125" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="520" y="136" font-size="30" text-anchor="middle">8</text><text x="558" y="133" font-size="22" fill="#d97706">[2]</text><circle cx="424" cy="205" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="424" y="216" font-size="30" text-anchor="middle">6</text><text x="462" y="213" font-size="22" fill="#d97706">[5]</text></svg>
          <p>Mảng: $[9, 7, 8, 3, 5, 6]$ &nbsp; — số trong ngoặc vuông cạnh mỗi nút là chỉ số trong mảng.</p>
          <div class="box key"><b>Đống lớn nhất</b>: cây <b>hoàn chỉnh</b>, và mọi nút $\ge$ các con của nó → phần tử lớn nhất nằm ở gốc, ô 0.</div>
        focus: [[1, 2], [1, 2], 3]
        say: "Đống nhị phân là một cây hoàn chỉnh, như ở bài 5, được cất gọn trong một mảng, đọc từng tầng từ trái sang phải. Mảng 9, 7, 8, 3, 5, 6 chính là cây trên hình, số trong ngoặc vuông là chỉ số. Đống lớn nhất còn có thêm tính chất, mọi nút đều lớn hơn hoặc bằng các con của nó, nên phần tử lớn nhất luôn nằm ở gốc, ô 0."
      - show: |
          <div class="box key">Chỉ số tính từ 0: con của ô $i$ là $\ 2i + 1\ $ và $\ 2i + 2$; &nbsp; cha của ô $j$ là $\ \left\lfloor \dfrac{j - 1}{2} \right\rfloor$.</div>
          <p>Ô 1 (số 7): con ở ô 3, 4 (số 3, 5) ✓. &nbsp; Ô 4 (số 5): cha ở $\lfloor 3/2 \rfloor = 1$ ✓</p>
        focus: [1, 1, 2]
        say: "Không cần con trỏ, vì cha và con tính được bằng chỉ số. Con của ô i là 2i cộng 1 và 2i cộng 2, cha của ô j là làm tròn xuống của j trừ 1 chia 2. Thử với ô 1 chứa số 7, các con ở ô 3 và ô 4, đúng là 3 và 5, còn cha của ô 4 là ô 1."
      - clear: true
        show: |
          <p class="note">Nhiều sách đếm chỉ số từ 1: con của $i$ là $2i$ và $2i + 1$, cha của $j$ là $\lfloor j/2 \rfloor$. Hai cách chỉ lệch nhau 1 — phải dùng đúng cặp công thức với cách đếm của mình.</p>
        notation_note: true
        say: "Nhiều sách đếm chỉ số từ 1, khi đó con của i là 2i và 2i cộng 1, cha của j là làm tròn xuống của j chia 2. Hai cách chỉ lệch nhau 1, điều quan trọng là dùng đúng cặp công thức với cách đếm của mình."

  # ───────────────────────── 4. THAO TÁC ─────────────────────────
  - id: heap_ops
    kind: formula
    title: "Chèn và lấy lớn nhất: đi theo một nhánh, tốn chiều cao"
    checks:
      - "[9, 7, 8, 3, 5, 6, 10][:2] + [10] + [3, 5, 6] + [8] == [9, 7, 10, 3, 5, 6, 8] and (6 - 1) // 2 == 2 and (2 - 1) // 2 == 0"
      - "(lambda h: (lambda f: f(f, h + [10], 6))(lambda f, a, i: a if i == 0 or a[(i - 1) // 2] >= a[i] else f(f, a[:(i - 1) // 2] + [a[i]] + a[(i - 1) // 2 + 1:i] + [a[(i - 1) // 2]] + a[i + 1:], (i - 1) // 2)))([9, 7, 8, 3, 5, 6]) == [10, 7, 9, 3, 5, 6, 8]"
      - "(lambda sift: sift(sift, [8, 7, 9, 3, 5, 6], 0))(lambda f, a, i: (lambda kids: a if not kids or a[i] >= max(a[c] for c in kids) else (lambda c: f(f, [a[c] if t == i else a[i] if t == c else a[t] for t in range(len(a))], c))(max(kids, key=lambda c: a[c])))([c for c in (2*i + 1, 2*i + 2) if c < len(a)])) == [9, 7, 8, 3, 5, 6]"
    steps:
      - show: |
          <p><b>Chèn</b> 10 vào $[9, 7, 8, 3, 5, 6]$: đặt ở cuối (ô 6), rồi <b>đổi chỗ với cha</b> khi lớn hơn cha:</p>
          <table class="t"><tr><th>10 đang ở</th><th>cha</th><th>so sánh</th><th>mảng sau bước này</th></tr>
          <tr><td>ô 6</td><td>ô 2 (số 8)</td><td>$10 > 8$: đổi</td><td>$[9, 7, 10, 3, 5, 6, 8]$</td></tr>
          <tr><td>ô 2</td><td>ô 0 (số 9)</td><td>$10 > 9$: đổi</td><td>$[\hlg{10}, 7, 9, 3, 5, 6, 8]$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Chèn số 10, ta đặt nó ở cuối mảng, ô 6, rồi so với cha, nếu lớn hơn thì đổi chỗ, gọi là vun lên. Cha của ô 6 là ô 2 chứa 8, vì 10 lớn hơn 8 nên đổi chỗ. Cha của ô 2 là ô 0 chứa 9, lại đổi chỗ, và 10 lên tới gốc."
      - show: |
          <p><b>Lấy lớn nhất</b>: lấy gốc ra, đưa phần tử <b>cuối</b> lên gốc, rồi <b>đổi chỗ với con lớn hơn</b> khi nhỏ hơn nó:</p>
          <p>Từ $[10, 7, 9, 3, 5, 6, 8]$: lấy 10, đưa 8 lên → $[8, 7, 9, 3, 5, 6]$ → 8 &lt; 9 nên đổi → $\ [\hlg{9}, 7, 8, 3, 5, 6]$</p>
          <div class="box key">Mỗi thao tác chỉ đi theo <b>một nhánh</b> từ gốc xuống lá (hoặc ngược lại) → số lần đổi chỗ $\le$ chiều cao $= \lfloor \log_2 n \rfloor$ → $\Theta(\log n)$.</div>
        focus: [1, 2, 3]
        say: "Lấy phần tử lớn nhất, ta lấy gốc ra, đưa phần tử cuối lên gốc, rồi so với con lớn hơn, nếu nhỏ hơn thì đổi chỗ, gọi là vun xuống. Lấy 10 ra, đưa 8 lên gốc, 8 nhỏ hơn con lớn hơn là 9 nên đổi chỗ, ta lại có đống ban đầu. Vì mỗi thao tác chỉ đi theo một nhánh, số lần đổi chỗ không quá chiều cao, mà theo bài 5, cây hoàn chỉnh cao làm tròn xuống của lôgarit cơ số 2 của n."

  # ───────────────────────── 5. DỰNG ĐỐNG ─────────────────────────
  - id: build
    kind: formula
    title: "Dựng đống từ mảng bất kỳ chỉ tốn Θ(n)"
    checks:
      - "0 + 4*1 + 2*2 + 1*3 == 11 < 15 and 15 * 3 == 45"
      - "abs(sum(k / 2**k for k in range(60)) - 2) < 1e-12 and 0 + Rational(1, 2) + Rational(2, 4) + Rational(3, 8) + Rational(4, 16) == Rational(13, 8)"
      - "(lambda sift: (lambda build: all(build(list(range(m))) <= m for m in range(1, 3000, 7)) and len(range(1, 3000, 7)) == 429)(lambda a: sum(sift(sift, a, i, len(a)) for i in range(len(a)//2 - 1, -1, -1))))(lambda f, a, i, n: (lambda b: 0 if b == i else ((lambda x, y: (a.__setitem__(i, y), a.__setitem__(b, x)))(a[i], a[b]), 1 + f(f, a, b, n))[1])(max([c for c in (i, 2*i + 1, 2*i + 2) if c < n], key=lambda c: a[c])))"
      - "(lambda sift: (lambda a: [a.__setitem__(slice(None), sift(sift, a, i)) for i in range(len(a)//2 - 1, -1, -1)] and a)([3, 5, 8, 9, 7, 6]))(lambda f, a, i: (lambda kids: a if not kids or a[i] >= max(a[c] for c in kids) else (lambda c: f(f, [a[c] if t == i else a[i] if t == c else a[t] for t in range(len(a))], c))(max(kids, key=lambda c: a[c])))([c for c in (2*i + 1, 2*i + 2) if c < len(a)])) == [9, 7, 8, 5, 3, 6]"
    steps:
      - show: |
          <p>Dựng đống: <b>vun xuống</b> lần lượt từ ô $\lfloor n/2 \rfloor - 1$ về ô 0 (các ô sau đó là lá, không cần làm).</p>
          <p>$[3, 5, 8, 9, 7, 6]$: ô 2 (8): giữ; &nbsp; ô 1 (5): đổi với 9; &nbsp; ô 0 (3): đổi với 9 rồi với 7 → $\ [\hlg{9, 7, 8, 5, 3, 6}]$</p>
        focus: [1, 2]
        say: "Dựng đống từ một mảng bất kỳ, ta vun xuống lần lượt từ ô làm tròn xuống của n chia 2, trừ 1, ngược về ô 0, vì các ô phía sau đều là lá. Với mảng 3, 5, 8, 9, 7, 6, ô 2 giữ nguyên, ô 1 đổi 5 với 9, ô 0 đổi 3 với 9 rồi với 7, và ta có một đống."
      - show: |
          <p>Vì sao rẻ? Cây hoàn chỉnh $n = 15$ nút: nút ở độ cao $d$ chỉ vun xuống tối đa $d$ lần.</p>
          <table class="t"><tr><th>độ cao $d$</th><th>0 (lá)</th><th>1</th><th>2</th><th>3 (gốc)</th></tr>
          <tr><td>số nút</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>
          <tr><td>tối đa đổi chỗ</td><td>0</td><td>$4 \cdot 1$</td><td>$2 \cdot 2$</td><td>$1 \cdot 3$</td></tr></table>
          <p>Tổng $\le 0 + 4 + 4 + 3 = \hlg{11} < n = 15$, &nbsp; trong khi ước lượng thô “$n$ lần, mỗi lần $\log_2 n$” cho $15 \cdot 3 = 45$.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Vì sao chỉ tốn Theta của n? Xét cây hoàn chỉnh 15 nút, nút ở độ cao d chỉ vun xuống tối đa d lần. Một nửa số nút là lá, không tốn gì, còn nút càng cao thì càng ít, chỉ có một gốc. Cộng lại tối đa 11 lần đổi chỗ, nhỏ hơn n bằng 15, trong khi ước lượng thô n nhân lôgarit cho tới 45."
      - clear: true
        show: |
          <div class="box key">Tổng quát: $\ \displaystyle\sum_{d \ge 0} \frac{n}{2^{d+1}} \cdot d = \frac{n}{2} \sum_{d \ge 0} \frac{d}{2^d} = \frac{n}{2} \cdot 2 = n$ &nbsp; → dựng đống $\Theta(n)$.</div>
          <p class="note">$\dfrac{d}{2^d}$ cộng dồn: $0 + 0{,}5 + 0{,}5 + 0{,}375 + 0{,}25 + \dots \to 2$. Máy đã dựng đống từ mảng tăng dần (một trường hợp xấu: nút nào có con cũng phải chìm xuống) với hàng trăm giá trị $n < 3000$: số lần đổi chỗ luôn $\le n$.</p>
        focus: [1, 1, 2]
        say: "Tổng quát, có khoảng n chia 2 mũ d cộng 1 nút ở độ cao d, mỗi nút tốn tối đa d lần. Tổng của d chia 2 mũ d tiến về 2, nên toàn bộ không quá n, tức dựng đống tốn Theta của n. Máy cũng đã thử mảng tăng dần, một trường hợp xấu vì nút nào có con cũng phải chìm xuống, với hàng trăm giá trị n dưới 3000, số lần đổi chỗ luôn không quá n."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: mọi cha lớn hơn hoặc bằng con"
    checks:
      - "(lambda a: all(a[(q - 1) // 2] >= a[q] for q in range(1, len(a))))([9, 7, 8, 5, 3, 6])"
      - "[(j - 1) // 2 for j in range(1, 6)] == [0, 0, 1, 1, 2] and (lambda a: [(a[(j - 1) // 2], a[j]) for j in range(1, 6)])([9, 7, 8, 5, 3, 6]) == [(9, 7), (9, 8), (7, 5), (7, 3), (8, 6)]"
    steps:
      - show: |
          <p><b>Phép thử</b>: với mọi ô $j \ge 1$, kiểm $\ a\big[\lfloor (j-1)/2 \rfloor\big] \ge a[j]$.</p>
          <table class="t"><tr><th>ô $j$</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>cha $\lfloor (j-1)/2 \rfloor$</td><td>0</td><td>0</td><td>1</td><td>1</td><td>2</td></tr>
          <tr><td>cha $\ge$ con?</td><td>$9 \ge 7$</td><td>$9 \ge 8$</td><td>$7 \ge 5$</td><td>$7 \ge 3$</td><td>$8 \ge 6$ ✓</td></tr></table>
        focus: [1, 2]
        say: "Phép thử cho một đống rất đơn giản, với mọi ô j từ 1 trở đi, phần tử ở ô cha phải lớn hơn hoặc bằng phần tử ở ô j. Thử với đống vừa dựng, 9 lớn hơn 7 và 8, 7 lớn hơn 5 và 3, 8 lớn hơn 6, nên hợp lệ."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "[k % 7 for k in (7, 14, 21, 28)] == [0, 0, 0, 0]"
      - "(lambda a: a != sorted(a, reverse=True))([9, 7, 8, 5, 3, 6])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Bảng băm luôn tra trong $\Theta(1)$” <b class="red">(sai)</b>
          <br><span class="note">Đó là trung bình khi khoá rải đều. Tệ nhất (7, 14, 21, 28 với $m = 7$): $\Theta(n)$.</span></div>
          <table class="t"><tr><th>khoá $k$</th><td>7</td><td>14</td><td>21</td><td>28</td></tr><tr><th>$k \bmod 7$</th><td>0</td><td>0</td><td>0</td><td>0</td></tr></table>
        focus: [1, [1, 2]]
        say: "Lỗi thứ nhất, nói bảng băm luôn tra cứu trong Theta của 1. Đó chỉ là trung bình khi khoá rải đều, trường hợp tệ nhất như các khoá 7, 14, 21, 28 với m bằng 7 tốn Theta của n."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “Dựng đống tốn $\Theta(n \log n)$” <b class="red">(sai)</b>
          <br><span class="note">$n \log n$ chỉ là cận trên thô (chèn từng phần tử). Vun xuống từ dưới lên tốn $\Theta(n)$, vì đa số nút ở gần đáy.</span></div>
        say: "Lỗi thứ hai, nói dựng đống tốn n nhân lôgarit của n. Đó chỉ là cận trên thô khi chèn từng phần tử. Cách vun xuống từ dưới lên chỉ tốn Theta của n, vì đa số nút nằm gần đáy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Trộn công thức chỉ số kiểu đếm từ 1 vào mảng đếm từ 0 <b class="red">(sai)</b>
          <br><span class="note">Dùng $2i, 2i + 1$ với mảng đếm từ 0: ô 0 có “con” là chính nó. Phép thử: thay $i = 0$.</span></div>
        say: "Lỗi thứ ba, trộn công thức của cách đếm từ 1 vào mảng đếm từ 0. Khi đó con của ô 0 lại là chính ô 0. Phép thử là thay i bằng 0 vào công thức."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ đống là mảng đã sắp xếp <b class="red">(sai)</b>
          <br><span class="note">$[9, 7, 8, 5, 3, 6]$ là đống nhưng không giảm dần (7 &lt; 8). Đống chỉ bảo đảm cha $\ge$ con, nên chỉ biết chắc phần tử lớn nhất.</span></div>
        say: "Lỗi thứ tư, nghĩ đống là một mảng đã sắp xếp. Đống 9, 7, 8, 5, 3, 6 không giảm dần, vì 7 nhỏ hơn 8. Đống chỉ bảo đảm cha lớn hơn hoặc bằng con, nên chỉ biết chắc phần tử lớn nhất ở gốc."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[12 % 5, 7 % 5, 17 % 5] == [2, 2, 2] and [2*2 + 1, 2*2 + 2] == [5, 6] and max(7, 8) == 8"
      - "(lambda f: f(f, [None] * 5, [12, 7, 17]))(lambda f, T, ks: T if not ks else f(f, (lambda i: T[:i] + [ks[0]] + T[i + 1:])(next((ks[0] % 5 + d) % 5 for d in range(5) if T[(ks[0] % 5 + d) % 5] is None)), ks[1:])) == [None, None, 12, 7, 17]"
      - "(lambda sift: sift(sift, [6, 7, 8, 3, 5], 0))(lambda f, a, i: (lambda kids: a if not kids or a[i] >= max(a[c] for c in kids) else (lambda c: f(f, [a[c] if t == i else a[i] if t == c else a[t] for t in range(len(a))], c))(max(kids, key=lambda c: a[c])))([c for c in (2*i + 1, 2*i + 2) if c < len(a)])) == [8, 7, 6, 3, 5]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bảng băm $m = 5$, dò tuyến tính. Chèn lần lượt 12, 7, 17: mỗi khoá vào ô nào?</td></tr>
          <tr><td>2</td><td>Lấy phần tử lớn nhất khỏi đống $[9, 7, 8, 3, 5, 6]$: mảng còn lại là gì?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bảng băm 5 ô, dò tuyến tính, chèn lần lượt 12, 7, 17, mỗi khoá vào ô nào? Câu hai, lấy phần tử lớn nhất khỏi đống 9, 7, 8, 3, 5, 6, mảng còn lại là gì? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Tính ô gốc bằng chia lấy dư, bận thì thử ô kế tiếp:</p>
          <table class="t"><tr><th>khoá</th><th>$k \bmod 5$</th><th>các ô đã thử</th><th>vào ô</th></tr>
          <tr><td>12</td><td>2</td><td>2</td><td>$\hlg{2}$</td></tr>
          <tr><td>7</td><td>2</td><td>2 (bận), 3</td><td>$\hlg{3}$</td></tr>
          <tr><td>17</td><td>2</td><td>2 (bận), 3 (bận), 4</td><td>$\hlg{4}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Câu một, với mỗi khoá ta tính ô gốc bằng chia lấy dư cho 5, ô bận thì thử ô kế tiếp. Số 12 chia 5 dư 2, ô 2 còn trống nên vào ô 2. Số 7 cũng dư 2, nhưng ô 2 bận nên thử ô 3 và vào đó. Còn 17 dư 2, ô 2 và ô 3 đều bận, nên vào ô 4."
      - clear: true
        show: |
          <p>② Lấy gốc 9 ra, đưa phần tử cuối (6) lên gốc, rồi vun xuống:</p>
          <table class="t"><tr><th>bước</th><th>mảng</th><th>lý do</th></tr>
          <tr><td>đưa 6 lên gốc</td><td>$[6, 7, 8, 3, 5]$</td><td>giữ cây hoàn chỉnh</td></tr>
          <tr><td>đổi 6 với 8</td><td>$[\hlg{8, 7, 6, 3, 5}]$</td><td>con lớn hơn của ô 0 là 8 (ô 2)</td></tr>
          <tr><td>dừng</td><td>—</td><td>ô 2 có con ở ô 5, 6: ngoài mảng 5 phần tử</td></tr></table>
        focus: [[1, "2.2"], "2.3", "2.4"]
        say: "Câu hai, lấy gốc 9 ra, rồi đưa phần tử cuối là 6 lên gốc để cây vẫn hoàn chỉnh, được 6, 7, 8, 3, 5. Hai con của gốc là 7 và 8, con lớn hơn là 8 ở ô 2, và 6 nhỏ hơn 8 nên đổi chỗ, được 8, 7, 6, 3, 5. Số 6 giờ ở ô 2, mà con của ô 2 là ô 5 và ô 6, đều nằm ngoài mảng năm phần tử, nên dừng."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">băm: $h(k) = k \bmod m$</span><span class="a">→</span>
          <span class="n">đụng độ: móc nối hoặc dò tiếp</span><span class="a">→</span>
          <span class="n">trung bình $\Theta(1)$, tệ nhất $\Theta(n)$</span><span class="a">→</span>
          <span class="n">đống: cây hoàn chỉnh trong mảng, cha $\ge$ con</span><span class="a">→</span>
          <span class="n">chèn, lấy lớn nhất $\Theta(\log n)$; dựng $\Theta(n)$</span></div>
        say: "Tổng kết chuỗi logic. Bảng băm biến khoá thành ô bằng chia lấy dư, xử lý đụng độ bằng móc nối hoặc dò tiếp, trung bình tốn Theta của 1 nhưng tệ nhất Theta của n. Đống là cây hoàn chỉnh cất trong mảng với cha không nhỏ hơn con. Chèn và lấy lớn nhất tốn Theta của lôgarit, còn dựng đống chỉ tốn Theta của n."
      - show: |
          <div class="box key"><b>Tư duy:</b> luôn hỏi “trung bình hay tệ nhất?”, và với tổng nhiều bước, hãy <b>đếm theo tầng</b> trước khi nhân thô.</div>
        say: "Điều cần mang theo, luôn hỏi chi phí là trung bình hay tệ nhất. Và với một tổng nhiều bước, hãy đếm theo từng tầng trước khi nhân thô."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>đồ thị</b> — cách lưu một mạng lưới thành phố và đường bay, và hai cách duyệt: loang rộng bằng hàng đợi, đi sâu bằng ngăn xếp.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học đồ thị, cách lưu một mạng lưới các thành phố và đường bay, cùng hai cách duyệt, loang rộng bằng hàng đợi và đi sâu bằng ngăn xếp. Hẹn gặp bạn ở bài tiếp theo."
