  - {sentence: "Tầng đáy có 32768 lời gọi, mỗi lời gọi trả về T của 2 bằng 2, cũng được 65536.", reason: "ASR chép “Tần đáy có 32.768 lời gọi, mỗi lời gọi trả VT của 2 bằng 2 cũng được 65.536.” (0.928): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: tầng/tần, về (trong “về t” → “vt”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cộng thêm tầng đáy, ta đoán được đáp số thuộc Theta của n nhân lôgarit lôgarit n, và tám bước sau đây sẽ chứng minh chặt điều đó.", reason: "ASR chép “Cộng thêm tầng đáy, ta đoán được đáp số thuộc Teta của n nhân Logarith Logarith n và 8 bước sau đây sẽ chứng minh chặt điều đó.” (0.964): “theta” đọc “tê-ta” theo lexicon_vi.CS112.yaml (probe p1_tiem_can 8/8), ASR viết “teta/θ” — đúng âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đến lượt bạn, giải hệ thức T của 2 bằng 0, T của n bằng 2 nhân T của căn n, cộng lôgarit cơ số 2 của n.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một hệ thức có căn bậc hai"
    steps:
      - show: |
          $$T(n) = \sqrt{n}\;T(\sqrt{n}) + n$$
          <p>Không phải “giảm 1” (bài 8), cũng không phải “chia đôi” (bài 10): căn bậc hai nằm ở <b>cả hệ số lẫn kích thước</b>.</p>
          <div class="box key">Mẹo: <b>đổi biến</b> $n = 2^m$ — lấy căn thành chia đôi số mũ, rồi dùng lại các kỹ thuật cũ.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, hôm nay ta gặp hệ thức T của n bằng căn n nhân T của căn n, cộng n. Nó không phải kiểu giảm đi 1 như Tháp Hà Nội ở bài 8, cũng không phải kiểu chia đôi ở bài 10, vì căn bậc hai nằm ở cả hệ số lẫn kích thước. Mẹo là đổi biến, đặt n bằng 2 mũ m, để lấy căn trở thành chia đôi số mũ, rồi dùng lại các kỹ thuật cũ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: lấy căn là chia đôi số mũ"
    checks:
      - "math.isqrt(2**16) == 2**8 and math.log2(2**16) == 16 and math.log2(16) == 4"
      - "(lambda m: sp.simplify(sp.sqrt(2**m) - 2**(m/2)) == 0)(sp.Symbol('m', positive=True))"
    steps:
      - show: |
          <p>$n = 2^m \iff m = \log_2 n$. &nbsp; $\sqrt{n} = (2^m)^{1/2} = 2^{m/2}$ — <b>lấy căn = chia đôi số mũ</b>.</p>
          <p>Ví dụ: $n = 65\,536 = 2^{16}$: &nbsp; $\sqrt{n} = 2^8 = 256$, &nbsp; $m = 16$, &nbsp; $\log_2 m = 4$.</p>
          <p class="note">$\log_2 \log_2 n$: lôgarit hai lần — với $n = 65\,536$ chỉ bằng 4, tăng cực chậm.</p>
        focus: [0, 1, 2, 3]
        say: "Trước hết, ta ôn lại một điều về lũy thừa. Nếu n bằng 2 mũ m thì m bằng lôgarit cơ số 2 của n, và căn n bằng 2 mũ m chia 2, nghĩa là lấy căn chính là chia đôi số mũ. Ví dụ n bằng 65536, tức 2 mũ 16, căn của nó là 2 mũ 8, bằng 256. Lấy lôgarit hai lần của 65536 chỉ được 4, nên đại lượng này tăng cực chậm."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hai hàm phụ S và U"
    steps:
      - show: |
          <p>$S(m) = T(2^m)$: cùng giá trị với $T$, nhưng <b>đánh số theo số mũ</b> $m$.</p>
          <p>$U(m) = \dfrac{S(m)}{2^m}$: chia bớt phần tăng nhanh $2^m$ để lộ ra phần còn lại.</p>
        focus: [0, 1, 2]
        say: "Ta sẽ dùng hai hàm phụ. Hàm S của m bằng T của 2 mũ m, cùng giá trị với T nhưng được đánh số theo số mũ m. Hàm U của m bằng S của m chia 2 mũ m, chia bớt phần tăng nhanh để lộ ra phần còn lại."

  # ───────────────────────── 3b. HÌNH: CÂY THEO TẦNG ─────────────────────────
  - id: ladder
    kind: intuition
    title: "Nhìn theo tầng: căn ở n là chia đôi ở số mũ, mỗi tầng tốn đúng n"
    checks:
      - "all(math.isqrt(s) ** 2 == s for s in (65536, 256, 16, 4)) and [65536, 256, 16, 4, 2] == [2**m for m in (16, 8, 4, 2, 1)]"
      - "(lambda sz, cl: all(sz[i + 1] == math.isqrt(sz[i]) and cl[i + 1] == cl[i] * math.isqrt(sz[i]) for i in range(4)) and all(c * s == 65536 for c, s in zip(cl[:4], sz[:4])) and cl[4] * 2 == 65536)([65536, 256, 16, 4, 2], [1, 256, 4096, 16384, 32768])"
      - "math.log2(16) == 4 == math.log2(math.log2(65536))"
    steps:
      - show: |
          <div><svg width="1200" height="430" viewBox="0 0 1200 430"><defs><marker id="arL11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="130" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">kích thước n</text><text x="390" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">số mũ m</text><text x="700" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">số lời gọi</text><text x="1010" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">việc cả tầng</text><rect x="55" y="61" width="150" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130" y="93" font-size="24" text-anchor="middle" fill="#1f2937">65 536</text><rect x="330" y="61" width="120" height="48" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="390" y="93" font-size="24" text-anchor="middle" fill="#1f2937">16</text><text x="700" y="93" font-size="24" text-anchor="middle" fill="#1f2937">1</text><text x="1010" y="93" font-size="22" text-anchor="middle" fill="#15803d">1 × 65 536 = 65 536</text><line x1="130" y1="110" x2="130" y2="139" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="215" y="131" font-size="19" fill="#2563eb">lấy căn</text><line x1="390" y1="110" x2="390" y2="139" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="460" y="131" font-size="19" fill="#b45309">chia đôi</text><rect x="55" y="141" width="150" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130" y="173" font-size="24" text-anchor="middle" fill="#1f2937">256</text><rect x="330" y="141" width="120" height="48" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="390" y="173" font-size="24" text-anchor="middle" fill="#1f2937">8</text><text x="700" y="173" font-size="24" text-anchor="middle" fill="#1f2937">256</text><text x="1010" y="173" font-size="22" text-anchor="middle" fill="#15803d">256 × 256 = 65 536</text><line x1="130" y1="190" x2="130" y2="219" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="215" y="211" font-size="19" fill="#2563eb">lấy căn</text><line x1="390" y1="190" x2="390" y2="219" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="460" y="211" font-size="19" fill="#b45309">chia đôi</text><rect x="55" y="221" width="150" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130" y="253" font-size="24" text-anchor="middle" fill="#1f2937">16</text><rect x="330" y="221" width="120" height="48" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="390" y="253" font-size="24" text-anchor="middle" fill="#1f2937">4</text><text x="700" y="253" font-size="24" text-anchor="middle" fill="#1f2937">4 096</text><text x="1010" y="253" font-size="22" text-anchor="middle" fill="#15803d">4 096 × 16 = 65 536</text><line x1="130" y1="270" x2="130" y2="299" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="215" y="291" font-size="19" fill="#2563eb">lấy căn</text><line x1="390" y1="270" x2="390" y2="299" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="460" y="291" font-size="19" fill="#b45309">chia đôi</text><rect x="55" y="301" width="150" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130" y="333" font-size="24" text-anchor="middle" fill="#1f2937">4</text><rect x="330" y="301" width="120" height="48" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="390" y="333" font-size="24" text-anchor="middle" fill="#1f2937">2</text><text x="700" y="333" font-size="24" text-anchor="middle" fill="#1f2937">16 384</text><text x="1010" y="333" font-size="22" text-anchor="middle" fill="#15803d">16 384 × 4 = 65 536</text><line x1="130" y1="350" x2="130" y2="379" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="215" y="371" font-size="19" fill="#2563eb">lấy căn</text><line x1="390" y1="350" x2="390" y2="379" stroke="#1f2937" stroke-width="3" marker-end="url(#arL11)"/><text x="460" y="371" font-size="19" fill="#b45309">chia đôi</text><rect x="55" y="381" width="150" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130" y="413" font-size="24" text-anchor="middle" fill="#1f2937">2</text><rect x="330" y="381" width="120" height="48" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="390" y="413" font-size="24" text-anchor="middle" fill="#1f2937">1</text><text x="700" y="413" font-size="24" text-anchor="middle" fill="#1f2937">32 768</text><text x="1010" y="413" font-size="22" text-anchor="middle" fill="#15803d">32 768 × 2 = 65 536</text></svg></div>
        say: "Trước khi biến đổi, hãy nhìn hệ thức chạy với n bằng 65536, mỗi hàng là một tầng của cây lời gọi. Cột đầu là kích thước, mỗi tầng lấy căn một lần, 65536 xuống 256, xuống 16, xuống 4, xuống 2. Cột thứ hai là số mũ m tương ứng, 16, 8, 4, 2, 1, mỗi tầng chỉ chia đôi, nên có đúng lôgarit của 16, tức 4 lần chia, trước khi chạm đáy. Cột thứ ba đếm lời gọi, mỗi lời gọi kích thước s sinh ra căn s lời gọi con, nên số lời gọi nhân lên 256, rồi 16, rồi 4, rồi 2. Cột cuối nhân số lời gọi với việc làm thêm của mỗi lời gọi, và tầng nào cũng ra đúng 65536, tức đúng n. Tầng đáy cũng vậy, vì mỗi lời gọi ở đó trả về T của 2 bằng 2."
      - show: |
          <div class="box key">Mỗi tầng tốn đúng $n$; số tầng có lời gọi đệ quy là $\log_2 m = \log_2\log_2 n$; cộng thêm tầng đáy:</div>
          $$T(n) = n \cdot \log_2\log_2 n + (\text{tầng đáy}) \in \Theta(n \log\log n)$$
        focus: [1, 2]
        say: "Vậy mỗi tầng tốn đúng n, và số tầng có lời gọi đệ quy bằng số lần chia đôi số mũ, tức lôgarit hai lần của n. Cộng thêm tầng đáy, ta đoán được đáp số thuộc Theta của n nhân lôgarit lôgarit n, và tám bước sau đây sẽ chứng minh chặt điều đó."

  # ───────────────────────── 4. TÁM BƯỚC ─────────────────────────
  - id: steps
    kind: formula
    title: "Tám bước đổi biến"
    checks:
      - "(lambda m, S: sp.simplify(2**(m/2) * S / 2**m - S / 2**(m/2)) == 0)(sp.Symbol('m', positive=True), sp.Symbol('S'))"
      - "(lambda U: all(U(U, 2**k) == k + U(U, 1) for k in range(0, 30)))(lambda f, m: 1 if m == 1 else f(f, m//2) + 1)"
    steps:
      - show: |
          <p>① Đặt $n = 2^m$. &nbsp; ② Thay vào: $\ T(2^m) = 2^{m/2}\,T(2^{m/2}) + 2^m$</p>
          <p>③ Đặt $S(m) = T(2^m)$: $\quad S(m) = 2^{m/2}\,S(m/2) + 2^m$</p>
        focus: [1, 1, 1, 2]
        say: "Bước một, đặt n bằng 2 mũ m. Bước hai, thay vào hệ thức, nhớ rằng căn n bằng 2 mũ m chia 2. Ta được T của 2 mũ m bằng 2 mũ m chia 2 nhân T của 2 mũ m chia 2, cộng 2 mũ m. Bước ba, viết lại theo S, ta có S của m bằng 2 mũ m chia 2 nhân S của m chia 2, cộng 2 mũ m."
      - show: |
          <p>④ <b>Chia hai vế cho $2^m$</b> (vì $\frac{2^{m/2}}{2^m} = \frac{1}{2^{m/2}}$):</p>
          $$\frac{S(m)}{2^m} = \frac{S(m/2)}{2^{m/2}} + 1$$
          <p>⑤ Đặt $U(m) = \dfrac{S(m)}{2^m}$: $\quad \hlo{U(m) = U(m/2) + 1}$</p>
        focus: [1, 2, 3]
        say: "Bước bốn là chìa khoá, chia hai vế cho 2 mũ m. Vì 2 mũ m chia 2, chia cho 2 mũ m, bằng một chia 2 mũ m chia 2, hệ số vướng víu biến mất và số hạng cuối thành 1. Bước năm, viết lại theo U, ta được U của m bằng U của m chia 2, cộng 1, đúng dạng chia đôi của bài 10."
      - show: |
          <p>⑥ Như bài 10 (một lời gọi nửa kích thước, cộng 1): $\ U(m) = \log_2 m + U(1)$</p>
          <p>⑦ $S(m) = 2^m\,\big(\log_2 m + U(1)\big)$ &nbsp;&nbsp; ⑧ Thay $2^m = n$, $m = \log_2 n$:</p>
          $$\hlg{T(n) = n\,\big(\log_2 \log_2 n + c\big)} \in \Theta(n \log \log n), \qquad c = U(1) = \frac{T(2)}{2}$$
        focus: [1, 2, 3, 3]
        say: "Bước sáu, giống bài 10, một lời gọi nửa kích thước cộng 1 cho U của m bằng lôgarit cơ số 2 của m, cộng U của 1. Bước bảy, nhân lại 2 mũ m để có S. Bước tám, đổi biến ngược, thay 2 mũ m bằng n và m bằng lôgarit của n. Ta được T của n bằng n nhân, lôgarit của lôgarit của n, cộng hằng số c, thuộc Theta của n nhân lôgarit lôgarit n."

  # ───────────────────────── 5. VÍ DỤ SỐ ─────────────────────────
  - id: numeric
    kind: example
    title: "Kiểm bằng số với T(2) = 2"
    checks:
      - "(lambda T: [T(T, n) for n in (4, 16, 256, 65536)] == [8, 48, 1024, 327680])(lambda f, n: 2 if n == 2 else math.isqrt(n) * f(f, math.isqrt(n)) + n)"
      - "[n * (math.log2(math.log2(n)) + 1) for n in (4, 16, 256, 65536)] == [8, 48, 1024, 327680]"
    steps:
      - show: |
          <p>Chọn $T(2) = 2$ → $c = 1$. Công thức: $T(n) = n\,(\log_2\log_2 n + 1)$.</p>
          <table class="t"><tr><th>$n$</th><th>tính theo hệ thức</th><th>theo công thức</th></tr>
          <tr><td>4</td><td>$2 \cdot T(2) + 4 = 8$</td><td>$4 \cdot (1 + 1) = 8$</td></tr>
          <tr><td>16</td><td>$4 \cdot T(4) + 16 = 48$</td><td>$16 \cdot (2 + 1) = 48$</td></tr>
          <tr><td>256</td><td>$16 \cdot T(16) + 256 = 1024$</td><td>$256 \cdot (3 + 1) = 1024$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng số, chọn T của 2 bằng 2 nên c bằng 1. Với n bằng 4, hệ thức cho 2 nhân 2 cộng 4, bằng 8, công thức cho 4 nhân 2, cũng bằng 8. Với n bằng 16, cả hai đều cho 48. Với n bằng 256, cả hai đều cho 1024."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: thay đáp số vào hệ thức, rồi cộng theo tầng"
    checks:
      - "4 * 65536 == 262144 and 32768 * 2 == 65536 and 262144 + 65536 == 327680 == 65536 * (4 + 1)"
      - "256 * 1024 + 65536 == 327680 and (lambda T: T(T, 65536))(lambda f, n: 2 if n == 2 else math.isqrt(n) * f(f, math.isqrt(n)) + n) == 327680"
      - "(lambda n, c: sp.simplify(sp.sqrt(n) * (sp.sqrt(n) * (sp.log(sp.log(sp.sqrt(n), 2), 2) + c)) + n - n * (sp.log(sp.log(n, 2), 2) + c)))(sp.Symbol('n', positive=True), sp.Symbol('c')) == 0"
    steps:
      - show: |
          <p><b>Phép thử 1</b> — thay đáp số vào vế phải:</p>
          $$\begin{aligned} \sqrt{n}\cdot T(\sqrt{n}) + n &= \sqrt{n}\cdot\sqrt{n}\,\big(\log_2 \log_2 \sqrt{n} + c\big) + n \\ &= n\,\big(\log_2 \log_2 n - 1 + c\big) + n = n\,\big(\log_2\log_2 n + c\big)\ ✓ \end{aligned}$$
          <p class="note">vì $\log_2 \sqrt{n} = \frac{1}{2}\log_2 n$ nên $\log_2\log_2\sqrt{n} = \log_2\log_2 n - 1$</p>
        focus: [1, 3, 2]
        say: "Phép thử chắc chắn là thay đáp số vào vế phải. Vì lôgarit của căn n bằng một nửa lôgarit của n, lấy lôgarit thêm lần nữa thì bớt đi đúng 1. Số 1 bị bớt đó được bù lại bởi số hạng cộng n, và ta lấy lại đúng đáp số."
      - clear: true
        show: |
          <p><b>Phép thử 2</b> — cộng theo tầng của hình cây, $n = 65\,536$, $T(2) = 2$:</p>
          <table class="t"><tr><th>tầng</th><th>số lời gọi</th><th>việc mỗi lời gọi</th><th>cả tầng</th></tr>
          <tr><td>0, 1, 2, 3 (đệ quy)</td><td>1; 256; 4096; 16384</td><td>65536; 256; 16; 4</td><td>$4 \cdot 65\,536 = 262\,144$</td></tr>
          <tr><td>4 (đáy, $T(2) = 2$)</td><td>32768</td><td>2</td><td>$32\,768 \cdot 2 = 65\,536$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Phép thử thứ hai đi đường khác, không dùng công thức mà cộng theo tầng của hình cây, với n bằng 65536 và T của 2 bằng 2. Bốn tầng có lời gọi đệ quy, mỗi tầng tốn 65536, cộng lại 262144. Tầng đáy có 32768 lời gọi, mỗi lời gọi trả về T của 2 bằng 2, cũng được 65536."
      - clear: true
        show: |
          $$262\,144 + 65\,536 = \hlg{327\,680} = 65\,536 \cdot (4 + 1) = n\,\big(\log_2\log_2 n + 1\big)\ ✓$$
          <p class="note">Khớp cả hệ thức tính thẳng: $T(65\,536) = 256 \cdot T(256) + 65\,536 = 256 \cdot 1024 + 65\,536 = 327\,680$.</p>
        focus: [1, 2]
        say: "Vì cây chỉ gồm các tầng đệ quy và tầng đáy, cộng hai phần được 327680, đúng bằng 65536 nhân 5, tức n nhân lôgarit hai lần của n cộng 1. Tính thẳng từ hệ thức cũng ra 256 nhân 1024, cộng 65536, bằng 327680, ba đường cho cùng một con số."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "math.log2(math.log2(65536)) == 4 and math.log2(65536) ** 2 == 256"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ qua bước ④, không chia cho $2^m$ <b class="red">(sai)</b>
          <br><span class="note">$S(m) = 2^{m/2} S(m/2) + 2^m$ vẫn có hệ số thay đổi theo $m$ — không giải tiếp được bằng mẹo chia đôi.</span></div>
        say: "Lỗi thứ nhất, bỏ qua bước bốn, không chia hai vế cho 2 mũ m. Khi đó hệ thức của S vẫn có hệ số thay đổi theo m, và không giải tiếp được bằng mẹo chia đôi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng công thức có sẵn cho dạng $a\,T(n/b) + f(n)$ với $a = \sqrt{n}$ <b class="red">(sai)</b>
          <br><span class="note">Các công thức đó cần $a$ là <b>hằng số</b>; $\sqrt{n}$ thay đổi theo $n$.</span></div>
        say: "Lỗi thứ hai, dùng ngay các công thức có sẵn cho dạng a nhân T của n chia b, với a bằng căn n. Các công thức đó cần a là hằng số, mà căn n lại thay đổi theo n."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên đổi biến ngược: kết luận $T \in \Theta(\log m)$ <b class="red">(sai)</b>
          <br><span class="note">$\log_2 m$ là của $U$, không phải $T$. Phải nhân lại $2^m$ và thay $m = \log_2 n$.</span></div>
        say: "Lỗi thứ ba, quên đổi biến ngược, kết luận T thuộc Theta của lôgarit m. Lôgarit của m là đáp số của U chứ không phải của T, phải nhân lại 2 mũ m và thay m bằng lôgarit của n."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhầm $\log_2\log_2 n$ với $(\log_2 n)^2$ <b class="red">(sai)</b>
          <table class="t"><tr><th>$n = 65\,536$</th><th>giá trị</th></tr><tr><td>$\log_2\log_2 n$ (lôgarit <b>hai lần</b>)</td><td>4</td></tr><tr><td>$(\log_2 n)^2$ (<b>bình phương</b>)</td><td>256</td></tr></table></div>
        say: "Lỗi thứ tư, nhầm lôgarit hai lần với bình phương lôgarit. Với n bằng 65536, lôgarit hai lần chỉ bằng 4, còn bình phương lôgarit bằng 256."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda S: [S(S, m) for m in (1, 2, 4, 8, 16)] == [m * int(math.log2(m)) for m in (1, 2, 4, 8, 16)] == [0, 2, 8, 24, 64])(lambda f, m: 0 if m == 1 else 2*f(f, m//2) + m)"
      - "(lambda T: [T(T, n) for n in (4, 16, 256, 65536)] == [2, 8, 24, 64])(lambda f, n: 0 if n == 2 else 2*f(f, math.isqrt(n)) + int(math.log2(n)))"
    steps:
      - show: |
          $$T(2) = 0, \qquad T(n) = 2\,T(\sqrt{n}) + \log_2 n$$
          <p class="note">Gợi ý: đặt $n = 2^m$, $S(m) = T(2^m)$; hệ thức mới giải bằng thế ngược như bài 10.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, giải hệ thức T của 2 bằng 0, T của n bằng 2 nhân T của căn n, cộng lôgarit cơ số 2 của n. Gợi ý, đặt n bằng 2 mũ m và S của m bằng T của 2 mũ m, hệ thức mới giải bằng thế ngược như bài 10. Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p><b>Bước 1</b> — đặt $n = 2^m$, $S(m) = T(2^m)$; vì $\log_2 n = m$ và $\sqrt{n} = 2^{m/2}$: $\ S(m) = 2\,S(m/2) + m$, $\ S(1) = T(2) = 0$.</p>
          $$S(m) = 2^i\,S(m/2^i) + i \cdot m \;\xrightarrow{\ i = \log_2 m\ }\; S(m) = m \cdot S(1) + m\log_2 m = m\log_2 m$$
        focus: [1, 1, 2, 2]
        say: "Đáp án, bước một, đặt n bằng 2 mũ m, khi đó lôgarit của n chính là m và căn n là 2 mũ m chia 2. Hệ thức thành S của m bằng 2 nhân S của m chia 2, cộng m, với S của 1 bằng T của 2, bằng 0. Thế ngược như bài 10, mỗi tầng cộng thêm đúng m, sau i tầng ta có 2 mũ i nhân S của m chia 2 mũ i, cộng i nhân m. Dừng khi i bằng lôgarit của m, được S của m bằng m nhân lôgarit của m."
      - show: |
          <p><b>Bước 2</b> — đổi ngược $m = \log_2 n$: $\ \hlg{T(n) = \log_2 n \cdot \log_2\log_2 n}$. Thử bằng hệ thức:</p>
          <table class="t"><tr><th>$n$</th><th>hệ thức</th><th>công thức</th></tr>
          <tr><td>16</td><td>$2 \cdot T(4) + 4 = 2 \cdot 2 + 4 = 8$</td><td>$4 \cdot 2 = 8$</td></tr>
          <tr><td>256</td><td>$2 \cdot T(16) + 8 = 2 \cdot 8 + 8 = 24$</td><td>$8 \cdot 3 = 24$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước hai, đổi ngược với m bằng lôgarit của n, ta được T của n bằng lôgarit của n nhân lôgarit hai lần của n. Thử với n bằng 16, hệ thức cho 2 nhân 2 cộng 4, bằng 8, công thức cho 4 nhân 2, cũng bằng 8. Với n bằng 256, hệ thức cho 2 nhân 8 cộng 8, bằng 24, công thức cho 8 nhân 3, khớp."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$n = 2^m$: căn → chia đôi số mũ</span><span class="a">→</span>
          <span class="n">$S(m) = T(2^m)$</span><span class="a">→</span>
          <span class="n">chia cho $2^m$: $U(m) = U(m/2) + 1$</span><span class="a">→</span>
          <span class="n">giải $U$, nhân lại, đổi ngược</span><span class="a">→</span>
          <span class="n">$\Theta(n \log \log n)$</span></div>
        say: "Tổng kết chuỗi logic. Đặt n bằng 2 mũ m để lấy căn thành chia đôi số mũ. Viết lại theo S, chia cho 2 mũ m để ra hệ thức chia đôi của U. Giải U, nhân lại, đổi biến ngược, và ta được Theta của n nhân lôgarit lôgarit n."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi hệ thức lạ, hãy tìm phép đổi biến biến nó về dạng <b>đã biết giải</b> — và nhớ đổi ngược ở cuối.</div>
        say: "Điều cần mang theo, khi gặp hệ thức lạ, hãy tìm một phép đổi biến đưa nó về dạng đã biết giải, và nhớ đổi biến ngược ở cuối."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>chia để trị và định lý thợ</b> — một công thức tra nhanh cho phần lớn hệ thức dạng $a\,T(n/b) + f(n)$ với $a$, $b$ là hằng số.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học chiến lược chia để trị và định lý thợ. Đó là cách tra nhanh nghiệm cho phần lớn hệ thức dạng a nhân T của n chia b, cộng f của n, khi a và b là hằng số. Hẹn gặp bạn ở bài tiếp theo."
