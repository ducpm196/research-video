# Quy ước: đổi biến n = 2^m (m = log₂ n); hàm mới S(m) = T(2^m), rồi U(m) = S(m)/2^m (không dùng chữ R để khỏi lẫn với phần dư
#   R(n) của bài 10, không dùng chữ P vì trùng ký hiệu xác suất); chỉ xét n = 2^(2^k) để mọi căn đều nguyên; T(2) = 2 trong ví dụ.
# Nối bài trước (luật 17): bài 10 — hệ thức T(n) = T(n/2) + 1 (một lời gọi nửa kích thước) giải ra lôgarit; thế ngược, phần dư.
#   bài 0 — lôgarit cơ số 2 = số lần chia đôi.
objectives:
  - "Đổi biến n = 2^m để biến căn bậc hai thành phép chia đôi số mũ"
  - "Chia hai vế cho 2^m để triệt hệ số 2^(m/2), đưa về U(m) = U(m/2) + 1"
  - "Đổi biến ngược để ra T(n) = n·(log₂ log₂ n + c) và kiểm bằng bảng số"
