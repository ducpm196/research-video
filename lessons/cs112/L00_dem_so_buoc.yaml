        focus: [1, 4, 3, 3]
        say: "Giờ ta để máy đếm thật hai vòng lặp của ví dụ chính, bằng mã trên màn hình. Mỗi lần chạy thân, máy tăng biến đếm thêm 1, rồi thêm một lần so sánh để thoát. Với n bằng một nghìn, máy đếm hai trăm năm mươi hai nghìn không trăm linh một lần. Gấp đôi n lên hai nghìn, máy đếm hơn một triệu lần."
      - clear: true
        show: |
          <table class="t"><tr><th>quy mô</th><th>$n$</th><th>số lần so sánh $\dfrac{n^2 + 8n + 4}{4}$</th><th>thời gian nếu 10⁹ phép mỗi giây (số minh hoạ)</th></tr>
          <tr><td>×1</td><td>1 000</td><td>252 001</td><td>0,00025 giây</td></tr>
          <tr><td>×2</td><td>2 000</td><td>1 004 001</td><td>0,001 giây</td></tr>
          <tr><td>×1 000</td><td>1 000 000</td><td>250 002 000 001</td><td>khoảng 250 giây, hơn 4 phút</td></tr></table>
