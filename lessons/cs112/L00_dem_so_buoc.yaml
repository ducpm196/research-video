objectives:
  - "Đếm đúng số lần so sánh điều kiện của một vòng lặp (n + 1 lần cho n lần chạy)"
  - "Tính số phần tử của đoạn từ L đến U, kể cả khi đoạn rỗng"
  - "Nêu ý nghĩa của làm tròn xuống, làm tròn lên, lôgarit cơ số 2, và tính chúng cho một số cụ thể"
  - "Dùng năm tổng Sigma hay gặp để đếm số bước của hai vòng lặp lồng nhau"
  - "Nêu vì sao hai vòng lặp lồng nhau có số lần so sánh gấp bốn khi n gấp đôi, và ước lượng thời gian chạy ở n bằng một triệu"
  - "Viết chương trình đếm số lần chạy thân và số lần so sánh của một cặp vòng lặp lồng nhau mới"
