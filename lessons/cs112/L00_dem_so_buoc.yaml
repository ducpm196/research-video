  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "2*1 - 4 + 1 == -1"
      - "7 - 3 == 4 and 7 - 3 + 1 == 5"
      - "abs(float(sum(Rational(1, j) for j in range(1, 1001))) - math.log(1000) - 0.577) < 0.001"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Số lần so sánh = số lần lặp <b class="red">(sai)</b>
          <br><span class="note">Thiếu lần so sánh cuối để thoát. Phép thử: với $n = 0$ vòng lặp không chạy mà vẫn so sánh 1 lần.</span></div>
        say: "Lỗi thứ nhất, cho rằng số lần so sánh bằng số lần lặp, quên lần so sánh cuối để thoát. Phép thử là n bằng 0: vòng lặp không chạy mà vẫn so sánh một lần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cộng $2y - n + 1$ cho <b>mọi</b> $y$ từ 1 <b class="red">(sai)</b>
          <br><span class="note">$n = 4$, $y = 1$ cho: $$2 \cdot 1 - 4 + 1 = -1 \text{ lần chạy}$$ số lần không thể âm → đoạn rỗng, phải bắt đầu từ $\lceil n/2 \rceil$.</span></div>
        say: "Lỗi thứ hai, cộng 2y trừ n cộng 1 cho mọi y từ 1: với n bằng 4 và y bằng 1 ra âm 1 lần chạy, vô lý. Đó là đoạn rỗng, tổng phải bắt đầu từ làm tròn lên của n chia 2."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Viết tổng điều hoà “bằng $\ln n$” <b class="red">(sai)</b>
          <br><span class="note">Lệch khoảng 0,577 (với $n = 1000$: 7,485 so với 6,908). Đúng là: xấp xỉ $\ln n + 0{,}577$, tăng chậm, cùng cỡ lôgarit.</span></div>
        say: "Lỗi thứ ba, viết tổng điều hoà bằng lôgarit tự nhiên của n. Nói đúng là nó xấp xỉ lôgarit tự nhiên của n cộng 0 phẩy 577, tăng chậm, cùng cỡ lôgarit."

