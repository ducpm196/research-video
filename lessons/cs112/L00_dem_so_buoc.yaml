  # ───────────────────────── 8. VÍ DỤ: VÒNG LỒNG NHAU ─────────────────────────
  - id: nested
    kind: example
    title: "Vòng lặp lồng nhau: j chạy từ n − y đến y"
    checks:
      - "[len(range(4 - y, y + 1)) for y in range(1, 4 + 1)] == [0, 1, 3, 5]"
      - "[len(range(4 - y, y + 1)) + 1 for y in range(1, 4 + 1)] == [1, 2, 4, 6] and 1 + 2 + 4 + 6 == 13"
      - "all((len(range(m - y, y + 1)) > 0) == (y >= sp.ceiling(Rational(m, 2))) for m in range(1, 40) for y in range(1, m + 1))"
      - "all(len(range(m - y, y + 1)) == 2*y - m + 1 for m in range(1, 40) for y in range(1, m + 1) if y >= m - y)"
      - "all(sum(2*t - 1 for t in range(1, k + 1)) == k**2 for k in range(1, 50)) and 1 + 3 + 5 == 9"
      - "(lambda n: sp.expand((n/2 + 1)**2 + n - (n**2 + 8*n + 4)/4))(sp.Symbol('n')) == 0"
      - "(4 // 2 + 1)**2 + 4 == 13 and (16 + 32 + 4) // 4 == 13"
      - "all(sum(len(range(m - y, y + 1)) + 1 for y in range(1, m + 1)) * 4 == m*m + 8*m + 4 for m in range(2, 60, 2))"
      - "all(sum(len(range(m - y, y + 1)) + 1 for y in range(1, m + 1)) * 4 == m*m + 8*m + 3 for m in range(1, 60, 2)) and (9 + 24 + 3) // 4 == 9"
    steps:
      - show: |
          <div class="code"><div><span class="kw">for</span> (y = 1; y &lt;= n; y++)</div><div>    <span class="kw">for</span> (j = n - y; j &lt;= y; j++)</div><div>        thân vòng trong</div></div>
          <p>Hỏi: điều kiện $\ j \le y\ $ của vòng trong được so sánh <b>tổng cộng</b> bao nhiêu lần?</p>
        focus: [0, "1.1", "1.2", 2]
        say: "Giờ đến ví dụ chính. Vòng ngoài cho y chạy từ 1 đến n. Vòng trong cho j chạy từ n trừ y đến y. Câu hỏi là điều kiện của vòng trong được so sánh tổng cộng bao nhiêu lần."
      - show: |
          <p>Với một giá trị $y$: đoạn từ $n - y$ đến $y$ có $\ y - (n - y) + 1 = \hlo{2y - n + 1}\ $ số,</p>
          <p>nhưng chỉ khi $\ n - y \le y$, tức $\ y \ge \dfrac{n}{2}$, tức $\ y \ge \left\lceil \dfrac{n}{2} \right\rceil$ (vì $y$ nguyên). Ngược lại: <b>đoạn rỗng, 0 lần chạy</b>.</p>
        focus: [1, 2, 2]
        say: "Với một giá trị y, theo phép đếm đầu bài, đoạn từ n trừ y đến y có 2y trừ n cộng 1 số. Nhưng điều đó chỉ đúng khi đầu đoạn không vượt cuối đoạn, tức y lớn hơn hoặc bằng làm tròn lên của n chia 2, vì y là số nguyên. Ngược lại, đoạn rỗng và thân không chạy lần nào."
      - clear: true
        show: |
          <p class="note">$j$ chạy từ $n - y$ đến $y$: chạy thân $2y - n + 1$ lần nếu $y \ge \lceil n/2 \rceil$, ngược lại 0 lần; luôn so sánh thêm 1 lần để thoát.</p>
          <table class="t"><tr><th>$y$ ($n = 4$)</th><th>đoạn của $j$</th><th>số lần chạy thân</th><th>số lần so sánh</th></tr>
          <tr><td>1</td><td>3 đến 1: rỗng</td><td>0</td><td>1</td></tr>
          <tr><td>2</td><td>2 đến 2</td><td>1</td><td>2</td></tr>
          <tr><td>3</td><td>1 đến 3</td><td>3</td><td>4</td></tr>
          <tr><td>4</td><td>0 đến 4</td><td>5</td><td>6</td></tr></table>
          <p>Tổng số lần so sánh: $\ 1 + 2 + 4 + 6 = \hlg{13}$</p>
        focus: [2, 1, "2.2", ["2.3", "2.4", "2.5"], 3]
        say: "Làm thử với n bằng 4. Ứng với mỗi y, số lần so sánh luôn bằng số lần chạy cộng 1. Với y bằng 1, đoạn từ 3 đến 1 rỗng, thân không chạy nhưng vẫn so sánh một lần. Với y bằng 2, 3, 4, thân chạy 1, 3, 5 lần, nên so sánh 2, 4, 6 lần. Cộng lại, tổng số lần so sánh là 13."
      - clear: true
        show: |
          $$\text{số lần so sánh} = \underbrace{\sum_{y=\lceil n/2 \rceil}^{n} (2y - n + 1)}_{\text{số lần chạy thân}} + \underbrace{\sum_{y=1}^{n} 1}_{\text{lần so sánh để thoát}}$$
        say: "Viết thành công thức, số lần so sánh gồm hai phần. Phần đầu là số lần chạy thân, chỉ cộng những y từ làm tròn lên của n chia 2 trở đi. Phần sau là mỗi giá trị y thêm một lần so sánh để thoát, kể cả khi đoạn rỗng, nên phần sau bằng n."
      - show: |
          <p>Với $n$ chẵn, $y = \frac{n}{2}, \dots, n$ cho $2y - n + 1 = 1, 3, 5, \dots, n + 1$: tổng các số lẻ đầu tiên, có $\frac{n}{2} + 1$ số.</p>
          <p>Tổng $k$ số lẻ đầu tiên $= k^2$ &nbsp; (ví dụ $1 + 3 + 5 = 9 = 3^2$), nên:</p>
          $$\Big(\frac{n}{2} + 1\Big)^2 + n = \hlg{\frac{n^2 + 8n + 4}{4}} \qquad (n = 4:\ 9 + 4 = 13\ ✓)$$
        focus: [1, 2, 3]
        say: "Khi n chẵn, các số hạng của phần đầu là 1, 3, 5, đến n cộng 1, tức là các số lẻ đầu tiên, có n chia 2 cộng 1 số. Theo công thức tổng từ 1 đến k, tổng k số lẻ đầu tiên bằng k bình phương, ví dụ 1 cộng 3 cộng 5 bằng 9. Nên kết quả là n mũ 2 cộng 8n cộng 4, chia 4, với n bằng 4 ra đúng 13."
      - show: |
          <p class="note">Với $n$ lẻ, làm tương tự ra $\ \dfrac{n^2 + 8n + 3}{4}$ (ví dụ $n = 3$: 9 lần). Công thức có “+ 4” <b>chỉ đúng khi $n$ chẵn</b>.</p>
        say: "Lưu ý, công thức vừa rồi chỉ đúng khi n chẵn. Với n lẻ, làm tương tự ta được n mũ 2 cộng 8n cộng 3, chia 4, ví dụ n bằng 3 cho 9 lần."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đếm tay với n nhỏ rồi so công thức"
    checks:
      - "[len(range(2 - y, y + 1)) + 1 for y in (1, 2)] == [2, 4] and 2 + 4 == 6 and (4 + 16 + 4) // 4 == 6"
      - "all(sum(len(range(m - y, y + 1)) + 1 for y in range(1, m + 1)) * 4 == m*m + 8*m + 4 for m in range(2, 60, 2))"
    steps:
      - show: |
          <p><b>Phép thử</b> $n = 2$, đếm tay từng hàng:</p>
          <table class="t"><tr><th>$y$</th><th>đoạn của $j$</th><th>số lần so sánh</th></tr><tr><td>1</td><td>1 đến 1</td><td>2</td></tr><tr><td>2</td><td>0 đến 2</td><td>4</td></tr></table>
          <p>Đếm tay: $2 + 4 = 6$. &nbsp; Công thức: $\ \dfrac{2^2 + 8 \cdot 2 + 4}{4} = \dfrac{24}{4} = 6$ ✓</p>
          <p class="note">Máy cũng đã chạy đúng hai vòng lặp này và đếm cho mọi $n$ chẵn từ 2 đến 58: khớp công thức.</p>
        focus: [0, 2, 3, 4]
        say: "Thói quen tốt là đếm tay với n nhỏ rồi so với công thức. Với n bằng 2, y bằng 1 cho 2 lần so sánh, y bằng 2 cho 4 lần, tổng là 6. Thay n bằng 2 vào công thức cũng được 24 chia 4, bằng 6. Máy cũng đã chạy đúng hai vòng lặp này với mọi n chẵn đến 58, đều khớp."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "2*1 - 4 + 1 == -1"
      - "7 - 3 == 4 and 7 - 3 + 1 == 5"
      - "abs(float(sum(Rational(1, j) for j in range(1, 1001))) - math.log(1000) - 0.577) < 0.001"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Số lần so sánh = số lần lặp <b class="red">(sai)</b>
          <br><span class="note">Thiếu lần so sánh cuối để thoát. Phép thử: với $n = 0$ vòng lặp không chạy mà vẫn so sánh 1 lần.</span></div>
        say: "Lỗi thứ nhất, cho rằng số lần so sánh bằng số lần lặp, quên lần so sánh cuối để thoát. Phép thử bắt được lỗi này là n bằng 0, vòng lặp không chạy lần nào mà vẫn so sánh một lần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cộng $2y - n + 1$ cho <b>mọi</b> $y$ từ 1 <b class="red">(sai)</b>
          <br><span class="note">$n = 4$, $y = 1$ cho: $$2 \cdot 1 - 4 + 1 = -1 \text{ lần chạy}$$ số lần không thể âm → đoạn rỗng, phải bắt đầu từ $\lceil n/2 \rceil$.</span></div>
        say: "Lỗi thứ hai, cộng 2y trừ n cộng 1 cho mọi y từ 1. Với n bằng 4 và y bằng 1, ta được âm 1 lần chạy, vô lý vì số lần không thể âm. Thấy số âm nghĩa là đoạn rỗng, tổng phải bắt đầu từ làm tròn lên của n chia 2."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đếm số phần tử từ $L$ đến $U$ là $U - L$ <b class="red">(sai)</b>
          <br><span class="note">Từ 3 đến 7: $7 - 3 = 4$ nhưng có 5 số. Phép thử: liệt kê tay một đoạn ngắn.</span></div>
        say: "Lỗi thứ ba, đếm số phần tử từ L đến U là U trừ L, quên cộng 1. Từ 3 đến 7 có 5 số chứ không phải 4. Phép thử là liệt kê tay một đoạn ngắn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Viết tổng điều hoà “bằng $\ln n$” <b class="red">(sai)</b>
          <br><span class="note">Lệch khoảng 0,577 (với $n = 1000$: 7,485 so với 6,908). Đúng là: xấp xỉ $\ln n + 0{,}577$, tăng nhanh như lôgarit.</span></div>
        say: "Lỗi thứ tư, viết tổng điều hoà bằng lôgarit tự nhiên của n. Hai thứ lệch nhau khoảng 0 phẩy 577. Nói đúng là tổng điều hoà xấp xỉ lôgarit tự nhiên của n cộng 0 phẩy 577, và tăng nhanh như lôgarit."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[len(range(1, i + 1)) + 1 for i in range(1, 4 + 1)] == [2, 3, 4, 5] and 2 + 3 + 4 + 5 == 14"
      - "[len(range(1, i + 1)) for i in range(1, 4 + 1)] == [1, 2, 3, 4]"
      - "(lambda n: sp.expand(n*(n + 1)/2 + n - n*(n + 3)/2))(sp.Symbol('n')) == 0 and 4 * 7 // 2 == 14"
      - "all(sum(len(range(1, i + 1)) + 1 for i in range(1, m + 1)) * 2 == m*(m + 3) for m in range(1, 60))"
    steps:
      - show: |
          <div class="code"><div><span class="kw">for</span> (i = 1; i &lt;= n; i++)</div><div>    <span class="kw">for</span> (j = 1; j &lt;= i; j++)</div><div>        thân vòng trong</div></div>
          <p>Điều kiện $\ j \le i\ $ được so sánh bao nhiêu lần? Tính với $n = 4$, rồi viết công thức theo $n$.</p>
        focus: [0, ["1.1", "1.2"], "2.1", ["2.2", "2.3"], 0]
        say: "Bây giờ đến lượt bạn. Vòng ngoài cho i chạy từ 1 đến n, vòng trong cho j chạy từ 1 đến i. Điều kiện của vòng trong được so sánh bao nhiêu lần? Hãy tính với n bằng 4, rồi viết công thức theo n. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b>, đếm từng hàng với $n = 4$: thân chạy $i$ lần, so sánh $i + 1$ lần.</p>
          <table class="t"><tr><th>$i$</th><th>đoạn của $j$</th><th>số lần chạy thân</th><th>số lần so sánh</th></tr>
          <tr><td>1</td><td>1 đến 1</td><td>1</td><td>2</td></tr>
          <tr><td>2</td><td>1 đến 2</td><td>2</td><td>3</td></tr>
          <tr><td>3</td><td>1 đến 3</td><td>3</td><td>4</td></tr>
          <tr><td>4</td><td>1 đến 4</td><td>4</td><td>5</td></tr></table>
          <p>Tổng: $\ 2 + 3 + 4 + 5 = \hlg{14}$</p>
        focus: [1, ["2.2", "2.3", "2.4", "2.5"], 3]
        say: "Bước một, đếm từng hàng với n bằng 4, theo phép đếm đầu bài, đoạn từ 1 đến i có đúng i số. Vậy với mỗi i, thân chạy i lần, còn điều kiện được so sánh i cộng 1 lần. Cộng cột cuối, ta được 2 cộng 3 cộng 4 cộng 5, bằng 14."
      - show: |
          <p><b>Bước 2</b>, viết thành tổng Sigma rồi dùng tổng ② và tổng ①:</p>
          $$\sum_{i=1}^{n} (i + 1) = \frac{n(n + 1)}{2} + n = \hlg{\frac{n(n + 3)}{2}} \qquad \Big(n = 4:\ \frac{4 \cdot 7}{2} = 14\ ✓\Big)$$
        focus: [1, 2]
        say: "Bước hai, viết thành tổng Sigma của i cộng 1, rồi tách ra tổng từ 1 đến n cộng với tổng của hằng số 1. Ta được n nhân n cộng 3, chia 2, và với n bằng 4 công thức cũng ra 14, khớp với cách đếm từng hàng."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đếm số bước, không đo giây</span><span class="a">→</span>
          <span class="n">đoạn từ $L$ đến $U$ có $U - L + 1$ số</span><span class="a">→</span>
          <span class="n">vòng lặp: so sánh $n + 1$ lần</span><span class="a">→</span>
          <span class="n">chia đôi: $\lfloor \log_2 n \rfloor$ lần</span><span class="a">→</span>
          <span class="n">vòng lồng nhau: tổng Sigma</span></div>
        say: "Tổng kết chuỗi logic. Ta đếm số bước chứ không đo giây. Đoạn từ L đến U có U trừ L cộng 1 số. Vòng lặp chạy n lần thì so sánh n cộng 1 lần. Chia đôi đến khi còn 1 mất làm tròn xuống của lôgarit cơ số 2 của n lần. Còn vòng lặp lồng nhau thì dẫn tới tổng Sigma."
      - show: |
          <div class="box key"><b>Tư duy:</b> đếm tay với $n$ nhỏ trước → viết công thức → thay số kiểm lại. Đoạn có thể <b>rỗng</b>: luôn kiểm đầu đoạn có vượt cuối đoạn không.</div>
        say: "Điều cần mang theo là đếm tay với n nhỏ trước, rồi mới viết công thức, rồi thay số để kiểm lại. Và luôn hỏi đầu đoạn có vượt cuối đoạn không, vì đoạn có thể rỗng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>ký hiệu tiệm cận</b> — cách nói chặt chẽ “số bước tăng như $n^2$”, bỏ qua hằng số và các số hạng nhỏ khi $n$ rất lớn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học ký hiệu tiệm cận, một cách nói chặt chẽ rằng số bước tăng như n bình phương, bỏ qua hằng số và các số hạng nhỏ khi n rất lớn. Hẹn gặp bạn ở bài tiếp theo."
