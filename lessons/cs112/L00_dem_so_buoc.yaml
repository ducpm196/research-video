  # ───────────────────────── 8. VÍ DỤ: VÒNG LỒNG NHAU ─────────────────────────
  - id: nested
    kind: example
    title: "Vòng lặp lồng nhau: j chạy từ n − y đến y"
    checks:
      - "[len(range(4 - y, y + 1)) for y in range(1, 4 + 1)] == [0, 1, 3, 5]"
      - "[len(range(4 - y, y + 1)) + 1 for y in range(1, 4 + 1)] == [1, 2, 4, 6] and 1 + 2 + 4 + 6 == 13"
      - "all((len(range(m - y, y + 1)) > 0) == (y >= sp.ceiling(Rational(m, 2))) for m in range(1, 40) for y in range(1, m + 1))"
      - "all(len(range(m - y, y + 1)) == 2*y - m + 1 for m in range(1, 40) for y in range(1, m + 1) if y >= m - y)"
      - "all(sum(2*t - 1 for t in range(1, k + 1)) == k**2 for k in range(1, 50)) and 1 + 3 + 5 == 9"
      - "all(2 * (k * (k + 1) // 2) - k == k * k for k in range(1, 200))"
      - "(lambda n: sp.expand((n/2 + 1)**2 + n - (n**2 + 8*n + 4)/4))(sp.Symbol('n')) == 0"
      - "(4 // 2 + 1)**2 + 4 == 13 and (16 + 32 + 4) // 4 == 13"
      - "2 * 3 - 4 + 1 == 3 == len(range(4 - 3, 3 + 1)) and 3 - (4 - 3) + 1 == 3 and sp.ceiling(Rational(5, 2)) == 3 and min(y for y in range(1, 6) if 5 - y <= y) == 3"
      - "all(sum(len(range(m - y, y + 1)) + 1 for y in range(1, m + 1)) * 4 == m*m + 8*m + 4 for m in range(2, 60, 2))"
      - "all(sum(len(range(m - y, y + 1)) + 1 for y in range(1, m + 1)) * 4 == m*m + 8*m + 3 for m in range(1, 60, 2)) and (9 + 24 + 3) // 4 == 9"
    steps:
      - show: |
          <div class="code"><div><span class="kw">for</span> (y = 1; y &lt;= n; y++)</div><div>    <span class="kw">for</span> (j = n - y; j &lt;= y; j++)</div><div>        thân vòng trong</div></div>
          <p>Hỏi: điều kiện $\ j \le y\ $ của vòng trong được so sánh <b>tổng cộng</b> bao nhiêu lần?</p>
        focus: [[1, 2]]
        say: "Giờ đến ví dụ chính, với đúng hai vòng lặp vừa vẽ: điều kiện của vòng trong được so sánh tổng cộng bao nhiêu lần?"
      - show: |
          <p>Với một giá trị $y$: đoạn từ $n - y$ đến $y$ có $\ y - (n - y) + 1 = \hlo{2y - n + 1}\ $ số (áp dụng $U - L + 1$ với $U = y$, $L = n - y$).</p>
          <p>Ví dụ $n = 4$, $y = 3$: đoạn từ 1 đến 3 có $2 \cdot 3 - 4 + 1 = 3$ số.</p>
        focus: [1, 2]
        say: "Với một giá trị y, theo phép đếm đầu bài, đoạn từ n trừ y đến y có 2y trừ n cộng 1 số. Ví dụ n bằng 4 và y bằng 3, đoạn từ 1 đến 3 có 3 số, đúng bằng 2 nhân 3 trừ 4 cộng 1."
      - show: |
          <p>Công thức đó chỉ dùng được khi đoạn <b>không rỗng</b>, tức $\ n - y \le y\ $. Chuyển vế: $\ n \le 2y$, tức $\ y \ge \dfrac{n}{2}$.</p>
          <p>$y$ là số nguyên nên $\ y \ge \left\lceil \dfrac{n}{2} \right\rceil$. Ví dụ $n = 5$: $\ y \ge 2{,}5$, vậy $y$ nhỏ nhất là $3 = \lceil 5/2 \rceil$. Ngược lại: <b>đoạn rỗng, 0 lần chạy</b>.</p>
        focus: [1, 2, 2]
        say: "Công thức đó chỉ dùng được khi đầu đoạn không vượt cuối đoạn, tức n trừ y nhỏ hơn hoặc bằng y, nghĩa là y từ n chia 2 trở lên. Vì y là số nguyên nên ta làm tròn lên: ví dụ n bằng 5, y nhỏ nhất là 3. Ngược lại, đoạn rỗng, thân không chạy."
      - clear: true
        show: |
          <p class="note">$j$ chạy từ $n - y$ đến $y$: chạy thân $2y - n + 1$ lần nếu $y \ge \lceil n/2 \rceil$, ngược lại 0 lần; luôn so sánh thêm 1 lần để thoát.</p>
          <table class="t"><tr><th>$y$ ($n = 4$)</th><th>đoạn của $j$</th><th>số lần chạy thân</th><th>số lần so sánh</th></tr>
          <tr><td>1</td><td>3 đến 1: rỗng</td><td>0</td><td>1</td></tr>
          <tr><td>2</td><td>2 đến 2</td><td>1</td><td>2</td></tr>
          <tr><td>3</td><td>1 đến 3</td><td>3</td><td>4</td></tr>
          <tr><td>4</td><td>0 đến 4</td><td>5</td><td>6</td></tr></table>
          <p>Tổng số lần so sánh: $\ 1 + 2 + 4 + 6 = \hlg{13}$</p>
        focus: [2, 1, "2.2", ["2.3", "2.4", "2.5"], 3]
        say: "Làm thử với n bằng 4. Số lần so sánh bằng số lần chạy cộng 1. Với y bằng 1, đoạn từ 3 đến 1 rỗng, thân không chạy nhưng vẫn so sánh một lần. Với y bằng 2, 3, 4, thân chạy 1, 3, 5 lần, nên so sánh 2, 4, 6 lần. Tổng cộng là 13."
      - clear: true
        show: |
          $$\text{số lần so sánh} = \underbrace{\sum_{y=\lceil n/2 \rceil}^{n} (2y - n + 1)}_{\text{số lần chạy thân}} + \underbrace{\sum_{y=1}^{n} 1}_{\text{lần so sánh để thoát}}$$
        say: "Viết thành công thức, số lần so sánh gồm hai phần. Phần đầu là số lần chạy thân, chỉ cộng những y từ làm tròn lên của n chia 2 trở đi. Phần sau bằng n, vì mỗi y thêm một lần so sánh để thoát."
      - show: |
          <p>Với $n$ chẵn, $y = \frac{n}{2}, \dots, n$ cho $2y - n + 1 = 1, 3, 5, \dots, n + 1$: tổng các số lẻ đầu tiên, có $\frac{n}{2} + 1$ số.</p>
          <p>Tổng $k$ số lẻ đầu tiên $= k^2$ &nbsp; (ví dụ $1 + 3 + 5 = 9 = 3^2$). Vì sao: số lẻ thứ $t$ là $2t - 1$, nên tổng <span style="white-space:nowrap">$= 2 \cdot \frac{k(k + 1)}{2} - k = k^2$</span> (dùng tổng ②). Do đó:</p>
          $$\Big(\frac{n}{2} + 1\Big)^2 + n = \hlg{\frac{n^2 + 8n + 4}{4}} \qquad (n = 4:\ 9 + 4 = 13\ ✓)$$
        focus: [1, 2, 3]
        say: "Khi n chẵn, các số hạng của phần đầu là 1, 3, 5, đến n cộng 1: các số lẻ đầu tiên, có n chia 2 cộng 1 số. Tổng k số lẻ đầu tiên bằng k bình phương, ví dụ 1 cộng 3 cộng 5 bằng 9, vì số lẻ thứ t là 2t trừ 1, nên tổng bằng 2 nhân tổng thứ hai trừ k. Nên kết quả là n bình phương cộng 8n cộng 4, chia 4, và n bằng 4 ra đúng 13."
      - show: |
          <p class="note">Với $n$ lẻ, làm tương tự ra $\ \dfrac{n^2 + 8n + 3}{4}$ (ví dụ $n = 3$: 9 lần). Công thức có “+ 4” <b>chỉ đúng khi $n$ chẵn</b>.</p>
        say: "Lưu ý, công thức vừa rồi chỉ đúng khi n chẵn. Với n lẻ, làm tương tự ta được n mũ 2 cộng 8n cộng 3, chia 4, ví dụ n bằng 3 cho 9 lần."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đếm tay với n nhỏ rồi so công thức"
    checks:
      - "[len(range(2 - y, y + 1)) + 1 for y in (1, 2)] == [2, 4] and 2 + 4 == 6 and (4 + 16 + 4) // 4 == 6"
      - "all(sum(len(range(m - y, y + 1)) + 1 for y in range(1, m + 1)) * 4 == m*m + 8*m + 4 for m in range(2, 60, 2))"
    steps:
      - show: |
          <p><b>Phép thử</b> $n = 2$, đếm tay từng hàng:</p>
          <table class="t"><tr><th>$y$</th><th>đoạn của $j$</th><th>số lần so sánh</th></tr><tr><td>1</td><td>1 đến 1</td><td>2</td></tr><tr><td>2</td><td>0 đến 2</td><td>4</td></tr></table>
          <p>Đếm tay: $2 + 4 = 6$. &nbsp; Công thức: $\ \dfrac{2^2 + 8 \cdot 2 + 4}{4} = \dfrac{24}{4} = 6$ ✓</p>
          <p class="note">Máy cũng đã chạy đúng hai vòng lặp này và đếm cho mọi $n$ chẵn từ 2 đến 58: khớp công thức.</p>
        focus: [0, [2, 3], 4]
        say: "Hãy đếm tay với n nhỏ rồi so với công thức. Với n bằng 2, y bằng 1 cho 2 lần so sánh, y bằng 2 cho 4 lần, tổng là 6, và công thức cũng cho 24 chia 4, bằng 6, nên khớp. Máy kiểm mọi n chẵn đến 58, đều khớp."

  # ───────────────────────── 9b. QUY MÔ ─────────────────────────
  - id: scale
    kind: concept
    title: "Khi n lớn dần: n gấp đôi thì số lần so sánh gấp bốn"
    checks:
      - "(1000 ** 2 + 8 * 1000 + 4) // 4 == 252001 and (2000 ** 2 + 8 * 2000 + 4) // 4 == 1004001 and sum(len(range(1000 - y, y + 1)) + 1 for y in range(1, 1001)) == 252001"
      - "1004001 / 252001 > 3.98 and ((10 ** 6) ** 2 + 8 * 10 ** 6 + 4) // 4 == 250002000001 and 990000 < 250002000001 // 252001 < 1000000"
      - "250002000001 / 10 ** 9 == 250.002000001 and 250 // 60 == 4"
    steps:
      - clear: true
