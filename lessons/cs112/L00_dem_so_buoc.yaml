          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def so_sanh(n):</code></td><td><code>def</code> khai báo một <b>hàm</b> nhận số <code>n</code>; các dòng thụt vào dưới nó là thân hàm</td><td><code>so_sanh(1000)</code> chạy thân hàm với n = 1000</td></tr><tr><td><code>for y in range(1, n + 1):</code></td><td>vòng lặp: <code>y</code> lần lượt nhận các số từ 1 tới n; <code>range</code> không lấy số cuối nên ghi <code>n + 1</code>. Vòng trong <code>range(n - y, y + 1)</code> đọc y hệt</td><td><code>range(1, 5)</code> cho 1, 2, 3, 4; n = 4, y = 3: <code>range(1, 4)</code> cho 1, 2, 3</td></tr><tr><td><code>dem += 1</code></td><td>tăng <code>dem</code> thêm 1, viết gọn của <code>dem = dem + 1</code></td><td>dem đang là 4 thì thành 5</td></tr></table>
        focus: ["1.1", "1.2", "1.3", "1.4"]
        say: "Mã máy đếm dùng năm ký hiệu của ngôn ngữ lập trình, ta đọc từng cái. Dòng mở đầu khai báo một hàm nhận số n, và các dòng thụt vào dưới nó là thân hàm. Dòng vòng lặp ngoài cho y lần lượt nhận các số từ 1 tới n, vì hàm tạo dãy số không lấy số cuối nên ghi n cộng 1, và vòng trong đọc y hệt. Dòng cộng bằng tăng biến đếm thêm 1, viết gọn của biến đếm bằng chính nó cộng 1."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>return dem</code></td><td><code>return</code> đưa giá trị <code>dem</code> ra cho nơi gọi hàm rồi kết thúc hàm</td><td><code>so_sanh(1000)</code> nhận lại số 252001</td></tr><tr><td><code>print(so_sanh(1000))</code></td><td>gọi hàm với n = 1000 rồi <code>print</code> in kết quả ra màn hình</td><td>in ra 252001</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Dòng trả về đưa giá trị biến đếm ra cho nơi gọi hàm rồi kết thúc hàm. Dòng cuối gọi hàm với n bằng một nghìn rồi in kết quả ra màn hình."
      - clear: true
        show: |
          <p><b>Để máy đếm thật</b> hai vòng lặp của ví dụ chính, viết bằng Python:</p>
          <div class="code"><div><span class="kw">def</span> so_sanh(n):</div><div>    dem = 0</div><div>    <span class="kw">for</span> y <span class="kw">in</span> range(1, n + 1):</div><div>        <span class="kw">for</span> j <span class="kw">in</span> range(n - y, y + 1):</div><div>            dem += 1</div><div>        dem += 1</div><div>    <span class="kw">return</span> dem</div><div></div><div>print(so_sanh(1000))</div><div>print(so_sanh(2000))</div></div>
