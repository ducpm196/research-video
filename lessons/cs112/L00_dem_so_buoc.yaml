"middle" fill="#065f46">chạy</text><rect x="528" y="152" width="84" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="570" y="193" font-size="26" text-anchor="middle" fill="#b91c1c">thoát</text><rect x="624" y="152" width="84" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><rect x="720" y="152" width="84" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="840" y="194" font-size="28" fill="#1f2937">1 lần chạy + 1 lần thoát = 2</text><text x="200" y="266" font-size="28" text-anchor="end" fill="#1f2937">y = 3</text><rect x="240" y="224" width="84" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><rect x="336" y="224" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="378" y="265" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="432" y="224" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="474" y="265" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="528" y="224" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="570" y="265" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="624" y="224" width="84" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="666" y="265" font-size="26" text-anchor="middle" fill="#b91c1c">thoát</text><rect x="720" y="224" width="84" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="840" y="266" font-size="28" fill="#1f2937">3 lần chạy + 1 lần thoát = 4</text><text x="200" y="338" font-size="28" text-anchor="end" fill="#1f2937">y = 4</text><rect x="240" y="296" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="282" y="337" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="336" y="296" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="378" y="337" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="432" y="296" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="474" y="337" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="528" y="296" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="570" y="337" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="624" y="296" width="84" height="60" rx="8" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="666" y="337" font-size="26" text-anchor="middle" fill="#065f46">chạy</text><rect x="720" y="296" width="84" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="762" y="337" font-size="26" text-anchor="middle" fill="#b91c1c">thoát</text><text x="840" y="338" font-size="28" fill="#1f2937">5 lần chạy + 1 lần thoát = 6</text><text x="240" y="400" font-size="26" fill="#6b7280">ô xanh: một lần chạy thân; ô đỏ đứt nét: lần so sánh cho kết quả sai để thoát</text></svg>
