# Quy ước ký hiệu: lôgarit cơ số 2 viết \log_2; lôgarit tự nhiên \ln; luôn viết ngoặc rõ: \log_2\big((n+100)^{10}\big) khác
#   \big(\log_2(n+100)\big)^{10}; bình phương của lôgarit viết (\ln n)^2 (không viết \ln^2 n); nhân hai số: ·
# Sửa bản thảo (AUDIT_CS112 §2): C11b không gọi “chuỗi 15 bậc” (16 hàm); C13 hai cách đọc lg(n+100)^10 cho hai thứ tự ngược nhau.
# Phát hiện thêm khi kiểm (OBSERVED, 2026-10-27): 50·log₂(n+100) < (ln n)² chỉ khi n > 2^104 — thứ tự tiệm cận là “khi n đủ lớn”.
# Nối bài trước (luật 17): bài 1 — giới hạn của f/g bằng 0 thì f thuộc o nhỏ của g (chậm hẳn), dương hữu hạn thì Theta, vô cùng thì omega nhỏ.
objectives:
  - "Xếp đúng thứ tự tăng của các hàm hay gặp, từ lôgarit, lũy thừa, mũ đến giai thừa"
  - "Đưa lũy thừa về cùng dạng để thấy 2^(2n) = 4ⁿ tăng nhanh hẳn 2ⁿ, còn 2^(n+1) cùng bậc 2ⁿ"
  - "Sắp xếp một danh sách hàm bằng ba bước: bỏ hằng số và số hạng thấp, đổi về dạng chuẩn, xếp theo chuỗi"
  - "Giải thích vì sao thứ tự tiệm cận có thể ngược với bảng số ở n nhỏ"
asr_reviewed:
  - {sentence: "Chuỗi xếp hạng này gồm bốn nhóm hàm.", reason: "chuỗi/chủi, hàm/ham: nhầm thanh; cùng từ “chuỗi” ở khung 61 cả hai mô hình nghe đúng"}
  - {sentence: "Có lôgarit, có căn, có đa thức, có lũy thừa.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
  - {sentence: "Sau đó tra chuỗi, lôgarit chậm hơn căn, căn chậm hơn đa thức, đa thức chậm hơn hàm mũ, và hàm mũ chậm hơn giai thừa.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bảy hàm số — hàm nào tăng nhanh nhất?"
    steps:
      - show: |
          <p>Sắp xếp theo tốc độ tăng (chậm → nhanh):</p>
          <p>$5\log_2\!\big((n+100)^{10}\big),\quad (\ln n)^2,\quad n^{1/3},\quad 0{,}001n^4 + 3n^3 + 1,\quad 3^n,\quad 2^{2n},\quad (n-2)!$</p>
        introduces: [factorial]
        focus: [1, 2, 2]
        say: "Chào bạn, hôm nay ta làm một dạng bài rất hay gặp, sắp xếp bảy hàm số này theo tốc độ tăng, từ chậm đến nhanh. Có lôgarit, có căn, có đa thức, có lũy thừa. Hàm cuối có dấu chấm than, đọc là giai thừa, lát nữa ta sẽ giải mã nó."
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>bài trả lời bằng</th></tr>
          <tr><td>Hàm nào tăng nhanh hơn hàm nào?</td><td>một <b>chuỗi chuẩn</b> để tra</td></tr>
          <tr><td>$2^{2n}$ và $3^n$, cái nào lớn hơn?</td><td><b>bẫy đổi cơ số</b></td></tr>
          <tr><td>Vì sao bảng số ở $n$ nhỏ có thể <b>đánh lừa</b>?</td><td>thứ tự “khi $n$ đủ lớn”</td></tr></table>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Bài trả lời ba câu hỏi. Một, hàm nào tăng nhanh hơn hàm nào, ta sẽ có một chuỗi chuẩn để tra. Hai, 2 mũ 2n và 3 mũ n, cái nào lớn hơn, đây là một cái bẫy đổi cơ số. Ba, vì sao bảng số với n nhỏ có thể đánh lừa ta."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: so sánh bằng giới hạn và ba quy tắc lũy thừa, lôgarit"
    checks:
      - "2**(2*3) == (2**2)**3 == 4**3 == 64"
      - "abs(math.log2(1100**10) - 10*math.log2(1100)) < 1e-9"
      - "abs(8**(1/3) - 2) < 1e-12 and round(1000**(1/3), 6) == 10"
    steps:
      - show: |
          <p>Bài 1: $\displaystyle \lim_{n \to \infty} \frac{f(n)}{g(n)} = 0 \implies f \in o(g)$: $f$ tăng <b>chậm hẳn</b> $g$. &nbsp; Giới hạn dương hữu hạn: cùng bậc $\Theta$; vô cùng: $f \in \omega(g)$.</p>
        say: "Ôn lại bài 1, nếu tỉ số f chia g tiến về 0 khi n tiến tới vô cùng, thì f thuộc o nhỏ của g, tức f tăng chậm hẳn g. Nếu giới hạn là số dương hữu hạn thì cùng bậc, còn nếu là vô cùng thì f tăng nhanh hẳn."
      - show: |
          <table class="t"><tr><th>quy tắc</th><th>ví dụ số</th></tr>
          <tr><td>① $(a^b)^c = a^{b \cdot c}$</td><td>$(2^2)^3 = 2^6 = 64$</td></tr>
          <tr><td>② $\log_2(x^k) = k \cdot \log_2 x$</td><td>$\log_2(1100^{10}) = 10 \cdot \log_2 1100$</td></tr>
          <tr><td>③ $n^{1/3}$ là <b>căn bậc ba</b>: số mà nhân với chính nó 3 lần ra $n$</td><td>$8^{1/3} = 2$, &nbsp; $1000^{1/3} = 10$</td></tr></table>
        focus: [0, ["1.2", "1.3"], "1.4"]
        say: "Thêm ba quy tắc. Lũy thừa của lũy thừa thì nhân hai số mũ, và lôgarit của x mũ k bằng k nhân lôgarit của x. Còn n mũ một phần ba là căn bậc ba, số mà nhân với chính nó ba lần thì ra n, ví dụ căn bậc ba của 8 là 2."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym_fact
    kind: symbol
    title: "Giải mã ký hiệu: giai thừa"
    checks:
      - "math.factorial(5) == 1*2*3*4*5 == 120 and math.factorial(10) == 3628800"
      - "math.factorial(4 - 2) == 2"
    steps:
      - show: |
          <p>$n!$ (đọc <b>n giai thừa</b>) $= 1 \cdot 2 \cdot 3 \cdots n$. &nbsp; $5! = 120$, &nbsp; $10! = 3\,628\,800$.</p>
          <p>$(n-2)!$ là giai thừa của $n - 2$: với $n = 4$ được $2! = 2$.</p>
        focus: [1, 1, 2]
        say: "Dấu chấm than sau một số đọc là giai thừa, nghĩa là nhân tất cả các số từ 1 đến n. 5 giai thừa bằng 120, còn 10 giai thừa đã hơn 3 triệu. Còn n trừ 2, giai thừa, là giai thừa của số n trừ 2, ví dụ n bằng 4 cho 2 giai thừa, bằng 2."

  # ───────────────────────── 4. CHUỖI CHUẨN ─────────────────────────
  - id: chain
    kind: concept
    title: "Chuỗi tăng trưởng chuẩn để tra"
    checks:
      - "all(sp.limit(a / b, n, sp.oo) == 0 for n in [sp.Symbol('n', positive=True)] for a, b in zip([sp.Integer(1), sp.log(sp.log(n)), sp.log(n), sp.log(n)**2, n**Rational(1, 3), sp.sqrt(n), n, n*sp.log(n), n**2, n**3, 2**n, 3**n], [sp.log(sp.log(n)), sp.log(n), sp.log(n)**2, n**Rational(1, 3), sp.sqrt(n), n, n*sp.log(n), n**2, n**3, 2**n, 3**n, 4**n]))"
      - "all(math.lgamma(m + 1) - m * math.log(4) < math.lgamma(m + 2) - (m + 1) * math.log(4) for m in range(10, 500))"
      - "all(math.lgamma(m + 1) < m * math.log(m) for m in range(2, 500))"
    steps:
      - show: |
          <p style="font-size:.9em">$1 \prec \log_2\log_2 n \prec \log_2 n \prec (\log_2 n)^2 \prec n^{1/3} \prec \sqrt{n} \prec n \prec n\log_2 n \prec n^2 \prec n^3 \prec 2^n \prec 3^n \prec 4^n \prec n! \prec n^n$</p>
          <p class="note">$f \prec g$: đọc “$f$ tăng chậm hẳn $g$”, nghĩa là $f \in o(g)$ — tỉ số $f/g \to 0$. Mỗi cặp kề nhau đã được kiểm bằng giới hạn.</p>
        introduces: [prec]
        focus: [1, 2]
        say: "Đây là chuỗi chuẩn để tra, từ hằng số, lôgarit của lôgarit, lôgarit, bình phương lôgarit, các căn, n, n nhân lôgarit, các đa thức, các hàm mũ, rồi giai thừa và n mũ n. Dấu nhỏ hơn cong đọc là tăng chậm hẳn, nghĩa là tỉ số của hai hàm tiến về 0, và mỗi cặp kề nhau đã được kiểm bằng giới hạn."
      - show: |
          <table class="t"><tr><th>so sánh</th><th>kết quả</th></tr>
          <tr><td>lôgarit mũ bất kỳ so với $n^\varepsilon$ ($\varepsilon > 0$)</td><td>$(\log_2 n)^2 \prec n^{1/3}$ vì tỉ số $\to 0$</td></tr>
          <tr><td>đa thức so với hàm mũ</td><td>$n^4 \prec 2^n$ vì $n^4 / 2^n \to 0$</td></tr>
          <tr><td>hai hàm mũ, cơ số $a < b$</td><td>$a^n \prec b^n$ vì $(a/b)^n \to 0$</td></tr>
          <tr><td>hàm mũ, giai thừa và $n^n$</td><td>$4^n \prec n! \prec n^n$ vì $4^n / n! \to 0$, $\ n!/n^n \le 1/n$</td></tr></table>
        introduces: [epsilon]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Chuỗi xếp hạng này gồm bốn nhóm hàm. Mọi lũy thừa của lôgarit đều chậm hẳn mọi lũy thừa dương của n, dù số mũ đó nhỏ như ép-xi-lôn. Mọi đa thức đều chậm hẳn hàm mũ. Giữa hai hàm mũ, cơ số nhỏ hơn thì chậm hẳn, vì a chia b nhỏ hơn 1 nên lũy thừa của nó về 0. Cuối cùng, hàm mũ chậm hẳn giai thừa, và giai thừa chậm hẳn n mũ n."

  - id: double
    kind: intuition
    title: "Hình dung: nhân đôi n thì mỗi hàm phản ứng ra sao?"
    checks:
      - "round(math.log2(10), 2) == 3.32 and round(math.log2(20), 2) == 4.32 and abs(math.log2(20) - math.log2(10) - 1) < 1e-12"
      - "20 == 2 * 10 and 20**2 == 400 == 4 * 10**2"
      - "2**10 == 1024 and 2**20 == 1048576 == 1024 * 1024"
    steps:
      - show: |
          <svg width="1500" height="460" viewBox="0 0 1500 460"><defs><marker id="arG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="28" fill="#6b7280" text-anchor="middle"><text x="140" y="50">hàm</text><text x="470" y="50">n = 10</text><text x="870" y="50">n = 20</text><text x="1240" y="50">nhân đôi n thì</text></g><text x="140" y="120" font-size="32" font-weight="bold" text-anchor="middle" fill="#059669">log₂ n</text><rect x="350" y="80" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#059669" stroke-width="3"/><text x="470" y="119" font-size="28" text-anchor="middle" fill="#1f2937">3,32</text><line x1="600" y1="108" x2="736" y2="108" stroke="#1f2937" stroke-width="3" marker-end="url(#arG2)"/><rect x="750" y="80" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#059669" stroke-width="3"/><text x="870" y="119" font-size="28" text-anchor="middle" fill="#1f2937">4,32</text><text x="1240" y="119" font-size="28" text-anchor="middle" fill="#059669">cộng thêm 1</text><text x="140" y="202" font-size="32" font-weight="bold" text-anchor="middle" fill="#2563eb">n</text><rect x="350" y="162" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#2563eb" stroke-width="3"/><text x="470" y="201" font-size="28" text-anchor="middle" fill="#1f2937">10</text><line x1="600" y1="190" x2="736" y2="190" stroke="#1f2937" stroke-width="3" marker-end="url(#arG2)"/><rect x="750" y="162" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#2563eb" stroke-width="3"/><text x="870" y="201" font-size="28" text-anchor="middle" fill="#1f2937">20</text><text x="1240" y="201" font-size="28" text-anchor="middle" fill="#2563eb">gấp 2</text><text x="140" y="284" font-size="32" font-weight="bold" text-anchor="middle" fill="#d97706">n²</text><rect x="350" y="244" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#d97706" stroke-width="3"/><text x="470" y="283" font-size="28" text-anchor="middle" fill="#1f2937">100</text><line x1="600" y1="272" x2="736" y2="272" stroke="#1f2937" stroke-width="3" marker-end="url(#arG2)"/><rect x="750" y="244" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#d97706" stroke-width="3"/><text x="870" y="283" font-size="28" text-anchor="middle" fill="#1f2937">400</text><text x="1240" y="283" font-size="28" text-anchor="middle" fill="#d97706">gấp 4</text><text x="140" y="366" font-size="32" font-weight="bold" text-anchor="middle" fill="#b91c1c">2ⁿ</text><rect x="350" y="326" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3"/><text x="470" y="365" font-size="28" text-anchor="middle" fill="#1f2937">1 024</text><line x1="600" y1="354" x2="736" y2="354" stroke="#1f2937" stroke-width="3" marker-end="url(#arG2)"/><rect x="750" y="326" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3"/><text x="870" y="365" font-size="28" text-anchor="middle" fill="#1f2937">1 048 576</text><text x="1240" y="365" font-size="28" text-anchor="middle" fill="#b91c1c">tự nhân với chính nó</text><text x="750" y="440" font-size="26" text-anchor="middle" fill="#6b7280">cùng một lần nhân đôi n, bốn hàm phản ứng rất khác nhau</text></svg>
        focus: [0, 0, 0, 0, 0]
        say: "Hình này cho thấy vì sao các nhóm hàm tách xa nhau, ta chỉ làm một việc là nhân đôi n, từ 10 lên 20. Lôgarit cơ số 2 chỉ cộng thêm đúng 1, từ khoảng 3 phẩy 32 lên 4 phẩy 32. Hàm n gấp đôi, còn n bình phương gấp 4 lần, từ 100 lên 400. Riêng 2 mũ n thì tự nhân với chính nó, từ 1024 nhảy lên hơn một triệu. Vậy mỗi bậc trong chuỗi là một kiểu phản ứng khác hẳn khi dữ liệu lớn gấp đôi."

  # ───────────────────────── 5. BẪY ĐỔI CƠ SỐ ─────────────────────────
  - id: base_trap
    kind: formula
    title: "Bẫy đổi cơ số: 2 mũ 2n không cùng bậc 2 mũ n"
    checks:
      - "(lambda n: sp.simplify(2**(2*n) - 4**n) == 0 and sp.limit(4**n / 2**n, n, sp.oo) == sp.oo)(sp.Symbol('n', positive=True))"
      - "(lambda n: sp.simplify(2**(n + 1) / 2**n) == 2)(sp.Symbol('n', positive=True))"
      - "sp.simplify(sp.log(sp.Symbol('n', positive=True), 4) / sp.log(sp.Symbol('n', positive=True), 2)) == Rational(1, 2)"
      - "[2**(2*m) // 2**m for m in (1, 5, 10)] == [2, 32, 1024]"
    steps:
      - show: |
          <p>Theo quy tắc ①: $\ 2^{2n} = (2^2)^n = \hl{4^n}$.</p>
          $$\frac{2^{2n}}{2^n} = \frac{4^n}{2^n} = 2^n \to \infty \implies 2^{2n} \in \omega(2^n)$$
          <p class="note">Thử: $n = 10$ thì $2^{2n}$ gấp $2^n$ đúng $1024$ lần, và khoảng cách còn tăng mãi.</p>
        focus: [1, 2, 3]
        say: "Theo quy tắc lũy thừa của lũy thừa, 2 mũ 2n chính là 4 mũ n. Chia cho 2 mũ n, tỉ số bằng 2 mũ n, tiến tới vô cùng, nên 2 mũ 2n tăng nhanh hẳn 2 mũ n, không cùng bậc. Thử với n bằng 10, nó đã gấp 1024 lần, và khoảng cách còn tăng mãi."
      - show: |
          <p>Khác hẳn: $\ \dfrac{2^{n+1}}{2^n} = 2$ (hằng số) nên $\ 2^{n+1} \in \Theta(2^n)$.</p>
          <p>Và: $\ \dfrac{\log_4 n}{\log_2 n} = \dfrac{1}{2}$ (hằng số, vì $4 = 2^2$) nên mọi lôgarit cùng bậc — <b>cơ số của lôgarit không quan trọng</b>, cơ số của <b>lũy thừa</b> thì có.</p>
        focus: [1, 2]
        say: "Khác hẳn trường hợp 2 mũ n cộng 1, vì chia cho 2 mũ n chỉ còn hằng số 2, nên hai hàm cùng bậc. Tương tự, theo quy tắc đổi cơ số, hai lôgarit khác cơ số chỉ chênh một hằng số, nên cơ số của lôgarit không quan trọng, còn cơ số của lũy thừa thì rất quan trọng."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: sort7
    kind: example
    title: "Sắp xếp bảy hàm bằng ba bước"
    checks:
      - "abs(5*math.log2(1100**10) - 50*math.log2(1100)) < 1e-6"
      - "(lambda n: sp.limit(sp.log(n + 100) / sp.log(n), n, sp.oo) == 1)(sp.Symbol('n', positive=True))"
      - "(lambda n: sp.limit((n**4 / 1000 + 3*n**3 + 1) / n**4, n, sp.oo) == Rational(1, 1000))(sp.Symbol('n', positive=True))"
      - "all(sp.limit(a / b, n, sp.oo) == 0 for n in [sp.Symbol('n', positive=True)] for a, b in zip([50*sp.log(n + 100, 2), sp.log(n)**2, n**Rational(1, 3), n**4/1000 + 3*n**3 + 1, 3**n], [sp.log(n)**2, n**Rational(1, 3), n**4/1000 + 3*n**3 + 1, 3**n, 4**n]))"
      - "all(math.lgamma(m - 1) - m * math.log(4) < math.lgamma(m) - (m + 1) * math.log(4) for m in range(20, 2000)) and math.lgamma(200 - 1) - 200 * math.log(4) > 100"
    steps:
      - show: |
          <p><b>Bước 1</b>: bỏ hằng số nhân, giữ số hạng bậc cao, đổi về dạng chuẩn:</p>
          <table class="t"><tr><th>hàm</th><th>dạng chuẩn</th></tr>
          <tr><td>$5\log_2\!\big((n+100)^{10}\big) = 50\log_2(n+100)$</td><td>$\Theta(\log_2 n)$</td></tr>
          <tr><td>$(\ln n)^2$</td><td>$\Theta\big((\log_2 n)^2\big)$</td></tr>
          <tr><td>$0{,}001n^4 + 3n^3 + 1$</td><td>$\Theta(n^4)$</td></tr>
          <tr><td>$2^{2n}$</td><td>$4^n$</td></tr></table>
          <p class="note">$n^{1/3}$, $3^n$, $(n-2)!$ đã ở dạng chuẩn.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước một, bỏ hằng số nhân, giữ số hạng bậc cao và đổi về dạng chuẩn. Theo quy tắc lôgarit, hàm đầu bằng 50 nhân lôgarit của n cộng 100, và vì tỉ số của nó với lôgarit của n tiến về 1, nó cùng bậc lôgarit của n. Bình phương lôgarit tự nhiên cùng bậc bình phương lôgarit cơ số 2, vì hai lôgarit chỉ chênh hằng số. Đa thức giữ n mũ 4. Còn 2 mũ 2n đổi thành 4 mũ n."
      - clear: true
        show: |
          <p><b>Bước 2</b>: tra từng dạng chuẩn vào chuỗi, xem nó thuộc nhóm nào:</p>
          <table class="t"><tr><th>dạng chuẩn</th><th>nhóm trong chuỗi</th></tr>
          <tr><td>$\log_2 n$, &nbsp; $(\log_2 n)^2$</td><td>lôgarit (mũ 1 chậm hơn mũ 2)</td></tr>
          <tr><td>$n^{1/3}$</td><td>căn</td></tr>
          <tr><td>$n^4$</td><td>đa thức</td></tr>
          <tr><td>$3^n$, &nbsp; $4^n$</td><td>hàm mũ (cơ số 3 chậm hơn 4)</td></tr>
          <tr><td>$(n-2)!$</td><td>giai thừa</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"], "2.5", "2.6"]
        say: "Bước hai, tra từng dạng chuẩn vào chuỗi, xem nó thuộc nhóm nào. Hai hàm đầu thuộc nhóm lôgarit, trong đó lôgarit mũ 1 chậm hơn lôgarit bình phương. Căn bậc ba đứng ở nhóm căn, rồi n mũ 4 ở nhóm đa thức. Hai hàm mũ 3 mũ n và 4 mũ n, cơ số nhỏ hơn thì chậm hơn. Cuối cùng là giai thừa."
      - clear: true
        show: |
          <p><b>Bước 3</b>: viết kết quả theo các hàm <b>ban đầu</b>:</p>
          <div class="box ok">$5\log_2\!\big((n+100)^{10}\big) \prec (\ln n)^2 \prec n^{1/3} \prec 0{,}001n^4 + 3n^3 + 1 \prec 3^n \prec 2^{2n} \prec (n-2)!$</div>
          <p class="note">$(n-2)!$ so với $4^n$: giai thừa chỉ bị trừ 2 vẫn thắng hàm mũ (tỉ số $(n-2)!/4^n \to \infty$; từ $n = 14$ đã lớn hơn).</p>
        focus: [1, 2, 3]
        say: "Bước ba, viết kết quả theo các hàm ban đầu, không theo dạng chuẩn. Lôgarit, rồi bình phương lôgarit, rồi căn bậc ba, rồi đa thức bậc bốn, rồi 3 mũ n, rồi 2 mũ 2n vì nó bằng 4 mũ n, và cuối cùng là giai thừa. Riêng n trừ 2 giai thừa, chỉ bị trừ 2 vẫn thắng mọi hàm mũ, và từ n bằng 14 nó đã lớn hơn 4 mũ n."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tính tỉ số ở n lớn"
    checks:
      - "round(4**20 / 3**20, 1) == 315.3 and round(3**20 / 20**4, 1) == 21792.4"
      - "round(4**10 / 3**10, 1) == 17.8 and round(4**30 / 3**30, 1) == 5599.7 and round(3**10 / 10**4, 1) == 5.9 and round(3**30 / 30**4 / 1e6) == 254"
      - "math.factorial(11) == 39916800 < 4**13 == 67108864 and math.factorial(12) == 479001600 > 4**14 == 268435456"
      - "[m for m in range(3, 100) if math.factorial(m - 2) > 4**m][0] == 14 and all(math.factorial(m - 2) > 4**m for m in range(14, 300))"
    steps:
      - show: |
          <p><b>Phép thử</b>: hàm đứng sau chia hàm đứng trước phải <b>tăng dần</b> khi $n$ tăng.</p>
          <table class="t"><tr><th>$n$</th><th>$4^n / 3^n$</th><th>$3^n / n^4$</th></tr>
          <tr><td>10</td><td>17,8</td><td>5,9</td></tr>
          <tr><td>20</td><td>315,3</td><td>21 792,4</td></tr>
          <tr><td>30</td><td>5 599,7</td><td>≈ 254 triệu</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"], 0]
        say: "Kiểm bằng đường khác, không tra chuỗi mà tính thẳng tỉ số, hàm đứng sau chia hàm đứng trước. Với n bằng 10, 4 mũ n chia 3 mũ n khoảng 17 phẩy 8, còn 3 mũ n chia n mũ 4 chỉ khoảng 5 phẩy 9. Lên n bằng 20 rồi 30, hai tỉ số tăng vọt tới hơn 5 nghìn và khoảng 254 triệu. Vì tỉ số tăng mãi, nên hàm sau tăng nhanh hẳn hàm trước, khớp với chuỗi."
      - show: |
          <p>Thử cặp khó nhất, $(n-2)!$ và $4^n$, ngay quanh chỗ đổi chiều:</p>
          <table class="t"><tr><th>$n$</th><th>$(n-2)!$</th><th>$4^n$</th><th>lớn hơn</th></tr>
          <tr><td>13</td><td>39 916 800</td><td>67 108 864</td><td>$4^n$</td></tr>
          <tr><td>14</td><td>479 001 600</td><td>268 435 456</td><td>$(n-2)!$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Thử thêm cặp khó nhất, n trừ 2 giai thừa và 4 mũ n, ngay quanh chỗ đổi chiều. Với n bằng 13, 11 giai thừa khoảng 40 triệu, vẫn thua 4 mũ 13 khoảng 67 triệu. Với n bằng 14, 12 giai thừa khoảng 479 triệu đã vượt 4 mũ 14 khoảng 268 triệu, và máy kiểm thấy từ đó giai thừa luôn dẫn trước, nên ngưỡng đổi chiều đúng là n bằng 14."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda n: sp.limit(sp.log(n + 100, 2)**10 / sp.log(n)**2, n, sp.oo) == sp.oo)(sp.Symbol('n', positive=True))"
      - "round(math.log2(1100)**10 / 1e9, 1) == 11.1 and round(10 * math.log2(1100), 1) == 101.0"
      - "2**10 == 1024 and 10**2 == 100 and round(1024**(1/3), 2) == 10.08 and 30**2 == 900 and 2**(30/3) == 1024"
      - "[k for k in range(1, 400) if (k*math.log(2))**2 > 50*math.log2(2**k + 100)][0] == 105"
      - "4**5 == 1024 > math.factorial(5) == 120 and 4**9 == 262144 < math.factorial(9) == 362880"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi $2^{2n}$ cùng bậc với $2^n$ <b class="red">(sai)</b>
          <br><span class="note">$2^{2n} = 4^n$, tỉ số với $2^n$ là $2^n \to \infty$. Phép thử: đổi về một cơ số rồi chia.</span></div>
        say: "Lỗi thứ nhất, coi 2 mũ 2n cùng bậc với 2 mũ n chỉ vì cùng cơ số 2. Thật ra nó bằng 4 mũ n, tỉ số tiến tới vô cùng. Phép thử là đổi về dạng chuẩn rồi chia."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc nhầm hai cách viết của lôgarit mũ 10 <b class="red">(sai)</b>
          <br><span class="note">$\log_2\!\big((n+100)^{10}\big) = 10\log_2(n+100)$: cùng bậc $\log_2 n$. &nbsp; Nhưng $\big(\log_2(n+100)\big)^{10}$ là lôgarit <b>mũ 10</b>, tăng nhanh hơn hẳn $(\ln n)^2$ → thứ tự <b>đảo ngược</b>. Đề ghi thiếu ngoặc thì phải nói rõ mình hiểu theo cách nào.</span></div>
        say: "Lỗi thứ hai, đọc nhầm hai cách viết. Lôgarit của n cộng 100 mũ 10 bằng 10 lần lôgarit, cùng bậc lôgarit của n. Nhưng lôgarit rồi mới mũ 10 là lôgarit lũy thừa 10, tăng nhanh hơn hẳn bình phương lôgarit, nên thứ tự đảo ngược. Nếu đề ghi thiếu ngoặc, hãy ghi rõ mình hiểu theo cách nào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Kết luận thứ tự từ bảng số với $n$ nhỏ <b class="red">(sai)</b>
          <br><span class="note">Còn $50\log_2(n + 100)$ chỉ thua $(\ln n)^2$ khi $n > 2^{104}$.</span></div>
          <table class="t"><tr><th>$n$</th><th>$(\log_2 n)^2$</th><th>$n^{1/3}$</th><th>lớn hơn</th></tr>
          <tr><td>$2^{10} = 1024$</td><td>100</td><td>$\approx 10{,}08$</td><td>lôgarit bình phương</td></tr>
          <tr><td>$2^{30}$</td><td>900</td><td>1024</td><td>căn bậc ba (đúng chuỗi)</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ ba, kết luận từ bảng số với n nhỏ. Với n bằng 1024, bình phương lôgarit bằng 100, trong khi căn bậc ba chỉ khoảng 10, lôgarit đang lớn hơn. Phải tới n bằng 2 mũ 30 thứ tự mới đảo lại đúng như chuỗi. Thứ tự tiệm cận là thứ tự khi n đủ lớn, có khi lớn hơn mọi dữ liệu thực tế."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ hàm mũ luôn thắng giai thừa vì “mũ” nghe nhanh hơn <b class="red">(sai)</b>
          <br><span class="note">$4^5 = 1024 > 5! = 120$, nhưng $4^9 = 262\,144 < 9! = 362\,880$ và từ đó giai thừa bỏ xa. Phép thử: giới hạn của tỉ số, không phải vài giá trị đầu.</span></div>
        say: "Lỗi thứ tư, nghĩ hàm mũ luôn thắng giai thừa. Với n bằng 5, 4 mũ 5 lớn hơn 5 giai thừa. Nhưng tới n bằng 9, giai thừa đã vượt lên và từ đó bỏ xa. Phép thử đúng là giới hạn của tỉ số, không phải vài giá trị đầu."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all(sp.limit(a / b, n, sp.oo) == 0 for n in [sp.Symbol('n', positive=True)] for a, b in zip([5*sp.log(n, 2), n**10, 3**(n/2)], [n**10, 3**(n/2), 2**(n + 1)]))"
      - "all(math.lgamma(m + 1) - (m + 1) * math.log(2) < math.lgamma(m + 2) - (m + 2) * math.log(2) for m in range(5, 500)) and math.factorial(30) > 2**31 * 10**20"
      - "abs(math.sqrt(3) - 1.732) < 0.001 and math.sqrt(3) < 2"
      - "[m for m in range(2, 400) if 3**(m/2) > m**10][0] == 80"
    steps:
      - show: |
          <p>Sắp xếp theo tốc độ tăng:</p>
          $$2^{n+1},\quad n^{10},\quad \log_2(n^5),\quad n!,\quad 3^{n/2}$$
          <p class="note">Gợi ý: $3^{n/2} = (\sqrt{3})^n$ với $\sqrt{3} \approx 1{,}732$.</p>
        focus: [[1, 2], "3.1", 0]
        say: "Đến lượt bạn, hãy sắp xếp năm hàm này theo tốc độ tăng. Gợi ý, 3 mũ n chia 2 bằng căn 3 mũ n, mà căn 3 khoảng 1 phẩy 732. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b>, đổi về dạng chuẩn:</p>
          <table class="t"><tr><th>hàm</th><th>dạng chuẩn</th><th>lý do</th></tr>
          <tr><td>$\log_2(n^5)$</td><td>$\Theta(\log_2 n)$</td><td>quy tắc ②: $= 5\log_2 n$</td></tr>
          <tr><td>$n^{10}$</td><td>$n^{10}$</td><td>đã chuẩn</td></tr>
          <tr><td>$3^{n/2}$</td><td>$(1{,}732\ldots)^n$</td><td>quy tắc ①: $= (3^{1/2})^n$</td></tr>
          <tr><td>$2^{n+1}$</td><td>$\Theta(2^n)$</td><td>$= 2 \cdot 2^n$</td></tr>
          <tr><td>$n!$</td><td>$n!$</td><td>đã chuẩn</td></tr></table>
        focus: [1, "2.2", "2.4", "2.5", 0]
        say: "Bước một, đổi về dạng chuẩn. Theo quy tắc lôgarit, lôgarit của n mũ 5 bằng 5 lần lôgarit, nên cùng bậc lôgarit. Theo quy tắc lũy thừa của lũy thừa, 3 mũ n chia 2 là căn 3 mũ n, với căn 3 khoảng 1 phẩy 732. Còn 2 mũ n cộng 1 bằng 2 nhân 2 mũ n, cùng bậc 2 mũ n. Hai hàm còn lại đã ở dạng chuẩn."
      - show: |
          <p><b>Bước 2</b>, tra chuỗi: hai hàm mũ so cơ số, $1{,}732 < 2$.</p>
          <div class="box ok">$\log_2(n^5) \prec n^{10} \prec 3^{n/2} \prec 2^{n+1} \prec n!$</div>
          <p class="note">Bảng số sẽ đánh lừa: $3^{n/2}$ chỉ vượt $n^{10}$ từ $n = 80$.</p>
        focus: [1, 2, 3]
        say: "Bước hai, tra chuỗi, và giữa hai hàm mũ thì so cơ số, căn 3 nhỏ hơn 2 nên căn 3 mũ n chậm hẳn. Thứ tự là lôgarit, đa thức bậc 10, căn 3 mũ n, 2 mũ n cộng 1, rồi giai thừa. Lưu ý bảng số sẽ đánh lừa, vì căn 3 mũ n chỉ vượt n mũ 10 từ n bằng 80."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ hằng số, số hạng thấp</span><span class="a">→</span>
          <span class="n">đổi về dạng chuẩn ($2^{2n} = 4^n$)</span><span class="a">→</span>
          <span class="n">tra chuỗi (chậm → nhanh): lôgarit, căn, đa thức, hàm mũ, giai thừa</span><span class="a">→</span>
          <span class="n">nghi ngờ thì lấy giới hạn tỉ số</span></div>
        say: "Tổng kết chuỗi logic. Bỏ hằng số và số hạng thấp, rồi đổi về dạng chuẩn, ví dụ 2 mũ 2n thành 4 mũ n. Sau đó tra chuỗi, lôgarit chậm hơn căn, căn chậm hơn đa thức, đa thức chậm hơn hàm mũ, và hàm mũ chậm hơn giai thừa. Khi nghi ngờ, lấy giới hạn của tỉ số."
      - show: |
          <div class="box key"><b>Tư duy:</b> cơ số của <b>lôgarit</b> không đổi bậc; cơ số của <b>lũy thừa</b> thì đổi. Và thứ tự tiệm cận là “khi $n$ đủ lớn” — đừng tin vài giá trị đầu.</div>
        say: "Điều cần mang theo, cơ số của lôgarit không đổi bậc, nhưng cơ số của lũy thừa thì có. Và thứ tự tiệm cận là thứ tự khi n đủ lớn, đừng tin vài giá trị đầu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>mảng, mảng động và danh sách liên kết</b> — dùng chính các ký hiệu này để so sánh chi phí đọc, chèn, xoá.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học mảng, mảng động và danh sách liên kết, và dùng chính các ký hiệu vừa học để so sánh chi phí đọc, chèn và xoá phần tử. Hẹn gặp bạn ở bài tiếp theo."
