  - "Giải thích vì sao sắp xếp nhanh tệ nhất tốn n(n − 1)/2 phép so sánh nhưng trung bình chỉ khoảng 1,39 n log₂ n"
  - "Chứng minh mọi thuật toán sắp xếp dựa trên so sánh cần ít nhất log₂ n! phép so sánh ở trường hợp tệ nhất, tức Ω(n log n)"
  - "Giải thích vì sao sắp xếp đếm chạy Θ(n + k) mà không trái với cận dưới đó"
