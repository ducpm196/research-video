6" y="204" width="68" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="70" y="232" font-size="24" text-anchor="middle">a b c</text><rect x="276" y="204" width="104" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="328" y="232" font-size="24" text-anchor="middle">a ≤ c?</text><rect x="208" y="296" width="68" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="242" y="324" font-size="24" text-anchor="middle">a c b</text><rect x="663" y="112" width="104" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="715" y="140" font-size="24" text-anchor="middle">a ≤ c?</text><rect x="552" y="204" width="68" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="586" y="232" font-size="24" text-anchor="middle">b a c</text><rect x="380" y="296" width="68" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="414" y="324" font-size="24" text-anchor="middle">c a b</text><rect x="792" y="204" width="104" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="844" y="232" font-size="24" text-anchor="middle">b ≤ c?</text><rect x="724" y="296" width="68" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="758" y="324" font-size="24" text-anchor="middle">b c a</text><rect x="896" y="296" width="68" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="930" y="324" font-size="24" text-anchor="middle">c b a</text></svg>
          <p class="note">Sắp xếp chèn (bài 13: lấy lần lượt từng phần tử, chèn vào đúng chỗ trong phần đầu đã sắp) trên 3 phần tử $a, b, c$: mỗi nút là một phép so sánh, mỗi lá là một thứ tự.</p>
        focus: [1, 1, 2, 1, 1]
        say: "Giờ trả lời câu hỏi thứ hai. Mọi thuật toán chỉ dựa trên so sánh đều vẽ được thành một cây quyết định, như hình này của sắp xếp chèn ở bài 13 với ba phần tử a, b, c. Sắp xếp chèn lấy lần lượt từng phần tử và chèn vào đúng chỗ trong phần đầu đã sắp. Mỗi nút là một câu hỏi so sánh, đi trái nếu đúng, đi phải nếu sai, và mỗi lá là một thứ tự đã sắp. Ba phần tử có 3 giai thừa bằng 6 thứ tự, nên cây phải có ít nhất 6 lá."

  - id: bound
    kind: concept
    title: "Cận dưới: không thể ít hơn log₂ n! phép so sánh"
    checks:
      - "all(math.log2(math.factorial(m)) >= (m / 2) * math.log2(m / 2) for m in range(2, 2001, 2))"
      - "math.ceil(math.log2(720)) == 10 and round(math.log2(720), 2) == 9.49"
      - "math.ceil(math.log2(math.factorial(1000))) == 8530 and round(float(2 * 1001 * sum(Rational(1, k) for k in range(1, 1001)) - 4000)) == 10986 and 1000 * 999 // 2 == 499500"
    steps:
      - show: |
          <p>$n$ phần tử có $n!$ thứ tự → cây cần $\ge n!$ lá. Cây nhị phân cao $h$ có tối đa $2^h$ lá:</p>
          <div class="box key">$2^h \ge n! \implies h \ge \log_2 n!\ $ — số so sánh ở trường hợp tệ nhất</div>
          <p>Vì $\ n! \ge \left(\dfrac{n}{2}\right)^{n/2}$ (nửa sau các thừa số đều $\ge n/2$): $\ \log_2 n! \ge \dfrac{n}{2}\log_2\dfrac{n}{2} \in \Omega(n\log_2 n)$</p>
        focus: [1, 2, 2, 3, 3]
        say: "Tổng quát, n phần tử có n giai thừa thứ tự, nên cây cần ít nhất n giai thừa lá. Cây nhị phân cao h có tối đa 2 mũ h lá, nên 2 mũ h không nhỏ hơn n giai thừa. Vì vậy độ cao h, cũng là số so sánh ở trường hợp tệ nhất, ít nhất bằng lôgarit cơ số 2 của n giai thừa. Vì nửa sau các thừa số của n giai thừa đều không nhỏ hơn n chia 2, nên n giai thừa không nhỏ hơn n chia 2 mũ n chia 2. Lấy lôgarit hai vế, ta được cận dưới thuộc Omega của n lôgarit n."
      - clear: true
        show: |
          <table class="t"><tr><th>$n$</th><th>cận dưới $\lceil\log_2 n!\rceil$</th><th>sắp xếp nhanh: trung bình</th><th>sắp xếp nhanh: tệ nhất</th></tr>
          <tr><td>6</td><td>$\lceil\log_2 720\rceil = \lceil 9{,}49\rceil = 10$</td><td>10,3</td><td>15</td></tr>
          <tr><td>1000</td><td>$\approx 8\,530$</td><td>$\approx 10\,986$</td><td>499 500</td></tr></table>
          <div class="box ok">Sắp xếp trộn đạt $\Theta(n\log_2 n)$ ở mọi trường hợp → <b>tối ưu</b> trong lớp thuật toán dựa trên so sánh.</div>
        focus: [0, "1.2", "1.3", 2]
        say: "So sánh bằng số. Với 6 phần tử, mọi thuật toán so sánh đều cần ít nhất 10 lần ở trường hợp tệ nhất, vì lôgarit cơ số 2 của 720 khoảng 9 phẩy 49. Với 1000 phần tử, cận dưới khoảng 8 nghìn 530, sắp xếp nhanh trung bình khoảng 10 nghìn 986, còn tệ nhất lên tới gần nửa triệu. Vì vậy sắp xếp trộn, luôn Theta của n lôgarit n, là tối ưu trong lớp thuật toán dựa trên so sánh."

  # ───────────────────────── 7. SẮP XẾP ĐẾM ─────────────────────────
  - id: counting
    kind: example
    title: "Sắp xếp đếm: nhanh hơn vì không so sánh"
    checks:
      - "alg.counting_sort([2, 0, 3, 2, 1, 0, 2, 3], 3) == ([2, 1, 3, 2], [0, 2, 3, 6], [0, 0, 1, 2, 2, 2, 3, 3])"
      - "8 + 3 + 1 == 12"
    steps:
      - show: |
          <p>Khoá là số nguyên từ 0 đến $k = 3$: &nbsp; $[2, 0, 3, 2, 1, 0, 2, 3]$</p>
          <table class="t"><tr><th>giá trị</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>① đếm số lần</td><td>2</td><td>1</td><td>3</td><td>2</td></tr>
          <tr><td>② vị trí bắt đầu</td><td>0</td><td>2</td><td>3</td><td>6</td></tr></table>
          <p>③ ghi ra: $\ [0, 0, 1, 2, 2, 2, 3, 3]$ — tốn $\Theta(n + k)$, <b>không</b> so sánh hai phần tử nào với nhau.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Vậy có thuật toán nào nhanh hơn không? Có, nếu không dựa trên so sánh. Khi khoá là số nguyên nhỏ, từ 0 đến k bằng 3, sắp xếp đếm đếm số lần xuất hiện của mỗi giá trị, được 2, 1, 3, 2. Cộng dồn ra vị trí bắt đầu của mỗi giá trị, 0, 2, 3, 6. Rồi ghi ra mảng đã sắp, tốn Theta của n cộng k, và không hề so sánh hai phần tử nào với nhau."
      - show: |
          <div class="box key">Cận dưới $\log_2 n!$ chỉ áp dụng cho thuật toán <b>dựa trên so sánh</b>. Sắp xếp đếm dùng giá trị khoá làm chỉ số mảng — đổi giả thiết, nên không trái cận dưới. Đổi lại: cần khoá là số nguyên trong khoảng nhỏ.</div>
        focus: [1, 1, 1]
        say: "Lưu ý, cận dưới lôgarit của n giai thừa chỉ áp dụng cho thuật toán dựa trên so sánh. Sắp xếp đếm dùng chính giá trị khoá làm chỉ số mảng, tức là đổi giả thiết, nên không trái với cận dưới. Đổi lại, nó cần khoá là số nguyên trong một khoảng nhỏ, k lớn quá thì mảng đếm quá to."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: ba phép thử cho một lần phân hoạch"
    checks:
      - "(lambda a: (lambda q: all(x <= a[q] for x in a[:q]) and all(x > a[q] for x in a[q + 1:]) and sorted(a) == [1, 2, 4, 5, 6, 7])(alg.partition(a)[0]))([4, 7, 2, 6, 1, 5])"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>trên $[4, 2, 1, 5, 7, 6]$</th></tr>
          <tr><td><b>1</b>: bên trái chốt $\le$ chốt, bên phải $>$ chốt</td><td>$[4, 2, 1]\,|\,5\,|\,[7, 6]$ ✓</td></tr>
          <tr><td><b>2</b>: vẫn đủ đúng các số ban đầu (chỉ đổi chỗ)</td><td>sắp lại: 1, 2, 4, 5, 6, 7 ✓</td></tr>
          <tr><td><b>3</b>: số so sánh = độ dài đoạn trừ 1</td><td>$6 - 1 = 5$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Sau mỗi lần phân hoạch, tự kiểm ba điều, vì sai một chỉ số là cả mảng hỏng. Một, mọi số bên trái chốt không lớn hơn chốt, mọi số bên phải lớn hơn chốt. Hai, mảng vẫn đủ đúng các số ban đầu, vì ta chỉ đổi chỗ. Ba, số phép so sánh đúng bằng độ dài đoạn trừ 1, ở đây 6 trừ 1 bằng 5."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.qs_count([7] * 6) == 15 and alg.qs_count(range(1, 7)) == 15"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Sắp xếp nhanh luôn $\Theta(n\log_2 n)$” <b class="red">(sai)</b>
          <br><span class="note">Mảng đã sắp, chốt cuối: $n(n - 1)/2$. Mảng toàn số bằng nhau với phép so sánh $\le$: cũng 15 so sánh khi $n = 6$. Nói đúng: <b>trung bình</b> (hay kỳ vọng với chốt ngẫu nhiên), khi các số khác nhau, là $\Theta(n\log_2 n)$.</span>
          <table class="t"><tr><th>đầu vào, $n = 6$</th><th>đã sắp</th><th>toàn số 7</th><th>trung bình mọi thứ tự</th></tr><tr><td>số so sánh</td><td>15</td><td>15</td><td>10,3</td></tr></table></div>
        say: "Lỗi thứ nhất, nói sắp xếp nhanh luôn tốn Theta của n lôgarit n. Mảng đã sắp với chốt cuối tốn n nhân n trừ 1 chia 2, và mảng toàn số bằng nhau cũng vậy, với n bằng 6 là 15 phép so sánh. Nói đúng là trung bình, hay kỳ vọng khi chọn chốt ngẫu nhiên, với các số khác nhau, mới là Theta của n lôgarit n."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “Không thuật toán nào sắp xếp nhanh hơn $n\log_2 n$” <b class="red">(thiếu điều kiện)</b>
          <br><span class="note">Chỉ đúng với thuật toán <b>dựa trên so sánh</b>. Sắp xếp đếm: $\Theta(n + k)$.</span></div>
        say: "Lỗi thứ hai, nói không thuật toán nào sắp xếp nhanh hơn n lôgarit n. Câu đó chỉ đúng với thuật toán dựa trên so sánh, còn sắp xếp đếm chạy Theta của n cộng k."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhầm “trung bình” với “bảo đảm” <b class="red">(sai)</b>
          <br><span class="note">Trung bình 10,3 so sánh khi $n = 6$ là trung bình trên mọi thứ tự; một đầu vào cụ thể vẫn có thể tốn 15.</span></div>
        say: "Lỗi thứ ba, nhầm trung bình với bảo đảm. Con số 10 phẩy 3 khi n bằng 6 là trung bình trên mọi thứ tự, còn một đầu vào cụ thể vẫn có thể tốn 15."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Gọi đệ quy cả chốt: quicksort(a, lo, q) thay vì q − 1 <b class="red">(sai)</b>
          <br><span class="note">Chốt đã ở đúng chỗ; nếu đoạn trái chứa cả chốt và chốt là số lớn nhất, đoạn không nhỏ đi → đệ quy mãi.</span></div>
        say: "Lỗi thứ tư, gọi đệ quy cho đoạn trái mà tính cả chốt. Chốt đã ở đúng chỗ, và nếu chốt là số lớn nhất thì đoạn trái không nhỏ đi, nên đệ quy không bao giờ dừng."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda a: alg.partition(a)[:2] == (3, 5) and a == [3, 1, 2, 5, 8, 6])([3, 8, 1, 6, 2, 5])"
      - "alg.qs_count([3, 8, 1, 6, 2, 5]) == 8 and math.ceil(math.log2(math.factorial(5))) == 7 and round(math.log2(120), 2) == 6.91"
      - "(lambda r: [t[3] for t in r[2]] == [[3, 8, 1, 6, 2, 5], [3, 8, 1, 6, 2, 5], [3, 1, 8, 6, 2, 5], [3, 1, 8, 6, 2, 5], [3, 1, 2, 6, 8, 5]] and [t[2] for t in r[2]] == [True, False, True, False, True])(alg.partition([3, 8, 1, 6, 2, 5]))"
      - "alg.qs_count([3, 1, 2]) == 2 and alg.qs_count([8, 6]) == 1 and 5 + 2 + 1 == 8 and 2**6 == 64 < 120 <= 2**7 == 128"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phân hoạch $[3, 8, 1, 6, 2, 5]$ với chốt cuối. Mảng sau phân hoạch? Bao nhiêu phép so sánh?</td></tr>
          <tr><td>2</td><td>Tổng số so sánh của cả sắp xếp nhanh trên mảng đó?</td></tr>
          <tr><td>3</td><td>Mọi thuật toán so sánh cần ít nhất bao nhiêu lần (tệ nhất) để sắp 5 phần tử?</td></tr></table>
        focus: ["1.2", "1.3", "1.4", 0]
        say: "Đến lượt bạn, phân hoạch mảng 3, 8, 1, 6, 2, 5 với chốt cuối, cho biết mảng sau phân hoạch và số phép so sánh. Tiếp theo, đếm tổng số so sánh của cả sắp xếp nhanh trên mảng đó. Cuối cùng, mọi thuật toán so sánh cần ít nhất bao nhiêu lần để sắp năm phần tử ở trường hợp tệ nhất? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <table class="t"><tr><th>$j$</th><th>$a[j]$ so với chốt 5</th><th>việc làm</th><th>mảng sau bước</th></tr>
          <tr><td>0</td><td>3 $\le$ 5</td><td>$i = 0$</td><td>[3, 8, 1, 6, 2, 5]</td></tr>
          <tr><td>1</td><td>8 $>$ 5</td><td>giữ nguyên</td><td>[3, 8, 1, 6, 2, 5]</td></tr>
          <tr><td>2</td><td>1 $\le$ 5</td><td>$i = 1$, đổi $a[1], a[2]$</td><td>[3, <b>1</b>, <b>8</b>, 6, 2, 5]</td></tr>
          <tr><td>3</td><td>6 $>$ 5</td><td>giữ nguyên</td><td>[3, 1, 8, 6, 2, 5]</td></tr>
          <tr><td>4</td><td>2 $\le$ 5</td><td>$i = 2$, đổi $a[2], a[4]$</td><td>[3, 1, <b>2</b>, 6, <b>8</b>, 5]</td></tr>
          <tr><td>cuối</td><td>—</td><td>đổi $a[3], a[5]$</td><td>$[3, 1, 2, \hlg{5}, 8, 6]$</td></tr></table>
        focus: [0, "1.2", "1.4", "1.6", "1.7", 0]
        say: "Đáp án câu một, chạy tay như ví dụ, chốt là 5. Số 3 không lớn hơn 5 nên i thành 0, còn 8 lớn hơn nên giữ nguyên. Số 1 nhỏ hơn, i thành 1, đổi 1 lên trước 8. Tiếp theo 6 giữ nguyên, còn 2 được đổi vào ô thứ ba, đẩy 8 ra sau. Cuối cùng đổi chốt vào chỉ số 3, được 3, 1, 2, 5, 8, 6. Mỗi ô từ 0 đến 4 so với chốt đúng một lần, nên tốn 5 phép so sánh."
      - clear: true
        show: |
          <p>② Đệ quy hai bên chốt:</p>
          <table class="t"><tr><th>đoạn</th><th>chốt</th><th>so sánh</th><th>kết quả</th></tr>
          <tr><td>[3, 1, 2, 5, 8, 6]</td><td>5</td><td>5</td><td>[3, 1, 2] | 5 | [8, 6]</td></tr>
          <tr><td>[3, 1, 2]</td><td>2</td><td>2</td><td>[1] | 2 | [3]</td></tr>
          <tr><td>[8, 6]</td><td>6</td><td>1</td><td>6 | [8]</td></tr></table>
          <p>Tổng $5 + 2 + 1 = \hlg{8}$ phép so sánh.</p>
        focus: [1, "2.3", "2.4", 3]
        say: "Câu hai, ta gọi đệ quy cho hai đoạn ở hai bên chốt. Đoạn 3, 1, 2 có chốt 2, tốn 2 phép so sánh và tách thành 1 và 3, đều chỉ một phần tử. Đoạn 8, 6 có chốt 6, tốn 1 phép so sánh. Tổng cộng 5 cộng 2 cộng 1, bằng 8 phép so sánh."
      - clear: true
        show: |
          <p>③ Cây quyết định cho 5 phần tử phải có ít nhất $5! = 120$ lá, mỗi thứ tự một lá. Cây cao $h$ có không quá $2^h$ lá:</p>
          <table class="t"><tr><th>$h$</th><th>6</th><th>7</th></tr><tr><th>số lá tối đa $2^h$</th><td>64 &lt; 120, không đủ</td><td>128 $\ge$ 120 ✓</td></tr></table>
          <p>Vậy $h \ge \log_2 120 \approx 6{,}91$, tức ít nhất $\hlg{7}$ so sánh ở trường hợp tệ nhất.</p>
        introduces: [power]
        focus: [1, 1, 2, 3]
        say: "Câu ba, dùng cây quyết định. Năm phần tử có 5 giai thừa, bằng 120 thứ tự, mỗi thứ tự phải là một lá riêng. Cây cao 6 chỉ có tối đa 2 mũ 6 bằng 64 lá, không đủ, còn cây cao 7 có tới 128 lá. Vậy chiều cao ít nhất là lôgarit cơ số 2 của 120, khoảng 6 phẩy 91, làm tròn lên thành 7 phép so sánh ở trường hợp tệ nhất."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">phân hoạch quanh chốt: $n - 1$ so sánh</span><span class="a">→</span>
          <span class="n">tệ nhất $\Theta(n^2)$, trung bình $\approx 1{,}39\,n\log_2 n$</span><span class="a">→</span>
          <span class="n">cây quyết định: $\ge \log_2 n!$</span><span class="a">→</span>
          <span class="n">không so sánh: sắp xếp đếm $\Theta(n + k)$</span></div>
        say: "Tổng kết chuỗi logic. Phân hoạch quanh chốt tốn n trừ 1 phép so sánh. Sắp xếp nhanh tệ nhất tốn Theta của n bình phương, nhưng trung bình chỉ khoảng 1 phẩy 39 n lôgarit cơ số 2 của n. Cây quyết định cho thấy mọi thuật toán so sánh cần ít nhất lôgarit của n giai thừa. Muốn nhanh hơn thì phải bỏ so sánh, như sắp xếp đếm."
      - show: |
          <div class="box key"><b>Tư duy:</b> một cận dưới luôn đi kèm <b>mô hình tính toán</b> của nó. Trước khi nói “không thể nhanh hơn”, hỏi: thuật toán được phép làm những thao tác gì?</div>
        say: "Điều cần mang theo, một cận dưới luôn đi kèm mô hình tính toán của nó. Trước khi nói không thể nhanh hơn, hãy hỏi thuật toán được phép làm những thao tác gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 24): <b>đường đi ngắn nhất</b> — Dijkstra khi mọi cạnh không âm, và Bellman-Ford khi có cạnh âm.</p>
        forward_ref: true
        say: "Ở bài sau, bài 24, ta học tìm đường đi ngắn nhất trên đồ thị có trọng số, một thuật toán cho trường hợp mọi cạnh không âm, và một thuật toán khác khi có cạnh âm. Hẹn gặp bạn ở bài tiếp theo."
