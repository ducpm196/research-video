# Quy ước: mảng a đánh chỉ số từ 0; chốt = phần tử CUỐI của đoạn đang xét (phân hoạch Lomuto); “so sánh” = một lần xét a[j] ≤ chốt;
#   log₂ viết \log_2; H_n = 1 + 1/2 + … + 1/n (tổng điều hoà, bài 0); số thập phân dấu phẩy.
