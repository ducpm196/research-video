scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sắp xếp ngay trong mảng, và giới hạn tốc độ"
    steps:
      - show: |
          <p>Bài 12: sắp xếp trộn luôn $\Theta(n\log_2 n)$ — nhưng cần thêm <b>một mảng phụ</b> $n$ ô để trộn.</p>
          <ol><li>Có cách sắp xếp <b>ngay trong mảng</b> mà thường vẫn nhanh như vậy không?</li>
          <li>Có thuật toán nào sắp xếp <b>nhanh hơn</b> $n\log_2 n$ không?</li></ol>
        focus: [1, 2, "2.1", "2.2"]
        say: "Chào bạn, ở bài 12, sắp xếp trộn chia đôi mảng, sắp hai nửa rồi trộn lại, luôn tốn Theta của n lôgarit n, nhưng cần thêm một mảng phụ để trộn. Hôm nay có hai câu hỏi. Một, có cách sắp xếp ngay trong mảng mà thường vẫn nhanh như vậy không. Hai, có thuật toán nào sắp xếp nhanh hơn n lôgarit n không."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: tổng, tổng điều hoà, giai thừa, Θ và Ω"
    checks:
      - "sum(range(1, 6)) == 6 * 5 // 2 == 15"
      - "abs(float(sum(Rational(1, k) for k in range(1, 1001))) - (math.log(1000) + 0.5772)) < 0.001"
      - "math.factorial(4) == 24 and math.factorial(6) == 720"
      - "all(Rational(n * n, 4) <= Rational(n * (n - 1), 2) <= Rational(n * n, 2) for n in range(2, 200))"
    steps:
      - show: |
          <ul><li>Bài 0: $\ 1 + 2 + \dots + (n - 1) = \dfrac{n(n - 1)}{2}$; &nbsp; với $n = 6$: $\ 15$</li>
          <li>Bài 0: tổng điều hoà $\ H_n = 1 + \dfrac{1}{2} + \dots + \dfrac{1}{n} \approx \ln n + 0{,}577$</li>
          <li>Bài 2: $\ n! = 1 \cdot 2 \cdot \dots \cdot n$; &nbsp; $4! = 24$, $\ 6! = 720$</li>
          <li>Bài 1: $\Theta(f)$ — số bước tăng <b>cùng cỡ</b> $f$ (kẹp giữa hai hằng số nhân $f$); $\ \Omega(f)$ — <b>ít nhất</b> cỡ $f$. Ví dụ $\frac{n(n - 1)}{2}$ nằm giữa $\frac{n^2}{4}$ và $\frac{n^2}{2}$ khi $n \ge 2$, nên thuộc $\Theta(n^2)$.</li></ul>
        focus: [0, "1.1", "1.2", "1.3", "1.4", "1.4"]
        say: "Ôn lại bốn điều sẽ dùng. Theo bài 0, tổng 1 cộng 2 cho tới n trừ 1 bằng n nhân n trừ 1 chia 2, với n bằng 6 là 15. Cũng ở bài 0, tổng điều hoà H n, tức 1 cộng một phần hai cho tới một phần n, xấp xỉ lôgarit tự nhiên của n cộng 0 phẩy 577. Theo bài 2, n giai thừa là tích các số từ 1 đến n, ví dụ 6 giai thừa bằng 720. Theo bài 1, Theta của f nghĩa là số bước tăng cùng cỡ với f, bị kẹp giữa hai hằng số nhân f, còn Omega của f nghĩa là ít nhất cỡ f. Ví dụ n nhân n trừ 1 chia 2 nằm giữa một phần tư và một nửa của n bình phương khi n từ 2 trở lên, nên thuộc Theta của n bình phương."

  # ───────────────────────── 3. Ý TƯỞNG ─────────────────────────
  - id: idea
    kind: concept
    title: "Ý tưởng: phân hoạch quanh một chốt"
    checks:
      - "(lambda r: [t[3] for t in r[2]][2] == [4, 2, 7, 6, 1, 5])(alg.partition([4, 7, 2, 6, 1, 5]))"
    steps:
      - show: |
          <div class="box key"><b>Phân hoạch</b>: chọn một phần tử làm <b>chốt</b> (ở đây: phần tử cuối). Xếp lại đoạn sao cho mọi số $\le$ chốt đứng bên trái, mọi số $>$ chốt đứng bên phải. Chốt rơi vào <b>đúng vị trí cuối cùng</b> của nó.</div>
          <p>Rồi sắp tiếp hai phần hai bên theo cùng cách — <b>không cần trộn</b>. Đó là <b>sắp xếp nhanh</b> (C. A. R. Hoare, 1961).</p>
        focus: [1, 1, 1, 2, 2]
        say: "Ý tưởng là chọn một phần tử làm chốt, ở đây là phần tử cuối của đoạn. Ta xếp lại đoạn sao cho mọi số không lớn hơn chốt đứng bên trái, mọi số lớn hơn chốt đứng bên phải. Khi đó chốt nằm đúng vị trí cuối cùng của nó trong mảng đã sắp. Rồi ta sắp tiếp hai phần hai bên theo cùng cách, và không cần bước trộn. Thuật toán này gọi là sắp xếp nhanh, được công bố năm 1961."
      - clear: true
        show: |
          <svg width="1000" height="345" viewBox="0 0 1000 345"><defs><marker id="arL23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="140" y="110" width="120" height="90" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="200" y="170" font-size="40" font-weight="700" text-anchor="middle" fill="#1f2937">4</text><text x="200" y="230" font-size="22" text-anchor="middle" fill="#6b7280">0</text><rect x="260" y="110" width="120" height="90" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="320" y="170" font-size="40" font-weight="700" text-anchor="middle" fill="#1f2937">2</text><text x="320" y="230" font-size="22" text-anchor="middle" fill="#6b7280">1</text><rect x="380" y="110" width="120" height="90" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="440" y="170" font-size="40" font-weight="700" text-anchor="middle" fill="#1f2937">7</text><text x="440" y="230" font-size="22" text-anchor="middle" fill="#6b7280">2</text><rect x="500" y="110" width="120" height="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="560" y="170" font-size="40" font-weight="700" text-anchor="middle" fill="#1f2937">6</text><text x="560" y="230" font-size="22" text-anchor="middle" fill="#6b7280">3</text><rect x="620" y="110" width="120" height="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="680" y="170" font-size="40" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><text x="680" y="230" font-size="22" text-anchor="middle" fill="#6b7280">4</text><rect x="740" y="110" width="120" height="90" fill="#fed7aa" stroke="#d97706" stroke-width="3"/><text x="800" y="170" font-size="40" font-weight="700" text-anchor="middle" fill="#1f2937">5</text><text x="800" y="230" font-size="22" text-anchor="middle" fill="#6b7280">5</text><path d="M148,96 L148,84 L372,84 L372,96" fill="none" stroke="#15803d" stroke-width="3"/><text x="260" y="70" font-size="26" font-weight="700" text-anchor="middle" fill="#15803d">≤ 5</text><path d="M388,96 L388,84 L492,84 L492,96" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="440" y="70" font-size="26" font-weight="700" text-anchor="middle" fill="#b91c1c">> 5</text><path d="M508,96 L508,84 L732,84 L732,96" fill="none" stroke="#6b7280" stroke-width="3"/><text x="620" y="70" font-size="26" font-weight="700" text-anchor="middle" fill="#6b7280">chưa xét</text><path d="M748,96 L748,84 L852,84 L852,96" fill="none" stroke="#d97706" stroke-width="3"/><text x="800" y="70" font-size="26" font-weight="700" text-anchor="middle" fill="#d97706">chốt</text><line x1="320" y1="290" x2="320" y2="244" stroke="#1f2937" stroke-width="3" marker-end="url(#arL23)"/><text x="320" y="318" font-size="30" font-weight="700" text-anchor="middle" fill="#1f2937">i</text><line x1="560" y1="290" x2="560" y2="244" stroke="#1f2937" stroke-width="3" marker-end="url(#arL23)"/><text x="560" y="318" font-size="30" font-weight="700" text-anchor="middle" fill="#1f2937">j</text></svg>
          <p>Ảnh chụp giữa lúc phân hoạch $[4, 7, 2, 6, 1, 5]$: ô $0 \dots i$ là vùng số nhỏ, ô $i + 1 \dots j - 1$ là vùng số lớn, từ $j$ trở đi chưa xét.</p>
        focus: [1, 1, 1, 1, 2]
        say: "Hình này chụp đoạn 4, 7, 2, 6, 1, 5 giữa lúc phân hoạch, khi đã xét xong ba ô đầu. Hai ô xanh 4 và 2 là vùng số không lớn hơn chốt, kết thúc ở vị trí i. Ô đỏ 7 là vùng số lớn hơn chốt, nằm ngay sau. Các ô xám từ vị trí j trở đi chưa xét, còn ô cam cuối cùng là chốt 5. Mỗi bước j tiến một ô, và nếu số đó nhỏ, nó được đổi vào ngay sau vùng xanh, nên ba vùng luôn liền nhau như vậy."
      - clear: true
        show: |
          <div class="code"><div>partition(a, lo, hi):        <span class="cm">// chốt p = a[hi]; i = cuối vùng số nhỏ</span></div><div>    p = a[hi];  i = lo - 1</div><div>    <span class="kw">for</span> j = lo .. hi - 1:</div><div>        <span class="kw">if</span> a[j] &lt;= p:  i = i + 1;  đổi chỗ a[i], a[j]</div><div>    đổi chỗ a[i + 1], a[hi];  <span class="kw">return</span> i + 1</div><div>quicksort(a, lo, hi):</div><div>    <span class="kw">if</span> lo &lt; hi:  q = partition(a, lo, hi);  quicksort(a, lo, q - 1);  quicksort(a, q + 1, hi)</div></div>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.7"]
        say: "Viết thành mã như sau. Biến p giữ chốt, còn i đánh dấu chỗ cuối của vùng số nhỏ, lúc đầu vùng này rỗng. Biến j duyệt từ đầu đến trước chốt, mỗi bước là một phép so sánh. Gặp số không lớn hơn chốt, ta nới vùng số nhỏ thêm một ô và đổi số đó vào. Cuối cùng đổi chốt vào ngay sau vùng số nhỏ, rồi gọi đệ quy cho hai phần hai bên chốt."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chạy tay phân hoạch [4, 7, 2, 6, 1, 5]"
    checks:
      - "(lambda r: r[0] == 3 and r[1] == 5 and [t[3] for t in r[2]] == [[4, 7, 2, 6, 1, 5], [4, 7, 2, 6, 1, 5], [4, 2, 7, 6, 1, 5], [4, 2, 7, 6, 1, 5], [4, 2, 1, 6, 7, 5]] and [t[2] for t in r[2]] == [True, False, True, False, True])(alg.partition([4, 7, 2, 6, 1, 5]))"
      - "(lambda a: alg.partition(a)[0] == 3 and a == [4, 2, 1, 5, 7, 6])([4, 7, 2, 6, 1, 5])"
      - "alg.qs_count([4, 7, 2, 6, 1, 5]) == 5 + 2 + 1 + 1 == 9"
    steps:
      - show: |
          <table class="t"><tr><th>$j$</th><th>$a[j]$ so với chốt 5</th><th>việc làm</th><th>mảng sau bước</th></tr>
          <tr><td>0</td><td>4 $\le$ 5</td><td>$i = 0$, đổi $a[0]$ với chính nó</td><td>[4, 7, 2, 6, 1, 5]</td></tr>
          <tr><td>1</td><td>7 $>$ 5</td><td>giữ nguyên</td><td>[4, 7, 2, 6, 1, 5]</td></tr>
          <tr><td>2</td><td>2 $\le$ 5</td><td>$i = 1$, đổi $a[1], a[2]$</td><td>[4, <b>2</b>, <b>7</b>, 6, 1, 5]</td></tr>
          <tr><td>3</td><td>6 $>$ 5</td><td>giữ nguyên</td><td>[4, 2, 7, 6, 1, 5]</td></tr>
          <tr><td>4</td><td>1 $\le$ 5</td><td>$i = 2$, đổi $a[2], a[4]$</td><td>[4, 2, <b>1</b>, 6, <b>7</b>, 5]</td></tr>
          <tr><td>cuối</td><td>—</td><td>đổi $a[3], a[5]$ (đưa chốt vào)</td><td>[4, 2, 1, <b>5</b>, 7, 6]</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.6", "1.7"]
        say: "Chạy tay với mảng 4, 7, 2, 6, 1, 5, chốt là 5. Với j bằng 0, số 4 không lớn hơn 5, nên i thành 0 và 4 đổi chỗ với chính nó. Với j bằng 1, số 7 lớn hơn 5 nên giữ nguyên. Với j bằng 2, số 2 nhỏ hơn, i thành 1, đổi 2 lên trước 7. Tiếp theo 6 giữ nguyên, còn 1 được đổi vào ô thứ ba, đẩy 7 ra sau. Cuối cùng đổi chốt 5 vào ngay sau vùng số nhỏ."
      - show: |
          <div class="box ok">Chốt 5 về chỉ số 3: bên trái $[4, 2, 1]$ đều $\le 5$, bên phải $[7, 6]$ đều $> 5$. Tốn $\hlg{5} = n - 1$ phép so sánh.</div>
          <p>Đệ quy: $[4, 2, 1]$ chốt 1 tốn 2 so sánh → $[1, 2, 4]$, rồi $[2, 4]$ tốn 1; $\ [7, 6]$ tốn 1. Tổng $\ 5 + 2 + 1 + 1 = \hlg{9}$.</p>
        focus: [1, 1, 2, 2]
        say: "Kết quả, chốt 5 về chỉ số 3, bên trái là 4, 2, 1 đều không lớn hơn 5, bên phải là 7, 6 đều lớn hơn 5. Đoạn 6 phần tử tốn đúng 5 phép so sánh, tức n trừ 1. Đệ quy tiếp, đoạn 4, 2, 1 với chốt 1 tốn 2 phép so sánh, rồi đoạn 2, 4 tốn 1, còn đoạn 7, 6 tốn 1. Tổng cộng 5 cộng 2 cộng 1 cộng 1, bằng 9 phép so sánh."

  # ───────────────────────── 5. TỆ NHẤT, TRUNG BÌNH ─────────────────────────
  - id: cost
    kind: formula
    title: "Tệ nhất n(n − 1)/2, trung bình khoảng 1,39 n log₂ n"
    checks:
      - "all(alg.qs_count(range(1, n + 1)) == n * (n - 1) // 2 for n in range(1, 13)) and alg.qs_count(range(1, 7)) == 15"
      - "all(alg.qs_count([7] * n) == n * (n - 1) // 2 for n in range(1, 12))"
      - "all(Rational(sum(alg.qs_count(p) for p in __import__('itertools').permutations(range(n))), math.factorial(n)) == 2 * (n + 1) * sum(Rational(1, k) for k in range(1, n + 1)) - 4 * n for n in range(1, 8))"
      - "2 * 7 * sum(Rational(1, k) for k in range(1, 7)) - 24 == Rational(103, 10)"
      - "round(2 * math.log(2), 2) == 1.39"
      - "all(alg.qs_count([7] * n) == n * (n - 1) // 2 for n in range(1, 9))"
    steps:
      - show: |
          <p><b>Tệ nhất</b>: mảng <b>đã sắp</b> $[1, 2, \dots, n]$. Chốt là số lớn nhất → phần phải rỗng, phần trái còn $n - 1$ phần tử.</p>
          $$(n - 1) + (n - 2) + \dots + 1 = \frac{n(n - 1)}{2} \in \Theta(n^2); \qquad n = 6:\ 15$$
        focus: [1, 1, 2, 2]
        say: "Trường hợp tệ nhất xảy ra khi mảng đã sắp sẵn. Chốt cuối là số lớn nhất, nên phần phải rỗng, còn phần trái có n trừ 1 phần tử, mỗi lần chỉ bớt được một. Số phép so sánh là n trừ 1, cộng n trừ 2, cho tới 1, theo bài 0 bằng n nhân n trừ 1 chia 2, tức Theta của n bình phương. Với n bằng 6, đó là 15, nhiều hơn hẳn con số 9 lúc nãy."
      - show: |
          <p><b>Trung bình</b> trên mọi thứ tự của đầu vào (máy vét cạn mọi hoán vị, $n \le 7$):</p>
          <div class="box key">$\ C(n) = 2(n + 1)H_n - 4n \ \approx\ 2n\ln n \approx \hlg{1{,}39}\, n\log_2 n$</div>
          <p>$n = 6$: $\ C(6) = 2 \cdot 7 \cdot 2{,}45 - 24 = 10{,}3$ &nbsp; (tệ nhất 15).</p>
        focus: [1, 2, 2, 3]
        say: "Còn trung bình trên mọi thứ tự có thể của đầu vào thì sao? Máy vét cạn mọi hoán vị với n tới 7 và xác nhận công thức C của n bằng 2 nhân n cộng 1 nhân H n, trừ 4 n. Vì H n xấp xỉ lôgarit tự nhiên của n, phần chính là 2 n lôgarit tự nhiên của n, tức khoảng 1 phẩy 39 nhân n lôgarit cơ số 2 của n. Với n bằng 6, trung bình là 10 phẩy 3, so với 15 ở trường hợp tệ nhất."
      - clear: true
        show: |
          <div class="box key"><b>Chốt ngẫu nhiên</b>: chọn chốt ngẫu nhiên rồi đổi về cuối. Khi đó với <b>mọi</b> đầu vào gồm các số <b>khác nhau</b>, số so sánh <b>kỳ vọng</b> vẫn là $C(n)$ — không còn “đầu vào xấu” cố định.</div>
          <p class="note">Bảo đảm tệ nhất vẫn là $\Theta(n^2)$: chỉ là rất khó gặp. Mảng toàn số bằng nhau thì chốt nào cũng như nhau: phân hoạch này vẫn tốn $n(n - 1)/2$. Bù lại, không cần mảng phụ như sắp xếp trộn.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Để tránh trường hợp tệ nhất do mảng đã sắp, người ta chọn chốt ngẫu nhiên rồi đổi nó về cuối. Khi đó với mọi đầu vào gồm các số khác nhau, số so sánh kỳ vọng vẫn là C của n, không còn đầu vào xấu cố định. Tuy vậy, tệ nhất vẫn là Theta của n bình phương, chỉ là rất khó gặp. Riêng mảng toàn số bằng nhau thì chốt nào cũng như nhau, và cách phân hoạch này vẫn tốn n nhân n trừ 1 chia 2 phép so sánh. Bù lại, sắp xếp nhanh không cần mảng phụ như sắp xếp trộn."

  # ───────────────────────── 6. CẬN DƯỚI ─────────────────────────
