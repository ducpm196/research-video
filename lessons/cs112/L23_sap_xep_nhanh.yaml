# Nối bài trước (luật 17): bài 0 — tổng 1 + … + (n − 1) và tổng điều hoà; bài 2 — giai thừa; bài 12 — sắp xếp trộn Θ(n log n)
#   cần mảng phụ; bài 13 — sắp xếp chèn; bài 1 — Ω là chặn dưới.
