assumes: [cdot, sub, dots, sum, bigTheta, in, iff]
# Quy ước: T(n) = số bước (ở đây: số lần chuyển đĩa) khi kích thước là n; thế ngược viết từng dòng “=” kèm lý do;
#   chỉ số bước thế là i; tổng lũy thừa của 2 viết đủ cận 2^0 … 2^(i−1).
# Sửa bản thảo (AUDIT_CS112 §2, fix L08): điểm dừng là n − i = 1 ⇔ i = n − 1. Thế tới i = n là dùng T(0) mà đề không cho
#   (ở bài này T(0) = 0 tình cờ cho cùng đáp số, nhưng phải tự chứng minh T(0) — nói rõ trong lỗi 1).
# Nối bài trước (luật 17): bài 0 — tổng 1 + 2 + 4 + … + 2^k = 2^(k+1) − 1 (nhân đôi rồi trừ); bài 1 — Θ là cùng bậc;
#   bài 4 — hàm đệ quy gọi lại chính nó, chạy trên ngăn xếp lời gọi.
objectives:
  - "Viết hệ thức truy hồi cho số bước của một hàm đệ quy, kèm điều kiện đầu"
  - "Thế ngược từng bước, nhận ra quy luật sau i bước và chọn đúng điểm dừng"
  - "Giải T(n) = 2T(n − 1) + 1, T(1) = 1 ra 2ⁿ − 1 và kiểm lại bằng số"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "64 chiếc đĩa: bao giờ mới chuyển xong?"
    checks:
      - "2**64 - 1 == 18446744073709551615 and round((2**64 - 1) / (365.25 * 24 * 3600) / 1e9) == 585"
    steps:
      - show: |
          <svg width="900" height="262" viewBox="0 0 900 262">
            <rect x="40" y="200" width="820" height="12" fill="#6b7280"/>
            <rect x="145" y="40" width="10" height="160" fill="#6b7280"/><rect x="445" y="40" width="10" height="160" fill="#6b7280"/><rect x="745" y="40" width="10" height="160" fill="#6b7280"/>
            <rect x="60" y="165" width="180" height="32" rx="8" fill="#2563eb"/><rect x="85" y="130" width="130" height="32" rx="8" fill="#059669"/><rect x="110" y="95" width="80" height="32" rx="8" fill="#d97706"/>
            <text x="150" y="242" font-size="24" fill="#6b7280" text-anchor="middle">cọc nguồn</text><text x="450" y="242" font-size="24" fill="#6b7280" text-anchor="middle">cọc trung gian</text><text x="750" y="242" font-size="24" fill="#6b7280" text-anchor="middle">cọc đích</text>
          </svg>
          <p>Chuyển cả chồng sang cọc đích; mỗi lần một đĩa; đĩa lớn không được đặt lên đĩa nhỏ.</p>
        focus: [1, 2]
        say: "Chào bạn, đây là trò chơi Tháp Hà Nội. Ta phải chuyển cả chồng đĩa từ cọc nguồn sang cọc đích, mỗi lần một đĩa, và không bao giờ đặt đĩa lớn lên đĩa nhỏ."
      - show: |
          <div class="box key">Với 64 đĩa cần $2^{64} - 1 \approx 1{,}8 \cdot 10^{19}$ lần chuyển. Mỗi giây một lần: khoảng <b>585 tỉ năm</b>.</div>
          <p>Hôm nay: con số $2^n - 1$ từ đâu ra — đếm số bước của một hàm đệ quy bằng <b>hệ thức truy hồi</b>.</p>
        focus: [1, 1, 2]
        say: "Với 64 đĩa, ta cần 2 mũ 64 trừ 1 lần chuyển, khoảng 1 phẩy 8 nhân 10 mũ 19. Nếu mỗi giây chuyển một lần, phải mất khoảng 585 tỉ năm. Hôm nay ta tìm ra con số 2 mũ n trừ 1 đó, bằng cách đếm số bước của một hàm đệ quy qua một hệ thức truy hồi."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn bài 0: tổng các lũy thừa của 2"
    checks:
      - "1 + 2 + 4 == 7 == 2**3 - 1 and all(sum(2**j for j in range(i)) == 2**i - 1 for i in range(1, 40))"
    steps:
      - show: |
          $$1 + 2 + 4 + \dots + 2^{i-1} = \sum_{j=0}^{i-1} 2^j = 2^i - 1$$
          <p>Thử $i = 3$: $\ 1 + 2 + 4 = 7 = 2^3 - 1$ ✓ &nbsp; (lý do ở bài 0: nhân đôi tổng rồi trừ đi tổng cũ, các số giữa triệt tiêu).</p>
        focus: [1, 2]
        say: "Ôn công thức của bài 0, tổng các lũy thừa của 2, từ 2 mũ 0 đến 2 mũ i trừ 1, bằng 2 mũ i trừ 1. Thử với i bằng 3, 1 cộng 2 cộng 4 bằng 7, đúng bằng 2 mũ 3 trừ 1, vì khi nhân đôi tổng rồi trừ tổng cũ, các số ở giữa triệt tiêu."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: T của n và hệ thức truy hồi"
    steps:
      - show: |
          <p>$T(n)$: <b>số bước</b> (ở đây: số lần chuyển đĩa) khi bài toán có kích thước $n$.</p>
          <div class="box key"><b>Hệ thức truy hồi</b>: viết $T(n)$ theo $T$ của kích thước <b>nhỏ hơn</b>, kèm <b>điều kiện đầu</b> cho kích thước nhỏ nhất.</div>
        focus: [1, 2, 2]
        say: "Ký hiệu T của n là số bước khi bài toán có kích thước n, ở đây là số lần chuyển đĩa khi có n đĩa. Một hệ thức truy hồi viết T của n theo T của một kích thước nhỏ hơn. Nó luôn đi kèm điều kiện đầu, cho biết T ở kích thước nhỏ nhất."

  # ───────────────────────── 4. LẬP HỆ THỨC ─────────────────────────
  - id: model
    kind: concept
    title: "Lời giải đệ quy và hệ thức của nó"
    steps:
      - show: |
          <div class="code"><div>Hanoi(n, nguồn, trung gian, đích):</div><div>    <span class="kw">if</span> n == 1: chuyển đĩa từ nguồn sang đích; <span class="kw">return</span></div><div>    Hanoi(n - 1, nguồn, đích, trung gian)   <span class="cm">// dọn n − 1 đĩa trên</span></div><div>    chuyển đĩa lớn nhất từ nguồn sang đích    <span class="cm">// 1 lần</span></div><div>    Hanoi(n - 1, trung gian, nguồn, đích)   <span class="cm">// đặt n − 1 đĩa lên</span></div></div>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Lời giải đệ quy rất gọn. Nếu chỉ có một đĩa, chuyển thẳng nó sang đích. Ngược lại, chuyển n trừ 1 đĩa phía trên sang cọc trung gian. Rồi chuyển đĩa lớn nhất sang đích, đúng một lần. Cuối cùng chuyển n trừ 1 đĩa từ cọc trung gian đặt lên trên đĩa lớn."
      - show: |
          <div class="box ok">$$T(1) = 1, \qquad T(n) = 2\,T(n - 1) + 1 \quad (n \ge 2)$$</div>
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>$T(n)$</td><td>1</td><td>$2 \cdot 1 + 1 = 3$</td><td>$2 \cdot 3 + 1 = 7$</td><td>$2 \cdot 7 + 1 = 15$</td></tr></table>
        focus: [1, 1, 2]
        say: "Đếm theo đoạn mã, hai lời gọi với n trừ 1 đĩa và một lần chuyển, nên T của n bằng 2 nhân T của n trừ 1, cộng 1. Điều kiện đầu là T của 1 bằng 1. Tính dần bằng tay, ta được 1, 3, 7, 15, có vẻ là 2 mũ n trừ 1, và ta sẽ chứng minh điều đó."

  - id: tree
    kind: intuition
    title: "Hình dung: cây các lời gọi, mỗi tầng gấp đôi"
    checks:
      - "1 + 2 + 4 == 7 == (lambda T: T(T, 3))(lambda f, n: 1 if n == 1 else 2 * f(f, n - 1) + 1)"
      - "len((lambda h: h(h, 3, 'A', 'B', 'C'))(lambda f, n, a, b, c: [] if n == 0 else f(f, n - 1, a, c, b) + [(a, c)] + f(f, n - 1, b, a, c))) == 7"
    steps:
      - show: |
          <svg width="1440" height="430" viewBox="0 0 1440 430"><line x1="650" y1="98" x2="350" y2="162" stroke="#6b7280" stroke-width="3"/><line x1="650" y1="98" x2="950" y2="162" stroke="#6b7280" stroke-width="3"/><line x1="350" y1="218" x2="200" y2="282" stroke="#6b7280" stroke-width="3"/><line x1="350" y1="218" x2="500" y2="282" stroke="#6b7280" stroke-width="3"/><line x1="950" y1="218" x2="800" y2="282" stroke="#6b7280" stroke-width="3"/><line x1="950" y1="218" x2="1100" y2="282" stroke="#6b7280" stroke-width="3"/><rect x="555" y="42" width="190" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="650" y="79" font-size="26" text-anchor="middle" fill="#1f2937">H(3): 1 lần</text><rect x="255" y="162" width="190" height="56" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="350" y="199" font-size="26" text-anchor="middle" fill="#1f2937">H(2): 1 lần</text><rect x="855" y="162" width="190" height="56" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="950" y="199" font-size="26" text-anchor="middle" fill="#1f2937">H(2): 1 lần</text><rect x="105" y="282" width="190" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="200" y="319" font-size="26" text-anchor="middle" fill="#1f2937">H(1): 1 lần</text><rect x="405" y="282" width="190" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="500" y="319" font-size="26" text-anchor="middle" fill="#1f2937">H(1): 1 lần</text><rect x="705" y="282" width="190" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="800" y="319" font-size="26" text-anchor="middle" fill="#1f2937">H(1): 1 lần</text><rect x="1005" y="282" width="190" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="1100" y="319" font-size="26" text-anchor="middle" fill="#1f2937">H(1): 1 lần</text><g font-size="26" fill="#1f2937"><text x="1250" y="30" fill="#6b7280">chuyển ở tầng</text><text x="1250" y="79">1 lần</text><text x="1250" y="199">2 lần</text><text x="1250" y="319">4 lần</text></g><text x="650" y="410" font-size="26" text-anchor="middle" fill="#1f2937">mỗi lời gọi tự chuyển đúng 1 đĩa; cộng lại 1 + 2 + 4 = 7 lần = T(3)</text></svg>
        focus: [0, 0, 0, 0]
        say: "Vẽ các lời gọi khi n bằng 3 thành một cây, ta thấy hệ thức sinh ra từ đâu. Lời gọi với 3 đĩa tự chuyển đúng một đĩa, là đĩa lớn nhất, và gọi hai lời gọi với 2 đĩa. Mỗi lời gọi với 2 đĩa lại tự chuyển một đĩa và gọi hai lời gọi với 1 đĩa, nên số lời gọi gấp đôi sau mỗi tầng. Cộng số lần chuyển của ba tầng, 1 cộng 2 cộng 4 bằng 7, đúng bằng T của 3, và đây chính là tổng lũy thừa của 2 vừa ôn."

  # ───────────────────────── 5. THẾ NGƯỢC ─────────────────────────
  - id: backsub
    kind: formula
    title: "Thế ngược: thay T của số nhỏ hơn vào, từng bước"
    checks:
      - "(lambda T: all(T(T, n) == 2**i * T(T, n - i) + 2**i - 1 for n in range(2, 16) for i in range(0, n)))(lambda f, n: 1 if n == 1 else 2 * f(f, n - 1) + 1)"
      - "(lambda T: all(T(T, n) == 4 * T(T, n - 2) + 2 + 1 for n in range(3, 15)))(lambda f, n: 1 if n == 1 else 2 * f(f, n - 1) + 1)"
      - "(lambda n: sp.expand(2**(n - 1) * 1 + 2**(n - 1) - 1 - (2**n - 1)))(sp.Symbol('n', positive=True)) == 0"
    steps:
      - show: |
          $$\begin{aligned} T(n) &= 2\,T(n-1) + 1 \\ &= 2\big[2\,T(n-2) + 1\big] + 1 = 2^2\,T(n-2) + 2 + 1 \\ &= 2^3\,T(n-3) + 2^2 + 2 + 1 \end{aligned}$$
        focus: [0, 1, 1, 1]
        say: "Thế ngược nghĩa là thay T của số nhỏ hơn bằng chính hệ thức của nó. Theo hệ thức, thay n bằng n trừ 1, ta có T của n trừ 1 bằng 2 nhân T của n trừ 2, cộng 1. Thay vào, rồi nhân phá ngoặc, nhớ nhân 2 cho cả số 1 trong ngoặc, được 2 mũ 2 nhân T của n trừ 2, cộng 2, cộng 1. Thế thêm một lần nữa, ta được 2 mũ 3 nhân T của n trừ 3, cộng 4, cộng 2, cộng 1."
      - show: |
          <div class="box key">Sau $i$ bước: $\ T(n) = 2^i\,T(n - i) + \big(2^{i-1} + \dots + 2 + 1\big) = 2^i\,T(n - i) + 2^i - 1$</div>
          <p class="note">Phần trong ngoặc là tổng lũy thừa của 2 vừa ôn. Thử $i = 3$: $\ 4 + 2 + 1 = 7 = 2^3 - 1$ ✓</p>
        focus: [1, 2]
        say: "Nhìn quy luật, sau i bước ta có 2 mũ i nhân T của n trừ i, cộng tổng từ 2 mũ i trừ 1 xuống tới 1. Theo công thức vừa ôn, tổng đó bằng 2 mũ i trừ 1, thử với i bằng 3 được 7, khớp dòng cuối vừa rồi."
      - show: |
          <p><b>Dừng</b> khi gặp điều kiện đầu: $\ n - i = 1 \iff i = n - 1$. &nbsp; Thay vào:</p>
          $$T(n) = 2^{n-1}\,T(1) + 2^{n-1} - 1 = 2^{n-1} + 2^{n-1} - 1 = \hlg{2^n - 1} \in \Theta(2^n)$$
        focus: [1, 2, 2]
        say: "Ta dừng khi chạm điều kiện đầu, tức n trừ i bằng 1, nghĩa là i bằng n trừ 1. Thay i bằng n trừ 1 và T của 1 bằng 1, hai lần 2 mũ của n trừ 1 gộp lại thành 2 mũ n. Vậy T của n bằng 2 mũ n trừ 1, thuộc Theta của 2 mũ n."

  # ───────────────────────── 6. VÍ DỤ SỐ ─────────────────────────
  - id: numeric
    kind: example
    title: "Làm thử với n bằng 4"
    checks:
      - "2**3 * 1 + 2**3 - 1 == 15 and 2**4 - 1 == 15"
      - "(lambda T: [T(T, 4), 2 * T(T, 3) + 1, 4 * T(T, 2) + 2 + 1, 8 * T(T, 1) + 4 + 2 + 1] == [15] * 4)(lambda f, n: 1 if n == 1 else 2 * f(f, n - 1) + 1)"
      - "4 + 2 + 1 == 7 and 8 * 1 + 7 == 15 and 4 - 3 == 1"
    steps:
      - show: |
          <p><b>Bước 1</b>, thế ngược với $n = 4$, mỗi hàng thay $T$ của số nhỏ hơn bằng hệ thức của nó:</p>
          <table class="t"><tr><th>$i$</th><th>$T(4) =$</th></tr>
          <tr><td>1</td><td>$2\,T(3) + 1$</td></tr>
          <tr><td>2</td><td>$2^2\,T(2) + 2 + 1$</td></tr>
          <tr><td>3</td><td>$2^3\,T(1) + 2^2 + 2 + 1$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước một, thế ngược với n bằng 4, mỗi hàng thay T của số nhỏ hơn bằng chính hệ thức của nó. Hàng đầu là 2 nhân T của 3, cộng 1. Thay T của 3 bằng 2 nhân T của 2 cộng 1, rồi phá ngoặc, được 4 nhân T của 2, cộng 2, cộng 1. Thay tiếp T của 2, được 8 nhân T của 1, cộng 4, cộng 2, cộng 1."
      - show: |
          <p><b>Bước 2</b>: hàng $i = 3$ đã chạm điều kiện đầu $T(1) = 1$, vì $4 - 3 = 1$:</p>
          $$T(4) = 2^3 \cdot 1 + (4 + 2 + 1) = 8 + 7 = \hlg{15}$$
        focus: [1, 2]
        say: "Bước hai, hàng i bằng 3 đã chạm điều kiện đầu, vì 4 trừ 3 bằng 1, nên thay T của 1 bằng 1. Ta được 8 nhân 1, cộng 4 cộng 2 cộng 1, tức 8 cộng 7, bằng 15."
      - show: |
          <p>$n = 4$: dừng ở $i = 3$: $\ T(4) = 2^3\,T(1) + 2^3 - 1 = 8 + 7 = \hlg{15}$</p>
          <p>Bảng tính dần: $T(4) = 15$ ✓ &nbsp; Công thức: $2^4 - 1 = 15$ ✓</p>
        focus: [1, 2]
        say: "Bước ba, so với công thức tổng quát, với n bằng 4 ta dừng ở i bằng 3, được 8 nhân T của 1, cộng 7, bằng 15. Kết quả khớp với bảng tính dần và với công thức 2 mũ 4 trừ 1."

  # ───────────────────────── 7. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: thay đáp số ngược vào hệ thức"
    checks:
      - "(lambda n: sp.expand(2 * (2**(n - 1) - 1) + 1 - (2**n - 1)))(sp.Symbol('n', positive=True)) == 0 and 2**1 - 1 == 1"
      - "[len((lambda h: h(h, m, 'A', 'B', 'C'))(lambda f, n, a, b, c: [] if n == 0 else f(f, n - 1, a, c, b) + [(a, c)] + f(f, n - 1, b, a, c))) for m in range(1, 6)] == [1, 3, 7, 15, 31] == [2**m - 1 for m in range(1, 6)]"
      - "all((lambda moves: (lambda st: all((lambda d: (st[b].append(d) or True) if not st[b] or st[b][-1] > d else False)(st[a].pop()) for a, b in moves))({'A': list(range(m, 0, -1)), 'B': [], 'C': []}))((lambda h: h(h, m, 'A', 'B', 'C'))(lambda f, n, a, b, c: [] if n == 0 else f(f, n - 1, a, c, b) + [(a, c)] + f(f, n - 1, b, a, c))) for m in range(1, 8))"
    steps:
      - show: |
          <p><b>Phép thử</b>: đáp số phải thoả <b>cả</b> điều kiện đầu <b>và</b> hệ thức.</p>
          <p>$T(1) = 2^1 - 1 = 1$ ✓ &nbsp;&nbsp; $2\,T(n-1) + 1 = 2\,(2^{n-1} - 1) + 1 = 2^n - 2 + 1 = 2^n - 1$ ✓</p>
        focus: [1, 2, 2]
        say: "Phép thử chắc chắn nhất là thay đáp số ngược vào, nó phải thoả cả điều kiện đầu lẫn hệ thức. Với n bằng 1 ta được 1, đúng. Thay vào vế phải của hệ thức, 2 nhân với hiệu 2 mũ của n trừ 1, trừ 1, rồi cộng 1, ra đúng 2 mũ n trừ 1, nên đáp số đúng."
      - show: |
          <p><b>Phép thử 2</b>, không dùng hệ thức: cho máy <b>chạy thật</b> lời giải đệ quy và đếm từng lần chuyển đĩa.</p>
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>số lần chuyển đếm được</td><td>1</td><td>3</td><td>7</td><td>15</td><td>31</td></tr>
          <tr><td>$2^n - 1$</td><td>1</td><td>3</td><td>7</td><td>15</td><td>31 ✓</td></tr></table>
          <p class="note">Máy cũng kiểm mọi bước chuyển đều hợp lệ: không lần nào đặt đĩa lớn lên đĩa nhỏ.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Phép thử thứ hai đi đường khác hẳn, không dùng hệ thức mà cho máy chạy thật lời giải đệ quy rồi đếm từng lần chuyển đĩa. Với n từ 1 đến 5, số lần đếm được là 1, 3, 7, 15, 31. Hàng dưới tính bằng công thức 2 mũ n trừ 1, khớp từng cột. Máy cũng kiểm rằng không lần chuyển nào đặt đĩa lớn lên đĩa nhỏ, nên lời giải đúng luật."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "2**(3 - 1) + 3 - 1 == 6 != 7"
      - "(lambda H, T: (H(H, 8), T(T, 8)) == (15, 255))(lambda f, n: 1 if n == 1 else 2 * f(f, n // 2) + 1, lambda f, n: 1 if n == 1 else 2 * f(f, n - 1) + 1)"
      - "2**3 + 2**2 + 2 + 1 == 15 != 2**3 - 1"
      - "(lambda H, T: [H(H, m) for m in (2, 4, 8)] == [3, 7, 15] and [T(T, m) for m in (2, 4, 8)] == [3, 15, 255])(lambda f, n: 1 if n == 1 else 2 * f(f, n // 2) + 1, lambda f, n: 1 if n == 1 else 2 * f(f, n - 1) + 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thế tới $i = n$ rồi dùng $T(0)$ mà đề không cho <b class="red">(sai)</b>
          <br><span class="note">Điểm dừng phải là điều kiện đầu <b>đã cho</b>: $n - i = 1$. Ở bài này $T(0) = 0$ tình cờ cho cùng đáp số, nhưng muốn dùng thì phải tự chứng minh $T(0)$ — ở bài khác có thể sai hẳn.</span></div>
        say: "Lỗi thứ nhất, thế tới i bằng n rồi dùng T của 0, trong khi đề không cho. Điểm dừng phải là điều kiện đầu đã cho, tức n trừ i bằng 1. Ở bài này, T của 0 bằng 0 tình cờ cho cùng đáp số, nhưng muốn dùng thì phải tự chứng minh, và ở bài khác có thể sai hẳn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên nhân 2 cho số 1 trong ngoặc: $2[2T(n-2) + 1] + 1 = 2^2 T(n-2) + 1 + 1$ <b class="red">(sai)</b>
          <br><span class="note">Kéo tới cuối được $2^{n-1} + n - 1$: với $n = 3$ ra 6, trong khi bảng cho 7. Phép thử: thay $n$ nhỏ.</span></div>
        say: "Lỗi thứ hai, khi phá ngoặc quên nhân 2 cho số 1 bên trong. Làm tiếp tới cuối sẽ ra 2 mũ của n trừ 1, rồi cộng thêm n trừ 1, với n bằng 3 cho 4 cộng 2, bằng 6, trong khi bảng tính tay cho 7. Phép thử thay n nhỏ bắt được ngay."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lệch cận của tổng: viết $2^{i} + \dots + 1$ thay vì $2^{i-1} + \dots + 1$ <b class="red">(sai)</b>
          <br><span class="note">$i = 3$: $\ 8 + 4 + 2 + 1 = 15 \ne 7$. Phép thử: đếm số hạng — sau $i$ bước có đúng $i$ số hạng.</span></div>
        say: "Lỗi thứ ba, lệch cận của tổng, viết từ 2 mũ i thay vì 2 mũ i trừ 1. Với i bằng 3, tổng sai bằng 15 thay vì 7. Phép thử là đếm số hạng, sau i bước có đúng i số hạng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhầm $T(n - 1)$ với $T(n/2)$ <b class="red">(sai)</b>
          <br><span class="note">$T(n) = 2T(n/2) + 1$ chỉ cho $2n - 1$, còn $T(n) = 2T(n-1) + 1$ cho $2^n - 1$. Giảm 1 và chia đôi khác nhau một trời một vực.</span></div>
          <table class="t"><tr><th>$n$</th><th>2</th><th>4</th><th>8</th></tr>
          <tr><td>$2T(n/2) + 1$</td><td>3</td><td>7</td><td>15</td></tr>
          <tr><td>$2T(n-1) + 1$</td><td>3</td><td>15</td><td>255</td></tr></table>
        focus: [1, ["2.2", "2.3"], 0]
        say: "Lỗi thứ tư, nhầm T của n trừ 1 với T của n chia 2. Hệ thức chia đôi chỉ cho 2n trừ 1, với n bằng 8 là 15, còn hệ thức giảm 1 cho 2 mũ n trừ 1, với n bằng 8 là 255. Giảm đi 1 và chia đôi khác nhau một trời một vực."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda Q: [Q(Q, n) for n in range(1, 6)] == [n*(n + 1)//2 + 1 for n in range(1, 6)] == [2, 4, 7, 11, 16])(lambda f, n: 2 if n == 1 else f(f, n - 1) + n)"
      - "(lambda n: sp.expand(2 + sp.summation(sp.Symbol('k'), (sp.Symbol('k'), 2, n)) - (n*(n + 1)/2 + 1)))(sp.Symbol('n', positive=True)) == 0"
      - "(lambda Q: Q(Q, 5) == Q(Q, 3) + 4 + 5 == 7 + 9 == 16)(lambda f, n: 2 if n == 1 else f(f, n - 1) + n)"
    steps:
      - show: |
          <p>Giải bằng thế ngược:</p>
          $$T(1) = 2, \qquad T(n) = T(n - 1) + n \quad (n \ge 2)$$
          <p class="note">Gợi ý: viết quy luật sau $i$ bước, dừng ở $n - i = 1$, rồi dùng tổng $1 + 2 + \dots + n = \frac{n(n+1)}{2}$ của bài 0.</p>
        focus: [[1, 2], 3, 0]
        say: "Đến lượt bạn, hãy giải bằng thế ngược hệ thức T của 1 bằng 2, và T của n bằng T của n trừ 1, cộng n. Gợi ý, viết quy luật sau i bước, dừng ở n trừ i bằng 1, rồi dùng tổng từ 1 đến n của bài 0. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b>, thế ngược hai lần rồi nhìn quy luật:</p>
          $$\begin{aligned} T(n) &= T(n-1) + n \\ &= T(n-2) + (n-1) + n \\ &= T(n - i) + (n - i + 1) + \dots + n \end{aligned}$$
          <p class="note">Thử $n = 5$, $i = 2$: $\ T(5) = T(3) + 4 + 5 = 7 + 9 = 16$ ✓ (tính dần: 2, 4, 7, 11, 16)</p>
        focus: [1, 2, 2, 3]
        say: "Bước một, thế ngược. Thay T của n trừ 1 bằng T của n trừ 2 cộng n trừ 1, ta được T của n trừ 2, cộng n trừ 1, cộng n. Sau i bước ta có T của n trừ i, cộng các số từ n trừ i cộng 1 đến n. Thử với n bằng 5 và i bằng 2, ta có T của 3 cộng 4 cộng 5, bằng 7 cộng 9, bằng 16, đúng như tính dần."
      - show: |
          <p><b>Bước 2</b>, dừng ở $i = n - 1$ (vì $T(1)$ đã cho):</p>
          <p>$T(n) = T(1) + (2 + 3 + \dots + n) = 2 + \dfrac{n(n+1)}{2} - 1 = \hlg{\dfrac{n(n+1)}{2} + 1} \in \Theta(n^2)$</p>
          <p>Thử $n = 3$: $T(2) = 4$, $T(3) = 7$; công thức $6 + 1 = 7$ ✓</p>
        focus: [1, 2, 2, 2, 3]
        say: "Bước hai, thế ngược tới khi chạm điều kiện đầu. Dừng ở i bằng n trừ 1, được T của 1 cộng tổng từ 2 đến n. Theo tổng của bài 0, tổng từ 2 đến n bằng n nhân n cộng 1 chia 2, trừ 1. Nên kết quả là n nhân n cộng 1 chia 2, cộng 1, thuộc Theta của n bình phương. Thử với n bằng 3, cả hai cách đều ra 7."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đọc mã đệ quy → hệ thức + điều kiện đầu</span><span class="a">→</span>
          <span class="n">thế ngược 2–3 bước</span><span class="a">→</span>
          <span class="n">quy luật sau $i$ bước</span><span class="a">→</span>
          <span class="n">dừng ở điều kiện đầu đã cho</span><span class="a">→</span>
          <span class="n">thay đáp số ngược vào để kiểm</span></div>
        say: "Tổng kết chuỗi logic. Đọc mã đệ quy để viết hệ thức kèm điều kiện đầu. Thế ngược hai, ba bước để thấy quy luật sau i bước. Dừng đúng ở điều kiện đầu đã cho. Cuối cùng thay đáp số ngược vào hệ thức để kiểm."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi lần thế, phá ngoặc <b>cẩn thận từng số hạng</b>, và luôn kiểm quy luật bằng $n$ nhỏ trước khi tổng quát.</div>
        say: "Điều cần mang theo, mỗi lần thế hãy phá ngoặc cẩn thận từng số hạng, và luôn kiểm quy luật bằng n nhỏ trước khi viết dạng tổng quát."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>hàm sinh</b> — giải cùng hệ thức Tháp Hà Nội bằng cách gói cả dãy số vào một biểu thức đại số, không cần đoán quy luật.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học hàm sinh, giải lại chính hệ thức Tháp Hà Nội bằng cách gói cả dãy số vào một biểu thức đại số, không cần đoán quy luật. Hẹn gặp bạn ở bài tiếp theo."
