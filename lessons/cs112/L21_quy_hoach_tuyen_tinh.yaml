assumes: [cdot, sub, implies]
# Quy ước: biến quyết định x₁, x₂ (số mẻ bánh loại 1, loại 2); hàm mục tiêu z = 15x₁ + 10x₂ (đơn vị tiền lãi, không gắn tên tiền
#   cụ thể); ràng buộc viết dạng “≤”; “miền chấp nhận được” = mọi điểm thoả hết ràng buộc; đỉnh = giao của hai đường biên.
# Sửa bản thảo (AUDIT_CS112 §2, C27b): thiếu điều kiện không âm thì MIỀN vô hạn, nhưng với z = 15x₁ + 10x₂ giá trị lớn nhất
#   vẫn là 280 (chứng chỉ 5·24 + 5·32); minh hoạ “mất chặn” bằng hàm mục tiêu khác (10x₁ + 20x₂).
# Nối bài trước (luật 17): bài 16 — tham lam, chọn theo đơn giá; bài 0 — đếm, so sánh; bài 1 — giới hạn khi n → ∞
#   (ở đây: “không bị chặn” = lớn mãi không dừng).
objectives:
  - "Mô tả mô hình quy hoạch tuyến tính: biến quyết định, hàm mục tiêu, ràng buộc"
  - "Nhìn miền chấp nhận được trên hình và tìm các đỉnh bằng cách giải hệ hai phương trình"
  - "Tìm nghiệm tối ưu bằng cách thử các đỉnh và kiểm bằng một chứng chỉ chặn trên"
  - "Nhận ra các trường hợp đặc biệt: vô số nghiệm, không bị chặn, quên điều kiện không âm"
  - "Đếm số giao điểm phải thử khi số biến tăng từ 2 tới 30 và nêu giới hạn của cách thử mọi đỉnh"
  - "Viết chương trình thử mọi cặp đường biên, tìm đỉnh tối ưu và dựng chứng chỉ chặn trên"
asr_reviewed:
  - {sentence: "Giữ các đỉnh hợp lệ, tính z, tìm đỉnh tối ưu.", reason: "ASR chép “giữ các định hợp lệ, tính giác, tìm định tối yêu.” (0.727): lệch âm/thanh thuần Việt: đỉnh/định, đỉnh/định, ưu/yêu — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đi kèm ba ràng buộc, về bột, về đường, và số mẻ không âm.", reason: "ràng buộc/tràng bụt, bột/bộ: nhầm âm đầu, âm cuối của ASR"}
  - {sentence: "Còn bỏ điều kiện đó, cho x một âm dần, z sẽ lớn mãi không dừng, và bài toán không có nghiệm tối ưu.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Xưởng bánh với bột và đường có hạn"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>bánh loại 1</th><th>bánh loại 2</th><th>có sẵn</th></tr>
          <tr><td>bột (kg / mẻ)</td><td>1</td><td>1</td><td>24</td></tr>
          <tr><td>đường (kg / mẻ)</td><td>2</td><td>1</td><td>32</td></tr>
          <tr><td>lãi (một mẻ)</td><td>15</td><td>10</td><td></td></tr></table>
          <p>Làm bao nhiêu mẻ mỗi loại để <b>lãi nhiều nhất</b>?</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Chào bạn, một xưởng làm hai loại bánh. Mỗi mẻ bánh loại 1 cần 1 ki-lô-gam bột, mỗi mẻ loại 2 cũng cần 1, và xưởng chỉ có 24. Về đường, mẻ loại 1 cần 2, mẻ loại 2 cần 1, xưởng có 32. Mỗi mẻ loại 1 lãi 15, loại 2 lãi 10, vậy làm bao nhiêu mẻ mỗi loại để lãi nhiều nhất?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: thay số kiểm bất đẳng thức và giải hệ hai phương trình"
    checks:
      - "10 + 10 == 20 <= 24 and 2*10 + 10 == 30 <= 32 and 12 + 12 <= 24 and 2*12 + 12 == 36 > 32"
      - "(lambda x, y: sp.solve([x + y - 5, 2*x + y - 7], [x, y]) == {x: 2, y: 3})(*sp.symbols('x y')) and 7 - 5 == 2 and 5 - 2 == 3 and 2*2 + 3 == 7"
      - "all(a + b == 24 for a, b in ((24, 0), (0, 24))) and 0 + 0 <= 24 and 16 + 0 <= 24 and 2*16 + 0 == 32"
    steps:
      - show: |
          <table class="t"><tr><th>làm thử</th><th>bột cần (có 24)</th><th>đường cần (có 32)</th><th>làm được?</th></tr>
          <tr><td>10 mẻ mỗi loại</td><td>$10 + 10 = 20 \le 24$ ✓</td><td>$2 \cdot 10 + 10 = 30 \le 32$ ✓</td><td>được</td></tr>
          <tr><td>12 mẻ mỗi loại</td><td>$12 + 12 = 24 \le 24$ ✓</td><td>$2 \cdot 12 + 12 = 36 > 32$ <b class="red">vượt</b></td><td>không</td></tr></table>
        introduces: [geq]
        focus: [0, 1, 1, "1.2", "1.3"]
        say: "Trước hết, ôn hai phép tính sẽ dùng suốt bài này. Thứ nhất, muốn biết một phương án có làm được không, ta thay số vào từng giới hạn rồi so sánh. Dấu nhỏ hơn hoặc bằng ở đây đọc là không vượt quá. Làm 10 mẻ mỗi loại thì cần 20 ki-lô-gam bột và 30 ki-lô-gam đường, cả hai đều không vượt mức có sẵn, nên làm được. Làm 12 mẻ mỗi loại thì vừa đúng hết 24 ki-lô-gam bột, nhưng cần 36 ki-lô-gam đường, vượt 32, nên không làm được."
      - show: |
          $$\begin{cases} x + y = 5 \\ 2x + y = 7 \end{cases}$$
          <p>Lấy dòng dưới trừ dòng trên, $y$ bị khử: $\ (2x + y) - (x + y) = 7 - 5 \implies x = 2$, rồi $y = 5 - 2 = 3$.</p>
          <p class="note">Làm thử vào dòng dưới: $2 \cdot 2 + 3 = 7$ ✓</p>
        focus: [0, 1, 2, 2, 3]
        say: "Thứ hai, giải hệ hai phương trình bậc nhất bằng cách trừ vế theo vế. Ví dụ x cộng y bằng 5, và 2 x cộng y bằng 7. Lấy phương trình dưới trừ phương trình trên, chữ y bị khử, còn lại x bằng 2. Thay vào phương trình đầu, y bằng 5 trừ 2, bằng 3. Làm thử vào phương trình dưới, 2 nhân 2 cộng 3 bằng 7, đúng như đề."
      - clear: true
        show: |
          <p><b>Mặt phẳng toạ độ</b>: hai trục vuông góc, trục ngang là trục $x_1$, trục đứng là trục $x_2$. Điểm $(a, b)$: đi $a$ theo trục ngang, rồi $b$ theo trục đứng. Điểm $(16, 0)$ không đi lên nên nằm ngay trên trục ngang; điểm $(0, 24)$ nằm trên trục đứng.</p>
          <p>Phương trình $x_1 + x_2 = 24$ là một <b>đường thẳng</b>: nó đi qua $(24, 0)$ và $(0, 24)$. Bất đẳng thức $x_1 + x_2 \le 24$ giữ <b>một nửa mặt phẳng</b> bên đường đó, nửa chứa gốc $(0, 0)$ vì $0 + 0 \le 24$.</p>
        introduces: [cs112_toa_do]
        focus: [1, 1, 1, 1, 1, 2, 2, 2]
        say: "Thứ ba, mặt phẳng toạ độ. Hai trục vuông góc, trục ngang là trục x một, trục đứng là trục x hai. Một điểm ghi bằng cặp a, b nghĩa là đi a đơn vị theo trục ngang rồi b đơn vị theo trục đứng. Điểm có a bằng 16 và b bằng 0 không đi lên, nên nằm ngay trên trục ngang. Điểm có a bằng 0 và b bằng 24 nằm trên trục đứng. Phương trình x một cộng x hai bằng 24 là một đường thẳng. Nó đi qua điểm có a bằng 24 và b bằng 0, và điểm có a bằng 0 và b bằng 24. Bất đẳng thức tương ứng giữ lại một nửa mặt phẳng, nửa chứa gốc, vì 0 cộng 0 không vượt quá 24."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: biến quyết định, hàm mục tiêu, ràng buộc"
    steps:
      - show: |
          <p>$x_1, x_2$: số mẻ bánh loại 1, loại 2 (<b>biến quyết định</b>).</p>
          $$\max\ z = 15x_1 + 10x_2 \quad \text{với} \quad \begin{cases} x_1 + x_2 \le 24 & \text{(bột)} \\ 2x_1 + x_2 \le 32 & \text{(đường)} \\ x_1 \ge 0,\ x_2 \ge 0 & \text{(không âm)} \end{cases}$$
          <p class="note">“Tuyến tính”: mục tiêu và ràng buộc đều là tổng các biến nhân hằng số — không có $x_1^2$, $x_1 x_2$.</p>
        introduces: [max_fn]
        focus: [1, 2, 2, 3]
        say: "Gọi x một, x hai là số mẻ bánh loại 1 và loại 2, gọi là các biến quyết định. Ta cần làm cho z bằng 15 x một cộng 10 x hai lớn nhất, gọi là hàm mục tiêu. Đi kèm ba ràng buộc, về bột, về đường, và số mẻ không âm. Chữ tuyến tính nghĩa là mọi biểu thức đều là tổng các biến nhân hằng số, không có bình phương hay tích hai biến."

  # ───────────────────────── 3. MIỀN CHẤP NHẬN ─────────────────────────
  - id: region
    kind: intuition
    title: "Vẽ miền chấp nhận được"
    checks:
      - "(lambda x, y: sp.solve([x + y - 24, 2*x + y - 32], [x, y]) == {x: 8, y: 16})(*sp.symbols('x y'))"
      - "all(a + b <= 24 and 2*a + b <= 32 and a >= 0 and b >= 0 for a, b in ((0, 0), (16, 0), (8, 16), (0, 24)))"
    steps:
      - show: |
          <div class="row"><div><svg style="overflow:visible" width="460" height="450" viewBox="0 0 460 450"><line x1="70" y1="410" x2="406" y2="410" stroke="#6b7280" stroke-width="3"/><line x1="70" y1="410" x2="70" y2="14" stroke="#6b7280" stroke-width="3"/><text x="412" y="418" font-size="24" fill="#6b7280">x₁</text><text x="56" y="6" font-size="24" fill="#6b7280">x₂</text><polygon points="70,410 262,410 166,218 70,122" fill="#dbeafe" stroke="none"/><line x1="70" y1="122" x2="358" y2="410" stroke="#2563eb" stroke-width="4"/><text x="226" y="254" font-size="22" fill="#2563eb">x₁ + x₂ = 24</text><line x1="70" y1="26" x2="262" y2="410" stroke="#059669" stroke-width="4"/><text x="184.0" y="134" font-size="22" fill="#059669">2x₁ + x₂ = 32</text><circle cx="70" cy="410" r="7" fill="#1f2937"/><text x="44" y="436" font-size="22" fill="#1f2937" font-weight="700">O</text><circle cx="262" cy="410" r="7" fill="#1f2937"/><text x="252" y="438" font-size="22" fill="#1f2937" font-weight="700">A(16, 0)</text><circle cx="166" cy="218" r="7" fill="#1f2937"/><text x="176" y="212" font-size="22" fill="#1f2937" font-weight="700">B(8, 16)</text><circle cx="70" cy="122" r="7" fill="#1f2937"/><text x="78" y="114" font-size="22" fill="#1f2937" font-weight="700" stroke="#fff7e6" stroke-width="6" paint-order="stroke">C(0, 24)</text></svg></div>
          <div class="col"><p>Mỗi ràng buộc giữ lại một <b>nửa mặt phẳng</b>: bột, đường — phía dưới đường biên; không âm — phía phải trục $x_2$, phía trên trục $x_1$.</p>
          <p>Miền chấp nhận được (tô xanh) là tứ giác $OABC$.</p>
          <p>Đỉnh $B$: giao hai đường, trừ hai phương trình: $\ (2x_1 + x_2) - (x_1 + x_2) = 32 - 24 \Rightarrow x_1 = 8$, rồi $x_2 = 16$.</p></div></div>
        focus: ["1.2", "1.2", "1.2", "1.2"]
        say: "Mỗi ràng buộc giữ lại một nửa mặt phẳng, giới hạn bột và giới hạn đường giữ phần nằm dưới đường biên, đường xanh dương là bột, đường xanh lá là đường. Còn hai điều kiện không âm giữ phần bên phải trục đứng và phía trên trục ngang. Phần chung của tất cả, tô xanh nhạt, là tứ giác O A B C, gọi là miền chấp nhận được. Đỉnh B là giao hai đường biên, theo quy tắc chuyển vế, trừ hai phương trình cho nhau được x một bằng 8, rồi x hai bằng 16."

  # ───────────────────────── 4. ĐỊNH LÝ ĐỈNH ─────────────────────────
  - id: vertex
    kind: formula
    title: "Vì sao nghiệm tốt nhất nằm ở một đỉnh"
    steps:
      - show: |
          <div class="row"><div><svg style="overflow:visible" width="460" height="450" viewBox="0 0 460 450"><line x1="70" y1="410" x2="406" y2="410" stroke="#6b7280" stroke-width="3"/><line x1="70" y1="410" x2="70" y2="14" stroke="#6b7280" stroke-width="3"/><text x="412" y="418" font-size="24" fill="#6b7280">x₁</text><text x="56" y="6" font-size="24" fill="#6b7280">x₂</text><polygon points="70,410 262,410 166,218 70,122" fill="#dbeafe" stroke="none"/><line x1="70" y1="122" x2="358" y2="410" stroke="#2563eb" stroke-width="4"/><text x="226" y="254" font-size="22" fill="#2563eb">x₁ + x₂ = 24</text><line x1="70" y1="26" x2="262" y2="410" stroke="#059669" stroke-width="4"/><text x="184.0" y="134" font-size="22" fill="#059669">2x₁ + x₂ = 32</text><line x1="70" y1="74" x2="294" y2="410" stroke="#d97706" stroke-width="3" stroke-dasharray="10 7"/><text x="244.0" y="308.0" font-size="20" fill="#d97706" stroke="#fff7e6" stroke-width="6" paint-order="stroke">z = 280</text><circle cx="70" cy="410" r="7" fill="#1f2937"/><text x="44" y="436" font-size="22" fill="#1f2937" font-weight="700">O</text><circle cx="262" cy="410" r="7" fill="#1f2937"/><text x="252" y="438" font-size="22" fill="#1f2937" font-weight="700">A(16, 0)</text><circle cx="166" cy="218" r="7" fill="#e11d48"/><text x="176" y="212" font-size="22" fill="#e11d48" font-weight="700">B(8, 16)</text><circle cx="70" cy="122" r="7" fill="#1f2937"/><text x="78" y="114" font-size="22" fill="#1f2937" font-weight="700" stroke="#fff7e6" stroke-width="6" paint-order="stroke">C(0, 24)</text></svg></div>
          <div class="col"><p>Các điểm có cùng giá trị $z$ nằm trên một <b>đường thẳng</b> $15x_1 + 10x_2 = z$, gọi là <b>đường mức</b>. Tăng $z$ thì đường dịch song song lên trên.</p>
          <p>Dịch tới khi chỉ còn chạm miền ở <b>một điểm cuối cùng</b>: đó là một <b>đỉnh</b> (hoặc cả một cạnh).</p>
          <div class="box key">Nếu bài toán có nghiệm tối ưu và miền có <b>đỉnh</b> (như ở đây, mọi biến không âm), thì có một đỉnh tối ưu → chỉ cần thử các đỉnh.</div></div></div>
        focus: ["1.2", "1.2", "1.2", "1.2"]
        say: "Vì sao chỉ cần xét đỉnh? Các điểm có cùng giá trị z nằm trên một đường thẳng, gọi là đường mức, và khi tăng z thì đường này dịch song song lên trên. Ta dịch cho tới khi nó chỉ còn chạm miền ở điểm cuối cùng, và điểm đó là một đỉnh, hoặc cả một cạnh. Nên nếu bài toán có nghiệm tối ưu và miền có đỉnh, như ở đây khi mọi biến không âm, thì luôn có một đỉnh tối ưu."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Thử bốn đỉnh"
    checks:
      - "[15*a + 10*b for a, b in ((0, 0), (16, 0), (8, 16), (0, 24))] == [0, 240, 280, 240]"
      - "15*0 + 10*0 == 0 and min(24, 32 // 2) == 16 and 15*16 == 240 and 15*8 == 120 and 10*16 == 160 and 120 + 160 == 280 and min(24, 32) == 24 and 10*24 == 240"
    steps:
      - show: |
          <p><b>Bước 1</b> — đỉnh $\text{O}(0, 0)$, không làm mẻ nào:</p>
          $$z = 15 \cdot 0 + 10 \cdot 0 = 0$$
        focus: [1, 2]
        say: "Bước một, đỉnh O là gốc toạ độ, tức là không làm mẻ nào. Thay vào hàm mục tiêu, z bằng 15 nhân 0 cộng 10 nhân 0, bằng 0."
      - show: |
          <p><b>Bước 2</b> — đỉnh $A$ trên trục $x_1$ ($x_2 = 0$): bột cho $x_1 \le 24$, đường cho $2x_1 \le 32$, tức $x_1 \le 16$. Giới hạn chặt hơn là đường, nên $A(16, 0)$.</p>
          $$z = 15 \cdot 16 + 10 \cdot 0 = 240$$
        focus: [1, 1, 1, 2]
        say: "Bước hai, đỉnh A nằm trên trục x một, nghĩa là x hai bằng 0. Bột cho phép tối đa 24 mẻ loại 1, còn đường chỉ cho 2 x một không quá 32, tức tối đa 16 mẻ. Giới hạn chặt hơn là đường, nên A là điểm 16, 0. Thay vào, z bằng 15 nhân 16, bằng 240."
      - show: |
          <p><b>Bước 3</b> — đỉnh $B(8, 16)$, giao của đường bột và đường đường vừa giải ở trên:</p>
          $$z = 15 \cdot 8 + 10 \cdot 16 = 120 + 160 = 280$$
        focus: [1, 2]
        say: "Bước ba, đỉnh B là điểm 8, 16, giao của hai đường biên mà ta đã giải bằng cách trừ hai phương trình. Thay vào, z bằng 15 nhân 8 là 120, cộng 10 nhân 16 là 160, tổng cộng 280."
      - show: |
          <p><b>Bước 4</b> — đỉnh $C$ trên trục $x_2$ ($x_1 = 0$): bột cho $x_2 \le 24$, đường cho $x_2 \le 32$. Chặt hơn là bột, nên $C(0, 24)$.</p>
          $$z = 15 \cdot 0 + 10 \cdot 24 = 240$$
        focus: [1, 1, 2]
        say: "Bước bốn, đỉnh C nằm trên trục x hai, nghĩa là x một bằng 0. Lần này bột cho tối đa 24 mẻ loại 2, đường cho tối đa 32 mẻ, nên giới hạn chặt hơn là bột, và C là điểm 0, 24. Thay vào, z bằng 10 nhân 24, bằng 240."
      - clear: true
        show: |
          <table class="t"><tr><th>đỉnh</th><th>$\text{O}(0, 0)$</th><th>$A(16, 0)$</th><th>$B(8, 16)$</th><th>$C(0, 24)$</th></tr>
          <tr><td>$z = 15x_1 + 10x_2$</td><td>0</td><td>240</td><td>$\hlg{280}$</td><td>240</td></tr></table>
          <div class="box ok">Làm 8 mẻ loại 1, 16 mẻ loại 2: lãi lớn nhất $z = 120 + 160 = 280$.</div>
        focus: [1, 2]
        say: "Bước năm, đặt bốn kết quả cạnh nhau, O cho 0, A cho 240, B cho 280, C cho 240. Vậy làm 8 mẻ loại 1 và 16 mẻ loại 2, lãi lớn nhất là 120 cộng 160, bằng 280."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  # ───────────────────────── 5b. QUY MÔ ─────────────────────────
  - id: scale
    kind: example
    title: "Khi số biến tăng: thử mọi giao điểm không còn nổi"
    checks:
      - "(lambda m: (lambda r: r[0] == 6 and len(r[2]) == 4 and [(int(x), int(y)) for x, y in r[2]] == [(0, 0), (0, 24), (8, 16), (16, 0)] and [(int(x), int(y)) for x, y in r[1] if (x, y) not in r[2]] == [(24, 0), (0, 32)])(m['lp2_vertices']([(1, 1, 24), (2, 1, 32)])))(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
      - "(lambda m: [m['lp_candidates'](n) for n in (2, 10, 20, 30)] == [6, 184756, 137846528820, 118264581564861424])(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
      - "round(184756 * 10 ** 3 / 10 ** 9, 1) == 0.2 and round(137846528820 * 20 ** 3 / 10 ** 9 / 86400) == 13 and round(118264581564861424 * 30 ** 3 / 10 ** 9 / 86400 / 365 / 10 ** 5, 1) == 1.0"
    steps:
      - show: |
          <p>Cách ngây thơ: lấy <b>mọi cặp đường biên</b>, giải hệ, giữ giao điểm thoả mọi ràng buộc. Bài xưởng bánh có 4 đường (bột, đường, $x_1 = 0$, $x_2 = 0$):</p>
          <table class="t"><tr><th>cặp đường</th><th>giao điểm</th><th>thoả mọi ràng buộc?</th></tr>
          <tr><td>$x_1 = 0$ và $x_2 = 0$</td><td>$(0, 0)$</td><td>có (O)</td></tr>
          <tr><td>$x_2 = 0$ và đường</td><td>$(16, 0)$</td><td>có (A)</td></tr>
          <tr><td>bột và đường</td><td>$(8, 16)$</td><td>có (B)</td></tr>
          <tr><td>$x_1 = 0$ và bột</td><td>$(0, 24)$</td><td>có (C)</td></tr>
          <tr><td>$x_2 = 0$ và bột</td><td>$(24, 0)$</td><td>không: đường cần 48 &gt; 32</td></tr>
          <tr><td>$x_1 = 0$ và đường</td><td>$(0, 32)$</td><td>không: bột cần 32 &gt; 24</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.6", "2.7"]
        say: "Cách ngây thơ nhất là lấy mọi cặp đường biên, giải hệ hai phương trình, rồi giữ lại giao điểm thoả mọi ràng buộc. Bài xưởng bánh có 4 đường nên có 6 cặp. Cặp hai trục cho điểm O. Trục ngang với đường cho điểm A. Bột với đường cho điểm B. Trục đứng với bột cho điểm C. Hai cặp còn lại cho giao điểm giả, vì 24, 0 cần 48 ki-lô-gam đường, còn 0, 32 cần 32 ki-lô-gam bột."
      - clear: true
        show: |
          <p>Với $n$ biến và $n$ ràng buộc, có $2n$ đường (kể cả $n$ điều kiện không âm), số cách chọn $n$ đường để giải hệ:</p>
          <table class="t"><tr><th>số biến $n$</th><th>số giao điểm phải thử</th><th>thời gian, mỗi hệ $n^3$ phép tính, $10^{9}$ phép/giây <span class="note">(số minh hoạ)</span></th></tr>
          <tr><td>2</td><td>6</td><td>tức thì</td></tr>
          <tr><td>10</td><td>184 756</td><td>khoảng 0,2 giây</td></tr>
          <tr><td>20</td><td>$1{,}4 \cdot 10^{11}$</td><td>khoảng 13 ngày</td></tr>
          <tr><td>30</td><td>$1{,}2 \cdot 10^{17}$</td><td>khoảng $10^{5}$ năm</td></tr></table>
          <div class="box warn"><b>Giới hạn:</b> thử mọi đỉnh dùng được tới cỡ chục biến, rồi sụp rất nhanh; bài toán thật có hàng nghìn biến. Cần cách đi từng bước từ một đỉnh sang đỉnh tốt hơn thay vì thử hết.</div>
        focus: [1, "2.2", "2.3", "2.4", "2.5", 3]
        say: "Với n biến và n ràng buộc, có 2 n đường kể cả các điều kiện không âm, và ta phải chọn n đường để giải hệ. Với 2 biến chỉ 6 giao điểm. Với 10 biến là 184756 giao điểm, nếu mỗi hệ tốn n mũ 3 phép tính thì khoảng 0 phẩy 2 giây. Với 20 biến, hơn 100 tỉ giao điểm, khoảng 13 ngày. Với 30 biến cần khoảng một trăm nghìn năm. Vậy thử mọi đỉnh chỉ dùng được tới cỡ chục biến, trong khi bài toán thật có hàng nghìn biến, nên cần một cách đi từng bước sang đỉnh tốt hơn."

  - id: verify
    kind: check
    title: "Tự kiểm: một chứng chỉ chặn trên"
    checks:
      - "(lambda x, y: sp.expand(5*(x + y) + 5*(2*x + y) - (15*x + 10*y)))(*sp.symbols('x y')) == 0 and 5*24 + 5*32 == 280"
      - "8 + 16 == 24 and 2*8 + 16 == 32"
      - "(lambda a, b: sp.solve([a + 2*b - 15, a + b - 10], [a, b]) == {a: 5, b: 5})(*sp.symbols('a b')) and 15 - 10 == 5 and 10 - 5 == 5"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: $B$ dùng hết cả bột và đường: $\ 8 + 16 = 24$, $\ 2 \cdot 8 + 16 = 32$ ✓</p>
          <p><b>Phép thử 2</b> (chứng chỉ): $\ 15x_1 + 10x_2 = 5(x_1 + x_2) + 5(2x_1 + x_2) \le 5 \cdot 24 + 5 \cdot 32 = 280$</p>
          <p class="note">Mọi điểm thoả hai ràng buộc đều có $z \le 280$, mà $B$ đạt 280 → chắc chắn tối ưu.</p>
        focus: [1, 2, 3]
        say: "Phép thử đầu tiên, B dùng hết cả bột lẫn đường, 8 cộng 16 bằng 24, 2 nhân 8 cộng 16 bằng 32. Phép thử thứ hai mạnh hơn, viết hàm mục tiêu thành 5 lần ràng buộc bột cộng 5 lần ràng buộc đường, nên z không vượt quá 5 nhân 24 cộng 5 nhân 32, bằng 280. Vì mọi điểm hợp lệ đều có z không quá 280, mà B đạt đúng 280, nên B chắc chắn tối ưu."
      - clear: true
        show: |
          <p>Hai số 5 tìm ở đâu? Gọi $y_1$, $y_2$ là số lần lấy ràng buộc bột, ràng buộc đường. Muốn $y_1(x_1 + x_2) + y_2(2x_1 + x_2)$ <b>đúng bằng</b> $15x_1 + 10x_2$:</p>
          $$\begin{cases} y_1 + 2y_2 = 15 & (\text{hệ số của } x_1) \\ y_1 + y_2 = 10 & (\text{hệ số của } x_2) \end{cases} \implies y_2 = 5,\ \ y_1 = 5$$
          <p class="note">Cả hai số đều không âm, nên nhân vào hai bất đẳng thức “$\le$” không làm đổi chiều.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Hai số 5 đó tìm ở đâu ra? Gọi y một, y hai là số lần ta lấy ràng buộc bột và ràng buộc đường, và đòi tổng của chúng đúng bằng hàm mục tiêu. So hệ số của x một, tức số nhân với x một, y một cộng 2 y hai phải bằng 15, còn so hệ số của x hai, y một cộng y hai phải bằng 10. Trừ hai phương trình như phần ôn, y hai bằng 5, rồi y một bằng 10 trừ 5, bằng 5. Cả hai số đều không âm, nên nhân vào hai bất đẳng thức không làm đổi chiều, và chứng chỉ hợp lệ."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "2*24 + 0 == 48 > 32 and 15*24 == 360"
      - "[10*a + 20*b for a, b in ((0, 0), (16, 0), (8, 16), (0, 24))] == [0, 160, 400, 480] and (lambda t: 10*(-t) + 20*(24 + t) == 480 + 10*t and (-t) + (24 + t) <= 24 and 2*(-t) + (24 + t) <= 32)(100)"
      - "[10*a + 10*b for a, b in ((8, 16), (0, 24), (4, 20))] == [240, 240, 240]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy giao điểm của đường biên với trục làm “đỉnh” <b class="red">(sai)</b>
          <br><span class="note">$(24, 0)$ nằm trên đường bột nhưng cần $2 \cdot 24 = 48 > 32$ kg đường — không thuộc miền, dù cho $z = 360$ hấp dẫn. Phép thử: thay đỉnh vào <b>mọi</b> ràng buộc.</span></div>
        say: "Lỗi thứ nhất, lấy giao điểm của đường biên với trục làm đỉnh. Điểm 24, 0 nằm trên đường giới hạn bột, nhưng cần 48 ki-lô-gam đường, vượt 32, nên không thuộc miền, dù cho z bằng 360 trông rất hấp dẫn. Phép thử là thay mỗi đỉnh vào mọi ràng buộc."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên điều kiện không âm <b class="red">(sai)</b>
          <br><span class="note">Miền thành vô hạn. Với $z = 15x_1 + 10x_2$ kết quả tình cờ vẫn 280 (nhờ chứng chỉ). Nhưng với $z = 10x_1 + 20x_2$: có $x \ge 0$ thì lớn nhất 480 tại $C$; bỏ $x \ge 0$, lấy $x_1 = -t$, $x_2 = 24 + t$ thì $z = 480 + 10t$ — <b>lớn mãi</b>, không có nghiệm tối ưu.</span></div>
        say: "Lỗi thứ hai, quên điều kiện không âm. Miền khi đó vô hạn. Với hàm mục tiêu của bài, kết quả tình cờ vẫn là 280 nhờ chứng chỉ vừa rồi. Nhưng với z bằng 10 x một cộng 20 x hai, có điều kiện không âm thì lớn nhất là 480 tại C. Còn bỏ điều kiện đó, cho x một âm dần, z sẽ lớn mãi không dừng, và bài toán không có nghiệm tối ưu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ nghiệm tối ưu luôn duy nhất <b class="red">(sai)</b>
          <br><span class="note">$z = 10x_1 + 10x_2$ song song với cạnh bột: $B$, $C$ và mọi điểm giữa (như $(4, 20)$) đều cho 240 — <b>vô số nghiệm</b>.</span>
          <table class="t"><tr><th>điểm</th><th>$B(8, 16)$</th><th>$(4, 20)$</th><th>$C(0, 24)$</th></tr><tr><td>$10x_1 + 10x_2$</td><td>240</td><td>240</td><td>240</td></tr></table></div>
        say: "Lỗi thứ ba, nghĩ nghiệm tối ưu luôn duy nhất. Với z bằng 10 x một cộng 10 x hai, đường mức song song với cạnh giới hạn bột, nên B, C và mọi điểm ở giữa, như 4, 20, đều cho 240, tức có vô số nghiệm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Không kiểm miền có rỗng không <b class="red">(sai)</b>
          <br><span class="note">Ví dụ thêm ràng buộc $x_1 + x_2 \ge 30$ vào bài: không điểm nào vừa $\le 24$ vừa $\ge 30$ → bài toán <b>vô nghiệm</b>.</span></div>
        say: "Lỗi thứ tư, không kiểm miền có rỗng hay không. Nếu thêm yêu cầu tổng số mẻ ít nhất 30, thì không điểm nào vừa không quá 24 vừa ít nhất 30, và bài toán vô nghiệm."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[3*a + 5*b for a, b in ((0, 0), (4, 0), (4, 3), (2, 6), (0, 6))] == [0, 12, 27, 36, 30]"
      - "all(a <= 4 and 2*b <= 12 and 3*a + 2*b <= 18 for a, b in ((0, 0), (4, 0), (4, 3), (2, 6), (0, 6)))"
      - "18 - 3*4 == 6 and 6 // 2 == 3 and 18 - 2*6 == 6 and 6 // 3 == 2"
      - "(lambda x, y: sp.expand(1*(3*x + 2*y) + Rational(3, 2)*(2*y) - (3*x + 5*y)) == 0)(*sp.symbols('x y')) and 18 + Rational(3, 2)*12 == 36 and 18 + 18 == 36"
    steps:
      - show: |
          $$\max\ z = 3x_1 + 5x_2 \quad \text{với} \quad x_1 \le 4,\ \ 2x_2 \le 12,\ \ 3x_1 + 2x_2 \le 18,\ \ x_1, x_2 \ge 0$$
          <p>Tìm các đỉnh và nghiệm tối ưu.</p>
        focus: [0, 1, 2, 0]
        say: "Đến lượt bạn, tìm giá trị lớn nhất của 3 x một cộng 5 x hai. Các ràng buộc là x một không quá 4, 2 x hai không quá 12, 3 x một cộng 2 x hai không quá 18, và hai biến không âm. Hãy tìm các đỉnh và nghiệm tối ưu. Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p><b>Bước 1</b> — tìm các đỉnh, mỗi đỉnh là giao của hai đường biên:</p>
          <table class="t"><tr><th>đỉnh</th><th>giao của</th><th>tính</th></tr>
          <tr><td>$(0, 0)$, $(4, 0)$, $(0, 6)$</td><td>một đường biên với một trục</td><td>đọc thẳng</td></tr>
          <tr><td>$(4, 3)$</td><td>$x_1 = 4$ và $3x_1 + 2x_2 = 18$</td><td>$2x_2 = 18 - 12 = 6 \implies x_2 = 3$</td></tr>
          <tr><td>$(2, 6)$</td><td>$2x_2 = 12$ và $3x_1 + 2x_2 = 18$</td><td>$3x_1 = 18 - 12 = 6 \implies x_1 = 2$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án, bước một, tìm các đỉnh, mỗi đỉnh là giao của hai đường biên. Ba đỉnh 0, 0, rồi 4, 0, và 0, 6 nằm trên trục, đọc thẳng từ các giới hạn x một không quá 4 và x hai không quá 6. Đỉnh 4, 3 là giao của x một bằng 4 với đường 3 x một cộng 2 x hai bằng 18, nên 2 x hai bằng 18 trừ 12, tức x hai bằng 3. Đỉnh 2, 6 là giao của x hai bằng 6 với cùng đường đó, nên 3 x một bằng 6, tức x một bằng 2."
      - clear: true
        show: |
          <p><b>Bước 2</b> — thay vào $z = 3x_1 + 5x_2$:</p>
          <table class="t"><tr><th>đỉnh</th><th>$(0, 0)$</th><th>$(4, 0)$</th><th>$(4, 3)$</th><th>$(2, 6)$</th><th>$(0, 6)$</th></tr>
          <tr><td>$z$</td><td>0</td><td>12</td><td>27</td><td>$\hlg{36}$</td><td>30</td></tr></table>
          <p>Tối ưu $z = 36$ tại $(2, 6)$. &nbsp; Kiểm: $\ 3 \cdot 2 + 2 \cdot 6 = 18$ ✓, $\ 2 \cdot 6 = 12$ ✓.</p>
        focus: [1, 2, 3, 3]
        say: "Bước hai, thay năm đỉnh vào z bằng 3 x một cộng 5 x hai. Các giá trị lần lượt là 0, 12, 27, 36 và 30. Tối ưu là 36 tại điểm 2, 6. Điểm này nằm đúng trên hai đường biên, 3 nhân 2 cộng 2 nhân 6 bằng 18, và 2 nhân 6 bằng 12."
      - show: |
          <p><b>Bước 3</b> — chứng chỉ, cùng cách tìm hai số nhân như trên:</p>
          $$3x_1 + 5x_2 = 1 \cdot (3x_1 + 2x_2) + \frac{3}{2} \cdot (2x_2) \le 18 + \frac{3}{2} \cdot 12 = 36$$
          <p class="note">Không điểm nào vượt 36, mà $(2, 6)$ đạt 36 → chắc chắn tối ưu.</p>
        focus: [1, 2, 2, 3]
        say: "Bước ba, dựng chứng chỉ như đã làm với xưởng bánh. Lấy 1 lần ràng buộc thứ ba để có đúng 3 x một, rồi cần thêm 3 x hai, nên lấy 3 phần 2 lần ràng buộc 2 x hai không quá 12. Vế phải là 18 cộng 3 phần 2 nhân 12, tức 18 cộng 18, bằng 36. Không điểm nào vượt 36, mà điểm 2, 6 đạt đúng 36, nên nó chắc chắn tối ưu."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  # ───────────────────────── 8b. TỰ LÀM (lab) ─────────────────────────
  - id: practice
    kind: practice
    title: "Tự làm: thử mọi giao điểm và dựng chứng chỉ"
    lab: labs/CS112/L21
    checks:
      - "(lambda m: (lambda r: (r[0], [(str(x), str(y)) for x, y in r[2]]))(m['lp2_vertices']([(1, 1, 9), (3, 1, 18), (1, 0, 7), (0, 1, 6)])))(__import__('runpy').run_path('audit/cs112/af2b_calc.py')) == (13, [('0', '0'), ('0', '6'), ('3', '6'), ('9/2', '9/2'), ('6', '0')])"
      - "3 * Fraction(9, 2) + 2 * Fraction(9, 2) == Fraction(45, 2) and Fraction(3, 2) * 9 + Fraction(1, 2) * 18 == Fraction(45, 2) and Fraction(3, 2) + 3 * Fraction(1, 2) == 3 and Fraction(3, 2) + Fraction(1, 2) == 2"
    steps:
      - show: |
          <p>Đề dùng một mẩu mã, đọc trước khi làm:</p>
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>Fraction(a, b)</code></td><td><b>phân số chính xác</b> a trên b, không làm tròn; in ra viết <code>9/2</code>, hoặc <code>3</code> nếu chia hết</td><td><code>Fraction(9, 2)</code> in ra 9/2; cộng, trừ, nhân, chia các phân số vẫn ra phân số</td></tr></table>
        focus: [1, "2.2"]
        say: "Đề dùng một mẩu mã, nên ta đọc nó trước. Phân số chính xác giữ nguyên a trên b, không làm tròn, in ra dạng chín phần hai, hoặc số nguyên nếu chia hết, và các phép tính giữa chúng vẫn ra phân số."
      - clear: true
        show: |
          <p><b>Đề</b>: tạo <code>qhtt.py</code>. Lớn nhất $z = 3x_1 + 2x_2$ <span class="note">(số minh hoạ)</span>:</p>
          <p>$x_1 + x_2 \le 9$, &nbsp; $3x_1 + x_2 \le 18$, &nbsp; $x_1 \le 7$, &nbsp; $x_2 \le 6$, &nbsp; $x_1, x_2 \ge 0$.</p>
          <ol><li>Giải hệ cho mọi cặp trong 6 đường (bằng <code>Fraction</code>); đếm cặp giải được.</li>
          <li>Giữ đỉnh hợp lệ, tính $z$, tìm đỉnh tối ưu.</li>
          <li>Dựng chứng chỉ chặn trên $y_1, y_2$.</li></ol>
        focus: [1, 2, 3, "3.1", "3.2", "3.3"]
        pause: 300
        say: "Bây giờ tới phần bạn tự làm. Tìm giá trị lớn nhất của 3 x một cộng 2 x hai với bốn ràng buộc như trên màn hình. Hãy lấy mọi cặp trong sáu đường, giải hệ bằng phân số chính xác và đếm số cặp giải được. Giữ các đỉnh hợp lệ, tính z, tìm đỉnh tối ưu. Cuối cùng dựng chứng chỉ chặn trên bằng hai số nhân. Hãy dừng video và làm."
      - clear: true
        show: |
          <table class="t"><tr><th>đọc trước: việc</th><th>làm thế nào</th><th>gõ trong Git Bash</th></tr>
          <tr><td>mở Git Bash</td><td><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b></td><td>—</td></tr>
          <tr><td>chạy</td><td>gõ lệnh để chạy chương trình; các dòng <code>print</code> hiện ngay bên dưới</td><td><code>python qhtt.py</code></td></tr>
          <tr><td>chấm</td><td><code>bash</code> chạy tệp chấm <code>labs/cham.sh</code> với khoá, mã bài, tên tệp; in <b>ĐÚNG</b> khi mọi dòng khớp kết quả mong đợi</td><td><code>bash labs/cham.sh CS112 L21 qhtt.py</code></td></tr></table>
        focus: ["1.2", ["1.3", "1.4"]]
        say: "Lệnh được gõ trong một cửa sổ dòng lệnh, mở bằng chuột phải trong thư mục bài làm. Lệnh đầu chạy chương trình, lệnh sau chấm bài, và in chữ ĐÚNG khi mọi dòng khớp."
      - clear: true
        show: |
          <p><b>Kết quả mong đợi</b> (nửa đầu)</p>
          <div class="code"><div>Cap duong giai duoc: 13</div><div>Dinh hop le: 5</div><div>(0, 0) z = 0</div><div>(0, 6) z = 12</div></div>
        focus: [1, 2, 2]
        say: "Đây là kết quả mong đợi, nửa đầu. Đầu tiên là số cặp đường giải được và số đỉnh hợp lệ. Sau đó là các đỉnh sắp theo giá trị z tăng dần."
      - clear: true
        show: |
          <p><b>Kết quả mong đợi</b> (nửa sau)</p>
          <div class="code"><div>(6, 0) z = 18</div><div>(3, 6) z = 21</div><div>(9/2, 9/2) z = 45/2</div><div>Toi uu: z = 45/2 tai (9/2, 9/2)</div><div>Chung chi: y1 = 3/2, y2 = 1/2, can tren 45/2</div></div>
          <p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh CS112 L21 qhtt.py</code> — in <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
        focus: [1, 2, 3]
        say: "Đây là nửa sau, ba đỉnh còn lại, đỉnh tối ưu và chứng chỉ. Bạn chạy chương trình của mình rồi so từng dòng với màn hình. Muốn chấm bằng máy, gõ lệnh ở chân màn hình, nó in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác."
      - clear: true
        show: |
          <p>Ba cách viết trong gợi ý sắp tới:</p>
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>a1*x + b1*y = c1</code></td><td>dấu <code>*</code> là nhân: đường thẳng thứ nhất có hệ số a1 (của x), b1 (của y), vế phải c1</td><td>x + y = 9: a1 = 1, b1 = 1, c1 = 9</td></tr>
          <tr><td><code>det = a1*b2 - a2*b1</code></td><td><b>định thức</b>: bằng 0 thì hai đường song song, không có giao điểm</td><td>với x + y = 9 và 3x + y = 18: 1*1 - 3*1 = -2</td></tr>
          <tr><td><code>x = (c1*b2 - c2*b1) / det</code></td><td>dấu <code>/</code> là chia: công thức cho số x của giao điểm; <code>y</code> có công thức tương tự</td><td>(9*1 - 18*1) / (-2) = 9/2: x của giao điểm là 9/2</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Gợi ý sắp tới dùng ba cách viết, nên ta đọc chúng trước. Mỗi đường thẳng được viết bằng ba hệ số, a nhân x cộng b nhân y bằng c, ví dụ x cộng y bằng 9 có a bằng 1, b bằng 1, c bằng 9. Định thức tính từ các hệ số, bằng 0 thì hai đường song song, còn hai đường ví dụ cho trừ 2. Lấy tử số chia cho định thức ra số x của giao điểm, ví dụ chín phần hai."
      - clear: true
        show: |
          <div class="box key"><b>Nếu kẹt:</b> hai đường <code>a1*x + b1*y = c1</code> và <code>a2*x + b2*y = c2</code> có định thức <code>a1*b2 - a2*b1</code>; bằng 0 là song song. Giao điểm: <code>x = (c1*b2 - c2*b1) / det</code>, <code>y = (a1*c2 - a2*c1) / det</code>. Chứng chỉ: so hệ số của <code>x1</code> và <code>x2</code> để có hai phương trình cho <code>y1</code>, <code>y2</code>. Lời giải ở <code>labs/CS112/L21/loi_giai.py</code>.</div>
        say: "Nếu kẹt, hai đường có định thức bằng a một nhân b hai trừ a hai nhân b một, bằng 0 nghĩa là hai đường song song. Còn lại, giao điểm lấy từ hai công thức chia cho định thức. Với chứng chỉ, so hệ số của x một và x hai để có hai phương trình cho hai số nhân. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã thử."

