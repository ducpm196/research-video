id: L09
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 9 — Hàm sinh: giải hệ thức truy hồi bằng chuỗi lũy thừa"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L09 (bản thảo); audit/cs112/verify_cs112.py C15"
assumes: [cdot, sub, dots, sum, infty, implies]
# Quy ước: G(x) = Σ_{n=1}^{∞} T(n) xⁿ là chuỗi lũy thừa HÌNH THỨC (dùng như một cái túi chứa dãy số; không bàn hội tụ);
#   đổi chỉ số viết rõ k = n − 1; phân tích phân thức đơn giản A/(1 − 2x) + B/(1 − x).
# Nối bài trước (luật 17): bài 8 — hệ thức Tháp Hà Nội T(1) = 1, T(n) = 2T(n − 1) + 1, giải bằng thế ngược ra 2ⁿ − 1;
#   bài 0 — dấu tổng Sigma là máy cộng dồn.
objectives:
  - "Viết hàm sinh của một dãy và đọc lại số hạng thứ n là hệ số của xⁿ"
  - "Nhân hệ thức với xⁿ, cộng lại, đổi chỉ số để ra một phương trình theo G(x)"
  - "Phân tích phân thức thành tổng hai phân thức đơn giản và khai triển thành chuỗi để đọc nghiệm"
asr_reviewed:
  - {sentence: "Làm như ví dụ, ta được G bằng x chia cho 1 trừ x nhân 1 trừ 3x.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Giải hệ thức mà không cần đoán quy luật"
    steps:
      - show: |
          <p>Bài 8: $\ T(1) = 1,\ T(n) = 2T(n-1) + 1$ — thế ngược vài bước rồi <b>đoán</b> quy luật sau $i$ bước.</p>
          <div class="box key">Hôm nay: gói <b>cả dãy</b> $T(1), T(2), T(3), \dots$ vào <b>một biểu thức</b>, rồi dùng đại số thường để giải — không cần đoán.</div>
        focus: [1, 2]
        say: "Chào bạn, ở bài 8, ta giải hệ thức Tháp Hà Nội bằng cách thế ngược vài bước rồi đoán quy luật. Hôm nay ta học một cách không cần đoán, gói cả dãy số vào một biểu thức, rồi giải bằng các phép đại số quen thuộc."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Công cụ: chuỗi cấp số nhân"
    checks:
      - "(lambda x: sp.expand((1 - x) * sum(x**k for k in range(6))) == 1 - x**6)(sp.Symbol('x'))"
      - "abs(sum(Rational(1, 10)**k for k in range(30)) - Rational(10, 9)) < Rational(1, 10**20)"
      - "(lambda x: sp.series(1 / (1 - 2*x), x, 0, 5).removeO() == 1 + 2*x + 4*x**2 + 8*x**3 + 16*x**4)(sp.Symbol('x'))"
    steps:
      - show: |
          $$1 + x + x^2 + x^3 + \dots = \frac{1}{1 - x}$$
          <p>Vì sao: nhân $(1 - x)$ với $1 + x + x^2 + \dots$, các số hạng triệt tiêu từng cặp, chỉ còn 1. &nbsp; Thử $x = 0{,}1$: $\ 1{,}111\ldots = \dfrac{1}{0{,}9}$ ✓</p>
          <p>Thay $x$ bằng $2x$: $\quad \dfrac{1}{1 - 2x} = 1 + 2x + 4x^2 + \dots = \displaystyle\sum_{n=0}^{\infty} 2^n x^n$</p>
        focus: [1, 2, 2, 3]
        say: "Công cụ chính là chuỗi cấp số nhân, 1 cộng x cộng x bình phương, và cứ thế, bằng 1 chia 1 trừ x. Lý do là khi nhân với 1 trừ x, các số hạng triệt tiêu từng cặp, chỉ còn 1. Thử với x bằng 0 phẩy 1, ta được 1 phẩy 111, đúng bằng 1 chia 0 phẩy 9. Thay x bằng 2x, ta có 1 chia 1 trừ 2x bằng tổng của 2 mũ n nhân x mũ n."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hàm sinh G của x"
    steps:
      - show: |
          $$G(x) = \sum_{n=1}^{\infty} T(n)\, x^n = T(1)\,x + T(2)\,x^2 + T(3)\,x^3 + \dots$$
          <p>Dãy Tháp Hà Nội: $\ G(x) = 1x + 3x^2 + 7x^3 + 15x^4 + \dots$</p>
          <div class="box key">$x$ chỉ là cái <b>móc treo</b>: hệ số đứng trước $x^n$ chính là $T(n)$.</div>
        focus: [1, 2, 3]
        say: "Hàm sinh của dãy T là G của x, bằng tổng của T của n nhân x mũ n, khi n chạy từ 1 tới vô cùng. Với dãy Tháp Hà Nội, G của x bằng x, cộng 3 x bình phương, cộng 7 x mũ 3, và cứ thế. Hãy coi x chỉ là cái móc treo, hệ số đứng trước x mũ n chính là T của n."

  - id: hooks
    kind: intuition
    title: "Hình dung: nhân với x là dịch mỗi hệ số sang móc kế bên"
    checks:
      - "[3 - 2*1, 7 - 2*3, 15 - 2*7] == [1, 1, 1] and [2*1, 2*3, 2*7] == [2, 6, 14]"
      - "(lambda x: sp.expand(x * (x + 3*x**2 + 7*x**3)) == x**2 + 3*x**3 + 7*x**4)(sp.Symbol('x'))"
    steps:
      - show: |
          <svg width="1300" height="460" viewBox="0 0 1300 460"><defs><marker id="arG9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><text x="420" y="40" font-size="30" text-anchor="middle" fill="#6b7280">móc x</text><line x1="420" y1="52" x2="420" y2="74" stroke="#6b7280" stroke-width="3"/><text x="620" y="40" font-size="30" text-anchor="middle" fill="#6b7280">móc x²</text><line x1="620" y1="52" x2="620" y2="74" stroke="#6b7280" stroke-width="3"/><text x="820" y="40" font-size="30" text-anchor="middle" fill="#6b7280">móc x³</text><line x1="820" y1="52" x2="820" y2="74" stroke="#6b7280" stroke-width="3"/><text x="1020" y="40" font-size="30" text-anchor="middle" fill="#6b7280">móc x⁴</text><line x1="1020" y1="52" x2="1020" y2="74" stroke="#6b7280" stroke-width="3"/><text x="40" y="134" font-size="28" font-weight="bold" fill="#2563eb">G(x)</text><rect x="360" y="90" width="120" height="66" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="420" y="134" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="560" y="90" width="120" height="66" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="620" y="134" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><rect x="760" y="90" width="120" height="66" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="820" y="134" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><rect x="960" y="90" width="120" height="66" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="1020" y="134" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">15</text><text x="40" y="244" font-size="28" font-weight="bold" fill="#d97706">2x G(x)</text><rect x="360" y="200" width="120" height="66" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/><rect x="560" y="200" width="120" height="66" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="620" y="244" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><rect x="760" y="200" width="120" height="66" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="820" y="244" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><rect x="960" y="200" width="120" height="66" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/><text x="1020" y="244" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">14</text><text x="40" y="354" font-size="28" font-weight="bold" fill="#059669">G − 2x G</text><rect x="360" y="310" width="120" height="66" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="420" y="354" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="560" y="310" width="120" height="66" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="620" y="354" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="760" y="310" width="120" height="66" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="820" y="354" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="960" y="310" width="120" height="66" rx="10" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="1020" y="354" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><path d="M450,158 C510,180 530,180 586,198" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arG9)"/><path d="M650,158 C710,180 730,180 786,198" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arG9)"/><path d="M850,158 C910,180 930,180 986,198" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arG9)"/><text x="650" y="445" font-size="26" text-anchor="middle" fill="#1f2937">nhân với x: mỗi hệ số dịch sang móc kế bên; hàng cuối toàn số 1, tức x + x² + x³ + …</text></svg>
        focus: [0, 0, 0, 0]
        say: "Trước khi biến đổi, hãy nhìn các hệ số như những tấm thẻ treo trên móc x, x bình phương, x mũ 3, x mũ 4. Hàng trên là G với các thẻ 1, 3, 7, 15. Nhân G với x thì mỗi thẻ dịch sang móc kế bên, vì x nhân x mũ n bằng x mũ n cộng 1, rồi nhân 2 được hàng giữa 2, 6, 14, và móc x để trống. Lấy hàng trên trừ hàng giữa, theo hệ thức mỗi móc còn đúng 1, tức là x cộng x bình phương cộng x mũ 3, và cứ thế, một chuỗi cấp số nhân."

  # ───────────────────────── 4. LẬP PHƯƠNG TRÌNH ─────────────────────────
  - id: equation
    kind: formula
    title: "Biến hệ thức thành một phương trình theo G"
    checks:
      - "(lambda x, G: sp.simplify(sp.solve(sp.Eq(G - x, 2*x*G + x**2/(1 - x)), G)[0] - x/((1 - x)*(1 - 2*x))) == 0)(sp.Symbol('x'), sp.Symbol('G'))"
      - "(lambda x: sp.simplify(x + x**2/(1 - x) - x/(1 - x)) == 0)(sp.Symbol('x'))"
    steps:
      - show: |
          <p>Nhân hai vế của $T(n) = 2T(n-1) + 1$ với $x^n$ rồi cộng mọi $n \ge 2$ (vì hệ thức chỉ đúng từ $n = 2$):</p>
          $$\underbrace{\sum_{n\ge 2} T(n)x^n}_{①} = 2\underbrace{\sum_{n\ge 2} T(n-1)x^n}_{②} + \underbrace{\sum_{n\ge 2} x^n}_{③}$$
        focus: [1, 2]
        say: "Bước một, nhân hai vế của hệ thức với x mũ n, rồi cộng lại với mọi n từ 2, vì hệ thức chỉ đúng từ n bằng 2. Ta được ba tổng, đánh số một, hai, ba."
      - show: |
          <p>① $= G(x) - T(1)\,x = G(x) - x$ &nbsp; (G có thêm số hạng $n = 1$, phải trừ đi)</p>
          <p>② $= x\sum_{n\ge 2} T(n-1)x^{n-1} = x\sum_{k\ge 1} T(k)x^{k} = x\,G(x)$ &nbsp; (đặt $k = n - 1$)</p>
          <p>③ $= x^2 + x^3 + \dots = x^2\,(1 + x + \dots) = \dfrac{x^2}{1 - x}$</p>
        focus: [1, 2, 2, 3]
        say: "Tổng một thiếu đúng số hạng n bằng 1 so với G, nên bằng G trừ T của 1 nhân x, tức G trừ x. Tổng hai, rút x ra ngoài, rồi đặt k bằng n trừ 1. Khi n chạy từ 2 thì k chạy từ 1, nên tổng hai bằng x nhân G. Tổng ba là x bình phương cộng x mũ 3, và cứ thế, theo chuỗi cấp số nhân bằng x bình phương chia 1 trừ x."
      - clear: true
        show: |
          $$G - x = 2x\,G + \frac{x^2}{1 - x} \implies G\,(1 - 2x) = x + \frac{x^2}{1 - x} = \frac{x}{1 - x}$$
          $$\implies \hlg{G(x) = \frac{x}{(1 - x)(1 - 2x)}}$$
        focus: [1, 1, 2]
        say: "Ghép lại, G trừ x bằng 2x nhân G cộng x bình phương chia 1 trừ x. Theo quy tắc chuyển vế, đưa 2x nhân G sang trái và x sang phải, rồi quy đồng, vế phải gọn lại thành x chia 1 trừ x. Chia hai vế cho 1 trừ 2x, ta được G của x bằng x chia cho 1 trừ x nhân 1 trừ 2x."

  # ───────────────────────── 5. ĐỌC NGHIỆM ─────────────────────────
  - id: partial
    kind: example
    title: "Tách phân thức rồi khai triển để đọc T của n"
    checks:
      - "(lambda x: sp.simplify(1/(1 - 2*x) - 1/(1 - x) - x/((1 - x)*(1 - 2*x))) == 0)(sp.Symbol('x'))"
      - "(lambda A, B: sp.solve([sp.Eq(1, B*(1 - 2*1)), sp.Eq(Rational(1, 2), A*(1 - Rational(1, 2)))], [A, B]) == {A: 1, B: -1})(*sp.symbols('A B'))"
      - "(lambda x: [sp.series(x/((1 - x)*(1 - 2*x)), x, 0, 6).removeO().coeff(x, n) for n in range(1, 6)] == [2**n - 1 for n in range(1, 6)] == [1, 3, 7, 15, 31])(sp.Symbol('x'))"
    steps:
      - show: |
          <p>Tìm $A, B$ để $\ \dfrac{x}{(1-x)(1-2x)} = \dfrac{A}{1 - 2x} + \dfrac{B}{1 - x}$, tức $\ x = A(1 - x) + B(1 - 2x)$.</p>
          <p>Thay $x = 1$: $\ 1 = B \cdot (-1) \implies B = -1$. &nbsp; Thay $x = \frac{1}{2}$: $\ \frac{1}{2} = A \cdot \frac{1}{2} \implies A = 1$.</p>
        focus: [1, 2, 2]
        say: "Bước cuối, tách phân thức thành tổng hai phân thức đơn giản, A chia 1 trừ 2x và B chia 1 trừ x. Quy đồng, ta cần x bằng A nhân 1 trừ x, cộng B nhân 1 trừ 2x. Thay x bằng 1 thì số hạng chứa A mất đi, được B bằng âm 1, còn thay x bằng một phần hai thì được A bằng 1."
      - show: |
          $$G(x) = \frac{1}{1 - 2x} - \frac{1}{1 - x} = \sum_{n \ge 0} 2^n x^n - \sum_{n \ge 0} x^n = \sum_{n \ge 0} \big(2^n - 1\big)\, x^n$$
          <div class="box ok">Hệ số của $x^n$: $\ T(n) = \hlg{2^n - 1}$ — đúng như bài 8, mà không phải đoán.</div>
          <p class="note">Khai triển thử: $\ x + 3x^2 + 7x^3 + 15x^4 + \dots$ (số hạng $n = 0$ có hệ số $1 - 1 = 0$).</p>
        focus: [1, 2, 3]
        say: "Theo chuỗi cấp số nhân, mỗi phân thức là một tổng quen thuộc, trừ hai tổng cho nhau, hệ số của x mũ n là 2 mũ n trừ 1. Vậy T của n bằng 2 mũ n trừ 1, đúng như bài 8, mà không phải đoán quy luật. Khai triển thử ra x, cộng 3 x bình phương, cộng 7 x mũ 3, khớp với dãy ban đầu."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: quy đồng ngược và so vài hệ số đầu"
    checks:
      - "(lambda x: sp.together(1/(1 - 2*x) - 1/(1 - x)) == sp.together(x/((1 - x)*(1 - 2*x))))(sp.Symbol('x'))"
      - "(lambda x, T: [T(T, n) for n in range(1, 6)] == [sp.series(x/((1 - x)*(1 - 2*x)), x, 0, 7).removeO().coeff(x, n) for n in range(1, 6)] == [2**n - 1 for n in range(1, 6)] == [1, 3, 7, 15, 31])(sp.Symbol('x'), lambda f, n: 1 if n == 1 else 2*f(f, n - 1) + 1)"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: quy đồng ngược</p>
          $$\frac{1}{1-2x} - \frac{1}{1-x} = \frac{(1 - x) - (1 - 2x)}{(1-x)(1-2x)} = \frac{x}{(1-x)(1-2x)} \ ✓$$
          <p><b>Phép thử 2</b>: vài hệ số đầu phải khớp bảng tính tay: 1, 3, 7, 15 ✓</p>
        focus: [0, [1, 2], 3]
        say: "Hai phép thử. Một, quy đồng ngược hai phân thức, vì tử số 1 trừ x trừ 1 cộng 2x bằng x, ta lấy lại đúng G. Hai, vài hệ số đầu của khai triển phải khớp bảng tính tay 1, 3, 7, 15."
      - show: |
          <p>Làm phép thử 2 theo ba đường độc lập:</p>
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>tính dần $2T(n-1) + 1$</td><td>1</td><td>3</td><td>7</td><td>15</td><td>31</td></tr>
          <tr><td>hệ số của $x^n$ khi máy khai triển $G$</td><td>1</td><td>3</td><td>7</td><td>15</td><td>31</td></tr>
          <tr><td>công thức $2^n - 1$</td><td>1</td><td>3</td><td>7</td><td>15</td><td>31 ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Làm phép thử hai theo ba đường độc lập, với n từ 1 đến 5. Hàng đầu tính dần bằng hệ thức, mỗi số bằng 2 nhân số trước cộng 1. Hàng giữa là hệ số của x mũ n khi cho máy khai triển G thành chuỗi, không dùng hệ thức. Hàng cuối tính bằng công thức 2 mũ n trừ 1, và cả ba hàng khớp nhau từng cột."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda x, G: sp.series(sp.solve(sp.Eq(G, 2*x*G + x**2/(1 - x)), G)[0], x, 0, 4).removeO().coeff(x, 1) == 0)(sp.Symbol('x'), sp.Symbol('G'))"
      - "2**1 + 1 == 3 != 1"
      - "[2**n + 1 for n in (1, 2)] == [3, 5] and (lambda T: [T(T, 1), T(T, 2)])(lambda f, n: 1 if n == 1 else 2*f(f, n - 1) + 1) == [1, 3]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên trừ $T(1)\,x$: viết tổng ① bằng $G(x)$ <b class="red">(sai)</b>
          <br><span class="note">Khi đó hệ số của $x$ ra 0 thay vì $T(1) = 1$. Phép thử: so hệ số đầu tiên.</span></div>
        say: "Lỗi thứ nhất, quên trừ số hạng T của 1 nhân x, viết tổng một bằng đúng G. Khi đó giải ra, hệ số của x bằng 0 thay vì 1. Phép thử so hệ số đầu tiên bắt được ngay."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đổi chỉ số mà quên rút $x$: viết ② $= G(x)$ <b class="red">(sai)</b>
          <br><span class="note">$T(n-1)x^n$ có số mũ lớn hơn chỉ số 1 đơn vị → phải rút đúng một thừa số $x$.</span></div>
        say: "Lỗi thứ hai, khi đổi chỉ số ở tổng hai lại quên rút x ra ngoài. Mỗi số hạng T của n trừ 1 nhân x mũ n có số mũ lớn hơn chỉ số đúng 1 đơn vị, nên phải rút đúng một thừa số x."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tính sai dấu $B = +1$ <b class="red">(sai)</b>
          <br><span class="note">Khi đó $T(n) = 2^n + 1$, mà $T(1) = 3 \ne 1$. Phép thử: thay $n = 1$.</span></div>
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th></tr>
          <tr><td>$2^n + 1$ (sai dấu)</td><td>3</td><td>5</td></tr>
          <tr><td>tính dần từ hệ thức</td><td>1</td><td>3</td></tr></table>
        focus: [1, 1, ["2.2", "2.3"]]
        say: "Lỗi thứ ba, tính sai dấu, cho B bằng 1. Khi đó đáp số thành 2 mũ n cộng 1, và T của 1 bằng 3, sai với điều kiện đầu. Phép thử thay n bằng 1 bắt được."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Viết tổng ③ $\sum_{n \ge 2} x^n = \dfrac{1}{1 - x}$ <b class="red">(sai)</b>
          <br><span class="note">Tổng bắt đầu từ $x^2$, nên phải rút $x^2$ ra: $\dfrac{x^2}{1 - x}$. Luôn nhìn <b>số hạng đầu</b> của tổng.</span></div>
        say: "Lỗi thứ tư, viết tổng ba bằng 1 chia 1 trừ x. Tổng này bắt đầu từ x bình phương, nên phải rút x bình phương ra ngoài. Luôn nhìn số hạng đầu tiên của tổng trước khi dùng công thức."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda x, G: sp.simplify(sp.solve(sp.Eq(G - x, 3*x*G + x**2/(1 - x)), G)[0] - x/((1 - x)*(1 - 3*x))) == 0)(sp.Symbol('x'), sp.Symbol('G'))"
      - "(lambda x: sp.simplify(Rational(1, 2)/(1 - 3*x) - Rational(1, 2)/(1 - x) - x/((1 - x)*(1 - 3*x))) == 0)(sp.Symbol('x'))"
      - "(lambda T: [T(T, n) for n in range(1, 5)] == [(3**n - 1)//2 for n in range(1, 5)] == [1, 4, 13, 40])(lambda f, n: 1 if n == 1 else 3*f(f, n - 1) + 1)"
      - "(lambda A, B: sp.solve([sp.Eq(1, B*(1 - 3)), sp.Eq(Rational(1, 3), A*(1 - Rational(1, 3)))], [A, B]) == {A: Rational(1, 2), B: Rational(-1, 2)})(*sp.symbols('A B'))"
    steps:
      - show: |
          <p>Giải bằng hàm sinh:</p>
          $$T(1) = 1, \qquad T(n) = 3\,T(n-1) + 1 \quad (n \ge 2)$$
        focus: [[1, 2], 0, 0]
        say: "Đến lượt bạn, hãy giải bằng hàm sinh hệ thức T của 1 bằng 1, T của n bằng 3 nhân T của n trừ 1, cộng 1. Làm đúng các bước như ví dụ. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b>, ba tổng như ví dụ, chỉ đổi 2 thành 3:</p>
          $$G - x = 3x\,G + \frac{x^2}{1-x} \implies G\,(1 - 3x) = \frac{x}{1 - x} \implies G = \frac{x}{(1-x)(1-3x)}$$
        focus: [1, 2, 2]
        say: "Bước một, nhân hệ thức với x mũ n và cộng từ n bằng 2, ba tổng giống hệt ví dụ, chỉ đổi hệ số 2 thành 3. Chuyển 3x nhân G sang trái và x sang phải, vế phải lại gọn thành x chia 1 trừ x. Làm như ví dụ, ta được G bằng x chia cho 1 trừ x nhân 1 trừ 3x."
      - show: |
          <p><b>Bước 2</b>, tách: $\ x = A(1 - x) + B(1 - 3x)$. &nbsp; $x = 1$: $\ 1 = -2B$, $B = -\frac{1}{2}$. &nbsp; $x = \frac{1}{3}$: $\ \frac{1}{3} = \frac{2}{3}A$, $A = \frac{1}{2}$.</p>
          $$G = \frac{1/2}{1 - 3x} - \frac{1/2}{1 - x} \implies T(n) = \hlg{\frac{3^n - 1}{2}}$$
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>tính dần $3T(n-1) + 1$</td><td>1</td><td>4</td><td>13</td></tr>
          <tr><td>$(3^n - 1)/2$</td><td>1</td><td>4</td><td>13 ✓</td></tr></table>
        focus: [1, 1, 2, 3]
        say: "Bước hai, tách phân thức, cần x bằng A nhân 1 trừ x, cộng B nhân 1 trừ 3x. Thay x bằng 1 được B bằng âm một phần hai, thay x bằng một phần ba được A bằng một phần hai. Tách phân thức được một phần hai chia 1 trừ 3x, trừ một phần hai chia 1 trừ x, nên T của n bằng 3 mũ n trừ 1, chia 2. Thử với n bằng 2, hệ thức cho 4, công thức cũng cho 9 trừ 1 chia 2, bằng 4, và với n bằng 3 cả hai cùng cho 13."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">gói dãy: $G(x) = \sum T(n)x^n$</span><span class="a">→</span>
          <span class="n">nhân $x^n$, cộng, đổi chỉ số</span><span class="a">→</span>
          <span class="n">giải phương trình theo $G$</span><span class="a">→</span>
          <span class="n">tách phân thức</span><span class="a">→</span>
          <span class="n">khai triển, đọc hệ số</span></div>
        say: "Tổng kết chuỗi logic. Gói dãy vào hàm sinh G, nhân hệ thức với x mũ n rồi cộng và đổi chỉ số, giải phương trình theo G, tách phân thức, rồi khai triển và đọc hệ số của x mũ n."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi tổng phải bắt đầu đúng chỗ — kiểm <b>số hạng đầu</b> của mọi tổng, và kiểm đáp số bằng vài hệ số đầu.</div>
        say: "Điều cần mang theo, mỗi tổng phải bắt đầu đúng chỗ, nên hãy kiểm số hạng đầu của mọi tổng, và kiểm đáp số bằng vài hệ số đầu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>đếm đúng số lời gọi đệ quy</b> khi có nhánh rẽ, và <b>chứng minh quy nạp</b> một chặn trên mà không bị “dư” sai dấu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học cách đếm đúng số lời gọi đệ quy khi hàm có nhánh rẽ, và cách chứng minh quy nạp một chặn trên mà không để phần dư sai dấu. Hẹn gặp bạn ở bài tiếp theo."
