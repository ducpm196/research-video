id: L14
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 14 — Quay lui: cây trạng thái và bước trả lại đánh dấu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
af2: true
covers:
  - {objective: 1, scene: example}
  - {objective: 2, scene: example}
  - {objective: 3, scene: verify}
  - {objective: 4, scene: prune}
  - {objective: 5, scene: scale}
