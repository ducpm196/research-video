  # ───────────────────────── 7b. QUY MÔ ─────────────────────────
  - id: scale
    kind: concept
    title: "Khi n lớn dần: cây hoán vị bùng nổ, cắt tỉa giữ cây quân hậu nhỏ"
    checks:
      - "[sum(math.factorial(n) // math.factorial(n - k) for k in range(n + 1)) for n in (7, 9)] == [13700, 986410]"
      - '(lambda g: (exec("def q(n):\n    cnt = [0]\n    def go(r, cols, d1, d2):\n        cnt[0] += 1\n        if r == n:\n            return\n        for c in range(n):\n            if c in cols or (r - c) in d1 or (r + c) in d2:\n                continue\n            go(r + 1, cols | {c}, d1 | {r - c}, d2 | {r + c})\n    go(0, frozenset(), frozenset(), frozenset())\n    return cnt[0]\nr = [q(8), q(10)]", g), g["r"])[1])({}) == [2057, 35539]'
      - "(8 ** 9 - 1) // 7 == 19173961 and (10 ** 11 - 1) // 9 == 11111111111 and sum(8 ** k for k in range(9)) == 19173961 and sum(10 ** k for k in range(11)) == 11111111111 and 986410 // 13700 == 72 and 35539 // 2057 == 17"
    steps:
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>j not in used</code></td><td><code>not in</code> hỏi j <b>chưa</b> nằm trong danh sách <code>used</code></td><td>used = [2, 3]: <code>1 not in used</code> là True</td></tr><tr><td><code>used.append(j)  /  used.pop()</code></td><td><code>append</code> thêm j vào cuối danh sách; <code>pop()</code> lấy phần tử cuối ra, tức trả lại bước vừa đặt</td><td>[2, 3] thêm 1 thành [2, 3, 1]; pop() lại về [2, 3]</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Hàm hoán vị có hai cách viết cần đọc kỹ trước khi chạy. Cụm không nằm trong hỏi số j chưa có trong danh sách số đã dùng. Hàm thêm đặt j vào cuối danh sách, còn hàm lấy ra bỏ phần tử cuối, tức trả lại bước vừa đặt."
      - clear: true
        show: |
          <p><b>Đếm số nút</b> của cây trạng thái khi liệt kê hoán vị (<code>used</code> là dãy đang xây, <code>dem[0]</code> đếm lần gọi):</p>
          <div class="code"><div><span class="kw">def</span> hoan_vi(n, used, dem):</div><div>    dem[0] += 1</div><div>    <span class="kw">if</span> len(used) == n:</div><div>        <span class="kw">return</span></div><div>    <span class="kw">for</span> j <span class="kw">in</span> range(1, n + 1):</div><div>        <span class="kw">if</span> j <span class="kw">not in</span> used:</div><div>            used.append(j)</div><div>            hoan_vi(n, used, dem)</div><div>            used.pop()</div></div>
        focus: [1, 2]
        say: "Ta viết lại khung quay lui cho hoán vị, thêm một biến đếm tăng 1 mỗi lần hàm được gọi, tức mỗi nút của cây trạng thái. Dãy đang xây cũng là bảng đánh dấu, một số nằm trong dãy nghĩa là đã dùng."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>enumerate(cot)</code></td><td><code>enumerate</code> đánh số từng phần tử: mỗi cặp <code>r2, c2</code> là hàng và cột của một quân đã đặt</td><td>cot = [1, 3]: các cặp (0, 1) và (1, 3)</td></tr><tr><td><code>all(c != c2 and abs(c - c2) != r - r2 for ...)</code></td><td><code>all(...)</code> đúng khi điều kiện đúng với <b>mọi</b> quân đã đặt; <code>!=</code> là khác; <code>abs</code> là giá trị tuyệt đối; cùng đường chéo khi chênh cột bằng chênh hàng</td><td>quân ở (0, 1), thử cột 2 ở hàng 1: chênh cột 1 bằng chênh hàng 1, bị loại</td></tr></table>
        focus: ["1.1", "1.2", "1.3"]
        say: "Hàm quân hậu có hai chỗ cần đọc kỹ trước khi chạy. Hàm đánh số này cho từng quân đã đặt một cặp, là hàng và cột của quân đó. Hàm tất cả đúng khi điều kiện đúng với mọi quân đã đặt: khác cột, và chênh cột khác chênh hàng, vì chênh bằng nhau nghĩa là cùng đường chéo."
      - clear: true
        show: |
          <p><b>Bài tám quân hậu</b>: đặt $n$ quân, mỗi hàng một quân; <b>kiểm hợp lệ trước khi đi sâu</b> (không cùng cột, không cùng đường chéo với quân đã đặt):</p>
          <div class="code"><div><span class="kw">def</span> hau(n, cot, dem):</div><div>    dem[0] += 1</div><div>    r = len(cot)</div><div>    <span class="kw">if</span> r == n:</div><div>        <span class="kw">return</span></div><div>    <span class="kw">for</span> c <span class="kw">in</span> range(n):</div><div>        <span class="kw">if</span> all(c != c2 <span class="kw">and</span> abs(c - c2) != r - r2 <span class="kw">for</span> r2, c2 <span class="kw">in</span> enumerate(cot)):</div><div>            cot.append(c)</div><div>            hau(n, cot, dem)</div><div>            cot.pop()</div></div>
        focus: [1, 2]
        say: "Hàm thứ hai đặt n quân hậu, mỗi hàng một quân. Trước khi đi sâu, nó kiểm quân mới có cùng cột hoặc cùng đường chéo với quân đã đặt không, nếu có thì bỏ nhánh đó."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>(n ** (n + 1) - 1) // (n - 1)</code></td><td><code>**</code> là lũy thừa, <code>//</code> chia lấy phần nguyên: đó là tổng $1 + n + n^2 + \dots + n^n$, số nút nếu mọi nhánh đều đi tiếp</td><td>n = 2: <code>(2 ** 3 - 1) // 1</code> là 7 = 1 + 2 + 4</td></tr></table>
        focus: ["1.1", "1.2"]
        say: "Dòng in thứ hai có một biểu thức mới. Hai dấu sao là lũy thừa và hai dấu gạch chéo chia lấy phần nguyên, nên biểu thức này là tổng các lũy thừa của n, số nút nếu mọi nhánh đều đi tiếp."
      - clear: true
        show: |
          <p>Chạy cả hai, ba số sau tên là $n$, số nút, và số nút nếu không kiểm hợp lệ $(n^{n+1} - 1)/(n - 1)$:</p>
          <div class="code"><div><span class="kw">for</span> n <span class="kw">in</span> (7, 9):</div><div>    d = [0]</div><div>    hoan_vi(n, [], d)</div><div>    print("hoan vi", n, d[0])</div><div><span class="kw">for</span> n <span class="kw">in</span> (8, 10):</div><div>    d = [0]</div><div>    hau(n, [], d)</div><div>    print("hau", n, d[0], (n ** (n + 1) - 1) // (n - 1))</div></div>
          <div class="code"><div>hoan vi 7 13700</div><div>hoan vi 9 986410</div><div>hau 8 2057 19173961</div><div>hau 10 35539 11111111111</div></div>
        focus: [1, 3, 3]
        say: "Hoán vị 7 phần tử có 13700 nút, hoán vị 9 phần tử có gần một triệu nút, gấp 72 lần chỉ vì thêm hai phần tử. Bài tám quân hậu chỉ duyệt 2057 nút thay vì hơn mười chín triệu nút nếu không kiểm. Bài mười quân hậu duyệt 35539 nút thay vì hơn mười một tỉ nút."
      - clear: true
        show: |
          <table class="t"><tr><th>bài</th><th>$n$</th><th>số nút đếm được</th><th>nếu không cắt tỉa</th></tr>
          <tr><td>hoán vị</td><td>7</td><td>13 700</td><td>13 700 (không có gì để tỉa)</td></tr>
          <tr><td>hoán vị</td><td>9</td><td>986 410</td><td>986 410</td></tr>
          <tr><td>quân hậu</td><td>8</td><td>2 057</td><td>$(8^9 - 1)/7 = 19\,173\,961$ nút</td></tr>
          <tr><td>quân hậu</td><td>10</td><td>35 539</td><td>$(10^{11} - 1)/9 = 11\,111\,111\,111$ nút</td></tr></table>
          <div class="box key"><b>Đánh đổi:</b> cắt tỉa cứu bài quân hậu nhưng không cứu bài liệt kê hoán vị, vì mọi nhánh đều là nghiệm. Thêm hai phần tử vào hoán vị là ×72 nút; quay lui chỉ dùng được khi điều kiện hợp lệ tỉa được nhiều.</div>
        focus: [1, 1, 2]
        say: "Cắt tỉa cứu được bài quân hậu, vì phần lớn nhánh vi phạm luật sớm. Nó không cứu được bài liệt kê hoán vị, vì mọi nhánh đều dẫn tới nghiệm. Vì vậy quay lui chỉ dùng được khi điều kiện hợp lệ loại bỏ được nhiều nhánh ngay từ đầu."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "(lambda run: run(False) == [(1, 2, 3)])(lambda unmark: (lambda used, out: (lambda f: f(f, 1, ()) or out)(lambda f, i, x: [(used.__setitem__(j, True), out.append(x + (j,)) if i == 3 else f(f, i + 1, x + (j,)), used.__setitem__(j, False) if unmark else None) for j in (1, 2, 3) if not used[j]] and None))({1: False, 2: False, 3: False}, []))"
      - "len(list(__import__('itertools').product((1, 2, 3), repeat=3))) == 27 == 3**3 and math.factorial(3) == 6"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên bước ③ trả lại đánh dấu <b class="red">(sai)</b>
          <br><span class="note">Sau nghiệm đầu 1, 2, 3, mọi số đều đã bị đánh dấu → không nhánh nào đi tiếp được: chỉ in <b>1</b> nghiệm thay vì 6. Tổng quát: <b>bỏ sót nghiệm</b>.</span></div>
        say: "Lỗi thứ nhất, quên bước ba, không trả lại đánh dấu. Sau nghiệm đầu tiên 1, 2, 3, cả ba số đều bị đánh dấu mãi, nên không nhánh nào đi tiếp được, chương trình chỉ in một nghiệm thay vì sáu. Tổng quát, quên trả dấu sẽ làm bỏ sót nghiệm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Trả lại đánh dấu <b>trước</b> lời gọi đệ quy <b class="red">(sai)</b>
          <br><span class="note">Khi đi sâu, $j$ đã “sạch dấu” nên bị chọn lại: in ra các dãy lặp như 1, 1, 1. Phép thử đếm nghiệm bắt được:</span>
          $$3^3 = 27 \ne 3! = 6$$</div>
        say: "Lỗi thứ hai, trả lại đánh dấu trước lời gọi đệ quy. Khi đi sâu, số j đã sạch dấu nên bị chọn lại, chương trình in cả các dãy lặp như 1, 1, 1, tổng cộng 27 dãy. Phép thử đếm nghiệm bắt được ngay, vì 27 khác 6."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Kiểm điều kiện hợp lệ <b>sau</b> khi đã đi sâu <b class="red">(sai)</b>
          <br><span class="note">Vẫn ra đúng nghiệm nhưng mất hết lợi ích cắt tỉa: bài 4 quân hậu quay về duyệt cả 256 bộ.</span></div>
        say: "Lỗi thứ ba, kiểm điều kiện hợp lệ sau khi đã đi sâu tới lá. Kết quả vẫn đúng, nhưng mất hết lợi ích cắt tỉa, bài bốn quân hậu quay về duyệt cả 256 bộ."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin rằng quay lui “luôn nhanh” <b class="red">(sai)</b>
          <br><span class="note">Cắt tỉa chỉ bớt nút; với bài liệt kê hoán vị vẫn có $n!$ lá. Chi phí phải đánh giá theo số nút của cây.</span></div>
        say: "Lỗi thứ tư, tin rằng quay lui luôn nhanh. Cắt tỉa chỉ bớt nút, bài liệt kê hoán vị vẫn có n giai thừa lá. Chi phí phải đánh giá theo số nút của cây trạng thái."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
