        focus: [1, 2]
        say: "Phép thử đơn giản là chạy với n nhỏ rồi đếm số nghiệm in ra, vì số nghiệm đúng thì đã biết trước. Với hoán vị, số nghiệm phải đúng n giai thừa, n bằng 3 là 6, n bằng 4 là 24, và không dãy nào có phần tử lặp."
      - clear: true
        show: |
          <p><b>Phép thử 2</b> — đếm số lần đánh dấu và trả dấu, $n = 3$:</p>
          <table class="t"><tr><th>đại lượng</th><th>cách tính</th><th>giá trị</th></tr>
          <tr><td>số lần đánh dấu</td><td>số nút trừ gốc: $3 + 6 + 6$</td><td>15</td></tr>
          <tr><td>số lần trả dấu</td><td>mỗi lần đánh dấu được hoàn tác một lần</td><td>15</td></tr>
          <tr><td>mảng <code>used</code> lúc kết thúc</td><td>đánh dấu trừ trả dấu cho mỗi ô</td><td>toàn trống</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Phép thử thứ hai kiểm chính bước trả dấu, bằng cách đếm thay vì đọc mã. Mỗi nút trừ gốc sinh ra đúng một lần đánh dấu, nên có 3 cộng 6 cộng 6, bằng 15 lần. Chạy bằng máy cũng đếm được đúng 15 lần trả dấu, mỗi lần đánh dấu được hoàn tác đúng một lần. Vì vậy lúc chương trình kết thúc, mảng đánh dấu phải trống hoàn toàn, và nếu còn ô nào đã dùng thì chắc chắn có chỗ quên trả dấu."
