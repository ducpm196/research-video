          <tr><td>1</td><td>chỉ 0 (tỉa 1)</td><td>0 hoặc 1</td><td>100, 101</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án hỏi một, điều kiện hợp lệ là chỉ đặt số 1 khi số đứng trước không phải 1, và ta chạy tay, thử 0 trước rồi 1. Với x một bằng 0 và x hai bằng 0, vị trí thứ ba đặt được cả 0 lẫn 1, in ra 000 và 001. Với x hai bằng 1, vị trí thứ ba chỉ còn 0, in ra 010. Với x một bằng 1, vị trí thứ hai bị tỉa mất số 1, chỉ còn 0, rồi in ra 100 và 101."
      - clear: true
        show: |
          <p><b>Hỏi 2</b> — đếm bằng đường khác: lấy 8 dãy trừ các dãy có “11”:</p>
          <p>Các dãy có “11”: 011, 110, 111 — đúng 3 dãy.</p>
          $$2^3 - 3 = 8 - 3 = \hlg{5}$$
        focus: [1, [2, 3]]
        say: "Hỏi hai, quay lui in ra đúng 5 dãy, và ta kiểm con số này bằng một đường khác. Có tất cả 2 mũ 3 bằng 8 dãy, trong đó đúng ba dãy chứa hai số 1 liền nhau là 011, 110 và 111, nên còn 8 trừ 3, bằng 5 dãy, khớp."

  # ───────────────────────── 9b. TỰ LÀM ─────────────────────────
  - id: practice
    kind: practice
    title: "Tự làm: quay lui đếm hoán vị không có phần tử đứng yên, có và không cắt tỉa"
    lab: labs/CS112/L14
    steps:
      - show: |
          <p><b>Đề</b>: tạo <code>quay_lui.py</code> (xem <code>de.md</code>). Liệt kê hoán vị $x$ của $1 \dots n$ sao cho <b>không phần tử nào đứng yên</b>, tức $x[i] \ne i + 1$ với mọi vị trí $i$ (đếm từ 0, như trong <code>de.md</code>):</p>
          <ol><li>Hàm <code>liet_ke(n, cat_tia)</code> bằng quay lui đúng khung: đánh dấu, đi sâu, trả lại dấu; trả số nghiệm và số nút.</li>
          <li>Khi <code>cat_tia</code> đúng, bỏ ngay lựa chọn $j = i + 1$ trước khi đi sâu. In kết quả với $n = 4, 5, 6$.</li></ol>
        focus: [1, "2.1", "2.1", "2.2", "2.1", "2.2", "2.2"]
        pause: 600
        say: "Bây giờ đến phần bạn tự làm. Hãy liệt kê các hoán vị mà không phần tử nào đứng yên tại vị trí của nó, bằng quay lui đúng khung của bài. Vị trí ở đây đếm từ 0, nên phần tử đứng yên ở vị trí i là số j bằng i cộng 1. Viết một hàm trả về số nghiệm và số nút, có tuỳ chọn cắt tỉa ngay lựa chọn đó. Hàm đệ quy được viết ngay trong hàm chính, và tệp đề có mẹo kiểm mọi phần tử bằng một dòng. Rồi in kết quả với n bằng 4, 5 và 6. Dừng video và làm."
      - clear: true
        show: |
          <p><b>Kết quả mong đợi</b></p><div class="code"><div>n = 4: 9 nghiem, 31 nut khi cat tia, 65 nut khi khong cat, cung so nghiem: dung</div><div>n = 5: 44 nghiem, 147 nut khi cat tia, 326 nut khi khong cat, cung so nghiem: dung</div><div>n = 6: 265 nghiem, 853 nut khi cat tia, 1957 nut khi khong cat, cung so nghiem: dung</div></div><p class="note"><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b>. Chấm bằng Git Bash: <code>bash labs/cham.sh CS112 L14 quay_lui.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>CS112 L14 quay_lui.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
        focus: [2, 2, 3]
        say: "Đây là kết quả mong đợi. Hãy để ý cắt tỉa cho cùng số nghiệm nhưng số nút ít hơn gần một nửa, vì nhánh sai bị bỏ ngay khi vừa chọn. Bạn chạy rồi so từng dòng, hoặc chấm bằng lệnh ở chân màn hình, lệnh này chạy tệp chấm bài và in chữ ĐÚNG khi mọi dòng trùng."

