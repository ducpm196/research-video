  - {sentence: "Đáp số là giá trị lớn nhất của cả bảng, bằng 4, ví dụ 1, 4, 5, 9, và chi phí là Theta của n bình phương.", reason: "Theta đọc “Tê-ta” (probe p1: 8/8); ASR chép “teta/θ/tê ta”, cùng âm; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
