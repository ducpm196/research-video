  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">dãy con: giữ thứ tự, không cần liền</span><span class="a">→</span>
          <span class="n">tăng dài nhất: kết thúc tại $a_i$, $\Theta(n^2)$</span><span class="a">→</span>
          <span class="n">chung dài nhất: bằng thì đi chéo, khác thì bỏ một bên, $\Theta(mn)$</span><span class="a">→</span>
          <span class="n">truy vết ra lời giải</span></div>
        say: "Tổng kết chuỗi logic. Dãy con giữ thứ tự nhưng không cần liền nhau. Dãy con tăng dài nhất lập bảng theo phần tử kết thúc, tốn Theta của n bình phương. Xâu con chung dài nhất, ký tự bằng nhau thì đi chéo, khác thì bỏ một bên, tốn Theta của m nhân n. Cuối cùng truy vết để ra lời giải."
      - show: |
