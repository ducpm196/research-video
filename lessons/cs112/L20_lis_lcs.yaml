# Quy ước: dãy a đánh chỉ số từ 1; L[i] = độ dài dãy con tăng dài nhất KẾT THÚC tại aᵢ (tăng hẳn: aⱼ < aᵢ);
#   xâu X có m ký tự, Y có n ký tự, c[i][j] = độ dài xâu con chung dài nhất của i ký tự đầu của X và j ký tự đầu của Y;
#   hàng/cột 0 ứng với xâu rỗng. Tên tiếng Anh LIS, LCS chỉ trên màn hình.
# Nối bài trước (luật 17): bài 18 — quy hoạch động: hỏi bước cuối của lời giải tối ưu, lập bảng từ dưới lên;
#   bài 19 — bảng hai chiều, truy vết ngược từ ô đích; bài 3 — mảng đánh chỉ số.
objectives:
  - "Phân biệt dãy con (giữ thứ tự, không cần liền nhau) với đoạn con (liền nhau)"
  - "Lập bảng L[i] cho dãy con tăng dài nhất và đọc đáp số là giá trị lớn nhất của bảng"
  - "Lập bảng hai chiều c[i][j] cho xâu con chung dài nhất và truy vết ra một xâu con chung"
  - "Đếm số lần so sánh và số ô của bảng so với số dãy con vét cạn khi dãy dài ra, và nêu điểm gãy về bộ nhớ"
  - "Viết chương trình dãy con tăng hẳn dài nhất và xâu con chung dài nhất, đối chiếu với vét cạn"
