  - {sentence: "Bảng có 50 hàng, mỗi hàng có W cộng 1 cột, tính cả cột sức chứa bằng 0.", reason: "ASR chép “Bạn có 50 hàng, mỗi hàng có về đúc cộng 1 cục, tính cả cục sức chứa bằng không.” (0.769): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: bảng/bạn, cột/cục, cột/cục — NOT_VERIFIED bằng tai người"}
