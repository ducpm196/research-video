scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "20 thành phố: thử hết mất gần 4 năm"
    checks:
      - "math.factorial(4) == 24 and math.factorial(19) == 121645100408832000"
      - "round(math.factorial(19) / 1e9 / (365.25 * 86400), 1) == 3.9"
    steps:
      - show: |
          <p>Bài 15: người du lịch qua 5 thành phố, cố định điểm đầu → $4! = 24$ chu trình. Với 20 thành phố: $19! \approx 1{,}2 \cdot 10^{17}$ chu trình.</p>
          <div class="box warn">Máy thử $10^9$ chu trình mỗi giây vẫn cần khoảng <b>3,9 năm</b>. Có thuật toán nào nhanh hơn hẳn không? <b>Chưa ai biết.</b></div>
        focus: [1, 1, 2, 2]
        say: "Chào bạn, ở bài 15, người du lịch đi qua 5 thành phố, cố định điểm đầu thì có 24 chu trình. Với 20 thành phố, con số thành 19 giai thừa, khoảng 1 phẩy 2 nhân 10 mũ 17. Một máy thử một tỉ chu trình mỗi giây vẫn cần khoảng 3 phẩy 9 năm. Có thuật toán nào nhanh hơn hẳn không, thì đến nay chưa ai biết."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nhanh: đa thức và hàm mũ, các bài toán đã gặp"
    checks:
      - "20**3 == 8000 and 2**20 == 1048576"
    steps:
      - show: |
          <table class="t"><tr><th>đã học</th><th>điều cần nhớ</th><th>con số</th></tr>
          <tr><td>bài 2</td><td>mọi đa thức tăng chậm hẳn hàm mũ</td><td>$n = 20$: $\ n^3 = 8\,000$, $\ 2^n = 1\,048\,576$</td></tr>
          <tr><td>bài 15</td><td><b>người du lịch</b>: đi qua mỗi thành phố đúng một lần rồi về chỗ cũ, tổng chi phí nhỏ nhất. <b>Nhánh cận</b> (thử dần từng nhánh, bỏ nhánh chắc chắn không tốt hơn lời giải đang có) giải đúng 5 thành phố, nhưng tệ nhất vẫn thử rất nhiều nhánh</td><td>tối ưu 28</td></tr>
          <tr><td>bài 16</td><td><b>cái túi 0/1</b>: mỗi món lấy nguyên hoặc bỏ, tổng khối lượng không vượt sức chứa; tham lam theo đơn giá sai</td><td>160 so với 220</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3", "1.4"]
        say: "Ôn lại ba điều. Theo bài 2, mọi đa thức tăng chậm hẳn hàm mũ, với n bằng 20, n mũ 3 mới 8 nghìn, còn 2 mũ n đã hơn một triệu. Ở bài 15, bài người du lịch đòi đi qua mỗi thành phố đúng một lần rồi về chỗ cũ với tổng chi phí nhỏ nhất. Nhánh cận thử dần từng nhánh và bỏ nhánh chắc chắn không tốt hơn lời giải đang có. Nó đã giải đúng 5 thành phố với tối ưu 28, nhưng trường hợp tệ nhất vẫn phải thử rất nhiều nhánh. Ở bài 16, cái túi 0 1 cho mỗi món lấy nguyên hoặc bỏ, tổng khối lượng không vượt sức chứa, và tham lam theo đơn giá bị sai, được 160 trong khi tối ưu là 220."

  # ───────────────────────── 3. KÝ HIỆU: P, NP ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bài toán quyết định, lớp P và lớp NP"
    checks:
      - "(lambda C, t: sum(C[t[i]][t[i + 1]] for i in range(5)) == 28 <= 30 and len(set(t[:-1])) == 5)([[0, 20, 30, 10, 11], [15, 0, 16, 4, 2], [3, 5, 0, 2, 4], [19, 6, 18, 0, 3], [16, 4, 7, 16, 0]], [0, 3, 1, 4, 2, 0])"
      - "10 + 6 + 2 + 7 + 3 == 28"
    steps:
      - show: |
          <p><b>Bài toán quyết định</b>: đáp án là có hoặc không. Ví dụ: “có chu trình qua mọi thành phố với tổng $\le 30$ không?”</p>
          <p><b>P</b>: các bài toán quyết định <b>giải được</b> trong thời gian đa thức theo kích thước đầu vào, tức $O(\text{kích thước}^{\,k})$ với $k$ cố định.</p>
          <p><b>NP</b>: các bài toán mà khi đáp án là “có”, tồn tại một <b>chứng chỉ</b> để <b>kiểm</b> trong thời gian đa thức.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Bài toán quyết định là bài toán có đáp án có hoặc không, ví dụ có chu trình nào qua mọi thành phố với tổng không quá 30 không. Bài toán tối ưu nào cũng đổi được thành dạng này bằng cách thêm một ngưỡng. Lớp P gồm các bài toán quyết định giải được trong thời gian đa thức theo kích thước đầu vào. Lớp NP gồm các bài toán mà khi đáp án là có, tồn tại một chứng chỉ để kiểm lại trong thời gian đa thức. Chữ N viết tắt cho không tất định, không phải viết tắt của không đa thức."
      - show: |
          <p>Chứng chỉ cho ma trận bài 15: chu trình 1 → 4 → 2 → 5 → 3 → 1: kiểm đủ 5 thành phố, cộng $\ 10 + 6 + 2 + 7 + 3 = 28 \le 30$ ✓ — chỉ 5 phép cộng.</p>
          <div class="box key">$\text{P} \subseteq \text{NP}$: giải được nhanh thì kiểm được nhanh (tự giải lại). Còn $\text{P} = \text{NP}$ hay không thì <b>chưa ai chứng minh</b> — một trong bảy bài toán thiên niên kỷ (Clay, 2000).</div>
        introduces: [subseteq]
        focus: [1, 1, 2, 2]
        say: "Với ma trận ở bài 15, chứng chỉ là chu trình 1, 4, 2, 5, 3 rồi về 1. Kiểm lại chỉ cần xem đủ 5 thành phố và cộng 10, 6, 2, 7, 3 được 28, không quá 30, tức 5 phép cộng. Ký hiệu chữ U nằm ngang có gạch dưới đọc là nằm trong, P nằm trong NP, vì giải được nhanh thì kiểm được nhanh, cứ tự giải lại. Còn P có bằng NP hay không thì chưa ai chứng minh, đó là một trong bảy bài toán thiên niên kỷ được treo thưởng từ năm 2000."

  # ───────────────────────── 4. QUY DẪN ─────────────────────────
  - id: reduce
    kind: concept
    title: "Quy dẫn: biến bài này thành bài kia"
    steps:
      - show: |
          <div class="box key">$A \le_p B$ (A <b>quy dẫn</b> về B): có cách biến mọi đầu vào của A thành một đầu vào của B, trong thời gian đa thức, sao cho <b>đáp án giữ nguyên</b>.</div>
          <ul><li>B giải được nhanh $\implies$ A giải được nhanh (biến rồi giải B).</li>
          <li>A khó $\implies$ B khó (nếu B dễ thì A đã dễ).</li></ul>
        introduces: [polyred]
        focus: [1, 1, "2.1", "2.2"]
        say: "Công cụ chính để so độ khó là quy dẫn, ký hiệu dấu nhỏ hơn hoặc bằng có chữ p nhỏ ở chân, đọc là A quy dẫn về B. Nghĩa là có cách biến mọi đầu vào của A thành một đầu vào của B trong thời gian đa thức, sao cho đáp án giữ nguyên. Khi đó nếu B giải được nhanh thì A cũng giải được nhanh, cứ biến rồi giải B. Ngược lại, nếu A đã biết là khó thì B cũng khó, vì nếu B dễ thì A đã dễ."

  # ───────────────────────── 5. VÍ DỤ QUY DẪN ─────────────────────────
  - id: example
    kind: example
    title: "Tập độc lập và phủ đỉnh: hai mặt của một đồng xu"
    checks:
      - "(lambda E: (lambda subs: max(len(S) for S in subs if all(not (u in S and v in S) for u, v in E)) == 2 and min(len(S) for S in subs if all(u in S or v in S for u, v in E)) == 3 and all(all(not (u in S and v in S) for u, v in E) == all(u in ({1, 2, 3, 4, 5} - S) or v in ({1, 2, 3, 4, 5} - S) for u, v in E) for S in subs))([set(c) for r in range(6) for c in __import__('itertools').combinations(range(1, 6), r)]))([(1, 2), (2, 3), (3, 4), (4, 5), (5, 1)])"
      - "5 - 2 == 3 and 2 ** 5 == 32"
      - "(lambda E, V: (lambda ind: ind == [{1, 3}, {1, 4}, {2, 4}, {2, 5}, {3, 5}] and [sorted(V - S) for S in ind] == [[2, 4, 5], [2, 3, 5], [1, 3, 5], [1, 3, 4], [1, 2, 4]] and all(all(u in V - S or v in V - S for u, v in E) for S in ind))([set(c) for c in __import__('itertools').combinations(range(1, 6), 2) if not any(set(e) == set(c) for e in E)]))([(1, 2), (2, 3), (3, 4), (4, 5), (5, 1)], {1, 2, 3, 4, 5}) and 5 * 4 // 2 == 10 and 10 - 5 == 5"
    steps:
      - show: |
          <div class="row"><div class="col"><svg width="420" height="320" viewBox="0 0 420 320"><line x1="210" y1="45" x2="329" y2="131" stroke="#6b7280" stroke-width="4"/><line x1="329" y1="131" x2="283" y2="271" stroke="#6b7280" stroke-width="4"/><line x1="283" y1="271" x2="137" y2="271" stroke="#6b7280" stroke-width="4"/><line x1="137" y1="271" x2="91" y2="131" stroke="#6b7280" stroke-width="4"/><line x1="91" y1="131" x2="210" y2="45" stroke="#6b7280" stroke-width="4"/><circle cx="210" cy="45" r="30" fill="#d1fae5" stroke="#059669" stroke-width="5"/><text x="210" y="56" font-size="30" text-anchor="middle">1</text><circle cx="329" cy="131" r="30" fill="#ffedd5" stroke="#d97706" stroke-width="5"/><text x="329" y="142" font-size="30" text-anchor="middle">2</text><circle cx="283" cy="271" r="30" fill="#d1fae5" stroke="#059669" stroke-width="5"/><text x="283" y="282" font-size="30" text-anchor="middle">3</text><circle cx="137" cy="271" r="30" fill="#ffedd5" stroke="#d97706" stroke-width="5"/><text x="137" y="282" font-size="30" text-anchor="middle">4</text><circle cx="91" cy="131" r="30" fill="#ffedd5" stroke="#d97706" stroke-width="5"/><text x="91" y="142" font-size="30" text-anchor="middle">5</text></svg></div>
          <div class="col"><p><b>Tập độc lập</b> $S$: không hai đỉnh nào trong $S$ nối nhau. Ví dụ $\{1, 3\}$ (xanh).</p>
          <p><b>Phủ đỉnh</b>: mỗi cạnh có ít nhất một đầu trong tập. Ví dụ $\{2, 4, 5\}$ (cam).</p></div></div>
        introduces: [set]
        focus: ["1.1", "1.2", "1.2", "1.2"]
        say: "Xét chu trình năm đỉnh. Một tập độc lập là tập đỉnh mà không hai đỉnh nào trong đó nối nhau, ví dụ đỉnh 1 và đỉnh 3, tô xanh, ghi trong cặp ngoặc nhọn để chỉ một tập. Một phủ đỉnh là tập đỉnh mà mỗi cạnh có ít nhất một đầu nằm trong tập. Ví dụ ba đỉnh 2, 4, 5 tô cam phủ đủ năm cạnh."
      - clear: true
        show: |
          <div class="box key">$S$ độc lập $\iff$ $V \setminus S$ là phủ đỉnh. &nbsp; Vì vậy: “có tập độc lập $\ge k$ đỉnh?” $\iff$ “có phủ đỉnh $\le n - k$ đỉnh?”</div>
          <p>Chu trình 5 đỉnh: tập độc lập lớn nhất có 2 đỉnh, phủ đỉnh nhỏ nhất có $5 - 2 = 3$ đỉnh. Máy kiểm cả $2^5 = 32$ tập: đúng hết ✓</p>
        introduces: [setminus]
        focus: [1, 1, 1, 2, 2]
        say: "Mấu chốt là S độc lập khi và chỉ khi phần còn lại, ký hiệu V gạch chéo S, đọc là V bỏ đi S, là một phủ đỉnh. Lý do là một cạnh bị bỏ sót, không có đầu nào trong phần còn lại, nghĩa là cả hai đầu của nó đều nằm trong S, tức S không độc lập. Vì vậy câu hỏi có tập độc lập ít nhất k đỉnh tương đương câu hỏi có phủ đỉnh không quá n trừ k đỉnh, và phép biến chỉ là giữ nguyên đồ thị, đổi k. Với chu trình năm đỉnh, tập độc lập lớn nhất có 2 đỉnh, phủ đỉnh nhỏ nhất có 3. Máy đã kiểm cả 32 tập con, khẳng định đúng hết."
      - clear: true
        show: |
          <p><b>Làm bằng tay</b>: mọi tập độc lập 2 đỉnh của chu trình 1–2–3–4–5–1 và phần còn lại của chúng.</p>
          <table class="t"><tr><th>tập độc lập $S$</th><th>{1, 3}</th><th>{1, 4}</th><th>{2, 4}</th><th>{2, 5}</th><th>{3, 5}</th></tr>
          <tr><td>$V \setminus S$</td><td>{2, 4, 5}</td><td>{2, 3, 5}</td><td>{1, 3, 5}</td><td>{1, 3, 4}</td><td>{1, 2, 4}</td></tr>
          <tr><td>phủ đủ 5 cạnh?</td><td>có</td><td>có</td><td>có</td><td>có</td><td>có</td></tr></table>
          <p class="note">Có $\frac{5 \cdot 4}{2} = 10$ cặp đỉnh; 5 cặp kề nhau (5 cạnh) bị loại, còn đúng 5 cặp độc lập.</p>
        focus: [1, "2.1", "2.2", "2.3", 3]
        say: "Làm bằng tay một lần để thấy phép biến hoạt động. Chu trình năm đỉnh có đúng năm tập độc lập hai đỉnh, là 1 và 3, 1 và 4, 2 và 4, 2 và 5, 3 và 5. Lấy phần còn lại của từng tập, ta được năm tập ba đỉnh ở hàng dưới. Kiểm từng tập, cả năm đều chạm đủ năm cạnh, tức đều là phủ đỉnh. Con số 5 cũng đếm lại được, năm đỉnh có 5 nhân 4 chia 2, bằng 10 cặp, bỏ 5 cặp nối nhau bằng một cạnh, còn đúng 5 cặp độc lập."

  # ───────────────────────── 6. NP-ĐẦY ĐỦ ─────────────────────────
  - id: npc
    kind: concept
    title: "NP-đầy đủ: những bài toán khó nhất trong NP"
    steps:
      - show: |
          <div class="box key"><b>NP-đầy đủ</b>: thuộc NP, và <b>mọi</b> bài toán NP quy dẫn được về nó. <b>NP-khó</b>: mọi bài NP quy dẫn được về nó (không cần thuộc NP).</div>
          <table class="t"><tr><th>năm</th><th>kết quả</th></tr>
          <tr><td>1971</td><td>Cook: bài toán gán đúng/sai cho các biến để một biểu thức thành đúng là NP-đầy đủ.</td></tr>
          <tr><td>1972</td><td>Karp: 21 bài NP-đầy đủ, trong đó có phủ đỉnh, chu trình qua mọi đỉnh, tổng tập con.</td></tr>
          <tr><td>—</td><td>Người du lịch dạng quyết định: NP-đầy đủ.</td></tr>
          <tr><td>1979</td><td>Khachiyan: quy hoạch tuyến tính (bài 22) <b>thuộc P</b>, dù đơn hình tệ nhất là hàm mũ.</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bài toán NP đầy đủ là bài thuộc NP, và mọi bài toán NP đều quy dẫn được về nó, nên nó khó nhất trong lớp. Nếu chỉ cần điều kiện thứ hai thì gọi là NP khó. Năm 1971, bài toán gán đúng sai cho các biến để một biểu thức thành đúng được chứng minh là NP đầy đủ. Năm 1972, thêm 21 bài nữa, trong đó có phủ đỉnh, chu trình qua mọi đỉnh và tổng tập con. Bài người du lịch dạng quyết định cũng là NP đầy đủ. Ngược lại, quy hoạch tuyến tính ở bài 22 thuộc P từ năm 1979, dù thuật toán đơn hình có thể chạy hàm mũ ở trường hợp tệ nhất."
      - show: |
          <div class="box warn">Hệ quả: tìm được thuật toán đa thức cho <b>một</b> bài NP-đầy đủ ⟹ $\text{P} = \text{NP}$. Sau hơn 50 năm chưa ai làm được → gặp bài NP-khó, đừng mất thời gian tìm thuật toán đa thức tổng quát.</div>
        say: "Hệ quả quan trọng là nếu tìm được thuật toán đa thức cho chỉ một bài NP đầy đủ, thì P bằng NP. Hơn 50 năm chưa ai làm được, nên khi gặp một bài NP khó, đừng mất thời gian tìm thuật toán đa thức tổng quát."

  # ───────────────────────── 7. GIẢ ĐA THỨC ─────────────────────────
  - id: pseudo
    kind: formula
    title: "Giả đa thức: cái túi 0/1 và bảng n · W"
    checks:
      - "(lambda items, W: (lambda dp: dp[W])(__import__('functools').reduce(lambda dp, it: [max(dp[c], dp[c - it[0]] + it[1]) if c >= it[0] else dp[c] for c in range(W + 1)], items, [0] * (W + 1))))([(10, 60), (20, 100), (30, 120)], 50) == 220"
      - "(10**9).bit_length() == 30 and 100 * 10**9 == 10**11 and 3 * 51 == 153"
    steps:
      - show: |
          <p>Cái túi 0/1 (bài 16): quy hoạch động như bài 18, bảng $n$ hàng, $W + 1$ cột ($W$ = sức chứa): $\ \Theta(n \cdot W)$. Ô hàng $i$, cột $c$ = giá trị lớn nhất khi chỉ dùng $i$ món đầu với sức chứa $c$, tính từ hai ô của hàng trên (bỏ món $i$, hoặc lấy món $i$). Ví dụ bài 16: bảng $3 \cdot 51$ ô cho đúng 220.</p>
          <div class="box key">Nhưng $W$ chỉ cần $\approx \log_2 W$ bit để ghi: $W = 10^9$ chỉ <b>30 bit</b>, mà bảng có $10^9 + 1$ cột → 100 món khoảng $10^{11}$ ô. Thời gian là hàm mũ theo số bit: <b>giả đa thức</b>.</div>
        focus: [1, 1, 1, 1, 2, 2]
        say: "Cái túi 0 1 của bài 16 giải được bằng quy hoạch động như bài 18, với bảng n hàng và W cộng 1 cột, tức Theta của n nhân W. Ở đây W là sức chứa, và ô hàng i cột c ghi giá trị lớn nhất khi chỉ dùng i món đầu với sức chứa c. Ô đó tính từ hai ô của hàng trên, ứng với bỏ hoặc lấy món thứ i. Ở ví dụ của bài 16, bảng 3 nhân 51 ô cho đúng đáp án 220. Nhưng W chỉ cần khoảng lôgarit cơ số 2 của W bit để ghi, ví dụ một tỉ chỉ cần 30 bit, mà bảng có tới một tỉ cột, nên 100 món cần khoảng 10 mũ 11 ô. Vì thời gian tăng theo hàm mũ của số bit, thuật toán này gọi là giả đa thức, và cái túi 0 1 vẫn là NP khó."
      - clear: true
        show: |
          <table class="t"><tr><th>gặp bài NP-khó</th><th>làm gì</th><th>ví dụ đã học</th></tr>
          <tr><td>đầu vào nhỏ</td><td>vét cạn có tỉa nhánh</td><td>nhánh cận, bài 15</td></tr>
          <tr><td>số trong đầu vào nhỏ</td><td>thuật toán giả đa thức</td><td>bảng $n \cdot W$ khi $W$ nhỏ</td></tr>
          <tr><td>chấp nhận gần đúng</td><td>tham lam hoặc xấp xỉ có bảo đảm</td><td>tham lam theo đơn giá cho cái túi 0/1, bài 16: 160 so với tối ưu 220</td></tr></table>
        focus: [0, 0, "1.2", "1.3", "1.4", "1.4"]
        say: "Vậy khi gặp một bài NP khó thì làm gì? Vì không có thuật toán nhanh cho mọi đầu vào, ta khai thác đặc điểm của dữ liệu. Nếu đầu vào nhỏ, vét cạn có tỉa nhánh như nhánh cận ở bài 15. Nếu các con số trong đầu vào nhỏ, dùng thuật toán giả đa thức như bảng n nhân W. Nếu chấp nhận lời giải gần đúng, dùng tham lam hoặc các thuật toán xấp xỉ có bảo đảm sai số. Ví dụ tham lam theo đơn giá cho cái túi 0 1 được 160, so với tối ưu 220."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: kiểm chứng chỉ, kiểm chiều quy dẫn"
    checks:
      - "all(not (u in {1, 3} and v in {1, 3}) for u, v in [(1, 2), (2, 3), (3, 4), (4, 5), (5, 1)]) and all(u in {2, 4, 5} or v in {2, 4, 5} for u, v in [(1, 2), (2, 3), (3, 4), (4, 5), (5, 1)])"
      - "[(u in {1, 3}) + (v in {1, 3}) for u, v in [(1, 2), (2, 3), (3, 4), (4, 5), (5, 1)]] == [1, 1, 1, 0, 1] and [[x for x in (u, v) if x in {2, 4, 5}] for u, v in [(1, 2), (2, 3), (3, 4), (4, 5), (5, 1)]] == [[2], [2], [4], [4, 5], [5]] and 5 - 2 == 3"
    steps:
      - show: |
          <table class="t"><tr><th>cạnh</th><th>(1, 2)</th><th>(2, 3)</th><th>(3, 4)</th><th>(4, 5)</th><th>(5, 1)</th></tr>
          <tr><td>số đầu trong $\{1, 3\}$</td><td>1</td><td>1</td><td>1</td><td>0</td><td>1</td></tr>
          <tr><td>đầu nằm trong $\{2, 4, 5\}$</td><td>2</td><td>2</td><td>4</td><td>4, 5</td><td>5</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Tự kiểm ba điều, vì sai chiều quy dẫn là kết luận ngược hẳn. Một, chứng chỉ gồm đỉnh 1 và 3 độc lập, duyệt 5 cạnh thấy không cạnh nào có cả hai đầu trong tập, tốn Theta của m. Hai, phần còn lại gồm 2, 4, 5 chạm đủ cả 5 cạnh, như hàng dưới chỉ rõ từng đầu."
      - show: |
          <div class="box key"><b>Phép thử 3</b> — đúng chiều: muốn kết luận B khó, câu phải có dạng “bài đã biết là khó $\le_p$ B”.</div>
          $$\text{tập độc lập} \le_p \text{phủ đỉnh}: \quad (G,\ k) \to (G,\ n - k), \qquad (C_5,\ 2) \to (C_5,\ 5 - 2 = 3)$$
        focus: [1, 2, 2, 2]
        say: "Ba, muốn kết luận B khó thì câu phải có dạng một bài đã biết là khó quy dẫn về B. Ở ví dụ, phép biến giữ nguyên đồ thị G và đổi ngưỡng k thành n trừ k. Với chu trình năm đỉnh, viết là C chỉ số 5, câu hỏi có tập độc lập 2 đỉnh thành câu hỏi có phủ đỉnh 3 đỉnh. Phép biến này chỉ tốn một phép trừ, nên chắc chắn là đa thức."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi người mới hay mắc"
    checks:
      - "(10**9).bit_length() == 30"
      - "[(10**k).bit_length() for k in (3, 6, 9)] == [10, 20, 30] and [round(math.log10(100 * (10**k + 1))) for k in (3, 6, 9)] == [5, 8, 11]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “NP nghĩa là không giải được trong thời gian đa thức” <b class="red">(sai)</b>
          <br><span class="note">NP = kiểm được chứng chỉ trong thời gian đa thức. Mọi bài thuộc P đều thuộc NP.</span></div>
        say: "Lỗi thứ nhất, hiểu NP là không giải được trong thời gian đa thức. Thật ra NP là kiểm được chứng chỉ trong thời gian đa thức, và mọi bài thuộc P đều thuộc NP."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “NP-khó thì không giải được” <b class="red">(sai)</b>
          <br><span class="note">Bài 15 giải đúng người du lịch 5 thành phố. NP-khó chỉ nói: chưa biết thuật toán đa thức cho <b>mọi</b> đầu vào.</span></div>
        say: "Lỗi thứ hai, nghĩ NP khó là không giải được. Bài 15 đã giải đúng người du lịch 5 thành phố, NP khó chỉ nói chưa biết thuật toán đa thức cho mọi đầu vào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quy dẫn ngược chiều <b class="red">(sai)</b>
          <br><span class="note">Quy B về một bài khó (B $\le_p$ khó) không nói gì về độ khó của B — bài dễ nào cũng quy được về bài khó.</span></div>
        say: "Lỗi thứ ba, quy dẫn ngược chiều. Quy B về một bài khó không nói gì về độ khó của B, vì bài dễ nào cũng quy được về một bài khó."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> “Cái túi 0/1 chạy $\Theta(n \cdot W)$, vậy là đa thức” <b class="red">(sai)</b>
          <br><span class="note">W ghi bằng khoảng $\log_2 W$ bit; $\Theta(n \cdot W)$ là hàm mũ theo số bit đó.</span>
          <table class="t"><tr><th>$W$</th><th>$10^3$</th><th>$10^6$</th><th>$10^9$</th></tr>
          <tr><td>số bit để ghi $W$</td><td>10</td><td>20</td><td>30</td></tr>
          <tr><td>số ô, 100 món</td><td>$\approx 10^5$</td><td>$\approx 10^8$</td><td>$\approx 10^{11}$</td></tr></table></div>
        say: "Lỗi thứ tư, nói cái túi 0 1 chạy Theta của n nhân W nên là đa thức. W chỉ cần khoảng lôgarit cơ số 2 của W bit để ghi, nên n nhân W là hàm mũ theo số bit đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5.</b> “Đã chứng minh P ≠ NP” <b class="red">(sai)</b>
          <br><span class="note">Đa số nhà nghiên cứu tin vậy, nhưng đến nay chưa có chứng minh. Câu đúng: “chưa biết”.</span></div>
        say: "Lỗi thứ năm, nói đã chứng minh P khác NP. Đa số nhà nghiên cứu tin như vậy, nhưng đến nay chưa có chứng minh, câu đúng là chưa biết."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "6 - 3 == 3 and 50 * 1001 == 50050 and (10**12).bit_length() == 40"
      - "round(2**39 / 1e11, 1) == 5.5 and 2**39 < 10**12 < 2**40 and round(2**40 / 1e12, 1) == 1.1 and 6 - 2 == 4 and round(50 * (10**12 + 1) / 1e13) == 5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Một đồ thị 6 đỉnh có tập độc lập lớn nhất gồm 3 đỉnh. Phủ đỉnh nhỏ nhất có bao nhiêu đỉnh?</td></tr>
          <tr><td>2</td><td>Cái túi 0/1 với 50 món, $W = 1000$: bảng có bao nhiêu ô? Nếu $W = 10^{12}$ thì cần bao nhiêu bit để ghi $W$?</td></tr>
          <tr><td>3</td><td>Biết bài X NP-khó và có quy dẫn $X \le_p Y$. Kết luận gì về Y?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một đồ thị 6 đỉnh có tập độc lập lớn nhất gồm 3 đỉnh, vậy phủ đỉnh nhỏ nhất có bao nhiêu đỉnh? Câu hai, cái túi 0 1 với 50 món và W bằng 1000 thì bảng có bao nhiêu ô, và nếu W bằng 10 mũ 12 thì cần bao nhiêu bit để ghi W? Câu ba, biết bài X là NP khó và X quy dẫn về Y, ta kết luận gì về Y? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Tập độc lập lớn nhất $S$ có 3 đỉnh, nên $V \setminus S$ là một phủ đỉnh:</p>
          $$6 - 3 = \hlg{3} \text{ đỉnh}$$
          <p class="note">Không thể ít hơn: nếu có phủ đỉnh 2 đỉnh thì phần còn lại là tập độc lập $6 - 2 = 4$ đỉnh, trái với “lớn nhất là 3”.</p>
        focus: [1, 2, 3, 3]
        say: "Đáp án câu một, phủ đỉnh nhỏ nhất có 6 trừ 3, bằng 3 đỉnh. Lý do là phần còn lại của tập độc lập lớn nhất là một phủ đỉnh. Ngược lại, không thể có phủ đỉnh chỉ 2 đỉnh, vì khi đó phần còn lại là một tập độc lập 4 đỉnh. Điều đó trái với giả thiết tập độc lập lớn nhất chỉ có 3 đỉnh."
      - show: |
          <table class="t"><tr><th>② cái túi 0/1, 50 món</th><th>tính</th></tr>
          <tr><td>số ô của bảng, $W = 1000$</td><td>$50 \cdot (1000 + 1) = \hlg{50\,050}$</td></tr>
          <tr><td>số bit để ghi $W = 10^{12}$</td><td>$2^{39} \approx 5{,}5 \cdot 10^{11} < 10^{12} < 2^{40} \approx 1{,}1 \cdot 10^{12}$ → $\hlg{40}$ bit</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Câu hai, bảng có 50 nhân 1001, bằng 50 nghìn 50 ô, còn 10 mũ 12 cần 40 bit vì 2 mũ 40 xấp xỉ 1 phẩy 1 nhân 10 mũ 12. Bảng có 50 hàng, mỗi hàng có W cộng 1 cột, tính cả cột sức chứa bằng 0. Để biết số bit, so với các lũy thừa của 2, 2 mũ 39 khoảng 5 phẩy 5 nhân 10 mũ 11, còn nhỏ hơn 10 mũ 12. Còn 2 mũ 40 đã vượt qua, nên cần đúng 40 bit, trong khi bảng sẽ cần tới khoảng 5 nhân 10 mũ 13 ô."
      - show: |
          <div class="box ok">③ Y cũng NP-khó: mọi bài NP quy dẫn được về X, rồi X quy dẫn về Y → mọi bài NP quy dẫn được về Y.</div>
        say: "Câu ba, Y cũng là NP khó, vì nếu Y dễ thì X đã dễ. Nói chính xác, mọi bài NP quy dẫn được về X, rồi nối tiếp phép biến từ X sang Y, nên mọi bài NP quy dẫn được về Y. Hai phép biến đa thức nối tiếp nhau vẫn là đa thức."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
