source: "audit/cs112/verify_cs112_p2.py N1–N5 (vét cạn: chu trình TSP, mọi tập con của chu trình 5 đỉnh, bảng cái túi); S. Cook, 1971 (SAT là NP-đầy đủ); R. Karp, 1972 (21 bài NP-đầy đủ); L. Khachiyan, 1979 (quy hoạch tuyến tính giải được trong thời gian đa thức); Clay Mathematics Institute, các bài toán thiên niên kỷ, 2000; định nghĩa theo Cormen, Leiserson, Rivest, Stein, Introduction to Algorithms, chương 34"
assumes: [cdot, sub, bigO, bigTheta, log, factorial, approx, in, implies, iff, power]
# Quy ước: “bài toán quyết định” = đáp CÓ/KHÔNG; “kích thước đầu vào” = số bit để ghi đầu vào; “đa thức” = O(kích thước mũ k), k hằng;
#   NP đọc “en-pê” (lexicon CS112, dò p5_do_thi 8/8). Tên Cook, Karp, Khachiyan chỉ hiện trên màn hình (chưa dò phát âm).
# Đỉnh chu trình 5 đỉnh đánh số 1..5 (đỉnh i nối i + 1 và 5 nối 1).
# Bài mới ngoài bản thảo (curriculum/cs112.yaml Phần 7).
# Nối bài trước (luật 17): bài 15 — nhánh cận cho người du lịch, ma trận 5 thành phố, tối ưu 28; bài 16 — cái túi 0/1 tham lam sai
#   (160 < 220); bài 18 — quy hoạch động lập bảng; bài 2 — đa thức tăng chậm hẳn hàm mũ; bài 22 — đơn hình có thể đi qua số đỉnh mũ.
objectives:
  - "Phân biệt bài toán giải được nhanh (P) và bài toán kiểm được nhanh (NP), và biết P ⊆ NP còn P = NP là câu hỏi mở"
  - "Kiểm một chứng chỉ trong thời gian đa thức"
  - "Thực hiện một phép quy dẫn (tập độc lập ↔ phủ đỉnh) và dùng đúng chiều để kết luận một bài toán là khó"
  - "Nhận ra thuật toán giả đa thức (cái túi 0/1 Θ(n·W)) và các hướng xử lý khi gặp bài toán NP-khó"
