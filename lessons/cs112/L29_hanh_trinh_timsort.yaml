          <table class="t"><tr><th>bước</th><th>ngăn xếp (đỉnh bên phải)</th><th>xét</th></tr>
          <tr><td>Bước 1. vừa đẩy 30</td><td>120, 80, 25, 20, 30</td><td>25 không lớn hơn 20 + 30, và 25 nhỏ hơn 30 → gộp 25 với 20</td></tr>
          <tr><td>Bước 2. sau khi gộp</td><td>120, 80, 45, 30</td><td>80 lớn hơn 45 + 30 = 75 ✓; 45 lớn hơn 30 ✓ → <b>dừng</b></td></tr>
          <tr><td>Bước 3. nhìn sâu thêm một tầng</td><td>120 so với 80 + 45</td><td>120 không lớn hơn $\hl{125}$: bất biến <b>hỏng</b>, mà mã không xét tới</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng ba, bài báo hội nghị năm 2015 ghi rằng hàm sắp xếp của Java chạy hàng tỉ lượt mỗi ngày. Nhóm tác giả định chứng minh nó đúng bằng một công cụ chứng minh cho Java. Mã có chú thích rằng các bất biến được bảo đảm sau mỗi lần gộp. Bước một, ngăn xếp là 120, 80, 25, 20 và vừa đẩy 30, vì 25 không lớn hơn 20 cộng 30 và nhỏ hơn 30, nên gộp 25 với 20. Bước hai, ngăn xếp còn 120, 80, 45, 30, ba đoạn trên cùng thoả bất biến, nên mã dừng. Bước ba, nhìn sâu thêm một tầng, 120 không lớn hơn 80 cộng 45 bằng 125, bất biến đã hỏng mà mã không hề xét tới."
      - clear: true
        show: |
          <table class="t"><tr><th>cỡ mảng (trường hợp tệ nhất dựng được)</th><th>số ô cần</th><th>mã Java cấp</th></tr>
          <tr><td>65 536 = 2 mũ 16</td><td>21</td><td>19 → một báo cáo lỗi trước đó đã nâng lên 24</td></tr>
          <tr><td>67 108 864 = 2 mũ 26</td><td>$\hl{41}$</td><td>40 → lỗi vượt chỉ số mảng</td></tr></table>
          <p>Bài báo: kiểm thử rộng rãi không lộ ra lỗi, vì phản ví dụ nhỏ nhất là mảng hơn 67 triệu phần tử có cấu trúc rất phức tạp. Còn đặc tả hình thức cho thấy bất biến không được giữ <b>chỉ trong một buổi chiều</b>; cả bài chứng minh có hơn 2,2 triệu bước, 460 dòng đặc tả cho 928 dòng mã.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Tệ hơn, bất biến hỏng làm ngăn xếp cao hơn dự tính. Với mảng 65 nghìn 536 phần tử, trường hợp tệ nhất cần 21 ô, trong khi mã cấp 19, và một báo cáo lỗi trước đó đã nâng lên 24. Với mảng 2 mũ 26 phần tử cần 41 ô, mã cấp 40, và chương trình dừng vì vượt chỉ số mảng. Bài báo viết rằng kiểm thử rộng rãi không lộ ra lỗi, vì phản ví dụ nhỏ nhất là mảng hơn 67 triệu phần tử có cấu trúc rất phức tạp. Còn đặc tả hình thức cho thấy bất biến không được giữ chỉ trong một buổi chiều, dù cả bài chứng minh có hơn 2 phẩy 2 triệu bước, với 460 dòng đặc tả cho 928 dòng mã."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý</th><th>ai, khi nào</th></tr>
          <tr><td><b>sửa gốc</b>: xét bất biến trên <b>4</b> đoạn trên cùng thay vì 3; chứng minh bằng máy rằng bản sửa giữ bất biến</td><td>nhóm tác giả, bài báo năm 2015</td></tr>
          <tr><td>ngôn ngữ gốc cũng có lỗi (khó xảy ra hơn vì dùng số nguyên 64 bit, ngăn xếp lớn); sửa cùng cách</td><td>commit ngày 25/2/2015, phát hành trong bản 3.4.4</td></tr>
          <tr><td>Java 2015: báo cáo lỗi tạo 6/2, đóng 12/2; lần này Java <b>chỉ nới</b> cỡ ngăn xếp cấp sẵn, chưa sửa bất biến</td><td>bản sửa ghi cho JDK 9</td></tr>
          <tr><td>Java 2018: một nhóm nghiên cứu khác chỉ ra cách nới cỡ ấy vẫn sai; Java thêm phép xét 4 đoạn — mã hiện hành có cả hai (24 và 49 ô, cộng phép xét 4 đoạn)</td><td>báo cáo tạo 28/5/2018, bản sửa ghi cho JDK 11</td></tr></table>
          <p class="note">Thực hành: mã lõi được hàng tỉ lượt dùng đáng được chứng minh, không chỉ kiểm thử; sửa nguyên nhân thay vì chỉ nới tài nguyên. Điều kiện: chứng minh tốn công — nhóm vẫn không chứng minh xong hai hàm trộn dài hơn 100 dòng.</p>
        focus: ["1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Cách xử lý của nhóm tác giả là sửa gốc, xét bất biến trên 4 đoạn trên cùng thay vì 3, và chứng minh bằng máy rằng bản sửa giữ được bất biến. Ngôn ngữ gốc cũng có lỗi này, dù khó xảy ra hơn, và được sửa cùng cách trong một bản sửa mã ngày 25 tháng 2 năm 2015. Bên Java, báo cáo lỗi được tạo ngày 6 tháng 2 và đóng ngày 12 tháng 2 năm 2015, nhưng lần đó Java chỉ nới cỡ ngăn xếp cấp sẵn mà chưa sửa bất biến. Năm 2018, một nhóm nghiên cứu khác chỉ ra cách nới ấy vẫn sai, và Java mới thêm phép xét 4 đoạn, nên mã hiện hành có cả hai. Thực hành rút ra là mã lõi được hàng tỉ lượt dùng đáng được chứng minh, không chỉ kiểm thử, và nên sửa nguyên nhân thay vì chỉ nới tài nguyên. Điều kiện là chứng minh tốn công, chính nhóm vẫn không chứng minh xong hai hàm trộn dài hơn 100 dòng."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2021 — ổn định: trộn theo lũy thừa của 2"
    stage: {year: "2021", scale: "ngôn ngữ gốc đổi chiến lược trộn (bpo-34561, commit 6/9/2021; bản thử 3.11.0a1 ngày 5/10/2021)", source: "[PS21]", practice: "thay quy tắc khó lập luận bằng quy tắc có chứng minh gần tối ưu; giữ ngăn xếp với bất biến đơn giản: “sức” giảm dần từ đỉnh xuống"}
    checks:
      - "(pw := lambda s1, n1, n2, n: next(L for L in range(1, 64) if math.floor(Fraction(2 * (s1 + n1) + n2, 2 * n) * 2 ** L) > math.floor(Fraction(2 * s1 + n1, 2 * n) * 2 ** L))) and pw(0, 4, 4, 8) == 1"
      - "(pw := lambda s1, n1, n2, n: next(L for L in range(1, 64) if math.floor(Fraction(2 * (s1 + n1) + n2, 2 * n) * 2 ** L) > math.floor(Fraction(2 * s1 + n1, 2 * n) * 2 ** L))) and [pw(0, 2, 2, 8), pw(2, 2, 4, 8)] == [2, 1]"
      - "Fraction(1, 8) < Fraction(1, 4) <= Fraction(3, 8) and Fraction(3, 8) < Fraction(1, 2) <= Fraction(6, 8)"
    steps:
      - show: |
          <p><b>Tệp mô tả hiện hành</b> kể lại: bản đầu tiên dùng “điều đầu tiên nghĩ ra mà không quá tệ”, dựa lỏng trên dãy Fibonacci; nó khó lập luận, và tinh vi tới mức bất biến không thật sự được giữ — các nhà nghiên cứu phát hiện ra khi cố hoàn thành một chứng minh bằng máy.</p>
          <p>Phát hiện ấy khơi ra hơn một chục cách mới. Năm 2021, ngôn ngữ gốc chọn cách trộn theo <b>lũy thừa của 2</b> của hai tác giả Munro và Wild: <b>chứng minh được</b> là gần tối ưu theo độ đo entropy của độ dài các đoạn.</p>
          <p>Ghi chú phát hành: phần lớn chương trình sẽ không thấy khác biệt thời gian đáng kể, nhưng có thể nhanh hơn rõ ở những ca mà cách cũ đặc biệt tệ.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng bốn, tệp mô tả hiện hành của ngôn ngữ gốc kể lại rằng bản đầu dùng điều đầu tiên nghĩ ra mà không quá tệ, dựa lỏng trên dãy Fibonacci. Nó khó lập luận, và tinh vi tới mức bất biến không thật sự được giữ, điều các nhà nghiên cứu phát hiện khi cố hoàn thành một chứng minh bằng máy. Phát hiện ấy khơi ra hơn một chục cách mới, và năm 2021, ngôn ngữ gốc chọn cách trộn theo lũy thừa của 2. Cách này chứng minh được là gần tối ưu theo độ đo entropy của độ dài các đoạn. Ghi chú phát hành nói phần lớn chương trình sẽ không thấy khác biệt đáng kể, nhưng có thể nhanh hơn rõ ở những ca mà cách cũ đặc biệt tệ."
      - clear: true
        show: |
          <p><b>Sức</b> của chỗ nối giữa hai đoạn liền kề = độ sâu của chỗ nối ấy trong cây trộn lý tưởng (gốc có sức 1). Lấy điểm giữa mỗi đoạn, chia cho n: sức là số L nhỏ nhất để giữa hai điểm có một phân số dạng J chia 2 mũ L.</p>
          <table class="t"><tr><th>bước: mảng n = 8</th><th>điểm giữa chia n</th><th>sức</th></tr>
          <tr><td>Bước 1. hai đoạn 4 và 4</td><td>2/8 và 6/8; giữa chúng có 1/2</td><td>$\hlg{1}$: gốc của cây</td></tr>
          <tr><td>Bước 2. ba đoạn 2, 2, 4: chỗ nối đầu</td><td>1/8 và 3/8; giữa chúng có 1/4 = 2/8</td><td>$\hl{2}$</td></tr>
          <tr><td>Bước 3. chỗ nối thứ hai</td><td>3/8 và 6/8; giữa chúng có 1/2</td><td>1</td></tr></table>
          <p class="note">Ngăn xếp chỉ giữ một bất biến: sức giảm dần tính từ đỉnh. Chỗ nối sức 2 nằm sâu hơn nên được trộn trước, rồi mới tới gốc. Điều kiện: chưa phải tối ưu tuyệt đối — tối ưu thật cần biết trước mọi đoạn, tốn thời gian bình phương theo số đoạn.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3, 3]
        say: "Ý chính của cách mới là sức của chỗ nối giữa hai đoạn liền kề, tức độ sâu của chỗ nối ấy trong cây trộn lý tưởng, với gốc có sức 1. Lấy điểm giữa mỗi đoạn chia cho n, sức là số L nhỏ nhất để giữa hai điểm có một phân số dạng J chia 2 mũ L. Bước một, mảng 8 phần tử gồm hai đoạn 4 và 4 có điểm giữa 2 phần 8 và 6 phần 8, giữa chúng có một phần hai, nên sức bằng 1, gốc của cây. Bước hai, với ba đoạn 2, 2, 4, chỗ nối đầu có điểm giữa 1 phần 8 và 3 phần 8, giữa chúng có một phần tư, nên sức bằng 2. Bước ba, chỗ nối thứ hai có 3 phần 8 và 6 phần 8, chứa một phần hai, sức bằng 1. Ngăn xếp chỉ giữ một bất biến, sức giảm dần tính từ đỉnh, nên chỗ nối sức 2 nằm sâu hơn được trộn trước, rồi mới tới gốc. Điều kiện là cách này chưa tối ưu tuyệt đối, vì tối ưu thật cần biết trước mọi đoạn."

