scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một lỗi chỉ hiện ra với mảng 67 triệu phần tử"
    checks:
      - "2 ** 26 == 67108864"
      - "41 > 40"
    steps:
      - show: |
          <p>Năm 2015, một nhóm nghiên cứu thử <b>chứng minh bằng máy</b> rằng hàm sắp xếp chuẩn của Java là đúng. Phép chứng minh không khép lại được — và chỉ ra một lỗi.</p>
          <p>Phản ví dụ nhỏ nhất là một mảng <b>hơn 67 triệu</b> phần tử. Với mảng 2 mũ 26 = 67 108 864 phần tử dựng theo trường hợp tệ nhất, hàm cần <b>41</b> ô ngăn xếp, mã chỉ cấp <b>40</b>, nên chương trình dừng vì vượt chỉ số mảng.</p>
          <p>Nhóm viết: kiểm thử rộng rãi đã không lộ ra lỗi này — và lỗi có mặt cả ở ngôn ngữ gốc từ khi thuật toán ra đời.</p>
          <div class="box key">Hôm nay: năm chặng của Timsort, 2002 → 2025 — một thuật toán thật lớn lên, được dùng khắp nơi, bị chứng minh là sai, rồi được sửa và tiếp tục tốt lên.</div>
        focus: [1, 1, 2, 2, 3, 4]
        say: "Chào bạn, năm 2015, một nhóm nghiên cứu thử chứng minh bằng máy rằng hàm sắp xếp chuẩn của Java là đúng. Phép chứng minh không khép lại được, và chỉ ra một lỗi. Phản ví dụ nhỏ nhất là một mảng hơn 67 triệu phần tử. Với mảng 2 mũ 26 phần tử dựng theo trường hợp tệ nhất, hàm cần 41 ô ngăn xếp nhưng mã chỉ cấp 40, nên chương trình dừng vì vượt chỉ số mảng. Nhóm viết rằng kiểm thử rộng rãi đã không lộ ra lỗi này, và lỗi có mặt cả ở ngôn ngữ gốc từ khi thuật toán ra đời. Hôm nay ta đi qua năm chặng của thuật toán ấy, từ 2002 tới 2025."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "4 + 4 - 1 == 7"
      - "math.ceil(math.log2(31 + 1)) == 5"
      - "math.factorial(3) == 6 and math.ceil(math.log2(6)) == 3"
      - "[30, 10, 20][-1] == 20"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 4</td><td><b>ngăn xếp</b>: vào sau thì ra trước; chỉ nhìn được phần tử ở đỉnh</td><td>đẩy 30, 10, 20 → đỉnh là 20</td></tr>
          <tr><td>bài 12</td><td><b>sắp xếp trộn</b>: chia đôi, xếp từng nửa, rồi <b>trộn</b> hai dãy đã có thứ tự</td><td>trộn hai dãy 4 phần tử: nhiều nhất 4 + 4 − 1 = 7 phép so sánh</td></tr>
          <tr><td>bài 13</td><td><b>sắp xếp chèn</b>; <b>tìm kiếm nhị phân</b> chia đôi khoảng tìm mỗi bước</td><td>tìm chỗ chèn trong dãy 31 phần tử: nhiều nhất 5 phép so sánh</td></tr>
          <tr><td>bài 23</td><td>mọi cách sắp xếp bằng so sánh cần ít nhất <b>log₂ n!</b> phép so sánh ở trường hợp tệ nhất</td><td>3 phần tử: 3! = 6 thứ tự, log₂ 6 ≈ 2,58, nên cần ít nhất 3</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 4, ngăn xếp là vào sau thì ra trước, đẩy 30, 10, rồi 20 thì đỉnh là 20. Ở bài 12, sắp xếp trộn chia đôi, xếp từng nửa, rồi trộn hai dãy đã có thứ tự, và trộn hai dãy 4 phần tử cần nhiều nhất 7 phép so sánh. Ở bài 13, sắp xếp chèn đặt từng phần tử vào chỗ đúng, còn tìm kiếm nhị phân tìm chỗ ấy trong dãy 31 phần tử với nhiều nhất 5 phép so sánh. Ở bài 23, mọi cách sắp xếp bằng so sánh cần ít nhất lôgarit cơ số 2 của n giai thừa phép so sánh. Với 3 phần tử có 6 thứ tự, lôgarit cơ số 2 của 6 khoảng 2 phẩy 58, nên cần ít nhất 3."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td><b>đoạn chạy</b></td><td>một khúc liền đã có thứ tự sẵn trong dữ liệu</td><td>3 5 8 | 2 9 → hai đoạn: 3 5 8 và 2 9</td></tr>
          <tr><td><b>minrun</b></td><td>độ dài tối thiểu của một đoạn; đoạn ngắn hơn được kéo dài bằng sắp xếp chèn nhị phân</td><td>minrun 32: đoạn 5 phần tử được chèn thêm tới 32</td></tr>
          <tr><td><b>ngăn xếp đoạn chờ</b></td><td>độ dài các đoạn chưa trộn; A, B, C là ba đoạn trên cùng, C ở đỉnh</td><td>A = 30, B = 20, C = 10</td></tr>
          <tr><td><b>bất biến</b></td><td>điều kiện phải đúng sau mỗi lượt gộp: A lớn hơn B + C, và B lớn hơn C</td><td>30 lớn hơn 20 + 10? Không, nên phải gộp</td></tr>
          <tr><td><b>ổn định</b></td><td>hai phần tử bằng nhau giữ nguyên thứ tự ban đầu</td><td>chỉ được trộn hai đoạn <b>liền kề</b></td></tr>
          <tr><td><b>kiểm chứng hình thức</b></td><td>viết đặc tả, rồi để máy chứng minh mã đúng với đặc tả</td><td>chứng minh không khép lại thì chỉ ra chỗ sai</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Đoạn chạy là một khúc liền đã có thứ tự sẵn trong dữ liệu, như 3, 5, 8 rồi 2, 9 là hai đoạn. Dòng hai là độ dài tối thiểu của một đoạn, đoạn ngắn hơn được kéo dài bằng sắp xếp chèn nhị phân. Ngăn xếp đoạn chờ giữ độ dài các đoạn chưa trộn, ba đoạn trên cùng gọi là A, B, C, với C ở đỉnh. Bất biến là điều kiện phải đúng sau mỗi lượt gộp, A lớn hơn B cộng C, và B lớn hơn C. Với 30, 20, 10, ta có 30 không lớn hơn 30, nên phải gộp. Ổn định nghĩa là hai phần tử bằng nhau giữ nguyên thứ tự ban đầu, nên chỉ được trộn hai đoạn liền kề. Kiểm chứng hình thức là viết đặc tả, rồi để máy chứng minh mã đúng với đặc tả."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2002</text><text x="160" y="200">trộn đoạn có sẵn</text><text x="160" y="232">hai bất biến</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2011</text><text x="500" y="200">Java 7 dùng theo</text><text x="500" y="232">ngăn xếp 5 / 10 / 19 / 40</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2015</text><text x="850" y="200">chứng minh bằng máy</text><text x="850" y="232">bất biến bị phá</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2021</text><text x="1200" y="200">trộn theo lũy thừa của 2</text><text x="1200" y="232">gần tối ưu, chứng minh được</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2025</text><text x="1540" y="200">minrun đổi từng đoạn</text><text x="1540" y="232">mọi lượt trộn cân bằng</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → lan rộng → quy mô hàng tỉ lượt chạy → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2002, thuật toán trộn các đoạn có sẵn và giữ hai bất biến trên ngăn xếp. Năm 2011, Java 7 dùng theo, với cỡ ngăn xếp cấp sẵn 5, 10, 19 hoặc 40. Năm 2015, một phép chứng minh bằng máy cho thấy bất biến bị phá, rồi năm 2021 ngôn ngữ gốc đổi sang cách trộn theo lũy thừa của 2, gần tối ưu và chứng minh được. Năm 2025, độ dài tối thiểu được đổi nhẹ theo từng đoạn để mọi lượt trộn đều cân bằng."

  # ───────────────────────── 5. CƠ CHẾ ─────────────────────────
  - id: mechanism
    kind: concept
    title: "Cơ chế: tìm đoạn, đẩy vào ngăn xếp, gộp khi bất biến hỏng"
    checks:
      - "30 <= 20 + 10 and 30 + 0 == 30"
    steps:
      - show: |
          <div><svg width="1600" height="330" viewBox="0 0 1600 330">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="23" fill="#1f2937" text-anchor="middle">
          <text x="300" y="36" font-weight="bold">mảng: quét một lần từ trái sang phải</text>
          <rect x="40" y="60" width="180" height="56" fill="#e0ecfb" stroke="#2a78d6" stroke-width="2"/><text x="130" y="96">đoạn 1</text>
          <rect x="220" y="60" width="120" height="56" fill="#e0ecfb" stroke="#2a78d6" stroke-width="2"/><text x="280" y="96">đoạn 2</text>
          <rect x="340" y="60" width="80" height="56" fill="#fde2e2" stroke="#e11d48" stroke-width="2"/><text x="380" y="96">đoạn 3</text>
          <rect x="420" y="60" width="140" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="490" y="96">chưa đọc</text>
          <text x="300" y="160">đoạn ngắn hơn minrun: kéo dài bằng chèn nhị phân</text>
          <text x="1180" y="36" font-weight="bold">ngăn xếp đoạn chờ (đỉnh ở trên)</text>
          <rect x="1080" y="60" width="200" height="56" fill="#fde2e2" stroke="#e11d48" stroke-width="2"/><text x="1180" y="96">C = 10</text>
          <rect x="1080" y="116" width="200" height="56" fill="#e0ecfb" stroke="#2a78d6" stroke-width="2"/><text x="1180" y="152">B = 20</text>
          <rect x="1080" y="172" width="200" height="56" fill="#e0ecfb" stroke="#2a78d6" stroke-width="2"/><text x="1180" y="208">A = 30</text>
          <text x="1180" y="270">A lớn hơn B + C? 30 so với 30: không</text>
          <text x="1180" y="304" fill="#e11d48">→ gộp B với đoạn ngắn hơn trong A, C</text>
          </g>
          <line x1="580" y1="88" x2="1060" y2="88" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <text x="820" y="74" font-size="22" text-anchor="middle" fill="#1f2937">đẩy độ dài đoạn mới</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là cơ chế chung của thuật toán. Nó quét mảng một lần từ trái sang phải, mỗi lần tách ra một đoạn chạy, và đoạn nào ngắn hơn độ dài tối thiểu thì được kéo dài bằng chèn nhị phân. Độ dài của đoạn mới được đẩy lên đỉnh ngăn xếp đoạn chờ. Sau mỗi lần đẩy, thuật toán xét ba đoạn trên cùng, ở đây 30, 20, 10, và 30 không lớn hơn 20 cộng 10, nên bất biến hỏng. Khi đó nó trộn B với đoạn ngắn hơn trong hai đoạn A và C, rồi xét lại tới khi bất biến đúng."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2002 — khai sinh: trộn những đoạn có sẵn"
    stage: {year: "2002", scale: "thư viện chuẩn của một ngôn ngữ kịch bản phổ biến; đo trên mảng tới 1 048 576 phần tử", source: "[LS02]", practice: "tận dụng thứ tự có sẵn của dữ liệu thật; chọn minrun để số đoạn là lũy thừa của 2 hoặc vừa dưới; giữ bất biến để ngăn xếp nhỏ"}
    checks:
      - "round(sum(math.log2(i) for i in range(1, 2 ** 20 + 1))) == 19458756"
      - "round((19606028 - 19458756) / 19458756 * 100, 2) == 0.76"
      - "divmod(2112, 32) == (66, 0) and divmod(2112, 33) == (64, 0) and 64 * 32 == 2048"
      - "(lambda n: (n >> 6) + (1 if n & 63 else 0))(2112) == 33 and (lambda n: (n >> 3) + (1 if n & 7 else 0))(315) == 40"
    steps:
      - show: |
          <p><b>Bối cảnh</b> (tệp mô tả của thuật toán, 1/8/2002): một cách sắp xếp trộn <b>thích nghi, ổn định, tự nhiên</b>. Dữ liệu thật thường có sẵn nhiều khúc đã xếp, nên tách từng đoạn chạy, rồi trộn “thông minh”.</p>
          <table class="t"><tr><th>số đo trên 1 048 576 phần tử</th><th>số phép so sánh</th></tr>
          <tr><td>dãy đã xếp ngược</td><td>1 048 575 = n − 1</td></tr>
          <tr><td>dãy ngẫu nhiên: giới hạn log₂ n! của bài 23</td><td>19 458 756</td></tr>
          <tr><td>dãy ngẫu nhiên: thuật toán mới</td><td>19 606 028 — chỉ hơn ≈ 0,76%</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, tệp mô tả thuật toán ngày 1 tháng 8 năm 2002 gọi nó là một cách sắp xếp trộn thích nghi, ổn định, và tự nhiên. Dữ liệu thật thường có sẵn nhiều khúc đã xếp, nên thuật toán tách từng đoạn chạy rồi trộn một cách thông minh. Trên hơn một triệu phần tử đã xếp ngược, nó chỉ cần n trừ 1 phép so sánh. Với dãy ngẫu nhiên, giới hạn lôgarit của n giai thừa ở bài 23 là 19 triệu 458 nghìn 756. Thuật toán mới dùng 19 triệu 606 nghìn 28, chỉ hơn giới hạn khoảng 0 phẩy 76 phần trăm."
      - clear: true
        show: |
          <p><b>Điểm nghẽn:</b> minrun cố định 32 nghe hợp lý, nhưng tệp mô tả kể: mất một thời gian dài mới nhận ra 32 <b>không tốt</b> với mọi n.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. n = 2112, minrun 32</td><td>2112 chia 32</td><td>66 đoạn: 64 đoạn trộn đẹp thành 2048, còn lại 64</td></tr>
          <tr><td>Bước 2. lượt trộn cuối</td><td>2048 với 64</td><td>$\hl{lệch}$: chép O(n) phần tử chỉ để đặt 64 phần tử</td></tr>
          <tr><td>Bước 3. minrun 33</td><td>2112 chia 33</td><td>$\hlg{64}$ đoạn = 2 mũ 6: mọi lượt trộn cân bằng</td></tr>
          <tr><td>Bước 4. quy tắc chọn</td><td>lấy 6 bit đầu của n, cộng 1 nếu các bit còn lại khác 0</td><td>2112 → 33; 315 → 40</td></tr></table>
          <p class="note">Thực hành: tận dụng thứ tự sẵn có của dữ liệu thật; chọn minrun sao cho số đoạn bằng hoặc vừa dưới một lũy thừa của 2. Điều kiện: dữ liệu ngẫu nhiên thì không có lợi thế, chỉ hoà vốn với giới hạn của bài 23.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5", 3, 3]
        say: "Điểm nghẽn đến từ một chi tiết nhỏ. Độ dài tối thiểu cố định 32 nghe hợp lý, nhưng tệp mô tả kể rằng mất một thời gian dài mới nhận ra 32 không tốt với mọi n. Bước một, n bằng 2112 chia 32 được 66 đoạn, 64 đoạn đầu trộn đẹp thành 2048 phần tử, còn thừa 64. Bước hai, lượt trộn cuối ghép 2048 với 64, rất lệch, phải chép cỡ n phần tử chỉ để đặt 64 phần tử vào chỗ. Bước ba, nếu độ dài tối thiểu bằng 33 thì có đúng 64 đoạn, bằng 2 mũ 6, và mọi lượt trộn đều cân bằng. Bước bốn, quy tắc chọn là lấy 6 bit đầu của n, rồi cộng 1 nếu các bit còn lại khác 0. Thực hành rút ra là tận dụng thứ tự sẵn có, và chọn độ dài tối thiểu sao cho số đoạn bằng hoặc vừa dưới một lũy thừa của 2. Điều kiện là với dữ liệu ngẫu nhiên thì không có lợi thế, chỉ hoà vốn với giới hạn của bài 23."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2011 — lan rộng: Java 7 dùng theo"
    stage: {year: "2011", scale: "JDK 7 phát hành 28/7/2011; Arrays.sort và Collections.sort cho đối tượng dùng TimSort chép gần nguyên từ ngôn ngữ gốc", source: "[J11] [CAV15]", practice: "chép thuật toán sang nền khác thì đo lại hằng số; cấp ngăn xếp theo chứng minh cỡ tối đa; ghi rõ thay đổi hành vi trong ghi chú tương thích"}
    checks:
      - "(b := [0, 16]) and all(b.append(b[-1] + b[-2] + 1) is None for _ in range(50)) and b[:6] == [0, 16, 17, 34, 52, 87]"
      - "(b := [0, 16]) and all(b.append(b[-1] + b[-2] + 1) is None for _ in range(50)) and [next(B for B in range(60) if 1 + sum(b[:B + 1]) > L) for L in (119, 1541, 119150, 2 ** 31 - 1)] == [4, 9, 18, 39]"
      - "[4 + 1, 9 + 1, 18 + 1, 39 + 1] == [5, 10, 19, 40]"
    steps:
      - show: |
          <p><b>Quy mô:</b> JDK 7 phát hành ngày 28/7/2011. Mã TimSort của Java ghi: “chuyển thể từ hàm sắp xếp danh sách” của ngôn ngữ gốc; hàm sắp xếp mặc định cho mảng đối tượng là nó.</p>
          <table class="t"><tr><th>điều chỉnh khi chép sang Java</th><th>vì sao</th></tr>
          <tr><td>ngưỡng đoạn nhỏ <b>32</b> thay vì 64</td><td>mã ghi: đo thấy 32 chạy tốt hơn trong bản Java</td></tr>
          <tr><td>ngăn xếp cấp theo cỡ mảng: <b>5, 10, 19, 40</b> ô, với ngưỡng 120, 1542, 119 151</td><td>bản viết bằng C của ngôn ngữ gốc luôn cấp 85 ô — đo thấy quá tốn với mảng cỡ vừa</td></tr>
          <tr><td>ghi chú tương thích: có thể ném <b>IllegalArgumentException</b> nếu phép so sánh vi phạm hợp đồng</td><td>bản cũ lặng lẽ bỏ qua; có cờ hệ thống để quay về cách cũ</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng hai, bộ phát triển Java bản 7 phát hành ngày 28 tháng 7 năm 2011. Mã sắp xếp của Java ghi rằng nó được chuyển thể từ hàm sắp xếp danh sách của ngôn ngữ gốc, và đó là hàm sắp xếp mặc định cho mảng đối tượng. Khi chép sang, ngưỡng đoạn nhỏ giảm từ 64 xuống 32, vì đo thấy chạy tốt hơn trong Java. Ngăn xếp được cấp theo cỡ mảng, 5, 10, 19 hoặc 40 ô, vì phiên bản viết bằng C của ngôn ngữ gốc luôn cấp 85 ô, quá tốn với mảng cỡ vừa. Ghi chú tương thích cũng báo hàm mới có thể ném lỗi nếu phép so sánh vi phạm hợp đồng, điều mà bản cũ lặng lẽ bỏ qua."
      - clear: true
        show: |
          <p>Cỡ ngăn xếp tính từ bất biến: nếu bất biến luôn đúng, độ dài các đoạn từ đỉnh xuống tăng <b>ít nhất nhanh như dãy Fibonacci</b> của bài 18. Bài báo năm 2015 dựng dãy chặn dưới: b₀ = 0, b₁ = 16, mỗi số sau = tổng hai số trước + 1.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. vài số đầu</td><td>0, 16, 16 + 0 + 1, 17 + 16 + 1, …</td><td>0, 16, 17, 34, 52, 87, …</td></tr>
          <tr><td>Bước 2. số ô đủ dùng: nhỏ nhất sao cho 1 + tổng các số tới đó vượt cỡ mảng</td><td>với cỡ mảng dưới 120, 1542, 119 151 và tới 2 mũ 31 − 1</td><td>$\hlg{4, 9, 18, 39}$ ô</td></tr>
          <tr><td>Bước 3. so với mã Java</td><td>5, 10, 19, 40</td><td>mỗi mức dư 1 ô — an toàn, <b>nếu</b> bất biến luôn đúng</td></tr></table>
          <p class="note">Thực hành: chép thuật toán sang nền khác thì đo lại hằng số, và cấp tài nguyên theo một chứng minh cỡ tối đa. Điều kiện: chứng minh ấy chỉ đúng khi giả thiết của nó — ở đây là bất biến — thật sự được giữ.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3, 3]
        say: "Cỡ ngăn xếp ấy được tính từ bất biến. Nếu bất biến luôn đúng, độ dài các đoạn từ đỉnh xuống tăng ít nhất nhanh như dãy Fibonacci của bài 18. Bước một, bài báo năm 2015 dựng dãy chặn dưới bắt đầu bằng 0 và 16, mỗi số sau bằng tổng hai số trước cộng 1, được 0, 16, 17, 34, 52, 87. Bước hai, số ô đủ dùng là chỉ số nhỏ nhất sao cho 1 cộng tổng các số tới đó vượt cỡ mảng, ra 4, 9, 18 và 39 ô. Bước ba, mã Java cấp 5, 10, 19, 40, mỗi mức dư một ô, an toàn nếu bất biến luôn đúng. Thực hành rút ra là chép thuật toán sang nền khác thì đo lại hằng số, và cấp tài nguyên theo một chứng minh cỡ tối đa. Điều kiện là chứng minh ấy chỉ đúng khi giả thiết của nó thật sự được giữ."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2015 — quy mô hàng tỉ lượt chạy: bất biến bị phá"
    stage: {year: "2015", scale: "hàm sắp xếp của Java chạy hàng tỉ lượt mỗi ngày (theo bài báo); lỗi cần mảng từ 2 mũ 26 = 67 108 864 phần tử", source: "[CAV15] [PY15] [JDK15] [JDK18]", practice: "chứng minh bằng máy cho mã lõi dùng rộng; sửa gốc (kiểm 4 đoạn trên cùng) thay vì chỉ nới cỡ ngăn xếp; báo cho mọi bản chép của thuật toán"}
