# Quy ước: “đoạn chạy” = một khúc liền đã có thứ tự sẵn (run); “minrun” = độ dài tối thiểu của một đoạn chạy (đoạn ngắn hơn được
#   kéo dài bằng sắp xếp chèn nhị phân); “ngăn xếp đoạn chờ” = ngăn xếp độ dài các đoạn chưa trộn (A, B, C tính từ dưới lên, C ở đỉnh);
#   “bất biến” = điều kiện luôn phải đúng sau mỗi lượt gộp; “kiểm chứng hình thức” = chứng minh đúng bằng máy theo đặc tả.
#   Mọi sự kiện, con số có nguồn ghi trong audit/cs112/sources_L29.md. Con số khác là phép tính lại (checks) hoặc “(số minh hoạ)”.
#   Lời đọc không nói Python, Powersort, KeY, OpenJDK: nói “một ngôn ngữ kịch bản phổ biến”, “cách trộn theo lũy thừa của 2”,
#   “công cụ chứng minh”, “bản Java mã nguồn mở”. Timsort, Java: probe p6 (audit/cs112/probes/p6_hanh_trinh.md).
