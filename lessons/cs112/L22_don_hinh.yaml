id: L22
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 22 — Thuật toán đơn hình: đi từ đỉnh này sang đỉnh tốt hơn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L22 (bản thảo; bỏ “Fourier-Motzkin” khỏi tên bài vì không có nội dung); audit/cs112/verify_cs112.py C28; bảng tính bằng phân số chính xác (checks trong bài). Lịch sử: Dantzig 1947; quy tắc Bland 1977; Klee & Minty 1972"
assumes: [cdot, sub, max_fn]
# Quy ước: dạng chuẩn thêm biến bù s₁, s₂ ≥ 0; bảng đơn hình gồm các hàng ràng buộc và hàng z viết dạng z − 15x₁ − 10x₂ = 0;
#   “cột vào” = biến được tăng, “hàng ra” = biến cơ sở bị đẩy về 0; phần tử xoay = ô giao cột vào và hàng ra. Phân số viết thập phân.
# Nối bài trước (luật 17): bài 21 — bài xưởng bánh max z = 15x₁ + 10x₂, x₁ + x₂ ≤ 24, 2x₁ + x₂ ≤ 32, x ≥ 0; các đỉnh O, A(16, 0),
#   B(8, 16), C(0, 24); nghiệm 280 tại B; chứng chỉ 5·24 + 5·32 = 280.
objectives:
  - "Đưa bài toán về dạng chuẩn bằng biến bù và lập bảng đơn hình"
  - "Chọn cột vào (hệ số âm nhất của hàng z) và hàng ra (tỉ số nhỏ nhất với hệ số dương)"
  - "Thực hiện phép xoay và đọc ra đỉnh, giá trị z sau mỗi bước"
  - "Biết khi nào dừng, khi nào bài toán không bị chặn, và quy tắc chống lặp vòng"
asr_reviewed:
  - {sentence: "Bảng đầu đặt x một, x hai bằng 0, đó là đỉnh O.", reason: "ASR chép “Bảng đầu đặt x1, x2 bằng 0, đó là đỉnh nho.” (0.923): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thuật toán đơn hình, do Dantzig công bố năm 1947, bắt đầu ở một đỉnh, mỗi bước sang một đỉnh kề có z tốt hơn, và dừng khi không đỉnh kề nào tốt hơn.", reason: "Dantzig đọc “Đan-xích” (probe p3: 7/8), ASR chép “đàn xích”, cùng âm; z đọc “dét”, ASR chép “giác” — tên chữ cái, chữ z có trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Khi không vẽ được hình"
    steps:
      - show: |
          <p>Bài 21: hai biến → vẽ miền, thử bốn đỉnh. Bài toán thật có <b>hàng trăm biến</b> — không vẽ được, và số đỉnh có thể khổng lồ.</p>
          <div class="box key"><b>Thuật toán đơn hình</b> (Dantzig, 1947): bắt đầu ở một đỉnh, mỗi bước sang một <b>đỉnh kề</b> có $z$ <b>tốt hơn</b>, dừng khi không đỉnh kề nào tốt hơn.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, ở bài 21 có hai biến nên ta vẽ miền và thử bốn đỉnh. Bài toán thật có hàng trăm biến, không vẽ được, và số đỉnh có thể khổng lồ. Thuật toán đơn hình, do Dantzig công bố năm 1947, bắt đầu ở một đỉnh, mỗi bước sang một đỉnh kề có z tốt hơn, và dừng khi không đỉnh kề nào tốt hơn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn bài 21 và phép trừ hai phương trình"
    steps:
      - show: |
          <p>Bài 21: $\ \max z = 15x_1 + 10x_2$, &nbsp; $x_1 + x_2 \le 24$, &nbsp; $2x_1 + x_2 \le 32$, &nbsp; $x_1, x_2 \ge 0$ → tối ưu 280 tại $B(8, 16)$.</p>
          <p>Phép biến đổi được phép: nhân một phương trình với một số khác 0; trừ một bội của phương trình này khỏi phương trình khác — tập nghiệm không đổi.</p>
        focus: [1, 2, 2]
        say: "Ôn bài 21, bài xưởng bánh cần làm z bằng 15 x một cộng 10 x hai lớn nhất, với giới hạn bột và đường, và nghiệm là 280 tại đỉnh B, 8 và 16. Ta sẽ dùng hai phép biến đổi quen thuộc, nhân một phương trình với một số khác 0, và trừ một bội của phương trình này khỏi phương trình khác. Cả hai đều không làm đổi tập nghiệm."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: biến bù, biến cơ sở, bảng đơn hình"
    steps:
      - show: |
          <p><b>Biến bù</b> = phần nguyên liệu còn dư: $\ x_1 + x_2 + s_1 = 24$, $\ 2x_1 + x_2 + s_2 = 32$, với $s_1, s_2 \ge 0$.</p>
          <p><b>Biến cơ sở</b>: các biến đang được giải ra theo các biến còn lại (đặt bằng 0). Tại $O$: $x_1 = x_2 = 0$, nên $s_1 = 24$, $s_2 = 32$.</p>
          <table class="t"><tr><th>cơ sở</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>vế phải</th></tr>
          <tr><td>$s_1$</td><td>1</td><td>1</td><td>1</td><td>0</td><td>24</td></tr>
          <tr><td>$s_2$</td><td>2</td><td>1</td><td>0</td><td>1</td><td>32</td></tr>
          <tr><td>$z$</td><td>−15</td><td>−10</td><td>0</td><td>0</td><td>0</td></tr></table>
        focus: [1, 2, 3, "3.4"]
        say: "Bước một, thêm biến bù, chính là phần nguyên liệu còn dư, để biến dấu nhỏ hơn hoặc bằng thành dấu bằng. Biến cơ sở là các biến được giải ra theo những biến còn lại, khi những biến kia đặt bằng 0, ở đỉnh O thì s một bằng 24, s hai bằng 32. Xếp hệ số vào bảng đơn hình như trên. Hàng z ghi z trừ 15 x một trừ 10 x hai bằng 0, nên các hệ số mang dấu âm."

  # ───────────────────────── 4. QUY TẮC ─────────────────────────
  - id: rule
    kind: concept
    title: "Quy tắc xoay: cột vào, hàng ra"
    steps:
      - show: |
          <ol><li><b>Cột vào</b>: hệ số <b>âm nhất</b> ở hàng $z$ — tăng biến đó làm $z$ tăng nhanh nhất mỗi đơn vị.</li>
          <li><b>Hàng ra</b>: trong cột vào, chỉ xét hệ số <b>dương</b>; lấy hàng có <b>vế phải / hệ số</b> nhỏ nhất — tăng tới đó thì một biến cơ sở chạm 0 trước, không biến nào bị âm.</li>
          <li><b>Xoay</b>: chia hàng ra cho phần tử xoay, rồi trừ bội của nó khỏi mọi hàng khác (kể cả hàng $z$) để cột vào thành 0.</li>
          <li><b>Dừng</b> khi hàng $z$ không còn hệ số âm.</li></ol>
        focus: [0, "1.1", "1.2", "1.2", "1.3", "1.4"]
        say: "Quy tắc gồm bốn bước. Cột vào là cột có hệ số âm nhất ở hàng z, vì tăng biến đó làm z tăng nhanh nhất. Hàng ra chỉ xét các hệ số dương trong cột vào, lấy hàng có vế phải chia hệ số nhỏ nhất. Nhờ vậy khi tăng tới đó, một biến cơ sở chạm 0 trước tiên mà không biến nào bị âm. Phép xoay chia hàng ra cho phần tử xoay, rồi trừ bội của nó khỏi mọi hàng khác, kể cả hàng z. Dừng khi hàng z không còn hệ số âm."

  - id: intuition
    kind: intuition
    title: "Hình dung: mỗi bảng là một đỉnh, mỗi lần xoay là đi một cạnh"
    checks:
      - "[15*a + 10*b for a, b in ((0, 0), (16, 0), (8, 16), (0, 24))] == [0, 240, 280, 240]"
    steps:
      - show: |
          <div class="row"><div><svg width="500" height="440" viewBox="0 0 500 440"><defs><marker id="arL22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><line x1="90" y1="380" x2="460" y2="380" stroke="#6b7280" stroke-width="3"/><line x1="90" y1="380" x2="90" y2="48" stroke="#6b7280" stroke-width="3"/><text x="466" y="388" font-size="24" fill="#6b7280">x₁</text><text x="52" y="56" font-size="24" fill="#6b7280">x₂</text><polygon points="90,380 298,380 194,172 90,68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><line x1="104" y1="368" x2="282" y2="368" stroke="#d97706" stroke-width="6" marker-end="url(#arL22)"/><line x1="290" y1="362" x2="202" y2="188" stroke="#d97706" stroke-width="6" marker-end="url(#arL22)"/><text x="194" y="356" font-size="24" font-weight="700" text-anchor="middle" fill="#d97706">lần 1</text><text x="260" y="280" font-size="24" font-weight="700" fill="#d97706">lần 2</text><circle cx="90" cy="380" r="8" fill="#1f2937"/><text x="80" y="414" font-size="24" font-weight="700" text-anchor="start" fill="#1f2937">O: z = 0</text><circle cx="298" cy="380" r="8" fill="#1f2937"/><text x="298" y="414" font-size="24" font-weight="700" text-anchor="middle" fill="#1f2937">A: z = 240</text><circle cx="194" cy="172" r="8" fill="#15803d"/><text x="212" y="164" font-size="24" font-weight="700" text-anchor="start" fill="#15803d">B: z = 280</text><circle cx="90" cy="68" r="8" fill="#1f2937"/><text x="106" y="60" font-size="24" font-weight="700" text-anchor="start" fill="#1f2937">C: z = 240</text></svg></div>
          <div class="col"><table class="t"><tr><th>bảng</th><th>biến cơ sở</th><th>biến bằng 0</th><th>đỉnh</th></tr>
          <tr><td>đầu</td><td>$s_1, s_2$</td><td>$x_1, x_2$</td><td>$\text{O}$</td></tr>
          <tr><td>sau lần 1</td><td>$s_1, x_1$</td><td>$x_2, s_2$</td><td>$A$</td></tr>
          <tr><td>sau lần 2</td><td>$x_2, x_1$</td><td>$s_1, s_2$</td><td>$B$</td></tr></table>
          <p class="note">$s_2 = 0$: hết đường; $\ s_1 = 0$: hết bột.</p></div></div>
        focus: ["1.1", "1.2", "1.2", "1.2", "1.2", "1.1"]
        say: "Trước khi tính, hãy nhìn hình miền của xưởng bánh. Mỗi bảng đơn hình ứng với đúng một đỉnh, đọc ra bằng cách đặt các biến ngoài cơ sở bằng 0. Bảng đầu đặt x một, x hai bằng 0, đó là đỉnh O. Sau lần xoay thứ nhất, s hai bằng 0, nghĩa là dùng hết đường, ta ở đỉnh A. Sau lần thứ hai, cả s một và s hai bằng 0, hết cả bột lẫn đường, đó là đỉnh B. Vậy mỗi lần xoay là đi dọc một cạnh sang đỉnh kề, và z tăng từ 0 lên 240 rồi 280, không cần thử đỉnh C."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Hai lần xoay: O → A → B"
    checks:
      - "min(Rational(24, 1), Rational(32, 2)) == 16 and Rational(32, 2) < 24"
      - "(lambda r2: (lambda r1, z: (r1, r2, z) == ([0, Rational(1, 2), 1, Rational(-1, 2), 8], [1, Rational(1, 2), 0, Rational(1, 2), 16], [0, Rational(-5, 2), 0, Rational(15, 2), 240]))([a - b for a, b in zip([1, 1, 1, 0, 24], r2)], [a + 15*b for a, b in zip([-15, -10, 0, 0, 0], r2)]))([Rational(v, 2) for v in (2, 1, 0, 1, 32)])"
      - "min(8 / Rational(1, 2), 16 / Rational(1, 2)) == 16"
      - "[Rational(v, 2) for v in (2, 1, 0, 1, 32)] == [1, Rational(1, 2), 0, Rational(1, 2), 16] and [a - b for a, b in zip([1, 1, 1, 0, 24], [1, Rational(1, 2), 0, Rational(1, 2), 16])] == [0, Rational(1, 2), 1, Rational(-1, 2), 8]"
      - "-10 + 15*Rational(1, 2) == Rational(-5, 2) and 15*Rational(1, 2) == Rational(15, 2) and 15*16 == 240"
      - "(lambda r1: (lambda r2, z: (r1, r2, z) == ([0, 1, 2, -1, 16], [1, 0, -1, 1, 8], [0, 0, 5, 5, 280]))([a - Rational(1, 2)*b for a, b in zip([1, Rational(1, 2), 0, Rational(1, 2), 16], r1)], [a + Rational(5, 2)*b for a, b in zip([0, Rational(-5, 2), 0, Rational(15, 2), 240], r1)]))([2*v for v in (0, Rational(1, 2), 1, Rational(-1, 2), 8)])"
    steps:
      - show: |
          <p><b>Bước 1</b> — lần xoay 1, cột vào $x_1$, hàng $s_2$ ra (tỉ số $32/2 = 16 < 24/1$). Chia hàng $s_2$ cho phần tử xoay 2:</p>
          <table class="t"><tr><th>hàng</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>vế phải</th></tr>
          <tr><td>$s_2$ cũ</td><td>2</td><td>1</td><td>0</td><td>1</td><td>32</td></tr>
          <tr><td>chia 2 → hàng $x_1$ mới</td><td>1</td><td>0,5</td><td>0</td><td>0,5</td><td>16</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước một, làm chậm lần xoay đầu tiên. Cột vào là x một, và hàng s hai ra vì 32 chia 2 bằng 16, nhỏ hơn 24 chia 1. Chia cả hàng s hai cho phần tử xoay 2, ta được hàng mới 1, 0 phẩy 5, 0, 0 phẩy 5, và vế phải 16, từ nay là hàng của x một."
      - show: |
          <p><b>Bước 2</b> — lấy hàng $s_1$ trừ hàng $x_1$ mới, để cột $x_1$ thành 0:</p>
          <table class="t"><tr><th>hàng</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>vế phải</th></tr>
          <tr><td>$s_1$ cũ</td><td>1</td><td>1</td><td>1</td><td>0</td><td>24</td></tr>
          <tr><td>trừ hàng $x_1$ mới</td><td>0</td><td>0,5</td><td>1</td><td>−0,5</td><td>8</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước hai, hàng s một đang có số 1 ở cột x một, nên ta trừ đi đúng một lần hàng x một mới. Hàng s một cũ là 1, 1, 1, 0, vế phải 24. Trừ từng ô, được 0, 0 phẩy 5, 1, âm 0 phẩy 5, và vế phải 8, tức còn dư 8 ki-lô-gam bột."
      - clear: true
        show: |
          <p><b>Bước 3</b> — hàng $z$ cộng 15 lần hàng $x_1$ mới:</p>
          <table class="t"><tr><th>hàng</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>vế phải</th></tr>
          <tr><td>hàng $x_1$ mới</td><td>1</td><td>0,5</td><td>0</td><td>0,5</td><td>16</td></tr>
          <tr><td>$z$ cũ</td><td>−15</td><td>−10</td><td>0</td><td>0</td><td>0</td></tr>
          <tr><td>cộng 15 lần hàng $x_1$</td><td>0</td><td>−2,5</td><td>0</td><td>7,5</td><td>240</td></tr></table>
        focus: [1, "2.3", "2.4", "2.4"]
        say: "Bước ba, hàng z có âm 15 ở cột x một, nên cộng 15 lần hàng x một mới. Hàng z cũ là âm 15, âm 10, 0, 0, vế phải 0. Âm 10 cộng 15 nhân 0 phẩy 5 bằng âm 2 phẩy 5, còn 15 nhân 0 phẩy 5 bằng 7 phẩy 5. Vế phải thành 15 nhân 16, bằng 240."
      - clear: true
        show: |
          <p><b>Bước 4</b> — gộp lại, bảng sau lần 1: cột vào $x_1$ (−15). Tỉ số: $24/1 = 24$, $\ 32/2 = \hlo{16}$ → hàng $s_2$ ra, phần tử xoay 2.</p>
          <table class="t"><tr><th>cơ sở</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>vế phải</th></tr>
          <tr><td>$s_1$</td><td>0</td><td>0,5</td><td>1</td><td>−0,5</td><td>8</td></tr>
          <tr><td>$x_1$</td><td>1</td><td>0,5</td><td>0</td><td>0,5</td><td>16</td></tr>
          <tr><td>$z$</td><td>0</td><td>−2,5</td><td>0</td><td>7,5</td><td>240</td></tr></table>
          <p>Đỉnh $A(16, 0)$, $\ z = 240$.</p>
        focus: [1, "2.3", ["2.2", "2.4"], 3]
        say: "Bước bốn, gộp lại bảng sau lần xoay thứ nhất, cột vào là x một vì hệ số âm 15 nhỏ nhất. Hai tỉ số là 24 chia 1 bằng 24 và 32 chia 2 bằng 16, nên hàng s hai ra, phần tử xoay là 2. Chia hàng đó cho 2, trừ nó khỏi hàng s một, cộng 15 lần nó vào hàng z, ta được bảng mới. Đọc ra x một bằng 16, x hai bằng 0, tức đỉnh A, và z bằng 240."
      - clear: true
        show: |
          <p><b>Bước 5</b> — lần 2: cột vào $x_2$ (−2,5). Tỉ số: $8 / 0{,}5 = \hlo{16}$, $\ 16 / 0{,}5 = 32$ → hàng $s_1$ ra.</p>
          <table class="t"><tr><th>cơ sở</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>vế phải</th></tr>
          <tr><td>$x_2$</td><td>0</td><td>1</td><td>2</td><td>−1</td><td>16</td></tr>
          <tr><td>$x_1$</td><td>1</td><td>0</td><td>−1</td><td>1</td><td>8</td></tr>
          <tr><td>$z$</td><td>0</td><td>0</td><td>5</td><td>5</td><td>$\hlg{280}$</td></tr></table>
          <p>Hàng $z$ hết số âm → <b>dừng</b>: $x_1 = 8$, $x_2 = 16$, $z = 280$ — đúng đỉnh $B$ của bài 21.</p>
        focus: [1, "2.4", 3]
        say: "Bước năm, lần xoay thứ hai, cột vào là x hai, hệ số âm 2 phẩy 5. Tỉ số là 8 chia 0 phẩy 5 bằng 16 và 16 chia 0 phẩy 5 bằng 32, nên hàng s một ra. Xoay xong, hàng z không còn số âm, nên dừng với x một bằng 8, x hai bằng 16, z bằng 280, đúng đỉnh B của bài 21."

  # ───────────────────────── 6. KIỂM TRA ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: hàng z cuối chính là chứng chỉ"
    checks:
      - "5*24 + 5*32 == 280 and 15*8 + 10*16 == 280"
      - "(lambda x, y: sp.expand(280 - 5*(24 - x - y) - 5*(32 - 2*x - y) - (15*x + 10*y)) == 0)(*sp.symbols('x y')) and 5*24 == 120 and 5*32 == 160"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: thay vào bài gốc: $\ 15 \cdot 8 + 10 \cdot 16 = 280$, ràng buộc $8 + 16 = 24$, $\ 16 + 16 = 32$ ✓</p>
          <p><b>Phép thử 2</b>: hệ số của $s_1$, $s_2$ ở hàng $z$ cuối là 5 và 5 — đúng bộ số của chứng chỉ ở bài 21: $\ 5 \cdot 24 + 5 \cdot 32 = 280$.</p>
          <p class="note">Bảng cuối vừa cho điểm tối ưu, vừa cho lý do không điểm nào vượt được.</p>
        focus: [1, 2, 2, 3]
        say: "Phép thử đầu tiên, thay nghiệm vào bài gốc, z bằng 280 và cả hai ràng buộc dùng hết. Phép thử thứ hai rất đẹp, hệ số của s một và s hai ở hàng z cuối là 5 và 5. Đó đúng là bộ số của chứng chỉ ở bài 21, 5 nhân 24 cộng 5 nhân 32 bằng 280. Vì vậy bảng cuối vừa cho điểm tối ưu, vừa cho lý do không điểm nào vượt được."
      - show: |
          <p><b>Phép thử 3</b> — vì sao hết số âm là được dừng: hàng $z$ cuối đọc thành phương trình</p>
          $$z + 5s_1 + 5s_2 = 280 \implies z = 280 - 5s_1 - 5s_2 \le 280 \quad (\text{vì } s_1, s_2 \ge 0)$$
          <p class="note">Thay $s_1 = 24 - x_1 - x_2$, $\ s_2 = 32 - 2x_1 - x_2$ vào vế phải: $280 - 120 + 5x_1 + 5x_2 - 160 + 10x_1 + 5x_2 = 15x_1 + 10x_2$ ✓ đúng hàm mục tiêu.</p>
        introduces: [implies]
        focus: [1, 2, 2, 3]
        say: "Phép thử thứ ba giải thích vì sao hết số âm là được dừng. Hàng z cuối đọc thành phương trình z cộng 5 s một cộng 5 s hai bằng 280, suy ra z bằng 280 trừ 5 s một trừ 5 s hai. Vì hai biến bù không âm, z không bao giờ vượt 280, và chỉ đạt 280 khi cả hai bằng 0. Kiểm lại bằng cách thay định nghĩa của s một, s hai vào, vế phải rút gọn đúng thành 15 x một cộng 10 x hai."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "Rational(32, 2) < Rational(24, 1)"
      - "24 - 16 == 8 and 32 - 2*16 == 0 and 24 - 24 == 0 and 32 - 2*24 == -16"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tính tỉ số với hệ số âm hoặc bằng 0 <b class="red">(sai)</b>
          <br><span class="note">Chỉ hệ số <b>dương</b> mới giới hạn việc tăng biến. Dùng hàng có hệ số âm làm hàng ra sẽ đẩy một biến xuống âm — ra ngoài miền.</span></div>
        say: "Lỗi thứ nhất, tính tỉ số cả với hệ số âm hoặc bằng 0. Chỉ hệ số dương mới giới hạn việc tăng biến, còn chọn hàng có hệ số âm làm hàng ra sẽ đẩy một biến xuống âm, tức ra ngoài miền."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn hàng ra theo tỉ số <b>lớn nhất</b> <b class="red">(sai)</b>
          <br><span class="note">Lần 1 nếu chọn hàng $s_1$ (tỉ số 24): $x_1 = 24$ làm $s_2 = 32 - 48 = -16 < 0$ — vượt quá đường.</span>
          <table class="t"><tr><th>hàng ra</th><th>$x_1$</th><th>$s_1$ (bột dư)</th><th>$s_2$ (đường dư)</th></tr>
          <tr><td>$s_2$, tỉ số 16 (đúng)</td><td>16</td><td>8</td><td>0</td></tr>
          <tr><td>$s_1$, tỉ số 24 (sai)</td><td>24</td><td>0</td><td><b class="red">−16</b></td></tr></table></div>
        say: "Lỗi thứ hai, chọn hàng ra theo tỉ số lớn nhất. Ở lần xoay đầu, nếu chọn hàng s một với tỉ số 24, thì x một bằng 24 làm lượng đường còn dư bằng âm 16, tức vượt quá lượng đường có."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cột vào không có hệ số dương nào mà vẫn cố xoay <b class="red">(sai)</b>
          <br><span class="note">Khi đó tăng biến mãi không chạm giới hạn → bài toán <b>không bị chặn</b> (như ví dụ thiếu điều kiện không âm ở bài 21). Phải dừng và báo.</span></div>
        say: "Lỗi thứ ba, cột vào không có hệ số dương nào mà vẫn cố xoay. Khi đó tăng biến mãi cũng không chạm giới hạn, bài toán không bị chặn, giống ví dụ thiếu điều kiện không âm ở bài 21. Phải dừng và báo như vậy."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ đơn hình luôn dừng và luôn nhanh <b class="red">(sai)</b>
          <br><span class="note">Khi tỉ số bằng nhau (suy biến), có thể xoay mà $z$ không tăng và quay vòng mãi. Quy tắc Bland (1977): luôn chọn biến có <b>chỉ số nhỏ nhất</b> khi hoà → chắc chắn dừng. Tệ nhất đơn hình vẫn có thể đi qua số đỉnh tăng theo hàm mũ (Klee và Minty, 1972), dù thực tế thường rất nhanh.</span></div>
        say: "Lỗi thứ tư, nghĩ đơn hình luôn dừng và luôn nhanh. Khi các tỉ số bằng nhau, gọi là suy biến, có thể xoay mà z không tăng, rồi quay vòng mãi. Quy tắc chọn chỉ số nhỏ nhất khi hoà, công bố năm 1977, bảo đảm thuật toán dừng. Trường hợp tệ nhất, đơn hình vẫn có thể đi qua số đỉnh tăng theo hàm mũ, dù trong thực tế thường rất nhanh."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "min(Rational(12, 2), Rational(18, 2)) == 6 and 5 * 6 == 30"
      - "min(Rational(4, 1), Rational(18 - 12, 3)) == 2 and 3*2 + 5*6 == 36"
      - "(lambda T: (lambda T1: T1 == [[1, 0, 1, 0, 0, 4], [0, 1, 0, Rational(1, 2), 0, 6], [3, 0, 0, -1, 1, 6], [-3, 0, 0, Rational(5, 2), 0, 30]] and (lambda r3: (lambda z2: z2 == [0, 0, 0, Rational(3, 2), 1, 36] and Rational(3, 2)*12 + 1*18 == 36)([a + 3*b for a, b in zip(T1[3], r3)]))([v / 3 for v in T1[2]]))((lambda r2: [T[0], r2, [a - 2*b for a, b in zip(T[2], r2)], [a + 5*b for a, b in zip(T[3], r2)]])([Rational(v, 2) for v in T[1]])))([[1, 0, 1, 0, 0, 4], [0, 2, 0, 1, 0, 12], [3, 2, 0, 0, 1, 18], [-3, -5, 0, 0, 0, 0]])"
      - "Rational(12, 2) == 6 < Rational(18, 2) == 9 and 18 - 12 == 6 and 5*6 == 30 and 30 + 3*2 == 36 and Rational(6, 3) == 2 < 4"
    steps:
      - show: |
          <p>Bài tự làm của bài 21:</p>
          $$\max z = 3x_1 + 5x_2, \quad x_1 \le 4, \quad 2x_2 \le 12, \quad 3x_1 + 2x_2 \le 18, \quad x \ge 0$$
          <p>Lần xoay đầu: cột vào? hàng ra? $z$ sau đó?</p>
        focus: [[1, 2], 3, 0]
        say: "Đến lượt bạn, lấy lại bài tự làm của bài 21, tìm giá trị lớn nhất của 3 x một cộng 5 x hai, với ba ràng buộc như trên bảng. Ở lần xoay đầu, cột vào là cột nào, hàng ra là hàng nào, và z sau đó bằng bao nhiêu? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p><b>Bước 1</b> — bảng đầu, cột vào $x_2$ (−5 âm nhất):</p>
          <table class="t"><tr><th>hàng</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>$s_3$</th><th>vế phải</th></tr>
          <tr><td>$s_1$</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>4 &nbsp; (hệ số 0 → bỏ)</td></tr>
          <tr><td>$s_2$</td><td>0</td><td>2</td><td>0</td><td>1</td><td>0</td><td>12 &nbsp; ($12/2 = \hlo{6}$)</td></tr>
          <tr><td>$s_3$</td><td>3</td><td>2</td><td>0</td><td>0</td><td>1</td><td>18 &nbsp; ($18/2 = 9$)</td></tr>
          <tr><td>$z$</td><td>−3</td><td>−5</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án, bước một, lập bảng đầu, cột vào là x hai vì âm 5 là hệ số âm nhất. Hàng s một có hệ số 0 ở cột x hai nên bỏ qua. Hàng s hai cho tỉ số 12 chia 2 bằng 6. Hàng s ba cho 18 chia 2 bằng 9, lớn hơn, nên hàng s hai ra."
      - clear: true
        show: |
          <p><b>Bước 2</b> — xoay: chia hàng $s_2$ cũ $(0, 2, 0, 1, 0;\ 12)$ cho 2, trừ 2 lần nó khỏi hàng $s_3$, cộng 5 lần nó vào hàng $z$. Hàng $s_1$ giữ nguyên.</p>
          <table class="t"><tr><th>hàng</th><th>$x_1$</th><th>$x_2$</th><th>$s_1$</th><th>$s_2$</th><th>$s_3$</th><th>vế phải</th></tr>
          <tr><td>$x_2$</td><td>0</td><td>1</td><td>0</td><td>0,5</td><td>0</td><td>6</td></tr>
          <tr><td>$s_3$</td><td>3</td><td>0</td><td>0</td><td>−1</td><td>1</td><td>6</td></tr>
          <tr><td>$z$</td><td>−3</td><td>0</td><td>0</td><td>2,5</td><td>0</td><td>$\hlg{30}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước hai, ta thực hiện phép xoay. Chia hàng s hai cho 2, được x hai bằng 6. Hàng s ba trừ 2 lần hàng mới, vế phải còn 18 trừ 12, bằng 6. Hàng z cộng 5 lần hàng mới, vế phải thành 5 nhân 6, bằng 30, tại đỉnh 0, 6."
      - clear: true
        show: |
          <p><b>Bước 3</b> — hàng $z$ còn −3 ở $x_1$ nên xoay tiếp. Tỉ số: $s_1$: $4/1 = 4$; $\ s_3$: $6/3 = \hlo{2}$ → $s_3$ ra, $x_1 = 2$.</p>
          $$z = 30 + 3 \cdot 2 = \hlg{36}, \qquad \text{hàng } z \text{ mới: } (0,\ 0,\ 0,\ 1{,}5,\ 1;\ 36)$$
          <p class="note">Hết số âm → dừng tại $(2, 6)$, khớp đáp số bài 21. Hệ số 1,5 và 1 của $s_2$, $s_3$ chính là hai số nhân của chứng chỉ: $1{,}5 \cdot 12 + 1 \cdot 18 = 36$.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Bước ba, hàng z vẫn còn âm 3 ở cột x một, nên xoay tiếp với x một. Tỉ số của hàng s một là 4, của hàng s ba là 6 chia 3 bằng 2, nhỏ hơn, nên s ba ra và x một bằng 2. Giá trị z tăng thêm 3 nhân 2, thành 36, và hàng z mới không còn số âm. Ta dừng tại điểm 2, 6, khớp đáp số của bài 21. Hơn nữa, hệ số 1 phẩy 5 và 1 ở hàng z chính là hai số nhân của chứng chỉ, 1 phẩy 5 nhân 12 cộng 18 bằng 36."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">thêm biến bù, lập bảng</span><span class="a">→</span>
          <span class="n">cột vào: hệ số âm nhất</span><span class="a">→</span>
          <span class="n">hàng ra: tỉ số nhỏ nhất, hệ số dương</span><span class="a">→</span>
          <span class="n">xoay = sang đỉnh kề tốt hơn</span><span class="a">→</span>
          <span class="n">hết số âm: tối ưu</span></div>
        say: "Tổng kết chuỗi logic. Thêm biến bù và lập bảng, chọn cột vào có hệ số âm nhất, chọn hàng ra có tỉ số nhỏ nhất với hệ số dương. Mỗi lần xoay là sang một đỉnh kề tốt hơn, và khi hàng z hết số âm thì đã tối ưu."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi phép xoay chỉ là “giải lại hệ phương trình theo một bộ biến khác” — đại số đứng sau hình học của bài 21.</div>
        say: "Điều cần mang theo, mỗi phép xoay chỉ là giải lại hệ phương trình theo một bộ biến khác, đó là phần đại số đứng sau hình học của bài 21."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 23): <b>sắp xếp nhanh</b> và giới hạn của sắp xếp bằng so sánh — vì sao mọi thuật toán so sánh đều có một giới hạn tốc độ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 23, ta học sắp xếp nhanh, và giới hạn của sắp xếp bằng so sánh, tức vì sao mọi thuật toán so sánh đều có một giới hạn tốc độ. Hẹn gặp bạn ở bài tiếp theo."
