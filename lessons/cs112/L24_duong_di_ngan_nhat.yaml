assumes: [cdot, sub, bigTheta, log, infty, min_fn, card, in]
# Quy ước: đồ thị CÓ HƯỚNG, trọng số w(u, v) trên cạnh u → v; d[v] = độ dài đường tốt nhất TÌM ĐƯỢC TỚI LÚC NÀY từ S tới v;
#   n = số đỉnh, m = số cạnh; “nới cạnh u → v” = nếu d[u] + w(u, v) < d[v] thì gán d[v] = d[u] + w(u, v).
# Tên Dijkstra, Bellman, Ford CHỈ hiện trên màn hình: dò phát âm p5_do_thi (2026-10-27) không đạt 7/8 (Dijkstra 0/8, Bellman 6/8)
#   → lời đọc gọi “thuật toán chốt đỉnh gần nhất” và “thuật toán nới mọi cạnh n trừ 1 vòng” (như CS115 L39 với Bellman).
# Bài mới ngoài bản thảo (curriculum/cs112.yaml Phần 7).
# Nối bài trước (luật 17): bài 7 — duyệt theo chiều rộng đếm số chặng; bài 6 — đống nhị phân lấy phần tử nhỏ nhất Θ(log n);
#   bài 16 — tham lam chọn thứ tốt nhất lúc đó; bài 1 — Theta; bài 18 — mỗi bài toán con dùng kết quả bài toán nhỏ hơn.
objectives:
  - "Nới một cạnh và chạy tay thuật toán chốt đỉnh gần nhất (Dijkstra) bằng bảng d theo từng lần chốt"
  - "Giải thích vì sao chốt đỉnh gần nhất là đúng khi mọi trọng số không âm, và tìm được phản ví dụ khi có cạnh âm"
  - "Chạy thuật toán nới mọi cạnh n − 1 vòng (Bellman-Ford), giải thích vì sao đủ n − 1 vòng và cách phát hiện chu trình âm"
  - "So sánh chi phí Θ((n + m) log n) với Θ(n·m)"
