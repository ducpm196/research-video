scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bốn câu hỏi một bài tập lớn phải trả lời"
    steps:
      - show: |
          <ol><li>Dùng thuật toán nào, và <b>vì sao đúng</b>?</li>
          <li>Nhanh hơn cách khác <b>bao nhiêu</b> — có số đo, có thể chạy lại?</li>
          <li>Kiểm thử thế nào để <b>tin</b> kết quả?</li>
          <li>Phần nào do <b>trí tuệ nhân tạo</b> làm, và mình đã <b>kiểm chứng</b> gì?</li></ol>
          <p class="note">Bài này dựa trên một báo cáo bài tập lớn thật về nhân chuỗi ma trận (bài 19); mọi số đo trích từ báo cáo đó.</p>
        focus: [0, "1.1", "1.2", "1.3", "1.4", 2]
        say: "Chào bạn, một bài tập lớn về thuật toán đáng tin khi trả lời được bốn câu hỏi. Dùng thuật toán nào, và vì sao đúng. Nhanh hơn cách khác bao nhiêu, với số đo chạy lại được. Kiểm thử thế nào để tin kết quả. Và phần nào do trí tuệ nhân tạo làm, mình đã kiểm chứng những gì. Bài hôm nay dựa trên một báo cáo bài tập lớn thật về nhân chuỗi ma trận của bài 19, mọi số đo đều trích từ báo cáo đó."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn bài 19: nhân chuỗi ma trận"
    checks:
      - "26000 == 14000 + 0 + 40*10*30"
    steps:
      - show: |
          <p>Bài 19, <b>nhân chuỗi ma trận</b> $A_1 \cdots A_n$ ($A_i$ cỡ $p_{i-1} \cdot p_i$): chọn cách đặt ngoặc để tổng số phép nhân số ít nhất — nhân ma trận cỡ $a \cdot b$ với cỡ $b \cdot c$ tốn $a \cdot b \cdot c$ phép nhân. Ô $m[i][j]$ = số phép nhân ít nhất cho $A_i \cdots A_j$:</p>
          <p>$m[i][j] = \min_k \big(m[i][k] + m[k+1][j] + p_{i-1}p_kp_j\big)$, điền theo độ dài đoạn, $\Theta(n^3)$.</p>
          <p>Ví dụ chính của báo cáo: $p = (40, 20, 30, 10, 30)$ → $26\,000$ phép nhân, $\big(A_1(A_2A_3)\big)A_4$.</p>
        introduces: [min_fn]
        focus: [1, 1, 2, 3]
        say: "Bài toán của báo cáo là nhân chuỗi ma trận ở bài 19, tức chọn cách đặt ngoặc cho tích nhiều ma trận để tổng số phép nhân số ít nhất. Nhân ma trận cỡ a nhân b với ma trận cỡ b nhân c tốn a nhân b nhân c phép nhân. Ôn bài 19, bảng nhân chuỗi ma trận lấy nhỏ nhất qua mọi chỗ cắt k, điền theo độ dài đoạn, tốn Theta của n mũ 3. Ví dụ chính của báo cáo là p bằng 40, 20, 30, 10, 30, cho 26 nghìn phép nhân, cũng chính là bài tự làm của bài 19."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bốn chiến lược cùng giải một bài"
    steps:
      - show: |
          <table class="t"><tr><th>chiến lược</th><th>đúng?</th><th>chi phí</th><th>vai trò</th></tr>
          <tr><td>lập bảng từ dưới lên (bottom-up)</td><td>đúng</td><td>$\Theta(n^3)$</td><td>lời giải chính</td></tr>
          <tr><td>ghi nhớ từ trên xuống (top-down)</td><td>đúng</td><td>$\Theta(n^3)$</td><td>đối chiếu, dễ viết từ hệ thức</td></tr>
          <tr><td>vét cạn đệ quy</td><td>đúng</td><td>$\Theta(3^n)$</td><td>“trọng tài” cho $n$ nhỏ</td></tr>
          <tr><td>tham lam (một quy tắc chia)</td><td><b class="red">không chắc</b></td><td>nhanh</td><td>cận trên tính nhanh</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Báo cáo cài bốn chiến lược trên cùng một giao diện, mỗi cái có vai trò riêng. Lập bảng từ dưới lên là lời giải chính, Theta của n mũ 3. Ghi nhớ từ trên xuống cũng đúng và cùng bậc, dùng để đối chiếu. Vét cạn đệ quy rất chậm nhưng đơn giản đến mức khó sai, nên làm trọng tài cho n nhỏ. Còn tham lam chạy nhanh nhưng không chắc đúng, chỉ là một cận trên tính nhanh."

  - id: intuition
    kind: intuition
    title: "Hình dung: vét cạn giải lại cùng một đoạn nhiều lần"
    checks:
      - "(lambda T: [T(T, n) for n in (3, 4, 6, 10)] == [9, 27, 243, 19683])(lambda f, n: 1 if n == 1 else 1 + sum(f(f, k) + f(f, n - k) for k in range(1, n)))"
