6" stroke-width="3"/><text x="270" y="289" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">2..2</text><rect x="355" y="255" width="110" height="50" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="410" y="289" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">3..3</text><rect x="535" y="255" width="110" height="50" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="590" y="289" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">1..1</text><rect x="675" y="255" width="110" height="50" rx="10" fill="#ffedd5" stroke="#d97706" stroke-width="3"/><text x="730" y="289" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">2..2</text></svg>
          <table class="t"><tr><th>$n$</th><th>3</th><th>4</th><th>6</th><th>10</th></tr>
          <tr><td>lời gọi của vét cạn</td><td>9</td><td>27</td><td>243</td><td>19 683</td></tr>
          <tr><td>số ô của bảng (mỗi đoạn một ô)</td><td>6</td><td>10</td><td>21</td><td>55</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", 0]
        say: "Hình vẽ cây lời gọi của vét cạn cho chuỗi 3 ma trận, mỗi hộp là một đoạn cần giải. Đoạn từ 1 đến 3 thử hai chỗ cắt, mỗi chỗ cắt sinh ra hai đoạn con, và đoạn con dài 2 lại tự cắt tiếp. Đếm cả cây được 9 hộp, và hộp cam, đoạn chỉ gồm ma trận thứ hai, bị giải hai lần, hai đoạn một ma trận còn lại cũng vậy. Khi n tăng, số lời gọi nhân 3 mỗi lần thêm một ma trận, lên tới gần 20 nghìn khi n bằng 10. Trong khi đó số đoạn khác nhau chỉ là n nhân n cộng 1 chia 2, với n bằng 10 là 55 ô. Bảng của bài 19 giải mỗi đoạn đúng một lần, nên tiết kiệm được toàn bộ phần lặp lại."

  # ───────────────────────── 4. ĐẾM CHÍNH XÁC ─────────────────────────
  - id: count
    kind: formula
    title: "Đếm chính xác: vét cạn gọi đúng 3 mũ n trừ 1 lần"
    checks:
      - "(lambda bf: all(bf(bf, n) == 3**(n - 1) for n in range(1, 12)))(lambda f, n: 1 if n == 1 else 1 + sum(f(f, k) + f(f, n - k) for k in range(1, n)))"
      - "all((n**3 - n) // 6 == sum((n - L + 1)*(L - 1) for L in range(2, n + 1)) for n in range(1, 60)) and (4**3 - 4) // 6 == 10"
      - "3**3 == 27 and 4**4 // (4**1.5) != 27"
    steps:
      - show: |
          <p>Gọi $T(n)$ là số lời gọi của vét cạn trên đoạn dài $n$: &nbsp; $T(1) = 1$, &nbsp; $T(n) = 1 + 2\displaystyle\sum_{k=1}^{n-1} T(k)$.</p>
          <p>Trừ hai đẳng thức liên tiếp: $\ T(n+1) - T(n) = 2T(n) \implies T(n+1) = 3T(n) \implies \hlg{T(n) = 3^{n-1}}$.</p>
          <p class="note">Bộ đếm trong mã cho đúng $3^{n-1}$ ở mọi $n$ đã thử (ví dụ $n = 4$: 27). Bản yêu cầu ban đầu ghi “$O(4^n / n^{1,5})$” — đó là <b>số cách đặt ngoặc</b>, không phải số lời gọi.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Gọi T của n là số lời gọi của vét cạn trên đoạn dài n. Mỗi lời gọi thử mọi chỗ cắt và gọi đệ quy hai nửa, nên T của n bằng 1 cộng hai lần tổng các T trước đó. Theo quy tắc trừ hai đẳng thức liên tiếp, phần tổng triệt tiêu, còn T của n cộng 1 bằng 3 nhân T của n, nên T của n bằng 3 mũ n trừ 1. Bộ đếm trong mã cho đúng con số này, ví dụ n bằng 4 là 27. Bản yêu cầu ban đầu lại ghi một công thức khác, thực chất là số cách đặt ngoặc chứ không phải số lời gọi."
      - show: |
          <div class="box key">Số đếm (lời gọi, số lần thử điểm cắt $= \frac{n^3 - n}{6}$) là <b>số nguyên chính xác</b>, so khớp được với công thức. Thời gian chạy thì <b>đổi theo máy</b>.</div>
        say: "Bài học thứ nhất, các số đếm như số lời gọi, hay số lần thử điểm cắt bằng n mũ 3 trừ n chia 6, là số nguyên chính xác, so khớp được với công thức. Còn thời gian chạy thì đổi theo máy."

  # ───────────────────────── 5. SỐ ĐO ─────────────────────────
  - id: measure
    kind: example
    title: "Số đo thời gian: dùng bậc tăng để kiểm"
    checks:
      - "round(2138 / 0.1332) // 1000 == 16 and round(251 / 30.7, 1) == 8.2 and round(1283 / 330, 1) == 3.9 and 2**3 == 8 and 2**2 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>$n$</th><th>bảng từ dưới lên (ms)</th><th>vét cạn (ms)</th></tr>
          <tr><td>10</td><td>0,0464</td><td>9,42</td></tr>
          <tr><td>15</td><td>0,1332</td><td>2 138 — chậm hơn khoảng 16 nghìn lần</td></tr>
          <tr><td>20</td><td>0,2969</td><td>không chạy nổi</td></tr></table>
          <p>Kiểm bằng bậc tăng: $n$ từ 100 lên 200, thời gian bảng tăng <b>8,2 lần</b> (lý thuyết $2^3 = 8$), bộ nhớ tăng <b>3,9 lần</b> (lý thuyết $2^2 = 4$) ✓</p>
          <p class="note">Số đo của một máy, chạy bằng ngôn ngữ thông dịch; con số tuyệt đối sẽ khác ở máy khác, bậc tăng và thứ hạng thì ổn định.</p>
        focus: ["1.3", ["1.3", "1.4"], 2, 2, 3]
        say: "Bảng số đo trong báo cáo cho thấy, với n bằng 15, vét cạn mất hơn 2 giây, trong khi lập bảng chưa tới một phần nghìn giây. Vét cạn chậm hơn khoảng 16 nghìn lần, và từ n bằng 20 thì không chạy nổi. Số đo đáng tin hơn khi khớp lý thuyết. Khi n tăng gấp đôi từ 100 lên 200, thời gian tăng 8 phẩy 2 lần, gần 2 mũ 3 bằng 8, và bộ nhớ tăng 3 phẩy 9 lần, gần 2 mũ 2 bằng 4. Lưu ý đây là số đo trên một máy, con số tuyệt đối sẽ khác, nhưng bậc tăng và thứ hạng thì ổn định."
      - clear: true
        show: |
          <p><b>Chất lượng của tham lam</b> (đo trên 200 mảng ngẫu nhiên cho mỗi $n$):</p>
          <table class="t"><tr><th>$n$</th><th>tỉ lệ đạt tối ưu</th><th>độ lệch trung vị</th></tr>
          <tr><td>5</td><td>30%</td><td>18,1%</td></tr><tr><td>10</td><td>0%</td><td>110,3%</td></tr><tr><td>100</td><td>0%</td><td>383,9%</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Tham lam cũng phải được đo chất lượng, vì không có chứng minh. Với n bằng 5, nó đạt tối ưu ở 30 phần trăm số mảng, lệch trung vị 18 phần trăm. Từ n bằng 10, không mảng nào đạt tối ưu, lệch trung vị hơn 110 phần trăm. Với n bằng 100, chi phí lệch trung vị gần 384 phần trăm, tức gấp gần 4 phẩy 8 lần tối ưu."

  # ───────────────────────── 6. KIỂM THỬ ─────────────────────────
  - id: tests
    kind: check
    title: "Bộ kiểm thử năm nhóm, mỗi giá trị kỳ vọng có nguồn"
    checks:
      - "16 + 32 + 12 + 28 + 14 == 102 and 4 + 8 + 4 + 7 + 14 == 37"
      - "(lambda p: (lambda m: m(m, 1, 4) == 26000 and m(m, 2, 4) == 12000 and m(m, 1, 2) == 24000 and m(m, 3, 4) == 9000 and m(m, 1, 3) == 14000 and [m(m, 1, k) + m(m, k + 1, 4) + p[0] * p[k] * p[4] for k in (1, 2, 3)] == [36000, 69000, 26000] and 40*20*30 == 24000 and 40*30*30 == 36000 and 40*10*30 == 12000)(lambda f, i, j: 0 if i == j else min(f(f, i, k) + f(f, k + 1, j) + p[i - 1] * p[k] * p[j] for k in range(i, j))))((40, 20, 30, 10, 30))"
    steps:
      - show: |
          <table class="t"><tr><th>nhóm</th><th>nội dung</th></tr>
          <tr><td>1. nhỏ, tính tay</td><td>chuỗi 3–6 ma trận, có bảng tính tay</td></tr>
          <tr><td>2. thông thường</td><td>$n = 5..12$, vét cạn làm trọng tài</td></tr>
          <tr><td>3. lớn</td><td>$n = 20..200$, đo hiệu năng</td></tr>
          <tr><td>4. biên, đặc biệt</td><td>$n = 2$, ma trận vuông đồng cỡ, mọi $p_i = 1$, …</td></tr>
          <tr><td>5. không hợp lệ</td><td>thiếu phần tử, số âm, số 0, chữ cái, …</td></tr></table>
          <p>Kết quả trong báo cáo: 37 trường hợp, <b>102 phép kiểm đạt, 0 sai, 4 bỏ qua</b> (vét cạn ở nhóm 3).</p>
        focus: [0, "1.2", ["1.3", "1.4"], "1.5", "1.6", 2]
        say: "Bộ kiểm thử gồm năm nhóm. Nhóm một nhỏ, tính tay được. Nhóm hai thông thường, dùng vét cạn làm trọng tài, nhóm ba lớn để đo hiệu năng. Nhóm bốn là các trường hợp biên như chỉ hai ma trận, hay mọi kích thước bằng 1. Nhóm năm là dữ liệu không hợp lệ, để kiểm chương trình báo lỗi đúng. Kết quả là 37 trường hợp, 102 phép kiểm đạt, không có phép nào sai, và 4 phép bỏ qua vì vét cạn không chạy nổi ở nhóm ba."
      - clear: true
        show: |
          <p><b>Một phép kiểm nhóm 1, làm tay</b>: $p = (40, 20, 30, 10, 30)$, thử ba chỗ cắt cuối cùng của cả chuỗi 4 ma trận:</p>
          <table class="t"><tr><th>cắt</th><th>hai nửa</th><th>nhân hai kết quả</th><th>tổng</th></tr>
          <tr><td>$k = 1$</td><td>$0 + 12\,000$</td><td>$40 \cdot 20 \cdot 30 = 24\,000$</td><td>36 000</td></tr>
          <tr><td>$k = 2$</td><td>$24\,000 + 9\,000$</td><td>$40 \cdot 30 \cdot 30 = 36\,000$</td><td>69 000</td></tr>
          <tr><td>$k = 3$</td><td>$14\,000 + 0$</td><td>$40 \cdot 10 \cdot 30 = 12\,000$</td><td>$\hlg{26\,000}$</td></tr></table>
        focus: [1, "2.1", "2.2", "2.3", "2.4", 0]
        say: "Lấy một phép kiểm của nhóm một làm tay, đúng ví dụ chính, để thấy giá trị kỳ vọng có nguồn. Mỗi dòng cộng chi phí hai nửa với phép nhân cuối, vì hai nửa phải tính xong rồi mới nhân với nhau. Cắt sau ma trận thứ nhất, hai nửa tốn 0 và 12 nghìn, nhân hai kết quả tốn 40 nhân 20 nhân 30, bằng 24 nghìn, tổng 36 nghìn. Cắt sau ma trận thứ hai, hai nửa tốn 24 nghìn và 9 nghìn, nhân hai kết quả thêm 36 nghìn, tổng 69 nghìn. Cắt sau ma trận thứ ba, hai nửa tốn 14 nghìn và 0, nhân thêm 12 nghìn, tổng 26 nghìn. Nhỏ nhất là 26 nghìn, khớp với bảng và với vét cạn, ba nguồn độc lập cho cùng một con số."

  # ───────────────────────── 7. NHẬT KÝ AI ─────────────────────────
  - id: ailog
    kind: concept
    title: "Nhật ký làm việc với trí tuệ nhân tạo: phần quý nhất là chỗ đã sửa"
    steps:
      - show: |
          <p>Mỗi giai đoạn ghi bốn cột: <b>yêu cầu giao</b> → <b>kết quả trả về</b> → <b>vấn đề gặp phải</b> → <b>cách kiểm chứng và sửa</b>.</p>
          <table class="t"><tr><th>ban đầu ghi</th><th>kiểm chứng cho thấy</th></tr>
          <tr><td>ví dụ tính tay $p = (6;\ 0;\ 6;\ 0{,}1)$</td><td>có số 0, số thực: không phải kích thước ma trận</td></tr>
          <tr><td>vét cạn $O(4^n / n^{1,5})$</td><td>đếm được đúng $3^{n-1}$ lời gọi</td></tr>
          <tr><td>tham lam lệch khoảng 15%</td><td>18% ở $n = 5$, hàng trăm % khi $n \ge 10$</td></tr>
          <tr><td>đo bộ nhớ trong giao diện</td><td>424 KB do tính cả bộ nhớ giao diện; đo riêng còn 12,7 KB</td></tr></table>
        focus: [1, 0, "2.2", "2.3", "2.4", "2.5"]
        say: "Phần nhật ký làm việc với trí tuệ nhân tạo ghi mỗi giai đoạn bốn cột, yêu cầu giao, kết quả trả về, vấn đề gặp phải, và cách kiểm chứng, sửa chữa. Phần quý nhất là những chỗ ban đầu viết rất tự tin nhưng kiểm chứng thì sai. Ví dụ tính tay ban đầu có số 0 và số thực, không thể là kích thước ma trận. Công thức chi phí vét cạn ban đầu bị nhầm với số cách đặt ngoặc. Độ lệch của tham lam ước 15 phần trăm, đo thật thì lên tới hàng trăm phần trăm. Còn phép đo bộ nhớ trong giao diện cao gấp hơn 33 lần số thật, vì tính lẫn bộ nhớ của chính giao diện."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ cài <b>một</b> thuật toán, không có gì để so <b class="red">(sai)</b>
          <br><span class="note">Không thấy được đánh đổi, và không có “trọng tài” để kiểm đúng sai. Ít nhất: một cách chính xác nhanh, một cách thô làm chuẩn.</span></div>
        say: "Lỗi thứ nhất, chỉ cài một thuật toán. Khi đó không thấy được sự đánh đổi, cũng không có trọng tài để kiểm đúng sai. Tối thiểu nên có một cách chính xác và nhanh, cùng một cách thô làm chuẩn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chép con số từ yêu cầu hay từ trí tuệ nhân tạo mà không kiểm <b class="red">(sai)</b>
          <br><span class="note">Cả 4 dòng ở bảng nhật ký đều được viết rất tự tin. Mỗi con số trong báo cáo cần một phép kiểm <b>chạy lại được</b>.</span></div>
        say: "Lỗi thứ hai, chép con số từ yêu cầu hay từ trí tuệ nhân tạo mà không kiểm. Cả bốn dòng trong bảng nhật ký đều được viết rất tự tin. Mỗi con số trong báo cáo cần một phép kiểm chạy lại được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đo thời gian một lần rồi kết luận bậc tăng, hay đo sai đại lượng <b class="red">(sai)</b>
          <br><span class="note">Lấy trung vị nhiều lần chạy, so tỉ số khi $n$ gấp đôi với lý thuyết, và đối chiếu phép đo bằng một cách thứ hai.</span>
          $$\frac{\text{thời gian ở } n = 200}{\text{thời gian ở } n = 100} = \frac{251}{30{,}7} \approx 8{,}2 \quad \text{so với} \quad 2^3 = 8$$</div>
        say: "Lỗi thứ ba, đo thời gian một lần rồi kết luận bậc tăng, hay đo nhầm đại lượng. Hãy lấy trung vị của nhiều lần chạy, so tỉ số khi n gấp đôi với lý thuyết, và đối chiếu mỗi phép đo bằng một cách thứ hai."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhật ký chỉ ghi “dùng trí tuệ nhân tạo viết mã” <b class="red">(sai)</b>
          <br><span class="note">Người đọc cần biết: giao việc gì, nhận được gì, sai ở đâu, kiểm bằng cách nào, sửa ra sao — và người làm chịu trách nhiệm phần nộp.</span></div>
        say: "Lỗi thứ tư, nhật ký chỉ ghi một câu dùng trí tuệ nhân tạo viết mã. Người đọc cần biết đã giao việc gì, nhận được gì, sai ở đâu, kiểm bằng cách nào, sửa ra sao. Và người làm bài vẫn là người chịu trách nhiệm cho phần nộp."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "3**(6 - 1) == 243 and (6**3 - 6) // 6 == 35"
      - "round(30.7 * 8) == 246 and 6**3 == 216 and 216 - 6 == 210 and 210 // 6 == 35 and round((251 - 246) / 251 * 100) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Với $n = 6$ ma trận: vét cạn gọi bao nhiêu lần? Bảng từ dưới lên thử điểm cắt bao nhiêu lần?</td></tr>
          <tr><td>2</td><td>Đo được bảng từ dưới lên mất 30,7 ms ở $n = 100$. Dự đoán ở $n = 200$?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với 6 ma trận, vét cạn gọi bao nhiêu lần, và bảng từ dưới lên thử điểm cắt bao nhiêu lần? Câu hai, bảng từ dưới lên mất 30 phẩy 7 phần nghìn giây ở n bằng 100, hãy dự đoán thời gian ở n bằng 200. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Theo công thức đếm $T(n) = 3^{n-1}$ và số lần thử điểm cắt $\frac{n^3 - n}{6}$, với $n = 6$:</p>
          $$T(6) = 3^{5} = 3 \cdot 3 \cdot 3 \cdot 3 \cdot 3 = \hlg{243}, \qquad \frac{6^3 - 6}{6} = \frac{216 - 6}{6} = \frac{210}{6} = \hlg{35}$$
        focus: [1, 2, 2]
        say: "Câu một, thay n bằng 6 vào hai công thức đếm. Vét cạn gọi 3 mũ 5, tức năm số 3 nhân với nhau, bằng 243 lần. Còn bảng chỉ thử điểm cắt 6 mũ 3 trừ 6, chia 6, tức 216 trừ 6 bằng 210, chia 6 được 35 lần."
      - show: |
          <table class="t"><tr><th>② bước</th><th>tính</th></tr>
          <tr><td>chi phí $\Theta(n^3)$, $n$ gấp đôi</td><td>thời gian gấp khoảng $2^3 = 8$ lần</td></tr>
          <tr><td>dự đoán</td><td>$30{,}7 \cdot 8 \approx \hlg{246}$ ms</td></tr>
          <tr><td>báo cáo đo được</td><td>251 ms, lệch khoảng 2% ✓</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Câu hai, chi phí là Theta của n mũ 3, nên gấp đôi n thì thời gian tăng khoảng 2 mũ 3, bằng 8 lần. Dự đoán là 30 phẩy 7 nhân 8, khoảng 246 phần nghìn giây. Báo cáo đo được 251, chỉ lệch khoảng 2 phần trăm, khớp dự đoán."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nhiều chiến lược, mỗi cái một vai trò</span><span class="a">→</span>
          <span class="n">đếm chính xác + đo có kiểm bằng bậc tăng</span><span class="a">→</span>
          <span class="n">kiểm thử năm nhóm có nguồn kỳ vọng</span><span class="a">→</span>
          <span class="n">nhật ký: yêu cầu, kết quả, vấn đề, kiểm chứng</span></div>
        say: "Tổng kết chuỗi logic. Cài nhiều chiến lược, mỗi cái một vai trò. Dùng số đếm chính xác, và kiểm số đo bằng bậc tăng lý thuyết. Kiểm thử năm nhóm, mỗi giá trị kỳ vọng ghi rõ nguồn. Và ghi nhật ký làm việc gồm yêu cầu, kết quả, vấn đề và cách kiểm chứng."
      - show: |
          <div class="box key"><b>Tư duy:</b> bản yêu cầu — dù do thầy, do bạn hay do trí tuệ nhân tạo viết — cũng là <b>giả thuyết cần kiểm chứng</b>.</div>
        say: "Điều cần mang theo, bản yêu cầu, dù do ai viết, cũng chỉ là một giả thuyết cần kiểm chứng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 28): <b>tổng ôn</b> — bản đồ các dạng bài của cả khoá và những bẫy toán học đã gặp, mỗi bẫy kèm một phép thử.</p>
        forward_ref: true
        say: "Ở bài sau, bài 28, ta tổng ôn cả khoá, vẽ bản đồ các dạng bài và điểm lại những bẫy toán học đã gặp, mỗi bẫy kèm một phép thử. Hẹn gặp bạn ở bài tiếp theo."
