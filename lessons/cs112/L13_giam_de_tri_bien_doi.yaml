scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chỉ một bài con nhỏ hơn — hoặc đổi sang bài dễ hơn"
    steps:
      - show: |
          <p>Bài 12: <b>chia để trị</b> giải nhiều bài con rồi ghép lại.</p>
          <ul><li><b>Giảm để trị</b>: chỉ còn <b>một</b> bài con nhỏ hơn mỗi bước (như bóc từng lớp vỏ hành).</li>
          <li><b>Biến đổi để trị</b>: đổi bài toán sang dạng <b>dễ hơn</b> trước (như sơ chế nguyên liệu trước khi nấu), rồi mới giải.</li></ul>
        focus: [1, 0, "2.1", "2.2"]
        say: "Chào bạn, ở bài 12, chia để trị giải nhiều bài con rồi ghép lại. Hôm nay có hai chiến lược khác. Giảm để trị chỉ còn một bài con nhỏ hơn ở mỗi bước, như bóc từng lớp vỏ hành. Biến đổi để trị đổi bài toán sang một dạng dễ hơn trước, như sơ chế nguyên liệu rồi mới nấu."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: chia lấy dư và tổng từ 1 đến n trừ 1"
    checks:
      - "48 % 18 == 12 and sum(range(1, 6)) == 6 * 5 // 2 == 15"
    steps:
      - show: |
          <p>Bài 4: $a \bmod m$ là số dư khi chia $a$ cho $m$: &nbsp; $48 \bmod 18 = 12$ (vì $48 = 2 \cdot 18 + 12$).</p>
          <p>Bài 0: $\ 1 + 2 + \dots + (n - 1) = \dfrac{n(n-1)}{2}$; &nbsp; $n = 6$: $\ 1 + 2 + 3 + 4 + 5 = 15$.</p>
        focus: [0, 1, 2]
        say: "Trước hết, ta ôn lại hai công cụ. Theo bài 4, a chia lấy dư cho m là số dư khi chia a cho m, ví dụ 48 chia 18 được 2, dư 12. Theo bài 0, tổng từ 1 đến n trừ 1 bằng n nhân n trừ 1, chia 2, với n bằng 6 là 15."

  # ───────────────────────── 3. KÝ HIỆU & BA KIỂU GIẢM ─────────────────────────
  - id: kinds
    kind: symbol
    title: "Ba kiểu giảm, và ký hiệu ước chung lớn nhất"
    checks:
      - "math.gcd(48, 18) == 6"
    steps:
      - show: |
          <table class="t"><tr><th>kiểu giảm</th><th>ví dụ</th><th>hệ thức</th></tr>
          <tr><td>giảm <b>1</b></td><td>sắp xếp chèn</td><td>$T(n) = T(n-1) + (n-1)$</td></tr>
          <tr><td>giảm <b>một nửa</b></td><td>tìm kiếm nhị phân</td><td>$T(n) = T(n/2) + 1$</td></tr>
          <tr><td>giảm <b>không cố định</b></td><td>thuật toán Euclid</td><td>phụ thuộc dữ liệu</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Giảm để trị có ba kiểu. Giảm một đơn vị, như sắp xếp chèn, với hệ thức T của n trừ 1 cộng n trừ 1. Giảm một nửa, như tìm kiếm nhị phân của bài 10. Và giảm một lượng không cố định, như thuật toán chia lấy dư liên tiếp tìm ước chung lớn nhất, lượng giảm phụ thuộc dữ liệu."
      - show: |
          <p>$\gcd(a, b)$: <b>ước chung lớn nhất</b> của $a$ và $b$ — số lớn nhất chia hết cả hai. &nbsp; $\gcd(48, 18) = 6$.</p>
        introduces: [gcd]
        say: "Ký hiệu chữ gờ xê đê với a và b trong ngoặc là ước chung lớn nhất của a và b, tức số lớn nhất chia hết cả hai, ví dụ của 48 và 18 là 6."

  # ───────────────────────── 3b. HÌNH: MỘT LẦN CHÈN ─────────────────────────
