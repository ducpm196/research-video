#   “sắp xếp trước để tìm min/max trong O(1)” (sắp xếp tốn hơn n − 1 phép so sánh của cách tìm trực tiếp).
# Nối bài trước (luật 17): bài 12 — chia để trị: chia thành a bài con, trị, kết hợp; định lý thợ; bài 10 — tìm kiếm nhị phân
#   T(n) = T(n/2) + 1; bài 8 — thế ngược; bài 4 — a mod m là số dư; bài 0 — tổng 1 + … + (n − 1) = n(n − 1)/2.
