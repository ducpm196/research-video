size="20" text-anchor="middle" fill="#b45309">3</text><circle cx="360" cy="38" r="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="360" y="46" font-size="20" text-anchor="middle" fill="#b45309">4</text><rect x="85" y="165" width="100" height="50" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="135" y="199" font-size="24" text-anchor="middle" fill="#9a3412">v = 3</text><rect x="230" y="265" width="80" height="50" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="270" y="299" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="320" y="265" width="80" height="50" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="360" y="299" font-size="26" text-anchor="middle" fill="#1f2937">2</text><rect x="410" y="265" width="80" height="50" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="450" y="299" font-size="26" text-anchor="middle" fill="#1f2937">3</text><rect x="500" y="265" width="80" height="50" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="540" y="299" font-size="26" text-anchor="middle" fill="#1f2937">4</text><rect x="590" y="265" width="80" height="50" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="630" y="299" font-size="26" text-anchor="middle" fill="#1f2937">5</text><rect x="680" y="265" width="80" height="50" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="720" y="299" font-size="26" text-anchor="middle" fill="#1f2937">6</text><line x1="450" y1="117" x2="536" y2="261" stroke="#1f2937" stroke-width="3" marker-end="url(#arL13)"/><line x1="540" y1="117" x2="626" y2="261" stroke="#1f2937" stroke-width="3" marker-end="url(#arL13)"/><line x1="630" y1="117" x2="716" y2="261" stroke="#1f2937" stroke-width="3" marker-end="url(#arL13)"/><path d="M185,190 C 260,190 430,200 446,261" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arL13o)"/><circle cx="822" cy="67" r="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="822" y="75" font-size="20" text-anchor="middle" fill="#b45309">1</text><text x="850" y="75" font-size="21" fill="#1f2937">6 > 3: dời 6 sang phải</text><circle cx="822" cy="119" r="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="822" y="127" font-size="20" text-anchor="middle" fill="#b45309">2</text><text x="850" y="127" font-size="21" fill="#1f2937">5 > 3: dời 5 sang phải</text><circle cx="822" cy="171" r="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="822" y="179" font-size="20" text-anchor="middle" fill="#b45309">3</text><text x="850" y="179" font-size="21" fill="#1f2937">4 > 3: dời 4 sang phải</text><circle cx="822" cy="223" r="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="822" y="231" font-size="20" text-anchor="middle" fill="#b45309">4</text><text x="850" y="231" font-size="21" fill="#15803d">2 ≤ 3: dừng, đặt 3 sau 2</text><text x="822" y="300" font-size="21" fill="#1f2937">4 phép so sánh, 3 lần dời</text></svg></div>
        say: "Trước khi chạy cả mảng, hãy nhìn kỹ một lần chèn, chèn số 3 vào phần đã sắp 1, 2, 4, 5, 6. Ta cầm số 3 ra ngoài, gọi là v, rồi so ngược từ phần tử cuối. Lần so thứ nhất, 6 lớn hơn 3 nên 6 dời sang phải một ô, rồi 5 và 4 cũng vậy. Lần so thứ tư gặp 2, không lớn hơn 3, nên dừng và đặt 3 vào ô trống ngay sau 2. Lần chèn này tốn 4 phép so sánh và 3 lần dời. Cả thuật toán chỉ lặp lại bước chèn này, phần đã sắp lớn thêm đúng một phần tử mỗi lần, nên đây là giảm một đơn vị."

  # ───────────────────────── 4. SẮP XẾP CHÈN ─────────────────────────
  - id: insertion
    kind: example
    title: "Sắp xếp chèn: giảm một đơn vị"
    checks:
      - "(lambda ins: ins([5, 2, 4, 6, 1, 3]) == (12, [1, 2, 3, 4, 5, 6]))(lambda a: __import__('functools').reduce(lambda st, i: (lambda arr, c, v: (lambda j, c2: (arr[:j + 1] + [v] + arr[j + 1:i] + arr[i + 1:], c2))(*next(((j, c + (i - j)) for j in range(i - 1, -1, -1) if arr[j] <= v), (-1, c + i))))(st[0], st[1], st[0][i]), range(1, len(a)), (a[:], 0))[::-1])"
      - "(lambda c: c([6, 5, 4, 3, 2, 1]) == 15 and c([1, 2, 3, 4, 5, 6]) == 5)(lambda a: sum(min(i, 1 + sum(1 for j in range(i) if a[j] > a[i])) for i in range(1, len(a))))"
    steps:
      - show: |
          <p>Ý tưởng: giả sử $n - 1$ phần tử đầu <b>đã sắp xếp</b>; chèn phần tử thứ $n$ vào đúng chỗ bằng cách so ngược từ cuối.</p>
          <table class="t"><tr><th>bước</th><th>mảng</th></tr>
          <tr><td>đầu</td><td>5, 2, 4, 6, 1, 3</td></tr>
          <tr><td>chèn 2</td><td><b>2, 5</b>, 4, 6, 1, 3</td></tr>
          <tr><td>chèn 4</td><td><b>2, 4, 5</b>, 6, 1, 3</td></tr>
          <tr><td>chèn 6</td><td><b>2, 4, 5, 6</b>, 1, 3</td></tr>
          <tr><td>chèn 1</td><td><b>1, 2, 4, 5, 6</b>, 3</td></tr>
          <tr><td>chèn 3</td><td><b>1, 2, 3, 4, 5, 6</b></td></tr></table>
        focus: [1, "2.3", "2.6", "2.7"]
        say: "Sắp xếp chèn là ví dụ của giảm một đơn vị. Giả sử n trừ 1 phần tử đầu đã sắp xếp, ta chèn phần tử thứ n vào đúng chỗ bằng cách so ngược từ cuối phần đã sắp. Với mảng này, chèn 2 trước 5, rồi chèn 4 giữa 2 và 5, và cứ thế. Chèn 1 phải lùi về tận đầu, chèn 3 dừng sau 2, và mảng đã tăng dần."
      - clear: true
        show: |
          <p class="note">Sắp xếp chèn trên $[5, 2, 4, 6, 1, 3]$ cho $[1, 2, 3, 4, 5, 6]$.</p>
          <p>Tệ nhất (mảng giảm dần): phần tử thứ $i$ so với cả $i - 1$ phần tử trước: $\ T(n) = T(n-1) + (n - 1)$</p>
          $$T(n) = 1 + 2 + \dots + (n - 1) = \frac{n(n-1)}{2} \in \Theta(n^2) \quad (n = 6:\ 15)$$
          <p class="note">Tốt nhất (đã sắp xếp): mỗi phần tử so 1 lần → $n - 1$ phép so sánh, $\Theta(n)$. Ví dụ trên: 12 lần.</p>
        focus: [2, 3, 4]
        say: "Trường hợp tệ nhất là mảng giảm dần, phần tử thứ i phải so với cả i trừ 1 phần tử đứng trước, nên T của n bằng T của n trừ 1, cộng n trừ 1. Thế ngược như bài 8, ta được tổng từ 1 đến n trừ 1, bằng n nhân n trừ 1 chia 2, thuộc Theta của n bình phương, với n bằng 6 là 15. Trường hợp tốt nhất là mảng đã sắp, mỗi phần tử chỉ so một lần, tổng n trừ 1 lần, còn mảng ví dụ tốn 12 lần."

  # ───────────────────────── 5. EUCLID ─────────────────────────
  - id: euclid
    kind: concept
    title: "Thuật toán Euclid: giảm một lượng không cố định"
    checks:
      - "(lambda g: g(g, 48, 18, []) == [(48, 18), (18, 12), (12, 6), (6, 0)])(lambda f, a, b, tr: tr + [(a, b)] if b == 0 else f(f, b, a % b, tr + [(a, b)]))"
    steps:
      - show: |
          <div class="box key">$\gcd(a, b) = \gcd(b,\ a \bmod b)$, &nbsp; dừng khi $b = 0$: $\ \gcd(a, 0) = a$.</div>
          <p>$\gcd(48, 18) \to \gcd(18, 12) \to \gcd(12, 6) \to \gcd(6, 0) = \hlg{6}$</p>
          <p class="note">Mỗi bước còn đúng <b>một</b> bài con, nhỏ đi một lượng tuỳ dữ liệu — vẫn rất nhanh: số bước $\Theta(\log b)$ trong trường hợp tệ nhất.</p>
        focus: [1, 1, 2, 3]
        say: "Thuật toán chia lấy dư liên tiếp có từ thời Hy Lạp cổ đại. Nó dựa trên đẳng thức, ước chung lớn nhất của a và b bằng ước chung lớn nhất của b và a chia lấy dư cho b, dừng khi số thứ hai bằng 0. Với 48 và 18, ta đi qua 18 và 12, rồi 12 và 6, rồi 6 và 0, nên đáp số là 6. Mỗi bước còn đúng một bài con, nhỏ đi một lượng tuỳ dữ liệu, nhưng vẫn rất nhanh, chỉ khoảng lôgarit của b bước trong trường hợp tệ nhất."

  # ───────────────────────── 6. BIẾN ĐỔI ĐỂ TRỊ ─────────────────────────
  - id: presort
    kind: formula
    title: "Biến đổi để trị: sắp xếp trước rồi mới kiểm phần tử trùng"
    checks:
      - "(lambda a: (sorted(a), any(x == y for x, y in zip(sorted(a), sorted(a)[1:]))))([7, 3, 9, 3, 1]) == ([1, 3, 3, 7, 9], True)"
      - "1000 * 999 // 2 == 499500 and round(1000 * math.log2(1000)) == 9966"
    steps:
      - show: |
          <p><b>Bài toán</b>: mảng có hai phần tử bằng nhau không?</p>
          <p>Cách thô: so mọi cặp → $\ \dfrac{n(n-1)}{2} \in \Theta(n^2)$ phép so sánh.</p>
          <p>Biến đổi: <b>sắp xếp trước</b> ($\Theta(n \log n)$, ví dụ sắp xếp trộn của bài 12), rồi chỉ so các cặp <b>kề nhau</b> ($n - 1$ lần):</p>
          <p>$[7, 3, 9, 3, 1] \to [1, \hl{3, 3}, 7, 9]$: hai số kề nhau bằng nhau → có trùng. &nbsp; Tổng: $\Theta(n \log n)$.</p>
        focus: [1, 2, 3, 3, 4]
        say: "Biến đổi để trị, ví dụ bài toán hỏi mảng có hai phần tử bằng nhau không. Cách thô là so mọi cặp, tốn n nhân n trừ 1 chia 2 phép so sánh, Theta của n bình phương. Cách biến đổi là sắp xếp trước, như sắp xếp trộn của bài 12, tốn Theta của n lôgarit n. Rồi chỉ so các cặp kề nhau, vì hai số bằng nhau sau khi sắp sẽ đứng cạnh nhau. Với mảng ví dụ, sau khi sắp, hai số 3 đứng cạnh nhau, và tổng chi phí là Theta của n lôgarit n."
      - show: |
          <table class="t"><tr><th>$n = 1000$</th><th>số phép so sánh</th></tr><tr><td>cách thô</td><td>$499\,500$</td></tr><tr><td>sắp xếp trước + so kề</td><td>khoảng $n\log_2 n \approx 9\,966$, cộng $999$</td></tr></table>
        say: "Vì vậy với một nghìn phần tử, cách thô tốn gần năm trăm nghìn phép so sánh, còn sắp xếp trước chỉ khoảng mười nghìn, cộng 999 lần so cặp kề."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đếm lại phép so sánh, liệt kê ước"
    checks:
      - "(lambda cnt: [cnt([5, 2, 4, 6, 1, 3][:i], [5, 2, 4, 6, 1, 3][i]) for i in range(1, 6)] == [1, 2, 1, 4, 4] and 1 + 2 + 1 + 4 + 4 == 12)(lambda pre, v: min(len(pre), 1 + sum(1 for x in pre if x > v)))"
      - "[d for d in range(1, 19) if 18 % d == 0] == [1, 2, 3, 6, 9, 18] and [d for d in (1, 2, 3, 6, 9, 18) if 48 % d == 0] == [1, 2, 3, 6] and 48 % 9 == 3 and 48 % 18 == 12"
      - "(lambda c: c([6, 5, 4, 3, 2, 1]) == 15 == 6 * 5 // 2)(lambda a: sum(min(i, 1 + sum(1 for j in range(i) if a[j] > a[i])) for i in range(1, len(a))))"
    steps:
      - show: |
          <p><b>Phép thử</b>: chạy tay sắp xếp chèn trên $[6, 5, 4, 3, 2, 1]$ và đếm: $\ 1 + 2 + 3 + 4 + 5 = 15 = \dfrac{6 \cdot 5}{2}$ ✓</p>
          <p class="note">Mảng đã sắp $[1, \dots, 6]$: $\ 5$ lần ✓ — đúng hai đầu của khoảng từ $n - 1$ đến $n(n-1)/2$.</p>
        focus: [1, 2]
        say: "Phép thử là chạy tay sắp xếp chèn trên mảng giảm dần sáu phần tử và đếm, được 1 cộng 2 cộng 3 cộng 4 cộng 5, bằng 15, đúng công thức. Với mảng đã sắp, chỉ 5 lần, nên số phép so sánh luôn nằm giữa n trừ 1 và n nhân n trừ 1 chia 2."
      - clear: true
        show: |
          <p><b>Phép thử 2</b> — đếm lại từng lần chèn của mảng ví dụ $[5, 2, 4, 6, 1, 3]$:</p>
          <table class="t"><tr><th>chèn</th><th>so với</th><th>số phép so sánh</th></tr>
          <tr><td>2</td><td>5 (rồi hết mảng)</td><td>1</td></tr>
          <tr><td>4</td><td>5, 2 (dừng)</td><td>2</td></tr>
          <tr><td>6</td><td>5 (dừng)</td><td>1</td></tr>
          <tr><td>1</td><td>6, 5, 4, 2 (rồi hết mảng)</td><td>4</td></tr>
          <tr><td>3</td><td>6, 5, 4, 2 (dừng)</td><td>4</td></tr></table>
          <p>$1 + 2 + 1 + 4 + 4 = \hlg{12}$ ✓ khớp con số 12 ở trên.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.6", 3]
        say: "Phép thử thứ hai đếm lại từng lần chèn của mảng ví dụ, thay vì tin con số 12. Chèn 2 chỉ so với 5 rồi hết mảng, một lần. Chèn 4 so với 5 rồi gặp 2 thì dừng, hai lần. Chèn 6 so với 5 là dừng ngay, một lần. Chèn 1 phải so với cả 6, 5, 4, 2 rồi hết mảng, bốn lần. Chèn 3 so với 6, 5, 4, rồi gặp 2 thì dừng, cũng bốn lần, đúng như hình lúc nãy. Cộng lại 1 cộng 2 cộng 1 cộng 4 cộng 4, bằng 12, khớp."
      - clear: true
        show: |
          <p><b>Phép thử 3</b> — kiểm $\gcd(48, 18) = 6$ bằng cách liệt kê ước, không dùng chia lấy dư:</p>
          <table class="t"><tr><th>ước của 18</th><th>1</th><th>2</th><th>3</th><th>6</th><th>9</th><th>18</th></tr>
          <tr><td>chia hết 48?</td><td>có</td><td>có</td><td>có</td><td>$\hlg{\text{có}}$</td><td>không</td><td>không</td></tr></table>
        focus: [1, "2.1", "2.2", 0]
        say: "Phép thử thứ ba kiểm lại kết quả của thuật toán chia lấy dư liên tiếp bằng một đường khác hẳn, liệt kê ước. Các ước của 18 là 1, 2, 3, 6, 9 và 18. Trong đó 1, 2, 3 và 6 chia hết 48, còn 9 và 18 thì không, vì 48 chia 9 dư 3 và 48 chia 18 dư 12. Vậy ước chung lớn nhất là 6, khớp với kết quả chia lấy dư liên tiếp."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "100 * 1000 > 1000 * math.log2(1000) + 100 * math.log2(1000) and 5 * 1000 < 1000 * math.log2(1000) + 5 * math.log2(1000) and round(math.log2(1000), 2) == 9.97"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nhầm giảm để trị với chia để trị <b class="red">(sai)</b>
          <br><span class="note">Đếm số bài con <b>thực sự giải</b>: tìm kiếm nhị phân giải 1 (bỏ nửa kia); sắp xếp trộn giải cả 2 nửa.</span></div>
        say: "Lỗi thứ nhất, nhầm giảm để trị với chia để trị. Hãy đếm số bài con thực sự được giải. Tìm kiếm nhị phân chỉ giải một nửa và bỏ nửa kia, còn sắp xếp trộn giải cả hai nửa."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “Sắp xếp chèn luôn tốn $\Theta(n^2)$” <b class="red">(sai)</b>
          <br><span class="note">Đó là tệ nhất. Mảng gần như đã sắp xếp chỉ tốn khoảng $n$ — phải nói rõ đang xét trường hợp nào.</span></div>
        say: "Lỗi thứ hai, nói sắp xếp chèn luôn tốn Theta của n bình phương. Đó chỉ là trường hợp tệ nhất, mảng gần như đã sắp xếp chỉ tốn khoảng n bước. Phải nói rõ đang xét trường hợp nào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> “Sắp xếp trước để tìm min, max trong $\Theta(1)$” <b class="red">(sai)</b>
          <br><span class="note">Đọc phần tử đầu, cuối thì nhanh, nhưng sắp xếp đã tốn $\Theta(n\log n)$ — trong khi tìm max trực tiếp chỉ cần $n - 1$ phép so sánh.</span></div>
        say: "Lỗi thứ ba, nói sắp xếp trước để tìm số nhỏ nhất, lớn nhất trong Theta của 1. Đọc phần tử đầu, cuối thì nhanh thật, nhưng việc sắp xếp đã tốn Theta của n lôgarit n, trong khi tìm số lớn nhất trực tiếp chỉ cần n trừ 1 phép so sánh."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Sắp xếp trước chỉ để tìm <b>một</b> giá trị <b class="red">(sai)</b>
          <br><span class="note">Một lần tìm tuần tự tốn $n$; sắp xếp tốn $n\log n$ — không đáng. Đáng khi phải tìm <b>nhiều lần</b>:</span>
          $$\underbrace{k \cdot n}_{k \text{ lần tìm tuần tự}} \quad\text{so với}\quad \underbrace{n\log_2 n + k\log_2 n}_{\text{sắp xếp rồi tìm nhị phân}}$$
          <span class="note">— có lợi khi $k$ vượt quá khoảng $\log_2 n$ (với $n = 1000$: khoảng 10 lần tìm).</span></div>
        say: "Lỗi thứ tư, sắp xếp trước chỉ để tìm một giá trị. Một lần tìm tuần tự tốn n, sắp xếp đã tốn n lôgarit n, nên không đáng. Sắp xếp trước chỉ đáng khi phải tìm nhiều lần. Vì k lần tìm tuần tự tốn k nhân n, còn sắp xếp rồi tìm nhị phân tốn n lôgarit n cộng k lôgarit n. Nên chỉ có lợi khi số lần tìm vượt quá khoảng lôgarit cơ số 2 của n, với n bằng 1000 là chừng 10 lần."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda g: g(g, 84, 36, []) == [(84, 36), (36, 12), (12, 0)] and math.gcd(84, 36) == 12)(lambda f, a, b, tr: tr + [(a, b)] if b == 0 else f(f, b, a % b, tr + [(a, b)]))"
      - "(lambda c: c([4, 3, 2, 1]) == 6)(lambda a: sum(min(i, 1 + sum(1 for j in range(i) if a[j] > a[i])) for i in range(1, len(a))))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Tính $\gcd(84, 36)$ bằng thuật toán Euclid, ghi từng bước.</td></tr>
          <tr><td>2</td><td>Sắp xếp chèn $[4, 3, 2, 1]$ tốn bao nhiêu phép so sánh?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tính ước chung lớn nhất của 84 và 36 bằng thuật toán chia lấy dư liên tiếp, ghi từng bước. Câu hai, sắp xếp chèn mảng 4, 3, 2, 1 tốn bao nhiêu phép so sánh? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <table class="t"><tr><th>bước</th><th>phép chia</th><th>cặp mới</th></tr>
          <tr><td>1</td><td>$84 = 2 \cdot 36 + 12$</td><td>$\gcd(36, 12)$</td></tr>
          <tr><td>2</td><td>$36 = 3 \cdot 12 + 0$</td><td>$\gcd(12, 0) = \hlg{12}$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án câu một, làm từng bước chia lấy dư. Bước một, 84 bằng 2 lần 36, dư 12, nên chuyển sang cặp 36 và 12. Bước hai, 36 bằng 3 lần 12, dư 0, nên dừng, và ước chung lớn nhất là 12."
      - clear: true
        show: |
          <table class="t"><tr><th>chèn</th><th>so với</th><th>số phép so sánh</th></tr>
          <tr><td>3</td><td>4</td><td>1</td></tr><tr><td>2</td><td>4, 3</td><td>2</td></tr><tr><td>1</td><td>4, 3, 2</td><td>3</td></tr></table>
          <p>$1 + 2 + 3 = \hlg{6} = \dfrac{4 \cdot 3}{2}$ — đúng công thức trường hợp tệ nhất.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Câu hai, mảng giảm dần bốn phần tử là trường hợp tệ nhất, mỗi phần tử phải so với mọi phần tử đứng trước. Chèn 3 so với 4, một lần. Chèn 2 so với 4 và 3, hai lần. Chèn 1 so với cả ba, ba lần. Tổng 1 cộng 2 cộng 3, bằng 6 phép so sánh, đúng bằng 4 nhân 3 chia 2."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">giảm để trị: một bài con</span><span class="a">→</span>
          <span class="n">giảm 1: chèn, $\Theta(n^2)$ tệ nhất</span><span class="a">→</span>
          <span class="n">giảm nửa: nhị phân, $\Theta(\log n)$</span><span class="a">→</span>
          <span class="n">giảm tuỳ dữ liệu: Euclid</span><span class="a">→</span>
          <span class="n">biến đổi: sắp trước, kiểm trùng $\Theta(n\log n)$</span></div>
        say: "Tổng kết chuỗi logic. Giảm để trị chỉ để lại một bài con. Giảm một đơn vị như sắp xếp chèn tốn Theta của n bình phương ở trường hợp tệ nhất. Giảm một nửa như tìm kiếm nhị phân tốn Theta của lôgarit n, còn giảm tuỳ dữ liệu như thuật toán chia lấy dư liên tiếp. Biến đổi để trị thì sắp xếp trước, nhờ đó kiểm phần tử trùng chỉ tốn Theta của n lôgarit n."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi giải, hỏi “có dạng nào <b>dễ hơn</b> của bài này không?” — và luôn cộng cả chi phí biến đổi vào.</div>
        say: "Điều cần mang theo, trước khi giải hãy hỏi bài này có dạng nào dễ hơn không, và luôn cộng cả chi phí biến đổi vào tổng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>quay lui</b> — thử từng lựa chọn, đi vào ngõ cụt thì lùi lại, và nhớ <b>xoá dấu</b> đã đánh trước khi thử lựa chọn khác.</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, ta học chiến lược quay lui, thử từng lựa chọn, đi vào ngõ cụt thì lùi lại, và nhớ xoá dấu đã đánh trước khi thử lựa chọn khác. Hẹn gặp bạn ở bài tiếp theo."
