scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lưu một triệu số điện thoại thế nào cho nhanh?"
    steps:
      - show: |
          <p class="big">Danh bạ một triệu số. Hai việc hay làm:</p>
          <ul><li>Đọc số thứ $i$ (ví dụ số thứ 500 000)</li><li>Chèn một số mới vào <b>đầu</b> danh bạ</li></ul>
        focus: [1, 1, "2.1", "2.2"]
        say: "Chào bạn, giả sử ta lưu một danh bạ một triệu số điện thoại. Có hai việc hay làm. Thứ nhất, đọc số thứ i, ví dụ số thứ năm trăm nghìn. Thứ hai, chèn một số mới vào đầu danh bạ."
      - show: |
          <div class="box key">Không có cách lưu nào nhanh cho <b>mọi</b> việc. Hôm nay: mảng, mảng động, danh sách liên kết — và cái giá của từng thao tác, viết bằng $\Theta$ của bài 1.</div>
        say: "Không có cách lưu nào nhanh cho mọi việc. Hôm nay ta học ba cách lưu, mảng, mảng động và danh sách liên kết, rồi đo cái giá của từng thao tác bằng ký hiệu Theta lớn của bài 1, tức là cùng bậc."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Bộ nhớ là một dãy ô có số thứ tự"
    checks:
      - "4 * 3 == 12"
    steps:
      - show: |
          <p>Bộ nhớ máy tính: một dãy rất dài các ô, mỗi ô 1 byte, có số thứ tự gọi là <b>địa chỉ</b>.</p>
          <p>Một số nguyên thường chiếm 4 byte → 3 số nguyên liền nhau chiếm $4 \cdot 3 = 12$ byte.</p>
        focus: [0, 1, 2]
        say: "Ôn một điều về máy tính. Bộ nhớ là một dãy rất dài các ô nhỏ, và mỗi ô có một số thứ tự gọi là địa chỉ. Một số nguyên thường chiếm 4 ô liền nhau, nên ba số nguyên đặt liền nhau chiếm 12 ô."

  # ───────────────────────── 3. MẢNG ─────────────────────────
  - id: sym_addr
    kind: symbol
    title: "Mảng: các phần tử nằm liền nhau, tính được địa chỉ"
    checks:
      - "1000 + 3*4 == 1012 and [1000 + i*4 for i in range(5)] == [1000, 1004, 1008, 1012, 1016]"
    steps:
      - show: |
          <p>$A[i]$: phần tử ở <b>vị trí $i$</b> của mảng $A$, đếm từ 0 ($A[0]$ là phần tử đầu tiên).</p>
          <table class="t"><tr><th>phần tử</th><td>$A[0]$</td><td>$A[1]$</td><td>$A[2]$</td><td>$A[3]$</td><td>$A[4]$</td></tr>
          <tr><th>địa chỉ</th><td>1000</td><td>1004</td><td>1008</td><td>1012</td><td>1016</td></tr></table>
        focus: [0, 1, "2.2"]
        say: "Mảng là cách lưu các phần tử nằm liền nhau trong bộ nhớ. Chữ A với i trong ngoặc vuông là phần tử ở vị trí i, đếm từ 0, nên phần tử ở vị trí 0 là phần tử đầu tiên. Nếu phần tử đầu ở địa chỉ 1000 và mỗi phần tử chiếm 4 ô, các phần tử tiếp theo nằm ở 1004, 1008, và cứ thế tiếp tục."
      - show: |
          <div class="box key">$$\text{Addr}(A[i]) = \text{Base} + i \cdot s$$
          <span class="note">Base: địa chỉ của $A[0]$; $\ s$: số byte của một phần tử. &nbsp; Ví dụ: $1000 + 3 \cdot 4 = \hlg{1012}$ là địa chỉ của $A[3]$.</span></div>
        say: "Vì liền nhau, địa chỉ của A i bằng địa chỉ đầu cộng i nhân s, với s là số ô nhớ mà một phần tử chiếm. Ví dụ, A ba nằm ở 1000 cộng 3 nhân 4, bằng 1012, đúng như bảng."
      - show: |
          <p>Đọc $A[i]$: một phép nhân, một phép cộng, một lần đọc ô nhớ — <b>không phụ thuộc $n$</b> → $\Theta(1)$.</p>
          <p class="note">$\Theta(1)$: số bước bị chặn bởi một hằng số, dù mảng có 10 hay 10 triệu phần tử.</p>
        focus: [1, 2]
        say: "Vậy đọc A i chỉ cần một phép nhân, một phép cộng và một lần đọc ô nhớ, không phụ thuộc mảng dài bao nhiêu. Theta của 1 nghĩa là số bước bị chặn bởi một hằng số, dù mảng có mười hay mười triệu phần tử."

  # ───────────────────────── 4. CHÈN VÀO MẢNG ─────────────────────────
  - id: insert_front
    kind: concept
    title: "Cái giá của mảng: chèn vào đầu phải dời mọi phần tử"
    checks:
      - "(lambda a: [9] + a)([7, 3, 5, 2, 8]) == [9, 7, 3, 5, 2, 8] and len([7, 3, 5, 2, 8]) == 5"
    steps:
      - show: |
          <p>Chèn 9 vào đầu $\ [7, 3, 5, 2, 8]$: phải dời 5 phần tử sang phải một ô, rồi mới ghi 9 vào $A[0]$.</p>
          <p>$[\,\_\,, 7, 3, 5, 2, 8] \ \to\ [\hlg{9}, 7, 3, 5, 2, 8]$</p>
          <div class="box warn">Mảng $n$ phần tử: chèn vào đầu tốn $n$ lần dời → $\Theta(n)$.</div>
        focus: [1, 2, 3]
        say: "Cái giá của mảng là khi chèn. Muốn chèn số 9 vào đầu mảng năm phần tử, ta phải dời cả năm phần tử sang phải một ô, rồi mới ghi 9 vào vị trí đầu. Với mảng n phần tử, chèn vào đầu tốn n lần dời, tức Theta của n."

  # ───────────────────────── 5. MẢNG ĐỘNG ─────────────────────────
  - id: dynamic
    kind: concept
    title: "Mảng động: hết chỗ thì xin vùng gấp đôi"
    checks:
      - "(lambda f: f(f, 1, 0, 0, [], 9))(lambda f, cap, s, c, log, n: (c, log, cap) if n == 0 else (f(f, 2*cap, s + 1, c + s, log + [s], n - 1) if s == cap else f(f, cap, s + 1, c, log, n - 1))) == (15, [1, 2, 4, 8], 16)"
    steps:
      - show: |
          <p>Mảng động giữ hai con số: <b>kích thước</b> (số phần tử đang có) và <b>sức chứa</b> (số ô đã xin).</p>
          <p>Thêm vào cuối: còn chỗ thì ghi vào ($\Theta(1)$). Hết chỗ: xin vùng mới <b>gấp đôi</b>, chép hết sang, rồi mới ghi.</p>
        focus: [0, 1, 2, 2]
        say: "Mảng thường có kích thước cố định. Mảng động giữ hai con số, kích thước là số phần tử đang có, và sức chứa là số ô đã xin. Khi thêm vào cuối mà còn chỗ, ta chỉ việc ghi vào. Khi hết chỗ, ta xin một vùng mới gấp đôi, chép hết phần tử cũ sang, rồi mới ghi."
      - show: |
          <table class="t"><tr><th>thêm phần tử thứ</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6–8</th><th>9</th></tr>
          <tr><td>sức chứa trước khi thêm</td><td>1</td><td>1</td><td>2</td><td>4</td><td>4</td><td>8</td><td>8</td></tr>
          <tr><td>số lần chép</td><td>0</td><td>1</td><td>2</td><td>0</td><td>4</td><td>0</td><td>8</td></tr></table>
          <p>Thêm 9 phần tử, bắt đầu từ sức chứa 1: tổng số lần chép $\ 1 + 2 + 4 + 8 = \hlg{15}$.</p>
        focus: [1, "1.3", "1.3", 2]
        say: "Thử thêm 9 phần tử, bắt đầu với sức chứa 1. Việc chép chỉ xảy ra khi đầy, lúc thêm phần tử thứ 2, 3, 5 và 9. Mỗi lần chép đúng bằng số phần tử đang có, là 1, 2, 4, rồi 8. Tổng cộng chỉ 15 lần chép cho 9 lần thêm."

  # ───────────────────────── 6. KHẤU HAO ─────────────────────────
  - id: amortized
    kind: formula
    title: "Vì sao mỗi lần thêm cuối chỉ tốn Θ(1) khấu hao"
    checks:
      - "(lambda sim: all(sim(n) < 2*n for n in range(1, 3000)) and sim(9) == 15 and sim(1025) == 2047)(lambda n: __import__('functools').reduce(lambda st, _: (2*st[0], st[1] + 1, st[2] + st[1]) if st[1] == st[0] else (st[0], st[1] + 1, st[2]), range(n), (1, 0, 0))[2])"
      - "15 < 2 * 9 == 18 and 9 + 15 == 24 < 3 * 9 == 27"
      - "1024 == 2**10"
    steps:
      - show: |
          <p>Thêm $n$ phần tử: chép xảy ra ở các kích thước $1, 2, 4, \dots, 2^k$ với $2^k < n$. Theo tổng lũy thừa của 2 (bài 0):</p>
          $$1 + 2 + 4 + \dots + 2^k = 2^{k+1} - 1 < 2n \quad (\text{vì } 2^k < n)$$
        focus: [1, 2]
        say: "Tổng quát, khi thêm n phần tử, việc chép xảy ra ở các kích thước 1, 2, 4, cho tới 2 mũ k, với 2 mũ k nhỏ hơn n. Theo công thức tổng lũy thừa của 2 ở bài 0, tổng này bằng 2 mũ k cộng 1 trừ 1, nên nhỏ hơn 2n."
      - show: |
          <p>Tổng chi phí $n$ lần thêm $\ <\ n$ (ghi) $+\ 2n$ (chép) $= 3n$. &nbsp; Chia đều: mỗi lần thêm $< 3$ bước → $\Theta(1)$ <b>khấu hao</b>.</p>
          <p>Thử $n = 9$: $\ 9 + 15 = 24 < 27$ ✓</p>
        focus: [1, 2]
        say: "Cộng thêm n lần ghi, tổng chi phí n lần thêm nhỏ hơn 3n, nên chia đều mỗi lần thêm tốn chưa tới 3 bước, gọi là Theta của 1 khấu hao. Thử với n bằng 9, ta có 9 cộng 15 bằng 24, nhỏ hơn 27."
      - show: |
          <div class="box key"><b>Khấu hao</b> = chi phí của <b>cả dãy</b> thao tác chia đều cho số thao tác. Đây là bảo đảm chắc chắn cho mọi dãy, không phải “trung bình nếu may mắn”.</div>
          <p class="note">Nhưng <b>một</b> lần thêm riêng lẻ vẫn có thể tốn $\Theta(n)$: thêm phần tử thứ 1025 phải chép 1024 phần tử.</p>
        focus: [1, 2]
        say: "Lưu ý, khấu hao nghĩa là lấy chi phí của cả dãy thao tác chia đều cho số thao tác, nên đó là bảo đảm chắc chắn cho mọi dãy, không phải trung bình nếu gặp may. Nhưng một lần thêm riêng lẻ vẫn có thể tốn Theta của n, ví dụ lần thêm thứ 1025 phải chép 1024 phần tử."

  # ───────────────────────── 7. DANH SÁCH LIÊN KẾT ─────────────────────────
  - id: linked
    kind: intuition
    title: "Danh sách liên kết: các nút móc nối như toa tàu"
    steps:
      - show: |
          <svg width="1180" height="190" viewBox="0 0 1180 190">
            <defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1f2937"/></marker></defs>
            <text x="20" y="40" font-size="30" fill="#d97706" font-weight="700">head</text>
            <line x1="60" y1="55" x2="60" y2="88" stroke="#d97706" stroke-width="4" marker-end="url(#ar)"/>
            <rect x="20" y="95" width="120" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><line x1="100" y1="95" x2="100" y2="165" stroke="#2563eb" stroke-width="3"/>
            <text x="45" y="142" font-size="34">7</text><circle cx="120" cy="130" r="6" fill="#1f2937"/>
            <line x1="126" y1="130" x2="268" y2="130" stroke="#1f2937" stroke-width="4" marker-end="url(#ar)"/>
            <rect x="280" y="95" width="120" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><line x1="360" y1="95" x2="360" y2="165" stroke="#2563eb" stroke-width="3"/>
            <text x="305" y="142" font-size="34">3</text><circle cx="380" cy="130" r="6" fill="#1f2937"/>
            <line x1="386" y1="130" x2="528" y2="130" stroke="#1f2937" stroke-width="4" marker-end="url(#ar)"/>
            <rect x="540" y="95" width="120" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><line x1="620" y1="95" x2="620" y2="165" stroke="#2563eb" stroke-width="3"/>
            <text x="565" y="142" font-size="34">9</text><text x="626" y="142" font-size="26" fill="#e11d48">∅</text>
            <text x="700" y="120" font-size="26" fill="#6b7280">mỗi nút: (dữ liệu, next)</text>
            <text x="700" y="158" font-size="26" fill="#6b7280">∅ = NULL: không trỏ tới đâu</text>
          </svg>
        say: "Danh sách liên kết lưu mỗi phần tử trong một nút. Mỗi nút gồm dữ liệu và một con trỏ, chỉ địa chỉ của nút kế tiếp, giống các toa tàu móc nối. Biến đầu danh sách trỏ vào nút đầu tiên, còn nút cuối có con trỏ rỗng, không trỏ tới đâu."
      - show: |
          <p>Các nút <b>không cần nằm liền nhau</b> → không tính được địa chỉ nút thứ $i$: phải đi từ đầu, $i$ bước → $\Theta(n)$ khi $i$ ở cuối.</p>
        say: "Vì các nút không cần nằm liền nhau, ta không tính được địa chỉ của nút thứ i. Muốn tới nó phải đi từ đầu, qua i bước, nên với nút ở cuối danh sách, việc đọc tốn Theta của n."

  - id: insert_head
    kind: example
    title: "Chèn vào đầu danh sách: hai phép gán, đúng thứ tự"
    checks:
      - "(lambda head: (lambda node: (node.update({'next': head}) or node))({'v': 4, 'next': None}))({'v': 7, 'next': None})['next']['v'] == 7"
    steps:
      - show: |
          <div class="code"><div>node = nút mới chứa 4;</div><div>node.next = head;   <span class="cm">// ① nút mới trỏ vào nút đầu cũ</span></div><div>head = node;        <span class="cm">// ② đầu danh sách là nút mới</span></div></div>
          <p>Hai phép gán, không phụ thuộc $n$ → $\Theta(1)$. &nbsp; Danh sách $7 \to 3 \to 9$ thành $\hlg{4} \to 7 \to 3 \to 9$.</p>
        focus: [0, "1.1", "1.2", "1.3", 2]
        say: "Chèn số 4 vào đầu danh sách. Đầu tiên tạo một nút mới chứa 4. Bước một, cho nút mới trỏ vào nút đầu cũ. Bước hai, cho biến đầu danh sách trỏ vào nút mới. Chỉ hai phép gán, không phụ thuộc n, nên tốn Theta của 1, và danh sách 7, 3, 9 thành 4, 7, 3, 9."
      - show: |
          <p class="note">Danh sách <b>đôi</b>: mỗi nút thêm con trỏ <b>prev</b> về nút trước → đi được cả hai chiều, và xoá một nút đã biết vị trí chỉ cần $\Theta(1)$.</p>
        say: "Danh sách liên kết đôi thêm cho mỗi nút một con trỏ về nút trước, nên đi được cả hai chiều, và xoá một nút khi đã biết vị trí của nó chỉ tốn Theta của 1."

  # ───────────────────────── 8. SO SÁNH ─────────────────────────
  - id: compare
    kind: concept
    title: "Bảng so sánh ba cách lưu"
    steps:
      - show: |
          <table class="t"><tr><th>thao tác</th><th>mảng</th><th>mảng động</th><th>danh sách liên kết đơn</th></tr>
          <tr><td>đọc phần tử thứ $i$</td><td>$\Theta(1)$</td><td>$\Theta(1)$</td><td>$\Theta(i)$, tệ nhất $\Theta(n)$</td></tr>
          <tr><td>chèn vào đầu</td><td>$\Theta(n)$</td><td>$\Theta(n)$</td><td>$\Theta(1)$</td></tr>
          <tr><td>thêm vào cuối</td><td>không được khi đầy</td><td>$\Theta(1)$ khấu hao</td><td>$\Theta(1)$ nếu giữ con trỏ cuối</td></tr>
          <tr><td>tìm giá trị $x$ (chưa sắp xếp)</td><td>$\Theta(n)$</td><td>$\Theta(n)$</td><td>$\Theta(n)$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Đặt cạnh nhau, ta có bảng so sánh. Đọc phần tử thứ i, mảng thắng với Theta của 1, còn danh sách phải đi i bước. Chèn vào đầu thì ngược lại, danh sách chỉ tốn Theta của 1. Thêm vào cuối, mảng động tốn Theta của 1 khấu hao, danh sách cũng vậy nếu giữ thêm con trỏ tới nút cuối. Còn tìm một giá trị khi chưa sắp xếp thì cả ba đều phải duyệt hết, Theta của n."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: mô phỏng nhỏ bằng tay"
    checks:
      - "15 < 18 and 2**4 == 16 > 9 > 2**3"
      - "[1, 1 + 2, 1 + 2 + 4, 1 + 2 + 4 + 8] == [1, 3, 7, 15] and (lambda n: __import__('functools').reduce(lambda st, _: (2*st[0], st[1] + 1, st[2] + st[1]) if st[1] == st[0] else (st[0], st[1] + 1, st[2]), range(n), (1, 0, 0)))(9) == (16, 9, 15)"
      - "(lambda nodes: nodes == [4, 7, 3, 9])((lambda head: (lambda walk: walk(walk, head))(lambda w, nd: [] if nd is None else [nd['v']] + w(w, nd['next'])))((lambda old: {'v': 4, 'next': old})({'v': 7, 'next': {'v': 3, 'next': {'v': 9, 'next': None}}})))"
      - "len([4, 7, 3, 9]) == 3 + 1"
    steps:
      - show: |
          <p><b>Phép thử</b> cho khấu hao: mô phỏng tay rồi so với cận $2n$, với $n = 9$.</p>
          <table class="t"><tr><th>đầy khi kích thước</th><th>1</th><th>2</th><th>4</th><th>8</th></tr>
          <tr><td>số lần chép</td><td>1</td><td>2</td><td>4</td><td>8</td></tr>
          <tr><td>cộng dồn</td><td>1</td><td>3</td><td>7</td><td>$\hlg{15}$</td></tr></table>
          <p>15 lần chép $< 2 \cdot 9 = 18$ ✓, và sức chứa cuối là 16 — lũy thừa của 2 nhỏ nhất không nhỏ hơn 9.</p>
          <p class="note">Máy đã mô phỏng mọi $n$ từ 1 đến 4999: tổng chép luôn $< 2n$.</p>
        focus: [1, 3, 4]
        say: "Phép thử cho khấu hao là mô phỏng tay rồi so với cận 2n, ở đây n bằng 9. Với n bằng 9, có 15 lần chép, nhỏ hơn 18, và sức chứa cuối là 16, vì đó là lũy thừa của 2 nhỏ nhất không nhỏ hơn 9. Máy cũng đã mô phỏng mọi n đến 4999, tổng số lần chép luôn nhỏ hơn 2n."
      - clear: true
        show: |
          <p>Kiểm phép chèn đầu bằng <b>đường khác</b>: đi lại danh sách từ head, theo từng con trỏ next.</p>
          <table class="t"><tr><th>bước đi</th><th>đang ở nút</th><th>next trỏ tới</th></tr>
          <tr><td>1</td><td>4</td><td>7</td></tr>
          <tr><td>2</td><td>7</td><td>3</td></tr>
          <tr><td>3</td><td>3</td><td>9</td></tr>
          <tr><td>4</td><td>9</td><td>NULL</td></tr></table>
          <p>Gặp 4 nút $= 3$ nút cũ $+ 1$ ✓, đúng thứ tự $4, 7, 3, 9$.</p>
        focus: [1, ["2.2", "2.3", "2.4"], "2.5", 3]
        say: "Kiểm phép chèn đầu bằng đường khác, ta không tin hình vẽ mà đi lại danh sách từ biến đầu, theo từng con trỏ tới nút kế tiếp. Bắt đầu ở nút 4, nó trỏ tới 7, nút 7 trỏ tới 3, nút 3 trỏ tới 9. Nút 9 trỏ tới rỗng, nên ta dừng. Gặp đúng 4 nút, bằng 3 nút cũ cộng nút mới, và đúng thứ tự 4, 7, 3, 9, nên không nút nào bị mất."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "sum(range(1, 1000)) == 999 * 1000 // 2 == 499500"
      - "sum(range(1, 9)) == 36 and (lambda n: __import__('functools').reduce(lambda st, _: (2*st[0], st[1] + 1, st[2] + st[1]) if st[1] == st[0] else (st[0], st[1] + 1, st[2]), range(n), (1, 0, 0)))(9)[2] == 15 and (lambda n: __import__('functools').reduce(lambda st, _: (2*st[0], st[1] + 1, st[2] + st[1]) if st[1] == st[0] else (st[0], st[1] + 1, st[2]), range(n), (1, 0, 0)))(1000)[2] == 1023 == 1 + 2 + 4 + 8 + 16 + 32 + 64 + 128 + 256 + 512"
      - "(lambda head: (lambda node: (node.update({'next': node}) or node))({'v': 4, 'next': None}))({'v': 7, 'next': None})['next']['v'] == 4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Hiểu “$\Theta(1)$ khấu hao” là “trung bình, nếu may mắn” <b class="red">(sai)</b>
          <br><span class="note">Đó là bảo đảm cho <b>mọi</b> dãy thao tác. Còn một lần thêm riêng lẻ vẫn có thể tốn $\Theta(n)$.</span></div>
        say: "Lỗi thứ nhất, hiểu Theta của 1 khấu hao là trung bình nếu may mắn. Thật ra đó là bảo đảm cho mọi dãy thao tác, còn một lần thêm riêng lẻ vẫn có thể tốn Theta của n."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hết chỗ thì xin thêm <b>1</b> ô thay vì gấp đôi <b class="red">(sai)</b>
          <br><span class="note">Mỗi lần thêm đều phải chép: $1 + 2 + \dots + (n - 1) = \dfrac{(n - 1)n}{2}$ → $\Theta(n^2)$ cho cả dãy.</span></div>
          <table class="t"><tr><th>$n$</th><th>xin thêm 1 ô</th><th>gấp đôi</th></tr>
          <tr><td>9</td><td>36 lần chép</td><td>15 lần chép</td></tr>
          <tr><td>1000</td><td>499 500 lần chép</td><td>1023 lần chép</td></tr></table>
        focus: [1, 1, ["2.2", "2.3"]]
        say: "Lỗi thứ hai, hết chỗ thì chỉ xin thêm một ô. Khi đó lần thêm nào cũng phải chép, tổng là n trừ 1 nhân n chia 2, theo công thức tổng của bài 0, tức Theta của n bình phương. Với n bằng 1000, đã gần nửa triệu lần chép, trong khi gấp đôi chỉ cần 1023 lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gán sai thứ tự khi chèn đầu: <code>head = node;</code> rồi <code>node.next = head;</code> <b class="red">(sai)</b>
          <br><span class="note">Lúc đó head đã là node, nên node trỏ vào <b>chính nó</b> và phần còn lại của danh sách bị mất. Phép thử: vẽ hình ba nút và theo từng phép gán.</span></div>
        say: "Lỗi thứ ba, gán sai thứ tự khi chèn vào đầu, gán biến đầu danh sách trước rồi mới nối nút mới. Lúc đó nút mới trỏ vào chính nó, và cả phần còn lại của danh sách bị mất. Phép thử là vẽ ba nút ra giấy và theo từng phép gán."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đi tiếp qua con trỏ rỗng, hoặc xoá nút mà không trả bộ nhớ <b class="red">(sai)</b>
          <br><span class="note">Luôn kiểm tra con trỏ khác NULL trước khi đọc <code>next</code>. Trong ngôn ngữ tự quản lý bộ nhớ, nút bị gỡ mà không giải phóng gây <b>rò rỉ bộ nhớ</b>.</span></div>
        say: "Lỗi thứ tư, đi tiếp qua con trỏ rỗng ở cuối danh sách, hoặc gỡ nút mà không trả lại bộ nhớ. Luôn kiểm tra con trỏ khác rỗng trước khi đi tiếp. Trong những ngôn ngữ mà lập trình viên tự quản lý bộ nhớ, nút bị gỡ mà không giải phóng sẽ gây rò rỉ bộ nhớ."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "2000 + 5*8 == 2040"
      - "1 + 2 + 4 + 8 + 16 == 31 < 2 * 17 == 34 and (lambda n: __import__('functools').reduce(lambda st, _: (2*st[0], st[1] + 1, st[2] + st[1]) if st[1] == st[0] else (st[0], st[1] + 1, st[2]), range(n), (1, 0, 0)))(17)[2] == 31"
      - "5 * 8 == 40 and 2000 + 40 == 2040"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mảng có $A[0]$ ở địa chỉ 2000, mỗi phần tử 8 byte. $A[5]$ ở địa chỉ nào?</td></tr>
          <tr><td>2</td><td>Mảng động bắt đầu với sức chứa 1, nhân đôi khi đầy. Thêm 17 phần tử: tổng bao nhiêu lần chép? So với $2n$.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, mảng có phần tử đầu ở địa chỉ 2000, mỗi phần tử chiếm 8 ô nhớ, hỏi A năm ở địa chỉ nào? Câu hai, mảng động bắt đầu với sức chứa 1 và nhân đôi khi đầy, thêm 17 phần tử thì tổng bao nhiêu lần chép, và so với 2n ra sao? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① Theo công thức địa chỉ, Base $= 2000$, $s = 8$, $i = 5$:</p>
          $$\text{Addr}(A[5]) = 2000 + 5 \cdot 8 = 2000 + 40 = \hlg{2040}$$
        focus: [1, 2]
        say: "Câu một, theo công thức địa chỉ, địa chỉ đầu là 2000, mỗi phần tử chiếm 8 ô nhớ, và vị trí là 5. Vậy 5 nhân 8 bằng 40, cộng 2000 được 2040."
      - clear: true
        show: |
          <p>② Chép chỉ xảy ra khi thêm vào lúc đầy:</p>
          <table class="t"><tr><th>thêm phần tử thứ</th><th>2</th><th>3</th><th>5</th><th>9</th><th>17</th></tr>
          <tr><td>số lần chép</td><td>1</td><td>2</td><td>4</td><td>8</td><td>16</td></tr></table>
          <p>$1 + 2 + 4 + 8 + 16 = \hlg{31} < 2 \cdot 17 = 34$ ✓</p>
        focus: [1, "2.2", 3]
        say: "Câu hai, việc chép chỉ xảy ra khi thêm vào lúc mảng đầy. Đó là lúc thêm phần tử thứ 2, 3, 5, 9 và 17, mỗi lần chép đúng số phần tử đang có, là 1, 2, 4, 8 và 16. Tổng 31 lần, nhỏ hơn 2 nhân 17 bằng 34, đúng như cận khấu hao."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mảng: liền nhau, $\text{Base} + i \cdot s$</span><span class="a">→</span>
          <span class="n">đọc $\Theta(1)$, chèn đầu $\Theta(n)$</span><span class="a">→</span>
          <span class="n">mảng động: gấp đôi, thêm cuối $\Theta(1)$ khấu hao</span><span class="a">→</span>
          <span class="n">danh sách liên kết: chèn đầu $\Theta(1)$, đọc $\Theta(n)$</span></div>
        say: "Tổng kết chuỗi logic. Mảng đặt phần tử liền nhau nên tính được địa chỉ, đọc tốn Theta của 1 nhưng chèn đầu tốn Theta của n. Mảng động nhân đôi khi đầy, nên thêm cuối tốn Theta của 1 khấu hao. Danh sách liên kết thì ngược với mảng, chèn đầu rẻ nhưng đọc phần tử thứ i đắt."
      - show: |
          <div class="box key"><b>Tư duy:</b> chọn cấu trúc theo <b>thao tác hay dùng nhất</b>. Và khi nói chi phí, nói rõ: một lần, tệ nhất, hay khấu hao.</div>
        say: "Điều cần mang theo, hãy chọn cấu trúc theo thao tác hay dùng nhất. Và khi nói chi phí, hãy nói rõ đó là chi phí một lần, trường hợp tệ nhất, hay khấu hao."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>ngăn xếp và hàng đợi</b> — hai cấu trúc chỉ cho thêm, lấy ở đầu hoặc cuối, xây ngay trên mảng hoặc danh sách liên kết.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học ngăn xếp và hàng đợi, hai cấu trúc chỉ cho thêm và lấy phần tử ở một đầu nhất định, xây ngay trên mảng hoặc danh sách liên kết vừa học. Hẹn gặp bạn ở bài tiếp theo."
