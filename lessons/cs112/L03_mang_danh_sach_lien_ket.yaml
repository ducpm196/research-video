# Quy ước ký hiệu: chỉ số mảng bắt đầu từ 0 (A[0] là phần tử đầu); s = số byte của một phần tử; \text{Addr}(A[i]) = địa chỉ ô nhớ;
#   chi phí viết bằng Θ (bài 1); nhân hai số: ·; tên tiếng Anh (head, next, NULL) chỉ hiện trên màn hình, lời đọc dùng tên Việt.
# Sửa bản thảo (AUDIT_CS112 §2): C6b “khấu hao” là bảo đảm cho CẢ DÃY thao tác, không phải trung bình xác suất;
#   một lần thêm tệ nhất vẫn tốn Θ(n).
# Nối bài trước (luật 17): bài 0 — tổng 1 + 2 + 4 + … + 2^k = 2^(k+1) − 1 và tổng 1 + 2 + … + n = n(n+1)/2; bài 1 — Θ là “cùng bậc”.
objectives:
  - "Tính địa chỉ ô nhớ của A[i] từ địa chỉ đầu và kích thước phần tử, và giải thích vì sao đọc A[i] tốn Θ(1)"
  - "Đếm số lần chép khi mảng động nhân đôi sức chứa, và chứng minh chi phí khấu hao Θ(1) cho mỗi lần thêm cuối"
  - "Chèn vào đầu danh sách liên kết đúng thứ tự gán con trỏ"
  - "So sánh chi phí đọc, chèn đầu, thêm cuối, tìm kiếm của mảng, mảng động và danh sách liên kết"
