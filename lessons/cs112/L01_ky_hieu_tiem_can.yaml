          <p><b>Kết quả mong đợi</b></p><div class="code"><div>c = 2: khong co n0</div><div>c = 3: n0 = 13</div><div>c = 4: n0 = 8</div><div>c = 5: n0 = 6</div><div>ty so f(n)/n^2 voi n = 100000: 2.0001</div></div><p class="note"><b>Git Bash</b> là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b>. Chấm bằng Git Bash: <code>bash labs/cham.sh CS112 L01 nguong.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>CS112 L01 nguong.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
        focus: [1, 2, 3]
        say: "Đây là kết quả mong đợi. Với c bằng 2 không có ngưỡng nào, vì hàm luôn lớn hơn hai n bình phương, còn c càng lớn thì ngưỡng càng nhỏ. Tỉ số tiến gần 2, đúng như phương pháp giới hạn, và bạn chấm bằng lệnh ở chân màn hình, lệnh này chạy tệp chấm bài và in chữ ĐÚNG khi mọi dòng trùng."
      - show: |
          <p class="note"><b>Nếu kẹt</b>: cho $n$ chạy <b>lùi</b> từ 2000 về 1, nhớ $n$ cuối còn đúng, dừng ở $n$ đầu tiên sai.</p>
        say: "Nếu kẹt, hãy cho n chạy lùi từ hai nghìn về một, nhớ n cuối cùng còn đúng và dừng ở n đầu tiên sai."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ hằng số, giữ bậc cao</span><span class="a">→</span>
          <span class="n">O: chặn trên, Ω: chặn dưới, Θ: kẹp</span><span class="a">→</span>
          <span class="n">bằng chứng: $c$, $n_0$</span><span class="a">→</span>
          <span class="n">nhanh: giới hạn $f/g$ (nếu tồn tại)</span></div>
        say: "Tổng kết chuỗi logic. Khi n rất lớn ta bỏ hằng số và giữ bậc cao nhất. O lớn là chặn trên, Omega lớn là chặn dưới, Theta lớn là kẹp cả hai phía. Bằng chứng là một cặp hằng số c và ngưỡng. Cách nhanh là lấy giới hạn của tỉ số, khi giới hạn đó tồn tại."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi câu tiệm cận là một lời hứa “<b>tồn tại</b> $c$, $n_0$ sao cho <b>với mọi</b> $n \ge n_0$…”. Viết đủ hai vế của lời hứa, rồi thay số kiểm.</div>
        say: "Điều cần mang theo, mỗi câu tiệm cận là một lời hứa, tồn tại c và ngưỡng sao cho với mọi n từ ngưỡng trở đi. Hãy viết đủ cả hai phần của lời hứa, rồi thay số để kiểm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>xếp hạng tốc độ tăng</b> của các hàm hay gặp, từ lôgarit đến giai thừa, và bẫy khi đổi cơ số của lũy thừa.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta dùng chính phương pháp giới hạn để xếp hạng tốc độ tăng của các hàm hay gặp, từ lôgarit đến giai thừa. Ta cũng sẽ gặp một cái bẫy khi đổi cơ số của lũy thừa. Hẹn gặp bạn ở bài tiếp theo."
