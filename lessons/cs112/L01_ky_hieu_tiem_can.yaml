# Quy ước ký hiệu của bài: thuộc tập hợp f(n) ∈ O(g(n)) (cách viết “f(n) = O(g(n))” chỉ nêu ở step notation_note);
#   hằng số c, c₁, c₂ > 0 và ngưỡng n₀; nhân hai số: · ; lôgarit cơ số 2: \log_2; giới hạn \lim_{n \to \infty}.
