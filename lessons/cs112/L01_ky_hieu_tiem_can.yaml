          <ol><li>Viết hàm <code>nguong(c)</code> trả về $n_0$ nhỏ nhất để $f(n) \le c \cdot n^2$ đúng với mọi $n$ từ $n_0$ đến 2000 (hoặc <code>None</code> nếu không có).</li>
          <li>Với $c = 2, 3, 4, 5$ in một dòng mỗi giá trị, rồi in tỉ số $f(n)/n^2$ tại $n = 100000$.</li></ol>
        focus: [1, "2.1", "2.2", "2.2"]
        pause: 240
        say: "Bây giờ đến phần bạn tự làm, với hàm mới, hai n bình phương cộng 10n cộng 30. Hãy viết một hàm nhận hằng số c rồi tìm ngưỡng nhỏ nhất mà từ đó f không vượt quá c nhân n bình phương, hoặc báo không có. Thử với c bằng 2, 3, 4, 5, rồi in tỉ số tại n bằng một trăm nghìn. Dừng video và làm."
