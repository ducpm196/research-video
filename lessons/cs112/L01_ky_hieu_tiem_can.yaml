objectives:
  - "Đọc thành lời và viết đúng định nghĩa O, Ω, Θ với đủ “tồn tại c, n₀” và “với mọi n ≥ n₀”"
  - "Tự chọn c₁, c₂, n₀ để chứng minh một đa thức thuộc Θ của số hạng bậc cao nhất"
  - "Dùng giới hạn của tỉ số f(n)/g(n) để xếp f vào o, Θ hay ω — và biết khi nào không dùng được"
