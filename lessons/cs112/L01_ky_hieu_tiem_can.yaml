scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Khi n rất lớn, chỉ số hạng lớn nhất còn quan trọng"
    checks:
      - "(1000**2 + 8*1000 + 4) / 4 == 252001 and 1000**2 / 4 == 250000"
      - "round(250000 / 252001 * 100, 1) == 99.2"
    steps:
      - show: |
          <p>Bài 0: hai vòng lặp lồng nhau so sánh $\ \dfrac{n^2 + 8n + 4}{4}\ $ lần ($n$ chẵn).</p>
          <p>Với $n = 1000$: $\ \dfrac{n^2}{4} = 250\,000$ trong tổng $252\,001$ — chiếm khoảng <b>99,2%</b>.</p>
        focus: [1, 2]
        say: "Chào bạn, ở bài 0, ta đếm được hai vòng lặp lồng nhau so sánh n bình phương cộng 8n cộng 4, chia 4 lần, khi n chẵn. Với n bằng 1000, riêng phần n bình phương chia 4 đã là 250 nghìn, chiếm khoảng 99 phẩy 2 phần trăm của tổng."
      - show: |
          <div class="box key">Khi $n$ rất lớn: bỏ hằng số nhân và các số hạng nhỏ, chỉ giữ “<b>tăng như $n^2$</b>”.</div>
          <p>Hôm nay: nói câu đó <b>chặt chẽ</b> bằng ba ký hiệu, chứng minh bằng hằng số, và một cách nhanh bằng giới hạn.</p>
        focus: [1, 2]
        say: "Vậy khi n rất lớn, ta chỉ cần nói số bước tăng như n bình phương. Hôm nay ta học cách nói câu đó thật chặt chẽ bằng ba ký hiệu, cách chứng minh bằng hằng số, và một cách nhanh hơn bằng giới hạn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: so sánh n với n bình phương khi n từ 1 trở lên"
    checks:
      - "all(m <= m*m and 1 <= m*m for m in range(1, 1000))"
      - "5*2 <= 5*2**2 and 2 <= 2*2**2"
      - "[(m, 5*m, 5*m*m, 2, 2*m*m) for m in (1, 2, 3)] == [(1, 5, 5, 2, 2), (2, 10, 20, 2, 8), (3, 15, 45, 2, 18)]"
    steps:
      - show: |
          <p>Với mọi $n \ge 1$: &nbsp; $n \le n^2$ &nbsp; và &nbsp; $1 \le n^2$ &nbsp; (vì nhân hai vế của $1 \le n$ với số dương $n$).</p>
          <table class="t"><tr><th>$n$</th><th>$5n$</th><th>$5n^2$</th><th>$2$</th><th>$2n^2$</th></tr>
          <tr><td>1</td><td>5</td><td>5</td><td>2</td><td>2</td></tr>
          <tr><td>2</td><td>10</td><td>20</td><td>2</td><td>8</td></tr>
          <tr><td>3</td><td>15</td><td>45</td><td>2</td><td>18</td></tr></table>
        focus: [0, 1, 2]
        say: "Ôn một mẹo bất đẳng thức sẽ dùng nhiều. Khi n từ 1 trở lên, n không vượt quá n bình phương, vì nhân hai vế của 1 nhỏ hơn hoặc bằng n với số dương n. Nên 5n không vượt quá 5n bình phương, và 2 không vượt quá 2n bình phương, bảng thử với n bằng 1, 2, 3 đều đúng."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym_q
    kind: symbol
    title: "Giải mã ký hiệu: với mọi, tồn tại"
    checks:
      - "all(2*m <= m*m for m in range(2, 500)) and not (2*1 <= 1*1)"
    steps:
      - show: |
          <p>$\forall$ đọc là <b>với mọi</b>; &nbsp; $\exists$ đọc là <b>tồn tại</b> (có ít nhất một).</p>
          <p>Ví dụ: $\ \forall n \ge 2:\ 2n \le n^2$ &nbsp; — đúng với mọi $n$ từ 2 trở đi (riêng $n = 1$ thì sai: $2 > 1$).</p>
        introduces: [forall, exists]
        focus: [1, 2]
        say: "Ký hiệu đầu tiên là chữ A lộn ngược, đọc là với mọi, còn chữ E quay ngược đọc là tồn tại, nghĩa là có ít nhất một. Ví dụ, với mọi n từ 2 trở đi, 2n nhỏ hơn hoặc bằng n bình phương, câu này đúng, dù riêng n bằng 1 thì sai."

  # ───────────────────────── 4. ĐỊNH NGHĨA O ─────────────────────────
  - id: def_O
    kind: symbol
    title: "O lớn: chặn trên"
    checks:
      - "all(3*m*m + 5*m + 2 <= 10*m*m for m in range(1, 5000))"
    steps:
      - show: |
          <div class="box key">$f(n) \in O(g(n))$ &nbsp;⟺ &nbsp; $\exists\, c > 0,\ \exists\, n_0:\quad f(n) \le c \cdot g(n),\ \ \forall n \ge n_0$</div>
          <p>Đọc: có một hằng số dương $c$ và một ngưỡng $n_0$ sao cho, từ $n_0$ trở đi, $f$ <b>không vượt quá</b> $c$ lần $g$.</p>
          <p class="note">Dấu $\in$ đọc là <b>thuộc</b>: $O(g(n))$ là cả một <b>tập hợp các hàm</b> bị $g$ chặn trên, và $f$ là một hàm trong tập đó.</p>
        introduces: [bigO, iff, in]
        focus: [1, 1, 2, 2, 3]
        say: "Định nghĩa thứ nhất là O lớn, nghĩa là chặn trên. Mũi tên hai chiều đọc là khi và chỉ khi. Câu đầy đủ đọc là, tồn tại một hằng số dương c và một ngưỡng, viết là n với số 0 nhỏ ở dưới. Từ ngưỡng đó trở đi, với mọi n, f của n không vượt quá c nhân g của n. Dấu giống chữ e cong đọc là thuộc, vì O lớn của g là cả một tập hợp các hàm bị g chặn trên, và f là một hàm trong tập đó."
      - show: |
          <p>Ví dụ:</p>
          $$3n^2 + 5n + 2 \le 10 \cdot n^2, \quad \forall n \ge 1$$
          <p>→ &nbsp; $c = 10$, $n_0 = 1$ &nbsp; → &nbsp; $3n^2 + 5n + 2 \in O(n^2)$.</p>
          <p class="note">Hai chữ $c$ và $n_0$ là “bằng chứng”: chỉ cần tìm ra <b>một</b> cặp đúng.</p>
        focus: [2, 3, 4]
        say: "Ví dụ, 3n bình phương cộng 5n cộng 2 không vượt quá 10 nhân n bình phương với mọi n từ 1. Nên chọn c bằng 10 và ngưỡng bằng 1, và hàm này thuộc O lớn của n bình phương. Cặp hằng số c và ngưỡng giống như bằng chứng, chỉ cần tìm ra một cặp đúng là đủ."

  - id: def_OmTh
    kind: symbol
    title: "Omega lớn: chặn dưới; Theta lớn: kẹp chặt"
    checks:
      - "all(3*m*m <= 3*m*m + 5*m + 2 for m in range(1, 5000))"
      - "all(3*m*m <= 3*m*m + 5*m + 2 <= 10*m*m for m in range(1, 5000))"
    steps:
      - show: |
          <div class="box key">$f(n) \in \Omega(g(n))$ &nbsp;⟺ &nbsp; $\exists\, c > 0,\ \exists\, n_0:\quad f(n) \ge c \cdot g(n),\ \ \forall n \ge n_0$</div>
        introduces: [bigOmega]
        say: "Định nghĩa thứ hai là Omega lớn, nghĩa là chặn dưới. Chỉ đổi chiều bất đẳng thức, từ ngưỡng trở đi, f của n không nhỏ hơn c nhân g của n."
      - show: |
          <div class="box key">$f(n) \in \Theta(g(n))$ &nbsp;⟺ &nbsp; $\exists\, c_1, c_2 > 0,\ \exists\, n_0:\quad c_1 \cdot g(n) \le f(n) \le c_2 \cdot g(n),\ \ \forall n \ge n_0$</div>
          <p>Theta = vừa chặn trên vừa chặn dưới: $\ f \in \Theta(g)\ \iff\ f \in O(g)\ $ và $\ f \in \Omega(g)$.</p>
        introduces: [bigTheta]
        focus: [1, 1, 2]
        say: "Định nghĩa thứ ba là Theta lớn, nghĩa là kẹp chặt. Từ ngưỡng trở đi, f nằm giữa c một nhân g và c hai nhân g, với hai hằng số dương c một và c hai. Vì vậy, f thuộc Theta lớn của g khi và chỉ khi f vừa thuộc O lớn vừa thuộc Omega lớn của g."
      - show: |
          <p class="note">Nhiều sách viết $\ f(n) = O(g(n))$. Dấu “=” ở đây nghĩa là “thuộc”, không phải bằng nhau: không được đảo thành $O(g(n)) = f(n)$.</p>
        notation_note: true
        say: "Nhiều sách viết f của n bằng O lớn của g của n. Dấu bằng ở đó nghĩa là thuộc, không phải bằng nhau, nên không được đảo hai vế."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
  - id: picture
    kind: intuition
    title: "Hình dung: từ ngưỡng n₀ trở đi, f bị kẹp giữa hai đường"
    steps:
      - show: |
          <svg width="1120" height="370" viewBox="0 0 1120 370">
            <line x1="80" y1="330" x2="880" y2="330" stroke="#6b7280" stroke-width="3"/>
            <line x1="80" y1="330" x2="80" y2="20" stroke="#6b7280" stroke-width="3"/>
            <text x="890" y="340" font-size="30" fill="#6b7280">n</text>
            <line x1="314" y1="330" x2="314" y2="25" stroke="#d97706" stroke-width="3" stroke-dasharray="10 8"/>
            <text x="298" y="362" font-size="28" fill="#d97706">n₀</text>
            <polyline fill="none" stroke="#2563eb" stroke-width="5" points="80,285 109,285 138,284 168,282 197,279 226,276 256,272 285,268 314,262 343,257 372,250 402,242 431,234 460,226 490,216 519,206 548,195 577,183 606,171 636,158 665,144 694,130 724,115 753,99 782,82 811,65 840,47 860,35"/>
            <polyline fill="none" stroke="#1f2937" stroke-width="5" points="80,294 90,291 100,285 109,277 119,267 129,254 138,239 148,224 158,210 168,199 178,193 187,193 197,199 207,210 216,224 226,239 236,252 246,264 256,272 265,279 275,282 285,285 294,286 304,286 314,285 343,282 372,275 402,267 431,257 460,246 490,236 519,227 548,220 577,213 606,207 636,200 665,191 694,180 724,167 753,152 782,135 811,118 840,101 860,91"/>
            <polyline fill="none" stroke="#059669" stroke-width="5" points="80,310 109,310 138,309 168,308 197,307 226,305 256,302 285,300 314,296 343,293 372,289 402,284 431,280 460,274 490,269 519,263 548,256 577,249 606,242 636,234 665,226 694,217 724,208 753,198 782,188 811,178 840,167 860,160"/>
            <text x="875" y="42" font-size="30" fill="#2563eb">c₂ g(n)</text>
            <text x="875" y="98" font-size="30" fill="#1f2937">f(n)</text>
            <text x="875" y="168" font-size="30" fill="#059669">c₁ g(n)</text>
            <text x="92" y="118" font-size="26" fill="#6b7280">trước n₀:</text><text x="92" y="150" font-size="26" fill="#6b7280">không cần thoả</text>
          </svg>
        say: "Hãy hình dung trên hình. Đường xanh dương ở trên là c hai nhân g, đường xanh lá ở dưới là c một nhân g, đường đen là f. Trước ngưỡng, f có thể vượt ra ngoài, định nghĩa không quan tâm. Từ ngưỡng trở đi, f luôn bị kẹp giữa hai đường, và đó chính là f thuộc Theta lớn của g."

  # ───────────────────────── 6. VÍ DỤ CHỨNG MINH ─────────────────────────
  - id: proof
    kind: example
    title: "Chứng minh 3n² + 5n + 2 thuộc Theta lớn của n² bằng hằng số"
    checks:
      - "all(3*m*m + 5*m + 2 <= 3*m*m + 5*m*m + 2*m*m == 10*m*m for m in range(1, 5000))"
      - "all(3*m*m <= 3*m*m + 5*m + 2 for m in range(1, 5000))"
      - "3 + 5 + 2 == 10 and 3*1 <= 10 <= 10*1 and 3*4 <= 3*4 + 10 + 2 == 24 <= 40"
    steps:
      - show: |
          <p><b>Chặn trên.</b> Với $n \ge 1$: $\ 5n \le 5n^2$, $\ 2 \le 2n^2$ (theo mẹo vừa ôn), nên</p>
          $$3n^2 + 5n + 2 \le 3n^2 + 5n^2 + 2n^2 = \hlb{10}\,n^2$$
        focus: [1, 1, 2]
        say: "Bắt đầu với chặn trên. Theo mẹo vừa ôn, khi n từ 1 trở đi, 5n không vượt quá 5n bình phương, và 2 không vượt quá 2n bình phương. Thay vào, ta được 3n bình phương cộng 5n cộng 2 không vượt quá 10n bình phương."
      - show: |
          <p><b>Chặn dưới.</b> Vì $5n + 2 > 0$, nên $\ 3n^2 + 5n + 2 \ge \hlg{3}\,n^2$.</p>
        say: "Chặn dưới còn dễ hơn. Vì 5n cộng 2 luôn dương, nên cả biểu thức không nhỏ hơn 3n bình phương."
      - show: |
          <div class="box ok">Chọn $\ c_1 = 3,\ c_2 = 10,\ n_0 = 1$: &nbsp; $3n^2 \le 3n^2 + 5n + 2 \le 10n^2,\ \forall n \ge 1$ &nbsp; ⟹ &nbsp; $3n^2 + 5n + 2 \in \Theta(n^2)$</div>
          <p>Thử $n = 2$: $\ 12 \le 24 \le 40$ ✓</p>
        introduces: [implies]
        focus: [1, 1, 2]
        say: "Vậy chọn c một bằng 3, c hai bằng 10 và ngưỡng bằng 1, cả hai bất đẳng thức đều đúng với mọi n từ 1. Mũi tên đôi đọc là suy ra, hàm này thuộc Theta lớn của n bình phương. Thử với n bằng 2, ta có 12, 24, 40, đúng thứ tự."

  # ───────────────────────── 7. PHƯƠNG PHÁP GIỚI HẠN ─────────────────────────
  - id: limit
    kind: formula
    title: "Cách nhanh: giới hạn của tỉ số"
    checks:
      - "sp.limit((3*sp.Symbol('n')**2 + 5*sp.Symbol('n') + 2) / sp.Symbol('n')**2, sp.Symbol('n'), sp.oo) == 3"
      - "[round((3*m*m + 5*m + 2) / (m*m), 4) for m in (10, 100, 1000)] == [3.52, 3.0502, 3.005]"
      - "sp.limit(sp.Symbol('n') * sp.log(sp.Symbol('n'), 2) / sp.Symbol('n')**2, sp.Symbol('n'), sp.oo) == 0"
      - "[k / 2**k for k in (4, 10, 20)] == [0.25, 10 / 1024, 20 / 2**20] and 10 / 1024 < 0.01"
      - "sp.limit(sp.Symbol('n')**2 / sp.Symbol('n'), sp.Symbol('n'), sp.oo) == sp.oo"
    steps:
      - show: |
          <p>$\displaystyle \lim_{n \to \infty} \frac{f(n)}{g(n)} = L$: &nbsp; khi $n$ tăng mãi không dừng, tỉ số tiến dần về $L$. &nbsp; $\infty$ đọc là <b>vô cùng</b>.</p>
        introduces: [lim, infty]
        say: "Ký hiệu chữ lim đọc là giới hạn khi n tiến tới vô cùng. Nghĩa là khi n tăng mãi không dừng, tỉ số f chia g tiến dần về một số L. Ký hiệu số 8 nằm ngang đọc là vô cùng."
      - show: |
          <table class="t"><tr><th>giới hạn $L$ của $f/g$</th><th>kết luận</th></tr>
          <tr><td>$L = 0$</td><td>$f \in o(g)$: $f$ tăng <b>chậm hẳn</b> (nên $f \in O(g)$, không thuộc $\Omega(g)$)</td></tr>
          <tr><td>$0 < L < \infty$</td><td>$f \in \Theta(g)$: <b>cùng bậc</b></td></tr>
          <tr><td>$L = \infty$</td><td>$f \in \omega(g)$: $f$ tăng <b>nhanh hẳn</b> (nên $f \in \Omega(g)$, không thuộc $O(g)$)</td></tr></table>
        introduces: [smallo, smallomega]
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Từ giới hạn đó, ta kết luận theo ba trường hợp. Nếu L bằng 0, f thuộc o nhỏ của g, nghĩa là f tăng chậm hẳn so với g. Nếu L là một số dương hữu hạn, hai hàm cùng bậc, f thuộc Theta lớn của g. Nếu L bằng vô cùng, f thuộc omega nhỏ của g, nghĩa là f tăng nhanh hẳn."
      - clear: true
        show: |
          <p>Ví dụ: chia cả tử và mẫu cho $n^2$:</p>
          $$\frac{3n^2 + 5n + 2}{n^2} = 3 + \frac{5}{n} + \frac{2}{n^2} \ \to\ \hlg{3}\quad \text{(vì } \frac{5}{n}, \frac{2}{n^2} \to 0\text{)}$$
          <p>Thử: $n = 10$: 3,52; &nbsp; $n = 100$: 3,0502; &nbsp; $n = 1000$: 3,005. &nbsp; $0 < 3 < \infty$ nên $\Theta(n^2)$ ✓</p>
        focus: [1, 2, 2, 3]
        say: "Làm thử với hàm quen thuộc. Chia từng số hạng cho n bình phương, ta được 3 cộng 5 chia n cộng 2 chia n bình phương. Vì 5 chia n và 2 chia n bình phương đều về 0 khi n rất lớn, nên giới hạn bằng 3. Thử số với n bằng 10, 100, 1000, tỉ số là 3 phẩy 52, rồi 3 phẩy 05, rồi 3 phẩy 005, đúng là tiến về 3, nên hàm thuộc Theta lớn của n bình phương."
      - show: |
          <p>Ví dụ 2: $\ \dfrac{n \log_2 n}{n^2} = \dfrac{\log_2 n}{n} \to 0$ &nbsp; (thử $n = 1024$: $\ 10/1024 < 0{,}01$) &nbsp; ⟹ &nbsp; $n \log_2 n \in o(n^2)$.</p>
        say: "Ví dụ hai, so n nhân lôgarit cơ số 2 của n với n bình phương. Rút gọn n, tỉ số còn lôgarit cơ số 2 của n chia n, và tỉ số này về 0, ví dụ n bằng 1024 cho 10 chia 1024, chưa tới 0 phẩy 01. Nên n nhân lôgarit của n thuộc o nhỏ của n bình phương."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: thay số vào bất đẳng thức đã chứng minh"
    checks:
      - "[(3*m*m, 3*m*m + 5*m + 2, 10*m*m) for m in (1, 3, 10)] == [(3, 10, 10), (27, 44, 90), (300, 352, 1000)]"
    steps:
      - show: |
          <table class="t"><tr><th>$n$</th><th>$3n^2$</th><th>$f(n)$</th><th>$10n^2$</th></tr>
          <tr><td>1</td><td>3</td><td>10</td><td>10</td></tr>
          <tr><td>3</td><td>27</td><td>44</td><td>90</td></tr>
          <tr><td>10</td><td>300</td><td>352</td><td>1000</td></tr></table>
          <p class="note">Mỗi hàng: cột giữa nằm giữa hai cột hai bên ✓. Bảng không thay chứng minh, nhưng bắt được hằng số chọn sai.</p>
        focus: [1, 2]
        say: "Phép thử nhanh là thay vài giá trị n vào ba cột, và mỗi hàng, cột giữa phải nằm giữa hai cột hai bên. Bảng số không thay được chứng minh, nhưng bắt được ngay một hằng số chọn sai."

  # ───────────────────────── 9. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "3*1 + 5*1 + 2 == 10 > 4*1 and [m for m in range(1, 20) if 3*m*m + 5*m + 2 <= 4*m*m][0] == 6"
      - "all(3*m*m + 5*m + 2 <= 4*m*m for m in range(6, 5000))"
      - "[(3*m*m + 5*m + 2, 4*m*m) for m in (1, 5, 6)] == [(10, 4), (102, 100), (140, 144)]"
      - "sp.limit(sp.Symbol('n') / sp.Symbol('n')**2, sp.Symbol('n'), sp.oo) == 0"
      - "[m*(2 + (-1)**m) // m for m in range(1, 7)] == [1, 3, 1, 3, 1, 3] and all(m <= m*(2 + (-1)**m) <= 3*m for m in range(1, 1000))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Viết định nghĩa thiếu “tồn tại $c$, $n_0$” hay thiếu “$\forall n \ge n_0$” <b class="red">(sai)</b>
          <br><span class="note">Chỉ viết $f(n) \le c \cdot g(n)$ là một công thức chưa nói $c$ nào, $n$ nào — chưa phải định nghĩa.</span></div>
        say: "Lỗi thứ nhất, viết định nghĩa thiếu phần tồn tại c và ngưỡng, hoặc thiếu phần với mọi n từ ngưỡng trở đi. Chỉ viết f không vượt quá c nhân g thì chưa nói c nào, n nào, nên chưa phải là định nghĩa."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn $c$ mà quên kiểm $n_0$ <b class="red">(sai)</b>
          <br><span class="note">$c = 4$: $\ 3n^2 + 5n + 2 \le 4n^2$ <b>sai</b> ở $n = 1$ ($10 > 4$), chỉ đúng từ $n = 6$ → phải ghi $n_0 = 6$. Phép thử: thay $n = n_0$.</span></div>
          <table class="t"><tr><th>$n$</th><th>$3n^2 + 5n + 2$</th><th>$4n^2$</th><th>đúng?</th></tr>
          <tr><td>1</td><td>10</td><td>4</td><td class="red">sai</td></tr>
          <tr><td>5</td><td>102</td><td>100</td><td class="red">sai</td></tr>
          <tr><td>6</td><td>140</td><td>144</td><td>đúng</td></tr></table>
        focus: [1, ["2.2", "2.3", "2.4"], 1]
        say: "Lỗi thứ hai, chọn c mà quên kiểm ngưỡng. Với c bằng 4, bất đẳng thức sai ở n bằng 1, vì 10 lớn hơn 4, vẫn sai ở n bằng 5, và chỉ đúng từ n bằng 6, nên phải ghi ngưỡng bằng 6. Phép thử là thay chính giá trị ngưỡng vào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Hiểu O lớn là “đúng bậc” <b class="red">(sai)</b>
          <br><span class="note">$n \in O(n^2)$ là <b>đúng</b> (chặn trên lỏng), nhưng “$n \in \Theta(n^2)$” là <b>sai</b> vì $n / n^2 \to 0$. Muốn nói đúng bậc, dùng Theta.</span></div>
        say: "Lỗi thứ ba, hiểu O lớn là đúng bậc. Thật ra n thuộc O lớn của n bình phương là một câu đúng, chỉ là chặn trên lỏng. Nhưng câu n thuộc Theta lớn của n bình phương lại sai, vì tỉ số về 0. Muốn nói đúng bậc thì dùng Theta."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng giới hạn khi giới hạn <b>không tồn tại</b> <b class="red">(sai)</b>
          <br><span class="note">$f(n) = n\,(2 + (-1)^n)$: $(-1)^n$ đổi dấu theo $n$ chẵn, lẻ, nên $f(n)/n$ nhảy $1, 3, 1, 3, \dots$ — không có giới hạn. Nhưng $n \le f(n) \le 3n$ nên $f \in \Theta(n)$: quay về định nghĩa.</span></div>
        say: "Lỗi thứ tư, dùng giới hạn khi giới hạn không tồn tại. Với hàm này, âm 1 mũ n bằng 1 khi n chẵn và âm 1 khi n lẻ, nên tỉ số f chia n cứ nhảy giữa 1 và 3, không có giới hạn. Nhưng f luôn nằm giữa n và 3n, nên vẫn thuộc Theta lớn của n. Gặp trường hợp này thì quay về định nghĩa."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all(2*m <= 2*m + 7 <= 9*m for m in range(1, 5000)) and 2 + 7 == 9"
      - "sp.limit((2*sp.Symbol('n') + 7) / sp.Symbol('n'), sp.Symbol('n'), sp.oo) == 2"
      - "sp.limit(sp.Symbol('n')**2 / sp.Symbol('n'), sp.Symbol('n'), sp.oo) == sp.oo"
      - "2*1 <= 2*1 + 7 <= 9*1 and 2*1 + 7 == 9"
      - "all(m*m > c*m for c in range(1, 200) for m in [c + 1])"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chứng minh $\ 2n + 7 \in \Theta(n)$: tìm $c_1, c_2, n_0$.</td></tr>
          <tr><td>2</td><td>Kiểm lại câu 1 bằng giới hạn.</td></tr>
          <tr><td>3</td><td>$n^2 \in O(n)$ đúng hay sai? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chứng minh 2n cộng 7 thuộc Theta lớn của n, bằng cách tìm c một, c hai và ngưỡng. Câu hai, kiểm lại câu một bằng giới hạn. Câu ba, n bình phương thuộc O lớn của n đúng hay sai, và vì sao? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Chặn dưới: $7 > 0$. &nbsp; Chặn trên: $n \ge 1$ nên $7 \le 7n$. &nbsp; Gộp lại:</p>
          $$2n \le 2n + 7 \le 2n + 7n = 9n, \quad \forall n \ge 1$$
          <p>→ $c_1 = 2,\ c_2 = 9,\ n_0 = 1$. &nbsp; Thử $n = 1$: $\ 2 \le 9 \le 9$ ✓</p>
        focus: [1, 2, 3, 3]
        say: "Câu một, chặn dưới dễ, vì cộng thêm 7 dương nên 2n cộng 7 không nhỏ hơn 2n. Chặn trên dùng mẹo vừa ôn, khi n từ 1 trở đi, 7 không vượt quá 7n, nên 2n cộng 7 không vượt quá 9n. Vậy chọn c một bằng 2, c hai bằng 9 và ngưỡng bằng 1. Thử ngay tại ngưỡng n bằng 1, ta có 2, 9, 9, đúng thứ tự."
      - show: |
          <p>② Chia từng số hạng cho $n$:</p>
          $$\frac{2n + 7}{n} = 2 + \frac{7}{n} \ \to\ 2, \qquad 0 < 2 < \infty \ \text{ nên } \ \Theta(n) \ ✓$$
        focus: [1, 2, 2]
        say: "Câu hai, kiểm bằng đường khác, chia từng số hạng cho n. Tỉ số bằng 2 cộng 7 chia n, và 7 chia n về 0, nên tỉ số tiến về 2. Vì 2 là số dương hữu hạn, hai hàm cùng bậc, khớp với câu một."
      - show: |
          <p>③ <b class="red">Sai</b>:</p>
          $$\frac{n^2}{n} = n \ \to\ \infty \quad \text{nên } n^2 \in \omega(n)$$
          <p class="note">Với $c$ bất kỳ, chọn $n > c$ thì $n^2 = n \cdot n > c \cdot n$: không có $c$ nào chặn được.</p>
        focus: [1, 2, 3]
        say: "Câu ba sai. Tỉ số n bình phương chia n bằng n, tiến tới vô cùng, nên n bình phương thuộc omega nhỏ của n. Cụ thể hơn, dù chọn c lớn bao nhiêu, cứ lấy n lớn hơn c thì n bình phương vượt c nhân n, nên không hằng số c nào chặn được."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ hằng số, giữ bậc cao</span><span class="a">→</span>
          <span class="n">O: chặn trên, Ω: chặn dưới, Θ: kẹp</span><span class="a">→</span>
          <span class="n">bằng chứng: $c$, $n_0$</span><span class="a">→</span>
          <span class="n">nhanh: giới hạn $f/g$ (nếu tồn tại)</span></div>
        say: "Tổng kết chuỗi logic. Khi n rất lớn ta bỏ hằng số và giữ bậc cao nhất. O lớn là chặn trên, Omega lớn là chặn dưới, Theta lớn là kẹp cả hai phía. Bằng chứng là một cặp hằng số c và ngưỡng. Cách nhanh là lấy giới hạn của tỉ số, khi giới hạn đó tồn tại."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi câu tiệm cận là một lời hứa “<b>tồn tại</b> $c$, $n_0$ sao cho <b>với mọi</b> $n \ge n_0$…”. Viết đủ hai vế của lời hứa, rồi thay số kiểm.</div>
        say: "Điều cần mang theo, mỗi câu tiệm cận là một lời hứa, tồn tại c và ngưỡng sao cho với mọi n từ ngưỡng trở đi. Hãy viết đủ cả hai phần của lời hứa, rồi thay số để kiểm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>xếp hạng tốc độ tăng</b> của các hàm hay gặp, từ lôgarit đến giai thừa, và bẫy khi đổi cơ số của lũy thừa.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta dùng chính phương pháp giới hạn để xếp hạng tốc độ tăng của các hàm hay gặp, từ lôgarit đến giai thừa. Ta cũng sẽ gặp một cái bẫy khi đổi cơ số của lũy thừa. Hẹn gặp bạn ở bài tiếp theo."
