id: L10
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 10 — Đếm đúng số lời gọi đệ quy & chứng minh quy nạp có phần dư"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L10 (bản thảo; mã findMax gốc NOT_VERIFIED — bài dùng hai hàm minh hoạ tự viết); audit/cs112/verify_cs112.py C16, C16b, C16c"
assumes: [cdot, sub, dots, log, floor, bigTheta, in, iff]
# Quy ước: a = số lời gọi đệ quy THỰC SỰ chạy trong một lần gọi (trường hợp tệ nhất), b = số lần kích thước bị chia;
#   chỉ xét n là lũy thừa của 2 khi giải hệ thức (n/2 nguyên); phần dư quy nạp viết R(n).
# Sửa bản thảo (AUDIT_CS112 §2): C16b nêu rõ điều kiện đầu T(1) = 0 (nghiệm n − 1); C16c giả thiết c·k cho phần dư dương → vỡ,
#   làm mạnh giả thiết thành c·k − 1. Không khẳng định quy tắc chấm điểm (NOT_VERIFIED).
# Nối bài trước (luật 17): bài 8 — hệ thức truy hồi và thế ngược, tổng 1 + 2 + … + 2^(i−1) = 2^i − 1;
#   bài 0 — số lần chia đôi n còn 1 là ⌊log₂ n⌋; bài 4 — mỗi lời gọi hàm là một khung trên ngăn xếp lời gọi.
objectives:
  - "Đếm số lời gọi đệ quy thực sự chạy khi các lời gọi nằm trong các nhánh loại trừ nhau"
  - "Lập và giải hệ thức T(n) = 2T(n/2) + 1, T(1) = 0 ra n − 1"
  - "Viết chứng minh quy nạp đủ ba phần, và làm mạnh giả thiết khi phần dư R(n) dương"
asr_reviewed:
  - {sentence: "Máy đã đếm, trường hợp tệ nhất là làm tròn xuống của lôgarit cơ số 2 của n, cộng 2 lời gọi, với n bằng 1000 là 11.", reason: "“lôgarit” → logarith/logatrix: nút thắt B20 đã biết, cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai hàm, mỗi hàm có hai dòng gọi đệ quy"
    checks:
      - "math.floor(math.log2(1000)) + 2 == 11 and 2*1000 - 1 == 1999"
    steps:
      - show: |
          <p>Hàm ① và hàm ② đều có <b>hai dòng</b> gọi lại chính nó. Với $n = 1000$:</p>
          <p>① gọi tối đa <b>11 lần</b>; &nbsp; ② gọi <b>1999 lần</b>.</p>
          <p class="note">Hôm nay: vì sao số dòng không quyết định số lời gọi, và cách chứng minh chặt một chặn trên bằng quy nạp.</p>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hôm nay có hai hàm, mỗi hàm đều có hai dòng gọi lại chính nó. Với n bằng 1000, hàm thứ nhất chỉ gọi tối đa 11 lần. Hàm thứ hai gọi tới 1999 lần. Hôm nay ta tìm hiểu vì sao số dòng không quyết định số lời gọi, và cách chứng minh chặt một chặn trên bằng quy nạp."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: chứng minh quy nạp gồm ba phần"
    checks:
      - "all(sum(range(1, n + 1)) == n*(n + 1)//2 for n in range(1, 200))"
      - "(lambda n: sp.expand(n*(n - 1)/2 + n - n*(n + 1)/2))(sp.Symbol('n')) == 0"
    steps:
      - show: |
          <ol><li><b>Cơ sở</b>: kiểm đúng với giá trị nhỏ nhất.</li>
          <li><b>Giả thiết quy nạp</b>: giả sử đúng với mọi $k < n$.</li>
          <li><b>Bước quy nạp</b>: dùng giả thiết để chứng minh đúng với $n$.</li></ol>
          <p class="note">Ví dụ: $1 + \dots + n = \frac{n(n+1)}{2}$. Cơ sở $n = 1$: $1 = 1$. Bước: $\frac{(n-1)n}{2} + n = \frac{n(n+1)}{2}$ ✓</p>
        focus: [0, "1.1", "1.2", "1.3", 2]
        say: "Ôn cách chứng minh quy nạp, gồm ba phần, giống một hàng quân đô-mi-nô. Phần cơ sở, kiểm câu cần chứng minh đúng với giá trị nhỏ nhất. Phần giả thiết, giả sử nó đúng với mọi k nhỏ hơn n. Phần bước quy nạp, dùng giả thiết để chứng minh nó đúng với n. Ví dụ với tổng từ 1 đến n, theo giả thiết tổng tới n trừ 1 bằng n trừ 1 nhân n chia 2, cộng thêm n là ra đúng công thức."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hệ thức dạng a nhân T của n chia b, cộng f của n, và phần dư"
    steps:
      - show: |
          $$T(n) = a\,T(n/b) + f(n)$$
          <p>$a$: số lời gọi con <b>thực sự chạy</b> trong một lần gọi; &nbsp; $n/b$: kích thước mỗi lời gọi con; &nbsp; $f(n)$: việc làm thêm ngoài các lời gọi.</p>
          <p>$R(n)$ — <b>phần dư</b>: phần còn thừa khi so với điều cần chứng minh. Muốn kết luận “$\le$” thì cần $R(n) \le 0$.</p>
        focus: [1, 2, 2, 3]
        say: "Hai hàm hôm nay đều có hệ thức dạng T của n bằng a nhân T của n chia b, cộng f của n. Chữ a là số lời gọi con thực sự chạy trong một lần gọi, n chia b là kích thước mỗi lời gọi con. Còn f của n là phần việc làm thêm ngoài các lời gọi. Ký hiệu R của n là phần dư, phần còn thừa khi so với điều cần chứng minh, và muốn kết luận nhỏ hơn hoặc bằng thì phần dư phải không dương."

  # ───────────────────────── 3. HÀM ① ─────────────────────────
  - id: binsearch
    kind: concept
    title: "Hàm ①: hai dòng gọi, nhưng mỗi lần chỉ chạy một"
    checks:
      - "(lambda bs: all(max(bs(bs, 0, n - 1, x + 0.5) for x in range(-1, n)) == math.floor(math.log2(n)) + 2 for n in range(1, 300)))(lambda f, l, r, x: 1 if l > r else (1 if (l + r)//2 == x else 1 + (f(f, l, (l + r)//2 - 1, x) if x < (l + r)//2 else f(f, (l + r)//2 + 1, r, x))))"
    steps:
      - show: |
          <div class="code"><div>search(A, l, r, x):          <span class="cm">// A đã sắp xếp tăng</span></div><div>    <span class="kw">if</span> l &gt; r: <span class="kw">return</span> -1</div><div>    m = (l + r) / 2</div><div>    <span class="kw">if</span> A[m] == x: <span class="kw">return</span> m</div><div>    <span class="kw">else if</span> x &lt; A[m]: <span class="kw">return</span> search(A, l, m - 1, x)</div><div>    <span class="kw">else</span>: <span class="kw">return</span> search(A, m + 1, r, x)</div></div>
        focus: [0, "1.4", ["1.5", "1.6"], ["1.5", "1.6"]]
        say: "Hàm thứ nhất là tìm kiếm nhị phân trên mảng đã sắp xếp. Nó so x với phần tử ở giữa, nếu bằng thì trả về ngay. Hai dòng gọi đệ quy nằm trong hai nhánh nếu và ngược lại, loại trừ nhau. Vì vậy mỗi lần gọi, chỉ một trong hai dòng thực sự chạy, với nửa đoạn."
      - show: |
          <div class="box key">Mỗi lần gọi sinh <b>tối đa 1</b> lời gọi con, kích thước còn một nửa → $\ T(n) = T(n/2) + 1$ → $\Theta(\log n)$.</div>
          <p>Thử bằng máy: tệ nhất $\lfloor \log_2 n \rfloor + 2$ lời gọi (kể cả lời gọi đoạn rỗng); $n = 1000$: $9 + 2 = 11$ ✓</p>
        focus: [1, 1, 2]
        say: "Mỗi lần gọi sinh tối đa một lời gọi con với kích thước còn một nửa. Nên số bước theo hệ thức T của n bằng T của n chia 2 cộng 1, tức Theta của lôgarit của n. Máy đã đếm, trường hợp tệ nhất là làm tròn xuống của lôgarit cơ số 2 của n, cộng 2 lời gọi, với n bằng 1000 là 11."

  # ───────────────────────── 4. HÀM ② ─────────────────────────
  - id: findmax
    kind: concept
    title: "Hàm ②: hai dòng gọi, và cả hai đều chạy"
    checks:
      - "(lambda fm: [fm(fm, n) for n in (1, 2, 4, 8, 5, 6)] == [(1, 0), (3, 1), (7, 3), (15, 7), (9, 4), (11, 5)])(lambda f, n: (1, 0) if n == 1 else (lambda a, b: (1 + a[0] + b[0], a[1] + b[1] + 1))(f(f, (n + 1)//2), f(f, n//2)))"
    steps:
      - show: |
          <div class="code"><div>findMax(A, l, r):</div><div>    <span class="kw">if</span> l == r: <span class="kw">return</span> A[l]</div><div>    m = (l + r) / 2</div><div>    a = findMax(A, l, m)</div><div>    b = findMax(A, m + 1, r)</div><div>    <span class="kw">return</span> max(a, b)        <span class="cm">// 1 phép so sánh</span></div></div>
        focus: [0, ["1.4", "1.5"], "1.6"]
        say: "Hàm thứ hai tìm phần tử lớn nhất bằng cách chia đôi. Hai dòng gọi đệ quy nằm nối tiếp nhau, không có nếu nào ngăn, nên cả hai đều chạy. Sau đó một phép so sánh để chọn số lớn hơn."
      - show: |
          <div class="box key">Mỗi lần gọi sinh <b>2</b> lời gọi con, mỗi lời gọi nửa kích thước, cộng 1 phép so sánh:</div>
          $$T(1) = 0, \qquad T(n) = 2\,T(n/2) + 1$$
          <p class="note">$T$ ở đây đếm <b>số phép so sánh</b>. Đếm bằng máy: $n = 8$: 7 phép so sánh, 15 lời gọi.</p>
        focus: [1, 2, 3]
        say: "Mỗi lần gọi sinh hai lời gọi con nửa kích thước, cộng một phép so sánh. Ở đây T đếm số phép so sánh, nên T của 1 bằng 0 và T của n bằng 2 nhân T của n chia 2, cộng 1. Máy đếm được với n bằng 8 có 7 phép so sánh và 15 lời gọi."
      - show: |
          <div class="box warn"><b>Quy tắc:</b> hệ số đứng trước $T(\cdot)$ là số lời gọi <b>thực sự chạy</b> trong một lần gọi — đọc theo nhánh, không đếm dòng.</div>
        say: "Quy tắc rút ra, hệ số đứng trước T là số lời gọi thực sự chạy trong một lần gọi. Hãy đọc theo từng nhánh nếu, ngược lại, chứ đừng đếm số dòng có lời gọi."

  # ───────────────────────── 4b. HÀM ③ BA NHÁNH ─────────────────────────
  - id: threeway
    kind: concept
    title: "Hàm ③: ba nhánh — lúc chạy một lời gọi, lúc chạy hai"
    checks:
      - "(lambda F: F(F, [5, 1, 2, 3], 0, 3, []) == 3 and F(F, [1, 4, 6, 9, 7, 3], 0, 5, []) == 9)((lambda f: f)(lambda F, a, l, r, c: a[l] if l == r else (lambda m: (c.append(1), F(F, a, m + 1, r, c))[1] if a[m] < a[m + 1] else ((c.append(1), c.append(1), F(F, a, l, m, c))[2] if a[m] > a[m + 1] else (c.append(1), c.append(1), max(F(F, a, m + 1, r, c), F(F, a, l, m, c)))[2]))((l + r) // 2)))"
      - "(lambda F: [(lambda c: (F(F, list(range(n)), 0, n - 1, c), len(c))[1])([]) for n in (2, 4, 8, 1024)] == [1, 2, 3, 10])((lambda f: f)(lambda F, a, l, r, c: a[l] if l == r else (lambda m: (c.append(1), F(F, a, m + 1, r, c))[1] if a[m] < a[m + 1] else ((c.append(1), c.append(1), F(F, a, l, m, c))[2] if a[m] > a[m + 1] else (c.append(1), c.append(1), max(F(F, a, m + 1, r, c), F(F, a, l, m, c)))[2]))((l + r) // 2)))"
      - "(lambda F: [(lambda c: (F(F, [7] * n, 0, n - 1, c), len(c))[1])([]) for n in (2, 4, 8, 16)] == [2*n - 2 for n in (2, 4, 8, 16)])((lambda f: f)(lambda F, a, l, r, c: a[l] if l == r else (lambda m: (c.append(1), F(F, a, m + 1, r, c))[1] if a[m] < a[m + 1] else ((c.append(1), c.append(1), F(F, a, l, m, c))[2] if a[m] > a[m + 1] else (c.append(1), c.append(1), max(F(F, a, m + 1, r, c), F(F, a, l, m, c)))[2]))((l + r) // 2)))"
    steps:
      - show: |
          <div class="code"><div>findMax(a, l, r):</div><div>    <span class="kw">if</span> (l == r) <span class="kw">return</span> a[l];</div><div>    m = (l + r) / 2;</div><div>    <span class="kw">if</span> (a[m] &lt; a[m+1]) <span class="kw">return</span> findMax(a, m+1, r);</div><div>    <span class="kw">else if</span> (a[m] &gt; a[m+1]) <span class="kw">return</span> findMax(a, l, m);</div><div>    <span class="kw">else return</span> max(findMax(a, m+1, r), findMax(a, l, m));</div></div>
          <div class="box warn">Chỉ đúng khi dãy <b>đơn đỉnh</b> (tăng rồi giảm, như 1, 4, 6, 9, 7, 3). Với $[5, 1, 2, 3]$ hàm trả về 3, nhưng số lớn nhất là 5.</div>
        focus: [0, ["1.4", "1.5"], "1.6", 2, 2]
        say: "Hàm thứ ba hay gặp trong bài tập, có ba nhánh. Nếu phần tử giữa nhỏ hơn phần tử ngay sau, chỉ tìm nửa phải, nếu lớn hơn, chỉ tìm nửa trái. Chỉ khi hai phần tử bằng nhau thì mới gọi cả hai nửa. Lưu ý, hàm này chỉ đúng khi dãy đơn đỉnh, tức tăng rồi giảm. Với dãy 5, 1, 2, 3, nó trả về 3, trong khi số lớn nhất là 5."
      - clear: true
        show: |
          <table class="t"><tr><th>trường hợp</th><th>lời gọi chạy</th><th>hệ thức (đếm 2 phép so sánh điều kiện)</th><th>kết quả</th></tr>
          <tr><td>tốt nhất: dãy tăng</td><td>1</td><td>$T(n) = T(n/2) + 1$</td><td>$\log_2 n$ &nbsp; ($n = 1024$: 10)</td></tr>
          <tr><td>tệ nhất: mọi phần tử bằng nhau</td><td>2</td><td>$T(n) = 2T(n/2) + 2,\ T(1) = 0$</td><td>$2n - 2$</td></tr></table>
          <p class="note">Nếu đếm thêm phép so sánh trong <code>max</code> thì tệ nhất là $3n - 3$ — cùng bậc $\Theta(n)$, nhưng con số phụ thuộc vào việc <b>đếm phép so sánh nào</b>; phải ghi rõ.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đếm theo nhánh. Trường hợp tốt nhất là dãy tăng, mỗi lần chỉ một lời gọi và một phép so sánh, nên tốn lôgarit cơ số 2 của n, với n bằng 1024 là 10. Trường hợp tệ nhất là mọi phần tử bằng nhau, cả hai lời gọi đều chạy, hệ thức 2 nhân T của n chia 2, cộng 2, cho đúng 2n trừ 2, và máy đếm khớp. Nếu đếm thêm phép so sánh trong hàm lấy số lớn hơn thì ra 3n trừ 3, cùng bậc nhưng khác con số, nên phải ghi rõ đếm phép so sánh nào."

  # ───────────────────────── 5. GIẢI HỆ THỨC ─────────────────────────
  - id: solve
    kind: formula
    title: "Giải T(n) = 2T(n/2) + 1 bằng thế ngược"
    checks:
      - "(lambda T: all(T(T, 2**k) == 2**i * T(T, 2**(k - i)) + 2**i - 1 for k in range(1, 15) for i in range(0, k + 1)))(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 1)"
      - "(lambda T: [T(T, n) for n in (1, 2, 4, 8, 16)] == [n - 1 for n in (1, 2, 4, 8, 16)])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 1)"
    steps:
      - show: |
          $$\begin{aligned} T(n) &= 2\,T(n/2) + 1 = 2\big[2\,T(n/4) + 1\big] + 1 = 4\,T(n/4) + 2 + 1 \\ &= 2^i\,T(n/2^i) + 2^{i-1} + \dots + 1 = 2^i\,T(n/2^i) + 2^i - 1 \end{aligned}$$
        focus: [1, 1, 1]
        say: "Thế ngược như bài 8, tức là thay T của số nhỏ hơn bằng chính hệ thức của nó. Thay T của n chia 2 bằng chính hệ thức, nhân phá ngoặc, ta được 4 nhân T của n chia 4, cộng 2, cộng 1. Sau i bước, theo tổng lũy thừa của 2, ta có 2 mũ i nhân T của n chia 2 mũ i, cộng 2 mũ i trừ 1."
      - show: |
          <p>Xét $n$ là lũy thừa của 2 để mỗi lần chia đôi đều nguyên. Dừng khi $\ n/2^i = 1 \iff i = \log_2 n$, nên $2^i = n$:</p>
          $$T(n) = n \cdot T(1) + n - 1 = \hlg{n - 1} \in \Theta(n)$$
          <p class="note">Thử: $n = 8$: $T = 7$ ✓ (khớp số máy đếm). Lưu ý điều kiện đầu: nếu $T(1) = 1$ thì ra $2n - 1$ — vẫn $\Theta(n)$ nhưng là số khác.</p>
        focus: [1, 2, 3]
        say: "Với n là lũy thừa của 2, ta dừng khi n chia 2 mũ i bằng 1, tức i bằng lôgarit cơ số 2 của n, nên 2 mũ i bằng n. Thay vào, với T của 1 bằng 0, ta được T của n bằng n trừ 1, thuộc Theta của n, thử với n bằng 8 ra 7, khớp số máy đếm. Lưu ý, nếu điều kiện đầu là T của 1 bằng 1 thì đáp số thành 2n trừ 1, vẫn cùng bậc nhưng là con số khác."

  # ───────────────────────── 5b. HÌNH: CÂY LỜI GỌI ─────────────────────────
  - id: tree
    kind: intuition
    title: "Cây lời gọi: hàm ② đi mọi nhánh, hàm ① chỉ đi một nhánh"
    checks:
      - "(lambda fm: fm(fm, 8) == (15, 7))(lambda f, n: (1, 0) if n == 1 else (lambda a, b: (1 + a[0] + b[0], a[1] + b[1] + 1))(f(f, (n + 1)//2), f(f, n//2)))"
      - "1 + 2 + 4 == 7 and 1 + 2 + 4 + 8 == 15 and math.log2(8) == 3"
    steps:
      - show: |
