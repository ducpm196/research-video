" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="355" y="233" font-size="22" text-anchor="middle" fill="#1f2937">2..3</text><rect x="519" y="203" width="92" height="44" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="565" y="233" font-size="22" text-anchor="middle" fill="#1f2937">4..5</text><rect x="729" y="203" width="92" height="44" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="775" y="233" font-size="22" text-anchor="middle" fill="#1f2937">6..7</text><rect x="58" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="92" y="323" font-size="22" text-anchor="middle" fill="#1f2937">0</text><rect x="162" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="198" y="323" font-size="22" text-anchor="middle" fill="#1f2937">1</text><rect x="268" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="302" y="323" font-size="22" text-anchor="middle" fill="#1f2937">2</text><rect x="372" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="408" y="323" font-size="22" text-anchor="middle" fill="#1f2937">3</text><rect x="478" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="512" y="323" font-size="22" text-anchor="middle" fill="#1f2937">4</text><rect x="582" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="618" y="323" font-size="22" text-anchor="middle" fill="#1f2937">5</text><rect x="688" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="722" y="323" font-size="22" text-anchor="middle" fill="#1f2937">6</text><rect x="792" y="293" width="70" height="44" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="828" y="323" font-size="22" text-anchor="middle" fill="#1f2937">7</text><text x="910" y="53" font-size="22" fill="#15803d">tầng 0: 1 phép so sánh</text><text x="910" y="143" font-size="22" fill="#15803d">tầng 1: 2 phép so sánh</text><text x="910" y="233" font-size="22" fill="#15803d">tầng 2: 4 phép so sánh</text><text x="910" y="323" font-size="22" fill="#6b7280">tầng 3: 8 lá: 0 phép so sánh</text><text x="40" y="364" font-size="20" fill="#ea580c">nét cam: hàm ① chỉ đi một nhánh kiểu này</text></svg></div>
        say: "Hình vẽ cây lời gọi của hàm thứ hai với n bằng 8, mỗi ô là một lời gọi và ghi đoạn nó phụ trách. Ô gốc phụ trách cả đoạn từ 0 đến 7, rồi tách thành hai nửa, mỗi nửa lại tách đôi, cho tới 8 ô lá chỉ còn một phần tử. Mỗi ô không phải lá làm đúng một phép so sánh sau khi hai con trả kết quả, nên đếm theo tầng được 1, 2 và 4 phép so sánh. Các ô lá trả ngay phần tử của mình, không so sánh gì. Nét cam là chỗ khác biệt của hàm thứ nhất, tìm kiếm nhị phân mỗi lần chỉ đi xuống một nhánh như vậy, thay vì phủ cả cây."

  # ───────────────────────── 6. QUY NẠP CÓ PHẦN DƯ ─────────────────────────
  - id: induction
    kind: example
    title: "Chứng minh quy nạp T(n) ≤ c·n: khi phần dư bị dương"
    checks:
      - "(lambda c, n: sp.expand(2*(c*n/2) + 1 - c*n))(*sp.symbols('c n')) == 1"
      - "(lambda c, n: sp.expand(2*(c*n/2 - 1) + 1 - (c*n - 1)))(*sp.symbols('c n')) == 0"
      - "0 <= 1*1 - 1 and (lambda T: all(T(T, 2**k) <= 1*2**k - 1 for k in range(0, 20)))(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 1)"
    steps:
      - show: |
          <p><b>Thử 1</b>: chứng minh $T(n) \le c\,n$. &nbsp; Giả thiết: $T(k) \le c\,k$ với mọi $k < n$. Thay vào:</p>
          $$T(n) = 2\,T(n/2) + 1 \le 2 \cdot c\,\frac{n}{2} + 1 = c\,n + \underbrace{1}_{R(n)}$$
          <div class="box warn">Phần dư $R(n) = 1 > 0$: ta chỉ có $T(n) \le cn + 1$, <b>không suy ra được</b> $T(n) \le cn$. Chứng minh vỡ.</div>
        focus: [1, 2, 3, 3]
        say: "Thử chứng minh T của n không vượt quá c nhân n. Giả thiết quy nạp là điều đó đúng với mọi k nhỏ hơn n. Thay vào hệ thức, ta được T của n không vượt quá c nhân n, cộng 1. Phần dư R của n bằng 1, dương, nên ta không suy ra được điều cần chứng minh, và chứng minh bị vỡ."
      - show: |
          <p><b>Thử 2</b> — làm mạnh giả thiết: chứng minh $T(n) \le c\,n - 1$. &nbsp; Giả thiết: $T(k) \le c\,k - 1$:</p>
          $$T(n) \le 2\Big(c\,\frac{n}{2} - 1\Big) + 1 = c\,n - 2 + 1 = c\,n - 1 \quad (R(n) = 0 \le 0\ ✓)$$
          <p>Cơ sở: $T(1) = 0 \le c \cdot 1 - 1 \iff c \ge 1$. Chọn $c = 1$: $\ \hlg{T(n) \le n - 1}$ với mọi $n$ ✓</p>
        focus: [1, 2, 3]
        say: "Mẹo là làm mạnh giả thiết, chứng minh T của n không vượt quá c nhân n trừ 1. Thay giả thiết mới vào, số 1 bị trừ hai lần rồi cộng lại một lần, ta được đúng c nhân n trừ 1, phần dư bằng 0, nên bước quy nạp đi qua. Cơ sở cần T của 1 bằng 0 không vượt quá c trừ 1, tức c từ 1 trở lên, chọn c bằng 1 ta có T của n không vượt quá n trừ 1."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: bảng số, đếm trên cây, loại ứng viên"
    checks:
      - "(lambda T: [T(T, n) for n in (1, 2, 4, 8)] == [0, 1, 3, 7])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 1)"
      - "1 + 2 + 4 == 7 == 8 - 1"
      - "(lambda fm: fm(fm, 1000)[1] == 999 == 1000 - 1)(lambda f, n: (1, 0) if n == 1 else (lambda a, b: (1 + a[0] + b[0], a[1] + b[1] + 1))(f(f, (n + 1)//2), f(f, n//2)))"
    steps:
      - show: |
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>4</th><th>8</th></tr>
          <tr><td>$T(n) = 2T(n/2) + 1$</td><td>0</td><td>1</td><td>3</td><td>7</td></tr>
          <tr><td>$n - 1$</td><td>0</td><td>1</td><td>3</td><td>7</td></tr></table>
          <p class="note">Chặn trên chứng minh được phải <b>không nhỏ hơn</b> bảng ở mọi cột — ở đây bằng đúng.</p>
        focus: [1, 1, 2]
        say: "Phép thử thứ nhất là lập bảng với n nhỏ. Tính dần theo hệ thức được 0, 1, 3, 7, đúng bằng n trừ 1. Một chặn trên đã chứng minh thì không được nhỏ hơn bảng ở bất kỳ cột nào, ở đây hai hàng bằng nhau."
      - show: |
          <table class="t"><tr><th>Bước 2 — đếm trên cây lời gọi, $n = 8$</th><th>số phép so sánh</th></tr>
          <tr><td>tầng 0, 1, 2 (ô không phải lá)</td><td>$1 + 2 + 4 = 7$</td></tr>
          <tr><td>tầng 3 (8 ô lá)</td><td>$0$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, đếm theo một đường khác, trên chính cây lời gọi lúc nãy với n bằng 8. Ba tầng trên có 1, 2 và 4 ô, mỗi ô một phép so sánh, cộng lại là 7. Tầng lá không so sánh gì, nên tổng vẫn là 7, khớp với n trừ 1 của bảng."
      - show: |
          <table class="t"><tr><th>Bước 3 — lập luận loại ứng viên</th><th>$n = 8$</th><th>$n = 1000$</th></tr>
          <tr><td>ứng viên lúc đầu</td><td>8</td><td>1000</td></tr>
          <tr><td>mỗi phép so sánh loại đúng 1 ứng viên, còn lại 1</td><td>$8 - 1 = 7$</td><td>$1000 - 1 = 999$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bước ba là một lập luận hoàn toàn khác, không cần hệ thức. Lúc đầu mọi phần tử đều là ứng viên cho số lớn nhất, có n ứng viên. Mỗi phép so sánh trong hàm lấy số lớn hơn loại đúng một ứng viên thua, và cuối cùng còn lại một, nên cần đúng n trừ 1 phép so sánh, với n bằng 1000 là 999."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda T: T(T, 1024))(lambda f, n: 1 if n <= 1 else 2*f(f, n//2) + 1) == 2047"
      - "(lambda T: [T(T, n) for n in (1, 2, 4, 8)] == [2*n - 1 for n in (1, 2, 4, 8)])(lambda f, n: 1 if n == 1 else 2*f(f, n//2) + 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thấy hai dòng gọi đệ quy là viết hệ số 2 <b class="red">(sai)</b>
          <br><span class="note">Tìm kiếm nhị phân có hai dòng nhưng trong hai nhánh loại trừ → hệ số 1, $\Theta(\log n)$. Viết nhầm $2T(n/2) + 1$ sẽ ra $\Theta(n)$: với $n = 1024$ là 2047 thay vì khoảng 12.</span></div>
        say: "Lỗi thứ nhất, thấy hai dòng gọi đệ quy là viết hệ số 2. Tìm kiếm nhị phân có hai dòng nhưng nằm trong hai nhánh loại trừ nhau, nên hệ số là 1. Viết nhầm thành 2 sẽ ra Theta của n, với n bằng 1024 là 2047 lời gọi thay vì khoảng 12."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Phần dư dương mà vẫn kết luận $T(n) \le cn$ <b class="red">(sai)</b>
          $$c\,n + 1 \le c\,n \quad \text{là bất đẳng thức sai}$$
          <span class="note">Phải có $R(n) \le 0$; nếu không, làm mạnh giả thiết (trừ thêm một hằng số).</span></div>
        say: "Lỗi thứ hai, phần dư dương mà vẫn kết luận T của n không vượt quá c nhân n. Bất đẳng thức c nhân n cộng 1 nhỏ hơn hoặc bằng c nhân n là sai. Phần dư phải nhỏ hơn hoặc bằng 0, nếu không thì làm mạnh giả thiết bằng cách trừ thêm một hằng số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Để hằng số $c$ thay đổi theo từng bước: “$\le cn + 1 \le (c + 1)n$” <b class="red">(sai)</b>
          <br><span class="note">Mỗi tầng lại tăng $c$ thêm 1, sau $\log_2 n$ tầng hằng số đã thành $c + \log_2 n$ — không còn là hằng số. $c$ phải chọn <b>một lần</b> cho mọi $n$.</span></div>
        say: "Lỗi thứ ba, để hằng số c thay đổi theo từng bước, viết c nhân n cộng 1 không vượt quá c cộng 1 nhân n. Mỗi tầng đệ quy lại tăng c thêm 1, sau lôgarit của n tầng, c đã không còn là hằng số. Hằng số c phải được chọn một lần cho mọi n."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Bỏ qua điều kiện đầu khi đưa ra con số cụ thể <b class="red">(sai)</b>
          <br><span class="note">Cùng hệ thức $2T(n/2) + 1$: $T(1) = 0$ cho $n - 1$; $\ T(1) = 1$ cho $2n - 1$. Cùng bậc $\Theta(n)$ nhưng hai con số khác nhau.</span></div>
        say: "Lỗi thứ tư, bỏ qua điều kiện đầu khi đưa ra con số cụ thể. Cùng một hệ thức, T của 1 bằng 0 cho n trừ 1, còn T của 1 bằng 1 cho 2n trừ 1. Hai đáp số cùng bậc nhưng là hai con số khác nhau."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda c, n: sp.expand(2*(c*n/2 - 3) + 3 - (c*n - 3)))(*sp.symbols('c n')) == 0"
      - "0 <= 3 - 3 and (lambda T: [T(T, n) for n in (1, 2, 4, 8)] == [3*n - 3 for n in (1, 2, 4, 8)] == [0, 3, 9, 21])(lambda f, n: 0 if n == 1 else 2*f(f, n//2) + 3)"
    steps:
      - show: |
          $$T(1) = 0, \qquad T(n) = 2\,T(n/2) + 3$$
          <p>Chứng minh bằng quy nạp $T(n) \le c\,n - 3$ và tìm $c$ nhỏ nhất.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, với T của 1 bằng 0 và T của n bằng 2 nhân T của n chia 2, cộng 3. Hãy chứng minh bằng quy nạp rằng T của n không vượt quá c nhân n trừ 3, và tìm c nhỏ nhất. Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p><b>Bước quy nạp</b> — giả thiết $T(k) \le c\,k - 3$ với mọi $k < n$, thay $k = n/2$:</p>
          $$T(n) \le 2\Big(c\,\frac{n}{2} - 3\Big) + 3 = c\,n - 6 + 3 = c\,n - 3 \quad (R(n) = 0\ ✓)$$
        focus: [1, 2, 2]
        say: "Đáp án phần một là bước quy nạp, giả sử T của k không vượt quá c nhân k trừ 3 với mọi k nhỏ hơn n. Thay vào hệ thức với k bằng n chia 2, hai lần số 3 bị trừ thành trừ 6, rồi cộng lại 3. Kết quả đúng bằng c nhân n trừ 3, phần dư bằng 0, nên bước quy nạp đi qua với mọi c."
      - show: |
          <p><b>Cơ sở</b>: $\ T(1) = 0 \le c \cdot 1 - 3 \iff c \ge 3$ → $c$ nhỏ nhất là 3: $\ \hlg{T(n) \le 3n - 3}$.</p>
          <table class="t"><tr><th>$n$</th><th>1</th><th>2</th><th>4</th><th>8</th></tr>
          <tr><td>$T(n)$ theo hệ thức</td><td>0</td><td>3</td><td>9</td><td>21</td></tr>
          <tr><td>$3n - 3$</td><td>0</td><td>3</td><td>9</td><td>21</td></tr></table>
        focus: [1, 2]
        say: "Phần hai là cơ sở, cần T của 1 bằng 0 không vượt quá c trừ 3, nên c nhỏ nhất bằng 3, và ta có T của n không vượt quá 3n trừ 3. Thử bằng bảng, hệ thức cho 0, 3, 9, 21, đúng bằng 3n trừ 3 ở cả bốn cột, với n bằng 4 là 12 trừ 3 bằng 9."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đọc nhánh: bao nhiêu lời gọi thực sự chạy?</span><span class="a">→</span>
          <span class="n">viết hệ thức + điều kiện đầu</span><span class="a">→</span>
          <span class="n">giải (thế ngược)</span><span class="a">→</span>
          <span class="n">chứng minh quy nạp: phần dư $\le 0$</span><span class="a">→</span>
          <span class="n">dư dương: làm mạnh giả thiết</span></div>
        say: "Tổng kết chuỗi logic. Đọc theo nhánh để biết bao nhiêu lời gọi thực sự chạy, viết hệ thức kèm điều kiện đầu, giải bằng thế ngược. Khi chứng minh quy nạp, phần dư phải không dương, còn nếu phần dư dương thì làm mạnh giả thiết."
      - show: |
          <div class="box key"><b>Tư duy:</b> một chứng minh vỡ không có nghĩa là mệnh đề sai — có khi chỉ cần một giả thiết <b>mạnh hơn</b>.</div>
        say: "Điều cần mang theo, một chứng minh bị vỡ không có nghĩa là mệnh đề sai. Có khi ta chỉ cần một giả thiết mạnh hơn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>đổi biến số</b> — giải hệ thức có căn bậc hai như $T(n) = \sqrt{n}\,T(\sqrt{n}) + n$ bằng cách đặt $n = 2^m$.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học kỹ thuật đổi biến số, giải một hệ thức có căn bậc hai bằng cách đặt n bằng 2 mũ m. Hẹn gặp bạn ở bài tiếp theo."
