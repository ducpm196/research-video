        say: "Bây giờ tới phần bạn tự làm. Đồ thị sáu đỉnh với mười cạnh như trên màn hình. Một, xét cạnh từ nhẹ đến nặng cùng cấu trúc hợp và tìm, in các cạnh được lấy và tổng. Hai, mở rộng cây từ A, in thứ tự thêm cạnh và tổng. Ba, vét cạn mọi bộ năm cạnh để đếm số cây khung và tìm tổng nhỏ nhất. Hãy dừng video và làm."
