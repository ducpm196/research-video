        focus: ["1.2", ["1.3", "1.4"]]
        say: "Lệnh được gõ trong một cửa sổ dòng lệnh, mở bằng chuột phải trong thư mục bài làm. Lệnh đầu chạy chương trình, lệnh sau chấm bài, và in chữ ĐÚNG khi mọi dòng khớp."
      - clear: true
        show: |
          <p><b>Kết quả mong đợi</b></p>
          <div class="code"><div>Kruskal: B-C(2) D-E(3) A-B(4) C-D(5) D-F(6), tong 20</div><div>Prim tu A: A-B(4) B-C(2) C-D(5) D-E(3) D-F(6), tong 20</div><div>Vet can: 130 cay khung, nho nhat 20</div><div>Cung tong: CO</div></div>
          <p class="note">Định dạng ở <code>labs/CS112/L25/de.md</code>. Chấm bằng Git Bash: <code>bash labs/cham.sh CS112 L25 cay_khung.py</code> — in <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
        focus: [1, 2, 3]
        say: "Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng với màn hình. Muốn chấm bằng máy, gõ lệnh ở chân màn hình, nó in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác."
      - clear: true
        show: |
          <p>Hai cách viết trong gợi ý sắp tới:</p>
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>union(a, b)</code> trả <code>False</code></td><td>hợp hai nhóm của a và b; trả <code>True</code> (đúng) khi vừa hợp, <code>False</code> (sai) khi a và b đã cùng nhóm</td><td>union(1, 2) trả True; gọi lại lần nữa trả False</td></tr>
          <tr><td><code>(đầu 1 trong cây) != (đầu 2 trong cây)</code></td><td><code>!=</code> là “khác”: đúng khi một đầu của cạnh ở trong cây còn đầu kia ở ngoài</td><td>đầu 1 trong cây (True), đầu 2 ngoài cây (False): True != False là đúng</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Gợi ý sắp tới dùng hai cách viết, nên ta đọc chúng trước. Hàm hợp trả về đúng khi vừa hợp hai nhóm, và trả về sai nếu hai đỉnh đã cùng nhóm. Dấu khác cho kết quả đúng khi một đầu của cạnh ở trong cây còn đầu kia ở ngoài."
      - clear: true
        show: |
          <div class="box key"><b>Nếu kẹt:</b> cạnh chỉ được lấy khi hai đầu thuộc hai nhóm khác nhau; <code>union</code> trả về <code>False</code> nếu đã cùng nhóm. Với mở rộng cây, mỗi vòng chọn cạnh nhẹ nhất mà <code>(đầu 1 trong cây) != (đầu 2 trong cây)</code>. Lời giải ở <code>labs/CS112/L25/loi_giai.py</code>.</div>
        say: "Nếu kẹt, cạnh chỉ được lấy khi hai đầu thuộc hai nhóm khác nhau, và hàm hợp báo về sai nếu hai đầu đã cùng nhóm. Với mở rộng cây, mỗi vòng chọn cạnh nhẹ nhất có đúng một đầu trong cây. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã thử."
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cây khung: $n - 1$ cạnh, không chu trình</span><span class="a">→</span>
          <span class="n">tính chất lát cắt (đổi cạnh)</span><span class="a">→</span>
          <span class="n">nhẹ → nặng + hợp–tìm: $\Theta(m\log_2 m)$</span><span class="a">→</span>
          <span class="n">mở rộng từ một đỉnh + đống: $\Theta(m\log_2 n)$</span></div>
        say: "Tổng kết chuỗi logic. Cây khung có n trừ 1 cạnh và không có chu trình. Tính chất lát cắt, chứng minh bằng đổi cạnh, cho phép chọn tham lam. Xét cạnh từ nhẹ đến nặng cùng cấu trúc hợp và tìm tốn Theta của m lôgarit m, còn mở rộng cây từ một đỉnh với đống nhị phân tốn Theta của m lôgarit n."
      - show: |
          <div class="box key"><b>Tư duy:</b> hai thuật toán trông khác nhau nhưng cùng dựa trên <b>một</b> định lý (tính chất lát cắt). Hiểu định lý thì tự kiểm được mọi biến thể.</div>
        say: "Điều cần mang theo, hai thuật toán trông khác nhau nhưng cùng dựa trên một định lý là tính chất lát cắt. Hiểu định lý thì tự kiểm được mọi biến thể."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 26): <b>P, NP và quy dẫn</b> — khi nào nên thôi tìm thuật toán nhanh, như với bài toán người du lịch.</p>
        forward_ref: true
        say: "Ở bài sau, bài 26, ta học về các lớp bài toán dễ và khó, và phép quy dẫn, để biết khi nào nên thôi tìm thuật toán nhanh, như với bài toán người du lịch. Hẹn gặp bạn ở bài tiếp theo."
