          <div class="col"><ol><li>Xét cạnh từ nhẹ đến nặng: cạnh nào được lấy? Tổng?</li><li>Mở rộng cây từ C: thứ tự thêm cạnh?</li></ol></div></div>
        focus: ["1.1", "1.2", "1.2", 0]
        say: "Đến lượt bạn, với đồ thị bốn đỉnh trên màn hình. Câu một, xét cạnh từ nhẹ đến nặng, cạnh nào được lấy, và tổng bằng bao nhiêu? Câu hai, mở rộng cây bắt đầu từ C, các cạnh được thêm theo thứ tự nào? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Xét cạnh từ nhẹ đến nặng:</p>
          <table class="t"><tr><th>cạnh</th><th>hai đầu đã cùng nhóm?</th><th>quyết định</th></tr>
          <tr><td>AB (1)</td><td>chưa</td><td>lấy, nhóm {A, B}</td></tr>
          <tr><td>CD (2)</td><td>chưa</td><td>lấy, nhóm {C, D}</td></tr>
          <tr><td>AD (3)</td><td>chưa, nối hai nhóm</td><td>lấy, nhóm {A, B, C, D}</td></tr>
          <tr><td>BC (4), AC (5)</td><td>rồi</td><td>bỏ, vì sẽ tạo chu trình</td></tr></table>
          <p>Tổng $1 + 2 + 3 = \hlg{6}$.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.5", 3]
        say: "Đáp án câu một, xét lần lượt từng cạnh từ nhẹ đến nặng. Cạnh A B dài 1 nối hai đỉnh chưa cùng nhóm, nên lấy. Cạnh C D dài 2 cũng vậy, lấy. Cạnh A D dài 3 nối nhóm A B với nhóm C D, nên lấy, và lúc này cả bốn đỉnh đã chung một nhóm. Hai cạnh còn lại, B C và A C, có hai đầu đã cùng nhóm, lấy vào sẽ tạo chu trình, nên bỏ. Tổng là 1 cộng 2 cộng 3, bằng 6."
      - clear: true
        show: |
          <p>② Mở rộng cây từ C: mỗi lượt chọn cạnh nhẹ nhất đi ra khỏi phần cây đã có.</p>
          <table class="t"><tr><th>đã có</th><th>cạnh đi ra</th><th>chọn</th></tr>
          <tr><td>{C}</td><td>CD (2), CB (4), CA (5)</td><td>CD (2)</td></tr>
          <tr><td>{C, D}</td><td>DA (3), CB (4), CA (5)</td><td>DA (3)</td></tr>
          <tr><td>{C, D, A}</td><td>AB (1), CB (4)</td><td>AB (1)</td></tr></table>
          <p>Cùng ba cạnh, cùng tổng $2 + 3 + 1 = \hlg{6}$ ✓ khớp câu một.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Câu hai, mở rộng cây từ C, mỗi lượt chọn cạnh nhẹ nhất đi ra khỏi phần cây đã có. Từ riêng C, ba cạnh đi ra dài 2, 4 và 5, chọn C D dài 2. Từ C và D, cạnh nhẹ nhất đi ra là D A dài 3. Từ C, D và A, cạnh A B dài 1 nhẹ hơn C B dài 4, nên chọn A B. Kết quả là cùng ba cạnh, cùng tổng 2 cộng 3 cộng 1 bằng 6, khớp với câu một."

