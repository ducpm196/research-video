"middle" fill="#1f2937">LB 25</text><rect x="938" y="111" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="1000" y="135" font-size="18" text-anchor="middle" fill="#374151">1,5</text><text x="1000" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 31</text><rect x="388" y="206" width="124" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="450" y="230" font-size="18" text-anchor="middle" fill="#374151">1,4,2</text><text x="450" y="255" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 28</text><rect x="578" y="206" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="640" y="230" font-size="18" text-anchor="middle" fill="#374151">1,4,3</text><text x="640" y="255" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 50</text><rect x="768" y="206" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="830" y="230" font-size="18" text-anchor="middle" fill="#374151">1,4,5</text><text x="830" y="255" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 36</text><rect x="268" y="301" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="330" y="325" font-size="18" text-anchor="middle" fill="#374151">1,4,2,3</text><text x="330" y="350" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 52</text><rect x="498" y="301" width="124" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="560" y="325" font-size="18" text-anchor="middle" fill="#374151">1,4,2,5</text><text x="560" y="350" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 28</text><rect x="498" y="396" width="124" height="58" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="560" y="420" font-size="18" text-anchor="middle" fill="#374151">1,4,2,5,3</text><text x="560" y="445" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 28</text><rect x="760" y="314" width="40" height="28" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="812" y="336" font-size="20" fill="#1f2937">nút được mở (LB nhỏ nhất)</text><rect x="760" y="356" width="40" height="28" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="812" y="378" font-size="20" fill="#1f2937">chu trình 28: UB = 28</text><rect x="760" y="398" width="40" height="28" rx="5" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="812" y="420" font-size="20" fill="#1f2937">LB ≥ 28: tỉa</text></svg></div>
        say: "Đây là toàn bộ cây mà nhánh cận đã sinh ra, mỗi ô ghi đường đi đang xây và cận dưới của nó. Các ô xanh lam là bốn nút lần lượt được lấy ra khỏi hàng đợi ưu tiên, mỗi lần đều là nút có cận dưới nhỏ nhất lúc đó. Ô xanh lục cuối cùng là chu trình 1, 4, 2, 5, 3, chi phí 28, trở thành cận trên. Sáu ô viền đỏ đứt nét có cận dưới từ 28 trở lên, nên bị tỉa mà không cần mở. Cả cây chỉ sinh 11 nút, trong khi cây đầy đủ cho 5 thành phố có 65 nút."

  # ───────────────────────── 4c. QUY MÔ ─────────────────────────
  - id: scale
    kind: example
    title: "Khi số thành phố tăng: 8, 12, 16, 20"
    checks:
      - "(lambda m: [m['tsp_full_nodes'](n) for n in (8, 12, 16, 20)] == [13700, 108505112, 3554627472076, 330665665962404000])(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
      - "(lambda m: [(min(v), max(v)) for v in ([m['tsp_nodes'](n, s)[1] for s in (1, 2, 3)] for n in (8, 12, 16, 20))] == [(38, 90), (121, 394), (1603, 5930), (308, 6016)])(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
      - "(lambda m: m['tsp_nodes'](8)[0] == m['tsp_brute'](m['tsp_matrix'](8)) == 51 and m['tsp_nodes'](9, 2)[0] == m['tsp_brute'](m['tsp_matrix'](9, 2)))(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
      - "round(330665665962404000 / 10**9 / 86400 / 365) == 10 and round(6016 / 308) == 20"
    steps:
      - show: |
          <p>Ma trận chi phí giả lập bằng một công thức cố định <span class="note">(số minh hoạ)</span>; đếm số <b>nút sinh ra</b> với ba ma trận mỗi cỡ:</p>
          <table class="t"><tr><th>số thành phố</th><th>nút của cây đầy đủ</th><th>nút nhánh cận (ít nhất – nhiều nhất)</th></tr>
          <tr><td>8</td><td>13 700</td><td>38 – 90</td></tr>
          <tr><td>12</td><td>$1{,}1 \cdot 10^{8}$</td><td>121 – 394</td></tr>
          <tr><td>16</td><td>$3{,}6 \cdot 10^{12}$</td><td>1 603 – 5 930</td></tr>
          <tr><td>20</td><td>$3{,}3 \cdot 10^{17}$</td><td>308 – 6 016</td></tr></table>
          <p class="note">Quy ước: khi hai nút cùng cận dưới, mở trước nút có đường đi nhỏ nhất theo thứ tự từ điển (như xếp chữ: so thành phố đầu, hoà thì so thành phố thứ hai…). Phá hoà cách khác cho số nút hơi khác, kết luận không đổi.</p>
        focus: [1, 1, "2.2", "2.3", "2.5", 3, 3, 3]
        say: "Giờ ta xem điều gì xảy ra khi số thành phố tăng. Máy sinh ma trận chi phí giả lập bằng một công thức cố định, rồi đếm số nút mà nhánh cận thật sự sinh ra, so với cây đầy đủ. Với 8 thành phố, cây đầy đủ có 13700 nút, nhánh cận chỉ sinh từ 38 đến 90 nút tuỳ ma trận. Với 12 thành phố, cây đầy đủ có hơn 100 triệu nút, nhánh cận chỉ vài trăm. Với 20 thành phố, cây đầy đủ có khoảng 3 phẩy 3 nhân 10 mũ 17 nút, nhánh cận chưa tới 7000. Các số này tính khi hai nút cùng cận dưới thì mở trước nút có đường đi nhỏ nhất theo thứ tự từ điển. Thứ tự từ điển là như xếp chữ, so thành phố đầu rồi tới thành phố thứ hai. Phá hoà cách khác cho số hơi khác, kết luận vẫn vậy."
      - clear: true
        show: |
          <div class="box key">20 thành phố, giả sử mỗi nút tốn một phần tỉ giây <span class="note">(số minh hoạ)</span>: cây đầy đủ cần $3{,}3 \cdot 10^{17} : 10^{9} \approx 3{,}3 \cdot 10^{8}$ giây, khoảng <b>10 năm</b>. Nhánh cận: dưới 7 000 nút.</div>
          <div class="box warn"><b>Giá phải trả:</b> số nút phải mở phụ thuộc <b>dữ liệu</b> (20 thành phố: từ 308 tới 6 016, gấp khoảng 20 lần) và không có bảo đảm cho trường hợp tệ nhất. Khi hết giờ ta vẫn có <b>UB</b> (lời giải tốt nhất đang có) và <b>LB</b> (không thể tốt hơn): hiệu hai số cho biết lời giải còn cách tối ưu tối đa bao nhiêu.</div>
        focus: [1, 1, 2, 2, 2, 2]
        say: "Nếu mỗi nút tốn một phần tỉ giây, một giả định minh hoạ, thì cây đầy đủ của 20 thành phố cần khoảng 10 năm, còn nhánh cận chỉ mở dưới 7000 nút. Nhưng có một cái giá phải trả. Số nút phải mở phụ thuộc vào dữ liệu, ở 20 thành phố là từ 308 đến 6016, gấp khoảng 20 lần, và không có bảo đảm nào cho trường hợp tệ nhất. Vì vậy người làm nghề cho chạy có giới hạn thời gian. Khi hết giờ họ vẫn có cận trên, là lời giải tốt nhất đang có, và cận dưới, là giá trị không thể tốt hơn. Hiệu hai số cho biết lời giải còn cách tối ưu tối đa bao nhiêu."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: so với vét cạn 24 chu trình"
    checks:
      - "(lambda C: min(sum(C[a][b] for a, b in zip((0,) + p, p + (0,))) for p in __import__('itertools').permutations(range(1, 5))) == 28)([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "10 + 6 + 2 + 7 + 3 == 28 and 25 <= 28"
      - "(lambda C: (lambda cs: len(cs) == 24 and cs[:3] == [(28, (4, 2, 5, 3)), (36, (4, 5, 2, 3)), (37, (2, 4, 5, 3))] and cs[-1][0] == 75)(sorted((sum(C[a][b] for a, b in zip((0,) + p, p + (0,))), tuple(x + 1 for x in p)) for p in __import__('itertools').permutations(range(1, 5)))))([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "(lambda C: [C[0][3], C[3][1], C[1][4], C[4][2], C[2][0]] == [10, 6, 2, 7, 3])([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: cận dưới không được lớn hơn chi phí chu trình tìm được:</p>
          $$\text{LB}_{\text{gốc}} = 25 \ \le\ 28 \ ✓$$
        focus: [0, 1, 2]
        say: "Có ba phép thử, mỗi phép đi một đường khác. Một, vì là cận dưới, nó không được lớn hơn chi phí của bất kỳ chu trình nào. Cận gốc 25 không vượt quá 28, đạt yêu cầu."
      - show: |
          <p><b>Phép thử 2</b>: vét cạn cả $4! = 24$ chu trình bằng máy, xếp theo chi phí:</p>
          <table class="t"><tr><th>chu trình</th><th>1,4,2,5,3,1</th><th>1,4,5,2,3,1</th><th>1,2,4,5,3,1</th><th>…</th><th>đắt nhất</th></tr>
          <tr><td>chi phí</td><td>$\hlg{28}$</td><td>36</td><td>37</td><td>…</td><td>75</td></tr></table>
        focus: [1, "2.1", "2.2"]
        say: "Hai, vét cạn, tức thử hết mọi khả năng, cả 24 chu trình bằng máy rồi xếp theo chi phí. Rẻ nhất đúng là chu trình 1, 4, 2, 5, 3, chi phí 28. Hai chu trình kế tiếp đã tốn 36 và 37, còn chu trình đắt nhất tốn tới 75."
      - show: |
          <p><b>Phép thử 3</b>: cộng lại bằng ma trận <b>gốc</b>, không phải ma trận đã rút gọn:</p>
          $$C[1][4] + C[4][2] + C[2][5] + C[5][3] + C[3][1] = 10 + 6 + 2 + 7 + 3 = \hlg{28} \ ✓$$
        focus: [1, 2]
        say: "Ba, cộng lại chi phí từng chặng của chu trình theo ma trận gốc, vì ma trận đã rút gọn chỉ còn phần chênh lệch, không phải chi phí thật. Từ 1 tới 4 tốn 10, 4 tới 2 tốn 6, 2 tới 5 tốn 2, 5 tới 3 tốn 7, 3 về 1 tốn 3, tổng 28, khớp."

  # ───────────────────────── 6. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "(lambda C: [min(C[i][j] for i in range(5)) for j in range(5)] == [3, 4, 7, 2, 2] and 21 + 18 == 39 > 28)([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "(lambda m: (m['tsp5_child_lb'](0, 2), m['tsp5_child_lb'](0, 2, False)) == (53, 42))(__import__('runpy').run_path('audit/cs112/af2b_calc.py'))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy số nhỏ nhất của cột trên ma trận <b>gốc</b> <b class="red">(sai)</b>
          $$3 + 4 + 7 + 2 + 2 = 18, \qquad 21 + 18 = 39 > 28$$
          <span class="note">“Cận dưới” <b>lớn hơn cả đáp số 28</b>, nên sẽ tỉa nhầm chính nhánh tối ưu. Phép thử: cận dưới phải $\le$ chi phí một chu trình bất kỳ đã biết.</span></div>
        say: "Lỗi thứ nhất, lấy số nhỏ nhất của mỗi cột trên ma trận gốc thay vì ma trận mới. Khi đó tổng cột là 18, và cận dưới thành 39, lớn hơn cả đáp số 28, nên thuật toán sẽ tỉa nhầm chính nhánh tối ưu. Phép thử là cận dưới không được lớn hơn chi phí của bất kỳ chu trình nào đã biết."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên cấm đường quay về sớm $j \to 1$ khi rẽ nhánh <b class="red">(sai)</b>
          <br><span class="note">Có thể sinh vòng con 1 → 4 → 1 không ghé đủ thành phố, và cận dưới bị tính yếu đi (ví dụ cận của nút 1 → 3 là 42 thay vì 53).</span></div>
        say: "Lỗi thứ hai, quên cấm đường quay về 1 quá sớm khi rẽ nhánh. Khi đó có thể sinh vòng con như 1, 4 rồi về 1, chưa ghé đủ các thành phố. Cận dưới khi đó yếu đi, ví dụ cận của nút con từ 1 sang 3 là 42 thay vì 53, tức tỉa kém hơn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tỉa nút có LB <b>nhỏ hơn</b> UB <b class="red">(sai)</b>
          <br><span class="note">Chỉ được tỉa khi $\text{LB} \ge \text{UB}$: nhánh đó chắc chắn không tốt hơn. LB nhỏ hơn nghĩa là <b>có thể</b> còn chu trình tốt hơn bên trong.</span></div>
        say: "Lỗi thứ ba, tỉa nút có cận dưới nhỏ hơn cận trên. Chỉ được tỉa khi cận dưới lớn hơn hoặc bằng cận trên, vì khi đó nhánh chắc chắn không tốt hơn. Cận dưới nhỏ hơn nghĩa là bên trong có thể còn chu trình tốt hơn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ nhánh cận biến bài toán thành nhanh trong mọi trường hợp <b class="red">(sai)</b>
          <br><span class="note">Tỉa giúp rất nhiều trên dữ liệu thường, nhưng trường hợp tệ nhất vẫn có thể phải mở số nút tăng theo hàm mũ.</span></div>
        say: "Lỗi thứ tư, nghĩ nhánh cận luôn làm bài toán nhanh. Việc tỉa giúp rất nhiều trên dữ liệu thường gặp, nhưng trường hợp tệ nhất vẫn có thể phải mở số nút tăng theo hàm mũ."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda M: (lambda rm: (lambda R: (rm, [min(R[i][j] for i in range(3)) for j in range(3)]))([[v - m for v in r] for r, m in zip(M, rm)]))([min(r) for r in M]) == ([2, 3, 1], [0, 2, 0]))([[math.inf, 4, 2], [3, math.inf, 5], [1, 6, math.inf]])"
      - "4 + 5 + 1 == 10 and 2 + 6 + 3 == 11 and 2 + 3 + 1 + 2 == 8 <= 10 and 6 + 2 == 8"
      - "(lambda M: [[v - min(r) for v in r] for r in M] == [[math.inf, 2, 0], [0, math.inf, 2], [0, 5, math.inf]])([[math.inf, 4, 2], [3, math.inf, 5], [1, 6, math.inf]])"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>1</th><th>2</th><th>3</th></tr>
          <tr><th>1</th><td>$\infty$</td><td>4</td><td>2</td></tr><tr><th>2</th><td>3</td><td>$\infty$</td><td>5</td></tr><tr><th>3</th><td>1</td><td>6</td><td>$\infty$</td></tr></table>
          <p>Rút gọn hàng, rồi cột; tính cận dưới gốc. Kiểm bằng hai chu trình có thể có.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, với ma trận ba thành phố này, hãy rút gọn hàng rồi rút gọn cột, tính cận dưới ở gốc. Sau đó kiểm bằng hai chu trình có thể có. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b> — trừ mỗi hàng cho số nhỏ nhất $2, 3, 1$ (tổng 6), được ma trận mới:</p>
          <table class="t"><tr><th></th><th>1</th><th>2</th><th>3</th></tr>
          <tr><th>1</th><td>$\infty$</td><td>2</td><td>0</td></tr><tr><th>2</th><td>0</td><td>$\infty$</td><td>2</td></tr><tr><th>3</th><td>0</td><td>5</td><td>$\infty$</td></tr>
          <tr><th>min cột</th><td>0</td><td>2</td><td>0</td></tr></table>
          <p><b>Bước 2</b> — số nhỏ nhất mỗi cột của ma trận mới: $0, 2, 0$ (tổng 2) → $\text{LB} = 6 + 2 = \hlg{8}$.</p>
        focus: [1, 2, 3]
        say: "Đáp án, bước một, số nhỏ nhất của ba hàng là 2, 3 và 1, tổng 6, trừ đi ta được ma trận mới trên bảng. Trên ma trận mới, số nhỏ nhất của ba cột là 0, 2 và 0, chỉ cột hai còn phải trừ 2. Bước hai, cộng lại, cận dưới bằng 6 cộng 2, bằng 8."
      - show: |
          $$1 \to 2 \to 3 \to 1: \ 4 + 5 + 1 = 10, \qquad 1 \to 3 \to 2 \to 1: \ 2 + 6 + 3 = 11$$
          <p>Tối ưu là 10, và $10 \ge 8$ ✓ — cận dưới không vượt chi phí thật.</p>
        focus: [1, 1, 2]
        say: "Bước ba, kiểm bằng cách liệt kê, với ba thành phố chỉ có hai chu trình. Chu trình 1, 2, 3 về 1 tốn 4 cộng 5 cộng 1, bằng 10, còn chu trình 1, 3, 2 về 1 tốn 2 cộng 6 cộng 3, bằng 11. Tối ưu là 10, không nhỏ hơn 8, đúng như một cận dưới phải thoả."

  # ───────────────────────── 7b. TỰ LÀM (lab) ─────────────────────────
  - id: practice
    kind: practice
    title: "Tự làm: cận dưới của bốn thành phố"
    lab: labs/CS112/L15
    checks:
      - "(lambda C: (lambda h: (h, [min(C[i][j] - h[i] for i in range(4)) for j in range(4)]))([min(r) for r in C]))([[math.inf, 3, 11, 13], [14, math.inf, 14, 7], [15, 6, math.inf, 2], [8, 3, 5, math.inf]]) == ([3, 7, 2, 3], [5, 0, 2, 0])"
      - "3 + 7 + 2 + 3 + 5 + 0 + 2 + 0 == 22 and 3 + 14 + 2 + 8 == 27 and 22 <= 27"
      - "(lambda C: min((sum(C[a][b] for a, b in zip((0,) + p, p + (0,))), p) for p in __import__('itertools').permutations(range(1, 4))))([[math.inf, 3, 11, 13], [14, math.inf, 14, 7], [15, 6, math.inf, 2], [8, 3, 5, math.inf]]) == (27, (1, 2, 3))"
    steps:
      - show: |
          <p>Đề dùng ba mẩu mã, đọc trước khi làm:</p>
          <table class="t"><tr><th>đọc trước: cú pháp</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>INF = float("inf")</code></td><td>dấu <code>=</code> là <b>gán</b>: đặt tên INF là số <b>vô cùng</b>, lớn hơn mọi số thường</td><td><code>min(INF, 5)</code> là 5</td></tr>
          <tr><td><code>range(1, 4)</code></td><td>các số từ 1 tới 3 (dừng trước số 4)</td><td>cho 1, 2, 3</td></tr>
          <tr><td><code>itertools.permutations(...)</code></td><td><b>hoán vị</b>: liệt kê mọi cách xếp thứ tự các số đưa vào, mỗi cách một bộ số</td><td><code>permutations([1, 2])</code> cho (1, 2) rồi (2, 1)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đề dùng ba mẩu mã, nên ta đọc chúng trước. Dòng đầu gán cho một tên giá trị vô cùng, lớn hơn mọi số thường, nên khi tìm số nhỏ nhất của hàng, ô vô cùng chỉ được chọn nếu cả hàng toàn vô cùng. Dãy số bắt đầu từ số đầu và dừng trước số cuối, nên từ một tới bốn cho ba số một, hai, ba, đúng ba thành phố còn lại. Lệnh hoán vị liệt kê mọi cách xếp thứ tự các số đưa vào, mỗi cách là một bộ số, ví dụ hai số một và hai cho hai bộ, một hai rồi hai một."
      - clear: true
        show: |
          <p><b>Đề</b>: tạo <code>tsp4.py</code>. Ma trận chi phí 4 thành phố, <code>INF</code> là vô cùng, trong mã đánh số từ 0 <span class="note">(số minh hoạ)</span>:</p>
          <table class="t"><tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><th>0</th><td>INF</td><td>3</td><td>11</td><td>13</td></tr>
          <tr><th>1</th><td>14</td><td>INF</td><td>14</td><td>7</td></tr>
          <tr><th>2</th><td>15</td><td>6</td><td>INF</td><td>2</td></tr>
          <tr><th>3</th><td>8</td><td>3</td><td>5</td><td>INF</td></tr></table>
          <ol><li>Rút gọn hàng, rồi cột <b>trên ma trận mới</b>; in min hàng, min cột, cận dưới gốc.</li>
          <li>Vét cạn bằng <code>itertools.permutations</code>; in chi phí tối ưu và đường đi.</li>
          <li>In <code>LB &lt;= toi uu: CO</code> nếu cận dưới không vượt chi phí tối ưu.</li>
          <li>Tính cận dưới của hai nút con 1→2 và 1→3 của gốc.</li></ol>
        focus: [1, 2, "3.1", "3.2", "3.3", "3.4", 3]
        pause: 300
        say: "Bây giờ tới phần bạn tự làm. Cho ma trận chi phí của bốn thành phố như trên màn hình. Hãy rút gọn hàng rồi rút gọn cột trên ma trận mới, và in số nhỏ nhất của từng hàng, từng cột, cùng cận dưới ở gốc. Sau đó vét cạn mọi thứ tự ghé ba thành phố còn lại, in chi phí tối ưu và đường đi. Rồi in ra cận dưới có vượt chi phí tối ưu hay không. Cuối cùng tính cận dưới của hai nút con của gốc. Hãy dừng video và làm."
      - clear: true
