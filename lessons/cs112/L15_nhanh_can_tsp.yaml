id: L15
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 15 — Nhánh cận: bài toán người du lịch với ma trận rút gọn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L15 (bản thảo); audit/cs112/verify_cs112.py C21, C21b; mọi cận dưới tính bằng audit/cs112/tsp_bb.py; ma trận 5×5 là ví dụ kinh điển (Horowitz, Sahni, Rajasekaran, Fundamentals of Computer Algorithms)"
assumes: [cdot, infty, factorial]
# Quy ước: C[i][j] = chi phí đi từ thành phố i tới j, đường chéo ∞ (không đi tới chính mình); thành phố xuất phát là 1;
#   LB = cận dưới (chi phí ít nhất có thể của mọi chu trình trong nhánh), UB = chi phí chu trình tốt nhất đã tìm được.
#   Rút gọn: trừ mỗi hàng cho số nhỏ nhất của hàng, RỒI trừ mỗi cột của ma trận MỚI cho số nhỏ nhất của cột.
#   Nút con (i → j): đặt hàng i, cột j thành ∞, đặt C[j][1] = ∞, rút gọn lại; LB con = LB cha + R[i][j] + lượng rút gọn mới.
# Sửa bản thảo (AUDIT_CS112 §2, C21): hiện đủ ma trận; cột rút gọn tính trên ma trận MỚI (min cột trên ma trận gốc cho 18, sai).
# Nối bài trước (luật 17): bài 14 — quay lui, cây trạng thái, cắt tỉa bằng điều kiện; bài 6 — hàng đợi ưu tiên lấy phần tử
#   ưu tiên nhất (ở đây: nút có cận dưới nhỏ nhất); bài 2 — n! tăng nhanh hơn mọi hàm mũ.
objectives:
  - "Rút gọn ma trận chi phí theo hàng rồi theo cột trên ma trận mới, và đọc ra cận dưới"
  - "Giải thích vì sao tổng lượng rút gọn là một cận dưới hợp lệ của mọi chu trình"
  - "Tính cận dưới của nút con và tỉa nhánh có cận dưới không nhỏ hơn phương án tốt nhất"
asr_reviewed:
  - {sentence: "Đây là ma trận chi phí của 5 thành phố, ô ở hàng i cột j là chi phí đi từ i tới j.", reason: "“ô” (ô của bảng/mảng) ASR chép “O/Âu”, cùng âm; chữ “ô” có trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đi qua mọi thành phố một lần với chi phí nhỏ nhất"
    checks:
      - "math.factorial(4) == 24 and math.factorial(19) == 121645100408832000"
    steps:
      - show: |
          <p class="big">Người du lịch xuất phát từ thành phố 1, ghé mỗi thành phố <b>đúng một lần</b> rồi về 1. Chọn thứ tự để tổng chi phí <b>nhỏ nhất</b>.</p>
          <p>5 thành phố: $4! = 24$ thứ tự. 20 thành phố: $19! \approx 1{,}2 \cdot 10^{17}$ — thử hết là không thể.</p>
        focus: [1, 2, 2]
        say: "Chào bạn, một người du lịch xuất phát từ thành phố 1, ghé mỗi thành phố đúng một lần rồi quay về. Bài toán là chọn thứ tự để tổng chi phí nhỏ nhất. Với 5 thành phố có 24 thứ tự, nhưng với 20 thành phố đã có khoảng 1 phẩy 2 nhân 10 mũ 17 thứ tự, thử hết là không thể."
      - show: |
          <div class="box key"><b>Nhánh cận</b> = quay lui (bài 14) + <b>ước lượng chi phí tối thiểu</b> của mỗi nhánh. Nhánh nào chắc chắn không tốt hơn phương án đang có → <b>tỉa</b>.</div>
        say: "Nhánh cận là quay lui của bài 14, cộng thêm một ước lượng chi phí tối thiểu cho mỗi nhánh. Nhánh nào chắc chắn không tốt hơn phương án đang có thì tỉa ngay, khỏi đi vào."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: cây trạng thái, hàng đợi ưu tiên, trừ cùng một số"
    checks:
      - "4**4 == 256 and 31 - 10 == 21 and 28 - 10 == 18 and 18 < 21"
      - "min([7, 3, 9, 5]) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>ôn lại</th><th>ví dụ số</th></tr>
          <tr><td>bài 14: quay lui đi trên <b>cây trạng thái</b>, kiểm điều kiện để <b>tỉa</b> nhánh hỏng</td><td>4 quân hậu: 256 bộ → chỉ đặt 16 lần</td></tr>
          <tr><td>bài 6: hàng đợi ưu tiên luôn lấy ra phần tử <b>ưu tiên nhất</b></td><td>các khoá 7, 3, 9, 5, ưu tiên số nhỏ → lấy 3</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Bài này ghép hai công cụ đã học. Ở bài 14, quay lui xây lời giải từng bước, mỗi lựa chọn dở dang là một nút của cây trạng thái, nhánh nào đã vi phạm điều kiện thì tỉa ngay. Ví dụ bài đặt bốn quân hậu lên bàn cờ bốn nhân bốn sao cho không con nào ăn nhau chỉ phải đặt 16 lần thay vì thử 256 bộ. Ở bài 6, hàng đợi ưu tiên luôn lấy ra phần tử ưu tiên nhất, ví dụ với các khoá 7, 3, 9, 5 và ưu tiên số nhỏ thì lấy ra 3 trước."
      - show: |
          <p>Trừ <b>cùng một số</b> khỏi mọi phương án thì phương án rẻ nhất <b>không đổi</b>:</p>
          $$\text{31 và 28} \;\xrightarrow{\ -10\ }\; \text{21 và 18}: \quad 28 < 31 \ \text{và}\ 18 < 21$$
        focus: [1, 1, 2, 0]
        say: "Thêm một điều về phép trừ. Nếu trừ cùng một số khỏi chi phí của mọi phương án, thì phương án rẻ nhất vẫn là phương án đó. Ví dụ hai chi phí 31 và 28 cùng trừ 10 thành 21 và 18, thứ tự giữ nguyên. Ta sẽ dùng chính ý này để rút gọn ma trận chi phí."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ma trận chi phí, cận dưới, cận trên"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><th>1</th><td>$\infty$</td><td>20</td><td>30</td><td>10</td><td>11</td></tr>
          <tr><th>2</th><td>15</td><td>$\infty$</td><td>16</td><td>4</td><td>2</td></tr>
          <tr><th>3</th><td>3</td><td>5</td><td>$\infty$</td><td>2</td><td>4</td></tr>
          <tr><th>4</th><td>19</td><td>6</td><td>18</td><td>$\infty$</td><td>3</td></tr>
          <tr><th>5</th><td>16</td><td>4</td><td>7</td><td>16</td><td>$\infty$</td></tr></table>
          <p>$C[i][j]$: chi phí từ $i$ tới $j$ (không đối xứng: $C[1][2] = 20$ nhưng $C[2][1] = 15$). Đường chéo $\infty$: không đi tới chính mình.</p>
          <p><b>LB</b> (cận dưới): chi phí ít nhất có thể trong một nhánh. &nbsp; <b>UB</b>: chi phí chu trình tốt nhất đã tìm được.</p>
        focus: [1, 2, 2, 3]
        say: "Đây là ma trận chi phí của 5 thành phố, ô ở hàng i cột j là chi phí đi từ i tới j. Ma trận không đối xứng, ví dụ từ 1 tới 2 tốn 20, nhưng từ 2 về 1 chỉ tốn 15, còn đường chéo là vô cùng vì không đi tới chính mình. Ký hiệu L B là cận dưới, chi phí ít nhất có thể của mọi chu trình trong một nhánh. Còn U B là chi phí của chu trình tốt nhất đã tìm được."

  # ───────────────────────── 3. RÚT GỌN ─────────────────────────
  - id: reduce
    kind: formula
    title: "Rút gọn ma trận: hàng trước, cột sau trên ma trận mới"
    checks:
      - "(lambda C: [min(r) for r in C] == [10, 2, 2, 3, 4] and sum(min(r) for r in C) == 21)([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "(lambda C: (lambda R: [min(R[i][j] for i in range(5)) for j in range(5)] == [1, 0, 3, 0, 0])([[v - min(r) for v in r] for r in C]))([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "21 + 4 == 25"
    steps:
      - show: |
          <p><b>Rút gọn hàng</b>: trừ mỗi hàng cho số nhỏ nhất của nó: &nbsp; $10, 2, 2, 3, 4$ → tổng $\hlb{21}$.</p>
          <p><b>Rút gọn cột</b> trên <b>ma trận mới</b>: số nhỏ nhất mỗi cột là $1, 0, 3, 0, 0$ → tổng $\hlb{4}$.</p>
          $$\text{LB}_{\text{gốc}} = 21 + 4 = \hlg{25}$$
        focus: [1, 2, 3]
        say: "Bước rút gọn hàng, trừ mỗi hàng cho số nhỏ nhất của nó, đó là 10, 2, 2, 3 và 4, tổng 21. Sau khi trừ, ma trận đã đổi, nên bước rút gọn cột phải lấy số nhỏ nhất mỗi cột trên ma trận mới, được 1, 0, 3, 0, 0, tổng 4. Vậy cận dưới ở gốc bằng 21 cộng 4, bằng 25."
      - show: |
          <div class="box key">Vì sao là cận dưới? Mỗi chu trình dùng <b>đúng một ô mỗi hàng</b> (rời mỗi thành phố một lần) và <b>đúng một ô mỗi cột</b> (đến mỗi thành phố một lần). Trừ cùng một số khỏi cả hàng thì <b>mọi</b> chu trình rẻ đi đúng số đó, mà chi phí còn lại không âm ⟹ mọi chu trình tốn $\ge 25$.</div>
        say: "Vì sao 25 là cận dưới? Mỗi chu trình rời mỗi thành phố đúng một lần, tức dùng đúng một ô mỗi hàng, và đến mỗi thành phố đúng một lần, tức đúng một ô mỗi cột. Nên khi trừ cùng một số khỏi cả một hàng hay một cột, mọi chu trình đều rẻ đi đúng số đó, mà phần còn lại không âm. Suy ra mọi chu trình đều tốn ít nhất 25."

  # ───────────────────────── 4. RẼ NHÁNH ─────────────────────────
  - id: branch
    kind: example
    title: "Rẽ nhánh: luôn mở nút có cận dưới nhỏ nhất"
    checks:
      - "(lambda m: (lambda t: (m.solve(t), t[:4]))([]) == ((28, [0, 3, 1, 4, 2]), [((1, 2), 35), ((1, 3), 53), ((1, 4), 25), ((1, 5), 31)]))((lambda sp_: (sp_.loader.exec_module(m := __import__('importlib.util').util.module_from_spec(sp_)), m)[1])(__import__('importlib.util').util.spec_from_file_location('tsp_bb', 'audit/cs112/tsp_bb.py')))"
      - "(lambda m: (lambda tr: [lb for t, lb in tr if len(t) == 3] == [28, 50, 36] and [lb for t, lb in tr if len(t) >= 4] == [52, 28, 28])((lambda tr: (m.solve(tr), tr)[1])([])))((lambda sp_: (sp_.loader.exec_module(m := __import__('importlib.util').util.module_from_spec(sp_)), m)[1])(__import__('importlib.util').util.spec_from_file_location('tsp_bb', 'audit/cs112/tsp_bb.py')))"
    steps:
      - show: |
          <p>Nút con “đi $i \to j$”: xoá hàng $i$, cột $j$ (không rời $i$, không đến $j$ lần nữa), cấm $j \to 1$, rút gọn lại:</p>
          <p>$\text{LB}_{\text{con}} = \text{LB}_{\text{cha}} + R[i][j] + \text{lượng rút gọn mới}$ &nbsp; ($R$: ma trận đã rút gọn của nút cha)</p>
          <table class="t"><tr><th>nút</th><th>1→2</th><th>1→3</th><th>1→4</th><th>1→5</th></tr>
          <tr><td>LB</td><td>35</td><td>53</td><td>$\hlg{25}$</td><td>31</td></tr></table>
        focus: [1, 2, 3, 3]
        say: "Nút con đi từ i tới j được tính thế này. Xoá hàng i và cột j, vì không rời i và không đến j thêm lần nào, đồng thời cấm đi từ j về 1 quá sớm. Rút gọn lại, cận dưới của con bằng cận dưới của cha, cộng ô ở hàng i cột j của ma trận đã rút gọn, cộng lượng rút gọn mới. Bốn con của gốc có cận 35, 53, 25 và 31, ta mở nút có cận nhỏ nhất, đi từ 1 tới 4."
      - show: |
          <p>Mở 1→4: con 1→4→2: <b>28</b>, &nbsp; 1→4→3: 50, &nbsp; 1→4→5: 36. → Mở 1→4→2: con →5: <b>28</b>, →3: 52. → 1→4→2→5→3: <b>28</b>.</p>
          <div class="box ok">Chu trình $1 \to 4 \to 2 \to 5 \to 3 \to 1$: $\ 10 + 6 + 2 + 7 + 3 = \hlg{28}$ &nbsp; → UB $= 28$.</div>
          <p>Mọi nút còn lại có LB $\ge 28$ (35, 53, 31, 50, 36, 52) → <b>tỉa hết</b>: 28 là tối ưu.</p>
        focus: [1, 2, 3]
        say: "Mở nút 1 tới 4, các con có cận 28, 50 và 36, nên mở tiếp 4 tới 2. Từ đó, đi tới 5 có cận 28, rồi tới 3, ta được chu trình 1, 4, 2, 5, 3 về 1, chi phí 10 cộng 6 cộng 2 cộng 7 cộng 3, bằng 28. Bây giờ cận trên là 28, và mọi nút còn lại đều có cận dưới từ 28 trở lên, nên tỉa hết, 28 là tối ưu."

  # ───────────────────────── 4b. HÌNH: CÂY NHÁNH CẬN ─────────────────────────
  - id: tree
    kind: intuition
    title: "Nhìn cả cây: chỉ sinh 11 nút trong 65 nút"
    checks:
      - "(lambda m: (lambda tr: len(tr) == 10 and tr == [((1, 2), 35), ((1, 3), 53), ((1, 4), 25), ((1, 5), 31), ((1, 4, 2), 28), ((1, 4, 3), 50), ((1, 4, 5), 36), ((1, 4, 2, 3), 52), ((1, 4, 2, 5), 28), ((1, 4, 2, 5, 3), 28)])((lambda tr: (m.solve(tr), tr)[1])([])))((lambda sp_: (sp_.loader.exec_module(m := __import__('importlib.util').util.module_from_spec(sp_)), m)[1])(__import__('importlib.util').util.spec_from_file_location('tsp_bb', 'audit/cs112/tsp_bb.py')))"
      - "1 + 4 + 4*3 + 4*3*2 + 4*3*2*1 == 65 and 1 + 10 == 11"
    steps:
      - show: |
          <div><svg width="1200" height="480" viewBox="0 0 1200 480"><line x1="600" y1="74" x2="130" y2="111" stroke="#6b7280" stroke-width="3"/><line x1="600" y1="74" x2="350" y2="111" stroke="#6b7280" stroke-width="3"/><line x1="600" y1="74" x2="640" y2="111" stroke="#6b7280" stroke-width="3"/><line x1="600" y1="74" x2="1000" y2="111" stroke="#6b7280" stroke-width="3"/><line x1="640" y1="169" x2="450" y2="206" stroke="#6b7280" stroke-width="3"/><line x1="640" y1="169" x2="640" y2="206" stroke="#6b7280" stroke-width="3"/><line x1="640" y1="169" x2="830" y2="206" stroke="#6b7280" stroke-width="3"/><line x1="450" y1="264" x2="330" y2="301" stroke="#6b7280" stroke-width="3"/><line x1="450" y1="264" x2="560" y2="301" stroke="#6b7280" stroke-width="3"/><line x1="560" y1="359" x2="560" y2="396" stroke="#6b7280" stroke-width="3"/><rect x="538" y="16" width="124" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="600" y="40" font-size="18" text-anchor="middle" fill="#374151">1</text><text x="600" y="65" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 25</text><rect x="68" y="111" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="130" y="135" font-size="18" text-anchor="middle" fill="#374151">1,2</text><text x="130" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 35</text><rect x="288" y="111" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="350" y="135" font-size="18" text-anchor="middle" fill="#374151">1,3</text><text x="350" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 53</text><rect x="578" y="111" width="124" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="640" y="135" font-size="18" text-anchor="middle" fill="#374151">1,4</text><text x="640" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 25</text><rect x="938" y="111" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="1000" y="135" font-size="18" text-anchor="middle" fill="#374151">1,5</text><text x="1000" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 31</text><rect x="388" y="206" width="124" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="450" y="230" font-size="18" text-anchor="middle" fill="#374151">1,4,2</text><text x="450" y="255" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 28</text><rect x="578" y="206" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="640" y="230" font-size="18" text-anchor="middle" fill="#374151">1,4,3</text><text x="640" y="255" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 50</text><rect x="768" y="206" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="830" y="230" font-size="18" text-anchor="middle" fill="#374151">1,4,5</text><text x="830" y="255" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 36</text><rect x="268" y="301" width="124" height="58" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="330" y="325" font-size="18" text-anchor="middle" fill="#374151">1,4,2,3</text><text x="330" y="350" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 52</text><rect x="498" y="301" width="124" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="560" y="325" font-size="18" text-anchor="middle" fill="#374151">1,4,2,5</text><text x="560" y="350" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 28</text><rect x="498" y="396" width="124" height="58" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="560" y="420" font-size="18" text-anchor="middle" fill="#374151">1,4,2,5,3</text><text x="560" y="445" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">LB 28</text><rect x="760" y="314" width="40" height="28" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="812" y="336" font-size="20" fill="#1f2937">nút được mở (LB nhỏ nhất)</text><rect x="760" y="356" width="40" height="28" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="812" y="378" font-size="20" fill="#1f2937">chu trình 28: UB = 28</text><rect x="760" y="398" width="40" height="28" rx="5" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="812" y="420" font-size="20" fill="#1f2937">LB ≥ 28: tỉa</text></svg></div>
        say: "Đây là toàn bộ cây mà nhánh cận đã sinh ra, mỗi ô ghi đường đi đang xây và cận dưới của nó. Các ô xanh lam là bốn nút lần lượt được lấy ra khỏi hàng đợi ưu tiên, mỗi lần đều là nút có cận dưới nhỏ nhất lúc đó. Ô xanh lục cuối cùng là chu trình 1, 4, 2, 5, 3, chi phí 28, trở thành cận trên. Sáu ô viền đỏ đứt nét có cận dưới từ 28 trở lên, nên bị tỉa mà không cần mở. Cả cây chỉ sinh 11 nút, trong khi cây đầy đủ cho 5 thành phố có 65 nút."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: so với vét cạn 24 chu trình"
    checks:
      - "(lambda C: min(sum(C[a][b] for a, b in zip((0,) + p, p + (0,))) for p in __import__('itertools').permutations(range(1, 5))) == 28)([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "10 + 6 + 2 + 7 + 3 == 28 and 25 <= 28"
      - "(lambda C: (lambda cs: len(cs) == 24 and cs[:3] == [(28, (4, 2, 5, 3)), (36, (4, 5, 2, 3)), (37, (2, 4, 5, 3))] and cs[-1][0] == 75)(sorted((sum(C[a][b] for a, b in zip((0,) + p, p + (0,))), tuple(x + 1 for x in p)) for p in __import__('itertools').permutations(range(1, 5)))))([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
      - "(lambda C: [C[0][3], C[3][1], C[1][4], C[4][2], C[2][0]] == [10, 6, 2, 7, 3])([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: cận dưới không được lớn hơn chi phí chu trình tìm được:</p>
          $$\text{LB}_{\text{gốc}} = 25 \ \le\ 28 \ ✓$$
        focus: [0, 1, 2]
        say: "Có ba phép thử, mỗi phép đi một đường khác. Một, vì là cận dưới, nó không được lớn hơn chi phí của bất kỳ chu trình nào. Cận gốc 25 không vượt quá 28, đạt yêu cầu."
      - show: |
          <p><b>Phép thử 2</b>: vét cạn cả $4! = 24$ chu trình bằng máy, xếp theo chi phí:</p>
          <table class="t"><tr><th>chu trình</th><th>1,4,2,5,3,1</th><th>1,4,5,2,3,1</th><th>1,2,4,5,3,1</th><th>…</th><th>đắt nhất</th></tr>
          <tr><td>chi phí</td><td>$\hlg{28}$</td><td>36</td><td>37</td><td>…</td><td>75</td></tr></table>
        focus: [1, "2.1", "2.2"]
        say: "Hai, vét cạn cả 24 chu trình bằng máy rồi xếp theo chi phí. Rẻ nhất đúng là chu trình 1, 4, 2, 5, 3, chi phí 28. Hai chu trình kế tiếp đã tốn 36 và 37, còn chu trình đắt nhất tốn tới 75."
      - show: |
          <p><b>Phép thử 3</b>: cộng lại bằng ma trận <b>gốc</b>, không phải ma trận đã rút gọn:</p>
          $$C[1][4] + C[4][2] + C[2][5] + C[5][3] + C[3][1] = 10 + 6 + 2 + 7 + 3 = \hlg{28} \ ✓$$
        focus: [1, 2]
        say: "Ba, cộng lại chi phí từng chặng của chu trình theo ma trận gốc, vì ma trận đã rút gọn chỉ còn phần chênh lệch, không phải chi phí thật. Từ 1 tới 4 tốn 10, 4 tới 2 tốn 6, 2 tới 5 tốn 2, 5 tới 3 tốn 7, 3 về 1 tốn 3, tổng 28, khớp."

  # ───────────────────────── 6. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "(lambda C: [min(C[i][j] for i in range(5)) for j in range(5)] == [3, 4, 7, 2, 2] and 21 + 18 == 39 > 28)([[math.inf, 20, 30, 10, 11], [15, math.inf, 16, 4, 2], [3, 5, math.inf, 2, 4], [19, 6, 18, math.inf, 3], [16, 4, 7, 16, math.inf]])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy số nhỏ nhất của cột trên ma trận <b>gốc</b> <b class="red">(sai)</b>
          $$3 + 4 + 7 + 2 + 2 = 18, \qquad 21 + 18 = 39 > 28$$
          <span class="note">“Cận dưới” <b>lớn hơn cả đáp số 28</b>, nên sẽ tỉa nhầm chính nhánh tối ưu. Phép thử: cận dưới phải $\le$ chi phí một chu trình bất kỳ đã biết.</span></div>
        say: "Lỗi thứ nhất, lấy số nhỏ nhất của mỗi cột trên ma trận gốc thay vì ma trận mới. Khi đó tổng cột là 18, và cận dưới thành 39, lớn hơn cả đáp số 28, nên thuật toán sẽ tỉa nhầm chính nhánh tối ưu. Phép thử là cận dưới không được lớn hơn chi phí của bất kỳ chu trình nào đã biết."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên cấm đường quay về sớm $j \to 1$ khi rẽ nhánh <b class="red">(sai)</b>
          <br><span class="note">Có thể sinh vòng con 1 → 4 → 1 không ghé đủ thành phố, và cận dưới bị tính thấp sai.</span></div>
        say: "Lỗi thứ hai, quên cấm đường quay về 1 quá sớm khi rẽ nhánh. Khi đó có thể sinh vòng con như 1, 4 rồi về 1, chưa ghé đủ các thành phố, và cận dưới bị tính thấp sai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tỉa nút có LB <b>nhỏ hơn</b> UB <b class="red">(sai)</b>
          <br><span class="note">Chỉ được tỉa khi $\text{LB} \ge \text{UB}$: nhánh đó chắc chắn không tốt hơn. LB nhỏ hơn nghĩa là <b>có thể</b> còn chu trình tốt hơn bên trong.</span></div>
        say: "Lỗi thứ ba, tỉa nút có cận dưới nhỏ hơn cận trên. Chỉ được tỉa khi cận dưới lớn hơn hoặc bằng cận trên, vì khi đó nhánh chắc chắn không tốt hơn. Cận dưới nhỏ hơn nghĩa là bên trong có thể còn chu trình tốt hơn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ nhánh cận biến bài toán thành nhanh trong mọi trường hợp <b class="red">(sai)</b>
          <br><span class="note">Tỉa giúp rất nhiều trên dữ liệu thường, nhưng trường hợp tệ nhất vẫn có thể phải mở số nút tăng theo hàm mũ.</span></div>
        say: "Lỗi thứ tư, nghĩ nhánh cận luôn làm bài toán nhanh. Việc tỉa giúp rất nhiều trên dữ liệu thường gặp, nhưng trường hợp tệ nhất vẫn có thể phải mở số nút tăng theo hàm mũ."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda M: (lambda rm: (lambda R: (rm, [min(R[i][j] for i in range(3)) for j in range(3)]))([[v - m for v in r] for r, m in zip(M, rm)]))([min(r) for r in M]) == ([2, 3, 1], [0, 2, 0]))([[math.inf, 4, 2], [3, math.inf, 5], [1, 6, math.inf]])"
      - "4 + 5 + 1 == 10 and 2 + 6 + 3 == 11 and 2 + 3 + 1 + 2 == 8 <= 10 and 6 + 2 == 8"
      - "(lambda M: [[v - min(r) for v in r] for r in M] == [[math.inf, 2, 0], [0, math.inf, 2], [0, 5, math.inf]])([[math.inf, 4, 2], [3, math.inf, 5], [1, 6, math.inf]])"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>1</th><th>2</th><th>3</th></tr>
          <tr><th>1</th><td>$\infty$</td><td>4</td><td>2</td></tr><tr><th>2</th><td>3</td><td>$\infty$</td><td>5</td></tr><tr><th>3</th><td>1</td><td>6</td><td>$\infty$</td></tr></table>
          <p>Rút gọn hàng, rồi cột; tính cận dưới gốc. Kiểm bằng hai chu trình có thể có.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, với ma trận ba thành phố này, hãy rút gọn hàng rồi rút gọn cột, tính cận dưới ở gốc. Sau đó kiểm bằng hai chu trình có thể có. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p><b>Bước 1</b> — trừ mỗi hàng cho số nhỏ nhất $2, 3, 1$ (tổng 6), được ma trận mới:</p>
          <table class="t"><tr><th></th><th>1</th><th>2</th><th>3</th></tr>
          <tr><th>1</th><td>$\infty$</td><td>2</td><td>0</td></tr><tr><th>2</th><td>0</td><td>$\infty$</td><td>2</td></tr><tr><th>3</th><td>0</td><td>5</td><td>$\infty$</td></tr>
          <tr><th>min cột</th><td>0</td><td>2</td><td>0</td></tr></table>
          <p><b>Bước 2</b> — số nhỏ nhất mỗi cột của ma trận mới: $0, 2, 0$ (tổng 2) → $\text{LB} = 6 + 2 = \hlg{8}$.</p>
        focus: [1, 2, 3]
        say: "Đáp án, bước một, số nhỏ nhất của ba hàng là 2, 3 và 1, tổng 6, trừ đi ta được ma trận mới trên bảng. Trên ma trận mới, số nhỏ nhất của ba cột là 0, 2 và 0, chỉ cột hai còn phải trừ 2. Bước hai, cộng lại, cận dưới bằng 6 cộng 2, bằng 8."
      - show: |
          $$1 \to 2 \to 3 \to 1: \ 4 + 5 + 1 = 10, \qquad 1 \to 3 \to 2 \to 1: \ 2 + 6 + 3 = 11$$
          <p>Tối ưu là 10, và $10 \ge 8$ ✓ — cận dưới không vượt chi phí thật.</p>
        focus: [1, 1, 2]
        say: "Bước ba, kiểm bằng cách liệt kê, với ba thành phố chỉ có hai chu trình. Chu trình 1, 2, 3 về 1 tốn 4 cộng 5 cộng 1, bằng 10, còn chu trình 1, 3, 2 về 1 tốn 2 cộng 6 cộng 3, bằng 11. Tối ưu là 10, không nhỏ hơn 8, đúng như một cận dưới phải thoả."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">rút gọn hàng, rồi cột trên ma trận mới</span><span class="a">→</span>
          <span class="n">tổng lượng rút gọn = cận dưới</span><span class="a">→</span>
          <span class="n">mở nút có cận nhỏ nhất</span><span class="a">→</span>
          <span class="n">có chu trình: cận trên</span><span class="a">→</span>
          <span class="n">tỉa mọi nút có cận dưới $\ge$ cận trên</span></div>
        say: "Tổng kết chuỗi logic. Rút gọn hàng, rồi rút gọn cột trên ma trận mới, tổng lượng rút gọn là cận dưới. Luôn mở nút có cận nhỏ nhất, dùng hàng đợi ưu tiên của bài 6. Khi có một chu trình, chi phí của nó là cận trên, và mọi nút có cận dưới lớn hơn hoặc bằng cận trên đều bị tỉa."
      - show: |
          <div class="box key"><b>Tư duy:</b> cận dưới phải <b>lạc quan nhưng trung thực</b> — không bao giờ vượt chi phí thật, nếu không sẽ tỉa mất đáp án.</div>
        say: "Điều cần mang theo, cận dưới phải lạc quan nhưng trung thực, không bao giờ vượt chi phí thật, nếu không ta sẽ tỉa mất đáp án."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 16): <b>tham lam</b> — không thử mọi nhánh nữa, mỗi bước chọn món lợi nhất ngay, qua bài toán cái túi cho phép lấy một phần đồ vật.</p>
        forward_ref: true
        say: "Ở bài sau, bài 16, ta học chiến lược tham lam, không thử mọi nhánh nữa mà mỗi bước chọn ngay món lợi nhất, qua bài toán cái túi cho phép lấy một phần đồ vật. Hẹn gặp bạn ở bài tiếp theo."
