id: L00
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 0 — Từ mã nguồn tới chạy được: các pha của trình biên dịch và trình thông dịch"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L00; audit/plc/verify_plc.py L00; A. V. Aho, M. S. Lam, R. Sethi, J. D. Ullman, Compilers: Principles, Techniques, and Tools, 2nd ed. (2006), chương 1; R. Nystrom, Crafting Interpreters (2021), chương 2"
assumes: [arith]
# Quy ước: “từ tố” = token; “pha” = một bước biến đổi của trình biên dịch. Mã minh hoạ là một ngôn ngữ nhỏ kiểu C/Python, đặt trong
#   <code>/<div class="code">; lời đọc mô tả bằng tiếng Việt, không đọc ký hiệu. Ví dụ lỗi từ vựng chạy bằng alg.lex trong checks.
objectives:
  - "Kể đúng thứ tự các pha: từ vựng, cú pháp, ngữ nghĩa, tối ưu, sinh mã"
  - "Biết mỗi loại lỗi bị bắt ở pha nào"
  - "Phân biệt biên dịch và thông dịch là cách cài đặt, không phải tính chất ngôn ngữ"
asr_reviewed:
  - {sentence: "Riêng ký tự a còng không khớp mẫu từ tố nào của ngôn ngữ, nên lỗi bị bắt ngay ở pha từ vựng.", reason: "ASR chép “Riên ký tự A còn không khắp mẫu từ tố nào của ngôn ngữ nên lỗi bị bắt ngay ở pha tư vận.” (0.783): lệch âm/thanh thuần Việt: riêng/riên, còng/còn, khớp/khắp, từ vựng/bốn vận — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ nhất, nói một ngôn ngữ là ngôn ngữ thông dịch.", reason: "ASR chép “Lội thứ nhất, nói một ngu ngữ là ngu ngữ thông dịch”: lỗi/lội nhầm thanh (đã biết); “ngôn” → “ngu” ở cả hai lần — cụm “ngôn ngữ” ở các câu khác của bài chép đúng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba lỗi, ba thời điểm khác nhau"
    steps:
      - show: |
          <p>Thiếu một dấu ngoặc: máy báo lỗi <b>ngay</b>, chưa chạy dòng nào. Dùng biến chưa khai báo: có ngôn ngữ báo trước khi chạy, có ngôn ngữ chạy tới dòng đó mới báo. Chia cho 0: chỉ biết khi <b>chạy</b>.</p>
          <div class="box key">Hôm nay: đường đi của mã nguồn qua các <b>pha</b> của trình biên dịch — và vì sao mỗi lỗi bị bắt ở một pha khác nhau.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, thiếu một dấu ngoặc thì máy báo lỗi ngay, chưa chạy dòng nào. Dùng biến chưa khai báo thì có ngôn ngữ báo trước khi chạy, có ngôn ngữ phải chạy tới dòng đó mới báo. Chia cho 0 thì chỉ biết khi chạy. Hôm nay ta theo đường đi của mã nguồn qua các pha của trình biên dịch, và xem vì sao mỗi lỗi bị bắt ở một pha khác nhau."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: với máy, mã nguồn chỉ là một chuỗi ký tự"
    checks:
      - "len('x1 = 42+y') == 9 and len(alg.lex('x1 = 42+y')) == 5"
      - "alg.stack_vm([('load', 'y'), ('push', 42), ('add',)], {'y': 8}) == [50] and 8 + 42 == 50"
    steps:
      - show: |
          <p>Dòng <code>x1 = 42+y</code> với máy chỉ là <b>9 ký tự</b> xếp liền nhau:</p>
          <table class="t"><tr><td>x</td><td>1</td><td>␣</td><td>=</td><td>␣</td><td>4</td><td>2</td><td>+</td><td>y</td></tr></table>
          <p class="note">Máy chưa biết đâu là tên, đâu là số. Ô ␣ là dấu cách.</p>
        focus: [1, 2, 3]
        say: "Trước hết, cần nhớ rằng với máy, dòng x1 bằng 42 cộng y chỉ là 9 ký tự xếp liền nhau, kể cả hai dấu cách. Bảng tách từng ký tự ra một ô, ô có dấu móc nhỏ là dấu cách. Lúc này máy chưa hề biết đâu là một cái tên, đâu là một con số, đâu là phép cộng."
      - show: |
          <p><b>Bộ xử lý</b> (phần cứng thực hiện chương trình) chỉ chạy những <b>lệnh rất đơn giản</b>, mỗi lệnh một việc nhỏ. Tính <code>x1 = 42+y</code> với <code>y = 8</code>:</p>
          <table class="t"><tr><th>lệnh</th><th>giá trị đang giữ</th></tr>
          <tr><td>nạp <code>y</code></td><td>8</td></tr><tr><td>cộng 42</td><td>50</td></tr><tr><td>cất vào <code>x1</code></td><td>$\hl{50}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Điều thứ hai, bộ xử lý, tức phần cứng thực hiện chương trình, chỉ chạy những lệnh rất đơn giản, mỗi lệnh làm một việc nhỏ. Để tính x1 với y bằng 8, lệnh đầu nạp y, giá trị đang giữ là 8. Lệnh thứ hai cộng thêm 42, được 50. Lệnh cuối cất 50 vào x1. Việc của trình biên dịch là đi từ 9 ký tự kia tới ba lệnh này."

  - id: sym
    kind: symbol
    title: "Giải mã: năm pha"
    checks:
      - "[t for _, t in alg.lex('x1 = 42+y')] == ['x1', '=', '42', '+', 'y']"
    steps:
      - show: |
          <table class="t"><tr><th>pha</th><th>vào → ra</th><th>ví dụ với <code>x1 = 42+y</code></th></tr>
          <tr><td>1. từ vựng</td><td>chuỗi ký tự → dãy <b>từ tố</b></td><td><code>x1</code> <code>=</code> <code>42</code> <code>+</code> <code>y</code></td></tr>
          <tr><td>2. cú pháp</td><td>từ tố → <b>cây cú pháp</b></td><td>phép gán, vế phải là phép cộng</td></tr>
          <tr><td>3. ngữ nghĩa</td><td>cây → cây đã kiểm tên, kiểu</td><td><code>y</code> đã khai báo chưa? cộng số với gì?</td></tr>
          <tr><td>4. tối ưu</td><td>cây/mã trung gian → bản nhanh hơn</td><td>tính sẵn phần hằng số</td></tr>
          <tr><td>5. sinh mã</td><td>→ lệnh máy hoặc mã cho máy ảo</td><td>nạp <code>y</code>, cộng 42, cất vào <code>x1</code></td></tr></table>
          <p class="note"><b>Từ tố</b>: mẩu có nghĩa nhỏ nhất (một tên, một số, một dấu phép). <b>Mã trung gian</b>: dãy lệnh đơn giản nằm giữa cây và lệnh máy. <b>Máy ảo</b>: một chương trình đóng vai bộ xử lý, chạy loại lệnh do người làm ngôn ngữ đặt ra.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2]
        say: "Trình biên dịch đi qua năm pha. Pha từ vựng cắt chuỗi ký tự thành dãy từ tố, tức các mẩu có nghĩa nhỏ nhất như một tên, một số hay một dấu phép, ở đây là năm từ tố. Pha cú pháp ghép từ tố thành cây cú pháp, một hình cây cho biết phần nào nằm trong phần nào, ở đây là một phép gán có vế phải là phép cộng. Pha ngữ nghĩa kiểm tên và kiểu, tức loại của giá trị như số nguyên hay chuỗi, chẳng hạn y đã khai báo chưa, và đang cộng số với cái gì. Pha tối ưu biến đổi cây hoặc mã trung gian thành bản chạy nhanh hơn, như tính sẵn phần hằng số. Pha sinh mã tạo ra lệnh máy hoặc mã cho máy ảo, như nạp y, cộng 42, rồi cất vào x1. Ghi chú dưới bảng giải thích mã trung gian là dãy lệnh đơn giản nằm giữa cây và lệnh máy, còn máy ảo là một chương trình đóng vai bộ xử lý."

  # ───────────────────────── 3. BIÊN DỊCH vs THÔNG DỊCH ─────────────────────────
  - id: impl
    kind: concept
    title: "Biên dịch hay thông dịch?"
    steps:
      - show: |
          <p><b>Trình biên dịch</b> chạy đủ các pha một lần, ra tệp lệnh máy; sau đó chạy tệp đó. <b>Trình thông dịch</b> làm vài pha đầu, rồi đi trên cây (hay mã trung gian) và thực hiện luôn.</p>
          <div class="box key">Đây là tính chất của <b>cách cài đặt</b>, không phải của ngôn ngữ. Cùng một ngôn ngữ có thể có cả trình biên dịch lẫn trình thông dịch; nhiều hệ dịch sang mã máy ảo rồi thông dịch, hoặc dịch tiếp ra lệnh máy khi đang chạy.</div>
        focus: [1, 1, 2, 2, 2]
        say: "Trình biên dịch chạy đủ các pha một lần và ra một tệp lệnh máy, sau đó ta chạy tệp đó. Trình thông dịch chỉ làm vài pha đầu, rồi đi trên cây hay mã trung gian và thực hiện luôn. Đây là tính chất của cách cài đặt, không phải của ngôn ngữ. Cùng một ngôn ngữ có thể có cả trình biên dịch lẫn trình thông dịch. Nhiều hệ thống dịch sang mã của một máy ảo rồi thông dịch, hoặc dịch tiếp ra lệnh máy ngay khi đang chạy."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: một dây chuyền năm trạm"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="arP0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="50" y="110" width="240" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="170" y="175" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">từ vựng</text><text x="170" y="80" font-size="22" text-anchor="middle" fill="#2a78d6">vào: 9 ký tự</text><text x="170" y="275" font-size="22" text-anchor="middle" fill="#b91c1c">x = 3 @ 4</text><line x1="292" y1="165" x2="336" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arP0)"/><rect x="340" y="110" width="240" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="460" y="175" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">cú pháp</text><text x="460" y="80" font-size="22" text-anchor="middle" fill="#2a78d6">vào: 5 từ tố</text><text x="460" y="275" font-size="22" text-anchor="middle" fill="#b91c1c">x = = 3</text><line x1="582" y1="165" x2="626" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arP0)"/><rect x="630" y="110" width="240" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="750" y="175" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">ngữ nghĩa</text><text x="750" y="80" font-size="22" text-anchor="middle" fill="#2a78d6">vào: cây</text><text x="750" y="275" font-size="22" text-anchor="middle" fill="#b91c1c">z chưa khai báo</text><line x1="872" y1="165" x2="916" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arP0)"/><rect x="920" y="110" width="240" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1040" y="175" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">tối ưu, sinh mã</text><text x="1040" y="80" font-size="22" text-anchor="middle" fill="#2a78d6">vào: cây đã kiểm</text><text x="1040" y="275" font-size="22" text-anchor="middle" fill="#6b7280">(không bắt lỗi)</text><line x1="1162" y1="165" x2="1206" y2="165" stroke="#1f2937" stroke-width="3" marker-end="url(#arP0)"/><rect x="1210" y="110" width="240" height="110" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="1330" y="175" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">khi chạy</text><text x="1330" y="80" font-size="22" text-anchor="middle" fill="#2a78d6">vào: lệnh máy</text><text x="1330" y="275" font-size="22" text-anchor="middle" fill="#b91c1c">b bằng 0</text><text x="750" y="320" font-size="22" text-anchor="middle" fill="#1f2937">hàng đỏ: lỗi bị bắt ở đúng hộp đó, sớm nhất có thể</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ các pha như một dây chuyền, mỗi hộp là một trạm, dòng chữ xanh phía trên cho biết trạm đó nhận vào thứ gì. Trạm từ vựng nhận 9 ký tự, trạm cú pháp nhận 5 từ tố, trạm ngữ nghĩa nhận cái cây, và cuối cùng là lệnh máy được chạy. Dòng chữ đỏ phía dưới là loại lỗi mà mỗi trạm bắt được, và mỗi lỗi bị chặn ở trạm sớm nhất có đủ thông tin để thấy nó. Hộp vàng ở cuối là lúc chạy, nơi duy nhất biết được giá trị thật của biến."

  - id: example
    kind: example
    title: "Lỗi này bị bắt ở pha nào?"
    checks:
      - "('LOI', '@') in alg.lex('x = 3 @ 4')"
      - "[k for k, _ in alg.lex('x = = 3')] == ['TEN', 'PHEP', 'PHEP', 'SO']"
    steps:
      - show: |
          <p><b>Bước một —</b> <code>x = 3 @ 4</code>, chạy pha từ vựng:</p>
          <table class="t"><tr><th>chữ</th><td><code>x</code></td><td><code>=</code></td><td><code>3</code></td><td><code>@</code></td><td><code>4</code></td></tr>
          <tr><th>loại</th><td>tên</td><td>phép</td><td>số</td><td>$\hl{\text{lỗi}}$</td><td>số</td></tr></table>
        focus: [1, 2, "2.2"]
        say: "Bước một, xét dòng x bằng 3 a còng 4, và cho chạy pha từ vựng. Pha này cắt được x là tên, dấu bằng là phép, 3 là số. Riêng ký tự a còng không khớp mẫu từ tố nào của ngôn ngữ, nên lỗi bị bắt ngay ở pha từ vựng."
      - show: |
          <p><b>Bước 2 —</b> <code>x = = 3</code>: pha từ vựng cho <b>tên, phép, phép, số</b>, đều hợp lệ.</p>
          <p>Pha cú pháp cần: tên, dấu bằng, rồi <b>một biểu thức</b>. Sau dấu bằng lại gặp dấu bằng → $\hl{\text{lỗi cú pháp}}$.</p>
        focus: [1, 2, 2]
        say: "Bước hai, dòng x bằng bằng 3. Pha từ vựng cho tên, phép, phép, số, từ tố nào cũng hợp lệ. Nhưng luật của câu gán cần một tên, một dấu bằng, rồi một biểu thức, trong khi sau dấu bằng lại gặp một dấu bằng nữa, nên lỗi bị bắt ở pha cú pháp."
      - clear: true
        show: |
          <p><b>Bước 3 —</b> <code>y = z + 1</code>: đúng luật câu gán. Pha ngữ nghĩa tra bảng tên đã khai báo, chỉ có <code>x</code> và <code>y</code>: không có <code>z</code> → $\hl{\text{lỗi ngữ nghĩa}}$.</p>
          <p class="note">Ngôn ngữ không kiểm tên trước thì lỗi này chỉ hiện ra khi chạy tới dòng đó.</p>
        focus: [1, 1, 2]
        say: "Bước ba, dòng y bằng z cộng 1 đúng luật câu gán, nên qua được pha cú pháp. Pha ngữ nghĩa tra bảng các tên đã khai báo, chỉ có x và y, không có z, nên báo lỗi ngữ nghĩa. Với ngôn ngữ không kiểm tên trước khi chạy, lỗi này chỉ hiện ra khi chương trình chạy tới đúng dòng đó."
      - show: |
          <p><b>Bước 4 —</b> <code>x = a / b</code> với <code>a</code>, <code>b</code> đã khai báo: qua cả ba pha. Giá trị của <code>b</code> chỉ có lúc chạy; nếu <code>b</code> bằng 0 → $\hl{\text{lỗi khi chạy}}$.</p>
          <div class="box key">Mỗi lỗi bị bắt ở pha <b>sớm nhất</b> có đủ thông tin để thấy nó.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, dòng x bằng a chia b, với a và b đã khai báo, qua được cả ba pha. Giá trị của b chỉ có khi chạy, nên nếu b bằng 0 thì lỗi chỉ hiện ra lúc chạy. Quy luật chung là mỗi lỗi bị bắt ở pha sớm nhất có đủ thông tin để thấy nó."

  - id: check
    kind: check
    title: "Tự kiểm: hỏi một trình cài đặt thật"
    checks:
      - "(lambda d: exec('def c(s):\\n    try:\\n        k = compile(s, \"m\", \"exec\")\\n    except SyntaxError:\\n        return \"dich\"\\n    try:\\n        exec(k, {})\\n    except Exception as e:\\n        return type(e).__name__\\n    return \"ok\"\\n', d) or [d['c'](s) for s in ('x = = 3', 'y = z + 1', 'a, b = 1, 0\\nx = a / b')] == ['dich', 'NameError', 'ZeroDivisionError'])({})"
    steps:
      - show: |
          <table class="t"><tr><th>dòng</th><th>bước dịch (chưa chạy)</th><th>khi chạy</th></tr>
          <tr><td><code>x = = 3</code></td><td><b class="red">lỗi cú pháp</b></td><td>không tới được</td></tr>
          <tr><td><code>y = z + 1</code></td><td>qua</td><td><b class="red">tên z chưa có</b></td></tr>
          <tr><td><code>a, b = 1, 0</code> rồi <code>x = a / b</code></td><td>qua</td><td><b class="red">chia cho 0</b></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không lần tay nữa mà đưa ba dòng cho trình cài đặt thật của một ngôn ngữ phổ biến, loại không kiểm tên trước khi chạy. Dòng có hai dấu bằng bị từ chối ngay ở bước dịch, chưa chạy lệnh nào, vì đây là lỗi cú pháp. Dòng dùng z qua bước dịch, và chỉ báo tên z chưa có khi chạy, khớp ghi chú ở bước ba. Dòng chia cho b bằng 0 cũng qua bước dịch, rồi báo chia cho 0 khi chạy, khớp bước bốn."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Lỗi người mới và người đã đi làm hay mắc"
    checks:
      - "(lambda d: exec('def xu_ly(n):\\n    if n >= 0:\\n        return n * 2\\n    return so_lieu_sai\\ndef thu(n):\\n    try:\\n        return xu_ly(n)\\n    except NameError:\\n        return \"NameError\"\\n', d) or [d['thu'](5), d['thu'](0), d['thu'](-1)] == [10, 0, 'NameError'])({})"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Ngôn ngữ này là ngôn ngữ thông dịch” <b class="red">(sai khái niệm)</b>
          <br><span class="note">Biên dịch hay thông dịch là cách cài đặt. Hỏi đúng: <b>trình cài đặt này</b> làm gì, lúc nào.</span></div>
        say: "Lỗi thứ nhất, nói một ngôn ngữ là ngôn ngữ thông dịch. Biên dịch hay thông dịch là cách cài đặt, câu hỏi đúng là trình cài đặt đang dùng làm gì và làm lúc nào."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ biên dịch được là chương trình đúng <b class="red">(sai)</b>
          <br><span class="note">Trình biên dịch chỉ bắt lỗi từ vựng, cú pháp và một phần ngữ nghĩa. Chia cho 0, sai logic vẫn còn nguyên.</span></div>
        say: "Lỗi thứ hai, nghĩ biên dịch được là chương trình đúng. Trình biên dịch chỉ bắt lỗi từ vựng, cú pháp và một phần ngữ nghĩa, còn chia cho 0 hay sai logic vẫn còn nguyên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đọc thông báo lỗi ở sai chỗ <b class="red">(lãng phí)</b>
          <br><span class="note">Lỗi cú pháp thường được báo ở từ tố <b>sau</b> chỗ sai thật (thiếu ngoặc đóng ở một câu, máy báo ở câu kế tiếp). Nhìn lên trên một chút.</span></div>
        say: "Lỗi thứ ba, tìm lỗi ở đúng dòng máy báo. Lỗi cú pháp thường được báo ở từ tố nằm sau chỗ sai thật, thiếu ngoặc đóng ở một câu thì máy có thể báo ở câu kế tiếp, nên hãy nhìn lên trên một chút."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Dịch qua và các phép thử đều đạt, nên tin là không còn lỗi tên.</div>
          <div class="code"><div>def xu_ly(n):</div><div>    if n &gt;= 0: return n * 2</div><div>    return so_lieu_sai      <span class="cm"># gõ nhầm tên, nhánh hiếm</span></div></div>
          <table class="t"><tr><th>đầu vào</th><th>nhánh chạy</th><th>kết quả</th></tr>
          <tr><td>5</td><td>bình thường</td><td>10</td></tr><tr><td>0</td><td>bình thường</td><td>0</td></tr>
          <tr><td>−1</td><td>nhánh hiếm</td><td><b class="red">lỗi tên chưa có, lúc chạy</b></td></tr></table>
        focus: [1, 2, 2, 3, "3.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, thấy chương trình dịch qua và các phép thử đều đạt, rồi tin rằng không còn lỗi tên. Hàm xử lý có một nhánh hiếm cho số âm, và ở nhánh đó tên biến bị gõ nhầm. Với ngôn ngữ không kiểm tên trước khi chạy, bước dịch không báo gì cả. Hai phép thử với 5 và 0 chỉ đi nhánh bình thường, cho 10 và 0, đều đạt. Phải tới khi gặp số âm thật, có khi là lúc đã chạy cho khách hàng, lỗi tên chưa có mới hiện ra. Người có kinh nghiệm bổ sung một công cụ kiểm tên trước khi chạy, và viết phép thử đi qua từng nhánh, kể cả nhánh hiếm."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len(alg.lex('total = price * 3')) == 5"
      - "[k for k, _ in alg.lex('total = price * 3')] == ['TEN', 'PHEP', 'TEN', 'PHEP', 'SO']"
      - "(lambda s: (s.count('('), s.count(')')) == (1, 0))('if (x > 1 { y = 2 }')"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td><code>total = price * 3</code> có mấy từ tố?</td></tr>
          <tr><td>2</td><td><code>if (x &gt; 1 { y = 2 }</code> — lỗi ở pha nào?</td></tr>
          <tr><td>3</td><td>Gọi hàm với sai số đối số trong một ngôn ngữ kiểm kiểu trước khi chạy — lỗi ở pha nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, dòng tính tổng tiền bằng giá nhân 3 trên màn hình có mấy từ tố? Câu hai, câu lệnh điều kiện thiếu dấu ngoặc đóng thì lỗi ở pha nào? Câu ba, gọi hàm với sai số đối số trong một ngôn ngữ kiểm kiểu trước khi chạy thì lỗi ở pha nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Cắt <code>total = price * 3</code> từ trái sang phải:</p>
          <table class="t"><tr><th>chữ</th><td><code>total</code></td><td><code>=</code></td><td><code>price</code></td><td><code>*</code></td><td><code>3</code></td></tr>
          <tr><th>loại</th><td>tên</td><td>phép</td><td>tên</td><td>phép</td><td>số</td></tr></table>
          <p>Dấu cách bị bỏ → $\hl{5}$ từ tố.</p>
        focus: [1, 2, "2.2", 3]
        say: "Đáp án câu một, ta cắt dòng từ trái sang phải. Được tên tổng tiền, dấu bằng, tên giá, dấu nhân, và số 3. Mỗi cái là một từ tố, xếp đúng hàng loại bên dưới. Dấu cách bị bỏ đi, nên có tất cả 5 từ tố."
      - show: |
          <table class="t"><tr><th>câu</th><th>xét lần lượt</th><th>pha</th></tr>
          <tr><td>2</td><td>từ tố đều hợp lệ; có 1 ngoặc mở, 0 ngoặc đóng → không ghép được câu đúng luật</td><td>$\hl{\text{cú pháp}}$</td></tr>
          <tr><td>3</td><td>câu gọi hàm đúng luật; đếm đối số so với khai báo của hàm là việc kiểm kiểu</td><td>$\hl{\text{ngữ nghĩa}}$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Câu hai, mọi từ tố đều hợp lệ, nhưng có một ngoặc mở mà không có ngoặc đóng, nên không ghép được thành câu đúng luật, lỗi ở pha cú pháp. Câu ba, câu gọi hàm vẫn đúng luật, còn việc đếm đối số rồi so với khai báo của hàm là phần kiểm kiểu, nên lỗi ở pha ngữ nghĩa."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">từ vựng → từ tố</span><span class="a">→</span>
          <span class="n">cú pháp → cây</span><span class="a">→</span>
          <span class="n">ngữ nghĩa → tên, kiểu</span><span class="a">→</span>
          <span class="n">tối ưu → sinh mã</span></div>
        say: "Tổng kết lại, pha từ vựng cho dãy từ tố, pha cú pháp cho cây, pha ngữ nghĩa kiểm tên và kiểu, rồi tới tối ưu và sinh mã."
      - show: |
          <div class="box key"><b>Tư duy:</b> chia một việc lớn thành các pha, mỗi pha một nhiệm vụ rõ ràng, một dạng vào và một dạng ra. Lỗi bị bắt ở pha sớm nhất có đủ thông tin.</div>
        say: "Điều cần mang theo, hãy chia một việc lớn thành các pha, mỗi pha có một nhiệm vụ rõ ràng, một dạng vào và một dạng ra. Lỗi sẽ bị bắt ở pha sớm nhất có đủ thông tin."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): pha đầu tiên — <b>phân tích từ vựng</b> bằng biểu thức chính quy.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học kỹ pha đầu tiên, phân tích từ vựng bằng biểu thức chính quy. Hẹn gặp bạn ở bài tiếp theo."
