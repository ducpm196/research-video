id: L10
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 10 — Sinh mã cho máy ngăn xếp"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L10; audit/plc/verify_plc.py L10; R. Nystrom, Crafting Interpreters (2021), chương 14–15; T. Lindholm và cộng sự, The Java Virtual Machine Specification, SE 17 (2021), chương 2.11; CS112 bài 4 (ngăn xếp)"
assumes: [arith]
# Quy ước: lệnh máy ảo viết thường trong <code>: push n (đẩy số), load x (đẩy giá trị biến), add/sub/mul/div (lấy hai số trên đỉnh,
#   đẩy kết quả). Phép hai ngôi lấy b (đỉnh) trước, a sau, tính a ∘ b. Lời đọc nói “đẩy”, “nạp”, “cộng”… không đọc tên lệnh.
#   Mã và vết ngăn xếp do alg.stack_gen / alg.stack_vm trong checks.
objectives:
  - "Sinh mã máy ngăn xếp từ cây bằng duyệt sau"
  - "Chạy tay máy ngăn xếp"
  - "Giữ đúng thứ tự toán hạng cho trừ và chia"
asr_reviewed:
  - {sentence: "Đẩy 4 vào, ngăn xếp có 4.", reason: "ASR chép “Đẩy bún vào, ngăn xếp có bún.” (0.714): lệch âm/thanh thuần Việt: bốn/bún, bốn/bún — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, sinh mã cho cây 1 cộng 2 nhân 3 bằng duyệt sau.", reason: "ASR chép “Bước 1, xin mã cho cây 1 cộng 2 nhân 3 bằng vùi sâu.” (0.786): lệch âm/thanh thuần Việt: sinh/xin, duyệt sau/vùi sâu — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ cây tới lệnh"
    steps:
      - show: |
          <p>Pha cú pháp cho ta cây <code>(+ 1 (* 2 3))</code>. Bộ xử lý không hiểu cây — nó chỉ chạy từng lệnh một. Nhiều hệ (máy ảo Java, nhiều trình thông dịch) chạy một loại lệnh rất gọn: lệnh cho <b>máy ngăn xếp</b>.</p>
          <div class="box key">Hôm nay: biến cây thành dãy lệnh máy ngăn xếp, và chạy tay máy đó.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, pha cú pháp cho ta một cây, như 1 cộng 2 nhân 3. Bộ xử lý thì không hiểu cây, nó chỉ chạy từng lệnh một. Nhiều hệ thống, như các máy ảo và nhiều trình thông dịch, chạy một loại lệnh rất gọn, đó là lệnh cho máy ngăn xếp. Hôm nay ta biến cây thành dãy lệnh máy ngăn xếp, và chạy tay máy đó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ngăn xếp và duyệt sau của cây"
    checks:
      - "(lambda s: list((s.append(4), s.append(9), s.pop(), s)[2:]))([]) == [9, [4]]"
      - "alg.parse_expr('(1+2)*4') == ('*', ('+', 1, 2), 4) and alg.ast_eval(alg.parse_expr('(1+2)*4')) == 12"
      - "[i[1] if i[0] == 'push' else i[0] for i in alg.stack_gen(alg.parse_expr('(1+2)*4'))] == [1, 2, 'add', 4, 'mul']"
    steps:
      - show: |
          <table class="t"><tr><th>thao tác</th><th>ngăn xếp (đỉnh ở phải)</th></tr>
          <tr><td>đẩy 4</td><td>[4]</td></tr>
          <tr><td>đẩy 9</td><td>[4, 9]</td></tr>
          <tr><td>lấy ra → được $\hl{9}$</td><td>[4]</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn lại ngăn xếp, một chồng đồ chỉ thêm và lấy ở trên cùng. Đẩy 4 vào, ngăn xếp có 4. Đẩy tiếp 9, ngăn xếp có 4 và 9, với 9 ở đỉnh. Lấy ra một lần thì được 9, cái vào sau cùng ra trước, còn lại 4."
      - show: |
          <p>Cây của <code>(1+2)*4</code> là <code>(* (+ 1 2) 4)</code>. <b>Duyệt sau</b>: thăm con trái, con phải, rồi mới tới nút cha.</p>
          <p>Thứ tự thăm: 1, 2, +, 4, × — tính theo đúng thứ tự đó: $1 + 2 = 3$, rồi $3 \times 4 = \hl{12}$.</p>
        focus: [1, 1, 2, 2]
        say: "Điều thứ hai là duyệt sau của cây, như khi ta đánh giá cây biểu thức ở bài 3. Biểu thức 1 cộng 2 trong ngoặc, nhân 4, có cây với phép nhân ở gốc, con trái là phép cộng 1 với 2, con phải là 4. Duyệt sau thăm con trái, con phải, rồi mới tới nút cha, nên thứ tự là 1, 2, cộng, 4, nhân. Tính theo đúng thứ tự đó, 1 cộng 2 bằng 3, rồi 3 nhân 4 bằng 12."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn loại lệnh"
    steps:
      - show: |
          <table class="t"><tr><th>lệnh</th><th>làm gì</th></tr>
          <tr><td><code>push n</code></td><td>đẩy số <code>n</code> lên đỉnh ngăn xếp</td></tr>
          <tr><td><code>load x</code></td><td>đẩy giá trị của biến <code>x</code> lên đỉnh</td></tr>
          <tr><td><code>add</code> <code>sub</code> <code>mul</code> <code>div</code></td><td>lấy <code>b</code> (đỉnh) ra, rồi lấy <code>a</code> ra, đẩy <code>a + b</code>, <code>a − b</code>, <code>a × b</code>, <code>a ÷ b</code></td></tr></table>
          <p class="note">Lệnh tính không cần ghi “lấy ở đâu, cất vào đâu”: luôn là đỉnh ngăn xếp (ở khoá Phân tích và thiết kế thuật toán). Vì thế lệnh rất ngắn.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Máy có bốn loại lệnh. Lệnh đẩy đặt một số lên đỉnh ngăn xếp. Lệnh nạp đặt giá trị của một biến lên đỉnh. Các lệnh cộng, trừ, nhân, chia lấy b ở đỉnh ra trước, rồi lấy a ra, và đẩy kết quả của a với b. Lệnh tính không cần ghi lấy ở đâu, cất vào đâu, vì luôn là đỉnh ngăn xếp như khoá Phân tích và thiết kế thuật toán. Nhờ vậy lệnh rất ngắn."

  # ───────────────────────── 3. SINH MÃ ─────────────────────────
  - id: gen
    kind: concept
    title: "Sinh mã = duyệt sau"
    checks:
      - "alg.stack_gen(alg.parse_expr('1+2*3')) == [('push', 1), ('push', 2), ('push', 3), ('mul',), ('add',)]"
    steps:
      - show: |
          <div class="code"><div>def gen(n):</div><div>    if n là số:  phát push n</div><div>    else: gen(con trái); gen(con phải); phát lệnh của phép</div></div>
          <p>Giống hệt đánh giá cây ở bài 3, chỉ khác: thay vì <b>tính</b>, ta <b>phát lệnh</b>. Cây <code>(+ 1 (* 2 3))</code> → <code>push 1, push 2, push 3, mul, add</code>.</p>
        focus: [1, 1, 2, 2]
        say: "Hàm sinh mã rất ngắn. Nếu nút là một số thì phát lệnh đẩy số đó, còn không thì sinh mã con trái, sinh mã con phải, rồi phát lệnh của phép. Nó giống hệt việc đánh giá cây ở bài 3, chỉ khác là thay vì tính, ta phát lệnh. Với cây 1 cộng 2 nhân 3, ta được đẩy 1, đẩy 2, đẩy 3, nhân, rồi cộng."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: số thứ tự trên cây chính là thứ tự lệnh"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arP10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><line x1="210" y1="60" x2="90" y2="190" stroke="#6b7280" stroke-width="3"/><line x1="210" y1="60" x2="330" y2="190" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="190" x2="250" y2="320" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="190" x2="410" y2="320" stroke="#6b7280" stroke-width="3"/><circle cx="210" cy="60" r="32" fill="#2a78d6" stroke="#1f2937" stroke-width="3"/><text x="210" y="70" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">+</text><circle cx="246" cy="30" r="16" fill="#eb6834"/><text x="246" y="37" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><circle cx="90" cy="190" r="32" fill="#fffbeb" stroke="#1f2937" stroke-width="3"/><text x="90" y="200" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><circle cx="126" cy="160" r="16" fill="#eb6834"/><text x="126" y="167" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="330" cy="190" r="32" fill="#2a78d6" stroke="#1f2937" stroke-width="3"/><text x="330" y="200" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">*</text><circle cx="366" cy="160" r="16" fill="#eb6834"/><text x="366" y="167" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="250" cy="320" r="32" fill="#fffbeb" stroke="#1f2937" stroke-width="3"/><text x="250" y="330" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><circle cx="286" cy="290" r="16" fill="#eb6834"/><text x="286" y="297" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="410" cy="320" r="32" fill="#fffbeb" stroke="#1f2937" stroke-width="3"/><text x="410" y="330" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><circle cx="446" cy="290" r="16" fill="#eb6834"/><text x="446" y="297" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="250" y="400" font-size="22" text-anchor="middle" fill="#eb6834">số cam = thứ tự duyệt sau</text><line x1="500" y1="200" x2="590" y2="200" stroke="#1f2937" stroke-width="3" marker-end="url(#arP10)"/><rect x="620" y="278" width="130" height="46" rx="8" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="685" y="311" font-size="26" text-anchor="middle" fill="#1f2937">1</text><line x1="614" y1="330" x2="756" y2="330" stroke="#1f2937" stroke-width="3"/><text x="685" y="366" font-size="24" font-weight="bold" text-anchor="middle" fill="#2a78d6">đẩy 1</text><text x="685" y="396" font-size="20" text-anchor="middle" fill="#1f2937">lệnh 1</text><rect x="790" y="278" width="130" height="46" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="855" y="311" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="790" y="226" width="130" height="46" rx="8" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="855" y="259" font-size="26" text-anchor="middle" fill="#1f2937">2</text><line x1="784" y1="330" x2="926" y2="330" stroke="#1f2937" stroke-width="3"/><text x="855" y="366" font-size="24" font-weight="bold" text-anchor="middle" fill="#2a78d6">đẩy 2</text><text x="855" y="396" font-size="20" text-anchor="middle" fill="#1f2937">lệnh 2</text><rect x="960" y="278" width="130" height="46" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="1025" y="311" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="960" y="226" width="130" height="46" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="1025" y="259" font-size="26" text-anchor="middle" fill="#1f2937">2</text><rect x="960" y="174" width="130" height="46" rx="8" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="1025" y="207" font-size="26" text-anchor="middle" fill="#1f2937">3</text><line x1="954" y1="330" x2="1096" y2="330" stroke="#1f2937" stroke-width="3"/><text x="1025" y="366" font-size="24" font-weight="bold" text-anchor="middle" fill="#2a78d6">đẩy 3</text><text x="1025" y="396" font-size="20" text-anchor="middle" fill="#1f2937">lệnh 3</text><rect x="1130" y="278" width="130" height="46" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="1195" y="311" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="1130" y="226" width="130" height="46" rx="8" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="1195" y="259" font-size="26" text-anchor="middle" fill="#1f2937">6</text><line x1="1124" y1="330" x2="1266" y2="330" stroke="#1f2937" stroke-width="3"/><text x="1195" y="366" font-size="24" font-weight="bold" text-anchor="middle" fill="#2a78d6">nhân</text><text x="1195" y="396" font-size="20" text-anchor="middle" fill="#1f2937">lệnh 4</text><rect x="1300" y="278" width="130" height="46" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1365" y="311" font-size="26" text-anchor="middle" fill="#1f2937">7</text><line x1="1294" y1="330" x2="1436" y2="330" stroke="#1f2937" stroke-width="3"/><text x="1365" y="366" font-size="24" font-weight="bold" text-anchor="middle" fill="#2a78d6">cộng</text><text x="1365" y="396" font-size="20" text-anchor="middle" fill="#1f2937">lệnh 5</text><text x="1045" y="40" font-size="22" text-anchor="middle" fill="#1f2937">ngăn xếp sau mỗi lệnh (ô vàng = đỉnh)</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình bên trái là cây của 1 cộng 2 nhân 3, mỗi nút có một số cam là thứ tự duyệt sau. Số cam cũng chính là thứ tự lệnh được phát ra, nút 1, 2, 3 thành ba lệnh đẩy, nút nhân thành lệnh thứ tư, nút cộng thành lệnh thứ năm. Bên phải là ngăn xếp sau mỗi lệnh, ô vàng là đỉnh, ngăn xếp cao dần lên 3 tầng khi đẩy, rồi thấp dần khi tính. Sau lệnh cuối chỉ còn đúng một ô màu xanh lục, là kết quả 7."

  - id: example
    kind: example
    title: "Chạy tay máy ngăn xếp"
    checks:
      - "alg.stack_vm(alg.stack_gen(alg.parse_expr('1+2*3')), trace=True) == ([7], [[1], [1, 2], [1, 2, 3], [1, 6], [7]])"
      - "alg.stack_vm(alg.stack_gen(alg.parse_expr('x*(y+2)')), {'x': 3, 'y': 4}, trace=True)[1] == [[3], [3, 4], [3, 4, 2], [3, 6], [18]]"
    steps:
      - show: |
          <p><b>Bước một — sinh mã</b> cho cây <code>(+ 1 (* 2 3))</code> bằng duyệt sau: <code>push 1, push 2, push 3, mul, add</code>.</p>
        say: "Bước một, sinh mã cho cây 1 cộng 2 nhân 3 bằng duyệt sau. Con trái của phép cộng là 1, nên đẩy 1. Con phải là cây nhân, nên đẩy 2, đẩy 3, rồi nhân. Cuối cùng mới phát lệnh cộng của gốc."
      - show: |
          <table class="t"><tr><th>Bước 2 — lệnh</th><th>ngăn xếp sau lệnh (đỉnh ở phải)</th></tr>
          <tr><td><code>push 1</code></td><td>[1]</td></tr><tr><td><code>push 2</code></td><td>[1, 2]</td></tr>
          <tr><td><code>push 3</code></td><td>[1, 2, 3]</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước hai, chạy tay ba lệnh đẩy, đỉnh ngăn xếp ở bên phải. Đẩy 1, ngăn xếp có 1. Đẩy 2, ngăn xếp có 1 và 2. Đẩy 3, ngăn xếp có 1, 2, 3, cao nhất là 3 tầng."
      - show: |
          <table class="t"><tr><th>Bước 3 — lệnh</th><th>lấy ra</th><th>đẩy vào</th><th>ngăn xếp</th></tr>
          <tr><td><code>mul</code></td><td>b = 3, rồi a = 2</td><td>$2 \times 3 = 6$</td><td>[1, 6]</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, lệnh nhân lấy b bằng 3 ở đỉnh ra trước, rồi lấy a bằng 2 ra sau. Nó đẩy 2 nhân 3 bằng 6 vào, ngăn xếp còn 1 và 6."
      - show: |
          <table class="t"><tr><th>Bước 4 — lệnh</th><th>lấy ra</th><th>đẩy vào</th><th>ngăn xếp</th></tr>
          <tr><td><code>add</code></td><td>b = 6, rồi a = 1</td><td>$1 + 6 = 7$</td><td>[$\hl{7}$]</td></tr></table>
        focus: [1, "1.2", 1]
        say: "Bước bốn, lệnh cộng lấy b bằng 6 ra trước, rồi lấy a bằng 1 ra sau, và đẩy 1 cộng 6 bằng 7. Ngăn xếp còn đúng một số. Số đó là kết quả, 7."
      - clear: true
        show: |
          <p><b>Bước 5 — có biến:</b> <code>x*(y+2)</code> với x = 3, y = 4 → <code>load x, load y, push 2, add, mul</code></p>
          <table class="t"><tr><th>sau lệnh</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>ngăn xếp</td><td>[3]</td><td>[3, 4]</td><td>[3, 4, 2]</td><td>[3, 6]</td><td>[$\hl{18}$]</td></tr></table>
        focus: [1, 2, 2]
        say: "Bước năm, với biến cũng vậy, x nhân ngoặc y cộng 2, với x bằng 3, y bằng 4. Lệnh nạp đặt giá trị của x rồi của y lên đỉnh, sau đó đẩy 2. Lệnh cộng cho 6, lệnh nhân cho 3 nhân 6, ra 18."

  - id: check
    kind: check
    title: "Tự kiểm: tính thẳng trên cây và hỏi một máy ảo thật"
    checks:
      - "alg.ast_eval(alg.parse_expr('1+2*3')) == 7 and alg.ast_eval(alg.parse_expr('x*(y+2)'), {'x': 3, 'y': 4}) == 18 and 1 + 2 * 3 == 7"
      - "[(i.opname, i.argrepr) for i in __import__('dis').get_instructions('x*(y+2)') if i.opname not in ('RESUME', 'RETURN_VALUE')] == [('LOAD_NAME', 'x'), ('LOAD_NAME', 'y'), ('LOAD_CONST', '2'), ('BINARY_OP', '+'), ('BINARY_OP', '*')]"
      - "3 - 2 == 1 and 3 * 1 - 2 * 1 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>đánh giá thẳng trên cây, không qua lệnh</td><td>7 và 18 ✓</td></tr>
          <tr><td>xem lệnh mà một trình thông dịch thật sinh cho <code>x*(y+2)</code></td><td>nạp x, nạp y, nạp 2, cộng, nhân ✓</td></tr>
          <tr><td>đếm độ cao: 3 lệnh đẩy/nạp (+1), 2 phép hai ngôi (−1)</td><td>$3 - 2 = 1$ giá trị ✓</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, thứ nhất, đánh giá thẳng trên cây mà không qua lệnh nào, ta được 7 và 18, khớp với máy ngăn xếp. Thứ hai, ta hỏi một trình thông dịch phổ biến xem nó sinh lệnh gì cho x nhân ngoặc y cộng 2. Nó sinh nạp x, nạp y, nạp 2, cộng, rồi nhân, đúng thứ tự duyệt sau như của ta. Thứ ba, đếm độ cao, ba lệnh đẩy hoặc nạp làm ngăn xếp cao thêm 3, hai phép hai ngôi làm thấp đi 2, nên cuối cùng còn đúng 1 giá trị."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.stack_vm([('push', 7), ('push', 2), ('sub',)]) == [5] and 2 - 7 == -5"
      - "[max(len(s) for s in alg.stack_vm(alg.stack_gen(alg.parse_expr(e)), trace=True)[1]) for e in ('((1+2)+3)+4', '1+(2+(3+4))')] == [2, 4]"
      - "[alg.stack_vm(alg.stack_gen(alg.parse_expr(e))) for e in ('((1+2)+3)+4', '1+(2+(3+4))')] == [[10], [10]]"
      - "compile('a+(b+(c+d))', '<s>', 'eval').co_stacksize > compile('((a+b)+c)+d', '<s>', 'eval').co_stacksize"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đảo thứ tự toán hạng của trừ, chia <b class="red">(sai)</b>
          <br><span class="note"><code>7-2</code> → <code>push 7, push 2, sub</code>. Lấy ra <code>b</code> = 2 trước, <code>a</code> = 7 sau, tính $a - b = 5$. Tính “cái lấy ra trước trừ cái sau” ra $-5$.</span></div>
        say: "Lỗi thứ nhất, đảo thứ tự toán hạng của trừ và chia. Với 7 trừ 2, máy đẩy 7, đẩy 2, rồi trừ, lấy b bằng 2 ra trước, a bằng 7 ra sau, và tính a trừ b bằng 5. Nếu tính cái lấy ra trước trừ cái lấy ra sau thì được âm 5."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Sinh mã theo duyệt trước <b class="red">(sai)</b>
          <br><span class="note">Phát lệnh của phép trước hai con: lệnh <code>add</code> chạy khi ngăn xếp chưa có đủ hai số.</span></div>
        say: "Lỗi thứ hai, sinh mã theo duyệt trước, phát lệnh của phép trước hai con. Khi đó lệnh cộng chạy lúc ngăn xếp chưa có đủ hai số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên rằng biểu thức đúng để lại <b>đúng một</b> giá trị <b class="red">(thiếu kiểm tra)</b>
          <br><span class="note">Mỗi <code>push</code>/<code>load</code> +1, mỗi phép hai ngôi −1. Đếm thấy cuối cùng khác 1 là bộ sinh mã có lỗi.</span></div>
        say: "Lỗi thứ ba, quên rằng một biểu thức đúng để lại đúng một giá trị. Mỗi lệnh đẩy hay nạp làm ngăn xếp cao thêm 1, mỗi phép hai ngôi làm thấp đi 1. Đếm thấy cuối cùng khác 1 là bộ sinh mã có lỗi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Viết bộ sinh mã mà không tính <b>độ cao tối đa</b> của ngăn xếp.</div>
          <table class="t"><tr><th>biểu thức</th><th>kết quả</th><th>ngăn xếp cao nhất</th></tr>
          <tr><td><code>((1+2)+3)+4</code> — cây lệch trái</td><td>10</td><td>2 tầng</td></tr>
          <tr><td><code>1+(2+(3+4))</code> — cây lệch phải</td><td>10</td><td>$\hl{4}$ tầng</td></tr></table>
          <p class="note">Nhiều máy ảo bắt mỗi hàm khai trước độ cao tối đa để cấp chỗ. Bộ sinh mã phải tính con số này từ cây; với phép cộng, nhân có thể sinh con sâu hơn trước để giảm nó — với trừ, chia thì không được đổi chỗ.</p>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, viết bộ sinh mã mà không tính độ cao tối đa của ngăn xếp. Bảng so hai biểu thức cùng ra 10. Cây lệch trái chỉ cần ngăn xếp cao 2 tầng, vì cứ có hai số là tính ngay. Cây lệch phải phải đẩy đủ 4 số rồi mới tính được, nên cần 4 tầng. Nhiều máy ảo bắt mỗi hàm khai trước độ cao tối đa để cấp chỗ, nên bộ sinh mã phải tính con số này từ cây. Với phép cộng và nhân, có thể sinh con sâu hơn trước để giảm độ cao, còn với trừ và chia thì không được đổi chỗ, như lỗi thứ nhất đã cho thấy."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.stack_gen(alg.parse_expr('(8-3)*2')) == [('push', 8), ('push', 3), ('sub',), ('push', 2), ('mul',)]"
      - "alg.stack_vm(alg.stack_gen(alg.parse_expr('(8-3)*2')), trace=True) == ([10], [[8], [8, 3], [5], [5, 2], [10]])"
    steps:
      - show: |
          <p>Biểu thức <code>(8-3)*2</code>:</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Sinh dãy lệnh.</td></tr>
          <tr><td>2</td><td>Ghi ngăn xếp sau mỗi lệnh.</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với biểu thức 8 trừ 3 trong ngoặc, nhân 2. Câu một, sinh dãy lệnh. Câu hai, ghi lại ngăn xếp sau mỗi lệnh. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>Cây: <code>(* (- 8 3) 2)</code> — gốc là phép nhân.</p>
          <p>① Duyệt sau: con trái <code>(- 8 3)</code> → <code>push 8, push 3, sub</code>; con phải → <code>push 2</code>; gốc → <code>mul</code>.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, trước hết dựng cây, gốc là phép nhân, con trái là 8 trừ 3, con phải là 2. Duyệt sau sinh con trái trước, được đẩy 8, đẩy 3, trừ. Sau đó con phải cho đẩy 2, và cuối cùng gốc cho lệnh nhân."
      - show: |
          <table class="t"><tr><th>② lệnh</th><th>ngăn xếp sau lệnh</th></tr>
          <tr><td><code>push 8</code>, <code>push 3</code></td><td>[8], [8, 3]</td></tr>
          <tr><td><code>sub</code>: b = 3, a = 8 → $8 - 3 = 5$</td><td>[5]</td></tr>
          <tr><td><code>push 2</code>, <code>mul</code>: $5 \times 2$</td><td>[5, 2], [$\hl{10}$]</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, chạy tay từng lệnh. Đẩy 8 rồi đẩy 3, ngăn xếp là 8, rồi 8 và 3. Lệnh trừ lấy b bằng 3 trước, a bằng 8 sau, tính 8 trừ 3 bằng 5, giữ đúng thứ tự toán hạng. Đẩy 2 được 5 và 2, rồi lệnh nhân cho 10."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cây</span><span class="a">→</span>
          <span class="n">duyệt sau: con trái, con phải, phép</span><span class="a">→</span>
          <span class="n">lệnh đọc, ghi ở đỉnh ngăn xếp</span><span class="a">→</span>
          <span class="n">lấy b trước, a sau: a ∘ b</span></div>
        say: "Tổng kết lại, từ cây, ta sinh mã bằng duyệt sau, con trái, con phải, rồi phép. Mọi lệnh đọc và ghi ở đỉnh ngăn xếp, và phép hai ngôi lấy b ra trước, a ra sau, rồi tính a với b."
      - show: |
          <div class="box key"><b>Tư duy:</b> cùng một lần duyệt cây có thể <b>tính</b>, <b>kiểm</b>, hay <b>dịch</b> — chỉ khác việc làm ở mỗi nút.</div>
        say: "Điều cần mang theo, cùng một lần duyệt cây có thể tính, kiểm, hay dịch, chỉ khác ở việc làm tại mỗi nút."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): làm mã chạy nhanh hơn — <b>tối ưu mã</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học cách làm mã chạy nhanh hơn, với tối ưu mã. Hẹn gặp bạn ở bài tiếp theo."
