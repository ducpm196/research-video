id: L13
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 13 — Tình huống chuyên gia theo dòng thời gian: chuyển sang ngôn ngữ an toàn bộ nhớ"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/plc.yaml L13; audit/plc/sources_L13.md (câu trích nguyên văn, đọc 2026-11-02); audit/plc/verify_plc.py L13; MSRC Team, A proactive approach to more secure code, MSRC Blog, 2019-07-16 [MS19]; MSRC Team, We need a safer systems programming language, 2019-07-18 [MS19b]; M. Miller, Trends, challenges, and strategic shifts in the software vulnerability mitigation landscape, BlueHat IL 2019 [BH19]; Chromium, The Rule Of 2 (docs/security/rule-of-2.md, số liệu tháng 3/2019) [CR19]; J. Vander Stoep, C. Zhang, Queue the Hardening Enhancements, Google Security Blog, 2019-05-09 [AQ19]; J. Vander Stoep, S. Hines, Rust in the Android platform, 2021-04-06 [AR21]; J. Vander Stoep, Memory Safe Languages in Android 13, 2022-12-01 [AN22]; J. Vander Stoep, A. Rebert, Eliminating Memory Safety Vulnerabilities at the Source, 2024-09-25 [AN24]; J. Vander Stoep, Rust in Android: move fast and fix things, 2025-11-13 [AN25]; PLC bài 5 (kiểu), bài 8 (bộ nhớ), bài 11 (hành vi không xác định), bài 12 (bất biến, đồng thời); khoá SEC bài 11 (an toàn bộ nhớ)"
assumes: [arith]
# Quy ước: “lỗi bộ nhớ” = lỗ hổng an toàn bộ nhớ (memory safety vulnerability); “ngoài biên” = đọc/ghi ngoài vùng được cấp (out of bounds);
#   “dùng sau giải phóng” = use-after-free; “hộp cát” = sandbox; “khối không an toàn” = unsafe{} của Rust; “mật độ lỗ hổng” = số lỗ hổng
#   chia số dòng mã (mỗi nghìn hay mỗi triệu dòng). Mọi sự kiện, con số có nguồn ghi trong audit/plc/sources_L13.md; con số khác là phép tính
#   lại (checks) hoặc ghi “(số minh hoạ)”: dịch vụ 200 000 dòng, 20 000 dòng mới mỗi năm, 100 lỗi giảm một nửa mỗi năm, 20 lỗi mới mỗi năm
#   là SỐ MINH HOẠ. Tuổi thọ trung bình 2,5 năm là tham số mô phỏng của [AN24] (“numbers similar to Android”), không phải số đo.
#   An ninh chỉ ở mức khái niệm phòng thủ: loại lỗi, tỉ lệ, cách phòng — không có mã hay chuỗi khai thác.
#   Tên chỉ trên màn hình (lời đọc dùng tên mô tả): CVE, Chromium, Scudo, CrabbyAVIF, QR, AOSP. Luật đọc: lexicon_vi.PLC.yaml (probe p1).
objectives:
  - "Kể lại hành trình chuyển sang ngôn ngữ an toàn bộ nhớ qua năm chặng từ 2019 tới 2025, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại tỉ lệ, mật độ lỗ hổng và mức giảm theo tuổi mã từ số liệu đã công bố"
  - "Chọn cách giảm lỗi bộ nhớ hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bảy phần mười lỗ hổng đến từ một loại lỗi"
    checks:
      - "100 - 70 == 30 and 76 - 20 == 56"
    steps:
      - show: |
          <p>Năm 2019, Microsoft viết: <b>khoảng 70%</b> lỗ hổng họ cấp mã định danh công khai (CVE) <b>mỗi năm</b> vẫn là lỗi <b>an toàn bộ nhớ</b> — dù đã có kiểm tra mã, đào tạo, công cụ phân tích.</p>
          <p>Ở Android, tỉ lệ ấy là <b>76%</b> năm 2019, và năm 2025 lần đầu tiên xuống <b>dưới 20%</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 2019 tới 2025 — một hệ hàng chục triệu dòng mã giảm lỗi bộ nhớ thế nào, mà không viết lại tất cả.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, năm 2019, Microsoft viết rằng khoảng 70% lỗ hổng họ công bố mỗi năm vẫn là lỗi an toàn bộ nhớ, dù đã có nhiều công cụ và quy trình. Ở hệ điều hành Android, tỉ lệ ấy là 76% năm 2019, và năm 2025 lần đầu tiên xuống dưới 20%. Hôm nay ta xem một hệ hàng chục triệu dòng mã giảm lỗi bộ nhớ thế nào, mà không viết lại tất cả."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "round(0.35 * 240) == 84 and round(84 / 0.35) == 240 and 20 * 12 == 240"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ</th></tr>
          <tr><td>bài 8</td><td>biến cục bộ nằm trên <b>ngăn xếp</b>, bị thu hồi khi hàm trả về</td><td>trả về địa chỉ biến cục bộ trong C → con trỏ trỏ vào vùng sắp bị ghi đè</td></tr>
          <tr><td>bài 5</td><td>kiểm kiểu <b>tĩnh</b> là kiểm trước khi chạy</td><td>cộng số với chuỗi: báo lỗi trước khi chạy</td></tr>
          <tr><td>bài 11</td><td><b>hành vi không xác định</b>: trình biên dịch được giả định nó không xảy ra</td><td>tràn số có dấu trong C</td></tr>
          <tr><td>bài 12</td><td>dữ liệu <b>bất biến</b>: nhiều luồng cùng đọc không cần khoá</td><td>muốn “sửa” thì tạo bản mới</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Ở bài 8, biến cục bộ nằm trên ngăn xếp và bị thu hồi khi hàm trả về, nên trả về địa chỉ của nó là trỏ vào vùng sắp bị ghi đè. Ở bài 5, kiểm kiểu tĩnh là kiểm trước khi chạy, nên cộng số với chuỗi bị báo lỗi sớm. Ở bài 11, hành vi không xác định là chỗ trình biên dịch được giả định không bao giờ xảy ra, như tràn số có dấu trong C. Ở bài 12, dữ liệu bất biến, tức tạo xong không sửa được, cho nhiều luồng chạy cùng lúc cùng đọc mà không cần khoá."
      - show: |
          <table class="t"><tr><th>phép tính dùng trong bài</th><th>làm thử</th></tr>
          <tr><td>phần = tỉ lệ nhân tổng</td><td>35% của 240 = 0,35 nhân 240 = $\hlg{84}$</td></tr>
          <tr><td>tổng = phần chia tỉ lệ</td><td>84 chia 0,35 = 240</td></tr>
          <tr><td>đổi đơn vị theo thời gian</td><td>20 mỗi tháng nhân 12 tháng = 240 mỗi năm</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Bài còn dùng ba phép tính nhỏ, đầu tiên 35% của 240 là 0 phẩy 35 nhân 240, được 84. Ngược lại, biết phần và tỉ lệ thì tổng bằng phần chia tỉ lệ, 84 chia 0 phẩy 35 lại được 240. Cuối cùng là đổi đơn vị theo thời gian, 20 mỗi tháng nhân 12 tháng là 240 mỗi năm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>lỗi an toàn bộ nhớ</b></td><td>đọc hay ghi vùng nhớ không được phép: <b>ngoài biên</b> mảng, hoặc <b>dùng sau giải phóng</b> (con trỏ treo: địa chỉ vẫn trỏ vào vùng đã bị thu hồi)</td></tr>
          <tr><td><b>ngôn ngữ an toàn bộ nhớ</b></td><td>mọi truy cập bộ nhớ có nghĩa xác định; phần lớn nhờ thu gom rác; ngôn ngữ hệ thống Rust (bài gọi là <b>ngôn ngữ mới</b>) chủ yếu nhờ kiểm lúc biên dịch, cộng một số phép kiểm lúc chạy</td></tr>
          <tr><td><b>hộp cát</b> (sandbox)</td><td>tiến trình riêng (một chương trình đang chạy, có vùng nhớ riêng), ít quyền: lỗi bên trong khó lan ra ngoài</td></tr>
          <tr><td><b>khối không an toàn</b> (unsafe)</td><td>đoạn mã Rust người viết tự cam đoan là đúng</td></tr>
          <tr><td><b>mật độ lỗ hổng</b></td><td>số lỗ hổng chia số dòng mã, ví dụ 1 mỗi nghìn dòng</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.5", "1.6"]
        say: "Lỗi an toàn bộ nhớ là đọc hay ghi vùng nhớ không được phép, như đi ra ngoài biên mảng, hoặc dùng sau giải phóng. Khi đó ta có con trỏ treo, tức địa chỉ vẫn trỏ vào vùng đã bị thu hồi, như ở bài 8. Với ngôn ngữ an toàn bộ nhớ, mọi truy cập bộ nhớ đều có nghĩa xác định, phần lớn nhờ thu gom rác. Riêng ngôn ngữ hệ thống ghi trên màn hình, mà bài gọi là ngôn ngữ mới, thì chủ yếu nhờ kiểm lúc biên dịch, cộng thêm một số phép kiểm lúc chạy. Hộp cát là một tiến trình riêng, tức một chương trình đang chạy có vùng nhớ riêng, lại ít quyền, nên lỗi bên trong khó lan ra ngoài. Khối không an toàn là đoạn mã của ngôn ngữ mới mà người viết tự cam đoan là đúng. Mật độ lỗ hổng là số lỗ hổng chia số dòng mã, ví dụ một lỗ hổng mỗi nghìn dòng."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2019</text><text x="160" y="200">đếm nguyên nhân</text><text x="160" y="232">khoảng 70% mỗi năm</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2019 → 2021</text><text x="500" y="200">hộp cát có giá</text><text x="500" y="232">mã mới viết bằng Rust</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2022</text><text x="850" y="200">223 xuống 85</text><text x="850" y="232">76% xuống 35%</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2024</text><text x="1200" y="200">lỗi vơi theo tuổi mã</text><text x="1200" y="232">còn 24%</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2025</text><text x="1540" y="200">dưới 20%</text><text x="1540" y="232">vẫn giữ nhiều lớp phòng</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2019, các đội đếm nguyên nhân gốc và thấy lỗi bộ nhớ chiếm khoảng 70% mỗi năm. Từ 2019 tới 2021, hộp cát lộ ra cái giá của nó, và mã mới bắt đầu được viết bằng ngôn ngữ mới. Năm 2022, số lỗi bộ nhớ của Android giảm từ 223 xuống 85, năm 2024 tỉ lệ còn 24%, và năm 2025 xuống dưới 20%, mà vẫn giữ nhiều lớp phòng."

  # ───────────────────────── 5. CƠ CHẾ: LỖI GIẢM THEO TUỔI MÃ ─────────────────────────
  - id: decay
    kind: concept
    title: "Cơ chế chung: khoá vòi ở mã mới, lỗi cũ tự vơi dần"
    checks:
      - "(n := [100 / 2 ** k for k in range(4)]) == [100, 50, 25, 12.5]"
      - "(lambda s: [s := s / 2 + 20 for _ in range(3)])(100) == [70, 55, 47.5]"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330">
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="120" y="60" width="160" height="200" fill="#e11d48" opacity="0.8"/><text x="200" y="300">năm 0: 100</text>
          <rect x="420" y="160" width="160" height="100" fill="#e11d48" opacity="0.8"/><text x="500" y="300">năm 1: 50</text>
          <rect x="720" y="210" width="160" height="50" fill="#e11d48" opacity="0.8"/><text x="800" y="300">năm 2: 25</text>
          <rect x="1020" y="235" width="160" height="25" fill="#e11d48" opacity="0.8"/><text x="1100" y="300">năm 3: 12,5</text>
          </g>
          <line x1="80" y1="260" x2="1260" y2="260" stroke="#1f2937" stroke-width="3"/>
          <text x="1300" y="120" font-size="22" fill="#6b7280">mỗi năm tìm</text><text x="1300" y="150" font-size="22" fill="#6b7280">và sửa được</text><text x="1300" y="180" font-size="22" fill="#6b7280">một nửa số lỗi</text><text x="1300" y="210" font-size="22" fill="#6b7280">còn lại</text>
          </svg></div>
          <p class="note">Số minh hoạ: 100 lỗi trong mã viết năm 0, không ai thêm mã mới.</p>
        focus: [2, 1, 1]
        say: "Trước các chặng, ta xem cơ chế mà đội Android dựa vào, với một khối mã mới có 100 lỗi, một số minh hoạ. Nếu mỗi năm người ta tìm và sửa được một nửa số lỗi còn lại, thì sau một năm còn 50, sau hai năm còn 25, sau ba năm còn 12 phẩy 5. Mã càng cũ càng ít lỗi, và kiểu giảm mà mỗi năm chia cho cùng một số như vậy gọi là giảm theo cấp số nhân."
      - clear: true
        show: |
          <table class="t"><tr><th>năm</th><th>lỗi còn lại của mã cũ</th><th>lỗi còn lại của 20 lỗi mới mỗi năm (số minh hoạ; cũng vơi một nửa mỗi năm)</th><th>tổng</th></tr>
          <tr><td>0</td><td>100</td><td>0</td><td>100</td></tr>
          <tr><td>1</td><td>50</td><td>20</td><td>70</td></tr>
          <tr><td>2</td><td>25</td><td>30</td><td>55</td></tr>
          <tr><td>3</td><td>12,5</td><td>35</td><td>$\hl{47{,}5}$</td></tr></table>
          <div class="box key">Viết mã mới bằng ngôn ngữ cũ thì mỗi năm lại thêm lỗi mới, nên tổng không về 0 mà dừng quanh 40. Vì thế đội Android chọn <b>khoá vòi ở mã mới</b>, thay vì viết lại mã cũ.</div>
        focus: ["1.3", "1.5", 2]
        say: "Nhưng hệ thật vẫn được viết thêm, nên giả sử mỗi năm thêm 20 lỗi mới, số minh hoạ, cũng vơi một nửa mỗi năm, thì sau một năm tổng là 50 cộng 20, bằng 70. Tới năm ba, phần cũ còn 12 phẩy 5, phần mới còn 35, tổng là 47 phẩy 5, và sẽ dừng quanh 40 chứ không về 0. Vì thế đội Android chọn khoá vòi ở mã mới, thay vì viết lại mã cũ."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2019 — khai sinh: đếm nguyên nhân gốc"
    stage: {year: "2019", scale: "Microsoft phân loại mọi lỗ hổng từ 2004; khoảng 70% mỗi năm 2006–2018 là lỗi bộ nhớ; Chromium: 5 trên 130 lỗi nghiêm trọng không do hỏng bộ nhớ (3/2019)", source: "[MS19] [MS19b] [BH19] [CR19]", practice: "phân loại nguyên nhân gốc theo năm trước khi chọn giải pháp; chuyển gánh nặng từ người viết tính năng sang người làm ngôn ngữ"}
    checks:
      - "130 - 5 == 125 and round(125 / 130 * 100, 1) == 96.2"
    steps:
      - show: |
          <p><b>Quy mô:</b> từ 2004, nhóm ứng phó an ninh của Microsoft phân loại <b>mọi</b> lỗ hổng được báo. Từ 2006 tới 2018, mỗi năm <b>khoảng 70%</b> là lỗi an toàn bộ nhớ, trong mã C và C++.</p>
          <p><b>Điểm nghẽn:</b> tỉ lệ ấy gần như không đổi suốt hơn mười năm, dù có kiểm tra mã, đào tạo, phân tích tĩnh, kiểm thử bằng dữ liệu ngẫu nhiên. Mã càng nhiều, vấn đề càng tệ hơn.</p>
          <p><b>Cách nhìn mới:</b> ngôn ngữ an toàn bộ nhớ chuyển gánh nặng từ người viết tính năng sang <b>người làm ngôn ngữ</b>.</p>
        focus: [1, 2, 3]
        say: "Ở chặng một, nhóm ứng phó an ninh của Microsoft phân loại mọi lỗ hổng từ năm 2004, và từ 2006 tới 2018, mỗi năm khoảng 70% là lỗi bộ nhớ trong mã C và C cộng cộng. Điểm nghẽn là tỉ lệ ấy gần như không đổi suốt hơn mười năm, dù đã có kiểm tra mã, đào tạo và nhiều công cụ. Cách nhìn mới là dùng ngôn ngữ an toàn bộ nhớ, để gánh nặng chuyển từ người viết tính năng sang người làm ngôn ngữ."
      - clear: true
        show: |
          <p>Đội an ninh của trình duyệt Chromium ghi: tính tới tháng 3/2019, chỉ khoảng <b>5 trên 130</b> lỗi công khai mức nghiêm trọng nhất là <b>không</b> rõ ràng do hỏng bộ nhớ.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. số lỗi do hỏng bộ nhớ</td><td>130 trừ 5</td><td>$\hlb{125}$ lỗi</td></tr>
          <tr><td>Bước 2. tỉ lệ</td><td>125 chia 130, nhân 100</td><td>≈ $\hlg{96{,}2}$%</td></tr></table>
          <p class="note">Thực hành: đếm nguyên nhân gốc của lỗ hổng theo từng năm trước khi chọn giải pháp. Điều kiện: có đủ nhiều năm dữ liệu đã phân loại; vài lỗi lẻ chưa nói lên xu hướng.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Đội an ninh của một trình duyệt mã nguồn mở lớn ghi rằng tới tháng 3 năm 2019, chỉ khoảng 5 trên 130 lỗi nghiêm trọng nhất là không rõ ràng do hỏng bộ nhớ. Bước một, 130 trừ 5 còn 125 lỗi do hỏng bộ nhớ. Bước hai, 125 chia 130 nhân 100 được khoảng 96 phẩy 2%. Thực hành rút ra là đếm nguyên nhân gốc theo từng năm trước khi chọn giải pháp, với điều kiện có đủ nhiều năm dữ liệu."

