          <tr><td>Bước 1. 5 năm là mấy lần tuổi thọ trung bình</td><td>5 chia 2,5</td><td>2 lần</td></tr>
          <tr><td>Bước 2. chia cho e hai lần</td><td>2,718 nhân 2,718</td><td>≈ $\hlg{7{,}39}$, khớp “7,4 lần”</td></tr>
          <tr><td>Bước 3. con số 3,4 lần ứng với tuổi thọ dài hơn</td><td>lỗi sống lâu thì vơi chậm hơn</td><td>≈ 4,1 năm</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ta tính lại con số 7 phẩy 4, với tuổi thọ trung bình 2 phẩy 5 năm thì cứ mỗi 2 phẩy 5 năm, số lỗ hổng còn lại chia cho số e, xấp xỉ 2 phẩy 718. Bước một, 5 năm chia 2 phẩy 5 là đúng hai lần tuổi thọ trung bình. Bước hai, chia cho e hai lần, tức 2 phẩy 718 nhân 2 phẩy 718, được khoảng 7 phẩy 39, khớp với 7 phẩy 4 lần. Bước ba, con số 3 phẩy 4 lần ứng với tuổi thọ dài hơn, khoảng 4 phẩy 1 năm."
      - clear: true
        show: |
