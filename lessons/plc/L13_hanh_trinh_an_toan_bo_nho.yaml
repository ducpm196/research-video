          <p><b>Giải thích của đội:</b> lỗ hổng giảm theo cấp số nhân, có “nửa đời”. Mô phỏng của đội, dựa trên số gần với Android, dùng tuổi thọ trung bình <b>2,5 năm</b>. Mã 5 năm tuổi ít lỗ hổng hơn mã mới <b>3,4 lần</b> (theo một nghiên cứu lớn năm 2022) tới <b>7,4 lần</b> (theo Android và Chromium).</p>
        focus: [1, 2, 2]
        say: "Ở chặng bốn, năm 2024, tỉ lệ lỗi bộ nhớ của Android còn 24%, từ 76% sau 6 năm, thấp hơn hẳn mức 70% chung của ngành. Phần lớn mã vẫn không an toàn, nhưng ngày càng cũ, và đội giải thích rằng lỗ hổng giảm theo cấp số nhân, và mô phỏng của họ dùng tuổi thọ trung bình 2 phẩy 5 năm. Theo đội, mã 5 năm tuổi ít lỗ hổng hơn mã mới từ 3 phẩy 4 lần, theo một nghiên cứu năm 2022, tới 7 phẩy 4 lần, theo số của chính họ."
      - clear: true
        show: |
