    stage: {year: "2025", scale: "lỗi bộ nhớ lần đầu dưới 20%; khoảng 5 triệu dòng Rust, 1 lỗ hổng suýt lọt; khoảng 4% mã Rust nằm trong khối không an toàn", source: "[AN25]", practice: "giữ nhiều lớp phòng (bộ cấp phát có trang canh); coi lỗi suýt lọt như sự cố thật: cấp mã định danh, hậu kiểm, sửa báo cáo lỗi, thêm đào tạo về khối không an toàn"}
    checks:
      - "1 / 5 == 0.2 and 1000 / 0.2 == 5000 and 5000 > 1000"
      - "5000000 * 4 // 100 == 200000"
    steps:
      - show: |
          <p><b>Quy mô:</b> năm 2025, lỗi bộ nhớ lần đầu tiên <b>dưới 20%</b> tổng lỗ hổng của Android. Có khoảng <b>5 triệu dòng</b> Rust; lượng Rust mới thêm vào đã ngang C++.</p>
          <p><b>Lỗi suýt lọt:</b> lỗ hổng bộ nhớ đầu tiên trong mã Rust — một lần <b>tràn bộ đệm</b> (ghi quá cuối vùng nhớ được cấp) trong một thư viện đọc ảnh — được sửa <b>trước khi phát hành</b>. Bộ cấp phát bộ nhớ (phần chia vùng nhớ cho chương trình) được gia cố, có <b>trang canh</b> quanh vùng cấp phát (vùng cấm chạm: ghi tràn sang là chương trình dừng ngay), đã làm nó không khai thác được.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Ở chặng năm, năm 2025, lỗi bộ nhớ lần đầu tiên chiếm dưới 20% tổng lỗ hổng của Android. Lúc này có khoảng 5 triệu dòng ngôn ngữ mới, và lượng mã ấy mới thêm vào đã ngang với C cộng cộng. Cũng năm đó, lỗ hổng bộ nhớ đầu tiên trong mã ngôn ngữ mới, một lần tràn bộ đệm, tức ghi quá cuối vùng được cấp, trong thư viện đọc ảnh, được sửa trước khi phát hành. Bộ cấp phát, phần chia vùng nhớ cho chương trình, được gia cố bằng trang canh quanh vùng cấp phát. Đó là vùng cấm chạm, ghi tràn sang là chương trình dừng ngay, nên lỗi này không khai thác được."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mật độ của Rust</td><td>1 lỗ hổng chia 5 triệu dòng</td><td>$\hlb{0{,}2}$ mỗi triệu dòng</td></tr>
          <tr><td>Bước 2. mật độ lịch sử của C/C++</td><td>gần 1000 mỗi triệu dòng (= 1 mỗi nghìn dòng)</td><td>1000</td></tr>
          <tr><td>Bước 3. so hai mật độ</td><td>1000 chia 0,2</td><td>$\hlg{5000}$ lần — nguồn nói “hơn 1000 lần”</td></tr>
          <tr><td>Bước 4. mã nằm trong khối không an toàn</td><td>4% của 5&nbsp;000&nbsp;000</td><td>$\hl{200\,000}$ dòng cần soát kỹ</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Ta tính lại theo cách của đội, bước một, một lỗ hổng chia 5 triệu dòng là 0 phẩy 2 lỗ hổng mỗi triệu dòng. Bước hai, mật độ lịch sử của C và C cộng cộng là gần 1000 mỗi triệu dòng, đúng bằng một mỗi nghìn dòng của năm 2022. Bước ba, 1000 chia 0 phẩy 2 là 5000 lần, nên nguồn nói thận trọng là hơn 1000 lần. Bước bốn, khoảng 4% mã ngôn ngữ mới nằm trong khối không an toàn, tức 200 nghìn dòng cần soát kỹ."
      - clear: true
        show: |
          <table class="t"><tr><th>thực hành khi đã ổn định</th><th>vì sao</th></tr>
          <tr><td>giữ <b>nhiều lớp phòng</b>: bộ cấp phát có trang canh vẫn bật</td><td>chính nó làm lỗi suýt lọt năm 2025 không khai thác được</td></tr>
          <tr><td>lỗi suýt lọt vẫn được <b>cấp mã định danh</b> và <b>hậu kiểm</b></td><td>hậu kiểm thấy báo cáo khi chương trình sập chưa nói rõ là tràn bộ đệm — đã sửa</td></tr>
          <tr><td>không cấm khối không an toàn, mà <b>dạy cách dùng đúng</b> và bọc lại</td><td>hệ điều hành cần chạm phần cứng, gọi mã C</td></tr>
          <tr><td>đo cả <b>tốc độ làm việc</b>: quay lui ít hơn khoảng 4 lần, soát mã ít hơn 25% thời gian</td><td>đường an toàn hơn cũng là đường nhanh hơn</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5"]
        say: "Khi đã ổn định, đội vẫn giữ nhiều lớp phòng, vì chính bộ cấp phát có trang canh đã làm lỗi suýt lọt không khai thác được. Lỗi suýt lọt vẫn được cấp mã định danh và hậu kiểm, nhờ đó báo cáo khi chương trình sập được sửa cho rõ hơn. Họ không cấm khối không an toàn, mà dạy cách dùng đúng. Họ còn đo tốc độ làm việc, mã ngôn ngữ mới bị quay lui ít hơn khoảng 4 lần, và tốn ít hơn 25% thời gian soát mã."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "round(0.962 * 130) == 125"
      - "round(85 / 243, 2) == 0.35 and round(138 / 223, 3) == 0.619"
      - "round(2.5 * __import__('math').log(2), 2) == 1.73 and round(5 / 1.733, 2) == 2.89 and round(2 ** (5 / (2.5 * __import__('math').log(2))), 2) == 7.39"
      - "0.2 * 5 == 1.0 and 1000 * 5 == 5000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>96,2%</td><td>nhân ngược: 0,962 nhân 130 ≈ 125, cộng 5 lỗi còn lại = 130 ✓</td></tr>
          <tr><td>243 và 35%</td><td>chia ngược: 85 chia 243 ≈ 0,35 ✓</td></tr>
          <tr><td>7,39 lần</td><td>theo nửa đời: 2,5 năm nhân 0,693 ≈ 1,73 năm; 5 năm ≈ 2,89 lần chia đôi; 2 mũ 2,89 ≈ 7,39 ✓</td></tr>
          <tr><td>5000 lần</td><td>đếm thẳng: 5 triệu dòng với mật độ cũ → 5000 lỗ hổng, so với 1 lỗ hổng thật ✓</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác, nhân ngược, 0 phẩy 962 nhân 130 được khoảng 125, cộng 5 là đủ 130. Chia ngược, 85 chia 243 được khoảng 0 phẩy 35. Theo nửa đời, 2 phẩy 5 năm nhân 0 phẩy 693 được khoảng 1 phẩy 73 năm thì số lỗi giảm một nửa. Năm năm là khoảng 2 phẩy 89 lần chia đôi, và 2 mũ 2 phẩy 89 lại ra khoảng 7 phẩy 39. Đếm thẳng, 5 triệu dòng với mật độ cũ sẽ có 5000 lỗ hổng, so với một lỗ hổng thật."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lập trình viên giỏi và cẩn thận hơn là hết lỗi bộ nhớ”</td><td>có kiểm tra mã, đào tạo, phân tích tĩnh mà tỉ lệ vẫn khoảng 70% suốt hơn mười năm</td><td>đổi công cụ, không đổ cho người: để ngôn ngữ chặn cả một loại lỗi</td></tr>
          <tr><td><b class="red">2.</b> “Muốn an toàn thì viết lại toàn bộ sang Rust”</td><td>hàng chục triệu dòng không viết lại được; mã cũ đã vơi lỗi theo tuổi</td><td>khoá vòi ở mã mới; đầu tư vào gọi qua lại an toàn giữa hai ngôn ngữ</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là nghĩ lập trình viên giỏi và cẩn thận hơn là hết lỗi bộ nhớ. Có kiểm tra mã, đào tạo, phân tích tĩnh mà tỉ lệ vẫn khoảng 70% suốt hơn mười năm, nên hãy đổi công cụ chứ đừng đổ cho người. Bài học sai thứ hai là nghĩ phải viết lại toàn bộ, trong khi hàng chục triệu dòng không viết lại được, và mã cũ đã tự vơi lỗi. Hãy khoá vòi ở mã mới, và đầu tư vào việc gọi qua lại an toàn giữa hai ngôn ngữ."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Đã dùng ngôn ngữ an toàn thì bỏ các lớp phòng khác”</td><td>năm 2025, lỗi tràn bộ đệm đầu tiên trong mã Rust bị bộ cấp phát có trang canh làm cho không khai thác được</td><td>giữ nhiều lớp phòng, dùng có chọn lọc</td></tr>
          <tr><td><b class="red">4.</b> “Tỉ lệ giảm là số lỗi giảm, và giảm là nhờ đổi ngôn ngữ”</td><td>năm 2023 tỉ lệ vẫn giảm mà số tuyệt đối tăng nhẹ; đội tự ghi tương quan chưa chắc là nhân quả</td><td>báo cả số tuyệt đối lẫn tỉ lệ; nêu các giải thích khác</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là bỏ các lớp phòng khác khi đã dùng ngôn ngữ an toàn, trong khi lỗi suýt lọt năm 2025 không khai thác được là nhờ bộ cấp phát có trang canh. Bài học sai thứ tư hay gặp ở người đã đi làm, là nghĩ tỉ lệ giảm có nghĩa số lỗi giảm, và chắc chắn là nhờ đổi ngôn ngữ. Năm 2023, tỉ lệ lỗi bộ nhớ vẫn giảm mà số tuyệt đối lại tăng nhẹ, vì năm đó có nhiều báo cáo hơn hẳn. Chính đội Android cũng ghi tương quan chưa chắc là nhân quả, nên hãy báo cả số tuyệt đối lẫn tỉ lệ."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "200000 // 1000 == 200 and 20000 // 1000 == 20"
      - "round(200 / 7.39) == 27"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: dịch vụ 200&nbsp;000 dòng C++ đã chạy 5 năm, đội 5 người, mỗi năm thêm 20&nbsp;000 dòng (số minh hoạ)</th></tr>
          <tr><td>1</td><td>có người đề nghị viết lại cả 200&nbsp;000 dòng sang Rust trong một năm. Hay chỉ viết phần mới bằng Rust?</td></tr>
          <tr><td>2</td><td>cần thêm bộ đọc tệp do người dùng tải lên, chạy với quyền cao. Viết bằng C++ trong hộp cát, hay bằng Rust?</td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Đến lượt bạn, với một dịch vụ 200 nghìn dòng C cộng cộng đã chạy 5 năm, mỗi năm thêm 20 nghìn dòng, đều là số minh hoạ. Câu một, có người đề nghị viết lại cả 200 nghìn dòng sang ngôn ngữ mới trong một năm, hay chỉ viết phần mới bằng ngôn ngữ mới? Câu hai, bạn cần thêm bộ đọc tệp do người dùng tải lên, chạy với quyền cao, vậy viết bằng C cộng cộng trong hộp cát, hay bằng ngôn ngữ mới? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <p>Giả sử mật độ mã mới là 1 lỗ hổng mỗi nghìn dòng, như số lịch sử của Android.</p>
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chỉ viết mã mới bằng Rust</td><td>chặn khoảng 20&nbsp;000 chia 1000 = $\hlg{20}$ lỗ hổng mới mỗi năm</td><td>phải làm cầu gọi qua lại; đội phải học ngôn ngữ mới</td></tr>
          <tr><td>viết lại cả 200&nbsp;000 dòng</td><td>mã cũ cũng an toàn</td><td>mã 5 năm tuổi chỉ còn khoảng 200 chia 7,39 ≈ $\hl{27}$ lỗ hổng; một năm không thêm tính năng</td></tr></table>
          <p class="note">Chọn khoá vòi ở mã mới. Điều kiện đổi: phần cũ sẽ còn bị sửa nhiều, hoặc đọc dữ liệu không tin cậy với quyền cao — viết lại riêng phần đó trước.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Đáp án câu một, giả sử mật độ mã mới là một lỗ hổng mỗi nghìn dòng, như số lịch sử của Android. Chỉ viết mã mới bằng ngôn ngữ mới thì chặn được 20 nghìn chia 1000, bằng 20 lỗ hổng mới mỗi năm, đổi lại phải làm cầu gọi qua lại và học ngôn ngữ mới. Viết lại cả dịch vụ thì mã cũ cũng an toàn, nhưng mã 5 năm tuổi chỉ còn khoảng 200 chia 7 phẩy 39, chừng 27 lỗ hổng, mà mất một năm không thêm tính năng. Nên khoá vòi ở mã mới, trừ phần cũ còn bị sửa nhiều hay đọc dữ liệu không tin cậy với quyền cao."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>Rust, chạy ngay trong tiến trình hiện có</td><td>bỏ được ngôn ngữ không an toàn, nên quy tắc hai trên ba đã thoả; không tốn thêm tiến trình</td><td>cần người biết Rust; chỗ gọi xuống C++ phải bọc trong khối không an toàn và soát kỹ</td></tr>
          <tr><td>C++ trong hộp cát ít quyền</td><td>dùng được thư viện C++ sẵn có</td><td>thêm tiến trình, bộ nhớ, độ trễ; hộp cát không xoá lỗi</td></tr></table>
          <p class="note">Điều kiện đổi: đội chưa ai viết được Rust và hạn rất gấp — dùng hộp cát ít quyền trước, lên kế hoạch chuyển sau. Với cả hai, vẫn giữ kiểm thử dữ liệu ngẫu nhiên.</p>
        focus: ["1.2", "1.2", "1.3", 2]
        say: "Đáp án câu hai cũng là một đánh đổi, viết bằng ngôn ngữ mới thì bỏ được ngôn ngữ không an toàn, nên quy tắc hai trên ba đã thoả mà không tốn thêm tiến trình. Đổi lại cần người biết ngôn ngữ mới, và chỗ gọi xuống C cộng cộng phải bọc trong khối không an toàn, soát kỹ. Viết bằng C cộng cộng trong hộp cát thì dùng được thư viện sẵn có, nhưng tốn thêm tiến trình, bộ nhớ, độ trễ, và không xoá được lỗi. Chỉ khi đội chưa ai viết được ngôn ngữ mới và hạn rất gấp, thì dùng hộp cát trước, rồi lên kế hoạch chuyển sau."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">đếm nguyên nhân: khoảng 70%</span><span class="a">→</span>
          <span class="n">hộp cát có giá: mã mới đổi ngôn ngữ</span><span class="a">→</span>
          <span class="n">223 xuống 85</span><span class="a">→</span>
          <span class="n">lỗi vơi theo tuổi mã: 24%</span><span class="a">→</span>
          <span class="n">dưới 20%, vẫn nhiều lớp phòng</span></div>
        say: "Tổng kết lại, các đội đếm nguyên nhân gốc và thấy lỗi bộ nhớ chiếm khoảng 70% mỗi năm. Hộp cát có giá, nên mã mới được viết bằng ngôn ngữ an toàn. Số lỗi bộ nhớ của Android giảm từ 223 xuống 85, rồi tỉ lệ còn 24% khi mã cũ vơi lỗi theo tuổi. Năm 2025 tỉ lệ dưới 20%, mà các lớp phòng khác vẫn được giữ."
      - show: |
          <div class="box key"><b>Tư duy:</b> một loại lỗi lặp lại hơn mười năm là lỗi của <b>công cụ</b>, không phải của người. Hãy để ngôn ngữ và trình biên dịch chặn cả loại lỗi ở mã mới, và đo bằng số trước khi tin.</div>
        say: "Điều cần mang theo, một loại lỗi lặp lại suốt hơn mười năm là lỗi của công cụ, không phải của người. Hãy để ngôn ngữ và trình biên dịch chặn cả loại lỗi ấy ở mã mới, và đo bằng số trước khi tin."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá PLC. Từ chuỗi ký tự, qua từ tố, cây, kiểu, bộ nhớ, mã máy ảo và lập trình hàm, bạn đã thấy lựa chọn ngôn ngữ quyết định cả một loại lỗ hổng ở quy mô hàng chục triệu dòng mã.</p>
        say: "Đây là bài cuối của khoá ngôn ngữ lập trình và trình biên dịch. Bạn đã đi từ chuỗi ký tự, qua từ tố, cây, kiểu, bộ nhớ, mã máy ảo, tới lập trình hàm. Và bạn đã thấy lựa chọn ngôn ngữ quyết định cả một loại lỗ hổng, ở quy mô hàng chục triệu dòng mã. Cảm ơn bạn đã theo học."
