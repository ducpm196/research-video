        focus: ["1.2", "1.3", "1.4", "1.5", 2]
        say: "Năm 2024, đội chia cách chống lỗi bộ nhớ thành bốn thế hệ, thế hệ một là vá sau khi bị báo, chi phí lặp mãi. Thế hệ hai là các lớp giảm thiểu, như giá trị canh cạnh vùng nhớ để biết khi bị ghi đè, nhưng tốn hiệu năng, pin và bộ nhớ. Thế hệ ba là chủ động tìm lỗi bằng công cụ dò lỗi và dữ liệu thử ngẫu nhiên, nhưng chỉ chữa triệu chứng. Thế hệ bốn là phòng ngay từ gốc bằng ngôn ngữ an toàn, với điều kiện gọi qua lại an toàn giữa mã mới và mã cũ. Kết quả là thay đổi bằng ngôn ngữ mới bị gỡ lại vì gây sự cố, tức quay lui, chưa tới một nửa, và bỏ hộp cát thì một thành phần trình duyệt nhanh gấp 20 lần."

