id: L05
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 5 — Kiểu dữ liệu và kiểm tra kiểu: tĩnh, động, mạnh, yếu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L05; audit/plc/verify_plc.py L05; B. C. Pierce, Types and Programming Languages (2002), chương 1; ECMAScript 2023 Language Specification, mục 13.15.3 (phép + với chuỗi); CSA bài 3 (số dấu phẩy động)"
assumes: [arith]
# Quy ước: “kiểu tĩnh/động” = kiểm kiểu TRƯỚC khi chạy hay KHI chạy; “mạnh/yếu” = ngôn ngữ có tự đổi kiểu ngầm / cho đọc bit
#   của kiểu này như kiểu khác hay không — trục này không có định nghĩa chuẩn duy nhất, bài nói rõ là quy ước thường dùng.
#   Kết quả Python chạy thật trong checks; kết quả JavaScript chạy bằng Node trong audit/plc/verify_plc.py.
objectives:
  - "Phân biệt kiểm kiểu tĩnh và động"
  - "Phân biệt kiểu mạnh và yếu"
  - "Biết đây là hai trục khác nhau"
asr_reviewed:
  - {sentence: "Kết quả là 1065353216, dù chuẩn C không bảo đảm cách đọc này.", reason: "ASR chép “Kết quả là 106535216, dù chuẩn xe không bảo đảm cách độc này.” (0.737): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: không (trong “tỉ không” → “”), triệu ba trăm năm mươi ba/∅, đọc/độc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Y là mạnh hay yếu ở phép này?", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“3” + 1 bằng mấy?"
    checks:
      - "alg.py_add_error('3', 1) == 'TypeError' and alg.py_add_error('3', '1') == '31'"
    steps:
      - show: |
          <table class="t"><tr><th>ngôn ngữ</th><th>mã</th><th>kết quả</th></tr>
          <tr><td>Java</td><td><code>int x = "3" + 1;</code></td><td>lỗi biên dịch: chuỗi không gán được vào biến số nguyên (riêng phép <code>"3" + 1</code> thì Java vẫn ghép ra chuỗi <code>"31"</code>)</td></tr>
          <tr><td>Python</td><td><code>x = "3" + 1</code></td><td>chạy tới dòng đó thì báo lỗi kiểu</td></tr>
          <tr><td>JavaScript</td><td><code>x = "3" + 1</code></td><td>ra chuỗi <code>"31"</code></td></tr></table>
          <div class="box key">Hôm nay: hai câu hỏi <b>khác nhau</b> về kiểu — kiểm <b>lúc nào</b> (tĩnh hay động), và có <b>tự đổi kiểu ngầm</b> không (mạnh hay yếu).</div>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Chào bạn, chuỗi 3 cộng số 1 bằng mấy? Một ngôn ngữ kiểm kiểu trước khi chạy sẽ từ chối khi ta gán kết quả vào biến số nguyên, dù riêng phép cộng thì nó vẫn ghép ra chuỗi 31. Một ngôn ngữ khác chạy tới dòng đó mới báo lỗi kiểu. Một ngôn ngữ thứ ba lặng lẽ ghép thành chuỗi 31. Hôm nay ta tách hai câu hỏi khác nhau về kiểu, kiểm lúc nào, và có tự đổi kiểu ngầm hay không."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cùng dấu cộng, cùng dãy bit, nghĩa khác nhau"
    checks:
      - "3 + 1 == 4 and '3' + '1' == '31'"
      - "__import__('struct').unpack('<f', __import__('struct').pack('<I', 1065353216))[0] == 1.0 and 127 * 2 ** 23 == 1065353216"
      - "(lambda b: (b >> 31, (b >> 23) & 0xFF, b & 0x7FFFFF))(__import__('struct').unpack('<I', __import__('struct').pack('<f', 1.0))[0]) == (0, 127, 0) and 0 + 127 == 127 == 0b01111111 and (1 + 0) * 2 ** 0 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>hai giá trị</th><th>phép <code>+</code> làm gì</th><th>kết quả</th></tr>
          <tr><td>số 3 và số 1</td><td>cộng số</td><td>4</td></tr>
          <tr><td>chuỗi "3" và chuỗi "1"</td><td>ghép chuỗi</td><td>"31"</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, cùng một dấu cộng nhưng làm việc khác nhau tuỳ hai giá trị đứng hai bên. Với số 3 và số 1, dấu cộng là phép cộng số, ra 4. Với chuỗi 3 và chuỗi 1, dấu cộng là phép ghép chuỗi, ra chuỗi 31."
      - clear: true
        show: |
          <p>Máy cất một số thực 32 bit (32 chữ số 0 và 1) giống cách viết khoa học, nhưng trong hệ hai: $(1 + f) \times 2^{e}$, với phần lẻ $f$ từ 0 tới dưới 1.</p>
          <table class="t"><tr><th>trường</th><th>số bit</th><th>cất gì</th></tr>
          <tr><td>dấu</td><td>1</td><td>0 là số dương, 1 là số âm</td></tr>
          <tr><td>mũ</td><td>8</td><td>$e + 127$ — cộng 127 để mũ âm vẫn cất được bằng số không âm</td></tr>
          <tr><td>phần lẻ</td><td>23</td><td>$f$ — số 1 đứng đầu luôn có nên không cất</td></tr></table>
        introduces: [power]
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Điều thứ hai là cách máy cất một số thực 32 bit, tức một dãy 32 chữ số không và một. Nó giống cách viết khoa học nhưng trong hệ hai, số được viết thành 1 cộng phần lẻ, rồi nhân 2 mũ e. Bit đầu là bit dấu, bằng 0 thì số dương. Tám bit tiếp theo cất mũ e cộng thêm 127, để mũ âm vẫn cất được bằng một số không âm. Hai mươi ba bit cuối cất phần lẻ, còn số 1 đứng đầu luôn có mặt nên không cần cất."
      - show: |
          <p>Số $1{,}0 = (1 + 0) \times 2^{0}$: dấu 0, mũ cất $0 + 127 = 127$, phần lẻ toàn bit 0. Trường mũ nằm ngay trên 23 bit phần lẻ, nên khi đọc cả 32 bit như số nguyên, giá trị của nó được nhân với $2^{23}$:</p>
          <table class="t"><tr><th>cùng 32 bit</th><th>đọc như số thực</th><th>đọc như số nguyên</th></tr>
          <tr><td><code>0 01111111 000…0</code></td><td>1,0</td><td>$127 \times 2^{23} = \hl{1065353216}$</td></tr></table>
        focus: [1, 1, "2.2", "2.2"]
        say: "Áp dụng cho số 1 phẩy 0, ta viết nó thành 1 cộng 0, nhân 2 mũ 0, nên bit dấu là 0, mũ cất 0 cộng 127 bằng 127, phần lẻ toàn bit 0. Trường mũ nằm ngay phía trên 23 bit phần lẻ, nên khi đọc cả 32 bit như một số nguyên, giá trị 127 của nó được nhân với 2 mũ 23. Cùng 32 bit đó, đọc như số thực thì được 1 phẩy 0. Đọc như số nguyên thì được 127 nhân 2 mũ 23, tức là 1065353216, và kiểu chính là thứ quyết định ta đọc theo cách nào."

  - id: sym
    kind: symbol
    title: "Giải mã: hai trục"
    steps:
      - show: |
          <p><b>Kiểu</b> của một giá trị cho biết phép nào dùng được với nó và các bit của nó mang nghĩa gì.</p>
          <p><b>Tĩnh / động</b> — kiểm kiểu <b>lúc nào</b>: tĩnh là trước khi chạy (pha ngữ nghĩa, bài 0); động là khi chạy, ngay trước mỗi phép.</p>
          <p><b>Mạnh / yếu</b> — có <b>lặng lẽ</b> đổi kiểu hay cho dùng bit của kiểu này như kiểu khác không. Mạnh: báo lỗi. Yếu: tự đổi và chạy tiếp.</p>
          <p class="note">“Mạnh/yếu” không có một định nghĩa chuẩn duy nhất; đây là cách hiểu thường dùng.</p>
        focus: [1, 2, 2, 3, 3, 3, 4]
        say: "Kiểu của một giá trị cho biết phép nào dùng được với nó và các bit của nó mang nghĩa gì. Trục thứ nhất là tĩnh hay động, tức kiểm kiểu lúc nào. Tĩnh là kiểm trước khi chạy, ở pha ngữ nghĩa như bài 0, còn động là kiểm khi chạy, ngay trước mỗi phép. Trục thứ hai là mạnh hay yếu, tức ngôn ngữ có lặng lẽ đổi kiểu, hay cho dùng bit của kiểu này như kiểu khác hay không. Mạnh thì báo lỗi. Yếu thì tự đổi và chạy tiếp. Trục này không có một định nghĩa chuẩn duy nhất, đây là cách hiểu thường dùng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: hai trục vuông góc, bốn ô"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><g font-size="25" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="600" y="45" fill="#2a78d6">kiểm TRƯỚC khi chạy (tĩnh)</text><text x="1150" y="45" fill="#eb6834">kiểm KHI chạy (động)</text><text x="165" y="145">mạnh:</text><text x="165" y="335">yếu:</text></g><g font-size="22" text-anchor="middle" fill="#1f2937"><text x="165" y="180">không đổi kiểu ngầm</text><text x="165" y="370">tự đổi kiểu, đọc bit</text></g><g stroke="#1f2937" stroke-width="3"><rect x="330" y="70" width="540" height="170" rx="14" fill="#dbeafe"/><rect x="880" y="70" width="540" height="170" rx="14" fill="#dcfce7"/><rect x="330" y="255" width="540" height="170" rx="14" fill="#fef3c7"/><rect x="880" y="255" width="540" height="170" rx="14" fill="#fee2e2"/></g><g font-size="24" text-anchor="middle" fill="#1f2937"><text x="600" y="145">kiểu không khớp</text><text x="600" y="185">→ chặn trước khi chạy</text><text x="1150" y="145">chạy tới phép sai</text><text x="1150" y="185">→ mới báo lỗi kiểu</text><text x="600" y="330">bit của số thực 1,0</text><text x="600" y="370">→ đọc như số nguyên</text><text x="1150" y="330">chuỗi "3" cộng số 1</text><text x="1150" y="370">→ lặng lẽ ra chuỗi "31"</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ hai trục thành một bảng bốn ô. Chiều ngang hỏi kiểm kiểu lúc nào, cột trái kiểm trước khi chạy, cột phải kiểm khi đang chạy. Chiều dọc hỏi có tự đổi kiểu ngầm hay không, hàng trên là mạnh, hàng dưới là yếu. Ô nào cũng có ngôn ngữ thật nằm trong, nên biết một trục không cho ta biết trục kia."

  - id: example
    kind: example
    title: "Bốn ô của hai trục"
    checks:
      - "__import__('struct').unpack('<I', __import__('struct').pack('<f', 1.0))[0] == 1065353216 == 0x3F800000"
    steps:
      - show: |
          <p><b>Bước một — ô tĩnh và mạnh</b> (Java, Rust, Haskell): kiểm trước khi chạy và báo lỗi khi kiểu không khớp; chương trình sai kiểu không được dịch.</p>
          <p class="note">Mạnh hay yếu xét theo <b>từng phép</b>: Java vẫn tự đổi số thành chuỗi khi một vế của <code>+</code> là chuỗi (<code>"3" + 1</code> → <code>"31"</code>), nhưng không tự đổi chuỗi thành số — <code>"3" * 2</code> và <code>"5" - 2</code> là lỗi biên dịch.</p>
        focus: [1, 1, 2, 2]
        say: "Bước một, ô tĩnh và mạnh. Các ngôn ngữ ở ô này kiểm kiểu trước khi chạy và báo lỗi khi kiểu không khớp, nên một chương trình sai kiểu không được dịch thành mã chạy. Mạnh hay yếu thường được xét theo từng phép, vì ngôn ngữ đầu tiên ở phần mở đầu vẫn tự đổi số thành chuỗi khi ghép với một chuỗi, ra chuỗi 31. Nhưng nó không bao giờ tự đổi chuỗi thành số, nên chuỗi 3 nhân 2, hay chuỗi 5 trừ 2, đều bị báo lỗi khi biên dịch."
      - show: |
          <table class="t"><tr><th>Bước 2 — ô tĩnh và yếu (C)</th><th>giá trị</th></tr>
          <tr><td>số thực <code>1.0f</code>, ép con trỏ, đọc 32 bit như số nguyên (chuẩn C không bảo đảm kết quả cách đọc này, nhưng trình biên dịch vẫn dịch)</td><td>$\hl{1065353216}$</td></tr>
          <tr><td>viết ở hệ mười sáu (chữ số 0 tới 9, rồi A tới F là 10 tới 15)</td><td><code>0x3F800000</code></td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Bước hai, ô tĩnh và yếu. Ngôn ngữ C kiểm kiểu trước khi chạy, nhưng vẫn cho ép con trỏ, tức đổi kiểu của địa chỉ, để đọc 32 bit của số 1 phẩy 0 như số nguyên. Kết quả là 1065353216, dù chuẩn C không bảo đảm cách đọc này. Viết ở hệ mười sáu, với các chữ A tới F chỉ 10 tới 15, đó là 3 F 8 0 0 0 0 0, đúng dãy bit ta vừa ôn ở phần chuẩn bị."
      - show: |
          <div class="code"><div>x = "3" + 1      <span class="cm"># chạy tới dòng này mới báo lỗi kiểu</span></div><div>x = "3" + str(1) <span class="cm"># đổi kiểu tường minh → "31"</span></div></div>
          <p><b>Bước 3 — ô động và mạnh</b>: kiểm khi chạy, ngay trước phép cộng, và không tự đổi kiểu.</p>
        focus: [1, 1, 2]
        say: "Bước ba, ô động và mạnh. Một ngôn ngữ ở ô này chỉ báo lỗi khi chạy tới đúng dòng chuỗi cộng số. Muốn ra chuỗi 31 thì người viết phải tự đổi số 1 thành chuỗi một cách tường minh."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 4</th><th>mạnh</th><th>yếu</th></tr>
          <tr><td><b>tĩnh</b></td><td>Java, Rust, Haskell</td><td>C: bit của <code>1.0f</code> đọc như số nguyên → <code>1065353216</code></td></tr>
          <tr><td><b>động</b></td><td>Python: <code>"3" + 1</code> lỗi khi chạy</td><td>JavaScript: <code>"3" + 1</code> → <code>"31"</code>, <code>"3" * 2</code> → <code>6</code></td></tr></table>
          <div class="box key">Hai trục <b>độc lập</b>: C kiểm tĩnh nhưng cho đọc bit tuỳ ý; Python kiểm động nhưng không tự đổi chuỗi thành số.</div>
        focus: [1, "1.3", "1.3", 2]
        say: "Bước bốn, ô động và yếu, rồi đặt cả bốn ô cạnh nhau. Ở ô này, một ngôn ngữ lặng lẽ ghép chuỗi 3 với số 1 thành chuỗi 31. Nó còn đổi chuỗi 3 thành số khi gặp phép nhân, nên chuỗi 3 nhân 2 ra số 6. Hai trục độc lập với nhau, C kiểm tĩnh nhưng cho đọc bit tuỳ ý, còn có ngôn ngữ kiểm động mà không bao giờ tự đổi chuỗi thành số."

  - id: check
    kind: check
    title: "Tự kiểm: tính dãy bit bằng tay và chạy thật"
    checks:
      - "127 * 2 ** 23 == 1065353216 == 3 * 16 ** 7 + 15 * 16 ** 6 + 8 * 16 ** 5"
      - "alg.py_add_error('3', 1) == 'TypeError' and '3' + str(1) == '31'"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>từ ba trường: mũ lưu 127, dịch trái 23 bit</td><td>$127 \times 2^{23}$</td><td>1065353216 ✓</td></tr>
          <tr><td>từ hệ mười sáu <code>3F800000</code></td><td>$3 \times 16^7 + 15 \times 16^6 + 8 \times 16^5$</td><td>1065353216 ✓</td></tr>
          <tr><td>chạy thật <code>"3" + 1</code> rồi <code>"3" + str(1)</code></td><td>—</td><td>lỗi kiểu, rồi <code>"31"</code> ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, thay vì tin máy in ra, ta tính lại bằng tay. Từ ba trường, phần mũ lưu 127, đặt sau 23 bit phần lẻ, nên số nguyên là 127 nhân 2 mũ 23, bằng 1065353216. Từ chữ số hệ mười sáu, 3 nhân 16 mũ 7, cộng 15 nhân 16 mũ 6, cộng 8 nhân 16 mũ 5, cũng ra đúng số đó. Chạy thật phép chuỗi cộng số thì báo lỗi kiểu, còn đổi tường minh thì ra chuỗi 31, khớp ô động và mạnh."

  # ───────────────────────── 4. ĐÁNH ĐỔI ─────────────────────────
  - id: tradeoff
    kind: concept
    title: "Tĩnh hay động: bắt lỗi sớm hay viết nhanh"
    steps:
      - show: |
          <div class="code"><div>def bao_cao(x):</div><div>    if x &lt; 0:</div><div>        return "âm: " + x     <span class="cm"># lỗi kiểu nếu ngôn ngữ cấm chuỗi + số</span></div><div>    return "ok"</div></div>
          <p>Kiểm động: nhánh <code>x &lt; 0</code> hiếm khi chạy → lỗi nằm im tới ngày có số âm. Kiểm tĩnh: báo ngay khi biên dịch, dù nhánh chưa từng chạy.</p>
          <div class="box key">Kiểm tĩnh bắt lỗi trên <b>mọi</b> nhánh trước khi chạy; kiểm động chỉ bắt trên nhánh <b>đã chạy</b> — nên cần kiểm thử phủ nhánh.</div>
        focus: [1, 2, 2, 3]
        say: "Xét hàm báo cáo này, nếu x âm thì ghép chữ âm với x, và ở ngôn ngữ cấm cộng chuỗi với số thì đây là lỗi kiểu. Với kiểm động, nhánh x âm hiếm khi chạy, nên lỗi nằm im tới ngày có số âm. Với kiểm tĩnh, lỗi được báo ngay khi biên dịch, dù nhánh đó chưa từng chạy. Kiểm tĩnh bắt lỗi trên mọi nhánh trước khi chạy, còn kiểm động chỉ bắt trên nhánh đã chạy, nên cần kiểm thử phủ mọi nhánh."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "'3' + str(1) == '31'"
      - "max(['9', '10', '100']) == '9' and sorted(['9', '10', '100']) == ['10', '100', '9'] and max(int(s) for s in ['9', '10', '100']) == 100"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đồng nhất “tĩnh” với “mạnh” <b class="red">(sai)</b>
          <br><span class="note">Hai trục khác nhau: C tĩnh mà yếu; Python động mà mạnh.</span></div>
        say: "Lỗi thứ nhất, đồng nhất tĩnh với mạnh. Đó là hai trục khác nhau, C kiểm tĩnh mà yếu, còn có ngôn ngữ kiểm động mà mạnh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ ngôn ngữ kiểm động “không có kiểu” <b class="red">(sai)</b>
          <br><span class="note">Giá trị vẫn mang kiểu; chỉ là <b>biến</b> không bị gắn cố định một kiểu, và kiểm diễn ra khi chạy.</span></div>
        say: "Lỗi thứ hai, nghĩ ngôn ngữ kiểm động thì không có kiểu. Giá trị vẫn mang kiểu, chỉ là biến không bị gắn cố định một kiểu, và việc kiểm diễn ra khi chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin vào chú thích kiểu như một lớp kiểm tra khi chạy <b class="red">(sai)</b>
          <br><span class="note">Chú thích kiểu trong Python (<code>x: int</code>) không được kiểm khi chạy; phải chạy một công cụ kiểm tĩnh riêng. Muốn chắc thì đổi kiểu <b>tường minh</b>, như <code>"3" + str(1)</code>.</span></div>
        say: "Lỗi thứ ba, tin vào chú thích kiểu như một lớp kiểm tra khi chạy. Ở một số ngôn ngữ, chú thích kiểu không được kiểm khi chạy, phải chạy một công cụ kiểm tĩnh riêng. Muốn chắc chắn thì đổi kiểu một cách tường minh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tin kiểu mạnh sẽ bắt hết: số đọc từ tệp hay biểu mẫu vẫn là <b>chuỗi</b>, mà chuỗi so với chuỗi thì không có lỗi kiểu nào.</div>
          <table class="t"><tr><th>dữ liệu đọc vào: "9", "10", "100"</th><th>so như chuỗi</th><th>so như số</th></tr>
          <tr><td>lớn nhất</td><td><b class="red">"9"</b></td><td>100</td></tr>
          <tr><td>sắp xếp tăng dần</td><td><b class="red">"10", "100", "9"</b></td><td>9, 10, 100</td></tr></table>
          <p class="note">Người có kinh nghiệm đổi kiểu ngay ở <b>chỗ dữ liệu đi vào</b> và báo lỗi tại đó nếu không đổi được.</p>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tin rằng kiểu mạnh sẽ bắt hết mọi lỗi. Số đọc từ tệp hay từ biểu mẫu thật ra vẫn là chuỗi, và so chuỗi với chuỗi thì không có lỗi kiểu nào để báo. So như chuỗi, máy so từng ký tự từ trái sang, nên chuỗi 9 lớn hơn chuỗi 100, trong khi so như số thì lớn nhất là 100. Sắp xếp như chuỗi cho 10, 100, rồi 9, sai hẳn thứ tự số. Người có kinh nghiệm đổi kiểu ngay ở chỗ dữ liệu đi vào, và báo lỗi tại đó nếu không đổi được."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ngôn ngữ X báo lỗi “không cộng được chuỗi với số” ngay khi biên dịch, kể cả ở nhánh chưa chạy. X tĩnh hay động?</td></tr>
          <tr><td>2</td><td>Ngôn ngữ Y chạy <code>"5" - 2</code> ra <code>3</code> mà không báo gì. Y mạnh hay yếu ở phép này?</td></tr>
          <tr><td>3</td><td>Ngôn ngữ Z chỉ báo lỗi kiểu khi chạy tới dòng sai, và không tự đổi kiểu. Ô nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ngôn ngữ X báo lỗi không cộng được chuỗi với số ngay khi biên dịch, kể cả ở nhánh chưa chạy. X là tĩnh hay động? Câu hai, ngôn ngữ Y chạy chuỗi 5 trừ số 2 ra 3 mà không báo gì. Y là mạnh hay yếu ở phép này? Câu ba, ngôn ngữ Z chỉ báo lỗi kiểu khi chạy tới dòng sai, và không tự đổi kiểu. Z nằm ở ô nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>dấu hiệu</th><th>suy ra</th></tr>
          <tr><td>1</td><td>báo lỗi khi biên dịch, cả ở nhánh <b>chưa chạy</b></td><td>chỉ kiểm trước khi chạy mới làm được → <b>tĩnh</b></td></tr>
          <tr><td>2</td><td>chuỗi <code>"5"</code> trừ số 2 ra số 3</td><td>đã tự đổi <code>"5"</code> thành số 5, rồi $5 - 2 = 3$ → <b>yếu</b></td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Đáp án câu một, giải từng bước. X báo lỗi cả ở nhánh chưa từng chạy. Chỉ có kiểm trước khi chạy mới nhìn thấy nhánh chưa chạy, nên X kiểm tĩnh. Câu hai, chuỗi 5 trừ số 2 ra số 3, nghĩa là Y đã lặng lẽ đổi chuỗi 5 thành số 5 rồi mới trừ. Tự đổi kiểu ngầm như vậy là yếu, ít nhất ở phép này."
      - show: |
          <table class="t"><tr><th>câu 3</th><th>trục</th><th>kết luận</th></tr>
          <tr><td>chỉ báo lỗi khi chạy tới dòng sai</td><td>kiểm lúc nào</td><td>động</td></tr>
          <tr><td>không tự đổi kiểu</td><td>đổi ngầm không</td><td>mạnh</td></tr>
          <tr><td colspan="2">ghép hai trục</td><td>$\hl{\text{ô động và mạnh}}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu ba, xét từng trục một. Z chỉ báo lỗi khi chạy tới dòng sai, nên trên trục kiểm lúc nào, Z là động. Z không tự đổi kiểu, nên trên trục đổi ngầm, Z là mạnh. Ghép hai trục lại, Z nằm ở ô động và mạnh."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">kiểu: phép nào dùng được</span><span class="a">→</span>
          <span class="n">tĩnh / động: kiểm lúc nào</span><span class="a">→</span>
          <span class="n">mạnh / yếu: có đổi ngầm không</span><span class="a">→</span>
          <span class="n">hai trục độc lập</span></div>
        say: "Tổng kết lại, kiểu cho biết phép nào dùng được. Tĩnh hay động là kiểm lúc nào, mạnh hay yếu là có đổi kiểu ngầm hay không, và đó là hai trục độc lập."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi hai khái niệm hay bị gộp làm một, hãy tìm ví dụ cho từng ô của bảng hai chiều — nếu ô nào cũng có ví dụ, chúng thật sự độc lập.</div>
        say: "Điều cần mang theo, khi hai khái niệm hay bị gộp làm một, hãy tìm ví dụ cho từng ô của bảng hai chiều. Nếu ô nào cũng có ví dụ, chúng thật sự độc lập."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): máy tự đoán kiểu — <b>suy luận kiểu và hợp nhất</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta xem máy tự đoán kiểu như thế nào, với suy luận kiểu và hợp nhất. Hẹn gặp bạn ở bài tiếp theo."
