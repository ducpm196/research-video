id: L04
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 4 — Phạm vi và liên kết tên: tĩnh và động"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L04; audit/plc/verify_plc.py L04; H. Abelson, G. J. Sussman, Structure and Interpretation of Computer Programs, 2nd ed. (1996), mục 3.2; M. L. Scott, Programming Language Pragmatics, 4th ed. (2015), mục 3.3"
assumes: [arith]
# Quy ước: mã minh hoạ kiểu Python (def, return); “môi trường” = bảng tên → biến, mỗi lời gọi hàm tạo một môi trường mới trỏ lên
#   môi trường cha. Phạm vi tĩnh: cha = môi trường nơi hàm được ĐỊNH NGHĨA; phạm vi động: cha = môi trường của nơi GỌI.
#   Kết quả chạy bằng trình thông dịch tí hon alg.scope_lookup và mã Python thật (alg.shadow_late, alg.unbound_local) trong checks.
objectives:
  - "Hiểu môi trường và chuỗi tra tên"
  - "Phân biệt phạm vi tĩnh và phạm vi động"
  - "Biết phạm vi tĩnh chọn biến, không chụp giá trị"
asr_reviewed:
  - {sentence: "Khi g gọi f, chồng lời gọi có thêm f ở trên cùng.", reason: "ASR chép “Khi ve gọi F, chồng lời gọi có thêm F ở trên cùng.” (0.923): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàm f chỉ làm một việc là trả về giá trị của x.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Lỗi thứ nhất, nghĩ phạm vi tĩnh nhớ giá trị lúc định nghĩa.", reason: "ASR chép “nghỉ phạm vì tỉnh nhớ giá trị lúc định nghĩa”: nghĩ/nghỉ, vi/vì, tĩnh/tỉnh chỉ lệch thanh; cụm “phạm vi tĩnh” ở các câu khác của bài chép đúng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một hàm, hai câu trả lời"
    checks:
      - "(alg.scope_lookup('static'), alg.scope_lookup('dynamic')) == (1, 2)"
    steps:
      - show: |
          <div class="code"><div>x = 1</div><div>def f(): return x</div><div>def g():</div><div>    x = 2        <span class="cm"># biến cục bộ của g</span></div><div>    return f()</div><div>g()</div></div>
          <p><code>g()</code> trả 1 hay 2? Tuỳ <b>luật phạm vi</b> của ngôn ngữ: phạm vi tĩnh → $\hl{1}$, phạm vi động → $\hl{2}$.</p>
        focus: [1, 1, 1, 2, 2, 2]
        say: "Chào bạn, biến x toàn cục được gán bằng 1. Hàm f chỉ làm một việc là trả về giá trị của x. Hàm g đặt một biến cục bộ x bằng 2 rồi gọi f. Vậy g trả về 1 hay 2? Câu trả lời tuỳ vào luật phạm vi của ngôn ngữ, phạm vi tĩnh cho 1, phạm vi động cho 2. Hôm nay ta học hai luật này."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: biến cục bộ, biến toàn cục và lời gọi lồng nhau"
    checks:
      - "(lambda d: exec('x = 1\\ndef h():\\n    x = 3\\n    return x\\nr = h()\\n', d) or (d['r'], d['x']) == (3, 1))({})"
      - "(lambda d: exec('import inspect\\ndef f():\\n    return [fr.function for fr in inspect.stack()[:3]]\\ndef g():\\n    return f()\\nr = g()\\n', d) or d['r'] == ['f', 'g', '<module>'])({})"
    steps:
      - show: |
          <div class="code"><div>x = 1</div><div>def h():</div><div>    x = 3        <span class="cm"># biến cục bộ của h</span></div><div>    return x</div><div>h()             <span class="cm"># trả 3; x toàn cục vẫn là 1</span></div></div>
          <p>Biến gán <b>bên trong</b> hàm là biến <b>cục bộ</b>: chỉ sống trong lần gọi đó. Biến gán ở ngoài mọi hàm là biến <b>toàn cục</b>.</p>
        focus: [1, 1, 2, 2]
        say: "Trước hết, ôn lại hai loại biến mà bài này dùng suốt. Biến x gán bằng 1 ở ngoài mọi hàm là biến toàn cục. Hàm h gán x bằng 3 ở bên trong, đó là một biến cục bộ khác, chỉ sống trong lần gọi h, nên h trả về 3. Sau khi gọi xong, x toàn cục vẫn là 1, vì phép gán trong h không chạm tới nó."
      - show: |
          <table class="t"><tr><th>lúc đang chạy</th><th>các lời gọi đang mở (dưới cùng là cũ nhất)</th></tr>
          <tr><td>mã ngoài cùng gọi <code>g()</code></td><td>toàn cục → g</td></tr>
          <tr><td>g gọi <code>f()</code></td><td>toàn cục → g → $\hl{\text{f}}$</td></tr>
          <tr><td>f trả về</td><td>toàn cục → g (f bị gỡ ra)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Điều thứ hai là lời gọi lồng nhau, các lời gọi đang mở xếp chồng lên nhau như một ngăn xếp. Mã ngoài cùng gọi g, lúc đó đang mở toàn cục và g. Khi g gọi f, chồng lời gọi có thêm f ở trên cùng. Khi f trả về, f được gỡ ra và ta quay lại g, đúng thứ tự vào sau ra trước."

  - id: sym
    kind: symbol
    title: "Giải mã: môi trường và chuỗi tra tên"
    steps:
      - show: |
          <p><b>Liên kết</b>: cặp tên ↦ biến. <b>Môi trường</b>: bảng các liên kết. Mỗi lời gọi hàm tạo một môi trường mới, trỏ lên một môi trường <b>cha</b>.</p>
          <p>Tra một tên: tìm trong môi trường hiện tại; không có thì lên cha; cứ thế tới toàn cục.</p>
          <div class="box key">Hai luật chỉ khác ở <b>cha là ai</b>. Phạm vi tĩnh: cha là môi trường nơi hàm được <b>viết ra</b>. Phạm vi động: cha là môi trường của <b>nơi gọi</b>.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Một liên kết là một cặp tên và biến. Một môi trường là bảng các liên kết, và mỗi lời gọi hàm tạo một môi trường mới, trỏ lên một môi trường cha. Để tra một tên, ta tìm trong môi trường hiện tại, không có thì lên cha, cứ thế tới môi trường toàn cục. Hai luật phạm vi chỉ khác nhau ở chỗ cha là ai. Phạm vi tĩnh lấy cha là môi trường nơi hàm được viết ra, còn phạm vi động lấy cha là môi trường của nơi gọi."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: mỗi môi trường là một hộp có mũi tên lên cha"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arP4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arP4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arP4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="560" y="20" width="380" height="120" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="750" y="62" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">toàn cục</text><text x="750" y="108" font-size="26" text-anchor="middle" fill="#1f2937">x ↦ 1</text><rect x="120" y="270" width="340" height="120" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="290" y="312" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">môi trường của g</text><text x="290" y="358" font-size="26" text-anchor="middle" fill="#1f2937">x ↦ 2</text><rect x="1040" y="270" width="340" height="120" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="1210" y="312" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">môi trường của f</text><text x="1210" y="358" font-size="26" text-anchor="middle" fill="#1f2937">(không có x)</text><line x1="290" y1="268" x2="600" y2="144" stroke="#1f2937" stroke-width="3" marker-end="url(#arP4)"/><line x1="1150" y1="268" x2="900" y2="144" stroke="#2a78d6" stroke-width="5" marker-end="url(#arP4b)"/><line x1="1036" y1="330" x2="466" y2="330" stroke="#eb6834" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arP4o)"/><g font-size="24" text-anchor="middle"><text x="1250" y="200" fill="#2a78d6" font-weight="bold">tĩnh: cha = nơi viết f → 1</text><text x="750" y="310" fill="#eb6834" font-weight="bold">động: cha = nơi gọi f → 2</text><text x="330" y="200" fill="#1f2937">cha của g</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ ba môi trường thành ba hộp, hộp toàn cục ở trên chứa x bằng 1, hộp của g chứa x bằng 2, còn hộp của f không có x nào. Mũi tên từ g lên toàn cục là cha của g, cả hai luật đều đồng ý chỗ này. Với phạm vi tĩnh, f trỏ thẳng lên toàn cục, nơi f được viết, theo mũi tên xanh, nên tìm được 1. Với phạm vi động, f trỏ sang hộp của g, nơi đang gọi f, theo mũi tên cam đứt nét, nên tìm được 2."

  - id: example
    kind: example
    title: "Lần theo hai luật"
    checks:
      - "alg.scope_lookup('static') == 1 and alg.scope_lookup('dynamic') == 2"
    steps:
      - show: |
          <p><b>Bước một — gọi <code>g()</code>:</b> tạo môi trường của g chứa <code>x ↦ 2</code>, cha là toàn cục. Hai luật giống nhau ở bước này.</p>
        say: "Bước một, mã ngoài cùng gọi g. Lời gọi này tạo môi trường của g, chứa x bằng 2, với cha là môi trường toàn cục. Ở bước này hai luật phạm vi hoàn toàn giống nhau, vì g được viết ở toàn cục và cũng được gọi từ toàn cục."
      - show: |
          <table class="t"><tr><th>Bước 2 — g gọi <code>f()</code></th><th>cha của môi trường f</th></tr>
          <tr><td>phạm vi tĩnh</td><td><b>toàn cục</b> (f được viết ở đó)</td></tr>
          <tr><td>phạm vi động</td><td><b>môi trường của g</b> (g đang gọi f)</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, g gọi f, tạo môi trường của f, và đây là chỗ hai luật tách nhau. Với phạm vi tĩnh, cha của f là toàn cục, vì f được viết ở đó. Với phạm vi động, cha của f là môi trường của g, vì g là nơi đang gọi f."
      - show: |
          <p><b>Bước 3 — f tra <code>x</code>, phạm vi tĩnh:</b> môi trường f không có x → lên cha là toàn cục → $x = \hl{1}$.</p>
        say: "Bước ba, f tra tên x theo phạm vi tĩnh. Môi trường của f không có x, nên ta lên cha là toàn cục, ở đó x bằng 1. Vậy theo phạm vi tĩnh, f trả 1 và g cũng trả 1."
      - show: |
          <p><b>Bước 4 — f tra <code>x</code>, phạm vi động:</b> môi trường f không có x → lên cha là môi trường của g → $x = \hl{2}$.</p>
          <div class="box key">Phạm vi tĩnh: đọc mã là biết tên trỏ tới đâu. Hầu hết ngôn ngữ hiện đại dùng phạm vi tĩnh.</div>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, f tra tên x theo phạm vi động. Môi trường của f vẫn không có x, nhưng lần này cha là môi trường của g, ở đó x bằng 2. Phạm vi tĩnh có ưu điểm là chỉ cần đọc mã là biết tên trỏ tới đâu. Vì thế hầu hết ngôn ngữ hiện đại dùng phạm vi tĩnh."

  - id: check
    kind: check
    title: "Tự kiểm: chạy mã thật và đổi số"
    checks:
      - "(lambda d: exec('x = 1\\ndef f(): return x\\ndef g():\\n    x = 2\\n    return f()\\nr = g()\\n', d) or d['r'] == 1)({})"
      - "[(alg.scope_lookup('static', gx, lx), alg.scope_lookup('dynamic', gx, lx)) for gx, lx in ((1, 2), (3, 9), (4, 4))] == [(1, 2), (3, 9), (4, 4)]"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>x toàn cục</th><th>x của g</th><th>tĩnh</th><th>động</th></tr>
          <tr><td>chạy mã thật (ngôn ngữ dùng phạm vi tĩnh)</td><td>1</td><td>2</td><td>1 ✓</td><td>—</td></tr>
          <tr><td>trình thông dịch tí hon, đổi số</td><td>3</td><td>9</td><td>3</td><td>9</td></tr>
          <tr><td>hai số bằng nhau</td><td>4</td><td>4</td><td>4</td><td>4</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, thay vì lần tay, ta cho máy chạy. Chạy đoạn mã thật trong một ngôn ngữ dùng phạm vi tĩnh, g trả về 1, khớp bước ba. Đổi số trong trình thông dịch tí hon, x toàn cục bằng 3 và x của g bằng 9, thì tĩnh cho 3 còn động cho 9. Đúng quy luật, phạm vi tĩnh lấy số toàn cục, phạm vi động lấy số của g. Khi hai số bằng nhau, cả hai luật cho cùng một kết quả, nên muốn phân biệt hai luật thì phải chọn hai số khác nhau."

  # ───────────────────────── 4. CHỌN BIẾN ─────────────────────────
  - id: late
    kind: concept
    title: "Phạm vi tĩnh chọn biến, không chụp giá trị"
    checks:
      - "alg.shadow_late() == 21"
    steps:
      - show: |
          <div class="code"><div>def outer():</div><div>    y = 10</div><div>    def inner(): return y + 1</div><div>    y = 20</div><div>    return inner()</div></div>
          <p>Phạm vi tĩnh nói <code>y</code> trong <code>inner</code> là <b>biến</b> <code>y</code> của <code>outer</code>. Lúc gọi, biến đó đang là 20 → kết quả $\hl{21}$, không phải 11.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Xét thêm một ví dụ. Hàm ngoài đặt y bằng 10, định nghĩa hàm trong trả về y cộng 1, rồi đổi y thành 20 và gọi hàm trong. Phạm vi tĩnh nói rằng y trong hàm trong là biến y của hàm ngoài. Nó chọn biến chứ không chụp giá trị lúc viết. Lúc gọi, biến đó đang là 20, nên kết quả là 21, không phải 11."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "alg.unbound_local() == 'UnboundLocalError'"
      - "(lambda d: exec('thue = 0.1\\ndef gia(x): return round(x * (1 + thue))\\nb1 = gia(100)\\nthue = 0.2\\nb2 = gia(100)\\n', d) or (d['b1'], d['b2']) == (110, 120))({})"
      - "(lambda d: exec('def gia(x, thue=0.1): return round(x * (1 + thue))\\nthue = 0.2\\nr = gia(100)\\n', d) or d['r'] == 110)({})"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ phạm vi tĩnh “nhớ giá trị lúc định nghĩa” <b class="red">(sai)</b>
          <br><span class="note">Nó nhớ <b>biến nào</b>; giá trị đọc lúc chạy, như ví dụ vừa rồi ra 21.</span></div>
        say: "Lỗi thứ nhất, nghĩ phạm vi tĩnh nhớ giá trị lúc định nghĩa. Nó chỉ nhớ biến nào, còn giá trị được đọc lúc chạy, như ví dụ vừa rồi ra 21."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc biến toàn cục rồi gán cùng tên trong hàm <b class="red">(lỗi khi chạy)</b>
          <br><span class="note">Trong Python, gán <code>x</code> ở bất kỳ đâu trong hàm làm <code>x</code> thành biến cục bộ của <b>cả</b> hàm. Đọc nó trước dòng gán → lỗi “biến cục bộ chưa có giá trị”.</span></div>
        say: "Lỗi thứ hai, đọc một biến toàn cục rồi gán cùng tên trong hàm. Trong một số ngôn ngữ, gán x ở bất kỳ đâu trong hàm làm x thành biến cục bộ của cả hàm. Đọc nó trước dòng gán sẽ gây lỗi biến cục bộ chưa có giá trị."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đặt tên cục bộ trùng tên ngoài mà không để ý <b class="red">(khó đọc)</b>
          <br><span class="note">Tên trong che tên ngoài: mọi chỗ dùng bên trong trỏ tới biến trong. Đặt tên khác nhau khi hai biến có nghĩa khác nhau.</span></div>
        say: "Lỗi thứ ba, đặt tên cục bộ trùng tên bên ngoài mà không để ý. Tên trong che tên ngoài, mọi chỗ dùng bên trong đều trỏ tới biến trong, nên hãy đặt tên khác nhau khi hai biến có nghĩa khác nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Hàm đọc một biến toàn cục làm “cấu hình”; một phép thử đổi biến đó và quên trả lại.</div>
          <div class="code"><div>thue = 0.1</div><div>def gia(x): return round(x * (1 + thue))</div></div>
          <table class="t"><tr><th>thứ tự chạy</th><th>thue lúc đó</th><th><code>gia(100)</code></th><th>phép thử B mong 110</th></tr>
          <tr><td>chỉ chạy B</td><td>0.1</td><td>110</td><td>đạt</td></tr>
          <tr><td>A (đặt thue = 0.2) rồi B</td><td>0.2</td><td>$\hl{120}$</td><td><b class="red">hỏng</b></td></tr></table>
          <p class="note">Người có kinh nghiệm truyền giá trị vào làm tham số: <code>gia(x, thue=0.1)</code> — kết quả chỉ phụ thuộc thứ nhìn thấy ở lời gọi.</p>
        focus: [1, 2, 3, "3.2", "3.3", 4]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, hàm đọc một biến toàn cục làm cấu hình, rồi một phép thử đổi biến đó mà quên trả lại. Ở đây hàm giá đọc biến thuế toàn cục, bằng không phẩy một, nên giá của 100 là 110. Nếu chỉ chạy phép thử B, nó đạt. Nhưng nếu phép thử A chạy trước và đặt thuế bằng không phẩy hai, thì B nhận 120 và hỏng, dù chẳng ai sửa B. Loại lỗi này chỉ hiện ra khi đổi thứ tự chạy, nên rất khó tìm. Người có kinh nghiệm truyền thuế vào làm tham số, để kết quả chỉ phụ thuộc vào những gì nhìn thấy ngay ở lời gọi."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.scope_lookup('static', 5, 7) * 2 == 10 and alg.scope_lookup('dynamic', 5, 7) * 2 == 14"
    steps:
      - show: |
          <div class="code"><div>a = 5</div><div>def p(): return a * 2</div><div>def q():</div><div>    a = 7</div><div>    return p()</div></div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td><code>q()</code> trả bao nhiêu với phạm vi tĩnh?</td></tr>
          <tr><td>2</td><td><code>q()</code> trả bao nhiêu với phạm vi động?</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bây giờ đến lượt bạn tự làm, với a toàn cục bằng 5, hàm p trả về a nhân 2, hàm q đặt a cục bộ bằng 7 rồi gọi p. Gọi q trả về bao nhiêu với phạm vi tĩnh, và với phạm vi động? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1 — phạm vi tĩnh</th><th>kết quả</th></tr>
          <tr><td>p được viết ở toàn cục → cha của p là toàn cục</td><td>—</td></tr>
          <tr><td>p không có a → lên toàn cục: a = 5</td><td>5</td></tr>
          <tr><td>p trả a nhân 2</td><td>$\hl{10}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, giải theo phạm vi tĩnh từng bước. Hàm p được viết ở toàn cục, nên cha của môi trường p là toàn cục. Môi trường của p không có a, ta lên toàn cục và thấy a bằng 5. Hàm p trả a nhân 2, tức là 10."
      - show: |
          <table class="t"><tr><th>câu 2 — phạm vi động</th><th>kết quả</th></tr>
          <tr><td>q đang gọi p → cha của p là môi trường của q</td><td>—</td></tr>
          <tr><td>p không có a → lên q: a = 7</td><td>7</td></tr>
          <tr><td>p trả a nhân 2</td><td>$\hl{14}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu hai, giải theo phạm vi động từng bước. Hàm q đang gọi p, nên cha của môi trường p là môi trường của q. Môi trường của p không có a, ta lên q và thấy a bằng 7. Hàm p trả a nhân 2, tức là 14."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">môi trường trỏ lên cha</span><span class="a">→</span>
          <span class="n">tĩnh: cha = nơi viết</span><span class="a">→</span>
          <span class="n">động: cha = nơi gọi</span><span class="a">→</span>
          <span class="n">chọn biến, đọc giá trị lúc chạy</span></div>
        say: "Tổng kết lại, mỗi môi trường trỏ lên một môi trường cha. Phạm vi tĩnh lấy cha là nơi viết, phạm vi động lấy cha là nơi gọi. Phạm vi tĩnh chọn biến, còn giá trị được đọc lúc chạy."
      - show: |
          <div class="box key"><b>Tư duy:</b> mã dễ hiểu là mã mà người đọc trả lời được “tên này là gì” chỉ bằng cách nhìn vào văn bản, không cần chạy thử.</div>
        say: "Điều cần mang theo, mã dễ hiểu là mã mà người đọc trả lời được câu hỏi tên này là gì chỉ bằng cách nhìn vào văn bản, không cần chạy thử."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>kiểu dữ liệu</b> và kiểm tra kiểu — tĩnh, động, mạnh, yếu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học kiểu dữ liệu và kiểm tra kiểu, với bốn khái niệm tĩnh, động, mạnh, yếu. Hẹn gặp bạn ở bài tiếp theo."
