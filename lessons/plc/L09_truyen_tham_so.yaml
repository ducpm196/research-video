id: L09
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 9 — Truyền tham số: theo giá trị, theo tham chiếu, chia sẻ đối tượng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L09; audit/plc/verify_plc.py L09; B. Liskov và cộng sự, CLU Reference Manual (1981) (thuật ngữ “call by sharing”); M. L. Scott, Programming Language Pragmatics, 4th ed. (2015), mục 9.3; Python Language Reference, mục 8.7 (giá trị mặc định được tính một lần)"
assumes: [arith]
# Quy ước: mã minh hoạ C/C++ cho theo giá trị và theo tham chiếu, Python cho chia sẻ đối tượng; lời đọc mô tả bằng tiếng Việt.
#   Kết quả Python chạy thật bằng alg.sharing_demo trong checks; phần C/C++ chạy trong audit/plc/verify_plc.py nếu có trình biên dịch,
#   không thì NOT_VERIFIED bằng máy (nêu ở báo cáo).
objectives:
  - "Phân biệt ba cách truyền tham số"
  - "Phân biệt gán lại tham số và sửa đối tượng"
  - "Tránh giá trị mặc định là đối tượng biến đổi được"
asr_reviewed:
  - {sentence: "Câu một, hỏi cuối cùng k của m bằng mấy, và vì sao?", reason: "ASR chép “Câu 1 Hỏi cuối cùng ca của em mờ bằng mấy và vì sao?” (0.889): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách thứ nhất là sửa đối tượng, gán khoá k của d bằng 3, vì sửa đối tượng thì người gọi thấy.", reason: "ASR chép “Cách thứ nhất là sửa đối tượng, gán khóa ca của dây bằng 3 vì sửa đối tượng thì người gọi thấy.” (0.955): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hàm sửa được danh sách nhưng không đổi chỗ được hai số"
    checks:
      - "alg.sharing_demo()['them'] == [0, 1] and alg.sharing_demo()['doi_cho'] == (1, 2)"
    steps:
      - show: |
          <p>Gọi <code>them(a)</code> thêm 1 vào danh sách: bên ngoài thấy <code>[0, 1]</code>. Gọi <code>doi_cho(p, q)</code> để hoán đổi hai số: bên ngoài <b>vẫn</b> <code>(1, 2)</code>.</p>
          <div class="box key">Hôm nay: hàm nhận tham số <b>như thế nào</b> — theo giá trị, theo tham chiếu, hay chia sẻ đối tượng.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, gọi một hàm thêm số 1 vào danh sách, bên ngoài thấy danh sách đã đổi. Nhưng gọi một hàm hoán đổi hai số, bên ngoài hai số vẫn y nguyên. Hôm nay ta học hàm nhận tham số như thế nào, theo giá trị, theo tham chiếu, hay chia sẻ đối tượng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tên là nhãn dán lên đối tượng"
    checks:
      - "(lambda d: exec('a = [0]\\nb = a\\nb.append(1)\\nr = (a, a is b)\\n', d) or d['r'] == ([0, 1], True))({})"
      - "(lambda d: exec('a = [0]\\nb = a\\nb = [9]\\nr = (a, b, a is b)\\n', d) or d['r'] == ([0], [9], False))({})"
    steps:
      - show: |
          <div class="code"><div>a = [0]</div><div>b = a          <span class="cm"># b dán lên CÙNG danh sách</span></div><div>b.append(1)    <span class="cm"># a cũng thấy: [0, 1]</span></div></div>
          <p>Phép gán <code>b = a</code> không sao chép danh sách; nó dán thêm nhãn <code>b</code> lên <b>cùng một</b> đối tượng.</p>
        focus: [1, 1, 1, 2]
        say: "Trước hết, ôn lại phép gán trong các ngôn ngữ mà bài này dùng. Ta tạo danh sách chứa số 0 và đặt tên a. Gán b bằng a, rồi thêm 1 qua tên b. In a ra thì thấy 0, 1, vì phép gán b bằng a không sao chép danh sách, nó chỉ dán thêm nhãn b lên cùng một đối tượng."
      - show: |
          <div class="code"><div>a = [0]</div><div>b = a</div><div>b = [9]        <span class="cm"># b chuyển sang danh sách MỚI; a vẫn [0]</span></div></div>
          <p>Gán lại <code>b</code> là <b>bóc nhãn</b> b ra, dán sang đối tượng khác. Đối tượng cũ và nhãn a không bị đụng tới.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Điều thứ hai, gán lại một tên thì khác hẳn với sửa đối tượng. Lại cho a là danh sách chứa 0 và b bằng a. Lần này gán b bằng một danh sách mới chứa 9. Ta chỉ bóc nhãn b ra và dán sang đối tượng khác. Danh sách cũ và nhãn a không bị đụng tới, nên a vẫn là 0."

  - id: sym
    kind: symbol
    title: "Giải mã: ba cách truyền"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>hàm nhận gì</th><th>ví dụ</th></tr>
          <tr><td>theo giá trị</td><td>một <b>bản sao</b> của giá trị</td><td><code>void f(int x)</code> trong C</td></tr>
          <tr><td>theo tham chiếu</td><td>một <b>tên khác</b> cho chính biến của người gọi</td><td><code>void f(int&amp; x)</code> trong C++</td></tr>
          <tr><td>chia sẻ đối tượng</td><td>bản sao của <b>tham chiếu</b>: cùng trỏ tới một đối tượng</td><td>Python, Java (đối tượng)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Có ba cách truyền tham số. Truyền theo giá trị, hàm nhận một bản sao của giá trị, như số nguyên trong C. Truyền theo tham chiếu, hàm nhận một tên khác cho chính biến của người gọi, như dấu và trong C++. Chia sẻ đối tượng, hàm nhận bản sao của tham chiếu, nên tham số và biến bên ngoài cùng trỏ tới một đối tượng, như với các đối tượng trong nhiều ngôn ngữ phổ biến."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: hai nhãn, một đối tượng"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arP9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arP9o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><g font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="180" y="40">người gọi</text><text x="580" y="40">trong hàm</text><text x="1150" y="40">đối tượng</text></g><rect x="80" y="90" width="200" height="80" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="180" y="142" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">a</text><rect x="480" y="90" width="200" height="80" rx="12" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="580" y="142" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">ds</text><rect x="1020" y="70" width="260" height="90" rx="12" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="1150" y="128" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">[0, 1]</text><rect x="1020" y="280" width="260" height="90" rx="12" fill="#fecaca" stroke="#1f2937" stroke-width="3"/><text x="1150" y="338" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">[9]</text><path d="M280,130 C520,10 820,40 1014,105" fill="none" stroke="#2a78d6" stroke-width="4" marker-end="url(#arP9)"/><line x1="680" y1="130" x2="1014" y2="120" stroke="#2a78d6" stroke-width="4" marker-end="url(#arP9)"/><path d="M580,170 C580,300 800,325 1014,325" fill="none" stroke="#eb6834" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arP9o)"/><g font-size="22" text-anchor="middle"><text x="850" y="175" fill="#059669">sửa qua ds: a thấy</text><text x="380" y="300" fill="#eb6834">ds = [9]: chỉ ds đổi chỗ trỏ</text><text x="380" y="335" fill="#eb6834">a vẫn trỏ đối tượng cũ</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ lúc hàm đang chạy, nhãn a của người gọi và nhãn của tham số cùng trỏ tới một danh sách, theo hai mũi tên xanh. Chia sẻ đối tượng nghĩa là hàm nhận một bản sao của mũi tên, chứ không nhận bản sao của danh sách. Vì thế sửa danh sách qua tham số thì a cũng thấy. Còn nếu gán tham số bằng một danh sách mới, chỉ mũi tên cam của tham số đổi chỗ trỏ, và a vẫn trỏ đối tượng cũ."

  - id: example
    kind: example
    title: "Sửa đối tượng khác gán lại tham số"
    checks:
      - "alg.sharing_demo()['them'] == [0, 1] and alg.sharing_demo()['gan_lai'] == [0]"
    steps:
      - show: |
          <div class="code"><div>def them(ds): ds.append(1)     <span class="cm"># sửa đối tượng</span></div><div>def gan_lai(ds): ds = [9]     <span class="cm"># gán lại tham số</span></div><div>a = [0]; them(a)       <span class="cm"># a = [0, 1]</span></div><div>b = [0]; gan_lai(b)    <span class="cm"># b = [0]</span></div></div>
          <p><b>Bước một — gọi <code>them(a)</code>:</b> tham số <code>ds</code> nhận bản sao của mũi tên → <code>ds</code> và <code>a</code> cùng trỏ danh sách <code>[0]</code>.</p>
        focus: [1, "1.3", 2]
        say: "Hàm thêm sửa đối tượng, còn hàm gán lại thì gán tham số sang một danh sách mới. Bước một, gọi hàm thêm với a. Tham số nhận bản sao của mũi tên, nên tham số và a cùng trỏ tới danh sách chứa 0."
      - show: |
          <p><b>Bước 2:</b> <code>ds.append(1)</code> sửa chính danh sách đó → nhìn qua nhãn <code>a</code> cũng thấy $\hl{[0, 1]}$.</p>
        say: "Bước hai, hàm thêm gọi phép nối thêm số 1 qua tham số. Lý do là tham số và a cùng trỏ một danh sách, nên sửa qua tham số thì a cũng thấy, a thành 0, 1."
      - show: |
          <table class="t"><tr><th>Bước 3 — trong <code>gan_lai(b)</code></th><th><code>ds</code> trỏ tới</th></tr>
          <tr><td>vừa vào hàm</td><td><code>[0]</code>, cùng với <code>b</code></td></tr>
          <tr><td>sau <code>ds = [9]</code></td><td>danh sách <b>mới</b> <code>[9]</code></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước ba, xét lời gọi hàm gán lại với b, từng dòng một. Lúc vào hàm, tham số cũng trỏ tới danh sách chứa 0 giống b. Nhưng sau đó, dòng gán chuyển tham số sang một danh sách mới chứa 9."
      - show: |
          <p><b>Bước 4:</b> danh sách cũ không ai sửa → <code>b</code> vẫn là $\hl{[0]}$. Hàm trả về, danh sách <code>[9]</code> không còn ai trỏ tới.</p>
        say: "Bước bốn, gọi hàm gán lại với b, b vẫn là 0. Lý do là tham số chỉ được trỏ sang một danh sách mới, còn b vẫn trỏ danh sách cũ. Khi hàm trả về, danh sách chứa 9 không còn ai trỏ tới nữa."
      - clear: true
        show: |
          <p>Hoán đổi hai số: <code>def doi_cho(a, b): a, b = b, a</code> chỉ hoán đổi hai tham số cục bộ → bên ngoài vẫn <code>(1, 2)</code>. Trong C++ với <code>void doi_cho(int&amp; a, int&amp; b)</code>, hai tham số <b>là</b> hai biến của người gọi → hoán đổi được.</p>
          <div class="box key">Chia sẻ đối tượng: <b>sửa</b> đối tượng thì người gọi thấy; <b>gán lại</b> tham số thì không.</div>
        focus: [1, 1, 2]
        say: "Với chia sẻ đối tượng, hàm hoán đổi chỉ hoán đổi hai tham số cục bộ, nên bên ngoài vẫn là 1, 2. Trong C++ với tham chiếu, hai tham số chính là hai biến của người gọi, nên hoán đổi được. Tóm lại, với chia sẻ đối tượng, sửa đối tượng thì người gọi thấy, còn gán lại tham số thì không."

  - id: check
    kind: check
    title: "Tự kiểm: hỏi máy hai nhãn có cùng một đối tượng không"
    checks:
      - "(lambda d: exec('def them(ds):\\n    s = ds is a\\n    ds.append(1)\\n    return s\\ndef gan_lai(ds):\\n    t1 = ds is b\\n    ds = [9]\\n    return t1, ds is b\\na = [0]; r1 = them(a)\\nb = [0]; r2 = gan_lai(b)\\n', d) or (d['r1'], d['r2'], d['a'], d['b']) == (True, (True, False), [0, 1], [0]))({})"
    steps:
      - show: |
          <table class="t"><tr><th>hỏi máy: <code>ds</code> và biến ngoài có là <b>cùng một</b> đối tượng?</th><th>trả lời</th></tr>
          <tr><td>lúc vừa vào <code>them(a)</code></td><td>có</td></tr>
          <tr><td>lúc vừa vào <code>gan_lai(b)</code></td><td>có</td></tr>
          <tr><td>sau dòng <code>ds = [9]</code></td><td>$\hl{\text{không}}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, thay vì nhìn kết quả cuối, ta hỏi thẳng máy ngay trong hàm xem tham số và biến bên ngoài có phải cùng một đối tượng không. Lúc vừa vào hàm thêm, máy trả lời có. Lúc vừa vào hàm gán lại, máy cũng trả lời có, nên hai hàm nhận tham số giống hệt nhau. Chỉ sau dòng gán lại, máy mới trả lời không, đúng như mũi tên cam trong hình."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "(lambda d: exec('import copy\\na = {\"the\": [\"x\"]}\\nb = dict(a)\\nb[\"the\"].append(\"y\")\\nr1 = list(a[\"the\"])\\nc = {\"the\": [\"x\"]}\\ne = copy.deepcopy(c)\\ne[\"the\"].append(\"y\")\\nr2 = list(c[\"the\"])\\n', d) or (d['r1'], d['r2']) == (['x', 'y'], ['x']))({})"
      - "alg.sharing_demo()['bad'] == ([1, 2], [1, 2]) and alg.sharing_demo()['bad_same'] is True"
      - "alg.sharing_demo()['good'] == ([1], [2])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Giá trị mặc định là danh sách <b class="red">(bất ngờ)</b>
          <div class="code"><div>def bad(x, acc=[]): acc.append(x); return acc</div><div>bad(1); bad(2)     <span class="cm"># lần hai trả [1, 2], không phải [2]</span></div></div>
          <span class="note">Giá trị mặc định được tạo <b>một lần</b> lúc định nghĩa hàm; mọi lời gọi dùng chung danh sách đó. Sửa: <code>acc=None</code>, rồi trong thân tạo <code>[]</code> mới → <code>[1]</code>, <code>[2]</code>.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ nhất, dùng danh sách làm giá trị mặc định. Gọi hàm hai lần, lần hai trả về 1, 2 chứ không phải chỉ 2. Lý do là giá trị mặc định được tạo một lần lúc định nghĩa hàm, và mọi lời gọi dùng chung danh sách đó. Sửa bằng cách cho mặc định là rỗng, rồi tạo danh sách mới trong thân hàm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Nói “Python truyền theo tham chiếu” <b class="red">(sai khái niệm)</b>
          <br><span class="note">Nếu đúng là theo tham chiếu thì <code>gan_lai</code> và <code>doi_cho</code> đã đổi được biến bên ngoài. Đó là chia sẻ đối tượng.</span></div>
        say: "Lỗi thứ hai, nói rằng ngôn ngữ đó truyền theo tham chiếu. Nếu đúng là theo tham chiếu thì hàm gán lại và hàm hoán đổi đã đổi được biến bên ngoài, nên đó là chia sẻ đối tượng."
      - show: |
          <div class="box warn"><b>Lỗi 3.</b> Sửa đối tượng truyền vào mà người gọi không ngờ <b class="red">(khó dò)</b>
          <br><span class="note">Hàm “tính tổng” mà lại sắp xếp danh sách tại chỗ. Muốn an toàn, làm việc trên bản sao, hoặc ghi rõ hàm sửa đối số.</span></div>
        say: "Lỗi thứ ba, sửa đối tượng truyền vào mà người gọi không ngờ, chẳng hạn hàm tính tổng mà lại sắp xếp danh sách tại chỗ. Muốn an toàn, hãy làm việc trên bản sao, hoặc ghi rõ là hàm sửa đối số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Sao chép rồi yên tâm sửa — nhưng bản sao <b>nông</b> vẫn chia sẻ các đối tượng bên trong.</div>
          <table class="t"><tr><th>cách sao chép <code>{"the": ["x"]}</code></th><th>thêm "y" vào danh sách của bản sao</th><th>từ điển ban đầu sau đó</th></tr>
          <tr><td>nông: <code>dict(a)</code></td><td>xong</td><td>$\hl{\text{["x", "y"]}}$ — bị sửa theo</td></tr>
          <tr><td>sâu: <code>copy.deepcopy(a)</code></td><td>xong</td><td>["x"] — giữ nguyên</td></tr></table>
          <p class="note">Bản sao nông chỉ sao lớp ngoài; các mũi tên bên trong vẫn trỏ cùng chỗ. Trước khi sửa, hỏi máy “có cùng đối tượng không” như phần tự kiểm.</p>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, sao chép một cấu hình rồi yên tâm sửa bản sao, nhưng đó chỉ là bản sao nông. Từ điển ban đầu có khoá thẻ trỏ tới một danh sách chứa x. Sao chép nông rồi thêm y vào danh sách của bản sao, thì từ điển ban đầu cũng thành x, y, vì hai từ điển vẫn trỏ cùng một danh sách bên trong. Sao chép sâu thì từ điển ban đầu giữ nguyên x. Bản sao nông chỉ sao lớp ngoài, các mũi tên bên trong vẫn trỏ cùng chỗ cũ. Trước khi sửa, người có kinh nghiệm hỏi máy xem hai thứ có cùng một đối tượng không, như ta đã làm ở phần tự kiểm."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda d: (d.update(k=2), d)[1])({'k': 1}) == {'k': 2}"
      - "(lambda d: exec('def doi(d):\\n    d[\"k\"] = 2\\ndef thay(d):\\n    d = {\"k\": 3}\\nm = {\"k\": 1}; doi(m); thay(m)\\n', d) or d['m']['k'] == 2)({})"
      - "(lambda d: exec('def thay(d):\\n    d[\"k\"] = 3\\ndef thay2(d):\\n    return {\"k\": 3}\\nm = {\"k\": 2}; thay(m)\\nn = {\"k\": 2}; n = thay2(n)\\n', d) or (d['m']['k'], d['n']['k']) == (3, 3))({})"
    steps:
      - show: |
          <div class="code"><div>def doi(d): d["k"] = 2</div><div>def thay(d): d = {"k": 3}</div><div>m = {"k": 1}; doi(m); thay(m)</div></div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Sau ba dòng, <code>m["k"]</code> bằng mấy? Vì sao?</td></tr>
          <tr><td>2</td><td>Muốn gọi <code>thay(m)</code> xong thì <code>m["k"]</code> thành 3, sửa <code>thay</code> thế nào?</td></tr></table>
        focus: [0, 1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Hàm đổi sửa khoá k của từ điển thành 2, hàm thay gán tham số sang một từ điển mới có k bằng 3. Ta tạo m với k bằng 1, gọi hàm đổi rồi gọi hàm thay. Câu một, hỏi cuối cùng k của m bằng mấy, và vì sao? Câu hai, muốn gọi hàm thay xong thì k của m thành 3, bạn sửa hàm thay thế nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1 — dòng</th><th>d trỏ tới</th><th><code>m["k"]</code></th></tr>
          <tr><td><code>m = {"k": 1}</code></td><td>—</td><td>1</td></tr>
          <tr><td><code>doi(m)</code>: <code>d["k"] = 2</code></td><td>chính m</td><td>2</td></tr>
          <tr><td><code>thay(m)</code>: <code>d = {"k": 3}</code></td><td>từ điển mới</td><td>$\hl{2}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 1]
        say: "Đáp án câu một, lần theo từng dòng. Tạo m thì k bằng 1. Gọi hàm đổi, tham số d trỏ chính m, sửa khoá k nên k thành 2. Gọi hàm thay, d bị gán sang một từ điển mới, m không bị đụng tới nên k vẫn là 2. Đáp án là 2, vì hàm đổi sửa chính đối tượng m, còn hàm thay chỉ gán lại tham số cục bộ nên m không đổi."
      - show: |
          <table class="t"><tr><th>câu 2 — cách sửa</th><th>sau <code>thay(m)</code></th></tr>
          <tr><td>sửa đối tượng: <code>def thay(d): d["k"] = 3</code></td><td><code>m["k"]</code> = 3</td></tr>
          <tr><td>trả về giá trị mới: <code>def thay(d): return {"k": 3}</code>, gọi <code>m = thay(m)</code></td><td><code>m["k"]</code> = 3</td></tr></table>
          <p class="note">Cách thứ hai cho người đọc thấy ngay ở lời gọi rằng <code>m</code> đổi.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai có hai cách sửa, đều theo đúng luật vừa học. Cách thứ nhất là sửa đối tượng, gán khoá k của d bằng 3, vì sửa đối tượng thì người gọi thấy. Cách thứ hai là trả về một từ điển mới, rồi người gọi tự gán m bằng kết quả. Cách thứ hai thường dễ đọc hơn, vì người đọc thấy ngay ở lời gọi rằng m sẽ đổi."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
