id: L06
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 6 — Suy luận kiểu và hợp nhất"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L06; audit/plc/verify_plc.py L06; R. Milner, A Theory of Type Polymorphism in Programming, JCSS 17 (1978); J. A. Robinson, A Machine-Oriented Logic Based on the Resolution Principle, JACM 12 (1965) (hợp nhất); B. C. Pierce, Types and Programming Languages (2002), chương 22"
assumes: [arith]
# Quy ước: kiểu viết trong <code>: int, bool, biến kiểu 'a 'b (đọc “biến kiểu a”), kiểu hàm “đối → kết quả” (mũi tên trong <code>,
#   không phải ký hiệu toán). Phép + của ví dụ chỉ nhận int. Hợp nhất = alg.unify (có kiểm tra xuất hiện), áp thế = alg.resolve.
objectives:
  - "Sinh ràng buộc kiểu từ mã"
  - "Giải ràng buộc bằng hợp nhất"
  - "Biết suy luận kiểu vẫn là kiểm kiểu tĩnh"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Không ghi kiểu mà máy vẫn biết"
    steps:
      - show: |
          <div class="code"><div>def nhan_doi(x): return x + x</div></div>
          <p>Không có chữ <code>int</code> nào. Vậy mà một số ngôn ngữ (như OCaml, nơi phép <code>+</code> chỉ dành cho số nguyên) vẫn biết <code>nhan_doi</code> nhận số nguyên, trả số nguyên — và báo lỗi <b>trước khi chạy</b> nếu gọi với chuỗi.</p>
          <div class="box key">Hôm nay: <b>suy luận kiểu</b> — sinh ràng buộc từ mã, rồi giải bằng <b>hợp nhất</b>.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hàm nhân đôi trả về x cộng x, không ghi kiểu ở đâu cả. Vậy mà một số ngôn ngữ vẫn biết hàm này nhận số nguyên và trả số nguyên. Chúng còn báo lỗi trước khi chạy nếu ta gọi hàm với một chuỗi. Hôm nay ta học suy luận kiểu, sinh ràng buộc từ mã, rồi giải bằng hợp nhất."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: giải hệ bằng phép thế, và kiểm tĩnh của bài 5"
    checks:
      - "(lambda x: (lambda y: (x, y) == (2, 3))(x + 1))(2)"
    steps:
      - show: |
          <table class="t"><tr><th>hệ hai ẩn</th><th>làm gì</th><th>được</th></tr>
          <tr><td>$x = 2$</td><td>đã biết x</td><td>$x = 2$</td></tr>
          <tr><td>$y = x + 1$</td><td><b>thế</b> x bằng 2 vào vế phải</td><td>$y = 2 + 1 = \hl{3}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn cách giải một hệ phương trình bằng phép thế, vì hợp nhất làm đúng việc này với kiểu. Phương trình đầu cho biết ngay x bằng 2. Phương trình thứ hai nói y bằng x cộng 1, ta thế x bằng 2 vào vế phải và được y bằng 3."
      - show: |
          <div class="code"><div>def bao_cao(x):</div><div>    if x &lt; 0: return "âm: " + x   <span class="cm"># chuỗi + số</span></div><div>    return "ok"</div></div>
          <p>Ở bài 5: <b>kiểm tĩnh</b> xét mọi nhánh <b>trước khi chạy</b>, nên báo lỗi chuỗi cộng số ở dòng giữa dù nhánh đó chưa từng chạy; <b>kiểm động</b> chỉ báo khi chạy tới đó.</p>
        focus: [1, 2, 2]
        say: "Điều thứ hai, nhắc lại bài 5 với hàm báo cáo, có một nhánh ghép chuỗi với số. Kiểm tĩnh xét mọi nhánh trước khi chạy, nên báo lỗi chuỗi cộng số ngay, dù nhánh đó chưa từng chạy. Kiểm động thì chỉ báo khi chương trình thật sự chạy tới dòng đó."

  - id: sym
    kind: symbol
    title: "Giải mã: biến kiểu, kiểu hàm, ràng buộc"
    steps:
      - show: |
          <p><b>Biến kiểu</b> <code>'a</code>, <code>'b</code>: “một kiểu chưa biết”, như ẩn số trong phương trình.</p>
          <p><b>Kiểu hàm</b> <code>'a → 'b</code>: nhận một <b>đối</b> (giá trị đưa vào hàm) kiểu <code>'a</code>, trả <b>kết quả</b> kiểu <code>'b</code>.</p>
          <p><b>Ràng buộc</b> <code>'a = int</code>: hai kiểu phải bằng nhau. Mỗi chỗ dùng một giá trị trong mã sinh ra một ràng buộc.</p>
        focus: [1, 2, 3, 3]
        say: "Biến kiểu, viết a hay b có dấu phẩy trên, nghĩa là một kiểu chưa biết, giống ẩn số trong phương trình. Kiểu hàm từ a sang b nghĩa là nhận một đối, tức giá trị đưa vào hàm, có kiểu a, và trả về kết quả kiểu b. Một ràng buộc nói rằng hai kiểu phải bằng nhau, chẳng hạn biến kiểu a bằng số nguyên. Mỗi chỗ dùng một giá trị trong mã sinh ra một ràng buộc."

  # ───────────────────────── 3. HỢP NHẤT ─────────────────────────
  - id: unify
    kind: concept
    title: "Hợp nhất: giải hệ ràng buộc"
    checks:
      - "alg.unify(('->', \"'a\", 'bool'), ('->', 'int', \"'r\")) == {\"'a\": 'int', \"'r\": 'bool'}"
      - "alg.unify('int', 'bool') is None"
    steps:
      - show: |
          <p>Hợp nhất hai kiểu <code>A = B</code>:</p>
          <ol><li>Giống hệt nhau → xong.</li><li>Một bên là biến kiểu → gán biến đó bằng bên kia.</li><li>Hai bên đều là kiểu hàm → hợp nhất đối với đối, kết quả với kết quả.</li><li>Còn lại (như <code>int = bool</code>) → <b>lỗi kiểu</b>.</li></ol>
          <p class="note">Ví dụ: <code>'a → bool = int → 'r</code> → đối: <code>'a = int</code>; kết quả: <code>'r = bool</code>.</p>
        focus: [1, "2.1", "2.2", "2.3", "2.4", 3, 3]
        say: "Hợp nhất hai kiểu theo bốn luật. Một, nếu hai kiểu giống hệt nhau thì xong. Hai, nếu một bên là biến kiểu thì gán biến đó bằng bên kia. Ba, nếu cả hai bên đều là kiểu hàm thì hợp nhất đối với đối, kết quả với kết quả. Bốn, các trường hợp còn lại, như số nguyên bằng giá trị đúng sai, là lỗi kiểu. Ví dụ hợp nhất hàm từ a sang đúng sai với hàm từ số nguyên sang r. Ghép đối với đối được a bằng số nguyên, ghép kết quả với kết quả được r bằng đúng sai."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: một dây chuyền ba khâu"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arP6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="20" y="60" width="300" height="120" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="170" y="105" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">mã</text><text x="170" y="145" font-size="23" text-anchor="middle" fill="#1f2937">x + x</text><rect x="400" y="60" width="320" height="120" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="560" y="105" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">ràng buộc</text><text x="560" y="145" font-size="23" text-anchor="middle" fill="#1f2937">&#39;a = int, &#39;b = int</text><rect x="800" y="60" width="300" height="120" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="950" y="105" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">bảng thế</text><text x="950" y="145" font-size="23" text-anchor="middle" fill="#1f2937">&#39;a ↦ int, &#39;b ↦ int</text><rect x="1180" y="60" width="300" height="120" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1330" y="105" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">kiểu</text><text x="1330" y="145" font-size="23" text-anchor="middle" fill="#1f2937">int → int</text><g stroke="#1f2937" stroke-width="3"><line x1="322" y1="120" x2="396" y2="120" marker-end="url(#arP6)"/><line x1="722" y1="120" x2="796" y2="120" marker-end="url(#arP6)"/><line x1="1102" y1="120" x2="1176" y2="120" marker-end="url(#arP6)"/></g><g font-size="22" text-anchor="middle" fill="#2a78d6"><text x="360" y="225">sinh</text><text x="760" y="225">hợp nhất</text><text x="1140" y="225">thay vào</text></g><rect x="400" y="260" width="320" height="120" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="560" y="305" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">thêm lời gọi</text><text x="560" y="345" font-size="23" text-anchor="middle" fill="#1f2937">nhan_doi(&quot;hi&quot;)</text><rect x="800" y="260" width="680" height="120" rx="14" fill="#fee2e2" stroke="#1f2937" stroke-width="3"/><text x="1140" y="305" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">ràng buộc int = str</text><text x="1140" y="345" font-size="23" text-anchor="middle" fill="#1f2937">mâu thuẫn → lỗi TRƯỚC khi chạy</text><line x1="722" y1="320" x2="796" y2="320" stroke="#b91c1c" stroke-width="3" marker-end="url(#arP6)"/></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ suy luận kiểu như một dây chuyền ba khâu. Khâu đầu đọc mã và sinh ra ràng buộc, như biến kiểu a bằng số nguyên. Khâu hai, hợp nhất, giải hệ ràng buộc thành một bảng thế, giống như giải hệ phương trình. Khâu ba thay bảng thế vào và ra kiểu của hàm. Còn nếu một lời gọi thêm vào ràng buộc mâu thuẫn, như số nguyên bằng chuỗi, thì dây chuyền dừng lại và báo lỗi trước khi chạy."

  - id: example
    kind: example
    title: "Suy luận kiểu của hàm nhân đôi"
    checks:
      - "alg.resolve(('->', \"'a\", \"'b\"), alg.unify(\"'b\", 'int', alg.unify(\"'a\", 'int'))) == ('->', 'int', 'int')"
    steps:
      - show: |
          <p><b>Bước một — đặt ẩn:</b> chưa biết gì, cho <code>x : 'a</code>, kết quả <code>'b</code>, nên <code>nhan_doi : 'a → 'b</code>.</p>
        say: "Bước một, đặt ẩn. Lúc đầu chưa biết gì, ta cho x có kiểu a, kết quả có kiểu b, nên hàm nhân đôi có kiểu từ a sang b, giống như gọi tên hai ẩn số trước khi giải."
      - show: |
          <table class="t"><tr><th>Bước 2 — sinh ràng buộc từ <code>x + x</code></th><th>ràng buộc</th></tr>
          <tr><td>phép <code>+</code> nhận số nguyên ở bên trái</td><td><code>'a = int</code></td></tr>
          <tr><td>phép <code>+</code> nhận số nguyên ở bên phải</td><td><code>'a = int</code></td></tr>
          <tr><td>phép <code>+</code> trả số nguyên, đó là kết quả hàm</td><td><code>'b = int</code></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước hai, sinh ràng buộc từ x cộng x, vì phép cộng chỉ nhận hai số nguyên và trả số nguyên. Toán hạng bên trái là x, nên a bằng số nguyên. Toán hạng bên phải cũng là x, cho thêm một lần a bằng số nguyên. Kết quả của phép cộng chính là kết quả của hàm, nên b bằng số nguyên."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 3 — hợp nhất lần lượt</th><th>luật dùng</th><th>bảng thế</th></tr>
          <tr><td><code>'a = int</code></td><td>một bên là biến kiểu</td><td><code>'a ↦ int</code></td></tr>
          <tr><td><code>'a = int</code> → <code>int = int</code></td><td>giống hệt nhau</td><td>không đổi</td></tr>
          <tr><td><code>'b = int</code></td><td>một bên là biến kiểu</td><td><code>'a ↦ int, 'b ↦ int</code></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước ba, hợp nhất lần lượt từng ràng buộc. Ràng buộc đầu có một bên là biến kiểu, nên gán a bằng số nguyên. Ràng buộc thứ hai, sau khi thay a, thành số nguyên bằng số nguyên, giống hệt nhau nên không đổi gì. Ràng buộc cuối gán b bằng số nguyên, và bảng thế có đủ cả hai ẩn."
      - show: |
          <p><b>Bước 4 — thay vào:</b> <code>'a → 'b</code> thành <code>nhan_doi : <b class="red">int → int</b></code>.</p>
          <p class="note">Gọi <code>nhan_doi("hi")</code> sinh ràng buộc <code>int = str</code> → báo lỗi lúc biên dịch.</p>
        focus: [1, 2]
        say: "Bước bốn, thay bảng thế vào kiểu từ a sang b, ta được hàm nhân đôi có kiểu từ số nguyên sang số nguyên. Nếu gọi hàm với một chuỗi, ta được ràng buộc số nguyên bằng chuỗi, và máy báo lỗi ngay lúc biên dịch."

  - id: check
    kind: check
    title: "Tự kiểm: thử hết mọi cách gán kiểu"
    checks:
      - "(lambda C, T: [(a, b) for a in T for b in T if all(alg.resolve(l, {\"'a\": a, \"'b\": b}) == alg.resolve(r, {\"'a\": a, \"'b\": b}) for l, r in C)] == [('int', 'int')] and len(T) ** 2 == 9)([(\"'a\", 'int'), (\"'a\", 'int'), (\"'b\", 'int')], ['int', 'bool', 'str'])"
    steps:
      - show: |
          <table class="t"><tr><th>thử <code>'a</code></th><th>thử <code>'b</code></th><th>ràng buộc bị vi phạm</th></tr>
          <tr><td>int</td><td>int</td><td>không có ✓</td></tr>
          <tr><td>int</td><td>bool hoặc str</td><td><code>'b = int</code></td></tr>
          <tr><td>bool hoặc str</td><td>bất kỳ</td><td><code>'a = int</code></td></tr></table>
          <p>3 kiểu cho mỗi ẩn → $3 \times 3 = 9$ cách gán; đúng <b>1</b> cách thoả cả ba ràng buộc.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Kiểm bằng đường khác, thay vì hợp nhất, ta cho máy thử hết mọi cách gán kiểu cho hai ẩn, mỗi ẩn chọn một trong ba kiểu số nguyên, đúng sai và chuỗi. Gán cả hai là số nguyên thì không vi phạm ràng buộc nào. Giữ a là số nguyên nhưng đổi b thì vi phạm ràng buộc b bằng số nguyên. Đổi a sang kiểu khác thì vi phạm ngay ràng buộc a bằng số nguyên. Trong 3 nhân 3 bằng 9 cách gán, đúng một cách thoả cả ba ràng buộc, khớp với kết quả hợp nhất."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.unify(\"'a\", ('->', \"'a\", \"'b\")) is None"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ suy luận kiểu là kiểu động <b class="red">(sai)</b>
          <br><span class="note">Không ghi kiểu ≠ không kiểm kiểu. Mọi kiểu được tìm ra và kiểm <b>trước khi chạy</b>: vẫn là kiểm tĩnh (bài 5).</span></div>
        say: "Lỗi thứ nhất, nghĩ suy luận kiểu là kiểu động. Không ghi kiểu không có nghĩa là không kiểm kiểu, mọi kiểu được tìm ra và kiểm trước khi chạy, nên vẫn là kiểm tĩnh như bài 5."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ qua <b>kiểm tra xuất hiện</b> <b class="red">(sai)</b>
          <br><span class="note"><code>def f(x): return x(x)</code> cho <code>'a = 'a → 'b</code>: <code>'a</code> nằm trong chính vế phải. Gán thẳng sẽ ra kiểu vô hạn. Hợp nhất đúng phải báo lỗi.</span></div>
        say: "Lỗi thứ hai, bỏ qua kiểm tra xuất hiện. Hàm f gọi x với chính x cho ràng buộc a bằng hàm từ a sang b, biến a nằm ngay trong vế phải. Gán thẳng sẽ ra một kiểu vô hạn, nên hợp nhất đúng phải báo lỗi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đọc thông báo lỗi suy luận ở sai chỗ <b class="red">(lãng phí)</b>
          <br><span class="note">Lỗi được báo ở chỗ ràng buộc <b>mâu thuẫn</b> lộ ra, có thể xa chỗ sai thật. Ghi kiểu cho các hàm chính giúp lỗi lộ ra gần chỗ sai hơn.</span></div>
        say: "Lỗi thứ ba, tìm lỗi ở đúng chỗ máy báo. Lỗi suy luận được báo ở nơi các ràng buộc mâu thuẫn lộ ra, có thể xa chỗ sai thật, nên hãy ghi kiểu cho các hàm chính để lỗi lộ ra gần chỗ sai hơn."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.unify(('->', \"'a\", 'int'), ('->', 'bool', \"'c\")) == {\"'a\": 'bool', \"'c\": 'int'}"
      - "alg.unify(('->', 'int', 'int'), ('->', 'int', 'bool')) is None"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hợp nhất <code>'a → int</code> với <code>bool → 'c</code>.</td></tr>
          <tr><td>2</td><td>Hợp nhất <code>int → int</code> với <code>int → bool</code>.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hợp nhất hàm từ a sang số nguyên với hàm từ đúng sai sang c. Câu hai, hợp nhất hàm từ số nguyên sang số nguyên với hàm từ số nguyên sang đúng sai. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>câu 1 — hai bên đều là kiểu hàm</th><th>luật dùng</th><th>bảng thế</th></tr>
