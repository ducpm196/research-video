id: L01
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 1 — Phân tích từ vựng bằng biểu thức chính quy và ôtômat"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L01; audit/plc/verify_plc.py L01; A. V. Aho và cộng sự, Compilers (2006), chương 3; TOC bài 1–3 (biểu thức chính quy, ôtômat)"
assumes: [arith]
# Quy ước: loại từ tố viết HOA không dấu như trong checklib (SO, TEN, PHEP, KHOA). Mẫu viết bằng biểu thức chính quy trong <code>:
#   [A-Za-z_] một chữ hoặc gạch dưới, \w* không hay nhiều chữ/số/gạch dưới, \d+ một hay nhiều chữ số. Luật: khớp DÀI NHẤT; hoà thì
#   mẫu đứng TRƯỚC thắng; tên trùng từ khoá thành KHOA. Mọi kết quả do alg.lex trong checks.
objectives:
  - "Mô tả từ tố bằng biểu thức chính quy"
  - "Áp dụng luật khớp dài nhất và luật ưu tiên"
  - "Hiểu bộ phân tích từ vựng là một ôtômat"
