  - {sentence: "Một ô-tô-mát hữu hạn là một cỗ máy có hữu hạn trạng thái, đọc một ký tự thì đi theo mũi tên mang ký tự đó sang trạng thái kế, như hình vừa xem.", reason: "ASR chép “Một Automat hữu hạn là một cổ máy có hữu hạn trạng thái, đọc một ký tự thì đi theo mũi tên mang ký tự đó sang trạng thái kế, như hình vừa xem.” (0.914): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: tô mát (trong “ô tô mát” → “automat”), cỗ/cổ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình vẽ một phần ô-tô-mát của bộ phân tích, mỗi vòng tròn là một trạng thái, vòng kép là trạng thái chấp nhận được, tức là đã đọc đủ một từ tố.", reason: "ASR chép “Hình với một phần Automat của bộ phân tích, mỗi vòng tròn là một trạng thái, vòng kép là trạng thái chấp nhận được, tức là đã đọc đủ một tư tố.” (0.879): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: vẽ/với, tô mát (trong “ô tô mát” → “automat”), từ/bốn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhưng chuỗi i f x dài hơn chỉ khớp mẫu tên, nên là một tên.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Chuỗi i f x, hay từ khoá trả về có thêm đuôi e d, đều là tên, từ khoá chỉ thắng khi khớp trọn cả từ.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
