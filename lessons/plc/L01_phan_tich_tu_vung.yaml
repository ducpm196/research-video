scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“ifx” là một tên hay là “if” rồi “x”?"
    steps:
      - show: |
          <p>Máy chỉ thấy một chuỗi ký tự: <code>if x1&lt;=10</code>. Đâu là từ khoá, đâu là tên, đâu là số? <code>&lt;=</code> là một phép hay là <code>&lt;</code> rồi <code>=</code>?</p>
          <div class="box key">Hôm nay: <b>phân tích từ vựng</b> — mô tả từ tố bằng biểu thức chính quy, cắt chuỗi bằng luật <b>khớp dài nhất</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, máy chỉ thấy một chuỗi ký tự như trên màn hình. Đâu là từ khoá, đâu là tên, đâu là số? Dấu nhỏ hơn hoặc bằng là một phép, hay là dấu nhỏ hơn rồi dấu bằng? Hôm nay ta học phân tích từ vựng, mô tả từ tố bằng biểu thức chính quy, và cắt chuỗi bằng luật khớp dài nhất."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: biểu thức chính quy và vị trí trong chuỗi"
    checks:
      - "all(__import__('re').fullmatch('[0-9]+', s) for s in ('7', '42', '2026')) and not any(__import__('re').fullmatch('[0-9]+', s) for s in ('', '4a'))"
      - "len('if x1<=10') == 9 and [c for c in 'if x1<=10'][5] == '<' and 'if x1<=10'.index('x1') == 3"
      - "(lambda re: all(re.fullmatch(p, s) for p, s in (('[A-Za-z_]', 'x'), ('[A-Za-z_]', '_'), (r'\\d', '7'), (r'\\w', '_'), (r'\\d+', '42'), (r'a\\d*', 'a'), (r'a\\d*', 'a12'), ('<=|<', '<='), ('<=|<', '<'))) and not re.fullmatch('[A-Za-z_]', '7') and not re.fullmatch(r'\\d+', ''))(__import__('re'))"
    steps:
      - show: |
          <p>Một <b>biểu thức chính quy</b> là một mẫu viết bằng ký hiệu, mô tả một tập chuỗi. Mẫu “một hay nhiều chữ số”:</p>
          <table class="t"><tr><th>chuỗi</th><td><code>7</code></td><td><code>42</code></td><td><code>2026</code></td><td>(rỗng)</td><td><code>4a</code></td></tr>
          <tr><th>khớp trọn?</th><td>có</td><td>có</td><td>có</td><td><b class="red">không</b></td><td><b class="red">không</b></td></tr></table>
        focus: [1, 2, "2.2"]
        say: "Trước hết, ta cần hiểu biểu thức chính quy, đó là một mẫu viết bằng ký hiệu, mô tả một tập các chuỗi. Lấy mẫu một hay nhiều chữ số làm ví dụ, và thử năm chuỗi trong bảng. Chuỗi 7, 42 và 2026 đều khớp trọn, còn chuỗi rỗng không khớp vì cần ít nhất một chữ số, và chuỗi 4a không khớp vì có chữ a."
      - clear: true
        show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ khớp trọn</th></tr>
          <tr><td><code>[A-Za-z_]</code></td><td>đúng <b>một</b> ký tự lấy trong ngoặc vuông: chữ hoa, chữ thường hoặc gạch dưới</td><td><code>x</code>, <code>_</code></td></tr>
          <tr><td><code>\d</code> và <code>\w</code></td><td><code>\d</code>: một chữ số; <code>\w</code>: một chữ, một số hoặc một gạch dưới</td><td><code>7</code>; <code>a</code>, <code>7</code>, <code>_</code></td></tr>
          <tr><td><code>+</code> và <code>*</code></td><td>lặp thứ đứng ngay trước: <code>+</code> <b>một hay nhiều</b> lần, <code>*</code> <b>không hay nhiều</b> lần</td><td><code>\d+</code>: <code>42</code>; <code>a\d*</code>: <code>a</code>, <code>a12</code></td></tr>
          <tr><td><code>A|B</code></td><td>hoặc khớp mẫu A, hoặc khớp mẫu B</td><td><code>&lt;=|&lt;</code>: <code>&lt;=</code>, <code>&lt;</code></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4", "1.5"]
        say: "Điều thứ hai, mẫu được viết bằng vài ký hiệu, và bài này chỉ dùng bốn loại. Ngoặc vuông nghĩa là đúng một ký tự lấy trong ngoặc, ví dụ một chữ hoa, một chữ thường hoặc một gạch dưới. Gạch chéo ngược đi với chữ d là một chữ số, còn gạch chéo ngược đi với chữ w là một chữ, một số hoặc một gạch dưới. Dấu cộng đặt sau một mẫu nghĩa là lặp mẫu đó một hay nhiều lần, còn dấu sao là lặp không hay nhiều lần. Vì thế mẫu chữ a rồi chữ số kèm dấu sao khớp cả chuỗi a trơn lẫn chuỗi a12. Cuối cùng, gạch đứng nghĩa là hoặc khớp mẫu bên trái, hoặc khớp mẫu bên phải."
      - show: |
          <p>Vị trí trong chuỗi đếm <b>từ 0</b>. Chuỗi <code>if x1&lt;=10</code> có 9 ký tự:</p>
          <table class="t"><tr><th>vị trí</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr>
          <tr><th>ký tự</th><td>i</td><td>f</td><td>␣</td><td>x</td><td>1</td><td><b>&lt;</b></td><td>=</td><td>1</td><td>0</td></tr></table>
        focus: [1, 2, "2.2"]
        say: "Điều thứ ba, vị trí trong chuỗi được đếm bắt đầu từ 0, và chuỗi ví dụ của bài có tất cả 9 ký tự. Bảng ghi vị trí ở hàng trên, ký tự ở hàng dưới, ô có dấu móc nhỏ là khoảng trắng ở vị trí 2. Chẳng hạn, dấu nhỏ hơn nằm ở vị trí 5, và ta sẽ dùng lại các vị trí này khi cắt chuỗi."

  - id: sym
    kind: symbol
    title: "Giải mã: mỗi loại từ tố là một biểu thức chính quy"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>mẫu</th><th>đọc là</th></tr>
          <tr><td>SO</td><td><code>\d+</code></td><td>một hay nhiều chữ số</td></tr>
          <tr><td>TEN</td><td><code>[A-Za-z_]\w*</code></td><td>chữ cái hoặc gạch dưới, rồi bao nhiêu chữ, số, gạch dưới cũng được</td></tr>
          <tr><td>PHEP</td><td><code>==</code> <code>&lt;=</code> <code>&gt;=</code> <code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>=</code> …</td><td>các phép, có phép hai ký tự</td></tr>
          <tr><td>KHOA</td><td><code>if</code> <code>while</code> <code>return</code> <code>def</code></td><td>tên đặc biệt đã dành riêng</td></tr></table>
          <p class="note">Khoảng trắng cũng khớp một mẫu, nhưng bị bỏ đi, không thành từ tố.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Mỗi loại từ tố được mô tả bằng một biểu thức chính quy, viết bằng các ký hiệu vừa học. Số là một hay nhiều chữ số. Tên bắt đầu bằng chữ cái hoặc gạch dưới, sau đó bao nhiêu chữ, số hay gạch dưới cũng được. Phép gồm các dấu toán, có cả phép hai ký tự như bằng bằng hay nhỏ hơn hoặc bằng. Từ khoá là những tên đặc biệt đã được dành riêng. Khoảng trắng cũng khớp một mẫu, nhưng bị bỏ đi, không thành từ tố."

  # ───────────────────────── 3. HAI LUẬT ─────────────────────────
  - id: rules
    kind: concept
    title: "Hai luật: khớp dài nhất, rồi ưu tiên"
    checks:
      - "alg.lex('x1') == [('TEN', 'x1')] and alg.lex('<=') == [('PHEP', '<=')]"
      - "alg.lex('ifx') == [('TEN', 'ifx')] and alg.lex('if') == [('KHOA', 'if')]"
    steps:
      - show: |
          <p><b>Luật 1 — khớp dài nhất:</b> ở mỗi vị trí, thử mọi mẫu, lấy đoạn khớp <b>dài nhất</b>. <code>x1</code> là một tên, không phải tên <code>x</code> rồi số <code>1</code>; <code>&lt;=</code> là một phép.</p>
          <p><b>Luật 2 — ưu tiên:</b> nếu hai mẫu khớp dài bằng nhau, mẫu khai báo trước thắng. <code>if</code> khớp cả mẫu tên lẫn từ khoá; bộ cắt khai báo mẫu từ khoá đứng trên mẫu tên → là <b>từ khoá</b>. Nhưng <code>ifx</code> dài hơn chỉ khớp mẫu tên → là <b>tên</b>.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Luật thứ nhất là khớp dài nhất. Ở mỗi vị trí, ta thử mọi mẫu rồi lấy đoạn khớp dài nhất, nên x1 là một tên, không phải tên x rồi số 1, và nhỏ hơn hoặc bằng là một phép. Luật thứ hai là ưu tiên, nếu hai mẫu khớp dài bằng nhau thì mẫu khai báo trước thắng. Từ khoá điều kiện, gồm hai chữ i và f, khớp cả mẫu tên lẫn mẫu từ khoá, mà mẫu từ khoá được khai báo trước mẫu tên, nên là từ khoá. Nhưng chuỗi i f x dài hơn chỉ khớp mẫu tên, nên là một tên."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: đi trên ôtômat và nhớ chỗ chấp nhận cuối"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><defs><marker id="arP1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><circle cx="150" cy="230" r="55" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="150" y="239" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">đầu</text><circle cx="520" cy="100" r="55" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><circle cx="520" cy="100" r="45" fill="none" stroke="#1f2937" stroke-width="2"/><text x="520" y="109" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">TEN</text><circle cx="520" cy="360" r="55" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><circle cx="520" cy="360" r="45" fill="none" stroke="#1f2937" stroke-width="2"/><text x="520" y="369" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">SO</text><circle cx="1000" cy="230" r="55" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><circle cx="1000" cy="230" r="45" fill="none" stroke="#1f2937" stroke-width="2"/><text x="1000" y="239" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">&lt;</text><circle cx="1350" cy="230" r="55" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><circle cx="1350" cy="230" r="45" fill="none" stroke="#1f2937" stroke-width="2"/><text x="1350" y="239" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">&lt;=</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="200" y1="205" x2="467" y2="118" marker-end="url(#arP1)"/><line x1="200" y1="255" x2="467" y2="342" marker-end="url(#arP1)"/><line x1="207" y1="230" x2="942" y2="230" marker-end="url(#arP1)"/><line x1="1057" y1="230" x2="1292" y2="230" marker-end="url(#arP1)"/><path d="M572,82 C660,30 660,170 574,120" marker-end="url(#arP1)"/><path d="M572,342 C660,290 660,430 574,380" marker-end="url(#arP1)"/></g><g font-size="22" fill="#1f2937"><text x="290" y="140" text-anchor="middle">chữ, _</text><text x="290" y="335" text-anchor="middle">số</text><text x="800" y="215" text-anchor="middle">&lt;</text><text x="1175" y="215" text-anchor="middle">=</text><text x="665" y="106">chữ, số, gạch dưới</text><text x="665" y="366">số</text><text x="1175" y="330" text-anchor="middle" fill="#059669">vòng kép = chấp nhận được</text></g><text x="750" y="455" font-size="22" text-anchor="middle" fill="#eb6834">đọc &lt;=1: qua &lt; (nhớ), qua &lt;= (nhớ), gặp 1 thì kẹt → lùi về lần nhớ cuối: &lt;=</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một phần ô-tô-mát của bộ phân tích, mỗi vòng tròn là một trạng thái, vòng kép là trạng thái chấp nhận được, tức là đã đọc đủ một từ tố. Từ trạng thái đầu, gặp chữ hay gạch dưới thì sang trạng thái tên và ở lại đó khi gặp thêm chữ, số hay gạch dưới. Gặp số thì sang trạng thái số, còn gặp dấu nhỏ hơn thì sang trạng thái nhỏ hơn, gặp tiếp dấu bằng thì sang nhỏ hơn hoặc bằng. Đọc chuỗi nhỏ hơn bằng 1, máy qua hai trạng thái chấp nhận và nhớ cả hai, tới số 1 thì kẹt, nên lùi về lần nhớ cuối là nhỏ hơn hoặc bằng."

  - id: example
    kind: example
    title: "Cắt “if x1<=10” từng bước"
    checks:
      - "alg.lex('if x1<=10') == [('KHOA', 'if'), ('TEN', 'x1'), ('PHEP', '<='), ('SO', '10')]"
      - "alg.lex('x1 = 42+y') == [('TEN', 'x1'), ('PHEP', '='), ('SO', '42'), ('PHEP', '+'), ('TEN', 'y')]"
    steps:
      - show: |
          <table class="t"><tr><th>Bước một — vị trí 0</th><th>từ tố</th></tr>
          <tr><td>mẫu tên khớp <code>if</code>, dừng ở khoảng trắng (dài 2); mẫu từ khoá cũng khớp dài 2 → hoà, từ khoá thắng</td><td>KHOA <code>if</code></td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bước một, ta bắt đầu cắt chuỗi từ vị trí đầu tiên, tức là vị trí 0. Ở vị trí 0, đoạn khớp dài nhất là hai chữ i f, dừng ở khoảng trắng, và là từ khoá. Mẫu tên và mẫu từ khoá cùng khớp dài 2 ký tự, hoà nhau, nên theo luật ưu tiên, từ khoá thắng."
      - show: |
          <table class="t"><tr><th>Bước 2 — vị trí 2 rồi 3</th><th>từ tố</th></tr>
          <tr><td>vị trí 2 là khoảng trắng: khớp mẫu khoảng trắng, bỏ đi</td><td>—</td></tr>
          <tr><td>vị trí 3: mẫu tên khớp <code>x1</code>, dừng ở <code>&lt;</code> (dài 2)</td><td>TEN <code>x1</code></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, sau từ khoá, ta xét tiếp vị trí 2 rồi tới vị trí 3. Vị trí 2 là khoảng trắng, khớp mẫu khoảng trắng rồi bị bỏ đi, không thành từ tố. Ở vị trí 3, mẫu tên khớp x1 dài 2 ký tự, dừng ở dấu nhỏ hơn vì dấu đó không phải chữ hay số, nên ta được một tên."
      - show: |
          <table class="t"><tr><th>Bước 3 — vị trí 5</th><th>từ tố</th></tr>
          <tr><td><code>&lt;</code> dài 1 khớp; <code>&lt;=</code> dài 2 cũng khớp → lấy dài nhất</td><td>PHEP <code>&lt;=</code></td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, sau tên x1, ta tiếp tục cắt từ vị trí 5. Ở vị trí 5, nhỏ hơn hoặc bằng dài 2 ký tự, hơn dấu nhỏ hơn dài 1, nên theo luật khớp dài nhất ta được một phép nhỏ hơn hoặc bằng."
      - show: |
          <table class="t"><tr><th>Bước 4 — vị trí 7</th><th>từ tố</th></tr>
          <tr><td>mẫu số khớp <code>10</code> (dài 2), hết chuỗi ở vị trí 9</td><td>SO <code>10</code></td></tr></table>
          <p class="note">Tương tự <code>x1 = 42+y</code> → $\hl{5}$ từ tố: <code>x1</code> <code>=</code> <code>42</code> <code>+</code> <code>y</code>.</p>
        focus: [1, "1.2", 2]
        say: "Bước bốn, sau phép so sánh, ta cắt nốt phần còn lại từ vị trí 7. Ở vị trí 7 là số 10, mẫu số khớp hai chữ số rồi hết chuỗi, nên chuỗi được cắt thành 4 từ tố. Tương tự, dòng x1 bằng 42 cộng y cho đúng 5 từ tố."

  - id: check
    kind: check
    title: "Tự kiểm: ghép lại và hỏi một bộ cắt thật"
    checks:
      - "2 + 1 + 2 + 2 + 2 == len('if x1<=10') and 'if' + ' ' + 'x1' + '<=' + '10' == 'if x1<=10'"
      - "(lambda tk, io: [t.string for t in tk.generate_tokens(io.StringIO('if x1<=10\\n').readline) if t.type in (tk.NAME, tk.OP, tk.NUMBER)])(__import__('tokenize'), __import__('io')) == ['if', 'x1', '<=', '10']"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>ghép lại: <code>if</code> + khoảng trắng + <code>x1</code> + <code>&lt;=</code> + <code>10</code></td><td>độ dài 2 + 1 + 2 + 2 + 2 = 9 ✓, đúng chuỗi ban đầu</td></tr>
          <tr><td>bộ cắt từ tố của một ngôn ngữ phổ biến</td><td><code>if</code> <code>x1</code> <code>&lt;=</code> <code>10</code> — 4 từ tố ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, thứ nhất, ghép các từ tố và khoảng trắng lại phải ra đúng chuỗi ban đầu, vì cắt đúng thì không thừa không thiếu ký tự nào. Độ dài cộng lại là 2 cộng 1 cộng 2 cộng 2 cộng 2, bằng 9, khớp 9 ký tự của chuỗi. Thứ hai, đưa cùng dòng này cho bộ cắt từ tố có sẵn của một ngôn ngữ phổ biến, nó cũng cho đúng 4 từ tố như ta cắt tay."

  # ───────────────────────── 5. ÔTÔMAT ─────────────────────────
  - id: automaton
    kind: concept
    title: "Bên trong: một ôtômat hữu hạn"
    steps:
      - show: |
          <p>Một <b>ôtômat hữu hạn</b> là một cỗ máy có hữu hạn trạng thái: đọc một ký tự thì đi theo mũi tên mang ký tự đó sang trạng thái kế, như hình vừa xem. Người ta đã chứng minh mỗi biểu thức chính quy đổi được thành một ôtômat hữu hạn; ghép mọi mẫu lại thành <b>một</b> ôtômat lớn.</p>
          <div class="box key">Bộ phân tích đọc từng ký tự, đi theo ôtômat, <b>nhớ lần cuối</b> đi qua trạng thái chấp nhận. Khi kẹt, nó lùi về chỗ đó — đó chính là khớp dài nhất. Với các mẫu từ tố thông thường, mỗi ký tự chỉ xử lý vài lần: nhanh.</div>
        focus: [1, 1, 2, 2, 2]
        say: "Một ô-tô-mát hữu hạn là một cỗ máy có hữu hạn trạng thái, đọc một ký tự thì đi theo mũi tên mang ký tự đó sang trạng thái kế, như hình vừa xem. Người ta đã chứng minh mỗi biểu thức chính quy đổi được thành một ô-tô-mát hữu hạn, và ta ghép mọi mẫu lại thành một ô-tô-mát lớn. Bộ phân tích đọc từng ký tự, đi theo ô-tô-mát, và nhớ lần cuối cùng nó đi qua một trạng thái chấp nhận. Khi kẹt, nó lùi về chỗ đó, và đó chính là khớp dài nhất. Với các mẫu từ tố thông thường, mỗi ký tự chỉ được xử lý vài lần, nên rất nhanh."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.lex('x-1') == [('TEN', 'x'), ('PHEP', '-'), ('SO', '1')]"
      - "__import__('re').match('<|<=', '<=').group() == '<' and __import__('re').match('<=|<', '<=').group() == '<='"
      - "[t for _, t in alg.lex('a<=b')] == ['a', '<=', 'b']"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy đoạn khớp đầu tiên thay vì dài nhất <b class="red">(sai)</b>
          <br><span class="note"><code>x1</code> thành tên <code>x</code> rồi số <code>1</code>; <code>&lt;=</code> thành hai từ tố. Mọi thứ phía sau hỏng theo.</span></div>
          <table class="t"><tr><th>cách cắt</th><th><code>x1</code></th><th><code>&lt;=</code></th></tr>
          <tr><td>khớp dài nhất</td><td>1 từ tố</td><td>1 từ tố</td></tr><tr><td>khớp đầu tiên</td><td><b class="red">2 từ tố</b></td><td><b class="red">2 từ tố</b></td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, lấy đoạn khớp đầu tiên thay vì dài nhất. Khi đó x1 thành tên x rồi số 1, nhỏ hơn hoặc bằng thành hai từ tố, và mọi thứ phía sau hỏng theo."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> So khớp từ khoá như tiền tố <b class="red">(sai)</b>
          <br><span class="note"><code>ifx</code>, <code>returned</code> là tên. Từ khoá chỉ thắng khi khớp <b>trọn</b> cả từ.</span></div>
        say: "Lỗi thứ hai, so khớp từ khoá như một tiền tố. Chuỗi i f x, hay từ khoá trả về có thêm đuôi e d, đều là tên, từ khoá chỉ thắng khi khớp trọn cả từ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bắt dấu âm trong từ tố số <b class="red">(rủi ro)</b>
          <br><span class="note"><code>x-1</code> phải là tên, phép trừ, số 1. Nếu mẫu số nhận cả dấu âm, khớp dài nhất cho <code>x</code> rồi số <code>-1</code>: hai giá trị đứng cạnh nhau, câu hỏng. Dấu âm để pha cú pháp lo.</span></div>
        say: "Lỗi thứ ba, cho mẫu số nhận cả dấu âm. Dòng x trừ 1 phải là tên, phép trừ, rồi số 1. Nếu mẫu số nhận dấu âm, khớp dài nhất sẽ cho x rồi số âm 1, hai giá trị đứng cạnh nhau và câu hỏng, nên dấu âm phải để pha cú pháp lo."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tự viết bộ cắt bằng một biểu thức chính quy gộp các phép bằng dấu “hoặc”, đặt phép ngắn trước.</div>
          <table class="t"><tr><th>mẫu gộp</th><th>chuỗi vào</th><th>đoạn lấy được</th></tr>
          <tr><td><code>&lt;|&lt;=</code> (ngắn trước)</td><td><code>&lt;=</code></td><td><b class="red">&lt;</b> — còn lại <code>=</code> lẻ</td></tr>
          <tr><td><code>&lt;=|&lt;</code> (dài trước)</td><td><code>&lt;=</code></td><td><b>&lt;=</b> ✓</td></tr></table>
          <p class="note">Bộ máy biểu thức chính quy thường dùng thử các nhánh “hoặc” <b>theo thứ tự</b> và dừng ở nhánh đầu khớp — không tự tìm dài nhất. Người có kinh nghiệm xếp phép dài trước, như mẫu PHEP của bài, và thử mọi phép hai ký tự.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tự viết bộ cắt từ tố bằng một biểu thức chính quy gộp các phép bằng dấu hoặc, mà đặt phép ngắn trước. Với mẫu nhỏ hơn hoặc nhỏ hơn bằng, chuỗi nhỏ hơn bằng chỉ lấy được dấu nhỏ hơn, để lại một dấu bằng lẻ loi, và pha cú pháp báo lỗi ở chỗ chẳng ai ngờ. Đảo thứ tự, đặt phép dài trước, thì lấy đúng nhỏ hơn hoặc bằng. Lý do là bộ máy biểu thức chính quy thường thử các nhánh hoặc theo thứ tự, dừng ở nhánh đầu tiên khớp, chứ không tự tìm đoạn dài nhất. Vì vậy người có kinh nghiệm luôn xếp phép dài trước, như mẫu phép của bài này, và viết phép thử cho từng phép hai ký tự."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.lex('count2>=c') == [('TEN', 'count2'), ('PHEP', '>='), ('TEN', 'c')]"
      - "alg.lex('while1 = 2') == [('TEN', 'while1'), ('PHEP', '='), ('SO', '2')]"
      - "'count2>=c'.index('>=') == 6 and 'count2>=c'.index('c', 1) == 8 and 'while1 = 2'.index('=') == 7 and 'while1 = 2'.index('2') == 9"
    steps:
      - show: |
          <p>Cắt thành từ tố và ghi loại:</p>
          <table class="t"><tr><th>dòng</th><th>chuỗi cần cắt</th></tr><tr><td>1</td><td><code>count2&gt;=c</code></td></tr><tr><td>2</td><td><code>while1 = 2</code></td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, hãy cắt hai dòng trên màn hình thành từ tố và ghi loại của từng từ tố. Dòng một gồm một tên có số 2 ở cuối, dấu lớn hơn hoặc bằng, rồi chữ c. Dòng hai bắt đầu bằng từ khoá lặp viết liền với số 1. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>chuỗi ①, vị trí</th><th>đoạn khớp dài nhất</th><th>từ tố</th></tr>
          <tr><td>0</td><td><code>count2</code> (6 ký tự, dừng ở <code>&gt;</code>)</td><td>TEN</td></tr>
          <tr><td>6</td><td><code>&gt;=</code> dài 2, hơn <code>&gt;</code> dài 1</td><td>PHEP</td></tr>
          <tr><td>8</td><td><code>c</code></td><td>TEN</td></tr></table>
          <p>→ $\hl{3}$ từ tố.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Đáp án dòng một, cắt từ vị trí 0. Mẫu tên khớp cả 6 ký tự, gồm chữ và số 2 ở cuối, dừng ở dấu lớn hơn, nên là một tên. Ở vị trí 6, lớn hơn hoặc bằng dài 2 ký tự, hơn dấu lớn hơn dài 1, nên là một phép. Ở vị trí 8, chữ c là một tên. Vậy dòng một có 3 từ tố."
      - show: |
          <table class="t"><tr><th>chuỗi ②, vị trí</th><th>đoạn khớp dài nhất</th><th>từ tố</th></tr>
          <tr><td>0</td><td>mẫu tên khớp 6 ký tự <code>while1</code>; từ khoá chỉ khớp 5 → tên dài hơn thắng</td><td>TEN</td></tr>
          <tr><td>7</td><td><code>=</code></td><td>PHEP</td></tr>
          <tr><td>9</td><td><code>2</code></td><td>SO</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Dòng hai, cũng cắt từ vị trí 0. Mẫu tên khớp 6 ký tự, còn từ khoá lặp chỉ khớp 5 ký tự, nên đoạn dài hơn thắng, và đây là một tên chứ không phải từ khoá. Sau khoảng trắng, ở vị trí 7 là phép bằng. Cuối cùng, ở vị trí 9 là số 2, tổng cộng cũng 3 từ tố."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mỗi loại từ tố = một biểu thức chính quy</span><span class="a">→</span>
          <span class="n">khớp dài nhất</span><span class="a">→</span>
          <span class="n">hoà: mẫu trước thắng</span><span class="a">→</span>
          <span class="n">chạy bằng ôtômat, nhanh</span></div>
        say: "Tổng kết lại, mỗi loại từ tố là một biểu thức chính quy. Ta lấy đoạn khớp dài nhất, nếu hoà thì mẫu khai báo trước thắng, và cả bộ phân tích chạy bằng một ô-tô-mát, rất nhanh."
      - show: |
          <div class="box key"><b>Tư duy:</b> một luật đơn giản, áp dụng nhất quán (luôn lấy dài nhất), loại bỏ mọi chỗ mơ hồ — không cần liệt kê từng trường hợp.</div>
        say: "Điều cần mang theo, một luật đơn giản được áp dụng nhất quán, như luôn lấy đoạn dài nhất, sẽ loại bỏ mọi chỗ mơ hồ mà không cần liệt kê từng trường hợp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): ghép từ tố thành cây — <b>phân tích cú pháp đệ quy xuống</b> và độ ưu tiên toán tử.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta ghép từ tố thành cây bằng phân tích cú pháp đệ quy xuống, và xử lý độ ưu tiên toán tử. Hẹn gặp bạn ở bài tiếp theo."
