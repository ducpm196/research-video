id: L07
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 7 — Hàm bậc cao và bao đóng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L07; audit/plc/verify_plc.py L07; H. Abelson, G. J. Sussman, SICP, 2nd ed. (1996), mục 1.3 và 3.2; P. J. Landin, The Mechanical Evaluation of Expressions, The Computer Journal 6(4), 1964"
assumes: [arith]
# Quy ước: mã minh hoạ kiểu Python (def, lambda, nonlocal); lời đọc mô tả bằng tiếng Việt. Bao đóng = hàm + môi trường nó bắt
#   (phạm vi tĩnh, bài 4). Kết quả chạy thật bằng alg.make_counter, alg.late_binding và lambda Python trong checks.
objectives:
  - "Dùng hàm như giá trị: truyền vào, trả ra"
  - "Hiểu bao đóng là hàm cộng môi trường"
  - "Tránh lỗi bao đóng trong vòng lặp"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Biến cục bộ lẽ ra phải mất khi hàm trả về"
    steps:
      - show: |
          <div class="code"><div>def make_counter():</div><div>    n = 0</div><div>    def inc():</div><div>        nonlocal n; n += 1; return n</div><div>    return inc</div></div>
          <p><code>make_counter()</code> đã trả về, vậy mà mỗi lần gọi <code>inc</code> thì <code>n</code> vẫn còn và tăng dần. <code>n</code> sống ở đâu?</p>
          <div class="box key">Hôm nay: <b>hàm bậc cao</b> và <b>bao đóng</b>.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hàm tạo bộ đếm đặt n bằng 0, định nghĩa một hàm trong tăng n thêm 1 rồi trả n, và trả về chính hàm trong đó. Hàm tạo bộ đếm đã trả về, vậy mà mỗi lần gọi hàm trong, biến n vẫn còn và tăng dần. Vậy n sống ở đâu? Hôm nay ta học hàm bậc cao và bao đóng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hàm gán được cho biến, và phạm vi tĩnh"
    checks:
      - "(lambda d: exec('def double(x): return x * 2\\nf = double\\nr = (f(4), f is double)\\n', d) or d['r'] == (8, True))({})"
      - "alg.shadow_late() == 21"
    steps:
      - show: |
          <div class="code"><div>def double(x): return x * 2</div><div>f = double        <span class="cm"># không gọi, chỉ gán</span></div><div>f(4)              <span class="cm"># 8</span></div></div>
          <p>Viết tên hàm <b>không có ngoặc</b> là lấy chính hàm, như lấy một con số. Gán nó cho <code>f</code> thì <code>f</code> và <code>double</code> là cùng một hàm.</p>
        focus: [1, 1, 2, 2]
        say: "Trước hết, ôn lại một điều nghe lạ với người mới, hàm cũng là một giá trị như con số. Hàm nhân đôi nhận x và trả x nhân 2. Viết tên hàm mà không có cặp ngoặc là lấy chính cái hàm, chưa chạy nó, và ta gán nó cho biến f. Gọi f với 4 thì được 8, vì f và hàm nhân đôi là cùng một hàm."
      - show: |
          <div class="code"><div>def outer():</div><div>    y = 10</div><div>    def inner(): return y + 1</div><div>    y = 20</div><div>    return inner()     <span class="cm"># 21</span></div></div>
          <p>Ở bài 4 ta đã thấy <b>phạm vi tĩnh</b>: tên <code>y</code> trong <code>inner</code> trỏ tới <b>biến</b> <code>y</code> của nơi <code>inner</code> được viết, và giá trị đọc lúc gọi.</p>
        focus: [1, 1, 2, 2]
        say: "Điều thứ hai là phạm vi tĩnh, đã học ở bài 4. Hàm ngoài đặt y bằng 10, viết hàm trong trả y cộng 1, rồi đổi y thành 20 và gọi hàm trong, kết quả là 21. Tên y trong hàm trong trỏ tới biến y của nơi hàm trong được viết ra. Giá trị của biến đó được đọc lúc gọi, khi y đã là 20."

  - id: sym
    kind: symbol
    title: "Giải mã: hàm là giá trị"
    checks:
      - "list(map(lambda x: x * 2, [1, 2, 3])) == [2, 4, 6]"
    steps:
      - show: |
          <p><b>Hàm bậc cao</b>: hàm nhận hàm làm đối, hoặc trả về hàm. Ví dụ <code>map(lambda x: x * 2, [1, 2, 3])</code> → <code>[2, 4, 6]</code>.</p>
          <p><code>lambda x: x * 2</code> là một hàm không tên, viết ngay tại chỗ.</p>
          <p><b>Bao đóng</b> = mã của hàm + <b>môi trường</b> nơi nó được tạo ra (phạm vi tĩnh, bài 4). Hàm mang theo môi trường đó đi bất cứ đâu.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Hàm bậc cao là hàm nhận một hàm làm đối, hoặc trả về một hàm. Ví dụ hàm ánh xạ nhận hàm nhân đôi và danh sách 1, 2, 3, trả về 2, 4, 6. Hàm nhân đôi ở đây là một hàm không tên, viết ngay tại chỗ. Bao đóng là mã của hàm cộng với môi trường nơi nó được tạo ra, theo phạm vi tĩnh ở bài 4. Hàm mang môi trường đó theo đi bất cứ đâu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: bao đóng là hàm cầm sợi dây nối tới môi trường"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arP7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><g font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="300" y="40">ngăn xếp</text><text x="1080" y="40">đống</text></g><line x1="640" y1="20" x2="640" y2="420" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 8"/><rect x="80" y="70" width="440" height="110" rx="14" fill="#f3f4f6" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 8"/><text x="300" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">lời gọi tạo bộ đếm</text><text x="300" y="156" font-size="26" text-anchor="middle" fill="#1f2937">đã trả về, bị gỡ</text><rect x="80" y="240" width="200" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="180" y="282" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">c1</text><text x="180" y="326" font-size="26" text-anchor="middle" fill="#1f2937">hàm trong</text><rect x="320" y="240" width="200" height="110" rx="14" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="420" y="282" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">c2</text><text x="420" y="326" font-size="26" text-anchor="middle" fill="#1f2937">hàm trong</text><rect x="820" y="90" width="520" height="110" rx="14" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="1080" y="132" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">môi trường thứ nhất</text><text x="1080" y="176" font-size="26" text-anchor="middle" fill="#1f2937">n ↦ 3</text><rect x="820" y="270" width="520" height="110" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="1080" y="312" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">môi trường thứ hai</text><text x="1080" y="356" font-size="26" text-anchor="middle" fill="#1f2937">n ↦ 1</text><path d="M180,240 C180,205 600,210 814,165" fill="none" stroke="#2a78d6" stroke-width="4" marker-end="url(#arP7)"/><path d="M420,350 C420,400 620,325 814,325" fill="none" stroke="#2a78d6" stroke-width="4" marker-end="url(#arP7)"/><text x="300" y="405" font-size="22" text-anchor="middle" fill="#b91c1c">mỗi bộ đếm giữ một môi trường riêng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình chia bộ nhớ làm hai vùng, ngăn xếp bên trái và đống bên phải. Lời gọi tạo bộ đếm đã trả về, nên khung của nó trên ngăn xếp bị gỡ, như ô viền đỏ đứt nét. Nhưng môi trường chứa biến n không nằm trong khung đó, nó nằm trên đống. Mỗi bộ đếm c1 và c2 cầm một sợi dây màu xanh nối tới môi trường riêng của mình, nên còn dây thì môi trường còn sống."

  - id: example
    kind: example
    title: "Hai bộ đếm, hai môi trường"
    checks:
      - "(lambda c1, c2: [c1(), c1(), c1(), c2()])(alg.make_counter(), alg.make_counter()) == [1, 2, 3, 1]"
    steps:
      - show: |
          <div class="code"><div>c1 = make_counter()</div></div>
          <p><b>Bước một:</b> lời gọi tạo <b>môi trường thứ nhất</b> chứa <code>n = 0</code>, rồi trả về hàm trong. <code>c1</code> giữ hàm đó cùng sợi dây tới môi trường thứ nhất.</p>
        focus: [1, 2, 2]
        say: "Bước một, gán c1 bằng kết quả gọi hàm tạo bộ đếm. Lời gọi này tạo môi trường thứ nhất chứa n bằng 0, rồi trả về hàm trong. Biến c1 giữ hàm trong đó, cùng sợi dây nối tới môi trường thứ nhất."
      - show: |
          <div class="code"><div>c2 = make_counter()</div></div>
          <p><b>Bước 2:</b> gọi lại lần nữa tạo <b>môi trường thứ hai</b>, với một <code>n = 0</code> <b>khác</b>. <code>c2</code> nối tới môi trường thứ hai.</p>
        focus: [1, 2, 2]
        say: "Bước hai, gán c2 bằng kết quả gọi hàm tạo bộ đếm thêm một lần nữa. Lời gọi mới tạo môi trường thứ hai, với một biến n bằng 0 hoàn toàn khác biến n của c1. Biến c2 giữ sợi dây nối tới môi trường thứ hai."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 3 — lời gọi</th><th>n của môi trường thứ nhất</th><th>trả về</th></tr>
          <tr><td><code>c1()</code></td><td>0 → 1</td><td>1</td></tr>
          <tr><td><code>c1()</code></td><td>1 → 2</td><td>2</td></tr>
          <tr><td><code>c1()</code></td><td>2 → 3</td><td>$\hl{3}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước ba, gọi c1 ba lần, mỗi lần tăng n của môi trường thứ nhất thêm 1. Lần đầu n đi từ 0 lên 1 và trả 1. Lần hai n lên 2 và trả 2. Lần ba n lên 3 và trả 3."
      - show: |
          <p><b>Bước 4:</b> <code>c2()</code> tăng n của <b>môi trường thứ hai</b>: 0 → 1, trả $\hl{1}$, không phải 4.</p>
          <div class="box key">Vì còn bao đóng trỏ tới, môi trường không bị xoá khi hàm trả về — nó nằm trên <b>đống</b>, không nằm trên ngăn xếp.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, gọi c2 một lần. Nó tăng n của môi trường thứ hai từ 0 lên 1, nên trả về 1 chứ không phải 4. Vì còn bao đóng trỏ tới, môi trường không bị xoá khi hàm trả về, nó nằm trên đống chứ không nằm trên ngăn xếp."

  - id: check
    kind: check
    title: "Tự kiểm: gọi xen kẽ và nhìn thẳng vào môi trường"
    checks:
      - "(lambda c1, c2: [c1(), c2(), c1(), c1()] == [1, 1, 2, 3] and c1.__closure__[0].cell_contents == 3 and c2.__closure__[0].cell_contents == 1 and c1 is not c2)(alg.make_counter(), alg.make_counter())"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>gọi xen kẽ: c1, c2, c1, c1</td><td>1, 1, 2, 3</td></tr>
          <tr><td>đọc thẳng biến n mà c1 đang giữ</td><td>3 ✓</td></tr>
          <tr><td>đọc thẳng biến n mà c2 đang giữ</td><td>1 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta làm hai việc mà ví dụ chưa làm. Gọi xen kẽ c1, c2, c1, c1 trên hai bộ đếm mới, được 1, 1, 2, 3, nghĩa là c2 không làm xáo trộn đếm của c1. Sau đó ta nhờ máy mở bao đóng ra và đọc thẳng biến n mà c1 giữ, thấy bằng 3. Biến n mà c2 giữ bằng 1, khớp hai sợi dây trong hình."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.late_binding() == ([2, 2, 2], [0, 1, 2])"
      - "(lambda d: exec('def make_cached():\\n    c = {}\\n    def g(x):\\n        if x not in c:\\n            c[x] = x * x\\n        return c[x]\\n    return g, c\\ng, c = make_cached()\\nfor i in range(1000):\\n    g(i)\\nr = len(c)\\n', d) or d['r'] == 1000)({})"
      - "(lambda d: exec('import functools\\n@functools.lru_cache(maxsize=128)\\ndef h(x):\\n    return x * x\\nfor i in range(1000):\\n    h(i)\\nr = h.cache_info().currsize\\n', d) or d['r'] == 128)({})"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tạo bao đóng trong vòng lặp <b class="red">(bất ngờ)</b>
          <div class="code"><div>fs = [lambda: i for i in range(3)]</div><div>[f() for f in fs]          <span class="cm"># [2, 2, 2], không phải [0, 1, 2]</span></div></div>
          <span class="note">Ba hàm cùng giữ <b>một biến</b> <code>i</code>; gọi sau vòng lặp, <code>i</code> đã là 2. Sửa: <code>lambda i=i: i</code> chụp giá trị lúc tạo → <code>[0, 1, 2]</code>.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ nhất, tạo bao đóng trong vòng lặp. Ba hàm không tên cùng giữ một biến i duy nhất, chứ không phải ba giá trị. Gọi sau vòng lặp thì i đã là 2, nên kết quả là 2, 2, 2. Sửa bằng cách truyền i làm giá trị mặc định, để chụp giá trị lúc tạo, được 0, 1, 2."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên khai báo biến ngoài khi muốn gán lại <b class="red">(lỗi)</b>
          <br><span class="note">Bỏ <code>nonlocal n</code>: <code>n += 1</code> biến <code>n</code> thành biến cục bộ của <code>inc</code> → đọc trước khi gán (như bài 4).</span></div>
        say: "Lỗi thứ hai, quên khai báo biến ngoài khi muốn gán lại. Bỏ dòng khai báo đó thì phép tăng n biến n thành biến cục bộ của hàm trong, và lại gặp lỗi đọc trước khi gán như bài 4."
      - show: |
          <div class="box warn"><b>Lỗi 3.</b> Giữ bao đóng lâu mà quên nó giữ cả môi trường <b class="red">(rò bộ nhớ)</b>
          <br><span class="note">Bao đóng giữ cả biến lớn (danh sách triệu phần tử) trong môi trường của nó còn sống theo.</span></div>
        say: "Lỗi thứ ba, giữ một bao đóng lâu mà quên rằng nó giữ cả môi trường. Một biến lớn, như danh sách hàng triệu phần tử nằm trong môi trường đó, sẽ còn sống theo bao đóng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Dùng bao đóng làm <b>bộ nhớ đệm</b> không giới hạn trong một dịch vụ chạy lâu.</div>
          <div class="code"><div>def make_cached():</div><div>    c = {}</div><div>    def g(x):</div><div>        if x not in c: c[x] = x * x</div><div>        return c[x]</div><div>    return g</div></div>
          <table class="t"><tr><th>số giá trị x khác nhau đã gọi</th><th>mục còn giữ, không giới hạn</th><th>mục còn giữ, giới hạn 128</th></tr>
          <tr><td>1000</td><td>$\hl{1000}$</td><td>128</td></tr></table>
          <p class="note">Từ điển <code>c</code> sống theo bao đóng: không ai xoá thì nó lớn mãi. Đặt giới hạn số mục, bỏ mục lâu không dùng.</p>
        focus: [1, 2, 3, "3.2", 4, 4]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, dùng bao đóng làm bộ nhớ đệm không giới hạn trong một dịch vụ chạy nhiều ngày. Hàm trong nhớ kết quả của mỗi x vào từ điển c nằm trong môi trường của bao đóng. Ta cho máy gọi với 1000 giá trị x khác nhau và đếm, từ điển giữ đủ 1000 mục. Nếu đặt giới hạn 128 mục thì chỉ còn 128 mục. Từ điển sống theo bao đóng, nên không ai xoá thì nó lớn mãi, tới khi máy hết bộ nhớ. Người có kinh nghiệm luôn đặt giới hạn số mục và bỏ đi mục lâu không dùng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda make_adder: (make_adder(5)(3), make_adder(10)(make_adder(5)(1))))(lambda n: (lambda x: x + n)) == (8, 16)"
    steps:
      - show: |
          <div class="code"><div>def make_adder(n): return lambda x: x + n</div><div>add5 = make_adder(5); add10 = make_adder(10)</div></div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td><code>add5(3)</code> = ?</td></tr>
          <tr><td>2</td><td><code>add10(add5(1))</code> = ?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Hàm tạo phép cộng nhận n và trả về hàm cộng thêm n, ta tạo một hàm cộng 5 và một hàm cộng 10. Câu một, hàm cộng 5 áp dụng cho 3 được bao nhiêu? Câu hai, hàm cộng 10 áp dụng cho kết quả của hàm cộng 5 với 1 được bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>kết quả</th></tr>
          <tr><td><code>add5</code> giữ môi trường có n = 5</td><td>—</td></tr>
          <tr><td>x = 3 → x cộng n</td><td>$3 + 5 = \hl{8}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, giải từng bước. Hàm cộng 5 giữ môi trường có n bằng 5. Gọi nó với x bằng 3, nó trả x cộng n, tức là 3 cộng 5 bằng 8."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>kết quả</th></tr>
          <tr><td>trong trước: <code>add5(1)</code>, n = 5</td><td>$1 + 5 = 6$</td></tr>
          <tr><td>ngoài sau: <code>add10(6)</code>, n = 10</td><td>$6 + 10 = \hl{16}$</td></tr></table>
          <p class="note">Mỗi hàm nhớ <code>n</code> riêng của nó.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, tính lời gọi bên trong trước. Hàm cộng 5 áp dụng cho 1, với n bằng 5, được 6. Rồi hàm cộng 10 áp dụng cho 6, với n bằng 10 của môi trường riêng nó, được 16. Hai hàm không giẫm lên nhau, vì mỗi hàm nhớ biến n riêng của nó."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hàm là giá trị</span><span class="a">→</span>
          <span class="n">bao đóng = mã + môi trường</span><span class="a">→</span>
          <span class="n">mỗi lần tạo một môi trường mới</span><span class="a">→</span>
          <span class="n">bắt biến, không bắt giá trị</span></div>
        say: "Tổng kết lại, hàm là một giá trị. Bao đóng là mã cộng với môi trường, mỗi lần tạo sinh ra một môi trường mới, và bao đóng bắt biến chứ không bắt giá trị."
      - show: |
          <div class="box key"><b>Tư duy:</b> đóng gói dữ liệu cùng với hành vi dùng nó — một bao đóng là một “đối tượng” nhỏ có một phương thức.</div>
        say: "Điều cần mang theo, hãy đóng gói dữ liệu cùng với hành vi dùng nó. Một bao đóng chính là một đối tượng nhỏ có đúng một phương thức."
