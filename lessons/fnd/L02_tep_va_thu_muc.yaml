    say: Hình thứ hai so một dấu lớn hơn với hai dấu lớn hơn. Tệp đang có hai dòng.
      Một dấu bắt đầu lại từ trống, nên hai dòng cũ mất và chỉ còn dòng mới. Hai dấu
      viết tiếp phía dưới, nên hai dòng cũ vẫn còn và thêm dòng mới ở cuối.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: dấu sao do chương trình cửa sổ lệnh mở ra, không phải
    lệnh'
  checks:
  - len('a.txt b.txt'.split()) == 2
  - len('a.txt b.txt c.png .txt'.split()) == 4
  - len('c.png') - len('.png') == 1
  steps:
  - show: <p><b>Bước 1. Thử với tệp có thật</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>touch a.txt b.txt c.png</div><div><span class="cm"><span>&#36;</span>
      </span>echo *.txt</div><div>a.txt b.txt</div></div><p>Vì <code>echo</code> chỉ
      in lại các tham số, nó cho ta thấy <b>máy đã đổi mẫu thành gì</b> trước khi
      lệnh chạy.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, thử với tệp có thật. Vì lệnh in chữ chỉ in lại các tham số, nó
      cho ta thấy máy đã đổi mẫu thành những gì, trước khi lệnh chạy. Mẫu sao chấm
      t x t được đổi thành hai tên tệp là a chấm t x t và b chấm t x t.
  - show: '<p><b>Bước 2. Dấu sao một mình khớp mọi tệp</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo *</div><div>a.txt b.txt c.png</div><div><span
      class="cm"><span>&#36;</span> </span>echo * .txt</div><div>a.txt b.txt c.png
      .txt</div></div><p>Nên <code>rm *</code> thành <code>rm a.txt b.txt c.png</code>:
      lệnh xoá <b>không hề thấy dấu sao</b>, chỉ thấy danh sách tên.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, dấu sao đứng một mình khớp mọi tệp. Vì vậy lệnh xoá với dấu sao
      thành lệnh xoá với cả ba tên tệp. Lệnh xoá không hề thấy dấu sao, nó chỉ thấy
      danh sách tên đã được mở ra.
  - show: '<p><b>Bước 3. Dấu cách chia mẫu thành hai</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo * .txt</div><div>a.txt b.txt c.png
      .txt</div></div><p>Vì dấu cách ngăn tham số, <code>* .txt</code> là hai tham
      số: <code>*</code> mở thành <b>mọi tên</b>, cộng thêm chữ <code>.txt</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, dấu cách chia mẫu thành hai tham số. Vì dấu cách ngăn các tham số,
      sao cách chấm t x t là hai mẫu. Mẫu sao mở thành mọi tên, và còn thêm chữ chấm
      t x t đứng riêng. Đó chính là nguyên nhân của tai nạn đầu bài.
  - show: '<p><b>Bước 4. Dấu hỏi: đúng một ký tự</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo ?.png</div><div>c.png</div><div><span
      class="cm"><span>&#36;</span> </span>echo ??.png</div><div>??.png</div></div><p>Vì
      <code>?</code> khớp <b>đúng một</b> ký tự, <code>?.png</code> khớp <code>c.png</code>.
      Mẫu <b>không khớp</b> gì thì máy giữ nguyên chữ, như <code>??.png</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, dấu hỏi. Vì dấu hỏi khớp đúng một ký tự, nên mẫu hỏi chấm p n g
      khớp c chấm p n g. Hai dấu hỏi thì cần hai ký tự, không có tệp nào khớp. Khi
      mẫu không khớp tệp nào, máy giữ nguyên chữ của mẫu, và đó cũng là một dấu hiệu
      bạn gõ sai.
- id: example
  kind: example
  title: 'Ví dụ: dựng, ghi, chép, đổi tên, xoá: năm phép làm'
  checks:
  - len(['dong 1', 'dong 2']) == 2
  - len(['ghi de']) == 1
  steps:
  - show: <p><b>① Dựng cây du_an</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>mkdir -p du_an/nguon du_an/sao_luu</div><div><span class="cm"><span>&#36;</span>
      </span>cd du_an</div><div><span class="cm"><span>&#36;</span> </span>touch nguon/main.txt</div><div><span
      class="cm"><span>&#36;</span> </span>ls -R</div><div>.:</div><div>nguon/  sao_luu/</div><div>
      </div><div>./nguon:</div><div>main.txt</div><div> </div><div>./sao_luu:</div></div><p><code>mkdir
      -p</code> tạo hai thư mục cùng lúc; <code>touch</code> tạo tệp rỗng <code>main.txt</code>;
      <code>ls -R</code> liệt kê cả thư mục con.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép thứ nhất, dựng cây. Lệnh tạo thư mục tạo hai thư mục một lúc, nguồn
      và sao lưu. Ta đi vào du án, tạo tệp rỗng main trong nguồn, rồi liệt kê cả các
      thư mục con bằng cờ chữ r hoa. Thư mục nguồn có một tệp, thư mục sao lưu còn
      trống.
  - show: <p><b>② Ghi bằng > rồi nối bằng >></b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo "dong 1" &gt; nguon/main.txt</div><div><span class="cm"><span>&#36;</span>
      </span>echo "dong 2" &gt;&gt; nguon/main.txt</div><div><span class="cm"><span>&#36;</span>
      </span>cat nguon/main.txt</div><div>dong 1</div><div>dong 2</div></div><p>Lệnh
      đầu ghi vào tệp trống; lệnh sau <b>nối</b> dòng thứ hai xuống dưới; <code>cat</code>
      cho thấy cả hai.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép thứ hai, ghi vào tệp. Dấu lớn hơn đưa dòng một vào tệp. Hai dấu lớn
      hơn nối dòng hai xuống dưới. Lệnh in nội dung tệp cho thấy cả hai dòng, theo
      đúng thứ tự ghi.
  - show: '<p><b>③ Ghi đè: một dấu > xoá sạch nội dung cũ</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo "ghi de" &gt; nguon/main.txt</div><div><span
      class="cm"><span>&#36;</span> </span>cat nguon/main.txt</div><div>ghi de</div></div><p>Một
      dấu <code>&gt;</code> đã <b>mất hai dòng cũ</b>; không ai hỏi lại.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép thứ ba, ghi đè. Lần này ta dùng một dấu lớn hơn. Nội dung cũ có hai
      dòng mất hết, chỉ còn đúng dòng mới. Không có lời hỏi lại, nên một dấu thiếu
      có thể xoá dữ liệu quan trọng.
  - show: <p><b>④ Chép rồi đổi tên</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>cp nguon/main.txt sao_luu/ban_sao.txt</div><div><span class="cm"><span>&#36;</span>
      </span>mv sao_luu/ban_sao.txt sao_luu/ghi_chu.txt</div><div><span class="cm"><span>&#36;</span>
      </span>ls nguon sao_luu</div><div>nguon:</div><div>main.txt</div><div> </div><div>sao_luu:</div><div>ghi_chu.txt</div></div><p><code>cp</code>
      làm bản sao ở <code>sao_luu</code>; <code>mv</code> đổi tên bản sao; <code>main.txt</code>
      gốc vẫn ở <code>nguon</code>.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép thứ tư, chép rồi đổi tên. Lệnh chép làm bản sao sang thư mục sao lưu.
      Lệnh di chuyển đổi tên bản sao thành ghi chú. Tệp gốc vẫn nằm ở nguồn, nên cả
      hai thư mục đều có một tệp.
  - show: '<p><b>⑤ Xoá: tệp bằng rm, thư mục bằng rm -r</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>rm sao_luu/ghi_chu.txt</div><div><span
      class="cm"><span>&#36;</span> </span>ls sao_luu</div><div><span class="cm"><span>&#36;</span>
      </span>ls nguon</div><div>main.txt</div><div><span class="cm"><span>&#36;</span>
      </span>rm nguon</div><div>rm: cannot remove ''nguon'': Is a directory</div><div><span
      class="cm"><span>&#36;</span> </span>rm -r nguon</div></div><p>Thư mục cần cờ
      <code>-r</code> (xoá cả nội dung bên trong). Xoá tệp rồi, <code>ls</code> thấy
      thư mục trống.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Phép thứ năm, xoá. Xoá tệp ghi chú thì thư mục sao lưu trống. Lệnh xoá không
      có cờ từ chối xoá thư mục, và báo đó là một thư mục. Thêm cờ r thì xoá cả thư
      mục cùng mọi thứ bên trong, và thư mục nguồn biến mất. Chỉ còn lại sao lưu.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm bằng hai cách'
  checks:
  - 5 - 2 == 3
  steps:
  - show: '<p><b>Cách 1: đếm bằng ls, ống | và wc -l</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>touch a b c d e</div><div><span class="cm"><span>&#36;</span>
      </span>ls | wc -l</div><div>5</div><div><span class="cm"><span>&#36;</span>
      </span>rm a b</div><div><span class="cm"><span>&#36;</span> </span>ls | wc -l</div><div>3</div></div><p>Dấu
      <code>|</code> (ống) chuyển đầu ra của lệnh bên trái làm đầu vào cho lệnh bên
      phải; <code>wc -l</code> <b>đếm dòng</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    forward_ref: true
    say: Đường kiểm khác là đếm. Ta tạo năm tệp, rồi dùng dấu ống để chuyển danh sách
      của lệnh liệt kê cho lệnh đếm dòng. Dấu ống chuyển đầu ra của lệnh bên trái
      làm đầu vào cho lệnh bên phải. Ta được năm. Sau khi xoá hai tệp thì còn ba,
      vì năm trừ hai bằng ba.
  - show: '<p><b>Cách 2: đếm bằng một lệnh khác (find)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>find . -type f | wc -l</div><div>3</div></div><p>$5
      - 2 = \hl{3}$ và hai cách đếm cùng ra $3$ ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Cách thứ hai, dùng một lệnh khác để tìm các tệp rồi đếm. Kết quả vẫn là ba.
      Hai cách đếm khác nhau cùng ra ba, và khớp với phép trừ năm trừ hai, nên ta
      tin việc xoá đã làm đúng hai tệp.
- id: scale
  kind: concept
  title: 'Khi số tệp nhân lên: một lệnh xoá hay chép chạm tới bao nhiêu tệp?'
  checks:
  - 3 * 100 == 300
  - 3 * 1000 == 3000
  steps:
  - show: '<p><b>Cùng mẫu *.txt, ba quy mô</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>touch t{1..3}.txt</div><div><span class="cm"><span>&#36;</span> </span>ls
      *.txt | wc -l</div><div>3</div><div><span class="cm"><span>&#36;</span> </span>touch
      t{1..300}.txt</div><div><span class="cm"><span>&#36;</span> </span>ls *.txt
      | wc -l</div><div>300</div><div><span class="cm"><span>&#36;</span> </span>touch
      t{1..3000}.txt</div><div><span class="cm"><span>&#36;</span> </span>ls *.txt
      | wc -l</div><div>3000</div></div><p>Chữ <code>t{1..300}</code> là <b>dải số</b>:
      máy mở thành <code>t1 t2 … t300</code>. <code>ls *.txt | wc -l</code> đếm mẫu
      khớp bao nhiêu tệp.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ta tạo ba, rồi ba trăm, rồi ba nghìn tệp, cùng mẫu sao chấm t x t. Chữ trong
      ngoặc nhọn có hai dấu chấm là một dải số, máy mở thành các số liên tiếp. Lệnh
      đếm cho biết mẫu khớp bao nhiêu tệp, đó chính là số tệp một lệnh xoá cùng mẫu
      sẽ chạm tới.
  - show: '<table class=''t''><tr><th>số tệp khớp</th><th>xem bằng mắt</th><th>một
      lệnh xoá sai chạm tới</th></tr><tr><td>×1: 3</td><td>đọc được</td><td>3 tệp</td></tr><tr><td>×100:
      300</td><td>cuộn mãi</td><td>300 tệp</td></tr><tr><td>×1 000: 3 000</td><td>không
      đọc nổi</td><td>3 000 tệp, gần như tức thì</td></tr></table><div class=''box
      key''><b>Đánh đổi:</b> mẫu rộng thì tiện, nhưng sai một dấu là chạm tới cả nghìn
      tệp. Người làm nghề <b>xem trước</b> bằng <code>echo</code> hoặc đếm, và giữ
      bản sao lưu ở nơi khác, vì <code>rm</code> không hoàn tác.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bảng này cho thấy sức nặng của một mẫu. Ba tệp thì cứ mở ra và đọc bằng mắt,
      không cần nhờ lệnh nào. Ba trăm tệp thì phải cuộn. Ba nghìn tệp thì không đọc
      nổi, mà một lệnh xoá sai vẫn chạm tới cả ba nghìn gần như tức thì. Mẫu rộng
      thì tiện nhưng nguy hiểm. Người làm nghề xem trước bằng lệnh in chữ hoặc đếm,
      và giữ bản sao lưu ở nơi khác, vì lệnh xoá không hoàn tác.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Dấu cách thừa trong mẫu
      xoá: <code>rm * .txt</code>.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo *</div><div>a.txt b.txt c.png</div><div><span class="cm"><span>&#36;</span>
      </span>echo * .txt</div><div>a.txt b.txt c.png .txt</div></div><p>Phép thử bắt
      được lỗi: chạy <code>echo</code> với <b>đúng mẫu đó</b> trước. Thấy thừa <code>.txt</code>
      và mọi tên tệp thì dừng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là dấu cách thừa trong mẫu xoá. Phép thử bắt
      được lỗi này là chạy lệnh in chữ với đúng mẫu đó trước. Nếu thấy mọi tên tệp
      cùng chữ chấm t x t thừa, hãy dừng lại và sửa.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Dùng một dấu <code>&gt;</code>
      khi muốn nối: ghi đè tệp quan trọng.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo "ghi de" &gt; nguon/main.txt</div><div><span class="cm"><span>&#36;</span>
      </span>cat nguon/main.txt</div><div>ghi de</div></div><p>Phép thử: đọc lại lệnh
      trước khi chạy, hỏi “mình muốn <b>thay</b> hay <b>thêm</b>?”. Thêm thì hai dấu.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là dùng một dấu lớn hơn khi muốn nối. Nội
      dung cũ bị ghi đè mà không hỏi. Trước khi chạy, hãy tự hỏi mình muốn thay hay
      muốn thêm. Muốn thêm thì phải hai dấu.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Biến rỗng trong lệnh
      xoá: <code>rm -rf "<span>&#36;</span>DIR"/*</code>.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>DIR=</div><div><span class="cm"><span>&#36;</span>
      </span>echo "<span>&#36;</span>DIR/"</div><div>/</div></div><p>Biến <code>DIR</code>
      chưa đặt, nên <code>"<span>&#36;</span>DIR/"</code> thành <code>/</code>, tức
      <b>gốc</b> của cả hệ thống. Lệnh xoá sẽ nhắm vào gốc.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là dùng biến trong lệnh xoá mà biến đó
      rỗng. Ở đây biến chưa có giá trị, nên đường dẫn có biến cộng dấu gạch chéo chỉ
      còn lại đúng dấu gạch chéo, tức gốc của cả hệ thống. Một lệnh xoá đệ quy nhắm
      vào đó sẽ phá cả máy. Hãy luôn kiểm tra biến không rỗng, và in thử đường dẫn
      trước khi xoá.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - len('bao_cao_1.txt bao_cao_2.txt'.split()) == 2
  - len('bao_cao_1.txt bao_cao_10.txt bao_cao_2.txt'.split()) == 3
  - len('bao_cao_1.txt bao_cao_10.txt bao_cao_2.txt ghi_chu.txt'.split()) == 4
  steps:
  - show: '<p><b>Đề.</b> Thư mục có năm tệp: <code>bao_cao_1.txt</code>, <code>bao_cao_2.txt</code>,
      <code>bao_cao_10.txt</code>, <code>anh_1.png</code>, <code>ghi_chu.txt</code>.
      Máy xếp tên theo chữ cái.</p>

      <ol><li><code>echo bao_cao_?.txt</code> in ra gì?</li><li><code>echo *_1.*</code>
      in ra gì?</li></ol>

      <p><b>Quyết định:</b> muốn xoá ba bản báo cáo, bạn gõ <code>rm *.txt</code>
      hay <code>rm bao_cao_*.txt</code>? Vì sao, và bạn làm gì trước khi xoá?</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Thư mục có năm tệp, ba báo cáo mang số một,
      hai và mười, một ảnh, và một ghi chú. Câu một, lệnh in chữ với mẫu báo cáo gạch
      dưới hỏi chấm t x t in ra gì. Câu hai, mẫu sao gạch dưới một chấm sao in ra
      gì. Sau đó là một quyết định. Muốn xoá ba bản báo cáo thì nên gõ mẫu nào, vì
      sao, và làm gì trước khi xoá. Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>câu</th><th>kết quả</th><th>lý do</th></tr><tr><td>1</td><td><code>bao_cao_1.txt
      bao_cao_2.txt</code></td><td><code>?</code> là đúng một ký tự: <code>1</code>,
      <code>2</code> được; <code>10</code> có hai ký tự nên loại</td></tr><tr><td>2</td><td><code>anh_1.png
      bao_cao_1.txt</code></td><td>tên kết thúc bằng <code>_1.</code> rồi bất cứ gì:
      ảnh và báo cáo số 1</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    say: Đáp án câu một, dấu hỏi chỉ khớp đúng một ký tự, nên báo cáo số một và số
      hai được, còn số mười có hai ký tự bị loại. Câu hai, mẫu khớp mọi tên có gạch
      dưới một chấm, nên cả ảnh số một và báo cáo số một cùng được chọn.
    clear: true
  - show: <p><b>Máy chạy thật</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo bao_cao_?.txt</div><div>bao_cao_1.txt bao_cao_2.txt</div><div><span
      class="cm"><span>&#36;</span> </span>echo bao_cao_*.txt</div><div>bao_cao_1.txt
      bao_cao_10.txt bao_cao_2.txt</div><div><span class="cm"><span>&#36;</span> </span>echo
      *.txt</div><div>bao_cao_1.txt bao_cao_10.txt bao_cao_2.txt ghi_chu.txt</div><div><span
      class="cm"><span>&#36;</span> </span>echo *_1.*</div><div>anh_1.png bao_cao_1.txt</div></div><div
      class='box key'><b>Quyết định:</b> chọn <code>rm bao_cao_*.txt</code> (3 tệp),
      vì <code>rm *.txt</code> xoá thêm <code>ghi_chu.txt</code> (4 tệp). Trước khi
      xoá, chạy <code>echo bao_cao_*.txt</code> để thấy đúng 3 tên.</div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Máy chạy thật cho cùng kết quả. Về quyết định, nên chọn mẫu báo cáo sao chấm
      t x t, vì mẫu sao chấm t x t sẽ xoá thêm cả ghi chú, tức bốn tệp thay vì ba.
      Và trước khi xoá, hãy chạy lệnh in chữ với đúng mẫu đó để thấy đúng ba tên.
- id: practice
  kind: practice
  title: 'Tự làm: dựng cây cửa hàng, in bằng find'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>dung.sh</code>, làm tuần tự, ở thư mục hiện tại:</p>

      <ol><li><code>mkdir -p</code> tạo <code>cua_hang/kho</code> và <code>cua_hang/bao_cao</code>.</li>

      <li>Trong <code>kho</code>: tạo <code>ao.txt</code>, <code>quan.txt</code>,
      <code>non.txt</code>.</li>

      <li><code>bao_cao/tong.txt</code>: dòng <code>ao 5</code> (dùng <code>&gt;</code>)
      rồi <code>quan 3</code> (dùng <code>&gt;&gt;</code>).</li>

      <li>Chép <code>ao.txt</code> thành <code>ao_sao.txt</code>; đổi tên <code>non.txt</code>
      thành <code>mu.txt</code>; xoá <code>quan.txt</code>.</li>

      <li>In <code>find cua_hang | sort</code>, rồi <code>cat</code> tệp tổng.</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    pause: 180
    say: Bây giờ tới phần bạn tự làm. Viết một tệp lệnh làm tuần tự. Tạo thư mục cửa
      hàng với hai thư mục con là kho và báo cáo. Trong kho tạo ba tệp áo, quần, nón.
      Ghi hai dòng vào tệp tổng, dòng đầu bằng một dấu, dòng sau bằng hai dấu. Chép
      tệp áo, đổi tên tệp nón, xoá tệp quần. Cuối cùng in cây bằng lệnh tìm, nối với
      lệnh xếp, rồi in nội dung tệp tổng. Lệnh xếp chỉ để các dòng theo thứ tự chữ
      cái. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>cua_hang</div><div>cua_hang/bao_cao</div><div>cua_hang/bao_cao/tong.txt</div><div>cua_hang/kho</div><div>cua_hang/kho/ao.txt</div><div>cua_hang/kho/ao_sao.txt</div><div>cua_hang/kho/mu.txt</div><div>ao
      5</div><div>quan 3</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh FND L02 dung.sh</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> đọc đề từng dòng một, mỗi dòng là
      một lệnh. Tạo tệp dùng <code>touch</code> với đường dẫn đầy đủ, ví dụ <code>cua_hang/kho/ao.txt</code>.

      Dòng đầu của tổng dùng một <code>&gt;</code>, dòng sau hai <code>&gt;&gt;</code>.
      Lời giải ở <code>labs/FND/L02/loi_giai.sh</code>.</div>

      '
    say: Nếu kẹt, hãy đọc đề từng dòng, mỗi dòng là một lệnh. Tạo tệp thì dùng đường
      dẫn đầy đủ. Dòng đầu của tệp tổng dùng một dấu lớn hơn, dòng sau dùng hai dấu.
      Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã thử.
    clear: true
  lab: labs/FND/L02
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>tạo: mkdir, touch</span><span class=''a''>→</span><span
      class=''n''>ghi: &gt; ghi đè, &gt;&gt; nối</span><span class=''a''>→</span><span
      class=''n''>đọc: cat</span><span class=''a''>→</span><span class=''n''>chép
      cp, đổi tên mv, xoá rm (không hoàn tác)</span><span class=''a''>→</span><span
      class=''n''>* ? do cửa sổ lệnh mở ra</span><span class=''a''>→</span><span class=''n''>xem
      trước bằng echo</span></div>'
    say: Tổng kết chuỗi logic. Tạo bằng hai lệnh tạo thư mục và tạo tệp. Ghi bằng
      một dấu để ghi đè, hai dấu để nối. Đọc bằng lệnh in nội dung. Chép, đổi tên,
      xoá, và xoá thì không hoàn tác. Dấu sao và dấu hỏi do chương trình cửa sổ lệnh
      mở ra trước khi lệnh chạy, nên xem trước bằng lệnh in chữ.
  - show: '<div class=''box key''><b>Tư duy:</b> với mọi lệnh phá huỷ, làm ba việc:
      <b>xem trước</b> mẫu, <b>đếm</b> số tệp chạm tới, và hỏi “có bản sao ở nơi khác
      không?”.</div>

      <p>Bài sau: đọc và lọc văn bản bằng ống, để trả lời “có bao nhiêu” và “dòng
      nào” trong tệp lớn.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, với mọi lệnh phá huỷ, hãy làm ba việc. Xem trước mẫu,
      đếm số tệp chạm tới, và hỏi có bản sao ở nơi khác không. Bài sau, ta học đọc
      và lọc văn bản bằng ống, để trả lời có bao nhiêu và dòng nào trong tệp lớn.
    clear: true
