source: curriculum/fnd.yaml L02; audit/fnd/verify_fnd.py L02 (Git Bash chạy thật mkdir/touch/echo/cat/cp/mv/rm
  trong thư mục tạm); GNU Coreutils manual (mkdir, touch, cp, mv, rm), GNU Bash Reference
  Manual (Redirections, Filename Expansion, Brace Expansion); số tệp ×1 / ×100 / ×1
  000 là số minh hoạ chạy thật bằng verify_fnd
assumes: []
objectives:
- Nêu chức năng của các lệnh tạo thư mục, tạo tệp, in chữ, in nội dung, chép, di chuyển,
  xoá
- Phân biệt một dấu lớn hơn (ghi đè) với hai dấu lớn hơn (nối thêm)
- Giải thích dấu sao và dấu hỏi do chương trình cửa sổ lệnh mở ra và xem trước chúng
  bằng lệnh in chữ
- Dựng, ghi, chép, đổi tên và xoá trong một cây thư mục bằng đúng lệnh
- Đếm số tệp bị chạm tới bằng hai cách khác nhau
- 'Chỉ ra ba lỗi hay gặp: dấu cách thừa, ghi đè nhầm, biến rỗng trong lệnh xoá'
- Viết tệp lệnh dựng một cây cửa hàng và in cây bằng lệnh tìm
