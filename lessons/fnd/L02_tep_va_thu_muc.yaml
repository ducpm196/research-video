scenes:
- id: hook
  kind: hook
  title: Một dấu cách thừa xoá sạch cả thư mục, và không có thùng rác
  steps:
  - show: '<p><b>Xoá đúng: chỉ các tệp .txt</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>mkdir bc &amp;&amp; cd bc</div><div><span class="cm"><span>&#36;</span>
      </span>touch a.txt b.txt c.png</div><div><span class="cm"><span>&#36;</span>
      </span>ls</div><div>a.txt  b.txt  c.png</div><div><span class="cm"><span>&#36;</span>
      </span>rm *.txt</div><div><span class="cm"><span>&#36;</span> </span>ls</div><div>c.png</div></div><p>Lệnh
      xoá <code>rm *.txt</code> bỏ hai tệp <code>.txt</code>; ảnh còn nguyên.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, hãy xem một thao tác xoá an toàn trước. Thư mục có ba tệp. Lệnh
      xoá mẫu sao chấm t x t chỉ bỏ hai tệp văn bản, còn lại tệp ảnh. Chú ý là không
      có hộp hỏi lại, và cũng không có thùng rác.
  - show: '<p><b>Xoá sai: thêm MỘT dấu cách</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>touch a.txt b.txt</div><div><span class="cm"><span>&#36;</span> </span>rm
      * .txt</div><div>rm: cannot remove ''.txt'': No such file or directory</div><div><span
      class="cm"><span>&#36;</span> </span>ls</div></div><div class=''box warn''>Dấu
      cách làm <code>* .txt</code> thành <b>hai</b> mẫu: <code>*</code> khớp <b>mọi</b>
      tệp. Thư mục trống rỗng.</div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bây giờ ta tạo lại hai tệp và gõ sai một dấu cách, sao cách chấm t x t. Máy
      hiểu đó là hai mẫu riêng. Mẫu sao khớp mọi tệp, nên cả thư mục bị xoá sạch.
      Dòng báo lỗi chỉ nói về mẫu thứ hai, còn việc xoá đã xảy ra. Thư mục sau đó
      trống rỗng, và không thể lấy lại.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Tạo, ghi, đọc, chép, đổi tên, xoá tệp bằng lệnh: mỗi lệnh làm gì?</li>

      <li>Dấu <code>&gt;</code> và <code>&gt;&gt;</code> khác nhau thế nào?</li>

      <li>Ký tự đại diện <code>*</code> thật sự làm gì, và <b>xem trước</b> nó bằng
      cách nào?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Tạo, ghi, đọc, chép, đổi tên và xoá tệp bằng
      lệnh, mỗi lệnh làm gì. Dấu lớn hơn và hai dấu lớn hơn khác nhau thế nào. Và
      ký tự đại diện dấu sao thật sự làm gì, cùng cách xem trước nó.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: chỗ đứng, đường dẫn và tên tệp'
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      chỗ đứng</td><td>lệnh in vị trí cho biết bạn đứng ở đâu; mọi tên tệp tính từ
      đó</td></tr><tr><td>② đường dẫn tương đối</td><td><code>nguon/main.txt</code>
      = tệp <code>main.txt</code> trong thư mục <code>nguon</code> ngay dưới chỗ đứng</td></tr><tr><td>③
      hai dấu chấm</td><td><code>..</code> là thư mục cha; <code>cd ..</code> lùi
      một cấp</td></tr><tr><td>④ tên tệp</td><td>không dấu, không khoảng trắng, ví
      dụ <code>ghi_chu.txt</code></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều từ bài trước. Chỗ đứng là nơi lệnh in vị trí cho biết,
      và mọi tên tệp được tính từ đó. Đường dẫn tương đối nguồn gạch chéo main chấm
      t x t là tệp main trong thư mục nguồn ngay dưới chỗ đứng. Hai dấu chấm là thư
      mục cha. Và tên tệp nên không dấu, không khoảng trắng, nối bằng dấu gạch dưới.
- id: sym
  kind: symbol
  title: Giải mã tám lệnh và ba dấu
  steps:
  - show: <table class='t'><tr><th>lệnh</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>mkdir
      -p a/b</code></td><td>lệnh tạo thư mục</td><td>tạo thư mục; cờ <code>-p</code>
      tạo luôn các thư mục cha còn thiếu</td></tr><tr><td><code>touch f.txt</code></td><td>lệnh
      tạo tệp rỗng</td><td>tạo tệp không có nội dung (nếu đã có thì chỉ đổi giờ sửa)</td></tr><tr><td><code>echo
      "xin chao"</code></td><td>lệnh in chữ</td><td>in các tham số ra <b>đầu ra</b>
      (màn hình)</td></tr><tr><td><code>cat f.txt</code></td><td>lệnh in nội dung
      tệp</td><td>in nội dung tệp ra đầu ra</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn lệnh đầu. Lệnh tạo thư mục tạo thư mục, và cờ p tạo
      luôn các thư mục cha còn thiếu. Lệnh tạo tệp rỗng tạo tệp không có nội dung.
      Lệnh in chữ in các tham số ra đầu ra, tức màn hình. Lệnh in nội dung tệp cho
      thấy nội dung tệp ra đầu ra.
  - show: <table class='t'><tr><th>lệnh</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>cp
      a b</code></td><td>lệnh chép</td><td>chép tệp <code>a</code> thành <code>b</code>;
      <code>a</code> vẫn còn</td></tr><tr><td><code>mv a b</code></td><td>lệnh di
      chuyển</td><td>đổi tên hoặc chuyển <code>a</code> sang <code>b</code>; <code>a</code>
      không còn</td></tr><tr><td><code>rm a</code></td><td>lệnh xoá</td><td>xoá <b>ngay</b>,
      không thùng rác; thư mục cần cờ <code>-r</code></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Ba lệnh tiếp theo. Lệnh chép làm ra tệp thứ hai, tệp đầu vẫn còn. Lệnh di
      chuyển đổi tên hoặc chuyển chỗ, tệp cũ không còn. Lệnh xoá bỏ ngay, không qua
      thùng rác, và muốn xoá thư mục thì cần cờ r.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>&gt;</code></td><td><b>chuyển
      hướng</b>: đưa đầu ra vào tệp, <b>ghi đè</b> cả tệp</td></tr><tr><td><code>&gt;&gt;</code></td><td>đưa
      đầu ra vào cuối tệp, <b>nối thêm</b></td></tr><tr><td><code>*</code></td><td><b>ký
      tự đại diện</b>: khớp mọi chuỗi (kể cả rỗng), ví dụ <code>*.txt</code></td></tr><tr><td><code>?</code></td><td>khớp
      <b>đúng một</b> ký tự bất kỳ, ví dụ <code>?.png</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Ba dấu cuối. Một dấu lớn hơn chuyển hướng đầu ra vào tệp và ghi đè cả tệp.
      Hai dấu lớn hơn nối thêm vào cuối tệp. Dấu sao là ký tự đại diện, khớp mọi chuỗi.
      Dấu hỏi khớp đúng một ký tự bất kỳ.
