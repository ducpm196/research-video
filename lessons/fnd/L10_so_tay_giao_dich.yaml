source: 'curriculum/fnd.yaml L10; audit/fnd/verify_fnd.py L10 (Git Bash + sqlite3
  [shim trên máy kiểm] + awk + git chạy thật toàn bộ quy trình); GNU Bash Reference
  Manual (Here-Documents, Command Substitution, Conditional Constructs [ ]); The AWK
  Programming Language (Aho, Kernighan, Weinberger); SQLite docs: CREATE VIEW, Command-Line
  Shell (.import, .print); tính idempotent của một tác vụ (chạy n lần = chạy 1 lần);
  số dòng và byte 10 / 10 001 / 292 / 248 221 đo bằng verify_fnd; 0,25 GB cho 10 triệu
  dòng là ngoại suy tuyến tính'
