      x="660" y="150" width="250" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="785.0" y="202" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">bao_cao.txt</text><text x="785.0" y="234"
      font-size="24" text-anchor="middle" fill="#1f2937">3 báo cáo</text><line x1="915"
      y1="210" x2="970" y2="210" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="975" y="150" width="240" height="120" rx="10" fill="#fef3c7" stroke="#d97706"
