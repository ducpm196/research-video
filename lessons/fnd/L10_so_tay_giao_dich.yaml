scenes:
- id: hook
  kind: hook
  title: Báo cáo cuối tháng lệch gấp đôi vì ai đó chạy script hai lần
  steps:
  - show: '<p><b>Cùng một tệp lệnh, chạy lần thứ hai</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>bash so_tay_loi.sh</div><div>tong khop:
      3150000</div><div><span class="cm"><span>&#36;</span> </span>bash so_tay_loi.sh</div><div>LECH:
      6300000 3150000</div></div><p>Lần đầu khớp: $3\,150\,000$. Chạy <b>lại</b>:
      cơ sở dữ liệu có <b>gấp đôi</b> giao dịch, tổng thành $6\,300\,000$ và dòng
      kiểm tra báo <b>LECH</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Chào bạn, bài cuối của chặng nền là một tình huống làm nghề. Một tệp lệnh
      lập báo cáo, chạy lần đầu cho tổng ba triệu một trăm năm mươi nghìn, khớp với
      phép kiểm. Ai đó chạy lại lần nữa, cơ sở dữ liệu có gấp đôi giao dịch, tổng
      thành sáu triệu ba trăm nghìn. May là dòng kiểm tra báo lệch. Không có dòng
      kiểm tra đó, con số sai sẽ đi vào báo cáo mà không ai biết.
  - show: '<div class="box key">Hôm nay ta ghép <b>mọi thứ của chặng</b> thành một
      dự án nhỏ, “sổ tay giao dịch”, và trả lời:

      <ol><li>Làm sao nối <b>dòng lệnh + SQL + quản lý phiên bản</b> thành một quy
      trình chạy lại được?</li>

      <li>Làm sao <b>kiểm</b> kết quả bằng một đường độc lập, để lỗi không lặng lẽ
      lọt qua?</li>

      <li>Khi dữ liệu lớn gấp <b>1 000 lần</b>, cái gì vẫn đúng và cái gì phải đổi?</li></ol></div>

      '
    say: Hôm nay ta ghép mọi thứ của cả chặng thành một dự án nhỏ, là sổ tay giao
      dịch, và trả lời ba câu hỏi. Làm sao nối dòng lệnh, ngôn ngữ SQL và quản lý
      phiên bản thành một quy trình chạy lại được. Làm sao kiểm kết quả bằng một đường
      độc lập, để lỗi không lặng lẽ lọt qua. Và khi dữ liệu lớn gấp một nghìn lần
      thì cái gì vẫn đúng, cái gì phải đổi.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: sáu mảnh của chặng, mỗi mảnh một dòng'
  steps:
  - show: '<table class=''t''><tr><th>mảnh đã học</th><th>nhắc lại</th></tr><tr><td>①
      đường dẫn, tệp (bài 1, 2)</td><td>chỗ đứng, <code>mkdir</code>, <code>&gt;</code>,
      <code>rm</code> không có thùng rác</td></tr><tr><td>② ống và lọc (bài 3)</td><td><code>head
      -n 7</code> và <code>tail -n 7</code> (7 dòng đầu, 7 dòng cuối), <code>tail
      -n +2</code>, <code>cut</code>, <code>sort</code>, <code>wc</code></td></tr><tr><td>③
      mã thoát, tệp lệnh, đọc thông báo lỗi (bài 4, 5)</td><td><code>set -e</code>,
      <code>&amp;&amp;</code>, <code>||</code>; dòng lỗi cho biết tệp, dòng, nguyên
      nhân</td></tr><tr><td>④ dữ liệu có cấu trúc, máy khách và máy chủ (bài 6, 7)</td><td>tệp
      CSV: dòng đầu là tên cột; yêu cầu và phản hồi, mã trạng thái</td></tr><tr><td>⑤
      bảng và SQL (bài 8)</td><td><code>SELECT … FROM … WHERE … GROUP BY … ORDER BY
      … LIMIT</code>: chọn, lọc hàng, nhóm, sắp, giới hạn; <code>*</code> = mọi cột,
      <code>COUNT(*)</code> đếm hàng, <code>AND</code> = cả hai điều kiện đúng</td></tr><tr><td>⑥
      phiên bản (bài 9)</td><td><code>git init -q</code> (tạo kho, im lặng), <code>add</code>,
      <code>commit</code>, <code>git status -s</code> (<code>??</code> = tệp mới chưa
      theo dõi), <code style="white-space:nowrap">git log --format=%s</code> (lời
      nhắn các lần chốt), <code>.gitignore</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Ta ôn lại sáu mảnh của chặng. Đường dẫn và tệp, lệnh xoá không có thùng rác.
      Ống và lọc, kể cả lấy bảy dòng đầu hoặc cuối. Mã thoát, tệp lệnh, đọc thông
      báo lỗi. Dữ liệu có cấu trúc và máy chủ. Bảng và SQL, gồm chọn, lọc, nhóm, sắp,
      giới hạn, dấu sao là mọi cột, hàm đếm, chữ A N D đòi cả hai điều kiện đúng.
      Và phiên bản, với tạo kho, hai chấm hỏi là tệp chưa theo dõi, xem lịch sử, tệp
      loại trừ.
- id: sym
  kind: symbol
  title: Giải mã tám mảnh mới của dự án
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td style=''white-space:nowrap''><code>lệnh
      &lt;&lt;''EOF'' … EOF</code></td><td><b>khối chữ nhúng</b>: gửi nhiều dòng liền
      cho lệnh làm đầu vào; nháy quanh <code>EOF</code> để máy <b>không</b> thay biến
      bên trong</td></tr><tr><td style=''white-space:nowrap''><code>a=<span>&#36;</span>(lệnh)</code></td><td>lấy
      <b>kết quả in ra</b> của lệnh làm giá trị của biến <code>a</code></td></tr><tr><td
      style=''white-space:nowrap''><code>[ "<span>&#36;</span>a" = "<span>&#36;</span>b"
      ]</code></td><td>phép <b>so sánh</b> hai chuỗi: mã thoát 0 nếu bằng nhau, nên
      ghép được với <code>&amp;&amp;</code> và <code>||</code></td></tr><tr><td style=''white-space:nowrap''><code>awk
      -F, ''…''</code></td><td>lệnh xử lý từng dòng theo cột; <code>-F,</code>: cột
      cách nhau bằng dấu phẩy; <code>$3</code> là cột 3; <code>NR</code> là số thứ
      tự dòng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn mảnh mới. Khối chữ nhúng gửi nhiều dòng liền cho một
      lệnh làm đầu vào, và nháy quanh chữ kết thúc để máy không thay biến bên trong.
      Dấu đô la mở ngoặc lấy kết quả in ra của một lệnh làm giá trị của biến. Ngoặc
      vuông so sánh hai chuỗi và cho mã thoát không nếu bằng nhau, nên ghép được với
      hai dấu và và hai gạch đứng. Và lệnh xử lý cột đọc từng dòng, cho ta cộng hoặc
      trừ theo cột, như một đường tính độc lập.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td style=''white-space:nowrap''><code>CREATE
      VIEW sd AS SELECT …</code></td><td><b>khung nhìn</b>: một câu <code>SELECT</code>
      được đặt tên, dùng như một bảng; ở đây <code>dong</code> là tiền <b>có dấu</b>
      (nạp dương, còn lại âm)</td></tr><tr><td style=''white-space:nowrap''><code>CASE
      WHEN điều_kiện THEN a ELSE b END</code></td><td><b>chọn giá trị</b>: điều kiện
      đúng thì lấy <code>a</code>, không thì lấy <code>b</code>; ví dụ <code>CASE
      WHEN loai = ''nap'' THEN so_tien ELSE -so_tien END</code></td></tr><tr><td style=''white-space:nowrap''><code
      style="white-space:nowrap">.import --csv --skip 1 f.csv bang</code></td><td>lệnh
      của chương trình <code>sqlite3</code>: nạp tệp CSV vào bảng; <code style="white-space:nowrap">--skip
      1</code> <b>bỏ dòng tiêu đề</b> (cần khi bảng đã tạo sẵn)</td></tr><tr><td style=''white-space:nowrap''><code>.print
      văn bản</code></td><td>in một dòng chữ (để đề mục báo cáo)</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai giải mã các từ của phần SQL. Khung nhìn là một câu chọn được
      đặt tên, dùng như một bảng; ở đây nó cho tiền có dấu. Phép chọn giá trị làm
      việc đó, nếu điều kiện đúng thì lấy giá trị thứ nhất, không thì lấy giá trị
      thứ hai. Lệnh nạp tệp bảng vào bảng, kèm cờ bỏ dòng tiêu đề, là lệnh của chính
      chương trình cơ sở dữ liệu. Và lệnh in chữ để viết đề mục cho báo cáo.
