      x="1275" y="150" width="220" height="120" rx="10" fill="#f3e8ff" stroke="#9333ea"
      stroke-width="3"/><text x="1385.0" y="202" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">git</text><text x="1385.0" y="234" font-size="24"
      text-anchor="middle" fill="#1f2937">chốt kết quả</text><text x="750" y="70"
      font-size="30" text-anchor="middle" fill="#1f2937" font-weight="bold">mọi bước
      đều là chữ: đọc được, chạy lại được, kiểm được</text><text x="750" y="340" font-size="26"
      text-anchor="middle" fill="#dc2626" font-weight="bold">so_tay.db không vào git:
      sinh lại được từ csv + tệp lệnh</text><text x="750" y="390" font-size="24" text-anchor="middle"
      fill="#1f2937">chạy lại từ trạng thái sạch (rm -f so_tay.db) nên lần nào cũng
