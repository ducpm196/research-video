    say: Hình này là quy trình năm bước. Tệp giao dịch nhỏ là đầu vào. Cơ sở dữ liệu
      nạp và truy vấn, ra ba báo cáo. Bước kiểm tính lại tổng bằng một đường khác.
      Rồi quản lý phiên bản chốt kết quả. Mọi bước đều là chữ, nên đọc được, chạy
      lại được, kiểm được. Tệp cơ sở dữ liệu không vào kho, vì sinh lại được từ tệp
      bảng và tệp lệnh. Và ta luôn chạy lại từ trạng thái sạch, nên lần nào cũng cùng
      kết quả.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: ba nguyên tắc của một quy trình đáng tin'
  steps:
  - show: <p><b>Bước 1. Tệp so_tay.sh, phần nạp dữ liệu</b></p><div class="code"><div>set
      -e</div><div>rm -f so_tay.db</div><div>sqlite3 so_tay.db &lt;&lt;'EOF'</div><div>CREATE
      TABLE gd (ngay TEXT, tk TEXT, loai TEXT, so_tien INTEGER);</div><div>.import
      --csv --skip 1 giaodich.csv gd</div><div>CREATE VIEW sd AS SELECT tk,</div><div>  CASE
      WHEN loai = 'nap' THEN so_tien ELSE -so_tien END AS dong</div><div>  FROM gd;</div></div><p>Vì
      mỗi lần chạy <b>xoá cơ sở dữ liệu cũ</b> rồi nạp lại từ tệp bảng, trạng thái
      đầu luôn giống nhau.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, nguyên tắc chạy lại được. Tệp lệnh bắt đầu bằng dừng khi lỗi, rồi
      xoá cơ sở dữ liệu cũ, tạo bảng và nạp lại từ tệp bảng. Vì mỗi lần chạy đều xuất
      phát từ trạng thái sạch, nên lần nào cũng cùng kết quả.
  - show: '<p><b>Bước 2. Phần báo cáo: mỗi câu hỏi một câu SELECT</b></p><div class="code"><div>EOF</div><div>sqlite3
      so_tay.db &lt;&lt;''EOF'' &gt; bao_cao.txt</div><div>.print == so du theo tai
      khoan ==</div><div>SELECT tk, SUM(dong) FROM sd GROUP BY tk ORDER BY tk;</div><div>.print
      == so giao dich theo loai ==</div><div>SELECT loai, COUNT(*) FROM gd GROUP BY
      loai ORDER BY loai;</div><div>.print == giao dich lon nhat moi ngay ==</div><div>SELECT
      ngay, MAX(so_tien) FROM gd GROUP BY ngay ORDER BY ngay;</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, nguyên tắc mỗi câu hỏi một câu chọn. Ba báo cáo là số dư theo tài
      khoản, số giao dịch theo loại, và giao dịch lớn nhất mỗi ngày. Mỗi báo cáo có
      một dòng đề mục, và toàn bộ được ghi vào một tệp bằng dấu chuyển hướng.
  - show: '<p><b>Bước 3. Kiểm bằng đường độc lập</b></p><div class="code"><div>EOF</div><div>a=<span>&#36;</span>(sqlite3
      so_tay.db "SELECT SUM(dong) FROM sd;")</div><div>b=<span>&#36;</span>(awk -F,
      ''NR &gt; 1 { if (<span>&#36;</span>3 == "nap") s += <span>&#36;</span>4; else
      s -= <span>&#36;</span>4 }</div><div>  END { print s }'' giaodich.csv)</div><div>[
      "<span>&#36;</span>a" = "<span>&#36;</span>b" ] &amp;&amp; echo "tong khop:
      <span>&#36;</span>a" || echo "LECH: <span>&#36;</span>a <span>&#36;</span>b"</div></div><p>Vì
      <code>a</code> tính bằng <b>SQL</b> và <code>b</code> tính bằng <b>awk</b> từ
      chính tệp csv, hai đường không dùng chung mã. Bằng nhau thì tin; lệch thì <b>dừng
      và tìm</b>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, nguyên tắc kiểm bằng đường độc lập. Tổng thứ nhất tính bằng SQL,
      tổng thứ hai tính bằng lệnh xử lý cột từ chính tệp bảng, nên hai đường không
      dùng chung mã. Nếu bằng nhau thì ta tin, nếu lệch thì dừng lại và đi tìm nguyên
      nhân.
- id: example
  kind: example
  title: 'Ví dụ: chạy cả dự án, năm phép làm'
  checks:
  - 2000000 + 1500000 + 800000 + 600000 == 4900000
  - 300000 + 500000 + 400000 + 100000 + 250000 + 200000 == 1750000
  - 4900000 - 1750000 == 3150000
  - 2000000 - 300000 - 400000 + 600000 == 1900000
  - 1500000 - 500000 - 250000 == 750000
  - 800000 - 100000 - 200000 == 500000
  - 1900000 + 750000 + 500000 == 3150000
  steps:
  - show: '<p><b>① Chạy tệp lệnh</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>bash so_tay.sh</div><div>tong khop: 3150000</div></div><p>Tổng khớp:
      nạp $4\,900\,000$ trừ chi $1\,750\,000$ bằng $\hl{3\,150\,000}$ ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ nhất, chạy tệp lệnh rồi đọc báo cáo. Dòng kiểm tra khớp, tổng
      là ba triệu một trăm năm mươi nghìn. Làm thử bằng tay, tổng nạp là bốn triệu
      chín trăm nghìn, tổng chi là một triệu bảy trăm năm mươi nghìn, hiệu đúng như
      vậy.
  - show: '<p><b>② Báo cáo, nửa đầu: số dư theo tài khoản, bắt đầu số giao dịch theo
      loại</b></p><div class="code"><div><span class="cm"><span>&#36;</span> </span>head
      -n 7 bao_cao.txt</div><div>== so du theo tai khoan ==</div><div>A01|1900000</div><div>A02|750000</div><div>A03|500000</div><div>==
      so giao dich theo loai ==</div><div>chuyen|3</div><div>nap|4</div></div><p>Kiểm
      tay số dư A01: $2\,000\,000 - 300\,000 - 400\,000 + 600\,000 = \hl{1\,900\,000}$
      ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ hai, đọc báo cáo, nửa đầu. Kiểm tay số dư của tài khoản đầu
      tiên. Hai triệu trừ ba trăm nghìn trừ bốn trăm nghìn cộng sáu trăm nghìn, bằng
      một triệu chín trăm nghìn, khớp với dòng đầu của báo cáo.
  - show: '<p><b>② Báo cáo, nửa sau: loại còn lại và giao dịch lớn nhất mỗi ngày</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>tail -n 7 bao_cao.txt</div><div>rut|3</div><div>==
      giao dich lon nhat moi ngay ==</div><div>2026-01-02|2000000</div><div>2026-01-03|800000</div><div>2026-01-04|500000</div><div>2026-01-05|250000</div><div>2026-01-06|600000</div></div><p>Mỗi
      ngày một dòng: ngày 2 lớn nhất là khoản nạp $2\,000\,000$ ✓</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Nửa sau của báo cáo là giao dịch lớn nhất mỗi ngày. Ngày hai tháng một, khoản
      lớn nhất là hai triệu, đúng là khoản nạp đầu tiên trong tệp bảng.
  - show: '<p><b>③ Tạo kho: tệp cơ sở dữ liệu cũng hiện ra!</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>git init -q</div><div><span class="cm"><span>&#36;</span>
      </span>git status -s</div><div>?? bao_cao.txt</div><div>?? giaodich.csv</div><div>??
      so_tay.db</div><div>?? so_tay.sh</div></div><p>Công cụ thấy cả <code>so_tay.db</code>.
      Đó là tệp <b>sinh lại được</b> nên không nên chốt.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ ba, tạo kho. Trạng thái cho thấy cả tệp cơ sở dữ liệu. Đó là
      tệp sinh lại được, nên không nên chốt vào kho.
  - show: '<p><b>④ .gitignore, add có chọn lọc, chốt, kiểm sạch</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo so_tay.db &gt; .gitignore</div><div><span
      class="cm"><span>&#36;</span> </span>git add .gitignore giaodich.csv so_tay.sh
      bao_cao.txt</div><div><span class="cm"><span>&#36;</span> </span>git commit
      -q -m ''bao cao dau tien''</div><div><span class="cm"><span>&#36;</span> </span>git
      log --format=%s</div><div>bao cao dau tien</div><div><span class="cm"><span>&#36;</span>
      </span>git status -s</div></div><p>Chốt 4 tệp: tệp loại trừ, dữ liệu vào, tệp
      lệnh, báo cáo. Trạng thái trống ✓</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Phép làm thứ tư, ghi tên tệp cơ sở dữ liệu vào tệp loại trừ, thêm đúng bốn
      tệp cần giữ, chốt, rồi kiểm. Lịch sử có một lần chốt, và trạng thái trống, nghĩa
      là mọi thứ khớp.
  - show: '<p><b>⑤ Chạy lại: cùng kết quả, kho vẫn sạch</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>bash so_tay.sh</div><div>tong khop: 3150000</div><div><span
      class="cm"><span>&#36;</span> </span>git status -s</div></div><p>Chạy lại từ
      trạng thái sạch, tổng vẫn $3\,150\,000$, và <code>so_tay.db</code> bị bỏ qua
      nên kho không bẩn thêm ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ năm, chạy lại. Vì xuất phát từ trạng thái sạch nên tổng vẫn
      như cũ. Tệp cơ sở dữ liệu bị bỏ qua nên kho không bẩn thêm. Đó là một quy trình
      chạy lại được.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: ba đường cho cùng một tổng'
  checks:
  - 1900000 + 750000 + 500000 == 3150000
  - 10 + 1 == 11
  steps:
  - show: '<p>Ba đường, không dùng chung mã, cùng ra $3\,150\,000$:</p>

      <ol><li><b>SQL</b>: <code>SUM(dong)</code> trên khung nhìn (trong tệp lệnh);</li>

      <li><b>awk</b>: cộng trừ cột 4 của tệp csv (trong tệp lệnh);</li>

      <li><b>tay</b>: tổng ba số dư $1\,900\,000 + 750\,000 + 500\,000 = \hl{3\,150\,000}$
      ✓</li></ol>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đường kiểm khác, ba đường không dùng chung mã cùng ra ba triệu một trăm năm
      mươi nghìn. Đường một là SQL cộng trên khung nhìn. Đường hai là lệnh xử lý cột
      cộng trừ cột bốn của tệp bảng. Đường ba là tay, cộng ba số dư của ba tài khoản,
      nên ba đường độc lập với nhau.
  - show: '<p><b>Kiểm cả số dòng: nạp thiếu --skip làm thừa một hàng</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 t.db ''.import --csv giaodich.csv
      gd''</div><div><span class="cm"><span>&#36;</span> </span>sqlite3 t.db ''SELECT
      COUNT(*) FROM gd;''</div><div>11</div><div><span class="cm"><span>&#36;</span>
      </span>tail -n +2 giaodich.csv | wc -l</div><div>10</div></div><p>$10$ giao
      dịch nhưng bảng có $11$ hàng: dòng tiêu đề bị nạp như một giao dịch. Đếm bằng
      hai đường ($11 \neq 10$) bắt được lỗi.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Kiểm thêm số dòng. Nếu nạp mà quên cờ bỏ dòng tiêu đề thì bảng có mười một
      hàng, trong khi tệp chỉ có mười giao dịch. Đếm bằng hai đường cho hai số khác
      nhau, nên bắt được lỗi.
- id: scale
  kind: example
  title: 'Khi dữ liệu lớn gấp 1 000 lần: cái gì vẫn đúng, cái gì phải đổi'
  checks:
  - 10 * 1000 == 10000
  - round(248221 / 1e6, 2) == 0.25
  - 248221 * 1000 == 248_221_000
  - round(292 * 1000 * 1000 / 1e6) == 292
  steps:
  - show: '<p><b>×1 000: tạo 10 000 giao dịch giả bằng một tệp awk, chạy nguyên tệp
      lệnh cũ</b></p><div class="code"><div><span class="cm"><span>&#36;</span> </span>mkdir
      big &amp;&amp; cd big</div><div><span class="cm"><span>&#36;</span> </span>seq
      1 10000 | awk -f ../sinh.awk &gt; giaodich.csv</div><div><span class="cm"><span>&#36;</span>
      </span>wc -l giaodich.csv</div><div>10001 giaodich.csv</div><div><span class="cm"><span>&#36;</span>
      </span>wc -c giaodich.csv</div><div>248221 giaodich.csv</div><div><span class="cm"><span>&#36;</span>
      </span>cp ../so_tay.sh .</div><div><span class="cm"><span>&#36;</span> </span>bash
      so_tay.sh</div><div>tong khop: 130000000</div></div><p>Cùng tệp <code>so_tay.sh</code>,
      <b>không sửa một chữ</b>: tổng vẫn khớp ($130\,000\,000$).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ta tạo mười nghìn giao dịch giả bằng một tệp lệnh xử lý cột, rồi chạy nguyên
      tệp lệnh cũ, không sửa một chữ. Dòng kiểm tra vẫn khớp, tổng là một trăm ba
      mươi triệu. Cách nghĩ của quy trình vẫn đúng ở quy mô lớn hơn một nghìn lần.
  - show: '<p><b>Dung lượng bản nhỏ (10 giao dịch)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>wc -c giaodich.csv</div><div>292 giaodich.csv</div></div><table
      class=''t''><tr><th>số giao dịch</th><th>dung lượng tệp CSV</th><th>ghi chú</th></tr><tr><td>×1:
      10</td><td>292 byte</td><td>đọc bằng mắt</td></tr><tr><td>×1 000: 10 000</td><td>248
      221 byte (≈ 0,25 MB)</td><td>máy đọc nhẹ nhàng</td></tr><tr><td>×1 000 000:
      10 000 000</td><td>≈ 248 triệu byte (≈ 0,25 GB), ngoại suy</td><td>không còn
      nằm gọn trong kho mã</td></tr></table><div class=''box key''><b>Đổi gì khi lớn:</b>
      (1) <b>không</b> chốt CSV khổng lồ vào kho; chốt tệp lệnh, mẫu nhỏ, báo cáo;
      (2) đặt <b>chỉ mục</b> cho cột hay lọc; (3) đọc <b>từng dòng</b>/theo khối thay
      vì nạp cả tệp vào biến; (4) dữ liệu thật rất lớn thì dùng máy chủ cơ sở dữ liệu.
      Cái vẫn đúng: chạy lại được, kiểm độc lập.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 3
    - 4
    - 4
    clear: true
    say: Bảng này cho thấy quy mô. Mười giao dịch chỉ hai trăm chín mươi hai byte.
      Mười nghìn giao dịch là khoảng hai trăm bốn mươi tám nghìn byte. Mười triệu
      giao dịch, ngoại suy, là khoảng hai trăm bốn mươi tám triệu byte, không còn
      nằm gọn trong kho mã. Khi lớn lên, có bốn thứ phải đổi. Không chốt tệp bảng
      khổng lồ vào kho, chỉ chốt tệp lệnh, mẫu nhỏ và báo cáo. Đặt chỉ mục cho cột
      hay lọc. Đọc từng dòng thay vì nạp cả tệp vào một biến. Và dữ liệu thật rất
      lớn thì dùng máy chủ cơ sở dữ liệu. Còn hai thứ vẫn đúng là chạy lại được và
      kiểm độc lập.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Chốt cả tệp cơ sở dữ liệu
      vào kho.</div><div class="code"><div><span class="cm"><span>&#36;</span> </span>git
      status -s</div><div>?? bao_cao.txt</div><div>?? giaodich.csv</div><div>?? so_tay.db</div><div>??
      so_tay.sh</div></div><p>Tệp nhị phân, to, <b>đổi toàn bộ</b> mỗi lần chạy: lịch
      sử phình ra mà không đọc được khác biệt. Đưa vào <code>.gitignore</code> ngay
      từ lần đầu.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là chốt cả tệp cơ sở dữ liệu vào kho. Đó là
      tệp nhị phân, to, đổi toàn bộ mỗi lần chạy, nên lịch sử phình ra mà không đọc
      được khác biệt. Hãy đưa nó vào tệp loại trừ ngay từ lần đầu.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Nạp CSV mà quên bỏ dòng
      tiêu đề.</div><div class="code"><div><span class="cm"><span>&#36;</span> </span>sqlite3
      t.db ''SELECT COUNT(*) FROM gd;''</div><div>11</div><div><span class="cm"><span>&#36;</span>
      </span>tail -n +2 giaodich.csv | wc -l</div><div>10</div></div><p>Phép thử:
      đếm số hàng của bảng và số dòng dữ liệu của tệp; hai số phải bằng nhau.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là nạp tệp bảng mà quên bỏ dòng tiêu đề.
      Dòng tiêu đề thành một giao dịch giả. Phép thử là đếm số hàng của bảng và số
      dòng dữ liệu của tệp, hai số phải bằng nhau.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tệp lệnh không chạy
      lại được: lần hai nhân đôi dữ liệu.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>bash so_tay_loi.sh</div><div>tong khop: 3150000</div><div><span class="cm"><span>&#36;</span>
      </span>bash so_tay_loi.sh</div><div>LECH: 6300000 3150000</div><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 so_tay.db ''SELECT COUNT(*) FROM gd;''</div><div>20</div></div><p>Thiếu
      “xoá rồi nạp lại”, mỗi lần chạy <b>cộng thêm</b>. Con số sai nhưng <b>không
      báo lỗi</b>; chính phép kiểm độc lập mới bắt được. Quy trình tốt: <b>chạy bao
      nhiêu lần cũng một kết quả</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là tệp lệnh không chạy lại được. Thiếu
      bước xoá rồi nạp lại, nên mỗi lần chạy cộng thêm dữ liệu, bảng có hai mươi hàng
      thay vì mười. Con số sai mà không báo lỗi, và chính phép kiểm độc lập mới bắt
      được. Một quy trình tốt cho cùng một kết quả dù chạy bao nhiêu lần.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 500000 + 250000 == 750000
  - 2000000 + 1500000 == 3500000
  steps:
  - show: '<p><b>Đề.</b> Dùng dữ liệu và <code>so_tay.db</code> của bài. (1) Tổng
      tiền <b>đã chi ra</b> (loại khác <code>nap</code>) của tài khoản A02? (2) Ngày
      có <b>tổng nạp lớn nhất</b>, kèm tổng?</p>

      <p><b>Chọn:</b> bạn tiếp quản dự án này khi tệp CSV đã lên $10\,000\,000$ dòng
      ($\approx 0{,}25$ GB). Bạn <b>chốt CSV vào kho</b> hay chỉ chốt tệp lệnh + mẫu
      nhỏ + báo cáo? Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 90
    say: Bây giờ tới phần bạn tự làm, trên dữ liệu và cơ sở dữ liệu của bài. Câu một,
      tổng tiền đã chi ra, tức loại khác nạp, của tài khoản A không hai. Câu hai,
      ngày có tổng nạp lớn nhất, kèm tổng. Câu ba là một quyết định. Bạn tiếp quản
      dự án khi tệp bảng đã lên mười triệu dòng, khoảng hai trăm bốn mươi tám triệu
      byte. Bạn chốt tệp bảng vào kho, hay chỉ chốt tệp lệnh, mẫu nhỏ và báo cáo,
      và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Máy chạy thật</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 so_tay.db "SELECT SUM(so_tien) FROM gd WHERE tk = ''A02'' AND
      loai &lt;&gt; ''nap'';"</div><div>750000</div><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 so_tay.db "SELECT ngay, SUM(so_tien) AS t FROM gd WHERE loai
      = ''nap''</div><div><span class="cm">&gt; </span>GROUP BY ngay ORDER BY t DESC
      LIMIT 1;"</div><div>2026-01-02|3500000</div></div><table class=''t''><tr><th>câu</th><th>kết
      quả</th><th>lý do</th></tr><tr><td>1</td><td><b>750 000</b></td><td>A02 chi:
      rút $500\,000$ + chuyển $250\,000$</td></tr><tr><td>2</td><td><b>2026-01-02|3
      500 000</b></td><td>ngày 2: hai khoản nạp $2\,000\,000$ và $1\,500\,000$</td></tr></table>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đáp án, máy chạy thật cho hai kết quả. Câu một, tài khoản A không hai chi
      bảy trăm năm mươi nghìn, gồm rút năm trăm nghìn và chuyển hai trăm năm mươi
      nghìn. Câu hai, ngày hai tháng một nạp tổng cộng ba triệu năm trăm nghìn, từ
      hai tài khoản.
  - show: '<div class=''box key''><b>Quyết định:</b> chỉ chốt <b>tệp lệnh + mẫu nhỏ
      + báo cáo</b> và ghi rõ cách lấy CSV gốc. $0{,}25$ GB mỗi lần đổi nhân với số
      lần chốt làm kho phình ra, và CSV gốc có thể chứa <b>dữ liệu nhạy cảm</b>. Điều
      bắt buộc giữ: quy trình chạy lại được và phép kiểm độc lập, trên mẫu nhỏ và
      trên dữ liệu thật.</div>'
    clear: true
    say: Về quyết định, chỉ chốt tệp lệnh, mẫu nhỏ và báo cáo, kèm ghi chú cách lấy
      tệp bảng gốc. Hai trăm bốn mươi tám triệu byte mỗi lần đổi, nhân với số lần
      chốt, làm kho phình ra, và tệp gốc có thể chứa dữ liệu nhạy cảm. Điều bắt buộc
      giữ là quy trình chạy lại được và phép kiểm độc lập, trên cả mẫu nhỏ lẫn dữ
      liệu thật.
- id: practice
  kind: practice
  title: 'Tự làm: sổ tay chi tiêu bằng bash, SQL và git'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>so_tay.sh</code>. Chép nguyên đoạn dữ liệu <code>gd.csv</code>
      (8 dòng chi tiêu, xem <code>de.md</code>). Rồi viết:</p>

      <ol><li>tạo bảng <code>gd (ngay, loai, so_tien)</code>, nạp dữ liệu, in <b>tổng
      chi theo loại</b> (loại khác <code>luong</code>) và dòng <code>so du</code>
      (lương <b>trừ</b> chi);</li>

      <li>kiểm độc lập: tính số dư bằng <code>awk</code> từ chính tệp csv, in <code>tong
      khop: …</code> hoặc <code>LECH: …</code>;</li>

      <li>tạo kho <code>repo</code>, chốt <code>bao_cao.txt</code> và <code>gd.csv</code>
      với lời nhắn <code>bao cao thang 1</code>, in <code>git log --format=%s</code>.</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 420
    say: Bây giờ tới phần bạn tự làm, là cả dự án thu nhỏ. Tạo một tệp lệnh, chép
      nguyên đoạn dữ liệu tám dòng chi tiêu. Rồi viết ba việc. Một, tạo bảng, nạp
      dữ liệu, in tổng chi theo loại và dòng số dư, lương trừ chi. Hai, kiểm độc lập,
      tính số dư bằng lệnh xử lý cột từ chính tệp bảng, rồi in khớp hoặc lệch. Ba,
      tạo kho, chốt báo cáo và dữ liệu với lời nhắn cho trước, rồi in lời nhắn của
      lịch sử. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>an|465000</div><div>di_lai|105000</div><div>mua_sam|900000</div><div>so
      du|13530000</div><div>tong khop: 13530000</div><div>bao cao thang 1</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh FND L10 so_tay.sh</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> nạp CSV vào bảng: có thể dùng <code>.import
      --csv --skip 1</code>, hoặc đổi từng dòng thành <code>INSERT</code> bằng <code>sed</code>
      (cách ở <code>loi_giai.sh</code>). Số dư = lương − chi = $15\,000\,000 - 1\,470\,000
      = 13\,530\,000$.

      Nhớ <code>git config user.name</code> và <code>user.email</code> trước khi chốt.
      Lời giải ở <code>labs/FND/L10/loi_giai.sh</code>.</div>

      '
    say: Nếu kẹt, nạp tệp bảng vào bảng bằng lệnh nạp có cờ bỏ dòng tiêu đề, hoặc
      đổi từng dòng thành lệnh chèn bằng lệnh thay chữ. Số dư bằng lương trừ chi,
      mười lăm triệu trừ một triệu bốn trăm bảy mươi nghìn, bằng mười ba triệu năm
      trăm ba mươi nghìn. Nhớ đặt tên và thư điện tử cục bộ trước khi chốt. Lời giải
      nằm trong thư mục thực hành, chỉ mở sau khi đã thử.
    clear: true
  lab: labs/FND/L10
- id: recap
  kind: recap
  title: Chuỗi logic, tư duy và nhìn lại cả chặng
  steps:
  - show: '<div class=''chain''><span class=''n''>nối bash + SQL + git bằng tệp lệnh</span><span
      class=''a''>→</span><span class=''n''>chạy từ trạng thái sạch: chạy lại được</span><span
      class=''a''>→</span><span class=''n''>kiểm bằng đường độc lập: SQL = awk = tay</span><span
      class=''a''>→</span><span class=''n''>dữ liệu lớn: không chốt CSV, đặt chỉ mục,
      đọc từng dòng</span><span class=''a''>→</span><span class=''n''>chốt tệp lệnh,
      mẫu, báo cáo</span></div>'
    say: Tổng kết chuỗi logic. Nối dòng lệnh, SQL và quản lý phiên bản bằng một tệp
      lệnh. Chạy từ trạng thái sạch để chạy lại được. Kiểm bằng đường độc lập, SQL
      bằng lệnh xử lý cột bằng tay. Khi dữ liệu lớn, không chốt tệp bảng khổng lồ,
      đặt chỉ mục, đọc từng dòng. Và chốt tệp lệnh, mẫu nhỏ và báo cáo.
  - show: <table class='t'><tr><th>bạn đã có</th><th>dùng ở đâu tiếp</th></tr><tr><td>dòng
      lệnh, tệp, đường dẫn, ống, mã thoát</td><td>mọi thao tác biên dịch, chạy, kiểm</td></tr><tr><td>CSV,
      JSON, YAML</td><td>đọc và viết dữ liệu, tệp cấu hình</td></tr><tr><td>HTTP và
      curl</td><td>gọi và kiểm một dịch vụ</td></tr><tr><td>SQL cơ bản và giao dịch</td><td>lưu
      và hỏi dữ liệu có bảo đảm</td></tr><tr><td>quản lý phiên bản</td><td>ghi lại
      và quay lại mọi thay đổi</td></tr></table><div class='box key'><b>Tư duy:</b>
      một quy trình tốt là <b>chạy lại được</b>, <b>kiểm được bằng đường độc lập</b>,
      và <b>nhỏ gọn để chốt</b>. Bạn đã có đủ nền để bắt đầu viết chương trình thật.</div>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - 2
    - 2
    say: Đây là những gì bạn đã có, và dùng ở đâu tiếp. Dòng lệnh, tệp, ống và mã
      thoát dùng cho mọi thao tác biên dịch, chạy và kiểm. Dữ liệu có cấu trúc để
      đọc và viết dữ liệu, tệp cấu hình. Giao thức HTTP để gọi và kiểm một dịch vụ.
      SQL và giao dịch để lưu và hỏi dữ liệu có bảo đảm. Quản lý phiên bản để ghi
      lại và quay lại mọi thay đổi. Điều cần mang theo, một quy trình tốt chạy lại
      được, kiểm được bằng đường độc lập, và nhỏ gọn để chốt. Bạn đã có đủ nền để
      bắt đầu viết chương trình thật.
    clear: true
