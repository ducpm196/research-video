      font-size="24" text-anchor="middle" fill="#1f2937">đầu vào, nhỏ</text><line
      x1="265" y1="210" x2="320" y2="210" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="325" y="150" width="270" height="120" rx="10" fill="#dbeafe" stroke="#2a78d6"
