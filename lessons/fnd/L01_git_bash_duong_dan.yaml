      giới hạn</td></tr><tr><td>×7,25: 29 cấp</td><td>3 + 9 × 29 − 1 = 263 ký tự</td><td><b>vượt</b></td></tr></table><span
      class=''note''>Số minh hoạ: mỗi cấp 8 ký tự tên + 1 dấu ngăn; 3 ký tự đầu là
