  - show: '<p><b>Bước 3. Lùi bằng <code>..</code>.</b> Mỗi <code>..</code> lùi một
      cấp, nên số lần lùi bằng hiệu độ sâu:</p>

      $$\text{số lần lùi} = \text{độ sâu chỗ đứng} - \text{độ sâu của thư mục chung}$$

      <p class="note">Làm thử: từ <code>/c/Users/ban/hoc/nen</code> (độ sâu 5) tới
