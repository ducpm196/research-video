scenes:
- id: hook
  kind: hook
  title: 'Lệnh chạy được trên máy bạn, báo lỗi trên máy người khác: vì sao?'
  steps:
  - show: '<p><b>Máy của bạn Lan, chép lệnh của anh A</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>ls /c/Users/anhA/du_lieu.csv</div><div>ls:
      cannot access ''/c/Users/anhA/du_lieu.csv'': No such file or directory</div></div><p>Tệp
      <code>du_lieu.csv</code> có thật, nhưng nằm ở máy anh A. Dòng báo lỗi nghĩa
      là: <b>“không có tệp hay thư mục như vậy”</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Chào bạn, hãy nhìn tình huống này. Anh A viết một lệnh đọc tệp dữ liệu, chạy
      tốt trên máy anh. Bạn Lan chép nguyên lệnh sang máy mình và nhận về một dòng
      báo lỗi bằng tiếng Anh. Dòng đó nghĩa là không có tệp hay thư mục như vậy. Tệp
      vẫn có thật, nhưng nằm ở máy anh A, vì đường dẫn đã ghi cứng tên thư mục của
      anh ấy.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Cửa sổ lệnh cho bạn thấy <b>đang đứng ở đâu</b> trong máy bằng cách
      nào?</li>

      <li>Làm sao <b>đi</b> tới thư mục khác, và <b>nhìn</b> xem trong đó có gì?</li>

      <li>Vì sao đường dẫn <b>tuyệt đối</b> hay hỏng khi chép sang máy khác, còn <b>tương
      đối</b> thì sao?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Cửa sổ lệnh cho bạn thấy đang đứng ở đâu trong
      máy bằng cách nào. Làm sao đi tới thư mục khác và nhìn xem trong đó có gì. Và
      vì sao đường dẫn tuyệt đối hay hỏng khi chép sang máy khác, còn đường dẫn tương
      đối thì sao.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp, thư mục và cây'
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      tệp</td><td>dữ liệu có tên, ví dụ <code>meo.png</code> (đuôi <code>.png</code>
      cho biết loại)</td></tr><tr><td>② thư mục</td><td>ngăn chứa tệp <b>và cả thư
      mục khác</b>, ví dụ <code>anh</code> chứa hai ảnh</td></tr><tr><td>③ cây thư
      mục</td><td>thư mục nằm trong thư mục, vẽ thành cây lộn ngược; gốc ở trên, lá
      là tệp</td></tr><tr><td>④ Explorer</td><td>chương trình duyệt thư mục của Windows,
      địa chỉ viết <code>C:\Users\ban\anh</code></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Tệp là dữ liệu có tên, phần đuôi sau dấu chấm cho biết
      loại tệp. Thư mục là ngăn chứa tệp và cả thư mục khác. Thư mục nằm trong thư
      mục tạo thành cây lộn ngược, gốc ở trên, lá là tệp. Và trình duyệt thư mục của
      hệ điều hành là chương trình bạn đã dùng hằng ngày.
- id: sym
  kind: symbol
  title: Giải mã dấu nhắc, ba lệnh đầu tiên và các dấu của đường dẫn
  steps:
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>$</code></td><td>dấu
      nhắc</td><td>máy đang chờ bạn gõ; <b>không gõ</b> dấu này</td></tr><tr><td><code>pwd</code></td><td>lệnh
      in vị trí</td><td>cho biết <b>đang đứng ở đâu</b></td></tr><tr><td><code>ls</code></td><td>lệnh
      liệt kê</td><td>cho biết <b>trong đây có gì</b></td></tr><tr><td><code>cd hoc</code></td><td>lệnh
      đổi thư mục</td><td><b>đi vào</b> thư mục tên hoc; <code>hoc</code> là một <b>tham
      số</b></td></tr></table><span class='note'>Lệnh = tên lệnh + các tham số, cách
      nhau bằng khoảng trắng; bấm phím xuống dòng để chạy.</span>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    say: Bảng này giải mã dấu nhắc và ba lệnh đầu tiên. Dấu nhắc là chỗ máy đang chờ
      bạn gõ, và bạn không gõ dấu này. Lệnh in vị trí cho biết bạn đang đứng ở đâu.
      Lệnh liệt kê cho biết trong đây có gì. Lệnh đổi thư mục đi vào thư mục có tên
      đứng sau, và tên đó gọi là tham số. Một lệnh gồm tên lệnh và các tham số, cách
      nhau bằng khoảng trắng, rồi bấm phím xuống dòng để chạy.
  - show: <table class='t'><tr><th>viết</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td><code>/</code></td><td><b>gốc</b>
      của cây, và dấu ngăn các cấp</td><td><code>/c/Users/ban</code></td></tr><tr><td><code>~</code></td><td>thư
      mục <b>nhà</b> của bạn</td><td><code>/c/Users/ban</code></td></tr><tr><td><code>.</code></td><td>thư
      mục <b>hiện tại</b></td><td><code>ls .</code> = <code>ls</code></td></tr><tr><td><code>..</code></td><td>thư
      mục <b>cha</b>, lên một cấp</td><td><code>cd ..</code></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là các dấu của đường dẫn. Dấu gạch chéo là gốc của cả cây, và
      cũng là dấu ngăn các cấp. Dấu ngã là thư mục nhà của bạn. Một dấu chấm là thư
      mục hiện tại. Hai dấu chấm là thư mục cha, lên một cấp.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>-a</code></td><td><b>cờ</b>
      = tuỳ chọn của lệnh; <code>ls -a</code> hiện cả <b>tệp ẩn</b> (tên bắt đầu bằng
      dấu chấm)</td></tr><tr><td><code>C:\Users\ban</code> ↔ <code>/c/Users/ban</code></td><td>Windows
      viết <code>\</code> và chữ ổ đĩa; Git Bash viết <code>/</code>: ổ C là <code>/c</code>,
      ổ D là <code>/d</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    clear: true
    say: Bảng cuối có hai điều nữa. Dấu gạch ngang kèm chữ là cờ, một tuỳ chọn của
      lệnh, ví dụ cờ a hiện cả tệp ẩn, tên bắt đầu bằng dấu chấm. Và hệ điều hành
      của máy dùng gạch chéo ngược cùng chữ ổ đĩa, còn cửa sổ lệnh dùng gạch chéo
      xuôi, ổ C viết là gạch chéo c.
