      nên luôn đếm từ gốc. Vì vậy cùng một đường dẫn trỏ cùng một chỗ, dù bạn đang
      đứng đâu. Làm thử, đi tới thư mục anh bằng đường dẫn tuyệt đối thì lúc nào cũng
      tới đúng chỗ đó.
  - show: '<p><b>Bước 2. Tương đối.</b> Không bắt đầu bằng <code>/</code>: đếm từ
      <b>chỗ đang đứng</b>, nên cùng một chữ ở hai chỗ đứng khác nhau trỏ hai nơi
      khác nhau.</p>

      <p class="note">Làm thử: đứng ở <code>ban</code>, <code>cd hoc</code> tới <code>ban/hoc</code>;
      đứng ở <code>anh</code> thì <code>cd hoc</code> báo lỗi vì không có <code>hoc</code>
      ở đó ✓</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước hai, đường dẫn tương đối. Nó không bắt đầu bằng dấu gạch chéo, nên đếm
      từ chỗ đang đứng. Vì vậy cùng một chữ, ở hai chỗ đứng khác nhau, trỏ hai nơi
      khác nhau. Làm thử, đứng ở thư mục nhà thì đi vào hoc được, nhưng đứng ở thư
      mục anh thì báo lỗi, vì ở đó không có hoc.
