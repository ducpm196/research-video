source: 'curriculum/fnd.yaml L01; audit/fnd/verify_fnd.py L01 (Git Bash chạy thật
  pwd/ls/cd trong thư mục tạm); Git for Windows /etc/profile.d/aliases.sh (alias ls
  có -F: đã mở tệp trên máy kiểm); GNU Coreutils manual (ls, pwd), GNU Bash Reference
  Manual (cd, Tilde Expansion, Quoting); Microsoft Learn, Maximum Path Length Limitation
  (MAX_PATH = 260; NOT_VERIFIED: trích theo trí nhớ, chưa mở lại nguyên văn)'
assumes: []
objectives:
- Nêu ý nghĩa của dấu nhắc và ba lệnh in vị trí, liệt kê, đổi thư mục
- Phân biệt đường dẫn tuyệt đối với tương đối và tính số lần lùi bằng hai dấu chấm
- Đi một vòng trong cây thư mục bằng các lệnh cd và kiểm vị trí bằng pwd
- Kiểm một đích đến bằng hai cách đi khác nhau
- 'Chỉ ra ba lỗi hay gặp: khoảng trắng, gạch chéo ngược, chữ hoa chữ thường'
- Đi theo cây cho trước chỉ bằng đường tương đối và in nội dung từng thư mục
asr_reviewed:
  - {sentence: "Lệnh hai xuống nen.", reason: "ASR chép “Lệnh 2 xuống nên.” (0.75): lệch âm/thanh thuần Việt: nen/nên — NOT_VERIFIED bằng tai người"}
