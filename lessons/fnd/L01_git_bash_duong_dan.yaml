      có tên khác, nên viết đường dẫn tuyệt đối tới anh hay đường dẫn tương đối, và
      vì sao. Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>lệnh</th><th>vị trí sau lệnh</th><th>lý do</th></tr><tr><td>①
      <code>cd ..</code></td><td><code>/c/Users/ban/hoc</code></td><td>lùi một cấp
      từ toan</td></tr><tr><td>② <code>cd nen</code></td><td><code>/c/Users/ban/hoc/nen</code></td><td>xuống
      nen, nằm trong hoc</td></tr><tr><td>③ <code>cd ../../anh</code></td><td><code>/c/Users/ban/anh</code></td><td>lùi
      hai cấp tới ban, rồi xuống anh</td></tr><tr><td>④ <code>cd</code></td><td><code>/c/Users/ban</code></td><td>không
      tham số: về nhà</td></tr><tr><td>⑤ <code>cd hoc/toan</code></td><td><code>/c/Users/ban/hoc/toan</code></td><td>xuống
      hai cấp một lần</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Đáp án từng bước. Lệnh một lùi một cấp từ toan, vào hoc. Lệnh hai xuống nen.
      Lệnh ba lùi hai cấp tới ban, rồi xuống anh. Lệnh bốn không có tham số nên về
      nhà. Lệnh năm xuống hai cấp liền, về lại toan, đúng chỗ bắt đầu.
    clear: true
  - show: <p><b>Máy chạy lại đúng các lệnh đó (kèm vị trí)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>pwd</div><div>/c/Users/ban/hoc</div><div><span
      class="cm"><span>&#36;</span> </span>cd nen</div><div><span class="cm"><span>&#36;</span>
      </span>pwd</div><div>/c/Users/ban/hoc/nen</div><div><span class="cm"><span>&#36;</span>
      </span>cd ../../anh</div><div><span class="cm"><span>&#36;</span> </span>pwd</div><div>/c/Users/ban/anh</div><div><span
      class="cm"><span>&#36;</span> </span>cd</div><div><span class="cm"><span>&#36;</span>
      </span>pwd</div><div>/c/Users/ban</div><div><span class="cm"><span>&#36;</span>
      </span>cd hoc/toan</div><div><span class="cm"><span>&#36;</span> </span>pwd</div><div>/c/Users/ban/hoc/toan</div></div>
    clear: true
    say: Máy chạy lại đúng các lệnh đó, và vị trí in ra khớp từng dòng với đáp án
      của bạn.
  - show: <div class='box key'><b>Quyết định:</b> đường dẫn <b>tuyệt đối</b> chứa
      tên <code>ban</code> nên hỏng trên máy khác. Đường tương đối <code>../../anh</code>
      chạy được trên mọi máy, miễn là chạy từ đúng thư mục <code>nen</code>; vì thế
      tệp lệnh tốt tự đổi về thư mục của chính nó trước.</div>
    clear: true
    say: Về quyết định, đường dẫn tuyệt đối chứa tên ban nên hỏng trên máy khác. Đường
      dẫn tương đối chạy được trên mọi máy, miễn là chạy từ đúng thư mục nen. Vì vậy
      tệp lệnh tốt tự đổi về thư mục của chính nó trước. Cách làm có khi ta học chạy
      tệp lệnh.
- id: practice
  kind: practice
  title: 'Tự làm: đi theo cây, nhìn bằng ls'
  steps:
  - show: '<p><b>Đề</b>: tạo tệp <code>di.sh</code> gồm đoạn dựng cây (chép nguyên)
      rồi các lệnh của bạn.</p>

      <div class="code"><div>mkdir -p vp/kho/a vp/kho/b vp/ho_so</div><div>touch vp/kho/a/x.txt
      vp/kho/b/y.txt vp/kho/b/z.txt vp/ho_so/hd.txt</div><div>cd vp/kho/b</div></div>

      <ol><li>Đang đứng ở <code>b</code>: in nội dung <code>b</code>.</li>

      <li>Chỉ dùng <b>đường tương đối</b> tới <code>ho_so</code>, in nội dung.</li>

      <li>Từ <code>ho_so</code> tới <code>a</code>, in nội dung.</li>

      <li>In nội dung thư mục <b>cha</b> của <code>a</code> (không cần đi tới đó).</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 3
    - 3
    pause: 150
    clear: true
    say: Bây giờ tới phần bạn tự làm. Tạo một tệp lệnh, bắt đầu bằng đoạn dựng cây
      trên màn hình, chép nguyên, bạn chưa cần hiểu các lệnh đó. Rồi viết các lệnh
      của bạn. Đang đứng ở thư mục b, hãy liệt kê nội dung của nó. Chỉ dùng đường
      dẫn tương đối để tới thư mục ho sơ và liệt kê. Từ đó tới thư mục a và liệt kê.
      Cuối cùng liệt kê thư mục cha của a mà không cần đi tới đó. Hãy dừng video và
      làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>y.txt</div><div>z.txt</div><div>hd.txt</div><div>x.txt</div><div>a</div><div>b</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh FND L01 di.sh</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> từ <code>b</code> tới <code>ho_so</code>
      phải lùi hai cấp: <code>cd ../../ho_so</code>. Từ <code>ho_so</code> tới <code>a</code>:
      lùi một cấp, xuống <code>kho/a</code>.

      Cha của <code>a</code> là <code>..</code> nên <code>ls ..</code>. Lời giải ở
      <code>labs/FND/L01/loi_giai.sh</code>.</div>

      '
    say: Nếu kẹt, từ thư mục b tới ho sơ phải lùi hai cấp, rồi xuống ho sơ. Từ ho
      sơ tới a thì lùi một cấp rồi xuống kho và a. Thư mục cha của a chính là hai
      dấu chấm. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã thử.
    clear: true
  lab: labs/FND/L01
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>dấu nhắc: máy chờ lệnh</span><span
      class=''a''>→</span><span class=''n''>pwd: đang đứng ở đâu</span><span class=''a''>→</span><span
      class=''n''>ls: trong đây có gì</span><span class=''a''>→</span><span class=''n''>cd:
      đi sang chỗ khác</span><span class=''a''>→</span><span class=''n''>tuyệt đối:
      đếm từ gốc /</span><span class=''a''>→</span><span class=''n''>tương đối: đếm
      từ chỗ đứng, .. lùi một cấp</span></div>'
    say: Tổng kết chuỗi logic. Dấu nhắc cho biết máy chờ lệnh. Lệnh in vị trí cho
      biết đang đứng ở đâu. Lệnh liệt kê cho biết trong đây có gì. Lệnh đổi thư mục
      đi sang chỗ khác. Đường dẫn tuyệt đối đếm từ gốc, đường dẫn tương đối đếm từ
      chỗ đứng và hai dấu chấm lùi một cấp.
  - show: '<div class=''box key''><b>Tư duy:</b> trước mỗi lệnh, tự hỏi “mình đang
      đứng ở đâu?”. Lệnh chạy tốt hay hỏng thường chỉ vì chỗ đứng.</div>

      <p>Bài sau: tạo thư mục và tệp, chép, đổi tên, và xoá, tức làm cho cây thay
      đổi.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, trước mỗi lệnh, hãy tự hỏi mình đang đứng ở đâu. Lệnh
      chạy tốt hay hỏng thường chỉ vì chỗ đứng. Bài sau, ta học tạo thư mục và tệp,
      chép, đổi tên và xoá, tức là làm cho cây thay đổi.
    clear: true
