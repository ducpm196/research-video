- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>head, tail, wc -l: nhìn và đếm</span><span
      class=''a''>→</span><span class=''n''>grep: lọc dòng; cut: lấy cột</span><span
      class=''a''>→</span><span class=''n''>sort rồi uniq -c: nhóm và đếm</span><span
      class=''a''>→</span><span class=''n''>| nối đầu ra vào đầu vào</span><span class=''a''>→</span><span
      class=''n''>sort -n cho số</span><span class=''a''>→</span><span class=''n''>&gt;
      lưu kết quả; 2&gt; bắt lỗi</span></div>'
    say: Tổng kết chuỗi logic. Xem đầu, xem cuối và đếm dòng để nhìn tệp. Lọc dòng,
      cắt cột. Xếp rồi gộp để nhóm và đếm. Dấu ống nối đầu ra vào đầu vào. Cột số
      phải xếp theo số. Và dấu lớn hơn lưu kết quả, chữ hai dấu lớn hơn bắt thông
      báo lỗi.
