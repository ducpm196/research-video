    say: Đáp án câu một, có ba giao dịch rút, mang mã ba, bảy và mười một. Câu hai,
      lọc tài khoản A không hai, cắt cột số tiền, xếp theo số, lấy dòng cuối, ra hai
      triệu.
  - show: '<div class=''box key''><b>Quyết định:</b> cả hai cùng ra $6$. Chọn <code>grep
      -c</code>: một lệnh, ngắn, ít chỗ sai. Dùng ống khi cần <b>xử lý tiếp</b> các
      dòng đã lọc (cắt cột, xếp, ...), vì chỉ khi đó đầu ra trung gian mới có ích.</div>'
