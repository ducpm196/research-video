    - 3
    - 3
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Dùng tệp giao dịch mười hai dòng ở trên. Câu
      một, có bao nhiêu giao dịch rút. Câu hai, giao dịch lớn nhất của tài khoản A
      không hai là bao nhiêu. Sau đó là một quyết định, để đếm lệnh chuyển thì chọn
      cờ c hay chọn ống nối với lệnh đếm dòng, và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Câu 1 và câu 2</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>grep -c rut giaodich.csv</div><div>3</div><div><span class="cm"><span>&#36;</span>
