      x2="1060" y2="200" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="1002" y="150" font-size="22" text-anchor="middle" fill="#dc2626">thông báo
      lỗi</text><rect x="1070" y="170" width="400" height="80" rx="10" fill="#fee2e2"
      stroke="#dc2626" stroke-width="3"/><text x="1270.0" y="218" font-size="24" text-anchor="middle"
      fill="#1f2937">luồng lỗi: 2&gt; chuyển riêng</text><text x="750" y="310" font-size="24"
      text-anchor="middle" fill="#1f2937" font-weight="bold">hai đường ra: kết quả
      đi qua ống, lỗi mặc định vẫn hiện trên màn hình</text></svg></div>'
    clear: true
    say: Hình thứ hai cho thấy mỗi lệnh có một đầu vào và hai đường ra. Đường thứ
      nhất là kết quả, đi qua ống hoặc vào tệp. Đường thứ hai là thông báo lỗi, mặc
      định vẫn hiện trên màn hình. Vì vậy chuyển hướng hay ống chỉ bắt được kết quả,
      còn lỗi muốn bắt phải dùng chữ hai và dấu lớn hơn.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: vì sao phải xếp trước khi gộp, và xếp theo số khác xếp
    theo chữ'
  checks:
  - 6 + 3 + 3 == 12
  - '''1000000'' < ''120000'''
  - 1000000 > 120000
  - sorted([500000, 2000000, 300000, 150000, 800000, 1000000, 200000, 50000, 750000,
    120000, 400000, 900000])[:3] == [50000, 120000, 150000]
  steps:
  - show: '<p><b>Bước 1. Gộp mà chưa xếp: chỉ gộp được dòng LIỀN KỀ</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>cut -d, -f2 giaodich.csv | tail -n +2 |
      uniq -c | head -n 4</div><div>      1 chuyen</div><div>      1 nap</div><div>      1
      rut</div><div>      2 chuyen</div></div><p>Vì <code>uniq</code> chỉ so mỗi dòng
      với dòng <b>ngay trước</b> nó, các lệnh <code>chuyen</code> nằm rải rác nên
      không được gộp: ra số $1$, $1$, $1$, $2$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, thử gộp mà chưa xếp. Vì lệnh gộp chỉ so mỗi dòng với dòng ngay
      trước nó, nên các dòng chuyển nằm rải rác không được gộp. Kết quả là một, một,
      một, rồi hai, và ta chưa có thống kê nào.
  - show: '<p><b>Bước 2. Xếp trước để các dòng giống nhau nằm liền nhau</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>cut -d, -f2 giaodich.csv
      | tail -n +2 | sort | uniq -c</div><div>      6 chuyen</div><div>      3 nap</div><div>      3
      rut</div></div><p>Nên <code>sort | uniq -c</code>: xếp xong, sáu dòng <code>chuyen</code>
      liền nhau, gộp thành $6$. Kiểm: $6 + 3 + 3 = \hl{12}$ dòng dữ liệu ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, xếp trước. Sau khi xếp, các dòng giống nhau nằm liền nhau, nên
      lệnh gộp đếm đúng, sáu lệnh chuyển, ba lệnh nạp và ba lệnh rút. Làm thử, sáu
      cộng ba cộng ba bằng mười hai, đúng bằng số dòng dữ liệu.
  - show: '<p><b>Bước 3. Xếp theo chữ khác xếp theo số</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>cut -d, -f4 giaodich.csv | tail -n +2 |
      sort | head -n 3</div><div>1000000</div><div>120000</div><div>150000</div><div><span
      class="cm"><span>&#36;</span> </span>cut -d, -f4 giaodich.csv | tail -n +2 |
      sort -n | head -n 3</div><div>50000</div><div>120000</div><div>150000</div></div><p>Vì
      mặc định <code>sort</code> so <b>từng ký tự</b> từ trái sang, <code>1000000</code>
      đứng trước <code>120000</code> (ký tự thứ hai: chữ số 0 đứng trước chữ số 2).
      Thêm <code>-n</code> để so theo <b>giá trị</b>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, xếp theo chữ khác xếp theo số. Vì mặc định lệnh xếp so từng ký tự
      từ trái sang, nên một triệu đứng trước một trăm hai mươi nghìn, vì ký tự thứ
      hai là không nhỏ hơn hai. Thêm cờ n thì so theo giá trị, và số nhỏ nhất, năm
      mươi nghìn, hiện đầu tiên.
- id: example
  kind: example
  title: 'Ví dụ: hỏi tệp giao dịch năm câu'
  checks:
  - 1 + 12 == 13
  - 13 - 1 == 12
  - len([1, 4, 5, 8, 10, 12]) == 6
  - 13 - 6 == 7
  - 'max([(''chuyen'', 6), (''nap'', 3), (''rut'', 3)], key=lambda t: t[1])[0] ==
    ''chuyen'''
  steps:
  - show: '<p><b>① Xem đầu, xem cuối, đếm dòng</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>head -n 3 giaodich.csv</div><div>ma,loai,tai_khoan,so_tien</div><div>1,chuyen,A01,500000</div><div>2,nap,A02,2000000</div><div><span
      class="cm"><span>&#36;</span> </span>tail -n 2 giaodich.csv</div><div>11,rut,A02,400000</div><div>12,chuyen,A03,900000</div><div><span
      class="cm"><span>&#36;</span> </span>wc -l giaodich.csv</div><div>13 giaodich.csv</div></div><p>Tệp
      có $13$ dòng: $1$ dòng tiêu đề và $12$ giao dịch.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Câu hỏi thứ nhất, tệp trông thế nào. Xem ba dòng đầu thấy dòng tiêu đề và
      hai giao dịch. Xem hai dòng cuối thấy giao dịch mười một và mười hai. Đếm dòng
      ra mười ba, gồm một dòng tiêu đề và mười hai giao dịch.
  - show: <p><b>② Đếm giao dịch, bỏ tiêu đề</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>tail -n +2 giaodich.csv | wc -l</div><div>12</div></div><p><b>③ Lọc theo
      loại</b></p><div class="code"><div><span class="cm"><span>&#36;</span> </span>grep
      chuyen giaodich.csv</div><div>1,chuyen,A01,500000</div><div>4,chuyen,A03,150000</div><div>5,chuyen,A02,800000</div><div>8,chuyen,A01,50000</div><div>10,chuyen,A02,120000</div><div>12,chuyen,A03,900000</div><div><span
      class="cm"><span>&#36;</span> </span>grep -c chuyen giaodich.csv</div><div>6</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Câu hỏi thứ hai, có bao nhiêu giao dịch. Bỏ dòng tiêu đề rồi đếm, ra mười
      hai. Câu hỏi thứ ba, những dòng nào là lệnh chuyển. Lệnh tìm in sáu dòng chứa
      chữ chuyển, và cờ c cho đếm thẳng, cũng ra sáu.
  - show: '<p><b>④ Dòng KHÔNG chứa mẫu; hai lần lọc nối nhau</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>grep -v chuyen giaodich.csv | wc -l</div><div>7</div><div><span
      class="cm"><span>&#36;</span> </span>grep A01 giaodich.csv | grep rut</div><div>3,rut,A01,300000</div></div><p>Bảy
      dòng không chứa <code>chuyen</code> (kể cả dòng tiêu đề). Rồi lọc tiếp: tài
      khoản A01 <b>và</b> loại rút.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Câu hỏi thứ tư, những dòng nào không phải lệnh chuyển. Cờ v lấy các dòng
      không chứa mẫu, có bảy dòng, kể cả dòng tiêu đề. Rồi lọc hai lần nối nhau, chỉ
      lấy tài khoản A không một và loại rút, ra đúng một giao dịch.
  - show: '<p><b>⑤ Loại nhiều nhất, rồi lưu kết quả vào tệp</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>cut -d, -f2 giaodich.csv | tail -n +2 |
      sort | uniq -c | sort -rn | head -n 1</div><div>      6 chuyen</div><div><span
      class="cm"><span>&#36;</span> </span>cut -d, -f2 giaodich.csv | tail -n +2 |
      sort | uniq -c &gt; thong_ke.txt</div><div><span class="cm"><span>&#36;</span>
      </span>cat thong_ke.txt</div><div>      6 chuyen</div><div>      3 nap</div><div>      3
      rut</div></div><p>Xếp ngược theo số lần, lấy dòng đầu: <code>chuyen</code> nhiều
      nhất ($6$ lần). Ghi bằng <code>&gt;</code> để giữ lại.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Câu hỏi thứ năm, loại nào nhiều nhất. Ta xếp bảng thống kê theo số lần, từ
      lớn xuống nhỏ, rồi lấy dòng đầu. Đó là loại chuyển với sáu lần. Cuối cùng ta
      ghi bảng thống kê vào một tệp bằng dấu lớn hơn, để giữ lại và đọc sau.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: ba cách đếm cùng một con số'
  checks:
  - 6 + 3 + 3 == 12
  - 13 - 1 == 12
  steps:
  - show: '<p><b>Cách 1: đếm bằng cờ -c</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>grep -c chuyen giaodich.csv</div><div>6</div></div><p><b>Cách 2: lọc
      rồi đếm dòng bằng ống</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>grep chuyen giaodich.csv | wc -l</div><div>6</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Đường kiểm khác, đếm số lệnh chuyển bằng hai cách. Cách một dùng cờ c của
      lệnh tìm. Cách hai lọc ra các dòng rồi chuyển qua ống cho lệnh đếm dòng. Cả
      hai cùng ra sáu, vì cùng đếm các dòng chứa chữ chuyển.
  - show: '<p>Cách 3: từ bảng thống kê, $6$ lệnh chuyển. Tổng ba nhóm $6 + 3 + 3 =
      12$ trùng số dòng dữ liệu ở bước ②, nên không có dòng nào bị bỏ sót hay đếm
      hai lần ✓</p>'
    clear: true
    say: Cách ba, đối chiếu với bảng thống kê. Sáu lệnh chuyển, và tổng ba nhóm là
      mười hai, trùng với số dòng dữ liệu đã đếm. Vì vậy không có dòng nào bị bỏ sót
      hay đếm hai lần.
- id: scale
  kind: concept
  title: 'Khi tệp nhân lên: ống xử lý từng dòng, mở cả tệp thì không'
  checks:
  - 10000 // 100 == 100 and 12 * 100 == 1200 and 12 * 10000 == 120000
  - 100_000_000 * 35 == 3_500_000_000
  - round(728895 / 1e6, 1) == 0.7
  steps:
  - show: '<p><b>×1: 12 dòng</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>wc -l t12.txt</div><div>12 t12.txt</div><div><span class="cm"><span>&#36;</span>
      </span>wc -c t12.txt</div><div>27 t12.txt</div></div><p><b>×100: 1 200 dòng</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>wc -l t1200.txt</div><div>1200
      t1200.txt</div><div><span class="cm"><span>&#36;</span> </span>wc -c t1200.txt</div><div>4893
      t1200.txt</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Ta tạo hai tệp số bằng lệnh in dãy số, một tệp mười hai dòng, một tệp một
      nghìn hai trăm dòng. Số byte tăng theo, hai mươi bảy rồi bốn nghìn tám trăm
      chín mươi ba.
  - show: '<p><b>×10 000: 120 000 dòng</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>wc -l t120k.txt</div><div>120000 t120k.txt</div><div><span class="cm"><span>&#36;</span>
      </span>wc -c t120k.txt</div><div>728895 t120k.txt</div><div><span class="cm"><span>&#36;</span>
      </span>tail -n 1 t120k.txt</div><div>120000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Tệp thứ ba có một trăm hai mươi nghìn dòng, hơn bảy trăm nghìn byte. Dòng
      cuối của nó, một trăm hai mươi nghìn, hiện ra tức thì, vì lệnh xem cuối không
      cần mở cả tệp vào bộ nhớ.
  - show: '<table class=''t''><tr><th>số dòng</th><th>dung lượng đo được</th><th>ngoại
      suy: 100 triệu dòng giao dịch × 35 byte/dòng (số minh hoạ)</th></tr><tr><td>×1:
      12</td><td>27 byte</td><td>—</td></tr><tr><td>×100: 1 200</td><td>4 893 byte</td><td>—</td></tr><tr><td>×10
      000: 120 000</td><td>728 895 byte (≈ 0,7 MB)</td><td>≈ 3,5 tỉ byte, tức ≈ 3,5
      GB</td></tr></table><div class=''box key''><b>Đánh đổi:</b> ống đọc và xử lý
      <b>từng dòng</b>, nên tệp lớn hơn bộ nhớ vẫn xử lý được; mở cả tệp để xem hay
      sửa thì phải nạp hết vào bộ nhớ. Riêng <code>sort</code> phải thấy mọi dòng,
      nên với dữ liệu rất lớn nó dùng tệp tạm trên đĩa và chậm hơn.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bảng này ghi dung lượng đo được. Một trăm hai mươi nghìn dòng chỉ hơn bảy
      trăm nghìn byte. Nhưng một sổ cái một trăm triệu dòng, mỗi dòng ba mươi lăm
      byte, số minh hoạ, đã khoảng ba phẩy năm tỉ byte, lớn hơn bộ nhớ của nhiều máy.
      Ống xử lý từng dòng nên vẫn chạy được, còn mở cả tệp bằng trình soạn thảo thì
      không. Riêng lệnh xếp phải thấy mọi dòng, nên với dữ liệu quá lớn nó dùng tệp
      tạm trên đĩa và chậm hơn.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Gộp bằng <code>uniq -c</code>
      mà quên <code>sort</code> trước.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>cut -d, -f2 giaodich.csv | tail -n +2 | uniq -c | head -n 4</div><div>      1
      chuyen</div><div>      1 nap</div><div>      1 rut</div><div>      2 chuyen</div></div><p>Phép
      thử bắt được lỗi: tổng các số phải bằng số dòng dữ liệu, và mỗi loại chỉ được
      xuất hiện <b>một</b> lần. Ở đây <code>chuyen</code> xuất hiện nhiều lần.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là gộp mà quên xếp trước. Phép thử bắt được
      lỗi này là mỗi loại chỉ được xuất hiện một lần trong bảng thống kê. Ở đây loại
      chuyển xuất hiện nhiều lần, nên bảng sai.
  - show: <div class="box warn"><b>Lỗi 2 (người mới).</b> Dấu chấm trong mẫu của <code>grep</code>
      khớp <b>mọi</b> ký tự.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo 125 &gt; so.txt</div><div><span class="cm"><span>&#36;</span> </span>echo
      1.5 &gt;&gt; so.txt</div><div><span class="cm"><span>&#36;</span> </span>grep
      1.5 so.txt</div><div>125</div><div>1.5</div><div><span class="cm"><span>&#36;</span>
      </span>grep -F 1.5 so.txt</div><div>1.5</div></div><p>Mẫu <code>1.5</code> khớp
      cả <code>125</code>. Muốn tìm đúng chữ <code>1.5</code>, thêm cờ <code>-F</code>
      (tìm chuỗi nguyên văn).</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là dấu chấm trong mẫu của lệnh tìm khớp
      mọi ký tự. Mẫu một chấm năm khớp cả một trăm hai mươi lăm, nên ta nhận cả hai
      dòng. Muốn tìm đúng chuỗi, hãy thêm cờ F, tìm chuỗi nguyên văn.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Báo cáo “ba giao dịch
      nhỏ nhất” sai vì xếp theo chữ.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>cut -d, -f4 giaodich.csv | tail -n +2 | sort | head -n 3</div><div>1000000</div><div>120000</div><div>150000</div><div><span
      class="cm"><span>&#36;</span> </span>cut -d, -f4 giaodich.csv | tail -n +2 |
      sort -n | head -n 3</div><div>50000</div><div>120000</div><div>150000</div></div><p>Không
      có <code>-n</code>, <code>1000000</code> bị xếp vào nhóm “nhỏ nhất”. Số liệu
      sai mà <b>không báo lỗi</b>, nên thường lọt vào báo cáo.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là lập báo cáo ba giao dịch nhỏ nhất
      mà xếp theo chữ. Không có cờ n, một triệu bị xếp vào nhóm nhỏ nhất. Kết quả
      sai mà máy không báo lỗi, nên con số sai dễ lọt vào báo cáo. Hãy luôn dùng cờ
      n cho cột số, và đối chiếu một vài giá trị bằng mắt.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - len([3, 7, 11]) == 3
  - max([2000000, 800000, 120000, 400000]) == 2000000
  steps:
  - show: '<p><b>Đề.</b> Dùng tệp <code>giaodich.csv</code> mười hai dòng ở trên (cột:
      <code>ma, loai, tai_khoan, so_tien</code>).</p>

      <ol><li>Có bao nhiêu giao dịch <b>rút</b>?</li>

      <li>Giao dịch <b>lớn nhất</b> của tài khoản A02 là bao nhiêu?</li></ol>

      <p><b>Quyết định:</b> để đếm lệnh chuyển, bạn chọn <code>grep -c chuyen f</code>
      hay <code>grep chuyen f | wc -l</code>? Vì sao?</p>

      '
    focus:
