scenes:
- id: hook
  kind: hook
  title: 'Tệp giao dịch cả trăm nghìn dòng: hỏi một câu, trả lời bằng một dòng lệnh'
  steps:
  - show: '<p><b>Tệp giaodich.csv, bản rút gọn 12 dòng giao dịch (số minh hoạ)</b></p><div
      class="code"><div>ma,loai,tai_khoan,so_tien</div><div>1,chuyen,A01,500000</div><div>2,nap,A02,2000000</div><div>3,rut,A01,300000</div></div><p><b>Hỏi:
      mỗi loại giao dịch có bao nhiêu lệnh?</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>cut -d, -f2 giaodich.csv | tail -n +2 | sort | uniq -c</div><div>      6
      chuyen</div><div>      3 nap</div><div>      3 rut</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, một tệp giao dịch có thể dài hàng trăm nghìn dòng, mở bằng trình
      soạn thảo thì không đọc nổi. Giả sử ai đó hỏi mỗi loại giao dịch có bao nhiêu
      lệnh. Ở đây ta dùng bản rút gọn mười hai dòng, và bốn lệnh nối nhau bằng dấu
      ống trả lời ngay trong một dòng, gồm sáu lệnh chuyển, ba lệnh nạp và ba lệnh
      rút.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Xem <b>đầu</b>, <b>cuối</b> và <b>đếm dòng</b> của một tệp lớn bằng
      lệnh nào?</li>

      <li><b>Lọc</b> dòng theo mẫu và <b>cắt cột</b> của tệp bảng ra sao?</li>

      <li>Dấu <b>ống</b> <code>|</code> nối các lệnh nhỏ thành một lệnh lớn thế nào,
      và vì sao thứ tự quan trọng?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Xem đầu, xem cuối và đếm dòng của một tệp
      lớn bằng lệnh nào. Lọc dòng theo mẫu và cắt cột của tệp bảng ra sao. Và dấu
      ống nối các lệnh nhỏ thành một lệnh lớn thế nào, vì sao thứ tự quan trọng.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp văn bản, lệnh in nội dung, chuyển hướng'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      tệp văn bản</td><td>tệp chứa chữ, mỗi dòng kết thúc bằng một ký tự xuống dòng</td></tr><tr><td>②
      tệp CSV</td><td>bảng viết bằng chữ: mỗi dòng là một hàng, các cột cách nhau
      bằng dấu phẩy, ví dụ <code>1,chuyen,A01,500000</code></td></tr><tr><td>③ lệnh
      in nội dung</td><td><code>cat f.txt</code> in cả tệp ra đầu ra (màn hình)</td></tr><tr><td>④
      chuyển hướng</td><td><code>&gt;</code> ghi đè, <code>&gt;&gt;</code> nối thêm:
      đưa đầu ra vào tệp</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Tệp văn bản chứa chữ, mỗi dòng kết thúc bằng một ký tự
      xuống dòng. Tệp bảng là bảng viết bằng chữ, mỗi dòng là một hàng, các cột cách
      nhau bằng dấu phẩy. Lệnh in nội dung in cả tệp ra đầu ra. Và chuyển hướng đưa
      đầu ra vào tệp, một dấu để ghi đè, hai dấu để nối thêm.
- id: sym
  kind: symbol
  title: Giải mã chín lệnh, cờ và dấu ống
  steps:
  - show: '<table class=''t''><tr><th>lệnh</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>head
      -n 3 f</code></td><td>xem đầu tệp</td><td>in <b>3 dòng đầu</b>; cờ <code>-n</code>
      cho số dòng</td></tr><tr><td><code>tail -n 2 f</code></td><td>xem cuối tệp</td><td>in
      <b>2 dòng cuối</b>; <code>tail -n +2 f</code>: từ dòng thứ 2 trở đi (bỏ dòng
      tiêu đề)</td></tr><tr><td><code>wc -l f</code></td><td>đếm dòng</td><td>in <b>số
      dòng</b> của tệp; cờ <code>-l</code> = lines</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bảng này là ba lệnh đọc. Lệnh xem đầu tệp in vài dòng đầu, cờ n cho biết
      số dòng. Lệnh xem cuối tệp in vài dòng cuối, và nếu viết dấu cộng trước số thì
      in từ dòng đó trở đi, nên dùng để bỏ dòng tiêu đề. Lệnh đếm dòng in số dòng
      của tệp, cờ chữ l là viết tắt của dòng.
  - show: <table class='t'><tr><th>lệnh</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>grep
      chuyen f</code></td><td>tìm dòng chứa mẫu</td><td>in các dòng <b>chứa</b> chữ
      <code>chuyen</code>; <code>-c</code> đếm; <code>-v</code> lấy dòng <b>không</b>
      chứa</td></tr><tr><td><code>cut -d, -f2 f</code></td><td>cắt cột</td><td>lấy
      <b>cột thứ 2</b>; <code>-d,</code> cho biết các cột cách nhau bằng dấu phẩy</td></tr><tr><td><code>sort</code></td><td>xếp
      dòng</td><td>xếp các dòng theo chữ cái; <code>-n</code> theo <b>giá trị số</b>;
      <code>-r</code> đảo ngược</td></tr><tr><td><code>uniq -c</code></td><td>gộp
      dòng trùng</td><td>gộp các dòng <b>giống nhau và liền kề</b>, kèm số lần (<code>-c</code>
      = count)</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là bốn lệnh lọc. Lệnh tìm dòng chứa mẫu in các dòng có mẫu,
      cờ c đếm, cờ v lấy các dòng không có mẫu. Lệnh cắt cột lấy một cột, cờ d cho
      biết dấu ngăn cột, cờ f cho biết số cột. Lệnh xếp dòng xếp theo chữ cái, cờ
      n xếp theo giá trị số, cờ r đảo ngược. Lệnh gộp dòng trùng chỉ gộp các dòng
      giống nhau và liền kề, và cờ c cho biết số lần.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>A
      | B</code></td><td><b>ống</b>: đầu ra của lệnh <code>A</code> trở thành đầu
      vào của lệnh <code>B</code>, không qua tệp trung gian</td></tr><tr><td><code>2&gt;
      f</code></td><td>đưa <b>thông báo lỗi</b> (luồng lỗi) vào tệp <code>f</code>,
      thay vì ra màn hình</td></tr><tr><td><code>/dev/null</code></td><td>“thùng không
      đáy”: ghi vào đó là <b>vứt đi</b>, ví dụ <code>2&gt; /dev/null</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bảng cuối là ba dấu. Dấu ống nối đầu ra của lệnh bên trái thành đầu vào của
      lệnh bên phải, không qua tệp trung gian. Chữ hai và dấu lớn hơn đưa thông báo
      lỗi vào một tệp, thay vì ra màn hình. Và một nơi đặc biệt của máy là thùng không
      đáy, ghi vào đó là vứt đi.
