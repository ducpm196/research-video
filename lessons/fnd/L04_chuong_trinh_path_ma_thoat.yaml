scenes:
- id: hook
  kind: hook
  title: 'Một tệp, ba cách gõ, hai kết quả: máy tìm lệnh ở đâu?'
  steps:
  - show: '<p><b>Tệp chao.sh có thật trong thư mục hiện tại</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>chao.sh</div><div>bash: chao.sh: command
      not found</div><div><span class="cm"><span>&#36;</span> </span>./chao.sh</div><div>xin
      chao</div><div><span class="cm"><span>&#36;</span> </span>bash chao.sh</div><div>xin
      chao</div></div><p>Cùng một tệp, mà gõ <code>chao.sh</code> thì <b>“không tìm
      thấy lệnh”</b>, còn gõ <code>./chao.sh</code> hay <code>bash chao.sh</code>
      thì chạy.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, hãy nhìn một tệp lệnh nhỏ nằm ngay trong thư mục hiện tại. Gõ tên
      tệp trần trụi thì máy báo không tìm thấy lệnh. Gõ thêm dấu chấm gạch chéo phía
      trước, hoặc gọi qua chương trình cửa sổ lệnh, thì tệp chạy bình thường. Cùng
      một tệp mà ba cách gõ cho hai kết quả, và nguyên nhân nằm ở cách máy đi tìm
      lệnh.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Máy <b>tìm</b> một lệnh ở đâu, và <code>PATH</code> là gì?</li>

      <li><b>Biến</b> là gì, <code>export</code> khác gì không có <code>export</code>?</li>

      <li>Làm sao biết một lệnh <b>thành công hay thất bại</b> (mã thoát), và vì sao
      tự động hoá bắt buộc phải kiểm?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Máy tìm một lệnh ở đâu, và đường dẫn tìm lệnh
      là gì. Biến là gì, và thêm chữ xuất ra thì khác gì không thêm. Và làm sao biết
      một lệnh thành công hay thất bại, tức mã thoát, cùng lý do tự động hoá bắt buộc
      phải kiểm.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: lệnh, tệp lệnh, chuyển hướng, chỗ đứng'
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      lệnh</td><td>tên lệnh + các tham số, ví dụ <code>ls hoc</code></td></tr><tr><td>②
      chỗ đứng</td><td>lệnh in vị trí cho biết đang ở đâu; <code>./x</code> nghĩa
      là tệp <code>x</code> <b>ngay tại chỗ đứng</b></td></tr><tr><td>③ tệp văn bản</td><td>dựng
      bằng <code>echo "…" &gt; tep</code>, đọc bằng <code>cat</code></td></tr><tr><td>④
      ống và lỗi</td><td><code>A | B</code> nối lệnh; <code>2&gt; /dev/null</code>
      vứt thông báo lỗi</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Lệnh gồm tên lệnh và các tham số. Chấm gạch chéo rồi
      tên nghĩa là tệp đó nằm ngay tại chỗ đứng. Tệp văn bản dựng bằng lệnh in chữ
      kèm dấu chuyển hướng. Và ống nối lệnh, còn chữ hai kèm dấu lớn hơn vứt thông
      báo lỗi vào thùng không đáy.
- id: sym
  kind: symbol
  title: 'Giải mã: biến, PATH, mã thoát và hai dấu nối lệnh'
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>TEN=ban</code></td><td>gán
      biến</td><td>tạo <b>biến</b> (ô nhớ có tên) <code>TEN</code> chứa <code>ban</code>;
      <b>không</b> có khoảng trắng quanh dấu <code>=</code></td></tr><tr><td><code><span>&#36;</span>TEN</code></td><td>đọc
      biến</td><td>dấu <b>đô la</b> lấy giá trị của biến; trong dấu nháy kép vẫn thay,
      trong dấu nháy đơn thì <b>giữ nguyên chữ</b></td></tr><tr><td><code>export TEN</code></td><td>xuất
      biến</td><td>biến thành <b>biến môi trường</b>: các chương trình con sinh ra
      từ cửa sổ này cũng thấy</td></tr><tr><td><code>echo <span>&#36;</span>PATH</code></td><td>đường
      dẫn tìm lệnh</td><td><code>PATH</code> là một biến môi trường: danh sách thư
      mục, ngăn bằng dấu <code>:</code>, để máy tìm lệnh</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã biến và đường dẫn tìm lệnh. Gán biến là tạo một ô nhớ có
      tên, và không có khoảng trắng quanh dấu bằng. Dấu đô la đọc giá trị của biến,
      trong dấu nháy kép vẫn thay, trong dấu nháy đơn thì giữ nguyên chữ. Lệnh xuất
      biến biến nó thành biến môi trường, để các chương trình con cũng thấy. Và đường
      dẫn tìm lệnh là một biến môi trường, chứa danh sách thư mục ngăn bằng dấu hai
      chấm.
  - show: '<table class=''t''><tr><th>viết</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code><span>&#36;</span>?</code></td><td>mã
      thoát</td><td>số của lệnh <b>vừa chạy xong</b>: <code>0</code> = thành công,
      <b>khác 0</b> = thất bại</td></tr><tr><td><code>A &amp;&amp; B</code></td><td>và
      rồi</td><td>chạy <code>B</code> <b>chỉ khi</b> <code>A</code> thành công (mã
      0)</td></tr><tr><td><code>A || B</code></td><td>hoặc không thì</td><td>chạy
      <code>B</code> <b>chỉ khi</b> <code>A</code> thất bại (mã khác 0)</td></tr><tr><td><code>set
      -e</code></td><td>dừng khi lỗi</td><td>tệp lệnh <b>dừng ngay</b> khi một lệnh
      trả mã khác 0</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng thứ hai là mã thoát. Mỗi lệnh chạy xong để lại một con số, gọi là mã
      thoát, số không là thành công, khác không là thất bại, và dấu đô la hỏi chấm
      đọc nó. Hai dấu và nối hai lệnh, lệnh sau chỉ chạy khi lệnh trước thành công.
      Hai gạch đứng thì ngược lại, lệnh sau chỉ chạy khi lệnh trước thất bại. Còn
      lệnh đặt chế độ dừng khi lỗi làm tệp lệnh dừng ngay khi có một lệnh thất bại.
    clear: true
- id: intuition
  kind: intuition
  title: 'Hình dung: máy dò thư mục theo thứ tự, và mã thoát điều khiển lệnh sau'
  steps:
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="150" width="250" height="100" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="145.0" y="192" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">gõ:  chao</text><text x="145.0" y="224" font-size="24"
      text-anchor="middle" fill="#1f2937">(không có /)</text><line x1="275" y1="200"
      x2="380" y2="200" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="390" y="40" width="560" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="670.0" y="88" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">① …/hai → có tệp chao: DỪNG, chạy</text><rect
      x="390" y="160" width="560" height="80" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3" stroke-dasharray="8 6"/><text x="670.0" y="208" font-size="24"
      text-anchor="middle" fill="#1f2937">② …/tien_ich → cũng có chao, không dò tới</text><rect
      x="390" y="280" width="560" height="80" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3" stroke-dasharray="8 6"/><text x="670.0" y="328" font-size="24"
      text-anchor="middle" fill="#1f2937">③ /usr/bin   → không dò tới</text><line
      x1="280" y1="190" x2="385" y2="85" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="145" y="290" font-size="22" text-anchor="middle" fill="#2a78d6" font-weight="bold">dò
      lần lượt từ trên xuống</text><rect x="1000" y="40" width="480" height="100"
      rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1240.0" y="82"
      font-size="24" text-anchor="middle" fill="#1f2937">thư mục ĐẦU danh sách thắng</text><text
      x="1240.0" y="114" font-size="24" text-anchor="middle" fill="#1f2937">đặt thư
      mục của mình ở đầu: đè lệnh cũ</text><rect x="1000" y="190" width="480" height="100"
      rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1240.0" y="232"
      font-size="24" text-anchor="middle" fill="#1f2937">không thư mục nào có tên
      đó</text><text x="1240.0" y="264" font-size="24" text-anchor="middle" fill="#1f2937">→
      “command not found”, mã thoát 127</text><text x="1240" y="340" font-size="24"
      text-anchor="middle" fill="#1f2937" font-weight="bold">gõ ./chao: có dấu / nên
      KHÔNG dò, đi thẳng</text></svg></div>'
    clear: true
    say: Hình này là cách máy tìm lệnh. Bạn gõ một tên không có dấu gạch chéo. Máy
      dò lần lượt từng thư mục trong danh sách, và dừng ở thư mục đầu tiên có tệp
      tên đó. Các thư mục phía sau không được dò tới. Vì vậy thư mục đứng đầu thắng.
      Nếu không thư mục nào có, máy báo không tìm thấy lệnh và mã thoát là một trăm
      hai mươi bảy. Còn nếu tên có dấu gạch chéo thì máy không dò, mà đi thẳng tới
      đường dẫn đó.
  - show: '<div><svg width="1500" height="340" viewBox="0 0 1500 340" font-family="sans-serif"><defs><marker
