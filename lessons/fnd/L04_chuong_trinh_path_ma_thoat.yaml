      class="cm"><span>&#36;</span> </span>echo "xin chao <span>&#36;</span>TEN"</div><div>xin
      chao ban</div><div><span class="cm"><span>&#36;</span> </span>echo 'xin chao
      <span>&#36;</span>TEN'</div><div>xin chao <span>&#36;</span>TEN</div></div><p>Dấu
      nháy <b>kép</b> thay <code><span>&#36;</span>TEN</code> bằng <code>ban</code>;
      dấu nháy <b>đơn</b> giữ nguyên chữ.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ nhất, đặt và đọc biến. Gán biến ten bằng ban, rồi đọc bằng dấu
      đô la. Trong dấu nháy kép, biến được thay bằng giá trị. Trong dấu nháy đơn,
      chữ được giữ nguyên, không thay gì.
  - show: '<p><b>② Biến thường chỉ sống trong cửa sổ này; export cho con cháu</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>bash -c ''echo
      [<span>&#36;</span>TEN]''</div><div>[]</div><div><span class="cm"><span>&#36;</span>
      </span>export TEN</div><div><span class="cm"><span>&#36;</span> </span>bash
      -c ''echo [<span>&#36;</span>TEN]''</div><div>[ban]</div></div><p><code>bash
      -c ''…''</code> chạy một cửa sổ lệnh <b>con</b>. Chưa <code>export</code>: con
      không thấy. Sau <code>export</code>: con thấy.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ hai, biến và các chương trình con. Lệnh gọi chương trình cửa
      sổ lệnh kèm cờ c chạy một cửa sổ lệnh con. Khi chưa xuất, cửa sổ con không thấy
      biến, nên in ra rỗng. Sau khi xuất, nó thấy và in ra ban.
  - show: '<p><b>③ Mã thoát: 0 thành công, khác 0 thất bại</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>grep -q xin a.txt; echo <span>&#36;</span>?</div><div>0</div><div><span
      class="cm"><span>&#36;</span> </span>grep -q xyz a.txt; echo <span>&#36;</span>?</div><div>1</div><div><span
      class="cm"><span>&#36;</span> </span>ls khong_co 2&gt; /dev/null; echo <span>&#36;</span>?</div><div>2</div><div><span
      class="cm"><span>&#36;</span> </span>khong_co_lenh 2&gt; /dev/null; echo <span>&#36;</span>?</div><div>127</div></div><p>Tìm
      thấy chữ: <code>0</code>. Không thấy: <code>1</code>. Thư mục không có: <code>2</code>.
      Lệnh không tồn tại: <code>127</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ ba, đọc mã thoát. Lệnh tìm thấy chữ thì trả không, không thấy
      thì trả một. Liệt kê một thư mục không có trả hai, và gõ một lệnh không tồn
      tại trả một trăm hai mươi bảy. Thông báo lỗi chỉ để người đọc, còn chương trình
      đọc con số.
  - show: '<p><b>④ Nối lệnh theo mã thoát: && và ||</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>grep -q xin a.txt &amp;&amp; echo co ||
      echo khong</div><div>co</div><div><span class="cm"><span>&#36;</span> </span>grep
      -q xyz a.txt &amp;&amp; echo co || echo khong</div><div>khong</div></div><p>Lệnh
      tìm thấy chữ nên in <code>co</code>; lệnh không thấy nên rơi sang nhánh <code>||</code>,
      in <code>khong</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ tư, nối lệnh theo mã thoát. Khi tìm thấy chữ, mã là không, nên
      lệnh sau hai dấu và chạy, in có. Khi không thấy, mã khác không, nên rơi sang
      nhánh hai gạch đứng, in không.
  - show: <p><b>Tệp buoc.sh</b></p><div class="code"><div>ls khong_co</div><div>echo
      da xong</div></div><p><b>Tệp buoc_e.sh (thêm set -e)</b></p><div class="code"><div>set
      -e</div><div>ls khong_co</div><div>echo da xong</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ năm, tệp lệnh dừng khi lỗi. Cả hai tệp đều có một lệnh sẽ thất
      bại, rồi in đã xong. Tệp thứ hai có thêm dòng đầu, chế độ dừng khi lỗi.
  - show: '<p><b>Chạy cả hai</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>bash buoc.sh</div><div>ls: cannot access ''khong_co'': No such file or
      directory</div><div>da xong</div><div><span class="cm"><span>&#36;</span> </span>bash
      buoc_e.sh; echo <span>&#36;</span>?</div><div>ls: cannot access ''khong_co'':
      No such file or directory</div><div>2</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Tệp thứ nhất vẫn in đã xong, dù lệnh liệt kê đã lỗi, nên người đọc tưởng
      mọi việc ổn. Tệp thứ hai dừng ngay, không in đã xong, và mã thoát là hai, báo
      cho bên ngoài biết thất bại.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: hỏi thẳng máy tệp nào sẽ chạy'
  checks:
  - 2 + 2 == 4
  steps:
  - show: '<p><b>Hỏi bằng command -v (và type -t, which cho cùng ý)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>command -v chao</div><div>/c/Users/ban/hai/chao</div></div><p>Kết
      quả trùng bước 3: là tệp trong <code>hai</code>, không phải <code>tien_ich</code>.
      Đây là cách kiểm <b>không cần chạy</b> lệnh.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Đường kiểm khác là hỏi thẳng máy tệp nào sẽ chạy, mà không cần chạy lệnh.
      Lệnh hỏi đường dẫn trả về tệp trong thư mục hai, trùng với kết quả ở bước ba,
      vì thư mục hai đứng trước.
  - show: '<p><b>Đối chiếu danh sách đang có</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo <span>&#36;</span>PATH | tr '':'' ''\n''</div><div>/usr/bin</div><div>/bin</div></div><p>Đếm:
      danh sách có $2$ thư mục, thêm $2$ lần ở đầu thì có $4$; thư mục thêm sau cùng
      đứng đầu, nên thắng ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Kiểm thêm bằng cách đếm. Danh sách ban đầu có hai thư mục, ta thêm hai lần
      ở đầu nên có bốn. Thư mục thêm sau cùng đứng đầu danh sách, nên nó thắng, đúng
      như kết quả.
- id: scale
  kind: example
  title: 'Khi tệp lệnh dài ra: một lỗi bị bỏ qua lọt vào gần như chắc chắn'
  checks:
  - round((1 - 0.999 ** 10) * 100, 1) == 1.0
  - round((1 - 0.999 ** 100) * 100, 1) == 9.5
  - round((1 - 0.999 ** 1000) * 100, 1) == 63.2
  steps:
  - show: '<p>Giả sử mỗi bước của một tệp lệnh tự động có xác suất thất bại chỉ $0{,}1\%$
      (số minh hoạ), các bước độc lập. Xác suất <b>có ít nhất một bước lỗi</b> trong
      $n$ bước:</p>

      $$P = 1 - (1 - 0{,}001)^{n}$$

      <p>Vì xác suất mọi bước đều tốt là $0{,}999^{n}$, nên phần còn lại là có ít
      nhất một lỗi.</p>

      '
    focus:
    - 1
    - 2
    say: Giả sử mỗi bước của một tệp lệnh tự động có xác suất thất bại chỉ không phẩy
      một phần trăm, đây là số minh hoạ, và các bước độc lập. Vì xác suất mọi bước
      đều tốt là không phẩy chín chín chín mũ n, nên xác suất có ít nhất một bước
      lỗi là một trừ số đó.
  - show: '<table class=''t''><tr><th>số bước n</th><th>tính</th><th>xác suất có lỗi</th></tr><tr><td>×1:
      10</td><td>$1 - 0{,}999^{10}$</td><td><b>1,0%</b></td></tr><tr><td>×10: 100</td><td>$1
      - 0{,}999^{100}$</td><td><b>9,5%</b></td></tr><tr><td>×100: 1 000</td><td>$1
      - 0{,}999^{1000}$</td><td><b>63,2%</b></td></tr></table><div class=''box key''><b>Đánh
      đổi:</b> mười bước thì bỏ qua lỗi còn tạm chấp nhận; một nghìn bước thì lỗi
      gần như chắc chắn xảy ra, mà không ai biết bước nào. Tự động hoá càng lớn càng
      phải <b>dừng khi lỗi</b> (<code>set -e</code>), ghi mã thoát, và kiểm kết quả
      cuối.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bảng này cho thấy tác động của quy mô. Mười bước thì xác suất có lỗi chỉ
      khoảng một phần trăm. Một trăm bước là chín phẩy năm phần trăm. Một nghìn bước
      là sáu mươi ba phẩy hai phần trăm, nghĩa là gần như chắc chắn có lỗi. Vì vậy
      tự động hoá càng lớn càng phải dừng khi lỗi, ghi lại mã thoát, và kiểm kết quả
      cuối, thay vì tin rằng không thấy báo lỗi nghĩa là đúng.
    clear: true
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên <code>./</code> khi
      chạy tệp ngay tại chỗ.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>chao.sh</div><div>bash: chao.sh: command not found</div><div><span class="cm"><span>&#36;</span>
      </span>./chao.sh</div><div>xin chao</div></div><p>Tên trần trụi chỉ được dò
      trong <code>PATH</code>; thư mục hiện tại <b>không</b> nằm trong đó. Phép thử:
      <code>command -v</code> hoặc gõ <code>./</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là quên chấm gạch chéo khi chạy tệp ngay tại
      chỗ. Tên trần trụi chỉ được dò trong danh sách đường dẫn, mà thư mục hiện tại
      không nằm trong đó. Phép thử là hỏi lệnh hỏi đường dẫn, hoặc gõ thêm chấm gạch
      chéo.
  - show: <div class="box warn"><b>Lỗi 2 (người mới).</b> Sửa <code>PATH</code> trong
      cửa sổ này rồi tưởng đã cài vĩnh viễn.</div><table class='t'><tr><th>việc làm</th><th>sống
      tới khi nào</th></tr><tr><td><code>PATH="<span>&#36;</span>HOME/tien_ich:<span>&#36;</span>PATH"</code>
      gõ trong cửa sổ</td><td><b>đóng cửa sổ là mất</b></td></tr><tr><td>ghi dòng
      đó vào tệp <code>~/.bashrc</code></td><td><b>mỗi cửa sổ mới tự chạy</b> tệp
      này lúc mở</td></tr></table>
    focus:
    - 1
    - 1
    - 2
    say: Lỗi thứ hai, cũng của người mới, là sửa đường dẫn trong cửa sổ này rồi tưởng
      đã cài vĩnh viễn. Cách gõ trực tiếp chỉ sống tới khi đóng cửa sổ. Muốn giữ lại,
      hãy ghi dòng đó vào tệp khởi động của cửa sổ lệnh, nằm trong thư mục nhà, vì
      mỗi cửa sổ mới tự chạy tệp này lúc mở.
    clear: true
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Ống che mất lỗi:
      mã thoát của <code>A | B</code> là mã của <b>B</b>.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>false | true; echo <span>&#36;</span>?</div><div>0</div><div><span
      class="cm"><span>&#36;</span> </span>set -o pipefail; false | true; echo <span>&#36;</span>?</div><div>1</div></div><p>Lệnh
      <code>false</code> luôn thất bại, vậy mà cả ống báo $0$. Chế độ <code>set -o
      pipefail</code>: ống thất bại nếu <b>bất kỳ</b> lệnh nào trong đó thất bại.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là tin mã thoát của cả một ống. Mã thoát
      của ống chỉ là mã của lệnh cuối. Ở đây lệnh luôn thất bại đứng đầu, vậy mà cả
      ống báo không, tức thành công. Bật chế độ ống thất bại thì chỉ cần một lệnh
      trong ống lỗi là cả ống lỗi, và đó là thói quen của người viết tệp lệnh cẩn
      thận.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '''gia cat'' != ''xin chao'''
  steps:
  - show: '<p><b>Tệp tien_ich/cat: lệnh giả (dòng đầu #!/bin/bash: chạy bằng bash)</b></p><div
      class="code"><div>#!/bin/bash</div><div>echo gia cat</div></div><p><b>Đề.</b>
      Thư mục <code>tien_ich</code> có tệp <code>cat</code> (lệnh giả, chỉ in <code>gia
      cat</code>). Hai cách đặt <code>PATH</code> (cùng thư mục hệ thống <code>/usr/bin:/bin</code>):</p><ol><li>A:
      <code>tien_ich</code> đứng <b>đầu</b> danh sách.</li><li>B: <code>tien_ich</code>
      đứng <b>cuối</b>.</li></ol><p>Gõ <code>cat a.txt</code> (tệp có chữ <code>xin
      chao</code>). In ra gì ở A, ở B? <b>Chọn</b> cách nào cho thư mục tiện ích của
      nhóm, vì sao?</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    - 4
    - 4
    - 5
    pause: 60
    clear: true
    say: Bây giờ tới phần bạn tự làm. Thư mục tiện ích có một tệp tên cát, là lệnh
      giả, chỉ in giả cát. Dòng đầu của nó, dấu thăng chấm than, cho biết tệp chạy
      bằng chương trình nào. Có hai cách đặt đường dẫn tìm lệnh, cùng hai thư mục
      hệ thống. Cách A đặt thư mục tiện ích ở đầu, cách B đặt ở cuối. Gõ lệnh in nội
      dung tệp a. Ở A và ở B máy in ra gì. Rồi chọn cách nào cho thư mục tiện ích
      của cả nhóm, và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Máy chạy thật</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>PATH="/c/Users/ban/tien_ich:/usr/bin:/bin"</div><div><span class="cm"><span>&#36;</span>
      </span>cat a.txt</div><div>gia cat</div><div><span class="cm"><span>&#36;</span>
      </span>PATH="/usr/bin:/bin:/c/Users/ban/tien_ich"</div><div><span class="cm"><span>&#36;</span>
      </span>hash -r; cat a.txt</div><div>xin chao</div></div><p>A: thư mục tiện ích
      đứng trước nên <code>cat</code> giả thắng, in <code>gia cat</code>. B: đứng
      sau nên <code>cat</code> thật thắng, in <code>xin chao</code>.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Đáp án, ở cách A, thư mục tiện ích đứng trước nên lệnh giả thắng, màn hình
      in giả cát. Ở cách B, thư mục tiện ích đứng sau nên lệnh thật của hệ thống thắng,
      màn hình in xin chào.
  - show: <div class='box key'><b>Quyết định:</b> chọn <b>B</b> (đặt cuối) cho thư
      mục dùng chung. Đặt đầu cho phép một tệp trùng tên <b>che lệnh hệ thống</b>
      mà không ai hay, và lỗi kiểu đó rất khó tìm. Chỉ đặt đầu khi bạn <b>cố ý</b>
      thay lệnh, và ghi rõ lý do.</div>
    clear: true
    say: Về quyết định, nên chọn cách B, đặt thư mục dùng chung ở cuối. Đặt ở đầu
      cho phép một tệp trùng tên che mất lệnh hệ thống mà không ai hay, và lỗi kiểu
      đó rất khó tìm. Chỉ đặt ở đầu khi bạn cố ý thay lệnh, và hãy ghi rõ lý do.
- id: practice
  kind: practice
  title: 'Tự làm: in phiên bản công cụ, mã thoát và một lệnh trong PATH'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>kiem_tra.sh</code>, in lần lượt (bảy dòng):</p>

      <ol><li>ba dòng tên và số phiên bản chính của <code>git</code>, <code>javac</code>,
      <code>python</code> (dùng <code>--version</code> / <code>-version</code>, <code>cut</code>);</li>

      <li>mã thoát của <code>ls .</code> và của <code>ls khong_co</code> (giấu thông
