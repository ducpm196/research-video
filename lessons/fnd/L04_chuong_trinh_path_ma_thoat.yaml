      A</text><line x1="675" y1="130" x2="800" y2="70" stroke="#16a34a" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="737" y="90" font-size="22" text-anchor="middle"
      fill="#16a34a">= 0</text><rect x="810" y="20" width="330" height="90" rx="10"
      fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="975.0" y="73" font-size="24"
      text-anchor="middle" fill="#1f2937" font-weight="bold">A &amp;&amp; B: chạy
      B</text><line x1="675" y1="190" x2="800" y2="260" stroke="#dc2626" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="737" y="215" font-size="22" text-anchor="middle"
      fill="#dc2626">khác 0</text><rect x="810" y="220" width="330" height="90" rx="10"
      fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="975.0" y="273" font-size="24"
      text-anchor="middle" fill="#1f2937" font-weight="bold">A || B: chạy B</text><text
      x="1320" y="70" font-size="26" text-anchor="middle" fill="#16a34a" font-weight="bold">thành
      công</text><text x="1320" y="270" font-size="26" text-anchor="middle" fill="#dc2626"
      font-weight="bold">thất bại</text></svg></div>'
    clear: true
    say: Hình thứ hai là mã thoát điều khiển lệnh sau. Lệnh A chạy xong để lại mã
      thoát. Nếu bằng không, thành công, thì hai dấu và cho chạy lệnh B. Nếu khác
      không, thất bại, thì hai gạch đứng mới cho chạy lệnh B. Nhờ vậy ta viết được
      cả nhánh làm tiếp lẫn nhánh xử lý lỗi ngay trên một dòng.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: máy chọn tệp nào để chạy'
  steps:
  - show: '<p><b>Bước 1. Danh sách chỉ có hai thư mục hệ thống: không thấy chao</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>PATH=/usr/bin:/bin</div><div><span
      class="cm"><span>&#36;</span> </span>echo <span>&#36;</span>PATH | tr '':''
      ''\n''</div><div>/usr/bin</div><div>/bin</div><div><span class="cm"><span>&#36;</span>
      </span>chao</div><div>bash: chao: command not found</div></div><p>Vì tên <code>chao</code>
      không có <code>/</code>, máy dò <b>từng thư mục trong <code>PATH</code></b>;
      hết danh sách mà không có nên báo lỗi.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, đặt đường dẫn tìm lệnh chỉ còn hai thư mục hệ thống. Vì tên chao
      không có dấu gạch chéo, nên máy dò từng thư mục trong danh sách. Hết danh sách
      mà không thấy, nên máy báo không tìm thấy lệnh.
  - show: '<p><b>Bước 2. Thêm thư mục của mình vào ĐẦU danh sách</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>PATH="/c/Users/ban/tien_ich:<span>&#36;</span>PATH"</div><div><span
      class="cm"><span>&#36;</span> </span>echo <span>&#36;</span>PATH | tr '':''
      ''\n''</div><div>/c/Users/ban/tien_ich</div><div>/usr/bin</div><div>/bin</div><div><span
      class="cm"><span>&#36;</span> </span>chao</div><div>ban tien ich</div></div><p>Nên
      máy dò <code>tien_ich</code> trước, thấy <code>chao</code> và chạy nó: in <code>ban
      tien ich</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, thêm thư mục của mình vào đầu danh sách. Nên máy dò thư mục của
      ta trước, thấy tệp chao và chạy nó. Màn hình in ra dòng bạn tiện ích, đúng nội
      dung tệp.
  - show: '<p><b>Bước 3. Hai thư mục cùng có chao: thư mục ĐỨNG TRƯỚC thắng</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>PATH="/c/Users/ban/hai:<span>&#36;</span>PATH"</div><div><span
      class="cm"><span>&#36;</span> </span>chao</div><div>ban hai</div><div><span
      class="cm"><span>&#36;</span> </span>command -v chao</div><div>/c/Users/ban/hai/chao</div></div><p>Vì
      máy dừng ở thư mục đầu tiên có tệp, thêm <code>hai</code> lên đầu thì <code>chao</code>
      của <code>hai</code> chạy; <code>command -v</code> cho biết tệp nào sẽ chạy.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, hai thư mục cùng có tệp chao. Vì máy dừng ở thư mục đầu tiên có
      tệp, nên khi thêm thư mục hai lên đầu, tệp chao của thư mục hai chạy. Lệnh hỏi
      đường dẫn cho biết đúng tệp nào sẽ được chạy, và đó là thư mục hai.
- id: example
  kind: example
  title: 'Ví dụ: biến, mã thoát, và tệp lệnh dừng khi lỗi, năm phép làm'
  checks:
  - '''xin chao '' + ''ban'' == ''xin chao ban'''
  - 127 == 128 - 1
  - '[0, 1, 2, 127][-1] == 127'
  steps:
  - show: <p><b>① Đặt và đọc biến</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
