    say: Bây giờ tới phần bạn tự làm. Tạo một tệp lệnh. Chép nguyên đoạn khởi động
      máy chủ của bài thực hành, nó chạy ở nền và đặt một biến địa chỉ. Rồi viết bốn
      lệnh gửi yêu cầu. Một, in mã của một đường dẫn có thật. Hai, in mã của một đường
      dẫn không có. Ba, in nội dung của đường dẫn tài khoản bốn mươi hai. Bốn, gửi
