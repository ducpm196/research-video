- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>máy khách hỏi, máy chủ đáp</span><span
      class=''a''>→</span><span class=''n''>yêu cầu: phương thức + đường dẫn + tiêu
      đề</span><span class=''a''>→</span><span class=''n''>phản hồi: mã + tiêu đề
      + nội dung</span><span class=''a''>→</span><span class=''n''>2xx tốt, 4xx lỗi
      bên gửi, 5xx lỗi bên nhận</span><span class=''a''>→</span><span class=''n''>curl
      -f, -w, --max-time</span><span class=''a''>→</span><span class=''n''>đọc thử
      lại được, ghi thì kiểm trạng thái trước</span></div>'
    say: Tổng kết chuỗi logic. Máy khách là bên đặt câu hỏi, còn máy chủ là bên trả
      lời. Yêu cầu có phương thức, đường dẫn, tiêu đề. Phản hồi có mã, tiêu đề, nội
      dung. Nhóm hai trăm là tốt, bốn trăm là lỗi bên gửi, năm trăm là lỗi bên nhận.
      Lệnh gửi yêu cầu có cờ f, cờ w và cờ thời gian chờ. Đọc thì thử lại được, ghi
      thì kiểm tra trạng thái trước.
  - show: '<div class=''box key''><b>Tư duy:</b> đừng tin một con số: đọc <b>mã, nội
      dung, thời gian</b> cùng nhau; và với việc ghi, hỏi “nếu chạy hai lần thì sao?”.</div>

      <p>Bài sau: viết câu SQL đầu tiên để hỏi một cái bảng, và biết vì sao “ghi hai
      lần” cần giao dịch.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, đừng tin một con số. Hãy đọc mã, nội dung và thời gian
      cùng nhau, và với việc ghi, hãy hỏi nếu chạy hai lần thì sao. Bài sau, ta viết
      câu SQL đầu tiên để hỏi một cái bảng, và biết vì sao ghi hai lần cần đến giao
      dịch.
    clear: true
