      text-anchor="middle" fill="#2a78d6">① yêu cầu</text><line x1="1155" y1="140"
      x2="345" y2="140" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="750" y="130" font-size="22" text-anchor="middle" fill="#16a34a">② phản hồi</text><rect
      x="10" y="220" width="730" height="230" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="375.0" y="279" font-size="24" text-anchor="middle"
      fill="#1f2937">GET /so_du HTTP/1.1</text><text x="375.0" y="311" font-size="24"
      text-anchor="middle" fill="#1f2937">Host: 127.0.0.1:18765</text><text x="375.0"
      y="343" font-size="24" text-anchor="middle" fill="#1f2937">(không có nội dung)</text><text
      x="375.0" y="375" font-size="24" text-anchor="middle" fill="#1f2937"></text><text
      x="375.0" y="407" font-size="24" text-anchor="middle" fill="#1f2937">phương
      thức + đường dẫn + tiêu đề (+ nội dung)</text><rect x="760" y="220" width="730"
      height="230" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="1125.0" y="279" font-size="24" text-anchor="middle" fill="#1f2937">HTTP/1.1
      200 OK</text><text x="1125.0" y="311" font-size="24" text-anchor="middle" fill="#1f2937">Content-Type:
      text/plain</text><text x="1125.0" y="343" font-size="24" text-anchor="middle"
      fill="#1f2937">Content-Length: 7</text><text x="1125.0" y="375" font-size="24"
      text-anchor="middle" fill="#1f2937"></text><text x="1125.0" y="407" font-size="24"
      text-anchor="middle" fill="#1f2937">1500000  (nội dung)</text></svg></div>'
    clear: true
    say: Hình này là một vòng hỏi đáp. Máy khách gửi một yêu cầu, gồm phương thức,
      đường dẫn, các tiêu đề, và đôi khi có nội dung. Máy chủ chờ ở một cổng, nhận
      yêu cầu rồi gửi phản hồi. Phản hồi gồm dòng trạng thái có mã số, các tiêu đề,
      một dòng trống, rồi nội dung. Mọi thứ đều là chữ, nên ta đọc và gõ được bằng
      tay.
  - show: <table class='t'><tr><th>nhóm</th><th>ý nghĩa</th><th>ví dụ</th><th>ai có
      lỗi?</th></tr><tr><td><b>2xx</b></td><td>thành công</td><td>200 OK, 201 Created</td><td>không
      ai</td></tr><tr><td><b>3xx</b></td><td>chuyển hướng</td><td>301, 302</td><td>—</td></tr><tr><td><b>4xx</b></td><td>yêu
      cầu <b>có vấn đề</b></td><td>404 Not Found, 405 Method Not Allowed</td><td>bên
      <b>gửi</b></td></tr><tr><td><b>5xx</b></td><td>máy chủ <b>gặp sự cố</b></td><td>500
      Internal Server Error</td><td>bên <b>nhận</b></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng này là bốn nhóm mã trạng thái. Nhóm hai trăm là thành công. Nhóm ba
      trăm là chuyển hướng. Nhóm bốn trăm nghĩa là yêu cầu có vấn đề, lỗi ở bên gửi,
      ví dụ không tìm thấy hay sai phương thức. Nhóm năm trăm nghĩa là máy chủ gặp
      sự cố, lỗi ở bên nhận. Chỉ cần nhìn chữ số đầu là biết nên sửa phía nào.
    clear: true
- id: formula
  kind: formula
  title: 'Suy ra từng bước: đọc một phản hồi để quyết định làm gì'
  checks:
  - 200 // 100 == 2
  - 404 // 100 == 4 and 405 // 100 == 4
  - 500 // 100 == 5
  - 201 // 100 == 2
  steps:
  - show: '<p><b>Bước 1. Đọc dòng đầu: nhóm của mã</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>curl -s -i <span>&#36;</span>U/so_du</div><div>HTTP/1.1
      200 OK</div><div>Content-Type: text/plain</div><div>Content-Length: 7</div><div>
      </div><div>1500000</div></div><p>Vì chữ số đầu của <code>200</code> là $2$,
      đây là nhóm <b>thành công</b>; nên nội dung <code>1500000</code> dùng được.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, đọc dòng đầu của phản hồi. Vì chữ số đầu của hai trăm là hai, đây
      là nhóm thành công, nên nội dung một triệu năm trăm nghìn dùng được.
  - show: '<p><b>Bước 2. Cùng đường dẫn /chuyen, hai phương thức, hai kết quả</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>curl -s -i -X POST
      -d a=1 <span>&#36;</span>U/chuyen</div><div>HTTP/1.1 201 Created</div><div>Content-Type:
      text/plain</div><div>Content-Length: 12</div><div> </div><div>da nhan: a=1</div><div><span
      class="cm"><span>&#36;</span> </span>curl -s -i <span>&#36;</span>U/chuyen</div><div>HTTP/1.1
      405 Method Not Allowed</div><div>Content-Type: text/plain</div><div>Content-Length:
      13</div><div> </div><div>chi nhan POST</div></div><p>Vì đường dẫn <code>/chuyen</code>
      chỉ <b>nhận POST</b>, gửi POST ra <code>201</code> (đã tạo), còn GET ra <code>405</code>:
      nhóm $4$, <b>lỗi của bên gửi</b>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, cùng một đường dẫn mà hai phương thức cho hai kết quả. Vì đường
      dẫn chuyển chỉ nhận phương thức gửi, nên gửi thì ra hai trăm linh một, tức đã
      tạo. Còn phương thức đọc ra bốn trăm linh năm, nhóm bốn, lỗi của bên gửi.
  - show: '<table class=''t''><tr><th>mã</th><th>nhóm</th><th>ai có lỗi</th><th>thử
      lại ngay có ích không?</th></tr><tr><td>200, 201</td><td>2xx</td><td>không</td><td>không
      cần</td></tr><tr><td>404, 405</td><td>4xx</td><td>bên gửi</td><td><b>không</b>:
      sửa yêu cầu trước</td></tr><tr><td>500</td><td>5xx</td><td>bên nhận</td><td>đọc
      (GET): có thể, ghi (POST): <b>cẩn thận</b></td></tr></table><p>Bước 3: nhóm
      quyết định hành động; nhóm 4xx thì sửa yêu cầu, nhóm 5xx thì cân nhắc thử lại.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước ba, nhóm của mã quyết định hành động. Mã nhóm hai không cần làm gì thêm.
      Mã nhóm bốn thì thử lại ngay vô ích, vì lỗi ở yêu cầu, phải sửa yêu cầu trước.
      Mã nhóm năm là lỗi của máy chủ, nên đọc thì thử lại được, còn ghi thì phải cẩn
      thận, vì có thể đã ghi một nửa.
- id: example
  kind: example
  title: 'Ví dụ: một phiên hỏi máy chủ, năm phép làm'
  checks:
  - len('1500000') == 7
  - 1 + 2 + 1 + 7 >= 7
  - 404 // 100 == 4
  - 22 != 0
  - 28 != 0
  steps:
  - show: <p><b>① Khởi động máy chủ ở nền, rồi hỏi trang chủ</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python may_chu.py 18765 &gt; /dev/null
      2&gt;&amp;1 &amp; SV=<span>&#36;</span>!</div><div><span class="cm"><span>&#36;</span>
      </span>sleep 1</div><div><span class="cm"><span>&#36;</span> </span>U=http://127.0.0.1:18765</div><div><span
      class="cm"><span>&#36;</span> </span>curl -s <span>&#36;</span>U/</div><div>xin
      chao</div></div><p><code>may_chu.py</code> là máy chủ nhỏ cho sẵn (chạy cục
      bộ, cổng $18765$). Trả lời <code>xin chao</code> mà <b>không xuống dòng</b>.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Phép làm thứ nhất, khởi động máy chủ ở nền, chờ một giây cho nó sẵn sàng,
      đặt địa chỉ vào một biến, rồi hỏi trang chủ. Máy chủ trả lời xin chào, và lệnh
      gửi yêu cầu không thêm ký tự xuống dòng, nên dấu nhắc có thể dính ngay sau chữ.
  - show: '<p><b>② Đọc cả phản hồi bằng -i</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s -i <span>&#36;</span>U/so_du</div><div>HTTP/1.1 200 OK</div><div>Content-Type:
      text/plain</div><div>Content-Length: 7</div><div> </div><div>1500000</div></div><p>$1$
      dòng trạng thái, $2$ tiêu đề, $1$ dòng trống, rồi nội dung $7$ ký tự: <code>Content-Length:
      7</code> khớp <code>1500000</code> ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ hai, đọc cả phản hồi bằng cờ i. Có một dòng trạng thái, hai
      tiêu đề, một dòng trống, rồi nội dung. Tiêu đề độ dài nói bảy, và chuỗi một
      triệu năm trăm nghìn đúng là bảy ký tự.
  - show: '<p><b>③ Địa chỉ không tồn tại: 404, nhưng curl vẫn báo thành công</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>curl -s -o /dev/null
      -w "%{http_code}\n" <span>&#36;</span>U/khong_co</div><div>404</div><div><span
      class="cm"><span>&#36;</span> </span>curl -s <span>&#36;</span>U/khong_co; echo
      " ma thoat: <span>&#36;</span>?"</div><div>khong thay ma thoat: 0</div><div><span
      class="cm"><span>&#36;</span> </span>curl -sf <span>&#36;</span>U/khong_co;
      echo "ma thoat: <span>&#36;</span>?"</div><div>ma thoat: 22</div></div><p>Mặc
      định, <code>curl</code> chỉ báo lỗi khi <b>không nối được</b>; nhận <code>404</code>
      vẫn là “đã nhận được trả lời”, mã thoát <code>0</code>. Thêm <code>-f</code>:
      mã thoát <code>22</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ ba, gọi một địa chỉ không tồn tại. Máy chủ trả bốn trăm linh
      bốn. Lệnh gửi yêu cầu mặc định chỉ báo lỗi khi không nối được, nên nhận bốn
      trăm linh bốn vẫn là đã nhận được trả lời, và mã thoát bằng không. Thêm cờ f
      thì gặp lỗi bốn hoặc năm trăm sẽ thất bại, với mã thoát hai mươi hai.
  - show: '<p><b>④ Phương thức gửi, rồi sai phương thức</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>curl -s -i -X POST -d a=1 <span>&#36;</span>U/chuyen</div><div>HTTP/1.1
      201 Created</div><div>Content-Type: text/plain</div><div>Content-Length: 12</div><div>
      </div><div>da nhan: a=1</div><div><span class="cm"><span>&#36;</span> </span>curl
      -s -i <span>&#36;</span>U/chuyen</div><div>HTTP/1.1 405 Method Not Allowed</div><div>Content-Type:
      text/plain</div><div>Content-Length: 13</div><div> </div><div>chi nhan POST</div></div><p>POST
      <code>/chuyen</code> → $201$ (đã tạo); GET cùng đường dẫn → $405$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ tư, hai mã khác nhau cho cùng một đường dẫn. Gửi dữ liệu bằng
      phương thức gửi ra hai trăm linh một. Gọi đường dẫn đó bằng phương thức đọc
      ra bốn trăm linh năm.
  - show: '<p><b>④ Sự cố ở máy chủ</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s -o /dev/null -w "%{http_code}\n" <span>&#36;</span>U/loi</div><div>500</div></div><p><code>/loi</code>
      → $500$ (nhóm $5$: lỗi ở máy chủ).</p>'
    clear: true
    say: Và đường dẫn lỗi cố ý ra năm trăm, vì máy chủ gặp sự cố.
  - show: '<p><b>⑤ Mã 200 chưa chắc là việc đã đúng; và đừng chờ vô hạn</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>curl -s <span>&#36;</span>U/het_han</div><div>{"loi":
      "het han"}</div><div><span class="cm"><span>&#36;</span> </span>curl -s -o /dev/null
      -w "%{http_code}\n" <span>&#36;</span>U/het_han</div><div>200</div><div><span
      class="cm"><span>&#36;</span> </span>curl -s --max-time 1 <span>&#36;</span>U/cham;
      echo "ma thoat: <span>&#36;</span>?"</div><div>ma thoat: 28</div></div><p>Trang
      <code>/het_han</code> trả <code>200</code> nhưng nội dung nói <b>lỗi</b>; trang
      <code>/cham</code> chậm: <code>--max-time 1</code> bỏ cuộc, mã thoát $28$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ năm, hai bẫy thật. Một trang trả hai trăm, nhưng nội dung nói
      hết hạn, tức mã trạng thái chưa nói hết sự thật, phải đọc cả nội dung. Một trang
      rất chậm, và cờ thời gian chờ giúp ta bỏ cuộc sau một giây, mã thoát hai mươi
      tám.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: mã trạng thái và nội dung phải cùng nói một điều'
  checks:
  - 200 // 100 == 2
  steps:
  - show: '<p><b>Cách 1: chỉ in mã (-w)</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s -o /dev/null -w "%{http_code}\n" <span>&#36;</span>U/khong_co</div><div>404</div></div><p><b>Cách
      2: đọc dòng đầu của -i ở trên</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s <span>&#36;</span>U/</div><div>xin chao</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Đường kiểm khác, hỏi cùng một việc bằng hai cách. Cách một in riêng mã trạng
      thái bằng cờ w. Cách hai đọc dòng đầu của phản hồi đầy đủ ở phép làm thứ hai.
      Hai cách phải cho cùng mã cho cùng địa chỉ, vì cùng hỏi một việc.
  - show: '<p><b>Kiểm cả mã VÀ nội dung</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s <span>&#36;</span>U/het_han</div><div>{"loi": "het han"}</div><div><span
      class="cm"><span>&#36;</span> </span>curl -s -o /dev/null -w "%{http_code}\n"
      <span>&#36;</span>U/het_han</div><div>200</div></div><p>Mã $200$ và nội dung
      <code>{"loi": "het han"}</code>: <b>không khớp ý nghĩa</b>, nên coi là thất
      bại. Khi viết chương trình gọi máy chủ, kiểm <b>cả hai</b>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Kiểm cuối, nhìn cả mã lẫn nội dung của trang hết hạn. Mã hai trăm nhưng nội
      dung báo lỗi, nên ý nghĩa không khớp, và ta coi đó là thất bại. Khi viết chương
      trình gọi máy chủ, hãy kiểm cả hai.
- id: scale
  kind: example
  title: 'Khi yêu cầu nhân lên: cần bao nhiêu người phục vụ cùng lúc?'
  checks:
  - round(1 / 0.02) == 50
  - 50 * 0.02 == 1.0
  - round(5000 * 0.02) == 100
  - round(500000 * 0.02) == 10000
  - 5000 // 50 == 100
  steps:
  - show: '<p>Giả sử mỗi yêu cầu mất $20$ mili giây để xử lý (số minh hoạ). Một “người
      phục vụ” (một luồng) làm lần lượt: $1 / 0{,}02 = \hl{50}$ yêu cầu mỗi giây.</p>

      $$\text{số người phục vụ cần} = \text{số yêu cầu mỗi giây} \times \text{thời
      gian một yêu cầu}$$

      <span class=''note''>Quan hệ này là định luật hàng đợi của J. D. C. Little (1961),
      áp dụng cho mọi hàng đợi ổn định.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Giả sử mỗi yêu cầu mất hai mươi phần nghìn giây để xử lý, đây là số minh
      hoạ. Một người phục vụ làm lần lượt, nên làm được một chia không phẩy không
      hai, tức năm mươi yêu cầu mỗi giây. Số người phục vụ cần bằng số yêu cầu mỗi
      giây nhân thời gian một yêu cầu. Quan hệ này là một định luật về hàng đợi, đúng
      cho mọi hàng đợi ổn định.
  - show: '<table class=''t''><tr><th>yêu cầu mỗi giây</th><th>tính</th><th>người
      phục vụ cùng lúc</th></tr><tr><td>×1: 50</td><td>$50 \times 0{,}02$</td><td><b>1</b></td></tr><tr><td>×100:
      5 000</td><td>$5\,000 \times 0{,}02$</td><td><b>100</b></td></tr><tr><td>×10
      000: 500 000</td><td>$500\,000 \times 0{,}02$</td><td><b>10 000</b></td></tr></table><div
      class=''box key''><b>Đánh đổi:</b> máy chủ một luồng như <code>may_chu.py</code>
      chỉ hợp để học (50 yêu cầu mỗi giây). Ở quy mô lớn phải chạy <b>nhiều tiến trình/luồng</b>,
      đặt <b>thời gian chờ</b> cho mọi cuộc gọi, và xếp hàng thay vì để yêu cầu tràn.
      Mỗi “người phục vụ” cũng tốn bộ nhớ.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bảng này cho thấy quy mô. Năm mươi yêu cầu mỗi giây cần một người phục vụ.
      Năm nghìn yêu cầu mỗi giây cần một trăm người. Năm trăm nghìn yêu cầu mỗi giây
      cần mười nghìn người phục vụ cùng lúc. Máy chủ một luồng chỉ hợp để học. Ở quy
      mô lớn phải chạy nhiều tiến trình, đặt thời gian chờ cho mọi cuộc gọi, và xếp
      hàng thay vì để yêu cầu tràn, vì mỗi người phục vụ cũng tốn bộ nhớ.
    clear: true
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tin <code>curl</code> “im
      lặng và mã thoát 0” nghĩa là thành công.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s <span>&#36;</span>U/khong_co; echo " ma thoat: <span>&#36;</span>?"</div><div>khong
      thay ma thoat: 0</div><div><span class="cm"><span>&#36;</span> </span>curl -sf
      <span>&#36;</span>U/khong_co; echo "ma thoat: <span>&#36;</span>?"</div><div>ma
      thoat: 22</div></div><p>Phép thử: thêm <code>-f</code>, hoặc in mã bằng <code>-w
      ''%{http_code}''</code> rồi so với $200$.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là tin rằng im lặng và mã thoát bằng không nghĩa
      là thành công. Gặp bốn trăm linh bốn, lệnh vẫn in nội dung và trả mã không.
      Phép thử là thêm cờ f, hoặc in mã trạng thái bằng cờ w rồi so với hai trăm.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Dùng sai phương thức: gọi
      bằng GET một đường dẫn chỉ nhận POST.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>curl -s -i <span>&#36;</span>U/chuyen</div><div>HTTP/1.1 405 Method Not
      Allowed</div><div>Content-Type: text/plain</div><div>Content-Length: 13</div><div>
      </div><div>chi nhan POST</div></div><p>Nhóm $4$ nghĩa là lỗi ở yêu cầu của bạn;
      thử lại y nguyên sẽ <b>luôn</b> cho cùng kết quả, mỗi lần trả thêm tải cho máy
      chủ.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là dùng sai phương thức. Gọi bằng phương
      thức đọc một đường dẫn chỉ nhận phương thức gửi thì nhận bốn trăm linh năm.
      Nhóm bốn nghĩa là lỗi ở yêu cầu của bạn, nên thử lại y nguyên vẫn ra kết quả
      cũ.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Không đặt thời gian
      chờ, hoặc thử lại mù quáng một yêu cầu <b>ghi</b>.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>curl -s --max-time 1 <span>&#36;</span>U/cham;
      echo "ma thoat: <span>&#36;</span>?"</div><div>ma thoat: 28</div></div><p>Quá
      hạn không có nghĩa máy chủ <b>chưa</b> làm: yêu cầu POST có thể đã được xử lý.
      Thử lại POST khi chưa kiểm tra có thể làm <b>hai lần</b> (ví dụ trừ tiền hai
      lần).</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là hai việc. Một là không đặt thời gian
      chờ, nên chương trình treo vô hạn khi máy chủ chậm. Hai là thử lại mù quáng
      một yêu cầu ghi. Quá hạn không có nghĩa máy chủ chưa làm, yêu cầu có thể đã
      được xử lý. Thử lại khi chưa kiểm tra có thể làm hai lần, ví dụ trừ tiền hai
      lần. Người làm nghề hỏi trạng thái trước, hoặc thiết kế để làm hai lần cũng
      như một lần.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 500 // 100 == 5
  - 404 // 100 == 4
  steps:
  - show: '<p><b>Đề.</b> Chương trình thanh toán của bạn gọi máy chủ và nhận các kết
      quả sau. Với mỗi dòng, <b>chọn</b>: thử lại hay không, và vì sao?</p>

      <ol><li><code>GET /so_du</code> trả <code>500</code></li><li><code>GET /so_du_sai</code>
      trả <code>404</code></li>

      <li><code>POST /chuyen</code> (chuyển 1 000 000 đồng) quá <b>thời gian chờ</b>,
      không nhận được gì</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 60
    say: Bây giờ tới phần bạn tự làm. Chương trình thanh toán gọi máy chủ và nhận
      ba kết quả. Một, đọc số dư và nhận năm trăm. Hai, đọc một đường dẫn sai và nhận
      bốn trăm linh bốn. Ba, gửi lệnh chuyển một triệu đồng, và quá thời gian chờ
      mà không nhận được gì. Với mỗi kết quả, hãy chọn thử lại hay không, và vì sao.
      Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>kết quả</th><th>thử lại?</th><th>lý do</th></tr><tr><td>1.
      GET trả 500</td><td><b>có</b>, vài lần, giãn dần khoảng cách</td><td>đọc không
      đổi dữ liệu; lỗi 5xx có thể là tạm thời</td></tr><tr><td>2. GET trả 404</td><td><b>không</b></td><td>nhóm
      4xx: yêu cầu sai; thử lại cho cùng kết quả, phải sửa đường dẫn</td></tr><tr><td>3.
      POST quá hạn</td><td><b>không thử mù</b></td><td>không biết máy chủ đã chuyển
      tiền chưa; <b>hỏi trạng thái</b> trước, hoặc gửi kèm mã chống lặp</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Đáp án một, đọc mà nhận năm trăm thì nên thử lại vài lần, giãn dần khoảng
      cách, vì đọc không đổi dữ liệu và lỗi năm trăm có thể là tạm thời. Hai, bốn
      trăm linh bốn thì không thử lại, vì yêu cầu sai, phải sửa đường dẫn. Ba, gửi
      lệnh chuyển tiền quá hạn thì không thử lại mù quáng, vì không biết máy chủ đã
      chuyển chưa. Phải hỏi trạng thái trước, hoặc gửi kèm một mã chống lặp.
    clear: true
  - show: '<div class="code"><div><span class="cm"><span>&#36;</span> </span>curl
      -s -o /dev/null -w "%{http_code}\n" <span>&#36;</span>U/loi</div><div>500</div></div><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>curl -s -o /dev/null
      -w "%{http_code}\n" <span>&#36;</span>U/khong_co</div><div>404</div></div><div
      class=''box key''><b>Quyết định:</b> nhóm của mã và <b>phương thức</b> cùng
      quyết định có thử lại không. 5xx + đọc: thử lại; 4xx: sửa; ghi mà không chắc
      kết quả: <b>kiểm tra trạng thái</b>, không thử mù.</div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Máy chạy lại hai trường hợp đầu cho đúng mã mô tả. Quyết định nằm ở hai thứ
      cùng nhau, nhóm của mã và phương thức. Lỗi năm trăm mà đọc thì thử lại, lỗi
      bốn trăm thì sửa, còn ghi mà không chắc kết quả thì kiểm tra trạng thái, không
      thử mù.
