source: 'curl.se (curl man page: -s -i -X -d -o -w -f --max-time, mã thoát 22 và 28);
  audit/fnd/verify_fnd.py L07 (máy chủ http.server của Python 3 chạy cục bộ, curl
  chạy thật); RFC 9110 (HTTP Semantics: phương thức, mã trạng thái 2xx/4xx/5xx; GET
  an toàn và idempotent, POST thì không); Little, J.D.C. 1961, A Proof for the Queuing
  Formula L = λW, Operations Research 9(3) (NOT_VERIFIED: trích theo trí nhớ); số
  20 mili giây là số minh hoạ'
assumes: []
objectives:
- Nêu các phần của một yêu cầu và một phản hồi HTTP
- Đọc mã trạng thái 2xx, 4xx, 5xx và chọn hành động tương ứng
- 'Chạy curl tới máy chủ cục bộ: đọc, gửi dữ liệu, in riêng mã trạng thái'
- Kiểm một câu trả lời bằng hai cách và bằng cả mã lẫn nội dung
- Tính số người phục vụ cần cùng lúc khi số yêu cầu nhân lên
- 'Chỉ ra ba lỗi hay gặp: curl mã thoát 0 khi gặp 404, sai phương thức, không đặt
  thời gian chờ và thử lại mù'
- Nêu vì sao thử lại hay không cho từng kết quả
- Viết tệp lệnh hỏi máy chủ lab và in đúng bốn kết quả
