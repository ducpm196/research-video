scenes:
- id: hook
  kind: hook
  title: 'Một địa chỉ, một yêu cầu, một con số: máy chủ trả lời bằng chữ'
  steps:
  - show: '<p><b>Hỏi một máy chủ nhỏ chạy ngay trên máy bạn, đọc nguyên văn câu trả
      lời</b></p><div class="code"><div><span class="cm"><span>&#36;</span> </span>curl
      -s <span>&#36;</span>U/</div><div>xin chao</div><div><span class="cm"><span>&#36;</span>
      </span>curl -s -i <span>&#36;</span>U/so_du</div><div>HTTP/1.1 200 OK</div><div>Content-Type:
      text/plain</div><div>Content-Length: 7</div><div> </div><div>1500000</div></div><p>Dòng
      đầu có <b>mã trạng thái</b> <code>200</code>: “thành công”. Tiếp là các dòng
      tiêu đề, một dòng trống, rồi <b>nội dung</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, mỗi lần bạn mở một trang mạng hay một ứng dụng ngân hàng gọi máy
      chủ, đều có một cuộc hỏi đáp bằng chữ như thế này. Ta hỏi một máy chủ nhỏ chạy
      ngay trên máy bạn, và đọc nguyên văn câu trả lời. Dòng đầu có mã trạng thái
      hai trăm, nghĩa là thành công. Tiếp là các dòng tiêu đề, một dòng trống, rồi
      nội dung, ở đây là số một triệu năm trăm nghìn.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Một <b>yêu cầu</b> và một <b>phản hồi</b> HTTP gồm những phần nào?</li>

      <li>Mã trạng thái <b>2xx, 4xx, 5xx</b> nói điều gì, và <b>phương thức</b> GET,
      POST khác nhau thế nào?</li>

      <li>Vì sao <code>curl</code> báo mã thoát 0 dù gặp 404, và khi yêu cầu nhân
      lên thì cần bao nhiêu “người phục vụ”?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Một yêu cầu và một phản hồi HTTP gồm những
      phần nào. Mã trạng thái hai trăm, bốn trăm, năm trăm nói điều gì, và phương
      thức đọc với phương thức gửi khác nhau thế nào. Và vì sao lệnh gửi yêu cầu báo
      mã thoát không dù gặp lỗi bốn trăm linh bốn, cùng việc khi yêu cầu nhân lên
      thì cần bao nhiêu người phục vụ.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: biến, mã thoát, chạy nền, bỏ đầu ra'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      biến</td><td><code>U=http://127.0.0.1:18765</code> rồi <code><span>&#36;</span>U/so_du</code></td></tr><tr><td>②
      mã thoát</td><td><code><span>&#36;</span>?</code> = <b>0</b> thành công, khác
      0 thất bại</td></tr><tr><td>③ chạy nền</td><td><code>lệnh &amp;</code>: chạy
      ngầm, cửa sổ vẫn nhận lệnh khác; <code><span>&#36;</span>!</code> là số tiến
      trình vừa chạy ngầm</td></tr><tr><td>④ bỏ đầu ra</td><td><code>&gt; /dev/null
      2&gt;&amp;1</code> vứt cả kết quả lẫn thông báo lỗi</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Biến giữ địa chỉ để khỏi gõ lại. Mã thoát không là thành
      công, khác không là thất bại. Dấu và ở cuối lệnh chạy nó ngầm, cửa sổ vẫn nhận
      lệnh khác, và dấu đô la chấm than là số của tiến trình vừa chạy ngầm. Và ta
      có thể vứt cả kết quả lẫn thông báo lỗi vào thùng không đáy.
- id: sym
  kind: symbol
  title: 'Giải mã: máy khách, máy chủ, địa chỉ, phương thức, mã trạng thái'
  steps:
  - show: '<table class=''t''><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td><b>máy
      chủ</b> và <b>máy khách</b></td><td>máy chủ là chương trình <b>chờ</b> yêu cầu
      và trả lời; máy khách (trình duyệt, <code>curl</code>, ứng dụng) là bên <b>hỏi</b></td></tr><tr><td><b>địa
      chỉ</b> (URL)</td><td><code>http://127.0.0.1:18765/so_du</code> = giao thức
      + <b>địa chỉ máy</b> (<code>127.0.0.1</code> là chính máy bạn) + <b>cổng</b>
      (<code>18765</code>, cửa của chương trình) + <b>đường dẫn</b></td></tr><tr><td><b>phương
      thức</b></td><td><code>GET</code> = đọc (không làm đổi gì); <code>POST</code>
      = gửi dữ liệu để tạo hoặc xử lý</td></tr><tr><td><b>mã trạng thái</b></td><td>số
      ba chữ số trong dòng đầu phản hồi: <b>chữ số đầu là nhóm</b></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng này giải mã năm thuật ngữ. Máy chủ là chương trình chờ yêu cầu và trả
      lời, máy khách là bên hỏi. Địa chỉ gồm giao thức, địa chỉ máy, cổng, tức cửa
      của chương trình, và đường dẫn. Địa chỉ một hai bảy chấm không chấm không chấm
      một là chính máy bạn. Phương thức đọc không làm đổi gì, phương thức gửi đưa
      dữ liệu để tạo hoặc xử lý. Và mã trạng thái là số ba chữ số trong dòng đầu của
      phản hồi, chữ số đầu cho biết nhóm.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>curl
      -s URL</code></td><td>gửi yêu cầu <b>GET</b> tới địa chỉ, in nội dung; <code>-s</code>
      = im lặng (bỏ thanh tiến độ)</td></tr><tr><td><code>-i</code></td><td>in cả
      <b>dòng trạng thái và tiêu đề</b> của phản hồi</td></tr><tr><td><code>-X POST
      -d a=1</code></td><td>đổi phương thức thành POST, gửi nội dung <code>a=1</code></td></tr><tr><td><code>-o
      /dev/null -w "%{http_code}"</code></td><td>bỏ nội dung, chỉ in <b>mã trạng thái</b></td></tr><tr><td><code>-f</code>
      và <code>--max-time 1</code></td><td><code>-f</code>: gặp lỗi 4xx/5xx thì <b>thất
      bại</b> (mã thoát 22); <code>--max-time</code>: bỏ cuộc sau 1 giây</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    clear: true
    say: Bảng thứ hai là các cờ của lệnh gửi yêu cầu. Cờ s làm lệnh im lặng, không
      in thanh tiến độ. Cờ i in thêm dòng trạng thái và tiêu đề của phản hồi. Cờ X
      kèm cờ d đổi sang phương thức gửi và đính nội dung. Cờ o kèm cờ w cho bỏ nội
      dung và chỉ in mã trạng thái. Cờ f cho thất bại khi gặp lỗi bốn hoặc năm trăm,
      và cờ thời gian chờ bỏ cuộc sau một giây.
