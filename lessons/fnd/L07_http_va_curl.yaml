      ở nền cổng 18766, chờ sẵn sàng, đặt biến <code>U</code>). Rồi viết <b>bốn lệnh
      <code>curl</code></b> và cuối cùng <code>kill <span>&#36;</span>SV</code>:</p>

      <ol><li>in <b>mã</b> của <code>GET <span>&#36;</span>U/chao</code>;</li><li>in
      <b>mã</b> của <code>GET <span>&#36;</span>U/khong_co</code>;</li>

      <li>in <b>nội dung</b> của <code>GET <span>&#36;</span>U/tai_khoan/42</code>
      (nhớ xuống dòng);</li><li>in <b>mã</b> của <code>POST <span>&#36;</span>U/nap</code>
      với nội dung <code>so_tien=100000</code>.</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
