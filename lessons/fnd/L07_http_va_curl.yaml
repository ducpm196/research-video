  - show: '<div><svg width="1500" height="470" viewBox="0 0 1500 470" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="10" y="50" width="330" height="120" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="175.0" y="102" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">máy khách</text><text x="175.0" y="134" font-size="24"
      text-anchor="middle" fill="#1f2937">curl, trình duyệt</text><rect x="1160" y="50"
      width="330" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="1325.0" y="102" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">máy
      chủ</text><text x="1325.0" y="134" font-size="24" text-anchor="middle" fill="#1f2937">chương
      trình chờ ở cổng 18765</text><line x1="345" y1="80" x2="1155" y2="80" stroke="#2a78d6"
