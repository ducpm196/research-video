scenes:
- id: hook
  kind: hook
  title: 'Cùng một chương trình: chờ mười giây hay gần hai mươi tám giờ?'
  steps:
  - show: '<table class=''t''><tr><th>số lần đọc</th><th>mỗi lần chờ</th><th>tổng
      chờ</th></tr><tr><td>1 000</td><td>10 mili giây</td><td><b>10 giây</b></td></tr><tr><td>10
      000 000</td><td>10 mili giây</td><td><b>100 000 giây</b>, gần 28 giờ</td></tr></table><p>Chương
      trình đọc các <b>bản ghi</b> (mỗi bản ghi là một mẩu dữ liệu nhỏ, như một dòng
      của sổ) nằm rải rác trên <b>ổ đĩa cơ</b> (HDD: đĩa kim loại quay, đầu đọc phải
      di chuyển nên chậm). Số minh hoạ. Cùng cách viết; chỉ khác <b>dữ liệu nằm ở
      đâu</b> và <b>có bao nhiêu</b>.</p>'
    focus:
    - 1
    - 2
    - '1.2'
    - '1.3'
    - 2
    say: Chào bạn, hãy nhìn một chương trình đọc các bản ghi nhỏ nằm rải rác trên
      ổ đĩa cơ, mỗi lần chờ chừng mười phần nghìn giây, đây là số minh hoạ. Bản ghi
      là một mẩu dữ liệu nhỏ, như một dòng của sổ, còn ổ đĩa cơ có đĩa kim loại quay
      và đầu đọc phải di chuyển nên chậm. Một nghìn lần là mười giây. Nhưng mười triệu
      lần là một trăm nghìn giây, gần hai mươi tám giờ. Cùng chương trình, cùng cách
      viết, chỉ khác dữ liệu nằm ở đâu và có bao nhiêu.
  - show: '<div class="box key">Hôm nay, bài mở đầu của cả lộ trình, ta trả lời ba
      câu hỏi:

      <ol><li>Máy tính <b>chạy</b> một chương trình thế nào, và vì sao chỗ để dữ liệu
      quyết định tốc độ?</li>

      <li>Bạn nên <b>học</b> cả bộ khoá này theo cách nào để nhớ lâu?</li>

      <li>Máy của bạn cần <b>cài</b> những gì, và kiểm bằng cách nào?</li></ol></div>

      '
    say: Hôm nay là bài mở đầu, ta trả lời ba câu hỏi. Máy tính chạy một chương trình
      thế nào, và vì sao chỗ để dữ liệu quyết định tốc độ. Bạn nên học cả bộ khoá
      này theo cách nào để nhớ lâu. Và máy của bạn cần cài những gì, kiểm bằng cách
      nào.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp, chương trình, bit và byte'
  checks:
  - 2 ** 8 == 256
  - 256 - 1 == 255
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      tệp</td><td>dữ liệu có tên, lưu lâu dài trên ổ đĩa; ví dụ ảnh <code>meo.png</code></td></tr><tr><td>②
      chương trình</td><td>một tệp chứa danh sách lệnh để máy làm lần lượt</td></tr><tr><td>③
      bit</td><td>một ô nhỏ nhất, chỉ chứa $0$ hoặc $1$</td></tr><tr><td>④ byte</td><td>tám
      bit ghép lại: có $2^8 = 256$ giá trị, từ $0$ tới $255$</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Tệp là dữ liệu có tên, được lưu lâu dài trên ổ đĩa. Chương
      trình là một tệp chứa danh sách lệnh để máy làm lần lượt. Bit là một ô nhỏ nhất,
      chỉ chứa không hoặc một. Hai mũ tám bằng hai trăm năm mươi sáu, nên một byte,
      tức tám bit ghép lại, có hai trăm năm mươi sáu giá trị, từ không tới hai trăm
      năm mươi lăm.
- id: sym
  kind: symbol
  title: Giải mã năm bộ phận và một dấu hiệu
  steps:
  - show: '<table class=''t''><tr><th>tên gọi</th><th>làm gì</th><th>ví dụ đời thường</th></tr><tr><td><b>bộ
      xử lý</b> (CPU)</td><td>làm từng lệnh nhỏ, rất nhanh</td><td>người thu ngân
      bấm máy tính</td></tr><tr><td><b>bộ nhớ</b> (RAM)</td><td>giữ dữ liệu đang dùng;
      tắt máy là mất</td><td>tờ giấy nháp trên bàn</td></tr><tr><td><b>ổ đĩa</b></td><td>lưu
      tệp lâu dài; chậm hơn bộ nhớ nhiều; có hai loại: <b>ổ cơ</b> (HDD, đĩa quay,
      chậm hơn) và <b>ổ thể rắn</b> (SSD, chip nhớ, nhanh hơn)</td><td>tủ hồ sơ ở
      phòng bên</td></tr><tr><td><b>hệ điều hành</b></td><td>chương trình điều phối:
      nạp tệp vào bộ nhớ, chia việc</td><td>quản lý toà nhà</td></tr><tr><td><b>cửa
      sổ lệnh</b></td><td>khung chữ: bạn gõ lệnh, máy trả lời bằng chữ</td><td>quầy
      giao dịch bằng lời</td></tr><tr><td><b>✔</b></td><td>dấu tích: đạt; dùng khi
      kiểm máy</td><td>dấu tích của giáo viên</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này giải mã năm bộ phận và một dấu hiệu. Bộ xử lý làm từng lệnh nhỏ
      rất nhanh, giống người thu ngân bấm máy tính. Bộ nhớ giữ dữ liệu đang dùng,
      tắt máy là mất, giống tờ giấy nháp. Ổ đĩa lưu tệp lâu dài nhưng chậm hơn nhiều,
      giống tủ hồ sơ ở phòng bên; loại có đĩa quay gọi là ổ cơ, loại dùng chip nhớ
      gọi là ổ thể rắn và nhanh hơn. Hệ điều hành là chương trình điều phối, nạp tệp
      vào bộ nhớ và chia việc. Cửa sổ lệnh là khung chữ để bạn gõ lệnh. Dấu tích nghĩa
      là đạt.
