      khi cài</td><td><b>có</b></td></tr></table>
    focus:
    - 1
    - 1
    - 2
    say: Lỗi thứ nhất, của người mới, là cài xong nhưng vẫn dùng cửa sổ lệnh cũ. Cửa
      sổ lệnh chỉ đọc danh sách thư mục công cụ lúc nó mở. Công cụ cài sau sẽ không
