      Danh sách đường dẫn là danh sách thư mục mà cửa sổ lệnh tìm công cụ khi bạn
      gõ tên.
- id: caidat
  kind: concept
  title: 'Cài đặt từng bước: Git, JDK, Python, sqlite3'
  steps:
  - show: <table class='t'><tr><th>màn hình của trình cài</th><th>việc làm</th></tr><tr><td>trang
      <code>git-scm.com</code></td><td>bấm tải Git for Windows bản 64-bit (tệp <code>Git-….-64-bit.exe</code>),
      rồi chạy tệp vừa tải</td></tr><tr><td><b>Select Components</b></td><td>giữ ô
      <b>Windows Explorer integration</b>, trong đó có <b>Open Git Bash here</b></td></tr><tr><td><b>Adjusting
      your PATH environment</b></td><td>giữ mục có ghi <b>Recommended</b>; mục <b>Use
      Git from Git Bash only</b> cũng đủ cho khoá này</td></tr><tr><td>các màn hình
      còn lại</td><td>giữ mặc định, bấm <b>Next</b>; cuối cùng <b>Install</b>, đợi
      xong, bấm <b>Finish</b></td></tr></table><p class='note' style='color:#111827'><b>①
      Cài Git for Windows</b> (giao diện có thể khác nhẹ theo phiên bản)</p>
    focus:
    - 1
    - 1
    - 2
    say: Bước một là cài công cụ ghi phiên bản. Tải ở địa chỉ chính thức, chạy tệp
      vừa tải, và giữ lựa chọn mặc định ở hầu hết màn hình. Hai màn hình đáng liếc
      là danh sách thành phần, nơi nên giữ mục mở cửa sổ lệnh tại một thư mục, và
      màn hình chỉnh đường dẫn, nơi nên giữ mục được ghi là nên chọn.
  - show: '<div class="box key"><b>Mở Git Bash và thử:</b> <span class=''note'' style=''color:#111827''>(giao
      diện có thể khác nhẹ theo phiên bản)</span>

      <ol><li>Bấm <b>Start</b>, gõ <code>Git Bash</code>, nhấn <b>Enter</b>: một cửa
      sổ chữ hiện ra, chờ bạn gõ.</li>

      <li>Gõ <code style="white-space:nowrap">git --version</code>, nhấn <b>Enter</b>:
      máy in một dòng <code>git version 2.…</code>; từ bản 2.28 trở lên là đạt.</li></ol></div>

      '
    clear: true
    say: 'Bây giờ mở cửa sổ lệnh: bấm vào nút mở danh sách chương trình ở góc dưới
      màn hình, gõ tên cửa sổ đó, rồi nhấn phím xuống dòng. Gõ lệnh hỏi phiên bản
      của công cụ ghi phiên bản; máy in tên và số phiên bản, từ hai chấm hai mươi
      tám trở lên là đạt.'
  - show: '<div class="box key"><b>Máy bạn là x64 hay ARM?</b> <b>x64</b> là loại
      chip 64-bit của Intel và AMD, có ở hầu hết máy Windows; <b>ARM</b> là loại chip
      khác, hiếm hơn.

      <ol><li>Bấm <b>Start</b>, gõ <code>System Information</code>, nhấn <b>Enter</b>.</li>

      <li>Đọc dòng <b>System Type</b>: <code>x64-based PC</code> là x64; ghi <code>ARM64-based
      PC</code> thì ở trang tải chọn bản <b>aarch64</b> thay cho x64.</li></ol></div>

      '
    clear: true
    say: Trước khi tải bộ phát triển Java, hãy biết máy mình dùng loại chip nào. Kiến
      trúc x sáu mươi bốn là loại chip sáu mươi bốn bit của hầu hết máy tính cá nhân,
      loại khác tên là a r m. Mở thông tin hệ thống, đọc dòng loại hệ thống; nếu ghi
      a r m sáu mươi bốn thì ở trang tải chọn bản dành cho nó.
  - show: '<table class=''t''><tr><th>bước</th><th>việc làm</th></tr><tr><td>trang
      <code>adoptium.net</code></td><td>chọn <b>Temurin 21 (LTS)</b> (<b>LTS</b> =
      bản hỗ trợ dài hạn, được vá lỗi nhiều năm), hệ điều hành <b>Windows</b>, kiến
      trúc <b>x64</b>, loại <b>JDK</b> (không phải JRE); tải tệp <code>.msi</code></td></tr><tr><td>màn
      hình <b>Custom Setup</b></td><td>bảo đảm ô <b>Add to PATH</b> được chọn (thường
      đã chọn sẵn); bấm <b>Next</b>, <b>Install</b>, <b>Finish</b></td></tr><tr><td>kiểm</td><td>mở
      một Git Bash <b>mới</b>, gõ <code>java -version</code> (chương trình chạy Java)
      rồi <code>javac -version</code> (<b>trình biên dịch</b>: chương trình dịch mã
      Java sang dạng máy chạy được): cả hai in số bắt đầu bằng <code>21</code></td></tr></table><p
      class=''note'' style=''color:#111827''><b>② Cài JDK 21 (Temurin)</b> (giao diện
      có thể khác nhẹ theo phiên bản)</p>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bước hai là bộ phát triển Java hai mươi mốt. Chọn bản có chữ L T S, nghĩa
      là hỗ trợ dài hạn. Chọn hệ điều hành của bạn, kiến trúc vừa biết, loại bộ phát
      triển đầy đủ chứ không phải loại chỉ để chạy, rồi tải tệp đuôi m s i. Khi cài,
      giữ ô thêm vào danh sách đường dẫn. Sau đó mở cửa sổ lệnh mới và hỏi phiên bản
      của chương trình chạy Java và của trình biên dịch. Trình biên dịch là chương
      trình dịch mã Java sang dạng máy chạy được. Cả hai phải in số hai mươi mốt.
  - show: '<div class="box key"><b>③ Cài Python 3.11 trở lên</b> <span class=''note''
      style=''color:#111827''>(giao diện có thể khác nhẹ theo phiên bản)</span>

      <ol><li>Vào <code>python.org/downloads/windows</code>, chọn một bản Python 3.13
      (hoặc từ 3.11 trở lên), tệp <b>Windows installer (64-bit)</b>.</li>

      <li>Chạy tệp tải về. Ở màn hình <b>đầu tiên</b>, <b>tích ô <code>Add python.exe
      to PATH</code></b> (nằm dưới cùng), rồi bấm <b>Install Now</b>.</li>

      <li>Mở một Git Bash <b>mới</b>, gõ <code style="white-space:nowrap">python --version</code>:
      in <code>Python 3.…</code>, từ 3.11 trở lên là đạt.</li></ol></div>

      <p class="note" style=''color:#111827''>Nếu trang chỉ đưa <b>Python install
      manager</b> (trình cài kiểu mới), cài nó theo hướng dẫn trên trang; đích vẫn
      là <code style="white-space:nowrap">python --version</code> trong Git Bash in
      từ 3.11. Nếu gõ <code>python</code> mà Windows mở cửa hàng ứng dụng, hoặc báo
      “Python was not found”, là Python chưa cài đúng: xem cảnh lỗi hay gặp.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước ba là Python, ngôn ngữ lập trình thứ hai, từ phiên bản ba chấm mười
      một trở lên. Tải tệp cài đặt sáu mươi bốn bit, ở màn hình đầu tiên tích ô thêm
      vào danh sách đường dẫn, rồi bấm cài ngay. Mở cửa sổ lệnh mới và hỏi phiên bản,
      cần thấy ba chấm mười một trở lên. Nếu trang chỉ đưa trình cài kiểu mới, cài
      nó theo trang hướng dẫn.
  - show: '<div class="box key"><b>④ Cài sqlite3 trên Windows (không cần quyền quản
      trị):</b>

      <ol><li>Vào <code>sqlite.org/download.html</code>, mục <b>Precompiled Binaries
      for Windows</b>, tải tệp <code>sqlite-tools-win-x64-….zip</code>.</li>

      <li>Giải nén (chuột phải, <b>Extract All</b>): có tệp <code>sqlite3.exe</code>.</li>

      <li>Trong thư mục cá nhân của bạn (<code>C:/Users/tên_bạn</code>) tạo thư mục
      tên <code>bin</code>, chép <code>sqlite3.exe</code> vào đó.</li>

      <li>Mở <b>LẠI</b> Git Bash, gõ <code style="white-space:nowrap">sqlite3 --version</code>:
      thấy số phiên bản bắt đầu bằng <code>3</code> là xong.</li></ol></div>

      <p class="note" style=''color:#111827''>Git Bash tự đưa thư mục <code>bin</code>
      trong thư mục cá nhân vào danh sách tìm lệnh mỗi khi mở.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, chương trình cơ sở dữ liệu, cài theo bốn việc và không cần quyền
      quản trị. Một, vào trang chính thức, tải tệp nén dựng sẵn cho hệ điều hành này.
      Hai, giải nén, bạn có một tệp chạy đuôi e x e. Ba, trong thư mục cá nhân của
      bạn, tạo một thư mục tên bin và chép tệp đó vào. Bốn, mở lại cửa sổ lệnh, gõ
      lệnh hỏi phiên bản, và thấy số bắt đầu bằng ba là xong.
- id: kiemsh
  kind: concept
  title: 'Tệp kiểm kiem.sh: tạo, chép và chạy'
  steps:
  - show: '<div class="box key"><b>Tạo tệp kiem.sh và chạy nó:</b>

      <ol><li>Mở một <b>trình soạn mã</b> (chương trình sửa chữ thuần): Visual Studio
      Code, tải ở <code>code.visualstudio.com</code>. Không dùng Word.</li>

      <li>Dán nội dung tệp kiểm, chép từ <code>labs/FND/L00/de.md</code>. Dấu ✔ chép
      dán, không gõ bằng bàn phím.</li>

      <li>Lưu (<b>Save As</b>) với tên <code>kiem.sh</code> vào thư mục gốc của bộ
      khoá: thư mục chứa thư mục <code>labs</code>.</li>

      <li>Trong cửa sổ quản lý tệp, mở thư mục đó, chuột phải vào chỗ trống, chọn
      <b>Open Git Bash here</b> (Windows 11: bấm <b>Show more options</b> trước).</li>

      <li>Gõ <code>bash kiem.sh</code>, nhấn Enter.</li></ol></div>

      <p class="note" style=''color:#111827''>Cửa sổ lệnh mở đúng thư mục chứa tệp
      nên chưa cần lệnh đổi thư mục; ta sẽ học lệnh đó sau.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bây giờ tạo tệp kiểm. Mở một trình soạn mã, tức chương trình sửa chữ thuần,
      không dùng chương trình soạn văn bản có định dạng. Dán nội dung tệp kiểm chép
      từ tệp đề bài; dấu tích phải chép và dán, vì bàn phím thường không gõ được.
      Lưu với tên kiem chấm s h vào thư mục gốc của bộ khoá, rồi chuột phải vào chỗ
      trống trong thư mục đó và chọn mở cửa sổ lệnh tại đây.
  - show: '<p><b>Tệp kiem.sh: chép nguyên vào tệp</b></p><div class="code"><div>dat()
      {</div><div>  v=<span>&#36;</span>("<span>&#36;</span>1" --version 2&gt;/dev/null
      | grep -oE ''[0-9.]+'' | head -1)</div><div>  nho=<span>&#36;</span>(printf
      ''%s\n%s\n'' "<span>&#36;</span>2" "<span>&#36;</span>v" | sort -V | head -1)</div><div>  if
      [ "<span>&#36;</span>nho" = "<span>&#36;</span>2" ]; then echo "✔ <span>&#36;</span>1";
      else echo "THIEU <span>&#36;</span>1"; fi</div><div>}</div><div>dat bash 4.0</div><div>dat
      git 2.28</div><div>dat javac 21</div><div>dat java 21</div><div>dat python 3.11</div><div>dat
      sqlite3 3.32</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    pause: 40
    clear: true
    say: Đây là tệp kiểm, bạn chép nguyên vào tệp tên kiem chấm s h. Nó chạy thật
      từng công cụ để hỏi phiên bản, rồi in dấu tích hoặc chữ báo thiếu. Bạn có thể
      dừng video để chép, chưa hiểu hết cũng đừng lo. Ta đọc từng phần của nó ngay
      sau đây.
  - show: '<table class=''t''><tr><th>phần của tệp</th><th>nghĩa</th></tr><tr><td
      style=''white-space:nowrap''><code>dat() { … }</code></td><td>đặt tên <code>dat</code>
      cho một nhóm lệnh để gọi lại nhiều lần; khi gọi, <code><span>&#36;</span>1</code>
      là chữ thứ nhất sau tên (tên công cụ), <code><span>&#36;</span>2</code> là chữ
      thứ hai (mức phiên bản thấp nhất)</td></tr><tr><td style=''white-space:nowrap''><code>v=<span>&#36;</span>(
      … )</code></td><td><b>biến</b> là một cái tên mang một giá trị: <code>v</code>
      nhận phần chữ mà lệnh trong ngoặc in ra; <code><span>&#36;</span>v</code> lấy
      giá trị đó ra</td></tr><tr><td style=''white-space:nowrap''><code>"<span>&#36;</span>1"
      --version 2&gt;/dev/null</code></td><td>hỏi chính công cụ: bạn là phiên bản
      nào? Nháy kép quanh <code>"$1"</code> giữ giá trị là một chữ nguyên vẹn. Công
      cụ chưa cài, hay chỉ là lối tắt mở cửa hàng ứng dụng, không trả được số; <code>2>/dev/null</code>
      ném thông báo lỗi đi</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: 'Dòng đầu đặt tên dat cho một nhóm lệnh để gọi lại sáu lần; trong đó đô la
      một là tên công cụ, đô la hai là mức phiên bản thấp nhất. Biến là một cái tên
      mang một giá trị: chữ v nhận phần chữ mà lệnh trong ngoặc in ra, và đô la v
      lấy giá trị đó ra. Lệnh hỏi chính công cụ xem nó là phiên bản nào, dấu nháy
      kép giữ tên công cụ là một chữ nguyên vẹn. Công cụ chưa cài thì không trả ra
      số, và đoạn chuyển hướng ở cuối ném thông báo lỗi đi.'
    clear: true
  - show: '<table class=''t''><tr><th>phần của tệp</th><th>nghĩa</th></tr><tr><td
      style=''white-space:nowrap''><code>… | grep -oE ''[0-9.]+'' | head -1</code></td><td>dấu
      <code>|</code> đưa chữ in ra của lệnh bên trái cho lệnh bên phải; <code>grep
      -o</code> chỉ in phần khớp <b>mẫu</b>; trong mẫu, <code>[0-9.]</code> là <b>một</b>
      ký tự thuộc nhóm chữ số <code>0</code>–<code>9</code> hoặc dấu chấm, và <code>+</code>
      (cần cờ <code>-E</code>) là một hay nhiều lần liền nhau, nên mẫu bắt trọn số
      phiên bản, ví dụ <code>2.53.0</code> trong dòng <code>git version 2.53.0</code>;
      <code>head -1</code> giữ dòng đầu</td></tr><tr><td style=''white-space:nowrap''><code>printf
      ''%s\n%s\n'' "<span>&#36;</span>2" "<span>&#36;</span>v"</code></td><td><code>printf</code>
      in chữ theo một khuôn: mỗi <code>%s</code> là một chỗ điền một chữ, <code>\n</code>
      là xuống dòng. Ví dụ <code>printf ''%s\n%s\n'' 2.28 2.53</code> in hai dòng:
      <code>2.28</code> rồi <code>2.53</code>. Ở đây: mức thấp nhất và số phiên bản
      thật, mỗi số một dòng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    say: Phần hai lọc ra số phiên bản rồi so với mức thấp nhất. Dấu gạch đứng đưa
      chữ in ra của lệnh bên trái cho lệnh bên phải. Lệnh lọc kèm cờ o chỉ in phần
      khớp mẫu. Trong mẫu, ngoặc vuông là một ký tự thuộc nhóm chữ số hoặc dấu chấm.
      Dấu cộng, cần cờ E, là một hay nhiều lần liền nhau, nên bắt trọn số phiên bản
      như hai chấm năm mươi ba chấm không. Lệnh lấy dòng đầu giữ dòng đầu tiên. Lệnh
      in theo khuôn nhận một khuôn chữ. Trong khuôn, ký hiệu phần trăm s là một chỗ
      điền một chữ, gạch chéo n là xuống dòng; điền hai chấm hai mươi tám và hai chấm
      năm mươi ba thì in hai dòng.
  - show: '<table class=''t''><tr><th>phần của tệp</th><th>nghĩa</th></tr><tr><td
      style=''white-space:nowrap''><code>sort -V</code></td><td>xếp các số phiên bản
      từ nhỏ tới lớn: nếu số đứng đầu đúng là mức thấp nhất thì máy đạt</td></tr><tr><td
      style=''white-space:nowrap''><code>if [ "<span>&#36;</span>nho" = "<span>&#36;</span>2"
      ]; then A; else B; fi</code></td><td><b>lệnh điều kiện</b>: <code>[ "<span>&#36;</span>nho"
      = "<span>&#36;</span>2" ]</code> hỏi hai chữ có bằng nhau không; đúng thì làm
      A (in ✔), không thì làm B (in THIEU). Dấu <code>;</code> nối các phần trên cùng
      một dòng, như một lần xuống dòng</td></tr><tr><td style=''white-space:nowrap''><code>dat
      git 2.28</code></td><td>một lần gọi: công cụ <code>git</code>, từ bản 2.28 trở
      lên mới đạt; sáu dòng cuối là sáu lần gọi</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Lệnh xếp theo phiên bản sắp hai số từ nhỏ tới lớn, nên nếu số đứng đầu đúng
      là mức thấp nhất thì máy đạt yêu cầu. Lệnh điều kiện hỏi hai chữ có bằng nhau
      không, đúng thì in dấu tích, không thì in chữ báo thiếu; dấu chấm phẩy nối các
      phần trên cùng một dòng, như một lần xuống dòng. Sáu dòng cuối là sáu lần gọi,
      mỗi lần ghi tên công cụ và mức thấp nhất, ví dụ công cụ ghi phiên bản từ bản
      hai chấm hai mươi tám.
  - show: <p><b>Chạy trong cửa sổ lệnh</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>bash kiem.sh</div><div>✔ bash</div><div>✔ git</div><div>✔ javac</div><div>✔
      java</div><div>✔ python</div><div>✔ sqlite3</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chạy tệp này, máy in sáu dòng. Mỗi dòng bắt đầu bằng dấu tích nghĩa là công
      cụ đó đã có và đủ phiên bản. Dòng nào báo thiếu, bạn cài hoặc nâng cấp công
      cụ đó rồi mở lại cửa sổ lệnh và chạy lại.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Cài xong nhưng vẫn dùng
      cửa sổ lệnh <b>cũ</b> đang mở.</div><table class='t'><tr><th>cửa sổ lệnh</th><th>mở
      lúc nào</th><th>thấy công cụ vừa cài?</th></tr><tr><td>A</td><td>trước khi cài</td><td><b>không</b></td></tr><tr><td>B</td><td>sau
      khi cài</td><td><b>có</b></td></tr></table>
    focus:
    - 1
    - 1
    - 2
    say: Lỗi thứ nhất, của người mới, là cài xong nhưng vẫn dùng cửa sổ lệnh cũ. Cửa
      sổ lệnh chỉ đọc danh sách thư mục công cụ lúc nó mở. Công cụ cài sau sẽ không
      được thấy cho tới khi bạn đóng và mở lại cửa sổ.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Gõ sai tên lệnh, hoặc quên
      “Add to PATH” khi cài, hoặc cài nhầm bản <b>JRE</b> thay vì <b>JDK</b>.</div><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>pyton --version</div><div>bash:
      pyton: command not found</div></div><p>JRE chỉ chạy được Java; thiếu trình biên
      dịch <code>javac</code>, nên không viết được chương trình.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là gõ sai tên lệnh, hoặc quên đánh dấu ô
      thêm vào đường dẫn khi cài, nên máy báo không tìm thấy lệnh. Hoặc cài nhầm bản
      chỉ để chạy Java, thiếu trình biên dịch nên không viết được chương trình.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Đo thời gian chạy
      hai lần rồi tin lần nhanh hơn.</div><table class='t'><tr><th>lần đo</th><th>dữ
      liệu lấy từ đâu</th><th>thời gian</th></tr><tr><td>đầu (nguội)</td><td>ổ đĩa</td><td>chậm</td></tr><tr><td>sau
      (nóng)</td><td>bộ nhớ, hệ điều hành đã giữ sẵn</td><td>nhanh hơn nhiều</td></tr></table>
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Lỗi thứ ba, của cả người đã đi làm, là đo thời gian chạy hai lần rồi tin
      lần nhanh hơn. Lần đầu, dữ liệu phải đọc từ ổ đĩa. Lần sau, hệ điều hành đã
      giữ sẵn trong bộ nhớ, nên nhanh hơn nhiều dù mã không đổi. Một số đo đáng tin
      phải nói rõ là lần nguội hay lần nóng.
    clear: true
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 200_000 * 100 // 1_000_000 == 20
  - 200_000 * 100 / 1e9 == 0.02
  - round(2 + 200_000 * 100 / 1e9, 2) == 2.02
  - 20 * 100 / 1000 == 2.0
  - round(20 / 2.02, 1) == 9.9
  steps:
  - show: '<p><b>Đề.</b> Một chương trình cần đọc <b>200 000</b> bản ghi nhỏ, mỗi
      bản ghi chỉ đọc <b>một lần</b>, từ ổ thể rắn ($100$ micro giây mỗi lần).</p>

      <ol><li>Cách A: đọc từng bản ghi từ ổ. Tổng chờ?</li>

      <li>Cách B: nạp cả kho vào bộ nhớ trước (mất $2$ giây), rồi đọc $200\,000$ lần
      ở bộ nhớ ($100$ ns mỗi lần). Tổng?</li>

      <li>Nếu chỉ cần <b>20</b> bản ghi thì chọn cách nào, vì sao?</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Một chương trình đọc hai trăm nghìn bản ghi
      nhỏ, mỗi bản ghi chỉ đọc một lần, từ ổ đĩa thể rắn, một trăm phần triệu giây
      mỗi lần. Câu một, cách A đọc từng bản ghi từ ổ, tổng chờ bao nhiêu. Câu hai,
      cách B nạp cả kho vào bộ nhớ trước, mất hai giây, rồi đọc ở bộ nhớ, tổng bao
      nhiêu. Câu ba, nếu chỉ cần hai mươi bản ghi thì chọn cách nào, vì sao.
  - show: '<p><b>Câu 1.</b> Cách A:</p>

      $$200\,000 \times 100\ \text{micro giây} = 20\,000\,000\ \text{micro giây} =
      \hl{20\ \text{giây}}$$

      <p><b>Câu 2.</b> Cách B: nạp $2$ giây, rồi đọc ở bộ nhớ:</p>

      $$200\,000 \times 100\ \text{ns} = 0{,}02\ \text{giây} \;\Rightarrow\; 2 + 0{,}02
      = \hl{2{,}02\ \text{giây}}$$

      '
    focus:
    - 1
    - 2
    - 3
    say: Đáp án câu một, cách A, hai trăm nghìn nhân một trăm phần triệu giây là hai
      mươi triệu phần triệu giây, tức hai mươi giây. Câu hai, cách B, nạp mất hai
      giây, rồi đọc ở bộ nhớ hai trăm nghìn nhân một trăm phần tỉ giây là hai mươi
      triệu phần tỉ giây, tức không phẩy không hai giây. Tổng là hai phẩy không hai
      giây, nhanh hơn gần mười lần.
    clear: true
    introduces:
    - implies
  - show: '<p><b>Câu 3.</b> Cách A với 20 bản ghi: $20 \times 100$ micro giây $= 2$
      mili giây. Cách B vẫn mất ít nhất $2$ giây để nạp.</p>

      <div class="box key">Chỉ cần ít bản ghi thì <b>cách A thắng</b> ($2$ mili giây
      so với hơn $2$ giây). Nạp trước chỉ có lợi khi số lần đọc đủ lớn để bù chi phí
      nạp.</div>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Câu ba, với hai mươi bản ghi, cách A mất hai phần nghìn giây, còn cách B
      vẫn mất ít nhất hai giây chỉ để nạp. Vậy khi chỉ cần ít bản ghi, cách A thắng.
      Nạp trước chỉ có lợi khi số lần đọc đủ lớn để bù chi phí nạp.
- id: practice
  kind: practice
  title: 'Tự làm: cài đủ công cụ, chấm bằng tệp kiểm'
  steps:
  - show: '<p><b>Đề</b>: máy của bạn phải có đủ công cụ của khoá.</p>

      <ol><li>Cài Git for Windows (2.28+), JDK 21, Python 3.11+ và <code>sqlite3</code>
      3.32+ (đặt <code>sqlite3.exe</code> vào thư mục <code>bin</code> cá nhân), rồi
      <b>mở lại</b> Git Bash.</li>

      <li>Tạo tệp <code>kiem.sh</code> với đúng nội dung ở cảnh trước (chép nguyên),
      lưu ở thư mục gốc của bộ khoá.</li>

      <li>Mở Git Bash tại thư mục đó và chạy <code>bash kiem.sh</code>: cần <b>sáu
      dòng ✔</b>.</li></ol>

      <p class="note" style=''color:#111827''>Dòng nào báo THIEU: cài công cụ đó,
      mở lại Git Bash, chạy lại.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm trên máy. Cài bốn công cụ của khoá rồi mở lại
      cửa sổ lệnh. Tạo tệp kiểm với đúng nội dung ở cảnh trước, mở cửa sổ lệnh tại
      thư mục chứa tệp, chạy nó, và cần thấy sáu dấu tích. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>✔ bash</div><div>✔
      git</div><div>✔ javac</div><div>✔ java</div><div>✔ python</div><div>✔ sqlite3</div></div><p
      class="note" style=''color:#111827''>Chấm bằng Git Bash: <code>bash labs/cham.sh
      FND L00 kiem.sh</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> dòng THIEU python: chưa cài Python
      3.11 trở lên, hoặc chưa đánh dấu “Add to PATH”, hoặc máy chỉ có lối tắt mở cửa
      hàng ứng dụng thay cho Python (gõ <code style="white-space:nowrap">python --version</code>
      mà báo “Python was not found” là ca này); cài từ python.org.

      Dòng THIEU javac: bạn cài bản JRE hoặc bản Java cũ hơn 21; hãy cài JDK 21. Dòng
      THIEU git hoặc sqlite3: bản cũ hơn mức thấp nhất (Git 2.28, sqlite3 3.32). Dòng
      THIEU sqlite3: <code>sqlite3.exe</code> chưa nằm trong thư mục <code>bin</code>
      cá nhân, hoặc chưa mở lại Git Bash. Bản đối chiếu tệp kiểm ở <code>labs/FND/L00/loi_giai.sh</code>;
      việc chính ở bài 0 là tự cài đủ công cụ tới khi chạy ra sáu dấu ✔.</div>

      '
    say: Nếu kẹt, dòng báo thiếu ngôn ngữ thứ hai nghĩa là bạn chưa cài, hoặc chưa
      đánh dấu ô thêm vào đường dẫn. Cũng có thể máy chỉ có lối tắt mở cửa hàng ứng
      dụng, hãy cài từ địa chỉ chính thức. Dòng báo thiếu trình biên dịch Java nghĩa
      là bạn cài nhầm bản chỉ để chạy, hoặc bản cũ hơn hai mươi mốt. Dòng báo thiếu
      cơ sở dữ liệu nghĩa là tệp chạy chưa nằm trong thư mục bin cá nhân, hoặc bạn
      chưa mở lại cửa sổ lệnh. Bản đối chiếu tệp kiểm nằm ở thư mục thực hành, việc
      chính là tự cài đủ công cụ tới khi máy in sáu dấu tích.
    clear: true
  lab: labs/FND/L00
- id: recap
  kind: recap
  title: Chuỗi logic, tư duy và bản đồ khoá
  steps:
  - show: '<div class=''chain''><span class=''n''>tệp trên ổ đĩa</span><span class=''a''>→</span><span
      class=''n''>nạp vào bộ nhớ</span><span class=''a''>→</span><span class=''n''>bộ
      xử lý làm từng lệnh</span><span class=''a''>→</span><span class=''n''>tổng chờ
      = số lần × thời gian một lần</span><span class=''a''>→</span><span class=''n''>học:
      xem → tự làm → chấm → đánh dấu → ôn</span><span class=''a''>→</span><span class=''n''>máy:
      kiểm bằng tệp kiem.sh</span></div>'
    say: Tổng kết chuỗi logic. Chương trình nằm ở ổ đĩa, được nạp vào bộ nhớ, và bộ
      xử lý làm từng lệnh. Tổng chờ bằng số lần nhân thời gian một lần, nên chỗ để
      dữ liệu quyết định tốc độ. Cách học là xem, tự làm, chấm, đánh dấu, ôn. Và máy
      sẵn sàng khi tệp kiểm in sáu dấu tích.
