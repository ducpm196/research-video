objectives:
- Mô tả đường đi của chương trình từ ổ đĩa vào bộ nhớ tới bộ xử lý làm từng lệnh
- Chạy tay chương trình ba lệnh và ghi bộ nhớ sau mỗi lệnh
- Tính tổng thời gian chờ bằng số lần nhân thời gian một lần, ở ba quy mô dữ liệu
- Kể năm bước của vòng học (xem, tự làm, chấm, đánh dấu, ôn) và giải thích vì sao
  tự làm trước khi xem đáp án
- Cài các công cụ của khoá, kể cả sqlite3, và kiểm máy bằng tệp lệnh in dấu tích cho
  từng công cụ
- Tạo, lưu và chạy một tệp lệnh bằng trình soạn mã và Git Bash mở ngay tại thư mục
  chứa tệp
