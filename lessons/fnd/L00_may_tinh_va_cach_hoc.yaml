  kind: recap
  title: Chuỗi logic, tư duy và bản đồ khoá
  steps:
  - show: '<div class=''chain''><span class=''n''>tệp trên ổ đĩa</span><span class=''a''>→</span><span
      class=''n''>nạp vào bộ nhớ</span><span class=''a''>→</span><span class=''n''>bộ
      xử lý làm từng lệnh</span><span class=''a''>→</span><span class=''n''>tổng chờ
      = số lần × thời gian một lần</span><span class=''a''>→</span><span class=''n''>học:
      xem → tự làm → chấm → ôn</span><span class=''a''>→</span><span class=''n''>máy:
      kiểm bằng tệp kiem.sh</span></div>'
    say: Tổng kết chuỗi logic. Chương trình nằm ở ổ đĩa, được nạp vào bộ nhớ, và bộ
