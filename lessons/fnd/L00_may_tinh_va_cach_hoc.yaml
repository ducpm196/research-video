      font-size="24" text-anchor="middle" fill="#1f2937">ở trang HOC_TAP</text><path
      d="M1335,245 L1335,330 L150,330 L150,245" fill="none" stroke="#d97706" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="740" y="318" font-size="24" text-anchor="middle"
      fill="#d97706" font-weight="bold">⑤ ôn lại sau 1 ngày, 1 tuần, 1 tháng (lịch
      gợi ý, số minh hoạ)</text><text x="740" y="385" font-size="24" text-anchor="middle"
      fill="#dc2626">đáp án chỉ mở sau khi bạn đã thử ít nhất một lần</text></svg></div>'
    clear: true
    say: Đây là vòng học của cả bộ khoá. Bước một, xem một bài video. Bước hai, dừng
      video và tự làm cảnh Tự làm, đề nằm trong thư mục thực hành của bài. Bước ba,
      chấm bằng một lệnh, nó in đúng hoặc chỉ ra dòng khác. Bước bốn, đánh dấu bài
      đó ở trang học tập. Bước năm, ôn lại sau một ngày, một tuần, một tháng, đây
      là lịch gợi ý.
  - show: '<div class="box key"><b>Vì sao tự làm TRƯỚC khi xem đáp án?</b> Tự kiểm
      tra và tự làm, kể cả làm sai, giúp nhớ <b>lâu</b> hơn là chỉ đọc lại hay xem
      lại.

      <span class=''note'' style=''color:#111827''>(Roediger &amp; Karpicke, 2006:
      kiểm tra sau <b>5 phút</b> thì học lại còn nhỉnh hơn; kiểm tra sau <b>2 ngày
      và 1 tuần</b> thì người tự kiểm tra giữ được nhiều hơn.)</span></div>

      <p>Xem video thụ động tạo <b>ảo giác “mình biết rồi”</b>; chỉ khi tay gõ ra
      kết quả bạn mới biết mình hiểu thật chưa.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Vì sao phải tự làm trước khi xem đáp án? Một nghiên cứu năm hai nghìn không
      trăm linh sáu cho thấy kiểm tra sau năm phút thì học lại còn nhỉnh hơn. Nhưng
      sau hai ngày và một tuần thì người tự kiểm tra giữ được nhiều hơn. Xem video
      thụ động dễ tạo ảo giác là mình biết rồi. Chỉ khi tay bạn gõ ra kết quả, bạn
      mới biết mình hiểu thật chưa.
- id: chuanbi
  kind: concept
  title: 'Chuẩn bị máy: cửa sổ lệnh và bốn công cụ'
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><b>vỏ lệnh</b>
      (shell)</td><td>chương trình nhận chữ bạn gõ rồi bảo máy làm: bạn gõ một dòng,
      nhấn phím <b>Enter</b>, máy làm và trả lời</td></tr><tr><td><b>bash</b></td><td>tên
      một loại vỏ lệnh, phổ biến nhất trên máy chủ</td></tr><tr><td><b>Git Bash</b></td><td>cửa
      sổ gõ lệnh trên Windows, đi kèm khi cài Git for Windows; bên trong nó chạy bash</td></tr><tr><td><b>.sh</b></td><td>đuôi
      tên <b>tệp lệnh</b> viết cho bash; <code>bash kiem.sh</code> nghĩa là nhờ bash
      chạy các lệnh ghi trong tệp <code>kiem.sh</code></td></tr></table>'
    introduces:
    - fnd_bash
    say: 'Vỏ lệnh là chương trình nhận chữ bạn gõ rồi bảo máy làm: bạn gõ một dòng,
      nhấn phím xuống dòng, và máy trả lời. Một loại vỏ lệnh phổ biến có tên là b
      a s h. Cửa sổ gõ lệnh đi kèm công cụ ghi phiên bản chạy vỏ lệnh đó bên trong.
      Tệp lệnh viết cho nó thường có đuôi chấm s h, và gõ tên vỏ lệnh rồi tên tệp
      là nhờ nó chạy các lệnh trong tệp ấy.'
  - show: '<p><b>Ví dụ nhỏ: gõ lệnh, nhấn Enter, máy trả lời</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo xin chao</div><div>xin chao</div></div><p
      class=''note'' style=''color:#111827''>Dòng có dấu <code><span>&#36;</span></code>
      ở đầu là dòng <b>bạn gõ</b>; <code>echo</code> in lại đúng chữ đứng sau nó;
      dòng bên dưới là máy trả lời.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
