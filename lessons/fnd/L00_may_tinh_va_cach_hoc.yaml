    say: Ta chạy tay một chương trình ba lệnh, như bộ xử lý làm. Lệnh một ghi số hai
      vào ô nhớ số không. Lệnh hai ghi số ba vào ô nhớ số một. Lệnh ba lấy hai số
      đó, cộng lại, và ghi vào ô số hai. Các ô nhớ được đánh số từ không, và mũi tên
      nghĩa là ghi giá trị bên phải vào ô bên trái.
  - show: <table class='t'><tr><th>sau lệnh</th><th>ô 0</th><th>ô 1</th><th>ô 2</th></tr><tr><td>①</td><td><b>2</b></td><td>chưa
      ghi</td><td>chưa ghi</td></tr><tr><td>②</td><td>2</td><td><b>3</b></td><td>chưa
      ghi</td></tr><tr><td>③</td><td>2</td><td>3</td><td><b>5</b></td></tr></table><p>Sau
      lệnh ③, ô 2 giữ $2 + 3 = \hl{5}$.</p>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Bảng này cho thấy bộ nhớ sau từng lệnh. Sau lệnh một, ô không giữ hai. Sau
      lệnh hai, ô một giữ ba. Sau lệnh ba, ô hai giữ năm, vì hai cộng ba bằng năm.
      Mỗi lệnh chỉ làm một việc nhỏ, và mọi chương trình, dù lớn đến đâu, đều là hàng
      triệu việc nhỏ như vậy.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: thời gian chờ = số lần × thời gian mỗi lần'
  checks:
  - 1000 * 10 == 10000
  - 10 * 1000 * 1000 == 10_000_000
  - 100 // 60 == 1 and 100 % 60 == 40
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi lần đọc phải chờ xong rồi mới tới lần sau, nên các
      thời gian chờ <b>cộng nối tiếp</b>:</p>

      $$\text{tổng chờ} = \text{số lần} \times \text{thời gian một lần}$$

      <span class=''note''>Làm thử: 1 000 lần × 10 mili giây = 10 000 mili giây =
      10 giây ✓</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước một, mỗi lần đọc phải chờ xong rồi mới tới lần sau, nên các thời gian
      chờ cộng nối tiếp. Vì vậy tổng thời gian chờ bằng số lần nhân thời gian một
      lần. Làm thử, một nghìn lần nhân mười phần nghìn giây là mười nghìn phần nghìn
      giây, tức mười giây.
  - show: '<p><b>Bước 2.</b> Muốn so hai thiết bị phải đổi về <b>cùng một đơn vị</b>.
      Mỗi bậc đơn vị gấp $1\,000$ lần bậc dưới:</p>

      $$1\ \text{mili giây} = 1\,000\ \text{micro giây} = 1\,000\,000\ \text{nano
      giây}$$

      <span class=''note''>Làm thử: 10 mili giây = 10 000 micro giây = 10 000 000
      nano giây ✓</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước hai, muốn so hai thiết bị, ta phải đổi về cùng một đơn vị. Mỗi bậc đơn
      vị gấp một nghìn lần bậc dưới, nên một phần nghìn giây bằng một nghìn phần triệu
      giây, và bằng một triệu phần tỉ giây. Làm thử, mười phần nghìn giây là mười
      nghìn phần triệu giây, và là mười triệu phần tỉ giây.
    clear: true
  - show: '<p><b>Bước 3.</b> Con số nano giây khó cảm nhận, nên <b>phóng to</b>: coi
      $1$ nano giây như $1$ giây của đời người.</p>

      $$100\ \text{nano giây} \;\to\; 100\ \text{giây} = 1\ \text{phút}\ 40\ \text{giây}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, phần tỉ giây khó cảm nhận, nên ta phóng to. Coi một phần tỉ giây
      như một giây của đời người. Khi đó một trăm phần tỉ giây thành một trăm giây,
      tức một phút bốn mươi giây.
    clear: true
- id: example
  kind: example
  title: 'Ví dụ: thang thời gian của người, năm phép tính'
  checks:
  - 100 * 1_000 == 100_000
  - 100_000 // 3600 == 27 and (100_000 % 3600) // 60 == 46 and (100_000 % 3600) %
    60 == 40
  - round(10_000_000 / 86400, 1) == 115.7
  - 100_000 // 100 == 1000
  - 10_000_000 // 100_000 == 100
  - 1000 * 100 == 100_000 and 1000 * 100_000 == 100_000_000 and 1000 * 10_000_000
    == 10_000_000_000
  steps:
  - show: '<p>Số minh hoạ (bậc độ lớn): bộ nhớ $100$ ns, ổ đĩa thể rắn $100\,000$
      ns, ổ đĩa cơ $10\,000\,000$ ns cho một lần đọc (ns = nano giây).</p>

      $$① \; \text{bộ nhớ: } 100\ \text{ns} \to 100\ \text{giây} = \hl{1\ \text{phút}\
      40\ \text{giây}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ nhất. Theo số minh hoạ, một lần đọc bộ nhớ mất chừng một trăm
      phần tỉ giây. Phóng to thành thang người, đó là một trăm giây, tức một phút
      bốn mươi giây.
  - show: '$$② \; \text{ổ thể rắn: } 100\,000\ \text{ns} \to 100\,000\ \text{giây}
      = 27\ \text{giờ}\ 46\ \text{phút}\ 40\ \text{giây}$$

      <span class=''note''>$100\,000 / 3\,600 = 27$ dư $2\,800$ giây; $2\,800 / 60
      = 46$ dư $40$.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Phép tính thứ hai. Ổ đĩa thể rắn mất một trăm nghìn phần tỉ giây, phóng to
      thành một trăm nghìn giây. Chia cho ba nghìn sáu trăm giây mỗi giờ được hai
      mươi bảy giờ, dư hai nghìn tám trăm giây, tức bốn mươi sáu phút bốn mươi giây.
      Vậy một lần đọc ở ổ đĩa thể rắn dài hơn một ngày theo thang người.
    clear: true
  - show: '$$③ \; \text{ổ cơ: } 10\,000\,000\ \text{ns} \to 10\,000\,000\ \text{giây}
      \approx \hl{115{,}7\ \text{ngày}}$$

      <span class=''note''>$10\,000\,000 / 86\,400 \approx 115{,}7$ (một ngày có $86\,400$
      giây).</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ ba. Ổ đĩa cơ mất mười triệu phần tỉ giây, phóng to thành mười
      triệu giây. Chia cho tám mươi sáu nghìn bốn trăm giây mỗi ngày, được khoảng
      một trăm mười lăm phẩy bảy ngày, gần bốn tháng.
    clear: true
  - show: '$$④ \; \frac{100\,000}{100} = \hl{1\,000} \qquad \frac{10\,000\,000}{100\,000}
      = \hl{100}$$

      <p>Ổ thể rắn chậm hơn bộ nhớ $1\,000$ lần; ổ cơ chậm hơn ổ thể rắn $100$ lần.</p>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, so các tỉ lệ. Một trăm nghìn chia một trăm được một nghìn,
      nên ổ thể rắn chậm hơn bộ nhớ một nghìn lần. Mười triệu chia một trăm nghìn
      được một trăm, nên ổ cơ chậm hơn ổ thể rắn một trăm lần.
  - show: '<table class=''t''><tr><th>đọc 1 000 lần</th><th>tính</th><th>tổng chờ</th></tr><tr><td>bộ
      nhớ</td><td>$1\,000 \times 100$ ns</td><td><b>0,1 mili giây</b></td></tr><tr><td>ổ
      thể rắn</td><td>$1\,000 \times 100$ micro giây</td><td><b>100 mili giây</b></td></tr><tr><td>ổ
      cơ</td><td>$1\,000 \times 10$ mili giây</td><td><b>10 giây</b></td></tr></table><span
      class=''note''>Phép tính ⑤: lấy số lần nhân thời gian một lần, theo công thức
      ở bước trước.</span>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Phép tính thứ năm, áp công thức tổng chờ cho một nghìn lần đọc. Bộ nhớ mất
      không phẩy một phần nghìn giây. Ổ đĩa thể rắn mất một trăm phần nghìn giây.
      Ổ đĩa cơ mất mười giây. Ba thiết bị cho cùng việc nhưng khác nhau tới một trăm
      nghìn lần.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: so thẳng ổ cơ với bộ nhớ'
  checks:
  - 10_000_000 // 100 == 100_000 == 1000 * 100
  - round(100_000 / 3600, 1) == 27.8
  - 10_000_000 * 10 // 1000 == 100_000
  steps:
  - show: '<p>Đường khác: bỏ qua thang người, so thẳng ổ cơ với bộ nhớ bằng nano giây.</p>

      $$\frac{10\,000\,000}{100} = \hl{100\,000} \text{ lần}$$

      <p>Mà $1\,000 \times 100 = 100\,000$ ✓ khớp với tích hai tỉ lệ ở trên.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: Đường kiểm khác, ta bỏ qua thang người và so thẳng ổ đĩa cơ với bộ nhớ bằng
      phần tỉ giây. Mười triệu chia một trăm được một trăm nghìn lần. Vì một nghìn
      nhân một trăm cũng bằng một trăm nghìn, kết quả khớp với tích hai tỉ lệ ở ví
      dụ trên.
  - show: '<p>Kiểm đơn vị: $100\,000$ giây chia $3\,600$ ra khoảng $27{,}8$ giờ; ở
      đầu bài $10\,000\,000$ lần $\times 10$ mili giây $= 100\,000$ giây ✓</p>'
    clear: true
    say: Kiểm thêm đơn vị. Một trăm nghìn giây chia ba nghìn sáu trăm là khoảng hai
      mươi bảy phẩy tám giờ. Theo đầu bài, mười triệu lần nhân mười phần nghìn giây
      cũng ra một trăm nghìn giây, nên hai con số trùng nhau.
- id: scale
  kind: concept
  title: 'Khi dữ liệu nhân lên: chỗ để dữ liệu quyết định'
  checks:
  - 1000 * 10 // 1000 == 10
  - 100_000 * 10 // 1000 == 1000 and round(1000 / 60, 1) == 16.7
  - round(10_000_000 * 10 / 1000 / 3600, 1) == 27.8
  - 10_000_000 * 100 // 1_000_000_000 == 1
  steps:
  - show: '<table class=''t''><tr><th>số lần đọc</th><th>bộ nhớ</th><th>ổ thể rắn</th><th>ổ
      cơ</th></tr><tr><td>×1: 1 000</td><td>0,1 ms</td><td>0,1 giây</td><td>10 giây</td></tr><tr><td>×100:
      100 000</td><td>10 ms</td><td>10 giây</td><td>16,7 phút</td></tr><tr><td>×10
      000: 10 000 000</td><td>1 giây</td><td>16,7 phút</td><td>27,8 giờ</td></tr></table><span
      class=''note''>Số minh hoạ: 100 ns, 100 micro giây, 10 mili giây mỗi lần đọc.
      ms = mili giây.</span>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    say: Bảng này cho thấy điều gì xảy ra khi số lần đọc nhân lên. Ở một nghìn lần,
      ổ cơ mất mười giây, vẫn chịu được. Nhân một trăm lần, ổ cơ mất mười sáu phẩy
      bảy phút. Nhân mười nghìn lần, ổ cơ mất hai mươi tám giờ, còn bộ nhớ vẫn chỉ
      một giây. Cách cũ là cứ đọc từ ổ đĩa khi cần, và nó gãy ở quy mô lớn.
  - show: '<div class="box key"><b>Đánh đổi người làm nghề phải chọn:</b>

      <ul><li>giữ dữ liệu nóng trong <b>bộ nhớ</b>: nhanh, nhưng đắt, ít chỗ, <b>mất
      khi tắt máy</b>;</li>

      <li>đọc theo <b>khối liền nhau</b> thay vì rải rác: ít lần chờ hơn;</li>

      <li>lập <b>chỉ mục</b> (mục lục) để khỏi đọc cả kho: bài về cơ sở dữ liệu quay
      lại ý này.</li></ul></div>

      '
    forward_ref: true
    say: Người làm nghề phải chọn một đánh đổi. Giữ dữ liệu nóng trong bộ nhớ thì
      nhanh, nhưng đắt, ít chỗ và mất khi tắt máy. Đọc theo khối liền nhau thì ít
      lần chờ hơn. Lập chỉ mục, tức một cái mục lục, để khỏi đọc cả kho. Ý này sẽ
      quay lại ở bài về cơ sở dữ liệu.
    clear: true
