- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 200_000 * 100 // 1_000_000 == 20
  - 200_000 * 100 / 1e9 == 0.02
  - round(2 + 200_000 * 100 / 1e9, 2) == 2.02
  - 20 * 100 / 1000 == 2.0
  - round(20 / 2.02, 1) == 9.9
  steps:
  - show: '<p><b>Đề.</b> Một chương trình cần đọc <b>200 000</b> bản ghi nhỏ, mỗi
      bản ghi chỉ đọc <b>một lần</b>, từ ổ thể rắn ($100$ micro giây mỗi lần).</p>

      <ol><li>Cách A: đọc từng bản ghi từ ổ. Tổng chờ?</li>

      <li>Cách B: nạp cả kho vào bộ nhớ trước (mất $2$ giây), rồi đọc $200\,000$ lần
      ở bộ nhớ ($100$ ns mỗi lần). Tổng?</li>

      <li>Nếu chỉ cần <b>20</b> bản ghi thì chọn cách nào, vì sao?</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Một chương trình đọc hai trăm nghìn bản ghi
      nhỏ, mỗi bản ghi chỉ đọc một lần, từ ổ đĩa thể rắn, một trăm phần triệu giây
      mỗi lần. Câu một, cách A đọc từng bản ghi từ ổ, tổng chờ bao nhiêu. Câu hai,
      cách B nạp cả kho vào bộ nhớ trước, mất hai giây, rồi đọc ở bộ nhớ, tổng bao
      nhiêu. Câu ba, nếu chỉ cần hai mươi bản ghi thì chọn cách nào, vì sao. Hãy dừng
      video và tính.
  - show: '<p><b>Câu 1.</b> Cách A:</p>

      $$200\,000 \times 100\ \text{micro giây} = 20\,000\,000\ \text{micro giây} =
      \hl{20\ \text{giây}}$$

      <p><b>Câu 2.</b> Cách B: nạp $2$ giây, rồi đọc ở bộ nhớ:</p>

      $$200\,000 \times 100\ \text{ns} = 0{,}02\ \text{giây} \;\Rightarrow\; 2 + 0{,}02
      = \hl{2{,}02\ \text{giây}}$$

      '
    focus:
    - 1
    - 2
    - 3
    say: Đáp án câu một, cách A, hai trăm nghìn nhân một trăm phần triệu giây là hai
      mươi triệu phần triệu giây, tức hai mươi giây. Câu hai, cách B, nạp mất hai
      giây, rồi đọc ở bộ nhớ hai trăm nghìn nhân một trăm phần tỉ giây là hai mươi
      triệu phần tỉ giây, tức không phẩy không hai giây. Tổng là hai phẩy không hai
      giây, nhanh hơn gần mười lần.
    clear: true
    introduces:
    - implies
  - show: '<p><b>Câu 3.</b> Cách A với 20 bản ghi: $20 \times 100$ micro giây $= 2$
      mili giây. Cách B vẫn mất ít nhất $2$ giây để nạp.</p>

      <div class="box key">Chỉ cần ít bản ghi thì <b>cách A thắng</b> ($2$ mili giây
      so với hơn $2$ giây). Nạp trước chỉ có lợi khi số lần đọc đủ lớn để bù chi phí
      nạp.</div>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Câu ba, với hai mươi bản ghi, cách A mất hai phần nghìn giây, còn cách B
      vẫn mất ít nhất hai giây chỉ để nạp. Vậy khi chỉ cần ít bản ghi, cách A thắng.
      Nạp trước chỉ có lợi khi số lần đọc đủ lớn để bù chi phí nạp, và đó là một quyết
      định người làm nghề phải tính trước.
- id: practice
  kind: practice
  title: 'Tự làm: cài đủ công cụ, chấm bằng tệp kiểm'
  steps:
  - show: '<p><b>Đề</b>: máy của bạn phải có đủ công cụ của khoá.</p>

      <ol><li>Cài Git for Windows, JDK 21, Python 3.11+, rồi <b>mở lại</b> Git Bash.</li>

      <li>Tạo tệp <code>kiem.sh</code> với đúng nội dung ở cảnh trước (chép nguyên).</li>

      <li>Chạy <code>bash kiem.sh</code> trong thư mục chứa tệp: cần <b>sáu dòng ✔</b>.</li></ol>

      <p class="note">Dòng nào báo THIEU: cài công cụ đó, mở lại Git Bash, chạy lại.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm trên máy. Cài công cụ quản lý phiên bản kèm cửa
      sổ lệnh, bộ phát triển Java hai mươi mốt, ngôn ngữ thứ hai của khoá, rồi mở
      lại cửa sổ lệnh. Tạo tệp kiểm với đúng nội dung ở cảnh trước, chạy nó trong
      thư mục chứa tệp, và cần thấy sáu dấu tích. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>✔ bash</div><div>✔
      git</div><div>✔ javac</div><div>✔ java</div><div>✔ python</div><div>✔ sql</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh FND L00 kiem.sh</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> dòng THIEU python: có thể bạn chưa
      đánh dấu “Add to PATH”, hoặc máy mở cửa hàng ứng dụng thay cho Python; cài lại
      từ python.org.

      Dòng THIEU javac: bạn cài bản JRE; hãy cài JDK. Lời giải ở <code>labs/FND/L00/loi_giai.sh</code>;
      chỉ mở sau khi đã thử.</div>

      '
    say: Nếu kẹt, dòng báo thiếu ngôn ngữ thứ hai thường nghĩa là bạn chưa đánh dấu
      ô thêm vào đường dẫn. Cũng có thể máy mở cửa hàng ứng dụng thay cho nó, nên
      hãy cài lại từ địa chỉ chính thức. Dòng báo thiếu trình biên dịch Java nghĩa
      là bạn cài nhầm bản chỉ để chạy, hãy cài bộ phát triển đầy đủ. Lời giải nằm
      trong thư mục thực hành, chỉ mở sau khi đã thử.
    clear: true
  lab: labs/FND/L00
