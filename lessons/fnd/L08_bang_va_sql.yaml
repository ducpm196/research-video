scenes:
- id: hook
  kind: hook
  title: Chuyển tiền cần hai lệnh ghi, và máy sập giữa chừng thì sao?
  steps:
  - show: '<p><b>Chuyển 100 000 đồng: mới trừ ở An, chưa cộng ở Bình</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB ''BEGIN;</div><div><span
      class="cm">&gt; </span>UPDATE tai_khoan SET so_du = so_du - 100000 WHERE ma
      = 1;</div><div><span class="cm">&gt; </span>SELECT SUM(so_du) FROM tai_khoan;</div><div><span
      class="cm">&gt; </span>ROLLBACK;</div><div><span class="cm">&gt; </span>SELECT
      SUM(so_du) FROM tai_khoan;''</div><div>1900000</div><div>2000000</div></div><p>Tổng
      tiền của cả ngân hàng nhỏ này phải luôn là $2\,000\,000$. Ngay giữa hai lệnh,
      nó là $1\,900\,000$: <b>mất $100\,000$ đồng</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, chuyển tiền cần hai lệnh ghi, trừ ở tài khoản này và cộng ở tài
      khoản kia. Ở đây ta mới trừ một trăm nghìn ở tài khoản An, chưa cộng cho Bình,
      và tổng tiền cả ngân hàng nhỏ chỉ còn một triệu chín trăm nghìn, tức mất một
      trăm nghìn đồng. Nếu máy sập đúng lúc này mà không có cơ chế bảo vệ thì tiền
      mất thật. Hôm nay ta học bảng, câu lệnh hỏi bảng, và cơ chế bảo vệ đó.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li><b>Bảng</b> là gì: hàng, cột, khoá chính? Hỏi một bảng bằng <b>SELECT
      … WHERE … GROUP BY …</b> thế nào?</li>

      <li>Sửa và xoá bằng <b>UPDATE, DELETE</b>: vì sao quên <b>WHERE</b> là tai nạn?</li>

      <li><b>Giao dịch</b> (BEGIN … COMMIT/ROLLBACK) bảo vệ việc “hai lệnh hoặc không
      lệnh nào” ra sao?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Bảng là gì, gồm hàng, cột và khoá chính, và
      hỏi một bảng bằng ngôn ngữ SQL thế nào. Sửa và xoá ra sao, và vì sao quên mệnh
      đề điều kiện là tai nạn. Và giao dịch bảo vệ việc hai lệnh hoặc không lệnh nào
      ra sao.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp CSV, lọc, đếm, tổng'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      bảng bằng chữ</td><td>tệp CSV: mỗi dòng một hàng, các cột cách nhau bằng dấu
      phẩy, dòng đầu là tên cột</td></tr><tr><td>② lọc</td><td><code>grep -v</code>,
      <code>cut</code>: giữ hàng hay cột cần dùng</td></tr><tr><td>③ nhóm và đếm</td><td><code>sort
      | uniq -c</code>: gom các dòng giống nhau và đếm</td></tr><tr><td>④ tổng không
      đổi</td><td>tiền chuyển đi bằng tiền nhận về: kiểm bằng cách cộng toàn bộ</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Bảng bằng chữ là tệp bảng, mỗi dòng một hàng, các cột
      cách nhau bằng dấu phẩy. Ta đã lọc hàng và cột bằng các lệnh lọc. Ta đã gom
      các dòng giống nhau rồi đếm. Và ta biết tiền chuyển đi bằng tiền nhận về, nên
      kiểm bằng cách cộng toàn bộ. Hôm nay chính cơ sở dữ liệu làm các việc đó giúp
      ta.
- id: sym
  kind: symbol
  title: 'Giải mã: bảng, hàng, cột, khoá chính và các câu lệnh'
  steps:
  - show: '<table class=''t''><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td><b>cơ
      sở dữ liệu</b></td><td>nơi lưu dữ liệu có tổ chức; ở đây là tệp <code>ngan_hang.db</code>
      do chương trình <b>sqlite</b> quản lý</td></tr><tr><td><b>bảng</b></td><td>như
      một tờ bảng tính: <b>cột</b> có tên và kiểu (<code>INTEGER</code> số nguyên,
      <code>TEXT</code> chữ), <b>hàng</b> là một bản ghi</td></tr><tr><td><b>khoá
      chính</b></td><td><code>PRIMARY KEY</code>: cột <b>không trùng giữa hai hàng</b>,
      dùng để chỉ đúng một hàng (ví dụ mã tài khoản)</td></tr><tr><td><b>NULL</b></td><td>“chưa
      có giá trị” (không phải số $0$, không phải chữ rỗng)</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn thuật ngữ. Cơ sở dữ liệu là nơi lưu dữ liệu có tổ chức,
      ở đây là một tệp do một chương trình nhỏ quản lý. Bảng giống tờ bảng tính, cột
      có tên và kiểu, hàng là một bản ghi. Khoá chính là cột không trùng giữa hai
      hàng, dùng để chỉ đúng một hàng. Và giá trị rỗng nghĩa là chưa có giá trị, không
      phải số không.
  - show: <table class='t'><tr><th>câu lệnh</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>CREATE
      TABLE</code></td><td>tạo bảng</td><td>khai tên bảng, tên và kiểu từng cột</td></tr><tr><td><code>INSERT
      INTO … VALUES</code></td><td>chèn</td><td>thêm hàng</td></tr><tr><td><code>SELECT
      cột FROM bảng WHERE điều_kiện</code></td><td>chọn</td><td>đọc các hàng thoả
      điều kiện</td></tr><tr><td><code>ORDER BY</code> và <code>LIMIT</code></td><td>sắp
      xếp và giới hạn</td><td>sắp theo cột (<code>DESC</code> giảm dần); lấy vài hàng
      đầu</td></tr><tr><td><code>GROUP BY</code> + <code>SUM, COUNT</code></td><td>nhóm
      theo + hàm gộp</td><td>gom hàng cùng giá trị cột nhóm; <code>SUM</code> tổng,
      <code>COUNT</code> đếm</td></tr><tr><td><code>UPDATE … SET … WHERE</code> và
      <code>DELETE FROM … WHERE</code></td><td>sửa và xoá</td><td>đổi hoặc bỏ <b>các
      hàng thoả WHERE</b></td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    clear: true
    say: Bảng thứ hai là các câu lệnh. Lệnh tạo bảng khai tên và kiểu từng cột. Lệnh
      chèn thêm hàng. Lệnh chọn đọc các hàng thoả điều kiện. Sắp xếp theo một cột,
      giảm dần nếu thêm một chữ, và giới hạn lấy vài hàng đầu. Nhóm theo cùng hàm
      gộp gom các hàng cùng giá trị rồi cộng hoặc đếm. Lệnh sửa và lệnh xoá tác động
      lên các hàng thoả mệnh đề điều kiện, và nếu không có mệnh đề đó thì tác động
      lên mọi hàng.
