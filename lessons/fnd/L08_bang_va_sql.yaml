      fill="#1f2937" font-weight="bold">COMMIT: cả hai lệnh có hiệu lực cùng lúc</text><text
      x="1180.0" y="129" font-size="24" text-anchor="middle" fill="#1f2937">(tổng
      tiền luôn 2 000 000)</text><rect x="890" y="200" width="580" height="110" rx="10"
