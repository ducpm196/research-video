      mới chỉ nằm trong bản nháp. Nếu kết thúc bằng lệnh chốt thì cả hai lệnh có hiệu
      lực cùng lúc, tổng tiền luôn là hai triệu. Nếu kết thúc bằng lệnh huỷ, hoặc
      máy sập giữa chừng, thì cả hai bị huỷ như chưa từng chạy. Giao dịch nghĩa là
      tất cả hoặc không gì cả.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ câu hỏi bằng lời tới câu lệnh chọn'
  checks:
  - 200000 - 50000 + 150000 == 300000
  - 700000 - 300000 == 400000
  - -100000 + 400000 == 300000
  - 300000 + 400000 + 300000 == 1000000
  - sum([200000, -50000, 700000, -100000, -300000, 150000, 400000]) == 1000000
  steps:
  - show: '<p><b>Dựng dữ liệu: tệp dung.sql (bảng tai_khoan)</b></p><div class="code"><div>CREATE
      TABLE tai_khoan (</div><div>  ma INTEGER PRIMARY KEY, ten TEXT, so_du INTEGER);</div><div>INSERT
      INTO tai_khoan VALUES</div><div>  (1, ''An'', 500000),</div><div>  (2, ''Binh'',
      1200000),</div><div>  (3, ''Chi'', 300000);</div></div><p><b>Nạp tệp vào cơ
      sở dữ liệu</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>DB=ngan_hang.db</div><div><span class="cm"><span>&#36;</span> </span>sqlite3
      <span>&#36;</span>DB &lt; dung.sql</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ta dựng dữ liệu trước. Tệp lệnh khai bảng tài khoản và chèn ba hàng, rồi
      lệnh đọc tệp đưa vào cơ sở dữ liệu, tạo ra tệp ngân hàng chấm d b. Lệnh này
      im lặng khi thành công, vì không có lỗi nào để báo.
  - show: '<p><b>Câu hỏi: tài khoản nào có số dư trên 400 000, sắp từ lớn xuống nhỏ?</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB
      ''SELECT ten, so_du FROM tai_khoan</div><div><span class="cm">&gt; </span>WHERE
      so_du &gt; 400000 ORDER BY so_du DESC;''</div><div>Binh|1200000</div><div>An|500000</div></div><p><b>Bước
      1.</b> Chọn <b>cột</b> cần xem: <code>SELECT ten, so_du</code>. <b>Bước 2.</b>
      Chỉ ra <b>bảng</b>: <code>FROM tai_khoan</code>. <b>Bước 3.</b> Lọc <b>hàng</b>:
      <code>WHERE so_du &gt; 400000</code>. <b>Bước 4.</b> Sắp xếp: <code>ORDER BY
      so_du DESC</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Câu hỏi là tài khoản nào có số dư trên bốn trăm nghìn, sắp từ lớn xuống nhỏ.
      Bước một, chọn cột cần xem, là tên và số dư. Bước hai, chỉ ra bảng. Bước ba,
      lọc hàng, vì chỉ lấy số dư lớn hơn bốn trăm nghìn. Bước bốn, sắp xếp giảm dần
      theo số dư. Kết quả có hai hàng, Bình một triệu hai trăm nghìn và An năm trăm
      nghìn, còn Chi bị loại vì chỉ ba trăm nghìn.
  - show: '<p><b>Câu hỏi: số dư của từng tài khoản theo sổ giao dịch?</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB
      ''SELECT tk, SUM(so_tien) AS so_du FROM giao_dich</div><div><span class="cm">&gt;
      </span>GROUP BY tk ORDER BY tk;''</div><div>1|300000</div><div>2|400000</div><div>3|300000</div><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB ''SELECT SUM(so_tien)
      FROM giao_dich;''</div><div>1000000</div></div><p>Vì mỗi hàng giao dịch thuộc
      một <code>tk</code>, <b>nhóm</b> theo <code>tk</code> rồi <b>cộng</b> <code>so_tien</code>.
      Kiểm: $300\,000 + 400\,000 + 300\,000 = \hl{1\,000\,000}$ = tổng toàn bảng ✓</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Câu hỏi thứ hai là số dư của từng tài khoản theo sổ giao dịch. Vì mỗi hàng
      giao dịch thuộc về một tài khoản, ta nhóm theo cột tài khoản rồi cộng số tiền.
      Làm thử, ba trăm nghìn cộng bốn trăm nghìn cộng ba trăm nghìn bằng một triệu,
      đúng bằng tổng toàn bảng, nên phép nhóm không bỏ sót hàng nào.
- id: example
  kind: example
  title: 'Ví dụ: sửa, xoá và giao dịch trên cùng cơ sở dữ liệu, năm phép làm'
  checks:
  - 500000 - 100000 == 400000
  - 1200000 + 100000 == 1300000
  - 400000 + 1300000 + 300000 == 2000000
  - 7 - 1 == 6
  - 500000 + 1200000 + 300000 == 2000000
  steps:
  - show: <p><b>① Đọc cả bảng, rồi đọc kèm tên cột (-header)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB 'SELECT *
      FROM tai_khoan;'</div><div>1|An|500000</div><div>2|Binh|1200000</div><div>3|Chi|300000</div><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 -header <span>&#36;</span>DB 'SELECT
      * FROM tai_khoan;'</div><div>ma|ten|so_du</div><div>1|An|500000</div><div>2|Binh|1200000</div><div>3|Chi|300000</div></div><p>Ba
      hàng, ba cột. Cột <code>ma</code> là khoá chính nên không hàng nào trùng mã.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ nhất, đọc cả bảng. Có ba hàng, ba cột. Cờ tiêu đề cho in thêm
      dòng tên cột, tiện cho người đọc. Cột mã là khoá chính nên không có hai hàng
      trùng mã.
  - show: <p><b>② Sửa MỘT hàng bằng WHERE, rồi xoá MỘT giao dịch</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB "UPDATE tai_khoan
      SET ten = 'An Le' WHERE ma = 1;</div><div><span class="cm">&gt; </span>SELECT
      * FROM tai_khoan WHERE ma = 1;"</div><div>1|An Le|500000</div><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB 'DELETE FROM giao_dich WHERE id = 2;</div><div><span
      class="cm">&gt; </span>SELECT COUNT(*) FROM giao_dich;'</div><div>6</div></div><p><code>WHERE
      ma = 1</code> chỉ chạm hàng của An. Xoá <code>id = 2</code> làm số giao dịch
      từ $7$ xuống $6$.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ hai, sửa và xoá đúng một hàng. Mệnh đề điều kiện mã bằng một
      chỉ chạm vào hàng của An, đổi tên thành An Lê. Xoá giao dịch số hai làm số giao
      dịch từ bảy xuống sáu.
  - show: '<p><b>③ Quên WHERE: sửa MỌI hàng (chạy trong giao dịch để huỷ được)</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB
      ''BEGIN;</div><div><span class="cm">&gt; </span>UPDATE tai_khoan SET so_du =
      0;</div><div><span class="cm">&gt; </span>SELECT * FROM tai_khoan;</div><div><span
      class="cm">&gt; </span>ROLLBACK;</div><div><span class="cm">&gt; </span>SELECT
      SUM(so_du) FROM tai_khoan;''</div><div>1|An|0</div><div>2|Binh|0</div><div>3|Chi|0</div><div>2000000</div></div><p>Cả
      ba tài khoản về $0$; <code>ROLLBACK</code> huỷ, tổng trở lại $2\,000\,000$ ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ ba, quên mệnh đề điều kiện. Lệnh sửa đưa số dư của cả ba tài
      khoản về không. Ta chạy trong một giao dịch nên lệnh huỷ đưa mọi thứ về như
      cũ, và tổng lại là hai triệu. Ngoài giao dịch thì không còn đường quay lại.
  - show: '<p><b>④ Giao dịch dở dang: mất tiền trong nháp, ROLLBACK trả lại</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB
      ''BEGIN;</div><div><span class="cm">&gt; </span>UPDATE tai_khoan SET so_du =
      so_du - 100000 WHERE ma = 1;</div><div><span class="cm">&gt; </span>SELECT SUM(so_du)
      FROM tai_khoan;</div><div><span class="cm">&gt; </span>ROLLBACK;</div><div><span
      class="cm">&gt; </span>SELECT SUM(so_du) FROM tai_khoan;''</div><div>1900000</div><div>2000000</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép làm thứ tư, giao dịch dở dang. Sau lệnh trừ, tổng tiền trong nháp là
      một triệu chín trăm nghìn, nhưng giao dịch chưa chốt. Lệnh huỷ đưa tổng trở
      lại hai triệu, như chưa có gì xảy ra.
  - show: <p><b>⑤ Hai lệnh trong một giao dịch rồi COMMIT</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB 'BEGIN;</div><div><span
      class="cm">&gt; </span>UPDATE tai_khoan SET so_du = so_du - 100000 WHERE ma
      = 1;</div><div><span class="cm">&gt; </span>UPDATE tai_khoan SET so_du = so_du
      + 100000 WHERE ma = 2;</div><div><span class="cm">&gt; </span>COMMIT;'</div><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB 'SELECT *
      FROM tai_khoan;</div><div><span class="cm">&gt; </span>SELECT SUM(so_du) FROM
      tai_khoan;'</div><div>1|An|400000</div><div>2|Binh|1300000</div><div>3|Chi|300000</div><div>2000000</div></div><p>An
      $500\,000 - 100\,000 = \hl{400\,000}$; Bình $1\,200\,000 + 100\,000 = \hl{1\,300\,000}$;
      tổng vẫn $2\,000\,000$ ✓</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ năm, hai lệnh trong một giao dịch rồi chốt. An còn bốn trăm
      nghìn, Bình có một triệu ba trăm nghìn, Chi giữ nguyên, và tổng vẫn là hai triệu.
      Hai lệnh có hiệu lực cùng lúc, hoặc cả hai không có hiệu lực.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tổng hai cách và đếm hai cách'
  checks:
  - 300000 + 400000 + 300000 == 1000000
  - 7 // 2 == 3
  - 7 / 2.0 == 3.5
  steps:
  - show: '<p><b>Cách 1: tổng theo nhóm</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB ''SELECT tk, SUM(so_tien) AS so_du FROM
      giao_dich</div><div><span class="cm">&gt; </span>GROUP BY tk ORDER BY tk;''</div><div>1|300000</div><div>2|400000</div><div>3|300000</div><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB ''SELECT SUM(so_tien)
      FROM giao_dich;''</div><div>1000000</div></div><p>Cộng ba nhóm: $300\,000 +
      400\,000 + 300\,000 = 1\,000\,000$.</p><p>Cách 2: một câu lệnh cộng cả bảng
      cho $1\,000\,000$ (đã in ở trên). Hai đường độc lập cùng ra một số ✓</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Đường kiểm khác, tính tổng bằng hai cách. Cách một cộng ba nhóm, ra một triệu.
      Cách hai dùng một câu lệnh cộng cả bảng, cũng ra một triệu. Hai đường độc lập
      cùng ra một số, nên ta tin kết quả nhóm.
  - show: '<p><b>Kiểm NULL: so sánh bằng không bao giờ đúng với NULL</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sqlite3 <span>&#36;</span>DB ''SELECT COUNT(*)
      FROM tai_khoan WHERE so_du = NULL;''</div><div>0</div><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB ''SELECT COUNT(*) FROM tai_khoan WHERE so_du
      IS NULL;''</div><div>1</div><div><span class="cm"><span>&#36;</span> </span>sqlite3
      <span>&#36;</span>DB ''SELECT 7 / 2, 7 / 2.0;''</div><div>3|3.5</div></div><p>$7
      / 2 = 3$ (chia số nguyên), $7 / 2.0 = 3{,}5$: kiểu của số quyết định kết quả;
      tiền nên lưu <b>số nguyên theo đồng</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Kiểm thêm giá trị rỗng. Dấu bằng với giá trị rỗng không bao giờ đúng, nên
      đếm ra không. Phải dùng cụm là giá trị rỗng, thì đếm ra một. Và bảy chia hai
      ra ba vì chia số nguyên, còn bảy chia hai chấm không ra ba rưỡi. Vì vậy tiền
      nên lưu bằng số nguyên theo đồng.
- id: scale
  kind: example
  title: 'Khi bảng nhân lên: quét cả bảng hay tra theo chỉ mục'
  checks:
  - 10000 * 7 == 70000
  - 100 * 7 == 700
  - __import__('math').ceil(__import__('math').log2(7)) == 3
  - __import__('math').ceil(__import__('math').log2(700)) == 10
  - __import__('math').ceil(__import__('math').log2(70000)) == 17
  steps:
  - show: <p><b>Một bảng 70 000 hàng, tra một hàng theo id</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>(echo id,v; seq 1 70000 | sed 's/.*/&amp;,&amp;/')
      &gt; big.csv</div><div><span class="cm"><span>&#36;</span> </span>sqlite3 big.db
      '.import --csv big.csv g'</div><div><span class="cm"><span>&#36;</span> </span>sqlite3
      big.db 'SELECT COUNT(*) FROM g;'</div><div>70000</div><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 big.db 'SELECT v FROM g WHERE id = 54321;'</div><div>54321</div></div><p>Lệnh
      tạo bảng 70 000 hàng từ tệp CSV rồi tra <code>id = 54321</code>. Không có chỉ
      mục thì cơ sở dữ liệu phải <b>xem lần lượt từng hàng</b>.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Ta nạp một tệp bảng bảy mươi nghìn hàng vào cơ sở dữ liệu rồi tra một hàng
      theo mã. Nếu bảng không có chỉ mục, tức một cái mục lục, thì cơ sở dữ liệu phải
      xem lần lượt từng hàng cho tới khi gặp hàng cần tìm.
  - show: '<table class=''t''><tr><th>số hàng</th><th>không chỉ mục: xem tối đa</th><th>có
      chỉ mục (tìm nhị phân): xem tối đa</th></tr><tr><td>×1: 7</td><td>7 hàng</td><td>3
      bước</td></tr><tr><td>×100: 700</td><td>700 hàng</td><td>10 bước</td></tr><tr><td>×10
      000: 70 000</td><td>70 000 hàng</td><td>17 bước</td></tr></table><div class=''box
      key''><b>Đánh đổi:</b> chỉ mục làm <b>đọc nhanh</b> nhưng làm <b>ghi chậm hơn</b>
      và tốn thêm chỗ, vì mỗi lần ghi phải cập nhật cả mục lục. Khoá chính tự có chỉ
      mục. Số liệu là ước tính theo công thức (không đo thời gian).</div>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Bảng này là số hàng phải xem trong trường hợp xấu nhất. Bảy hàng thì xem
      bảy hàng hoặc ba bước. Bảy trăm hàng, bảy trăm hàng hoặc mười bước. Bảy mươi
      nghìn hàng, bảy mươi nghìn hàng hoặc mười bảy bước. Chênh lệch tăng nhanh theo
      kích thước bảng. Chỉ mục làm đọc nhanh nhưng làm ghi chậm hơn và tốn thêm chỗ,
      vì mỗi lần ghi phải cập nhật cả mục lục. Khoá chính tự có chỉ mục. Các số này
      là ước tính theo công thức, không đo thời gian.
    clear: true
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên <code>WHERE</code>
      trong <code>UPDATE</code> hoặc <code>DELETE</code>: tác động lên <b>mọi</b>
      hàng.</div><div class="code"><div><span class="cm"><span>&#36;</span> </span>sqlite3
      <span>&#36;</span>DB ''BEGIN;</div><div><span class="cm">&gt; </span>UPDATE
      tai_khoan SET so_du = 0;</div><div><span class="cm">&gt; </span>SELECT * FROM
      tai_khoan;</div><div><span class="cm">&gt; </span>ROLLBACK;</div><div><span
      class="cm">&gt; </span>SELECT SUM(so_du) FROM tai_khoan;''</div><div>1|An|0</div><div>2|Binh|0</div><div>3|Chi|0</div><div>2000000</div></div><p>Phép
      thử: viết <b>SELECT</b> với cùng <code>WHERE</code> trước để đếm số hàng; chạy
      trong giao dịch và xem kết quả rồi mới chốt.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là quên mệnh đề điều kiện trong lệnh sửa hoặc
      lệnh xoá, nên tác động lên mọi hàng. Phép thử là viết lệnh chọn với cùng mệnh
      đề đó trước để đếm số hàng. Rồi chạy trong giao dịch, xem kết quả, và chỉ chốt
      khi đúng.
  - show: <div class="box warn"><b>Lỗi 2 (người mới).</b> So sánh với NULL bằng dấu
      <code>=</code>.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB 'SELECT COUNT(*) FROM tai_khoan WHERE so_du
      = NULL;'</div><div>0</div><div><span class="cm"><span>&#36;</span> </span>sqlite3
      <span>&#36;</span>DB 'SELECT COUNT(*) FROM tai_khoan WHERE so_du IS NULL;'</div><div>1</div></div><p>NULL
      nghĩa là “không biết”; “không biết = không biết” cũng không biết, nên cho kết
      quả <b>không đúng</b>. Dùng <code>IS NULL</code>. Hàm <code>SUM</code> bỏ qua
      NULL.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là so sánh với giá trị rỗng bằng dấu bằng.
      Giá trị rỗng nghĩa là không biết, và không biết bằng không biết cũng là không
      biết, nên kết quả không đúng. Hãy dùng cụm là giá trị rỗng. Hàm cộng bỏ qua
      các giá trị rỗng, nên một cột có chỗ rỗng cho tổng thấp hơn bạn nghĩ.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Chuyển tiền bằng hai
      lệnh rời nhau, không giao dịch.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB 'BEGIN;</div><div><span class="cm">&gt;
      </span>UPDATE tai_khoan SET so_du = so_du - 100000 WHERE ma = 1;</div><div><span
      class="cm">&gt; </span>SELECT SUM(so_du) FROM tai_khoan;</div><div><span class="cm">&gt;
      </span>ROLLBACK;</div><div><span class="cm">&gt; </span>SELECT SUM(so_du) FROM
      tai_khoan;'</div><div>1900000</div><div>2000000</div></div><p>Giữa hai lệnh,
      lỗi mạng hay máy sập làm tiền biến mất. <b>Bất biến</b> “tổng không đổi” chỉ
      giữ được khi hai lệnh nằm <b>trong một giao dịch</b>.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là chuyển tiền bằng hai lệnh rời nhau,
      không có giao dịch. Giữa hai lệnh, lỗi mạng hay máy sập làm tiền biến mất, và
      tổng tiền sai mà không ai báo lỗi. Quy tắc tổng không đổi chỉ giữ được khi hai
      lệnh nằm trong một giao dịch. Người làm nghề luôn kiểm tổng sau mỗi thao tác
      chuyển tiền.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '[700000, -300000][0] == 700000'
  - '[1, 1, 1, 2, 2, 3, 3].count(1) == 3'
  steps:
  - show: '<p><b>Dùng lại dữ liệu của bài (tệp dung.sql): bảng giao_dich</b></p><div
      class="code"><div>CREATE TABLE giao_dich (</div><div>  id INTEGER PRIMARY KEY,
      tk INTEGER, so_tien INTEGER);</div><div>INSERT INTO giao_dich VALUES</div><div>  (1,
      1, 200000), (2, 1, -50000), (3, 2, 700000), (4, 3, -100000),</div></div><p><b>Đề.</b>
      (1) Viết SELECT cho <b>tổng tiền nạp</b> (số dương) của tài khoản $2$. (2) Viết
      SELECT cho tài khoản có <b>nhiều giao dịch nhất</b> kèm số giao dịch. (3) <b>Chọn</b>:
      chuyển $100\,000$ từ An sang Bình bằng hai UPDATE: có cần giao dịch không, vì
      sao?</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 90
    clear: true
    say: Bây giờ tới phần bạn tự làm, trên bảng giao dịch của bài. Câu một, viết lệnh
      chọn tổng tiền nạp, tức số dương, của tài khoản hai. Câu hai, viết lệnh chọn
      tài khoản có nhiều giao dịch nhất, kèm số giao dịch. Câu ba là một quyết định,
      chuyển một trăm nghìn từ An sang Bình bằng hai lệnh sửa thì có cần giao dịch
      không, và vì sao. Hãy dừng video và làm.
  - show: '<p><b>Máy chạy thật</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB ''SELECT SUM(so_tien) FROM giao_dich WHERE
      tk = 2 AND so_tien &gt; 0;''</div><div>700000</div><div><span class="cm"><span>&#36;</span>
      </span>sqlite3 <span>&#36;</span>DB ''SELECT tk, COUNT(*) AS n FROM giao_dich
      GROUP BY tk ORDER BY n DESC LIMIT 1;''</div><div>1|3</div></div><table class=''t''><tr><th>câu</th><th>câu
      lệnh</th><th>kết quả và lý do</th></tr><tr><td>1</td><td><code>SELECT SUM(so_tien)
      FROM giao_dich WHERE tk = 2 AND so_tien &gt; 0;</code></td><td>$700\,000$: chỉ
      giao dịch nạp của tk 2 (id 3); id 5 âm bị loại</td></tr><tr><td>2</td><td><code>SELECT
      tk, COUNT(*) AS n FROM giao_dich GROUP BY tk ORDER BY n DESC LIMIT 1;</code></td><td><code>1|3</code>:
      tk 1 có $3$ giao dịch, nhiều nhất</td></tr></table>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đáp án, máy chạy thật cho đúng hai kết quả. Câu một, chỉ giao dịch nạp của
      tài khoản hai là số ba, bảy trăm nghìn, còn giao dịch âm bị loại bởi điều kiện
      số dương. Câu hai, nhóm theo tài khoản, đếm, sắp giảm dần và lấy một hàng, ra
      tài khoản một có ba giao dịch.
  - show: '<div class=''box key''><b>Quyết định:</b> <b>có</b>, bắt buộc dùng giao
      dịch: hai UPDATE phải <b>cùng có hiệu lực hoặc cùng không</b>. Sau <code>COMMIT</code>
      kiểm bất biến: tổng số dư vẫn $2\,000\,000$. Không giao dịch thì lỗi giữa chừng
      làm mất $100\,000$ (bước ④ của ví dụ).</div>'
    clear: true
    say: Về quyết định, có, bắt buộc dùng giao dịch, vì hai lệnh sửa phải cùng có
      hiệu lực hoặc cùng không. Sau khi chốt, hãy kiểm quy tắc tổng số dư vẫn là hai
      triệu. Không có giao dịch thì lỗi giữa chừng làm mất một trăm nghìn, như ở phép
      làm thứ tư.
- id: practice
  kind: practice
  title: 'Tự làm: tạo bảng, chèn dữ liệu và in số dư theo tài khoản'
  steps:
  - show: '<p><b>Đề</b>: viết <code>so_du.sql</code> (một tệp SQL), gồm theo thứ tự:</p>

      <ol><li><code>CREATE TABLE giao_dich</code> với ba cột <code>id</code> (khoá
      chính), <code>tk</code>, <code>so_tien</code> (cả ba <code>INTEGER</code>);</li>

      <li><code>INSERT</code> 8 hàng: <code>(1,1,800000) (2,2,-120000) (3,3,450000)
      (4,1,300000) (5,2,500000) (6,3,-50000) (7,1,-100000) (8,2,70000)</code>;</li>

      <li><code>SELECT</code> số dư từng tài khoản, sắp theo <code>tk</code>; rồi
      <code>SELECT ''tong'', SUM(so_tien)</code>; rồi <code>SELECT ''am'', COUNT(*)</code>
      số giao dịch âm.</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 300
    say: Bây giờ tới phần bạn tự làm. Việc đầu tiên là viết một tệp chứa các câu lệnh
      SQL. Một, tạo bảng giao dịch với ba cột số nguyên, trong đó cột mã là khoá chính.
      Hai, chèn tám hàng theo danh sách trong đề. Ba, in số dư từng tài khoản sắp
      theo tài khoản, rồi in một dòng có chữ tổng kèm tổng toàn bảng, rồi một dòng
      có chữ âm kèm số giao dịch âm. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>1|1000000</div><div>2|450000</div><div>3|400000</div><div>tong|1850000</div><div>am|3</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh FND L08 so_du.sql</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>SELECT tk, SUM(so_tien) FROM
      giao_dich GROUP BY tk ORDER BY tk;</code>. Dòng tổng: <code>SELECT ''tong'',
      SUM(so_tien) FROM giao_dich;</code>.

      Dòng âm: thêm <code>WHERE so_tien &lt; 0</code> và <code>COUNT(*)</code>. Chấm
      bằng máy: <code>sqlite3</code> chạy tệp, hoặc Python (<code>labs/sqlrun.py</code>).
      Lời giải ở <code>labs/FND/L08/loi_giai.sql</code>.</div>

      '
    say: Nếu kẹt, số dư từng tài khoản là lệnh chọn tài khoản và tổng, nhóm theo tài
      khoản, sắp theo tài khoản. Dòng tổng chọn một chữ cố định kèm tổng toàn bảng.
      Dòng âm thêm điều kiện số tiền nhỏ hơn không và đếm. Lời giải nằm trong thư
      mục thực hành, chỉ mở sau khi đã thử.
    clear: true
  lab: labs/FND/L08
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>bảng: cột có kiểu, hàng, khoá chính</span><span
      class=''a''>→</span><span class=''n''>SELECT cột FROM bảng WHERE hàng ORDER
      BY</span><span class=''a''>→</span><span class=''n''>GROUP BY + SUM, COUNT</span><span
      class=''a''>→</span><span class=''n''>UPDATE, DELETE luôn kèm WHERE</span><span
      class=''a''>→</span><span class=''n''>NULL: dùng IS NULL</span><span class=''a''>→</span><span
      class=''n''>giao dịch: BEGIN … COMMIT hoặc ROLLBACK</span></div>'
    say: Tổng kết chuỗi logic. Bảng có cột có kiểu, hàng và khoá chính. Lệnh chọn
      gồm cột, bảng, điều kiện và sắp xếp. Nhóm theo cùng tổng hoặc đếm. Sửa và xoá
      luôn kèm mệnh đề điều kiện. Giá trị rỗng phải dùng cụm là giá trị rỗng. Và giao
      dịch bắt đầu, rồi chốt hoặc huỷ, để hai lệnh cùng có hiệu lực hoặc cùng không.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi sửa dữ liệu, hỏi “bao nhiêu
      hàng?” bằng một SELECT cùng WHERE; sau khi sửa, kiểm một <b>bất biến</b> (tổng
      tiền) bằng một câu lệnh thứ hai.</div>

      <p>Bài sau: ghi lại lịch sử thay đổi của chính các tệp mã bằng quản lý phiên
      bản, để mọi thao tác đều quay lại được.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, trước khi sửa dữ liệu, hãy hỏi bao nhiêu hàng bằng một
      lệnh chọn cùng điều kiện. Sau khi sửa, kiểm một quy tắc bất biến, như tổng tiền,
      bằng một câu lệnh thứ hai. Bài sau, ta học ghi lại lịch sử thay đổi của chính
      các tệp mã bằng quản lý phiên bản, để mọi thao tác đều quay lại được.
    clear: true
