source: 'curriculum/fnd.yaml L08; audit/fnd/verify_fnd.py L08 (chương trình dòng lệnh
  sqlite3, thay bằng audit/fnd/shim/sqlite3 trên máy kiểm chưa cài sqlite3: mô-đun
  sqlite3 của Python, cùng định dạng mặc định, cùng lõi SQLite); lab chạy qua labs/sqlrun.py;
  SQLite docs: Datatypes In SQLite, NULL Handling in SQLite, Transaction (BEGIN/COMMIT/ROLLBACK),
  The SQLite Query Optimizer Overview (chỉ mục, quét bảng); ISO/IEC 9075 (SQL); Codd
  1970 (mô hình quan hệ); số bước tìm nhị phân là ⌈log2 n⌉, ước tính theo công thức'
assumes: []
objectives:
- Nêu bảng, hàng, cột, khoá chính và NULL là gì
- Viết lệnh SELECT với WHERE, ORDER BY, GROUP BY để trả lời một câu hỏi về dữ liệu
- Dùng UPDATE, DELETE đúng một hàng bằng WHERE và nêu hậu quả khi quên WHERE
- Dùng giao dịch BEGIN, COMMIT, ROLLBACK để hai lệnh cùng có hiệu lực hoặc cùng không
- Kiểm một kết quả nhóm bằng tổng toàn bảng
- So sánh số hàng phải xem khi có và không có chỉ mục khi bảng nhân lên
- 'Chỉ ra ba lỗi hay gặp: quên WHERE, so sánh bằng với NULL, chuyển tiền không giao
  dịch'
- Viết tệp SQL tạo bảng, chèn dữ liệu và in số dư theo tài khoản
