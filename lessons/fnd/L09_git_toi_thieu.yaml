      vào bản chính. Nếu không hài lòng, bỏ nhánh đi cũng không mất gì ở bản chính.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: một tệp đi từ sửa tới lịch sử, qua ba vùng'
  checks:
  - len('??') == 2
  - ''' M so_du.txt''.index(''M'') == 1'
  - '''A  so_du.txt''.index(''A'') == 0'
  steps:
  - show: '<p><b>Bước 1. Tệp mới: chưa ở vùng nào mà công cụ theo dõi</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>echo ''so du: 100''
      &gt; so_du.txt</div><div><span class="cm"><span>&#36;</span> </span>git status
      -s</div><div>?? so_du.txt</div></div><p>Vì mới tạo và chưa add nên mã <code>??</code>:
      “chưa theo dõi”.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, tệp mới tạo. Vì chưa thêm vào vùng chờ nên mã trạng thái là hai
      chấm hỏi, nghĩa là công cụ chưa theo dõi tệp này.
  - show: '<p><b>Bước 2. add: đưa vào vùng chờ</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>git add so_du.txt</div><div><span class="cm"><span>&#36;</span>
      </span>git status -s</div><div>A  so_du.txt</div></div><p>Nên mã đổi thành <code>A
      </code>: đã add, chờ chốt.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước hai, thêm vào vùng chờ. Nên mã đổi thành chữ A: đã thêm, đang chờ chốt.'
