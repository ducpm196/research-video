- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>sửa → add → commit: ba vùng</span><span
      class=''a''>→</span><span class=''n''>status -s: ?? A  M</span><span class=''a''>→</span><span
      class=''n''>log, diff: xem lịch sử và khác biệt</span><span class=''a''>→</span><span
      class=''n''>nhánh: thử không phá bản chính, rồi gộp</span><span class=''a''>→</span><span
      class=''n''>chốt nhỏ một ý: tìm lỗi bằng chia đôi</span><span class=''a''>→</span><span
      class=''n''>bí mật đã chốt: thu hồi, không chỉ xoá</span></div>'
    say: Tổng kết chuỗi logic. Sửa, thêm vào vùng chờ, rồi chốt, qua ba vùng. Lệnh
      trạng thái ngắn có các mã hai chấm hỏi, chữ A và chữ M. Lệnh lịch sử và lệnh
      khác biệt cho xem quá khứ. Nhánh cho thử nghiệm không phá bản chính, rồi gộp
      lại. Chốt nhỏ, mỗi lần một ý, để tìm lỗi bằng chia đôi. Và bí mật đã chốt phải
      được thu hồi, không chỉ xoá.
  - show: '<div class=''box key''><b>Tư duy:</b> mỗi lần chốt là một câu chuyện nhỏ
      có lời nhắn rõ; trước khi chốt, đọc <code>git status -s</code>; không bao giờ
      chốt thứ mà bạn không muốn lộ.</div>

