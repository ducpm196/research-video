    say: Bây giờ tới phần bạn tự làm. Trong một kho, tệp a đã chốt rồi bạn sửa tiếp,
      chưa thêm. Tệp b mới tạo và đã thêm. Tệp c mới tạo, chưa thêm. Câu một, lệnh
