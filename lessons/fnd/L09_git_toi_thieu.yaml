  - show: <p><b>Máy chạy thật</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>git status -s</div><div> M a.txt</div><div>A  b.txt</div><div>?? c.txt</div></div><table
      class='t'><tr><th>câu</th><th>đáp án</th><th>lý do</th></tr><tr><td>1</td><td><code>
      M a.txt</code>, <code>A  b.txt</code>, <code>?? c.txt</code></td><td>sửa chưa
