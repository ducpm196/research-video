- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm số lần chốt hai cách, và hết thay đổi hai cách'
  checks:
  - len(['a', 'b', 'c']) == 3
  steps:
  - show: '<p><b>Hai cách đếm số lần chốt</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>git rev-list --count HEAD</div><div>3</div><div><span class="cm"><span>&#36;</span>
      </span>git log --format=%s | wc -l</div><div>3</div></div><p>Cách 1: lệnh đếm
      riêng. Cách 2: đếm số dòng của lịch sử. Cả hai ra $3$, khớp với ba lần chốt
      đã làm ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm khác, đếm số lần chốt bằng hai cách. Cách một dùng lệnh đếm riêng.
      Cách hai đếm số dòng của lịch sử bằng ống. Cả hai ra ba, và khớp với ba lần
      chốt ta đã làm, vì mỗi lần chốt chỉ ghi một dòng lịch sử.
  - show: '<p><b>Kiểm không còn thay đổi dang dở</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>git status -s</div></div><p>Trạng thái
      ngắn trống, nghĩa là vùng làm việc và vùng chờ <b>khớp</b> với lần chốt mới
      nhất. Muốn chắc hơn: <code>git diff</code> cũng trống.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Kiểm thêm là không còn thay đổi dang dở. Lệnh trạng thái ngắn trống nghĩa
      là vùng làm việc và vùng chờ khớp với lần chốt mới nhất. Lệnh xem khác biệt
      cũng trống cho cùng kết luận.
- id: scale
  kind: example
  title: 'Khi lịch sử dài ra: tìm lần chốt gây lỗi bằng chia đôi'
  checks:
  - 2 ** 3 == 8
  - 2 ** 10 >= 1000 > 2 ** 9
  - 2 ** 17 >= 100000 > 2 ** 16
  - 1000 // 8 == 125
  - 100000 // 8 == 12500
  steps:
  - show: '<p>Một lỗi mới xuất hiện, biết rằng <b>bản chốt cũ</b> còn tốt và <b>bản
      chốt mới</b> đã hỏng. Thử bản ở <b>giữa</b>: tốt thì lỗi nằm nửa sau, hỏng thì
      nằm nửa trước. Mỗi lần thử <b>loại một nửa</b>.</p>

      $$2^{t} \ge n \;\Rightarrow\; t = \text{số lần thử tối đa}$$

      <p class="note">$n$ là số lần chốt giữa bản tốt và bản hỏng; sau $t$ lần chia
      đôi chỉ còn $1$ ứng viên. Công cụ tự làm việc này (<code>git bisect</code>).</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Giả sử một lỗi mới xuất hiện, biết bản chốt cũ còn tốt và bản chốt mới đã
      hỏng. Ta thử bản ở giữa. Nếu tốt thì lỗi nằm nửa sau, nếu hỏng thì nằm nửa trước,
      nên mỗi lần thử loại bỏ một nửa. Gọi t là số lần thử tối đa, thì hai mũ t phải
      lớn hơn hoặc bằng n, vì sau t lần chia đôi chỉ còn một ứng viên. Ở đây n là
      số lần chốt giữa bản tốt và bản hỏng. Công cụ có sẵn lệnh làm việc này.
    introduces:
    - implies
  - show: '<table class=''t''><tr><th>số lần chốt n</th><th>tính</th><th>thử tối đa</th></tr><tr><td>×1:
      8</td><td>$2^{3} = 8$</td><td><b>3</b></td></tr><tr><td>×125: 1 000</td><td>$2^{10}
      = 1\,024 \ge 1\,000$</td><td><b>10</b></td></tr><tr><td>×12 500: 100 000</td><td>$2^{17}
      = 131\,072 \ge 100\,000$</td><td><b>17</b></td></tr></table><div class=''box
      key''><b>Đánh đổi:</b> chia đôi chỉ chỉ ra <b>một lần chốt</b>. Nếu lần chốt
      đó gom 50 thay đổi không liên quan thì ta vẫn phải gỡ từng cái. Chốt <b>nhỏ,
      một ý</b> làm cho kết quả tìm kiếm chính là nguyên nhân. Đổi lại, phải kỷ luật
      viết lời nhắn rõ.</div>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Bảng này cho thấy sức mạnh của chia đôi. Tám lần chốt thì thử tối đa ba lần.
      Một nghìn lần chốt thì mười lần. Một trăm nghìn lần chốt thì mười bảy lần. Số
      lần thử tăng rất chậm so với kích thước lịch sử. Nhưng chia đôi chỉ chỉ ra một
      lần chốt. Nếu lần chốt đó gom năm mươi thay đổi không liên quan thì ta vẫn phải
      gỡ từng cái. Vì vậy chốt nhỏ, mỗi lần một ý, làm cho kết quả tìm kiếm chính
      là nguyên nhân.
    clear: true
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Sửa tệp rồi <code>commit</code>
      mà quên <code>add</code>: lần chốt <b>trống</b>.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo x &gt;&gt; a.txt</div><div><span class="cm"><span>&#36;</span>
      </span>git commit -q -m ''quen add'' &gt; /dev/null; echo "ma thoat: <span>&#36;</span>?"</div><div>ma
      thoat: 1</div></div><p>Mã thoát $1$: không có gì trong vùng chờ nên không chốt
      được. Phép thử: chạy <code>git status -s</code> trước mỗi lần chốt; dòng bắt
      đầu bằng khoảng trắng rồi <code>M</code> là chưa add.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là sửa tệp rồi chốt mà quên thêm vào vùng chờ.
      Lần chốt trống, với mã thoát là một. Phép thử là chạy lệnh trạng thái ngắn trước
      mỗi lần chốt. Dòng bắt đầu bằng khoảng trắng rồi chữ M nghĩa là chưa thêm.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Tệp rác và tệp nhật ký
      lẫn vào kho.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo ''*.log'' &gt; .gitignore</div><div><span class="cm"><span>&#36;</span>
      </span>touch a.log</div><div><span class="cm"><span>&#36;</span> </span>git
      status -s</div><div> M a.txt</div><div>?? .gitignore</div></div><p><code>.gitignore</code>
      liệt kê mẫu cần bỏ qua: <code>a.log</code> không còn hiện trong trạng thái.
      Chính <code>.gitignore</code> thì nên được chốt.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là tệp rác và tệp nhật ký lẫn vào kho. Tệp
      loại trừ liệt kê các mẫu cần bỏ qua, và tệp nhật ký không còn hiện trong trạng
      thái. Chính tệp loại trừ thì nên được chốt cùng kho.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Chốt nhầm bí mật
      (mật khẩu, khoá), rồi nghĩ xoá tệp là xong.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>echo ''mat_khau=abc123'' &gt; .env</div><div><span
      class="cm"><span>&#36;</span> </span>git add .env</div><div><span class="cm"><span>&#36;</span>
      </span>git commit -q -m ''them cau hinh''</div><div><span class="cm"><span>&#36;</span>
      </span>git rm -q .env</div><div><span class="cm"><span>&#36;</span> </span>git
      commit -q -m ''xoa env''</div><div><span class="cm"><span>&#36;</span> </span>git
      show HEAD~1:.env</div><div>mat_khau=abc123</div></div><p>Lịch sử <b>giữ mọi
      ảnh chụp</b>: dù <code>.env</code> đã bị xoá ở lần chốt sau, lần chốt trước
      vẫn đọc được mật khẩu. Bí mật đã chốt phải được <b>đổi mới</b> (thu hồi), không
      chỉ xoá.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là chốt nhầm bí mật như mật khẩu, rồi
      nghĩ xoá tệp là xong. Lịch sử giữ mọi ảnh chụp. Dù tệp cấu hình đã bị xoá ở
      lần chốt sau, lần chốt trước vẫn đọc được mật khẩu. Bí mật đã chốt phải được
      thu hồi và đổi mới, không chỉ xoá. Kho đã chia sẻ cho người khác thì càng không
      thể coi là xoá được.
