scenes:
- id: hook
  kind: hook
  title: 'Hôm qua chạy đúng, hôm nay hỏng: mình đã sửa gì?'
  steps:
  - show: '<p><b>Công cụ quản lý phiên bản cho thấy đúng dòng đã đổi</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>git diff</div><div>diff --git a/so_du.txt
      b/so_du.txt</div><div>index 7de0592..ad79274 100644</div><div>--- a/so_du.txt</div><div>+++
      b/so_du.txt</div><div>@@ -1 +1 @@</div><div>-so du: 100</div><div>+so du: 150</div></div><p>Dòng
      có <code>-</code> là <b>cũ</b>, dòng có <code>+</code> là <b>mới</b>. Một tệp,
      một dòng đổi: rõ ràng. Sửa 50 tệp mà không ghi lại thì không ai nhớ nổi.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, hôm qua chương trình chạy đúng, hôm nay hỏng, và bạn không nhớ
      đã sửa gì. Công cụ quản lý phiên bản giải quyết đúng chuyện đó. Nó cho thấy
      chính xác dòng nào đã đổi, dòng bắt đầu bằng dấu trừ là cũ, dòng bắt đầu bằng
      dấu cộng là mới. Một tệp một dòng thì rõ ràng, nhưng sửa năm mươi tệp mà không
      ghi lại thì không ai nhớ nổi.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Vòng làm việc <b>sửa → add → commit</b> gồm những vùng nào, và <code>git
      status -s</code> đọc ra sao?</li>

      <li><b>Nhánh</b> (branch) cho phép thử nghiệm mà không phá bản chính thế nào,
      rồi <b>gộp</b> lại ra sao?</li>

      <li>Vì sao nên <b>chốt nhỏ</b>, và vì sao một bí mật đã chốt thì <b>không xoá
      khỏi lịch sử</b> bằng cách xoá tệp?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Vòng làm việc sửa, thêm vào vùng chờ, rồi
      chốt gồm những vùng nào, và lệnh xem trạng thái dạng ngắn đọc ra sao. Nhánh
      cho phép thử nghiệm mà không phá bản chính thế nào, rồi gộp lại ra sao. Và vì
      sao nên chốt nhỏ, cùng vì sao một bí mật đã chốt thì không xoá khỏi lịch sử
      bằng cách xoá tệp.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp, thư mục, chuyển hướng, mã thoát'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      tạo và sửa tệp</td><td><code>echo ''so du: 100'' &gt; so_du.txt</code>: ghi
      đè; <code>&gt;&gt;</code> nối thêm</td></tr><tr><td>② thư mục</td><td><code>mkdir
      kho && cd kho</code>: tạo rồi đi vào</td></tr><tr><td>③ mã thoát</td><td><code><span>&#36;</span>?</code>
      bằng 0 là thành công; <code>-q</code> thường nghĩa là “im lặng”</td></tr><tr><td>④
      tệp ẩn</td><td>tên bắt đầu bằng dấu chấm, xem bằng <code>ls -a</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Tạo và sửa tệp bằng lệnh in chữ với dấu chuyển hướng,
      một dấu để ghi đè, hai dấu để nối thêm. Tạo thư mục rồi đi vào. Mã thoát bằng
      không là thành công, và cờ q thường nghĩa là im lặng. Và tệp ẩn có tên bắt đầu
      bằng dấu chấm, xem bằng cờ a.
- id: sym
  kind: symbol
  title: 'Giải mã: kho, ba vùng, chốt, nhánh và các lệnh'
  steps:
  - show: '<table class=''t''><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td><b>kho</b>
      (repository)</td><td>thư mục có thêm thư mục ẩn <code>.git</code> chứa <b>toàn
      bộ lịch sử</b>; <code>git init</code> tạo kho</td></tr><tr><td><b>vùng làm việc</b></td><td>các
      tệp bạn đang sửa trong thư mục</td></tr><tr><td><b>vùng chờ</b> (staging)</td><td>danh
      sách thay đổi bạn <b>chọn</b> đưa vào lần chốt tới: <code>git add</code></td></tr><tr><td><b>lần
      chốt</b> (commit)</td><td>một <b>bức ảnh chụp</b> các tệp đã chọn, kèm lời nhắn
      và <b>mã băm</b> 40 ký tự (thường viết 7 ký tự đầu)</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn thuật ngữ. Kho là thư mục có thêm một thư mục ẩn chứa
      toàn bộ lịch sử. Vùng làm việc là các tệp bạn đang sửa. Vùng chờ là danh sách
      thay đổi bạn chọn đưa vào lần chốt tới. Lần chốt là một bức ảnh chụp các tệp
      đã chọn, kèm lời nhắn và một mã băm, thường viết bảy ký tự đầu.
  - show: '<table class=''t''><tr><th>lệnh</th><th>nghĩa</th></tr><tr><td><code>git
      add f</code></td><td>đưa thay đổi của <code>f</code> vào vùng chờ</td></tr><tr><td><code>git
      commit -m ''lời nhắn''</code></td><td>chốt vùng chờ thành một bức ảnh; <code>-a</code>
      tự add các tệp đã theo dõi; <code>-q</code> im lặng</td></tr><tr><td><code>git
      status -s</code></td><td>trạng thái ngắn: <code>??</code> mới chưa theo dõi,
      <code>A </code> đã add, <code> M</code> sửa chưa add</td></tr><tr><td><code>git
      diff</code> và <code>git log --format=%s</code></td><td>xem thay đổi chưa add
      và liệt kê lời nhắn các lần chốt, mới nhất trước</td></tr><tr><td><code>git
      branch</code> <code>git switch</code> <code>git merge</code></td><td>tạo hoặc
      liệt kê nhánh và chuyển nhánh và gộp nhánh khác vào nhánh hiện tại</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    clear: true
    say: Bảng thứ hai là các lệnh. Lệnh thêm đưa thay đổi vào vùng chờ. Lệnh chốt
      biến vùng chờ thành một bức ảnh kèm lời nhắn. Lệnh xem trạng thái dạng ngắn
      đánh dấu hai chấm hỏi là tệp mới, chữ A là đã thêm, chữ M là sửa chưa thêm.
      Lệnh xem khác biệt cho thấy thay đổi chưa thêm, và lệnh xem lịch sử liệt kê
      lời nhắn, mới nhất trước. Cuối cùng là các lệnh về nhánh, tạo, chuyển và gộp.
