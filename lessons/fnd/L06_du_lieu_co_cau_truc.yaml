  lab: labs/FND/L06
- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>CSV: hàng, cột, dấu phẩy</span><span
      class=''a''>→</span><span class=''n''>JSON: { } khoá–giá trị, [ ] mảng từ 0</span><span
      class=''a''>→</span><span class=''n''>YAML: thụt lề, dấu - mở phần tử</span><span
      class=''a''>→</span><span class=''n''>đường đi: khoá → vị trí → khoá</span><span
      class=''a''>→</span><span class=''n''>chạy bộ kiểm cú pháp trước khi gửi</span><span
      class=''a''>→</span><span class=''n''>chọn dạng theo bên nhận và quy mô</span></div>'
    say: Tổng kết chuỗi logic. Bảng có hàng, cột và dấu phẩy. JSON có ngoặc nhọn cho
      cặp khoá và giá trị, ngoặc vuông cho mảng đếm từ không. YAML thụt lề, và dấu
      gạch đầu dòng mở một phần tử. Đường đi tới giá trị sâu là khoá, vị trí, khoá.
      Chạy bộ kiểm cú pháp trước khi gửi, và chọn dạng theo bên nhận và quy mô.
  - show: '<div class=''box key''><b>Tư duy:</b> dữ liệu có cấu trúc là hợp đồng giữa
      người viết và máy đọc: kiểm cú pháp bằng máy, đừng tin mắt; kiểm <b>kiểu</b>
      của giá trị, đừng tin cách nó trông.</div>

      <p>Bài sau: hai chương trình nói chuyện qua mạng bằng HTTP, và bạn sẽ hỏi một
      máy chủ bằng chữ.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, dữ liệu có cấu trúc là hợp đồng giữa người viết và máy
      đọc. Hãy kiểm cú pháp bằng máy, đừng tin mắt, và kiểm kiểu của giá trị, đừng
      tin cách nó trông. Bài sau, ta học hai chương trình nói chuyện qua mạng bằng
      HTTP, và bạn sẽ hỏi một máy chủ bằng chữ.
    clear: true
