  - {sentence: "Lệnh cắt cột lấy một cột khi các cột cách nhau bằng dấu phẩy.", reason: "ASR chép “lệnh các cục lấy 1 cục khi các cục cách nhau bằng dấu phẩy.” (0.714): lệch âm/thanh thuần Việt: cắt cột/các cục, cột/cục, cột/cục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng này là dung lượng đo được.", reason: "ASR chép “Bản này là dung lượng đó được.” (0.714): lệch âm/thanh thuần Việt: bảng/bản, đo/đó — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng có hàng, cột và dấu phẩy.", reason: "ASR chép “Bạn có hàng cột và giấu phỉ.” (0.714): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: bảng/bạn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tệp văn bản là dãy byte đọc ra chữ theo bảng mã.", reason: "ASR chép “Tẹp văn bản là dãy bay đọc ra chữ theo bản mã.” (0.75): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tệp/tẹp, bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lệnh cắt cột thứ hai lấy cột số lượng, và kết quả có cả tên cột.", reason: "ASR chép “Lệnh các cục thứ 2 lấy cục số lượng và kết quả có cả tên cục.” (0.75): lệch âm/thanh thuần Việt: cắt cột/các cục, cột/cục, cột/cục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tệp dùng nháy đơn thay cho nháy kép.", reason: "ASR chép “Tệch dùng nháy đơn thay cho nháy kết.” (0.75): chữ w đọc “vê kép” (luật chung), ASR viết tách chữ; lệch âm/thanh thuần Việt: tệp/tệch — NOT_VERIFIED bằng tai người"}
  - {sentence: "Dạng bảng chỉ có giá trị, còn JSON lặp lại tên khoá ở mỗi bản ghi.", reason: "ASR chép “Giàn bản chỉ có giá trị, còn dây sơn lập lại tên khóa ở mỗi bản kia.” (0.765): lệch âm/thanh thuần Việt: dạng bảng/giàn bản, lặp/lập, ghi/kia — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng này giải mã dạng bảng và JSON.", reason: "ASR chép “Bản này giải mã dạng bản và dây sơn.” (0.778): lệch âm/thanh thuần Việt: bảng/bản, bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Một bản ghi bảng chỉ mười lăm byte, JSON ba mươi chín byte.", reason: "ASR chép “Một bản ghi bản chỉ 15 vai, dây sơn 39 vai.” (0.786): “byte” đọc theo luật lexicon (lexicon_vi.FND.yaml: “bai”), ASR viết “vai”; lệch âm/thanh thuần Việt: bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "YAML thụt lề, và dấu gạch đầu dòng mở một phần tử.", reason: "ASR chép “Giá mô thuộc lề và giấu gạch đầu dòng mở một phần tử.” (0.8): “yaml” đọc theo luật lexicon (lexicon_vi.FND.yaml: “Giam-mồ”), ASR viết “giá mô thuộc” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tệp JSON ra hai, tệp YAML cũng ra hai, nên khớp với mảng có hai phần tử, vì mỗi mặt hàng có đúng một khoá tên.", reason: "ASR chép “Tệp dây sơn tra 2, tệp da mồ cũng tra 2, nên khớp với mảng có 2 phần tử, vì mỗi mặt hàng có đúng 1 khóa tin.” (0.857): “yaml” đọc theo luật lexicon (lexicon_vi.FND.yaml: “Giam-mồ”), ASR viết “da”; lệch âm/thanh thuần Việt: ra/tra, ra/tra, tên/tin — NOT_VERIFIED bằng tai người"}
  - {sentence: "YAML dùng thụt lề thay cho ngoặc, có chú thích, dễ viết tay, nhưng sai một dấu cách là sai nghĩa.", reason: "ASR chép “Gia mồ dùng thuộc lề thay cho hoặc, có chú thích, dễ viết tay, nhưng sai một dấu cách là sai nghĩa.” (0.864): “yaml” đọc theo luật lexicon (lexicon_vi.FND.yaml: “Giam-mồ”), ASR viết “gia”; lệch âm/thanh thuần Việt: thụt/thuộc, ngoặc/hoặc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ba dạng bảng, JSON và YAML khác nhau thế nào, mỗi dạng hợp việc gì.", reason: "ASR chép “Ba dạng bảng, dây sơn và da mộ khác nhau thế nào, mỗi dạng hợp việc gì.” (0.882): “yaml” đọc theo luật lexicon (lexicon_vi.FND.yaml: “Giam-mồ”), ASR viết “da mộ” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ hai, cũng của người mới, là YAML đoán kiểu của giá trị.", reason: "ASR chép “Lỗi thứ hai, cũng của người mới, là da mô đoán kiểu của giá trị.” (0.897): “yaml” đọc theo luật lexicon (lexicon_vi.FND.yaml: “Giam-mồ”), ASR viết “da mô” — NOT_VERIFIED bằng tai người"}
scenes:
- id: hook
  kind: hook
  title: 'Thiếu một dấu phẩy, cả tệp bị từ chối: hai hệ thống nói chuyện bằng chữ'
  steps:
  - show: '<p><b>Máy đối tác nhận tệp JSON thiếu một dấu phẩy</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python -m json.tool loi_phay.json</div><div>Expecting
      '','' delimiter: line 2 column 2 (char 10)</div></div><p><b>Tệp loi_phay.json</b></p><div
      class="code"><div>{"ma": 7</div><div> "khach": "Le Hoa"}</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Chào bạn, hai hệ thống ngân hàng gửi dữ liệu cho nhau bằng tệp chữ. Chỉ cần
      thiếu một dấu phẩy giữa hai khoá, máy nhận từ chối cả tệp, và báo dòng hai,
      cột hai, vị trí thứ mười. Chữ có cấu trúc nghĩa là mỗi dấu đều có nhiệm vụ,
      và hôm nay ta học ba dạng phổ biến nhất.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li><b>CSV, JSON, YAML</b> khác nhau thế nào, và mỗi dạng hợp việc gì?</li>

      <li>Làm sao <b>đọc</b> một giá trị nằm sâu, ví dụ giá của mặt hàng thứ hai trong
      đơn?</li>

      <li>Lỗi cú pháp nào hay gặp, và khi dữ liệu <b>nhân lên</b> thì chọn dạng nào?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Ba dạng bảng, JSON và YAML khác nhau thế nào,
      mỗi dạng hợp việc gì. Làm sao đọc một giá trị nằm sâu, ví dụ giá của mặt hàng
      thứ hai trong đơn. Lỗi cú pháp nào hay gặp, và khi dữ liệu nhân lên thì chọn
      dạng nào.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp văn bản, bảng mã, ống và lọc'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      tệp văn bản UTF-8</td><td>dãy byte đọc ra chữ; mỗi dòng kết thúc bằng ký tự
      xuống dòng</td></tr><tr><td>② cột trong tệp bảng</td><td><code>cut -d, -f2 f</code>
      lấy cột thứ 2 khi các cột cách nhau bằng dấu phẩy</td></tr><tr><td>③ đếm</td><td><code>grep
      -c mẫu f</code> đếm số dòng chứa mẫu</td></tr><tr><td>④ đọc thông báo lỗi</td><td>tệp
      : dòng : cột : mô tả; sửa lỗi đầu tiên trước</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Tệp văn bản là dãy byte đọc ra chữ theo bảng mã. Lệnh
      cắt cột lấy một cột khi các cột cách nhau bằng dấu phẩy. Lệnh tìm có cờ c đếm
      số dòng chứa mẫu. Và thông báo lỗi nói tệp, dòng, cột, mô tả, rồi ta sửa lỗi
      đầu tiên trước.
- id: sym
  kind: symbol
  title: 'Giải mã ba dạng: bảng CSV, JSON và YAML'
  steps:
  - show: '<table class=''t''><tr><th>dạng</th><th>cách viết</th><th>nghĩa</th></tr><tr><td><b>CSV</b></td><td><code>ten,sl,gia</code>
      rồi <code>but,3,5000</code></td><td>bảng bằng chữ: <b>mỗi dòng một hàng</b>,
      cột cách nhau bằng dấu phẩy; dòng đầu thường là <b>tên cột</b></td></tr><tr><td><b>JSON</b></td><td><code>{"ten":
      "but", "sl": 3}</code></td><td><code>{ }</code> là một <b>đối tượng</b> gồm
      cặp <b>khoá: giá trị</b>; khoá luôn trong nháy kép; ngăn cặp bằng dấu phẩy</td></tr><tr><td></td><td><code>[1,
      2, 3]</code></td><td><code>[ ]</code> là một <b>mảng</b>: danh sách có thứ tự,
      vị trí đếm từ <b>0</b></td></tr><tr><td></td><td><code>"abc"  42  true  null</code></td><td>bốn
      kiểu giá trị: chữ (nháy kép), số, đúng/sai viết thường, rỗng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã dạng bảng và JSON. Dạng bảng thì mỗi dòng là một hàng, các
      cột cách nhau bằng dấu phẩy, dòng đầu thường là tên cột. JSON dùng ngoặc nhọn
      cho một đối tượng gồm các cặp khoá và giá trị, khoá luôn nằm trong nháy kép.
      Ngoặc vuông là một mảng, tức danh sách có thứ tự, vị trí đếm từ không. Và giá
      trị có bốn kiểu, chữ trong nháy kép, số, đúng hoặc sai viết thường, và rỗng.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>khoa:
      gia_tri</code></td><td>một cặp khoá và giá trị; <b>có khoảng trắng sau dấu hai
      chấm</b></td></tr><tr><td>thụt lề</td><td>YAML dùng <b>dấu cách</b> đầu dòng
      để lồng nhau (không dùng phím Tab); cùng cấp thì cùng độ thụt</td></tr><tr><td><code>-
      ten: but</code></td><td>dấu gạch đầu dòng bắt đầu <b>một phần tử</b> của danh
      sách</td></tr><tr><td><code># ghi chú</code></td><td>chú thích: máy bỏ qua (JSON
      <b>không</b> có chú thích)</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là YAML, dạng viết cho người đọc. Một cặp khoá và giá trị cách
      nhau bằng dấu hai chấm kèm khoảng trắng. Cấu trúc lồng nhau thể hiện bằng thụt
      lề dấu cách, không dùng phím nhảy cột, cùng cấp thì cùng độ thụt. Dấu gạch đầu
      dòng bắt đầu một phần tử của danh sách. Và dấu thăng bắt đầu chú thích, mà JSON
      không có.
- id: intuition
  kind: intuition
  title: 'Hình dung: cùng một đơn hàng, ba cách viết'
  steps:
  - show: '<div><svg width="1500" height="560" viewBox="0 0 1500 560" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="10" y="10" width="440" height="530" rx="12" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="230.0" y="48" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">CSV: bảng</text><text x="230" y="110" font-size="28"
      text-anchor="middle" fill="#1f2937" font-weight="bold">ten,sl,gia</text><text
      x="230" y="160" font-size="28" text-anchor="middle" fill="#1f2937">but,3,5000</text><text
      x="230" y="210" font-size="28" text-anchor="middle" fill="#1f2937">vo,2,12000</text><text
      x="230" y="300" font-size="24" text-anchor="middle" fill="#16a34a" font-weight="bold">mỗi
      dòng = một hàng</text><text x="230" y="345" font-size="22" text-anchor="middle"
      fill="#1f2937">ngắn gọn, mọi hàng cùng cột</text><text x="230" y="395" font-size="22"
      text-anchor="middle" fill="#dc2626">không có kiểu, không lồng nhau</text><rect
      x="480" y="10" width="520" height="530" rx="12" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="740.0" y="48" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">JSON: máy đọc</text><text x="740" y="100"
      font-size="24" text-anchor="middle" fill="#1f2937">{ "ma": 7,</text><text x="740"
      y="135" font-size="24" text-anchor="middle" fill="#1f2937">"hang": [</text><text
      x="740" y="170" font-size="24" text-anchor="middle" fill="#1f2937">{"ten": "but",
      "sl": 3},</text><text x="740" y="205" font-size="24" text-anchor="middle" fill="#1f2937">{"ten":
      "vo", "sl": 2} ] }</text><text x="740" y="300" font-size="24" text-anchor="middle"
      fill="#2a78d6" font-weight="bold">đối tượng { } và mảng [ ]</text><text x="740"
      y="345" font-size="22" text-anchor="middle" fill="#1f2937">lồng nhau tự do,
      có kiểu</text><text x="740" y="395" font-size="22" text-anchor="middle" fill="#1f2937">mọi
      ngôn ngữ đều có sẵn bộ đọc</text><rect x="1030" y="10" width="460" height="530"
      rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1260.0" y="48"
      font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">YAML:
      người đọc</text><text x="1100" y="100" font-size="24" text-anchor="start" fill="#1f2937">ma:
      7</text><text x="1100" y="135" font-size="24" text-anchor="start" fill="#1f2937">hang:</text><text
      x="1140" y="170" font-size="24" text-anchor="start" fill="#1f2937">- ten: but</text><text
      x="1163" y="205" font-size="24" text-anchor="start" fill="#1f2937">sl: 3</text><text
      x="1260" y="300" font-size="24" text-anchor="middle" fill="#d97706" font-weight="bold">thụt
      lề thay ngoặc</text><text x="1260" y="345" font-size="22" text-anchor="middle"
      fill="#1f2937">có chú thích, dễ viết tay</text><text x="1260" y="395" font-size="22"
      text-anchor="middle" fill="#dc2626">sai một dấu cách là sai nghĩa</text></svg></div>'
    clear: true
    say: Hình này là cùng một đơn hàng viết ba cách. Dạng bảng chỉ có hàng và cột,
      ngắn gọn, nhưng không có kiểu và không lồng nhau được. JSON dùng ngoặc nhọn
      và ngoặc vuông, lồng nhau tự do, và mọi ngôn ngữ lập trình đều có sẵn bộ đọc.
      YAML dùng thụt lề thay cho ngoặc, có chú thích, dễ viết tay, nhưng sai một dấu
      cách là sai nghĩa. Ba dạng chứa cùng thông tin, chỉ khác cách trình bày.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: đường đi tới một giá trị nằm sâu'
  checks:
  - 2 - 1 == 1
  - '__import__(''json'').loads(''{"hang": [{"gia": 5000}, {"gia": 12000}]}'')[''hang''][1][''gia'']
    == 12000'
  steps:
  - show: '<p><b>Tệp don.json</b></p><div class="code"><div>{</div><div>  "ma": 7,</div><div>  "khach":
      "Le Hoa",</div><div>  "hang": [</div><div>    {"ten": "but", "sl": 3, "gia":
      5000},</div><div>    {"ten": "vo", "sl": 2, "gia": 12000}</div><div>  ],</div><div>  "da_tra":
      true</div><div>}</div></div><p><b>Bước 1.</b> Muốn giá của <b>mặt hàng thứ hai</b>.
      Vì ngoài cùng là đối tượng <code>{ }</code>, đi vào bằng <b>tên khoá</b>: <code>hang</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, muốn giá của mặt hàng thứ hai trong đơn. Vì ngoài cùng là một đối
