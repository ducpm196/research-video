source: 'curriculum/fnd.yaml L06; audit/fnd/verify_fnd.py L06 (Git Bash + Python:
  json.tool, json.load, cut, sed, wc chạy thật); RFC 8259 (JSON); RFC 4180 (CSV);
  YAML 1.2 specification (yaml.org); Python docs: json (json.tool), PyYAML safe_load
  (YAML 1.1: no → false; dùng trong checks, không hiện trên màn hình); dung lượng
  15/39, 1 592/3 992, 178 894/418 894 byte đo bằng verify_fnd'
assumes: []
objectives:
- Đọc cùng một đơn hàng ở ba dạng CSV, JSON, YAML và chỉ ra hàng, cột, khoá, giá trị,
  mảng
- 'Tính đường đi tới một giá trị nằm sâu: khoá, vị trí đếm từ 0, khoá'
- 'Kiểm một giá trị bằng hai đường: đếm khoá và nạp vào bộ đọc'
- So sánh dung lượng CSV và JSON khi số bản ghi nhân lên rồi chọn dạng
- 'Chỉ ra ba lỗi hay gặp: JSON khắt khe, YAML đoán kiểu, cắt cột CSV khi ô có dấu
  phẩy'
- Viết tay một tệp JSON hợp lệ và đọc các giá trị trong một tệp YAML
asr_reviewed:
