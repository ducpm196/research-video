      và <b>cách xuống dòng</b>.</div>'
    clear: true
    say: Về quyết định, với mười triệu bản ghi đồng dạng, nên chọn dạng bảng, hoặc
      JSON mỗi dòng một bản ghi rồi nén, vì chênh khoảng hai phẩy ba lần dung lượng.
      Chọn JSON khi bản ghi lồng nhau hoặc bên nhận cần tự hiểu cấu trúc. Dù chọn
      gì, hãy thoả thuận trước bảng mã và cách xuống dòng.
- id: practice
  kind: practice
  title: 'Tự làm: viết tay một tệp JSON và đọc một tệp YAML'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>doc_ghi.sh</code>.</p>

      <ol><li>Bằng <code>cat &gt; don.json &lt;&lt;''EOF''</code>, <b>viết tay</b>
      JSON đơn <code>21</code>, khách <code>Tran Mai</code>, đã trả <code>false</code>,
      3 mặt hàng: <code>ao</code> 4 × 90000, <code>non</code> 1 × 45000, <code>tat</code>
      6 × 8000.</li>

      <li>Tạo <code>doc.py</code> (chép từ <code>de.md</code>) rồi <code>python doc.py</code>:
      in <b>số mặt hàng</b> và <b>tổng tiền</b>.</li>

      <li>Đọc YAML trong <code>de.md</code>, in bốn số: cổng máy chủ; số tên miền;
      tổng hai cổng; số lần thử lại.</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 300
    say: Bây giờ tới phần bạn tự làm. Tạo một tệp lệnh. Viết tay một tệp JSON cho
      đơn hai mươi mốt, khách Trần Mai, chưa trả. Có ba mặt hàng, áo bốn cái giá chín
      mươi nghìn, nón một cái giá bốn mươi lăm nghìn, tất sáu đôi giá tám nghìn. Rồi
      tạo tệp đọc theo đề và chạy, in số mặt hàng và tổng tiền. Cuối cùng đọc một
      tệp YAML trong đề và in bốn con số. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>3 453000</div><div>8080</div><div>2</div><div>13512</div><div>3</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh FND L06 doc_ghi.sh</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> JSON: ngoặc nhọn ngoài; <code>"hang"</code>
      là mảng <code>[ ]</code> chứa ba đối tượng, khoá trong nháy kép, ngăn bằng dấu
      phẩy, <b>không</b> có dấu phẩy sau phần tử cuối; <code>false</code> viết thường.

      Tổng tiền $= 4 \times 90000 + 45000 + 6 \times 8000 = 453000$. Lời giải ở <code>labs/FND/L06/loi_giai.sh</code>.</div>

      '
    say: Nếu kẹt, JSON có ngoặc nhọn ngoài cùng, khoá hàng là một mảng chứa ba đối
      tượng. Khoá nằm trong nháy kép, các cặp ngăn bằng dấu phẩy, và không có dấu
      phẩy sau phần tử cuối. Giá trị sai viết thường. Tổng tiền là bốn nhân chín mươi
      nghìn, cộng bốn mươi lăm nghìn, cộng sáu nhân tám nghìn, bằng bốn trăm năm mươi
      ba nghìn. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã thử.
