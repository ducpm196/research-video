- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: JSON và YAML là cùng dữ liệu, đếm theo hai cách'
  checks:
  - "__import__('json').loads(\"\"\"{\n  \"ma\": 7,\n  \"khach\": \"Le Hoa\",\n  \"\
    hang\": [\n    {\"ten\": \"but\", \"sl\": 3, \"gia\": 5000},\n    {\"ten\": \"\
    vo\", \"sl\": 2, \"gia\": 12000}\n  ],\n  \"da_tra\": true\n}\n\"\"\") == __import__('yaml').safe_load(\"\
    \"\"ma: 7\nkhach: Le Hoa\nhang:\n  - ten: but\n    sl: 3\n    gia: 5000\n  - ten:\
    \ vo\n    sl: 2\n    gia: 12000\nda_tra: true\n\"\"\")"
  - "__import__('json').loads(\"\"\"{\n  \"ma\": 7,\n  \"khach\": \"Le Hoa\",\n  \"\
    hang\": [\n    {\"ten\": \"but\", \"sl\": 3, \"gia\": 5000},\n    {\"ten\": \"\
    vo\", \"sl\": 2, \"gia\": 12000}\n  ],\n  \"da_tra\": true\n}\n\"\"\")['hang'].__len__()\
    \ == 2"
  steps:
  - show: <p><b>Đếm số mặt hàng bằng cách đếm khoá ten trong mỗi tệp</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>grep -c '"ten"' don.json</div><div>2</div><div><span
      class="cm"><span>&#36;</span> </span>grep -c 'ten:' don.yaml</div><div>2</div></div><p>Hai
      tệp, hai cách viết, cùng đếm ra $2$ mặt hàng. Khớp với mảng có $2$ phần tử ✓</p>
    focus:
    - 1
    - 2
    clear: true
    say: Đường kiểm khác là đếm số mặt hàng bằng cách đếm khoá tên trong từng tệp.
      Tệp JSON ra hai, tệp YAML cũng ra hai, nên khớp với mảng có hai phần tử, vì
      mỗi mặt hàng có đúng một khoá tên.
  - show: '<p>Kiểm cuối: JSON và YAML ở trên <b>cùng một dữ liệu</b>. Nạp cả hai vào
      bộ đọc rồi so sánh, kết quả là <b>bằng nhau</b> ✓</p>

      <p class="note">Hai cách viết khác nhau, nghĩa như nhau: chọn dạng theo người
      đọc và theo bên nhận, không theo nội dung.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Kiểm cuối, nạp cả hai tệp vào bộ đọc rồi so sánh, kết quả là bằng nhau. Hai
      cách viết khác nhau nhưng nghĩa như nhau. Vì vậy ta chọn dạng theo người đọc
      và theo bên nhận, không theo nội dung.
    clear: true
