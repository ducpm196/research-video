  - show: '<p><b>③ Python: lỗi nằm ở dòng CUỐI của thông báo</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>python loi.py 2&gt;&amp;1 | tail -n 1</div><div>NameError:
      name ''sodu_moi'' is not defined</div><div><span class="cm"><span>&#36;</span>
      </span>python loi.py 2&gt;&amp;1 | grep -o ''line [0-9]*''</div><div>line 2</div></div><p
      class=''note'' style=''color:#111827''>Số dòng nằm ở dòng phía trên, dạng <code>File
