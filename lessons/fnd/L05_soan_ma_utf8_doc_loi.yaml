- id: formula
  kind: formula
  title: 'Suy ra từng bước: một chữ cần mấy byte trong UTF-8'
  checks:
  - 2 ** 3 == 2 * 2 * 2 == 8
  - len(chr(259).encode('utf-8')) == 2
  - chr(259).encode('utf-8').hex() == 'c483'
  - 128 <= 259 <= 2047
  - 0b11000100 == 196 and 0b10000011 == 131 and 196 == 0xc4 and 131 == 0x83
  - bin(259)[2:] == '100000011'
  - 2 ** 8 + 2 ** 1 + 2 ** 0 == 259
  - bin(259)[2:].zfill(11) == '00100000011' and 5 + 6 == 11
  - '''00100000011''[:5] == ''00100'' and ''00100000011''[5:] == ''000011'''
  - int('110' + '00100', 2) == 0xc4 and int('10' + '000011', 2) == 0x83
  - int('1100', 2) == 12 == 0xc and int('0100', 2) == 4 and int('1000', 2) == 8 and
    int('0011', 2) == 3 and 0xc4 == 196 and 0x83 == 131
  - len('Nguyen'.encode('utf-8')) == 6
  - len('Nguyễn'.encode('utf-8')) == 8
  - len(chr(0x1ec5).encode('utf-8')) == 3 and 0x1ec5 == 7877 and chr(0x1ec5).encode('utf-8').hex()
    == 'e1bb85' and 'Nguyễn'[4] == chr(0x1ec5)
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi ký tự có một <b>số thứ tự</b> $N$. UTF-8 chọn số
      byte theo độ lớn của $N$:</p>

      <table class=''t''><tr><th>khoảng của $N$</th><th>số byte</th><th>khuôn bit</th></tr>

      <tr><td>$0 .. 127$</td><td>1</td><td><code>0xxxxxxx</code></td></tr>

      <tr><td>$128 .. 2\,047$</td><td>2</td><td><code>110xxxxx 10xxxxxx</code></td></tr>

      <tr><td>$2\,048 .. 65\,535$</td><td>3</td><td><code>1110xxxx 10xxxxxx 10xxxxxx</code></td></tr>

      <tr><td>$65\,536 .. 1\,114\,111$</td><td>4</td><td><code>11110xxx 10xxxxxx 10xxxxxx
      10xxxxxx</code></td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bước một, mỗi ký tự có một số thứ tự. Bảng mã chọn số byte theo độ lớn của
      số đó. Từ không tới một trăm hai mươi bảy thì một byte. Từ một trăm hai mươi
      tám tới hai nghìn không trăm bốn mươi bảy thì hai byte. Từ hai nghìn không trăm
      bốn mươi tám tới sáu mươi lăm nghìn năm trăm ba mươi lăm thì ba byte, và số
      lớn hơn nữa dùng bốn byte, bài này không cần tới. Mỗi byte có một khuôn bit
      riêng, các chữ x là chỗ điền bit của số.
  - show: '<p><b>Bước 2. Làm thử với chữ ă</b> ($N = 259$). Vì $128 \le 259 \le 2\,047$,
      nên dùng <b>2 byte</b>.</p>

      <p><b>Đổi 259 sang nhị phân</b> (hệ đếm chỉ có chữ số $0$ và $1$; mỗi vị trí
      là một <b>lũy thừa</b> của $2$: $2$ nhân với chính nó vài lần, ví dụ $2^{3}
      = 2 \times 2 \times 2 = 8$):</p>

      $$259 = 256 + 2 + 1 = 2^{8} + 2^{1} + 2^{0} \;\to\; \hl{100000011}$$

      <p class="note" style=''color:#111827''>9 chữ số: một số $1$, sáu số $0$, rồi
      hai số $1$.</p>

      '
    focus:
    - 1
    - 2
    - 3
    say: 'Bước hai, làm thử với chữ a có dấu trăng, số thứ tự hai trăm năm mươi chín,
      nằm trong khoảng hai byte. Ta đổi nó sang hệ nhị phân, hệ đếm chỉ có chữ số
      không và một, mỗi vị trí là một lũy thừa của hai, ví dụ hai mũ ba là hai nhân
      hai nhân hai, bằng tám. Hai trăm năm mươi chín bằng hai mũ tám cộng hai mũ một
      cộng hai mũ không, nên viết thành chín chữ số: một số một, sáu số không, rồi
      hai số một.'
    clear: true
  - show: '<p>Khuôn 2 byte có $5 + 6 = 11$ chỗ để điền bit, nên thêm hai số $0$ đứng
      đầu cho đủ $11$ bit, rồi cắt thành $5$ bit và $6$ bit, điền vào các chữ $x$:</p>

      $$100000011 \;\to\; 00100000011 \;\to\; 00100\ \ 000011 \;\Rightarrow\; 110\mathbf{00100}\
      \ 10\mathbf{000011}$$

      <p class="note" style=''color:#111827''>Vì <b>vị trí của bit</b> quyết định
      giá trị, thêm số $0$ đứng đầu không đổi số $259$.</p>

      '
    focus:
    - 1
    - 2
    - 3
    introduces:
    - implies
    say: Khuôn hai byte có năm cộng sáu, tức mười một chỗ để điền bit. Nên ta thêm
      hai số không đứng đầu cho đủ mười một bit, rồi cắt thành năm bit và sáu bit,
      điền vào các chữ x của khuôn. Thêm số không đứng đầu không làm đổi giá trị,
      vì vị trí của bit mới quyết định giá trị.
    clear: true
  - show: '<p>Đổi mỗi byte sang hệ thập lục phân. Vì mỗi chữ số của hệ $16$ ứng với
      đúng $4$ bit, ta cắt byte thành hai nhóm $4$ bit, mỗi nhóm là một chữ số ($a
      = 10$, $b = 11$, $c = 12$, $d = 13$, $e = 14$, $f = 15$):</p>

      $$1100\ 0100 = \text{c}\ 4 \qquad 1000\ 0011 = 8\ 3 \;\Rightarrow\; \hl{c4\
      83}$$

      <p class="note" style=''color:#111827''>$1100 = 12 = \text{c}$, $0100 = 4$,
      $1000 = 8$, $0011 = 3$; hai byte là $196$ và $131$, khớp với lệnh <code>od</code>
      ở đầu bài ✓</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Cuối cùng đổi mỗi byte sang hệ thập lục phân. Mỗi chữ số của hệ mười sáu
      ứng với đúng bốn bit, nên ta cắt mỗi byte thành hai nhóm bốn bit, trong đó a
      bằng mười, tiếp tục tới f bằng mười lăm. Nhóm một một không không là mười hai,
      viết là c, nhóm không một không không là bốn, còn byte hai gồm tám và ba. Ta
      được c bốn và tám ba, khớp với lệnh in byte ở đầu bài.
  - show: '<p><b>Bước 3. Chữ có hai dấu</b> như ễ ($N = 7\,877$) lớn hơn $2\,047$,
      nên dùng <b>3 byte</b>: <code>e1 bb 85</code>. Chữ tiếng Việt có dấu vì thế
      nặng hơn chữ không dấu.</p>

      $$\text{“Nguyen”} = 6\ \text{byte} \qquad \text{“Nguyễn”} = 5 + 3 = 8\ \text{byte}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, chữ có hai dấu như chữ ê ngã, có số thứ tự bảy nghìn tám trăm bảy
      mươi bảy, lớn hơn hai nghìn không trăm bốn mươi bảy, nên dùng ba byte. Vì vậy
      chữ tiếng Việt có dấu nặng hơn chữ không dấu. Tên không dấu có sáu byte, còn
      tên có dấu có tám byte, vì năm chữ một byte cộng một chữ ba byte.
    clear: true
- id: example
  kind: example
  title: 'Ví dụ: đọc bốn thông báo lỗi thật và sửa một lỗi'
  checks:
  - 'len(''Chao.java:3: error:''.split('':'')) == 4'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã Java</th><th>đọc là</th></tr><tr><td
