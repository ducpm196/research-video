- id: practice
  kind: practice
  title: 'Tự làm: sửa ba tệp hỏng bằng cách đọc lỗi'
  steps:
  - show: '<p><b>Đề</b>: tạo <code>sua.sh</code>. Chép nguyên đoạn dựng ba tệp hỏng
      (xem <code>de.md</code>: <code>Tong.java</code>, <code>tinh.py</code>, <code>chao.sh</code>).
      Rồi:</p>

      <ol><li>chạy từng tệp một lần để <b>đọc</b> thông báo lỗi (tệp, dòng, loại),
      <b>bắt buộc</b> thêm <code>&gt; /dev/null</code> sau mỗi lệnh để bỏ phần in
      ra: chỉ còn thấy lỗi;</li>

      <li>sửa mỗi tệp đúng chỗ (gợi ý: <code>sed -i ''s/cũ/mới/'' tệp</code> thay
      chữ trong tệp);</li>

      <li>chạy lại cả ba: biên dịch và chạy <code>Tong</code>, <code>python tinh.py</code>,
      <code>bash chao.sh</code>.</li></ol>

      <p class="note" style=''color:#111827''>Bước 1 chỉ để xem lỗi nên phải thêm
      <code>&gt; /dev/null</code>: dòng <code>bat dau</code> của <code>chao.sh</code>
      chạy trước chỗ hỏng, nếu in ra sẽ lẫn vào kết quả chấm. Thông báo lỗi nằm ở
      luồng lỗi, không tính vào kết quả chấm.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 240
    say: Bây giờ tới phần bạn tự làm. Tạo một tệp lệnh, chép nguyên đoạn dựng ba tệp
      hỏng. Chạy từng tệp một lần và đọc thông báo lỗi, tìm tệp, dòng và loại. Ở bước
      này, chuyển phần in ra vào hố đen sau mỗi lệnh, vì dòng in ra sẽ lẫn vào kết
      quả chấm. Sửa mỗi tệp đúng chỗ, có thể dùng lệnh thay chữ trong tệp. Cuối cùng
      chạy lại cả ba, kết quả cần là bốn dòng. Hãy dừng video và làm.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>tong = 350</div><div>thanh
      tien = 120</div><div>bat dau</div><div>xin chao</div></div><p class="note" style=''color:#111827''>Chấm
