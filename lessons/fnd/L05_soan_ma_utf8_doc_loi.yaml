- id: formula
  kind: formula
  title: 'Suy ra từng bước: một chữ cần mấy byte trong UTF-8'
  checks:
  - len(chr(259).encode('utf-8')) == 2
  - chr(259).encode('utf-8').hex() == 'c483'
  - 128 <= 259 <= 2047
  - 0b11000100 == 196 and 0b10000011 == 131 and 196 == 0xc4 and 131 == 0x83
  - bin(259)[2:] == '100000011'
  - len('Nguyen'.encode('utf-8')) == 6
  - len('Nguyễn'.encode('utf-8')) == 8
  - len(chr(0x1ec3).encode('utf-8')) == 3 and 0x1ec3 == 7875
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi ký tự có một <b>số thứ tự</b> $N$. UTF-8 chọn số
      byte theo độ lớn của $N$:</p>

      <table class=''t''><tr><th>khoảng của $N$</th><th>số byte</th><th>khuôn bit</th></tr>

      <tr><td>$0 .. 127$</td><td>1</td><td><code>0xxxxxxx</code></td></tr>

      <tr><td>$128 .. 2\,047$</td><td>2</td><td><code>110xxxxx 10xxxxxx</code></td></tr>

      <tr><td>$2\,048 .. 65\,535$</td><td>3</td><td><code>1110xxxx 10xxxxxx 10xxxxxx</code></td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bước một, mỗi ký tự có một số thứ tự. Bảng mã chọn số byte theo độ lớn của
      số đó. Từ không tới một trăm hai mươi bảy thì một byte. Từ một trăm hai mươi
      tám tới hai nghìn không trăm bốn mươi bảy thì hai byte. Từ hai nghìn không trăm
      bốn mươi tám tới sáu mươi lăm nghìn năm trăm ba mươi lăm thì ba byte. Mỗi byte
      có một khuôn bit riêng, các chữ x là chỗ điền bit của số.
  - show: '<p><b>Bước 2. Làm thử với chữ ă</b> ($N = 259$). Vì $128 \le 259 \le 2\,047$,
      nên dùng <b>2 byte</b>. Đổi ra nhị phân và điền khuôn:</p>

      $$259 \;\to\; 100000011 \;\to\; 00100\ 000011 \;\Rightarrow\; 110\mathbf{00100}\
      10\mathbf{000011} = \hl{c4\ 83}$$

      <p class="note">Nhị phân của 259 là <code>100000011</code>; byte đầu <code>11000100</code>
      = 196 = <code>c4</code>, byte hai <code>10000011</code> = 131 = <code>83</code>
      (hệ thập lục phân): khớp với lệnh <code>od</code> ở đầu bài ✓</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    introduces:
    - implies
    say: Bước hai, làm thử với chữ a có mũ, số thứ tự hai trăm năm mươi chín. Vì hai
      trăm năm mươi chín nằm giữa một trăm hai mươi tám và hai nghìn không trăm bốn
      mươi bảy, nên dùng hai byte. Đổi ra nhị phân được chín bit. Ta chia thành năm
      bit và sáu bit, điền vào khuôn hai byte. Kết quả là một trăm chín mươi sáu và
      một trăm ba mươi mốt, tức c bốn và tám ba, khớp với lệnh in byte ở đầu bài.
    clear: true
  - show: '<p><b>Bước 3. Chữ có hai dấu</b> như ể ($N = 7\,875$) lớn hơn $2\,047$,
      nên dùng <b>3 byte</b>: <code>e1 bb 83</code>. Chữ tiếng Việt có dấu vì thế
      nặng hơn chữ không dấu.</p>

      $$\text{“Nguyen”} = 6\ \text{byte} \qquad \text{“Nguyễn”} = 5 + 3 = 8\ \text{byte}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, chữ có hai dấu như chữ ê hỏi có số thứ tự bảy nghìn tám trăm bảy
      mươi lăm, lớn hơn hai nghìn không trăm bốn mươi bảy, nên dùng ba byte. Vì vậy
      chữ tiếng Việt có dấu nặng hơn chữ không dấu. Tên không dấu có sáu byte, còn
      tên có dấu có tám byte, vì năm chữ một byte cộng một chữ ba byte.
    clear: true
