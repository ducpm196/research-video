- id: sym
  kind: symbol
  title: 'Giải mã: bảng mã, UTF-8, xuống dòng và đọc một thông báo lỗi'
  steps:
  - show: '<table class=''t''><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td><b>bảng
      mã</b></td><td>bảng ghép mỗi ký tự với một số, và cách ghi số đó thành byte;
      <b>Unicode</b> là bảng gán số thứ tự cho mọi ký tự (chữ ă, tức a có dấu trăng,
      là $259$, viết <code>U+0103</code> theo hệ thập lục phân)</td></tr><tr><td><b>UTF-8</b></td><td>bảng
      mã phổ biến nhất: ký tự dùng <b>1 đến 4 byte</b>; chữ không dấu 1 byte, chữ
      tiếng Việt có dấu 2 hoặc 3 byte</td></tr><tr><td><b>xuống dòng</b></td><td>Linux,
      macOS (hệ điều hành hay chạy trên máy chủ): một ký tự <b>LF</b> (<code>\n</code>);
      Windows: hai ký tự <b>CR LF</b> (<code>\r\n</code>)</td></tr><tr><td><b>trình
      soạn mã</b></td><td>chương trình sửa <b>chữ thuần</b> không thêm định dạng:
      Visual Studio Code, Notepad++; <b>không</b> dùng Word</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn thuật ngữ. Bảng mã là bảng ghép mỗi ký tự với một số,
      và cách ghi số đó thành byte, còn bảng ký tự quốc tế gán số thứ tự cho mọi ký
      tự. Bảng mã phổ biến nhất ghi mỗi ký tự bằng một tới bốn byte. Chữ không dấu
      một byte, chữ tiếng Việt có dấu hai hoặc ba byte. Xuống dòng ở các hệ điều hành
      hay chạy trên máy chủ là một ký tự, ở hệ điều hành bạn đang dùng thường là hai
      ký tự. Trình soạn mã sửa chữ thuần, không thêm định dạng.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td style=''white-space:nowrap''><code>od
      -c f</code></td><td>in từng byte của <code>f</code> dạng ký tự (thấy <code>\r</code>,
      <code>\n</code>); <code>od -An -tx1</code>: dạng số thập lục phân</td></tr><tr><td
      style=''white-space:nowrap''><code>cat -A f</code></td><td>in tệp, hiện <b>CR</b>
      là <code>^M</code> và <b>hết dòng</b> là <code>$</code></td></tr><tr><td style=''white-space:nowrap''><code>Tep.java:3:
      error: …</code></td><td><b>tệp : dòng : loại lỗi : mô tả</b>, do <b>trình biên
      dịch</b> in ra (chương trình dịch mã Java thành dạng máy chạy được; chạy nó
      là <b>biên dịch</b>, lệnh <code>javac</code>); dòng sau in lại dòng mã, dấu
      <code>^</code> chỉ chỗ máy bắt đầu thấy lỗi</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bảng thứ hai là ba cách nhìn. Lệnh in từng byte cho thấy ký tự xuống dòng,
      hoặc cho số thập lục phân nếu thêm cờ. Lệnh in tệp có cờ chữ a hoa hiện ký tự
      về đầu dòng là mũ M và hết dòng là dấu đô la. Còn thông báo lỗi có dạng tệp,
      dòng, loại lỗi, mô tả, do trình biên dịch in ra, tức chương trình dịch mã Java
      thành dạng máy chạy được. Dòng kế in lại dòng mã, và dấu mũ chỉ chỗ máy bắt
      đầu thấy lỗi.
    clear: true
