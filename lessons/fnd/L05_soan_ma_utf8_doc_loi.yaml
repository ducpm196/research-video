- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Soạn mã bằng Word, hoặc
      dán từ trang web: dấu nháy <b>cong</b> thay cho dấu nháy thẳng.</div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>javac Quote.java 2&gt;&amp;1 | grep ''error:''</div><div>Quote.java:3:
      error: illegal character: ''\u201c''</div><div>Quote.java:3: error: illegal
      character: ''\u201d''</div><div>Quote.java:3: error: not a statement</div></div><p>Dấu
      nháy cong <code>\u201c</code> không phải dấu nháy của ngôn ngữ; cả một dòng
      thành <b>3 lỗi</b>. Phép thử: dùng trình soạn mã, tắt tự thay thế dấu nháy.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là soạn mã bằng trình soạn văn bản, hoặc dán
      từ trang mạng. Dấu nháy cong thay cho dấu nháy thẳng, và Java báo ký tự không
      hợp lệ, mang mã u hai không không c. Chỉ một dòng nhưng ra ba lỗi. Phép thử
      là dùng trình soạn mã và tắt tính năng tự thay dấu nháy.
  - show: <div class="box warn"><b>Lỗi 2 (người mới).</b> Sửa lỗi ở dòng <b>cuối</b>
      của danh sách, thay vì dòng đầu.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>javac Quote.java 2&gt;&amp;1 | tail -n 1</div><div>3 errors</div></div><p>Ba
      lỗi nhưng chỉ <b>một nguyên nhân</b> (dấu nháy cong). Sửa lỗi đầu rồi <b>biên
      dịch lại</b>; các lỗi sau thường tự hết.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là sửa lỗi ở cuối danh sách. Ba lỗi nhưng
      chỉ một nguyên nhân. Một lỗi đầu có thể làm máy hiểu sai cả những dòng sau,
      nên các lỗi sau thường là hệ quả. Hãy sửa lỗi đầu tiên rồi biên dịch lại, và
      đếm lại số lỗi.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Cho rằng thông báo
      luôn chỉ đúng chỗ sai.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>javac Dong.java</div><div>Dong.java:5: error: reached end of file while
      parsing</div><div>    }</div><div>     ^</div><div>1 error</div></div><p>Thông
      báo cho biết nơi máy <b>phát hiện</b>, không phải nơi bạn <b>gây ra</b>. Dòng
      cuối tệp ở đây chỉ là chỗ Java đọc hết mà vẫn thiếu một ngoặc.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là tin rằng thông báo luôn chỉ đúng chỗ
      sai. Thông báo cho biết nơi máy phát hiện, không phải nơi bạn gây ra. Ở đây
      dòng cuối tệp chỉ là chỗ Java đọc hết mà vẫn thấy thiếu một ngoặc. Người làm
      nghề đọc cả vùng quanh dòng báo, rồi đếm cặp ngoặc, dấu nháy, thụt lề ở phía
      trên.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '''tonng''.replace(''nn'', ''n'') == ''tong'''
  steps:
  - show: '<p><b>Thông báo của Java khi biên dịch Sym.java</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>javac Sym.java</div><div>Sym.java:4: error:
      cannot find symbol</div><div>        System.out.println(tonng);</div><div>                           ^</div><div>  symbol:   variable
      tonng</div><div>  location: class Sym</div><div>1 error</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ tới phần bạn tự làm. Tệp Sym chấm Java có một thông báo lỗi, như
      màn hình đang hiện.
  - show: '<p><b>Tệp Sym.java</b></p><div class="code"><div>public class Sym {</div><div>    public
      static void main(String[] args) {</div><div>        int tong = 1;</div><div>        System.out.println(tonng);</div><div>    }</div><div>}</div></div><p><b>Đề.</b>
      Trả lời: (1) tệp nào, dòng mấy, loại lỗi gì? (2) Tên nào sai và nên sửa thành
      gì? (3) <b>Chọn</b>: nếu trình biên dịch báo 3 lỗi, bạn sửa lỗi nào trước và
      vì sao?</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 60
    clear: true
    say: Câu một, tệp nào, dòng mấy, loại lỗi gì. Câu hai, tên nào sai và nên sửa
      thành gì. Câu ba là một quyết định, nếu trình biên dịch báo ba lỗi thì sửa lỗi
      nào trước và vì sao. Hãy dừng video và làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th><th>lý do</th></tr><tr><td>1</td><td><code>Sym.java</code>,
      dòng thứ <b>4</b>, <code>error</code>: cannot find symbol</td><td>ba mảnh đầu
      của dòng đầu thông báo</td></tr><tr><td>2</td><td><code>tonng</code> → <code>tong</code></td><td>dòng
      <code>symbol: variable tonng</code> nêu tên lạ; tệp có biến <code>tong</code>
      ở dòng thứ ba</td></tr><tr><td>3</td><td>lỗi <b>đầu tiên</b></td><td>các lỗi
      sau thường là hệ quả; sửa xong biên dịch lại và đếm lại</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu một, tệp Sym, dòng bốn, loại lỗi là không tìm thấy ký hiệu, đọc
      từ dòng đầu của thông báo. Câu hai, tên sai có hai chữ n, sửa thành tên có một
      chữ n, vì dòng ký hiệu nêu tên lạ, và tệp có biến tong ở dòng ba. Câu ba, sửa
      lỗi đầu tiên rồi biên dịch lại, vì các lỗi sau thường là hệ quả.
    clear: true
  - show: '<div class="code"><div><span class="cm"><span>&#36;</span> </span>javac
      Quote.java 2&gt;&amp;1 | grep ''error:''</div><div>Quote.java:3: error: illegal
      character: ''\u201c''</div><div>Quote.java:3: error: illegal character: ''\u201d''</div><div>Quote.java:3:
      error: not a statement</div></div><div class=''box key''><b>Quyết định:</b>
      ba lỗi từ <b>một</b> nguyên nhân ở dòng thứ ba. Sửa lỗi đầu (dấu nháy cong thành
      thẳng), biên dịch lại: cả ba cùng hết.</div>'
    focus:
    - 1
    - 2
    clear: true
    say: Về quyết định, ví dụ ba lỗi ở bài trên đều do một nguyên nhân ở dòng ba.
      Sửa lỗi đầu, đổi dấu nháy cong thành dấu nháy thẳng, biên dịch lại, và cả ba
      lỗi cùng hết.
- id: practice
