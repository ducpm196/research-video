- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>chữ → số thứ tự → byte UTF-8 (1,
      2, 3 byte)</span><span class=''a''>→</span><span class=''n''>đọc sai bảng mã
      → ký tự lạ</span><span class=''a''>→</span><span class=''n''>xuống dòng: LF
      hay CR LF</span><span class=''a''>→</span><span class=''n''>lỗi = tệp : dòng
      : loại : mô tả</span><span class=''a''>→</span><span class=''n''>dấu ^ = chỗ
      máy phát hiện</span><span class=''a''>→</span><span class=''n''>sửa lỗi ĐẦU
      rồi biên dịch lại</span></div>'
    say: Tổng kết chuỗi logic. Chữ có số thứ tự, bảng mã ghi số đó thành một, hai
      hoặc ba byte. Đọc sai bảng mã thì ra ký tự lạ. Xuống dòng có thể là một hoặc
      hai ký tự. Thông báo lỗi gồm tệp, dòng, loại, mô tả. Dấu mũ là chỗ máy phát
      hiện. Và hãy sửa lỗi đầu tiên rồi biên dịch lại.
  - show: '<div class=''box key''><b>Tư duy:</b> đọc <b>từ trên xuống</b> chữ đầu
      tiên máy than phiền, mở đúng tệp ở đúng dòng, nhìn cả vùng quanh nó, sửa <b>một</b>
      lỗi, chạy lại.</div>

      <p>Bài sau: dữ liệu có cấu trúc, CSV, JSON và YAML, để máy và người cùng đọc
      được.</p>

      '
