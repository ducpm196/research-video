      Rồi:</p>

      <ol><li>chạy từng tệp một lần, <b>đọc</b> thông báo lỗi (tệp, dòng, loại);</li>

      <li>sửa mỗi tệp đúng chỗ (gợi ý: <code>sed -i ''s/cũ/mới/'' tệp</code> thay
      chữ trong tệp);</li>

      <li>chạy lại cả ba: biên dịch và chạy <code>Tong</code>, <code>python tinh.py</code>,
      <code>bash chao.sh</code>.</li></ol>

      <p class="note">Thông báo lỗi nằm ở luồng lỗi, không tính vào kết quả chấm.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
