    - 1
    - 2
    forward_ref: true
    say: Điều cần mang theo, đọc từ trên xuống chữ đầu tiên máy than phiền, mở đúng
      tệp ở đúng dòng, nhìn cả vùng quanh nó, sửa một lỗi, rồi chạy lại. Bài sau,
      ta học dữ liệu có cấu trúc, gồm các dạng bảng, JSON và YAML, để máy và người
      cùng đọc được.
