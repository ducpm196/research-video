      class="cm"><span>&#36;</span> </span>python loi.py 2&gt;&amp;1 | grep -o ''line
      [0-9]*''</div><div>line 2</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Phép thứ hai, kiểm lại bằng lệnh tìm có đánh số dòng. Dòng ba đúng là dòng
      in chữ, khớp với thông báo. Phép thứ ba, thông báo của ngôn ngữ thứ hai khác
      kiểu. Dòng cuối nói tên lỗi và mô tả, còn số dòng nằm ở dòng đầu của khối. Ở
      đây một tên biến chưa được định nghĩa, ở dòng hai.
  - show: '<p><b>Tệp loi.sh</b></p><div class="code"><div>echo bat dau</div><div>ech
      "xin chao"</div><div>echo het</div></div><p><b>④ Bash: tên tệp, số dòng, tên
      lệnh sai</b></p><div class="code"><div><span class="cm"><span>&#36;</span> </span>bash
      loi.sh</div><div>bat dau</div><div>loi.sh: line 2: ech: command not found</div><div>het</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép thứ tư, thông báo của cửa sổ lệnh. Nó nói tên tệp, số dòng hai, và tên
      lệnh sai là e c h. Điểm đặc biệt là các dòng trước và sau vẫn chạy, nên màn
      hình có cả dòng bắt đầu và dòng hết, và lỗi chỉ là một dòng giữa.
  - show: '<p><b>Tệp Dong.java (thiếu một dấu ngoặc nhọn đóng)</b></p><div class="code"><div>public
      class Dong {</div><div>    public static void main(String[] args) {</div><div>        int
      x = 5;</div><div>        System.out.println("x = " + x);</div><div>    }</div></div><p><b>Java
      báo ở CUỐI tệp</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>javac Dong.java</div><div>Dong.java:5: error: reached end of file while
      parsing</div><div>    }</div><div>     ^</div><div>1 error</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Phép thứ năm, một lỗi có chỗ gây ra khác chỗ báo. Tệp thiếu một dấu ngoặc
      nhọn đóng cho lớp. Java đọc hết tệp mới biết thiếu, nên báo ở dòng cuối. Dấu
      mũ chỉ chỗ máy phát hiện, không phải chỗ bạn quên. Cách sửa là đếm các cặp ngoặc
      từ trên xuống, và thêm dấu đóng cuối tệp.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đoán số byte rồi đếm'
  checks:
  - 2 + 1 == 3
  steps:
  - show: '<p><b>Tệp vi.txt chỉ có một chữ ă và dấu xuống dòng</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>wc -c vi.txt</div><div>3 vi.txt</div></div><p>Đoán:
      $2$ byte cho chữ $+$ $1$ byte xuống dòng $= \hl{3}$ byte. Máy đếm: $3$ ✓. Hai
      đường (tính theo khuôn, đếm bằng máy) cho cùng số.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm khác là đoán số byte rồi để máy đếm. Tệp chỉ có chữ a có mũ và
      dấu xuống dòng. Theo khuôn, chữ này hai byte, cộng một byte xuống dòng là ba
      byte. Máy đếm cũng ra ba, vì vậy phép tính của ta khớp.
  - show: <p><b>Nhìn thấy ký tự vô hình bằng cat -A</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>cat -A crlf.sh</div><div>echo a^M<span>&#36;</span></div><div>^M<span>&#36;</span></div><div>echo
      b^M<span>&#36;</span></div></div><p>Mỗi dòng của tệp kiểu Windows kết thúc bằng
      <code>^M$</code> (CR rồi hết dòng); sau khi bỏ CR bằng <code>tr -d</code> chỉ
      còn <code>$</code> ✓</p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>cat -A lf.sh</div><div>echo a<span>&#36;</span></div><div><span>&#36;</span></div><div>echo
      b<span>&#36;</span></div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Kiểm thêm bằng cách nhìn ký tự vô hình. Tệp viết theo kiểu của hệ điều hành
      bạn đang dùng có mỗi dòng kết thúc bằng mũ M và đô la, nghĩa là có thêm ký tự
