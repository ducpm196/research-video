    say: Bây giờ tới phần bạn tự làm. Tạo một tệp lệnh, chép nguyên đoạn dựng ba tệp
      hỏng. Chạy từng tệp một lần và đọc thông báo lỗi, tìm tệp, dòng và loại. Sửa
      mỗi tệp đúng chỗ, bạn có thể dùng lệnh thay chữ trong tệp. Cuối cùng chạy lại
      cả ba, và kết quả cần là bốn dòng. Thông báo lỗi nằm ở luồng lỗi nên không tính
