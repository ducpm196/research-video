scenes:
- id: hook
  kind: hook
  title: Cùng một tệp, hai chương trình đọc ra hai thứ khác nhau
  steps:
  - show: '<p><b>Chữ ă lưu trên đĩa là hai byte c4 83 (hệ thập lục phân)</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>echo ă | od -An
      -tx1</div><div> c4 83 0a</div></div><p><b>Cùng hai byte ấy, đọc nhầm bảng mã
      khác thì thành</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo ă | iconv -f cp1252 -t utf-8</div><div>Äƒ</div></div><p>Một người
      gõ “ă” trong tệp, người khác mở ra thấy <b>Äƒ</b>: tệp không đổi, chỉ khác <b>bảng
      mã dùng để đọc</b>.</p><p class=''note'' style=''color:#111827''><code>od -An
      -tx1</code> in từng byte; <code>iconv -f cp1252 -t utf-8</code> đọc byte theo
      bảng mã cũ <b>cp1252</b> của Windows Tây Âu rồi ghi ra UTF-8. Hệ <b>thập lục
      phân</b> đếm bằng 16 chữ số (<code>0</code>–<code>9</code>, rồi <code>a</code>–<code>f</code>);
      một byte viết đủ bằng 2 chữ, ví dụ <code>c4</code> là $196$.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    - 5
    clear: true
    say: Chào bạn, hãy nhìn một tệp chỉ chứa chữ a có dấu trăng. Trên đĩa nó là hai
      byte, viết bằng hệ thập lục phân là c bốn và tám ba. Hệ này đếm bằng mười sáu
      chữ số, từ không tới chín rồi a tới f, nên một byte viết đủ bằng hai chữ. Lệnh
      thứ hai đọc hai byte ấy theo một bảng mã cũ dành cho chữ Tây Âu, nên bạn thấy
      hai ký tự lạ. Tệp không đổi, chỉ khác bảng mã dùng để đọc.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Trình soạn mã khác trình soạn văn bản thế nào, và máy <b>lưu chữ</b>
      (UTF-8, xuống dòng) ra sao?</li>

      <li>Một thông báo lỗi nói gì: <b>tệp, dòng, loại lỗi</b> nằm ở đâu?</li>

      <li>Vì sao <b>lỗi đầu tiên</b> mới đáng sửa, còn những lỗi sau thường là hệ
      quả?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Trình soạn mã khác trình soạn văn bản thế
      nào, và máy lưu chữ ra sao. Một thông báo lỗi nói gì, tệp, dòng và loại lỗi
      nằm ở đâu. Và vì sao lỗi đầu tiên mới đáng sửa trước.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp là dãy byte, và lệnh đếm byte'
  checks:
