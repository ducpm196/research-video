- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đoán số byte rồi đếm'
  checks:
  - 2 + 1 == 3
  steps:
  - show: '<p><b>Tệp vi.txt chỉ có một chữ ă và dấu xuống dòng</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>wc -c vi.txt</div><div>3 vi.txt</div></div><p>Đoán:
      $2$ byte cho chữ $+$ $1$ byte xuống dòng $= \hl{3}$ byte. Máy đếm: $3$ ✓. Hai
      đường (tính theo khuôn, đếm bằng máy) cho cùng số.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm khác là đoán số byte rồi để máy đếm. Tệp chỉ có chữ a có dấu trăng
      và dấu xuống dòng. Theo khuôn, chữ này hai byte, cộng một byte xuống dòng là
      ba byte. Máy đếm cũng ra ba, vì vậy phép tính của ta khớp.
  - show: <p><b>Dựng tệp kiểu Windows (printf), rồi nhìn ký tự vô hình bằng cat -A</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>printf 'echo a\r\n\r\necho
      b\r\n' &gt; crlf.sh</div><div><span class="cm"><span>&#36;</span> </span>cat
      -A crlf.sh</div><div>echo a^M<span>&#36;</span></div><div>^M<span>&#36;</span></div><div>echo
      b^M<span>&#36;</span></div></div><p>Mỗi dòng của tệp kiểu Windows kết thúc bằng
      <code>^M$</code> (CR rồi hết dòng). <code>printf</code> in chữ theo khuôn, trong
      khuôn <code>\r\n</code> là CR rồi xuống dòng; <code>&gt; crlf.sh</code> ghi
      kết quả vào tệp.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Kiểm thêm bằng cách nhìn ký tự vô hình. Ta dựng một tệp có ký tự về đầu dòng
      bằng lệnh in theo khuôn, trong đó gạch chéo r gạch chéo n là ký tự đó rồi xuống
      dòng. Mỗi dòng của tệp kiểu hệ điều hành bạn đang dùng kết thúc bằng mũ M và
      đô la.
  - show: <p><b>Bỏ CR bằng tr -d rồi nhìn lại</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>tr -d '\r' &lt; crlf.sh &gt; lf.sh</div><div><span
      class="cm"><span>&#36;</span> </span>cat -A lf.sh</div><div>echo a<span>&#36;</span></div><div><span>&#36;</span></div><div>echo
      b<span>&#36;</span></div></div><p><code>tr -d '\r'</code> xoá mọi ký tự CR;
      <code>&lt; crlf.sh</code> đưa nội dung tệp <code>crlf.sh</code> vào làm chữ
      vào của <code>tr</code>, vì <code>tr</code> không tự mở tệp; <code>&gt; lf.sh</code>
      ghi kết quả ra tệp mới. Còn lại chỉ <code>$</code> ✓</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lệnh xoá ký tự có cờ d xoá mọi ký tự về đầu dòng. Dấu nhỏ hơn đưa nội dung
      tệp cũ vào làm chữ vào của nó, vì lệnh này không tự mở tệp, còn dấu lớn hơn
      ghi kết quả ra tệp mới. Nhìn lại, chỉ còn dấu đô la hết dòng.
- id: scale
  kind: example
  title: 'Khi nhật ký dài ra: một dòng lỗi nằm giữa hàng trăm nghìn dòng'
  checks:
  - 1200 + 1 == 1201
  - 120000 + 1 == 120001
  - 120001 // 1201 == 99
  steps:
  - show: '<p><b>×1: nhật ký 1 201 dòng</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>seq 1 1200 | sed ''s/^/INFO dong /'' &gt; app.log</div><div><span class="cm"><span>&#36;</span>
      </span>echo ''ERROR mat ket noi'' &gt;&gt; app.log</div><div><span class="cm"><span>&#36;</span>
      </span>grep -n ERROR app.log</div><div>1201:ERROR mat ket noi</div></div><p><b>×100:
      nhật ký 120 001 dòng</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>seq 1 120000 | sed ''s/^/INFO dong /'' &gt; big.log</div><div><span class="cm"><span>&#36;</span>
      </span>echo ''ERROR mat ket noi'' &gt;&gt; big.log</div><div><span class="cm"><span>&#36;</span>
      </span>grep -n ERROR big.log</div><div>120001:ERROR mat ket noi</div></div><p
      class=''note'' style=''color:#111827''><code>seq 1 1200</code> in các số từ
      1 tới 1200, mỗi số một dòng; <code>sed ''s/^/INFO dong /''</code> thay chữ trên
      từng dòng theo dạng <code>s/cũ/mới/</code>, mà <code>^</code> là <b>đầu dòng</b>,
      nên nó chèn chữ <code>INFO dong </code> vào đầu mỗi dòng (<code>1</code> thành
      <code>INFO dong 1</code>). <code>&gt;&gt;</code> nối thêm một dòng vào <b>cuối</b>
      tệp (một dấu <code>&gt;</code> thì ghi đè).</p>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Ta tạo hai nhật ký giả bằng lệnh in dãy số nối với lệnh thay chữ, viết theo
      dạng s gạch chéo cũ gạch chéo mới. Một nhật ký có một nghìn hai trăm lẻ một
      dòng, nhật ký kia hơn một trăm hai mươi nghìn dòng, đều có một dòng lỗi nối
      thêm vào cuối bằng hai dấu lớn hơn. Hai kết quả cùng nhanh dù nhật ký sau lớn
      gấp trăm lần.
  - show: '<table class=''t''><tr><th>số dòng</th><th>đọc bằng mắt</th><th>lọc bằng
      lệnh tìm</th></tr><tr><td>×1: 1 201</td><td>cuộn nhiều trang</td><td>ra ngay:
      vị trí 1 201</td></tr><tr><td>×100: 120 001</td><td>không thể</td><td>ra ngay:
      vị trí 120 001</td></tr></table><div class=''box key''><b>Đánh đổi:</b> với
      nhật ký lớn, đừng mở và cuộn: <b>lọc</b> theo từ khoá (<code>grep -n</code>),
      xem cuối (<code>tail</code>), rồi mở đúng quanh dòng đó. Lỗi cuối cùng thường
      gần cuối nhật ký, nhưng <b>nguyên nhân</b> có thể nằm ở dòng trước nó rất xa.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bảng này so hai cách. Đọc bằng mắt thì không thể với nhật ký lớn. Lọc bằng
      lệnh tìm thì luôn ra ngay. Vì vậy với nhật ký lớn, đừng mở và cuộn, hãy lọc
      theo từ khoá, xem phần cuối, rồi mở đúng quanh dòng đó. Lỗi cuối cùng thường
      gần cuối nhật ký, nhưng nguyên nhân có thể nằm ở một dòng trước nó rất xa.
    clear: true
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Soạn mã bằng Word, hoặc
      dán từ trang web: dấu nháy <b>cong</b> thay cho dấu nháy thẳng.</div><p><b>Tệp
      Quote.java (lệnh in dùng dấu nháy cong)</b></p><div class="code"><div>public
      class Quote {</div><div>    public static void main(String[] args) {</div><div>        System.out.println(“Chao”);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ nhất, của người mới, là soạn mã bằng trình soạn văn bản, hoặc dán
      từ trang mạng. Dấu nháy cong thay cho dấu nháy thẳng, như trong tệp đang hiện
      trên màn hình.
  - show: '<div class="code"><div><span class="cm"><span>&#36;</span> </span>javac
      Quote.java 2&gt;&amp;1 | grep ''error:''</div><div>Quote.java:3: error: illegal
      character: ''\u201c''</div><div>Quote.java:3: error: illegal character: ''\u201d''</div><div>Quote.java:3:
      error: not a statement</div></div><p>Dấu nháy cong <code>\u201c</code> không
      phải dấu nháy của ngôn ngữ; cả một dòng thành <b>3 lỗi</b>. Phép thử: dùng trình
      soạn mã, tắt tự thay thế dấu nháy.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Java báo ký tự không hợp lệ, mang mã u hai không một c. Chỉ một dòng nhưng
      ra ba lỗi. Phép thử là dùng trình soạn mã và tắt tính năng tự thay dấu nháy.
  - show: <div class="box warn"><b>Lỗi 2 (người mới).</b> Sửa lỗi ở dòng <b>cuối</b>
      của danh sách, thay vì dòng đầu.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>javac Quote.java 2&gt;&amp;1 | tail -n 1</div><div>3 errors</div></div><p>Ba
      lỗi nhưng chỉ <b>một nguyên nhân</b> (dấu nháy cong). Sửa lỗi đầu rồi <b>biên
      dịch lại</b>; các lỗi sau thường tự hết.</p>
    focus:
    - 1
    - 1
    - 2
