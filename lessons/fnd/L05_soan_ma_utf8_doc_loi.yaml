      ký hơn một trăm hai mươi nghìn dòng, mỗi nhật ký có đúng một dòng lỗi ở cuối.
      Lệnh tìm có đánh số dòng chỉ ra ngay, một nghìn hai trăm lẻ một và một trăm
      hai mươi nghìn lẻ một. Hai kết quả cùng nhanh, dù nhật ký thứ hai lớn gấp một
      trăm lần.
  - show: '<table class=''t''><tr><th>số dòng</th><th>đọc bằng mắt</th><th>lọc bằng
