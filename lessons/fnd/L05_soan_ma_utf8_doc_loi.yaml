  - show: '<p><b>② Kiểm: dòng thứ ba có đúng là dòng println?</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>grep -n println Chao.java</div><div>3:        System.out.println("Chao
      ban")</div></div><p><b>③ Python: lỗi nằm ở dòng CUỐI của thông báo</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>python loi.py 2&gt;&amp;1
