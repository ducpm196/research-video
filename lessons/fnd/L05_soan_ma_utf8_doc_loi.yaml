      nhật ký lớn, đừng mở và cuộn: <b>lọc</b> theo từ khoá (<code>grep -n</code>),
      xem cuối (<code>tail</code>), rồi mở đúng quanh dòng đó. Lỗi cuối cùng thường
      gần cuối nhật ký, nhưng <b>nguyên nhân</b> có thể nằm ở dòng trước nó rất xa.</div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bảng này so hai cách. Đọc bằng mắt thì không thể với nhật ký lớn. Lọc bằng
      lệnh tìm thì luôn ra ngay. Vì vậy với nhật ký lớn, đừng mở và cuộn, hãy lọc
      theo từ khoá, xem phần cuối, rồi mở đúng quanh dòng đó. Lỗi cuối cùng thường
      gần cuối nhật ký, nhưng nguyên nhân có thể nằm ở một dòng trước nó rất xa.
