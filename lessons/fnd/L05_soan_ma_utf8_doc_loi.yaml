scenes:
- id: hook
  kind: hook
  title: Cùng một tệp, hai chương trình đọc ra hai thứ khác nhau
  steps:
  - show: '<p><b>Chữ ă lưu trên đĩa là hai byte c4 83 (hệ thập lục phân)</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>echo ă | od -An
      -tx1</div><div> c4 83 0a</div></div><p><b>Cùng hai byte ấy, đọc nhầm bảng mã
      khác thì thành</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>echo ă | iconv -f cp1252 -t utf-8</div><div>Äƒ</div></div><p>Một người
      gõ “ă” trong tệp, người khác mở ra thấy <b>Äƒ</b>: tệp không đổi, chỉ khác <b>bảng
      mã dùng để đọc</b>.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    - 5
    clear: true
    say: Chào bạn, hãy nhìn một tệp chỉ chứa chữ a có dấu mũ. Trên đĩa nó là hai byte,
      viết bằng hệ thập lục phân là c bốn và tám ba. Nếu một chương trình đọc hai
      byte ấy bằng một bảng mã khác, bạn thấy hai ký tự lạ. Tệp không đổi, chỉ khác
      bảng mã dùng để đọc. Đây là nguồn gốc của rất nhiều lỗi chữ tiếng Việt vỡ, và
      cũng của những thông báo lỗi khó hiểu.
  - show: '<div class="box key">Hôm nay ta trả lời ba câu hỏi:

      <ol><li>Trình soạn mã khác trình soạn văn bản thế nào, và máy <b>lưu chữ</b>
      (UTF-8, xuống dòng) ra sao?</li>

      <li>Một thông báo lỗi nói gì: <b>tệp, dòng, loại lỗi</b> nằm ở đâu?</li>

      <li>Vì sao <b>lỗi đầu tiên</b> mới đáng sửa, còn những lỗi sau thường là hệ
      quả?</li></ol></div>

      '
    say: Hôm nay ta trả lời ba câu hỏi. Trình soạn mã khác trình soạn văn bản thế
      nào, và máy lưu chữ ra sao, gồm bảng mã và cách xuống dòng. Một thông báo lỗi
      nói gì, tệp, dòng và loại lỗi nằm ở đâu. Và vì sao lỗi đầu tiên mới đáng sửa,
      còn những lỗi sau thường là hệ quả.
    clear: true
- id: prereq
  kind: prereq
  title: 'Ôn lại: tệp là dãy byte, và lệnh đếm byte'
  checks:
  - 2 ** 8 - 1 == 255
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại, kèm ví dụ</th></tr><tr><td>①
      byte</td><td>tám bit, một số từ $0$ tới $255$; tệp là một dãy byte</td></tr><tr><td>②
      tệp văn bản</td><td>dãy byte mà một <b>bảng mã</b> đổi thành chữ</td></tr><tr><td>③
      đếm byte</td><td><code>wc -c f</code> cho số byte của tệp <code>f</code></td></tr><tr><td>④
      ống và lọc</td><td><code>A | B</code>, <code>grep</code>, <code>tail</code>,
      <code>head</code> để chọn phần cần đọc</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Một byte là tám bit, một số từ không tới hai trăm năm
      mươi lăm, và tệp là một dãy byte. Tệp văn bản là dãy byte mà một bảng mã đổi
      thành chữ. Lệnh đếm có cờ c cho số byte của tệp. Và ống cùng các lệnh lọc giúp
      chọn phần cần đọc.
- id: sym
  kind: symbol
  title: 'Giải mã: bảng mã, UTF-8, xuống dòng và đọc một thông báo lỗi'
  steps:
  - show: '<table class=''t''><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td><b>bảng
      mã</b></td><td>bảng ghép mỗi ký tự với một số, và cách ghi số đó thành byte</td></tr><tr><td><b>UTF-8</b></td><td>bảng
      mã phổ biến nhất: ký tự dùng <b>1 đến 4 byte</b>; chữ không dấu 1 byte, chữ
      tiếng Việt có dấu 2 hoặc 3 byte</td></tr><tr><td><b>xuống dòng</b></td><td>Linux,
      macOS: một ký tự <b>LF</b> (<code>\n</code>); Windows: hai ký tự <b>CR LF</b>
      (<code>\r\n</code>)</td></tr><tr><td><b>trình soạn mã</b></td><td>chương trình
      sửa <b>chữ thuần</b> không thêm định dạng: Visual Studio Code, Notepad++; <b>không</b>
      dùng Word</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn thuật ngữ. Bảng mã là bảng ghép mỗi ký tự với một số,
      và cách ghi số đó thành byte. Bảng mã phổ biến nhất ghi mỗi ký tự bằng một tới
      bốn byte. Chữ không dấu một byte, chữ tiếng Việt có dấu hai hoặc ba byte. Xuống
      dòng ở một số hệ điều hành là một ký tự, ở hệ điều hành bạn đang dùng thường
      là hai ký tự. Và trình soạn mã sửa chữ thuần, không thêm định dạng, khác hẳn
      trình soạn văn bản.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>od
      -c f</code></td><td>in từng byte của <code>f</code> dạng ký tự (thấy <code>\r</code>,
      <code>\n</code>); <code>od -An -tx1</code>: dạng số thập lục phân</td></tr><tr><td><code>cat
      -A f</code></td><td>in tệp, hiện <b>CR</b> là <code>^M</code> và <b>hết dòng</b>
      là <code>$</code></td></tr><tr><td><code>Tep.java:3: error: …</code></td><td><b>tệp
      : dòng : loại lỗi : mô tả</b>; dòng sau in lại dòng mã, dấu <code>^</code> chỉ
      chỗ máy bắt đầu thấy lỗi</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bảng thứ hai là ba cách nhìn. Lệnh in từng byte cho thấy ký tự xuống dòng,
      hoặc cho số thập lục phân nếu thêm cờ. Lệnh in tệp có cờ chữ a hoa hiện ký tự
      về đầu dòng là mũ M và hết dòng là dấu đô la. Còn thông báo lỗi có dạng tệp,
      dòng, loại lỗi, mô tả. Dòng kế in lại dòng mã, và dấu mũ chỉ chỗ máy bắt đầu
      thấy lỗi.
    clear: true
