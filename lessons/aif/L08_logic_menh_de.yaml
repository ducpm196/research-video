- id: example
  kind: example
  title: Liệt kê 8 mô hình
  checks:
  - 'alg.pl_entails(lambda m: (not m[''P''] or m[''Q'']) and (not m[''Q''] or m[''R'']) and m[''P''], lambda m: m[''R''], [''P'', ''Q'', ''R'']) == (True, 1, 8)'
  steps:
  - show: '<p>KB = { $P \to Q$, $Q \to R$, $P$ }. Có 3 biến → $2^3 = 8$ mô hình. Xét lần lượt:</p>

      <table class="t"><tr><th>P Q R</th><th>$P \to Q$</th><th>$Q \to R$</th><th>$P$</th><th>mô hình của KB?</th></tr>

      <tr><td>đ đ đ</td><td>đ</td><td>đ</td><td>đ</td><td class="green">có</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - 2
    say: Tri thức gồm ba câu, P kéo theo Q, Q kéo theo R, và P, với 3 biến nên có 2 mũ 3 bằng 8 mô hình. Xét mô hình đầu tiên, cả ba biến đều đúng, thì cả ba câu đều đúng, nên đây là một mô hình của tri thức. Với ba biến mệnh đề, không gian đầy đủ tám thế giới đủ nhỏ để dò hết từng dòng xem câu nào trong cơ sở tri thức bị vi phạm.
  - show: '<table class="t"><tr><th>P Q R</th><th>$P \to Q$</th><th>$Q \to R$</th><th>$P$</th><th>mô hình của KB?</th></tr>

      <tr><td>đ đ s</td><td>đ</td><td class="red">s</td><td>đ</td><td>không</td></tr>

      <tr><td>đ s đ / đ s s</td><td class="red">s</td><td>—</td><td>đ</td><td>không</td></tr></table>

      '
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
