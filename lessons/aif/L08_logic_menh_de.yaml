id: L08
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 8 — Lôgic mệnh đề cho tác tử: mô hình, kéo theo lôgic, kiểm mô hình"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L08; audit/aif/verify_aif.py L08; AIMA bản 4 (2020), mục 7.3–7.4 (mô hình, kéo theo lôgic, kiểm mô hình bằng liệt kê); DMS bài 0–1 (phép toán lôgic, bảng chân trị)"
assumes: [arith, power, lnot, land, lor, lto]
# Quy ước: phép toán lôgic theo DMS bài 0–1 (¬, ∧, ∨, kéo theo viết →). ⊨ là kéo theo LÔGIC giữa tri thức (KB) và một câu.
#   alg.pl_entails(kb, câu, tên biến) liệt kê đủ 2^n mô hình; trả (KB ⊨ câu?, số mô hình của KB, tổng số mô hình).
objectives:
  - "Phân biệt mô hình, thoả được và kéo theo lôgic"
  - "Kiểm KB ⊨ α bằng liệt kê mô hình"
  - "Nhận ra lỗi khẳng định hệ quả"
asr_reviewed:
  - {sentence: "Bên trái, vùng xanh dương là các mô hình của tri thức, nằm trọn trong vùng câu alpha đúng, nên tri thức kéo theo alpha.", reason: "ASR chép “Bên trái, vùng xanh dưng là các mô hình của trí thức, nằm trọn trong vùng câu an pha đúng, nên trí thức kéo theo an pha.” (0.769): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: dương/dưng, tri/trí, tri/trí — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu này chỉ sai trong đúng một trường hợp, P đúng mà Q sai.", reason: "ASR chép “Câu này chỉ sai trong đúng một trường hợp về đúng mà quý sai.” (0.929): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tri thức có kéo theo câu không mưa không?", reason: "ASR chép “Trị thức có kéo theo cầu không mưa không?” (0.778): lệch âm/thanh thuần Việt: tri/trị, câu/cầu — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tri thức kéo theo logic câu alpha nếu alpha đúng ở mọi mô hình của tri thức.", reason: "ASR chép “Tri thức kéo theo logic câu α nếu α đúng ở mọi mô hình của tri thức.” (0.882): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Kiểm mô hình nghĩa là liệt kê đủ 2 mũ n mô hình, giữ các mô hình của tri thức, rồi xem alpha có đúng ở tất cả không.", reason: "ASR chép “Kiểm mô hình nghĩa là liệt kê đủ 2 mũ n mô hình, giữa các mô hình của tri thức, rồi xem an pha có đúng ở tất cả không.” (0.915): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: giữ/giữa — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đường ướt, vậy trời đã mưa?"
    checks:
      - "alg.pl_entails(lambda m: (not m['M'] or m['U']) and m['U'], lambda m: m['M'], ['M', 'U']) == (False, 2, 4)"
    steps:
      - show: |
          <p>Tác tử biết: “nếu trời mưa thì đường ướt” và “đường đang ướt”. Nó kết luận “trời đã mưa”. Nghe hợp lý — nhưng có thể có xe tưới nước đi qua. Làm sao một chương trình biết chắc kết luận nào <b>bắt buộc</b> đúng, kết luận nào chỉ <b>có thể</b> đúng?</p>
          <div class="box key">Hôm nay: <b>lôgic mệnh đề</b> cho tác tử — <b>mô hình</b>, <b>kéo theo lôgic</b>, và cách kiểm bằng liệt kê mọi mô hình.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, tác tử biết rằng nếu trời mưa thì đường ướt, và đường đang ướt. Nó kết luận trời đã mưa. Nghe hợp lý, nhưng có thể có xe tưới nước đi qua. Làm sao một chương trình biết chắc kết luận nào bắt buộc đúng, kết luận nào chỉ có thể đúng? Hôm nay ta học logic mệnh đề cho tác tử, với mô hình, kéo theo logic, và cách kiểm bằng liệt kê mọi mô hình."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: bảng chân trị của phép kéo theo"
    checks:
      - "[(not p) or q for p in (True, False) for q in (True, False)] == [True, False, True, True]"
    steps:
      - show: |
          <table class="t"><tr><th>$P$</th><th>$Q$</th><th>$P \to Q$</th></tr>
          <tr><td>đúng</td><td>đúng</td><td>đúng</td></tr>
          <tr><td>đúng</td><td>sai</td><td class="red">sai</td></tr>
          <tr><td>sai</td><td>đúng</td><td>đúng</td></tr>
          <tr><td>sai</td><td>sai</td><td>đúng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Từ khoá toán rời rạc, ta nhớ bảng chân trị của phép kéo theo. Khi P đúng và Q đúng, câu P kéo theo Q đúng. Câu này chỉ sai trong đúng một trường hợp, P đúng mà Q sai. Khi P sai, câu kéo theo luôn đúng, dù Q thế nào. Hai dòng cuối hay gây ngạc nhiên, vì lời hứa nếu thì không bị vi phạm khi điều kiện không xảy ra."

  - id: sym
    kind: symbol
    title: "Giải mã: mô hình, thoả được, kéo theo lôgic"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>mô hình</b></td><td>một cách gán đúng/sai cho mọi biến; $n$ biến có $2^n$ mô hình</td></tr>
          <tr><td><b>mô hình của KB</b></td><td>mô hình làm MỌI câu trong tri thức KB đúng</td></tr>
          <tr><td><b>thoả được</b></td><td>có ít nhất một mô hình làm câu đúng</td></tr>
          <tr><td>$KB \models \alpha$ (kéo theo lôgic)</td><td>$\alpha$ đúng ở <b>mọi</b> mô hình của KB</td></tr></table>
          <p><b>Kiểm mô hình</b>: liệt kê đủ $2^n$ mô hình, giữ các mô hình của KB, xem $\alpha$ có đúng ở tất cả không.</p>
        introduces: [entails, ab_alpha]
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng giới thiệu bốn khái niệm. Một mô hình là một cách gán đúng sai cho mọi biến, n biến thì có 2 mũ n mô hình. Mô hình của tri thức là mô hình làm mọi câu trong tri thức đúng. Một câu thoả được nếu có ít nhất một mô hình làm nó đúng. Tri thức kéo theo logic câu alpha nếu alpha đúng ở mọi mô hình của tri thức. Kiểm mô hình nghĩa là liệt kê đủ 2 mũ n mô hình, giữ các mô hình của tri thức, rồi xem alpha có đúng ở tất cả không."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Kéo theo lôgic là chứa trong"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340">
          <rect x="40" y="40" width="660" height="270" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
          <ellipse cx="370" cy="185" rx="250" ry="110" fill="#d1fae5" fill-opacity="0.7" stroke="#059669" stroke-width="3"/>
          <ellipse cx="330" cy="190" rx="110" ry="55" fill="#dbeafe" fill-opacity="0.9" stroke="#2a78d6" stroke-width="3"/>
          <rect x="800" y="40" width="660" height="270" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
          <ellipse cx="1050" cy="185" rx="170" ry="100" fill="#d1fae5" fill-opacity="0.7" stroke="#059669" stroke-width="3"/>
          <ellipse cx="1220" cy="190" rx="150" ry="60" fill="#dbeafe" fill-opacity="0.9" stroke="#2a78d6" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <text x="370" y="72">mọi mô hình</text><text x="330" y="198">mô hình của KB</text><text x="520" y="150" fill="#047857">α đúng</text>
          <text x="1130" y="72">mọi mô hình</text><text x="980" y="190" fill="#047857">trời mưa</text><text x="1260" y="198">mô hình của KB</text></g>
          <g font-size="26" font-weight="bold" text-anchor="middle"><text x="370" y="336" fill="#059669">KB kéo theo α: nằm trọn bên trong</text><text x="1130" y="336" fill="#b91c1c">không kéo theo: có phần ở ngoài</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình cho thấy kéo theo logic là quan hệ chứa trong. Bên trái, vùng xanh dương là các mô hình của tri thức, nằm trọn trong vùng câu alpha đúng, nên tri thức kéo theo alpha. Bên phải, các mô hình của tri thức có phần nằm ngoài vùng trời mưa, nên tri thức không kéo theo câu trời mưa."

  - id: example
    kind: example
    title: "Liệt kê 8 mô hình"
    checks:
      - "alg.pl_entails(lambda m: (not m['P'] or m['Q']) and (not m['Q'] or m['R']) and m['P'], lambda m: m['R'], ['P', 'Q', 'R']) == (True, 1, 8)"
    steps:
      - show: |
          <p>KB = { $P \to Q$, $Q \to R$, $P$ }. Có 3 biến → $2^3 = 8$ mô hình. Xét lần lượt:</p>
          <table class="t"><tr><th>P Q R</th><th>$P \to Q$</th><th>$Q \to R$</th><th>$P$</th><th>mô hình của KB?</th></tr>
          <tr><td>đ đ đ</td><td>đ</td><td>đ</td><td>đ</td><td class="green">có</td></tr></table>
        focus: [1, "2.2"]
        say: "Tri thức gồm ba câu, P kéo theo Q, Q kéo theo R, và P, với 3 biến nên có 2 mũ 3 bằng 8 mô hình. Xét mô hình đầu tiên, cả ba biến đều đúng, thì cả ba câu đều đúng, nên đây là một mô hình của tri thức."
      - show: |
          <table class="t"><tr><th>P Q R</th><th>$P \to Q$</th><th>$Q \to R$</th><th>$P$</th><th>mô hình của KB?</th></tr>
          <tr><td>đ đ s</td><td>đ</td><td class="red">s</td><td>đ</td><td>không</td></tr>
          <tr><td>đ s đ / đ s s</td><td class="red">s</td><td>—</td><td>đ</td><td>không</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Mô hình P đúng, Q đúng, R sai làm câu Q kéo theo R sai, nên bị loại. Hai mô hình P đúng, Q sai làm câu P kéo theo Q sai, cũng bị loại."
      - show: |
          <table class="t"><tr><th>P Q R</th><th>$P$</th><th>mô hình của KB?</th></tr>
          <tr><td>4 mô hình có P sai</td><td class="red">s</td><td>không</td></tr></table>
        focus: ["1.2"]
        say: "Bốn mô hình còn lại đều có P sai, mà P là một câu trong tri thức, nên cả bốn đều bị loại."
      - show: |
          <p>Chỉ <b>1</b> trong 8 mô hình là mô hình của KB (đ đ đ), và ở đó $R$ đúng → $KB \models R$.</p>
        say: "Vậy chỉ 1 trong 8 mô hình là mô hình của tri thức, và ở mô hình đó R đúng, nên tri thức kéo theo logic R."

  - id: check
    kind: check
    title: "Tự kiểm: suy luận theo luật cũng ra R"
    checks:
      - "alg.pl_entails(lambda m: (not m['P'] or m['Q']) and (not m['Q'] or m['R']) and m['P'], lambda m: m['R'], ['P', 'Q', 'R']) == (True, 1, 8)"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>có</th><th>dùng luật</th><th>suy ra</th></tr>
          <tr><td>1</td><td>$P$ và $P \to Q$</td><td>P đúng thì Q đúng</td><td>$Q$</td></tr>
          <tr><td>2</td><td>$Q$ và $Q \to R$</td><td>Q đúng thì R đúng</td><td>$R$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, không liệt kê mô hình mà suy luận theo luật. Bước một, có P và P kéo theo Q, nên suy ra Q. Bước hai, có Q và Q kéo theo R, nên suy ra R, khớp kết quả liệt kê."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.pl_entails(lambda m: (not m['M'] or m['U']) and m['U'], lambda m: m['M'], ['M', 'U']) == (False, 2, 4)"
      - "2 ** 20 == 1048576"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Khẳng định hệ quả <b class="red">(kết luận sai)</b>
          <br><span class="note">KB = { $M \to U$, $U$ } (mưa kéo theo ướt; đường ướt) có <b>2</b> mô hình: một mô hình mưa, một mô hình không mưa. $M$ không đúng ở mọi mô hình → KB <b>không</b> kéo theo “trời mưa”.</span></div>
        say: "Lỗi thứ nhất, khẳng định hệ quả nên kết luận sai. Tri thức gồm mưa kéo theo ướt, và đường ướt, có 2 mô hình, một mô hình có mưa và một mô hình không mưa. Câu trời mưa không đúng ở mọi mô hình, nên tri thức không kéo theo câu trời mưa."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lẫn “thoả được” với “kéo theo” <b class="red">(chỉ có thể đúng)</b>
          <br><span class="note">“Trời mưa” thoả được cùng KB (có một mô hình), nhưng chưa bị kéo theo. Tác tử phải phân biệt điều <b>chắc chắn</b> với điều <b>có thể</b>.</span></div>
        say: "Lỗi thứ hai, lẫn thoả được với kéo theo, nên coi điều chỉ có thể đúng là chắc chắn. Câu trời mưa thoả được cùng tri thức, vì có một mô hình như vậy, nhưng chưa bị kéo theo. Tác tử phải phân biệt điều chắc chắn với điều có thể."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng liệt kê mô hình cho mọi bài <b class="red">(bùng nổ)</b>
          <br><span class="note">20 biến đã là $2^{20} = 1\,048\,576$ mô hình; 100 biến thì không thể. Bài lớn cần suy diễn theo luật (đi từ điều đã biết sang điều mới) hoặc bộ giải thoả được chuyên dụng.</span></div>
        say: "Lỗi thứ ba, dùng liệt kê mô hình cho mọi bài nên bùng nổ. 20 biến đã là hơn 1 triệu mô hình, 100 biến thì không thể. Bài lớn cần suy diễn theo luật, tức đi từ điều đã biết sang điều mới mà không liệt kê mô hình, hoặc dùng bộ giải chuyên dụng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.pl_entails(lambda m: (not m['M'] or m['U']) and not m['U'], lambda m: not m['M'], ['M', 'U']) == (True, 1, 4)"
      - "alg.pl_entails(lambda m: (m['A'] or m['B']) and not m['A'], lambda m: m['B'], ['A', 'B']) == (True, 1, 4)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>KB = { $M \to U$, $\neg U$ } (mưa kéo theo ướt; đường KHÔNG ướt). KB có kéo theo $\neg M$ không? Có bao nhiêu mô hình của KB?</td></tr>
          <tr><td>2</td><td>KB = { $A \lor B$, $\neg A$ }. KB có kéo theo $B$ không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tri thức gồm mưa kéo theo ướt, và đường không ướt. Tri thức có kéo theo câu không mưa không? Có bao nhiêu mô hình của tri thức? Câu hai, tri thức gồm hai câu, A hoặc B, và không phải A. Tri thức có kéo theo B không? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>M U</th><th>$M \to U$</th><th>$\neg U$</th><th>mô hình của KB?</th></tr>
          <tr><td>đ đ</td><td>đ</td><td class="red">s</td><td>không</td></tr>
          <tr><td>đ s</td><td class="red">s</td><td>đ</td><td>không</td></tr>
          <tr><td>s đ</td><td>đ</td><td class="red">s</td><td>không</td></tr>
          <tr><td>s s</td><td>đ</td><td>đ</td><td class="green">có — và ở đó $\neg M$ đúng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Đáp án câu một, liệt kê 4 mô hình. Có mưa và đường bị ướt, thì câu đường không ướt trở thành sai. Mưa mà không ướt làm câu mưa kéo theo ướt sai. Không mưa mà đường vẫn bị ướt, thì câu đường không ướt cũng sai. Chỉ còn mô hình không mưa, không ướt, và ở đó câu không mưa đúng. Vậy có, tri thức kéo theo không mưa, và phủ định hệ quả là một suy luận đúng."
      - show: |
          <p>② Mô hình có $\neg A$ (A sai) và $A \lor B$ đúng phải có B đúng → chỉ 1 mô hình, $KB \models B$.</p>
        say: "Câu hai, vì A sai mà A hoặc B đúng, nên B phải đúng. Chỉ có 1 mô hình là A sai và B đúng, nên tri thức kéo theo B."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mô hình: một cách gán đúng/sai</span><span class="a">→</span>
          <span class="n">mô hình của KB</span><span class="a">→</span>
          <span class="n">KB kéo theo α: α đúng ở mọi mô hình đó</span><span class="a">→</span>
