scenes:
- id: hook
  kind: hook
  title: Đường ướt, vậy trời đã mưa?
  checks:
  - 'alg.pl_entails(lambda m: (not m[''M''] or m[''U'']) and m[''U''], lambda m: m[''M''], [''M'', ''U'']) == (False, 2, 4)'
  steps:
  - show: '<p>Tác tử biết: “nếu trời mưa thì đường ướt” và “đường đang ướt”. Nó kết luận “trời đã mưa”. Nghe hợp lý — nhưng có thể có xe tưới nước đi qua. Làm sao một chương trình biết chắc kết luận nào <b>bắt buộc</b> đúng, kết luận nào chỉ <b>có thể</b> đúng?</p>

      <div class="box key">Hôm nay: <b>lôgic mệnh đề</b> cho tác tử — <b>mô hình</b>, <b>kéo theo lôgic</b>, và cách kiểm bằng liệt kê mọi mô hình.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, tác tử biết rằng nếu trời mưa thì đường ướt, và đường đang ướt. Nó kết luận trời đã mưa. Nghe hợp lý, nhưng có thể có xe tưới nước đi qua. Làm sao một chương trình biết chắc kết luận nào bắt buộc đúng, kết luận nào chỉ có thể đúng? Hôm nay ta học logic mệnh đề cho tác tử, với mô hình, kéo theo logic, và cách kiểm bằng liệt kê mọi mô hình. Ta phân biệt rành mạch giữa bảng gán đúng sai và hệ quả logic trên mọi mô hình thoả mãn tri thức ban đầu. Nắm chắc ngữ nghĩa tập hợp giúp bạn tránh sạch lỗi ngụy biện khẳng định hệ quả hay nhầm chiều kéo theo. Phân biệt rạch ròi giữa điều có thể xảy ra trong một kịch bản với điều bắt buộc phải đúng trong mọi kịch bản giúp tác tử tránh kết luận vội vàng.
- id: prereq
  kind: prereq
  title: 'Trước hết: mệnh đề, các phép lôgic và phép kéo theo'
  checks:
  - '[(not p) or q for p in (True, False) for q in (True, False)] == [True, False, True, True]'
  - '[not True, True and False, True or False, False or False] == [False, False, True, False]'
  steps:
  - show: '<p>Một <b>mệnh đề</b> là câu chỉ có thể đúng hoặc sai, như “trời mưa”; ta đặt tên bằng một chữ cái: $P$, $Q$.</p>

      <table class="t"><tr><th>phép</th><th>đọc</th><th>đúng khi</th><th>ví dụ: P đúng, Q sai</th></tr>

      <tr><td>$\neg P$</td><td>không P</td><td>P sai</td><td>sai</td></tr>

      <tr><td>$P \land Q$</td><td>P và Q</td><td>cả hai đúng</td><td>sai</td></tr>

      <tr><td>$P \lor Q$</td><td>P hoặc Q</td><td>ít nhất một cái đúng</td><td>đúng</td></tr></table>

      '
    introduces:
    - lnot
    - land
    - lor
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.4'
    say: Trước hết, ta cần hiểu mệnh đề và các phép logic. Một mệnh đề là câu chỉ có thể đúng hoặc sai, như trời mưa, và ta đặt tên nó bằng một chữ cái như P hay Q. Bảng cho ba phép, thử với P đúng và Q sai. Không P đúng khi P sai, nên ở đây không P sai. P và Q chỉ đúng khi cả hai đúng, nên ở đây sai, còn P hoặc Q đúng khi ít nhất một cái đúng, nên ở đây đúng. Mỗi phép nối cơ bản phủ định, hội và tuyển xác định rành mạch giá trị chân trị của câu phức hợp chỉ dựa trên bảng hai trạng thái.
  - clear: true
    show: '<table class="t"><tr><th>$P$</th><th>$Q$</th><th>$P \to Q$</th></tr>

      <tr><td>đúng</td><td>đúng</td><td>đúng</td></tr>

      <tr><td>đúng</td><td>sai</td><td class="red">sai</td></tr>

      <tr><td>sai</td><td>đúng</td><td>đúng</td></tr>

      <tr><td>sai</td><td>sai</td><td>đúng</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Phép thứ tư là kéo theo, đọc là nếu P thì Q, và bảng chân trị cho biết nó đúng hay sai trong từng trường hợp. Khi P đúng và Q đúng, câu P kéo theo Q đúng. Câu này chỉ sai trong đúng một trường hợp, P đúng mà Q sai. Khi P sai, câu kéo theo luôn đúng, dù Q thế nào. Hai dòng cuối hay gây ngạc nhiên, vì lời hứa nếu thì không bị vi phạm khi điều kiện không xảy ra. Lưu ý duy nhất dễ quên là phép kéo theo chỉ sai khi tiền đề đúng mà kết luận lại sai; mọi trường hợp tiền đề sai đều coi là hợp lệ.
- id: sym
  kind: symbol
  title: 'Giải mã: mô hình, thoả được, kéo theo lôgic'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>mô hình</b></td><td>một cách gán đúng/sai cho mọi biến; $n$ biến có $2^n$ mô hình</td></tr>

      <tr><td><b>mô hình của KB</b></td><td>KB (cơ sở tri thức) là tập các câu tác tử coi là đúng; mô hình của KB làm MỌI câu trong đó đúng</td></tr>

      <tr><td><b>thoả được</b></td><td>có ít nhất một mô hình làm câu đúng</td></tr>

      <tr><td>$KB \models \alpha$ (kéo theo lôgic)</td><td>$\alpha$ đúng ở <b>mọi</b> mô hình của KB</td></tr></table>

      <p><b>Kiểm mô hình</b>: liệt kê đủ $2^n$ mô hình, giữ các mô hình của KB, xem $\alpha$ có đúng ở tất cả không.</p>

      '
    introduces:
    - entails
    - ab_alpha
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.5'
    - '1.5'
    say: Bảng giới thiệu bốn khái niệm. Một mô hình là một cách gán đúng sai cho mọi biến, n biến thì có 2 mũ n mô hình. Tri thức, viết tắt trên màn hình, là tập các câu tác tử coi là đúng, và mô hình của tri thức là mô hình làm mọi câu trong đó đúng. Một câu thoả được nếu có ít nhất một mô hình làm nó đúng. Tri thức kéo theo logic câu alpha nếu alpha đúng ở mọi mô hình của tri thức. Kiểm mô hình nghĩa là liệt kê đủ 2 mũ n mô hình, giữ các mô hình của tri thức, rồi xem alpha có đúng ở tất cả không. Phương pháp kiểm bảng chân trị duyệt đủ mọi tổ hợp gán giá trị để bảo chứng suy diễn đúng tuyệt đối. Ký hiệu kéo theo ngữ nghĩa khẳng định câu cần chứng minh luôn đúng tại mọi thế giới khả dĩ không mâu thuẫn với cơ sở tri thức.
