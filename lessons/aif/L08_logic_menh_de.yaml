    - '1.2'
    say: Bốn mô hình còn lại đều có P sai, mà P là một câu trong tri thức, nên cả bốn đều bị loại.
  - show: '<p>Chỉ <b>1</b> trong 8 mô hình là mô hình của KB (đ đ đ), và ở đó $R$ đúng → $KB \models R$.</p>

      '
    say: Vậy chỉ 1 trong 8 mô hình là mô hình của tri thức, và ở mô hình đó R đúng, nên tri thức kéo theo logic R.
  - show: <p><b>Bước 4 — kiểm kéo theo logic bằng liệt kê mô hình trong Python</b>:</p><div class="code"><div>ok = [(p, q, r) for p in (0,1) for q in (0,1) for r in (0,1)</div><div>      if (not p or q) and (not q or r) and p]</div><div>print(&#x27;kb_models=&#x27;, len(ok), &#x27;entails_R=&#x27;, int(all(m[2] == 1 for m in ok)))</div></div>
    say: Bước bốn, ta dùng list comprehension trong Python để duyệt tất cả tám bộ chân trị cho ba biến mệnh đề. Biểu thức điều kiện giữ lại đúng những thế giới làm mọi câu trong cơ sở tri thức đều đúng. Chỉ có duy nhất 1 mô hình thoả mãn, và ở mô hình đó R bằng 1 nên phép kéo theo được xác nhận.
    clear: true
    focus: null
- id: check
  kind: check
  title: 'Tự kiểm: suy luận theo luật cũng ra R'
  checks:
  - 'alg.pl_entails(lambda m: (not m[''P''] or m[''Q'']) and (not m[''Q''] or m[''R'']) and m[''P''], lambda m: m[''R''], [''P'', ''Q'', ''R'']) == (True, 1, 8)'
  steps:
  - show: '<table class="t"><tr><th>bước</th><th>có</th><th>dùng luật</th><th>suy ra</th></tr>

      <tr><td>1</td><td>$P$ và $P \to Q$</td><td>P đúng thì Q đúng</td><td>$Q$</td></tr>

      <tr><td>2</td><td>$Q$ và $Q \to R$</td><td>Q đúng thì R đúng</td><td>$R$ ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, không liệt kê mô hình mà suy luận theo luật. Bước một, có P và P kéo theo Q, nên suy ra Q. Bước hai, có Q và Q kéo theo R, nên suy ra R, khớp kết quả liệt kê. Kết quả duyệt đủ tám bảng chân trị hoàn toàn trùng khớp với hai bước suy diễn liên hoàn qua phép kéo theo khẳng định.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - 'alg.pl_entails(lambda m: (not m[''M''] or m[''U'']) and m[''U''], lambda m: m[''M''], [''M'', ''U'']) == (False, 2, 4)'
  - 2 ** 20 == 1048576
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Khẳng định hệ quả <b class="red">(kết luận sai)</b>

      <br><span class="note">KB = { $M \to U$, $U$ } (mưa kéo theo ướt; đường ướt) có <b>2</b> mô hình: một mô hình mưa, một mô hình không mưa. $M$ không đúng ở mọi mô hình → KB <b>không</b> kéo theo “trời mưa”.</span></div>

      '
    say: Lỗi thứ nhất, khẳng định hệ quả nên kết luận sai. Tri thức gồm mưa kéo theo ướt, và đường ướt, có 2 mô hình, một mô hình có mưa và một mô hình không mưa. Câu trời mưa không đúng ở mọi mô hình, nên tri thức không kéo theo câu trời mưa. Nhầm lẫn chiều mũi tên kéo theo là sai sót logic thường trực khiến máy gán sai nguyên nhân duy nhất cho một hiện tượng có nhiều gốc rễ. Nhầm lẫn chiều suy diễn từ hệ quả ngược về nguyên nhân thường xuyên tạo ra các kết luận sai lầm tai hại.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Lẫn “thoả được” với “kéo theo” <b class="red">(chỉ có thể đúng)</b>

      <br><span class="note">“Trời mưa” thoả được cùng KB (có một mô hình), nhưng chưa bị kéo theo. Tác tử phải phân biệt điều <b>chắc chắn</b> với điều <b>có thể</b>.</span></div>

      '
    say: Lỗi thứ hai, lẫn thoả được với kéo theo, nên coi điều chỉ có thể đúng là chắc chắn. Câu trời mưa thoả được cùng tri thức, vì có một mô hình như vậy, nhưng chưa bị kéo theo. Tác tử phải phân biệt điều chắc chắn với điều có thể. Chứng minh một giả thiết phù hợp được với dữ kiện chưa hề đồng nghĩa với việc dữ kiện bắt buộc giả thiết đó phải đúng. Quên xem xét đủ trường hợp biên làm phép kiểm bảng chân trị bỏ lọt các mô hình phản chứng quan trọng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dùng liệt kê mô hình cho mọi bài <b class="red">(bùng nổ)</b>

      <br><span class="note">20 biến đã là $2^{20} = 1\,048\,576$ mô hình; 100 biến thì không thể. Bài lớn cần suy diễn theo luật (đi từ điều đã biết sang điều mới) hoặc bộ giải thoả được chuyên dụng.</span></div>

      '
    say: Lỗi thứ ba, dùng liệt kê mô hình cho mọi bài nên bùng nổ. 20 biến đã là hơn 1 triệu mô hình, 100 biến thì không thể. Bài lớn cần suy diễn theo luật, tức đi từ điều đã biết sang điều mới mà không liệt kê mô hình, hoặc dùng bộ giải chuyên dụng. Phép liệt kê hai mũ số biến chỉ khả thi ở bài tập đồ chơi vài biến; với hàng nghìn mệnh đề cần thuật toán suy diễn theo cấu trúc câu. Với cơ sở tri thức lớn hàng trăm biến, liệt kê hai mũ n mô hình bùng nổ hàm mũ nên cần thuật toán phân giải.
