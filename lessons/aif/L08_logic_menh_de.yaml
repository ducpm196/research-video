  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mô hình: một cách gán đúng/sai</span><span class="a">→</span>

      <span class="n">mô hình của KB</span><span class="a">→</span>

      <span class="n">KB kéo theo α: α đúng ở mọi mô hình đó</span><span class="a">→</span>

      <span class="n">liệt kê được khi ít biến</span></div>

      '
    say: Tổng kết lại, logic mệnh đề biểu diễn tri thức bằng biến chân trị đúng sai và câu ràng buộc chặt chẽ. Một câu được tri thức kéo theo logic khi và chỉ khi nó đúng ở mọi mô hình thoả mãn toàn bộ tập tri thức. Phương pháp liệt kê mọi bảng chân trị đầy đủ và chính xác cho ít biến nhưng bùng nổ lũy thừa hai khi số biến lớn. Mối quan hệ chặt chẽ giữa ngữ nghĩa mô hình và phép kéo theo bảo đảm không một ngoại lệ ẩn nào có thể làm sập kết luận suy ra.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="chain"><span class="n">mô hình: một cách gán đúng/sai</span><span class="a">→</span>

      <span class="n">mô hình của KB</span><span class="a">→</span>

      <span class="n">KB kéo theo α: α đúng ở mọi mô hình đó</span><span class="a">→</span>

      <span class="n">liệt kê được khi ít biến</span></div>

      '
    say: Khi phân tích quy tắc nghiệp vụ hay mạch kiểm an toàn, phép kiểm mô hình rà soát đủ mọi tổ hợp chân trị. Nhờ vậy ta không bỏ sót ngoại lệ ẩn nào. Khi số biến lên tới hàng trăm, ta chuyển sang các bộ giải thoả mãn logic hiện đại. Chúng biết phân tích xung đột và tự học thêm mệnh đề cắt nhánh. Tuy vậy ý nghĩa gốc của khái niệm kéo theo logic vẫn giữ nguyên không đổi, luôn là điều kiện đúng trên toàn bộ các mô hình thoả mãn tri thức. Một câu mâu thuẫn lọt vào tri thức sẽ làm tập mô hình rỗng và kéo theo mọi câu bất kỳ. Vì vậy ta luôn phải chạy bước kiểm tra nhất quán trước tiên. Hãy viết ngay vòng lặp liệt kê đủ tám cách gán cho ba biến mệnh đề trong phần tự thực hành. Một quy trình gọn gàng trong thực hành gồm ba bước nối tiếp là sinh đủ mọi bộ gán, giữ các bộ thoả toàn bộ tri thức rồi kiểm chứng kết luận.
