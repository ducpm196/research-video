      <p class="note"><b>So sánh hai quy mô:</b> Tri thức 3 biến chỉ có 8 mô hình (liệt kê dưới 1 mi-li-giây), còn với 100 biến ($2^{100} > 10^{30}$ mô hình) mọi máy tính đều treo — buộc phải chuyển sang suy diễn theo luật.</p>

      '
    say: Điều cần mang theo, một kết luận chắc chắn là kết luận không thể sai trong bất kỳ thế giới nào phù hợp với điều ta biết. Một kết luận đáng tin phải đứng vững trong tất cả mọi thế giới nhất quán chứ không chỉ trong một tình huống thuận lợi.
