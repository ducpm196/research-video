  - {sentence: "Mạng Bayes làm đúng phép này, nhưng với nhiều biến.", reason: "ASR chép “Mạng bay x làm đúng phép này, nhưng với nhiều biến.” (0.909): Bayes đọc “Bay-ét” theo lexicon chung (probe 3/8, NOT_VERIFIED), ASR viết “bay X/S” — NOT_VERIFIED bằng tai người"}
