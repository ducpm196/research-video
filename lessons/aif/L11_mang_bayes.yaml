  - {sentence: "Câu một, biết có trộm, xác suất chuông kêu là bao nhiêu?", reason: "ASR chép “Câu 1, biết có trộm, sẽ suốt chung kêu là bao nhiêu?” (0.75): lệch âm/thanh thuần Việt: xác suất chuông/sẽ suốt chung — NOT_VERIFIED bằng tai người"}
  - {sentence: "Biết chuông kêu thì xác suất trộm khoảng 0 phẩy 374.", reason: "ASR chép “Biết chuông keo thì xác suất trộn khoảng 0,374.” (0.786): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: kêu/keo, trộm/trộn, không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trộm và động đất cùng trỏ tới báo động, còn báo động trỏ tới hai hàng xóm gọi điện.", reason: "ASR chép “Trộm và động đức cùng trọ tới báo động, còn báo động trọ tới hai hàng sống gọi điện.” (0.789): lệch âm/thanh thuần Việt: đất/đức, trỏ/trọ, trỏ/trọ, xóm/sống — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng kết lại, mạng Bayes gồm đồ thị và các bảng điều kiện, và phân phối đồng thời bằng tích các bảng.", reason: "ASR chép “Tổng kết lại, mạng bay X gồm đồ thị và các bản điều kiện và phân phối đồng thời bằng tích các bản.” (0.87): Bayes đọc “Bay-ét” theo lexicon chung (probe 3/8, NOT_VERIFIED), ASR viết “bay X/S”; lệch âm/thanh thuần Việt: bảng/bản, bảng/bản — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai hàng xóm cùng gọi: có trộm không?"
    checks:
      - "round(alg.alarm_query('b', {'j': 1, 'm': 1}), 3) == 0.284"
    steps:
      - show: |
          <p>Nhà bạn có chuông báo trộm, nhưng động đất nhỏ cũng làm chuông kêu. Hai hàng xóm hứa sẽ gọi khi nghe chuông — một người hay gọi nhầm vì tiếng điện thoại, một người hay không nghe thấy vì mở nhạc to. Cả hai cùng gọi. Xác suất có trộm chỉ khoảng <b>28%</b>.</p>
          <div class="box key">Hôm nay: <b>mạng Bayes</b> — mô tả quan hệ không chắc chắn bằng đồ thị, và tính xác suất của điều không thấy từ điều thấy được.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, nhà bạn có chuông báo trộm, nhưng động đất nhỏ cũng làm chuông kêu. Hai hàng xóm hứa sẽ gọi khi nghe chuông, một người hay gọi nhầm vì tiếng điện thoại, một người hay không nghe thấy vì mở nhạc to. Cả hai cùng gọi. Xác suất có trộm chỉ khoảng 28 phần trăm. Hôm nay ta học mạng Bayes, mô tả quan hệ không chắc chắn bằng đồ thị, và tính xác suất của điều không thấy từ điều thấy được."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: xác suất có điều kiện và quy tắc nhân"
    checks:
      - "round(0.3 * 0.8, 2) == 0.24 and round(0.24 / (0.24 + 0.7 * 0.1), 3) == 0.774"
    steps:
      - show: |
          <p><b>Quy tắc nhân</b> (khoá toán cho khoa học máy tính): xác suất “mưa VÀ mang ô” = xác suất mưa × xác suất mang ô khi biết mưa.</p>
          <table class="t"><tr><th>P(mưa)</th><th>P(mang ô | mưa)</th><th>P(mưa và mang ô)</th></tr><tr><td>0,3</td><td>0,8</td><td>0,3 nhân 0,8 = 0,24</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Ở khoá toán cho khoa học máy tính, ta đã học quy tắc nhân. Xác suất vừa mưa vừa mang ô bằng xác suất trời mưa, nhân với xác suất mang ô khi đã biết trời mưa. Ở đây, 0 phẩy 3 nhân 0 phẩy 8 bằng 0 phẩy 24."
      - show: |
          <p><b>Đảo điều kiện</b> (định lý Bayes): nếu khi không mưa người ta mang ô với xác suất 0,1, thì thấy mang ô → P(mưa | mang ô) $= \frac{0{,}24}{0{,}24 + 0{,}7 \cdot 0{,}1} \approx 0{,}774$.</p>
        say: "Từ đó ta đảo được điều kiện. Giả sử khi không mưa, người ta vẫn mang ô với xác suất 0 phẩy 1. Thấy một người mang ô, xác suất đang mưa bằng 0 phẩy 24 chia cho 0 phẩy 24 cộng 0 phẩy 07, xấp xỉ 0 phẩy 774. Mạng Bayes làm đúng phép này, nhưng với nhiều biến."

  - id: sym
    kind: symbol
    title: "Giải mã: đồ thị, bảng điều kiện, phép phân rã"
    checks:
      - "2 ** 5 - 1 == 31 and 1 + 1 + 4 + 2 + 2 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>cạnh của đồ thị</th></tr>
          <tr><td>Trộm (B) → Báo động (A); Động đất (E) → Báo động (A)</td></tr>
          <tr><td>Báo động (A) → John gọi (J); Báo động (A) → Mary gọi (M)</td></tr></table>
          <p>Mỗi nút có một <b>bảng điều kiện</b>: xác suất của nó khi biết các nút cha. Phân phối đồng thời là <b>tích</b> các bảng:</p>
          <p>$P(b, e, a, j, m) = P(b) \cdot P(e) \cdot P(a \mid b, e) \cdot P(j \mid a) \cdot P(m \mid a)$</p>
          <p>Bảng đầy đủ cần $2^5 - 1 = 31$ số; mạng chỉ cần $1 + 1 + 4 + 2 + 2 = 10$ số — nhờ mỗi nút chỉ phụ thuộc trực tiếp vào cha của nó.</p>
        introduces: [prob, given]
        focus: [1, "1.2", 2, 3, 3, 4, 4]
        say: "Bảng ghi các cạnh của đồ thị năm nút. Trộm và động đất cùng trỏ tới báo động, còn báo động trỏ tới hai hàng xóm gọi điện. Mỗi nút có một bảng điều kiện, cho xác suất của nó khi biết các nút cha. Phân phối đồng thời bằng tích các bảng. Đó là xác suất trộm, nhân xác suất động đất, nhân xác suất báo động khi biết trộm và động đất, nhân xác suất mỗi hàng xóm gọi khi biết báo động. Bảng đầy đủ cần 2 mũ 5 trừ 1, bằng 31 số. Mạng chỉ cần 10 số, nhờ mỗi nút chỉ phụ thuộc trực tiếp vào cha của nó."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mạng báo trộm: năm nút, bốn mũi tên"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><defs><marker id="arA11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
          <g stroke="#6b7280" stroke-width="3"><line x1="500" y1="95" x2="680" y2="160" marker-end="url(#arA11)"/><line x1="1000" y1="95" x2="820" y2="160" marker-end="url(#arA11)"/>
          <line x1="700" y1="215" x2="520" y2="280" marker-end="url(#arA11)"/><line x1="800" y1="215" x2="980" y2="280" marker-end="url(#arA11)"/></g>
          <g font-size="26" text-anchor="middle" fill="#1f2937">
          <rect x="360" y="40" width="200" height="60" rx="30" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="460" y="80">trộm</text>
          <rect x="940" y="40" width="220" height="60" rx="30" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1050" y="80">động đất</text>
          <rect x="640" y="160" width="220" height="60" rx="30" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="200">chuông kêu</text>
          <rect x="340" y="280" width="240" height="60" rx="30" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="460" y="320">hàng xóm 1 gọi</text>
          <rect x="920" y="280" width="240" height="60" rx="30" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1040" y="320">hàng xóm 2 gọi</text></g>
          <g font-size="22" fill="#6b7280"><text x="180" y="80">0,001</text><text x="1190" y="80">0,002</text><text x="890" y="198">bảng 4 dòng</text><text x="140" y="318">0,90 / 0,05</text><text x="1190" y="318">0,70 / 0,01</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình là mạng báo trộm. Trộm và động đất ở trên cùng, mỗi nút chỉ cần một con số, 0 phẩy 001 và 0 phẩy 002. Chuông kêu phụ thuộc cả hai nên cần một bảng 4 dòng, còn mỗi hàng xóm chỉ phụ thuộc chuông, nên cần hai số, gọi khi chuông kêu và gọi khi chuông không kêu."

  - id: example
    kind: example
    title: "Một tích và một phép suy diễn"
    checks:
      - "round(alg.alarm_joint(0, 0, 1, 1, 1), 6) == 0.000628"
      - "[round(alg.alarm_query('b', ev), 3) for ev in ({'j': 1, 'm': 1}, {'j': 1}, {'m': 1})] == [0.284, 0.016, 0.056]"
    steps:
      - show: |
          <p>Bảng: $P(b) = 0{,}001$; $P(e) = 0{,}002$; $P(a \mid \neg b, \neg e) = 0{,}001$; $P(j \mid a) = 0{,}90$; $P(m \mid a) = 0{,}70$.</p>
          <p><b>Bước 1 — một tích:</b> “chuông kêu, cả hai gọi, không trộm, không động đất” $= 0{,}90 \cdot 0{,}70 \cdot 0{,}001 \cdot 0{,}999 \cdot 0{,}998 \approx \hl{0{,}000628}$.</p>
        introduces: [lnot]
        focus: [1, 1, 2]
        say: "Các bảng cho xác suất trộm 0 phẩy 001, động đất 0 phẩy 002, và chuông tự kêu khi không có gì là 0 phẩy 001. Khi chuông kêu, người thứ nhất gọi với xác suất 0 phẩy 9, người thứ hai 0 phẩy 7. Bước một, theo quy tắc nhân, xác suất chuông kêu, cả hai gọi, không trộm, không động đất bằng tích năm số, xấp xỉ 0 phẩy 000628."
      - clear: true
        show: |
          <p><b>Bước 2 — suy diễn bằng liệt kê:</b> cộng mọi giá trị của biến ẩn (động đất, chuông):</p>
          $$P(b \mid j, m) = \frac{\sum_{e, a} P(b, e, a, j, m)}{\sum_{b, e, a} P(b, e, a, j, m)}$$
        introduces: [sum]
        focus: [1, 2]
        say: "Bước hai là suy diễn bằng liệt kê. Xác suất trộm khi cả hai gọi bằng tổng các tích có trộm, theo mọi giá trị của động đất và chuông, chia cho tổng các tích theo mọi giá trị của cả ba biến ẩn."
      - show: |
          <table class="t"><tr><th>phần</th><th>cộng 4 tích</th><th>kết quả</th></tr>
          <tr><td>có trộm</td><td>$\sum_{e, a} P(b, e, a, j, m)$</td><td>≈ 0,000592</td></tr>
          <tr><td>không trộm</td><td>$\sum_{e, a} P(\neg b, e, a, j, m)$</td><td>≈ 0,001492</td></tr>
          <tr><td>tỉ lệ</td><td>0,000592 ÷ (0,000592 + 0,001492)</td><td>≈ $\hl{0{,}284}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước ba, máy cộng các tích. Phần có trộm cộng 4 tích được khoảng 0 phẩy 000592. Phần không trộm được khoảng 0 phẩy 001492. Chia phần có trộm cho tổng hai phần được khoảng 0 phẩy 284."
      - clear: true
        show: |
          <table class="t"><tr><th>bằng chứng</th><th>P(trộm | bằng chứng)</th></tr>
          <tr><td>chỉ người thứ nhất gọi</td><td>≈ 0,016</td></tr>
          <tr><td>chỉ người thứ hai gọi</td><td>≈ 0,056</td></tr>
          <tr><td>cả hai gọi</td><td>≈ $\hl{0{,}284}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước bốn, so ba loại bằng chứng. Chỉ người thứ nhất gọi, xác suất trộm khoảng 0 phẩy 016. Chỉ người thứ hai gọi, khoảng 0 phẩy 056. Cả hai cùng gọi, khoảng 0 phẩy 284, vì hai bằng chứng độc lập cùng chỉ về một hướng."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "abs(sum(alg.alarm_joint(*v) for v in __import__('itertools').product((0, 1), repeat=5)) - 1) < 1e-12"
      - "round(1 / (1 + 0.001491857649 / 0.00059224259), 3) == 0.284 == round(alg.alarm_query('b', {'j': 1, 'm': 1}), 3)"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách</th><th>kết quả</th></tr>
          <tr><td>32 tích cộng lại</td><td>mọi trường hợp đúng/sai của 5 biến</td><td>= 1 ✓</td></tr>
          <tr><td>0,284</td><td>$\frac{1}{1 + 0{,}001492 / 0{,}000592}$</td><td>≈ 0,284 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Cộng cả 32 tích, ứng với mọi trường hợp đúng sai của 5 biến, phải được đúng 1, và máy cho ra 1, nên các bảng nhất quán. Viết lại kết quả dưới dạng 1 chia cho 1 cộng tỉ số hai phần, vì đó là cùng một phép chia, ta cũng được 0 phẩy 284."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "round(alg.alarm_query('b', {'a': 1}), 3) == 0.374 and round(alg.alarm_query('b', {'a': 1, 'e': 1}), 4) == 0.0033"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi mũi tên là quan hệ nhân quả bắt buộc <b class="red">(hiểu sai mô hình)</b>
          <br><span class="note">Mũi tên mã hoá độc lập có điều kiện: biết Báo động thì John gọi hay không độc lập với Trộm. Vẽ mạng theo nhân quả thường gọn, nhưng không bắt buộc.</span></div>
        say: "Lỗi thứ nhất, coi mũi tên là quan hệ nhân quả bắt buộc, hiểu sai mô hình. Mũi tên mã hoá độc lập có điều kiện, biết chuông đã kêu thì việc hàng xóm gọi hay không độc lập với chuyện có trộm. Vẽ mạng theo nhân quả thường gọn hơn, nhưng không bắt buộc."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên hiện tượng <b>giải thích loại trừ</b> <b class="red">(hai nguyên nhân cạnh tranh)</b>
          <br><span class="note">Biết chuông kêu: P(trộm) ≈ 0,374. Biết thêm có động đất: P(trộm) chỉ còn ≈ 0,0033 — động đất đã “giải thích” tiếng chuông. Trộm và động đất độc lập, nhưng biết chuông kêu thì chúng phụ thuộc nhau.</span></div>
        say: "Lỗi thứ hai, quên hiện tượng giải thích loại trừ, khi hai nguyên nhân cạnh tranh nhau. Biết chuông kêu thì xác suất trộm khoảng 0 phẩy 374. Biết thêm có động đất thì xác suất trộm chỉ còn khoảng 0 phẩy 0033, vì động đất đã giải thích tiếng chuông. Trộm và động đất vốn độc lập, nhưng khi biết chuông kêu thì chúng phụ thuộc nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Liệt kê cho mạng lớn <b class="red">(bùng nổ)</b>
          <br><span class="note">Liệt kê cộng qua mọi tổ hợp biến ẩn: $n$ biến nhị phân ẩn là $2^n$ số hạng. Mạng lớn cần khử biến theo thứ tự tốt, hoặc lấy mẫu gần đúng.</span></div>
        say: "Lỗi thứ ba, dùng liệt kê cho mạng lớn nên bùng nổ. Liệt kê cộng qua mọi tổ hợp biến ẩn, n biến nhị phân ẩn là 2 mũ n số hạng. Mạng lớn cần khử biến theo thứ tự tốt, hoặc lấy mẫu gần đúng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.alarm_query('a', {'b': 1}), 2) == 0.94 and round(alg.alarm_query('e', {'j': 1, 'm': 1}), 3) == 0.176"
      - "1 + 1 + 4 + 2 + 2 + 2 == 12"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Biết có trộm, xác suất chuông kêu là bao nhiêu? (Gợi ý: còn phải xét động đất có xảy ra không.)</td></tr>
          <tr><td>2</td><td>Thêm nút “chó sủa” chỉ có cha là Báo động. Mạng cần thêm bao nhiêu số?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, biết có trộm, xác suất chuông kêu là bao nhiêu? Gợi ý, còn phải xét động đất có xảy ra không. Câu hai, thêm nút chó sủa chỉ có cha là chuông báo động. Mạng cần thêm bao nhiêu số? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>động đất?</th><th>xác suất</th><th>chuông kêu khi có trộm</th><th>tích</th></tr>
          <tr><td>có</td><td>0,002</td><td>0,95</td><td>0,0019</td></tr>
          <tr><td>không</td><td>0,998</td><td>0,94</td><td>0,93812</td></tr>
          <tr><td colspan="3">cộng hai trường hợp</td><td>≈ $\hl{0{,}94}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, xét hai trường hợp của động đất. Có động đất, xác suất 0 phẩy 002, chuông kêu với xác suất 0 phẩy 95, tích là 0 phẩy 0019. Không động đất, 0 phẩy 998 nhân 0 phẩy 94, được 0 phẩy 93812. Cộng hai trường hợp, xấp xỉ 0 phẩy 94."
      - show: |
          <p>② Thêm <b>2</b> số: P(sủa | chuông kêu), P(sủa | chuông không kêu) — tổng 12 số, thay vì bảng đầy đủ $2^6 - 1 = 63$ số.</p>
        say: "Câu hai, thêm 2 số, xác suất chó sủa khi chuông kêu và khi chuông không kêu, nên tổng cộng 12 số, thay vì bảng đầy đủ 63 số."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đồ thị + bảng điều kiện</span><span class="a">→</span>
          <span class="n">phân phối đồng thời = tích các bảng</span><span class="a">→</span>
          <span class="n">suy diễn: cộng qua biến ẩn</span><span class="a">→</span>
          <span class="n">nguyên nhân cạnh tranh: giải thích loại trừ</span></div>
        say: "Tổng kết lại, mạng Bayes gồm đồ thị và các bảng điều kiện, và phân phối đồng thời bằng tích các bảng. Suy diễn bằng cộng qua biến ẩn, và các nguyên nhân cạnh tranh tạo ra hiện tượng giải thích loại trừ."
      - show: |
          <div class="box key"><b>Tư duy:</b> bằng chứng mới không chỉ cộng thêm niềm tin — nó có thể <b>rút bớt</b> niềm tin vào một nguyên nhân khác.</div>
        say: "Điều cần mang theo, bằng chứng mới không chỉ cộng thêm niềm tin, nó có thể rút bớt niềm tin vào một nguyên nhân khác."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>lập kế hoạch khi bất định</b> — lặp giá trị và lặp chính sách.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học lập kế hoạch khi bất định, với lặp giá trị và lặp chính sách. Hẹn gặp bạn ở bài tiếp theo."
