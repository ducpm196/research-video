source: "curriculum/aif.yaml L11; audit/aif/verify_aif.py L11; J. Pearl, Probabilistic Reasoning in Intelligent Systems (1988); AIMA bản 4 (2020), mục 13.2–13.3 (mạng báo trộm: P(j, m, a, ¬b, ¬e) = 0,000628; P(trộm | cả hai gọi) ≈ 0,284); CS115 bài 13 (xác suất có điều kiện, Bayes)"
assumes: [arith, prob, given, frac, approx, power, sub, cdot]
# Quy ước: mạng báo trộm của AIMA: Trộm (B), Động đất (E) → Báo động (A) → John gọi (J), Mary gọi (M). alg.ALARM_CPT giữ các bảng xác suất;
#   alg.alarm_joint tính xác suất đồng thời bằng tích; alg.alarm_query(biến, bằng chứng) suy diễn bằng liệt kê mọi biến ẩn. Tên John, Mary chỉ
#   trên màn hình; lời đọc nói “người hàng xóm thứ nhất / thứ hai”. Bayes đọc theo luật chung.
objectives:
  - "Viết phân phối đồng thời bằng tích các bảng điều kiện"
  - "Suy diễn bằng liệt kê"
  - "Nhận ra hiện tượng giải thích loại trừ"
