id: L01
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 1 — Bài toán tìm kiếm: trạng thái, hành động, tìm theo chiều rộng và chi phí đều"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L01; audit/aif/verify_aif.py L01; AIMA bản 4 (2020), chương 3 (phát biểu bài toán, 8-puzzle, tìm theo chiều rộng, tìm chi phí đều); CS112 bài 7 (BFS), bài 24 (Dijkstra)"
assumes: [arith]
# Quy ước: 8-puzzle viết theo hàng, “_” là ô trống; đích là _ 1 2 / 3 4 5 / 6 7 8 (như AIMA). alg.puz_bfs, alg.puz_reachable chạy BFS thật.
#   alg.graph_search(đồ thị, đầu, đích, "bfs" | "ucs"): BFS kiểm đích khi SINH nút; chi phí đều kiểm đích khi LẤY nút ra (lý do ở lỗi 2).
objectives:
  - "Phát biểu bài toán tìm kiếm bằng năm thành phần"
  - "So sánh tìm theo chiều rộng và tìm chi phí đều"
  - "Hiểu vì sao cần tập đã thăm"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Trò xếp 8 ô số: 181 440 trạng thái"
    checks:
      - "alg.puz_reachable() == 181440"
    steps:
      - show: |
          <p>Trò xếp 8 ô số: bảng 3 × 3 có 8 ô số và một ô trống, mỗi bước đẩy một ô kề vào ô trống. Từ một cách xếp cho trước, có <b>181 440</b> cách xếp đạt được. Làm sao máy tìm ra dãy bước ngắn nhất mà không đi lạc?</p>
          <div class="box key">Hôm nay: phát biểu một bài toán thành <b>bài toán tìm kiếm</b>, và hai cách tìm có bảo đảm: <b>theo chiều rộng</b> và <b>theo chi phí đều</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trò xếp 8 ô số có bảng 3 nhân 3, gồm 8 ô số và một ô trống, mỗi bước đẩy một ô kề vào ô trống. Từ một cách xếp cho trước, có 181 nghìn 440 cách xếp đạt được. Làm sao máy tìm ra dãy bước ngắn nhất mà không đi lạc? Hôm nay ta phát biểu một bài toán thành bài toán tìm kiếm, với hai cách tìm có bảo đảm, theo chiều rộng và theo chi phí đều."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: hàng đợi và hàng đợi ưu tiên"
    checks:
      - "__import__('collections').deque([3, 5, 1]).popleft() == 3 and min([3, 5, 1]) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>cấu trúc</th><th>lấy ra phần tử nào</th><th>ví dụ: đã cho vào 3, 5, 1</th></tr>
          <tr><td>hàng đợi (vào trước ra trước)</td><td>phần tử vào <b>sớm nhất</b></td><td>lấy ra 3</td></tr>
          <tr><td>hàng đợi ưu tiên</td><td>phần tử có khoá <b>nhỏ nhất</b></td><td>lấy ra 1</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Ở khoá thuật toán, ta đã gặp hai cấu trúc, và bài này dùng lại cả hai. Hàng đợi lấy ra phần tử vào sớm nhất, nên nếu đã cho vào 3, 5 rồi 1 thì lấy ra 3. Hàng đợi ưu tiên lấy ra phần tử có khoá nhỏ nhất, nên lấy ra 1."

  - id: sym
    kind: symbol
    title: "Giải mã: năm thành phần của bài toán tìm kiếm"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>trò xếp 8 ô số</th></tr>
          <tr><td><b>trạng thái</b></td><td>vị trí của 8 ô số và ô trống</td></tr>
          <tr><td><b>trạng thái đầu</b></td><td>7 2 4 / 5 _ 6 / 8 3 1</td></tr>
          <tr><td><b>hành động</b></td><td>đẩy ô trống lên, xuống, trái, phải (nếu còn trong bảng)</td></tr>
          <tr><td><b>kiểm tra đích</b></td><td>bằng _ 1 2 / 3 4 5 / 6 7 8</td></tr>
          <tr><td><b>chi phí bước</b></td><td>mỗi bước 1</td></tr></table>
          <p>Lời giải là một <b>dãy hành động</b> từ trạng thái đầu tới đích; lời giải <b>tối ưu</b> có tổng chi phí nhỏ nhất.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2]
        say: "Bảng phát biểu trò xếp ô số bằng năm thành phần. Trạng thái là vị trí của 8 ô số và ô trống. Trạng thái đầu là một cách xếp cụ thể ghi trên màn hình. Hành động là đẩy ô trống lên, xuống, trái hay phải, nếu còn nằm trong bảng. Kiểm tra đích là so với cách xếp đích. Chi phí mỗi bước là 1. Lời giải là một dãy hành động từ trạng thái đầu tới đích, và lời giải tối ưu có tổng chi phí nhỏ nhất."
      - show: |
          <p>Vì sao 181 440? Có $9! = 362\,880$ cách đặt 9 ô (kể cả ô trống), nhưng mỗi bước đẩy giữ nguyên tính chẵn lẻ của một đại lượng — chỉ đúng <b>một nửa</b> đạt được: $\frac{9!}{2} = \hl{181\,440}$.</p>
          <p><b>Tìm theo chiều rộng</b>: mở mọi trạng thái cách đầu 1 bước, rồi 2 bước… <b>Tìm chi phí đều</b>: luôn mở trạng thái có tổng chi phí từ đầu <b>nhỏ nhất</b> (như Dijkstra).</p>
        introduces: [factorial, frac]
        focus: [1, 1, 1, 2, 2]
        say: "Vì sao lại là 181 nghìn 440? Có 9 giai thừa, tức 362 nghìn 880 cách đặt 9 ô kể cả ô trống. Nhưng mỗi bước đẩy giữ nguyên tính chẵn lẻ của một đại lượng, nên chỉ đúng một nửa là đạt được, tức 9 giai thừa chia 2. Tìm theo chiều rộng mở mọi trạng thái cách đầu 1 bước, rồi 2 bước, và cứ thế. Tìm chi phí đều luôn mở trạng thái có tổng chi phí từ đầu nhỏ nhất, giống thuật toán đường đi ngắn nhất trọng số không âm."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai cách lan ra: theo số cạnh, hay theo chi phí"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360">
          <g stroke="#6b7280" stroke-width="3">
          <line x1="190" y1="180" x2="740" y2="60"/><line x1="190" y1="180" x2="740" y2="300"/><line x1="190" y1="180" x2="1290" y2="180"/>
          <line x1="740" y1="60" x2="1290" y2="180"/><line x1="740" y1="300" x2="1290" y2="180"/></g>
          <g font-size="26" font-weight="bold" fill="#b45309" text-anchor="middle">
          <text x="430" y="98">1</text><text x="430" y="290">5</text><text x="740" y="170">12</text><text x="1050" y="98">10</text><text x="1050" y="290">2</text></g>
          <g font-size="30" font-weight="bold" text-anchor="middle">
          <circle cx="190" cy="180" r="42" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="190" y="191" fill="#1f2937">S</text>
          <circle cx="740" cy="60" r="38" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="740" y="71" fill="#1f2937">A</text>
          <circle cx="740" cy="300" r="38" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="740" y="311" fill="#1f2937">B</text>
          <circle cx="1290" cy="180" r="42" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1290" y="191" fill="#1f2937">G</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình là đồ thị ta sẽ chạy, mỗi cạnh ghi chi phí. Từ S đi thẳng tới đích G tốn 12, qua A tốn 1 cộng 10, còn qua B tốn 5 cộng 2. Tìm theo chiều rộng lan ra theo số cạnh, còn tìm chi phí đều lan ra theo tổng chi phí."

  - id: example
    kind: example
    title: "Chạy thật: theo chiều rộng và theo chi phí đều"
    checks:
      - "alg.puz_bfs((7, 2, 4, 5, 0, 6, 8, 3, 1)) == (26, 178351)"
      - "[alg.graph_search({'S': {'A': 1, 'B': 5, 'G': 12}, 'A': {'G': 10}, 'B': {'G': 2}}, 'S', 'G', m)[:2] for m in ('bfs', 'ucs')] == [(['S', 'G'], 12), (['S', 'B', 'G'], 7)]"
    steps:
      - show: |
          <p>Tìm theo chiều rộng trên trò xếp ô số (trạng thái đầu ở trên): lời giải ngắn nhất <b>$\hl{26}$ bước</b>; trên đường đi đã sinh ra <b>178 351</b> trạng thái — gần hết 181 440.</p>
        say: "Chạy tìm theo chiều rộng trên trò xếp ô số với trạng thái đầu ở trên, lời giải ngắn nhất dài 26 bước. Trên đường đi, thuật toán đã sinh ra 178 nghìn 351 trạng thái, gần hết 181 nghìn 440."
      - clear: true
        show: |
          <p>Theo chiều rộng trên đồ thị ở hình: mở S, sinh A, B, G — <b>G vừa sinh ra là dừng</b> (chiều rộng kiểm đích khi sinh).</p>
          <table class="t"><tr><th>cách tìm</th><th>đường tìm được</th><th>chi phí</th></tr>
          <tr><td>theo chiều rộng (ít cạnh nhất)</td><td>S → G</td><td class="red">12</td></tr></table>
        focus: [1, "2.2"]
        say: "Trên đồ thị ở hình, tìm theo chiều rộng mở S và sinh ra A, B, G, rồi dừng ngay vì G vừa sinh ra là đích. Nó trả đường đi thẳng S tới G, chỉ một cạnh nhưng tốn 12."
      - clear: true
        show: |
          <p>Theo chi phí đều — mỗi lượt lấy ra mục <b>rẻ nhất</b> trong hàng đợi ưu tiên:</p>
          <table class="t"><tr><th>lượt</th><th>lấy ra</th><th>hàng đợi sau lượt (chi phí từ S)</th></tr>
          <tr><td>1</td><td>S (0)</td><td>A 1, B 5, G 12</td></tr>
          <tr><td>2</td><td>A (1)</td><td>B 5, G <b>11</b> (qua A: 1 + 10, rẻ hơn 12)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Giờ chạy tìm chi phí đều, mỗi lượt lấy ra mục rẻ nhất trong hàng đợi ưu tiên. Lượt một lấy S với chi phí 0, rồi đưa vào A 1, B 5 và G 12. Lượt hai lấy A, vì 1 là rẻ nhất, và thấy đường tới G qua A tốn 1 cộng 10 bằng 11, rẻ hơn 12, nên cập nhật G thành 11."
      - show: |
          <table class="t"><tr><th>lượt</th><th>lấy ra</th><th>hàng đợi sau lượt (chi phí từ S)</th></tr>
          <tr><td>3</td><td>B (5)</td><td>G <b>7</b> (qua B: 5 + 2, rẻ hơn 11)</td></tr>
          <tr><td>4</td><td>G (7) → <b>đích, dừng</b></td><td>đường S → B → G, chi phí $\hl{7}$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Lượt ba lấy B với chi phí 5, và đường tới G qua B tốn 5 cộng 2 bằng 7, rẻ hơn 11, nên cập nhật G thành 7. Lượt bốn lấy G ra với chi phí 7, đó là đích nên dừng, và đường rẻ nhất là S qua B tới G."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: liệt kê mọi đường"
    checks:
      - "sorted([1 + 10, 5 + 2, 12]) == [7, 11, 12]"
      - "alg.graph_search({'S': {'A': 1, 'B': 5, 'G': 12}, 'A': {'G': 10}, 'B': {'G': 2}}, 'S', 'G', 'ucs')[2] == ['S', 'A', 'B']"
    steps:
      - show: |
          <table class="t"><tr><th>đường từ S tới G</th><th>số cạnh</th><th>chi phí</th></tr>
          <tr><td>S → G</td><td>1</td><td>12</td></tr>
          <tr><td>S → A → G</td><td>2</td><td>1 + 10 = 11</td></tr>
          <tr><td>S → B → G</td><td>2</td><td>5 + 2 = $\hl{7}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì đồ thị nhỏ nên liệt kê hết mọi đường từ S tới G. Đi thẳng có 1 cạnh, tốn 12. Qua A có 2 cạnh, tốn 11. Qua B có 2 cạnh, tốn 7."
      - show: |
          <table class="t"><tr><th>điều kiểm</th><th>liệt kê cho</th><th>thuật toán cho</th></tr>
          <tr><td>ít cạnh nhất</td><td>S → G</td><td>chiều rộng: S → G ✓</td></tr>
          <tr><td>rẻ nhất</td><td>S → B → G, 7</td><td>chi phí đều: 7 ✓</td></tr>
          <tr><td>thứ tự mở</td><td>chi phí 0, 1, 5</td><td>S, A, B ✓</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Vậy đường ít cạnh nhất là đi thẳng, khớp kết quả tìm theo chiều rộng. Đường rẻ nhất là qua B, khớp tìm chi phí đều. Thứ tự mở S, A, B cũng đúng theo chi phí tăng dần 0, 1, 5."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng tìm theo chiều rộng khi chi phí bước khác nhau <b class="red">(mất tối ưu)</b>
          <br><span class="note">Chiều rộng tối ưu theo <b>số bước</b>, chỉ trùng tối ưu theo chi phí khi mọi bước cùng chi phí. Chi phí khác nhau → tìm chi phí đều.</span></div>
        say: "Lỗi thứ nhất, dùng tìm theo chiều rộng khi chi phí bước khác nhau, nên mất tính tối ưu. Chiều rộng tối ưu theo số bước, và chỉ trùng tối ưu theo chi phí khi mọi bước cùng chi phí. Chi phí khác nhau thì dùng tìm chi phí đều."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tìm chi phí đều mà dừng khi vừa SINH ra đích <b class="red">(trả đường đắt)</b>
          <br><span class="note">Ở ví dụ, đích G được sinh ra lần đầu qua S → G (chi phí 12). Chỉ khi LẤY G ra khỏi hàng đợi ưu tiên mới chắc đó là đường rẻ nhất (7).</span></div>
        say: "Lỗi thứ hai, tìm chi phí đều mà dừng ngay khi vừa sinh ra đích, nên trả đường đắt. Ở ví dụ, đích được sinh ra lần đầu qua cạnh đi thẳng với chi phí 12. Chỉ khi lấy đích ra khỏi hàng đợi ưu tiên mới chắc đó là đường rẻ nhất, chi phí 7."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên tập đã thăm <b class="red">(lặp trạng thái)</b>
          <br><span class="note">Đẩy ô trống sang trái rồi sang phải là về chỗ cũ. Không nhớ trạng thái đã thăm thì cây tìm kiếm chứa vô số bản sao, và có thể không bao giờ dừng.</span></div>
        say: "Lỗi thứ ba, quên tập đã thăm nên lặp trạng thái. Đẩy ô trống sang trái rồi sang phải là về chỗ cũ. Không nhớ trạng thái đã thăm thì cây tìm kiếm chứa vô số bản sao, và có thể không bao giờ dừng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[alg.graph_search({'S': {'A': 4, 'B': 1}, 'A': {'G': 1}, 'B': {'C': 1}, 'C': {'G': 1}}, 'S', 'G', m)[:2] for m in ('bfs', 'ucs')] == [(['S', 'A', 'G'], 5), (['S', 'B', 'C', 'G'], 3)]"
      - "math.factorial(16) // 2 == 10461394944000 and math.factorial(16) == 20922789888000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đồ thị S→A 4, S→B 1, A→G 1, B→C 1, C→G 1. Hai cách tìm cho đường nào, chi phí bao nhiêu?</td></tr>
          <tr><td>2</td><td>Trò xếp 15 ô số (bảng 4 × 4) có $\frac{16!}{2}$ trạng thái đạt được. Con số đó cỡ bao nhiêu? Tìm theo chiều rộng còn dùng được không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, đồ thị trên màn hình có năm cạnh với chi phí khác nhau. Hai cách tìm cho đường nào, và chi phí bao nhiêu? Câu hai, trò xếp 15 ô số trên bảng 4 nhân 4 có 16 giai thừa chia 2 trạng thái đạt được. Con số đó cỡ bao nhiêu, và tìm theo chiều rộng còn dùng được không? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>câu 1</th><th>đường</th><th>số cạnh</th><th>chi phí</th></tr>
          <tr><td>chiều rộng</td><td>S → A → G</td><td>2</td><td>4 + 1 = 5</td></tr>
          <tr><td>chi phí đều</td><td>S → B → C → G</td><td>3</td><td>1 + 1 + 1 = $\hl{3}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một. Tìm theo chiều rộng dừng khi sinh ra đích ở tầng 2, nên cho đường qua A, chi phí 4 cộng 1 bằng 5. Tìm chi phí đều cho đường qua B và C, 3 cạnh nhưng chỉ tốn 3."
      - clear: true
        show: |
          <p>② $16! = 20\,922\,789\,888\,000$, chia 2 được $\approx 1{,}05 \cdot 10^{13}$ trạng thái.</p>
          <p>Mỗi trạng thái cần vài byte; lưu hết là hàng chục nghìn tỉ byte trở lên → <b>không lưu được</b>. Cần tìm kiếm có <b>thông tin</b>: dùng một ước lượng để đi thẳng về phía đích.</p>
        introduces: [approx, cdot]
        focus: [1, 2, 2]
