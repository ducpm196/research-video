id: L09
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 9 — Suy diễn tiến, suy diễn lùi và luật Horn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L09; audit/aif/verify_aif.py L09; AIMA bản 4 (2020), mục 7.5.4 (thuật toán suy diễn tiến có bộ đếm tiền đề, ví dụ năm luật với sự kiện A, B); W. Dowling, J. Gallier (1984) — suy diễn tiến thời gian tuyến tính"
assumes: [arith, land, lto]
# Quy ước: luật Horn = luật có đúng một kết luận, viết “tiền đề ∧ … → kết luận”; tên “Horn” chỉ trên màn hình (probe p1: bản chép “hốc”),
#   lời đọc nói “luật có đúng một kết luận”. alg.forward_chain(luật, sự kiện) theo AIMA: bộ đếm số tiền đề chưa biết của từng luật, hàng đợi
#   các mệnh đề vừa biết; trả thứ tự mệnh đề MỚI suy ra. alg.backward_chain(luật, sự kiện, mục tiêu) có chặn vòng (mục tiêu đang chứng minh dở).
objectives:
  - "Chạy suy diễn tiến đến khi không suy thêm được"
  - "Chạy suy diễn lùi từ một mục tiêu"
  - "So sánh hai chiều và giới hạn của luật Horn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Không liệt kê mô hình mà vẫn suy ra được"
    checks:
      - "2 ** 7 == 128"
    steps:
      - show: |
          <p>Bài trước: kiểm kéo theo lôgic bằng liệt kê $2^n$ mô hình. Với 7 mệnh đề đã là 128 mô hình, với 1000 mệnh đề thì vô vọng. Nhưng nhiều tri thức có dạng đơn giản: “nếu A và B thì L”. Với dạng này, máy chỉ cần <b>đi theo luật</b>.</p>
          <div class="box key">Hôm nay: <b>suy diễn tiến</b> (từ sự kiện đi ra) và <b>suy diễn lùi</b> (từ mục tiêu đi vào) trên các luật có đúng một kết luận.</div>
        introduces: [power]
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, ở bài trước ta kiểm kéo theo logic bằng liệt kê 2 mũ n mô hình. Với 7 mệnh đề đã là 128 mô hình, với 1000 mệnh đề thì vô vọng. Nhưng nhiều tri thức có dạng đơn giản, nếu A và B thì L. Với dạng này, máy chỉ cần đi theo luật. Hôm nay ta học suy diễn tiến, đi từ sự kiện ra, và suy diễn lùi, đi từ mục tiêu vào, trên các luật có đúng một kết luận."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: một bước suy luận theo luật"
    checks:
      - "alg.pl_entails(lambda m: (not m['P'] or m['Q']) and m['P'], lambda m: m['Q'], ['P', 'Q'])[0]"
    steps:
      - show: |
          <table class="t"><tr><th>đã biết</th><th>luật</th><th>suy ra</th></tr>
          <tr><td>$P$</td><td>$P \to Q$</td><td>$Q$</td></tr>
          <tr><td>$Q$</td><td>$Q \to R$</td><td>$R$</td></tr></table>
          <p class="note">Ở bài 8, tri thức { $P \to Q$, $Q \to R$, $P$ } kéo theo $R$ — liệt kê 8 mô hình cũng ra đúng điều này.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Ở bài 8, ta đã kiểm bằng liệt kê 8 mô hình rằng tri thức gồm P kéo theo Q, Q kéo theo R, và P, kéo theo logic R. Cùng kết quả đó đi được bằng từng bước theo luật. Biết P và có luật P kéo theo Q thì suy ra Q. Biết Q và có luật Q kéo theo R thì suy ra R, không cần liệt kê mô hình nào."

  - id: sym
    kind: symbol
    title: "Giải mã: luật Horn, suy diễn tiến, suy diễn lùi"
    steps:
      - show: |
          <p><b>Luật Horn</b>: luật có đúng một kết luận, $A \land B \to L$. Một <b>sự kiện</b> là luật không có tiền đề: $A$.</p>
          <table class="t"><tr><th>cách</th><th>làm gì</th></tr>
          <tr><td><b>suy diễn tiến</b></td><td>mỗi luật giữ một bộ đếm “số tiền đề chưa biết”; biết thêm một mệnh đề thì giảm bộ đếm các luật chứa nó; bộ đếm về 0 → biết kết luận; lặp tới khi không còn gì mới</td></tr>
          <tr><td><b>suy diễn lùi</b></td><td>muốn chứng minh $Q$: hoặc $Q$ là sự kiện, hoặc tìm luật kết luận $Q$ và chứng minh từng tiền đề của nó; mục tiêu đang chứng minh dở thì không dùng lại (tránh vòng)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.2", "2.3", "2.3"]
        say: "Ta xét các luật có đúng một kết luận, ví dụ A và B kéo theo L. Một sự kiện là luật không có tiền đề, như A. Bảng giới thiệu hai cách suy diễn. Suy diễn tiến cho mỗi luật một bộ đếm số tiền đề chưa biết. Biết thêm một mệnh đề thì giảm bộ đếm của các luật chứa nó, bộ đếm về 0 thì biết kết luận, và lặp tới khi không còn gì mới. Suy diễn lùi muốn chứng minh Q thì hoặc Q là sự kiện, hoặc tìm luật kết luận Q rồi chứng minh từng tiền đề của nó. Mục tiêu đang chứng minh dở thì không dùng lại, để tránh vòng lặp."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Luật nối các mệnh đề thành một mạng"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><defs><marker id="arA9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
          <g stroke="#6b7280" stroke-width="3" fill="none">
          <line x1="750" y1="125" x2="750" y2="72" marker-end="url(#arA9)"/>
          <line x1="560" y1="205" x2="725" y2="135" marker-end="url(#arA9)"/><line x1="940" y1="205" x2="775" y2="135" marker-end="url(#arA9)"/>
          <line x1="595" y1="225" x2="905" y2="225" marker-end="url(#arA9)"/><line x1="770" y1="310" x2="915" y2="245" marker-end="url(#arA9)"/>
          <line x1="470" y1="305" x2="530" y2="250" marker-end="url(#arA9)"/><line x1="725" y1="315" x2="590" y2="245" marker-end="url(#arA9)"/>
          <path d="M725,115 C600,100 560,140 552,182" stroke-dasharray="8 6" marker-end="url(#arA9)"/></g>
          <g font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">
          <circle cx="750" cy="45" r="30" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="750" y="55">Q</text>
          <circle cx="750" cy="150" r="30" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="750" y="160">P</text>
          <circle cx="560" cy="225" r="30" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="560" y="235">L</text>
          <circle cx="940" cy="225" r="30" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="940" y="235">M</text>
          <circle cx="450" cy="330" r="30" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="450" y="340">A</text>
          <circle cx="750" cy="330" r="30" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="340">B</text></g>
          <g font-size="23" fill="#1f2937"><text x="1050" y="320">xanh dương: sự kiện đã biết</text><text x="1050" y="60">xanh lục: mục tiêu</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ năm luật thành một mạng, mũi tên đi từ tiền đề tới kết luận. Hai sự kiện A và B ở đáy tô xanh dương, mục tiêu Q ở đỉnh tô xanh lục. Suy diễn tiến lan từ đáy lên theo mũi tên, còn suy diễn lùi đi từ đỉnh xuống, và đường nét đứt từ P về L là một vòng có thể làm suy diễn lùi lặp mãi."

  - id: example
    kind: example
    title: "Năm luật, hai sự kiện"
    checks:
      - "alg.forward_chain([({'P'}, 'Q'), ({'L', 'M'}, 'P'), ({'B', 'L'}, 'M'), ({'A', 'P'}, 'L'), ({'A', 'B'}, 'L')], ['A', 'B']) == ['L', 'M', 'P', 'Q']"
      - "alg.backward_chain([({'P'}, 'Q'), ({'L', 'M'}, 'P'), ({'B', 'L'}, 'M'), ({'A', 'P'}, 'L'), ({'A', 'B'}, 'L')], {'A', 'B'}, 'Q')"
    steps:
      - show: |
          <p>Luật: (1) $P \to Q$, (2) $L \land M \to P$, (3) $B \land L \to M$, (4) $A \land P \to L$, (5) $A \land B \to L$. Sự kiện: $A$, $B$.</p>
          <table class="t"><tr><th>luật</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>bộ đếm lúc đầu</td><td>1</td><td>2</td><td>2</td><td>2</td><td>2</td></tr></table>
        focus: [1, "2.2"]
        say: "Có năm luật và hai sự kiện A, B như trên màn hình. Lúc đầu, bộ đếm của mỗi luật bằng số tiền đề của nó, luật 1 là 1, các luật còn lại là 2."
      - clear: true
        show: |
          <table class="t"><tr><th>vừa biết</th><th>giảm bộ đếm</th><th>bộ đếm về 0</th><th>suy ra</th></tr>
          <tr><td>A</td><td>luật 4: 1, luật 5: 1</td><td>—</td><td>—</td></tr>
          <tr><td>B</td><td>luật 3: 1, luật 5: 0</td><td>luật 5</td><td>$\hl{L}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Suy diễn tiến lấy lần lượt từng mệnh đề vừa biết. Biết A thì bộ đếm luật 4 và luật 5 giảm còn 1, chưa luật nào về 0. Biết B thì luật 3 còn 1 và luật 5 về 0, nên suy ra L."
      - show: |
          <table class="t"><tr><th>vừa biết</th><th>giảm bộ đếm</th><th>bộ đếm về 0</th><th>suy ra</th></tr>
          <tr><td>L</td><td>luật 2: 1, luật 3: 0</td><td>luật 3</td><td>$\hl{M}$</td></tr>
          <tr><td>M</td><td>luật 2: 0</td><td>luật 2</td><td>$\hl{P}$</td></tr>
          <tr><td>P</td><td>luật 1: 0, luật 4: 0</td><td>luật 1 (luật 4 cho L đã biết)</td><td>$\hl{Q}$</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Biết L thì luật 3 về 0, suy ra M. Biết M thì luật 2 về 0, suy ra P. Biết P thì luật 1 về 0, suy ra Q, còn luật 4 cũng về 0 nhưng cho L đã biết rồi."
      - clear: true
        show: |
          <p><b>Suy diễn lùi</b> cho $Q$, từ trên xuống:</p>
          <div class="chain"><span class="n">Q: luật 1 cần P</span><span class="a">→</span><span class="n">P: luật 2 cần L và M</span><span class="a">→</span><span class="n">L: luật 4 cần P, đang chứng minh dở, BỎ</span><span class="a">→</span><span class="n">L: luật 5, A và B là sự kiện ✓</span><span class="a">→</span><span class="n">M: luật 3, B ✓ và L ✓</span></div>
        focus: [1, 2, 2, 2]
        say: "Suy diễn lùi thì đi theo chiều ngược lại, bắt đầu từ mục tiêu Q rồi đi xuống. Q cần P theo luật 1, và P cần L và M theo luật 2. Để có L, thử luật 4 thì cần P đang chứng minh dở nên bỏ, thử luật 5 thì A và B đều là sự kiện. M cần B và L, cả hai đều đã có, nên Q được chứng minh."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê mô hình cũng ra Q"
    checks:
      - "alg.pl_entails(lambda m: (not m['P'] or m['Q']) and (not (m['L'] and m['M']) or m['P']) and (not (m['B'] and m['L']) or m['M']) and (not (m['A'] and m['P']) or m['L']) and (not (m['A'] and m['B']) or m['L']) and m['A'] and m['B'], lambda m: m['Q'], ['A', 'B', 'L', 'M', 'P', 'Q']) == (True, 1, 64)"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm của bài 8</th><th>kết quả</th></tr>
          <tr><td>6 mệnh đề → $2^6 = 64$ mô hình</td><td>chỉ 1 mô hình làm đúng cả 5 luật và 2 sự kiện</td></tr>
          <tr><td>ở mô hình đó, $Q$ đúng?</td><td>đúng → KB kéo theo Q ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, dùng cách liệt kê mô hình của bài 8, vì hai cách phải cho cùng kết luận. Sáu mệnh đề cho 64 mô hình, và chỉ 1 mô hình làm đúng cả năm luật lẫn hai sự kiện. Ở mô hình đó Q đúng, nên tri thức kéo theo Q, khớp với cả suy diễn tiến lẫn suy diễn lùi."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Suy diễn lùi không chặn vòng <b class="red">(lặp vô tận)</b>
          <br><span class="note">Ở ví dụ, chứng minh $L$ bằng luật 4 cần $P$, mà $P$ lại cần $L$. Không ghi nhớ mục tiêu đang chứng minh dở thì chương trình đệ quy mãi.</span></div>
        say: "Lỗi thứ nhất, suy diễn lùi không chặn vòng nên lặp vô tận. Ở ví dụ, chứng minh L bằng luật 4 cần P, mà P lại cần L. Không ghi nhớ mục tiêu đang chứng minh dở thì chương trình đệ quy mãi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng suy diễn tiến khi chỉ cần trả lời một câu hỏi <b class="red">(làm thừa)</b>
          <br><span class="note">Suy diễn tiến suy ra MỌI thứ suy được, kể cả thứ không liên quan. Hỏi một mục tiêu cụ thể thì suy diễn lùi chỉ chạm các luật dẫn tới mục tiêu đó.</span></div>
        say: "Lỗi thứ hai, dùng suy diễn tiến khi chỉ cần trả lời một câu hỏi, nên làm thừa. Suy diễn tiến suy ra mọi thứ suy được, kể cả thứ không liên quan. Hỏi một mục tiêu cụ thể thì suy diễn lùi chỉ chạm các luật dẫn tới mục tiêu đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Áp dụng cho câu không phải dạng Horn <b class="red">(bỏ sót kết luận)</b>
          <br><span class="note">Tri thức “$A \lor B$” và “không $A$” (bài trước) kéo theo $B$, nhưng “$A \lor B$” không phải luật có một kết luận — suy diễn tiến không suy ra được. Khi đó cần kiểm mô hình hay phương pháp tổng quát hơn.</span></div>
        introduces: [lor]
        say: "Lỗi thứ ba, áp dụng cho câu không phải dạng luật một kết luận, nên bỏ sót kết luận. Tri thức A hoặc B, và không A, kéo theo B như ở bài trước, nhưng A hoặc B không phải luật có một kết luận, nên suy diễn tiến không suy ra được. Khi đó cần kiểm mô hình, hay một phương pháp tổng quát hơn."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.forward_chain([({'C'}, 'D'), ({'D', 'E'}, 'F'), ({'C'}, 'E'), ({'F', 'G'}, 'H')], ['C']) == ['D', 'E', 'F'] and not alg.backward_chain([({'C'}, 'D'), ({'D', 'E'}, 'F'), ({'C'}, 'E'), ({'F', 'G'}, 'H')], {'C'}, 'H')"
    steps:
      - show: |
          <p>Luật: $C \to D$, $D \land E \to F$, $C \to E$, $F \land G \to H$. Sự kiện: $C$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Suy diễn tiến suy ra những gì, theo thứ tự nào?</td></tr>
          <tr><td>2</td><td>Suy diễn lùi có chứng minh được $H$ không? Vì sao?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Có bốn luật và một sự kiện C như trên màn hình. Câu một, suy diễn tiến suy ra những gì, theo thứ tự nào? Câu hai, suy diễn lùi có chứng minh được H không, và vì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>vừa biết</th><th>bộ đếm về 0</th><th>suy ra</th></tr>
          <tr><td>C</td><td>luật 1, luật 3</td><td>D, E</td></tr>
          <tr><td>D</td><td>— (luật 2 còn chờ E)</td><td>—</td></tr>
          <tr><td>E</td><td>luật 2</td><td>F</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, chạy từng bước. Biết C thì luật 1 và luật 3 về 0, suy ra D rồi E. Biết D thì luật 2 còn chờ E. Biết E thì luật 2 về 0, suy ra F, nên thứ tự là D, E, F."
      - show: |
          <p>② <b>Không</b>: H cần F và G; F chứng minh được, nhưng <b>không có sự kiện hay luật nào cho G</b> → suy diễn lùi thất bại ở G.</p>
        say: "Câu hai, không. H cần F và G, F chứng minh được, nhưng không có sự kiện hay luật nào kết luận G, nên suy diễn lùi thất bại ở G."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">luật một kết luận</span><span class="a">→</span>
          <span class="n">tiến: bộ đếm tiền đề, suy ra mọi thứ</span><span class="a">→</span>
          <span class="n">lùi: từ mục tiêu, chặn vòng</span><span class="a">→</span>
          <span class="n">ngoài dạng Horn thì cần cách tổng quát</span></div>
        say: "Tổng kết lại, với luật có một kết luận, suy diễn tiến dùng bộ đếm tiền đề và suy ra mọi thứ, còn suy diễn lùi đi từ mục tiêu và phải chặn vòng. Ngoài dạng này thì cần cách tổng quát hơn."
      - show: |
          <div class="box key"><b>Tư duy:</b> chọn <b>chiều</b> suy luận theo câu hỏi — biết nhiều sự kiện, cần mọi hệ quả thì đi tiến; có một câu hỏi thì đi lùi.</div>
        say: "Điều cần mang theo, hãy chọn chiều suy luận theo câu hỏi. Biết nhiều sự kiện và cần mọi hệ quả thì đi tiến, có một câu hỏi cụ thể thì đi lùi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>lập kế hoạch</b> — biểu diễn hành động bằng điều kiện và hiệu ứng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học lập kế hoạch, biểu diễn hành động bằng điều kiện và hiệu ứng. Hẹn gặp bạn ở bài tiếp theo."
