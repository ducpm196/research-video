- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">biến, miền, ràng buộc</span><span class="a">→</span>

      <span class="n">quay lui khi vi phạm</span><span class="a">→</span>

      <span class="n">kiểm tra tiến: thấy miền rỗng thì lùi sớm</span><span class="a">→</span>

      <span class="n">gán biến khó nhất trước</span></div>

      '
    say: Tổng kết lại, bài toán thoả ràng buộc quy bài toán thực tế về ba thành phần gồm biến, miền giá trị và tập ràng buộc. Thay vì gán mù toàn bộ biến gây bùng nổ tổ hợp, ta gán từng biến và quay lui ngay tại chỗ khi có vi phạm. Kiểm tra tiến giúp xoá sớm giá trị xung đột ở các biến hàng xóm để phát hiện miền rỗng và lùi tức thì. Tận dụng cấu trúc ràng buộc biến bước kiểm tra bị động thành lực đẩy chủ động cắt gọn triệt để không gian tổ hợp mũ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="chain"><span class="n">biến, miền, ràng buộc</span><span class="a">→</span>

      <span class="n">quay lui khi vi phạm</span><span class="a">→</span>

      <span class="n">kiểm tra tiến: thấy miền rỗng thì lùi sớm</span><span class="a">→</span>

      <span class="n">gán biến khó nhất trước</span></div>

      '
    say: Kết hợp ưu tiên biến còn ít giá trị nhất ép cây tìm kiếm gãy nhánh, giảm đáng kể số lần thử sai. Hãy nhớ lập đủ danh sách cạnh ràng buộc khi áp dụng vào bài thực hành tô màu sáu vùng hôm nay. Nếu quay lui đơn thuần hoạt động thụ động chờ tới lúc đụng tường mới lùi, kiểm tra tiến đóng vai trò phát hiện trước ngõ cụt ngay sau mỗi bước gán. Hơn thế nữa, chọn biến còn ít lựa chọn nhất kết hợp phá thế hòa bằng số lượng biến hàng xóm ràng buộc giúp giữ nhánh hẹp ngay từ đỉnh cây. Trên nhiều bài toán lập lịch công nghiệp hay chia ca trực có hàng trăm biến, bộ đôi kỹ thuật cắt nhánh này giải quyết gọn trong tích tắc thay vì treo máy nhiều giờ. Ngoài bản đồ chuẩn, bạn cũng có thể áp dụng nguyên lý y hệt cho bài toán xếp ô số hay xếp lịch không trùng giờ. Thực hành đếm mọi cấu hình và lọc lời giải đúng trên bản đồ sáu vùng ngay bây giờ. Với các đỉnh độc lập hoặc không có cạnh nối trong đầu vào, điều kiện kiểm tra cạnh kề vẫn tự động thoả mãn để không bỏ sót cấu hình hợp lệ nào.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
