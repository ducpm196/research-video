    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Bước ba gán vùng Q màu lam, vì miền của nó chỉ còn một màu, và Lãnh thổ Bắc chỉ còn màu lục. Bước bốn gán Lãnh thổ Bắc màu lục, nên Tây Úc chỉ còn màu lam. Ba bước cuối gán nốt Tây Úc, vùng V, và đảo, tổng cộng 7 lần gán cho 7 biến. Kiểm tra tiến không chỉ thu hẹp miền ứng viên tức thì mà còn giúp phát hiện sớm biến mất hết lựa chọn hợp lệ trước khi đi sâu. Quá trình gán liên hoàn từ bước ba tới bước bảy chứng minh phương pháp chọn biến thông minh loại bỏ hoàn toàn công việc quay lui thừa.
  - show: '<p><b>Bước 4 — đếm số nghiệm hợp lệ tô màu đồ thị bằng Python</b>:</p><div class="code"><div>edges = [(0,1),(0,2),(1,2),(1,3),(2,3),(3,4),(4,5),(2,5)]</div><div>n, k, ok = 6, 3, 0</div><div>for m in range(k ** n):</div><div>    c = [(m // (k ** i)) % k for i in range(n)]</div><div>    if all(c[u] != c[v] for u, v in edges): ok += 1</div><div>print(f&#x27;tot={k**n} ok={ok}&#x27;)</div></div>'
