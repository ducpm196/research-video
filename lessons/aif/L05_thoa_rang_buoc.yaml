- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Gán theo thứ tự tuỳ ý <b class="red">(phát hiện sai muộn)</b>

      <br><span class="note">Gán vùng ít ràng buộc trước thì lỗi chỉ lộ ra ở vùng giáp nhiều nơi, khi đã đi sâu. Gán biến “khó” trước để thất bại sớm, rẻ.</span></div>

      '
    say: Lỗi thứ nhất, gán theo thứ tự tuỳ ý nên phát hiện sai muộn. Gán vùng ít ràng buộc trước thì lỗi chỉ lộ ra ở vùng giáp nhiều nơi, khi đã đi sâu. Hãy gán biến khó trước để thất bại sớm và rẻ. Thứ tự chọn biến tuỳ tiện dễ đẩy mâu thuẫn xuống tận cuối cây tìm kiếm, buộc bộ giải phải lặp lại vô ích hàng triệu phép thử ở trên.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Nghĩ lan truyền ràng buộc (như kiểm tra tiến) thay được tìm kiếm <b class="red">(không đủ)</b>

      <br><span class="note">Kiểm tra tiến chỉ xoá giá trị chắc chắn sai. Khi các miền còn nhiều giá trị, vẫn phải thử và quay lui.</span></div>

      '
    say: Lỗi thứ hai, nghĩ lan truyền ràng buộc, như kiểm tra tiến, thay được tìm kiếm, như vậy không đủ. Kiểm tra tiến chỉ xoá những giá trị chắc chắn sai. Khi các miền còn nhiều giá trị, vẫn phải thử và quay lui. Lan truyền ràng buộc giữ cho miền luôn nhất quán cục bộ nhưng vẫn cần tìm kiếm quay lui mỗi khi còn từ hai lựa chọn đối xứng trở lên.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Bỏ qua cấu trúc độc lập <b class="red">(làm thừa)</b>

      <br><span class="note">Đảo phía nam không giáp vùng nào: giải riêng, nhân số cách. Đồ thị ràng buộc tách thành nhiều phần thì giải từng phần — 18 = 6 cách cho đất liền × 3 màu cho đảo.</span></div>

      '
    say: Lỗi thứ ba, bỏ qua cấu trúc độc lập nên làm thừa. Đảo phía nam không giáp vùng nào, nên giải riêng rồi nhân số cách. Đồ thị ràng buộc tách thành nhiều phần thì giải từng phần, 18 bằng 6 cách cho đất liền nhân 3 màu cho đảo. Tách nhỏ đồ thị ràng buộc thành các thành phần liên thông rời rạc cho phép giải song song từng phần rồi gộp lại cực nhanh.
