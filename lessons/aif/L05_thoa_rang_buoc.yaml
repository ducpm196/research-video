    - 2
    - 0
    say: Câu hai, hình cho thấy ba vùng đó đôi một giáp nhau, tạo thành một tam giác. Vì vậy cần 3 màu khác nhau, không có cách tô đúng nào với 2 màu, và vét cạn bằng máy cũng cho 0 lời giải. Chỉ cần phát hiện một cụm tam giác ba vùng kề nhau bất kỳ, ta khẳng định ngay bài toán vô nghiệm khi số màu nhỏ hơn ba.
