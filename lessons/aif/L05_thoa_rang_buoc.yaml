scenes:
- id: hook
  kind: hook
  title: 'Tô 3 màu cho 7 vùng: 2187 cách, chỉ 18 đúng'
  checks:
  - alg.csp_count() == (2187, 18)
  steps:
  - show: '<p>Tô bản đồ 7 vùng của Úc bằng 3 màu, hai vùng giáp nhau phải khác màu. Có $3^7 = 2187$ cách tô, chỉ <b>18</b> cách đúng. Thử hết thì được, nhưng với 100 vùng thì $3^{100}$ cách — không thể thử hết.</p>

      <div class="box key">Hôm nay: <b>bài toán thoả ràng buộc</b> — mô tả bằng biến và ràng buộc, rồi dùng chính ràng buộc để cắt bớt không gian tìm kiếm.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, ta tô bản đồ 7 vùng của Úc bằng 3 màu, hai vùng giáp nhau phải khác màu. Có 3 mũ 7, tức 2187 cách tô, nhưng chỉ 18 cách đúng. Thử hết thì được, nhưng với 100 vùng thì có 3 mũ 100 cách, không thể thử hết. Hôm nay ta học bài toán thoả ràng buộc, mô tả bằng biến và ràng buộc, rồi dùng chính ràng buộc để cắt bớt không gian tìm kiếm. Mấu chốt nằm ở việc xoá ngay các giá trị xung đột ở hàng xóm vừa khi vừa gán xong một biến. Phối hợp thêm thứ tự ưu tiên biến bó hẹp nhất giúp giải nhanh hàng loạt bài toán xếp lịch hay phân kênh phức tạp. Mấu chốt nằm ở việc xoá ngay các giá trị xung đột ở hàng xóm ngay khi vừa gán xong một biến. Phối hợp thêm thứ tự ưu tiên biến bó hẹp nhất giúp giải nhanh hàng loạt bài toán xếp lịch phức tạp. Hôm nay bạn sẽ thấy bài toán bản đồ giảm từ hàng chục bước thử sai về đúng một mạch thẳng tắp. Đưa kiến thức ràng buộc ngay vào từng bước chọn biến thay vì đợi gán hết rồi mới kiểm tra giúp chặt đứt hàng nghìn nhánh chết ngay từ gốc.
- id: prereq
  kind: prereq
  title: 'Ôn lại: đồ thị và quay lui'
  checks:
  - sum(1 for e in alg.AUS_EDGES if 'SA' in e) == 5
  - len([s for s in __import__('itertools').product('01', repeat=2)]) == 4
  steps:
  - show: '<p><b>Đồ thị:</b> đỉnh nối với nhau bằng cạnh; <b>bậc</b> của một đỉnh là số cạnh chạm nó. Ở bản đồ Úc, vùng SA giáp 5 vùng nên có bậc 5.</p>

      '
    say: Trước hết, ta cần hiểu đồ thị. Đồ thị gồm các đỉnh nối với nhau bằng cạnh, và bậc của một đỉnh là số cạnh chạm vào nó. Ở bản đồ Úc, mỗi vùng là một đỉnh, hai vùng giáp nhau nối bằng một cạnh, và vùng Nam Úc giáp 5 vùng nên có bậc 5. Đỉnh có bậc cao nhất trong đồ thị ràng buộc chính là nút nắm quyền kiểm soát chặt chẽ nhất các miền giá trị của hàng xóm xung quanh.
  - show: '<p><b>Quay lui</b>: chọn từng phần một; chọn xong hết thì ghi nhận, hết lựa chọn ở một chỗ thì <b>lùi</b> về chỗ trước để đổi lựa chọn.</p>

      <table class="t"><tr><th>liệt kê dãy 2 chữ số 0/1</th><th>đã chọn</th><th>làm gì tiếp</th></tr>

      <tr><td>bước 1</td><td>0</td><td>chọn tiếp chữ số thứ hai</td></tr>

      <tr><td>bước 2</td><td>0 0 → ghi nhận</td><td>lùi lại, đổi chữ số thứ hai thành 1</td></tr>

      <tr><td>bước 3</td><td>0 1 → ghi nhận</td><td>chữ số thứ hai hết lựa chọn → lùi về chữ số đầu, đổi thành 1</td></tr>

      <tr><td>bước 4</td><td>1 0, rồi 1 1 → ghi nhận</td><td>hết lựa chọn ở mọi chỗ → xong, đủ 4 dãy</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.5'
    say: Tiếp theo là quay lui, tức chọn từng phần một, chọn xong hết thì ghi nhận, còn hết lựa chọn ở một chỗ thì lùi về chỗ trước để đổi lựa chọn. Thử liệt kê mọi dãy 2 chữ số 0 và 1. Bước một chọn 0 cho chữ số đầu. Bước hai chọn 0 cho chữ số thứ hai, ghi nhận dãy 0 0, rồi lùi lại đổi chữ số thứ hai thành 1. Bước ba ghi nhận dãy 0 1, chữ số thứ hai hết lựa chọn nên lùi về chữ số đầu và đổi nó thành 1. Bước bốn ghi nhận 1 0 rồi 1 1, hết lựa chọn ở mọi chỗ, ta có đủ 4 dãy. Cơ chế quay lui giải phóng trí nhớ ngay tại chỗ mỗi khi đâm vào ngõ cụt và lùi lại thử giá trị khả dĩ kế tiếp.
- id: sym
  kind: symbol
  title: 'Giải mã: biến, miền, ràng buộc và ba kỹ thuật'
  checks:
  - len(alg.AUS_REGIONS) == 7 and len(alg.AUS_EDGES) == 9
  steps:
  - show: '<table class="t"><tr><th>thành phần</th><th>tô bản đồ Úc</th></tr>

      <tr><td><b>biến</b></td><td>7 vùng: WA, NT, SA, Q, NSW, V, T</td></tr>

      <tr><td><b>miền giá trị</b></td><td>{đỏ, lục, lam} cho mỗi vùng</td></tr>

      <tr><td><b>ràng buộc</b></td><td>9 cặp vùng giáp nhau phải khác màu (T là đảo, không giáp vùng nào)</td></tr></table>

      <p class="note">Tên viết tắt: WA Tây Úc, NT Lãnh thổ Bắc, SA Nam Úc, Q Queensland, NSW New South Wales, V Victoria, T đảo Tasmania.</p>

      <table class="t"><tr><th>kỹ thuật</th><th>làm gì</th></tr>

      <tr><td><b>quay lui</b></td><td>gán từng biến; vi phạm ràng buộc thì lùi lại đổi giá trị</td></tr>

      <tr><td><b>kiểm tra tiến</b></td><td>gán xong một biến thì xoá giá trị đó khỏi miền của các láng giềng; miền nào rỗng thì lùi NGAY</td></tr>

      <tr><td><b>chọn biến ít giá trị nhất</b></td><td>gán trước biến còn ít lựa chọn nhất; hòa thì chọn biến ràng buộc nhiều biến khác nhất</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 3
    - '3.2'
    - '3.3'
    - '3.4'
    - '3.4'
    say: Bảng đầu mô tả bài toán bằng ba thành phần. Biến là 7 vùng. Miền giá trị của mỗi vùng là đỏ, lục, lam. Ràng buộc là 9 cặp vùng giáp nhau phải khác màu, riêng đảo phía nam không giáp vùng nào. Bảng thứ hai giới thiệu ba kỹ thuật. Quay lui gán từng biến, vi phạm ràng buộc thì lùi lại đổi giá trị. Kiểm tra tiến, gán xong một biến thì xoá giá trị đó khỏi miền của các láng giềng, và miền nào rỗng thì lùi ngay. Chọn biến ít giá trị nhất, gán trước biến còn ít lựa chọn nhất, hòa thì chọn biến ràng buộc nhiều biến khác nhất. Biểu diễn chuẩn bài toán qua bộ ba biến, miền giá trị và tập ràng buộc mở đường cho một bộ giải tổng quát tách rời khỏi ngữ nghĩa riêng.
