    say: Ta gán theo một thứ tự cố định, mỗi vùng thử đỏ trước, rồi lục, rồi lam. Quay lui thường cần 18 lần gán, không đếm màu trùng vùng giáp đã tô vì bị loại ngay. Thêm kiểm tra tiến còn 16 lần. Thêm chọn biến ít giá trị nhất chỉ cần 7 lần, không phải lùi lần nào. So sánh ba chiến lược cho thấy việc kết hợp chọn biến còn ít giá trị nhất với lan truyền ràng buộc cắt giảm gán thử từ mười tám về đúng bảy bước không hề quay lui.
  - clear: true
    show: '<p>Vết chạy của cách thứ ba (miền = các màu còn được phép):</p>

      <table class="t"><tr><th>bước</th><th>gán</th><th>miền còn lại sau kiểm tra tiến</th></tr>

      <tr><td>1</td><td>SA = đỏ (bậc 5, ràng buộc nhiều nhất)</td><td>WA, NT, Q, NSW, V: {lục, lam}</td></tr>

      <tr><td>2</td><td>NSW = lục</td><td>Q: {lam}, V: {lam}</td></tr></table>

