    pause: 15
  - show: '<p>① $3^6 = 729$ cách tô; số cách đúng $= \frac{18}{3} = \hl{6}$, vì đảo độc lập và có 3 màu.</p>

      '
    say: Đáp án câu một, 3 mũ 6 bằng 729 cách tô. Vì đảo độc lập và có 3 màu, số cách đúng cho đất liền là 18 chia 3, bằng 6. Tách riêng hòn đảo ba lựa chọn khỏi đất liền sáu vùng biến phép chia tổ hợp phức tạp thành một phép chia số nguyên đơn giản.
  - show: '<div><svg width="700" height="230" viewBox="0 0 700 230"><g stroke="#b91c1c" stroke-width="4"><line x1="150" y1="170" x2="350" y2="50"/><line x1="350" y1="50" x2="550" y2="170"/><line x1="150" y1="170" x2="550" y2="170"/></g>

      <g font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937"><circle cx="150" cy="170" r="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="150" y="180">WA</text>

