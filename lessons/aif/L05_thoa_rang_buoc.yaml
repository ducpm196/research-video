  - show: '<div class="box key"><b>Tư duy:</b> ràng buộc không chỉ là điều kiện để kiểm — nó là <b>thông tin</b> để cắt bớt việc phải thử.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Bản đồ Úc 7 vùng có $3^7 = 2\,187$ cách gán, còn bài lập lịch 100 biến có $3^{100}$ trạng thái: chọn biến ít giá trị nhất kết hợp lan truyền ràng buộc cắt nhánh sớm gấp hàng tỉ lần so với vét cạn.</p>

      '
    say: Điều cần mang theo, ràng buộc không chỉ là điều kiện để kiểm, nó là thông tin để cắt bớt việc phải thử. Bản đồ Úc có hơn 2 nghìn cách tô. Chú ý tách biệt các thành phần độc lập và ưu tiên xử lý nút thắt trước là mẹo thiết thực cho mọi bài toán lập lịch thực tế.
