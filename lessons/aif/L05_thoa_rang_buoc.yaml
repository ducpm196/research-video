id: L05
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 5 — Bài toán thoả ràng buộc: quay lui, lan truyền ràng buộc, chọn biến ít giá trị nhất"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L05; audit/aif/verify_aif.py L05; AIMA bản 4 (2020), chương 6 (tô màu bản đồ Úc, kiểm tra tiến, chọn biến còn ít giá trị nhất); CS112 bài 14 (quay lui); DMS bài 18 (tô màu đồ thị)"
assumes: [arith, power]
# Quy ước: 7 vùng của Úc viết tắt trên màn hình (WA Tây Úc, NT Lãnh thổ Bắc, SA Nam Úc, Q, NSW, V, T là đảo phía nam); lời đọc nói “vùng”.
#   Màu 0, 1, 2 = đỏ, lục, lam. alg.csp_count() vét cạn; alg.csp_backtrack(thứ tự, cạnh, mrv=, forward=) trả (lời giải, số lần gán thử).
#   Thứ tự “xấu” WA, NSW, V, Q, NT, SA, T chọn để quay lui thường phải quay lại; MRV hoà thì chọn vùng giáp nhiều vùng chưa gán nhất.
objectives:
  - "Mô hình hoá bằng biến, miền giá trị, ràng buộc"
  - "Chạy quay lui có kiểm tra tiến"
  - "Dùng chọn biến còn ít giá trị nhất"
asr_reviewed:
  - {sentence: "Ở bài sau, bài 6, ta học trò chơi đối kháng, thuật toán cực đại cực tiểu, và cắt tỉa alpha beta.", reason: "ASR chép “Ở bài sau, bài sáu, ta học trò chơi đối kháng, thuộc toán cực đại cực tiểu và cắt tỉa an pha beta.” (0.851): beta đọc “bê-ta”, ASR viết “bê/beta”; alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: thuật/thuộc — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tô 3 màu cho 7 vùng: 2187 cách, chỉ 18 đúng"
    checks:
      - "alg.csp_count() == (2187, 18)"
    steps:
      - show: |
          <p>Tô bản đồ 7 vùng của Úc bằng 3 màu, hai vùng giáp nhau phải khác màu. Có $3^7 = 2187$ cách tô, chỉ <b>18</b> cách đúng. Thử hết thì được, nhưng với 100 vùng thì $3^{100}$ cách — không thể thử hết.</p>
          <div class="box key">Hôm nay: <b>bài toán thoả ràng buộc</b> — mô tả bằng biến và ràng buộc, rồi dùng chính ràng buộc để cắt bớt không gian tìm kiếm.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, ta tô bản đồ 7 vùng của Úc bằng 3 màu, hai vùng giáp nhau phải khác màu. Có 3 mũ 7, tức 2187 cách tô, nhưng chỉ 18 cách đúng. Thử hết thì được, nhưng với 100 vùng thì có 3 mũ 100 cách, không thể thử hết. Hôm nay ta học bài toán thoả ràng buộc, mô tả bằng biến và ràng buộc, rồi dùng chính ràng buộc để cắt bớt không gian tìm kiếm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: đồ thị và quay lui"
    checks:
      - "sum(1 for e in alg.AUS_EDGES if 'SA' in e) == 5"
      - "len([s for s in __import__('itertools').product('01', repeat=2)]) == 4"
    steps:
      - show: |
          <p><b>Đồ thị:</b> đỉnh nối với nhau bằng cạnh; <b>bậc</b> của một đỉnh là số cạnh chạm nó. Ở bản đồ Úc, vùng SA giáp 5 vùng nên có bậc 5.</p>
        say: "Trước hết, ta cần hiểu đồ thị. Đồ thị gồm các đỉnh nối với nhau bằng cạnh, và bậc của một đỉnh là số cạnh chạm vào nó. Ở bản đồ Úc, mỗi vùng là một đỉnh, hai vùng giáp nhau nối bằng một cạnh, và vùng Nam Úc giáp 5 vùng nên có bậc 5."
      - show: |
          <p><b>Quay lui</b>: chọn từng phần một; chọn xong hết thì ghi nhận, hết lựa chọn ở một chỗ thì <b>lùi</b> về chỗ trước để đổi lựa chọn.</p>
          <table class="t"><tr><th>liệt kê dãy 2 chữ số 0/1</th><th>đã chọn</th><th>làm gì tiếp</th></tr>
          <tr><td>bước 1</td><td>0</td><td>chọn tiếp chữ số thứ hai</td></tr>
          <tr><td>bước 2</td><td>0 0 → ghi nhận</td><td>lùi lại, đổi chữ số thứ hai thành 1</td></tr>
          <tr><td>bước 3</td><td>0 1 → ghi nhận</td><td>chữ số thứ hai hết lựa chọn → lùi về chữ số đầu, đổi thành 1</td></tr>
          <tr><td>bước 4</td><td>1 0, rồi 1 1 → ghi nhận</td><td>hết lựa chọn ở mọi chỗ → xong, đủ 4 dãy</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4", "2.5"]
        say: "Tiếp theo là quay lui, tức chọn từng phần một, chọn xong hết thì ghi nhận, còn hết lựa chọn ở một chỗ thì lùi về chỗ trước để đổi lựa chọn. Thử liệt kê mọi dãy 2 chữ số 0 và 1. Bước một chọn 0 cho chữ số đầu. Bước hai chọn 0 cho chữ số thứ hai, ghi nhận dãy 0 0, rồi lùi lại đổi chữ số thứ hai thành 1. Bước ba ghi nhận dãy 0 1, chữ số thứ hai hết lựa chọn nên lùi về chữ số đầu và đổi nó thành 1. Bước bốn ghi nhận 1 0 rồi 1 1, hết lựa chọn ở mọi chỗ, ta có đủ 4 dãy."

  - id: sym
    kind: symbol
    title: "Giải mã: biến, miền, ràng buộc và ba kỹ thuật"
    checks:
      - "len(alg.AUS_REGIONS) == 7 and len(alg.AUS_EDGES) == 9"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>tô bản đồ Úc</th></tr>
          <tr><td><b>biến</b></td><td>7 vùng: WA, NT, SA, Q, NSW, V, T</td></tr>
          <tr><td><b>miền giá trị</b></td><td>{đỏ, lục, lam} cho mỗi vùng</td></tr>
          <tr><td><b>ràng buộc</b></td><td>9 cặp vùng giáp nhau phải khác màu (T là đảo, không giáp vùng nào)</td></tr></table>
          <p class="note">Tên viết tắt: WA Tây Úc, NT Lãnh thổ Bắc, SA Nam Úc, Q Queensland, NSW New South Wales, V Victoria, T đảo Tasmania.</p>
          <table class="t"><tr><th>kỹ thuật</th><th>làm gì</th></tr>
          <tr><td><b>quay lui</b></td><td>gán từng biến; vi phạm ràng buộc thì lùi lại đổi giá trị</td></tr>
          <tr><td><b>kiểm tra tiến</b></td><td>gán xong một biến thì xoá giá trị đó khỏi miền của các láng giềng; miền nào rỗng thì lùi NGAY</td></tr>
          <tr><td><b>chọn biến ít giá trị nhất</b></td><td>gán trước biến còn ít lựa chọn nhất; hoà thì chọn biến ràng buộc nhiều biến khác nhất</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 3, "3.2", "3.3", "3.4"]
        say: "Bảng đầu mô tả bài toán bằng ba thành phần. Biến là 7 vùng. Miền giá trị của mỗi vùng là đỏ, lục, lam. Ràng buộc là 9 cặp vùng giáp nhau phải khác màu, riêng đảo phía nam không giáp vùng nào. Bảng thứ hai giới thiệu ba kỹ thuật. Quay lui gán từng biến, vi phạm ràng buộc thì lùi lại đổi giá trị. Kiểm tra tiến, gán xong một biến thì xoá giá trị đó khỏi miền của các láng giềng, và miền nào rỗng thì lùi ngay. Chọn biến ít giá trị nhất, gán trước biến còn ít lựa chọn nhất, hoà thì chọn biến ràng buộc nhiều biến khác nhất."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đồ thị ràng buộc của bản đồ Úc"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360">
          <g stroke="#6b7280" stroke-width="3">
          <line x1="250" y1="180" x2="560" y2="70"/><line x1="250" y1="180" x2="700" y2="200"/><line x1="560" y1="70" x2="700" y2="200"/>
          <line x1="560" y1="70" x2="900" y2="70"/><line x1="700" y1="200" x2="900" y2="70"/><line x1="700" y1="200" x2="1010" y2="200"/>
          <line x1="700" y1="200" x2="900" y2="310"/><line x1="900" y1="70" x2="1010" y2="200"/><line x1="1010" y1="200" x2="900" y2="310"/></g>
          <g font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">
          <circle cx="250" cy="180" r="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="250" y="190">WA</text>
          <circle cx="560" cy="70" r="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="560" y="80">NT</text>
          <circle cx="700" cy="200" r="46" fill="#ffedd5" stroke="#eb6834" stroke-width="4"/><text x="700" y="210">SA</text>
          <circle cx="900" cy="70" r="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="900" y="80">Q</text>
          <circle cx="1010" cy="200" r="44" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1010" y="210">NSW</text>
          <circle cx="900" cy="310" r="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="900" y="320">V</text>
          <circle cx="1300" cy="310" r="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1300" y="320">T</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ đồ thị ràng buộc, mỗi vùng là một đỉnh, hai vùng giáp nhau nối bằng một cạnh, tổng cộng 9 cạnh. Vùng Nam Úc ở giữa, tô viền cam, nối với 5 vùng nên khó tô nhất. Đảo phía nam đứng riêng, không cạnh nào, nên tô màu gì cũng được."

  - id: example
    kind: example
    title: "Cùng một bản đồ, ba cách tìm"
    checks:
      - "alg.csp_backtrack(['WA', 'NSW', 'V', 'Q', 'NT', 'SA', 'T'])[1] == 18 and alg.csp_backtrack(['WA', 'NSW', 'V', 'Q', 'NT', 'SA', 'T'], forward=True)[1] == 16"
      - "alg.csp_backtrack(['WA', 'NSW', 'V', 'Q', 'NT', 'SA', 'T'], mrv=True, forward=True) == ({'SA': 0, 'NSW': 1, 'Q': 2, 'NT': 1, 'WA': 2, 'V': 2, 'T': 0}, 7)"
    steps:
      - show: |
          <p>Gán theo thứ tự WA, NSW, V, Q, NT, SA, T, mỗi vùng thử đỏ trước, rồi lục, rồi lam:</p>
          <table class="t"><tr><th>cách tìm</th><th>số lần gán (không đếm màu trùng vùng giáp đã tô, bị loại ngay)</th></tr>
          <tr><td>quay lui thường</td><td>18</td></tr>
          <tr><td>quay lui + kiểm tra tiến</td><td>16</td></tr>
          <tr><td>+ chọn biến ít giá trị nhất</td><td>$\hl{7}$ — không phải lùi lần nào</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ta gán theo một thứ tự cố định, mỗi vùng thử đỏ trước, rồi lục, rồi lam. Quay lui thường cần 18 lần gán, không đếm màu trùng vùng giáp đã tô vì bị loại ngay. Thêm kiểm tra tiến còn 16 lần. Thêm chọn biến ít giá trị nhất chỉ cần 7 lần, không phải lùi lần nào."
      - clear: true
        show: |
          <p>Vết chạy của cách thứ ba (miền = các màu còn được phép):</p>
          <table class="t"><tr><th>bước</th><th>gán</th><th>miền còn lại sau kiểm tra tiến</th></tr>
          <tr><td>1</td><td>SA = đỏ (bậc 5, ràng buộc nhiều nhất)</td><td>WA, NT, Q, NSW, V: {lục, lam}</td></tr>
          <tr><td>2</td><td>NSW = lục</td><td>Q: {lam}, V: {lam}</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Xem vết chạy của cách thứ ba. Bước một gán Nam Úc màu đỏ, vì nó ràng buộc nhiều vùng nhất, và kiểm tra tiến xoá màu đỏ khỏi miền của 5 vùng láng giềng. Bước hai gán vùng phía đông nam màu lục, nên hai láng giềng của nó chỉ còn màu lam."
      - show: |
          <table class="t"><tr><th>bước</th><th>gán</th><th>miền còn lại sau kiểm tra tiến</th></tr>
          <tr><td>3</td><td>Q = lam (miền chỉ còn 1)</td><td>NT: {lục}</td></tr>
          <tr><td>4</td><td>NT = lục</td><td>WA: {lam}</td></tr>
          <tr><td>5–7</td><td>WA = lam, V = lam, T = đỏ</td><td>xong: 7 biến, $\hl{7}$ lần gán</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Bước ba gán vùng Q màu lam, vì miền của nó chỉ còn một màu, và Lãnh thổ Bắc chỉ còn màu lục. Bước bốn gán Lãnh thổ Bắc màu lục, nên Tây Úc chỉ còn màu lam. Ba bước cuối gán nốt Tây Úc, vùng V, và đảo, tổng cộng 7 lần gán cho 7 biến."

  - id: check
    kind: check
    title: "Tự kiểm: lời giải đúng, và số 18 tính bằng đường khác"
    checks:
      - "all({'SA': 0, 'NSW': 1, 'Q': 2, 'NT': 1, 'WA': 2, 'V': 2, 'T': 0}[a] != {'SA': 0, 'NSW': 1, 'Q': 2, 'NT': 1, 'WA': 2, 'V': 2, 'T': 0}[b] for a, b in alg.AUS_EDGES)"
      - "alg.csp_count(alg.AUS_REGIONS[:6], alg.AUS_EDGES)[1] * 3 == alg.csp_count()[1] == 18"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách</th><th>kết quả</th></tr>
          <tr><td>lời giải có hợp lệ?</td><td>soát cả 9 cạnh: hai đầu khác màu</td><td>9 / 9 ✓</td></tr>
          <tr><td>18 lời giải</td><td>đất liền 6 cách × đảo 3 màu (độc lập)</td><td>6 · 3 = 18 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        introduces: [cdot]
        say: "Kiểm bằng đường khác. Thứ nhất, soát cả 9 cạnh của đồ thị, hai đầu mỗi cạnh đều khác màu, nên lời giải hợp lệ. Thứ hai, vì đảo không giáp vùng nào nên độc lập với đất liền, và 6 cách cho đất liền nhân 3 màu cho đảo đúng bằng 18."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gán theo thứ tự tuỳ ý <b class="red">(phát hiện sai muộn)</b>
          <br><span class="note">Gán vùng ít ràng buộc trước thì lỗi chỉ lộ ra ở vùng giáp nhiều nơi, khi đã đi sâu. Gán biến “khó” trước để thất bại sớm, rẻ.</span></div>
        say: "Lỗi thứ nhất, gán theo thứ tự tuỳ ý nên phát hiện sai muộn. Gán vùng ít ràng buộc trước thì lỗi chỉ lộ ra ở vùng giáp nhiều nơi, khi đã đi sâu. Hãy gán biến khó trước để thất bại sớm và rẻ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ lan truyền ràng buộc (như kiểm tra tiến) thay được tìm kiếm <b class="red">(không đủ)</b>
          <br><span class="note">Kiểm tra tiến chỉ xoá giá trị chắc chắn sai. Khi các miền còn nhiều giá trị, vẫn phải thử và quay lui.</span></div>
        say: "Lỗi thứ hai, nghĩ lan truyền ràng buộc, như kiểm tra tiến, thay được tìm kiếm, như vậy không đủ. Kiểm tra tiến chỉ xoá những giá trị chắc chắn sai. Khi các miền còn nhiều giá trị, vẫn phải thử và quay lui."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bỏ qua cấu trúc độc lập <b class="red">(làm thừa)</b>
          <br><span class="note">Đảo phía nam không giáp vùng nào: giải riêng, nhân số cách. Đồ thị ràng buộc tách thành nhiều phần thì giải từng phần — 18 = 6 cách cho đất liền × 3 màu cho đảo.</span></div>
        say: "Lỗi thứ ba, bỏ qua cấu trúc độc lập nên làm thừa. Đảo phía nam không giáp vùng nào, nên giải riêng rồi nhân số cách. Đồ thị ràng buộc tách thành nhiều phần thì giải từng phần, 18 bằng 6 cách cho đất liền nhân 3 màu cho đảo."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.csp_count(alg.AUS_REGIONS[:6], alg.AUS_EDGES) == (729, 6) and alg.csp_count(alg.AUS_REGIONS, alg.AUS_EDGES, 2)[1] == 0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bỏ đảo phía nam: 6 vùng đất liền có bao nhiêu cách tô 3 màu, bao nhiêu cách đúng?</td></tr>
          <tr><td>2</td><td>Chỉ có 2 màu thì có cách tô đúng không? Vì sao (gợi ý: nhìn ba vùng WA, NT, SA)?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bỏ đảo phía nam, 6 vùng đất liền có bao nhiêu cách tô 3 màu, và bao nhiêu cách đúng? Câu hai, chỉ có 2 màu thì có cách tô đúng không? Gợi ý, nhìn ba vùng Tây Úc, Lãnh thổ Bắc và Nam Úc. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $3^6 = 729$ cách tô; số cách đúng $= \frac{18}{3} = \hl{6}$, vì đảo độc lập và có 3 màu.</p>
