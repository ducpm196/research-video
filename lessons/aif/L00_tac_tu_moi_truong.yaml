id: L00
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 0 — Tác tử và môi trường: mô tả bài toán AI"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L00; audit/aif/verify_aif.py L00; DMS bài 3 (quy tắc nhân); S. Russell, P. Norvig, Artificial Intelligence: A Modern Approach, bản 4 (2020), chương 2 (tác tử hợp lý, mô tả PEAS, thế giới máy hút bụi); CS115 bài 0"
assumes: [arith, power]
# Quy ước: alg.vacuum_reflex(số ô, vị trí đầu, tập ô bẩn) mô phỏng tác tử phản xạ đơn giản (bẩn → hút; sạch → đi phải, tới mép quay lại);
#   điểm hiệu năng = cộng số ô sạch sau mỗi bước. alg.vacuum_states(n) = n · 2^n. PEAS chỉ trên màn hình; lời đọc nói bốn thành phần.
objectives:
  - "Mô tả tác tử bằng hiệu năng, môi trường, cơ cấu chấp hành, cảm biến"
  - "Phân loại môi trường theo năm tiêu chí"
  - "Hiểu tác tử hợp lý là tối đa hoá hiệu năng kỳ vọng"
asr_reviewed:
  - {sentence: "Phòng hai ô là tĩnh, đường phố là động, thay đổi cả khi xe đang suy nghĩ.", reason: "ASR chép “Phòng 2O là tỉnh, đường phố là động, thay đổi cả khi xe đang suy nghĩ.” (0.882): lệch âm/thanh thuần Việt: ô/o, tĩnh/tỉnh — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy hút bụi “thông minh” đến mức nào?"
    checks:
      - "alg.vacuum_reflex(2, 0, {0, 1})[0] == ['hút', 'phải', 'hút']"
    steps:
      - show: |
          <p>Một máy hút bụi chỉ có hai luật: <b>ô đang đứng bẩn thì hút</b>, <b>sạch thì đi sang ô bên cạnh</b>. Trong căn phòng hai ô, nó làm sạch hết sau 3 bước. Nó có “thông minh” không? Còn xe tự lái thì cần gì hơn thế?</p>
          <div class="box key">Hôm nay: mô tả mọi bài toán AI bằng một khung chung — <b>tác tử</b> hành động trong <b>môi trường</b> để đạt <b>hiệu năng</b> tốt.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một máy hút bụi chỉ có hai luật, ô đang đứng bẩn thì hút, sạch thì đi sang ô bên cạnh. Trong căn phòng hai ô, nó làm sạch hết sau 3 bước. Nó có thông minh không? Còn xe tự lái thì cần gì hơn thế? Hôm nay ta mô tả mọi bài toán trí tuệ nhân tạo bằng một khung chung, tác tử hành động trong môi trường để đạt hiệu năng tốt."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Trước hết: đếm bằng quy tắc nhân"
    checks:
      - "2 * 3 == 6 and 2 ** 2 == 4"
      - "len([(a, b) for a in 'BS' for b in 'BS']) == 4"
    steps:
      - show: |
          <p><b>Quy tắc nhân:</b> chọn áo trong 2 chiếc và quần trong 3 chiếc thì có $2 \cdot 3 = 6$ bộ — mỗi chiếc áo đi được với cả 3 chiếc quần.</p>
          <table class="t"><tr><th>ô trái</th><th>ô phải</th></tr>
          <tr><td>bẩn</td><td>bẩn</td></tr><tr><td>bẩn</td><td>sạch</td></tr><tr><td>sạch</td><td>bẩn</td></tr><tr><td>sạch</td><td>sạch</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, 2, 2]
        say: "Trước hết, ta cần hiểu quy tắc nhân. Chọn áo trong 2 chiếc và quần trong 3 chiếc thì có 2 nhân 3, bằng 6 bộ, vì mỗi chiếc áo đi được với cả 3 chiếc quần. Với hai ô, mỗi ô bẩn hoặc sạch, bảng liệt kê đủ cả thảy 4 khả năng. Đó chính là 2 nhân 2, tức 2 mũ 2."

  - id: sym
    kind: symbol
    title: "Giải mã: tác tử và bốn thành phần mô tả"
    steps:
      - show: |
          <p><b>Tác tử</b>: thứ nhận <b>tri giác</b> từ môi trường qua cảm biến và tác động lại bằng <b>hành động</b>. Một <b>chương trình tác tử</b> chọn hành động từ chuỗi tri giác đã nhận.</p>
          <table class="t"><tr><th>thành phần (PEAS)</th><th>máy hút bụi</th><th>xe tự lái</th></tr>
          <tr><td>thước đo hiệu năng</td><td>số ô sạch mỗi bước</td><td>an toàn, đúng giờ, êm, đúng luật</td></tr>
          <tr><td>môi trường</td><td>các ô, bụi</td><td>đường, xe khác, người đi bộ, thời tiết</td></tr>
          <tr><td>cơ cấu chấp hành</td><td>bánh xe, máy hút</td><td>vô lăng, ga, phanh, đèn</td></tr>
          <tr><td>cảm biến</td><td>vị trí, cảm biến bụi</td><td>camera, lidar, định vị, đo tốc độ</td></tr></table>
          <p class="note">PEAS: chữ cái đầu tên tiếng Anh của bốn thành phần.</p>
        focus: [1, 1, 2, "2.2", "2.3", "2.4", "2.5"]
        say: "Tác tử là thứ nhận tri giác từ môi trường qua cảm biến, và tác động lại bằng hành động. Một chương trình tác tử chọn hành động từ chuỗi tri giác đã nhận. Bảng mô tả hai tác tử bằng bốn thành phần. Thước đo hiệu năng của máy hút bụi là số ô sạch mỗi bước, còn xe tự lái cần an toàn, đúng giờ, êm và đúng luật. Môi trường là các ô và bụi, hay đường, xe khác, người đi bộ và thời tiết. Cơ cấu chấp hành là bánh xe và máy hút, hay vô lăng, ga, phanh và đèn. Cảm biến là vị trí và cảm biến bụi, hay camera, cảm biến đo khoảng cách bằng tia sáng, định vị và đo tốc độ."
      - clear: true
        show: |
          <table class="t"><tr><th>tiêu chí môi trường</th><th>máy hút bụi hai ô</th><th>xe tự lái</th></tr>
          <tr><td>quan sát đủ / một phần</td><td>một phần (chỉ thấy ô đang đứng)</td><td>một phần</td></tr>
          <tr><td>tất định / ngẫu nhiên</td><td>tất định</td><td>ngẫu nhiên</td></tr>
          <tr><td>từng lượt / tuần tự</td><td>tuần tự</td><td>tuần tự</td></tr>
          <tr><td>tĩnh / động</td><td>tĩnh</td><td>động</td></tr>
          <tr><td>một tác tử / nhiều tác tử</td><td>một</td><td>nhiều</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng thứ hai phân loại môi trường theo năm tiêu chí. Máy hút bụi chỉ quan sát được ô đang đứng, xe tự lái cũng chỉ quan sát một phần thế giới. Máy hút bụi tất định, nghĩa là cùng hành động ở cùng trạng thái luôn ra cùng kết quả, còn xe tự lái ngẫu nhiên vì không biết người khác sẽ làm gì. Cả hai đều tuần tự, hành động bây giờ ảnh hưởng tới sau này. Phòng hai ô là tĩnh, đường phố là động, thay đổi cả khi xe đang suy nghĩ. Cuối cùng, máy hút bụi là một tác tử, còn xe tự lái chia đường với nhiều tác tử khác."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vòng lặp của mọi tác tử"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="arA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
          <g font-size="26" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="90" width="320" height="150" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2.5"/><text x="200" y="155" font-weight="bold">môi trường</text><text x="200" y="195">phòng, bụi, đường phố</text>
          <rect x="590" y="40" width="320" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="750" y="90">cảm biến → tri giác</text>
          <rect x="1110" y="90" width="350" height="150" rx="12" fill="#fff7ed" stroke="#eb6834" stroke-width="2.5"/><text x="1285" y="155" font-weight="bold">chương trình tác tử</text><text x="1285" y="195">chọn hành động</text>
          <rect x="590" y="210" width="320" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="750" y="260">hành động → chấp hành</text>
          </g>
          <line x1="360" y1="120" x2="585" y2="85" stroke="#eb6834" stroke-width="3" marker-end="url(#arA0)"/>
          <line x1="910" y1="85" x2="1105" y2="120" stroke="#eb6834" stroke-width="3" marker-end="url(#arA0)"/>
          <line x1="1110" y1="215" x2="915" y2="250" stroke="#eb6834" stroke-width="3" marker-end="url(#arA0)"/>
          <line x1="590" y1="250" x2="365" y2="215" stroke="#eb6834" stroke-width="3" marker-end="url(#arA0)"/>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình là vòng lặp của mọi tác tử. Môi trường được cảm biến đọc thành tri giác, chương trình tác tử chọn một hành động, cơ cấu chấp hành thực hiện hành động đó và làm môi trường thay đổi. Rồi vòng lặp bắt đầu lại, nên mỗi hành động ảnh hưởng tới tri giác lần sau."
      - show: |
          <table class="t"><tr><th>kiểu tác tử</th><th>chọn hành động dựa vào</th><th>đủ khi</th></tr>
          <tr><td>phản xạ đơn giản</td><td>chỉ tri giác hiện tại</td><td>tri giác cho biết đủ điều cần biết</td></tr>
          <tr><td>có trạng thái bên trong</td><td>tri giác + những gì đã nhớ</td><td>chỉ quan sát được một phần</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Chương trình tác tử có nhiều kiểu, bảng so hai kiểu đơn giản nhất. Tác tử phản xạ đơn giản chỉ nhìn tri giác hiện tại, và đủ dùng khi tri giác cho biết mọi điều cần biết. Tác tử có trạng thái bên trong nhớ thêm những gì đã thấy, cần khi chỉ quan sát được một phần."

  - id: example
    kind: example
    title: "Đếm trạng thái và chạy tác tử phản xạ"
    checks:
      - "alg.vacuum_states(2) == 8 == 2 * 2 ** 2"
      - "alg.vacuum_reflex(2, 0, {0, 1}) == (['hút', 'phải', 'hút'], 4) and alg.vacuum_reflex(2, 1, {0, 1}) == (['hút', 'trái', 'hút'], 4)"
    steps:
      - show: |
          <p><b>Phép tính 1 — số trạng thái.</b> Máy ở 1 trong 2 ô; ứng với mỗi vị trí, hai ô có $2^2 = 4$ khả năng bẩn–sạch.</p>
          <p>Theo quy tắc nhân: $2 \cdot 2^2 = \hl{8}$ trạng thái.</p>
        focus: [1, 1, 2]
        say: "Phép tính thứ nhất là số trạng thái. Máy ở một trong 2 ô, và ứng với mỗi vị trí, hai ô có 2 mũ 2, bằng 4 khả năng bẩn sạch. Theo quy tắc nhân, có 2 nhân 4, bằng 8 trạng thái."
      - clear: true
        show: |
          <p>Chạy tác tử phản xạ: hai ô đều bẩn, máy ở ô trái; điểm = cộng số ô sạch sau mỗi bước.</p>
          <table class="t"><tr><th>bước</th><th>máy ở</th><th>tri giác</th><th>hành động</th><th>số ô sạch</th></tr>
          <tr><td>1</td><td>trái</td><td>bẩn</td><td>hút</td><td>1</td></tr></table>
        focus: [1, "2.2"]
        say: "Giờ chạy tác tử khi cả hai ô đều bẩn và máy ở ô trái, điểm hiệu năng là cộng số ô sạch sau mỗi bước. Bước một, máy thấy bẩn nên hút, và có 1 ô sạch."
      - show: |
          <table class="t"><tr><th>bước</th><th>máy ở</th><th>tri giác</th><th>hành động</th><th>số ô sạch</th></tr>
          <tr><td>2</td><td>trái</td><td>sạch</td><td>sang phải</td><td>1</td></tr>
          <tr><td>3</td><td>phải</td><td>bẩn</td><td>hút</td><td>2</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Bước hai, máy thấy sạch nên sang phải, vẫn 1 ô sạch. Bước ba, ô phải bẩn nên hút, giờ cả 2 ô sạch."
      - show: |
          <p><b>Phép tính 2 — điểm hiệu năng</b> sau 3 bước: $1 + 1 + 2 = \hl{4}$.</p>
          <div class="box key">Môi trường nhỏ, tĩnh, tất định, và tri giác “bẩn/sạch” đủ để chọn đúng → tác tử phản xạ đơn giản đã đủ để làm sạch (chỉ không biết lúc dừng, xem lỗi 3).</div>
        focus: [1, 2]
        say: "Phép tính thứ hai, điểm hiệu năng sau 3 bước là 1 cộng 1 cộng 2, bằng 4. Môi trường này nhỏ, tĩnh và tất định, và tri giác bẩn hay sạch đủ để chọn đúng, nên tác tử phản xạ đơn giản đã đủ để làm sạch, chỉ là không biết lúc dừng."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "len([(m, a, b) for m in 'TP' for a in 'BS' for b in 'BS']) == 8 == alg.vacuum_states(2)"
      - "alg.vacuum_reflex(2, 1, {0, 1}) == (['hút', 'trái', 'hút'], 4)"
    steps:
      - show: |
          <p><b>Đếm thẳng:</b> liệt kê vị trí máy (trái, phải) cùng 4 khả năng bẩn–sạch → $2 + 2 + 2 + 2 = 8$ ✓, khớp quy tắc nhân.</p>
        say: "Kiểm bằng đường khác, ta liệt kê thẳng. Vì mỗi khả năng bẩn sạch đi với 2 vị trí của máy, nên bốn khả năng cho 2 cộng 2 cộng 2 cộng 2, bằng 8, khớp quy tắc nhân."
      - show: |
          <table class="t"><tr><th>xuất phát</th><th>hành động</th><th>điểm</th></tr>
          <tr><td>ô trái</td><td>hút, sang phải, hút</td><td>4</td></tr>
          <tr><td>ô phải</td><td>hút, sang trái, hút</td><td>4 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm thứ hai, nếu máy xuất phát ở ô phải thì sao. Ở ô trái, máy hút, sang phải, hút, được 4 điểm. Ở ô phải, máy hút, sang trái, hút, cũng được 4 điểm, vì căn phòng đối xứng nên kết quả phải như nhau."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chọn sai thước đo hiệu năng <b class="red">(tác tử làm đúng điều sai)</b>
          <br><span class="note">Chấm điểm theo “số lần hút” thì tác tử tốt nhất là nhả bụi ra rồi hút lại mãi. Đo thứ mình THẬT SỰ muốn (sàn sạch), không đo hành vi.</span></div>
        say: "Lỗi thứ nhất, chọn sai thước đo hiệu năng, nên tác tử làm đúng điều sai. Chấm điểm theo số lần hút thì tác tử tốt nhất là nhả bụi ra rồi hút lại mãi. Hãy đo thứ mình thật sự muốn là sàn sạch, không đo hành vi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ “hợp lý” là “biết hết” <b class="red">(đòi hỏi không thể)</b>
          <br><span class="note">Tác tử hợp lý chọn hành động tối đa hoá hiệu năng <b>kỳ vọng</b> theo những gì nó đã biết. Xe nhìn kỹ rồi mới qua ngã tư vẫn có thể bị đâm — vẫn là hợp lý.</span></div>
        say: "Lỗi thứ hai, nghĩ hợp lý là biết hết, một đòi hỏi không thể. Tác tử hợp lý chọn hành động tối đa hoá hiệu năng kỳ vọng theo những gì nó đã biết. Xe nhìn kỹ rồi mới qua ngã tư vẫn có thể bị đâm, và đó vẫn là quyết định hợp lý."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng tác tử phản xạ ở môi trường quan sát một phần <b class="red">(lặp vô tận)</b>
          <br><span class="note">Máy chỉ thấy ô đang đứng: nếu đã sạch hết, luật “sạch thì đi” làm nó đi qua đi lại mãi. Cần <b>trạng thái bên trong</b> (nhớ ô nào đã sạch) để biết lúc dừng.</span></div>
        say: "Lỗi thứ ba, dùng tác tử phản xạ ở môi trường chỉ quan sát được một phần, nên nó lặp vô tận. Máy chỉ thấy ô đang đứng, nếu mọi ô đã sạch thì luật sạch thì đi làm nó đi qua đi lại mãi. Cần một trạng thái bên trong, nhớ ô nào đã sạch, để biết lúc dừng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.vacuum_states(3) == 24 and alg.vacuum_reflex(3, 0, {0, 2})[0] == ['hút', 'phải', 'phải', 'hút']"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
