    say: Hình là ba câu hỏi để chọn công cụ. Đầu tiên, kết quả hành động có chắc không, nếu không thì dùng xác suất và lặp giá trị của bài 11 và 12. Nếu chắc, hỏi tiếp có đối thủ không, có thì dùng alpha beta hay cây mô phỏng. Nếu không có đối thủ, hỏi cần đường đi hay cấu hình cuối, để chọn giữa A sao và leo đồi hay ràng buộc.
- id: example
  kind: example
  title: 'Khi không duyệt hết được: cắt độ sâu và học hàm đánh giá'
  checks:
  - 35 ** 4 == 1500625 and 35 ** 2 + 35 ** 2 - 1 == 2449
  - int(80 * math.log10(35)) == 123
  steps:
  - show: |
      <p><b>Bước 1 — cây đầy đủ cỡ nào?</b> $\log(35^{80}) = 80 \cdot 1{,}544 \approx 123{,}5$ → $35^{80} \approx 10^{123}$ nút.</p>
    say: Bước một, cây đầy đủ cỡ bao nhiêu? Lôgarit của 35 mũ 80 bằng 80 nhân 1 phẩy 544, xấp xỉ 123 phẩy 5, nên cây có cỡ 10 mũ 123 nút.
  - show: |
      <table class="t"><tr><th>kỹ thuật</th><th>số lá phải xét</th></tr>
      <tr><td><b>bước 2 — cắt độ sâu</b>: chỉ nhìn trước 4 nước</td><td>$35^4 = 1\,500\,625$</td></tr></table>
    focus:
    - 1
    - '1.2'
    say: Bước hai, cắt độ sâu. Chỉ nhìn trước 4 nước thì còn 35 mũ 4, tức hơn 1 triệu 500 nghìn lá.
  - show: |
      <table class="t"><tr><th>kỹ thuật</th><th>số lá phải xét</th></tr>
      <tr><td><b>bước 3 — alpha–beta, thứ tự tốt</b> (bài 6)</td><td>$35^2 + 35^2 - 1 = 2449$</td></tr></table>
    focus:
    - 1
    - '1.2'
    say: Bước ba, ở bài 6 ta đã thấy cắt tỉa alpha beta bỏ những nhánh chắc chắn không được chọn. Với thứ tự xét tốt nhất, ở độ sâu 4 chỉ còn khoảng 2449 lá.
  - clear: true
    show: |
      <p><b>Bước 4 — hàm đánh giá ở lá bị cắt:</b> ước lượng thế cờ chưa kết thúc — viết tay (đếm quân) hoặc <b>học</b> từ dữ liệu. Tóm lại cách chọn công cụ theo môi trường: bài tất định vừa sức dùng A* hay ràng buộc; có đối thủ dùng alpha–beta và học hàm đánh giá khi cây quá lớn; không chắc chắn dùng xác suất hay lặp giá trị.</p>
      <p>Cờ vây (2016): <b>cây mô phỏng ngẫu nhiên</b> (bài 7) kết hợp mạng nơ-ron học từ ván cờ để đánh giá thế cờ và gợi ý nước — tìm kiếm và học bổ sung cho nhau.</p>
      <p class="note"><b>Mạng nơ-ron</b>: một hàm tính có rất nhiều tham số; “học” là chỉnh dần các tham số để đầu ra khớp với các ví dụ đã biết, như kết quả thật của các ván cờ.</p>
    focus:
    - 1
    - 2
    - 3
    - 2
    say: Bước bốn, ở các lá bị cắt, cần một hàm đánh giá để ước lượng thế cờ chưa kết thúc, viết tay như đếm quân, hoặc học từ dữ liệu. Với cờ vây năm 2016, máy kết hợp cây mô phỏng ngẫu nhiên của bài 7 với mạng nơ-ron học từ ván cờ, để đánh giá thế cờ và gợi ý nước đi. Mạng nơ-ron là một hàm tính có rất nhiều tham số, và học nghĩa là chỉnh dần các tham số để đầu ra khớp với các ví dụ đã biết. Tìm kiếm và học bổ sung cho nhau.
- id: check
  kind: check
  title: 'Tự kiểm: đếm chữ số trực tiếp'
  checks:
  - len(str(35 ** 80)) == 124 and int(80 * math.log10(35)) == 123
  steps:
  - show: |
      <table class="t"><tr><th>cách</th><th>kết quả</th></tr>
      <tr><td>lôgarit cơ số 10: $80 \cdot \log 35 \approx 123{,}5$</td><td>cỡ $10^{123}$</td></tr>
      <tr><td>máy tính thẳng $35^{80}$ rồi đếm chữ số</td><td>124 chữ số, tức $\geq 10^{123}$ ✓</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác, cho máy tính thẳng 35 mũ 80 rồi đếm chữ số. Theo lôgarit, số này cỡ 10 mũ 123. Máy đếm được 124 chữ số, tức là lớn hơn hoặc bằng 10 mũ 123, khớp.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: |
      <div class="box warn"><b>Lỗi 1.</b> Dùng học máy cho bài đã có lời giải chính xác <b class="red">(kém tin cậy hơn)</b>
      <br><span class="note">Tìm đường trên bản đồ đã biết có A* — tối ưu, kiểm chứng được. Mô hình học được chỉ nên thay khi bài quá lớn hoặc thiếu mô hình.</span></div>
    say: Lỗi thứ nhất, dùng học máy cho bài đã có lời giải chính xác, nên kém tin cậy hơn. Tìm đường trên bản đồ đã biết thì có A sao, tối ưu và kiểm chứng được. Mô hình học được chỉ nên thay khi bài quá lớn hoặc thiếu mô hình.
  - show: |
      <div class="box warn"><b>Lỗi 2.</b> Dùng phương pháp tất định cho môi trường ngẫu nhiên <b class="red">(kế hoạch giòn)</b>
      <br><span class="note">Kế hoạch tìm bằng A* giả định mọi bước thành công. Bánh xe trượt, cảm biến nhiễu thì cần mô hình xác suất (bài 11–12) hoặc lập kế hoạch lại liên tục.</span></div>
    say: Lỗi thứ hai, dùng phương pháp tất định cho môi trường ngẫu nhiên, nên kế hoạch giòn. Kế hoạch tìm bằng A sao giả định mọi bước thành công. Bánh xe trượt hay cảm biến nhiễu thì cần mô hình xác suất, hoặc lập kế hoạch lại liên tục.
  - clear: true
    show: |
      <div class="box warn"><b>Lỗi 3.</b> Quên rằng mô hình là giả định <b class="red">(tối ưu sai bài)</b>
      <br><span class="note">Mọi thuật toán trong khoá tối ưu cho <b>mô hình</b> ta viết ra: thước đo hiệu năng, xác suất, thưởng. Mô hình sai thì lời giải “tối ưu” vẫn sai — kiểm lại giả định với thực tế.</span></div>
    say: Lỗi thứ ba, quên rằng mô hình là giả định, nên tối ưu sai bài. Mọi thuật toán trong khoá tối ưu cho mô hình ta viết ra, gồm thước đo hiệu năng, xác suất và thưởng. Mô hình sai thì lời giải tối ưu vẫn sai, nên hãy kiểm lại giả định với thực tế.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  steps:
  - show: |
      <table class="t"><tr><th>bài</th><th>chọn công cụ cho</th></tr>
      <tr><td>1</td><td>Xếp lịch thi cho 300 môn, hai môn có chung sinh viên không được trùng giờ.</td></tr>
      <tr><td>2</td><td>Chẩn đoán lỗi máy in từ vài triệu chứng, mỗi lỗi gây triệu chứng với xác suất khác nhau.</td></tr>
      <tr><td>3</td><td>Robot giao hàng trong kho, bánh xe đôi khi trượt, muốn tối đa số đơn giao đúng hạn.</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    say: Bây giờ đến lượt bạn tự làm, hãy chọn công cụ cho từng bài. Bài một, xếp lịch thi cho 300 môn, hai môn có chung sinh viên không được trùng giờ. Bài hai, chẩn đoán lỗi máy in từ vài triệu chứng, mỗi lỗi gây triệu chứng với xác suất khác nhau. Bài ba, robot giao hàng trong kho, bánh xe đôi khi trượt, muốn tối đa số đơn giao đúng hạn. Dừng video và làm ra giấy.
    pause: 15
  - show: |
      <p>① <b>Thoả ràng buộc</b> (biến: giờ thi; ràng buộc: môn chung sinh viên khác giờ) — giống tô màu bản đồ; có thể kết hợp tìm kiếm cục bộ khi rất lớn.</p>
    say: Đáp án bài một, dùng thoả ràng buộc, biến là giờ thi, ràng buộc là môn chung sinh viên phải khác giờ, giống tô màu bản đồ. Khi bài rất lớn, có thể kết hợp tìm kiếm cục bộ.
  - show: |
      <p>② <b>Mạng Bayes</b>: lỗi là nguyên nhân, triệu chứng là bằng chứng; hỏi xác suất từng lỗi khi biết triệu chứng.</p>
    say: Bài hai, dùng mạng Bayes, lỗi là nguyên nhân, triệu chứng là bằng chứng, và ta hỏi xác suất từng lỗi khi biết triệu chứng.
  - show: |
      <p>③ <b>Quá trình quyết định Markov</b> (bài 12: trạng thái, hành động có xác suất chuyển, thưởng): hành động không chắc thành công → lặp giá trị, hoặc học Q (học giá trị từng cặp ô–hành động từ các lần đi thử) nếu không biết xác suất trượt.</p>
    say: Bài ba, dùng quá trình quyết định Markov như ở bài 12, gồm trạng thái, hành động có xác suất chuyển, và thưởng, vì hành động không chắc thành công. Giải bằng lặp giá trị, hoặc học Q, tức học giá trị từng cặp ô và hành động từ các lần đi thử, nếu không biết xác suất trượt.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/AIF/L13
  steps:
  - show: <table class='t'><tr><th>Thực hành AIF:L13</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/AIF/L13/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Ước lượng kích thước cây trò chơi b=20 ở độ sâu 60 và độ sâu 3</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>log10_tree=... depth3_nodes=... log10_reduction=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh AIF L13 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (1 dòng)</b></p><div class="code"><div>log10_tree=78.1 depth3_nodes=8000 log10_reduction=74.2</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>import math</code></td><td>Nạp thư viện toán học chuẩn để dùng hàm sẵn có</td></tr><tr><td><code>**</code></td><td><code>**</code> là lũy thừa; <code>//</code> là chia lấy nguyên; <code>%</code> là chia lấy phần dư</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.1f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo AIF:L13 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>import math</div><div>log10_full = 60 * math.log10(20)</div><div>d3 = 20 ** 3</div><div>log10_red = log10_full - 3 * math.log10(20)</div><div>print(</div><div>    f"log10_tree={log10_full:.1f} depth3_nodes={d3} "</div><div>    f"log10_reduction={log10_red:.1f}"</div><div>)</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">mô tả tác tử và môi trường</span><span class="a">→</span>
      <span class="n">chọn biểu diễn: trạng thái, ràng buộc, lôgic, xác suất</span><span class="a">→</span>
      <span class="n">chọn thuật toán có bảo đảm</span><span class="a">→</span>
      <span class="n">quá lớn thì cắt, ước lượng, học</span></div>
    say: Tổng kết lại, bản đồ công cụ giúp bạn chọn phương pháp đúng ngay từ đầu dựa trên tính tất định, đối thủ và dạng lời giải. Với bài toán có mô hình rõ và cỡ vừa, hãy dùng thuật toán tìm kiếm, ràng buộc, logic hoặc lặp giá trị có bảo đảm toán học. Khi cây trạng thái bùng nổ quá ngưỡng hay thiếu mô hình chuyển bước, kết hợp cắt độ sâu, mô phỏng ngẫu nhiên và hàm đánh giá học được. Sự bổ trợ giữa suy luận cổ điển và học máy tạo nên các hệ trí tuệ nhân tạo mạnh nhất hiện nay. Khi chuyển từ mô hình đồ chơi trên lớp sang dự án sản xuất thật, điều giúp bạn không tốn công vô ích là khớp đúng bản chất bài toán với khung công cụ phù hợp nhất. Đừng bao giờ vội vã huấn luyện một mạng học sâu nặng nề nếu bài toán vốn là tìm đường trên bản đồ tĩnh hay lập lịch ràng buộc đã có thuật toán giải chính xác cực nhanh. Ngược lại khi không gian bùng nổ vượt ngưỡng duyệt hết hay thiếu mô hình rõ ràng, ta ghép thêm mô phỏng ngẫu nhiên. Hàm ước lượng học được sẽ dẫn đường đúng chỗ. Nắm trọn bức tranh tổng hợp này giúp bạn tự tin giải quyết các hệ thống thông minh hiện đại. Đặt đúng thước đo chi phí và nhớ giới hạn cắt độ sâu luôn là bước bảo vệ hệ thống chạy ổn định ngoài thực tế. Kết thúc phần lý thuyết hôm nay, bạn sẽ dùng công thức lôgarit để tính cỡ cây trò chơi mới gồm hai mươi nhánh ở độ sâu sáu mươi. Bài thực hành nhỏ này chứng minh ngay hiệu quả giảm bớt số bậc khi cắt sâu ba tầng đầu tiên. Chìa khoá của kỹ sư giỏi là không ép một phương pháp duy nhất cho mọi bài toán. Biết kết hợp sức mạnh tìm kiếm chính xác cùng khả năng ước lượng học từ dữ liệu giúp giải quyết trọn vẹn các bài toán lớn. Việc chọn đúng công cụ từ bản đồ tổng hợp sẽ tiết kiệm rất nhiều công sức khi triển khai ngoài thực tế. Từ nền tảng tìm kiếm đến suy diễn và ra quyết định, bạn đã sẵn sàng ghép nối chúng vào bài toán thực tế.
  - show: |
      <div class="box key"><b>Tư duy:</b> học máy và AI cổ điển không đối đầu — hệ thống mạnh nhất thường <b>tìm kiếm</b> có <b>ước lượng học được</b>.</div>
      <p class="note"><b>Hai mức quy mô:</b> Cờ vua 80 nước sâu $\approx 10^{123}$ nút (không thể duyệt hết), cắt sâu 4 kết hợp tỉa nhánh alpha–beta (cắt nhánh kém từ sớm) còn khoảng 2 449 nút rồi giao cho hàm đánh giá học được trên dữ liệu hàng triệu ván.</p>
    say: Điều cần mang theo, học máy và trí tuệ nhân tạo cổ điển không đối đầu nhau, hệ thống mạnh nhất thường là tìm kiếm có ước lượng học được. Cờ vua 80 nước sâu hàng chục nghìn tỉ tỉ tỉ nút nên không thể duyệt hết. Cắt sâu 4 kết hợp tỉa nhánh còn hơn 2 nghìn nút rồi dùng hàm đánh giá học được.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — máy chơi cờ từ chip cờ riêng năm 1988 tới một thuật toán tự học chơi ba trò năm 2018.</p>
    forward_ref: true
    say: Ở bài sau, bài 14, ta đi lại ba mươi năm làm máy chơi cờ, từ chip cờ riêng năm 1988 tới một thuật toán tự học chơi cả ba trò năm 2018. Ta sẽ thấy mỗi chặng tìm kiếm và học được kết hợp ra sao. Hẹn gặp bạn ở bài tiếp theo.
