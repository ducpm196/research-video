scenes:
- id: hook
  kind: hook
  title: 'Cờ vua: 10¹²³ nút'
  checks:
  - int(80 * math.log10(35)) == 123
  steps:
  - show: '<p>Cờ vua: mỗi lượt khoảng 35 nước, một ván khoảng 80 nước. Cây trò chơi có cỡ $35^{80} \approx 10^{123}$ nút — nhiều hơn số nguyên tử trong vũ trụ quan sát được. Vậy máy chơi cờ giỏi bằng cách nào?</p>

      <div class="box key">Hôm nay: <b>tổng hợp</b> các công cụ của khoá, và biết chọn công cụ nào cho bài toán nào.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, trong cờ vua, mỗi lượt có khoảng 35 nước, một ván khoảng 80 nước. Cây trò chơi có cỡ 35 mũ 80, xấp xỉ 10 mũ 123 nút, nhiều hơn số nguyên tử trong vũ trụ quan sát được. Vậy máy chơi cờ giỏi bằng cách nào? Hôm nay ta tổng hợp các công cụ của khoá, và học cách chọn công cụ nào cho bài toán nào. Khi đặt đúng ba câu hỏi phân loại về tính tất định, đối thủ và đường đi hay cấu hình, bản đồ thuật toán hiện ra rất rành mạch. Quan trọng nhất là thấy cách tìm kiếm cổ điển kết nối tự nhiên với hàm ước lượng học được trong trí tuệ nhân tạo hiện đại. Kích thước cây trò chơi vượt xa số nguyên tử trong vũ trụ là minh chứng thuyết phục vì sao chọn đúng phương pháp luôn quan trọng hơn tăng tốc độ máy. Tổng hợp xuyên suốt toàn khoá giúp bạn chọn đúng công cụ trí tuệ nhân tạo cho từng lớp bài toán thực tế.
- id: prereq
  kind: prereq
  title: 'Trước hết: đếm chữ số bằng lôgarit cơ số 10'
  checks:
  - round(math.log10(1000)) == 3 and round(math.log10(35), 3) == 1.544
  - round(math.log10(100 ** 2)) == 4 == 2 * round(math.log10(100))
  steps:
  - show: '<p><b>Lôgarit cơ số 10</b> của một số là số mũ phải đặt lên 10 để được số đó.</p>

      <table class="t"><tr><th>số</th><th>$\log$ (cơ số 10)</th><th>nghĩa</th></tr>

      <tr><td>1000</td><td>3</td><td>$10^3$: số có 4 chữ số</td></tr>

      <tr><td>35</td><td>≈ 1,544</td><td>$35 \approx 10^{1{,}544}$</td></tr></table>

      <p>Lôgarit biến phép mũ thành phép nhân: $100^2 = 10\,000$, $\log 10\,000 = 4 = 2 \cdot \log 100$. Tương tự $\log(35^{80}) = 80 \cdot \log 35$.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 3
    - 3
    - 3
    say: Trước hết, ta cần hiểu lôgarit cơ số 10 của một số, tức số mũ phải đặt lên 10 để được số đó, nên nó cho biết số có cỡ bao nhiêu chữ số. Lôgarit của 1000 bằng 3, vì 1000 là 10 mũ 3. Lôgarit của 35 xấp xỉ 1 phẩy 544. Lôgarit biến phép mũ thành phép nhân, ví dụ 100 bình phương là 10 nghìn, lôgarit bằng 4, đúng bằng 2 nhân lôgarit của 100. Tương tự, lôgarit của 35 mũ 80 bằng 80 nhân lôgarit của 35. Lô-ga-rít cơ số mười nén những con số khổng lồ hàng trăm chữ số thành vài đơn vị dễ so sánh trực tiếp độ phức tạp thuật toán.
- id: sym
  kind: symbol
  title: Bản đồ công cụ của khoá
  steps:
  - show: '<table class="t"><tr><th>bài toán có dạng</th><th>công cụ</th><th>bài</th></tr>

      <tr><td>tìm đường, tất định, biết hết</td><td>chiều rộng, chi phí đều, A*</td><td>1–3</td></tr>

      <tr><td>chỉ cần cấu hình cuối tốt</td><td>leo đồi, tôi luyện</td><td>4</td></tr>

      <tr><td>biến và ràng buộc</td><td>quay lui + kiểm tra tiến</td><td>5</td></tr>

      <tr><td>có đối thủ</td><td>cực đại–cực tiểu, alpha–beta (tỉa nhánh), cây mô phỏng</td><td>6–7</td></tr>

      <tr><td>tri thức chắc chắn, câu hỏi đúng/sai</td><td>kiểm mô hình, suy diễn tiến–lùi</td><td>8–9</td></tr>

      <tr><td>đạt mục tiêu bằng dãy hành động</td><td>lập kế hoạch</td><td>10</td></tr>

      <tr><td>không chắc chắn về thế giới</td><td>mạng Bayes</td><td>11</td></tr>

      <tr><td>không chắc chắn về kết quả hành động</td><td>lặp giá trị, lặp chính sách</td><td>12</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - '1.9'
    - '1.9'
    - '1.9'
    say: 'Bảng là bản đồ công cụ của cả khoá, cột cuối ghi số bài để bạn ôn lại. Bài toán tìm đường, tất định và biết hết thì dùng tìm theo chiều rộng, chi phí đều, hay A sao. Chỉ cần cấu hình cuối tốt thì dùng leo đồi hay tôi luyện. Có biến và ràng buộc thì dùng quay lui kèm kiểm tra tiến. Có đối thủ thì dùng cực đại cực tiểu, alpha beta, hay cây mô phỏng ngẫu nhiên. Tri thức chắc chắn với câu hỏi đúng sai thì dùng kiểm mô hình hay suy diễn tiến lùi. Đạt mục tiêu bằng một dãy hành động thì dùng lập kế hoạch. Không chắc chắn về thế giới thì dùng mạng Bayes. Không chắc chắn về kết quả hành động thì dùng lặp giá trị hay lặp chính sách. Lựa chọn đúng mô hình suy diễn và tìm kiếm ngay từ đầu quyết định tính khả thi của toàn bộ hệ thống thông minh. Bảng tổng hợp đóng vai trò la bàn chẩn đoán bài toán: kiểm tra tính tất định, sự có mặt của đối thủ và bản chất cần đường đi hay cấu hình.'
