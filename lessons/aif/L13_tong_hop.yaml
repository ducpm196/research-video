    - '1.2'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai AIF:L13</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (quy lôgarit cơ số 10)</b></td><td>Nhân độ sâu tối đa với log10 hệ số nhánh để tránh tràn số</td></tr><tr><td><b>Bước 2 (tính nút sau cắt sâu)</b></td><td>Nâng hệ số nhánh lên lũy thừa độ sâu cắt tỉa nông</td></tr><tr><td><b>Bước 3 (độ giảm bậc mười)</b></td><td>Lấy lôgarit tổng cây trừ lôgarit số nút sau khi cắt</td></tr><tr><td><b>Đọc chuẩn &amp; ghi khoá</b></td><td>Dùng <code>sys.stdin.read()</code> tách cặp <code>khoá=giá_trị</code> rồi in đúng định dạng mẫu</td></tr></table>
    say: Gợi ý cài đặt bài số 13 gồm ba bước rõ ràng. Trước hết hãy đọc dữ liệu đầu vào bằng thư viện chuẩn sys, rồi cài đặt đúng công thức hoặc quy tắc bài toán. Cuối cùng in đủ 1 dòng khớp các khoá log10 tree, depth3 nodes, log10 reduction.
