    - 1
    say: Hình là ba câu hỏi để chọn công cụ. Đầu tiên, kết quả hành động có chắc không, nếu không thì dùng xác suất và lặp giá trị của bài 11 và 12. Nếu chắc, hỏi tiếp có đối thủ không, có thì dùng alpha beta hay cây mô phỏng. Nếu không có đối thủ, hỏi cần đường đi hay cấu hình cuối, để chọn giữa A sao và leo đồi hay ràng buộc. Ba câu hỏi phân nhánh gọn gàng lập tức thu hẹp hàng chục thuật toán cả khoá về đúng một nhóm phương pháp thích hợp nhất. Nhận diện bốn trục quyết định giúp loại trừ nhanh các thuật toán lệch bản chất ngay từ bước phân tích.
- id: example
  kind: example
  title: 'Nối AI cổ điển với học máy: chọn cách tiếp cận theo môi trường, cắt độ sâu'
  checks:
  - 35 ** 4 == 1500625 and 35 ** 2 + 35 ** 2 - 1 == 2449
  - int(80 * math.log10(35)) == 123
  steps:
  - show: '<p><b>Bước 1 — cây đầy đủ cỡ nào?</b> $\log(35^{80}) = 80 \cdot 1{,}544 \approx 123{,}5$ → $35^{80} \approx 10^{123}$ nút.</p>

      '
    say: Bước một, cây đầy đủ cỡ bao nhiêu? Lôgarit của 35 mũ 80 bằng 80 nhân 1 phẩy 544, xấp xỉ 123 phẩy 5, nên cây có cỡ 10 mũ 123 nút.
  - show: '<table class="t"><tr><th>kỹ thuật</th><th>số lá phải xét</th></tr>

      <tr><td><b>bước 2 — cắt độ sâu</b>: chỉ nhìn trước 4 nước</td><td>$35^4 = 1\,500\,625$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Bước hai, cắt độ sâu. Chỉ nhìn trước 4 nước thì còn 35 mũ 4, tức hơn 1 triệu 500 nghìn lá. Cắt độ sâu về bốn nước kéo cỡ cây từ một trăm hai mươi ba chữ số xuống còn hơn một triệu rưỡi trạng thái lá.
  - show: '<table class="t"><tr><th>kỹ thuật</th><th>số lá phải xét</th></tr>

      <tr><td><b>bước 3 — alpha–beta, thứ tự tốt</b> (bài 6)</td><td>$35^2 + 35^2 - 1 = 2449$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Bước ba, ở bài 6 ta đã thấy cắt tỉa alpha beta bỏ những nhánh chắc chắn không được chọn. Với thứ tự xét tốt nhất, ở độ sâu 4 chỉ còn khoảng 2449 lá. Kết hợp thêm cắt tỉa an-pha bê-ta với thứ tự nước tốt rút gọn số lá cần xét thêm hàng trăm lần xuống quanh ngưỡng hai nghìn rưỡi.
  - clear: true
    show: '<p><b>Bước 4 — hàm đánh giá ở lá bị cắt:</b> ước lượng thế cờ chưa kết thúc — viết tay (đếm quân) hoặc <b>học</b> từ dữ liệu. Tóm lại cách chọn công cụ theo môi trường: bài tất định vừa sức dùng A* hay ràng buộc; có đối thủ dùng alpha–beta và học hàm đánh giá khi cây quá lớn; không chắc chắn dùng xác suất hay lặp giá trị.</p>

      <p>Cờ vây (2016): <b>cây mô phỏng ngẫu nhiên</b> (bài 7) kết hợp mạng nơ-ron học từ ván cờ để đánh giá thế cờ và gợi ý nước — tìm kiếm và học bổ sung cho nhau.</p>

      <p class="note"><b>Mạng nơ-ron</b>: một hàm tính có rất nhiều tham số; “học” là chỉnh dần các tham số để đầu ra khớp với các ví dụ đã biết, như kết quả thật của các ván cờ.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 2
    say: Bước bốn, ở các lá bị cắt, cần một hàm đánh giá để ước lượng thế cờ chưa kết thúc, viết tay như đếm quân, hoặc học từ dữ liệu. Với cờ vây năm 2016, máy kết hợp cây mô phỏng ngẫu nhiên của bài 7 với mạng nơ-ron học từ ván cờ, để đánh giá thế cờ và gợi ý nước đi. Mạng nơ-ron là một hàm tính có rất nhiều tham số, và học nghĩa là chỉnh dần các tham số để đầu ra khớp với các ví dụ đã biết. Tìm kiếm và học bổ sung cho nhau.
  - show: <p><b>Bước 4 — tính cỡ cây trò chơi theo lôgarit cơ số 10 bằng Python</b>:</p><div class="code"><div>import math</div><div>b, d_full, d_cut = 35, 80, 4</div><div>log_full = d_full * math.log10(b)</div><div>print(f&#x27;log10={log_full:.1f} cut_nodes={b**d_cut}&#x27;)</div></div>
    say: Bước bốn, thay vì tính trực tiếp 35 luỹ thừa 80 rất dễ tràn số ở nhiều ngôn ngữ, ta dùng lôgarit cơ số 10 trong thư viện math. Lấy độ sâu 80 nhân lôgarit cơ số 10 của 35 cho ra bậc độ lớn 123 phẩy 5, tương ứng cỡ 10 mũ 123 nút. Khi cắt sâu ở 4 nước đi, số nút cần xét giảm về một triệu 500 nghìn 625.
    clear: true
    focus: null
- id: check
  kind: check
  title: 'Tự kiểm: đếm chữ số trực tiếp'
  checks:
  - len(str(35 ** 80)) == 124 and int(80 * math.log10(35)) == 123
  steps:
  - show: '<table class="t"><tr><th>cách</th><th>kết quả</th></tr>

      <tr><td>lôgarit cơ số 10: $80 \cdot \log 35 \approx 123{,}5$</td><td>cỡ $10^{123}$</td></tr>

      <tr><td>máy tính thẳng $35^{80}$ rồi đếm chữ số</td><td>124 chữ số, tức $\geq 10^{123}$ ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, cho máy tính thẳng 35 mũ 80 rồi đếm chữ số. Theo lôgarit, số này cỡ 10 mũ 123. Máy đếm được 124 chữ số, tức là lớn hơn hoặc bằng 10 mũ 123, khớp. Đếm trực tiếp độ dài chuỗi chữ số của kết quả chính xác ba mươi lăm mũ tám mươi đạt một trăm hai mươi bốn chữ số khớp công thức lô-ga-rít.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Dùng học máy cho bài đã có lời giải chính xác <b class="red">(kém tin cậy hơn)</b>

      <br><span class="note">Tìm đường trên bản đồ đã biết có A* — tối ưu, kiểm chứng được. Mô hình học được chỉ nên thay khi bài quá lớn hoặc thiếu mô hình.</span></div>

      '
    say: Lỗi thứ nhất, dùng học máy cho bài đã có lời giải chính xác, nên kém tin cậy hơn. Tìm đường trên bản đồ đã biết thì có A sao, tối ưu và kiểm chứng được. Mô hình học được chỉ nên thay khi bài quá lớn hoặc thiếu mô hình. Đừng bao giờ đẩy mạng học sâu phức tạp vào bài toán đường đi tất định đã biết hết bản đồ khi thuật toán A sao giải tối ưu tuyệt đối. Dùng tìm kiếm mù cho không gian hàng tỉ nút biến bài toán đơn giản thành treo máy hàng giờ đồng hồ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng phương pháp tất định cho môi trường ngẫu nhiên <b class="red">(kế hoạch giòn)</b>

      <br><span class="note">Kế hoạch tìm bằng A* giả định mọi bước thành công. Bánh xe trượt, cảm biến nhiễu thì cần mô hình xác suất (bài 11–12) hoặc lập kế hoạch lại liên tục.</span></div>

      '
    say: Lỗi thứ hai, dùng phương pháp tất định cho môi trường ngẫu nhiên, nên kế hoạch giòn. Kế hoạch tìm bằng A sao giả định mọi bước thành công. Bánh xe trượt hay cảm biến nhiễu thì cần mô hình xác suất, hoặc lập kế hoạch lại liên tục. Áp dụng kế hoạch cứng nhắc kiểu tìm đường tất định vào môi trường ngẫu nhiên dễ biến toàn bộ hành trình thành giòn gãy ngay ở bước trượt đầu tiên. Áp dụng chiến lược tất định vào môi trường có nhiễu xác suất dễ khiến kế hoạch gãy vụn ngay bước đầu.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Quên rằng mô hình là giả định <b class="red">(tối ưu sai bài)</b>

      <br><span class="note">Mọi thuật toán trong khoá tối ưu cho <b>mô hình</b> ta viết ra: thước đo hiệu năng, xác suất, thưởng. Mô hình sai thì lời giải “tối ưu” vẫn sai — kiểm lại giả định với thực tế.</span></div>

      '
    say: Lỗi thứ ba, quên rằng mô hình là giả định, nên tối ưu sai bài. Mọi thuật toán trong khoá tối ưu cho mô hình ta viết ra, gồm thước đo hiệu năng, xác suất và thưởng. Mô hình sai thì lời giải tối ưu vẫn sai, nên hãy kiểm lại giả định với thực tế. Bất kỳ thuật toán thông minh nào cũng chỉ tối ưu trên mô hình mà ta viết ra, nên sai lệch ở hàm mục tiêu hoặc giả định luôn dẫn tới lời giải sai. Xác minh đầy đủ giả định độc lập và tính quan sát được bảo vệ toàn bộ mô hình suy luận khỏi dự báo lệch.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  steps:
  - show: '<table class="t"><tr><th>bài</th><th>chọn công cụ cho</th></tr>

      <tr><td>1</td><td>Xếp lịch thi cho 300 môn, hai môn có chung sinh viên không được trùng giờ.</td></tr>

      <tr><td>2</td><td>Chẩn đoán lỗi máy in từ vài triệu chứng, mỗi lỗi gây triệu chứng với xác suất khác nhau.</td></tr>

      <tr><td>3</td><td>Robot giao hàng trong kho, bánh xe đôi khi trượt, muốn tối đa số đơn giao đúng hạn.</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    say: Bây giờ đến lượt bạn tự làm, hãy chọn công cụ cho từng bài. Bài một, xếp lịch thi cho 300 môn, hai môn có chung sinh viên không được trùng giờ. Bài hai, chẩn đoán lỗi máy in từ vài triệu chứng, mỗi lỗi gây triệu chứng với xác suất khác nhau. Bài ba, robot giao hàng trong kho, bánh xe đôi khi trượt, muốn tối đa số đơn giao đúng hạn. Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① <b>Thoả ràng buộc</b> (biến: giờ thi; ràng buộc: môn chung sinh viên khác giờ) — giống tô màu bản đồ; có thể kết hợp tìm kiếm cục bộ khi rất lớn.</p>

      '
    say: Đáp án bài một, dùng thoả ràng buộc, biến là giờ thi, ràng buộc là môn chung sinh viên phải khác giờ, giống tô màu bản đồ. Khi bài rất lớn, có thể kết hợp tìm kiếm cục bộ.
  - show: '<p>② <b>Mạng Bayes</b>: lỗi là nguyên nhân, triệu chứng là bằng chứng; hỏi xác suất từng lỗi khi biết triệu chứng.</p>

      '
    say: Bài hai, dùng mạng Bayes, lỗi là nguyên nhân, triệu chứng là bằng chứng, và ta hỏi xác suất từng lỗi khi biết triệu chứng.
  - show: '<p>③ <b>Quá trình quyết định Markov</b> (bài 12: trạng thái, hành động có xác suất chuyển, thưởng): hành động không chắc thành công → lặp giá trị, hoặc học Q (học giá trị từng cặp ô–hành động từ các lần đi thử) nếu không biết xác suất trượt.</p>

      '
    say: Bài ba, dùng quá trình quyết định Markov như ở bài 12, gồm trạng thái, hành động có xác suất chuyển, và thưởng, vì hành động không chắc thành công. Giải bằng lặp giá trị, hoặc học Q, tức học giá trị từng cặp ô và hành động từ các lần đi thử, nếu không biết xác suất trượt.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/AIF/L13
  steps:
  - show: <table class='t'><tr><th>Thực hành AIF:L13</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Chọn cách tiếp cận theo loại môi trường và loại câu hỏi; Giải thích vì sao trò chơi lớn cần hàm đánh giá học được; Nối AI cổ điển với học máy</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>b=20 d_full=60 d_cut=3</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh AIF L13 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 13 với dữ liệu đọc từ luồng chuẩn. Đọc kỹ định dạng tham số trong tệp đề bài, tách đúng các cặp khoá giá trị rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn.
    clear: true
