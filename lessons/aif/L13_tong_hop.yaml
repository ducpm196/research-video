id: L13
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 13 — Tổng hợp: khi nào tìm kiếm, khi nào suy luận, khi nào học"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L13; audit/aif/verify_aif.py L13; C. Shannon, Programming a Computer for Playing Chess (1950) — hệ số nhánh ≈ 35, ván ≈ 80 nước; D. Silver và cộng sự, Mastering the game of Go with deep neural networks and tree search, Nature 529 (2016); AIMA bản 4 (2020), chương 2, 28"
assumes: [arith, power, approx, log, cdot]
# Quy ước: 35 và 80 là ước lượng trung bình kinh điển (Shannon 1950), không phải hằng số chính xác; 35⁸⁰ tính bằng log₁₀.
#   Bảng chọn phương pháp tóm tắt bài 1–12 của khoá; tên phương pháp như ở các bài trước (A* đọc “A sao”).
objectives:
  - "Chọn cách tiếp cận theo loại môi trường và loại câu hỏi"
  - "Giải thích vì sao trò chơi lớn cần hàm đánh giá học được"
  - "Nối AI cổ điển với học máy"
asr_reviewed:
  - {sentence: "Ta sẽ thấy mỗi chặng tìm kiếm và học được kết hợp ra sao.", reason: "ASR chép “Ta sẽ thấy mỗi chặn tìm kiếm và học được cất hợp ra sau.” (0.786): lệch âm/thanh thuần Việt: chặng/chặn, kết/cất, sao/sau — NOT_VERIFIED bằng tai người"}
  - {sentence: "Không chắc chắn về thế giới thì dùng mạng Bayes.", reason: "ASR chép “không chắc chắn về thế giới thì dùng mạng bayát.” (0.9): “Bayes” đọc “Bay-ét” theo lexicon chung, ASR chép “bayát” — cùng dáng âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, ở bài 6 ta đã thấy cắt tỉa alpha beta bỏ những nhánh chắc chắn không được chọn.", reason: "ASR chép “Bước 3. Ở bài 6 ta đã thấy các tỉa an pha beta bỏ những nhánh chắc chắn không được chọn.” (0.837): beta đọc “bê-ta”, ASR viết “bê/beta”; alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: cắt/các — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bài hai, dùng mạng Bayes, lỗi là nguyên nhân, triệu chứng là bằng chứng, và ta hỏi xác suất từng lỗi khi biết triệu chứng.", reason: "ASR chép “Bài 2 Dùng mạn bay x lỗi là nguyên nhân, triệu chứng là bằng chứng và ta hỏi xác xuất từng lỗi khi biết triệu chứng.” (0.923): Bayes đọc “Bay-ét” theo lexicon chung (probe 3/8, NOT_VERIFIED), ASR viết “bay X/S”; lệch âm/thanh thuần Việt: mạng/mạn — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cờ vua: 10¹²³ nút"
    checks:
      - "int(80 * math.log10(35)) == 123"
    steps:
      - show: |
          <p>Cờ vua: mỗi lượt khoảng 35 nước, một ván khoảng 80 nước. Cây trò chơi có cỡ $35^{80} \approx 10^{123}$ nút — nhiều hơn số nguyên tử trong vũ trụ quan sát được. Vậy máy chơi cờ giỏi bằng cách nào?</p>
          <div class="box key">Hôm nay: <b>tổng hợp</b> các công cụ của khoá, và biết chọn công cụ nào cho bài toán nào.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trong cờ vua, mỗi lượt có khoảng 35 nước, một ván khoảng 80 nước. Cây trò chơi có cỡ 35 mũ 80, xấp xỉ 10 mũ 123 nút, nhiều hơn số nguyên tử trong vũ trụ quan sát được. Vậy máy chơi cờ giỏi bằng cách nào? Hôm nay ta tổng hợp các công cụ của khoá, và học cách chọn công cụ nào cho bài toán nào."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: đếm chữ số bằng lôgarit cơ số 10"
    checks:
      - "round(math.log10(1000)) == 3 and round(math.log10(35), 3) == 1.544"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>$\log$ (cơ số 10)</th><th>nghĩa</th></tr>
          <tr><td>1000</td><td>3</td><td>$10^3$: số có 4 chữ số</td></tr>
          <tr><td>35</td><td>≈ 1,544</td><td>$35 \approx 10^{1{,}544}$</td></tr></table>
          <p>Vì lôgarit biến phép mũ thành phép nhân: $\log(35^{80}) = 80 \cdot \log 35$ (cơ số 10).</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Ta cần một mẹo từ khoá toán, lôgarit cơ số 10 cho biết số có cỡ bao nhiêu chữ số. Lôgarit của 1000 bằng 3, vì 1000 là 10 mũ 3. Lôgarit của 35 xấp xỉ 1 phẩy 544. Vì lôgarit biến phép mũ thành phép nhân, lôgarit của 35 mũ 80 bằng 80 nhân lôgarit của 35."

  - id: sym
    kind: symbol
    title: "Bản đồ công cụ của khoá"
    steps:
      - show: |
          <table class="t"><tr><th>bài toán có dạng</th><th>công cụ</th><th>bài</th></tr>
          <tr><td>tìm đường, tất định, biết hết</td><td>chiều rộng, chi phí đều, A*</td><td>1–3</td></tr>
          <tr><td>chỉ cần cấu hình cuối tốt</td><td>leo đồi, tôi luyện</td><td>4</td></tr>
          <tr><td>biến và ràng buộc</td><td>quay lui + kiểm tra tiến</td><td>5</td></tr>
          <tr><td>có đối thủ</td><td>cực đại–cực tiểu, alpha–beta, cây mô phỏng ngẫu nhiên</td><td>6–7</td></tr>
          <tr><td>tri thức chắc chắn, câu hỏi đúng/sai</td><td>kiểm mô hình, suy diễn tiến–lùi</td><td>8–9</td></tr>
          <tr><td>đạt mục tiêu bằng dãy hành động</td><td>lập kế hoạch</td><td>10</td></tr>
          <tr><td>không chắc chắn về thế giới</td><td>mạng Bayes</td><td>11</td></tr>
          <tr><td>không chắc chắn về kết quả hành động</td><td>lặp giá trị, lặp chính sách</td><td>12</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9"]
        say: "Bảng là bản đồ công cụ của cả khoá, cột cuối ghi số bài để bạn ôn lại. Bài toán tìm đường, tất định và biết hết thì dùng tìm theo chiều rộng, chi phí đều, hay A sao. Chỉ cần cấu hình cuối tốt thì dùng leo đồi hay tôi luyện. Có biến và ràng buộc thì dùng quay lui kèm kiểm tra tiến. Có đối thủ thì dùng cực đại cực tiểu, alpha beta, hay cây mô phỏng ngẫu nhiên. Tri thức chắc chắn với câu hỏi đúng sai thì dùng kiểm mô hình hay suy diễn tiến lùi. Đạt mục tiêu bằng một dãy hành động thì dùng lập kế hoạch. Không chắc chắn về thế giới thì dùng mạng Bayes. Không chắc chắn về kết quả hành động thì dùng lặp giá trị hay lặp chính sách."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ba câu hỏi để chọn công cụ"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><defs><marker id="arA13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
          <g stroke="#6b7280" stroke-width="3"><line x1="390" y1="80" x2="560" y2="80" marker-end="url(#arA13)"/><line x1="890" y1="80" x2="1060" y2="80" marker-end="url(#arA13)"/>
          <line x1="230" y1="115" x2="230" y2="230" marker-end="url(#arA13)"/><line x1="730" y1="115" x2="730" y2="230" marker-end="url(#arA13)"/><line x1="1230" y1="115" x2="1230" y2="230" marker-end="url(#arA13)"/></g>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="70" y="45" width="320" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="230" y="88">kết quả hành động chắc?</text>
          <rect x="570" y="45" width="320" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="730" y="88">có đối thủ?</text>
          <rect x="1070" y="45" width="320" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="1230" y="88">cần đường hay cấu hình?</text>
          <rect x="70" y="235" width="320" height="80" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="230" y="270">không → bài 11–12</text><text x="230" y="302" font-size="21">xác suất, lặp giá trị</text>
          <rect x="570" y="235" width="320" height="80" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="730" y="270">có → bài 6–7</text><text x="730" y="302" font-size="21">alpha–beta, cây mô phỏng</text>
          <rect x="1070" y="235" width="320" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1230" y="270">đường → 1–3, cấu hình → 4–5</text><text x="1230" y="302" font-size="21">A*; leo đồi, ràng buộc</text></g>
          <g font-size="22" fill="#6b7280"><text x="420" y="65">chắc</text><text x="920" y="65">không</text></g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là ba câu hỏi để chọn công cụ. Đầu tiên, kết quả hành động có chắc không, nếu không thì dùng xác suất và lặp giá trị của bài 11 và 12. Nếu chắc, hỏi tiếp có đối thủ không, có thì dùng alpha beta hay cây mô phỏng. Nếu không có đối thủ, hỏi cần đường đi hay cấu hình cuối, để chọn giữa A sao và leo đồi hay ràng buộc."

  - id: example
    kind: example
    title: "Khi không duyệt hết được: cắt độ sâu và học hàm đánh giá"
    checks:
      - "35 ** 4 == 1500625 and 35 ** 2 + 35 ** 2 - 1 == 2449"
      - "int(80 * math.log10(35)) == 123"
    steps:
      - show: |
          <p><b>Bước 1 — cây đầy đủ cỡ nào?</b> $\log(35^{80}) = 80 \cdot 1{,}544 \approx 123{,}5$ → $35^{80} \approx 10^{123}$ nút.</p>
        say: "Bước một, cây đầy đủ cỡ bao nhiêu? Lôgarit của 35 mũ 80 bằng 80 nhân 1 phẩy 544, xấp xỉ 123 phẩy 5, nên cây có cỡ 10 mũ 123 nút."
      - show: |
          <table class="t"><tr><th>kỹ thuật</th><th>số lá phải xét</th></tr>
          <tr><td><b>bước 2 — cắt độ sâu</b>: chỉ nhìn trước 4 nước</td><td>$35^4 = 1\,500\,625$</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước hai, cắt độ sâu. Chỉ nhìn trước 4 nước thì còn 35 mũ 4, tức hơn 1 triệu 500 nghìn lá."
      - show: |
          <table class="t"><tr><th>kỹ thuật</th><th>số lá phải xét</th></tr>
          <tr><td><b>bước 3 — alpha–beta, thứ tự tốt</b> (bài 6)</td><td>$35^2 + 35^2 - 1 = 2449$</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, ở bài 6 ta đã thấy cắt tỉa alpha beta bỏ những nhánh chắc chắn không được chọn. Với thứ tự xét tốt nhất, ở độ sâu 4 chỉ còn khoảng 2449 lá."
      - clear: true
        show: |
          <p><b>Bước 4 — hàm đánh giá ở lá bị cắt:</b> ước lượng thế cờ chưa kết thúc — viết tay (đếm quân) hoặc <b>học</b> từ dữ liệu.</p>
          <p>Cờ vây (2016): <b>cây mô phỏng ngẫu nhiên</b> (bài 7) kết hợp mạng nơ-ron học từ ván cờ để đánh giá thế cờ và gợi ý nước — tìm kiếm và học bổ sung cho nhau.</p>
        focus: [1, 2, 2]
        say: "Bước bốn, ở các lá bị cắt, cần một hàm đánh giá để ước lượng thế cờ chưa kết thúc, viết tay như đếm quân, hoặc học từ dữ liệu. Với cờ vây năm 2016, máy kết hợp cây mô phỏng ngẫu nhiên của bài 7 với mạng nơ-ron học từ ván cờ, để đánh giá thế cờ và gợi ý nước đi. Tìm kiếm và học bổ sung cho nhau."

  - id: check
    kind: check
    title: "Tự kiểm: đếm chữ số trực tiếp"
    checks:
      - "len(str(35 ** 80)) == 124 and int(80 * math.log10(35)) == 123"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>kết quả</th></tr>
          <tr><td>lôgarit cơ số 10: $80 \cdot \log 35 \approx 123{,}5$</td><td>cỡ $10^{123}$</td></tr>
          <tr><td>máy tính thẳng $35^{80}$ rồi đếm chữ số</td><td>124 chữ số, tức $\geq 10^{123}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, cho máy tính thẳng 35 mũ 80 rồi đếm chữ số. Theo lôgarit, số này cỡ 10 mũ 123. Máy đếm được 124 chữ số, tức là lớn hơn hoặc bằng 10 mũ 123, khớp."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng học máy cho bài đã có lời giải chính xác <b class="red">(kém tin cậy hơn)</b>
          <br><span class="note">Tìm đường trên bản đồ đã biết có A* — tối ưu, kiểm chứng được. Mô hình học được chỉ nên thay khi bài quá lớn hoặc thiếu mô hình.</span></div>
        say: "Lỗi thứ nhất, dùng học máy cho bài đã có lời giải chính xác, nên kém tin cậy hơn. Tìm đường trên bản đồ đã biết thì có A sao, tối ưu và kiểm chứng được. Mô hình học được chỉ nên thay khi bài quá lớn hoặc thiếu mô hình."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng phương pháp tất định cho môi trường ngẫu nhiên <b class="red">(kế hoạch giòn)</b>
          <br><span class="note">Kế hoạch tìm bằng A* giả định mọi bước thành công. Bánh xe trượt, cảm biến nhiễu thì cần mô hình xác suất (bài 11–12) hoặc lập kế hoạch lại liên tục.</span></div>
        say: "Lỗi thứ hai, dùng phương pháp tất định cho môi trường ngẫu nhiên, nên kế hoạch giòn. Kế hoạch tìm bằng A sao giả định mọi bước thành công. Bánh xe trượt hay cảm biến nhiễu thì cần mô hình xác suất, hoặc lập kế hoạch lại liên tục."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên rằng mô hình là giả định <b class="red">(tối ưu sai bài)</b>
          <br><span class="note">Mọi thuật toán trong khoá tối ưu cho <b>mô hình</b> ta viết ra: thước đo hiệu năng, xác suất, thưởng. Mô hình sai thì lời giải “tối ưu” vẫn sai — kiểm lại giả định với thực tế.</span></div>
        say: "Lỗi thứ ba, quên rằng mô hình là giả định, nên tối ưu sai bài. Mọi thuật toán trong khoá tối ưu cho mô hình ta viết ra, gồm thước đo hiệu năng, xác suất và thưởng. Mô hình sai thì lời giải tối ưu vẫn sai, nên hãy kiểm lại giả định với thực tế."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>chọn công cụ cho</th></tr>
          <tr><td>1</td><td>Xếp lịch thi cho 300 môn, hai môn có chung sinh viên không được trùng giờ.</td></tr>
          <tr><td>2</td><td>Chẩn đoán lỗi máy in từ vài triệu chứng, mỗi lỗi gây triệu chứng với xác suất khác nhau.</td></tr>
          <tr><td>3</td><td>Robot giao hàng trong kho, bánh xe đôi khi trượt, muốn tối đa số đơn giao đúng hạn.</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, hãy chọn công cụ cho từng bài. Bài một, xếp lịch thi cho 300 môn, hai môn có chung sinh viên không được trùng giờ. Bài hai, chẩn đoán lỗi máy in từ vài triệu chứng, mỗi lỗi gây triệu chứng với xác suất khác nhau. Bài ba, robot giao hàng trong kho, bánh xe đôi khi trượt, muốn tối đa số đơn giao đúng hạn. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① <b>Thoả ràng buộc</b> (biến: giờ thi; ràng buộc: môn chung sinh viên khác giờ) — giống tô màu bản đồ; có thể kết hợp tìm kiếm cục bộ khi rất lớn.</p>
        say: "Đáp án bài một, dùng thoả ràng buộc, biến là giờ thi, ràng buộc là môn chung sinh viên phải khác giờ, giống tô màu bản đồ. Khi bài rất lớn, có thể kết hợp tìm kiếm cục bộ."
      - show: |
          <p>② <b>Mạng Bayes</b>: lỗi là nguyên nhân, triệu chứng là bằng chứng; hỏi xác suất từng lỗi khi biết triệu chứng.</p>
        say: "Bài hai, dùng mạng Bayes, lỗi là nguyên nhân, triệu chứng là bằng chứng, và ta hỏi xác suất từng lỗi khi biết triệu chứng."
      - show: |
