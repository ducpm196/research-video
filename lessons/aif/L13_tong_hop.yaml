- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mô tả tác tử và môi trường</span><span class="a">→</span>

      <span class="n">chọn biểu diễn: trạng thái, ràng buộc, lôgic, xác suất</span><span class="a">→</span>

      <span class="n">chọn thuật toán có bảo đảm</span><span class="a">→</span>

      <span class="n">quá lớn thì cắt, ước lượng, học</span></div>

      '
    say: Tổng kết lại, bản đồ công cụ giúp bạn chọn phương pháp đúng ngay từ đầu dựa trên tính tất định, đối thủ và dạng lời giải. Với bài toán có mô hình rõ và cỡ vừa, hãy dùng thuật toán tìm kiếm, ràng buộc, logic hoặc lặp giá trị có bảo đảm toán học. Khi cây trạng thái bùng nổ quá ngưỡng hay thiếu mô hình chuyển bước, kết hợp cắt độ sâu, mô phỏng ngẫu nhiên và hàm đánh giá học được. Tổng hợp cả khoá nối liền các mô hình biểu diễn tri thức, tìm kiếm có dẫn hướng, thoả ràng buộc, đối kháng và suy luận xác suất.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="chain"><span class="n">mô tả tác tử và môi trường</span><span class="a">→</span>

      <span class="n">chọn biểu diễn: trạng thái, ràng buộc, lôgic, xác suất</span><span class="a">→</span>

      <span class="n">chọn thuật toán có bảo đảm</span><span class="a">→</span>

      <span class="n">quá lớn thì cắt, ước lượng, học</span></div>

      '
    say: Sự bổ trợ giữa suy luận cổ điển và học máy tạo nên các hệ trí tuệ nhân tạo mạnh nhất hiện nay. Khi chuyển từ mô hình đồ chơi trên lớp sang dự án sản xuất thật, điều giúp bạn không tốn công vô ích là khớp đúng bản chất bài toán với khung công cụ phù hợp nhất. Đừng bao giờ vội vã huấn luyện một mạng học sâu nặng nề nếu bài toán vốn là tìm đường trên bản đồ tĩnh hay lập lịch ràng buộc đã có thuật toán giải chính xác cực nhanh. Ngược lại khi không gian bùng nổ vượt ngưỡng duyệt hết hay thiếu mô hình rõ ràng, ta ghép thêm mô phỏng ngẫu nhiên. Hàm ước lượng học được sẽ dẫn đường đúng chỗ. Nắm trọn bức tranh tổng hợp này giúp bạn tự tin giải quyết các hệ thống thông minh hiện đại. Đặt đúng thước đo chi phí và nhớ giới hạn cắt độ sâu luôn là bước bảo vệ hệ thống chạy ổn định ngoài thực tế.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
  - show: '<div class="box key"><b>Tư duy:</b> học máy và AI cổ điển không đối đầu — hệ thống mạnh nhất thường <b>tìm kiếm</b> có <b>ước lượng học được</b>.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Cờ vua 80 nước sâu $\approx 10^{123}$ nút (không thể duyệt hết), cắt sâu 4 kết hợp tỉa nhánh alpha–beta (cắt nhánh kém từ sớm) còn khoảng 2 449 nút rồi giao cho hàm đánh giá học được trên dữ liệu hàng triệu ván.</p>

      '
    say: Điều cần mang theo, học máy và trí tuệ nhân tạo cổ điển không đối đầu nhau, hệ thống mạnh nhất thường là tìm kiếm có ước lượng học được. Những kiến trúc trí tuệ nhân tạo đột phá nhất luôn kết hợp tìm kiếm chặt chẽ với hàm ước lượng được huấn luyện từ dữ liệu.
    focus:
    - 1
    - 0
  - clear: true
    show: '<p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — máy chơi cờ từ chip cờ riêng năm 1988 tới một thuật toán tự học chơi ba trò năm 2018.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 14, ta đi lại ba mươi năm làm máy chơi cờ, từ chip cờ riêng năm 1988 tới một thuật toán tự học chơi cả ba trò năm 2018.
