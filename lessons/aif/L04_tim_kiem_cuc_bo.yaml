  - show: '<p><b>Bước 4 — tổng số bước kỳ vọng:</b> trung bình 5,7 lần kẹt, mỗi lần 3,05 bước, cộng lần cuối thành công 4,11 bước:</p>

      $$\frac{1 - p}{p} \cdot 3{,}05 + 4{,}11 \approx 5{,}7 \cdot 3{,}05 + 4{,}11 \approx \hl{21{,}5} \text{ bước}$$

