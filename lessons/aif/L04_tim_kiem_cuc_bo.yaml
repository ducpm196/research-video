    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Bước hai, chạy thật 5000 lần leo đồi dốc nhất trên 8 hậu, mỗi lần từ một trạng thái ngẫu nhiên. 14 phẩy 9 phần trăm số lần tìm được lời giải, trung bình sau 4 phẩy 11 bước. 85 phẩy 1 phần trăm bị kẹt, trung bình sau 3 phẩy 05 bước thì dừng. Thất bại ở hơn tám mươi lăm phần trăm lượt chạy đơn lẻ phơi bày nhược điểm chí mạng của chiến lược chỉ chọn bước đi tốt hơn.
  - clear: true
