    - 1
    - 1
    say: Cách thoát thứ hai là mô phỏng tôi luyện. Thuật toán chọn một láng giềng ngẫu nhiên, tốt hơn thì nhận, xấu đi một lượng đen-ta thì vẫn nhận với xác suất e mũ âm đen-ta chia T. Nhiệt độ T cao lúc đầu nên đi lung tung và thoát được cực tiểu, rồi giảm dần về 0, khi đó thuật toán trở thành leo đồi. Cho phép thỉnh thoảng bước lên dốc theo xác suất giảm dần giúp thuật toán nhảy qua sườn đồi để rơi xuống thung lũng sâu hơn.
  - show: <p><b>Bước 5 — đếm số cặp hậu tấn công nhau trên bàn cờ bằng Python</b>:</p><div class="code"><div>def conflicts(b):</div><div>    n = len(b)</div><div>    return sum(b[i] == b[j] or abs(b[i] - b[j]) == j - i</div><div>               for i in range(n) for j in range(i + 1, n))</div><div>print(conflicts([0, 1, 2, 3]), conflicts([1, 3, 0, 2]))</div></div>
    say: Bước năm, hàm Python sau đây đánh giá hàm mục tiêu số cặp hậu xung đột trên mọi cột. Hai quân hậu xung đột khi cùng nằm trên một hàng hoặc có hiệu hàng bằng hiệu cột trên đường chéo. Trạng thái nằm trên đường chéo chính trả về 6 cặp xung đột, còn cấu hình nghiệm trả về 0.
    clear: true
    focus: null
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - alg.queens_conflicts([0, 0, 0, 0]) == 6 == 4 * 3 // 2 and alg.queens_conflicts([1, 3, 0, 2]) == 0
  - abs(sum(k * 0.149 * (1 - 0.149) ** (k - 1) for k in range(1, 3000)) - 1 / 0.149) < 1e-6
  steps:
  - show: '<table class="t"><tr><th>con số</th><th>đường khác</th><th>kết quả</th></tr>

      <tr><td>6 cặp khi 4 hậu cùng hàng</td><td>số cặp từ 4 phần tử: $\frac{4 \cdot 3}{2}$</td><td>6 ✓</td></tr>

      <tr><td>$\frac{1}{p} \approx 6{,}7$ lần</td><td>cộng thẳng: 1 lần với xác suất $p$, 2 lần với xác suất $(1-p) p$, …</td><td>6,71 ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Ở 4 hậu có thể nhẩm đường đi trong vài bước; với 10 000 hậu (hơn 10⁴⁰⁰⁰⁰ trạng thái), leo đồi + khởi động lại chỉ dùng bộ nhớ $O(N)$ (tuyến tính theo số biến) và giải trong vài giây, đánh đổi bảo đảm luôn tìm ra ngay ở lần đầu.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - 2
    - 2
    - 2
    say: Kiểm hai con số bằng đường khác. Khi 4 hậu cùng hàng, số cặp chính là số cách chọn 2 trong 4, bằng 4 nhân 3 chia 2, đúng 6. Với số lần chạy kỳ vọng, ta cộng thẳng từng khả năng, 1 lần với xác suất p, 2 lần với xác suất 1 trừ p nhân p, và cứ thế. Máy cộng ra 6 phẩy 71, khớp 1 chia p, vì hai cách tính cùng một kỳ vọng. Ở hai mức quy mô, ví dụ 4 hậu giải nhanh bằng tay trong vài bước. Với 10 nghìn hậu, leo đồi kèm khởi động lại chỉ tốn bộ nhớ tuyến tính và giải trong vài giây nhưng đánh đổi bảo đảm luôn ra ngay lần đầu. Đếm trực tiếp công thức tổ hợp chập hai và kiểm chứng kì vọng hình học một chia xác suất xác nhận hoàn toàn ăn khớp số liệu thực nghiệm năm nghìn lượt.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - sum(1 for p in __import__('itertools').permutations(range(8)) if alg.queens_conflicts(list(p)) == 0) == 92
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Leo đồi kẹt thì kết luận “vô nghiệm” <b class="red">(sai)</b>

      <br><span class="note">Leo đồi không đầy đủ (không bảo đảm tìm ra lời giải dù lời giải có tồn tại): 85% lần chạy kẹt dù bài toán 8 hậu có 92 lời giải. Kẹt chỉ nói về điểm xuất phát, không nói về bài toán.</span></div>

      '
    say: Lỗi thứ nhất, leo đồi kẹt thì kết luận vô nghiệm, điều này sai. Leo đồi không đầy đủ, tức không bảo đảm tìm ra lời giải dù lời giải có tồn tại. 85 phần trăm số lần chạy bị kẹt dù bài toán 8 hậu có 92 lời giải. Kẹt chỉ nói về điểm xuất phát, không nói về bài toán. Không bao giờ kết luận bài toán vô nghiệm chỉ vì leo đồi bị kẹt tại cực tiểu địa phương; phương pháp này hoàn toàn không đầy đủ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Giảm nhiệt độ quá nhanh <b class="red">(thành leo đồi)</b>

      <br><span class="note">Nhiệt độ về gần 0 ngay thì gần như không bao giờ nhận bước xấu → kẹt như leo đồi. Lịch giảm nhiệt là tham số phải thử và đo.</span></div>

      '
    say: Lỗi thứ hai, giảm nhiệt độ quá nhanh, nên thuật toán thành leo đồi. Nhiệt độ về gần 0 ngay thì gần như không bao giờ nhận bước xấu, và kẹt như leo đồi. Lịch giảm nhiệt là một tham số phải thử và đo. Lịch làm nguội quá gấp đẩy xác suất nhận bước xấu về không ngay từ những vòng đầu làm mô phỏng tôi luyện thoái hoá thành leo đồi.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dùng tìm kiếm cục bộ khi cần cả đường đi <b class="red">(chọn sai công cụ)</b>

      <br><span class="note">Tìm kiếm cục bộ chỉ giữ trạng thái hiện tại, không bảo đảm đường ngắn nhất. Hợp với bài cần cấu hình cuối (xếp lịch, bố trí, 8 hậu); bài cần đường đi tối ưu dùng A*.</span></div>

      '
    say: Lỗi thứ ba, dùng tìm kiếm cục bộ khi cần cả đường đi, tức chọn sai công cụ. Tìm kiếm cục bộ chỉ giữ trạng thái hiện tại, không bảo đảm đường ngắn nhất. Nó hợp với bài cần cấu hình cuối như xếp lịch, bố trí, hay 8 hậu, còn bài cần đường đi tối ưu thì dùng A sao. Nếu ứng dụng cần xuất ra chuỗi các bước biến đổi hợp lệ từng bước từ đầu tới đích, bắt buộc phải quay về nhóm tìm kiếm theo cây.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '[round(math.exp(-1 / t), 3) for t in (2, 0.5)] == [0.607, 0.135] and round(1 - (1 - 0.149) ** 10, 2) == 0.8'
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Mô phỏng tôi luyện, bước xấu đi $\Delta = 1$: xác suất nhận ở $T = 2$ và $T = 0{,}5$ là bao nhiêu?</td></tr>

      <tr><td>2</td><td>Leo đồi thành công 14,9% mỗi lần chạy. Chạy tối đa 10 lần (tính cả lần đầu) thì xác suất tìm được lời giải là bao nhiêu?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, trong mô phỏng tôi luyện, một bước xấu đi đen-ta bằng 1 được nhận với xác suất bao nhiêu khi T bằng 2, và khi T bằng 0 phẩy 5? Câu hai, leo đồi thành công 14 phẩy 9 phần trăm mỗi lần chạy, chạy tối đa 10 lần tính cả lần đầu thì xác suất tìm được lời giải là bao nhiêu? Dừng video và làm ra giấy.
    pause: 15
  - show: '<table class="t"><tr><th>nhiệt độ</th><th>xác suất nhận bước xấu $\Delta = 1$</th></tr>

      <tr><td>$T = 2$</td><td>$e^{-1/2} \approx \hl{0{,}607}$</td></tr>

      <tr><td>$T = 0{,}5$</td><td>$e^{-1/0{,}5} = e^{-2} \approx \hl{0{,}135}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Đáp án câu một, ta chỉ thay số vào công thức. Với T bằng 2, e mũ âm 1 phần 2 xấp xỉ 0 phẩy 607. Với T bằng 0 phẩy 5, e mũ âm 2 xấp xỉ 0 phẩy 135, nên nguội hơn thì khó nhận bước xấu hơn.
  - show: '<p>② Xác suất <b>cả 10 lần đều kẹt</b>: $(1 - 0{,}149)^{10} = 0{,}851^{10} \approx 0{,}20$. Vậy tìm được lời giải: $1 - 0{,}20 \approx \hl{0{,}80}$.</p>

      '
    say: Câu hai, tính qua phần bù. Xác suất cả 10 lần đều kẹt là 0 phẩy 851 mũ 10, xấp xỉ 0 phẩy 20, nên xác suất tìm được lời giải là 1 trừ 0 phẩy 20, xấp xỉ 0 phẩy 80.
