  - clear: true
    show: '<p><b>Mô phỏng tôi luyện</b>: chọn láng giềng ngẫu nhiên; tốt hơn thì nhận; xấu đi một lượng $\Delta$ thì vẫn nhận với xác suất $e^{-\Delta / T}$. Nhiệt độ $T$ cao lúc đầu (đi lung tung, thoát được cực tiểu), giảm dần về 0 (thành leo đồi).</p>

