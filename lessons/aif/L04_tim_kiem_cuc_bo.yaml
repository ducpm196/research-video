scenes:
- id: hook
  kind: hook
  title: Tám quân hậu, 17 cặp đang tấn công nhau
  checks:
  - alg.queens_conflicts([4, 5, 6, 3, 4, 5, 6, 5]) == 17
  steps:
  - show: '<p>Đặt 8 quân hậu lên bàn cờ, mỗi cột một quân, sao cho không cặp nào tấn công nhau. Một cách xếp ngẫu nhiên có <b>17</b> cặp tấn công. Ở đây ta không cần <b>đường đi</b> — chỉ cần <b>trạng thái cuối</b> tốt. Vậy cứ sửa dần cho đỡ xung đột được không?</p>

      <div class="box key">Hôm nay: <b>tìm kiếm cục bộ</b> — chỉ giữ một trạng thái và cải thiện dần; vì sao nó kẹt, và hai cách thoát.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, đặt 8 quân hậu lên bàn cờ, mỗi cột một quân, sao cho không cặp nào tấn công nhau. Một cách xếp ngẫu nhiên có 17 cặp đang tấn công. Ở đây ta không cần đường đi, chỉ cần trạng thái cuối tốt. Vậy cứ sửa dần cho đỡ xung đột được không? Hôm nay ta học tìm kiếm cục bộ, chỉ giữ một trạng thái và cải thiện dần, vì sao nó kẹt, và hai cách thoát. Thay vì ghi nhớ hàng triệu nút đường đi không cần thiết, tìm kiếm cục bộ chỉ giữ một cấu hình duy nhất và sửa dần tới khi hết xung đột.
- id: prereq
  kind: prereq
  title: 'Ôn lại: hai hậu tấn công nhau khi nào, và số lần thử kỳ vọng'
  checks:
  - '(lambda a, b: abs(a[0] - b[0]) == abs(a[1] - b[1]))((0, 0), (2, 2)) and not (lambda a, b: abs(a[0] - b[0]) == abs(a[1] - b[1]))((1, 0), (3, 3))'
  - round(1 / 0.5) == 2 and round(math.exp(-1), 3) == 0.368
  - 100 / 50 == 2 and round(math.exp(2), 3) == 7.389 and round(1 / 7.389, 3) == 0.135 == round(math.exp(-2), 3) and round(1 / 2.718, 3) == 0.368
  steps:
  - show: '<table class="t"><tr><th>hai hậu (hàng, cột)</th><th>cùng hàng?</th><th>cùng đường chéo? (chênh hàng = chênh cột)</th><th>tấn công?</th></tr>

      <tr><td>(0, 0) và (2, 2)</td><td>không</td><td>2 = 2 → có</td><td class="red">có</td></tr>

      <tr><td>(1, 0) và (3, 3)</td><td>không</td><td>2 ≠ 3 → không</td><td class="green">không</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Mỗi cột chỉ có một hậu, nên hai hậu tấn công nhau khi cùng hàng, hoặc cùng đường chéo, tức chênh lệch hàng bằng chênh lệch cột. Hậu ở hàng 0 cột 0 và hậu ở hàng 2 cột 2 có chênh hàng 2 bằng chênh cột 2, nên tấn công nhau. Hậu ở hàng 1 cột 0 và hậu ở hàng 3 cột 3 có chênh hàng 2 khác chênh cột 3, nên không. Kiểm tra đồng thời cùng hàng và hiệu trị tuyệt đối bằng nhau phát hiện nhanh mọi cặp hậu tấn công trên ma trận bàn cờ.
  - show: '<p><b>Số lần thử kỳ vọng:</b> tung đồng xu tới khi ra mặt ngửa, mỗi lần thành công với $p = \frac{1}{2}$ → trung bình cần $\frac{1}{p} = 2$ lần. Vì sao: tung 100 lần thì khoảng 50 lần ngửa, tức mỗi lần thành công “tốn” trung bình $100 / 50 = 2$ lần tung.</p>

      <p><b>Hàm mũ:</b> $e \approx 2{,}718$ là một hằng số; $e^{-x}$ nghĩa là $1$ chia $e^{x}$. Ví dụ $e^{-1} = \frac{1}{2{,}718} \approx 0{,}368$, $e^{-2} = \frac{1}{7{,}389} \approx 0{,}135$: số mũ mang giá trị âm lớn kéo kết quả tiến sát về 0.</p>

      '
    introduces:
    - exp
    - inverse
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Ta cần thêm hai điều. Tung đồng xu tới khi ra mặt ngửa, mỗi lần thành công với xác suất một nửa, thì trung bình cần 1 chia p, bằng 2 lần. Lý do là tung 100 lần thì khoảng 50 lần ngửa, nên mỗi lần thành công tốn trung bình 2 lần tung. Số e xấp xỉ 2 phẩy 718 là một hằng số, và e mũ âm x nghĩa là 1 chia cho e mũ x. Ví dụ e mũ âm 1 là 1 chia 2 phẩy 718, xấp xỉ 0 phẩy 368, còn e mũ âm 2 là 1 chia 7 phẩy 389, xấp xỉ 0 phẩy 135. Số mũ mang giá trị âm lớn kéo kết quả tiến sát về 0.
- id: sym
  kind: symbol
  title: 'Giải mã: hàm mục tiêu, láng giềng, leo đồi'
  checks:
  - 8 * 7 == 56
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>8 hậu</th></tr>

      <tr><td><b>trạng thái</b></td><td>hàng của hậu ở từng cột</td></tr>

      <tr><td><b>hàm mục tiêu</b> $h$</td><td>số cặp hậu tấn công nhau; muốn $h = 0$</td></tr>

      <tr><td><b>láng giềng</b></td><td>dời một hậu trong cột của nó: $8 \cdot 7 = 56$ láng giềng</td></tr>

      <tr><td><b>leo đồi dốc nhất</b></td><td>chuyển sang láng giềng có $h$ nhỏ nhất; dừng khi không láng giềng nào tốt hơn</td></tr></table>

      <p>Dừng ở chỗ không có láng giềng tốt hơn nhưng $h \gt 0$: <b>cực tiểu địa phương</b>. Láng giềng tốt nhất chỉ <b>bằng</b> chứ không tốt hơn trạng thái hiện tại: <b>cao nguyên</b> (vùng phẳng) — không biết đi đâu.</p>

      '
    introduces:
    - cdot
    - ltgt
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    - 2
    say: Bảng giới thiệu bốn khái niệm cho bài toán 8 hậu. Trạng thái là hàng của hậu ở từng cột. Hàm mục tiêu h là số cặp hậu tấn công nhau, và ta muốn h bằng 0. Láng giềng là dời một hậu trong cột của nó, có 8 nhân 7 bằng 56 láng giềng. Leo đồi dốc nhất chuyển sang láng giềng có h nhỏ nhất, và dừng khi không láng giềng nào tốt hơn. Dừng ở chỗ không có láng giềng tốt hơn nhưng h vẫn lớn hơn 0 gọi là cực tiểu địa phương. Còn khi láng giềng tốt nhất chỉ bằng chứ không tốt hơn trạng thái hiện tại, ta đang ở một vùng phẳng gọi là cao nguyên, thuật toán không biết đi đâu. Chuyển mỗi quân hậu lên xuống trong cùng cột tạo ra năm mươi sáu láng giềng kế cận để đánh giá độ dốc giảm xung đột.
