      '
    say: Cài đặt bộ giải cho bài toán đảo chồng ba khối ngay sau đây minh hoạ rõ cách biểu diễn và cập nhật tập sự kiện. Trong các hệ robot kho vận, mỗi thao tác được viết gọn thành tiền điều kiện và hiệu ứng thêm xoá. Cách mô tả chung giúp tái sử dụng bộ giải tìm kiếm chuẩn. Thay vì viết tay từng kịch bản riêng rất dễ gãy khi đổi quy tắc kho, ta chỉ thêm mẫu hành động mới. Hệ tìm kiếm sẽ tự tìm ra dãy bước hợp lệ. Khi không gian đạt hàng triệu cấu hình, ta rút ra hàm đánh giá bằng cách tạm bỏ hiệu ứng xoá. Cách này dẫn đường tìm kiếm về đích nhanh mà vẫn an toàn. Đừng quên kiểm tra thật kỹ thứ tự giải phóng vật nằm bên trên trước khi nhấc vật nằm bên dưới để tránh kế hoạch không hợp lệ. Cần lưu ý rằng các hành động đảo vị trí khối đòi hỏi kiểm soát chặt xem đỉnh khối đó đã thật sự trống hay chưa trước khi nhấc lên.
