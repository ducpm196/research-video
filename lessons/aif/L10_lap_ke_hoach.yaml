- id: check
  kind: check
  title: 'Tự kiểm: vì sao không thể ít hơn 3 bước'
  checks:
  - alg.blocks_apply({('A', 'B'), ('B', 'C'), ('C', 'T')}, [('A', 'T'), ('B', 'A'), ('C', 'B')]) == {('A', 'T'), ('B', 'A'), ('C', 'B')}
  - len({x for x, y in {('A', 'T'), ('B', 'A'), ('C', 'B')}} - {x for x, y in {('A', 'T'), ('B', 'A'), ('C', 'B')} & {('A', 'B'), ('B', 'C'), ('C', 'T')}}) == 3
  steps:
  - show: '<table class="t"><tr><th>khối</th><th>đang nằm trên</th><th>mục tiêu nằm trên</th><th>phải di chuyển?</th></tr>

      <tr><td>A</td><td>B</td><td>bàn</td><td>có</td></tr>

      <tr><td>B</td><td>C</td><td>A</td><td>có</td></tr>

      <tr><td>C</td><td>bàn</td><td>B</td><td>có</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Chồng 3 khối chỉ có 13 trạng thái (&lt; 1 mi-li-giây cho tìm theo chiều rộng <b>BFS</b>); kho vận 100 kiện hàng ($\approx 10^{150}$ trạng thái) làm tìm theo chiều rộng cạn bộ nhớ ngay, bắt buộc phải kết hợp hàm đánh giá hoặc lập kế hoạch phân cấp.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    - 2
    say: Kiểm bằng một lập luận khác, không cần tìm kiếm. Khối A đang trên B nhưng phải về bàn, nên phải di chuyển. Khối B đang trên C nhưng phải lên A, cũng phải di chuyển. Khối C đang trên bàn nhưng phải lên B, cũng vậy. Ở hai mức quy mô, ví dụ 3 khối chỉ có 13 trạng thái xong trong chưa tới 1 mi li giây. Kho vận 100 kiện hàng bùng nổ lên 10 mũ 150 trạng thái nên bắt buộc dùng thêm hàm đánh giá ước lượng. Chứng minh cận dưới ba hành động vì cả ba khối đều đổi chỗ khẳng định kế hoạch ba bước do tìm kiếm theo chiều rộng tìm ra đã chạm ngưỡng ngắn nhất.
  - show: '<div class="chain"><span class="n">mỗi hành động dời đúng 1 khối</span><span class="a">→</span><span class="n">cả 3 khối phải dời</span><span class="a">→</span><span class="n">cần ít nhất 3 bước</span><span class="a">→</span><span class="n">kế hoạch 3 bước là ngắn nhất ✓</span></div>

      '
    say: Vì mỗi hành động chỉ dời một khối, mà cả 3 khối đều phải dời, nên cần ít nhất 3 bước. Kế hoạch 3 bước là ngắn nhất, khớp kết quả tìm theo chiều rộng.
