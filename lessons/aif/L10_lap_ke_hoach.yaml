</text><rect x="1240" y="128" width="80" height="58" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2.5"/><text x="1280" y="167">B</text><rect x="1240" y="66" width="80" height="58" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2.5"/><text x="1280" y="105">C</text><text x="1245" y="300" font-size="24" font-weight="normal">③ C lên B</text></g></svg></div>

