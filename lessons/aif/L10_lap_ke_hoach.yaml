  checks:
  - alg.blocks_plan({('C', 'A'), ('A', 'T'), ('B', 'T')}, {('A', 'B'), ('B', 'C')}) == [('C', 'T'), ('B', 'C'), ('A', 'B')]
  - '[sum(map(len, alg.blocks_subgoals({(''C'', ''A''), (''A'', ''T''), (''B'', ''T'')}, g))) for g in ([(''A'', ''B''), (''B'', ''C'')], [(''B'', ''C''), (''A'', ''B'')])] == [5, 7]'
  steps:
  - clear: true
    show: '<div class="box warn"><b>Lỗi 1.</b> Đạt từng mục tiêu con riêng lẻ <b class="red">(phá mục tiêu đã đạt)</b>

      <br><span class="note">Đầu: C trên A, A và B trên bàn. Mục tiêu: A trên B <b>và</b> B trên C. Làm “A trên B” trước (hạ C, đặt A lên B) rồi làm “B trên C” thì phải hạ A xuống — phá mục tiêu vừa đạt. Đạt riêng từng cái theo thứ tự này tốn <b>$5$</b> bước, thứ tự ngược lại tốn <b>$7$</b>; kế hoạch tính cả hai cùng lúc chỉ <b class="green">$3$</b> bước: hạ C, đặt B lên C, đặt A lên B. Ví dụ kinh điển này gọi là <b>dị thường Sussman</b>.</span></div>

      '
    say: Lỗi thứ nhất, đạt từng mục tiêu con riêng lẻ, nên phá mục tiêu đã đạt. Trạng thái đầu là C trên A, A và B trên bàn, mục tiêu là A trên B và B trên C. Làm A trên B trước, tức hạ C và đặt A lên B, rồi làm B trên C thì phải hạ A xuống, phá mục tiêu vừa đạt. Đạt riêng từng cái theo thứ tự này tốn 5 bước, thứ tự ngược lại tốn 7 bước. Cố gắng giải lần lượt từng mục tiêu con riêng rẽ mà không xét tương tác chéo buộc robot tháo dỡ công trình vừa dựng xong để luồn khối dưới.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    - 0
  - clear: true
    show: '<div class="box warn"><b>Lỗi 1.</b> Đạt từng mục tiêu con riêng lẻ <b class="red">(phá mục tiêu đã đạt)</b>

      <br><span class="note">Đầu: C trên A, A và B trên bàn. Mục tiêu: A trên B <b>và</b> B trên C. Làm “A trên B” trước (hạ C, đặt A lên B) rồi làm “B trên C” thì phải hạ A xuống — phá mục tiêu vừa đạt. Đạt riêng từng cái theo thứ tự này tốn <b>$5$</b> bước, thứ tự ngược lại tốn <b>$7$</b>; kế hoạch tính cả hai cùng lúc chỉ <b class="green">$3$</b> bước: hạ C, đặt B lên C, đặt A lên B. Ví dụ kinh điển này gọi là <b>dị thường Sussman</b>.</span></div>

      <table class="t"><tr><th>Thứ tự</th><th>Tổng bước</th></tr><tr><td>Từng mục tiêu riêng</td><td>5–7 bước</td></tr><tr><td>Xét cả tổ hợp</td><td>3 bước</td></tr></table>

      '
    say: Kế hoạch tính cả hai cùng lúc chỉ 3 bước, hạ C, đặt B lên C, rồi đặt A lên B. Đây là một ví dụ kinh điển của môn lập kế hoạch, mang tên người đã nêu ra nó.
    focus:
    - '1.1'
    - '1.2'
  - clear: true
    show: '<div class="box warn"><b>Lỗi 2.</b> Quên hiệu ứng xoá <b class="red">(trạng thái sai)</b>

      <br><span class="note">Đặt x lên y mà không xoá “y trống” thì bước sau có thể đặt thêm khối lên y — hai khối cùng trên một khối. Mỗi hành động phải nói rõ điều gì <b>không còn đúng</b>.</span></div>

      '
    say: Lỗi thứ hai, quên hiệu ứng xoá nên trạng thái sai. Đặt x lên y mà không xoá sự kiện y trống thì bước sau có thể đặt thêm khối lên y, hai khối cùng nằm trên một khối. Mỗi hành động phải nói rõ điều gì không còn đúng. Thiếu danh sách hiệu ứng xoá làm phần mềm ảo tưởng khối cũ vẫn còn trống để nhận thêm vật khác đặt chồng lên gây ra thế giới phi lý. Kiểm soát kỹ danh sách hiệu ứng xoá ngăn không cho trạng thái cũ tồn tại giả tạo làm hỏng kế hoạch sau này.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Lập kế hoạch một lần rồi chạy mù <b class="red">(thế giới đổi)</b>

      <br><span class="note">Kế hoạch giả định hành động luôn thành công. Robot thật có thể làm rơi khối: phải kiểm trạng thái sau mỗi bước và lập kế hoạch lại khi khác dự kiến.</span></div>

      '
    say: Lỗi thứ ba, lập kế hoạch một lần rồi chạy mù, trong khi thế giới thay đổi. Kế hoạch giả định hành động luôn thành công, nhưng robot thật có thể làm rơi khối, nên phải kiểm trạng thái sau mỗi bước, và lập kế hoạch lại khi khác dự kiến. Khi chạy ngoài đời thực nơi tay gắp có thể trượt ngẫu nhiên, tác tử phải biết kiểm tra lại trạng thái sau từng bước để lập kế hoạch lại kịp thời. Lập kế hoạch lại kịp thời mỗi khi cảm biến báo thế giới thực khác với mô hình dự báo giúp robot vận hành bền bỉ.
