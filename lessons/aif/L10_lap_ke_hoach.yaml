      <p class="note"><b>So sánh hai quy mô:</b> Xếp 3 khối trên bàn chỉ có 13 trạng thái (&lt; 1 mi-li-giây cho tìm theo chiều rộng <b>BFS</b>), còn kho vận 100 kiện hàng ($\approx 10^{150}$ trạng thái) vượt quá mọi bộ nhớ — phải gắn hàm đánh giá nới lỏng hoặc tách kế hoạch.</p>

      '
    say: Điều cần mang theo, làm xong từng việc nhỏ chưa chắc là làm xong việc lớn, vì thứ tự và tương tác giữa các việc quyết định chi phí. Luôn chú ý sự giao thoa phụ thuộc giữa các tác vụ thành phần vì tối ưu cục bộ từng mảnh rời rạc thường làm tăng gấp đôi tổng chi phí.
