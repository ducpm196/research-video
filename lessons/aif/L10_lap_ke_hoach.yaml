    say: Tổng kết lại, lập kế hoạch mô tả trạng thái bằng tập sự kiện và hành động bằng tiền điều kiện, hiệu ứng thêm và xoá. Tìm kiếm theo chiều rộng hoặc có chỉ dẫn trên không gian trạng thái giúp tìm ra kế hoạch ngắn nhất tới mục tiêu. Vì các mục tiêu con thường xung đột chéo và làm hỏng điều kiện của nhau, ta bắt buộc giải đồng thời trên toàn tổ hợp trạng thái. Biểu diễn trạng thái bằng tập sự kiện kết hợp kiểm tra toàn cục tránh hoàn toàn nghịch lý Xắt-men khi các mục tiêu con xung đột thứ tự. Giải đồng thời toàn tổ hợp mục tiêu con giữ kế hoạch robot không tự phá vỡ thành quả các bước trước đó.
