    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>a, b = ...</code></td><td>Giải nén nhiều giá trị cùng lúc vào các tên biến tương ứng theo thứ tự</td></tr><tr><td><code>_</code></td><td>Biến bỏ qua (dùng khi đếm số vòng lặp hoặc giải nén phần tử không cần tới)</td></tr><tr><td><code>(bt for x in ds)</code></td><td>Biểu thức sinh tuần tự từng phần tử <code>x</code> (thường truyền vào <code>sum(...)</code>)</td></tr><tr><td><code>&lt; / &lt;= / &gt; / &gt;=</code></td><td>So sánh hai vế, kiểm tra rỗng bằng <code>is None</code> hoặc kẹp khoảng trả về Đúng/Sai</td></tr><tr><td><code>**</code></td><td><code>**</code> là lũy thừa; <code>//</code> là chia lấy nguyên; <code>%</code> là chia lấy phần dư</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>range(...), sum(...)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.4f}, {:.2f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: '<p><b>Lời giải tham khảo AIF:L03 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>lo, hi = 1.0, 5.0</div><div>for _ in range(50):</div><div>    mid = (lo + hi) / 2.0</div><div>    val = sum(mid**k for k in range(5))</div><div>    if val &lt; 101.0: lo = mid</div><div>    else: hi = mid</div><div>print(f"b_star={mid:.4f} sum_val={sum(mid**k for k in range(5)):.2f}")</div></div>'
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  checks:
  - sum(2 ** k for k in range(27)) == 134217727 and round(sum(1.5 ** k for k in range(27))) == 113628
  steps:
  - show: |
      <div class="chain"><span class="n">bỏ bớt luật → bài nới lỏng</span><span class="a">→</span>
      <span class="n">chi phí bài nới lỏng là hàm chấp nhận được</span><span class="a">→</span>
      <span class="n">trội ở mọi trạng thái, gộp bằng max</span><span class="a">→</span>
      <span class="n">đo bằng hệ số nhánh hiệu dụng</span></div>
    say: Tổng kết lại, bỏ bớt ràng buộc chuyển bước cho ta một bài toán nới lỏng dễ giải hơn. Vì mọi lời giải gốc đều hợp lệ trong bài nới lỏng, chi phí tối ưu của nó tự động là hàm đánh giá chấp nhận được. Khi so hai hàm đánh giá, quan hệ trội bắt buộc phải đúng trên mọi trạng thái chứ không chỉ đúng theo trung bình. Nếu không hàm nào trội hẳn hàm kia, lấy giá trị lớn nhất từng điểm vẫn giữ tính chấp nhận được và trội hơn cả hai. Cuối cùng hãy dùng phương trình đa thức tính hệ số nhánh hiệu dụng để đo sức cắt tỉa bằng con số rõ ràng. Một chi tiết nhỏ nhưng rất quan trọng là quy tắc nới lỏng không bao giờ tự sinh ra lời giải mới làm tăng chi phí đường đi tối ưu. Nhờ đặc tính bảo toàn mọi lời giải cũ đó, hàm ước lượng rút ra luôn đứng về phía an toàn. Khi bước sang bài tập tự giải phương trình tìm hệ số nhánh hiệu dụng hôm nay, bạn sẽ tự đo được mức giảm đáng kể khi chuyển sang hàm đánh giá tốt hơn. Đây là kỹ năng cốt lõi khi thiết kế hệ tìm đường ngoài thực tế. Việc kiểm nghiệm trên tập trạng thái mẫu giúp bạn tự tin rằng thuật toán tìm kiếm luôn chạy nhanh mà không đánh mất đáp số ngắn nhất. Khi hiểu rõ cách nới lỏng từng ràng buộc và cách chọn giá trị lớn nhất của nhiều hàm hợp lệ, bạn luôn có phương pháp bài bản để nâng cấp bộ tìm kiếm.
  - show: |
      <div class="box key"><b>Tư duy:</b> ước lượng tốt thường đến từ việc giải <b>chính xác</b> một bài toán <b>dễ hơn</b>.</div>
      <p class="note"><b>Hai mức quy mô:</b> Ở cây 52 nút độ sâu 5, b* ≈ 1,92; ở độ sâu 26 của cây đều (bằng 1 + b + ... + b^26), hạ b* từ 2 xuống 1,5 rút cây từ hơn 134 triệu xuống khoảng 114 nghìn nút — đổi lại tốn thêm vài mi-cro-giây tính h mỗi bước.</p>
    say: Điều cần mang theo, ước lượng tốt thường đến từ việc giải chính xác một bài toán dễ hơn. Ở cây nhỏ năm mươi hai nút độ sâu 5, hệ số phân nhánh hiệu dụng khoảng 1 phẩy 92. Ở độ sâu 26, giảm hệ số từ 2 xuống 1 phẩy 5 rút cây đều từ hơn 134 triệu xuống khoảng 114 nghìn nút.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 4): <b>tìm kiếm cục bộ</b> — leo đồi, khởi động lại ngẫu nhiên, mô phỏng tôi luyện.</p>
    forward_ref: true
    say: Ở bài sau, bài 4, ta học tìm kiếm cục bộ, với leo đồi, khởi động lại ngẫu nhiên, và mô phỏng tôi luyện. Hẹn gặp bạn ở bài tiếp theo.
af2: true
