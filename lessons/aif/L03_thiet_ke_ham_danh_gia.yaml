# Quy ước: hệ số nhánh hiệu dụng b* là nghiệm của N + 1 = 1 + b* + b*² + … + b*^d (alg.eff_branching, chia đôi), N = số nút A* mở.
#   alg.puz_all_stats() duyệt hết 181 440 trạng thái của trò xếp 8 ô số. h₁, h₂ như bài 2.
objectives:
  - "Tạo hàm đánh giá bằng cách nới lỏng luật"
  - "Hiểu trội và lấy lớn nhất của nhiều hàm"
  - "Đo chất lượng hàm đánh giá bằng hệ số nhánh hiệu dụng"
