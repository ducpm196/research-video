scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai ước lượng ở đâu ra?"
    steps:
      - show: |
          <p>Bài trước dùng hai hàm đánh giá cho trò xếp 8 ô số: số ô sai chỗ và tổng khoảng cách Manhattan. Cả hai đều không bao giờ vượt chi phí thật. Đó là may mắn, hay có một <b>cách làm</b> để luôn tạo ra hàm như vậy?</p>
          <div class="box key">Hôm nay: <b>nới lỏng bài toán</b> để có hàm đánh giá chấp nhận được, so sánh hai hàm bằng <b>trội</b>, và đo chúng bằng <b>hệ số nhánh hiệu dụng</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bài trước dùng hai hàm đánh giá cho trò xếp 8 ô số, số ô sai chỗ và tổng khoảng cách Manhattan. Cả hai đều không bao giờ vượt chi phí thật. Đó là may mắn, hay có một cách làm để luôn tạo ra hàm như vậy? Hôm nay ta nới lỏng bài toán để có hàm đánh giá chấp nhận được, so sánh hai hàm bằng độ trội, và đo chúng bằng hệ số nhánh hiệu dụng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: hai hàm của bài 2 và tổng cấp số nhân"
    checks:
      - "alg.puz_h1((7, 2, 4, 5, 0, 6, 8, 3, 1)) == 8 and alg.puz_h2((7, 2, 4, 5, 0, 6, 8, 3, 1)) == 18"
      - "sum(2 ** k for k in range(4)) == 15 == 2 ** 4 - 1"
    steps:
      - show: |
          <p><b>Ở bài 2</b>, với trạng thái 7 2 4 / 5 _ 6 / 8 3 1: số ô sai chỗ $h_1 = 8$, tổng khoảng cách Manhattan $h_2 = 18$, chi phí thật 26; A* với $h_2$ mở 1 481 nút.</p>
        say: "Ở bài 2, với trạng thái đầu quen thuộc, số ô sai chỗ h 1 bằng 8, tổng khoảng cách Manhattan h 2 bằng 18, và chi phí thật là 26. Thuật toán A sao dùng h 2 chỉ mở 1 nghìn 481 nút."
      - show: |
          <p><b>Đếm nút của cây đều:</b> mỗi nút có 2 con, sâu 3 tầng → $1 + 2 + 4 + 8 = 15$ nút (gốc, rồi mỗi tầng gấp đôi).</p>
        say: "Ta cũng cần đếm nút của một cây đều. Nếu mỗi nút có 2 con và cây sâu 3 tầng, thì có 1 gốc, rồi mỗi tầng gấp đôi, tổng cộng 1 cộng 2 cộng 4 cộng 8, bằng 15 nút."

  - id: sym
    kind: symbol
    title: "Giải mã: nới lỏng, trội, hệ số nhánh hiệu dụng"
    steps:
      - show: |
          <p>Luật thật: <i>một ô đi được sang ô kề nếu ô đó trống</i>. Bỏ bớt điều kiện thì được <b>bài toán nới lỏng</b> — dễ hơn, nên chi phí tối ưu của nó <b>không lớn hơn</b> của bài thật:</p>
          <table class="t"><tr><th>bỏ điều kiện</th><th>bài nới lỏng</th><th>chi phí tối ưu của nó</th></tr>
          <tr><td>“kề” và “trống”</td><td>mỗi ô bay thẳng về chỗ</td><td>$h_1$: số ô sai chỗ</td></tr>
          <tr><td>chỉ “trống”</td><td>ô đi sang ô kề, chồng lên ô khác được</td><td>$h_2$: tổng khoảng cách Manhattan</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Luật thật là một ô đi được sang ô kề nếu ô đó trống. Bỏ bớt điều kiện thì được một bài toán nới lỏng, dễ hơn, nên chi phí tối ưu của nó không lớn hơn của bài thật. Bảng cho hai cách nới lỏng. Bỏ cả điều kiện kề lẫn trống, mỗi ô bay thẳng về chỗ, và chi phí tối ưu chính là số ô sai chỗ, h 1. Chỉ bỏ điều kiện trống, ô đi sang ô kề và được chồng lên ô khác, chi phí tối ưu chính là tổng khoảng cách Manhattan, h 2."
      - show: |
          <p><b>Trội</b>: $h_2$ trội $h_1$ nếu $h_2(n) \geq h_1(n)$ ở <b>mọi</b> $n$. Khi cả hai chấp nhận được, A* dùng hàm trội không bao giờ mở nhiều nút hơn. Có nhiều hàm chấp nhận được thì $\max(h_a, h_b)$ vẫn chấp nhận được và trội cả hai.</p>
          <p><b>Hệ số nhánh hiệu dụng</b> $b^*$: nếu A* mở $N$ nút để tìm lời giải độ sâu $d$, thì $b^*$ là số nhánh của một cây đều sâu $d$ có đúng $N + 1$ nút: $N + 1 = 1 + b^* + (b^*)^2 + \dots + (b^*)^d$. Càng gần 1 càng tốt.</p>
        introduces: [max_fn, dots]
        focus: [1, 1, 1, 2, 2, 2]
        say: "Hàm h 2 trội hàm h 1 nếu h 2 lớn hơn hoặc bằng h 1 ở mọi trạng thái. Khi cả hai chấp nhận được, A sao dùng hàm trội không bao giờ mở nhiều nút hơn. Có nhiều hàm chấp nhận được thì lấy số lớn nhất của chúng vẫn chấp nhận được, và trội tất cả. Hệ số nhánh hiệu dụng b sao được định nghĩa như sau. Nếu A sao mở N nút để tìm lời giải độ sâu d, thì b sao là số nhánh của một cây đều sâu d có đúng N cộng 1 nút. Con số này càng gần 1 thì hàm đánh giá càng tốt."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bỏ bớt luật thì bài dễ hơn, chi phí nhỏ hơn"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340">
          <rect x="30" y="20" width="1440" height="300" rx="16" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>
          <rect x="250" y="70" width="1000" height="200" rx="14" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>
          <rect x="520" y="120" width="460" height="100" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>
          <g font-size="25" text-anchor="middle" fill="#1f2937">
          <text x="750" y="163" font-weight="bold">bài thật: kề VÀ trống</text><text x="750" y="200">chi phí 26</text>
          <text x="750" y="104">bỏ “trống”: chi phí 18</text>
          <text x="750" y="54">bỏ cả “kề”: chi phí 8</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình lồng ba bài toán vào nhau. Bài thật ở giữa, với cả hai luật kề và trống, cần 26 bước. Bỏ luật trống thì được nhiều cách đi hơn, nên chỉ cần 18 bước, và bỏ thêm luật kề thì chỉ cần 8 bước."
      - show: |
          <div class="chain"><span class="n">bỏ bớt luật</span><span class="a">→</span><span class="n">mọi lời giải cũ vẫn hợp lệ, thêm lời giải mới</span><span class="a">→</span><span class="n">chi phí tối ưu không tăng</span><span class="a">→</span><span class="n">không vượt chi phí thật</span></div>
        say: "Lý do nằm ở chuỗi này. Bỏ bớt luật thì mọi lời giải của bài thật vẫn hợp lệ, lại có thêm lời giải mới, nên chi phí tối ưu không thể tăng. Vì vậy chi phí của bài nới lỏng không bao giờ vượt chi phí thật, tức là chấp nhận được."

  - id: example
    kind: example
    title: "Kiểm trên toàn bộ 181 440 trạng thái"
    checks:
      - "(lambda r: r[0] and r[1] == 31 and [round(x, 2) for x in r[2:]] == [7.11, 14.0, 21.97])(alg.puz_all_stats())"
      - "round(alg.eff_branching(52, 5), 2) == 1.92 and [round(alg.eff_branching(n, 26), 2) for n in (173799, 31776, 1481)] == [1.53, 1.42, 1.24]"
    steps:
      - show: |
          <p><b>Bước 1 — kiểm khắp nơi.</b> Duyệt hết 181 440 trạng thái: ở <b>mọi</b> trạng thái $h_1 \leq h_2 \leq h^*$ — đúng như lập luận nới lỏng.</p>
          <table class="t"><tr><th>trung bình</th><th>$h_1$</th><th>$h_2$</th><th>$h^*$</th></tr><tr><td>trên 181 440 trạng thái</td><td>7,11</td><td>14,0</td><td>21,97</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước một, kiểm khắp nơi. Duyệt hết 181 nghìn 440 trạng thái, ở mọi trạng thái h 1 không vượt h 2, và h 2 không vượt chi phí thật, đúng như lập luận nới lỏng. Trung bình h 1 bằng 7 phẩy 11, h 2 bằng 14, chi phí thật bằng 21 phẩy 97, và trạng thái xa nhất cách đích 31 bước."
      - clear: true
        show: |
          <p><b>Bước 2 — tìm $b^*$ cho ví dụ kinh điển:</b> 52 nút, độ sâu 5 → cần $1 + b + b^2 + b^3 + b^4 + b^5 = 53$. Thử dần:</p>
          <table class="t"><tr><th>thử $b$</th><th>tổng 6 số hạng</th><th>so với 53</th></tr>
          <tr><td>2</td><td>63</td><td>lớn quá → giảm</td></tr>
          <tr><td>1,9</td><td>51,16</td><td>nhỏ quá → tăng</td></tr>
          <tr><td>1,92</td><td>53,37</td><td>sát 53 → $b^* \approx \hl{1{,}92}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước hai, tìm b sao cho ví dụ kinh điển, 52 nút ở độ sâu 5, nên tổng 1 cộng b cộng b bình phương, tới b mũ 5 phải bằng 53. Thử b bằng 2 được 63, lớn quá nên giảm. Thử 1 phẩy 9 được 51 phẩy 16, nhỏ quá nên tăng. Thử 1 phẩy 92 được 53 phẩy 37, sát 53, nên b sao xấp xỉ 1 phẩy 92."
      - clear: true
        show: |
          <p><b>Bước 3 — đo ba cách tìm</b> trên lời giải 26 bước của bài 2:</p>
          <table class="t"><tr><th>cách tìm</th><th>nút mở $N$</th><th>$b^*$</th></tr>
          <tr><td>không ước lượng (chi phí đều)</td><td>173 799</td><td>1,53</td></tr>
          <tr><td>$h_1$</td><td>31 776</td><td>1,42</td></tr>
          <tr><td>$h_2$</td><td>1 481</td><td>$\hl{1{,}24}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, đo ba cách tìm trên lời giải 26 bước của bài 2. Không có ước lượng, tìm chi phí đều mở 173 nghìn 799 nút, b sao bằng 1 phẩy 53. Với h 1, 31 nghìn 776 nút, b sao bằng 1 phẩy 42. Với h 2, chỉ 1 nghìn 481 nút, b sao bằng 1 phẩy 24, gần 1 nhất nên tốt nhất."
      - show: |
          <p class="note">Vì sao $b^*$ hữu ích: nó gần như không đổi theo độ sâu, nên đo trên vài bài nhỏ là dự đoán được bài lớn.</p>
        say: "Hệ số này hữu ích vì nó gần như không đổi theo độ sâu, nên đo trên vài bài nhỏ là dự đoán được độ khó của bài lớn."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "abs(sum(alg.eff_branching(52, 5) ** k for k in range(6)) - 53) < 1e-6"
      - "all(h1 <= h2 for h1, h2 in [(alg.puz_h1(s), alg.puz_h2(s)) for s in [(7, 2, 4, 5, 0, 6, 8, 3, 1), (1, 6, 2, 3, 0, 5, 7, 4, 8)]])"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>$b^* = 1{,}9167$</td><td>thay ngược vào tổng</td><td>$1 + 1{,}9167 + \dots \approx 53$ ✓</td></tr>
          <tr><td>$h_1 \leq h_2$</td><td>mỗi ô sai chỗ cần ≥ 1 bước Manhattan</td><td>8 ≤ 18 và 4 ≤ 6 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Thay ngược b sao bằng 1 phẩy 9167 vào tổng sáu số hạng, ta được đúng 53. Và vì mỗi ô sai chỗ cần ít nhất một bước Manhattan, nên h 1 luôn không vượt h 2, ở cả hai trạng thái đã gặp, 8 so với 18 và 4 so với 6."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), lambda s: max(alg.puz_h1(s), alg.puz_h2(s))) == (26, 1481)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Trung bình lớn hơn” là trội <b class="red">(chưa đủ)</b>
          <br><span class="note">Trội phải đúng ở <b>mọi</b> trạng thái. Hàm lớn hơn ở đa số trạng thái nhưng nhỏ hơn ở vài chỗ vẫn có thể làm A* mở nhiều nút hơn trên một bài cụ thể.</span></div>
        say: "Lỗi thứ nhất, cho rằng trung bình lớn hơn là trội, như vậy chưa đủ. Trội phải đúng ở mọi trạng thái. Một hàm lớn hơn ở đa số trạng thái nhưng nhỏ hơn ở vài chỗ vẫn có thể làm A sao mở nhiều nút hơn trên một bài cụ thể."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cộng hai hàm chấp nhận được <b class="red">(có thể vượt)</b>
          <br><span class="note">$h_1 + h_2$ có thể vượt chi phí thật. Muốn gộp an toàn thì lấy <b>lớn nhất</b>: $\max(h_1, h_2)$ vẫn chấp nhận được (ở đây cho đúng 1 481 nút như $h_2$, vì $h_2$ đã trội $h_1$).</span></div>
        say: "Lỗi thứ hai, cộng hai hàm chấp nhận được, nên tổng có thể vượt chi phí thật. Muốn gộp an toàn thì lấy số lớn nhất của hai hàm, vẫn chấp nhận được. Ở đây nó cho đúng 1 nghìn 481 nút như h 2, vì h 2 đã trội h 1."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Hàm đánh giá tốn quá nhiều thời gian tính <b class="red">(lợi bất cập hại)</b>
          <br><span class="note">Mở ít nút hơn chỉ có lợi nếu thời gian tính $h$ ở mỗi nút không ăn hết phần tiết kiệm. Đo tổng thời gian chạy, không chỉ đếm nút.</span></div>
        say: "Lỗi thứ ba, hàm đánh giá tốn quá nhiều thời gian tính, lợi bất cập hại. Mở ít nút hơn chỉ có lợi nếu thời gian tính h ở mỗi nút không ăn hết phần tiết kiệm, nên hãy đo tổng thời gian chạy, không chỉ đếm nút."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.eff_branching(52, 5), 2) == 1.92 and 1 + 2 + 4 + 8 + 16 + 32 == 63"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nếu $b^* = 2$ và $d = 5$, A* đã mở bao nhiêu nút?</td></tr>
          <tr><td>2</td><td>Robot đi trên lưới 4 hướng, có tường. Nới lỏng luật nào để có hàm đánh giá Manhattan? Nới lỏng thêm nữa thì được hàm nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nếu b sao bằng 2 và độ sâu bằng 5, A sao đã mở bao nhiêu nút? Câu hai, robot đi trên lưới 4 hướng có tường. Nới lỏng luật nào để có hàm đánh giá Manhattan, và nới lỏng thêm nữa thì được hàm nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Cây đều 2 nhánh, sâu 5: $1 + 2 + 4 + 8 + 16 + 32 = 63 = N + 1$ → $N = \hl{62}$ nút.</p>
        say: "Đáp án câu một, cây đều 2 nhánh sâu 5 có 1 cộng 2 cộng 4 cộng 8 cộng 16 cộng 32, bằng 63 nút. Số này bằng N cộng 1, nên A sao đã mở 62 nút."
      - show: |
          <table class="t"><tr><th>bỏ luật</th><th>hàm đánh giá</th><th>so sánh</th></tr>
          <tr><td>“không xuyên tường”</td><td>khoảng cách Manhattan</td><td>trội</td></tr>
          <tr><td>thêm “chỉ 4 hướng” (bay thẳng)</td><td>đường chim bay</td><td>nhỏ hơn, vẫn chấp nhận được</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai có hai mức nới lỏng. Bỏ luật không đi xuyên tường thì được khoảng cách Manhattan. Bỏ thêm luật chỉ đi 4 hướng, cho bay thẳng, thì được khoảng cách đường chim bay, nhỏ hơn và vẫn chấp nhận được, nhưng bị Manhattan trội."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ bớt luật → bài nới lỏng</span><span class="a">→</span>
          <span class="n">chi phí bài nới lỏng là hàm chấp nhận được</span><span class="a">→</span>
          <span class="n">trội ở mọi trạng thái, gộp bằng max</span><span class="a">→</span>
          <span class="n">đo bằng hệ số nhánh hiệu dụng</span></div>
        say: "Tổng kết lại, bỏ bớt luật được bài nới lỏng, và chi phí tối ưu của bài nới lỏng là một hàm đánh giá chấp nhận được. So hai hàm bằng trội ở mọi trạng thái, gộp bằng số lớn nhất, và đo bằng hệ số nhánh hiệu dụng."
      - show: |
          <div class="box key"><b>Tư duy:</b> ước lượng tốt thường đến từ việc giải <b>chính xác</b> một bài toán <b>dễ hơn</b>.</div>
        say: "Điều cần mang theo, ước lượng tốt thường đến từ việc giải chính xác một bài toán dễ hơn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>tìm kiếm cục bộ</b> — leo đồi, khởi động lại ngẫu nhiên, mô phỏng tôi luyện.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học tìm kiếm cục bộ, với leo đồi, khởi động lại ngẫu nhiên, và mô phỏng tôi luyện. Hẹn gặp bạn ở bài tiếp theo."
