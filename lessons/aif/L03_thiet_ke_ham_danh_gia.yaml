- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - 'alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), lambda s: max(alg.puz_h1(s), alg.puz_h2(s))) == (26, 1481)'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> “Trung bình lớn hơn” là trội <b class="red">(chưa đủ)</b>

      <br><span class="note">Trội phải đúng ở <b>mọi</b> trạng thái. Hàm lớn hơn ở đa số trạng thái nhưng nhỏ hơn ở vài chỗ vẫn có thể làm A* mở nhiều nút hơn trên một bài cụ thể.</span></div>

      '
    say: Lỗi thứ nhất, cho rằng trung bình lớn hơn là trội, như vậy chưa đủ. Trội phải đúng ở mọi trạng thái. Một hàm lớn hơn ở đa số trạng thái nhưng nhỏ hơn ở vài chỗ vẫn có thể làm A sao mở nhiều nút hơn trên một bài cụ thể. Một hàm lớn hơn ở phần lớn trạng thái nhưng nhỏ hơn ở một vài vùng chưa gọi là trội mà phải lớn hơn hoặc bằng trên toàn bộ không gian.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Cộng hai hàm chấp nhận được <b class="red">(có thể vượt)</b>

      <br><span class="note">$h_1 + h_2$ có thể vượt chi phí thật. Muốn gộp an toàn thì lấy <b>lớn nhất</b>: $\max(h_1, h_2)$ vẫn chấp nhận được (ở đây cho đúng 1 481 nút như $h_2$, vì $h_2$ đã trội $h_1$).</span></div>

      '
    say: Lỗi thứ hai, cộng hai hàm chấp nhận được, nên tổng có thể vượt chi phí thật. Muốn gộp an toàn thì lấy số lớn nhất của hai hàm, vẫn chấp nhận được. Ở đây nó cho đúng 1 nghìn 481 nút như h 2, vì h 2 đã trội h 1. Tuyệt đối không cộng hai hàm ước lượng chồng phần việc vào nhau vì có thể vượt chi phí thật; lấy giá trị lớn nhất luôn bảo toàn tính chấp nhận.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Hàm đánh giá tốn quá nhiều thời gian tính <b class="red">(lợi bất cập hại)</b>

      <br><span class="note">Mở ít nút hơn chỉ có lợi nếu thời gian tính $h$ ở mỗi nút không ăn hết phần tiết kiệm. Đo tổng thời gian chạy, không chỉ đếm nút.</span></div>

      '
    say: Lỗi thứ ba, hàm đánh giá tốn quá nhiều thời gian tính, lợi bất cập hại. Mở ít nút hơn chỉ có lợi nếu thời gian tính h ở mỗi nút không ăn hết phần tiết kiệm, nên hãy đo tổng thời gian chạy, không chỉ đếm nút. Một hàm tính mất hàng trăm mi-li-giây mỗi nút có thể làm tổng thời gian chạy chậm hơn hẳn hàm đơn giản nhưng mở nhiều nút hơn chút ít.
