scenes:
- id: hook
  kind: hook
  title: Hai ước lượng ở đâu ra?
  steps:
  - show: '<p>Bài trước dùng hai hàm đánh giá cho trò xếp 8 ô số: số ô sai chỗ và tổng khoảng cách Manhattan. Cả hai đều không bao giờ vượt chi phí thật. Đó là may mắn, hay có một <b>cách làm</b> để luôn tạo ra hàm như vậy?</p>

      <div class="box key">Hôm nay: <b>nới lỏng bài toán</b> để có hàm đánh giá chấp nhận được, so sánh hai hàm bằng <b>trội</b>, và đo chúng bằng <b>hệ số nhánh hiệu dụng</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, bài trước dùng hai hàm đánh giá cho trò xếp 8 ô số, số ô sai chỗ và tổng khoảng cách Manhattan. Cả hai đều không bao giờ vượt chi phí thật. Đó là may mắn, hay có một cách làm để luôn tạo ra hàm như vậy? Hôm nay ta nới lỏng bài toán để có hàm đánh giá chấp nhận được, so sánh hai hàm bằng độ trội, và đo chúng bằng hệ số nhánh hiệu dụng. Cũng giống như nới lỏng bản đồ đường bộ thành đường chim bay, hàm ước lượng từ bài toán dễ hơn luôn là cận dưới an toàn. Thước đo hệ số nhánh hiệu dụng giúp ta kiểm chứng mức cắt giảm không gian tìm kiếm bằng con số cụ thể. Làm sao thiết kế một hàm đánh giá bảo đảm vừa lạc quan tuyệt đối vừa khít gần nhất với chi phí thật mà không phải giải cả bài toán gốc?
- id: prereq
  kind: prereq
  title: 'Ôn lại: hai hàm của bài 2 và tổng cấp số nhân'
  checks:
  - alg.puz_h1((7, 2, 4, 5, 0, 6, 8, 3, 1)) == 8 and alg.puz_h2((7, 2, 4, 5, 0, 6, 8, 3, 1)) == 18
  - sum(2 ** k for k in range(4)) == 15 == 2 ** 4 - 1
  steps:
  - show: '<p><b>Ở bài 2</b>, với trạng thái 7 2 4 / 5 _ 6 / 8 3 1: số ô sai chỗ $h_1 = 8$, tổng khoảng cách Manhattan $h_2 = 18$, chi phí thật 26; A* với $h_2$ mở 1 481 nút.</p>

      '
    say: Ở bài 2, với trạng thái đầu quen thuộc, số ô sai chỗ h 1 bằng 8, tổng khoảng cách Manhattan h 2 bằng 18, và chi phí thật là 26. Thuật toán A sao dùng h 2 chỉ mở 1 nghìn 481 nút.
  - show: '<p><b>Đếm nút của cây đều:</b> mỗi nút có 2 con, sâu 3 tầng → $1 + 2 + 4 + 8 = 15$ nút (gốc, rồi mỗi tầng gấp đôi).</p>

      '
    say: Ta cũng cần đếm nút của một cây đều. Nếu mỗi nút có 2 con và cây sâu 3 tầng, thì có 1 gốc, rồi mỗi tầng gấp đôi, tổng cộng 1 cộng 2 cộng 4 cộng 8, bằng 15 nút.
- id: sym
  kind: symbol
  title: 'Giải mã: nới lỏng, trội, hệ số nhánh hiệu dụng'
  steps:
  - show: '<p>Luật thật: <i>một ô đi được sang ô kề nếu ô đó trống</i>. Bỏ bớt điều kiện thì được <b>bài toán nới lỏng</b> — dễ hơn, nên chi phí tối ưu của nó <b>không lớn hơn</b> của bài thật:</p>

      <table class="t"><tr><th>bỏ điều kiện</th><th>bài nới lỏng</th><th>chi phí tối ưu của nó</th></tr>

      <tr><td>“kề” và “trống”</td><td>mỗi ô bay thẳng về chỗ</td><td>$h_1$: số ô sai chỗ</td></tr>

      <tr><td>chỉ “trống”</td><td>ô đi sang ô kề, chồng lên ô khác được</td><td>$h_2$: tổng khoảng cách Manhattan</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Luật thật là một ô đi được sang ô kề nếu ô đó trống. Bỏ bớt điều kiện thì được một bài toán nới lỏng, dễ hơn, nên chi phí tối ưu của nó không lớn hơn của bài thật. Bảng cho hai cách nới lỏng. Bỏ cả điều kiện kề lẫn trống, mỗi ô bay thẳng về chỗ, và chi phí tối ưu chính là số ô sai chỗ, h 1. Chỉ bỏ điều kiện trống, ô đi sang ô kề và được chồng lên ô khác, chi phí tối ưu chính là tổng khoảng cách Manhattan, h 2. Loại bỏ một hoặc nhiều ràng buộc trong mô hình chuyển biến bài toán khó thành bài toán nới lỏng dễ giải chính xác chỉ bằng một công thức ngắn.
  - show: '<p><b>Trội</b>: $h_2$ trội $h_1$ nếu $h_2(n) \geq h_1(n)$ ở <b>mọi</b> $n$. Khi cả hai chấp nhận được, A* dùng hàm trội không mở nhiều nút hơn (trừ chênh lệch nhỏ do cách phá hoà, như ở bài 2). Có nhiều hàm chấp nhận được thì $\max(h_a, h_b)$ vẫn chấp nhận được và trội cả hai.</p>

      <p><b>Hệ số nhánh hiệu dụng</b> $b^*$: nếu A* mở $N$ nút để tìm lời giải độ sâu $d$, thì $b^*$ là số nhánh của một cây đều sâu $d$ có đúng $N + 1$ nút: $N + 1 = 1 + b^* + (b^*)^2 + \dots + (b^*)^d$. Con số này tiến sát về 1 cho thấy hiệu quả rất cao.</p>

      '
    introduces:
    - max_fn
    - dots
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Hàm h 2 trội hàm h 1 nếu h 2 lớn hơn hoặc bằng h 1 ở mọi trạng thái. Khi cả hai chấp nhận được, A sao dùng hàm trội không mở nhiều nút hơn, trừ chênh lệch nhỏ do cách phá hòa như ở bài 2. Có nhiều hàm chấp nhận được thì lấy số lớn nhất của chúng vẫn chấp nhận được, và trội tất cả. Hệ số nhánh hiệu dụng b sao được định nghĩa như sau. Nếu A sao mở N nút để tìm lời giải độ sâu d, thì b sao là số nhánh của một cây đều sâu d có đúng N cộng 1 nút. Con số này tiến sát về 1 cho thấy hàm đánh giá đạt hiệu quả rất cao. Tính trội từng điểm trên toàn không gian trạng thái bảo đảm mọi nút mở bởi hàm mạnh hơn đều nằm gọn trong tập nút mở của hàm yếu.
- id: intuition
  kind: intuition
  title: Bỏ bớt luật thì bài dễ hơn, chi phí nhỏ hơn
  steps:
  - show: '<div><svg width="1500" height="340" viewBox="0 0 1500 340">

      <rect x="30" y="20" width="1440" height="300" rx="16" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>

      <rect x="250" y="70" width="1000" height="200" rx="14" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>

      <rect x="520" y="120" width="460" height="100" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>

      <g font-size="25" text-anchor="middle" fill="#1f2937">

      <text x="750" y="163" font-weight="bold">bài thật: kề VÀ trống</text><text x="750" y="200">chi phí 26</text>

      <text x="750" y="104">bỏ “trống”: chi phí 18</text>

      <text x="750" y="54">bỏ cả “kề”: chi phí 8</text></g>

      </svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    say: Hình lồng ba bài toán vào nhau. Bài thật ở giữa, với cả hai luật kề và trống, cần 26 bước. Bỏ luật trống thì được nhiều cách đi hơn, nên chỉ cần 18 bước, và bỏ thêm luật kề thì chỉ cần 8 bước.
  - show: '<div class="chain"><span class="n">bỏ bớt luật</span><span class="a">→</span><span class="n">mọi lời giải cũ vẫn hợp lệ, thêm lời giải mới</span><span class="a">→</span><span class="n">chi phí tối ưu không tăng</span><span class="a">→</span><span class="n">không vượt chi phí thật</span></div>

      '
    say: Lý do nằm ở chuỗi này. Bỏ bớt luật thì mọi lời giải của bài thật vẫn hợp lệ, lại có thêm lời giải mới, nên chi phí tối ưu không thể tăng. Vì vậy chi phí của bài nới lỏng không bao giờ vượt chi phí thật, tức là chấp nhận được. Mỗi ràng buộc bị nới lỏng chỉ mở thêm nước đi hợp lệ mới chứ không tước đi lời giải hợp lệ cũ nên chi phí tối ưu bài toán nới lỏng không bao giờ vượt bài thật.
- id: example
  kind: example
  title: Kiểm trên toàn bộ 181 440 trạng thái
  checks:
  - '(lambda r: r[0] and r[1] == 31 and [round(x, 2) for x in r[2:]] == [7.11, 14.0, 21.97])(alg.puz_all_stats())'
  - round(alg.eff_branching(52, 5), 2) == 1.92 and [round(alg.eff_branching(n, 26), 2) for n in (173799, 31776, 1481)] == [1.53, 1.42, 1.24]
  steps:
  - show: '<p><b>Bước 1 — kiểm khắp nơi.</b> Duyệt hết 181 440 trạng thái: ở <b>mọi</b> trạng thái $h_1 \leq h_2 \leq h^*$ — đúng như lập luận nới lỏng.</p>

      <table class="t"><tr><th>trung bình</th><th>$h_1$</th><th>$h_2$</th><th>$h^*$</th></tr><tr><td>trên 181 440 trạng thái</td><td>7,11</td><td>14,0</td><td>21,97</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    say: Bước một, kiểm khắp nơi. Duyệt hết 181 nghìn 440 trạng thái, ở mọi trạng thái h 1 không vượt h 2, và h 2 không vượt chi phí thật, đúng như lập luận nới lỏng. Trung bình h 1 bằng 7 phẩy 11, h 2 bằng 14, chi phí thật bằng 21 phẩy 97, và trạng thái xa nhất cách đích 31 bước.
  - clear: true
    show: '<p><b>Bước 2 — tìm $b^*$ cho ví dụ kinh điển:</b> 52 nút, độ sâu 5 → cần $1 + b + b^2 + b^3 + b^4 + b^5 = 53$. Thử dần:</p>

      <table class="t"><tr><th>thử $b$</th><th>tổng 6 số hạng</th><th>so với 53</th></tr>

      <tr><td>2</td><td>63</td><td>lớn quá → giảm</td></tr>

      <tr><td>1,9</td><td>51,16</td><td>nhỏ quá → tăng</td></tr>

      <tr><td>1,92</td><td>53,37</td><td>sát 53 → $b^* \approx \hl{1{,}92}$</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    say: Bước hai, tìm b sao cho ví dụ kinh điển, 52 nút ở độ sâu 5, nên tổng 1 cộng b cộng b bình phương, tới b mũ 5 phải bằng 53. Thử b bằng 2 được 63, lớn quá nên giảm. Thử 1 phẩy 9 được 51 phẩy 16, nhỏ quá nên tăng. Thử 1 phẩy 92 được 53 phẩy 37, sát 53, nên b sao xấp xỉ 1 phẩy 92.
  - clear: true
    show: '<p><b>Bước 3 — đo ba cách tìm</b> trên lời giải 26 bước của bài 2:</p>

