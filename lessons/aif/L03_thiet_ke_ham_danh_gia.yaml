    - '2.4'
    - '2.4'
    say: Bước ba, đo ba cách tìm trên lời giải 26 bước của bài 2. Không có ước lượng, tìm chi phí đều mở 173 nghìn 799 nút, b sao bằng 1 phẩy 53. Với h 1, 31 nghìn 776 nút, b sao bằng 1 phẩy 42. Với h 2, chỉ 1 nghìn 481 nút, b sao bằng 1 phẩy 24, gần 1 nhất nên tốt nhất. Thước đo hệ số phân nhánh hiệu dụng cho phép quy đổi số nút mở khổng lồ thành một chỉ số phẳng độc lập độ sâu để so sánh các hàm đánh giá.
  - show: '<p class="note">Vì sao $b^*$ hữu ích: nó gần như không đổi theo độ sâu, nên đo trên vài bài nhỏ là dự đoán được bài lớn.</p>

      '
    say: Hệ số này hữu ích vì nó gần như không đổi theo độ sâu, nên đo trên vài bài nhỏ là dự đoán được độ khó của bài lớn. Hệ số phân nhánh hiệu dụng đo lường trực tiếp khả năng cắt tỉa của hàm đánh giá trên cây tìm kiếm thực tế. Kéo được hệ số phân nhánh hiệu dụng từ mức ba hay bốn xuống sát một phẩy hai biến bài toán bất khả thi thành chạy trong vài mi-li-giây.
  - show: '<p><b>Bước 4 — tìm hệ số nhánh hiệu dụng bằng chia đôi trong Python</b>:</p><div class="code"><div>N, d, lo, hi = 52, 5, 1.0, 5.0</div><div>for _ in range(40):</div><div>    mid = (lo + hi) / 2.0</div><div>    if sum(mid ** k for k in range(d + 1)) &lt; N + 1: lo = mid</div><div>    else: hi = mid</div><div>print(f&#x27;b_star={mid:.2f}&#x27;)</div></div>'
