  - show: <table class='t'><tr><th>Thực hành AIF:L03</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/AIF/L03/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Giải hệ số nhánh hiệu dụng b* với N=100 nút ở độ sâu d=4</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>b_star=... sum_val=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh AIF L03 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
