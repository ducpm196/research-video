source: "curriculum/aif.yaml L14; audit/aif/sources_L14.md (câu trích nguyên văn, đọc 2026-11-02); audit/aif/verify_aif.py L14; M. Campbell, A. J. Hoane Jr., F.-h. Hsu, Deep Blue, Artificial Intelligence 134 (2002) 57–83 [DB02]; D. Silver và cộng sự, Mastering the game of Go with deep neural networks and tree search, Nature 529 (2016) [AG16]; D. Silver và cộng sự, Mastering the game of Go without human knowledge, Nature (2017), bản tác giả ở kho UCL [AGZ17]; D. Silver và cộng sự, Mastering Chess and Shogi by Self-Play with a General Reinforcement Learning Algorithm, arXiv:1712.01815 (2017) [AZ17]; D. Silver và cộng sự, A general reinforcement learning algorithm that masters chess, shogi, and Go through self-play, Science (2018), bản truy cập mở và blog DeepMind 6/12/2018 [AZ18]; AIF bài 3 (hàm đánh giá), bài 6 (cực đại–cực tiểu, alpha–beta), bài 7 (cây mô phỏng ngẫu nhiên), bài 13 (35 mũ 80); CS115 L19 (quá khớp), L34 (mạng tích chập), L39 (học tăng cường)"
assumes: [arith, power, approx, log]
# Quy ước: “thế cờ” = vị trí quân trên bàn (position); “hàm đánh giá” = ước lượng điểm của thế cờ chưa kết thúc (bài 3, bài 6);
#   “mạng chính sách” = mạng nơ-ron gợi ý nước nên xét; “mạng giá trị” = mạng nơ-ron đoán bên nào thắng từ một thế cờ;
#   “tự chơi” = chương trình đánh với chính nó để tạo dữ liệu (self-play); “hiệu suất song song” = tốc độ đo được chia tốc độ lý thuyết.
#   Mọi sự kiện và con số có nguồn ghi trong audit/aif/sources_L14.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   trò chơi có 30 nước mỗi lượt, máy 1 triệu thế mỗi giây, 10 giây mỗi nước, 10 giây mỗi ván tự chơi đều là SỐ MINH HOẠ.
#   839 ván hoà (2018) là phép tính 1000 − 155 − 6, nguồn không ghi trực tiếp.
#   Lời đọc không nói tên người, không nói “TPU”, “GPU”, “Stockfish”, “Elmo”, “Monte Carlo” (lexicon_vi.AIF.yaml): nói “bộ tăng tốc”,
#   “chương trình cờ vua vô địch giải máy năm 2016”, “cây mô phỏng ngẫu nhiên”. Tên hệ thống (Deep Blue, AlphaGo, AlphaZero, DeepMind)
#   KHÔNG đọc — probe p3 đều < 7/8 (lexicon_vi.AIF.yaml); lời đọc nói “máy chơi cờ của IBM” (IBM thô 8/8), “một chương trình mới”.
objectives:
  - "Kể lại hành trình máy chơi cờ qua năm chặng từ 1988 tới 2018, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại tốc độ lý thuyết, hiệu suất song song, cỡ cây cờ vây, số mô phỏng mỗi giây và số ván hoà của trận 1000 ván"
  - "Chọn giữa tìm kiếm có hàm đánh giá viết tay và tự học bằng tự chơi cho trò chơi của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Dùng lôgarit cơ số 10, con số đó xấp xỉ 10 mũ 123 nút.", reason: "ASR chép “Dùng Logatricker số 10, còn số đó sắp xỉ 10 mũ 123 nút.” (0.8): lệch âm/thanh thuần Việt: lôgarit cơ/logatricker, con/còn, xấp/sắp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, dùng cực đại cực tiểu với hàm đánh giá viết tay thì nhìn trước được mấy lượt, có và không có alpha beta?", reason: "ASR chép “Câu 1, dùng cực đại cực tiểu với hàm đánh giá viết tay thì nhìn trước được mấy lượt, có và không có an pha beta.” (0.906): beta đọc “bê-ta”, ASR viết “bê/beta”; alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "126 triệu thế mỗi giây, rồi chỉ 60 nghìn"
    checks:
      - "126_000_000 // 60_000 == 2100"
    steps:
      - show: |
          <p>Năm 1997, Deep Blue của IBM thắng nhà vô địch cờ vua thế giới. Trong trận đấu, nó xét trung bình <b>126 triệu thế cờ mỗi giây</b>.</p>
          <p>Năm 2018, AlphaZero thắng chương trình vô địch giải máy cờ vua năm 2016 mà chỉ xét <b>60 nghìn thế cờ mỗi giây</b> — ít hơn khoảng 2100 lần.</p>
          <div class="box key">Hôm nay: năm chặng từ 1988 tới 2018 — mỗi chặng, điểm nghẽn là gì, đội làm máy xử lý thế nào, và thực hành nào đúng trong điều kiện nào.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, năm 1997, máy chơi cờ của IBM thắng nhà vô địch cờ vua thế giới. Trong trận đấu đó, nó xét trung bình 126 triệu thế cờ mỗi giây. Năm 2018, một chương trình mới thắng chương trình vô địch giải máy cờ vua năm 2016, mà chỉ xét 60 nghìn thế cờ mỗi giây. Như vậy là ít hơn khoảng 2100 lần, vậy sức mạnh nằm ở đâu? Hôm nay ta đi qua năm chặng từ 1988 tới 2018, xem mỗi chặng vướng ở đâu, được xử lý thế nào, và đúng trong điều kiện nào."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "35 ** 2 + 35 ** 2 - 1 == 2449 and 35 ** 4 == 1500625"
      - "int(80 * math.log10(35)) == 123"
      - "round(7 / 10, 1) == 0.7"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 3</td><td><b>hàm đánh giá</b>: ước lượng nhanh một trạng thái, thay cho việc đi tới tận cùng</td><td>trò 8 ô số: tổng khoảng cách 18, chi phí thật 26</td></tr>
          <tr><td>bài 6</td><td><b>alpha–beta</b>: bỏ nhánh chắc chắn không được chọn; thứ tự tốt thì số lá còn khoảng $b^{d/2}$</td><td>35 nước, sâu 4: 2449 lá thay vì 1&nbsp;500&nbsp;625</td></tr>
          <tr><td>bài 7</td><td><b>cây mô phỏng ngẫu nhiên</b>: chọn, mở rộng, chơi thử tới hết ván, cộng kết quả ngược lên</td><td>nước A thắng 7 trên 10 lần chơi thử: tỉ lệ 0,7</td></tr>
          <tr><td>bài 13</td><td><b>cỡ cây cờ vua</b>: lôgarit cơ số 10 biến mũ thành nhân</td><td>$35^{80} \approx 10^{123}$ nút</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 3, hàm đánh giá ước lượng nhanh một trạng thái, như trò 8 ô số có tổng khoảng cách 18 trong khi chi phí thật là 26. Ở bài 6, cắt tỉa alpha beta bỏ nhánh chắc chắn không được chọn, với 35 nước và độ sâu 4 chỉ còn 2449 lá. Ở bài 7, cây mô phỏng ngẫu nhiên chơi thử tới hết ván, nước thắng 7 trên 10 lần có tỉ lệ 0 phẩy 7. Ở bài 13, cây cờ vua có cỡ 35 mũ 80. Dùng lôgarit cơ số 10, con số đó xấp xỉ 10 mũ 123 nút."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>thế cờ</b></td><td>vị trí mọi quân trên bàn ở một thời điểm</td></tr>
          <tr><td><b>hiệu suất song song</b></td><td>tốc độ đo được chia tốc độ lý thuyết của mọi bộ xử lý cộng lại</td></tr>
          <tr><td><b>mạng chính sách</b></td><td>mạng nơ-ron gợi ý nước nào đáng xét — thu hẹp <b>chiều rộng</b> cây</td></tr>
          <tr><td><b>mạng giá trị</b></td><td>mạng nơ-ron đoán bên nào thắng từ một thế cờ — rút ngắn <b>chiều sâu</b> cây</td></tr>
          <tr><td><b>tự chơi</b></td><td>chương trình đánh với chính nó để tạo dữ liệu học</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Thế cờ là vị trí mọi quân trên bàn ở một thời điểm. Hiệu suất song song là tốc độ đo được chia cho tốc độ lý thuyết của mọi bộ xử lý cộng lại. Mạng chính sách là mạng nơ-ron gợi ý nước nào đáng xét, nên thu hẹp chiều rộng của cây. Mạng giá trị là mạng nơ-ron đoán bên nào thắng từ một thế cờ, nên rút ngắn chiều sâu của cây. Tự chơi là chương trình đánh với chính nó để tạo dữ liệu học."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">1988 → 1996</text><text x="160" y="200">chip cờ riêng</text><text x="160" y="232">tăng tốc, vẫn thua</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">1997</text><text x="500" y="200">480 chip, 8000 đặc trưng</text><text x="500" y="232">sửa hàm đánh giá</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2015 → 2016</text><text x="850" y="200">cờ vây: hai mạng nơ-ron</text><text x="850" y="232">học từ ván của người</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2017</text><text x="1200" y="200">chỉ tự chơi</text><text x="1200" y="232">ít máy hơn 12 lần</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2017 → 2018</text><text x="1540" y="200">một thuật toán, ba trò</text><text x="1540" y="232">trận 1000 ván</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Từ 1988 tới 1996, máy có chip cờ riêng, nhanh dần lên mà vẫn thua. Năm 1997, máy có 480 chip và hàm đánh giá hơn 8000 đặc trưng, sửa từ chính các ván thua. Từ 2015 tới 2016, cờ vây được giải bằng hai mạng nơ-ron học từ ván của người, rồi năm 2017 máy chỉ tự chơi mà dùng ít máy hơn 12 lần. Cuối cùng, năm 2018, một thuật toán chơi cả ba trò và được kiểm bằng trận 1000 ván."

