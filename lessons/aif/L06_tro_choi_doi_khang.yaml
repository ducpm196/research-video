  - {sentence: "alpha là giá trị tốt nhất mà bên cực đại chắc chắn có được trên đường từ gốc tới nút đang xét.", reason: "ASR chép “An pha là giá trị tốt nhất mà bên cực đại chắc chắn có được trên đường từ gốc tới nút đăng xét.” (0.889): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: đang/đăng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đối thủ cũng chơi giỏi"
    checks:
      - "alg.minimax([[3, 12, 8], [2, 4, 6], [14, 5, 2]]) == 3 and max(max(b) for b in [[3, 12, 8], [2, 4, 6], [14, 5, 2]]) == 14"
    steps:
      - show: |
          <p>Bạn có ba nước đi; mỗi nước, đối thủ có ba cách đáp. Nước thứ ba có thể cho bạn tới <b>14</b> điểm — nhưng đối thủ sẽ chọn cách đáp cho bạn chỉ <b>2</b>. Nước nào thật sự tốt nhất khi đối thủ cũng chơi giỏi?</p>
          <div class="box key">Hôm nay: <b>cực đại–cực tiểu</b> (minimax) cho trò chơi hai người, và <b>cắt tỉa alpha–beta</b> để khỏi xét những nhánh chắc chắn không được chọn.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bạn có ba nước đi, mỗi nước thì đối thủ có ba cách đáp. Nước thứ ba có thể cho bạn tới 14 điểm, nhưng đối thủ sẽ chọn cách đáp cho bạn chỉ 2 điểm. Nước nào thật sự tốt nhất khi đối thủ cũng chơi giỏi? Hôm nay ta học thuật toán cực đại cực tiểu cho trò chơi hai người, và cắt tỉa alpha beta để khỏi xét những nhánh chắc chắn không được chọn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: lớn nhất, nhỏ nhất, và cây"
    checks:
      - "max([3, 12, 8]) == 12 and min([3, 12, 8]) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>với 3, 12, 8</th></tr>
          <tr><td>lớn nhất</td><td>12</td></tr>
          <tr><td>nhỏ nhất</td><td>3</td></tr></table>
          <p>Một <b>cây</b> có gốc ở trên; mỗi nút có các nút con; nút không có con gọi là <b>lá</b>.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bài này chỉ cần hai phép tính quen thuộc. Với ba số 3, 12 và 8, số lớn nhất là 12. Số nhỏ nhất là 3. Ta cũng cần hình ảnh cái cây, gốc ở trên, mỗi nút có các nút con, và nút không có con gọi là lá."

  - id: sym
    kind: symbol
    title: "Giải mã: MAX, MIN, giá trị và alpha–beta"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>MAX</b>, <b>MIN</b></td><td>hai người chơi; điểm ở lá là điểm của MAX, MAX muốn lớn, MIN muốn nhỏ</td></tr>
          <tr><td><b>giá trị cực đại–cực tiểu</b></td><td>lá: điểm của lá; nút MAX: lớn nhất của các con; nút MIN: nhỏ nhất của các con</td></tr>
          <tr><td>$\alpha$</td><td>giá trị tốt nhất MAX <b>chắc chắn</b> có được trên đường từ gốc tới nút đang xét</td></tr>
          <tr><td>$\beta$</td><td>giá trị nhỏ nhất MIN <b>chắc chắn</b> ép được trên đường đó</td></tr></table>
          <p><b>Cắt tỉa</b>: khi $\alpha \geq \beta$, nhánh đang xét không thể ảnh hưởng tới kết quả — bỏ qua phần còn lại của nó.</p>
        introduces: [ab_alpha, ab_beta, geq]
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng giới thiệu các khái niệm. Bên cực đại và bên cực tiểu là hai người chơi, điểm ở lá là điểm của bên cực đại, bên cực đại muốn lớn còn bên cực tiểu muốn nhỏ. Giá trị cực đại cực tiểu tính từ dưới lên, lá lấy điểm của lá, nút bên cực đại lấy lớn nhất của các con, nút bên cực tiểu lấy nhỏ nhất. alpha là giá trị tốt nhất mà bên cực đại chắc chắn có được trên đường từ gốc tới nút đang xét. beta là giá trị nhỏ nhất mà bên cực tiểu chắc chắn ép được trên đường đó. Khi alpha lớn hơn hoặc bằng beta, nhánh đang xét không thể ảnh hưởng tới kết quả, nên bỏ qua phần còn lại của nó."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cây trò chơi hai tầng"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380">
          <g stroke="#6b7280" stroke-width="3">
          <line x1="750" y1="70" x2="300" y2="170"/><line x1="750" y1="70" x2="750" y2="170"/><line x1="750" y1="70" x2="1200" y2="170"/>
          <line x1="300" y1="200" x2="170" y2="300"/><line x1="300" y1="200" x2="300" y2="300"/><line x1="300" y1="200" x2="430" y2="300"/>
          <line x1="750" y1="200" x2="620" y2="300"/><line x1="750" y1="200" x2="750" y2="300" stroke-dasharray="8 6"/><line x1="750" y1="200" x2="880" y2="300" stroke-dasharray="8 6"/>
          <line x1="1200" y1="200" x2="1070" y2="300"/><line x1="1200" y1="200" x2="1200" y2="300"/><line x1="1200" y1="200" x2="1330" y2="300"/></g>
          <polygon points="750,20 715,80 785,80" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>
          <polygon points="265,170 335,170 300,225" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>
          <polygon points="715,170 785,170 750,225" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>
          <polygon points="1165,170 1235,170 1200,225" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>
          <g font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">
          <text x="170" y="335">3</text><text x="300" y="335">12</text><text x="430" y="335">8</text>
          <text x="620" y="335">2</text><text x="750" y="335" fill="#9ca3af">4</text><text x="880" y="335" fill="#9ca3af">6</text>
          <text x="1070" y="335">14</text><text x="1200" y="335">5</text><text x="1330" y="335">2</text></g>
          <g font-size="24" fill="#1f2937" text-anchor="start">
          <text x="800" y="58">MAX (bạn)</text><text x="1250" y="200">MIN (đối thủ)</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình là cây trò chơi hai tầng. Tam giác xanh hướng lên ở gốc là lượt của bạn, bên cực đại, ba tam giác cam hướng xuống là lượt của đối thủ, bên cực tiểu. Chín con số ở đáy là điểm của bạn sau mỗi cặp nước đi, và hai lá màu xám nối nét đứt là hai lá ta sẽ không cần xét."

  - id: example
    kind: example
    title: "Cây ba nhánh: giá trị 3, bỏ 2 lá"
    checks:
      - "alg.minimax_ab([[3, 12, 8], [2, 4, 6], [14, 5, 2]]) == (3, [3, 12, 8, 2, 14, 5, 2])"
      - "[min(b) for b in [[3, 12, 8], [2, 4, 6], [14, 5, 2]]] == [3, 2, 2]"
    steps:
      - show: |
          <table class="t"><tr><th>nước của MAX</th><th>ba cách đáp của MIN (lá)</th><th>giá trị nút MIN</th></tr>
          <tr><td>B</td><td>3, 12, 8</td><td>nhỏ nhất = 3</td></tr></table>
          <p>Xong B: MAX chắc chắn có ít nhất 3 → $\alpha = 3$.</p>
        focus: [1, "1.2", 2]
        say: "Tính từ dưới lên, từng nhánh một. Ở nhánh B, đối thủ chọn nhỏ nhất của 3, 12 và 8, tức 3. Vì vậy bên cực đại chắc chắn có ít nhất 3 điểm, nên alpha bằng 3."
      - show: |
          <table class="t"><tr><th>nước của MAX</th><th>ba cách đáp của MIN (lá)</th><th>giá trị nút MIN</th></tr>
          <tr><td>C</td><td>2, <span class="red">4, 6</span> (bỏ qua)</td><td>≤ 2</td></tr></table>
          <p>Lá đầu của C là 2: MIN ép được ≤ 2 $\lt \alpha = 3$ → C không bao giờ được chọn, <b>bỏ</b> lá 4 và 6.</p>
        introduces: [ltgt]
        focus: [1, 2, 2]
        say: "Ở nhánh C, lá đầu tiên là 2, nên đối thủ ép được không quá 2. Mà 2 nhỏ hơn alpha bằng 3, nên bên cực đại không bao giờ chọn C. Vì thế ta bỏ qua lá 4 và lá 6, không cần xem chúng là bao nhiêu."
      - show: |
          <table class="t"><tr><th>nước của MAX</th><th>ba cách đáp của MIN (lá)</th><th>giá trị nút MIN</th></tr>
          <tr><td>D</td><td>14, 5, 2</td><td>nhỏ nhất = 2</td></tr></table>
        focus: [1, "1.2"]
        say: "Ở nhánh D, lá 14 và 5 chưa đủ để cắt, phải xét tới lá cuối. Đối thủ chọn nhỏ nhất của 14, 5 và 2, tức 2."
      - show: |
          <p>Gốc MAX = lớn nhất(3, ≤ 2, 2) = $\hl{3}$ → chọn <b>B</b>. Đã xét <b>7 trong 9 lá</b>.</p>
        say: "Cuối cùng, gốc bên cực đại lấy lớn nhất của 3, một số không quá 2, và 2, được 3, nên chọn nước B. Ta chỉ xét 7 trong 9 lá."

  - id: check
    kind: check
    title: "Tự kiểm: tính lại không cắt tỉa"
    checks:
      - "alg.minimax([[3, 12, 8], [2, 4, 6], [14, 5, 2]]) == alg.minimax_ab([[3, 12, 8], [2, 4, 6], [14, 5, 2]])[0] == 3"
      - "len(alg.minimax_ab([[3, 12, 8], [2, 4, 6], [14, 5, 2]])[1]) == 7 and sum(len(b) for b in [[3, 12, 8], [2, 4, 6], [14, 5, 2]]) == 9"
    steps:
      - show: |
          <table class="t"><tr><th>cách tính</th><th>số lá xét</th><th>giá trị gốc</th></tr>
          <tr><td>cực đại–cực tiểu, không cắt tỉa: min từng nhánh 3, 2, 2 rồi max</td><td>9</td><td>3</td></tr>
          <tr><td>có cắt tỉa alpha–beta</td><td>7</td><td>3 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta tính lại không cắt tỉa, vì kết quả hai cách phải giống nhau. Không cắt tỉa, ba nhánh có giá trị 3, 2 và 2, gốc bằng 3, phải xét đủ 9 lá. Có cắt tỉa cũng ra 3, nhưng chỉ xét 7 lá."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.minimax_ab([[3, 12, 8], [2, 4, 6], [2, 5, 14]]) == (3, [3, 12, 8, 2, 2])"
      - "35 ** 2 + 35 ** 2 - 1 == 2449 and 35 ** 4 == 1500625"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ qua thứ tự xét nước đi <b class="red">(cắt tỉa ít)</b>
          <br><span class="note">Đổi thứ tự lá ở D thành 2, 5, 14: gặp 2 ngay → bỏ luôn 5 và 14, chỉ xét <b>5 lá</b>. Thứ tự tốt nhất, cây độ sâu $d$ chẵn, nhánh $b$, chỉ cần $b^{d/2} + b^{d/2} - 1$ lá: với $b = 35$, $d = 4$ là $35^2 + 35^2 - 1 = 2449$ lá thay vì $35^4 = 1\,500\,625$.</span></div>
        say: "Lỗi thứ nhất, bỏ qua thứ tự xét nước đi nên cắt tỉa ít. Đổi thứ tự lá ở nhánh D thành 2, 5, 14, gặp 2 ngay thì bỏ luôn 5 và 14, chỉ xét 5 lá. Với thứ tự tốt nhất, cây có độ sâu d chẵn và b nhánh chỉ cần b mũ d chia 2, cộng b mũ d chia 2, trừ 1 lá. Với b bằng 35 và d bằng 4, đó là 35 bình phương cộng 35 bình phương trừ 1, bằng 2449 lá thay vì hơn 1 triệu 500 nghìn lá."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ cắt tỉa làm đổi kết quả <b class="red">(không)</b>
          <br><span class="note">Alpha–beta luôn cho <b>đúng</b> giá trị của cực đại–cực tiểu; nó chỉ bỏ những nhánh chắc chắn không được chọn. Kết quả khác nhau là có lỗi trong mã.</span></div>
        say: "Lỗi thứ hai, nghĩ cắt tỉa làm đổi kết quả, điều này không đúng. Cắt tỉa alpha beta luôn cho đúng giá trị của cực đại cực tiểu, nó chỉ bỏ những nhánh chắc chắn không được chọn. Nếu kết quả khác nhau thì có lỗi trong mã."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Giả định đối thủ chơi tệ <b class="red">(lạc quan nguy hiểm)</b>
          <br><span class="note">Chọn D vì “có thể được 14” là đặt cược vào sai lầm của đối thủ. Cực đại–cực tiểu bảo đảm điểm tốt nhất khi đối thủ chơi tối ưu.</span></div>
        say: "Lỗi thứ ba, giả định đối thủ chơi tệ, một sự lạc quan nguy hiểm. Chọn nước D vì có thể được 14 là đặt cược vào sai lầm của đối thủ. Cực đại cực tiểu bảo đảm điểm tốt nhất khi đối thủ chơi tối ưu."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.minimax_ab([[5, 3], [6, 7], [1, 9]]) == (6, [5, 3, 6, 7, 1]) and alg.minimax_ab([[6, 7], [5, 3], [1, 9]]) == (6, [6, 7, 5, 1])"
    steps:
      - show: |
          <p>Cây: MAX có ba nước, lá lần lượt (5, 3), (6, 7), (1, 9).</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Giá trị ở gốc là bao nhiêu? MAX chọn nước nào?</td></tr>
          <tr><td>2</td><td>Alpha–beta xét theo thứ tự từ trái sang bỏ được lá nào? Nếu xếp nước (6, 7) lên đầu thì bỏ được mấy lá?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Cây trên màn hình có ba nước của bên cực đại, lá lần lượt là 5 và 3, 6 và 7, 1 và 9. Câu một, giá trị ở gốc là bao nhiêu, và bên cực đại chọn nước nào? Câu hai, xét từ trái sang thì cắt tỉa bỏ được lá nào, và nếu xếp nước 6 và 7 lên đầu thì bỏ được mấy lá? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Ba nút MIN: nhỏ nhất(5, 3) = 3, nhỏ nhất(6, 7) = 6, nhỏ nhất(1, 9) = 1 → gốc = $\hl{6}$, chọn nước thứ hai.</p>
        say: "Đáp án câu một, ba nút bên cực tiểu có giá trị 3, 6 và 1, nên gốc bằng 6, và bên cực đại chọn nước thứ hai."
      - show: |
          <table class="t"><tr><th>thứ tự xét</th><th>lá bị bỏ</th><th>số lá xét</th></tr>
          <tr><td>(5, 3), (6, 7), (1, 9)</td><td>9 (vì 1 nhỏ hơn 6)</td><td>5</td></tr>
          <tr><td>(6, 7), (5, 3), (1, 9)</td><td>3 (vì 5 nhỏ hơn 6) và 9</td><td>$\hl{4}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, ta so sánh hai thứ tự xét các nước đi. Xét từ trái sang, xong nước thứ hai thì alpha bằng 6, nước thứ ba gặp lá 1 nhỏ hơn 6 nên bỏ lá 9, xét 5 lá. Xếp nước 6 và 7 lên đầu thì alpha bằng 6 ngay, nước tiếp theo gặp 5 nhỏ hơn 6 nên bỏ lá 3, nước cuối bỏ lá 9, chỉ xét 4 lá."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">MAX lấy lớn nhất, MIN lấy nhỏ nhất</span><span class="a">→</span>
          <span class="n">alpha, beta: điều đã chắc chắn</span><span class="a">→</span>
          <span class="n">alpha ≥ beta thì bỏ nhánh</span><span class="a">→</span>
          <span class="n">xét nước tốt trước để cắt nhiều</span></div>
        say: "Tổng kết lại, bên cực đại lấy lớn nhất, bên cực tiểu lấy nhỏ nhất. alpha và beta ghi lại điều đã chắc chắn, alpha lớn hơn hoặc bằng beta thì bỏ nhánh, và xét nước tốt trước để cắt được nhiều."
      - show: |
