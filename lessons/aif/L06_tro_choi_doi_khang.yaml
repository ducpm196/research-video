  - {sentence: "Vì vậy bên cực đại chắc chắn có ít nhất 3 điểm, nên alpha bằng 3.", reason: "ASR chép “Vì vậy bên cực đại chắc chắn có ít nhất 3 điểm nên an pha bằng 3.” (0.909): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Xếp nước 6 và 7 lên đầu thì alpha bằng 6 ngay, nước tiếp theo gặp 5 nhỏ hơn 6 nên bỏ lá 3, nước cuối bỏ lá 9, chỉ xét 4 lá.", reason: "ASR chép “Sếp nước 6 và 7 lên đầu thì an pha bằng 6 ngày, nước tiếp theo gặp 5 nhỏ hơn 6 nên bỏ lá 3, nước cuối bỏ lá 9, chỉ xét 4 lá.” (0.925): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: ngay/ngày — NOT_VERIFIED bằng tai người"}
  - {sentence: "Xét từ trái sang, xong nước thứ hai thì alpha bằng 6, nước thứ ba gặp lá 1 nhỏ hơn 6 nên bỏ lá 9, xét 5 lá.", reason: "ASR chép “Xét từ trái sang, xong nước thứ 2 thì an pha bằng 6, nước thứ 3 gặp lá 1 nhỏ hơn 6 nên bỏ lá 9, xét 5 lá.” (0.947): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "alpha và beta ghi lại điều đã chắc chắn, alpha lớn hơn hoặc bằng beta thì bỏ nhánh, và xét nước tốt trước để cắt được nhiều.", reason: "ASR chép “Anfa và Beta ghi lại điều đã chắc chắn, Anfa lớn hơn hoặc bằng Beta thì bỏ nhánh, và xét nước tốt trước để cắt được nhiều.” (0.862): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); beta đọc “bê-ta”, ASR viết “bê/beta” — NOT_VERIFIED bằng tai người"}
