id: L06
course: AIF
series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 6 — Trò chơi đối kháng: cực đại–cực tiểu và cắt tỉa alpha–beta"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L06; audit/aif/verify_aif.py L06; AIMA bản 4 (2020), mục 5.2–5.3 (cây hai tầng, lá 3 12 8 / 2 4 6 / 14 5 2); D. Knuth, R. Moore, An Analysis of Alpha-Beta Pruning, Artificial Intelligence 6 (1975) — cây tối thiểu có b^⌈d/2⌉ + b^⌊d/2⌋ − 1 lá"
assumes: [arith, power]
# Quy ước: cây trò chơi viết lồng danh sách: gốc là lượt MAX, tầng dưới là lượt MIN, lá là điểm của MAX. alg.minimax(cây) không cắt tỉa;
#   alg.minimax_ab(cây) trả (giá trị, danh sách lá đã xét theo thứ tự). Tên “minimax” chỉ trên màn hình (probe p1: không đọc được),
#   lời đọc nói “cực đại–cực tiểu”. alpha, beta đọc thô (probe p1: alpha 7/8; beta theo luật chung “bê-ta”).
objectives:
  - "Tính giá trị cực đại–cực tiểu của cây trò chơi"
  - "Chạy cắt tỉa alpha–beta và chỉ ra lá bị bỏ"
  - "Hiểu vì sao thứ tự xét nước đi quyết định lượng cắt tỉa"
