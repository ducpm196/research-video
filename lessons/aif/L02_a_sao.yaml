scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "173 799 nút hay 1 481 nút"
    checks:
      - "alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), lambda s: 0) == (26, 173799) and alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), alg.puz_h2) == (26, 1481)"
    steps:
      - show: |
          <p>Cùng trò xếp 8 ô số của bài trước, cùng lời giải 26 bước. Tìm chi phí đều phải mở <b>173 799</b> trạng thái. Thêm một ước lượng “còn cách đích bao xa”, A* chỉ mở <b>1 481</b> — ít hơn hơn 100 lần, và vẫn chắc chắn tìm đường ngắn nhất.</p>
          <div class="box key">Hôm nay: <b>A*</b> — cộng chi phí đã đi với ước lượng phần còn lại; và điều kiện để ước lượng không làm sai kết quả.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, cùng trò xếp 8 ô số của bài trước, cùng lời giải 26 bước. Tìm chi phí đều phải mở 173 nghìn 799 trạng thái. Thêm một ước lượng còn cách đích bao xa, thuật toán A sao chỉ mở 1 nghìn 481 trạng thái, ít hơn hơn 100 lần, và vẫn chắc chắn tìm đường ngắn nhất. Hôm nay ta học A sao, cộng chi phí đã đi với ước lượng phần còn lại, và điều kiện để ước lượng không làm sai kết quả."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: trò xếp 8 ô số, chi phí đều và khoảng cách Manhattan"
    checks:
      - "sum(abs(a - b) for a, b in zip((0, 0), (2, 1))) == 3"
      - "len(alg.puz_moves((7, 2, 4, 5, 0, 6, 8, 3, 1))) == 4 and len(alg.puz_moves((0, 1, 2, 3, 4, 5, 6, 7, 8))) == 2"
    steps:
      - show: |
          <p><b>Trò xếp 8 ô số</b>: khung 3 × 3 có 8 ô đánh số 1 tới 8 và một <b>chỗ trống</b>, viết là “_”. Mỗi bước trượt <b>một</b> ô nằm kề chỗ trống (trên, dưới, trái, phải) vào chỗ trống; mỗi bước tốn chi phí 1.</p>
          <table class="t"><tr><th>trạng thái đầu</th><th>đích</th></tr>
          <tr><td>7 2 4 / 5 _ 6 / 8 3 1</td><td>_ 1 2 / 3 4 5 / 6 7 8</td></tr></table>
          <p class="note">Viết theo hàng, từ trên xuống, dấu “/” ngăn hai hàng. Ở trạng thái đầu chỗ trống nằm giữa nên có 4 cách trượt; ở đích chỗ trống nằm ở góc nên chỉ có 2.</p>
        focus: [1, 1, 1, 3, 3]
        say: "Trước hết, nhắc lại trò xếp 8 ô số của bài trước. Khung 3 nhân 3 có 8 ô đánh số từ 1 tới 8 và một chỗ trống, trên màn hình viết bằng dấu gạch dưới. Mỗi bước, ta trượt một ô nằm kề chỗ trống vào chỗ trống, và mỗi bước tốn chi phí 1. Trạng thái được viết theo hàng từ trên xuống, dấu gạch chéo ngăn hai hàng. Ở trạng thái đầu, chỗ trống nằm giữa nên có 4 cách trượt, còn ở đích chỗ trống nằm ở góc nên chỉ có 2 cách."
      - show: |
          <p><b>Ở bài 1</b>, tìm chi phí đều luôn lấy ra trạng thái có <b>chi phí đã đi nhỏ nhất</b>, và kiểm đích khi lấy ra; trên đồ thị S, A, B, G nó tìm đường rẻ nhất S → B → G, chi phí 7.</p>
        say: "Ở bài 1, tìm chi phí đều luôn lấy ra trạng thái có chi phí đã đi nhỏ nhất, và kiểm đích khi lấy ra. Trên đồ thị bốn đỉnh của bài đó, nó tìm được đường rẻ nhất qua B với chi phí 7."
      - show: |
          <p><b>Khoảng cách Manhattan</b> giữa ô (hàng 0, cột 0) và ô (hàng 2, cột 1): đi theo hàng và cột, không đi chéo.</p>
          <p>$\lvert 0 - 2 \rvert + \lvert 0 - 1 \rvert = 2 + 1 = 3$ bước.</p>
        introduces: [absval]
        focus: [1, 2]
        say: "Khoảng cách Manhattan giữa hai ô là số bước đi dọc theo hàng và theo cột, không được đi chéo. Từ ô hàng 0 cột 0 tới ô hàng 2 cột 1, ta lấy trị tuyệt đối của hiệu số hàng cộng hiệu số cột, được 2 cộng 1, bằng 3 bước."

  - id: sym
    kind: symbol
    title: "Giải mã: g, h, f và chấp nhận được"
    checks:
      - "all(abs(alg.puz_h1(s) - alg.puz_h1(t)) <= 1 and abs(alg.puz_h2(s) - alg.puz_h2(t)) == 1 for s in [(7, 2, 4, 5, 0, 6, 8, 3, 1), (1, 6, 2, 3, 0, 5, 7, 4, 8)] for t in alg.puz_moves(s))"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$g(n)$</td><td>chi phí <b>đã đi</b> từ trạng thái đầu tới nút $n$</td></tr>
          <tr><td>$h(n)$</td><td><b>ước lượng</b> chi phí còn lại từ $n$ tới đích (hàm đánh giá)</td></tr>
          <tr><td>$f(n) = g(n) + h(n)$</td><td>ước lượng tổng chi phí của đường đi qua $n$; A* luôn mở nút có $f$ nhỏ nhất</td></tr>
          <tr><td>$h^*(n)$</td><td>chi phí <b>thật</b> nhỏ nhất từ $n$ tới đích</td></tr></table>
          <p><b>Chấp nhận được</b>: $h(n) \leq h^*(n)$ với mọi $n$ — ước lượng <b>không bao giờ vượt</b> chi phí thật. Khi đó A* tìm được lời giải tối ưu.</p>
        introduces: [star, geq]
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng giới thiệu bốn ký hiệu. g của n là chi phí đã đi từ trạng thái đầu tới nút n. h của n là ước lượng chi phí còn lại từ n tới đích, gọi là hàm đánh giá. f của n bằng g cộng h, là ước lượng tổng chi phí của đường đi qua n, và A sao luôn mở nút có f nhỏ nhất. h sao của n là chi phí thật nhỏ nhất từ n tới đích. Hàm đánh giá chấp nhận được khi h của n nhỏ hơn hoặc bằng h sao của n với mọi n, tức ước lượng không bao giờ vượt chi phí thật. Khi đó A sao tìm được lời giải tối ưu."
      - clear: true
        show: |
          <p><b>Vì sao tối ưu?</b> Giả sử A* lấy ra một đích $G_2$ có chi phí $g(G_2) \gt C^*$ (đắt hơn tối ưu). Trên đường tối ưu luôn còn một nút $n$ chưa mở, với $f(n) = g(n) + h(n) \leq g(n) + h^*(n) = C^*$ — vì $h$ chấp nhận được. Vậy $f(n) \leq C^* \lt g(G_2) = f(G_2)$, nên A* phải mở $n$ trước $G_2$ — mâu thuẫn.</p>
          <p class="note">Lập luận này cần A* được mở lại một trạng thái khi tìm ra đường rẻ hơn tới nó. Nếu cài A* không mở lại (như bản chạy ở bài này), cần điều kiện mạnh hơn gọi là <b>nhất quán</b>: sau mỗi bước chi phí 1, $h$ giảm nhiều nhất 1. Với trò 8 ô số, mỗi bước dời một ô đi một ô nên $h_1$, $h_2$ đổi nhiều nhất 1 — cả hai nhất quán.</p>
        introduces: [ltgt]
        focus: [1, 1, 1, 1, 2, 2, 2]
        say: "Vì sao thuật toán A sao cho đường đi tối ưu? Giả sử nó lấy ra một đích G 2 có chi phí lớn hơn chi phí tối ưu C sao. Trên đường tối ưu luôn còn một nút n chưa mở, với f của n bằng g cộng h, nhỏ hơn hoặc bằng g cộng h sao, bằng C sao, vì h chấp nhận được. Vậy f của n nhỏ hơn hoặc bằng C sao, nhỏ hơn f của G 2, nên A sao phải mở n trước G 2, mâu thuẫn với giả sử. Lập luận này cần thuật toán được mở lại một trạng thái khi tìm ra đường rẻ hơn tới nó. Nếu cài đặt không mở lại, như bản chạy ở bài này, cần thêm điều kiện nhất quán, tức sau mỗi bước chi phí 1, h giảm nhiều nhất 1. Với trò 8 ô số, mỗi bước chỉ dời một ô đi một ô, nên h 1 và h 2 đổi nhiều nhất 1, và cả hai đều nhất quán."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vùng phải mở: lan đều mọi hướng, hay lan về phía đích"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360">
          <circle cx="430" cy="180" r="160" fill="#dbeafe" fill-opacity="0.55" stroke="#2a78d6" stroke-width="3"/>
          <ellipse cx="750" cy="180" rx="350" ry="70" fill="#ffedd5" fill-opacity="0.7" stroke="#eb6834" stroke-width="3"/>
          <circle cx="430" cy="180" r="16" fill="#1f2937"/><circle cx="1070" cy="180" r="16" fill="#059669"/>
          <g font-size="26" fill="#1f2937" text-anchor="middle">
          <text x="430" y="226" font-weight="bold">đầu</text><text x="1070" y="226" font-weight="bold">đích</text>
          <text x="300" y="62" fill="#2a78d6">chi phí đều: lan đều mọi hướng</text>
          <text x="1180" y="80" fill="#c2410c">A*: lan về phía đích</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình so vùng trạng thái mà hai thuật toán phải mở. Tìm chi phí đều chỉ biết chi phí đã đi, nên lan đều mọi hướng, kể cả hướng ngược với đích. Thuật toán A sao cộng thêm ước lượng phần còn lại, nên vùng phải mở kéo dài về phía đích và hẹp hơn nhiều."

  - id: example
    kind: example
    title: "Hai hàm đánh giá trên cùng một trạng thái"
    checks:
      - "(alg.puz_h1((7, 2, 4, 5, 0, 6, 8, 3, 1)), alg.puz_h2((7, 2, 4, 5, 0, 6, 8, 3, 1)), alg.puz_bfs((7, 2, 4, 5, 0, 6, 8, 3, 1))[0]) == (8, 18, 26)"
      - "alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), alg.puz_h1) == (26, 31776) and alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), alg.puz_h2) == (26, 1481)"
      - "alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), alg.puz_h1, tie='state') == (26, 31634) and alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), alg.puz_h2, tie='state') == (26, 1491)"
    steps:
      - show: |
          <p>Trạng thái 7 2 4 / 5 _ 6 / 8 3 1, đích _ 1 2 / 3 4 5 / 6 7 8.</p>
          <p><b>Bước 1 — $h_1$, số ô sai chỗ:</b> so từng ô với đích, cả 8 ô số đều sai chỗ → $h_1 = \hl{8}$.</p>
        focus: [1, 2]
        say: "Xét trạng thái đầu và trạng thái đích trên màn hình. Bước một, tính h 1 bằng cách so từng ô với đích, và cả 8 ô số đều sai chỗ, nên h 1 bằng 8."
      - clear: true
        show: |
          <p><b>Bước 2 — $h_2$, tổng khoảng cách Manhattan</b> của từng ô tới chỗ đúng:</p>
          <table class="t"><tr><th>ô</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>tổng</th></tr>
          <tr><td>số bước</td><td>3</td><td>1</td><td>2</td><td>2</td><td>2</td><td>3</td><td>3</td><td>2</td><td>$\hl{18}$</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước hai, tính h 2 bằng tổng khoảng cách Manhattan của từng ô tới chỗ đúng. Bảng ghi số bước cho từng ô, ô 1 cần 3, ô 2 cần 1, và cứ thế. Cộng lại được 18."
      - clear: true
        show: |
          <p><b>Bước 3 — chạy A* thật</b> với từng hàm:</p>
          <table class="t"><tr><th>hàm đánh giá</th><th>giá trị đầu</th><th>nút A* mở</th><th>lời giải</th></tr>
          <tr><td>$h_1$: số ô sai chỗ</td><td>8</td><td>31 776</td><td>26 bước</td></tr>
          <tr><td>$h_2$: tổng Manhattan</td><td>18</td><td>$\hl{1\,481}$</td><td>26 bước</td></tr>
          <tr><td>chi phí thật $h^*$</td><td>26</td><td>—</td><td>—</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, chạy A sao thật với từng hàm. Với h 1, thuật toán mở 31 nghìn 776 nút. Với h 2, nó chỉ mở 1 nghìn 481 nút. Cả hai đều tìm ra lời giải 26 bước, đúng bằng chi phí thật."
      - show: |
          <p>Cả hai đều $\leq 26$: chấp nhận được → cùng tối ưu. $h_2$ sát chi phí thật hơn → mở ít nút hơn hẳn.</p>
          <p class="note">Số nút mở còn phụ thuộc cách phá hoà khi nhiều nút cùng $f$: một cách phá hoà khác cho 31 634 và 1 491 — số khác chút, kết luận như nhau.</p>
        focus: [1, 1, 2]
        say: "Vì cả hai đều không vượt 26 nên chấp nhận được, và cùng cho lời giải tối ưu. Hàm h 2 sát chi phí thật hơn nên mở ít nút hơn hẳn. Số nút còn phụ thuộc cách phá hoà khi nhiều nút cùng f, một cách phá hoà khác cho 31 nghìn 634 và 1 nghìn 491, số khác chút nhưng kết luận như nhau."

