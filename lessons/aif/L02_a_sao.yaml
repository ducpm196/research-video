    checks:
      - "3 + 1 + 2 + 2 + 2 + 3 + 3 + 2 == 18 == alg.puz_h2((7, 2, 4, 5, 0, 6, 8, 3, 1))"
      - "alg.puz_h1((7, 2, 4, 5, 0, 6, 8, 3, 1)) <= alg.puz_h2((7, 2, 4, 5, 0, 6, 8, 3, 1)) <= alg.puz_bfs((7, 2, 4, 5, 0, 6, 8, 3, 1))[0]"
    steps:
      - show: |
          <table class="t"><tr><th>điều kiểm</th><th>vì sao phải đúng</th><th>kết quả</th></tr>
          <tr><td>$h_1 \leq h_2$</td><td>mỗi ô sai chỗ cần ít nhất 1 bước</td><td>8 ≤ 18 ✓</td></tr>
          <tr><td>$h_2 \leq h^*$</td><td>mỗi bước chỉ dời một ô đi một ô</td><td>18 ≤ 26 ✓</td></tr>
          <tr><td>cộng lại bảng Manhattan</td><td>tính lại bằng tay</td><td>3+1+2+2+2+3+3+2 = 18 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng ba điều phải đúng. Thứ nhất, h 1 không vượt h 2, vì mỗi ô sai chỗ cần ít nhất 1 bước, và 8 nhỏ hơn 18. Thứ hai, h 2 không vượt chi phí thật, vì mỗi bước chỉ dời một ô đi một ô, và 18 nhỏ hơn 26. Thứ ba, cộng lại bảng Manhattan bằng tay cũng được 18."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.puz_astar((7, 2, 4, 5, 0, 6, 8, 3, 1), lambda s: 2 * alg.puz_h2(s)) == (30, 633)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nhân hàm đánh giá lên “cho nhanh” <b class="red">(mất tối ưu)</b>
          <br><span class="note">Dùng $2 \cdot h_2$: A* mở 633 nút nhưng trả lời giải <b class="red">30 bước</b> thay vì 26 — vì $2 \cdot h_2$ có chỗ vượt chi phí thật. Nhanh hơn, nhưng không còn bảo đảm.</span></div>
        introduces: [cdot]
        say: "Lỗi thứ nhất, nhân hàm đánh giá lên cho nhanh, nên mất tính tối ưu. Dùng 2 nhân h 2, A sao chỉ mở 633 nút nhưng trả lời giải 30 bước thay vì 26, vì 2 nhân h 2 có chỗ vượt chi phí thật. Nhanh hơn, nhưng không còn bảo đảm ngắn nhất."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dừng khi vừa SINH ra đích <b class="red">(như chi phí đều)</b>
          <br><span class="note">A* cũng phải kiểm đích khi LẤY nút ra khỏi hàng đợi ưu tiên — lúc đó $f$ của đích là nhỏ nhất, mới chắc là tối ưu.</span></div>
        say: "Lỗi thứ hai, dừng khi vừa sinh ra đích, giống lỗi của tìm chi phí đều. A sao cũng phải kiểm đích khi lấy nút ra khỏi hàng đợi ưu tiên, lúc đó f của đích là nhỏ nhất, mới chắc là tối ưu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ A* hết vấn đề bộ nhớ <b class="red">(vẫn lưu mọi nút)</b>
          <br><span class="note">A* giữ mọi nút đã sinh trong bộ nhớ. Với bài lớn, hàm đánh giá tốt chỉ làm chậm sự bùng nổ, không xoá nó; khi đó dùng biến thể tiết kiệm bộ nhớ (đào sâu dần theo $f$).</span></div>
        say: "Lỗi thứ ba, nghĩ A sao hết vấn đề bộ nhớ, trong khi nó vẫn lưu mọi nút. A sao giữ mọi nút đã sinh trong bộ nhớ. Với bài lớn, hàm đánh giá tốt chỉ làm chậm sự bùng nổ chứ không xoá nó, và khi đó cần biến thể tiết kiệm bộ nhớ, đào sâu dần theo f."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(alg.puz_h1((1, 6, 2, 3, 0, 5, 7, 4, 8)), alg.puz_h2((1, 6, 2, 3, 0, 5, 7, 4, 8)), alg.puz_bfs((1, 6, 2, 3, 0, 5, 7, 4, 8))[0]) == (4, 6, 8)"
      - "[abs(i // 3 - x // 3) + abs(i % 3 - x % 3) for i, x in enumerate((1, 6, 2, 3, 0, 5, 7, 4, 8)) if x in (1, 6, 7, 4)] == [1, 3, 1, 1]"
    steps:
      - show: |
          <p>Trạng thái 1 6 2 / 3 _ 5 / 7 4 8 (đích như trên).</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $h_1$ và $h_2$.</td></tr>
          <tr><td>2</td><td>Biết chi phí thật là 8. Hai hàm có chấp nhận được ở trạng thái này không? Hàm $h_3 = h_2 + 3$ thì sao?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Xét trạng thái trên màn hình, đích như trên. Câu một, tính h 1 và h 2. Câu hai, biết chi phí thật là 8, hai hàm có chấp nhận được ở trạng thái này không? Hàm h 3 bằng h 2 cộng 3 thì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>ô sai chỗ</th><th>1</th><th>6</th><th>7</th><th>4</th><th>cộng</th></tr>
          <tr><td>đếm ($h_1$)</td><td>1</td><td>1</td><td>1</td><td>1</td><td>$\hl{4}$</td></tr>
          <tr><td>số bước ($h_2$)</td><td>1</td><td>3</td><td>1</td><td>1</td><td>$\hl{6}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Đáp án câu một, các ô sai chỗ là 1, 6, 7 và 4. Đếm chúng được h 1 bằng 4. Cộng số bước từng ô, 1, 3, 1 và 1, được h 2 bằng 6. Ô 6 xa nhất, phải xuống 2 hàng và sang trái 1 cột."
      - show: |
          <p>② $4 \leq 8$ và $6 \leq 8$: chấp nhận được ở đây. $h_3 = 6 + 3 = 9 \gt 8$: <b class="red">vượt</b> chi phí thật → không chấp nhận được.</p>
        say: "Câu hai, 4 và 6 đều không vượt chi phí thật là 8, nên chấp nhận được ở trạng thái này. Còn h 3 bằng 6 cộng 3, bằng 9, vượt 8, nên không chấp nhận được."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">f = g + h, mở f nhỏ nhất</span><span class="a">→</span>
          <span class="n">h không vượt chi phí thật</span><span class="a">→</span>
          <span class="n">A* tối ưu, kiểm đích khi lấy ra</span><span class="a">→</span>
          <span class="n">h sát hơn → mở ít nút hơn</span></div>
        say: "Tổng kết lại, A sao mở nút có f bằng g cộng h nhỏ nhất. Nếu h không bao giờ vượt chi phí thật thì A sao tối ưu, miễn là kiểm đích khi lấy ra, và h càng sát chi phí thật thì càng mở ít nút."
      - show: |
          <div class="box key"><b>Tư duy:</b> một ước lượng <b>lạc quan</b> không bao giờ khiến ta bỏ qua đường tốt — vì nó không bao giờ làm đường tốt trông tệ hơn thực tế.</div>
        say: "Điều cần mang theo, một ước lượng lạc quan không bao giờ khiến ta bỏ qua đường tốt, vì nó không bao giờ làm đường tốt trông tệ hơn thực tế."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>thiết kế hàm đánh giá</b> — nới lỏng bài toán, trội, hệ số nhánh hiệu dụng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học cách thiết kế hàm đánh giá, bằng cách nới lỏng bài toán, so sánh độ trội, và đo hệ số nhánh hiệu dụng. Hẹn gặp bạn ở bài tiếp theo."
