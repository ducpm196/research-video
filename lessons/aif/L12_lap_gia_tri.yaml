    clear: true
    focus: null
- id: check
  kind: check
  title: 'Tự kiểm: giá trị là điểm bất động'
  checks:
  - '(lambda U: round(-0.04 + 0.8 * U[(1, 2)] + 0.1 * U[(1, 1)] + 0.1 * U[(2, 1)], 3) == round(U[(1, 1)], 3) == 0.705)(alg.grid43())'
  steps:
  - show: '<p>Thay giá trị cuối vào phương trình Bellman ở ô (1,1), hành động “đi lên” (0,8 lên (1,2); 0,1 đâm tường trái, đứng yên; 0,1 sang (2,1)):</p>

      $$-0{,}04 + 0{,}8 \cdot 0{,}762 + 0{,}1 \cdot 0{,}705 + 0{,}1 \cdot 0{,}655 \approx 0{,}7056 \approx 0{,}705 \checkmark$$

      <p class="note"><b>So sánh hai quy mô:</b> Lưới 4 × 3 (12 ô) hội tụ sau ~30 vòng lặp (~1 mi-li-giây); bài toán robot hàng triệu trạng thái làm lặp giá trị toàn bảng $O(|S|^2|A|)$ (tỉ lệ bậc hai theo số trạng thái) quá chậm, phải thay bằng xấp xỉ hàm giá trị hoặc học tăng cường.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    - 3
    say: Kiểm bằng đường khác, ta thay giá trị cuối ngược vào phương trình ở ô đầu, với hành động đi lên. Trừ 0 phẩy 04, cộng 0 phẩy 8 nhân 0 phẩy 762, cộng 0 phẩy 1 nhân 0 phẩy 705, cộng 0 phẩy 1 nhân 0 phẩy 655. Kết quả khoảng 0 phẩy 7056, khớp 0 phẩy 705 sau khi làm tròn, vì giá trị cuối là điểm bất động của phương trình, tức áp dụng phương trình vào nó thì nó không đổi. Ở hai mức quy mô, lưới 12 ô hội tụ sau khoảng 30 vòng trong 1 mi li giây. Điều khiển người máy hàng triệu trạng thái làm lặp toàn bảng quá chậm, phải chuyển sang xấp xỉ hàm giá trị. Thay trực tiếp bộ giá trị cuối vào phương trình Beo-men tại ô gốc thu lại y hệt con số không phẩy bảy không năm chứng minh đã đạt điểm bất động.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - '[alg.grid43(r, policy_out=True, iters=2000)[1][(3, 1)] for r in (-0.04, -0.4, -2)] == [''W'', ''N'', ''E''] and alg.grid43(-2, policy_out=True, iters=2000)[1][(4, 1)] == ''N'''
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ chính sách tối ưu không phụ thuộc thưởng mỗi bước <b class="red">(đổi hẳn)</b>

      <br><span class="note">Ở ô (3,1): thưởng −0,04 → đi vòng sang trái; −0,4 → đi lên, liều đi sát ô −1; −2 → lao sang phải, và ở (4,1) đi thẳng vào ô −1 cho xong — sống lâu còn tệ hơn.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ chính sách tối ưu không phụ thuộc thưởng mỗi bước, trong khi nó đổi hẳn. Ở ô cột 3 hàng 1, thưởng trừ 0 phẩy 04 thì đi vòng sang trái, trừ 0 phẩy 4 thì đi lên, liều đi sát ô trừ 1. Thưởng trừ 2 thì lao sang phải, và ở ô cuối hàng còn đi thẳng vào ô trừ 1 cho xong, vì sống lâu còn tệ hơn. Thay đổi nhỏ trong mức phạt chi phí di chuyển mỗi bước đủ đảo ngược hoàn toàn bản đồ mũi tên tối ưu tại những ô nằm cạnh bẫy.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng lặp giá trị khi không biết mô hình <b class="red">(thiếu dữ liệu)</b>

      <br><span class="note">Lặp giá trị cần biết $P(s'' \mid s, a)$ và $R$. Không biết thì phải học từ trải nghiệm — <b>học Q</b>: đi thử nhiều lần, ước lượng dần giá trị của từng cặp (ô, hành động) từ thưởng nhận được, không cần biết $P$.</span></div>

      '
    say: Lỗi thứ hai, dùng lặp giá trị khi không biết mô hình, tức thiếu dữ liệu. Lặp giá trị cần biết xác suất chuyển và thưởng. Không biết thì phải học từ trải nghiệm, như phương pháp học Q. Phương pháp này đi thử nhiều lần, ước lượng dần giá trị của từng cặp ô và hành động từ thưởng nhận được, không cần biết xác suất chuyển. Lặp giá trị yêu cầu biết sẵn xác suất chuyển trạng thái và hàm thưởng; khi thiếu mô hình môi trường, tác tử phải chuyển sang học tăng cường từ trải nghiệm.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dừng lặp quá sớm <b class="red">(giá trị chưa đúng)</b>

      <br><span class="note">Sau 5 vòng, U(1,1) vẫn âm (−0,2) vì thưởng +1 chưa “lan” tới. Dừng khi thay đổi lớn nhất giữa hai vòng đủ nhỏ, không theo số vòng cố định. <b>Lặp chính sách</b> là cách khác: giữ cố định một chính sách, tính giá trị mọi ô theo nó; rồi ở mỗi ô đổi sang hành động tốt nhất theo giá trị vừa tính; lặp tới khi chính sách không đổi — thường ít vòng hơn, cho cùng kết quả 0,705.</span></div>

      '
    say: Lỗi thứ ba, dừng lặp quá sớm nên giá trị chưa đúng. Sau 5 vòng, giá trị ô đầu vẫn âm vì thưởng cộng 1 chưa lan tới. Hãy dừng khi thay đổi lớn nhất giữa hai vòng đủ nhỏ, không theo số vòng cố định. Lặp chính sách là một cách khác. Nó giữ cố định một chính sách và tính giá trị mọi ô theo chính sách đó.
  - show: '<div class="box warn"><b>Lỗi 3b.</b> Cắt lặp quá sớm trước khi phần thưởng lan tới mọi ô <b class="red">(chính sách sai hướng)</b>

      <br><span class="note">Dừng lặp theo chính sách ổn định (lặp chính sách) hoặc sai số tối đa nhỏ bảo đảm hội tụ đúng giá trị $0{,}705$ thay vì chính sách lệch.</span></div>

      '
    say: Rồi ở mỗi ô, nó đổi sang hành động tốt nhất theo giá trị vừa tính, và lặp tới khi chính sách không đổi. Cách này thường cần ít vòng hơn, và cho cùng kết quả 0 phẩy 705. Cắt vòng lặp quá sớm trước khi ảnh hưởng phần thưởng ở xa lan kịp tới mọi ô sẽ sinh ra chính sách lạc hướng hoàn toàn sai lệch.
    clear: true
