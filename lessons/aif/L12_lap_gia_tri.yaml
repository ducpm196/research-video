- id: check
  kind: check
  title: 'Tự kiểm: giá trị là điểm bất động'
  checks:
  - '(lambda U: round(-0.04 + 0.8 * U[(1, 2)] + 0.1 * U[(1, 1)] + 0.1 * U[(2, 1)], 3) == round(U[(1, 1)], 3) == 0.705)(alg.grid43())'
  steps:
  - show: |
      <p>Thay giá trị cuối vào phương trình Bellman ở ô (1,1), hành động “đi lên” (0,8 lên (1,2); 0,1 đâm tường trái, đứng yên; 0,1 sang (2,1)):</p>
      $$-0{,}04 + 0{,}8 \cdot 0{,}762 + 0{,}1 \cdot 0{,}705 + 0{,}1 \cdot 0{,}655 \approx 0{,}7056 \approx 0{,}705 \checkmark$$
      <p class="note"><b>Hai mức quy mô:</b> Lưới 4 × 3 (12 ô) hội tụ sau ~30 vòng lặp (~1 mi-li-giây); bài toán robot hàng triệu trạng thái làm lặp giá trị toàn bảng $O(|S|^2|A|)$ (tỉ lệ bậc hai theo số trạng thái) quá chậm, phải thay bằng xấp xỉ hàm giá trị hoặc học tăng cường.</p>
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Kiểm bằng đường khác, ta thay giá trị cuối ngược vào phương trình ở ô đầu, với hành động đi lên. Trừ 0 phẩy 04, cộng 0 phẩy 8 nhân 0 phẩy 762, cộng 0 phẩy 1 nhân 0 phẩy 705, cộng 0 phẩy 1 nhân 0 phẩy 655. Kết quả khoảng 0 phẩy 7056, khớp 0 phẩy 705 sau khi làm tròn, vì giá trị cuối là điểm bất động của phương trình, tức áp dụng phương trình vào nó thì nó không đổi. Ở hai mức quy mô, lưới 12 ô hội tụ sau khoảng 30 vòng trong 1 mi li giây. Điều khiển người máy hàng triệu trạng thái làm lặp toàn bảng quá chậm, phải chuyển sang xấp xỉ hàm giá trị.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - '[alg.grid43(r, policy_out=True, iters=2000)[1][(3, 1)] for r in (-0.04, -0.4, -2)] == [''W'', ''N'', ''E''] and alg.grid43(-2, policy_out=True, iters=2000)[1][(4, 1)] == ''N'''
  steps:
  - show: |
      <div class="box warn"><b>Lỗi 1.</b> Nghĩ chính sách tối ưu không phụ thuộc thưởng mỗi bước <b class="red">(đổi hẳn)</b>
      <br><span class="note">Ở ô (3,1): thưởng −0,04 → đi vòng sang trái; −0,4 → đi lên, liều đi sát ô −1; −2 → lao sang phải, và ở (4,1) đi thẳng vào ô −1 cho xong — sống lâu còn tệ hơn.</span></div>
    say: Lỗi thứ nhất, nghĩ chính sách tối ưu không phụ thuộc thưởng mỗi bước, trong khi nó đổi hẳn. Ở ô cột 3 hàng 1, thưởng trừ 0 phẩy 04 thì đi vòng sang trái, trừ 0 phẩy 4 thì đi lên, liều đi sát ô trừ 1. Thưởng trừ 2 thì lao sang phải, và ở ô cuối hàng còn đi thẳng vào ô trừ 1 cho xong, vì sống lâu còn tệ hơn.
  - show: |
      <div class="box warn"><b>Lỗi 2.</b> Dùng lặp giá trị khi không biết mô hình <b class="red">(thiếu dữ liệu)</b>
      <br><span class="note">Lặp giá trị cần biết $P(s' \mid s, a)$ và $R$. Không biết thì phải học từ trải nghiệm — <b>học Q</b>: đi thử nhiều lần, ước lượng dần giá trị của từng cặp (ô, hành động) từ thưởng nhận được, không cần biết $P$.</span></div>
    say: Lỗi thứ hai, dùng lặp giá trị khi không biết mô hình, tức thiếu dữ liệu. Lặp giá trị cần biết xác suất chuyển và thưởng. Không biết thì phải học từ trải nghiệm, như phương pháp học Q. Phương pháp này đi thử nhiều lần, ước lượng dần giá trị của từng cặp ô và hành động từ thưởng nhận được, không cần biết xác suất chuyển.
  - clear: true
    show: |
      <div class="box warn"><b>Lỗi 3.</b> Dừng lặp quá sớm <b class="red">(giá trị chưa đúng)</b>
      <br><span class="note">Sau 5 vòng, U(1,1) vẫn âm (−0,2) vì thưởng +1 chưa “lan” tới. Dừng khi thay đổi lớn nhất giữa hai vòng đủ nhỏ, không theo số vòng cố định. <b>Lặp chính sách</b> là cách khác: giữ cố định một chính sách, tính giá trị mọi ô theo nó; rồi ở mỗi ô đổi sang hành động tốt nhất theo giá trị vừa tính; lặp tới khi chính sách không đổi — thường ít vòng hơn, cho cùng kết quả 0,705.</span></div>
    say: Lỗi thứ ba, dừng lặp quá sớm nên giá trị chưa đúng. Sau 5 vòng, giá trị ô đầu vẫn âm vì thưởng cộng 1 chưa lan tới. Hãy dừng khi thay đổi lớn nhất giữa hai vòng đủ nhỏ, không theo số vòng cố định. Lặp chính sách là một cách khác. Nó giữ cố định một chính sách và tính giá trị mọi ô theo chính sách đó. Rồi ở mỗi ô, nó đổi sang hành động tốt nhất theo giá trị vừa tính, và lặp tới khi chính sách không đổi. Cách này thường cần ít vòng hơn, và cho cùng kết quả 0 phẩy 705.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(-0.04 + 0.8 * 1 + 0.1 * 0.918 + 0.1 * 0.66, 3) == 0.918
  steps:
  - show: |
      <table class="t"><tr><th>câu</th><th>đề</th></tr>
      <tr><td>1</td><td>Kiểm phương trình Bellman tại ô (3,3) với hành động “sang phải”: 0,8 tới ô +1, 0,1 đứng yên (đâm tường trên), 0,1 xuống (3,2) giá trị 0,660. Thay $U(3,3) = 0{,}918$ vào vế phải: vế phải có bằng 0,918 không?</td></tr>
      <tr><td>2</td><td>Nếu đi chính xác 100%, chính sách ở (3,1) có còn đi vòng không?</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, kiểm phương trình giá trị tại ô cột 3 hàng 3 với hành động sang phải. Khi đó 0 phẩy 8 tới ô cộng 1, 0 phẩy 1 đứng yên vì đâm tường trên, và 0 phẩy 1 xuống ô có giá trị 0 phẩy 66. Thay giá trị 0 phẩy 918 của chính ô này vào vế phải, vế phải có bằng 0 phẩy 918 không? Câu hai, nếu robot đi chính xác 100 phần trăm, chính sách ở ô cột 3 hàng 1 có còn đi vòng không? Dừng video và làm ra giấy.
    pause: 15
  - show: |
      <table class="t"><tr><th>phần</th><th>tính</th></tr>
      <tr><td>thưởng bước</td><td>−0,04</td></tr>
      <tr><td>0,8 tới ô +1</td><td>0,8 nhân 1 = 0,8</td></tr>
      <tr><td>0,1 đứng yên, 0,1 xuống</td><td>$0{,}1 \cdot 0{,}918 + 0{,}1 \cdot 0{,}660 = 0{,}158$</td></tr>
      <tr><td>cộng</td><td>≈ $\hl{0{,}918}$ — đúng bằng giá trị đã tính</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Đáp án câu một, cộng từng phần. Thưởng bước là trừ 0 phẩy 04. Phần tới ô cộng 1 là 0 phẩy 8. Phần đứng yên và đi xuống là 0 phẩy 158. Cộng lại xấp xỉ 0 phẩy 918, đúng bằng giá trị đã tính, vì đó là điểm bất động.
  - show: |
      <p>② <b>Không</b>: không trượt thì đi sát ô −1 không có rủi ro → <b>đi lên</b>, đường ngắn nhất là tối ưu.</p>
    say: Câu hai, không, vì không trượt thì đi sát ô trừ 1 không có rủi ro, nên đi lên theo đường ngắn nhất là tối ưu.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/AIF/L12
  steps:
  - show: <table class='t'><tr><th>Thực hành AIF:L12</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/AIF/L12/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Lặp giá trị bài toán bất định 3 ô thẳng hàng tới ô đích +1.0</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>U0=... U1=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh AIF L12 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (1 dòng)</b></p><div class="code"><div>U0=0.617 U1=0.795</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>a, b = ...</code></td><td>Giải nén nhiều giá trị cùng lúc vào các tên biến tương ứng theo thứ tự</td></tr><tr><td><code>_</code></td><td>Biến bỏ qua (dùng khi đếm số vòng lặp hoặc giải nén phần tử không cần tới)</td></tr><tr><td><code>[a, b, ...]</code></td><td>Danh sách nhiều phần tử theo thứ tự (lấy phần tử thứ <code>i</code> bằng <code>ds[i]</code>, đếm từ <code>0</code>)</td></tr><tr><td><code>ds[i]</code></td><td>Lấy phần tử ở vị trí <code>i</code> (đếm từ <code>0</code>)</td></tr><tr><td><code>range(...), max(...)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.3f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo AIF:L12 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>u = [0.0, 0.0, 1.0]</div><div>for _ in range(30):</div><div>    act1 = -0.05 + 0.9 * (0.7 * u[2] + 0.3 * u[1])</div><div>    act2 = -0.05 + 0.9 * (0.7 * u[0] + 0.3 * u[1])</div><div>    u1_new = max(act1, act2)</div><div>    u0_new = max(-0.05 + 0.9 * (0.7 * u[1] + 0.3 * u[0]), -0.05 + 0.9 * u[0])</div><div>    u[0], u[1] = u0_new, u1_new</div><div>print(f"U0={u[0]:.3f} U1={u[1]:.3f}")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">hành động có kết quả ngẫu nhiên</span><span class="a">→</span>
      <span class="n">phương trình Bellman cho giá trị</span><span class="a">→</span>
      <span class="n">lặp giá trị tới điểm bất động</span><span class="a">→</span>
      <span class="n">chính sách đổi theo thưởng và rủi ro</span></div>
    say: Tổng kết lại, khi kết quả hành động mang tính ngẫu nhiên, ta mô hình bài toán bằng quá trình quyết định Markov có thưởng và chiết khấu. Giá trị tối ưu tại mỗi trạng thái thoả phương trình tự nhất quán gắn với hành động tốt nhất. Lặp giá trị cập nhật bảng nhiều vòng cho tới khi thay đổi đủ nhỏ rồi đọc ra chính sách hành động tối ưu. Chỉ cần đổi nhẹ mức thưởng từng bước hay chiết khấu, đường đi tối ưu có thể chuyển từ lối tắt rủi ro sang vòng an toàn. Khi chuyển sang không gian liên tục hay hàng triệu trạng thái không thể giữ hết bằng bảng, lặp giá trị trở thành nền tảng cho học tăng cường hiện đại. Hãy nhớ luôn đọc kỹ xác suất trượt ngẫu nhiên của từng hành động và tách rạch ròi trạng thái kết thúc giữ giá trị cố định khi viết vòng lặp cập nhật. Hãy chú ý cập nhật giá trị mới bằng mảng tạm thay vì ghi đè ngay trong vòng lặp nếu muốn đúng bản cập nhật đồng bộ. Chú ý dùng biến tạm lưu bản mới của mọi ô sau mỗi lượt cập nhật rồi mới gán lại đồng loạt. Cách gán đồng loạt này bảo đảm không giá trị mới nào bị trộn lẫn trong cùng một vòng lặp.
  - show: |
      <div class="box key"><b>Tư duy:</b> khi hành động không chắc thành công, đường ngắn nhất chưa chắc là đường tốt nhất — hãy tối ưu <b>kỳ vọng</b>, không tối ưu kịch bản đẹp.</div>
      <p class="note"><b>Hai mức quy mô:</b> Lưới 4×3 (11 ô đi được, 1 ô tường) hội tụ sau 30 vòng (~1 mi-li-giây), còn bài toán điều khiển robot có hàng triệu trạng thái làm lặp bảng $O(|S|^2|A|)$ (tỉ lệ bậc hai theo số trạng thái) quá chậm — cần xấp xỉ hàm giá trị.</p>
    say: Điều cần mang theo, khi hành động không chắc thành công, đường ngắn nhất chưa chắc là đường tốt nhất, hãy tối ưu kỳ vọng, không tối ưu kịch bản đẹp. Lưới 12 ô hội tụ sau khoảng 30 vòng trong 1 mi li giây. Bài điều khiển người máy hàng triệu trạng thái buộc phải thay bảng bằng hàm xấp xỉ giá trị.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 13): <b>tổng hợp</b> — khi nào tìm kiếm, khi nào suy luận, khi nào học.</p>
    forward_ref: true
    say: Ở bài sau, bài 13, ta tổng hợp cả khoá, khi nào tìm kiếm, khi nào suy luận, và khi nào học. Hẹn gặp bạn ở bài tiếp theo.
