  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">hành động có kết quả ngẫu nhiên</span><span class="a">→</span>

      <span class="n">phương trình Bellman cho giá trị</span><span class="a">→</span>

