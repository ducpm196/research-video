      <span class="n">chính sách đổi theo thưởng và rủi ro</span></div>

      '
    say: Tổng kết lại, khi kết quả hành động mang tính ngẫu nhiên, ta mô hình bài toán bằng quá trình quyết định Markov có thưởng và chiết khấu. Giá trị tối ưu tại mỗi trạng thái thoả phương trình tự nhất quán gắn với hành động tốt nhất. Lặp giá trị cập nhật bảng nhiều vòng cho tới khi thay đổi đủ nhỏ rồi đọc ra chính sách hành động tối ưu. Chỉ cần đổi nhẹ mức thưởng từng bước hay chiết khấu, đường đi tối ưu có thể chuyển từ lối tắt rủi ro sang vòng an toàn. Hệ thức đệ quy giá trị đóng vai trò cầu nối toán học giữa phần thưởng tức thời và giá trị kỳ vọng tương lai ở mọi bài toán ra quyết định tuần tự.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: '<div class="chain"><span class="n">hành động có kết quả ngẫu nhiên</span><span class="a">→</span>

      <span class="n">phương trình Bellman cho giá trị</span><span class="a">→</span>

      <span class="n">lặp giá trị tới điểm bất động</span><span class="a">→</span>

      <span class="n">chính sách đổi theo thưởng và rủi ro</span></div>

      '
    say: Khi chuyển sang không gian liên tục hay hàng triệu trạng thái không thể giữ hết bằng bảng, lặp giá trị trở thành nền tảng cho học tăng cường hiện đại. Hãy nhớ luôn đọc kỹ xác suất trượt ngẫu nhiên của từng hành động và tách rạch ròi trạng thái kết thúc giữ giá trị cố định khi viết vòng lặp cập nhật. Hãy chú ý cập nhật giá trị mới bằng mảng tạm thay vì ghi đè ngay trong vòng lặp nếu muốn đúng bản cập nhật đồng bộ. Chú ý dùng biến tạm lưu bản mới của mọi ô sau mỗi lượt cập nhật rồi mới gán lại đồng loạt. Cách gán đồng loạt này bảo đảm không giá trị mới nào bị trộn lẫn trong cùng một vòng lặp.
    focus:
    - '1.1'
