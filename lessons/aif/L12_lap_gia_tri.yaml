series: "AIF · Nền tảng trí tuệ nhân tạo"
title: "Bài 12 — Lập kế hoạch khi bất định: lặp giá trị và lặp chính sách"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/aif.yaml L12; audit/aif/verify_aif.py L12; R. Bellman, Dynamic Programming (1957); R. Howard, Dynamic Programming and Markov Processes (1960) — lặp chính sách; AIMA bản 4 (2020), mục 17.1–17.2 (thế giới lưới 4×3: U(1,1) = 0,705, U(3,3) = 0,918); CS115 bài 39 (phương trình Bellman, học Q)"
assumes: [arith, prob, given, max_fn, sum, sub, cdot, approx]
# Quy ước: thế giới lưới 4×3 của AIMA, ô viết (cột, hàng) đếm từ 1; tường ở (2,2); ô kết thúc +1 ở (4,3), −1 ở (4,2). Đi đúng hướng 0,8, lệch
#   vuông góc mỗi bên 0,1; đâm tường đứng yên. Thưởng mỗi bước R, hệ số chiết khấu gamma = 1. alg.grid43(R, gamma, iters=, policy_out=)
#   chạy lặp giá trị từ U = 0; hướng: N lên, S xuống, E phải, W trái (trên màn hình vẽ bằng mũi tên chữ: lên, xuống, phải, trái).
objectives:
  - "Viết phương trình Bellman cho quá trình quyết định Markov"
  - "Chạy lặp giá trị và đọc chính sách tối ưu"
  - "Thấy chính sách đổi theo thưởng mỗi bước"
asr_reviewed:
  - {sentence: "P của s phẩy khi biết s và a là xác suất tới ô s phẩy khi ở s và chọn hành động a, 0 phẩy 8 đúng hướng và 0 phẩy 1 mỗi bên.", reason: "ASR chép “P của X phải khi biết X và A là xa xuất tới OX phải khi ở X và chọn hành động A, không phải 8 đúng hướng và không phải một mỗi bên.” (0.812): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: xác/xa, ô (trong “ô s phẩy” → “ox phải”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Robot trượt bánh: đường ngắn có còn tốt nhất?"
    checks:
      - "alg.grid43(policy_out=True)[1][(3, 1)] == 'W'"
    steps:
      - show: |
          <p>Robot trên lưới 4 × 3: một ô thưởng +1, ngay cạnh là ô phạt −1. Lệnh “đi lên” chỉ đúng 80%; 20% còn lại trượt sang hai bên. Đứng ở ô (3,1), đường ngắn nhất đi sát ô −1. Robot tối ưu lại chọn <b>đi vòng</b> sang trái. Vì sao?</p>
          <div class="box key">Hôm nay: <b>lập kế hoạch khi kết quả hành động không chắc chắn</b> — tính giá trị của từng ô bằng <b>lặp giá trị</b>, rồi đọc ra chính sách.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, robot đi trên lưới 4 nhân 3, có một ô thưởng cộng 1, ngay cạnh là ô phạt trừ 1. Lệnh đi lên chỉ đúng 80 phần trăm, 20 phần trăm còn lại trượt sang hai bên. Đứng ở ô cột 3 hàng 1, đường ngắn nhất đi sát ô trừ 1. Robot tối ưu lại chọn đi vòng sang trái, vì sao vậy? Hôm nay ta học lập kế hoạch khi kết quả hành động không chắc chắn, tính giá trị của từng ô bằng lặp giá trị, rồi đọc ra chính sách."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Trước hết: kỳ vọng của một lựa chọn may rủi"
    checks:
      - "0.8 * 10 + 0.2 * 0 == 8.0 and max(8.0, 6.0) == 8.0"
      - "(8 * 10 + 2 * 0) / 10 == 8.0"
    steps:
      - show: |
          <p><b>Kỳ vọng</b>: điểm trung bình mỗi lần nếu chọn cùng một cách rất nhiều lần. Chọn A 10 lần: khoảng 8 lần được 10, 2 lần được 0 → $(8 \cdot 10 + 2 \cdot 0) / 10 = 8$ điểm mỗi lần.</p>
          <table class="t"><tr><th>lựa chọn</th><th>kết quả có thể</th><th>kỳ vọng</th></tr>
          <tr><td>A</td><td>80% được 10 điểm, 20% được 0</td><td>$0{,}8 \cdot 10 + 0{,}2 \cdot 0 = 8$</td></tr>
          <tr><td>B</td><td>chắc chắn 6 điểm</td><td>6</td></tr></table>
          <p>Chọn theo kỳ vọng: lấy <b>lớn nhất</b> → A (8 &gt; 6).</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Trước hết, ta cần hiểu kỳ vọng, tức điểm trung bình mỗi lần nếu chọn cùng một cách rất nhiều lần. Chọn A 10 lần thì khoảng 8 lần được 10 điểm và 2 lần được 0, trung bình 8 điểm mỗi lần, cũng là 0 phẩy 8 nhân 10 cộng 0 phẩy 2 nhân 0. Lựa chọn B chắc chắn cho 6 điểm. Chọn theo kỳ vọng thì lấy số lớn nhất, tức A."

  - id: sym
    kind: symbol
    title: "Giải mã: giá trị, phương trình Bellman, chính sách"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$R(s)$</td><td>thưởng nhận ở ô $s$ (ở đây −0,04 mỗi bước; ô kết thúc +1 hoặc −1)</td></tr>
          <tr><td>$P(s' \mid s, a)$</td><td>xác suất tới ô $s'$ khi ở $s$ và chọn hành động $a$ (0,8 đúng hướng, 0,1 mỗi bên)</td></tr>
          <tr><td>$\gamma$</td><td>hệ số chiết khấu; ở đây $\gamma = 1$</td></tr>
          <tr><td>$U(s)$</td><td>giá trị: tổng thưởng kỳ vọng nếu từ $s$ hành động tối ưu</td></tr></table>
          <p class="note">Bài toán gồm trạng thái, hành động, xác suất chuyển $P$ và thưởng $R$ như trên gọi là <b>quá trình quyết định Markov</b>: kết quả của hành động chỉ phụ thuộc ô đang đứng, không phụ thuộc đường đã đi tới đó.</p>
          <p><b>Phương trình Bellman</b>: $U(s) = R(s) + \gamma \max_{a} \sum_{s'} P(s' \mid s, a) \, U(s')$.</p>
          <p><b>Lặp giá trị</b>: bắt đầu $U = 0$, áp dụng phương trình cho mọi ô, lặp tới khi không đổi. <b>Chính sách</b>: ở mỗi ô, chọn hành động đạt max.</p>
        introduces: [disc, max_fn, sum, prime]
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2, 3, 4, 4]
        say: "Bảng giới thiệu bốn ký hiệu. R của s là thưởng nhận ở ô s, ở đây trừ 0 phẩy 04 mỗi bước, còn ô kết thúc là cộng 1 hoặc trừ 1. P của s phẩy khi biết s và a là xác suất tới ô s phẩy khi ở s và chọn hành động a, 0 phẩy 8 đúng hướng và 0 phẩy 1 mỗi bên. gam-ma là hệ số chiết khấu, ở đây bằng 1, tức là không giảm giá trị tương lai. U của s là giá trị, tổng thưởng kỳ vọng nếu từ s hành động tối ưu. Bài toán gồm trạng thái, hành động, xác suất chuyển và thưởng như vậy gọi là quá trình quyết định Markov. Ở đó, kết quả của hành động chỉ phụ thuộc ô đang đứng, không phụ thuộc đường đã đi. Phương trình giá trị tối ưu nói U của s bằng R của s, cộng gam-ma nhân số lớn nhất theo hành động của tổng xác suất nhân giá trị ô tới. Lặp giá trị bắt đầu từ U bằng 0, áp dụng phương trình cho mọi ô, và lặp tới khi không đổi. Chính sách là ở mỗi ô, chọn hành động đạt số lớn nhất đó."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Giá trị lan ra từ ô thưởng"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g font-size="26" text-anchor="middle" fill="#1f2937"><rect x="300" y="230" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="410" y="270" font-weight="bold">0,705</text><text x="410" y="305" font-size="22" fill="#2a78d6">đi lên</text><rect x="300" y="130" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="410" y="170" font-weight="bold">0,762</text><text x="410" y="205" font-size="22" fill="#2a78d6">đi lên</text><rect x="300" y="30" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="410" y="70" font-weight="bold">0,812</text><text x="410" y="105" font-size="22" fill="#2a78d6">đi phải</text><rect x="530" y="230" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="640" y="270" font-weight="bold">0,655</text><text x="640" y="305" font-size="22" fill="#2a78d6">đi trái</text><rect x="530" y="130" width="220" height="92" rx="8" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/><text x="640" y="170" font-weight="bold">tường</text><rect x="530" y="30" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="640" y="70" font-weight="bold">0,868</text><text x="640" y="105" font-size="22" fill="#2a78d6">đi phải</text><rect x="760" y="230" width="220" height="92" rx="8" fill="#ffedd5" stroke="#6b7280" stroke-width="2"/><text x="870" y="270" font-weight="bold">0,611</text><text x="870" y="305" font-size="22" fill="#2a78d6">đi trái</text><rect x="760" y="130" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="870" y="170" font-weight="bold">0,660</text><text x="870" y="205" font-size="22" fill="#2a78d6">đi lên</text><rect x="760" y="30" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="870" y="70" font-weight="bold">0,918</text><text x="870" y="105" font-size="22" fill="#2a78d6">đi phải</text><rect x="990" y="230" width="220" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="1100" y="270" font-weight="bold">0,388</text><text x="1100" y="305" font-size="22" fill="#2a78d6">đi trái</text><rect x="990" y="130" width="220" height="92" rx="8" fill="#fee2e2" stroke="#6b7280" stroke-width="2"/><text x="1100" y="170" font-weight="bold">−1</text><rect x="990" y="30" width="220" height="92" rx="8" fill="#d1fae5" stroke="#6b7280" stroke-width="2"/><text x="1100" y="70" font-weight="bold">+1</text></g><g font-size="22" fill="#6b7280" text-anchor="end"><text x="280" y="80">hàng 3</text><text x="280" y="180">hàng 2</text><text x="280" y="280">hàng 1</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình là lưới 4 nhân 3 sau khi lặp xong, mỗi ô ghi giá trị và hướng nên đi. Giá trị lan ra từ ô cộng 1, càng xa càng nhỏ, và ô sát ô trừ 1 bị kéo xuống. Ô tô màu cam, cột 3 hàng 1, chọn đi trái chứ không đi lên, để tránh trượt vào ô trừ 1."

  - id: example
    kind: example
    title: "Lặp giá trị trên lưới 4 × 3"
    checks:
      - "[round(alg.grid43(iters=k)[(1, 1)], 3) for k in (1, 5, 10, 20)] == [-0.04, -0.2, 0.649, 0.705]"
      - "(lambda U: (round(0.8 * U[(3, 2)] + 0.1 * U[(2, 1)] + 0.1 * U[(4, 1)], 3), round(0.8 * U[(2, 1)] + 0.1 * U[(3, 2)] + 0.1 * U[(3, 1)], 3)))(alg.grid43()) == (0.633, 0.651)"
      - "round(0.8 * 0.660 + 0.1 * 0.655 + 0.1 * 0.388, 3) == 0.632 and round(0.8 * 0.655 + 0.1 * 0.660 + 0.1 * 0.611, 3) == 0.651"
      - "(lambda U: [round(U[c], 3) for c in ((1, 3), (2, 3), (3, 3), (1, 2), (3, 2), (1, 1), (2, 1), (3, 1), (4, 1))])(alg.grid43()) == [0.812, 0.868, 0.918, 0.762, 0.66, 0.705, 0.655, 0.611, 0.388]"
    steps:
      - show: |
          <table class="t"><tr><th>vòng lặp</th><th>1</th><th>5</th><th>10</th><th>20</th></tr>
          <tr><td>$U(1,1)$</td><td>−0,04</td><td>−0,20</td><td>0,649</td><td>$\hl{0{,}705}$ (không đổi nữa)</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bắt đầu với mọi giá trị bằng 0 rồi lặp. Giá trị của ô đầu là trừ 0 phẩy 04 ở vòng 1, trừ 0 phẩy 2 ở vòng 5, rồi 0 phẩy 649 ở vòng 10, vì thưởng cộng 1 lan dần tới. Tới vòng 20 nó đạt 0 phẩy 705, sau đó không đổi nữa."
      - show: |
          <table class="t"><tr><th>hàng \ cột</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>3</td><td>0,812</td><td>0,868</td><td>$\hl{0{,}918}$</td><td class="green">+1</td></tr>
          <tr><td>2</td><td>0,762</td><td>tường</td><td>0,660</td><td class="red">−1</td></tr>
          <tr><td>1</td><td>0,705</td><td>0,655</td><td>0,611</td><td>0,388</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng cho giá trị cuối của mọi ô. Hàng trên tăng dần tới 0 phẩy 918 ở ô cạnh ô cộng 1. Hàng giữa có tường, và ô cạnh ô trừ 1 chỉ 0 phẩy 66. Hàng dưới giảm dần từ 0 phẩy 705 xuống 0 phẩy 388."
      - clear: true
        show: |
          <p>Ở ô (3,1), <b>đi lên</b>: 0,8 tới (3,2), 0,1 trượt trái tới (2,1), 0,1 trượt phải tới (4,1):</p>
          $$0{,}8 \cdot 0{,}660 + 0{,}1 \cdot 0{,}655 + 0{,}1 \cdot 0{,}388 \approx 0{,}632$$
        focus: [1, 1, 2]
        say: "Giờ tính ở ô cột 3 hàng 1. Nếu đi lên, 0 phẩy 8 tới ô sát ô trừ 1, 0 phẩy 1 trượt trái và 0 phẩy 1 trượt phải. Kỳ vọng là 0 phẩy 8 nhân 0 phẩy 66, cộng 0 phẩy 1 nhân 0 phẩy 655, cộng 0 phẩy 1 nhân 0 phẩy 388, khoảng 0 phẩy 632."
      - show: |
          <p><b>Đi trái</b>: 0,8 tới (2,1), 0,1 trượt lên (3,2), 0,1 trượt xuống — đâm tường, đứng yên ở (3,1):</p>
          $$0{,}8 \cdot 0{,}655 + 0{,}1 \cdot 0{,}660 + 0{,}1 \cdot 0{,}611 \approx \hl{0{,}651}$$
          <p>0,651 &gt; 0,632 → chính sách chọn <b>đi trái</b> rồi vòng qua hàng trên.</p>
        focus: [1, 2, 3]
        say: "Nếu đi trái, 0 phẩy 8 tới ô bên trái, 0 phẩy 1 trượt lên, và 0 phẩy 1 trượt xuống thì đâm tường nên đứng yên. Kỳ vọng khoảng 0 phẩy 651. Vì 0 phẩy 651 lớn hơn 0 phẩy 632, chính sách chọn đi trái rồi vòng qua hàng trên."

  - id: check
    kind: check
    title: "Tự kiểm: giá trị là điểm bất động"
    checks:
      - "(lambda U: round(-0.04 + 0.8 * U[(1, 2)] + 0.1 * U[(1, 1)] + 0.1 * U[(2, 1)], 3) == round(U[(1, 1)], 3) == 0.705)(alg.grid43())"
    steps:
      - show: |
          <p>Thay giá trị cuối vào phương trình Bellman ở ô (1,1), hành động “đi lên” (0,8 lên (1,2); 0,1 đâm tường trái, đứng yên; 0,1 sang (2,1)):</p>
          $$-0{,}04 + 0{,}8 \cdot 0{,}762 + 0{,}1 \cdot 0{,}705 + 0{,}1 \cdot 0{,}655 \approx 0{,}705 \checkmark$$
        focus: [1, 2, 2]
        say: "Kiểm bằng đường khác, ta thay giá trị cuối ngược vào phương trình ở ô đầu, với hành động đi lên. Trừ 0 phẩy 04, cộng 0 phẩy 8 nhân 0 phẩy 762, cộng 0 phẩy 1 nhân 0 phẩy 705, cộng 0 phẩy 1 nhân 0 phẩy 655. Kết quả đúng bằng 0 phẩy 705, vì giá trị cuối là điểm bất động của phương trình."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "[alg.grid43(r, policy_out=True, iters=2000)[1][(3, 1)] for r in (-0.04, -0.4, -2)] == ['W', 'N', 'E'] and alg.grid43(-2, policy_out=True, iters=2000)[1][(4, 1)] == 'N'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ chính sách tối ưu không phụ thuộc thưởng mỗi bước <b class="red">(đổi hẳn)</b>
          <br><span class="note">Ở ô (3,1): thưởng −0,04 → đi vòng sang trái; −0,4 → đi lên, liều đi sát ô −1; −2 → lao sang phải, và ở (4,1) đi thẳng vào ô −1 cho xong — sống lâu còn tệ hơn.</span></div>
        say: "Lỗi thứ nhất, nghĩ chính sách tối ưu không phụ thuộc thưởng mỗi bước, trong khi nó đổi hẳn. Ở ô cột 3 hàng 1, thưởng trừ 0 phẩy 04 thì đi vòng sang trái, trừ 0 phẩy 4 thì đi lên, liều đi sát ô trừ 1. Thưởng trừ 2 thì lao sang phải, và ở ô cuối hàng còn đi thẳng vào ô trừ 1 cho xong, vì sống lâu còn tệ hơn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng lặp giá trị khi không biết mô hình <b class="red">(thiếu dữ liệu)</b>
          <br><span class="note">Lặp giá trị cần biết $P(s' \mid s, a)$ và $R$. Không biết thì phải học từ trải nghiệm — <b>học Q</b>: đi thử nhiều lần, ước lượng dần giá trị của từng cặp (ô, hành động) từ thưởng nhận được, không cần biết $P$.</span></div>
        say: "Lỗi thứ hai, dùng lặp giá trị khi không biết mô hình, tức thiếu dữ liệu. Lặp giá trị cần biết xác suất chuyển và thưởng. Không biết thì phải học từ trải nghiệm, như phương pháp học Q. Phương pháp này đi thử nhiều lần, ước lượng dần giá trị của từng cặp ô và hành động từ thưởng nhận được, không cần biết xác suất chuyển."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dừng lặp quá sớm <b class="red">(giá trị chưa đúng)</b>
          <br><span class="note">Sau 5 vòng, U(1,1) vẫn âm (−0,2) vì thưởng +1 chưa “lan” tới. Dừng khi thay đổi lớn nhất giữa hai vòng đủ nhỏ, không theo số vòng cố định. <b>Lặp chính sách</b> là cách khác: giữ cố định một chính sách, tính giá trị mọi ô theo nó; rồi ở mỗi ô đổi sang hành động tốt nhất theo giá trị vừa tính; lặp tới khi chính sách không đổi — thường ít vòng hơn, cho cùng kết quả 0,705.</span></div>
        say: "Lỗi thứ ba, dừng lặp quá sớm nên giá trị chưa đúng. Sau 5 vòng, giá trị ô đầu vẫn âm vì thưởng cộng 1 chưa lan tới. Hãy dừng khi thay đổi lớn nhất giữa hai vòng đủ nhỏ, không theo số vòng cố định. Lặp chính sách là một cách khác. Nó giữ cố định một chính sách và tính giá trị mọi ô theo chính sách đó. Rồi ở mỗi ô, nó đổi sang hành động tốt nhất theo giá trị vừa tính, và lặp tới khi chính sách không đổi. Cách này thường cần ít vòng hơn, và cho cùng kết quả 0 phẩy 705."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(-0.04 + 0.8 * 1 + 0.1 * 0.918 + 0.1 * 0.66, 3) == 0.918"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Kiểm phương trình Bellman tại ô (3,3) với hành động “sang phải”: 0,8 tới ô +1, 0,1 đứng yên (đâm tường trên), 0,1 xuống (3,2) giá trị 0,660. Tính $U(3,3)$.</td></tr>
          <tr><td>2</td><td>Nếu đi chính xác 100%, chính sách ở (3,1) có còn đi vòng không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, kiểm phương trình giá trị tại ô cột 3 hàng 3 với hành động sang phải. Khi đó 0 phẩy 8 tới ô cộng 1, 0 phẩy 1 đứng yên vì đâm tường trên, và 0 phẩy 1 xuống ô có giá trị 0 phẩy 66. Tính giá trị của ô đó. Câu hai, nếu robot đi chính xác 100 phần trăm, chính sách ở ô cột 3 hàng 1 có còn đi vòng không? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>phần</th><th>tính</th></tr>
          <tr><td>thưởng bước</td><td>−0,04</td></tr>
          <tr><td>0,8 tới ô +1</td><td>0,8 nhân 1 = 0,8</td></tr>
          <tr><td>0,1 đứng yên, 0,1 xuống</td><td>$0{,}1 \cdot 0{,}918 + 0{,}1 \cdot 0{,}660 = 0{,}158$</td></tr>
          <tr><td>cộng</td><td>≈ $\hl{0{,}918}$ — đúng bằng giá trị đã tính</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, cộng từng phần. Thưởng bước là trừ 0 phẩy 04. Phần tới ô cộng 1 là 0 phẩy 8. Phần đứng yên và đi xuống là 0 phẩy 158. Cộng lại xấp xỉ 0 phẩy 918, đúng bằng giá trị đã tính, vì đó là điểm bất động."
      - show: |
          <p>② <b>Không</b>: không trượt thì đi sát ô −1 không có rủi ro → <b>đi lên</b>, đường ngắn nhất là tối ưu.</p>
        say: "Câu hai, không, vì không trượt thì đi sát ô trừ 1 không có rủi ro, nên đi lên theo đường ngắn nhất là tối ưu."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hành động có kết quả ngẫu nhiên</span><span class="a">→</span>
          <span class="n">phương trình Bellman cho giá trị</span><span class="a">→</span>
          <span class="n">lặp giá trị tới điểm bất động</span><span class="a">→</span>
          <span class="n">chính sách đổi theo thưởng và rủi ro</span></div>
        say: "Tổng kết lại, khi hành động có kết quả ngẫu nhiên, giá trị mỗi ô thoả phương trình giá trị tối ưu. Lặp giá trị tới điểm bất động rồi đọc chính sách, và chính sách thay đổi theo thưởng và rủi ro."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi hành động không chắc thành công, đường ngắn nhất chưa chắc là đường tốt nhất — hãy tối ưu <b>kỳ vọng</b>, không tối ưu kịch bản đẹp.</div>
        say: "Điều cần mang theo, khi hành động không chắc thành công, đường ngắn nhất chưa chắc là đường tốt nhất, hãy tối ưu kỳ vọng, không tối ưu kịch bản đẹp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>tổng hợp</b> — khi nào tìm kiếm, khi nào suy luận, khi nào học.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta tổng hợp cả khoá, khi nào tìm kiếm, khi nào suy luận, và khi nào học. Hẹn gặp bạn ở bài tiếp theo."
