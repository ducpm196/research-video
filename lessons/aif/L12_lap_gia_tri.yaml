    - '1.3'
    - '1.4'
    - '1.5'
  - show: '<div class="box key"><b>Tư duy:</b> khi hành động không chắc thành công, đường ngắn nhất chưa chắc là đường tốt nhất — hãy tối ưu <b>kỳ vọng</b>, không tối ưu kịch bản đẹp.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Lưới 4×3 (11 ô đi được, 1 ô tường) hội tụ sau 30 vòng (~1 mi-li-giây), còn bài toán điều khiển robot có hàng triệu trạng thái làm lặp bảng $O(|S|^2|A|)$ (tỉ lệ bậc hai theo số trạng thái) quá chậm — cần xấp xỉ hàm giá trị.</p>

      '
    say: Điều cần mang theo, khi hành động không chắc thành công, đường ngắn nhất chưa chắc là đường tốt nhất, hãy tối ưu kỳ vọng, không tối ưu kịch bản đẹp. Lưới 12 ô hội tụ sau khoảng 30 vòng trong 1 mi li giây. Bài điều khiển người máy hàng triệu trạng thái buộc phải thay bảng bằng hàm xấp xỉ giá trị. Trong thế giới ngẫu nhiên, quyết định khôn ngoan không tối ưu cho kịch bản may mắn nhất mà tối ưu kỳ vọng qua hàng loạt tình huống.
    focus:
