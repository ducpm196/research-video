id: L01
course: TOC
series: "TOC · Lý thuyết tính toán"
title: "Bài 1 — Ôtômat hữu hạn đơn định (DFA)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L01; audit/toc/verify_toc.py L01; M. Sipser, Introduction to the Theory of Computation (3rd ed.), mục 1.1"
assumes: [arith, sub, set, in, subseteq, alpha, eps, dots]
# Quy ước: DFA viết tắt chỉ trên màn hình; lời đọc nói “ô-tô-mát hữu hạn đơn định” hoặc “máy”. Chuỗi bit đọc tách từng chữ số.
#   Trạng thái q_0, q_1, q_2 = số dư 0, 1, 2. Hình sinh bằng audit/toc/fsm_svg.py từ bảng chuyển (check_edges kiểm đủ 6 cạnh);
#   mọi lượt chạy trong bài do alg.dfa_run tính, và máy được kiểm đúng với mọi n = 1..1999.
objectives:
  - "Đọc và chạy một DFA trên một chuỗi"
  - "Thiết kế DFA bằng cách hỏi: máy cần nhớ gì?"
  - "Kiểm DFA đầy đủ: mỗi trạng thái, mỗi ký hiệu, đúng một chuyển"
asr_reviewed:
  - {sentence: "Một ô-tô-mát hữu hạn đơn định có năm thành phần.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này"}
  - {sentence: "Câu hai, chạy trên chuỗi 1 0 1 0.", reason: "dãy chữ số đọc tách từng chữ; ASR gộp thành một số (“1010”) — đủ từng chữ số theo đúng thứ tự, lệch chỉ vì cách viết liền; dãy hiện trên màn hình; mọi từ khác khớp"}
  - {sentence: "Hôm nay ta học ô-tô-mát hữu hạn đơn định, và cách thiết kế nó bằng câu hỏi máy cần nhớ gì.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này"}
  - {sentence: "Ở bài sau, bài 2, ta cho máy được phép đoán, gọi là ô-tô-mát không đơn định, và học phép dựng tập con để đổi nó về máy đơn định.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba trạng thái, mọi số nhị phân"
    checks:
      - "int('110', 2) == 6 and int('111', 2) == 7"
    steps:
      - show: |
          <p>Một cỗ máy chỉ nhớ được <b>ba</b> trạng thái, đọc từng bit từ trái sang phải, rồi trả lời: số nhị phân này có chia hết cho 3 không?</p>
          <p>$110$ (bằng 6): <b>có</b>. $111$ (bằng 7): <b>không</b>. Và đúng với số dài bao nhiêu bit cũng được.</p>
          <div class="box key">Hôm nay: ôtômat hữu hạn đơn định — máy có bộ nhớ cố định, và cách thiết kế nó bằng câu hỏi “cần nhớ gì?”.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, một cỗ máy chỉ nhớ được ba trạng thái, đọc từng bit từ trái sang phải, rồi trả lời số nhị phân này có chia hết cho 3 không. Chuỗi 1 1 0, tức số 6, được trả lời có, còn 1 1 1, tức số 7, được trả lời không. Và máy đúng với số dài bao nhiêu bit cũng được. Hôm nay ta học ô-tô-mát hữu hạn đơn định, và cách thiết kế nó bằng câu hỏi máy cần nhớ gì."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số nhị phân và phép chia lấy dư"
    checks:
      - "1 * 4 + 1 * 2 + 0 * 1 == 6 == int('110', 2)"
      - "13 == 4 * 3 + 1 and 13 % 3 == 1 and 6 % 3 == 0"
    steps:
      - show: |
          <table class="t"><tr><th>bit của $110$</th><th>1</th><th>1</th><th>0</th></tr>
          <tr><td>giá trị vị trí</td><td>4</td><td>2</td><td>1</td></tr>
          <tr><td>góp vào</td><td>4</td><td>2</td><td>0</td></tr></table>
          $$4 + 2 + 0 = 6$$
        focus: [1, "1.2", "1.3", 2]
        say: "Trước khi vào bài, ta ôn hai điều sẽ dùng. Điều thứ nhất là đọc số nhị phân, mỗi vị trí từ phải sang trái có giá trị 1, 2, 4, gấp đôi vị trí trước. Chuỗi 1 1 0 có bit 1 ở vị trí giá trị 4 và vị trí giá trị 2, còn bit 0 ở vị trí giá trị 1 không góp gì. Cộng lại, 4 cộng 2 cộng 0 bằng 6."
      - show: |
          <table class="t"><tr><th>số</th><th>viết thành thương × 3 + dư</th><th>dư</th></tr>
          <tr><td>6</td><td>$6 = 2 \times 3 + 0$</td><td>0</td></tr>
          <tr><td>13</td><td>$13 = 4 \times 3 + 1$</td><td>1</td></tr></table>
        focus: [0, 0, "1.2", "1.3"]
        say: "Điều thứ hai là phép chia lấy dư. Chia một số cho 3 nghĩa là viết nó thành thương nhân 3 cộng số dư, số dư luôn là 0, 1 hoặc 2. Số 6 bằng 2 nhân 3 cộng 0, nên dư 0, tức là chia hết cho 3. Số 13 bằng 4 nhân 3 cộng 1, nên dư 1."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: năm thành phần của một DFA"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>nghĩa</th><th>trong hình</th></tr>
          <tr><td>$Q$</td><td>tập hữu hạn <b>trạng thái</b></td><td>các hình tròn</td></tr>
          <tr><td>$\Sigma$</td><td>bảng chữ cái đầu vào</td><td>nhãn trên mũi tên</td></tr>
          <tr><td>$\delta(q, a)$</td><td><b>hàm chuyển</b>: ở trạng thái $q$ đọc $a$ thì sang trạng thái nào</td><td>mũi tên có nhãn</td></tr>
          <tr><td>$q_0$</td><td>trạng thái <b>đầu</b></td><td>mũi tên không có gốc</td></tr>
          <tr><td>$F \subseteq Q$</td><td>tập trạng thái <b>nhận</b></td><td>vòng tròn đôi</td></tr></table>
        introduces: [delta]
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Một ô-tô-mát hữu hạn đơn định có năm thành phần. Q là tập hữu hạn trạng thái, vẽ bằng các hình tròn. Sigma là bảng chữ cái, ghi thành nhãn trên mũi tên. Đen-ta của q và a là hàm chuyển, cho biết ở trạng thái q đọc ký hiệu a thì sang trạng thái nào. q 0 là trạng thái đầu, có mũi tên không gốc chỉ vào. F là tập trạng thái nhận, vẽ bằng vòng tròn đôi."
      - show: |
          <div class="box key">Chạy máy: bắt đầu ở $q_0$, đọc lần lượt từng ký hiệu và đi theo mũi tên. Đọc <b>hết</b> chuỗi mà đứng ở trạng thái nhận thì nhận, ngược lại thì từ chối.</div>
        say: "Chạy máy như sau, bắt đầu ở trạng thái đầu, đọc lần lượt từng ký hiệu và đi theo mũi tên. Đọc hết chuỗi mà đang đứng ở trạng thái nhận thì nhận, ngược lại thì từ chối."

  # ───────────────────────── 3. THIẾT KẾ ─────────────────────────
  - id: design
    kind: concept
    title: "Thiết kế: máy chỉ cần nhớ số dư"
    checks:
      - "all((2 * v + b) % 3 == (2 * (v % 3) + b) % 3 for v in range(200) for b in (0, 1))"
      - "int('1101', 2) == 2 * int('110', 2) + 1"
    steps:
      - show: |
          <p>Đọc thêm một bit $b$ vào sau số $v$ thì số mới là $2v + b$. Ví dụ $110$ là 6, thêm bit 1 được $1101 = 2 \times 6 + 1 = 13$.</p>
          <p>Không cần nhớ cả số: số dư mới chỉ phụ thuộc số dư cũ, vì $(2v + b) \bmod 3 = (2 \times (v \bmod 3) + b) \bmod 3$.</p>
          <div class="box key">Nên chỉ cần 3 trạng thái: $q_r$ = “số đã đọc chia 3 dư $r$”. Nhận khi dư 0.</div>
        introduces: [mod]
        focus: [1, 1, 2, 3, 3]
        say: "Đọc thêm một bit b vào sau số v thì số mới bằng 2 nhân v cộng b. Ví dụ 1 1 0 là 6, thêm bit 1 được 1 1 0 1, bằng 2 nhân 6 cộng 1, là 13. Máy không cần nhớ cả số, vì số dư mới khi chia 3 chỉ phụ thuộc số dư cũ. Nên chỉ cần 3 trạng thái, trạng thái q r nghĩa là số đã đọc chia 3 dư r. Máy nhận khi số dư bằng 0."
      - clear: true
        show: |
          <div><svg width="760" height="330" viewBox="0 0 760 330"><defs><marker id="a3" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#374151"/></marker></defs><path d="M130,140 C96,57 204,57 170,140" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M182,151 Q270,83 356,149" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M358,199 Q270,267 184,201" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M422,151 Q510,83 596,149" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M598,199 Q510,267 424,201" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M610,140 C576,57 684,57 650,140" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><line x1="48" y1="175" x2="106" y2="175" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><circle cx="150" cy="175" r="40" fill="#dcfce7" stroke="#2563eb" stroke-width="3.5"/><circle cx="150" cy="175" r="32" fill="none" stroke="#2563eb" stroke-width="3"/><text x="150" y="185" font-size="30" text-anchor="middle" font-style="italic" font-family="KaTeX_Math, serif">q<tspan font-size="21" dy="8" font-style="normal" font-family="KaTeX_Main, serif">0</tspan></text><circle cx="390" cy="175" r="40" fill="#eff6ff" stroke="#2563eb" stroke-width="3.5"/><text x="390" y="185" font-size="30" text-anchor="middle" font-style="italic" font-family="KaTeX_Math, serif">q<tspan font-size="21" dy="8" font-style="normal" font-family="KaTeX_Main, serif">1</tspan></text><circle cx="630" cy="175" r="40" fill="#eff6ff" stroke="#2563eb" stroke-width="3.5"/><text x="630" y="185" font-size="30" text-anchor="middle" font-style="italic" font-family="KaTeX_Math, serif">q<tspan font-size="21" dy="8" font-style="normal" font-family="KaTeX_Main, serif">2</tspan></text><text x="150" y="61" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="269" y="101" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="271" y="267" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="509" y="101" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="511" y="267" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="630" y="61" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text></svg></div>
          <table class="t"><tr><th>$\delta$</th><th>đọc 0</th><th>đọc 1</th></tr>
          <tr><td>$q_0$</td><td>$q_0$</td><td>$q_1$</td></tr><tr><td>$q_1$</td><td>$q_2$</td><td>$q_0$</td></tr>
          <tr><td>$q_2$</td><td>$q_1$</td><td>$q_2$</td></tr></table>
        focus: [1, 2, "2.3", 2]
        say: "Từ công thức đó ta điền được bảng chuyển. Ví dụ ở q 1, đọc 0 được 2 nhân 1 cộng 0 bằng 2, nên sang q 2. Ở q 2, đọc 1 được 2 nhân 2 cộng 1 bằng 5, dư 2, nên đứng yên ở q 2. Mỗi ô của bảng là một mũi tên trong hình, tổng cộng 6 mũi tên."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chạy máy trên 110 và 111"
    checks:
      - "alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '110') == (True, [0, 1, 0, 0])"
      - "alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '111') == (False, [0, 1, 0, 1])"
      - "6 % 3 == 0 and 7 % 3 == 1"
      - "[2 * 0 + 1, 2 * 1 + 1, 2 * 0 + 0] == [1, 3, 0] and 3 % 3 == 0 and 7 == 2 * 3 + 1"
    steps:
      - show: |
          <p><b>Bước 1.</b> Chạy trên $110$, mỗi dòng tra một ô của bảng chuyển:</p>
          <table class="t"><tr><th>đang ở</th><th>đọc</th><th>tính $2r + b$</th><th>sang</th></tr>
          <tr><td>$q_0$</td><td>1</td><td>$2 \times 0 + 1 = 1$</td><td>$q_1$</td></tr>
          <tr><td>$q_1$</td><td>1</td><td>$2 \times 1 + 1 = 3$, dư 0</td><td>$q_0$</td></tr>
          <tr><td>$q_0$</td><td>0</td><td>$2 \times 0 + 0 = 0$</td><td>$q_0$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước một, chạy trên 1 1 0, mỗi dòng tra một ô của bảng chuyển. Từ q 0 đọc 1, được 2 nhân 0 cộng 1 bằng 1, sang q 1. Ở q 1 đọc 1, được 2 nhân 1 cộng 1 bằng 3, chia 3 dư 0, nên về q 0. Ở q 0 đọc 0, được 0, đứng yên ở q 0."
      - show: |
          <p><b>Bước 2.</b> $110$: $q_0 \xrightarrow{1} q_1 \xrightarrow{1} q_0 \xrightarrow{0} q_0$. Hết chuỗi ở $q_0$ → <b>nhận</b>. Đúng: $6 = 2 \times 3$.</p>
        say: "Bước hai, hết chuỗi máy đứng ở q 0, là trạng thái nhận, nên máy nhận 1 1 0. Kết luận này đúng vì 6 bằng 2 nhân 3."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Chạy trên $111$:</p>
          <table class="t"><tr><th>đang ở</th><th>đọc</th><th>tính $2r + b$</th><th>sang</th></tr>
          <tr><td>$q_0$</td><td>1</td><td>$2 \times 0 + 1 = 1$</td><td>$q_1$</td></tr>
          <tr><td>$q_1$</td><td>1</td><td>$2 \times 1 + 1 = 3$, dư 0</td><td>$q_0$</td></tr>
          <tr><td>$q_0$</td><td>1</td><td>$2 \times 0 + 1 = 1$</td><td>$q_1$</td></tr></table>
        focus: [1, "2.2", "2.4"]
        say: "Bước ba, chạy máy trên chuỗi 1 1 1 theo cùng cách. Hai bit đầu giống hệt lần trước, máy đi q 1 rồi về q 0. Bit cuối là 1, nên từ q 0 máy sang q 1."
      - show: |
          <p><b>Bước 4.</b> $111$: $q_0 \xrightarrow{1} q_1 \xrightarrow{1} q_0 \xrightarrow{1} q_1$. Hết chuỗi ở $q_1$ → <b>từ chối</b>. Đúng: $7 = 2 \times 3 + 1$.</p>
          <div class="box key">Trạng thái máy đứng sau mỗi bước chính là <b>số dư</b> của phần đã đọc: sau $11$ là $q_0$ vì $3 \bmod 3 = 0$.</div>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, máy đi qua q 1, q 0 rồi dừng ở q 1, nên từ chối, đúng vì 7 chia 3 dư 1. Hai lần chạy đều ghé q 0 sau hai bit đầu. Để ý trạng thái máy đứng sau mỗi bước chính là số dư của phần đã đọc. Ví dụ sau hai bit 1 1, máy ở q 0, vì 3 chia 3 dư 0."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "all(alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, format(n, 'b'))[0] == (n % 3 == 0) for n in range(1, 2000))"
      - "alg.dfa_complete({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, {0, 1, 2}, '01')"
      - "alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '1101') == (False, [0, 1, 0, 0, 1])"
      - "int('1101', 2) == 8 + 4 + 0 + 1 == 13 and 13 % 3 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>nội dung</th></tr>
          <tr><td><b>Đầy đủ</b></td><td>3 trạng thái × 2 ký hiệu = 6 chuyển, mỗi ô của bảng đúng một trạng thái</td></tr>
          <tr><td><b>Đối chiếu</b></td><td>máy chạy thử mọi số từ 1 đến 1999 — kết quả trùng phép chia lấy dư mọi lần</td></tr>
          <tr><td><b>Bất biến</b></td><td>sau mỗi bước, chỉ số của trạng thái = số dư của phần đã đọc</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, kiểm đầy đủ, vì có 3 trạng thái và 2 ký hiệu nên cần 6 chuyển, mỗi ô của bảng có đúng một trạng thái. Hai, đối chiếu, cho máy chạy thử mọi số từ 1 đến 1999, kết quả trùng phép chia lấy dư mọi lần. Ba, kiểm bất biến, sau mỗi bước chỉ số của trạng thái bằng số dư của phần đã đọc."
      - clear: true
        show: |
          <p>Làm thử đối chiếu bằng tay với $1101$, chuỗi đã gặp lúc thiết kế, theo <b>hai đường</b>:</p>
          <table class="t"><tr><th>đường</th><th>tính</th><th>kết luận</th></tr>
          <tr><td>chạy máy</td><td>$q_0 \xrightarrow{1} q_1 \xrightarrow{1} q_0 \xrightarrow{0} q_0 \xrightarrow{1} q_1$</td><td>dư 1, từ chối</td></tr>
          <tr><td>đổi ra số rồi chia</td><td>$8 + 4 + 0 + 1 = 13 = 4 \times 3 + 1$</td><td>dư 1 ✓</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Làm thử một lần đối chiếu bằng tay, với chuỗi 1 1 0 1 đã gặp lúc thiết kế, theo hai đường khác nhau. Đường thứ nhất là chạy máy, đi q 1, q 0, q 0 rồi dừng ở q 1, tức dư 1, nên từ chối. Đường thứ hai không dùng máy, đổi ra số, 8 cộng 4 cộng 0 cộng 1 bằng 13, bằng 4 nhân 3 cộng 1, cũng dư 1. Hai đường cho cùng số dư, nên kết quả khớp nhau."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thiếu chuyển hoặc có hai chuyển cùng nhãn <b class="red">(không còn là DFA)</b>
          <br><span class="note">Ở mỗi trạng thái, mỗi ký hiệu phải có <b>đúng một</b> mũi tên đi ra.</span></div>
        say: "Lỗi thứ nhất, thiếu chuyển, hoặc có hai chuyển cùng nhãn. Khi đó máy không còn là ô-tô-mát đơn định, vì ở mỗi trạng thái, mỗi ký hiệu phải có đúng một mũi tên đi ra."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dừng ngay khi chạm trạng thái nhận <b class="red">(sai)</b>
          <br><span class="note">Máy luôn đọc <b>hết</b> chuỗi; chỉ trạng thái cuối cùng quyết định. $111$ đi qua $q_0$ nhưng vẫn bị từ chối.</span></div>
          <table class="t"><tr><th>đã đọc</th><th>1</th><th>11</th><th>111</th></tr><tr><td>trạng thái</td><td>$q_1$</td><td>$q_0$ (nhận, nhưng chưa hết)</td><td>$q_1$ → từ chối</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, dừng ngay khi chạm trạng thái nhận. Máy luôn đọc hết chuỗi, chỉ trạng thái cuối cùng mới quyết định, ví dụ 1 1 1 có đi qua q 0 nhưng vẫn bị từ chối."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên chuỗi rỗng <b class="red">(thiếu)</b>
          <br><span class="note">Máy nhận $\varepsilon$ vì $q_0$ vừa là trạng thái đầu vừa là trạng thái nhận. Muốn bỏ $\varepsilon$ thì phải thêm trạng thái.</span></div>
        say: "Lỗi thứ ba là quên kiểm tra chuỗi rỗng, chuỗi không có ký hiệu nào. Máy này nhận chuỗi rỗng, vì q 0 vừa là trạng thái đầu vừa là trạng thái nhận. Muốn bỏ chuỗi rỗng ra thì phải thêm trạng thái."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ máy nhớ được cả số đã đọc <b class="red">(sai)</b>
          <br><span class="note">Bộ nhớ chỉ là trạng thái hiện tại: 3 trạng thái thì nhớ được đúng 3 khả năng. Thiết kế = chọn điều tối thiểu cần nhớ.</span></div>
        say: "Lỗi thứ tư, nghĩ máy nhớ được cả số đã đọc. Bộ nhớ của máy chỉ là trạng thái hiện tại, 3 trạng thái thì nhớ được đúng 3 khả năng, nên thiết kế là chọn điều tối thiểu cần nhớ."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '1001') == (True, [0, 1, 2, 1, 0])"
      - "alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '1010') == (False, [0, 1, 2, 2, 1])"
      - "int('1001', 2) == 9 and int('1010', 2) == 10 and 10 % 3 == 1"
      - "[2 * 0 + 1, 2 * 1 + 0, (2 * 2 + 0) % 3, (2 * 1 + 1) % 3] == [1, 2, 1, 0] and 2 * 2 + 0 == 4 and 2 * 1 + 1 == 3"
      - "2 * 2 + 1 == 5 and 5 % 3 == 2 and 4 % 3 == 1"
    steps:
      - show: |
          <div><svg width="760" height="330" viewBox="0 0 760 330"><defs><marker id="a3" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#374151"/></marker></defs><path d="M130,140 C96,57 204,57 170,140" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M182,151 Q270,83 356,149" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M358,199 Q270,267 184,201" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M422,151 Q510,83 596,149" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M598,199 Q510,267 424,201" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><path d="M610,140 C576,57 684,57 650,140" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><line x1="48" y1="175" x2="106" y2="175" stroke="#374151" stroke-width="3.5" marker-end="url(#a3)"/><circle cx="150" cy="175" r="40" fill="#dcfce7" stroke="#2563eb" stroke-width="3.5"/><circle cx="150" cy="175" r="32" fill="none" stroke="#2563eb" stroke-width="3"/><text x="150" y="185" font-size="30" text-anchor="middle" font-style="italic" font-family="KaTeX_Math, serif">q<tspan font-size="21" dy="8" font-style="normal" font-family="KaTeX_Main, serif">0</tspan></text><circle cx="390" cy="175" r="40" fill="#eff6ff" stroke="#2563eb" stroke-width="3.5"/><text x="390" y="185" font-size="30" text-anchor="middle" font-style="italic" font-family="KaTeX_Math, serif">q<tspan font-size="21" dy="8" font-style="normal" font-family="KaTeX_Main, serif">1</tspan></text><circle cx="630" cy="175" r="40" fill="#eff6ff" stroke="#2563eb" stroke-width="3.5"/><text x="630" y="185" font-size="30" text-anchor="middle" font-style="italic" font-family="KaTeX_Math, serif">q<tspan font-size="21" dy="8" font-style="normal" font-family="KaTeX_Main, serif">2</tspan></text><text x="150" y="61" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="269" y="101" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="271" y="267" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="509" y="101" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="511" y="267" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="630" y="61" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text></svg></div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chạy máy trên $1001$: đi qua những trạng thái nào, nhận hay từ chối?</td></tr>
          <tr><td>2</td><td>Chạy trên $1010$.</td></tr></table>
        focus: [0, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chạy máy trên chuỗi 1 0 0 1, máy đi qua những trạng thái nào, và nhận hay từ chối? Câu hai, chạy trên chuỗi 1 0 1 0. Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <table class="t"><tr><th>đang ở</th><th>đọc</th><th>$2r + b$</th><th>sang</th></tr>
          <tr><td>$q_0$</td><td>1</td><td>1</td><td>$q_1$</td></tr><tr><td>$q_1$</td><td>0</td><td>2</td><td>$q_2$</td></tr>
          <tr><td>$q_2$</td><td>0</td><td>4, dư 1</td><td>$q_1$</td></tr><tr><td>$q_1$</td><td>1</td><td>3, dư 0</td><td>$q_0$</td></tr></table>
          <p>① $q_0 \xrightarrow{1} q_1 \xrightarrow{0} q_2 \xrightarrow{0} q_1 \xrightarrow{1} q_0$: <b>nhận</b>; đúng vì $1001$ là $\hl{9}$.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Đáp án câu một, ta tra từng ô của bảng chuyển. Từ q 0 đọc 1 được 1, sang q 1. Ở q 1 đọc 0 được 2, sang q 2. Ở q 2 đọc 0 được 4, chia 3 dư 1, về q 1. Ở q 1 đọc 1 được 3, dư 0, về q 0. Máy dừng ở q 0 nên nhận, đúng vì 1 0 0 1 là số 9."
      - clear: true
        show: |
          <table class="t"><tr><th>đang ở</th><th>đọc</th><th>$2r + b$</th><th>sang</th></tr>
          <tr><td>$q_0$</td><td>1</td><td>1</td><td>$q_1$</td></tr><tr><td>$q_1$</td><td>0</td><td>2</td><td>$q_2$</td></tr>
          <tr><td>$q_2$</td><td>1</td><td>5, dư 2</td><td>$q_2$</td></tr><tr><td>$q_2$</td><td>0</td><td>4, dư 1</td><td>$q_1$</td></tr></table>
          <p>② $q_0 \xrightarrow{1} q_1 \xrightarrow{0} q_2 \xrightarrow{1} q_2 \xrightarrow{0} q_1$: <b>từ chối</b>; $1010$ là $\hl{10}$, chia 3 dư 1.</p>
        focus: ["1.2", "1.4", "1.5", 2]
        say: "Câu hai, hai bit đầu giống câu một, máy đi q 1 rồi q 2. Ở q 2 đọc 1 được 5, chia 3 dư 2, nên đứng yên ở q 2. Ở q 2 đọc 0 được 4, dư 1, sang q 1. Máy dừng ở q 1 nên từ chối, vì 1 0 1 0 là số 10, chia 3 dư 1."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">trạng thái = điều máy nhớ</span><span class="a">→</span>
          <span class="n">mỗi ký hiệu: đúng một chuyển</span><span class="a">→</span>
          <span class="n">đọc hết chuỗi</span><span class="a">→</span>
          <span class="n">trạng thái cuối nhận?</span></div>
        say: "Tổng kết lại, trạng thái là điều máy nhớ, mỗi trạng thái có đúng một chuyển cho mỗi ký hiệu, máy đọc hết chuỗi, và trạng thái cuối cùng quyết định nhận hay từ chối."
      - show: |
          <div class="box key"><b>Tư duy:</b> thiết kế máy bắt đầu bằng câu hỏi “sau khi đọc một phần chuỗi, cần nhớ <b>ít nhất</b> điều gì để trả lời được?”.</div>
        say: "Điều cần mang theo, thiết kế máy bắt đầu bằng câu hỏi, sau khi đọc một phần chuỗi, cần nhớ ít nhất điều gì để vẫn trả lời được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): máy được phép <b>đoán</b> — ôtômat không đơn định, và phép dựng tập con đổi nó về máy đơn định.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta cho máy được phép đoán, gọi là ô-tô-mát không đơn định, và học phép dựng tập con để đổi nó về máy đơn định. Hẹn gặp bạn ở bài tiếp theo."
