  - show: <table class='t'><tr><th>Thực hành TOC:L01</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Dựng DFA chia hết cho m và kiểm tra các chuỗi nhị phân</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>5|1010 1011 1999</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh TOC L01 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
