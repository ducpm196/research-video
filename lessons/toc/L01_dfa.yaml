    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (1 dòng)</b></p><div class="code"><div>states=5 complete=1 s1010=1 s1011=0 all_2000=1</div></div>
    say: Màn hình hiện 1 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">trạng thái = điều máy nhớ</span><span class="a">→</span>

      <span class="n">mỗi ký hiệu: đúng một chuyển</span><span class="a">→</span>

      <span class="n">đọc hết chuỗi</span><span class="a">→</span>

      <span class="n">trạng thái cuối nhận?</span></div>

      '
    say: Tổng kết lại, trạng thái là điều máy nhớ, mỗi trạng thái có đúng một chuyển cho mỗi ký hiệu, máy đọc hết chuỗi, và trạng thái cuối cùng quyết định nhận hay từ chối. Điểm mạnh nổi bật của máy trạng thái hữu hạn đơn định là bộ nhớ chỉ đúng bằng một trạng thái hiện tại, dù chuỗi vào dài hàng tỉ ký tự. Mỗi bước đọc ký tự chỉ tra bảng chuyển đúng một lần trong thời gian hằng số cực nhanh.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - show: '<div class="chain"><span class="n">trạng thái = điều máy nhớ</span><span class="a">→</span>

      <span class="n">mỗi ký hiệu: đúng một chuyển</span><span class="a">→</span>

      <span class="n">đọc hết chuỗi</span><span class="a">→</span>

      <span class="n">trạng thái cuối nhận?</span></div>

      '
    say: Chính vì tính tất định và chi phí cố định đó, máy hữu hạn là xương sống của phần cứng mạng tốc độ cao, bộ phân tích từ vựng trình biên dịch và giao thức truyền thông. Nhớ kỹ điều kiện mỗi trạng thái phải định nghĩa đủ mũi tên cho toàn bộ bảng chữ cái để tránh treo máy khi gặp ký tự bất ngờ.
    focus:
    - '1.1'
    - '1.2'
