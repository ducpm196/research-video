source: "curriculum/toc.yaml L08; audit/toc/verify_toc.py L08; M. Sipser, mục 2.2 (định lý 2.20: PDA tương đương văn phạm phi ngữ cảnh); S. Ginsburg, S. Greibach (1966) về PDA đơn định"
assumes: [arith, sub, set, alpha, eps, strpow, prod, alt, dots]
# Quy ước: PDA chỉ trên màn hình; lời đọc nói “ô-tô-mát đẩy xuống” hoặc “máy có ngăn xếp”. Ngăn xếp in thành dãy X, ĐÁY BÊN TRÁI,
#   đỉnh bên phải; “rỗng” khi không còn X. Mọi vết và lý do từ chối do alg.pda_0n1n tính; máy được so với 0ⁿ1ⁿ trên mọi chuỗi tới độ dài 12.
objectives:
  - "Hiểu ôtômat đẩy xuống = ôtômat hữu hạn + một ngăn xếp"
  - "Chạy PDA nhận 0ⁿ1ⁿ và ghi vết ngăn xếp"
  - "Biết PDA tương đương văn phạm phi ngữ cảnh, và PDA không đơn định mạnh hơn PDA đơn định"
