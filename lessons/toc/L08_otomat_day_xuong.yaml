scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thêm một chồng đĩa"
    steps:
      - show: |
          <p>Ôtômat hữu hạn thua $\{0^n 1^n\}$ vì không đếm được. Đưa cho nó một <b>chồng đĩa</b>: đọc 0 thì đặt một đĩa lên, đọc 1 thì lấy một đĩa xuống.</p>
          <p>Hết chuỗi mà vừa hết đĩa — số 0 bằng số 1.</p>
          <div class="box key">Hôm nay: ôtômat đẩy xuống — bộ nhớ không giới hạn nhưng chỉ chạm được vào <b>đỉnh</b>, và nó mạnh đúng bằng văn phạm phi ngữ cảnh.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ô-tô-mát hữu hạn thua ngôn ngữ n chữ 0 rồi n chữ 1, vì nó không đếm được. Giờ đưa cho nó một chồng đĩa, đọc 0 thì đặt một đĩa lên, đọc 1 thì lấy một đĩa xuống. Hết chuỗi mà vừa hết đĩa, tức là số chữ 0 bằng số chữ 1. Hôm nay ta học ô-tô-mát đẩy xuống, có bộ nhớ không giới hạn nhưng chỉ chạm được vào đỉnh, và nó mạnh đúng bằng văn phạm phi ngữ cảnh."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: vì sao máy hữu hạn không đếm được, và chồng đĩa"
    checks:
      - "len(['0', '00', '000', '0000']) == 4 and 4 > 3"
      - "(lambda s: (s.append('A'), s.append('B'), s.pop())[2] == 'B' and s == ['A'])([])"
    steps:
      - show: |
          <p>Ở bài 4: không ôtômat hữu hạn nào nhận $\{0^n 1^n\}$. Nhìn lại bằng cách đếm, với một máy chỉ có 3 trạng thái:</p>
          <table class="t"><tr><th>đã đọc</th><th>$0$</th><th>$00$</th><th>$000$</th><th>$0000$</th></tr>
          <tr><td>trạng thái</td><td colspan="4">4 chuỗi, chỉ 3 trạng thái → có hai chuỗi rơi vào <b>cùng</b> một trạng thái</td></tr></table>
        focus: [1, 2, 2]
        say: "Ở bài 4, bổ đề bơm cho thấy không ô-tô-mát hữu hạn nào nhận được ngôn ngữ n chữ 0 rồi n chữ 1. Hãy nhìn lại điều đó bằng cách đếm, với một máy chỉ có 3 trạng thái. Đọc 4 chuỗi 0, 0 0, 0 0 0 và 0 0 0 0, mà máy chỉ có 3 trạng thái, nên có hai chuỗi rơi vào cùng một trạng thái."
      - show: |
          <div class="box key">Giả sử $0^i$ và $0^j$ với $i \ne j$ cùng một trạng thái. Đọc tiếp $1^i$, hai lần chạy đi cùng một đường: máy nhận $0^i 1^i$ thì cũng nhận $0^j 1^i$ — sai. Máy cần bộ nhớ <b>lớn dần</b> theo $n$.</div>
        say: "Giả sử 0 mũ i và 0 mũ j, với i khác j, rơi vào cùng một trạng thái. Đọc tiếp i chữ 1 thì hai lần chạy đi cùng một đường. Vì vậy nếu máy nhận 0 mũ i 1 mũ i, nó cũng nhận 0 mũ j 1 mũ i, mà chuỗi này không thuộc ngôn ngữ. Vậy máy cần một bộ nhớ lớn dần theo n, không bị giới hạn bởi số trạng thái."
      - show: |
          <table class="t"><tr><th>thao tác</th><th>chồng đĩa (đáy bên trái)</th></tr>
          <tr><td>đặt A</td><td>A</td></tr>
          <tr><td>đặt B</td><td>A B</td></tr>
          <tr><td>lấy ra</td><td>A — đĩa lấy ra là <b>B</b>, đĩa đặt sau cùng</td></tr></table>
        focus: [0, "1.3", "1.4"]
        say: "Bộ nhớ đó là một chồng đĩa, đĩa đặt sau cùng thì lấy ra trước tiên. Đặt đĩa A thì chồng có A, đặt tiếp đĩa B lên trên thì chồng có A rồi B. Lấy ra một đĩa thì đó là B, đĩa đặt sau cùng, và chồng còn lại A."

  - id: sym
    kind: symbol
    title: "Giải mã: ngăn xếp và một bước chuyển"
    steps:
      - show: |
          <table class="t"><tr><th>thao tác</th><th>nghĩa</th></tr>
          <tr><td><b>đẩy</b> X</td><td>đặt X lên đỉnh ngăn xếp</td></tr>
          <tr><td><b>lấy</b> X</td><td>bỏ X đang ở đỉnh — chỉ được khi đỉnh đúng là X</td></tr>
          <tr><td><b>bước chuyển</b></td><td>dựa vào (trạng thái, ký hiệu đọc, ký hiệu ở đỉnh) → sang trạng thái mới, và đẩy hoặc lấy</td></tr></table>
          <div class="box">Trong bài, ngăn xếp in thành dãy X, <b>đáy bên trái</b>, đỉnh bên phải. Ví dụ <code>XX</code> là hai đĩa.</div>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Một ô-tô-mát đẩy xuống có thêm một ngăn xếp với hai thao tác. Đẩy X là đặt X lên đỉnh. Lấy X là bỏ X đang ở đỉnh, và chỉ làm được khi đỉnh đúng là X. Mỗi bước chuyển dựa vào trạng thái, ký hiệu đang đọc và ký hiệu ở đỉnh, rồi sang trạng thái mới, kèm một lần đẩy hoặc lấy. Trong bài, ngăn xếp in thành dãy chữ X, đáy bên trái, đỉnh bên phải."

  # ───────────────────────── 3. MÁY 0ⁿ1ⁿ ─────────────────────────
  - id: machine
    kind: concept
    title: "Máy nhận {0ⁿ1ⁿ}"
    steps:
      - show: |
          <ol><li><b>Pha đọc 0:</b> mỗi chữ 0 → đẩy X.</li>
          <li><b>Pha đọc 1:</b> mỗi chữ 1 → lấy X. Gặp 0 sau khi đã có 1 → từ chối.</li>
          <li>Đọc 1 mà ngăn xếp rỗng → từ chối (nhiều 1 hơn 0).</li>
          <li>Hết chuỗi: ngăn xếp rỗng → <b>nhận</b>; còn X → từ chối (nhiều 0 hơn 1).</li></ol>
        focus: ["1.1", "1.2", "1.2", "1.3", "1.4"]
        say: "Máy cho ngôn ngữ này có hai pha. Pha đầu, mỗi chữ 0 thì đẩy một X. Pha sau, mỗi chữ 1 thì lấy một X ra, và nếu gặp chữ 0 sau khi đã có chữ 1 thì từ chối. Đọc chữ 1 mà ngăn xếp đã rỗng thì từ chối, vì có nhiều chữ 1 hơn chữ 0. Hết chuỗi mà ngăn xếp rỗng thì nhận, còn sót X thì từ chối, vì nhiều chữ 0 hơn."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nhìn ngăn xếp cao lên rồi thấp xuống"
    steps:
      - show: |
          <div><svg width="1180" height="400" viewBox="0 0 1180 400"><defs><marker id="pk8" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#374151"/></marker></defs><path d="M60,150 L60,320 L160,320 L160,150" fill="none" stroke="#374151" stroke-width="4"/><text x="110" y="300" font-size="24" text-anchor="middle" fill="#6b7280">rỗng</text><text x="110" y="370" font-size="28" font-weight="700" text-anchor="middle">chưa đọc</text><path d="M300,150 L300,320 L400,320 L400,150" fill="none" stroke="#374151" stroke-width="4"/><rect x="308" y="268" width="84" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="350" y="303" font-size="30" font-weight="700" text-anchor="middle" fill="#1d4ed8">X</text><text x="350" y="370" font-size="28" font-weight="700" text-anchor="middle">0</text><path d="M540,150 L540,320 L640,320 L640,150" fill="none" stroke="#374151" stroke-width="4"/><rect x="548" y="268" width="84" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="590" y="303" font-size="30" font-weight="700" text-anchor="middle" fill="#1d4ed8">X</text><rect x="548" y="212" width="84" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="590" y="247" font-size="30" font-weight="700" text-anchor="middle" fill="#1d4ed8">X</text><text x="590" y="370" font-size="28" font-weight="700" text-anchor="middle">00</text><path d="M780,150 L780,320 L880,320 L880,150" fill="none" stroke="#374151" stroke-width="4"/><rect x="788" y="268" width="84" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="830" y="303" font-size="30" font-weight="700" text-anchor="middle" fill="#1d4ed8">X</text><text x="830" y="370" font-size="28" font-weight="700" text-anchor="middle">001</text><path d="M1020,150 L1020,320 L1120,320 L1120,150" fill="none" stroke="#374151" stroke-width="4"/><text x="1070" y="300" font-size="24" text-anchor="middle" fill="#6b7280">rỗng</text><text x="1070" y="370" font-size="28" font-weight="700" text-anchor="middle">0011</text><line x1="170" y1="240" x2="288" y2="240" stroke="#1d4ed8" stroke-width="4" marker-end="url(#pk8)"/><text x="229" y="200" font-size="24" text-anchor="middle" fill="#1d4ed8">đọc 0</text><text x="229" y="226" font-size="24" font-weight="700" text-anchor="middle" fill="#1d4ed8">đẩy X</text><line x1="410" y1="240" x2="528" y2="240" stroke="#1d4ed8" stroke-width="4" marker-end="url(#pk8)"/><text x="469" y="200" font-size="24" text-anchor="middle" fill="#1d4ed8">đọc 0</text><text x="469" y="226" font-size="24" font-weight="700" text-anchor="middle" fill="#1d4ed8">đẩy X</text><line x1="650" y1="240" x2="768" y2="240" stroke="#b45309" stroke-width="4" marker-end="url(#pk8)"/><text x="709" y="200" font-size="24" text-anchor="middle" fill="#b45309">đọc 1</text><text x="709" y="226" font-size="24" font-weight="700" text-anchor="middle" fill="#b45309">lấy X</text><line x1="890" y1="240" x2="1008" y2="240" stroke="#b45309" stroke-width="4" marker-end="url(#pk8)"/><text x="949" y="200" font-size="24" text-anchor="middle" fill="#b45309">đọc 1</text><text x="949" y="226" font-size="24" font-weight="700" text-anchor="middle" fill="#b45309">lấy X</text><text x="590" y="60" font-size="26" text-anchor="middle" fill="#374151">chỉ chạm được ô trên cùng (đỉnh)</text></svg></div>
          <p>Chiều cao ngăn xếp = số chữ 0 đã đọc trừ số chữ 1 đã đọc. Về 0 đúng lúc hết chuỗi → nhận.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Hình vẽ ngăn xếp sau mỗi ký hiệu của chuỗi 0 0 1 1, đáy ở dưới, đỉnh ở trên. Mỗi chữ 0 đặt thêm một X lên đỉnh, nên cột cao dần lên 1 rồi 2. Mỗi chữ 1 lấy một X ở đỉnh ra, nên cột thấp dần về 1 rồi rỗng. Vì vậy chiều cao ngăn xếp luôn bằng số chữ 0 đã đọc trừ số chữ 1 đã đọc. Chiều cao về 0 đúng lúc hết chuỗi thì máy nhận."

  - id: example
    kind: example
    title: "Ghi vết ngăn xếp"
    checks:
      - "alg.pda_0n1n('0011') == (True, [('0', 'X'), ('0', 'XX'), ('1', 'X'), ('1', '')], 'ngăn xếp rỗng')"
      - "alg.pda_0n1n('0010')[0] is False and alg.pda_0n1n('0010')[2] == '0 sau 1'"
      - "alg.pda_0n1n('011')[2] == 'lấy từ ngăn rỗng' and alg.pda_0n1n('001')[2] == 'còn X'"
    steps:
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 1</td><td style="width:40%">đọc 0 thứ nhất, pha đọc 0</td><td style="width:22%">đẩy X</td><td><code>X</code>, cao 1</td></tr></table>
        say: "Ghi vết trên chuỗi 0 0 1 1. Bước một, đọc chữ 0 thứ nhất, máy đang ở pha đọc 0 nên đẩy một X, ngăn xếp cao 1."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 2</td><td style="width:40%">đọc 0 thứ hai</td><td style="width:22%">đẩy X</td><td><code>XX</code>, cao 2</td></tr></table>
        say: "Bước hai, đọc chữ 0 thứ hai, vẫn trong pha đọc 0, nên đẩy thêm một X, ngăn xếp cao 2."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 3</td><td style="width:40%">đọc 1 thứ nhất, sang pha đọc 1</td><td style="width:22%">lấy X</td><td><code>X</code>, cao 1</td></tr></table>
        say: "Bước ba, đọc chữ 1 thứ nhất, máy sang pha đọc 1, đỉnh đang là X nên lấy ra được, ngăn xếp còn cao 1."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 4</td><td style="width:40%">đọc 1 thứ hai</td><td style="width:22%">lấy X</td><td>rỗng, cao 0</td></tr></table>
        say: "Bước bốn, đọc chữ 1 thứ hai, đỉnh vẫn là X nên lấy ra, và ngăn xếp rỗng."
      - show: |
          <p>Hết chuỗi, ngăn xếp rỗng → <b>nhận</b> $0011$.</p>
        say: "Hết chuỗi đúng lúc ngăn xếp rỗng, nên máy nhận chuỗi 0 0 1 1."
      - clear: true
        show: |
          <table class="t"><tr><th>chuỗi</th><th>lý do từ chối</th></tr>
          <tr><td>$0010$</td><td>chữ 0 thứ ba đến <b>sau</b> chữ 1</td></tr>
          <tr><td>$011$</td><td>chữ 1 thứ hai đọc khi ngăn xếp đã rỗng</td></tr>
          <tr><td>$001$</td><td>hết chuỗi mà còn <code>X</code></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ba trường hợp từ chối, mỗi cái một lý do. Chuỗi 0 0 1 0 có chữ 0 đến sau chữ 1. Chuỗi 0 1 1 đọc chữ 1 thứ hai khi ngăn xếp đã rỗng. Còn chuỗi 0 0 1 hết mà vẫn còn một X."

  # ───────────────────────── 5. TƯƠNG ĐƯƠNG ─────────────────────────
  - id: equiv
    kind: concept
    title: "PDA ⇄ văn phạm, và vai trò của việc đoán"
    steps:
      - show: |
          <div class="box key">Một ngôn ngữ có văn phạm phi ngữ cảnh <b>khi và chỉ khi</b> có ôtômat đẩy xuống (không đơn định) nhận nó.</div>
          <p>Khác với ôtômat hữu hạn, ở đây <b>đoán có ích</b>: các chuỗi đối xứng như $0110$, $1001$ cần đoán đâu là điểm giữa. PDA không đơn định làm được, PDA đơn định thì không.</p>
          <p class="note">Bộ phân tích cú pháp của trình biên dịch dùng các văn phạm đủ “đẹp” để chạy đơn định, nhanh và không phải đoán.</p>
        focus: [1, 2, 2, 3]
        say: "Định lý quan trọng của bài, một ngôn ngữ có văn phạm phi ngữ cảnh khi và chỉ khi có ô-tô-mát đẩy xuống không đơn định nhận nó. Khác với ô-tô-mát hữu hạn, ở đây việc đoán thật sự có ích. Các chuỗi đối xứng như 0 1 1 0 cần đoán đâu là điểm giữa để bắt đầu lấy ra, máy không đơn định làm được, còn máy đơn định thì không. Vì vậy bộ phân tích cú pháp của trình biên dịch dùng các văn phạm đủ gọn để chạy đơn định, nhanh và không phải đoán."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "all(alg.pda_0n1n(w)[0] == (w == '0' * (len(w) // 2) + '1' * (len(w) // 2)) for w in alg.strings('01', 12))"
      - "len(alg.strings('01', 12)) == 8191"
      - "[w[:k].count('0') - w[:k].count('1') for w in ['0011'] for k in range(1, 5)] == [1, 2, 1, 0] == [len(s) for _, s in alg.pda_0n1n('0011')[1]]"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>nội dung</th></tr>
          <tr><td><b>Bất biến</b></td><td>trong pha đọc 1, số X còn lại = (số 0) − (số 1 đã đọc)</td></tr>
          <tr><td><b>Mỗi lý do từ chối</b></td><td>ứng với một cách vi phạm: 0 sau 1, thừa 1, thừa 0</td></tr>
          <tr><td><b>Đối chiếu</b></td><td>máy chạy trên cả 8191 chuỗi độ dài tới 12 — nhận đúng các chuỗi $0^n 1^n$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, giữ bất biến, trong pha đọc 1, số X còn lại bằng số chữ 0 trừ số chữ 1 đã đọc. Hai, mỗi lý do từ chối ứng với đúng một cách vi phạm, 0 sau 1, thừa chữ 1, hoặc thừa chữ 0. Ba, đối chiếu, cho máy chạy trên cả 8191 chuỗi độ dài tới 12, nó nhận đúng các chuỗi n chữ 0 rồi n chữ 1."
      - clear: true
        show: |
          <p>Đường khác: không chạy máy, chỉ <b>đếm</b> trên từng đoạn đầu của $0011$, chiều cao = số 0 trừ số 1.</p>
          <table class="t"><tr><th>đoạn đầu</th><th>$0$</th><th>$00$</th><th>$001$</th><th>$0011$</th></tr>
          <tr><td>số 0 trừ số 1</td><td>$1 - 0 = 1$</td><td>$2 - 0 = 2$</td><td>$2 - 1 = 1$</td><td>$2 - 2 = 0$</td></tr>
          <tr><td>vết khi chạy máy</td><td><code>X</code></td><td><code>XX</code></td><td><code>X</code></td><td>rỗng</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Bây giờ kiểm bằng một đường khác, không chạy máy mà chỉ đếm trên từng đoạn đầu của chuỗi 0 0 1 1. Đoạn 0 cho 1 trừ 0 bằng 1, đoạn 0 0 cho 2 trừ 0 bằng 2. Đoạn 0 0 1 cho 2 trừ 1 bằng 1, và cả chuỗi cho 2 trừ 2 bằng 0. Dãy 1, 2, 1, 0 khớp đúng chiều cao trong vết của máy, và về 0 ở cuối nên máy nhận."
  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.pda_0n1n('0101')[1][:2] == [('0', 'X'), ('1', '')] and alg.pda_0n1n('0101')[0] is False"
      - "alg.pda_0n1n('0101')[2] == '0 sau 1' and len(alg.pda_0n1n('0101')[1]) == 2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi ngăn xếp là bộ nhớ đọc tuỳ ý <b class="red">(sai)</b>
          <br><span class="note">Chỉ thấy được <b>đỉnh</b>. Muốn xem phần dưới thì phải lấy hết phần trên ra — và mất chúng.</span></div>
        say: "Lỗi thứ nhất, coi ngăn xếp là bộ nhớ đọc tuỳ ý. Máy chỉ thấy được đỉnh, muốn xem phần dưới thì phải lấy hết phần trên ra, và mất chúng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhận ngay khi ngăn xếp rỗng giữa chừng <b class="red">(sai)</b>
          <br><span class="note">Phải đọc <b>hết</b> chuỗi. $0101$ làm ngăn xếp rỗng sau $01$ nhưng vẫn bị từ chối.</span></div>
          <table class="t"><tr><th>đã đọc</th><th>$0$</th><th>$01$</th><th>$010$</th></tr>
          <tr><td>ngăn xếp</td><td><code>X</code></td><td>rỗng</td><td>từ chối: 0 sau 1</td></tr></table>
        focus: [1, 2, 2]
        say: "Lỗi thứ hai, nhận ngay khi ngăn xếp rỗng giữa chừng. Máy phải đọc hết chuỗi, ví dụ 0 1 0 1 làm ngăn xếp rỗng sau hai ký hiệu đầu, nhưng vẫn bị từ chối. Bảng vết cho thấy ký hiệu thứ ba là chữ 0 đến sau chữ 1, nên máy từ chối ngay tại đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ đơn định và không đơn định mạnh như nhau, như ở bài 2 <b class="red">(sai ở đây)</b>
          <br><span class="note">Với ôtômat hữu hạn thì đúng. Với ôtômat đẩy xuống thì không đơn định <b>mạnh hơn</b>: chuỗi đối xứng là ví dụ.</span></div>
        say: "Lỗi thứ ba, nghĩ máy đơn định và không đơn định luôn mạnh như nhau, như kết quả dựng tập con ở bài 2. Điều đó đúng với ô-tô-mát hữu hạn, nhưng với ô-tô-mát đẩy xuống thì máy không đơn định mạnh hơn, ví dụ ở các chuỗi đối xứng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ một ngăn xếp đếm được mọi thứ <b class="red">(sai)</b>
          <br><span class="note">$\{0^n 1^n 2^n\}$ cần so <b>ba</b> khối: một ngăn xếp dùng hết khi so khối đầu với khối thứ hai. Ngôn ngữ này không phi ngữ cảnh.</span></div>
        say: "Lỗi thứ tư, nghĩ một ngăn xếp đếm được mọi thứ. Ngôn ngữ n chữ 0, n chữ 1, rồi n chữ 2 cần so ba khối, mà ngăn xếp đã dùng hết khi so khối đầu với khối thứ hai. Ngôn ngữ này không phi ngữ cảnh."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.pda_0n1n('000111')[0] and max(len(s) for _, s in alg.pda_0n1n('000111')[1]) == 3"
      - "alg.pda_0n1n('00111')[2] == 'lấy từ ngăn rỗng' and len(alg.pda_0n1n('00111')[1]) == 4"
      - "[s for _, s in alg.pda_0n1n('000111')[1]] == ['X', 'XX', 'XXX', 'XX', 'X', '']"
      - "[s for _, s in alg.pda_0n1n('00111')[1]] == ['X', 'XX', 'X', '']"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ghi vết ngăn xếp trên $000111$. Ngăn xếp cao nhất bao nhiêu? Nhận hay từ chối?</td></tr>
          <tr><td>2</td><td>Chạy trên $00111$: dừng ở ký hiệu thứ mấy, vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ghi vết ngăn xếp trên chuỗi 0 0 0 1 1 1, ngăn xếp cao nhất bao nhiêu, và máy nhận hay từ chối? Câu hai, chạy trên chuỗi 0 0 1 1 1, máy dừng ở ký hiệu thứ mấy, và vì sao? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <table class="t"><tr><th>đã đọc</th><th>$0$</th><th>$00$</th><th>$000$</th><th>$0001$</th><th>$00011$</th><th>$000111$</th></tr>
          <tr><td>ngăn xếp</td><td><code>X</code></td><td><code>XX</code></td><td><code>XXX</code></td><td><code>XX</code></td><td><code>X</code></td><td>rỗng</td></tr></table>
          <p>① Cao nhất $\hl{3}$; hết chuỗi đúng lúc rỗng → <b>nhận</b>.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, ba chữ 0 đẩy ba X, ngăn xếp cao lên 1, 2, 3. Ba chữ 1 lấy dần ra, ngăn xếp giảm về 2, 1 rồi rỗng. Vậy cao nhất là 3, và hết chuỗi đúng lúc ngăn xếp rỗng nên máy nhận."
      - show: |
          <table class="t"><tr><th>đã đọc</th><th>$0$</th><th>$00$</th><th>$001$</th><th>$0011$</th><th>ký hiệu thứ 5: $1$</th></tr>
          <tr><td>ngăn xếp</td><td><code>X</code></td><td><code>XX</code></td><td><code>X</code></td><td>rỗng</td><td>không còn X để lấy</td></tr></table>
          <p>② Dừng ở ký hiệu thứ $\hl{5}$ → <b>từ chối</b> (thừa chữ 1).</p>
        focus: [1, 1, 2]
        say: "Câu hai, bốn ký hiệu đầu 0 0 1 1 làm ngăn xếp cao 1, 2, rồi về 1 và rỗng. Sau bốn ký hiệu đầu ngăn xếp đã rỗng, ký hiệu thứ 5 là chữ 1 mà không còn X để lấy. Vì vậy máy dừng ở ký hiệu thứ 5 và từ chối, do có nhiều chữ 1 hơn chữ 0."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ôtômat hữu hạn + ngăn xếp</span><span class="a">→</span>
          <span class="n">đếm được một cặp khối</span><span class="a">→</span>
          <span class="n">tương đương văn phạm</span><span class="a">→</span>
          <span class="n">đoán có ích</span></div>
        say: "Tổng kết lại, ô-tô-mát đẩy xuống là ô-tô-mát hữu hạn cộng một ngăn xếp. Nó đếm được để so một cặp khối, tương đương văn phạm phi ngữ cảnh, và ở đây việc đoán làm máy mạnh hơn."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi lần cho máy thêm một loại bộ nhớ, lớp bài toán giải được mở rộng.</div>
        say: "Điều cần mang theo, mỗi lần cho máy thêm một loại bộ nhớ, lớp bài toán giải được lại mở rộng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): thay ngăn xếp bằng một <b>băng</b> mà <b>đầu đọc</b> đi qua lại tự do — máy Turing, và máy cộng một vào số nhị phân.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta thay ngăn xếp bằng một băng mà đầu đọc đi qua lại tự do, gọi là máy Turing, và chạy một máy cộng một vào số nhị phân. Hẹn gặp bạn ở bài tiếp theo."
