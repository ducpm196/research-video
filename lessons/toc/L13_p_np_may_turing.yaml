scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Khả quyết chưa chắc đã dùng được"
    checks:
      - "2 ** 60 > 10 ** 18"
      - "2 ** 60 / 10 ** 9 / (365 * 24 * 3600) > 30"
    steps:
      - show: |
          <p>Cho 60 số, có tập con nào cộng lại đúng bằng một số cho trước không? Bài toán này <b>khả quyết</b>: thử hết các tập con là xong.</p>
          <p>Nhưng có $2^{60}$ tập con — hơn $10^{18}$. Máy làm một tỉ phép thử mỗi giây vẫn cần hơn 30 năm.</p>
          <div class="box key">Hôm nay: đo <b>số bước</b> của máy Turing — lớp P, lớp NP — và khép lại bức tranh của cả khoá.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, cho 60 số, có tập con nào cộng lại đúng bằng một số cho trước không? Bài toán này khả quyết, cứ thử hết các tập con là xong. Nhưng có 2 mũ 60 tập con, nhiều hơn 10 mũ 18. Một máy làm một tỉ phép thử mỗi giây vẫn cần hơn 30 năm. Hôm nay ta đo số bước của máy Turing, học hai lớp P và NP, rồi khép lại bức tranh của cả khoá."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đếm tập con, đa thức và mũ"
    checks:
      - "alg.subset_sums([3, 4, 5], 9)[1] == 8 == 2 ** 3"
      - "[n ** 2 for n in (10, 20, 60)] == [100, 400, 3600]"
      - "[2 ** n for n in (10, 20)] == [1024, 1048576] and 2 ** 60 > 10 ** 18"
    steps:
      - show: |
          <table class="t"><tr><th>số 3</th><th>số 4</th><th>số 5</th><th>tập con</th></tr>
          <tr><td>lấy</td><td>lấy</td><td>lấy</td><td>$\{3, 4, 5\}$</td></tr>
          <tr><td>lấy</td><td>lấy</td><td>bỏ</td><td>$\{3, 4\}$</td></tr>
          <tr><td colspan="3">… mỗi số 2 lựa chọn …</td><td>…</td></tr>
          <tr><td>bỏ</td><td>bỏ</td><td>bỏ</td><td>tập rỗng</td></tr></table>
          <p>3 số → $2 \times 2 \times 2 = 2^3 = 8$ tập con.</p>
        focus: [1, 1, 1, 2]
        say: "Trước hết, ôn cách đếm tập con, vì cả bài dựa vào nó. Mỗi số có hai lựa chọn, lấy hoặc bỏ, như bảng với ba số 3, 4 và 5. Từ lấy cả ba cho tới bỏ cả ba, các lựa chọn độc lập với nhau. Nên ba số cho 2 nhân 2 nhân 2, bằng 2 mũ 3, bằng 8 tập con."
      - show: |
          <table class="t"><tr><th>độ dài đầu vào $n$</th><th>$n^2$ (đa thức)</th><th>$2^n$ (mũ)</th></tr>
          <tr><td>10</td><td>100</td><td>1024</td></tr>
          <tr><td>20</td><td>400</td><td>1 048 576</td></tr>
          <tr><td>60</td><td>3600</td><td>hơn $10^{18}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ý thứ hai là phân biệt số bước đa thức với số bước mũ. Khi n bằng 10, n bình phương là 100, còn 2 mũ n là 1024. Khi n bằng 20, n bình phương mới là 400, còn 2 mũ n đã hơn một triệu. Khi n bằng 60, n bình phương là 3600, còn 2 mũ n vượt 10 mũ 18, đó là lý do người ta coi đa thức là nhanh."

  - id: sym
    kind: symbol
    title: "Giải mã: P và NP bằng máy Turing"
    steps:
      - show: |
          <table class="t"><tr><th>lớp</th><th>định nghĩa</th></tr>
          <tr><td>$\mathrm{P}$</td><td>quyết định được bằng máy Turing <b>đơn định</b> trong số bước <b>đa thức</b> theo độ dài đầu vào $n$ (cỡ $n$, $n^2$, $n^3$, …)</td></tr>
          <tr><td>$\mathrm{NP}$</td><td>quyết định được bằng máy Turing <b>không đơn định</b> trong số bước đa thức: mỗi bước có thể rẽ nhiều nhánh, nhận nếu <b>có một</b> nhánh nhận</td></tr></table>
          <p class="note">“Không đơn định” giống ôtômat ở bài 2: không có xác suất, chỉ là “tồn tại một nhánh”.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Hai lớp được định nghĩa bằng máy Turing. Lớp P gồm các bài toán quyết định được bằng máy Turing đơn định, trong số bước đa thức theo độ dài đầu vào n, ví dụ cỡ n, n bình phương, n mũ ba. Lớp NP gồm các bài toán quyết định được bằng máy Turing không đơn định trong số bước đa thức, mỗi bước có thể rẽ nhiều nhánh, và máy nhận nếu có một nhánh nhận. Không đơn định ở đây giống ô-tô-mát ở bài 2, không có xác suất nào, chỉ là tồn tại một nhánh."

  # ───────────────────────── 3. HAI ĐỊNH NGHĨA ─────────────────────────
  - id: equiv
    kind: concept
    title: "Nhánh nhận = chứng chỉ"
    steps:
      - show: |
          <div class="chain"><span class="n">máy không đơn định, đa thức</span><span class="a">⇄</span><span class="n">chứng chỉ ngắn + bộ kiểm đa thức</span></div>
          <p><b>Định nghĩa thứ hai của NP:</b> mỗi đầu vào có câu trả lời “có” đều kèm được một <b>chứng chỉ</b> — một chuỗi bằng chứng, dài không quá đa thức theo $n$ — mà một máy đơn định gọi là <b>bộ kiểm</b> kiểm được trong số bước đa thức. Đầu vào có câu trả lời “không” thì không chứng chỉ nào qua được bộ kiểm.</p>
          <ul><li>Có nhánh nhận → ghi lại các lựa chọn dọc nhánh đó: được một chứng chỉ ngắn, kiểm lại bằng máy đơn định trong đa thức.</li>
          <li>Có bộ kiểm chứng chỉ → máy không đơn định <b>đoán</b> từng ký hiệu của chứng chỉ rồi chạy bộ kiểm.</li></ul>
          <p class="note">Đi được cả hai chiều, nên hai định nghĩa cho đúng cùng một lớp NP.</p>
        focus: [1, 2, 2, 2, "3.1", "3.2", 4]
        say: "Lớp NP còn một cách định nghĩa thứ hai, và hai cách định nghĩa là một. Cách thứ hai dùng chứng chỉ, tức một chuỗi bằng chứng ngắn, dài không quá đa thức theo độ dài đầu vào, đi kèm mỗi đầu vào có câu trả lời là có. Một máy đơn định gọi là bộ kiểm nhận đầu vào cùng chứng chỉ, và kiểm xong trong số bước đa thức. Còn với đầu vào có câu trả lời là không, thì không chứng chỉ nào qua được bộ kiểm. Nếu có một nhánh nhận, ta ghi lại các lựa chọn dọc nhánh đó, được một chứng chỉ ngắn, kiểm lại được bằng máy đơn định trong thời gian đa thức. Ngược lại, nếu có bộ kiểm chứng chỉ, máy không đơn định chỉ cần đoán từng ký hiệu của chứng chỉ rồi chạy bộ kiểm. Vì đi được cả hai chiều, hai định nghĩa cho đúng cùng một lớp NP, và phần ví dụ ngay sau làm điều này bằng số với bài toán tổng tập con."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Máy không đơn định = một cây nhánh"
    checks:
      - "sorted(sum(c) for k in range(4) for c in __import__('itertools').combinations([3, 4, 5], k)) == sorted([12, 7, 8, 3, 9, 4, 5, 0])"
      - "[sorted(s) for s in alg.subset_sums([3, 4, 5], 9)[0]] == [[4, 5]]"
    steps:
      - clear: true
        show: |
          <div><svg width="1440" height="470" viewBox="0 0 1440 470"><line x1="720" y1="60" x2="360" y2="160" stroke="#6b7280" stroke-width="2.5"/><text x="526.0" y="110.0" font-size="20" text-anchor="end" fill="#6b7280">lấy 3</text><line x1="720" y1="60" x2="1080" y2="160" stroke="#15803d" stroke-width="5"/><text x="914.0" y="110.0" font-size="20" text-anchor="start" fill="#15803d">bỏ 3</text><line x1="360" y1="160" x2="180" y2="260" stroke="#6b7280" stroke-width="2.5"/><text x="256.0" y="210.0" font-size="20" text-anchor="end" fill="#6b7280">lấy 4</text><line x1="360" y1="160" x2="540" y2="260" stroke="#6b7280" stroke-width="2.5"/><text x="464.0" y="210.0" font-size="20" text-anchor="start" fill="#6b7280">bỏ 4</text><line x1="1080" y1="160" x2="900" y2="260" stroke="#15803d" stroke-width="5"/><text x="976.0" y="210.0" font-size="20" text-anchor="end" fill="#15803d">lấy 4</text><line x1="1080" y1="160" x2="1260" y2="260" stroke="#6b7280" stroke-width="2.5"/><text x="1184.0" y="210.0" font-size="20" text-anchor="start" fill="#6b7280">bỏ 4</text><line x1="180" y1="260" x2="90" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="121.0" y="298.0" font-size="20" text-anchor="end" fill="#6b7280">lấy 5</text><line x1="180" y1="260" x2="270" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="239.0" y="298.0" font-size="20" text-anchor="start" fill="#6b7280">bỏ 5</text><line x1="540" y1="260" x2="450" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="481.0" y="298.0" font-size="20" text-anchor="end" fill="#6b7280">lấy 5</text><line x1="540" y1="260" x2="630" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="599.0" y="298.0" font-size="20" text-anchor="start" fill="#6b7280">bỏ 5</text><line x1="900" y1="260" x2="810" y2="336" stroke="#15803d" stroke-width="5"/><text x="841.0" y="298.0" font-size="20" text-anchor="end" fill="#15803d">lấy 5</text><line x1="900" y1="260" x2="990" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="959.0" y="298.0" font-size="20" text-anchor="start" fill="#6b7280">bỏ 5</text><line x1="1260" y1="260" x2="1170" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="1201.0" y="298.0" font-size="20" text-anchor="end" fill="#6b7280">lấy 5</text><line x1="1260" y1="260" x2="1350" y2="336" stroke="#6b7280" stroke-width="2.5"/><text x="1319.0" y="298.0" font-size="20" text-anchor="start" fill="#6b7280">bỏ 5</text><circle cx="720" cy="60" r="9" fill="#1f2937"/><circle cx="360" cy="160" r="9" fill="#1f2937"/><circle cx="1080" cy="160" r="9" fill="#1f2937"/><circle cx="180" cy="260" r="9" fill="#1f2937"/><circle cx="540" cy="260" r="9" fill="#1f2937"/><circle cx="900" cy="260" r="9" fill="#1f2937"/><circle cx="1260" cy="260" r="9" fill="#1f2937"/><circle cx="90" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="90" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">12</text><circle cx="270" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="270" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><circle cx="450" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="450" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">8</text><circle cx="630" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="630" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><circle cx="810" cy="370" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="810" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">9</text><circle cx="990" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="990" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><circle cx="1170" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="1170" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><circle cx="1350" cy="370" r="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="1350" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="720" y="445" font-size="24" text-anchor="middle" fill="#15803d">nhánh xanh: bỏ 3, lấy 4, lấy 5 → tổng 9 = đích; ghi lại ba lựa chọn đó là chứng chỉ</text><text x="1430" y="30" font-size="22" text-anchor="end" fill="#374151">số trong ô = tổng các số đã lấy</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ máy không đơn định chạy trên tập 3, 4, 5 với đích là 9. Ở mỗi số máy rẽ hai nhánh, lấy hoặc bỏ, nên sau ba số có 8 lá, mỗi lá ghi tổng các số đã lấy. Chỉ một lá bằng đích, là lá xanh của nhánh bỏ 3, lấy 4, lấy 5, nên máy nhận vì tồn tại một nhánh nhận. Ghi lại ba lựa chọn dọc nhánh xanh, ta được chứng chỉ là tập 4, 5, và ai cầm chứng chỉ chỉ cần kiểm đúng một nhánh đó."

  - id: example
    kind: example
    title: "Tổng tập con: cây nhánh và chứng chỉ"
    checks:
      - "alg.subset_sums([3, 34, 4, 12, 5, 2], 9)[1] == 64"
      - "sorted(sorted(s) for s in alg.subset_sums([3, 34, 4, 12, 5, 2], 9)[0]) == [[2, 3, 4], [4, 5]]"
      - "4 + 5 == 9 and 3 + 4 + 2 == 9"
      - "[3, 34, 4, 12, 5, 2].index(4) + 1 == 3 and [3, 34, 4, 12, 5, 2].index(5) + 1 == 5"
    steps:
      - clear: true
        show: |
          <p>Tập $\{3, 34, 4, 12, 5, 2\}$, đích $9$. Máy không đơn định gặp mỗi số thì rẽ hai nhánh: <b>lấy</b> hoặc <b>bỏ</b>.</p>
          <p><b>Bước 1.</b> 6 số → $2^6 = \hl{64}$ nhánh, mỗi nhánh chỉ dài 6 bước.</p>
        focus: [1, 2, 2]
        say: "Lấy tập 3, 34, 4, 12, 5, 2, với đích là 9. Máy không đơn định gặp mỗi số thì rẽ hai nhánh, lấy hoặc bỏ. Bước một, sáu số cho 2 mũ 6 bằng 64 nhánh, mỗi nhánh chỉ dài 6 bước."
      - show: |
          <p><b>Bước 2.</b> Có nhánh nhận: lấy $4$ và $5$, bỏ bốn số còn lại. Chứng chỉ là $\{4, 5\}$.</p>
          <table class="t"><tr><th>kiểm chứng chỉ</th><th>dò trong tập</th></tr><tr><td>4</td><td>có, ở vị trí thứ 3</td></tr><tr><td>5</td><td>có, ở vị trí thứ 5</td></tr></table>
        focus: [1, 1, 2]
        say: "Bước hai, có một nhánh nhận, là nhánh lấy 4 và 5 rồi bỏ bốn số còn lại, nên chứng chỉ là tập 4, 5. Ai cầm chứng chỉ thì kiểm trước hết rằng hai số có trong tập. Số 4 ở vị trí thứ ba, số 5 ở vị trí thứ năm."
      - show: |
          <div class="box key"><b>Bước 3.</b> Một phép cộng: $4 + 5 = 9$ = đích → nhận. Kiểm nhanh. Còn máy đơn định thử lần lượt thì phải đi tới 64 nhánh.</div>
        say: "Bước ba, chỉ cần một phép cộng, 4 cộng 5 bằng 9, đúng bằng đích, nên chứng chỉ hợp lệ, rất nhanh. Còn máy đơn định thử lần lượt thì phải đi tới cả 64 nhánh."
      - show: |
          <p class="note"><b>Bước 4.</b> Vét cạn cả 64 nhánh cho thấy có đúng hai nghiệm: $\{4, 5\}$ và $\{3, 4, 2\}$, với $3 + 4 + 2 = 9$.</p>
        say: "Bước bốn, vét cạn cả 64 nhánh cho thấy có đúng hai nghiệm, là 4, 5 và 3, 4, 2, vì 3 cộng 4 cộng 2 cũng bằng 9."

  - id: picture
    kind: concept
    title: "Bức tranh của cả khoá"
    steps:
      - show: |
          <div class="chain"><span class="n">chính quy (ôtômat hữu hạn)</span><span class="a">⊂</span><span class="n">phi ngữ cảnh (ngăn xếp)</span><span class="a">⊂</span>
          <span class="n">khả quyết (máy Turing luôn dừng)</span><span class="a">⊂</span><span class="n">nửa khả quyết</span></div>
          <p>Bên trong lớp khả quyết: $\mathrm{P} \subseteq \mathrm{NP}$ — giải nhanh thì kiểm nhanh. Có bằng nhau không là bài toán mở, treo thưởng một triệu đô la từ năm 2000.</p>
          <p class="note">Mỗi bậc thang có một ví dụ ở ngay trên: $\{0^n 1^n\}$ không chính quy; $\{0^n 1^n 2^n\}$ khả quyết mà không phi ngữ cảnh; bài toán dừng nửa khả quyết mà không khả quyết.</p>
        focus: [1, 1, 1, 2, 2, 3, 3, 3]
        say: "Đây là bức tranh của cả khoá. Ngôn ngữ chính quy, nhận bằng ô-tô-mát hữu hạn, nằm trong lớp phi ngữ cảnh, nhận bằng máy có ngăn xếp. Lớp phi ngữ cảnh lại nằm trong lớp khả quyết của máy Turing luôn dừng, rồi trong lớp nửa khả quyết. Bên trong lớp khả quyết, P nằm trong NP, vì giải nhanh thì kiểm nhanh. Còn P có bằng NP không là bài toán mở, được treo thưởng một triệu đô la từ năm 2000. Mỗi bậc thang đều có một ví dụ nằm ngay trên nó. Ngôn ngữ n chữ 0 rồi n chữ 1 không chính quy, còn ngôn ngữ n chữ 0, n chữ 1, rồi n chữ 2 khả quyết mà không phi ngữ cảnh. Cuối cùng, bài toán dừng nửa khả quyết mà không khả quyết."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "[2 ** n for n in (6, 20)] == [64, 1048576]"
      - "[2 ** k for k in range(7)] == [1, 2, 4, 8, 16, 32, 64]"
      - "sum(1 for k in range(7) for c in __import__('itertools').combinations([3, 34, 4, 12, 5, 2], k)) == 64"
      - "sum(1 for k in range(7) for c in __import__('itertools').combinations([3, 34, 4, 12, 5, 2], k) if sum(c) == 9) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác: nhân đôi từng số</th><th>số nhánh</th></tr>
          <tr><td>chưa xét số nào</td><td>1</td></tr>
          <tr><td>xét 3, 34, 4</td><td>2 → 4 → 8</td></tr>
          <tr><td>xét 12, 5, 2</td><td>16 → 32 → 64 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm số 64 bằng đường khác, đếm bằng cách nhân đôi từng số thay vì dùng lũy thừa. Chưa xét số nào thì có 1 nhánh. Xét lần lượt 3, 34 và 4 thì số nhánh thành 2, 4, rồi 8. Xét tiếp 12, 5 và 2 thì thành 16, 32, rồi 64, khớp với 2 mũ 6."
      - show: |
          <table class="t"><tr><th>máy liệt kê</th><th>kết quả</th></tr>
          <tr><td>mọi tập con của 6 số, đếm thẳng</td><td>64 tập ✓</td></tr>
          <tr><td>số tập có tổng đúng 9</td><td>2 tập: $\{4, 5\}$ và $\{3, 4, 2\}$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Rồi cho máy liệt kê thẳng mọi tập con của sáu số, vì đếm tay dễ sót. Máy đếm được đúng 64 tập. Trong đó đúng 2 tập có tổng bằng 9, là 4, 5 và 3, 4, 2, khớp với kết quả vét cạn."
      - clear: true
        show: |
          <table class="t"><tr><th>nhận xét</th><th>vì sao</th></tr>
          <tr><td><b>Số nhánh</b> tăng gấp đôi mỗi khi thêm một số</td><td>6 số có 64 nhánh, 20 số đã hơn một triệu</td></tr>
          <tr><td><b>Chi phí kiểm</b> chỉ tăng theo độ dài chứng chỉ</td><td>cộng vài số rồi so với đích</td></tr>
          <tr><td><b>Bài toán vẫn khả quyết</b></td><td>mọi bài toán NP giải được bằng vét cạn — câu hỏi chỉ là có cách nhanh hay không</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba nhận xét. Một, số nhánh tăng gấp đôi mỗi khi thêm một số, 6 số có 64 nhánh, còn 20 số đã hơn một triệu nhánh. Hai, chi phí kiểm chứng chỉ chỉ tăng theo độ dài chứng chỉ, chỉ là cộng vài số rồi so với đích. Ba, bài toán vẫn khả quyết, mọi bài toán NP đều giải được bằng vét cạn, câu hỏi chỉ là có cách nhanh hay không."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "2 ** 20 == 1048576 and 20 - 1 == 19"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Hiểu NP là “không đa thức” <b class="red">(sai)</b>
          <br><span class="note">N là <b>không đơn định</b>. Mọi bài toán trong P cũng nằm trong NP.</span></div>
        say: "Lỗi thứ nhất, hiểu NP là không đa thức. Chữ N là viết tắt của không đơn định, và mọi bài toán trong P cũng nằm trong NP."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ máy không đơn định là máy đoán ngẫu nhiên rất may mắn <b class="red">(sai)</b>
          <br><span class="note">Không có xác suất: máy nhận khi <b>tồn tại</b> một nhánh nhận. Đó là một định nghĩa toán học, không phải phần cứng.</span></div>
        say: "Lỗi thứ hai, nghĩ máy không đơn định là máy đoán ngẫu nhiên rất may mắn. Không có xác suất nào, máy nhận khi tồn tại một nhánh nhận, đó là một định nghĩa toán học chứ không phải một loại phần cứng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ đã chứng minh NP cần thời gian mũ <b class="red">(sai)</b>
          <br><span class="note">Mô phỏng thẳng mọi nhánh tốn thời gian mũ, nhưng chưa ai chứng minh không có cách nhanh hơn. Đó chính là câu hỏi P có bằng NP không.</span></div>
          <table class="t"><tr><th>số phần tử $n$</th><th>mô phỏng mọi nhánh: $2^n$</th><th>kiểm một chứng chỉ: tối đa $n - 1$ phép cộng</th></tr>
          <tr><td>20</td><td>1 048 576</td><td>19</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba, nghĩ đã có chứng minh bài toán NP cần thời gian mũ. Mô phỏng thẳng mọi nhánh thì tốn thời gian mũ, nhưng chưa ai chứng minh là không có cách nhanh hơn, và đó chính là câu hỏi P có bằng NP hay không. Với 20 số, mô phỏng mọi nhánh là hơn một triệu nhánh, còn kiểm một chứng chỉ chỉ tốn tối đa 19 phép cộng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lẫn “không khả quyết” với “khó” <b class="red">(sai)</b>
          <br><span class="note">Bài toán dừng <b>không có</b> thuật toán. Bài toán NP luôn có thuật toán, chỉ có thể chậm. Hai loại giới hạn rất khác nhau.</span></div>
        say: "Lỗi thứ tư, lẫn không khả quyết với khó. Bài toán dừng không có thuật toán nào, còn bài toán NP luôn có thuật toán, chỉ có thể chậm, nên đây là hai loại giới hạn rất khác nhau."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.subset_sums([7, 11, 2, 9], 20)[1] == 16"
      - "sorted(sorted(s) for s in alg.subset_sums([7, 11, 2, 9], 20)[0]) == [[2, 7, 11], [9, 11]]"
      - "11 + 9 == 20 and 7 + 11 == 18 and 18 + 2 == 20"
      - "[2 ** k for k in range(5)] == [1, 2, 4, 8, 16]"
    steps:
      - show: |
          <table class="t"><tr><th colspan="2">Tập $\{7, 11, 2, 9\}$, đích $20$</th></tr>
          <tr><td>1</td><td>Máy không đơn định có bao nhiêu nhánh?</td></tr>
          <tr><td>2</td><td>Đưa ra một chứng chỉ. Kiểm nó mất mấy phép cộng?</td></tr></table>
        focus: [0, "1.1", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Cho tập 7, 11, 2, 9, với đích là 20. Câu một, máy không đơn định có bao nhiêu nhánh? Câu hai, đưa ra một chứng chỉ, và kiểm nó mất mấy phép cộng? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <p>① Nhân đôi từng số: $1, 2, 4, 8, 16$, tức 4 số → $2^4 = \hl{16}$ nhánh.</p>
        say: "Đáp án câu một, nhân đôi từng số, 1 thành 2, 4, 8, rồi 16, tức 4 số cho 2 mũ 4 bằng 16 nhánh."
      - show: |
          <table class="t"><tr><th>chứng chỉ</th><th>dò trong tập</th><th>phép cộng</th><th>bằng đích?</th></tr>
          <tr><td>$\{11, 9\}$</td><td>có 11, có 9</td><td>$11 + 9 = 20$</td><td>✓ — <b>một</b> phép cộng</td></tr></table>
        focus: [0, "1.2", "1.2"]
        say: "Câu hai, thử chứng chỉ 11 và 9. Dò trong tập, có số 11 và có số 9. Chỉ cần một phép cộng, 11 cộng 9 bằng 20, đúng bằng đích."
      - show: |
          <table class="t"><tr><td>$\{7, 11, 2\}$</td><td>có cả ba</td><td>$7 + 11 = 18$, rồi $18 + 2 = 20$</td><td>✓ — <b>hai</b> phép cộng</td></tr></table>
        say: "Một chứng chỉ khác là 7, 11, 2, cần hai phép cộng, 7 cộng 11 bằng 18, rồi 18 cộng 2 bằng 20. Vét cạn 16 nhánh cho thấy chỉ có đúng hai chứng chỉ này."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khả quyết: có thuật toán</span><span class="a">→</span>
          <span class="n">P: có thuật toán nhanh</span><span class="a">→</span>
          <span class="n">NP: có chứng chỉ kiểm nhanh</span><span class="a">→</span>
          <span class="n">P = NP? còn mở</span></div>
        say: "Tổng kết lại, khả quyết nghĩa là có thuật toán, P là có thuật toán nhanh, NP là có chứng chỉ kiểm được nhanh. Còn P có bằng NP không thì vẫn là câu hỏi mở."
      - show: |
          <div class="box key"><b>Tư duy của cả khoá:</b> trước khi viết mã, hãy hỏi bài toán nằm ở bậc nào — chính quy thì dùng biểu thức chính quy, lồng nhau thì dùng văn phạm, không khả quyết thì tìm câu hỏi gần đúng, thuộc loại khó nhất của NP (NP đầy đủ) thì tìm thuật toán xấp xỉ hoặc chấp nhận vét cạn khi đầu vào nhỏ.</div>
        say: "Điều cần mang theo của cả khoá, trước khi viết mã, hãy hỏi bài toán nằm ở bậc nào. Chính quy thì dùng biểu thức chính quy, lồng nhau thì dùng văn phạm, không khả quyết thì tìm một câu hỏi gần đúng. Còn nếu bài toán thuộc loại khó nhất của NP, hãy tìm thuật toán xấp xỉ, hoặc chấp nhận vét cạn khi đầu vào nhỏ."
      - show: |
          <p class="note">Bài sau, bài 14, bài cuối của khoá: đi theo dòng thời gian của biểu thức chính quy, từ một bài báo năm 1968 tới một sự cố toàn cầu năm 2019 — chọn sai cách chạy ô-tô-mát có thể làm sập cả một hệ thống rất lớn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, cũng là bài cuối của khoá, ta đi theo dòng thời gian của biểu thức chính quy, từ một bài báo năm 1968 tới một sự cố toàn cầu năm 2019. Bạn sẽ thấy chọn sai cách chạy ô-tô-mát có thể làm sập cả một hệ thống rất lớn."
