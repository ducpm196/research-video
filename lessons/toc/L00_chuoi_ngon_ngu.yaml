      '
    say: Tổng kết lại, từ bảng chữ cái ta có chuỗi, độ dài và phép ghép. Một ngôn ngữ là một tập chuỗi, và một bài toán có hoặc không chính là hỏi một chuỗi có thuộc ngôn ngữ đó hay không. Nắm vững ngôn ngữ là tập hợp các chuỗi giúp bạn nhìn bài toán quyết định thật rạch ròi. Thay vì viết điều kiện mơ hồ, ta mô tả chính xác tập mọi chuỗi hợp lệ mà thuật toán phải chấp nhận. Ngôn ngữ hình thức cho phép phát biểu mọi bài toán quyết định chính xác không mơ hồ trước khi bắt tay thiết kế mô hình máy.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: '<div class="chain"><span class="n">bảng chữ cái $\Sigma$</span><span class="a">→</span>

      <span class="n">chuỗi, độ dài, ghép</span><span class="a">→</span>

      <span class="n">ngôn ngữ = tập chuỗi</span><span class="a">→</span>

      <span class="n">bài toán = hỏi w có thuộc L</span></div>

      '
    say: Cách đặt nền tảng hình thức này loại trừ sai sót biên ngay từ bảng đặc tả đầu tiên. Khi hệ thống thực tế xử lý hàng triệu tên đăng nhập hay thông điệp mạng mỗi ngày, quy tắc xác thực chuỗi càng chặt càng tránh được lỗ hổng bảo mật. Mọi mô hình máy trạng thái, văn phạm phi ngữ cảnh và khái niệm tính khả quyết đều đứng trên ngôn ngữ hình thức giản dị này. Tập hợp chuỗi càng tường minh thì phép kiểm chứng càng chắc chắn và không bao giờ suy diễn sai biên. Chuẩn bị kỹ khái niệm bảng chữ cái và tập chuỗi ngay hôm nay sẽ giúp bạn đọc thông mọi chứng minh toán học trong phần lý thuyết tính toán.
