      <tr><td>chuỗi cụ thể: $|011| = 3$, có hai chữ 1</td><td>phải nằm trong 8 chuỗi</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Tự kiểm bằng ba cách. Một, đếm lại bằng công thức, 1 cộng 2 cộng 4 cộng 8 bằng 2 mũ 4 trừ 1, đúng 15. Hai, cho máy liệt kê mọi chuỗi độ dài tới 3 rồi đếm, phải ra cùng con số. Ba, kiểm một chuỗi cụ thể, 0 1 1 dài 3 và có hai chữ 1, nên phải nằm trong 8 chuỗi. Công thức cấp số nhân hai lũy thừa cộng từ bậc không tới n luôn rút gọn thành hai mũ n cộng một trừ một.
