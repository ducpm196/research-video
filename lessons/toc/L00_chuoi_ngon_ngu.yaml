id: L00
course: TOC
series: TOC · Lý thuyết tính toán
title: Bài 0 — Bảng chữ cái, chuỗi và ngôn ngữ
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/toc.yaml L00; audit/toc/verify_toc.py L00; M. Sipser, Introduction to the Theory of Computation (3rd ed.), mục 0.2
assumes:
- arith
- power
- sub
- set
- in
- subseteq
- emptyset
- dots
objectives:
- Định nghĩa bảng chữ cái, chuỗi, độ dài, phép ghép
- Hiểu ngôn ngữ là một tập chuỗi và mỗi bài toán quyết định là một ngôn ngữ
- Đếm số chuỗi theo độ dài
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Mọi câu hỏi có–không đều là một câu hỏi về chuỗi
  steps:
  - show: '<ul><li>Mật khẩu này có đủ 8 ký tự và có chữ số không?</li>

      <li>Tệp mã này có viết đúng cú pháp không?</li>

      <li>Số nhị phân này có chia hết cho 3 không?</li></ul>

      <div class="box key">Cả ba đều hỏi: <b>chuỗi</b> đầu vào có thuộc một <b>tập chuỗi</b> cho trước không?</div>

      '
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - 2
    say: Chào bạn, mật khẩu này có đủ 8 ký tự và có chữ số không? Tệp mã này có viết đúng cú pháp không? Số nhị phân này có chia hết cho 3 không? Cả ba câu hỏi thật ra là một, chuỗi đầu vào có thuộc một tập chuỗi cho trước hay không.
  - show: '<p>Khoá này hỏi: máy nào trả lời được loại câu hỏi nào — và có câu hỏi nào <b>không máy nào</b> trả lời được không?</p>

      <div class="box">Hôm nay: bảng chữ cái, chuỗi, độ dài, phép ghép, và ngôn ngữ — từ vựng của cả khoá.</div>

      '
    focus:
    - 1
    - 2
    say: Khoá học này hỏi máy nào trả lời được loại câu hỏi nào, và có câu hỏi nào không máy nào trả lời được không. Hôm nay ta học từ vựng của cả khoá, gồm bảng chữ cái, chuỗi, độ dài, phép ghép và ngôn ngữ.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: tập hợp và quy tắc nhân'
  checks:
  - len({0, 1}) == 2 and {0, 1} == {1, 0} and 1 in {0, 1}
  - 2 * 2 == 4 and 2 * 2 * 2 == 2 ** 3 == 8
  - len(list(__import__('itertools').product('SN', repeat=2))) == 4
  steps:
  - show: '<table class="t"><tr><th>điều cần dùng</th><th>ví dụ số</th></tr>

      <tr><td>tập hợp: liệt kê trong ngoặc nhọn, không kể thứ tự, không lặp</td><td>$\{0, 1\}$ có 2 phần tử, và $\{1, 0\}$ vẫn là tập đó</td></tr>

      <tr><td>thuộc: $\in$</td><td>$1 \in \{0, 1\}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    say: Trước khi vào bài, ta ôn lại hai điều sẽ dùng suốt hôm nay. Điều thứ nhất là tập hợp, liệt kê các phần tử trong cặp ngoặc nhọn. Tập gồm 0 và 1 có 2 phần tử, và viết 1 trước 0 thì vẫn là tập đó, vì tập hợp không kể thứ tự. Dấu giống chữ e cong là thuộc, ví dụ 1 thuộc tập gồm 0 và 1. Hai tập hợp chỉ cần chứa đúng những phần tử giống nhau là bằng nhau hoàn toàn bất kể bạn liệt kê theo thứ tự nào.
  - show: '<table class="t"><tr><th>tung đồng xu</th><th>số kết quả</th></tr>

      <tr><td>1 lần: S hoặc N</td><td>2</td></tr>

      <tr><td>2 lần: SS, SN, NS, NN</td><td>$2 \times 2 = 4$</td></tr>

      <tr><td>3 lần</td><td>$2 \times 2 \times 2 = 2^3 = 8$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Điều thứ hai là quy tắc nhân, dùng để đếm số khả năng. Tung một đồng xu có 2 kết quả, sấp hoặc ngửa. Tung hai lần thì mỗi kết quả lần đầu đi với 2 kết quả lần sau, được 2 nhân 2 bằng 4 kết quả. Tung ba lần được 2 nhân 2 nhân 2, tức 2 mũ 3, bằng 8 kết quả. Quy tắc nhân nhanh chóng kéo số chuỗi tăng theo hàm mũ ngay khi độ dài chuỗi hoặc cỡ bảng chữ cái nhích lên.
- id: sym
  kind: symbol
  title: 'Giải mã: bảng chữ cái, chuỗi, độ dài, chuỗi rỗng'
  checks:
  - len('0110') == 4
  steps:
  - show: '<table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ</th></tr>

      <tr><td>$\Sigma$</td><td><b>bảng chữ cái</b>: một tập hữu hạn ký hiệu</td><td>$\Sigma = \{0, 1\}$</td></tr>

      <tr><td>$w$</td><td><b>chuỗi</b>: dãy hữu hạn ký hiệu lấy từ $\Sigma$, viết liền nhau</td><td>$w = 0110$</td></tr>

      <tr><td>$|w|$</td><td><b>độ dài</b>: số ký hiệu trong chuỗi</td><td>$|0110| = 4$</td></tr>

      <tr><td>$\varepsilon$</td><td><b>chuỗi rỗng</b>: không có ký hiệu nào</td><td>$|\varepsilon| = 0$</td></tr></table>

      '
    introduces:
    - alpha
    - strlen
    - eps
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bốn ký hiệu đầu tiên. Chữ Sigma hoa là bảng chữ cái, một tập hữu hạn ký hiệu, ở đây gồm 0 và 1. Một chuỗi là dãy hữu hạn ký hiệu lấy từ bảng chữ cái, viết liền nhau, như 0 1 1 0. Hai vạch đứng quanh chuỗi là độ dài, số ký hiệu trong chuỗi, ở đây bằng 4. Chữ ép-xi-lôn là chuỗi rỗng, không có ký hiệu nào, nên độ dài bằng 0. Trong bảng chữ cái hai ký tự, mọi xâu nhị phân đều là chuỗi hợp lệ trên bảng chữ cái này, kể cả chuỗi có độ dài bằng 0.
  - show: '<div class="box key">Chuỗi rỗng $\varepsilon$ <b>không</b> phải một ký hiệu của $\Sigma$. Nó giống số 0 trong phép cộng: có mặt ở đâu cũng không làm chuỗi dài thêm.</div>

      '
    say: Lưu ý chuỗi rỗng không phải một ký hiệu của bảng chữ cái. Nó giống số 0 trong phép cộng, có mặt ở đâu cũng không làm chuỗi dài thêm.
- id: concat
  kind: concept
  title: Ghép chuỗi, lũy thừa chuỗi, tập mọi chuỗi
  checks:
  - '''01'' + ''110'' == ''01110'' and len(''01110'') == len(''01'') + len(''110'') == 5'
  - '''0'' * 3 == ''000'''
  - sorted(alg.strings('01', 2, exact=True)) == ['00', '01', '10', '11']
  steps:
  - show: '<p>Ghép: viết hai chuỗi liền nhau. $x = 01$, $y = 110$ thì</p>

      $$xy = 01110, \qquad |xy| = |x| + |y| = 2 + 3 = 5$$

      <p>Ghép với chuỗi rỗng không đổi gì: $\varepsilon w = w \varepsilon = w$.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Phép ghép là viết hai chuỗi liền nhau. Với x bằng 0 1 và y bằng 1 1 0, ghép x với y được 0 1 1 1 0, và độ dài cộng lại, 2 cộng 3 bằng 5. Ghép với chuỗi rỗng ở bên trái hay bên phải đều không đổi gì. Chuỗi rỗng đóng vai trò phần tử đơn vị hai phía cho phép ghép chuỗi, giống hệt số 0 trong phép cộng số học thông thường.
  - show: '<p>Lũy thừa chuỗi: $0^3 = 000$ — ba chữ 0 <b>ghép</b> lại, không phải số 0 mũ 3.</p>

      <p>$\Sigma^k$ = tập mọi chuỗi có độ dài đúng $k$: $\Sigma^2 = \{00, 01, 10, 11\}$, và $\Sigma^0 = \{\varepsilon\}$.</p>

      <p>$\Sigma^*$ = tập <b>mọi</b> chuỗi trên $\Sigma$, mọi độ dài, kể cả $\varepsilon$.</p>

      '
    introduces:
    - strpow
    - sigk
    - kstar
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Lũy thừa chuỗi, 0 mũ 3 nghĩa là ba chữ 0 ghép lại, không phải số 0 mũ 3. Sigma mũ k là tập mọi chuỗi có độ dài đúng k, ví dụ Sigma mũ 2 gồm bốn chuỗi 0 0, 0 1, 1 0 và 1 1. Còn Sigma mũ 0 chỉ có một chuỗi là chuỗi rỗng. Sigma sao là tập mọi chuỗi, mọi độ dài, kể cả chuỗi rỗng. Phân biệt rõ độ dài của một chuỗi đơn lẻ là một số tự nhiên với lực lượng số phần tử của cả một tập ngôn ngữ.
- id: lang
  kind: concept
  title: Ngôn ngữ = một tập chuỗi
  checks:
  - '[w for w in alg.strings(''01'', 4) if w and int(w, 2) % 3 == 0 and w[0] == ''1''] == [''11'', ''110'', ''1001'', ''1100'', ''1111'']'
  steps:
  - show: '<p>Một <b>ngôn ngữ</b> trên $\Sigma$ là một tập chuỗi bất kỳ $L \subseteq \Sigma^*$ (dấu $\subseteq$ đọc là “nằm trong”: mọi chuỗi của $L$ đều thuộc $\Sigma^*$) — hữu hạn hay vô hạn đều được.</p>

      <p>Ví dụ: $L_3$ = các số nhị phân <b>dương</b> (không có 0 thừa ở đầu) chia hết cho 3 $= \{11, 110, 1001, 1100, 1111, \dots\}$.</p>

      <div class="box key">Giải một bài toán có–không = với mỗi chuỗi $w$, quyết định $w \in L$ hay không.</div>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Một ngôn ngữ là một tập chuỗi bất kỳ trên bảng chữ cái, tức mọi chuỗi của nó đều nằm trong Sigma sao, hữu hạn hay vô hạn đều được. Ví dụ ngôn ngữ các số nhị phân dương chia hết cho 3, bắt đầu bằng 1 1, 1 1 0, 1 0 0 1, và cứ thế tiếp tục. Giải một bài toán có hoặc không, chính là với mỗi chuỗi, quyết định nó có thuộc ngôn ngữ đó hay không. Một ngôn ngữ hình thức đơn giản chỉ là quy ước phân đôi toàn bộ không gian chuỗi thành nhóm hợp lệ và nhóm bị loại.
- id: intuition
  kind: intuition
  title: 'Cây lựa chọn: mỗi vị trí tách đôi'
  checks:
  - '[len(alg.strings(''01'', k, exact=True)) for k in range(4)] == [1, 2, 4, 8]'
  steps:
  - show: '<div><svg width="1500" height="420" viewBox="0 0 1500 420"><g stroke="#6b7280" stroke-width="2.5"><line x1="595" y1="74" x2="295" y2="126"/><line x1="595" y1="74" x2="895" y2="126"/><line x1="295" y1="174" x2="145" y2="236"/><line x1="295" y1="174" x2="445" y2="236"/><line x1="895" y1="174" x2="745" y2="236"/><line x1="895" y1="174" x2="1045" y2="236"/><line x1="145" y1="284" x2="70" y2="346"/><line x1="145" y1="284" x2="220" y2="346"/><line x1="445" y1="284" x2="370" y2="346"/><line x1="445" y1="284" x2="520" y2="346"/><line x1="745" y1="284" x2="670" y2="346"/><line x1="745" y1="284" x2="820" y2="346"/><line x1="1045" y1="284" x2="970" y2="346"/><line x1="1045" y1="284" x2="1120" y2="346"/></g><g font-size="22" font-weight="bold" fill="#b45309" text-anchor="middle"><text x="429" y="108">0</text><text x="761" y="108">1</text><text x="204" y="213">0</text><text x="386" y="213">1</text><text x="804" y="213">0</text><text x="986" y="213">1</text><text x="92" y="323">0</text><text x="198" y="323">1</text><text x="392" y="323">0</text><text x="498" y="323">1</text><text x="692" y="323">0</text><text x="798" y="323">1</text><text x="992" y="323">0</text><text x="1098" y="323">1</text></g><rect x="545" y="26" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="595" y="60" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">rỗng</text><rect x="245" y="126" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="295" y="160" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="845" y="126" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="895" y="160" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="95" y="236" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="145" y="270" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">00</text><rect x="395" y="236" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="445" y="270" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">01</text><rect x="695" y="236" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="745" y="270" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">10</text><rect x="995" y="236" width="100" height="48" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="2.5"/><text x="1045" y="270" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">11</text><rect x="20" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="70" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">000</text><rect x="170" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="220" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">001</text><rect x="320" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="370" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">010</text><rect x="470" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="520" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">011</text><rect x="620" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="670" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">100</text><rect x="770" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="820" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">101</text><rect x="920" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="970" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">110</text><rect x="1070" y="346" width="100" height="48" rx="14" fill="#dcfce7" stroke="#1f2937" stroke-width="2.5"/><text x="1120" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">111</text><g font-size="26" fill="#1f2937"><text x="1215" y="60">độ dài 0: 1 chuỗi</text><text x="1215" y="160">độ dài 1: 2 chuỗi</text><text x="1215" y="270">độ dài 2: 4 chuỗi</text><text x="1215" y="380">độ dài 3: 8 chuỗi</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình này cho thấy các chuỗi được sinh ra thế nào. Gốc ở trên cùng, ghi chữ rỗng, là chuỗi rỗng. Từ mỗi chuỗi ta kéo hai nhánh, ghép thêm chữ 0 ở nhánh trái và chữ 1 ở nhánh phải. Vì mỗi nút tách đôi, tầng sau luôn gấp đôi tầng trước, nên các tầng có 1, 2, 4 rồi 8 chuỗi.
- id: example
  kind: example
  title: Đếm chuỗi nhị phân độ dài tới 3
  checks:
  - '[len(alg.strings(''01'', k, exact=True)) for k in range(4)] == [1, 2, 4, 8]'
  - len(alg.strings('01', 3)) == 15
  - '[sum(w.count(''1'') % 2 == 0 for w in alg.strings(''01'', k, exact=True)) for k in range(4)] == [1, 1, 2, 4]'
  - sum(w.count('1') % 2 == 0 for w in alg.strings('01', 3)) == 8
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi vị trí có 2 lựa chọn, nên $\Sigma^k$ có $2^k$ chuỗi:</p>

      <table class="t"><tr><th>độ dài</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>

      <tr><td>số chuỗi</td><td>1 (chỉ $\varepsilon$)</td><td>2</td><td>4</td><td>8</td></tr></table>

      '
    focus:
    - 1
    - 2
    say: Bước một, mỗi vị trí trong chuỗi có 2 lựa chọn, nên số chuỗi độ dài k là 2 mũ k. Độ dài 0 có 1 chuỗi là chuỗi rỗng, rồi 2, 4 và 8.
  - show: '<p><b>Bước 2.</b> Cộng các tầng của cây:</p>

      $$1 + 2 + 4 + 8 = \hl{15}$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, cộng các tầng của cây lại. Số chuỗi có độ dài từ 0 tới 3 là 1 cộng 2 cộng 4 cộng 8, bằng 15.
  - clear: true
    show: '<p><b>Bước 3.</b> Trong 15 chuỗi đó, chuỗi nào có <b>số chữ 1 chẵn</b>?</p>

      <table class="t"><tr><th>độ dài</th><th>chuỗi có số chữ 1 chẵn</th><th>đếm</th></tr>

      <tr><td>0</td><td>$\varepsilon$ (không có chữ 1 nào, 0 là số chẵn)</td><td>1</td></tr>

      <tr><td>1</td><td>$0$</td><td>1</td></tr>

      <tr><td>2</td><td>$00, 11$</td><td>2</td></tr>

      <tr><td>3</td><td>$000, 011, 101, 110$</td><td>4</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.5'
    say: Bước ba, trong 15 chuỗi đó, bao nhiêu chuỗi có số chữ 1 chẵn? Độ dài 0 có chuỗi rỗng, không có chữ 1 nào, mà 0 là số chẵn, nên được 1. Độ dài 1 chỉ có chuỗi 0, được 1. Độ dài 2 có 0 0 và 1 1, được 2. Độ dài 3 có bốn chuỗi 0 0 0, 0 1 1, 1 0 1 và 1 1 0. Tính chất số lần xuất hiện của một ký hiệu là chẵn hay lẻ luôn kiểm tra gọn qua trạng thái nhớ hai giá trị.
