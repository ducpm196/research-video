  - show: '<div class="box key"><b>Tư duy:</b> trước khi hỏi “làm sao giải”, hãy viết bài toán thành một ngôn ngữ: những chuỗi nào được trả lời “có”?</div>

      <p class="note"><b>So sánh hai quy mô:</b> Với bảng chữ cái 2 ký tự độ dài tối đa 3 chỉ có 15 chuỗi (đếm tay được), còn mật khẩu 8 ký tự trên 64 ký hiệu đã vượt 280 nghìn tỉ chuỗi — buộc phải mô tả bằng luật ngôn ngữ thay vì liệt kê.</p>

      '
    say: Điều cần mang theo, trước khi hỏi làm sao giải, hãy viết bài toán thành một ngôn ngữ, tức là những chuỗi nào được trả lời có. Ở độ dài tối đa 3 chỉ có 15 chuỗi nên đếm tay được. Mật khẩu 8 ký tự trên 64 ký hiệu nổ lên hơn 280 nghìn tỉ chuỗi, buộc phải mô tả bằng luật ngôn ngữ. Mọi bước kiểm thử đều đối chứng kết quả tổng đếm lý thuyết với phép liệt kê từng nhánh để không bỏ sót chuỗi rỗng.
