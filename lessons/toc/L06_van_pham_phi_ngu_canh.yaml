id: L06
course: TOC
series: "TOC · Lý thuyết tính toán"
title: "Bài 6 — Văn phạm phi ngữ cảnh và cây suy dẫn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L06; audit/toc/verify_toc.py L06; N. Chomsky (1956), “Three Models for the Description of Language”; M. Sipser, mục 2.1"
assumes: [arith, sub, set, in, emptyset, alpha, eps, kstar, strpow, dots]
# Quy ước: biến viết chữ HOA (S), ký hiệu kết thúc là 0, 1, (, ). Quy tắc viết $S \to 0S1 \mid \varepsilon$ (prod, alt); suy dẫn một bước
#   viết ⇒ (derive). Khoá này không dùng ⇒ cho “suy ra”. Ngôn ngữ của văn phạm do alg.cfg_lang sinh và so với định nghĩa
#   (alg.balanced, 0ⁿ1ⁿ) trên mọi chuỗi tới độ dài 8–10; cây sinh bằng audit/toc/fsm_svg.py (kiểm đọc lá ra đúng chuỗi).
objectives:
  - "Viết văn phạm phi ngữ cảnh cho 0ⁿ1ⁿ và ngoặc cân bằng"
  - "Viết một suy dẫn và vẽ cây suy dẫn"
  - "Hiểu “phi ngữ cảnh” nghĩa là vế trái chỉ có một biến"
asr_reviewed:
  - {sentence: "Đây cũng chính là cách văn phạm sinh chuỗi, vì quy tắc mở ngoặc S đóng ngoặc S tách đúng tại chỗ đó.", reason: "ASR chép “Đây cũng chính là cách văn phạm sinh chuỗi vì quy tắc mở hoặc ép đóng hoặc ép tách đúng tại chỗ đó.” (0.826): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: ngoặc (trong “ngoặc s” → “hoặc ép”), ngoặc (trong “ngoặc s” → “hoặc ép”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, có bao nhiêu chuỗi ngoặc cân bằng độ dài 8?", reason: "ngoặc/hoặc, cân/kinh, 8/“tắm”: ASR nghe sai ở câu 11 từ; “chuỗi ngoặc cân bằng” chép đúng ở các câu dài khác của L06 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, ở bài 4, bổ đề bơm cho thấy không ô-tô-mát hữu hạn nào nhận được ngôn ngữ n chữ 0 rồi n chữ 1, vì máy phải đếm không giới hạn.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này"}
  - {sentence: "Viết thành văn phạm, S sinh ra mở ngoặc S đóng ngoặc S, hoặc chuỗi rỗng.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Dấu gạch đứng gom nhiều quy tắc cùng vế trái, nên dòng này là hai quy tắc, S sinh ra 0 S 1, hoặc S sinh ra chuỗi rỗng.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Quy tắc tự gọi lại chính mình"
    steps:
      - show: |
          <p>Ở bài 4: không ôtômat hữu hạn nào nhận được $\{0^n 1^n\}$, vì máy phải đếm không giới hạn.</p>
          <p>Nhưng ngôn ngữ này mô tả được bằng <b>một dòng</b>: “một chuỗi của nó là rỗng, hoặc là 0, rồi một chuỗi của nó, rồi 1”.</p>
          <div class="box key">Hôm nay: văn phạm phi ngữ cảnh — quy tắc thay thế có <b>đệ quy</b>, nền của cú pháp mọi ngôn ngữ lập trình.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, ở bài 4, bổ đề bơm cho thấy không ô-tô-mát hữu hạn nào nhận được ngôn ngữ n chữ 0 rồi n chữ 1, vì máy phải đếm không giới hạn. Nhưng ngôn ngữ này mô tả được bằng một câu, một chuỗi của nó hoặc là rỗng, hoặc là 0, rồi một chuỗi của nó, rồi 1. Hôm nay ta học văn phạm phi ngữ cảnh, các quy tắc thay thế có đệ quy, nền của cú pháp mọi ngôn ngữ lập trình."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ngôn ngữ n chữ 0 rồi n chữ 1, và phép thay chữ"
    checks:
      - "['0' * n + '1' * n for n in range(4)] == ['', '01', '0011', '000111']"
      - "[len('0' * n + '1' * n) for n in range(4)] == [0, 2, 4, 6]"
      - "'0S1'.replace('S', '0S1') == '00S11' and len('00S11') == len('0S1') + 2"
      - "'00S11'.replace('S', '') == '0011'"
    steps:
      - show: |
          <table class="t"><tr><th>$n$</th><th>chuỗi $0^n 1^n$</th><th>độ dài $2n$</th></tr>
          <tr><td>0</td><td>$\varepsilon$</td><td>0</td></tr>
          <tr><td>1</td><td>$01$</td><td>2</td></tr>
          <tr><td>2</td><td>$0011$</td><td>4</td></tr>
          <tr><td>3</td><td>$000111$</td><td>6</td></tr></table>
        focus: [0, "1.2", "1.3", "1.5"]
        say: "Trước hết, nhắc lại ngôn ngữ n chữ 0 rồi n chữ 1 ở bài 4, nơi bổ đề bơm cho thấy không máy hữu hạn nào nhận được nó. Với n bằng 0, chuỗi là chuỗi rỗng, độ dài 0. Với n bằng 1 là 0 1, với n bằng 2 là 0 0 1 1, độ dài 4. Với n bằng 3 là ba chữ 0 rồi ba chữ 1, độ dài 6, tức là độ dài luôn bằng 2 n."
      - show: |
          <table class="t"><tr><th>chuỗi trước</th><th>thay chữ $S$ bằng</th><th>chuỗi sau</th><th>độ dài</th></tr>
          <tr><td>$0S1$</td><td>$0S1$</td><td>$00S11$</td><td>3 thành 5</td></tr>
          <tr><td>$00S11$</td><td>$\varepsilon$ (xoá)</td><td>$0011$</td><td>5 thành 4</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Phép thứ hai là phép thay chữ, giống lệnh tìm và thay trong trình soạn thảo. Trong chuỗi 0 S 1, thay chữ S bằng chính 0 S 1, ta được 0 0 S 1 1, dài thêm 2. Thay chữ S trong 0 0 S 1 1 bằng chuỗi rỗng, nghĩa là xoá nó đi, ta được 0 0 1 1, đúng một chuỗi của ngôn ngữ."

  - id: sym
    kind: symbol
    title: "Giải mã: biến, ký hiệu kết thúc, quy tắc"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td><b>biến</b></td><td>chữ hoa, còn phải thay tiếp</td><td>$S$</td></tr>
          <tr><td><b>ký hiệu kết thúc</b></td><td>ký hiệu của chuỗi cuối cùng</td><td>$0$, $1$</td></tr>
          <tr><td><b>quy tắc</b> $A \to w$</td><td>được thay biến $A$ bằng chuỗi $w$</td><td>$S \to 0S1$</td></tr>
          <tr><td>dấu $\mid$</td><td>gom nhiều quy tắc cùng vế trái</td><td>$S \to 0S1 \mid \varepsilon$</td></tr></table>
        introduces: [prod, alt]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Một văn phạm có bốn thành phần. Biến viết chữ hoa, như S, là thứ còn phải thay tiếp. Ký hiệu kết thúc là ký hiệu của chuỗi cuối cùng, ở đây là 0 và 1. Quy tắc A sinh ra w nghĩa là được thay biến A bằng chuỗi w, như S sinh ra 0 S 1. Dấu gạch đứng gom nhiều quy tắc cùng vế trái, nên dòng này là hai quy tắc, S sinh ra 0 S 1, hoặc S sinh ra chuỗi rỗng."
      - show: |
          <div class="box key"><b>Phi ngữ cảnh</b> = vế trái của mọi quy tắc chỉ là <b>một biến</b>. Gặp $S$ ở đâu cũng được thay, bất kể đứng cạnh ký hiệu nào.</div>
        say: "Phi ngữ cảnh nghĩa là vế trái của mọi quy tắc chỉ là một biến. Gặp S ở đâu cũng được thay, bất kể nó đứng cạnh ký hiệu nào."

  # ───────────────────────── 3. SUY DẪN ─────────────────────────
  - id: derive
    kind: concept
    title: "Suy dẫn và cây suy dẫn"
    checks:
      - "alg.cfg_lang({'S': ['0S1', '']}, 'S', 10) == {'0' * n + '1' * n for n in range(6)}"
      - "'S'.replace('S', '0S1').replace('S', '0S1').replace('S', '') == '0011'"
    steps:
      - show: |
          <p>Suy dẫn: mỗi bước thay <b>một</b> biến theo một quy tắc. Dấu $\Rightarrow$ đọc là “suy dẫn ra một bước”.</p>
          <p>$S \Rightarrow 0S1 \Rightarrow 00S11 \Rightarrow 0011$ — hai lần dùng $S \to 0S1$, lần cuối dùng $S \to \varepsilon$. Hết biến thì dừng.</p>
          <p>Ngôn ngữ của văn phạm = mọi chuỗi <b>chỉ gồm ký hiệu kết thúc</b> suy dẫn được từ $S$. Ở đây đúng là $\{0^n 1^n\}$.</p>
        introduces: [derive]
        focus: [1, 1, 2, 2, 3, 3]
        say: "Một suy dẫn là chuỗi các bước, mỗi bước thay một biến theo một quy tắc. Dấu mũi tên đôi đọc là suy dẫn ra một bước. Từ S, hai lần dùng quy tắc S sinh ra 0 S 1, ta được 0 0 S 1 1, rồi dùng quy tắc chuỗi rỗng thì được 0 0 1 1. Hết biến thì dừng. Ngôn ngữ của văn phạm là mọi chuỗi chỉ gồm ký hiệu kết thúc suy dẫn được từ S. Máy kiểm trên mọi chuỗi tới độ dài 10, ở đây đúng là n chữ 0 rồi n chữ 1."
      - clear: true
        show: |
          <div><svg width="560" height="356" viewBox="0 0 560 356"><line x1="280" y1="56" x2="40" y2="110" stroke="#9ca3af" stroke-width="3"/><line x1="280" y1="148" x2="160" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="280" y1="240" x2="280" y2="294" stroke="#9ca3af" stroke-width="3"/><line x1="280" y1="148" x2="280" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="280" y1="148" x2="400" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="280" y1="56" x2="280" y2="110" stroke="#9ca3af" stroke-width="3"/><line x1="280" y1="56" x2="520" y2="110" stroke="#9ca3af" stroke-width="3"/><text x="40" y="142" font-size="32" font-weight="700" text-anchor="middle">0</text><text x="160" y="234" font-size="32" font-weight="700" text-anchor="middle">0</text><text x="280" y="326" font-size="32" font-style="italic" fill="#6b7280" text-anchor="middle" font-family="KaTeX_Math, serif">&#949;</text><text x="280" y="234" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">S</text><text x="400" y="234" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="280" y="142" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">S</text><text x="520" y="142" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="280" y="50" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">S</text></svg></div>
          <p>Cây suy dẫn: gốc là $S$; các con của một nút là vế phải của quy tắc đã dùng. Đọc lá từ trái sang phải (bỏ $\varepsilon$) được $0011$.</p>
        focus: [1, 2, 2]
        say: "Cây suy dẫn vẽ cùng quá trình đó. Gốc là S, và các con của một nút là vế phải của quy tắc đã dùng ở nút đó. Đọc các lá từ trái sang phải, bỏ chuỗi rỗng, ta được đúng chuỗi 0 0 1 1."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ngoặc cân bằng: S → (S)S | ε"
    checks:
      - "__import__('functools').reduce(lambda acc, r: acc + [acc[-1].replace('S', r, 1)], ['(S)S', '', '(S)S', '', ''], ['S']) == ['S', '(S)S', '()S', '()(S)S', '()()S', '()()']"
      - "alg.cfg_lang({'S': ['(S)S', '']}, 'S', 8) == {w for w in alg.strings('()', 8) if alg.balanced(w)}"
      - "sorted(w for w in alg.strings('()', 6, exact=True) if alg.balanced(w)) == sorted(['((()))', '(()())', '(())()', '()(())', '()()()'])"
      - "[sum(alg.balanced(w) for w in alg.strings('()', 2 * n, exact=True)) for n in range(5)] == [1, 1, 2, 5, 14]"
    steps:
      - show: |
          <p>Một chuỗi ngoặc cân bằng hoặc rỗng, hoặc là “mở, một chuỗi cân bằng, đóng, rồi một chuỗi cân bằng nữa”: $S \to (S)S \mid \varepsilon$.</p>
          <p>Suy dẫn $()()$, mỗi bước thay biến $S$ đứng <b>đầu tiên</b>:</p>
        focus: [1, 1, 2]
        say: "Một chuỗi ngoặc cân bằng hoặc là rỗng, hoặc là mở ngoặc, một chuỗi cân bằng, đóng ngoặc, rồi một chuỗi cân bằng nữa. Viết thành văn phạm, S sinh ra mở ngoặc S đóng ngoặc S, hoặc chuỗi rỗng. Suy dẫn chuỗi hai cặp ngoặc liền nhau mất năm bước, mỗi bước thay biến S đứng đầu tiên."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 1</td><td style="width:46%">$S \to (S)S$</td><td>$S \Rightarrow (S)S$</td></tr></table>
        say: "Bước một, chuỗi chỉ có một biến S, ta thay nó theo quy tắc mở ngoặc S đóng ngoặc S, được mở ngoặc, S, đóng ngoặc, S."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 2</td><td style="width:46%">$S$ đầu tiên $\to \varepsilon$</td><td>$(S)S \Rightarrow ()S$</td></tr></table>
        say: "Bước hai, biến S đầu tiên nằm trong cặp ngoặc, ta xoá nó theo quy tắc chuỗi rỗng, nên được một cặp ngoặc rồi biến S."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 3</td><td style="width:46%">$S \to (S)S$</td><td>$()S \Rightarrow ()(S)S$</td></tr></table>
        say: "Bước ba, biến S còn lại đứng sau cặp ngoặc thứ nhất, ta thay nó bằng mở ngoặc S đóng ngoặc S để tạo cặp ngoặc thứ hai."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 4</td><td style="width:46%">$S$ đầu tiên $\to \varepsilon$</td><td>$()(S)S \Rightarrow ()()S$</td></tr></table>
        say: "Bước bốn, xoá biến S đầu tiên, nằm trong cặp ngoặc thứ hai, theo quy tắc chuỗi rỗng."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 5</td><td style="width:46%">$S \to \varepsilon$</td><td>$()()S \Rightarrow \hl{()()}$</td></tr></table>
        say: "Bước năm, xoá biến S cuối cùng, chuỗi hết biến nên dừng, và ta được đúng hai cặp ngoặc liền nhau."
      - clear: true
        show: |
          <p>Độ dài 6 có đúng $\hl{5}$ chuỗi cân bằng: $((()))$, $(()())$, $(())()$, $()(())$, $()()()$.</p>
          <p>Theo số cặp ngoặc 0, 1, 2, 3, 4, số chuỗi là $1, 1, 2, 5, 14$ — dãy <b>số Catalan</b>, cũng là dãy đếm các cây nhị phân.</p>
          <p class="note">Máy kiểm: văn phạm sinh <b>đúng</b> các chuỗi cân bằng, không thừa không thiếu, với mọi độ dài tới 8.</p>
        focus: [1, 2, 3]
        say: "Độ dài 6 có đúng 5 chuỗi cân bằng, như trên màn hình. Theo số cặp ngoặc 0, 1, 2, 3, 4, số chuỗi lần lượt là 1, 1, 2, 5, 14, chính là dãy số Catalan, dãy số đếm các cây nhị phân. Máy đã kiểm văn phạm sinh đúng các chuỗi cân bằng, không thừa không thiếu, với mọi độ dài tới 8."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: hai chiều"
    checks:
      - "(lambda m: [sum(m(w) == 2 * i + 2 for w in alg.strings('()', 6, exact=True) if alg.balanced(w)) for i in range(3)])(lambda w: next(k for k in range(1, len(w) + 1) if w[:k].count('(') == w[:k].count(')'))) == [2, 1, 2]"
      - "(lambda C: [C[i] * C[2 - i] for i in range(3)] == [2, 1, 2] and sum(C[i] * C[2 - i] for i in range(3)) == 5)([1, 1, 2])"
      - "all(alg.balanced(w) for w in alg.cfg_lang({'S': ['(S)S', '']}, 'S', 8))"
      - "all(w in alg.cfg_lang({'S': ['(S)S', '']}, 'S', 8) for w in alg.strings('()', 8) if alg.balanced(w))"
    steps:
      - show: |
          <table class="t"><tr><th>chiều</th><th>lý do</th></tr>
          <tr><td><b>Không thừa:</b> mọi chuỗi văn phạm sinh ra đều cân bằng</td><td>$S \to (S)S$ thêm đúng một cặp, mở đứng trước đóng; $S \to \varepsilon$ không thêm gì</td></tr>
          <tr><td><b>Không thiếu:</b> mọi chuỗi cân bằng đều sinh được</td><td>tách tại dấu đóng khớp với dấu mở đầu tiên</td></tr>
          <tr><td><b>Đối chiếu bằng máy</b> cả hai chiều</td><td>mọi chuỗi ngoặc độ dài tới 8</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm một văn phạm phải theo hai chiều. Một, không thừa, mọi chuỗi văn phạm sinh ra đều cân bằng, vì quy tắc mở ngoặc S đóng ngoặc S thêm đúng một cặp, mở trước đóng, còn quy tắc rỗng không thêm gì. Hai, không thiếu, mọi chuỗi cân bằng đều sinh được, bằng cách tách tại dấu đóng khớp với dấu mở đầu tiên. Ba, đối chiếu bằng máy cả hai chiều trên mọi chuỗi ngoặc độ dài tới 8."
      - clear: true
        show: |
          <p>Đường khác cho số 5: tách mỗi chuỗi dài 6 thành $(A)B$ tại dấu đóng khớp với dấu mở đầu tiên. $A$ có $i$ cặp, $B$ có $2 - i$ cặp.</p>
          <table class="t"><tr><th>$i$</th><th>số cách chọn $A$</th><th>số cách chọn $B$</th><th>tích</th><th>các chuỗi</th></tr>
          <tr><td>0</td><td>1</td><td>2</td><td>2</td><td>$()(())$, $()()()$</td></tr>
          <tr><td>1</td><td>1</td><td>1</td><td>1</td><td>$(())()$</td></tr>
          <tr><td>2</td><td>2</td><td>1</td><td>2</td><td>$((()))$, $(()())$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Bây giờ đếm lại số 5 bằng một đường khác, không liệt kê mò. Mỗi chuỗi dài 6 tách được thành mở ngoặc A đóng ngoặc B, tại dấu đóng khớp với dấu mở đầu tiên, nên A có i cặp và B có 2 trừ i cặp. Khi i bằng 0, A rỗng và B có 2 cặp, có 2 cách, tích bằng 2. Khi i bằng 1, mỗi bên có 1 cặp, tích bằng 1. Khi i bằng 2, A có 2 cách, B rỗng, tích bằng 2."
      - show: |
          $$2 + 1 + 2 = \hl{5}$$
        say: "Cộng ba trường hợp, 2 cộng 1 cộng 2 bằng 5, khớp với 5 chuỗi đã liệt kê. Đây cũng chính là cách văn phạm sinh chuỗi, vì quy tắc mở ngoặc S đóng ngoặc S tách đúng tại chỗ đó."
  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.cfg_lang({'S': ['0S', '1S', '01']}, 'S', 8) == {w for w in alg.strings('01', 8) if w.endswith('01')}"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Hiểu “phi ngữ cảnh” là “không có ngữ cảnh, không có nghĩa” <b class="red">(sai)</b>
          <br><span class="note">Tên chỉ nói về <b>dạng quy tắc</b>: vế trái một biến, thay không cần nhìn hàng xóm.</span></div>
        say: "Lỗi thứ nhất, hiểu phi ngữ cảnh là không có ngữ cảnh hay không có nghĩa. Tên gọi chỉ nói về dạng quy tắc, vế trái là một biến, và được thay mà không cần nhìn các ký hiệu bên cạnh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dừng khi chuỗi còn biến <b class="red">(chưa xong)</b>
          <br><span class="note">$00S11$ chưa thuộc ngôn ngữ. Chỉ chuỗi <b>hết biến</b> mới được tính.</span></div>
        say: "Lỗi thứ hai, dừng khi chuỗi còn biến. Chuỗi 0 0 S 1 1 chưa thuộc ngôn ngữ, chỉ chuỗi đã hết biến mới được tính."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên quy tắc kết thúc đệ quy <b class="red">(sai)</b>
          <br><span class="note">Chỉ có $S \to 0S1$ thì không bao giờ hết biến: ngôn ngữ là $\emptyset$. Phải có lối ra như $S \to \varepsilon$.</span></div>
          $$S \Rightarrow 0S1 \Rightarrow 00S11 \Rightarrow 000S111 \Rightarrow \dots$$
        focus: [1, 2, 1]
        say: "Lỗi thứ ba, quên quy tắc kết thúc đệ quy. Nếu chỉ có quy tắc S sinh ra 0 S 1 thì như dòng công thức, mỗi bước lại để lại một chữ S, không bao giờ hết biến, và ngôn ngữ là tập rỗng. Phải có một lối ra như quy tắc sinh chuỗi rỗng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ văn phạm và biểu thức chính quy là hai thế giới tách rời <b class="red">(sai)</b>
          <br><span class="note">Mọi ngôn ngữ chính quy đều có văn phạm: “kết thúc bằng 01” là $S \to 0S \mid 1S \mid 01$. Văn phạm mạnh <b>hơn</b>, không chỉ khác.</span></div>
        say: "Lỗi thứ tư, nghĩ văn phạm và biểu thức chính quy là hai thế giới tách rời. Mọi ngôn ngữ chính quy đều có văn phạm, ví dụ kết thúc bằng 0 1 có văn phạm như trên màn hình, nên văn phạm mạnh hơn chứ không chỉ khác."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sum(alg.balanced(w) for w in alg.strings('()', 8, exact=True)) == 14"
      - "alg.cfg_lang({'S': ['0S11', '']}, 'S', 9) == {'0' * n + '1' * (2 * n) for n in range(4)}"
      - "1 * 5 + 1 * 2 + 2 * 1 + 5 * 1 == 5 + 2 + 2 + 5 == 14"
      - "'S'.replace('S', '0S11').replace('S', '0S11').replace('S', '') == '001111' == '0' * 2 + '1' * 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Có bao nhiêu chuỗi ngoặc cân bằng độ dài 8?</td></tr>
          <tr><td>2</td><td>Viết văn phạm cho $\{0^n 1^{2n}\}$: $n$ chữ 0 rồi $2n$ chữ 1.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có bao nhiêu chuỗi ngoặc cân bằng độ dài 8? Câu hai, viết văn phạm cho ngôn ngữ n chữ 0 rồi 2 n chữ 1. Dừng video và làm ra giấy."
        pause: 12
      - show: |
          <p>① Bốn cặp ngoặc. Tách $(A)B$: $A$ có $i$ cặp, $B$ có $3 - i$ cặp, dùng dãy $1, 1, 2, 5$:</p>
          $$1 \times 5 + 1 \times 2 + 2 \times 1 + 5 \times 1 = 5 + 2 + 2 + 5 = \hl{14}$$
        focus: [1, 2, 2]
        say: "Đáp án câu một, bốn cặp ngoặc cho số Catalan thứ tư, là 14 chuỗi. Kiểm lại bằng cách tách mở ngoặc A đóng ngoặc B như phần tự kiểm, A có i cặp và B có 3 trừ i cặp. Bốn trường hợp cho 5, 2, 2 và 5, cộng lại bằng 14."
      - clear: true
        show: |
          <p>② $S \to 0S11 \mid \varepsilon$: mỗi lần thêm một chữ 0 thì thêm <b>hai</b> chữ 1.</p>
          $$S \Rightarrow 0S11 \Rightarrow 00S1111 \Rightarrow 001111$$
        focus: [1, 2, 2]
        say: "Câu hai, S sinh ra 0 S 1 1, hoặc chuỗi rỗng, vì mỗi lần thêm một chữ 0 thì thêm hai chữ 1. Làm thử với n bằng 2, dùng quy tắc đầu hai lần rồi xoá S. Kết quả có hai chữ 0 và bốn chữ 1, đúng dạng n chữ 0 rồi 2 n chữ 1."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quy tắc: một biến → chuỗi</span><span class="a">→</span>
          <span class="n">suy dẫn tới khi hết biến</span><span class="a">→</span>
          <span class="n">cây suy dẫn</span><span class="a">→</span>
          <span class="n">mạnh hơn chính quy</span></div>
        say: "Tổng kết lại, mỗi quy tắc thay một biến bằng một chuỗi, ta suy dẫn cho đến khi hết biến, và cây suy dẫn ghi lại quá trình đó. Văn phạm phi ngữ cảnh mạnh hơn ngôn ngữ chính quy, vì nó có đệ quy."
      - show: |
          <div class="box key"><b>Tư duy:</b> cấu trúc <b>lồng nhau</b> (ngoặc, khối lệnh, thẻ HTML) cần đệ quy — tức văn phạm, không phải biểu thức chính quy.</div>
        say: "Điều cần mang theo, cấu trúc lồng nhau như ngoặc, khối lệnh hay thẻ lồng trong trang mạng cần đệ quy, tức là văn phạm, không phải biểu thức chính quy."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): một chuỗi có <b>hai</b> cây suy dẫn thì sao? <b>Văn phạm mơ hồ</b> và cách trình biên dịch phân tích $1 + 2 \times 3$.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta xem điều gì xảy ra khi một chuỗi có hai cây suy dẫn, gọi là văn phạm mơ hồ. Ta cũng xem cách trình biên dịch phân tích cú pháp biểu thức 1 cộng 2 nhân 3. Hẹn gặp bạn ở bài tiếp theo."
