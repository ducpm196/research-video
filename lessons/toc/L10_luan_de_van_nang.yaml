scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một cỗ máy, mọi chương trình"
    steps:
      - show: |
          <p>Máy giặt chỉ giặt, máy tính bỏ túi chỉ tính. Nhưng chiếc máy tính của bạn chạy được trình duyệt, trò chơi, trình biên dịch — chỉ bằng cách nạp <b>chương trình khác</b>.</p>
          <p>Ý tưởng “chương trình cũng là dữ liệu” có từ năm 1936, trước khi có máy tính điện tử.</p>
          <div class="box key">Hôm nay: luận đề Church–Turing — máy Turing bắt được trọn khái niệm “thuật toán” — và máy Turing <b>vạn năng</b>.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, máy giặt chỉ giặt, máy tính bỏ túi chỉ tính. Nhưng chiếc máy tính của bạn chạy được trình duyệt, trò chơi, trình biên dịch, chỉ bằng cách nạp chương trình khác. Ý tưởng chương trình cũng là dữ liệu có từ năm 1936, trước cả khi có máy tính điện tử. Hôm nay ta học luận đề mang tên Turing, nói máy Turing bắt được trọn khái niệm thuật toán, và học máy Turing vạn năng."

  # ───────────────────────── 2. LUẬN ĐỀ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: một máy Turing chạy từng bước"
    checks:
      - "[(q, i, s) for q, i, s in alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1011', 3, 'C')[3]] == [('C', 3, '1011'), ('C', 2, '1010'), ('C', 1, '1000')]"
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1011', 3, 'C')[:3] == ('1100', 3, 'H')"
      - "int('1011', 2) + 1 == int('1100', 2) == 12"
    steps:
      - show: |
          <p>Ôn lại: máy Turing có một <b>băng</b> chia ô, một <b>đầu đọc</b> và một <b>trạng thái</b>. Mỗi dòng của bảng chuyển nói: ở trạng thái này, đọc ký hiệu này, thì ghi gì, dời đầu đọc về đâu (T trái, P phải, Đ đứng yên), sang trạng thái nào.</p>
          <table class="t"><tr><th>bảng cộng một</th><th>đọc</th><th>ghi, dời, sang</th></tr>
          <tr><td>trạng thái C</td><td>1</td><td>ghi 0, sang trái, vẫn C</td></tr>
          <tr><td>trạng thái C</td><td>0 hoặc ô trống</td><td>ghi 1, đứng yên, dừng</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn lại máy Turing của bài 9. Máy có một băng chia ô, một đầu đọc và một trạng thái. Mỗi dòng của bảng chuyển nói rằng ở trạng thái này, đọc ký hiệu này, thì ghi gì, dời đầu đọc về đâu, và sang trạng thái nào. Bảng cộng một có hai dòng, ở trạng thái C mà đọc 1 thì ghi 0 rồi sang trái. Còn đọc 0 hoặc ô trống thì ghi 1 rồi dừng."
      - show: |
          <table class="t"><tr><th>bước</th><th>đầu ở ô</th><th>băng trước</th><th>đọc</th><th>làm</th></tr>
          <tr><td>1</td><td>3</td><td>1011</td><td>1</td><td>ghi 0, sang trái</td></tr>
          <tr><td>2</td><td>2</td><td>1010</td><td>1</td><td>ghi 0, sang trái</td></tr>
          <tr><td>3</td><td>1</td><td>1000</td><td>0</td><td>ghi 1, dừng → $\hl{1100}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Chạy thử trên 1 0 1 1, đầu đọc bắt đầu ở ô cuối, ô số 3. Bước một, đọc 1, ghi 0 và sang trái, băng thành 1 0 1 0. Bước hai, lại đọc 1, ghi 0 và sang trái, băng thành 1 0 0 0. Bước ba, đọc 0, ghi 1 rồi dừng, băng cuối là 1 1 0 0, đúng bằng 11 cộng 1 bằng 12."

  - id: sym
    kind: symbol
    title: "Giải mã: luận đề Church–Turing"
    steps:
      - show: |
          <div class="box key"><b>Luận đề Church–Turing.</b> Mọi việc tính được bằng một <b>thuật toán</b> — một thủ tục gồm hữu hạn bước rõ ràng, máy móc — đều tính được bằng một máy Turing.</div>
          <p>Vế “thuật toán” là khái niệm <b>không hình thức</b>; vế “máy Turing” là định nghĩa toán học chính xác. Không chứng minh được một mệnh đề nối hai thứ đó — nên gọi là <b>luận đề</b>, không phải định lý.</p>
        focus: [1, 2, 2]
        say: "Luận đề mang tên Turing phát biểu như sau, mọi việc tính được bằng một thuật toán, tức một thủ tục gồm hữu hạn bước rõ ràng và máy móc, đều tính được bằng một máy Turing. Vế thuật toán là khái niệm không hình thức, còn vế máy Turing là một định nghĩa toán học chính xác. Không thể chứng minh một mệnh đề nối hai thứ đó, nên nó được gọi là luận đề, không phải định lý."

  # ───────────────────────── 3. BẰNG CHỨNG ─────────────────────────
  - id: evidence
    kind: concept
    title: "Vì sao người ta tin"
    steps:
      - show: |
          <ul><li>Trong khoảng 1932 tới 1936, ba mô hình ra đời độc lập: máy Turing, phép tính lambda (Church), hàm đệ quy (Gödel, Kleene). Chúng được chứng minh <b>tương đương</b>: tính được đúng cùng các hàm.</li>
          <li>Mọi mô hình sau này — máy nhiều băng, máy truy cập ngẫu nhiên, các ngôn ngữ lập trình — đều mô phỏng được bằng máy Turing.</li>
          <li>Chưa ai tìm được một thủ tục máy móc mà máy Turing không làm được.</li></ul>
        focus: ["1.1", "1.1", "1.1", "1.2", "1.3"]
        say: "Vì sao người ta tin luận đề này? Trong khoảng 1932 tới 1936, ba mô hình ra đời độc lập là máy Turing, phép tính lam-đa, và các hàm đệ quy. Chúng được chứng minh tương đương, tính được đúng cùng các hàm. Mọi mô hình sau này, như máy nhiều băng, máy truy cập ngẫu nhiên, hay các ngôn ngữ lập trình, đều mô phỏng được bằng máy Turing. Và đến nay chưa ai tìm được một thủ tục máy móc mà máy Turing không làm được."

  # ───────────────────────── 4. MÁY VẠN NĂNG ─────────────────────────
  - id: universal
    kind: concept
    title: "Máy vạn năng = trình thông dịch"
    steps:
      - show: |
          <p>Viết bảng chuyển của máy $M$ thành một chuỗi $\langle M \rangle$. Máy vạn năng $U$ nhận $\langle M \rangle$ cùng đầu vào $w$, rồi làm đúng điều $M$ sẽ làm trên $w$.</p>
          <div class="code"><div>def chay(bang_chuyen, bang, dau, q):</div><div>    while (q, bang.get(dau, "_")) in bang_chuyen:</div>
          <div>        q, ghi, di = bang_chuyen[(q, bang.get(dau, "_"))]</div><div>        bang[dau] = ghi</div>
          <div>        dau = dau + {"T": -1, "P": 1, "Đ": 0}[di]</div><div>    return bang, q</div></div>
          <p class="note">bang: từ điển “vị trí ô → ký hiệu”; ô chưa ghi đọc ra "_" (ô trống), nên đầu đọc đi xa bao nhiêu cũng được.</p>
        introduces: [enc]
        focus: [1, 1, 2, "2.2", "2.3", 3]
        say: "Viết bảng chuyển của một máy M thành một chuỗi, gọi là mã của M. Máy vạn năng U nhận mã của M cùng đầu vào w, rồi làm đúng điều M sẽ làm trên w. Đoạn mã sáu dòng trên màn hình làm đúng việc đó, nó là một trình thông dịch. Mỗi vòng lặp tra bảng chuyển theo trạng thái và ký hiệu đang đọc. Rồi nó ghi ký hiệu mới, dời đầu đọc, và đổi trạng thái. Băng là một từ điển, ô chưa ghi đọc ra ô trống, nên đầu đọc đi xa bao nhiêu cũng được."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bên trong máy vạn năng: một vòng tra bảng"
    steps:
      - clear: true
        show: |
          <div><svg width="1400" height="500" viewBox="0 0 1400 500"><defs><marker id="aU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="475" y="50" font-size="24" text-anchor="middle" fill="#1d4ed8">mã của M: bảng chuyển, chỉ là dữ liệu</text><text x="1140" y="50" font-size="24" text-anchor="middle" fill="#b91c1c">đầu vào w của M</text><rect x="40" y="70" width="290" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="185" y="120" font-size="24" text-anchor="middle" fill="#1f2937">(F, 0) → ghi 1, P, F</text><rect x="330" y="70" width="290" height="80" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="475" y="120" font-size="24" text-anchor="middle" fill="#1f2937">(F, 1) → ghi 0, P, F</text><rect x="620" y="70" width="290" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="765" y="120" font-size="24" text-anchor="middle" fill="#1f2937">(F, trống) → dừng</text><rect x="910" y="70" width="70" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="945" y="122" font-size="32" text-anchor="middle" fill="#1f2937">#</text><rect x="980" y="70" width="90" height="80" fill="#fecaca" stroke="#1f2937" stroke-width="3"/><text x="1025" y="124" font-size="34" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="1070" y="70" width="90" height="80" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1115" y="124" font-size="34" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="1160" y="70" width="90" height="80" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1205" y="124" font-size="34" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="1250" y="70" width="90" height="80" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1295" y="124" font-size="34" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><g font-size="24" text-anchor="middle" fill="#1f2937"><rect x="40" y="290" width="400" height="90" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="240" y="330">1. đọc ô dưới đầu của M</text><text x="240" y="362">thấy 1, trạng thái F</text><rect x="500" y="290" width="400" height="90" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="700" y="330">2. tìm trong mã dòng (F, 1)</text><text x="700" y="362">được: ghi 0, P, F</text><rect x="960" y="290" width="400" height="90" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1160" y="330">3. ghi 0 lên băng của M</text><text x="1160" y="362">dời đầu sang phải</text></g><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="440" y1="335" x2="494" y2="335" marker-end="url(#aU)"/><line x1="900" y1="335" x2="954" y2="335" marker-end="url(#aU)"/><path d="M1160,380 C1160,450 240,450 240,386" marker-end="url(#aU)"/></g><g fill="none" stroke-width="3" stroke-dasharray="10 8"><line x1="240" y1="290" x2="1015" y2="156" stroke="#b91c1c" marker-end="url(#aU)"/><line x1="700" y1="290" x2="475" y2="156" stroke="#b45309" marker-end="url(#aU)"/><line x1="1160" y1="290" x2="1025" y2="156" stroke="#15803d" marker-end="url(#aU)"/></g><text x="700" y="488" font-size="22" text-anchor="middle" fill="#374151">lặp lại tới khi không còn dòng nào khớp</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình cho thấy băng của máy vạn năng U. Bên trái là mã của M, ba dòng của bảng đảo bit, viết thành ký hiệu như mọi dữ liệu khác. Sau dấu thăng là đầu vào của M, chuỗi 1 0 1 1, ô đỏ là chỗ đầu đọc của M đang đứng. Mỗi vòng, U đọc ô dưới đầu của M, tìm trong mã dòng khớp với trạng thái và ký hiệu đó, rồi ghi, dời đầu, và đổi trạng thái đúng như dòng ấy nói. Vòng lặp này chạy tới khi không còn dòng nào khớp, đó là lúc M dừng."

  - id: example
    kind: example
    title: "Một bộ mô phỏng, ba máy"
    checks:
      - "[(q, i, s) for q, i, s in alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '1011', 0, 'F')[3]] == [('F', 0, '1011'), ('F', 1, '0011'), ('F', 2, '0111'), ('F', 3, '0101'), ('F', 4, '0100')]"
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1011', 3, 'C')[:3] == ('1100', 3, 'H')"
      - "alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '1011', 0, 'F')[:3] == ('0100', 5, 'H')"
      - "alg.tm_run({('q0', '0'): ('q1', 'x', 'R'), ('q0', 'y'): ('q3', 'y', 'R'), ('q0', '_'): ('H', '_', 'S'), ('q1', '0'): ('q1', '0', 'R'), ('q1', 'y'): ('q1', 'y', 'R'), ('q1', '1'): ('q2', 'y', 'L'), ('q2', '0'): ('q2', '0', 'L'), ('q2', 'y'): ('q2', 'y', 'L'), ('q2', 'x'): ('q0', 'x', 'R'), ('q3', 'y'): ('q3', 'y', 'R'), ('q3', '_'): ('H', '_', 'S')}, '0011', 0, 'q0')[1:3] == (13, 'H')"
      - "all((alg.tm_run({('q0', '0'): ('q1', 'x', 'R'), ('q0', 'y'): ('q3', 'y', 'R'), ('q0', '_'): ('H', '_', 'S'), ('q1', '0'): ('q1', '0', 'R'), ('q1', 'y'): ('q1', 'y', 'R'), ('q1', '1'): ('q2', 'y', 'L'), ('q2', '0'): ('q2', '0', 'L'), ('q2', 'y'): ('q2', 'y', 'L'), ('q2', 'x'): ('q0', 'x', 'R'), ('q3', 'y'): ('q3', 'y', 'R'), ('q3', '_'): ('H', '_', 'S')}, w, 0, 'q0')[2] == 'H') == (w == '0' * (len(w) // 2) + '1' * (len(w) // 2)) for w in alg.strings('01', 10))"
    steps:
      - clear: true
        show: |
          <p>Nạp bảng đảo bit, đầu vào $1011$, đầu đọc ở ô 0. Bộ mô phỏng làm từng vòng:</p>
          <table class="t"><tr><th>vòng</th><th>ô</th><th>đọc</th><th>dòng tra được</th><th>băng sau</th></tr>
          <tr><td>Bước 1</td><td>0</td><td>1</td><td>ghi 0, sang phải</td><td>0011</td></tr></table>
        focus: [1, 2]
        say: "Giờ ta làm đúng việc của bộ mô phỏng với bảng đảo bit, đầu vào 1 0 1 1, đầu đọc ở ô 0. Bước một, ô 0 có chữ 1, dòng tra được nói ghi 0 rồi sang phải, nên băng thành 0 0 1 1."
      - show: |
          <table class="t"><tr><td>Bước 2</td><td>1</td><td>0</td><td>ghi 1, sang phải</td><td>0111</td></tr></table>
        say: "Bước hai, đầu đọc ở ô 1, đọc chữ 0, dòng tra được nói ghi 1 rồi sang phải, nên băng thành 0 1 1 1."
      - show: |
          <table class="t"><tr><td>Bước 3</td><td>2</td><td>1</td><td>ghi 0, sang phải</td><td>0101</td></tr>
          <tr><td>Bước 4</td><td>3</td><td>1</td><td>ghi 0, sang phải</td><td>0100</td></tr></table>
        focus: ["1.1", "1.2"]
        say: "Bước ba, ô 2 có chữ 1, ghi 0, băng thành 0 1 0 1. Bước bốn, ô 3 cũng có chữ 1, ghi 0, băng thành 0 1 0 0."
      - show: |
          <table class="t"><tr><td>Bước 5</td><td>4</td><td>ô trống</td><td>dừng</td><td>$\hl{0100}$</td></tr></table>
        say: "Bước năm, ô 4 là ô trống, dòng tra được nói dừng. Băng cuối là 0 1 0 0, sau đúng 5 bước, và bộ mô phỏng không hề biết nó đang đảo bit, nó chỉ tra bảng."
      - clear: true
        show: |
          <table class="t"><tr><th>bảng chuyển nạp vào</th><th>đầu vào</th><th>kết quả</th><th>số bước</th></tr>
          <tr><td>cộng một (bài 9)</td><td>$1011$</td><td>$1100$</td><td>3</td></tr>
          <tr><td>đảo bit: đi phải, đổi 0 ↔ 1, gặp ô trống thì dừng</td><td>$1011$</td><td>$0100$</td><td>5</td></tr>
          <tr><td>gạch cặp: gạch một chữ 0 rồi một chữ 1, lặp lại</td><td>$0011$</td><td><b>nhận</b></td><td>13</td></tr></table>
          <div class="box key">Cùng sáu dòng mã, chỉ đổi <b>dữ liệu</b> là bảng chuyển, ta được ba máy khác nhau. Máy thứ ba quyết định $\{0^n 1^n\}$ — ngôn ngữ mà ôtômat hữu hạn không làm được.</div>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Cùng một bộ mô phỏng, ta nạp ba bảng chuyển khác nhau. Bảng cộng một của bài 9 biến 1 0 1 1 thành 1 1 0 0 sau 3 bước. Bảng đảo bit đi sang phải, đổi 0 thành 1 và 1 thành 0, được 0 1 0 0 sau 5 bước. Bảng gạch cặp gạch một chữ 0 rồi một chữ 1 và lặp lại, nhận chuỗi 0 0 1 1 sau 13 bước. Cùng sáu dòng mã, chỉ đổi dữ liệu là bảng chuyển, ta được ba máy khác nhau. Máy thứ ba quyết định ngôn ngữ n chữ 0 rồi n chữ 1, điều ô-tô-mát hữu hạn không làm được."

  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "len('1011') + 1 == 5 and ''.join('1' if c == '0' else '0' for c in '1011') == '0100'"
      - "len([w for w in alg.strings('01', 8) if w]) == 510"
      - "all(alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, w, 0, 'F')[:3] == (''.join('1' if c == '0' else '0' for c in w), len(w) + 1, 'H') for w in alg.strings('01', 8) if w)"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác: suy ra, không chạy</th><th>kết quả</th></tr>
          <tr><td>mỗi vòng đầu đọc sang phải một ô; 4 chữ số rồi 1 ô trống</td><td>$4 + 1 = 5$ bước ✓</td></tr>
          <tr><td>mỗi chữ số bị đảo đúng một lần: đảo $1011$ từng chữ</td><td>$0100$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Tự kiểm bằng đường khác, suy ra thay vì chạy. Mỗi vòng đầu đọc sang phải đúng một ô, qua 4 chữ số rồi gặp 1 ô trống, nên 4 cộng 1 bằng 5 bước, khớp. Mỗi chữ số bị đảo đúng một lần, đảo từng chữ của 1 0 1 1 được 0 1 0 0, cũng khớp."
      - show: |
          <table class="t"><tr><th>máy thử hết</th><th>kết quả</th></tr>
          <tr><td>mọi chuỗi khác rỗng độ dài 1 tới 8: $2 + 4 + \dots + 256 = 510$ chuỗi</td><td>cả 510 lần: băng cuối = chuỗi đảo, số bước = độ dài + 1 ✓</td></tr></table>
        focus: [0, "1.2"]
        say: "Rồi cho máy thử hết, vì suy luận bằng tay vẫn có thể sót, mọi chuỗi khác rỗng có độ dài từ 1 tới 8, tổng cộng 510 chuỗi. Cả 510 lần, băng cuối đều là chuỗi đảo, và số bước đều bằng độ dài cộng 1."
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>trả lời</th></tr>
          <tr><td>Máy vạn năng có thật không?</td><td>Bộ mô phỏng là một chương trình, nên theo luận đề có một máy Turing làm đúng việc của nó — đó là $U$.</td></tr>
          <tr><td>Luận đề nói gì về tốc độ?</td><td>Không gì: nó nói <b>cái gì</b> tính được, không nói tính <b>nhanh</b> đến đâu.</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Còn hai câu hỏi về ý nghĩa, câu đầu là máy vạn năng có thật hay không. Bộ mô phỏng là một chương trình, nên theo luận đề có một máy Turing làm đúng việc của nó, đó chính là U. Và luôn phân biệt, luận đề nói về cái gì tính được, không nói tính nhanh đến đâu."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.tm_run({('A', '_'): ('A', '_', 'S')}, '', 0, 'A', limit=10000)[1:3] == (10000, 'A')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gọi luận đề là định lý đã được chứng minh <b class="red">(sai)</b>
          <br><span class="note">Một vế là khái niệm không hình thức. Luận đề có thể bị bác bỏ bởi một phản ví dụ, nhưng không thể được chứng minh.</span></div>
        say: "Lỗi thứ nhất, gọi luận đề là định lý đã được chứng minh. Một vế của nó là khái niệm không hình thức, nên luận đề có thể bị bác bỏ bởi một phản ví dụ, nhưng không thể được chứng minh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ máy tính hiện đại mạnh hơn máy Turing <b class="red">(sai)</b>
          <br><span class="note">Nhanh hơn rất nhiều, nhưng không tính được thêm hàm nào. Mỗi bước của bộ xử lý mô phỏng được bằng nhiều bước trên băng.</span></div>
        say: "Lỗi thứ hai, nghĩ máy tính hiện đại mạnh hơn máy Turing. Nó nhanh hơn rất nhiều, nhưng không tính được thêm hàm nào, vì mỗi bước của bộ xử lý đều mô phỏng được bằng nhiều bước trên băng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Hiểu “vạn năng” là giải được mọi bài toán <b class="red">(sai)</b>
          <br><span class="note">$U$ chỉ <b>chạy theo</b> máy khác. Nếu máy đó chạy mãi thì $U$ cũng chạy mãi. Vạn năng không phải là toàn năng.</span></div>
          <table class="t"><tr><th>bảng nạp vào</th><th>sau 10 000 vòng của bộ mô phỏng</th></tr>
          <tr><td>một dòng: đọc ô trống thì ghi ô trống, đứng yên, giữ trạng thái</td><td>vẫn chưa dừng</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba, hiểu vạn năng là giải được mọi bài toán. Máy U chỉ chạy theo máy khác, nếu máy đó chạy mãi thì U cũng chạy mãi, nên vạn năng không phải là toàn năng. Thử nạp một bảng chỉ có một dòng, đọc ô trống thì ghi ô trống, đứng yên và giữ trạng thái, thì sau 10 nghìn vòng bộ mô phỏng vẫn chưa dừng, và sẽ không bao giờ dừng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng luận đề để kết luận về tốc độ <b class="red">(sai)</b>
          <br><span class="note">Câu hỏi “tính được trong thời gian đa thức” là chuyện khác — chuyện của độ phức tạp, ở cuối khoá.</span></div>
        say: "Lỗi thứ tư, dùng luận đề để kết luận về tốc độ. Câu hỏi có tính được trong thời gian đa thức hay không là chuyện khác, chuyện của độ phức tạp, ta sẽ xem ở cuối khoá."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '0110', 0, 'F')[:2] == ('1001', 5)"
      - "[s for q, i, s in alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '0110', 0, 'F')[3]][1:] + ['1001'] == ['1110', '1010', '1000', '1001', '1001']"
      - "''.join('1' if c == '0' else '0' for c in '0110') == '1001' and len('0110') + 1 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nạp bảng đảo bit vào bộ mô phỏng, đầu vào $0110$. Băng cuối là gì, sau mấy bước?</td></tr>
          <tr><td>2</td><td>Đúng hay sai: “Máy vạn năng $U$ chạy được cả chính $\langle U \rangle$.”</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nạp bảng đảo bit vào bộ mô phỏng với đầu vào 0 1 1 0, băng cuối là gì, sau mấy bước? Câu hai, đúng hay sai, máy vạn năng U chạy được cả mã của chính nó. Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <table class="t"><tr><th>vòng</th><th>ô</th><th>đọc</th><th>làm</th><th>băng sau</th></tr>
          <tr><td>1</td><td>0</td><td>0</td><td>ghi 1, sang phải</td><td>1110</td></tr>
          <tr><td>2</td><td>1</td><td>1</td><td>ghi 0, sang phải</td><td>1010</td></tr>
          <tr><td>3</td><td>2</td><td>1</td><td>ghi 0, sang phải</td><td>1000</td></tr>
          <tr><td>4</td><td>3</td><td>0</td><td>ghi 1, sang phải</td><td>1001</td></tr>
          <tr><td>5</td><td>4</td><td>ô trống</td><td>dừng</td><td>$\hl{1001}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Đáp án câu một, tra bảng từng vòng. Vòng một, ô 0 có chữ 0, ghi 1, băng thành 1 1 1 0. Vòng hai, ô 1 có chữ 1, ghi 0, băng thành 1 0 1 0. Vòng ba, ô 2 có chữ 1, ghi 0, băng thành 1 0 0 0. Vòng bốn, ô 3 có chữ 0, ghi 1, băng thành 1 0 0 1. Vòng năm gặp ô trống thì dừng."
      - show: |
          <p>① Băng cuối $1001$ sau $4 + 1 = \hl{5}$ bước: 4 lần đảo, 1 lần gặp ô trống. Kiểm bằng đường khác: đảo từng chữ của $0110$ được $1001$ ✓.</p>
        say: "Vậy băng cuối là 1 0 0 1 sau 5 bước, gồm 4 lần đảo và 1 lần gặp ô trống. Kiểm bằng đường khác, đảo từng chữ của 0 1 1 0 cũng được 1 0 0 1."
      - show: |
          <p>② <b>Đúng.</b> $\langle U \rangle$ chỉ là một chuỗi mô tả một máy Turing như mọi máy khác, nên $U$ chạy được nó.</p>
        say: "Câu hai, đúng, vì mã của U chỉ là một chuỗi mô tả một máy Turing như mọi máy khác, nên U chạy được nó. Chạy như vậy, U đóng vai một trình thông dịch đang thông dịch chính mình."

