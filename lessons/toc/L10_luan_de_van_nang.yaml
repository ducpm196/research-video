- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">thuật toán (không hình thức)</span><span class="a">→</span>

      <span class="n">luận đề: = máy Turing</span><span class="a">→</span>

      <span class="n">chương trình là dữ liệu</span><span class="a">→</span>

      <span class="n">máy vạn năng</span></div>

      '
    say: Tổng kết lại, thuật toán là khái niệm không hình thức, và luận đề nói nó trùng với máy Turing. Vì chương trình cũng là dữ liệu, có một máy vạn năng chạy được mọi máy khác.
  - show: '<div class="box key"><b>Tư duy:</b> muốn chứng minh “không thuật toán nào làm được X”, chỉ cần chứng minh “không máy Turing nào làm được X”.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Bảng đảo 4 bit chạy qua bộ mô phỏng mất 5 vòng lặp, còn chạy chương trình hàng triệu chỉ thị trên máy Turing vạn năng U chỉ chậm hơn tối đa bậc đa thức theo số bước — chứng tỏ một máy chung giải được mọi bài toán tính được.</p>

      '
    say: Điều cần mang theo, muốn chứng minh không thuật toán nào làm được một việc, ta chỉ cần chứng minh không máy Turing nào làm được việc đó. Bảng đảo 4 bit chạy qua bộ mô phỏng mất 5 vòng lặp. Chương trình triệu lệnh trên máy vạn năng vẫn chạy được, chỉ chậm thêm một bậc đa thức theo số bước.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 11): có việc nào như thế không? Có — <b>bài toán dừng</b> không khả quyết.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 11, ta trả lời có việc nào như thế không. Câu trả lời là có, bài toán dừng là bài toán không khả quyết. Hẹn gặp bạn ở bài tiếp theo.
