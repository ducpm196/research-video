="#1f2937">1</text><g font-size="24" text-anchor="middle" fill="#1f2937"><rect x="40" y="290" width="400" height="90" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="240" y="330">1. đọc ô dưới đầu của M</text><text x="240" y="362">thấy 1, trạng thái F</text><rect x="500" y="290" width="400" height="90" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="700" y="330">2. tìm trong mã dòng (F, 1)</text><text x="700" y="362">được: ghi 0, P, F</text><rect x="960" y="290" width="400" height="90" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1160" y="330">3. ghi 0 lên băng của M</text><text x="1160" y="362">dời đầu sang phải</text></g><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="440" y1="335" x2="494" y2="335" marker-end="url(#aU)"/><line x1="900" y1="335" x2="954" y2="335" marker-end="url(#aU)"/><path d="M1160,380 C1160,450 240,450 240,386" marker-end="url(#aU)"/></g><g fill="none" stroke-width="3" stroke-dasharray="10 8"><line x1="240" y1="290" x2="1015" y2="156" stroke="#b91c1c" marker-end="url(#aU)"/><line x1="700" y1="290" x2="475" y2="156" stroke="#b45309" marker-end="url(#aU)"/><line x1="1160" y1="290" x2="1025" y2="156" stroke="#15803d" marker-end="url(#aU)"/></g><text x="700" y="488" font-size="22" text-anchor="middle" fill="#374151">lặp lại tới khi không còn dòng nào khớp</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình cho thấy băng của máy vạn năng U. Bên trái là mã của M, ba dòng của bảng đảo bit, viết thành ký hiệu như mọi dữ liệu khác. Sau dấu thăng là đầu vào của M, chuỗi 1 0 1 1, ô đỏ là chỗ đầu đọc của M đang đứng. Mỗi vòng, U đọc ô dưới đầu của M, tìm trong mã dòng khớp với trạng thái và ký hiệu đó, rồi ghi, dời đầu, và đổi trạng thái đúng như dòng ấy nói. Vòng lặp này chạy tới khi không còn dòng nào khớp, đó là lúc M dừng.
