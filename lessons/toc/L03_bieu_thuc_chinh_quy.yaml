id: L03
course: TOC
series: "TOC · Lý thuyết tính toán"
title: "Bài 3 — Biểu thức chính quy và định lý Kleene"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L03; audit/toc/verify_toc.py L03; S. C. Kleene (1956), “Representation of Events in Nerve Nets and Finite Automata”; M. Sipser, mục 1.3"
assumes: [arith, sub, set, in, alpha, eps, kstar, strpow, emptyset, dots]
# Quy ước: biểu thức chính quy viết trong <code> theo cú pháp thường gặp — | là “hoặc”, * là “lặp 0 lần trở lên”, viết liền là ghép.
#   Lời đọc: “dấu sao”, “hoặc”, “mở ngoặc / đóng ngoặc” chỉ khi cần. Mọi khẳng định “biểu thức khớp đúng ngôn ngữ X” do
#   alg.regex_lang so với định nghĩa của X trên MỌI chuỗi độ dài tới 8 (511 chuỗi), dùng khớp TRỌN chuỗi (re.fullmatch).
objectives:
  - "Đọc và viết biểu thức chính quy với ba phép hoặc, ghép, sao"
  - "Nắm thứ tự ưu tiên: sao, rồi ghép, rồi hoặc"
  - "Biết định lý Kleene: biểu thức chính quy và ôtômat hữu hạn mô tả cùng một lớp ngôn ngữ"
asr_reviewed:
  - {sentence: "Định lý Kleene, năm 1956, nối ba cách mô tả, gồm biểu thức chính quy, máy không đơn định, và máy đơn định.", reason: "ASR chép “Định lý Collini, năm 1956, nối ba cách mô tả, gồm biểu thức chính quy, máy không đơn định và máy đơn định.” (0.966): “kleene” đọc theo luật lexicon (lexicon_vi.TOC.yaml: “Cờ-li-ni”), ASR viết “collini” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chuỗi 0 1 1 0 chia được thành hai cặp, nên khớp.", reason: "ASR chép “Chủi 011 không chia được thành hai cặp, nên khớp.” (0.783): lệch âm/thanh thuần Việt: chuỗi không một/chủi mười — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chuỗi 0 1 0 1 không có hai chữ 1 liền nhau, nên không khớp, đúng như mong muốn.", reason: "ASR chép “Chủi 0101 không có hai chữ một liền nhau, nền không khớp, đúng như mong muốn.” (0.789): lệch âm/thanh thuần Việt: chuỗi không/chủi, không/trăm linh, nên/nền — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đây đúng là điều định lý Kleene hứa, hai cách mô tả cho cùng câu trả lời trên mọi chuỗi.", reason: "ASR chép “Đây đúng là điều định lý Clooney hứa, hai cách mô tả cho cùng câu trả lời trên mọi chuỗi.” (0.95): “Kleene” đọc “Cờ-li-ni” theo lexicon_vi.TOC.yaml (probe 7/8), ASR viết thành tên “Clooney/Clini” — chỉ khác cách viết tên riêng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Định lý Kleene nói biểu thức và ô-tô-mát mô tả cùng một lớp, gọi là ngôn ngữ chính quy.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này; Kleene đọc “Cờ-li-ni” (probe p1 7/8, đối chứng 0/8); ASR chép “Kalini / Cligny / Coligny”: đủ ba âm k-l-n, khác cách viết"}
  - {sentence: "Hôm nay ta học biểu thức chính quy, ba phép toán của nó, thứ tự ưu tiên, và định lý Kleene nói nó mạnh đúng bằng ô-tô-mát hữu hạn.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này; Kleene đọc “Cờ-li-ni” (probe p1 7/8, đối chứng 0/8); ASR chép “Kalini / Cligny / Coligny”: đủ ba âm k-l-n, khác cách viết"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một dòng chữ thay cho một cỗ máy"
    steps:
      - show: |
          <p>Ở bài 2, máy ba trạng thái nhận các chuỗi kết thúc bằng $01$. Cùng ngôn ngữ đó viết bằng một dòng: <code>(0|1)*01</code>.</p>
          <p>Công cụ tìm kiếm văn bản, kiểm tra ô nhập liệu, tách từ trong trình biên dịch đều dùng loại dòng chữ này.</p>
          <div class="box key">Hôm nay: biểu thức chính quy — ba phép toán, thứ tự ưu tiên, và định lý Kleene: nó mạnh <b>đúng bằng</b> ôtômat hữu hạn.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ở bài 2, máy không đơn định ba trạng thái nhận các chuỗi kết thúc bằng 0 1. Cùng ngôn ngữ đó có thể viết bằng một dòng chữ ngắn. Công cụ tìm kiếm văn bản, kiểm tra ô nhập liệu, hay bước tách từ của trình biên dịch đều dùng loại dòng chữ này. Hôm nay ta học biểu thức chính quy, ba phép toán của nó, thứ tự ưu tiên, và định lý Kleene nói nó mạnh đúng bằng ô-tô-mát hữu hạn."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ghép chuỗi và máy kết thúc bằng 01"
    checks:
      - "'0' + '1' == '01' and '01' + '1' == '011' and '1' * 0 == '' and '1' * 2 == '11'"
      - "[alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, w)[0] for w in ('101', '110')] == [True, False]"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>ví dụ</th><th>kết quả</th></tr>
          <tr><td>ghép hai chuỗi</td><td>$01$ ghép $1$</td><td>$011$</td></tr>
          <tr><td>lặp 0 lần</td><td>$1^0$</td><td>$\varepsilon$</td></tr>
          <tr><td>lặp 2 lần</td><td>$1^2$</td><td>$11$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn lại hai điều đã học. Ở bài 0, ghép hai chuỗi là viết chúng liền nhau, chuỗi 0 1 ghép với chuỗi 1 được 0 1 1. Lặp một chuỗi 0 lần thì được chuỗi rỗng, không có ký hiệu nào. Lặp chữ 1 hai lần thì được chuỗi 1 1."
      - show: |
          <table class="t"><tr><th>máy của bài 2</th><th>đọc 0</th><th>đọc 1</th></tr>
          <tr><td>$A$ (đầu)</td><td>$\{A, B\}$</td><td>$\{A\}$</td></tr>
          <tr><td>$B$</td><td>$\emptyset$</td><td>$\{C\}$</td></tr>
          <tr><td>$C$ (nhận)</td><td>$\emptyset$</td><td>$\emptyset$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 1]
        say: "Ở bài 2, ta có máy không đơn định ba trạng thái nhận các chuỗi kết thúc bằng 0 1. Ở A, đọc 0 thì được ở lại A hoặc sang B, đọc 1 thì ở lại A. Ở B chỉ đọc được 1 để sang C. C là trạng thái nhận và không có mũi tên nào đi ra. Máy nhận một chuỗi nếu có ít nhất một nhánh đọc hết chuỗi và dừng ở C, ví dụ nhận 1 0 1 nhưng từ chối 1 1 0."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba phép toán"
    checks:
      - "alg.regex_lang('0|1', '01', 3) == {'0', '1'}"
      - "alg.regex_lang('0*', '01', 3) == {'', '0', '00', '000'}"
    steps:
      - show: |
          <table class="t"><tr><th>viết</th><th>nghĩa</th><th>khớp</th></tr>
          <tr><td><code>0|1</code></td><td><b>hoặc</b>: khớp vế trái hoặc vế phải</td><td>$0$, $1$</td></tr>
          <tr><td><code>01</code></td><td><b>ghép</b>: viết liền = phần trước rồi phần sau</td><td>$01$</td></tr>
          <tr><td><code>0*</code></td><td><b>sao</b>: lặp phần đứng trước 0, 1, 2… lần</td><td>$\varepsilon$, $0$, $00$, $000$, $\dots$</td></tr>
          <tr><td><code>( )</code></td><td>ngoặc: gom một nhóm</td><td><code>(0|1)*</code> khớp mọi chuỗi</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Biểu thức chính quy có ba phép toán. Dấu gạch đứng là hoặc, khớp vế trái hoặc vế phải, ví dụ 0 hoặc 1. Viết liền là ghép, khớp phần trước rồi đến phần sau. Dấu sao là lặp phần đứng trước 0 lần, 1 lần, 2 lần, và cứ thế tiếp tục, nên 0 sao khớp cả chuỗi rỗng. Dấu ngoặc gom một nhóm, ví dụ nhóm 0 hoặc 1, rồi lặp bằng dấu sao, thì khớp mọi chuỗi."
      - show: |
          <div class="box key">Trong lý thuyết, biểu thức khớp <b>trọn</b> chuỗi, từ đầu đến cuối — không phải chỉ khớp một đoạn ở giữa.</div>
        say: "Lưu ý, trong lý thuyết, biểu thức phải khớp trọn chuỗi từ đầu đến cuối, không phải chỉ khớp một đoạn ở giữa."

  # ───────────────────────── 3. ƯU TIÊN ─────────────────────────
  - id: prec
    kind: concept
    title: "Thứ tự ưu tiên: sao, rồi ghép, rồi hoặc"
    checks:
      - "alg.regex_lang('01*', '01', 4) == {'0', '01', '011', '0111'}"
      - "alg.regex_lang('(01)*', '01', 4) == {'', '01', '0101'}"
      - "alg.regex_lang('0|1*', '01', 4) == {'0', '', '1', '11', '111', '1111'}"
    steps:
      - show: |
          <p>Giống “nhân trước, cộng sau”: <b>sao</b> gắn chặt nhất, rồi đến <b>ghép</b>, cuối cùng là <b>hoặc</b>.</p>
          <table class="t"><tr><th>viết</th><th>hiểu là</th><th>khớp</th></tr>
          <tr><td><code>01*</code></td><td><code>0(1*)</code></td><td>$0$, $01$, $011$, $\dots$</td></tr>
          <tr><td><code>(01)*</code></td><td>lặp cả cặp $01$</td><td>$\varepsilon$, $01$, $0101$, $\dots$</td></tr>
          <tr><td><code>0|1*</code></td><td><code>0|(1*)</code></td><td>$0$ hoặc chuỗi toàn 1 — <b>không</b> khớp $0111$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Giống quy tắc nhân trước cộng sau, dấu sao gắn chặt nhất, rồi đến ghép, cuối cùng là hoặc. Nên 0 1 sao nghĩa là 0 rồi lặp chữ 1, khớp 0, 0 1, 0 1 1. Muốn lặp cả cặp 0 1 thì phải đặt cặp đó trong ngoặc. Còn 0 hoặc 1 sao nghĩa là chuỗi 0, hoặc một chuỗi toàn chữ 1, nên không khớp 0 1 1 1."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Biểu thức là một đường đi trên máy"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arT3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><circle cx="300" cy="180" r="60" fill="#eff6ff" stroke="#1f2937" stroke-width="3"/><text x="300" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">A</text><circle cx="750" cy="180" r="60" fill="#eff6ff" stroke="#1f2937" stroke-width="3"/><text x="750" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">B</text><circle cx="1200" cy="180" r="60" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><circle cx="1200" cy="180" r="50" fill="none" stroke="#1f2937" stroke-width="2.5"/><text x="1200" y="191" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">C</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="150" y1="180" x2="236" y2="180" marker-end="url(#arT3)"/><path d="M265,131 C215,30 385,30 335,131" marker-end="url(#arT3)"/><line x1="362" y1="180" x2="686" y2="180" marker-end="url(#arT3)"/><line x1="812" y1="180" x2="1136" y2="180" marker-end="url(#arT3)"/></g><g font-size="28" font-weight="bold" fill="#b45309" text-anchor="middle"><text x="300" y="40">0, 1</text><text x="524" y="165">0</text><text x="974" y="165">1</text></g><g stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"><line x1="300" y1="245" x2="300" y2="320"/><line x1="524" y1="195" x2="524" y2="320"/><line x1="974" y1="195" x2="974" y2="320"/></g><g font-size="34" font-family="monospace" font-weight="bold" fill="#2563eb" text-anchor="middle"><text x="300" y="365">(0|1)*</text><text x="524" y="365">0</text><text x="974" y="365">1</text></g><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="300" y="405">vòng lặp: đi 0, 1, 2… lần</text><text x="524" y="405">một mũi tên</text><text x="974" y="405">một mũi tên rồi dừng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này đặt biểu thức kết thúc bằng 0 1 ngay dưới máy của bài 2. Phần lặp nhóm 0 hoặc 1 chính là vòng lặp ở A, đi vòng bao nhiêu lần cũng được, kể cả 0 lần. Chữ 0 tiếp theo là mũi tên từ A sang B, và chữ 1 cuối là mũi tên từ B sang C. Mỗi chuỗi khớp biểu thức là một đường đi từ A tới C, nên phép hoặc thành nhánh rẽ, phép ghép thành nối tiếp, và dấu sao thành vòng lặp."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đọc hai biểu thức"
    checks:
      - "alg.regex_lang('(0|1)*01', '01', 8) == {w for w in alg.strings('01', 8) if w.endswith('01')}"
      - "alg.regex_lang('0*(10*10*)*', '01', 8) == {w for w in alg.strings('01', 8) if w.count('1') % 2 == 0}"
      - "len(alg.strings('01', 8)) == 511"
      - "'1101' in alg.regex_lang('(0|1)*01', '01', 4) and '0110' not in alg.regex_lang('(0|1)*01', '01', 4)"
      - "'0101' in alg.regex_lang('0*(10*10*)*', '01', 4) and '0111' not in alg.regex_lang('0*(10*10*)*', '01', 4) and '0101'.count('1') == 2 and '0111'.count('1') == 3"
    steps:
      - show: |
          <p><code>(0|1)*01</code>: phần đầu <code>(0|1)*</code> khớp <b>bất kỳ</b> chuỗi nào, rồi bắt buộc kết thúc bằng $01$. Vậy đúng là “kết thúc bằng $01$”.</p>
          <p><code>0*(10*10*)*</code>: mở đầu bằng các chữ 0, rồi lặp các khối <code>10*10*</code>, mỗi khối chứa <b>đúng hai</b> chữ 1. Vậy đúng là “số chữ 1 chẵn”.</p>
          <div class="box">Máy so hai biểu thức với định nghĩa trên cả 511 chuỗi độ dài tới 8: khớp đúng từng chuỗi.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Biểu thức thứ nhất, phần đầu là nhóm 0 hoặc 1 lặp lại, khớp bất kỳ chuỗi nào, rồi bắt buộc kết thúc bằng 0 1. Vậy nó mô tả đúng ngôn ngữ kết thúc bằng 0 1. Biểu thức thứ hai mở đầu bằng các chữ 0, rồi lặp các khối, mỗi khối gồm chữ 1, các chữ 0, chữ 1, các chữ 0, nên chứa đúng hai chữ 1. Vậy nó mô tả ngôn ngữ có số chữ 1 chẵn. Máy so hai biểu thức với định nghĩa trên cả 511 chuỗi độ dài tới 8, và khớp đúng từng chuỗi."
      - clear: true
        show: |
          <p>Bây giờ tự khớp bằng tay, mỗi bước một chuỗi, chia chuỗi thành từng phần của biểu thức.</p>
          <table class="t"><tr><th>bước</th><th>biểu thức</th><th>chuỗi</th><th>chia phần</th><th>kết quả</th></tr>
          <tr><td>1</td><td><code>(0|1)*01</code></td><td>$1101$</td><td><code>(0|1)*</code> lấy $11$, rồi $01$</td><td>khớp</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bây giờ ta tự khớp bằng tay, mỗi bước một chuỗi, bằng cách chia chuỗi thành từng phần của biểu thức. Bước một, chuỗi 1 1 0 1 với biểu thức thứ nhất. Phần lặp lấy hai chữ 1 đầu, còn lại đúng 0 1, nên khớp."
      - show: |
          <table class="t"><tr><th>bước</th><th>biểu thức</th><th>chuỗi</th><th>chia phần</th><th>kết quả</th></tr>
          <tr><td>2</td><td><code>(0|1)*01</code></td><td>$0110$</td><td>hai ký hiệu cuối là $10$, khác $01$</td><td><b>không</b> khớp</td></tr></table>
        focus: [1, 1]
        say: "Bước hai, chuỗi 0 1 1 0 với cùng biểu thức đó. Dù phần lặp lấy bao nhiêu đi nữa, hai ký hiệu cuối vẫn là 1 0, khác 0 1, nên không khớp."
      - show: |
          <table class="t"><tr><th>bước</th><th>biểu thức</th><th>chuỗi</th><th>chia phần</th><th>kết quả</th></tr>
          <tr><td>3</td><td><code>0*(10*10*)*</code></td><td>$0101$</td><td><code>0*</code> lấy $0$; một khối lấy $1$, $0$, $1$ và chuỗi rỗng</td><td>khớp, có 2 chữ 1</td></tr></table>
        focus: [1, 1, 1]
        say: "Bước ba, chuỗi 0 1 0 1 với biểu thức thứ hai. Phần đầu lấy chữ 0, rồi một khối lấy chữ 1, chữ 0, chữ 1, và phần lặp chữ 0 cuối khối lấy chuỗi rỗng. Vậy chuỗi khớp, và đúng là có 2 chữ 1."
      - show: |
          <table class="t"><tr><th>bước</th><th>biểu thức</th><th>chuỗi</th><th>chia phần</th><th>kết quả</th></tr>
          <tr><td>4</td><td><code>0*(10*10*)*</code></td><td>$0111$</td><td><code>0*</code> lấy $0$; một khối lấy $11$; còn một chữ 1 lẻ loi</td><td><b>không</b> khớp, có 3 chữ 1</td></tr></table>
        focus: [1, 1, 1]
        say: "Bước bốn, chuỗi 0 1 1 1 với biểu thức thứ hai. Phần đầu lấy chữ 0, một khối lấy hai chữ 1, nhưng còn thừa một chữ 1, mà mỗi khối mới lại cần đúng hai chữ 1. Vậy chuỗi không khớp, đúng vì 3 chữ 1 là số lẻ."

  # ───────────────────────── 5. KLEENE ─────────────────────────
  - id: kleene
    kind: concept
    title: "Định lý Kleene (1956)"
    steps:
      - show: |
          <div class="chain"><span class="n">biểu thức chính quy</span><span class="a">⇄</span><span class="n">NFA (máy không đơn định)</span><span class="a">⇄</span><span class="n">DFA (máy đơn định)</span></div>
          <p>Một ngôn ngữ mô tả được bằng biểu thức chính quy <b>khi và chỉ khi</b> có một ôtômat hữu hạn nhận nó. Lớp này gọi là <b>ngôn ngữ chính quy</b>.</p>
          <ul><li>Chiều biểu thức → NFA: mỗi phép toán có một mảnh máy nhỏ; ví dụ <code>(0|1)*</code> là vòng lặp ở trạng thái $A$ của bài 2, <code>0</code> và <code>1</code> là hai mũi tên tiếp theo.</li>
          <li>Chiều DFA → biểu thức: xoá dần từng trạng thái, gom nhãn các đường đi thành biểu thức.</li></ul>
        focus: [1, 2, 2, "3.1", "3.2"]
        say: "Định lý Kleene, năm 1956, nối ba cách mô tả, gồm biểu thức chính quy, máy không đơn định, và máy đơn định. Một ngôn ngữ mô tả được bằng biểu thức chính quy khi và chỉ khi có một ô-tô-mát hữu hạn nhận nó. Lớp ngôn ngữ này gọi là ngôn ngữ chính quy. Chiều từ biểu thức sang máy, mỗi phép toán có một mảnh máy nhỏ, ví dụ phần lặp đầu biểu thức chính là vòng lặp ở trạng thái A của máy trong bài 2. Chiều ngược lại, ta xoá dần từng trạng thái của máy, và gom nhãn các đường đi thành biểu thức."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "'0101' in alg.regex_lang('0*(10*10*)*', '01', 4) and '0111' not in alg.regex_lang('0*(10*10*)*', '01', 4)"
      - "[sorted(s) for s in alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, '1101')[1]] == [['A'], ['A'], ['A'], ['A', 'B'], ['A', 'C']]"
      - "[sorted(s) for s in alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, '0110')[1]] == [['A'], ['A', 'B'], ['A', 'C'], ['A'], ['A', 'B']]"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>nội dung</th></tr>
          <tr><td><b>Chuỗi phải khớp</b></td><td>thử vài chuỗi thuộc ngôn ngữ, ví dụ $0101$ có hai chữ 1 → phải khớp</td></tr>
          <tr><td><b>Chuỗi không được khớp</b></td><td>thử vài chuỗi ngoài ngôn ngữ, ví dụ $0111$ có ba chữ 1 → không được khớp</td></tr>
          <tr><td><b>Vét cạn</b></td><td>với bảng chữ nhỏ, cho máy thử mọi chuỗi ngắn — cách chắc nhất</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, thử vài chuỗi phải khớp, ví dụ 0 1 0 1 có hai chữ 1, nên phải khớp. Hai, thử vài chuỗi không được khớp, ví dụ 0 1 1 1 có ba chữ 1, nên không được khớp. Ba, với bảng chữ nhỏ, cho máy thử mọi chuỗi ngắn, đó là cách chắc nhất."
      - clear: true
        show: |
          <p>Đường khác cho bước 1 và bước 2: <b>không</b> nhìn biểu thức, chạy máy của bài 2 bằng tập trạng thái.</p>
          <table class="t"><tr><th>chuỗi</th><th>các tập trạng thái lần lượt</th><th>máy</th><th>biểu thức</th></tr>
          <tr><td>$1101$</td><td>$\{A\}, \{A\}, \{A\}, \{A, B\}, \{A, C\}$</td><td>nhận</td><td>khớp ✓</td></tr>
          <tr><td>$0110$</td><td>$\{A\}, \{A, B\}, \{A, C\}, \{A\}, \{A, B\}$</td><td>từ chối</td><td>không khớp ✓</td></tr></table>
        focus: [1, "2.2", "2.3", 2]
        say: "Bây giờ kiểm bước một và bước hai bằng một đường khác, không nhìn biểu thức mà chạy máy của bài 2 bằng tập trạng thái. Với 1 1 0 1, tập cuối là A, C, có chứa C, nên máy nhận, khớp với kết quả của biểu thức. Với 0 1 1 0, tập cuối là A, B, không chứa C, nên máy từ chối, cũng khớp. Đây đúng là điều định lý Kleene hứa, hai cách mô tả cho cùng câu trả lời trên mọi chuỗi."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "'011' in alg.regex_lang('01*', '01', 4) and '011' not in alg.regex_lang('(01)*', '01', 4) and '0101' not in alg.regex_lang('01*', '01', 4) and '0101' in alg.regex_lang('(01)*', '01', 4)"
      - "'0101' in alg.regex_lang(r'(.+)\\1', '01', 4) and '0110' not in alg.regex_lang(r'(.+)\\1', '01', 4)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đọc <code>01*</code> là “lặp cặp 01” <b class="red">(sai)</b>
          <br><span class="note">Sao chỉ gắn vào ký hiệu đứng ngay trước. Lặp cả cặp phải viết <code>(01)*</code>.</span></div>
          <table class="t"><tr><th>chuỗi</th><th><code>01*</code></th><th><code>(01)*</code></th></tr>
          <tr><td>$011$</td><td>khớp</td><td>không</td></tr><tr><td>$0101$</td><td>không</td><td>khớp</td></tr></table>
        focus: [1, 1]
        say: "Lỗi thứ nhất, đọc 0 1 sao là lặp cả cặp 0 1. Dấu sao chỉ gắn vào ký hiệu đứng ngay trước nó, muốn lặp cả cặp thì phải đặt trong ngoặc."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên rằng sao cho phép lặp <b>0 lần</b> <b class="red">(thiếu)</b>
          <br><span class="note"><code>(10*10*)*</code> khớp cả $\varepsilon$; nhờ vậy chuỗi $000$ (không có chữ 1) vẫn được tính là có số chữ 1 chẵn.</span></div>
        say: "Lỗi thứ hai, quên rằng dấu sao cho phép lặp 0 lần. Nhờ vậy phần lặp các khối khớp cả chuỗi rỗng, và chuỗi 0 0 0, không có chữ 1 nào, vẫn được tính là có số chữ 1 chẵn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ mọi “regex” của thư viện đều chính quy <b class="red">(sai)</b>
          <br><span class="note">Nhiều thư viện có <b>tham chiếu ngược</b>: <code>(.+)\1</code> khớp $0101$ (một chuỗi viết hai lần) nhưng không khớp $0110$. Ngôn ngữ “chuỗi lặp đôi” này không chính quy.</span></div>
        say: "Lỗi thứ ba, nghĩ mọi biểu thức của thư viện lập trình đều chính quy. Nhiều thư viện có tham chiếu ngược, cho phép đòi một đoạn lặp lại đúng như đoạn trước, nên khớp 0 1 0 1 mà không khớp 0 1 1 0. Ngôn ngữ chuỗi lặp đôi này không phải ngôn ngữ chính quy."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên neo khi dùng thư viện <b class="red">(sai)</b>
          <br><span class="note">Hàm tìm kiếm của thư viện chấp nhận khớp một <b>đoạn</b>. Muốn khớp trọn chuỗi như lý thuyết, dùng hàm khớp trọn hoặc thêm <code>^</code> ở đầu và <code>$</code> ở cuối.</span></div>
        say: "Lỗi thứ tư, quên neo hai đầu khi dùng thư viện. Hàm tìm kiếm của thư viện chấp nhận khớp chỉ một đoạn, nên muốn khớp trọn chuỗi như lý thuyết thì dùng hàm khớp trọn, hoặc thêm ký hiệu neo đầu và neo cuối."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.regex_lang('(0|1)*11(0|1)*', '01', 8) == {w for w in alg.strings('01', 8) if '11' in w}"
      - "alg.regex_lang('((0|1)(0|1))*', '01', 8) == {w for w in alg.strings('01', 8) if len(w) % 2 == 0}"
      - "'0110' in alg.regex_lang('(0|1)*11(0|1)*', '01', 4) and '0101' not in alg.regex_lang('(0|1)*11(0|1)*', '01', 4)"
      - "'0110' in alg.regex_lang('((0|1)(0|1))*', '01', 4) and '011' not in alg.regex_lang('((0|1)(0|1))*', '01', 4)"
    steps:
      - show: |
          <p>Viết biểu thức chính quy trên $\Sigma = \{0, 1\}$ cho:</p>
          <table class="t"><tr><th>câu</th><th>ngôn ngữ</th></tr>
          <tr><td>1</td><td>các chuỗi <b>chứa</b> đoạn $11$</td></tr>
          <tr><td>2</td><td>các chuỗi có độ dài <b>chẵn</b></td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Viết biểu thức chính quy trên bảng chữ 0 và 1 cho hai ngôn ngữ. Câu một, các chuỗi có chứa hai chữ 1 đứng liền nhau. Câu hai, các chuỗi có độ dài chẵn. Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <p>① <code>(0|1)*11(0|1)*</code>: phần đầu bất kỳ, rồi $11$, rồi phần sau bất kỳ.</p>
          <table class="t"><tr><th>thử</th><th>chia phần</th><th>kết quả</th></tr>
          <tr><td>$0110$</td><td>phần đầu lấy $0$, rồi $11$, phần sau lấy $0$</td><td>khớp ✓</td></tr>
          <tr><td>$0101$</td><td>không có hai chữ 1 liền nhau</td><td>không khớp ✓</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Đáp án câu một, nhóm bất kỳ lặp lại, rồi 1 1, rồi lại nhóm bất kỳ lặp lại. Thử ngay theo tư duy của bài, một chuỗi phải khớp và một chuỗi không được khớp. Chuỗi 0 1 1 0 chia được thành 0, rồi 1 1, rồi 0, nên khớp. Chuỗi 0 1 0 1 không có hai chữ 1 liền nhau, nên không khớp, đúng như mong muốn."
      - show: |
          <p>② <code>((0|1)(0|1))*</code>: lặp từng <b>cặp</b> ký hiệu, nên độ dài luôn chẵn (kể cả $\varepsilon$).</p>
          <table class="t"><tr><th>thử</th><th>chia phần</th><th>kết quả</th></tr>
          <tr><td>$0110$</td><td>hai cặp: $01$, $10$</td><td>khớp ✓</td></tr>
          <tr><td>$011$</td><td>một cặp $01$, thừa $1$</td><td>không khớp ✓</td></tr></table>
          <p class="note">Máy đã kiểm cả hai đáp án trên mọi chuỗi độ dài tới 8.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Câu hai, lặp từng cặp ký hiệu, nên độ dài luôn chẵn, kể cả chuỗi rỗng. Chuỗi 0 1 1 0 chia được thành hai cặp, nên khớp. Chuỗi 0 1 1 chỉ có một cặp và thừa một chữ 1, nên không khớp. Máy đã kiểm cả hai đáp án trên mọi chuỗi độ dài tới 8."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hoặc, ghép, sao</span><span class="a">→</span>
          <span class="n">ưu tiên: sao, ghép, hoặc</span><span class="a">→</span>
          <span class="n">Kleene: biểu thức ⇄ ôtômat</span><span class="a">→</span>
          <span class="n">ngôn ngữ chính quy</span></div>
        say: "Tổng kết lại, biểu thức chính quy có ba phép hoặc, ghép, sao, với thứ tự ưu tiên sao, rồi ghép, rồi hoặc. Định lý Kleene nói biểu thức và ô-tô-mát mô tả cùng một lớp, gọi là ngôn ngữ chính quy."
      - show: |
          <div class="box key"><b>Tư duy:</b> viết xong một biểu thức, hãy thử ngay một chuỗi <b>phải khớp</b> và một chuỗi <b>không được khớp</b>.</div>
        say: "Điều cần mang theo, viết xong một biểu thức, hãy thử ngay một chuỗi phải khớp và một chuỗi không được khớp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): có ngôn ngữ nào <b>không</b> chính quy không? Bổ đề bơm chứng minh $\{0^n 1^n\}$ không chính quy.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta hỏi có ngôn ngữ nào không chính quy không, và dùng bổ đề bơm để chứng minh ngôn ngữ các chuỗi gồm n chữ 0 rồi n chữ 1 không chính quy. Hẹn gặp bạn ở bài tiếp theo."
