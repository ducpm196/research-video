source: "curriculum/toc.yaml L14; audit/toc/sources_L14.md (câu trích nguyên văn, đọc 2026-11-02); audit/toc/verify_toc.py L14; K. Thompson, Regular expression search algorithm, Communications of the ACM 11(6), 6/1968, tr. 419–422 (bản ACM bị chặn 403 — đọc bản chép quét oilshell.org/archive/Thompson-1968.pdf) [TH68]; R. Cox, Regular Expression Matching Can Be Simple And Fast, swtch.com, 1/2007 [CX07]; R. Cox, Regular Expression Matching in the Wild, swtch.com, 3/2010 [CX10]; J. Graham-Cumming, Details of the Cloudflare outage on July 2, 2019, Cloudflare Blog, 12/7/2019 [CF19]; google/re2, README.md (phần “Why RE2” đưa lên đầu README 30/7/2025) [R2]; TOC bài 2 (ô-tô-mát không đơn định, chạy bằng tập trạng thái), bài 3 (biểu thức chính quy), bài 13 (đa thức và mũ)"
assumes: [arith, power, dots]
# Quy ước: biểu thức chính quy viết trong <code>…</code> như các bài trước. “quay lui” = thử một nhánh, hỏng thì quay lại thử nhánh khác
#   (backtracking); “cách Thompson” = giữ TẬP vị trí có thể của mẫu, đọc mỗi ký tự một lần; “mẫu bệnh lý” = mẫu làm quay lui bùng nổ.
#   Mọi sự kiện và con số có nguồn ghi trong audit/toc/sources_L14.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”.
#   “số lần thử” của bộ đếm trong bài = alg.bt_match (một lần đặt một ký hiệu của mẫu vào một vị trí) — KHÁC đơn vị “số bước” của
#   công cụ gỡ lỗi mà bài hậu kiểm năm 2019 dùng (23, 33, 45, 555 là CITED). Đa thức k² + 7k + 15 do bài khớp từ ba điểm (VER).
#   Lời đọc không nói Perl, Python, PCRE, Unix, grep, Lua, CPU, HTTP: nói “các ngôn ngữ lập trình phổ biến”, “thư viện quay lui”,
#   “bộ xử lý”, “lưu lượng trang mạng”. Tên Thompson chỉ trên màn hình; lời đọc nói “bài báo năm 1968”. Cloudflare đọc “Cờ-lao-phle-ơ” (lexicon_vi.TOC.yaml, probe p3 6/8, NOT_VERIFIED); RE2 mọi cách ≤ 4/8 → KHÔNG đọc,
#   lời đọc nói “bộ máy mới, tên ghi trên bảng”, “thư viện tuyến tính năm 2010”.
objectives:
  - "Kể lại hành trình khớp biểu thức chính quy qua năm chặng từ 1968 tới 2025, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại số nhánh của cách quay lui, cỡ tập trạng thái của cách Thompson, và đường cong số bước trong bài hậu kiểm năm 2019"
  - "Chọn bộ máy khớp hợp với nguồn gốc của mẫu và của chuỗi vào, kèm điều kiện đổi lựa chọn"
