scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một biểu thức chính quy làm sập 27 phút"
    checks:
      - "(14 * 60 + 9) - (13 * 60 + 42) == 27"
      - "round(60 / 20e-6) == 3000000"
    steps:
      - show: |
          <p>Ngày 2/7/2019, Cloudflare cập nhật một quy tắc của tường lửa ứng dụng. Quy tắc chứa một biểu thức chính quy <b>quay lui khổng lồ</b>: mọi lõi bộ xử lý phục vụ lưu lượng trang mạng trên toàn thế giới bị vắt kiệt.</p>
          <p>Từ 13:42 tới 14:09 (giờ quốc tế): khách hàng thấy trang lỗi 502, công ty mất <b>80%</b> lưu lượng — <b>27 phút</b>.</p>
          <p>Năm 2007, một bài viết đo: một bộ máy khớp phổ biến cần <b>hơn 60 giây</b> cho một chuỗi 29 ký tự; cách năm 1968 cần <b>20 phần triệu giây</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 1968 tới 2025 — vì sao lý thuyết ô-tô-mát của khoá này cứu được những hệ thống rất lớn.</div>
        focus: [1, 1, 2, 2, 3, 4]
        say: "Chào bạn, ngày 2 tháng 7 năm 2019, Cloudflare cập nhật một quy tắc của tường lửa ứng dụng. Quy tắc chứa một biểu thức chính quy quay lui khổng lồ, vắt kiệt mọi lõi bộ xử lý phục vụ lưu lượng trang mạng trên toàn thế giới. Từ 13 giờ 42 tới 14 giờ 9, khách hàng thấy trang lỗi 502, và công ty mất 80 phần trăm lưu lượng. Đó là 27 phút. Năm 2007, một bài viết đo được rằng một bộ máy khớp phổ biến cần hơn 60 giây cho một chuỗi chỉ 29 ký tự, trong khi cách làm từ năm 1968 cần 20 phần triệu giây. Hôm nay ta đi qua năm chặng từ 1968 tới 2025, để thấy lý thuyết ô-tô-mát của khoá này cứu được những hệ thống rất lớn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "alg.nfa_run({('q0', '0'): {'q0', 'q1'}, ('q0', '1'): {'q0'}, ('q1', '1'): {'q2'}}, 'q0', {'q2'}, '01')[0]"
      - "[sorted(S) for S in alg.nfa_run({('q0', '0'): {'q0', 'q1'}, ('q0', '1'): {'q0'}, ('q1', '1'): {'q2'}}, 'q0', {'q2'}, '01')[1]] == [['q0'], ['q0', 'q1'], ['q0', 'q2']]"
      - "alg.regex_lang('(0|1)*01', '01', 3) == {'01', '001', '101'}"
      - "10 ** 2 == 100 and 2 ** 10 == 1024"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 2</td><td>máy <b>không đơn định</b> chạy bằng <b>tập trạng thái</b>: mỗi ký hiệu đọc vào, mọi nhánh cùng đi một bước</td><td>máy “kết thúc bằng 01” đọc 01: tập q0 → tập q0, q1 → tập q0, q2, có q2 nên nhận</td></tr>
          <tr><td>bài 3</td><td><b>biểu thức chính quy</b> có ba phép: hoặc, ghép, sao; mô tả cùng lớp ngôn ngữ với ô-tô-mát</td><td><code>(0|1)*01</code> khớp 01, 001, 101 trong các chuỗi dài tới 3</td></tr>
          <tr><td>bài 13</td><td>số bước <b>đa thức</b> như n bình phương tăng chậm; số bước <b>mũ</b> như 2 mũ n tăng rất nhanh</td><td>n = 10: n bình phương là 100, còn 2 mũ 10 là 1024</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 2, máy không đơn định được chạy bằng tập trạng thái, mỗi ký hiệu đọc vào thì mọi nhánh cùng đi một bước. Máy kết thúc bằng 01 đọc chuỗi 01 đi từ tập q0, sang tập q0 và q1, rồi tập q0 và q2, có q2 nên nhận. Ở bài 3, biểu thức chính quy có ba phép hoặc, ghép, sao, và mô tả cùng lớp ngôn ngữ với ô-tô-mát. Ở bài 13, số bước đa thức như n bình phương tăng chậm, còn số bước mũ như 2 mũ n tăng rất nhanh. Với n bằng 10, n bình phương là 100, còn 2 mũ 10 đã là 1024."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    checks:
      - "alg.regex_lang('a?b', 'ab', 2) == {'b', 'ab'}"
      - "alg.regex_lang('.b', 'ab', 2) == {'ab', 'bb'}"
      - "alg.regex_lang('.*=.*', 'x=', 2) == {'=', 'x=', '=x', '=='}"
    steps:
      - show: |
          <table class="t"><tr><th>cách viết</th><th>nghĩa</th><th>làm thử</th></tr>
          <tr><td><code>a?</code></td><td>có một chữ a, hoặc không có gì</td><td><code>a?b</code> khớp b và ab</td></tr>
          <tr><td><code>.</code></td><td>một ký tự bất kỳ</td><td><code>.b</code> khớp ab và bb</td></tr>
          <tr><td><code>.*</code></td><td>bao nhiêu ký tự bất kỳ cũng được, kể cả không có ký tự nào</td><td><code>.*=.*</code> khớp =, x=, =x, ==</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Bài dùng thêm ba cách viết quen thuộc của biểu thức chính quy trong lập trình. Dấu hỏi sau chữ a nghĩa là có một chữ a, hoặc không có gì. Vì vậy a hỏi b khớp chuỗi chỉ có chữ b, và chuỗi a rồi b. Dấu chấm là một ký tự bất kỳ, nên chấm b khớp chuỗi a rồi b, và chuỗi hai chữ b. Chấm sao là bao nhiêu ký tự bất kỳ cũng được, kể cả không có ký tự nào. Do đó chấm sao, dấu bằng, chấm sao khớp các chuỗi dấu bằng, x bằng, bằng x, và hai dấu bằng."
      - clear: true
        show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>quay lui</b></td><td>thử một lựa chọn; hỏng thì quay lại, thử lựa chọn khác</td></tr>
          <tr><td><b>cách Thompson</b></td><td>giữ <b>tập</b> mọi vị trí có thể của mẫu, đọc mỗi ký tự đúng một lần — chính cách chạy máy không đơn định ở bài 2</td></tr>
          <tr><td><b>mẫu bệnh lý</b></td><td>mẫu làm số lựa chọn của cách quay lui bùng nổ</td></tr>
          <tr><td><b>tham chiếu ngược</b> <code>\1</code></td><td>khớp lại đúng đoạn đã khớp trước đó: <code>(cat|dog)\1</code> khớp catcat, không khớp catdog</td></tr>
          <tr><td><b>thời gian tuyến tính</b></td><td>chuỗi dài gấp đôi thì thời gian cỡ gấp đôi, không hơn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4", "1.5", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Quay lui là thử một lựa chọn, hỏng thì quay lại thử lựa chọn khác. Cách giữ tập, đặt theo tên tác giả bài báo năm 1968, là giữ tập mọi vị trí có thể của mẫu, đọc mỗi ký tự đúng một lần. Đó chính là cách chạy máy không đơn định ở bài 2. Mẫu bệnh lý là mẫu làm số lựa chọn của cách quay lui bùng nổ. Tham chiếu ngược khớp lại đúng đoạn đã khớp trước đó. Ví dụ mẫu ở bảng khớp một từ lặp lại hai lần liền nhau, nhưng không khớp hai từ khác nhau. Thời gian tuyến tính nghĩa là chuỗi dài gấp đôi thì thời gian cỡ gấp đôi, không hơn."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">1968</text><text x="160" y="200">giữ tập vị trí</text><text x="160" y="232">đọc mỗi ký tự một lần</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2007</text><text x="500" y="200">quay lui phổ biến</text><text x="500" y="232">hơn 60 giây, 29 ký tự</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2010</text><text x="850" y="200">RE2 mã nguồn mở</text><text x="850" y="232">mẫu từ bất kỳ ai</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2019</text><text x="1200" y="200">sự cố 27 phút</text><text x="1200" y="232">3868 quy tắc rà lại</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2025</text><text x="1540" y="200">an toàn là mục tiêu số 1</text><text x="1540" y="232">bỏ hẳn tham chiếu ngược</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → bị lãng quên → quy mô Internet → sự cố → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 1968, một bài báo giữ tập vị trí có thể của mẫu và đọc mỗi ký tự một lần. Năm 2007, cách quay lui đã phổ biến khắp nơi, và một chuỗi 29 ký tự có thể tốn hơn 60 giây. Năm 2010, một thư viện thời gian tuyến tính thành mã nguồn mở, cho những mẫu do bất kỳ ai gửi tới. Năm 2019 là sự cố 27 phút, rồi tới 2025, an toàn được ghi là mục tiêu số một."

  # ───────────────────────── 5. HAI CÁCH KHỚP ─────────────────────────
  - id: twoways
    kind: concept
    title: "Hai cách khớp cùng một mẫu"
