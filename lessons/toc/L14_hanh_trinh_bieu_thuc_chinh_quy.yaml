  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 1968 — khai sinh: đọc mỗi ký tự một lần"
    stage: {year: "1968", scale: "trình soạn thảo văn bản chia sẻ thời gian; mẫu dịch thành chương trình máy IBM 7094", source: "[TH68] [CX07]", practice: "giữ danh sách mọi khả năng hiện tại, đọc mỗi ký tự một lần, dựng danh sách cho ký tự kế tiếp — không quay lui; số trạng thái không quá độ dài mẫu"}
    checks:
      - "alg.thompson_match('a?a?a?aaa', 'aaa')[2] == 12 == 3 * 4"
      - "all(alg.thompson_match('a?' * n + 'a' * n, 'a' * n)[2] == n * (n + 1) for n in range(1, 30))"
      - "alg.thompson_match('a?' * 29 + 'a' * 29, 'a' * 29)[2] == 870 and max(alg.thompson_match('a?' * 29 + 'a' * 29, 'a' * 29)[1]) == 30"
    steps:
      - show: |
          <p><b>Điểm nghẽn</b> (bài báo năm 1968 của K. Thompson): các cách tìm trước đó <b>quay lui</b> khi một đường thử hỏng, nên tốn nhiều bộ nhớ, nhiều sổ sách và chạy chậm.</p>
          <p><b>Cách xử lý:</b> mỗi ký tự của văn bản được so với <b>danh sách mọi khả năng hiện tại</b>; trong lúc so, dựng danh sách cho ký tự kế tiếp. Hết danh sách thì danh sách mới thành danh sách hiện tại.</p>
          <p>Mẫu được dịch thành chương trình máy, dùng trong một trình soạn thảo văn bản chia sẻ thời gian.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng một, bài báo năm 1968 chỉ ra điểm nghẽn của các cách tìm trước đó. Chúng quay lui mỗi khi một đường thử hỏng, nên tốn nhiều bộ nhớ, nhiều sổ sách, và chạy chậm. Cách mới so mỗi ký tự của văn bản với danh sách mọi khả năng hiện tại, và trong lúc so thì dựng danh sách cho ký tự kế tiếp. Hết danh sách cũ, danh sách mới thành danh sách hiện tại. Mẫu được dịch thành chương trình máy, dùng ngay trong một trình soạn thảo văn bản chia sẻ thời gian."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mẫu ba lần <code>a?</code> rồi <code>aaa</code>, chuỗi <code>aaa</code></td><td>3 ký tự, mỗi ký tự xét một tập 4 vị trí</td><td>3 nhân 4 = $\hlb{12}$ lần xét</td></tr>
          <tr><td>Bước 2. tổng quát: n lần <code>a?</code>, chuỗi n chữ a</td><td>n ký tự, mỗi tập có n + 1 vị trí</td><td>n nhân (n + 1) lần xét</td></tr>
          <tr><td>Bước 3. n = 29</td><td>29 nhân 30</td><td>$\hlg{870}$ lần xét</td></tr></table>
          <p class="note">Thực hành: đọc văn bản một lần, giữ tập khả năng thay vì thử từng đường. Điều kiện: mẫu chỉ dùng hoặc, ghép, sao và các dạng viết tắt của chúng — đúng lớp chính quy của bài 3.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử với mẫu của hình vừa rồi. Bước một, chuỗi có 3 ký tự, mỗi ký tự xét một tập 4 vị trí, nên 3 nhân 4 là 12 lần xét. Bước hai, tổng quát với n lần a hỏi và n chữ a, mỗi tập có n cộng 1 vị trí, nên có n nhân n cộng 1 lần xét. Bước ba, với n bằng 29, ta được 29 nhân 30 là 870 lần xét. Thực hành rút ra là đọc văn bản một lần, giữ tập khả năng thay vì thử từng đường. Điều kiện là mẫu chỉ dùng hoặc, ghép, sao và các dạng viết tắt của chúng, đúng lớp chính quy của bài 3."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2007 — tăng trưởng: quay lui có mặt khắp nơi"
    stage: {year: "2007", scale: "các ngôn ngữ lập trình phổ biến dùng thư viện quay lui; chuỗi 29 ký tự tốn hơn 60 giây", source: "[CX07]", practice: "chọn bộ máy có thời gian dự đoán được trên mọi đầu vào; thử mẫu với chuỗi dài, không chỉ chuỗi ngắn; chỉ trả giá mũ khi thật cần tham chiếu ngược"}
    checks:
      - "2 ** 29 == 536870912"
      - "round(60 / 20e-6) == 3000000"
      - "[alg.bt_match('a?' * n + 'a' * n, 'a' * n)[1] for n in (5, 10, 15)] == [142, 7166, 311294]"
      - "[alg.thompson_match('a?' * n + 'a' * n, 'a' * n)[2] for n in (5, 10, 15)] == [30, 110, 240]"
      - "2 < alg.bt_match('a?' * 15 + 'a' * 15, 'a' * 15)[1] / alg.bt_match('a?' * 14 + 'a' * 14, 'a' * 14)[1] < 2.2"
    steps:
      - show: |
          <p><b>Quy mô</b> (bài viết năm 2007): nhiều ngôn ngữ lập trình phổ biến dùng chung một kiểu <b>thư viện quay lui</b>, được chép lại rộng rãi. Các công cụ đầu thập niên 1970 cũng quay lui, khi cú pháp còn chưa có ngoặc nhóm, dấu hoặc, dấu hỏi — nên lúc đó chấp nhận được.</p>
          <p><b>Điểm nghẽn:</b> mẫu ba lần <code>a?</code> ở hình trên, kéo dài thành 29 lần, có 2 mũ 29 cách chọn, chỉ cách cuối khớp. Một bộ máy quay lui cần <b>hơn 60 giây</b>; cách Thompson cần <b>20 phần triệu giây</b>.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Ở chặng hai, bài viết năm 2007 ghi rằng nhiều ngôn ngữ lập trình phổ biến dùng chung một kiểu thư viện quay lui, được chép lại rộng rãi. Các công cụ đầu thập niên 1970 cũng quay lui, nhưng khi ấy cú pháp chưa có ngoặc nhóm, dấu hoặc hay dấu hỏi, nên chấp nhận được. Điểm nghẽn hiện ra với mẫu của hình trên, kéo dài thành 29 lần a hỏi, có 2 mũ 29 cách chọn mà chỉ cách cuối khớp. Một bộ máy quay lui cần hơn 60 giây. Cách giữ tập chỉ cần 20 phần triệu giây."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. số cách chọn với 29 lần <code>a?</code></td><td>2 mũ 29</td><td>$\hl{536\,870\,912}$ cách</td></tr>
          <tr><td>Bước 2. chậm hơn bao nhiêu lần</td><td>60 giây chia 20 phần triệu giây</td><td>$\hl{3\,000\,000}$ lần</td></tr></table>
          <table class="t"><tr><th>bộ đếm của bài (số lần thử / số lần xét)</th><th>n = 5</th><th>n = 10</th><th>n = 15</th></tr>
          <tr><td>quay lui</td><td>142</td><td>7166</td><td>$\hl{311\,294}$</td></tr>
          <tr><td>cách Thompson: n nhân (n + 1)</td><td>30</td><td>110</td><td>$\hlg{240}$</td></tr></table>
        focus: [1, "1.2", "1.3", 2, "2.2", "2.3"]
        say: "Bây giờ tính lại. Bước một, 29 lần a hỏi cho 2 mũ 29, tức 536 triệu 870 nghìn 912 cách chọn. Bước hai, 60 giây chia 20 phần triệu giây là chậm hơn 3 triệu lần. Bảng dưới là bộ đếm của chính bài này, chạy cả hai cách trên cùng mẫu. Cách quay lui tăng từ 142 lần thử lên hơn 311 nghìn, và cứ thêm một chữ a là gấp hơn 2 lần. Cách giữ tập chỉ tăng từ 30 lên 240 lần xét, đúng n nhân n cộng 1."
      - clear: true
        show: |
          <p>Mẫu bệnh lý không chỉ ở ví dụ cố tình: bài viết nêu cả cách tách năm trường cách nhau bởi dấu cách bằng <code>(.*) (.*) (.*) (.*) (.*)</code>.</p>
          <p>Một thư viện quay lui phổ biến bắt đầu <b>trả lời sai</b> từ n = 23, vì tự bỏ cuộc sau một số bước tối đa.</p>
          <p class="note">Thực hành: chọn bộ máy có thời gian <b>dự đoán được</b> trên mọi đầu vào; thử mẫu với chuỗi dài. Điều kiện: chỉ trả giá mũ khi thật cần tham chiếu ngược, vì với nó, cách tốt nhất đã biết vẫn là mũ.</p>
        focus: [1, 2, 3, 3]
        say: "Mẫu bệnh lý không chỉ có ở ví dụ cố tình, bài viết nêu cả cách tách năm trường cách nhau bởi dấu cách, bằng năm nhóm chấm sao. Một thư viện quay lui phổ biến còn bắt đầu trả lời sai từ n bằng 23, vì tự bỏ cuộc sau một số bước tối đa. Thực hành rút ra là chọn bộ máy có thời gian dự đoán được trên mọi đầu vào, và thử mẫu với chuỗi dài. Điều kiện là chỉ trả giá mũ khi thật cần tham chiếu ngược, vì với nó, cách tốt nhất đã biết vẫn là mũ."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2010 — quy mô Internet: mẫu do bất kỳ ai gửi tới"
    stage: {year: "2010", scale: "dịch vụ tìm mã nguồn công khai nhận biểu thức chính quy từ bất kỳ ai trên Internet (từ 2006); RE2 thành mã nguồn mở 3/2010", source: "[CX10]", practice: "mẫu và chuỗi do người ngoài gửi tới thì dùng bộ máy bảo đảm thời gian tuyến tính, ngăn xếp cố định, không đệ quy; chấp nhận tốn bộ nhớ hơn và bỏ tham chiếu ngược"}
    checks:
      - "10 / 0.5 == 20"
      - "1000 * 10 == 10000 and 1000 * 0.5 == 500"
    steps:
      - show: |
          <p><b>Quy mô:</b> mùa hè 2006, Google dựng dịch vụ tìm mã nguồn công khai bằng biểu thức chính quy — <b>mẫu do bất kỳ ai trên Internet gửi tới</b>.</p>
          <p><b>Điểm nghẽn:</b> thư viện quay lui làm cho dễ khiến phép tìm tốn thời gian mũ hay ngăn xếp sâu tuỳ ý: dịch vụ sẽ <b>dễ bị tấn công từ chối dịch vụ</b>.</p>
          <p><b>Cách xử lý:</b> viết bộ máy mới, RE2: phần lớn tính năng quen thuộc nhưng <b>bảo đảm thời gian tuyến tính</b> và ngăn xếp cố định; bộ phân tích cú pháp không đệ quy. Tháng 3/2010 thành mã nguồn mở.</p>
        focus: [1, 2, 3, 3, 3]
        say: "Ở chặng ba, mùa hè năm 2006, Google dựng một dịch vụ tìm mã nguồn công khai bằng biểu thức chính quy, với mẫu do bất kỳ ai trên Internet gửi tới. Thư viện quay lui làm cho phép tìm dễ tốn thời gian mũ hay ngăn xếp sâu tuỳ ý, nên dịch vụ sẽ dễ bị tấn công từ chối dịch vụ. Họ viết một bộ máy mới, tên ghi trên bảng, giữ phần lớn tính năng quen thuộc nhưng bảo đảm thời gian tuyến tính và ngăn xếp cố định. Bộ phân tích cú pháp của nó không đệ quy. Tháng 3 năm 2010, thư viện này thành mã nguồn mở."
      - clear: true
        show: |
          <table class="t"><tr><th>cái giá (bài viết năm 2010)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. bộ nhớ mỗi mẫu: khoảng 10 KB, so với khoảng nửa KB</td><td>10 chia 0,5</td><td>gấp $\hl{20}$ lần</td></tr>
          <tr><td>Bước 2. lưu 1000 mẫu (số minh hoạ)</td><td>1000 nhân 10 KB; 1000 nhân 0,5 KB</td><td>$\hl{10\,000}$ KB so với 500 KB</td></tr>
          <tr><td>Bước 3. tính năng</td><td>bỏ thứ không làm được bằng ô-tô-mát</td><td>không có tham chiếu ngược</td></tr></table>
          <p class="note">Thực hành: mẫu hoặc chuỗi do người ngoài gửi tới thì dùng bộ máy bảo đảm tuyến tính. Điều kiện: chấp nhận tốn bộ nhớ hơn, có lúc chậm hơn một hằng số, và không có tham chiếu ngược.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Cái giá được ghi rõ. Bước một, mỗi mẫu tốn khoảng 10 KB bộ nhớ, so với khoảng nửa KB, tức 0 phẩy 5 KB, của thư viện quay lui, tức gấp 20 lần. Bước hai, nếu lưu 1000 mẫu, một số minh hoạ, thì cần 10 nghìn KB thay vì 500 KB. Bước ba, thứ gì không làm được bằng ô-tô-mát thì bỏ, nổi bật nhất là tham chiếu ngược. Thực hành rút ra là mẫu hoặc chuỗi do người ngoài gửi tới thì dùng bộ máy bảo đảm tuyến tính. Điều kiện là chấp nhận tốn bộ nhớ hơn, có lúc chậm hơn một hằng số, và không có tham chiếu ngược."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2019 — sự cố ở quy mô toàn cầu"
    stage: {year: "2019", scale: "476 thay đổi quy tắc trong 60 ngày (khoảng 3 giờ một lần); thay đổi tới mọi máy trên thế giới trong vài giây (phân vị 99 là 2,29 giây); 3868 quy tắc", source: "[CF19]", practice: "triển khai quy tắc theo từng bậc như phần mềm, giữ lối khẩn cấp cho tấn công đang diễn ra; đo thời gian bộ xử lý trong bộ kiểm thử; bộ máy có bảo đảm độ phức tạp; giữ lớp bảo vệ khi viết lại mã"}
    checks:
      - "(14 * 60 + 9) - (13 * 60 + 42) == 27"
      - "round(60 * 24 / 476, 2) == 3.03"
      - "sp.expand(sp.interpolate([(1, 23), (2, 33), (3, 45)], sp.Symbol('k')) - (sp.Symbol('k') ** 2 + 7 * sp.Symbol('k') + 15)) == 0"
      - "[k * k + 7 * k + 15 for k in (1, 2, 3, 20)] == [23, 33, 45, 555]"
      - "round(5353 / 555, 1) == 9.6"
    steps:
      - show: |
          <p><b>Quy mô</b> (bài hậu kiểm của Cloudflare, 12/7/2019): đội quy tắc xử lý <b>476</b> thay đổi trong 60 ngày; mọi thay đổi tới mọi máy trên thế giới trong vài giây. Quy tắc phải nhanh để chặn lỗ hổng mới.</p>
          <table class="t"><tr><th>giờ quốc tế</th><th>chuyện gì xảy ra</th></tr>
          <tr><td>13:42</td><td>một thay đổi nhỏ của quy tắc được đưa ra tự động, ở chế độ “mô phỏng” — nhưng vẫn phải chạy biểu thức</td></tr>
          <tr><td>13:45</td><td>cảnh báo đầu tiên; ngay sau đó mất 80% lưu lượng</td></tr>
          <tr><td>14:07 → 14:09</td><td>tắt tường lửa ứng dụng trên toàn cầu; lưu lượng và bộ xử lý trở lại bình thường</td></tr>
          <tr><td>14:52</td><td>bật lại sau khi thử ở một thành phố</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Ở chặng bốn, bài hậu kiểm của Cloudflare ngày 12 tháng 7 năm 2019 cho biết đội quy tắc xử lý 476 thay đổi trong 60 ngày. Mọi thay đổi tới mọi máy trên thế giới chỉ trong vài giây. Quy tắc phải nhanh để chặn lỗ hổng mới. Lúc 13 giờ 42, một thay đổi nhỏ được đưa ra tự động ở chế độ mô phỏng, nhưng chế độ này vẫn phải chạy biểu thức. Ba phút sau có cảnh báo đầu tiên, rồi mất 80 phần trăm lưu lượng. Lúc 14 giờ 7, họ tắt tường lửa ứng dụng trên toàn cầu, và tới 14 giờ 9 thì mọi thứ trở lại bình thường. Lúc 14 giờ 52, họ bật lại sau khi đã thử ở một thành phố."
      - clear: true
        show: |
          <p>Lõi của biểu thức, theo phụ lục của bài: <code>.*.*=.*</code>. Số bước của bộ máy quay lui họ đo trên chuỗi <code>x=</code> rồi k chữ x:</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. số đo: k = 1, 2, 3</td><td>23, 33, 45 — hiệu liên tiếp 10, rồi 12</td><td>hiệu tăng đều 2: dạng <b>bình phương</b></td></tr>
          <tr><td>Bước 2. khớp đa thức qua ba điểm</td><td>k bình phương + 7k + 15</td><td>k = 1 cho 1 + 7 + 15 = 23 ✓</td></tr>
          <tr><td>Bước 3. đoán k = 20 rồi so số đo</td><td>400 + 140 + 15</td><td>$\hlg{555}$ — đúng số họ đo</td></tr>
          <tr><td>Bước 4. thêm dấu chấm phẩy: <code>.*.*=.*;</code></td><td>5353 chia 555</td><td>gấp ≈ $\hl{9{,}6}$ lần, còn tăng nhanh hơn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Phụ lục của bài viết rút lõi biểu thức về chấm sao, chấm sao, dấu bằng, chấm sao, rồi đo số bước của bộ máy quay lui trên chuỗi x bằng theo sau là k chữ x. Bước một, với k bằng 1, 2, 3, họ đo được 23, 33, 45, hiệu liên tiếp là 10 rồi 12, tăng đều 2, nên đây là dạng bình phương. Bước hai, khớp một đa thức qua ba điểm, được k bình phương cộng 7 k cộng 15, và k bằng 1 cho đúng 23. Bước ba, đoán k bằng 20 được 400 cộng 140 cộng 15 là 555, đúng số họ đo. Bước bốn, chỉ thêm một dấu chấm phẩy ở cuối, số bước lên 5353, gấp khoảng 9 phẩy 6 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>nguyên nhân góp phần (bài hậu kiểm ghi 11 mục)</th><th>đã làm sau sự cố</th></tr>
          <tr><td>lớp bảo vệ chống biểu thức ăn quá nhiều bộ xử lý bị gỡ nhầm khi viết lại mã vài tuần trước</td><td>đưa lớp bảo vệ trở lại</td></tr>
          <tr><td>bộ máy khớp không có bảo đảm độ phức tạp</td><td>rà tay cả 3868 quy tắc; kế hoạch đổi sang bộ máy có bảo đảm thời gian chạy</td></tr>
          <tr><td>bộ kiểm thử không đo thời gian bộ xử lý</td><td>thêm đo hiệu năng cho mọi quy tắc vào bộ kiểm thử</td></tr>
          <tr><td>quy trình cho quy tắc không khẩn cấp đi thẳng ra toàn cầu</td><td>triển khai từng bậc như phần mềm, vẫn giữ lối khẩn cấp cho tấn công đang diễn ra</td></tr></table>
          <p class="note">Bài viết ghi: tìm ra một nguyên nhân gốc duy nhất thì dễ chịu, nhưng có thể che khuất sự thật.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bài hậu kiểm ghi 11 nguyên nhân góp phần, bảng chọn ra bốn. Lớp bảo vệ chống biểu thức ăn quá nhiều bộ xử lý đã bị gỡ nhầm khi viết lại mã vài tuần trước, và nay được đưa trở lại. Bộ máy khớp không có bảo đảm độ phức tạp, nên họ rà tay cả 3868 quy tắc và lên kế hoạch đổi sang bộ máy có bảo đảm thời gian chạy. Bộ kiểm thử không đo thời gian bộ xử lý, nên họ thêm phép đo hiệu năng cho mọi quy tắc. Quy tắc không khẩn cấp từng được đi thẳng ra toàn cầu, nay phải triển khai từng bậc, nhưng vẫn giữ lối khẩn cấp cho tấn công đang diễn ra. Bài viết nhắc, một nguyên nhân gốc duy nhất thì dễ chịu, nhưng có thể che khuất sự thật."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2025 — ổn định và tiếp tục phát triển: an toàn là mục tiêu số một"
    stage: {year: "2025", scale: "RE2 chạy trong sản phẩm của Google và nhiều nơi khác từ 2006; phần “vì sao chọn RE2” đưa lên đầu trang dự án ngày 30/7/2025", source: "[R2] [CF19]", practice: "an toàn trước tốc độ: thời gian tuyến tính, ngân sách bộ nhớ có giới hạn và hỏng nhẹ nhàng khi hết, không đệ quy; theo nguyên tắc không hỗ trợ cấu trúc chỉ có lời giải quay lui"}
    checks:
      - "alg.thompson_match('.*.*=.*', 'x=' + 'x' * 20)[2] == 106 and 106 <= 22 * 5"
      - "max(alg.thompson_match('.*.*=.*', 'x=' + 'x' * 20)[1]) == 5"
      - "alg.thompson_match('.*.*=.*', 'x=' + 'x' * 20)[0] and not alg.thompson_match('.*.*=.*', 'x' * 20)[0]"
      - "alg.thompson_match('.*.*=.*', 'x' * 20)[2] == 60 and 60 <= 20 * 5"
    steps:
      - show: |
          <p>Phần giới thiệu “vì sao chọn RE2” của dự án, đưa lên đầu trang dự án ngày 30/7/2025: dùng trong sản phẩm của Google và nhiều nơi khác <b>từ 2006</b>.</p>
          <table class="t"><tr><th>điều dự án ghi</th><th>vì sao</th></tr>
          <tr><td><b>an toàn là mục tiêu số một</b>: xử lý được mẫu từ người dùng không tin cậy</td><td>thời gian khớp tuyến tính theo độ dài chuỗi vào</td></tr>
          <tr><td>bộ phân tích, bộ dịch, bộ máy chạy đều có <b>ngân sách bộ nhớ</b>, hết thì hỏng nhẹ nhàng; không đệ quy</td><td>không tràn ngăn xếp</td></tr>
          <tr><td><b>không</b> nhắm nhanh hơn mọi bộ máy trong mọi trường hợp</td><td>xét mọi nhánh cùng lúc: “bi quan”, trong khi quay lui “lạc quan”, nhanh khi nhánh đầu đúng</td></tr>
          <tr><td>theo nguyên tắc, không hỗ trợ cấu trúc chỉ có lời giải quay lui</td><td>không có tham chiếu ngược</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.4", "2.5"]
        say: "Ở chặng năm, phần giới thiệu của dự án thư viện tuyến tính năm 2010 được đưa lên đầu trang dự án ngày 30 tháng 7 năm 2025. Phần ấy ghi rằng thư viện chạy trong sản phẩm của Google và nhiều nơi khác từ năm 2006. An toàn là mục tiêu số một, nghĩa là xử lý được mẫu từ người dùng không tin cậy, với thời gian khớp tuyến tính. Mọi phần đều có ngân sách bộ nhớ, hết thì hỏng nhẹ nhàng, và không dùng đệ quy để khỏi tràn ngăn xếp. Dự án nói thẳng họ không nhắm nhanh hơn mọi bộ máy trong mọi trường hợp. Họ xét mọi nhánh cùng lúc, một cách bi quan, còn quay lui thì lạc quan, nhanh khi nhánh đầu đúng. Theo nguyên tắc, thư viện không hỗ trợ cấu trúc chỉ có lời giải quay lui, nên không có tham chiếu ngược."
      - clear: true
        show: |
          <p>Làm lại lõi biểu thức năm 2019 bằng cách Thompson (bộ đếm của bài): mẫu <code>.*.*=.*</code> có 4 phần, nên có <b>5 vị trí</b>, giống hình 5 trạng thái trong phụ lục năm 2019.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. chuỗi <code>x=</code> rồi 20 chữ x: 22 ký tự</td><td>mỗi ký tự xét nhiều nhất 5 vị trí: 22 nhân 5 = 110</td><td>thật sự xét $\hlg{106}$ lần ≤ 110, khớp</td></tr>
          <tr><td>Bước 2. 20 chữ x, không có dấu bằng</td><td>20 nhân 5 = 100</td><td>xét 60 lần ≤ 100, không khớp</td></tr></table>
          <p class="note">Ổn định không có nghĩa là hết việc: bộ máy an toàn đổi lại bộ nhớ và tính năng. Mẫu cần tham chiếu ngược phải được viết lại, hoặc chạy riêng có giới hạn.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Làm lại lõi biểu thức năm 2019 bằng cách giữ tập, với bộ đếm của bài. Mẫu có 4 phần nên có 5 vị trí, giống hình 5 trạng thái trong phụ lục năm 2019. Bước một, chuỗi x bằng rồi 20 chữ x có 22 ký tự, mỗi ký tự xét nhiều nhất 5 vị trí, nên không quá 110 lần, thật sự là 106 lần và khớp. Bước hai, 20 chữ x không có dấu bằng thì không quá 100 lần, thật sự 60 lần, và trả lời không khớp. Ổn định không có nghĩa là hết việc, vì bộ máy an toàn đổi lại bộ nhớ và tính năng, nên mẫu cần tham chiếu ngược phải được viết lại, hoặc chạy riêng có giới hạn."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "2 ** 10 == 1024 and 2 ** 20 == 1048576 and 1048576 * 512 == 536870912"
      - "18 + 9 == 27"
      - "476 * 3 == 1428 and round(1428 / 24, 1) == 59.5"
      - "(45 - 33) - (33 - 23) == 2 and 45 + 14 == 59 == 4 * 4 + 7 * 4 + 15"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>536 870 912 cách</td><td>nhân đôi dần: 2 mũ 10 = 1024, 2 mũ 20 = 1 048 576, nhân 2 mũ 9 = 512 ra 536 870 912 ✓</td></tr>
          <tr><td>27 phút</td><td>đếm tay: 13:42 tới 14:00 là 18 phút, thêm 9 phút tới 14:09 ✓</td></tr>
          <tr><td>khoảng 3 giờ một lần</td><td>nhân ngược: 476 nhân 3 giờ = 1428 giờ ≈ 59,5 ngày, gần đúng 60 ngày ✓</td></tr>
          <tr><td>dạng bình phương</td><td>hiệu bậc hai không đổi: 12 − 10 = 2, nên k = 4 phải là 45 + 14 = 59, đúng công thức 16 + 28 + 15 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Nhân đôi dần, 2 mũ 10 là 1024, 2 mũ 20 là một triệu 48 nghìn 576, nhân thêm 512 ra đúng 536 triệu 870 nghìn 912. Đếm tay từ 13 giờ 42 tới 14 giờ là 18 phút, thêm 9 phút nữa tới 14 giờ 9, tổng 27 phút. Nhân ngược, 476 lần nhân 3 giờ là 1428 giờ, khoảng 59 phẩy 5 ngày, gần đúng 60 ngày. Cuối cùng, hiệu bậc hai không đổi bằng 2, nên k bằng 4 phải là 45 cộng 14 bằng 59, đúng như công thức cho 16 cộng 28 cộng 15."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "alg.bt_match('a?' * 5 + 'a' * 5, 'a' * 5)[1] == 142 and alg.bt_match('a?' * 15 + 'a' * 15, 'a' * 15)[1] > 2000 * 142"
