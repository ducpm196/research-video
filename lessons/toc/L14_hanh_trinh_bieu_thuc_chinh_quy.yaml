          <tr><td><b class="red">2.</b> “Đã qua kiểm thử là an toàn”</td><td>bộ kiểm thử chỉ xét chặn đúng, chặn nhầm; không đo thời gian bộ xử lý</td><td>đo hiệu năng của mọi quy tắc, thử cả chuỗi dài</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là kết luận đây là lỗi của người viết biểu thức. Bài hậu kiểm ghi 11 nguyên nhân góp phần, và mọi bước của quy trình đều đã làm đúng thủ tục. Hãy sửa ở mức hệ thống, gồm lớp bảo vệ, kiểm thử, và triển khai từng bậc. Bài học sai thứ hai là nghĩ đã qua kiểm thử là an toàn, trong khi bộ kiểm thử chỉ xét chặn đúng hay chặn nhầm, không đo thời gian bộ xử lý. Hãy đo hiệu năng của mọi quy tắc, và thử cả chuỗi dài."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Thử vài chuỗi ngắn thấy nhanh là được”</td><td>bộ đếm của bài: n = 5 chỉ 142 lần thử, n = 15 đã hơn 311 nghìn — gấp hơn 2000 lần</td><td>thử với chuỗi dài nhất có thể gặp; đặt giới hạn độ dài chuỗi vào</td></tr>
          <tr><td><b class="red">4.</b> “Đổi sang dạng lười <code>.*?</code> là hết lo”</td><td>bài năm 2019 ghi: với mẫu có dấu chấm phẩy, dạng lười không đổi thời gian chạy chút nào, vẫn 5353 bước</td><td>đổi bộ máy, hoặc viết lại mẫu cho cụ thể hơn</td></tr>
          <tr><td><b class="red">5.</b> “Bộ máy tuyến tính luôn nhanh hơn, cứ thay là xong”</td><td>dự án ghi rõ: có thể chậm hơn một hằng số, tốn bộ nhớ hơn, không có tham chiếu ngược</td><td>đo trên mẫu thật của mình; mẫu nào cần tham chiếu ngược thì viết lại</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bài học sai thứ ba là thử vài chuỗi ngắn thấy nhanh là được. Bộ đếm của bài cho thấy n bằng 5 chỉ 142 lần thử, nhưng n bằng 15 đã hơn 311 nghìn, gấp hơn 2000 lần, nên hãy thử với chuỗi dài nhất có thể gặp. Bài học sai thứ tư là nghĩ đổi sang dạng lười là hết lo. Bài năm 2019 ghi rằng với mẫu có dấu chấm phẩy, dạng lười không đổi thời gian chạy chút nào. Bài học sai thứ năm, của người đã đi làm, là nghĩ bộ máy tuyến tính luôn nhanh hơn, cứ thay là xong. Chính dự án ghi rằng nó có thể chậm hơn một hằng số, tốn bộ nhớ hơn, và không có tham chiếu ngược, nên hãy đo trên mẫu thật của mình."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "200 * 10 == 2000 and 200 * 0.5 == 100"
      - "alg.bt_match('a?' * 10 + 'a' * 10, 'a' * 10)[1] == 7166 and alg.thompson_match('a?' * 10 + 'a' * 10, 'a' * 10)[2] == 110"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: một ứng dụng 5000 người dùng (số minh hoạ)</th></tr>
          <tr><td>1</td><td>ô tìm kiếm cho người dùng <b>tự gõ biểu thức chính quy</b>, mỗi người lưu được vài mẫu, tổng khoảng 200 mẫu. Chọn bộ máy nào?</td></tr>
          <tr><td>2</td><td>công cụ nội bộ quét nhật ký bằng <b>một mẫu cố định</b> do đội tự viết, cần tham chiếu ngược để tìm từ lặp như “the the”. Có được dùng quay lui không?</td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, cho một ứng dụng 5000 người dùng, một số minh hoạ. Câu một, ô tìm kiếm cho người dùng tự gõ biểu thức chính quy, mỗi người lưu được vài mẫu, tổng khoảng 200 mẫu, vậy chọn bộ máy nào? Câu hai, một công cụ nội bộ quét nhật ký bằng một mẫu cố định do đội tự viết, cần tham chiếu ngược để tìm từ lặp, vậy có được dùng quay lui không? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>bộ máy tuyến tính</td><td>mẫu nào cũng chạy trong thời gian tuyến tính; một mẫu xấu không làm sập dịch vụ</td><td>200 nhân 10 KB = 2000 KB, so với 100 KB; không có tham chiếu ngược</td></tr>
          <tr><td>thư viện quay lui</td><td>đủ tính năng, ít bộ nhớ</td><td>như chặng 3: một người gõ mẫu bệnh lý là đủ ăn hết bộ xử lý</td></tr></table>
          <p class="note">Chọn bộ máy tuyến tính. Điều kiện đổi: chỉ khi mẫu không còn do người ngoài gõ — ví dụ đội chọn sẵn danh sách mẫu đã kiểm.</p>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Đáp án câu một là một đánh đổi. Bộ máy tuyến tính chạy mẫu nào cũng trong thời gian tuyến tính, nên một mẫu xấu không làm sập dịch vụ. Đổi lại, 200 mẫu nhân 10 KB là 2000 KB thay vì 100 KB, và không có tham chiếu ngược. Thư viện quay lui đủ tính năng, ít bộ nhớ, nhưng như ở chặng ba, chỉ một người gõ mẫu bệnh lý là đủ ăn hết bộ xử lý. Vậy nên chọn bộ máy tuyến tính, và chỉ đổi khi mẫu không còn do người ngoài gõ, ví dụ đội chọn sẵn một danh sách mẫu đã kiểm."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>quay lui, có rào chắn</td><td>có tham chiếu ngược; mẫu do đội viết và đã kiểm</td><td>phải đặt giới hạn thời gian mỗi dòng, giới hạn độ dài dòng, và thử với dòng dài nhất</td></tr>
          <tr><td>viết lại bằng mã thường</td><td>tách từ rồi so từ liền kề: đọc mỗi dòng một lần</td><td>thêm vài dòng mã phải tự kiểm</td></tr></table>
          <p class="note">Dùng được quay lui, với điều kiện có rào chắn. Bộ đếm của bài: mẫu bệnh lý n = 10 đã 7166 lần thử so với 110 lần xét. Điều kiện đổi: mẫu hoặc nhật ký đến từ bên ngoài thì quay về câu 1.</p>
        focus: [1, "1.2", "1.3", 2, 2, 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Quay lui có rào chắn giữ được tham chiếu ngược, và mẫu do đội viết, đã kiểm. Đổi lại phải đặt giới hạn thời gian mỗi dòng, giới hạn độ dài dòng, và thử với dòng dài nhất. Cách khác là viết lại bằng mã thường, tách từ rồi so từ liền kề, đọc mỗi dòng một lần. Vì bộ đếm của bài cho thấy mẫu bệnh lý với n bằng 10 đã tốn 7166 lần thử, so với 110 lần xét, rào chắn là bắt buộc. Nếu mẫu hoặc nhật ký đến từ bên ngoài, hãy quay về lựa chọn của câu một."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">1968: giữ tập vị trí, đọc một lần</span><span class="a">→</span>
          <span class="n">2007: quay lui khắp nơi, mũ</span><span class="a">→</span>
          <span class="n">2010: mẫu từ bất kỳ ai, tuyến tính</span><span class="a">→</span>
          <span class="n">2019: sự cố, sửa cả hệ thống</span><span class="a">→</span>
          <span class="n">2025: an toàn trước tốc độ</span></div>
        say: "Tổng kết lại hành trình. Năm 1968, cách giữ tập vị trí đọc mỗi ký tự một lần. Năm 2007, cách quay lui có mặt khắp nơi, với số lựa chọn tăng theo hàm mũ. Năm 2010, khi mẫu đến từ bất kỳ ai, người ta dựng bộ máy tuyến tính. Năm 2019, một sự cố toàn cầu được sửa ở cả hệ thống, và năm 2025, an toàn được đặt trước tốc độ."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi chọn bộ máy, hỏi <b>ai viết mẫu, ai gửi chuỗi vào</b>, và chuỗi dài nhất là bao nhiêu. Lý thuyết của bài 2 và bài 3 không chỉ để thi: nó cho lời bảo đảm thời gian.</div>
        say: "Điều cần mang theo, trước khi chọn bộ máy khớp, hãy hỏi ai viết mẫu, ai gửi chuỗi vào, và chuỗi dài nhất là bao nhiêu. Lý thuyết ô-tô-mát của bài 2 và biểu thức chính quy của bài 3 không chỉ để thi, nó cho ta lời bảo đảm về thời gian."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá TOC. Từ chuỗi và ô-tô-mát, qua văn phạm, máy Turing, bài toán không khả quyết và lớp P, NP, bạn đã thấy chính lý thuyết ấy quyết định một hệ thống rất lớn có sập hay không.</p>
        say: "Đây là bài cuối của khoá Lý thuyết tính toán. Từ chuỗi và ô-tô-mát, qua văn phạm, máy Turing, bài toán không khả quyết và hai lớp P, NP, bạn đã đi một chặng dài. Giờ bạn thấy chính lý thuyết ấy quyết định một hệ thống rất lớn có sập hay không. Cảm ơn bạn đã theo học."
