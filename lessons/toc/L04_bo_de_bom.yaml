scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy hữu hạn có đếm được không?"
    steps:
      - show: |
          <p>Ngôn ngữ $\{0^n 1^n\}$: $n$ chữ 0 rồi <b>đúng</b> $n$ chữ 1 — như $01$, $0011$, $000111$. Kiểm ngoặc mở và ngoặc đóng có bằng nhau là cùng loại câu hỏi.</p>
          <p>Một máy có $p$ trạng thái phải nhớ đã đọc bao nhiêu chữ 0. Đọc $p$ chữ 0 thì sao?</p>
          <div class="box key">Hôm nay: bổ đề bơm — công cụ chứng minh một ngôn ngữ <b>không</b> chính quy, và áp dụng cho $\{0^n 1^n\}$.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, xét ngôn ngữ gồm n chữ 0 rồi đúng n chữ 1, như 0 1, 0 0 1 1, hay 0 0 0 1 1 1. Kiểm số ngoặc mở và ngoặc đóng có bằng nhau là cùng loại câu hỏi này. Một máy có p trạng thái phải nhớ đã đọc bao nhiêu chữ 0. Vậy khi đọc tới p chữ 0 thì sao? Hôm nay ta học bổ đề bơm, công cụ chứng minh một ngôn ngữ không chính quy, và áp dụng cho ngôn ngữ này."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chuồng bồ câu và lặp chuỗi"
    checks:
      - "5 > 4 and -(-5 // 4) == 2"
      - "'00' * 0 == '' and '00' * 1 == '00' and '00' * 2 == '0000' and '1' + '00' * 2 + '1' == '100001'"
    steps:
      - show: |
          <table class="t"><tr><th>chim</th><th>chuồng</th><th>kết luận</th></tr>
          <tr><td>5</td><td>4</td><td>có một chuồng chứa <b>ít nhất 2</b> con</td></tr>
          <tr><td>$p + 1$</td><td>$p$</td><td>có một chuồng chứa ít nhất 2 con</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn hai điều sẽ dùng. Điều thứ nhất là nguyên lý chuồng bồ câu. Có 5 con chim mà chỉ có 4 cái chuồng, thì dù xếp thế nào cũng có một chuồng chứa ít nhất 2 con, vì nếu mỗi chuồng chỉ một con thì chỉ chứa được 4 con. Tổng quát, p cộng 1 con chim vào p cái chuồng thì có một chuồng chứa ít nhất 2 con."
      - show: |
          <table class="t"><tr><th>$y = 00$</th><th>$y^0$</th><th>$y^1$</th><th>$y^2$</th></tr>
          <tr><td>chuỗi</td><td>$\varepsilon$</td><td>$00$</td><td>$0000$</td></tr></table>
          <p>Với $x = 1$, $z = 1$: $x y^2 z = 1\,0000\,1 = 100001$.</p>
        focus: [0, 1, 1, 2]
        say: "Điều thứ hai, ở bài 0 ta đã học số mũ đặt trên một chuỗi nghĩa là ghép chuỗi đó lặp lại. Với y là 0 0, y mũ 0 là chuỗi rỗng, y mũ 1 là 0 0, y mũ 2 là bốn chữ 0. Nên y mũ i nghĩa là lặp y đúng i lần. Với x là 1 và z là 1, ghép x, y mũ 2 rồi z được 1 0 0 0 0 1."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: phát biểu bổ đề bơm"
    steps:
      - show: |
          <div class="box">Nếu $L$ chính quy thì có một số $p$ (độ dài bơm) sao cho <b>mọi</b> $w \in L$ với $|w| \ge p$ đều tách được thành $w = xyz$ thoả cả ba điều:</div>
          <ol><li>$|xy| \le p$ — phần $y$ nằm trong $p$ ký hiệu đầu;</li>
          <li>$|y| \ge 1$ — $y$ không rỗng;</li>
          <li>$xy^iz \in L$ với mọi $i \ge 0$ — lặp $y$ bao nhiêu lần, kể cả 0 lần, vẫn thuộc $L$.</li></ol>
        focus: [1, 1, 1, "2.1", "2.2", "2.3"]
        say: "Phát biểu bổ đề bơm. Nếu L chính quy thì có một số p, gọi là độ dài bơm. Mọi chuỗi w trong L có độ dài từ p trở lên đều tách được thành ba phần x, y, z thoả cả ba điều. Một, độ dài của x ghép y không quá p, tức phần y nằm trong p ký hiệu đầu. Hai, y không rỗng. Ba, lặp y bao nhiêu lần, kể cả 0 lần, chuỗi thu được vẫn thuộc L."

  # ───────────────────────── 3. VÌ SAO ─────────────────────────
  - id: why
    kind: concept
    title: "Vì sao đúng: chuồng bồ câu"
    steps:
      - show: |
          <p>Cho DFA $p$ trạng thái nhận $L$. Đọc $p$ ký hiệu đầu của $w$, máy đi qua $p + 1$ trạng thái (tính cả trạng thái đầu).</p>
          <p>$p + 1$ con chim vào $p$ cái chuồng → có một trạng thái <b>lặp lại</b>. Đoạn đọc giữa hai lần gặp nó là $y$: một <b>vòng</b>.</p>
          <div class="box key">Đi vòng đó 0, 1, 2… lần, máy vẫn về đúng trạng thái ấy, rồi đọc $z$ như cũ → kết quả nhận không đổi.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Vì sao bổ đề đúng? Giả sử có một máy đơn định p trạng thái nhận L. Đọc p ký hiệu đầu của w, máy đi qua p cộng 1 trạng thái, tính cả trạng thái đầu. Có p cộng 1 con chim mà chỉ p cái chuồng, nên có một trạng thái lặp lại, và đoạn đọc giữa hai lần gặp nó chính là y, một vòng. Đi vòng đó 0 lần, 1 lần hay 2 lần, máy vẫn về đúng trạng thái ấy, rồi đọc z như cũ, nên kết quả nhận không đổi."

  # ───────────────────────── 3b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Thấy vòng lặp trong một lượt chạy thật"
    checks:
      - "alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '1001') == (True, [0, 1, 2, 1, 0])"
      - "[int('1' + '00' * i + '1', 2) for i in range(3)] == [3, 9, 33] and all(n % 3 == 0 for n in (3, 9, 33))"
      - "all(alg.dfa_run({(r, b): (2 * r + int(b)) % 3 for r in range(3) for b in '01'}, 0, {0}, '1' + '00' * i + '1')[0] for i in range(6))"
      - "33 == 11 * 3"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><defs><marker id="arT4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g stroke="#1f2937" stroke-width="3"><line x1="208" y1="120" x2="390" y2="120" marker-end="url(#arT4)"/><line x1="508" y1="120" x2="690" y2="120" marker-end="url(#arT4)"/><line x1="808" y1="120" x2="990" y2="120" marker-end="url(#arT4)"/><line x1="1108" y1="120" x2="1290" y2="120" marker-end="url(#arT4)"/></g><circle cx="150" cy="120" r="55" fill="#eff6ff" stroke="#1f2937" stroke-width="3"/><text x="144" y="132" font-size="34" font-style="italic" text-anchor="middle" fill="#1f2937">q<tspan font-size="24" dy="9" font-style="normal">0</tspan></text><circle cx="450" cy="120" r="55" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="444" y="132" font-size="34" font-style="italic" text-anchor="middle" fill="#1f2937">q<tspan font-size="24" dy="9" font-style="normal">1</tspan></text><circle cx="750" cy="120" r="55" fill="#eff6ff" stroke="#1f2937" stroke-width="3"/><text x="744" y="132" font-size="34" font-style="italic" text-anchor="middle" fill="#1f2937">q<tspan font-size="24" dy="9" font-style="normal">2</tspan></text><circle cx="1050" cy="120" r="55" fill="#fed7aa" stroke="#1f2937" stroke-width="3"/><text x="1044" y="132" font-size="34" font-style="italic" text-anchor="middle" fill="#1f2937">q<tspan font-size="24" dy="9" font-style="normal">1</tspan></text><circle cx="1350" cy="120" r="55" fill="#eff6ff" stroke="#1f2937" stroke-width="3"/><text x="1344" y="132" font-size="34" font-style="italic" text-anchor="middle" fill="#1f2937">q<tspan font-size="24" dy="9" font-style="normal">0</tspan></text><g font-size="28" font-weight="bold" fill="#b45309" text-anchor="middle"><text x="300" y="105">1</text><text x="600" y="105">0</text><text x="900" y="105">0</text><text x="1200" y="105">1</text></g><path d="M170,215 L170,235 L430,235 L430,215" fill="none" stroke="#2563eb" stroke-width="3"/><text x="300" y="280" font-size="30" font-weight="bold" text-anchor="middle" fill="#2563eb">x = 1</text><path d="M470,215 L470,235 L1030,235 L1030,215" fill="none" stroke="#c2410c" stroke-width="3"/><text x="750" y="280" font-size="30" font-weight="bold" text-anchor="middle" fill="#c2410c">y = 00: từ q1 về lại q1</text><path d="M1070,215 L1070,235 L1330,235 L1330,215" fill="none" stroke="#2563eb" stroke-width="3"/><text x="1200" y="280" font-size="30" font-weight="bold" text-anchor="middle" fill="#2563eb">z = 1</text><text x="750" y="335" font-size="24" text-anchor="middle" fill="#1f2937">đi vòng y 0, 1, 2… lần thì vẫn đứng ở q1, rồi đọc z như cũ</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Lấy lại máy 3 trạng thái kiểm số nhị phân chia hết cho 3 của bài 1, trạng thái q r nghĩa là số đã đọc chia 3 dư r. Chạy trên 1 0 0 1, tức số 9, máy đi q 0, q 1, q 2, q 1, rồi về q 0 và nhận. Máy chỉ có 3 trạng thái nên trong 3 bước đầu, chắc chắn có một trạng thái gặp lại, ở đây là q 1. Đoạn đọc giữa hai lần gặp q 1 là y bằng 0 0, một vòng, phần trước là x bằng 1, phần sau là z bằng 1."
      - show: |
          <table class="t"><tr><th>số lần đi vòng $i$</th><th>chuỗi $x y^i z$</th><th>giá trị</th><th>chia 3</th></tr>
          <tr><td>0</td><td>$11$</td><td>3</td><td>dư 0, nhận</td></tr>
          <tr><td>1</td><td>$1001$</td><td>9</td><td>dư 0, nhận</td></tr>
          <tr><td>2</td><td>$100001$</td><td>33</td><td>$33 = 11 \times 3$, dư 0, nhận</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ làm thử bằng số, bơm vòng y nhiều lần. Đi vòng 0 lần được 1 1, bằng 3, chia hết cho 3. Đi 1 lần là chuỗi gốc 1 0 0 1, bằng 9. Đi 2 lần được 1 0 0 0 0 1, bằng 33, bằng 11 nhân 3, vẫn chia hết. Ngôn ngữ chính quy thì bơm kiểu này luôn ở lại trong ngôn ngữ, đó chính là điều bổ đề bơm nói."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chứng minh {0ⁿ1ⁿ} không chính quy"
    checks:
      - "all(alg.pump_survivors('0' * p + '1' * p, p, lambda s: s == '0' * (len(s) // 2) + '1' * (len(s) // 2)) == [] for p in range(1, 9))"
      - "sum(1 for i in range(5) for j in range(i + 1, 5)) == 10"
      - "all(set('00001111'[i:j]) == {'0'} for i in range(5) for j in range(i + 1, 5))"
      - "('0' + '00' * 2 + '01111')[:6] == '000000' and ('0' + '00' * 2 + '01111').count('0') == 6"
      - "[sum(1 for j in range(i + 1, 5)) for i in range(4)] == [4, 3, 2, 1] and 4 + 3 + 2 + 1 == 10"
      - "'0' + '00' * 2 + '01111' == '0000001111' and ('0' + '00' * 2 + '01111').count('1') == 4"
      - "'0' + '01111' == '001111' and '001111'.count('0') == 2 and '001111'.count('1') == 4"
    steps:
      - show: |
          <ol><li>Giả sử $\{0^n 1^n\}$ chính quy, với độ dài bơm $p$.</li>
          <li>Chọn $w = 0^p 1^p$: thuộc $L$, và $|w| = 2p \ge p$.</li>
          <li>Mọi cách tách có $|xy| \le p$ đều đặt $y$ trong khối $p$ chữ 0 đầu, nên $y = 0^k$ với $k \ge 1$.</li>
          <li>Bơm $i = 2$: $xy^2z = 0^{p+k} 1^p$ — nhiều chữ 0 hơn chữ 1, nên $\notin L$. Mâu thuẫn → $L$ <b>không chính quy</b>.</li></ol>
        focus: ["1.1", "1.2", "1.3", "1.4", "1.4"]
        say: "Chứng minh bằng phản chứng. Giả sử ngôn ngữ này chính quy, với độ dài bơm p. Ta chọn chuỗi p chữ 0 rồi p chữ 1, nó thuộc L và dài 2 p, không ngắn hơn p. Vì độ dài của x ghép y không quá p, nên mọi cách tách đều đặt y trong khối chữ 0 đầu, y gồm k chữ 0 với k ít nhất bằng 1. Bơm y lên hai lần thì được p cộng k chữ 0 mà chỉ p chữ 1, không thuộc L, mâu thuẫn với bổ đề, nên L không chính quy."
      - clear: true
        show: |
          <p><b>Bước 1.</b> Làm thử với $p = 4$, $w = 00001111$. Đếm cách tách thoả $|xy| \le 4$, $|y| \ge 1$, theo độ dài của $x$:</p>
          <table class="t"><tr><th>$|x|$</th><th>0</th><th>1</th><th>2</th><th>3</th><th>tổng</th></tr>
          <tr><td>số cách chọn $|y|$</td><td>4</td><td>3</td><td>2</td><td>1</td><td>$4 + 3 + 2 + 1 = \hl{10}$</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước một, làm thử bằng số với p bằng 4, chuỗi bốn chữ 0 rồi bốn chữ 1. Ta đếm các cách tách thoả hai điều kiện đầu, theo độ dài của x. Nếu x rỗng thì y dài từ 1 tới 4, có 4 cách, x dài 1 thì có 3 cách, cứ thế giảm dần, tổng cộng 4 cộng 3 cộng 2 cộng 1 bằng 10 cách tách."
      - show: |
          <p><b>Bước 2.</b> Vì $|xy| \le 4$ mà 4 ký hiệu đầu của $w$ là $0000$, cả 10 cách tách đều có $y$ <b>toàn chữ 0</b>.</p>
        say: "Bước hai, vì x ghép y dài không quá 4, mà 4 ký hiệu đầu của chuỗi đều là chữ 0, nên cả 10 cách tách đều có y toàn chữ 0."
      - show: |
          <p><b>Bước 3.</b> Lấy một cách tách, $x = 0$, $y = 00$, $z = 01111$, bơm $i = 2$:</p>
          $$x y^2 z = 0\,0000\,01111 = 000000\,1111$$
          <p>6 chữ 0 nhưng chỉ 4 chữ 1 → không thuộc $L$.</p>
        focus: [1, 2, 3]
        say: "Bước ba, lấy một cách tách cụ thể, x là 0, y là 0 0, z là 0 1 1 1 1, rồi bơm y hai lần. Ghép lại được sáu chữ 0 rồi bốn chữ 1. Sáu khác bốn, nên chuỗi này không thuộc L."
      - show: |
          <p><b>Bước 4.</b> Cùng cách tách, bơm $i = 0$ (bỏ hẳn $y$): $xz = 0\,01111 = 00\,1111$ — 2 chữ 0, 4 chữ 1, cũng không thuộc $L$.</p>
          <p class="note">Máy duyệt mọi cách tách với $p$ từ 1 đến 8: không cách nào bơm được.</p>
        focus: [1, 1, 2]
        say: "Bước bốn, với cùng cách tách, bơm i bằng 0, tức bỏ hẳn y, được hai chữ 0 rồi bốn chữ 1, cũng không thuộc L. Bơm lên hay bơm xuống đều hỏng, đúng như chứng minh. Máy đã duyệt mọi cách tách với p từ 1 đến 8, và không cách nào bơm được."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: ai chọn gì?"
    checks:
      - "len(list(__import__('itertools').combinations(range(5), 2))) == 5 * 4 // 2 == 10 == len([(i, j) for i in range(5) for j in range(i + 1, 5)])"
    steps:
      - show: |
          <table class="t"><tr><th>đối thủ chọn (ta phải chịu mọi lựa chọn)</th><th>ta chọn (một lựa chọn là đủ)</th></tr>
          <tr><td>độ dài bơm $p$</td><td>chuỗi $w \in L$, $|w| \ge p$</td></tr>
          <tr><td>cách tách $w = xyz$</td><td>số lần bơm $i$</td></tr></table>
          <p>Kiểm chứng minh: đã xử lý <b>mọi</b> cách tách chưa? $w$ có thật sự thuộc $L$ và đủ dài không?</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Tự kiểm bằng cách hỏi ai chọn gì. Đối thủ chọn độ dài bơm p, ta chọn một chuỗi w thuộc L đủ dài. Đối thủ chọn cách tách, ta chọn số lần bơm i, nên ta phải xử lý được mọi cách tách, còn i thì chỉ cần một. Cuối cùng kiểm lại w có thật sự thuộc L và đủ dài không."
      - clear: true
        show: |
          <p>Đếm lại số 10 của bước 1 bằng <b>đường khác</b>: một cách tách = chọn <b>hai vết cắt</b> trong 5 vị trí $0, 1, 2, 3, 4$ (trước, giữa hoặc sau 4 chữ 0 đầu).</p>
          <table class="t"><tr><th>vết cắt đầu</th><th>vết cắt sau</th><th>số cặp</th></tr>
          <tr><td>5 cách</td><td>4 cách còn lại, rồi chia 2 vì cặp không kể thứ tự</td><td>$\frac{5 \times 4}{2} = 10$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.2"]
        say: "Đếm lại số 10 của bước một bằng một đường khác. Một cách tách chính là chọn hai vết cắt, trong 5 vị trí trước, giữa hoặc sau bốn chữ 0 đầu. Vết cắt đầu có 5 cách, vết cắt sau có 4 cách còn lại, nhưng mỗi cặp bị đếm hai lần theo hai thứ tự. Vậy có 5 nhân 4 chia 2, bằng 10, khớp với bước một."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "all(alg.pump_survivors(w, 2, lambda s: __import__('re').fullmatch('(01)*', s) is not None) for w in alg.regex_lang('(01)*', '01', 10) if len(w) >= 2)"
      - "len('01') == 2 and '0000111'.count('0') == 4 and '0000111'.count('1') == 3 and len('0000111') == 7 and len('00001111') == 8"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tự chọn một cách tách thuận tiện <b class="red">(sai)</b>
          <br><span class="note">Cách tách do đối thủ chọn. Phải chỉ ra <b>mọi</b> cách tách thoả điều kiện đều bơm hỏng.</span></div>
        say: "Lỗi thứ nhất, tự chọn một cách tách thuận tiện cho mình. Cách tách do đối thủ chọn, nên phải chỉ ra mọi cách tách thoả điều kiện đều bơm hỏng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng bổ đề để chứng minh một ngôn ngữ <b>là</b> chính quy <b class="red">(sai)</b>
          <br><span class="note">Bổ đề chỉ là điều kiện cần. Có ngôn ngữ không chính quy mà vẫn thoả nó. Muốn chứng minh chính quy: dựng máy hoặc viết biểu thức.</span></div>
        say: "Lỗi thứ hai, dùng bổ đề để chứng minh một ngôn ngữ là chính quy. Bổ đề chỉ là điều kiện cần, có những ngôn ngữ không chính quy mà vẫn thoả nó. Muốn chứng minh chính quy thì phải dựng máy hoặc viết biểu thức."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn $w$ ngắn hơn $p$ hoặc không thuộc $L$ <b class="red">(sai)</b>
          <br><span class="note">Bổ đề chỉ hứa về chuỗi <b>thuộc</b> $L$ và dài ít nhất $p$. Ví dụ $(01)^*$ chính quy: mọi chuỗi đủ dài của nó đều bơm được với $p = 2$.</span></div>
          <table class="t"><tr><th>với $p = 4$, chọn</th><th>thuộc $L$?</th><th>dài $\ge 4$?</th><th>dùng được?</th></tr>
          <tr><td>$01$</td><td>có</td><td>không (dài 2)</td><td>không</td></tr>
          <tr><td>$0000111$</td><td>không (4 chữ 0, 3 chữ 1)</td><td>có</td><td>không</td></tr>
          <tr><td>$00001111$</td><td>có</td><td>có (dài 8)</td><td>được</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ ba, chọn chuỗi ngắn hơn p, hoặc chuỗi không thuộc L. Bổ đề chỉ hứa về chuỗi thuộc L và dài ít nhất p. Ví dụ ngôn ngữ lặp cặp 0 1 là chính quy, và máy kiểm thấy mọi chuỗi đủ dài của nó đều bơm được với p bằng 2."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Chỉ thử bơm lên <b class="red">(thiếu)</b>
          <br><span class="note">$i = 0$ (bỏ hẳn $y$) cũng hợp lệ, và đôi khi là lựa chọn dễ nhất.</span></div>
        say: "Lỗi thứ tư, chỉ nghĩ đến bơm lên. Chọn i bằng 0, tức bỏ hẳn y, cũng hợp lệ, và đôi khi là lựa chọn dễ nhất."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "all(alg.pump_survivors('0' * p + '1' * (2 * p), p, lambda s: s == '0' * s.count('0') + '1' * (2 * s.count('0'))) == [] for p in range(1, 7))"
      - "'00' + '111111' != '0' * 2 + '1' * 4"
      - "all(3 * p == p + 2 * p and 2 * p != 2 * (p - k) for p in range(1, 9) for k in range(1, p + 1))"
    steps:
      - show: |
          <p>Chứng minh $L = \{0^n 1^{2n}\}$ ($n$ chữ 0 rồi $2n$ chữ 1) không chính quy.</p>
          <table class="t"><tr><th>câu</th><th>hỏi</th></tr>
          <tr><td>1</td><td>Chọn chuỗi $w$ nào?</td></tr>
          <tr><td>2</td><td>$y$ có dạng gì, và bơm $i = 0$ được gì?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Chứng minh ngôn ngữ gồm n chữ 0 rồi 2 n chữ 1 không chính quy. Câu một, chọn chuỗi w nào? Câu hai, y có dạng gì, và bơm với i bằng 0 thì được gì? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $w = 0^p 1^{2p}$: thuộc $L$ vì có $p$ chữ 0 và $2p$ chữ 1; dài $p + 2p = 3p \ge p$.</p>
        say: "Đáp án câu một, chọn p chữ 0 rồi 2 p chữ 1. Chuỗi này thuộc L vì số chữ 1 gấp đôi số chữ 0, và nó dài p cộng 2 p, bằng 3 p, không ngắn hơn p."
      - show: |
          <p>② $|xy| \le p$ nên $y = 0^k$, $k \ge 1$. Bơm $i = 0$: $0^{p-k} 1^{2p}$, số chữ 1 là $2p \ne 2(p - k)$ → $\notin L$. Mâu thuẫn.</p>
          <p class="note">Bằng số, $p = 3$, $y = 0$: được $00\,111111$ — 2 chữ 0 nhưng 6 chữ 1, đáng lẽ phải là 4.</p>
        focus: [1, 1, 1, 2]
        say: "Câu hai, vì x ghép y dài không quá p nên y gồm k chữ 0, với k ít nhất bằng 1. Bơm với i bằng 0, còn p trừ k chữ 0 mà vẫn 2 p chữ 1, mà 2 p khác 2 lần của p trừ k vì k khác 0, nên không thuộc L. Điều này mâu thuẫn với bổ đề, vậy L không chính quy. Bằng số, p bằng 3 và y là một chữ 0, ta được 2 chữ 0 nhưng 6 chữ 1, đáng lẽ phải là 4."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">máy p trạng thái</span><span class="a">→</span>
          <span class="n">chuồng bồ câu: có vòng y</span><span class="a">→</span>
          <span class="n">bơm y vẫn thuộc L</span><span class="a">→</span>
          <span class="n">bơm hỏng = không chính quy</span></div>
        say: "Tổng kết lại, một máy p trạng thái đọc p ký hiệu thì phải lặp lại một trạng thái, tạo ra một vòng y. Bơm vòng đó, chuỗi vẫn thuộc L. Nếu mọi cách tách đều bơm hỏng thì ngôn ngữ không chính quy."
      - show: |
          <div class="box key"><b>Tư duy:</b> bộ nhớ hữu hạn không đếm được tới vô hạn. Ngôn ngữ nào cần “đếm không giới hạn” thì nghi ngờ nó không chính quy.</div>
        say: "Điều cần mang theo, bộ nhớ hữu hạn không đếm được tới vô hạn. Ngôn ngữ nào cần đếm không giới hạn thì hãy nghi ngờ nó không chính quy."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): quay lại ngôn ngữ chính quy — <b>tối thiểu hoá DFA</b>, tìm máy ít trạng thái nhất.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta quay lại ngôn ngữ chính quy và học tối thiểu hoá máy đơn định, tức tìm máy có ít trạng thái nhất. Hẹn gặp bạn ở bài tiếp theo."
