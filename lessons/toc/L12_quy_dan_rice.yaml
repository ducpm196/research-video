scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một định lý, vô số bài toán"
    steps:
      - show: |
          <ul><li>Chương trình này có in ra chữ A với mọi đầu vào không?</li>
          <li>Hai chương trình này có tính cùng một hàm không?</li>
          <li>Chương trình này có bao giờ trả về số âm không?</li></ul>
          <div class="box key">Hôm nay: quy dẫn — mượn bài toán dừng để chứng minh bài toán khác không khả quyết — và định lý Rice trả lời <b>cả ba</b> câu trên cùng lúc.</div>
        focus: ["1.1", "1.2", "1.3", 2]
        say: "Chào bạn, chương trình này có in ra chữ A với mọi đầu vào không? Hai chương trình này có tính cùng một hàm không? Chương trình này có bao giờ trả về số âm không? Hôm nay ta học quy dẫn, mượn bài toán dừng để chứng minh bài toán khác không khả quyết, và định lý Rice trả lời cả ba câu hỏi trên cùng một lúc."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bài toán dừng, và đổi đầu vào mà giữ câu trả lời"
    checks:
      - "int('1001', 2) == 9 and 9 % 3 == 0"
      - "int('1011', 2) == 11 and 11 % 3 == 2"
    steps:
      - show: |
          <table class="t"><tr><th>đã biết ở bài 11</th><th>nghĩa</th></tr>
          <tr><td>bài toán dừng</td><td>cho mã chương trình $P$ và đầu vào $x$: $P$ có dừng trên $x$ không?</td></tr>
          <tr><td>nửa khả quyết</td><td>chạy $P$ trên $x$ bằng máy vạn năng; dừng thì nói “có”</td></tr>
          <tr><td>không khả quyết</td><td>không có máy nào <b>luôn dừng</b> và trả lời đúng với <b>mọi</b> cặp</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn lại điều đã chứng minh ở bài 11. Bài toán dừng hỏi, cho mã chương trình P và đầu vào x, P có dừng trên x không. Nó nửa khả quyết, vì chạy P trên x bằng máy vạn năng, dừng thì nói có. Nhưng nó không khả quyết, không có máy nào luôn dừng và trả lời đúng với mọi cặp, vì máy D làm ngược đường chéo dẫn tới mâu thuẫn."
      - show: |
          <table class="t"><tr><th>câu hỏi gốc: chuỗi nhị phân chia hết cho 3?</th><th>đổi thành số thập phân</th><th>câu hỏi mới: số đó chia hết cho 3?</th></tr>
          <tr><td>$1001$</td><td>9</td><td>có, $9 = 3 \times 3$</td></tr>
          <tr><td>$1011$</td><td>11</td><td>không, $11$ chia 3 dư 2</td></tr></table>
        focus: [0, 0, "1.2", "1.3"]
        say: "Ý thứ hai cần ôn là đổi đầu vào mà giữ nguyên câu trả lời. Câu hỏi chuỗi nhị phân có chia hết cho 3 không, ta đổi chuỗi thành số thập phân rồi hỏi số đó. Chuỗi 1 0 0 1 đổi thành 9, chia hết cho 3, nên câu trả lời là có. Chuỗi 1 0 1 1 đổi thành 11, chia 3 dư 2, nên câu trả lời là không, đúng như câu hỏi gốc."

  - id: sym
    kind: symbol
    title: "Giải mã: quy dẫn"
    steps:
      - show: |
          <div class="box"><b>Quy dẫn A về B</b>: một cách biến mỗi đầu vào của A thành một đầu vào của B, sao cho câu trả lời giữ nguyên. Nhờ đó, có máy giải B thì có máy giải A.</div>
          <div class="box key">Đọc ngược lại: nếu A <b>không</b> khả quyết và A quy dẫn được về B, thì B cũng <b>không</b> khả quyết.</div>
        focus: [1, 1, 2]
        say: "Quy dẫn bài toán A về bài toán B là một cách biến mỗi đầu vào của A thành một đầu vào của B, sao cho câu trả lời giữ nguyên. Nhờ đó, có máy giải B thì có máy giải A. Đọc ngược lại, nếu A không khả quyết, và A quy dẫn được về B, thì B cũng không khả quyết."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Quy dẫn là một đường ống"
    steps:
      - clear: true
        show: |
          <div><svg width="1440" height="430" viewBox="0 0 1440 430"><defs><marker id="aQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="270" y="80" width="870" height="230" rx="18" fill="#f8fafc" stroke="#6b7280" stroke-width="3" stroke-dasharray="12 8"/><text x="705" y="65" font-size="24" text-anchor="middle" fill="#374151">ghép lại = một máy quyết định bài toán dừng</text><g font-size="24" text-anchor="middle" fill="#1f2937"><rect x="20" y="150" width="210" height="100" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="125" y="195">cặp P, x</text><text x="125" y="228">của bài toán dừng</text><rect x="300" y="130" width="400" height="140" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="500" y="175">dựng Q: bỏ qua y,</text><text x="500" y="208">chạy P trên x,</text><text x="500" y="241">rồi in A</text><rect x="770" y="140" width="340" height="120" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="940" y="190">máy quyết định B</text><text x="940" y="223">(giả định có)</text><rect x="1190" y="150" width="230" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1305" y="210">có / không</text></g><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="230" y1="200" x2="294" y2="200" marker-end="url(#aQ)"/><line x1="700" y1="200" x2="764" y2="200" marker-end="url(#aQ)"/><line x1="1110" y1="200" x2="1184" y2="200" marker-end="url(#aQ)"/></g><text x="735" y="190" font-size="24" text-anchor="middle" fill="#1f2937">Q</text><g font-size="24" text-anchor="middle"><text x="720" y="360" fill="#1f2937">P dừng trên x khi và chỉ khi Q in A với mọi y: câu trả lời giữ nguyên</text><text x="720" y="405" fill="#b91c1c">bài 11 nói khung đứt nét không thể có, nên hộp đỏ không thể có</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ quy dẫn như một đường ống. Cặp P và x của bài toán dừng đi vào hộp vàng, hộp này dựng ra chương trình Q, bỏ qua đầu vào y, chạy P trên x rồi in chữ A. Chương trình Q được đưa cho hộp đỏ, một máy giả định quyết định được bài toán B, rồi trả lời có hoặc không. Vì P dừng trên x khi và chỉ khi Q in A với mọi y, khung đứt nét ghép lại là một máy quyết định bài toán dừng. Bài 11 đã chứng minh máy đó không thể có, nên hộp đỏ cũng không thể có."

  - id: example
    kind: example
    title: "Quy dẫn bài toán dừng về “luôn in chữ A”"
    checks:
      - "alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '0110', 0, 'F')[1:3] == (5, 'H')"
      - "all((lambda P, q0, x, y: 'A' if alg.tm_run(P, x, 0, q0, limit=10000)[2] == 'H' else None)({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, 'F', '0110', y) == 'A' for y in ['0', '11', ''])"
      - "alg.tm_run({('R', '_'): ('R', '_', 'R')}, '', 0, 'R', limit=10000)[1:3] == (10000, 'R')"
      - "all((lambda P, q0, x, y: 'A' if alg.tm_run(P, x, 0, q0, limit=10000)[2] == 'H' else None)({('R', '_'): ('R', '_', 'R')}, 'R', '', y) is None for y in ['0', '11', ''])"
    steps:
      - show: |
          <p>Bài toán B: $Q$ có in ra chữ A với <b>mọi</b> đầu vào không? Cho một cặp $\langle P, x \rangle$ của bài toán dừng, dựng chương trình:</p>
          <div class="code"><div>Q(y):  # bỏ qua y</div><div>    chạy P trên x  (tắt mọi lệnh in của P)</div><div>    in "A"</div></div>
          <ul><li>$P$ dừng trên $x$ → $Q$ in A với mọi $y$ → câu trả lời của B là <b>có</b>.</li>
          <li>$P$ chạy mãi → $Q$ không bao giờ in → <b>không</b>.</li></ul>
        focus: [1, 2, 2, "3.1", "3.2"]
        say: "Bài toán B hỏi chương trình Q có in ra chữ A với mọi đầu vào không. Cho một cặp P và x của bài toán dừng, ta dựng chương trình Q như trên màn hình. Q bỏ qua đầu vào y, chạy P trên x với mọi lệnh in của P bị tắt, rồi in chữ A. Nếu P dừng trên x thì Q in A với mọi y, nên câu trả lời của B là có. Nếu P chạy mãi thì Q không bao giờ in gì, nên câu trả lời là không."
      - clear: true
        show: |
          <p>Làm thử với hai cặp cụ thể. $P_1$ = bảng đảo bit, $x = 0110$; $P_2$ = bảng một dòng “gặp ô trống thì ghi ô trống, sang phải”, $x$ = băng trống.</p>
          <table class="t"><tr><th>bước</th><th>việc</th><th>kết quả</th></tr>
          <tr><td>Bước 1</td><td>chạy $P_1$ trên $0110$</td><td>dừng sau 5 bước</td></tr></table>
        focus: [1, 1, 2]
        say: "Làm thử với hai cặp cụ thể, cặp thứ nhất là P một, bảng đảo bit, với x bằng 0 1 1 0. Cặp thứ hai là P hai, bảng một dòng gặp ô trống thì ghi ô trống rồi sang phải, chạy trên băng trống. Bước một, chạy P một trên 0 1 1 0, máy dừng sau 5 bước."
      - show: |
          <table class="t"><tr><td>Bước 2</td><td>$Q_1$ trên $y = 0$, $y = 11$, $y$ rỗng</td><td>mỗi lần: chạy 5 bước rồi in A → B trả lời <b>có</b></td></tr></table>
        say: "Bước hai, dựng Q một từ cặp này rồi chạy trên y bằng 0, y bằng 1 1, và y rỗng. Lần nào Q một cũng bỏ qua y, chạy 5 bước của P một rồi in chữ A, nên bài toán B trả lời có."
      - show: |
          <table class="t"><tr><td>Bước 3</td><td>chạy $P_2$ trên băng trống</td><td>sau 10 000 vòng vẫn sang phải, chưa dừng</td></tr>
          <tr><td>Bước 4</td><td>$Q_2$ trên mọi $y$</td><td>kẹt trong $P_2$, không bao giờ in A → B trả lời <b>không</b></td></tr></table>
        focus: ["1.1", "1.2"]
        say: "Bước ba, chạy P hai trên băng trống, sau 10 nghìn vòng nó vẫn sang phải và chưa dừng, mà mỗi vòng lại gặp ô trống mới, nên nó chạy mãi. Bước bốn, vì vậy Q hai kẹt trong P hai với mọi y, không bao giờ in chữ A, và bài toán B trả lời không."
      - show: |
          <div class="box key">Câu trả lời của B về $Q$ đúng bằng câu trả lời của bài toán dừng về $\langle P, x \rangle$. Có máy quyết định B thì quyết định được bài toán dừng — vô lý theo bài 11. Vậy B <b>không khả quyết</b>.</div>
        say: "Vậy câu trả lời của B về Q đúng bằng câu trả lời của bài toán dừng về cặp P, x. Có máy quyết định B thì quyết định được bài toán dừng, điều ở bài 11 đã chứng minh là không thể. Vậy B không khả quyết."

  # ───────────────────────── 4. ĐỊNH LÝ RICE ─────────────────────────
  - id: rice
    kind: concept
    title: "Định lý Rice (1953)"
    steps:
      - show: |
          <div class="box key"><b>Định lý Rice.</b> Mọi tính chất <b>ngữ nghĩa</b> và <b>không tầm thường</b> của chương trình đều không khả quyết.</div>
          <ul><li><b>Ngữ nghĩa:</b> chỉ phụ thuộc chương trình <b>làm gì</b> — đầu vào nào cho đầu ra nào, dừng hay không — không phụ thuộc mã viết ra sao.</li>
          <li><b>Không tầm thường:</b> có ít nhất một chương trình có tính chất đó, và ít nhất một chương trình không có.</li></ul>
          <p class="note">Ví dụ vừa rồi là một trường hợp riêng: “in A với mọi đầu vào” là tính chất ngữ nghĩa, không tầm thường.</p>
        focus: [1, "2.1", "2.2", 3]
        say: "Định lý Rice, năm 1953, phát biểu, mọi tính chất ngữ nghĩa và không tầm thường của chương trình đều không khả quyết. Ngữ nghĩa nghĩa là chỉ phụ thuộc chương trình làm gì, đầu vào nào cho đầu ra nào, dừng hay không, chứ không phụ thuộc mã viết ra sao. Không tầm thường nghĩa là có ít nhất một chương trình có tính chất đó, và ít nhất một chương trình không có. Ví dụ in chữ A với mọi đầu vào vừa rồi chỉ là một trường hợp riêng của định lý."

  # ───────────────────────── 5. PHÂN LOẠI ─────────────────────────
  - id: classify
    kind: concept
    title: "Ngữ nghĩa hay cú pháp?"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi về chương trình</th><th>loại</th><th>khả quyết?</th></tr>
          <tr><td>mã có hơn 100 dòng</td><td>cú pháp</td><td><b>có</b> — đếm dòng</td></tr>
          <tr><td>trả về 0 với mọi đầu vào</td><td>ngữ nghĩa, không tầm thường</td><td><b class="red">không</b> (Rice)</td></tr>
          <tr><td>dừng khi đầu vào rỗng</td><td>ngữ nghĩa, không tầm thường</td><td><b class="red">không</b> (Rice)</td></tr>
          <tr><td>tính ra một hàm nào đó</td><td>ngữ nghĩa nhưng <b>tầm thường</b></td><td><b>có</b> — luôn trả lời “có”</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Thử phân loại bốn câu hỏi. Mã có hơn 100 dòng là câu hỏi cú pháp, khả quyết, chỉ cần đếm dòng. Trả về 0 với mọi đầu vào là tính chất ngữ nghĩa không tầm thường, nên theo Rice là không khả quyết. Dừng khi đầu vào rỗng cũng vậy. Còn tính ra một hàm nào đó là tính chất mọi chương trình đều có, tầm thường, nên khả quyết bằng cách luôn trả lời có."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm trước khi dùng Rice"
    checks:
      - "alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '0110', 0, 'F')[2] == 'H' and alg.tm_run({('R', '_'): ('R', '_', 'R')}, '', 0, 'R', limit=10000)[2] != 'H'"
      - "len([x for x in alg.strings('01', 4) if x]) == 30 and 2 * 30 == 60"
      - "all((alg.tm_run(P, x, 0, q0, limit=10000)[2] == 'H') == ((lambda P, q0, x, y: 'A' if alg.tm_run(P, x, 0, q0, limit=10000)[2] == 'H' else None)(P, q0, x, '0') == 'A') for P, q0 in [({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, 'F'), ({('R', '_'): ('R', '_', 'R')}, 'R')] for x in alg.strings('01', 4) if x)"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác: hỏi thẳng bài toán dừng</th><th>dừng?</th><th>B nói về $Q$</th><th>khớp?</th></tr>
          <tr><td>$P_1$ trên $0110$: máy vạn năng chạy thẳng</td><td>có, 5 bước</td><td>có</td><td>✓</td></tr>
          <tr><td>$P_2$ trên băng trống: mỗi vòng sang ô trống mới</td><td>không</td><td>không</td><td>✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Tự kiểm bằng đường khác, bỏ qua Q và hỏi thẳng bài toán dừng. P một trên 0 1 1 0 dừng sau 5 bước, và bài toán B cũng nói có về Q một, khớp. P hai trên băng trống không dừng, vì mỗi vòng nó lại sang một ô trống mới, và B cũng nói không về Q hai, cũng khớp."
      - show: |
          <table class="t"><tr><th>máy thử nhiều cặp</th><th>kết quả</th></tr>
          <tr><td>2 bảng × 30 chuỗi $x$ khác rỗng dài tới 4 = 60 cặp</td><td>cả 60 cặp: “P dừng trên x” trùng “Q in A” ✓</td></tr></table>
        focus: [0, "1.2"]
        say: "Rồi cho máy thử nhiều cặp hơn, theo cùng cách dựng, hai bảng nhân với 30 chuỗi khác rỗng dài tới 4, được 60 cặp. Cả 60 cặp, câu trả lời P có dừng trên x đều trùng với câu trả lời Q có in A."
      - show: |
          <table class="t"><tr><th>trước khi dùng Rice, hỏi</th><th>nếu câu trả lời là “không”</th></tr>
          <tr><td>Hai chương trình viết khác nhau nhưng làm <b>cùng</b> việc có cùng câu trả lời không?</td><td>tính chất cú pháp, Rice không áp dụng</td></tr>
          <tr><td>Có chỉ ra được một chương trình <b>có</b> và một chương trình <b>không có</b> tính chất không?</td><td>tầm thường</td></tr>
          <tr><td>Quy dẫn đã biến bài toán <b>đã biết</b> khó thành bài toán mới chưa?</td><td>ngược chiều, chưa chứng minh gì</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm trước khi dùng định lý Rice bằng ba câu hỏi, vì áp Rice sai chỗ là lỗi rất hay gặp. Một, hai chương trình viết khác nhau nhưng làm cùng việc thì có cùng câu trả lời không, nếu không thì đó là tính chất cú pháp và Rice không áp dụng. Hai, có chỉ ra được một chương trình có và một chương trình không có tính chất đó không, nếu không thì nó tầm thường. Ba, quy dẫn đã đúng chiều chưa, phải biến bài toán đã biết là khó thành bài toán mới, không phải ngược lại."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '0110', 0, 'F', limit=101)[1:3] == (5, 'H')"
      - "alg.tm_run({('R', '_'): ('R', '_', 'R')}, '', 0, 'R', limit=101)[1:3] == (101, 'R')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Áp Rice cho tính chất của <b>mã</b> <b class="red">(sai)</b>
          <br><span class="note">“Có dùng biến tên x không” là cú pháp: khả quyết. Rice chỉ nói về điều chương trình <b>làm</b>.</span></div>
        say: "Lỗi thứ nhất, áp định lý Rice cho tính chất của mã. Câu hỏi có dùng biến tên x không là câu hỏi cú pháp, khả quyết, vì Rice chỉ nói về điều chương trình làm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ Rice cấm mọi công cụ phân tích chương trình <b class="red">(sai)</b>
          <br><span class="note">Công cụ thật trả lời <b>gần đúng</b>: bộ kiểm kiểu từ chối cả vài chương trình đúng để không bao giờ cho qua chương trình sai.</span></div>
        say: "Lỗi thứ hai, nghĩ định lý Rice cấm mọi công cụ phân tích chương trình. Các công cụ thật trả lời gần đúng, ví dụ bộ kiểm kiểu sẵn sàng từ chối vài chương trình đúng, để không bao giờ cho qua chương trình sai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quy dẫn ngược chiều <b class="red">(không chứng minh được gì)</b>
          <br><span class="note">Biến bài toán mới thành bài toán dừng chỉ cho thấy nó <b>không khó hơn</b> bài toán dừng. Phải biến bài toán dừng thành bài toán mới.</span></div>
        say: "Lỗi thứ ba, quy dẫn ngược chiều. Biến bài toán mới thành bài toán dừng chỉ cho thấy nó không khó hơn bài toán dừng, nên phải làm chiều kia, biến bài toán dừng thành bài toán mới."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lẫn “chạy quá 100 bước” với tính chất ngữ nghĩa <b class="red">(sai)</b>
          <br><span class="note">Câu hỏi về <b>số bước</b> có giới hạn thì mô phỏng 100 bước là trả lời được — khả quyết. Nó nói về cách chạy, không về hàm được tính.</span></div>
          <table class="t"><tr><th>mô phỏng tối đa 101 bước</th><th>dừng ở bước</th><th>chạy quá 100 bước?</th></tr>
          <tr><td>$P_1$ trên $0110$</td><td>5</td><td>không</td></tr>
          <tr><td>$P_2$ trên băng trống</td><td>bước 101 vẫn chạy</td><td>có</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư, lẫn câu hỏi chạy quá 100 bước với tính chất ngữ nghĩa. Câu hỏi về số bước có giới hạn thì chỉ cần mô phỏng 100 bước là trả lời được, nên khả quyết, vì nó nói về cách chạy chứ không về hàm được tính. Mô phỏng tối đa 101 bước, P một dừng ở bước 5 nên không quá 100 bước, còn P hai tới bước 101 vẫn chạy nên có quá."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.tm_run({('R', '_'): ('R', '_', 'R')}, '', 0, 'R', limit=101)[1] == 101"
      - "alg.tm_run({('F', '0'): ('F', '1', 'R'), ('F', '1'): ('F', '0', 'R'), ('F', '_'): ('H', '_', 'S')}, '0110', 0, 'F', limit=101)[1] == 5"
      - "all(n > 1 and all(n % d for d in range(2, n)) for n in [2]) and 4 == 2 * 2"
    steps:
      - show: |
          <p>Khả quyết hay không? Giải thích bằng một câu.</p>
          <ol><li>Chương trình có chứa vòng lặp <code>while</code>.</li>
          <li>Chương trình in ra một số nguyên tố với mọi đầu vào.</li>
          <li>Chương trình chạy quá 100 bước khi đầu vào rỗng.</li>
          <li>Hai chương trình cho cùng đầu ra với mọi đầu vào.</li></ol>
        focus: [1, 1, "2.1", "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Với mỗi câu hỏi sau, hãy nói khả quyết hay không, và giải thích bằng một câu. Câu một, chương trình có chứa một vòng lặp. Câu hai, chương trình in ra một số nguyên tố với mọi đầu vào. Câu ba, chương trình chạy quá 100 bước khi đầu vào rỗng. Câu bốn, hai chương trình cho cùng đầu ra với mọi đầu vào. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>hai chương trình cùng việc, viết khác?</th><th>có / không có?</th><th>kết luận</th></tr>
          <tr><td>1</td><td>có thể khác câu trả lời → cú pháp</td><td>—</td><td><b>khả quyết</b>, đọc mã</td></tr>
          <tr><td>2</td><td>luôn cùng câu trả lời → ngữ nghĩa</td><td>in 2 luôn: có; in 4 luôn: không</td><td><b class="red">không</b> (Rice)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Đáp án, áp hai câu hỏi tự kiểm cho từng câu. Câu một, khả quyết, vì đó là câu hỏi cú pháp, đọc mã là biết, hai chương trình cùng việc có thể một cái có vòng lặp, một cái không. Câu hai, không khả quyết, vì đó là tính chất ngữ nghĩa không tầm thường. Chương trình luôn in 2 có tính chất này, còn chương trình luôn in 4 thì không, vì 4 bằng 2 nhân 2."
      - show: |
          <table class="t"><tr><td>3</td><td>mô phỏng đúng 101 bước, như bảng của lỗi 4</td><td>$P_1$: dừng ở bước 5; $P_2$: bước 101 vẫn chạy</td><td><b>khả quyết</b></td></tr>
          <tr><td>4</td><td>quy dẫn từ B: so $Q$ với chương trình “in A”</td><td>cùng đầu ra khi và chỉ khi $P$ dừng trên $x$</td><td><b class="red">không</b></td></tr></table>
        focus: ["1.1", "1.1", "1.2", "1.2"]
        say: "Câu ba, khả quyết, chỉ cần mô phỏng đúng 100 bước rồi xem đã dừng chưa. Như bảng của lỗi thứ tư, P một dừng ở bước 5, còn P hai tới bước 101 vẫn chạy, và mô phỏng có giới hạn luôn kết thúc. Câu bốn, không khả quyết, vì nếu quyết định được thì so một chương trình với chương trình luôn in chữ A, ta giải được bài toán B ở trên. Chương trình Q dựng từ cặp P, x cho cùng đầu ra với chương trình in A khi và chỉ khi P dừng trên x."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bài toán dừng không khả quyết</span><span class="a">→</span>
          <span class="n">quy dẫn đúng chiều</span><span class="a">→</span>
          <span class="n">bài toán mới không khả quyết</span><span class="a">→</span>
          <span class="n">Rice: mọi tính chất ngữ nghĩa không tầm thường</span></div>
        say: "Tổng kết lại, từ bài toán dừng không khả quyết, một quy dẫn đúng chiều cho thấy bài toán mới cũng không khả quyết. Định lý Rice gom cả họ, mọi tính chất ngữ nghĩa không tầm thường của chương trình đều không khả quyết."
      - show: |
          <div class="box key"><b>Tư duy:</b> gặp câu hỏi “chương trình này có bao giờ làm X không”, hãy nghĩ ngay tới Rice, rồi tìm câu hỏi gần đúng mà máy trả lời được.</div>
        say: "Điều cần mang theo, gặp câu hỏi chương trình này có bao giờ làm một việc gì đó không, hãy nghĩ ngay tới định lý Rice, rồi tìm một câu hỏi gần đúng mà máy trả lời được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): với các bài toán khả quyết, giải <b>nhanh</b> đến đâu? Độ phức tạp theo máy Turing: <b>P</b> và <b>NP</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta hỏi với các bài toán khả quyết thì giải nhanh được đến đâu, qua độ phức tạp theo máy Turing, và hai lớp P, NP. Hẹn gặp bạn ở bài tiếp theo."
