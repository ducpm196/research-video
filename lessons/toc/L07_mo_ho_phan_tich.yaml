id: L07
course: TOC
series: "TOC · Lý thuyết tính toán"
title: "Bài 7 — Văn phạm mơ hồ và phân tích cú pháp biểu thức"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L07; audit/toc/verify_toc.py L07; A. Aho, M. Lam, R. Sethi, J. Ullman, Compilers (2nd ed.), mục 2.2, 4.2; D. Cantor (1962) — tính mơ hồ không khả quyết"
assumes: [arith, sub, alpha, prod, alt, derive, dots]
# Quy ước: “số” là ký hiệu kết thúc cho một chữ số; phép nhân viết × (cả công thức và hình cây). Giá trị của MỌI cây do
#   alg.bracket_values tính (số cây = số Catalan); văn phạm phân tầng được đếm cây bằng quy hoạch động trong verify_toc.py (đúng 1 cây).
objectives:
  - "Nhận ra văn phạm mơ hồ: một chuỗi có hai cây suy dẫn"
  - "Khử mơ hồ bằng phân tầng: ưu tiên và tính kết hợp"
  - "Hiểu vì sao trình biên dịch không được đoán ý"
asr_reviewed:
  - {sentence: "Bước hai, biến T bên phải phải sinh ra 2 nhân 3, nên dùng quy tắc T sinh ra T nhân F.", reason: "ASR chép “Bước 2, biến tệ bên phải phải sinh ra 2 nhân 3, nền dùng quy tắc t sinh ra t nhân f.” (0.909): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: nên/nền — NOT_VERIFIED bằng tai người"}
  - {sentence: "Biến T đầu tiên đi qua F để ra số 2.", reason: "ASR chép “Biến tây đầu tiên đi qua F để ra số 2.” (0.909): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Biến T lo phép nhân.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "1 + 2 × 3 bằng mấy?"
    checks:
      - "sorted(alg.bracket_values([1, 2, 3], '+*')) == [7, 9]"
    steps:
      - show: |
          <p>Máy tính bỏ túi nói $1 + 2 \times 3 = 7$. Nhưng nếu ta cộng trước thì được $9$.</p>
          <p>Trình biên dịch đọc chuỗi ký tự, không đọc được ý người viết. Cái gì quyết định nó tính ra 7?</p>
          <div class="box key">Hôm nay: văn phạm mơ hồ — một chuỗi, hai cây suy dẫn — và cách viết văn phạm để chỉ có <b>một</b> cây.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, máy tính bỏ túi nói 1 cộng 2 nhân 3 bằng 7. Nhưng nếu ta cộng trước thì được 9. Trình biên dịch chỉ đọc chuỗi ký tự, nó không đọc được ý người viết. Vậy cái gì quyết định nó tính ra 7? Hôm nay ta học văn phạm mơ hồ, khi một chuỗi có hai cây suy dẫn, và cách viết văn phạm để chỉ có một cây."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: thứ tự tính, cây suy dẫn, dãy 1, 1, 2, 5, 14"
    checks:
      - "2 * 3 == 6 and 1 + 6 == 7 == 1 + 2 * 3"
      - "1 + 2 == 3 and 3 * 3 == 9 == (1 + 2) * 3"
      - "8 - 3 == 5 and 5 - 2 == 3 == 8 - 3 - 2"
      - "'S'.replace('S', '0S1').replace('S', '0S1').replace('S', '') == '0011'"
      - "[sum(alg.balanced(w) for w in alg.strings('()', 2 * n, exact=True)) for n in range(5)] == [1, 1, 2, 5, 14]"
    steps:
      - show: |
          <table class="t"><tr><th>biểu thức</th><th>quy ước</th><th>giá trị</th></tr>
          <tr><td>$1 + 2 \times 3$</td><td>nhân trước: $2 \times 3 = 6$, rồi $1 + 6$</td><td>7</td></tr>
          <tr><td>$(1 + 2) \times 3$</td><td>ngoặc trước: $1 + 2 = 3$, rồi $3 \times 3$</td><td>9</td></tr>
          <tr><td>$8 - 3 - 2$</td><td>trừ từ trái sang: $8 - 3 = 5$, rồi $5 - 2$</td><td>3</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn ba quy ước tính mà bài này cần. Không có ngoặc thì nhân trước, 2 nhân 3 bằng 6, rồi 1 cộng 6 bằng 7. Có ngoặc thì tính trong ngoặc trước, 1 cộng 2 bằng 3, rồi 3 nhân 3 bằng 9. Phép trừ liên tiếp tính từ trái sang, 8 trừ 3 bằng 5, rồi 5 trừ 2 bằng 3."
      - show: |
          <p>Ở bài 6: cây suy dẫn có gốc là biến bắt đầu, các con của một nút là vế phải của quy tắc đã dùng, đọc lá từ trái sang phải được chuỗi.</p>
          $$S \Rightarrow 0S1 \Rightarrow 00S11 \Rightarrow 0011$$
        focus: [1, 1, 2]
        say: "Ở bài 6, ta đã vẽ cây suy dẫn, gốc là biến bắt đầu, và các con của một nút là vế phải của quy tắc đã dùng ở nút đó. Đọc các lá từ trái sang phải thì được đúng chuỗi đã suy dẫn. Ví dụ với văn phạm S sinh ra 0 S 1 hoặc chuỗi rỗng, hai lần dùng quy tắc đầu rồi xoá S cho chuỗi 0 0 1 1."
      - show: |
          <table class="t"><tr><th>số cặp ngoặc</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>số chuỗi ngoặc cân bằng</td><td>1</td><td>1</td><td>2</td><td>5</td><td>14</td></tr></table>
        say: "Cũng ở bài 6, ta đếm số chuỗi ngoặc cân bằng theo số cặp ngoặc, được dãy 1, 1, 2, 5, 14, gọi là dãy số Catalan. Hôm nay dãy số này sẽ xuất hiện lại khi ta đếm số cây của một biểu thức."

  - id: sym
    kind: symbol
    title: "Giải mã: văn phạm mơ hồ"
    steps:
      - show: |
          <p>Văn phạm biểu thức đơn giản nhất: $E \to E + E \mid E \times E \mid \text{số}$.</p>
          <div class="box key">Văn phạm <b>mơ hồ</b> nếu có một chuỗi có <b>hai cây suy dẫn khác nhau</b>. Cây quyết định thứ tự tính: nút nằm sâu hơn được tính trước.</div>
        focus: [1, 2, 2]
        say: "Xét văn phạm biểu thức đơn giản nhất, E sinh ra E cộng E, hoặc E nhân E, hoặc một số. Một văn phạm gọi là mơ hồ nếu có một chuỗi có hai cây suy dẫn khác nhau. Cây quyết định thứ tự tính, nút nằm sâu hơn thì được tính trước."

  # ───────────────────────── 3. HAI CÂY ─────────────────────────
  - id: trees
    kind: concept
    title: "Một chuỗi, hai cây, hai giá trị"
    checks:
      - "sorted(alg.bracket_values([1, 2, 3], '+*')) == [7, 9]"
      - "(1 + 2) * 3 == 9 and 1 + (2 * 3) == 7"
    steps:
      - show: |
          <div style="display:flex;gap:40px"><div><svg width="520" height="356" viewBox="0 0 520 356"><line x1="40" y1="240" x2="40" y2="294" stroke="#9ca3af" stroke-width="3"/><line x1="150" y1="148" x2="40" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="150" y1="148" x2="150" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="260" y1="240" x2="260" y2="294" stroke="#9ca3af" stroke-width="3"/><line x1="150" y1="148" x2="260" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="333" y1="56" x2="150" y2="110" stroke="#9ca3af" stroke-width="3"/><line x1="333" y1="56" x2="370" y2="110" stroke="#9ca3af" stroke-width="3"/><line x1="480" y1="148" x2="480" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="333" y1="56" x2="480" y2="110" stroke="#9ca3af" stroke-width="3"/><text x="40" y="326" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="40" y="234" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="150" y="234" font-size="32" font-weight="700" text-anchor="middle">+</text><text x="260" y="326" font-size="32" font-weight="700" text-anchor="middle">2</text><text x="260" y="234" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="150" y="142" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="370" y="142" font-size="32" font-weight="700" text-anchor="middle">×</text><text x="480" y="234" font-size="32" font-weight="700" text-anchor="middle">3</text><text x="480" y="142" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="333" y="50" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text></svg><p>gốc là phép nhân: $(1 + 2) \times 3 = \hl{9}$</p></div>
          <div><svg width="520" height="356" viewBox="0 0 520 356"><line x1="40" y1="148" x2="40" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="187" y1="56" x2="40" y2="110" stroke="#9ca3af" stroke-width="3"/><line x1="187" y1="56" x2="150" y2="110" stroke="#9ca3af" stroke-width="3"/><line x1="260" y1="240" x2="260" y2="294" stroke="#9ca3af" stroke-width="3"/><line x1="370" y1="148" x2="260" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="370" y1="148" x2="370" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="480" y1="240" x2="480" y2="294" stroke="#9ca3af" stroke-width="3"/><line x1="370" y1="148" x2="480" y2="202" stroke="#9ca3af" stroke-width="3"/><line x1="187" y1="56" x2="370" y2="110" stroke="#9ca3af" stroke-width="3"/><text x="40" y="234" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="40" y="142" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="150" y="142" font-size="32" font-weight="700" text-anchor="middle">+</text><text x="260" y="326" font-size="32" font-weight="700" text-anchor="middle">2</text><text x="260" y="234" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="370" y="234" font-size="32" font-weight="700" text-anchor="middle">×</text><text x="480" y="326" font-size="32" font-weight="700" text-anchor="middle">3</text><text x="480" y="234" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="370" y="142" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text><text x="187" y="50" font-size="32" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic">E</text></svg><p>gốc là phép cộng: $1 + (2 \times 3) = \hl{7}$</p></div></div>
        focus: ["1.1", "1.2", 1]
        say: "Cây bên trái có gốc là phép nhân, nên phép cộng nằm sâu hơn và được tính trước, 1 cộng 2 bằng 3, nhân 3 được 9. Cây bên phải có gốc là phép cộng, phép nhân nằm sâu hơn, 2 nhân 3 bằng 6, cộng 1 được 7. Cùng một chuỗi ký tự mà hai cây cho hai giá trị, nên văn phạm này mơ hồ."

  # ───────────────────────── 4. KHỬ MƠ HỒ ─────────────────────────
  - id: example
    kind: example
    title: "Phân tầng: mỗi mức ưu tiên một biến"
    checks:
      - "eval('1+2*3') == 7"
      - "sorted(alg.bracket_values([8, 3, 2], '--')) == [3, 7] and eval('8-3-2') == 3"
      - "2 * 3 == 6 and 1 + 6 == 7"
      - "8 - 3 == 5 and 5 - 2 == 3 and 8 - (3 - 2) == 7"
    steps:
      - show: |
          <p>$E \to E + T \mid E - T \mid T$ <span class="note">(mức cộng trừ)</span></p>
          <p>$T \to T \times F \mid F$ <span class="note">(mức nhân)</span></p>
          <p>$F \to \text{số} \mid (E)$ <span class="note">(số hoặc ngoặc)</span></p>
          <div class="box key">Phép nhân chỉ sinh được ở <b>dưới</b> $T$, nên luôn nằm sâu hơn phép cộng → được tính trước. Không còn cây thứ hai.</div>
        focus: [1, 2, 3, 4, 4]
        say: "Cách khử mơ hồ là phân tầng, mỗi mức ưu tiên dùng một biến riêng. Biến E lo phép cộng và trừ. Biến T lo phép nhân. Biến F là một số, hoặc một biểu thức trong ngoặc. Phép nhân chỉ sinh được ở dưới T, nên luôn nằm sâu hơn phép cộng trong cây, và được tính trước, không còn cây thứ hai."
      - clear: true
        show: |
          <p><b>Bước 1</b> — suy dẫn $1 + 2 \times 3$, luôn thay biến đứng đầu tiên. Nửa trái ra số 1:</p>
          <table class="t"><tr><th>quy tắc dùng</th><th>kết quả</th></tr>
          <tr><td>$E \to E + T$</td><td>$E \Rightarrow E + T$</td></tr>
          <tr><td>$E \to T$, rồi $T \to F$</td><td>$\Rightarrow T + T \Rightarrow F + T$</td></tr>
          <tr><td>$F \to 1$</td><td>$\Rightarrow 1 + T$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Với văn phạm mới, chuỗi 1 cộng 2 nhân 3 chỉ có một cách suy dẫn, nếu mỗi bước luôn thay biến đứng đầu tiên. Bước một, dấu cộng ở ngoài cùng nên phải dùng quy tắc E sinh ra E cộng T trước tiên. Biến E bên trái chỉ cần ra số 1, nên đi qua T rồi F. Cuối cùng biến F sinh ra số 1, và nửa trái xong."
      - show: |
          <p><b>Bước 2</b> — nửa phải $T$ phải ra $2 \times 3$:</p>
          <table class="t"><tr><th>quy tắc dùng</th><th>kết quả</th></tr>
          <tr><td>$T \to T \times F$</td><td>$\Rightarrow 1 + T \times F$</td></tr>
          <tr><td>$T \to F$, rồi $F \to 2$</td><td>$\Rightarrow 1 + F \times F \Rightarrow 1 + 2 \times F$</td></tr>
          <tr><td>$F \to 3$</td><td>$\Rightarrow 1 + 2 \times 3$</td></tr></table>
        focus: ["2.2", "2.3", "2.4"]
        say: "Bước hai, biến T bên phải phải sinh ra 2 nhân 3, nên dùng quy tắc T sinh ra T nhân F. Biến T đầu tiên đi qua F để ra số 2. Biến F còn lại ra số 3, và chuỗi hết biến."
      - clear: true
        show: |
          <p><b>Bước 3</b> — tính từ nút sâu nhất: phép nhân nằm dưới $T$.</p>
          $$2 \times 3 = 6$$
        focus: [1, 2]
        say: "Bước ba, tính giá trị theo cây, nút nằm sâu nhất là phép nhân dưới biến T. Vì vậy tính 2 nhân 3 trước, bằng 6."
      - show: |
          <p><b>Bước 4</b> — lên gốc, phép cộng:</p>
          $$1 + 6 = \hl{7}$$
        focus: [1, 2]
        say: "Bước bốn, đi lên gốc là phép cộng, 1 cộng 6 bằng 7. Cây duy nhất của chuỗi cho giá trị 7, đúng như máy tính bỏ túi."
      - show: |
          <p><b>Bước 5</b> — tính kết hợp: $E \to E - T$ đặt $E$ bên <b>trái</b>, nên $8 - 3$ nằm sâu hơn.</p>
          $$(8 - 3) - 2 = 5 - 2 = \hl{3}$$
        focus: [1, 2, 2]
        say: "Bước năm, tính kết hợp, vì quy tắc E sinh ra E trừ T đặt E bên trái, nên 8 trừ 3 trừ 2 được nhóm thành 8 trừ 3 trước, bằng 5. Rồi lấy 5 trừ 2, được kết quả cuối cùng là 3. Nếu nhóm 3 trừ 2 trước thì sẽ ra 7, sai với quy ước."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đếm cây"
    checks:
      - "[len(alg.bracket_values(list(range(1, n + 2)), '+' * n)) for n in range(1, 5)] == [1, 2, 5, 14]"
      - "len(alg.bracket_values([1, 2, 3], '+*')) == 1 * 1 + 1 * 1 == 2"
      - "len(alg.bracket_values([1, 2, 3, 4], '+++')) == 1 * 2 + 1 * 1 + 2 * 1 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>kết quả</th></tr>
          <tr><td>Văn phạm mơ hồ, chuỗi có 1, 2, 3, 4 phép toán</td><td>$1, 2, 5, 14$ cây — dãy Catalan, mỗi cây là một cách đặt ngoặc</td></tr>
          <tr><td>Văn phạm phân tầng</td><td>máy đếm được <b>đúng một</b> cây cho mỗi biểu thức thử</td></tr>
          <tr><td>Chuỗi có cả cộng, nhân, trừ</td><td>giá trị theo cây trùng quy ước toán học</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng cách đếm cây. Một, với văn phạm mơ hồ, chuỗi có 1, 2, 3, 4 phép toán có 1, 2, 5, 14 cây, lại là dãy Catalan, vì mỗi cây là một cách đặt ngoặc đầy đủ. Hai, với văn phạm phân tầng, máy đếm được đúng một cây cho mỗi biểu thức thử. Ba, thử một chuỗi có cả cộng, nhân và trừ, giá trị theo cây phải trùng quy ước toán học."
      - clear: true
        show: |
          <p>Đếm cây bằng tay: chọn phép toán nằm ở <b>gốc</b>, rồi nhân số cây của hai bên.</p>
          <table class="t"><tr><th>chuỗi</th><th>phép toán ở gốc</th><th>cây bên trái × cây bên phải</th><th>số cây</th></tr>
          <tr><td>$1 + 2 \times 3$</td><td>$+$ hoặc $\times$</td><td>$1 \times 1 + 1 \times 1$</td><td>2</td></tr>
          <tr><td>3 phép toán</td><td>thứ nhất, thứ hai, thứ ba</td><td>$1 \times 2 + 1 \times 1 + 2 \times 1$</td><td>5</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Bây giờ đếm lại số cây bằng tay, theo một đường khác. Mỗi cây có đúng một phép toán ở gốc, nên ta chọn phép toán ở gốc rồi nhân số cây của hai bên. Chuỗi 1 cộng 2 nhân 3 có hai lựa chọn gốc, mỗi bên chỉ có một số hoặc một phép toán, nên có 1 cộng 1 bằng 2 cây. Chuỗi có ba phép toán thì gốc là phép thứ nhất, thứ hai hoặc thứ ba, cho 2 cộng 1 cộng 2 bằng 5 cây, khớp với số máy đếm."
  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.cfg_lang({'E': ['E+E', 'E*E', 'n']}, 'E', 9) == alg.cfg_lang({'E': ['E+T', 'T'], 'T': ['T*F', 'F'], 'F': ['n']}, 'E', 9)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ trình biên dịch tự hiểu ý <b class="red">(sai)</b>
          <br><span class="note">Nó chỉ làm theo văn phạm. Ưu tiên và kết hợp phải được <b>viết vào</b> văn phạm hoặc bảng ưu tiên.</span></div>
        say: "Lỗi thứ nhất, nghĩ trình biên dịch tự hiểu ý người viết. Nó chỉ làm theo văn phạm, nên ưu tiên và tính kết hợp phải được viết vào văn phạm, hoặc vào bảng ưu tiên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ mơ hồ là tính chất của ngôn ngữ <b class="red">(thường sai)</b>
          <br><span class="note">Bỏ phép trừ và ngoặc khỏi văn phạm phân tầng, nó sinh <b>đúng cùng</b> tập chuỗi với văn phạm mơ hồ (máy kiểm tới độ dài 9), nhưng không mơ hồ. Mơ hồ là tính chất của <b>văn phạm</b>.</span></div>
        say: "Lỗi thứ hai, nghĩ mơ hồ là tính chất của ngôn ngữ. Bỏ phép trừ và ngoặc khỏi văn phạm phân tầng, nó sinh đúng cùng tập chuỗi với văn phạm mơ hồ, nhưng không mơ hồ, nên mơ hồ thường là tính chất của văn phạm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Viết $E \to T - E$ (đệ quy bên phải) <b class="red">(sai kết hợp)</b>
          <br><span class="note">Khi đó $8 - 3 - 2$ được nhóm thành $8 - (3 - 2) = 7$. Phép trừ cần đệ quy bên <b>trái</b>.</span></div>
          <table class="t"><tr><th>văn phạm</th><th>cách nhóm</th><th>giá trị</th></tr>
          <tr><td>$E \to E - T$ (đệ quy trái)</td><td>$(8 - 3) - 2$</td><td>3</td></tr>
          <tr><td>$E \to T - E$ (đệ quy phải)</td><td>$8 - (3 - 2)$</td><td>7</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ ba, đặt E bên phải dấu trừ, tức đệ quy bên phải. Khi đó 8 trừ 3 trừ 2 được nhóm thành 8 trừ kết quả của 3 trừ 2, bằng 7. Phép trừ cần đệ quy bên trái."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Thử vài chuỗi rồi kết luận văn phạm không mơ hồ <b class="red">(chưa đủ)</b>
          <br><span class="note">Không có thuật toán nào kiểm được mọi văn phạm có mơ hồ hay không (Cantor, 1962). Phải lập luận theo cấu trúc, như phân tầng ở trên.</span></div>
        say: "Lỗi thứ tư, thử vài chuỗi rồi kết luận văn phạm không mơ hồ. Đã có chứng minh từ năm 1962 rằng không có thuật toán nào kiểm được mọi văn phạm có mơ hồ hay không, nên phải lập luận theo cấu trúc, như cách phân tầng ở trên."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len(alg.bracket_values([2, 3, 4, 5], '*+*')) == 5"
      - "sorted(set(alg.bracket_values([2, 3, 4, 5], '*+*'))) == [26, 46, 50, 70]"
      - "eval('2*3+4*5') == 26"
      - "[((2 * 3) + 4) * 5, (2 * (3 + 4)) * 5, (2 * 3) + (4 * 5), 2 * ((3 + 4) * 5), 2 * (3 + (4 * 5))] == [50, 70, 26, 70, 46] and sorted([50, 70, 26, 70, 46]) == sorted(alg.bracket_values([2, 3, 4, 5], '*+*'))"
      - "(6 + 4) * 5 == 50 and 14 * 5 == 70 and 2 * 35 == 70 and 2 * 23 == 46 and len({50, 70, 26, 46}) == 4"
      - "2 * 3 == 6 and 4 * 5 == 20 and 6 + 20 == 26"
    steps:
      - show: |
          <p>Chuỗi $2 \times 3 + 4 \times 5$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Với văn phạm mơ hồ $E \to E + E \mid E \times E \mid \text{số}$: có bao nhiêu cây, cho những giá trị nào?</td></tr>
          <tr><td>2</td><td>Với văn phạm phân tầng: giá trị là bao nhiêu?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Xét chuỗi 2 nhân 3 cộng 4 nhân 5. Câu một, với văn phạm mơ hồ, chuỗi này có bao nhiêu cây suy dẫn, và cho những giá trị nào? Câu hai, với văn phạm phân tầng, giá trị là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Ba phép toán: $\hl{5}$ cây, mỗi cây một cách đặt ngoặc:</p>
          <table class="t"><tr><th>cách đặt ngoặc</th><th>tính</th><th>giá trị</th></tr>
          <tr><td>$((2 \times 3) + 4) \times 5$</td><td>$(6 + 4) \times 5$</td><td>50</td></tr>
          <tr><td>$(2 \times (3 + 4)) \times 5$</td><td>$14 \times 5$</td><td>70</td></tr>
          <tr><td>$(2 \times 3) + (4 \times 5)$</td><td>$6 + 20$</td><td>26</td></tr>
          <tr><td>$2 \times ((3 + 4) \times 5)$</td><td>$2 \times 35$</td><td>70</td></tr>
          <tr><td>$2 \times (3 + (4 \times 5))$</td><td>$2 \times 23$</td><td>46</td></tr></table>
        focus: [1, 2, 2, 2]
        say: "Đáp án câu một, ba phép toán cho 5 cây, với các giá trị 26, 46, 50 và 70, trong đó hai cây khác nhau cùng cho 70. Cả hai cây đó đều cộng 3 với 4 trước. Bảng tính từng cây, từ ngoặc trong cùng ra ngoài. Vậy có 5 cây nhưng chỉ có 4 giá trị khác nhau."
      - clear: true
        show: |
          <p>② Phân tầng: hai phép nhân nằm dưới phép cộng.</p>
          $$2 \times 3 = 6 \qquad 4 \times 5 = 20 \qquad 6 + 20 = \hl{26}$$
        focus: [1, 2, 2]
        say: "Câu hai, với văn phạm phân tầng, hai phép nhân nằm dưới phép cộng, nên được tính trước. 2 nhân 3 bằng 6, 4 nhân 5 bằng 20. Rồi 6 cộng 20 bằng 26, trùng với cây thứ ba trong bảng của câu một."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cây quyết định thứ tự tính</span><span class="a">→</span>
          <span class="n">hai cây = mơ hồ</span><span class="a">→</span>
          <span class="n">phân tầng theo ưu tiên</span><span class="a">→</span>
          <span class="n">đệ quy trái = kết hợp trái</span></div>
        say: "Tổng kết lại, cây suy dẫn quyết định thứ tự tính, một chuỗi có hai cây thì văn phạm mơ hồ. Ta khử mơ hồ bằng cách phân tầng theo mức ưu tiên, và đệ quy bên trái cho kết hợp trái."
      - show: |
          <div class="box key"><b>Tư duy:</b> mọi quy ước “hiển nhiên” (nhân trước cộng sau) đều phải được viết thành luật thì máy mới làm theo.</div>
        say: "Điều cần mang theo, mọi quy ước có vẻ hiển nhiên, như nhân trước cộng sau, đều phải được viết thành luật thì máy mới làm theo."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): máy nào nhận được ngôn ngữ của văn phạm? <b>Ôtômat đẩy xuống</b> — ôtômat hữu hạn có thêm một ngăn xếp.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta hỏi máy nào nhận được ngôn ngữ của văn phạm, và học ô-tô-mát đẩy xuống, tức ô-tô-mát hữu hạn có thêm một ngăn xếp. Hẹn gặp bạn ở bài tiếp theo."
